id: HEB.9.22
reference: Hebrews 9:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ σχεδὸν ἐν αἵματι πάντα καθαρίζεται κατὰ τὸν νόμον, καὶ χωρὶς αἱματεκχυσίας οὐ γίνεται ἄφεσις.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/022.yaml
  text: And according to the law[a], almost everything is cleansed with blood, and without the shedding of blood there is no forgiveness.
translation:
  language: ig
  text: Dị ka Iwu ahụ si dị, ọ fọrọ nke nta ka ọ bụrụ na e ji ọbara eme ka ihe niile dị ọcha; na-enweghị ịwụfu ọbara, mgbaghara[a] adịghị adị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ntọhapụ.” Okwu Grik a pụrụ ịpụta ịtọhapụ mmadụ ma ọ bụ ịgbaghara ya; n’ebe a, ọ na-ezo aka ná mgbaghara mmehie.
    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: ọ fọrọ nke nta ka ọ bụrụ
  rationale: 'Nke a na-edobe mmachi onye dere ya tinyere n’okwu ahụ: ọ bụghị ihe niile kpamkpam ka e ji ọbara mee ka ha dị ọcha n’okpuru Iwu ahụ.'
- source_word: ἐν αἵματι
  choice: a na-eji ọbara
  rationale: ἐν nwere ọrụ nke igosi ihe e ji rụọ ọrụ n’ebe a; nsụgharị a bụ Igbo doro anya ma na-edobe ọbara dị ka ihe e ji eme ka ihe dị ọcha n’emume.
- source_word: πάντα
  choice: ihe niile
  rationale: Ụdị neuter plural a na-ekwu n’ozuzu ya banyere ihe na ihe omume emume ndị a na-atụle; okwu σχεδόν ka na-egbochi ya ịpụta ihe niile n’enweghị ihe fọdụrụ.
- source_word: καθαρίζεται
  choice: eme ka ... dị ọcha
  rationale: Nke a na-egosi omume a na-emekarị n’okpuru Iwu ahụ ma na-edobe echiche nke ime ka ihe dị ọcha n’usoro emume.
- source_word: κατὰ τὸν νόμον
  choice: Dị ka Iwu ahụ si dị
  rationale: κατά na-egosi ime ihe n’usoro ma ọ bụ n’ụzọ Iwu Mozis kwuru; ‘dị ka ... si dị’ bụ Igbo ebumpụta ụwa ma ghara ịgbakwụnye nkọwa ọzọ.
- source_word: χωρὶς
  choice: ma ọ bụrụ na ... ghị
  rationale: N’ahịrịokwu a, usoro ọnọdụ a na-egosipụta n’ụzọ Igbo doro anya na mgbaghara adịghị ma ọbara a wụfughị, ma na-edobe echiche privative nke χωρὶς.
- source_word: αἱματεκχυσίας
  choice: a wụfughị ọbara
  rationale: Okwu a pụtara ịwụpụ ma ọ bụ ịwụfu ọbara, karịchaa n’ọnọdụ àjà; nsụgharị a na-edobe ụda àjà ahụ ma bụrụ Igbo a na-aghọta ngwa ngwa.
- source_word: οὐ γίνεται
  choice: adịghị adị
  rationale: γίνεται tinyere aha echiche ἄφεσις na-egosi na mgbaghara anaghị abịa ma ọ bụ adịghị; ‘adịghị adị’ na-enye okwu ahụ n’ụzọ dị mkpirikpi ma doo anya.
- source_word: ἄφεσις
  choice: mgbaghara
  rationale: N’ọnọdụ àjà nke amaokwu a, okwu ahụ na-ezo aka n’ịgbaghara mmehie. ‘Mgbaghara’ bụ okwu Igbo nke oge a, doro anya, na-enweghị ụda ochie ma ọ bụ nke otu ụka pụrụ iche.
theological_decisions:
- issue: Nsụgharị ἄφεσις n’ọnọdụ àjà
  choice: mgbaghara
  alternative: ntọhapụ
  rationale: ἄφεσις pụrụ ịpụta ịtọhapụ ma ọ bụ ịgbaghara, ma n’arụmụka ebe a banyere mmehie na ọbara àjà, ‘mgbaghara’ na-ekwupụta ihe a na-ekwu nke ọma n’enweghị itinye usoro ozizi nke otu chọọchị. E debere ‘ntọhapụ’ n’ala ala peeji dị ka ụzọ okwu ahụ nwekwara ike isi pụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Iwu ahụ’ na-ezo aka n’Iwu Mozis n’ụzọ okwu gbara ya gburugburu si gosi. E tinyere akara ala ala peeji ozugbo n’akụkụ ‘mgbaghara,’ bụ́ okwu ọ na-akọwa.
