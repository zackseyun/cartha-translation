  text: λογισάμενος ὅτι καὶ ἐκ νεκρῶν ἐγείρειν δυνατὸς ὁ θεός· ὅθεν αὐτὸν καὶ ἐν παραβολῇ ἐκομίσατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/019.yaml
  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: ig
  text: Ọ tụlere na Chineke pụrụ ọbụna ime ka ndị nwụrụ anwụ bilie; n’ihi nke a, o natakwara ya azụ n’ụzọ ihe atụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ụzọ nnọchianya” ma ọ bụ “dịka ilu.” Ebreham natara Aịzik azụ dịka onye a napụtara n’ọnwụ; Aịzik ebilighị n’ọnwụ n’ezie.
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισάμενος
  choice: Ọ tụlere
  rationale: Nke a na-egosi echiche na ntụgharị uche Ebreham mere n’obi ya, n’asụsụ Igbo dị mfe ma dị ùgwù.
- source_word: ἐκ νεκρῶν ἐγείρειν
  choice: ime ka ndị nwụrụ anwụ si n’ọnwụ bilie
  rationale: Nke a bụ ụzọ Igbo doro anya si akọwa mbilite n’ọnwụ, ma na-edobe ọtụtụ mmadụ dị na νεκρῶν.
- source_word: δυνατὸς ὁ θεός
  choice: Chineke pụrụ
  rationale: Ọ na-edobe okwu Grik n’oge ugbu a ma na-ekwupụta ike Chineke nkenke.
- source_word: ὅθεν
  choice: n’ebe ahụ
  rationale: Ọ na-edobe nghọta nke isi ebe ma ọ bụ ebe e si pụta dị na okwu ahụ, kama ịgbanwe ya kpamkpam ka ọ bụrụ naanị nkwubi okwu.
- source_word: ἐν παραβολῇ
  choice: n’ụzọ ihe atụ
  rationale: Ọ na-egosi na Ebreham nataghachiri Aịzik dịka onye si n’ọnwụ lọta, ọ bụghị site ná mbilite n’ọnwụ n’ezie.
- source_word: ἐκομίσατο
  choice: o si nataghachi ya
  rationale: Ngwaa a n’ọnọdụ a pụtara ịnata Aịzik azụ mgbe ọ fọrọ obere ka e jiri ya chụọ àjà.
- source_word: καὶ
  choice: ọ bụkwa
  rationale: Ọ na-edobe ọrụ mgbakwunye nke καὶ nke abụọ n'ụzọ Igbo na-aga nke ọma.
theological_decisions:
- issue: Ụdị Ebreham si nataghachi Aịzik
  choice: Ebreham nataghachiri Aịzik n’ụzọ ihe atụ, dịka a ga-asị na o si n’ọnwụ lọta.
  alternative: A pụrụ ịsụgharị ya ‘dịka ilu’ ma mesie ọrụ Aịzik dịka ihe nnọchianya ike.
  rationale: ἐν παραβολῇ na-egosi myirịta na mbilite n’ọnwụ, ọ bụghị na Aịzik nwụrụ ma bilite n’ọnwụ n’ezie. Nsụgharị ahụ edobere ihe atụ ahụ n’enweghị ịkọwapụta ozizi karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ya. ‘N’ụzọ ihe atụ’ bụ okwu ndị nkịtị ga-aghọta nke na-edobekwa nghọta ἐν παραβολῇ. E debere aha Aịzik na nkọwa ala peeji kama itinye ya n’ahịrị bụ isi, ebe Grik jiri nnọchiaha αὐτόν.
