  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔσβεσαν δύναμιν πυρός, ἔφυγον στόματα ⸀μαχαίρης, ⸀ἐδυναμώθησαν ἀπὸ ἀσθενείας, ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ, παρεμβολὰς ἔκλιναν ἀλλοτρίων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/034.yaml
  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: ig
  text: menyụrụ ike ọkụ, gbapụrụ nkọ mma agha[a], e mere ka ha sie ike site n’adịghị ike, ghọrọ ndị dị ike n’agha, chụpụrụ usuu ndị mba ọzọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ọnụ mma agha.” Nke a bụ okwu atụ nke pụtara akụkụ nkọ mma agha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ogige ndị agha”; okwu Grik ahụ pụtara ogige, ma n’ebe a ọ na-ezo aka n’usuu agha nọ n’ogige ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσβεσαν
  choice: menyụọ
  rationale: Ngwaa a na-egosi imenyụ ma ọ bụ ịkwụsị ọkụ; ‘menyụọ’ na-edobe ihe atụ doro anya nke Grik.
- source_word: δύναμιν πυρός
  choice: ike ọkụ
  rationale: Nke a na-edobe δύναμις, ya bụ ike ma ọ bụ mmetụta ọkụ, kama ịsụgharị ya naanị dịka ‘ọkụ.’
- source_word: ἔφυγον στόματα μαχαίρης
  choice: gbanahụ ọnụ mma agha
  rationale: ‘Gbanahụ’ na-egosi na ha zọpụtara onwe ha; ‘ọnụ mma agha’ na-edobe okwu atụ nke Grik nke pụtara akụkụ mma agha na-egbu mmadụ.
- source_word: ἐδυναμώθησαν ἀπὸ ἀσθενείας
  choice: e mee ka ha sie ike site n’adịghị ike
  rationale: Nhazi a na-edobe passive nke ἐδυναμώθησαν—e nyere ha ike—nakwa echiche nke isi n’ọnọdụ adịghị ike pụta.
- source_word: ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ
  choice: ghọọ ndị dị ike n’agha
  rationale: ‘Ghọọ’ na-egosi ịbanye n’ọnọdụ ọhụrụ, ebe ‘n’agha’ bụ nsụgharị dabara adaba n’ọnọdụ a.
- source_word: παρεμβολὰς ἔκλιναν ἀλλοτρίων
  choice: chụlaa usuu ndị mba ọzọ
  rationale: παρεμβολή pụtara n'ụzọ nkịtị ogige ndị agha, ma n’ebe a ọ na-anọchi anya usuu agha; ἔκλιναν na-egosi ime ka ha tụgharịa azụ ma ọ bụ gbapụ.
theological_decisions:
- issue: Ma a ga-eme ka ihe oyiyi nke nzọpụta na mmeri bụrụ ihe ime mmụọ n’ozuzu ya
  choice: Idobe ọkụ, mma agha, adịghị ike, agha, na usuu ndị mba ọzọ dịka ihe doro anya
  alternative: Ịkọwa ha dịka mmeri ime mmụọ ma ọ bụ mmeri n’elu ihe isi ike n’ozuzu
  rationale: Amaokwu ahụ na-agụpụta omume na ihe ize ndụ ndị doro anya n’akụkọ ndị okwukwe; nsụgharị ekwesịghị ịgbanwe ha ka ha bụrụ nanị ihe atụ ime mmụọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. Ahịrịokwu ndị ahụ dị n’usoro ngwaa nke amaokwu Grik. E debere ‘ọnụ mma agha’ n’ederede iji chekwaa ihe oyiyi mbụ, tinyekwa nkọwa ala peeji; e ji ‘usuu ndị mba ọzọ’ mee ka ihe ndị agha a na-ekwu ghọta nke ọma.
