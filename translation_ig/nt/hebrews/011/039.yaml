base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/039.yaml
  text: And all these[a], though commended through faith, did not receive the promise[b],
translation:
  language: ig
  text: Ndị a niile, n’agbanyeghị na e gbara ha àmà ọma site n’okwukwe,[a] anataghị nkwa ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’agbanyeghị na a nabatara ha,” ma ọ bụ, “n’agbanyeghị na a gbara ha àmà.” Okwu Grik ahụ na-emesi ike na e gbara ndị a àmà ọma site n’okwukwe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ha enwetaghị nkwa ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάντες
  choice: Ndị a niile
  rationale: Ọ na-ezo aka ná ndị e depụtara tupu amaokwu a. N'Igbo, ịmalite n'ụzọ a na-eme ka njikọ ahụ doo anya n'ebughị okwu njikọ na-adịghị mkpa.
- source_word: μαρτυρηθέντες
  choice: ọ bụ ezie na e nyere ha ezi àmà
  rationale: Ụdị nnara ahụ na-egosi na e gbara ha ezi akaebe ma ọ bụ na ha nwetara nnabata. Nkebi 'ọ bụ ezie na' na-egosipụta ọdịiche dị n'etiti ezi àmà ahụ na anataghị ha nkwa ahụ, nke ọnọdụ okwu ahụ na-egosi.
- source_word: διὰ τῆς πίστεως
  choice: n’ihi okwukwe ha
  rationale: διά tinyere genitive na-egosi ụzọ ma ọ bụ ihe ndabere e ji nye ha ezi àmà. 'Okwukwe' bụ nsụgharị kwesịrị ekwesị nke πίστις n'ọnọdụ a; itinye 'ha' na-eme ka Igbo bụrụ nke doro anya.
- source_word: οὐκ ἐκομίσαντο
  choice: anataghị
  rationale: κομίζω n'ụdị middle ebe a pụtara inweta ma ọ bụ ịnara ihe e kwere ná nkwa. 'Anataghị' bụ Igbo nkịtị ma debe ihe okwu ahụ pụtara n'enweghị mgbasawanye.
- source_word: τὴν ἐπαγγελίαν
  choice: nkwa ahụ
  rationale: A na-edebe aha otu ahụ na definite article dịka 'nkwa ahụ,' kama ịkọwa ya dịka mmezu nkwa ma ọ bụ ihe e kwere ná nkwa.
theological_decisions:
- issue: Ihe 'nkwa ahụ' pụtara n'ọnọdụ a
  choice: nkwa ahụ
  alternative: ihe e kwere ná nkwa; mmezu nke nkwa ahụ
  rationale: Grik na-ahapụ okwu ahụ n'ụdị dị mkpirikpi, ebe amaokwu na-esote na-enyekwu nkọwa. Nsụgharị ahụ adịghị ekpebi ma ọ bụ nkwa ahụ n'onwe ya, ihe e kwere ná nkwa, ma ọ bụ mmezu ikpeazụ ya.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji 'ezi àmà' gosipụta favorable witness n'ụzọ okike, ma debe 'nkwa ahụ' n'ụdị kọmpat ya iji ghara idozi esemokwu nkọwa dị n'okwu Grik.
