id: HEB.11.31
reference: Hebrews 11:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πίστει Ῥαὰβ ἡ πόρνη οὐ συναπώλετο τοῖς ἀπειθήσασιν, δεξαμένη τοὺς κατασκόπους μετ’ εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: ig
  text: Site n’okwukwe, Rehab, nwanyị akwụna, esoghị ndị ahụ nupụrụ isi laa n’iyi[a], n’ihi na ọ nabatara ndị nledo ahụ n’udo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ya na ndị ahụ jụrụ irube isi alaghị n’iyi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’ịnabatara ndị nledo ahụ n’udo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Site n’okwukwe
  rationale: Ọ bụ dative nke ụzọ e si mee ihe; ntụgharị a na-egosi na okwukwe bụ ihe mere omume Rehab ji dị iche, ma kwekọọkwa n’usoro ihe atụ ndị dị na Ndị Hibru 11.
- source_word: Ῥαὰβ
  choice: Rehab
  rationale: E depụtara aha onye ahụ n’ụdị a na-ahụkarị ma dị mfe ọgụgụ n’Igbo.
- source_word: ἡ πόρνη
  choice: nwanyị akwụna
  rationale: Nke a na-egosipụta πόρνη n’enweghị ime ka okwu ahụ dị nro ma ọ bụ iji okwu ochie na-edochaghị anya.
- source_word: οὐ συναπώλετο
  choice: esoghị … laa n’iyi
  rationale: Ngwaa a nwere echiche nke ịla n’iyi ọnụ na ndị ọzọ; usoro Igbo a na-egosipụta echiche ‘perish together with’ nke ọma.
- source_word: τοῖς ἀπειθήσασιν
  choice: ndị ahụ nupụrụ isi
  rationale: ἀπειθέω n’ebe a na-egosi ekweghị isi ma ọ bụ nnupụisi. ‘Nupụrụ isi’ na-edowe akụkụ omume na nke uche dị n’okwu Grik ahụ.
- source_word: δεξαμένη
  choice: n’ihi na … nabata
  rationale: Aorist participle a na-akọ ọnọdụ ma ọ bụ ihe kpatara Rehab ji ghara ịla n’iyi. Isiokwu ahụ jiri ‘n’ihi na’ mee ka njikọ ahụ doo anya n’Igbo, ebe e debere ntụgharị nke na-adịchaghị akọwa njikọ ahụ n’ala ala peeji.
- source_word: τοὺς κατασκόπους
  choice: ndị nledo
  rationale: Nke a bụ okwu Igbo doro anya maka ndị e zigara iledo obodo ma nweta ozi na nzuzo.
- source_word: μετ’ εἰρήνης
  choice: ji udo
  rationale: Nke a na-egosi na Rehab nabatara ha n’udo, na-enweghị imegide ha, ma na-edowe ihe okwu Grik ahụ pụtara.
theological_decisions:
- issue: Ihe πίστις pụtara n’usoro ihe atụ ndị dị na Ndị Hibru 11
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N’usoro πίστει tinyere aha onye e ji maa atụ, ‘okwukwe’ bụ okwu kacha kwekọọ n’isiokwu dum. ‘Ntụkwasị obi’ metụtara ya, ma ‘ikwesị ntụkwasị obi’ nwere ike ime ka uche gaa n’àgwà mmadụ karịa n’okwukwe e ji mee ihe.
- issue: Njikọ δεξαμένη na ahịrịokwu bụ isi
  choice: n’ihi na o … nabata
  alternative: mgbe o … nabatara
  rationale: Participle ahụ nwere ike ịkọ ọnọdụ omume ahụ ma ọ bụ ihe kpatara nnapụta ya. Isiokwu họọrọ njikọ nke ihe kpatara ya n’ihi na ọ dabara n’usoro okwu ahụ, ma ala ala peeji na-edowe ntụgharị nke na-adịghị ekpebi njikọ ahụ ike.
translation_notes:
  register: E jiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Esoghị … laa n’iyi’ na-ebupụta echiche nke συναπόλλυμι n’ụzọ e si ekwu okwu n’Igbo; ‘nwanyị akwụna’ na-edowe ike okwu mbụ ahụ n’enweghị euphemism.
