revisions:
- from: Site n’okwukwe, Rehab nwanyị akwụna esoghị ndị ahụ nupụrụ isi laa n’iyi[a], n’ihi na o ji udo nabata ndị nledo ahụ.[b]
  to: Site n’okwukwe, Rehab, nwanyị akwụna, esoghị ndị ahụ nupụrụ isi laa n’iyi[a], n’ihi na ọ nabatara ndị nledo ahụ n’udo.[b]
  rationale: The revision preserves the source’s co-perishing sense, the explicit description of Rahab, and the conventional Hebrews 11 formula “Site n’okwukwe.” It makes the reception phrase idiomatic in Standard Igbo and adjusts the participial alternative so that it does not unnecessarily resolve the Greek participle as temporal. The main-text causal connection remains a defensible contextual rendering, consistent with the English POB audit trail.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:29:43Z'
review_pass:
  verdict: revise
  source_fidelity: The main clause accurately represents πίστει, ἡ πόρνη, οὐ συναπώλετο, and the ‘with those who disobeyed’ sense of τοῖς ἀπειθήσασιν. The causal rendering of the participle δεξαμένη is permissible in context and accords with the English audit trail. Rendering μετ’ εἰρήνης as “n’udo” more directly and idiomatically represents the Greek phrase than “ji udo.”
  naturalness: The revision uses natural contemporary Standard Igbo. Commas set off “nwanyị akwụna” as an appositional identification, and “nabatara … n’udo” is smoother than “ji udo nabata.”
  terminology: “okwukwe,” “nwanyị akwụna,” “ndị nledo,” and “nupụrụ isi” are suitable, clear equivalents. “Rehab” is retained as the established Igbo biblical form of Rahab.
  issues:
  - severity: low
    issue: The phrase “o ji udo nabata” is less idiomatic than “o nabatara … n’udo.”
    rationale: The latter places the manner phrase naturally with the act of welcoming and more transparently corresponds to μετ’ εἰρήνης.
  - severity: low
    issue: The alternative footnote for δεξαμένη uses “mgbe” (‘when’), which narrows the participle to a temporal relation.
    rationale: The Greek participle does not explicitly specify a temporal relation. An alternative using “site n’ịnabatara” better retains the participial/circumstantial force without imposing ‘when.’
  revised_text: Site n’okwukwe, Rehab, nwanyị akwụna, esoghị ndị ahụ nupụrụ isi laa n’iyi[a], n’ihi na ọ nabatara ndị nledo ahụ n’udo.[b]
