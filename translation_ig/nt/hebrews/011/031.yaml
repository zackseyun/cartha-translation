    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’ịnabatara ndị nledo ahụ n’udo.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the source’s co-perishing sense, the explicit description of Rahab, and the conventional Hebrews 11 formula “Site n’okwukwe.” It makes the reception phrase idiomatic in Standard Igbo and adjusts the participial alternative so that it does not unnecessarily resolve the Greek participle as temporal. The main-text causal connection remains a defensible contextual rendering, consistent with the English POB audit trail.
