  text: ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν, ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: ig
  text: N’ihi na ọ nọ na-echere obodo ahụ nwere ntọala[a], nke Chineke bụ onye haziri ya na onye wuru ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, ‘obodo ahụ nke nwere ntọala.’ Ụdị ọtụtụ nke okwu Grik ahụ nwere ike imesi ịdịgide na nkwụsi ike ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, ‘nke Chineke bụ onye chepụtara ya na onye mere ya.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: ọ nọ na-echere
  rationale: Na-egosi nchere na olileanya nke gara n’ihu n’oge gara aga, dịka imperfect Grik si dị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-egosi na amaokwu a na-akọwa ihe mere Ebreham ji biri dịka onye ọbịa n’amaokwu bu ya ụzọ.
- source_word: τοὺς θεμελίους ἔχουσαν πόλιν
  choice: obodo ahụ nke nwere ntọala
  rationale: Na-edobe nkọwa participle ahụ na ịdị kpọmkwem nke obodo ahụ, n’asụsụ Igbo dị mfe nghọta.
- source_word: θεμελίους
  choice: ntọala
  rationale: Okwu Igbo a na-ekwukarị maka ihe e ji guzobe ụlọ; n’Igbo, otu ụdị aha a nwere ike ịrụ ọrụ maka singular na plural, ya mere ọ naghị ewepụ echiche plural nke Grik.
- source_word: πόλιν
  choice: obodo
  rationale: Ọ bụ okwu Igbo nkịtị ma dabara adaba maka πόλις n’ebe a.
- source_word: ἧς
  choice: nke ... ya
  rationale: Usoro Igbo ebumpụta ụwa nke na-ejikọta obodo ahụ na ndị chepụtara ma wuo ya.
- source_word: τεχνίτης
  choice: onye chepụtara ya
  rationale: Na-egosipụta akụkụ nke atụmatụ na imepụta echiche, ma na-edobe ya iche na ọrụ iwu nke δημιουργός.
- source_word: δημιουργός
  choice: onye wuru ya
  rationale: Dabara n’onyonyo nke iwu obodo ma gosipụta onye mere ka atụmatụ ahụ bụrụ ihe e wuru.
- source_word: ὁ θεός
  choice: Chineke
  rationale: Nsụgharị Igbo a na-anabata nke ọma maka Chineke, onye bụ isiokwu nke nkebiokwu ahụ.
theological_decisions:
- issue: Ụdị obodo ahụ e kwere ná nkwa
  choice: obodo ahụ nke nwere ntọala
  alternative: obodo eluigwe; obodo nwere ntọala na-adịgide adịgide
  rationale: Amaokwu ahụ n’onwe ya anaghị akpọ ya ‘obodo eluigwe’ ma ọ bụ ‘Jerusalem ọhụrụ.’ Nsụgharị ahụ na-edobe onyonyo na nghọta ya n’ebughị nkọwa sitere n’amaokwu ndị ọzọ bata.
- issue: Mmekọrịta dị n’etiti τεχνίτης na δημιουργός
  choice: onye chepụtara ya na onye wuru ya
  alternative: onye haziri ya na onye mere ya
  rationale: Na-edobe ọrụ abụọ ahụ iche—ichepụta na iwu—n’enweghị itinye ozizi pụrụ iche n’okwu ndị ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E ji usoro ‘ọ nọ na-echere’ chekwaa omume gara n’ihu nke imperfect, ma zere ịkpọ obodo ahụ aha nkọwa nke amaokwu a na-ekwughị kpọmkwem.
