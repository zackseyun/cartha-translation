id: HEB.11.21
reference: Hebrews 11:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν, καὶ προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: ig
  text: Site n’okwukwe, Jekọb, mgbe ọ na-anwụ, gọziri onye ọ bụla n’ime ụmụ Josef, ma kpọọ isiala n’ofufe ka ọ na-adabere n’isi mkpara ya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ịgbaso ihe odide Hibru nke Jenesis 47:31, “ma kpọọ isiala n’ofufe n’elu isi ihe ndina ya.” Ihe odide Grik n’ebe a kwuru “mkpara.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “kpọọ isiala n’ofufe chere isi mkpara ya ihu.” O yikarịrị ka okwu a na-akọwa otú Jekọb si nọrọ fee ofufe, ọ bụghị na mkpara ahụ bụ ihe ọ na-efe.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Site n’okwukwe
  rationale: N’Hebru 11, okwu a na-egosi na ọ bụ okwukwe mere ka mmadụ mee ihe ahụ, ma ọ bụ na o ji okwukwe mee ya. Nsụgharị a bụ nke doro anya ma bụrụkwa nke a na-asụkarị n’Igbo.
- source_word: ἀποθνῄσκων
  choice: mgbe ọ na-anwụ
  rationale: Nke a na-egosi na ọnwụ Jekọb na-eru mgbe ọ gọziri ụmụ Josef; ọ na-edobe mmetụta nke participle dị ugbu a n’asụsụ Grik.
- source_word: ἕκαστον τῶν υἱῶν Ἰωσὴφ
  choice: onye ọ bụla n’ime ụmụ Josef
  rationale: 'Ọ na-edobe ike distributive nke ἕκαστον: Jekọb gọziri nwa nke ọ bụla n’otu n’otu.'
- source_word: εὐλόγησεν
  choice: gọziri
  rationale: Nke a bụ okwu Igbo kwesịrị ekwesị maka ịkpọsa ma ọ bụ inye ngọzi n’ọnọdụ a.
- source_word: προσεκύνησεν
  choice: kpọọ isiala n’ofufe
  rationale: Ọ na-ejikọta omume ahụ mmadụ ji kpọọ isiala na ihe ọ pụtara n’ebe a, ya bụ ofufe, n’etinyeghị onye a na-efe n’ahịrịokwu ebe Grik ekwughị ya kpọmkwem.
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: ka ọ na-adabere n’isi mkpara ya
  rationale: Nke a na-enye nghọta anụ ahụ nke okwu Grik ahụ n’Igbo dị mfe, ma na-ezere ime ka ọ dị ka a ga-asị na mkpara ahụ bụ ihe Jekọb na-efe.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ofufe Jekọb na mkpara ahụ
  choice: Jekọb kpọrọ isiala n’ofufe ka ọ na-adabere n’isi mkpara ya.
  alternative: Jekọb kpọrọ isiala n’ofufe n’elu isi ihe ndina ya; ma ọ bụ, Jekọb fee ofufe chere ihu n’isi mkpara ya.
  rationale: Ihe odide Grik nke Hebru kwuru ‘mkpara,’ ma ihe odide Hibru nke Jenesis 47:31 nwere ike ịpụta ‘ihe ndina.’ Ahịrịokwu bụ isi na-agbaso Grik nke Hebru ma ghara igosi na mkpara ahụ bụ ihe a na-efe; ihe ndị ọzọ nwere ike ịpụta dị na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Kpọọ isiala n’ofufe’ na-edobe ma mmegharị ahụ́ ma ihe okpukpe ọ pụtara; ‘isi mkpara’ na-egosipụta ἄκρον n’enweghị asụsụ siri ike ma ọ bụ nke ochie.
