  text: μᾶλλον ἑλόμενος συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ ἢ πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/025.yaml
  text: choosing rather to be mistreated with the people of God than to have the temporary enjoyment of sin,[a]
translation:
  language: ig
  text: ọ họọrọ ka e mesoo ya na ndị Chineke ọnụ mmeso ọjọọ, karịa inwe anụrị nke mmehie nke na-adịru naanị nwa oge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ụtọ mmehie nke na-agafe ngwa ngwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μᾶλλον ἑλόμενος
  choice: ọ họọrọ ... kama
  rationale: Nke a na-egosi nhọrọ Mozis ji aka ya mee na ntụnyere dị n'etiti ụzọ abụọ, ma na-aga n'ihu n'ụzọ ebumpụta ụwa site n'amaokwu bu ụzọ.
- source_word: συγκακουχεῖσθαι
  choice: ka e meso ya mmeso ọjọọ ya na
  rationale: Nke a na-echekwa ma echiche nke ịta ahụhụ n'aka ndị ọzọ ma echiche nke isoro ndị ọzọ kerịta mmeso ahụ.
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: ndị nke Chineke
  rationale: Ọ bụ okwu Igbo dị mfe ma dị ugwu maka ìgwè ndị bụ nke Chineke; ọ naghị agbakwụnye nkọwa ụka pụrụ iche.
- source_word: πρόσκαιρον
  choice: nke na-adịru naanị nwa oge
  rationale: Ọ na-egosi ihe na-adịru obere oge, ma na-ada nke ọma n'Igbo karịa nsụgharị siri ike nke otu okwu.
- source_word: ἔχειν
  choice: inwe
  rationale: Ọ na-echekwa ihe ngwaa Grik pụtara kpọmkwem, ebe aha na-esote ya na-eburu echiche nke anụrị.
- source_word: ἁμαρτίας ἀπόλαυσιν
  choice: anụrị mmehie
  rationale: Nke a na-echekwa njikọ sara mbara dị n'etiti anụrị na mmehie, n'ebughị ụzọ kọwaa kpọmkwem ụdị mmehie e bu n'uche.
theological_decisions:
- issue: Ihe kpọmkwem ‘anụrị mmehie’ na-ezo aka na ya
  choice: E debere ya dịka anụrị metụtara mmehie n'ozuzu ya.
  alternative: Ọ pụrụ izo aka kpọmkwem n'uru, ihe ụtọ, na nkwekọrịta ọjọọ ndị dị n'obí Fero.
  rationale: Grik akọwaghị mmehie ndị ahụ kpọmkwem; ya mere, nsụgharị ahụ anaghị eme ka ihe ahụ dị warara karịa ihe ederede kwuru.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. A họọrọ ‘ndị nke Chineke’ iji zere mgbagwoju anya ‘ndị Chineke,’ nke pụrụ ịpụta chi dị iche iche n'Igbo.
