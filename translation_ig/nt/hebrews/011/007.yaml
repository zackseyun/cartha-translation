  to: Ọ bụ site n’okwukwe ka Noa, mgbe a dọrọ ya aka ná ntị[a] banyere ihe ndị a na-ahụbeghị ruo mgbe ahụ, ji egwu nsọ[b] wuo ụgbọ mmiri maka nzọpụta nke ndị ụlọ ya. Site na ya[c] ka o ji maa ụwa ikpe, wee ghọọ onye nketa nke ezi omume[d] nke kwekọrọ n’okwukwe.
