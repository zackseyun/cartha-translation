id: HEB.11.7
reference: Hebrews 11:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: ig
  text: Ọ bụ site n’okwukwe ka Noa, mgbe a dọrọ ya aka ná ntị[a] banyere ihe ndị a na-ahụbeghị ruo mgbe ahụ, ji egwu nsọ[b] wuo ụgbọ mmiri maka nzọpụta nke ndị ụlọ ya. Site na ya[c] ka o ji maa ụwa ikpe, wee ghọọ onye nketa nke ezi omume[d] nke kwekọrọ n’okwukwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe e nyere ya ntụziaka sitere n’aka Chineke” ma ọ bụ “mgbe ọ natara ịdọ aka ná ntị sitere n’aka Chineke.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ebe egwu Chineke kpaliri ya.”
    reason: lexical_alternative
  - marker: c
    text: “Site na ya” yikarịrị ka ọ na-ezo aka n’ụgbọ mmiri ahụ; ụfọdụ na-aghọta ya n’ụzọ sara mbara dịka okwukwe Noa ma ọ bụ nrubeisi ya.
    reason: alternative_reading
  - marker: d
    text: A pụkwara ịsụgharị okwu a “ikpe ziri ezi”; ma n’ebe a, ọnọdụ okwu ahụ na-akwado ezi omume a na-enweta na mmekọrịta ya na okwukwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: site n’okwukwe
  rationale: Ọ na-egosi ụzọ ma ọ bụ ihe e ji mee ihe, ma kwekọọkwa n’usoro a na-emegharị emegharị n’Heb ndị Hibru 11.
- source_word: χρηματισθεὶς
  choice: mgbe a dọrọ ya aka ná ntị
  rationale: Ụdị passive a na-egosi na Noa natara ozi ma ọ bụ ịdọ aka ná ntị sitere n’aka Chineke, ma isiokwu Grik ekwughị ‘Chineke’ kpọmkwem; ya mere, a hapụrụ onye nyere ịdọ aka ná ntị ahụ n’amaghị aha n’ahịrị bụ isi.
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: banyere ihe ndị a na-ahụbeghị anya
  rationale: Nke a na-echekwa echiche nke ihe ndị ahụ na-apụtabeghị ìhè ma ọ bụ nke a na-ahụbeghị ruo mgbe ahụ.
- source_word: εὐλαβηθεὶς
  choice: ji egwu nsọ
  rationale: Ọ na-ejikọta egwu na nsọpụrụ Chineke, ọ bụghị naanị ụjọ nkịtị.
- source_word: κατεσκεύασεν
  choice: wuo
  rationale: ‘Wuo’ bụ okwu Igbo dị mfe ma doo anya maka ịrụ ụgbọ ahụ.
- source_word: κιβωτὸν
  choice: ụgbọ mmiri
  rationale: N’akụkọ Noa, nke a bụ ụzọ ndị na-agụ Igbo nke oge a ga-esi ghọta ụgbọ e wuru maka nzọpụta, karịa nsụgharị nkịtị dịka ‘igbe.’
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: maka nzọpụta nke ezinụlọ ya
  rationale: ‘Nzọpụta’ na-echekwa ma echiche nnapụta ozugbo ma ibu okpukpe nke σωτηρία; ‘ezinụlọ’ na-anọchi ndị ụlọ ya.
- source_word: δι’ ἧς
  choice: site na ya
  rationale: Nnochiaha nwanyị nke Grik na-ezo n’ụzọ kacha nso n’ụgbọ ahụ, ma nsụgharị a anaghị akọwa ụzọ o si bụrụ ihe e ji maa ụwa ikpe karịa ka isiokwu ahụ kwuru.
- source_word: κατέκρινεν τὸν κόσμον
  choice: o ji maa ụwa ikpe
  rationale: Nke a na-echekwa okwu ikpe ahụ n’ụzọ kpọmkwem, ebe nrubeisi Noa gosiri ụwa dị ka nke ikpe mara.
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: ezi omume nke dị ka okwukwe si dị
  rationale: Ọ na-echekwa usoro κατὰ πίστιν n’enweghị ime ya naanị ‘site n’okwukwe,’ ma ‘ezi omume’ bụ okwu Igbo a na-ejikarị akọwa δικαιοσύνη n’ọnọdụ mmekọrịta mmadụ na Chineke.
- source_word: ἐγένετο κληρονόμος
  choice: ghọọ onye nketa
  rationale: Ọ na-egosi n’ụzọ doro anya ọnọdụ nke Noa batara na ya.
theological_decisions:
- issue: Ihe χρηματισθεὶς pụtara na ma a ga-akpọ Chineke aha
  choice: a dọrọ ya aka ná ntị
  alternative: Chineke dọrọ ya aka ná ntị; a kụziiri ya ihe site n’ozi Chineke
  rationale: Ọnọdụ akụkọ ahụ na-egosi na ozi ahụ sitere n’aka Chineke, ma Grik ekwughị onye ahụ n’aha; isi ahịrị ya mere na-echekwa ihe a na-ekwughị kpọmkwem.
- issue: Ụdị egwu dị na εὐλαβηθεὶς
  choice: egwu nsọ
  alternative: nsọpụrụ; egwu Chineke kpaliri ya
  rationale: Nhọrọ a na-echekwa ma egwu ma nsọpụrụ dị n’azịza Noa nyere ozi ahụ.
- issue: Ihe δι’ ἧς na-ezo aka na ya
  choice: ụgbọ mmiri ahụ
  alternative: okwukwe Noa; nrubeisi Noa
  rationale: N’usoro ụtọasụsụ, nnochiaha nwanyị ahụ na-ezo n’ụzọ kacha kwe omume na κιβωτός, ya bụ ụgbọ ahụ; agbanyeghị, ụfọdụ nwere ike ịghọta ya n’ụzọ sara mbara dịka okwukwe ma ọ bụ nrubeisi Noa.
- issue: Nsụgharị δικαιοσύνη
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N’ebe a, okwu banyere ịbụ onye nketa na mmekọrịta ya na okwukwe na-akwado ‘ezi omume,’ ebe ‘ikpe ziri ezi’ ka bụ ohere mkpụrụokwu mana ọ naghị adabara ọnọdụ a nke ọma.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘ụgbọ mmiri’ maka ihe Noa wuru, ‘egwu nsọ’ iji chekwaa njikọ dị n’etiti egwu na nsọpụrụ, na ‘nke dị ka okwukwe si dị’ iji ghara ime ka κατὰ πίστιν pụta ihe karịrị ihe Grik kwuru.
