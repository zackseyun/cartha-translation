review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the faith-frame, the passive divine-warning implication without explicitly naming God, reverent response, ark, condemnation of the world, and inheritance of righteousness. Two small adjustments improve precision: ‘ndị ụlọ ya’ is broader than ‘ezinụlọ ya’ for οἶκος, and the wording for the unseen things should avoid attaching ‘anya’ in a way that can sound like ‘unseen eyes.’'
  naturalness: The proposed revisions are more idiomatic Standard Igbo while retaining the elevated but readable biblical register. ‘Ihe ndị a na-ahụbeghị ruo mgbe ahụ’ clearly expresses μηδέπω, and ‘nke kwekọrọ n’okwukwe’ is a natural rendering of κατὰ πίστιν.
  terminology: ‘okwukwe,’ ‘egwu nsọ,’ ‘nzọpụta,’ ‘ụgbọ mmiri,’ ‘ezi omume,’ and ‘onye nketa’ are appropriate and consistent. ‘Ezi omume’ should remain for δικαιοσύνη; the footnote appropriately records ‘ikpe ziri ezi’ as an alternative.
  issues:
  - severity: low
    issue: ‘ezinụlọ ya’ narrows οἶκος.
    rationale: οἶκος denotes Noah’s household, which can be broader than immediate family. ‘Ndị ụlọ ya’ retains that breadth.
  - severity: low
    issue: ‘ihe ndị a na-ahụbeghị anya’ is potentially awkward or ambiguous.
    rationale: The added ‘anya’ can be read awkwardly in Igbo. ‘Ihe ndị a na-ahụbeghị ruo mgbe ahụ’ naturally conveys things not yet seen.
  - severity: low
    issue: ‘ezi omume nke dị ka okwukwe si dị’ is overly calqued.
    rationale: ‘Ezi omume nke kwekọrọ n’okwukwe’ is more natural Standard Igbo while preserving the noncommittal relation expressed by κατὰ πίστιν.
  revised_text: Ọ bụ site n’okwukwe ka Noa, mgbe a dọrọ ya aka ná ntị[a] banyere ihe ndị a na-ahụbeghị ruo mgbe ahụ, ji egwu nsọ[b] wuo ụgbọ mmiri maka nzọpụta nke ndị ụlọ ya. Site na ya[c] ka o ji maa ụwa ikpe, wee ghọọ onye nketa nke ezi omume[d] nke kwekọrọ n’okwukwe.
