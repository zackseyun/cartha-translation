id: HEB.11.28
reference: Hebrews 11:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πίστει πεποίηκεν τὸ πάσχα καὶ τὴν πρόσχυσιν τοῦ αἵματος, ἵνα μὴ ὁ ὀλοθρεύων τὰ πρωτότοκα θίγῃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: ig
  text: O ji okwukwe debe Ememme Ngabiga ma fesa ọbara ahụ[a], ka onye na-ebibi ndị e buru ụzọ mụọ ghara imetụ ha aka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “itinye ọbara ahụ.” Okwu Grik ahụ na-ekwu banyere itinye ọbara n’ebe emume chọrọ; “ifesa” bụ okwu ọdịnala a na-eji maka emume metụtara ọbara, ma “itinye” nwere ike ịkọwa ihe mere n’oge Ngabiga nke ọma karị.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Ọ bụ site n’okwukwe
  rationale: Nke a na-egosi ụzọ e si mee ihe, ma na-edebekwa usoro okwu a na-emegharị n’ime Ndị Hibru 11.
- source_word: πεποίηκεν
  choice: ka o ji mee
  rationale: N’ebe a ποιέω pụtara ime ma ọ bụ idebe emume Ngabiga. “Mee” bụ okwu Igbo dị mfe ma sara mbara, nke na-adịghị amanye echiche na ọ bụ Mozis guzobere emume ahụ.
- source_word: τὸ πάσχα
  choice: Ememme Ngabiga
  rationale: Nke a nwere ike ịgụnye emume Ngabiga n’ozuzu ya, ọ bụghị naanị nri e riri n’emume ahụ.
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: ifesa ọbara ahụ
  rationale: “Ifesa” bụ okwu a maara n’okwu emume metụtara ọbara; ebe ọ bụ na okwu Grik nwekwara ike ịpụta itinye ọbara n’elu ihe, a debere nke ahụ n’ala peeji.
- source_word: ἵνα μὴ
  choice: ka ... ghara
  rationale: Usoro a na-egosi nzube nke omume ahụ n’Igbo doro anya ma dịkwa nkenke.
- source_word: ὁ ὀλοθρεύων
  choice: onye na-ebibi
  rationale: Nke a na-edebe aha onye ahụ dịka onye na-ebibi, n’etinyeghị “mmụọ ozi,” nke na-adịghị n’ederede Grik.
- source_word: τὰ πρωτότοκα
  choice: ụmụ mbụ
  rationale: Okwu a na-anọchi ndị e buru ụzọ mụọ. “Ụmụ mbụ” bụ okwu Igbo nkịtị nke dabara n’akụkọ Ngabiga.
- source_word: θίγῃ
  choice: imetụ ... aka
  rationale: Nke a na-edebe isi ihe θιγγάνω pụtara, ya bụ “imetụ aka,” n’agbanyeghị na mmetụ ahụ ga-eweta mbibi n’ebe a.
- source_word: αὐτῶν
  choice: ha
  rationale: Nnọchiaha a na-ezo aka n’òtù ndị ha na Mozis nọ; idebe ya dịka “ha” na-ezere ịgbakwunye “ụmụ Izrel” n’ederede.
theological_decisions:
- issue: Onye a na-ekwu na ọ mere Ememme Ngabiga
  choice: E debere ya dịka “o,” ebe a ghọtara na ọ bụ Mozis.
  alternative: Ikwu “Mozis” kpọmkwem.
  rationale: Amaokwu ndị gbara ya gburugburu na-ekwu banyere Mozis, ma ederede Grik n’onwe ya ji isiokwu zoro ezo; ya mere nnọchiaha ahụ na-anọgide.
- issue: Ntụgharị πίστις
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: Isiokwu Ndị Hibru 11 na usoro a na-emegharị ugboro ugboro na-akwado “okwukwe”; “ikwesị ntụkwasị obi” agaghị adabara nke ọma n’ebe a.
translation_notes:
  register: Ejiri Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ememme Ngabiga” na-eme ka aha emume ahụ doo anya; e zere ịkpọ onye na-ebibi ahụ “mmụọ ozi” n’ihi na nkọwa ahụ adịghị n’ederede Grik.
