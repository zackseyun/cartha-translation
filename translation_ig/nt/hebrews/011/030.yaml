  text: πίστει τὰ τείχη Ἰεριχὼ ⸀ἔπεσαν κυκλωθέντα ἐπὶ ἑπτὰ ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/030.yaml
  text: By faith the walls of Jericho fell after they had been encircled for seven days[a].
translation:
  language: ig
  text: Ọ bụ site n’okwukwe ka mgbidi Jeriko dara, mgbe a gbara ha gburugburu ụbọchị asaa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ọ bụ n’okwukwe.” Ụdị dative nke okwu Grik πίστει nwere ike igosi ụzọ e si mee ihe ma ọ bụ otú e si mee ya; ihe e dere n’amaokwu ahụ na-edobe usoro okwu a na-ahụ ugboro ugboro na Ndị Hibru 11.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: site n’okwukwe
  rationale: Nnọchiaha dative nke πίστις nwere ike igosi ụzọ e si mee ihe ma ọ bụ ụdị omume. “Site n’okwukwe” na-edobe usoro okwu a na-eme ugboro ugboro na Ndị Hibru 11, ma ọ naghị akọwapụta ihe Grik ahụ ekwughị.
- source_word: τὰ τείχη
  choice: mgbidi
  rationale: τεῖχος na-ezo aka na mgbidi, karịchaa mgbidi obodo; “mgbidi” bụ okwu Igbo nkịtị ma doo anya n’ebe a.
- source_word: Ἰεριχὼ
  choice: Jeriko
  rationale: A sụgharịghị aha obodo ahụ kama e dere ya n’ụdị dabara n’Igbo; njikọ ya na τὰ τείχη pụtara mgbidi obodo Jeriko.
- source_word: ἔπεσαν
  choice: dara
  rationale: πίπτω pụtara ‘ịda.’ “Dara” kwekọrọ kpọmkwem na Grik ma ghara ịgbakwunye nkọwa pụrụ iche dị ka ‘kwaturu.’
- source_word: κυκλωθέντα
  choice: mgbe a gbachara ha gburugburu
  rationale: Aorist passive participle nke κυκλόω na-egosi na a gbara mgbidi ndị ahụ gburugburu tupu ha adaa. Nsụgharị a na-edobe olu passive ma ghara ịgbakwunye ndị mere ngagharị ahụ.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: ruo ụbọchị asaa
  rationale: ἐπί ya na accusative oge na-egosi ogologo oge. “Ruo ụbọchị asaa” bụ okwu Igbo dị mfe nke na-egosi na omume ahụ gara n’ihu n’ime ụbọchị asaa.
theological_decisions:
- issue: Nsụgharị πίστις na Ndị Hibru 11:30
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N’usoro okwu Ndị Hibru 11, πίστις bụ okwukwe nke ndị a kpọrọ aha ji mee ihe. “Okwukwe” na-edobe isi okwu ahụ na njikọ ya na amaokwu ndị ọzọ, n’enweghị ịtụgharị ya ka ọ bụrụ nanị ntụkwasị obi ma ọ bụ ikwesị ntụkwasị obi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “A gbachara ha gburugburu” na-edobe mgbagwoju anya nke Grik banyere ndị gbara mgbidi ahụ gburugburu; a kpọghị ndị ahụ aha. Akara ndetu [a] dị n’isi amaokwu ahụ dịka achọrọ.
