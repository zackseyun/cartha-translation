  rationale: The revision removes the unsupported ‘some,’ more closely reflects πεῖραν ἔλαβον with “nwetara ọnwụnwa,” and uses idiomatic Standard Igbo for flogging. It preserves the escalating “and even” force and retains a footnote that transparently presents the more literal Greek idiom.
