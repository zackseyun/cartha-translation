translation_notes:
  register: Standard Igbo dị ugwu ma dị mfe nghọta. E jiri “gabigara” mee ka akpaokwu Grik bụrụ nke eke, ebe nkọwa ala peeji na-echekwa ọdịdị okwu ya kpọmkwem na echiche nke ọnwụnwa ma ọ bụ ule.
