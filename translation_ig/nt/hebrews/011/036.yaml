  yaml_path: translation/nt/hebrews/011/036.yaml
  text: And others experienced mocking and flogging[a], and even chains and imprisonment.
translation:
  language: ig
  text: Ma ndị ọzọ nwetara ọnwụnwa site n’ịkwa ha emo na ịpịa ha ụtarị, na ọbụna site n’agbụ na mkpọrọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτεροι
  choice: ụfọdụ ndị ọzọ
  rationale: Ọ na-egosi ìgwè ọzọ n'ime ndị okwukwe ahụ e depụtara; nkebi a na-eme ka ntụnyere ya na ndị e kwuru banyere ha tupu ya doo anya n'Igbo.
- source_word: ἐμπαιγμῶν
  choice: ịkwa emo
  rationale: Nke a bụ okwu Igbo dị ugbu a ma doo anya maka mkparị na ime mmadụ ihe ọchị n'ihu ọha.
- source_word: μαστίγων
  choice: ịpịa ihe otiti
  rationale: Ọ na-egosi ntaramahụhụ a na-enye site n'iji ụtarị ma ọ bụ ihe yiri ya tie mmadụ, ọ bụghị naanị iti ihe n'ozuzu.
- source_word: πεῖραν ἔλαβον
  choice: gabigara
  rationale: Akpaokwu Grik pụtara n'ụzọ nkịtị na ha 'natara ọnwụnwa/ule nke' ahụhụ ndị a; 'gabigara' na-egosipụta ahụmahụ siri ike ha diri n'Igbo eke.
- source_word: ἔτι δὲ
  choice: ọbụna
  rationale: Ọ na-egosi nrịgo site n'ịkwa emo na ịpịa ihe ruo n'agbụ na mkpọrọ.
- source_word: δεσμῶν
  choice: agbụ
  rationale: Ọ bụ okwu doro anya maka ihe e ji kee ma gbochie onye mkpọrọ.
- source_word: φυλακῆς
  choice: mkpọrọ
  rationale: N'ebe a ọ na-ezo aka n'ọnọdụ ịbụ onye a kpọchiri, nke 'mkpọrọ' na-ekwupụta n'ụzọ nkịtị na Igbo.
