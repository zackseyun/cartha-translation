  text: οἱ γὰρ τοιαῦτα λέγοντες ἐμφανίζουσιν ὅτι πατρίδα ἐπιζητοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/014.yaml
  text: For those who say such things make it clear that they are seeking a homeland[a].
translation:
  language: ig
  text: N’ihi na ndị na-ekwu ihe ndị dị otú ahụ na-eme ka o doo anya na ha na-achọ ala nna[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘obodo nke ha’ ma ọ bụ ‘ala ha si pụta.’ Amaokwu ndị na-esote na-eme ka o doo anya na ala nna ha tụrụ anya ya n’ikpeazụ bụ nke eluigwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-ejigide njikọ nkọwa amaokwu a na ihe e kwuru n’amaokwu bu ya ụzọ.
- source_word: τοιαῦτα
  choice: ihe ndị dị otú ahụ
  rationale: Na-ezo aka n’ụdị okwu ndị e kwuru n’akụkụ amaokwu a, ma bụrụkwa okwu Igbo doro anya.
- source_word: λέγοντες
  choice: ndị na-ekwu
  rationale: A tụgharịrị participle ahụ ka ọ bụrụ nkebiokwu na-akọwa ndị ahụ, na-ejigide echiche nke omume na-aga n’ihu ma ọ bụ nke a na-eme n’ozuzu.
- source_word: ἐμφανίζουσιν
  choice: na-eme ka o doo anya
  rationale: Na-egosipụta echiche nke ime ka ihe pụta ìhè site n’okwu ha.
- source_word: ὅτι
  choice: na
  rationale: N’ebe a, ‘na’ na-ewebata ọdịnaya nke ihe e mere ka o doo anya n’ụzọ dabara n’asụsụ Igbo.
- source_word: πατρίδα
  choice: ala nna
  rationale: ‘Ala nna’ bụ okwu Igbo ebumpụta ụwa maka obodo ma ọ bụ ala mmadụ si pụta; ọ naghị ekpebi n’ime amaokwu a ma ala ahụ ọ̀ bụ nke ụwa ka ọ̀ bụ nke eluigwe.
- source_word: ἐπιζητοῦσιν
  choice: na-achọ
  rationale: Na-ejigide echiche nke ọchịchọ na nchọgharị na-aga n’ihu, kama ịkọwa ya naanị dịka agụụ obi.
theological_decisions:
- issue: Ihe πατρίς ndị nna ochie ahụ chọrọ pụtara n’akụkụ amaokwu a
  choice: A sụgharịrị ya n’ozuzu dịka ‘ala nna,’ n’akọwaghị n’isi amaokwu a ma ọ̀ bụ nke ụwa ka ọ̀ bụ nke eluigwe.
  alternative: Ịkọwa ya ozugbo dịka ala nna nke eluigwe, ma ọ bụ dịka obodo ha n’ụwa.
  rationale: Amaokwu a n’onwe ya kwuru naanị na ha na-achọ ala nna; amaokwu na-esote na-eme ka o doo anya na nke ha na-atụ anya ya n’ikpeazụ bụ nke ka mma, ya bụ nke eluigwe. Nke a na-ahapụ nghọta amaokwu a ka o guzo tupu nkọwa na-esote.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ala nna’ mee ka okwu ahụ bụrụ nke ebumpụta ụwa n’Igbo, ebe e debere nkọwa zuru ezu banyere ala nke eluigwe n’ala ala peeji.
