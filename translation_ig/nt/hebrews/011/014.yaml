review_pass:
  verdict: revise
  source_fidelity: 'The main text faithfully represents the Greek: γάρ is explanatory (''N’ihi na''); οἱ ... λέγοντες is naturally rendered as ''ndị na-ekwu''; ἐμφανίζουσιν ὅτι as ''na-eme ka o doo anya na''; and ἐπιζητοῦσιν retains the sense of actively seeking. ''Ala nna'' is an appropriate Standard Igbo equivalent for πατρίδα and does not prematurely identify the homeland as earthly or heavenly.'
  naturalness: The verse is clear, idiomatic Standard Igbo, and has an appropriately formal biblical register. The clause sequence is natural and readily understandable.
  terminology: '''Ala nna'' suitably conveys ''homeland/native country.'' The proposed alternatives in the note are understandable. However, the note''s reference to ''Amaokwu na-esote'' is textually inaccurate: Hebrews 11:15 concerns a country to which they could have returned, while the heavenly country is stated in verse 16. The note should refer to the subsequent context/verses rather than the immediately following verse.'
  issues:
