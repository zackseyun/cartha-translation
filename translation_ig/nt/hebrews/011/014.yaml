    issue: The footnote says that the following verse makes clear that the hoped-for homeland is heavenly.
    rationale: This imports verse 16 into verse 15. The immediately following verse (Heb 11:15) instead discusses an opportunity to return to the country from which they had come. Hebrews 11:16 identifies the better, heavenly country.
