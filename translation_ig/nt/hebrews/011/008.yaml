id: HEB.11.8
reference: Hebrews 11:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: ig
  text: Site n’okwukwe, Ebreham rubere isi mgbe a kpọrọ ya ka ọ pụọ gaa n’otu ebe ọ gaje ịnata dị ka ihe nketa. O wee pụọ n’amaghị ebe ọ na-aga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Site n’okwukwe
  rationale: Dative of means; this is the natural Standard Igbo expression for acting by faith and fits Abraham’s trusting response.
- source_word: καλούμενος
  choice: mgbe a kpọrọ ya
  rationale: Renders the present passive participle as a temporal circumstance without specifying more sequence than the Greek does.
- source_word: ὑπήκουσεν
  choice: rubere isi
  rationale: The established natural Igbo expression directly conveys obedience or compliance.
- source_word: ἐξελθεῖν
  choice: ka ọ pụọ gaa
  rationale: Expresses the complementary action naturally in Igbo and retains the idea of leaving for a destination.
- source_word: τόπον
  choice: n’otu ebe
  rationale: Reflects the anarthrous reading printed in the supplied SBLGNT text and the destination’s still-unspecified character.
- source_word: ἤμελλεν λαμβάνειν
  choice: ọ gaje ịnata
  rationale: Conveys prospective futurity without adding a stronger idea of predestination.
- source_word: εἰς κληρονομίαν
  choice: dị ka ihe nketa
  rationale: Naturally presents the place as what Abraham would receive in the status of an inheritance; no possessive absent from Greek is added.
- source_word: καὶ ἐξῆλθεν
  choice: O wee pụọ
  rationale: Preserves the author’s repetition of the ‘go out’ verb while marking the next narrative action idiomatically.
- source_word: μὴ ἐπιστάμενος
  choice: n’amaghị
  rationale: Concise Igbo rendering of the negative participle as attendant circumstance.
- source_word: ποῦ ἔρχεται
  choice: ebe ọ na-aga
  rationale: Uses the idiomatic Igbo expression for an unknown destination while retaining the Greek present-form viewpoint.
theological_decisions:
- issue: Sense of πίστις in Abraham’s response
  choice: okwukwe
  alternative: ntụkwasị obi
  rationale: The context presents Abraham’s believing, trusting response to God’s call. ‘Okwukwe’ is the standard and contextually fitting rendering without reducing the term solely to trust or recasting it as faithfulness.
- issue: Relationship of the call, obedience, and departure
  choice: mgbe a kpọrọ ya ka ọ pụọ gaa
  alternative: mgbe a kpọrọ ya, o rubere isi ịpụ gaa
  rationale: The chosen Igbo construction clearly conveys that Abraham obeyed the call by departing. It avoids an unnatural direct imitation of the Greek verb-plus-infinitive while not adding the identity of the caller.
translation_notes:
  register: Natural, current Standard Igbo in a dignified biblical register. The rendering keeps the repeated departure language and Abraham’s lack of knowledge, while avoiding denominational or interpretive additions.
source_grounding:
  english_pob_role: consult_only
