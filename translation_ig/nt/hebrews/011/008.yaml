  source_fidelity: 'The draft accurately represents the Greek: Πίστει is rendered instrumentally (''Site n’okwukwe''); the passive call and Abraham’s obedient departure are retained; the destination is indefinite (''n’otu ebe''); the prospective receipt of it as an inheritance is preserved; and the final clause rightly conveys that he departed without knowing his destination. The repeated departure wording is also maintained.'
