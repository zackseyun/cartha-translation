  text: πίστει Μωϋσῆς μέγας γενόμενος ἠρνήσατο λέγεσθαι υἱὸς θυγατρὸς Φαραώ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/024.yaml
  text: By faith Moses[a], when he had grown up, refused to be called the son of Pharaoh’s daughter,
translation:
  language: ig
  text: Ọ bụ site n'okwukwe ka Mosis[a], mgbe o tolitere, jụrụ ka a kpọọ ya nwa nwoke nke ada Fero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịtụgharị πίστει dịka “site n''ikwesị ntụkwasị obi” ma ọ bụ “site ná ntụkwasị obi.” N''ebe a, isi ederede gbasoro usoro okwu a na-emegharị n''isiakwụkwọ a: “site n''okwukwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Ọ bụ site n'okwukwe
  rationale: Dative a na-egosi ụzọ e si mee ihe; n'usoro okwu a na-emegharị n'Heb ndị 11, 'site n'okwukwe' na-egosipụta nke ọma na ọ bụ okwukwe kpaliri omume ahụ.
- source_word: Μωϋσῆς
  choice: Mosis
  rationale: Nke a bụ ụdị aha ahụ a na-ejikarị n'Igbo.
- source_word: μέγας γενόμενος
  choice: mgbe o tolitere
  rationale: N'ọnọdụ a, akpaokwu ahụ pụtara iru ntozu okè, ọ bụghị ịbụ onye ukwu n'ọkwa.
- source_word: ἠρνήσατο
  choice: jụrụ
  rationale: Ngwaa ahụ na-egosi mkpebi ịghara ịnakwere aha ma ọ bụ njirimara a chọrọ ịkpọ ya.
- source_word: λέγεσθαι
  choice: ka a kpọọ ya
  rationale: Nke a na-egosipụta infinitive passive ahụ n'Igbo dị mfe ma bụrụkwa nke sitere n'okike.
- source_word: υἱὸς θυγατρὸς Φαραώ
  choice: nwa nwoke nke ada Fero
  rationale: Akpaokwu a na-ezo aka n'ọnọdụ Mosis dị ka nwa nwoke e weere n'ezinụlọ ada Fero; 'nke' na-eme ka mmekọrịta ahụ doo anya n'Igbo.
- source_word: Φαραώ
  choice: Fero
  rationale: Nke a bụ ụdị utu aha ahụ a na-ejikarị n'Igbo.
theological_decisions:
- issue: Nsụgharị πίστις n'usoro okwu a na-emegharị n'Heb ndị 11
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi; ntụkwasị obi
  rationale: Isi okwu nke Heb ndị 11 bụ omume ndị e mere site n'okwukwe. Ma ebe πίστις nwekwara ike ịpụta ikwesị ntụkwasị obi ma ọ bụ ntụkwasị obi, e debere ihe ndị ahụ dị ka nsụgharị ndị ọzọ n'ala peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ahịrịokwu ahụ n'ụdị Igbo sitere n'okike, ma e chekwara mmekọrịta dị n'etiti okwukwe na omume Mosis.
