id: HEB.11.26
reference: Hebrews 11:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μείζονα πλοῦτον ἡγησάμενος τῶν Αἰγύπτου θησαυρῶν τὸν ὀνειδισμὸν τοῦ Χριστοῦ, ἀπέβλεπεν γὰρ εἰς τὴν μισθαποδοσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: ig
  text: O weere mkparị nke Mesaịa[b][a] dị ka akụnụba ka ukwuu karịa akụ̀ Ijipt, n’ihi na ọ nọgidere na-elekwasị anya n’ụgwọ ọrụ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkparị nke Kraịst.” A pụrụ ịsụgharị okwu Grik ahụ, Χριστοῦ, dịka “Kraịst,” ma e jiri “Mesaịa” ebe a n’ihi na ọ na-arụ ọrụ dịka aha.
    reason: alternative_reading
  - marker: b
    text: “Mkparị nke Mesaịa” nwere ike ịpụta mkparị a tara n’ihi Mesaịa, mkparị e kesara ya na onye Chineke tere mmanụ, ma ọ bụ mkparị akwụkwọ Ndị Hibru na-ahụ ka o mezuru n’ime Mesaịa. E debere usoro okwu Grik ahụ n’enweghị ime ka ọ bụrụ naanị otu n’ime nghọta ndị a.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: akụnụba ka ukwuu
  rationale: Nke a na-egosi ntụnyere uru dị n’akụkụ okwu Grik ahụ, ma na-ekewapụ πλοῦτος, ‘akụnụba,’ na θησαυροί, ‘akụ̀ ndị e chekwara.’
- source_word: ἡγησάμενος
  choice: O weere ... dị ka
  rationale: Usoro a bụ Igbo nkịtị maka mmadụ ile ihe anya ma kpebie uru ọ bara; ọ na-edobe ike nke ‘ịgụ ma ọ bụ iwere ihe dị ka.’
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: akụ̀ ndị Ijipt
  rationale: Ọ na-enye njikọ genitive ahụ n’ụzọ dị mfe ma doo anya, na-enweghị ịgbakwunye na ọ bụ akụ̀ niile dị n’Ijipt.
- source_word: τὸν ὀνειδισμὸν
  choice: nkọcha
  rationale: ‘Nkọcha’ na-egosi mmechuihu na okwu ọjọọ mmadụ na-ata n’ihu ọha, ma ọ naghị ebelata okwu ahụ ka ọ bụrụ naanị ihere dị n’obi.
- source_word: τοῦ Χριστοῦ
  choice: nke Mesaịa
  rationale: Χριστός na-arụ ọrụ ebe a dị ka utu aha; ‘Mesaịa’ na-egosipụta nke ahụ ma na-ahapụ njikọ genitive ahụ ka ọ ghara ịkọwa karịa ihe Grik kwuru.
- source_word: ἀπέβλεπεν
  choice: ọ nọ na-ele anya
  rationale: Ụdị imperfect ahụ na-egosi na uche ya nọgidere na-eche ihu n’ụgwọ ahụ; ntụgharị a na-edobe echiche ahụ n’Igbo dị mfe.
- source_word: μισθαποδοσίαν
  choice: ụgwọ ọrụ ahụ
  rationale: Okwu a pụtara ihe a ga-akwụghachi ma ọ bụ ụgwọ ọrụ. ‘Ụgwọ ọrụ’ bụ okwu Igbo doro anya n’ebe a, ebe ‘ahụ’ na-arụtụ aka n’ụgwọ a na-atụ anya ya.
theological_decisions:
- issue: Ihe ‘nkọcha nke Mesaịa’ pụtara n’ihe gbasara Mosis
  choice: E debere ya dịka ‘nkọcha nke Mesaịa’ n’enweghị nkọwa agbakwunyere.
  alternative: nkọcha ọ tara n’ihi Mesaịa; nkọcha ya na onye Chineke tere mmanụ kekọrọ; nkọcha nke mezuru n’ime Mesaịa
  rationale: Genitive Grik ahụ nwere ike ịkwado nghọta ndị a dị iche iche. Ịhapụ ya dịka ‘nke Mesaịa’ na-echekwa mgbagwoju anya na esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ kama idozi ya n’otu ụzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Akụnụba’ na ‘akụ̀’ na-eme ka ntụnyere dị n’etiti πλοῦτος na θησαυροί pụta ìhè, ebe usoro ‘nke Mesaịa’ na-echekwa oghere nkọwa dị na Grik.
