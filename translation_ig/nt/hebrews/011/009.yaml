id: HEB.11.9
reference: Hebrews 11:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: ig
  text: Ọ bụ site n'okwukwe ka ọ biri dị ka onye ọbịa n'ala ahụ e kwere ná nkwa[a], dị ka ala ọzọ, na-ebi n'ụlọikwuu, ya na Aịzik na Jekọb, ndị ya na ha bụ ndị nketa nke otu nkwa ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ bụ site n'okwukwe ka ọ biri dị ka onye ọbịa n'ala ahụ e kwere ná nkwa dị ka ala ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Ọ bụ site n'okwukwe
  rationale: Dative a na-egosi ihe e ji mee ihe; okwu a kwekọrọ n'otú isi nke 11 si eme ka okwukwe bụrụ isi ihe.
- source_word: παρῴκησεν
  choice: ọ biri dị ka onye ọbịa
  rationale: Ngwaa ahụ na-egosi ibi n'ebe mmadụ na-abụghị nwa amaala ma ọ bụ onye nwe ala; ntụgharị a doro anya n'Igbo nke oge a.
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: n'ala ahụ e kwere ná nkwa
  rationale: N'ebe a εἰς sonyere ngwaa ibi wee na-arụ ọrụ dịka ngosipụta ebe; 'ala ahụ e kwere ná nkwa' na-egosi na ọ bụ ala nke nkwa Chineke kwuru banyere ya.
- source_word: ὡς ἀλλοτρίαν
  choice: dị ka a ga-asị na ọ bụ ala ndị ọzọ
  rationale: ἀλλότριος pụtara ihe bụ nke onye ọzọ ma ọ bụ ihe mba ọzọ; okwu a na-echekwa ntụnyere nke ὡς na echiche na ala ahụ abụghị nke ya mgbe ahụ.
- source_word: ἐν σκηναῖς κατοικήσας
  choice: na-ebi n'ụlọikwuu
  rationale: Participle ahụ na-akọ ụzọ o si biri n'ala ahụ, ma na-echekwa ihe oyiyi nke ebe obibi na-adịru nwa oge.
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακὼβ
  choice: ya na Aịzik na Jekọb
  rationale: μετά na genitive pụtara 'ya na'; aha ndị ahụ soro nsụgharị Igbo a na-ahụkarị.
- source_word: τῶν συγκληρονόμων
  choice: ndị ha na ya ga-eketakwa
  rationale: Okwu a na-egosi ndị na-ekerịta otu ihe nketa; ụdị ngwaa a bụ Igbo eke ma na-echekwa echiche nke iketa ọnụ.
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: otu nkwa ahụ
  rationale: αὐτῆς na-emesi ike na Aịzik na Jekọb so Abraham nwee kpọmkwem otu nkwa ahụ.
theological_decisions:
- issue: Onye isiokwu e zoro ezo na-ezo aka na ya
  choice: E hapụrụ ya dịka 'ọ,' nke na-ezo aka n'Abraham n'amaokwu bu ụzọ.
  alternative: Ikwughachi aha 'Abraham' n'amaokwu a.
  rationale: Grik ji ngwaa nke isiokwu ya zoro ezo, ebe ihe gbara ya gburugburu na Hibru 11:8 na-eme ka o doo anya na ọ bụ Abraham; ide 'ọ' na-echekwa njikọ ahụ n'enweghị ịgbakwunye aha n'ime amaokwu.
- issue: Oge iketa dị na συγκληρονόμων
  choice: ndị ha na ya ga-eketakwa
  alternative: ndị ha na ya bụ ndị nketa
  rationale: Grik n'onwe ya anaghị akọwa oge n'ụzọ doro anya. Igbo ahọpụtara na-ekwupụta nketa ahụ dị ka ihe nkwa ahụ na-atụ anya ya, ma nkọwa ọzọ nwere ike igosi ọnọdụ ha dịka ndị nketa ugbu a.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji 'onye ọbịa' gosipụta ọnọdụ onye na-abụghị nwa afọ ma ọ bụ onye nwe ala; e ji 'ụlọikwuu' mee ka ihe oyiyi nke ebe obibi na-adịru nwa oge pụta ìhè. Ihe nrịbama ndetu ala ala [a] dị n'ahịrị isi.
