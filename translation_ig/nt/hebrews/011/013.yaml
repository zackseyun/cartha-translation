revisions:
- from: Ndị a niile nwụrụ n’okwukwe. Ha anataghị nkwa ndị ahụ, kama ha hụrụ ha n’ebe dị anya, keleekwa ha[a]. Ha kwupụtara na ha bụ ndị ọbịa na ndị bịara ibi nwa oge[b] n’ụwa.
  to: Ndị a niile nwụrụ n’okwukwe, n’enwetaghị nkwa ndị ahụ; kama ha hụrụ ha n’ebe dị anya, keleekwa ha, kwupụtakwa na ha bụ ndị ọbịa na ndị bịara ibi nwa oge n’ụwa.
  rationale: The revision preserves the meaning while reconnecting the clauses as a coherent sequence dependent on their dying in faith, corresponding more closely to the Greek participles. It retains the draft’s defensible figurative rendering “keleekwa ha” and its non-doctrinal, non-overstated rendering of παρεπίδημοι. Footnote b is refined for idiomatic clarity.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:29:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the principal Greek sense: all the previously cited people died in faith without receiving the promises, saw and figuratively greeted/welcomed them from afar, and acknowledged their outsider and temporary-resident status on earth. A revision is warranted to retain the Greek participial linkage more clearly in natural Igbo rather than splitting the sequence into independent sentences.'
  naturalness: “Ndị ọbịa na ndị bịara ibi nwa oge” is clear, modern Standard Igbo and avoids importing the stronger notion of forced exile. The revised single-sentence structure reads more cohesively. The footnote wording is also adjusted to state the social-status nuance idiomatically.
  terminology: “Okwukwe,” “nkwa,” “ndị ọbịa,” and “ndị bịara ibi nwa oge” are suitable renderings. “Keleekwa ha” appropriately preserves the striking figurative image of ἀσπασάμενοι; “nabatakwa ha” remains a legitimate lexical alternative in the note.
  issues:
  - severity: low
    issue: The Greek sequence of participles is broken into separate independent sentences.
    rationale: Although not inaccurate, “Ha anataghị ... Ha kwupụtara ...” weakens the close syntactic and rhetorical connection to “nwụrụ.” Rendering the sequence with dependent verbal forms is both more source-sensitive and natural in this context.
  - severity: low
    issue: Footnote b uses slightly awkward wording for lack of civic belonging.
    rationale: “Ha enweghị ọnọdụ zuru ezu nke ndị nwe obodo” is understandable but less idiomatic and less precise than saying they lack the full standing/rights of people of that place.
  revised_text: Ndị a niile nwụrụ n’okwukwe, n’enwetaghị nkwa ndị ahụ; kama ha hụrụ ha n’ebe dị anya, keleekwa ha, kwupụtakwa na ha bụ ndị ọbịa na ndị bịara ibi nwa oge n’ụwa.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “nabatakwa ha.” Okwu Grik a nwere ike ịpụta ikele ma ọ bụ ịnabata; n’ebe a, e ji ya mee ihe atụ banyere nkwa ndị ha hụrụ n’ebe dị anya.
