id: HEB.11.13
reference: Hebrews 11:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: ig
  text: Ndị a niile nwụrụ n’okwukwe, n’enwetaghị nkwa ndị ahụ; kama ha hụrụ ha n’ebe dị anya, keleekwa ha, kwupụtakwa na ha bụ ndị ọbịa na ndị bịara ibi nwa oge n’ụwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: n’okwukwe
  rationale: Nkebi okwu a na-egosi ọnọdụ ma ọ bụ ụzọ okwukwe siri duzie ndụ ha ruo mgbe ha nwụrụ; “n’okwukwe” bụ Igbo doro anya ma kwekọọ na ihe a na-ekwu ebe a.
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: Ha anataghị nkwa ndị ahụ
  rationale: A hapụrụ ọtụtụ nke ἐπαγγελίας dịka “nkwa ndị ahụ,” ma mee participle ahụ ka ọ bụrụ ahịrịokwu zuru ezu iji mee ka Igbo bụrụ ihe a na-agụ nke ọma.
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: ha hụrụ ha n’ebe dị anya
  rationale: Nke a na-echekwa ihe oyiyi nke ịhụ nkwa ndị ahụ site n’ebe dị anya, n’emeghị ka ihe ahụ pụtara bụrụ naanị oge dị anya.
- source_word: ἀσπασάμενοι
  choice: keleekwa ha
  rationale: Okwu Grik a pụtara ikele ma ọ bụ ịnabata. “Keleekwa ha” na-echekwa ihe oyiyi nke mmadụ ikekele nkwa ndị ọ hụrụ n’ebe dị anya; e nyere “nabata ha” dịka ụzọ ọzọ n’okpuru.
- source_word: ὁμολογήσαντες
  choice: Ha kwupụtara
  rationale: “Kwupụtara” na-egosi nkwupụta doro anya ha mere banyere ọnọdụ ha n’ụwa, na-enweghị itinye echiche okpukpe ọzọ n’ime okwu ahụ.
- source_word: ξένοι
  choice: ndị ọbịa
  rationale: Nke a na-egosi ndị na-abụghị ndị obodo ma ọ bụ ndị na-enweghị ebe ha nwere dịka nke ha n’ebe ahụ.
- source_word: παρεπίδημοί
  choice: ndị bịara ibi nwa oge
  rationale: Nkebi a na-egosi ndị bi n’otu ebe mana ha enweghị ọnọdụ nke ndị nwe obodo ma ọ bụ ebe obibi na-adịgide adịgide; ọ naghị amanye echiche nke ịbụ ndị a chụgara n’ala ọzọ.
- source_word: ἐπὶ τῆς γῆς
  choice: n’ụwa
  rationale: N’ebe a γῆ na-ezo aka n’ụwa dịka ebe mmadụ bi, ọ bụghị naanị n’otu ala ma ọ bụ obodo kpọmkwem.
theological_decisions:
- issue: Ihe πίστις pụtara n’ebe a
  choice: okwukwe
  alternative: ntụkwasị obi
  rationale: “Okwukwe” na-echekwa okwu bụ isi nke akwụkwọ Hibru ma na-egosi ọnọdụ ntụkwasị obi ha nwere mgbe ha nwụrụ, n’ebughị ụzọ kpebie na okwu ahụ pụtara naanị ikwesị ntụkwasị obi.
- issue: Ihe oyiyi dị na ἀσπασάμενοι mgbe nkwa bụ ihe a na-ekele
  choice: keleekwa ha
  alternative: nabatakwa ha
  rationale: A hapụrụ ihe oyiyi ahụ n’ahịrịokwu bụ isi, ebe nkọwa ala peeji na-egosi na okwu ahụ nwekwara ike ịpụta ịnabata. Nke a na-echekwa mgbagwoju anya ziri ezi n’etiti ikekele na ịnabata.
- issue: Ọnọdụ ndị a kpọrọ παρεπίδημοί
  choice: ndị bịara ibi nwa oge
  alternative: ndị mba ọzọ bi ebe ahụ
  rationale: Nhọrọ a na-egosi na ha bi ebe ahụ na-enweghị ịbụ ndị nwe obodo zuru oke. A jụrụ “ndị a chụgara n’ala ọzọ” n’ahịrịokwu bụ isi n’ihi na okwu Grik ahụ n’onwe ya anaghị ekwu na a manyere ha ịpụ n’ala ha.
translation_notes:
  register: 'E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. E kewara usoro participle Grik ahụ n’ahịrịokwu atọ ka okwu Igbo na-aga nke ọma, ma echekwara usoro echiche ya: ha nwụrụ n’okwukwe, anataghị nkwa, hụrụ ma kelee ha site n’ebe dị anya, kwupụtakwa ọnọdụ ha n’ụwa.'
