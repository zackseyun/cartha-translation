  edition: SBLGNT
  text: Πίστει ⸀καὶ περὶ μελλόντων εὐλόγησεν Ἰσαὰκ τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/020.yaml
  text: By faith Isaac blessed Jacob and Esau, even concerning things to come.
translation:
  language: ig
  text: Ọ bụ site n’okwukwe ka Aịzik ji gọzie Jekọb na Ịsọ, ọbụna banyere ihe ndị gaje ịbịa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: Ọ bụ site n’okwukwe
  rationale: Na-egosipụta okwukwe dịka ụzọ ma ọ bụ ndabere nke omume ahụ, n’Igbo doro anya ma dịkwa ebube.
- source_word: εὐλόγησεν
  choice: ji gọzie
  rationale: ‘Gọzie’ bụ okwu Igbo nkịtị maka ikwupụta ngọzi; ‘ji’ na-ejikọta ya nke ọma na ‘site n’okwukwe.’
- source_word: περὶ μελλόντων
  choice: banyere ihe ndị gaje ịbịa
  rationale: Na-edobe echiche nke ihe ndị ka ga-eme ma ọ bụ ga-abịa n’ọdịnihu, n’ebughị amụma nkọwa ndị ọzọ n’ime ederede.
- source_word: καὶ περὶ
  choice: ọbụna banyere
  rationale: Na-egosipụta ike nke καὶ n’ebe a dịka ihe na-emesi okwu gbasara ọdịnihu ike, dịka ihe akaebe ederede na oyi akwa ntụnyere Bekee si kwado.
theological_decisions:
- issue: Ụdị na ọdịnaya ngọzi Aịzik
  choice: Edoghị anya ma ngọzi ahụ bụ amụma, nkwa, ma ọ bụ nkwupụta ọchịchị Chineke; a sụgharịrị ya naanị dịka ngọzi banyere ihe ndị gaje ịbịa.
  alternative: Ịkpọ ya kpọmkwem ‘ngọzi amụma’ ma ọ bụ ‘amụma banyere ọdịnihu.’
  rationale: Okwu Grik kwuru na ngọzi ahụ metụtara ihe ndị gaje ịbịa, ma ọ kọwaghị ụdị mmekọrịta ahụ n’ụzọ ga-enye ikike itinye nkọwa ụka ọzọ.
translation_notes:
  register: 'Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. E ji aha ndị a na-ahụkarị n’ọdịnala Baịbụl Igbo: Aịzik, Jekọb, na Ịsọ.'
