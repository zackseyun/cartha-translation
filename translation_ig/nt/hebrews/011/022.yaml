  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: ig
  text: Ọ bụ site n'okwukwe ka Josef, mgbe ọ na-eru ọgwụgwụ ndụ ya,[a] kwuru banyere ọpụpụ[b] ụmụ Izrel ma nye iwu banyere ọkpụkpụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ọ na-anwụ anwụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịpụ ụmụ Izrel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Ọ bụ site n'okwukwe
  rationale: Nke a na-edobe usoro okwu a na-eme ugboro ugboro na Ndị Hibru 11, ma na-egosi okwukwe dịka ihe Josef ji mee ihe ahụ.
- source_word: τελευτῶν
  choice: mgbe ọ na-eru ọgwụgwụ ndụ ya
  rationale: Nke a na-egosipụta participle ahụ dịka ihe na-eme n'otu oge ahụ, n'Igbo dị mfe ma dị ùgwù; ọ pụkwara ịpụta 'mgbe ọ na-anwụ anwụ.'
- source_word: περὶ τῆς ἐξόδου
  choice: banyere ọpụpụ
  rationale: ‘Ọpụpụ’ na-egosipụta isi echiche nke ἔξοδος, ya bụ ịpụ ma ọ bụ ịla, ma n'ebe a ọ na-ezo aka n'ọpụpụ Izrel si Ijipt.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: ụmụ Izrel
  rationale: ‘Ụmụ Izrel’ bụ ụzọ Igbo nkịtị si egosipụta njikọ ezinụlọ dị na okwu Grik ahụ, ma na-agụnye ndị si n'Izrel pụta.
- source_word: ἐμνημόνευσεν
  choice: kwuru banyere
  rationale: N'usoro ya na περὶ, ngwaa a pụtara ikwu banyere ma ọ bụ ịkpọtụrụ ihe, ọ bụghị naanị icheta ya n'obi.
- source_word: ἐνετείλατο
  choice: nye iwu
  rationale: Nke a na-egosipụta ntụziaka Josef nyere n'ụzọ doro anya ma kwekọọ na ike ngwaa Grik ahụ.
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: banyere ọkpụkpụ ya
  rationale: A na-edobe okwu doro anya bụ ‘ọkpụkpụ,’ kama iji okwu sara mbara dịka ozu ma ọ bụ ihe fọdụrụ n'ahụ ya.
theological_decisions:
- issue: Nsụgharị πίστις na Ndị Hibru 11
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: Usoro okwu a na-eme ugboro ugboro n'isiakwụkwọ a na-akwado ‘okwukwe’ dịka nsụgharị bụ isi, n'emeghị ka ọ bụrụ naanị ikwesị ntụkwasị obi.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị mfe nghọta ma dị ùgwù. E debere ‘ọkpụkpụ’ n'ụzọ nkịtị, tinyekwa akara ntụaka ụkwụ niile n'ahịrịokwu bụ isi.
