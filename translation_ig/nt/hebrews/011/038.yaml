  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: ig
  text: —ndị ụwa na-ekwesịghị ha—na-awagharị n'ọzara[a] na n'ugwu, n'ọgba nakwa n'oghere ndị dị n'ala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ebe tọgbọrọ n’efu.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’oghere nke ala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: ndị ... ha
  rationale: Nnochiaha njikọ nke dị na genitiv plural na-arụtụ aka n’ebe ndị okwukwe tara ahụhụ a kpọrọ aha n’amaokwu bu ụzọ nọ; nhazi Igbo a na-eme ka njikọ ahụ doo anya n’ụzọ eke.
- source_word: ἄξιος
  choice: na-ekwesịghị
  rationale: 'Nke a na-echekwa ikpe banyere uru na ịdị mma dị n’okwu Grik ahụ: ụwa ekwesịghị ndị ahụ, ọ bụghị naanị na ha na ụwa adịghị emekọrịta.'
- source_word: κόσμος
  choice: ụwa
  rationale: “Ụwa” bụ okwu Igbo sara mbara ma bụrụkwa nke a na-ahụkarị maka κόσμος; n’ebe a ọ gụnyere ọha mmadụ jụrụ ndị kwesịrị ntụkwasị obi ahụ.
- source_word: ἐπὶ ἐρημίαις
  choice: n'ọzara
  rationale: ἐπί tinyere dative na-egosi ebe ha na-awagharị. “N'ọzara” bụ okwu doro anya ma na-enye ihe oyiyi siri ike, ebe “n’ebe ndị tọgbọrọ n’efu” ka bụkwa ihe ọzọ okwu Grik ahụ pụrụ ịpụta.
- source_word: πλανώμενοι
  choice: ha na-awagharị
  rationale: Ọ na-egosi njem na-enweghị ebe obibi kwụsiri ike, nke dabara n’ọnọdụ mgbapụ na ahụhụ e kwuru banyere ya.
- source_word: ὄρεσι
  choice: n'ugwu
  rationale: ὄρος na-egosikarị ugwu ma ọ bụ nnukwu ugwu nta; “ugwu” bụ ntụgharị Igbo kachasị mfe ma doo anya.
- source_word: σπηλαίοις
  choice: n'ọgba
  rationale: “Ọgba” bụ okwu Igbo a na-aghọta ngwa ngwa maka ebe oghere n’oké nkume ma ọ bụ n’ala mmadụ pụrụ izobe.
- source_word: ὀπαῖς τῆς γῆς
  choice: n'oghere ndị dị n'ala
  rationale: ὀπή pụtara oghere ma ọ bụ mgbawa, ebe τῆς γῆς na-akọwa ha dị ka oghere ala. Nhọrọ a bụ Igbo eke ma na-echekwa ihe oyiyi ahụ.
theological_decisions:
- issue: Ihe “ụwa na-ekwesịghị ha” na-arụtụ aka na ya na ike okwu ahụ
  choice: 'E debere ya dị ka ikpe gbasara àgwà na uru: ụwa/ọha mmadụ ekwesịghị ndị kwesịrị ntụkwasị obi ahụ.'
  alternative: Ịkọwa ya naanị dị ka na ndị okwukwe ahụ na ụwa enweghị ike ibikọ ọnụ.
  rationale: Okwu Grik ahụ na-ekpe ụwa ikpe n’ụzọ siri ike ma na-egosi ịdị oké ọnụ ahịa nke ndị tara ahụhụ; ntụgharị a echekwaghị esemokwu ahụ n’enweghị ịgbakwụnye ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. Ahịrị mkpirisi abụọ ahụ na-ekewa okwu ikpe dị n’etiti amaokwu ahụ, ebe nkwughachi “n’...” na-eme ka ndepụta ebe ndị ahụ gara doo anya n’Igbo.
