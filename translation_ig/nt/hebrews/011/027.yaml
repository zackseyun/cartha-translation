revisions:
- from: Site n’okwukwe, ọ hapụrụ Ijipt[a], n’atụghị egwu iwe eze, n’ihi na o nọgidere na-eguzosi ike dị ka onye na-ahụ Onye ahụ a na-apụghị ịhụ anya[b].
  to: Site n’okwukwe, ọ hapụrụ Ijipt[a], n’atụghị egwu iwe eze; n’ihi na o diri, dị ka onye na-ahụ Onye a na-apụghị ịhụ anya[b].
  rationale: 'The revision retains the draft’s faithful handling of the disputed historical referent and the paradoxical wording about seeing the invisible One. It corrects the lexical footnote and uses “o diri” for a concise, natural rendering of ἐκαρτέρησεν. Footnote anchors remain attached to the relevant expressions: the historical note to “Ijipt” and the lexical alternative to “Onye a na-apụghị ịhụ anya.”'
  reviewer_model: gpt-5.6-terra
