language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: ig
  text: Site n’okwukwe, ọ hapụrụ Ijipt[a], n’atụghị egwu iwe eze; n’ihi na o diri, dị ka onye na-ahụ Onye a na-apụghị ịhụ anya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ akọwaghị ma nke a ọ na-ezo aka n’oge Mosis gbapụrụ n’ihu Fero (Ọpụpụ 2), ka ọ bụ n’oge ya na ụmụ Izrel si n’Ijipt pụọ (Ọpụpụ 12–14).
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsụgharị ya, “Onye a na-adịghị ahụ anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: Site n’okwukwe
  rationale: Ọ na-egosi ụzọ ma ọ bụ ihe mere Mosis ji mee ihe ahụ. Nke a kwekọrọ n’usoro okwu Hibru 11, bụ́ nke na-akọ ihe ndị mmadụ mere site n’okwukwe.
- source_word: κατέλιπεν
  choice: ọ hapụrụ
  rationale: Nke a bụ okwu Igbo doro anya ma dịkwa mfe maka ịpụ ma ọ bụ ịhapụ ebe; ọ naghị etinye echiche siri ike nke ịgbahapụ ihe kpamkpam.
- source_word: Αἴγυπτον
  choice: Ijipt
  rationale: Nke a bụ aha obodo Egypt a na-ejikarị eme ihe n’Igbo.
- source_word: μὴ φοβηθεὶς
  choice: n’atụghị egwu
  rationale: Ọ na-echekwa njikọ participle ahụ na ngwaa bụ isi ma na-ada ka Igbo nkịtị.
- source_word: τὸν θυμὸν τοῦ βασιλέως
  choice: iwe eze
  rationale: θυμός bụ iwe siri ike, ma “iwe” bụ okwu Igbo sara mbara ma kwesị ekwesị nke na-anaghị emebiga ike okwu Grik ahụ ókè.
- source_word: τὸν ἀόρατον
  choice: Onye ahụ a na-apụghị ịhụ anya
  rationale: Adjective ahụ nwere article ma na-arụ ọrụ dị ka aha onye. Nsụgharị a na-eme ka onye a na-ekwu banyere ya doo anya ma na-echekwa ọdịiche dị n’etiti ịhụ na ịbụ onye a na-apụghị ịhụ anya.
- source_word: ὡς ὁρῶν
  choice: dị ka onye na-ahụ
  rationale: Ọ na-echekwa ike ntụnyere nke ὡς na ihe atụ pụtara ìhè nke ịhụ Onye a na-apụghị ịhụ anya site n’okwukwe.
- source_word: ἐκαρτέρησεν
  choice: o nọgidere na-eguzosi ike
  rationale: καρτερέω na-egosi ntachi obi na iguzosi ike. Okwu a na-egosipụta ma ịdịgide ma nkwụsi ike n’Igbo nkịtị.
theological_decisions:
- issue: Ihe omume akụkọ ihe mere eme okwu “ọ hapụrụ Ijipt” na-ezo aka na ya
  choice: E kpebighị n’ahịrịokwu bụ isi ma ọ bụ mgbapụ Mosis na Ọpụpụ 2 ka ọ bụ oge o duuru Izrel pụọ n’Ijipt na Ọpụpụ 12–14.
  alternative: Ịkọwa ya kpọmkwem dị ka mgbapụ Mosis n’ihu Fero, ma ọ bụ dị ka ọpụpụ Izrel niile.
  rationale: Grik ahụ kwuru naanị na ọ hapụrụ Ijipt, ọ kọwaghị kpọmkwem ihe omume ọ bụ. Ya mere, nsụgharị ahụ na-echekwa nghọta abụọ ahụ kama idozi ihe ederede ahụ hapụrụ ghe oghe.
- issue: Ihe mgbagwoju anya nke ịhụ Onye a na-apụghị ịhụ anya
  choice: E chekwara okwu ahụ dị ka “onye na-ahụ Onye ahụ a na-apụghị ịhụ anya.”
  alternative: Ịkọwa ya n’ụzọ doro anya dị ka ịhụ Chineke naanị n’uche ma ọ bụ n’ọhụụ.
  rationale: Ederede Grik na-etinye “ịhụ” na “Onye a na-apụghị ịhụ anya” ọnụ n’amaghị kọwaa ụdị ịhụ ọ bụ; nsụgharị ahụ anaghị etinye nkọwa ozizi na-adịghị n’ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro okwu ahụ n’ụzọ eke n’Igbo, ma e chekwara ntụnyere na mgbagwoju anya dị n’ederede Grik.
