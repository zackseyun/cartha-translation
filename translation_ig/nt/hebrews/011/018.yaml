lexical_decisions:
- source_word: πρὸς ὃν ἐλαλήθη
  choice: onye a gwara
  rationale: Nke a na-egosipụta onye e ziri okwu ahụ, ma na-edobe usoro okwu nke na-ekwughị kpọmkwem onye kwuru ya.
- source_word: ὅτι
  choice: sị
  rationale: ‘Sị’ bụ ụzọ Igbo si webata ihe e kwuru kpọmkwem n’ụzọ dị mfe ma kwekọọ n’ọdịdị okwu ahụ.
- source_word: Ἐν Ἰσαὰκ
  choice: ndị sitere n’Ịsak
  rationale: N’ebe a, ἐν na-egosi usoro ọmụmụ e kwere ná nkwa site n’Ịsak, ọ bụghị nanị ịnọ ‘n’ime’ ya.
- source_word: κληθήσεταί
  choice: ka a ga-akpọ
  rationale: Nke a na-edobe ihe καλέω pụtara, ya bụ ịkpọ ma ọ bụ ịgụnye ndị ahụ dị ka ụmụ Ebreham.
- source_word: σοι σπέρμα
  choice: ụmụ gị
  rationale: σπέρμα bụ aha mkpokọta na-ekwu maka ụmụ ma ọ bụ ụmụ ụmụ; ‘ụmụ gị’ bụ okwu Igbo doro anya ma dị ndụ nke na-edobe echiche mkpokọta ahụ.
theological_decisions:
- issue: Otu e si ghọta ahịrị ọmụmụ e kwere Ebreham ná nkwa
  choice: Ọ bụ ndị sitere n’Ịsak ka a ga-akpọ ụmụ gị
  alternative: N’ime Ịsak ka a ga-akpọ mkpụrụ gị
  rationale: Nhọrọ bụ isi na-eme ka o doo anya na e si n’Ịsak amata ahịrị ụmụ e kwere ná nkwa, n’ebugharịghị okwu ahụ gaa n’ozizi ọzọ. Ihe odide ala peeji na-echekwa ọdịdị okwu Grik nke dị nso karịa.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ugwu ma dị mfe nghọta. ‘Ụmụ gị’ ka ahọrọ kama ‘mkpụrụ gị’ n’ahịrị bụ isi ka a ghara ịghọta mkpụrụ osisi ma ọ bụ mkpụrụ akụ; e debere ‘mkpụrụ’ n’ihe odide ala peeji iji gosi ihe σπέρμα pụtara n’ụzọ nkịtị.
