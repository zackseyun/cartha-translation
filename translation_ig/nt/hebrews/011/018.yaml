review_pass:
  verdict: revise
  source_fidelity: 'The main rendering changes the quoted predicate substantially: “ndị sitere n’Ịsak ... ụmụ gị” makes people descended from Isaac the subject who are called Abraham’s children. The Greek instead says that Abraham’s collective “seed/offspring” will be called or designated in Isaac. The revised wording retains the Greek passive and its lineage-designating sense without adding an interpretation.'
  naturalness: “Onye a gwara, sị” is natural Standard Igbo in this compact narrative context. “Mkpụrụ gị” is an established formal/Biblical Igbo expression for offspring or descendants and is appropriate in a direct quotation; the footnote supplies a clearer contemporary alternative.
  terminology: Ịsak is correctly spelled. “Mkpụrụ” appropriately preserves the collective singular force of σπέρμα, while “a ga-akpọ” preserves the passive κληθήσεται. The revised footnote offers “ụmụ/ndị ga-esi gị pụta” as an explanatory lexical alternative rather than treating Isaac’s descendants as the grammatical subject.
  issues:
  - severity: high
    issue: The quotation reverses the syntactic relationship of Isaac and Abraham’s offspring.
    rationale: “Ọ bụ ndị sitere n’Ịsak ka a ga-akpọ ụmụ gị” means, in effect, that those who come from Isaac will be called Abraham’s children. In Greek, σπέρμα (“offspring”) is the subject, and ἐν Ἰσαὰκ identifies Isaac as the locus/line through which that offspring is called.
  - severity: medium
    issue: The existing footnote calls its alternative ‘closer to the original’ but its wording is the form that should be used in the main text for source fidelity.
    rationale: The main text should not retain an interpretive syntactic recasting when a concise, idiomatic formal rendering is available.
