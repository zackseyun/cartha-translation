  text: τοῦ θεοῦ περὶ ἡμῶν κρεῖττόν τι προβλεψαμένου, ἵνα μὴ χωρὶς ἡμῶν τελειωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/040.yaml
  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: ig
  text: n’ihi na Chineke eburula ụzọ kwadebeere anyị ihe ka mma[a], ka e wee ghara ime ka ha zuo oke ma e wezụga anyị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Chineke eburula ụzọ hụ ihe ka mma maka anyị.” Okwu Grik ahụ nwere ike ịpụta ibu ụzọ hụ ihe ma ọ bụ ibu ụzọ kwadebe ya; ihe gbara ya gburugburu na-akwado echiche nke ndokwa Chineke.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka e wee ghara ime ka ha zuo oke n’enweghị anyị,” ma ọ bụ, “ka ha ghara iru na mmezu ma e wezụga anyị.”
    reason: alternative_reading
lexical_decisions:
- source_word: προβλεψαμένου
  choice: eburula ụzọ kwadebere
  rationale: N’ọnọdụ a, okwu a na-egosi na Chineke buru ụzọ hụ ma hazie ihe ahụ; “kwadebere” na-eme ka echiche nke ndokwa ya pụta ìhè, ọ bụghị nanị ịhụ ihe ga-eme n’ọdịnihu.
- source_word: κρεῖττόν τι
  choice: ihe ka mma
  rationale: Nke a na-edobe okwu bụ́ isi a na-ekwughachi n’akwụkwọ Ndị Hibru, ya bụ “ka mma,” ma na-asụgharị τι n’ụzọ Igbo dị mfe.
- source_word: περὶ ἡμῶν
  choice: anyị
  rationale: N’ime ahịrịokwu “kwadebere anyị,” nke a na-egosi na ihe Chineke kwadebere bụ maka anyị ma ọ bụ na o mere ya ebe anyị nọ n’uche.
- source_word: ἵνα μὴ
  choice: ka a ghara
  rationale: Nke a na-edobe echiche nzube ma ọ bụ ihe si na ndokwa Chineke pụta.
- source_word: χωρὶς ἡμῶν
  choice: ma e wezụga anyị
  rationale: Nke a na-egosi na izu oke ha agaghị eme n’ụzọ kewapụrụ ha n’ebe anyị nọ.
- source_word: τελειωθῶσιν
  choice: ime ka ha zuo oke
  rationale: “Zuo oke” na-edobe ma echiche nke iru mmezu ma nke izu oke, n’ebughị ụzọ kpebie na ọ bụ naanị izu oke nke omume ma ọ bụ naanị njedebe oge.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: A tụgharịrị genitive absolute ahụ n’ụzọ Igbo dị ndụ site n’iji “n’ihi na Chineke...”
theological_decisions:
- issue: Ihe τελειωθῶσιν pụtara n’echiche akụkọ nzọpụta dị n’akwụkwọ Ndị Hibru
  choice: ime ka ha zuo oke
  alternative: ime ka ha ruo na mmezu
  rationale: Nhọrọ a na-ahapụ okwu ahụ ka ọ buru ma echiche izu oke ma echiche iru mmezu, n’akọwaghị ya naanị dị ka izu oke omume ma ọ bụ naanị mmezu nke oge.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E ji “eburula ụzọ kwadebere” gosipụta ndokwa Chineke, ebe “ime ka ha zuo oke” na-echekwa nghọta sara mbara nke τελειόω. E debere akara nkọwa ala peeji [a] na [b] n’isi ederede.
