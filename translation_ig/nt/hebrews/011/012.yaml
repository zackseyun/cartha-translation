  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: ig
  text: N’ihi ya, site n’otu nwoke[a]—onye ahụ dịkwa ka onye nwụrụ anwụ—ka a mụrụ ọtụtụ ụmụ, ndị dị ọtụtụ dị ka kpakpando nke eluigwe, dịkwa ka ájá a na-apụghị ịgụta ọnụ nke dị n’akụkụ osimiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ okwu Grik si kwuo kpọmkwem, “site n’otu onye, na onye ahụ e meworo ka ọ bụrụ onye nwụrụ anwụ.” N’okwu a, ọ na-ekwu n’ụzọ ihe atụ banyere Ebreham, bụ́ onye nká ya mere ka ọ gafee afọ nwoke na-enwekarị ike ịmụ ụmụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’okwu bu ụzọ banyere okwukwe na ọmụmụ nwa ahụ.
- source_word: ἀφ’ ἑνὸς
  choice: site n’otu nwoke
  rationale: Ụdị okwu Grik bụ nke nwoke, ihe gbara ya gburugburu na-egosikwa na ọ bụ Ebreham ka a na-ekwu maka ya.
- source_word: ἐγεννήθησαν
  choice: ka a mụrụ ụmụ ụmụ
  rationale: Na-egosi na ụmụ ụmụ Ebreham sitere n’aka ya pụta; okwu a bụ nke Igbo nkịtị ma doo anya.
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: onye ahụkwa dị ka onye nwụrụ anwụ
  rationale: Na-echekwa ihe atụ siri ike nke Grik n’enweghị ikwu na Ebreham nwụrụ n’ezie; ihe a na-ekwu bụ ọnọdụ ya n’ihi nká n’ihe gbasara ịmụ nwa.
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: dị ọtụtụ dị ka kpakpando nke eluigwe
  rationale: Na-echekwa ntụnyere ahụ na echiche nke ịdị ọtụtụ.
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης
  choice: dị ka ájá ... nke dị n’akụkụ osimiri
  rationale: Ọ bụ ụzọ Igbo si ekwu ájá dị n’ọnụ ma ọ bụ n’akụkụ oke osimiri n'ụzọ nghọta.
- source_word: ἀναρίθμητος
  choice: a na-apụghị ịgụta ọnụ
  rationale: Na-enye echiche nke ihe karịrị ike mmadụ ịgụta n'ụzọ doro anya ma dịkwa ugwu.
theological_decisions:
- issue: Onye ἀφ’ ἑνὸς na-ezo aka na ya
  choice: E mere ka o doo anya na ọ bụ otu nwoke, ya bụ Ebreham.
  alternative: site n’otu onye; site n’otu
  rationale: Ụdị nwoke nke okwu Grik na ihe gbara amaokwu ahụ gburugburu na-egosi Ebreham, ma nkọwa a adịghị etinye ozizi ọzọ n’ime ederede.
- issue: Ike okwu νενεκρωμένου
  choice: dị ka onye nwụrụ anwụ
  alternative: onye e mere ka ọ nwụọ; onye nwụrụ anwụ n’ezie
  rationale: Okwu ahụ bụ ihe atụ banyere nká Ebreham na enweghịzi ike ịmụ nwa dịka mmadụ si eme, ọ bụghị ọnwụ nkịtị. Nsụgharị a na-echekwa ma ihe atụ ahụ ma ọrụ ebube ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. E ji “ụmụ ụmụ” kọwaa ọtụtụ ụmụ sitere n’ezinụlọ Ebreham; e debere ntụnyere kpakpando na ájá na ụda nke nkwa Akwụkwọ Nsọ.
