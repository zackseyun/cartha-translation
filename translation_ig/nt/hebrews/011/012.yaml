revisions:
- from: N’ihi ya, site n’otu nwoke[a]—onye ahụkwa dị ka onye nwụrụ anwụ—ka a mụrụ ụmụ ụmụ ndị dị ọtụtụ dị ka kpakpando nke eluigwe, dịkwa ka ájá a na-apụghị ịgụta ọnụ nke dị n’akụkụ osimiri.
  to: N’ihi ya, site n’otu nwoke[a]—onye ahụ dịkwa ka onye nwụrụ anwụ—ka a mụrụ ọtụtụ ụmụ, ndị dị ọtụtụ dị ka kpakpando nke eluigwe, dịkwa ka ájá a na-apụghị ịgụta ọnụ nke dị n’akụkụ osimiri.
  rationale: The revision preserves the Greek syntax and its deliberate metaphor of Abraham’s life-force being effectively exhausted while avoiding the false implication that the resulting offspring were only his grandchildren. The footnote is recast to distinguish a close rendering of the Greek perfect passive from its contextual metaphorical sense.
