  text: For by this the elders received approval[a][b][c].
translation:
  language: ig
  text: N’ihi na ọ bụ site na nke a ka ndị mgbe ochie natara ezi àmà[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘a jara ha mma’ ma ọ bụ ‘e nyere ha àmà dị mma.’ Ngwaa Grik ahụ pụtara na mmadụ natara àmà ọma ma ọ bụ nkwado.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, site n’okwukwe, dịka a kọwara ya n’amaokwu bu ya ụzọ.
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, ‘ndị ọgbọ gara aga.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: site na nke a
  rationale: Nkebiokwu a na-ezo azụ n’okwukwe dị n’amaokwu 1 ma na-egosi ụzọ e si nata ihe ahụ; ‘site na nke a’ na-echekwa ntụaka ahụ n’enweghị itinye ‘okwukwe’ ozugbo n’ahịrịokwu.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-akọwa ma na-akwado ihe e kwuru tupu ya.
- source_word: ἐμαρτυρήθησαν
  choice: natara ezi àmà
  rationale: Ụdị passive nke μαρτυρέω ebe a pụtara na e nyere ha àmà dị mma ma ọ bụ nkwado; okwu a na-echekwa echiche nke ‘àmà’ nke a na-eji ugboro ugboro n’isiakwụkwọ ahụ, n’achịghị kpọmkwem onye nyere ya.
- source_word: οἱ πρεσβύτεροι
  choice: ndị mgbe ochie
  rationale: N’ebe a okwu ahụ abụghị naanị ndị okenye nwere ọkwa, kama ọ na-ezo aka n’ụmụ mmadụ nke ọgbọ ndị gara aga; ‘ndị mgbe ochie’ bụ Igbo doro anya ma kwekọọ n’ọnọdụ a.
theological_decisions:
- issue: Ihe ταύτῃ na-ezo aka na ya
  choice: E debere ya dịka ‘nke a,’ nke na-ezo n’ụzọ nkịtị n’okwukwe a kọwara n’amaokwu 1.
  alternative: Ịsụgharị ya ozugbo dịka ‘site n’okwukwe.’
  rationale: Ụdị nwanyị otu nke ταύτῃ kwekọrọ na πίστις (‘okwukwe’), ma ide ‘nke a’ na-echekwa usoro okwu Grik na ntakịrị ohere nke ntụaka sara mbara n’ihe niile a kọwara n’amaokwu 1.
- issue: Onye nyere ezi àmà ahụ
  choice: Ahịrịokwu ahụ ahaghị Chineke aha dịka onye nyere àmà ahụ.
  alternative: ‘Chineke nyere ndị mgbe ochie nkwado.’
  rationale: Ọnọdụ sara mbara nke isiakwụkwọ ahụ na-egosi nkwado Chineke, ma passive Grik n’amaokwu a ekwughị onye ahụ kpọmkwem; ya mere, nsụgharị ahụ anaghị etinye aha na-adịghị n’ederede.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Ezi àmà’ na-echekwa isi okwu gbasara ịgba àmà, ebe ‘ndị mgbe ochie’ na-egbochi nghọtahie na ọ bụ naanị ndị isi ụka ma ọ bụ ndị agadi ka a na-ekwu maka ha.
