revisions:
- from: Ma ma e nweghị okwukwe[a], ọ gaghị ekwe omume ime ihe na-atọ ya ụtọ; n’ihi na onye na-abịakwute Chineke aghaghị ikwere na ọ dị adị[b], nakwa na ọ na-abụrụ ndị ji ịnụ ọkụ n’obi na-achọ ya onye na-enye ụgwọ ọrụ[c].
  to: Ma e wezụga okwukwe[a], ọ gaghị ekwe omume ịmasị Chineke; n’ihi na onye na-abịakwute Chineke aghaghị ikwere na Chineke dị[b], nakwa na ọ na-abụrụ ndị na-achọsi ya ike onye na-enye ụgwọ ọrụ[c].
  rationale: The revision removes an accidental duplicated connective, makes the object of pleasing explicit, and improves idiomatic Standard Igbo for earnest seeking. It retains the source’s two coordinated content clauses, the necessity expressed by δεῖ, and the contextual force of γίνεται. Footnote anchors remain attached to the relevant expressions and all footnote markers are retained.
