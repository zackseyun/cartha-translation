id: HEB.11.6
reference: Hebrews 11:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: ig
  text: Ma e wezụga okwukwe[a], ọ gaghị ekwe omume ịmasị Chineke; n’ihi na onye na-abịakwute Chineke aghaghị ikwere na Chineke dị[b], nakwa na ọ na-abụrụ ndị na-achọsi ya ike onye na-enye ụgwọ ọrụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ntụkwasị obi.” N’ebe ụfọdụ, πίστις nwekwara ike ịpụta “iguzosi ike n’ihe,” ma nkọwa dị n’amaokwu a lekwasịrị anya n’ikwere na Chineke.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na ọ dị.” Okwu Grik ahụ dị mkpụmkpụ otu a.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “na ọ bụ onye na-enye ụgwọ ọrụ,” ma ọ bụ “na a na-achọpụta na ọ bụ onye na-enye ụgwọ ọrụ.” N’ụzọ nkịtị, Grik nwere ike ịpụta “ọ na-aghọ” ma ọ bụ “ọ na-abụrụ”; n’ebe a, ọ na-egosi ihe Chineke na-abụrụ ndị na-achọ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πίστεως
  choice: Ma ma e nweghị okwukwe
  rationale: χωρίς na-egosi enweghị ihe, ebe δέ bụ njikọ dị nro. “Ma ma e nweghị okwukwe” na-ejikọta amaokwu a na ihe ndị bu ya ụzọ n'ụzọ nkịtị.
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: ọ gaghị ekwe omume ime ihe na-atọ ya ụtọ
  rationale: Nke a na-egosipụta usoro impersonal adjective na infinitive nke Grik n’Igbo doro anya; “ya” na-ezo aka na Chineke nke a kpọrọ aha ozugbo n’ahịrị sochirinụ.
- source_word: πιστεῦσαι γὰρ δεῖ
  choice: n’ihi na ... aghaghị ikwere
  rationale: γάρ na-enye ihe kpatara okwu ahụ, δεῖ na-egosikwa mkpa siri ike; “aghaghị ikwere” na-echekwa ike ahụ.
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: onye na-abịakwute Chineke
  rationale: Present participle ahụ na-akọwa onye na-abịaru Chineke nso; “na-abịakwute” bụ Igbo nkịtị ma na-echekwa mmegharị mmekọrịta ahụ.
- source_word: ὅτι ἔστιν
  choice: na ọ dị adị
  rationale: Nke a na-eme ka nkwenye banyere ịdị adị Chineke doo anya n’Igbo, ma na-edebe nsụgharị dị mkpụmkpụ “na ọ dị” na nkọwa ala peeji.
- source_word: τοῖς ἐκζητοῦσιν αὐτόν
  choice: ndị ji ịnụ ọkụ n’obi na-achọ ya
  rationale: ἐκζητέω siri ike karịa ζητέω nkịtị; okwu a na-egosi ịchọsi ike na nke sitere n’obi.
- source_word: μισθαποδότης γίνεται
  choice: ọ na-abụrụ ... onye na-enye ụgwọ ọrụ
  rationale: “Na-abụrụ” na-echekwa ike γίνεται karịa copula nkịtị, ma na-ekwu n’Igbo eke ihe Chineke na-abụrụ ndị na-achọ ya, n’enweghị ịtụ aro na agwa Chineke gbanwere.
theological_decisions:
- issue: Ihe πίστις pụtara n’ebe a
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: Nkọwa ozugbo banyere ikwere na Chineke na-akwado “okwukwe” ma ọ bụ “ntụkwasị obi,” ọ bụghị isi echiche nke ikwesị ntụkwasị obi; a hapụrụ nhọrọ ndị ọzọ na nkọwa ala peeji.
- issue: Ike γίνεται n’okwu gbasara Chineke dịka onye na-enye ụgwọ ọrụ
  choice: ọ na-abụrụ ... onye na-enye ụgwọ ọrụ
  alternative: ọ bụ onye na-enye ụgwọ ọrụ; a na-achọpụta na ọ bụ onye na-enye ụgwọ ọrụ
  rationale: Nhọrọ a na-echekwa ngwaa γίνεται na esemokwu ya, ma ọ naghị ekwu na ọdịdị ma ọ bụ agwa Chineke na-agbanwe.
- issue: Ihe ὅτι ἔστιν na-ekwusi ike
  choice: na ọ dị adị
  alternative: na ọ dị
  rationale: Isi okwu ahụ bụ eziokwu nke ịdị Chineke; e debeghị ya n’ụzọ ga-agbakwunye nkọwa ụka pụrụ iche.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E zere okwu ụka nke otu ngalaba pụrụ iche. E tinyere akara nkọwa ala peeji [a], [b], na [c] n’ebe okwu ha metụtara dị n’isi ederede.
