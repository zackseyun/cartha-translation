revisions:
- from: Ọ bụ site n’okwukwe ka ha si gafee Oké Osimiri Uhie[a] dị ka a ga-asị na ha na-agafe n’ala kpọrọ nkụ; ma mgbe ndị Ijipt nwara ime otu ihe ahụ, mmiri loro ha.
  to: Ọ bụ site n’okwukwe ka ha si gafee Oké Osimiri Uhie[a] dị ka ha si agafe n’ala kpọrọ nkụ; ndị Ijipt, ebe ha nwara ime otu ihe ahụ, a loro ha.
  rationale: The revision keeps the Greek comparison and completed event clearer in Standard Igbo, and it renders καταπίνω as an agent-unspecified passive rather than adding “water” as the explicit subject. The footnote remains anchored to “Oké Osimiri Uhie” and more precisely identifies the alternate designation as arising from the Hebrew name in Exodus.
  reviewer_model: gpt-5.6-terra
