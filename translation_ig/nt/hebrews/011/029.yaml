  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: ig
  text: Ọ bụ site n’okwukwe ka ha si gafee Oké Osimiri Uhie[a] dị ka ha si agafe n’ala kpọrọ nkụ; ndị Ijipt, ebe ha nwara ime otu ihe ahụ, a loro ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Oké Osimiri Ahịhịa Amị.” Ihe odide Grik n’ebe a kwuru “Oké Osimiri Uhie” (Ἐρυθρὰν Θάλασσαν), ma n’akwụkwọ Ọpụpụ, ụfọdụ na-atụgharị aha Hibru nke ebe ahụ dịka “Oké Osimiri Ahịhịa Amị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: site n’okwukwe
  rationale: Dative a na-egosi ụzọ e si mee ihe; “okwukwe” na-edobekwa usoro okwu a na-emegharị ugboro ugboro n’Ndị Hibru 11.
- source_word: διέβησαν
  choice: ha si gafee
  rationale: Ọ na-egosi isi n’otu akụkụ gafee ruo n’akụkụ nke ọzọ; nke a bụ okwu Igbo doro anya ma dịkwa eke.
- source_word: Ἐρυθρὰν Θάλασσαν
  choice: Oké Osimiri Uhie
  rationale: Nke a na-asụgharị kpọmkwem aha Grik dị n’amaokwu a; a debere “Oké Osimiri Ahịhịa Amị” dị ka nhọrọ ọzọ n’ala ala peeji.
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: dị ka a ga-asị na ha na-agafe n’ala kpọrọ nkụ
  rationale: Nke a na-echekwa ntụnyere ὡς na echiche nke ịgafe n’ala na-enweghị mmiri, n’Igbo na-aga were were.
- source_word: πεῖραν λαβόντες
  choice: mgbe ... nwara ime otu ihe ahụ
  rationale: Akpaalaokwu Grik pụtara ịnwa ime ihe; “otu ihe ahụ” na-ezo aka n’ịgafe ahụ n’enweghị mgbagwoju anya.
- source_word: οἱ Αἰγύπτιοι
  choice: ndị Ijipt
  rationale: Aha obodo/agbụrụ a na-ezo aka n’òtù ndị Ijipt chụrụ ha n’akụkọ Ọpụpụ.
- source_word: κατεπόθησαν
  choice: mmiri loro ha
  rationale: Ọ na-echekwa ihe atụ doro anya nke καταπίνω, ‘ilo,’ ma mee ka onye mere ilo ahụ pụta ìhè n’ụzọ kwekọrọ n’ihe a na-ekwu banyere oké osimiri.
theological_decisions:
- issue: Nsụgharị πίστις n’Ndị Hibru 11
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: Usoro Πίστει a na-emegharị n’isiakwụkwọ a na-eme “okwukwe” ka ọ bụrụ okwu kacha kwekọọ n’isiokwu ya; a naghị amanye echiche nke ‘ikwesị ntụkwasị obi’ n’ebe a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta, mee ya. E chekwara nkwughachi echiche nke okwukwe, ntụnyere nke ala kpọrọ nkụ, na ihe atụ siri ike nke mmiri ilo ndị Ijipt.
