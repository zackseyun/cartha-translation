    text: Ma ọ bụ, “Oké Osimiri Ahịhịa Amị.” Ihe odide Grik n’ebe a kwuru “Oké Osimiri Uhie” (Ἐρυθρὰν Θάλασσαν), ma n’akwụkwọ Ọpụpụ, ụfọdụ na-atụgharị aha Hibru nke ebe ahụ dịka “Oké Osimiri Ahịhịa Amị.”
    reason: lexical_alternative
  revision_rationale: The revision keeps the Greek comparison and completed event clearer in Standard Igbo, and it renders καταπίνω as an agent-unspecified passive rather than adding “water” as the explicit subject. The footnote remains anchored to “Oké Osimiri Uhie” and more precisely identifies the alternate designation as arising from the Hebrew name in Exodus.
