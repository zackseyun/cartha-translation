  text: Ἔστιν δὲ πίστις ἐλπιζομένων ὑπόστασις, πραγμάτων ἔλεγχος οὐ βλεπομένων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/001.yaml
  text: Faith is the assurance of things hoped for[b][a], the proof of things not seen.
translation:
  language: ig
  text: Ma okwukwe bụ nkwenye siri ike[a] banyere ihe ndị a na-atụ anya, bụrụkwa ihe akaebe[b] banyere ihe ndị a na-adịghị ahụ anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ntọala” ma ọ bụ “eziokwu/ịdị adị n’ezie” nke ihe ndị a na-atụ anya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nkwenye” ma ọ bụ “ihe na-egosi eziokwu” banyere ihe ndị a na-adịghị ahụ anya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστις
  choice: okwukwe
  rationale: N'okwu a, ọ na-egosi ntụkwasị obi mmadụ nwere n'ebe Chineke na nkwa ya dị; “okwukwe” bụ okwu Igbo a maara nke ọma ma kwesịkwa ekwesị n'akwụkwọ nsọ.
- source_word: δὲ
  choice: ma
  rationale: δέ bụ njikọ dị nro nke na-ebuga okwu gaa n'ihu; “ma” na-echekwa njikọ ahụ n'enweghị itinye echiche oge nke okwu dị ka “ugbu a” pụrụ iweta.
- source_word: ἐλπιζομένων
  choice: ihe ndị a na-ele anya ha
  rationale: Nkebi a na-ezo aka n'ihe mmadụ nwere olileanya inweta; nsụgharị a bụ nke okike n'Igbo ma na-echekwa ihe olileanya ahụ lekwasịrị anya na ya.
- source_word: ὑπόστασις
  choice: obi ike siri ike
  rationale: N'ebe a ὑπόστασις nwere ike ịpụta nkwenye ma ọ bụ ntọala siri ike. “Obi ike siri ike” na-enye echiche nke assurance/confidence n'asụsụ Igbo dị mfe, ebe a na-edebe nhọrọ ndị ọzọ n'okpuru ala peeji.
- source_word: πραγμάτων
  choice: ihe ndị
  rationale: πρᾶγμα bụ okwu sara mbara maka ihe ma ọ bụ ọnọdụ; “ihe ndị” na-echekwa ịdị obosara ya na nhazi ahịrị abụọ ahụ.
- source_word: ἔλεγχος
  choice: ihe akaebe
  rationale: ἔλεγχος nwere ike ịpụta ihe akaebe, ngosipụta doro anya, ma ọ bụ nkwenye nke ihe akaebe na-eweta. “Ihe akaebe” na-echekwa ike evidenshịal ya n'Igbo a na-aghọta ngwa ngwa.
- source_word: οὐ βλεπομένων
  choice: ihe ndị a na-adịghị ahụ anya
  rationale: Nsụgharị a na-echekwa njụ na echiche nke ihe ndị na-abụghị ihe a na-ahụ ugbu a.
theological_decisions:
- issue: Ihe ὑπόστασις pụtara na Ndị Hibru 11:1
  choice: obi ike siri ike
  alternative: ntọala; ihe bụ eziokwu n'onwe ya
  rationale: N'ọnọdụ agbamume nke isiakwụkwọ a, okwu ahụ nwere ike igosi ntụkwasị obi siri ike. A naghị eme ka ọ bụrụ naanị okwu nkà ihe ọmụma; a na-edebe obosara okwu Grik ahụ na ihe odide ala peeji.
- issue: Nsụgharị πίστις
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N'ebe a, okwu ahụ bụ ọnọdụ ntụkwasị obi nke onye kwere ekwe, ọ bụghị kpọmkwem ikwesị ntụkwasị obi nke onye ọzọ. “Okwukwe” bụ nsụgharị kacha kwekọọ n'ọnọdụ ahụ.
- issue: Ihe ἔλεγχος pụtara
  choice: ihe akaebe
  alternative: nkwenye siri ike; ngosipụta doro anya
  rationale: Okwu Grik ahụ nwere ike ilekwasị anya n'ihe na-egosi eziokwu ma ọ bụ na nkwenye nke ihe ahụ na-eweta. Isiokwu ahụ na-ahọrọ akụkụ ihe akaebe ma ghara ịgọnahụ akụkụ nke nkwenye.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrị abụọ ahụ na-edobe myirịta nke Grik. E tinyere akara ala peeji [a] na [b] ozugbo n'akụkụ nkebi ha na-akọwa.
