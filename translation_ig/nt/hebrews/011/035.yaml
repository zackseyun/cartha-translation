id: HEB.11.35
reference: Hebrews 11:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: ig
  text: Ụmụ nwanyị natara ndị ha nwụrụ anwụ ọzọ site ná mbilite n’ọnwụ; ma ndị ọzọ ka a tara ha ahụhụ nke ukwuu,[a] ha anabataghị ntọhapụ,[b] ka ha wee nweta mbilite n’ọnwụ ka mma.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ngwaa a sụgharịrị “a tara ha ahụhụ nke ukwuu” jikọtara ya na mmekpa ahụ siri ike, ikekwe site n’iti mmadụ ihe n’elu ihe yiri ịgbà ma ọ bụ ihe a na-adọ mmadụ n’elu; ụzọ e si mee ya kpọmkwem edoghị anya.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị “ntọhapụ” dị ka “nnapụta.” Okwu Grik a n’ebe a na-ekwu maka ịtọhapụ mmadụ ná mmekpa ahụ ma ọ bụ n’ọnwụ, ọ bụghị iwu na ọ pụtara mgbapụta n’echiche nzọpụta.
    reason: lexical_alternative
  - marker: c
    text: “Mbilite n’ọnwụ ka mma” dị iche n’ịkpọlite ndị nwụrụ anwụ ka ha laghachi ndụ mmadụ na-anwụ anwụ, nke e kwuru ná mmalite amaokwu a; n’ebe a, ọ na-egosi olileanya mbilite n’ọnwụ dị elu nke gafere ọnwụ.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλαβον
  choice: natara ... ọzọ
  rationale: N’ọnọdụ a, ọ pụtara na ụmụ nwanyị nataghachiri ndị nke ha nwụrụ anwụ, ọ bụghị nanị na ha ‘natara’ ha.
- source_word: γυναῖκες
  choice: Ụmụ nwanyị
  rationale: Okwu Grik a na-ekwu maka ụmụ nwanyị n’ozuzu, ọ bụghị naanị ndị nwunye.
- source_word: ἐξ ἀναστάσεως
  choice: site ná mbilite n’ọnwụ
  rationale: Nke a na-egosi ụzọ ma ọ bụ ihe mere ndị nwụrụ anwụ ji laghachikwute ha; nsụgharị ahụ bụ Igbo sitere n’ọnụ ma na-edobe echiche isi mmalite dị na ἐξ.
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: ndị nke ha nwụrụ anwụ
  rationale: Nke a bụ ụzọ doro anya e si egosi ndị ha hụrụ n’anya nwụrụ anwụ, n’enweghị ịgbakwunye ụdị mmekọrịta a na-akọwaghị.
- source_word: ἄλλοι δὲ
  choice: ma e nwere ndị ọzọ
  rationale: δέ na-eweta ọdịiche dị n’etiti ndị natara ndị nwụrụ anwụ ha na ndị nọgidere na-ata ahụhụ.
- source_word: ἐτυμπανίσθησαν
  choice: a tara ahụhụ nke ukwuu
  rationale: Ngwaa ahụ na-egosi mmekpa ahụ siri ike, ma ụdị ngwa ma ọ bụ usoro e ji mee ya edoghị anya; ya mere, a zere ịkọwa ya kpọmkwem karịa ihe odide ahụ kwadoro.
- source_word: οὐ προσδεξάμενοι
  choice: ha ekweghị ka
  rationale: Nkebi a na-egosi na ha jụrụ ihe e nyere ha; okwu Igbo a na-eme ka ajụjụ ahụ doo anya.
- source_word: τὴν ἀπολύτρωσιν
  choice: a tọhapụ ha
  rationale: N’ebe a, okwu ahụ na-ekwu maka ịtọhapụ ha ná mmekpa ahụ ma ọ bụ n’ọnwụ, ọ bụghị kpọmkwem mgbapụta n’echiche nzọpụta.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Ụdị okwu a na-egosi ebumnuche ha ji jụ ka a tọhapụ ha.
- source_word: κρείττονος ἀναστάσεως
  choice: mbilite n’ọnwụ ka mma
  rationale: κρείττων na Hibru na-enwekarị echiche ‘ka mma’; nke a na-edobe ntụnyere ahụ n’enweghị ịkọwa ihe niile gbasara ụdị mbilite n’ọnwụ ahụ.
- source_word: τύχωσιν
  choice: ha wee nweta
  rationale: τυγχάνω n’ebe a pụtara inweta ma ọ bụ iru ihe a na-atụ anya ya.
theological_decisions:
- issue: Ihe ἀπολύτρωσιν pụtara n’ọnọdụ a
  choice: ịtọhapụ ha ná mmekpa ahụ ma ọ bụ n’ọnwụ
  alternative: mgbapụta n’echiche sara mbara nke nzọpụta
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ekwu maka ndị a na-akpagbu jụrụ ohere ịgbanahụ ahụhụ ka ha wee nọgide na-ekwesị ntụkwasị obi. ‘A tọhapụ ha’ na-edobe echiche ahụ n’etinyeghị ozizi mgbapụta nke ihe odide ahụ na-ekwughị kpọmkwem.
- issue: Ike okwu ‘mbilite n’ọnwụ ka mma’ nwere
  choice: mbilite n’ọnwụ nke karịrị nlọghachi nwa oge n’ụdị ndụ mmadụ na-anwụ anwụ
  alternative: nanị mbilite n’ọnwụ dị mma karịa, n’enweghị ntụnyere doro anya na nkebi mbụ
  rationale: Nkebi mbụ na-ekwu banyere ndị nwụrụ anwụ e mere ka ha dịghachi ndụ, ebe nkebi nke abụọ na-ekwu banyere ndị jụrụ ntọhapụ n’ihi olileanya dị elu. Nsụgharị ahụ na-edobe ọdịiche ahụ ma ghara ịkọwa usoro mbilite n’ọnwụ karịa ihe odide ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị nke ha nwụrụ anwụ” iji zere ịkọwa ha dịka ụmụ ma ọ bụ ndị ikwu kpọmkwem mgbe Grik ekwughị nke ahụ. E tinyere akara ukwu [a], [b], na [c] n’ebe okwu nke ọ bụla metụtara dị n’ahịrị isi.
