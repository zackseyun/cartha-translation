revisions:
- from: Ụmụ nwanyị natara ndị nke ha nwụrụ anwụ ọzọ site ná mbilite n’ọnwụ; ma e nwere ndị ọzọ a tara ahụhụ nke ukwuu,[a] ha ekweghị ka a tọhapụ ha,[b] ka ha wee nweta mbilite n’ọnwụ ka mma.[c]
  to: Ụmụ nwanyị natara ndị ha nwụrụ anwụ ọzọ site ná mbilite n’ọnwụ; ma ndị ọzọ ka a tara ha ahụhụ nke ukwuu,[a] ha anabataghị ntọhapụ,[b] ka ha wee nweta mbilite n’ọnwụ ka mma.[c]
  rationale: The revision improves idiomatic Standard Igbo and makes the passive suffering and refused release more explicit, while preserving the source text’s contrast, purpose clause, and ambiguity about the precise torture method.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:29:43Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the principal contrast: women received their dead back through resurrection, whereas others endured torture and declined an offered release in hope of a better resurrection. The revised wording retains the Greek purpose relation and does not over-specify the uncertain method denoted by ἐτυμπανίσθησαν.'
  naturalness: Several expressions can be made more idiomatic in Standard Igbo. “Ndị nke ha nwụrụ anwụ” is less natural than “ndị ha nwụrụ anwụ,” and “a tara ahụhụ” is clearer with the affected object expressed (“a tara ha ahụhụ”). “Ntọhapụ” naturally renders the offered release as a noun object of “anabataghị.”
  terminology: “Mbilite n’ọnwụ,” “ntọhapụ,” and “mbilite n’ọnwụ ka mma” are suitable. The revised footnotes maintain the distinction between temporary restoration to mortal life and the better resurrection without imposing further doctrinal detail.
  issues:
  - severity: low
    issue: The phrase “ndị nke ha nwụrụ anwụ” is grammatically possible but unnatural in this context.
    rationale: “Ndị ha nwụrụ anwụ” is the more normal Standard Igbo expression for “their dead,” while preserving the source’s lack of a specified relationship.
  - severity: low
    issue: “A tara ahụhụ nke ukwuu” does not explicitly state that others inflicted the suffering on them.
    rationale: The Greek passive ἐτυμπανίσθησαν is more directly represented by “a tara ha ahụhụ nke ukwuu.”
  - severity: low
    issue: Footnote b identifies an alternative for the verbal phrase rather than the noun it explains.
    rationale: With “ntọhapụ” in the revised text, the note should identify that noun and explain its contextual sense.
