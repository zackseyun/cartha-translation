id: HEB.11.11
reference: Hebrews 11:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πίστει καὶ ⸂αὐτῇ Σάρρᾳ⸃ δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ⸀ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: ig
  text: Ọ bụ site n’okwukwe ka ọbụna Sera n’onwe ya natara ike ịtụrụ ime ma mụọ nwa[a], nakwa mgbe ọ gafere oge kwesịrị ekwesị n’afọ ndụ ya, n’ihi na o weere Onye ahụ kwere nkwa dị ka onye kwesịrị ntụkwasị obi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ma a sụgharịa ya nso n’ụdị okwu Grik, “natara ike maka ịtọgbọ mkpụrụ.” Nkebiokwu Grik a pụrụ iche ma bụrụ akpaalaokwu; n’ebe a, ọ na-ekwu maka ikike ịmụ nwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: site n’okwukwe
  rationale: Ọ bụ dative nke ụzọ e si mee ihe n’usoro okwu a na-emegharị ugboro ugboro na Ndị Hibru 11; ‘site n’okwukwe’ bụ okwu Igbo doro anya ma na-echekwa isi echiche πίστις.
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: Sera n’onwe ya ... ọ bụladị
  rationale: ‘N’onwe ya’ na-egosipụta ike αὐτῇ, ebe ‘ọ bụladị’ na-eburu mmetụta mgbakwunye na ihe ijuanya nke καί n’ọnọdụ a.
- source_word: δύναμιν ... ἔλαβεν
  choice: natara ike
  rationale: Nke a na-esochi okwu Grik ahụ nke ọma ma bụrụkwa okwu Igbo e ji ekwu na e nyere mmadụ ikike ma ọ bụ ume ime ihe.
- source_word: εἰς καταβολὴν σπέρματος
  choice: ịtụrụ ime mụta nwa
  rationale: Nkebiokwu Grik a siri ike ma bụrụ akpaalaokwu pụrụ iche. N’ebe a, ọ na-ekwu maka ikike Sera nwere ịtụrụ ime ma mụta nwa; a debere ntụgharị nke na-esochi mkpụrụokwu ya nso karị n’ala peeji.
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: ọ bụladị mgbe ọ gafere oge kwesịrị ekwesị n’afọ ndụ ya
  rationale: Nke a na-echekwa echiche nke ịgafe oge kwesịrị ekwesị nke ndụ, na-ekwughị karịa ihe Grik kwuru kpọmkwem.
- source_word: ἐπεὶ
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara Sera ji nata ike ahụ.
- source_word: πιστὸν
  choice: onye kwesịrị ntụkwasị obi
  rationale: Nke a na-egosipụta na Onye ahụ kwere nkwa bụ onye a pụrụ ịdabere na ya, ma na-echekwa ibu echiche okpukpe nke πιστός n’ụzọ Igbo sitere n’okike.
- source_word: ἡγήσατο
  choice: o weere ... dị ka
  rationale: Akpaokwu Igbo a na-egosipụta mkpebi uche ma ọ bụ ntule nke ἡγέομαι.
- source_word: τὸν ἐπαγγειλάμενον
  choice: Onye ahụ kwere nkwa
  rationale: Ọ na-asụgharị participle ahụ dị ka aha onye, na-ezo aka n’ebe Chineke nọ n’ụzọ doro anya ma dị ùgwù.
theological_decisions:
- issue: Onye bụ isiokwu na nghọta omume Sera n’ahịrịokwu siri ike n’usoro okwu
  choice: 'Sera bụ isiokwu: ọ natara ike ịtụrụ ime mụta nwa.'
  alternative: E nwere ike ịghọta Abraham dị ka onye so n’omume ahụ ma ọ bụ onye bụ isi n’echiche ‘ịtọgbọ mkpụrụ’; ma ọ bụ ịghọta ya dị ka ike ịmalite usoro ụmụ ụmụ.
  rationale: N’ụdị ederede a, αὐτῇ Σάρρᾳ na-akacha egosi Sera dị ka isiokwu nke ἔλαβεν. N’agbanyeghị na καταβολὴ σπέρματος nwere ike ịdị ka okwu metụtara nwoke ma a sụgharịa ya mkpụrụokwu n’otu n’otu, ọnọdụ ya na-ekwu maka okwukwe Sera na ịtụrụ ime n’ụzọ ọrụ ebube. Ihe e dere n’ala peeji na-echekwa ihe mgbagwoju anya nke nkebiokwu Grik ahụ.
- issue: Otú e si kọwaa πιστός mgbe ọ na-ekwu maka Chineke
  choice: onye kwesịrị ntụkwasị obi
  alternative: onye a pụrụ ịtụkwasị obi; onye a pụrụ ịdabere na ya
  rationale: Amaokwu ahụ na-akọwa okwukwe Sera site n’ịtụkwasị obi n’àgwà Onye kwere nkwa. Nhọrọ a na-echekwa isi echiche ahụ n’etinyeghị ozizi ọzọ na-adịghị n’ederede.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ịtụrụ ime mụta nwa’ mee ka ihe a na-ekwu doo anya n’Igbo, ebe e debere ụdị okwu Grik ahụ siri ike n’ala peeji. Akara ala peeji [a] dị n’ederede isi.
