  to: Ọ bụ site n’okwukwe ka ọbụna Sera n’onwe ya natara ike ịtụrụ ime ma mụọ nwa[a], nakwa mgbe ọ gafere oge kwesịrị ekwesị n’afọ ndụ ya, n’ihi na o weere Onye ahụ kwere nkwa dị ka onye kwesịrị ntụkwasị obi.
