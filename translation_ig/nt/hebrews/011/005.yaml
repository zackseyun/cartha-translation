id: HEB.11.5
reference: Hebrews 11:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πίστει Ἑνὼχ μετετέθη τοῦ μὴ ἰδεῖν θάνατον, καὶ οὐχ ηὑρίσκετο διότι μετέθηκεν αὐτὸν ὁ θεός· πρὸ γὰρ τῆς ⸀μεταθέσεως μεμαρτύρηται εὐαρεστηκέναι τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/005.yaml
  text: By faith Enoch was taken away so that he should not see death[a], and he was not found because God had taken him away. For before his being taken away, he had been commended as having pleased God[c][b],
translation:
  language: ig
  text: Ọ bụ site n'okwukwe ka e si wepụ Inọk ka ọ ghara ịhụ ọnwụ[a]; a chọtaghịkwa ya, n'ihi na Chineke ewepụla ya. N'ihi na tupu e wepụ ya, a gbara ama na ọ masịrị Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịnwụ anwụ.” “Ịhụ ọnwụ” bụ akpaalaokwu Grik e chekwara n'ahịrị bụ isi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Ọ bụ site n'okwukwe
  rationale: Nke a na-egosi okwukwe dị ka ụzọ ma ọ bụ ọnọdụ e ji mee ihe, dịka dative Grik ahụ si arụ ọrụ n'okwu a.
- source_word: μετετέθη
  choice: e wepụ Inọk
  rationale: “Wepụ” na-echekwa passive sense na echiche na e si n'ọnọdụ ndụ ya wepụ ya, n'ebughị ụzọ kọwaa ebe e bugara ya.
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: ka ọ ghara ịhụ ọnwụ
  rationale: E chekwara akpaalaokwu Grik “ịhụ ọnwụ,” ebe usoro “ka ọ ghara” na-egosi nzube ma ọ bụ nsonaazụ.
- source_word: οὐχ ηὑρίσκετο
  choice: a hụghịkwa ya
  rationale: Nke a na-echekwa okwu passive ma hapụ onye na-achọ ya n'ekwughị, dịka Grik ahụ mere.
- source_word: διότι μετέθηκεν αὐτὸν ὁ θεός
  choice: n'ihi na Chineke ewepụla ya
  rationale: E jiri otu mgbọrọgwụ “wepụ” mee ka njikọ ya na μετετέθη doo anya; perfect Igbo na-egosi na omume Chineke mere tupu a ghara ịhụ ya.
- source_word: πρὸ γὰρ τῆς μεταθέσεως
  choice: N'ihi na tupu e wepụ ya
  rationale: Ọ bụ Igbo dị mfe ma kwekọọ na noun nke Grik nke na-ekwu banyere iwepụ ya.
- source_word: μεμαρτύρηται
  choice: a gbara ama
  rationale: Nke a na-echekwa echiche nke ịgba ama ma ọ bụ inye akaebe banyere Inọk, karịa ime ka ọ bụrụ naanị otuto.
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: na o mere ihe dị Chineke mma
  rationale: Nke a na-enye perfect infinitive ahụ n'Igbo eke ma na-egosi na omume Inọk masịrị Chineke tupu e wepụ ya.
theological_decisions:
- issue: Ihe okwu μετατίθημι gbasara Inọk pụtara
  choice: “e wepụ” n'akwụghị kpọmkwem na e bugara ya n'eluigwe
  alternative: “e buliri ya gaa n'eluigwe” ma ọ bụ okwu ọdịnala yiri “a tụgharịrị ya”
  rationale: Amaokwu ahụ kwuru na Chineke wepụ ya ka ọ ghara ịhụ ọnwụ, ma ọ kọwaghị kpọmkwem ụzọ o si mee ma ọ bụ ebe ọ kpọgara ya.
- issue: Ike akpaalaokwu “ịhụ ọnwụ”
  choice: Chekwaa “ịhụ ọnwụ” n'ahịrị bụ isi
  alternative: “ịnwụ anwụ” ma ọ bụ “ịnata ọnwụ”
  rationale: Akpaalaokwu ahụ doro onye Igbo anya ma na-echekwa ọdịdị na esemokwu nke isi mmalite; nkọwa ya dị n'okpuru amaokwu.
- issue: Ike nke μεμαρτύρηται
  choice: “a gbara ama”
  alternative: “a toro ya” ma ọ bụ “Chineke kwuru na ọ dị mma”
  rationale: Okwu a na-echekwa asụsụ nke akaebe n'enweghị ịkpọ onye nyere akaebe aha n'ụzọ Grik ahụ na-ekwughị kpọmkwem n'ahịrịokwu a.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Inọk” mee aha Enoch. E chekwara nkwughachi nke “wepụ” iji gosipụta njikọ okwu Grik μετατίθημι/μετάθεσις, ma zere ịgbakwunye nkọwa gbasara eluigwe nke amaokwu ahụ n'onwe ya na-ekwughị.
