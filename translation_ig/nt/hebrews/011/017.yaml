source:
  edition: SBLGNT
  text: Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ τὸν μονογενῆ προσέφερεν ὁ τὰς ἐπαγγελίας ἀναδεξάμενος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/017.yaml
  text: By faith Abraham[a], when he was being tested, offered up Isaac, and the one who had received the promises was offering up his one and only son,
translation:
  language: ig
  text: Ọ bụ site n'okwukwe ka Ebreham, mgbe a na-anwale ya, ji chụọ Aịzik n'àjà; onye ahụ natara nkwa ndị ahụ nọ na-achụ nwa ya pụrụ iche n'àjà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “naanị nwa ya” ma ọ bụ “nwa ya naanị ya.” Okwu Grik a na-emesi ịdị iche na ịdị pụrụ iche ike; nsụgharị ọdịnala ụfọdụ na-asị, “nwa ọ mụrụ naanị ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Ọ bụ site n'okwukwe
  rationale: Na-egosi okwukwe dị ka ụzọ ma ọ bụ ihe e ji mee omume ahụ, ma na-edokwa usoro okwu a na-eme ugboro ugboro n'isiakwụkwọ a.
- source_word: προσενήνοχεν
  choice: ji chụọ ... n'àjà
  rationale: Na-egosipụta ike okwu προσφέρω n'ọnọdụ àjà, n'Igbo doro anya ma kwekọọ n'akụkọ ahụ.
- source_word: πειραζόμενος
  choice: mgbe a na-anwale ya
  rationale: Na-echekwa ụdị nnara na ọnọdụ ihe na-aga n'ihu nke participle ahụ; “anwale” na-egosi ule, ọ bụghị ịrata mmadụ ime mmehie.
- source_word: μονογενῆ
  choice: otu nwa ya ahụ pụrụ iche
  rationale: Na-egosipụta na Aịzik bụ nwa pụrụ iche n'ụzọ na-enweghị ikwu n'ụzọ na-eduhie eduhie na Ebreham enweghị nwa ọzọ.
- source_word: προσέφερεν
  choice: nọ na-achụ ... n'àjà
  rationale: Na-echekwa ọdịdị imperfect nke na-egosi omume ahụ ka ọ na-aga n'ihu, ma kewapụ ya na ngwaa mbụ.
- source_word: ἀναδεξάμενος
  choice: natara
  rationale: “Natara” bụ okwu Igbo nkịtị na nke dabara adaba maka ịnata nkwa Chineke.
- source_word: ἐπαγγελίας
  choice: nkwa ndị ahụ
  rationale: Na-echekwa plural Greek ahụ ma na-ezo aka n'ìgwè nkwa e nyere Ebreham.
- source_word: καὶ
  choice: ;
  rationale: Semicolon na Igbo na-ejikọta nkebi abụọ ahụ nke ọma ma na-egosipụta n'ụzọ doro anya na onye nke abụọ ahụ ka bụ Ebreham, n'agbanyeghị na njikọ Greek bụ καὶ.
theological_decisions:
- issue: Otu e si sụgharịta μονογενῆ gbasara Aịzik, ebe ọ bụ na Aịzik abụghị naanị nwa Ebreham n'ụzọ anụ ahụ
  choice: otu nwa ya ahụ pụrụ iche
  alternative: naanị nwa ya; otu nwa ya naanị ya; nwa ọ mụrụ naanị ya
  rationale: Nhọrọ a na-egosipụta ọnọdụ Aịzik dị ka onye nketa pụrụ iche nke nkwa ahụ, n'ekwughị na Ebreham enweghị nwa ọzọ. Ọ na-ezerekwa itinye n'ime amaokwu a echiche nkà mmụta okpukpe sitere n'iji “ọ mụrụ naanị ya” eme ihe n'ebe ọzọ.
- issue: Mmekọrịta dị n'etiti προσενήνοχεν na προσέφερεν
  choice: ji chụọ ... n'àjà; nọ na-achụ ... n'àjà
  alternative: chụrụ ... n'àjà na nke abụọ kwa
  rationale: A na-echekwa ọdịiche aspect n'etiti perfect na imperfect dịka o kwere mee n'Igbo, na-enweghị ịkọwapụta ma àjà ahụ mezuru n'ezie.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ịchụ n'àjà” na-echekwa echiche àjà nke προσφέρω; “otu nwa ya ahụ pụrụ iche” na-ezere nghọtahie gbasara Ishmael ma na-edobe mkpa Aịzik pụrụ iche n'ime nkwa ahụ.
