  to: Ọ bụ site n’okwukwe ka ndị mụrụ Mosis zoro ya ọnwa atọ mgbe a mụrụ ya, n’ihi na ha hụrụ na nwa ahụ mara mma[a], nakwa na ha atụghị egwu iwu eze nyere.
