id: HEB.11.23
reference: Hebrews 11:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πίστει Μωϋσῆς γεννηθεὶς ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ, διότι εἶδον ἀστεῖον τὸ παιδίον καὶ οὐκ ἐφοβήθησαν τὸ διάταγμα τοῦ βασιλέως.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: ig
  text: Ọ bụ site n’okwukwe ka ndị mụrụ Mosis zoro ya ọnwa atọ mgbe a mụrụ ya, n’ihi na ha hụrụ na nwa ahụ mara mma[a], nakwa na ha atụghị egwu iwu eze nyere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ezigbo mma” ma ọ bụ “pụrụ iche.” Okwu Grik a na-eme ka Ọpụpụ 2:2 na Ọrụ Ndị Ozi 7:20 bata n’uche.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: Ọ bụ site n’okwukwe ka
  rationale: Nke a na-egosi okwukwe dị ka ụzọ ma ọ bụ ihe mere omume ahụ ji pụta, ma na-edobekwa isiokwu a na-emegharị ugboro ugboro na Ndị Hibru 11.
- source_word: Μωϋσῆς
  choice: Mosis
  rationale: Ọ bụ ụdị aha a na-ejikarị eme ihe n’Igbo maka Mosis.
- source_word: γεννηθεὶς
  choice: mgbe a mụrụ ya
  rationale: A sụgharịrị participle a n’ụzọ na-egosi oge, nke bụ ụzọ Igbo dị ndụ si ekwu ya.
- source_word: ἐκρύβη
  choice: ndị mụrụ Mosis zoro ya
  rationale: Ọ bụ ezie na Grik ji olu nnara mee ya, olu ime ihe ka bụ ụzọ Igbo kacha doo anya ma dịkwa ndụ; ọ ka na-egosi na ndị mụrụ ya bụ ndị zoro ya.
- source_word: τρίμηνον
  choice: ọnwa atọ
  rationale: Nke a na-egosi ogologo oge ahụ n’ụzọ Igbo nkịtị.
- source_word: ὑπὸ τῶν πατέρων αὐτοῦ
  choice: ndị mụrụ Mosis
  rationale: N’agbanyeghị na okwu Grik ahụ pụtara n’ụzọ nkịtị ‘ndị nna,’ n’ebe a ọ na-ezo aka n’ebe nne na nna ya nọ.
- source_word: διότι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe mere ha ji mee ihe ahụ.
- source_word: εἶδον
  choice: ha hụrụ
  rationale: Nke a na-edobe nghọta nkịtị nke ịhụ nwa ahụ.
- source_word: ἀστεῖον
  choice: mara mma
  rationale: Okwu ahụ nwere ike ịpụta na nwa ahụ mara mma, dị ezigbo mma, ma ọ bụ bụrụ onye pụrụ iche; ‘mara mma’ bụ okwu Igbo doro anya nke kwekọrọ na ndabere nke Ọpụpụ 2:2 na Ọrụ Ndị Ozi 7:20.
- source_word: τὸ παιδίον
  choice: nwa ahụ
  rationale: Nke a bụ ụzọ Igbo nkịtị ma kpọmkwem isi kwuo ‘nwatakịrị ahụ’ n’ọnọdụ a.
- source_word: οὐκ ἐφοβήθησαν
  choice: ha atụghịkwa ... egwu
  rationale: Nke a bụ akpaalaokwu Igbo nkịtị nke na-edobe ọdịiche dị n’etiti okwukwe na egwu.
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: iwu eze nyere
  rationale: Nke a na-egosi na ọ bụ iwu ma ọ bụ ọkwa ọchịchị sitere n’aka eze, n’asụsụ Igbo ndị mmadụ na-aghọta ngwa ngwa.
theological_decisions:
- issue: Ihe kpaliri ndị mụrụ Mosis izo ya
  choice: 'Amaokwu ahụ na-egosi omume ha dị ka omume sitere n’okwukwe: ha hụrụ na nwa ahụ mara mma, ha ajụkwa ikwe ka egwu iwu eze chịkwaa ha.'
  alternative: Ima mma nwa ahụ naanị ya kpaliri ha, ma ọ bụ ọdịdị ya bụ ihe ịrịba ama pụrụ iche sitere n’aka Chineke.
  rationale: Nhazi okwu Grik na-etinye ịhụ na nwa ahụ mara mma na enweghị egwu iwu eze n’okpuru okwu mmalite ‘site n’okwukwe.’ Nsụgharị ahụ anaghị ekwu karịa ihe ederede kwuru banyere ọdịdị nwa ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ olu ime ihe n’ebe olu nnara Grik dị ka ahịrịokwu ahụ wee daa nke ọma n’Igbo, n’enweghị mgbanwe n’ihe onye mere omume ahụ ma ọ bụ onye e mere ya.
