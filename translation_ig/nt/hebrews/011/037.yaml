revisions:
- from: E ji nkume tụgbuo ha; e ji mma nkwọ waa ha ụzọ abụọ; ha nwụrụ n’ogbugbu mma agha[a]. Ha na-awagharị yi akpụkpọ atụrụ na akpụkpọ ewu, ha enweghị ihe ndị dị ha mkpa, a na-emekpa ha ahụ, a na-emesokwa ha ihe ọjọọ—
  to: E ji nkume tụgbuo ha; e jiri mma nkwọ waa ha abụọ; ha nwụrụ n’ihi na e ji mma agha gbuo ha[a]. Ha wagharịrị n’akpụkpọ atụrụ na n’akpụkpọ ewu, ha enweghị ihe ndị dị ha mkpa, a na-emekpa ha, a na-emesokwa ha ihe ọjọọ—
  rationale: The revision makes the sword-death phrase idiomatic while retaining the sense of violent killing in φόνος, and it broadens the rendering of θλιβόμενοι so that it does not add a specifically bodily sense absent from the Greek. The remaining wording and the continuing dash are retained.
