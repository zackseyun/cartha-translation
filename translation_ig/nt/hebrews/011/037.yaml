  text: ἐλιθάσθησαν, ⸀ἐπρίσθησαν, ἐν φόνῳ ⸀μαχαίρης ἀπέθανον, περιῆλθον ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν, ὑστερούμενοι, θλιβόμενοι, κακουχούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/037.yaml
  text: They were stoned[a], they were sawn in two, they died by the sword; they went about in sheepskins, in goatskins, destitute, afflicted, mistreated—
translation:
  language: ig
  text: E ji nkume tụgbuo ha; e jiri mma nkwọ waa ha abụọ; ha nwụrụ n’ihi na e ji mma agha gbuo ha[a]. Ha wagharịrị n’akpụkpọ atụrụ na n’akpụkpọ ewu, ha enweghị ihe ndị dị ha mkpa, a na-emekpa ha, a na-emesokwa ha ihe ọjọọ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “ha nwụrụ site na mma agha.” Okwu Grik φόνος pụtara “ogbugbu,” ya mere ọ na-eme ka ime ihe ike dị n’okwu a pụta ìhè karị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθάσθησαν
  choice: E ji nkume tụgbuo ha
  rationale: Nke a bụ ụzọ Igbo si ekwu n’ụzọ doro anya na e ji nkume taa mmadụ ahụhụ dị ka okwu λιθάζω si pụta; ọ na-edobekwa olu nnara nke Grik.
- source_word: ἐπρίσθησαν
  choice: e ji mma nkwọ waa ha ụzọ abụọ
  rationale: πρίζω pụtara iji nkwọ waa ihe. ‘Waa ha ụzọ abụọ’ na-eme ka ụdị ọnwụ ahụ doo anya n’Igbo nkịtị.
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: ha nwụrụ n’ogbugbu mma agha
  rationale: ‘Nwụrụ’ na-anọchite ἀπέθανον, ebe ‘ogbugbu mma agha’ na-echekwa ike okwu φόνος kama ime ka ya bụrụ naanị ‘site na mma agha.’
- source_word: περιῆλθον
  choice: Ha na-awagharị
  rationale: N’ebe a, περιέρχομαι na-egosi ịgagharị site n’otu ebe ruo n’ebe ọzọ; ‘na-awagharị’ bụ okwu Igbo dị ndụ nke na-egosikwa enweghị ebe obibi kwụsiri ike.
- source_word: ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν
  choice: yi akpụkpọ atụrụ na akpụkpọ ewu
  rationale: Preposishọn ἐν na-egosi uwe ha yi n’ebe a. Ikwu ‘yi’ na-eme ka ahịrịokwu ahụ bụrụ Igbo ebumpụta ụwa ma chekwaa ihe ụdị akpụkpọ abụọ ahụ bụ.
- source_word: ὑστερούμενοι
  choice: ha enweghị ihe ndị dị ha mkpa
  rationale: Nke a na-egosipụta ịnọ ná nnukwu ụkọ na enweghị ihe ndị dị mkpa maka ndụ, n’ụzọ ndị na-agụ Igbo taa ga-aghọta ozugbo.
- source_word: θλιβόμενοι
  choice: a na-emekpa ha ahụ
  rationale: Olu nnara a na-egosi nrụgide na ahụhụ a na-ebukwasị ha, dịka θλίβω si pụta n’ebe a.
- source_word: κακουχούμενοι
  choice: a na-emesokwa ha ihe ọjọọ
  rationale: Nke a na-enye echiche nke mmeso ọjọọ n’enweghị ịgbakwunye ụdị mmekpa ahụ okwu Grik ahụ na-akọwaghị.
theological_decisions:
- issue: Ogo ike a ga-echekwa n’okwu ἐν φόνῳ μαχαίρης
  choice: ha nwụrụ n’ogbugbu mma agha
  alternative: ha nwụrụ site na mma agha
  rationale: φόνος na-agbakwunye echiche nke ogbugbu obi ọjọọ karịa naanị ịkọ ngwa e ji gbuo ha. Nsụgharị bụ isi na-echekwa ike ahụ, ebe nkọwa ala peeji na-enye ụzọ dị mfe karị.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-edobe ndepụta ahụhụ na ọnwụ, ma akara ogologo dị n’ọgwụgwụ na-egosi na echiche ahụ gara n’ihu n’amaokwu na-esote.
