review_pass:
  verdict: revise
  source_fidelity: The draft follows the SBLGNT sequence and preserves the passive sense of stoning and sawing, the violent force of φόνος μαχαίρης, the skins, and the three concluding participles. The wording for θλιβόμενοι should not specify bodily torture, since the Greek more broadly denotes affliction or oppression. The revised sword clause expresses both ἀπέθανον ('they died') and the violent killing conveyed by φόνος.
  naturalness: Most of the draft is understandable Standard Igbo. The phrase “n’ogbugbu mma agha” is compressed and less idiomatic. The revised clause unpacks it naturally without weakening its force. “a na-emekpa ha ahụ” is also less suitable because ahụ can make the affliction specifically physical; “a na-emekpa ha” is broader and natural.
  terminology: “nkume,” “mma nkwọ,” “mma agha,” “akpụkpọ atụrụ,” and “akpụkpọ ewu” are suitable. “E ji mma agha gbuo ha” in the revised causal clause retains the lethal, violent sense of φόνος while avoiding an unnatural literal calque. The footnote accurately identifies the simpler alternative and its lexical basis.
  issues:
  - severity: medium
    issue: “a na-emekpa ha ahụ” narrows θλιβόμενοι to bodily mistreatment.
    rationale: θλιβόμενοι denotes being afflicted, oppressed, or hard-pressed and does not itself limit the suffering to the body. The following κακουχούμενοι separately expresses ill-treatment.
  - severity: medium
    issue: “ha nwụrụ n’ogbugbu mma agha” is not idiomatic enough in Standard Igbo.
    rationale: The noun sequence is an overly literal rendering of ἐν φόνῳ μαχαίρης. A causal clause naturally conveys death through violent killing with a sword, preserving the force of φόνος.
  revised_text: E ji nkume tụgbuo ha; e jiri mma nkwọ waa ha abụọ; ha nwụrụ n’ihi na e ji mma agha gbuo ha[a]. Ha wagharịrị n’akpụkpọ atụrụ na n’akpụkpọ ewu, ha enweghị ihe ndị dị ha mkpa, a na-emekpa ha, a na-emesokwa ha ihe ọjọọ—
  revised_footnotes:
