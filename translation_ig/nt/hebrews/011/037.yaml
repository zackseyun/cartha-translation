    text: 'A pụkwara ịsụ ya: “ha nwụrụ site na mma agha.” Okwu Grik φόνος pụtara “ogbugbu,” ya mere ọ na-eme ka ime ihe ike dị n’okwu a pụta ìhè karị.'
    reason: lexical_alternative
