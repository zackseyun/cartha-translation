source:
  edition: SBLGNT
  text: Καὶ τί ἔτι λέγω; ἐπιλείψει ⸂με γὰρ⸃ διηγούμενον ὁ χρόνος περὶ Γεδεών, Βαράκ, ⸀Σαμψών, Ἰεφθάε, Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: ig
  text: Gịnịkwa ọzọ ka m ga-ekwu? N’ihi na oge agaghị ezuru m ma ọ bụrụ na m na-akọ akụkọ banyere Gidiọn, Barak, Samsịn, Jefta, Devid, tinyere Samuel na ndị amụma[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “N’ihi na oge ga-agwụ m ka m na-akọ banyere...”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: Gịnịkwa ọzọ ka m ga-ekwu?
  rationale: Nke a na-egosipụta ajụjụ e ji akwalite okwu gaa n’ihu, ma na-ada ka Igbo nkịtị ma dịkwa ùgwù.
- source_word: ἐπιλείψει με γὰρ ὁ χρόνος
  choice: N’ihi na oge agaghị ezuru m
  rationale: A sụgharịrị ọdịnihu Grik a n’ụzọ na-egosipụta echiche na oge agaghị ezu ma onye dere ya kọwaa ihe niile; nke a na-echekwa ike okwu ahụ n’Igbo nkịtị.
- source_word: διηγούμενον
  choice: ma ọ bụrụ na m na-akọ akụkọ
  rationale: Okwu a na-egosi omume ịkọ ihe n’ụzọ na-aga n’ihu. Usoro a na-echekwa nghọta ahụ na ọnọdụ nke ga-eme ka oge ghara izu.
- source_word: περὶ
  choice: banyere
  rationale: Ọ na-ewebata ndị bụ isiokwu akụkọ ahụ; ‘banyere’ bụ okwu Igbo doro anya ma kwekọọ na ya.
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: Gidiọn, Barak, Samsịn, Jefta, Devid, Samuel
  rationale: E dere aha ndị ahụ n’ụdị a na-amata nke ọma n’Igbo, kama ịsụgharị ihe aha ha pụtara.
- source_word: τε καὶ
  choice: tinyere
  rationale: ‘Tinyere’ na-echekwa njikọ mgbakwunye dị n’etiti Devid na Samuel n’enweghị ịkọwa ya karịa ihe Grik kwuru.
- source_word: τῶν προφητῶν
  choice: ndị amụma
  rationale: Nke a bụ ntụgharị Igbo doro anya maka ìgwè ndị amụma e kwuru banyere ha.
theological_decisions:
- issue: Ike ajụjụ na okwu banyere oge
  choice: E gosipụtara ya dị ka ụzọ onye dere akwụkwọ si kwuo na oge agaghị ezuru ya ịkọ ihe niile.
  alternative: Ịsụgharị ya n’ụzọ nkịtị karị dịka ‘oge ga-agwụ m ka m na-akọ.’
  rationale: Nhọrọ a na-echekwa ebumnuche ajụjụ ahụ—ime ka ndepụta ahụ dị mkpirikpi—n’enweghị ịgbakwunye nkọwa ozizi.
- issue: Njikọ Devid, Samuel, na ndị amụma
  choice: ‘Devid, tinyere Samuel na ndị amụma’
  alternative: ‘Devid na Samuel na ndị amụma’
  rationale: Nke a na-egosipụta ntakịrị ike mgbakwunye nke τε καὶ, ma hapụ Samuel ka ọ pụta iche n’akụkụ ìgwè ndị amụma n’enweghị ịmanye nkọwa banyere ọrụ ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu nkịtị maka ajụjụ ahụ na okwu banyere oge, ebe e debere nhọrọ ntụgharị nkịtị karị n’ala peeji.
