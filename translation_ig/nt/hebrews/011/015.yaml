  to: Ma ọ bụrụ na ha nọ na-echeta ala ahụ ha si na ya pụta[a], ha gaara enwe ohere ịlaghachi.
  rationale: The revision uses a more natural Standard Igbo conditional without altering the Greek conditional relationship. It retains the progressive sense of μνημονεύουσιν, the departure sense of ἐξέβησαν, and the counterfactual opportunity expressed by εἶχον ἂν. The footnote’s country alternative is made more precise in Igbo.
