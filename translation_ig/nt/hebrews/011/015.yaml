id: HEB.11.15
reference: Hebrews 11:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἰ μὲν ἐκείνης ⸀μνημονεύουσιν ἀφ’ ἧς ⸀ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: ig
  text: Ma ọ bụrụ na ha nọ na-echeta ala ahụ ha si na ya pụta[a], ha gaara enwe ohere ịlaghachi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mba ahụ” ma ọ bụ “ala nna ahụ.” Okwu Grik ahụ na-ezo aka n’ala dị n’ụwa a ha siri pụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ μὲν
  choice: A sịkwa na
  rationale: Nke a na-ejikọta amaokwu ahụ na ihe bu ya ụzọ ma na-egosipụta ọnọdụ megidere ihe mere n’ezie. Ụdị a bụ Igbo dị ire karịa ịsụgharị μέν iche.
- source_word: μνημονεύουσιν
  choice: ha nọ na-echeta
  rationale: Ọ na-echekwa echiche nke ịnọgide na-echeta ma ọ bụ itinye uche n’ebe ahụ, n’ebughị ụzọ kọwaa ya dị ka agụụ ịlaghachi.
- source_word: ἐκείνης
  choice: ala ahụ
  rationale: Nnọchiaha ngosi ahụ na-ezo aka n’ala dị n’ụwa a e kwuru okwu ya n’amaokwu 14. ‘Ala’ dabara n’echiche njem ndị ọbịa ma zere ime ka ọ bụrụ okwu ndọrọ ndọrọ ọchịchị.
- source_word: ἀφ’ ἧς
  choice: ha si na ya
  rationale: Nke a na-egosipụta n'ụzọ ebumpụta ụwa na Igbo ebe ha siri pụta.
- source_word: ἐξέβησαν
  choice: pụta
  rationale: ‘Pụta’ na-echekwa isi echiche nke isi n’otu ebe pụọ, gụnyere ụda nke ọpụpụ, karịa naanị ‘hapụ.’
- source_word: εἶχον ἂν
  choice: ha gaara enwe
  rationale: Ụdị a na-egosipụta n’Igbo ihe gaara eme ma a sị na ọnọdụ ahụ mezuru.
- source_word: καιρὸν
  choice: ohere
  rationale: N’ebe a, okwu ahụ pụtara ohere ma ọ bụ oge kwesịrị ekwesị ime ihe, ọ bụghị naanị oge na-agafe.
- source_word: ἀνακάμψαι
  choice: ịlaghachi
  rationale: Nke a na-enye echiche doro anya nke ịtụgharị gaa n’ebe ha siri pụta.
theological_decisions:
- issue: Ụdị ala ahụ ha na-echeta
  choice: Ala dị n’ụwa a ha hapụrụ, nke a na-atụnyere n’ụzọ ezoro ezo n’ala ka mma nke eluigwe dị n’okwu gbara amaokwu a gburugburu.
  alternative: Iwere ya dị ka ụzọ ndụ ochie ha n’ozuzu ya, ọ bụghị ala ha kpọmkwem.
  rationale: Ndị Hibru 11:13–16 na-ekwu banyere ala ndị nna ochie siri pụta ma jiri ya tụnyere ala ka mma nke ha na-achọ. Ya mere, nsụgharị ahụ na-edebe okwu ahụ dị ka ebe kpọmkwem, n’emeghị ya ihe atụ n’ime isiokwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị nsọpụrụ, dee ya. ‘A sịkwa na … ha gaara …’ na-egosipụta ọnọdụ megidere ihe mere n’ezie n’ụzọ ndị Igbo na-aghọta nke ọma.
