source:
  edition: SBLGNT
  text: οἳ διὰ πίστεως κατηγωνίσαντο βασιλείας, εἰργάσαντο δικαιοσύνην, ἐπέτυχον ἐπαγγελιῶν, ἔφραξαν στόματα λεόντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/033.yaml
  text: who through faith conquered kingdoms[a], worked righteousness, obtained promises, shut the mouths of lions[b],
translation:
  language: ig
  text: ndị site n’okwukwe[b] meriri alaeze, rụrụ ezi omume[a], nwetaara nkwa, mechiri ọnụ ọdụm,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “rụrụ ikpe ziri ezi.” Okwu Grik ahụ nwere ike ịpụta ezi omume ma ọ bụ ikpe ziri ezi, dabere n’ihe a na-ekwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site na ntụkwasị obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: site n’okwukwe
  rationale: Nke a na-egosi ụzọ ma ọ bụ ihe ha ji mee omume ndị ahụ. “Okwukwe” bụ okwu Igbo kwesịrị ekwesị n’ebe a, ebe “site” na-echekwa ọrụ διά na genitive.
- source_word: κατηγωνίσαντο
  choice: meriri
  rationale: Ngwaa a pụtara imeri ma ọ bụ ido onye iro n’okpuru n’agha; “meriri” bụ okwu doro anya ma dịkwa ike n’Igbo.
- source_word: βασιλείας
  choice: alaeze dị iche iche
  rationale: N’ebe a, βασιλεία na-ezo aka n’alaeze ndọrọ ndọrọ ọchịchị. Itinye “dị iche iche” na-eme ka ọtụtụ nke okwu Grik ahụ doo anya n’Igbo.
- source_word: εἰργάσαντο δικαιοσύνην
  choice: rụọ ezi omume
  rationale: Nkebiokwu a bụ ụzọ Igbo si ekwu ime ma ọ bụ ịrụ ihe ziri ezi n’ụzọ na-agụ nke ọma, ebe ọ ka na-echekwa echiche nke omume ezi omume.
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: nweta nkwa dị iche iche
  rationale: “Nweta” na-echekwa echiche nke iru ma ọ bụ inweta, na-enweghị ikwu karịa ihe odide ahụ banyere ma nkwa niile hà mezuru kpamkpam. “Nkwa dị iche iche” na-egosi plural nke Grik.
- source_word: ἔφραξαν στόματα λεόντων
  choice: mechie ọnụ ọdụm
  rationale: Nke a na-echekwa ihe atụ doro anya nke Grik ma bụrụkwa okwu e ji eme ihe n’Igbo.
theological_decisions:
- issue: Nsụgharị πίστις n’usoro ihe ndị ndị okwukwe mere na Ndị Hibru 11
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: Isiokwu nke isiakwụkwọ a bụ ime ihe n’ịdabere na Chineke. “Okwukwe” na-echekwa okwu okpukpe sara mbara ahụ, ebe nkọwa ala peeji na-egosi echiche nke ntụkwasị obi n’ebe Chineke nọ.
- issue: Nsụgharị δικαιοσύνη n’ebe a na-abụghị akwụkwọ Pọl
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: “Ezi omume” na-egosi omume kwekọrọ n’ihe ziri ezi na n’ọchịchọ Chineke, na-enweghị ime ka okwu ahụ bụrụ naanị ikpe ma ọ bụ ikpe nkwụmọtọ. A na-echekwa “ikpe ziri ezi” dịka ihe ọzọ ọ pụrụ ịpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A hapụrụ ya dịka nkebiokwu na-aga n’ihu, dịka ọdịdị amaokwu Grik ahụ si dị. E tinyere akara nkọwa [b] n’akụkụ “okwukwe” na [a] n’akụkụ “ezi omume,” ebe okwu ndị nkọwa ahụ metụtara dị.
