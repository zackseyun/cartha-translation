- from: Ma otú ọ dị ugbu a, ha na-achọsi ala nna ka mma[a] ike—ya bụ, nke dị n’eluigwe. N’ihi ya, ihere adịghị eme Chineke ka a kpọọ ya Chineke ha, n’ihi na ọ kwadebeere ha obodo ukwu.
  to: Ma ugbu a, ha na-achọ ala nna ka mma[a]—ya bụ, nke dị n’eluigwe. N’ihi ya, Chineke adịghị eme ihere ka a kpọọ ya Chineke ha, n’ihi na ọ kwadebeere ha obodo ukwu.
  rationale: The revision retains the source’s implied feminine noun and the contrast between homeland and city, while making the opening and expression of desire idiomatic in modern Standard Igbo. It also preserves the relational formula “Chineke ha” without doctrinal expansion and revises the footnote’s grammatical terminology for natural Igbo.
