id: HEB.11.16
reference: Hebrews 11:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νῦν δὲ κρείττονος ὀρέγονται, τοῦτ’ ἔστιν ἐπουρανίου. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, ἡτοίμασεν γὰρ αὐτοῖς πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: ig
  text: Ma ugbu a, ha na-achọ ala nna ka mma[a]—ya bụ, nke dị n’eluigwe. N’ihi ya, Chineke adịghị eme ihere ka a kpọọ ya Chineke ha, n’ihi na ọ kwadebeere ha obodo ukwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “obodo ka mma.” N’asụsụ Grik, e kwughị aha ahụ kpọmkwem n’amaokwu a; nkowaaha abụọ ahụ nọ n’ụdị nwanyị, o yikwara ka ha na-ezo azụ n’echiche “ala nna” ma ọ bụ “obodo” dị n’amaokwu ndị gbara ya gburugburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Ma otú ọ dị ugbu a
  rationale: Ọ na-egosi ọnọdụ dị adị nke dị iche n’ihe a tụlere n’amaokwu bu ụzọ; okwu a na-arụ ọrụ dịka njikọ echiche, ọ bụghị naanị ihe na-egosi oge.
- source_word: κρείττονος
  choice: ka mma
  rationale: Nke a na-egosipụta ntụnyere pụtara ‘better/superior’ n’Igbo nkịtị ma dị ùgwù.
- source_word: ὀρέγονται
  choice: ha na-achọsi ... ike
  rationale: Ụdị okwu a na-egosi ọchịchọ siri ike na ịgbatị obi iru ihe ahụ, ọ bụghị naanị ịchọ ihe n’ụzọ dị mfe.
- source_word: κρείττονος ... ἐπουρανίου
  choice: ala nna ka mma—ya bụ, nke dị n’eluigwe
  rationale: Adjective abụọ ahụ bụ feminine genitive ma na-ezo aka n’echiche πατρίς dị n’amaokwu 14. ‘Ala nna’ na-eme ka ihe e wepụrụ na Grik doo anya n’Igbo, ebe ‘nke dị n’eluigwe’ na-echekwa ọdịdị adjective ahụ.
- source_word: διὸ
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu sitere n’ọchịchọ ha nwere maka ala nke eluigwe.
- source_word: οὐκ ἐπαισχύνεται
  choice: ihere adịghị eme
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu na mmadụ adịghị eme ihere, ma na-echekwa echiche ùgwù na mmekọrịta dị n’amaokwu ahụ.
- source_word: ἐπικαλεῖσθαι αὐτῶν
  choice: ka a kpọọ ya Chineke ha
  rationale: Ọ na-echekwa echiche nke ịkpọ ma ọ bụ ịkọwa Chineke dịka Chineke nke ha, n’enweghị ịgbasa ya karịa ihe Grik kwuru.
- source_word: ἡτοίμασεν
  choice: ọ kwadebeere
  rationale: Ọ na-egosi omume Chineke mezuru maka ọdịmma ha ma nke ka dị mkpa n’ọnọdụ a.
- source_word: πόλιν
  choice: obodo ukwu
  rationale: Nke a na-egosipụta ihe oyiyi doro anya nke πόλις dịka city, ma na-ekewa ya na ‘ala nna’ e kwuru na mbụ.
theological_decisions:
- issue: Aha e wepụrụ n’akụkụ κρείττονος na ἐπουρανίου
  choice: E tinye ‘ala nna’ site n’echiche πατρίς dị n’amaokwu 14
  alternative: 'Ịsị ‘obodo’ ma ọ bụ hapụ aha ahụ: ‘ihe ka mma, ya bụ, nke eluigwe’'
  rationale: Grik ekwughị aha ahụ kpọmkwem n’amaokwu a, ma gender na ọnọdụ gbara ya gburugburu na-ejikọta ya na πατρίς. ‘Ala nna’ na-echekwa njikọ ahụ ma na-eme ka Igbo doo anya.
- issue: Usoro mmekọrịta ọgbụgba ndụ dị na ‘Chineke ha’
  choice: Ka a hapụ ya dịka ‘ka a kpọọ ya Chineke ha’
  alternative: Ịkọwa ya dịka ‘ịnabata ha dịka ndị nke ya’
  rationale: Amaokwu ahụ kwuru kpọmkwem aha e ji akpọ Chineke; ịgbasa ya ruo n’ịnabata ha dịka ndị ya ga-etinye nkọwa ọzọ nke adịghị n’okwu ahụ n’onwe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. A họọrọ ‘ala nna’ maka echiche πατρίς, ebe ‘obodo ukwu’ na-egosipụta πόλις n’ụzọ doro anya ma gbochie ka otu okwu ‘obodo’ buru echiche abụọ dị iche n’otu amaokwu.
