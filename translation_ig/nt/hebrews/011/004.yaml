id: HEB.11.4
reference: Hebrews 11:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: ig
  text: Ọ bụ site n’okwukwe ka Ebel ji chụọrọ Chineke àjà ka mma karịa nke Ken[a]. Site n’àjà ahụ ka e si gbaara ya àmà na ọ bụ onye ezi omume[b], ebe Chineke gbara àmà banyere onyinye ya. Sitekwa na ya[c], n’agbanyeghị na ọ nwụrụ, ọ ka na-ekwu okwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “àjà ka ukwuu.” Okwu ntụnyere Grik ahụ nwere ike imesi ịdị mma ma ọ bụ ịdị ukwuu ike.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a kwadoro ya dịka onye ezi omume,” ma ọ bụ, “e toro ya dịka onye ezi omume.”
    reason: lexical_alternative
  - marker: c
    text: “Site na ya” nwere ike izo aka n’okwukwe Ebel ma ọ bụ n’àjà ya; Grik akọwaghị ya kpọmkwem.
    reason: alternative_reading
lexical_decisions:
- source_word: Πίστει
  choice: site n’okwukwe
  rationale: Nke a na-egosi ụzọ ma ọ bụ ihe Ebel ji mee ihe ahụ. “Okwukwe” bụ okwu Igbo doro anya ma kwekọọ n’isiokwu Hibru 11.
- source_word: πλείονα θυσίαν
  choice: àjà ka mma
  rationale: πλείων nwere ike ịpụta ihe ka mma ma ọ bụ ihe ka ukwuu; n’ebe a, “ka mma” bụ okwu Igbo dị mfe ma dabara n’iji ntụnyere kọwaa àjà Ebel.
- source_word: παρὰ Κάϊν
  choice: karịa nke Ken
  rationale: παρά sochiri okwu ntụnyere na-egosi onye ma ọ bụ ihe e ji atụnyere. “Nke Ken” na-eme ka nkwukọrịta Igbo doo anya na a na-atụnyere àjà Ebel na àjà Ken.
- source_word: προσήνεγκεν τῷ θεῷ
  choice: chụọrọ Chineke àjà
  rationale: N’ọnọdụ ofufe na àjà, “ịchụ àjà” bụ ụzọ Igbo e si akọwa προσφέρω n’ụzọ ebumpụta ụwa.
- source_word: δι’ ἧς
  choice: Site n’àjà ahụ
  rationale: Nnochiaha nwanyị ahụ na-ezo aka n’ụzọ kacha nso na θυσίαν, ya bụ àjà. Ịkpọ ya aha ọzọ na-eme ka Igbo doo anya n’enweghị mgbanwe ihe ọ pụtara.
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: e si gbaara ya àmà na ọ bụ onye ezi omume
  rationale: Nke a na-echekwa echiche nke ịgba àmà dị mkpa n’isiakwụkwọ a, ma na-ada ka Igbo nkịtị karịa ntụgharị okwu n’otu n’otu.
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: ebe Chineke gbara àmà banyere onyinye ya
  rationale: Akụkụ a na-egosi Chineke dịka onye na-agba àmà banyere onyinye Ebel. “Onyinye” na-echekwa isi okwu δῶρα ma dabara n’ọnọdụ àjà.
- source_word: δι’ αὐτῆς
  choice: Sitekwa na ya
  rationale: Nnochiaha a nwere ike izo aka n’okwukwe Ebel ma ọ bụ n’àjà ya. “Ya” na-ahapụ ohere abụọ ahụ ka ha dị, dịka Grik si mee.
- source_word: ἀποθανὼν ἔτι λαλεῖ
  choice: ọ bụ ezie na ọ nwụrụ anwụ, ọ ka na-ekwu okwu
  rationale: Nke a na-egosi ọdịiche dị n’etiti ọnwụ Ebel na okwu ya nke ka na-aga n’ihu, n’Igbo doro anya ma dị ebumpụta ụwa.
theological_decisions:
- issue: Ihe δι’ αὐτῆς dị n’ahịrịokwu ikpeazụ na-ezo aka na ya
  choice: 'Ahapụla ya n’ụzọ na-akọwaghị kpọmkwem: “Sitekwa na ya”'
  alternative: “Site n’okwukwe ahụ” ma ọ bụ “site n’àjà ahụ”
  rationale: Ụdị Grik nwere ike izo aka n’okwukwe, bụ́ isiokwu nke isiakwụkwọ a, ma ọ bụ n’àjà, bụ́ aha nwanyị dị nso. A naghị ekpebi ihe Grik hapụrụ ka o nwee nghọta abụọ.
- issue: Ike okwu ἐμαρτυρήθη
  choice: E ji asụsụ ịgba àmà sụgharịa ya
  alternative: “a kwadoro ya” ma ọ bụ “Chineke nabatara ya”
  rationale: Ịgba àmà bụ echiche a na-eme ugboro ugboro na Hibru 11. Nhọrọ a na-echekwa ya ma ghara ịgbakwunye echiche nke nnabata nke okwu Grik na-ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. E chekwara usoro ịgba àmà nke akwụkwọ Hibru, ma ahapụkwa mgbagwoju anya dị n’eziokwu banyere ihe nnochiaha ikpeazụ na-ezo aka na ya.
