- from: Ọ bụ site n’okwukwe ka Ebel ji chụọrọ Chineke àjà ka mma karịa nke Ken[a]. Site n’àjà ahụ ka e si gbaara ya àmà na ọ bụ onye ezi omume[b], ebe Chineke gbara àmà banyere onyinye ya. Sitekwa na ya[c], ọ bụ ezie na ọ nwụrụ anwụ, ọ ka na-ekwu okwu.
  to: Ọ bụ site n’okwukwe ka Ebel ji chụọrọ Chineke àjà ka mma karịa nke Ken[a]. Site n’àjà ahụ ka e si gbaara ya àmà na ọ bụ onye ezi omume[b], ebe Chineke gbara àmà banyere onyinye ya. Sitekwa na ya[c], n’agbanyeghị na ọ nwụrụ, ọ ka na-ekwu okwu.
