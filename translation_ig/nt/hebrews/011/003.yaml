id: HEB.11.3
reference: Hebrews 11:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πίστει νοοῦμεν κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ, εἰς τὸ μὴ ἐκ φαινομένων ⸂τὸ βλεπόμενον⸃ γεγονέναι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: ig
  text: Ọ bụ site n’okwukwe ka anyị ji aghọta na e ji okwu Chineke hazie ụwa niile[a], ka ihe a na-ahụ anya ghara isi n’ihe a na-ahụ anya pụta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oge niile,” “ụwa dị iche iche,” ma ọ bụ “eluigwe na ụwa dum.” N’asụsụ Grik, ọ bụ “aịọn ndị ahụ” (ages), okwu nke pụrụ izo aka n’usoro ụwa n’akụkụ oge ya niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: site n’okwukwe
  rationale: Dative a na-egosi ụzọ e si eme ihe; okwu a dị nkenke ma na-edobe usoro a na-emegharị ugboro ugboro n’isiakwụkwọ a.
- source_word: νοοῦμεν
  choice: anyị ji aghọta
  rationale: Ọ na-egosi nghọta nke uche, ọ bụghị naanị ihe mmadụ ji anya hụ.
- source_word: κατηρτίσθαι
  choice: hazie
  rationale: Ọ na-egosi ịkwadebe, ịtọ n’usoro, ma ọ bụ ime ka ihe guzosie ike n’usoro kwesịrị ya, na-enweghị ịkọwa usoro okike karịa ihe Grik kwuru.
- source_word: τοὺς αἰῶνας
  choice: ọgbọ niile
  rationale: αἰῶνες pụtara n'ụzọ bụ isi ‘ọgbọ’ ma n’ebe a ọ pụrụ ịgụnye usoro ụwa dum n’ime oge; nkọwa ala peeji na-edobe nhọrọ ndị ọzọ.
- source_word: ῥήματι θεοῦ
  choice: e ji okwu Chineke
  rationale: ῥῆμα na-ezo aka n’okwu e kwuru; usoro ‘e ji’ na-egosipụta na okwu Chineke bụ ụzọ e si hazie ha.
- source_word: εἰς τὸ μὴ ... γεγονέναι
  choice: nke mere na ... esiteghị ... dịrị
  rationale: Nke a na-egosipụta nsonaazụ ma na-edobe echiche γίνομαι banyere ịbịa ịdị adị.
- source_word: ἐκ φαινομένων
  choice: n’ihe ndị na-apụta ìhè
  rationale: Ọ na-ezo aka n’ihe ndị pụtara ma ọ bụ ndị a pụrụ ịhụ; okwu a na-edobe ntakịrị obosara dị n’okwu Grik.
- source_word: τὸ βλεπόμενον
  choice: ihe a na-ahụ anya
  rationale: Participle a na-arụ ọrụ dị ka aha ma nwee nghọta mkpokọta, ya bụ, ihe niile dị n’usoro a pụrụ ịhụ.
theological_decisions:
- issue: Oke ihe αἰῶνες na-ezo aka n’ihe banyere okike
  choice: ọgbọ niile
  alternative: ụwa niile; eluigwe na ụwa dum
  rationale: Nhọrọ a na-edobe akụkụ oge nke okwu Grik, ebe nkọwa ala peeji na-egosi na ọ pụkwara ịgụnye usoro ụwa dum, ka a ghara ime ka ọ bụrụ naanị ihe gbasara mbara ụwa.
- issue: Ma amaokwu ahụ ò kwuru kpọmkwem na Chineke kere ihe site n’ihe efu
  choice: E kwughị kpọmkwem ‘site n’ihe efu’; e kwuru na ihe a na-ahụ anya esiteghị n’ihe ndị na-apụta ìhè dịrị.
  alternative: ịsụgharị ya n’ụzọ ga-ekwu hoo haa na Chineke kere ihe site n’ihe efu
  rationale: Okwu Grik kwekọrọ n’ozizi okike site n’ihe efu, ma ihe o kwuru kpọmkwem bụ na ihe a na-ahụ anya esiteghị n’ihe ndị a pụrụ ịhụ dịrị. Nsụgharị ahụ anaghị agbakwunye nkwupụta karịrị nke ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji ‘ọgbọ niile’ debe ịdị nso n’okwu Grik, ma tinye nkọwa ala peeji iji gosi nghọta kosmik ya.
