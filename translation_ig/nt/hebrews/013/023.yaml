  text: γινώσκετε τὸν ἀδελφὸν ⸀ἡμῶν Τιμόθεον ἀπολελυμένον, μεθ’ οὗ ἐὰν τάχιον ἔρχηται ὄψομαι ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/023.yaml
  text: Know that our brother Timothy has been released[a], with whom I will see you if he comes soon.
translation:
  language: ig
  text: Marakwanụ na a tọhapụla nwanna anyị Timoti[a]; ọ bụrụ na ọ bịara n'oge na-adịghị anya, mụ na ya ga-ahụ unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a hapụla ya ka ọ nweere onwe ya,” ikekwe site n'ụlọ mkpọrọ. Ngwaa a nwekwara ike ịpụta “ezipụla ya” ma ọ bụ “ahapụla ya ka ọ laa,” ma “a tọhapụla” yiri ka ọ kacha dabara n'ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: Marakwanụ
  rationale: Ọ bụ iwu dị n'ụdị ọtụtụ nke na-agwa ndị na-agụ akwụkwọ ka ha mara ozi a; “Marakwanụ” na-edobe ike iwu ahụ n'Igbo dị mfe ma kwanyere ùgwù.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: nwanna anyị
  rationale: Nke a bụ okwu ezinụlọ ndị Kraịst ji akọwa Timoti dị ka onye ha na ya nwere otu okwukwe; “nwanna anyị” bụ okwu Igbo nkịtị ma doo anya.
- source_word: Τιμόθεον
  choice: Timoti
  rationale: E dere aha onye ahụ dịka a na-asụkarị ya n'Igbo.
- source_word: ἀπολελυμένον
  choice: a tọhapụla
  rationale: Perfect passive participle na-egosi ihe e merechaala nke ka dị mkpa ugbu a. “A tọhapụla” kacha dabara n'echiche nke ịhapụ onye e jidere, ma nkọwa ndị ọzọ nke ngwaa ahụ ka dị ike, ya mere e tinyere ha n'okpuru peeji.
- source_word: μεθ’ οὗ
  choice: mụ na ya
  rationale: N'usoro Igbo, “mụ na ya ga-abịa hụ unu” na-egosi nke ọma na onye dere akwụkwọ ga-eso Timoti, ma na-ezere usoro siri ike nke ntụgharị mkpụrụokwu n'ụzọ mkpụrụokwu.
- source_word: ἐὰν τάχιον ἔρχηται
  choice: Ọ bụrụ na ọ bịara n'oge na-adịghị anya
  rationale: Nke a na-edobe ọnọdụ na-ejighị n'aka nke ἐάν na echiche idiomatic nke τάχιον, ya bụ ịbịa n'oge adịghị anya.
- source_word: ὄψομαι ὑμᾶς
  choice: ga-abịa hụ unu
  rationale: “Hụ unu” na-edobe isi echiche nke ὄψομαι; “ga-abịa” na-eme ka okwu ahụ bụrụ Igbo sitere n'okike n'ihe gbasara njem onye dere akwụkwọ na Timoti, n'enweghị ịgbanwe ya ka ọ bụrụ naanị “leta unu.”
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma kwanyere ùgwù. E kewara ahịrịokwu ahụ ụzọ abụọ ka ozi ahụ doo anya, ma e debere ọnọdụ na-ejighị n'aka banyere ọbịbịa Timoti na ọtụtụ onye a na-agwa okwu.
