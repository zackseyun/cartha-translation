id: HEB.13.22
reference: Hebrews 13:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: ig
  text: Ana m arịọ unu, ụmụnna[a], jirịnụ ndidi nabata okwu agbamume a[b], n’ihi na ọ bụ ná nkenke ka m degaara unu akwụkwọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik pụtara n’ụzọ nkịtị “ụmụnne nwoke,” ma n’ebe a ọ pụrụ ịbụ okwu a na-akpọ ọgbakọ dum, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “okwu agbamume” dịka “ozi ndụmọdụ na nkasi obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ δὲ ὑμᾶς
  choice: Ma ana m arịọ unu
  rationale: “Ana m arịọ unu” na-egosipụta arịrịọ siri ike ma dị ùgwù nke παρακαλῶ; “Ma” na-eburu mgbanwe okwu dị nro nke δέ n’ebughị echiche nke nnukwu mmegide.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo a na-eji akpọ ndị otu okwukwe ma ọ bụ obodo; ọ dabara n’ụdị okwu a na-akpọ ndị na-ege ntị, ebe nkọwa ala peeji na-echekwa ọdịdị nwoke nke okwu Grik na ohere ọ na-agụnye ọgbakọ dum.
- source_word: ἀνέχεσθε
  choice: jirinụ ndidi nabata
  rationale: Nke a na-egosipụta idi ihe na nnabata nke ἀνέχεσθε n’Igbo nkịtị, n’enweghị ụda mkparị nke ịsị naanị “nagidenụ.”
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: okwu agbamume a
  rationale: λόγος ebe a bụ ozi e kwuru ma ọ bụ e dere, ebe παράκλησις nwere ike ịbụ agbamume, ndụmọdụ siri ike, ma ọ bụ nkasi obi. “Okwu agbamume” na-echekwa isi echiche ahụ n’asụsụ dị mfe.
- source_word: καὶ γὰρ
  choice: n’ihi na
  rationale: Njikọ ahụ na-enye ihe kpatara arịrịọ onye dere akwụkwọ ji rịọ ha; “n’ihi na” bụ ụzọ Igbo sitere n’okike isi gosipụta ya.
- source_word: διὰ βραχέων
  choice: ná nkenke
  rationale: Nkebiokwu Grik a pụtara ide ihe n’okwu ole na ole ma ọ bụ n’ụzọ dị nkenke.
- source_word: ἐπέστειλα ὑμῖν
  choice: ka m degaara unu akwụkwọ
  rationale: Ngwaa ahụ nwere ike ịpụta ide ma ọ bụ iziga ozi/akwụkwọ. “Degaara unu akwụkwọ” na-eme ka ọnọdụ akwụkwọ ozi doo anya n’Igbo n’ebughị nkọwa ọzọ na-adịghị na isi mmalite.
theological_decisions:
- issue: Ndị ἀδελφοί na-ezo aka na ha
  choice: ụmụnna
  alternative: ụmụnne nwoke; ụmụnna nwoke na ụmụnna nwanyị
  rationale: Okwu Grik dị n’ụdị nwoke ọtụtụ, ma n’ụdị ịkpọ ọgbakọ ọ pụrụ ịgụnye ma ndị nwoke ma ndị nwanyị. “Ụmụnna” bụ okwu Igbo kwesịrị ekwesị nke na-adịghị ekpebi karịa ka ihe odide ahụ kpebiri; nkọwa ala peeji na-egosi ọdịdị na ohere abụọ ahụ.
- issue: Uche dị n’okwu παράκλησις
  choice: agbamume
  alternative: ndụmọdụ siri ike; nkasi obi
  rationale: παράκλησις nwere obosara echiche nke agbamume, ịdụ ọdụ, na mgbe ụfọdụ nkasi obi. Isi okwu “agbamume” na-ahapụ obosara a ka ọ dịrị, ebe nkọwa ala peeji na-enye ụzọ ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Jirinụ ndidi nabata” na-eme ka arịrịọ ahụ bụrụ ihe sitere n’okike n’Igbo, ebe “ná nkenke ka m degaara unu akwụkwọ” na-echekwa nkwupụta onye dere akwụkwọ banyere ịdị nkenke ya.
