  text: περισσοτέρως δὲ παρακαλῶ τοῦτο ποιῆσαι ἵνα τάχιον ἀποκατασταθῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/019.yaml
  text: And I urge you all the more to do this[a], so that I may be restored to you sooner.
translation:
  language: ig
  text: Ana m arịọ unu n’isi ike karị ka unu mee nke a, ka e weghachite m nye unu n’oge dị nso karịa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka e kpọghachikwute unu m.” Okwu Grik ahụ na-ekwu n’ozuzu banyere iweghachi onye dere ya nye ndị a na-agwa okwu, ma ọ kọwaghị kpọmkwem ọnọdụ nke mere ka ha kewapụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσοτέρως
  choice: ike karị
  rationale: Nke a na-eme ka arịrịọ ahụ sie ike karịa, ma na-echekwa ntụnyere dị n’okwu Grik.
- source_word: δὲ
  choice: -kwa
  rationale: N’ebe a, δέ na-ejikọta okwu a nwayọọ n’ihe e kwuru tupu ya; mgbakwunye “-kwa” na-eme nke a n’Igbo n’enweghị ime ka ọ bụrụ mgbagha siri ike.
- source_word: παρακαλῶ
  choice: ana m arịọsi unu ike
  rationale: N’ọnọdụ a, ngwaa ahụ bụ arịrịọ siri ike, ọ bụghị naanị iwu ma ọ bụ ndụmọdụ.
- source_word: τοῦτο ποιῆσαι
  choice: ka unu mee nke a
  rationale: Ọ na-ezo aka n’arịrịọ ekpere e kwuru n’amaokwu bu ya ụzọ ma na-edobe ntụaka ahụ n’ụzọ doro anya.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a na-egosi nzube n’Igbo n’ụzọ ebumpụta ụwa.
- source_word: τάχιον
  choice: ngwa ngwa
  rationale: Ọ na-egosi na onye dere akwụkwọ ahụ chọrọ ka nlọghachi ya mee ọsịsọ; n’usoro Igbo a, “ngwa ngwa” na-ebupụta echiche ntụnyere ahụ site n’ihe ndị gbara ya gburugburu.
- source_word: ἀποκατασταθῶ
  choice: ka m wee bịaghachikwute unu
  rationale: Nhọrọ a bụ Igbo dị mfe ma dị ndụ maka olileanya nke ịlaghachikwuru ndị na-agụ akwụkwọ ahụ. Ihe odide Grik nwere ike ịpụta ‘ka e weghachikwute unu m,’ ma ọ kọwaghị ọnọdụ mere ka ha kewapụ.
- source_word: ὑμῖν
  choice: unu
  rationale: “Unu” na-egosi nke ọma na a na-agwa ọtụtụ ndị okwu, dị ka nnọchiaha Grik ahụ si dị.
theological_decisions:
- issue: Ihe mere onye dere akwụkwọ ahụ ji chọọ ịlaghachikwuru ndị na-agụ ya
  choice: E debere ya dị ka olileanya izutekwa ha n’oge na-adịghị anya, n’agwaghị ihe kpọmkwem mere ha ji nọrọ iche.
  alternative: Ịsị na a ga-ahapụ ya n’ụlọ mkpọrọ, na ọ ga-agbake n’ọrịa, ma ọ bụ na ọ ga-alaghachi n’ozi ya n’etiti ha.
  rationale: ἀποκατασταθῶ ὑμῖν na-ekwu maka iweghachikwuru ndị ahụ, ma ọ naghị ekwu ma ihe kpatara nkewa ahụ ọ bụ mkpọrọ, ọrịa, njem, ma ọ bụ ihe ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. “Ana m arịọsikwa unu ike karị” na-edobe ike ntụnyere dị na περισσοτέρως, ebe “bịaghachikwute unu” na-eme ka ahịrịokwu ahụ bụrụ nke ndị Igbo na-asụ n’enweghị ịkọwapụta ọnọdụ akụkọ ihe mere eme nke Grik na-ekwughị.
