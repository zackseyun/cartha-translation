revisions:
- from: Na-echetanụ ndị nọ n’ụlọ mkpọrọ[a], dị ka unu na ha nọ n’agbụ; na-echetanụkwa ndị a na-emegbu[b], ebe unu onwe unu nọkwa n’ahụ.
  to: Na-echetanụ ndị nọ n’ụlọ mkpọrọ[a], dị ka a ga-asị na e jikọtara unu na ha n’agbụ; na-echetanụkwa ndị a na-emegbu[b], ebe unu onwe unu nọkwa n’ahụ.
  rationale: The revision clarifies that the readers are to remember prisoners in empathetic solidarity, as though they themselves had been bound together with them, rather than asserting that both parties are literally in chains. The footnote is adjusted only for idiomatic clarity while retaining the stated interpretive alternatives.
