base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: ig
  text: Na-echetanụ ndị nọ n’ụlọ mkpọrọ[a], dị ka a ga-asị na e jikọtara unu na ha n’agbụ; na-echetanụkwa ndị a na-emegbu[b], ebe unu onwe unu nọkwa n’ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “dị ka ndị e jikọtara ha na ha n’agbụ.” Okwu Grik ahụ na-eweta kpọmkwem echiche nke ịbụ ndị e jikọtara na ndị mkpọrọ n’agbụ.
    reason: lexical_alternative
  - marker: b
    text: Okwu “n’ahụ” nwere ike ịbụ ntụaka banyere ịbụ ndị so n’ahụ Kraịst; ma ihe o yikarịrị ka ọ pụtara bụ na unu onwe unu kwa nwere ahụ mmadụ nke nwere ike ịta ahụhụ.
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: Na-echetanụ
  rationale: Ụdị iwu dị ugbu a na-egosi omume a ga na-eme mgbe niile. “Na-echetanụ” bụ Igbo nkịtị nke na-egosi ncheta na-adịgide adịgide, ọ bụghị naanị icheta otu ugboro.
- source_word: τῶν δεσμίων
  choice: ndị nọ n’ụlọ mkpọrọ
  rationale: δέσμιος bụ onye e kere agbụ ma ọ bụ onye mkpọrọ. Nhọrọ a bụ okwu Igbo doro anya ma dị mfe nghọta, ebe ahịrịokwu na-esote ka na-edebe ihe atụ nke agbụ.
- source_word: ὡς συνδεδεμένοι
  choice: dị ka unu na ha nọ n’agbụ
  rationale: συνδέομαι na-akọwa ịbụ ndị e jikọtara n’agbụ. Nsụgharị a na-edebe ihe atụ ahụ ma na-egosikwa ka ndị na-agụ akwụkwọ kwesịrị isi were ahụhụ ndị mkpọrọ dịka nke ha.
- source_word: τῶν κακουχουμένων
  choice: ndị a na-emegbu
  rationale: κακουχέομαι pụtara mmadụ ịnata mmeso ọjọọ ma ọ bụ mmegbu n’aka ndị ọzọ. “Ndị a na-emegbu” na-edebe echiche nke ihe ndị ọzọ na-eme ha.
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: ebe unu onwe unu nọkwa n’ahụ
  rationale: 'Nke a na-esochi okwu Grik “ịnọ n’ahụ” nso ma na-ahapụ ohere maka ihe ọ pụtara: ahụ mmadụ nke nwere ike ịta ahụhụ, yana nkwughachi o nwere ike inwe banyere otu ahụ.'
theological_decisions:
- issue: Ihe “ịnọ n’ahụ” (ἐν σώματι) pụtara
  choice: Ọnọdụ mmadụ niile nwere n’ahụ nke nwere ike ịta ahụhụ
  alternative: Ịbụ ndị so n’ahụ Kraịst
  rationale: Ihe gbara ya gburugburu na-akpọ ndị kwere ekwe ka ha nwee ọmịiko n’ebe ndị mkpọrọ na ndị a na-emegbu nọ, n’ihi na ha onwe ha nwekwara ahụ nke nwere ike ịta ahụhụ. Ma e debere okwu “n’ahụ” ka a ghara imechi kpamkpam ohere nke nghọta gbasara ahụ Kraịst.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Na-echetanụ” na-egosi iwu na-aga n’ihu; “n’agbụ” na-edebe ihe oyiyi Grik; e debeghịkwa “n’ahụ” n’ụzọ ga-ekpebi naanị otu n’ime nghọta abụọ nwere ike ịdị.
