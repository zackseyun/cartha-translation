    reason: alternative_reading
  revision_rationale: The revision clarifies that the readers are to remember prisoners in empathetic solidarity, as though they themselves had been bound together with them, rather than asserting that both parties are literally in chains. The footnote is adjusted only for idiomatic clarity while retaining the stated interpretive alternatives.
