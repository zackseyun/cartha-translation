id: HEB.13.17
reference: Hebrews 13:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: ig
  text: Kwerenụ ndị ndu unu, nyefekwanụ ha ụzọ,[a] n’ihi na ha na-eche mkpụrụ obi unu nche dị ka ndị ga-aza ajụjụ. Ka ha wee jiri ọṅụ rụọ nke a, ọ bụghịkwa n’ịsụ ude; n’ihi na nke a agaghị abara unu uru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Ruberenụ ndị ndu unu isi.” Okwu Grik Πείθεσθε nwere ike ịpụta irube isi, ma n’ụzọ kpọmkwem ọ na-egosi ikwere ma ọ bụ ịbụ onye e mere ka o kwenye.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πείθεσθε
  choice: Kweenụ ka ndị ndu unu mee ka unu kwenye
  rationale: Nke a na-egosipụta isi echiche nke ịbụ onye e mere ka o kwenye, kama ime ka okwu ahụ bụrụ naanị nrubeisi n’iwu. N’ihi na n’Igbo usoro a nwere ike ịdịtụ arọ, e debere ‘Ruberenụ ndị ndu unu isi’ dịka ntụgharị ọzọ n’ala peeji.
- source_word: ἡγουμένοις
  choice: ndị ndu unu
  rationale: Ọ na-ezo aka n’ebe ndị a ma ama na-edu ọgbakọ nọ, na-etinyeghị echiche ọchịchị aka ike n’okwu ahụ.
- source_word: ὑπείκετε
  choice: na-ekwenyekwara ha
  rationale: N’ebe a ọ pụtara ikwe ka onye ọzọ duzie gị ma ọ bụ inye ya ohere; ntụgharị a dị mfe nghọta ma na-edobe ya iche n’echiche Πείθεσθε.
- source_word: ἀγρυπνοῦσιν
  choice: na-eche mkpụrụ obi unu nche
  rationale: Ọ na-edobe ihe atụ nke ịmụ anya na ilekọta ndị ọzọ anya mgbe niile.
- source_word: ψυχῶν
  choice: mkpụrụ obi unu
  rationale: Nke a na-edobe ịdị arọ ime mmụọ nke ψυχή n’ebe a, ọ bụ ezie na okwu Grik ahụ nwekwara ike ịgụnye ndụ ma ọ bụ mmadụ n’ozuzu ya.
- source_word: ὡς λόγον ἀποδώσοντες
  choice: dị ka ndị ga-aza ajụjụ banyere ha
  rationale: Ọ na-egosi na ndị ndu ahụ ga-enye nkọwa banyere nlekọta ha; nnọchiaha ‘ha’ na-ezo aka ná mkpụrụ obi ndị ahụ.
- source_word: μετὰ χαρᾶς
  choice: jiri ọṅụ
  rationale: Ọ bụ ntụgharị Igbo doro anya ma bụrụkwa nke ebumpụta ụwa maka ime ihe ‘n’ọṅụ.’
- source_word: στενάζοντες
  choice: site n’ịsụ ude
  rationale: Ọ na-edobe ihe oyiyi a na-ahụ anya nke ịsụ ude, kama ịgbanwe ya naanị ka ọ bụrụ mwute.
- source_word: ἀλυσιτελὲς
  choice: agaghị abara unu uru
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi kwuo ihe na-adịghị enye uru, n’etinyeghị echiche siri ike karịa nke okwu Grik ahụ.
theological_decisions:
- issue: Ụdị ọkpụkpọ a kpọrọ ndị kwere ekwe n’ebe ndị ndu ọgbakọ nọ
  choice: Ọ na-akpọ ha ka ha gee ntị n’ụzọ ga-eme ka ha kwenye ma kwe ka ndị ndu duzie ha, ebe ndị ndu ahụ ga-aza ajụjụ banyere nlekọta ha.
  alternative: Iwu ka a rubere ndị ndu isi n’enweghị oke ọ bụla.
  rationale: Ngwakọta Πείθεσθε na ὑπείκετε na-egosi nkwenye na inyefe ụzọ, ma ihe kpatara iwu ahụ bụ nlekọta ndị ndu na ibu ọrụ ha ịza ajụjụ; ya mere, a naghị eme ka amaokwu ahụ kwado ọchịchị aka ike.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta mee ihe. A họọrọ ahịrịokwu na-egosipụta ọdịiche dị n’etiti ịbụ onye e mere ka o kwenye na ikwe ka ndị ndu duzie ya; e zere okwu ga-eme ka ikike ndị ndu yie nke na-enweghị oke.
