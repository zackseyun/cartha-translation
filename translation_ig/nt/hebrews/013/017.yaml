revisions:
- from: Kweenụ ka ndị ndu unu mee ka unu kwenye, na-ekwenyekwara ha[a], n’ihi na ha na-eche mkpụrụ obi unu nche dị ka ndị ga-aza ajụjụ banyere ha. Ka ha wee jiri ọṅụ rụọ ọrụ a, ọ bụghịkwa site n’ịsụ ude, n’ihi na nke ahụ agaghị abara unu uru.
  to: Kwerenụ ndị ndu unu, nyefekwanụ ha ụzọ,[a] n’ihi na ha na-eche mkpụrụ obi unu nche dị ka ndị ga-aza ajụjụ. Ka ha wee jiri ọṅụ rụọ nke a, ọ bụghịkwa n’ịsụ ude; n’ihi na nke a agaghị abara unu uru.
  rationale: The opening has been recast as two coordinated Standard Igbo imperatives. “Kwerenụ ndị ndu unu” retains the responsive-trust/persuasion nuance of Πείθεσθε without weakening the exhortation, while “nyefekwanụ ha ụzọ” distinctly renders ὑπείκετε. The accountability phrase remains appropriately implicit, as in Greek. The footnote preserves the legitimate stronger alternative, ‘obey,’ without presenting it as the sole sense.
  reviewer_model: gpt-5.6-terra
