  text: τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε, τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: ig
  text: Unu echefula ime ihe ọma na ikekọrịta ihe[a][b], n’ihi na àjà ndị dị otú ahụ na-atọ Chineke ụtọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “unu echefula” ka ọ bụrụ “unu elegharakwala.” Okwu Grik ahụ pụtara “ichefu” n’ụzọ nkịtị, ma n’ebe a ọ na-egosi ịghara ilekọta ma ọ bụ ime omume ndị a.
    reason: lexical_alternative
  - marker: b
    text: “Ikekọrịta ihe” nwekwara ike ịbụ “mmekọrịta” ma ọ bụ “imesapụ aka.” N’ebe a, o yikarịrị ka ọ na-ekwu banyere ikekọrịta ihe n’ụzọ bara uru, ma ọ bụghị nanị mmekọrịta mmadụ na ibe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: ime ihe ọma
  rationale: Nke a na-egosi omume bara uru nke imere ndị ọzọ ihe ọma, ma bụrụkwa okwu Igbo doro anya ma dị n’ụzọ e si ekwu okwu taa.
- source_word: κοινωνίας
  choice: iso ndị ọzọ kerịta ihe unu nwere
  rationale: N’ọnọdụ a, okwu ahụ na-arụtụ aka n’ikekọrịta ihe n’ụzọ bara uru, ọkachasị ihe mmadụ nwere, karịa nanị mmekọrịta mmadụ na ibe ya; ntụgharị a edoghị ya anya gabiga ihe Grik kwuru.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: unu echefula
  rationale: Nke a na-edobe ihe okwu Grik pụtara n’ụzọ nkịtị, ma n’ọdụmọdụ a ọ pụtakwara ka ha ghara ileghara omume ndị a anya.
- source_word: τοιαύταις ... θυσίαις
  choice: àjà ndị dị otú ahụ
  rationale: Nke a na-echekwa ihe atụ nke ịchụ àjà, nke ji ime ihe ọma na ikekọrịta ihe tụnyere àjà a na-achụrụ Chineke.
- source_word: εὐαρεστεῖται
  choice: na-atọ ... ụtọ
  rationale: Akpaalaokwu Igbo a na-egosi nke ọma na Chineke nwere mmasị n’àjà ndị ahụ ma na-anabata ha.
- source_word: ὁ θεός
  choice: Chineke
  rationale: Ọ bụ ntụgharị Igbo a na-ejikarị eme ihe maka aha isiokwu ahụ.
- source_word: δὲ
  choice: na
  rationale: Njikọ a na-aga n’ihu n’ọdụmọdụ ndị bu ya ụzọ n’enweghị igosi nnukwu mmegide.
theological_decisions:
- issue: Ụdị àjà a kpọrọ aha n’amaokwu a
  choice: Omume nke ime ihe ọma na ikekọrịta ihe bụ àjà ndị na-atọ Chineke ụtọ n’ụzọ ihe atụ
  alternative: Ịkọwa ya nanị dị ka inye onyinye ebere, ma ọ bụ iwepụ echiche ịchụ àjà kpamkpam wee mee ya naanị omume ọma
  rationale: Grik kpọrọ omume ndị a θυσίαις, ya bụ “àjà.” Ya mere, ntụgharị ahụ na-echekwa asụsụ ịchụ àjà, ma ọ naghị akọwa “ikekọrịta” dị ka naanị otu ụdị onyinye.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere “àjà” iji chekwaa ihe atụ okpukpe dị na Grik, ebe e mere κοινωνία ka ọ pụta ìhè dị ka ikekọrịta ihe n’ụzọ bara uru.
