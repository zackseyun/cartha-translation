revisions:
- from: Unu echefula ime ihe ọma na iso ndị ọzọ kerịta ihe unu nwere[a][b], n’ihi na àjà ndị dị otú ahụ na-atọ Chineke ụtọ.
  to: Unu echefula ime ihe ọma na ikekọrịta ihe[a][b], n’ihi na àjà ndị dị otú ahụ na-atọ Chineke ụtọ.
  rationale: The revision removes interpretive additions from the main rendering of κοινωνίας, retaining the broad wording “ikekọrịta ihe” while allowing the likely practical sense to be noted in the footnote. It also makes the alternative in footnote a idiomatic Standard Igbo. The source’s two ethical acts, sacrificial comparison, and assertion that God is pleased are all preserved.
