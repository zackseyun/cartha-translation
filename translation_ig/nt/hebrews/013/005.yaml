id: HEB.13.5
reference: Hebrews 13:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀφιλάργυρος ὁ τρόπος· ἀρκούμενοι τοῖς παροῦσιν· αὐτὸς γὰρ εἴρηκεν· Οὐ μή σε ἀνῶ οὐδ’ οὐ μή σε ⸀ἐγκαταλίπω·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: ig
  text: Ka ụzọ ndụ unu ghara ịbụ nke ịhụ ego n’anya; ka ihe unu nwere ju unu afọ, n’ihi na ya onwe ya ekwuola, “Agaghị m ahapụ gị ma ọlị[a], agaghịkwa m agbahapụ gị ma ọlị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu nkwa a na-emegharị nkwa ọgbụgba ndụ dị n’Agba Ochie, karịchaa Diuterọnọmi 31:6, 8 na Jọshụa 1:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος
  choice: ghara ịbụ nke ịhụ ego n’anya
  rationale: Nke a na-egosipụta kpọmkwem na mmadụ ekwesịghị ịbụ onye ịhụ ego n’anya, kama iji okwu sara mbara dịka anyaukwu dochie ya.
- source_word: ὁ τρόπος
  choice: ụzọ ndụ unu
  rationale: N’ebe a, τρόπος na-ezo aka n’omume na ụzọ mmadụ si ebi ndụ; ‘unu’ dabara n’ịgwa ọgbakọ ahụ okwu.
- source_word: ἀρκούμενοι τοῖς παροῦσιν
  choice: ka ihe unu nwere ju unu afọ
  rationale: Nkebi a na-enye ndụmọdụ ka ha nwee afọ ojuju n’ihe dịịrị ha ugbu a; ntụgharị a bụ Igbo nkịtị ma na-echekwa echiche nke participle ahụ.
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: n’ihi na ya onwe ya ekwuola
  rationale: ‘Ya onwe ya’ na-echekwa nkwusi ike dị na αὐτός, ebe ‘ekwuola’ na-egosipụta perfect εἴρηκεν na ịdịgide nke okwu ahụ.
- source_word: Οὐ μή σε ἀνῶ
  choice: Agaghị m ahapụ gị ma ọlị
  rationale: ‘Ma ọlị’ na-eme ka nkwenye siri ike nke οὐ μή pụta ìhè n’Igbo eke.
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: agaghịkwa m agbahapụ gị ma ọlị
  rationale: ‘Agbahapụ’ na-egosipụta ịhapụ onye kpamkpam, ebe ‘ma ọlị’ na-echekwa nkwusi ike nke οὐ μή.
theological_decisions:
- issue: Onye kwuru okwu e hotara
  choice: Jide nnọchiaha ahụ dịka ‘ya onwe ya’
  alternative: Kọwaa ya dịka ‘Chineke onwe ya’
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na Chineke bụ onye kwuru ya, ma Grik nwere αὐτός, ọ bụghị θεός; ya mere, a naghị etinye aha na-adịghị n’ederede.
- issue: Nkwusi ike nke mmegide ugboro abụọ
  choice: Jiri ‘agaghị ... ma ọlị’ n’ahịrị abụọ ahụ
  alternative: Jiri naanị ‘agaghị m ahapụ gị, agaghịkwa m agbahapụ gị’
  rationale: Ọdịdị a na-enye nkwa ahụ ike kwesịrị ya ma na-anọgide bụrụ Igbo dị mma, n’enweghị imegharị okwu n’ụzọ na-adịghị eke.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma doo ndị nkịtị anya. E ji ‘ụzọ ndụ unu’ mee ka ntụaka gbasara omume pụta ìhè, ma jiri ‘ihe unu nwere ju unu afọ’ kwuo afọ ojuju n’ụzọ Igbo eke.
