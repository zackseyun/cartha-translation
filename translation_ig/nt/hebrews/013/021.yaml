revisions:
- from: ka o kwadebe unu n’ihe ọma niile ka unu wee mee uche ya, ebe ọ na-arụ n’ime anyị ihe na-atọ ya ụtọ site n’aka Jizọs bụ Mezaya, onye otuto dịrị ruo mgbe niile ebighị ebi. Amen.[a]
  to: ka o kwadebe unu n’ihe ọma niile ka unu wee mee uche ya, na-arụkwa n’ime anyị ihe na-atọ ya ụtọ n’ihu ya site na Jizọs bụ Mezaya, onye[a] otuto dịrị ruo mgbe niile ebighị ebi. Amen.
  rationale: The revision explicitly renders ‘before him,’ improves the linkage of the Greek participle ‘working,’ uses a more idiomatic expression for mediation through Jesus the Messiah, and relocates the ambiguity note to its proper anchor. It continues to leave the doxology’s referent unresolved, as does the Greek.
