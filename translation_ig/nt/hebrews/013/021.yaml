id: HEB.13.21
reference: Hebrews 13:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: ig
  text: ka o kwadebe unu n’ihe ọma niile ka unu wee mee uche ya, na-arụkwa n’ime anyị ihe na-atọ ya ụtọ n’ihu ya site na Jizọs bụ Mezaya, onye[a] otuto dịrị ruo mgbe niile ebighị ebi. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Onye” nwere ike izo aka kpọmkwem na Jizọs bụ Mezaya; ụfọdụ na-aghọta ya dịka onye na-ezo aka na Chineke nke udo, onye a na-ekpe ekpere a n’ebe ọ nọ.
    reason: alternative_reading
lexical_decisions:
- source_word: καταρτίσαι
  choice: ka o kwadebe unu
  rationale: N’arịrịọ ngọzi a, okwu a na-arịọ ka Chineke mee ka ndị kwere ekwe dị njikere ma nwee ihe dị ha mkpa iji rube isi; “kwadebe” bụ Igbo doro anya ma dịkwa ndụ.
- source_word: ἐν παντὶ ἀγαθῷ
  choice: n’ihe ọma niile
  rationale: Nke a na-edobe usoro Greek “n’ihe ọma niile” ma na-ada nke ọma n’Igbo n’akụkụ “kwadebe.”
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: ka unu wee mee uche ya
  rationale: “Ka ... wee” na-egosipụta nzube nke infinitive ahụ n’Igbo nkịtị ma doo anya.
- source_word: ποιῶν ἐν ἡμῖν
  choice: ebe ọ na-arụ n’ime anyị
  rationale: Nke a na-egosipụta ọrụ Chineke na-aga n’ihu n’ime ndị kwere ekwe, ma ghara ịtụgharị ya ịbụ naanị ọrụ n’etiti ha.
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: ihe na-atọ ya ụtọ
  rationale: Okwu a na-enye Igbo ebumpụta ụwa maka ihe dị Chineke mma; onye a na-atọ ụtọ ka doro anya site na “ya.”
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: site n’aka Jizọs bụ Mezaya
  rationale: “Site n’aka” na-egosipụta onye e si n’aka ya mee ihe; Χριστός ka e nyere dị ka utu aha “Mezaya,” ọ bụghị naanị aha mmadụ.
- source_word: ᾧ ἡ δόξα
  choice: onye otuto dịrị
  rationale: Relative clause a na-edobe “onye” n’enweghị ịkpọ kpọmkwem ma ọ bụ Chineke ma ọ bụ Jizọs bụ Mezaya, si otú a chekwaa ihe Greek hapụrụ ghere oghe.
- source_word: εἰς τοὺς αἰῶνας
  choice: ruo mgbe niile ebighị ebi
  rationale: Nke a bụ okwu Igbo kwesịrị ekwesị maka oge na-enweghị ọgwụgwụ ma na-edobe ụda doxology.
theological_decisions:
- issue: Onye ᾧ (“onye”) na-ezo aka n’ahịrị otuto ahụ
  choice: E debere ya dịka “onye otuto dịrị” n’enweghị ịkpọ onye ọ bụ kpọmkwem.
  alternative: Ọ pụrụ izo aka kpọmkwem na Jizọs bụ Mezaya, ma ọ bụ na Chineke nke bụ isi onye a na-arịọ arịrịọ a.
  rationale: N’usoro Greek, onye kacha nso bụ Jizọs bụ Mezaya, ma isiokwu nke arịrịọ ahụ bụ Chineke. Nsụgharị ekwesịghị idozi ihe odide ahụ hapụrụ nwere ụzọ abụọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Jizọs bụ Mezaya” gosi Χριστός dịka utu aha. E tinyere akara nkọwa ala [a] ozugbo n’ahịrịokwu metụtara ya.
