id: HEB.13.8
reference: Hebrews 13:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰησοῦς Χριστὸς ἐχθὲς καὶ σήμερον ὁ αὐτός, καὶ εἰς τοὺς αἰῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/008.yaml
  text: Jesus the Messiah is the same yesterday and today and forever[a].
translation:
  language: ig
  text: Jizọs Mesaya ahụ bụ otu onye ahụ ụnyaahụ, na taa, na ruo mgbe ebighị ebi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jizọs Kraịst bụ otu onye ahụ ụnyaahụ, na taa, na ruo mgbe ebighị ebi.” A pụrụ ịsụgharị aha ọkwa Grik ahụ bụ Χριστός dịka “Mesaya” ma ọ bụ dee ya dịka “Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Ụdị aha a bụ nke ndị na-asụ Igbo maara nke ọma maka aha Grik Ἰησοῦς.
- source_word: Χριστὸς
  choice: onye bụ Mesaya ahụ
  rationale: A tụgharịrị aha ọkwa Χριστός dị ka “Mesaya” kama idegharị ya nanị dị ka “Kraịst.” Usoro “onye bụ Mesaya ahụ” na-eme ka njikọ aha na ọkwa ahụ daa nke ọma n'Igbo.
- source_word: ἐχθὲς
  choice: ụnyaahụ
  rationale: Nke a bụ ntụgharị kpọmkwem nke okwu oge ahụ, ma na-edobe usoro oge dị n'amaokwu ahụ.
- source_word: σήμερον
  choice: taa
  rationale: Nke a bụ okwu Igbo doro anya maka oge a, nke na-esochi “ụnyaahụ” n'usoro ahụ.
- source_word: ὁ αὐτός
  choice: bụ otu onye ahụ
  rationale: Nkebi a na-egosi na onye ahụ agbanweghị; e tinyere ngwaa “bụ” dịka ụtọasụsụ Igbo si chọọ.
- source_word: εἰς τοὺς αἰῶνας
  choice: ruo mgbe ebighị ebi
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma doo anya isi kwuo ịdịgide mgbe niile, kama ịsụgharị ya n'ụzọ siri ike dịka “ruo n'ọgbọ niile.”
- source_word: καὶ ... καὶ ... καὶ
  choice: na ... na ... na
  rationale: E debere njikọ ndị a iji chekwaa ụda na usoro oge nke Grik.
theological_decisions:
- issue: Ike okwu a nwere banyere adịghị agbanwe agbanwe nke Jizọs
  choice: E kwuru naanị na Jizọs Mesaya bụ otu onye ahụ n'oge niile a kpọrọ aha.
  alternative: Ịgbasa amaokwu ahụ ka o kwuo ozizi zuru ezu banyere ọdịdị Chineke ma ọ bụ adịghị agbanwe agbanwe nke Kraịst.
  rationale: Grik na-ekwusi ike na Jizọs bụ otu onye ahụ n'oge niile, ma ọ naghị akọwa nkwubi okwu nkà mmụta okpukpe niile a pụrụ isi na ya nweta.
- issue: Ịsụgharị Χριστός dịka aha ọkwa ma ọ bụ aha e deregharị edegharị
  choice: Mesaya
  alternative: Kraịst
  rationale: Χριστός bụ aha ọkwa pụtara onye e tere mmanụ; “Mesaya” na-eme ka ọrụ aha ọkwa ahụ pụta ìhè, ebe e debere “Kraịst” dịka nhọrọ n'okpuru ederede.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro oge atọ nke Grik ma ghara ịgbakwunye nkọwa ozizi na-adịghị n'ederede.
