  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: ig
  text: Kpeenụ ekpere maka anyị, n’ihi na anyị kwenyesiri ike[a] na anyị nwere ezi akọ na uche[b], ebe ọ bụ na anyị chọrọ ibi ndụ nke ọma n’ihe niile.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị kwenyere” ma ọ bụ “obi siri anyị ike.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “akọ na uche dị ọcha.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “anyị na-achọ ịkpa àgwà kwesịrị nsọpụrụ n’ihe niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσεύχεσθε
  choice: Na-ekpe ekpere
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ. Usoro a bụ Igbo dị ndụ ma nwee ike igosi omume a na-aga n’ihu n’etinyeghị okwu na-adịghị na Grik.
- source_word: περὶ ἡμῶν
  choice: maka anyị
  rationale: Mgbe a na-ekwu banyere ekpere, περί tinyere genitive pụtara n’ụzọ ebumpụta ụwa ‘maka,’ ọ bụghị naanị ‘banyere.’
- source_word: πειθόμεθα
  choice: anyị kwenyesiri ike
  rationale: Nke a na-egosipụta nkwenye siri ike nke ndị dere akwụkwọ ahụ, ma na-edobe ike nghọta nke πείθω.
- source_word: καλὴν συνείδησιν
  choice: ezi akọ na uche
  rationale: Nke a na-edobe ma adjective καλὴν ma noun συνείδησιν n’ụzọ doro anya, na-enweghị ime ka ‘ezi’ bụrụ naanị ‘dị ọcha.’
- source_word: ἔχομεν
  choice: anyị nwere
  rationale: Ọ bụ nsụgharị kpọmkwem ma dịkwa mma n’Igbo maka present indicative a.
- source_word: ἐν πᾶσιν
  choice: n’ihe niile
  rationale: Ọ na-egosipụta oke echiche ahụ n’ụzọ zuru ezu ma bụrụkwa okwu Igbo nke oge a.
- source_word: καλῶς
  choice: nke ọma
  rationale: Ọ na-edobe obosara nke adverb ahụ; ‘n’ụzọ kwesịrị nsọpụrụ’ ga-akọwa ya n’ụzọ pere mpe karịa ihe Grik kwuru.
- source_word: θέλοντες
  choice: ebe ọ bụ na anyị chọrọ
  rationale: Ọ na-eme ka njikọ participle ahụ na okwu bu ya ụzọ doo anya n’Igbo, ma na-egosipụta ọchịchọ na-aga n’ihu.
- source_word: ἀναστρέφεσθαι
  choice: ibi ndụ
  rationale: N’ebe a, ngwaa ahụ metụtara ụzọ mmadụ si ebi na omume ya. ‘Ibi ndụ’ bụ okwu Igbo ebumpụta ụwa nke na-eburu echiche ahụ n’ozuzu ya.
theological_decisions:
- issue: Njikọ nke clause participle ikpeazụ na nkwupụta banyere ezi akọ na uche
  choice: 'A sụgharịrị ya dị ka nkọwa nwere ihe kpatara ya: ‘ebe ọ bụ na anyị chọrọ ibi ndụ nke ọma n’ihe niile.’'
  alternative: 'A pụrụ ịsụgharị ya n’enweghị ime ka njikọ ahụ pụta ìhè: ‘anyị na-achọ ibi ndụ nke ọma n’ihe niile.’'
  rationale: θέλοντες pụrụ ịnọgide dị ka participle ejikọtara naanị ya, ma Igbo ebumpụta ụwa chọrọ ka njikọ ahụ doo anya. Nsụgharị a na-egosi ihe kpatara ma ọ bụ ụdị nkwupụta ha banyere akọ na uche, n’ekwughị na ha enweghị mmehie.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘akọ na uche’ mee ihe maka συνείδησις, e jikwa ‘ibi ndụ nke ọma’ gosi omume mmadụ n’ozuzu ya n’enweghị itinye nkọwa ụka pụrụ iche.
