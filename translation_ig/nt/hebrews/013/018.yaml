  to: Kpeenụ ekpere maka anyị, n’ihi na anyị kwenyesiri ike[a] na anyị nwere ezi akọ na uche[b], ebe ọ bụ na anyị chọrọ ibi ndụ nke ọma n’ihe niile.[c]
