    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “site n’aka mmadụ niile,” kama “n’etiti mmadụ niile.”
    reason: lexical_alternative
  revision_rationale: 'The revision improves the direct exhortational register and natural Standard Igbo phrasing while maintaining every source-level distinction: marriage is to receive honor, the marital bed is to remain undefiled, and God’s future judgment applies to both sexually immoral people broadly and adulterers specifically. The footnotes continue to preserve the genuine ambiguity of the verbless opening clause and the alternative sense of ἐν πᾶσιν.'
