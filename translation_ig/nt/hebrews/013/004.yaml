id: HEB.13.4
reference: Hebrews 13:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίμιος ὁ γάμος ἐν πᾶσιν καὶ ἡ κοίτη ἀμίαντος, πόρνους ⸀γὰρ καὶ μοιχοὺς κρινεῖ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: ig
  text: Ka a sọpụrụ alụmdi na nwunye n’etiti mmadụ niile[a][b], ka ihe ndina dị n’alụmdi na nwunye ghara imerụ emerụ, n’ihi na Chineke ga-ekpe ndị na-eme omume mmekọahụ rụrụ arụ na ndị na-akwa iko ikpe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Alụmdi na nwunye bụ ihe dị nsọpụrụ n’etiti mmadụ niile.” Grik enweghị ngwaa e dere kpọmkwem n’ahịrịokwu mbụ, ya mere, a pụrụ ịgụ ya dị ka ndụmọdụ ma ọ bụ dị ka nkwupụta.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “site n’aka mmadụ niile,” kama “n’etiti mmadụ niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμιος
  choice: ka a na-asọpụrụ
  rationale: Nke a na-egosi na alụmdi na nwunye kwesịrị ịbụ ihe a na-enye nsọpụrụ na nnukwu uru. Ọ dabara n’usoro ndụmọdụ dị n’amaokwu ndị gbara ya gburugburu, ma ndetu [a] ka na-echekwa nghọta nke okwu nkwupụta.
- source_word: γάμος
  choice: alụmdi na nwunye
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ọnọdụ na njikọ alụmdi na nwunye, ọ bụghị naanị emume agbamakwụkwọ.
- source_word: ἐν πᾶσιν
  choice: n’etiti mmadụ niile
  rationale: Okwu Grik ahụ nwere ike ịpụta ‘n’etiti mmadụ niile’ ma ọ bụ ‘site n’aka mmadụ niile.’ Nsụgharị a na-echekwa echiche gbasara nsọpụrụ alụmdi na nwunye n’etiti mmadụ niile, ebe ndetu [b] na-enye ụzọ ọzọ.
- source_word: κοίτη
  choice: ihe ndina di na nwunye
  rationale: Ọ bụ okwu nkịtị maka ihe ndina, ma n’ebe a ọ na-anọchi anya mmekọahụ dị n’alụmdi na nwunye. Nhọrọ a doro anya ma ka na-eji okwu nkwanye ùgwù.
- source_word: ἀμίαντος
  choice: nke a na-emerụghị emerụ
  rationale: Nke a na-echekwa echiche nke ịdị ọcha na nke enweghị mmetọ omume dị n’okwu Grik ahụ.
- source_word: πόρνους
  choice: ndị na-eme omume mmekọahụ rụrụ arụ
  rationale: Okwu a sara mbara karịa otu ụdị mmehie mmekọahụ; nsụgharị a bụ nke oge a, doo anya, ma ghara ime ka ihe ọ pụtara dị warara.
- source_word: μοιχούς
  choice: ndị na-akwa iko
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị na-emebi nkwa alụmdi na nwunye site n’ịkwa iko, ma ọ na-echekwa ọdịiche ya na ụdị omume mmekọahụ rụrụ arụ ndị ọzọ.
- source_word: κρινεῖ
  choice: ga-ekpe ... ikpe
  rationale: Ọdịdị okwu Grik ahụ na-arụtụ aka n’ikpe Chineke nke ga-abịa. ‘Ga-ekpe ikpe’ anaghị ekwu tupu oge eruo na ihe ikpe ahụ ga-abụ ‘ikpe ọmụma,’ nke okwu Grik n’onwe ya na-akọwaghị kpọmkwem.
- source_word: γάρ
  choice: n’ihi na
  rationale: Nke a na-egosi na ikpe Chineke bụ ihe mere e ji nye ndụmọdụ banyere nsọpụrụ na ịdị ọcha nke alụmdi na nwunye.
theological_decisions:
- issue: Ma ahịrịokwu mbụ ọ bụ ndụmọdụ/ọkpụkpọ òkù ka ọ bụ nkwupụta
  choice: 'Ndụmọdụ: ‘Ka a na-asọpụrụ alụmdi na nwunye...’'
  alternative: 'Nkwupụta: ‘Alụmdi na nwunye bụ ihe a na-asọpụrụ n’etiti mmadụ niile.’'
  rationale: Grik etinyeghị ngwaa doro anya n’ahịrịokwu mbụ, ya mere ụzọ abụọ ahụ kwe omume. Usoro ndụmọdụ omume dị na Hibru 13 na-akwado nghọta ndụmọdụ, ma ndetu [a] na-echekwa nghọta nkwupụta ahụ n’ihi na ejighị Grik dozie mgbagwoju anya ahụ kpamkpam.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ihe ndina di na nwunye’ bụ ụzọ nkwanye ùgwù e si egosi mmekọahụ dị n’alụmdi na nwunye; ‘omume mmekọahụ rụrụ arụ’ na-echekwa obosara nke πόρνους n’enweghị okwu ochie ma ọ bụ nke otu ụka pụrụ iche.
