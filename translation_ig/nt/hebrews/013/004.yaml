review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two coordinated exhortational clauses and retains the future, non-specified sense of God's judgment. Its distinction between the broad category πόρνους and the specific μοιχούς is preserved. A small revision is needed because the habitual form “Ka a na-asọpụrụ” is less direct than the exhortational force selected for the main text, and the expression for κοίτη is somewhat awkward.
  naturalness: “Ka a sọpụrụ” is a more natural and direct Standard Igbo exhortation. “Ihe ndina dị n’alụmdi na nwunye” is clearer and more idiomatic than “ihe ndina di na nwunye,” while “ghara imerụ emerụ” naturally expresses the required moral state without adding to the Greek.
  terminology: “Alụmdi na nwunye,” “ndị na-eme omume mmekọahụ rụrụ arụ,” “ndị na-akwa iko,” and “ga-ekpe ... ikpe” are appropriate, clear Standard Igbo renderings. The alternate reading footnote should preserve the lexical alternative “site n’aka mmadụ niile” rather than recast the whole clause as a separate exhortation.
  issues:
  - severity: medium
    issue: The main verb “Ka a na-asọpụrụ” has a habitual/progressive coloring.
    rationale: The chosen English audit reading is exhortational. “Ka a sọpụrụ” more directly renders the intended hortatory force while still allowing the footnote to preserve the verbless Greek clause’s indicative possibility.
  - severity: low
    issue: “ihe ndina di na nwunye” is syntactically less natural and can be read as the bed of married persons rather than the marital bed.
    rationale: “ihe ndina dị n’alụmdi na nwunye” clearly identifies the marital-sexual reference of κοίτη in idiomatic Standard Igbo.
  - severity: low
    issue: Footnote b changes the clause into an imperative rather than simply presenting the alternative sense of ἐν πᾶσιν.
    rationale: “site n’aka mmadụ niile” directly supplies the viable alternative to “n’etiti mmadụ niile” and preserves the source ambiguity.
  revised_text: Ka a sọpụrụ alụmdi na nwunye n’etiti mmadụ niile[a][b], ka ihe ndina dị n’alụmdi na nwunye ghara imerụ emerụ, n’ihi na Chineke ga-ekpe ndị na-eme omume mmekọahụ rụrụ arụ na ndị na-akwa iko ikpe.
  revised_footnotes:
