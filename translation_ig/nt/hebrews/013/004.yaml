revisions:
- from: Ka a na-asọpụrụ alụmdi na nwunye n’etiti mmadụ niile[a][b], ka ihe ndina di na nwunye bụrụkwa nke a na-emerụghị emerụ, n’ihi na Chineke ga-ekpe ndị na-eme omume mmekọahụ rụrụ arụ na ndị na-akwa iko ikpe.
  to: Ka a sọpụrụ alụmdi na nwunye n’etiti mmadụ niile[a][b], ka ihe ndina dị n’alụmdi na nwunye ghara imerụ emerụ, n’ihi na Chineke ga-ekpe ndị na-eme omume mmekọahụ rụrụ arụ na ndị na-akwa iko ikpe.
  rationale: 'The revision improves the direct exhortational register and natural Standard Igbo phrasing while maintaining every source-level distinction: marriage is to receive honor, the marital bed is to remain undefiled, and God’s future judgment applies to both sexually immoral people broadly and adulterers specifically. The footnotes continue to preserve the genuine ambiguity of the verbless opening clause and the alternative sense of ἐν πᾶσιν.'
