id: HEB.13.6
reference: Hebrews 13:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε θαρροῦντας ἡμᾶς λέγειν· Κύριος ἐμοὶ βοηθός, ⸀οὐ φοβηθήσομαι· τί ποιήσει μοι ἄνθρωπος;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/006.yaml
  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: ig
  text: nke mere na anyị ji obi ike na-ekwu, “Onyenwe anyị bụ onye na-enyere m aka; egwu agaghị atụ m. Gịnị ka mmadụ[b] pụrụ ime m?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-esochi ọdịdị okwu Grik kpọmkwem karị, “Gịnị ka mmadụ ga-eme m?”
    reason: lexical_alternative
  - marker: b
    text: “Mmadụ” n’ebe a sụgharịrị okwu Grik ἄνθρωπος, nke dị n’otu ma na-anọchite mmadụ ọ bụla, ma nwoke ma nwaanyị.
    reason: cultural_note
lexical_decisions:
- source_word: ὥστε
  choice: nke mere na
  rationale: Na-egosi ihe si n’okwu bu ya ụzọ pụta, ma na-asụkwa ya n’Igbo nkịtị.
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: anyị ji obi ike na-ekwu
  rationale: Na-edebe echiche nke ikwu okwu n’atụghị egwu na n’enweghị mgbagha, n’enweghị ịtụgharị ya ka ọ bụrụ iwu.
- source_word: Κύριος
  choice: Onyenwe anyị
  rationale: Aha nsọ a bụ ụzọ Igbo a na-aghọta nke ọma si akọwa κύριος mgbe ọ na-ezo aka n’ebe Chineke nọ.
- source_word: ἐμοὶ βοηθός
  choice: onye na-enyere m aka
  rationale: Na-egosipụta βοηθός dị ka onye n’onwe ya na-abịa nyere mmadụ aka; ọ bụkwa okwu Igbo dị mfe ma doo anya.
- source_word: οὐ φοβηθήσομαι
  choice: egwu agaghị atụ m
  rationale: Ọ bụ ụzọ Igbo dị ndụ na nke nkịtị isi kwuo na mmadụ agaghị atụ egwu, ma na-edebe ọdịdị ọdịnihu nke ngwaa Grik.
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: Gịnị ka mmadụ pụrụ ime m?
  rationale: Ajụjụ a bụ nke na-egosi na ike mmadụ nwere ime onye na-ekwu okwu ihe erughị eru; “pụrụ” na-ebute ike ajụjụ ahụ nke ọma n’Igbo, ebe nkọwa ala peeji na-edebe ọdịnihu nkịtị nke ποιήσει.
theological_decisions:
- issue: Ihe ἄνθρωπος nke otu onye na-anọchite mmadụ niile pụtara
  choice: mmadụ
  alternative: onye ọ bụla
  rationale: “Mmadụ” nwere ike ịpụta nwoke ma ọ bụ nwaanyị n’Igbo, ma na-edebekwa otu aha nke Grik n’enweghị ime ka ọ bụrụ naanị nwoke.
- issue: Ike ajụjụ ọdịnihu ποιήσει nwere
  choice: Gịnị ka mmadụ pụrụ ime m?
  alternative: Gịnị ka mmadụ ga-eme m?
  rationale: “Pụrụ” na-eme ka ebumnuche ajụjụ nkwupụta ahụ doo anya—ike mmadụ enweghị ike imeri enyemaka Onyenwe anyị—ebe a na-edebe ntụgharị nke na-esochi ọdịdị ọdịnihu ahụ kpọmkwem na nkọwa ala peeji.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “egwu agaghị atụ m” na “onye na-enyere m aka” mee ka okwu ahụ bụrụ nke ndị nkịtị na-asụ n’enweghị iwepụ ịdị arọ nke nkwupụta ahụ.
