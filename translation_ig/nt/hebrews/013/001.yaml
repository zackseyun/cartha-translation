  text: Ἡ φιλαδελφία μενέτω.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/001.yaml
  text: Let brotherly love continue[a].
translation:
  language: ig
  text: Ka ịhụnanya dị n’etiti ụmụnna nọgide[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịhụnanya n’ebe ndị kwere ekwe ibe unu nọ.” Okwu Grik a na-ekwu maka ịhụnanya ezinụlọ n’etiti ndị kwere ekwe, ọ bụghị naanị ịhụnanya n’etiti ndị nwoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλαδελφία
  choice: ịhụnanya dị n’etiti ụmụnna
  rationale: Okwu Grik a na-egosi ịhụnanya ezinụlọ dị n’etiti ụmụnne; n’ebe a, ọ bụ ịhụnanya ndị kwere ekwe na-enwe n’ebe ibe ha nọ. Nhọrọ a chekwara ihe atụ ezinụlọ nke okwu ahụ ma bụrụkwa Igbo doro anya.
- source_word: μενέτω
  choice: ka ... nọgide
  rationale: Ngwaa iwu dị n’oge ugbu a na-akpọ ka ọnọdụ ahụ gaa n’ihu; “ka ... nọgide” na-egosipụta ma iwu ahụ ma ịdịgide ya.
- source_word: Ἡ
  choice: egosipụtaghị ya dị ka okwu kwụụrụ onwe ya
  rationale: Mkpọaha njirimara Grik na-eme ka àgwà a bụrụ nke ndị na-agụ akwụkwọ maara; usoro okwu Igbo achọghị ka a sụgharịa ya iche n’ahịrịokwu a.
theological_decisions:
- issue: Oke φιλαδελφία na asụsụ ezinụlọ
  choice: ịhụnanya dị n’etiti ụmụnna
  alternative: ịhụnanya n’ebe ndị kwere ekwe ibe unu nọ
  rationale: “Ụmụnna” na-echekwa ihe atụ ezinụlọ dị n’Grik, ma n’Igbo ọ pụkwara ịgụnye ndị nwoke na ndị nwanyị nọ n’otu obodo okwukwe. Ihe e dere n’ala peeji na-eme ka nke a doo anya n’enweghị iwepụ ihe atụ ahụ n’isiokwu.
translation_notes:
  register: Standard Igbo dị mfe, ugwu dị na ya, ma bụrụ nke ndị nkịtị taa ga-aghọta. E ji “ụmụnna” chekwaa okwu ezinụlọ nke Grik, ebe nkọwa ala peeji na-egbochi nghọta na ọ na-ekwu naanị maka ụmụ nwoke.
