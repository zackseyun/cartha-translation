id: HEB.13.13
reference: Hebrews 13:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς, τὸν ὀνειδισμὸν αὐτοῦ φέροντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: ig
  text: Ya mere, ka anyị pụọ gakwuru ya n’èzí ogige ahụ[a], na-ebu nkọcha ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’èzí ebe a mara ụlọikwuu.” Okwu a na-akpalite ihe oyiyi àjà dị na Levitikọs 16 na nkọcha Jizọs buru n’èzí obodo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοίνυν
  choice: Ya mere
  rationale: Ọ bụ okwu na-egosi nkwubi okwu sitere n’ihe e kwuru na Hibru 13:11–12; “Ya mere” na-egosipụta njikọ echiche ahụ nke ọma n’Igbo.
- source_word: ἐξερχώμεθα
  choice: ka anyị pụkwuru
  rationale: Ụdị ngwaa a bụ agbamume nke onye na-ekwu tinyere onwe ya na ndị ọ na-agwa. “Ka anyị pụkwuru” na-ejikọta echiche nke ịpụ na nke ịgakwuru onye ahụ n’Igbo dị mfe.
- source_word: πρὸς αὐτόν
  choice: ya
  rationale: N’ime “pụkwuru ya,” “ya” na-egosi ije gakwuru onye ahụ, ma na-edobe nnọchiaha dị n’asụsụ Grik kama itinye aha Jizọs n’amaokwu ahụ.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: n’èzí ogige ahụ
  rationale: “Ogige” na-edobe ihe atụ nke ebe ndị mmadụ mara ụlọikwuu, nke jikọrọ amaokwu a na ihe gbasara àjà e kwuru n’amaokwu ndị bu ya ụzọ; a zere ịkọwa ya dịka òtù okpukpe ma ọ bụ obodo.
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: nkọcha ya
  rationale: “Nkọcha” na-egosi okwu nlelị na ihere ọha mmadụ tinyere n’ahụ onye ahụ. Nrụpụta “nkọcha ya” na-edobe njikọ nke nnọchiaha Grik n’enweghị ịgbasa nkọwa ya karịa ihe ederede kwuru.
- source_word: φέροντες
  choice: na-ebu
  rationale: Okwu a na-egosi omume na-aga n’ihu nke iso buru nkọcha ahụ. “Na-ebu” na-edobe ihe oyiyi nke ibu ibu karịa “na-atachi obi,” nke ga-abụ nkọwa agbakwunyere.
theological_decisions:
- issue: Onye “ya” na-ezo aka na ya
  choice: E debere nnọchiaha “ya”; n’ọnọdụ okwu ahụ ọ na-ezo aka na Jizọs nke Hibru 13:12 kwuru maka ya.
  alternative: Ịsị “Jizọs” kpọmkwem n’amaokwu a.
  rationale: Asụsụ Grik ji nnọchiaha mee ihe, ebe amaokwu bu ụzọ mere onye ọ na-ezo aka na ya ka o doo anya. Idebe nnọchiaha ahụ na-asọpụrụ usoro ederede ahụ.
- issue: Ihe “n’èzí ogige ahụ” pụtara
  choice: E debere ogige ahụ dịka ihe oyiyi metụtara àjà na ịbụ onye a jụrụ ajụ.
  alternative: Ịkọwa ya dịka “n’èzí òtù okpukpe” ma ọ bụ “n’èzí obodo.”
  rationale: Nkọwa ndị ọzọ nwere ike ịbụ akụkụ nke ihe onye na-agụ ga-aghọta, ma ha ga-eme ka ihe oyiyi sitere n’usoro àjà na Levitikọs na esemokwu dị n’amaokwu ahụ laa n’iyi.
- issue: Njikọ dị na “nkọcha ya”
  choice: E debere ụdị mkpirikpi “nkọcha ya,” nke na-enye ndị kwere ekwe òkè na nkọcha metụtara ya.
  alternative: “Nkọcha e ji kọchaa ya.”
  rationale: Nhọrọ ọzọ na-akọwapụta onye natara nkọcha ahụ nke ọma, ma ọ na-eme ka njikọ genitivu Grik doo anya karịa ka ederede n’onwe ya mere. “Nkọcha ya” na-edobe njikọ na esemokwu ahụ.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. “Pụkwuru ya” bụ usoro dị nkenke na nke eke nke jikọtara ἐξερχώμεθα na πρὸς αὐτόν; e debere “ogige” na “nkọcha” iji ghara ime ka ihe oyiyi na esemokwu nkà mmụta okpukpe dị n’asụsụ Grik bụrụ naanị nkọwa.
