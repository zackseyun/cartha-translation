review_pass:
  verdict: revise
  source_fidelity: The draft preserves the inferential force, the hortatory plural, movement toward the antecedent, the spatial image, and the participial sense of bearing reproach. However, “pụkwuru ya” compresses two distinct Greek elements (go out; to him) in a way that is less idiomatic and less explicit than needed in Standard Igbo.
  naturalness: “Ka anyị pụọ gakwuru ya” is clearer, natural modern Standard Igbo, and directly expresses both departure and movement toward him. “N’èzí ogige ahụ” and “na-ebu nkọcha ya” are acceptable in a dignified biblical register.
  terminology: “Ogige” suitably retains the camp image, while “nkọcha” is a viable rendering of ὀνειδισμός in this register. The footnote should not reduce the allusion to Jesus merely suffering outside the city; the context concerns his rejection/reproach.
  issues:
  - severity: medium
    issue: “Pụkwuru ya” is not the clearest rendering of ἐξερχώμεθα πρὸς αὐτόν.
    rationale: The Greek separately expresses going out and going to him. “Pụọ gakwuru ya” is more natural and preserves both components without interpretive expansion.
  - severity: low
    issue: The footnote says only that Jesus suffered outside the city.
    rationale: The English audit trail specifies the rejection/reproach borne by Jesus. Mentioning this better reflects the immediate context and avoids weakening the stated allusion.
  revised_text: Ya mere, ka anyị pụọ gakwuru ya n’èzí ogige ahụ[a], na-ebu nkọcha ya.
