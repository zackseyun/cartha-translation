id: HEB.13.10
reference: Hebrews 13:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔχομεν θυσιαστήριον ἐξ οὗ φαγεῖν οὐκ ἔχουσιν ἐξουσίαν οἱ τῇ σκηνῇ λατρεύοντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/010.yaml
  text: We have an altar from which those who serve at the tabernacle have no right to eat[a][b].
translation:
  language: ig
  text: anyị nwere ebe ịchụ aja[b] nke ndị na-eje ozi n’ụlọikwuu ahụ[a] enweghị ikike iri ihe sitere na ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kapịrị ọnụ karị, “ndị na-arụ ọrụ nsọ n’ụlọikwuu ahụ.” Okwu a na-ezo aka ná ndị na-eje ozi n’ebe nsọ nke ọgbụgba ndụ ochie.
    reason: lexical_alternative
  - marker: b
    text: 'A na-akọwa “ebe ịchụ aja” a n’ụzọ dị iche iche: dịka Kraịst n’onwe ya, obe, ebe ịchụ aja nke eluigwe, ma ọ bụ uru ndị sitere n’àjà Kraịst. Grik ahụ akọwaghị kpọmkwem ihe oyiyi a na-ezo aka na ya n’ebe a.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχομεν
  choice: Anyị nwere
  rationale: Nke a na-edobe ngwaa oge ugbu a na nnọchiaha nke gụnyere onye ode akwụkwọ na ndị ọ na-edegara.
- source_word: θυσιαστήριον
  choice: ebe ịchụ aja
  rationale: Nke a bụ okwu Igbo doro anya maka altar; ọ na-edobe oyiyi ebe ịchụ aja n'ebughị ụzọ kọwaa ya dịka Kraịst, obe, ma ọ bụ àjà n'onwe ya.
- source_word: ἐξ οὗ
  choice: sitere na ya
  rationale: Ọ na-egosi isi ebe ihe a na-eri si pụta ma na-edobe njikọ ya na ebe ịchụ aja.
- source_word: φαγεῖν
  choice: iri ihe
  rationale: Ọ bụ ntụgharị nkịtị ma doo anya nke infinitive pụtara 'iri.'
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: na-enweghị ikike
  rationale: N'ebe a ἐξουσία na-ekwu maka ikike ma ọ bụ ohere e nyere mmadụ; okwu a na-egosi na e nyeghị ha ikike isonye n'iri ihe ahụ.
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: ndị na-eje ozi n'ụlọikwuu ahụ
  rationale: λατρεύω n'ọnọdụ a bụ ije ozi nsọ, ọ bụghị naanị ife ofufe n'ozuzu; ụlọikwuu ahụ na-ezo aka n'ebe nsọ nke ọgbụgba ndụ ochie.
theological_decisions:
- issue: Ihe 'ebe ịchụ aja' na-ezo aka na ya na Ndị Hibru 13:10
  choice: Edobere okwu ahụ dịka 'ebe ịchụ aja' n'akwụkwọ bụ isi n'akọwaghị kpọmkwem ihe ọ na-anọchi anya ya.
  alternative: A pụrụ ịghọta ya dịka Kraịst n'onwe ya, obe, ebe ịchụ aja nke eluigwe, ma ọ bụ uru ndị sitere n'àjà Kraịst.
  rationale: Grik ahụ hapụrụ oyiyi ahụ n'enweghị nkọwa kpọmkwem. Ịhapụ ya otú ahụ na-echekwa nghọta dị iche iche na esemokwu nkà mmụta okpukpe dị n'amaokwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke nwere nsọpụrụ ma dị mfe nghọta. “Ebe ịchụ aja” bụ okwu nkịtị ma doro anya; “ije ozi” na-egosi ọrụ nsọ nke ndị nchụàjà n'emeghị ka ọ bụrụ naanị ofufe n'ozuzu.
