  yaml_path: translation/nt/hebrews/013/025.yaml
  text: Grace be with all of you.
translation:
  language: ig
  text: Ka amara dịnyere unu niile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ χάρις
  choice: amara
  rationale: N’ebe a, χάρις bụ okwu ngọzi a na-ejikarị mechie akwụkwọ ozi. “Amara” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ihuọma Chineke n’ụdị okwu a.
- source_word: μετὰ
  choice: Ka ... dịnyere
  rationale: μετά na genitive pụtara “nọnyere/anyị na.” Ebe ahịrị Grik a hapụrụ ngwaa n’ihi usoro ngọzi, “Ka ... dịnyere” na-egosipụta echiche ọchịchọ ahụ n’Igbo eke n’etinyeghị nkwupụta ozizi ọzọ.
- source_word: πάντων ὑμῶν
  choice: unu niile
  rationale: πάντων ὑμῶν na-agụnye ndị niile a na-edegara akwụkwọ ozi ahụ. “Unu niile” na-echekwa ma ọtụtụ mmadụ nke ὑμῶν ma mkpokọta zuru ezu nke πάντων.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mkpirikpi ma dị ùgwù dịka ngọzi mmechi akwụkwọ ozi. A họọrọ “dịnyere” kama nkewa “dịrị ... na” iji mee ka okwu ahụ bụrụ nke eke ma ghara ịgbanwe ọdịnaya.
