id: HEB.13.20
reference: Hebrews 13:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ δὲ θεὸς τῆς εἰρήνης, ὁ ἀναγαγὼν ἐκ νεκρῶν τὸν ποιμένα τῶν προβάτων τὸν μέγαν ἐν αἵματι διαθήκης αἰωνίου, τὸν κύριον ἡμῶν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/020.yaml
  text: May the God of peace[a], who brought up from the dead our Lord Jesus, the great shepherd of the sheep, by the blood of an eternal covenant,
translation:
  language: ig
  text: Ka Chineke nke udo, onye mere ka Onyenwe anyị Jizọs, nnukwu onye nche atụrụ, si nʼọnwụ bilie site nʼọbara ọgbụgba ndụ ebighị ebi,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịghọta ya dịka: “onye mere ka Onyenwe anyị Jizọs si nʼọnwụ bilie—nnukwu onye nche atụrụ site nʼọbara ọgbụgba ndụ ebighị ebi.” Usoro okwu Grik na-enye ohere ijikọ “site nʼọbara ọgbụgba ndụ ebighị ebi” nʼụzọ dịtụ iche.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ δὲ
  choice: Ka
  rationale: Nʼusoro ngọzi na ekpere a, δέ na-egosi ntụgharị gaa nʼarịrịọ, ebe ụdị ngwaa nke arịrịọ dị nʼamaokwu na-esonụ na-achịkwa ahịrịokwu a. “Ka” na-eme ka mmalite arịrịọ ahụ doo anya nʼIgbo nʼetinyeghị echiche oge nke okwu dịka “ugbu a.”
- source_word: θεὸς τῆς εἰρήνης
  choice: Chineke nke udo
  rationale: Nke a na-edobe njikọ genitive Grik ma na-ada ka Igbo nkịtị, na-egosi Chineke onye e ji udo mara ma ọ bụ onye na-enye udo.
- source_word: ὁ ἀναγαγὼν ἐκ νεκρῶν
  choice: onye mere ka ... si nʼọnwụ bilie
  rationale: Nʼọnọdụ mbilite nʼọnwụ, nkebiokwu a na-ekwu na Chineke mere ka Jizọs bilie site nʼọnwụ. Nsụgharị a bụ Igbo doro anya ma na-edobe Chineke dịka onye mere ihe ahụ.
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: nnukwu Onye Ọzụzụ atụrụ
  rationale: Nke a na-edobe ihe atụ onye ọzụzụ na atụrụ nakwa ịdị ukwuu ya. E ji mkpụrụedemede ukwu dee aha ọrụ ahụ nʼihi na ọ na-akọwa Jizọs nʼụzọ pụrụ iche nʼahịrịokwu a.
- source_word: ἐν αἵματι
  choice: site nʼọbara
  rationale: “Site nʼọbara” na-enye nghọta nke ụzọ ma ọ bụ ihe ndabere, nke ἐν nwere ike inwe ebe a, ma ọ naghị akọwakwu otú njikọ ahụ si arụ ọrụ nʼụzọ ozizi.
- source_word: διαθήκης αἰωνίου
  choice: ọgbụgba ndụ ebighị ebi
  rationale: “Ọgbụgba ndụ” bụ okwu kwesịrị ekwesị maka διαθήκη nʼarụmụka akwụkwọ Ndị Hibru; “ebighị ebi” na-egosipụta αἰωνίου nʼụzọ nkịtị.
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: Onyenwe anyị Jizọs
  rationale: Nke a bụ usoro okwu Igbo doro anya nke na-edobe κύριος dịka “Onyenwe” na ἡμῶν dịka “anyị.”
theological_decisions:
- issue: Njikọ ἐν αἵματι διαθήκης αἰωνίου na akụkụ ndị ọzọ nke ahịrịokwu ahụ
  choice: 'E jikọtara ya na ihe Chineke mere mgbe o mere ka Jizọs bilie: “site nʼọbara ọgbụgba ndụ ebighị ebi.”'
  alternative: 'A pụrụ ijikọ ya karịsịa na nkọwa Jizọs dịka nnukwu Onye Ọzụzụ atụrụ: “nnukwu Onye Ọzụzụ atụrụ site nʼọbara ọgbụgba ndụ ebighị ebi.”'
  rationale: Ọnọdụ nkebiokwu ahụ nʼasụsụ Grik na-enye ohere maka njikọ abụọ ahụ. Isi nsụgharị na-ahọrọ nghọta nke ụzọ e si mee ka o bilie, ma ihe odide ala peeji na-echekwa nghọta ọzọ kama idozi esemokwu ahụ kpamkpam.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ya. Ahịrịokwu ahụ bụ mmalite ngọzi na ekpere nke gara nʼihu nʼamaokwu 21, ya mere e ji “Ka” malite ya ma hapụ rikoma nʼọgwụgwụ dịka isi mmalite ahụ si bụrụ ahịrịokwu na-aga nʼihu.
