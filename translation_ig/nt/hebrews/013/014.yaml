id: HEB.13.14
reference: Hebrews 13:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν, ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: ig
  text: N’ihi na anyị enweghị obodo na-adịgide adịgide n’ebe a; kama, anyị na-achọ obodo ahụ nke na-abịa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “obodo na-abịa” ma ọ bụ “obodo nke ga-abịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: N’ihi na ... enweghị
  rationale: “N’ihi na” na-ejikọta amaokwu a dịka nkọwa ma ọ bụ ihe kpatara okwu bu ya ụzọ; “enweghị” na-egosipụta ngọnarị οὐ n’ụzọ Igbo nkịtị.
- source_word: ἔχομεν
  choice: anyị nwere / anyị enweghị
  rationale: Ngwaa ahụ pụtara ‘anyị nwere’; mgbe οὐ so ya, ụzọ Igbo kacha eke bụ ‘anyị enweghị.’
- source_word: ὧδε
  choice: n’ebe a
  rationale: Nke a na-edobe ihe ngosi ebe nke ὧδε n’enweghị ịkọwa ya karịa ihe odide ahụ dịka ‘n’ụwa.’
- source_word: μένουσαν
  choice: na-adịgide adịgide
  rationale: Ọ na-akọwa obodo nke na-anọgide ma ọ bụ na-adịgide; okwu a doro anya ma bụrụ Igbo dị ugbu a.
- source_word: πόλιν
  choice: obodo
  rationale: “Obodo” bụ okwu Igbo kwesịrị ekwesị maka πόλις n’ebe a, ma na-edobe ihe oyiyi nke obodo kama iji nkọwa dịka ‘eluigwe.’
- source_word: ἀλλὰ
  choice: kama
  rationale: “Kama” na-egosipụta ọdịiche siri ike n’etiti obodo na-adịghị adịgide ebe a na obodo nke na-abịa.
- source_word: τὴν μέλλουσαν
  choice: obodo ahụ nke na-abịa
  rationale: E kwughachiri ‘obodo’ iji mee ka ntụaka nke participle nwanyị ahụ doo anya n’Igbo; “nke na-abịa” na-edobe echiche ọdịnihu nke μέλλω.
- source_word: ἐπιζητοῦμεν
  choice: anyị na-achọ
  rationale: Nke a bụ ntụgharị Igbo eke nke ‘anyị na-achọ’; ọ na-ahapụ ike nke ịchọsi ike ka ọnọdụ okwu ahụ gosi ya n’enweghị itinye adverb na-adịghị n’akwụkwọ.
theological_decisions:
- issue: Ihe oyiyi ‘obodo’ pụtara
  choice: Idobe ‘obodo’ dịka ihe odide ahụ siri kwuo, n’akọwaghị ya dịka ‘eluigwe’ ma ọ bụ ‘Jerusalem nke eluigwe.’
  alternative: “eluigwe,” “obodo nke eluigwe,” ma ọ bụ “Jerusalem nke eluigwe”
  rationale: Amaokwu a n’onwe ya na-ekwu maka obodo na-adịghị adịgide ebe a na obodo nke na-abịa. Ọ bụ ezie na Ndị Hibru na-akọwakwuru obodo eluigwe n’ebe ndị ọzọ, ịkpọ ya aha kpọmkwem ebe a ga-agafe okwu Grik ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘obodo’ debe ihe oyiyi mbụ ahụ; e zere nkọwa okpukpe agbakwunyere. Akara nkọwa ala ala [a] dị n’isiokwu.
