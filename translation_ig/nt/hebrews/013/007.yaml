id: HEB.13.7
reference: Hebrews 13:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: ig
  text: Na-echetanụ ndị ndu unu, ndị gwara unu okwu Chineke. Ka unu na-atụgharị uche n’ihe si n’ụzọ ndụ ha pụta[b], ṅomienụ okwukwe ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikwesị ntụkwasị obi ha.” Okwu Grik ahụ nwere ike ịpụta ma okwukwe ma ikwesị ntụkwasị obi; ahịrị bụ isi gbasoro ntụgharị a na-ejikarị eme ihe n’ọrụ a, “okwukwe.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị “ihe si n’ụzọ ndụ ha pụta” dịka “njedebe”; n’ụfọdụ nkọwa, ọ na-ezo kpọmkwem n’ụzọ ha si nwụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: Na-echetanụ
  rationale: Ụdị a na-egosi iwu ka ha nọgide na-echeta, kwekọrọ n’iwu nke oge ugbu a dị n’asụsụ Grik, ma bụrụkwa Igbo doro anya.
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: ndị ndu unu
  rationale: Ọ na-ezo aka n’aka ndị a ma ama na-edu ọgbakọ; “ndị ndu” na-egosi ikike ha n’enweghị echiche ọchịchị aka ike nke okwu dịka “ndị ọchịchị” pụrụ iweta.
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: ndị gwara unu okwu Chineke
  rationale: “Gwara” na-enye λαλέω n’ụzọ nkịtị, ebe “okwu Chineke” na-edobe njikọ okwu Grik na akpaokwu Akwụkwọ Nsọ a maara.
- source_word: ἀναθεωροῦντες
  choice: Mgbe unu na-atụgharị uche
  rationale: Nke a na-egosi ileba anya nke ọma na ịtụgharị uche, ọ bụghị naanị ịhụ ihe n’elu.
- source_word: τὴν ἔκβασιν
  choice: ihe … pụta
  rationale: Akpaokwu a na-eburu echiche nke nsonaazụ ma ọ bụ njedebe n’ebughị ụzọ kpebie na ọ na-ekwu kpọmkwem banyere ọnwụ ha.
- source_word: τῆς ἀναστροφῆς
  choice: n’ụzọ ndụ ha
  rationale: “Ụzọ ndụ” gụnyere omume na otu ha si ebi ndụ, nke kwekọrọ n’obosara ihe ἀναστροφή pụtara.
- source_word: μιμεῖσθε
  choice: ṅomienụ
  rationale: Ọ bụ iwu kpọmkwem nye ọtụtụ mmadụ ka ha gbasoo ihe atụ ndị ndu ahụ.
- source_word: τὴν πίστιν
  choice: okwukwe ha
  rationale: “Okwukwe” bụ ntụgharị bụ isi nke πίστις ebe a, ma nkọwa ala peeji na-edobe ohere nke ihe ọ pụtara dịka ikwesị ntụkwasị obi.
theological_decisions:
- issue: Ihe πίστις pụtara mgbe a na-ekwu maka àgwà mmadụ ndị ọzọ kwesịrị iṅomi
  choice: okwukwe ha
  alternative: ikwesị ntụkwasị obi ha
  rationale: πίστις nwere ike ịpụta okwukwe ma ọ bụ ikwesị ntụkwasị obi n’ebe a. E debere “okwukwe” n’ahịrị bụ isi, ebe nkọwa ala peeji na-echekwa nghọta nke ọzọ kama idozi esemokwu ahụ n’enweghị ihe akaebe zuru ezu.
- issue: Ma ἔκβασις ọ na-ezo kpọmkwem n’ọnwụ ma ọ bụ ọnwụ n’ihi okwukwe nke ndị ndu ahụ
  choice: ihe si n’ụzọ ndụ ha pụta
  alternative: njedebe ndụ ha; ụzọ ha si nwụọ
  rationale: Okwu Grik ahụ nwere ike ịpụta nsonaazụ ma ọ bụ njedebe. Nhọrọ bụ isi na-edobe obosara a ma ghara itinye ọnwụ ma ọ bụ ọnwụ n’ihi okwukwe n’amaokwu ahụ mgbe a kpọghị ya aha hoo haa.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Na-echetanụ” na-egosi ncheta na-aga n’ihu; “ihe si n’ụzọ ndụ ha pụta” na-ada n’ụzọ ebumpụta ụwa ma na-edobe nghọtahie ziri ezi nke ἔκβασις.
