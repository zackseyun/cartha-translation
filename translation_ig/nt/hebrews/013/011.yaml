    rationale: ‘Ebe ịchụ àjà’ na-atụ aka n’ebe àjà/altar, ebe τὰ ἅγια na-ekwu maka mpaghara nsọ ma ọ bụ ụlọ nsọ. Nhọrọ ahụ nwere ike ịgbanwe ebe e bu ọbara banye.
