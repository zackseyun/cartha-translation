  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὧν γὰρ εἰσφέρεται ζῴων τὸ αἷμα περὶ ἁμαρτίας εἰς τὰ ἅγια διὰ τοῦ ἀρχιερέως, τούτων τὰ σώματα κατακαίεται ἔξω τῆς παρεμβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/011.yaml
  text: For the bodies of those animals whose blood is brought into the holy places for sin by the high priest are burned outside the camp[a][b].
translation:
  language: ig
  text: N’ihi na a na-esure ahụ anụmanụ ndị nnukwu onye nchụàjà na-ebubata ọbara ha n’ime ebe nsọ[a] maka mmehie ọkụ[b] n’èzí ogige ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ime ụlọ nsọ.” N’asụsụ Grik, okwu ya bụ “n’ime ebe nsọ,” bụ́ okwu metụtara mpaghara nsọ nke ebe ofufe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “a na-esure ha ọkụ kpamkpam.” Ngwaa Grik ahụ pụrụ imesi ike na ọkụ na-erepịa ha niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ... ζῴων / τούτων τὰ σώματα
  choice: ozu anụmanụ ndị ahụ ... anụmanụ ndị ... ọbara ha
  rationale: Nhazi a na-eme ka njikọ dị n’etiti anụmanụ, ọbara ha, na ozu ha doo anya n’Igbo, ma na-echekwa usoro njikọ nke okwu Grik.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye nkọwa ma ọ bụ ihe ndabere maka okwu bu ya ụzọ.
- source_word: εἰσφέρεται
  choice: na-ebubata
  rationale: Ọ na-egosi ibuga ọbara ahụ banye n’ebe nsọ; iji onye nchụàjà mee isiokwu bụ ụzọ Igbo si kwuo ọrụ ahụ n'ụzọ doro anya ma dị mfe.
- source_word: τὸ αἷμα
  choice: ọbara
  rationale: Nke a bụ ọbara anụmanụ e ji achụ àjà; ntụgharị nkịtị bụ nke ziri ezi.
- source_word: περὶ ἁμαρτίας
  choice: maka mmehie
  rationale: Ọ na-echekwa obosara okwu Grik n’ọnọdụ àjà n’etinyeghị nkọwa pụrụ iche dịka ‘àjà mmehie.’
- source_word: εἰς τὰ ἅγια
  choice: n’ime ebe nsọ
  rationale: Ọ na-egosi mpaghara nsọ nke ebe a na-achụ àjà ma ghara ime ka ọ bụrụ naanị Ebe Kachasị Nsọ.
- source_word: διὰ τοῦ ἀρχιερέως
  choice: nnukwu onye nchụàjà na-ebubata
  rationale: Ọ na-egosi na nnukwu onye nchụàjà bụ onye na-arụ ọrụ ibubata ọbara ahụ.
- source_word: κατακαίεται
  choice: a na-akpọ ... ọkụ
  rationale: Nke a bụ okwu Igbo doro anya maka isure ozu ndị ahụ ọkụ; ike okwu Grik nke nwere ike ịpụta isuchapụ kpamkpam dị na nkọwa ala peeji.
- source_word: ἔξω τῆς παρεμβολῆς
  choice: n’èzí ogige ahụ
  rationale: Ọ dabara n’onyonyo ogige Izrel na usoro ofufe nke amaokwu a na-atụ aka na ya.
theological_decisions:
- issue: Ihe εἰς τὰ ἅγια na-ezo aka na ya
  choice: n’ime ebe nsọ
  alternative: n’ime ebe ịchụ àjà; n’ime Ebe Kachasị Nsọ
  rationale: Okwu Grik nwere ike ịpụta mpaghara nsọ nke ebe ofufe n’obosara. Ọ naghị amanye ka a kọwaa ya ebe a dịka naanị Ebe Kachasị Nsọ, ya mere ntụgharị ahụ na-echekwa obosara ya.
- issue: Ihe περὶ ἁμαρτίας pụtara n’usoro àjà
  choice: maka mmehie
  alternative: dịka àjà mmehie
  rationale: ‘Maka mmehie’ na-echekwa njikọ àjà ahụ na mmehie n’enweghị ime ka ahịrịokwu ahụ kwuo kpọmkwem ihe karịrị okwu Grik.
translation_notes:
  register: E ji Igbo ọkọlọtọ dị ugbu a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. A họọrọ ‘nnukwu onye nchụàjà,’ ‘ebe nsọ,’ na ‘ogige’ iji chekwaa ọnọdụ ofufe na onyonyo ogige Izrel. A gbanwere passive nke ibubata ọbara ka ọ bụrụ ahịrịokwu active dabara n’Igbo, mana e chekwara onye na-arụ ọrụ ahụ na ihe a na-ebubata.
