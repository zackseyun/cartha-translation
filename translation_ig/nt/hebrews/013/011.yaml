  naturalness: 'Ahịrịokwu e dezigharịrị na-agbaso usoro Igbo nke ọma: isiokwu ‘ahụ anụmanụ’ na nkebi na-akọwa ya sochiri, ebe ‘a na-esure ... ọkụ’ bụ okwu nkịtị ma dị ùgwù.'
