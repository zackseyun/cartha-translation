revisions:
- from: N’ihi na a na-akpọ ozu anụmanụ ndị ahụ ọkụ[b] n’èzí ogige ahụ—anụmanụ ndị nnukwu onye nchụàjà na-ebubata ọbara ha n’ime ebe nsọ[a] maka mmehie.
  to: N’ihi na a na-esure ahụ anụmanụ ndị nnukwu onye nchụàjà na-ebubata ọbara ha n’ime ebe nsọ[a] maka mmehie ọkụ[b] n’èzí ogige ahụ.
  rationale: E dochiela ‘ozu’ anya site n’‘ahụ’ maka okwu Igbo eke ma kwekọọ na σώματα. E tinyela nkebi na-akọwa anụmanụ kpọmkwem n’ime aha ahụ, ma e chekwala eziokwu na nnukwu onye nchụàjà bụ onye na-ebubata ọbara ahụ. E wepụrụ ‘ebe ịchụ àjà’ n’akwụkwọ ala peeji n’ihi na ọ na-agbanwe τὰ ἅγια gaa n’altar; ‘ụlọ nsọ’ bụ nhọrọ dị nchebe maka ‘ebe nsọ.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:05:51Z'
