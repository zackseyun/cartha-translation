revisions:
- from: Ya mere, site n’aka ya, ka anyị na-achụrụ Chineke aja otuto mgbe niile—ya bụ, mkpụrụ egbugbere ọnụ ndị na-ekwupụta aha ya.[a]
  to: Ya mere, site na ya, ka anyị na-achụrụ Chineke aja otuto mgbe niile—ya bụ, mkpụrụ nke egbugbere ọnụ na-ekwupụta aha ya.[a]
  rationale: The revision renders δι’ αὐτοῦ more directly as “site na ya,” retains the Greek sacrificial and exhortational sense, and improves the Igbo syntax of the explanatory phrase. The footnote is limited to the genuine semantic range of ὁμολογέω and no longer introduces the unsupported idea of expressing support for a name.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:05:44Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the hortatory force, continual offering, sacrificial imagery, and the explanatory apposition. However, “site n’aka ya” more literally evokes “from his hand” and is less direct for δι’ αὐτοῦ (“through him”).
  naturalness: The verse is generally clear, but “mkpụrụ egbugbere ọnụ ndị na-ekwupụta” is syntactically heavier than necessary. Using a genitive linker and a nonhuman relative construction is smoother Standard Igbo.
  terminology: “aja otuto,” “ịchụrụ Chineke aja,” and “aha ya” are suitable and retain the passage’s elevated sacrificial register. The footnote’s proposed alternative “ndị na-ekwupụta nkwado ha nye aha ya” is not a faithful or natural equivalent of ὁμολογούντων τῷ ὀνόματι αὐτοῦ.
  issues:
  - severity: medium
    issue: “site n’aka ya” for δι’ αὐτοῦ
    rationale: Although it can suggest agency, the expression foregrounds “his hand.” “site na ya” more directly expresses the Greek mediatorial/means sense without adding imagery.
  - severity: low
    issue: Relative construction in “mkpụrụ egbugbere ọnụ ndị na-ekwupụta aha ya”
    rationale: The Greek means “fruit of lips confessing his name.” “mkpụrụ nke egbugbere ọnụ ndị na-ekwupụta” is less idiomatic; a linker and “nke na-ekwupụta” make the relationship clearer in Standard Igbo.
  - severity: medium
    issue: Footnote alternative adds an unsupported sense
    rationale: “Ikwupụta nkwado ha nye aha ya” means declaring support for his name, rather than confessing or openly acknowledging it. The note should present only faithful lexical alternatives.
  revised_text: Ya mere, site na ya, ka anyị na-achụrụ Chineke aja otuto mgbe niile—ya bụ, mkpụrụ nke egbugbere ọnụ na-ekwupụta aha ya.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mkpụrụ nke egbugbere ọnụ ndị na-ekwuputa aha ya n’ihu ọha.” Ngwaa Grik ahụ nwere ike ịpụta ikwupụta ma ọ bụ ikweta aha ya n’ihu ọha.
    reason: lexical_alternative
  revision_rationale: The revision renders δι’ αὐτοῦ more directly as “site na ya,” retains the Greek sacrificial and exhortational sense, and improves the Igbo syntax of the explanatory phrase. The footnote is limited to the genuine semantic range of ὁμολογέω and no longer introduces the unsupported idea of expressing support for a name.
