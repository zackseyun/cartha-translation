  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δι’ αὐτοῦ ⸀οὖν ἀναφέρωμεν θυσίαν αἰνέσεως διὰ παντὸς τῷ θεῷ, τοῦτ’ ἔστιν καρπὸν χειλέων ὁμολογούντων τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: ig
  text: Ya mere, site na ya, ka anyị na-achụrụ Chineke aja otuto mgbe niile—ya bụ, mkpụrụ nke egbugbere ọnụ na-ekwupụta aha ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mkpụrụ nke egbugbere ọnụ ndị na-ekwuputa aha ya n’ihu ọha.” Ngwaa Grik ahụ nwere ike ịpụta ikwupụta ma ọ bụ ikweta aha ya n’ihu ọha.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: site n’aka ya
  rationale: Nke a na-egosi ụzọ ma ọ bụ onye e si n’aka ya mee ihe, ma na-edobe ọrụ onye ogbugbo nke Kraịst n’ọnọdụ a.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru n’amaokwu ndị bu ụzọ.
- source_word: ἀναφέρωμεν
  choice: ka anyị na-achụrụ
  rationale: Ọdịdị ngwaa a bụ agbamume nye ndị niile a na-agwa okwu; ‘achụrụ’ na-echekwa echiche nke iweta aja.
- source_word: θυσίαν αἰνέσεως
  choice: aja otuto
  rationale: Ọ bụ okwu Igbo kwụ ọtọ ma dịkwa mfe nghọta nke na-echekwa ihe atụ metụtara ịchụ aja.
- source_word: διὰ παντὸς
  choice: mgbe niile
  rationale: Ọ na-egosi ime ihe na-aga n’ihu mgbe nile.
- source_word: τῷ θεῷ
  choice: Chineke
  rationale: N’usoro ‘ịchụrụ Chineke aja,’ Chineke bụ onye a na-enye aja ahụ.
- source_word: τοῦτ’ ἔστιν
  choice: ya bụ
  rationale: Ọ na-ewebata nkọwa kpọmkwem banyere ihe aja otuto ahụ bụ.
- source_word: καρπὸν χειλέων
  choice: mkpụrụ egbugbere ọnụ
  rationale: Nke a na-echekwa ihe atụ dị n’asụsụ Grik na njikọ ya na okwu Akwụkwọ Nsọ ndị gara aga; etinyeghị ‘anyị’ n’ihi na ọ dịghị n’ihe odide Grik.
- source_word: ὁμολογούντων
  choice: ndị na-ekwupụta
  rationale: Ọ na-enye echiche nke ikwupụta ma ọ bụ ikweta n’ihu ọha, n’akọwaghị ya naanị dị ka ito ma ọ bụ ikele.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: aha ya
  rationale: N’Igbo nkịtị, ‘ikwupụta aha ya’ na-egosi ịkpọsa ma kweta onye ọ bụ.
theological_decisions:
- issue: Onye ‘ya’ nọchiri anya na δι’ αὐτοῦ
  choice: A hapụrụ ya dịka nnọchiaha, ebe ọnọdụ okwu na-egosi Kraịst na ọrụ onye ogbugbo ya.
  alternative: Ịkpọ ya ‘Jizọs’ ma ọ bụ ‘Kraịst’ ozugbo.
  rationale: Amaokwu ndị gbara ya gburugburu na-atụ aka n’ebe Jizọs nọ, ma ihe odide ahụ n’onwe ya ji nnọchiaha; ịhapụ ya otu ahụ na-echekwa ma njikọ ahụ ma ụdị okwu mbụ.
- issue: Ike ihe atụ nke ịchụ aja
  choice: E debere ‘ịchụrụ’ na ‘aja otuto.’
  alternative: Ịsụgharị ya naanị dịka ‘ka anyị na-eto Chineke.’
  rationale: Ihe odide ahụ kpachaara anya jiri asụsụ ịchụ aja kọwaa otuto; idebe ya na-echekwa njikọ nkà mmụta okpukpe ahụ n’enweghị mgbakwunye ozizi.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị nsọ ma doo ndị nkịtị anya. E ji ‘egbugbere ọnụ’ chekwaa ihe atụ Akwụkwọ Nsọ, ebe ‘site n’aka ya’ na ‘ka anyị na-achụrụ’ na-eme ka ahịrịokwu ahụ bụrụ nke e ji eme ihe n’Igbo.
