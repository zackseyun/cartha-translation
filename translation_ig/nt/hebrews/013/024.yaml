id: HEB.13.24
reference: Hebrews 13:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: ig
  text: Keleenụ ndị ndu unu niile na ndị nsọ niile. Ndị si Ịtali na-ekele unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndị nọ n’Ịtali na-ekele unu.” Okwu Grik a nwere ike ịpụta ma ndị si Ịtali ma ndị nọ n’ebe ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Keleenụ
  rationale: Okwu iwu a na-agwa ọtụtụ mmadụ ka ha kelee ndị ọzọ; “Keleenụ” bụ ụzọ Igbo dị nkenke ma bụrụkwa nke e ji asụ ekele.
- source_word: πάντας
  choice: niile
  rationale: “Niile” na-egosi ìgwè ahụ dum ma kwekọọ n'ụzọ ebumpụta ụwa na Igbo.
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: ndị ndu unu
  rationale: Nke a na-egosi ndị na-edu ọgbakọ, ọ bụghị ndị ọchịchị obodo; “ndị ndu unu” doro anya ma ghara itinye nkọwa òtù ụka pụrụ iche.
- source_word: τοὺς ἁγίους
  choice: ndị nsọ
  rationale: “Ndị nsọ” na-echekwa aha Agba Ọhụrụ ji akọwa ndị kwere ekwe dị ka ndị e doro nsọ, kama ịgbanwe ya gaa n’okwu nkọwa sara mbara.
- source_word: ἀσπάζονται
  choice: na-ekele
  rationale: Ụdị ugbu a “na-ekele” na-egosipụta omume iziga ekele n’ọnọdụ akwụkwọ ozi.
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: Ndị si Ịtali
  rationale: ἀπό na genitive na-egosikarị ebe mmadụ si; “Ndị si Ịtali” na-echekwa nghọta ahụ nke ọma, ebe a na-edebe nghọta nke ọzọ n’ala ala peeji.
theological_decisions:
- issue: Ndị οἱ ἀπὸ τῆς Ἰταλίας na-ezo aka na ha
  choice: Ndị si Ịtali
  alternative: Ndị nọ n’Ịtali
  rationale: ἀπό na-egosikarị isi mmalite ma ọ bụ ebe mmadụ si, ya mere isi ederede ji “Ndị si Ịtali.” Ma okwu Grik ahụ nwekwara ike ịbụ ndị nọ n’Ịtali; e debere nke ahụ n’ala ala peeji ka a ghara idozi ihe ederede hapụrụ ka ọ bụrụ ihe a pụrụ ịghọta n’ụzọ abụọ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị ndu” kama okwu nwere ike igosi ndị ọchịchị obodo, ma debe “ndị nsọ” n’ihi ibu okwu ahụ nwere n’Agba Ọhụrụ.
