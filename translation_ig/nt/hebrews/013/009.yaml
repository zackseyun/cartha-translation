id: HEB.13.9
reference: Hebrews 13:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διδαχαῖς ποικίλαις καὶ ξέναις μὴ παραφέρεσθε· καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν, οὐ βρώμασιν, ἐν οἷς οὐκ ὠφελήθησαν οἱ ⸀περιπατοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: ig
  text: Unu ekwela ka ozizi dị iche iche na nke na-amaghị ama dọkpụrụ unu pụọ. N’ihi na ọ dị mma ka e jiri amara mee ka obi sie ike[a], ọ bụghị site n’ihe oriri[b]; nke na-abaghị ndị tinyere onwe ha n’ihe ndị ahụ uru[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka amara mee ka obi guzosie ike.” Ngwaa Grik ahụ pụrụ ịpụta ime ka ihe sie ike, ime ka ọ guzosie ike, ma ọ bụ ime ka ọ kwụrụ chịm.
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “ihe oriri” na-ezo aka n’usoro ma ọ bụ omume metụtara nri; ma okwu Grik ahụ kwuru naanị “ihe oriri.”
    reason: cultural_note
  - marker: c
    text: N’ụzọ nkịtị, Grik kwuru “ndị na-ejegharị n’ime ha.” Nke a nwekwara ike ịpụta “ndị biri ndụ ha site n’ihe ndị ahụ” ma ọ bụ “ndị tinyere onwe ha n’ihe ndị ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: ozizi dị iche iche na nke na-abụghị nke anyị
  rationale: “Ozizi” bụ okwu Igbo doro anya maka teachings. Nkebi a na-egosi ma ụdị ozizi dịgasị iche iche ma ozizi ndị na-abụghị nke ozi ndị kwere ekwe natara, n’enweghị ịkọwa ha dị ka nke agbụrụ mba ọzọ.
- source_word: μὴ παραφέρεσθε
  choice: Unu ekwela ka ... dọkpụrụ unu pụọ
  rationale: Nke a na-echekwa ọnọdụ nnabata nke ngwaa Grik na ihe atụ nke ibupụ mmadụ n’ụzọ, ma bụrụkwa Igbo nkịtị na nke doro anya.
- source_word: χάριτι
  choice: site n’amara
  rationale: A na-ewere dative a dịka ụzọ e si eme ka obi sie ike; “amara” na-echekwa okwu nkà mmụta okpukpe ahụ n’enweghị nkọwa mgbakwunye.
- source_word: βεβαιοῦσθαι τὴν καρδίαν
  choice: ka e jiri amara mee ka obi sie ike
  rationale: “Mee ka obi sie ike” na-enye echiche nke ime ka ihe guzosie ike ma na-echekwa “obi” dịka etiti ndụ ime mmadụ.
- source_word: οὐ βρώμασιν
  choice: ọ bụghị site n’ihe oriri
  rationale: A sụgharịrị βρώμασιν kpọmkwem dịka “ihe oriri,” kama ịgbasa ya n’ahịrị bụ isi ka ọ bụrụ iwu nri ma ọ bụ nri aja.
- source_word: οἱ περιπατοῦντες
  choice: ndị tinyere ndụ ha n’ihe ndị ahụ
  rationale: περιπατέω pụtara ije n’ụzọ nkịtị, ma ebe a ọ bụ ihe atụ gbasara omume ma ọ bụ usoro ndụ. Nsụgharị a bụ Igbo eke ma na-ezere okwu na-adịghị aghọta nke ọma dịka “ije n’ihe oriri.”
- source_word: οὐκ ὠφελήθησαν
  choice: eriteghị uru ọ bụla
  rationale: Nke a na-egosipụta n'ụzọ doro anya na omume ndị ahụ abaghị ndị na-eme ha uru.
theological_decisions:
- issue: Ihe “ihe oriri” na-ezo aka na ọdịiche ya na amara
  choice: E debere “ihe oriri” n’ahịrị bụ isi, ebe ndetu na-egosi na ọ pụrụ ịgụnye usoro ma ọ bụ omume metụtara nri.
  alternative: Ịkọwa ya kpọmkwem dịka iwu nri, nri aja, ma ọ bụ emume ndị Juu.
  rationale: Okwu Grik kwuru naanị “ihe oriri.” Idebe ya otú ahụ na-echekwa mgbagwoju anya dị n’ihe odide ahụ ma ghara ịmanye otu nkọwa gbasara ụdị omume ahụ.
- issue: Ihe atụ nke “obi”
  choice: obi
  alternative: uche ma ọ bụ mmadụ ime
  rationale: “Obi” na-echekwa ihe atụ Akwụkwọ Nsọ na ibu nkà mmụta mmadụ nke καρδία, kama ime ka ihe ọ pụtara dị warara.
- issue: Uru nke βεβαιοῦσθαι
  choice: mee ka obi sie ike
  alternative: mee ka obi guzosie ike
  rationale: Nhọrọ bụ isi bụ Igbo eke; ndetu na-echekwa echiche ọzọ nke ime ka obi guzosie ike.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere nkwanye ugwu ma dị mfe nghọta. Ejiri “unu” gosipụta ọtụtụ mmadụ dị na ngwaa Grik. A zere okwu ụka pụrụ iche na nkọwa ga-eme ka “ihe oriri” bụrụ naanị otu ụdị iwu ma ọ bụ emume.
