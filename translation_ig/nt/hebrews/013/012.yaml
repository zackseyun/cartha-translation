revisions:
- from: N’ihi ya, Jizọs kwa tara ahụhụ n’èzí ọnụ ụzọ ámá[b], ka o wee site n’ọbara ya onwe ya doo ndị ahụ nsọ[a].
  to: N’ihi ya, Jizọs kwa tara ahụhụ n’èzí ọnụ ụzọ ámá[b], ka o wee site n’ọbara nke ya doo ndị mmadụ nsọ[a].
  rationale: The revision replaces an unnatural demonstrative with a direct collective rendering of τὸν λαόν, retains the source’s purpose and instrumental relations in idiomatic Igbo, and corrects the contextual footnote so that it refers to “outside the camp,” as Hebrews 13:11 does, rather than treating camp and gate as alternatives.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:05:41Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the inferential διὸ, additive καὶ, purpose clause ἵνα ἁγιάσῃ, instrumental διὰ with the genitive, singular πύλης, and ἔπαθεν. However, “ndị ahụ” is not an adequately natural or semantically direct rendering of τὸν λαόν; it is demonstrative (“those people”) rather than the definite collective “the people.”
  naturalness: The sentence is generally clear Standard Igbo. Recasting the purpose phrase as “ka o wee site n’ọbara nke ya doo ndị mmadụ nsọ” is more idiomatic, and “ndị mmadụ” supplies a natural generic definite collective without adding “of God.”
  terminology: “Doo ... nsọ” appropriately retains the cultic/theological sense of ἁγιάζω. “Ọbara nke ya” preserves the emphasis of ἰδίου naturally. The cross-reference note must distinguish the preceding context’s “outside the camp” from the verse’s “outside the gate”; “outside the camp/gate” conflates distinct expressions.
  issues:
  - severity: medium
    issue: “ndị ahụ” renders τὸν λαόν.
    rationale: “Ndị ahụ” normally means “those people” and introduces a demonstrative nuance absent from the Greek. “Ndị mmadụ” is a more natural Igbo rendering of the definite collective “the people,” while avoiding an unwarranted expansion to “God’s people.”
  - severity: medium
    issue: Footnote b says sacrificial remains were taken “n’èzí ụlọikwuu ma ọ bụ ọnụ ụzọ ámá.”
    rationale: The preceding context (Hebrews 13:11) refers to remains being burned outside the camp (παρεμβολή), not alternatively outside a gate. The note should preserve the contextual echo without conflating camp and gate.
  revised_text: N’ihi ya, Jizọs kwa tara ahụhụ n’èzí ọnụ ụzọ ámá[b], ka o wee site n’ọbara nke ya doo ndị mmadụ nsọ[a].
