  text: διὸ καὶ Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν, ἔξω τῆς πύλης ἔπαθεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: ig
  text: N’ihi ya, Jizọs kwa tara ahụhụ n’èzí ọnụ ụzọ ámá[b], ka o wee site n’ọbara nke ya doo ndị mmadụ nsọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mee ka ndị mmadụ dị nsọ” ma ọ bụ “kewapụ ndị mmadụ nye Chineke.”
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “n’èzí ọnụ ụzọ ámá” na-ezo aka n’ebe dị ná mpụga Jerusalem ebe Jizọs tara ahụhụ. Ọ na-echetakwa ihe ndị bu ụzọ kwuru banyere ibupụ ihe fọdụrụ n’àjà gaa n’èzí ogige.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’arụmụka dị n’amaokwu ndị bu ụzọ, n’Igbo doro anya ma dịkwa eke.
- source_word: καὶ
  choice: kwa
  rationale: Na-egosi na ihe mere Jizọs kwekọrọ n’usoro àjà a kpọtụrụ aha tupu nke a.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Ọ bụ nsụgharị aha a na-ejikarị eme ihe n’Igbo Izugbe.
- source_word: ἵνα ἁγιάσῃ
  choice: ka o wee ... doo ndị ahụ nsọ
  rationale: “Ka o wee” na-echekwa nzube nke ἵνα tinyere subjunctive; “idoo nsọ” na-eburu echiche ime ka ihe ma ọ bụ ndị mmadụ bụrụ ndị e kewapụrụ nye Chineke, nke dabara n’usoro àjà dị n’Akwụkwọ Ndị Hibru.
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: site n’ọbara ya onwe ya
  rationale: “Site na” na-egosi ụzọ ma ọ bụ ihe e ji mee ya; “ya onwe ya” na-echekwa nkwusi ike nke ἰδίου.
- source_word: τὸν λαόν
  choice: ndị ahụ
  rationale: Na-echekwa ịdị kpọmkwem nke okwu Grik ahụ n’enweghị itinye “ndị Chineke,” nke a na-aghọta site n’ihe gbara amaokwu ahụ gburugburu ma a naghị ekwu ya kpọmkwem.
- source_word: ἔξω τῆς πύλης
  choice: n’èzí ọnụ ụzọ ámá
  rationale: Na-echekwa otu ọnụ ụzọ ámá dị ka Grik si kwuo, n’etinyeghị “obodo,” ọ bụ ezie na a na-aghọta na ọ bụ ọnụ ụzọ ámá Jerusalem.
- source_word: ἔπαθεν
  choice: tara ahụhụ
  rationale: Ọ bụ ụzọ Igbo Izugbe si ekwu πάσχω n’ụzọ dị mkpirikpi, eke, ma kwụ ọtọ.
theological_decisions:
- issue: Nsụgharị ἁγιάζω n’ọnọdụ metụtara àjà
  choice: doo ndị ahụ nsọ
  alternative: mee ka ndị ahụ dị nsọ; kewapụ ndị ahụ nye Chineke
  rationale: “Ido nsọ” na-echekwa ma echiche ịdị nsọ ma echiche ido ma ọ bụ ikewapụ nye Chineke n’usoro àjà, n’enweghị ime ka okwu ahụ bụrụ naanị mgbanwe omume ma ọ bụ ịkwado ozizi otu ụka.
- issue: Ndị τὸν λαόν na-ezo aka na ha
  choice: ndị ahụ
  alternative: ndị Chineke
  rationale: Ọnọdụ okwu ahụ na-egosi ndị ọgbụgba ndụ Chineke, ma Grik kwuru naanị “ndị ahụ/ndị mmadụ ahụ.” Ya mere, e tinyeghị “Chineke” n’ahịrị amaokwu ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ debere njikọ ezi uche “N’ihi ya,” ike mgbakwunye nke “kwa,” ihe nzube nke “ka o wee,” na okwu àjà “idoo nsọ.”
