  text: τῆς φιλοξενίας μὴ ἐπιλανθάνεσθε, διὰ ταύτης γὰρ ἔλαθόν τινες ξενίσαντες ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: ig
  text: Unu elegharala ile ọbịa anya, n’ihi na site n’ile ọbịa, ụfọdụ ndị nabatara ndị mmụọ ozi[a] n’amaghị ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ozi.” Okwu Grik a sụgharịrị “ndị mmụọ ozi” nwekwara ike ịpụta “ndị ozi,” ọ bụ ezie na “ndị mmụọ ozi” kacha daba n’akụkọ o yiri ka a na-ezo aka na ya ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοξενίας
  choice: ile ndị ọbịa
  rationale: Nkebiokwu a na-egosi omume ịnabata na ile ndị bịara abịa nke ọma; ọ bụ ụzọ doro anya ma bụrụkwa nke Igbo nkịtị si ekwu hospitality.
- source_word: μὴ ἐπιλανθάνεσθε
  choice: Unu echefula
  rationale: Ụdị iwu a na-adọ ndị na-agụ ọdụ ka ha ghara ichefu ma ọ bụ leghara omume ahụ anya; “echefula” na-echekwa ihe oyiyi okwu Grik ma na-arụ ọrụ nke ọma n’ọdụmọdụ a.
- source_word: διὰ ταύτης
  choice: site n’ime nke a
  rationale: Ọ na-ezo aka n’omume ile ndị ọbịa ma na-echekwa echiche nke ụzọ ma ọ bụ ihe e ji mee ihe dị na διά.
- source_word: ἔλαθόν
  choice: n’amaghị
  rationale: Ihe owuwu λανθάνω tinyere participle pụtara na omume ahụ mere n’enweghị ndị mere ya ịma; “n’amaghị” na-ekwupụta nke a n’Igbo eke.
- source_word: τινες
  choice: ụfọdụ ndị
  rationale: Nke a na-anọchi anya ọtụtụ mmadụ a na-akọwaghị kpọmkwem.
- source_word: ξενίσαντες
  choice: lere
  rationale: N’ọnọdụ a, “ile” pụtara ịnabata na ilekọta ndị ọbịa, ma na-ejikọta nke ọma na “ile ndị ọbịa” dị na mmalite amaokwu ahụ.
- source_word: ἀγγέλους
  choice: ndị mmụọ ozi
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọwa ndị ozi nke eluigwe; ntụaka a pụrụ ịdị na Jenesis 18–19 na-akwado nghọta a, ebe a na-edebe nhọrọ “ndị ozi” n’ala peeji.
theological_decisions:
- issue: Ihe ἀγγέλους na-ezo aka na ya
  choice: ndị mmụọ ozi n’echiche ndị ozi nke eluigwe
  alternative: ndị ozi mmadụ
  rationale: Akụkọ ndị Akwụkwọ Nsọ banyere ndị nabatara ndị ọbịa mechara bụrụ ndị si n’eluigwe na-akwado “ndị mmụọ ozi.” Ma ebe okwu Grik ahụ nwekwara ike ịpụta ndị ozi mmadụ, a naghị ezobe nhọrọ ahụ; e debere ya n’ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ile ndị ọbịa” mee ka omume ịnabata na ilekọta ndị bịara abịa pụta ìhè; akara ala peeji [a] dị n’ederede isi dịka a chọrọ.
