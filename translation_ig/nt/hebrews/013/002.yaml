review_pass:
  verdict: revise
  source_fidelity: The draft conveys the exhortation to hospitality and the reference to angels, but its final clause adds an unnecessary explicit proposition ('that they were angels') and the wording for the instrumental phrase is awkward. The revised wording preserves the Greek sense that some people hosted angels unknowingly.
  naturalness: “Ile ndị ọbịa” is understandable, but “ile ọbịa” is the more idiomatic compact Standard Igbo expression for hospitality. “Site n’ime nke a” is stilted in this context; “site n’ile ọbịa” is clear and natural. “N’amaghị ama” naturally expresses the λανθάνω-plus-participle construction.
  terminology: “Ndị mmụọ ozi” is the appropriate main-text rendering of ἀγγέλους in this likely allusive context. The viable lexical alternative “ndị ozi” is retained in a footnote. The footnote anchor should be attached to “ndị mmụọ ozi,” the word to which the lexical alternative pertains.
  issues:
  - severity: medium
    issue: The main text says “n’amaghị na ha bụ ndị mmụọ ozi” (“without knowing that they were angels”).
    rationale: This makes explicit the object of the subjects’ ignorance. Although compatible with the likely sense, the Greek more economically states that they hosted angels unknowingly. “N’amaghị ama” preserves this without added specification.
  - severity: low
    issue: “Site n’ime nke a” is awkward and vague in Standard Igbo.
    rationale: The pronoun refers to hospitality; repeating the practice as “site n’ile ọbịa” is idiomatic and keeps the instrumental relation clear.
  - severity: medium
    issue: Footnote marker [a] is attached to “ndị ọbịa,” although the footnote’s stated lexical alternative principally concerns ἀγγέλους.
    rationale: The marker should follow “ndị mmụọ ozi” so that its anchor matches the lexical note and English audit trail.
  revised_text: Unu elegharala ile ọbịa anya, n’ihi na site n’ile ọbịa, ụfọdụ ndị nabatara ndị mmụọ ozi[a] n’amaghị ama.
  revised_footnotes:
