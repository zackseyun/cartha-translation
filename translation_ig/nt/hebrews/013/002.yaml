revisions:
- from: Unu echefula ile ndị ọbịa[a], n’ihi na site n’ime nke a, ụfọdụ ndị lere ndị mmụọ ozi n’amaghị na ha bụ ndị mmụọ ozi.
  to: Unu elegharala ile ọbịa anya, n’ihi na site n’ile ọbịa, ụfọdụ ndị nabatara ndị mmụọ ozi[a] n’amaghị ama.
  rationale: The revision uses idiomatic Standard Igbo for the exhortation not to neglect hospitality, replaces a stilted instrumental expression, and renders the Greek idiom for unknowingly hosting angels without adding an explicit clause. It also relocates and narrows the footnote so its anchor directly corresponds to the Greek lexical ambiguity in ἀγγέλους.
  reviewer_model: gpt-5.6-terra
