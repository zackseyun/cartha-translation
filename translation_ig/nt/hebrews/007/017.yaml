review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the priestly designation, permanence, and Melchizedek reference without importing “high priest.” However, “e gbara ama” is perfective/past (“testimony was given”), whereas μαρτυρεῖται is present passive/impersonal. An Igbo present impersonal expression better preserves the Greek form.
  naturalness: “A na-agba ama, sị:” is a natural, formal Standard Igbo scriptural-testimony formula. “N’usoro Melkizedek” is concise and idiomatic for κατὰ τὴν τάξιν Μελχισέδεκ; the longer wording is usable but less direct.
  terminology: “Onye nchụaja,” “ruo mgbe ebighị ebi,” and “Melkizedek” are appropriate Standard Igbo choices. The quotation and Psalm cross-reference are retained.
  issues:
  - severity: medium
    issue: Tense/aspect of the testimony introduction
    rationale: “E gbara ama” ordinarily conveys a completed past action, while μαρτυρεῖται is present passive/impersonal. “A na-agba ama” retains the ongoing/formulaic present sense without specifying the witness.
  - severity: low
    issue: Rendering of κατὰ τὴν τάξιν
    rationale: “Dịka usoro Melkizedek si dị” is understandable, but “n’usoro Melkizedek” is more idiomatic and directly expresses membership/correspondence according to Melchizedek’s order. The former can be retained as the lexical alternative.
  revised_text: 'N’ihi na a na-agba ama, sị: “Ị bụ onye nchụaja ruo mgbe ebighị ebi n’usoro Melkizedek.”[a][b]'
  revised_footnotes:
