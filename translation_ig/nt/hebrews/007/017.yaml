    reason: lexical_alternative
  - marker: b
    text: Nke a bụ okwu e hotara n’Abụ Ọma 110:4.
    reason: cross_reference
  revision_rationale: The revision changes the testimony verb to present impersonal Igbo, matching μαρτυρεῖται, and uses the more idiomatic “n’usoro Melkizedek” for κατὰ τὴν τάξιν. It retains the direct quotation, the non-expanded term “onye nchụaja,” and both footnote anchors.
