  text: ⸀μαρτυρεῖται γὰρ ὅτι Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: ig
  text: 'N’ihi na a na-agba ama, sị: “Ị bụ onye nchụaja ruo mgbe ebighị ebi n’usoro Melkizedek.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “dịka usoro Melkizedek si dị.”'
    reason: lexical_alternative
  - marker: b
    text: Nke a bụ okwu e hotara n’Abụ Ọma 110:4.
    reason: cross_reference
lexical_decisions:
- source_word: μαρτυρεῖται
  choice: e gbara ama
  rationale: Ọ bụ ngwaa dị n’ụdị passive nke na-ewebata ama Akwụkwọ Nsọ gbara, n’emeghị ka onye na-agba ama doo anya karịa ka Grik mere.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta ama a na ihe e kwuru tupu ya dịka ihe na-akwado ya.
- source_word: ὅτι
  choice: 'sị:'
  rationale: Ọ na-ewebata kpọmkwem ihe ama ahụ kwuru; ‘sị’ na akara abụọ dabara n’Igbo eke.
- source_word: Σὺ
  choice: Ị
  rationale: Na-echekwa okwu onye nke abụọ otu n’onwe ya na nkwusi ike dị na ntụnye kpọmkwem.
- source_word: ἱερεὺς
  choice: onye nchụaja
  rationale: Ọ bụ aha ọrụ onye nchụaja; etinyeghị ‘onyeisi’ n’ihi na okwu Grik a abụghị ‘onyeisi nchụaja.’
- source_word: εἰς τὸν αἰῶνα
  choice: ruo mgbe ebighị ebi
  rationale: Nke a bụ okwu Igbo doro anya maka ịdịgide na-enweghị njedebe.
- source_word: κατὰ τὴν τάξιν
  choice: dịka usoro ... si dị
  rationale: Na-egosi nkwekọrịta na usoro ma ọ bụ ụdị Melkizedek, ma na-ada ka Igbo nke oge a.
- source_word: Μελχισέδεκ
  choice: Melkizedek
  rationale: A tụgharịghị aha mmadụ; e dere ya n’ụdị a na-asụkarị n’Igbo.
theological_decisions:
- issue: Ikwupụta ọkwa nchụaja nke dị n’ama Abụ Ọma n’etinyeghị nkọwa ozizi e mesịrị
  choice: onye nchụaja
  alternative: onyeisi nchụaja
  rationale: Grik kwuru ἱερεύς, ‘onye nchụaja,’ ọ bụghị ἀρχιερεύς, ‘onyeisi nchụaja.’ Ya mere, a hapụrụ okwu ahụ dịka isi mmalite si kwuo ya.
- issue: Ihe ‘usoro Melkizedek’ pụtara
  choice: dịka usoro Melkizedek si dị
  alternative: n’ụdị Melkizedek
  rationale: Nhọrọ a na-echekwa obosara pụtara κατὰ τὴν τάξιν, n’akọwaghị ya naanị dịka myirịta onwe onye ma ọ bụ usoro ndị nchụaja ketara eketa.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji ‘e gbara ama’ chekwaa passive na isiokwu a na-akọwaghị; e jighị ‘onyeisi nchụaja’ gbasaa ihe Grik kwuru.
