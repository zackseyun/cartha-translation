  to: Ọ bụ ya ka Ebreham kewara otu ụzọ n’ụzọ iri site n’ihe niile nye[a]. Nke mbụ, mgbe a sụgharịrị aha ya, ọ pụtara “Eze Ezi Omume”[b]; emesịa kwa, ọ bụ “Eze Salem,” ya bụ, “Eze Udo.”
  rationale: E degharịrị nkebi mbụ ka ọ bụrụ usoro Igbo doro anya nke na-edobe onye natara ya (ᾧ) na echiche ikewa òkè (ἐμέρισεν). E tinyere nkọwa ‘mgbe a sụgharịrị aha ya, ọ pụtara’ iji gosipụta nkọwa aha Melkizedek. E tinyeghị nkọwa okpukpe ọzọ; a debere ambiguity nke δικαιοσύνη n’ala peeji, tinyekwara akara [b] kwekọrọ na ya.
