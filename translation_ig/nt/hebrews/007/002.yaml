  naturalness: ‘Ọ bụ ya ka Ebreham kewara ... nye’ na-adịkwu eke ma doo anya karịa mmalite ‘onye Ebraham nyekwara.’ ‘Mgbe a sụgharịrị aha ya’ na-ekwupụta ἑρμηνευόμενος nke ọma.
  terminology: ‘Eze Ezi Omume’ dabara maka βασιλεὺς δικαιοσύνης. A ghaghị itinye akara [b] na nkọwa ala peeji maka nhọrọ ‘Ikpe Ziri Ezi,’ dịka audit trail si kwuo. ‘Ebreham’ na ‘Melkizedek’ bụ nsụgharị aha ndị a na-ahụkarị n’Igbo.
