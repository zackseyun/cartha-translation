    rationale: Ngwaa Grik ahụ pụtara ikewa ma ọ bụ ikenye òkè; ‘kewara ... nye’ na-echekwa nuance a n’enweghị ime ka ahịrịokwu sie ike.
  - severity: medium
    issue: Akara na nkọwa ala peeji [b] adịghị n’ederede, n’agbanyeghị na translation notes na theological decisions kwuru na a ga-enwe ya.
    rationale: Nke a na-ewepụ lexical alternative maka δικαιοσύνη, nke English audit trail debere.
  - severity: low
    issue: Nkọwa ala peeji [a] na-ekwu ‘dị ka onyinye,’ nke na-agbakwụnye echiche na-adịghị kpọmkwem n’okwu Grik.
    rationale: Ekwesịrị ka nkọwa ahụ gosi ọdịiche ‘otu ụzọ n’ụzọ iri’ na ‘ụzọ iri/onyinye otu ụzọ n’ụzọ iri’ n’enweghị ikwu na onyinye bụ akụkụ nke okwu Grik n’onwe ya.
