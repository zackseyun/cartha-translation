id: HEB.7.2
reference: Hebrews 7:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: ig
  text: Ọ bụ ya ka Ebreham kewara otu ụzọ n’ụzọ iri site n’ihe niile nye[a]. Nke mbụ, mgbe a sụgharịrị aha ya, ọ pụtara “Eze Ezi Omume”[b]; emesịa kwa, ọ bụ “Eze Salem,” ya bụ, “Eze Udo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụzọ iri,” ya bụ, onyinye otu ụzọ n’ụzọ iri. Grik kwuru kpọmkwem “otu ụzọ n’ụzọ iri.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Eze Ikpe Ziri Ezi.” Okwu Grik ahụ pụrụ ịpụta “ezi omume” ma ọ bụ “ikpe ziri ezi”; isi ederede na-eji “ezi omume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: onye
  rationale: Nnọchiaha njikọ dị na dative na-ezo aka na Melkizedek; n’Igbo, nhazi ‘onye Ebraham nyere’ na-egosi nke ọma na ọ bụ ya natara ihe ahụ.
- source_word: δεκάτην
  choice: otu ụzọ n’ụzọ iri
  rationale: Nke a na-edobe kpọmkwem echiche Grik nke ‘otu ụzọ n’ụzọ iri’ ma bụrụkwa okwu Igbo doro anya.
- source_word: ἀπὸ πάντων
  choice: nke ihe niile
  rationale: Ọ na-egosi na akụkụ otu ụzọ n’ụzọ iri ahụ sitere n’ihe niile Ebraham nwere n’ọnọdụ a, na-enweghị ịgbakwụnye ‘ihe nkwata’ nke adịghị n’amaokwu a n’onwe ya.
- source_word: ἐμέρισεν
  choice: nyere
  rationale: Ọ bụ ezie na ngwaa Grik nwere echiche ikewa ma ọ bụ ịtụpụta òkè, ‘nyere’ na-eme ka njikọ dative na omume ahụ bụrụ Igbo ebumpụta ụwa; ọnụ ọgụgụ otu ụzọ n’ụzọ iri ka na-echekwa echiche òkè ahụ.
- source_word: πρῶτον μὲν
  choice: Nke mbụ
  rationale: Na-edobe usoro nkọwa akụkụ abụọ nke Grik n'ụzọ doro anya.
- source_word: ἑρμηνευόμενος
  choice: a sụgharịrị aha ya
  rationale: Aha Melkizedek ka a na-akọwa ihe ọ pụtara; itinye ‘aha ya’ pụtara ihe dị n’ime ahịrịokwu Grik ma mee ka Igbo doo anya.
- source_word: βασιλεὺς δικαιοσύνης
  choice: Eze Ezi Omume
  rationale: ‘Ezi omume’ bụ okwu Igbo a na-aghọta nke ọma maka δικαιοσύνη n’echiche ọnọdụ ịdị ezi n’anya Chineke; e debere ya dịka aha-utu.
- source_word: ἔπειτα δὲ καὶ
  choice: emesịa, ọ bụkwa
  rationale: Na-echekwa ma usoro nke abụọ ma ike nke καί, n’Igbo na-aga were were.
- source_word: βασιλεὺς Σαλήμ
  choice: Eze Salem
  rationale: A hapụrụ Salem dịka aha ebe, ebe ‘Eze’ na-egosi aha-utu ahụ.
- source_word: ὅ ἐστιν
  choice: ya bụ
  rationale: Ụzọ Igbo dị nkenke ma bụrụ ihe a na-ahụkarị iji webata nkọwa ihe okwu pụtara.
- source_word: βασιλεὺς εἰρήνης
  choice: Eze Udo
  rationale: Na-enye nkọwa Salem dị ka Grik si kwuo, n’asụsụ Igbo dị mfe ma dị ùgwù.
theological_decisions:
- issue: Ịsụgharị δικαιοσύνη n’aha-utu Melkizedek
  choice: Ezi Omume
  alternative: Ikpe Ziri Ezi
  rationale: δικαιοσύνη nwere ike ịpụta ezi omume ma ọ bụ ikpe ziri ezi. Isi ederede họọrọ ‘Ezi Omume’ n’ihi na ọ na-echekwa echiche sara mbara nke righteousness n’ọnọdụ nkọwa aha a; ụzọ ọzọ kwesịrị ekwesị ka e debere na nkọwa ala peeji.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. E ji ahịrịokwu dị mfe kọwaa aha-utu abụọ ahụ. Otú ọ dị, akara nkọwa [b] kwesịrị ịdị n’isi ederede n’akụkụ ‘Eze Ezi Omume’ ka o kwekọọ na nkọwa ala peeji.
