id: HEB.7.26
reference: Hebrews 7:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: ig
  text: 'N’ihi na ọ bụ ụdị onyeisi nchụàjà dị otu a ka o kwesịịrị anyị n’ezie: onye dị nsọ, onye na-enweghị ihe ọjọọ, onye na-enweghị mmetọ, onye e kewapụrụ n’ebe ndị mmehie nọ[a], onye ghọrọ onye dị elu karịa eluigwe[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye e doro iche n’ebe ndị mmehie nọ.” Nkebi okwu a na-emesi ịdị ọcha ya n’omume na ọnọdụ ya dị elu dị ka onyeisi nchụàjà ike.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye e buliri elu karịa eluigwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιοῦτος
  choice: ụdị ... dị otu a
  rationale: Ọ na-arụtụ aka n’ụdị onyeisi nchụàjà a kọwara n’amaokwu ndị bu ụzọ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-echekwa njikọ nkọwa nke amaokwu a na arụmụka bu ya ụzọ.
- source_word: ἡμῖν καὶ ἔπρεπεν
  choice: kwesịrị anyị n’ezie
  rationale: “Kwesịrị anyị” na-egosi na onyeisi nchụàjà a dabara mkpa anyị; “n’ezie” na-egosipụta ike καί nwere n’ebe a.
- source_word: ἀρχιερεύς
  choice: onyeisi nchụàjà
  rationale: Nke a bụ aha Igbo doro anya maka ọkwa onye nchụàjà kachasị elu n’usoro ofufe.
- source_word: ὅσιος
  choice: onye dị nsọ
  rationale: Ọ na-egosi ịdị nsọ na ịdị ọcha kwesịrị onyeisi nchụàjà n’ebe a.
- source_word: ἄκακος
  choice: onye na-enweghị ihe ọjọọ
  rationale: Ọ na-egosi na ọ dịghị ajọ omume ma ọ bụ ajọ ebumnobi dị n’ime ya, n’enweghị ime ka okwu ahụ pụta nanị na ọ naghị emerụ mmadụ ahụ.
- source_word: ἀμίαντος
  choice: onye na-enweghị ntụpọ
  rationale: Ọ na-echekwa echiche ịdị ọcha, gụnyere ụda okwu metụtara ịdị ọcha n’ofufe.
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: onye e kewapụrụ n’ebe ndị mmehie nọ
  rationale: Ọ na-egosipụta ọnọdụ nkewapụ nke participle zuru ezu na-akọwa, n’emeghị ka nkọwa ya bụrụ nanị nke ebe mmadụ nọ.
- source_word: ὑψηλότερος τῶν οὐρανῶν γενόμενος
  choice: onye ghọkwara onye dị elu karịa eluigwe
  rationale: Ọ na-echekwa ma echiche ‘ịghọ’ dị na γενόμενος ma ntụnyere kpọmkwem ‘dị elu karịa eluigwe.’
theological_decisions:
- issue: Mmekọrịta Jizọs na ndị mmehie n’okwu ‘onye e kewapụrụ n’ebe ndị mmehie nọ’
  choice: E debere okwu nkewapụ ahụ kpọmkwem, ka ọ gosi ịdị ọcha ya na ọnọdụ ya dị elu.
  alternative: Ịkọwa ya dị ka nanị nkewapụ n’ebe ndị mmehie nọ, ma ọ bụ dị ka ihe mere naanị mgbe ọ rịgoro n’eluigwe.
  rationale: Usoro nkọwa ndị gbara okwu ahụ gburugburu na-ekwu maka ịdị ọcha na ịdị elu kwesịrị onyeisi nchụàjà. Nsụgharị ahụ anaghị agọnahụ na Jizọs na ndị mmehie na-akpakọrịta n’oge ozi ya n’ụwa.
- issue: Ike γενόμενος n’okwu banyere ịdị elu karịa eluigwe
  choice: onye ghọkwara onye dị elu karịa eluigwe
  alternative: onye dị elu karịa eluigwe; onye e buliri elu karịa eluigwe
  rationale: “Ghọrọ” na-egosi nzọụkwụ akụkọ ihe nzọpụta ruo n’ọnọdụ ebube ahụ, ma ọ naghị ekwu na ọdịdị chi Kraịst gbanwere ma ọ bụ na ọ malitere ịbụ Chineke mgbe ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Onyeisi nchụàjà” na-echekwa okwu ofufe ahụ; usoro nkọwa ndị ọzọ bụ ahịrịokwu ndị nkịtị nke ndị na-agụ Igbo taa ga-aghọta.
