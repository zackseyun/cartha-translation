source:
  edition: SBLGNT
  text: Θεωρεῖτε δὲ πηλίκος οὗτος ⸀ᾧ δεκάτην Ἀβραὰμ ἔδωκεν ἐκ τῶν ἀκροθινίων ὁ πατριάρχης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: ig
  text: 'Tụleenụ ka nwoke a[a] si dị ukwuu: Ebreham, bụ́ nna ochie ahụ, nyere ya otu ụzọ n’ụzọ iri nke ihe nkwata e nwetara n’agha.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nwoke a” na-ezo aka na Melkizedek, onye a kpọtụrụ aha n’amaokwu ndị bu ụzọ.
    reason: referent_clarification
  - marker: b
    text: Okwu Grik a nwere ike ịpụta ihe nkwata e nwetara n’agha, ma eleghị anya akụkụ kacha mma n’ime ihe nkwata ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: Chegodị
  rationale: Ọ bụ iwu na-akpọ ndị na-agụ akwụkwọ ka ha tụlee okwu a nke ọma; ‘Chegodị’ bụ Igbo nkịtị ma na-edobe ike nke ndụmọdụ ahụ.
- source_word: δὲ
  choice: (ekwughị ya iche)
  rationale: Ọ na-egosi obere njikọ ma ọ bụ mgbanwe n’okwu. N’Igbo, ịghara itinye okwu njikọ n’ebe a na-eme ka okwu ahụ bụrụ nke eke, n’enweghị itinye ‘ugbu a’ nke Grik ekwughị kpọmkwem.
- source_word: πηλίκος
  choice: ịdị ukwuu
  rationale: Ọ na-egosi oke ịdị ukwuu ma hapụ ụdị ịdị ukwuu ahụ ka ihe akaebe na-esote kọwaa ya.
- source_word: οὗτος
  choice: nwoke a
  rationale: Ọ na-ezo aka na Melkizedek, onye bụ nwoke; ntụgharị a doro anya ma ọ naghị etinye nkọwa ọzọ.
- source_word: ᾧ
  choice: onye ... nyere
  rationale: Ụdị ahịrịokwu a bụ ụzọ Igbo si egosipụta nke ọma onye natara ihe ahụ.
- source_word: δεκάτην
  choice: otu ụzọ n’ụzọ iri
  rationale: Nke a na-asụgharị ihe Grik kwuru n’ụzọ nkịtị ma zere ibubata echiche ụlọ ọrụ okpukpe nke okwu ‘otu ụzọ iri’ pụrụ inwe n’ọnọdụ ụfọdụ.
- source_word: Ἀβραὰμ
  choice: Ebreham
  rationale: Ụdị aha a bụ nke a na-ejikarị eme ihe n’Igbo.
- source_word: ἔδωκεν
  choice: nyere
  rationale: Ọ bụ ntụgharị dị mfe ma ziri ezi nke omume inye.
- source_word: ἐκ τῶν ἀκροθινίων
  choice: nke ihe ndị a kwatara n’agha
  rationale: Ọ na-egosi ihe e weere n’agha; isi okwu etinyeghị echiche na ọ bụ akụkụ kacha mma, ebe ọ bụ na nke ahụ bụ nghọta nwere ike ịdị ma ọ bụghị nke a ga-amanye.
- source_word: ὁ πατριάρχης
  choice: bụ́ nna nna ahụ
  rationale: Ọ na-emesi ọnọdụ Ebreham ike dịka nna ochie nke ndị ahụ; ‘nna nna’ bụ okwu Igbo dị mfe ma dị ùgwù.
theological_decisions:
- issue: Onye amaokwu ahụ na-ekwu maka ya na ihe ‘ịdị ukwuu’ pụtara
  choice: Amaokwu ahụ na-egosi ịdị ukwuu Melkizedek site n’ikwu na Ebreham, bụ́ nna nna ahụ, nyere ya otu ụzọ n’ụzọ iri.
  alternative: A pụrụ ịkọwa ya n’ụzọ na-ekwusi ike karị na onye natara otu ụzọ n’ụzọ iri karịrị Ebreham n’ọkwa.
  rationale: Grik na-eji ihe Ebreham mere gosi ịdị ukwuu Melkizedek, ma isi okwu ekwesịghị ịkọwa n’ihu ihe arụmụka gbara ya gburugburu ga-eme ka o doo anya.
translation_notes:
  register: Asụsụ Igbo Ọha zuru oke, nke dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘Chegodị’ mee ka oku ịtụgharị uche doo anya; e zere ‘ugbu a’ n’isi ahịrịokwu n’ihi na isi mmalite enweghị okwu oge kpọmkwem.
