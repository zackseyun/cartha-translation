id: HEB.7.25
reference: Hebrews 7:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: ig
  text: N’ihi ya, o nwekwara ike ịzọpụta kpamkpam ndị na-abịaru Chineke nso site na ya,[a] ebe ọ bụ na ọ dị ndụ mgbe niile ịrịọchitere ha arịrịọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịzọpụta ruo mgbe ebighị ebi”; n’ụzọ ọdịnala, “ịzọpụta ruo n’ókè kachasị elu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’ihe e kwuru banyere ọkwa nchụàjà Jizọs nke na-adịgide adịgide.
- source_word: καὶ
  choice: nwekwara
  rationale: 'Na-echekwa echiche mgbakwunye ahụ: n’ihi na ọkwa nchụàjà ya na-adịgide, o nwekwara ike ịzọpụta.'
- source_word: σῴζειν
  choice: ịzọpụta
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọwa nzọpụta, ma na-echekwa ịdị arọ nke okwu ahụ n’ihe gbasara okwukwe.
- source_word: εἰς τὸ παντελές
  choice: kpamkpam
  rationale: Na-ebute echiche nke nzọpụta zuru oke n’ebughị ụzọ kpebie na naanị ogologo oge ka okwu ahụ na-ekwu; e debere echiche 'ruo mgbe ebighị ebi' n’ala peeji.
- source_word: δύναται
  choice: o ... ike
  rationale: Na-egosi ikike ya nke gbadoro ụkwụ n’ọkwa nchụàjà ya na-adịgide adịgide.
- source_word: τοὺς προσερχομένους
  choice: ndị ... abịaru ... nso
  rationale: Na-echekwa echiche pụrụ iche dị n’akwụkwọ Ndị Hibru banyere ịbịaru Chineke nso maka ofufe na mmekọrịta.
- source_word: δι’ αὐτοῦ
  choice: na-esite n’aka ya
  rationale: Na-egosi na ọ bụ ya bụ onye ogbugbo ndị mmadụ ji abịaru Chineke nso.
- source_word: τῷ θεῷ
  choice: Chineke
  rationale: Ya na 'abịaru ... nso' na-enye okwu Igbo doro anya nke pụtara ịbịaru Chineke nso.
- source_word: πάντοτε ζῶν
  choice: ebe ọ bụ na ọ dị ndụ mgbe niile
  rationale: Na-eme ka ihe kpatara ikike nzọpụta ya pụta ìhè, ma na-echekwa echiche nke ndụ ya na-aga n’ihu mgbe niile.
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: ịrịọchitere ... arịrịọ
  rationale: Na-egosi ọrụ ya na-aga n’ihu nke ịrịọchitere ndị ahụ arịrịọ n’ihu Chineke.
- source_word: ὑπὲρ αὐτῶν
  choice: ha
  rationale: N’ime 'ịrịọchitere ha arịrịọ,' ọ na-egosi na ọ na-eme ya maka ọdịmma ha na n’aha ha.
theological_decisions:
- issue: Ogologo nghọta εἰς τὸ παντελές
  choice: A sụgharịrị ya 'kpamkpam' n’ahịrị bụ isi.
  alternative: “ruo mgbe ebighị ebi”; n’ụzọ ọdịnala, “ruo n’ókè kasị elu.”
  rationale: Akpaokwu ahụ nwere ike igosi izu oke ma ọ bụ ịdịgide ruo mgbe niile. Ihe gbara ya gburugburu na-akwado nzọpụta zuru oke na ike ya nke na-adịgide, n’ihi na Kraịst na-adị ndụ mgbe niile. Ya mere, ahịrị bụ isi na-eji 'kpamkpam,' ebe nkọwa ala peeji na-echekwa nghọta oge na ntụgharị ọdịnala.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ 'abịaru Chineke nso' iji chekwaa asụsụ ofufe na nnweta Chineke nke na-apụta ugboro ugboro n’akwụkwọ Ndị Hibru; e jiri 'na-esite n’aka ya' gosipụta ọrụ onye ogbugbo.
