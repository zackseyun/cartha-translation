- from: N’ihi ya, o nwekwara ike ịzọpụta kpamkpam ndị na-esite n’aka ya abịaru Chineke nso,[a] ebe ọ bụ na ọ dị ndụ mgbe niile ịrịọchitere ha arịrịọ.
  to: N’ihi ya, o nwekwara ike ịzọpụta kpamkpam ndị na-abịaru Chineke nso site na ya,[a] ebe ọ bụ na ọ dị ndụ mgbe niile ịrịọchitere ha arịrịọ.
  rationale: The sole revision makes the mediatorial phrase δι’ αὐτοῦ explicit and idiomatic in Standard Igbo. The main rendering “kpamkpam” retains the comprehensive sense of εἰς τὸ παντελές, while the footnote preserves its possible temporal sense and the traditional rendering. No doctrinal interpretation has been added.
