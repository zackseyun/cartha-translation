revisions:
- from: A sị na a na-enweta izu okè site n’ọrụ nchụàjà nke ndị Livaị—n’ihi na ọ bụ n’elu ntọala ọrụ ahụ ka e nyere ndị mmadụ Iwu[a]—gịnị ọzọ mere o ji dị mkpa ka onye nchụàjà ọzọ bilie dịka usoro Melkizedek si dị, kama ka a kpọọ ya onye nchụàjà dịka usoro Erọn si dị?[b]
  to: Ọ bụrụ na e si n’ọrụ nchụàjà ndị Livaị enweta izu okè—n’ihi na ọ bụ n’ihi ya ka e nyere ndị mmadụ Iwu[a]—gịnịkwa ọzọ ga-adị mkpa ka onye nchụàjà ọzọ bilie n’usoro Melkizedek, ma a ghara ịkpọ ya onye nchụàjà nke usoro Erọn?[b]
  rationale: Ndozigharị ahụ na-edozi njikọ na-adịghị mma nke “kama” na καὶ οὐ, na-eme ka ahịrịokwu ahụ bụrụ Igbo nkịtị, ma na-edobe ihe ajụjụ Grik ahụ pụtara, aha ndị ahụ, na ọdịiche dị n’etiti usoro Melkizedek na nke Erọn. Ihe odide ala a ka na-adabara akara [a] na [b] dị n’ahịrịokwu.
