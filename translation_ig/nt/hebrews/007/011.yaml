id: HEB.7.11
reference: Hebrews 7:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: ig
  text: Ọ bụrụ na e si n’ọrụ nchụàjà ndị Livaị enweta izu okè—n’ihi na ọ bụ n’ihi ya ka e nyere ndị mmadụ Iwu[a]—gịnịkwa ọzọ ga-adị mkpa ka onye nchụàjà ọzọ bilie n’usoro Melkizedek, ma a ghara ịkpọ ya onye nchụàjà nke usoro Erọn?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi na ọ bụ n’okpuru ya ka e nyere ndị mmadụ Iwu.” Okwu Grik ahụ na-egosi na usoro Iwu Izrel dabere n’ọrụ nchụàjà ndị Livaị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka onye nchụàjà ọzọ bilie n’usoro Melkizedek, ma a ghara ịkpọ ya onye nchụàjà nke usoro Erọn.”
    reason: alternative_reading
lexical_decisions:
- source_word: τελείωσις
  choice: izu okè
  rationale: 'Nke a na-edobe ịdị arọ nke okwu ahụ n’arụmụka Hibru: iru ọnọdụ Chineke zubere, ọ bụghị naanị imezi omume ma ọ bụ imecha ihe.'
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: site n’ọrụ nchụàjà nke ndị Livaị
  rationale: “Site na” na-egosi ụzọ ma ọ bụ ihe e ji enweta ihe; nkọwa “ọrụ nchụàjà nke ndị Livaị” doro onye Igbo nke oge a anya.
- source_word: ἐπ’ αὐτῆς
  choice: n’elu ntọala ọrụ ahụ
  rationale: Nnọchiaha nwanyị ahụ yikarịrị ka ọ na-ezo aka n’ọrụ nchụàjà nke ndị Livaị, ebe nkebi a na-akọwa ntọala usoro Iwu ahụ.
- source_word: νενομοθέτηται
  choice: e nyere ndị mmadụ Iwu
  rationale: Nke a na-egosipụta ọnọdụ e tinyere ndị ahụ n’okpuru Iwu, ma na-asụ Igbo dị mfe karịa nsụgharị mkpụrụokwu n’otu n’otu.
- source_word: τίς ἔτι χρεία
  choice: gịnị ọzọ mere o ji dị mkpa
  rationale: Ọ na-echekwa ike ajụjụ arụmụka banyere mkpa ka fọdụrụ.
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: dịka usoro Melkizedek si dị
  rationale: “Usoro” na-eburu echiche nke τάξις dị ka nhazi, ụdị, ma ọ bụ ọkwa e nyere.
- source_word: ἕτερον ... ἱερέα
  choice: onye nchụàjà ọzọ
  rationale: Ọ bụ okwu Igbo nkịtị nke na-ahapụ ọdịiche ya na usoro Erọn ka nkebi na-esochi kọwaa.
- source_word: ἀνίστασθαι
  choice: bilie
  rationale: Ọ na-echekwa okwu ihe e dere ma na-egosi mpụta ma ọ bụ ịtọlite onye nchụàjà ahụ, n’ebughị ụzọ kpebie na ọ na-ekwu kpọmkwem banyere mbilite n’ọnwụ.
- source_word: καὶ οὐ ... λέγεσθαι
  choice: kama ka a kpọọ ya onye nchụàjà dịka usoro Erọn si dị
  rationale: N’ebe a λέγεσθαι metụtara otú e si akpọ ma ọ bụ kọwaa onye nchụàjà ahụ; “ka a kpọọ ya” bụ Igbo nkịtị ma na-echekwa ọdịiche nke nhazi abụọ ahụ.
- source_word: Μελχισέδεκ / Ἀαρών
  choice: Melkizedek / Erọn
  rationale: E dere aha ndị ahụ n’ụdị a na-amakarị na nsụgharị Akwụkwọ Nsọ Igbo.
theological_decisions:
- issue: Ihe τελείωσις pụtara n’arụmụka Hibru banyere ọrụ nchụàjà
  choice: izu okè
  alternative: mmezu; ohere zuru ezu ịbịaru Chineke nso
  rationale: “Izu okè” na-ahapụ okwu ahụ ka ihe ndị gbara ya gburugburu kọwaa ịdị arọ ya n’usoro ofufe na nzọpụta, n’ebelataghị ya ka ọ bụrụ naanị mmezi omume.
- issue: Ihe αὐτῆς na-ezo aka na ἐπ’ αὐτῆς νενομοθέτηται
  choice: ọrụ nchụàjà nke ndị Livaị
  alternative: Iwu ahụ; usoro ọgbụgba ndụ ahụ n’ozuzu ya
  rationale: Aha nwanyị kacha nso nke dabara bụ “ọrụ nchụàjà,” nkebi dị n’etiti ahịrịokwu ahụ na-akọwakwa njikọ dị n’etiti ọrụ ahụ na usoro Iwu e nyere ndị mmadụ.
- issue: Otu e si aghọta λέγεσθαι na ntụnyere usoro Melkizedek na nke Erọn
  choice: ka a kpọọ ya onye nchụàjà dịka usoro Erọn si dị
  alternative: ka e kwuo banyere ya dịka onye nọ n’usoro Erọn
  rationale: Nhọrọ ahụ na-asụ Igbo nke ọma ma na-ahapụ okwu ahụ ka ọ metụta ịkpọ aha ma ọ bụ ịkọwa nhazi onye nchụàjà ahụ, n’etinyeghị ozizi pụrụ iche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara ajụjụ arụmụka nke amaokwu ahụ, tinyere esemokwu dị n’etiti ọrụ nchụàjà ndị Livaị na mkpa onye nchụàjà ọzọ.
