revisions:
- from: onye ghọrọ onye nchụaja dị otu a, ọ bụghị n’ihi iwu nke ihe e nyere n’iwu banyere anụ ahụ chọrọ[a], kama n’ihi ike nke ndụ a na-apụghị ibibi ebibi[b].
  to: onye ghọrọ onye nchụaja dị otu a, ọ bụghị dịka iwu nke iwu e nyere gbasara anụ ahụ[a], kama dịka ike nke ndụ a na-apụghị ibibi[b].
  rationale: The revision preserves the Greek κατά…κατά antithesis with “dịka…dịka,” replaces an unclear expression with an intelligible rendering of the nested genitive construction, and retains the non-moral, bodily sense of σαρκίνης. It also keeps the footnote anchors aligned with the two alternatives actually represented in the Igbo text.
