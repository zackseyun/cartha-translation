lexical_decisions:
- source_word: ὃς
  choice: onye
  rationale: Nnọchiaha njikọ a na-ezo aka n’onye a kpọtụrụ aha n’amaokwu bu ụzọ ma na-edobe njikọ ahịrịokwu ahụ.
- source_word: κατὰ νόμον
  choice: n’ihi iwu
  rationale: κατά na accusative ebe a na-egosi ntọala ma ọ bụ ihe e ji eme ihe; ‘n’ihi’ na-eme ka echiche ahụ doo anya n’Igbo, ebe ‘iwu’ na-edobe νόμος n’enweghị ime ya kpọmkwem Iwu Mosis.
- source_word: ἐντολῆς σαρκίνης
  choice: nke ihe e nyere n’iwu banyere anụ ahụ chọrọ
  rationale: ‘Ihe e nyere n’iwu’ na-anọchi ἐντολή, ebe ‘banyere anụ ahụ’ na-egosi iru eru nke metụtara ahụ na usoro ọmụmụ, ọ bụghị mmehie ma ọ bụ ‘ọdịdị mmehie.’
- source_word: γέγονεν
  choice: ghọrọ onye nchụaja dị otu a
  rationale: Perfect ahụ na-egosi ọnọdụ dị ugbu a sitere n’ihe mere; ‘onye nchụaja’ bụ ihe a hapụrụ n’ahịrịokwu Grik mana ihe gbara ya gburugburu na-egosi ya, ya mere etinyere ya ka Igbo bụrụ nke doro anya ma dị ndụ.
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: kama n’ihi ike
  rationale: Nke a na-edobe ọdịiche siri ike na nkebi nke mbụ ma na-egosi ike ahụ dịka ntọala nke ịbụ onye nchụaja.
- source_word: ζωῆς ἀκαταλύτου
  choice: ndụ a na-apụghị ibibi ebibi
  rationale: ἀκατάλυτος pụtara ihe a na-apụghị ịtọsa, ibibi, ma ọ bụ kwụsị; nsụgharị a na-edobe echiche nke ndụ a na-apụghị imeri emeri karịa nanị ogologo oge ya.
theological_decisions:
- issue: Ihe σαρκίνης pụtara n’ebe a
  choice: banyere anụ ahụ
  alternative: nke anụ ahụ; banyere ihe gbasara ahụ mmadụ
  rationale: Ọ na-ezo aka n’ihe a na-ahụ anya, nke ahụ na usoro ọmụmụ metụtara, ma ọ bụghị omume mmehie. Nke a na-edobe ọdịiche ya na ndụ a na-apụghị ibibi ebibi n’etinyeghị echiche na-adịghị n’ihe odide ahụ.
- issue: Nsụgharị ἀκαταλύτου
  choice: a na-apụghị ibibi ebibi
  alternative: na-enweghị ọgwụgwụ
  rationale: Nhọrọ bụ isi na-egosi ma enweghị ike ibibi ndụ ahụ ma enweghị ike iweta ya na njedebe; nhọrọ ọdịnala nke na-elekwasị anya n’enweghị ọgwụgwụ ka e debere n’okpuru amaokwu.
- issue: Ihe γέγονεν na-ekwu na e nweghị kpọmkwem n’ahịrịokwu ahụ
  choice: ghọrọ onye nchụaja dị otu a
  alternative: ghọrọ dị otu a
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ ịbụ onye nchụaja ka a na-ekwu; itinye ya na-eme ka Igbo doo anya n’agbanyeghị na Grik hapụrụ aha ahụ ka onye na-agụ ya ghọta ya site n’ihe bu ụzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta, dee ya. E zere iji ‘anụ ahụ’ mee ka ọ pụta ‘ọdịdị mmehie’; ebe a ọ na-ekwu maka ihe metụtara ahụ na usoro ọmụmụ. Akara nkọwa [a] na [b] dị n’ahịrịokwu isi.
