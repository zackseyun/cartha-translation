  text: ὃς οὐ κατὰ νόμον ἐντολῆς ⸀σαρκίνης γέγονεν ἀλλὰ κατὰ δύναμιν ζωῆς ἀκαταλύτου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/016.yaml
  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: ig
  text: onye ghọrọ onye nchụaja dị otu a, ọ bụghị dịka iwu nke iwu e nyere gbasara anụ ahụ[a], kama dịka ike nke ndụ a na-apụghị ibibi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe anụ ahụ chọrọ” ma ọ bụ “iwu e nyere gbasara ahụ mmadụ.”
    reason: lexical_alternative
  - marker: b
    text: Nsụgharị ọdịnala bụ “ndụ na-enweghị ọgwụgwụ.”
