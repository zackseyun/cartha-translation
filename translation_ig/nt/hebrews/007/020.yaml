  text: And inasmuch as this was not without an oath (for they indeed have become priests without an oath,[a]
translation:
  language: ig
  text: Ma, ebe ọ bụ na e meghị nke a n’enweghị iyi (n’ihi na ha ghọrọ ndị nchụàjà n’enweghị iyi,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụghị ewezuga iyi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Ọzọkwa
  rationale: Njikọ a na-aga n’ihu n’arụmụka amaokwu ndị bu ụzọ; “Ọzọkwa” na-egosi njikọ ahụ n’Igbo doro anya.
- source_word: καθ’ ὅσον
  choice: ebe ọ bụ na
  rationale: N’ebe a akpaalaokwu ahụ na-ewebata ihe a ga-eji kwado arụmụka; nsụgharị a bụ Igbo ebumpụta ụwa ma na-edobe ike nke ihe kpatara ya.
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: e meghị nke a n’enweghị iyi
  rationale: Ọ na-edobe nkwusioru ike nke οὐ χωρὶς ma na-eme ka ihe e zoro aka na ya—ime ka ọ bụrụ onye nchụàjà—pụta nke ọma n’Igbo n’agbanyeghị na Grik hapụrụ ya ka okwu ndị gbara ya gburugburu kọwaa ya.
- source_word: ὁρκωμοσίας
  choice: iyi
  rationale: “Iyi” bụ okwu Igbo dị nkenke na nke nkịtị maka iyi e ji okwu siri ike kwado.
- source_word: οἱ μὲν γὰρ
  choice: n’ihi na ndị nke ọzọ
  rationale: “N’ihi na” na-ebute nkọwa γάρ; “ndị nke ọzọ” na-egosi ìgwè mbụ a na-atụnyere onye a ga-ekwu maka ya n’amaokwu na-esote, n’enweghị itinye nkọwa ozizi ọzọ.
- source_word: χωρὶς ὁρκωμοσίας
  choice: n’enweghị iyi
  rationale: E ji otu okwu ahụ sụgharịa nkwughachi ahụ iji chekwaa njikọ na ntụnyere dị n’amaokwu ahụ.
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: ghọrọ ndị nchụàjà
  rationale: Nke a na-egosi na ha banyere n’ọkwa nchụàjà, ma bụrụkwa ụzọ Igbo dị mfe ma kwekọọ na periphrastic perfect nke Grik.
theological_decisions:
- issue: Ndị a na-atụnyere n’ihe gbasara iyi
  choice: E debere ntụnyere n’etiti ndị nchụàjà mbụ, bụ́ ndị ghọrọ ndị nchụàjà n’enweghị iyi, na onye e mere nchụàjà site n’iyi nke a ga-akọwa n’amaokwu na-esote.
  alternative: Ịkpọ ha kpọmkwem ndị nchụàjà Livaị ma kọwaa ozizi sara mbara banyere ọgbụgba ndụ ochie na nke ọhụrụ.
  rationale: Ọnọdụ okwu ahụ na-egosi ndị nchụàjà Livaị, ma amaokwu a n’onwe ya hapụrụ njirimara ha n’ụzọ mkpirikpi ma kwụsị tupu akụkụ nke abụọ nke ntụnyere ahụ. Ya mere, a naghị ebubata nkwubi okwu karịrị ihe Grik kwuru.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E chekwara akara mmeghe nke nkebi okwu n’ihi na amaokwu ahụ na-aga n’ihu ruo amaokwu 21; akara [a] dị n’ahụ isiokwu dịka achọrọ.
