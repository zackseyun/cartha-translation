id: HEB.7.5
reference: Hebrews 7:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: ig
  text: N’ezie, ndị ahụ sitere n’etiti ụmụ Livaị, bú ndị na-anata ọrụ nchụàjà, nwere iwu, dịka Iwu ahụ si dị, ka ha nakọta otu ụzọ n’ime iri n’aka ndị mmadụ—ya bụ, n’aka ụmụnne ha[a]—ọ bụ ezie na ụmụnne ha ndị ahụ sikwa n’úkwù Ebreham pụta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Izrel ibe ha.” Okwu Grik ahụ pụtara “ụmụnne ha,” jiri asụsụ mmekọrịta ezinụlọ kpọọ ndị ha na ha so n’otu ndị Izrel.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “sitere n’agbụrụ Ebreham.” N’ụzọ nkịtị, “sikwa n’úkwù Ebreham pụta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: ndị ahụ sitere n’etiti ụmụ Livaị
  rationale: '“Sitere n’etiti” na-echekwa echiche nkewa nke ἐκ: ọ bụghị ụmụ Livaị niile, kama ndị si n’agbụrụ ahụ a họpụtara maka ọrụ nchụàjà.'
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: ndị na-anata ọrụ nchụàjà
  rationale: “Na-anata” na-egosi na e nyere ha ọrụ ahụ, ọ bụghị na ha ji aka ha were ya; “ọrụ nchụàjà” bụ okwu Igbo doro anya maka ἱερατεία.
- source_word: ἐντολὴν ἔχουσιν
  choice: nwere iwu
  rationale: Nke a na-echekwa nhazi aha nke Grik na ikike iwu nke ἐντολή.
- source_word: ἀποδεκατοῦν τὸν λαὸν
  choice: ịnakọta otu ụzọ n’ụzọ iri n’aka ndị mmadụ
  rationale: Ngwaa Grik pụtara ịnara ma ọ bụ ịnakọta otu ụzọ n’ụzọ iri n’aka ndị ọzọ, ọ bụghị inye ya.
- source_word: κατὰ τὸν νόμον
  choice: dị ka Iwu ahụ si dị
  rationale: Nke a na-egosi ụkpụrụ iwu ahụ ma na-eme ka Iwu Mosis pụta ìhè site n’iji mkpụrụedemede ukwu dee “Iwu.”
- source_word: τοὺς ἀδελφοὺς αὐτῶν
  choice: ụmụnne ha
  rationale: “Ụmụnne” na-echekwa asụsụ mmekọrịta ezinụlọ, ma n’ebe a ọ gbasakwara ndị Izrel ibe ha.
- source_word: καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: ọ bụ ezie na ụmụnne ha ndị ahụ sikwa n’úkwù Ebreham pụta
  rationale: A hapụrụ okwu ahụ́ “n’úkwù Ebreham” iji chekwaa ike ihe atụ banyere agbụrụ anụ ahụ. “Ụmụnne ha ndị ahụ” na-egosi njikọ ụtọasụsụ nke participle ahụ na τοὺς ἀδελφούς.
theological_decisions:
- issue: Asụsụ mmekọrịta ezinụlọ nke na-anọchi anya ndị Izrel
  choice: ụmụnne ha
  alternative: ndị Izrel ibe ha
  rationale: Okwu Grik bụ ἀδελφούς, ya mere isiokwu ahụ na-echekwa asụsụ ezinụlọ; nkọwa ala peeji na-akọwa ndị ọ na-ezo aka na ha n’ozuzu.
- issue: Ịhapụ ihe atụ ahụ́ banyere usoro ọmụmụ
  choice: sikwa n’úkwù Ebreham pụta
  alternative: sikwa n’agbụrụ Ebreham
  rationale: Arụmụka nke Hibru 7 na-adabere n’otu usoro ọmụmụ ha si n’Ebreham; ide “úkwù” na-echekwa ihe atụ doro anya nke Grik n’enweghị ịgbaze ya.
- issue: Onye nkebi concessive ahụ na-akọwa
  choice: ụmụnne ha ndị ahụ
  alternative: ha onwe ha
  rationale: Na Grik, ἐξεληλυθότας dị n’accusative plural ma kwekọọ na τοὺς ἀδελφούς, ya mere e mere njikọ ahụ ka ọ doo anya n’Igbo.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta mee ihe. E debere “Iwu” na mkpụrụedemede ukwu iji gosi Iwu Mosis, ma chekwaa okwu ezinụlọ na ihe atụ ahụ́ dị n’ọrụ Grik.
