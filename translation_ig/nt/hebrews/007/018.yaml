id: HEB.7.18
reference: Hebrews 7:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀθέτησις μὲν γὰρ γίνεται προαγούσης ἐντολῆς διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/018.yaml
  text: For there is indeed a setting aside of the former commandment because of its weakness and uselessness[b][a],
translation:
  language: ig
  text: N’ihi na a na-ewepụ iwu gara aga[a] n’ihi adịghị ike ya na enweghị uru ọ bara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “iwu bu ya ụzọ,” ma ọ bụ “iwu nke dị na mbụ.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ọ naghị eweta izu oke a na-ekwu maka ya n’amaokwu ndị gbara ya gburugburu (lee Hibru 7:19); nke a apụtaghị na mkpughe Chineke nyere na mbụ bụ ihe ọjọọ n’onwe ya.
    reason: cross_reference
lexical_decisions:
- source_word: ἀθέτησις
  choice: a na-ewepụ
  rationale: Nke a na-egosi ịkagbu ma ọ bụ iwepụ ike iwu ahụ nwere, n’asụsụ Igbo doro anya nke na-adịghị ada ka okwu iwu siri ike.
- source_word: μὲν γὰρ
  choice: N’ihi na, n’ezie
  rationale: “N’ihi na” na-egosi nkọwa ihe e kwuru tupu ya, ebe “n’ezie” na-echekwa nkwusi ike nke μέν ma na-atụ anya ọdịiche ga-apụta n’amaokwu na-esote.
- source_word: γίνεται
  choice: a na-
  rationale: 'A sụgharịrị echiche ịdị adị ma ọ bụ ihe na-eme n’ụdị ahịrịokwu Igbo ebumpụta ụwa: “a na-ewepụ.”'
- source_word: προαγούσης ἐντολῆς
  choice: iwu nke bu ụzọ
  rationale: Nke a na-echekwa echiche iwu gara n’ihu ma ọ bụ nke dị tupu nke ọzọ, na-enweghị ịgbakwunye nkọwa karịrị ihe Grik kwuru.
- source_word: ἀσθενές
  choice: adịghị ike
  rationale: Ọ na-egosi enweghị ike imezu nzube a na-atụle, ma na-echekwa okwu siri ike nke ederede ahụ.
- source_word: ἀνωφελές
  choice: abaghị uru
  rationale: Ọ bụ okwu Igbo a na-aghọta ngwa ngwa maka ihe na-adịghị eweta uru ma ọ bụ ihe a chọrọ; ihe gbara ya gburugburu na-akọwa na ọ bụ enweghị irè n’iwebata izu oke.
theological_decisions:
- issue: Ókè nkatọ a katọrọ “iwu nke bu ụzọ”
  choice: E chekwara okwu siri ike banyere adịghị ike na abaghị uru ya n’ihe gbasara nzube nke izu oke na ọrụ nchụàjà a na-atụle.
  alternative: Ịsị na iwu Mosis dum bụ ihe ọjọọ ma ọ bụ ihe na-abaghị uru n’ụzọ ọ bụla; ma ọ bụ ime ka nkatọ ahụ dị nro nke na ọ naghịzi ekwu ihe siri ike.
  rationale: Ihe gbara amaokwu ahụ gburugburu, karịchaa Hibru 7:11 na 7:19, na-ekwu maka enweghị ike nke usoro nchụàjà mbụ iweta izu oke. Ya mere, nsụgharị ahụ anaghị eme ka okwu ahụ dị nro, ma nkọwa ala peeji na-egbochi ịgbasa ya karịa ihe gbara ya gburugburu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “A na-ewepụ” na-enye echiche ịkagbu ike iwu ahụ n’enweghị okwu iwu dị mgbagwoju anya; “adịghị ike ya na abaghị uru ya” na-echekwa nkwuwa okwu na esemokwu nkà mmụta okpukpe dị na Grik.
