    reason: alternative_reading
  revision_rationale: The revision retains the Greek comparative and perfect aspect, removes the unneeded additive, and uses an idiomatic Igbo expression for Jesus as the personal guarantor who ensures fulfillment of the better covenant. The footnote is also revised to distinguish a will/testament from a general inheritance document.
