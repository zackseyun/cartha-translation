  text: κατὰ ⸀τοσοῦτο ⸀κρείττονος διαθήκης γέγονεν ἔγγυος Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/022.yaml
  text: By so much[a], Jesus has become the guarantor of a better covenant.
translation:
  language: ig
  text: Ruo n’ókè a, Jizọs aghọọla onye na-ahụ na ọgbụgba ndụ[a] ka mma ga-emezu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “akwụkwọ ikpeazụ banyere nketa.” Okwu Grik ahụ nwere ike ịpụta “ọgbụgba ndụ” ma ọ bụ, n’ọnọdụ ụfọdụ, akwụkwọ ikpeazụ nke mmadụ na-ahapụ banyere nketa; n’ebe a, “ọgbụgba ndụ” dabara nke ọma n’arụmụka banyere ọkwa nchụaja na iyi.
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ τοσοῦτο
  choice: Ọ bụkwa ruo n’ókè a ka
  rationale: Usoro a na-egosi ókè ma ọ bụ ịdị ukwuu nke ntụnyere ahụ, ma jikọta amaokwu a na arụmụka banyere iyi dị n’amaokwu bu ya ụzọ.
- source_word: κρείττονος
  choice: ka mma
  rationale: Nke a na-echekwa ntụnyere dị n’okwu Grik ma kwekọọ n’otu akwụkwọ Ndị Hibru si eji okwu a ugboro ugboro.
- source_word: διαθήκης
  choice: ọgbụgba ndụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’usoro mmekọrịta Chineke guzobere, nke dabara n’arụmụka banyere ọkwa nchụaja na iyi karịa echiche nke akwụkwọ nketa.
- source_word: γέγονεν
  choice: aghọọla
  rationale: Ụdị ngwaa zuru oke a na-egosi ihe mezuru emezu nke ọnọdụ ya ka na-adịgide ruo ugbu a.
- source_word: ἔγγυος
  choice: onye na-ekwe nkwa mmezu
  rationale: Nke a na-egosi onye ji onwe ya hụ na a ga-emezu ihe e kwere, n’asụsụ Igbo doro ndị mmadụ anya.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Nke a bụ ụdị aha ahụ a na-ejikarị eme ihe n’Igbo ọkọlọtọ.
theological_decisions:
- issue: Ihe διαθήκη pụtara na Ndị Hibru 7:22
  choice: ọgbụgba ndụ
  alternative: akwụkwọ nketa / ọgbụgba nke onye nwụrụ anwụ
  rationale: Ọ bụ ezie na okwu Grik ahụ nwere ike ịpụta akwụkwọ nketa n’ọnọdụ ụfọdụ, ihe a na-ekwu ebe a banyere ọkwa nchụaja na iyi na-akwado ‘ọgbụgba ndụ,’ n’emeghị ka nghọta nke akwụkwọ nketa bata n’arụmụka a tupu oge ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma doo anya. E ji ‘onye na-ekwe nkwa mmezu’ kọwaa ọrụ onye na-ahụ na ihe e kwere ga-emezu, kama iji okwu iwu siri ike ma ọ bụ nke ochie.
