  text: Καὶ περισσότερον ἔτι κατάδηλόν ἐστιν, εἰ κατὰ τὴν ὁμοιότητα Μελχισέδεκ ἀνίσταται ἱερεὺς ἕτερος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/015.yaml
  text: And it is even more evident[a], if another priest arises according to the likeness of Melchizedek[b],
translation:
  language: ig
  text: Ọ pụtakwara ìhè karị, ma ọ bụrụ na onye nchụaja ọzọ[a] apụta n’ịdị ka Melkizedek[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye nchụaja dị iche.” Okwu Grik ἕτερος nwere ike imesi ike na onye ahụ dị iche, ọ bụghị naanị na ọ bụ onye ọzọ agbakwunyere.
    reason: lexical_alternative
  - marker: b
    text: Nkebiokwu a, “n’ịdị ka Melkizedek,” na-echetara okwu na arụmụka sitere n’Abụ Ọma 110:4 e ji mee ihe n’isiakwụkwọ a.
    reason: cross_reference
lexical_decisions:
- source_word: περισσότερον ἔτι
  choice: ọbụna karịa
  rationale: Nkebiokwu a na-eme ka ihe a na-ekwu sikwuo ike, na-egosi na ọ pụtara ìhè karịa ka e kwuburu.
- source_word: κατάδηλόν
  choice: pụtara ìhè
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo na ihe bụ ihe a pụrụ ịhụ ma ọ bụ ghọta nke ọma.
- source_word: εἰ
  choice: ma ọ bụrụ na
  rationale: Nke a na-edobe ọdịdị nkebiokwu ọnọdụ dị na Grik, kama ịgbanwe ya ka ọ bụrụ ‘ebe ọ bụ na.’
- source_word: κατὰ τὴν ὁμοιότητα
  choice: n’oyiyi
  rationale: ‘N’oyiyi’ na-edobe echiche nke ịdị ka mmadụ, n’ejikọtaghị ya na okwu ‘usoro’ e ji sụgharịa τάξις n’ebe ndị ọzọ.
- source_word: Μελχισέδεκ
  choice: Melkizedek
  rationale: A sụgharịghị aha onye a; e dere ya n’ụdị dabara n’usoro mkpọpụta na ide aha n’Igbo.
- source_word: ἀνίσταται
  choice: ebilie
  rationale: Okwu a na-egosi na onye nchụaja ahụ bilitere ma ọ bụ pụta, n’etinyeghị echiche mbilite n’ọnwụ n’amaokwu a.
- source_word: ἱερεὺς ἕτερος
  choice: onye nchụaja ọzọ
  rationale: Nke a bụ okwu Igbo nkịtị ma na-edobe na ọ bụ onye nchụaja ọzọ; ihe nwere ike ịbụ echiche nke onye dị iche ka e tinyere n’okpuru ala.
theological_decisions:
- issue: Ihe ἕτερος pụtara banyere onye nchụaja ahụ
  choice: onye nchụaja ọzọ
  alternative: onye nchụaja dị iche
  rationale: ‘Onye nchụaja ọzọ’ bụ okwu Igbo e ji ekwu ya nke ọma ma ghara ịgbakwunye nkọwa karịrị ihe Grik kwuru. Ma n’ihi na ἕτερος nwekwara ike imesi ọdịiche ike, e debere nhọrọ ahụ n’okpuru ala.
- issue: Njikọ ya na Abụ Ọma 110:4
  choice: n’oyiyi Melkizedek
  alternative: dị ka Melkizedek
  rationale: A hapụrụ ‘oyiyi’ ka ọ chekwaa okwu ὁμοιότητα na arụmụka Hibru, ma ghara ịgwakọta ya na okwu τάξις, ‘usoro,’ nke dị n’Abụ Ọma 110:4 na ebe ndị ọzọ n’isiakwụkwọ a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘onye nchụaja’ maka ἱερεύς, ‘pụtara ìhè’ maka κατάδηλος, na ‘n’oyiyi’ iji chekwaa ọdịiche dị n’etiti ‘oyiyi’ na ‘usoro.’ Rịkọm dị n’ọgwụgwụ na-egosi na amaokwu a na-aga n’ihu n’ahịrịokwu na-esote.
