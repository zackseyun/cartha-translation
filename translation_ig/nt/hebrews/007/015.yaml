revisions:
- from: Ọ pụtakwara ìhè ọbụna karịa, ma ọ bụrụ na onye nchụaja ọzọ[a] ebilie n’oyiyi Melkizedek[b],
  to: Ọ pụtakwara ìhè karị, ma ọ bụrụ na onye nchụaja ọzọ[a] apụta n’ịdị ka Melkizedek[b],
  rationale: Revised the opening to express the Greek present assertion and comparative force naturally in Igbo. Replaced “n’oyiyi” with “n’ịdị ka” to convey ὁμοιότητα (‘likeness’) without the possible ‘image’ sense, while retaining the distinction from “usoro” (‘order’). “Apụta” naturally expresses the priest’s emergence and does not force a resurrection sense. The final comma is retained because the Greek sentence continues into the following verse.
