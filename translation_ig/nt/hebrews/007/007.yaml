  text: χωρὶς δὲ πάσης ἀντιλογίας τὸ ἔλαττον ὑπὸ τοῦ κρείττονος εὐλογεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/007.yaml
  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: ig
  text: N’enweghị mgbagha ọ bụla[a], onye dị ala na-anata ngọzi n’aka onye ka ya elu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’enweghị arụmụka ọ bụla” ma ọ bụ “n’enweghị ihe ọ bụla a ga-arụrịta ụka banyere ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: N’enweghị arụmụka ọ bụla
  rationale: Nkebi okwu a na-egosi na ihe a na-ekwu enweghị ihe ezi uche dị na ya a ga-eji gọnahụ ma ọ bụ rụrịta ụka megide ya. Nsụgharị a bụ Igbo doro anya ma na-edebe echiche nke χωρὶς na πάσης ἀντιλογίας; a hapụrụ δέ ka njikọ dị nro nke usoro okwu, n’ihi na itinye “ma” ebe a nwere ike ime ka ọdịiche ahụ sie ike karịa ka ọ dị na Grik.
- source_word: τὸ ἔλαττον
  choice: onye dị nta
  rationale: N’ebe a, okwu ntụnyere ahụ na-ezo aka n’onye nọ n’ọkwa dị ala, ọ bụghị onye dị obere n’ahụ ma ọ bụ onye ajọ omume. “Onye dị nta” na-edebe ntụnyere ahụ n’enweghị ịgbakwunye nkọwa ozizi.
- source_word: ὑπὸ τοῦ κρείττονος
  choice: n’aka onye ka ya ukwuu
  rationale: ὑπό ya na genitive na-egosi onye na-eme ihe n’ahịrịokwu passive. “N’aka” na-egosi isi mmalite ma ọ bụ onye na-enye ngọzi, ebe “onye ka ya ukwuu” na-edebe echiche nke ọkwa dị elu.
- source_word: εὐλογεῖται
  choice: na-anata ngọzi
  rationale: Present passive a pụtara na onye ahụ bụ onye a na-agọzi. “Na-anata ngọzi” bụ usoro okwu Igbo dị ndụ ma na-edebe passive ahụ na ihe ngọzi pụtara n’akụkọ Melkizedek na Ebreham.
theological_decisions:
- issue: Ụdị ntụnyere dị n’etiti “onye dị nta” na “onye ka ya ukwuu”
  choice: 'A na-ekwu ụkpụrụ izugbe nke ọkwa: onye nọ n’ọkwa dị ala na-anata ngọzi n’aka onye nọ n’ọkwa dị elu.'
  alternative: Ịghọta ya nanị dị ka omenala mmekọrịta mmadụ na ibe ya nke na-enweghị ibu echiche okpukpe.
  rationale: N’Ebe Ndị Hibru 7, okwu a na-akwado arụmụka banyere ịdị ukwuu Melkizedek karịa Ebreham. Nsụgharị ahụ na-edebe ntụnyere ọkwa ahụ, ma ọ naghị akọwa karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Na-anata ngọzi n’aka” na-ada nke ọma n’Igbo karịa passive kpọmkwem, ma ọ ka na-echekwa onye na-anata ngọzi na onye na-enye ya.
