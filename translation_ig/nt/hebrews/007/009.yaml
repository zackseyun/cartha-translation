translation:
  language: ig
  text: Ọzọkwa, dị ka a pụrụ isi kwuo ya[a], site n'Abraham ọbụna Livayị, onye na-anata otu ụzọ n’ụzọ iri, akwụọla otu ụzọ n’ụzọ iri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka a ga-asị.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, Grik sịrị, “e werela ya otu ụzọ n’ụzọ iri.” Grik ji perfect passive; ntụgharị Igbo ji active mee ka o doo anya na a na-ele Livayị anya dịka onye kwụrụ otu ụzọ n’ụzọ iri site n’Abraham.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἔπος εἰπεῖν
  choice: dị ka a pụrụ isi kwuo ya
  rationale: Ọ bụ akpaalaokwu na-eme ka okwu na-esote ya ghara ịdị ka nkwupụta nkịtị na-enweghị oke; ntụgharị a bụ Igbo dị ugbu a ma na-echekwa nro okwu ahụ.
- source_word: δι’ Ἀβραὰμ
  choice: site n'Abraham
  rationale: διά ya na genitive na-egosi ụzọ ma ọ bụ onye e si n'aka ya mee ihe; ebe a, Livayị sonyere n'omume ahụ site n'Abraham, nna nna ya.
- source_word: καὶ Λευὶ
  choice: ọbụna Livayị
  rationale: καί nwere ike nkwusi ike ebe a, na-egosi ihe ijuanya na arụmụka ahụ ruru Livayị kwa.
- source_word: ὁ δεκάτας λαμβάνων
  choice: onye na-anata otu ụzọ n'ụzọ iri
  rationale: Participial present ahụ na-akọwa ọrụ Livayị dị ka onye na-anata onyinye otu ụzọ n'ụzọ iri mgbe niile.
- source_word: δεκάτας
  choice: otu ụzọ n'ụzọ iri
  rationale: Nke a bụ okwu Igbo doro anya maka ihe e nyere nke hà otu n'ime ụzọ iri; ọ dabara n'ọnọdụ okpukpe na akụnụba a.
- source_word: δεδεκάτωται
  choice: kwụkwara otu ụzọ n'ụzọ iri
  rationale: Perfect passive Grik ahụ bụ okwu a pịkọtara ọnụ nke pụtara na a na-ele Livayị anya dị ka onye kwụrụ otu ụzọ n'ụzọ iri site n'Abraham. Igbo active a na-eme ka echiche onye nyere ya doo anya, ebe nkọwa ala peeji na-echekwa ọdịdị passive nke Grik.
theological_decisions:
- issue: Livayị isonye n'omume Abraham dịka nwa sitere n'agbụrụ ya
  choice: A na-ekwu na Livayị kwụrụ otu ụzọ n'ụzọ iri site n'Abraham, ma okwu nro ahụ egbochighị ka a were ya dị ka omume Livayị mere n'onwe ya n'oge ahụ.
  alternative: A pụrụ ịkọwa ya kpọmkwem dịka njikọ agbụrụ ma ọ bụ naanị dịka ihe atụ okwu.
  rationale: Amaokwu ahụ na-eji Abraham dị ka onye Livayị nọchitere anya n'ụzọ ụfọdụ, ma ọ naghị akọwa usoro nkà mmụta okpukpe nke nke a si mee. Tụgharị asụsụ ahụ na-edobe ma 'site n'Abraham' ma okwu nro ahụ, ka esemokwu dị n'okwu mbụ ghara ịla n'iyi.
translation_notes:
  register: Standard Igbo dị ugbu a, kwụ ọtọ ma dị ùgwù. E ji “otu ụzọ n'ụzọ iri” mee ihe kama okwu mgbazinye ka ndị nkịtị ghọta ya ngwa ngwa; e dekwara aha Λευί dịka “Livayị,” ụdị a na-ahụkarị n'Igbo Baịbụl.
