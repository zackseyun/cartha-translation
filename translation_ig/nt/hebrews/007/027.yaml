id: HEB.7.27
reference: Hebrews 7:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: ig
  text: Onye a enweghị mkpa[a], kwa ụbọchị, dị ka ndị isi nchụàjà, ịchụ àjà—nke mbụ maka mmehie nke ha, emesịa maka nke ndị mmadụ[b]—n’ihi na o mere nke a otu ugboro maka mgbe niile[c], mgbe o ji onwe ya chụọ àjà[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ dịghị mkpa ka ọ na-eme nke a ụbọchị ruo ụbọchị.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “maka nke ndị mmadụ”; a na-aghọta “mmehie” site n’okwu gara aga.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “otu ugboro, ruo mgbe ebighị ebi,” ya bụ, otu ugboro nke zuru ezu ma na-agaghị achọ imegharị.
    reason: lexical_alternative
  - marker: d
    text: A pụkwara ịsụgharị ya, “site n’iji onwe ya chụọ àjà” ma ọ bụ “mgbe o jisịrị onwe ya chụọ àjà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: kwa ụbọchị
  rationale: Nkebiokwu a na-egosi ihe a na-eme ugboro ugboro, ụbọchị ruo ụbọchị; “kwa ụbọchị” bụ Igbo nkịtị ma doo anya.
- source_word: ἀνάγκην
  choice: mkpa
  rationale: “Ọ dịghị mkpa” na-egosipụta ἔχει ἀνάγκην n’ụzọ dị mfe ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: dị ka ndị isi nchụaja na-eme
  rationale: Ọ na-echekwa ntụnyere ahụ na ọtụtụ ndị isi nchụaja; “na-eme” mezuru echiche ahịrịokwu ahụ n’Igbo.
- source_word: πρότερον ... ἔπειτα
  choice: buru ụzọ ... e mesịa
  rationale: O doro anya na ọ na-egosi usoro ihe abụọ ahụ.
- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: maka mmehie nke aka ha
  rationale: “Maka” dabara n’asụsụ ịchụ àjà ma “nke aka ha” na-emesi ἰδίων ike.
- source_word: θυσίας ἀναφέρειν
  choice: ịchụ àjà
  rationale: N’Igbo, “ịchụ àjà” bụ ụzọ ebumpụta ụwa isi kwuo inye àjà n’usoro ofufe.
- source_word: τῶν τοῦ λαοῦ
  choice: maka nke ndị mmadụ
  rationale: A hapụrụ “mmehie” ka a ghọta ya site n’okwu gara aga, dịka ellipsis dị na Grik.
- source_word: τοῦτο γὰρ ἐποίησεν
  choice: n’ihi na o mere nke a
  rationale: Ọ na-echekwa ntụaka “nke a” n’enweghị ịkọwa oke ntụaka ya karịa ihe Grik kwuru.
- source_word: ἐφάπαξ
  choice: naanị otu ugboro maka mgbe niile
  rationale: Ọ na-egosipụta ma otu ugboro ahụ ma ọdịdị ya nke ikpeazụ na nke na-agaghị achọ imegharị.
- source_word: ἑαυτὸν ἀνενέγκας
  choice: mgbe o ji onwe ya chụọ àjà
  rationale: Ọ na-echekwa njikọ oge nke participle na ihe ịchụ àjà, ma bụrụ Igbo dị mfe nghọta.
theological_decisions:
- issue: Oke ntụaka nke “nke a” n’ahịrịokwu ikpeazụ
  choice: E chekwara “nke a” dị ka ntụaka sara mbara nye ọrụ ịchụ àjà a kọwara, n’ebughị ụzọ kwuo na Jizọs chụrụ àjà maka mmehie nke ya.
  alternative: Ịkọwa “nke a” kpọmkwem dịka naanị ịchụ àjà maka mmehie ndị mmadụ.
  rationale: Grik nwere obere mgbagwoju anya n’oke ntụaka τοῦτο. Nsụgharị ahụ na-echekwa nke ahụ, ebe ihe gbara amaokwu ahụ gburugburu na-egosi ọdịiche dị n’etiti ya na ndị isi nchụaja ndị ọzọ.
- issue: Jizọs dịka onye nchụaja na àjà
  choice: “o ji onwe ya chụọ àjà”
  alternative: “o nyere onwe ya”
  rationale: Nhọrọ a na-echekwa ụda ofufe na ọrụ nchụaja nke ἀναφέρω n’Akwụkwọ Ndị Hibru, kama ime ka ọ bụrụ naanị okwu gbasara inye onwe onye.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. E ji “ndị isi nchụaja” na “ịchụ àjà” chekwaa okwu ọrụ nchụaja, ma zere okwu ochie ma ọ bụ nkọwa nke otu ụka pụrụ iche.
