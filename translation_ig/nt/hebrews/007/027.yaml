revisions:
- from: Onye ọ bụla adịghị mkpa[a] ịchụ àjà kwa ụbọchị, dị ka ndị isi nchụaja na-eme—buru ụzọ chụọ àjà maka mmehie nke aka ha, e mesịa maka nke ndị mmadụ[b]—n’ihi na o mere nke a naanị otu ugboro maka mgbe niile[c], mgbe o ji onwe ya chụọ àjà[d].
  to: Onye a enweghị mkpa[a], kwa ụbọchị, dị ka ndị isi nchụàjà, ịchụ àjà—nke mbụ maka mmehie nke ha, emesịa maka nke ndị mmadụ[b]—n’ihi na o mere nke a otu ugboro maka mgbe niile[c], mgbe o ji onwe ya chụọ àjà[d].
  rationale: A necessary correction replaces the indefinite “Onye ọ bụla” with “Onye a,” which properly refers back to the singular priestly subject of the preceding context. The rest of the revision preserves the Greek syntax and ambiguity, including the ellipsis in “maka nke ndị mmadụ” and the non-specific reference of “nke a.”
  reviewer_model: gpt-5.6-terra
