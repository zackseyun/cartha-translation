    text: Ma ọ bụ, “ndị nchụàjà adịla ọtụtụ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ịnọgide”; ihe ọ pụtara n’ebe a bụ ịnọgide n’ọrụ nchụàjà.
    reason: lexical_alternative
  revision_rationale: The revision makes the plurality assertion idiomatic and unambiguous in Standard Igbo, while preserving the perfect sense of γεγονότες (“e nweela ... ghọrọ”), the causal statement concerning death, and the unexpanded main-text rendering of παραμένειν. “Ma” better supports the verse’s incomplete μέν/δέ contrast with v. 24.
