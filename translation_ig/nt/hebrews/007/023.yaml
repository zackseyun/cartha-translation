  text: Καὶ οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς διὰ τὸ θανάτῳ κωλύεσθαι παραμένειν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/023.yaml
  text: And they indeed have become many priests[a], because they are prevented by death from remaining in office[b],
translation:
  language: ig
  text: Ma, e nweela ọtụtụ ndị ghọrọ ndị nchụàjà[a], n’ihi na ọnwụ na-egbochi ha ịnọgide[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nchụàjà adịla ọtụtụ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ịnọgide”; ihe ọ pụtara n’ebe a bụ ịnọgide n’ọrụ nchụàjà.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Ọzọkwa
  rationale: Ọ na-ejikọta amaokwu a na arụmụka gara aga ma na-eme ka ntụgharị gaa n’ọdịiche dị n’amaokwu na-esonụ doo anya.
- source_word: οἱ μὲν πλείονές εἰσιν γεγονότες ἱερεῖς
  choice: ndị ghọrọ ndị nchụàjà dị ọtụtụ
  rationale: Nke a na-echekwa echiche nke γεγονότες na ịdị ọtụtụ nke ndị nchụàjà, nke ga-adị iche na otu onye nchụàjà a na-ekwu maka ya n’amaokwu na-esonụ. A naghị amanye μέν ka ọ bụrụ otu mkpụrụokwu pụrụ iche, ma usoro okwu ahụ na-akwadebe ọdịiche ahụ.
- source_word: διὰ τὸ θανάτῳ κωλύεσθαι
  choice: n’ihi na ọnwụ na-egbochi ha
  rationale: διά tinyere infinitive nwere article na-egosi ihe kpatara ya; θανάτῳ bụ ihe ma ọ bụ ụzọ na-egbochi ha. Usoro Igbo nke na-eme ‘ọnwụ’ onye na-eme ihe a bụ nke eke ma na-echekwa ihe passive Greek pụtara.
- source_word: παραμένειν
  choice: ịnọgide
  rationale: Ọ pụtara ịnọgide ma ọ bụ ịga n’ihu; n’ebe a, ihe gbara ya gburugburu na-egosi ịnọgide n’ọrụ nchụàjà. E debere okwu ahụ n’ụdị sara mbara n’ahịrị isi ma kọwaa ya n’okpuru peeji.
theological_decisions:
- issue: Ọdịiche dị n’etiti ọtụtụ ndị nchụàjà mbụ na ọrụ nchụàjà Jizọs
  choice: E gosiri na ndị nchụàjà dị ọtụtụ n’ihi na ọnwụ egbochiri ha ịnọgide, n’enweghị itinye ‘ndị Livaị’ n’ahịrị isi.
  alternative: Ịkpọ ha kpọmkwem ‘ndị nchụàjà Livaị’ ma ọ bụ ikwu ‘n’ọrụ ha’ n’ahịrị isi.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ekwu maka usoro nchụàjà mbụ, ma Greek akpọghị ‘ndị Livaị’ kpọmkwem n’ebe a. Nsụgharị ahụ na-echekwa arụmụka na esemokwu nkà mmụta okpukpe n’enweghị mgbakwunye nkọwa.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị nchụàjà” maka ἱερεῖς, “ọnwụ na-egbochi ha” dịka usoro Igbo eke, ma debe “ịnọgide” n’ahịrị isi iji zere ịgbakwunye karịa ihe Greek kwuru.
