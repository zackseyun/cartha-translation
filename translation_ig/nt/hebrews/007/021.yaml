  rationale: The revision retains the source's elliptical contrast and oath-based priestly appointment while replacing an ambiguous idiom for the Lord's unchanging resolve. It also renders the aorist as the straightforward past 'ṅụrụ iyi,' while preserving the perfect alternative in the footnote.
