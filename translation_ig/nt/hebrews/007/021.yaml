    text: Ma ọ bụ, “Onyenwe anyị aṅụọla iyi.” Enwere ike ịsụgharị ngwaa Grik aorist Ὤμοσεν dịka “ṅụrụ iyi” ma ọ bụ “aṅụọla iyi.”
    reason: lexical_alternative
