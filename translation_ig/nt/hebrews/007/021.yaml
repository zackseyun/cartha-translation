id: HEB.7.21
reference: Hebrews 7:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ μετὰ ὁρκωμοσίας διὰ τοῦ λέγοντος πρὸς αὐτόν· Ὤμοσεν κύριος, καὶ οὐ μεταμεληθήσεται, Σὺ ἱερεὺς εἰς τὸν ⸀αἰῶνα),
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/021.yaml
  text: but this one became a priest with an oath through the one who said to him[a], “The Lord has sworn and will not change his mind, ‘You are a priest forever.’”
translation:
  language: ig
  text: 'ma onye a, e ji iyi mee ya onye nchụàjà site n’aka onye ahụ gwara ya sị: “Onyenwe anyị ṅụrụ iyi, ọ gaghị agbanwe mkpebi ya: ‘Ị bụ onye nchụàjà ruo mgbe ebighị ebi.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: ma onye a
  rationale: Ọ na-eme ka ọdịiche dị n’etiti onye nchụàjà a na ndị nchụàjà e kwuru okwu ha n’amaokwu bu ụzọ pụta ìhè, ma na-edobekwa mkpụmkpụ okwu Grik ahụ.
- source_word: μετὰ ὁρκωμοσίας
  choice: site n’iyi
  rationale: Nke a bụ asụsụ Igbo doro anya nke na-egosi na iyi so n’otú e si mee ya onye nchụàjà, ma na-echekwa ọdịiche dị n’amaokwu nke 20.
- source_word: διὰ τοῦ λέγοντος πρὸς αὐτόν
  choice: site n’aka onye ahụ gwara ya sị
  rationale: “Site n’aka” na-egosi ọrụ onye mere ihe dịka διά na genitive si eme, ebe “gwara ya sị” bụ ụzọ Igbo dị ndụ si webata okwu e hotara.
- source_word: Ὤμοσεν κύριος
  choice: Onyenwe anyị aṅụọla iyi
  rationale: “Aṅụọla iyi” na-egosi iyi e mere nke ka nwere ike ugbu a; ihe odide ala peeji na-echekwa nhọrọ nke ịsụgharị aorist ahụ dịka ihe mere n’oge gara aga.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ahụkarị maka κύριος n’ebe a, n’enweghị itinye aha Hibru n’ime ihe odide Grik.
- source_word: οὐ μεταμεληθήσεται
  choice: ọ gaghịkwa agbanwe obi ya
  rationale: Ọ na-egosi na Onyenwe anyị agaghị agbanwe mkpebi o kwupụtara; ọ naghị atụgharị okwu ahụ ka ọ bụrụ nchegharị n’ihi mmehie.
- source_word: Σὺ ἱερεὺς
  choice: Ị bụ onye nchụàjà
  rationale: E tinyere ngwaa “bụ,” nke Grik hapụrụ ka a ghọta ya, iji mee ka okwu ahụ bụrụ Igbo zuru oke ma doo anya.
- source_word: εἰς τὸν αἰῶνα
  choice: ruo mgbe ebighị ebi
  rationale: Nke a na-egosipụta ịdịgide ruo mgbe niile n’Igbo nkịtị ma dị ùgwù.
theological_decisions:
- issue: Otú e si tụgharịa iyi dị n’Abụ Ọma 110:4 banyere ịbụ onye nchụàjà
  choice: E gosiri na e mere onye a onye nchụàjà site n’iyi Onyenwe anyị, nakwa na ọ bụ onye nchụàjà ruo mgbe ebighị ebi.
  alternative: A pụrụ ịsụgharị Ὤμοσεν dịka “Onyenwe anyị ṅụrụ iyi” kama “Onyenwe anyị aṅụọla iyi.”
  rationale: Nke a na-echekwa arụmụka Ndị Hibru banyere ọdịiche dị n’etiti ndị nchụàjà e mere n’enweghị iyi na onye a e mere site n’iyi Chineke, n’etinyeghị nkọwa ozizi ọzọ na-adịghị n’amaokwu ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. E ji “onye nchụàjà” mee ihe maka ἱερεύς, “Onyenwe anyị” maka κύριος, ma debe usoro iyi na okwu e hotara n’ụzọ ga-adịrị onye na-agụ Igbo mfe.
