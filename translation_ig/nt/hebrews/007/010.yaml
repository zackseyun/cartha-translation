base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/010.yaml
  text: For he was still in the loins of his father when Melchizedek met him[a].
translation:
  language: ig
  text: N’ihi na ọ ka nọ n’úkwù nna ya mgbe Melkizedek zutere ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-akọwa ihe ọ pụtara karịa, “ọ ka nọ n’ahụ nna ochie ya.” Grik kwuru kpọmkwem, “n’úkwù nna ya,” nke bụ akpaalaokwu na-ekwu maka isite n’usoro ọmụmụ nna ochie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: ọ ka nọ
  rationale: Nke a na-egosi na ọnọdụ ahụ ka dị otu ahụ n’oge nzute ahụ, ma bụrụkwa okwu Igbo dị mfe ma kwekọọ n’echiche ‘still.’
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na nke bu ya ụzọ dị ka nkọwa ma ọ bụ ihe kpatara okwu ahụ.
- source_word: ἐν τῇ ὀσφύϊ
  choice: n’úkwù
  rationale: Ọ na-edobe ihe atụ anụ ahụ nke Grik, nke n’ebe a na-anọchi anya isi n’ezinụlọ nna ochie pụta, kama ịgbanwe ya ozugbo ka ọ bụrụ nkọwa.
- source_word: τοῦ πατρὸς
  choice: nna ya
  rationale: Ọ na-edobe usoro Grik ‘nna ya’ n’enweghị itinye aha Ebreham n’ahịrịokwu ahụ, ọ bụ ezie na ihe gbara ya gburugburu na-egosi onye a na-ekwu maka ya.
- source_word: ἦν
  choice: ọ nọ
  rationale: Ngwaa ịdị adị n’oge gara aga ka e si kwuo ya n’ụzọ Igbo dabara n’ọnọdụ mmadụ nọ n’ebe a kpọrọ aha.
- source_word: ὅτε
  choice: mgbe
  rationale: Njikọ oge a na-ewebata oge Melkizedek zutere onye ahụ.
- source_word: συνήντησεν
  choice: zutere
  rationale: Nke a bụ ntụgharị Igbo kpọmkwem na nke e ji eme ihe kwa ụbọchị maka ‘met/encountered.’
- source_word: αὐτῷ
  choice: ya
  rationale: E debere nnọchiaha dị na Grik; ihe gbara ya gburugburu na-eme ka o doo anya na ọ na-ezo aka n’Ebreham.
- source_word: Μελχισέδεκ
  choice: Melkizedek
  rationale: E dere aha onye ahụ n’ụdị mkpọpụta a na-ahụkarị n’Igbo.
theological_decisions:
- issue: Otu e si egosi na Livaị sitere n’Ebreham
  choice: Idobe okwu ihe atụ ahụ, ‘n’úkwù nna ya,’ n’ahịrịokwu bụ isi
  alternative: ‘n’ahụ nna nna ya’ ma ọ bụ ‘n’ime mkpụrụ nna nna ya’
  rationale: Nke a na-eme ka arụmụka onye dere akwụkwọ ahụ—na Livaị nọ n’ime Ebreham n’echiche nke usoro ọmụmụ—pụta ìhè, n’etinyeghị nkọwa nkà mmụta okpukpe ọzọ n’ime amaokwu ahụ.
- issue: Onye ‘nna ya’ na-ezo aka na ya
  choice: Idobe ‘nna ya’
  alternative: ‘nna nna ya Ebreham’
  rationale: Ọ bụ ezie na onye a bụ Ebreham, Grik akpọghị aha ya n’ebe a. Idobe ‘nna ya’ na-echekwa ọdịdị na nghọta okwu mbụ, ebe ihe gbara amaokwu ahụ gburugburu na-akọwa onye ọ bụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E debere ihe atụ Grik n’ahịrịokwu bụ isi, tinyekwa nkọwa ya n’ala ala peeji ka onye na-agụ ghọta echiche banyere usoro ọmụmụ.
