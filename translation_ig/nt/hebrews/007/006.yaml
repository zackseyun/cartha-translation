id: HEB.7.6
reference: Hebrews 7:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν δεδεκάτωκεν ⸀Ἀβραάμ, καὶ τὸν ἔχοντα τὰς ἐπαγγελίας εὐλόγηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/006.yaml
  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: ig
  text: Ma onye ahụ a na-adịghị agụnye n’usoro ọmụmụ ha anatala otu ụzọ n’ụzọ iri n’aka Ebreham[a], agọzikwala onye ahụ nwere nkwa ndị ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anatala onyinye otu ụzọ n’ụzọ iri n’aka Ebreham.” Ngwaa Grik nwere ike ịpụta ịnara ma ọ bụ ịnakọta otu ụzọ n’ụzọ iri.
    reason: lexical_alternative
  - marker: b
    text: Grik sịrị, “onye nwere nkwa ndị ahụ.” N’ebe a, ọ na-ezo aka na Ebreham, bụ́ onye e nyere nkwa ndị ahụ.
    reason: clarification
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: Ma onye ahụ a na-adịghị agụnye n’usoro ọmụmụ ha
  rationale: Nkebi a na-ezo aka na Melkizedek dị ka onye a na-adịghị agụnye n’usoro ọmụmụ ụmụ Livay. Ọ na-echekwa echiche nke usoro ọmụmụ na nkwado iwu maka ọrụ nchụàjà, n’ebughị ụzọ kwuo ihe Grik na-ekwughị banyere ọdịdị ma ọ bụ mmalite Melkizedek.
- source_word: δεδεκάτωκεν Ἀβραάμ
  choice: anatala otu ụzọ n’ụzọ iri n’aka Ebreham
  rationale: “Anatala” na-egosi ihe e mere nke ka nwere mkpa n’arụmụka ahụ; “otu ụzọ n’ụzọ iri” na-akọwa kpọmkwem ihe e nyere, ebe “n’aka Ebreham” na-eme ka o doo anya na Ebreham bụ onye nyere ya.
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: onye ahụ nwere nkwa ndị ahụ
  rationale: “Nwere” na-egosipụta participle nke dị n’oge ugbu a na Grik n’ụzọ na-adịkwa mma n’Igbo; “nkwa ndị ahụ” na-echekwa ụdị ụbara nke ἐπαγγελίας.
- source_word: εὐλόγηκεν
  choice: gọziekwa
  rationale: Ngwaa a na-enye echiche nke ịgọzi. N’usoro ahịrịokwu Igbo, ụdị a na-agụ nke ọma ma na-ejikọta omume ahụ nke ọma na nke bu ya ụzọ.
theological_decisions:
- issue: Ihe ntụnyere usoro ọmụmụ pụtara n’ihe gbasara ndị nchụàjà Livay
  choice: E gosipụtara Melkizedek dị ka onye a na-adịghị agụnye n’usoro ọmụmụ ụmụ Livay.
  alternative: A pụrụ ịsụgharị ya dị ka onye na-esighị n’agbụrụ ha.
  rationale: Ihe onye dere akwụkwọ Ndị Hibru na-arụ ụka banyere ya bụ ikike ọrụ nchụàjà nke na-adabereghị n’usoro ọmụmụ Livay. Nsụgharị a na-echekwa isi okwu ahụ ma ghara ime ka ọ bụrụ nkwupụta banyere ọdịdị ma ọ bụ mmalite Melkizedek.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, nke dị ugwu ma dị mfe nghọta. A họọrọ “usoro ọmụmụ” maka echiche genealogical/legal, “otu ụzọ n’ụzọ iri” maka tithe, na “nkwa ndị ahụ” iji chekwaa ụbara dị na Grik.
