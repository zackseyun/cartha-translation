  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: ig
  text: N’ebe a, ndị mmadụ na-anwụ anwụ na-anata otu ụzọ n’ụzọ iri; ma n’ebe ahụ, a na-agba akaebe banyere Melkizedek na ọ dị ndụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ma n’ebe ahụ, a na-agba akaebe na ọ dị ndụ.” Grik na-edobe okwu a dịka ihe Akwụkwọ Nsọ gbara akaebe banyere Melkizedek, kama ikwu ozugbo na ọ dị ndụ n’ezie ruo mgbe ebighị ebi.
    reason: alternative_reading
lexical_decisions:
- source_word: ὧδε … ἐκεῖ
  choice: N’ebe a … n’ebe ahụ
  rationale: Na-edobe ntụnyere doro anya nke onye ode akwụkwọ mere n’etiti ọnọdụ ndị nchụàjà Livay ugbu a na ihe Akwụkwọ Nsọ kwuru banyere Melkizedek.
- source_word: δεκάτας
  choice: otu ụzọ n’ụzọ iri
  rationale: Nke a bụ okwu Igbo doro anya maka ihe a na-enye dịka otu ụzọ n’ime ụzọ iri, ma ọ na-adabara ọnọdụ iwu na ofufe ebe a.
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: ndị nwoke na-anwụ anwụ
  rationale: Ọ na-egosi na ndị a bụ mmadụ ndị ọnwụ na-eru; ‘ndị nwoke’ dabara n’ebe a n’ihi na okwu ahụ na-ekwu kpọmkwem banyere ndị nchụàjà.
- source_word: λαμβάνουσιν
  choice: na-anata
  rationale: Ọ na-egosi nnata otu ụzọ n’ụzọ iri n’enweghị ịgbakwunye echiche nke ịnapụ ma ọ bụ ịnakọta n’ike.
- source_word: μαρτυρούμενος ὅτι ζῇ
  choice: a na-agba akaebe na ọ dị ndụ
  rationale: Na-edobe ụdị okwu akaebe nke Grik na oge ugbu a, n’ebughị ụzọ kpebie na Melkizedek enweghị ike ịnwụ n’onwe ya.
theological_decisions:
- issue: Ụdị ntụnyere dị n’etiti ndị nchụàjà Livay na Melkizedek
  choice: E gosiri ndị nchụàjà Livay dịka ndị na-anwụ anwụ, ebe a na-agba akaebe banyere Melkizedek na ọ dị ndụ.
  alternative: Amaokwu ahụ na-akụzi na Melkizedek n’onwe ya dị ndụ ebighị ebi, na ọ pụghị ịnwụ.
  rationale: Okwu Grik na-adabere n’ihe Akwụkwọ Nsọ gbara akaebe. Nsụgharị ahụ na-edobe esemokwu a, kama idozi ya site n’ịkpọ Melkizedek onye na-adịghị anwụ anwụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ntụnyere ‘n’ebe a … n’ebe ahụ’ na asụsụ akaebe nke ahịrịokwu Grik.
