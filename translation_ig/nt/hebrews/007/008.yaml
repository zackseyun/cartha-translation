revisions:
- from: N’ebe a, ndị nwoke na-anwụ anwụ na-anata otu ụzọ n’ụzọ iri; ma n’ebe ahụ, a na-agba akaebe na ọ dị ndụ.[a]
  to: N’ebe a, ndị mmadụ na-anwụ anwụ na-anata otu ụzọ n’ụzọ iri; ma n’ebe ahụ, a na-agba akaebe banyere Melkizedek na ọ dị ndụ.[a]
  rationale: The revision clarifies that the testimony concerns Melchizedek, while preserving the Greek passive and present-tense statement (“that he lives”). It retains the here/there contrast and avoids resolving the text’s literary portrayal into a claim of Melchizedek’s literal immortality. “Ndị mmadụ na-anwụ anwụ” is a more natural Standard Igbo rendering of the mortal people who receive tithes in the Levitical comparison.
  reviewer_model: gpt-5.6-terra
