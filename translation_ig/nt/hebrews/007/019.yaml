id: HEB.7.19
reference: Hebrews 7:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος, ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος, δι’ ἧς ἐγγίζομεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: ig
  text: N’ihi na iwu ahụ emeghị ka ihe ọ bụla zuo oke[a]; kama, e webatara olileanya ka mma[b], nke anyị ji abịaru Chineke nso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “emeghị ka ihe ọ bụla bụrụ nke zuru oke.” Ngwaa Grik ahụ nwekwara ike ịpụta “ime ka ihe ruo n’isi ya” ma ọ bụ “ime ka ihe ruo n’ókè e zubere.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “iwebata olileanya ka mma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν
  choice: ihe ọ bụla ...ghị
  rationale: Njikọ ‘ihe ọ bụla’ na mmegide ‘ghị’ na-egosipụta nkwụghị ọtọ nke οὐδὲν n’Igbo nkịtị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a na-enye ihe kpatara ma ọ bụ nkọwa nke okwu bu ya ụzọ.
- source_word: ἐτελείωσεν
  choice: emeghị ka ... zuo oke
  rationale: ‘Ime ka ... zuo oke’ na-echekwa echiche τελειόω nke ime ka ihe ruo n’ókè e zubere, n’enweghị ime ka ọ bụrụ naanị ‘emeghị ihe ọ bụla.’
- source_word: ὁ νόμος
  choice: iwu ahụ
  rationale: ‘Iwu ahụ’ na-arụtụ aka n’iwu a maara ama n’okwu gbara amaokwu ahụ gburugburu, ya bụ usoro iwu Mosis.
- source_word: ἐπεισαγωγὴ
  choice: e webatara
  rationale: Ụdị okwu a dị ndụ ma doo anya n’Igbo, ma na-eburu echiche nke iwebata ihe ọzọ; ihe odide ala peeji na-edebe ụdị aha dị n’asụsụ Grik.
- source_word: δὲ
  choice: kama
  rationale: Ọ na-egosipụta ọdịiche siri ike n’etiti adịghị ike nke iwu ahụ na olileanya ka mma e webatara.
- source_word: κρείττονος ἐλπίδος
  choice: olileanya ka mma
  rationale: ‘Ka mma’ na-echekwa okwu ntụnyere dị mkpa nke a na-emegharị n’akwụkwọ Ndị Hibru.
- source_word: δι’ ἧς
  choice: nke anyị ji
  rationale: Ọ na-egosi ụzọ ma ọ bụ ihe e ji eme ihe, ma na-eme ka nnọchiaha nwanyị ahụ laghachi n’‘olileanya.’
- source_word: ἐγγίζομεν
  choice: abịaru ... nso
  rationale: Ọ bụ okwu Igbo doro anya nke na-echekwa echiche ịbịaru Chineke nso na nke inweta ohere ịbịakwute ya.
- source_word: τῷ θεῷ
  choice: Chineke
  rationale: N’usoro okwu ‘ịbịaru ... nso,’ Igbo anaghị achọ preposition ọzọ iji gosi onye a na-abịaru nso.
theological_decisions:
- issue: Ihe τελειόω pụtara banyere iwu ahụ
  choice: Iwu ahụ emeghị ka ihe ọ bụla zuo oke.
  alternative: Iwu ahụ emeghị ihe ọ bụla ma ọlị.
  rationale: Nhọrọ a na-echekwa echiche nke iru n’ókè e zubere ma ọ bụ izu oke, kama ikwu na iwu ahụ enweghị uru ọ bụla n’ụzọ niile.
- issue: Nkebi okwu dị mkpirikpi mgbe e kwusịrị na iwu ahụ emeghị ka ihe ọ bụla zuo oke
  choice: kama, e webatara olileanya ka mma
  alternative: kama, e nwere iwebata olileanya ka mma
  rationale: Asụsụ Grik hapụrụ ngwaa doro anya; Igbo chọrọ ahịrịokwu na-aga were were. Ụdị a na-egosi iwebata olileanya ahụ n’enweghị ịgbakwunye nkọwa ozizi ọzọ, ebe ihe odide ala peeji na-edebe usoro aha nke Grik.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. A họọrọ ‘iwu ahụ’ na ‘olileanya ka mma’ iji dobe isi okwu nke Ndị Hibru, ebe ‘abịaru Chineke nso’ na-echekwa echiche nke ohere ịbịakwute Chineke.
