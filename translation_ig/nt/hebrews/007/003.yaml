id: HEB.7.3
reference: Hebrews 7:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος, μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων, ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ, μένει ἱερεὺς εἰς τὸ διηνεκές.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/003.yaml
  text: without father[a], without mother, without genealogy, having neither beginning of days nor end of life, but being made like the Son of God[b], he remains a priest perpetually.
translation:
  language: ig
  text: onye na-enweghị nna[a], onye na-enweghị nne, onye na-enweghị usoro ọmụmụ, onye na-enweghị ma mmalite nke ụbọchị ma ọgwụgwụ nke ndụ, ma e mere ya ka ọ dị ka Ọkpara Chineke, ọ na-anọgide bụrụ onye nchụàjà ruo mgbe ebighị ebi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maọbụ, “onye a na-edeghị usoro ọmụmụ ya.” Akwụkwọ Jenesis enweghị ndekọ banyere nna nna Melkizedek; ndị Hibru na-eji otú Akwụkwọ Nsọ si gosi ya tụnyere Ọkpara Chineke.
    reason: lexical_alternative
  - marker: b
    text: Maọbụ, “mgbe niile” maọbụ “ruo mgbe ebighị ebi.” Nkebi okwu a na-emesi ịdịgide nke ọrụ nchụàjà ya ike dịka Akwụkwọ Nsọ si gosi ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτωρ
  choice: onye na-enweghị nna
  rationale: Nke a na-edobe ihe okwu Grik pụtara n'ụzọ doro anya, na-enweghị ikwu na ọ bụ nwa nna ya nwụrụ maọbụ na nna ya hapụrụ ya.
- source_word: ἀμήτωρ
  choice: onye na-enweghị nne
  rationale: Ọ na-agbaso nhazi yiri nke ἀπάτωρ ma na-edobe ọdịdị ahịrịokwu Grik ahụ.
- source_word: ἀγενεαλόγητος
  choice: onye na-enweghị usoro ọmụmụ
  rationale: “Usoro ọmụmụ” na-egosi ndekọ agbụrụ maọbụ usoro ndị nna nna; nkọwa ala peeji na-eme ka o doo anya na ihe a nwere ike ịbụ enweghị ndekọ ya n'Akwụkwọ Nsọ.
- source_word: μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων
  choice: onye na-enweghị mmalite nke ụbọchị maọbụ ọgwụgwụ nke ndụ
  rationale: Nsụgharị a na-edobe njikọ echiche abụọ ahụ na olu dị elu nke isi mmalite ahụ.
- source_word: ἀφωμοιωμένος
  choice: e mere ya ka ọ dị ka
  rationale: Nke a na-echekwa ụda nnara nke participle ahụ ma na-egosi myirịta, ọ bụghị ịbụ otu onye ahụ.
- source_word: τῷ υἱῷ τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: Nke a bụ aha a na-eji eme ihe n'ụzọ kwesịrị nsọpụrụ maka Son of God na Standard Igbo.
- source_word: μένει
  choice: ọ na-anọgide
  rationale: Ọ na-egosipụta ọnọdụ na-aga n'ihu nke ngwaa ugbu a μένει.
- source_word: ἱερεὺς
  choice: onye nchụàjà
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụ nke a na-amakarị maka onye na-arụ ọrụ nchụàjà.
- source_word: εἰς τὸ διηνεκές
  choice: ruo mgbe niile
  rationale: Ọ na-egosi ịdịgide na-aga n'ihu n'enweghị ịgbatị okwu ahụ karịa ebumnuche typology nke arụmụka ahụ.
theological_decisions:
- issue: Ma amaokwu ahụ ọ na-ekwu na Melkizedek enweghị nne na nna ma dị ndụ ebighị ebi n'ụzọ nkịtị, ka ọ bụ otú Akwụkwọ Nsọ si gosi ya maka iji ya mee ihe atụ
  choice: E debere nkọwa ndị ahụ n'ahịrịokwu bụ isi, ebe nkebi “e mere ya ka ọ dị ka Ọkpara Chineke” na-egosi myirịta n'ime arụmụka ahụ.
  alternative: Ịsụgharị ya n'ụzọ ga-ekwupụta kpọmkwem na Melkizedek bụ Ọkpara Chineke tupu ọ ghọọ mmadụ, maọbụ na ọ bụ onye enweghị nne na nna ma dị ndụ ebighị ebi n'ezie.
  rationale: ἀφωμοιωμένος na-ekwu na e mere Melkizedek ka ọ dị ka Ọkpara, ọ bụghị na ọ bụ Ọkpara ahụ. N'otu oge ahụ, nsụgharị ahụ anaghị ehichapụ esemokwu na ịdị omimi nke okwu ndị ode akwụkwọ ji mee arụmụka ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. E debere nhazi okwu ndị yiri ibe ha iji chekwaa ịdị arọ nke Grik, ma jiri nkọwa ala peeji kọwaa na enweghị usoro ọmụmụ nwere ike izo aka n'enweghị ndekọ ya.
