revisions:
- from: onye na-enweghị nna[a], onye na-enweghị nne, onye na-enweghị usoro ọmụmụ, onye na-enweghị mmalite nke ụbọchị maọbụ ọgwụgwụ nke ndụ, ma e mere ya ka ọ dị ka Ọkpara Chineke, ọ na-anọgide bụrụ onye nchụàjà ruo mgbe niile.[b]
  to: onye na-enweghị nna[a], onye na-enweghị nne, onye na-enweghị usoro ọmụmụ, onye na-enweghị ma mmalite nke ụbọchị ma ọgwụgwụ nke ndụ, ma e mere ya ka ọ dị ka Ọkpara Chineke, ọ na-anọgide bụrụ onye nchụàjà ruo mgbe ebighị ebi.[b]
