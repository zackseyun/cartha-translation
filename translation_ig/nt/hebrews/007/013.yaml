source:
  edition: SBLGNT
  text: ἐφ’ ὃν γὰρ λέγεται ταῦτα φυλῆς ἑτέρας μετέσχηκεν, ἀφ’ ἧς οὐδεὶς προσέσχηκεν τῷ θυσιαστηρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: ig
  text: N’ihi na onye ahụ a na-ekwu ihe ndị a banyere ya so n’ebo ọzọ[a], nke ọ dịghị onye n’ebo ahụ jerela ozi n’ebe ịchụàjà[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “bụ onye nọ n’ebo ọzọ” ma ọ bụ “nwere òkè n’ebo ọzọ.” Ngwaa Grik ahụ nwere ike ịpụta isonye ma ọ bụ inwe njikọ; n’ebe a ọ na-ekwu banyere njikọ ya na ebo.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “anọbeghị n’ọrụ n’ebe ịchụàjà.” Okwu Grik ahụ na-ezo aka n’ịga ozi ma ọ bụ ịrụ ọrụ metụtara ebe ịchụàjà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: banyere ya
  rationale: ἐπί ya na accusative n’ebe a na-egosi onye okwu ndị a metụtara; ‘banyere ya’ bụ Igbo doro anya ma kwekọọ n’ọrụ ya na λέγεται ταῦτα.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe na-akọwa ma na-akwado okwu gara aga, ma na-echekwa njikọ arụmụka ahụ.
- source_word: λέγεται ταῦτα
  choice: a na-ekwu ihe ndị a
  rationale: Nke a na-echekwa olu nnara nke present na plural ταῦτα n’Igbo eke.
- source_word: φυλῆς ἑτέρας
  choice: ebo ọzọ
  rationale: φυλή n’ebe a bụ otu n’ime ebo Izrel; ‘ọzọ’ na-egosi na ọ dị iche n’ebo ndị nchụàjà a na-atụle.
- source_word: μετέσχηκεν
  choice: sitere n’ebo
  rationale: N’ọnọdụ a, perfect μετέσχηκεν na-egosi njikọ onye ahụ na ebo ahụ. ‘Sitere n’ebo’ bụ ụzọ Igbo eke si kọwaa njikọ ebo n’enweghị ịgbakwunye nkọwa banyere usoro ọmụmụ karịa ihe gbara ya gburugburu na-egosi.
- source_word: ἀφ’ ἧς
  choice: nke ... n’ime ya
  rationale: Ọ na-alaghachi na ‘ebo’; usoro a na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: οὐδεὶς
  choice: onye ọ bụla ... -ghị
  rationale: Nke a bụ usoro negation Igbo eke nke pụtara ‘ọ dịghị onye ọbụla.’
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: na-ejebeghị ozi n’ebe ịchụàjà
  rationale: N’ọnọdụ ofufe a, προσέχω na-ezo aka n’ịga ozi ma ọ bụ ilekọta ọrụ metụtara ebe ịchụàjà; nsụgharị a na-egosi ọrụ ahụ n’enweghị ịkọwapụta emume pụrụ iche.
- source_word: θυσιαστηρίῳ
  choice: ebe ịchụàjà
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka altar n’ọnọdụ ịchụ aja.
theological_decisions:
- issue: Njikọ Jizọs na ebo na-abụghị nke Livayị n’arụmụka banyere ọrụ nchụàjà
  choice: E gosipụtara na onye a na-ekwu maka ya sitere n’ebo ọzọ, n’etinyeghị aha ebo ahụ ma ọ bụ nkọwa ozizi ọzọ.
  alternative: ‘bụ onye ebo ọzọ’ ma ọ bụ ‘sitere n’agbụrụ ebo ọzọ’
  rationale: Greek na-ekwu maka isonye ma ọ bụ njikọ ya na ebo ọzọ; amaokwu a n’onwe ya anaghị akpọ Livayị aha ma ọ bụ kọwaa usoro ọmụmụ ya n’uju. Ya mere, e chekwara okwu ahụ n’ogo nke isi mmalite.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ebo’ dabara n’usoro ebo Izrel, ‘ebe ịchụàjà’ bụ okwu a maara nke ọma, ma e chekwara ọdịiche dị n’etiti njikọ ebo na ịkọwa usoro ọmụmụ kpọmkwem.
