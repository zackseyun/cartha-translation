revisions:
- from: N’ihi na o doro anya na Onyenwe anyị esiwo n’ebo Juda pụta[a], bụ́ ebo nke Mosis na-ekwughị ihe ọ bụla banyere ndị nchụàjà ya.
  to: N’ihi na o doro anya na Onyenwe anyị esiwo na Juda pụta[a], bụ́ ebo nke Mosis ekwughị ihe ọ bụla banyere ndị nchụàjà.
  rationale: The revision removes an unsupported possessive and renders Moses’ speaking as a completed past action. It preserves the source’s lineage/origin sense and its metaphorical nuance in the footnote without adding a resurrection interpretation.
  reviewer_model: gpt-5.6-terra
