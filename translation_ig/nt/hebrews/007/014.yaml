id: HEB.7.14
reference: Hebrews 7:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν, εἰς ἣν φυλὴν ⸂περὶ ἱερέων οὐδὲν⸃ Μωϋσῆς ἐλάλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: ig
  text: N’ihi na o doro anya na Onyenwe anyị esiwo na Juda pụta[a], bụ́ ebo nke Mosis ekwughị ihe ọ bụla banyere ndị nchụàjà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “esiwo na Juda pulite.” Ngwaa Grik ahụ na-eweta ihe oyiyi nke ibilite ma ọ bụ ipulite; n’ebe a, ọ na-ezo aka n’ebe o si malite na Juda, ọ bụghị karịchaa ná mbilite n’ọnwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόδηλον
  choice: o doro anya
  rationale: Nke a bụ ụzọ Igbo nkịtị ma dị ùgwù si egosipụta eziokwu pụtara ìhè.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejigide njikọ nkọwa nke amaokwu a na arụmụka bu ya ụzọ.
- source_word: ἐξ Ἰούδα
  choice: n’ebo Juda
  rationale: Ọ na-egosi ebe o si pụta ma mee ka o doo anya na Juda ebe a bụ ebo, dị ka nkebi na-esochi ya si gosi.
- source_word: ἀνατέταλκεν
  choice: esiwo ... pụta
  rationale: Ọ na-egosi mmalite ma ọ bụ usoro ọmụmụ sitere na Juda, na-enweghị ime ka onye na-agụ ya chee na isi okwu bụ mbilite n’ọnwụ; nkọwa ala peeji na-echekwa ihe oyiyi Grik nke ipulite ma ọ bụ ịrị elu.
- source_word: ὁ κύριος ἡμῶν
  choice: Onyenwe anyị
  rationale: Ọ bụ ntụgharị Igbo ebumpụta ụwa nke utu aha a na nnọchiaha nwe ya, na-agbakwụnyeghị aha Jizọs n’ime amaokwu ahụ.
- source_word: εἰς ἣν φυλήν
  choice: bụ́ ebo nke
  rationale: Ọ na-ejikọta nkebi ahụ nke ọma na ebo Juda a kpọrọ aha, ma na-edobe ntụaka ahụ n’ụzọ Igbo doro anya.
- source_word: περὶ ἱερέων οὐδὲν
  choice: ihe ọ bụla banyere ndị nchụàjà ya
  rationale: Ọ na-edobe ndị mmadụ kpọmkwem—ndị nchụàjà—kama iji okwu sara mbara nke pụtara ọrụ nchụàjà; ‘ya’ na-eme ka njikọ ya na ebo ahụ doo anya n’Igbo.
- source_word: Μωϋσῆς ἐλάλησεν
  choice: Mosis na-ekwughị
  rationale: Ụdị a bụ Igbo ebumpụta ụwa maka nkwupụta na Mosis ekwughị ihe ọ bụla banyere okwu ahụ.
theological_decisions:
- issue: Onye ‘Onyenwe anyị’ na-ezo aka na ya
  choice: Edobere ya dịka ‘Onyenwe anyị,’ ebe ọnọdụ okwu ahụ na-egosi Jizọs.
  alternative: Ịsị ‘Onyenwe anyị Jizọs.’
  rationale: Ịghara ịgbakwunye ‘Jizọs’ na-echekwa kpọmkwem ihe odide Grik, ebe arụmụka gbara ya gburugburu na-eme ka onye a na-ekwu maka ya doo anya.
- issue: Ike na ihe ἀνατέταλκεν pụtara
  choice: ‘esiwo ... pụta,’ nke na-ezo aka na mmalite ma ọ bụ agbụrụ sitere na Juda.
  alternative: ‘esiwo ... pulite’ ma ọ bụ ‘ebiliela,’ nke nwere ike ime ka a ghọta ya dịka mbilite n’ọnwụ.
  rationale: Ọnọdụ okwu ahụ bụ gbasara ebo na ntozu maka ịbụ onye nchụàjà; ya mere, ntụgharị ahụ ekwesịghị ime ka mbilite n’ọnwụ bụrụ isi ihe, ma nkọwa ala peeji na-echekwa ihe oyiyi okwu Grik ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ndị nchụàjà’ maka ἱερέων, ma zere ịgbakwunye nkọwa ụka pụrụ iche n’ime amaokwu ahụ.
