    text: A pụkwara ịsị, “esiwo na Juda pulite.” Ngwaa Grik ahụ na-eweta ihe oyiyi nke ibilite ma ọ bụ ipulite; n’ebe a, ọ na-ezo aka n’ebe o si malite na Juda, ọ bụghị karịchaa ná mbilite n’ọnwụ.
    reason: lexical_alternative
  revision_rationale: The revision removes an unsupported possessive and renders Moses’ speaking as a completed past action. It preserves the source’s lineage/origin sense and its metaphorical nuance in the footnote without adding a resurrection interpretation.
