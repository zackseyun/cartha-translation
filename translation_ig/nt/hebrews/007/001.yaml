    text: A pụkwara ịsị, “imeri ndị eze ahụ.” N’asụsụ Grik, okwu ahụ pụtara n’ụzọ nkịtị “ogbugbu ndị eze ahụ.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek demonstrative and explanatory connection, all titles and actions, and the open-ended military wording of κοπή. It improves Standard Igbo idiom and makes the main phrase a nominal event expression rather than an unnecessarily explicit assertion that the kings themselves were killed.
