id: HEB.7.1
reference: Hebrews 7:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ⸀ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/001.yaml
  text: For this Melchizedek[a], king of Salem, priest of God Most High, met Abraham as he was returning from the slaughter of the kings and blessed him[b],
translation:
  language: ig
  text: N’ihi na Melkizedek a, bụ eze Salem, onye nchụaja Chineke Kasị Elu, zutere Ebreham mgbe ọ na-alọta site n’ogbugbu ndị eze ahụ[a], gọzikwara ya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “imeri ndị eze ahụ.” N’asụsụ Grik, okwu ahụ pụtara n’ụzọ nkịtị “ogbugbu ndị eze ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος γὰρ
  choice: N’ihi na Melkizedek a
  rationale: “N’ihi na” na-egosipụta njikọ nkọwa γάρ na arụmụka gara aga; “a” na-edobe ike ngosi nke Οὗτος n’ụzọ Igbo na-ada nke ọma.
- source_word: Μελχισέδεκ
  choice: Melkizedek
  rationale: E dere aha onye ahụ n’ụdị ntụgharị mkpụrụokwu a na-ejikarị n’Igbo.
- source_word: βασιλεὺς Σαλήμ
  choice: eze Salem
  rationale: Nke a na-asụgharị βασιλεύς ozugbo ma na-edobe Salem dị ka aha ebe e kwuru na Jenesis 14.
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: onye nchụaja nke Chineke Onye Kachasị Elu
  rationale: Nke a bụ asụsụ Igbo doro anya nke na-edobe ὕψιστος dị ka utu aha Chineke ma na-agbaso usoro Grik nso.
- source_word: ὁ συναντήσας Ἀβραὰμ
  choice: zutere Ebreham
  rationale: “Zutere” na-enye ihe συναντήσας pụtara n’ụzọ dị mfe ma kpọmkwem; Ebreham bụ ụdị aha a maara nke ọma n’Igbo.
- source_word: ὑποστρέφοντι
  choice: mgbe ọ na-alọta
  rationale: Ọdịdị a na-egosipụta omume na-aga n’ihu n’otu oge ahụ Melkizedek zutere Ebreham.
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: site n’igbu ndị eze ahụ[a]
  rationale: “Igbu” na-edobe ike nkịtị nke κοπή, ya bụ igbutu ma ọ bụ igbu n’agha, ebe ihe odide ala peeji na-egosi nhọrọ ntụgharị sara mbara nke “imeri.”
- source_word: καὶ εὐλογήσας αὐτόν
  choice: gọziekwa ya
  rationale: Nke a na-edobe omume nke abụọ Melkizedek mere Ebreham, tinyere njikọ καί.
theological_decisions:
- issue: Otú e si asụgharị utu aha τοῦ θεοῦ τοῦ ὑψίστου
  choice: Chineke Onye Kachasị Elu
  alternative: Chineke Kasị Elu
  rationale: Nhọrọ a na-edobe “Onye Kachasị Elu” dị ka utu aha Chineke n’ụzọ doro anya, na-agbakwụghị nkọwa ozizi ọzọ.
- issue: Ihe κοπή τῶν βασιλέων pụtara n’ihe gbasara agha
  choice: igbu ndị eze ahụ
  alternative: imeri ndị eze ahụ
  rationale: Isi okwu Grik siri ike karịa naanị “imeri,” ma ọnọdụ Jenesis 14 nwere ike ime ka a ghọta ya dị ka mmeri e meriri ndị agha ndị eze; e debere nhọrọ ahụ n’ala peeji ka a ghara idozi nghọtahie ahụ n’ụzọ nzuzo.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-aga n’ihu dịka nke Grik, ya mere e ji rikoma mechie ya. E debere aha na utu aha ndị bụ isi n’ụzọ ndị na-agụ Baịbụl Igbo ga-amata.
