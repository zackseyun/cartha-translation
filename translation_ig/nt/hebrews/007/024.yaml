  text: ὁ δὲ διὰ τὸ μένειν αὐτὸν εἰς τὸν αἰῶνα ἀπαράβατον ἔχει τὴν ἱερωσύνην·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: ig
  text: Ma ebe ọ bụ na ọ na-adịgide ruo mgbe ebighị ebi, o nwere ọkwa nchụàjà na-adịgide adịgide.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “o nwere ọkwa nchụàjà na-enweghị mgbanwe,” ma ọ bụ, “o nwere ọkwa nchụàjà a na-apụghị inyefe onye ọzọ.” Okwu Grik ahụ pụrụ ịpụta nke ọ bụla n’ime ihe ndị a; n’ebe a, isi okwu bụ na, ebe ọ na-adị ndụ ruo mgbe ebighị ebi, ọkwa nchụàjà ya anaghị agafere onye ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ma ... ọ
  rationale: Nke a na-ezo aka na Jizọs ma na-egosi ọdịiche dị n’etiti ya na ọtụtụ ndị nchụàjà ndị e kwuru okwu ha n’amaokwu bu ụzọ.
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: ebe ọ bụ na ọ na-adịgide
  rationale: διά tinyere infinitive nwere article na-egosi ihe kpatara ya; ‘na-adịgide’ na-egosikwa ịnọgide n’ịdị ndụ n’adịghị akwụsị.
- source_word: εἰς τὸν αἰῶνα
  choice: ruo mgbe ebighị ebi
  rationale: Nke a bụ ụzọ Igbo si ekwu oge na-enweghị njedebe n'ụzọ doro anya ma dịkwa mma.
- source_word: ἀπαράβατον
  choice: na-adịgide adịgide
  rationale: Nhọrọ a na-egosi na ọkwa nchụàjà ya anaghị akwụsị ma ọ bụ gafere n’aka onye ọzọ, ma ọ naghị ekpebi naanị otu n’ime nghọta abụọ okwu Grik ahụ nwere ike inwe.
- source_word: ἔχει τὴν ἱερωσύνην
  choice: ọ na-ejide ọkwa nchụàjà ahụ
  rationale: ‘Na-ejide’ na-egosi inwe ma nọgidekwa n’ọkwa ahụ; ‘ọkwa nchụàjà’ na-akọwa ụlọọrụ ma ọ bụ ọnọdụ onye nchụàjà n'ụzọ ndị na-agụ Igbo taa ga-aghọta.
theological_decisions:
- issue: Ihe ἀπαράβατον pụtara banyere ọkwa nchụàjà Kraịst
  choice: A sụgharịrị ya ‘na-adịgide adịgide,’ na-ekwusi ike na ọkwa nchụàjà Jizọs anaghị akwụsị n’ihi na ọ na-adị ndụ ruo mgbe ebighị ebi.
  alternative: ‘anaghị agbanwe agbanwe’ ma ọ bụ ‘a naghị enyefe onye ọzọ’
  rationale: Ọnọdụ okwu a na-atụnyere Jizọs na ndị nchụàjà na-anwụ anwụ, ndị ọzọ ana-anọchi. Nsụgharị ahụ na-edobe isi okwu nke ịdịgide, ebe nkọwa ala peeji na-echekwa ezigbo obosara nghọta nke okwu Grik ahụ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. ‘Ọkwa nchụàjà’ na-eme ka o doo anya na ἱερωσύνη na-ekwu maka ọrụ ma ọ bụ ọnọdụ onye nchụàjà, ọ bụghị naanị ìgwè ndị nchụàjà.
