revisions:
- from: Ma ebe ọ bụ na ọ na-adịgide ruo mgbe ebighị ebi, ọ na-ejide ọkwa nchụàjà ahụ na-adịgide adịgide.[a]
  to: Ma ebe ọ bụ na ọ na-adịgide ruo mgbe ebighị ebi, o nwere ọkwa nchụàjà na-adịgide adịgide.[a]
  rationale: 'Changed only the idiom used for ἔχει: ''o nwere'' is the natural Standard Igbo way to state that he possesses or holds priestly office. The rendering of ἀπαράβατον and its lexical-alternative footnote are retained, with minor stylistic improvement to the footnote.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:28:43Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the causal clause ('because he remains forever') and the priesthood. Its rendering of ἀπαράβατον as 'na-adịgide adịgide' is a defensible contextual rendering and the footnote appropriately preserves the principal lexical alternatives. However, 'na-ejide' is overly literal for ἔχει here and is less idiomatic Igbo for possessing/holding an office.
  naturalness: '''Ọ na-ejide ọkwa nchụàjà'' is not the most natural Standard Igbo expression for having a priestly office. ''O nwere ọkwa nchụàjà'' is clear, natural, and retains the source sense. The revised phrasing also avoids making the verb itself sound physically possessive.'
  terminology: '''Ọkwa nchụàjà'' suitably renders ἱερωσύνη as priestly office. ''Ruo mgbe ebighị ebi'' is standard and appropriate for εἰς τὸν αἰῶνα. The footnote retains both ''unchangeable'' and ''non-transferable'' possibilities without imposing either as the sole meaning.'
  issues:
  - severity: low
    issue: The phrase 'na-ejide ọkwa nchụàjà' is awkward in this context.
    rationale: Although it can be understood from English influence, Standard Igbo normally uses 'inwe' for possessing or occupying such an office. The Greek ἔχει simply states that he has the priesthood.
  revised_text: Ma ebe ọ bụ na ọ na-adịgide ruo mgbe ebighị ebi, o nwere ọkwa nchụàjà na-adịgide adịgide.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “o nwere ọkwa nchụàjà na-enweghị mgbanwe,” ma ọ bụ, “o nwere ọkwa nchụàjà a na-apụghị inyefe onye ọzọ.” Okwu Grik ahụ pụrụ ịpụta nke ọ bụla n’ime ihe ndị a; n’ebe a, isi okwu bụ na, ebe ọ na-adị ndụ ruo mgbe ebighị ebi, ọkwa nchụàjà ya anaghị agafere onye ọzọ.
    reason: lexical_alternative
  revision_rationale: 'Changed only the idiom used for ἔχει: ''o nwere'' is the natural Standard Igbo way to state that he possesses or holds priestly office. The rendering of ἀπαράβατον and its lexical-alternative footnote are retained, with minor stylistic improvement to the footnote.'
