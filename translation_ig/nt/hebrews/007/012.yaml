  verdict: revise
  source_fidelity: The main clause accurately conveys the genitive absolute, the logical necessity expressed by ἐξ ἀνάγκης, and the corresponding change in νόμος. Revising the aspect of “a gbanwere” to the more generic ongoing/conditional “a na-agbanwe” more closely reflects the present participle μετατιθεμένης without materially altering the argument.
  naturalness: The sentence is clear Standard Igbo. “A ghaghị inwekwa mgbanwe n’iwu” is a more direct and idiomatic way to express the logical necessity than “ọ dịkwa mkpa ka e nwee mgbanwe n’iwu.”
  terminology: “Ọrụ nchụaja” suitably represents the priesthood as an office/institution in this context. “Iwu” properly retains the source’s anarthrous breadth. The footnote should give a complete alternative rendering rather than an incomplete subordinate clause.
  issues:
  - severity: low
    issue: The footnote’s quoted alternative is incomplete.
    rationale: “ka e nwee mgbanwe n’Iwu ahụ” omits the sentence’s necessity component and is only a dependent clause. A footnote alternative should supply a complete corresponding rendering while marking the more specific reading “Iwu ahụ.”
  - severity: low
    issue: The main rendering uses a completed-form verb for a present participle.
    rationale: “Mgbe a gbanwere” is understandable as a general condition, but “mgbe a na-agbanwe” better preserves the generic/processual force of μετατιθεμένης.
  revised_text: N’ihi na, mgbe a na-agbanwe ọrụ nchụaja, a ghaghị inwekwa mgbanwe n’iwu.[a]
