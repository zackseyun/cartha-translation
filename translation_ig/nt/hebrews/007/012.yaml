id: HEB.7.12
reference: Hebrews 7:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: ig
  text: N’ihi na, mgbe a na-agbanwe ọrụ nchụaja, a ghaghị inwekwa mgbanwe n’iwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a ghaghị inwekwa mgbanwe n’Iwu ahụ,” ebe “Iwu ahụ” na-ezo kpọmkwem n’Iwu Mosis nke guzobere ọrụ nchụaja ndị Livayị.
    reason: alternative_reading
lexical_decisions:
- source_word: μετατιθεμένης
  choice: mgbe a gbanwere
  rationale: Na-egosipụta mgbanwe site n’otu usoro gaa n’ọzọ, ma na-edobe usoro genitive absolute ahụ n’Igbo dị ka nkebi oge na ihe kpatara ya.
- source_word: ἱερωσύνης
  choice: ọrụ nchụaja
  rationale: Na-ezo aka n’ọkwa na usoro ọrụ ndị nchụaja, ọ bụghị naanị n’omume otu onye nchụaja.
- source_word: ἐξ ἀνάγκης
  choice: ọ dịkwa mkpa
  rationale: Na-egosipụta na mgbanwe nke iwu bụ ihe ga-esorịrị mgbanwe nke ọrụ nchụaja n’echiche arụmụka ahụ.
- source_word: νόμου
  choice: n’iwu
  rationale: 'Na-edobe okwu ahụ ntakịrị ka ọ saa mbara: iwu ma ọ bụ usoro iwu metụtara ọrụ nchụaja, ebe gburugburu okwu ahụ na-ejikọ ya na Iwu Mosis.'
- source_word: μετάθεσις
  choice: mgbanwe
  rationale: Na-edobe njikọ okwu ya na μετατιθεμένης ma na-ada nke ọma n’Igbo.
- source_word: γίνεται
  choice: ka e nwee
  rationale: Na-egosipụta na mgbanwe ahụ na-eme ma ọ bụ na-abịa dịka ihe ga-esorịrị.
- source_word: καὶ
  choice: kwa
  rationale: Na-egosi na mgbanwe n’iwu bụ ihe ọzọ na-esochi mgbanwe nke ọrụ nchụaja.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-ejikọta amaokwu a dịka nkọwa ma ọ bụ ihe kpatara arụmụka dị n’ihu ya.
theological_decisions:
- issue: Oke ihe νόμος na-ezo aka na ya n’ihe gbasara ọrụ nchụaja
  choice: iwu
  alternative: Iwu ahụ, ya bụ Iwu Mosis
  rationale: N’ebe a, νόμος enweghị article n’asụsụ Grik, ya mere isi ederede na-ahapụ ya ka ọ bụrụ iwu ma ọ bụ usoro iwu metụtara ọrụ nchụaja. Ma gburugburu okwu ahụ na-egosi na Iwu Mosis, nke guzobere ọrụ nchụaja ndị Livayị, nọ n’uche.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma doo ndị nkịtị anya. “Ọrụ nchụaja” na-akọwa ụlọ ọrụ ma ọ bụ usoro nchụaja nke ọma karịa okwu nwere ike ịpụta naanị ndị nchụaja n’onwe ha. E debere ntakịrị ambiguiti dị na νόμου site n’isi ederede na nkọwa ala peeji.
