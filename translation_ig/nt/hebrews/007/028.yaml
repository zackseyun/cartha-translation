- from: N’ihi na iwu ahụ na-ahọpụta ụmụ mmadụ ndị nwere adịghị ike ka ha bụrụ ndị isi nchụaja; ma okwu nke iyi ahụ, nke bịara mgbe iwu ahụ gasịrị, na-ahọpụta Ọkpara[a] onye e meworo ka o zuo oke ruo mgbe ebighị ebi.[b]
  to: N’ihi na iwu ahụ na-ahọpụta ụmụ mmadụ ndị nwere adịghị ike ka ha bụrụ ndị isi nchụaja; ma okwu nke iyi ahụ, nke bịara mgbe iwu ahụ gasịrị, na-ahọpụta Ọkpara[a] onye e meworo ka o zuo oke ruo mgbe ebighị ebi.[b]
