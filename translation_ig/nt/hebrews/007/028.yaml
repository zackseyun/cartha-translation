id: HEB.7.28
reference: Hebrews 7:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: ig
  text: N’ihi na iwu ahụ na-ahọpụta ụmụ mmadụ ndị nwere adịghị ike ka ha bụrụ ndị isi nchụaja; ma okwu nke iyi ahụ, nke bịara mgbe iwu ahụ gasịrị, na-ahọpụta Ọkpara[a] onye e meworo ka o zuo oke ruo mgbe ebighị ebi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, e dere “Ọkpara” n’enweghị mkpụrụokwu na-egosi “the.” Nke a na-eme ka ntụnyere ya na “ụmụ mmadụ” pụta ìhè, ma n’okwu gbara ya gburugburu ọ ka na-ezo aka na Jizọs.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “onye e mere ka o ruo mmezu zuru ezu ruo mgbe ebighị ebi.” Ngwaa Grik ahụ nwekwara ike ịpụta, n’ihe gbasara ọrụ nchụaja, “onye e doro nsọ maka ọrụ ruo mgbe ebighị ebi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: iwu ahụ
  rationale: Ọ na-ezo aka n’iwu Mosis, karịchaa usoro iwu gbasara ọrụ nchụaja; “ahụ” na-egosi na ọ bụ iwu ahụ a maara n’okwu gbara ya gburugburu.
- source_word: καθίστησιν
  choice: na-ahọpụta ... ka ha bụrụ
  rationale: N’ebe a, ngwaa ahụ pụtara ịhọpụta ma ọ bụ idobe mmadụ n’ọkwa ọrụ; nhazi a bụ Igbo doro anya ma dịkwa mma n’ihe gbasara ọkwa onye isi nchụaja.
- source_word: ἀνθρώπους
  choice: ụmụ mmadụ
  rationale: Nke a na-edobe ntụnyere dị n’etiti ndị bụ mmadụ na Ọkpara, n’agbanyeghị na ndị jidere ọkwa nchụaja ahụ n’akụkọ ihe mere eme bụ ndị ikom.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Ọtụtụ ndị jidere otu ọkwa onye isi nchụaja n’oge dị iche iche ka okwu Grik ahụ na-ekwu maka ha.
- source_word: ἔχοντας ἀσθένειαν
  choice: ndị nwere adịghị ike
  rationale: Nke a na-edobe aha ἀσθένεια; ọ pụtara adịghị ike mmadụ na ọnọdụ nke imehie ma ọ bụ ịda mba, ọ bụghị naanị ọrịa anụ ahụ.
- source_word: λόγος τῆς ὁρκωμοσίας
  choice: okwu nke iyi ahụ
  rationale: Ọ bụ okwu Chineke kwuru n’ụdị iyi, nke Akwụkwọ Nsọ dekọrọ; nsụgharị a na-edobe ma “okwu” ma “iyi.”
- source_word: τῆς μετὰ τὸν νόμον
  choice: nke bịara mgbe iwu ahụ gasịrị
  rationale: 'Ọ na-eme ka usoro oge doo anya: e nyere okwu iyi ahụ mgbe e nyesịrị iwu ahụ.'
- source_word: υἱόν
  choice: Ọkpara
  rationale: Igbo anaghị eji mkpụrụokwu pụrụ iche egosi ọdịiche dị n’etiti “a Son” na “the Son.” “Ọkpara” na-ezo aka n’Ọkpara ahụ a na-ekwu maka ya n’Akwụkwọ Ndị Hibru, ebe nkọwa ala peeji na-echekwa eziokwu na Grik enweghị article.
- source_word: εἰς τὸν αἰῶνα
  choice: ruo mgbe ebighị ebi
  rationale: Nke a bụ ụzọ Igbo si ekwu nke ọma banyere ihe na-adịgide adịgide ruo mgbe ebighị ebi.
- source_word: τετελειωμένον
  choice: onye e meworo ka o zuo oke
  rationale: 'Nke a na-egosipụta perfect passive participle: e meela ka Ọkpara ruo n’izu oke ma ọnọdụ ahụ ka dị. Ọ na-echekwa echiche nke izu oke ma ọ bụ iru nzube ya n’ọrụ nchụaja.'
theological_decisions:
- issue: υἱόν enweghị article ma e jiri ya tụnyere ἀνθρώπους
  choice: Ọkpara[a]
  alternative: otu Ọkpara; Ọkpara ahụ
  rationale: Itinye “otu” nwere ike ime ka okwu ahụ yie ka ọ na-ekwu naanị banyere ọnụọgụ, ebe “Ọkpara ahụ” ga-etinye definiteness nke na-adịghị n’ụdị Grik. “Ọkpara” bụ Igbo kachasị eke, nkọwa ala peeji na-echekwakwa mgbagwoju anya nke Grik.
- issue: Ihe τετελειωμένον pụtara n’ozizi Akwụkwọ Ndị Hibru banyere ọrụ nchụaja
  choice: onye e meworo ka o zuo oke ruo mgbe ebighị ebi
  alternative: onye e doro nsọ maka ọrụ ruo mgbe ebighị ebi; onye e mere ka o ruo mmezu zuru ezu
  rationale: Nhọrọ a na-edobe okwu Akwụkwọ Ndị Hibru gbasara izu oke na mmezu kama ịkọwa ya naanị dị ka ido nsọ maka ọrụ nchụaja.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere ntụnyere dị n’etiti ndị isi nchụaja bụ mmadụ na Ọkpara, tinyere perfect passive nke τετελειωμένον. E tinyere akara nkọwa [a] n’akụkụ “Ọkpara” na [b] n’akụkụ okwu banyere izu oke ka ha kwekọọ n’ihe nkọwa nke ọ bụla na-akọwa.
