  text: καὶ γὰρ ὁ θεὸς ἡμῶν πῦρ καταναλίσκον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/029.yaml
  text: For our God is a consuming fire[a][b].
translation:
  language: ig
  text: N’ihi na Chineke anyị bụ ọkụ na-erepịa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu a na-emegharị echiche dị na Diuterọnọmi 4:24, ebe a kọwara Chineke dịka “ọkụ na-erepịa.”
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọkụ nke na-erepịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: N’ihi na
  rationale: γὰρ na-enye ihe kpatara ịdọ aka ná ntị dị n’amaokwu bu ụzọ; καὶ etinyela n’echiche ahụ ka Igbo ghara ịdị arọ ma ọ bụ bụrụ nke a sụgharịrị mkpụrụokwu n’ụzọ na-adịghị eke.
- source_word: ὁ θεὸς ἡμῶν
  choice: Chineke anyị
  rationale: Nke a bụ ụzọ Igbo si ekwu ihe mmadụ nwe ma ọ bụ mmekọrịta ya n’ụzọ kwekọrọ n’okwu Grik, ma na-echekwa echiche nke Chineke nke ọgbakọ ahụ.
- source_word: πῦρ
  choice: ọkụ
  rationale: Nke a na-echekwa ihe atụ doro anya nke Grik na njikọ ya na Diuterọnọmi 4:24, kama ịkọwa ya dịka nanị ihe yiri ọkụ.
- source_word: καταναλίσκον
  choice: na-erepịa ihe niile
  rationale: ‘Na-erepịa’ na-egosi ọrụ ọkụ ahụ na-arụ; ‘ihe niile’ na-eme ka okwu ahụ bụrụ Igbo eke ma na-egosipụta ike ngwaa καταναλίσκω nke ịla ihe n’iyi kpamkpam, n’ebughị ụzọ kọwaa kpọmkwem ihe ọkụ ahụ na-erepịa.
theological_decisions:
- issue: Ịkọwa Chineke dịka ọkụ n’ihe atụ
  choice: 'E debere ya dịka nkwupụta kpọmkwem: “Chineke anyị bụ ọkụ na-erepịa ihe niile.”'
  alternative: “Chineke anyị dị ka ọkụ na-erepịa ihe niile.”
  rationale: Grik jiri ahịrịokwu nhata, ọ bụghị akara ntụnyere. Ya mere, ịghara itinye “dị ka” na-echekwa ike nke ịdọ aka ná ntị ahụ na njikọ ya na Diuterọnọmi 4:24.
- issue: Ma καταναλίσκον bụ nkọwa ọkụ ka ọ bụ ahịrịokwu mmeju
  choice: “ọkụ na-erepịa ihe niile”
  alternative: “ọkụ nke na-erepịa”
  rationale: Nhọrọ bụ isi bụ Igbo dị ire ma na-echekwa participle ahụ dịka nkọwa nke ọkụ. Ihe odide ala peeji na-edebe ụzọ ọzọ e si nwee ike ịhazi okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. E debere ihe atụ nke ọkụ n’enweghị ime ka ọ bụrụ ntụnyere, ma jiri “na-erepịa” gosipụta omume na-aga n’ihu na ike nke okwu Grik.
