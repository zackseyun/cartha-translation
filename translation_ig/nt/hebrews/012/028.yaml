- from: Ya mere, ebe anyị na-anata alaeze nke a na-apụghị ime ka ọ maa jijiji, ka anyị nwee amara[a]; site n’amara ahụ ka anyị wee jeere Chineke ozi n’ụzọ na-atọ ya ụtọ, jiri nkwanye ùgwù na egwu dị omimi.
  to: Ya mere, ebe ọ bụ na anyị na-anata alaeze nke a na-apụghị ịma jijiji, ka anyị nwee amara[a]; site n’amara ahụ ka anyị wee jeere Chineke ozi n’ụzọ na-atọ ya ụtọ, jiri nkwanye ùgwù na egwu dị omimi.
