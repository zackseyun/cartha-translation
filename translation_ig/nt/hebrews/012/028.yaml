id: HEB.12.28
reference: Hebrews 12:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: ig
  text: Ya mere, ebe ọ bụ na anyị na-anata alaeze nke a na-apụghị ịma jijiji, ka anyị nwee amara[a]; site n’amara ahụ ka anyị wee jeere Chineke ozi n’ụzọ na-atọ ya ụtọ, jiri nkwanye ùgwù na egwu dị omimi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịtụgharị ya, “ka anyị nwee obi ekele.” Nkebiokwu Grik ἔχωμεν χάριν nwere ike ịpụta “ka anyị nwee amara,” ma ọ bụ, dị ka akpaala okwu, “ka anyị nwee obi ekele.”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya banyere ịma jijiji na iwepụ ihe ndị e kere eke.
- source_word: βασιλείαν ἀσάλευτον
  choice: alaeze nke a na-apụghị ime ka ọ maa jijiji
  rationale: Nkebiokwu a na-echekwa ọdịiche dị n’etiti alaeze ahụ na ihe ndị nwere ike ịma jijiji, ma dokwaa ya n’Igbo doro anya.
- source_word: παραλαμβάνοντες
  choice: ebe anyị na-anata
  rationale: Ọ na-egosipụta participle dị na present dị ka ọnọdụ na-aga n’ihu nke ndụmọdụ na-esochi.
- source_word: ἔχωμεν χάριν
  choice: ka anyị nwee amara
  rationale: Nke a na-echekwa isi okwu χάρις dị ka ‘amara’ ma mee ka δι’ ἧς na-esochi ya nwee ike izo aka n’amara dị ka ụzọ e si eje ozi na-anabata Chineke. A kọwara nghọta ọzọ, ‘ka anyị nwee ekele,’ n’okpuru amaokwu.
- source_word: δι’ ἧς
  choice: site n’amara ahụ
  rationale: Ọ na-eme ka ihe nnọchiaha nwanyị ahụ na-ezo aka na χάριν pụta ìhè ma chekwaa echiche nke ụzọ ma ọ bụ ihe enyemaka e ji eme ihe.
- source_word: λατρεύωμεν
  choice: ka anyị wee jeere Chineke ozi
  rationale: ‘Ijere Chineke ozi’ na-egosipụta ozi okpukpe a na-enye Chineke n’emeghị ka ihe okwu ahụ pụtara bụrụ naanị ofufe e ji abụ ma ọ bụ ekpere.
- source_word: εὐαρέστως
  choice: n’ụzọ na-atọ ya ụtọ
  rationale: Nke a bụ Igbo ebumpụta ụwa nke na-egosi omume Chineke na-anabata ma na-enwe mmasị na ya.
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: jiri nkwanye ùgwù na egwu dị omimi
  rationale: ‘Nkwanye ùgwù’ na-egosipụta εὐλάβεια, ebe ‘egwu dị omimi’ na-echekwa ịdị arọ nke δέος n’enweghị ime ya ka ọ bụrụ naanị ụjọ na-akụda mmụọ.
theological_decisions:
- issue: Ihe χάριν pụtara na ἔχωμεν χάριν
  choice: amara
  alternative: ekele / inwe obi ekele
  rationale: Usoro okwu ahụ na-akwado ‘amara’ n’ihi na δι’ ἧς (‘site na ya’) nwere ike izo aka n’amara dị ka ihe na-enyere ndị kwere ekwe aka ijere Chineke ozi n’ụzọ ọ na-anabata. Ma ‘ekele’ bụkwa nghọta asụsụ Grik nwere ike inwe, ya mere e debere ya n’okpuru amaokwu kama iwepụ mgbagwoju anya ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. E chekwara njikọ arụmụka ahụ, omume ịnata alaeze na-aga n’ihu, na mgbagwoju anya dị n’etiti ‘amara’ na ‘ekele.’
