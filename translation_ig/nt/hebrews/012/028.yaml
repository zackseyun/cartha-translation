    text: Enwere ike ịtụgharị ya, “ka anyị nwee obi ekele.” Nkebiokwu Grik ἔχωμεν χάριν nwere ike ịpụta “ka anyị nwee amara,” ma ọ bụ, dị ka akpaala okwu, “ka anyị nwee obi ekele.”
    reason: alternative_reading
  revision_rationale: The revision removes an unnecessary causative nuance from the description of the unshakable kingdom, smooths the introductory clause, and makes the alternative-rendering footnote idiomatic while retaining the lexical and theological ambiguity of ἔχωμεν χάριν.
