    text: A pụkwara ịsụgharị ya, “Tachienụ obi, were ihe unu na-edi dịka ọzụzụ.” Grik ahụ nwere ike ịpụta ma ka unu tachie obi maka ọzụzụ, ma ọ bụ ka unu were ihe unu na-edi dịka ọzụzụ.
    reason: alternative_reading
  - marker: b
    text: Grik kwuru “ụmụ nwoke.” Okwu a na-echekwa ihe atụ nna na ụmụ nwoke dị n’arụmụka ahụ; ihe a na-ekwu anaghị emetụta naanị ndị nwoke.
    reason: lexical_alternative
  revision_rationale: The revision replaces punitive terminology with “ọzụzụ/azụ,” which better represents the linked Greek terms παιδεία and παιδεύει as parental discipline and formative training. It also renders the opening in a way that retains εἰς παιδείαν and leaves its debated relation to ὑπομένετε available through the footnote. The masculine father–son imagery remains explicit, while the note appropriately clarifies its representative application.
