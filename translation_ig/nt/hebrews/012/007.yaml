id: HEB.12.7
reference: Hebrews 12:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: ig
  text: Tachienụ obi maka ọzụzụ[a]; Chineke na-emeso unu dịka ụmụ nwoke[b]. N’ihi na olee nwa nwoke nna na-adịghị azụ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Tachienụ obi, were ihe unu na-edi dịka ọzụzụ.” Grik ahụ nwere ike ịpụta ma ka unu tachie obi maka ọzụzụ, ma ọ bụ ka unu were ihe unu na-edi dịka ọzụzụ.
    reason: alternative_reading
  - marker: b
    text: Grik kwuru “ụmụ nwoke.” Okwu a na-echekwa ihe atụ nna na ụmụ nwoke dị n’arụmụka ahụ; ihe a na-ekwu anaghị emetụta naanị ndị nwoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: maka ntaramahụhụ
  rationale: Nkebiokwu a nwere ike igosi nzube ma ọ bụ otú e kwesịrị isi ghọta ahụhụ ahụ. N’ahịrị isi, ‘Dienụ ntaramahụhụ’ na-ejikọta idi ihe na ọzụzụ Chineke n’enweghị ịgbakwunye ihe e kwuru kpọmkwem; nkọwa ala peeji na-echekwa nghọta ọzọ.
- source_word: ὑπομένετε
  choice: Dienụ
  rationale: Ọdịdị Grik nwere ike ịbụ nkwupụta ma ọ bụ iwu, ma n’ọnọdụ a ọ na-arụ ọrụ nke ọma dịka agbamume. ‘Dienụ’ bụ okwu Igbo dị mfe ma sie ike, ọ naghị etinye ihe a na-edi nke na-anọghị n’ederede.
- source_word: παιδεία / παιδεύει
  choice: ntaramahụhụ / enye ntaramahụhụ
  rationale: N’ebe a, okwu ndị a metụtara ọzụzụ nna nke nwere mgbazi na ịkpụzi omume. ‘Ntaramahụhụ’ na-eme ka njikọ okwu ahụ pụta ìhè n’akụkụ abụọ nke amaokwu ahụ, ọ bụ ezie na echiche ahụ karịrị naanị ịta ahụhụ.
- source_word: ὡς υἱοῖς
  choice: dị ka ụmụ nwoke
  rationale: Nke a na-echekwa ntụnyere kpọmkwem nke nna na ụmụ nwoke nke arụmụka ahụ ji arụ ọrụ, kama ime ka asụsụ nwoke dị na Grik ghọọ okwu na-anọpụ iche.
- source_word: προσφέρεται
  choice: na-emeso
  rationale: N’ọnọdụ a, ngwaa ahụ na-egosi otú Chineke si akpa àgwà n’ebe ha nọ. ‘Na-emeso’ bụ Igbo eke ma doo anya karịa nsụgharị nkịtị nke pụrụ iduhie.
- source_word: τίς γὰρ υἱὸς
  choice: N’ihi na olee nwa nwoke
  rationale: Nke a na-enye ajụjụ nkwupụta ahụ n’Igbo dị ugbu a ma na-echekwa ike nke γὰρ dịka ihe na-enye ihe kpatara okwu bu ya ụzọ.
- source_word: ὃν οὐ παιδεύει πατήρ
  choice: nna ya na-adịghị enye ntaramahụhụ
  rationale: Igbo chọrọ ka mmekọrịta ahụ doo anya nke ọma; ‘nna ya’ na-enye ajụjụ ahụ ọdịdị eke, ebe ‘enye ntaramahụhụ’ na-echekwa njikọ ya na παιδεία.
theological_decisions:
- issue: Asụsụ nwoke n’ihe atụ nke nna na nwa nwoke
  choice: Jiri ‘ụmụ nwoke’ na ‘nwa nwoke’ n’ahịrị isi
  alternative: ụmụ / ụmụaka
  rationale: Arụmụka ahụ dabere n’ihe atụ nna na ụmụ nwoke, ya mere a na-echekwa onyinyo nwoke nke υἱός. Nkọwa ala peeji na-eme ka o doo anya na ihe a na-ekwu gbasara ọgbakọ ndị kwere ekwe niile, ọ bụghị naanị ndị nwoke.
- issue: Mgbagwoju anya dị na εἰς παιδείαν ὑπομένετε
  choice: Dienụ ntaramahụhụ
  alternative: Were ihe unu na-edi dị ka ntaramahụhụ
  rationale: Grik nwere ike ịbụ agbamume ka ha die maka ọzụzụ, ma ọ bụ ka ha were ihe ha na-edi dịka ọzụzụ. Ahịrị isi na-adị nkenke, ebe nkọwa ala peeji na-echekwa ụzọ nghọta abụọ ahụ n’enweghị idozi mgbagwoju anya ahụ n’ike.
translation_notes:
  register: Standard Igbo, n’ụdị dị ùgwù ma dị mfe nghọta. E ji ‘Dienụ’ nye agbamume ozugbo, e jikwa ‘na-emeso unu’ mee ka mmekọrịta Chineke na ndị a na-agwa okwu bụrụ Igbo eke. Akara nkọwa [a] na [b] dị n’ahịrị isi dịka achọrọ.
