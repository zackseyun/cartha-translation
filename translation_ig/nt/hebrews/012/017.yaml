review_pass:
  verdict: revise
  source_fidelity: The temporal sequence, desire to inherit the specific blessing, rejection, concessive tears, and ambiguity of αὐτήν are retained. However, “ịgbanwe obi” is a useful explanatory gloss but is not the best main-text equivalent for μετανοία, whose established biblical Igbo rendering is “nchegharị.” The idiomatic τόπον is appropriately represented as “ohere.”
  naturalness: The sentence is fluent Standard Igbo and has an appropriately sober register. “Ọ hụghị ohere maka nchegharị” is more idiomatic than the infinitival “ohere ịgbanwe obi” and reads naturally in a formal biblical context.
  terminology: Replace “ịgbanwe obi” in the text with “nchegharị” to preserve the NT theological term without deciding whether the change in question is Esau’s repentance or, interpretively, Isaac’s reversal. The footnote can retain “mgbanwe obi” as an explanatory alternative. “Ngọzi,” “iketa,” “Aịzik,” and “Ịsọ” are suitable.
  issues:
  - severity: medium
    issue: The main text renders μετανοίας as “ịgbanwe obi.”
    rationale: While semantically related, this loses the standard biblical Igbo theological term “nchegharị” and may make the main text sound as though the Greek explicitly refers only to a change of decision. “Nchegharị” better preserves the source term; the footnote should preserve the interpretive alternatives.
  revised_text: N’ihi na unu maara na mgbe e mesịrị[a], mgbe ọ chọrọ iketa ngọzi ahụ, a jụrụ ya; n’ihi na ọ hụghị ohere maka nchegharị[b], ọ bụ ezie na o ji anya mmiri chọọ ya.
