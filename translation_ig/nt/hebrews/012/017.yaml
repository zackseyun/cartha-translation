id: HEB.12.17
reference: Hebrews 12:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: ig
  text: N’ihi na unu maara na mgbe e mesịrị[a], mgbe ọ chọrọ iketa ngọzi ahụ, a jụrụ ya; n’ihi na ọ hụghị ohere maka nchegharị[b], ọ bụ ezie na o ji anya mmiri chọọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, mgbe ihe ndị a gasịrị.
    reason: temporal_clarification
  - marker: b
    text: N’ụzọ nkịtị, “ọ hụghị ebe maka nchegharị.” Nke a pụrụ ịpụta na ọ hụghị ụzọ isi gbanwee ihe si pụta, ma ọ bụ na o nweghị ike ime ka Aịzik gbanwee uche ya. “Ya” n’ikpeazụ nwekwara ike izo aka na ngọzi ahụ ma ọ bụ na nchegharị ahụ/ohere maka nchegharị; asụsụ Grik akọwaghị nke ọ bụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴστε
  choice: unu maara
  rationale: Ọ bụ ịkpọ ndị na-agụ akwụkwọ ahụ ka ha cheta ihe ha maara; ụdị perfect a nwere nghọta nke ugbu a.
- source_word: μετέπειτα
  choice: mgbe e mesịrị
  rationale: Nke a na-egosi oge sochiri ihe a kọwara banyere Ịsọ n’amaokwu bu ụzọ.
- source_word: κληρονομῆσαι τὴν εὐλογίαν
  choice: iketa ngọzi ahụ
  rationale: “Iketa” na-echekwa echiche nke inweta ihe dị ka ihe nketa, ebe “ngọzi ahụ” na-ezo aka na ngọzi nna a maara n’akụkọ Ịsọ.
- source_word: ἀπεδοκιμάσθη
  choice: a jụrụ ya
  rationale: Nke a bụ Igbo doro anya nke na-egosi na a nabataghị arịrịọ ya, n’etinyeghị echiche pụrụ iche gbasara nzọpụta.
- source_word: μετανοίας ... τόπον
  choice: ohere ịgbanwe obi
  rationale: Akpaokwu Grik pụtara n’ụzọ nkịtị “ebe maka mgbanwe obi,” ma n’ebe a “ohere” na-enye nghọta akpaokwu ahụ n’Igbo dị ugbu a. “Ịgbanwe obi” na-ahapụ ohere ma ọ̀ bụ nchegharị Ịsọ, mgbanwe ihe si pụta, ma ọ bụ mgbanwe uche Aịzik.
- source_word: μετὰ δακρύων ἐκζητήσας αὐτήν
  choice: o ji anya mmiri chọọ ya
  rationale: Nke a na-echekwa ụzọ o si chọọ ya na nnọchiaha na-adịghị akọwapụta kpọmkwem ihe “ya” na-ezo aka na ya.
theological_decisions:
- issue: Ihe αὐτήν (“ya”) na-ezo aka na ya, na nghọta μετανοίας τόπον
  choice: E debere “ya” n’ahịrị bụ isi ka ọ ghara idozi ma ọ na-ezo aka na ngọzi ahụ ma ọ bụ ohere ịgbanwe obi.
  alternative: A pụrụ ịkọwa ya kpọmkwem dị ka ngọzi ahụ; a pụkwara ịghọta mgbanwe obi ahụ dị ka enweghị ike Ịsọ ịgbanwe ihe si pụta, ma ọ bụ enweghị ike ime ka Aịzik gbanwee uche ya.
  rationale: N’asụsụ Grik, ma “ngọzi” ma “mgbanwe obi” bụ aha nwanyị nke nnọchiaha αὐτήν pụrụ izo aka na ha. Ya mere, nsụgharị ahụ na ihe odide ala ala peeji na-echekwa ejighị n’aka ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ịgbanwe obi” bụ okwu nkịtị ma sara mbara nke na-echekwa esemokwu dị n’etiti nchegharị na mgbanwe uche; nkọwa ala peeji na-egosi nkọwa ndị ọzọ n’enweghị ịmanye otu echiche.
