review_pass:
  verdict: revise
  source_fidelity: A chọrọ mmezi abụọ maka ikwesị ntụkwasị obi n’ahịrịokwu Grik na n’usoro ndepụta ya. Ἐκκλησίᾳ πρωτοτόκων kwesịrị ịbụ “ọgbakọ nke ndị e buru ụzọ mụọ”; “e bu ụzọ mụọ” adịghị mma dịka usoro Igbo ebe a. Ọzọkwa, dativ ndị atọ na-aga n’ihu n’okpuru ngwaa amaokwu bu ụzọ; ịgbakwunye “n'ebe … nọ” ugboro abụọ na-etinye echiche ebe/ọnọdụ na-enweghị n’ihe Grik kwuru.
  naturalness: Nsụgharị a degharịrị na-adị n’Igbo Izugbe nke oge a ma na-echekwa ụda ndepụta na-adabere n’amaokwu bu ụzọ. Iwepu “n'ebe … nọ” na-eme ka ahịrịokwu ahụ ghara ịdị arọ ma ghara ikwughachi ihe na-adịghị mkpa.
  terminology: “Ọgbakọ,” “ndị e buru ụzọ mụọ,” “ndị e debanyere aha ha,” “Onyeikpe mmadụ niile,” na “mmụọ nke ndị ezi omume e meworo ka ha zuo oke” na-edobe okwu ndị bụ isi na isiokwu ‘izu oke’ nke Ndị Hibru. Nkọwa ala peeji a degharịrị anaghị akọwa plural Grik dị ka “eluigwe niile,” nke ga-agbakwunye ‘niile’ na-adịghị na Grik.
  issues:
  - severity: medium
    issue: E ji “e bu ụzọ mụọ” mee πρωτοτόκων.
    rationale: N’Igbo Izugbe, usoro kwesịrị ekwesị maka ‘those born first/firstborn’ bụ “ndị e buru ụzọ mụọ.”
  - severity: medium
    issue: E tinyere “n'ebe Chineke … nọ” na “n'ebe mmụọ … nọ.”
    rationale: Ihe ndị a na-etinye echiche ebe na ngwaa “nọ” nke na-adịghị n’ahịrịokwu Grik; ha na-akpaghasịkwa ndepụta dativ nke na-adabere na “unu abịawo” n’amaokwu 22.
  - severity: medium
    issue: Nkọwa ala peeji kwuru “n'eluigwe niile.”
    rationale: Ụdị ọtụtụ οὐρανοῖς anaghị apụta ‘heavens all.’ Nkọwa ahụ kwesịrị naanị igosi na Grik ji ụdị ọtụtụ, ebe Igbo na-eji “n’eluigwe” n’ụzọ nkịtị.
  revised_text: nakwa n’ọgbakọ nke ndị e buru ụzọ mụọ, ndị e debanyere aha ha n’eluigwe[a], nakwa Chineke, Onyeikpe mmadụ niile, nakwa mmụọ nke ndị ezi omume e meworo ka ha zuo oke,
