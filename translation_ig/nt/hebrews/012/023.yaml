id: HEB.12.23
reference: Hebrews 12:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐκκλησίᾳ πρωτοτόκων ⸂ἀπογεγραμμένων ἐν οὐρανοῖς⸃, καὶ κριτῇ θεῷ πάντων, καὶ πνεύμασι δικαίων τετελειωμένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/023.yaml
  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: ig
  text: nakwa n’ọgbakọ nke ndị e buru ụzọ mụọ, ndị e debanyere aha ha n’eluigwe[a], nakwa Chineke, Onyeikpe mmadụ niile, nakwa mmụọ nke ndị ezi omume e meworo ka ha zuo oke,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’eluigwe.” N’asụsụ Grik, okwu ahụ bụ “eluigwe” dị n’ụdị ọtụtụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: ọgbakọ
  rationale: “Ọgbakọ” na-egosi ndị gbakọrọ ọnụ n'ụzọ doro anya, n'etinyeghị echiche ụlọ ọrụ ụka nke oge ndị sochirinụ.
- source_word: πρωτοτόκων
  choice: ndị e bu ụzọ mụọ
  rationale: Nke a na-edobe ya dị ka aha ọtụtụ mmadụ ma ghara ịgbakwunye “ụmụ nwoke,” nke Grik ekwughị kpọmkwem.
- source_word: ἀπογεγραμμένων
  choice: ndị e debanyere aha ha
  rationale: Ọ na-egosi ndebanye aha e mecharala nke ka na-adị ire, ma na-edobe ihe oyiyi nke akwụkwọ ndekọ.
- source_word: ἐν οὐρανοῖς
  choice: n'eluigwe
  rationale: Nke a bụ ụzọ Igbo si ekwu ya n'ụzọ ebumpụta ụwa; ihe odide Grik ji ụdị ọtụtụ, ya mere e tinyere nkọwa ala peeji.
- source_word: κριτῇ θεῷ πάντων
  choice: Chineke, Onyeikpe mmadụ niile
  rationale: A haziri ya dị ka nkọwa aha na-esote “Chineke,” wee mee ka ọrụ ikpe ya pụta ìhè n'Igbo dị mfe nghọta.
- source_word: πνεύμασι
  choice: mmụọ
  rationale: Nke a bụ ihe okwu Grik pụtara ozugbo, n'enweghị ịgbakwunye nkọwa banyere ọnọdụ ndị ahụ.
- source_word: δικαίων
  choice: ndị ezi omume
  rationale: Ọ na-egosi ọtụtụ mmadụ n'ụzọ gụnyere nwoke na nwaanyị, n'ekwughị “ndị ikom.”
- source_word: τετελειωμένων
  choice: e meworo ka ha zuo oke
  rationale: Ọ na-edobe olu nnara na echiche nke omume e mecharala nke nsonaazụ ya ka dị, yana isiokwu izu oke dị n'akwụkwọ Ndị Hibru.
theological_decisions:
- issue: Ndị a kpọrọ “ndị e bu ụzọ mụọ”
  choice: A hapụrụ ya dị ka aha ọtụtụ ndị nwere ọnọdụ ma ọ bụ ihe nketa nke onye e bu ụzọ mụọ.
  alternative: Ịghọta ya dị ka Kraịst naanị ya, ebe ọgbakọ ahụ bụ nke ya.
  rationale: Ụdị ọtụtụ nke πρωτοτόκων na-akwado na ọ na-ekwu banyere ìgwè mmadụ; nsụgharị ahụ anaghị akọwakwu ozizi karịrị ihe okwu Grik kwuru.
- issue: Ndị “mmụọ nke ndị ezi omume e meworo ka ha zuo oke” na-ezo aka na ha
  choice: A sụgharịrị ya dị ka mmụọ nke ndị ezi omume, n'enweghị nkọwa ọzọ banyere ọnọdụ ha.
  alternative: Ịkọwa ya kpọmkwem dị ka ndị ezi omume nwụrụ anwụ nọ n'ọnọdụ etiti, ma ọ bụ dị ka ndị ezi omume niile ma ha nwere ahụ ma ọ bụ na ha enweghị.
  rationale: Ihe odide ahụ na-ekwu “mmụọ,” ma ọ naghị akọwa usoro zuru ezu banyere ọnọdụ ha; nsụgharị ahụ na-echekwa oke ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ahịrịokwu ahụ ka ọ bụrụ akụkụ ndepụta na-aga n'ihu site n'amaokwu bu ya ụzọ, dịka ọ dị n'ihe odide Grik.
