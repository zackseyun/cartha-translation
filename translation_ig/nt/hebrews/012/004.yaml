  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὔπω μέχρις αἵματος ἀντικατέστητε πρὸς τὴν ἁμαρτίαν ἀνταγωνιζόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/004.yaml
  text: You have not yet resisted to the point of shedding blood in your struggle against sin,[a]
translation:
  language: ig
  text: Unu eguzogidebeghị ruo n’ókè ọbara ga-awụfu n’ịlụso mmehie ọgụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu eguzogidebeghị ruo n’ọbara.” N’asụsụ Grik, okwu ahụ bụ n’ụzọ nkịtị, “unu eguzogidebeghị ruo n’ọbara”; ọ bụ akpaalaokwu nke pụtara iguzogide ruo n’ókè ọbara ga-awụfu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: erubeghị
  rationale: Na-egosi na ruo ugbu a, ha erubeghị n’ókè ahụ; okwu a bụ ụzọ Igbo si ekwu ‘not yet’ n’ụzọ ebumpụta ụwa.
- source_word: μέχρις αἵματος
  choice: n’ókè nke ịwụfu ọbara
  rationale: Na-akọwa akpaalaokwu Grik nke pụtara iguzogide ruo n’ókè ọbara ga-awụfu, ma ọ bụ site ná mmerụ ahụ siri ike ma ọ bụ ọnwụ.
- source_word: ἀντικατέστητε
  choice: Unu erubeghị ... n’ịlụso ... ọgụ
  rationale: Ngwaa ahụ na-egosi iguzogide ma ọ bụ ịlụso ihe ọgụ. N’Igbo, nhazi a jikọtara iguzogide ahụ na onyonyo asọmpi/ọgụ dị na participle so ya.
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: ịlụso mmehie ọgụ
  rationale: πρός na accusative ebe a na-egosi mmegide. ‘Mmehie’ na-ahapụ ihe ọ na-ezo aka na ya ka ọ dị obosara dịka Grik si mee.
- source_word: ἀνταγωνιζόμενοι
  choice: n’ịlụso ... ọgụ
  rationale: Na-egosi ọgụ ma ọ bụ asọmpi na-aga n’ihu, ma na-akọwa ọnọdụ ha ji eguzogide.
theological_decisions:
- issue: Ihe ‘mmehie’ na-ezo aka na ya n’ọnọdụ a
  choice: E depụtara ya n’ozuzu dịka ‘mmehie’
  alternative: Mmegide mmehie nke ndị na-akpagbu ha; mmehie n’ozuzu; ọnwụnwa ịhapụ okwukwe
  rationale: Amaokwu ahụ akọwaghị kpọmkwem nke ọ bụ. Ịhapụ okwu ahụ ka ọ dị obosara na-echekwa mgbagwoju anya na nrụgide nkà mmụta okpukpe dị n’ihe odide Grik.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ùgwù ma doo ndị na-agụ akwụkwọ taa anya. A họọrọ ‘ịlụso mmehie ọgụ’ iji debe onyonyo ọgụ/asọmpi nke Grik, ebe ‘n’ókè nke ịwụfu ọbara’ na-eme ka akpaalaokwu ahụ doo anya n’enweghị ikwu kpọmkwem ma ọ bụ mmerụ ahụ ma ọ bụ ọnwụ.
