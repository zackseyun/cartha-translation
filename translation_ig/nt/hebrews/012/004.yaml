revisions:
- from: Unu erubeghị n’ókè nke ịwụfu ọbara n’ịlụso mmehie ọgụ.[a]
  to: Unu eguzogidebeghị ruo n’ókè ọbara ga-awụfu n’ịlụso mmehie ọgụ.[a]
  rationale: The revision renders the aorist main verb explicitly as “eguzogidebeghị,” while retaining “n’ịlụso mmehie ọgụ” for the accompanying ongoing-struggle participle. It preserves the source’s broad reference to sin and its idiomatic bloodshed limit. The footnote is corrected for grammatical Standard Igbo and source accuracy.
  reviewer_model: gpt-5.6-terra
