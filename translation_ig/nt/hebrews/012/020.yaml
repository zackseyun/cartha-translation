  text: οὐκ ἔφερον γὰρ τὸ διαστελλόμενον· Κἂν θηρίον θίγῃ τοῦ ὄρους, λιθοβοληθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: ig
  text: 'N’ihi na ha enweghị ike ịnagide ihe e nyere n’iwu: “Ọ bụrụ na ọbụna anụmanụ emetụ ugwu ahụ aka[a], a ga-eji nkume tụgbuo ya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide oge ochie gbakwụnyere, “ma ọ bụ jiri akụ gbaa ya,” nke kwekọrọ n’ihe dị n’Ọpụpụ 19:12–13.
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: ha enweghị ike ịnagide
  rationale: N’ọnọdụ a, φέρω ya na nkwusioru pụtara enweghị ike iburu ma ọ bụ ịnagide ihe; okwu a bụ Igbo doro anya nke na-egosi na ha enweghị ike ịtachi obi n’iwu ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: γάρ na-enye nkọwa maka okwu bu ya ụzọ; “N’ihi na” na-edobe njikọ nkọwa ahụ n’Igbo nkịtị.
- source_word: τὸ διαστελλόμενον
  choice: ihe e nyere n’iwu
  rationale: Nkebi participle a na-ezo aka n’ihe e nyere dịka iwu siri ike. Nsụgharị a na-edobe echiche nke iwu ahụ n’emeghị ka ihe Gris kwuru saa mbara karịa ya.
- source_word: Κἂν
  choice: Ọ bụrụ na ọbụna
  rationale: κἄν jikọtara ọnọdụ na nkwusi ike; “Ọ bụrụ na ọbụna” na-egosi na anụmanụ adịghịkwa ewepụ n’iwu ahụ.
- source_word: θηρίον
  choice: anụmanụ
  rationale: θηρίον nwere ike ịpụta anụ ọhịa ma ọ bụ anụmanụ n’ozuzu. “Anụmanụ” adịghị amanye echiche na ọ bụ naanị anụ ọhịa.
- source_word: θίγῃ
  choice: emetụ ... aka
  rationale: N’Igbo, “imetụ ihe aka” bụ ụzọ ebumpụta ụwa isi kwuo ‘touch’; ụdị ọnọdụ ahụ na-anọgide doo anya.
- source_word: τοῦ ὄρους
  choice: ugwu ahụ
  rationale: Gris kwuru naanị “ugwu ahụ.” Ọ bụ ezie na gburugburu amaokwu na-egosi Saịnaị, etinyeghị aha ahụ n’ebe a.
- source_word: λιθοβοληθήσεται
  choice: a ga-eji nkume tụgbuo ya
  rationale: Nke a na-edobe ọdịdị ọdịnihu na passive nke ngwaa Gris ma na-eji okwu Igbo ugbu a, doro anya maka igbu mmadụ ma ọ bụ anụmanụ site n’ịtụ ya nkume.
theological_decisions:
- issue: Mmekọrịta okwu e hotara na iwu e nyere na Saịnaị
  choice: 'A sụgharịrị naanị okwu dị n’ihe odide SBLGNT: a ga-eji nkume tụgbuo anụmanụ metụrụ ugwu ahụ aka.'
  alternative: Ịgbakwunye “ma ọ bụ jiri àkụ gbaa ya” dịka ụfọdụ ihe odide na ọdịnala Ọpụpụ 19:12–13 si dị.
  rationale: Ihe odide Gris enyere kwụsịrị na λιθοβοληθήσεται. Ya mere, e tinyeghị okwu ọzọ n’ahụ amaokwu ahụ; e debere ọdịiche ihe odide ahụ n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “E nyere n’iwu” na-egosi ikike nke iwu ahụ, ebe “a ga-eji nkume tụgbuo ya” na-edobe passive na ịdị njọ nke ntaramahụhụ ahụ. Akara ala ala peeji [a] dị ozugbo n’akụkụ “ugwu ahụ,” dịka e nyere.
