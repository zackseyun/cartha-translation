  text: οὗ ἡ φωνὴ τὴν γῆν ἐσάλευσεν τότε, νῦν δὲ ἐπήγγελται λέγων· Ἔτι ἅπαξ ἐγὼ ⸀σείσω οὐ μόνον τὴν γῆν ἀλλὰ καὶ τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/026.yaml
  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: ig
  text: Onye olu ya mere ka ụwa maa jijiji mgbe ahụ, ma ugbu a o kwela nkwa, sị:[b] “Ọzọkwa, otu ugboro, aga m-eme ka ọ bụghị naanị ụwa kamakwa eluigwe[a] maa jijiji.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ‘eluigwe’ dị n’ọnụọgụ otu ma soro isiokwu kpọmkwem; n’ụzọ nkịtị, ‘eluigwe ahụ.’
    reason: lexical_alternative
  - marker: b
    text: Okwu e hotara na Hagaị 2:6.
    reason: cross_reference
lexical_decisions:
- source_word: οὗ ἡ φωνὴ
  choice: Onye olu ya
  rationale: Nke a na-ejikọta onye a na-ekwu okwu ya na Chineke e kwuru banyere ya n’amaokwu ndị bu ụzọ, ma na-edobe ‘olu’ dị ka olu onye na-ekwu okwu, ọ bụghị naanị ụda.
- source_word: ἐσάλευσεν
  choice: mere ka … maa jijiji
  rationale: Nkebiokwu a bụ ụzọ Igbo si ekwu n'ụzọ doro anya na olu ahụ kpatara ụwa ịma jijiji, ma na-edobe ike nke ihe mere na Saịnaị.
- source_word: τὴν γῆν
  choice: ụwa
  rationale: N’ihi na a na-atụnyere ya na eluigwe, ‘ụwa’ na-egosi akụkụ nke ihe e kere eke niile, ọ bụghị naanị otu ala ma ọ bụ ala mmadụ na-azọ ụkwụ.
- source_word: τότε … νῦν δὲ
  choice: mgbe ahụ, ma ugbu a
  rationale: Nke a na-edobe ọdịiche oge dị n’etiti ịma jijiji nke gara aga na nkwa ahụ ka dị ire ugbu a.
- source_word: ἐπήγγελται
  choice: o kwela nkwa
  rationale: Oge perfect nke ngwaa Grik na-egosi nkwa e kwere nke ka dị ire; ‘o kwela nkwa’ na-egosipụta nke a nke ọma n’Igbo.
- source_word: Ἔτι ἅπαξ
  choice: Ọzọkwa, naanị otu ugboro ọzọ
  rationale: Nke a na-edobe ma echiche nke ‘ọzọ’ ma nkwusi ike na ọ bụ otu ugboro ọzọ.
- source_word: ἐγὼ σείσω
  choice: m ga-eme ka … maa jijiji
  rationale: A na-edobe onye mbụ nke Chineke ji kwuo okwu na ọdịnihu nke ịma jijiji ahụ.
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: ọ bụghị naanị … kama … kwa
  rationale: Nke a bụ usoro Igbo doro anya nke na-egosipụta njikọ na mgbasawanye dị n’ahịrịokwu Grik.
- source_word: τὸν οὐρανόν
  choice: eluigwe
  rationale: ‘Eluigwe’ na-edobe nnukwu ọdịiche nke ụwa na eluigwe ma ghara ime ka okwu ahụ bụrụ naanị mbara igwe a na-ahụ anya.
theological_decisions:
- issue: Onye οὗ na onye kwere nkwa ahụ na-ezo aka na ya
  choice: E gosiri na ọ bụ otu Chineke ahụ ka ‘Onye olu ya’ na ‘o kwela nkwa’ na-ezo aka na ya.
  alternative: Ịsụgharị ya n’ụzọ na-eme ka onye nwe olu ahụ ma ọ bụ onye kwere nkwa ahụ ghara ido anya.
  rationale: Ihe gbara amaokwu ahụ gburugburu na okwu e hotara na Hagaị na-egosi na Chineke bụ onye na-ekwu okwu; nsụgharị ahụ mere njikọ a ka o doo anya n’enweghị ịgbakwunye nkọwa ozizi ọzọ.
- issue: Oke echiche nke ‘ụwa’ na ‘eluigwe’
  choice: E jiri ‘ụwa’ na ‘eluigwe’ mee ihe dị ka ụzọ sara mbara isi kọwaa ihe e kere eke.
  alternative: ‘Ala’ na ‘mbara igwe.’
  rationale: Njikọ okwu abụọ ahụ na-egosi mgbanwe metụtara usoro ihe e kere eke n’ozuzu ya; nsụgharị sara mbara na-edobe ike okwu amụma ahụ ma ghara ịkọwa kpọmkwem otú ọ ga-esi mee.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Mere ka … maa jijiji’ bụ ahịrịokwu Igbo eke maka causative cosmic shaking. E debere ọdịiche ‘mgbe ahụ/ugbu a,’ nkwusi ike ‘otu ugboro ọzọ,’ na nhazi ‘ọ bụghị naanị … kama … kwa.’
