revisions:
- from: Onye olu ya mere ka ụwa maa jijiji mgbe ahụ, ma ugbu a o kwela nkwa, sị:[b] “Ọzọkwa, naanị otu ugboro ọzọ, m ga-eme ka ọ bụghị naanị ụwa, kama ka eluigwe[a] kwa maa jijiji.”
  to: Onye olu ya mere ka ụwa maa jijiji mgbe ahụ, ma ugbu a o kwela nkwa, sị:[b] “Ọzọkwa, otu ugboro, aga m-eme ka ọ bụghị naanị ụwa kamakwa eluigwe[a] maa jijiji.”
  rationale: The revision removes the duplicated expression of ‘once more,’ improves the natural Igbo syntax of the not-only/but-also construction, and clarifies the grammatical terminology in footnote a. It retains the source’s relative reference to God, the perfect promise, the future first-person quotation, and the comprehensive earth/heaven imagery without imposing an interpretive framework.
