  text: καὶ τροχιὰς ὀρθὰς ⸀ποιεῖτε τοῖς ποσὶν ὑμῶν, ἵνα μὴ τὸ χωλὸν ἐκτραπῇ, ἰαθῇ δὲ μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/013.yaml
  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
translation:
  language: ig
  text: Meenụ ụzọ kwụ ọtọ maka ụkwụ unu,[a] ka onye ngwọrọ ghara ịhapụ ụzọ,[b] kama ka a gwọọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nwekwara ike ịbụ, “jiri ụkwụ unu mee ụzọ kwụ ọtọ.”
    reason: lexical_alternative
  - marker: b
    text: O nwekwara ike ịbụ, “ka ọ ghara ịpụ n’ọnọdụ ya” ma ọ bụ “ka a ghara ikwatu nkwonkwo ya”; ngwaa Grik ahụ pụrụ inwe nghọta metụtara ịgwọ ahụ n’ime ihe atụ nke ahụ e ji ebe a. Okwu a na-akpọghachi Ilu 4:26 ma na-aga n’ihu n’ihe onyonyo nke ije n’ụzọ ziri ezi.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: τροχιὰς
  choice: ụzọ
  rationale: Okwu a nwere ike ịpụta akara ụzọ ma ọ bụ ụzọ ụkwụ si aga; “ụzọ” bụ okwu Igbo doro anya nke na-edobe ihe atụ nke ije ndụ.
- source_word: ὀρθὰς
  choice: kwụ ọtọ
  rationale: Ọ na-akọwa ụzọ ziri ezi, nke na-adịghị agbagọ, ma kwekọọ n’onyonyo nke ụzọ a ga-eso.
- source_word: ποιεῖτε
  choice: Meekwanụ
  rationale: Ọ bụ iwu nye ọtụtụ mmadụ, nke nwere echiche nke omume a ga-anọgide na-eme; “Meekwanụ” na-egosipụta nke a n’Igbo eke.
- source_word: τοῖς ποσὶν ὑμῶν
  choice: maka ụkwụ unu
  rationale: Dative ahụ dabara n’echiche nke ụzọ e mere maka ụkwụ ha, ọ bụghị naanị ụzọ ụkwụ ha mepụtara.
- source_word: τὸ χωλὸν
  choice: ihe ahụ nke ngwọrọ
  rationale: Neuter singular nke Grik na-ahapụ onye ma ọ bụ ihe a na-ekwu maka ya ka ọ ghara ido anya. Nsụgharị a na-edobe nghọtahie ahụ ma nọgide n’onyonyo nke ahụ.
- source_word: ἐκτραπῇ
  choice: si n’ụzọ wezuga onwe ya
  rationale: Nke a na-ebute isi echiche nke isi n’ụzọ pụọ, ma hapụkwa nghọta metụtara nkwonkwo ahụ n’ala ala peeji.
- source_word: ἰαθῇ
  choice: ka a gwọọ ya
  rationale: “Ịgwọ” na-edobe ihe onyonyo ahụike na ebumnuche nke iweghachi ihe na-adịghị ike.
- source_word: μᾶλλον
  choice: kama
  rationale: Ọ na-egosipụta ọdịiche doro anya n’etiti ihe a na-achọ izere na ihe ka mma a chọrọ ka o mee.
theological_decisions:
- issue: Ma ihe onyonyo nke ngwọrọ bụ nke anụ ahụ n’ezie ka ọ bụ ihe atụ nke adịghị ike ime mmụọ
  choice: E debere okwu banyere ahụ n’amaokwu ahụ n’akọwaghị kpọmkwem onye ma ọ bụ ụdị adịghị ike ọ na-anọchi anya ya.
  alternative: Ịsụgharị ya kpọmkwem dị ka ndị kwere ekwe na-adịghị ike n’ime mmụọ, ma ọ bụ dị ka ndị na-adịghị ike n’ozuzu.
  rationale: Asụsụ Grik na-eji ihe onyonyo nke ahụ n’ime ndụmọdụ omume, ma ọ naghị ekpebi kpọmkwem ma ọ bụ nke anụ ahụ ma ọ bụ nke ime mmụọ; idebe esemokwu ahụ na-ezere ịtinye nkọwa okpukpe na-adịghị n’ederede.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “ihe ahụ nke ngwọrọ” debe ụdị neuter na nghọtahie nke Grik, n’agbanyeghị na ọ dị ntakịrị arọ karịa “onye ngwọrọ.”
