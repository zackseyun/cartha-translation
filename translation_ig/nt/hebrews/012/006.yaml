  text: ὃν γὰρ ἀγαπᾷ κύριος παιδεύει, μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/006.yaml
  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: ig
  text: N’ihi na Onyenweanyị na-enye onye ọ hụrụ n’anya ọzụzụ, ọ na-apịakwa ụtarị[a] nwa nwoke ọ bụla[b] ọ na-anabata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-apịa” ma ọ bụ “na-eti ihe otiti.” Ngwaa Grik a siri ike, na-egosikwa ọzụzụ na-egbu mgbu nke ukwuu.
    reason: lexical_alternative
  - marker: b
    text: “Nwa nwoke ọ bụla” na-egosipụta okwu Grik e ji mee ihe. N’ebe a, ọ na-anọchite anya ndị niile Chineke na-anabata dị ka ụmụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: onye ... ọ
  rationale: Usoro a bụ ụzọ Igbo si ekwu okwu njikọ nke na-ezo aka n’otu onye ma na-enye okwu ahụ ike izugbe.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi ihe mere e ji kwuo agbamume dị n’amaokwu bu ụzọ.
- source_word: ἀγαπᾷ
  choice: hụrụ n’anya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ịhụ mmadụ n’anya.
- source_word: κύριος
  choice: Onyenweanyị
  rationale: Ọ na-echekwa aha nsọpụrụ κύριος n’ụzọ e ji ya eme ihe n’Igbo Ndị Kraịst nke oge a.
- source_word: παιδεύει
  choice: na-enye ... ọzụzụ
  rationale: Ọzụzụ gụnyere ịkụziri mmadụ, ịgbazi ya, na ịdọ ya aka ná ntị; ya mere, ọ naghị eme ka okwu ahụ bụrụ naanị ntaramahụhụ.
- source_word: μαστιγοῖ
  choice: na-apịa ... ụtarị
  rationale: Okwu a siri ike ma na-egosi ịpịa mmadụ ụtarị; nsụgharị a anaghị eme ka ihe mgbu dị n’ihe atụ ahụ dị nro.
- source_word: δὲ
  choice: -kwa
  rationale: Mgbakwunye -kwa jikọtara nkebi nke abụọ na nke mbụ n’ụzọ na-aga n’ihu, kama igosi nnukwu mmegide.
- source_word: πάντα υἱὸν
  choice: nwa nwoke ọ bụla
  rationale: Ọ na-echekwa okwu nwoke nke Grik na ihe oyiyi nke ịbụ nwa nwoke, ebe nkọwa ala peeji na-eme ka ike nnọchiteanya ya doo anya.
- source_word: παραδέχεται
  choice: nabatara
  rationale: ‘Nabatara’ na-egosi ịnabata mmadụ na mmekọrịta na ihu ọma, dịka ihe gbara amaokwu a gburugburu si kwado.
theological_decisions:
- issue: Otu e si sụgharịa υἱός n’okwu banyere ọzụzụ Chineke na ịbụ ụmụ ya
  choice: nwa nwoke ọ bụla
  alternative: nwa ọ bụla
  rationale: Ihe odide Grik ji υἱός, ‘nwa nwoke,’ ma isiokwu nke ịbụ ụmụ nwoke dị mkpa n’amaokwu ndị gbara ya gburugburu. Nkọwa ala peeji na-akọwa na okwu a na-anọchite anya ndị niile Chineke nabatara dị ka ụmụ ya.
- issue: Ike okwu μαστιγοῖ n’ihe gbasara ọzụzụ Chineke
  choice: na-apịa ... ụtarị
  alternative: na-enye ahụhụ siri ike
  rationale: A hapụrụ ihe atụ ahụ n’ike ya iji chekwaa esemokwu dị n’etiti ịhụnanya Chineke na ọzụzụ na-egbu mgbu, kama ime ka ọ dị nro.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. ‘Na-enye ... ọzụzụ’ na-egosipụta ma ntụziaka ma mgbazi; ‘na-apịa ... ụtarị’ na-echekwa ike ihe atụ Grik. E debere ‘nwa nwoke’ n’isiokwu ahụ ma kọwaa ike nnọchiteanya ya n’ala peeji.
