  naturalness: The first clause is clear and suitably formal. In the second clause, placing “ụtarị” immediately after “na-apịa” is more natural Igbo word order and makes the severe action easier to follow.
  terminology: “Onyenweanyị,” “ọzụzụ,” and “nwa nwoke ọ bụla” are suitable Standard Igbo choices in this register. “Na-apịa ụtarị” retains the force of μαστιγοῖ without softening it. The footnotes should use matching present-aspect wording where they explain the main text.
