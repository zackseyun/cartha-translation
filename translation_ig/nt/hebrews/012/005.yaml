id: HEB.12.5
reference: Hebrews 12:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: ig
  text: 'Unu echefuolakwa okwu ndụmọdụ ahụ nke na-ekwu okwu nye unu dịka ụmụ nwoke: “Nwa m nwoke[a], elela ọzụzụ[b] nke Onyenweanyị anya dị ka ihe na-abaghị uru, adakwala mbà mgbe ọ na-agbazi gị.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya “Nwa m.” N’asụsụ Grik, okwu ahụ bụ kpọmkwem “nwa nwoke”; otu ahụ ka okwu e bu ụzọ jiri gwa ndị na-agụ akwụkwọ a bụ “ụmụ nwoke.”
    reason: lexical_alternative
  - marker: b
    text: “Ọzụzụ” nwekwara ike ịgụnye “mgbazi” ma ọ bụ “ịdọ aka ná ntị”; ọ bụghị naanị ntaramahụhụ.
    reason: lexical_alternative
  - marker: c
    text: Nke a bụ okwu e hotara n’Ilu 3:11.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: unu echefuolakwa
  rationale: Oge perfect na-egosi na ha echefuola ya ma ka nọ n’ọnọdụ ahụ; “echefuolakwa” na-echekwa ụda ịbara ha mba na njikọ καί.
- source_word: παρακλήσεως
  choice: okwu ndụmọdụ
  rationale: N’ebe a okwu ahụ bụ ndụmọdụ na-adọ aka ná ntị ma na-agbakwa ume; “okwu ndụmọdụ” dabara n’okwu sitere n’Ilu.
- source_word: ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται
  choice: nke na-agwa unu okwu dị ka ụmụ nwoke
  rationale: Nke a na-egosi na Akwụkwọ Nsọ na-agwa ndị na-agụ ya okwu ozugbo, ma na-echekwa okwu nwoke bụ υἱοῖς.
- source_word: Υἱέ μου
  choice: Nwa m nwoke
  rationale: Ọ na-echekwa vocative singular na okwu nwoke nke Ilu 3:11 n’ụzọ doro anya n’Igbo.
- source_word: ὀλιγώρει
  choice: elela ... anya dị ka ihe na-abaghị uru
  rationale: Nkebiokwu a na-egosi ile ihe anya dị ka ihe nta ma ọ bụ ihe na-enweghị uru, n’enweghị ime ka ọ sie ike ruo n’ókè “ịkpọ asị.”
- source_word: παιδείας
  choice: ọzụzụ
  rationale: “Ọzụzụ” nwere ike ịgụnye ịkụzi, ịzụlite, na mgbazi; ya mere ọ naghị egbochi obosara παιδεία ka ọ bụrụ naanị ntaramahụhụ.
- source_word: κυρίου
  choice: nke Onyenwe anyị
  rationale: Ọ na-echekwa genitive ahụ na aha nsọpụrụ κύριος n’asụsụ Igbo a na-asụkarị.
- source_word: ἐκλύου
  choice: adakwala mbà
  rationale: Nke a na-egosi ịda mba ma ọ bụ ịkwụsị inwe ume n’okpuru mgbazi.
- source_word: ὑπ’ αὐτοῦ ἐλεγχόμενος
  choice: mgbe ọ na-agbazi gị
  rationale: “Na-agbazi” dabara n’ọnọdụ ọzụzụ nne na nna ma na-egosi ntụpọ a na-ekpughe ma dozie, n’enweghị ime ka okwu ahụ sie ike karịa isi mmalite.
theological_decisions:
- issue: Okwu υἱοῖς / Υἱέ nke na-akọwa ụmụ ndị nwoke
  choice: “ụmụ nwoke” / “Nwa m nwoke” n’isi ederede
  alternative: “ụmụ” / “Nwa m”
  rationale: Isi mmalite ji okwu nwoke mee ihe, na-ehota Ilu ma na-akwado arụmụka Hibru banyere ọnọdụ nwa nwoke; nkọwa ala peeji na-egosi na a na-agwa ụmụ Chineke niile okwu.
- issue: Ihe παιδεία pụtara n’etiti Chineke na ụmụ ya
  choice: “ọzụzụ”
  alternative: “mgbazi” ma ọ bụ “ịdọ aka ná ntị”
  rationale: “Ọzụzụ” na-ahapụ ma akụkụ ịzụlite mmadụ ma akụkụ mgbazi ka ha dị, kama ime ka okwu ahụ bụrụ naanị ntaramahụhụ ma ọ bụ naanị nkuzi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E chekwara okwu nwoke nke isi mmalite, ma kọwaa ike nnọchiteanya ya n’ala peeji. Nkebiokwu “elela ... anya dị ka ihe na-abaghị uru” bụ ntụgharị Igbo kwụ ọtọ nke na-ezere ma okwu ochie ma ịgbasị ike ὀλιγώρει.
