  to: 'Unu echefuolakwa okwu ndụmọdụ ahụ nke na-ekwu okwu nye unu dịka ụmụ nwoke: “Nwa m nwoke[a], elela ọzụzụ[b] nke Onyenweanyị anya dị ka ihe na-abaghị uru, adakwala mbà mgbe ọ na-agbazi gị.”[c]'
  rationale: The revision makes the introductory clause more idiomatic, retains the masculine son-language as far as Igbo permits, corrects the lexical footnote's scope and removes unnecessary interpretation, uses an unqualified Igbo divine title for κυρίου, and relocates the quotation cross-reference anchor to the quotation as a whole.
