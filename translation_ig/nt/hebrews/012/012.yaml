  yaml_path: translation/nt/hebrews/012/012.yaml
  text: Therefore[a], strengthen your drooping hands and your weakened knees,
translation:
  language: ig
  text: Ya mere[a], welitenụ aka unu ndị dara mbà na ikpere unu ndị na-adịghị ike,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu a na-ekwughachi Aịzaya 35:3 dịka ọ dị n’ọdịnala Grik. N’ụzọ nkịtị karịa, ọ na-ekwu maka aka ndị a hapụrụ ka ha daa na ikpere ndị na-adịghị ike; ihe oyiyi ahụ na-akpọ ndị mmadụ ka ha nwetaghachi obi ike na ntachi obi.
