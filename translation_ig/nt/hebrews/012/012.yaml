review_pass:
  verdict: revise
  source_fidelity: Διὸ is accurately represented by “Ya mere,” and the two descriptions of weakened body parts are substantially conveyed. However, “meenụ ka ... sie ike” interprets ἀνορθώσατε as strengthening rather than retaining its primary, concrete imperative sense, “raise/lift up; make upright.” The direct bodily image should be preserved in the main text.
  naturalness: The draft is understandable Standard Igbo, but “meenụ ka ... sie ike” is more periphrastic than needed. “Welitenụ” is natural, concise, and better matches the force and imagery of the Greek imperative. “Aka unu ndị dara mbà” and “ikpere unu ndị na-adịghị ike” are idiomatic and suitable.
  terminology: No doctrinally loaded terminology is involved. “Dara mbà” and “na-adịghị ike” appropriately express the figurative exhaustion of the hands and knees. The footnote’s “aka ndị tọgbọrọ” is unsuitable here, since tọgbọ can suggest being bare or uncovered rather than hands hanging slack; it should be replaced.
  issues:
  - severity: medium
    issue: The main verb is rendered interpretively as “meenụ ka ... sie ike.”
    rationale: ἀνορθώσατε directly calls the hearers to raise up or set upright the drooping hands and weakened knees. Although renewed strength is the contextual implication, the translation should retain the physical metaphor in the main line.
  - severity: medium
    issue: The footnote uses “aka ndị tọgbọrọ.”
    rationale: This does not naturally convey παρειμένας (“hanging slack/drooping”) in Standard Igbo and may be understood in a different sense. A note should use wording such as “aka ndị a hapụrụ ka ha daa” if it explains the more literal image.
