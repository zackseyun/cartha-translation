lexical_decisions:
- source_word: Διὸ
  choice: Ya mere
  rationale: Ọ bụ njikọ na-egosi nkwubi okwu na ndụmọdụ a sitere n’ihe e kwuru tupu ya; “Ya mere” bụ okwu Igbo doro anya ma dị nkenke.
- source_word: παρειμένας χεῖρας
  choice: aka unu ndị dara mbà
  rationale: Nkebi a na-akọwa aka ndị tọgbọrọ ma ọ bụ dara ada n’ihi ike ọgwụgwụ. “Dara mbà” na-edobe ihe atụ ahụ ma na-ada ka Igbo nkịtị; e tinyere “unu” n’ihi na iwu ahụ bụ maka ndị a na-agwa okwu.
- source_word: παραλελυμένα γόνατα
  choice: ikpere unu ndị na-adịghị ike
  rationale: Okwu Grik ahụ na-egosi ikpere ndị ghọrọ ndị na-enweghị ume, ọ bụghị na ọ ga-abụrịrị mkpọnwụ n’ụzọ ọrịa. Nsụgharị a na-edobe ihe atụ nke adịghị ike n’enweghị ime ka ọ bụrụ okwu ọgwụgwọ.
- source_word: ἀνορθώσατε
  choice: meenụ ka ... sie ike
  rationale: Iwu a na-akpọ ndị na-ege ntị ka ha mee ihe ozugbo iji welite ma mee ka akụkụ ahụ dara mbà guzosie ike. N’ọnọdụ a, okwu ahụ na-ezo aka n’inweta ume na ntachi obi ọzọ.
theological_decisions:
- issue: Ndụmọdụ e ji ihe atụ nke adịghị ike anụ ahụ kwuo
  choice: E debere aka na ikpere dị ka ihe atụ, ma e jiri “meenụ ka ... sie ike” gosipụta oku a na-akpọ ha ka ha nwetaghachi ume na ntachi obi.
  alternative: “Welitenụ aka ndị tọgbọrọ na ikpere ndị na-adịghị ike.”
  rationale: Ihe gbara amaokwu a gburugburu na-ekwu banyere ntachi obi na ịnabata ịdọ aka ná ntị. Nsụgharị ahụ anaghị eme ya naanị iwu gbasara otu mmadụ ga-esi guzo, ma ọ naghị ewepụkwa ihe atụ anụ ahụ sitere n’ederede.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Dara mbà” na “na-adịghị ike” bụ okwu ndị mmadụ na-eji kwa ụbọchị, ebe usoro iwu “meenụ ka ... sie ike” na-edobe ụda ndụmọdụ siri ike nke amaokwu ahụ.
