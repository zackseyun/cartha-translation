  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασι πάντες, ἄρα νόθοι ⸂καὶ οὐχ υἱοί ἐστε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: ig
  text: Ma ọ bụrụ na unu enweghị ọzụzụ ahụ nke ndị niile ketarala òkè na ya, mgbe ahụ unu bụ ụmụ a mụrụ n'èzí alụmdi na nwunye, ọ bụghịkwa ụmụ nwoke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείας
  choice: ịdọ aka ná ntị
  rationale: N'ọnọdụ a, ọ pụtara ọzụzụ na mgbazi nke nna na-enye ụmụ ya; okwu a na-edobe echiche nke mgbazi n'ụzọ Igbo nke onye nkịtị ga-aghọta.
- source_word: μέτοχοι γεγόνασι
  choice: sonyere na ya
  rationale: Na-egosipụta na ha aghọwo ndị nwere oke n'ọzụzụ ahụ, n'okwu Igbo dị mfe ma bụrụkwa nke okike.
- source_word: νόθοι
  choice: ụmụ a mụrụ n'alụghị di na nwunye
  rationale: Na-ebute echiche ọdịnala nke ụmụ na-enweghị ọnọdụ iwu nke ụmụ nke nna ahụ, ma na-ezere okwu mkparị siri ike nke nwere ike ime ka isi ntụnyere ahụ ghara ido anya.
- source_word: υἱοί
  choice: ụmụ nwoke
  rationale: Na-edobe ọdịiche kpọmkwem nke Greek n'etiti νόθοι na υἱοί, yana ihe gbasara ọnọdụ na ihe nketa ụmụ nwoke n'ụwa oge ahụ.
- source_word: πάντες
  choice: mmadụ niile
  rationale: Na-edobe obosara okwu Greek n'emeghị ka ọ bụrụ naanị otu ìgwè a kpọrọ aha n'ụzọ doro anya.
theological_decisions:
- issue: Ma ‘mmadụ niile’ ọ bụ mmadụ niile n'ụwa ka ọ bụ ụmụ Chineke niile
  choice: mmadụ niile
  alternative: ụmụ ya niile
  rationale: Greek kwuru πάντες naanị ya. Nsụgharị ahụ na-edobe obosara na ntakịrị mgbagwoju anya ya kama ịgbakwunye nkọwa nkà mmụta okpukpe.
- issue: Ọnọdụ nke νόθοι na υἱοί
  choice: ụmụ a mụrụ n'alụghị di na nwunye ... ụmụ nwoke
  alternative: ụmụ iwu na-akwadoghị ... ezi ụmụ
  rationale: Nhọrọ a na-edobe esemokwu gbasara ịbụ onye a nabatara dị ka nwa na onye ga-eketa ihe, n'agbanyeghị na okwu ahụ na-ada ntakịrị ike n'Igbo.
translation_notes:
  register: 'Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘unu’ kwupụta onye nke abụọ n''ọnụọgụ ọtụtụ. E debere usoro arụmụka ahụ: ma ọ bụrụ ... mgbe ahụ.'
