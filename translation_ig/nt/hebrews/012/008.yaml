revisions:
- from: Ma ọ bụrụ na unu anọghị n'okpuru ịdọ aka ná ntị ahụ nke mmadụ niile sonyere na ya, mgbe ahụ unu bụ ụmụ a mụrụ n'alụghị di na nwunye, unu abụghịkwa ụmụ nwoke.
  to: Ma ọ bụrụ na unu enweghị ọzụzụ ahụ nke ndị niile ketarala òkè na ya, mgbe ahụ unu bụ ụmụ a mụrụ n'èzí alụmdi na nwunye, ọ bụghịkwa ụmụ nwoke.
  rationale: 'The revision follows the Greek sequence closely: absence of παιδεία; the discipline in which all have become participants; and the consequent contrast between νόθοι and υἱοί. It avoids expanding πάντες to ''God''s children'' or otherwise resolving the contextual scope beyond the text.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:30:03Z'
review_pass:
  verdict: revise
  source_fidelity: The conditional argument and the contrast in the Greek are retained, but the draft's 'anọghị n'okpuru' adds an 'under' relationship not expressed by χωρίς, and 'sonyere na ya' weakens μέτοχοι γεγόνασι ('have become partakers/sharers').
  naturalness: The revision uses direct, modern Standard Igbo. 'Enweghị ọzụzụ' is more idiomatic and contextually apt for παιδεία in Hebrews 12 than the administrative-sounding 'ịdọ aka ná ntị.'
  terminology: παιδεία is rendered 'ọzụzụ,' preserving the parental formation/correction sense in this context. νόθοι is retained with a non-euphemistic but non-slur description of illegitimate birth status. υἱοί remains 'ụmụ nwoke,' reflecting the source's deliberate historical/legal contrast with νόθοι without importing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: '''anọghị n''okpuru ịdọ aka ná ntị'''
    rationale: χωρίς means 'without,' not specifically 'not under.' The added locative framing is unnecessary, while παιδεία here includes formative training as well as correction.
  - severity: medium
    issue: '''sonyere na ya'' for μέτοχοι γεγόνασι'
    rationale: This can mean merely 'joined in it'; the perfect construction says that all have become participants/shareholders in the discipline.
  - severity: low
    issue: Wording of illegitimacy phrase
    rationale: '''ụmụ a mụrụ n''alụghị di na nwunye'' is understandable, but ''ụmụ a mụrụ n''èzí alụmdi na nwunye'' is more natural and less syntactically ambiguous in contemporary Standard Igbo.'
  revised_text: Ma ọ bụrụ na unu enweghị ọzụzụ ahụ nke ndị niile ketarala òkè na ya, mgbe ahụ unu bụ ụmụ a mụrụ n'èzí alụmdi na nwunye, ọ bụghịkwa ụmụ nwoke.
  revised_footnotes: []
  revision_rationale: 'The revision follows the Greek sequence closely: absence of παιδεία; the discipline in which all have become participants; and the consequent contrast between νόθοι and υἱοί. It avoids expanding πάντες to ''God''s children'' or otherwise resolving the contextual scope beyond the text.'
