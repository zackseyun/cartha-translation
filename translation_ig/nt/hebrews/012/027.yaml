    text: A pụkwara ịsị, “dịka ihe e kere eke.” N’asụsụ Grik, okwu ahụ bụ n’ụzọ nkịtị, “dịka ihe e mere.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ihe ndị a na-apụghị ime ka ha maa jijiji,” ma ọ bụ “ihe na-apụghị ịma jijiji.”
    reason: alternative_reading
  revision_rationale: The revision removes the unwarranted causative element, restores the direct parallel between the two Greek participial expressions, and uses idiomatic Standard Igbo. It renders ὡς πεποιημένων as “dịka ihe e mere,” retaining the explanatory comparison and the sense that the shakable things belong to the made order. The main text continues to preserve the source’s less interpretive wording for what is not shaken; the more explicitly unshakable reading remains in a footnote.
