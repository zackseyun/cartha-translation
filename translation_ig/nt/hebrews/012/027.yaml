  text: τὸ δὲ Ἔτι ἅπαξ δηλοῖ ⸂τῶν σαλευομένων⸃ μετάθεσιν ὡς πεποιημένων, ἵνα μείνῃ τὰ μὴ σαλευόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: ig
  text: Okwu a, “Ọzọ otu ugboro,” na-egosi iwepụ ihe ndị na-ama jijiji—dịka ihe e mere[a]—ka ihe ndị na-adịghị ama jijiji[b] dịgide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “dịka ihe e kere eke.” N’asụsụ Grik, okwu ahụ bụ n’ụzọ nkịtị, “dịka ihe e mere.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ihe ndị a na-apụghị ime ka ha maa jijiji,” ma ọ bụ “ihe na-apụghị ịma jijiji.”
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: Okwu a, “Ọzọkwa, naanị otu ugboro,”
  rationale: τὸ na-eme ka okwu e hotara bụrụ ihe a na-ekwu maka ya; δέ bụ njikọ dị nro. Nsụgharị a na-egosi na onye dere akwụkwọ na-akọwa okwu ahụ e hotara n’amaokwu gara aga.
- source_word: δηλοῖ
  choice: na-egosi
  rationale: Na-enye nghọta doro anya banyere nkwubi okwu onye dere akwụkwọ na-ewepụta site n’okwu ahụ e hotara.
- source_word: τῶν σαλευομένων
  choice: ihe ndị a na-eme ka ha maa jijiji
  rationale: Na-echekwa ọdịdị present passive participle ahụ, ya na myirịta ya na τὰ μὴ σαλευόμενα.
- source_word: μετάθεσιν
  choice: na a ga-ewepụ
  rationale: N’ebe a, okwu ahụ pụtara iwepụ ihe ndị na-ama jijiji, ọ bụghị nanị ịgbanwe ha; e tinyere ọdịdị ngwaa ka Igbo wee na-aga were were.
- source_word: ὡς πεποιημένων
  choice: ebe ha bụ ihe e mere eme
  rationale: Na-echekwa ὡς dịka nkọwa banyere ihe ndị ahụ, nakwa perfect passive nke na-egosi na ha so n’ihe e mere.
- source_word: ἵνα μείνῃ
  choice: ka ... wee dịgide
  rationale: Ụdị Igbo a na-egosi nzube ma ọ bụ ihe ga-esi n’iwepụ ahụ pụta.
- source_word: τὰ μὴ σαλευόμενα
  choice: ihe ndị a na-adịghị eme ka ha maa jijiji
  rationale: Na-echekwa nkwụkọ okwu na-adịghị agbanwe agbanwe dị n’etiti participle abụọ ahụ, kama ịtụgharị ya ozugbo dịka enweghị ike ime ka ha maa jijiji.
theological_decisions:
- issue: Ma a ga-atụgharị τὰ μὴ σαλευόμενα dịka ihe a na-adịghị eme ka ha maa jijiji, ka ọ bụ ihe a na-apụghị ime ka ha maa jijiji.
  choice: ihe ndị a na-adịghị eme ka ha maa jijiji
  alternative: ihe ndị a na-apụghị ime ka ha maa jijiji
  rationale: 'Grik ahụ jiri participle abụọ na-emegide onwe ha: ihe ndị a na-eme ka ha maa jijiji na ihe ndị a na-adịghị eme ka ha maa jijiji. Nhọrọ a na-echekwa esemokwu ahụ n’ụzọ doro anya, n’etinyeghị okwu amaokwu 28 n’ime amaokwu a.'
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “maa jijiji” mee ka ọdịiche dị n’etiti σαλευομένων na μὴ σαλευόμενα pụta ìhè; e zere ịgbakwụnye nkọwa okpukpe nke na-adịghị n’amaokwu ahụ.
