id: HEB.12.1
reference: Hebrews 12:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: ig
  text: Ya mere, ebe anyị nwere oke igwe ndị àmà dị otu a gbara anyị gburugburu, ka anyị tụfuo ibu ọ bụla na mmehie ahụ nke na-adị mfe ịnyakwasị anyị[a], were ntachi obi gbaa ọsọ ahụ e debere n’ihu anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mmehie ahụ nke na-adị mfe ịrapara anyị n’ahụ” ma ọ bụ “mmehie ahụ nke na-adị mfe ịma anyị n’ọnyà.” Okwu Grik ahụ dị ụkọ; ọ pụrụ izo aka n’ihe na-egbochi ma ọ bụ na-adọkpụ mmadụ n’azụ, n’ihe na-ama mmadụ n’ọnyà, ma ọ bụ n’ihe na-arapara n’ahụ nke ukwuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιγαροῦν
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n’ihe a kọwara n’isi nke 11, n’asụsụ Igbo doro anya.
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: igwe ndịàmà dị ukwuu dị otu a
  rationale: Na-edobe ihe atụ nke igwe ojii dị ka nnukwu ìgwè, yana ike nke τοσοῦτον.
- source_word: περικείμενον ἡμῖν
  choice: gbara anyị gburugburu
  rationale: Ọ bụ ụzọ Igbo si ekwu n’ụzọ ebumpụta ụwa na ihe nọ n’akụkụ niile.
- source_word: μαρτύρων
  choice: ndịàmà
  rationale: Na-edobe echiche nke ndị na-agba akaebe; ọ naghị ekpebi na ha bụ naanị ndị na-ekiri asọmpi.
- source_word: ὄγκον πάντα
  choice: ibu ọ bụla
  rationale: Na-edobe ihe atụ nke ihe arọ nke nwere ike igbochi onye na-agba ọsọ.
- source_word: ἀποθέμενοι
  choice: ka anyị tụfuo
  rationale: Na-egosi iwepụ ihe n’ụzọ siri ike dịka nkwadebe maka ịgba ọsọ.
- source_word: εὐπερίστατον
  choice: nke na-amakụ anyị n’ụzọ dị mfe
  rationale: Okwu Grik a dị ụkọ ma nwee nghọta karịrị otu; nhọrọ a na-egosi mmehie nke na-arapara mmadụ n’ahụ ma na-egbochi ya, ebe ndetu ala na-echekwa ụzọ nghọta ndị ọzọ.
- source_word: ἁμαρτίαν
  choice: mmehie ahụ
  rationale: Na-edobe njirimara okwu ahụ dị na Grik n’ebughị ụzọ kpọọ otu mmehie pụrụ iche aha.
- source_word: δι’ ὑπομονῆς
  choice: were ntachi obi
  rationale: Na-egosi ịnọgidesi ike n’okpuru ihe isi ike n’ụzọ Igbo a na-aghọta nke ọma.
- source_word: τρέχωμεν
  choice: ka anyị ... gbaa ọsọ
  rationale: Na-egosipụta subjunctive nke agbamume onye dere ya tinyere onwe ya na ndị na-agụ ya.
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: ọsọ ahụ e debere n’ihu anyị
  rationale: N’ihi okwu ‘ịgba ọsọ,’ ἀγών bụ ‘ọsọ’ n’ebe a; ‘e debere n’ihu anyị’ na-edobe echiche nke ụzọ a họpụtara.
theological_decisions:
- issue: Ihe ‘ndịàmà’ pụtara n’ihe gbasara Ndị Hibru 11
  choice: Ndị ndụ ha na-agba akaebe banyere okwukwe, ebe oyiyi nke ha gbara anyị gburugburu na-akwado agbamume ahụ
  alternative: Ndị nọ n’eluigwe bụ isi ndị na-ekiri ndị kwere ekwe ka ha na-agba ọsọ
  rationale: Ihe gbara amaokwu a gburugburu na-ezo aka n’isi nke 11. Nsụgharị ahụ na-ahapụ ‘ndịàmà’ ka ọ ghara ikpebi na ọrụ ha bụ ikiri ndị nọ n’ụwa.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ nke igwe ojii, ibu, na ịgba ọsọ; e zere okwu ụka pụrụ iche na nkọwa na-ekpebi esemokwu dị n’okwu ahụ.
