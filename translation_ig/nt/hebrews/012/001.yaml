revisions:
- from: Ya mere, ebe igwe ndịàmà dị ukwuu dị otu a gbara anyị gburugburu, ka anyị tụfuo ibu ọ bụla na mmehie ahụ nke na-amakụ anyị n’ụzọ dị mfe[a], were ntachi obi gbaa ọsọ ahụ e debere n’ihu anyị.
  to: Ya mere, ebe anyị nwere oke igwe ndị àmà dị otu a gbara anyị gburugburu, ka anyị tụfuo ibu ọ bụla na mmehie ahụ nke na-adị mfe ịnyakwasị anyị[a], were ntachi obi gbaa ọsọ ahụ e debere n’ihu anyị.
  rationale: The revision corrects the misleading ‘embraces us’ wording while retaining an appropriately non-dogmatic, idiomatic rendering of the disputed adjective. It also makes the participial ‘having’ explicit. The footnote preserves the principal lexical possibilities rather than resolving the ambiguity.
