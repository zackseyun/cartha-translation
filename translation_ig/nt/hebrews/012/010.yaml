source:
  edition: SBLGNT
  text: οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας κατὰ τὸ δοκοῦν αὐτοῖς ἐπαίδευον, ὁ δὲ ἐπὶ τὸ συμφέρον εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: ig
  text: N’ihi na ha dọrọ anyị aka ná ntị naanị ụbọchị ole na ole[a], dị ka ha chere na ọ dị mma[b]; ma ọ na-adọ anyị aka nántị maka ọdịmma anyị, ka anyị wee nwee òkè n’ime ịdị nsọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘ruo obere oge.’ Nkebi okwu Grik ahụ na-ekwusi ike na oge ndị nna n’ụwa ji adọ ụmụ ha aka ná ntị nwere ókè, n’adịghị ka nzube Chineke na-adịgide.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘dị ka ihe ha weere na o ziri ezi si dị.’ Nke a na-ezo aka n’echiche na mkpebi nke ndị nna ahụ n’onwe ha.
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: ruo ụbọchị ole na ole
  rationale: Nke a na-egosi na oge ọzụzụ ndị nna n’ụwa nwere ókè. Nsụgharị a na-edobe ihe oyiyi nke ‘ụbọchị ole na ole,’ ebe nkọwa ala peeji na-egosikwa na ọ pụrụ ịpụta ‘obere oge.’
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: dị ka ha chere na ọ dị mma
  rationale: Nke a na-egosi na ndị nna ahụ mere ihe dịka nghọta na mkpebi nke aka ha si dị, n’ekwughị na mkpebi ha ziri ezi mgbe niile.
- source_word: ἐπαίδευον
  choice: nyere anyị ọzụzụ ịdọ aka ná ntị
  rationale: Okwu a gụnyere ọzụzụ nne na nna, mgbazi, na ịdọ aka ná ntị; ọ bụghị naanị inye ntaramahụhụ. Nkebi okwu Igbo a na-eburu nghọta ahụ sara mbara.
- source_word: ὁ δὲ
  choice: ma ya onwe ya na-enye anyị ọzụzụ ahụ
  rationale: Onye a na-ekwu maka ya bụ Chineke dịka ihe gbara amaokwu ahụ gburugburu si gosi. ‘Ya onwe ya’ na-eme ka ọdịiche dị n’etiti ya na ndị nna n’ụwa pụta ìhè n’etinyeghị aha ‘Chineke’ n’ebe Grik ji nnọchiaha.
- source_word: ἐπὶ τὸ συμφέρον
  choice: maka ọdịmma anyị
  rationale: Nke a na-egosi na nzube ọzụzụ Chineke bụ uru anyị, ọ bụghị naanị ihe e weere n’ozuzu dịka ihe ọma.
- source_word: εἰς τὸ μεταλαβεῖν
  choice: ka anyị wee keta oke n’ime
  rationale: Nkebi okwu a na-egosi nzube ma na-ezipụta echiche nke isoro nweta ma ọ bụ ikere òkè n’ihe ahụ.
- source_word: ἁγιότητος αὐτοῦ
  choice: ịdị nsọ ya
  rationale: ‘Ịdị nsọ’ bụ okwu Igbo doro anya maka àgwà nke ịbụ nsọ; nnọchiaha ‘ya’ na-edobe usoro okwu Grik ma na-ezo aka n’ebe Chineke nọ.
theological_decisions:
- issue: Onye nnọchiaha dị iche ὁ δὲ na-ezo aka na ya
  choice: E ji ‘ya onwe ya’ mee ihe, ebe ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Chineke.
  alternative: Ịkpọpụta ‘Chineke’ ozugbo maka ime ka ihe doo anya.
  rationale: Nke a na-edobe ụzọ Grik si hapụ aha onye ahụ n’ekwughị ya kpọmkwem, ma na-eme ka ọdịiche ya na ndị nna n’ụwa pụta ìhè.
- issue: Ihe ‘iketa oke n’ịdị nsọ ya’ pụtara
  choice: E debere ya dịka isoro keta oke n’ịdị nsọ Chineke, n’akọwaghị kpọmkwem usoro nke a si eme.
  alternative: Ịkọwa ya naanị dịka ọnọdụ ịdị nsọ e nyere mmadụ, ma ọ bụ naanị dịka usoro mmadụ ji na-adịwanye nsọ.
  rationale: Amaokwu ahụ kwuru nzube ọzụzụ Chineke, ma ọ kọwaghị usoro nkà mmụta okpukpe nke isoro keta oke n’ịdị nsọ ya. Nsụgharị ahụ na-edobe ịdị arọ na nghọta sara mbara nke okwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke nwere ugwu ma dị mfe nghọta, dee ya. ‘Ọzụzụ ịdọ aka ná ntị’ na-ezere ime ka παιδεύω bụrụ naanị ntaramahụhụ, ma na-edobe echiche nke ọzụzụ nne na nna, mgbazi, na nduzi.
