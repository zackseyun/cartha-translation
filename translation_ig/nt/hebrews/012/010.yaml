revisions:
- from: N’ihi na ha nyere anyị ọzụzụ ịdọ aka ná ntị ruo ụbọchị ole na ole[a], dị ka ha chere na ọ dị mma[b]; ma ya onwe ya na-enye anyị ọzụzụ ahụ maka ọdịmma anyị, ka anyị wee keta oke n’ịdị nsọ ya.
  to: N’ihi na ha dọrọ anyị aka ná ntị naanị ụbọchị ole na ole[a], dị ka ha chere na ọ dị mma[b]; ma ọ na-adọ anyị aka nántị maka ọdịmma anyị, ka anyị wee nwee òkè n’ime ịdị nsọ ya.
  rationale: The revision corrects the duration idiom, streamlines the discipline language, and uses “nwee òkè n’ime” to preserve μεταλαβεῖν as participation in God’s holiness. It retains the contrastive implicit divine subject and the source’s ambiguity concerning the earthly fathers’ judgment.
