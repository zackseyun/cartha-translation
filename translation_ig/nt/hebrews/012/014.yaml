review_pass:
  verdict: revise
  source_fidelity: The two coordinated objects of διώκετε are retained, as are the universal scope of μετὰ πάντων, the future negation, and the unexpanded title κύριον. However, “n’etiti unu na mmadụ niile” means “among you and all people” and introduces “you” as a distinct group, rather than directly expressing peace with all people.
  naturalness: 'The revised wording uses idiomatic Standard Igbo: “n''ebe mmadụ niile nọ” clearly conveys living peaceably in relation to everyone. Repeating the exhortative verb before “ịdị nsọ” is natural and makes the coordination clear.'
  terminology: “Udo,” “ịdị nsọ,” and “Onyenweanyị” are appropriate established Standard Igbo biblical terms. “Ịdị nsọ” preserves the ethical/consecrational breadth of ἁγιασμός; the footnote appropriately records “ido nsọ” as an alternative.
  issues:
  - severity: medium
    issue: “n’etiti unu na mmadụ niile” does not accurately render μετὰ πάντων.
    rationale: It can be understood as locating peace within a group composed of “you and all people,” and its added “unu” is not present in the Greek. The source calls for pursuit of peace in relation to all people.
  revised_text: Chụsonụ udo n'ebe mmadụ niile nọ, chụsookwanụ ịdị nsọ[a], nke na-enweghị ya, ọ dịghị onye ga-ahụ Onyenweanyị.
