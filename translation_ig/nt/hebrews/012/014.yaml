id: HEB.12.14
reference: Hebrews 12:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰρήνην διώκετε μετὰ πάντων, καὶ τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: ig
  text: Chụsonụ udo n'ebe mmadụ niile nọ, chụsookwanụ ịdị nsọ[a], nke na-enweghị ya, ọ dịghị onye ga-ahụ Onyenweanyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ido nsọ.” Okwu Grik ahụ pụrụ izo aka n’ịdị nsọ dịka àgwà ndụ ma ọ bụ ọnọdụ ndụ, ma ọ bụ n’usoro e si eme ka mmadụ dị nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνην
  choice: udo
  rationale: “Udo” bụ okwu Igbo doro anya maka εἰρήνη; n’ihi njikọ ya na “mmadụ niile,” ọ na-ekwu maka ibi n’udo na ndị ọzọ, ọ bụghị naanị obi iru ala.
- source_word: διώκετε
  choice: na-achụso … chụsookwanụ
  rationale: “Ịchụso” na-egosipụta mbọ siri ike na nke na-aga n’ihu dị n’okwu Grik διώκω. E kwughachiri ngwaa ahụ n’Igbo ka njikọ nke “udo” na “ịdị nsọ” doo anya.
- source_word: μετὰ πάντων
  choice: n’etiti unu na mmadụ niile
  rationale: Nhọrọ a na-ekwupụta mmekọrịta mmadụ na ibe ya nke μετὰ πάντων ma na-edobe oke ya gbasara mmadụ niile.
- source_word: τὸν ἁγιασμόν
  choice: ịdị nsọ
  rationale: ἁγιασμός pụrụ ịpụta àgwà ma ọ bụ ọnọdụ nke ịdị nsọ, nakwa usoro ime ka mmadụ dị nsọ. “Ịdị nsọ” bụ okwu eke ma doo ndị na-agụ Igbo nke oge a anya, ebe nkọwa ala peeji na-echekwa ihe ọzọ okwu ahụ pụrụ ịpụta.
- source_word: οὗ χωρὶς
  choice: nke mmadụ ọ bụla na-enweghị ya
  rationale: Nkebi a jikọtara okwu nnọchi anya ahụ na “ịdị nsọ” ma na-egosipụta kpọmkwem echiche nke enweghị ya.
- source_word: οὐδεὶς ὄψεται
  choice: mmadụ ọ bụla … agaghị ahụ
  rationale: Nke a na-edobe nkwupụta zuru oke nke οὐδείς na ọdịnihu nke ὄψεται n’ụzọ Igbo na-ada nke ọma.
- source_word: τὸν κύριον
  choice: Onyenwe anyị
  rationale: “Onyenwe anyị” na-echekwa aha nsọpụrụ κύριος n’enweghị ịkọwa ma ọ bụ mechie onye ọ na-ezo aka n’ebe a.
theological_decisions:
- issue: Ihe ἁγιασμός pụtara n’ọdụmọdụ a
  choice: A sụgharịrị ya “ịdị nsọ.”
  alternative: ido nsọ / ime ka mmadụ dị nsọ
  rationale: “Ịdị nsọ” na-egosi ndụ a raara nye Chineke nke a gwara ndị na-agụ akwụkwọ ka ha chụsoo, ma ọ naghị eme okwu ahụ ka ọ bụrụ naanị okwu nkà mmụta okpukpe. Nkọwa ala peeji na-echekwa echiche nke usoro ma ọ bụ ọnọdụ ido nsọ.
- issue: Onye “Onyenwe anyị” na-ezo aka na ya
  choice: A hapụrụ ya dịka “Onyenwe anyị.”
  alternative: Chineke; Onyenwe anyị Jizọs
  rationale: Ihe odide Grik kwuru naanị τὸν κύριον. Nsụgharị ahụ anaghị ekpebi ihe isi mmalite ahụ ahapụghị ka o doo anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E ji “unu” mee ka iwu ahụ dị n’ọnụọgụ ọtụtụ doo anya. E kwughachiri “ịchụso” n’akụkụ nke abụọ maka nghọta na ịdị eke nke ahịrịokwu Igbo, n’agbanyeghị na otu ngwaa ahụ na-achị ihe abụọ n’asụsụ Grik.
