revisions:
- from: Na-achụso udo n’etiti unu na mmadụ niile, chụsookwanụ ịdị nsọ[a], nke mmadụ ọ bụla na-enweghị ya na-agaghị ahụ Onyenwe anyị.
  to: Chụsonụ udo n'ebe mmadụ niile nọ, chụsookwanụ ịdị nsọ[a], nke na-enweghị ya, ọ dịghị onye ga-ahụ Onyenweanyị.
  rationale: The revision replaces the potentially misleading “n’etiti unu na mmadụ niile” with a direct idiomatic expression for peace with all people. It also makes the final relative clause more natural while preserving its singular reference to “ịdị nsọ,” the absolute negation, and the future sense. No doctrinal referent is imposed on “Onyenweanyị.”
  reviewer_model: gpt-5.6-terra
