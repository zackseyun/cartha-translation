revisions:
- from: Na-elezikwa anya nke ọma ka onye ọ bụla ghara ịdahie n’inweta amara Chineke[a]; ka mgbọrọgwụ ilu ọ bụla ghara ipulite, kpatara unu nsogbu, sitekwa na ya merụọ ọtụtụ mmadụ[b].
  to: Na-elezikwa anya nke ọma ka onye ọ bụla ghara iru amara Chineke[a]; ka mgbọrọgwụ ilu ọ bụla nke na-epulite ghara inye nsogbu, ka sitekwa na ya e metọọ ọtụtụ mmadụ[b].
  rationale: The revision removes an added pronoun, corrects the conditional syntax, and uses wording that more faithfully renders both the warning of failing to attain God’s grace and the moral/cultic defilement of many. It retains the Greek ambiguity concerning grace and preserves the biblical-register imagery and Deuteronomy allusion.
  reviewer_model: gpt-5.6-terra
