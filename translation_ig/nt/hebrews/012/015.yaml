id: HEB.12.15
reference: Hebrews 12:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: ig
  text: Na-elezikwa anya nke ọma ka onye ọ bụla ghara iru amara Chineke[a]; ka mgbọrọgwụ ilu ọ bụla nke na-epulite ghara inye nsogbu, ka sitekwa na ya e metọọ ọtụtụ mmadụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ịghara inweta amara Chineke.” Okwu Grik a nwere ike ịpụta ịghara iru ihe a na-enye mmadụ, ma ọ bụ ịdaba n’ihe na-erughị ya.
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “mgbọrọgwụ ilu” na-echetara Diuterọnọmi 29:18, ebe mgbọrọgwụ na-amị ihe na-egbu egbu na-anọchi anya ekwesịghị ntụkwasị obi n’ọgbụgba ndụ nke nwere ike ịgbasa n’etiti obodo.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: Na-elezikwa anya nke ọma
  rationale: Na-egosipụta omume nke ịnọ na nche na ilekọta ọnọdụ ndị nọ n’ọgbakọ, n’asụsụ Igbo dị mfe ma kwụ ọtọ.
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: ka onye ọ bụla ghara ịdahie n’inweta amara Chineke
  rationale: ‘Ịdahie n’inweta’ na-echekwa echiche nke ịghara iru ma ọ bụ nweta ihe e nyere, na-ekpebighị esemokwu ozizi banyere ma ọ̀ bụ ọnwụ nzọpụta ka okwu ahụ pụtara.
- source_word: χάριτος
  choice: amara
  rationale: ‘Amara’ bụ okwu Igbo a na-ejikarị akọwa χάρις n’ọnọdụ a, ma na-echekwa ụda okwu okpukpe nke amaokwu ahụ.
- source_word: ῥίζα πικρίας
  choice: mgbọrọgwụ ilu
  rationale: Nsụgharị a dị nso n’usoro okwu Grik ma na-echekwa ihe atụ nke mgbọrọgwụ na-amị ihe na-egbu egbu, nke yiri okwu dị na Diuterọnọmi 29:18.
- source_word: ἄνω φύουσα
  choice: ipulite
  rationale: ‘Ipulite’ na-egosipụta nke ọma mgbọrọgwụ na-esi n’ala apụta ma too.
- source_word: ἐνοχλῇ
  choice: kpatara unu nsogbu
  rationale: Na-egosipụta nsogbu ma ọ bụ ọgba aghara mgbọrọgwụ ahụ na-eweta n’etiti obodo ndị a na-agwa okwu.
- source_word: δι’ αὐτῆς
  choice: sitekwa na ya
  rationale: Na-echekwa ụzọ-ngwaọrụ nke διά, ebe nnọchiaha ahụ na-ezo aka na mgbọrọgwụ ahụ.
- source_word: μιανθῶσιν πολλοί
  choice: merụọ ọtụtụ mmadụ
  rationale: ‘Merụọ’ ebe a na-enye echiche nke mmetọ n’omume ma ọ bụ n’ọnọdụ nsọ, ma na-ada nke ọma n’Igbo nke oge a.
theological_decisions:
- issue: Ma ịdahie n’amara Chineke ọ̀ pụtara ịtụfu nzọpụta, ịghara inweta amara, ka ọ̀ bụ ịbụ onye a chụpụrụ n’obodo ndị kwere ekwe
  choice: ka onye ọ bụla ghara ịdahie n’inweta amara Chineke
  alternative: ka onye ọ bụla ghara iru amara Chineke; ka onye ọ bụla ghara ịbụ onye amara Chineke na-akọ
  rationale: Okwu Grik nwere ike ịpụta ịghara iru ma ọ bụ inweta ihe e nyere. Nsụgharị a na-echekwa ịdọ aka ná ntị ahụ n’etinyeghị mkpebi otu ụka banyere ndapụ n’okwukwe ma ọ bụ nnọgidesi ike.
- issue: Ma μιαίνω kwesịrị ịdị nro dịka naanị ịkpata nsogbu n’etiti mmadụ
  choice: merụọ ọtụtụ mmadụ
  alternative: metọọ ọtụtụ mmadụ; mebie ọtụtụ mmadụ
  rationale: Ngwaa Grik ahụ siri ike karịa naanị ịkpasu nsogbu; ọ nwere echiche nke mmetọ n’omume ma ọ bụ n’ihe gbasara ịdị nsọ. ‘Merụọ’ na-echekwa ịdị arọ ahụ n’Igbo dị ugbu a.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ ‘mgbọrọgwụ ilu’ na ịdị arọ nke ịdọ aka ná ntị ahụ, ma zere okwu ga-ekpebi esemokwu ozizi nke amaokwu ahụ n’onwe ya na-ekpebighị.
