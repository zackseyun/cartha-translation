id: HEB.12.11
reference: Hebrews 12:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶσα ⸀δὲ παιδεία πρὸς μὲν τὸ παρὸν οὐ δοκεῖ χαρᾶς εἶναι ἀλλὰ λύπης, ὕστερον δὲ καρπὸν εἰρηνικὸν τοῖς δι’ αὐτῆς γεγυμνασμένοις ἀποδίδωσιν δικαιοσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: ig
  text: Ọzụzụ na mgbazi ọ bụla, n’oge ugbu a, adịghị eyi ka ọ bụ nke ọṅụ kama nke mwute; ma emesịa, ọ na-amịpụtara ndị e ji ya zụọ mkpụrụ udo nke ezi omume[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi.” Okwu Grik a nwere ike ịpụta ezi omume ma ọ bụ ikpe ziri ezi; n’ebe a, o yikarịrị ka ọ na-ekwu maka ndụ kwụ ọtọ nke ọzụzụ na mgbazi ahụ na-amịpụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεία
  choice: ọzụzụ na mgbazi
  rationale: N’ebe a, okwu ahụ gụnyere ọzụzụ na mgbazi Nna na-enye ụmụ ya, ọ bụghị naanị ntaramahụhụ. Njikọ okwu abụọ a na-egosipụta obosara echiche ahụ n’Igbo doro anya.
- source_word: πρὸς μὲν τὸ παρὸν
  choice: n’oge a na-enye ya
  rationale: Nke a na-egosi oge mmadụ na-anata mgbazi ahụ ugbu a, n’ụzọ kwekọrọ na ọdịiche ya na ὕστερον, ‘emesịa.’
- source_word: οὐ δοκεῖ
  choice: adịghị eyi ka
  rationale: Nke a na-echekwa echiche nke otú ihe ahụ si apụta n’anya onye na-enweta ya, kama ikwu na ọ bụ eziokwu na-enweghị mgbagha.
- source_word: χαρᾶς ... ἀλλὰ λύπης
  choice: ọ bụghị ihe ọṅụ, kama ọ bụ ihe mwute
  rationale: E debere aha abụọ ahụ—ọṅụ na mwute—dị ka ha dị na Grik, n’asụsụ Igbo dị mfe ma dị ugwu.
- source_word: ὕστερον
  choice: emesịa
  rationale: Ọ na-egosi ihe na-esochi mgbe oge ọzụzụ na mgbazi gafere.
- source_word: καρπὸν εἰρηνικὸν
  choice: mkpụrụ udo
  rationale: Nke a na-echekwa ihe atụ nke mkpụrụ nakwa njirimara ya dị ka nke udo, n’enweghị ime ka ọ pụta naanị na ọ na-eweta udo.
- source_word: γεγυμνασμένοις
  choice: ndị e ji ya zụọ
  rationale: Ọ na-egosi ndị usoro ahụ zụlitere ma mee ka ha sie ike site n’ọzụzụ ugboro ugboro; ọ na-echekwa njikọ ya na ‘ọzụzụ’ n’amaokwu ahụ.
- source_word: ἀποδίδωσιν
  choice: ọ na-amịpụtara
  rationale: Ngwaa a dabara n’ihe atụ nke mkpụrụ ma gosipụta ihe ọzụzụ na mgbazi na-emepụta n’ikpeazụ.
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: ‘Ezi omume’ na-egosipụta ndụ ziri ezi ma kwụ ọtọ nke mgbazi Chineke na-amịpụta. A debere ‘ikpe ziri ezi’ n’okpuru amaokwu dị ka ụzọ ọzọ okwu Grik ahụ pụrụ isi pụta.
theological_decisions:
- issue: Ihe παιδεία pụtara n’ihe gbasara omume Chineke n’ebe ndị kwere ekwe nọ
  choice: ọzụzụ na mgbazi nke na-akpụzi mmadụ, gụnyere ntụzi na idozi ya
  alternative: ntaramahụhụ naanị; ma ọ bụ nkuzi naanị
  rationale: Ihe gbara amaokwu a gburugburu na Hibru 12:5–10 na-egosi omume Nna nke nzube ya bụ ịzụlite ụmụ ya n’ịdị nsọ. Nsụgharị a na-echekwa ma ịhụnanya Nna ma ihe mgbazi ahụ na-ewute, n’emeghị ya ka ọ bụrụ naanị ịkwụ mmadụ ụgwọ ihe ọjọọ.
- issue: Ihe δικαιοσύνης pụtara
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N’ebe a, okwu ahụ yikarịrị ka ọ na-ekwu maka ndụ kwụ ọtọ nke ọzụzụ Chineke na-amịpụta. Otú ọ dị, n’ihi na okwu Grik ahụ nwekwara ike ịpụta ikpe ziri ezi, e debere nke ahụ n’okpuru amaokwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. A họọrọ “ọzụzụ na mgbazi” iji kpuchie obosara παιδεία n’enweghị ime ka ọ bụrụ naanị ntaramahụhụ. E tinyere akara [a] ozugbo n’akụkụ “ezi omume,” bụ okwu footnote ahụ na-akọwa.
