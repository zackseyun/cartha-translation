  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ σάλπιγγος ἤχῳ καὶ φωνῇ ῥημάτων, ἧς οἱ ἀκούσαντες παρῃτήσαντο ⸀μὴ προστεθῆναι αὐτοῖς λόγον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/019.yaml
  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: ig
  text: na ụda opi, na olu nke okwu[a][b], nke ndị nụrụ ya rịọrọsi ike ka a ghara ịgwa ha okwu ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke ndị nụrụ rịọrọ ka a ghara ịga n'ihu ịgwa ha okwu,” ma ọ bụrụ na e were okwu njikọ ahụ dị ka nke na-ezo aka n'ihe ngosi Saịnaị ahụ dum, ọ bụghị naanị n'“olu nke okwu.”
    reason: alternative_reading
  - marker: b
    text: Lee Ọpụpụ 20:18–19 na Diuterọnọmi 5:23–27 maka arịrịọ ụmụ Izrel ka ha ghara ịnụ olu Chineke kpọmkwem ọzọ.
    reason: cross_reference
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: ụda opi
  rationale: Nke a na-egosipụta ihe a nụrụ na Saịnaị n'ụzọ doro anya ma na-edobe ihe oyiyi nke opi na-enweghị ịgbakwụnye otú ụda ahụ siri sie ike.
- source_word: φωνῇ ῥημάτων
  choice: olu nke okwu
  rationale: Nkebiokwu a na-edobe usoro pụrụ iche nke Grik ma na-egosi na ihe a nụrụ bụ okwu a na-ekwu, ọ bụghị naanị mkpọtụ.
- source_word: ἧς
  choice: nke ... ya
  rationale: Nnochiaha njikọ nwanyị otu a kacha nso na-ezo aka n'olu ahụ; nhazi Igbo a na-eme ka njikọ ahụ doo anya ma ghara imechi ohere nke nghọta sara mbara e depụtara n'okpuru.
- source_word: οἱ ἀκούσαντες
  choice: ndị nụrụ ya
  rationale: Nke a bụ ntụgharị Igbo e ji eme ihe kwa ụbọchị nke participle ahụ, na-ezo aka n'Izrel ndị nụrụ olu ahụ.
- source_word: παρῃτήσαντο
  choice: rịọrọ
  rationale: N'ọnọdụ a, ngwaa ahụ pụtara ịrịọsi ike ka a ghara ịga n'ihu ịgwa ha okwu. “Rịọrọ” dị n'okike n'Igbo ma ghara ime ka ọ bụrụ nanị na ha jụrụ irube isi.
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: ka a ghara ịgwa ha okwu ọzọ
  rationale: Nke a na-egosipụta arịrịọ dị n'infinitive ahụ na echiche nke ịghara ịgbakwunye okwu ọzọ, ma na-edobe passive ahụ site na “a ghara ịgwa ha.”
theological_decisions:
- issue: Ihe ἧς na-ezo aka na ya
  choice: E mere ka nkebiokwu ahụ zoo ozugbo n'“olu nke okwu.”
  alternative: Ọ pụrụ izo aka n'ihe ngosi Saịnaị ahụ dum, gụnyere ụda opi na olu ahụ.
  rationale: N'usoro ụtọasụsụ Grik, φωνῇ, nke bụ aha nwanyị otu kacha nso, bụ ihe ἧς yikarịrị ka ọ na-ezo aka na ya. Ma ọnọdụ ahụ nwekwara ike ịgụnye ahụmahụ Saịnaị ahụ dum; ya mere, e debere ohere ahụ n'okpuru ebe e dere nkọwa.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị nsọ ma dị mfe nghọta. A hapụrụ “olu nke okwu” n'ụdị siri ike ntakịrị iji chekwaa ihe oyiyi na mgbagwoju anya nke φωνῇ ῥημάτων. E tinyere akara nkọwa [a] na [b] ozugbo n'akụkụ nkebiokwu ha metụtara.
