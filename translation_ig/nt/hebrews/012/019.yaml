    reason: alternative_reading
  - marker: b
    text: Lee Ọpụpụ 20:18–19 na Diuterọnọmi 5:23–27 maka arịrịọ ụmụ Izrel ka ha ghara ịnụ olu Chineke kpọmkwem ọzọ.
    reason: cross_reference
