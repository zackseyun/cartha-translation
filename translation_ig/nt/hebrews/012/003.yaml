id: HEB.12.3
reference: Hebrews 12:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: ig
  text: N’ihi ya, tụgharịa uche nke ọma banyere onye ahụ tachiri obi n’okpuru ụdị mmegide dị otu a nke ndị mmehie megidere ya,[a] ka ike ghara ịgwụ unu, unu adaa mbà n’ime mkpụrụ obi unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: SBLGNT gụrụ “megidere onwe ha”; ụfọdụ ihe odide gụrụ “megidere ya.” Ihe gbara amaokwu ahụ gburugburu na-egosi na mmegide ahụ chere Jizọs ihu.
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “unu ana-ada mba n’ime mkpụrụ obi unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: tụgharịa uche nke ọma banyere
  rationale: Na-egosipụta iwu ka ndị na-agụ ya jiri nlezianya tụlee ma chebara onye ahụ echiche; ọ bụ okwu Igbo nkịtị ma na-edobe ike nke ndụmọdụ ahụ.
- source_word: ὑπομεμενηκότα
  choice: onye ahụ tachiri obi
  rationale: “Ịtachi obi” na-egosipụta ịnọgide n’okpuru ahụhụ ma ghara ịda mbà; ọ dabara n’isiokwu nke ntachi obi dị n’amaokwu ndị gbara ya gburugburu.
- source_word: τοιαύτην ... ἀντιλογίαν
  choice: ụdị mmegide dị otu a
  rationale: “Mmegide” na-eburu echiche nke ịrụ ụka megide, ịjụ, na ibu iro n’ozuzu, ebe “dị otu a” na-ahapụ ogo na ụdị mmegide ahụ ka okwu Grik si mee.
- source_word: ἁμαρτωλῶν
  choice: ndị mmehie
  rationale: Nsụgharị kwụ ọtọ nke aha e ji kọwaa ndị omume mmehie ji mara.
- source_word: εἰς ἑαυτοὺς
  choice: megidere ya
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Jizọs ka mmegide ahụ dakwasịrị; agbanyeghị, e debere ọgụgụ SBLGNT “megidere onwe ha” n’ala peeji n’ihi ọdịiche ederede.
- source_word: κάμητε
  choice: ike ghara ịgwụ unu
  rationale: Akpaalaokwu Igbo a na-egosi ịda mba n’ihi ike ọgwụgwụ, ma na-ekewa ya nke ọma n’okwu na-esote.
- source_word: ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι
  choice: unu adaa mbà n’ime mkpụrụ obi unu
  rationale: Na-edobe okwu Grik maka “mkpụrụ obi” ma na-egosi ọdịda nke obi ime mmadụ; ọ naghị eme ka okwu ahụ bụrụ naanị ike ọgwụgwụ anụ ahụ.
theological_decisions:
- issue: Onye okwu “onye ahụ” na-ezo aka na ya
  choice: E debere “onye ahụ,” ebe amaokwu 2 mere ka o doo anya na ọ bụ Jizọs.
  alternative: Ịkpọ aha “Jizọs” ọzọ n’amaokwu a.
  rationale: Nke a na-edobe usoro okwu Grik ma na-ahapụ ihe gbara ya gburugburu ka ọ kọwaa onye a na-ekwu maka ya, n’etinyeghị okwu ọzọ n’amaokwu ahụ.
- issue: Onye mmegide ndị mmehie ahụ chere ihu
  choice: “megidere ya” n’ahịrị bụ isi, ya bụ, mmegide e mere Jizọs.
  alternative: “megidere onwe ha,” dịka ọgụgụ SBLGNT εἰς ἑαυτούς si dị.
  rationale: Ọdịiche ederede dị ezigbo mkpa. Ọgụgụ “megidere ya” na-enye nghọta doro anya nke ihe gbara amaokwu ahụ gburugburu, ma a naghị ezobe ọgụgụ SBLGNT; e kwuru ya n’ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere nkwanye ùgwù ma dị mfe nghọta. E ji “tụgharịa uche nke ọma,” “tachiri obi,” na “ike ghara ịgwụ unu” mee ka ndụmọdụ ahụ bụrụ ihe a na-anụ nke ọma n’Igbo, ebe “n’ime mkpụrụ obi unu” na-edobe ihe atụ mmadụ nke ederede Grik.
