    text: Ma ọ bụ, “Jizọs, onye butere ikwesị ntụkwasị obi ụzọ ma mee ka ọ ruo n’uju,” ma ọ bụ, “onye butere okwukwe anyị ụzọ ma na-eme ka ọ ruo n’uju.” Nkebi okwu Grik a dị mkpụmkpụ; okwu a sụgharịrị “okwukwe” nwekwara ike ịpụta “ikwesị ntụkwasị obi,” ma ọ bụ na ọ pụrụ izo aka kpọmkwem n’okwukwe ndị kwere ekwe.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “na-ewere ihere ahụ dịka ihe na-abaghị uru.” Ihe ọ pụtara bụ na o kweghị ka ihere nke ịkpọgide ya n’obe bụrụ ihe ga-ekpebi ihe ọ ga-eme.
    reason: lexical_alternative
