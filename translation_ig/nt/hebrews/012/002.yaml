revisions:
- from: Ka anyị na-elekwasị anya n’ebe Jizọs nọ[a], onye butere ụzọ n’okwukwe, bụrụkwa onye na-eme ka okwukwe ruo n’uju. N’ihi ọṅụ e debere n’ihu ya, ọ tachiri obi n’obe, leda ihere ya anya[b], ma nọdụla n’aka nri nke ocheeze Chineke.
  to: Ka anyị na-elekwasị anya na Jizọs[a], onye butere okwukwe ụzọ, bụrụkwa onye na-eme ka okwukwe ruo n’uju. N’ihi ọṅụ e debere n’ihu ya, ọ tachiri obi n’obe, na-elelị ihere ahụ anya[b], ma ọ nọdụwo n’aka nri nke ocheeze Chineke.
  rationale: The revision makes the object of sustained attention direct and idiomatic, removes an unexpressed possessive from “shame,” clarifies the parallel titles applied to Jesus, and uses a clearer perfect expression for κεκάθικεν. It preserves the compact ambiguity of τῆς πίστεως and retains both English audit-trail alternatives in the footnote without resolving them doctrinally.
