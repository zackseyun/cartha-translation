id: HEB.12.2
reference: Hebrews 12:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: ig
  text: Ka anyị na-elekwasị anya na Jizọs[a], onye butere okwukwe ụzọ, bụrụkwa onye na-eme ka okwukwe ruo n’uju. N’ihi ọṅụ e debere n’ihu ya, ọ tachiri obi n’obe, na-elelị ihere ahụ anya[b], ma ọ nọdụwo n’aka nri nke ocheeze Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jizọs, onye butere ikwesị ntụkwasị obi ụzọ ma mee ka ọ ruo n’uju,” ma ọ bụ, “onye butere okwukwe anyị ụzọ ma na-eme ka ọ ruo n’uju.” Nkebi okwu Grik a dị mkpụmkpụ; okwu a sụgharịrị “okwukwe” nwekwara ike ịpụta “ikwesị ntụkwasị obi,” ma ọ bụ na ọ pụrụ izo aka kpọmkwem n’okwukwe ndị kwere ekwe.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “na-ewere ihere ahụ dịka ihe na-abaghị uru.” Ihe ọ pụtara bụ na o kweghị ka ihere nke ịkpọgide ya n’obe bụrụ ihe ga-ekpebi ihe ọ ga-eme.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορῶντες
  choice: Ka anyị na-elekwasị anya n’ebe ... nọ
  rationale: Nke a na-egosi iwepụ uche n’ihe ndị ọzọ ma tụkwasị ya n’ebe Jizọs nọ; ọ dabara n’asụsụ Igbo dị ugbu a ma jikọta amaokwu a na agbamume nke amaokwu bu ya ụzọ.
- source_word: ἀρχηγὸν
  choice: onye butere ụzọ
  rationale: Ọ na-ejigide echiche nke onye malitere ụzọ ma na-edu ndị ọzọ n’ụzọ ahụ, nke dabara na ihe atụ ịgba ọsọ gbara amaokwu a gburugburu.
- source_word: τελειωτὴν
  choice: onye na-eme ka ... ruo n’uju
  rationale: Ọ na-egosi onye na-eweta ihe n’isi njedebe ya a chọrọ, ọ bụghị nanị onye kwụsịrị ya.
- source_word: τῆς πίστεως
  choice: n’okwukwe ... okwukwe
  rationale: A hapụrụ πίστις dịka ‘okwukwe’ n’enweghị itinye ‘anyị’ nke na-adịghị kpọmkwem n’asụsụ Grik; e debere nghọta ndị ọzọ n’akwụkwọ nkọwa.
- source_word: ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: N’ihi ọṅụ e debere n’ihu ya
  rationale: Nke a na-egosi ọṅụ dị n’ihu ya dịka ihe kpaliri ya ịtachi obi, ma na-echekwa ihe oyiyi nke ihe e debere n’ihu onye na-agba ọsọ.
- source_word: ὑπέμεινεν
  choice: ọ tachiri obi
  rationale: Nkebi a na-egosi ịnọgidesi ike n’okpuru ahụhụ, nke bụ isiokwu pụtara ìhè n’ebe a.
- source_word: σταυρὸν
  choice: n’obe
  rationale: Ihe a na-ekwu bụ obe a kpọgidere Jizọs n’elu ya; Igbo na-ekwukarị ya n’ụzọ a n’enweghị mkpa okwu nrụtụaka ọzọ.
- source_word: αἰσχύνης καταφρονήσας
  choice: leda ihere ya anya
  rationale: Nke a na-egosi na o were ihere obe dịka ihe na-enweghị ike ikpebi ihe ọ ga-eme, ọ bụghị na ihere ahụ bụ ihe ọma.
- source_word: ἐν δεξιᾷ ... τοῦ θρόνου τοῦ θεοῦ
  choice: n’aka nri nke ocheeze Chineke
  rationale: Ọ na-echekwa ihe oyiyi nke ọnọdụ nsọpụrụ na ikike kacha elu n’akụkụ ocheeze Chineke.
- source_word: κεκάθικεν
  choice: nọdụla
  rationale: 'Ụdị Igbo a na-egosi omume e mechara nke nsonaazụ ya ka dị: ọ nọdụ, ọ ka nọkwa n’ọnọdụ ahụ.'
theological_decisions:
- issue: Ihe τῆς πίστεως pụtara mgbe e jikọtara ya na ἀρχηγὸν καὶ τελειωτὴν
  choice: Jizọs bụ onye butere ụzọ n’okwukwe ma na-eme ka okwukwe ruo n’uju.
  alternative: Jizọs bụ onye butere ụzọ n’ikwesị ntụkwasị obi ma mee ka ọ ruo n’uju; ma ọ bụ, onye butere ụzọ n’okwukwe anyị ma na-eme ka ọ ruo n’uju.
  rationale: Nkebi Grik ahụ dị mkpụmkpụ, ọ kpọghịkwa onye nwe okwukwe ahụ aha. Ya mere, isi ederede na-eji ‘okwukwe’ n’enweghị itinye ‘anyị,’ ebe akwụkwọ nkọwa na-echekwa nghọta ndị ọzọ.
- issue: Ike okwu ἀντὶ n’ahịrịokwu banyere ọṅụ e debere n’ihu Jizọs
  choice: Ọṅụ e debere n’ihu ya bụ ihe ọ tụrụ anya ya nke mere ka ọ tachie obi n’obe.
  alternative: Ọ họọrọ obe kama ọṅụ e debere n’ihu ya.
  rationale: Ọ bụ ezie na ἀντί pụrụ ịpụta ‘kama,’ gburugburu okwu a banyere ịtachi obi ruo n’ihe dị n’ihu kwadoro nghọta nke ọṅụ a tụrụ anya ya dịka ihe mkpali, n’enweghị iwepụ ezi ohere nke okwu ahụ n’ebe ndị ọzọ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “onye butere ụzọ” karịa okwu mgbazinye ma ọ bụ okwu ga-eme ka ἀρχηγός bụrụ naanị ‘ode akwụkwọ’; “na-eme ka ... ruo n’uju” na-egosipụta echiche mmezu nke τελειωτής. E jighị okwu okpukpe nke otu ụka pụrụ iche.
