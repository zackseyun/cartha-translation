    text: Ma ọ bụ, “ka ọbara Ebel mma.” N’asụsụ Grik, e dere naanị, “ka Ebel mma”; o yikarịrị ka nke a na-ezo aka n’ọbara Ebel nke tiri mkpu site n’ala (Jenesis 4:10).
    reason: alternative_reading
  - marker: b
    text: “Ọbara e fesara” bụ ọbara àjà e ji fesa eme emume; ọ na-echetara mmadụ ime ka ọgbụgba ndụ guzosie ike na ime ka mmadụ dị ọcha.
    reason: cultural_note
  revision_rationale: The revision supplies the contextually implied perfect declaration in a grammatically complete Igbo form, removes redundant wording for sprinkled blood, and recasts the comparison so it is natural Igbo while retaining the source text’s direct but elliptical reference to Abel. The footnote, rather than the main text, explains the likely allusion to Abel’s blood.
