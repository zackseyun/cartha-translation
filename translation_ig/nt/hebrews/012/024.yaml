revisions:
- from: na bịakwutekwa Jizọs, onye ogbugbo nke ọgbụgba ndụ ọhụrụ, na ọbara e fesara efesa[b], nke na-ekwu ihe ka nke Ebel mma.[a]
  to: na unu abịawo kwa Jizọs, onye ogbugbo nke ọgbụgba ndụ ọhụrụ, na ọbara e fesara[b], nke na-ekwu okwu ka Ebel mma.[a]
  rationale: The revision supplies the contextually implied perfect declaration in a grammatically complete Igbo form, removes redundant wording for sprinkled blood, and recasts the comparison so it is natural Igbo while retaining the source text’s direct but elliptical reference to Abel. The footnote, rather than the main text, explains the likely allusion to Abel’s blood.
