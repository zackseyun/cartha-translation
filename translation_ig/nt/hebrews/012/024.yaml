  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: ig
  text: na unu abịawo kwa Jizọs, onye ogbugbo nke ọgbụgba ndụ ọhụrụ, na ọbara e fesara[b], nke na-ekwu okwu ka Ebel mma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ọbara Ebel mma.” N’asụsụ Grik, e dere naanị, “ka Ebel mma”; o yikarịrị ka nke a na-ezo aka n’ọbara Ebel nke tiri mkpu site n’ala (Jenesis 4:10).
    reason: alternative_reading
  - marker: b
    text: “Ọbara e fesara” bụ ọbara àjà e ji fesa eme emume; ọ na-echetara mmadụ ime ka ọgbụgba ndụ guzosie ike na ime ka mmadụ dị ọcha.
    reason: cultural_note
lexical_decisions:
- source_word: διαθήκης νέας
  choice: nke ọgbụgba ndụ ọhụrụ
  rationale: “Ọgbụgba ndụ” na-egosipụta echiche nke nkwekọrịta Chineke na ndị ya, nke bụ isi ihe διαθήκη pụtara n’akwụkwọ Ndị Hibru. Enweghị akara nkọwa n’asụsụ Grik, ma n’Igbo okwu a na-ada nke ọma ma nwee ike izo aka n’ọgbụgba ndụ ọhụrụ ahụ a maara n’Akwụkwọ Nsọ.
- source_word: μεσίτῃ
  choice: onye ogbugbo
  rationale: Nke a bụ okwu Igbo doro anya maka onye nọ n’etiti ndị abụọ iji mee ka mmekọrịta ma ọ bụ nkwekọrịta guzosie ike; ọ na-echekwa mkpa iwu na nke okpukpe dị n’okwu Grik.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: E dere aha ahụ dịka usoro nsụgharị aha a na-ejikarị n’Igbo.
- source_word: αἵματι ῥαντισμοῦ
  choice: ọbara e fesara efesa
  rationale: Nkebiokwu a na-egosi ọbara e ji usoro ịchụ àjà fesa; nsụgharị a bụ Igbo dị mfe ma na-echekwa oyiyi emume ahụ.
- source_word: κρεῖττον
  choice: ka ... mma
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi gosipụta ntụnyere ‘better,’ bụkwa isiokwu a na-emegharị n’akwụkwọ Ndị Hibru.
- source_word: λαλοῦντι
  choice: nke na-ekwu ihe
  rationale: Ọ na-echekwa participle nke oge ugbu a ma mee ka o doo anya na ‘ọbara’ bụ ihe a kọwara dịka nke na-ekwu.
- source_word: παρὰ τὸν Ἅβελ
  choice: ka nke Ebel mma
  rationale: Grik kpọrọ Ebel n’onwe ya, ọ bụghị ‘ọbara Ebel’ n’ụzọ doro anya. ‘Nke Ebel’ na-eme ka ntụnyere ahụ kwe omume n’Igbo n’etinyeghị ‘ọbara’ n’isi ederede.
theological_decisions:
- issue: Ihe e ji Ebel atụnyere
  choice: E debere ntụnyere ahụ nkenke dịka ‘nke ... ka nke Ebel mma,’ n’etinyeghị ‘ọbara Ebel’ n’isi ederede.
  alternative: “nke na-ekwu ihe ka ọbara Ebel mma” ma ọ bụ “nke na-ekwu ihe ka ihe ọbara Ebel kpọrọ òkù maka ya mma.”
  rationale: Ọnọdụ okwu ahụ na-echetara ọbara Ebel nke kpọrọ òkù site n’ala (Jenesis 4:10), ma Grik kwuru naanị ‘Ebel.’ Idebe nkenke ahụ na-echekwa mgbagwoju anya na esemokwu nkà mmụta okpukpe dị na isi mmalite.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ahịrịokwu ahụ dịka akụkụ nke ndepụta malitere n’amaokwu ndị bu ya ụzọ. Akara nkọwa [a] nọ n’ebe ntụnyere Ebel dị, ebe [b] nọ n’ebe ‘ọbara e fesara efesa’ dị, ka ha kwekọọ n’ihe nkọwa nke ọ bụla na-akọwa.
