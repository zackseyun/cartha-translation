  verdict: revise
  source_fidelity: 'Ihe odide ahụ na-edobe nke ọma ịdọ aka ná ntị, nkwughachi nke παραιτέομαι (“ịjụ”), na nghọta na ndị gara aga enweghị mgbapụ. Otú ọ dị, “Onye ahụ nyere ha ịdọ aka ná ntị n’ụwa” adịghị akọwa χρηματίζοντα n’ụzọ kacha zie ezi ma ọ bụ nke kacha eke: participle ahụ na-akọwa Onye na-adọ aka ná ntị, ọ bụghị ihe o “nyere.” Akụkụ nke abụọ kwesịkwara igosipụta n''ụzọ doro anya ntụnyere πολὺ μᾶλλον.'
  naturalness: “Dọrọ ha aka ná ntị n’ụwa” bụ Igbo nkịtị karịa “nyere ha ịdọ aka ná ntị n’ụwa.” “N’ebe Onye ahụ … nọ” n’ederede mbụ nwekwara ike ịdị ka ebe mmadụ nọ karịa isi n’ebe mmadụ nọ wezuga onwe. “Si n’ebe … nọ tụgharịa azụ” na-akọwa ἀποστρεφόμενοι nke ọma.
  terminology: A hapụrụ onye na-ekwu okwu n’amaghị aha, dịka Grik si mee, n’etinyeghị “Chineke” ma ọ bụ “Kraịst.” E debere “ịdọ aka ná ntị” maka χρηματίζοντα n’ọnọdụ ịdọ aka ná ntị a. E megharịala nkọwa ala peeji a ka ọ ghara ikwu “n’ụwa” n’ebe enweghị ya na τὸν λαλοῦντα.
