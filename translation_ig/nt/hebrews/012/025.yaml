  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: ig
  text: Lezienụ anya ka unu ghara ịjụ Onye ahụ na-ekwu okwu[a]. N’ihi na, ọ bụrụ na ndị ahụ agbanahụghị mgbe ha jụrụ Onye ahụ dọrọ ha aka ná ntị n’ụwa, ọ ka njọ karịa nye anyị, ma ọ bụrụ na anyị esi n’ebe Onye ahụ si n’eluigwe nọ tụgharịa azụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye ahụ na-ekwu.” Participle Grik a na-egosi Onye ahụ na-ekwu okwu ugbu a.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ọ ka njọ karịa nye anyị, ndị na-atụgharị azụ n’ebe Onye ahụ si n’eluigwe nọ.” Grik hapụrụ ngwaa “ịgbanahụ” ka e were ya site n’ahịrịokwu gara aga.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: Lezienụ anya
  rationale: Ọ bụ iwu nye ọtụtụ mmadụ nke na-arụ ọrụ dị ka ịdọ aka ná ntị; “Lezienụ anya” bụ okwu Igbo dị ndụ ma doo anya.
- source_word: μὴ παραιτήσησθε
  choice: ka unu ghara ịjụ
  rationale: “Ịjụ” na-egosi ịghara ịnabata ma ọ bụ ige onye na-ekwu okwu ntị, ma na-enye ohere idowe otu njikọ ahụ mgbe ngwaa a pụtara ọzọ.
- source_word: τὸν λαλοῦντα
  choice: Onye ahụ na-ekwu okwu
  rationale: Na-edobe participle nke oge ugbu a na echiche na okwu ahụ ka na-aga n’ihu, n’akpọghị onye ahụ Chineke ma ọ bụ Kraịst kpọmkwem.
- source_word: ἐξέφυγον
  choice: agbanahụghị
  rationale: Na-egosi na ha enweghị ike ịgbanahụ ihe ga-esi n’ịjụ ahụ pụta, karịsịa ikpe.
- source_word: ἐπὶ γῆς
  choice: n’ụwa
  rationale: Na-edobe ọdịiche dị n’etiti ụwa na eluigwe n’enweghị ịkpọ Saịnaị aha n’amaokwu ahụ.
- source_word: παραιτησάμενοι
  choice: mgbe ha jụrụ
  rationale: Na-egosi ọnọdụ oge nke participle ahụ ma na-edobe nkwughachi nke echiche “ịjụ.”
- source_word: χρηματίζοντα
  choice: Onye ahụ nyere ha ịdọ aka ná ntị
  rationale: Ngwaa Grik a nwere ike ịpụta ozi ma ọ bụ ịdọ aka ná ntị sitere n’aka Chineke; ebe a, ọnọdụ ahụ kwadoro echiche ịdọ aka ná ntị.
- source_word: πολὺ μᾶλλον
  choice: anyị agaghị agbanahụ ma ọlị
  rationale: N’arụmụka na-aga site n’ihe nta gaa n’ihe ka ukwuu, nke a na-egosipụta ike nke nkwubi okwu ọjọọ n’Igbo dị mfe nghọta.
- source_word: ἀποστρεφόμενοι
  choice: ma ọ bụrụ na anyị atụgharịa azụ
  rationale: Na-eme ka ọnọdụ participle ahụ doo anya n’Igbo ma na-egosi isi n’ebe onye ahụ nọ wezuga onwe onye, n’etinyeghị nkọwa ozizi ọzọ.
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: Onye ahụ si n’eluigwe na-adọ aka ná ntị
  rationale: Na-edobe ọdịiche ya na onye nyere ịdọ aka ná ntị n’ụwa, ma na-eburu echiche χρηματίζοντα gaa n’ahịrị nke abụọ maka nghọta.
theological_decisions:
- issue: Onye bụ Onye ahụ na-ekwu okwu ma na-adọ aka ná ntị
  choice: E dere ya n’ụzọ izugbe dịka “Onye ahụ na-ekwu okwu” na “Onye ahụ si n’eluigwe na-adọ aka ná ntị.”
  alternative: Ịkpọ ya “Chineke” ma ọ bụ “Kraịst” kpọmkwem.
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi okwu sitere n’aka Chineke, ma amaokwu ahụ n’onwe ya ejighị aha ma ọ bụ utu aha kpọmkwem; nsụgharị ahụ na-edobe oghere a.
- issue: Ngwaa “ịgbanahụ” nke ahịrị nke abụọ hapụrụ n’asụsụ Grik
  choice: E tinyere “anyị agaghị agbanahụ” ka ahịrịokwu Igbo zuo oke.
  alternative: Ịhapụ ya n’ụdị nkịtị, “ọ ga-akachasị anyị ndị na-atụgharị azụ...”
  rationale: Grik hapụrụ ngwaa ahụ ka a ghọta ya site n’ahịrị gara aga. Ikwughachi ya na-eme ka Igbo doo anya n’etinyeghị ozizi ọhụrụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ụdị ọtụtụ mmadụ “unu” mee iwu ahụ, ma jiri “anyị” mee ka ọdịiche nke onye dere na ndị na-agụ doo anya. E zere ịkpọ onye na-ekwu okwu aha kpọmkwem iji chekwaa nghọtahie ziri ezi nke ederede.
