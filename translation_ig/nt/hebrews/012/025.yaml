revisions:
- from: Lezienụ anya ka unu ghara ịjụ Onye ahụ na-ekwu okwu[a]. N’ihi na ọ bụrụ na ndị ahụ agbanahụghị mgbe ha jụrụ Onye ahụ nyere ha ịdọ aka ná ntị n’ụwa, anyị agaghị agbanahụ ma ọlị ma ọ bụrụ na anyị atụgharịa azụ n’ebe Onye ahụ si n’eluigwe na-adọ aka ná ntị nọ.[b]
  to: Lezienụ anya ka unu ghara ịjụ Onye ahụ na-ekwu okwu[a]. N’ihi na, ọ bụrụ na ndị ahụ agbanahụghị mgbe ha jụrụ Onye ahụ dọrọ ha aka ná ntị n’ụwa, ọ ka njọ karịa nye anyị, ma ọ bụrụ na anyị esi n’ebe Onye ahụ si n’eluigwe nọ tụgharịa azụ.[b]
  rationale: E dochiri usoro na-adịghị eke “nyere ha ịdọ aka ná ntị” anya na “dọrọ ha aka ná ntị,” ma mezie usoro “tụgharịa azụ” ka o doo anya na a na-ewepụ onwe n’ebe Onye si n’eluigwe nọ. E tinyekwara “ọ ka njọ karịa” iji wepụta ike πολὺ μᾶλλον n’Igbo. Nkọwa ala peeji a ka edoziri ka marker ya kwekọọ na okwu e jikọtara ya.
