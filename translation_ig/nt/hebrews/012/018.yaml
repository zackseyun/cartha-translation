  text: Οὐ γὰρ προσεληλύθατε ⸀ψηλαφωμένῳ καὶ κεκαυμένῳ πυρὶ καὶ γνόφῳ καὶ ⸀ζόφῳ καὶ θυέλλῃ
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: ig
  text: N’ihi na unu abịarughị n’ihe a pụrụ imetụ aka[a], na n’ọkụ na-ere ere, na n’ọchịchịrị, na n’oké ọchịchịrị, na n’oké ifufe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ugwu a pụrụ imetụ aka.” Site n’ihe e kwuru n’amaokwu ndị gbara ya gburugburu, Ugwu Saịnaị bụ ihe a na-arụtụ aka na ya; ma okwu Grik maka “ugwu” adịghị kpọmkwem n’amaokwu a.
    reason: alternative_reading
  - marker: b
    text: 'A pụkwara ịsụ ya n’ụzọ a: “N’ihi na unu abịarughị n’ihe a pụrụ imetụ aka, n’ọkụ na-ere ere, n’ọchịchịrị, n’oké ọchịchịrị, na n’oké ifufe.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: N’ihi na ... abịarughị
  rationale: A sụgharịrị γάρ dị ka “N’ihi na” iji gosi na amaokwu a na-akọwa ihe e kwuru tupu ya; “abịarughị” na-eburu ngọnarị Οὐ.
- source_word: προσεληλύθατε
  choice: unu abịarughị
  rationale: Oge perfect na-egosi na ha abịaghị nso ruo n’ọnọdụ a na-ekwu maka ya; okwu a bụ nke dị mfe ma na-edobe echiche nke ịbịaru nso.
- source_word: ψηλαφωμένῳ
  choice: n’ihe a pụrụ imetụ aka
  rationale: Okwu Grik a pụtara ihe a pụrụ imetụ aka. E tinyeghị “ugwu” n’ahịrị bụ isi n’ihi na okwu ahụ adịghị kpọmkwem n’amaokwu Grik a.
- source_word: κεκαυμένῳ πυρί
  choice: n’ọkụ na-ere ere
  rationale: Nkwughachi “na-ere ere” bụ ụzọ Igbo dị ndụ si akọwa ọkụ nọ n’ọnọdụ ire ọkụ nke ukwuu.
- source_word: γνόφῳ
  choice: n’ọchịchịrị
  rationale: γνόφος na-egosi ọchịchịrị, karịsịa ọchịchịrị siri ike; a họọrọ okwu Igbo doro anya ma kwe ka okwu na-esote mee ka ike ya bawanye.
- source_word: ζόφῳ
  choice: n’oké ọchịchịrị
  rationale: ζόφος na-egosi ọchịchịrị dị omimi ma dị egwu. “Oké ọchịchịrị” na-ekewa ya ntakịrị na γνόφος ma na-edobe nchịkọta okwu abụọ ahụ.
- source_word: θυέλλῃ
  choice: n’oké ifufe
  rationale: θύελλα bụ ifufe siri ike ma ọ bụ ajọ ebili mmiri; “oké ifufe” bụ okwu Igbo ugbu a nke ndị mmadụ na-aghọta ngwa ngwa.
theological_decisions:
- issue: Ma a ga-etinye “ugwu” dịka ihe ha bịaruru nso
  choice: E tinyeghị “ugwu” n’ahịrị bụ isi; e dere “ihe a pụrụ imetụ aka.”
  alternative: “ugwu a pụrụ imetụ aka”
  rationale: Ọ bụ ezie na ihe gbara amaokwu a gburugburu na-arụtụ aka n’Ugwu Saịnaị, ὄρος (“ugwu”) adịghị n’ihe odide Grik nke amaokwu a. N’ihi ya, ahịrị bụ isi na-edobe enweghị nkọwa ahụ, ebe nkọwa ala peeji na-egosi ihe a na-aghọta site n’okwu ndị gbara ya gburugburu.
- issue: Oke ngọnarị n’usoro ihe ndị jikọtara site na καί
  choice: Ngọnarị dị na “abịarughị” na-achị usoro ihe niile e jikọtara site na “na.”
  alternative: Ikwughachi “ma ọ bụ” n’ihu ihe nke ọ bụla iji mee ka ngọnarị pụta ìhè
  rationale: Grik jiri Οὐ otu ugboro, were καί ugboro ugboro jikọta ihe ndị ọzọ. Nsụgharị ahụ na-edobe usoro a ma ghara ime ka ihe ndị na-esote bụrụ nkwupụta ziri ezi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nkwughachi “na n’...” na-edobe usoro καί nke Grik, ebe “ọkụ na-ere ere” na-enye ihe oyiyi doro anya n’asụsụ Igbo.
