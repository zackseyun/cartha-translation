id: HEB.12.16
reference: Hebrews 12:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ, ὃς ἀντὶ βρώσεως μιᾶς ἀπέδετο τὰ πρωτοτόκια ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: ig
  text: Ka onye ọ bụla ghara ịbụ onye na-enwe mmekọahụ n’ụzọ rụrụ arụ, ma ọ bụ onye na-enweghị nsọpụrụ n’ihe dị nsọ, dị ka Ịsọ, onye rere ikike ọkpara ya maka naanị otu nri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνος
  choice: onye na-akwa iko
  rationale: Nke a bụ okwu Igbo doro anya nke na-egosi onye na-eme omume mmekọahụ rụrụ arụ, n’enweghị ịgbasa ihe okwu Grik ahụ kwuru.
- source_word: βέβηλος
  choice: onye na-adịghị asọ ihe dị nsọ
  rationale: βέβηλος na-egosi onye na-ele ihe dị nsọ anya dị ka ihe nkịtị ma ọ bụ onye na-enweghị nsọpụrụ nye ya. Nsụgharị a na-ejigide echiche ahụ karịa okwu sara mbara nke pụtara nanị ‘onye na-adịghị atụ egwu Chineke.’
- source_word: πρωτοτόκια
  choice: ọnọdụ ya dị ka ọkpara
  rationale: Ọtụtụ aha a na-ezo aka n’ọnọdụ na ikike niile metụtara ịbụ ọkpara, ọ bụghị nanị otu ihe nketa.
- source_word: ἀντὶ βρώσεως μιᾶς
  choice: n’ihi otu nri
  rationale: Ọ na-egosipụta ọnụ ahịa mgbanwe ahụ—otu nri—n’Igbo dị mfe ma kwekọọ n’ihe odide Grik.
theological_decisions:
- issue: Njikọ βέβηλος na Ịsọ
  choice: onye na-adịghị asọ ihe dị nsọ, dị ka Ịsọ
  alternative: onye na-adịghị atụ egwu Chineke, dị ka Ịsọ
  rationale: Ihe atụ nke Ịsọ metụtara ileghara ọnọdụ ọkpara ya anya; ya mere, echiche nke enweghị nsọpụrụ nye ihe dị nsọ kwesịrị ka e debe ya, n’enweghị ime ka okwu ahụ kwuo kpọmkwem na ọ bụ onye na-ekweghị na Chineke.
- issue: Ihe πόρνος na-akọwa n’usoro ahịrịokwu ahụ
  choice: Hapụ ya ka ọ bụrụ otu n’ime àgwà abụọ a na-adọ aka ná ntị banyere ha
  alternative: Mee ka ma ‘onye na-akwa iko’ ma ‘onye na-adịghị asọ ihe dị nsọ’ kọwaa Ịsọ kpọmkwem
  rationale: Usoro Grik nwere ike ime ka ‘dị ka Ịsọ’ metụta karịsịa βέβηλος, ma ọ naghị ewepụ kpamkpam njikọ sara mbara. Nsụgharị ahụ na-edebe nhịahụ ahụ n’enweghị ịkpọ Ịsọ onye na-akwa iko n’ụzọ doro anya.
translation_notes:
  register: Standard Igbo; okwu ndị dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘Ịsọ’ mee aha Esau, a na-ejikarị ya eme ihe n’Akwụkwọ Nsọ Igbo. Ahịrịokwu ahụ na-aga n’ihu site n’okwu gbara ya gburugburu, ya mere ‘Ka’ dabara n’usoro ịdọ aka ná ntị ahụ.
