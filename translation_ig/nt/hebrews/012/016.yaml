revisions:
- from: Ka onye ọ bụla ghara ịbụ onye na-akwa iko ma ọ bụ onye na-adịghị asọ ihe dị nsọ, dị ka Ịsọ, onye rere ọnọdụ ya dị ka ọkpara n’ihi otu nri.
  to: Ka onye ọ bụla ghara ịbụ onye na-enwe mmekọahụ n’ụzọ rụrụ arụ, ma ọ bụ onye na-enweghị nsọpụrụ n’ihe dị nsọ, dị ka Ịsọ, onye rere ikike ọkpara ya maka naanị otu nri.
  rationale: The revised text broadens the sexual-morality term to match πόρνος, renders βέβηλος naturally as disregard for what is sacred rather than as generic godlessness, preserves the likely association of “like Esau” with the second description without asserting that Esau was sexually immoral, and expresses both the firstborn rights and the exchange-for-one-meal force accurately.
  reviewer_model: gpt-5.6-terra
