  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: ig
  text: Ma unu abịaruola n’Ugwu Zayọn, n’obodo nke Chineke dị ndụ, bụ Jerusalem nke eluigwe, nakwa n’ọtụtụ iri puku[a] ndị mmụọ ozi nọ n’ọgbakọ emume[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ọtụtụ iri puku” nwekwara ike ịpụta nnukwu ìgwè a na-apụghị ịgụta ọnụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nakwa n’ọtụtụ iri puku ndị mmụọ ozi, nakwa n’ọgbakọ emume.” Nhazi okwu Grik nwere ike ijikọ “ọgbakọ emume” na “ndị mmụọ ozi,” ma ọ bụ were ya dị ka ihe ọzọ nọọrọ onwe ya n’usoro ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche siri ike n’etiti ihe ndị na-agụ akwụkwọ bịaruru ugbu a na Ugwu Saịnaị a kọwara tupu nke a.
- source_word: προσεληλύθατε
  choice: unu abịaruola
  rationale: Oge perfect nke Grik na-egosi na ha abịaruola ma ka nọ n’ọnọdụ ahụ; “abịaruola” na-echekwa echiche ahụ n’Igbo.
- source_word: Σιὼν ὄρει
  choice: n’Ugwu Zayọn
  rationale: Nke a na-echekwa aha ugwu ahụ na ihe oyiyi nke ugwu, ma na-ada nke ọma n’Igbo.
- source_word: πόλει θεοῦ ζῶντος
  choice: n’obodo Chineke dị ndụ
  rationale: Ọ na-egosi na obodo ahụ bụ nke Chineke, ma na-echekwa nkọwa dị mkpa bụ “dị ndụ.”
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: Jerusalem nke eluigwe
  rationale: Nkebi a na-akọwakwu “obodo Chineke dị ndụ”; nsụgharị a doro anya ma bụrụkwa nke e ji asụsụ Igbo nkịtị ekwu.
- source_word: μυριάσιν ἀγγέλων
  choice: n’ebe ọtụtụ iri puku ndị mmụọ ozi nọ
  rationale: “Ọtụtụ iri puku” na-egosi nnukwu ìgwè nke μυριάσιν, ma ihe odide ala peeji na-edebe ohere na okwu ahụ nwere ike ịpụta ìgwè a na-apụghị ịgụta ọnụ.
- source_word: πανηγύρει
  choice: n’ọgbakọ emume
  rationale: Okwu a pụtara ọgbakọ ọṅụ ma ọ bụ emume ọha; “ọgbakọ emume” na-echekwa ma echiche nke nnọkọ ma nke mmemme.
theological_decisions:
- issue: Mmekọrịta πανηγύρει na μυριάσιν ἀγγέλων
  choice: A ghọtara “ọgbakọ emume” dị ka nkọwa banyere ọtụtụ iri puku ndị mmụọ ozi.
  alternative: 'A pụrụ ịghọta “ọgbakọ emume” dị ka ihe ọzọ nọọrọ onwe ya n’usoro ahụ: “na ọtụtụ iri puku ndị mmụọ ozi, na ọgbakọ emume.”'
  rationale: Nhazi okwu Grik na-enye ohere maka nghọta abụọ ahụ. Isi nsụgharị jikọtara ya na ndị mmụọ ozi nọ ya nso, ebe ihe odide ala peeji na-echekwa nghọta ọzọ n’enweghị idozi ihe odide ahụ n’ụzọ karịrị ihe o kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Unu” na-egosi na onye dere akwụkwọ na-agwa ọtụtụ mmadụ okwu. A hapụrụ aha “Zayọn” na “Jerusalem” dị ka aha ebe ndị maara nke ọma.
