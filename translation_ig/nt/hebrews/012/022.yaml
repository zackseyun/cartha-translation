    text: “Ọtụtụ iri puku” nwekwara ike ịpụta nnukwu ìgwè a na-apụghị ịgụta ọnụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nakwa n’ọtụtụ iri puku ndị mmụọ ozi, nakwa n’ọgbakọ emume.” Nhazi okwu Grik nwere ike ijikọ “ọgbakọ emume” na “ndị mmụọ ozi,” ma ọ bụ were ya dị ka ihe ọzọ nọọrọ onwe ya n’usoro ahụ.
    reason: alternative_reading
  revision_rationale: The revision preserves the Greek series of coordinated destinations by replacing the added locative expression with a direct prepositional phrase. It also makes the genitive phrase “of the living God” syntactically clear in Standard Igbo. The footnotes retain both the lexical breadth of μυριάδες and the genuine syntactic ambiguity concerning πανηγύρει, without selecting a doctrinal interpretation.
