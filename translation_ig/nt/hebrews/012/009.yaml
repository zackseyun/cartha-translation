    reason: alternative_reading
  revision_rationale: The revision restores the past reference of the two Greek imperfects, replaces a warning-focused expression with wording that covers formative discipline and correction, and adjusts the final linkage so that it more closely reflects the Greek future coordination. The contrast and deliberate breadth of ‘Nna nke mmụọ’ are retained, and all footnote anchors remain aligned with the text.
