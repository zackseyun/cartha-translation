id: HEB.12.9
reference: Hebrews 12:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτὰς καὶ ἐνετρεπόμεθα· οὐ ⸀πολὺ μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων καὶ ζήσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: ig
  text: Ọzọkwa, anyị nwere ndị nna anyị n’anụ ahụ[a] dịka ndị na-azụ ma na-agbazi anyị[b], anyị na-asọpụrụkwa ha. Anyị ọ̀ gaghị edo onwe anyị ọbụna karịa n’okpuru Nna nke mmụọ[c], ma dị ndụ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, ‘ndị nna nke anụ ahụ anyị’; ya bụ, ndị nna anyị bụ mmadụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘ndị na-adọ anyị aka ná ntị.’
    reason: lexical_alternative
  - marker: c
    text: ‘Nna nke mmụọ’ nwere ike ịpụta kpọmkwem Nna nke mmụọ anyị, n’ụzọ dị iche na ndị nna anyị n’anụ ahụ; ma okwu Grik ahụ hapụrụ ihe ọ pụtara ka ọ saa mbara karị.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Ọzọkwa
  rationale: Ọ na-ewebata ihe akaebe ọzọ n’arụmụka ahụ, ọ bụghị nanị ihe mere n’usoro oge.
- source_word: τῆς σαρκὸς ἡμῶν πατέρας
  choice: ndị nna anyị n’anụ ahụ
  rationale: Nke a na-edobe ntụnyere dị n’etiti ndị nna mmadụ mụrụ anyị n’anụ ahụ na Nna nke mmụọ, na-enweghị inye σάρξ echiche nke ọdịdị mmehie.
- source_word: παιδευτὰς
  choice: ndị na-adọ anyị aka ná ntị
  rationale: Ọ na-egosi ndị na-azụ ma na-agbazi ụmụ ha site n’ịdọ aka ná ntị, kwekọọkwa n’okwu παιδεία ndị gbara amaokwu a gburugburu.
- source_word: ἐνετρεπόμεθα
  choice: anyị na-asọpụrụkwa ha
  rationale: N’ebe a, ngwaa ahụ na-egosi nsọpụrụ a na-enye ndị nna n’ihi ọzụzụ na mgbazi ha.
- source_word: οὐ πολὺ μᾶλλον
  choice: Ọ̀ bụ na anyị agaghị ... ọbụna karịa
  rationale: Ụdị ajụjụ a na-egosipụta arụmụka sitere n’ihe nta gaa n’ihe ka ukwuu n’Igbo dị mfe nghọta.
- source_word: ὑποταγησόμεθα
  choice: edo onwe anyị ... n’okpuru
  rationale: Nke a na-egosipụta ịnọ n’okpuru ikike na nrubeisi, ma na-ada ka Igbo e ji eme ihe ugbu a.
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: Nna nke mmụọ
  rationale: A hapụrụ njikọ genitive ahụ ka ọ saa mbara dịka Grik si dị, kama ịkọwa ya naanị dịka ‘Nna nke mmụọ anyị.’
- source_word: ζήσομεν
  choice: wee dị ndụ
  rationale: Ọ na-edobe echiche nke nsonaazụ na ndụ nke ngwaa ọdịnihu Grik ahụ na-egosi.
theological_decisions:
- issue: Ihe ‘Nna nke mmụọ’ pụtara
  choice: E debere ya dịka aha Chineke nke na-egosi mmekọrịta na ikike ya n’ebe mmụọ nọ, n’ụzọ dị iche na ndị nna anyị n’anụ ahụ.
  alternative: ‘Nna nke mmụọ anyị’ ma ọ bụ ‘Nna nke ndị mmụọ.’
  rationale: Grik ekwughị kpọmkwem ‘mmụọ anyị,’ ya mere nsụgharị ahụ ekwesịghị ime ka ihe okwu ahụ pụtara dị warara karịa ka isi mmalite si dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘ịdọ aka ná ntị’ iji jikọta amaokwu ahụ na isiokwu ọzụzụ na mgbazi dị na Hibru 12, ebe ‘n’anụ ahụ’ na ‘nke mmụọ’ na-edobe ntụnyere dị n’isi mmalite.
