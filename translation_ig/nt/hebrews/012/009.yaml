- from: Ọzọkwa, anyị nwere ndị nna anyị n’anụ ahụ[a] dị ka ndị na-adọ anyị aka ná ntị[b], anyị na-asọpụrụkwa ha. Ọ̀ bụ na anyị agaghị edo onwe anyị ọbụna karịa n’okpuru Nna nke mmụọ[c], wee dị ndụ?
  to: Ọzọkwa, anyị nwere ndị nna anyị n’anụ ahụ[a] dịka ndị na-azụ ma na-agbazi anyị[b], anyị na-asọpụrụkwa ha. Anyị ọ̀ gaghị edo onwe anyị ọbụna karịa n’okpuru Nna nke mmụọ[c], ma dị ndụ?
