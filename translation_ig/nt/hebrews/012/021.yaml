source:
  edition: SBLGNT
  text: καί, οὕτω φοβερὸν ἦν τὸ φανταζόμενον, Μωϋσῆς εἶπεν· Ἔκφοβός εἰμι καὶ ἔντρομος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: ig
  text: Ma ihe ahụ a hụrụ dị egwu nke ukwuu, nke mere Mosis ji kwuo[b][a], “Egwu juru m, ana m ama jijiji.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ahụ pụtara” ma ọ bụ “ọhụụ ahụ.” Okwu Grik a na-ezo aka n'ihe pụtara ìhè n'anya na Saịnaị.
    reason: lexical_alternative
  - marker: b
    text: Okwu ndị a abụghị nhota kpọmkwem sitere n'Agba Ochie, kama ha na-egosi ụjọ Mosis e jikọtara na ihe mere na Saịnaị; tulee Diuterọnọmi 9:19.
    reason: cross_reference
lexical_decisions:
- source_word: καί
  choice: dị ... nke na
  rationale: N'usoro ahịrịokwu Igbo a, njikọ a na-aga n'ihu n'ihe e kwuru banyere Saịnaị, ebe usoro ‘dị ... nke na’ na-egosi ihe si n'ịdị egwu ahụ pụta n'ụzọ eke.
- source_word: οὕτω φοβερὸν
  choice: dị nnọọ egwu
  rationale: ‘Nnọọ’ na-egosi ogo nke οὕτω, ‘egwu’ na-ebukwa ike nke φοβερόν n'Igbo doro anya ma dị ugbu a.
- source_word: τὸ φανταζόμενον
  choice: Ihe ahụ a hụrụ
  rationale: Na-egosi ihe pụtara ìhè n'anya na Saịnaị, ma na-ahapụkwa ohere nkọwa ‘ihe ahụ pụtara’ ma ọ bụ ‘ọhụụ ahụ.’
- source_word: Μωϋσῆς
  choice: Mosis
  rationale: Ụdị aha Mozis a na-ejikarị eme ihe n'Igbo.
- source_word: εἶπεν
  choice: kwuru
  rationale: Okwu akụkọ nkịtị na nke ziri ezi maka omume ikwu okwu.
- source_word: Ἔκφοβός εἰμι
  choice: Egwu juru m
  rationale: Na-egosi oke ụjọ dị na ἔκφοβος n'Igbo eke, na-ejikọtaghị ya na okwu na-esote.
- source_word: καὶ ἔντρομος
  choice: ana m amakwa jijiji
  rationale: Na-edobe καί na ἔντρομος iche, si otú ahụ chekwaa ma ụjọ ma ịma jijiji anụ ahụ.
theological_decisions:
- issue: Mmekọrịta okwu Mosis a na akụkọ Saịnaị dị n'Agba Ochie
  choice: E gosiri ya ozugbo dị ka okwu Mosis kwuru n'ihi ihe egwu pụtara ìhè na Saịnaị.
  alternative: Iwere ya dị ka nchịkọta nnwere onwe nke ụjọ Mosis kama ịbụ nhota okwu kpọmkwem.
  rationale: Ederede Grik kwuru ya n'ụzọ kwụ ọtọ dị ka okwu Mosis; ihe gbasara ebe nhota ahụ si kpọmkwem ka e debere n'okpuru ederede, n'enweghị idozi esemokwu ahụ n'ime amaokwu.
translation_notes:
  register: Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. E debere okwu abụọ ἔκφοβος na ἔντρομος iche dịka ‘Egwu juru m’ na ‘ana m amakwa jijiji,’ iji chekwaa ike na nhazi nke Grik.
