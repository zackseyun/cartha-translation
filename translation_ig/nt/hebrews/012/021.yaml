    reason: lexical_alternative
  - marker: b
    text: Okwu ndị a abụghị nhota kpọmkwem sitere n'Agba Ochie, kama ha na-egosi ụjọ Mosis e jikọtara na ihe mere na Saịnaị; tulee Diuterọnọmi 9:19.
    reason: cross_reference
