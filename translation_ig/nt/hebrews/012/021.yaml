revisions:
- from: Ihe ahụ a hụrụ dị nnọọ egwu nke na Mosis kwuru[b][a], “Egwu juru m, ana m amakwa jijiji.”
  to: Ma ihe ahụ a hụrụ dị egwu nke ukwuu, nke mere Mosis ji kwuo[b][a], “Egwu juru m, ana m ama jijiji.”
  rationale: The revision makes the connective and degree in the Greek explicit in natural Igbo, preserves the paired meanings of ‘greatly afraid’ and ‘trembling,’ and corrects the phrasing of the cross-reference footnote without adding an interpretation of the quotation’s precise Old Testament source.
