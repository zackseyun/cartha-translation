id: HEB.4.14
reference: Hebrews 4:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔχοντες οὖν ἀρχιερέα μέγαν διεληλυθότα τοὺς οὐρανούς, Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ, κρατῶμεν τῆς ὁμολογίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: ig
  text: Ya mere, ebe anyị nwere nnukwu onyeisi nchụàjà, onye gabigara n’eluigwe—Jizọs, Nwa Chineke—ka anyị jidesie nkwupụta anyị ike.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: Ya mere, ebe anyị nwere
  rationale: “Ya mere” na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya, ebe “ebe anyị nwere” na-eme ka participle ahụ bụrụ ntọala nke agbamume na-esochi ya n’Igbo dị mfe nghọta.
- source_word: ἀρχιερέα μέγαν
  choice: nnukwu onyeisi nchụàjà
  rationale: Nke a na-echekwa ma ọkwa onyeisi nchụàjà ma nkwusi ike nke μέγαν, n’asụsụ Igbo dị ebube ma bụrụkwa nke nkịtị.
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: nke gafere eluigwe dị iche iche
  rationale: “Gafere” na-egosipụta njem gafee ma ọ bụ site n’ebe ahụ; “eluigwe dị iche iche” na-echekwa ọnụọgụ ọtụtụ nke οὐρανούς kama ime ya naanị otu eluigwe.
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: ya bụ Jizọs, Ọkpara Chineke
  rationale: “Ya bụ” na-eme ka nkọwa onye nnukwu onyeisi nchụàjà ahụ doo anya, ebe “Ọkpara Chineke” na-echekwa aha nsọ na ịdị arọ nke okwu Kraịst ahụ.
- source_word: κρατῶμεν
  choice: ka anyị jidesie ... ike
  rationale: Nke a bụ agbamume a na-enye ndị niile a na-agwa ka ha nọgide na-ejidesi ihe ahụ ike, kwekọrọ na hortatory subjunctive.
- source_word: τῆς ὁμολογίας
  choice: nkwupụta okwukwe anyị
  rationale: “Nkwupụta okwukwe” na-enye ὁμολογία nghọta doro anya dị ka nkwupụta nke ihe ndị kwere ekwe na-ekweta; “anyị” na-eme ka njikọ ya na ndị a na-agba ume pụta nke ọma n’Igbo.
theological_decisions:
- issue: Nsụgharị aha Kraịst υἱὸς τοῦ θεοῦ
  choice: Ọkpara Chineke
  alternative: Nwa Chineke
  rationale: “Ọkpara Chineke” na-echekwa ọdịdị aha nsọ ahụ na ịdị arọ ya, na-enweghị ịkọwa mmekọrịta ahụ karịa ihe ederede kwuru.
- issue: Ichekwa ọnụọgụ ọtụtụ nke τοὺς οὐρανούς
  choice: eluigwe dị iche iche
  alternative: eluigwe
  rationale: Nhọrọ a na-eme ka ụdị ọtụtụ dị n’asụsụ Grik pụta ìhè ma ghara ibelata ihe oyiyi ahụ gaa n’otu eluigwe; ọ naghịkwa akọwapụta usoro eluigwe ndị ahụ karịa ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro arụmụka, ihe oyiyi nke ịgafe eluigwe, na agbamume siri ike nke amaokwu ahụ.
