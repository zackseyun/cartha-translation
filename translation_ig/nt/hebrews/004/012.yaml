revisions:
- from: N’ihi na okwu Chineke dị ndụ, na-arụkwa ọrụ; ọ dị nkọ karịa mma agha ọ bụla nwere ọnụ abụọ. Ọ na-amaba ruo n’ikewa mkpụrụ obi na mmụọ, nkwonkwo na ụmị ọkpụkpụ; ọ na-ekpekwa echiche na ebumnobi nke obi ikpe.[a]
  to: N’ihi na okwu Chineke dị ndụ, na-arụkwa ọrụ; ọ dị nkọ karịa mma agha ọ bụla nwere ọnụ abụọ. Ọ na-abanye ruo n’ikewa mkpụrụ obi na mmụọ, nkwonkwo na ụmị ọkpụkpụ; ọ na-ekpekwa echiche na ebumnobi obi ikpe.[a]
  rationale: The revision replaces an unnatural verb for penetrating and repairs the final clause’s grammar. It does not resolve the imagery of the paired divisions into a doctrine of human composition, nor does it narrow the referent of “okwu Chineke.” The existing footnote remains appropriately anchored and preserves this ambiguity.
