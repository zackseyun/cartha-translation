id: HEB.4.12
reference: Hebrews 4:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: ig
  text: N’ihi na okwu Chineke dị ndụ, na-arụkwa ọrụ; ọ dị nkọ karịa mma agha ọ bụla nwere ọnụ abụọ. Ọ na-abanye ruo n’ikewa mkpụrụ obi na mmụọ, nkwonkwo na ụmị ọkpụkpụ; ọ na-ekpekwa echiche na ebumnobi obi ikpe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu ndị a, “mkpụrụ obi na mmụọ,” anaghị amanye ozizi ọ bụla kpọmkwem banyere akụkụ ole mmadụ nwere. Ihe e mesiri ike bụ na okwu Chineke na-abanye ruo n’ime ime mmadụ ma na-ekpe echiche na ebumnobi ya ikpe.
    reason: alternative_reading
lexical_decisions:
- source_word: Ζῶν
  choice: dị ndụ
  rationale: Na-egosi na okwu Chineke nwere ndụ ma nọgide na-adị ndụ; nke a bụkwa okwu Igbo doro anya ma kwekọọ n’ọrụ ya dịka predicate.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-ejikọta amaokwu a na ndụmọdụ gara aga dịka ihe na-enye ya ihe kpatara ya.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Na-echekwa obosara nke okwu Grik ahụ n’enweghị ime ka ọ bụrụ naanị Akwụkwọ Nsọ, ozi e kwusara, ma ọ bụ Ọkpara ahụ.
- source_word: ἐνεργὴς
  choice: na-arụkwa ọrụ
  rationale: Na-egosi ihe dị irè ma na-eme ihe n’ezie, n’asụsụ Igbo dị ndụ ma dị mfe nghọta.
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: ọ dị nkọ karịa mma agha ọ bụla nwere ọnụ abụọ
  rationale: Na-echekwa ntụnyere na ihe atụ mma agha nke akụkụ ya abụọ na-egbutu.
- source_word: διϊκνούμενος
  choice: Ọ na-amaba ruo
  rationale: Na-egosi ịbanye miri emi ma ruo n’ime, na-aga n’ihu na ihe atụ mma agha.
- source_word: ἄχρι μερισμοῦ
  choice: ruo n’ikewa
  rationale: Na-echekwa echiche nke oke iru na nkewa, n’enweghị ịkọwa kpọmkwem otú ihe ndị a si kewaa.
- source_word: ψυχῆς καὶ πνεύματος
  choice: mkpụrụ obi na mmụọ
  rationale: Nsụgharị kwụ ọtọ nke na-echekwa okwu abụọ ahụ ma ghara ịmanye ozizi pụrụ iche gbasara akụkụ mmadụ.
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: nkwonkwo na ụmị ọkpụkpụ
  rationale: Na-echekwa ihe atụ nke ịbanye ruo n’akụkụ anụ ahụ ndị dị omimi; ‘ụmị ọkpụkpụ’ bụ okwu Igbo doro anya maka marrow.
- source_word: κριτικὸς
  choice: ọ na-ekpekwa ... ikpe
  rationale: Na-egosi ikike okwu Chineke nwere inyocha ma kpebie ihe dị n’ime mmadụ, ọ bụghị naanị ịmata ya.
- source_word: ἐνθυμήσεων
  choice: echiche
  rationale: Na-anọchi echiche na ntụgharị uche dị n’ime obi n’asụsụ Igbo nkịtị.
- source_word: ἐννοιῶν
  choice: ebumnobi
  rationale: Na-ekewapụta okwu a na ‘echiche’ site n’ịkọwa nzube ma ọ bụ ihe obi na-achọ ime.
- source_word: καρδίας
  choice: nke obi
  rationale: Na-echekwa ihe atụ Bible banyere obi dịka ebe echiche na ebumnobi dị.
theological_decisions:
- issue: Ihe ‘okwu Chineke’ na-ezo aka na ya
  choice: E debere ya dịka ‘okwu Chineke’ n’enweghị ịkọwa ya karịa nke ahụ.
  alternative: Akwụkwọ Nsọ naanị; okwu nkwa ma ọ bụ ikpe Chineke kwuru; ma ọ bụ Ọkpara/Logos.
  rationale: Ọnọdụ okwu Hibru na-emesi okwu Chineke na-arụ ọrụ ike, ma okwu Grik ahụ sara mbara; nsụgharị ekwesịghị imechi ihe ọ pụtara n’otu nkọwa ozizi.
- issue: Ihe ‘mkpụrụ obi na mmụọ’ pụtara gbasara ọdịdị mmadụ
  choice: E debere ‘mkpụrụ obi na mmụọ’ dịka okwu abụọ dị n’ederede, n’enweghị ikwu na ha bụ akụkụ mmadụ a pụrụ ikewa n’ụzọ ozizi kpọmkwem.
  alternative: Ịkọwa ya dịka ihe na-egosi n’ụzọ teknụzụ na mmadụ nwere akụkụ abụọ ma ọ bụ atọ dị iche iche.
  rationale: Amaokwu a ji okwu ndị a na ihe atụ nke ịbanye miri emi na ikpe ihe dị n’ime; ọ naghị achọ ka nsụgharị kpebie usoro akụkụ mmadụ.
- issue: Mmekọrịta ndepụta abụọ ahụ na ọrụ ikpe ikpe
  choice: E kewara nkebi ahụ site na semicolon, ka ‘ọ na-ekpekwa’ bụrụ ọrụ ọzọ okwu Chineke na-arụ.
  alternative: Ịgụ ‘onye na-ekpebi echiche na ebumnobi’ dịka nkọwa nke ịbanye n’ikewa.
  rationale: Usoro Grik na-etinye καὶ κριτικὸς dịka predicate ọzọ na ‘dị ndụ,’ ‘na-arụ ọrụ,’ na ‘dị nkọ,’ ya mere nsụgharị ahụ mere ọrụ ikpe ikpe ka ọ pụta ìhè.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘mma agha ... nwere ọnụ abụọ’ mee ka ihe atụ Grik doo anya, ma jiri ‘ụmị ọkpụkpụ’ zere okwu na-edochaghị anya. Ahịrịokwu ahụ na-echekwa usoro na ike nke ihe atụ mbụ, ebe ọ na-agụkwa nke ọma n’Igbo.
