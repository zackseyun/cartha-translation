revisions:
- from: N’ihi na e zikwara anyị ozi ọma ahụ, dịka e ziri ha; ma ozi ahụ ha nụrụ abaghị ha uru, n’ihi na ha esoghị ndị gere ntị jikọọ site n’okwukwe.[a]
  to: N’ezie, a kwusaarala anyị ozi ọma, dị ka e kwusaara ha; ma okwu ahụ ha nụrụ abaghị ha uru, n’ihi na e jikọtaghị ha na ndị gere ntị site n’okwukwe.[a]
  rationale: The revision renders the periphrastic perfect passive with “a kwusaarala,” preserving both the proclamation idea and its continuing relevance. It keeps the SBLGNT-based reading in which the final participle modifies “them,” while using a more natural passive Igbo construction. The footnote preserves the well-known alternative textual reading without presenting it as the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:28:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly follows the SBLGNT reading συγκεκερασμένους as referring to ἐκείνους (“them”), rather than making “the message” the subject of the final clause. However, “e ziri ... ozi ọma” normally suggests that good news was sent, whereas εὐηγγελισμένοι denotes that good news was proclaimed. The revision retains the perfect-passive sense with a natural Igbo proclamation expression.
  naturalness: “A kwusaarala ... ozi ọma” is more idiomatic and precise than “e ziri ... ozi ọma.” The final clause is recast with a passive construction that more naturally expresses the Greek participial relation in Standard Igbo.
  terminology: “Ozi ọma” appropriately renders the proclaimed good news, and “okwukwe” appropriately renders πίστις. “Ndị gere ntị” is retained as an acceptable rendering of τοῖς ἀκούσασιν in this contrastive context.
  issues:
  - severity: medium
    issue: “e zikwara anyị ozi ọma ahụ” understates the proclamation sense of εὐηγγελισμένοι.
    rationale: The Greek means that good news was proclaimed to the audience; “ziga” ordinarily focuses on sending rather than proclamation.
  - severity: low
    issue: “ha esoghị ndị gere ntị jikọọ site n’okwukwe” is somewhat awkward and can imply voluntary association.
    rationale: The Greek perfect passive participle describes their not having been joined/mixed with the receptive hearers in faith. A passive Igbo phrasing better preserves that relation without over-interpreting it.
  revised_text: N’ezie, a kwusaarala anyị ozi ọma, dị ka e kwusaara ha; ma okwu ahụ ha nụrụ abaghị ha uru, n’ihi na e jikọtaghị ha na ndị gere ntị site n’okwukwe.[a]
  revised_footnotes:
