id: HEB.4.2
reference: Hebrews 4:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: ig
  text: N’ezie, a kwusaarala anyị ozi ọma, dị ka e kwusaara ha; ma okwu ahụ ha nụrụ abaghị ha uru, n’ihi na e jikọtaghị ha na ndị gere ntị site n’okwukwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ ihe odide Gris na ntụgharị ọdịnala sịrị: “n’ihi na ozi ahụ ha nụrụ ejikọtaghị ya na okwukwe dị n’ime ndị nụrụ ya.”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: e zikwara anyị ozi ọma ahụ
  rationale: 'Ọ na-echekwa echiche nke perfect passive: e kwusara ha ozi ọma nke ka dị mkpa ugbu a, n’enweghị ime ka okwu ahụ bụrụ naanị aha teknụzụ.'
- source_word: καθάπερ κἀκεῖνοι
  choice: dịka e ziri ha
  rationale: 'Nke a na-egosi nhata dị n’etiti ndị a na-agwa okwu na ọgbọ ahụ nọ n’ọzara: otu abụọ ahụ natara ozi Chineke.'
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: ozi ahụ ha nụrụ
  rationale: Ọ bụ ntụgharị Igbo doro anya nke na-egosi λόγος dịka ihe e kwusara na ἀκοή dịka ihe ha nụrụ.
- source_word: ὠφέλησεν
  choice: abaghị ha uru
  rationale: Nkebiokwu Igbo a bụ nke eke ma na-egosi na ozi ahụ ewetaghị ha uru e kwesịrị inweta.
- source_word: συγκεκερασμένους
  choice: esoghị ... jikọọ
  rationale: Participle ahụ kwekọrọ na ἐκείνους n’ihe odide SBLGNT e nyere, ya mere ọ na-akọwa ndị ahụ dịka ndị a na-ejikọtaghị na ndị gere ntị.
- source_word: πίστει
  choice: site n’okwukwe
  rationale: Ọ na-echekwa πίστις dịka okwukwe, ebe dative ahụ na-egosi ụzọ e si ejikọta ha.
- source_word: τοῖς ἀκούσασιν
  choice: ndị gere ntị
  rationale: ‘Gere ntị’ nwere ike ịpụta ịnụrụ nke ọma ma nabata ihe a nụrụ, nke dabara na ọdịiche dị n’amaokwu ahụ.
theological_decisions:
- issue: Ihe πίστις pụtara n’ebe a
  choice: okwukwe
  alternative: ntụkwasị obi
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi ọdịiche dị n’etiti ịnụrụ ozi na iji okwukwe nabata ya; ‘okwukwe’ na-echekwa okwu Gris ahụ n’enweghị itinye nkọwa otu ụka.
- issue: Njikọ ahịrịokwu ikpeazụ
  choice: ha esoghị ndị gere ntị jikọọ site n’okwukwe
  alternative: ozi ahụ agwakọtaghị na okwukwe n’ime ndị nụrụ ya
  rationale: Ihe odide SBLGNT e nyere nwere συγκεκερασμένους n’accusative plural masculine, nke kacha kwekọọ na ἐκείνους, ‘ha.’ A na-edebe ntụgharị ọdịnala sitere n’ụdị ihe odide ọzọ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Ozi ọma’ na-echekwa echiche nke nkwusa ọma; ‘gere ntị’ na-egosi ịnụrụ nke na-anabata ozi. E tinyere naanị otu akara nkọwa ala peeji n’ebe o metụtara ọdịiche ihe odide na syntax.
