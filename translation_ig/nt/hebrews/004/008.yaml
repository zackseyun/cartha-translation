  text: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: ig
  text: N’ihi na a sị na Jọshụa nyere ha izu ike[a], ọ garaghị ekwu mgbe e mesịrị banyere ụbọchị ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “Jizọs.” Ụdị aha ahụ, Ἰησοῦς, nwere ike izo aka na Jizọs ma ọ bụ Jọshụa; n’ebe a, ihe gbara okwu ahụ gburugburu na-ezo aka n’ụzọ doro anya na Jọshụa nwa Nun.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Jọshụa
  rationale: Ụdị aha Grik a nwere ike ịpụta Jizọs ma ọ bụ Jọshụa; n’ebe a, okwu banyere mbata Izrel n’ala ahụ na-egosi Jọshụa nwa Nun.
- source_word: κατέπαυσεν
  choice: nyere ha izu ike
  rationale: Nke a na-egosipụta ihe ngwaa ahụ pụtara—ime ka mmadụ zuru ike ma ọ bụ inye ya izu ike—ma na-adaba n’okwu gbara amaokwu a gburugburu banyere izu ike Chineke.
- source_word: οὐκ ἂν ... ἐλάλει
  choice: ọ garaghị ekwu
  rationale: Nke a na-egosipụta ọnọdụ megidere ihe mere n’oge gara aga n’ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa.
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: banyere ụbọchị ọzọ
  rationale: Ọ na-echekwa echiche nke ụbọchị ọzọ e kwuru banyere ya, nke na-egosi na nkwa izu ike ahụ akwụsịghị n’oge Jọshụa.
- source_word: μετὰ ταῦτα
  choice: mgbe e mesịrị
  rationale: Ọ na-egosi na e kwuru okwu ahụ n’oge sochiri oge Jọshụa.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru tupu ya dịka nkọwa ma ọ bụ ihe nkwado.
theological_decisions:
- issue: Onye Ἰησοῦς na-ezo aka na ya na Ndị Hibru 4:8
  choice: Jọshụa nwa Nun
  alternative: Jizọs
  rationale: Arụmụka amaokwu a metụtara ndu Jọshụa duuru Izrel banye n’ala ahụ na nkwa izu ike e kwuru ọzọ mgbe e mesịrị. Ma ebe otu ụdị aha Grik ahụ pụtakwara Jizọs, e debere nke ahụ n’ala ala peeji.
- issue: Onye bụ isiokwu nke ἐλάλει
  choice: “ọ” n’enweghị ịkpọ onye ahụ aha
  alternative: “Chineke”
  rationale: Grik ekwughị aha onye ahụ n’ebe a. Iji “ọ” na-echekwa njikọ asụsụ ahụ na nghọta pụrụ ịdị n’okwu gbara ya gburugburu, kama ịgbakwunye “Chineke” n’ahịrị ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “izu ike” mee ka isiokwu ugboro ugboro banyere izu ike nọgide pụta ìhè; e chekwara nnọchiaha “ọ” n’ahịrị nke abụọ ka a ghara ịgbakwunye isiokwu a na-akpọghị aha na Grik.
