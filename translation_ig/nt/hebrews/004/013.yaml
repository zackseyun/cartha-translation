  text: καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: ig
  text: Ọ dịghịkwa ihe e kere eke ọ bụla zoro ezo n’ihu ya; kama ihe niile gba ọtọ, bụrụkwa ndị e kpughere kpamkpam[a] n’anya ya—onye anyị ga-aza ajụjụ nye.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu a sụgharịrị “e kpughere kpamkpam” sitere n’otu ngwaa Grik dị ụkọ. O nwere ike ịkpọlite ihe oyiyi nke olu a kpughere ma ọ bụ a dọghachiri azụ, na-ekwusi ike na ihe niile ghe oghe kpamkpam n’ihu Chineke.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ dị nso na mkpụrụokwu Grik: “onye okwu anyị dị n’ebe ọ nọ.” A pụkwara ịghọta ya dịka “onye anyị na ya nwere ihe anyị na-eme” ma ọ bụ “onye okwu/ikpe anyị dị n’ihu ya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κτίσις
  choice: ihe e kere eke
  rationale: Ọ na-egosi ihe ọ bụla e kere eke n’ụzọ izugbe, ma doo anya karịa okwu pụrụ ịpụta ihe niile e kere ọnụ.
- source_word: ἀφανὴς
  choice: zoro ezo
  rationale: N’ebe a, ihe okwu ahụ pụtara bụ ihe a na-apụghị izochi n’ihu nnyocha Chineke, ọ bụghị nanị ihe anya na-apụghị ịhụ.
- source_word: ἐνώπιον αὐτοῦ
  choice: n’ihu ya
  rationale: Nke a na-agbaso okwu Grik nso ma bụrụkwa okwu Igbo dị mma nke na-egosi ịnọ n’ihu onye na-ahụ ihe niile.
- source_word: πάντα
  choice: ihe niile
  rationale: Ọ na-echekwa oke zuru ụwa ọnụ nke ụdị neuter plural Grik.
- source_word: γυμνὰ
  choice: gba ọtọ
  rationale: Ọ na-echekwa ihe atụ siri ike nke ịbụ onye ekpughere kpamkpam.
- source_word: τετραχηλισμένα
  choice: bụrụ ihe e kpughere kpamkpam
  rationale: Okwu a dị ụkọ ma nwee ike ịkọwa olu e kpughere ma ọ bụ e hulatara azụ; nsụgharị a na-egosi ọnọdụ nke enweghị ihe mkpuchi n’enweghị ịmanye otu ihe atụ a na-arụrịta ụka.
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: n’anya ya
  rationale: Ọ bụ ụzọ Igbo sitere n’okike isi kwuo na ihe niile doro anya nye anya Chineke.
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: onye anyị ga-aza ajụjụ n’ihu ya
  rationale: Ọ na-ebute echiche nke ịza Chineke ajụjụ n’Igbo doro anya, ebe ndetu ala na-echekwa mgbagwoju anya dị n’okwu Grik ahụ.
theological_decisions:
- issue: Nkọwa nke πρὸς ὃν ἡμῖν ὁ λόγος
  choice: onye anyị ga-aza ajụjụ n’ihu ya
  alternative: onye anyị na ya nwere ihe; ma ọ bụ onye okwu/okwu ikpe anyị na-aga n’ihu ya
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-ekwusi ike na Chineke na-enyocha mmadụ ma na-ekpe ikpe. Isi okwu na-egosi ibu ọrụ mmadụ, ebe ndetu ala na-echekwa ụzọ ndị ọzọ e nwere isi ghọta nkebiokwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta mee ihe. A hapụrụ ihe atụ siri ike nke “gba ọtọ,” ma jiri ndetu ala chekwaa ma ihe okwu ụkọ ahụ nwere ike ịpụta na mgbagwoju anya nke nkebi ikpeazụ.
