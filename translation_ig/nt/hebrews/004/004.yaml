source:
  edition: SBLGNT
  text: εἴρηκεν γάρ που περὶ τῆς ἑβδόμης οὕτως· Καὶ κατέπαυσεν ὁ θεὸς ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ ἀπὸ πάντων τῶν ἔργων αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/004.yaml
  text: 'For he has spoken somewhere about the seventh day in this way: “And God rested on the seventh day from all his works,”[a][b]'
translation:
  language: ig
  text: 'N’ihi na o kwuola n’otu ebe[a] banyere ụbọchị nke asaa otu a: “Chineke wee zuru ike[b] n’ọrụ ya niile.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “n’ebe ụfọdụ.” Okwu Grik ahụ pụtara “n’otu ebe”; ọ bụ ụzọ e si webata ebe Akwụkwọ Nsọ a na-akpọghị aha kpọmkwem, ọ bụghị ihe na-egosi obi abụọ banyere ikike ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “kwụsịrị.” Ngwaa Grik ahụ nwere ike imesi ịkwụsị ọrụ ike; e ji “zuru ike” mee ihe ebe a iji chekwaa njikọ ya na Jenesis 2:2 na arụmụka banyere izu ike Chineke na Ndị Hibru 3–4.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: o kwuola
  rationale: Ụdị ngwaa zuru oke na-egosi okwu e kwuru n’oge gara aga nke ka dị mkpa ugbu a; “o kwuola” na-echekwa nghọta ahụ.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe na-akwado ma na-akọwa arụmụka bu ya ụzọ.
- source_word: που
  choice: n’otu ebe
  rationale: Nke a bụ ụzọ Igbo dị mfe isi gosi ebe Akwụkwọ Nsọ a na-akpọghị aha kpọmkwem, n’egosighị na onye dere ya nwere obi abụọ banyere Akwụkwọ Nsọ.
- source_word: περὶ τῆς ἑβδόμης
  choice: banyere ụbọchị nke asaa
  rationale: E tinyere “ụbọchị” nke dị n’echiche Grik ka okwu ahụ doo anya n’Igbo.
- source_word: οὕτως
  choice: otu a
  rationale: Ọ na-ewebata kpọmkwem okwu a ga-ehota n’ụzọ Igbo dị ndụ.
- source_word: Καὶ
  choice: wee
  rationale: “Wee” na-anọchi njikọ dị ná mmalite ihe e hotara ma na-eme ka ahịrịokwu ahụ daa nke ọma n’Igbo.
- source_word: κατέπαυσεν
  choice: zuru ike
  rationale: Nhọrọ a na-echekwa njikọ ya na Jenesis 2:2 na isiokwu izu ike Chineke dị na Ndị Hibru isi 3–4; ihe ọ pụtara gụnyekwara ịkwụsị ọrụ.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ aha Igbo kwesịrị ekwesị na nke a na-ahụkarị maka θεός n’ọnọdụ a.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: n’ụbọchị nke asaa
  rationale: Nke a bụ usoro okwu Igbo doro anya maka ụbọchị a kapịrị ọnụ.
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: site n’ọrụ ya niile
  rationale: “Site n’ọrụ” na-anọchi ἀπό nke na-egosi ihe a kwụsịrị ime, ebe “ọrụ ya niile” na-echekwa ọtụtụ ἔργων na echiche nke izu ezu.
theological_decisions:
- issue: Okwu e ji kọwaa nkwụsị Chineke n’ọrụ n’ụbọchị nke asaa na njikọ ya na isiokwu izu ike n’Akwụkwọ Ndị Hibru
  choice: zuru ike
  alternative: kwụsịrị ọrụ
  rationale: “Zuru ike” na-echekwa njikọ nke amaokwu a na Jenesis 2:2 nakwa arụmụka banyere izu ike Chineke na Ndị Hibru 3–4. Ọ pụtaghị na ike gwụrụ Chineke; ihe a na-elekwasị anya bụ na ọ kwụsịrị ọrụ ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. Ahịrịokwu ahụ na-echekwa usoro nkọwa na ihe e hotara n’asụsụ Grik, ma jiri “wee” mee ka mmalite ihe e hotara bụrụ nke na-ada nke ọma n’Igbo.
