    text: Ma ọ bụ, “n’ihi ekweghị ekwe.” Okwu Grik a nwere ike ịpụta ịjụ ikwere, nke na-apụta ìhè n’ịnupụrụ isi.
    reason: lexical_alternative
  revision_rationale: The revision makes the passive recipient sense of εὐαγγελισθέντες explicit in natural Standard Igbo and removes the overly weighty connector combination. It retains the source’s ambiguity concerning ἀπείθεια, the footnote anchor, and the source’s trailing comma.
