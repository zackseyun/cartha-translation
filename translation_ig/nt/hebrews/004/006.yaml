id: HEB.4.6
reference: Hebrews 4:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: ig
  text: Ebe ọ bụ na ọ ka fọdụrụ ka ụfọdụ banye n’ime ya, ndị e bu ụzọ kwusara ozi ọma abanyeghị n’ihi nnupụisi[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi ekweghị ekwe.” Okwu Grik a nwere ike ịpụta ịjụ ikwere, nke na-apụta ìhè n’ịnupụrụ isi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: Ya mere, ebe ọ bụ na
  rationale: Nke a na-echekwa ma nkwubi okwu nke οὖν ma ihe kpatara ya ma ọ bụ ntọala arụmụka nke ἐπεί.
- source_word: ἀπολείπεται
  choice: ọ ka fọdụrụ
  rationale: Oge ugbu a na-egosi na ohere ahụ ka dị; okwu a bụkwa Igbo nkịtị ma doo anya.
- source_word: τινὰς
  choice: ka ụfọdụ
  rationale: Ọ na-echekwa ntụaka na-akọwaghị kpọmkwem ndị a na-ekwu maka ha, ma na-agakọ nke ọma na ngwaa infinitive ahụ.
- source_word: εἰσελθεῖν εἰς αὐτήν
  choice: banye n’ime ya
  rationale: Nnọchiaha ahụ na-ezo aka n’izu ike Chineke e kwuru okwu ya na amaokwu ndị bu ụzọ, n’enweghị ịtinye aha ahụ n’isi okwu.
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: ndị ahụ e buru ụzọ kwusara ozi ọma
  rationale: 'Nke a na-echekwa olu nnara nke participle ahụ: e kwusara ha ozi ọma; ọ naghịkwa eji okwu ụka siri ike nghọta.'
- source_word: οὐκ εἰσῆλθον
  choice: abanyeghị
  rationale: Ọ bụ ntụgharị doro anya nke aorist e jụrụ ajụ, n’etinyeghị echiche ọzọ dịka na ha nwara ma daa.
- source_word: δι’ ἀπείθειαν
  choice: n’ihi nnupụisi
  rationale: ἀπείθεια na-egosi ịjụ irube isi; “nnupụisi” na-echekwa echiche ahụ, ebe nkọwa ala peeji na-egosi njikọ ya na ekweghị ekwe.
theological_decisions:
- issue: Otú e si tụgharịa ἀπείθεια n’okwu ịdọ aka ná ntị banyere ịbanye n’izu ike Chineke
  choice: n’ihi nnupụisi
  alternative: n’ihi ekweghị ekwe
  rationale: Okwu Grik ahụ nwere ike ịgụnye ekweghị ekwe nke na-apụta ìhè n’ịjụ irube isi. Isi okwu ahụ na-echekwa akụkụ nnupụisi, ebe nkọwa ala peeji na-echekwa ụzọ ọzọ ziri ezi ma ghara ikpochapụ esemokwu dị n’etiti okwukwe na nrubeisi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa njikọ ya na arụmụka amaokwu ndị gbara ya gburugburu, ya mere ọ kwụsịrị na rikoma dịka isi mmalite ahụ.
