revisions:
- from: Ya mere, ebe ọ bụ na ọ ka fọdụrụ ka ụfọdụ banye n’ime ya, ma ndị ahụ e buru ụzọ kwusara ozi ọma abanyeghị n’ihi nnupụisi[a],
  to: Ebe ọ bụ na ọ ka fọdụrụ ka ụfọdụ banye n’ime ya, ndị e bu ụzọ kwusara ozi ọma abanyeghị n’ihi nnupụisi[a],
  rationale: The revision makes the passive recipient sense of εὐαγγελισθέντες explicit in natural Standard Igbo and removes the overly weighty connector combination. It retains the source’s ambiguity concerning ἀπείθεια, the footnote anchor, and the source’s trailing comma.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:28:01Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the inferential/explanatory opening, the continuing availability of entry, the indefinite "some," the prior proclamation of good news, and the causal sense of δι’ ἀπείθειαν. However, the passive participle οἱ πρότερον εὐαγγελισθέντες is incomplete in Igbo: "ndị ahụ e buru ụzọ kwusara ozi ọma" says that good news was proclaimed but does not explicitly identify them as its recipients. "Ndị e bu ụzọ kwusara ozi ọma" naturally supplies the recipient relation and preserves the passive sense.'
  naturalness: '"Ya mere, ebe ọ bụ na" is understandable but somewhat heavy as a combined connector. "Ebe ọ bụ na" suitably conveys ἐπεὶ οὖν in this conditional/inferential continuation. The revised clause is fluent Standard Igbo while retaining the Greek sentence’s unfinished, comma-ending syntax.'
  terminology: '"nnupụisi" is an appropriate rendering of ἀπείθεια here. The footnote’s "ekweghị ekwe" is a valid contextual lexical alternative. "ozi ọma" is standard for εὐαγγέλιον/good news.'
  issues:
  - severity: medium
    issue: The phrase "ndị ahụ e buru ụzọ kwusara ozi ọma" leaves the passive participle’s recipient relation unstated.
    rationale: Greek οἱ πρότερον εὐαγγελισθέντες means those who previously had good news proclaimed to them. In Igbo, "ndị e bu ụzọ kwusara ozi ọma" idiomatically identifies those people as the recipients; retaining "ndị ahụ" after the initial indefinite "ụfọdụ" is also unnecessarily demonstrative.
  revised_text: Ebe ọ bụ na ọ ka fọdụrụ ka ụfọdụ banye n’ime ya, ndị e bu ụzọ kwusara ozi ọma abanyeghị n’ihi nnupụisi[a],
  revised_footnotes:
