id: HEB.4.9
reference: Hebrews 4:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄρα ἀπολείπεται σαββατισμὸς τῷ λαῷ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/009.yaml
  text: So then[a], a Sabbath rest remains for the people of God.
translation:
  language: ig
  text: Ya mere, izuike Sabat[a] ka fọdụrụ maka ndị Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “idebe ụbọchị izuike.” Okwu Grik ahụ, σαββατισμός, dị ụkọ ma nwee njikọ doro anya na Sabat. N'ebe a, ọ pụrụ ịpụta izuike nwere njikọ na Sabat nke ka fọdụrụ maka ndị Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Ya mere
  rationale: Ọ bụ mkpụrụokwu na-egosi nkwubi okwu sitere n'ihe e kwuru tupu ya; “Ya mere” na-egosipụta njikọ echiche ahụ n'Igbo doro anya.
- source_word: ἀπολείπεται
  choice: ka fọdụrụ
  rationale: Ọ na-egosi na ihe ahụ ka dị, a hapụkwara ya ka ndị ahụ nweta ya; “ka fọdụrụ” na-echekwa echiche nke ịdịgide ruo ugbu a.
- source_word: σαββατισμός
  choice: izuike nke Ụbọchị Izuike
  rationale: Okwu Grik a dị ụkọ ma na-ezo kpọmkwem n'Ụbọchị Izuike. Nsụgharị a na-echekwa ma echiche izuike ma njikọ ya na Sabbath, n'emeghị ka ọ bụrụ naanị emume kwa izu ma ọ bụ naanị izuike ime mmụọ.
- source_word: τῷ λαῷ
  choice: nye ndị
  rationale: Dative a na-egosi ndị ihe ahụ dịịrị ma ọ bụ baara uru; “nye ndị” bụ ụzọ Igbo si ekwu na izuike ahụ ka dị maka ha.
- source_word: τοῦ θεοῦ
  choice: nke Chineke
  rationale: 'Ọ na-egosi mmekọrịta na inwe: ha bụ ndị bụ nke Chineke.'
theological_decisions:
- issue: Ihe σαββατισμός pụtara na Ndị Hibru 4:9
  choice: Izuike yiri nke Ụbọchị Izuike, nke ka fọdụrụ nye ndị Chineke
  alternative: Idebe Ụbọchị Izuike n'ụzọ nkịtị; ma ọ bụ izuike ime mmụọ na-enweghị njikọ ọ bụla na Ụbọchị Izuike
  rationale: Okwu ahụ n'onwe ya na-akpọghachi echiche Ụbọchị Izuike, ebe okwu ndị gbara ya gburugburu jikọtara izuike Chineke, ụbọchị nke asaa, na izuike e kwere ndị kwere ekwe ná nkwa. “Izuike nke Ụbọchị Izuike” na-ahapụ njikọ na nghọtahie sara mbara ahụ ka ha abụọ dị.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere “Ụbọchị Izuike” n'ụzọ na-eme ka njikọ okwu Grik ahụ na Sabbath pụta ìhè, ebe “ndị nke Chineke” na-egosi ìgwè mmadụ bụ nke Chineke n'ụzọ doro anya.
