- from: Ya mere, izuike nke Ụbọchị Izuike[a] ka fọdụrụ nye ndị nke Chineke.
  to: Ya mere, izuike Sabat[a] ka fọdụrụ maka ndị Chineke.
  rationale: The revision replaces the cumbersome “izuike nke Ụbọchị Izuike” with “izuike Sabat,” a natural and compact rendering that maintains both the Sabbath association and the contextual concept of rest. It also uses the idiomatic “ndị Chineke.” The note retains the alternative sense of Sabbath observance and does not resolve the term’s debated scope beyond what the Greek and context support.
