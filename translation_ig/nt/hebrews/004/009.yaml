review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inferential force of ἄρα, the continuing availability expressed by ἀπολείπεται, and the reference to God’s people. However, “izuike nke Ụbọchị Izuike” is an unnecessarily indirect and somewhat awkward genitive phrase for σαββατισμός. “Izuike Sabat” more directly retains the term’s Sabbath resonance without deciding whether it refers narrowly to observance or broadly to eschatological rest.
  naturalness: “Ya mere, izuike Sabat ka fọdụrụ maka ndị Chineke” is concise, natural Standard Igbo, and has an appropriate elevated biblical register. “Ndị Chineke” is more idiomatic than “ndị nke Chineke” in this context.
  terminology: “Sabat” is retained as the recognizable biblical designation and joined to “izuike” to reflect σαββατισμός. The footnote preserves “idebe ụbọchị izuike” as a viable lexical alternative without presenting it as the only meaning.
  issues:
  - severity: medium
    issue: Awkward rendering of σαββατισμός
    rationale: “Izuike nke Ụbọchị Izuike” literally sounds like ‘the rest of the Sabbath day’ and is less idiomatic than a direct Sabbath-rest expression. It also makes the compact Greek noun heavier than necessary.
  - severity: low
    issue: Less idiomatic expression for God’s people
    rationale: “Ndị nke Chineke” is understandable, but “ndị Chineke” is the more natural Standard Igbo expression for ‘the people of God’.
  revised_text: Ya mere, izuike Sabat[a] ka fọdụrụ maka ndị Chineke.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “idebe ụbọchị izuike.” Okwu Grik ahụ, σαββατισμός, dị ụkọ ma nwee njikọ doro anya na Sabat. N'ebe a, ọ pụrụ ịpụta izuike nwere njikọ na Sabat nke ka fọdụrụ maka ndị Chineke.
    reason: lexical_alternative
  revision_rationale: The revision replaces the cumbersome “izuike nke Ụbọchị Izuike” with “izuike Sabat,” a natural and compact rendering that maintains both the Sabbath association and the contextual concept of rest. It also uses the idiomatic “ndị Chineke.” The note retains the alternative sense of Sabbath observance and does not resolve the term’s debated scope beyond what the Greek and context support.
