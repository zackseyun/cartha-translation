  yaml_path: translation/nt/hebrews/004/005.yaml
  text: 'And in this place again: ‘They shall certainly not enter my rest.’[a]'
translation:
  language: ig
  text: 'Ọzọ, n’ebe a, ọ sịrị: “Ha agaghị abanye ma ọlị n’izu ike m.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ihe e dere kpọmkwem bụ, “Ọ bụrụ na ha ga-abanye n’izu ike m”; nke a bụ ụzọ iyi nke pụtara, “Ha agaghị abanye ma ọlị n’izu ike m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: n’ebe a
  rationale: Nkebiokwu a na-ezo aka n’ebe ọzọ e dere okwu n’Akwụkwọ Nsọ; “n’ebe a” bụ okwu Igbo dị mfe ma kwekọọ n’ụzọ ode akwụkwọ si akpọtụrụ amaokwu ọzọ.
- source_word: πάλιν
  choice: Ọzọkwa
  rationale: Ọ na-egosi na ode akwụkwọ na-akpọtụrụ Akwụkwọ Nsọ ọzọ; “Ọzọkwa” dabara n’usoro ahịrịokwu Igbo ma bụrụkwa okwu a na-aghọta ngwa ngwa.
- source_word: Εἰ εἰσελεύσονται
  choice: Ha agaghị abanye ma ọlị
  rationale: Ọ bụ usoro iyi iyi sitere n’asụsụ Hibru nke e gosipụtara n’ụdị ahịrịokwu ọnọdụ n’asụsụ Grik, ma ihe ọ pụtara bụ ịjụ ihe ahụ n’ụzọ siri ike. “Ma ọlị” na-echekwa ike nkwupụta ahụ.
- source_word: κατάπαυσίν
  choice: izu ike
  rationale: “Izu ike” bụ okwu Igbo nkịtị nke na-echekwa isiokwu bụ isi nke κατάπαυσις na Ndị Hibru 3–4, n’enweghị ịkọwa ya karịa ka ederede si kwuo.
- source_word: μου
  choice: m
  rationale: E tinyere nnọchiaha nke onye nwe ihe ozugbo n’okwu “izu ike m,” iji chekwaa okwu Chineke dịka e hotara ya n’Abụ Ọma.
theological_decisions:
- issue: Ịsụgharị usoro iyi iyi εἰ εἰσελεύσονται
  choice: Ha agaghị abanye ma ọlị n’izu ike m
  alternative: Ọ bụrụ na ha abanye n’izu ike m
  rationale: Ọ bụ ezie na ọdịdị Grik ya bụ nke ọnọdụ, n’ebe a ọ na-arụ ọrụ dịka ịjụ ihe n’ụzọ siri ike n’usoro iyi iyi sitere n’asụsụ Hibru. Nsụgharị isi ederede na-enye ihe usoro ahụ pụtara, ebe nkọwa ala peeji na-echekwa ọdịdị ya kpọmkwem.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “n’ebe a ka e kwuru” ka o doo anya na a na-akpọtụrụ ebe ọzọ n’Akwụkwọ Nsọ, ebe “ma ọlị” na-egosipụta ike nke iyi iyi ahụ n’enweghị itinye nkọwa okpukpe ọzọ.
