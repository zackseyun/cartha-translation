revisions:
- from: N’ihi na anyị bụ ndị kweere na-abanye n’izu ike ahụ, dị nnọọ ka o kwuru, “Dị ka m ṅụrụ iyi n’iwe m, ‘Ọ bụrụ na ha ga-abanye n’izu ike m!’”[a] Ọ bụ ezie na e mechara ọrụ ya kemgbe e tọrọ ntọala ụwa.[b]
  to: N’ihi na anyị ndị kweere na-abanye n’izu ike ahụ, dị nnọọ ka o kwuru, “Dị ka m ṅụrụ iyi n’iwe m, ‘Ọ bụrụ na ha ga-abanye n’izu ike m!’”[a] ọ bụ ezie na e meworị ọrụ ya site n’oge e tọrọ ntọala ụwa.[b]
  rationale: The revision improves idiomatic Standard Igbo and more closely represents the Greek genitive absolute. It leaves the disputed surface form of the Psalm oath in the main text, with its established emphatic-negative sense explained in the footnote. Footnote anchors remain correctly placed after the quoted oath formula and the final clause they explain.
  reviewer_model: gpt-5.6-terra
