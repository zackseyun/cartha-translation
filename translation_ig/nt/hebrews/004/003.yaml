id: HEB.4.3
reference: Hebrews 4:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: ig
  text: N’ihi na anyị ndị kweere na-abanye n’izu ike ahụ, dị nnọọ ka o kwuru, “Dị ka m ṅụrụ iyi n’iwe m, ‘Ọ bụrụ na ha ga-abanye n’izu ike m!’”[a] ọ bụ ezie na e meworị ọrụ ya site n’oge e tọrọ ntọala ụwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, n’ụzọ nkịtị: “Ọ bụrụ na ha ga-abanye n’izu ike m.” Nke a bụ usoro e ji aṅụ iyi nke pụtara, “Ha agaghị abanye ma ọlị n’izu ike m,” ma ọ bụ, “Ha agaghị abanye n’izu ike m mgbe ọ bụla.”'
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ọ bụ ezie na a rụchaala ọrụ ya site n’oge e tọrọ ntọala ụwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: anyị ... na-abanye
  rationale: Oge dị ugbu a nke ngwaa Grik na-egosi na ndị kwere ekwe na-abanye ugbu a n’izu ike Chineke; ọ naghị eme ka echiche ahụ bụrụ naanị ihe ga-eme n’ọdịnihu.
- source_word: κατάπαυσιν
  choice: izu ike ahụ
  rationale: “Izu ike” bụ okwu Igbo doro anya ma bụrụkwa nke kwesịrị nsọpụrụ; “ahụ” na-egosi izu ike pụrụ iche nke a na-ekwu maka ya n’okwu gbara amaokwu a gburugburu.
- source_word: οἱ πιστεύσαντες
  choice: anyị bụ ndị kweere
  rationale: Nke a na-echekwa ihe ngwaa aorist participle pụtara nakwa otú onye dere akwụkwọ si tinye onwe ya n’etiti ndị ahụ.
- source_word: καθὼς εἴρηκεν
  choice: dị nnọọ ka o kwuru
  rationale: Nke a na-egosi na okwu ahụ ka nwere ike ugbu a, dịka perfect tense Grik si gosi.
- source_word: Ὡς ὤμοσα ἐν τῇ ὀργῇ μου
  choice: Dị ka m ṅụrụ iyi n’iwe m
  rationale: “Iwe” na-eburu ịdị arọ nke ikpe Chineke n’ebe a n’enweghị ịgbakwunye nkọwa ozizi.
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: Ọ bụrụ na ha ga-abanye n’izu ike m!
  rationale: A hapụrụ ọdịdị ahịrịokwu iyi Grik ahụ n’isiokwu bụ isi ka a ghara izochi ụdị okwu sitere n’asụsụ Hibru; nkọwa ala peeji na-akọwa na ọ bụ nkwusioru siri ike.
- source_word: καίτοι
  choice: Ọ bụ ezie na
  rationale: Nke a na-egosi echiche nkwenye-na-emegide nke καίτοι n’ụzọ Igbo nkịtị.
- source_word: τῶν ἔργων ... γενηθέντων
  choice: e mechara ọrụ ya
  rationale: N’okwu banyere okike, nke a na-egosi na ọrụ Chineke bịara n’isi njedebe; ịtinye “ya” na-eme ka onye nwe ọrụ ahụ doo anya dịka ọnọdụ okwu si gosi.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: kemgbe e tọrọ ntọala ụwa
  rationale: Nke a na-echekwa ihe atụ Grik nke ịtọ ntọala ụwa ma bụrụkwa okwu Igbo a pụrụ ịghọta.
theological_decisions:
- issue: Ike nke usoro iyi e hotara n’Abụ Ọma 95
  choice: Debe ya dịka ahịrịokwu nwere “Ọ bụrụ na...” n’isiokwu, kọwaa ike nkwusioru ya n’ala peeji.
  alternative: “Ha agaghị abanye ma ọlị n’izu ike m.”
  rationale: Grik na-echekwa usoro iyi sitere n’asụsụ Hibru nke dị n’ụdị ọnọdụ ma na-arụ ọrụ dịka nkwusioru siri ike. Isiokwu na-echekwa ọdịdị na mgbagwoju anya ahụ; nkọwa ala peeji na-egbochi onye na-agụ ya ịghọtahie ihe ọ pụtara.
- issue: Oge ndị kwere ekwe ji abanye n’izu ike
  choice: 'Jiri oge dị ugbu a: “na-abanye.”'
  alternative: “ga-abanye” ma ọ bụ “na-abanyewanye.”
  rationale: Nke a na-echekwa present tense Grik na esemokwu dị n’etiti ihe ndị kwere ekwe na-enweta ugbu a na mmezu zuru oke nke ka dị n’ihu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere okwu iyi ahụ n’ụdị ya a na-ahụ anya na Grik, ebe nkọwa ala peeji na-akọwa ọrụ ya n’enweghị ịmanye nkọwa otu ụka.
