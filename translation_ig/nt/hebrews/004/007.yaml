  to: 'Ọzọkwa, ọ na-akara otu ụbọchị, “Taa,” mgbe ogologo oge dị otu a gasịrị, dịka e kwuburu, mgbe ọ na-ekwu site na Devid[a], sị:


    “Taa, ọ bụrụ na unu anụ olu ya,

