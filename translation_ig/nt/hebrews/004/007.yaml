revisions:
- from: 'Ọzọkwa, ọ na-ekpebi otu ụbọchị, “Taa.” Mgbe ogologo oge dị otu a gasịrị, ọ na-ekwu site n’ọnụ Devid[a], dị ka e kwuru na mbụ:


