  rationale: The revision keeps the designated-day language, the continuing force of “Taa,” and the Psalm quotation intact. It removes an unexpressed metaphor (“mouth”), uses a more idiomatic verb for divine designation, and aligns the temporal and citation-related clauses more closely with the Greek syntax while preserving the alternative reading in the footnote.
