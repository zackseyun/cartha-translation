id: HEB.4.7
reference: Hebrews 4:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: ig
  text: 'Ọzọkwa, ọ na-akara otu ụbọchị, “Taa,” mgbe ogologo oge dị otu a gasịrị, dịka e kwuburu, mgbe ọ na-ekwu site na Devid[a], sị:


    “Taa, ọ bụrụ na unu anụ olu ya,

    unu emela ka obi unu sie ike.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime Devid,” ya bụ, n’abụ ọma e jikọrọ ya na Devid.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: Ọzọkwa
  rationale: Ọ na-egosi na arụmụka ahụ laghachiri n’echiche na Chineke wepụtara ụbọchị ọzọ maka nzaghachi, n’emeghị ka ọ pụta na okwu a bụ naanị ‘oge ọzọ.’
- source_word: τινὰ ἡμέραν
  choice: otu ụbọchị
  rationale: N’Igbo, ‘otu ụbọchị’ na-egosi ụbọchị a kapịrị ọnụ n’agbanyeghị na a kọwaghị ya tupu e kpọọ ya ‘Taa’; ịgbakwunye ‘pụrụ iche’ ga-etinye echiche na-adịghị na Grik.
- source_word: ὁρίζει
  choice: na-ekpebi
  rationale: ‘Na-ekpebi’ na-egosi iji ikike wepụta ma ọ bụ kaa ụbọchị ahụ, ma bụrụkwa okwu doro ndị na-agụ Igbo nke oge a anya.
- source_word: Σήμερον
  choice: Taa
  rationale: E debere ya dịka aha e ji kpọọ ụbọchị ahụ n’arụmụka na n’okwu e hotara n’Abụ Ọma 95.
- source_word: ἐν Δαυὶδ λέγων
  choice: ọ na-ekwu site n’ọnụ Devid
  rationale: Nke a na-egosi na Chineke kwuru okwu ahụ site n’aka Devid, ma ọ naghị ekwusi ike karịa ihe ahịrịokwu Grik ahụ kwuru banyere onye dere abụ ọma ahụ.
- source_word: μετὰ τοσοῦτον χρόνον
  choice: Mgbe ogologo oge dị otu a gasịrị
  rationale: Ọ na-echekwa nkwusi ike dị na Grik banyere ogologo oge gafere kemgbe ọgbọ ahụ nọ n’ọzara.
- source_word: καθὼς προείρηται
  choice: dị ka e kwuru na mbụ
  rationale: Ọ na-egosi na e kwuburu okwu a nakwa na okwu ahụ ka bara uru n’arụmụka a.
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: ọ bụrụ na unu anụ olu ya
  rationale: Ọ na-echekwa okwu atụ ‘ịnụ olu’ n’ebugharịghị ya ozugbo ka ọ bụrụ ‘irube isi,’ ọ bụ ezie na n’ọnọdụ a ịnụ ahụ chọrọ nzaghachi.
- source_word: μὴ σκληρύνητε
  choice: unu emela ka ... sie ike
  rationale: Nke a bụ ụzọ Igbo si ekwu iwu ahụ n’ụzọ doro anya ma na-echekwa ihe oyiyi nke ime ka obi sie ike.
- source_word: τὰς καρδίας ὑμῶν
  choice: obi unu
  rationale: ‘Obi’ bụ okwu Igbo kwesịrị ekwesị maka ime mmadụ, uche, na ọnọdụ ime mmụọ ya n’okwu Baịbụl.
theological_decisions:
- issue: Ike okwu ‘Taa’ nwere n’arụmụka banyere izu ike Chineke
  choice: E gosipụtara ‘Taa’ dịka ohere Chineke ka na-enye ugbu a ka ndị mmadụ nụ olu ya ma zaghachi.
  alternative: Ịkọwa ya naanị dịka ụbọchị akụkọ ihe mere eme nke onye ọbụ abụ, ma ọ bụ naanị dịka ụbọchị ikpeazụ nke ụwa.
  rationale: Amaokwu ahụ na-ekwu na ogologo oge gachara, Chineke ka na-akpọ otu ụbọchị ‘Taa.’ Nsụgharị ahụ hapụrụ njikọ ya na oge ugbu a na nke ga-abịa n’enweghị ịmanye otu usoro nkà mmụta okpukpe n’elu ederede ahụ.
- issue: Ihe ἐν Δαυὶδ pụtara
  choice: site n’ọnụ Devid
  alternative: ‘n’ime Devid,’ ya bụ, n’abụ ọma e jikọrọ ya na Devid
  rationale: Nhọrọ bụ isi na-eme ka ụzọ Chineke si kwuo okwu site n’aka Devid doo anya n’Igbo. Ihe odide ala peeji na-echekwa ụzọ ọzọ e nwere ike isi ghọta akpaokwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E kewara ahịrịokwu mbụ ụzọ abụọ iji mee ka ogologo usoro okwu Grik ahụ daa nke ọma n’Igbo, ebe e chekwara usoro echiche ya. E tinyere akara [a] ozugbo n’akụkụ ‘Devid,’ ebe ihe odide ala peeji ahụ metụtara.
