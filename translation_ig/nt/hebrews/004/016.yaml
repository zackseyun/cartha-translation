id: HEB.4.16
reference: Hebrews 4:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: προσερχώμεθα οὖν μετὰ παρρησίας τῷ θρόνῳ τῆς χάριτος, ἵνα λάβωμεν ἔλεος καὶ χάριν εὕρωμεν εἰς εὔκαιρον βοήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: ig
  text: Ya mere, ka anyị jiri obi ike[a] bịaruo ocheeze amara nso, ka anyị wee nata ebere ma chọta amara maka enyemaka n’oge kwesịrị ekwesị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “jiri ntụkwasị obi.” Okwu Grik a nwere ike ịpụta ma obi ike ma nnwere onwe ikwu okwu ma ọ bụ ịbịaru nso.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “maka enyemaka n’oge mkpa.” N'ụzọ dabara nnọọ n’okwu Grik, ọ na-ezo aka n’enyemaka nke na-abịa n’oge kwesịrị ekwesị.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: ka anyị ... bịaruo ... nso
  rationale: Ngwaa a bụ present middle subjunctive nke na-akpọ ndị na-agụ akwụkwọ òkù ime ihe ọnụ. “Ka anyị bịaruo nso” bụ Igbo dị ugbu a, doo anya, ma debe echiche nke ịbịakwute Chineke.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya banyere Jizọs dị ka nnukwu onye nchụàjà.
- source_word: μετὰ παρρησίας
  choice: jiri obi ike
  rationale: παρρησία nwere ike ịpụta nkwuwa okwu, nnwere onwe ikwu okwu, ma ọ bụ ntụkwasị obi n’ịbịaru nso. “Jiri obi ike” na-egosipụta ịbịaru nso n’atụghị egwu, ma ọ naghị enye echiche nke mpako.
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: ocheeze amara
  rationale: Nke a na-edebe ihe atụ nke ocheeze na njikọ genitive nke χάρις n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: ἵνα
  choice: ka anyị wee
  rationale: Ọ na-egosi ebumnuche nke ịbịaru nso ma na-ada ka Igbo nkịtị.
- source_word: λάβωμεν ἔλεος
  choice: nata ebere
  rationale: “Nata” dabara na λαμβάνω, ebe “ebere” bụ okwu doro anya maka ἔλεος.
- source_word: χάριν εὕρωμεν
  choice: chọta amara
  rationale: Nke a na-edebe ọdịiche dị n’etiti ebere a na-anata na amara a na-achọta, ma na-ejikwa “amara” maka okwu dị mkpa bụ χάρις.
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: maka enyemaka n’oge kwesịrị ekwesị
  rationale: Ọ na-elekwasị anya n’enyemaka nke na-abịa n’oge ziri ezi, dị ka εὔκαιρος si pụta, kama ịgbanwe ya naanị ka ọ bụrụ oge onye ahụ nọ ná mkpa.
theological_decisions:
- issue: Ihe παρρησία pụtara mgbe mmadụ na-abịakwute Chineke
  choice: jiri obi ike
  alternative: jiri ntụkwasị obi
  rationale: “Obi ike” na-edebe ike nke okwu Grik nke na-egosi nnwere onwe na enweghị ụjọ n’ịbịaru Chineke nso site n’ozi Jizọs dị ka nnukwu onye nchụàjà, ma ọ naghị akwalite mpako.
- issue: Nsụgharị χάρις n’ahịrịokwu nke abụọ
  choice: amara
  alternative: ihu ọma
  rationale: “Amara” ziri ezi n’ebe a ma na-edebe njikọ okwu ahụ na “ocheeze amara” nakwa ịdị arọ nke χάρις n’akwụkwọ Ndị Hibru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ debere ụda agbamume nke Grik, ihe atụ “ocheeze amara,” na ọdịiche dị n’etiti “nata ebere” na “chọta amara.”
