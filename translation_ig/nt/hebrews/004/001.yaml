id: HEB.4.1
reference: Hebrews 4:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Φοβηθῶμεν οὖν μήποτε καταλειπομένης ἐπαγγελίας εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ δοκῇ τις ἐξ ὑμῶν ὑστερηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/001.yaml
  text: Therefore[a], let us fear lest, while the promise of entering his rest still remains[c][b], any one of you should seem to have fallen short.
translation:
  language: ig
  text: Ya mere[a], ka anyị tụọ egwu, ka ọ ghara ịbụ na, ebe nkwa ịbanye n’izu ike ya ka dị[b], onye ọ bụla n’ime unu yiri ka ọ rughịla ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, ‘ka ụjọ jide anyị.’ Okwu Grik ahụ siri ike karịa nanị ‘ka anyị kpachara anya,’ ma na-edobe ịdị arọ nke ịdọ aka ná ntị ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya n’ụzọ dabara kpọmkwem n’usoro Grik, ‘ebe nkwa ịbanye n’izu ike ya fọdụrụ.’
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsụ ya, ‘a ga-eche na onye ọ bụla n’ime unu erughịla ya.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Φοβηθῶμεν
  choice: ka anyị tụọ egwu
  rationale: Nke a na-edobe ike nke ndụmọdụ ahụ dị n’ọrụ Grik; ọ bụghị nanị ịkpachara anya, kama ọ bụ ịtụ egwu n’ihi ịdị arọ nke ịdọ aka ná ntị ahụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya banyere ndị Izrel na-abanyeghị n’izu ike ahụ.
- source_word: μήποτε
  choice: ka ọ ghara ịbụ na
  rationale: Nkebiokwu a na-ebute ihe ọjọọ a na-adọ ndị na-agụ akwụkwọ aka ná ntị ka ha zere.
- source_word: καταλειπομένης ἐπαγγελίας
  choice: ebe nkwa ... ka dị
  rationale: 'Ọ na-egosi ọnọdụ na-aga n’ihu: nkwa ahụ akwụsịbeghị, kama ọ ka dị.'
- source_word: εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: ịbanye n’izu ike ya
  rationale: Ọ na-edobe infinitive ‘ịbanye’ na nnọchiaha ‘ya’ dịka ihe odide Grik si dị, n’enweghị ịkọwa karịa ihe amaokwu ahụ kwuru.
- source_word: δοκῇ
  choice: ga-adị ka
  rationale: Nhọrọ a na-echekwa echiche nke iyi ihe ma ọ bụ ịbụ ihe a na-ele anya dị ka ya, kama ikpebi n’ụzọ doro anya na ọdịda ahụ emezuola.
- source_word: τις ἐξ ὑμῶν
  choice: onye ọ bụla n’ime unu
  rationale: Ọ na-echekwa ịdị n’otu nke τις na ike nke ịdọ onye ọbụla n’ime ìgwè ahụ aka ná ntị.
- source_word: ὑστερηκέναι
  choice: onye dara azụ, ghara iru ya
  rationale: N’ọnọdụ a, okwu ahụ na-ekwu maka ịda azụ ma ghara iru ihe e kwere ná nkwa; ntụgharị a bụ Igbo doro anya ma na-edobe echiche nke ịghara iru ihe mgbaru ọsọ.
theological_decisions:
- issue: Ma a ga-eme ka ịdọ aka ná ntị ahụ dị nro dịka nanị ịkpachara anya
  choice: Ka anyị tụọ egwu
  alternative: Ka anyị kpachara anya
  rationale: Φοβηθῶμεν bụ okwu siri ike banyere egwu. Idebe ya otu a na-echekwa ịdị arọ nke ịdọ aka ná ntị ahụ n’enweghị idozi ajụjụ ozizi banyere nnọgidesi ike ma ọ bụ ịdapụ n’okwukwe.
- issue: Ma a ga-akọwa ‘izu ike ya’ ozugbo dịka izu ike ikpeazụ nke Chineke
  choice: Izu ike ya
  alternative: Izu ike nke Chineke; izu ike Sọnde ya
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi onye nnọchiaha ahụ na-ekwu maka ya, ma amaokwu ahụ n’onwe ya ji nnọchiaha. Nhọrọ a anaghị etinye nkọwa karịrị ihe e dere.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị nsọ ma dịkwa mfe nghọta. ‘Izu ike’ na-aga n’ihu n’otu okwu isi nke Ndị Hibru 3–4; e zere ịgbakwunye nkọwa otu ụka ma ọ bụ idozi nghọta abụọ dị na δοκῇ.
