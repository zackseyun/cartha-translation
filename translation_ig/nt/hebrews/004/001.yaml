revisions:
- from: Ya mere[a], ka anyị tụọ egwu, ka ọ ghara ịbụ na, ebe nkwa ịbanye n’izu ike ya ka dị[b], onye ọ bụla n’ime unu ga-adị ka onye dara azụ, ghara iru ya[c].
  to: Ya mere[a], ka anyị tụọ egwu, ka ọ ghara ịbụ na, ebe nkwa ịbanye n’izu ike ya ka dị[b], onye ọ bụla n’ime unu yiri ka ọ rughịla ya[c].
  rationale: The revision removes “onye dara azụ,” which exceeds the sense of ὑστερηκέναι, and replaces it with “rughịla ya,” preserving the sense of having fallen short of attaining the rest. “Yiri ka” explicitly and naturally carries the qualifying force of δοκῇ. The rest of the draft, including the terminology for God’s rest and the footnote anchors, is retained.
  reviewer_model: gpt-5.6-terra
