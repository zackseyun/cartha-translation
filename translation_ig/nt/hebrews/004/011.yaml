revisions:
- from: N’ihi ya, ka anyị gbalịsie ike ịbanye n’izu ike ahụ, ka onye ọ bụla ghara ịda site n’ịgbaso otu ụkpụrụ nnupụisi ahụ.[a]
  to: N’ihi ya, ka anyị gbalịsie ike ịbanye n’izu ike ahụ, ka onye ọ bụla ghara ịda n’otu ụkpụrụ ahụ nke nnupụisi.[a]
  rationale: The revision removes the interpretive addition “ịgbaso” while preserving the source’s warning that no one fall in/by the same pattern of disobedience. It also clarifies the footnote’s alternative so that the sense “same example of unbelief” is represented without displacing the Greek demonstrative.
  reviewer_model: gpt-5.6-terra
