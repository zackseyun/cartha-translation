source:
  edition: SBLGNT
  text: σπουδάσωμεν οὖν εἰσελθεῖν εἰς ἐκείνην τὴν κατάπαυσιν, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: ig
  text: N’ihi ya, ka anyị gbalịsie ike ịbanye n’izu ike ahụ, ka onye ọ bụla ghara ịda n’otu ụkpụrụ ahụ nke nnupụisi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu ihe atụ ahụ nke ekweghị ekwe.” Okwu a nwere ike izo aka n’omume ọgbọ ahụ nọ n’ọzara, ndị jụrụ ịtụkwasị Chineke obi; ma okwu Grik ahụ pụtara kpọmkwem “nnupụisi” ma ọ bụ “ịjụ irube isi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: ka anyị gbalịsie ike
  rationale: Ụdị hortatory subjunctive a na-akpọ ndị na-agụ akwụkwọ ka ha jiri ịnụ ọkụ n’obi na ịdị uchu mee ihe; ‘ka anyị gbalịsie ike’ bụ Igbo nkịtị nke na-egosipụta ike nke okwu ahụ.
- source_word: οὖν
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya banyere izu ike Chineke na ọdịda Izrel.
- source_word: εἰσελθεῖν
  choice: ịbanye
  rationale: Nke a na-egosipụta ihe a na-agba mbọ ime, ma bụrụkwa nsụgharị kpọmkwem na nke doro anya.
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: n’izu ike ahụ
  rationale: ‘Ahụ’ na-echekwa ike demonstrative ahụ ma na-ezo aka n’izu ike ahụ a tụlerela n’amaokwu ndị bu ụzọ.
- source_word: ἵνα μὴ
  choice: ka ... ghara
  rationale: Ọ na-echekwa nzube ma ọ bụ nsonaazụ a chọrọ izere, n’ụdị Igbo dị mfe ma dị ike.
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: site n’ịgbaso otu ụkpụrụ ... ahụ
  rationale: ὑπόδειγμα nwere ike ịbụ ihe atụ, ụkpụrụ, ma ọ bụ ihe ịdọ aka ná ntị. N’ebe a ọ na-ezo aka n’ụzọ ọgbọ ọzara si mee ihe; ‘ịgbaso otu ụkpụrụ’ na-eme ka echiche nke imeghachi ụzọ ahụ pụta ìhè n’Igbo.
- source_word: πέσῃ
  choice: ịda
  rationale: Ọ na-echekwa ihe oyiyi na ịdọ aka ná ntị siri ike dị n’okwu Grik ahụ.
- source_word: τῆς ἀπειθείας
  choice: nnupụisi
  rationale: ἀπείθεια pụtara n’ụzọ kacha nso ajụjụ irube isi ma ọ bụ nnupụisi. ‘Nnupụisi’ bụ okwu Igbo dị nkenke nke na-egosi ịjụ irube isi, ebe a na-edebe ‘ekweghị ekwe’ dịka nhọrọ dabere n’ọnọdụ.
theological_decisions:
- issue: Mmekọrịta ἀπείθεια na ekweghị ekwe nke ọgbọ ahụ nọ n’ọzara
  choice: Jiri ‘nnupụisi’ n’ahịrị isi.
  alternative: ‘ekweghị ekwe’
  rationale: Ndị Hibru jikọtara ekweghị ekwe na nnupụisi ọnụ, ma uru mkpụrụokwu ἀπείθεια bụ kpọmkwem ịjụ irube isi. Nsụgharị a anaghị agwakọta echiche abụọ ahụ, ebe ihe odide ala peeji na-echekwa nhọrọ sitere n’ọnọdụ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwanyere ùgwù, ma dị mfe nghọta. E ji ‘izu ike’ mee ka isiokwu κατάπαυσις nke gbara amaokwu ahụ gburugburu nọgide n’otu ụzọ; e zere nkọwa nke ga-akọwapụta ụdị izu ike ahụ karịa ihe odide Grik kwuru.
