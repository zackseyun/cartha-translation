review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the hortatory force of σπουδάσωμεν, the inferential οὖν, entry into the specified rest, and the warning against falling. However, “site n’ịgbaso” (“by following”) makes explicit an action that the Greek ἐν τῷ αὐτῷ ὑποδείγματι does not expressly state. The revised wording retains the Greek’s more compact image of falling in/by the same pattern or example.
  naturalness: The revised sentence is fluent, contemporary Standard Igbo and maintains the sober exhortative register of Hebrews. “n’otu ụkpụrụ ahụ nke nnupụisi” is natural while avoiding the added verbal idea “following.”
  terminology: “Izu ike” appropriately maintains κατάπαυσις in the surrounding context. “Nnupụisi” is a suitable concise rendering of ἀπείθεια, with “ekweghị ekwe” retained only as a contextual alternative in the note. The footnote is adjusted so that “ahụ” represents “same,” rather than suggesting a separately specified unbelief.
  issues:
  - severity: medium
    issue: The phrase “site n’ịgbaso otu ụkpụrụ” adds “following.”
    rationale: The Greek says literally that someone may fall “in/by the same pattern/example of disobedience”; it does not explicitly use a verb meaning “follow.” This addition modestly narrows the warning’s imagery.
  - severity: low
    issue: The footnote’s demonstrative placement is potentially misleading.
    rationale: In “otu ihe atụ nke ekweghị ekwe ahụ,” “ahụ” can read as qualifying “unbelief,” whereas αὐτῷ qualifies “example/pattern” (“the same example”). The revision places “ahụ” with “ihe atụ.”
  revised_text: N’ihi ya, ka anyị gbalịsie ike ịbanye n’izu ike ahụ, ka onye ọ bụla ghara ịda n’otu ụkpụrụ ahụ nke nnupụisi.[a]
