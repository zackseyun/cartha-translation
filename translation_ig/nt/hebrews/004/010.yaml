  rationale: The revision preserves the Greek syntax and its theological restraint while replacing an unnatural verb form. “Onwe ya kwa” explicitly carries the emphatic/additive καὶ αὐτός. The rest/work terminology and the ambiguity of “ya” are retained, and both footnotes remain anchored to the relevant expressions.
