    rationale: This verbal form is less natural and potentially unclear in this context. Recasting as “onwe ya kwa zuru ike” provides an idiomatic Standard Igbo expression while explicitly preserving the force of καὶ αὐτός.
  - severity: low
    issue: Footnote b has awkward wording (“akwụsịkwala ọrụ ya”; “sitere n’otu mgbọrọgwụ okwu ahụ”).
    rationale: The alternative should naturally express ceasing from works, and the explanation should state clearly that the Greek verb and the translated noun are cognate.
