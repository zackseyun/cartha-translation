  source_fidelity: The draft accurately reflects the generic substantive participle, the explanatory γάρ, the repeated rest terminology, the comparison with God, and the deliberately non-specific sense of “works.” The pronoun after “rest” remains appropriately unexpanded in the main text. A small revision more clearly represents both καὶ and emphatic αὐτός (“onwe ya kwa”).
  naturalness: “Ezuwokwa ike” is not the most natural form in this sentence. “Onwe ya kwa zuru ike” is idiomatic Standard Igbo and expresses the completed action plainly. The revised footnotes also improve grammatical fluency.
  terminology: “Izu ike / zuru ike” appropriately maintains the lexical and thematic connection between κατάπαυσις and κατέπαυσεν. “Ọrụ” suitably preserves the broad, non-doctrinal meaning of ἔργα. “Chineke” is correct.
