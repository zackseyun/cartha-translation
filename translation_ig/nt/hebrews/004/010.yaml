id: HEB.4.10
reference: Hebrews 4:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/010.yaml
  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: ig
  text: N’ihi na onye banyere n’izu ike ya[a] onwe ya kwa zuru ike n’ọrụ ya[b], dị ka Chineke zuru ike n’ọrụ nke ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye banyere n’izu ike Chineke.” N’ime Ndị Hibru 3–4, o yikarịrị ka “ya” na-ezo aka na Chineke.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “akwụsịla ịrụ ọrụ ya.” Ngwaa Grik a na okwu a sụgharịrị “izu ike” sitere n’otu mgbọrọgwụ; ya mere, ahịrị bụ isi debere nkwughachi okwu banyere izu ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: onye banyere
  rationale: Nkebiokwu a na-arụ ọrụ dịka aha ma na-ezo aka n’otu onye n’ụzọ zuru ezu; “onye banyere” na-egosi na nbanye ahụ emeela.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata nkọwa na-akwado ihe e kwuru n’amaokwu bu ụzọ.
- source_word: κατάπαυσιν
  choice: izu ike
  rationale: Nke a bụ okwu isi na Ndị Hibru 3–4, na-ejikọta izu ike Chineke na nkwa nke ịbanye n’ime ya.
- source_word: αὐτοῦ (after κατάπαυσιν)
  choice: ya
  rationale: Nnọchiaha Igbo a na-edebe ọnọdụ okwu Grik ahụ nke na-akọwaghị onye ọ na-ezo aka n’ụzọ doro kpamkpam; gburugburu amaokwu ahụ na-akwado na ọ bụ Chineke.
- source_word: καὶ αὐτὸς
  choice: ezuwokwa
  rationale: Ngwakọta “-kwa” na nhazi ahịrịokwu ahụ na-egosi na onye ahụ n’onwe ya ezuwokwa ike, dịka Chineke mere.
- source_word: κατέπαυσεν
  choice: zuo ike
  rationale: Nhọrọ a na-edebe njikọ okwu ya na κατάπαυσις, karịa ịsụgharị ya naanị dịka “kwụsị.”
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: n’ọrụ ya
  rationale: “Ọrụ” bụ ntụgharị sara mbara nke ἔργα ma ọ naghị amanye nkọwa banyere ụdị ọrụ ndị ahụ.
- source_word: ὥσπερ
  choice: dịka
  rationale: Ọ na-egosi ntụnyere doro anya n’etiti izu ike onye ahụ na izu ike Chineke.
- source_word: τῶν ἰδίων
  choice: n’ọrụ nke ya
  rationale: Ọ na-eme ka ihe e hapụrụ n’okwu Grik doo anya n’Igbo, ma na-ekwusi ike na ọrụ ndị ahụ bụ nke Chineke n’onwe ya.
- source_word: ὁ θεός
  choice: Chineke
  rationale: Nke a bụ ntụgharị Igbo kwesịrị ekwesị nke θεός.
theological_decisions:
- issue: Onye αὐτοῦ dị na “izu ike ya” na-ezo aka na ya
  choice: E debere “ya” n’ahịrị bụ isi; n’ọnọdụ Ndị Hibru 3–4, o yikarịrị ka ọ na-ezo aka n’izu ike Chineke.
  alternative: Ọ pụrụ ịpụta izu ike nke onye banyere.
  rationale: Gburugburụ Ndị Hibru 3–4 na-ekwu ugboro ugboro banyere izu ike Chineke, nke dabere n’izu ike ya mgbe o kesịrị ụwa. Ma ide “ya” kama “Chineke” na-edebe nnọchiaha na obere mgbagwoju anya nke Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E debere nkwugharị “izu ike/zuo ike” iji gosipụta njikọ okwu Grik na isiokwu Ndị Hibru 3–4; e zere ịkọwa “ọrụ” dịka ọrụ iwu ma ọ bụ ọrụ iji nweta nzọpụta.
