id: HEB.4.15
reference: Hebrews 4:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ἀρχιερέα μὴ δυνάμενον συμπαθῆσαι ταῖς ἀσθενείαις ἡμῶν, ⸀πεπειρασμένον δὲ κατὰ πάντα καθ’ ὁμοιότητα χωρὶς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: ig
  text: N’ihi na anyị enweghị Onyeisi Nchụàjà nke na-apụghị iso anyị nwee mmetụta n’adịghị ike anyị; kama, anyị nwere onye e nwalere[a] n’ụzọ niile dị ka anyị[b], ma na-enweghị mmehie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye a nwara ọnwụnwa n’ụzọ niile.”
    reason: alternative_reading
  - marker: b
    text: N’ụzọ nkịtị, “dị ka myirịta si dị”; Grik ekwughị kpọmkwem onye e ji atụnyere ya, ma ọtụtụ nsụgharị na-eme ka ọ pụta ìhè dịka, “dị ka anyị” ma ọ bụ “n’otu ụzọ ahụ anyị si dị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερέα
  choice: nnukwu onye nchụàjà
  rationale: Nke a bụ okwu Igbo doro anya maka ọkwa onyeisi nchụàjà, bụ́ isiokwu dị mkpa n’akwụkwọ Ndị Hibru.
- source_word: μὴ δυνάμενον συμπαθῆσαι
  choice: nke na-apụghị iso anyị nwee mmetụta
  rationale: E debere usoro nkwupụta nke na-agọnahụ enweghị ike, dị ka Grik si kwuo ya. ‘Iso anyị nwee mmetụta’ na-egosi ikekọrịta ahụmahụ na nhụjuanya mmadụ, ọ bụghị naanị imere ya ebere site n’ebe dị anya.
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: n’adịghị ike anyị
  rationale: Okwu a gụnyere adịghị ike na enweghị ike zuru ezu nke mmadụ, ọ bụghị naanị ọrịa anụ ahụ.
- source_word: πεπειρασμένον
  choice: a nwalere
  rationale: Okwu Grik nwere ike ịpụta ‘ịnwa’ ma ọ bụ ‘ịnwa mmadụ ọnwụnwa.’ ‘A nwalere’ na-egosipụta nnwale ahụ n’emeghị ka otu akụkụ nke ihe okwu ahụ nwere ike ịpụta funahụ; e debere ‘a nwara ọnwụnwa’ n’ala peeji.
- source_word: κατὰ πάντα
  choice: n’ụzọ niile
  rationale: Nke a na-egosi na nnwale ahụ metụtara akụkụ niile, n’asụsụ Igbo dị mfe ma bụrụkwa nke eke.
- source_word: καθ’ ὁμοιότητα
  choice: dịka anyị
  rationale: Nke a na-eme ka ntụnyere a na-aghọta n’Igbo, ebe ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ anyị ka e ji atụnyere ya. A kọwara ọdịdị nkịtị nke okwu Grik n’ala peeji iji chekwaa myirịta ahụ na enweghị nkọwa zuru ezu ya.
- source_word: χωρὶς ἁμαρτίας
  choice: ma na-enweghị mmehie
  rationale: Nke a na-echekwa ọdịiche siri ike dị n’etiti nnwale zuru ezu na enweghị mmehie, n’etinyeghị nkọwa ọzọ n’ihe odide ahụ.
theological_decisions:
- issue: Otú e si sụgharịa πεπειρασμένον n’ihe gbasara enweghị mmehie Kraịst
  choice: a nwalere
  alternative: a nwara ọnwụnwa
  rationale: ‘A nwalere’ na-ekwupụta nnwale Kraịst n’ezie ma ghara ime ka e chee na o nwere ọchịchọ mmehie n’ime ya. Ma ebe okwu Grik nwekwara ike ịpụta ọnwụnwa, e debere nke ahụ dịka nsụgharị ọzọ n’ala peeji.
- issue: Otú e si mee ka ntụnyere dị na καθ’ ὁμοιότητα doo anya
  choice: dịka anyị
  alternative: dịka myirịta si dị
  rationale: ‘Dịka anyị’ bụ Igbo eke nke na-eme ka ntụnyere a ghọta nke ọma n’ọnọdụ amaokwu ahụ. Ala peeji na-egosi usoro okwu Grik nke na-ekwu naanị banyere myirịta, ka a ghara izochi enweghị nkọwa zuru ezu dị na ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro agọnahụ abụọ nke Grik n’ahịrịokwu mbụ, ma jiri ntụnyere Igbo eke mee ka nkebi nke abụọ doo anya. Akara ala peeji [a] na [b] pụtara n’ahịrịokwu ahụ n’ebe okwu ha metụtara dị.
