revisions:
- from: N’ihi na anyị enweghị nnukwu onye nchụàjà nke na-apụghị iso anyị nwee mmetụta n’adịghị ike anyị; kama anyị nwere onye a nwalere[a] n’ụzọ niile dịka anyị[b], ma na-enweghị mmehie.
  to: N’ihi na anyị enweghị Onyeisi Nchụàjà nke na-apụghị iso anyị nwee mmetụta n’adịghị ike anyị; kama, anyị nwere onye e nwalere[a] n’ụzọ niile dị ka anyị[b], ma na-enweghị mmehie.
  rationale: The revision standardizes the central priestly title and makes the passive force of πεπειρασμένον explicit in idiomatic Igbo. It preserves the Greek negated formulation, the broad scope of testing, the contextual but footnoted-explicit rendering of καθ’ ὁμοιότητα, and the statement that he is without sin. Footnote markers remain anchored to their respective expressions.
  reviewer_model: gpt-5.6-terra
