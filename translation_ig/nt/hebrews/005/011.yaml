  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Περὶ οὗ πολὺς ἡμῖν ὁ λόγος καὶ δυσερμήνευτος λέγειν, ἐπεὶ νωθροὶ γεγόνατε ταῖς ἀκοαῖς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/011.yaml
  text: About this we have much to say[a], and it is hard to explain[c][b], since you have become dull in hearing.
translation:
  language: ig
  text: Banyere okwu a, anyị nwere ọtụtụ ihe anyị ga-ekwu[a], ma ọ siri ike ịkọwa[b], ebe ọ bụ na unu aghọọla ndị na-adị nwayọọ n’ịnụ ihe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Banyere onye a, anyị nwere ọtụtụ ihe anyị ga-ekwu.” Okwu nnọchi aha Grik ahụ pụrụ izo aka na Melkizedek, ọ bụ ezie na o yikarịrị ka ọ na-ezo n’isiokwu a na-atụle.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ọ siri ike ịkọwa ihe ọ pụtara” ma ọ bụ “ọ siri ike ịkọwapụta.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “unu aghọọla ndị umengwụ n’ịnụ ihe.” Nke a na-ekwu banyere ịdị nwayọọ ma ọ bụ enweghị mmasị n’ịnabata nkuzi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ οὗ
  choice: Banyere okwu a
  rationale: Nkebiokwu a na-ezo n'ụzọ ebumpụta ụwa n'isiokwu a na-atụle, ma ọ naghị emechi ohere na ọ pụrụ izo aka na Melkizedek n'onwe ya.
- source_word: πολὺς ἡμῖν ὁ λόγος
  choice: anyị nwere ọtụtụ ihe anyị ga-ekwu
  rationale: Nke a bụ ụzọ Igbo doro anya si kwupụta na onye dere akwụkwọ ahụ nwere ọtụtụ ihe ọ chọrọ ịkọwa, kama ịsụgharị λόγος n'ụzọ siri ike dịka ‘okwu dị ukwuu nye anyị.’
- source_word: δυσερμήνευτος λέγειν
  choice: ọ siri ike ịkọwa
  rationale: Ngwakọta okwu Grik a na-ekwu maka ihe siri ike ịkọwa ma ọ bụ ịkọwapụta n'okwu; nsụgharị a bụ nke eke ma doo anya n'Igbo.
- source_word: ἐπεὶ
  choice: ebe ọ bụ na
  rationale: Ọ na-egosi ihe kpatara na isiokwu ahụ siri ike ịkọwa.
- source_word: νωθροὶ
  choice: ndị ntị ha adịghịzi anụ ngwa ngwa
  rationale: N'ebe a, okwu ahụ na-egosi ịdị umengwụ ma ọ bụ enweghị nzaghachi n'ịnabata nkuzi, ọ bụghị nkwarụ anụ ahụ.
- source_word: γεγόνατε
  choice: unu aghọọla
  rationale: Ọ na-echekwa echiche nke ọnọdụ ha rutere ka oge na-aga, ọ bụghị naanị otú ha dị ugbu a.
- source_word: ταῖς ἀκοαῖς
  choice: ndị ntị ha adịghịzi anụ ngwa ngwa
  rationale: E ji ‘ịnụ’ mee ihe atụ maka ịdị njikere ịge ntị na ịnabata nkuzi; ntụgharị a na-eme ka ihe atụ ntị ahụ dịrị ma mee ka nzube ya doo anya.
theological_decisions:
- issue: Ihe Περὶ οὗ na-ezo aka na ya
  choice: 'A sụgharịrị ya dịka ihe na-ezo n''isiokwu a na-atụle: ‘Banyere okwu a.’'
  alternative: 'Ọ pụrụ izo aka na Melkizedek n''onwe ya: ‘Banyere onye a.’'
  rationale: Ọ bụ ezie na Melkizedek bụ onye a kpọrọ aha ozugbo tupu nke a, okwu ndị na-esochi na-egosi na onye dere akwụkwọ ahụ na-ebute isiokwu sara mbara ọ chọrọ ịkọwa. Ihe odide bụ isi na-eji ntụgharị kacha eke, ebe ndetu na-echekwa nghọta nke ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ gbasara ntị na ịnụ ihe n'ahịrị bụ isi, ma ndetu kọwara na ọ na-ekwu banyere ịnabata nkuzi, ọ bụghị enweghị ike ịnụ ihe n'anụ ahụ.
