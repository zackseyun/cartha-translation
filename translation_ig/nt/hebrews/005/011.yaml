revisions:
- from: Banyere okwu a, anyị nwere ọtụtụ ihe anyị ga-ekwu[a], ma ọ siri ike ịkọwa[b], ebe ọ bụ na unu aghọọla ndị ntị ha adịghịzi anụ ngwa ngwa[c].
  to: Banyere okwu a, anyị nwere ọtụtụ ihe anyị ga-ekwu[a], ma ọ siri ike ịkọwa[b], ebe ọ bụ na unu aghọọla ndị na-adị nwayọọ n’ịnụ ihe[c].
  rationale: The revision removes the unsupported ‘no longer,’ keeps the perfect-result sense in “aghọọla,” and uses an idiomatic second-person-inclusive expression for metaphorical sluggishness in hearing. Footnote b is corrected to express interpretation/exposition rather than reflection, and footnote c preserves the more literal ‘sluggish/lazy in hearing’ alternative with its instructional sense.
