id: HEB.5.12
reference: Hebrews 5:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: ig
  text: N’ihi na, ọ bụ ezie na ka oge a ruru, unu kwesịrị ịbụworị ndị nkụzi, unu chọkwara ọzọ ka mmadụ kụziere unu ụfọdụ n’ime ihe ndị bụ isi nke mmalite n’okwu Chineke[b]. Unu eruola n’ọnọdụ nke unu chọrọ mmiri ara ehi[a], ọ bụghị nri siri ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ihe atụ maka ozizi ma ọ bụ nghọta dị mfe, nke mmalite.
    reason: metaphor_clarification
  - marker: b
    text: N’ebe a, “okwu Chineke” pụtara okwu ma ọ bụ mkpughe sitere n’aka Chineke, ọ bụghị okwu ịgba afa nke ndị ọgọ mmụọ.
    reason: cultural_note
lexical_decisions:
- source_word: ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον
  choice: ka oge a ruru, unu kwesịrị ịbụworị ndị nkụzi
  rationale: “Ka oge a ruru” na-egosi oge gafeworo nke kwesịrị iweta ntozu, ebe “kwesịrị ịbụworị” na-egosi atụmanya ma ọ bụ ibu ọrụ ahụ n’enweghị ụda iwu siri ike.
- source_word: πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς
  choice: unu chọkwara ọzọ ka mmadụ kụziere unu
  rationale: Nke a bụ Igbo doro anya nke na-egosi na mkpa ịkụziri ha ihe alọghachila; a kọwapụtara onye na-eme ihe dị n’ahịrịokwu Grik dị ka “mmadụ.”
- source_word: τινὰ τὰ στοιχεῖα τῆς ἀρχῆς
  choice: ihe ndị mbụ bụ́ isi
  rationale: Nkebiokwu a na-ejikọta echiche στοιχεῖα (ihe ndị bụ isi) na ἀρχή (mmalite), ma ghara ikwubiga ihe ọ pụtara ókè.
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: n’okwu Chineke
  rationale: “Okwu Chineke” bụ okwu Igbo dị mma ma dị ùgwù maka λόγια τοῦ θεοῦ; ihe odide ala peeji na-eme ka o doo anya na λόγια bụ okwu ma ọ bụ mkpughe sitere n’aka Chineke.
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: unu aghọọla ndị ... dị mkpa
  rationale: “Aghọọla” na-egosipụta ọnọdụ ha batara na ya nke ka dị ugbu a, dịka perfect γεγόνατε si eme.
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: mmiri ara ehi dị mkpa, ọ bụghị nri siri ike
  rationale: A hapụrụ ihe atụ nke mmiri ara ehi na nri siri ike dịka onye dere ya siri kwuo ya, n’ebughị ụzọ kọwaa ya n’usoro ozizi pụrụ iche.
theological_decisions:
- issue: Ihe atụ nke mmiri ara ehi na nri siri ike
  choice: E debere ihe atụ ahụ n’onwe ya ka ọ gosipụta ọdịiche dị n’etiti enweghị ntozu na ntozu n’ihe ọmụmụ.
  alternative: Ịkọwa ya ozugbo dịka “ozizi mmalite” na “ozizi miri emi.”
  rationale: Amaokwu ahụ anaghị akọwa usoro ozizi pụrụ iche; idebe ihe atụ ya na-echekwa ike okwu na ohere nkọwa dị n’ederede.
- issue: Ihe λόγια τοῦ θεοῦ pụtara
  choice: “Okwu Chineke,” ya na nkọwa na ọ bụ okwu ma ọ bụ mkpughe sitere n’aka Chineke.
  alternative: “Amụma Chineke” ma ọ bụ “okwu amụma Chineke.”
  rationale: λόγια sara mbara karịa naanị amụma; nhọrọ ahụ anaghị akpọchi ya n’otu ụdị mkpughe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ịba mba dị n’amaokwu ahụ n’enweghị okwu mkparị, ma chekwaa ihe atụ na nghọtahie nwere ike ịdị na nkebiokwu ndị Grik.
