id: HEB.5.1
reference: Hebrews 5:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: ig
  text: N’ihi na a na-ewere onyeisi nchụàjà ọ bụla site n’etiti ụmụ mmadụ[a], a na-ahọpụta ya maka ụmụ mmadụ n’ihe ndị metụtara Chineke, ka o wee weta ma onyinye ma àjà maka mmehie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị mmadụ.” Okwu Grik ahụ, anthrōpoi, na-ekwu banyere mmadụ n’ozuzu ha. Ọ bụ ezie na ndịisi nchụàjà n’oge ahụ bụ ụmụ nwoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς
  choice: ọ bụla
  rationale: Ọ na-egosi onye ọ bụla n’otu n’otu n’ime ndị na-eje ozi dịka onyeisi nchụàjà, dịka otu aha dị n’ọnụọgụ otu na Grik si dị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na arụmụka gara aga dịka nkọwa ma ọ bụ ihe na-akwado ya.
- source_word: ἀρχιερεὺς
  choice: onyeisi nchụàjà
  rationale: Nke a bụ okwu Igbo doro anya maka ọkwa okpukpe ndị Juu a na-ekwu maka ya.
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: onye e si n’etiti ụmụ mmadụ wepụta
  rationale: ‘Wepụta’ na-edobe echiche nke ngwaa nnara na Grik, ebe ‘site n’etiti ụmụ mmadụ’ na-egosi ebe e si were ya.
- source_word: ὑπὲρ ἀνθρώπων
  choice: ka ọ nọchitere ụmụ mmadụ
  rationale: N’ebe a, ὑπέρ na-egosi ịnọchite anya ndị ọzọ na ime ihe maka ọdịmma ha; ‘nọchitere’ na-eme ka ọrụ onye ogbugbo pụta ìhè.
- source_word: καθίσταται
  choice: a na-ahọpụta ya
  rationale: N’ọnọdụ a, ngwaa ahụ na-ekwu maka itinye mmadụ n’ọrụ ma ọ bụ n’ọkwa onyeisi nchụàjà.
- source_word: τὰ πρὸς τὸν θεόν
  choice: n’ihe ndị metụtara Chineke
  rationale: Nke a na-enye okwu Grik ahụ n’ụzọ eke ma na-agụnye ihe gbasara ofufe na ije ozi n’ihu Chineke.
- source_word: ἵνα προσφέρῃ
  choice: ka o wee na-eweta
  rationale: ‘Ka o wee’ na-echekwa ebumnuche nke ἵνα, ebe ‘na-eweta’ dabara n’omume a na-eme dịka ọrụ nchụàjà.
- source_word: δῶρά τε καὶ θυσίας
  choice: ma onyinye ma àjà
  rationale: Nhazi ‘ma … ma …’ na-echekwa njikọ τε καὶ na ọdịiche dị n’etiti ụdị ihe abụọ a na-ewetara Chineke.
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: maka mmehie
  rationale: N’ọnọdụ àjà, nke a na-egosi na a na-eweta ihe ndị ahụ n’ihe banyere mmehie, na-enweghị ịgbakwunye nkọwa nkà mmụta okpukpe na-adịghị n’amaokwu ahụ.
theological_decisions:
- issue: Ihe ἀνθρώπων pụtara na otú e si egosi nwoke na nwanyị
  choice: ụmụ mmadụ
  alternative: ndị mmadụ; ụmụ nwoke
  rationale: ἀνθρώπων bụ ọtụtụ nke ἄνθρωπος, nke pụtara ụmụ mmadụ n’ozuzu ya, ọ bụghị okwu Grik pụrụ iche maka ụmụ nwoke. ‘Ụmụ mmadụ’ na-echekwa echiche na a na-ewepụta onyeisi nchụàjà n’etiti mmadụ ibe ya ma ọ na-anọchite ha. Ọkwa nchụàjà ahụ bụ nke ụmụ nwoke n’akụkọ ihe mere eme, ma ekwesịghị ịtụgharị ἄνθρωπος dịka a ga-asị na ọ bụ ἀνήρ.
- issue: Ọrụ onyeisi nchụàjà n’aha ndị ọzọ
  choice: ka ọ nọchitere ụmụ mmadụ
  alternative: maka ụmụ mmadụ
  rationale: ‘Nọchitere’ na-egosi ike nnọchiteanya nke ὑπέρ n’ebe a, ma ọ naghị akọwa kpọmkwem otú àjà si arụ ọrụ karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere okwu ofufe a maara nke ọma, dịka “onyeisi nchụàjà,” “onyinye,” na “àjà,” ma zere ịkọwa karịa ihe Grik kwuru.
