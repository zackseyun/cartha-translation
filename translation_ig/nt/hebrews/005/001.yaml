revisions:
- from: N’ihi na onyeisi nchụàjà ọ bụla bụ onye e si n’etiti ụmụ mmadụ[a] wepụta, a na-ahọpụta ya ka ọ nọchitere ụmụ mmadụ n’ihe ndị metụtara Chineke, ka o wee na-eweta ma onyinye ma àjà maka mmehie.
  to: N’ihi na a na-ewere onyeisi nchụàjà ọ bụla site n’etiti ụmụ mmadụ[a], a na-ahọpụta ya maka ụmụ mmadụ n’ihe ndị metụtara Chineke, ka o wee weta ma onyinye ma àjà maka mmehie.
  rationale: The revision corrects the syntactic attachment of “on behalf of human beings” to “is appointed,” preserves the passive selection and appointment language, and uses neutral, natural Standard Igbo for the purpose of offering gifts and sacrifices. The footnote is revised to state accurately that ἀνθρώπων refers to human beings generally while noting the historically male priestly office without treating the Greek noun itself as male-specific.
  reviewer_model: gpt-5.6-terra
