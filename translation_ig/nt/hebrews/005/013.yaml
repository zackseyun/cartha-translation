id: HEB.5.13
reference: Hebrews 5:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ μετέχων γάλακτος ἄπειρος λόγου δικαιοσύνης, νήπιος γάρ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/013.yaml
  text: For everyone who partakes of milk is unskilled in the word of righteousness[b][a], for he is an infant.
translation:
  language: ig
  text: N’ihi na onye ọ bụla na-aṅụ mmiri ara ehi enweghị ahụmahụ n’okwu nke ezi omume[a], n’ihi na ọ bụ nwa ọhụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ozi nke ezi omume” ma ọ bụ “okwu banyere ezi omume.” “Ezi omume” nwekwara ike ịpụta “ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: onye ọ bụla
  rationale: Na-egosi onye nke ọ bụla n’ime ìgwè a kpọrọ aha, ma bụrụkwa okwu Igbo dị mfe ma kwekọọ n’echiche nkesa nke okwu Grik.
- source_word: ὁ μετέχων
  choice: na-aṅụ
  rationale: N’ihe atụ banyere mmiri ara ehi, ‘na-aṅụ’ bụ Igbo eke nke na-egosi isonye n’iri ya n’enweghị ịgbakwụnye echiche na ọ bụ naanị ya ka onye ahụ ji ebi.
- source_word: γάλακτος
  choice: mmiri ara ehi
  rationale: E debere ihe atụ ahụ kpọmkwem dịka mmiri ara ehi, dịka ihe gbara amaokwu a gburugburu si chọọ.
- source_word: ἄπειρος
  choice: enweghị ahụmahụ
  rationale: Ọ na-egosi enweghị ahụmahụ ma ọ bụ amamihe e ji eme ihe, ọ bụghị na onye ahụ amaghị okwu ahụ kpamkpam.
- source_word: λόγου δικαιοσύνης
  choice: okwu nke ezi omume
  rationale: Nsụgharị a na-edebe njikọ okwu Grik ahụ n’ụzọ sara mbara, ka ọ ghara ikpebi ma ọ bụ ‘ozi banyere ezi omume’ ma ọ bụ okwu nwere àgwà ezi omume.
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: ‘Ezi omume’ bụ okwu Igbo doro anya maka δικαιοσύνη n’ọnọdụ ime mmụọ na omume a, ebe a ka na-edebe ohere nkọwa nke njikọ okwu ahụ na nkọwa ala peeji.
- source_word: νήπιος
  choice: nwa ọhụrụ
  rationale: Ọ na-edebe ịdị nkọ nke ihe atụ banyere onye na-etolitebeghị, ma kwekọọ na mmiri ara ehi.
- source_word: γάρ
  choice: n’ihi na
  rationale: E ji ya mee ihe ugboro abụọ iji gosipụta nkọwa na ihe kpatara okwu ahụ dịka n’asụsụ Grik.
theological_decisions:
- issue: Nkọwa nke δικαιοσύνη
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N’ọnọdụ a, ‘ezi omume’ dabara nke ọma n’okwu gbasara ntozu ime mmụọ na mmụta; ‘ikpe ziri ezi’ bụ akụkụ ọzọ nke mpụtara okwu ahụ, ma ọ naghị ada nke ọma n’ahịrịokwu a.
- issue: Njikọ λόγου δικαιοσύνης
  choice: okwu nke ezi omume
  alternative: ozi banyere ezi omume
  rationale: A hapụrụ njikọ genitive ahụ ka ọ nwee obosara ya kama ikpebi kpọmkwem na ọ bụ naanị ozi ‘banyere’ ezi omume.
- issue: Ụdị nwoke nke νήπιος ... ἐστιν
  choice: ọ bụ nwa ọhụrụ
  alternative: onye dị otú ahụ bụ nwa ọhụrụ
  rationale: Nnochiaha Igbo ‘ọ’ anaghị ekewa nwoke na nwanyị, ya mere ọ na-anọchite onye ahụ n'ụzọ eke n’enweghị ịgbanwe nghọta izugbe nke ahịrịokwu Grik.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Mmiri ara ehi’ na ‘nwa ọhụrụ’ na-edebe ihe atụ gbasara uto na ntozu. Akara nkọwa ala peeji [a] dị n’isiokwu ahụ kpọmkwem.
