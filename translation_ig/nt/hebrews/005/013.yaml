    text: A pụkwara ịsụgharị ya, “ozi nke ezi omume” ma ọ bụ “okwu banyere ezi omume.” “Ezi omume” nwekwara ike ịpụta “ikpe ziri ezi.”
    reason: lexical_alternative
  revision_rationale: The main translation accurately and naturally renders the Greek and is retained. Footnote a is revised to distinguish alternative renderings of λόγος (“ozi”) and the possible relational sense of the genitive (“banyere ezi omume”), while separately preserving “ikpe ziri ezi” as an alternative sense of δικαιοσύνη.
