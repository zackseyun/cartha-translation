- from: N’ihi na onye ọ bụla na-aṅụ mmiri ara ehi enweghị ahụmahụ n’okwu nke ezi omume[a], n’ihi na ọ bụ nwa ọhụrụ.
  to: N’ihi na onye ọ bụla na-aṅụ mmiri ara ehi enweghị ahụmahụ n’okwu nke ezi omume[a], n’ihi na ọ bụ nwa ọhụrụ.
  rationale: The main translation accurately and naturally renders the Greek and is retained. Footnote a is revised to distinguish alternative renderings of λόγος (“ozi”) and the possible relational sense of the genitive (“banyere ezi omume”), while separately preserving “ikpe ziri ezi” as an alternative sense of δικαιοσύνη.
