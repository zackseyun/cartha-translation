id: HEB.5.3
reference: Hebrews 5:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸂δι’ αὐτὴν⸃ ὀφείλει, καθὼς περὶ τοῦ λαοῦ, οὕτως καὶ περὶ ⸀αὑτοῦ προσφέρειν ⸀περὶ ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/003.yaml
  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: ig
  text: N’ihi nke a[a], ọ ghaghị ịchụ àjà maka mmehie, dịka ọ na-achụrụ ndị mmadụ, otu ahụkwa ka ọ ga-achụrụ onwe ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “n’ihi ya”; okwu a na-ezo aka n’adịghị ike onyeisi nchụàjà e kwuru n’amaokwu gara aga.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: N’ihi nke a
  rationale: Ọ na-echekwa ike nke ihe na-akpata ihe n'okwu Grik, ma hapụkwa ihe nnọchiaha ahụ na-ezo aka na ya ka ama ya site n'amaokwu gara aga.
- source_word: ὀφείλει
  choice: ọ bụ iwu na ọ ga-
  rationale: Nke a na-egosi ọrụ dịịrị ya n'ezie, ọ bụghị naanị ndụmọdụ ma ọ bụ ihe kwesị ekwesị.
- source_word: καθὼς ... οὕτως καὶ
  choice: dịka ... otu ahụkwa
  rationale: Ọ na-echekwa ntụnyere nwere akụkụ abụọ nke dị n'okwu Grik n'Igbo na-aga were were.
- source_word: τοῦ λαοῦ
  choice: ndị mmadụ
  rationale: N'ọnọdụ a ọ na-ezo aka n'ìgwè ndị ahụ onyeisi nchụàjà na-anọchite anya ha, n'enweghị ịgbakwunye nkọwa na-adịghị n'ahịrịokwu ahụ.
- source_word: περὶ αὑτοῦ
  choice: maka onwe ya
  rationale: Ọ na-egosipụta nke ọma na onyeisi nchụàjà aghaghị imekwa ya n'ihi onwe ya.
- source_word: προσφέρειν περὶ ἁμαρτιῶν
  choice: ịchụ àjà maka mmehie
  rationale: N'ọnọdụ ọrụ onye nchụàjà, 'ịchụ àjà' bụ ụzọ Igbo doro anya ma dị ndụ isi kwuo omume ịchụ ihe e kwuru; 'maka mmehie' echekwaghị ya ka ọ bụrụ kpọmkwem otu ụdị àjà karịa ihe Grik kwuru.
theological_decisions:
- issue: Ihe αὐτήν na-ezo aka na ya
  choice: Isiokwu ahụ kwuru 'nke a' ma ihe odide ala peeji kọwaa na ọ na-ezo aka n'adịghị ike onyeisi nchụàjà e kwuru n'amaokwu bu ụzọ.
  alternative: Ịghọta ya n'ozuzu dịka ọnọdụ ma ọ bụ ọrụ onyeisi nchụàjà.
  rationale: Adịghị ike e kwuru na Ndị Hibru 5:2 bụ ihe kacha nso, bụrụkwa ihe kwekọrọ n'arụmụka ahụ; ma isiokwu ahụ anaghị agbakwunye okwu 'adịghị ike' n'onwe ya.
- issue: Ịkọwa προσφέρειν n'ọnọdụ àjà
  choice: ịchụ àjà
  alternative: inye ihe maka mmehie
  rationale: Ọnọdụ onyeisi nchụàjà na mmehie na-eme ka àjà pụta ìhè. Nke a bụ okwu Igbo ebumpụta ụwa ma ọ naghị akọwa ya kpọmkwem dịka otu ụdị àjà mmehie.
translation_notes:
  register: Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. E ji 'ọ bụ iwu na ọ ga-' gosi ọrụ a manyere ya ịrụ, ma debe ntụnyere 'dịka ... otu ahụkwa' nke isi mmalite.
