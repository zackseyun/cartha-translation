id: HEB.5.7
reference: Hebrews 5:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: ig
  text: onye, n’ụbọchị anụ ahụ ya, ji oké mkpu na anya mmiri chụpụtara ekpere na arịrịọ nye Onye ahụ nwere ike ịzọpụta ya n’ọnwụ[a], ma e gere ya ntị n’ihi nkwanye ugwu ya nye Chineke[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta ‘ịzọpụta ya n’ọnwụ’ dịka ‘ịzọpụta ya site n’ọnwụ,’ ya bụ, ịnapụta ya site na mbilite n’ọnwụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, ‘n’ihi egwu Chineke ya.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: n’ụbọchị ndị ọ nọ n’anụ ahụ
  rationale: Ọ na-edobe okwu doro anya bụ σάρξ (‘anụ ahụ’), ma na-ekwukwa ya n’ụzọ Igbo nke na-egosi oge ndụ ya n’ụwa mgbe ọ nwere ahụ mmadụ.
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: ekpere na arịrịọ
  rationale: ‘Ekpere’ na ‘arịrịọ’ bụ okwu Igbo dị ugbu a ma dị mfe nghọta; ha na-edobekwa ọdịiche dị n’etiti okwu Grik abụọ ahụ, nke nke abụọ na-egosi ịrịọsi ike.
- source_word: προσενέγκας
  choice: chụọrọ
  rationale: ‘Chụọrọ’ na-egosi iweta ihe dịka onyinye, ya mere ọ na-edobe ụda ịchụ àjà nke προσφέρω nwere ike inwe n’akwụkwọ Ndị Hibru, n’agbanyeghị na ihe a na-achụ ebe a bụ ekpere na arịrịọ.
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: jiri oké mkpu na anya mmiri
  rationale: Nke a bụ Igbo eke na-ekwupụta ike na ihe mgbu dị na κραυγῆς ἰσχυρᾶς καὶ δακρύων.
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: Onye ahụ nwere ike ịzọpụta ya n’ọnwụ
  rationale: Ọ na-edobe ‘Onye ahụ nwere ike’ nke participle ahụ, ma ghara ikpebi ma ἐκ θανάτου pụtara igbochi ọnwụ ma ọ bụ ịnapụta ya site n’ọnwụ site na mbilite n’ọnwụ.
- source_word: εἰσακουσθεὶς
  choice: a nụkwara olu ya
  rationale: Nke a na-egosi na Chineke gere arịrịọ ya ntị n’ụzọ dị mma, ma ọ naghị akọwa kpọmkwem ụdị azịza e nyere.
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: n’ihi nkwanye ugwu ya nye Chineke
  rationale: ‘Nkwanye ugwu’ na-ekwupụta nsọpụrụ na ịtụ egwu Chineke n’ụzọ kwesịrị ekwesị, ma ọ naghị etinye echiche ‘ido onwe ya n’okpuru’ nke okwu Grik ahụ ekwughị hoo haa.
theological_decisions:
- issue: Ihe ἀπὸ τῆς εὐλαβείας pụtara banyere Jizọs
  choice: n’ihi nkwanye ugwu ya nye Chineke
  alternative: n’ihi egwu Chineke ya
  rationale: Nhọrọ bụ isi na-egosi nsọpụrụ Jizọs nwere n’ebe Chineke nọ n’enweghị ịtụnye ụjọ na-ekwesịghị ekwesị; ihe odide ala peeji na-edobe ntụgharị ọzọ nke εὐλάβεια nwere ike ịpụta.
- issue: Oke ihe ‘ịzọpụta ya n’ọnwụ’ pụtara
  choice: ịzọpụta ya n’ọnwụ
  alternative: ịzọpụta ya site n’etiti ndị nwụrụ anwụ
  rationale: ἐκ θανάτου nwere ike izo aka ma n’ịnapụta mmadụ ka ọ ghara ịnwụ ma n’ịnapụta ya site n’ọnwụ. Isi ederede anaghị ekpebi otu n’ime ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ ka bụ nkebi nke na-aga n’ihu n’amaokwu gbara ya gburugburu, dịka ọ dị n’asụsụ Grik. E tinyere akara [a] na [b] n’ebe okwu ha na-akọwa dị, kama idowe ha n’ebe na-adabaghị na ọdịnaya nkọwa ala peeji.
