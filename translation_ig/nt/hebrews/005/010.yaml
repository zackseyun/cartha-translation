source:
  edition: SBLGNT
  text: προσαγορευθεὶς ὑπὸ τοῦ θεοῦ ἀρχιερεὺς κατὰ τὴν τάξιν Μελχισέδεκ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/010.yaml
  text: having been designated by God as a high priest according to the order of Melchizedek[a][b].
translation:
  language: ig
  text: ebe Chineke kpọrọ ya Onyeisi Nchụaja, dịka usoro Melkizedek si dị.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ebe Chineke kpọpụtara ya dị ka Onyeisi Nchụaja,” ma ọ bụ “ebe Chineke họpụtara ya ka ọ bụrụ Onyeisi Nchụaja.”
    reason: lexical_alternative
  - marker: b
    text: Okwu a na-echetara Abụ Ọma 110:4, ebe e kwuru na ọrụ nchụaja ahụ dị “dịka usoro Melkizedek si dị.”
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: ebe Chineke kpọpụtara ya
  rationale: 'Nkebi a na-egosi omume Chineke mere n’ahụ ya: Chineke kpọpụtara ma kwupụta ya n’ihu ọha dịka onye nwere ọkwa a. Ọ na-edobe nghọta nke aorist passive participle n’enweghị ime ka okwu ahụ pụta kpọmkwem dịka echichi.'
- source_word: ὑπὸ τοῦ θεοῦ
  choice: Chineke
  rationale: N’usoro Igbo a, ‘Chineke kpọpụtara ya’ na-egosi nke ọma na Chineke bụ onye mere ihe ahụ; etinyeghị ‘Nna’ n’ihi na okwu Grik kwuru naanị ‘Chineke.’
- source_word: ἀρχιερεὺς
  choice: Onyeisi Nchụaja
  rationale: Nke a bụ okwu Igbo doro anya maka onye nchụaja kachasị elu; mkpụrụedemede ukwu na-enyere aka igosi na ebe a ọ bụ aha ọkwa e nyere Jizọs, ọ bụghị naanị otu onye n’etiti ọtụtụ ndị.
- source_word: κατὰ τὴν τάξιν
  choice: dịka usoro ... si dị
  rationale: Nkebi a na-egosi nkwekọrịta ma ọ bụ ụdị/usoro otu ihe si bụrụ. Ọ na-edobekwa njikọ okwu ahụ na Abụ Ọma 110:4.
- source_word: Μελχισέδεκ
  choice: Melkizedek
  rationale: A sụgharịghị aha onye ahụ; e dere ya n’ụdị mkpụrụokwu kwekọrọ n’ụda aha ahụ ma dịkwa mfe ọgụgụ n’Igbo.
theological_decisions:
- issue: Ma προσαγορευθεὶς ọ̀ na-egosi mgbanwe n’ọdịdị ya, echichi siri ike, ka ọ bụ nkwupụta Chineke banyere ọkwa ya
  choice: Chineke kpọpụtara ya Onyeisi Nchụaja
  alternative: Chineke kpọrọ ya Onyeisi Nchụaja; Chineke họpụtara ya ka ọ bụrụ Onyeisi Nchụaja
  rationale: ‘Kpọpụtara’ na-egosi ịkpọ aha ma ọ bụ ikwupụta ọkwa ya n’ụzọ pụtara ìhè, ma ọ naghị amanye nghọta na e nwere mgbanwe n’ọdịdị ya ma ọ bụ echichi n’usoro ụlọ ọrụ. Ihe ndị ọzọ okwu ahụ nwere ike ịpụta ka edobere n’ala peeji.
- issue: Ihe ‘usoro Melkizedek’ pụtara
  choice: dịka usoro Melkizedek si dị
  alternative: dịka ụdị Melkizedek si dị; dịka ọkwa Melkizedek si dị
  rationale: ‘Usoro’ na-echekwa obosara na ntakịrị mgbagwoju anya nke τάξις, ma na-eme ka njikọ ya na Abụ Ọma 110:4 na arụmụka akwụkwọ Ndị Hibru nọgide.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ebe’ jikọtara participle ahụ na amaokwu gara aga, ebe ‘kpọpụtara’ na-edobe omume Chineke nke ịkpọ aha/ikwupụta ọkwa n’enweghị imechi ụzọ nghọta ndị ọzọ. Akara ala peeji [a] na [b] dị n’ederede isi.
