  text: and[a], having been made perfect, he became the source of eternal salvation to all who obey him[b],
translation:
  language: ig
  text: E mere ka o zuo oke[a], ọ ghọrọkwa isi iyi[b] nke nzọpụta ebighị ebi nye ndị niile na-erubere ya isi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe e mere ka o zuo ezu” ma ọ bụ “mgbe e duuru ya ruo n'ọgwụgwụ.” N'akwụkwọ Ndị Hibru, okwu Grik a na-ezokarị aka n'ịruzu ma ọ bụ mmezu zuru ezu nke ọrụ nchụaja na nke mgbapụta, ọ bụghị naanị n'ịdị mma nke omume.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye wetara” ma ọ bụ “onye kpatara” nzọpụta ebighị ebi.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελειωθεὶς
  choice: e meworo ya ka o zuo oke
  rationale: Nke a na-egosi na e duuru ya ruo n'isi njedebe na mmezu nke ọrụ ya, ọ bụghị na àgwà ọma ya nwere ntụpọ nke e mesịrị dozie.
- source_word: ἐγένετο
  choice: ọ ghọrọ
  rationale: Ọ na-egosi ọnọdụ ma ọ bụ ọrụ ọ batara na ya mgbe e meworo ya ka o zuo oke.
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: nye ndị niile na-erubere ya isi
  rationale: Nke a na-edebe echiche nke mmadụ niile na-aza ya site n'irube isi, ma na-egosikwa na ha bụ ndị na-anata nzọpụta ahụ.
- source_word: αἴτιος
  choice: isi iyi
  rationale: N'Igbo ugbu a, “isi iyi” na-egosi n'ụzọ doro anya na ọ bụ ya si n'aka ya ka nzọpụta ahụ sitere, ma zere ụda ịta ụta nke okwu “onye kpatara” nwere ike inwe.
- source_word: σωτηρίας
  choice: nzọpụta
  rationale: “Nzọpụta” bụ okwu Igbo a na-ejikarị akọwa σωτηρία n'echiche okpukpe nke amaokwu a.
- source_word: αἰωνίου
  choice: ebighị ebi
  rationale: Ọ na-egosipụta nke ọma na nzọpụta ahụ enweghị njedebe.
- source_word: καὶ
  choice: -kwa- dị na “E mewokwa”
  rationale: Mgbakwunye “-kwa-” jikọtara okwu a na ihe bu ya ụzọ n'ụzọ dị nkenke ma dịkwa eke n'Igbo.
theological_decisions:
- issue: Ihe τελειωθεὶς pụtara mgbe ọ na-ekwu maka Jizọs
  choice: e meworo ya ka o zuo oke
  alternative: e meworo ya ka ọ bụrụ onye zuru okè
  rationale: Nhọrọ a na-elekwasị anya n'ịruzu ebumnuche na imecha ọrụ nchụaja na nke mgbapụta, kama ime ka a ghọta na Jizọs si n'omume mmehie banye n'omume zuru okè.
- issue: Irube isi dị ka e si kwuo ya n'amaokwu ahụ
  choice: nye ndị niile na-erubere ya isi
  alternative: nye ndị niile kwere na ya
  rationale: E debere okwu irube isi nke Grik kwuru kpọmkwem, n'emeghị ka ọ bụrụ naanị ikwere ma ọ bụ kọwaa ya dịka ozizi otu ụka si dị.
- issue: Ọrụ Jizọs n'iwebata nzọpụta
  choice: ọ ghọrọ isi iyi nke nzọpụta
  alternative: ọ ghọrọ onye kpatara nzọpụta
  rationale: “Isi iyi” na-echekwa echiche na nzọpụta sitere n'aka ya; ndetu ala peeji na-edebekwa ihe ọzọ αἴτιος nwere ike ịpụta.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “-kwa-” mee ka njikọ καὶ pụta n'ụzọ eke. E tinyere akara ndetu ozugbo n'akụkụ okwu ha na-akọwa.
