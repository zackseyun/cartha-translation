  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τελείων δέ ἐστιν ἡ στερεὰ τροφή, τῶν διὰ τὴν ἕξιν τὰ αἰσθητήρια γεγυμνασμένα ἐχόντων πρὸς διάκρισιν καλοῦ τε καὶ κακοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: ig
  text: Ma nri siri ike bụ nke ndị tozuru etozu, bụ ndị nwere ikike nghọta ha[b] zụrụ azụ site n’iji ha eme ihe mgbe niile[a], ka ha wee mata ọdịiche dị n’etiti ihe ọma na ihe ọjọọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site n’àgwà ha zụlitere” ma ọ bụ “site n’omume ha na-eme mgbe niile.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “ikike mmetụta ha” ma ọ bụ “mmasị ha”; n'ebe a, ọ bụ ihe atụ maka ikike mmadụ ji aghọta ma kpebie.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: ndị tozuru etozu
  rationale: Ọ na-egosi ndị toro eto n'ụzọ ime mmụọ, n'adịghị ka ụmụ ọhụrụ e kwuru okwu ha n'amaokwu bu ụzọ; ọ naghị ekwu na ha enweghị mmehie ma ọ bụ na ha zuru oke kpamkpam.
- source_word: στερεὰ τροφή
  choice: nri siri ike
  rationale: Nke a na-edobe ihe atụ nke nri a na-ata ata n'adịghị ka mmiri ara.
- source_word: διὰ τὴν ἕξιν
  choice: site n’ịmụgharị ya mgbe niile
  rationale: ἕξις na-egosi omume a na-eme ugboro ugboro, àgwà e ji eme ihe, ma ọ bụ nka e nwetara site n'iji ya eme ihe.
- source_word: τὰ αἰσθητήρια
  choice: ikike nghọta ha
  rationale: Ọ bụ ezie na okwu Grik ahụ pụtara ikike mmetụta, e ji ya mee ihe atụ maka ikike mmadụ ji aghọta ma kpebie.
- source_word: γεγυμνασμένα ἐχόντων
  choice: zụrụ ... ha
  rationale: Ọ na-egosi na site n'omume ugboro ugboro, ikike ndị ahụ anọworị n'ọnọdụ a zụrụ azụ.
- source_word: πρὸς διάκρισιν
  choice: ịmata ọdịiche dị n’etiti
  rationale: Nke a na-egosipụta nzube nke ọzụzụ ahụ n'ụzọ doro anya ma kwekọọ n'usoro asụsụ Igbo.
- source_word: καλοῦ τε καὶ κακοῦ
  choice: ihe ọma na ihe ọjọọ
  rationale: Ọ na-edobe ụzọ Akwụkwọ Nsọ si ekwu maka ịmata ọdịiche omume dị n'etiti ihe ọma na ihe ọjọọ.
- source_word: δέ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n'etiti nri siri ike nke ndị tozuru etozu na mmiri ara nke ụmụ ọhụrụ n'amaokwu bu ụzọ.
theological_decisions:
- issue: Ihe τελείων pụtara n'okwu banyere ito eto n'ụzọ ime mmụọ
  choice: ndị tozuru etozu
  alternative: ndị zuru oke
  rationale: Ọnọdụ okwu ahụ na-atụnyere ndị ka bụ ụmụ ọhụrụ na ndị ikike nghọta ha zụrụ azụ. Nhọrọ a ezere ikwu na ndị a enweghị mmehie, nke okwu ahụ n'onwe ya na-achọghị ikwu.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwụ ọtọ ma nwee ugwu. E debere ihe atụ nri, njikọ mmegide “Ma,” na echiche nke ikike nghọta a zụrụ site n'omume ugboro ugboro. A haziri akara nkọwa ụkwụ ka ha soro okwu ha na-akọwa.
