    issue: Awkward constituent order in the final clause
    rationale: The current wording places “ya onwe ya kwa” inside the object of “gbara ... gburugburu,” making the clause less smooth than necessary. A relative/copular recasting preserves the Greek emphasis and reads naturally.
  - severity: low
    issue: English grammatical label in Igbo footnote
    rationale: Replacing “Participle” with “ngwaa-nsonye” gives a consistent Standard Igbo explanatory note while retaining the lexical point.
