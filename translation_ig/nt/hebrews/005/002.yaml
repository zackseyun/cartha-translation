base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/002.yaml
  text: being able to deal gently with those who are ignorant and going astray[a], since he himself also is beset with weakness[b],
translation:
  language: ig
  text: onye pụrụ iji nwayọọ mesoo ndị na-amaghị ihe na ndị na-akpafu ụzọ[a], ebe ọ bụ na ya onwe ya kwa bụ onye adịghị ike gbara gburugburu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị a na-eduhie ka ha kpafuo ụzọ.” Ngwaa-nsonye Grik ahụ nwekwara ike ịpụta n’ụdị passive.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “adịghị ike gbara ya gburugburu,” ma ọ bụ, “o yi adịghị ike dịka uwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετριοπαθεῖν
  choice: iji nwayọọ mesoo
  rationale: Nke a na-egosi omume dị nro ma nwee njide onwe onye, nke na-adịghị aka ike ma ọ bụ na-eleghara mmadụ anya.
- source_word: δυνάμενος
  choice: onye pụrụ
  rationale: Ọ na-edobe ọrụ participle ahụ, na-akọwa ikike onyeisi nchụaja ahụ nwere n’usoro ahịrịokwu gbara ya gburugburu.
- source_word: τοῖς ἀγνοοῦσι
  choice: ndị na-amaghị ihe
  rationale: Ọ na-edobe echiche participle ahụ n’asụsụ Igbo doro anya, n’emeghị ka ha bụrụ otu òtù mmadụ a kpọrọ aha pụrụ iche.
- source_word: πλανωμένοις
  choice: ndị na-akpafu ụzọ
  rationale: Ọ na-egosipụta isi n’ụzọ ziri ezi pụọ ma na-ahapụ ajụjụ banyere onye kpatara nkpagharị ahụ ka ihe odide Grik si hapụ ya; e nyere nghọta passive na nkọwa ala peeji.
- source_word: ἐπεὶ
  choice: ebe ọ bụ na
  rationale: Ọ na-ewebata ihe mere onyeisi nchụaja ahụ ji nwee ike iji nwayọọ mesoo ndị ọzọ.
- source_word: καὶ αὐτὸς
  choice: ya onwe ya kwa
  rationale: Ọ na-echekwa ma nkwusiri ike dị na αὐτός ma echiche mgbakwunye dị na καί.
- source_word: περίκειται ἀσθένειαν
  choice: adịghị ike gbara ya gburugburu
  rationale: Ọ na-echekwa ihe oyiyi nke ọnọdụ adịghị ike nke gbara mmadụ gburugburu, ma bụrụkwa okwu Igbo a pụrụ ịghọta nke ọma.
theological_decisions:
- issue: Ụdị mmejọ ndị a kọwara dịka ἀγνοοῦσι καὶ πλανωμένοις
  choice: Ndị na-amaghị ihe na ndị na-akpafu ụzọ
  alternative: Ịkọwa ya kpọmkwem naanị dịka mmehie a mere n’amaghị ama n’usoro àjà ndị Livayị
  rationale: Okwu ndị ahụ kwekọrọ na ọnọdụ ọrụ nchụaja, ma n’onwe ha ha sara mbara karịa otu aha nka gbasara àjà; nsụgharị ahụ anaghị eme ka ihe odide ahụ dị warara karịa ka ọ dị.
- issue: Ihe ἀσθένεια pụtara banyere onyeisi nchụaja
  choice: adịghị ike mmadụ n’ozuzu ya
  alternative: adịghị ike anụ ahụ naanị, ma ọ bụ adịghị ike omume naanị
  rationale: “Adịghị ike” na-echekwa obosara okwu Grik ahụ ma ghara ikpebi na ọ bụ naanị nke anụ ahụ ma ọ bụ naanị nke omume.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị nsọ n’ụda ya. Ahịrịokwu ahụ bụ akụkụ na-aga n’ihu site n’amaokwu bu ya ụzọ, ya mere e jiri “onye pụrụ” malite ya ma debe rikoma na njedebe.
