id: HEB.5.8
reference: Hebrews 5:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καίπερ ὢν υἱός, ἔμαθεν ἀφ’ ὧν ἔπαθεν τὴν ὑπακοήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/008.yaml
  text: Although he was a Son[a], he learned obedience from what he suffered[b],
translation:
  language: ig
  text: Ọ bụ ezie na ọ bụ Nwa[a], ọ mụtara nrubeisi site n’ihe ndị ọ tara ahụhụ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ bụ ezie na ọ bụ Nwa ahụ.” N’asụsụ Grik, e dere naanị “Nwa” n’enweghị mkpụrụokwu nkọwa.
    reason: alternative_reading
  - marker: b
    text: “Ọ mụtara nrubeisi” na-ekwu maka mmụta o nwetara site n’ahụhụ ndị o tara; ọ pụtaghị na a na-agbazi ya n’ihi nnupụisi o mere na mbụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: Ọ bụ ezie na
  rationale: 'Na-egosi nkwenye nwere ntụgharị: n’agbanyeghị na ọ bụ Ọkpara, ọ mụtara nrubeisi site n’ahụhụ.'
- source_word: ὢν
  choice: ọ bụ
  rationale: Ọ bụ participle nke εἰμί; n’Igbo, nkebiokwu zuru ezu ‘ọ bụ’ bụ ụzọ ebumpụta ụwa isi kwuo ya.
- source_word: υἱός
  choice: Ọkpara
  rationale: Aha ahụ enweghị article na Grik ma bụrụ predicative. ‘Ọkpara’ na-egosi mmekọrịta pụrụ iche nke Jizọs na Chineke n’ebe a, n’enweghị ịtinye article Grik na-enweghị.
- source_word: ἔμαθεν
  choice: ọ mụtara
  rationale: Na-edobe okwu ahụ kpọmkwem dị ka mmụta nke mere n’ezie, kama ime ka ike ya daa site n’ịkọwa ya n’ụzọ ọzọ.
- source_word: ἀφ’ ὧν
  choice: site n’ihe ndị
  rationale: ἀπό na relative pronoun na-egosi isi mmalite ma ọ bụ ihe mmụta ahụ siri na ya pụta.
- source_word: ἔπαθεν
  choice: ọ tara ahụhụ
  rationale: Akpaalaokwu Igbo ‘ịta ahụhụ’ na-egosi ahụhụ e diri n’ezie ma dabara n’ụda okwu a.
- source_word: τὴν ὑπακοήν
  choice: nrubeisi
  rationale: ‘Nrubeisi’ bụ aha nkịtị na-egosi ido onwe n’okpuru uche Chineke; Igbo achọghị ka article Grik pụta iche n’ebe a.
theological_decisions:
- issue: Otu e si egosi ọnọdụ Kraịst dị ka Ọkpara na mmekọrịta ya na mmụta
  choice: Ọ bụ ezie na ọ bụ Ọkpara
  alternative: N’agbanyeghị na ọ bụ Ọkpara ahụ
  rationale: Nsụgharị ahụ na-edobe ma eziokwu nke ịbụ Ọkpara ya ma nkwupụta na ọ mụtara nrubeisi site n’ahụhụ. E tinyeghị ‘ahụ’ n’ahụ isiokwu n’ihi na υἱός enweghị article, ma ‘Ọkpara’ doro anya n’ọdịnaya ahụ.
- issue: Ma ‘ọ mụtara nrubeisi’ ọ na-egosi na ọ bụbu onye na-enupụ isi
  choice: Idobe okwu kpọmkwem, ‘ọ mụtara nrubeisi’
  alternative: ọ mụtara n’ahụmahụ ihe nrubeisi pụtara
  rationale: Grik kwuru kpọmkwem na ọ mụtara nrubeisi. Ihe a na-ekwu bụ mmụta e nwetara site n’ibi ndụ na ịta ahụhụ, ọ bụghị mgbazi site na nnupụisi gara aga; nsụgharị ahụ anaghị ekpochapụ esemokwu dị n’okwu ahụ site n’ịkọwa ya karịa ihe e dere.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Ọkpara’ na ‘nrubeisi’ bụ okwu Baịbụl a maara nke ọma, ebe ‘site n’ihe ndị ọ tara ahụhụ’ na-edobe njikọ na plurala nke ὧν n’ụzọ Igbo dị mma.
