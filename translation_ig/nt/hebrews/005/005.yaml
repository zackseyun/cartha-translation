id: HEB.5.5
reference: Hebrews 5:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: ig
  text: 'N’otu aka ahụkwa, Mesaịa ahụ[a] enyeghị onwe ya otuto[c] ka ọ ghọọ onyeisi nchụàjà; kama, ọ bụ Onye ahụ gwara ya okwu, sị:


    “Ị bụ Nwa m;

    taa ka m mụrụ gị.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “Kraịst.” N’ebe a, okwu Grik bụ Χριστός bụ utu aha pụtara “Mesaịa.”
    reason: alternative_reading
  - marker: b
    text: Okwu e hotara sitere n’Abụ Ọma 2:7.
    reason: cross_reference
  - marker: c
    text: A pụkwara ịsụgharị ya “enyeghị onwe ya nsọpụrụ.” Okwu Grik ahụ pụrụ ịpụta inye otuto ma ọ bụ nsọpụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: N’otu aka ahụkwa
  rationale: Ọ na-egosi ntụnyere ya na ihe e kwuru n’amaokwu ndị bu ụzọ banyere ịhọpụta onye nchụàjà, ma bụrụkwa okwu Igbo doro anya ma na-aga nke ọma.
- source_word: ὁ Χριστὸς
  choice: Mesaịa ahụ
  rationale: N’ebe a, Χριστός na-arụ ọrụ dị ka utu aha nke Onye Chineke họpụtara, ọ bụghị naanị dị ka aha mmadụ; ya mere “Mesaịa” na-egosipụta isi okwu ahụ nke ọma.
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: enyeghị onwe ya otuto
  rationale: Nhọrọ a na-echekwa mmegharị okwu ahụ n’onwe ya ma na-eburu echiche δοξάζω nke inye otuto ma ọ bụ nsọpụrụ.
- source_word: γενηθῆναι ἀρχιερέα
  choice: ka ọ ghọọ nnukwu onye nchụàjà
  rationale: Ọ na-egosi ịbanye n’ọrụ ma ọ bụ n’ọkwa onyeisi nchụàjà, n’asụsụ Igbo dị mfe nghọta.
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: kama, ọ bụ Onye ahụ gwara ya, sị
  rationale: Ọ na-echekwa Onye ahụ dị ka isiokwu a na-akpọghị aha kpọmkwem, dịka Grik si mee, ebe ọnọdụ okwu ahụ na-egosi na ọ bụ Chineke.
- source_word: Υἱός μου εἶ σύ
  choice: Ị bụ Ọkpara m
  rationale: Ọ na-enye okwu nkwupụta ahụ n’usoro Igbo e ji ekwu okwu, ma na-echekwa kpọmkwem njikọ Nna na Ọkpara dị n’amaokwu e hotara.
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: taa ka m mụrụ gị
  rationale: Ọ na-edobe “taa” n’ọnọdụ nkwusi ike ma na-asụgharị γεννάω n’enweghị nkọwa agbakwunyere banyere oge ma ọ bụ ụdị ọmụmụ ahụ.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaịa ahụ
  alternative: Kraịst ahụ
  rationale: Ọ bụ utu aha n’arụmụka gbasara onye Chineke họpụtara ka ọ bụrụ nnukwu onye nchụàjà; “Mesaịa” na-eme ka ọrụ utu aha ahụ pụta ìhè.
- issue: Ihe “taa ka m mụrụ gị” pụtara n’ihe gbasara Mesaịa
  choice: E debere okwu e hotara dịka ọ dị, n’enweghị nkọwa nkà mmụta okpukpe agbakwunyere
  alternative: Ịkọwa ya kpọmkwem dịka echichi eze, mbilite n’ọnwụ, ma ọ bụ ọmụmụ ebighị ebi
  rationale: Okwu a sitere n’Abụ Ọma 2:7. Nsụgharị ahụ ekwesịghị ikpebi n’ime isiokwu amaokwu ihe arụmụka nkà mmụta okpukpe ndị e mesịrị ga-ekpebi.
- issue: Onye nyere Mesaịa otuto
  choice: 'A hapụrụ aha Chineke n’ọnọdụ a na-akpọghị ya kpọmkwem: “Onye ahụ”'
  alternative: Ịgbakwunye “Chineke” n’isiokwu amaokwu
  rationale: Grik jiri participle nwere article mee ka Onye ahụ pụta ìhè n’enweghị ịkpọ aha ya; okwu e hotara na ọnọdụ ya na-eme ka onye a bụ doo anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro uri n’okwu e hotara, a zerekwa ịgbakwunye nkọwa otu ụka ma ọ bụ idozi ihe amaokwu ahụ hapụrụ ka a tụlee.
