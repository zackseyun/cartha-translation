    “Ị bụ Nwa m;

    taa ka m mụrụ gị.”[b]'
  rationale: Replaced the nontechnical “nnukwu onye nchụàjà” with “onyeisi nchụàjà,” the standard Igbo designation of the high priest, and replaced “Ọkpara m” with “Nwa m” so that no ‘firstborn’ sense is added. The quotation, its ambiguity, its register, and all footnote anchors are otherwise preserved.
