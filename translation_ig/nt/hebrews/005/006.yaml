  text: καθὼς καὶ ἐν ἑτέρῳ λέγει· Σὺ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισέδεκ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/006.yaml
  text: just as he also says in another place[b][a], “You are a priest forever according to the order of Melchizedek,”
translation:
  language: ig
  text: Dị ka ọ na-ekwu kwa n’ebe ọzọ[a], “Ị bụ onye nchụàjà ruo mgbe ebighị ebi n’usoro Melkizedek.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’akụkụ ọzọ.” N’asụsụ Grik, ọ pụtara kpọmkwem “n’ọzọ,” ebe a hapụrụ okwu dịka “ebe” ma a na-aghọta ya.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “dịka usoro Melkizedek si dị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς καὶ
  choice: dị ka ọ na-ekwukwa
  rationale: Nke a na-egosipụta ma ntụnyere dị na καθώς ma echiche ‘kwa’ dị na καί, n’ụzọ Igbo na-asụkarị.
- source_word: ἐν ἑτέρῳ
  choice: n’ebe ọzọ
  rationale: Okwu Grik ahụ hapụrụ aha ihe a na-ekwu maka ya n’amaghị ama; ‘n’ebe ọzọ’ na-eme ka o doo anya na ọ bụ akụkụ Akwụkwọ Nsọ ọzọ, na-enweghị ịkọwa ya gabiga ókè.
- source_word: λέγει
  choice: ọ na-ekwu
  rationale: E ji nnọchiaha onye mee ka olu dị ndụ nke oge ugbu a dịrị, ma ahapụghị kpọmkwem onye ahụ bụ; n’ọnọdụ a, a na-aghọta na ọ bụ Chineke na-ekwu n’Akwụkwọ Nsọ.
- source_word: Σὺ
  choice: Ị
  rationale: E debere okwu a a na-agwa otu onye kpọmkwem.
- source_word: ἱερεὺς
  choice: onye nchụàjà
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa onye na-eje ozi nchụàjà.
- source_word: εἰς τὸν αἰῶνα
  choice: ruo mgbe ebighị ebi
  rationale: Nke a na-enye echiche nke ịdịgide na-enweghị njedebe n’Igbo nkịtị ma dị ùgwù.
- source_word: κατὰ τὴν τάξιν
  choice: dịka usoro ... si dị
  rationale: ‘Usoro’ na-echekwa echiche nke nhazi ma ọ bụ ụdị òtù nchụàjà a kpọrọ aha, kama ime ka ọ bụrụ naanị otu esi eme ihe.
- source_word: Μελχισέδεκ
  choice: Melkizedek
  rationale: E degharịrị aha ahụ n’ụdị mkpụrụokwu dabara n’Igbo, kama ịsụgharị ihe aha ahụ pụtara.
theological_decisions:
- issue: Onye na-ekwu okwu n’usoro mmeghe nke amaokwu ahụ
  choice: E ji ‘ọ na-ekwu’ mee ihe, nke na-ahapụ onye a na-ekwu maka ya ka a ghọta ya dị ka Chineke na-ekwu site n’Akwụkwọ Nsọ.
  alternative: ‘Akwụkwọ Nsọ na-ekwu’ ma ọ bụ ‘e kwuru’
  rationale: Okwu Grik bụ onye nke atọ otu, oge ugbu a. Nsụgharị a na-echekwa olu onye na-ekwu okwu na-adị ndụ n’akwụkwọ Ndị Hibru, na-etinyeghị aha ‘Chineke’ nke na-adịghị kpọmkwem n’ahịrịokwu ahụ.
- issue: Ihe τάξις pụtara n’ihe e kwuru banyere Melkizedek
  choice: ‘usoro’ dịka nhazi ma ọ bụ ụdị òtù nchụàjà
  alternative: ‘ụdị’ ma ọ bụ ‘usoro omume’
  rationale: ‘Usoro’ na-echekwa njikọ nke amaokwu a na ụdị ọrụ nchụàjà e jikọtara ya na Melkizedek, ma ọ naghị emechi ụzọ nye nghọta ndị ọzọ okwu ahụ nwere ike ibu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere usoro okwu nke amaokwu Abụ Ọma ahụ n’ụdị dabara n’okwu Igbo, ma chekwaa nghọta nke ọrụ nchụàjà na-adịgide adịgide na njikọ ya na Melkizedek.
