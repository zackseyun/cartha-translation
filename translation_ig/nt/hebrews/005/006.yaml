  to: Dị ka ọ na-ekwu kwa n’ebe ọzọ[a], “Ị bụ onye nchụàjà ruo mgbe ebighị ebi n’usoro Melkizedek.”[b]
  rationale: The revision improves idiomatic Standard Igbo and renders the Greek prepositional phrase κατὰ τὴν τάξιν more directly, while preserving the source’s implicit speaker, present-tense citation formula, and the ambiguity-free proper name. Footnote anchors are retained and footnote b is adjusted so that it remains a genuine alternative rather than repeating the main text.
