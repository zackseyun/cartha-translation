id: HEB.5.4
reference: Hebrews 5:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: ig
  text: Ọ dịghịkwa onye na-ewere nsọpụrụ a n’onwe ya[a], kama ọ bụ Chineke na-akpọ ya, dịka o si kpọọkwa Erọn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nsọpụrụ ahụ.” Okwu Grik ahụ kwuru nanị “nsọpụrụ ahụ,” nke n’ebe a na-ezo aka n’ùgwù ma ọ bụ ọrụ onye nchụàjà.
    reason: lexical_alternative
lexical_decisions:
- source_word: τις (ya na οὐχ)
  choice: ọ dịghị onye
  rationale: Ngwakọta okwu nkw否 οὐχ na nnọchiaha na-akọwaghị onye τις pụtara n’ụzọ ebumpụta ụwa n’Igbo, ‘ọ dịghị onye.’
- source_word: ἑαυτῷ
  choice: n’onwe ya
  rationale: Nke a na-egosi na mmadụ agaghị ewere ma ọ bụ nye onwe ya ùgwù a site n’ike nke aka ya.
- source_word: λαμβάνει
  choice: na-ewere
  rationale: ‘Na-ewere’ na-echekwa echiche nke mmadụ iwere nsọpụrụ ahụ n’onwe ya, ma na-eme ka ọdịiche dị n’etiti nke ahụ na ọkpụkpọ Chineke doo anya.
- source_word: τὴν τιμήν
  choice: nsọpụrụ a
  rationale: ‘Nsọpụrụ’ bụ ntụgharị kpọmkwem nke τιμή; ‘a’ na-ezo aka n’ọnọdụ onyeisi nchụàjà a kọwara n’amaokwu ndị gbara ya gburugburu n’etinyeghị ‘ọkwa’ n’ime isiokwu ahụ.
- source_word: καλούμενος ὑπὸ τοῦ θεοῦ
  choice: ọ bụ Chineke na-akpọ ya
  rationale: E ji usoro na-arụ ọrụ n’Igbo mee ka okwu Grik nke e ji olu nnabata dee bụrụ nke doro anya ma dị mfe, ebe Chineke ka bụ onye na-akpọ.
- source_word: καθώσπερ καὶ Ἀαρών
  choice: dịka o si kpọọkwa Erọn
  rationale: 'Nke a na-emeju ngwaa a hapụrụ n’ụzọ nghọta na Grik, ma na-echekwa ‘kwa’ nke καί: Chineke kpọkwara Erọn.'
theological_decisions:
- issue: Ụdị nhọpụta onye nchụàjà
  choice: Nsọpụrụ a abụghị ihe mmadụ na-ewere n’onwe ya; ọ dabere n’ọkpụkpọ Chineke, dịka nke Erọn.
  alternative: Ịgụ ‘nsọpụrụ’ dịka okwu gbasara ùgwù n’ozuzu, ọ bụghị kpọmkwem ọrụ onyeisi nchụàjà.
  rationale: Ihe gbara amaokwu a gburugburu (Ndị Hibru 5:1–5) na-ekwu maka onyeisi nchụàjà. A hapụrụ ‘nsọpụrụ’ dịka aha sara mbara nke Grik ji mee ihe, kama ịgbanwe ya ozugbo ka ọ bụrụ ‘ọkwa,’ ka e wee ghara idozi ihe ederede ahụ hapụrụ ka ọnọdụ ya kọwaa.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ‘ọ bụ Chineke na-akpọ ya’ na-ezere olu nnabata na-adịghị aga were were n’Igbo ma na-echekwa Chineke dịka onye na-eme ọkpụkpọ ahụ.
