  text: καὶ παρεκάλει αὐτὸν πολλὰ ἵνα μὴ ⸀αὐτὰ ἀποστείλῃ ἔξω τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/010.yaml
  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: ig
  text: O wee rịọsiri ya ike ọtụtụ ugboro ka ọ ghara izipụ ha n’èzí ógbè ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “O wee rịọ ya ọtụtụ ugboro ka ọ ghara izipụ ha n’èzí mpaghara ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλει
  choice: rịọkwara ya arịrịọ ike
  rationale: N’ọnọdụ ịchụ mmụọ ọjọọ a, okwu ahụ na-egosi arịrịọ siri ike, ọ bụghị nanị ịrịọ ihe n’ụzọ nkịtị.
- source_word: πολλὰ
  choice: ọtụtụ ugboro
  rationale: N’ebe a ọ na-eme ka arịrịọ ahụ sie ike ma na-egosi na e mere ya ugboro ugboro.
- source_word: ἵνα μὴ
  choice: ka ọ ghara
  rationale: Nke a na-egosipụta ọdịnaya arịrịọ ahụ n’Igbo dị mma ma na-edobe echiche nke mgbochi.
- source_word: αὐτὰ
  choice: ha
  rationale: Nnọchiaha Grik ahụ bụ ọtụtụ, na-ezo aka n’ọtụtụ mmụọ ọjọọ ahụ, ọ bụ ezie na onye na-arịọ arịrịọ pụtara n’otu onye.
- source_word: ἀποστείλῃ
  choice: zipụ
  rationale: ‘Zipụ’ na-enye isi ihe ἀποστέλλω pụtara n’enweghị itinye echiche nke ịchụpụ n’ike nke ngwaa ahụ ekwughị kpọmkwem.
- source_word: ἔξω τῆς χώρας
  choice: n’èzí ógbè ahụ
  rationale: χώρα ebe a bụ mpaghara ma ọ bụ ógbè dị nso, ọ bụghị mba n’echiche nke oge a.
theological_decisions:
- issue: Ngbanwe dị n’etiti onye na-ekwu okwu n’otu na mmụọ ọjọọ ndị a na-ekwu maka ha n’ọtụtụ
  choice: E debere ‘ọ’ maka onye na-arịọ arịrịọ na ‘ha’ maka mmụọ ọjọọ ndị ahụ.
  alternative: Ịsụgharị ya niile dịka otu ìgwè iji mee ka mgbanwe ọnụọgụ ahụ ghara ịpụta.
  rationale: 'Grik ahụ n’onwe ya na-edobe esemokwu a: otu onye na-anọchite anya ndị ọzọ na-arịọ arịrịọ, ma ihe a ga-ezipụ bụ ọtụtụ. Nsụgharị ahụ anaghị edozi esemokwu a n’ụzọ ederede ekwughị.'
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ógbè’ gosi mpaghara ahụ, ebe ndetu ala peeji na-enye ‘ala’ dịka ụzọ ọzọ isi ghọta χώρα.
