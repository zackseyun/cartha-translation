- from: Ọ rịọkwara ya arịrịọ ike ọtụtụ ugboro ka ọ ghara izipụ ha n’èzí ógbè ahụ.[a]
  to: O wee rịọsiri ya ike ọtụtụ ugboro ka ọ ghara izipụ ha n’èzí ógbè ahụ.[a]
  rationale: The revision removes an unnatural cognate-noun construction, retains the singular spokesman and plural demons indicated by the Greek, expresses the urgency and repetition of the plea, and keeps χώρα in its local geographical sense. The footnote offers a viable lexical alternative for the regional term without altering the meaning.
