id: MRK.5.21
reference: Mark 5:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: ig
  text: Mgbe Jizọs n’ụgbọ mmiri gafere ọzọ ruo n’ofe nke ọzọ[a], nnukwu ìgwè mmadụ gbakọtara gburugburu ya, ọ nọkwa n’akụkụ oké osimiri ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, Oké Osimiri Galili, nke bụ ọdọ mmiri a na-akpọkarị “oké osimiri” n’akwụkwọ Oziọma.
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: Mgbe ... gafere
  rationale: A sụgharịrị nkebi a dị ka ọnọdụ oge nke mere tupu ihe sochirinụ; usoro “Mgbe ... gafere” bụ Igbo nkịtị ma na-edobe usoro ihe ndị ahụ.
- source_word: ἐν τῷ πλοίῳ
  choice: ji ụgbọ mmiri
  rationale: Nke a na-egosi n'ụzọ doro anya na ụgbọ mmiri bụ ụzọ Jizọs si gafee, ma ọ bụkwa okwu Igbo na-aga were were.
- source_word: πάλιν
  choice: ọzọ
  rationale: “Ọzọ” na-edobe echiche nke ime otu ihe ugboro ọzọ.
- source_word: εἰς τὸ πέραν
  choice: ruo n’ofe nke ọzọ
  rationale: N’ọnọdụ njem n’elu ọdọ mmiri a, okwu ahụ na-ezo aka n’akụkụ mmiri dị n’ofe; nsụgharị a doro ndị na-agụ Igbo anya.
- source_word: συνήχθη
  choice: gbakọtara
  rationale: Ọ bụ ezie na ngwaa Grik ahụ dị n’ụdị nnara, “ìgwè mmadụ gbakọtara” bụ ụzọ Igbo ebumpụta ụwa si akọ ihe ahụ n’enweghị ịgbanwe ihe ọ pụtara.
- source_word: ὄχλος πολὺς
  choice: nnukwu ìgwè mmadụ
  rationale: Nke a na-egosi ịdị ukwuu nke ọnụ ọgụgụ mmadụ n’asụsụ Igbo doro anya ma dị ugbu a.
- source_word: ἐπ’ αὐτόν
  choice: gburugburụ ya
  rationale: N’ebe a, preposishọn ahụ na-egosi na ndị mmadụ zukọtara bịaruo Jizọs nso ma gbaa ya gburugburu.
- source_word: παρὰ τὴν θάλασσαν
  choice: n’akụkụ oké osimiri ahụ
  rationale: Nke a na-edobe echiche nke ịnọ nso n’akụkụ mmiri ahụ, ma na-agbaso okwu Grik nke kpọrọ ya “oké osimiri.”
- source_word: θάλασσαν
  choice: oké osimiri
  rationale: Ọ bụ ezie na ebe mmiri a bụ ọdọ mmiri Galili, okwu Grik bụ “oké osimiri”; ya mere isiokwu ahụ na-edobe ya, ebe nkọwa ala dị n’okpuru.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta, dee amaokwu ahụ. E debeghị usoro Grik n’ụzọ ga-eme ka Igbo sie ike; e jikwa “oké osimiri” chekwaa okwu isi mmalite, tinyere nkọwa ala n’ala ala peeji.
