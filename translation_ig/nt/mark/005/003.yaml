source:
  edition: SBLGNT
  text: ὃς τὴν κατοίκησιν εἶχεν ἐν τοῖς μνήμασιν, καὶ ⸂οὐδὲ ἁλύσει οὐκέτι⸃ οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/003.yaml
  text: who had his dwelling among the tombs[a], and no one could bind him anymore, not even with a chain.
translation:
  language: ig
  text: onye bi n’etiti ili ndị ahụ[a], ọ dịkwaghị onye ọ bụla nwere ike iji ọbụna agbụ kee ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kwekọrọ nnọọ n’usoro okwu mbụ, “onye bi n’ime ili ndị ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοίκησιν εἶχεν
  choice: bi
  rationale: N'Igbo nke oge a, ‘bi’ na-egosipụta nke ọma okwu Grik ahụ pụtara, ya bụ, ebe onye ahụ na-anọ dị ka ebe obibi ya; ọ dịkwuo mfe ma bụrụ ihe ndị mmadụ na-ekwu karịa ntụgharị okwu n'okwu n'okwu.
- source_word: ἐν τοῖς μνήμασιν
  choice: n’etiti ili ndị ahụ
  rationale: ‘Ili’ bụ okwu Igbo doro anya maka ebe e liri mmadụ. ‘N’etiti’ na-egosipụta ọnọdụ ya n'ebe ili ndị ahụ dị n'ebughị ụzọ kpebie na ọ na-anọ mgbe niile n'ime otu ili.
- source_word: οὐδὲ ἁλύσει
  choice: iji ọbụna agbụ
  rationale: ‘Agbụ’ na-egosipụta ἅλυσις nke dị n'ụdị otu; ‘ọbụna’ na-echekwa ike nkwusi okwu οὐδέ.
- source_word: οὐκέτι
  choice: ọzọ
  rationale: N'ọnọdụ ahịrịokwu a, ‘ọzọ’ na-egosipụta na ihe e nwere ike ime na mbụ abụghịzi ihe onye ọ bụla pụrụ ime.
- source_word: ἐδύνατο
  choice: pụrụ
  rationale: ‘Pụrụ’ bụ ụzọ dị nkenke na nke okike e si egosipụta ikike ma ọ bụ enweghị ikike n'Igbo.
- source_word: δῆσαι
  choice: kee
  rationale: N'ebe a, ‘kee’ pụtara iji agbụ kee mmadụ, ya mere ọ na-echekwa echiche nke ijikọ ya n'ụzọ anụ ahụ kama ịsụgharị ya naanị dị ka igbochi ya.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. E jiri ‘n’etiti ili’ mee ka akụkọ ahụ daa nke ọma n’Igbo, ebe nkọwa ala peeji na-echekwa ntụgharị kpọmkwem karị, ‘n’ime ili.’
