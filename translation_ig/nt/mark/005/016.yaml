  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: ig
  text: Ndị hụrụ ya kọọrọ ha otu ihe ahụ si mee nwoke ahụ mmụọ ọjọọ ji, na ihe banyere ezi ndị ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διηγήσαντο
  choice: kọọrọ ha
  rationale: Ngwaa a pụtara ịkọ ma ọ bụ ịkọwa ihe mere. “Kọọrọ ha” bụ okwu Igbo dị mfe ma bụrụkwa nke dabara n’akụkọ a.
- source_word: οἱ ἰδόντες
  choice: Ndị hụrụ ihe ahụ
  rationale: Nke a na-edobe ọdịdị participle ahụ ma na-egosi na ndị na-akọ akụkọ ahụ ji anya ha hụ ihe mere.
- source_word: πῶς ἐγένετο
  choice: otú ihe si mee
  rationale: Nke a na-egosipụta ụzọ ma ọ bụ usoro ihe ahụ si mee, na-enweghị ịgbakọta ya naanị ka ọ bụrụ “ihe mere.”
- source_word: τῷ δαιμονιζομένῳ
  choice: nwoke ahụ mmụọ ọjọọ ji
  rationale: Nke a bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ nwoke ahụ nọ n’okpuru ike mmụọ ọjọọ; ọ na-ezere okwu pụrụ iche nke ndị nkịtị nwere ike ghara ịghọta.
- source_word: περὶ τῶν χοίρων
  choice: ihe banyere ezi ndị ahụ
  rationale: “Banyere” na-egosipụta περί nke ọma, ebe “ezi” bụ okwu Igbo nkịtị maka χοῖροι.
theological_decisions:
- issue: Otú e si sụgharịa δαιμονιζομένῳ n’akụkọ banyere ọrụ mmụọ ọjọọ
  choice: nwoke ahụ mmụọ ọjọọ ji
  alternative: nwoke ahụ mmụọ ọjọọ bi n’ime ya
  rationale: Nhọrọ a na-edobe eziokwu nke mkpagbu mmụọ ọjọọ dị n’akụkọ Mak, ma ọ naghị akọwapụta karịa ihe okwu Grik ahụ n’onwe ya kwuru banyere kpọmkwem ụdị ma ọ bụ usoro ọchịchị mmụọ ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E tinyere “kọkwara ha” na nkebi nke abụọ iji mee ka njikọ καὶ περὶ doo anya n’Igbo, n’agbanyeghị na ngwaa ahụ pụtara naanị otu ugboro na Grik.
