- from: Ndị hụrụ ihe ahụ kọọrọ ha otú ihe si mee nwoke ahụ mmụọ ọjọọ ji, kọkwara ha ihe banyere ezi ndị ahụ.
  to: Ndị hụrụ ya kọọrọ ha otu ihe ahụ si mee nwoke ahụ mmụọ ọjọọ ji, na ihe banyere ezi ndị ahụ.
  rationale: This revision preserves the source’s eyewitness subject, its explanatory “how,” the reference to the man afflicted by a demon, and the additional report about the pigs. It improves idiomatic Igbo syntax and avoids needless repetition while retaining the source’s ambiguity about the precise manner of demonic affliction.
