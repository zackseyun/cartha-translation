  text: καὶ ἐπηρώτα αὐτόν· Τί ⸂ὄνομά σοι⸃; καὶ ⸂λέγει αὐτῷ⸃· ⸀Λεγιὼν ὄνομά μοι, ὅτι πολλοί ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: ig
  text: Ọ nọ na-ajụ ya, “Gịnị bụ aha gị?” Ọ sị ya, “Aha m bụ Legiọn,[a] n’ihi na anyị dị ọtụtụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Legiọn” bụ okwu Latịn asụsụ Grik nakweere, nke na-ezo aka n’otu nnukwu ìgwè ndị agha Rom. N’ebe a, ọ na-arụ ọrụ dịka aha mmụọ ọjọọ ahụ kpọrọ onwe ya, ma na-egosikwa na ha dị ọtụtụ.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: Ọ nọkwa na-ajụ
  rationale: Ụdị imperfect na-egosi omume gara n’ihu ma ọ bụ nke a na-eme ugboro ugboro; ‘nọ na-ajụ’ na-echekwa nghọta ahụ n’Igbo.
- source_word: Τί ὄνομά σοι
  choice: Gịnị bụ aha gị?
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke a na-ejikarị ajụ ajụjụ ahụ, n’enweghị ịrapara n’usoro okwu Grik.
- source_word: λέγει αὐτῷ
  choice: Ọ sị ya
  rationale: Ọ bụ ezie na Grik ji historical present mee akụkọ ahụ ka ọ dị ndụ, ‘ọ sị ya’ bụ ụzọ Igbo nkịtị na nke doro anya isi kọọ okwu kpọmkwem n’akụkọ gara aga.
- source_word: Λεγιὼν
  choice: Legiọn
  rationale: E debere ya dị ka aha ma ọ bụ utu aha e si n’okwu ndị agha Rom nweta, kama ịtụgharị ya ka ọ bụrụ naanị aha nkịtị.
- source_word: ὄνομά μοι
  choice: Aha m bụ
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi kwuo usoro njirimara ahụ.
- source_word: ὅτι πολλοί ἐσμεν
  choice: n’ihi na anyị dị ọtụtụ
  rationale: ‘N’ihi na’ na-egosi ihe kpatara aha ahụ, ebe ‘anyị’ na-echekwa mgbanwe dị mkpa site n’otu onye gaa n’ọtụtụ.
theological_decisions:
- issue: Mgbanwe site n’otu onye gaa n’ọtụtụ n’okwu onye na-ekwu
  choice: E debere ma ‘Aha m bụ Legiọn’ ma ‘anyị dị ọtụtụ.’
  alternative: Ịgbanwe ya ka ọ bụrụ ‘Aha anyị bụ Legiọn’ iji mee ka okwu ahụ ghara ịdị n’ụzọ abụọ.
  rationale: Grik ahụ ji ụma debe njirimara onye otu na nkọwa nke ọtụtụ; nsụgharị ahụ ekwesịghị idozi esemokwu ahụ n’ime ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma dị ugwu. E chekwara akụkụ omume na-aga n’ihu nke ἐπηρώτα, akara aha ‘Legiọn,’ na mgbanwe sitere na ‘m’ gaa na ‘anyị,’ ebe a họọrọ usoro akụkọ Igbo nkịtị maka historical present.
