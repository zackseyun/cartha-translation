    rationale: The particle ‘kwa’ normally contributes ‘also/too’ in Igbo. Nothing in this verse requires that added nuance; καί is adequately represented by the normal narrative flow.
  - severity: low
    issue: Footnote phrasing is somewhat awkward
    rationale: ‘aha mmụọ ọjọọ ahụ kwuru na ọ bụ aha ya’ is understandable but less natural than identifying Legiọn as the name by which the demon calls itself.
