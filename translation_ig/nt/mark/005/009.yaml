  naturalness: ‘Ọ nọ na-ajụ ya’ is natural Standard Igbo for the ongoing/repeated asking. The remainder of the verse is clear and suitably direct. The footnote can be made more idiomatic and precise.
  terminology: ‘Legiọn’ appropriately transliterates Λεγιών and preserves its status as a name/designation. The footnote correctly identifies the Latin military background without translating the name away. The revised note avoids awkward wording while retaining the plurality implication.
