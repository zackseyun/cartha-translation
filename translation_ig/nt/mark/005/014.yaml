source:
  edition: SBLGNT
  text: ⸂Καὶ οἱ⸃ βόσκοντες ⸀αὐτοὺς ἔφυγον καὶ ⸀ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς· καὶ ⸀ἦλθον ἰδεῖν τί ἐστιν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/014.yaml
  text: And those who were tending them fled and reported it in the city and in the countryside[a], and they came to see what had happened.
translation:
  language: ig
  text: Ndị na-elekọta ha gbara ọsọ, gaa kọsa akụkọ ahụ n’obodo na n’ime ime obodo[a]; ndị mmadụ wee bịa ịhụ ihe mere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ubi.” A pụrụ ịsụgharị okwu Grik ahụ n’ụzọ nkịtị otu a, ma n’ebe a, o yikarịrị ka ọ na-ezo aka n’ógbè ime ime obodo ndị gbara obodo ahụ gburugburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: βόσκοντες
  choice: na-elekọta
  rationale: N’ebe a, participle a na-ekwu maka ndị na-elekọta ìgwè ezi ahụ; okwu a gụnyere inye ha nri na ịzụ ha, ma bụrụkwa Igbo dị mfe nghọta.
- source_word: αὐτούς
  choice: ha
  rationale: E dochiri nnọchiaha Grik ahụ na nnọchiaha Igbo; ihe ọ na-ezo aka na ya bụ ezi ndị a kpọrọ aha n’amaokwu bu ụzọ.
- source_word: ἔφυγον
  choice: gbara ọsọ
  rationale: Nke a na-egosi ọsọ mberede ha gbara n’ihi ihe mere, ma kwekọọ na ike akụkọ ahụ.
- source_word: ἀπήγγειλαν
  choice: gaa kọsa akụkọ ahụ
  rationale: Ngwaa ahụ pụtara izi ma ọ bụ ịkọsa akụkọ banyere ihe mere; ‘kọsa akụkọ ahụ’ na-ada nke ọma n’Igbo ma na-egosi na ha zisara ya n’ebe dị iche iche.
- source_word: εἰς τὴν πόλιν
  choice: n’obodo
  rationale: Ọ bụ ezie na εἰς nwere ike ịpụta ‘gaa n’ime,’ n’ebe a ọ na-egosi ebe ha kọsara akụkọ ahụ; ‘n’obodo’ bụ ụzọ Igbo si ekwu ya n’enweghị isi okwu ahụ furu efu.
- source_word: εἰς τοὺς ἀγρούς
  choice: n’ime ime obodo
  rationale: ἀγροί nwere ike ịpụta ubi, ma n’ọdịiche ya na ‘obodo’ n’ebe a, o yikarịrị ka ọ na-ezo aka n’ógbè ndị dị gburugburu obodo ahụ.
- source_word: ἦλθον
  choice: ndị mmadụ wee bịa
  rationale: Grik nwere isiokwu ọtụtụ mmadụ nke a na-akpọghị aha kpọmkwem. ‘Ndị mmadụ’ na-eme ka Igbo doo anya ma ghara ịkọwa kpọmkwem ma hà bụ ndị obodo ma ọ bụ ndị ime ime obodo.
- source_word: ἰδεῖν
  choice: ịhụ
  rationale: Infinitive a na-egosi nzube ha ji bịa; ‘ịhụ’ bụ nsụgharị Igbo kacha dabara adaba.
- source_word: τί ἐστιν τὸ γεγονός
  choice: ihe mere
  rationale: Nkebiokwu a na-ajụ banyere ihe ahụ merela; ‘ihe mere’ bụ Igbo nkịtị, doro anya, ma na-echekwa oge akụkọ ahụ.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ nnọchiaha ‘ha’ ka ọ na-ezo aka n’ezi ndị a kpọrọ aha n’amaokwu bu ụzọ, ebe ‘ndị mmadụ’ mere ka isiokwu nke ngwaa ikpeazụ doo anya n’Igbo n’agbanyeghị na Grik akpọghị ha aha kpọmkwem.
