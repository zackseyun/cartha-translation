translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dịkwa mfe nghọta. E debere ọdịdị okwu ndị na-eso ụzọ ahụ nke jupụtara n’ịtụnanya, tinyere omume na-aga n’ihu nke imperfect ἔλεγον.
