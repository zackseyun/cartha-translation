  text: καὶ ἔλεγον αὐτῷ οἱ μαθηταὶ αὐτοῦ· Βλέπεις τὸν ὄχλον συνθλίβοντά σε, καὶ λέγεις· Τίς μου ἥψατο;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/031.yaml
  text: And his disciples were saying to him[a], “You see the crowd pressing in on you, and you say, ‘Who touched me?’”
translation:
  language: ig
  text: Ndị na-eso ụzọ ya nọ na-asị ya, “Ị na-ahụ ìgwè mmadụ ahụ ka ha na-akwagide gị[a], ma ị na-asị, ‘Ònye metụrụ m aka?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ha na-akpachi gị gburugburu.” Okwu Grik ahụ na-egosi na ìgwè mmadụ ahụ na-apịakọta Jizọs n’ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: nọ na-asị
  rationale: Oge imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwu ugboro ugboro; ‘nọ na-asị’ na-echekwa akụkụ ahụ n’Igbo nkịtị.
- source_word: μαθηταὶ
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ndị na-amụta ihe n’aka Jizọs ma na-eso ya.
- source_word: Βλέπεις
  choice: Ị hụrụ
  rationale: Ọ na-egosipụta okwu kpọmkwem banyere ihe pụtara ìhè n’oge ahụ, dịka present indicative Grik si dị.
- source_word: ὄχλον
  choice: ìgwè mmadụ ahụ
  rationale: Ọ bụ okwu Igbo nke oge a, doro anya, ma dabara n’ìgwè mmadụ gbara Jizọs gburugburu.
- source_word: συνθλίβοντά
  choice: na-asụgide gị
  rationale: ‘Na-asụgide’ na-egosi na ìgwè mmadụ ahụ na-akwagide ma na-apịakọta Jizọs n’ahụ, n’emeghị ka ọ dị ike karịa ihe Grik kwuru.
- source_word: λέγεις
  choice: ị na-asị
  rationale: Ọ na-adaba nke ọma n’okwu ọnụ Igbo ma na-egosipụta okwu Jizọs ka ndị na-eso ụzọ ya na-atụ aka na ya.
- source_word: Τίς μου ἥψατο
  choice: Ònye metụrụ m aka?
  rationale: ‘Metụrụ m aka’ bụ ụzọ Igbo kacha doo anya isi kọwaa otu mmetụ ahụ e mere kpọmkwem.
