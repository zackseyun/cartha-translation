  text: καὶ κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ· Ταλιθα ⸀κουμ, ὅ ἐστιν μεθερμηνευόμενον· Τὸ κοράσιον, σοὶ λέγω, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: ig
  text: O wee jide nwa ahụ n’aka, sị ya, “Talita kum,”[a] nke pụtara mgbe a sụgharịrị ya, “Nwa agbọghọ nta, ana m asị gị, bilie.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ nsụgharị Bekee na-asụpe okwu Aramaik a “Talitha cum,” dịka nsụpe ọdịnala si dị. Ma ederede Grik ebe a nwere κουμ, nke na-akwado nsụpe “kum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς τοῦ παιδίου
  choice: jide nwa ahụ n’aka
  rationale: Nke a na-egosipụta omume ijide aka nwa ahụ n’ụzọ Igbo si ekwu ya nke ọma, na-enweghị itinye ike dị n’okwu dịka ‘jididesie ike.’
- source_word: λέγει αὐτῇ
  choice: sị ya
  rationale: ‘Sị ya’ bụ ụzọ Igbo dị ndụ ma dị mfe isi kọwaa okwu a gwara ya; usoro akụkọ Igbo na-anabata ya nke ọma n’agbanyeghị present akụkọ dị n’asụsụ Grik.
- source_word: Ταλιθα κουμ
  choice: Talita kum
  rationale: E debere okwu Aramaik ahụ dịka ụda ya si dị n’akwụkwọ Grik, ebe nkọwa Mak na-esochi ya ozugbo.
- source_word: μεθερμηνευόμενον
  choice: nke a sụgharịrị bụ
  rationale: Nke a na-egosipụta kpọmkwem na Mak na-enye ntụgharị okwu Aramaik ahụ.
- source_word: Τὸ κοράσιον
  choice: Nwa agbọghọ nta
  rationale: ‘Nwa agbọghọ’ na-egosi na ọ bụ nwanyị, ebe ‘nta’ na-echekwa mmetụta diminutiv nke κοράσιον.
- source_word: σοὶ λέγω
  choice: ana m asị gị
  rationale: E chekwara okwu ahụ niile, gụnyere nkwusiri ike dị n’‘gị,’ kama iwepụ ya dịka ihe e kwuru ugboro abụọ.
- source_word: ἔγειρε
  choice: bilie
  rationale: ‘Bilie’ bụ iwu Igbo doro anya ma kwekọọ n’iwu ka nwa ahụ si n’ọnọdụ ya kulie.
theological_decisions:
- issue: Idobe okwu Aramaik Jizọs kwuru n’ahịrịokwu ahụ
  choice: E debere ‘Talita kum’ ma tinye ntụgharị Mak ozugbo.
  alternative: Ịhapụ naanị ntụgharị ya, ‘Nwa agbọghọ nta, ana m asị gị, bilie,’ ma ọ bụ iji nsụpe ọdịnala ‘Talita kum/cum’ nke asụsụ ọzọ.
  rationale: Ihe odide Grik n’onwe ya chekwara okwu Semitik ahụ ma kọwaa ya. Idobe ha abụọ na-echekwa ọdịdị akụkọ ahụ ma na-eme ka ihe ọ pụtara doo anya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị nsọ ma dị mfe nghọta. A họọrọ ‘O wee…’ maka njikọ akụkọ καὶ, na ‘sị ya’ maka okwu akụkọ sitere n’ọnụ onye ahụ. Enweghị akara nkọwa ala peeji n’ihi na nkọwa English e nyere banyere nsụpe Aramaik anaghị akwado akara ya n’ebe ‘aka’ dị, ma ederede Igbo na-eji ‘kum’ nke kwekọrọ na κουμ.
