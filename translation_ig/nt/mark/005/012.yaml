source:
  edition: SBLGNT
  text: καὶ παρεκάλεσαν ⸀αὐτὸν λέγοντες· Πέμψον ἡμᾶς εἰς τοὺς χοίρους, ἵνα εἰς αὐτοὺς εἰσέλθωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: ig
  text: Ha rịọrọ ya arịrịọ, sị, “Ziga anyị n’ime ezi ndị ahụ[a], ka anyị wee banye n’ime ha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime anụ ezi ndị ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: rịọkwara ya arịrịọ
  rationale: N’ọnọdụ a, okwu ahụ na-egosi arịrịọ siri ike nke mmụọ ọjọọ na-arịọ Jizọs; ọ dị ike karịa nanị ‘jụọ’ ma bụrụkwa Igbo e ji eme ihe n’ụzọ ebumpụta ụwa.
- source_word: λέγοντες
  choice: sị
  rationale: ‘Sị’ na-ewebata kpọmkwem ihe ha kwuru n’ụzọ dị mkpirikpi ma dịkwa mma n’Igbo.
- source_word: Πέμψον ἡμᾶς
  choice: Ziga anyị
  rationale: Nke a na-edobe ihe πέμπω pụtara kpọmkwem, ya bụ ‘ziga,’ n’agbanyeghị na ọnọdụ ahụ na-egosikwa na ha na-arịọ ikike.
- source_word: εἰς τοὺς χοίρους
  choice: n’ime ezi ndị ahụ
  rationale: χοῖρος pụtara ezi; ‘ezi ndị ahụ’ bụ okwu Igbo doro anya ma na-egosipụta edemede njirimara nke Grik.
- source_word: ἵνα εἰς αὐτοὺς εἰσέλθωμεν
  choice: ka anyị wee banye n’ime ha
  rationale: ‘Ka anyị wee’ na-egosipụta ebumnuche nke ἵνα, ebe ‘banye n’ime ha’ na-edobe echiche nke ịbanye n’ime anụmanụ ndị ahụ.
theological_decisions:
- issue: Ụdị arịrịọ ndị na-ekwu okwu rịọrọ Jizọs
  choice: E gosipụtara ha dị ka ndị na-arịọ Jizọs arịrịọ ka o ziga ha n’ime ezi, si otú ahụ nọrọ n’okpuru ikike ya.
  alternative: Ịsụgharị ya dịka nanị arịrịọ ka ha kwaga ebe ọzọ, n’enweghị imesi ikike Jizọs ike.
  rationale: ‘Rịọkwara ya arịrịọ’ na ‘Ziga anyị’ na-agbaso okwu Grik ma na-echekwa otú akụkọ ahụ si gosi ikike Jizọs, n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji ‘rịọ arịrịọ’ gosipụta ike nke παρακαλέω, ma debe usoro na ihe okwu Grik pụtara n’enweghị mgbakwunye nkọwa.
