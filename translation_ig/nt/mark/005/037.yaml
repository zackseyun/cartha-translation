  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὐκ ἀφῆκεν οὐδένα ⸂μετ’ αὐτοῦ⸃ συνακολουθῆσαι εἰ μὴ ⸀τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: ig
  text: O kweghị ka onye ọ bụla soro ya gaa, ma e wezụga Pita, Jemis na Jọn, nwanne nwoke Jemis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: kweghị
  rationale: N'usoro a, ngwaa ahụ pụtara ikwe ka mmadụ mee ihe. “Kweghị ka” na-egosi n'ụzọ doro anya na Jizọs enyeghị ndị ọzọ ohere iso ya.
- source_word: οὐδένα
  choice: onye ọ bụla
  rationale: Mgbe e jikọtara ya na “kweghị,” okwu a na-egosi na ọ dịghị onye ọ bụla e kwere ka o soro.
- source_word: μετ’ αὐτοῦ
  choice: ya
  rationale: “Soro ya gaa” na-ejikọta echiche nke iso mmadụ na nke ije, ya mere ọ na-ebupụta ihe okwu Grik a na ngwaa ya pụtara n'Igbo dị ire ụtọ.
- source_word: συνακολουθῆσαι
  choice: soro ya gaa
  rationale: Ngwaa a pụtara iso mmadụ gaa ma ọ bụ iso ya na-aga. “Soro ya gaa” bụ okwu Igbo nkịtị, doro anya, ma dabara n'ọnọdụ a.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: N'ebe a, ọ na-ewebata ndị a hapụrụ n'iwu ahụ, ọ bụghị ọnọdụ; “ma e wezụga” na-egosi nke a nke ọma.
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Pita, Jemis na Jọn
  rationale: E dere aha ndị ahụ n'ụdị a na-ejikarị eme ihe n'Igbo. Ndepụta nwere rikoma na “na” bụ ụzọ Igbo dị ire ụtọ isi chịkọta aha atọ ahụ.
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: nwanne Jemis
  rationale: Nkebiokwu a na-akọwa Jọn a na-ekwu maka ya. “Nwanne Jemis” na-edobe nghọta bụ isi n'ebughị echiche ọzọ na-adịghị n'okwu Grik.
theological_decisions:
- issue: Ma ἀδελφός ga-akọwapụta nwoke n'ụzọ pụtara ìhè
  choice: nwanne Jemis
  alternative: nwanne nwoke Jemis
  rationale: Okwu Grik ἀδελφός bụ nwanne nwoke, ma n'Igbo “nwanne Jemis” bụ ụzọ ebumpụta ụwa isi mata mmekọrịta ahụ n'okwu a. Ịgbakwunye “nwoke” adịghị mkpa maka ịmata Jọn, ọ pụkwara ime ka ahịrịokwu ahụ dị arọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “soro ya gaa” mee ka echiche nke συνακολουθέω na μετ’ αὐτοῦ pụta n'ụzọ Igbo nkịtị, ebe a nọgidere na-edobe mkpụrụ okwu na usoro echiche nke isi mmalite.
