review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus' refusal to permit anyone to accompany him and correctly retains the exception for Peter, James, and John. However, the Greek ἀδελφός explicitly identifies John as James's male sibling; plain “nwanne Jemis” can denote a sibling of either sex in Igbo.
  naturalness: “O kweghị ka onye ọ bụla soro ya gaa, ma e wezụga …” is natural, clear Standard Igbo and fits the narrative register. Adding “nwoke” is idiomatic enough here and makes the identifying apposition precise.
  terminology: The renderings “Pita, Jemis na Jọn” and “soro ya gaa” are suitable. “Nwanne nwoke Jemis” preserves the male sense of ἀδελφός without introducing doctrinal interpretation.
  issues:
  - severity: low
    issue: The phrase “nwanne Jemis” does not explicitly mark John as James's brother.
    rationale: While the male identity is inferable from the name Jọn, ἀδελφός specifically means “brother” here. “Nwanne nwoke Jemis” preserves this source detail and avoids a potentially gender-neutral reading.
  revised_text: O kweghị ka onye ọ bụla soro ya gaa, ma e wezụga Pita, Jemis na Jọn, nwanne nwoke Jemis.
  revised_footnotes: []
  revision_rationale: A single lexical clarification changes “nwanne Jemis” to “nwanne nwoke Jemis” so that the Igbo explicitly reflects the Greek designation of John as James's brother. All other wording is retained because it is faithful and natural.
