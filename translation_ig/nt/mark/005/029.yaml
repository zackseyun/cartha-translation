id: MRK.5.29
reference: Mark 5:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: ig
  text: Ozugbo ahụ, ọbara ya kwụsịrị ịgba[a], ọ makwara n’ahụ ya na e si n’ọrịa ahụ na-enye ya ahụhụ gwọọ ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “isi iyi ọbara ya kpọrọ nkụ.” Okwu Grik ji ihe oyiyi doro anya nke isi iyi ma ọ bụ ebe mmiri si apụta.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “e si n’ịta ụtarị ahụ gwọọ ya” ma ọ bụ “e si n’ahụhụ ahụ gwọọ ya.” Okwu Grik pụtara ụtarị n’ụzọ nkịtị, ma n’ebe a ọ na-ezo aka n’ọrịa ya na-eweta oké ahụhụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Ozugbo ahụ
  rationale: Nke a na-egosi na ihe ahụ mere n’otu ntabi anya ma na-edobe ngwa ngwa a na-ahụkarị n’akụkọ Mak.
- source_word: ἐξηράνθη
  choice: kwụsịrị
  rationale: N’ọnọdụ a, okwu ahụ pụtara na ọbara ahụ kwụsịrị ịgbapụta. Nsụgharị a bụ Igbo doro anya ma dị ndụ; ihe oyiyi nkịtị nke ‘ịkpọ nkụ’ ka e debere n’ala peeji.
- source_word: πηγὴ τοῦ αἵματος αὐτῆς
  choice: ọbara ahụ na-agba ya
  rationale: πηγή pụtara isi iyi ma ọ bụ ebe ihe si apụta. N’ebe a ọ na-ekwu banyere ọbara na-agba nwanyị ahụ; okwu a na-aghọta ngwa ngwa n’Igbo ma e tinye ihe oyiyi ‘isi iyi’ n’ala peeji.
- source_word: ἔγνω τῷ σώματι
  choice: ọ makwara n’ahụ ya
  rationale: Nke a na-edobe ma nghọta nwanyị ahụ ghọtara ihe mere ma mmetụta ahụ ya ji mee ka ọ mara ya, kama ịsụgharị ya naanị dị ka ‘ọ chere.’
- source_word: ἴαται
  choice: a gwọọla ya
  rationale: Ụdị perfect Grik na-egosi ọgwụgwọ e mechara nke nsonaazụ ya ka dị; ‘a gwọọla ya’ na-egosipụta nke a nke ọma n’Igbo.
- source_word: ἀπὸ τῆς μάστιγος
  choice: n’ọrịa ahụ na-enye ya ahụhụ
  rationale: μάστιξ nwere ike ịpụta ụtarị, ma n’ebe a ọ bụ ihe atụ maka ọrịa siri ike na-eweta ahụhụ, ọ bụghị iti mmadụ ihe n’ezie.
theological_decisions:
- issue: Ụdị ọgwụgwọ ahụ
  choice: E gosiri ma nkwụsị ọbara ahụ n’ezie ma nghọta nwanyị ahụ ghọtara n’ahụ ya na a gwọọla ya.
  alternative: Ịsụgharị ya dị ka naanị mmetụta nwanyị ahụ chere n’ime onwe ya.
  rationale: Grik jikọtara ihe mere n’ahụ ya n’ezie na otú o si mata ya, n’etinyeghị nkọwa ọzọ banyere ụzọ ọgwụgwọ ahụ si rụọ ọrụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu nkịtị ‘ọbara ahụ na-agba ya kwụsịrị’ n’isi ederede, ebe e debere ihe oyiyi Grik nke ‘isi iyi’ n’ala peeji iji zere Igbo siri ike ma chekwaa nkọwa mbụ.
