revisions:
- from: Ozugbo ahụ, ọbara ahụ na-agba ya kwụsịrị[a], ọ makwara n’ahụ ya na a gwọọla ya n’ọrịa ahụ na-enye ya ahụhụ[b].
  to: Ozugbo ahụ, ọbara ya kwụsịrị ịgba[a], ọ makwara n’ahụ ya na e si n’ọrịa ahụ na-enye ya ahụhụ gwọọ ya[b].
  rationale: The revision improves Standard Igbo idiom for the stopping of bleeding and explicitly retains the Greek separative sense ('healed from') without changing the verse's meaning. The footnotes preserve the source's spring imagery and the lexical range of μάστιξ, with anchors retained at their corresponding expressions.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:39Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the immediacy, the cessation of the woman's bleeding, her bodily awareness, and her completed healing. However, the main rendering of ἀπὸ ('from') as n’ is less precise in this context and should be made explicit. The source's vivid πηγή ('spring/source') image may appropriately remain in a footnote when a natural idiom is used in the text.
  naturalness: '"Ọbara ya kwụsịrị ịgba" is a more idiomatic Standard Igbo expression than "ọbara ahụ na-agba ya kwụsịrị." "Ọ makwara n’ahụ ya" is natural and suitably preserves the embodied recognition in the Greek.'
  terminology: '"Ọrịa ahụ na-enye ya ahụhụ" appropriately communicates μάστιξ as a severe affliction without implying a literal whipping. "E si n’ọrịa ahụ ... gwọọ ya" clearly represents healing from that affliction.'
  issues:
  - severity: medium
    issue: The phrase "a gwọọla ya n’ọrịa ahụ" does not clearly express healing 'from' the affliction.
    rationale: ἀπὸ τῆς μάστιγος marks separation from the condition. Recasting with "e si ... gwọọ ya" supplies this relationship naturally in Standard Igbo.
  - severity: low
    issue: '"Ọbara ahụ na-agba ya kwụsịrị" is somewhat awkward word order.'
    rationale: '"Ọbara ya kwụsịrị ịgba" is clearer and more idiomatic while retaining the sense that the bleeding stopped.'
  - severity: low
    issue: Footnote b's proposed wording "n’ihe otiti ahụ" does not naturally express the Greek alternative 'from the scourge.'
    rationale: Using "e si n’ịta ụtarị ahụ gwọọ ya" makes the separative force clear; the note can then explain the contextual sense as severe affliction.
  revised_text: Ozugbo ahụ, ọbara ya kwụsịrị ịgba[a], ọ makwara n’ahụ ya na e si n’ọrịa ahụ na-enye ya ahụhụ gwọọ ya[b].
