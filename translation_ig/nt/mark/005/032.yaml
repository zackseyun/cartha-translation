  text: καὶ περιεβλέπετο ἰδεῖν τὴν τοῦτο ποιήσασαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/032.yaml
  text: And he kept looking around to see the one who had done this[a].
translation:
  language: ig
  text: Ma ọ nọ na-elegharị anya ka ọ hụ nwanyị ahụ mere ihe a[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a sụgharịrị “nwanyị ahụ mere ihe a” dị n’ụdị nke na-egosi kpọmkwem na ọ bụ nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ọ nọkwa
  rationale: Mgbakwunye “-kwa” na-ejigide njikọ akụkọ ahụ n’ụzọ Igbo na-asụkarị, n’etinyeghị echiche nke nkwubi okwu na-adịghị na Grik.
- source_word: περιεβλέπετο
  choice: na-elegharị anya
  rationale: Ụdị imperfect na-egosi omume gara n’ihu; “na-elegharị anya” na-egosi na ọ nọ na-enyocha ndị gbara ya gburugburu.
- source_word: ἰδεῖν
  choice: ịhụ
  rationale: Nke a na-egosi ebumnobi nke ilegharị anya, ma bụrụkwa nsụgharị kwụ ọtọ na nke nkịtị.
- source_word: τὴν ... ποιήσασαν
  choice: nwanyị ahụ mere
  rationale: Article na participle ndị a bụ feminine accusative, ya mere ha na-arụtụ aka kpọmkwem n’otu nwanyị; Igbo na-achọkarị ka e kwuo aha onye ahụ nke ọma.
- source_word: τοῦτο
  choice: ihe a
  rationale: Nke a na-arụtụ aka n’ihe e mere nke a kọwara ozugbo tupu amaokwu a; “ihe a” bụ okwu Igbo doro anya ma dị mfe.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ọ nọkwa na-elegharị anya” na-egosipụta omume na-aga n’ihu nke imperfect Grik, ebe “nwanyị ahụ” na-eme ka feminine participle doo anya n’Igbo.
