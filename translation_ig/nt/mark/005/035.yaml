- from: Mgbe ọ ka na-ekwu okwu, ndị mmadụ si n’ụlọ onyeisi ụlọ nzukọ ndị Juu[a] bịa kwuo, sị, “Nwa gị nwanyị anwụọla. Gịnị mere i ji ka enye Onye Ozizi nsogbu[b]?”
  to: Mgbe ọ ka na-ekwu okwu, ndị mmadụ si n’ụlọ onyeisi ụlọ nzukọ ndị Juu[a] bịa kwuo, sị, “Nwa gị nwanyị anwụọla. Gịnị mere i ji ka na-enye Onye Ozizi nsogbu[b]?”
