    reason: lexical_alternative
  revision_rationale: The revision corrects the incomplete progressive construction in the question and rewrites footnote a so that it accurately distinguishes the Greek wording from the contextually warranted reference to the synagogue leader’s household. No theological or interpretive expansion has been introduced.
