id: MRK.5.35
reference: Mark 5:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχονται ἀπὸ τοῦ ἀρχισυναγώγου λέγοντες ὅτι Ἡ θυγάτηρ σου ἀπέθανεν· τί ἔτι σκύλλεις τὸν διδάσκαλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: ig
  text: Mgbe ọ ka na-ekwu okwu, ndị mmadụ si n’ụlọ onyeisi ụlọ nzukọ ndị Juu[a] bịa kwuo, sị, “Nwa gị nwanyị anwụọla. Gịnị mere i ji ka na-enye Onye Ozizi nsogbu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ sịrị naanị, “site n’aka onyeisi ụlọ nzukọ”; n’ọnọdụ akụkọ a, ọ na-atụ aka n’ụlọ ya ma ọ bụ n’ezinụlọ ya.
    reason: contextual_expansion
  - marker: b
    text: A pụkwara ịsụgharị ya “na-enye Onye Ozizi nsogbu ọzọ” ma ọ bụ “na-akpagbu Onye Ozizi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Mgbe ọ ka na-ekwu okwu
  rationale: Nkebiokwu a na-egosi na ihe abụọ ahụ mere n’otu oge; “ka na-” na-echekwa echiche ἔτι, ya bụ, na ọ ka nọ n’ikwu okwu.
- source_word: ἔρχονται
  choice: bịa
  rationale: Ọ bụ okwu ugbu a e ji akọ akụkọ n’asụsụ Grik, ma Igbo na-akọ ihe gara aga n’ụzọ ebumpụta ụwa site n’iji “bịa” n’usoro akụkọ a.
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: si n’ụlọ onyeisi ụlọ nzukọ ndị Juu
  rationale: N’ọnọdụ akụkọ a, ndị bịara bụ ndị si n’ebe obibi onyeisi ụlọ nzukọ ahụ, ebe onyeisi ahụ n’onwe ya nọnyere Jizọs. Agbakwunyere “ụlọ” iji mee ka ihe okwu Grik ahụ pụtara n’ọnọdụ a doo anya, ma e depụtara nsụgharị nkịtị na nkọwa ala peeji.
- source_word: λέγοντες ὅτι
  choice: kwuo, sị
  rationale: Nke a bụ ụzọ Igbo si webata okwu mmadụ kwuru kpọmkwem n’ụzọ dị mfe ma dị mma.
- source_word: Ἡ θυγάτηρ σου
  choice: Nwa gị nwanyị
  rationale: Nke a na-enye kpọmkwem ihe okwu Grik pụtara ma na-eme ka o doo anya na ọ bụ nwa nwanyị.
- source_word: ἀπέθανεν
  choice: anwụọla
  rationale: Ụdị “-la” na-egosi ihe mezuru emezu nke nsonaazụ ya ka dị ugbu a, dịka akụkọ ọnwụ a si metụta ọnọdụ ahụ ozugbo.
- source_word: τί ἔτι
  choice: Gịnị mere i ji ka
  rationale: Ajụjụ a na-ajụ ihe mere a ga-eji nọgide na-eme ihe ahụ; “ka” na-echekwa echiche nke “ọzọkwa” ma ọ bụ “ruo ugbu a.”
- source_word: σκύλλεις
  choice: enye ... nsogbu
  rationale: N’ebe a, okwu ahụ pụtara inye mmadụ nsogbu ma ọ bụ ịkpagbu ya site n’ịchọ ihe n’aka ya; “enye nsogbu” bụ okwu Igbo doro anya nke na-adịghị ike gabiga ókè.
- source_word: τὸν διδάσκαλον
  choice: Onye Ozizi
  rationale: A sụgharịrị aha ọrụ ahụ kpọmkwem, kama iji aha Jizọs dochie ya; nke a na-echekwa otú ndị ozi ahụ si kpọọ ya.
theological_decisions:
- issue: Aha e ji kpọọ Jizọs, τὸν διδάσκαλον
  choice: Onye Ozizi
  alternative: Jizọs; Nna Ukwu
  rationale: Okwu Grik ji aha ọrụ “Onye Ozizi,” ọ bụghị aha Jizọs ma ọ bụ aha na-egosi ikike karịrị ihe e kwuru. Nsụgharị ahụ na-echekwa echiche ndị na-ekwu okwu.
- issue: Ebe ndị ozi ahụ si bịa
  choice: si n’ụlọ onyeisi ụlọ nzukọ ndị Juu
  alternative: si n’aka onyeisi ụlọ nzukọ ndị Juu
  rationale: Onyeisi ụlọ nzukọ ahụ nọnyere Jizọs n’akụkọ a, ya mere okwu ahụ na-arụtụ aka n’ezinụlọ ma ọ bụ n’ụlọ ya. A kọwara ihe a n’enweghị ịgbanwe onye ọ bụ ma ọ bụ ọrụ ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dịkwa mfe nghọta. “Ụlọ nzukọ ndị Juu” na-akọwa synagogue n’ụzọ ndị na-agụ akwụkwọ nkịtị ga-aghọta; “Onye Ozizi” na-echekwa aha ọrụ dị na Grik. Usoro “kwuo, sị” bụ usoro akụkọ Igbo ebumpụta ụwa.
