  source_fidelity: 'The draft accurately conveys both clauses: the emphatic directive that nobody come to know the event, and the instruction that food be given to the girl. The passive sense of δοθῆναι is retained in “ka e nye ...” and the supplied “ihe” is a necessary, idiomatic Igbo completion of the sense.'
  naturalness: The main text is clear Standard Igbo. “siri nnọọ ike” more naturally and fully conveys the intensifying force of πολλὰ than “siri ike.” In the second clause, identifying the girl removes a gender ambiguity that Igbo pronouns cannot express and is fully warranted by the immediate context.
  terminology: “Nye ... iwu” is appropriate for διεστείλατο, without importing a theological explanation. The footnotes are revised to give idiomatic and accurate explanations; in particular, the former purported literal Igbo wording in note b was not grammatical.
  issues:
