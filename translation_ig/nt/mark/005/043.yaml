    issue: The intensifier πολλὰ is somewhat underrepresented by “iwu siri ike.”
    rationale: The command is not merely strict; πολλὰ intensifies διεστείλατο. “iwu siri nnọọ ike” preserves this force naturally.
  - severity: medium
    issue: Footnote b presents “ka e nye ya iri” as literal Igbo.
    rationale: That phrase is not a grammatical or natural Igbo representation of the Greek infinitival construction. The note should explain the Greek wording rather than quote malformed Igbo.
  - severity: low
    issue: The pronoun “ya” in the final clause does not show the feminine referent.
    rationale: Igbo pronouns do not mark gender, but “nwatakịrị nwanyị ahụ” makes the source referent clear without adding information beyond the immediate narrative context.
