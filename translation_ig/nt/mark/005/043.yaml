base_translation:
  language: en
  yaml_path: translation/nt/mark/005/043.yaml
  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: ig
  text: O wee nye ha iwu siri nnọọ ike ka onye ọ bụla ghara ịma ihe a,[a] o kwukwara ka e nye nwatakịrị nwanyị ahụ ihe ọ ga-eri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “O dọrọ ha aka ná ntị nke ukwuu ka onye ọ bụla ghara ịma ihe a.” Okwu Grik a sụgharịrị “siri nnọọ ike” pụtara n’ụzọ nkịtị “ọtụtụ” ma ọ bụ “nke ukwuu,” ma n’ebe a ọ na-eme ka ike iwu ahụ pụta ìhè.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, okwu Grik ahụ bụ, “ka e nye ya ka o rie.” N’Igbo, “ka e nye nwatakịrị nwanyị ahụ ihe ọ ga-eri” na-egosipụta nke a n’ụzọ dị mfe ma doo anya.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο αὐτοῖς πολλὰ
  choice: nye ha iwu siri ike
  rationale: Nkebi okwu Grik a na-egosi na o nyere ha iwu siri ike. πολλὰ na-eme ka ike iwu ahụ pụta ìhè; nsụgharị a bụ Igbo dị ugbu a ma na-edobe ike okwu ahụ.
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: ka onye ọ bụla ghara ịma ihe a
  rationale: 'Nke a na-edobe ebumnuche iwu ahụ: ka ihe ahụ ghara ịbanye n’amamihe onye ọ bụla. Ọ naghị atụkwasị nkọwa gbasara ihe mere Jizọs ji nye iwu ahụ.'
- source_word: εἶπεν
  choice: o kwukwara
  rationale: ‘Kwuru’ na-anọchi anya εἶπεν n’ụzọ kwụ ọtọ; ọnọdụ okwu ahụ na-egosi na ihe o kwuru bụ ntụziaka.
- source_word: δοθῆναι αὐτῇ φαγεῖν
  choice: ka e nye ya ihe ọ ga-eri
  rationale: A na-edobe olu nnara nke δοθῆναι site na ‘ka e nye ya,’ ebe ‘ihe ọ ga-eri’ na-eme ka akpaala okwu ahụ daa nke ọma n’Igbo n’agbanyeghị na Grik ekwughị kpọmkwem okwu pụtara ‘ihe.’
theological_decisions:
- issue: Iwu ka ihe ahụ ghara ịba n’amamihe ndị ọzọ
  choice: E gosiri ya naanị dịka iwu siri ike ka onye ọ bụla ghara ịma ihe a.
  alternative: Ịkọwa ya dịka akụkụ nke isiokwu sara mbara banyere izochi onye Mesaịa, ma ọ bụ ịkọwa na iwu ahụ metụtara naanị ezinụlọ na ndị akaebe nọ ebe ahụ.
  rationale: Amaokwu ahụ n’onwe ya anaghị enye ihe kpatara iwu ahụ ma ọ bụ kọwaa oke ndị ọ metụtara. Nsụgharị ahụ na-edobe mgbagwoju anya na esemokwu nkà mmụta okpukpe dị na ya.
translation_notes:
  register: E ji Standard Igbo dị mfe, dị ùgwù, ma kwekọọ n’ọgụgụ Bible. ‘Nye ha iwu siri ike’ na-egosipụta ike nke iwu ahụ n’enweghị okwu ochie ma ọ bụ nkọwa agbakwunyere. N’ihi na nnọchiaha Igbo anaghị egosi okike, ‘ya’ dabere n’ebe akụkọ ahụ ruru iji zoo aka nwatakịrị nwanyị ahụ.
