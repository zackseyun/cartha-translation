  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸂ἐξελθόντος αὐτοῦ⸃ ἐκ τοῦ πλοίου ⸂εὐθὺς ὑπήντησεν⸃ αὐτῷ ἐκ τῶν μνημείων ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/002.yaml
  text: And when he got out of the boat[a], immediately a man with an unclean spirit came out from the tombs to meet him,
translation:
  language: ig
  text: Mgbe o si n’ụgbọ mmiri ahụ pụta, ozugbo otu nwoke nwere mmụọ na-adịghị ọcha si n’ili ndị ahụ bịa zute ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ
  choice: Mgbe o ... pụta
  rationale: Nkebiokwu oge a na-asụgharị genitive absolute nke nwere aorist participle n’ụzọ Igbo dị eke, na-egosighị n’ụzọ siri ike ma ihe nke ọzọ mere mgbe ọ ka na-apụta ma ọ bụ ozugbo ọ pụtachara.
- source_word: πλοίου
  choice: ụgbọ mmiri ahụ
  rationale: N’ọnọdụ njem n’Oké Osimiri Galili, ‘ụgbọ mmiri’ bụ okwu Igbo doro anya ma kwekọọ na πλοῖον.
- source_word: εὐθὺς
  choice: ozugbo
  rationale: ‘Ozugbo’ na-echekwa ọsọ na ike nke okwu akụkọ Mak na-ejikarị eme ihe.
- source_word: ὑπήντησεν αὐτῷ
  choice: bịa zute ya
  rationale: Nke a na-egosipụta mmegharị nwoke ahụ n’ebe Jizọs nọ na nzute ahụ n’asụsụ Igbo dị eke.
- source_word: ἐκ τῶν μνημείων
  choice: si n’ili ndị ahụ
  rationale: ‘Ili’ bụ okwu Igbo nkịtị na nke ziri ezi maka ebe e liri mmadụ; ọtụtụ dị na Grik ka echekwara.
- source_word: ἄνθρωπος
  choice: otu nwoke
  rationale: Ọnọdụ okwu ahụ na-ezo aka n’otu nwoke kpọmkwem, ya mere ‘otu nwoke’ doro anya ma kwekọọ na akụkọ ahụ.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: nke mmụọ na-adịghị ọcha nọ n’ime ya
  rationale: Nke a na-edobe njikọ nwoke ahụ na mmụọ ahụ nke ἐν na-egosi, ma zere okwu nkọwa siri ike dịka ‘mmụọ ji ya’ nke nwere ike imechi nghọta okwu Grik ahụ.
theological_decisions:
- issue: Otu e si kọwaa ọnọdụ nwoke ahụ n’ebe mmụọ na-adịghị ọcha nọ
  choice: nke mmụọ na-adịghị ọcha nọ n’ime ya
  alternative: onye mmụọ na-adịghị ọcha ji
  rationale: Nhọrọ a na-anọ nso na ἐν πνεύματι ἀκαθάρτῳ ma na-echekwa obosara na esemokwu nke okwu ahụ, n’etinyeghị ozizi zuru ezu banyere njide mmụọ n’amaokwu a.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. A haziri usoro ahịrịokwu ka ọ bụrụ nke akụkọ Igbo dị eke, ebe a na-echekwa ‘ozugbo’ dịka akara ọsọ akụkọ Mak.
