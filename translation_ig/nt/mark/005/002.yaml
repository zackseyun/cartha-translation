  to: Mgbe o si n’ụgbọ mmiri ahụ pụta, ozugbo otu nwoke nwere mmụọ na-adịghị ọcha si n’ili ndị ahụ bịa zute ya.
  rationale: The revision replaces an awkward relative clause with idiomatic Standard Igbo while preserving the source’s ambiguity and avoiding a more interpretive expression of demonic possession. The temporal sequence, immediate action, tomb setting, and encounter remain unchanged.
