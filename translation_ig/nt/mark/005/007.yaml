  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ κράξας φωνῇ μεγάλῃ ⸀λέγει· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; ὁρκίζω σε τὸν θεόν, μή με βασανίσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: ig
  text: O tiri mkpu n’oké olu, sị, “Gịnị ka mụ na gị nwekọrọ,[a] Jizọs, Nwa Chineke Onye Kasị Elu? Ana m eji Chineke aṅụ gị iyi,[b] atala m ahụhụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Gịnị dị n’etiti mụ na gị?” Ọ bụ akpaalaokwu na-egosi ịjụ mmekọrịta, esemokwu, ma ọ bụ ịchọ ka onye nke ọzọ ghara itinye aka.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ana m arịọ gị arịrịọ siri ike n’aha Chineke,” ma ọ bụ, “Ana m eme ka ị nọrọ n’okpuru iyi n’ihu Chineke.” Okwu Grik ahụ na-egosi arịrịọ ma ọ bụ iwu siri ike e ji iyi kwado.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας φωνῇ μεγάλῃ
  choice: O tiri mkpu n’oké olu
  rationale: Nke a na-egosi ma mkpu siri ike nke κράζω ma nkwuwa okwu φωνῇ μεγάλῃ, n’Igbo doro anya ma dịkwa ndụ.
- source_word: λέγει
  choice: sị
  rationale: Ọ bụ ụzọ Igbo si ejikọta mkpu ahụ na okwu e kwuru n’ụzọ ebumpụta ụwa; ọ naghị eme ka akụkọ ahụ sie ike n’ihi present tense akụkọ nke Grik.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Gịnị ka mụ na gị nwekọrọ
  rationale: Akpaalaokwu a na-egosi ịjụ mmekọrịta, esemokwu, ma ọ bụ ịchọ ka onye nke ọzọ ghara itinye aka. Nsụgharị a dị nkenke ma na-edobe ike ajụjụ ahụ.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Nwa Chineke Onye Kasị Elu
  rationale: Ọ na-edobe aha Jizọs dịka Nwa Chineke na aha nsọpụrụ Chineke dịka Onye Kasị Elu n’enweghị mgbakwunye nkọwa ozizi.
- source_word: ὁρκίζω σε τὸν θεόν
  choice: Ana m eji Chineke aṅụ gị iyi
  rationale: Nke a na-edobe echiche nke ịrịọ ma ọ bụ ịnye iwu siri ike nke e ji iyi kwado, tinyere ọnọdụ dị ịtụnanya nke mmụọ ọjọọ ji Chineke rịọ Jizọs.
- source_word: μή με βασανίσῃς
  choice: atala m ahụhụ
  rationale: Ọ na-egosi nhụjuanya siri ike nke βασανίζω n’Igbo dị mfe ma ghara ịkọwa kpọmkwem ụdị ahụhụ ahụ.
theological_decisions:
- issue: Nkwupụta mmụọ ọjọọ banyere onye Jizọs bụ
  choice: Nwa Chineke Onye Kasị Elu
  alternative: Nwa nke Chineke Kachasị Elu
  rationale: Nhọrọ a na-edobe nkwupụta Kraịst dị n’amaokwu ahụ kpọmkwem, n’enweghị iweda ya ala ma ọ bụ itinye usoro ozizi e mesịrị.
- issue: Ike okwu ὁρκίζω mgbe mmụọ ọjọọ na-arịọ Jizọs
  choice: Ana m eji Chineke aṅụ gị iyi
  alternative: Ana m arịọ gị arịrịọ siri ike n’aha Chineke
  rationale: Isi okwu ahụ nwere ike ịpụta ime ka onye ọzọ nọrọ n’okpuru iyi ma ọ bụ ịrịọ ya arịrịọ siri ike. Nhọrọ bụ isi na-edobe ọdịdị iyi ahụ na esemokwu dị n’okwu ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Tiri mkpu n’oké olu” na-eme ka ihe ahụ dị ndụ; “Gịnị ka mụ na gị nwekọrọ” na-eburu akpaalaokwu Grik n’ụzọ Igbo ebumpụta ụwa. Akara nkọwa [a] na [b] dị n’ederede isi n’ebe okwu ha na-akọwa dị.
