  verdict: approve
  source_fidelity: Ihe odide ahụ na-atụgharị akụkụ aorist participle κράξας na φωνῇ μεγάλῃ nke ọma site na “O tiri mkpu n’oké olu,” ma na-edobe ajụjụ akpaalaokwu Τί ἐμοὶ καὶ σοί n’enweghị ịgbakwunye nkọwa na ederede isi. “Nwa Chineke Onye Kasị Elu” na-anọchi υἱὲ τοῦ θεοῦ τοῦ ὑψίστου n’ụzọ ziri ezi, ebe “Ana m eji Chineke aṅụ gị iyi” na-edobe ike ὁρκίζω na ntụaka ya kpọmkwem n’ebe Chineke nọ. “Atala m ahụhụ” na-ewepụta μή με βασανίσῃς n’ike kwesịrị ekwesị.
  naturalness: Igbo ahụ bụ Igbo Izugbe doro anya, nwee ụda kwesịrị ekwesị maka akụkọ na okwu kpọmkwem. “Gịnị ka mụ na gị nwekọrọ?” bụ ụzọ ebumpụta ụwa, dị mkpirikpi, nke na-egosi nkewapụ na mkpesa dị na akpaalaokwu Grik ahụ. “Aṅụ gị iyi” bụ okwu Igbo e guzobere nke dabara n’ọnọdụ a.
  terminology: Aha “Jizọs” na utu aha “Nwa Chineke Onye Kasị Elu” kwesịrị ekwesị. A sụgharịghị okwu mmụọ ọjọọ ahụ ka ọ bụrụ ozizi ma ọ bụ arịrịọ dị mfe karịa ka Grik si kwuo; iyi ahụ na nhụjuanya ahụ ka na-adị ike. Akara nkọwa [a] na [b] dị kpọmkwem n’ebe ha metụtara.
