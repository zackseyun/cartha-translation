    text: Ma ọ bụ, “na-atụ egwu ma na-ama jijiji.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dara n’ihu ya,” ma ọ bụ “kpọdatara onwe ya n’ihu ya.”
    reason: lexical_alternative
  revision_rationale: The revision more closely reflects the Greek participial description of the woman’s fear and trembling, preserves the noncommittal circumstantial force of “knowing,” and refines the posture alternative so that it continues to express falling before Jesus rather than merely bowing.
