revisions:
- from: Ma egwu jidere nwanyị ahụ, ahụ ana-amakwa ya[a]. Ebe ọ maara ihe mere ya, ọ bịara daa n’ala n’ihu Jizọs[b], kọọrọ ya eziokwu ahụ niile.
  to: Ma nwanyị ahụ, n’egwu na n’ịma jijiji[a], n’ịmara ihe mere ya, bịara daa n’ala n’ihu Jizọs[b], kọọrọ ya eziokwu niile.
  rationale: The revision more closely reflects the Greek participial description of the woman’s fear and trembling, preserves the noncommittal circumstantial force of “knowing,” and refines the posture alternative so that it continues to express falling before Jesus rather than merely bowing.
  reviewer_model: gpt-5.6-terra
