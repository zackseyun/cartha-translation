id: MRK.5.33
reference: Mark 5:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: ig
  text: Ma nwanyị ahụ, n’egwu na n’ịma jijiji[a], n’ịmara ihe mere ya, bịara daa n’ala n’ihu Jizọs[b], kọọrọ ya eziokwu niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-atụ egwu ma na-ama jijiji.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dara n’ihu ya,” ma ọ bụ “kpọdatara onwe ya n’ihu ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi ntakịrị ọdịiche ma na-akwalite akụkọ ahụ n’ihu, n’etinyeghị njikọ siri ike karịa nke Grik.
- source_word: ἡ γυνὴ
  choice: nwanyị ahụ
  rationale: Na-ezo aka kpọmkwem n’ebe nwanyị ahụ e kwuburu okwu banyere ya nọ.
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: egwu jidere nwanyị ahụ, ahụ ana-amakwa ya
  rationale: 'Na-egosipụta ọnọdụ mmetụta uche abụọ ahụ n’Igbo dị ndụ ma doo anya: ụjọ na ịma jijiji.'
- source_word: εἰδυῖα
  choice: Ebe ọ maara
  rationale: Na-edobe mmekọrịta nke participle ahụ n’enweghị ikwu hoo haa na ọ bụ ihe kpatara omume ya, ọ bụ ezie na nke ahụ nwere ike ịdị n’uche.
- source_word: ὃ γέγονεν αὐτῇ
  choice: ihe mere ya
  rationale: Ọ bụ ụzọ Igbo nkịtị na-anọpụ iche isi kwuo ahụmahụ ahụ dakwasịrị ya, ya bụ ọgwụgwọ ahụ.
- source_word: ἦλθεν
  choice: ọ bịara
  rationale: Na-edobe ngwaa akụkọ ahụ n’ụzọ dị mfe, n’etinyeghị nkọwa ọzọ.
- source_word: προσέπεσεν αὐτῷ
  choice: daa n’ala n’ihu Jizọs
  rationale: Na-egosi omume ịda n’ihu ya n’enweghị ikwubiga kpọmkwem ụdị ọnọdụ ahụ ya ma ọ bụ ịkọwa ya dịka ofufe.
- source_word: εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν
  choice: kọọrọ ya eziokwu ahụ niile
  rationale: Ọ bụ Igbo e ji ekwu na ọ gwara ya ihe niile n’ezochighị ihe ọ bụla, ma na-edobe ike nke πᾶσαν.
theological_decisions:
- issue: Ọnọdụ nwanyị ahụ n’ihu Jizọs na προσέπεσεν αὐτῷ
  choice: daa n’ala n’ihu Jizọs
  alternative: kpọọ isiala n’ihu ya
  rationale: Ngwaa ahụ nwere ike ịpụta ịda n’ihu mmadụ n’ihi nsọpụrụ, ụjọ, ma ọ bụ arịrịọ. Nhọrọ a na-edobe omume ahụ n’enweghị ikwubi na amaokwu ahụ kpọrọ ya ofufe.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri aha “Jizọs” dochie nnọchiaha n’ebe ahụ iji mee ka onye “ya” na-ezo aka na ya doo anya n’Igbo; e tinyekweghị echiche okpukpe karịa ihe Grik kwuru.
