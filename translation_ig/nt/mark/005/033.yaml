review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the sequence and all principal elements of the Greek: the woman''s fear and trembling, her knowledge of what had happened to her, her coming and falling before Jesus, and her full disclosure. However, “egwu jidere ... ahụ ana-amakwa ya” is somewhat more idiomatic as an experience overtaking her and can be less precise than the Greek paired participles. A direct rendering better preserves both emotional states without adding intensity.'
  naturalness: The revision uses natural Standard Igbo while retaining a dignified biblical register. “N’egwu na n’ịma jijiji” clearly and idiomatically expresses the paired Greek terms, and “n’ịmara ihe mere ya” retains the participial relationship without explicitly making it causal.
  terminology: “Jizọs,” “daa n’ala n’ihu,” and “eziokwu niile” are suitable and theologically noncommittal. The wording for falling before Jesus describes the posture without construing it as an explicit act of worship.
  issues:
  - severity: low
    issue: The expression “egwu jidere nwanyị ahụ, ahụ ana-amakwa ya” is less direct than the Greek paired participles.
    rationale: It can naturally suggest that fear seized her and that her body shook, but “n’egwu na n’ịma jijiji” more transparently represents “fearing and trembling” and reads more smoothly in this narrative context.
  - severity: low
    issue: The footnote for the posture offers “kpọọ isiala n’ihu ya.”
    rationale: This can mean bowing or paying respect, but it does not as clearly retain the falling/prostration sense of προσέπεσεν. A closer alternative is preferable.
  revised_text: Ma nwanyị ahụ, n’egwu na n’ịma jijiji[a], n’ịmara ihe mere ya, bịara daa n’ala n’ihu Jizọs[b], kọọrọ ya eziokwu niile.
  revised_footnotes:
