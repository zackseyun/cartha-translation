  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: ig
  text: Mgbe ọ banyere, ọ sịrị ha, “Gịnị mere unu ji na-eme oké mkpọtụ ma na-akwa ákwá? Nwatakịrị ahụ anwụghị, kama ọ na-ehi ụra.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Nwatakịrị ahụ anwụbeghị, kama ọ na-ehi ụra.” Okwu Jizọs nwere ike iji ụra mee ihe atụ maka ọnwụ n’ìhè nke ịkpọlite nwatakịrị ahụ n’ọnwụ nke na-abịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: Mgbe ọ banyere
  rationale: Aorist participle na-egosi omume nke mere tupu isi ngwaa; nkebi a na-asụ Igbo nke ọma ma ghara ime ka njikọ ahụ sie ike karịa ihe Grik kwuru.
- source_word: λέγει
  choice: ọ sịrị
  rationale: Ọ bụ historical present n’asụsụ Grik. N’akụkọ Igbo, oge gara aga bụ ụzọ kacha pụta ihe ma dịkwa n’ụdị asụsụ nkịtị; ọ naghị agbanwe ihe omume ahụ.
- source_word: Τί
  choice: Gịnị mere
  rationale: N’ajụjụ a, Τί pụtara ‘n’ihi gịnị’; ‘Gịnị mere’ na-ebute mba na ajụjụ ahụ n’Igbo nkịtị.
- source_word: θορυβεῖσθε
  choice: unu ji eme oké mkpọtụ
  rationale: Ọ na-egosi ọgba aghara na ụzụ a na-anụ; okwu a dabara n’ọnọdụ ndị na-eru uju.
- source_word: κλαίετε
  choice: na-akwa ákwá
  rationale: Nke a bụ okwu Igbo doro anya ma dị ùgwù maka ibe ákwá, n’enweghị ịkọwapụta ya dị ka akwa arịrị nke emume.
- source_word: παιδίον
  choice: Nwatakịrị ahụ
  rationale: παιδίον bụ okwu izugbe maka nwatakịrị. Ọ bụ ezie na gburugburu amaokwu ahụ gosiri na ọ bụ nwa agbọghọ, a hapụrụ okwu amaokwu a ka ọ bụrụ izugbe.
- source_word: οὐκ ἀπέθανεν
  choice: anwụghị
  rationale: Aorist ἀπέθανεν na-ekwu banyere ọnwụ dị ka ihe mere; ‘anwụghị’ na-esochi ụdị ngwaa ahụ kama ịgbanwe ya ka ọ bụrụ naanị ọnọdụ ‘ọ nwụrụ anwụ.’
- source_word: καθεύδει
  choice: ọ na-ehi ụra
  rationale: Present verb a pụtara ihi ụra. Nsụgharị a na-echekwa ihe oyiyi ụra ahụ n’enweghị ịkọwa ya pụọ.
theological_decisions:
- issue: Ma okwu Jizọs ọ bụ ịgọnahụ ọnwụ n’ụzọ nkịtị, ka ọ bụ iji ụra mee ihe atụ maka ọnwụ n’ihi mbilite nke na-abịa
  choice: E debere ya n’isi ederede dịka ‘anwụghị, kama ọ na-ehi ụra.’
  alternative: ‘Nwatakịrị ahụ anwụghị anwụ ruo mgbe ebighị ebi; ọ bụ naanị na ọ na-ehi ụra,’ ma ọ bụ ịkọwa na Jizọs kwuru otú a n’ihi na ọ ga-akpọlite ya.
  rationale: Grik hapụrụ okwu ahụ n’ụdị siri ike ma nwee nghọta karịrị otu. Nsụgharị ahụ anaghị edozi esemokwu nkà mmụta okpukpe ahụ n’ime isi ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘ọ sịrị’ mee ka akụkọ ahụ daa nke ọma n’Igbo, ọ bụ ezie na Grik ji historical present. Akara ụda dị na ‘ákwá’ na-enyere aka ịmata okwu ahụ nke ọma.
