review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the participial entry, the rebuking question, the noisy mourning, and the stark contrast between death and sleep. “Anwụghị, kama ọ na-ehi ụra” appropriately preserves the Greek's unqualified and potentially metaphorical wording.
  naturalness: The coordination in “unu ji eme oké mkpọtụ na-akwa ákwá” is understandable, but “unu ji na-eme oké mkpọtụ ma na-akwa ákwá” is more idiomatic and clearly coordinates the two ongoing actions. The footnote’s “A pụkwara ịsụ ya” is not natural for a translation alternative.
  terminology: “Nwatakịrị,” “akwa ákwá,” and “ehi ụra” are suitable Standard Igbo choices. The footnote should use “ịsụgharị” for a translation alternative and retain “ọnwụ” and “ịkpọlite ... n’ọnwụ” where explanation is needed.
  issues:
  - severity: low
    issue: The two present actions in the question are not explicitly coordinated.
    rationale: Adding “na-eme” and “ma” makes it clear that Jesus asks about both making a commotion and weeping, while retaining the Greek present-action force.
  - severity: medium
    issue: The footnote uses an unnatural verb for presenting an alternative rendering and its quoted alternative is effectively identical to the main text.
    rationale: “A pụkwara ịsụ ya” should be replaced with a clear translation formula. “Anwụbeghị” provides a genuine, source-permissible alternative corresponding to “has not died,” without resolving the metaphorical force.
  revised_text: Mgbe ọ banyere, ọ sịrị ha, “Gịnị mere unu ji na-eme oké mkpọtụ ma na-akwa ákwá? Nwatakịrị ahụ anwụghị, kama ọ na-ehi ụra.”[a]
  revised_footnotes:
