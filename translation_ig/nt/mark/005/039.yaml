revisions:
- from: Mgbe ọ banyere, ọ sịrị ha, “Gịnị mere unu ji eme oké mkpọtụ na-akwa ákwá? Nwatakịrị ahụ anwụghị, kama ọ na-ehi ụra.”[a]
  to: Mgbe ọ banyere, ọ sịrị ha, “Gịnị mere unu ji na-eme oké mkpọtụ ma na-akwa ákwá? Nwatakịrị ahụ anwụghị, kama ọ na-ehi ụra.”[a]
  rationale: 'The revision improves Standard Igbo coordination in Jesus’ question and repairs the footnote’s wording and usefulness. It preserves the source text’s ambiguity: the main text neither explains away death nor states a doctrinal interpretation of the sleep metaphor.'
  reviewer_model: gpt-5.6-terra
