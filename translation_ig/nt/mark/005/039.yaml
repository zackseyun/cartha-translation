    text: A pụkwara ịsụgharị ya, “Nwatakịrị ahụ anwụbeghị, kama ọ na-ehi ụra.” Okwu Jizọs nwere ike iji ụra mee ihe atụ maka ọnwụ n’ìhè nke ịkpọlite nwatakịrị ahụ n’ọnwụ nke na-abịa.
    reason: lexical_alternative
  revision_rationale: 'The revision improves Standard Igbo coordination in Jesus’ question and repairs the footnote’s wording and usefulness. It preserves the source text’s ambiguity: the main text neither explains away death nor states a doctrinal interpretation of the sleep metaphor.'
