  text: καὶ ⸀ἔρχονται εἰς τὸν οἶκον τοῦ ἀρχισυναγώγου, καὶ θεωρεῖ θόρυβον ⸀καὶ κλαίοντας καὶ ἀλαλάζοντας πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/038.yaml
  text: And they come to the house of the synagogue leader[a], and he sees a commotion, and people weeping and wailing loudly.
translation:
  language: ig
  text: Ha bịara n’ụlọ onyeisi ụlọ nzukọ, Jizọs wee hụ ọgba aghara[a], na ndị na-akwa ákwá na ndị na-eti mkpu nke ukwuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oke ụzụ”; okwu Grik a nwere ike ịpụta mkpọtụ na ọgba aghara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: Ha abịakwa
  rationale: E jigidere oge ugbu a e ji akọ akụkọ n’asụsụ Grik iji mee ka ihe ahụ dị ka ọ na-eme n’ihu onye na-agụ ya; “abịakwa” na-egosikwa njikọ ya na ihe gara aga.
- source_word: οἶκον
  choice: ụlọ
  rationale: “Ụlọ” bụ okwu Igbo kwụ ọtọ maka ebe obibi nke onyeisi ụlọ nzukọ ahụ.
- source_word: ἀρχισυναγώγου
  choice: onyeisi ụlọ nzukọ ndị Juu
  rationale: Nke a na-akọwa onye na-elekọta ma ọ bụ na-edu ụlọ nzukọ ndị Juu n’asụsụ Igbo doro anya ma dị ugbu a.
- source_word: θεωρεῖ
  choice: Jizọs ahụ
  rationale: Ngwaa ahụ dị n’otu onye, onye ọ na-ezo aka na ya bụ Jizọs dịka ihe ndị gbara amaokwu ahụ gburugburu si gosi. Ikwughachi “Jizọs” na-ewepụ mgbagwoju anya nke nnọchiaha Igbo n’enweghị ịgbanwe ihe okwu ahụ pụtara.
- source_word: θόρυβον
  choice: ọgba aghara
  rationale: “Ọgba aghara” na-egosi ma oke mkpọtụ ma ọnọdụ enweghị ntụziaka nke iru uju ahụ, ọ bụghị naanị ụda.
- source_word: κλαίοντας
  choice: ndị mmadụ ka ha na-akwa ákwá
  rationale: E tinyere “ndị mmadụ” iji mee ka nkebi-okwu Grik ahụ bụrụ Igbo eke, ebe “na-akwa ákwá” na-egosipụta omume ha.
- source_word: ἀλαλάζοντας
  choice: na-eti mkpu akwa
  rationale: Nkebi a na-egosi iti mkpu n’olu dara ụda n’oge iru uju; okwu Igbo a na-enye echiche ahụ n’ụzọ doro anya.
- source_word: πολλά
  choice: nke ukwuu
  rationale: N’ebe a, πολλά na-eme ka iti mkpu ahụ sie ike; “nke ukwuu” na-egosipụta ike ya n’Igbo eke n’enweghị ime ka ọ bụrụ naanị okwu banyere ụda olu.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị mfe, dị ùgwù, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. E debere ụdị akụkọ dị ndụ nke ngwaa Grik, ma kwughachi aha Jizọs iji zere mgbagwoju anya nke nnọchiaha. E tinyere akara nkọwa ụkwụ [a] n’akụkụ “ọgba aghara,” bụ́ okwu θόρυβον nkọwa ahụ metụtara.
