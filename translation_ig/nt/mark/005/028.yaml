  text: ἔλεγεν γὰρ ὅτι ⸂Ἐὰν ἅψωμαι κἂν τῶν ἱματίων αὐτοῦ⸃ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/028.yaml
  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: ig
  text: N’ihi na ọ nọ na-ekwu, “Ọ bụrụ na m emetụ ọbụna uwe ya aka, a ga-agwọ m[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ikpeazụ a pụkwara ịpụta, “a ga-azọpụta m” ma ọ bụ “ahụ ga-adị m mma.” N’ebe a, ihe gbara ya gburugburu na-egosi ọgwụgwọ anụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ọ nọ na-ekwu
  rationale: Oge imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro n’oge gara aga; okwu a na-edobe akụkụ ahụ n’ebughị ụzọ kpebie ma ọ kwuru ya n’olu dara ụda ka ọ bụ n’obi.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata nkọwa maka omume e kwuru n’amaokwu bu ụzọ; ‘N’ihi na’ bụ njikọ doro anya ma bụrụkwa nke nkịtị n’Igbo.
- source_word: ὅτι
  choice: akara okwu e kwuru kpọmkwem
  rationale: Ọ na-ewebata ọdịnaya nke ihe nwanyị ahụ nọ na-ekwu; akara nhota na-enye ya n’ụzọ eke n’Igbo.
- source_word: ἐὰν ἅψωμαι
  choice: Ọ bụrụ na m emetụ ... aka
  rationale: Ọ na-egosi ọnọdụ nwanyị ahụ tụrụ anya ime; ‘imetụ aka’ bụ ụzọ Igbo si ekwu mmetụ nkịtị nke ἅπτω pụtara n’ebe a.
- source_word: κἂν
  choice: ọbụna
  rationale: 'Ọ na-emesi ihe kacha nta o chere na ọ ga-ezu ike: ọbụna naanị imetụ uwe ya aka.'
- source_word: τῶν ἱματίων αὐτοῦ
  choice: uwe ya
  rationale: ἱμάτια bụ ọtụtụ n’asụsụ Grik, ma ‘uwe’ n’Igbo nwere ike ịbụ aha mkpokọta maka ihe mmadụ yi; ọ bụ okwu dị ugbu a ma ghara ime ka ọ bụrụ otu ụdị uwe kpọmkwem.
- source_word: σωθήσομαι
  choice: a ga-agwọ m
  rationale: N’ọnọdụ a, σῴζω na-ezo aka n’ịgwọ ọrịa anụ ahụ. Ụdị passive a bụ ụzọ Igbo doro anya si kwuo na ọ ga-enweta ọgwụgwọ, ebe nkọwa ala peeji na-edobe obosara ihe okwu Grik ahụ pụrụ ịpụta.
theological_decisions:
- issue: Nsụgharị σωθήσομαι n’akụkọ ọgwụgwọ
  choice: a ga-agwọ m
  alternative: a ga-azọpụta m; ahụ ga-adị m mma
  rationale: Ọbara na-agba nwanyị ahụ bụ isi ọnọdụ okwu a, ya mere ọgwụgwọ anụ ahụ bụ ihe pụtara ìhè. Ma ebe σῴζω nwekwara ike ịpụta ‘ịzọpụta,’ e debere obosara na esemokwu ahụ na nkọwa ala peeji kama ikpochapụ ya.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘uwe’ mee ihe dị ka aha mkpokọta eke n’Igbo; e debere imperfect nke ἔλεγεν site n’okwu ‘ọ nọ na-ekwu.’
