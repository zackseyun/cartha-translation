  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: ig
  text: Ma ọ sịrị ya, “Nwa nwanyị, okwukwe gị azọpụtala gị[a]. Laa n’udo, nweekwa ahụ́ ike pụọ ná nhụjuanya gị[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwukwe gị emela ka ahụ́ dị gị mma,” ma ọ bụ, “okwukwe gị agwọọla gị.” Ngwaa Grik a nwere ike izo aka ná nzọpụta, nnapụta, ma ọ bụ ọgwụgwọ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ka ahụ́ dị gị mma,” ma ọ bụ, “nwee ahụ́ ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Nwa nwanyị
  rationale: E debere okwu a e ji kpọọ ya dịka ‘Nwa nwanyị’ iji gosipụta ọmịiko na mmekọrịta ezinụlọ dị n’okwu Grik, n’etinyeghị ‘m’ nke na-adịghị n’isi mmalite.
- source_word: πίστις
  choice: okwukwe
  rationale: N’ebe a, okwu a na-ekwu maka ntụkwasị obi nwanyị ahụ nwere n’ebe Jizọs nọ; ‘okwukwe’ bụ okwu Igbo a na-ejikarị eme ihe ma na-echekwa isi okwu ahụ.
- source_word: σέσωκέν
  choice: azọpụtala
  rationale: Ụdị ngwaa zuru oke na-egosi ihe e mewororị nke nsonaazụ ya ka dị. ‘Azọpụtala’ na-echekwa obosara σῴζω, nke nwere ike ịpụta nzọpụta ma ọ bụ ọgwụgwọ, n’agwakọtaghị ya na okwu ahụ ike na-esote.
- source_word: ὕπαγε
  choice: Laa
  rationale: ‘Laa’ bụ iwu dị mfe ma bụrụkwa ụzọ Igbo ebumpụta ụwa si ekwu ka mmadụ gawa.
- source_word: εἰς εἰρήνην
  choice: n’udo
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si egosipụta ịla n’ọnọdụ udo na ọdịmma.
- source_word: ἴσθι ὑγιὴς
  choice: ahụ́ dịkwa gị mma
  rationale: Nkebi okwu a na-egosi ịnọ n’ọnọdụ ahụ ike, ọ bụghị naanị omume ọgwụgwọ na-eme ugbu a; ya mere e ji okwu ọnọdụ ‘ahụ́ dị gị mma.’
- source_word: μάστιγός
  choice: nhụjuanya
  rationale: Ọ bụ ezie na μάστιξ nwere ike ịpụta ụtarị n’ụzọ nkịtị, ebe a ọ na-ekwu n’ihe atụ banyere ọrịa na-emekpa nwanyị ahụ ahụ́. ‘Nhụjuanya’ na-echekwa echiche nke ahụhụ siri ike n’emeghị ka ọ bụrụ nanị otu ụdị ọrịa.
theological_decisions:
- issue: Nsụgharị πίστις
  choice: okwukwe
  alternative: ntụkwasị obi
  rationale: ‘Okwukwe’ na-echekwa okwu bụ isi nke Akwụkwọ Nsọ, ebe ọnọdụ akụkọ a ka na-egosi na ọ bụ ntụkwasị obi nwanyị ahụ nwere n’ebe Jizọs nọ.
- issue: Nsụgharị σῴζω n’ihe metụtara ọgwụgwọ
  choice: azọpụtala gị
  alternative: emela ka ahụ́ dị gị mma / agwọọla gị
  rationale: ‘Azọpụtala’ na-echekwa obosara okwu Grik na esemokwu dị n’etiti nzọpụta na ọgwụgwọ anụ ahụ, ebe nkebi okwu na-esote na-ekwu kpọmkwem banyere ahụ ike.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ọdịiche dị n’etiti ‘azọpụtala’ na okwu na-esote banyere ahụ ike, ma kọwaa nhọrọ ndị ọzọ n’ala ala peeji.
