revisions:
- from: Ma ọ sịrị ya, “Nwa nwanyị, okwukwe gị azọpụtala gị[a]. Laa n’udo, ahụ́ dịkwa gị mma[b], nwere onwe gị pụọ ná nhụjuanya gị.”
  to: Ma ọ sịrị ya, “Nwa nwanyị, okwukwe gị azọpụtala gị[a]. Laa n’udo, nweekwa ahụ́ ike pụọ ná nhụjuanya gị[b].”
  rationale: The correction removes the unintended reflexive command and supplies a coherent, idiomatic rendering of the final imperative and its freedom-from-affliction complement. It retains the source’s distinction between σῴζω and ὑγιής and preserves the existing footnote a ambiguity. Footnote b is adjusted to give only viable health-related alternatives.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly preserves the tender vocative, the perfect force and broad semantic range of σέσωκέν (''azọpụtala gị''), the imperative to depart in peace, and the distinction between saving and bodily well-being. However, the final wording, ''ahụ́ dịkwa gị mma, nwere onwe gị pụọ ná nhụjuanya gị,'' is grammatically and idiomatically defective: it introduces an unintended reflexive idea (''free yourself'') and does not clearly render ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.'
  naturalness: The revised wording uses natural Standard Igbo imperative phrasing. 'Nweekwa ahụ́ ike pụọ ná nhụjuanya gị' communicates continued soundness/freeing from the affliction without implying that the woman must free herself.
  terminology: '''Okwukwe'' appropriately renders πίστις, while ''azọpụtala'' preserves the purposeful breadth of σῴζω and does not collapse it into healing. ''Nhụjuanya'' is a suitable context-sensitive rendering of μάστιξ. The footnote alternative ''zuo oke'' is unsuitable here, since it normally conveys perfection/completion rather than health or wholeness, and is replaced.'
  issues:
  - severity: high
    issue: The final clause contains an ungrammatical and semantically misleading expression.
    rationale: '''nwere onwe gị pụọ'' can be understood as ''free yourself,'' introducing agency not expressed in Greek. It also fails to function naturally with the preceding predicate.'
  - severity: medium
    issue: Footnote b gives 'zuo oke' as an alternative for ὑγιής.
    rationale: In Standard Igbo this suggests being perfect or complete, not being well/whole in the health-related sense intended by the Greek.
  revised_text: Ma ọ sịrị ya, “Nwa nwanyị, okwukwe gị azọpụtala gị[a]. Laa n’udo, nweekwa ahụ́ ike pụọ ná nhụjuanya gị[b].”
