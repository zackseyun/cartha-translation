id: MRK.5.4
reference: Mark 5:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τὸ αὐτὸν πολλάκις πέδαις καὶ ἁλύσεσι δεδέσθαι καὶ διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις καὶ τὰς πέδας συντετρῖφθαι, καὶ οὐδεὶς ⸂ἴσχυεν αὐτὸν⸃ δαμάσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: ig
  text: n’ihi na e jirila agbụ na ígwè ndị e ji ekegide ụkwụ kee ya ọtụtụ ugboro, ma ọ dọkasịrị agbụ ndị ahụ ma tipịa ígwè ndị e ji ekegide ụkwụ ahụ; ọ dịghịkwa onye ọ bụla siri ike iji chịkwaa ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “iji zụọ ya ka ọ dị nwayọọ.” Okwu Grik ahụ pụrụ ịpụta ịzụ anụ ka ọ dị nwayọọ, ma ọ bụ, n’ụzọ sara mbara, iweta mmadụ n’okpuru nchịkwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: n’ihi na e jirila ... kee ya
  rationale: διά na infinitive nwere article na-egosi ihe kpatara okwu gara aga; usoro a na-egosipụta ihe kpatara ya n’Igbo dị ndụ.
- source_word: πολλάκις
  choice: ọtụtụ ugboro
  rationale: Nke a na-egosi na ihe ahụ mere ugboro ugboro.
- source_word: πέδαις
  choice: ígwè e ji ụkwụ
  rationale: πέδη bụ ihe e ji ekegide ụkwụ kpọmkwem; nkọwa a na-ekewa ya nke ọma na agbụ nkịtị.
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: agbụ
  rationale: ἅλυσις pụtara agbụ; idebe okwu a iche na ígwè e ji ụkwụ na-echekwa ụdị ihe mgbochi abụọ dị na Grik.
- source_word: δεδέσθαι
  choice: e ... kee ya
  rationale: Nke a bụ ntụgharị Igbo kwụ ọtọ maka ikekọta mmadụ ma ọ bụ ijide ya n’agbụ; ọdịdị perfect na-apụta site na ‘ejirila’.
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ
  choice: ọ dọkasịrị ... ndị ahụ
  rationale: διασπάω na-egosi ịdọwa ihe n’ike; ahịrị ọrụ kpọmkwem dị mma ma dị ndụ n’Igbo karịa passive Grik.
- source_word: συντετρῖφθαι
  choice: tipịakwa
  rationale: Okwu a na-egosi ịkụji ma ọ bụ ịtipịa ihe n’ike, ya mere ọ na-echekwa ike nke συντρίβω.
- source_word: οὐδεὶς ἴσχυεν
  choice: ọ dịghịkwa onye ọ bụla siri ike
  rationale: Nke a na-echekwa echiche nke ike dị na ἰσχύω, ọ bụghị naanị ikike n’ozuzu.
- source_word: δαμάσαι
  choice: ga-emeri ya
  rationale: N’ebe a, ‘imeri ya’ na-egosi iweda ya n’ike ma mee ka ọ nọrọ n’okpuru nchịkwa, n’enweghị echiche pụrụ iche nke ịzụ anụ.
theological_decisions:
- issue: Ụdị ọnọdụ nwoke ahụ na isi iyi nke ike ya
  choice: A kọwara naanị na mmadụ enweghị ike ijide ma ọ bụ merie ya, n’ebughị ụzọ kọwaa isi iyi ike ahụ n’amaokwu a.
  alternative: Iji okwu ga-ekwusi ike ozugbo na ọ bụ ike mmụọ ọjọọ mere nke a.
  rationale: Grik na-akọwa mgbalị e mere ugboro ugboro na ike pụrụ iche nwoke ahụ nwere, ma ọ naghị akọwa ihe kpatara ike ahụ n’amaokwu a; ntụgharị ahụ na-ahapụ nkọwa ahụ n’aka akụkọ gbara ya gburugburu.
- issue: Ọtụtụ ihe δαμάζω nwere ike ịpụta
  choice: ga-emeri ya
  alternative: ga-azụ ya ka ọ dị nwayọọ; ga-achịkwa ya
  rationale: ‘Imeri ya’ dabara n’ọnọdụ nke iji ike jide mmadụ, ma ihe e dere n’ala ala peeji na-echekwa nkọwa ọzọ nke iweta ya n’okpuru nchịkwa.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. E ji ‘ígwè e ji ụkwụ’ kọwaa ihe e ji ekegide ụkwụ, ebe ‘agbụ’ nọchiri chain, iji chekwaa ọdịiche okwu Grik abụọ ahụ. A gbanwere ụfọdụ passive Grik ka ha bụrụ ahịrị ọrụ kpọmkwem n’Igbo maka ịdị n自然 na ido anya, n’agbanweghị onye mere ihe ahụ.
