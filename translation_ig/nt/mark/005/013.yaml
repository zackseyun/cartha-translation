revisions:
- from: O wee nye ha ikike. Mmụọ ndị ahụ na-adịghị ọcha wee si n'ime nwoke ahụ pụta, banye n'ime ezi ndị ahụ. Ìgwè ezi ahụ—ihe dị ka puku abụọ—wee jiri ọsọ gbadaa ná mkpọda ugwu ahụ dị nkọ[a], daba n'oké osimiri[b], mmiri wee rie ha n'ime ya.
  to: O wee nye ha ikike. Mmụọ ndị ahụ na-adịghị ọcha wee pụta, banye n'ime ezi ndị ahụ. Ìgwè ezi ahụ—ihe dị ka puku abụọ—wee jiri ọsọ gbadaa ná mkpọda ugwu ahụ dị nkọ[a], daba n'oké osimiri[b], ha wee mikpuo nwụọ n'ime osimiri.
  rationale: The revision removes the context-derived addition “n'ime nwoke ahụ” so that the verse does not state more than its Greek text. It also replaces the water-as-agent idiom with “ha wee mikpuo nwụọ,” which clearly and naturally states that the herd drowned in the sea. The remaining wording and both correctly placed footnote anchors are retained.
  reviewer_model: gpt-5.6-terra
