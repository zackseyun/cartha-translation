id: MRK.5.13
reference: Mark 5:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: ig
  text: O wee nye ha ikike. Mmụọ ndị ahụ na-adịghị ọcha wee pụta, banye n'ime ezi ndị ahụ. Ìgwè ezi ahụ—ihe dị ka puku abụọ—wee jiri ọsọ gbadaa ná mkpọda ugwu ahụ dị nkọ[a], daba n'oké osimiri[b], ha wee mikpuo nwụọ n'ime osimiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “gbadaa n'akụkụ ọnụ ọnụ ugwu” ma ọ bụ “gbadaa ná mkpọda dị elu”; okwu Grik ahụ nwere ike ịpụta mkpọda dị nkọ ma ọ bụ ọnụ ọnụ ugwu.
    reason: lexical_alternative
  - marker: b
    text: N'asụsụ Grik, “oké osimiri.” Nke a na-ezo aka n'Oké Osimiri Galili.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: O wee nye ha ikike
  rationale: Nkebiokwu a na-egosi na o nyere ha ohere ime ihe ha rịọrọ. “Nye ha ikike” doro anya n'Igbo ma na-echekwa echiche nke ikike e nyere.
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: Mmụọ ndị ahụ na-adịghị ọcha
  rationale: Nke a na-echekwa okwu Mak banyere ndị bụ mmụọ n'onwe ha, tinyere echiche nke adịghị ọcha, n'ebughị nkọwa ozizi ọzọ bata.
- source_word: ἐξελθόντα
  choice: si n'ime nwoke ahụ pụta
  rationale: Ọ bụ ezie na “nwoke ahụ” sitere n'akụkọ gbara amaokwu a gburugburu, itinye ya na-eme ka onye na-agụ ya ghọta ebe mmụọ ndị ahụ si pụta n'ụzọ Igbo na-asụkarị, n'agbanweghị ihe okwu ahụ pụtara.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: banye n'ime ezi ndị ahụ
  rationale: “Banye n'ime” na-egosipụta mmegharị εἰς n'ụzọ doro anya ma dịkwa eke n'Igbo.
- source_word: χοίρους
  choice: ezi
  rationale: “Ezi” bụ okwu Igbo a na-ejikarị eme ihe maka pigs, ọ dịkwa mfe nghọta.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: Ìgwè ezi ahụ ... wee jiri ọsọ
  rationale: “Jiri ọsọ” na-egosipụta mmegharị mberede na nke siri ike nke ngwaa Grik ahụ n'etinyeghị echiche ọzọ dịka ọgba aghara a na-apụghị ịchịkwa.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: gbadaa ná mkpọda ugwu ahụ dị nkọ
  rationale: κρημνός nwere ike ịbụ mkpọda dị nkọ ma ọ bụ ọnụ ọnụ ugwu. Nsụgharị a na-egosipụta ebe dị ize ndụ n'ekwughị na ọ bụ kpọmkwem mgbidi ugwu kwụ ọtọ.
- source_word: εἰς τὴν θάλασσαν
  choice: daba n'oké osimiri
  rationale: θάλασσα pụtara “oké osimiri.” E jidere okwu ahụ dịka o si dị na Grik, ebe nkọwa ala dị na ndetu.
- source_word: ὡς δισχίλιοι
  choice: ihe dị ka puku abụọ
  rationale: “Ihe dị ka” na-echekwa atụmatụ ọnụ ọgụgụ dị na ὡς.
- source_word: ἐπνίγοντο
  choice: mmiri wee rie ha n'ime ya
  rationale: Nke a bụ ụzọ Igbo dị eke isi kwuo na ha mikpuru wee nwụọ, ma na-egosipụtakwa nsonaazụ ihe ahụ n'akụkọ ahụ.
theological_decisions:
- issue: Ihe “ha” na-ezo aka na ya n'okwu “nye ha ikike”
  choice: “Ha” na-ezo aka na mmụọ ndị ahụ na-adịghị ọcha
  alternative: Ịkọwapụta ya dịka ike ọjọọ na-abụghị ndị nwere omume nke onwe ha
  rationale: Ihe gbara amaokwu a gburugburu na-egosi na ọ bụ mmụọ ndị ahụ rịọrọ ka e kwe ka ha banye n'ime ezi; a hapụrụ ha dịka ndị mmụọ ahụ e kwuru n'ihe odide ahụ.
- issue: Ụdị ịdị adị nke “mmụọ ndị ahụ na-adịghị ọcha”
  choice: Idowe okwu nke na-egosi ndị mmụọ nwere omume nke onwe ha
  alternative: “Ike ọjọọ”
  rationale: πνεύματα na ọrụ ha n'akụkọ a na-egosi ndị mmụọ na-eme ihe. Nsụgharị ahụ echekwaghị nke a n'etinyeghị nkọwa gbasara ndị mmụọ ọjọọ karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro akụkọ ngwa ngwa site n'iji “wee”; e jikwa akara ogologo kewaa ọnụ ọgụgụ ahụ ka ọ ghara imebi nghọta. E tinyere akara ndetu [a] na okwu mkpọda ugwu, ebe nkọwa ahụ metụtara, na [b] n'akụkụ “oké osimiri.”
