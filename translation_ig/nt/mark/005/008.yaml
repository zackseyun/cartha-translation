  source_fidelity: The draft accurately retains the explanatory γάρ, the imperfect/background force of ἔλεγεν, the pronoun αὐτῷ without prematurely resolving its referent, the command to exit from within the man, and the precise expression “unclean spirit.”
  naturalness: The wording is generally clear Standard Igbo. Adding punctuation around the direct address makes the imperative substantially more natural and prevents “gị mmụọ” from reading as an unmarked noun phrase. “Nwoke ahụ” is the more idiomatic contextual rendering of the Greek definite reference than the deictic “nwoke a.”
  terminology: “Mmụọ na-adịghị ọcha” appropriately renders πνεῦμα τὸ ἀκάθαρτον and should not be replaced by the more interpretive “mmụọ ọjọọ.”
