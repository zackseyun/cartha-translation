  text: ἔλεγεν γὰρ αὐτῷ· Ἔξελθε τὸ πνεῦμα τὸ ἀκάθαρτον ἐκ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/008.yaml
  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: ig
  text: N’ihi na ọ nọ na-asị ya[a], “Si n’ime nwoke ahụ pụta, gị, mmụọ na-adịghị ọcha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ọ nọ na-agwa mmụọ ahụ okwu.” N’usoro akụkọ Grik, “ya” nwere ike izo aka n’ebe nwoke ahụ nọ, ebe iwu sochirinụ na-agwa mmụọ na-adịghị ọcha okwu kpọmkwem.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: ἔλεγεν
  choice: ọ nọ na-asị
  rationale: Oge imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro n’oge gara aga; okwu a na-edobe ọnọdụ akụkọ ahụ n’Igbo nkịtị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-enye nkọwa maka ihe e kwuru n’amaokwu bu ụzọ, ya mere ‘N’ihi na’ na-egosipụta njikọ ahụ nke ọma.
- source_word: αὐτῷ
  choice: ya
  rationale: Aha nnọchiaha dative ahụ na-ezo aka n’ebe nwoke ahụ nọ dị ka onye Jizọs na-agwa okwu n’usoro akụkọ, ebe iwu ahụ kpọmkwem na-eche mmụọ ahụ ihu; ‘ya’ na-edobe nghọta abụọ ahụ.
- source_word: Ἔξελθε
  choice: pụta
  rationale: Iwu aorist bụ iwu kpọmkwem. N’Igbo, ‘pụta’ bụ ụzọ ebumpụta ụwa isi nye iwu ka onye ma ọ bụ ihe si n’ime ebe pụta.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: gị mmụọ na-adịghị ọcha
  rationale: Ọ bụ ezie na nhazi Grik ahụ nwere article ma dị n’ụdị nominative, ọ na-arụ ọrụ dị ka ịkpọ onye a na-agwa okwu kpọmkwem. ‘Gị mmụọ na-adịghị ọcha’ na-eme ka nke ahụ doo anya ma na-edobe okwu ‘unclean’ kama ịkọwa ya dịka ‘evil.’
- source_word: ἐκ τοῦ ἀνθρώπου
  choice: si n’ime nwoke a
  rationale: ἐκ na-egosi isi n’ime pụta, ebe ἄνθρωπος n’ebe a na-ezo aka n’otu nwoke a kpọmkwem n’akụkọ ahụ. ‘Nwoke a’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ.
theological_decisions:
- issue: Nsụgharị πνεῦμα ἀκάθαρτον n’ọnọdụ ịchụ mmụọ
  choice: mmụọ na-adịghị ọcha
  alternative: mmụọ ọjọọ
  rationale: Grik kwuru kpọmkwem ‘mmụọ na-adịghị ọcha,’ nke na-eburu echiche adịghị ọcha nke omume na nke okpukpe. ‘Mmụọ ọjọọ’ ga-abụ nkọwa gbakwunyere karịa okwu isi mmalite.
- issue: Onye αὐτῷ na-ezo aka na ya
  choice: ya, na-edobe nghọta ederede ahụ
  alternative: mmụọ ahụ
  rationale: N’usoro akụkọ, nnọchiaha ahụ nwere ike na-ezo aka n’ebe nwoke ahụ nọ, ma iwu sochirinụ na-agwa mmụọ ahụ okwu. A naghị edozi esemokwu a n’ụzọ otu akụkụ; ihe odide na nkọwa ala peeji na-edobe ya.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E jiri ‘ọ nọ na-asị’ chekwaa imperfect ahụ, e jikwa ‘si n’ime ... pụta’ mee ka mmegharị sitere n’ime doo anya. Akara nkọwa ala peeji [a] dị n’ahịrị isi.
