  naturalness: Replace the nonstandard/awkward perfect form “ọ takwawo” with the natural narrative form “ọ tara ahụhụ nke ukwuu.” The revised sequence is fluent Standard Igbo while retaining the verse’s dependent, continuing narrative form.
  terminology: “Ndị dibịa” is an appropriate general rendering of ἰατροί. “Uru” accurately renders the benefit she did not receive. “Ọnọdụ ya kara njọ” preserves the Greek’s broad worsening without adding a more specific referent than the text states.
