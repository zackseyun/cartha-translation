  text: καὶ πολλὰ παθοῦσα ὑπὸ πολλῶν ἰατρῶν καὶ δαπανήσασα τὰ παρ’ αὐτῆς πάντα καὶ μηδὲν ὠφεληθεῖσα ἀλλὰ μᾶλλον εἰς τὸ χεῖρον ἐλθοῦσα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/026.yaml
  text: and after suffering much under many physicians[a], and after spending all that she had and benefiting nothing, but rather becoming worse[b],
translation:
  language: ig
  text: ọ tara ahụhụ nke ukwuu n’aka ọtụtụ ndị dibịa[a], mefuo ihe niile o nwere[b], ma ọ nwetaghị uru ọ bụla; kama, ọnọdụ ya kara njọ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “site n’aka ọtụtụ ndị dibịa” ma ọ bụ “n’okpuru ọtụtụ ndị dibịa.” Grik ahụ nwere ike imesi ike n’ọrụ ndị dibịa ahụ dịka ndị butere ahụhụ ya, ma ọ bụ n’ịnọ ya n’okpuru ọgwụgwọ ha.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ihe niile sitere n’aka ya,” ya bụ, ihe niile o nwere.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: ọ takwawo ahụhụ dị ukwuu
  rationale: Nke a na-egosi ahụhụ dị ukwuu ọ gabigara tupu ọnọdụ a, ma na-edobe ike nke πάσχω n’Igbo sitere n’okike.
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: n’aka ọtụtụ ndị dibịa
  rationale: ὑπό na genitive na-egosi ndị mere ihe ahụ ma ọ bụ ebe ahụhụ ahụ si bịa. “N’aka” na-egosi na ahụhụ ya metụtara ọgwụgwọ ndị dibịa ahụ, n’ebughị ụzọ kpebie ma ha kpachaara anya mee ya ahụhụ.
- source_word: δαπανήσασα
  choice: mefụọkwa
  rationale: N’ebe ego ma ọ bụ ihe mmadụ nwere dị, “imefụ” na-egosi iji ya niile kwụọ ụgwọ; njikọ ya na “ihe niile o nwere” na-eme ka ngụkọta mmefu ahụ doo anya.
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: ihe niile o nwere
  rationale: Nke a bụ ntụgharị Igbo doro anya ma sitere n’okike maka ihe niile dị ya n’aka ma ọ bụ nke ya.
- source_word: μηδὲν ὠφεληθεῖσα
  choice: ma ọ nwetaghị enyemaka ọ bụla
  rationale: Passive ὠφεληθεῖσα na-ekwu na ọgwụgwọ ahụ abaghị ya uru. “Enwetaghị enyemaka ọ bụla” na-edobe echiche ahụ n’Igbo doro anya.
- source_word: ἀλλὰ μᾶλλον
  choice: kama
  rationale: “Kama” na-eweta ntụgharị siri ike site n’enweghị uru gaa n’ọnọdụ megidere ya.
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: ọrịa ya kara njọ
  rationale: Akpaokwu a pụtara ịbanye n’ọnọdụ ka njọ. Ịkpọ “ọrịa ya” aha na-eme ka Igbo bụrụ nke sitere n’okike, ebe ihe gbara amaokwu ahụ gburugburu na-eme ka onye na-agụ ghọta ihe kara njọ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ahịrịokwu ahụ dị ka akụkụ na-aga n’ihu n’usoro akụkọ ahụ, ya mere e tinyere rikoma n’ọgwụgwụ. Akara nkọwa ala [a] na [b] pụtara n’ederede isi.
