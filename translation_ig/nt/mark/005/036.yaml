  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: ig
  text: Ma Jizọs, mgbe ọ nụrụ[a] okwu ahụ a na-ekwu, sịrị onyeisi ụlọ nzukọ ahụ, “Atụla egwu; naanị kwere.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ma Jizọs, n’agbanyeghị okwu ahụ a na-ekwu, sịrị onyeisi ụlọ nzukọ ahụ, ‘Atụla egwu; naanị kwere.’” παρακούσας nwekwara ike ịpụta ileghara ma ọ bụ ịghara ige ozi ahụ ntị, kama ịbụ naanị ịnụ ya.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “naanị nwee okwukwe,” ma ọ bụ “naanị tụkwasị obi.” Ngwaa Grik bụ πιστεύω.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: mgbe ọ nụrụ
  rationale: Okwu a nwere ike ịpụta ịnụ ihe a na-ekwu ma ọ bụ ileghara ya anya. N'usoro akụkọ a, Jizọs zara ozi ahụ ozugbo, ya mere ‘mgbe ọ nụrụ’ dabara nke ọma; e debere nghọta nke ọzọ n'ala peeji.
- source_word: τὸν λόγον λαλούμενον
  choice: ihe a na-ekwu
  rationale: Nke a bụ Igbo doro anya ma bụrụkwa nke e ji eme ihe kwa ụbọchị maka okwu ma ọ bụ ozi a na-ekwu n'oge ahụ.
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a mee ka akụkọ dị ndụ, oge gara aga bụ ụzọ ebumpụta ụwa e si akọ nke a n'Igbo.
- source_word: ἀρχισυναγώγῳ
  choice: onyeisi ụlọ nzukọ ahụ
  rationale: Nke a na-egosi onye na-elekọta ma ọ bụ na-edu ụlọ nzukọ ndị Juu, n'asụsụ Igbo dị mfe ma kwanyere ùgwù.
- source_word: Μὴ φοβοῦ
  choice: Atụla egwu
  rationale: Nke a bụ iwu na-agọnahụ ụjọ n'Igbo ebumpụta ụwa, ma na-edobe ike agbamume ahụ.
- source_word: μόνον
  choice: naanị
  rationale: Ọ na-amachi ihe Jizọs chọrọ ka nwoke ahụ mee, dịka μόνον si eme na Grik.
- source_word: πίστευε
  choice: kwere
  rationale: ‘Kwere’ bụ ntụgharị kpọmkwem na nke ebumpụta ụwa nke πιστεύω n'ọnọdụ a; ‘tụkwasị obi’ bụkwa nhọrọ ziri ezi, ya mere e debere ya n'ala peeji.
theological_decisions:
- issue: Ihe παρακούσας pụtara
  choice: Jizọs nụrụ ozi a na-ekwu ma gwa onyeisi ụlọ nzukọ ahụ okwu.
  alternative: Jizọs leghaara ihe e kwuru anya ma gwa onyeisi ụlọ nzukọ ahụ okwu.
  rationale: Nghọta abụọ ahụ kwe omume n'okwu Grik. Usoro akụkọ ahụ na-akwado ‘nụrụ,’ ma e debere ‘leghaara anya’ ka a ghara ikpochapụ mgbagwoju anya dị n'isi mmalite.
- issue: Ntụgharị πιστεύω n'iwu Jizọs
  choice: kwere
  alternative: nwee okwukwe; tụkwasị obi
  rationale: ‘Kwere’ na-edobe ngwaa Grik n'ụzọ kpọmkwem. ‘Nwee okwukwe’ na ‘tụkwasị obi’ na-egosikwa akụkụ ndị dị n'echiche ya, ma itinye otu n'ime ha naanị n'ahịrị bụ imechi nghọta ahụ karịa ka isi mmalite si mee.
translation_notes:
  register: Standard Igbo dị ugbu a, doro anya ma kwanyere ùgwù. A họọrọ ‘ụlọ nzukọ’ maka synagogue, ‘onyeisi’ maka onye na-edu ya, ma zere okwu ụka nke otu denominashọn. Ihe nrịbama ala peeji [a] na [b] dị n'ahịrị isi.
