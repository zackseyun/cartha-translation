  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀παρακαλεῖ αὐτὸν πολλὰ λέγων ὅτι Τὸ θυγάτριόν μου ἐσχάτως ἔχει, ἵνα ἐλθὼν ἐπιθῇς ⸂τὰς χεῖρας αὐτῇ⸃ ⸀ἵνα σωθῇ καὶ ⸀ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: ig
  text: Ọ nọ na-arịọsi ya ike, sị, “Nwa m nwanyị nta nọ n’ọnụ ọnwụ. Biko, bịa bikwasị ya aka gị abụọ, ka a zọpụta ya[a], ka o wee dị ndụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka a gwọọ ya,” ma ọ bụ, “ka ahụ dị ya mma.” Ngwaa Grik a nwere ike ịpụta ịzọpụta, ịnapụta, ma ọ bụ ịgwọ ọrịa; n’ebe a, ọnọdụ akụkọ ahụ metụtara ọgwụgwọ anụ ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλεῖ ... πολλὰ
  choice: na-arịọsi ya arịrịọ ike
  rationale: N’ebe a, παρακαλέω bụ arịrịọ siri ike, πολλὰ na-emekwa ka ịdị ngwa na ịdị omimi nke arịrịọ ahụ pụta ìhè. Okwu Igbo a na-egosi na ọ nọgidere na-arịọ ya nke ukwuu.
- source_word: θυγάτριόν
  choice: nwa m nwanyị nta
  rationale: Ụdị okwu nta θυγάτριον nwere ike igosi ma nwata ma ịhụnanya nna nwere n’ebe nwa ya nọ; ‘nwa m nwanyị nta’ na-echekwa ihe abụọ ahụ n’Igbo doro anya.
- source_word: ἐσχάτως ἔχει
  choice: nọ n’ọnụ ọnwụ
  rationale: Nkebiokwu Grik a na-egosi na ọnọdụ ya eruola n’ókè ikpeazụ. ‘Nọ n’ọnụ ọnwụ’ bụ ụzọ Igbo si ekwu n’ụzọ dị ndụ na mmadụ fọrọ nke nta ka ọ nwụọ.
- source_word: ἐλθὼν
  choice: Biko, bịa
  rationale: Ọ bụ ezie na ἐλθών bụ participle n’ụdị okwu Grik, n’arịrịọ a ọ na-arụ ọrụ dịka ọkpụkpọ ka Jizọs bịa. ‘Biko’ na-eme ka arịrịọ ahụ daa ka Igbo nkịtị n’enweghị ịgbakwunye echiche ọhụrụ.
- source_word: ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: bikwasị ya aka gị abụọ
  rationale: Nke a na-echekwa aka n’ọnụọgụ abụọ dịka Grik si kwuo, ma na-akọwa omume imetụ onye ahụ aka n’ụzọ Igbo doro anya.
- source_word: σωθῇ
  choice: ka a zọpụta ya
  rationale: σῴζω nwere ike ịpụta ịzọpụta, ịnapụta, ma ọ bụ ịgwọ ọrịa. ‘Zọpụta’ na-echekwa obosara okwu ahụ, ebe ọnọdụ akụkọ ahụ na-egosi na nzọpụta a metụtara ọrịa na ọnwụ.
- source_word: ζήσῃ
  choice: ya adịkwa ndụ
  rationale: ζάω pụtara ịdị ndụ. Nsụgharị a na-echekwa ya dịka ihe ga-esi na nzọpụta ma ọ bụ ọgwụgwọ ahụ pụta.
theological_decisions:
- issue: Ihe σωθῇ pụtara n’akụkọ ọgwụgwọ a
  choice: ka a zọpụta ya
  alternative: ka a gwọọ ya; ka ahụ dị ya mma
  rationale: N’ọnọdụ a, okwu ahụ na-ezo kpọmkwem n’ịgwọ nwa ahụ na ịnapụta ya n’ọnwụ, ma ngwaa Grik σῴζω sara mbara karịa naanị ọgwụgwọ. Isi okwu na-eji ‘zọpụta’ echekwa njikọ okwu ahụ na echiche ịnapụta, ebe nkọwa ala peeji na-egosi ihe ọ pụtara kpọmkwem n’ebe a.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. ‘Nọ n’ọnụ ọnwụ’ na ‘na-arịọsi ... arịrịọ ike’ bụ nkebiokwu Igbo sitere n’okike nke na-echekwa ịdị ngwa na mmetụta dị n’isi mmalite Grik. E tinyere akara nkọwa [a] ozugbo n’akụkụ okwu σωθῇ ọ na-akọwa.
