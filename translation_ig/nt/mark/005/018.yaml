revisions:
- from: Mgbe ọ na-abanye n’ụgbọ mmiri ahụ, nwoke ahụ ndị mmụọ ọjọọ bichiburu n’ime ya nọgidere na-arịọ ya ka o soro ya nọrọ.
  to: Mgbe ọ na-abanye n’ụgbọ mmiri ahụ, nwoke ahụ mmụọ ọjọọ jiburu nọgidere na-arịọ ya ka o soro ya nọrọ.
  rationale: The revision changes only the rendering of δαιμονισθείς. It removes unnecessary plurality and the added dwelling imagery, while preserving that the man had formerly been under demonic possession and is now requesting to be with Jesus. No footnote is required in the Igbo text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:33Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the temporal genitive absolute, the imperfect force of παρεκάλει, and the request to remain with Jesus. However, “ndị mmụọ ọjọọ bichiburu n’ime ya” adds the image of demons dwelling inside him and specifies a plural not expressed by the substantival participle δαιμονισθείς. A more idiomatic possession expression retains the source’s wording without these additions.
  naturalness: “Bichiburu n’ime ya” is understandable but is less natural in this context and can suggest ordinary residence rather than demonic possession. “Mmụọ ọjọọ jiburu” is concise, established Standard Igbo usage for the intended sense. The remainder is natural, modern, and appropriately dignified.
  terminology: Use “mmụọ ọjọọ jiburu” for δαιμονισθείς. It conveys demonic possession/affliction without importing medical categories, explaining mechanisms, or assigning a number of demons beyond the wording of this verse.
  issues:
  - severity: medium
    issue: “ndị mmụọ ọjọọ bichiburu n’ime ya” over-specifies and uses an unnatural image.
    rationale: δαιμονισθείς does not itself state plural demons, and “bichiburu n’ime ya” literally evokes having lived within him. “Mmụọ ọjọọ jiburu” more directly and naturally renders the participle while preserving its past-state implication.
  revised_text: Mgbe ọ na-abanye n’ụgbọ mmiri ahụ, nwoke ahụ mmụọ ọjọọ jiburu nọgidere na-arịọ ya ka o soro ya nọrọ.
  revised_footnotes: []
