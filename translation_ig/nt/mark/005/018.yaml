source:
  edition: SBLGNT
  text: καὶ ⸀ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον παρεκάλει αὐτὸν ὁ δαιμονισθεὶς ἵνα ⸂μετ’ αὐτοῦ ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: ig
  text: Mgbe ọ na-abanye n’ụgbọ mmiri ahụ, nwoke ahụ mmụọ ọjọọ jiburu nọgidere na-arịọ ya ka o soro ya nọrọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ
  choice: Mgbe ọ na-abanye
  rationale: Nkebiokwu a na-egosi na ịbanye ya n’ụgbọ mmiri ka na-aga n’ihu mgbe nwoke ahụ na-arịọ ya; ‘Mgbe ọ na-abanye’ na-egosipụta omume abụọ ahụ na-eme n’otu oge n’Igbo dị mma.
- source_word: πλοῖον
  choice: ụgbọ mmiri ahụ
  rationale: N’ọnọdụ Oké Osimiri Galili, ‘ụgbọ mmiri’ bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị eme ihe maka ụdị ụgbọ ahụ.
- source_word: παρεκάλει
  choice: nọgidere na-arịọ
  rationale: Oge imperfect na-egosi arịrịọ na-aga n’ihu ma ọ bụ a na-eme ugboro ugboro; ‘nọgidere na-arịọ’ na-echekwa ogologo omume ahụ na ịdị ọkụ nke arịrịọ ahụ.
- source_word: ὁ δαιμονισθείς
  choice: nwoke ahụ ndị mmụọ ọjọọ bichiburu n’ime ya
  rationale: Participle a na-arụ ọrụ dịka aha ma na-ezo aka n’ nwoke a gwọrọla. ‘Bichiburu’ na-egosi na ọnọdụ ahụ bụ nke gara aga, ebe plural ‘ndị mmụọ ọjọọ’ dabara n’ihe gbara amaokwu a gburugburu.
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: ka o soro ya nọrọ
  rationale: 'Nke a na-egosipụta ihe nwoke ahụ na-arịọ: ịnọnyere Jizọs. ‘Soro ya nọrọ’ bụ Igbo sitere n’okike nke na-echekwa echiche mmekọrịta dị na μετ’ αὐτοῦ, n’enweghị ịgbakwunye na ọ ga-abụ onye njem ya.'
theological_decisions:
- issue: Otu e si akọwa δαιμονισθείς dịka nhụjuanya sitere n’aka mmụọ ọjọọ n’enweghị itinye nkọwa ọrịa nke oge a ma ọ bụ ozizi pụrụ iche
  choice: ndị mmụọ ọjọọ bichiburu n’ime ya
  alternative: onye nọburu n’okpuru ike ndị mmụọ ọjọọ
  rationale: Nhọrọ ahụ na-egosi na ndị mmụọ ọjọọ metụtara nwoke ahụ n’ezie, dị ka akụkọ ahụ si kwuo, ma ‘bichiburu’ na-eme ka o doo anya na a tọhapụla ya. Ọ naghị akọwapụta usoro ma ọ bụ ogo ọchịchị ahụ karịa ihe ederede na ọnọdụ ya na-egosi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘nọgidere na-arịọ’ chekwaa omume na-aga n’ihu, e jighịkwa okwu ụka nke otu ụka pụrụ iche. Enweghị akara ndetu ala peeji n’ihi na ederede Igbo a achọghị lexical alternative dị mkpa; ndetu [a] dị na English POB yiri ka ọ dabaghị n’ebe akara ya dị na isi ederede Bekee.
