  text: ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν ἀπὸ μακρόθεν ἔδραμεν καὶ προσεκύνησεν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/006.yaml
  text: And seeing Jesus from a distance[a], he ran and bowed down before him,
translation:
  language: ig
  text: Mgbe ọ hụrụ Jizọs n'ebe dị anya, ọ gbara ọsọ wee hulata n'ihu ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “fee ya ofufe,” ma ọ bụ, “gosi ya nsọpụrụ site n'ihulata n'ihu ya.” Ngwaa Grik a nwere ike ịpụta ife ofufe ma ọ bụ omume ịkpọ isiala/ihulata iji gosi nsọpụrụ, dabere n'ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Mgbe ọ hụrụ
  rationale: A sụgharịrị aorist participle ahụ dị ka nkebiokwu oge, nke bụ ụzọ Igbo si ekwu ya n'ụzọ eke ma na-egosi usoro ihe mere n'akụkọ ahụ.
- source_word: ἀπὸ μακρόθεν
  choice: site n'ebe dị anya
  rationale: Nke a na-egosi ebe anya dị n'ụzọ doro anya ma bụrụ Igbo a na-asụ ugbu a.
- source_word: ἔδραμεν
  choice: ọ gbara ọsọ
  rationale: Nke a bụ ihe ngwaa ahụ pụtara kpọmkwem, n'etinyeghị ike ọzọ dịka ‘ọ gbara ọsọ ọkụ ọkụ.’
- source_word: προσεκύνησεν αὐτόν
  choice: kpọọ isiala n'ihu ya
  rationale: Nhọrọ a na-egosi omume nke irube isi ma ọ bụ ịkpọ isiala n'ebughị ụzọ kpebie ma ihe ahụ ọ bụ ofufe n'ụzọ okpukpe; e debere nghọta ndị ọzọ n'okpuru ala.
- source_word: καὶ
  choice: Mgbe
  rationale: Ọ bụ ezie na καὶ bụ njikọ akụkọ, usoro ‘Mgbe…’ na-ejikọta participle ahụ na ngwaa ndị so ya n'Igbo eke; njikọ ahụ ka pụtara ìhè n'usoro ahịrịokwu ahụ.
- source_word: τὸν Ἰησοῦν
  choice: Jizọs
  rationale: A sụgharịrị aha onye ahụ kpọmkwem n'ụdị a na-ejikarị ede ya n'Igbo.
theological_decisions:
- issue: Ma a ga-asụgharị προσεκύνησεν dịka ofufe a na-efe Jizọs kpọmkwem
  choice: A sụgharịrị ya dịka ‘kpọọ isiala n'ihu ya’ n'ahịrịokwu bụ isi.
  alternative: ‘fee ya ofufe’ ma ọ bụ ‘sọpụrụ ya site n'ịkpọ isiala’
  rationale: προσκυνέω nwere ike ịpụta ife ofufe, ịkpọ isiala, ma ọ bụ igosi nsọpụrụ. N'ọnọdụ akụkọ a, ‘kpọọ isiala n'ihu ya’ na-echekwa omume a hụrụ anya ma ghara imechi nghọta gbasara ihe omume ahụ pụtara n'ụzọ nkà mmụta okpukpe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. Usoro ‘Mgbe ọ hụrụ…’ bụ nke eke n'Igbo ma na-echekwa usoro omume ndị dị na Grik. E debere akara nkọwa ala [a] ozugbo n'akụkụ okwu ọ na-akọwa.
