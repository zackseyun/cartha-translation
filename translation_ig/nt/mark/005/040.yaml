source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ. ⸀αὐτὸς δὲ ἐκβαλὼν πάντας παραλαμβάνει τὸν πατέρα τοῦ παιδίου καὶ τὴν μητέρα καὶ τοὺς μετ’ αὐτοῦ, καὶ εἰσπορεύεται ὅπου ἦν τὸ ⸀παιδίον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: ig
  text: Ha nọ na-achị ya ọchị[a]. Ma mgbe ọ chụpụsịrị ha niile n’èzí, ọ kpọọrọ nna nwata ahụ na nne ya, na ndị sooro ya[b], wee banye ebe nwata ahụ nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ha nọ na-akwa ya emo.” Ngwaa Grik a nwere ike ịpụta ịchị mmadụ ọchị n’ụzọ mkparị.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ndị na-eso ụzọ ya sooro ya.
    reason: cross_reference
lexical_decisions:
- source_word: κατεγέλων
  choice: Ha nọ na-achị ya ọchị
  rationale: Nkebiokwu Igbo a na-egosi ịchị mmadụ ọchị n’ụzọ mkparị; “nọ na-” na-ebupụta omume na-aga n’ihu nke imperfect Grik na-egosi.
- source_word: ἐκβαλὼν πάντας
  choice: mgbe o zipụsịrị ha niile n’èzí
  rationale: Nke a na-egosi na o mere ka mmadụ niile pụọ tupu o mee ihe ndị ọzọ, ma zere okwu nwere ike ime ka onye na-agụ ya chee banyere ịchụ mmụọ ọjọọ.
- source_word: παραλαμβάνει
  choice: ọ kpọọrọ
  rationale: “Kpọọrọ” na-egosi na Jizọs họọrọ ndị a ka ha soro ya; ọ dabara nke ọma n’Igbo karịa ịsụgharị historical present ahụ n’ụzọ ga-ada ka okwu na-ekwekọghị n’usoro akụkọ.
- source_word: παιδίου / παιδίον
  choice: nwata
  rationale: “Nwata” na-edobe okwu Grik nke na-ekwu naanị na ọ bụ nwa, n’agbanyeghị na amaokwu ndị gbara ya gburugburu na-egosi na ọ bụ nwa agbọghọ.
- source_word: τοὺς μετ’ αὐτοῦ
  choice: ndị so ya
  rationale: Nke a na-edobe okwu Grik n’ụzọ doro anya ma ghara ịkpọ ndị ahụ aha kpọmkwem n’ahịrị bụ isi.
- source_word: εἰσπορεύεται
  choice: wee banye
  rationale: Usoro ngwaa “wee” bụ ụzọ dị ndụ ma bụrụkwa nke e ji akọ akụkọ n’Igbo; ọ na-egosi mmegharị ya ịbanye n’ebe nwata ahụ nọ.
- source_word: ὅπου ἦν τὸ παιδίον
  choice: ebe nwata ahụ nọ
  rationale: Nke a na-edobe nanị ihe Grik kwuru banyere ebe nwata ahụ nọ, n’etinyeghị na ọ dina ala.
theological_decisions:
- issue: Oge ngwaa na ịdị ndụ nke akụkọ
  choice: Jiri usoro akụkọ Igbo “ọ kpọọrọ … wee banye”
  alternative: 'Iṅomi historical present Grik n’ụzọ nkịtị: “ọ na-akpọrọ … na-abanye”'
  rationale: Mak ji historical present mee ka akụkọ dị ndụ, ma iṅomi ya n’Igbo ebe a ga-ada ka omume a na-eme ugbu a ma ọ bụ nke a na-eme ugboro ugboro. Usoro “wee” na-edobe ọsọ na ịdị ndụ nke akụkọ n’Igbo nkịtị.
- issue: Ndị e kwuru na ha so ya
  choice: Debe ya n’ahịrị bụ isi dị ka “ndị so ya,” ma kọwaa ha n’ala peeji
  alternative: Kpọọ ha “ndị na-eso ụzọ ya” ozugbo
  rationale: Okwu Grik n’onwe ya anaghị eji aha teknịkal “ndị na-eso ụzọ”; nsụgharị ahụ na-edobe nkọwa ya n’enweghị ịgbatị ya, ebe ihe gbara amaokwu ahụ gburugburu na-akọwa ndị ọ bụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Ịchị ya ọchị” bụ okwu nkịtị ma doo anya; “ịkwa ya emo” dị n’ala peeji iji gosi ike mkparị dị na ngwaa Grik. A hapụrụ “nwata” ka ọ ghara itinye “nwa agbọghọ” ebe amaokwu a n’onwe ya ji okwu na-anọpụ iche.
