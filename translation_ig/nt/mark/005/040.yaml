revisions:
- from: Ha nọ na-achị ya ọchị[a]. Ma mgbe o zipụsịrị ha niile n’èzí, ọ kpọọrọ nna nwata ahụ na nne ya, na ndị so ya[b], wee banye ebe nwata ahụ nọ.
  to: Ha nọ na-achị ya ọchị[a]. Ma mgbe ọ chụpụsịrị ha niile n’èzí, ọ kpọọrọ nna nwata ahụ na nne ya, na ndị sooro ya[b], wee banye ebe nwata ahụ nọ.
  rationale: The revision strengthens the rendering of ἐκβαλών from “sent out” to “drove out,” while retaining natural narrative Igbo. It also makes the reference to Jesus’ companions clearer and replaces the redundant explanatory footnote. No additional identity or theological interpretation is inserted into the main text.
