revisions:
- from: Ha bịakwutere Jizọs, hụ nwoke ahụ ndị mmụọ ọjọọ ji ka ọ nọ ọdụ, yi uwe, uche ya dokwara ya anya—onye ahụ Lijọn ji[a]—egwu wee tụọ ha.
  to: Ha bịakwutere Jizọs ma hụ nwoke ahụ ndị mmụọ ọjọọ jiburu ka ọ nọ ọdụ, yi uwe, uche ya bịara doo anya—onye ahụ Lijọn jiburu[a]—egwu wee tụọ ha.
  rationale: The revision retains the draft’s faithful rendering of demonic possession, clothing, restored mental soundness, and fear. It changes the possession clauses to “jiburu” so that the Igbo explicitly reflects the prior, now-ended state indicated by the Greek perfect participle in context. It also adds “ma” for natural narrative coordination and regularizes the transliterated designation as “Lijọn.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the scene, the three visible signs of restoration, and the crowd's fear. However, the unmarked present forms “ndị mmụọ ọjọọ ji” and especially “Lijọn ji” can imply that the man was still possessed. The Greek perfect participle ἐσχηκότα identifies him by the prior possession, which the immediate context shows has ended.
  naturalness: The overall register is clear Standard Igbo. Adding “ma” between the coordinated actions and using a past/completed relative verb produces a smoother narrative. “uche ya bịara doo anya” is a natural and clear expression of restored soundness of mind.
  terminology: “ndị mmụọ ọjọọ” appropriately retains the text’s claim of demonic affliction. “Lijọn” appropriately preserves the prior designation; it should not be replaced in the main text with “ìgwè ahụ,” which would obscure the allusion. The footnote can explain its Roman-military sense and possible descriptive reading without treating that reading as the primary text.
  issues:
  - severity: medium
    issue: The relative clauses “ndị mmụọ ọjọọ ji” and “Lijọn ji” are unmarked for past/completed possession.
    rationale: In this sentence they may naturally be heard as ongoing possession, whereas ἐσχηκότα, in its narrative context after the demons have departed, identifies the man as the one formerly possessed by Legion. “jiburu” safely expresses the completed prior state.
  - severity: low
    issue: The coordination after “Jizọs” lacks an explicit natural linker.
    rationale: The Greek repeats καί; Igbo “ma” naturally connects “they came” and “saw.”
  revised_text: Ha bịakwutere Jizọs ma hụ nwoke ahụ ndị mmụọ ọjọọ jiburu ka ọ nọ ọdụ, yi uwe, uche ya bịara doo anya—onye ahụ Lijọn jiburu[a]—egwu wee tụọ ha.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “ìgwè ahụ.” Okwu Grik bụ λεγιών (Lijọn), aha otu nnukwu ìgwè ndị agha Rom; n'ebe a, ọ na-ekwughachi aha ndị mmụọ ọjọọ ahụ kpọrọ onwe ha na mbụ.
    reason: alternative_reading
  revision_rationale: The revision retains the draft’s faithful rendering of demonic possession, clothing, restored mental soundness, and fear. It changes the possession clauses to “jiburu” so that the Igbo explicitly reflects the prior, now-ended state indicated by the Greek perfect participle in context. It also adds “ma” for natural narrative coordination and regularizes the transliterated designation as “Lijọn.”
