id: MRK.5.15
reference: Mark 5:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: ig
  text: Ha bịakwutere Jizọs ma hụ nwoke ahụ ndị mmụọ ọjọọ jiburu ka ọ nọ ọdụ, yi uwe, uche ya bịara doo anya—onye ahụ Lijọn jiburu[a]—egwu wee tụọ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ìgwè ahụ.” Okwu Grik bụ λεγιών (Lijọn), aha otu nnukwu ìgwè ndị agha Rom; n'ebe a, ọ na-ekwughachi aha ndị mmụọ ọjọọ ahụ kpọrọ onwe ha na mbụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχονται
  choice: Ha bịakwutere
  rationale: Ọ bụ historical present n'asụsụ Grik; oge gara aga dabara n'usoro akụkọ Igbo ma na-egosi na ha bịarutere nso Jizọs.
- source_word: θεωροῦσιν
  choice: hụ
  rationale: Ọ bụkwa historical present. “Hụ” bụ okwu Igbo doro anya ma na-egosi ihe ha ji anya ha lee n'ebe ahụ.
- source_word: δαιμονιζόμενον
  choice: nwoke ahụ ndị mmụọ ọjọọ ji
  rationale: Nkebiokwu a na-akọwa nwoke a maara n'akụkọ ahụ dị ka onye ndị mmụọ ọjọọ na-achịbu; ọ naghị eme ka okwu ahụ bụrụ naanị ọrịa uche.
- source_word: καθήμενον
  choice: ka ọ nọ ọdụ
  rationale: Nke a na-egosi ọnọdụ ọhụụ ha hụrụ ya na ya, n'Igbo dị mfe ma bụrụ nke e ji akọ akụkọ.
- source_word: ἱματισμένον
  choice: yi uwe
  rationale: Ọ na-egosi ọnọdụ ya e weghachiri eweghachi, dị iche na ọnọdụ ya tupu oge a; “yi uwe” bụ Igbo nkịtị ma doo anya.
- source_word: σωφρονοῦντα
  choice: uche ya dokwara ya anya
  rationale: Nke a na-egosi na echiche ya na njide onwe ya alaghachila n'ọnọdụ kwesịrị ekwesị, n'ekwughị ya dịka naanị nchọpụta ahụike.
- source_word: ἐσχηκότα
  choice: onye ahụ ... ji
  rationale: Perfect participle ahụ na-akọwa onye ọ bụ site n'ọnọdụ o nwere na mbụ nke ka dị mkpa n'ịmata ya; usoro gbara ya gburugburu na-eme ka o doo anya na ọnọdụ ahụ agwụla.
- source_word: λεγιῶνα
  choice: Lijọn
  rationale: A hapụrụ aha/aha-nkọwa ahụ n'ụdị e si asụ ya n'Igbo, ka njikọ ya na okwu ndị mmụọ ahụ kwuru na mbụ ghara ịla n'iyi.
- source_word: ἐφοβήθησαν
  choice: egwu wee tụọ ha
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma kwesị ekwesị isi kwuo na ụjọ jidere ha mgbe ha hụrụ ihe ahụ.
theological_decisions:
- issue: Otu e si kọwaa ọchịchị ndị mmụọ ọjọọ n'ahụ nwoke ahụ
  choice: nwoke ahụ ndị mmụọ ọjọọ ji
  alternative: nwoke ahụ mmụọ ọjọọ bi n'ime ya
  rationale: Nhọrọ a na-edobe nkwupụta akụkọ ahụ banyere ike ndị mmụọ ọjọọ n'ezie, ma ọ naghị eme ka ọ bụrụ naanị ọrịa ma ọ bụ jiri okwu ochie na-adịghị mfe nghọta.
- issue: Ma λεγιών bụ aha kpọmkwem ka ọ bụ aha-nkọwa
  choice: Lijọn
  alternative: ìgwè ahụ
  rationale: N'ebe a okwu ahụ na-ezo aka n'aha ndị mmụọ ahụ nyere onwe ha na mbụ, ma asụsụ Grik nwekwara ike ime ka a ghọta ya dịka aha-nkọwa. E debere “Lijọn” n'ahịrị ukwu ma kọwaa ụzọ ọzọ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-edobe mgbanwe atọ a hụrụ n'ahụ nwoke ahụ—ịnọ ọdụ, iyi uwe, na inwe uche doro anya—tinyekwara mmeghachi omume ụjọ nke ndị bịara.
