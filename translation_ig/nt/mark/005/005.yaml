  text: καὶ διὰ παντὸς νυκτὸς καὶ ἡμέρας ἐν τοῖς ⸂μνήμασιν καὶ ἐν τοῖς ὄρεσιν⸃ ἦν κράζων καὶ κατακόπτων ἑαυτὸν λίθοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: ig
  text: N’abalị na n’ehihie niile[a], ọ nọ n’etiti ili na n’ugwu, na-eti mkpu ma na-eji nkume na-egbutu onwe ya ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ nọgidere na-eti mkpu ma na-eji nkume na-egbusi onwe ya ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: Mgbe niile, n’abalị na n’ehihie
  rationale: “Mgbe niile” na-egosipụta omume na-aga n’ihu mgbe niile, ebe “n’abalị na n’ehihie” na-edobe akụkụ oge abụọ ahụ na usoro ha dị n’asụsụ Grik.
- source_word: μνήμασιν
  choice: ili ndị ahụ
  rationale: “Ili” bụ okwu Igbo doro anya maka ebe e liri ndị nwụrụ anwụ, ọ pụkwara ịgụnye ili ndị a wara n’oké nkume n’ọnọdụ a.
- source_word: ὄρεσιν
  choice: ugwu
  rationale: “Ugwu” bụ ntụgharị kpọmkwem na nke e ji eme ihe n’Igbo maka ὄρος, n’ejighị aka anyị gbanwee ya ka ọ bụrụ naanị obere ugwu.
- source_word: ἦν κράζων
  choice: ọ nọ … na-eti mkpu
  rationale: Usoro a na-egosi na omume ahụ nọ na-aga n’ihu n’oge gara aga; “ọ nọ … na-eti mkpu” na-egosipụta nke a n’Igbo dị mfe ma dị ndụ.
- source_word: κατακόπτων ἑαυτὸν
  choice: na-eji nkume ebiri onwe ya ahụ
  rationale: Nke a na-egosi imerụ onwe ya ahụ site n’ịbiri ahụ, ma ọ naghị agbakwụnye nkọwa siri ike karịa ihe okwu Grik kwuru.
- source_word: λίθοις
  choice: na-eji nkume
  rationale: 'Nke a na-egosipụta dative nke ngwa ọrụ: nkume bụ ihe o ji eme ya.'
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, sụgharịa amaokwu ahụ. E debere nkwughachi omume na-aga n’ihu nke dị n’asụsụ Grik, ma zere ịgbakwunye nkọwa gbasara ihe mere nwoke ahụ ji eme omume ndị a.
