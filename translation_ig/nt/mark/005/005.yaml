    text: Ma ọ bụ, “ọ nọgidere na-eti mkpu ma na-eji nkume na-egbusi onwe ya ahụ.”
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s continuous night-and-day action, its plural/generic settings, and the durative verbal sense. It replaces unclear phrasing for self-cutting with idiomatic Standard Igbo and supplies a clear stronger lexical alternative in the footnote.
