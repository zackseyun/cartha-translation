revisions:
- from: Mgbe niile[a], n’abalị na n’ehihie, ọ nọ n’etiti ili ndị ahụ nakwa n’ugwu, na-eti mkpu ma na-eji nkume ebiri onwe ya ahụ.
  to: N’abalị na n’ehihie niile[a], ọ nọ n’etiti ili na n’ugwu, na-eti mkpu ma na-eji nkume na-egbutu onwe ya ahụ.
  rationale: The revision retains the source’s continuous night-and-day action, its plural/generic settings, and the durative verbal sense. It replaces unclear phrasing for self-cutting with idiomatic Standard Igbo and supplies a clear stronger lexical alternative in the footnote.
  reviewer_model: gpt-5.6-terra
