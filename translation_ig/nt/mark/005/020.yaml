  text: καὶ ἀπῆλθεν καὶ ἤρξατο κηρύσσειν ἐν τῇ Δεκαπόλει ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς, καὶ πάντες ἐθαύμαζον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: ig
  text: Ọ wee pụọ, malite ikwusa n’ime Dekapọlis ihe niile Jizọs meere ya[a]; mmadụ niile wee juo anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otú ihe Jizọs meere ya si dị ukwuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: Ọ wee pụọ
  rationale: Aorist nke ἀπέρχομαι na-egosi na ọ hapụrụ ebe ahụ; “pụọ” bụ okwu Igbo dị mfe ma kwekọọ n’usoro akụkọ.
- source_word: ἤρξατο κηρύσσειν
  choice: malite ikwusa
  rationale: “Malite” na-egosipụta mmalite omume ahụ, ebe “ikwusa” na-egosi nkwupụta n’ihu ọha n’enweghị echiche agbakwunyere banyere okwuchukwu e mere n’usoro ofufe.
- source_word: ἐν τῇ Δεκαπόλει
  choice: n’ime Dekapọlis
  rationale: Nke a na-edobe isi echiche nke ἐν, ya bụ na ọ kwusara n’ógbè a kpọrọ Dekapọlis, n’agbakwụnyeghị “n’ebe niile” nke na-adịghị kpọmkwem n’ederede.
- source_word: ὅσα
  choice: ihe niile
  rationale: ὅσα nwere ike ịpụta oke ihe e mere ma ọ bụ ihe niile e mere. “Ihe niile” bụ Igbo ebumpụta ụwa; akara ntụaka na-edobe ụzọ ọzọ bụ “otú ihe Jizọs meere ya si dị ukwuu.”
- source_word: ἐποίησεν αὐτῷ
  choice: Jizọs meere ya
  rationale: Dative αὐτῷ n’ebe a na-egosi ihe e mere maka ọdịmma ya. “Meere ya” na-egosipụta nke a n’Igbo nke ọma.
- source_word: πάντες
  choice: onye ọ bụla
  rationale: Nke a na-enye πάντες dịka mkpokọta mmadụ niile n’Igbo dị ugbu a, n’agbakwụnyeghị aha ọzọ na-adịghị na Grik.
- source_word: ἐθαύμαζον
  choice: o jukwara ... anya
  rationale: Akpaala okwu Igbo “iju mmadụ anya” na-enye echiche nke ịtụnanya; usoro ahụ na-anabata “onye ọ bụla” dịka isiokwu mkpokọta, ebe imperfect Grik na-akọ mmeghachi omume na-aga n’ihu n’akụkọ ahụ.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: E ji ụdị nsụgharị aha a na-ahụkarị n’Igbo Standard nye aha ahụ.
theological_decisions:
- issue: Oke ihe nwoke ahụ kwusara banyere onye Jizọs bụ
  choice: A sụgharịrị ya dịka ịkọ ihe Jizọs meere ya, n’enweghị nkọwa ozizi agbakwunyere.
  alternative: Ịgbasa ya ka o kwuo hoo haa na ọrụ ahụ gosiri ọchịchị ma ọ bụ chi nke Jizọs.
  rationale: Amaokwu ahụ na-akọ akaebe nwoke ahụ na ịtụnanya mmadụ niile. Ọ na-egosi ike pụrụ iche nke Jizọs, ma ọ naghị ekwupụta nkwubi okwu ozizi n’ụzọ doro anya.
translation_notes:
  register: Igbo Standard dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere “Dekapọlis” dịka aha ógbè akụkọ ihe mere eme, ma jiri usoro akụkọ “wee” mee ka amaokwu ahụ na-aga nke ọma.
