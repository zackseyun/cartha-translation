- from: Ọ wee pụọ, malite ikwusa n’ime Dekapọlis ihe niile Jizọs meere ya[a]; o jukwara onye ọ bụla anya.
  to: Ọ wee pụọ, malite ikwusa n’ime Dekapọlis ihe niile Jizọs meere ya[a]; mmadụ niile wee juo anya.
  rationale: The revision retains the draft’s faithful rendering of ὅσα as “ihe niile” and retains its alternative in the footnote. It replaces the ambiguous final idiom with “mmadụ niile wee juo anya,” explicitly representing πάντες as the people who were amazed. The Greek imperfect need not be mechanically marked in this concise Igbo narrative context.
