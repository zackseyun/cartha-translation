  text: καὶ ἤρξαντο παρακαλεῖν αὐτὸν ἀπελθεῖν ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/017.yaml
  text: And they began to beg him to leave their region[a].
translation:
  language: ig
  text: Ha wee malite ịrịọsi ya ike ka ọ pụọ n’ógbè ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ọ hapụ ókèala ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: wee
  rationale: N’akụkọ Igbo, “wee” na-ejikọta ihe a na ihe bu ya ụzọ n’ụzọ ebumpụta ụwa, na-enweghị itinye nkọwa ọhụrụ.
- source_word: ἤρξαντο
  choice: malite
  rationale: Ọ na-egosipụta mmalite nke omume nke infinitive na-esochi ya.
- source_word: παρακαλεῖν
  choice: ịrịọsi ... ike
  rationale: N’ọnọdụ a, okwu ahụ karịrị ịrịọ nkịtị; ọ na-egosi arịrịọ siri ike, ebe ọ ka na-ahapụ ohere nke echiche ‘ịgba ume/ịkwagide.’
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs dịka onye ha na-arịọ.
- source_word: ἀπελθεῖν
  choice: ka ọ pụọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’okwu ahụ si gosi ihe ha rịọrọ ya ime.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: n’ógbè ha
  rationale: ὅρια nwere ike ịpụta ókèala n’onwe ya, ma n’akpaokwu a ọ na-ezo aka n’ala ma ọ bụ mpaghara dị n’ime ókè ha.
