  yaml_path: translation/nt/mark/005/027.yaml
  text: having heard about Jesus[a], she came up behind him in the crowd and touched his garment.
translation:
  language: ig
  text: Mgbe ọ nụsịrị ihe banyere Jizọs, ọ bịara n’azụ ya n’etiti igwe mmadụ ahụ, metụ uwe ya aka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “uwe elu ya” ma ọ bụ “uwe ọ yi.” Okwu Grik bụ ἱμάτιον, nke na-ezo aka n’uwe n’ozuzu ya, ọtụtụ mgbe uwe a na-eyi n’elu uwe ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα
  choice: Mgbe ọ nụsịrị
  rationale: Nke a na-egosi na ịnụ banyere Jizọs buru ụzọ mee tupu o metụ uwe ya aka, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: banyere Jizọs
  rationale: περί tinyere genitive pụtara ‘banyere’ ma ọ bụ ‘nke metụtara’; ‘banyere Jizọs’ bụ okwu Igbo doro anya ma bụrụkwa nke e ji eme ihe kwa ụbọchị.
- source_word: ἐλθοῦσα
  choice: o ... bata
  rationale: Aorist participle a na-egosi mmegharị ya bịakwute Jizọs tupu isi omume ahụ; ‘bata’ dabara n’ọnọdụ ya n’etiti igwe mmadụ.
- source_word: ἐν τῷ ὄχλῳ
  choice: n’etiti igwe mmadụ ahụ
  rationale: ἐν na dative ebe a na-egosi ebe ihe mere, ya bụ, n’ime ma ọ bụ n’etiti igwe mmadụ ahụ.
- source_word: ὄπισθεν
  choice: si n’azụ ya
  rationale: Ọ na-egosi na nwanyị ahụ si n’azụ Jizọs bịakwute ya; a gbakwụnyere ‘ya’ maka nghọta doro anya dịka ọnọdụ akụkọ si dị.
- source_word: ἥψατο
  choice: metụ ... aka
  rationale: N’ọnọdụ a, ἅπτω pụtara imetụ ihe aka; nsụgharị a adịghị etinye echiche nke ijidesi ike ma ọ bụ ịrapara n’ahụ.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: uwe ya
  rationale: ἱμάτιον nwere ike ịpụta uwe n’ozuzu ya, karịchaa uwe elu; ‘uwe ya’ na-edobe ịdị obosara nke okwu Grik ahụ n’enweghị ịkọwa ụdị uwe kpọmkwem.
theological_decisions: []
translation_notes:
  register: 'E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A gbanwere participle ndị Grik ka ha bụrụ usoro ahịrịokwu Igbo sitere n’okike, ma e debe usoro omume ahụ: ọ nụrụ, o si n’azụ bata, wee metụ uwe ahụ aka. E debere akara nkọwa [a] ozugbo n’ebe ‘uwe ya’ dị, n’ihi na nkọwa ahụ metụtara ἱμάτιον.'
