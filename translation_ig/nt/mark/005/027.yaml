review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders hearing about Jesus, the crowd setting, the approach from behind, and the touching of his garment. However, “o si n’azụ ya bata n’etiti igwe mmadụ ahụ” can mean that she entered the crowd from behind him, rather than that she came up behind him while in the crowd. The revised wording preserves the Greek spatial relationship more clearly.
  naturalness: “Mgbe ọ nụsịrị ihe banyere Jizọs” and “ọ bịara n’azụ ya n’etiti igwe mmadụ ahụ” are clear, natural Standard Igbo narrative phrasing. The revised footnote avoids using “akwa ya,” which more readily denotes cloth/fabric than clothing.
  terminology: “Jizọs,” “igwe mmadụ,” “metụ ... aka,” and “uwe” are suitable Standard Igbo choices. “Uwe elu” remains an appropriate lexical alternative for ἱμάτιον, without requiring that sense in the main text.
  issues:
  - severity: medium
    issue: The phrase “o si n’azụ ya bata n’etiti igwe mmadụ ahụ” has a potentially misleading attachment of “n’etiti igwe mmadụ ahụ.”
    rationale: It can describe her entering into the crowd from behind Jesus, whereas ἐν τῷ ὄχλῳ ὄπισθεν describes her coming behind him within the crowd. Reordering the Igbo phrase makes the intended relation clear.
  - severity: low
    issue: The footnote alternative “akwa ya” is not the best equivalent for “his clothing.”
    rationale: In ordinary Igbo, “akwa” commonly denotes cloth or fabric. “Uwe ọ yi” more naturally conveys clothing while retaining the broad lexical alternative.
  revised_text: Mgbe ọ nụsịrị ihe banyere Jizọs, ọ bịara n’azụ ya n’etiti igwe mmadụ ahụ, metụ uwe ya aka.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “uwe elu ya” ma ọ bụ “uwe ọ yi.” Okwu Grik bụ ἱμάτιον, nke na-ezo aka n’uwe n’ozuzu ya, ọtụtụ mgbe uwe a na-eyi n’elu uwe ọzọ.
    reason: lexical_alternative
  revision_rationale: The revision removes a possible ambiguity in the movement phrase while retaining the source sequence and the concise narrative register. It also refines the lexical footnote’s broader-clothing alternative for natural Igbo usage.
