- from: Mgbe ọ nụsịrị banyere Jizọs, o si n’azụ ya bata n’etiti igwe mmadụ ahụ, metụ uwe ya aka.[a]
  to: Mgbe ọ nụsịrị ihe banyere Jizọs, ọ bịara n’azụ ya n’etiti igwe mmadụ ahụ, metụ uwe ya aka.[a]
  rationale: The revision removes a possible ambiguity in the movement phrase while retaining the source sequence and the concise narrative register. It also refines the lexical footnote’s broader-clothing alternative for natural Igbo usage.
