  yaml_path: translation/nt/mark/005/025.yaml
  text: And there was a woman who had been suffering from a flow of blood for twelve years,[a]
translation:
  language: ig
  text: E nwekwara otu nwanyị, onye ọbara na-agba kemgbe afọ iri na abụọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye nwere ọbara ọgbụgba” ma ọ bụ “onye nwere mgbapụta ọbara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: nọkwa ebe ahụ
  rationale: Ọ na-ejikọta onye ọhụrụ a na akụkọ na-aga n’ihu ma na-echekwa ụdị njikọ dị mfe Mak ji ede.
- source_word: γυνὴ
  choice: Otu nwaanyị
  rationale: Aha a enweghị article n’asụsụ Grik, ọ na-ewebatakwa onye ọhụrụ; “otu nwaanyị” bụ ụzọ Igbo si eme nke a n'ụzọ nkịtị.
- source_word: οὖσα
  choice: onye ... nọ na-agba
  rationale: Participial construction a na-akọ ọnọdụ na-aga n’ihu; usoro a bụ Igbo dị ndụ nke na-egosi na ọnọdụ ahụ nọgidere.
- source_word: ἐν ῥύσει αἵματος
  choice: ọbara nọ na-agba
  rationale: Nkebiokwu ahụ pụtara ịnọ n’ọnọdụ mgbapụ ọbara; nsụgharị a doro ndị nkịtị anya ma ghara ịkọwa kpọmkwem ebe ọbara ahụ si apụta karịa ihe Grik kwuru.
- source_word: ῥύσει
  choice: na-agba
  rationale: Ọ na-echekwa echiche nke ihe na-asọpụta ma na-ada nke ọma n’okwu Igbo gbasara ọbara.
- source_word: αἵματος
  choice: ọbara
  rationale: Nke a bụ nhata kpọmkwem na nke doro anya.
- source_word: δώδεκα ἔτη
  choice: kemgbe afọ iri na abụọ
  rationale: Accusative a na-egosi ogologo oge; “kemgbe” na-egosi na ọnọdụ ahụ malitere n’oge gara aga wee ruo oge akụkọ a.
