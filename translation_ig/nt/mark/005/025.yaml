review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the woman and the twelve-year duration, but “nọkwa ebe ahụ” adds the unexpressed location “there” and makes the connective carry more meaning than καὶ. The revised wording retains the narrative introduction without that addition. “Ọbara na-agba” suitably renders the stated condition without specifying its cause or source.
  naturalness: “E nwekwara otu nwanyị, onye ọbara na-agba kemgbe afọ iri na abụọ” is clear, idiomatic Standard Igbo, and appropriately preserves the compact, participant-introducing form of the Greek.
  terminology: “Ọbara na-agba” is a natural non-technical expression for the flow/bleeding. The alternative “ọbara ọgbụgba” is retained only in the footnote; “ọrịa” is removed because the Greek names a condition rather than explicitly calling it a disease.
  issues:
