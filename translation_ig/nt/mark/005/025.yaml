    issue: The phrase “nọkwa ebe ahụ” adds a location not present in the Greek.
    rationale: καὶ introduces the next narrative element, but the verse does not state “there” or otherwise locate the woman with ἐκεῖ/another locative expression.
  - severity: low
    issue: The footnote’s “ọrịa mgbapụ ọbara” introduces “disease.”
    rationale: ἐν ῥύσει αἵματος describes her condition as a flow/discharge of blood; it does not explicitly characterize it as an illness.
