  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: ig
  text: Ozugbo ahụ, Jizọs matara n’ime onwe ya na ike esitela n’ebe ọ nọ pụọ. Ọ tụgharịrị n’etiti igwe mmadụ ahụ, sị, “Ònye metụrụ uwe m aka?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: Ozugbo ahụ
  rationale: Ọ na-egosi na ihe a mere n’egbughị oge ma na-echekwa ọsọ akụkọ Mak.
- source_word: ἐπιγνοὺς ἐν ἑαυτῷ
  choice: matara n’ime onwe ya
  rationale: Nke a na-egosi na Jizọs ghọtara ihe ahụ n’ime onwe ya, ọ bụghị site n’ihe ọ hụrụ n’èzí.
- source_word: δύναμιν
  choice: ike
  rationale: “Ike” bụ okwu Igbo sara mbara ma doo anya nke na-anaghị etinye nkọwa karịrị ihe Grik kwuru.
- source_word: ἐξ αὐτοῦ … ἐξελθοῦσαν
  choice: esiwo n’ime ya pụọ
  rationale: Ụdị a na-egosi na ike ahụ apụworị n’ebe Jizọs nọ tupu ọ mata ya, dịka njikọ participle Grik si dị.
- source_word: ἐπιστραφεὶς ἐν τῷ ὄχλῳ
  choice: Ọ tụgharịrị n’etiti igwe mmadụ ahụ
  rationale: Ọ na-egosi omume Jizọs nke ịtụgharị ahụ ebe ọ nọ n’etiti igwe mmadụ.
- source_word: ἥψατο τῶν ἱματίων
  choice: metụrụ uwe m aka
  rationale: “Metụrụ … aka” bụ ụzọ Igbo nkịtị si kwuo ‘touched,’ ebe “uwe” nwere ike ịpụta uwe mmadụ n’ozuzu ya ma ghara ime ka plural Grik bụrụ otu ụdị uwe pụrụ iche.
theological_decisions:
- issue: Ike si n’ebe Jizọs nọ pụọ
  choice: 'E debere okwu akụkọ ahụ n’ụzọ kwụ ọtọ: “ike esiwo n’ime ya pụọ.”'
  alternative: Ịkọwa ya kpọmkwem dịka “ike ịgwọ ọrịa” ma ọ bụ mee ya naanị mmetụta Jizọs chere.
  rationale: Grik kwuru δύναμις, “ike,” n’akọwaghị usoro ọrụ ebube ahụ. Nsụgharị ahụ na-echekwa nkwupụta na mgbagwoju anya dị n’akụkọ ahụ n’enweghị mgbakwunye ozizi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu abụọ ahụ na-eme ka usoro omume doo anya, ebe ajụjụ “Ònye metụrụ uwe m aka?” na-ada ka okwu mmadụ ga-ekwu n’Igbo nkịtị.
