- from: Ozugbo ahụ, Jizọs matara n’ime onwe ya na ike esiwo n’ime ya pụọ. Ọ tụgharịrị n’etiti igwe mmadụ ahụ, sị, “Ònye metụrụ uwe m aka?”
  to: Ozugbo ahụ, Jizọs matara n’ime onwe ya na ike esitela n’ebe ọ nọ pụọ. Ọ tụgharịrị n’etiti igwe mmadụ ahụ, sị, “Ònye metụrụ uwe m aka?”
  rationale: Replaced only “esiwo n’ime ya pụọ” with “esitela n’ebe ọ nọ pụọ” to distinguish the source phrase “from him” from the preceding, correctly retained phrase “within himself.” The past-perfect sense remains clear, and no doctrinal explanation has been added.
