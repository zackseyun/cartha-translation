  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀνέστη τὸ κοράσιον καὶ περιεπάτει, ἦν γὰρ ἐτῶν δώδεκα. καὶ ἐξέστησαν ⸁εὐθὺς ἐκστάσει μεγάλῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/042.yaml
  text: And immediately the girl stood up and began walking[a], for she was twelve years old[b]. And immediately they were overcome with great amazement.
translation:
  language: ig
  text: Ozugbo ahụ, nwa agbọghọ ahụ biliri ọtọ[a] wee malite ịga ije, n’ihi na ọ dị afọ iri na abụọ. Ozugbo ahụ, oke ihe ijuanya jidere ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “biliri.” Ngwaa Grik a nwekwara ike ịpụta “si n’ọnọdụ ya bilie.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ okwu Grik si dị kpọmkwem, “ha juru anya n’oké ihe ijuanya.” E ji ngwaa na aha sitere n’otu mgbọrọgwụ mesie ịdị ukwuu nke ihe ijuanya ha ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: ozugbo ahụ
  rationale: Ọ na-echekwa ọsọ na ịdị ngwa nke akụkọ Mak, ma bụrụkwa okwu Igbo doro anya ma na-adị mfe nghọta.
- source_word: ἀνέστη
  choice: biliri ọtọ
  rationale: N’ebe a, ngwaa ahụ na-egosi na nwa agbọghọ ahụ si n’ọnọdụ ọ dina bilie. ‘Biliri ọtọ’ bụ Igbo eke, ọ naghịkwa etinye n’amaokwu ahụ okwu nkà mmụta okpukpe karịrị ihe ngwaa Grik n’onwe ya kwuru.
- source_word: κοράσιον
  choice: nwa agbọghọ ahụ
  rationale: Okwu a na-ezo aka n’ụmụ nwanyị ka dị obere. Ebe amaokwu ahụ kwuru kpọmkwem na ọ dị afọ iri na abụọ, ọ dịghị mkpa ịgbakwụnye nkọwa afọ ọzọ.
- source_word: περιεπάτει
  choice: wee malite ịga ije
  rationale: Ụdị imperfect nke ngwaa Grik na-egosi omume gara n’ihu mgbe o biliri; ‘malite ịga ije’ na-enye mmalite na ịga n’ihu nke omume ahụ n’Igbo dị mfe.
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: n’ihi na ọ dị afọ iri na abụọ
  rationale: ‘Ọ dị afọ iri na abụọ’ bụ ụzọ Igbo nkịtị si ekwu afọ mmadụ, ebe ‘n’ihi na’ na-egosipụta ọrụ nkọwa nke γάρ.
- source_word: ἐξέστησαν
  choice: ihe ijuanya jidere ha
  rationale: N’ọnọdụ a, ngwaa ahụ na-egosi na ihe ahụ tụrụ ha n’anya nke ukwuu. Akpaalaokwu Igbo a na-ebupụta mmetụta ahụ n’enweghị ntụgharị siri ike nke na-agaghị ada ka Igbo eke.
- source_word: ἐκστάσει μεγάλῃ
  choice: oke ihe ijuanya
  rationale: Nkebiokwu a na-emesi ịdị ukwuu nke ịtụnanya ha ike. ‘Oke ihe ijuanya’ doro anya ma zere okwu ndị nwere ike ime ka onye na-agụ ya chee banyere ọnọdụ mmụọ pụrụ iche na-abụghị isi okwu ebe a.
theological_decisions:
- issue: Mmetụta mbilite n’ọnwụ nwere ike ịdị n’okwu ἀνέστη
  choice: biliri ọtọ
  alternative: biliri
  rationale: Ọnọdụ akụkọ ahụ gosiri na e mere ka nwa agbọghọ ahụ dịghachi ndụ, ma ngwaa Grik ahụ nwekwara ike ịpụta nanị isi n’ala ma ọ bụ n’ihe ndina bilie. Ya mere, ntụgharị a na-ekwupụta omume anụ ahụ ahụ n’enweghị ịmanye okwu ahụ ka ọ bụrụ okwu pụrụ iche maka mbilite n’ọnwụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. A họọrọ ‘ozugbo ahụ’ iji debe ọsọ akụkọ Mak; a họpụkwara akpaalaokwu ‘oke ihe ijuanya jidere ha’ kama ịmanye mmegharị okwu Grik n’Igbo na-adịghị eke.
