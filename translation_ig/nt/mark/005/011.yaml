  yaml_path: translation/nt/mark/005/011.yaml
  text: There was there near the mountain a large herd of pigs feeding[a][b].
translation:
  language: ig
  text: N’ebe ahụ, nso ugwu ahụ[a], e nwere nnukwu ìgwè ezi na-eri nri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’akụkụ ugwu ahụ.” Okwu Grik πρὸς τῷ ὄρει na-egosi ebe dị nso ma ọ bụ n’akụkụ ugwu ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “na-ata nri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: e nwere
  rationale: Nke a na-egosi na ihe ahụ dị n’ebe ahụ; a hapụrụ δέ ka usoro akụkọ na njikọ okwu Igbo mee ka ọ pụta ìhè n’enweghị itinye okwu oge na-adịghị na isi mmalite.
- source_word: ἐκεῖ
  choice: N’ebe ahụ
  rationale: Nke a bụ ntụgharị doro anya na nke eke maka okwu na-egosi ebe.
- source_word: πρὸς τῷ ὄρει
  choice: n’akụkụ ugwu ahụ
  rationale: πρός tinyere dative ebe a na-egosi ịnọ nso ma ọ bụ n’akụkụ ugwu; okwu Igbo a na-edobe obosara nghọta ahụ.
- source_word: ἀγέλη
  choice: ìgwè
  rationale: “Ìgwè” bụ okwu Igbo a na-aghọta nke ọma maka ọtụtụ anụmanụ nọkọtara ọnụ.
- source_word: χοίρων
  choice: ezi
  rationale: “Ezi” bụ okwu Igbo nkịtị, nke oge a, maka χοῖρος; ọ dịghị mkpa iji okwu ochie ma ọ bụ pụrụ iche.
- source_word: μεγάλη
  choice: nnukwu
  rationale: N’ebe a ọ na-akọwa ịdị ukwuu nke ìgwè ahụ, ma n’ọnụọgụ ma ọ bụ n’ogo n’ozuzu.
- source_word: βοσκομένη
  choice: na-ata nri
  rationale: Nke a na-egosi na ezi ndị ahụ nọ na-eri nri; ọ bụ okwu eke n’Igbo ma ọ naghị amachi nri ahụ naanị n’ahịhịa.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị nsọ n’ụdị akụkọ. A họọrọ “n’akụkụ” iji chekwaa echiche ọnọdụ nke πρός + dative n’enweghị ịkọwa ebe ahụ kpọmkwem karịa isi mmalite. A họọrọ “ezi” kama okwu Bekee ochie “swine,” ebe ọ bụ okwu Igbo nkịtị kwesịrị ekwesị.
