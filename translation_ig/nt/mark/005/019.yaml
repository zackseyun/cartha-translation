id: MRK.5.19
reference: Mark 5:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καὶ οὐκ ἀφῆκεν αὐτόν, ἀλλὰ λέγει αὐτῷ· Ὕπαγε εἰς τὸν οἶκόν σου πρὸς τοὺς σούς, καὶ ⸀ἀπάγγειλον αὐτοῖς ὅσα ⸂ὁ κύριός σοι⸃ πεποίηκεν καὶ ἠλέησέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: ig
  text: Ma o kweghị ka ọ soro ya; kama ọ sịrị ya, “Laa n’ụlọ gị, gakwuru ndị nke gị,[a] kọọrọ ha ihe niile Onyenwe anyị[b] meere gị, na otú o si meere gị ebere.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a bụ ‘ndị nke gị.’ Ọ pụrụ ịgụnye ezinụlọ ya, ndị ikwu ya, na ndị ọzọ ya na ha dị nso.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ na-aghọta ‘Onyenwe anyị’ ebe a dịka Chineke kpọmkwem; ndị ọzọ na-ahụ na Mak na-edebe njikọ dị n’etiti ebere Chineke na ikike Jizọs na ihe o mere.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφῆκεν
  choice: o kweghị ya
  rationale: N’ebe a, ἀφίημι pụtara ikwe ka mmadụ mee ihe ọ rịọrọ, ọ bụghị ‘ịgbaghara’ ma ọ bụ ‘ịhapụ.’ ‘O kweghị ya’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: λέγει
  choice: ọ sịrị ya
  rationale: Ọ bụ ezie na Grik ji historical present, oge gara aga na-ada nke ọma n’akụkọ Igbo ma ọ naghị agbanwe ihe ọ pụtara.
- source_word: Ὕπαγε
  choice: Laa
  rationale: Iwu a na-agwa ya ka ọ pụọ laghachi ebe ọ bi; ‘Laa’ bụ okwu Igbo dị nkenke ma bụrụ nke e ji agwa mmadụ ka ọ gaa ebe a kpọrọ aha.
- source_word: εἰς τὸν οἶκόν σου
  choice: n’ụlọ gị
  rationale: οἶκος nwere ike ịpụta ụlọ, ebe obibi, ma ọ bụ ezinụlọ. N’ebe a, ‘n’ụlọ gị’ na-egosi ịlaghachi n’ebe obibi ya n’ụzọ ebumpụta ụwa.
- source_word: πρὸς τοὺς σούς
  choice: gakwuru ndị nke gị
  rationale: 'Nkebiokwu Grik a pụtara n’ụzọ nkịtị ‘gakwuru ndị nke gị.’ Nhọrọ a na-edebe obosara ya: ọ pụrụ ịgụnye ezinụlọ, ndị ikwu, na ndị ya na ha dị nso, kama imechi ya naanị n’otu ìgwè.'
- source_word: ἀπάγγειλον
  choice: kọọrọ ha
  rationale: ἀπαγγέλλω pụtara ịkọ ma ọ bụ ịgwa ndị ọzọ akụkọ banyere ihe mere. ‘Kọọrọ ha’ bụ Igbo nkịtị ma na-egosi inye ha akụkọ ahụ.
- source_word: ὅσα
  choice: ihe niile
  rationale: ὅσα na-ezo aka n’ihe Onyenwe anyị meere ya n’ozuzu ya. ‘Ihe niile’ na-enye echiche ahụ n’ụzọ doro anya ma dị mfe nghọta.
- source_word: ὁ κύριός σοι
  choice: Onyenwe anyị meere gị
  rationale: A na-edebe κύριος dị ka ‘Onyenwe anyị,’ ebe σοι jikọtara na ngwaa dị ka ‘meere gị.’ Nke a na-ezere ịkọwa ya n’ụzọ dị warara dịka ‘Chineke’ ma ọ bụ ‘nna gị ukwu.’
- source_word: ἠλέησέν σε
  choice: o si meere gị ebere
  rationale: ἐλεάω pụtara imere mmadụ ebere. Usoro ‘otú o si meere gị ebere’ na-edebe ịdị arọ nke okwu ebere ma jikọta ya nke ọma na ihe a ga-akọrọ ha.
theological_decisions:
- issue: Ihe κύριος na-ezo aka n’ebe Jizọs kwuru banyere ihe ‘Onyenwe anyị’ mere
  choice: Onyenwe anyị
  alternative: Chineke
  rationale: '‘Onyenwe anyị’ na-edebe okwu Grik κύριος nakwa esemokwu bara uru dị n’akụkọ ahụ: Jizọs gwọrọ nwoke ahụ, ma gwa ya ka ọ kọọ ihe Onyenwe anyị mere na ebere o meere ya. Ịsụgharị ya ozugbo dịka ‘Chineke’ ga-ekpebi ihe ederede ahụ hapụrụ ka onye na-agụ ya tụlee.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro akụkọ Igbo nkịtị, ma na-edebe obosara nke ‘ndị nke gị’ na mgbagwoju anya nke ‘Onyenwe anyị’ n’emebighị ha.
