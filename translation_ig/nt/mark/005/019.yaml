- from: Ma o kweghị ya; kama ọ sịrị ya, “Laa n’ụlọ gị, gakwuru ndị nke gị,[a] kọọrọ ha ihe niile Onyenwe anyị meere gị, na otú o si meere gị ebere.”[b]
  to: Ma o kweghị ka ọ soro ya; kama ọ sịrị ya, “Laa n’ụlọ gị, gakwuru ndị nke gị,[a] kọọrọ ha ihe niile Onyenwe anyị[b] meere gị, na otú o si meere gị ebere.”
  rationale: The revision clarifies the sense ‘did not permit him’ without altering the narrative meaning and relocates the theological footnote marker to the precise term it explains. It retains the draft’s faithful treatment of the broad phrase ‘ndị nke gị,’ the comprehensive force of ‘ihe niile,’ and the unresolved referent of κύριος.
