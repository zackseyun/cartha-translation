- from: O wee soro ya gawa. Oké ìgwè mmadụ nọ na-eso ya, na-asụgidekwa ya gburugburu.[a]
  to: O wee soro ya gawa. Oké ìgwè mmadụ nọ na-eso ya, na-apịgidekwa ya.[a]
  rationale: 'The revision replaces an awkward construction with an idiomatic Standard Igbo verb that communicates the Greek συνέθλιβον: the crowd was physically pressing Jesus closely. It retains the imperfect sense through “nọ na-eso” and “na-apịgidekwa,” and preserves the footnote anchor and lexical alternatives.'
