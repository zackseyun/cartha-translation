base_translation:
  language: en
  yaml_path: translation/nt/mark/005/024.yaml
  text: And he went with him[a]. And a large crowd was following him and pressing around him.
translation:
  language: ig
  text: O wee soro ya gawa. Oké ìgwè mmadụ nọ na-eso ya, na-apịgidekwa ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-apịakwasị ya” ma ọ bụ “na-akpagide ya.” Ngwaa Grik ahụ na-egosi na ìgwè mmadụ ahụ nọ na-apịgide Jizọs n'ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: wee gawa
  rationale: Ngwaa a dị n'ụdị aorist ma na-akọ mmegharị Jizọs dịka nzaghachi nye Jairọs. “Wee gawa” bụ Igbo dị mfe ma kwekọọ n'usoro akụkọ ahụ.
- source_word: μετ’ αὐτοῦ
  choice: soro ya
  rationale: μετά na genitive na-egosi iso mmadụ aga; “soro ya” na-egosipụta nke a n'ụzọ ebumpụta ụwa n'Igbo.
- source_word: ἠκολούθει
  choice: nọ na-eso
  rationale: Imperfect a na-egosi omume na-aga n'ihu; “nọ na-eso” na-echekwa echiche ahụ.
- source_word: ὄχλος πολύς
  choice: Oké ìgwè mmadụ
  rationale: ὄχλος pụtara ìgwè mmadụ, πολύς na-egosikwa ịdị ukwuu ya. “Oké ìgwè mmadụ” bụ okwu doro anya ma dị ugwu n'Igbo ugbu a.
- source_word: συνέθλιβον
  choice: na-asụgidekwa ... gburugburu
  rationale: Ngwaa a na-egosi na ìgwè mmadụ ahụ juru ebe ahụ ma na-apịakọta Jizọs site n'akụkụ dị iche iche. “Na-asụgidekwa ya gburugburu” na-egosi nrụgide ahụ n'anaghị ekwu na ha merụrụ ya ahụ.
- source_word: αὐτόν
  choice: ya
  rationale: Nnochiaha a na-ezo aka na Jizọs, onye ìgwè mmadụ ahụ na-asụgide.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu, dee ya. E chekwara usoro akụkọ na omume ndị na-aga n'ihu; a hapụkwara nnochiaha ndị dị na mmalite amaokwu ahụ ka ihe gbara ya gburugburu kọwaa ndị a na-ekwu maka ha.
