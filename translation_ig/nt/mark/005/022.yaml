review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the partitive sense ('otu onye n’ime'), Jairus’s name, the temporal participle, and his falling at Jesus’ feet without turning the gesture into explicit worship. However, 'ndị Juu' is not expressed in the Greek text. Although a synagogue is historically Jewish, that adjective is an unnecessary explicit addition in this verse.
  naturalness: The phrasing is clear and idiomatic Standard Igbo. 'Otu onye n’ime ndị isi ụlọ nzukọ' is smoother and sufficiently specific without the added ethnic qualifier.
  terminology: '''Ndị isi ụlọ nzukọ'' appropriately conveys ἀρχισυναγώγων as synagogue leaders/rulers. ''Jaịrọs'' is an appropriate established Igbo-form name. The historical-present footnote is accurate and properly anchored to the narrative verbs.'
  issues:
  - severity: low
    issue: The text adds 'ndị Juu' ('Jewish') to 'ụlọ nzukọ'.
    rationale: The Greek has ἀρχισυναγώγων, 'synagogue leaders/rulers,' but does not include an ethnic adjective. The Jewish character of a synagogue is historical background and need not be made explicit in the translated wording.
  revised_text: Otu onye n’ime ndị isi ụlọ nzukọ, aha ya bụ Jaịrọs, bịara. Mgbe ọ hụrụ ya, ọ dara n’ụkwụ ya.[a]
