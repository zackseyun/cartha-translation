id: MRK.5.22
reference: Mark 5:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καὶ ἔρχεται εἷς τῶν ἀρχισυναγώγων, ὀνόματι Ἰάϊρος, καὶ ἰδὼν αὐτὸν πίπτει πρὸς τοὺς πόδας αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: ig
  text: Otu onye n’ime ndị isi ụlọ nzukọ, aha ya bụ Jaịrọs, bịara. Mgbe ọ hụrụ ya, ọ dara n’ụkwụ ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, e ji oge ugbu a kwuo “ọ na-abịa” na “ọ na-ada” iji mee ka akụkọ ahụ dị ka ihe na-eme ugbu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: bịara
  rationale: Ọ bụ ezie na Grik ji oge ugbu a kọọ ihe gara aga iji mee ka akụkọ dị ndụ, oge gara aga bụ ụzọ ebumpụta ụwa e si akọ ụdị ihe a n’Igbo.
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: otu onye n’ime ndị isi ụlọ nzukọ ndị Juu
  rationale: Nke a na-edobe echiche nke otu onye sitere n’etiti ọtụtụ ndị ndu na-ahụ maka ụlọ nzukọ ndị Juu, n’asụsụ Igbo doro anya.
- source_word: ὀνόματι Ἰάϊρος
  choice: aha ya bụ Jaịrọs
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kọwaa aha onye ahụ.
- source_word: ἰδὼν αὐτὸν
  choice: mgbe ọ hụrụ ya
  rationale: Nkebiokwu oge a na-egosi na ịhụ ya buru ụzọ mee tupu ọ daa n’ụkwụ ya, ma ọ naghị etinye nkọwa ọzọ na-adịghị na Grik.
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: ọ dara n’ụkwụ ya
  rationale: Nke a na-egosipụta omume anụ ahụ nke ịda n’ihu mmadụ n’arịrịọ ma ọ bụ nsọpụrụ, n’etinyeghị okwu siri ike karịa nke Grik.
theological_decisions:
- issue: Ihe ọdịda Jaịrọs n’ụkwụ Jizọs pụtara
  choice: ọ dara n’ụkwụ ya
  alternative: ọ kpọrọ ya isiala / ọ fee ya ofufe
  rationale: Grik kọwara omume ahụ n’onwe ya, ma o kwughị hoo haa na ọ bụ ofufe. Nsụgharị ahụ na-ahapụ ohere ka omume ahụ gosi nsọpụrụ, obi mgbawa, ma ọ bụ arịrịọ n’ebughị ụzọ kpebie ihe ọ pụtara n’ụzọ okpukpe.
- issue: Onye nnọchiaha αὐτόν/αὐτοῦ na-ezo aka na ya
  choice: ya
  alternative: Jizọs
  rationale: Grik ji nnọchiaha mee ihe. Igbo nwekwara ike idebe nnọchiaha ahụ, ebe gburugburu akụkọ na-eme ka o doo anya na ọ na-ezo aka na Jizọs, n’agbanyeghị na amaokwu a naanị ya ekwughị aha ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ụlọ nzukọ ndị Juu” na-eme ka ihe ἀρχισυνάγωγος na-ezo aka na ya doo onye na-agụ Igbo anya; “ndị isi” na-egosipụta ọrụ ndu na nlekọta n’etinyeghị nkọwa ụka pụrụ iche.
