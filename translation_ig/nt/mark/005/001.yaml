    text: Ụfọdụ akwụkwọ aka ochie gụrụ “ndị Gadara”; ndị ọzọ gụrụ “ndị Gergesa.”
    reason: textual_variant
  revision_rationale: The revision preserves every element of the Greek text and the SBLGNT place-name reading while using idiomatic Standard Igbo. “Bịarutere” supplies the plural “they came/arrived”; “n’ofe nke ọzọ” renders εἰς τὸ πέραν; and “n’ala ndị Gerasa” naturally renders the region associated with the Gerasenes. The footnote continues to document the significant manuscript alternatives.
