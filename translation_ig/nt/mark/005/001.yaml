source:
  edition: SBLGNT
  text: Καὶ ἦλθον εἰς τὸ πέραν τῆς θαλάσσης εἰς τὴν χώραν τῶν ⸀Γερασηνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/001.yaml
  text: And they came to the other side of the sea[a], to the region of the Gerasenes.
translation:
  language: ig
  text: Ha bịarutere n’ofe nke ọzọ nke oké osimiri ahụ, n’ala ndị Gerasa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie gụrụ “ndị Gadara”; ndị ọzọ gụrụ “ndị Gergesa.”
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ
  choice: Ha
  rationale: N'Igbo, ịmalite ahịrịokwu a na nnọchiaha ahụ na-eme ka njikọ akụkọ si n'amaokwu gara aga pụta nke ọma, n'enweghị itinye echiche oge dịka 'Mgbe ahụ.'
- source_word: ἦλθον
  choice: bịakwutere
  rationale: Okwu a na-egosi na Jizọs na ndị ya na ha so rutere ebe ahụ; 'bịakwutere' bụ Igbo dị ndụ ma na-edobe ọtụtụ mmadụ nke ngwaa Grik.
- source_word: εἰς τὸ πέραν
  choice: nʼofe nke ọzọ
  rationale: Nke a na-egosi akụkụ ọzọ nke mmiri ahụ, ma na-edobe echiche ntụziaka dị n'okwu Grik.
- source_word: τῆς θαλάσσης
  choice: nke oké osimiri ahụ
  rationale: Ọ bụ ezie na ebe a bụ ọdọ mmiri Galili, θαλάσσης pụtara 'oké osimiri'; nsụgharị ahụ na-edobe okwu isi mmalite na ojiji a na-ahụkarị n'Oziọma.
- source_word: εἰς τὴν χώραν
  choice: ruo nʼógbè
  rationale: '''Ógbè'' na-egosi mpaghara ma ọ bụ ala dị n''okpuru otu obodo, ọ bụghị mba n''echiche nke oge a.'
- source_word: Γερασηνῶν
  choice: ndị Gerasin
  rationale: A họọrọ ụdị aha ndị bi na Gerasa nke dabara n'Igbo, na-agbaso ọgụgụ SBLGNT Γερασηνῶν.
theological_decisions:
- issue: Ọdịiche ederede na aha ebe n'akụkọ nwoke mmụọ ọjọọ ji
  choice: ndị Gerasin
  alternative: ndị Gadarin; ndị Gergesen
  rationale: SBLGNT gụrụ Γερασηνῶν. Ebe akwụkwọ aka ochie dị iche n'aha a, e debere ọgụgụ isi mmalite n'ahụ amaokwu ma gosipụta isi ọgụgụ ndị ọzọ na nkọwa ala peeji.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E debere usoro akụkọ n'ụzọ dị mkpirikpi, ma e zere ịkọwa 'oké osimiri' dịka 'ọdọ mmiri' n'ahụ amaokwu.
