revisions:
- from: Ha bịakwutere nʼofe nke ọzọ nke oké osimiri ahụ, ruo nʼógbè ndị Gerasin[a].
  to: Ha bịarutere n’ofe nke ọzọ nke oké osimiri ahụ, n’ala ndị Gerasa[a].
  rationale: The revision preserves every element of the Greek text and the SBLGNT place-name reading while using idiomatic Standard Igbo. “Bịarutere” supplies the plural “they came/arrived”; “n’ofe nke ọzọ” renders εἰς τὸ πέραν; and “n’ala ndị Gerasa” naturally renders the region associated with the Gerasenes. The footnote continues to document the significant manuscript alternatives.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:25Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the plural arrival, the opposite side of the sea, and the SBLGNT reading Γερασηνῶν. However, “bịakwutere ... ruo” combines two arrival/directional expressions awkwardly, and the gentilic forms in the note are better rendered transparently as people identified with the place names.
  naturalness: “Ha bịarutere ... n’ala ndị Gerasa” is natural, modern Standard Igbo. It avoids the redundant movement wording in the draft while retaining the concise narrative register.
  terminology: “Oké osimiri” appropriately retains the source’s “sea,” rather than interpreting it as a lake. “Ala ndị Gerasa” accurately conveys χώρα τῶν Γερασηνῶν as the territory/region of the Gerasenes. The textual-variant note retains the alternatives without presenting one as preferable.
  issues:
  - severity: medium
    issue: Redundant and awkward directional phrasing
    rationale: “Ha bịakwutere n’ofe ... ruo n’ógbè” uses both “bịakwutere” and “ruo” to express arrival/movement, producing an unnatural construction in Igbo.
  - severity: low
    issue: Place-name gentilic forms in the footnote
    rationale: '“ndị Gadarin” and “ndị Gergesen” are less transparent and less idiomatic than identifying the groups by their place names: “ndị Gadara” and “ndị Gergesa.”'
  revised_text: Ha bịarutere n’ofe nke ọzọ nke oké osimiri ahụ, n’ala ndị Gerasa[a].
