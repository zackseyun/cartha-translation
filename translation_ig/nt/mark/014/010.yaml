  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Καὶ Ἰούδας ⸂Ἰσκαριὼθ ὁ⸃ εἷς τῶν δώδεκα ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς ἵνα αὐτὸν ⸂παραδοῖ αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/010.yaml
  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: ig
  text: Judas Iskarịọt, otu n’ime Ndị Iri na Abụọ, wee gakwuuru ndị isi nchụaja ka o nyefee ya n’aka ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka o rara ya nye ha.” Ngwaa Grik ahụ nwere ike ịpụta “inyefe n’aka”; ma n’ihe Judas mere, inyefe a bụ ịrara Jizọs nye.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: wee
  rationale: Njikọ akụkọ a na-egosi ihe omume sochiri nke gara aga n'ụzọ dị mfe ma dị mma n’Igbo.
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: Judas Iskarịọt
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị na-eme ka onye Igbo nwee ike ịgụ ya.
- source_word: ὁ εἷς τῶν δώδεκα
  choice: otu n’ime Ndịozi Iri na Abụọ
  rationale: Ọ bụ aha otu ahụ Jizọs họpụtara; itinye ‘Ndịozi’ na-eme ka ọ doo onye na-agụ Igbo anya n’enweghị mgbanwe n’ihe okwu ahụ na-ezo aka na ya.
- source_word: ἀπῆλθεν
  choice: gaa hụ
  rationale: N’ọnọdụ a, ọ na-egosi na Judas gara n’ebe ndị isi nchụaja nọ; ‘gaa hụ’ bụ okwu Igbo dị ndụ ma doo anya.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Ọtụtụ okwu Grik a na-ezo aka n’òtù ndị ndu nchụaja nọ na Jerusalem, ọ bụghị naanị otu nnukwu onye nchụaja.
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ na-egosipụta nzube njem Judas n’ụzọ nkịtị n’Igbo.
- source_word: παραδοῖ
  choice: nyefee ... n’aka
  rationale: Nke a na-echekwa isi nghọta sara mbara nke παραδίδωμι, ya bụ inyefe mmadụ n’aka ndị ọzọ, n’etinyeghị ‘rara nye’ naanị ya n’ahịrịokwu bụ isi.
- source_word: αὐτὸν ... αὐτοῖς
  choice: ya ... n’aka ha
  rationale: 'A hapụrụ nnọchiaha abụọ ahụ ka ha pụta ìhè dịka n’asụsụ Grik: ‘ya’ bụ Jizọs, ‘ha’ bụ ndị isi nchụaja.'
theological_decisions:
- issue: Otu e si sụgharịa παραδοῖ n’ọnọdụ Judas na-arara Jizọs nye
  choice: nyefee ya n’aka ha
  alternative: rara ya nye ha
  rationale: Ọ bụ eziokwu na omume Judas bụ ịrara Jizọs nye, ma ngwaa Grik sara mbara karịa nke ahụ, ọ pụkwara ịpụta inyefe mmadụ n’aka onye ọzọ. Nhọrọ a na-echekwa esemokwu na omimi dị n’akụkọ ahụ; nkọwa ala peeji na-egosi echiche nke ịrara nye.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji usoro okwu Igbo nkịtị mee ka ahịrịokwu ahụ na-aga were were, ma chekwaa nzube na nghọta sara mbara nke isi okwu Grik.
