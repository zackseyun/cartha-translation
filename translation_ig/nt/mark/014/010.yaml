revisions:
- from: Judas Iskarịọt, otu n’ime Ndịozi Iri na Abụọ, wee gaa hụ ndị isi nchụaja ka o nyefee ya n’aka ha.[a]
  to: Judas Iskarịọt, otu n’ime Ndị Iri na Abụọ, wee gakwuuru ndị isi nchụaja ka o nyefee ya n’aka ha.[a]
  rationale: The revision removes two small expansions while preserving the original’s narrative connection, the recognized designation “the Twelve,” Judas’s movement to the chief priests, the purpose clause, and the deliberately broad wording of παραδίδωμι. The existing footnote is retained because it appropriately identifies “betray” as a contextually valid alternative without forcing it into the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:22:36Z'
review_pass:
  verdict: revise
  source_fidelity: The main clause and purpose are substantially faithful, and “nyefee ya n’aka ha” appropriately preserves the broader sense of παραδοῖ. However, “gaa hụ” adds the idea of going to see/visit the chief priests, whereas ἀπῆλθεν πρὸς means simply that Judas went to them. “Ndịozi” is also additional identification not expressed in this verse; the source calls the group “the Twelve.”
  naturalness: The revised wording is natural Standard Igbo. “Gakwuru” accurately and idiomatically expresses movement to persons without adding a visit/meeting nuance.
  terminology: “Ndị Iri na Abụọ” retains the established designation corresponding to “the Twelve” without importing the additional title “apostles.” “Ndị isi nchụaja” and “nyefee ... n’aka” are suitable renderings. The footnote retains the lexical alternative of betrayal while keeping the main text less interpretive.
  issues:
  - severity: medium
    issue: “gaa hụ” renders ἀπῆλθεν πρὸς too specifically.
    rationale: It normally conveys going to see or visit someone. The Greek states only that Judas went to the chief priests; “gakwuru” preserves that scope.
  - severity: low
    issue: “Ndịozi” expands the designation “the Twelve.”
    rationale: Although the Twelve are apostles in the wider narrative, ὁ εἷς τῶν δώδεκα contains only the recognized group designation. “Ndị Iri na Abụọ” is more source-close and still clear in context.
  revised_text: Judas Iskarịọt, otu n’ime Ndị Iri na Abụọ, wee gakwuuru ndị isi nchụaja ka o nyefee ya n’aka ha.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka o rara ya nye ha.” Ngwaa Grik ahụ nwere ike ịpụta “inyefe n’aka”; ma n’ihe Judas mere, inyefe a bụ ịrara Jizọs nye.
    reason: lexical_alternative
  revision_rationale: The revision removes two small expansions while preserving the original’s narrative connection, the recognized designation “the Twelve,” Judas’s movement to the chief priests, the purpose clause, and the deliberately broad wording of παραδίδωμι. The existing footnote is retained because it appropriately identifies “betray” as a contextually valid alternative without forcing it into the main text.
