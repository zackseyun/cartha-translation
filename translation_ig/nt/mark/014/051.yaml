source:
  edition: SBLGNT
  text: Καὶ ⸂νεανίσκος τις⸃ ⸀συνηκολούθει αὐτῷ περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ, καὶ κρατοῦσιν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: ig
  text: Otu nwa okorobịa nọ na-eso ya, yi naanị ákwà línịn[a] n’elu ahụ ya gba ọtọ; ha ejide ya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ákwà ndina e ji línịn mee.” Okwu Grik σινδών nwere ike izo aka n’ákwà línịn ma ọ bụ n’ákwà sara mbara dị ka ákwà ndina.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεανίσκος τις
  choice: otu nwa okorobịa
  rationale: “Nwa okorobịa” na-egosi nwoke na-eto eto, ebe “otu” na-echekwa nghọta nke τις nke na-akọwa onye a na-akpọghị aha n’akụkọ ahụ.
- source_word: συνηκολούθει
  choice: nọ na-eso
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu n’oge gara aga; “nọ na-eso” na-echekwa nke a n’Igbo eke.
- source_word: αὐτῷ
  choice: ya
  rationale: N’ọnọdụ akụkọ a, nnọchiaha ahụ na-ezo aka na Jizọs.
- source_word: περιβεβλημένος
  choice: yi
  rationale: N’ebe a, participle ahụ na-akọwa ákwà e tinyere ma ọ bụ e fụchiri n’ahụ; “yi” bụ okwu Igbo dị mfe ma kwekọọ n’ụzọ e si eji ákwà ekpuchi ahụ.
- source_word: σινδόνα
  choice: otu ákwà línịn
  rationale: Okwu ahụ nwere ike ịpụta ákwà línịn ma ọ bụ ákwà yiri ákwà ndina; nsụgharị a anaghị ekpebi kpọmkwem ụdị ákwà ahụ, ebe nkọwa ala peeji na-echekwa ụzọ ọzọ.
- source_word: ἐπὶ γυμνοῦ
  choice: n’ahụ ya gba ọtọ
  rationale: Nke a na-egosi na ákwà ahụ dị n’ahụ gba ọtọ, n’enweghị uwe ọzọ n’okpuru ya.
- source_word: κρατοῦσιν
  choice: ha wee jide ya
  rationale: κρατέω pụtara ijide mmadụ n’ike n’ebe a. “Ha wee jide ya” bụ usoro akụkọ Igbo eke, ma ọ naghị akọwa ya karịa ka “ijide ya n’aka ndị ọchịchị” ga-eme.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’otu nwa okorobịa ahụ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị nsọ, mee ihe. “Nọ na-eso” na-egosi omume na-aga n’ihu; “ha wee jide ya” na-eme ka usoro akụkọ ahụ bụrụ nke eke n’Igbo. E debere rikoma n’ọgwụgwụ n’ihi na ahịrịokwu ahụ na-aga n’ihu n’amaokwu na-esonụ.
