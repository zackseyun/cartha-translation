revisions:
- from: Otu nwa okorobịa nọ na-eso ya. Ọ yi naanị otu ákwà línịn[a] n’ahụ ya gba ọtọ, ha wee jide ya,
  to: Otu nwa okorobịa nọ na-eso ya, yi naanị ákwà línịn[a] n’elu ahụ ya gba ọtọ; ha ejide ya,
  rationale: The revision keeps the imperfect sense in “nọ na-eso,” preserves the single-sentence connection and the participial clothing description, uses a more idiomatic expression for the bare body, and represents the Greek historical present with “ha ejide ya.” The comma is retained because the sentence continues in the following verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:00:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the young man, his ongoing following of Jesus, the linen cloth worn directly on his bare body, and the attempted seizure. However, the full stop separates a single Greek sentence, and “ha wee jide ya” recasts the Greek historical present κρατοῦσιν as a completed past action.
  naturalness: “N’ahụ ya gba ọtọ” is understandable but is less idiomatic and less precise than “n’elu ahụ ya gba ọtọ” for cloth worn over bare skin. Joining the clauses also produces a smoother Igbo narrative sentence.
  terminology: “Nwa okorobịa,” “ákwà línịn,” and “jide” are suitable Standard Igbo choices. The footnote should retain the lexical breadth of σινδών without implying that the item certainly was bedding.
  issues:
  - severity: medium
    issue: The historical present κρατοῦσιν is rendered as the past narrative form “ha wee jide ya.”
    rationale: Greek uses the vivid present “they seize him.” Igbo “ha ejide ya” better retains that present narration without adding an interpretive sense such as arrest.
  - severity: low
    issue: The sentence break after “ya” weakens the syntactic connection of the Greek sentence.
    rationale: The participial description belongs to the young man while he was following Jesus; retaining one sentence better reflects the source.
  - severity: low
    issue: “n’ahụ ya gba ọtọ” is awkward for the cloth’s position over bare skin.
    rationale: “n’elu ahụ ya gba ọtọ” naturally expresses that the linen cloth was worn upon his naked body.
  revised_text: Otu nwa okorobịa nọ na-eso ya, yi naanị ákwà línịn[a] n’elu ahụ ya gba ọtọ; ha ejide ya,
  revised_footnotes:
