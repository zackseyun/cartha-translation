id: MRK.14.50
reference: Mark 14:50
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀφέντες αὐτὸν ⸂ἔφυγον πάντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/050.yaml
  text: And leaving him, they all fled.
translation:
  language: ig
  text: Ha niile hapụrụ ya wee gbapụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Ejighị okwu njikọ pụrụ iche sụgharịa ya
  rationale: N'Igbo, ịga n'ihu n'akụkọ a dị mfe ma bụrụ ihe eke n'enweghị itinye “na”; nke a anaghị agbakwunye echiche nke oge ma ọ bụ nke ihe kpatara ihe.
- source_word: ἀφέντες
  choice: hapụrụ
  rationale: Okwu a na-egosi na ha hapụrụ Jizọs n'azụ. “Hapụrụ” bụ okwu Igbo doro anya ma dị mfe, ebe okwu ga-apụta kpọmkwem ‘gbahapụrụ’ nwere ike itinye nkwusi ike karịrị nke mkpụrụokwu Grik n'onwe ya chọrọ.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnochiaha a na-ezo aka na Jizọs, ma “ya” bụ nsụgharị Igbo kwụ ọtọ dabara n'ọnọdụ a.
- source_word: ἔφυγον
  choice: gbapụ
  rationale: Okwu a pụtara isi n'ihe egwu gbapụ. “Gbapụ” na-egosipụta ịgba ọsọ pụọ n'ụjọ ma na-edobe mkpụmkpụ na ịdị arọ nke akụkọ ahụ.
- source_word: πάντες
  choice: ha niile
  rationale: Nke a na-edobe nkwusi ike na ndị ahụ niile hapụrụ Jizọs; “ha niile” bụ ụzọ Igbo doro anya isi gosipụta mkpokọta ahụ.
theological_decisions:
- issue: Ókè mgbahapụ ndị na-eso ụzọ ahụ ruru
  choice: Ha niile hapụrụ ya gbapụ
  alternative: Ha hapụrụ ya, ha niile wee gbapụ
  rationale: Nsụgharị a na-edobe nkwupụta Grik na ndị niile nọ ya nso n'ọnọdụ ahụ gbapụrụ, n'emeghị ka okwu ahụ dị nro ma ọ bụ gbasaa ya karịa ihe ederede kwuru.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. Ahịrịokwu ahụ dị nkenke dịka Grik, ma jiri usoro okwu Igbo eke mee ka “ha niile” pụta ìhè.
