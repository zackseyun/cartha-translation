id: MRK.14.13
reference: Mark 14:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν πόλιν, καὶ ἀπαντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: ig
  text: O wee ziga mmadụ abụọ n’ime ndị na-eso ụzọ ya, sị ha, “Gaanụ n’ime obodo ahụ. Otu nwoke bu ite mmiri[a] ga-ezute unu. Soro ya,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ite ụrọ nke mmiri dị n’ime ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλει
  choice: O wee ziga
  rationale: Ụdị akụkọ ‘wee’ na-enye Igbo dị ndụ ma na-egosipụta ngagharị akụkọ nke present historical Grik n'ụzọ ebumpụta ụwa.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: mmadụ abụọ n’ime ndị na-eso ụzọ ya
  rationale: Ọ na-echekwa partitive construction ahụ ma jiri okwu Igbo doro ndị nkịtị anya maka μαθηταί.
- source_word: λέγει αὐτοῖς
  choice: sị ha
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke ebumpụta ụwa isi webata okwu mmadụ gwara ndị ọzọ.
- source_word: Ὑπάγετε εἰς τὴν πόλιν
  choice: Gaanụ n’ime obodo ahụ
  rationale: Imperative plural ‘Gaanụ’ na-echekwa iwu ahụ; ‘n’ime’ na-egosipụta ngagharị ịbanye nke εἰς.
- source_word: ἀπαντήσει ὑμῖν
  choice: ga-ezute unu
  rationale: Ọ na-echekwa future tense na echiche izute mmadụ, n’Igbo doro anya.
- source_word: ἄνθρωπος
  choice: Otu nwoke
  rationale: N’ebe a okwu ahụ na-ezo aka n’otu nwoke a kapịrị ọnụ, ọ bụghị mmadụ n’ozuzu.
- source_word: κεράμιον ὕδατος
  choice: ite mmiri
  rationale: Nke a bụ okwu Igbo dị mfe ma kpọmkwem maka arịa e ji ebu mmiri; nkọwa na ọ bụ ụrọ dị na nkọwa ala peeji.
- source_word: βαστάζων
  choice: bu
  rationale: ‘Bu’ bụ ngwaa Igbo nkịtị maka iburu ihe, ma na-egosipụta omume nwoke ahụ na-eme.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Soro ya
  rationale: Ọ bụ iwu kpọmkwem ma bụrụkwa ụzọ Igbo ebumpụta ụwa isi sụgharịa ‘Follow him.’
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri usoro akụkọ ‘O wee’ mee ka akụkọ Mak dị ndụ n’enweghị ịmanye present historical Grik n’ụdị na-adịghị ebumpụta ụwa n’Igbo. Akara nkọwa [a] dị ozugbo n’akụkụ okwu ọ na-akọwa.
