id: MRK.14.36
reference: Mark 14:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Αββα ὁ πατήρ, πάντα δυνατά σοι· παρένεγκε τὸ ποτήριον ⸂τοῦτο ἀπ’ ἐμοῦ⸃· ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: ig
  text: Ọ nọ na-asị[a], “Abba, Nna[b], ihe niile kwere gị omume. Wepụ iko a[c] n’ebe m nọ. Ma ọ bụghị ihe m chọrọ, kama ọ bụ ihe ị chọrọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ sịrị.” Oge imperfect n’asụsụ Grik nwere ike igosi na ọ nọgidere na-ekwu ma ọ bụ na-ekwughachi okwu ndị a.
    reason: lexical_alternative
  - marker: b
    text: “Abba” bụ okwu Arameik e ji akpọ nna; e debere ya n’ebe a tinyere okwu Grik pụtara “Nna.”
    reason: cultural_note
  - marker: c
    text: “Iko” bụ ihe atụ Akwụkwọ Nsọ maka ahụhụ e kenyere ya; tulee Mak 10:38.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ọ nọ na-asị
  rationale: Oge imperfect n’asụsụ Grik nwere ike igosi okwu na-aga n’ihu ma ọ bụ a na-ekwughachi; ntụgharị a na-echekwa akụkụ ahụ n’Igbo dị ugbu a.
- source_word: Αββα ὁ πατήρ
  choice: Abba, Nna
  rationale: E debere okwu Arameik “Abba,” tinyekwa nkọwa Grik ya dịka okwu a na-akpọ mmadụ, “Nna,” n’etinyeghị “nke m” nke na-apụtaghị kpọmkwem n’amaokwu a.
- source_word: πάντα δυνατά σοι
  choice: ihe niile ga-ekwe gị omume
  rationale: Nke a bụ ụzọ Igbo doro anya ma kwekọọ n’echiche ahụ bụ na ọ dịghị ihe gafere ike Chineke.
- source_word: παρένεγκε
  choice: Wepụ
  rationale: Iwu a na-arịọ ka e wepụ iko ahụ n’ebe onye na-ekwu okwu nọ; “Wepụ” dị nkenke ma bụrụkwa Igbo nkịtị.
- source_word: τὸ ποτήριον τοῦτο
  choice: iko a
  rationale: E chekwara ihe atụ nke “iko” kama ịkọwa ya ozugbo dịka ahụhụ, ka njikọ ya na asụsụ Akwụkwọ Nsọ na nrụgide nkà mmụta okpukpe ya ghara ifu.
- source_word: ἀπ’ ἐμοῦ
  choice: n’ebe m nọ
  rationale: Ya na “Wepụ,” nkebiokwu a na-enye echiche zuru ezu nke iwepụ iko ahụ n’ebe Jizọs nọ n’Igbo eke.
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: Ma ọ bụghị ihe m chọrọ, kama ọ bụ ihe ị chọrọ
  rationale: E tinyere ngwaa a ghọtara na nkebi nke abụọ iji mee ka Igbo doo anya, ma e chekwara ntụnyere dị n’etiti ọchịchọ Jizọs na nke Nna.
theological_decisions:
- issue: Ịsụgharị ụzọ abụọ Jizọs si kpọkuo Chineke, nke Arameik na nke Grik
  choice: Abba, Nna
  alternative: Abba, Nna m
  rationale: Ihe odide ahụ n’onwe ya debere “Abba” tinyere nkọwa Grik ya. Ịhapụ ha abụọ na-echekwa ọdịdị isi mmalite ahụ ma ghara ịgbakwunye nnọchiaha nwe “m” nke na-adịghị kpọmkwem n’ebe a.
- issue: Ichekwa ihe atụ nke “iko”
  choice: iko a
  alternative: ahụhụ a
  rationale: E kwesịghị ịkọwapụ ihe atụ ahụ n’ime isi amaokwu. N’ọnọdụ a, iko ahụ na-ezo aka n’ahụhụ e kenyere Jizọs, ma ide “iko” na-echekwa njikọ Akwụkwọ Nsọ na nghọta sara mbara nke okwu ahụ.
- issue: Ọdịiche dị n’etiti ihe Jizọs chọrọ na ihe Nna chọrọ
  choice: Ma ọ bụghị ihe m chọrọ, kama ọ bụ ihe ị chọrọ
  alternative: Ma ọ bụghị uche m, kama uche gị
  rationale: Nke a na-anọgide nso na ngwaa θέλω ma na-echekwa nrụgide dị n’ekpere ahụ n’enweghị ime ka ọ bụrụ okwu nkà mmụta okpukpe a kọwara karịa ihe odide ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Ọ nọ na-asị” chekwaa akụkụ imperfect; e debere “Abba” dịka okwu Arameik. Ihe nrịbama nkọwa ala peeji [a], [b], na [c] niile pụtara n’isi ederede n’ebe okwu ha na-akọwa dị.
