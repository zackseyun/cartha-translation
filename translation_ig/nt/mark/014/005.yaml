    issue: Coordination of the potential actions
    rationale: “a gaara ere ... nyekwa” mixes the impersonal passive-like sale construction with a subjunctive verb in a way that is less smooth. Repeating the conditional-potential construction across the coordinated actions improves clarity without changing the meaning.
