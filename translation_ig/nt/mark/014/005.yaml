  source_fidelity: 'The draft correctly conveys the explanatory γάρ, the unrealized possibility of ἠδύνατο ... πραθῆναι, the amount exceeding three hundred denarii, charitable giving, and the forceful rebuke. However, the numeral phrase should place the currency noun before the numeral: “denarị narị atọ,” not “narị denarị atọ.”'
  naturalness: The proposed revision retains clear, modern Standard Igbo. “A gaara ere ... ma nye ...” provides a smoother parallel construction than “a gaara ere ... nyekwa,” while “denarị narị atọ” is the natural noun-plus-numeral order.
  terminology: “Mmanụ na-esi ísì ọma” is an appropriate rendering of μύρον in this context, with the footnote preserving “ude na-esi ísì ọma” as a valid alternative. “Denarị” appropriately preserves the ancient monetary term. “Baara ya mba nke ukwuu” adequately conveys the severe censure denoted by ἐνεβριμῶντο.
