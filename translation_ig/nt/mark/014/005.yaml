  text: ἠδύνατο γὰρ τοῦτο ⸂τὸ μύρον⸃ πραθῆναι ἐπάνω ⸂δηναρίων τριακοσίων⸃ καὶ δοθῆναι τοῖς πτωχοῖς· καὶ ἐνεβριμῶντο αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: ig
  text: N’ihi na a gaara ere mmanụ a na-esi ísì ọma[a] n’ego karịrị denarị narị atọ ma nye ndị ogbenye ego ahụ.” Ha wee baara ya mba nke ukwuu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘ude na-esi ísì ọma.’
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘Ha wee katọọ ya nke ukwuu.’ Ngwaa Grik ahụ na-egosi oke iwe ma ọ bụ ịbara mmadụ mba n’ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: mmanụ na-esi ísì ọma
  rationale: Okwu a na-ezo aka na mmanụ ma ọ bụ ude e ji ihe na-esi ísì ọma mee; nsụgharị a bụ nke doro ndị Igbo nke oge a anya ma kwekọọ n’ihe dị oke ọnụ n’akụkọ a.
- source_word: πραθῆναι
  choice: a gaara ere
  rationale: Infinitive passive a na ἠδύνατο na-egosi ihe e nwere ike ime ma a naghị eme ya; ‘a gaara ere’ na-egosipụta nke a n’ụzọ Igbo ebumpụta ụwa.
- source_word: ἐπάνω
  choice: n’ego karịrị
  rationale: Mgbe ọ na-eso ọnụọgụ ego, ọ pụtara ego gafere ọnụego e kwuru.
- source_word: δηναρίων τριακοσίων
  choice: narị denarị atọ
  rationale: E degharịrị aha mkpụrụ ego ahụ kama ịgbanwe ya ka ọ bụrụ ego nke oge a, ka ọnọdụ akụkọ ihe mere eme ghara ịla n’iyi.
- source_word: δοθῆναι τοῖς πτωχοῖς
  choice: nyekwa ndị ogbenye ego ahụ
  rationale: N’usoro ahịrịokwu a, ihe a ga-enye ndị ogbenye bụ ego e nwetara n’ire mmanụ ahụ; itinye ‘ego ahụ’ na-eme ka ihe a na-ekwu doo anya n’Igbo n’enweghị ịgbanwe echiche isi mmalite.
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: Ha wee baara ya mba nke ukwuu
  rationale: Ngwaa Grik a na-egosi iwe siri ike ma ọ bụ ịkatọ mmadụ n’ọnụ; ‘baara ya mba nke ukwuu’ na-echekwa ike okwu ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-enye ihe kpatara mkpesa e kwuru n’amaokwu bu ụzọ.
- source_word: ἠδύνατο
  choice: a gaara
  rationale: N’ebe a, ọ na-egosi ohere e nwere ime ihe ma nke ahụ emeghị.
