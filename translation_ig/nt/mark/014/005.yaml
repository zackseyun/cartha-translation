  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere denarị dị ka aha mkpụrụ ego oge ahụ, ebe e mere ka njikọ dị n’etiti ire mmanụ ahụ na inye ndị ogbenye ego e nwetara doo anya.
