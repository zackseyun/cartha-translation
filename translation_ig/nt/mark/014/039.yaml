  text: καὶ πάλιν ἀπελθὼν προσηύξατο τὸν αὐτὸν λόγον εἰπών.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/039.yaml
  text: And again he went away and prayed[b][a], saying the same words.
translation:
  language: ig
  text: Ọ gakwara ọzọ kpee ekpere, na-ekwu otu okwu ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “otu ihe ahụ” ma ọ bụ “otu okwu ahụ o kwuru.” N'asụsụ Grik, e ji λόγος (“okwu”) mee ihe maka ọdịnaya ekpere ahụ ọ kwughachiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: ọzọ
  rationale: “Ọzọ” na-egosi na Jizọs mere ihe a ugboro ọzọ, ma na-aga nke ọma n'usoro akụkọ Igbo.
- source_word: ἀπελθὼν
  choice: Ọ pụrụ ... gaa
  rationale: Ngwakọta a na-egosi na ọ hapụrụ ebe ọ nọ gawa ebe ọzọ tupu o kpee ekpere, n'Igbo dị mfe ma kwekọọ n'usoro omume nke participle ahụ.
- source_word: προσηύξατο
  choice: kpee ekpere
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị akọwa προσεύχομαι; aorist middle adịghị achọ ka e tinye ihe pụrụ iche n'Igbo ebe a.
- source_word: τὸν αὐτὸν λόγον
  choice: otu okwu ahụ
  rationale: “Okwu” nwere ike ịpụta okwu e kwuru ma ọ bụ ọdịnaya nke ihe e kwuru. Ọ na-edobe ụdị singular nke λόγος ma ghara ime ka onye na-agụ ya chee na ọ bụ naanị otu mkpụrụokwu.
- source_word: εἰπών
  choice: kwuo
  rationale: “Kwuo” na-ejikọta omume ikwu ihe ahụ na ikpe ekpere, ma na-egosi ọdịnaya ekpere ahụ n'Igbo eke.
theological_decisions:
- issue: Ma τὸν αὐτὸν λόγον ọ̀ pụtara otu mkpụrụokwu ka ọ bụ otu ọdịnaya ekpere ahụ
  choice: otu okwu ahụ
  alternative: otu ihe ahụ / otu okwu ndị ahụ
  rationale: N'ebe a λόγος na-ezo aka n'ihe Jizọs kwuru n'ekpere, ọ bụghị naanị otu mkpụrụokwu. “Otu okwu ahụ” na-edobe okwu Greek n'ụdị singular ma ka na-enye ohere ka “okwu” pụta ihe e kwuru n'ozuzu ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị mfe ma dị nsọ dee ya. Usoro “pụ ... gaa kpee ekpere” bụ nke a na-aghọta nke ọma n'okwu nkịtị, ebe “otu okwu ahụ” na-echekwa ntakịrị mgbagwoju anya dị na λόγος.
