revisions:
- from: Mgbe ha nọ na-eri nri ka ha dabere n'akụkụ tebụl,[a] Jizọs sịrị, “N'ezie, ana m agwa unu,[b] otu onye n'ime unu ga-arara m nye—onye mụ na ya na-eri nri.”[c]
  to: Mgbe ha na-adabere n'akụkụ tebụl na-eri nri,[a] Jizọs sịrị, “N’ezie, ana m agwa unu,[b] otu onye n'ime unu ga-arara m nye[c]—onye ya na m na-eri nri.”
  rationale: The revision restores the source’s simultaneous actions, improves natural Standard Igbo in the final relative clause, and removes the unsupported recipient from the lexical alternative while retaining the contextual force of betrayal.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:56Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal sense of all source elements, including the table-reclining setting, Jesus’ solemn assertion, the partitive ‘one of you,’ and betrayal by a fellow diner. However, the opening construction (‘Mgbe ha nọ na-eri nri ka ha dabere...’) makes reclining sound consequent upon eating rather than simultaneous with it. The alternative for παραδώσει also adds ‘n'aka ndị ọzọ’ (‘to others’), which is not specified by the Greek.
  naturalness: The revised opening uses a natural simultaneous Igbo construction. ‘Onye ya na m na-eri nri’ is more idiomatic and directly foregrounds the source sense ‘the one eating with me’ than ‘onye mụ na ya na-eri nri.’
  terminology: ‘Ga-arara m nye’ appropriately communicates παραδώσει in this immediate context. The note preserves the broader lexical alternative ‘ga-enyefe m’ without adding an unspecified recipient. ‘N’ezie’ is a suitable modern, solemn rendering of Ἀμήν in the main text, with ‘Amen’ retained as an alternative.
  issues:
  - severity: medium
    issue: The temporal syntax at the opening is imprecise.
    rationale: '‘Mgbe ha nọ na-eri nri ka ha dabere n''akụkụ tebụl’ can imply that they reclined as a result of being in the act of eating. The Greek coordinates two simultaneous participles: reclining and eating.'
  - severity: low
    issue: The lexical footnote for παραδώσει adds ‘n'aka ndị ọzọ.’
    rationale: The Greek states only that the speaker will be handed over/betrayed; it does not identify the recipient in this verse. The alternative should preserve that openness.
  - severity: low
    issue: The final relative clause can be more idiomatic.
    rationale: ‘Onye ya na m na-eri nri’ is a more natural Standard Igbo expression for ‘the one eating with me.’
  revised_text: Mgbe ha na-adabere n'akụkụ tebụl na-eri nri,[a] Jizọs sịrị, “N’ezie, ana m agwa unu,[b] otu onye n'ime unu ga-arara m nye[c]—onye ya na m na-eri nri.”
  revised_footnotes:
