source:
  edition: SBLGNT
  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: ig
  text: Mgbe ha na-adabere n'akụkụ tebụl na-eri nri,[a] Jizọs sịrị, “N’ezie, ana m agwa unu,[b] otu onye n'ime unu ga-arara m nye[c]—onye ya na m na-eri nri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'oge ahụ, ndị mmadụ na-adabere n'akụkụ tebụl mgbe ha na-eri oriri pụrụ iche; ha anaghị anọ ọdụ n'oche dịka a na-emekarị taa.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “Amen, ana m agwa unu.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ga-enyefe m.” Okwu Grik ahụ nwere ike ịpụta inyefe mmadụ, ibuga ya n'aka mmadụ, ma ọ bụ ịrara ya nye; n'ọnọdụ a, ọ na-ekwu maka omume onye ya na Jizọs na-erikọ nri ga-eme megide ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακειμένων
  choice: ka ha dabere n'akụkụ tebụl
  rationale: Nke a na-egosi otú ndị mmadụ si adabere n'akụkụ tebụl mgbe ha na-eri oriri n'oge ahụ, kama ime ka a ghọta na ha nọ ọdụ dịka omenala taa.
- source_word: ἐσθιόντων / ἐσθίων
  choice: na-eri nri / na-eri nri
  rationale: Okwu Grik ahụ pụtara iri nri; ntụgharị a dị mfe ma bụrụkwa Igbo nkịtị. Nkebi ikpeazụ na-egosi onye ahụ ya na Jizọs na-eri nri.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: N'ezie, ana m agwa unu
  rationale: Nke a na-egosipụta nkwupụta siri ike na nke doro anya nke Jizọs, n'Igbo dị ugbu a; e debere ụdị nkịtị karị n'okpuru amaokwu.
- source_word: εἷς ἐξ ὑμῶν
  choice: otu onye n'ime unu
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ doro anya na onye ahụ bụ otu n'ime ndị nọ n'ìgwè ahụ.
- source_word: παραδώσει
  choice: ga-arara m nye
  rationale: N'ọnọdụ a, inyefe Jizọs n'aka ndị iro bụ omume aghụghọ nke otu onye ya na ya nọ; “ịrara nye” na-egosi ma inyefe ya ma mmebi ntụkwasị obi ahụ.
- source_word: μετ’ ἐμοῦ
  choice: mụ na ya
  rationale: Nke a bụ ntụgharị Igbo ebumpụta ụwa nke na-egosi na onye ahụ na Jizọs nọkọrọ na-eri nri.
theological_decisions:
- issue: Ntụgharị παραδώσει n'akụkọ ahụhụ Jizọs
  choice: ga-arara m nye
  alternative: ga-enyefe m n'aka ndị ọzọ
  rationale: Okwu Grik ahụ nwere ike ịpụta inyefe mmadụ, ma ọnọdụ a na-egosi na onye ha na Jizọs na-erikọ nri ga-eji aghụghọ nyefee ya. A hapụrụ ntụgharị nkịtị karị n'okpuru amaokwu iji chekwaa obosara ihe okwu ahụ pụtara.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. E chekwara ọnọdụ iri nri nke oge ochie na ịdị arọ nke okwu Jizọs, ma zere ịgbakwunye nkọwa okpukpe na-adịghị n'ederede.
