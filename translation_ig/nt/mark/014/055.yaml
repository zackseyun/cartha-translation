  to: Ndị isi nchụaja na kansụl ahụ dum nọ na-achọ ihe akaebe megide Jizọs, ka ha wee gbuo ya, ma ha anaghị achọta nke ọ bụla.[a]
  rationale: The revision restores the singular collective reference of συνέδριον and better reflects the imperfect aspect of ηὕρισκον, while preserving the legal setting, purpose clause, and the source text's contrast without adding interpretation.
