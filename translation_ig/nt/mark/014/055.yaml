  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς καὶ ὅλον τὸ συνέδριον ἐζήτουν κατὰ τοῦ Ἰησοῦ μαρτυρίαν εἰς τὸ θανατῶσαι αὐτόν, καὶ οὐχ ηὕρισκον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: ig
  text: Ndị isi nchụaja na kansụl ahụ dum nọ na-achọ ihe akaebe megide Jizọs, ka ha wee gbuo ya, ma ha anaghị achọta nke ọ bụla.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ kapịrị ọnụ, “Sanhedrin ahụ dum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ndị
  rationale: A hapụrụ δέ ka usoro akụkọ na njikọ ahịrịokwu gosipụta ya; itinye okwu oge dịka ‘ugbu a’ ga-agbakwụnye ihe na-adịghị n'okwu Grik.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Nke a bụ okwu Igbo doro anya maka ọtụtụ ndị ndu nchụaja nọ na Jerusalem, ọ bụghị naanị otu nnukwu onye nchụaja.
- source_word: ὅλον τὸ συνέδριον
  choice: ndị kansụl ahụ niile
  rationale: ‘Kansụl’ na-enye echiche nke òtù ọchịchị na-ekpe ikpe; ‘niile’ na-echekwa ὅλον. Ihe odide ala peeji na-enye aha akụkọ ihe mere eme bụ Sanhedrin.
- source_word: ἐζήτουν
  choice: nọ na-achọ
  rationale: Ọdịdị imperfect na-egosi omume gara n'ihu, ya mere ‘nọ na-achọ’ ka mma karịa nanị ‘chọrọ.’
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: megide Jizọs
  rationale: κατά ya na genitive ebe a na-egosi akaebe e zubere iji megide Jizọs.
- source_word: μαρτυρίαν
  choice: ihe akaebe
  rationale: N'ọnọdụ ikpe a, okwu a na-ezo aka n'ihe ndị akaebe ga-ekwu ma ọ bụ ihe ga-akwado ebubo; ‘ihe akaebe’ bụ okwu Igbo nkịtị ma doo anya.
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: ka ha wee gbuo ya
  rationale: Usoro a na-egosi ebumnuche. ‘Gbuo ya’ na-ebupụta θανατόω n'ụzọ doro anya n'Igbo, ebe ọnọdụ ikpe ahụ na-egosi na ọ bụ ime ka a maa ya ikpe ọnwụ.
- source_word: καὶ οὐχ ηὕρισκον
  choice: ma ha ahụghị nke ọ bụla
  rationale: Ọ bụ ezie na καί bụkarị ‘na,’ ‘ma’ na-eme ka ọdịiche dị n'etiti ịchọ ha na enweghị ihe ha chọtara pụta n'Igbo nkịtị. ‘Nke ọ bụla’ na-ezo azụ n'ihe akaebe.
theological_decisions:
- issue: Njirimara συνέδριον
  choice: ndị kansụl ahụ niile
  alternative: Sanhedrin ahụ niile
  rationale: Okwu Grik na-akpọ òtù ikpe ahụ kansụl; ịsụgharị ihe ọ pụtara na-enyere onye na-agụ Igbo aka, ebe ihe odide ala peeji na-echekwa aha akụkọ ihe mere eme ya.
- issue: Ebumnuche nke ịchọ ihe akaebe
  choice: ka ha wee gbuo ya
  alternative: ka ha wee mee ka a maa ya ikpe ọnwụ
  rationale: E chekwara ebumnuche ọnwụ nke εἰς τὸ θανατῶσαι αὐτόν n'okwu dị mfe, n'etinyeghị nkọwa ọzọ banyere usoro iwu nke okwu Grik ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa omume gara n'ihu n'ịchọ akaebe, ọdịiche nke na ha ahụghị ya, na aha kansụl ahụ n'ụzọ onye nkịtị ga-aghọta.
