    text: Ma ọ bụ, n'ụzọ kapịrị ọnụ, “Sanhedrin ahụ dum.”
    reason: lexical_alternative
  revision_rationale: The revision restores the singular collective reference of συνέδριον and better reflects the imperfect aspect of ηὕρισκον, while preserving the legal setting, purpose clause, and the source text's contrast without adding interpretation.
