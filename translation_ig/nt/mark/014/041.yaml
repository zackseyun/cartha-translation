revisions:
- from: Ọ bịakwara nke ugboro atọ wee sị ha[a], “Ụnụ ka na-ehi ụra ma na-ezu ike? O zuola[c]; oge ahụ eruola. Lee, a na-enyefe Nwa nke Mmadụ n’aka ndị mmehie.”
  to: Ọ bịara nke ugboro atọ, wee sị ha[a], “Ụnụ ka na-ehi ụra ma na-ezu ike? O zuola[c]; oge ahụ eruola. Lee, a na-enyefe Nwa nke Mmadụ n’aka ndị mmehie.”
  rationale: A small revision removes the additive implication of “-kwa” in the opening verb. The disputed force of the sleeping-and-resting clause remains represented as a question in the text and as an ironic/permissive alternative in footnote a. Footnote wording has been lightly clarified without changing its scope.
