id: MRK.14.41
reference: Mark 14:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: ig
  text: Ọ bịara nke ugboro atọ, wee sị ha[a], “Ụnụ ka na-ehi ụra ma na-ezu ike? O zuola[c]; oge ahụ eruola. Lee, a na-enyefe Nwa nke Mmadụ n’aka ndị mmehie.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Na-ehinụ ụra ugbu a, zukwanụ ike.” Okwu Grik ahụ nwere ike ịpụta okwu ịkwa emo nke dị ka inye ikike, ma ọ bụ ajụjụ ịba mba.
    reason: alternative_reading
  - marker: c
    text: “O zuola” bụ ntụgharị nke okwu Grik siri ike. Ntụgharị ndị ọzọ gụnyere “Zuru!” ma ọ bụ, nke yikarịrị ka ọ dịghị ebe a, okwu azụmahịa dịka “a kwụọla ụgwọ ya n’uju.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: Ọ bịakwara nke ugboro atọ
  rationale: E ji usoro akụkọ Igbo dị mma gosipụta ọbịbịa nke ugboro atọ, na-edobe nkọwa τὸ τρίτον n'ụzọ doro anya.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Ụnụ ka na-ehi ụra ma na-ezu ike?
  rationale: A tụgharịrị ya dịka ajụjụ ịba mba, nke dabara n’ọnọdụ ahụ ma bụrụ Igbo nkịtị; ebe ọ bụ na mkpụrụokwu Grik nwekwara ike ịbụ nkwenye ma ọ bụ ikike e kwuru n’ụzọ ịkwa emo, e debere nke ahụ n’ala peeji.
- source_word: ἀπέχει
  choice: O zuola
  rationale: Nke a na-egosipụta nghọta akpaalaokwu kacha kwekọọ na mgbanwe dị n’akụkọ ahụ, ma a na-ekweta na okwu Grik a siri ike.
- source_word: ἦλθεν ἡ ὥρα
  choice: oge ahụ eruola
  rationale: “Oge ahụ” na-edobe echiche nke oge a kara aka, ebe “eruola” na-egosipụta perfect force n’Igbo dị mma.
- source_word: ἰδοὺ
  choice: Lee
  rationale: “Lee” bụ okwu Igbo dị mkpirikpi ma dị ike nke na-adọta uche dịka ἰδοὺ.
- source_word: παραδίδοται
  choice: a na-enyefe
  rationale: Nke a na-edobe isi echiche nke inyefe mmadụ n’aka onye ọzọ, ghara ime ka ọ bụrụ naanị nrara Judas.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: A na-edobe aha a Jizọs ji akpọ onwe ya na ọdịdị aha-utu ya.
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: n’aka ndị mmehie
  rationale: Nke a na-edobe ihe atụ Grik nke ịdaba n’aka, ya bụ, n’okpuru ike ndị mmehie.
theological_decisions:
- issue: Ụdị okwu Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: 'Ajụjụ ịba mba: “Ụnụ ka na-ehi ụra ma na-ezu ike?”'
  alternative: 'Nkwenye ma ọ bụ ikike e kwuru n’ụzọ ịkwa emo: “Na-ehinụ ụra ugbu a, zukwanụ ike.”'
  rationale: Akara ajụjụ adịghị n’ihe odide ndị mbụ, ya mere Grik nwere ike ịpụta ụzọ abụọ ahụ. Isi ederede họọrọ ajụjụ nke na-ada nke ọma n’Igbo, ebe ala peeji na-echekwa nghọta nke ọzọ.
- issue: Ihe ἀπέχει pụtara
  choice: O zuola
  alternative: “Zuru!” ma ọ bụ, nke yikarịrị ka ọ dịghị ebe a, “a kwụọla ụgwọ ya n’uju”
  rationale: “O zuola” kwekọrọ nke ọma na ntụgharị akụkọ ahụ ma ọ naghị ebubata nkọwa azụmahịa a na-ejighị n’aka.
- issue: Ntụgharị παραδίδοται
  choice: a na-enyefe
  alternative: a na-arara nye
  rationale: “A na-enyefe” na-echekwa obosara okwu Grik ahụ ma ghara igbochi ndị na-agụ ya ịhụ ma ọrụ Judas ma usoro inyefe Jizọs n’aka ndị mmehie.
translation_notes:
  register: Standard Igbo; okwu ndị a bụ nke ugbu a, dị ugwu, ma dị mfe nghọta. E ji “Nwa nke Mmadụ” na “oge ahụ” chekwaa ụda na echiche okpukpe nke amaokwu ahụ, ebe a na-ezere okwu ụka nke otu denominashọn.
