base_translation:
  language: en
  yaml_path: translation/nt/mark/014/002.yaml
  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
translation:
  language: ig
  text: N’ihi na ha nọ na-ekwu, “Ọ bụghị n’oge ememme ahụ, ka ọgbaaghara ghara ibilite n’etiti ndị mmadụ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka ọgbaaghara ghara isi n’aka ndị mmadụ pụta.” Genitive Grik τοῦ λαοῦ nwere ike igosi na ọgbaaghara ahụ ga-adị n’etiti ndị mmadụ ma ọ bụ na ọ ga-esi n’aka ha pụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: ha nọ na-ekwu
  rationale: Oge imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwughachi; nkebi a na-egosipụta nke ahụ n’Igbo dị ndụ.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na nke bu ya ụzọ dịka nkọwa nke ihe mere ha ji achọ ụzọ aghụghọ.
- source_word: Μὴ
  choice: Ọ bụghị
  rationale: E debere mkpụmkpụ okwu Grik ahụ, ebe ihe a na-agaghị eme—ijide ma gbuo Jizọs—doro anya site n’amaokwu bu ụzọ.
- source_word: ἐν τῇ ἑορτῇ
  choice: n’oge ememme ahụ
  rationale: ἐν nwere nghọta oge n’ebe a; ‘ememme ahụ’ na-ezo aka n’oge ememme Ngabiga na Achịcha Na-ekoghị Eko nke a kpọtụrụ aha na gburugburu okwu ahụ.
- source_word: μήποτε
  choice: ka ... ghara
  rationale: Nke a na-egosipụta ihe ha na-atụ egwu na nke ha chọrọ igbochi n’ụzọ Igbo nkịtị.
- source_word: ἔσται
  choice: bilie
  rationale: N’ọdịdị Igbo a, ‘bilie’ na θόρυβος na-egosi na ọgbaaghara nwere ike ịmalite, ma na-echekwa nghọta ihe a tụrụ anya ya nke future ahụ.
- source_word: θόρυβος
  choice: ọgbaaghara
  rationale: Okwu a na-egosi mkpọtụ na ọgba aghara n’etiti ọha, n’enweghị ịkọwa ya kpọmkwem dịka nnupụisi zuru ezu.
- source_word: τοῦ λαοῦ
  choice: isi n’etiti ndị mmadụ
  rationale: Nke a na-edebe ohere na ọgbaaghara ahụ ga-esi n’aka ndị mmadụ pụta ma ọ bụ mee n’etiti ha; e nyere nkọwa ọzọ na ndetu ala peeji.
