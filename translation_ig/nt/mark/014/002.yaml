- from: N’ihi na ha nọ na-ekwu, “Ọ bụghị n’oge ememme ahụ, ka ọgbaaghara ghara isi n’etiti ndị mmadụ bilie[a].”
  to: N’ihi na ha nọ na-ekwu, “Ọ bụghị n’oge ememme ahụ, ka ọgbaaghara ghara ibilite n’etiti ndị mmadụ[a].”
  rationale: A gbanwere naanị nkwupụta nke mmekọrịta τοῦ λαοῦ ka ọ bụrụ Igbo dị ọcha ma doo anya. Ihe odide bụ isi na-ekwu na ọgbaaghara ga-adị n’etiti ndị mmadụ; ndetu ala peeji na-echekwa nghọta ọzọ, na ọ ga-esi n’aka ndị mmadụ pụta.
