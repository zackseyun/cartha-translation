translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ugwu. A họọrọ ‘ememme’ kama okwu ụka pụrụ iche, ma chekwaa njikọ nkọwa nke γάρ na mgbagwoju anya dị na τοῦ λαοῦ site na ndetu ala peeji.
