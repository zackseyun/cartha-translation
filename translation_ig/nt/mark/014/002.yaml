    text: A pụkwara ịsụgharị ya, “ka ọgbaaghara ghara isi n’aka ndị mmadụ pụta.” Genitive Grik τοῦ λαοῦ nwere ike igosi na ọgbaaghara ahụ ga-adị n’etiti ndị mmadụ ma ọ bụ na ọ ga-esi n’aka ha pụta.
    reason: lexical_alternative
  revision_rationale: A gbanwere naanị nkwupụta nke mmekọrịta τοῦ λαοῦ ka ọ bụrụ Igbo dị ọcha ma doo anya. Ihe odide bụ isi na-ekwu na ọgbaaghara ga-adị n’etiti ndị mmadụ; ndetu ala peeji na-echekwa nghọta ọzọ, na ọ ga-esi n’aka ndị mmadụ pụta.
