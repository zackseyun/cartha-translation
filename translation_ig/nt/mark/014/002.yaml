review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents γάρ, the imperfect ἔλεγον, the elliptical prohibition, the temporal phrase, and the feared prospective result. However, “ka ọgbaaghara ghara isi n’etiti ndị mmadụ bilie” is not a clear or natural way to express the Greek genitive relation: it combines ‘arise from among’ with ‘arise’ and obscures the viable ‘among the people’ sense. Rendering the main text as an uproar ‘among the people’ preserves one natural reading, while the footnote retains the source/involvement alternative.'
  naturalness: “Ha nọ na-ekwu” is acceptable Standard Igbo for the imperfect. “Ka ọgbaaghara ghara ibilite n’etiti ndị mmadụ” is more idiomatic and syntactically clean than “ghara isi n’etiti ndị mmadụ bilie.”
  terminology: “Ememme,” “ọgbaaghara,” and “ndị mmadụ” are suitable modern, dignified Standard Igbo terms. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: Awkward and semantically conflated expression of τοῦ λαοῦ
    rationale: “isi n’etiti ndị mmadụ bilie” unnecessarily combines two expressions for origin/location and does not clearly preserve the ambiguity of the Greek genitive. “n’etiti ndị mmadụ” is natural in the text; the alternative source sense belongs in the footnote.
  revised_text: N’ihi na ha nọ na-ekwu, “Ọ bụghị n’oge ememme ahụ, ka ọgbaaghara ghara ibilite n’etiti ndị mmadụ[a].”
  revised_footnotes:
