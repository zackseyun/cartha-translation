  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: ig
  text: 'Mgbe ọ nọ na Betani, ka ọ dinara ala n''ụlọ Saịmọn onye ekpenta, otu nwanyị ji ite alabasta nke mmanụ nard na-esi ísì ụtọ, nke dị ọcha[a] ma dịkwa oke ọnụ ahịa, bịara. Ọ gbajiri ite ahụ, wụsa mmanụ ahụ n''isi ya.


    [a] Ma ọ bụ, “ezigbo nard”; ihe okwu Grik πιστικῆς pụtara abụghị ihe doro anya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ezigbo nard”; ihe okwu Grik πιστικῆς pụtara abụghị ihe doro anya.
    reason: Preserves the debated sense of πιστικῆς, including the alternative “genuine/authentic,” without resolving the lexical ambiguity.
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: Mgbe ọ nọ ... ka ọ na-eri nri nọdụ ala
  rationale: This treats the genitive absolute as background circumstance and renders the meal posture naturally in modern Igbo without obscuring the scene.
- source_word: Βηθανίᾳ
  choice: Betani
  rationale: Standard Igbo-style transliteration of the place name.
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: n'ụlọ Saịmọn onye ekpenta
  rationale: Retains the Greek designation literally and does not add the unsupported inference that Simon was formerly a leper.
- source_word: γυνὴ
  choice: otu nwanyị
  rationale: The woman is indefinite and unidentified at this point in Mark.
- source_word: ἀλάβαστρον
  choice: ite alabasta
  rationale: Clearly denotes the alabaster container and allows the repeated reference to remain coherent.
- source_word: μύρου νάρδου
  choice: mmanụ nard na-esi ísì ụtọ
  rationale: Natural Igbo for fragrant nard oil, retaining the specific aromatic substance rather than generalizing it.
- source_word: πιστικῆς
  choice: dị ọcha[a]
  rationale: ‘Pure’ is a plausible contextual rendering, while the footnote preserves the genuine/authentic alternative and the term's lexical uncertainty.
- source_word: πολυτελοῦς
  choice: dịkwa oke ọnụ ahịa
  rationale: Expresses the exceptionally high cost that motivates the response in the following context.
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: Ọ gbajiri ite ahụ
  rationale: Presents the participle as the action preceding the pouring, without intensifying it to ‘shattered.’
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: wụsa mmanụ ahụ n'isi ya
  rationale: A direct, idiomatic Igbo rendering of pouring the substance upon his head.
theological_decisions:
- issue: Whether to soften Σίμωνος τοῦ λεπροῦ by implying that Simon had formerly been a leper
  choice: Saịmọn onye ekpenta
  alternative: Saịmọn onye bụbu onye ekpenta
  rationale: The Greek calls him ‘the leper’ without qualification. Adding ‘former’ would resolve a historical question that the text itself leaves unstated.
translation_notes:
  register: Standard Igbo in a current, dignified narrative register. Familiar wording is preferred, while ‘nard’ and ‘alabasta’ are retained as specific source-culture terms. The syntax is smoothed for ordinary readers without removing the meal setting, Simon's designation, or the lexical ambiguity of πιστικῆς.
