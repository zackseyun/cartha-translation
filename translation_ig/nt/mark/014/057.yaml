  text: καί τινες ἀναστάντες ἐψευδομαρτύρουν κατ’ αὐτοῦ λέγοντες
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/057.yaml
  text: And some stood up and were giving false testimony against him[a], saying,
translation:
  language: ig
  text: Ụfọdụ ndị biliri ọtọ, na-agba akaebe ụgha megide ya, na-asị,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καί
  choice: Ụfọdụ ndị
  rationale: N'Igbo, njikọ ahụ adịghị mkpa ka a sụgharịa ya iche n'ebe a; ịmalite ozugbo na “Ụfọdụ ndị” na-eme ka akụkọ ahụ na-aga n'ụzọ eke, ma njikọ ya na ihe gara aga ka doro anya.
- source_word: τινες
  choice: Ụfọdụ ndị
  rationale: Nke a na-echekwa echiche nke ndị a na-akọwaghị kpọmkwem.
- source_word: ἀναστάντες
  choice: biliri ọtọ
  rationale: Ọ na-egosi na ha si n'ọnọdụ ha bilie iji kwuo okwu n'ihu nzukọ ikpe ahụ.
- source_word: ἐψευδομαρτύρουν
  choice: na-agba akaebe ụgha
  rationale: Nkebi “na-agba” na-egosipụta omume na-aga n'ihu nke imperfect ahụ, ebe “akaebe ụgha” na-echekwa nghọta iwu na ikpe dị na okwu Grik ahụ.
- source_word: κατ’ αὐτοῦ
  choice: megide ya
  rationale: Ọ na-egosipụta n'ụzọ doro anya na akaebe ahụ bụ nke iro ma bụrụ ebubo e boro ya.
- source_word: λέγοντες
  choice: na-asị,
  rationale: Ọ na-ebute kpọmkwem ihe akaebe ha ga-ekwu n'amaokwu na-esonụ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. N'agbanyeghị na isi ederede na ihe ọzọ a kpọrọ na nkọwa ala bụ otu n'okwu, nkọwa ahụ na-egosi ụdị okwu ọdịnala; enwere ike ịhapụ ya n'oge ndezi ikpeazụ ma ọ bụrụ na enweghị ezigbo ọdịiche a chọrọ ichekwa.
