- from: “Unu anụla nkwulu Chineke ahụ. Gịnị ka unu chere?” Ha niile wee maa ya ikpe na o kwesịrị ịnwụ.[a]
  to: “Unu anụla nkwulu ahụ. Gịnị ka unu chere?” Ha niile wee maa ya ikpe, sị na ikpe ọnwụ mara ya.[a]
