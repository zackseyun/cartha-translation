  text: ἠκούσατε τῆς βλασφημίας· τί ὑμῖν φαίνεται; οἱ δὲ πάντες κατέκριναν αὐτὸν ⸂ἔνοχον εἶναι⸃ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: ig
  text: “Unu anụla nkwulu ahụ. Gịnị ka unu chere?” Ha niile wee maa ya ikpe, sị na ikpe ọnwụ mara ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “o kwesịrị ịnwụ,” ma ọ bụ “o kwesịrị ka e gbuo ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: Unu anụla
  rationale: Oge aorist ahụ na-arụtụ aka n'ihe ha ka nụrụ ugbu a; perfect Igbo a na-egosipụta nke ahụ nke ọma n'okwu ikpe.
- source_word: βλασφημίας
  choice: nkwulu Chineke ahụ
  rationale: “Nkwulu Chineke” bụ okwu Igbo doro anya nke na-edobe ibu iwu na okpukpe nke ebubo ahụ; “ahụ” na-arụtụ aka n'okwu ahụ a ka kwuru.
- source_word: τί ὑμῖν φαίνεται
  choice: Gịnị ka unu chere?
  rationale: Nke a bụ ụzọ Igbo sitere n'okike isi jụọ echiche ma ọ bụ mkpebi ndị a na-agwa okwu, kama ịsụgharị ọdịdị okwu Grik ahụ n'ụzọ siri ike.
- source_word: πάντες
  choice: Ha niile
  rationale: Ọ na-edobe nkwusi ike nke πάντες na otu olu ha niile.
- source_word: κατέκριναν
  choice: maa ya ikpe
  rationale: N'ọnọdụ ikpe a, okwu a pụtara ikpe mmadụ ikpe ma ọ bụ kwuo na ikpe mara ya.
- source_word: ἔνοχον εἶναι θανάτου
  choice: na o kwesịrị ịnwụ
  rationale: Ọ na-enye nghọta iwu nke ịbụ onye kwesiri ntaramahụhụ ọnwụ n'Igbo doro anya, ma na-ezere ahịrịokwu a sụgharịrị n'ụzọ siri ike.
theological_decisions:
- issue: Otú e si sụgharịa βλασφημία n'ọnọdụ ikpe okpukpe
  choice: nkwulu Chineke
  alternative: okwu nkwulu
  rationale: Nhọrọ a na-egosi ụdị ebubo ndị Sanhedrin boro ya n'ụzọ doro anya, ma ọ naghị ekwu na onye na-akọ akụkọ kwadoro izi ezi nke ebubo ahụ.
- issue: Ihe ἔνοχον εἶναι θανάτου pụtara
  choice: o kwesịrị ịnwụ
  alternative: ikpe ọnwụ mara ya
  rationale: Isiokwu ahụ na-ekwu na ha kpebiri na o kwesiri ntaramahụhụ ọnwụ; ọ naghị edozi ajụjụ ma mkpebi ahụ ò ziri ezi.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. “Gịnị ka unu chere?” bụ akpaalaokwu sitere n'okike; “maa ya ikpe” na-edobe ọnọdụ ikpe ahụ.
