source:
  edition: SBLGNT
  text: καὶ ⸂προελθὼν μικρὸν ἔπιπτεν⸃ ἐπὶ τῆς γῆς, καὶ προσηύχετο ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: ig
  text: O wee gaa n’ihu ntakịrị[a], daa n’ala, na-ekpe ekpere ka oge ahụ gabiga ya ma ọ bụrụ na o kwe omume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “O wee gaa obere ebe n’ihu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: gaa n’ihu ntakịrị
  rationale: Nke a na-egosi na ọ gara obere ebe n’ihu karịa ndị ọzọ, n’Igbo nkịtị ma doo anya.
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: daa n’ala
  rationale: Ọ bụ ụzọ Igbo si ekwu mmegharị ahụ n'ụzọ ebumpụta ụwa; oge gara aga dị mfe dabara n’akụkọ a.
- source_word: προσηύχετο
  choice: na-ekpekwa ekpere
  rationale: Ụdị ngwaa na-aga n’ihu na-echekwa ọdịdị imperfect nke Grik, nke na-egosi ekpere na-aga n’ihu.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-ewebata ọdịnaya nke ekpere ahụ n’ụzọ Igbo dị mfe, na-amanyeghị naanị nzube.
- source_word: εἰ δυνατόν ἐστιν
  choice: ọ bụrụ na ọ ga-ekwe omume
  rationale: Nke a na-echekwa ọnọdụ nwere ike ime ma na-ada nke ọma n’Igbo nke oge a.
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: oge ahụ gabiga ya
  rationale: “Oge ahụ” na-echekwa ihe atụ dị n’okwu Grik na ibu ọ pụtara banyere oge ahụ a kara aka, n’akọwaghị ya karịa ihe odide ahụ kwuru.
theological_decisions:
- issue: Ihe “oge ahụ” pụtara
  choice: E debere “oge ahụ” dị ka okwu ihe atụ maka oge ahụ a kara aka.
  alternative: oge ahụhụ; oge ọnwụ ya
  rationale: Ịhapụ ya dị ka “oge ahụ” na-echekwa ịdị omimi na esemokwu nke okwu Mak, kama ịkọwa ya ozugbo dị ka ahụhụ ma ọ bụ ọnwụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji usoro “O wee…” mee ka njikọ akụkọ ahụ bụrụ nke ebumpụta ụwa; e debere “oge ahụ” iji chekwaa ihe atụ na ibu nkà mmụta okpukpe nke isi mmalite.
