review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the genitive absolute as a temporal setting, κάτω as Peter’s lower location, αὐλή as a courtyard, and the historical present with a natural past-tense narrative verb. It also retains the source sentence’s unfinished lead-in. The household association of the παιδίσκη with the high priest is conveyed.
  naturalness: The wording is generally clear Standard Igbo. Adding ndị after ụmụ agbọghọ makes the restrictive relation—one of the girls who served the high priest—fully natural and unambiguous. The revised footnote also keeps its singular referent consistent with the verse.
  terminology: “Onyeisi nchụaja” is a clear, established Standard Igbo rendering for ἀρχιερεύς (“high priest”). “Nwa agbọghọ na-eje ozi” preserves the servant sense of παιδίσκη, while the footnote appropriately records “nwa agbọghọ ohu” as a lexical alternative without asserting a disputed legal status in the main text.
  issues:
  - severity: low
    issue: The main text omits the relative marker ndị after ụmụ agbọghọ.
    rationale: Without ndị, the participial phrase is understandable but less idiomatic and less explicitly identifies the girl as belonging to the group of household servants.
  - severity: low
    issue: The footnote’s explanatory gloss switches from the verse’s singular girl to generic “nwaanyị.”
    rationale: Using “nwa agbọghọ” maintains the lexical note’s connection to παιδίσκη and to the singular referent in this verse.
  revised_text: Mgbe Pita nọ n’okpuru n’ogige ahụ, otu n’ime ụmụ agbọghọ ndị na-ejere onyeisi nchụaja ozi bịara,
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “otu n’ime ụmụ agbọghọ ohu nke onyeisi nchụaja.” Okwu Grik παιδίσκη nwere ike ịpụta nwa agbọghọ na-eje ozi n’ụlọ ma ọ bụ nwa agbọghọ ohu.
    reason: lexical_alternative
  revision_rationale: The revision makes the household-servant relationship syntactically natural in Standard Igbo, uses a clear conventional title for the high priest, and aligns the footnote’s wording and number with the verse while preserving the source’s servant/slave lexical ambiguity.
