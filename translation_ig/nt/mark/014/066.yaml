translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị mfe ma nwee ugwu, dee ya. A hapụrụ usoro ahịrịokwu ahụ ka ọ bụrụ mmalite nke na-aga n’ihu n’amaokwu na-esonụ, dịka ọ dị n’ihe odide Grik.
