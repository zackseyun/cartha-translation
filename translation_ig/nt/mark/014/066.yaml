- from: Mgbe Pita nọ n’okpuru n’ogige ahụ, otu n’ime ụmụ agbọghọ na-ejere nnukwu onye nchụaja ozi[a] bịara,
  to: Mgbe Pita nọ n’okpuru n’ogige ahụ, otu n’ime ụmụ agbọghọ ndị na-ejere onyeisi nchụaja ozi bịara,
  rationale: The revision makes the household-servant relationship syntactically natural in Standard Igbo, uses a clear conventional title for the high priest, and aligns the footnote’s wording and number with the verse while preserving the source’s servant/slave lexical ambiguity.
