  text: Καὶ ὄντος τοῦ Πέτρου ⸂κάτω ἐν τῇ αὐλῇ⸃ ἔρχεται μία τῶν παιδισκῶν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/066.yaml
  text: And while Peter was below in the courtyard[a], one of the high priest’s servant girls came,
translation:
  language: ig
  text: Mgbe Pita nọ n’okpuru n’ogige ahụ, otu n’ime ụmụ agbọghọ ndị na-ejere onyeisi nchụaja ozi bịara,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: Mgbe Pita nọ
  rationale: Nkebiokwu a na-egosi ihe na-aga n’ihu n’oge ihe ọzọ mere; “Mgbe Pita nọ” na-egosipụta nke a n’Igbo dị mfe ma bụrụkwa nke e ji akọ akụkọ.
- source_word: κάτω
  choice: n’okpuru
  rationale: Okwu a na-egosi na Pita nọ n’ebe dị ala karịa ebe a na-ekpe Jizọs ikpe; “n’okpuru” na-echekwa nkọwa ọnọdụ ahụ n’enweghị itinye ihe na-adịghị n’ihe odide Grik.
- source_word: αὐλή
  choice: ogige ahụ
  rationale: N’ebe a, αὐλή bụ ogige dị n’ime ụlọ obibi nnukwu onye nchụaja. “Ogige ahụ” bụ okwu Igbo a na-aghọta ngwa ngwa n’ọnọdụ akụkọ a.
- source_word: ἔρχεται
  choice: bịara
  rationale: Ọ bụ ezie na Grik ji ngwaa oge ugbu a n’ụzọ akụkọ, oge gara aga bụ ụzọ ebumpụta ụwa e si akọ akụkọ a n’Igbo.
- source_word: μία τῶν παιδισκῶν
  choice: otu n’ime ụmụ agbọghọ na-ejere … ozi
  rationale: παιδίσκη nwere ike ịpụta nwaanyị na-eje ozi ma ọ bụ nwaanyị ohu. Nhọrọ a na-egosi na ọ bụ nwa agbọghọ nọ n’ọrụ ụlọ ahụ, ebe nkọwa ala ya dị ka ohu ka e debere n’ala peeji.
- source_word: τοῦ ἀρχιερέως
  choice: nnukwu onye nchụaja
  rationale: Genitiv a na-egosi na nwa agbọghọ ahụ so n’ezinụlọ ma ọ bụ ndị ọrụ nnukwu onye nchụaja; nhazi ahịrịokwu Igbo ahụ na-eme ka njikọ a doo anya.
