  text: Καὶ ἀπήγαγον τὸν Ἰησοῦν πρὸς τὸν ἀρχιερέα, καὶ ⸀συνέρχονται πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι καὶ οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: ig
  text: Ha duuru Jizọs gaa n’ebe onyeisi nchụaja nọ. Ndị isi nchụaja niile, ndị okenye, na ndị ode akwụkwọ zukọtara[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “na-ezukọ.” E ji oge ugbu a mee ka akụkọ e ji oge gara aga kọọ dị ndụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον (ἀπάγω)
  choice: duuru ... gaa
  rationale: Nke a na-egosi na ha kpọọrọ Jizọs pụọ ma duru ya gaa ebe ọzọ, na-enweghị ịgbakwụnye otú ha si mee ya.
- source_word: ἀρχιερέα
  choice: nnukwu onye nchụaja
  rationale: Ụdị otu a na-ekwu maka onye ji ọkwa kachasị elu n’etiti ndị nchụaja, ọ bụghị ìgwè ndị isi nchụaja a kpọrọ aha n’azụ amaokwu ahụ.
- source_word: συνέρχονται (συνέρχομαι)
  choice: zukọkwara
  rationale: Okwu Grik ahụ dị n’oge ugbu a n’ime akụkọ e ji oge gara aga kọọ. E ji oge gara aga sụgharịa ya ka Igbo wee na-aga nke ọma, ebe ndetu ala na-egosi ụdị okwu mbụ ahụ.
- source_word: πάντες
  choice: niile
  rationale: Ọ na-echekwa nkwusi ike ahụ na ndị otu ọchịchị a niile bịakọrọ ọnụ.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Ụdị ọtụtụ a na-ezo aka n’òtù ndị ndu nchụaja, ma na-ekewapụ ha n’aka nnukwu onye nchụaja a kpọrọ aha na mbụ.
- source_word: πρεσβύτεροι
  choice: ndị okenye
  rationale: N’ọnọdụ a, okwu ahụ bụ aha ndị ndu obodo a ma ama, ọ bụghị naanị ndị kara nká.
- source_word: γραμματεῖς
  choice: ndị ode akwụkwọ
  rationale: Nke a na-echekwa aha ọrụ ndị ahụ dị n’asụsụ Grik ma zere ịkọwa ha naanị dị ka ndị nkụzi Iwu.
theological_decisions:
- issue: Oge ugbu a nke συνέρχονται n’ime akụkọ oge gara aga
  choice: 'E ji oge gara aga sụgharịa ya: “zukọkwara.”'
  alternative: “na-ezukọkwa,” iji gosipụta kpọmkwem oge ugbu a e ji mee ka akụkọ dị ndụ
  rationale: Nke a bụ mkpebi gbasara ụzọ nsụgharị, ọ bụghị idozi okwu nkà mmụta okpukpe. Oge gara aga na-eme ka akụkọ ahụ bụrụ Igbo nkịtị, ebe ndetu ala na-echekwa ụdị okwu Grik ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ ka ọ daa nke ọma n’Igbo, ma njikọ echiche dị na Grik ka dị. E tinyere akara ndetu [a] ozugbo n’akụkụ “zukọkwara,” bụ okwu ndetu ahụ na-akọwa.
