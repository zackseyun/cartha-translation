revisions:
- from: Ha duuru Jizọs gaa n’ebe nnukwu onye nchụaja nọ. Ndị isi nchụaja niile, ndị okenye, na ndị ode akwụkwọ zukọkwara[a].
  to: Ha duuru Jizọs gaa n’ebe onyeisi nchụaja nọ. Ndị isi nchụaja niile, ndị okenye, na ndị ode akwụkwọ zukọtara[a].
  rationale: The revision replaces an ambiguous descriptive expression with the conventional office term “onyeisi nchụaja” and refines the historical-present note. It retains the original meaning, the distinction between singular high priest and plural chief priests, and the natural past-tense narrative rendering in Igbo.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:00:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys that Jesus was led to the singular high priest and that the chief priests, elders, and scribes assembled. However, “nnukwu onye nchụaja” can sound like “a great/big priest” rather than the established office of the high priest. “Onyeisi nchụaja” identifies the office more clearly. The Greek historical present is appropriately represented by a past-tense narrative form with an anchored note.
  naturalness: The two-sentence arrangement is natural Standard Igbo. “Ha duuru Jizọs gaa n’ebe onyeisi nchụaja nọ” is clear and idiomatic. “Ndị isi nchụaja niile, ndị okenye, na ndị ode akwụkwọ zukọtara” is a smooth, direct rendering of the assembled groups.
  terminology: Use “onyeisi nchụaja” for the singular ἀρχιερεύς (‘high priest’) and retain “ndị isi nchụaja” for plural ἀρχιερεῖς (‘chief priests’). “Ndị okenye” and “ndị ode akwụkwọ” are suitable established institutional terms in this context.
  issues:
  - severity: medium
    issue: “nnukwu onye nchụaja” for the singular high priest
    rationale: Although understandable, “nnukwu” ordinarily denotes size or greatness and does not as clearly designate the specific high-priestly office. “Onyeisi nchụaja” is more precise and natural in Standard Igbo.
  - severity: low
    issue: Footnote gloss includes “-kwa” in “na-ezukọkwa”
    rationale: The present-tense feature being explained is best represented simply by “na-ezukọ.” The connective sense of καί need not be incorporated into the tense gloss.
  revised_text: Ha duuru Jizọs gaa n’ebe onyeisi nchụaja nọ. Ndị isi nchụaja niile, ndị okenye, na ndị ode akwụkwọ zukọtara[a].
  revised_footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “na-ezukọ.” E ji oge ugbu a mee ka akụkọ e ji oge gara aga kọọ dị ndụ.'
    reason: lexical_alternative
  revision_rationale: The revision replaces an ambiguous descriptive expression with the conventional office term “onyeisi nchụaja” and refines the historical-present note. It retains the original meaning, the distinction between singular high priest and plural chief priests, and the natural past-tense narrative rendering in Igbo.
