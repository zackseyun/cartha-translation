  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: ig
  text: Ma Jizọs sịrị, “Ọ bụ m[a]; unu ga-ahụ Nwa nke Mmadụ ka ọ nọ ọdụ n'aka nri nke Ike[b], na-abịa na igwe ojii nke eluigwe[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Abụ m.” N'asụsụ Grik, okwu ya bụ naanị “Abụ m.”
    reason: alternative_reading
  - marker: b
    text: “Ike” bụ ụzọ nkwanye ùgwù e si ezo aka na Chineke.
    reason: cultural_note
  - marker: c
    text: Okwu a na-akpọghachi Abụ Ọma 110:1 na Daniel 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Abụ m
  rationale: Nke a na-edobe azịza Grik ahụ dị mfe ma sie ike, ‘Abụ m,’ n'etinyeghị ‘ya’ nke na-adịghị n'ihe odide ahụ. N'ọnọdụ a, ọ na-aza ajụjụ onyeisi nchụaja ozugbo, ma ọ ka na-ahapụ ịdị arọ na nghọta sara mbara nke okwu ahụ ka ọ dị.
- source_word: ὄψεσθε
  choice: Unu ga-ahụ
  rationale: Ọ bụ ntụgharị Igbo doro anya nke ngwaa ọdịnihu a, ma na-egosikwa na Jizọs na-agwa ọtụtụ ndị nọ n'ihu ya okwu.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-edobe aha Jizọs ji akpọ onwe ya na njikọ ya na Daniel 7, kama ịgbanwe ya ka ọ bụrụ nkọwa nkịtị.
- source_word: ἐκ δεξιῶν
  choice: n'aka nri nke
  rationale: Akpaalaokwu Igbo a na-egosi ọnọdụ nsọpụrụ na ikike dị elu, dị ka akpaalaokwu Grik si eme.
- source_word: τῆς δυνάμεως
  choice: Ike
  rationale: E ji mkpụrụedemede ukwu gosi na ‘Ike’ bụ ụzọ nkwanye ùgwù e si ezo aka na Chineke. A naghị edochi ya ozugbo na ‘Chineke,’ ka okwu na ụda nke isi mmalite ahụ wee dịgide.
- source_word: καθήμενον
  choice: ka ọ nọ ọdụ
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa nke na-akọwa ọnọdụ ịnọ n'oche ọchịchị n'ụzọ kwesịrị ekwesị.
- source_word: ἐρχόμενον
  choice: na-abịakwa
  rationale: Ọ na-edobe ihe omume nke abụọ jikọrọ na nke mbụ, tinyere ike nchịkọta nke καὶ ... καὶ.
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: ya na igwe ojii nke eluigwe
  rationale: Nke a na-edobe echiche Grik nke ‘ịbịa ya na’ igwe ojii ma chekwaa njikọ okwu ahụ na Daniel 7:13.
theological_decisions:
- issue: Ma a ga-atụgharị Ἐγώ εἰμι dịka nkwenye dị mfe ma ọ bụ tinye okwu njirimara
  choice: Abụ m
  alternative: Ọ bụ m / Abụ m ya
  rationale: Ihe odide Grik enweghị okwu na-esochi ‘Abụ m.’ Nhọrọ a na-edobe ma azịza kpọmkwem nye ajụjụ ahụ ma ohere nke ịdị arọ karịrị azịza nkịtị, n'amanyeghị otu nkọwa nkà mmụta okpukpe.
- issue: Otu a ga-esi kọwaa τῆς δυνάμεως
  choice: Ike
  alternative: Chineke / Onye Dị Ike
  rationale: Grik ji okwu nkwanye ùgwù zoro aka na Chineke kama ịkpọ ya aha ozugbo. ‘Ike’ na-edobe ụzọ okwu ahụ na ụda ikpe ahụ, ebe nkọwa ala peeji na-eme ka ihe ọ pụtara doo anya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ahịrịokwu ahụ kpọmkwem ma sie ike dịka okwu e kwuru n'ụlọikpe; e chekwara njikọ ya na Abụ Ọma 110 na Daniel 7 n'etinyeghị nkọwa otu ụka.
