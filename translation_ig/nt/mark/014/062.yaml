- from: Ma Jizọs sịrị, “Abụ m[a]. Unu ga-ahụkwa Nwa nke Mmadụ ka ọ nọ ọdụ n'aka nri nke Ike[b], na-abịakwa ya na igwe ojii nke eluigwe[c].”
  to: Ma Jizọs sịrị, “Ọ bụ m[a]; unu ga-ahụ Nwa nke Mmadụ ka ọ nọ ọdụ n'aka nri nke Ike[b], na-abịa na igwe ojii nke eluigwe[c].”
  rationale: The revision uses idiomatic Standard Igbo for Jesus’ direct self-identification while retaining the Greek’s lack of an explicit predicate. It also makes the two linked descriptions of the Son of Man flow naturally, retains the reverential “Ike,” and improves the cross-reference note without imposing an interpretive or denominational reading.
