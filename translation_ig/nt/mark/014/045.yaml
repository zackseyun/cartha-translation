  to: 'Mgbe ọ bịarutere, ozugbo ahụ ọ gakwuuru ya, sị ya, “Rabaị!” wee susuo ya ọnụ nke ukwuu.[a]


    [a] A pụkwara ịsụgharị ya, “susuo ya ọnụ ugboro ugboro” ma ọ bụ “susuo ya ọnụ n’ụzọ na-egosi ịhụnanya”; ngwaa Grik e ji mee ihe ebe a na-egosi ike karịa nanị “susuo ya ọnụ.”'
  rationale: 'Ndozigharị ndị a bụ naanị maka ido anya na ịdị mma nke Standard Igbo. Isi nsụgharị ahụ na-edobe ambiguity nke καταφιλέω: ọ na-egosi nsusu ọnụ mesiri ike, ma ọ naghị ekpebi na isiokwu ahụ ga-abụrịrị ugboro ugboro. Nkọwa ala peeji na-edobe nhọrọ «ugboro ugboro» na nghọta nke nsusu ọnụ gosiri ịhụnanya, kama «n’ụzọ pụrụ iche», nke na-adịghị akọwa nuance ahụ nke ọma.'
