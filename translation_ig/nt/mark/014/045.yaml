  source_fidelity: 'Isi ahịrịokwu ahụ na-edobe usoro na ihe dị na Grik nke ọma: Judas bịara, gakwuuru Jizọs ozugbo, kpọọ ya «Rabaị», ma susuo ya ọnụ. «Susuo ya ọnụ nke ukwuu» na-anọchite anya ike dị na καταφιλέω n’enweghị ikwu n’ụzọ na-enweghị mgbagha na o mere ya ugboro ugboro.'
  naturalness: «Mgbe ọ bịarutere, ozugbo ahụ ọ gakwuuru ya sị ya» bụ Igbo a ghọtara nke ọma, ma koma n’etiti «ya» na «sị» na-eme usoro okwu ahụ doo anya ma bụrụ nke na-agụ nke ọma. Nkọwa ala peeji dị ugbu a nwere «ngwaa ... siri ike», nke nwere ike ịpụta na ngwaa ahụ ‘hard’; «na-egosi ike karịa» bụ okwu Igbo doro anya karịa.
  terminology: «Rabaị» na-echekwa aha Semitik Ῥαββί n’ụdị Igbo. «Susuo ya ọnụ nke ukwuu» dabara na okwu a na-ejikarị maka ịsusu mmadụ ọnụ, ebe ọ na-egosi intensification ahụ n’enweghị ịkọwa ebumnuche ma ọ bụ ikwusi ugboro ugboro ike.
  issues:
