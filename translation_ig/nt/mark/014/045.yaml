  - severity: low
    issue: Enweghị koma n’etiti «ya» na «sị».
    rationale: Koma ahụ na-ekewa mmegharị ahụ na okwu o kwuru, na-eme ahịrịokwu akụkọ ahụ na-agụ n’ụzọ dị ọcha.
