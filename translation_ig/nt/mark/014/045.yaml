base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: ig
  text: 'Mgbe ọ bịarutere, ozugbo ahụ ọ gakwuuru ya, sị ya, “Rabaị!” wee susuo ya ọnụ nke ukwuu.[a]


    [a] A pụkwara ịsụgharị ya, “susuo ya ọnụ ugboro ugboro” ma ọ bụ “susuo ya ọnụ n’ụzọ na-egosi ịhụnanya”; ngwaa Grik e ji mee ihe ebe a na-egosi ike karịa nanị “susuo ya ọnụ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “susuo ya ọnụ ugboro ugboro” ma ọ bụ “susuo ya ọnụ n’ụzọ na-egosi ịhụnanya”; ngwaa Grik e ji mee ihe ebe a na-egosi ike karịa nanị “susuo ya ọnụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: mgbe ọ bịarutere
  rationale: Aorist participle a na-egosi oge ihe ahụ mere. Nsụgharị a bụ Igbo e ji ekwu okwu nke ọma ma na-edobe usoro ihe omume ahụ.
- source_word: εὐθὺς
  choice: ozugbo ahụ
  rationale: Ọ na-egosi na ihe ahụ mere n’egbughị oge ma na-edobe ọsọ akụkọ Mak.
- source_word: προσελθὼν αὐτῷ
  choice: ọ gakwuuru ya
  rationale: Nke a na-egosi na Judas gara nso n’ebe Jizọs nọ, ma zere ikwughachi okwu ‘bịa’ n’ụzọ na-adịghị atọ ụtọ n’Igbo.
- source_word: λέγει
  choice: sị ya
  rationale: Ọ bụ ezie na Grik ji historical present, oge gara aga bụ ụzọ Igbo si akọ akụkọ a nke ọma; ‘ya’ na-eme ka onye a gwara okwu doo anya.
- source_word: Ῥαββί
  choice: Rabaị
  rationale: E debere aha nsọpụrụ Semitik ahụ n’ụdị dabara n’ọdịdị mkpụrụokwu Igbo, iji chekwaa ọnọdụ akụkọ ihe mere eme na amamihe dị n’ụzọ Judas si kpọọ Jizọs.
- source_word: κατεφίλησεν
  choice: susuo ya ọnụ nke ukwuu
  rationale: Ngwaa καταφιλέω nwere ike ịbụ ụdị siri ike nke ‘isusu ọnụ.’ Nsụgharị a na-egosi ike e tinyere n’omume ahụ n’enweghị ikpebi na ọ bụ ugboro ugboro; nkọwa ala peeji na-edobe nhọrọ ndị ọzọ.
theological_decisions:
- issue: Otu e si sụgharị Ῥαββί n’okwu Judas
  choice: Rabaị
  alternative: Onye Ozizi
  rationale: Iji aha nsọpụrụ ahụ e kwuru n’ebe ahụ na-echekwa ọnọdụ ndị Juu na ihe mgbagwoju anya dị n’ekele Judas, n’etinyeghị nkọwa ụka pụrụ iche.
- issue: Ike okwu dị na καταφιλέω
  choice: susuo ya ọnụ nke ukwuu
  alternative: susuo ya ọnụ ugboro ugboro
  rationale: Ngwaa ahụ siri ike karịa φιλέω nkịtị, ma ọdịdị ya anaghị amanye ka a ghọta ya naanị dịka ime ihe ugboro ugboro. Ya mere, isi ederede na-egosi ike omume ahụ, ebe nkọwa ala peeji na-echekwa nghọta ndị ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Rabaị’ bụ ntụgharị mkpụrụokwu nke aha nsọpụrụ ahụ; ahịrịokwu ndị ọzọ bụ Igbo nkịtị na-aga nke ọma n’akụkọ.
