  text: ⸀ἤρξαντο λυπεῖσθαι καὶ λέγειν αὐτῷ εἷς κατὰ εἷς· Μήτι ⸀ἐγώ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: ig
  text: Ha malitere inwe mwute, malitekwa ịsị ya, otu onye mgbe onye ọzọ gasịrị, “Ọ bụghị m, ka ọ bụ?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ nkịtị karị, “Ọ bụ na ọ bụghị m?” Okwu Grik μήτι ji bido ajụjụ a na-egosi na onye jụrụ ya tụrụ anya azịza “mba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: Ha malitere
  rationale: Ngwaa a na-egosi mmalite nke ihe ha mere; “malitere” bụ okwu Igbo doro anya ma kwekọọ n’ụdị aorist ahụ.
- source_word: λυπεῖσθαι
  choice: inwe mwute
  rationale: Nke a na-egosi na mwute jidere ha; “inwe mwute” bụ okwu Igbo dị mfe, dịkwa nsọpụrụ, nke na-eburu echiche nke iru újú ma ọ bụ inwe nchegbu.
- source_word: καὶ λέγειν
  choice: na-asịkwa
  rationale: λέγειν pụtara ikwu ma ọ bụ ịsị, ọ bụghị kpọmkwem ịjụ ajụjụ. “Na-asịkwa” na-echekwa ngwaa nke isi mmalite, ọ bụ ezie na ihe ha kwuru bụ ajụjụ.
- source_word: αὐτῷ
  choice: ya
  rationale: Ederede Grik ji nnọchiaha, ya mere “ya” na-echekwa usoro okwu ahụ n’ebughị ụzọ tinye aha Jizọs nke na-adịghị n’amaokwu a.
- source_word: εἷς κατὰ εἷς
  choice: n’otu n’otu
  rationale: Nkebiokwu a na-egosi na onye ọ bụla kwuru nke ya n’usoro; “n’otu n’otu” bụ ụzọ Igbo e si ekwu ya nke ọma.
- source_word: Μήτι ἐγώ;
  choice: Ọ bụghị m, ka ọ bụ?
  rationale: μήτι na-egosi ajụjụ onye na-atụ anya ka azịza ya bụrụ mba. Usoro Igbo a na-egosipụta atụmanya ahụ ma na-echekwa mkpụmkpụ na ụjọ dị n’ajụjụ Grik.
theological_decisions:
- issue: Ike dị n’ajụjụ ndị na-eso ụzọ jụrụ
  choice: 'E depụtara ya dị ka ajụjụ na-atụ anya azịza “mba”: “Ọ bụghị m, ka ọ bụ?”'
  alternative: “Ọ bụ m?”
  rationale: Akara ajụjụ Grik μήτι na-egosi na onye na-ajụ ya na-atụ anya na a ga-asị “mba.” “Ọ bụ m?” naanị ya agaghị egosipụta echiche a, ọ pụkwara ime ka ụjọ ma ọ bụ ịjụ onwe ha dị n’okwu ahụ ghara ịpụta nke ọma.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị nsọpụrụ. “N’otu n’otu” bụ okwu a na-aghọta ngwa ngwa, ebe “Ọ bụghị m, ka ọ bụ?” na-eme ka ajụjụ ahụ daa ka okwu mmadụ ga-ekwu n’ezie ma nọgide na-egosipụta atụmanya nke azịza na-adịghị mma.
