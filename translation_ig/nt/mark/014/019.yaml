    text: A pụkwara ịsụgharị ya n’ụzọ nkịtị karị, “Ọ bụ na ọ bụghị m?” Okwu Grik μήτι ji bido ajụjụ a na-egosi na onye jụrụ ya tụrụ anya azịza “mba.”
    reason: lexical_alternative
  revision_rationale: The revision makes “malitere” apply explicitly to both grief and speech, matching the two coordinated Greek infinitives, while preserving the sequential individual responses and the negative-answer force of μήτι.
