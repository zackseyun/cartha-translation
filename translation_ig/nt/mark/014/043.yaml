id: MRK.14.43
reference: Mark 14:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἔτι αὐτοῦ λαλοῦντος παραγίνεται ⸀Ἰούδας ⸀εἷς τῶν δώδεκα καὶ μετ’ αὐτοῦ ⸀ὄχλος μετὰ μαχαιρῶν καὶ ξύλων παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: ig
  text: Ozugbo ahụ, mgbe ọ ka na-ekwu okwu, Judas, otu n’ime Ndị Iri na Abụọ ahụ, bịara[a], ìgwè mmadụ[b] ndị ji mma agha na mkpara[c] sokwa ya bịa, site n’aka ndị isi nchụàjà, ndị odeakwụkwọ, na ndị okenye[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “bịarutere.” N’asụsụ Grik, e ji oge ugbu a kwuo ya, ya bụ, “na-abịa,” iji mee ka akụkọ ahụ dị ndụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “oke ìgwè mmadụ.” Ma okwu Grik n’onwe ya pụtara “ìgwè mmadụ”; ọnọdụ akụkọ a na-egosi na ha bịara n’ụzọ iro.
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “osisi”; n’ebe a, ọ pụtara mkpara ma ọ bụ osisi siri ike e ji alụ ọgụ.
    reason: lexical_alternative
  - marker: d
    text: A pụkwara ịsị, “ndị isi nchụàjà, ndị odeakwụkwọ, na ndị okenye zitere ha.” N’ụzọ ka kpọmkwem, Grik kwuru na ha si “n’aka” ndị ahụ bịa, nke na-egosi isi mmalite ma ọ bụ ikike ha ji bịa.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: Ozugbo ahụ
  rationale: Nke a na-egosi na ihe ahụ mere n’egbughị oge ma na-edobe ọsọ na ịdị ngwa nke akụkọ Mak.
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: mgbe ọ ka na-ekwu okwu
  rationale: Nkebiokwu a na-egosi na ọbịbịa Judas mere n’otu oge ahụ Jizọs ka na-ekwu okwu.
- source_word: παραγίνεται
  choice: bịara
  rationale: Ọ bụ ngwaa dị n’oge ugbu a e ji akọ ihe mere eme n’asụsụ Grik; oge gara aga bụ ụzọ doro anya ma bụrụkwa nke e ji akọ akụkọ n’Igbo.
- source_word: εἷς τῶν δώδεκα
  choice: otu n’ime Ndị Iri na Abụọ ahụ
  rationale: A hapụrụ aha ìgwè ahụ n’ụdị dị mkpirikpi dịka Grik si mee, n’etinyeghị ‘ndị na-eso ụzọ’ nke na-adịghị n’ahịrịokwu ahụ.
- source_word: ὄχλος
  choice: ìgwè mmadụ
  rationale: Nke a bụ ihe okwu Grik pụtara kpọmkwem; ọnọdụ ahụ n’onwe ya na-egosi na ìgwè ahụ bịara ime ihe ike.
- source_word: μετὰ μαχαιρῶν
  choice: ji mma agha
  rationale: ‘Mma agha’ bụ okwu Igbo doro anya maka ngwa ọgụ ndị a, ọ bụ ezie na okwu Grik nwekwara ike ịgụnye mma agha dị mkpụmkpụ.
- source_word: ξύλων
  choice: mkpara
  rationale: Ọ bụ ezie na okwu Grik pụtara osisi ma ọ bụ ihe e ji osisi mee, n’ebe a ọ na-ezo aka na mkpara e ji alụ ọgụ.
- source_word: παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων
  choice: ha si n’aka ndị isi nchụàjà, ndị odeakwụkwọ, na ndị okenye bịa
  rationale: Nke a na-edobe echiche nke isi mmalite ma ọ bụ ikike ha ji bịa n’etinyeghị nkọwa siri ike karị na ndị isi ahụ ‘zitere’ ha.
theological_decisions:
- issue: Oge ngwaa παραγίνεται, nke bụ historical present
  choice: A sụgharịrị ya ‘bịara’ n’oge gara aga.
  alternative: ‘na-abịa’ ma ọ bụ ‘abịa’ iji gosipụta oge ugbu a nke Grik
  rationale: Grik ji oge ugbu a mee ka akụkọ ahụ dị ndụ, ma oge gara aga bụ usoro dị mma ma dị nghọta n’akụkọ Igbo; nke a anaghị agbanwe ihe omume ahụ.
- issue: Ihe παρὰ pụtara n’ihe gbasara ndị ọchịchị ahụ
  choice: ‘ha si n’aka ... bịa’
  alternative: ‘ndị ... zitere ha’
  rationale: Ederede ahụ na-egosi isi mmalite ma ọ bụ ikike ìgwè ahụ ji bịa, ma o kwughị kpọmkwem usoro e si zite ha; ya mere, a hapụrụ ohere nghọta ahụ dịka ọ dị na Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A họọrọ ‘Ndị Iri na Abụọ’ dịka aha ìgwè pụrụ iche, ‘ndị isi nchụàjà’ maka òtù ndị ndu nchụàjà, na ‘ndị odeakwụkwọ’ maka ndị scribes, n’agbakwụnyeghị nkọwa okpukpe na-adịghị n’ederede Grik.
