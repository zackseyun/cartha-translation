  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: ig
  text: Ụfọdụ wee malite ịgbụ ya asụ, ikpuchi ihu ya[a], ịkụ ya ọkpọ, na ịsị ya, “Buo amụma!” Ndị nche ahụ wee tie ya ihe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikechi ya anya.” N’asụsụ Grik, ọ pụtara kpọmkwem, “ikpuchi ihu ya.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, akpaokwu ahụ bụ kpọmkwem, “ndị nche ahụ ji ihe otiti nabata ya.” A pụkwara ịsụgharị ya, “Ndị nche ahụ tiri ya ihe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό
  choice: wee malite
  rationale: Ọ na-egosi mmalite omume ndị a n’usoro akụkọ ahụ; ‘wee malite’ bụ ụzọ Igbo dị mfe ma kwekọọ n’ụdị akụkọ.
- source_word: τινες
  choice: Ụfọdụ n’ime ha
  rationale: Ọ na-ezo aka n’ụfọdụ ndị nọ n’ìgwè ahụ, ma akọwaghị kpọmkwem ndị ha bụ.
- source_word: ἐμπτύειν αὐτῷ
  choice: ịgbụ ya ọnụ mmiri
  rationale: Nke a bụ okwu Igbo eke maka ịgbụ mmadụ ọnụ mmiri, ma na-egosikwa mkparị ahụ e mere ya.
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: ikpuchi ihu ya
  rationale: Nke a na-edobe okwu Grik ahụ kpọmkwem karịa ịsụgharị nzube ya dị ka ‘ikechi ya anya.’
- source_word: κολαφίζειν αὐτὸν
  choice: iji aka ha akụọ ya ọkpọ
  rationale: κολαφίζω na-egosikarị iti mmadụ ọkpọ; nsụgharị a na-edobe ụdị iti ahụ nke ọma.
- source_word: λέγειν αὐτῷ· Προφήτευσον
  choice: na ịsị ya, “Buo amụma!”
  rationale: E debere iwu mkparị ahụ n’enweghị ịgbakwụnye nkọwa nke na-adịghị n’ederede Grik.
- source_word: ὑπηρέται
  choice: Ndị nche ahụ
  rationale: N’ọnọdụ ikpe a, okwu ahụ na-ezo aka n’ụmụodibo ndị ọchịchị ma ọ bụ ndị nche, ọ bụghị ndị ohu ụlọ.
- source_word: ῥαπίσμασιν
  choice: iti ihe
  rationale: Okwu Grik ahụ nwere ike ịbụ ụra ma ọ bụ ụdị iti ọzọ; ‘iti ihe’ na-ezere ịkọwapụta karịa ihe isi mmalite kwuru.
- source_word: ἔλαβον
  choice: nabata ya
  rationale: A hapụrụ ihe oyiyi dị n’akpaokwu Grik ‘were/nabata ya site n’iti ihe,’ ebe ndetu ala na-enye ụzọ Igbo doro anya karị.
theological_decisions:
- issue: Iwu mkparị Προφήτευσον n’ihe gbasara onye Jizọs bụ
  choice: “Buo amụma!”
  alternative: “Gosi na ị bụ onye amụma!”
  rationale: Ederede ahụ nwere naanị iwu ahụ. Nsụgharị a anaghị etinye nkọwa ozizi ọzọ, ya mere ọ na-echekwa mkparị na mgbagwoju anya dị n’akụkọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Jizọs’ghị n’amaokwu a n’ihi na nnọchiaha niile doro anya site n’okwu gbara ya gburugburu. E debere akpaokwu ikpeazụ n’ụdị ihe oyiyi Grik, ma nye nsụgharị Igbo ka eke karịa na ndetu ala.
