revisions:
- from: Ụfọdụ n’ime ha wee malite ịgbụ ya ọnụ mmiri, ikpuchi ihu ya[a], iji aka ha akụọ ya ọkpọ, na ịsị ya, “Buo amụma!” Ndị nche ahụ jikwa iti ihe nabata ya.[b]
  to: Ụfọdụ wee malite ịgbụ ya asụ, ikpuchi ihu ya[a], ịkụ ya ọkpọ, na ịsị ya, “Buo amụma!” Ndị nche ahụ wee tie ya ihe.[b]
  rationale: The revision removes unnecessary specification, uses natural Standard Igbo for spitting and punching, and renders the final Greek idiom according to its contextual meaning rather than reproducing an unintelligible literalism. The footnotes preserve both the alternative sense of covering the face and the Greek imagery in the final clause without changing the passage’s meaning.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:00:12Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the sequence of spitting, covering Jesus’ face, punching him, and the mocking command. However, the final clause, “jikwa iti ihe nabata ya,” follows the Greek wording too mechanically and is not idiomatic Igbo; in context the expression means that the officers struck/slapped him. “Ụfọdụ n’ime ha” also slightly specifies the referent beyond the indefinite τινες, for which “Ụfọdụ” is sufficient.
  naturalness: “Ịgbụ ya ọnụ mmiri” and especially “jikwa iti ihe nabata ya” are awkward in Standard Igbo. “Ịgbụ ya asụ,” “ịkụ ya ọkpọ,” and “Ndị nche ahụ wee tie ya ihe” are clear, natural, and retain the register of the narrative.
  terminology: “Ihu,” “amụma,” and “ndị nche” are suitable. “Ikechi ya anya” is a valid interpretive alternative for covering his face. “Tie ya ihe” appropriately renders the broad force of ῥαπίσμασιν without claiming a precise implement or type of blow.
  issues:
  - severity: medium
    issue: The rendering “jikwa iti ihe nabata ya” is nonidiomatic and obscures the meaning of the final Greek idiom.
    rationale: Although ἔλαβον is literally “received/took,” ῥαπίσμασιν αὐτὸν ἔλαβον is an idiomatic description of the officers’ assault. Standard Igbo should state that they struck him; the footnote can note the literal Greek expression.
  - severity: low
    issue: “Ụfọdụ n’ime ha” adds “among them” to the indefinite τινες.
    rationale: The source only says “some.” The wider context may identify the group, but “Ụfọdụ” preserves the source’s lack of specification.
  - severity: low
    issue: The first two action phrases are less natural than standard alternatives.
    rationale: “Ịgbụ ya asụ” is the ordinary expression for spitting on someone, and “ịkụ ya ọkpọ” gives a smooth parallel series of infinitives.
  revised_text: Ụfọdụ wee malite ịgbụ ya asụ, ikpuchi ihu ya[a], ịkụ ya ọkpọ, na ịsị ya, “Buo amụma!” Ndị nche ahụ wee tie ya ihe.[b]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ikechi ya anya.” N’asụsụ Grik, ọ pụtara kpọmkwem, “ikpuchi ihu ya.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, akpaokwu ahụ bụ kpọmkwem, “ndị nche ahụ ji ihe otiti nabata ya.” A pụkwara ịsụgharị ya, “Ndị nche ahụ tiri ya ihe.”
    reason: lexical_alternative
  revision_rationale: The revision removes unnecessary specification, uses natural Standard Igbo for spitting and punching, and renders the final Greek idiom according to its contextual meaning rather than reproducing an unintelligible literalism. The footnotes preserve both the alternative sense of covering the face and the Greek imagery in the final clause without changing the passage’s meaning.
