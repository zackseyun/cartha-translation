  text: Then they laid hands on him and seized him[a][b].
translation:
  language: ig
  text: Mgbe ahụ, ha bikwasịrị ya aka, jide ya[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha setịrị ya aka n’ahụ.” Nke a bụ akpaala okwu Grik maka ijide mmadụ, ọtụtụ mgbe iji nwụchie ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “nwụchiri ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mgbe ahụ, ha
  rationale: οἱ bụ nnọchiaha n'ọnọdụ a, δέ na-egosikwa nzọụkwụ ọhụrụ dị nro n'akụkọ ahụ. “Mgbe ahụ, ha” na-eme ka akụkọ ahụ na-aga n'ihu n'Igbo nkịtị n'etinyeghị nkwụgide siri ike nke “ma.”
- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
  choice: ha jidere ya aka
  rationale: Nkebi okwu Grik a bụ akpaala okwu nke pụtara itinye aka n'ahụ mmadụ iji jide ya, karịchaa n'ọnọdụ njide. “Jidere ya aka” na-enye echiche nke imetụ ya aka n'ike iji nweta ya, ma hapụkwa ngwaa na-esote ka o kwuo njide ahụ nke ọma.
- source_word: ἐκράτησαν αὐτόν
  choice: nwụchie ya
  rationale: κρατέω n'ọnọdụ a pụtara ijide mmadụ n'ike ma debe ya n'okpuru njide. “Nwụchie ya” bụ okwu Igbo doro anya ma kwekọọ n'ọnọdụ ndị bịara ijide Jizọs.
