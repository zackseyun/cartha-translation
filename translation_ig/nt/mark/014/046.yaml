translation_notes:
  register: E ji Standard Igbo dị mfe, nke ugwu na nke ndị nkịtị ga-aghọta. E chekwara usoro ngwaa abụọ dị na Grik—ibu ụzọ tinye aka n'ahụ ya, mesịa nwụchie ya—n'agbanyeghị na echiche ha na-adịtụ ibe ha nso.
