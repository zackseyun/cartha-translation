- from: Mgbe ahụ, ha jidere ya aka ma nwụchie ya[a][b].
  to: Mgbe ahụ, ha bikwasịrị ya aka, jide ya[a][b].
  rationale: The revision replaces an ambiguous expression that can mean holding someone’s hand with the established idiom “bikwasịrị ya aka.” It also uses “jide ya” for the explicit act of seizing, preserving the Greek’s force and avoiding an unnecessarily formal procedural nuance. Both source actions and the footnote anchors are retained.
