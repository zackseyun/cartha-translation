review_pass:
  verdict: revise
  source_fidelity: 'Isi ntụgharị ahụ na-egosipụta Grik ahụ nke ọma: «Nke a bụ», «ọbara m», «nke ọgbụgba ndụ», na «maka ọtụtụ mmadụ» na-echekwa okwu na nhazi isi nke amaokwu ahụ. Ọ naghị agbakwunye «ọhụrụ» n’ederede bụ isi.'
  naturalness: Ederede bụ isi dị ebumpụta ụwa ma doo anya n’Igbo Standard. Otú ọ dị, nkebi okwu dị na ndetu b, «nke a nọ na-awụfu», adịghị ekwekọ n’ụzọ Igbo si ekwu ya nke ọma; a gbanwere ya ka ọ bụrụ nhọrọ Igbo a na-ahụkarị.
  terminology: «Ọgbụgba ndụ» dabara nke ọma maka διαθήκη n’ọnọdụ a, ma «ọbara» na «awụfu» na-echekwa ihe oyiyi àjà ahụ. Ndetu c mbụ jiri «n’ihi ọtụtụ mmadụ», nke nwere ike ịpụta ihe kpatara omume karịa «on behalf of»; e mere ka nhọrọ ahụ doo anya.
  issues:
  - severity: medium
    issue: 'Ndetu ala c: «n’ihi ọtụtụ mmadụ»'
    rationale: N’Igbo, nkebi okwu a na-adịkarị ka «because of many people» karịa echiche ὑπὲρ πολλῶν nke «for/on behalf of many». «N’ihi ọdịmma ọtụtụ mmadụ» na-ekwupụta nhọrọ ahụ n’enweghị ịgbakwunye nkwubi-ozizi.
  - severity: low
    issue: 'Ndetu ala b: «nke a nọ na-awụfu»'
    rationale: «Nọ na-awụfu» adịghị eke n’ụdị a. «Nke a na-awụpụ» bụ nhọrọ dị mma maka «which is being poured out», ebe «nke a na-awụsa» nwere ike ịnọgide dị ka ntụgharị ọdịnala.
