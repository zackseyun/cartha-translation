  text: καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ αἷμά μου ⸀τῆς διαθήκης τὸ ⸂ἐκχυννόμενον ὑπὲρ πολλῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: ig
  text: Ọ sịrị ha, “Nke a bụ ọbara m nke ọgbụgba ndụ[a], nke a na-awụfu[b] maka ọtụtụ mmadụ[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ odide na amaokwu ndị yiri nke a nwere, “ọbara m nke ọgbụgba ndụ ọhụrụ.” Ma a kacha akwado ịgụ ederede Grik nke Mak n’ebe a dịka, “ọbara m nke ọgbụgba ndụ.”
    reason: textual_variant
  - marker: b
    text: A pụkwara ịsụgharị ya, “nke a na-awụpụ”; ntụgharị ọdịnala bụ, “nke a na-awụsa.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n’ihi ọdịmma ọtụtụ mmadụ,” ma ọ bụ “n’ọnọdụ ọtụtụ mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: Nke a bụ
  rationale: Nke a na-egosipụta njikọ okwu Grik ahụ kpọmkwem, n’etinyeghị nkọwa dịka ‘nke a pụtara’ ma ọ bụ ‘nke a na-anọchi anya.’
- source_word: τὸ αἷμά μου
  choice: ọbara m
  rationale: Nke a bụ ntụgharị kpọmkwem nke njikọ nwe; ọ na-edobekwa ihe atụ ọbara nke àjà na ọgbụgba ndụ n’amaokwu ahụ.
- source_word: τῆς διαθήκης
  choice: nke ọgbụgba ndụ
  rationale: ‘Ọgbụgba ndụ’ bụ okwu Igbo kwesịrị ekwesị n’ọnọdụ a, nke na-echetara ọbara e ji mee ka ọgbụgba ndụ guzosie ike; ederede Grik a enweghị okwu ‘ọhụrụ.’
- source_word: ἐκχυννόμενον
  choice: nke a na-awụfu
  rationale: Ụdị a na-egosipụta participle dị na present passive ma na-adabara ọbara n’Igbo; ọ na-echekwa ihe atụ nke ịwụfu ọbara n’etinyeghị nkọwa ọzọ.
- source_word: ὑπὲρ πολλῶν
  choice: maka ọtụtụ mmadụ
  rationale: Nke a bụ okwu Igbo dị mfe ma doo anya maka ‘for many’; ọ na-echekwa ‘ọtụtụ’ nke isi mmalite ma ghara ịgbanwe ya ka ọ bụrụ ‘mmadụ niile’ ma ọ bụ kpebie esemokwu nkà mmụta okpukpe.
theological_decisions:
- issue: Ma διαθήκη ga-abụ ọgbụgba ndụ ka ọ bụ akwụkwọ ikike e dere tupu ọnwụ
  choice: ọgbụgba ndụ
  alternative: akwụkwọ ikike e dere tupu ọnwụ
  rationale: N’ọnọdụ Nri Anyasị Ikpeazụ na okwu gbasara ọbara, ihe a na-ekwu bụ ọgbụgba ndụ, karịsịa dịka ọ na-echetara Ọpụpụ 24:8.
- issue: Ma a ga-agbakwunye ‘ọhụrụ’ n’ihu ‘ọgbụgba ndụ’
  choice: nke ọgbụgba ndụ
  alternative: nke ọgbụgba ndụ ọhụrụ
  rationale: Ederede SBLGNT nke Mak 14:24 enweghị καινῆς (‘ọhụrụ’). Ya mere, e kwesịghị ime ka Mak kwekọọ n’amaokwu ndị yiri ya site n’ịgbakwunye okwu na-adịghị n’isi mmalite.
- issue: Ihe ὑπὲρ πολλῶν pụtara banyere ndị ọnwụ ahụ metụtara
  choice: maka ọtụtụ mmadụ
  alternative: maka mmadụ niile; n’ọnọdụ ọtụtụ mmadụ
  rationale: A na-edobe okwu Jizọs bụ ‘ọtụtụ’ n’enweghị iji ‘mmadụ niile’ dochie ya, ma a naghịkwa eji ntụgharị ahụ kpebie ozizi sara mbara banyere mkpuchi mmehie.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Ọgbụgba ndụ’ bụ okwu ụka a maara nke ọma ma kwesịkwa ekwesị n’ebe a. E debere usoro okwu ahụ n’ụzọ ebumpụta ụwa n’Igbo, ma e chekwara njikọ dị n’etiti ọbara, ọgbụgba ndụ, na ịwụfu ya.
