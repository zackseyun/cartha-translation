    text: Ma ọ bụ, “ọlaọcha.” Okwu Grik ahụ nwere ike ịpụta ọlaọcha n'ụzọ nkịtị ma ọ bụ ego n'ozuzu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nyefee ya.” Okwu Grik ahụ nwere ike ịpụta inyefe ma ọ bụ inyefe mmadụ n'aka ọzọ; n'ebe a, “rara ya nye” na-egosi aghụghọ Judas mere.
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s accurate contextual rendering of Judas’s action as betrayal while expressing εὐκαίρως without adding an event of an opportunity arising. It also corrects the lexical footnote so that its alternative reflects the Greek without supplying an explicit recipient.
