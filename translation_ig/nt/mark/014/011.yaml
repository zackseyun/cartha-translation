  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐχάρησαν καὶ ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι. καὶ ἐζήτει πῶς ⸂αὐτὸν εὐκαίρως παραδοῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: ig
  text: Mgbe ha nụrụ nke a, obi dị ha ụtọ, ha kwe nkwa inye ya ego[a]. Ọ malitere ịchọ ụzọ ọ ga-esi rara ya nye[b] n'oge dabara adaba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọlaọcha.” Okwu Grik ahụ nwere ike ịpụta ọlaọcha n'ụzọ nkịtị ma ọ bụ ego n'ozuzu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nyefee ya.” Okwu Grik ahụ nwere ike ịpụta inyefe ma ọ bụ inyefe mmadụ n'aka ọzọ; n'ebe a, “rara ya nye” na-egosi aghụghọ Judas mere.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: Mgbe ha nụrụ nke a
  rationale: Nkebi okwu participle a na-egosi oge na mmeghachi omume ndị isi nchụàjà; ‘nke a’ sitere n'ihe gbara amaokwu ahụ gburugburu ma mee ka Igbo bụrụ nke eke.
- source_word: ἐχάρησαν
  choice: obi dị ha ụtọ
  rationale: Nke a bụ ụzọ Igbo a na-asụ ugbu a si egosipụta ọṅụ ma ọ bụ aṅụrị ha nwere n'ihi ihe ha nụrụ, na-enweghị ime ka okwu ahụ dị arọ karịa isi Grik.
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: ha kwekwara nkwa inye ya ego
  rationale: ἐπαγγέλλομαι bụ ikwe nkwa; ἀργύριον nwere ike ịbụ ọlaọcha n'ụzọ nkịtị ma ọ bụ ego n'ozuzu, ebe ‘ego’ kacha doo anya n'ọnọdụ a.
- source_word: ἐζήτει
  choice: O wee malite ịchọ
  rationale: Imperfect ahụ na-egosi omume gara n'ihu ma nwee ike inwe nghọta mmalite n'usoro akụkọ a; ntụgharị a na-egosipụta ma mmalite ma ebumnobi na-aga n'ihu.
- source_word: πῶς ... εὐκαίρως
  choice: ụzọ ọ ga-esi ... mgbe ohere kwesịrị ekwesị dapụtara
  rationale: πῶς na-ajụ ụzọ e si eme ihe, ebe εὐκαίρως na-egosi ohere ma ọ bụ oge dabara adaba; okwu Igbo a na-egosipụta atụmatụ ya n'ụzọ eke.
- source_word: παραδοῖ
  choice: rara ya nye
  rationale: παραδίδωμι nwere isi bụ inyefe mmadụ, ma n'ọnọdụ Judas a ọ bụ nrara nye. ‘Rara ya nye’ na-ejigide mmetụta aghụghọ ahụ, ebe ihe ọzọ kwere omume dị na ndetu ala peeji.
theological_decisions:
- issue: Otú e si tụgharịa παραδίδωμι n'omume Judas
  choice: rara ya nye
  alternative: nyefee ya n'aka ha
  rationale: N'ọnọdụ akụkọ a, Judas anaghị eme naanị nnyefe nkịtị; ọ na-emekọ ihe na nzuzo megide Jizọs. ‘Rara ya nye’ na-egosipụta nke a na-enweghị ịgbakwunye nkọwa ozizi na-adịghị na ederede.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa nsọpụrụ. E ji ‘obi dị ha ụtọ’ mee ka mmeghachi omume ahụ bụrụ nke eke; e jikwara ‘mgbe ohere kwesịrị ekwesị dapụtara’ gosipụta εὐκαίρως n'enweghị itinye nkọwa na-adịghị na amaokwu ahụ.
