- from: Mgbe ha nụrụ nke a, obi dị ha ụtọ, ha kwekwara nkwa inye ya ego[a]. O wee malite ịchọ ụzọ ọ ga-esi rara ya nye[b] mgbe ohere kwesịrị ekwesị dapụtara.
  to: Mgbe ha nụrụ nke a, obi dị ha ụtọ, ha kwe nkwa inye ya ego[a]. Ọ malitere ịchọ ụzọ ọ ga-esi rara ya nye[b] n'oge dabara adaba.
  rationale: The revision retains the draft’s accurate contextual rendering of Judas’s action as betrayal while expressing εὐκαίρως without adding an event of an opportunity arising. It also corrects the lexical footnote so that its alternative reflects the Greek without supplying an explicit recipient.
