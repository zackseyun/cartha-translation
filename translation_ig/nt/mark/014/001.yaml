revisions:
- from: Ememme Ngabiga na Ememme Achịcha Na-ekoghị Eko fọrọ ụbọchị abụọ ka ha ruo[a]. Ndị isi nchụaja na ndị odeakwụkwọ nọkwa na-achọ ụzọ ha ga-esi jiri aghụghọ jide ya[c] ma gbuo ya.[b]
  to: Ọ fọdụrụ ụbọchị abụọ tupu Ememme Ngabiga na Ememme Achịcha Na-ekoghị Eko[b] eruo[a]. Ndị isi nchụaja na ndị odeakwụkwọ nọkwa na-achọ ụzọ ha ga-esi jiri aghụghọ jide ya[c] ma gbuo ya.
  rationale: The revision makes the opening time expression idiomatic while retaining the source’s “after/in two days” imminence. It also places each footnote at its relevant term and narrows the arrest-note alternatives to the lexical scope of κρατήσαντες, without altering the passage’s meaning.
