    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “weghara ya” ma ọ bụ “jide ya.”
    reason: alternative_reading
  revision_rationale: The revision makes the opening time expression idiomatic while retaining the source’s “after/in two days” imminence. It also places each footnote at its relevant term and narrows the arrest-note alternatives to the lexical scope of κρατήσαντες, without altering the passage’s meaning.
