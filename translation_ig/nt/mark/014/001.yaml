id: MRK.14.1
reference: Mark 14:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἦν δὲ τὸ πάσχα καὶ τὰ ἄζυμα μετὰ δύο ἡμέρας. καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς πῶς αὐτὸν ἐν δόλῳ κρατήσαντες ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: ig
  text: Ọ fọdụrụ ụbọchị abụọ tupu Ememme Ngabiga na Ememme Achịcha Na-ekoghị Eko[b] eruo[a]. Ndị isi nchụaja na ndị odeakwụkwọ nọkwa na-achọ ụzọ ha ga-esi jiri aghụghọ jide ya[c] ma gbuo ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ nkịtị karị, “mgbe ụbọchị abụọ gasịrị.” Okwu a na-egosi na Ememme Ngabiga na Ememme Achịcha Na-ekoghị Eko eruola nso.
    reason: lexical_alternative
  - marker: b
    text: N'asụsụ Grik, “ihe ndị na-ekoghị eko,” bụ ụzọ a na-ejikarị ekwu maka Ememme Achịcha Na-ekoghị Eko.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “weghara ya” ma ọ bụ “jide ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: fọrọ ...; nọkwa
  rationale: A sụgharịrị ọnọdụ oge ahụ n'Igbo n'ụzọ ebumpụta ụwa, ebe ‘-kwa’ na-egosi ntugharị dị nro nke δέ n'usoro akụkọ.
- source_word: τὸ πάσχα
  choice: Ememme Ngabiga
  rationale: Nke a bụ aha Igbo doro anya maka ememme ndị Juu a; n'ebe a ọ na-ezo aka n'ememme ahụ, ọ bụghị naanị nwa atụrụ e ji achụ àjà.
- source_word: τὰ ἄζυμα
  choice: Ememme Achịcha Na-ekoghị Eko
  rationale: N'okwu ememme a, ‘ihe ndị na-ekoghị eko’ na-ezo aka n'Ememme Achịcha Na-ekoghị Eko; itinye ‘Ememme’ na-eme ka ihe a na-ekwu doo onye na-agụ anya.
- source_word: μετὰ δύο ἡμέρας
  choice: fọrọ ụbọchị abụọ ka ha ruo
  rationale: Nke a na-enye echiche na ememme ndị ahụ dị ụbọchị abụọ n'ihu n'Igbo dị mfe ma dị ugbu a, ebe nkọwa ala peeji na-edobe nsụgharị nkịtị karị.
- source_word: ἐζήτουν
  choice: nọ ... na-achọ
  rationale: Ụdị a na-egosi omume na-aga n'ihu, kwekọọ na imperfect Grik.
- source_word: οἱ ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Ọ na-ezo aka n'ọtụtụ ndị ọchịchị kachasị elu n'etiti ndị nchụaja, ọ bụghị naanị otu nnukwu onye nchụaja.
- source_word: οἱ γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nke a bụ nsụgharị kwụ ọtọ maka ndị maara ma na-akọwa Iwu; e zere ịgbakwunye nkọwa karịrị okwu Grik.
- source_word: πῶς
  choice: ụzọ ha ga-esi
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si akọwa ‘otu/ụzọ’ e ga-esi mee ihe.
- source_word: ἐν δόλῳ
  choice: jiri aghụghọ
  rationale: ‘Aghụghọ’ na-edobe echiche nke nduhie na atụmatụ ọjọọ, ọ bụghị naanị ime ihe na nzuzo.
- source_word: κρατήσαντες
  choice: jide ya
  rationale: Okwu ahụ pụtara ijide ma ọ bụ were n'okpuru ikike; ‘jide ya’ na-edobe obosara okwu Grik, ebe nkọwa ala peeji na-akọwa nhọrọ ndị ọzọ.
- source_word: ἀποκτείνωσιν
  choice: gbuo ya
  rationale: Nke a bụ nsụgharị Igbo kpọmkwem ma dị mfe maka ‘igbu’.
theological_decisions:
- issue: Mmekọrịta dị n'etiti Ngabiga na Achịcha Na-ekoghị Eko
  choice: 'E depụtara ha iche: ‘Ememme Ngabiga na Ememme Achịcha Na-ekoghị Eko.’'
  alternative: Iwere ha dị ka otu aha ememme jikọtara ọnụ.
  rationale: Mak kpọrọ ihe abụọ ahụ aha. Nsụgharị a na-edobe ọdịiche ahụ ma ghara ịgọnahụ na ememme abụọ ahụ nwere njikọ chiri anya.
- issue: Ụdị omume ndị ndú ahụ zubere
  choice: A sụgharịrị ἐν δόλῳ dịka ‘jiri aghụghọ.’
  alternative: ‘na nzuzo’ ma ọ bụ ‘n'ụzọ zoro ezo.’
  rationale: Okwu Grik ahụ na-egosi nduhie na aghụghọ, ọ bụghị naanị izochi ihe; nsụgharị ahụ na-edobe ibu omume ọjọọ dị n'okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu na-aga were were n'Igbo, ma debe aha ememme ndị Juu na ọdịiche dị n'etiti ha. Ihe nrịbama ala peeji [a], [b], na [c] niile pụtara n'ederede isi.
