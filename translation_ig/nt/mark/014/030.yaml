id: MRK.14.30
reference: Mark 14:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: ig
  text: 'Jizọs wee sị ya, “N’ezie, ana m agwa gị: taa, n’abalị a kpọmkwem, tupu oke ọkụkọ akwaa ugboro abụọ, ị ga-agọnahụ m ugboro atọ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: wee sị
  rationale: Ọ bụ ezie na Grik ji historical present, usoro akụkọ Igbo na-eji “wee sị” eme ka akụkọ na-aga n’ihu n’ụzọ dị ndụ ma dịkwa eke, na-enweghị ime ka okwu ahụ sie ike nghọta.
- source_word: Ἀμὴν
  choice: N'ezie
  rationale: N’ebe a, ἀμήν bụ nkwupụta siri ike nke na-egosi eziokwu na ịdị mkpa nke ihe Jizọs na-aga ikwu; “N’ezie” na-enye otu ike ahụ n’Igbo nke oge a.
- source_word: λέγω σοι
  choice: ana m agwa gị
  rationale: Nke a na-echekwa onye nke mbụ na onye a na-agwa okwu, ma bụrụkwa ụzọ Igbo nkịtị si ekwu nkwupụta kpọmkwem.
- source_word: σὺ
  choice: gị / ị
  rationale: A na-egosipụta onye a na-agwa okwu nke ọma site na “gị” na “ị”; usoro ahịrịokwu Igbo na-eme ka ntụkwasị ahụ doo anya n’enweghị ikwughachi nnọchiaha n’ụzọ na-adịghị eke.
- source_word: σήμερον
  choice: taa
  rationale: Nke a bụ ntụgharị kpọmkwem ma doo anya nke σήμερον, a hapụghịkwa ya n’agbanyeghị na “n’abalị a” sochiri ya.
- source_word: ταύτῃ τῇ νυκτί
  choice: n'abalị a kpọmkwem
  rationale: “Kpọmkwem” na-egosipụta ike demonstrative ahụ ma na-eme ka ngwa ngwa nke amụma ahụ pụta ìhè n’Igbo eke.
- source_word: πρὶν ἢ
  choice: tupu
  rationale: “Tupu” bụ njikọ oge Igbo kwesịrị ekwesị maka ihe ga-eme tupu ihe ọzọ emee.
- source_word: δὶς
  choice: ugboro abụọ
  rationale: Nke a na-echekwa ọnụọgụ ahụ kpọmkwem, nke dị mkpa n’akụkọ Mak.
- source_word: ἀλέκτορα φωνῆσαι
  choice: oke ọkụkọ akụọ
  rationale: “Oke ọkụkọ akụọ” bụ ụzọ Igbo doro anya na nke a na-ahụkarị isi kwuo mkpu oke ọkụkọ; a naghị amanye article nke Grik n’ihi na Igbo enweghị usoro article yiri nke ahụ.
- source_word: τρίς
  choice: ugboro atọ
  rationale: Nke a bụ ntụgharị kpọmkwem nke adverb ahụ ma na-echekwa ọdịiche dị n’etiti ugboro abụọ na ugboro atọ.
- source_word: με ἀπαρνήσῃ
  choice: ị ga-agọnahụ m
  rationale: “Ị ga-agọnahụ m” na-egosipụta ịjụ ma ọ bụ ikwu na mmadụ amaghị Jizọs, ma ghara ibubata nkọwa ụka pụrụ iche.
theological_decisions:
- issue: Njikọ oge σήμερον na ταύτῃ τῇ νυκτί
  choice: 'E debere ha abụọ: “taa, n’abalị a kpọmkwem”'
  alternative: Ijikọta ha bụrụ naanị “n’abalị a kpọmkwem”
  rationale: Ederede Grik nwere okwu oge abụọ ahụ; idebe ha na-echekwa nkwusi ike na ịdị nso nke amụma ahụ n’enweghị ịkọwa ihe karịrị isi mmalite.
- issue: Historical present λέγει
  choice: “wee sị” n’usoro akụkọ Igbo
  alternative: “na-asị ya” ma ọ bụ “sịrị ya”
  rationale: “Wee sị” na-echekwa mmegharị na ịdị ndụ nke akụkọ Mak n’ụzọ Igbo na-anabata nke ọma, ọbụna ma ọ naghị emepụtaghachi present tense n’ụdị okwu kpọmkwem.
- issue: Ike nke nnọchiaha σὺ
  choice: E gosipụtara onye ahụ site na “gị” na “ị” n’ahịrịokwu eke
  alternative: Ịgbakwunye “gị onwe gị”
  rationale: “Gị onwe gị” nwere ike itinye ntụkwasị ike karịrị nke ọnọdụ a chọrọ. Nhazi ahịrịokwu ahụ ka na-eme ka Pita bụrụ onye amụma ahụ metụtara kpọmkwem.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. E jiri “Jizọs,” “N’ezie,” “oke ọkụkọ,” na “agọnahụ” mee ihe dịka okwu doro anya nye ndị na-agụ Bible n’Igbo, ma zere okwu ochie ma ọ bụ nkọwa nke otu ụka.
