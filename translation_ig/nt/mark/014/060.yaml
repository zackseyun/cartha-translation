  - severity: low
    issue: “Onyeisi nchụaja” enweghị nkewa okwu a na-ahụkarị.
    rationale: “Onye isi nchụaja” bụ mkpụrụokwu doro anya, nke sitere n’okwu “onye isi” na “nchụaja.”
  - severity: low
    issue: “ndị ikom a” na-eme ka ụdị ụtọasụsụ nwoke Grik bụrụ nkwupụta okike n’Igbo.
    rationale: N’Igbo, “ndị a” na-ezo aka n’otu ndị akaebe ahụ n’enweghị mgbakwunye a na-achọghị. Nkọwa ala nwere ike depụta na Grik ji ọtụtụ nke nwoke, ma ghara ikwu na nke a chọrọ “ndị ikom” n’Igbo.
