  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: ig
  text: Onye isi nchụaja ahụ biliri gaa guzoro n’etiti ha[a], jụọ Jizọs, sị, “Ị naghị aza ihe ọ bụla[b]? Gịnị ka ndị a[c] na-agba akaebe megide gị?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ba n’etiti.” Akpaokwu ahụ na-egosi na onye isi nchụaja ahụ guzoro n’ebe etiti nzukọ ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ị nweghị ihe ị ga-aza?”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “ndị a”; okwu Grik ahụ dị n’ụdị ọtụtụ nke nwoke ma na-ezo aka ná ndị akaebe nọ ebe ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: biliri
  rationale: Okwu a na-egosi na onyeisi nchụaja ahụ si n’ọnọdụ ọ nọ bilie; “biliri” bụ Igbo doro anya ma bụrụkwa nke e ji akọ ihe mere.
- source_word: ὁ ἀρχιερεὺς
  choice: Onyeisi nchụaja ahụ
  rationale: Nke a bụ aha a na-ejikarị akọwa onye nchụaja kasị elu nke na-edu ikpe ahụ.
- source_word: εἰς μέσον
  choice: gaa guzoro n’etiti ha
  rationale: Akpaokwu Grik a na-egosi ịbanye n’ebe etiti ndị nzukọ ahụ nọ. “Gaa guzoro” na-eme ka mmegharị ahụ doo anya n’Igbo, ebe “ha” na-ezo aka ná ndị nọ na nzukọ ahụ.
- source_word: ἐπηρώτησεν
  choice: jụọ
  rationale: “Jụọ” bụ okwu Igbo nkịtị maka ịjụ ajụjụ; ọnọdụ ikpe ahụ n’onwe ya na-enye okwu a ụda nke ịgba ajụjụ n’enweghị ịgbakwụnye ike na-adịghị n’ederede.
- source_word: ἀποκρίνῃ οὐδέν
  choice: Ị naghị aza ihe ọ bụla?
  rationale: Nke a na-echekwa ajụjụ ịma aka ahụ n’ụzọ dị nkenke ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: οὗτοί
  choice: ndị ikom a
  rationale: Nnochiaha ngosi ahụ dị n’ụdị ọtụtụ nke nwoke, ọ na-ezokwa aka ná ndị akaebe nọ ebe ahụ; “ndị ikom a” na-eme ka nke ahụ pụta ìhè.
- source_word: καταμαρτυροῦσιν
  choice: na-agba akaebe megide gị
  rationale: Nke a na-echekwa echiche iwu nke ịgba akaebe megide mmadụ, kama ịsụgharị ya nanị dị ka ibo ebubo.
theological_decisions:
- issue: Ma a ga-eme ka ụdị nwoke dị na οὗτοί pụta ìhè
  choice: ndị ikom a
  alternative: ndị a
  rationale: A họọrọ “ndị ikom a” iji gosipụta ụdị ọtụtụ nke nwoke dị na Grik na ndị akaebe a kapịrị ọnụ nọ n’ebe ikpe ahụ, n’agbanyeghị na “ndị a” ga-abụkwa Igbo dị mfe.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọsọ akụkọ na ụda ajụjụ ikpe ahụ, ma ọ naghị eme ka “jụọ” sie ike ruo n’ókè nke ịsị “gba ya ajụjụ ọnụ.”
