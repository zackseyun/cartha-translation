  verdict: revise
  source_fidelity: 'Ihe fọrọ nke nta ka ọ bụrụ nke ziri ezi: “biliri gaa guzoro n’etiti ha” na-egosipụta ἀναστὰς ... εἰς μέσον, “jụọ” na-egosipụta ἐπηρώτησεν, “na-adịghị aza ihe ọ bụla” na-egosipụta ajụjụ ịma aka ahụ, ma “na-agba akaebe megide gị” na-echekwa καταμαρτυροῦσιν nke ọma. Otú ọ dị, nkọwa ala a na-ekwu na “banye n’etiti” bụ nsụgharị nkịtị, ebe nke a karịrị ihe Grik ahụ kwuru; εἰς μέσον bụ “n’etiti/ba n’etiti,” ọ bụghị ngwaa “banye” n’onwe ya.'
  naturalness: Ahịrịokwu ahụ bụ Igbo Ọkọlọtọ doro anya ma kwekọọ na ndekọ akụkọ ikpe. “Onye isi nchụaja” ka a na-ede n’ụzọ doro anya karịa “Onyeisi nchụaja.” N’Igbo, “ndị a” na-adịkarị mma karịa “ndị ikom a” n’ebe ọtụtụ nke nwoke n’asụsụ Grik bụ ụdị ụtọasụsụ; nkịtị ahụ ekwesịghị itinye nkwupụta gbasara okike nke Igbo anaghị achọ.
  terminology: “Onye isi nchụaja,” “Jizọs,” na “ịgba akaebe megide” dabara adaba. E debeghị “ndị ikom” n’ederede, n’ihi na ọtụtụ nke nwoke Grik anaghị akpaghị aka achọ ka e tinye okwu nwoke n’Igbo; ihe ndị gbara okwu gburugburu na-egosi ndị akaebe ahụ.
  issues:
