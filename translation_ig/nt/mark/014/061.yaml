id: MRK.14.61
reference: Mark 14:61
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: ig
  text: Ma ọ nọgidere na-adị jụụ, ọ zaghị ihe ọ bụla. Onyeisi nchụaja ahụ jụkwara ya ọzọ, sị ya, “Ị bụ Mesaya[a], Nwa Onye A Gọziri Agọzi[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “Kraịst.” Okwu Grik bụ Χριστός (Christos); n’ebe a, a sụgharịrị ya “Mesaya” n’ihi na ọ na-arụ ọrụ dị ka utu aha n’ọnọdụ olileanya Mesaya nke ndị Juu.
    reason: alternative_reading
  - marker: b
    text: “Onye A Gọziri Agọzi” bụ ụzọ nsọpụrụ ndị Juu si ezo aka na Chineke.
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: ọ nọgidere na-agbachi nkịtị
  rationale: Ụdị ngwaa imperfect na-egosi na ịgbachi nkịtị ya gara n’ihu; okwu a na-egosipụta nke ahụ n’Igbo doro anya.
- source_word: ἀπεκρίνατο οὐδέν
  choice: ọ zaghịkwa ihe ọ bụla
  rationale: Nke a na-edobe nkwusi ike nke οὐδέν, ya bụ na ọ dịghị azịza ọ bụla o nyere.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na onyeisi nchụaja ahụ meghachiri ajụjụ ya.
- source_word: ἀρχιερεὺς
  choice: onyeisi nchụaja
  rationale: Nke a bụ aha ọrụ kwesịrị ekwesị maka onyeisi ndị nchụaja n’ọnọdụ ikpe ndị Juu.
- source_word: ἐπηρώτα
  choice: jụkwara ya
  rationale: Ọ dabara n’ọnọdụ ịjụ onye a na-ekpe ikpe, ma ọ naghị etinye ike karịrị nke dị n’isiokwu Grik.
- source_word: λέγει
  choice: sị ya
  rationale: Ọ bụ ụzọ Igbo ebumpụta ụwa si webata okwu ọnụ n’akụkọ gara aga; ọ naghị eme ka usoro ahịrịokwu sie ike n’ihi historical present nke Mak ji.
- source_word: χριστός
  choice: Mesaya
  rationale: N’ebe a ọ bụ utu aha onye ndị Juu na-atụ anya ya, ọ bụghị aha nkịtị; “Mesaya” na-echekwa ọnọdụ ahụ.
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: Nwa Onye A Gọziri Agọzi
  rationale: Nke a na-echekwa ụzọ nsọpụrụ ndị Juu si zere ịkpọ Chineke aha kpọmkwem, kama iji “Chineke” dochie okwu Grik ahụ.
theological_decisions:
- issue: Ntughari Χριστός dịka utu aha Mesaya
  choice: Mesaya
  alternative: Kraịst
  rationale: Ajụjụ onyeisi nchụaja ahụ dị n’ọnọdụ olileanya Mesaya nke ndị Juu; “Mesaya” na-eme ka ọrụ okwu ahụ dịka utu aha pụta ìhè.
- issue: Ntughari τοῦ εὐλογητοῦ
  choice: Onye A Gọziri Agọzi
  alternative: Chineke
  rationale: Isiokwu Grik jiri okwu nsọpụrụ na-anọchi aha Chineke. Idebe ya otú a na-echekwa ọdịbendị na ntụgharị uche nke okwu ahụ n’enweghị ịkọwapụta ihe isiokwu ahụ ekwughị kpọmkwem.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị mfe nghọta ma nwee ugwu. E debere ịgbachi nkịtị na-aga n’ihu, nkwusi ike nke “ihe ọ bụla,” ọnọdụ ikpe ahụ, na okwu nsọpụrụ ndị Juu ji ezo aka na Chineke.
