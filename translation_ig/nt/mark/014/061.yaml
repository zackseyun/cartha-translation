- from: Ma ọ nọgidere na-agbachi nkịtị, ọ zaghịkwa ihe ọ bụla. Onyeisi nchụaja ahụ jụkwara ya ọzọ, sị ya, “Ị bụ Mesaya[a], Nwa Onye A Gọziri Agọzi[b]?”
  to: Ma ọ nọgidere na-adị jụụ, ọ zaghị ihe ọ bụla. Onyeisi nchụaja ahụ jụkwara ya ọzọ, sị ya, “Ị bụ Mesaya[a], Nwa Onye A Gọziri Agọzi[b]?”
  rationale: The revision makes the opening clause more idiomatic while retaining the ongoing sense of ἐσιώπα. It keeps the direct negated answer, the renewed high-priestly question, and the source’s reverential divine circumlocution. Footnote a is rewritten for clear, natural Igbo without altering its lexical or theological scope.
