  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ μετὰ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/028.yaml
  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: ig
  text: Ma mgbe a kpọlitere m n’ọnwụ[a], aga m ebu unu ụzọ gaa Galili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe a kpọlitesịrị m n’ọnwụ.” N’asụsụ Grik, ngwaa a dị n’ụdị nnara, bụ́ ụdị okwu a na-ejikarị ekwu banyere mbilite n’ọnwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị dị iche na amụma banyere ịgbasa ndị na-eso ụzọ e kwuru n’amaokwu bu ụzọ.
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: mgbe a kpọlitere m n’ọnwụ
  rationale: ‘Mgbe’ na-egosi ihe ga-eme e mesịa, ebe ‘a kpọlitere m’ na-edobe ụdị ngwaa nnara nke Grik. ‘N’ọnwụ’ na-eme ka nghọta mbilite n’ọnwụ pụta ìhè n’Igbo nkịtị.
- source_word: προάξω ὑμᾶς
  choice: aga m ebu unu ụzọ
  rationale: Nke a na-egosi na Jizọs ga-aga tupu ha, ma na-anọgide bụrụ okwu dị mfe ma bụrụkwa nke a na-asụkarị n’Igbo.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: gaa Galili
  rationale: Ọ na-egosi njem ruo Galili n’ụzọ Igbo si ekwu ya nke ọma; itinye ‘banye na’ agaghị adị mkpa n’ebe a.
theological_decisions:
- issue: Ụdị nnara nke ἐγερθῆναί n’okwu mbilite n’ọnwụ
  choice: a kpọlitere m n’ọnwụ
  alternative: m biliri n’ọnwụ
  rationale: Nhọrọ ahụ na-edobe ụdị nnara dị n’asụsụ Grik kama ịgbanwe ya ka ọ bụrụ na Jizọs biliri n’onwe ya. Ọ naghị ekwu kpọmkwem onye kpọlitere ya, dịka ahịrịokwu Grik ahụ na-emeghị.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. ‘A kpọlitere m n’ọnwụ’ bụ ụzọ ebumpụta ụwa isi chekwaa ụdị nnara na nghọta mbilite n’ọnwụ; ‘ebu unu ụzọ’ na-egosi ịga tupu ndị ọzọ n’enweghị okwu nka siri ike.
