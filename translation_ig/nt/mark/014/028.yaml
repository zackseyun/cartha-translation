    issue: The footnote alternative “mgbe e mesịrị ka m bilie” is not a close lexical alternative to the marked phrase.
    rationale: It is awkward as written and changes the Greek passive ‘be raised’ to active ‘rise.’ The note should offer a natural Igbo alternative that retains the passive sense.
