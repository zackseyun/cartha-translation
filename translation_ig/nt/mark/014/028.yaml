  verdict: revise
  source_fidelity: The main rendering accurately conveys the adversative force, the temporal sequence, the passive resurrection expression without specifying an agent, Jesus' going ahead of the disciples, and the destination Galilee. “N’ọnwụ” appropriately makes the resurrection sense explicit in natural Igbo.
  naturalness: The main text is clear, idiomatic Standard Igbo, and suitably dignified. “Aga m ebu unu ụzọ” naturally expresses going ahead of a group.
  terminology: “A kpọlitere m n’ọnwụ” is an appropriate passive resurrection expression and does not impose an unstated agent. The footnote’s present alternative, however, shifts to an intransitive active expression and is not a faithful alternative to the Greek passive.
  issues:
