  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε αὐτήν· τί αὐτῇ κόπους παρέχετε; καλὸν ἔργον ἠργάσατο ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: ig
  text: Ma Jizọs sịrị, “Hapụnụ ya. Gịnị mere unu ji enye ya nsogbu? Ọ rụụrụ m ọrụ mara mma.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ rụụrụ m ọrụ ọma.” N'ụzọ nkịtị, okwu Grik ikpeazụ bụ “n'ime m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε αὐτήν
  choice: Hapụnụ ya
  rationale: Iwu a na-akpọ ndị ahụ ka ha kwụsị ozugbo itinye aka n'ihe nwanyị ahụ mere; ‘Hapụnụ ya’ bụ okwu Igbo doro anya ma dịkwa ike n'ọnọdụ a.
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: Gịnị mere unu ji enye ya nsogbu?
  rationale: Nkebiokwu Grik a pụtara ime ka ihe siere mmadụ ike ma ọ bụ inye ya nsogbu; nsụgharị a bụ nke e ji eme ihe n'Igbo ugbu a ma na-edobe ụda ịbara ha mba.
- source_word: καλὸν ἔργον
  choice: ọrụ mara mma
  rationale: καλός nwere ike ịpụta ihe ọma, mara mma, dị mma, ma ọ bụ kwesịrị ekwesị. ‘Ọrụ mara mma’ na-egosipụta otuto Jizọs nyere omume ahụ ma na-edobe obosara okwu Grik ahụ.
- source_word: ἠργάσατο
  choice: Ọ rụụrụ
  rationale: Ụdị ngwaa a na-egosi ihe nwanyị ahụ mere; ‘rụụrụ’ na-ejikọta n'ụzọ ebumpụta ụwa na ‘ọrụ’ ma na-egosi na e mere ya maka Jizọs.
- source_word: ἐν ἐμοί
  choice: m
  rationale: N'ime ‘Ọ rụụrụ m ọrụ,’ nnọchiaha ‘m’ na-enye nkọwa mmekọrịta nke ọrụ e mere nye Jizọs ma ọ bụ maka ya, n'Igbo dị ire ụtọ, na-enweghị ịsụgharị ἐν n'ụzọ siri ike dịka ‘n'ime m.’
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-egosi mgbanwe nwere ntakịrị mmegide n'akụkọ ahụ; ‘Ma’ dabara n'ịza mkpesa ndị gara aga.
theological_decisions:
- issue: Ihe καλὸν ἔργον pụtara n'ihe banyere omume nwanyị ahụ
  choice: ọrụ mara mma
  alternative: ọrụ ọma; ezi ọrụ
  rationale: Nhọrọ a na-edobe otuto na ịdị mma dabara adaba nke omume ahụ, na-etinyeghị echiche pụrụ iche banyere uru okpukpe ma ọ bụ sacrament.
- issue: Ike na obosara nke ἐν ἐμοί
  choice: A sụgharịrị ya n'usoro Igbo dịka ‘Ọ rụụrụ m ọrụ’
  alternative: ọrụ n'ahụ m; ọrụ n'ime m; ọrụ nye m
  rationale: Nke a na-egosi na omume ahụ chere Jizọs ihu n'onwe ya, ma ọ naghị amanye nkọwa gbasara naanị ebe e tinyere mmanụ. Ihe odide ala peeji na-echekwa ụdị okwu Grik nkịtị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Unu’ na ụdị iwu ‘Hapụnụ’ na-egosi na Jizọs na-agwa ọtụtụ mmadụ okwu. E debere ịdị mgbagwoju anya nke καλός na ἐν ἐμοί n'ihe odide ala peeji.
