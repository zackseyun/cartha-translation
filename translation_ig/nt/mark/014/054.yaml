revisions:
- from: Pita sokwaara ya n’ebe dị anya, ruo n’ime ogige ụlọ nnukwu onye nchụàjà. Ya na ndị nche nọ ọdụ, na-anya ọkụ.[a]
  to: Pita sokwaara ya n’ebe dị anya, ruo n’ime ogige ụlọ onyeisi nchụàjà. Ya na ndị nche nọ ọdụ, na-ekpo onwe ya ọkụ n’akụkụ ọkụ ahụ.[a]
  rationale: The revision preserves the source's spatial emphasis (“ruo n’ime”), its scene-setting imperfect construction, and the contextual sense of πρὸς τὸ φῶς. It replaces an unclear idiom for warming oneself, improves the high-priest terminology and possessive construction, and retains the literal “light” alternative in a footnote.
