  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: ig
  text: Pita sokwaara ya n’ebe dị anya, ruo n’ime ogige ụlọ onyeisi nchụàjà. Ya na ndị nche nọ ọdụ, na-ekpo onwe ya ọkụ n’akụkụ ọkụ ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ekpo onwe ya ọkụ n’akụkụ ìhè ahụ.” N’asụsụ Grik, e dere ya n’ụzọ nkịtị, “n’akụkụ ìhè ahụ”; ma eleghị anya, ọ na-ekwu maka ìhè sitere n’ọkụ dị n’ogige ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: n’ebe dị anya
  rationale: Ọ bụ ụzọ Igbo nkịtị si akọ na Pita nọgidere n’azụ, hapụkwa ohere dị anya n’etiti ya na Jizọs.
- source_word: ἠκολούθησεν αὐτῷ
  choice: sokwaara ya
  rationale: Oge omume a n’asụsụ Grik dabara n’ịkọ ya dị ka ihe mere n’akụkọ gara aga.
- source_word: ἕως ἔσω εἰς τὴν αὐλήν
  choice: ruo n’ime ogige ụlọ
  rationale: Nke a na-egosi na Pita ruru ma banye n’ogige ahụ, ọ bụghị nanị na ọ kwụsịrị n’èzí.
- source_word: τοῦ ἀρχιερέως
  choice: nnukwu onye nchụàjà
  rationale: Nke a bụ aha Igbo doro anya maka onyeisi nchụàjà ahụ n’akụkọ ahụ.
- source_word: ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν
  choice: Ya na ndị nche nọ ọdụ
  rationale: Ụdị okwu Grik na-akọ ọnọdụ na-aga n’ihu; ‘ndị nche’ na-egosipụta ọrụ ndị ὑπηρέται n’oge njide na ikpe a karịa ndị ohu ụlọ.
- source_word: θερμαινόμενος
  choice: na-anya ọkụ
  rationale: Nke a bụ okwu Igbo e ji ekwu ịbịaru ọkụ nso ka ahụ kpoo ọkụ.
- source_word: πρὸς τὸ φῶς
  choice: ọkụ
  rationale: φῶς pụtara ‘ìhè’ n’ụzọ nkịtị, ma ebe a ihe ahụ na-enye ìhè bụ ọkụ Pita ji ekpo ahụ; ihe odide ala peeji na-echekwa okwu nkịtị ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu dee ya. ‘Ogige ụlọ’ na-eme ka o doo anya na αὐλή bụ mbara dị n’ime ogige ebe obibi ahụ; ‘na-anya ọkụ’ bụ okwu Igbo ebumpụta ụwa.
