review_pass:
  verdict: revise
  source_fidelity: The draft conveys Peter's distant following, his entry into the high priest's courtyard, his sitting with the officials, and his warming himself. However, the final expression needs a clearer, more standard rendering of θερμαινόμενος πρὸς τὸ φῶς, while retaining the lexical ambiguity in the note.
  naturalness: “Na-anya ọkụ” is not the clearest natural Standard Igbo expression here. “Na-ekpo onwe ya ọkụ n'akụkụ ọkụ ahụ” naturally expresses warming oneself at a fire. “Ogige ụlọ onyeisi nchụàjà” is also smoother and more idiomatic than the unlinked noun sequence “ogige ụlọ nnukwu onye nchụàjà.”
  terminology: Use “onyeisi nchụàjà” for ἀρχιερεύς (“high priest”), a clear established ecclesial term that avoids the potentially less precise descriptive phrase “nnukwu onye nchụàjà.” “Ndị nche” remains a reasonable contextual rendering of ὑπηρέται in this arrest-and-hearing setting.
  issues:
  - severity: medium
    issue: The phrase “na-anya ọkụ” is unclear or nonstandard for Peter's warming himself.
    rationale: θερμαινόμενος describes Peter keeping himself warm. “Na-ekpo onwe ya ọkụ” directly and naturally conveys that action in Standard Igbo.
  - severity: low
    issue: “Ogige ụlọ nnukwu onye nchụàjà” is syntactically awkward, and “nnukwu onye nchụàjà” is less established terminology.
    rationale: “Ogige ụlọ onyeisi nchụàjà” clearly marks the courtyard as belonging to the high priest and uses a recognized rendering for ἀρχιερεύς.
  - severity: low
    issue: The footnote's alternative should correspond to the revised wording and state the literal Greek expression more precisely.
    rationale: The note should preserve φῶς as “ìhè” and explain that the contextual reference is likely firelight, without treating “ìhè” itself as identical with “ọkụ.”
  revised_text: Pita sokwaara ya n’ebe dị anya, ruo n’ime ogige ụlọ onyeisi nchụàjà. Ya na ndị nche nọ ọdụ, na-ekpo onwe ya ọkụ n’akụkụ ọkụ ahụ.[a]
