  yaml_path: translation/nt/mark/014/052.yaml
  text: But he left the linen cloth behind and fled naked[a][b].
translation:
  language: ig
  text: Ma ọ hapụrụ ákwà linin ahụ, wee gbapụ gba ọtọ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ákwà linin” dịka “ákwà linin e ji ekpuchi ahụ” ma ọ bụ “uwe linin” (σινδόνα).
    reason: lexical_alternative
  - marker: b
    text: “Gbaa ọtọ” (γυμνός) nwere ike ịpụta onye yi uwe na-ezughị ezu n'ọnọdụ ụfọdụ; ma n'ebe a, ọ pụtara na ọ gbapụrụ gba ọtọ mgbe ọ hapụsịrị ákwà ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: N'ebe a, δέ na-egosi obere ntụgharị megide ihe mere tupu ya; “Ma” dabara n'usoro akụkọ ahụ.
- source_word: καταλιπὼν
  choice: hapụrụ
  rationale: Ụdị participle a sitere na καταλείπω pụtara ịhapụ ihe ka ọ nọrọ n'azụ; “hapụrụ” bụ okwu Igbo doro anya ma kwekọọ n'omume ahụ.
- source_word: σινδόνα
  choice: ákwà linin ahụ
  rationale: σινδών bụ ákwà linin nke a pụrụ iji dịka ihe mkpuchi ma ọ bụ uwe; nsụgharị a anaghị ekpebi kpọmkwem ụdị ya.
- source_word: γυμνὸς
  choice: gbaa ọtọ
  rationale: γυμνός n'ọnọdụ a pụtara na ọ gbapụrụ n'enweghị ákwà ahụ; “gbaa ọtọ” bụ ụzọ Igbo si ekwu ya n'ụzọ doro anya.
- source_word: ἔφυγεν
  choice: gbapụ
  rationale: φεύγω pụtara ịgbapụ ma ọ bụ ịsọ ọsọ pụọ n'ihe egwu; “gbapụ” na-egosi ngwa ngwa na nzọpụta onwe ya dị n'omume ahụ.
