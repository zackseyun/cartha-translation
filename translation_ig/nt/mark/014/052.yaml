translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. Ahịrịokwu ahụ na-edobe ntụgharị nke δέ, ihe ákwà ahụ bụ n'ụzọ na-akọwaghị ya karịa isi mmalite, na nkọwa kpọmkwem nke γυμνός n'ọnọdụ a.
