  source_fidelity: The draft accurately represents the contrastive δέ, the act of leaving the σινδών behind, and the result that the man fled γυμνός. However, the verb sequence in the main text needs a connective for clear, idiomatic Igbo narration.
  naturalness: “Ma ọ hapụrụ ákwà linin ahụ, gbaa ọtọ gbapụ” is understandable, but the juxtaposed verbal forms are not the most natural Standard Igbo narrative construction. “wee gbapụ gba ọtọ” clearly and naturally expresses that he fled naked.
  terminology: “Ákwà linin” appropriately preserves the deliberate breadth of σινδών without deciding whether it was a sheet or a garment. “Gbaa ọtọ” is an appropriate direct rendering of γυμνός in this context.
