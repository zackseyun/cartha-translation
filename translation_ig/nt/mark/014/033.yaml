source:
  edition: SBLGNT
  text: καὶ παραλαμβάνει τὸν Πέτρον καὶ ⸂Ἰάκωβον καὶ⸃ Ἰωάννην μετ’ ⸀αὐτοῦ, καὶ ἤρξατο ἐκθαμβεῖσθαι καὶ ἀδημονεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/033.yaml
  text: And he takes Peter and James and John with him[a], and he began to be greatly distressed and troubled,
translation:
  language: ig
  text: Ọ kpọọrọ Pita, Jems na Jọn ka ha soro ya, wee malite inwe oké ujo[a] na nchekasị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “malite inwe oké ahụhụ n’obi na nchekasị.” Ngwaa mbụ ahụ pụrụ igosi oke ụjọ, ujo, ma ọ bụ mkpagbu siri ike n’ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαμβάνει
  choice: Ọ kpọọrọ
  rationale: Ngwaa a pụtara ịkpọrọ ndị a họpụtara ka ha soro ya. Ọ bụ ezie na Grik ji oge ugbu a n’akụkọ ihe mere eme, oge gara aga bụ ụzọ Igbo si akọ akụkọ a n’ụzọ doro anya ma dịkwa mma.
- source_word: μετ’ αὐτοῦ
  choice: ka ha soro ya
  rationale: Nke a na-egosi nke ọma na Pita, Jems na Jọn so Jizọs gaa.
- source_word: ἤρξατο
  choice: wee malite
  rationale: A hapụrụ echiche mmalite dị na ngwaa Grik ahụ, ka mgbanwe malitere n’oge a n’akụkọ ahụ pụta ìhè.
- source_word: ἐκθαμβεῖσθαι
  choice: inwe oké ahụhụ n’obi
  rationale: N’ọnọdụ Getsemeni a, ngwaa ahụ na-egosi mmetụta siri ike nke mwute, ujo, ma ọ bụ nhụjuanya batara mmadụ n’obi; okwu a na-egosipụta ịdị arọ ya n’Igbo nkịtị n’akọwaghị ya gabiga ihe odide ahụ.
- source_word: ἀδημονεῖν
  choice: na oké nchekasị
  rationale: Ngwaa ahụ na-egosi nnukwu mkpagbu na nchegbu dị n’ime mmadụ. ‘Oké nchekasị’ na-edobe ya iche n’okwu bu ya ụzọ ma na-egosikwa ịdị ike ya.
- source_word: καὶ ... καὶ
  choice: na ... na
  rationale: Njikọ ndị a na-edobe ihe abụọ ahụ—ahụhụ n’obi na nchekasị—dị ka mmetụta abụọ jikọrọ ọnụ, kama ịgwakọta ha ka ha bụrụ otu.
theological_decisions:
- issue: Otú e si kọwaa mmetụta Jizọs na Getsemeni
  choice: 'A sụgharịrị ngwaa abụọ ahụ dị ka ezi ahụhụ mmadụ siri ike: ‘oké ahụhụ n’obi na oké nchekasị.’'
  alternative: A pụrụ iji okwu dị nro dịka ‘ijuanya na nchegbu,’ ma ọ bụ okwu siri ike karịa dịka ‘oke ụjọ na mmekpa ahụ n’obi.’
  rationale: Amaokwu ahụ na-egosi Jizọs ka ọ na-enwe nnukwu mkpagbu n’ezie. Nsụgharị ahụ adịghị ebelata mmadụ ịbụ ya, ọ naghịkwa etinye nkọwa ozizi nke ihe odide ahụ ekwughị.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro akụkọ Mak, ma jiri oge gara aga nke na-ada nke ọma n’akụkọ Igbo.
