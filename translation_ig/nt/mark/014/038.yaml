revisions:
- from: Nọrọnụ na nche, na-ekpekwa ekpere, ka unu ghara ịdaba n’ọnwụnwa.[a] N’ezie, mmụọ dị njikere, ma anụ ahụ adịghị ike.
  to: Mụrụnụ anya, kpeekwanụ ekpere, ka unu ghara ịbanye n’ọnwụnwa.[a] N’ezie, mmụọ dị njikere, ma anụ ahụ adịghị ike.
  rationale: The revision replaces an interpretively stronger expression (‘fall into’) with ‘enter into,’ matching the Greek more closely while retaining the ambiguity of πειρασμός. It also uses idiomatic plural imperatives and narrows the footnote to defensible lexical alternatives.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:24:04Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the plural imperatives, the purpose clause, and the contrast between willing spirit and weak flesh. However, “ịdaba n’ọnwụnwa” means ‘fall into/yield to temptation’ and adds a result not stated by εἰς πειρασμόν; the Greek says ‘enter into temptation/testing.’
  naturalness: “Nọrọnụ na nche” is understandable, but “Mụrụnụ anya” is a more direct, natural Standard Igbo exhortation in this immediate context. “Kpeekwanụ ekpere” naturally joins the second plural imperative to it.
  terminology: “mmụọ” and “anụ ahụ” appropriately retain the source terms without deciding that πνεῦμα is the Holy Spirit or that σάρξ means a doctrinal ‘sinful nature.’ The footnote’s “mkpagbu” is too specific for πειρασμός here and should be replaced by a testing/trial alternative.
  issues:
  - severity: medium
    issue: “ịdaba n’ọnwụnwa” overtranslates εἰς πειρασμόν.
    rationale: It commonly conveys falling or succumbing to temptation, whereas ἔλθητε εἰς means entering into it. “ịbanye n’ọnwụnwa” preserves the source expression and its ambiguity.
  - severity: low
    issue: The footnote gives “mkpagbu” as an alternative.
    rationale: ‘Affliction/tribulation’ is not the best lexical alternative in this context. “ule” or “nnwale” better represents testing/trial.
  revised_text: Mụrụnụ anya, kpeekwanụ ekpere, ka unu ghara ịbanye n’ọnwụnwa.[a] N’ezie, mmụọ dị njikere, ma anụ ahụ adịghị ike.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ “ule” ma ọ bụ “nnwale” n’ọnọdụ “ọnwụnwa” (πειρασμόν).
    reason: lexical_alternative
  revision_rationale: The revision replaces an interpretively stronger expression (‘fall into’) with ‘enter into,’ matching the Greek more closely while retaining the ambiguity of πειρασμός. It also uses idiomatic plural imperatives and narrows the footnote to defensible lexical alternatives.
