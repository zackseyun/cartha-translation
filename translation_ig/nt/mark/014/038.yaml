  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: ig
  text: Mụrụnụ anya, kpeekwanụ ekpere, ka unu ghara ịbanye n’ọnwụnwa.[a] N’ezie, mmụọ dị njikere, ma anụ ahụ adịghị ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ule” ma ọ bụ “nnwale” n’ọnọdụ “ọnwụnwa” (πειρασμόν).
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Nọrọnụ na nche
  rationale: Iwu a dị n'ụdị ọtụtụ mmadụ. N'ọnọdụ Getsemane, ọ pụtara ka ha ghara ihi ụra ma nọgidekwa na-amụ anya; okwu a na-egosipụta ma ịmụrụ anya nkịtị ma nche nke ime mmụọ.
- source_word: προσεύχεσθε
  choice: na-ekpekwa ekpere
  rationale: Ọ bụ iwu na-aga n'ihu nye ọtụtụ mmadụ; ụdị Igbo a na-egosi ka ha nọgide na-ekpe ekpere ma jikọta ya nke ọma na iwu mbụ.
- source_word: ἵνα μὴ ἔλθητε εἰς πειρασμόν
  choice: ka unu ghara ịdaba n’ọnwụnwa
  rationale: ἵνα μή na-egosi ebumnuche ma ọ bụ ihe a chọrọ igbochi. ‘Ịdaba n’ọnwụnwa’ bụ okwu Igbo dị ndụ nke na-egosi ịbanye n’ọnọdụ ọnwụnwa ma ọ bụ ịda n’okpuru ike ya.
- source_word: πειρασμόν
  choice: ọnwụnwa
  rationale: Okwu Grik a nwere ike ịpụta ọnwụnwa, ule, ma ọ bụ mkpagbu. N'ịdọ aka ná ntị a, ‘ọnwụnwa’ dabara nke ọma, ebe e debere nghọta ndị ọzọ n'okpuru peeji.
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: N’ezie, mmụọ dị njikere
  rationale: ‘Mmụọ’ na-echekwa okwu πνεῦμα na enweghị isi mkpụrụedemede ukwu nke ga-eme ka a kpebie na ọ bụ Mmụọ Nsọ. ‘Dị njikere’ na-eburu echiche nke ịdị njikere na ịdị njikere ime ihe.
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: ma anụ ahụ adịghị ike
  rationale: '‘Anụ ahụ’ bụ ụzọ Igbo sitere n''okike isi chekwaa ihe σάρξ pụtara ebe a: adịghị ike mmadụ n''ụzọ anụ ahụ, na-enweghị ịgbanwe ya ka ọ bụrụ ozizi pụrụ iche banyere ‘ọdịdị mmehie.’'
theological_decisions:
- issue: Ihe πνεῦμα na-ezo aka na ya
  choice: mmụọ mmadụ / ọchịchọ ime ihe ziri ezi
  alternative: Mmụọ Nsọ
  rationale: Ọnọdụ ndị na-eso ụzọ na-arahụ ụra na ntụnyere ya na anụ ahụ na-akwado nghọta nke mmụọ mmadụ dị ka ebe ọchịchọ na ebumnuche si apụta. A hapụrụ ‘mmụọ’ n'ụdị na-adịghị amanye nkọwa karịa ihe ederede kwuru.
- issue: Ntụgharị σάρξ
  choice: anụ ahụ
  alternative: ọdịdị mmehie; ahụ
  rationale: N'ebe a, isi okwu bụ adịghị ike mmadụ, ọ bụghị nkọwa ozizi doro anya banyere mmehie bi n'ime mmadụ. ‘Anụ ahụ’ na-echekwa ntụnyere dị n'etiti mmụọ dị njikere na mmadụ n'adịghị ike ya.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ụdị ọtụtụ mmadụ ‘unu’ chekwaa iwu abụọ ahụ. Akara [a] dị ozugbo n'azụ okwu ọ na-akọwa.
