review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal action and accusation, but “leruru ya anya” is weaker than ἐμβλέψασα, which denotes a fixed or intent look. The added indirect-object pronoun in “sị ya” is not required by the Greek, whose following quotation supplies the speech.
  naturalness: “Sokwa Jizọs onye Nazaret ahụ nọ” is understandable, but removing “ahụ” produces a more idiomatic appositional identification/title in this accusation. “Legidere ya anya” is clear, natural Standard Igbo for an intent look.
  terminology: Pita, Jizọs, and Nazaret are appropriately rendered. “Onye Nazaret” accurately retains the designation Ναζαρηνός without importing theological interpretation.
  issues:
  - severity: low
    issue: The intensive look is underrepresented.
    rationale: ἐμβλέψασα αὐτῷ means that she looked intently/fixed her gaze on him; “legidere ya anya” better represents this than the more general “leruru ya anya.”
  - severity: low
    issue: Unnecessary “ya” after “sị.”
    rationale: The direct quotation is the complement of λέγει; retaining an additional indirect-object pronoun is not needed and can make the construction less direct in Igbo.
  - severity: low
    issue: “ahụ” after “onye Nazaret” is less idiomatic here.
    rationale: The Greek article is naturally represented in Igbo by the established identifying expression “Jizọs onye Nazaret”; adding “ahụ” is not necessary for definiteness.
  revised_text: Mgbe ọ hụrụ Pita ka ọ na-anya ọkụ, o legidere ya anya wee sị, “Gị onwe gị sokwa Jizọs onye Nazaret nọ.”
