- from: Mgbe ọ hụrụ Pita ka ọ na-anya ọkụ, o leruru ya anya wee sị ya, “Gị onwe gị sokwa Jizọs onye Nazaret ahụ nọ.”
  to: Mgbe ọ hụrụ Pita ka ọ na-anya ọkụ, o legidere ya anya wee sị, “Gị onwe gị sokwa Jizọs onye Nazaret nọ.”
  rationale: The revision strengthens the rendering of the woman’s intent gaze, removes an unnecessary pronoun before direct speech, and uses the natural Igbo identifying expression “Jizọs onye Nazaret.” It retains the narrative past idiomatically used in Igbo and preserves the accusation that Peter too was with Jesus.
