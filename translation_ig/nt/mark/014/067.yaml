  text: καὶ ἰδοῦσα τὸν Πέτρον θερμαινόμενον ἐμβλέψασα αὐτῷ λέγει· Καὶ σὺ μετὰ τοῦ Ναζαρηνοῦ ⸂ἦσθα τοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/067.yaml
  text: And seeing Peter warming himself, she looked at him and says, “You also were with Jesus the Nazarene.”
translation:
  language: ig
  text: Mgbe ọ hụrụ Pita ka ọ na-anya ọkụ, o legidere ya anya wee sị, “Gị onwe gị sokwa Jizọs onye Nazaret nọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θερμαινόμενον
  choice: ka ọ na-anya ọkụ
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọ mmadụ nọ nso n’ọkụ na-ekpo ọkụ.
- source_word: ἐμβλέψασα αὐτῷ
  choice: o leruru ya anya
  rationale: Ọ na-egosi ile mmadụ anya nke ọma ma ọ bụ ilegide ya anya iji mata onye ọ bụ.
- source_word: λέγει
  choice: wee sị ya
  rationale: Ọ bụ ezie na Grik ji ugbu a akụkọ ihe mere eme, Igbo eke na-eji usoro gara aga n’akụkọ a; “sị ya” na-edobekwa onye a gwara okwu.
- source_word: τοῦ Ναζαρηνοῦ ... τοῦ Ἰησοῦ
  choice: Jizọs onye Nazaret ahụ
  rationale: Na-egosipụta njirimara Jizọs dịka onye Nazaret n’Igbo doro anya ma dị mfe.
- source_word: Καὶ σὺ
  choice: Gị onwe gị sokwa
  rationale: “Onwe gị” na-eweta nkwusi ike dị na σὺ, ebe “-kwa” na-eburu echiche ‘also’.
- source_word: μετὰ
  choice: sokwa ... nọ
  rationale: N’ebe a, ịnọ ‘na’ Jizọs pụtara isoro ya nọ; nhazi a bụ Igbo eke.
theological_decisions:
- issue: Ihe ‘ị nọnyere Jizọs’ pụtara
  choice: sokwa Jizọs ... nọ
  alternative: nọnyere Jizọs
  rationale: Nhọrọ a na-ahapụ okwu ahụ dịka ebubo banyere iso Jizọs na mkpakọrịta ya, n’etinyeghị nkọwa ụka ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A gbanwere present akụkọ Grik λέγει ka ọ bụrụ past Igbo eke, ebe a chekwara ike ebubo ahụ site na “Gị onwe gị” na “-kwa.”
