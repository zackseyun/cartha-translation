  text: Καὶ ὑμνήσαντες ἐξῆλθον εἰς τὸ Ὄρος τῶν Ἐλαιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/026.yaml
  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: ig
  text: Mgbe ha bụsịrị abụ otuto[a], ha pụọ gaa n’Ugwu Oliv.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ na-arapara n’usoro Grik karị, “Ha bụsịrị abụ.” Participụl Grik ahụ na-egosi na ịbụ abụ ahụ buru ụzọ mee tupu ha apụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Mgbe ...
  rationale: N’Igbo, njikọ a na participle so ya na-ada nke ọma dịka ahịrịokwu oge; ọ na-ejikọta ihe abụọ ahụ n’usoro ha mere n’etinyeghị nkọwa ọzọ.
- source_word: ὑμνήσαντες
  choice: Mgbe ha bụchara abụ otuto nye Chineke
  rationale: Aorist participle a na-egosi na ha buru ụzọ bụọ abụ otuto tupu ha apụọ. ‘Abụ otuto nye Chineke’ na-egosipụta echiche nke ὑμνέω n’Igbo doro anya ma dịkwa mma.
- source_word: ἐξῆλθον
  choice: ha pụrụ
  rationale: 'Nke a bụ ụzọ Igbo dị mfe ma kwekọọ na ihe ἐξέρχομαι pụtara n’akụkọ a: ha si ebe ahụ pụọ.'
- source_word: εἰς
  choice: gaa n’
  rationale: N’ebe a ọ na-egosi ebe ha na-aga; ‘gaa n’ụzọ’ a na-eme ka ebe njedebe ahụ pụta ìhè n’Igbo nkịtị.
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: Ugwu Oliv
  rationale: Nke a bụ aha ebe ahụ n’ụdị dị mkpirikpi ma ghọta ya nke ọma n’Igbo; ‘Ugwu’ na-anọchi Ὄρος, ‘Oliv’ ana-anọchi genitive τῶν Ἐλαιῶν.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ ‘bụchara’ iji mee ka o doo anya na ịbụ abụ ahụ mere tupu ọpụpụ ha, dịka participle Grik si egosi.
