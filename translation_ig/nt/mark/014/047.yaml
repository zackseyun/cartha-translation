id: MRK.14.47
reference: Mark 14:47
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s servant[a], and cut off his ear.
translation:
  language: ig
  text: Ma otu onye n’ime ndị guzo nso mịpụtara mma agha ya, were ya kụọ ohu[a] onyeisi nchụaja ahụ, bipụkwa ntị ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ohu” dịka “onye na-eje ozi” (okwu Grik bụ δοῦλος).
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: Ma otu onye
  rationale: “Otu onye” na-edobe onye ahụ n’amaghị aha dịka okwu Grik si mee; “Ma” na-egosipụta njikọ na obere ntụgharị nke δέ.
- source_word: τῶν παρεστηκότων
  choice: n’ime ndị guzo nso
  rationale: Nke a na-egosipụta ma ịnọ ebe ahụ ma ịdị nso, dịka perfect participle παρεστηκότων si pụta n’akụkọ a.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: mịpụtara mma agha ya
  rationale: N’ọnọdụ a, σπάομαι pụtara ịmịpụta ngwa ọgụ. “Mma agha” bụ okwu Igbo doro anya maka μάχαιρα, ebe iji “ya” dabara n’usoro okwu Igbo mgbe mmadụ mịpụtara ngwa ọgụ o ji.
- source_word: ἔπαισεν
  choice: were ya kụọ
  rationale: “Kụọ” na-egosipụta iti ihe ike; “were ya” na-eme ka o doo anya n’Igbo na mma agha ahụ bụ ihe o ji kụọ ya, n’enweghị ịgbanwe isi ihe Grik kwuru.
- source_word: τὸν δοῦλον τοῦ ἀρχιερέως
  choice: ohu onyeisi nchụaja ahụ
  rationale: “Ohu” na-echekwa ọnọdụ mmekọrịta na nnwere onwe ebelatara nke δοῦλος karịa okwu dị nro nke naanị onye na-eje ozi. “Onyeisi nchụaja” bụ okwu Igbo a na-aghọta nke ọma maka ἀρχιερεύς.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτάριον
  choice: bipụkwa ntị ya
  rationale: N’ọnọdụ mwakpo a, “bipụ” na-enye nghọta ebumpụta ụwa nke ἀφαιρέω; “ntị” na-asụgharị diminutive ὠτάριον n’enweghị itinye “ntị aka nri,” nke na-adịghị n’ihe Mak dere.
theological_decisions:
- issue: Nsụgharị δοῦλος n’akụkọ gbasara ọnọdụ mmadụ n’obodo
  choice: ohu
  alternative: onye na-eje ozi
  rationale: Ebe onye ahụ nọ n’okpuru onyeisi nchụaja n’ụzọ δοῦλος na-egosi, “ohu” na-echekwa ọnọdụ mmekọrịta ahụ. E tinyere ihe ọzọ a pụrụ ịsụgharị ya na nkọwa ala peeji ka a ghara izochi obosara okwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Usoro ngwaa “mịpụtara… were ya kụọ… bipụkwa” na-eme ka omume ndị ahụ na-aga n’usoro doro anya ma na-echekwa ngwa ngwa nke akụkọ Mak.
