  text: ὁ ⸀δὲ εἶπεν αὐτοῖς· ⸀Εἷς τῶν δώδεκα, ὁ ἐμβαπτόμενος μετ’ ἐμοῦ εἰς ⸀τὸ τρύβλιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/020.yaml
  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: ig
  text: Ọ sịrị ha, “Ọ bụ otu n’ime mmadụ iri na abụọ ahụ, onye mụ na ya na-emikpu ihe n’ime efere.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime nnukwu efere.” Okwu Grik bụ τρύβλιον nwere ike ịpụta efere ma ọ bụ nnukwu efere e ji eri nri.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ọ
  rationale: N’Igbo, a hapụrụ njikọ δέ ka ahịrịokwu ahụ gaa n’ihu n’ụzọ dị nro ma kwekọọ n’akụkọ a; itinye ‘ma’ nwere ike ime ka ọdịiche ahụ sie ike karịa ka Grik si dị.
- source_word: εἶπεν αὐτοῖς
  choice: sịrị ha
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke nkịtị isi gosi okwu λέγω e kwuru nye ọtụtụ mmadụ.
- source_word: Εἷς τῶν δώδεκα
  choice: otu n’ime mmadụ iri na abụọ ahụ
  rationale: Nke a na-egosi na onye ahụ so n’otu ndị na-eso ụzọ iri na abụọ Jizọs họpụtara, n’etinyeghị nkọwa ọzọ.
- source_word: ὁ ἐμβαπτόμενος
  choice: onye ... na-amanye nri
  rationale: Ụdị ‘na-amanye’ na-echekwa omume na-aga n’ihu nke participle dị ugbu a; agbakwunyere ‘nri’ iji mee ka omume iri nri doo onye Igbo anya n’ụzọ ebumpụta ụwa.
- source_word: μετ’ ἐμοῦ
  choice: mụ na ya
  rationale: N’usoro okwu Igbo, ‘onye mụ na ya...’ na-egosi iso mmadụ mee ihe, ya bụ, ‘with me,’ n’ụzọ dị mma ma doo anya.
- source_word: εἰς τὸ τρύβλιον
  choice: n’efere
  rationale: ‘Efere’ bụ okwu Igbo a na-ejikarị maka ihe e ji etinye nri; n’ọnọdụ a, ‘n’efere’ na-egosi itinye nri n’ime ya n’ụzọ dị mma n’asụsụ Igbo, ebe ndetu na-echekwa ohere nke ‘nnukwu efere dị omimi.’
