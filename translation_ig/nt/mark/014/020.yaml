translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa njirimara onye ga-arara Jizọs dịka otu n’ime mmadụ iri na abụọ ahụ, ma na-ahapụ nkọwa ahụ dịka okwu na-ezughị ezu n’ụzọ kwekọrọ n’ahịrị Grik.
