  text: καὶ ἡ παιδίσκη ἰδοῦσα αὐτὸν ⸂ἤρξατο πάλιν⸃ λέγειν τοῖς ⸀παρεστῶσιν ὅτι Οὗτος ἐξ αὐτῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: ig
  text: Nwa agbọghọ na-eje ozi ahụ hụrụ ya, wee malite ọzọ ịgwa ndị nọ ebe ahụ, sị, “Nwoke a bụ otu n’ime ha.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδίσκη
  choice: nwa agbọghọ ahụ na-eje ozi
  rationale: Nke a na-egosi nwaanyị na-eto eto nke na-eje ozi, n’asụsụ Igbo dị ugbu a ma ghara ikpebi n’enweghị mkpa ma ọ bụ ohu.
- source_word: ἰδοῦσα
  choice: hụrụ ya
  rationale: E ji ngwaa zuru ezu mee participle a ka usoro akụkọ ahụ bụrụ nke eke n’Igbo; ọ na-egosi ihe kpaliri okwu ya.
- source_word: ἤρξατο πάλιν λέγειν
  choice: wee malite ọzọ ịgwa
  rationale: Nke a na-echekwa ma echiche nke ịmalite ma nke ime ya ọzọ.
- source_word: τοῖς παρεστῶσιν
  choice: ndị guzo nso n’ebe ahụ
  rationale: Ọ na-echekwa echiche nke ndị nọ ma ọ bụ guzo n’akụkụ ebe ihe ahụ na-eme, n’ụzọ doro anya n’Igbo.
- source_word: Οὗτος
  choice: Nwoke a
  rationale: Demonstrative ahụ na-atụ Pita aka kpọmkwem; ịgbakwunye ‘nwoke’ bụ ụzọ Igbo si ekwu ya nke ọma n’ọnọdụ a.
- source_word: ἐξ αὐτῶν
  choice: bụ otu n’ime ha
  rationale: Nke a na-egosi na ọ so n’ìgwè ahụ, ma bụrụkwa ntụgharị doro anya na nke eke.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ ọnọdụ nwa agbọghọ ahụ n’ụzọ na-adịghị amanye nkọwa ‘ohu’ ebe okwu Grik nwere ike ịpụta nwa agbọghọ na-eje ozi ma ọ bụ ohu nwaanyị.
