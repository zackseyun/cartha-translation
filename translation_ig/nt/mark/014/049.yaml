  text: καθ’ ἡμέραν ἤμην πρὸς ὑμᾶς ἐν τῷ ἱερῷ διδάσκων καὶ οὐκ ἐκρατήσατέ με· ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: ig
  text: Kwa ụbọchị, anọ m na unu n’ogige ụlọ nsọ[a], na-akụzi ihe, ma unu ejideghị m[b]. Ma ka ihe ndị e dere n’Akwụkwọ Nsọ mezuo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Ogige ụlọ nsọ’ n’ebe a pụtara ogige ụlọ nsọ ahụ dum, ọ bụghị naanị ebe nsọ dị n’ime ụlọ ahụ.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụ ya, ‘unu anwụchighị m.’
    reason: lexical_alternative
  - marker: c
    text: 'N’asụsụ Grik, a hapụrụ ngwaa nke nkebi ikpeazụ n’ekwughị ya. N’ụzọ nkịtị karị: ‘Ma ka ihe ndị e dere n’Akwụkwọ Nsọ mezuo.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Kwa ụbọchị
  rationale: Nke a na-egosi ihe na-eme ụbọchị niile, ya bụ ‘ụbọchị kwa ụbọchị,’ n’ụzọ Igbo a na-asụkarị.
- source_word: ἤμην πρὸς ὑμᾶς
  choice: mụ na unu nọ
  rationale: Ọ na-egosi na Jizọs nọ n’etiti ha ma ha na-ahụ ya n’ihu ọha.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ogige ụlọ nsọ
  rationale: ἱερόν na-ezo aka n’ụlọ nsọ dum na ogige ya, ọ bụghị naanị ebe nsọ dị n’ime ya. ‘Ogige ụlọ nsọ’ na-eme ka nke a doo onye Igbo anya.
- source_word: διδάσκων
  choice: na-akụzi ihe
  rationale: Ọ na-echekwa omume na-aga n’ihu nke participle ahụ ma bụrụkwa okwu Igbo ebumpụta ụwa.
- source_word: οὐκ ἐκρατήσατέ με
  choice: unu ejideghị m
  rationale: ‘Ijide’ nwere ike ịpụta ijide mmadụ n’aka ma ọ bụ ijide ya dịka onye a na-ejide iwu; ya mere ọ na-echekwa obosara κρατέω.
- source_word: ἀλλ’ ἵνα
  choice: Ma nke a mere ka
  rationale: Asụsụ Grik hapụrụ ngwaa nke nkebi a n’ekwughị ya. N’Igbo, a gbakwụnyere ‘nke a mere’ iji mee ka ahịrịokwu ahụ zuru oke ma ghara ịkọwa ihe karịrị ọnọdụ ahụ.
- source_word: πληρωθῶσιν
  choice: mezuo
  rationale: ‘Mezuo’ na-enye echiche nke ihe ndị e dere bịaruru mmezu, ebe usoro ‘ka ... mezuo’ na-echekwa ọdịdị subjunctive nke Grik.
- source_word: αἱ γραφαί
  choice: ihe e dere n’Akwụkwọ Nsọ
  rationale: Nke a na-ezo aka n’ihe odide nsọ Izrel ma na-ada nke ọma n’Igbo karịa ntụgharị nkịtị nke plural ahụ.
theological_decisions:
- issue: Nkebi nzube/mmetụta nke ἀλλ’ ἵνα nke ngwaa ya ezughị ezu
  choice: Ma nke a mere ka ihe e dere n’Akwụkwọ Nsọ mezuo
  alternative: Ma ka ihe e dere n’Akwụkwọ Nsọ mezuo
  rationale: E tinyere ‘nke a mere’ dịka ngwaa ọnọdụ ahụ na-atụ anya, iji mee ka Igbo bụrụ nke zuru oke. Usoro ‘ka ... mezuo’ ka na-ahapụ ohere nke nzube na nsonaazụ, n’enweghị itinye nkwupụta siri ike banyere otu Chineke si kpebie ihe ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Mụ na unu nọ’ na ‘na-akụzi ihe’ bụ usoro okwu ebumpụta ụwa; ‘ogige ụlọ nsọ’ na-egbochi nghọtahie na ọ bụ naanị ime ebe nsọ ka a na-ekwu.
