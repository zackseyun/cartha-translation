review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the solemn assertion, the indefinite universal location, public proclamation, the good news, the woman’s deed, and the future passive sense. Its final phrase, however, uses an infinitival purpose construction ("iji na-echeta ya") where εἰς μνημόσυνον αὐτῆς more directly presents the deed as a memorial/remembrance of her.
  naturalness: The Igbo is generally clear and contemporary. Recasting the final clause as a result/designation of the deed removes a slight dangling-purpose ambiguity and is more natural in this context.
  terminology: “ozi ọma” is an appropriate transparent rendering of εὐαγγέλιον, with “oziọma” suitably retained as the established Christian lexical alternative. “nwanyị a” correctly reflects the feminine demonstrative without adding interpretation.
  issues:
  - severity: low
    issue: The main rendering of εἰς μνημόσυνον αὐτῆς is less direct than the Greek noun phrase.
    rationale: “iji na-echeta ya” means ‘in order to remember her’ and can suggest the speaking itself has that purpose. The source says that what she did will be spoken of ‘as/for a memorial of her.’ “ka ọ bụrụ ihe ncheta ya” better preserves that relation.
  revised_text: N’ezie, ana m agwa unu, n’ebe ọ bụla a ga-ekwusa ozi ọma[a] n’ụwa niile, a ga-ekwukwa banyere ihe nwanyị a mere ka ọ bụrụ ihe ncheta ya[b].
  revised_footnotes:
  - marker: a
    text: 'Ma ọ bụ: “oziọma.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “iji na-echeta ya.”'
    reason: idiomatic_alternative
  revision_rationale: The revision changes only the final memorial expression. It more closely represents εἰς μνημόσυνον αὐτῆς as the status or function of the woman’s deed while retaining natural Standard Igbo and preserving the former idiomatic wording in a correctly anchored footnote.
