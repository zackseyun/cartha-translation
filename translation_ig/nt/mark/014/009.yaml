revisions:
- from: N’ezie, ana m agwa unu, n’ebe ọ bụla a ga-ekwusa ozi ọma[a] n’ụwa niile, a ga-ekwukwa banyere ihe nwanyị a mere, iji na-echeta ya[b].
  to: N’ezie, ana m agwa unu, n’ebe ọ bụla a ga-ekwusa ozi ọma[a] n’ụwa niile, a ga-ekwukwa banyere ihe nwanyị a mere ka ọ bụrụ ihe ncheta ya[b].
  rationale: The revision changes only the final memorial expression. It more closely represents εἰς μνημόσυνον αὐτῆς as the status or function of the woman’s deed while retaining natural Standard Igbo and preserving the former idiomatic wording in a correctly anchored footnote.
  reviewer_model: gpt-5.6-terra
