id: MRK.14.9
reference: Mark 14:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν ⸀δὲ λέγω ὑμῖν, ὅπου ⸀ἐὰν κηρυχθῇ τὸ ⸀εὐαγγέλιον εἰς ὅλον τὸν κόσμον, καὶ ὃ ἐποίησεν αὕτη λαληθήσεται εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: ig
  text: N’ezie, ana m agwa unu, n’ebe ọ bụla a ga-ekwusa ozi ọma[a] n’ụwa niile, a ga-ekwukwa banyere ihe nwanyị a mere ka ọ bụrụ ihe ncheta ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “oziọma.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “iji na-echeta ya.”'
    reason: idiomatic_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: N’ezie
  rationale: Ọ na-ebute okwu siri ike nke e ji ikike kwuo; “N’ezie” na-enye echiche ahụ n’Igbo doro anya ma dịkwa nsọpụrụ.
- source_word: δὲ
  choice: '[etinyeghị ya iche n’Igbo]'
  rationale: δὲ bụ njikọ dị nro; usoro ahịrịokwu Igbo na-egosipụta njikọ ya nke ọma n’enweghị ịgbakwunye “ma” ma ọ bụ “ugbu a.”
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a na-echekwa onye na-ekwu okwu, ndị ọ na-agwa, na ịdị arọ nke okwu ahụ n’Igbo nkịtị.
- source_word: ὅπου ἐὰν
  choice: n’ebe ọ bụla
  rationale: Ọ na-egosi ebe ọ bụla ọnọdụ ahụ ga-emezu, ya bụ, enweghị otu ebe a kapịrị ọnụ.
- source_word: κηρυχθῇ
  choice: a ga-ekwusa
  rationale: “Ikwusa” na-egosi ime ka ozi ruo ọha mmadụ, dịka ọrụ onye na-akpọsa ozi, ma ọ naghị eme ka ihe ahụ bụrụ naanị okwuchukwu n’ụlọ ụka.
- source_word: τὸ εὐαγγέλιον
  choice: ozi ọma
  rationale: Nke a na-enye kpọmkwem echiche nke εὐαγγέλιον n’Igbo dị mfe nghọta; e debere okwu ọdịnala “oziọma” n’ala peeji dịka ụzọ ọzọ.
- source_word: εἰς ὅλον τὸν κόσμον
  choice: n’ụwa niile
  rationale: Ọ na-egosipụta mgbasa zuru ụwa ọnụ nke okwu Grik ahụ ma na-ada nke ọma n’Igbo.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” na “a ga-ekwukwa” na-egosi na, tinyere ikwusa ozi ọma, a ga-ekwukwa ihe nwanyị ahụ mere.
- source_word: ὃ ἐποίησεν αὕτη
  choice: ihe nwanyị a mere
  rationale: αὕτη bụ nnọchiaha ngosi nke nwanyị, nke na-arụtụ aka n’ebe nwanyị nọ n’akụkọ ahụ; ịkpọ ya “nwanyị a” na-eme ka onye a na-ekwu maka ya doo anya.
- source_word: λαληθήσεται
  choice: a ga-ekwukwa banyere
  rationale: Nke a na-echekwa ọdịdị ọdịnihu na nke nnara-eme nke okwu Grik ahụ, ma na-egosi na omume ya ga-abụ ihe ndị mmadụ ga na-akọ.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: iji na-echeta ya
  rationale: Nke a bụ Igbo dị ndụ ma doo anya maka ime ka ihe o mere nọgide bụrụ ihe ncheta; e debere ntụgharị nke na-egosipụta aha “ihe ncheta” n’ala peeji.
theological_decisions:
- issue: Otú e si tụgharị εὐαγγέλιον n’okwu banyere ikwusa ozi Jizọs n’ụwa niile
  choice: ozi ọma
  alternative: oziọma
  rationale: “Ozi ọma” na-eme ka isi okwu Grik pụta ìhè nye onye Igbo nke oge a, ebe “oziọma” bụ okwu Ndị Kraịst jikarị eme ihe. A hapụrụ ụzọ abụọ ahụ ka ntụgharị ghara ịmanye nghọta otu ụka.
- issue: Ime ka onye αὕτη na-arụtụ aka na ya doo anya
  choice: ihe nwanyị a mere
  alternative: ihe onye a mere
  rationale: Ụdị okwu Grik bụ nke nwanyị, ebe akụkọ gbara ya gburugburu na-egosikwa na ọ bụ nwanyị ahụ. Ịkpọ ya “nwanyị a” na-eme ka ntụaka doo anya n’enweghị ịgbakwunye nkọwa ozizi.
- issue: Ihe εἰς μνημόσυνον αὐτῆς pụtara
  choice: iji na-echeta ya
  alternative: dị ka ihe ncheta ya
  rationale: Akpaokwu Grik nwere ike ilekwasị anya n’ọrụ nke icheta ya ma ọ bụ n’ihe omume ahụ dịka ihe ncheta. Isi ntụgharị na-eji Igbo eke eme ihe, ebe ala peeji na-echekwa ọdịdị aha nke okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọpụrụ ma dị mfe nghọta, mee ihe. E zere okwu ụka pụrụ iche ebe okwu nkịtị nwere ike ịnye ihe isi mmalite Grik pụtara; n’otu oge ahụ, e debere okwu Ndị Kraịst maara nke ọma n’ala peeji. A haziri akara ala peeji ka nke ọ bụla soro okwu ọ na-akọwa ozugbo.
