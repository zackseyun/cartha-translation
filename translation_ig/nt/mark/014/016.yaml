  text: καὶ ἐξῆλθον οἱ ⸀μαθηταὶ καὶ ἦλθον εἰς τὴν πόλιν καὶ εὗρον καθὼς εἶπεν αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/016.yaml
  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: ig
  text: Ndị na-eso ụzọ ahụ wee pụọ, bata n’obodo ahụ, hụkwa na ihe dị nnọọ ka ọ gwara ha. Ha wee kwadebe Emume Ngabiga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nri Emume Ngabiga.” Okwu Grik ahụ bụ τὸ πάσχα nwere ike izo aka n’Emume Ngabiga n’ozuzu ya ma ọ bụ, dịka ọnọdụ a si dị, nri ahụ a na-akwadebe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: wee pụọ
  rationale: Ọ na-egosi na ha siri nʼebe ha nọ pụọ; “pụọ” bụ okwu Igbo doro anya ma kwekọọ nʼusoro akụkọ.
- source_word: μαθηταὶ
  choice: ndị na-eso ụzọ ahụ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị na-amụta ihe nʼaka Jizọs ma na-eso ya.
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: bata nʼobodo ahụ
  rationale: “Bata” na-egosipụta mmegharị banye nʼime obodo ahụ ma na-echekwa ọdịiche dị nʼetiti ịpụ na ịbata.
- source_word: πόλιν
  choice: obodo ahụ
  rationale: NʼIgbo, “obodo” nwere ike ịpụta city ma ọ bụ town; nʼọnọdụ a ọ na-ezo aka na Jeruselem, obodo ahụ ndị na-agụ akụkọ ahụ marala.
- source_word: εὗρον καθὼς εἶπεν αὐτοῖς
  choice: hụkwa ihe niile dị nnọọ ka ọ gwara ha
  rationale: Ihe e kwuru na ha hụrụ abụghị otu ihe a kpọrọ aha kpọmkwem, kama ọ bụ ọnọdụ ha zutere; “ihe niile dị” na-eme ka Igbo bụrụ nke e ji ọnụ ekwu nke ọma nʼagbakwunyeghị ihe ọhụrụ dị mkpa.
- source_word: ἡτοίμασαν
  choice: ha wee kwadebe
  rationale: “Kwadebe” na-enye echiche nke ime ka ihe dị njikere, nke bụ isi ihe ἑτοιμάζω pụtara.
- source_word: τὸ πάσχα
  choice: Emume Ngabiga
  rationale: “Emume Ngabiga” na-echekwa ohere nke πάσχα izo aka nʼemume ahụ nʼozuzu ya, ebe ọnọdụ a nwekwara ike igosi nri Emume Ngabiga.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. A haziri njikọ ngwaa ndị ahụ nʼụzọ akụkọ Igbo si aga nke ọma, ebe a hapụrụ nghọta abụọ nke τὸ πάσχα ka ihe odide na nkọwa ala peeji gosipụta ha.
