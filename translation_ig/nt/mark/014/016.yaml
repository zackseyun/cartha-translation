revisions:
- from: Ndị na-eso ụzọ ahụ wee pụọ, bata nʼobodo ahụ, hụkwa ihe niile dị nnọọ ka ọ gwara ha. Ha wee kwadebe Emume Ngabiga.[a]
  to: Ndị na-eso ụzọ ahụ wee pụọ, bata n’obodo ahụ, hụkwa na ihe dị nnọọ ka ọ gwara ha. Ha wee kwadebe Emume Ngabiga.[a]
  rationale: The revision removes the added sense of universality in “ihe niile” while preserving the source’s implicit object and the natural Igbo expression of correspondence with Jesus’ prior instruction. No theological or doctrinal change is involved.
