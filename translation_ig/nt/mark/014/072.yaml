id: MRK.14.72
reference: Mark 14:72
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐκ δευτέρου ἀλέκτωρ ἐφώνησεν· καὶ ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα ⸀ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Πρὶν ἀλέκτορα ⸂φωνῆσαι δὶς τρίς με ἀπαρνήσῃ⸃, καὶ ἐπιβαλὼν ἔκλαιεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: ig
  text: Ozugbo ahụ, oke ọkụkọ kwara ákwá nke ugboro abụọ. Pita chetakwa okwu ahụ Jizọs gwara ya, sị, “Tupu oke ọkụkọ akwaa ákwá ugboro abụọ, ị ga-agọnahụ m ugboro atọ.” O chebara ya echiche, o wee bee ákwá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe o bidoro ịkwa ákwá, o bere ákwá,” ma ọ bụ “o kpuchiri isi ya, wee bee ákwá.” Okwu Grik ἐπιβαλών siri ike ịkọwa; ụfọdụ na-aghọta ya dịka ichebara okwu ahụ echiche, ndị ọzọ dịka mmalite ma ọ bụ mmụba nke ịkwa ákwá, ma ọ bụ mmegharị ahụ a na-ahụ anya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Ozugbo ahụ
  rationale: Na-egosi na ihe ahụ mere n’otu ntabi anya ma na-echekwa ngwa ngwa e ji akọ akụkọ Mak.
- source_word: ἐκ δευτέρου
  choice: nke ugboro abụọ
  rationale: Na-echekwa ọnụ ọgụgụ doro anya dị na Grik, ma bụrụkwa ụzọ Igbo si ekwu ya nke ọma.
- source_word: ἀλέκτωρ ... ἐφώνησεν
  choice: oke ọkụkọ kwara ákwá
  rationale: Nke a bụ okwu Igbo nkịtị maka mkpu oke ọkụkọ.
- source_word: ἀνεμνήσθη
  choice: wee cheta
  rationale: Na-enye kpọmkwem echiche nke icheta ihe e kwuru na mbụ n’usoro akụkọ.
- source_word: τὸ ῥῆμα
  choice: okwu ahụ
  rationale: ῥῆμα nwere ike ịbụ okwu ma ọ bụ ihe e kwuru; ahịrịokwu so ya kọwara ọdịnaya okwu ahụ.
- source_word: ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Jizọs gwara ya, sị
  rationale: Nke a bụ usoro Igbo ebumpụta ụwa nke na-ewebata kpọmkwem ọdịnaya ihe Pita chetara.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: Tupu oke ọkụkọ akwaa ákwá ugboro abụọ
  rationale: Na-echekwa usoro oge na ugboro abụọ nke isi iyi ahụ, n’enweghị ịkọwa na ọ bụ otu oke ọkụkọ a maara kpọmkwem.
- source_word: τρίς με ἀπαρνήσῃ
  choice: ị ga-agọnahụ m ugboro atọ
  rationale: “Ịgọnahụ” na-egosipụta ịjụ ma ọ bụ ịsị na mmadụ amaghị Jizọs, ma na-echekwa ike mmekọrịta dị n’okwu ahụ.
- source_word: ἐπιβαλών
  choice: obi gbawara ya
  rationale: Participle a siri ike ịkọwa. Nhọrọ a na-enye mmetụta nke ndakpọ obi n’Igbo ebumpụta ụwa n’enweghị ịmanye mmegharị ahụ a na-ejighị n’aka.
- source_word: ἔκλαιεν
  choice: o wee bee ákwá
  rationale: Na-enye omume ịkwa ákwá n’asụsụ Igbo dị ugbu a; imperfect Grik nwere ike igosi na ọ gara n’ihu, ma okwu a na-arụ ọrụ nke ọma n’akụkọ.
theological_decisions:
- issue: Nkọwa participle ἐπιβαλών nke siri ike
  choice: “obi gbawara ya” dị n’ahụ ederede, ya na nkọwa ala peeji.
  alternative: “mgbe o chebara ya echiche”; ma ọ bụ mmegharị ahụ dịka ikpuchi isi ya.
  rationale: Isi iyi ahụ edoghị anya ma okwu a na-ekwu maka ntụgharị uche, ndakpọ mmetụta, ma ọ bụ mmegharị ahụ. Nsụgharị bụ isi na-egosipụta mwute Pita n’enweghị ikwubi mmegharị ahụ a na-ejighị n’aka; nkọwa ala peeji na-echekwa nghọta ndị ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji “oke ọkụkọ kwara ákwá” mee ihe dịka akpaokwu Igbo ebumpụta ụwa; e zere okwu ụka pụrụ iche. Akara nkọwa [a] dị n’ahụ ederede.
