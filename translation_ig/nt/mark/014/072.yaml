revisions:
- from: Ozugbo ahụ, oke ọkụkọ kwara ákwá nke ugboro abụọ. Pita wee cheta okwu ahụ Jizọs gwara ya, sị, “Tupu oke ọkụkọ akwaa ákwá ugboro abụọ, ị ga-agọnahụ m ugboro atọ.” Mgbe ahụ, obi gbawara ya, o wee bee ákwá.[a]
  to: Ozugbo ahụ, oke ọkụkọ kwara ákwá nke ugboro abụọ. Pita chetakwa okwu ahụ Jizọs gwara ya, sị, “Tupu oke ọkụkọ akwaa ákwá ugboro abụọ, ị ga-agọnahụ m ugboro atọ.” O chebara ya echiche, o wee bee ákwá.[a]
  rationale: The revision preserves every explicit element of the Greek while replacing an emotionally specific interpretation of the disputed participle with a natural Igbo rendering that is a longstanding and viable understanding. The footnote transparently preserves other major interpretive possibilities. “Chetakwa” also represents the Greek connective καί without making the English audit trail govern Igbo style.
  reviewer_model: gpt-5.6-terra
