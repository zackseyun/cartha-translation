    text: Ma ọ bụ, “mgbe o bidoro ịkwa ákwá, o bere ákwá,” ma ọ bụ “o kpuchiri isi ya, wee bee ákwá.” Okwu Grik ἐπιβαλών siri ike ịkọwa; ụfọdụ na-aghọta ya dịka ichebara okwu ahụ echiche, ndị ọzọ dịka mmalite ma ọ bụ mmụba nke ịkwa ákwá, ma ọ bụ mmegharị ahụ a na-ahụ anya.
    reason: lexical_alternative
