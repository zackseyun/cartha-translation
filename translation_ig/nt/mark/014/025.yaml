id: MRK.14.25
reference: Mark 14:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐκέτι οὐ μὴ πίω ἐκ τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω καινὸν ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: ig
  text: “N’ezie, ana m agwa unu, agaghị m aṅụkwa ihe sitere ná mkpụrụ osisi vaịn ọzọ ma ọlị[a][b] ruo ụbọchị ahụ, mgbe m ga-aṅụ ya dị ọhụrụ[c] n’alaeze Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Agaghị m aṅụkwa ihe sitere ná mkpụrụ osisi vaịn ọzọ mgbe ọ bụla.” Okwu Grik ji nkwụsi ike pụrụ iche jụ ihe ga-eme n’ọdịnihu.
    reason: lexical_alternative
  - marker: b
    text: “Ihe sitere ná mkpụrụ osisi vaịn” bụ usoro okwu Grik e ji mee ihe n’ebe a; ya bụ, ihe ọṅụṅụ sitere na vaịn nke e ji mee ihe n’oriri ahụ.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “mgbe m ga-aṅụ ya ọzọ.” Okwu Grik ahụ pụtara “ọhụrụ,” ma nwee ike ịgụnye ịdị ọhụrụ nke oge alaeze Chineke ga-ezu oke.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: N’ezie, ana m agwa unu
  rationale: Nke a na-enye usoro nkwupụta siri ike ahụ n’Igbo nkịtị ma dị ùgwù; ‘N’ezie’ na-eme ka ἀμὴν doo ndị na-agụ akwụkwọ taa anya.
- source_word: οὐκέτι οὐ μὴ πίω
  choice: agaghị m aṅụkwa ... ọzọ ma ọlị
  rationale: ‘Aṅụkwa ... ọzọ’ na-egosi na ọ gaghị eme ya ọzọ, ebe ‘ma ọlị’ na-ebupụta ike nke nkwụsi ike dị n’οὐ μή.
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: ihe sitere ná mkpụrụ osisi vaịn
  rationale: Nke a na-edobe okwu Grik nke pụtara ihe osisi vaịn mịpụtara, ma ghara ịkọwa ya kpọmkwem dị ka mmanya karịa ihe ederede kwuru.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: ruo ụbọchị ahụ
  rationale: Ọ na-edobe ma njedebe oge ahụ ma nrụtụ aka pụrụ iche nke ‘ụbọchị ahụ.’
- source_word: ὅταν αὐτὸ πίνω
  choice: mgbe m ga-aṅụ ya
  rationale: ‘Mgbe’ dabara n’otu ihe ga-eme n’ọdịnihu, ‘ya’ ana-ezo aka n’ihe ọṅụṅụ a kpọtụrụ aha.
- source_word: καινὸν
  choice: dị ọhụrụ
  rationale: ‘Ọhụrụ’ na-edobe echiche nke ihe ọhụrụ n’ụdị ma ọ bụ n’ịdị ya, na-enweghị ịmanye nkọwa ma ọ bụ naanị ‘ọzọ.’
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: n’alaeze Chineke
  rationale: Nke a bụ ụzọ Igbo doro anya ma kwụ ọtọ isi debe okwu Agba Ọhụrụ banyere alaeze Chineke.
theological_decisions:
- issue: Ihe καινὸν pụtara n’ahịrị ikpeazụ
  choice: dị ọhụrụ
  alternative: ọzọ; n’ụzọ ọhụrụ
  rationale: Okwu Grik ahụ nwere ike igosi ịdị ọhụrụ n’ụdị ma nwee ike ịgụnye echiche nke ịṅụ ya ọzọ n’ọdịnihu. Nsụgharị bụ isi hapụrụ obosara ahụ ka ọ ghara idozi esemokwu nke ederede ahụ na-akọwaghị.
- issue: Ihe ‘mkpụrụ osisi vaịn’ na-ezo aka na ya
  choice: ihe sitere ná mkpụrụ osisi vaịn
  alternative: mmanya
  rationale: Ọ bụ ezie na ọnọdụ nri ahụ na-egosi ihe dị n’iko, Grik ekwughị ‘mmanya’ kpọmkwem. Ya mere, e debere usoro okwu ahụ n’enweghị ịgbakwunye nkọwa karịrị isi mmalite.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ụda nkwupụta siri ike, okwu ihe sitere n’osisi vaịn, na nghọta sara mbara nke ‘ọhụrụ’ n’enweghị itinye nkọwa otu ụka.
