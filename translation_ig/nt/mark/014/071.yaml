  text: ὁ δὲ ἤρξατο ἀναθεματίζειν καὶ ὀμνύναι ὅτι Οὐκ οἶδα τὸν ἄνθρωπον τοῦτον ὃν λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: ig
  text: Ma ọ malitere ịkpọ ọbụbụ ọnụ na ịṅụ iyi[a], sị, “Amaghị m nwoke a unu na-ekwu maka ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịbụ ọnụ”; o nwekwara ike ịpụta, “ịkpọ ọbụbụ ọnụ n’isi onwe ya.” Grik ekwughị kpọmkwem onye ma ọ bụ ihe ọbụbụ ọnụ ahụ metụtara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ma ọ
  rationale: δέ na-egosi ntakịrị mmegide na ọganihu n’akụkọ ahụ; “Ma ọ” dabara n’ịka njọ nke ngọnahụ ahụ.
- source_word: ἤρξατο
  choice: malitere
  rationale: Ọ na-egosi mmalite omume ndị infinitive sochiri ya.
- source_word: ἀναθεματίζειν
  choice: ịkpọta ọbụbụ ọnụ
  rationale: Nke a na-egosi ịkpọku ọbụbụ ọnụ, ọ bụghị naanị ikwu okwu ọjọọ; ọ naghịkwa ekpebi onye ọbụbụ ọnụ ahụ ga-adakwasị.
- source_word: ὀμνύναι
  choice: ịṅụ iyi
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa iyi ma ọ bụ ịgba akaebe siri ike, ọ bụghị okwu mkparị.
- source_word: ὅτι
  choice: sị
  rationale: N’ebe a ὅτι na-ewebata kpọmkwem ihe Pita kwuru n’iyi na ngọnahụ ya.
- source_word: Οὐκ οἶδα
  choice: Amaghị m
  rationale: Ọ na-edobe ihe Greek kwuru n’ụzọ kwụ ọtọ ma na-egosi ngọnahụ siri ike.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: nwoke a
  rationale: “A” na-echekwa ike demonstrative τοῦτον n’enweghị ịgbakwụnye ụda nlelị.
- source_word: ὃν λέγετε
  choice: unu na-ekwu maka ya
  rationale: Nke a bụ Igbo nkịtị na nke doro anya maka onye ndị ahụ na-ekwu banyere ya.
theological_decisions:
- issue: Ụdị ọbụbụ ọnụ Pita kpọkuru n’okwu ἀναθεματίζειν
  choice: Ịsụgharị ya dị ka ịkpọta ọbụbụ ọnụ n’ekwughị na Pita bụrụ Jizọs ọnụ ma ọ bụ kpọọ ọbụbụ ọnụ kpọmkwem n’isi onwe ya.
  alternative: “Ọ malitere ịbụ ọnụ” ma ọ bụ “ọ malitere ịkpọ ọbụbụ ọnụ n’isi onwe ya.”
  rationale: Ọnọdụ ahụ nwere ike ịpụta na ọ kpọrọ ọbụbụ ọnụ n’isi onwe ya iji mee ka iyi ya sie ike, ma Greek akpọghị ihe ma ọ bụ onye ọbụbụ ọnụ ahụ metụtara. Ya mere, isiokwu bụ isi na-edobe obosara na mgbagwoju anya nke okwu ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ịkpọta ọbụbụ ọnụ” chekwaa ịdị arọ nke ἀναθεματίζειν na mgbagwoju anya banyere onye ọbụbụ ọnụ ahụ metụtara; akara [a] dị n’isiokwu bụ isi.
