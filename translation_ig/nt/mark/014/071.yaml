    reason: lexical_alternative
  revision_rationale: The revision changes only the rendering of ἀναθεματίζειν from the less idiomatic “ịkpọta ọbụbụ ọnụ” to “ịkpọ ọbụbụ ọnụ.” This conveys invoking curses while leaving their target unstated, as does the Greek. The footnote is retained and minimally normalized into Standard Igbo.
