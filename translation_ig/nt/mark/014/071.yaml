revisions:
- from: Ma ọ malitere ịkpọta ọbụbụ ọnụ na ịṅụ iyi[a] sị, “Amaghị m nwoke a unu na-ekwu maka ya.”
  to: Ma ọ malitere ịkpọ ọbụbụ ọnụ na ịṅụ iyi[a], sị, “Amaghị m nwoke a unu na-ekwu maka ya.”
  rationale: The revision changes only the rendering of ἀναθεματίζειν from the less idiomatic “ịkpọta ọbụbụ ọnụ” to “ịkpọ ọbụbụ ọnụ.” This conveys invoking curses while leaving their target unstated, as does the Greek. The footnote is retained and minimally normalized into Standard Igbo.
  reviewer_model: gpt-5.6-terra
