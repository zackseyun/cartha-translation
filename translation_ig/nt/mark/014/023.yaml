source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον εὐχαριστήσας ἔδωκεν αὐτοῖς, καὶ ἔπιον ἐξ αὐτοῦ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: ig
  text: O were otu iko[a]; mgbe o nyechara ekele, o nyere ha ya, ha niile ṅụkwara n’ime ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “iko ahụ.” N’asụsụ Grik, e dere “iko” n’enweghị edemede mkpọaha, ma ọnọdụ oriri ahụ nwere ike igosi iko a kapịrị ọnụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: O wee were
  rationale: Aorist participle ahụ na-egosi ihe o mere tupu o nye ha iko ahụ. Usoro “O wee were” na-egosipụta usoro akụkọ ahụ n’Igbo dị mfe ma dịkwa eke.
- source_word: ποτήριον
  choice: otu iko
  rationale: ποτήριον enweghị article n’asụsụ Grik. “Otu iko” na-enye nghọta nke iko a na-akpọtụbeghị aha kpọmkwem, ma ihe ndị gbara amaokwu ahụ gburugburu ka nwere ike ime ka a ghọta na ọ bụ otu iko a kapịrị ọnụ.
- source_word: εὐχαριστήσας
  choice: mgbe o nyechara Chineke ekele
  rationale: Aorist participle ahụ na-egosi na inye ekele buru ụzọ mee tupu inye iko ahụ. Igbo na-achọkarị ka e kwuo onye a na-ekele; “Chineke” na-eme ka okwu ahụ doo anya n’ụzọ kwekọrọ n’omume inye ekele n’oge nri, n’enweghị iji okwu emume ụka e mechara guzobe.
- source_word: ἔδωκεν αὐτοῖς
  choice: nye ha ya
  rationale: “Ya” na-ezo aka n’iko ahụ. Nke a bụ usoro Igbo dị nkenke ma doo anya.
- source_word: ἔπιον
  choice: ṅụọ
  rationale: Nke a bụ okwu Igbo nkịtị maka ịṅụ ihe ọṅụṅụ, ma ọ na-egosipụta aorist ahụ n’usoro akụkọ.
- source_word: ἐξ αὐτοῦ
  choice: n’ime ya
  rationale: N’Igbo, “ṅụọ n’ime ya” na-egosi na ha ṅụrụ ihe site n’iko ahụ. “Ya” na-ezo aka n’iko, ọ bụghị n’onye.
- source_word: πάντες
  choice: ha niile
  rationale: Nke a na-echekwa nkwusi okwu Grik na onye ọ bụla n’ime ha ṅụrụ.
theological_decisions:
- issue: Ihe εὐχαριστήσας pụtara n’ebe a na njikọ ya na Oriri Nsọ
  choice: mgbe o nyechara Chineke ekele
  alternative: mgbe ọ gọzichara ya; mgbe o kwuchara ekpere ekele
  rationale: εὐχαριστέω pụtara inye ekele. Nsụgharị a anaghị agbanwe ya ka ọ bụrụ okwu pụrụ iche nke emume ụka, ma ọ naghịkwa ekwu na ọ bụ iko ahụ ka ọ gọziri, ihe ederede Grik na-ekwughị kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe ma dị ugwu, dee ya. Usoro “O wee…” na-eme ka akụkọ ahụ na-aga were were; e zere okwu emume ụka nke nwere ike ịgbakwunye nkọwa na-adịghị n’ederede Grik.
