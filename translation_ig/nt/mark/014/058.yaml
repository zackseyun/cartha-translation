id: MRK.14.58
reference: Mark 14:58
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος ὅτι Ἐγὼ καταλύσω τὸν ναὸν τοῦτον τὸν χειροποίητον καὶ διὰ τριῶν ἡμερῶν ἄλλον ἀχειροποίητον οἰκοδομήσω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: ig
  text: na, “anyị nụrụ ka ọ na-ekwu, ‘M ga-akwatu ụlọ nsọ a nke e ji aka mee[b], ma n’ime ụbọchị atọ[a], aga m ewu ụlọ nsọ ọzọ nke e jighị aka mee.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ụbọchị atọ.” Okwu Grik ahụ, διὰ τριῶν ἡμερῶν, na-egosikarị oge a ga-emezu ihe ahụ n’ime ya.
    reason: lexical_alternative
  - marker: b
    text: “Nke e ji aka mee” na “nke e jighị aka mee” na-echekwa ọdịiche dị n’etiti okwu Grik χειροποίητον na ἀχειροποίητον.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: na-asị
  rationale: N'ebe a, ὅτι na-ewebata ihe ndị akaebe kwuru; ‘na-asị’ na-ejikọta ya n'ụzọ Igbo dị mma na amaokwu bu ya ụzọ.
- source_word: Ἡμεῖς
  choice: Anyị
  rationale: E debere nnọchiaha ahụ pụtara ìhè iji chekwaa nkwusi ike ndị akaebe tinyere n'okwu ha.
- source_word: ἠκούσαμεν αὐτοῦ λέγοντος
  choice: Anyị nụrụ ka ọ na-ekwu
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosipụta na ha nụrụ ya mgbe ọ na-ekwu okwu ahụ, ma na-echekwa ọdịdị participle ahụ.
- source_word: καταλύσω
  choice: M ga-akwatu
  rationale: N'ihe gbasara ụlọ, ‘ịkwatu’ na-egosi ịkwatu ma ọ bụ ibibi ihe e wuru nke ọma.
- source_word: ναὸν τοῦτον
  choice: ụlọ nsọ a
  rationale: ‘Ụlọ nsọ’ bụ okwu Igbo a na-aghọta nke ọma maka ναός, ebe ‘a’ na-echekwa ntụaka kpọmkwem nke τοῦτον.
- source_word: χειροποίητον
  choice: nke e ji aka mee
  rationale: Nsụgharị kpọmkwem a na-echekwa ọdịiche okwu ahụ na ἀχειροποίητον.
- source_word: διὰ τριῶν ἡμερῶν
  choice: n’ime ụbọchị atọ
  rationale: Ọ na-egosi ogologo oge ma ọ bụ oge a ga-emezu ihe ahụ n'ime ya, n'ebughị ụzọ mee ya ka ọ bụrụ ‘mgbe ụbọchị atọ gasịrị.’
- source_word: ἄλλον
  choice: ọzọ
  rationale: Ọ na-echekwa echiche nke ụlọ nsọ ọzọ dị iche na nke mbụ.
- source_word: ἀχειροποίητον
  choice: nke a na-ejighị aka mee
  rationale: E mere ya ka o kwekọọ n'ụzọ doro anya na ‘nke e ji aka mee,’ na-akọwaghị onye ga-eme ya.
- source_word: οἰκοδομήσω
  choice: aga m ewu
  rationale: ‘Iwu’ na-enye ihe οἰκοδομέω pụtara n'enweghị itinye echiche nke ‘iwughachi,’ nke okwu Grik ahụ ekwughị kpọmkwem.
theological_decisions:
- issue: Ma a ga-akọwa n'ụzọ pụtara ìhè na okwu a bụ ebubo ndị akaebe, ọ bụghị nkwenye onye na-akọ akụkọ
  choice: E debere ya dịka okwu ndị akaebe kwuru n'emeghị nkọwa ọzọ
  alternative: Ịgbakwunye okwu na-egosi na ha gbagọrọ okwu Jizọs
  rationale: Amaokwu ahụ na-akọ naanị ihe ha sịrị na ha nụrụ; ntụgharị ekwesịghị ibubata nkọwa sitere n'akụkụ Akwụkwọ Nsọ ọzọ.
- issue: Otu e si echekwa ọdịiche dị n'etiti χειροποίητον na ἀχειροποίητον
  choice: ‘nke e ji aka mee’ / ‘nke a na-ejighị aka mee’
  alternative: ‘nke mmadụ mere’ / ‘nke Chineke mere’
  rationale: Ụdị a na-echekwa nghọta na esemokwu nkà mmụta okpukpe nwere ike ịdị n'okwu Grik ahụ, kama ikpebi na onye mere nke abụọ bụ Chineke n'ime nsụgharị ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E ji ‘ụlọ nsọ’ mee ka onye nkịtị ghọta ναός; e chekwara ntụnyere okwu abụọ gbasara ihe e ji aka mee. Akara ntụaka [a] na [b] dị n'ederede isi.
