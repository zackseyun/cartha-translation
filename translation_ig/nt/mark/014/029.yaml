  text: ὁ δὲ Πέτρος ἔφη αὐτῷ· ⸂Εἰ καὶ⸃ πάντες σκανδαλισθήσονται, ἀλλ’ οὐκ ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/029.yaml
  text: But Peter said to him[a], “Even if all fall away, I will not.”
translation:
  language: ig
  text: Ma Pita sịrị ya, “Ọ bụrụgodị na ha niile ga-asụ ngọngọ[a], mụ onwe m agaghị asụ ngọngọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “daa” ma ọ bụ “mee ka ha sụọ ngọngọ.” N’ọnọdụ a, okwu a pụrụ igosi ịda ma ọ bụ ịhapụ iguzosi ike n’ebe Jizọs nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti amụma Jizọs kwuru tupu nke a na nzaghachi Pita.
- source_word: ἔφη αὐτῷ
  choice: sịrị ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụ nke nkịtị isi kwuo na Pita gwara ya okwu; ‘ya’ na-ezo aka na Jizọs dịka Grik si jiri nnọchiaha mee.
- source_word: Εἰ καὶ
  choice: Ọ bụrụgodị na
  rationale: Ọ na-egosipụta ọnọdụ e kwere ka ọ bụrụ eziokwu ọbụna ma ọ bụrụ nke siri ike.
- source_word: πάντες
  choice: ha niile
  rationale: Ọ na-ezo aka n’ìgwè ndị na-eso ụzọ niile dị n’okwu gbara amaokwu a gburugburu.
- source_word: σκανδαλισθήσονται
  choice: ahapụ gị
  rationale: N’ọnọdụ akụkọ a, ngwaa ahụ na-ekwu maka ịda n’ikwesị ntụkwasị obi na ịgbapụ n’ebe Jizọs nọ; ‘ahapụ gị’ na-eme ka nke a doo ndị na-agụ Igbo anya n’etinyeghị ikpe banyere ọdịnihu ime mmụọ ha.
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: mụ onwe m agaghị ahapụ gị
  rationale: ‘Mụ onwe m’ na-echekwa nkwusi ike dị na ἐγώ, ebe a na-etinye ngwaa a ghọtara site n’ahịrịokwu gara aga ka Igbo wee zuo oke ma doo anya.
theological_decisions:
- issue: Ihe σκανδαλισθήσονται pụtara n’ọnọdụ ọdịda ndị na-eso ụzọ
  choice: ahapụ gị
  alternative: sụọ ngọngọ / daa n’okwukwe
  rationale: Nhọrọ a na-egosi ọdịda nke iguzosi ike n’akụkụ Jizọs na mgbapụ ndị na-eso ụzọ n’abalị ahụ, ma ọ naghị ekpebi na ọ bụ ịjụ okwukwe kpamkpam ma ọ bụ ruo mgbe ebighị ebi.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E ji ‘mụ onwe m’ chekwaa nkwusi ike Pita tinyere n’onwe ya. A kọwara ihe a na-ahapụ—Jizọs—n’ihi na nke ahụ bụ ụzọ Igbo doro anya isi gosipụta echiche ngwaa ahụ n’ọnọdụ a.
