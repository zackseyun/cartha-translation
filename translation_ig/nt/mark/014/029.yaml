review_pass:
  verdict: revise
  source_fidelity: ‘Ahapụ gị’ captures the likely narrative outcome of the disciples’ failure, but it makes Jesus the explicit object and narrows σκανδαλισθήσονται to desertion. The Greek uses the same verb elliptically in both clauses and retains a broader sense of being made to stumble/fall away. Rendering the repeated verb as ‘sụọ ngọngọ’ better preserves this wording and ambiguity.
  naturalness: ‘Ọ bụrụgodị na ha niile ga-asụ ngọngọ, mụ onwe m agaghị asụ ngọngọ’ is clear, idiomatic Standard Igbo, and retains Peter’s emphatic contrast without unnecessarily repeating an explicit object.
  terminology: ‘Sụọ ngọngọ’ is an established, dignified Igbo expression for stumbling and can bear the figurative force required here. A note supplies the contextual alternative ‘fall away’ without turning the translation itself into an interpretation.
  issues:
  - severity: medium
    issue: The draft renders σκανδαλισθήσονται as ‘ahapụ gị’ in both clauses.
    rationale: This is contextually related, but the Greek does not explicitly say ‘you’ and its verb has a wider, disputed semantic range (stumble, be caused to stumble, fall away). The rendering adds an object and forecloses that lexical breadth.
  - severity: low
    issue: No lexical note accompanies the figurative rendering of σκανδαλισθήσονται.
    rationale: The English audit trail marks this term with a note because its alternatives materially affect nuance. An Igbo note preserves the same transparency.
  revised_text: Ma Pita sịrị ya, “Ọ bụrụgodị na ha niile ga-asụ ngọngọ[a], mụ onwe m agaghị asụ ngọngọ.”
