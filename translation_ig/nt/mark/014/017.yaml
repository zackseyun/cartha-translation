  text: Καὶ ὀψίας γενομένης ἔρχεται μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/017.yaml
  text: And when evening came[a], he comes with the twelve.
translation:
  language: ig
  text: Mgbe mgbede ruru, ọ bịara soro Ndị Iri na Abụọ ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Mgbe
  rationale: N'Igbo, njikọ ahụ na nkebi oge nke na-esote na-eme ka usoro akụkọ pụta nke ọma; ịgbakwunye “Na” ga-adị arọ ma ọ dịghị mkpa.
- source_word: ὀψίας γενομένης
  choice: Mgbe chi jiri
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma doo anya isi kwuo na mgbede eruola, ma na-echekwa ọrụ oge nke genitive absolute.
- source_word: ἔρχεται
  choice: ọ bịara
  rationale: Ọ bụ ezie na Grik ji historical present mee ka akụkọ dị ndụ, oge gara aga bụ ụzọ nkịtị e si akọ ihe mere eme n'Igbo, ma ọ naghị agbanwe ihe omume ahụ.
- source_word: μετὰ τῶν δώδεκα
  choice: ya na ndị na-eso ụzọ ya iri na abụọ
  rationale: μετά na genitive na-egosi iso mmadụ; mgbakwunye “ndị na-eso ụzọ ya” na-eme ka ndị a na-ekwu maka ha doo ndị Igbo anya, ebe “iri na abụọ” naanị ya nwere ike ghara ịdị eke.
theological_decisions:
- issue: Ndị okwu ahụ bụ “ndị iri na abụọ” na-ezo aka na ha
  choice: Ndị na-eso ụzọ Jizọs iri na abụọ, Judas sokwa n'ime ha n'oge a
  alternative: 'Iji aha otu ahụ naanị: “Ndị Iri na Abụọ”'
  rationale: Akụkọ ahụ na-ezo aka n'òtù ndị Jizọs họpụtara iri na abụọ. E tinyeghị “ndị ozi” ka a ghara itinye nkọwa ọrụ karịrị okwu amaokwu a.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ugwu. “Mgbe chi jiri” bụ okwu oge a na-aghọta nke ọma; “ọ bịara” na-asọ ụtọ n'akụkọ Igbo karịa historical present kpọmkwem.
