  rationale: The revision uses an idiomatic Standard Igbo temporal clause and the natural accompaniment construction “bịara soro.” It retains the source’s concise, recognized designation for Jesus’ group, including its definiteness, without adding an explanatory noun. No footnote is necessary because no unresolved lexical alternative remains in the revised rendering.
