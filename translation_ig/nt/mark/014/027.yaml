  rationale: 'E meela naanị mmezi okwu abụọ: a gbanwere ‘onye ọzụzụ atụrụ’ ka ọ bụrụ ‘onye na-azụ atụrụ’ iji kọwaa ποιμένα n’ụzọ Standard Igbo eke na nke ziri ezi, ma gbanwee ‘e dere, sị,’ ka ọ bụrụ ‘e dere:’ maka usoro nkwughachi sitere n’Akwụkwọ Nsọ. A hapụrụ ‘ga-asụ ngọngọ’ na ihe odide ala ala ya ka a ghara iwepu nghọtahie dị na σκανδαλισθήσεσθε.'
