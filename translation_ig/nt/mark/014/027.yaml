  verdict: revise
  source_fidelity: 'Isi ederede na-anọchi anya SBLGNT nke ọma: ọ na-edobe ‘unu niile,’ ọdịnihu nke σκανδαλισθήσεσθε, usoro ‘e dere,’ na ihe atụ banyere onye na-elekọta atụrụ na atụrụ. E wepụrụ n''ụzọ ziri ezi ‘n’ihi m,’ n’ihi na ọ dịghị na SBLGNT e nyere. Otú ọ dị, a ga-emezi aha onye ahụ ka ọ pụta ìhè dịka ‘onye na-azụ atụrụ,’ ọ bụghị onye na-akụziri atụrụ ọzụzụ.'
  naturalness: ‘Onye na-azụ atụrụ’ bụ okwu Standard Igbo eke ma doo anya maka shepherd. ‘E dere:’ na-ewebata nkwughachi Akwụkwọ Nsọ n’ụzọ dị ọcha karịa ‘e dere, sị,’ ebe okwu a na-esote bụ nkwughachi kpọmkwem.
