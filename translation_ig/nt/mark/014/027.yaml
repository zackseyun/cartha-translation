  - severity: low
    issue: ‘e dere, sị,’ adịghị mkpa tupu nkwughachi kpọmkwem.
    rationale: ‘E dere:’ bụ usoro Igbo dị ọcha ma na-egosipụta nke ọma usoro γέγραπται na nkwughachi Akwụkwọ Nsọ na-eso.
