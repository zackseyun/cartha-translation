  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: ig
  text: 'Jizọs wee sị ha, “Unu niile ga-asụ ngọngọ[a], n’ihi na e dere: ‘M ga-eti onye na-azụ atụrụ ihe, atụrụ ndị ahụ ga-agbasasịkwa.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Unu niile ga-ada,” ma ọ bụ, “A ga-eme ka unu niile sụọ ngọngọ.” N’ebe a, okwu ahụ na-ezo aka n’ọdịda na mgbahapụ ndị na-eso ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: wee sị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a n’akụkọ ihe mere eme, ‘wee sị’ bụ ụzọ Igbo si akọ akụkọ n’ụzọ dị ndụ ma dịkwa eke.
- source_word: σκανδαλισθήσεσθε
  choice: ga-asụ ngọngọ
  rationale: Nhọrọ a na-edobe ihe atụ dị na okwu Grik, gụnyekwa ọdịda ndị na-eso ụzọ na mgbahapụ ha n’ọnọdụ a, n’enweghị itinye okwu ‘m’ nke na-adịghị na ederede SBLGNT.
- source_word: γέγραπται
  choice: e dere
  rationale: Nke a bụ okwu Igbo doro anya e ji ewebata ihe e dere n’Akwụkwọ Nsọ, ma na-edobe ụdị passive nke Grik.
- source_word: Πατάξω
  choice: M ga-eti ... ihe
  rationale: Ọ na-egosipụta ike nke ngwaa ahụ n’asụsụ Igbo nke oge a n’enweghị okwu ochie ma ọ bụ ịkọwa ụdị ihe otiti ahụ.
- source_word: ποιμένα
  choice: onye ọzụzụ atụrụ
  rationale: Ọ na-edobe ihe atụ nke onye na-elekọta ìgwè atụrụ nakwa singular ya.
- source_word: τὰ πρόβατα
  choice: atụrụ ndị ahụ
  rationale: Ọ bụ ntụgharị Igbo eke nke plural ahụ, na-ejikọkwa atụrụ ndị ahụ na onye ọzụzụ ha.
- source_word: διασκορπισθήσονται
  choice: ga-agbasasị
  rationale: 'Ọ na-enye n’Igbo nsonaazụ passive ahụ n’ụzọ eke: mgbe e tichara onye ọzụzụ atụrụ, ìgwè atụrụ ahụ agbasasịa.'
theological_decisions:
- issue: Ihe σκανδαλισθήσεσθε pụtara banyere ọdịda ndị na-eso ụzọ
  choice: ga-asụ ngọngọ
  alternative: ga-ada; a ga-eme ka unu sụọ ngọngọ; ga-agbahapụ
  rationale: ‘Ga-asụ ngọngọ’ na-edobe ihe atụ na nghọtahie nwere ike ịdị n’okwu Grik. N’ọnọdụ a, ọ na-ezo aka n’ọdịda na mgbasasị ndị na-eso ụzọ, ma ọ naghị ekpebi n’ime isi ederede ma nke a ọ bụ mgbahapụ kpamkpam ma ọ bụ na e mere ka ha daa.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma nwee ugwu. E tinyere akara [a] ozugbo n’akụkụ okwu ọ na-akọwa. A hapụghị ‘n’ihi m’ n’isi ederede, n’ihi na okwu kwekọrọ na ya adịghị na SBLGNT e nyere.
