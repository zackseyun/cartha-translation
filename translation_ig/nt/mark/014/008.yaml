  text: ὃ ⸀ἔσχεν ἐποίησεν, προέλαβεν μυρίσαι ⸂τὸ σῶμά μου⸃ εἰς τὸν ἐνταφιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/008.yaml
  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: ig
  text: O mere ihe o nwere ike ime[a]; o buru ụzọ tee ahụ m mmanụ na-esi ísì ụtọ maka olili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ nkịtị karịa, “Ihe o nwere, o mere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: O mere ihe o nwere ike ime
  rationale: 'Nke a na-egosipụta ike akpaalaokwu Grik ahụ n''Igbo doro anya: nwanyị ahụ mere ihe o nwere ike ime. Ihe odide ala peeji na-edebekwa nsụgharị ya nke dị nso n''usoro okwu Grik.'
- source_word: προέλαβεν
  choice: tupu oge eruo
  rationale: Nkebiokwu a na-egosi na o mere omume ahụ tupu oge olili abịa, na-enweghị itinye echiche ngagharị nke na-adịghị na ngwaa Grik.
- source_word: μυρίσαι
  choice: tere ... mmanụ na-esi ísì ụtọ
  rationale: N'ọnọdụ a, ngwaa ahụ pụtara ite ahụ mmadụ mmanụ otite ma ọ bụ ihe na-esi ísì ụtọ; nsụgharị a bụ nke doro ndị na-agụ Igbo taa anya ma kwekọọ na nkwadebe maka olili.
- source_word: τὸ σῶμά μου
  choice: ahụ m
  rationale: Nke a bụ nsụgharị kpọmkwem na nke ebumpụta ụwa n'Igbo.
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: maka olili
  rationale: Nkebiokwu a na-egosi ebumnuche nke omume ahụ—ịkwadebe ahụ Jizọs maka olili—ma ghara ịgbakwunye ‘olili m’ nke adịghị kpọmkwem n'okwu Grik.
theological_decisions:
- issue: Ime ka onye mere ihe ahụ bụrụ nwanyị pụta ìhè n'agbanyeghị na amaokwu a enweghị aha onye ahụ kpọmkwem
  choice: O mere ...; o tere ...
  alternative: Ihe o nwere, o mere; o buru ụzọ tee ahụ m ...
  rationale: Ngwaa Grik bụ nke onye nke atọ otu, ebe amaokwu ndị gbara ya gburugburu na-egosi na ọ bụ nwanyị ahụ. N'Igbo, ‘o’ dabara n'ụzọ ebumpụta ụwa ma ọ dịghị agbakwunye ọdịnaya nkà mmụta okpukpe ọhụrụ.
- issue: Mmekọrịta προέλαβεν na μυρίσαι
  choice: o tere ... tupu oge eruo
  alternative: o buru ụzọ tee ...
  rationale: Nhọrọ a na-edebe echiche nke ime ihe tupu oge ya, kpọmkwem tupu olili, ma ghara ịkọwa προέλαβεν dịka ịbịa n'ihu oge.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji ‘mmanụ na-esi ísì ụtọ’ mee ka ụdị mmanụ ahụ doo anya, ebe ‘maka olili’ na-edebe ịdị mkpirikpi na ebumnuche nke okwu Grik.
