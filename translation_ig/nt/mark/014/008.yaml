revisions:
- from: O mere ihe o nwere ike ime[a]; o tere ahụ m mmanụ na-esi ísì ụtọ tupu oge eruo maka olili.
  to: O mere ihe o nwere ike ime[a]; o buru ụzọ tee ahụ m mmanụ na-esi ísì ụtọ maka olili.
  rationale: The revision makes the anticipatory force of προέλαβεν explicit through the idiomatic Standard Igbo expression “o buru ụzọ tee,” without adding motion or interpretive detail. It preserves the source’s concise reference to anointing Jesus’ body for burial and retains the literal alternative for the opening idiom.
