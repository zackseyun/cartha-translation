- from: Ọ bịara hụ ha ka ha na-ehi ụra, wee sị Pita, “Saịmọn, ị na-ehi ụra? Ị nweghị ike ịmụ anya otu awa[a]?”
  to: Ọ bịara hụ ha ka ha na-ehi ụra, wee sị Pita, “Saịmọn, ị na-ehi ụra? Ị nweghị ike ịmụrụ anya otu awa[a]?”
  rationale: A single lexical-form correction changes “ịmụ anya” to “ịmụrụ anya” to express the continuing wakefulness/watchfulness denoted by γρηγορῆσαι. All other wording is retained because it is faithful to the Greek and natural in modern Standard Igbo.
