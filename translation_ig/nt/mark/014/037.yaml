  text: καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Σίμων, καθεύδεις; οὐκ ἴσχυσας μίαν ὥραν γρηγορῆσαι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: ig
  text: Ọ bịara hụ ha ka ha na-ehi ụra, wee sị Pita, “Saịmọn, ị na-ehi ụra? Ị nweghị ike ịmụrụ anya otu awa[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịnọ na nche otu awa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: Ọ bịara
  rationale: Ọ bụ historical present n’asụsụ Grik, ma iji oge gara aga n’Igbo na-eme ka akụkọ ahụ bụrụ nke e ji asụsụ nkịtị na nke doro anya kọọ, n’enweghị mgbanwe n’ihe ọ pụtara.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: hụ ha ka ha na-ehi ụra
  rationale: Nke a na-egosi na mgbe ọ bịara, ọ hụrụ ha n’omume na-aga n’ihu nke ihi ụra.
- source_word: λέγει τῷ Πέτρῳ
  choice: wee sị Pita
  rationale: “Wee sị” bụ ụzọ ebumpụta ụwa e si jikọta ihe ndị mere n’usoro n’akụkọ Igbo; “Pita” bụ aha a na-ejikarị eme Πέτρος n’Igbo.
- source_word: Σίμων
  choice: Saịmọn
  rationale: E debere aha Jizọs kpọrọ ya iche n’aha “Pita” onye na-akọ akụkọ ji kọwaa ya.
- source_word: καθεύδεις
  choice: ị na-ehi ụra?
  rationale: Ọ na-egosi omume na-aga n’ihu n’oge ahụ ma na-ebute mba ahụ n’ụzọ doro anya.
- source_word: οὐκ ἴσχυσας
  choice: Ị nweghị ike
  rationale: N’ebe a ἰσχύω na-ekwu maka ikike ime ihe, ọ bụghị naanị ike anụ ahụ; okwu Igbo a bụ nke nkịtị ma zie ezi n’ọnọdụ a.
- source_word: μίαν ὥραν
  choice: otu awa
  rationale: Ọ na-egosi ogologo oge ahụ kpọmkwem.
- source_word: γρηγορῆσαι
  choice: ịmụ anya
  rationale: N’ihi na e ji ya tụnyere ihi ụra ozugbo, “ịmụ anya” na-ebute echiche nke ịnọgide na-amụghị ụra, ebe nkọwa ọzọ nke ịnọ na nche dị na ihe odide ala peeji.
theological_decisions:
- issue: Historical present ndị Mak ji mee ihe
  choice: 'A sụgharịrị ngwaa akụkọ ndị ahụ n’oge gara aga nke Igbo: “Ọ bịara… wee sị.”'
  alternative: “Ọ na-abịa… na-asị,” iji gosipụta historical present n’ụzọ nkịtị.
  rationale: Ige historical present ahụ ntị n’Igbo ga-ada ka ihe na-eme mgbe niile ma ọ bụ ugbu a, ọ bụghị dị ka akụkọ gara aga. Oge gara aga na-echekwa usoro ihe mere ma mee ka Igbo bụrụ nke ebumpụta ụwa.
- issue: Ihe γρηγορέω pụtara n’ọnọdụ a
  choice: ịmụ anya
  alternative: ịnọ na nche
  rationale: Ebe okwu a na-emegide ihi ụra ozugbo, isi echiche ya bụ ịnọ na-amụghị ụra. Ma echiche nke nche na ịmụrụ anya ka bụ ihe kwere omume, ya mere e debere ya n’ihe odide ala peeji.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ usoro akụkọ “Ọ bịara… wee sị” ka ahịrịokwu ahụ daa nke ọma n’Igbo, ebe a hapụrụ ajụjụ Jizọs ka ọ bụrụ nke kpọmkwem ma sie ike dịka n’asụsụ Grik.
