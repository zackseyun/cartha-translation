review_pass:
  verdict: revise
  source_fidelity: The main rendering accurately conveys the repeated return, the discovery that they were sleeping, the causal statement about their eyes, and their not knowing how to answer him. “Anya ha dị arọ” is a natural Igbo equivalent for the Greek image of eyes weighed down by sleep. The existing footnote, however, uses “a na-anyịgbu anya ha,” which can suggest affliction or torment rather than sleep-induced heaviness.
  naturalness: The verse reads naturally in Standard Igbo. The temporal clause “Mgbe ọ bịakwutere ha ọzọ” is an idiomatic way to render the preceding participle. The footnote needs revision because its current alternative is not natural for this context and risks a misleading sense.
  terminology: No theological terminology is at issue. “Ihi ụra,” “anya,” and “aza” are clear, standard choices. The revised note retains the Greek metaphor without introducing an inaccurate image of oppression.
  issues:
  - severity: medium
    issue: The footnote alternative “a na-anyịgbu anya ha” is semantically misleading.
    rationale: anyịgbu commonly conveys oppression, distress, or torment. καταβαρυνόμενοι refers to eyes being burdened/weighed down, here through sleep, not to their being afflicted in that sense.
  revised_text: Mgbe ọ bịakwutere ha ọzọ, ọ hụrụ ha ka ha na-ehi ụra, n’ihi na anya ha dị arọ[a], ha amaghịkwa ihe ha ga-aza ya.
