  text: καὶ ⸂πάλιν ἐλθὼν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ ⸂αὐτῶν οἱ ὀφθαλμοὶ⸃ ⸀καταβαρυνόμενοι, καὶ οὐκ ᾔδεισαν τί ⸂ἀποκριθῶσιν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: ig
  text: Mgbe ọ bịakwutere ha ọzọ, ọ hụrụ ha ka ha na-ehi ụra, n’ihi na anya ha dị arọ[a], ha amaghịkwa ihe ha ga-aza ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anya ha na-adị arọ.” N’asụsụ Grik, a kọwara anya ha n’ihe oyiyi dị ka ndị ibu n’ihi ụra na-arọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐλθὼν
  choice: Mgbe ọ bịakwutere ha ọzọ
  rationale: A na-asụgharị participle a n’ụzọ Igbo si aga nke ọma dị ka nkebi oge; “ọzọ” na-egosi na omume ahụ mere ugboro ọzọ.
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: ọ hụrụ ha ka ha na-ehi ụra
  rationale: Nke a na-echekwa echiche nke ịhụ ha ka omume ihi ụra ka na-aga n’ihu.
- source_word: ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι
  choice: n’ihi na anya ha dị arọ
  rationale: “Anya ha dị arọ” bụ okwu Igbo doro anya ma bụrụkwa ihe oyiyi kwekọrọ n’anya a na-anyịgbu n’ihi ụra.
- source_word: οὐκ ᾔδεισαν
  choice: ha amaghịkwa
  rationale: Nke a bụ ntụgharị kpọmkwem na nke e ji eme ihe n’Igbo maka enweghị ihe ọmụma.
- source_word: τί ἀποκριθῶσιν αὐτῷ
  choice: ihe ha ga-aza ya
  rationale: Ọ na-edobe ajụjụ na-apụtachaghị ìhè na echiche nke nzaghachi e kwesịrị inye Jizọs.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “anya ha dị arọ” n’ahịrị bụ isi n’ihi na ọ bụ okwu Igbo nkịtị ma na-echekwa ihe oyiyi Grik; e tinyere ntụgharị ka kpọmkwem na nkọwa ala peeji.
