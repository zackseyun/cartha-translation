  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ὁ παραδιδούς με ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/042.yaml
  text: Get up; let us go. Look[a], the one betraying me has come near.
translation:
  language: ig
  text: Bilienụ, ka anyị gawa. Lee, onye na-arara m nye[a] abịaruwo nso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị karịa, “onye na-enyefe m n'aka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Bilienụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha bilie; n'ọnọdụ a, Jizọs na-agwa ndị na-eso ụzọ ya ka ha bilie gawa, ọ bụghị nanị ka ha teta n'ụra.
- source_word: ἄγωμεν
  choice: ka anyị gawa
  rationale: Ọ bụ subjunctive hortatory nke onye mbụ ọtụtụ, ya mere “ka anyị gawa” na-egosipụta òkù Jizọs kpọrọ ka ha niile mee njem ahụ.
- source_word: ἰδού
  choice: Lee
  rationale: “Lee” bụ okwu Igbo dị ugbu a nke na-adọta uche n'ihe na-esote, n'enweghị ụda okwu ochie.
- source_word: ὁ παραδιδούς
  choice: onye na-arara m nye
  rationale: N'ọnọdụ akụkọ ahụ, okwu a na-ezo aka n'omume Judas nke ịrara Jizọs nye; nhazi “onye na-...” na-echekwa ọdịdị participle nke Grik. A na-edebe echiche nkịtị nke ‘inyefe’ na nkọwa ala peeji.
- source_word: με
  choice: m
  rationale: Nnọchiaha a bụ ihe omume ahụ metụtara, ọ na-ezo aka na Jizọs.
- source_word: ἤγγικεν
  choice: abịaruwo nso
  rationale: Ụdị perfect a na-egosi na onye ahụ abịaruola, ọnọdụ ahụ ka dịkwa ugbu a; “abịaruwo nso” na-echekwa ma ọbịbịa ahụ ma ịdị nso ya ugbu a.
theological_decisions:
- issue: Otu e si sụgharị παραδίδωμι n'akụkọ ahụhụ Jizọs
  choice: na-arara m nye
  alternative: na-enyefe m
  rationale: Ebe onye a bụ Judas, “ịrara nye” na-egosipụta ihe omume na mmebi ntụkwasị obi dị n'akụkọ ahụ. Ma n'ihi na παραδίδωμι nwekwara echiche sara mbara nke ‘inyefe,’ e tinyere nke ahụ n'ala peeji ka e ghara ikpuchi nghọta okwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe dị mfe, nke ugwu dịkwa na ya, dee amaokwu ahụ. “Bilienụ” na-egosi na a na-agwa ọtụtụ mmadụ okwu; “ka anyị gawa” bụ òkù metụtara Jizọs na ndị na-eso ụzọ ya.
