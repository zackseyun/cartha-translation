  text: ἦσαν δέ τινες ἀγανακτοῦντες πρὸς ⸀ἑαυτούς· Εἰς τί ἡ ἀπώλεια αὕτη τοῦ μύρου γέγονεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/004.yaml
  text: 'But some were indignant among themselves: “Why has this waste of the perfume happened?”[a][b]'
translation:
  language: ig
  text: Ma ụfọdụ nọ na-ewe iwe n’etiti onwe ha, sị, “Gịnị mere e ji laa mmanụ ọma a n’iyi?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-agwa ibe ha,” ma ọ bụ “n’ime onwe ha.” Ahịrịokwu Grik ahụ nwere ike ịpụta mkpesa ha na-eme n’etiti otu ahụ ma ọ bụ iwe ha na-ewe n’ime obi ha.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “mmanụ ọma” dịka “ude ọma.” Okwu Grik bụ μύρον na-ezo aka na mmanụ ma ọ bụ ude nwere isi ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Ma ... nọ
  rationale: “Ma” na-egosi njikọ na obere ọdịiche dị n’etiti ihe nwanyị ahụ mere na mmeghachi omume ndị a; “nọ” na-enyere aka igosipụta ọnọdụ na-aga n’ihu.
- source_word: τινες
  choice: ụfọdụ
  rationale: Ọ na-edobe ndị ahụ n’amaghị aha ma ọ bụ ọnụ ọgụgụ kpọmkwem, dịka okwu Grik ahụ si dị.
- source_word: ἀγανακτοῦντες
  choice: na-ewe iwe
  rationale: Nke a bụ okwu Igbo nkịtị ma siri ike nke na-egosi oké iwe na enweghị afọ ojuju; n’ọnọdụ a, okwu ndị ha kwuru na-egosikwa na ha lere ihe ahụ anya dị ka ihe na-ezighị ezi.
- source_word: πρὸς ἑαυτούς
  choice: n’etiti onwe ha
  rationale: Ọ dabara n’ọnọdụ ha na-eme mkpesa dịka otu ìgwè, ma ahịrịokwu Grik ahụ nwekwara ike ịpụta na ha na-agwa ibe ha okwu ma ọ bụ na-ewe iwe n’ime onwe ha.
- source_word: Εἰς τί
  choice: Gịnị mere
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi jụọ ajụjụ gbasara ihe kpatara ma ọ bụ nzube nke ihe mere.
- source_word: ἡ ἀπώλεια αὕτη
  choice: e ji ... a n’iyi
  rationale: Akpaalaokwu “ilaa ihe n’iyi” na-egosipụta echiche ndị na-ekwu okwu na ihe ahụ bụ imefusị ihe bara uru, ọ bụghị na onye na-akọ akụkọ kwadoro ikpe ha.
- source_word: τοῦ μύρου
  choice: mmanụ ọma
  rationale: Ọ na-ezo aka na mmanụ ma ọ bụ ude nwere isi ọma; “mmanụ ọma” bụ okwu doro anya ma dị mfe nghọta n’Igbo.
- source_word: γέγονεν
  choice: e ji laa ... n’iyi
  rationale: Nhazi a na-asụgharị ajụjụ Grik ahụ n’ụzọ Igbo sitere n’okike, na-egosikwa omume emechara nke nsonaazụ ya ka dị ugbu a.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Akpaalaokwu “ilaa ... n’iyi” na-eme ka mkpesa ahụ daa nke ọma n’Igbo, ebe “mmanụ ọma” na-ezere okwu teknụzụ ma na-edobe ụdị ihe μύρον bụ.
