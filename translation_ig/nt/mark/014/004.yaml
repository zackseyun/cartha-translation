  source_fidelity: 'The draft accurately represents all major elements of the Greek: the indefinite “some,” their indignation, the group-directed/reflexive nuance of πρὸς ἑαυτούς, and their rhetorical question concerning the perceived waste of the perfumed oil. “E ji laa ... n’iyi” naturally conveys ἡ ἀπώλεια ... γέγονεν without endorsing the speakers’ judgment.'
  naturalness: The Standard Igbo is clear, idiomatic, and appropriately narrative in register. “Nọ na-ewe iwe” conveys continuing indignation, and “Gịnị mere e ji laa ... n’iyi?” is a natural Igbo formulation of the complaint.
  terminology: “Mmanụ ọma” is an understandable rendering of μύρον in context, and footnote b appropriately supplies “ude ọma” and clarifies the referent as scented oil or ointment. The footnote on “n’etiti onwe ha” responsibly retains the Greek phrase’s possible mutual or inward sense.
