  to: Mgbe ahụ, nnukwu onye nchụàjà dọwara uwe ya[a] wee sị[b], “Olee mkpa ọzọ anyị nwere maka ndị akaebe?”
  rationale: The question has been revised to retain the Greek interrogative focus on the remaining need for witnesses, without adding a causal “why.” The action, titles, narrative tense treatment, and lexical alternatives remain faithful and natural.
