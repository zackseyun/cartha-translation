  text: ὁ δὲ ἀρχιερεὺς διαρρήξας τοὺς χιτῶνας αὐτοῦ λέγει· Τί ἔτι χρείαν ἔχομεν μαρτύρων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/063.yaml
  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: ig
  text: Mgbe ahụ, nnukwu onye nchụàjà dọwara uwe ya[a] wee sị[b], “Olee mkpa ọzọ anyị nwere maka ndị akaebe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “uwe mwụda ya”; Grik ji ụdị ọtụtụ nke nwere ike ịpụta “uwe ime ya.”
    reason: lexical_alternative
  - marker: b
    text: 'Grik ji oge ugbu a n’akụkọ a: “na-asị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: nnukwu onye nchụàjà
  rationale: Nke a bụ aha Igbo a na-ejikarị akọwa onye nọ n’ọkwa kachasị elu n’etiti ndị nchụàjà, ọ dabara kwa n’otu onye na-edu ikpe a.
- source_word: διαρρήξας
  choice: dọwara
  rationale: Ọ na-egosi omume ịdọwa uwe n’ezie; okwu a bụ Igbo doro anya ma dịkwa ugbu a.
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: uwe ya
  rationale: χίτων nwere ike ịpụta uwe a na-eyi n’ime, ma n’ọnọdụ a ‘uwe ya’ bụ ntụgharị eke nke na-adịghị ekpebi na ọ bụ uwe emume. Ọ bụ ezie na Grik ji ọtụtụ, Igbo na-ejikarị ‘uwe’ dị ka aha mkpokọta.
- source_word: λέγει
  choice: wee sị
  rationale: Grik ji historical present, ma oge gara aga bụ ụzọ Igbo si akọ akụkọ a n’ụzọ eke. ‘Wee’ jikọtara okwu ahụ na omume ịdọwa uwe.
- source_word: Τί ἔτι χρείαν ἔχομεν
  choice: Gịnị mere anyị ka ji chọọ … ọzọ?
  rationale: Nke a na-enye ajụjụ ahụ n’Igbo eke ma debe echiche ἔτι, ya bụ na a naghịzi ahụ mkpa maka ihe ọzọ.
- source_word: μαρτύρων
  choice: ndị akaebe
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-agba akaebe, ma debe ụdị ọtụtụ nke Grik.
theological_decisions:
- issue: Ihe ịdọwa uwe nke nnukwu onye nchụàjà pụtara
  choice: A kọwara naanị na ọ dọwara uwe ya, n’etinyeghị ihe mere o ji mee ya.
  alternative: Ịkọwa ya kpọmkwem dị ka iwe ma ọ bụ mwute n’ihi ihe o weere dị ka nkwulu.
  rationale: Amaokwu ahụ n’onwe ya kọwara omume ahụ na okwu ya, ma ọ kọwaghị ihe omume ahụ pụtara; ya mere, ntụgharị ahụ echekwala njide onwe nke ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ usoro ajụjụ ‘Gịnị mere anyị ka ji chọọ…?’ maka ịdị eke n’Igbo, ebe e debere echiche nke ndị akaebe ndị ọzọ adịghịzi mkpa.
