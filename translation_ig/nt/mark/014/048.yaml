  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: ig
  text: Jizọs zara ha, sị, “Ùnu ji mma agha na mkpara pụta ijide m dị ka a ga-asị na m bụ onye na-apụnara mmadụ ihe n’ike[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “onye ohi,” “onye ohi na-eme ihe ike,” ma ọ bụ “onye nnupụisi.” Okwu Grik λῃστής nwere ike ịpụta onye ohi ma ọ bụ onye na-apụnara mmadụ ihe n’ike, ma n’ụfọdụ ọnọdụ ọ pụkwara ịpụta onye nnupụisi; ọ bụghị naanị onye na-ezu ohi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: wee zaa ha sị
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma dị ugwu si egosipụta usoro okwu Grik ahụ nke pụtara na Jizọs zara ha ma kwuo.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: dị ka a ga-asị na m bụ onye ohi
  rationale: 'Nhọrọ a na-echekwa ajụjụ ịkatọ omume ha: ha bịara n''ike dị ka ndị na-aga ijide onye omekome dị ize ndụ.'
- source_word: λῃστὴν
  choice: onye ohi
  rationale: Nke a bụ okwu Igbo ndị mmadụ na-aghọta ngwa ngwa; ihe odide ala peeji na-echekwa echiche sara mbara nke onye na-apụnara mmadụ ihe n'ike ma ọ bụ onye nnupụisi.
- source_word: ἐξήλθατε
  choice: ùnụ ... pụta
  rationale: Ọ na-egosi na ìgwè ahụ pụrụ bịa n'ebe Jizọs nọ iji jide ya.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: jiri mma agha na mkpara
  rationale: “Mma agha” na “mkpara” na-egosi ngwa ọgụ ígwè na osisi ndị ha ji bịa.
- source_word: συλλαβεῖν με
  choice: ijide m
  rationale: “Ijide” dabara n'omume ijide mmadụ n'okpuru ikike, ma ọ naghị ebubata nkọwa iwu karịrị nke Grik kwuru.
theological_decisions:
- issue: Ihe λῃστής pụtara n'ajụjụ Jizọs
  choice: onye ohi n'ahịrịokwu, tinyere nkọwa sara mbara n'ala peeji
  alternative: onye na-apụnara mmadụ ihe n'ike; onye na-emebi iwu; onye nnupụisi
  rationale: Okwu Grik ahụ nwere ike ịpụta onye ohi na-eme ihe ike ma ọ bụ onye nnupụisi, ọ bụghị naanị onye na-ezu ohi. Isi ederede na-anọgide doo anya, ebe nkọwa ala peeji na-echekwa obosara na mgbagwoju anya nke okwu ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. A họọrọ “wee zaa ha sị” maka usoro akụkọ e ji ama Igbo, ebe ajụjụ nwere akara ụda olu “Ùnu” iji mee ka ọ pụta ìhè na ọ bụ ajụjụ.
