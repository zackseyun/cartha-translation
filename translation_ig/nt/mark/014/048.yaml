- from: Jizọs wee zaa ha sị, “Ùnu ejiwo mma agha na mkpara pụta ijide m, dị ka a ga-asị na m bụ onye ohi[a]?”
  to: Jizọs zara ha, sị, “Ùnu ji mma agha na mkpara pụta ijide m dị ka a ga-asị na m bụ onye na-apụnara mmadụ ihe n’ike[a]?”
  rationale: The revision preserves the Greek rhetorical construction and all its principal elements while making λῃστής more precise in modern Standard Igbo. The footnote retains the wider, historically possible insurgent sense without presenting it as the only meaning.
