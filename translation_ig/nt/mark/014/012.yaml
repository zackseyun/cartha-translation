    reason: lexical_alternative
  revision_rationale: 'E degharịrị naanị akụkụ abụọ dị mkpa: e ji ‘ha’ mee ka ngwaa Grik ahụ, ἔθυον, nọgide bụrụ nke mmadụ ọtụtụ na-arụ; e wepụrụ ‘ihe,’ nke a gbakwunyere n’enweghị ihe kwekọrọ na ya n’asụsụ mbụ. Ihe ndị ọzọ na-echekwa ọdịiche sitere n’ọnọdụ okwu n’etiti àjà Ngabiga na nri Ngabiga.'
