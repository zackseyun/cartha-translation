review_pass:
  verdict: revise
  source_fidelity: The draft correctly distinguishes the first πάσχα, governed by ‘sacrifice,’ as the Passover lamb/victim and the second, governed by ‘eat,’ as the Passover meal. However, its passive/generic wording ‘mgbe a na-achụ’ does not retain the active plural force of ἔθυον (‘when they were sacrificing’).
  naturalness: The verse is generally clear and uses modern Standard Igbo. Removing the added indefinite object ‘ihe’ after ‘kwadebe’ better preserves the Greek’s ellipsis and produces a smoother question.
  terminology: ‘Achịcha Na-ekoghị Eko,’ ‘nwa atụrụ Ngabiga,’ and ‘nri Ngabiga’ are understandable and contextually appropriate. The footnote appropriately records the less explicit alternative.
  issues:
  - severity: medium
    issue: ‘mgbe a na-achụ nwa atụrụ Ngabiga n’àjà’ uses an impersonal/passive construction.
    rationale: The Greek imperfect ἔθυον is active plural. ‘mgbe ha na-achụ ... n’àjà’ preserves the stated participants without altering the temporal aspect.
  - severity: low
    issue: ‘kwadebe ihe’ supplies an indefinite object absent from the Greek.
    rationale: The object of ‘prepare’ is implicit in the context. Omitting ‘ihe’ avoids an unnecessary addition while retaining natural Igbo.
  revised_text: N’ụbọchị mbụ nke Achịcha Na-ekoghị Eko, mgbe ha na-achụ nwa atụrụ Ngabiga n’àjà,[a] ndị na-eso ụzọ ya jụrụ ya, “Olee ebe ị chọrọ ka anyị gaa kwadebe, ka i wee rie nri Ngabiga?”
  revised_footnotes:
