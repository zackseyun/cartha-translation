  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: ig
  text: N’ụbọchị mbụ nke Achịcha Na-ekoghị Eko, mgbe ha na-achụ nwa atụrụ Ngabiga n’àjà,[a] ndị na-eso ụzọ ya jụrụ ya, “Olee ebe ị chọrọ ka anyị gaa kwadebe, ka i wee rie nri Ngabiga?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ha na-achụ Ngabiga n’àjà.” Grik kwuru “Ngabiga,” nke n’ebe a yiri ka ọ na-ezo aka n’anụ àjà Ngabiga.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: N’ụbọchị mbụ nke Achịcha Na-ekoghị Eko
  rationale: A sụgharịrị genitive ahụ n’ụzọ Igbo dị ire, ma jiri aha ememme ahụ mee ihe n’enweghị ịgbakwunye okwu ‘Ememme,’ nke na-adịghị kpọmkwem na Grik.
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: mgbe a na-achụ nwa atụrụ Ngabiga n’àjà
  rationale: Ụdị imperfect ἔθυον na-egosi ihe a na-eme n’oge ahụ; n’ihi na θύω pụtara ịchụ àjà, πάσχα ebe a na-ezo aka n’anụ àjà Ngabiga, ya bụ nwa atụrụ.
- source_word: λέγουσιν
  choice: jụrụ ya
  rationale: Ọ bụ historical present n’akụkọ Grik; oge gara aga ka e ji mee ka akụkọ ahụ bụrụ Igbo eke. N’ihi na okwu so ya bụ ajụjụ, ‘jụrụ ya’ dabara karịa ‘gwara ya.’
- source_word: Ποῦ θέλεις
  choice: Olee ebe ị chọrọ
  rationale: θέλω ebe a na-egosi ọchịchọ ma ọ bụ nzube; ‘ị chọrọ’ bụ okwu Igbo nkịtị ma doo anya.
- source_word: ἀπελθόντες ἑτοιμάσωμεν
  choice: ka anyị gaa kwadebe ihe
  rationale: A tinyere participle ἀπελθόντες n’usoro omume Igbo eke, ‘gaa kwadebe,’ ma ‘ihe’ na-eme ka ἑτοιμάσωμεν ghara ịdị kpọrọ nkụ n’Igbo.
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: ka i wee rie nri Ngabiga
  rationale: ‘Ka i wee’ na-egosipụta nzube ἵνα. N’ebe a, πάσχα bụ nri ememme a na-eri, ọ bụghị omume ịchụ àjà, ya mere e mere ka nke ahụ doo anya.
theological_decisions:
- issue: Ihe πάσχα abụọ dị n’amaokwu a na-ezo aka na ya
  choice: Nke mbụ bụ ‘nwa atụrụ Ngabiga’ n’okwu banyere ịchụ àjà; nke abụọ bụ ‘nri Ngabiga’ n’okwu banyere iri ihe.
  alternative: Ịsụgharị ha abụọ naanị dị ka ‘Ngabiga,’ ma ọ bụ ha abụọ dị ka ‘nwa atụrụ Ngabiga.’
  rationale: 'Ngwaa dị n’akụkụ nke ọ bụla na-achịkwa nghọta ya: θύω na-ezo aka n’anụ a na-achụ n’àjà, ebe φάγῃς na-ezo aka n’ihe a na-eri. Nke a na-echekwa ọdịiche dị na ọnọdụ okwu ahụ n’enweghị itinye nkọwa ụka pụrụ iche.'
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘Achịcha Na-ekoghị Eko’ mee aha ememme ahụ, jiri ‘nwa atụrụ Ngabiga’ na ‘nri Ngabiga’ kewaa nghọta abụọ nke πάσχα dịka ọnọdụ okwu si dị.
