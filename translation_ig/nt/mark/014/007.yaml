revisions:
- from: N’ihi na ndị ogbenye na-anọnyere unu mgbe niile, mgbe ọ bụla unu chọrọ, unu pụrụ imere ha ihe ọma[a]; ma mụ onwe m anaghị anọnyere unu mgbe niile.
  to: N’ihi na ndị ogbenye nọnyere unu mgbe niile, mgbe ọ bụla unu chọrọ, unu pụrụ imere ha ihe ọma[a]; ma ọ bụghị mgbe niile ka m nọnyere unu.
  rationale: The revision retains the source's temporal contrast and its affirmation that beneficial action toward poor people remains possible. It replaces the final negative progressive wording with an idiomatic parallel expression of Jesus' non-continuing presence, avoiding a subtle shift in agency while preserving the verse's meaning.
  reviewer_model: gpt-5.6-terra
