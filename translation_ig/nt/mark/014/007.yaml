id: MRK.14.7
reference: Mark 14:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: ig
  text: N’ihi na ndị ogbenye nọnyere unu mgbe niile, mgbe ọ bụla unu chọrọ, unu pụrụ imere ha ihe ọma[a]; ma ọ bụghị mgbe niile ka m nọnyere unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu pụrụ inyere ha aka.” Okwu Grik a pụtara ime ihe ga-abara ha uru, ọ bụghị naanị inwe ezi ọchịchọ n’ebe ha nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Ọ bụ ụzọ Igbo nkịtị si egosi ịdị ma ọ bụ ohere na-aga n’ihu; e jikwa ya ugboro abụọ chekwaa ntụnyere dị n’amaokwu ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta okwu a na nke bu ya ụzọ dịka nkọwa ma ọ bụ ihe kpatara ya, n’enweghị ịgbatị ihe ederede pụtara.
- source_word: τοὺς πτωχούς
  choice: ndị ogbenye
  rationale: Ọ na-ezo aka n’ìgwè mmadụ dara ogbenye; nke a bụ okwu Igbo doro anya ma kwụ ọtọ.
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: na-anọnyere unu
  rationale: N’ọnọdụ a, akpaalaokwu ahụ na-egosi na ha nọ nso ma dị mgbe niile; nsụgharị a bụ nke e kere eke n’Igbo karịa ịsụgharị ‘nwere’ n’ụzọ siri ike.
- source_word: ὅταν θέλητε
  choice: mgbe ọ bụla unu chọrọ
  rationale: Ọ na-echekwa oge na-enweghị njedebe nke ὅταν tinyere subjunctive, ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: δύνασθε
  choice: unu pụrụ
  rationale: Ọ na-egosi ikike ma ọ bụ ohere ime ihe, n’ụzọ dị mkpirikpi ma dị ebube n’Igbo.
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: imere ha ihe ọma
  rationale: Ọ na-echekwa echiche nke ime ihe ga-abara ha uru, n’emeghị ka ọ bụrụ naanị inye ego ma ọ bụ otu ụdị enyemaka.
- source_word: ἐμὲ δὲ
  choice: ma mụ onwe m
  rationale: ‘Ma’ na-egosi ọdịiche ahụ, ebe ‘mụ onwe m’ na-eme ka onye a na-atụnyere ndị ogbenye pụta ìhè.
- source_word: οὐ πάντοτε ἔχετε
  choice: anaghị anọnyere unu mgbe niile
  rationale: Ọ na-echekwa oge ugbu a na ọdịiche nke πάντοτε, kama ịgbanwe ya ka ọ bụrụ naanị amụma gbasara ọdịnihu.
theological_decisions:
- issue: Enwere ike ịghọta okwu a dịka Jizọs na-eleda ilekọta ndị ogbenye anya
  choice: E chekwara ntụnyere dị n’etiti ndị ogbenye na-anọnyere ha mgbe niile na Jizọs na-agaghị anọnyere ha mgbe niile n’anụ ahụ, ebe ohere imere ndị ogbenye ihe ọma ka kwadoro.
  alternative: Ịsụgharị ya dịka Jizọs na-ajụ ma ọ bụ na-eleda ọrụ ebere nye ndị ogbenye anya.
  rationale: Nkebi ‘mgbe ọ bụla unu chọrọ, unu pụrụ imere ha ihe ọma’ na-akwado ohere na-aga n’ihu nke imere ndị ogbenye ihe ga-abara ha uru. A hapụrụ esemokwu nke ederede n’enweghị itinye ozizi ọzọ na ya.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘na-anọnyere unu’ mee ka echiche nke ọnụnọ na ohere dị n’ἔχετε μεθ’ ἑαυτῶν doo anya n’Igbo; e chekwara otu ‘mgbe niile’ n’akụkụ abụọ iji gosipụta ntụnyere ederede ahụ.
