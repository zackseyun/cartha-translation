review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the causal connector, the continuing presence of the poor, the open-ended temporal clause, and the opportunity to benefit them. However, the final clause changes the Greek's possession/presence contrast ('you do not always have me') into an assertion about Jesus' action or state ('I am not staying with you'). A more idiomatic Igbo construction can retain the intended contrast in availability without this shift.
  naturalness: The wording is generally clear Standard Igbo. Using 'nọnyere unu' in both sides of the contrast is natural and makes the parallelism more evident. 'Ọ bụghị mgbe niile ka m nọnyere unu' is smoother than the negative progressive construction and avoids implying that Jesus is voluntarily ceasing to stay with them.
  terminology: '''Ndị ogbenye'' and ''imere ha ihe ọma'' are suitable, modern, and appropriately broad renderings. The footnote is retained with a clearer explanation that the Greek expression concerns beneficial action, rather than mere benevolent feeling.'
  issues:
  - severity: medium
    issue: The final clause 'mụ onwe m anaghị anọnyere unu mgbe niile' recasts 'you do not always have me' as 'I am not always staying with you.'
    rationale: Although the contextual meaning concerns Jesus' limited presence, the Greek maintains the disciples as the subject of ἔχετε ('you have'). The revision preserves the availability/presence contrast without adding an active nuance to Jesus' departure or conduct.
  revised_text: N’ihi na ndị ogbenye nọnyere unu mgbe niile, mgbe ọ bụla unu chọrọ, unu pụrụ imere ha ihe ọma[a]; ma ọ bụghị mgbe niile ka m nọnyere unu.
  revised_footnotes:
