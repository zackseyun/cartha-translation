    reason: lexical_alternative
  revision_rationale: The revision retains the source's temporal contrast and its affirmation that beneficial action toward poor people remains possible. It replaces the final negative progressive wording with an idiomatic parallel expression of Jesus' non-continuing presence, avoiding a subtle shift in agency while preserving the verse's meaning.
