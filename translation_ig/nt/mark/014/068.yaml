  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: ig
  text: Ma ọ gọnahụrụ ya, sị, “Amaghị m, aghọtaghịkwa m ihe ị na-ekwu.” Ọ wee pụọ gaa n’ebe mbata ogige ahụ, otu oke ọkụkọ wee kwaa akwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ ihe odide aka ochie enweghị: “otu oke ọkụkọ wee kwaa akwa.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: ọ gọnahụrụ ya
  rationale: Ngwaa a pụtara ịgọnahụ ma ọ bụ ịjụ nkwupụta e kwuru. ‘Ya’ na-ezo aka n’ihe e boro Pita, ọ bụghị ịkọwa hoo haa na ọ gọnahụrụ Jizọs, ebe aha Jizọs adịghị n’ahịrịokwu a.
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: Amaghị m, aghọtaghịkwa m
  rationale: 'Nke a na-edobe ngwaa abụọ ahụ na nkwusi ike ha: οἶδα bụ ‘ịma,’ ebe ἐπίσταμαι n’ebe a nwere echiche nke ‘ịghọta.’'
- source_word: σὺ τί λέγεις
  choice: ihe ị na-ekwu
  rationale: Nke a bụ ntụgharị kwụ ọtọ ma dịkwa mfe nghọta nke okwu Grik ahụ, ma na-edobe njikọ ya na ngwaa ‘sị.’
- source_word: ἐξῆλθεν ἔξω
  choice: ọ wee pụọ
  rationale: N’asụsụ Igbo, ‘pụọ’ na-egosi nke ọma mmegharị ịga n’èzí; ịgbakwunye okwu ọzọ maka ‘n’èzí’ ga-abụ ikwughachi otu echiche.
- source_word: προαύλιον
  choice: ọnụ ụzọ ogige ahụ
  rationale: Okwu a na-ezo aka n’ebe mbata dị n’ihu ogige ma ọ bụ ụlọ, ọ bụghị naanị ogige ime ahụ. Nhọrọ a na-egosi ọnọdụ ahụ n’Igbo a na-aghọta ngwa ngwa.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: otu oke ọkụkọ wee kwaa akwa
  rationale: Nke a bụ ụzọ Igbo si ekwu mkpu oke ọkụkọ n’ụzọ ebumpụta ụwa; ‘otu’ kwekọrọ na aha Grik nke na-enweghị akara ngosi kpọmkwem.
theological_decisions:
- issue: Itinye nkebiokwu καὶ ἀλέκτωρ ἐφώνησεν
  choice: E tinyere ya n’ahịrịokwu bụ isi dị ka ‘otu oke ọkụkọ wee kwaa akwa.’
  alternative: Ịhapụ nkebiokwu ahụ n’ihi na ọ dịghị n’ụfọdụ ihe odide aka ochie.
  rationale: SBLGNT e nyere tinyere nkebiokwu ahụ ma gosipụta na e nwere esemokwu n’ihe odide. Ya mere, e tinyere ya n’ihe odide bụ isi, ma kọwaa ọdịiche ahụ n’okpuru peeji.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere nkwusi ike nke ngwaa abụọ Pita ji gọnahụ ihe a kwuru, ma zere ịkọwa karịa ihe Grik kwuru kpọmkwem.
