  to: Ma ọ gọnahụrụ ya, sị, “Amaghị m, aghọtaghịkwa m ihe ị na-ekwu.” Ọ wee pụọ gaa n’ebe mbata ogige ahụ, otu oke ọkụkọ wee kwaa akwa.[a]
  rationale: A small lexical correction replaces “ọnụ ụzọ ogige ahụ” (“the door/gate of the courtyard”) with “ebe mbata ogige ahụ” (“the entrance area/forecourt of the courtyard”), which better represents προαύλιον. The wording otherwise preserves the source’s rhetorical double denial and retains the bracketed textual variant without interpreting it beyond the evidence.
