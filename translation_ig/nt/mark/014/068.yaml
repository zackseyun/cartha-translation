  naturalness: The draft is clear Standard Igbo. “Ebe mbata ogige ahụ” more naturally identifies an entrance/forecourt area without reducing it to a literal door.
  terminology: “gọnahụrụ ya,” “Amaghị m, aghọtaghịkwa m,” and “oke ọkụkọ ... kwaa akwa” are suitable. The revision refines only the spatial term for προαύλιον.
