revisions:
- from: Ebe ọ bụla nwoke ahụ banyere, gwa onye nwe ụlọ ahụ, sị, ‘Onye Ozizi kwuru, “Olee ebe ọnụ ụlọ ọbịa m[a] dị, ebe mụ na ndị na-eso ụzọ m ga-anọ rie nri Ngabiga?”’
  to: Ebe ọ bụla nwoke ahụ banyere, gwa onye nwe ụlọ ahụ, sị, ‘Onye Ozizi kwuru, “Olee ebe ọnụ ụlọ ọbịa m[a] dị ka mụ na ndị na-eso ụzọ m rie nri Ngabiga n’ime ya?”’
  rationale: The revision removes ‘anọ’ (‘stay’) to avoid adding meaning not present in φάγω. The purpose construction ‘ka ... rie ... n’ime ya’ naturally identifies the guest room as the place where Jesus and his disciples are to eat the Passover, while retaining the Greek’s contemplated-action nuance.
  reviewer_model: gpt-5.6-terra
