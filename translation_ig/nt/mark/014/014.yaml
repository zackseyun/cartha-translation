review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the indefinite location, the householder, Jesus’ title, the possessive ‘my,’ and the Passover meal with his disciples. However, ‘ga-anọ rie’ adds the idea of staying, which is not expressed by φάγω (‘eat’). The Greek presents the room as the place in which Jesus expects/intends to eat, not explicitly a place where he will stay.
  naturalness: The wording is generally clear Standard Igbo. Recasting the final relative clause with ‘ka ... rie ... n’ime ya’ is more idiomatic and directly expresses the intended use of the guest room without adding ‘stay.’
  terminology: ‘Onye Ozizi,’ ‘ọnụ ụlọ ọbịa,’ ‘nri Ngabiga,’ and ‘ndị na-eso ụzọ’ are suitable, modern Standard Igbo renderings. The footnote appropriately distinguishes the room from a commercial inn; ‘ụlọ nkwari ndị njem’ is a clearer contemporary expression than ‘ụlọ ndị njem.’
  issues:
  - severity: medium
    issue: ‘ga-anọ rie’ introduces an additional action.
    rationale: ἀνά? The source has only φάγω, ‘I may eat/I eat’; it does not say that Jesus will stay there. The added ‘anọ’ should be removed.
  revised_text: Ebe ọ bụla nwoke ahụ banyere, gwa onye nwe ụlọ ahụ, sị, ‘Onye Ozizi kwuru, “Olee ebe ọnụ ụlọ ọbịa m[a] dị ka mụ na ndị na-eso ụzọ m rie nri Ngabiga n’ime ya?”’
