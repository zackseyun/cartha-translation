id: MRK.14.14
reference: Mark 14:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: ig
  text: Ebe ọ bụla nwoke ahụ banyere, gwa onye nwe ụlọ ahụ, sị, ‘Onye Ozizi kwuru, “Olee ebe ọnụ ụlọ ọbịa m[a] dị ka mụ na ndị na-eso ụzọ m rie nri Ngabiga n’ime ya?”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ebe obibi m” ma ọ bụ “ọnụ ụlọ m.” Okwu Grik a na-ezo aka n’ebe mmadụ ga-anọ; n’ebe a, o yikarịrị ka ọ bụ ọnụ ụlọ ọbịa n’ụlọ mmadụ, ọ bụghị ụlọ nkwari ndị njem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: Ebe ọ bụla nwoke ahụ banyere
  rationale: ὅπου + ἐάν na aorist subjunctive na-egosi ebe a na-akọwaghị kpọmkwem. ‘Nwoke ahụ’ na-eme ka onye nnọchiaha ahụ doo anya n’Igbo, ebe ọ na-ezo aka n’ nwoke bu ite mmiri n’amaokwu bu ụzọ.
- source_word: εἴπατε
  choice: gwa
  rationale: Ọ bụ iwu e nyere ọtụtụ ndị; ‘gwa’ dabara n’ụzọ Igbo si webata okwu a ga-agwa mmadụ ozugbo.
- source_word: οἰκοδεσπότῃ
  choice: onye nwe ụlọ ahụ
  rationale: Nke a na-egosi onye na-achị ma ọ bụ onye nwe ezinụlọ ahụ n’asụsụ Igbo dị mfe ma bụrụkwa nke mmadụ niile na-aghọta.
- source_word: Ὁ διδάσκαλος
  choice: Onye Ozizi
  rationale: Nke a na-echekwa ihe okwu Grik pụtara dị ka aha e ji amata Jizọs n’akụkọ a, n’etinyeghị echiche ọchịchị siri ike karịa okwu ahụ.
- source_word: κατάλυμά μου
  choice: ọnụ ụlọ ọbịa m
  rationale: κατάλυμα n’ebe a yiri ka ọ bụ ọnụ ụlọ e ji anabata ọbịa n’ụlọ mmadụ, ọ bụghị ụlọ ndị njem. ‘M’ na-echekwa μου dị na ederede Grik.
- source_word: τὸ πάσχα
  choice: nri Ngabiga
  rationale: Ebe ọ bụ na φάγω pụtara iri, ‘nri Ngabiga’ na-eme ka ihe a na-eri doo anya n’Igbo n’enweghị mgbagwoju anya banyere ememme ahụ dum.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: mụ na ndị na-eso ụzọ m
  rationale: ‘Ndị na-eso ụzọ’ bụ okwu Igbo a na-ahụkarị maka μαθηταί ma na-echekwa mmekọrịta ha na onye ozizi ha.
- source_word: φάγω
  choice: ga-anọ rie
  rationale: Subjunctive ahụ nọ n’ahịrịokwu na-akọwa ebe a chọrọ maka ihe e bu n’obi ime. ‘Ga-anọ rie’ na-egosipụta nzube ahụ n’Igbo eke, na-emeghị ya ka ọ bụrụ nanị nkwupụta ọdịnihu.
theological_decisions:
- issue: Nsụgharị aha Jizọs ji kpọọ onwe ya, διδάσκαλος
  choice: Onye Ozizi
  alternative: Nna Ukwu
  rationale: ‘Onye Ozizi’ bụ isi ihe διδάσκαλος pụtara ma ọ naghị ebubata aha ma ọ bụ ikike karịrị ihe okwu Grik kwuru.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. A haziri okwu ndị e hotara ka ọ bụrụ okwu ọnụ sitere n’akụkọ, ma debe ahịrịokwu na-akọwa ‘ọnụ ụlọ ọbịa’ n’enweghị rikoma ka njikọ ya bụrụ nke doro anya.
