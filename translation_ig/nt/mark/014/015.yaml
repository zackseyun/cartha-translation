review_pass:
  verdict: revise
  source_fidelity: A chọrọ mmezi nta. -kwa dị na “ga-egosikwa” na-agbakwunye echiche ‘kwa/also’ nke na-adịghị na Grik. Ọzọkwa, “n’elu ụlọ” nwere ike ịpụta n’elu akwa ụlọ (roof), ebe ἀνάγαιον bụ ọnụ ụlọ nke dị n’elu ụlọ ahụ. Iwu ọtụtụ mmadụ kwesịrị igosi ọtụtụ mmadụ n’Igbo.
  naturalness: “Ọnụ ụlọ elu” bụ okwu Igbo doro anya ma bụrụ nke ebumpụta ụwa maka upper room. “Kwadebenụ ihe maka anyị n’ebe ahụ” na-eme ka iwu ahụ doo anya n’Igbo, na-enweghị ikpebi ihe a ga-akwadebe karịa ihe ọnọdụ akụkọ ahụ na-egosi.
  terminology: “Ya onwe ya,” “nnukwu,” “a haziri,” na “dị njikere” na-edobe nkwusiri ike na nkọwa Grik. E ji “ihe” mee mmeju okwu nke Igbo chọrọ n’iwu “kwadebe,” ma ọ dịghị akọwapụta ya dịka emume ngafe ma ọ bụ nri.
  issues:
  - severity: medium
    issue: “ga-egosikwa”
    rationale: Mgbakwunye -kwa na-ekwu ‘ga-egosikwa/also will show,’ ma αὐτὸς δείξει enweghị ‘kwa’ ma ọ bụ ‘also.’ Ekwesịrị iji “ga-egosi.”
  - severity: medium
    issue: “ọnụ ụlọ dị n’elu ụlọ”
    rationale: N’Igbo, “n’elu ụlọ” nwere ike ịghọta dịka n’elu roof. “Ọnụ ụlọ elu” na-egosi nke ọma ọnụ ụlọ dị n’akụkụ elu nke ụlọ, nke kwekọrọ na ἀνάγαιον.
  - severity: low
    issue: Ọtụtụ mmadụ n’iwu ahụ anaghị apụta ìhè
    rationale: ἑτοιμάσατε bụ iwu a gwara ọtụtụ mmadụ. “Kwadebenụ” na-egosi nke a nke ọma.
