  to: Ya onwe ya ga-egosi unu otu nnukwu ọnụ ụlọ elu[a], nke a haziri ma dị njikere; kwadebenụ ihe maka anyị n’ebe ahụ.
  rationale: E wepụrụ -kwa nke na-enweghị ihe kwekọrọ na ya n’asụsụ Grik; e jiri “ọnụ ụlọ elu” zere nghọta na ọ bụ n’elu roof; e jiri “kwadebenụ” gosipụta iwu ọtụtụ mmadụ. E debeere ἐστρωμένον echiche sara mbara ya n’ederede na n’ala-akọwa.
