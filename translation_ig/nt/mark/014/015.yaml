  text: καὶ αὐτὸς ὑμῖν δείξει ἀνάγαιον μέγα ἐστρωμένον ἕτοιμον· ⸀καὶ ἐκεῖ ἑτοιμάσατε ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/015.yaml
  text: And he himself will show you a large upper room[a], furnished and ready; prepare for us there.
translation:
  language: ig
  text: Ya onwe ya ga-egosi unu otu nnukwu ọnụ ụlọ elu[a], nke a haziri ma dị njikere; kwadebenụ ihe maka anyị n’ebe ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu nnukwu ọnụ ụlọ dị n’elu, nke a dọbere ma dị njikere.” Okwu Grik ἐστρωμένον nwere ike ịpụta na a haziri ma ọ bụ a dọbere ọnụ ụlọ ahụ, ọ bụghị naanị na e tinyere arịa ụlọ n’ime ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: ya onwe ya
  rationale: Na-echekwa nkwusiri ike dị na nnọchiaha Grik ahụ, kama ịsụgharị naanị ‘ọ’.
- source_word: δείξει
  choice: ga-egosi unu
  rationale: Oge ọdịnihu nke δείκνυμι pụtara n'ụzọ nkịtị ‘ga-egosi’; ‘unu’ na-anọchi ὑμῖν.
- source_word: ἀνάγαιον
  choice: ọnụ ụlọ dị n’elu ụlọ
  rationale: Na-akọwa ọnụ ụlọ dị n’akụkụ elu nke ụlọ n’Igbo doro anya ma bụrụ nke ndị mmadụ na-aghọta ngwa ngwa.
- source_word: μέγα
  choice: nnukwu
  rationale: Ọ bụ okwu Igbo kwụ ọtọ maka ‘large,’ n’enweghị ịgbakwunye echiche na ọ sara mbara nke ukwuu.
- source_word: ἐστρωμένον
  choice: nke a haziri
  rationale: Na-ejigide echiche nke ihe a gbasara ma ọ bụ a haziri n’ime ọnụ ụlọ ahụ, n’ebughị ụzọ kpebie na ọ bụ naanị arịa ụlọ ka okwu ahụ na-ekwu.
- source_word: ἕτοιμον
  choice: dị njikere
  rationale: Na-egosipụta ọnọdụ ịdị njikere ma zere ikwughachi otu ngwaa e ji sụgharị ἑτοιμάσατε.
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: Ọ bụ ntụgharị Igbo ebumpụta ụwa nke adverb ebe ahụ.
- source_word: ἑτοιμάσατε
  choice: kwadebeere
  rationale: Iwu a gwara ọtụtụ mmadụ ka ha mee nkwadebe; mmeju ‘ihe’ na-eme ka okwu ahụ bụrụ Igbo zuru oke n’emebighị ihe a hapụrụ ka ọnọdụ akụkọ kọwaa.
- source_word: ἡμῖν
  choice: anyị
  rationale: Na-edobe nnọchiaha ahụ dịka ‘anyị’ n’akọwaghị ndị niile ọ na-ezo aka na ha.
