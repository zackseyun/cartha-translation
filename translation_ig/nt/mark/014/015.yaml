translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ echiche sara mbara nke ἐστρωμένον ka ọ ghara ịbụ naanị ‘e tinyere arịa ụlọ,’ ma debe nkwusiri ike nke αὐτός.
