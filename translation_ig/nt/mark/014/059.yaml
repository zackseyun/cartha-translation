  yaml_path: translation/nt/mark/014/059.yaml
  text: And not even in this way was their testimony consistent[a].
translation:
  language: ig
  text: Ọzọkwa, ọbụnadị n’ụzọ a, akaebe ha ekwekọrịtaghị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “akaebe ha adabaghị”; kpọmkwem, “akaebe ha abụghị otu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ma
  rationale: Njikọ a na-aga n’ihu n’akụkọ ahụ ma na-egosikwa ihe dị iche n’ihe mmadụ nwere ike ịtụ anya ya n’ihi amaokwu bu ya ụzọ.
- source_word: οὐδὲ
  choice: ọbụna ... ekwekọghị
  rationale: 'Nke a na-egosipụta nkwusi ike dị na ngọnarị Grik: ọbụna n’ụdị akaebe a, ha enweghị nkwekọrịta.'
- source_word: οὕτως
  choice: n’ụzọ dị otu a
  rationale: Ọ na-arụtụ aka n’ụdị ebubo na akaebe ndị a kọwara ozugbo tupu amaokwu a.
- source_word: ἴση
  choice: ekwekọghị
  rationale: Ọ bụ ezie na isi okwu a pụtara ‘ha nhata,’ n’ọnọdụ ikpe a ọ na-ekwu na akaebe ndị akaebe dị iche iche adabaghị ma ọ bụ kwekọọ.
- source_word: ἦν
  choice: ekwekọghị
  rationale: E tinyere ngwaa ‘ịdị’ nke oge gara aga n’ụdị okwu Igbo sitere n’okike, bụ́ ‘ekwekọghị.’
- source_word: ἡ μαρτυρία
  choice: akaebe
  rationale: N’ọnọdụ ikpe, okwu a na-ezo aka n’ihe ndị akaebe kwuru; ‘akaebe’ bụ okwu Igbo doro anya ma dị ugwu.
- source_word: αὐτῶν
  choice: ha
  rationale: Ọ bụ nnọchiaha nke na-egosi na akaebe ahụ bụ nke ndị ahụ kwuru ya.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dị ugwu. A họọrọ ‘ekwekọghị’ iji mee ka echiche iwu nke akaebe ndị na-adabaghị doo anya, ebe nkọwa ala peeji na-echekwa nkọwa kpọmkwem nke ἴση.
