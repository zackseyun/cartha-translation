translation_notes:
  register: E ji asụsụ Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A hapụrụ nkwughachi nke ‘ọzọ’ dị n’akwụkwọ Grik, ma tinye akara nkọwa okwu n’ebe okwu banyere ụzọ ikwu okwu na ụdị ederede dị iche iche metụtara kpọmkwem.
