  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: ig
  text: Ma ọ gọnahụrụ ya ọzọ. Mgbe obere oge gasịrị, ndị guzo nso na-agwa Pita ọzọ, sị, “N’ezie, ị bụ otu n’ime ha, n’ihi na ị bụkwa onye Galili, ụzọ i si ekwu okwu[a] dịkwa ka nke ha.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụda olu gị dịkwa ka nke ha” ma ọ bụ “usoro i si ekwu okwu dị ka nke ha.” Okwu Grik bụ λαλιά nwere ike ịpụta usoro ikwu okwu, olumba, ma ọ bụ ụda olu.
    reason: lexical_alternative
  - marker: b
    text: 'Ụfọdụ akwụkwọ aka ochie enweghị okwu ndị a: “ụzọ i si ekwu okwu dịkwa ka nke ha.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: ọ gọnahụrụ ya
  rationale: Ngwaa a dị n’ụdị imperfect, nke nwere ike igosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro. N’ebe a, ‘ọ gọnahụrụ ya ọzọ’ bụ Igbo doro anya ma jikọta omume ahụ na ngọnarị ndị bu ya ụzọ; ‘ya’ na-ezo aka n’ebubo na Pita so Jizọs.
- source_word: μετὰ μικρὸν
  choice: mgbe obere oge gasịrị
  rationale: Nke a na-egosi na obere oge gafere; nsụgharị a bụ Igbo nkịtị ma na-echekwa ihe okwu Grik ahụ pụtara banyere oge.
- source_word: οἱ παρεστῶτες
  choice: ndị guzo nso
  rationale: Nke a na-echekwa echiche participle ahụ banyere ndị guzo n’akụkụ ma ọ bụ ndị nọ ebe ahụ.
- source_word: ἔλεγον
  choice: malitekwara ịsị
  rationale: Ụdị imperfect ahụ na-egosi okwu a na-ekwu n’oge ahụ, ọ pụkwara ịpụta na ha nọ na-ekwughachi ya. ‘Malitekwara ịsị’ na-eme ka nke a bụrụ Igbo na-aga were were n’enweghị ịgbakwụnye na ha kwuru ya ọtụtụ ugboro n’ezie.
- source_word: Ἀληθῶς
  choice: N’ezie
  rationale: Okwu a na-egosi nkwenye siri ike na ihe a na-ekwu bụ eziokwu.
- source_word: ἐξ αὐτῶν εἶ
  choice: ị bụ otu n’ime ha
  rationale: Nke a bụ ụzọ Igbo doro anya isi kwuo na Pita so n’ìgwè ahụ.
- source_word: καὶ γὰρ
  choice: n’ihi na ị bụkwa
  rationale: ‘N’ihi na’ na-enye ihe mere ha ji kwuo ihe ahụ, ebe ‘-kwa’ na-echekwa echiche καί.
- source_word: Γαλιλαῖος
  choice: onye Galili
  rationale: Okwu ahụ na-akọwa onye si Galili; ‘onye Galili’ bụ ụdị okwu Igbo kwesịrị ekwesị.
- source_word: ἡ λαλιά σου
  choice: ụzọ i si ekwu okwu
  rationale: λαλιά nwere ike ịpụta usoro ikwu okwu, olumba, ma ọ bụ ụda olu. Nhọrọ a sara mbara, ya mere ọ naghị amachi ya naanị n’ụda olu.
- source_word: ὁμοιάζει
  choice: dịkwa ka nke ha
  rationale: Ngwaa ahụ pụtara ‘iyi’ ma ọ bụ ‘ịdị ka.’ ‘Nke ha’ na-eme ka ahịrịokwu ahụ bụrụ Igbo zuru oke ma na-egosi ntụnyere a ghọtara site n’ihe gbara ya gburugburu.
