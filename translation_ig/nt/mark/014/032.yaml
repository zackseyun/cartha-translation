revisions:
- from: Ha wee ruo n’otu ebe a na-akpọ Getsemeni, Jizọs wee sị ndị na-eso ụzọ ya, “Nọdụnụ ebe a ruo mgbe m kpechara ekpere.”
  to: Ha wee ruo n’otu ebe a na-akpọ Getsemeni, Jizọs wee sị ndị na-eso ụzọ ya, “Nọdụnụ ebe a ruo mgbe m kpee ekpere.”
  rationale: The revision changes only the temporal verb phrase, removing an unwarranted explicit completion while preserving a natural Standard Igbo expression and the meaning of the command.
  reviewer_model: gpt-5.6-terra
