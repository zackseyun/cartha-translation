review_pass:
  verdict: revise
  source_fidelity: The rendering accurately conveys the arrival, the place-name, the address to the disciples, the plural imperative, and the location. However, “ruo mgbe m kpechara ekpere” explicitly means “until after I have finished praying,” making completion more explicit than the Greek ἕως προσεύξωμαι requires.
  naturalness: The Igbo is clear, modern, and appropriately reverent. “Nọdụnụ ebe a ruo mgbe m kpee ekpere” is natural and retains the source’s less explicit temporal wording without the added completive sense.
  terminology: “Getsemeni,” “ndị na-eso ụzọ ya,” and “ekpere” are suitable Standard Igbo choices. Naming Jizọs to clarify the implicit Greek subject is acceptable in this narrative context.
  issues:
  - severity: medium
    issue: The phrase “m kpechara ekpere” is overly completive.
    rationale: The Greek aorist subjunctive after ἕως need not be rendered as an explicitly completed action. The draft’s “after I have finished praying” narrows the wording beyond both the Greek and the English audit trail. “m kpee ekpere” preserves the temporal clause without imposing that added nuance.
  revised_text: Ha wee ruo n’otu ebe a na-akpọ Getsemeni, Jizọs wee sị ndị na-eso ụzọ ya, “Nọdụnụ ebe a ruo mgbe m kpee ekpere.”
