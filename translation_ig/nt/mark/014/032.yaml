source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ· Καθίσατε ὧδε ἕως προσεύξωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/032.yaml
  text: And they came to a place whose name was Gethsemane[a], and he says to his disciples, “Sit here until I pray.”
translation:
  language: ig
  text: Ha wee ruo n’otu ebe a na-akpọ Getsemeni, Jizọs wee sị ndị na-eso ụzọ ya, “Nọdụnụ ebe a ruo mgbe m kpee ekpere.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: ha wee ruo
  rationale: Oge ugbu a Grik bụ historical present nke na-eme ka akụkọ dị ndụ. N’Igbo, usoro ‘wee ruo’ na-akọ ihe gara aga n’ụzọ sitere n’okwu gbara ya gburugburu ma na-eme ka akụkọ na-aga nke ọma.
- source_word: χωρίον
  choice: otu ebe
  rationale: χωρίον nwere ike ịbụ ebe, ala, ma ọ bụ ugbo; ‘otu ebe’ bụ okwu sara mbara nke na-adịghị etinye nkọwa na-adịghị n’ederede.
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: a na-akpọ Getsemeni
  rationale: Nke a bụ ụzọ Igbo sitere n’obi si kwuo na aha ebe ahụ bụ Getsemeni, ma na-edobe aha ahụ dịka aha pụrụ iche.
- source_word: λέγει
  choice: Jizọs wee sị
  rationale: Ọ bụ ezie na Grik ji historical present, ‘wee sị’ kwekọrọ n’usoro akụkọ Igbo. E tinyere ‘Jizọs’ kama nnọchiaha naanị iji mee ka onye na-ekwu doo anya n’Igbo, ebe isiokwu ahụ sitere n’akụkụ akụkọ gbara amaokwu a gburugburu.
- source_word: μαθηταῖς
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị na-amụ ihe n’aka onye nkuzi ma na-eso ya.
- source_word: Καθίσατε
  choice: Nọdụnụ
  rationale: Iwu a dị n’ọnụọgụ ọtụtụ ma bụrụ iwu kwụ ọtọ nye ndị na-eso ụzọ ahụ.
- source_word: ὧδε
  choice: ebe a
  rationale: Ọ bụ ntụaka doro anya nye ebe ha nọ.
- source_word: ἕως προσεύξωμαι
  choice: ruo mgbe m kpechara ekpere
  rationale: ἕως tinyere aorist subjunctive na-egosi oke oge ruo mgbe omume ahụ mere. Igbo ‘ruo mgbe m kpechara ekpere’ na-egosipụta njedebe ahụ n’ụzọ ebumpụta ụwa, n’agbanyeghị na ọ na-eme ka mmecha ahụ pụta ìhè karịa ntụgharị ‘ruo mgbe m kpere ekpere.’
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe, nke dị ùgwù ma dị mfe nghọta. Ejikọtara historical presents abụọ ahụ n’usoro akụkọ Igbo site na ‘wee’; a naghị achọ ndetu ala peeji n’ihi na nke a bụ mgbanwe ụtọasụsụ akụkọ, ọ bụghị ọdịiche nwere mmetụta n’ihe amaokwu ahụ pụtara.
