    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mụrụnụ anya”; iwu a nwere ike ịgụnye ma ịghara ihi ụra ma ịnọ na nche.
    reason: lexical_alternative
  revision_rationale: The revision clarifies the Greek idiom ἕως θανάτου without flattening its intensity, improves idiomatic Standard Igbo, and maintains the ambiguity of γρηγορεῖτε between literal wakefulness and vigilant watchfulness. The narrative past “Ọ sịrị ha” is natural in Igbo narrative and does not alter the event conveyed by Mark's historical present.
