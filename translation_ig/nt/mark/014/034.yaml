  text: καὶ λέγει αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/034.yaml
  text: And he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch.”
translation:
  language: ig
  text: Ọ sịrị ha, “Mwute juru mkpụrụ obi m nke ukwuu, ruo n'ókè ọnwụ.[a] Nọrọnụ ebe a ma na-echenụ nche.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ruo ọnwụ.” Okwu a na-ekwu maka mwute ruru n'ókè ọnwụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mụrụnụ anya”; iwu a nwere ike ịgụnye ma ịghara ihi ụra ma ịnọ na nche.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: O wee sị
  rationale: Igbo anaghị eji historical present eme akụkọ n'ụzọ nkịtị dịka Grik Mak; “O wee sị” na-eme ka akụkọ gaa were were ma na-egosipụta usoro ihe mere n'enweghị ịgbanwe ihe ọ pụtara.
- source_word: Περίλυπός
  choice: juputara n'oké mwute
  rationale: Nkebi a na-egosipụta mwute dị omimi nke rikpuru mmadụ, ma ọ bụ mwute dị ukwuu; ọ bụ okwu Igbo doro anya ma dịkwa ùgwù.
- source_word: ψυχή
  choice: mkpụrụ obi
  rationale: “Mkpụrụ obi” na-echekwa okwu ihe gbasara ndụ ime mmadụ ma ọ bụ mmadụ n'ozuzu ya dị na Grik, n'agbanyeghị na n'Igbo nkebi ahụ nwere ike ịpụta mmetụta dị n'ime mmadụ.
- source_word: ἕως θανάτου
  choice: ruo ọnwụ
  rationale: Nsụgharị a na-echekwa mkpirikpi okwu Grik na ike ya, gụnyere mgbagwoju anya ma ọ bụ mwute nke na-eru n'ókè ọnwụ ma ọ bụ na-aga n'ihu ruo ọnwụ.
- source_word: μείνατε
  choice: Nọrọnụ
  rationale: Ọ na-enye iwu ka ha nọrọ n'ebe ahụ; ọtụtụ-nụ na-egosipụta na a na-agwa ọtụtụ mmadụ okwu.
- source_word: ὧδε
  choice: n'ebe a
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo ebe ahụ onye na-ekwu okwu nọ.
- source_word: γρηγορεῖτε
  choice: na-echekwanụ nche
  rationale: Nkebi a na-ejikọta ịmụrụ anya na ile nche; ọ naghị ebelata iwu ahụ ka ọ bụrụ naanị ịghara ihi ụra.
theological_decisions:
- issue: Nsụgharị ψυχή n'okwu Jizọs
  choice: mkpụrụ obi
  alternative: ndụ m; ime m; onwe m
  rationale: “Mkpụrụ obi” na-echekwa ịdị omimi nke okwu Grik gbasara ahụhụ Jizọs n'ime ya, n'enweghị ịkọwa ụzọ e si kee mmadụ ma ọ bụ ịgbakwunye nkọwa ozizi na-adịghị n'amaokwu ahụ.
- issue: Ike γρηγορεῖτε
  choice: na-echekwanụ nche
  alternative: mụrụnụ anya; anọla n'ụra
  rationale: Nhọrọ a na-echekwa ma ịghara ihi ụra n'ụzọ nkịtị ma ịdị njikere na nche; ọ naghị ekpebi naanị otu n'ime ha.
- issue: Ihe ἕως θανάτου pụtara
  choice: ruo ọnwụ
  alternative: ruo n'ókè ọnwụ
  rationale: '“Ruo ọnwụ” na-echekwa nkwekọrịta na mgbagwoju anya nke Grik: mwute ahụ dị ukwuu ruo n''ókè ọnwụ, ma okwu ahụ nwekwara ike ịnọgide na-ada dịka mwute na-eru ruo ọnwụ.'
translation_notes:
  register: Standard Igbo dị ugbu a, nke doro ndị nkịtị anya ma nọgide na-adị ùgwù. E ji “wee sị” mee ka historical present nke Mak daba n'ụzọ akụkọ Igbo si aga. E debere “mkpụrụ obi” na “ruo ọnwụ” iji chekwaa ịdị omimi na mgbagwoju anya nke isi mmalite; e tinyere ihe ndị ọzọ kwe omume n'ala ala peeji.
