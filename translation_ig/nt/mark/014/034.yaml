revisions:
- from: O wee sị ha, “Mkpụrụ obi m juputara n'oké mwute ruo ọnwụ.[a] Nọrọnụ n'ebe a, na-echekwanụ nche.[b]”
  to: Ọ sịrị ha, “Mwute juru mkpụrụ obi m nke ukwuu, ruo n'ókè ọnwụ.[a] Nọrọnụ ebe a ma na-echenụ nche.[b]”
  rationale: The revision clarifies the Greek idiom ἕως θανάτου without flattening its intensity, improves idiomatic Standard Igbo, and maintains the ambiguity of γρηγορεῖτε between literal wakefulness and vigilant watchfulness. The narrative past “Ọ sịrị ha” is natural in Igbo narrative and does not alter the event conveyed by Mark's historical present.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Jesus' intense sorrow, the command to remain in place, and the call to vigilant wakefulness. However, the unqualified Igbo phrase “ruo ọnwụ” is readily heard as a duration (“until death”), whereas ἕως θανάτου here expresses the extremity of the sorrow. “ruo n'ókè ọnwụ” communicates the source sense more clearly.
  naturalness: “Mwute juru mkpụrụ obi m nke ukwuu” is more idiomatic Standard Igbo than “Mkpụrụ obi m juputara n'oké mwute.” “Na-echenụ nche” is a more natural imperative expression than “na-echekwanụ nche.”
  terminology: “Mkpụrụ obi” appropriately preserves ψυχή in this solemn expression without imposing a doctrinal definition. “Na-echenụ nche” retains the vigilance of γρηγορεῖτε; the footnote supplies “mụrụnụ anya” as the literal-wakefulness alternative.
  issues:
  - severity: medium
    issue: “ruo ọnwụ” can imply duration rather than extremity.
    rationale: In this context ἕως θανάτου means sorrow reaching the point/extent of death, not sorrow continuing until death. The revised wording preserves this idiomatic force.
  - severity: low
    issue: The phrasing for being filled with grief and for keeping watch is somewhat unnatural.
    rationale: The revision uses common, clear Standard Igbo constructions while retaining the source's solemn register.
  revised_text: Ọ sịrị ha, “Mwute juru mkpụrụ obi m nke ukwuu, ruo n'ókè ọnwụ.[a] Nọrọnụ ebe a ma na-echenụ nche.[b]”
  revised_footnotes:
