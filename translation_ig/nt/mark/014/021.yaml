revisions:
- from: N’ihi na Nwa nke Mmadụ na-ala dịka e dere banyere ya; ma ahụhụ ga-adịrị nwoke ahụ onye a ga-esite n’aka ya rara Nwa nke Mmadụ nye.[a] Ọ gaara adịrị ya mma ma a sị na a mụghị nwoke ahụ.
  to: N’ihi na Nwa nke Mmadụ na-aga dịka e dere banyere ya, ma ahụhụ ga-adịrị nwoke ahụ na-arara Nwa nke Mmadụ nye.[a] Ọ gaara adịrị ya mma ma a sị na a mụghị nwoke ahụ.
  rationale: Ndezigharị ahụ na-edozi nsogbu ụtọasụsụ dị n’ọrụ “a ga-esite n’aka ya rara,” na-eme ka Igbo dị ugbu a ma dị ire, ma na-echekwa ọdịiche dị n’etiti ihe e dere banyere Nwa nke Mmadụ na ahụhụ a kpọpụtara onye na-arara ya nye. Ala peeji ka na-edobe nhọrọ okwu “inyefe,” n’enweghị itinye nkọwa okpukpe ọzọ.
