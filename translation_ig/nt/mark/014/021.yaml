id: MRK.14.21
reference: Mark 14:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: ig
  text: N’ihi na Nwa nke Mmadụ na-aga dịka e dere banyere ya, ma ahụhụ ga-adịrị nwoke ahụ na-arara Nwa nke Mmadụ nye.[a] Ọ gaara adịrị ya mma ma a sị na a mụghị nwoke ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ka nso n’okwu Grik, “nwoke ahụ na-enyefe Nwa nke Mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a bụ nkọwa ma ọ bụ ihe kpatara okwu gara aga, n’ụzọ dabara n’Igbo nkịtị.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: E debere aha Jizọs ji akọwa onwe ya n’ụdị na-edobe nghọta ya na njikọ o nwere ike inwe na Daniel.
- source_word: ὑπάγει
  choice: na-ala
  rationale: Nke a na-egosi na ọ na-aga n’ihu ruo n’ihe a kara aka, n’ebughị ụzọ kọwaa kpọmkwem ma ọ bụ nanị njem nkịtị.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: dịka e dere banyere ya
  rationale: Ọ na-edobe ntụnyere καθώς na echiche nke ihe e dere n’Akwụkwọ Nsọ nke ka dị ire.
- source_word: οὐαὶ
  choice: ahụhụ ga-adịrị
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa nsọpụrụ isi kwupụta ịdọ aka ná ntị na ikpe dị n’okwu amụma a.
- source_word: δι’ οὗ
  choice: onye a ga-esite n’aka ya
  rationale: Ọ na-edobe echiche nke onye bụ ụzọ ma ọ bụ onye e ji mee ka ihe ahụ mee, kama ime ka okwu ahụ bụrụ naanị nkọwa banyere àgwà ya.
- source_word: παραδίδοται
  choice: rara ... nye
  rationale: N’ọnọdụ a nke aghụghọ Judas, okwu a na-eme ka omume ịrara mmadụ nye pụta ìhè; e tinyere ‘nyefee’ n’ala peeji dịka ntụgharị ka nso n’ụdị okwu Grik.
- source_word: καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη
  choice: Ọ gaara adịrị ya mma ma a sị na a mụghị nwoke ahụ
  rationale: Ụdị a na-egosi ọnọdụ a na-eche n’echiche nke megidere ihe mere n’ezie, ma na-edobekwa nkwughachi siri ike nke ‘nwoke ahụ.’
theological_decisions:
- issue: Nkọwa παραδίδοται n’akụkọ ahụhụ Jizọs
  choice: rara ... nye
  alternative: nyefee
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ aghụghọ Judas, ya mere ‘rara ... nye’ na-eme ka ajọ omume ahụ doo anya. Ma ‘nyefee’ ka nso n’obosara ihe okwu Grik ahụ pụtara, ya mere e debere ya n’ala peeji.
- issue: Ọchịchị Chineke na ibu ọrụ mmadụ
  choice: E debere ma ‘dịka e dere banyere ya’ ma ‘ahụhụ ga-adịrị nwoke ahụ’
  alternative: Ịkọwa otu akụkụ n’ụzọ ga-eme ka akụkụ nke ọzọ ghara ịdị ike
  rationale: Amaokwu ahụ na-ekwu ma na ụzọ Nwa nke Mmadụ kwekọrọ n’ihe e dere, ma na onye raara ya nye ka na-aza ajụjụ. A hapụrụ esemokwu nkà mmụta okpukpe a ka ọ dị n’ederede.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dịkwa mfe nghọta. A hapụrụ aha ‘Nwa nke Mmadụ’ n’ụdị ọdịnala ya, ma zere okwu pụrụ iche nke otu ụka ma ọ bụ otu nkwenkwe.
