  source_fidelity: 'Ihe odide ahụ na-edobe nke ọma isi echiche Grik: ụzọ Nwa nke Mmadụ kwekọrọ n’ihe e dere, ma onye ahụ na-arara ya nye nọ n’okpuru “ahụhụ.” Otú ọ dị, “onye a ga-esite n’aka ya rara” anaghị arụ ọrụ nke ọma n’ụtọasụsụ Igbo; ọ na-agwakọta ọdịnihu na ụdị ngwaa zuru ezu n’ụzọ na-adịghị eke. E degharịrị ya ka mmekọrịta onye ahụ na omume ịrara nye doo anya.'
