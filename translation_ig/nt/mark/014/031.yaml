revisions:
- from: Ma ọ nọgidere na-ekwusi ya ike karị[a], “Ọ bụrụ na m aghaghị iso gị nwụọ[b], agaghị m agọnahụ gị ma ọlị[c].” Ha niile nọkwa na-ekwu otu ihe ahụ.
  to: Ma o ji nnọọ ike nọgide na-ekwu, sị, “Ọ bụrụ na m aghaghị iso gị nwụọ[b], agaghị m agọnahụ gị ma ọlị[c].” Ha niile nọkwa na-ekwu otu ihe ahụ.
  rationale: The revision replaces the unanchored comparative “karị” with “ji nnọọ ike,” which naturally renders the exceptional intensity of ἐκπερισσῶς, while retaining “nọgidere” for the imperfect ἐλάλει. It also corrects the wording of the lexical footnotes. Footnote a is retained as an available lexical alternative but is not anchored in the revised main text because the revised rendering does not use a marked word or phrase requiring that note.
