base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: ig
  text: Ma o ji nnọọ ike nọgide na-ekwu, sị, “Ọ bụrụ na m aghaghị iso gị nwụọ[b], agaghị m agọnahụ gị ma ọlị[c].” Ha niile nọkwa na-ekwu otu ihe ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: N’ụzọ nkịtị, “iso gị nwụọ ọnụ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “agaghị m agọnahụ gị mgbe ọ bụla.” Okwu Grik ahụ nwere nkwugide siri ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς
  choice: karị
  rationale: N’ebe a, okwu a na-egosi na o kwusiri okwu ya ike karịa ka o mere na mbụ; “karị” na-echekwa echiche nke mmụba ahụ n’Igbo dị mfe.
- source_word: ἐλάλει
  choice: ọ nọgidere na-ekwusi ya ike
  rationale: Ụdị imperfect na-egosi omume gara n’ihu ma ọ bụ e mere ugboro ugboro. Ebe okwu ya bụ nkwụsi ike siri ike, nsụgharị a na-egosi ma ịdịgide nke okwu ahụ ma ike o ji kwuo ya.
- source_word: Ἐὰν δέῃ με
  choice: Ọ bụrụ na m aghaghị
  rationale: δέῃ na-egosi mkpa ma ọ bụ ihe a na-apụghị izere ezere, ọ bụghị naanị ihe nwere ike ime. “M aghaghị” na-enye echiche ahụ n’ụzọ doro anya.
- source_word: συναποθανεῖν σοι
  choice: iso gị nwụọ
  rationale: Ngwaa nwere σύν na-egosi ịnwụkọ ọnụ na onye ọzọ. “Iso gị nwụọ” bụ okwu Igbo e ji eme ihe nke ọma ma na-echekwa echiche ahụ.
- source_word: οὐ μή
  choice: agaghị m ... ma ọlị
  rationale: οὐ μή bụ nkwugide siri ike. “Ma ọlị” na-eme ka ọ pụta ìhè na Pita na-ekwusi ike na ọ gaghị agọnahụ Jizọs n’ọnọdụ ọ bụla.
- source_word: ἀπαρνήσομαι
  choice: agọnahụ
  rationale: “Ịgọnahụ” na-egosi ịsị na mmadụ amaghị onye ahụ ma ọ bụ na ya na onye ahụ enweghị njikọ, nke dabara n’ihe na-eme n’akụkọ a.
- source_word: ὡσαύτως
  choice: otu ihe ahụ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ihe ndị ọzọ kwuru, ya mere “otu ihe ahụ” na-eme ka ihe ọ na-ezo aka na ya doo anya.
- source_word: πάντες ... ἔλεγον
  choice: Ha niile nọkwa na-ekwu
  rationale: “Ha niile” na-echekwa ike nke πάντες, ebe “nọ ... na-ekwu” na-egosi omume na-aga n’ihu nke imperfect ἔλεγον.
theological_decisions:
- issue: Ike nke nkwa Pita na ọ gaghị agọnahụ Jizọs
  choice: agaghị m agọnahụ gị ma ọlị
  alternative: agaghị m agọnahụ gị mgbe ọ bụla
  rationale: Nsụgharị a na-echekwa nkwugide siri ike nke οὐ μή na ntụkwasị obi Pita nwere n’onwe ya, ma ọ naghị akọwa ma ọ bụ belata esemokwu akụkọ ahụ na ọdịda ya nke ga-esochi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. “Ọ nọgidere na-ekwusi ya ike” na-egosi omume gara n’ihu, “m aghaghị” na-echekwa echiche nke mkpa, ebe “ma ọlị” na-eburu nkwugide siri ike nke okwu Grik n’enweghị itinye nkọwa ụka ọ bụla.
