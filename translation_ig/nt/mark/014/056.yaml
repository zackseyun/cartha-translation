  text: πολλοὶ γὰρ ἐψευδομαρτύρουν κατ’ αὐτοῦ, καὶ ἴσαι αἱ μαρτυρίαι οὐκ ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/056.yaml
  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: ig
  text: N’ihi na ọtụtụ mmadụ nọ na-agba akaebe ụgha megide ya, na akaebe ha ekwekọghị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: ọtụtụ mmadụ
  rationale: Okwu nkọwa a na-arụ ọrụ dị ka aha ma na-ezo aka n’ọtụtụ ndị mmadụ. E tinyeghị “ndị akaebe,” n’ihi na ngwaa ahụ na-egosi ya, ma okwu ahụ n’onwe ya ekwughị ya kpọmkwem.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-enye nkọwa na-akwado ihe e kwuru n’akụkọ gbara ya gburugburu; “N’ihi na” na-egosipụta njikọ nkọwa ahụ n’Igbo nkịtị.
- source_word: ἐψευδομαρτύρουν
  choice: nọ na-agba akaebe ụgha
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu ma ọ bụ a na-eme ugboro ugboro n’oge ahụ. “Nọ na-agba akaebe ụgha” na-echekwa ma akụkụ oge ahụ ma ọnọdụ ikpe nke ngwaa ahụ.
- source_word: κατ’ αὐτοῦ
  choice: megide ya
  rationale: Κατά ya na genitive n’ọnọdụ ikpe a na-egosi akaebe e nyere iji buso Jizọs agha; “megide ya” na-enye ihe ahụ n'ụzọ doro anya.
- source_word: ἴσαι
  choice: ekwekọghị
  rationale: Ọ bụ ezie na isi okwu ya bụ “ha nhata,” mgbe ọ na-akọwa akaebe, ọ pụtara na ihe ndị ahụ adabaghị ma ọ bụ ekwekọghị n’etiti onwe ha.
- source_word: αἱ μαρτυρίαι
  choice: akaebe ha
  rationale: Article ahụ na-ezo aka n’akaebe ndị a kpọtụrụla. “Akaebe ha” bụ ụzọ Igbo dị ire nke na-eme ka ndị nwe akaebe ahụ doo anya.
- source_word: οὐκ ἦσαν
  choice: ekwekọghị
  rationale: Ngwaa ịdị nke a jụrụ ajụjụ jikọtara ya na ἴσαι. N’Igbo, otu ngwaa “ekwekọghị” na-enye echiche zuru ezu nke na akaebe ndị ahụ anọghị n’otu.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ụda okwu ikpe dị na “ịgba akaebe ụgha,” ebe a sụgharịrị ἴσαι n’ụzọ sitere n’ọnọdụ ya dị ka “ekwekọghị,” kama iji okwu nkịtị pụtara “ha nhata.”
