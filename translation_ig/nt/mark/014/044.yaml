  text: δεδώκει δὲ ὁ παραδιδοὺς αὐτὸν σύσσημον αὐτοῖς λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτὸν καὶ ⸀ἀπάγετε ἀσφαλῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: ig
  text: Onye ahụ na-arara ya nye enyeworị ha ihe ịrịba ama[a], sị, “Onye m ga-esusu ọnụ bụ ya[b]. Jidenụ ya, duru ya pụọ nke ọma.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “akara”; okwu Grik a na-ezo aka n’ihe ha kwekọrịtara na ya iji mata onye ahụ.
    reason: lexical_alternative
  - marker: b
    text: Isusu ọnụ bụ ụzọ e si ekele mmadụ n’oge ahụ; n’ebe a, Judas ji ya mee ihe ịrịba ama e ji amata Jizọs.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, “duru ya pụọ n’enweghị nsogbu.” N’ọnọdụ njide a, ọ pụrụ ịpụta ka ha jisie ya ike hụ na ọ gaghị agbapụ.
    reason: alternative_reading
lexical_decisions:
- source_word: δεδώκει
  choice: enyeworị
  rationale: Ụdị ngwaa a na-egosi na o nyelarị ha ihe nrịba ama tupu ihe a na-akọ ugbu a emee.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: onye ahụ na-arara ya nye
  rationale: N'ọnọdụ akụkọ a, okwu ahụ pụtara onye na-arara Jizọs nye n'aka ndị ga-ejide ya.
- source_word: σύσσημον
  choice: ihe nrịba ama
  rationale: Ọ na-ezo aka n'ihe ha kwekọrịtara na ya iji mata onye a ga-ejide, ọ bụghị naanị akara n'ozuzu.
- source_word: λέγων
  choice: sị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke eke isi webata okwu onye ahụ kwuru.
- source_word: Ὃν ἂν φιλήσω
  choice: Onye m ga-esusu ọnụ
  rationale: Ọ na-echekwa ọdịdị ahịrịokwu na-akọwapụta onye a ga-amata, n'etinyeghị okwu nwoke nke na-adịghị n'asụsụ Grik.
- source_word: φιλήσω
  choice: ga-esusu ọnụ
  rationale: Nke a na-egosipụta omume isusu ọnụ n'ụzọ doro anya; nkọwa omenala ya dị n'ala peeji.
- source_word: αὐτός ἐστιν
  choice: bụ ya
  rationale: Ọ na-echekwa nkwusi ike nke njirimara ahụ ma na-ada nke ọma n'Igbo.
- source_word: κρατήσατε
  choice: Jidenụ
  rationale: Okwu a na-egosi ijide mmadụ ike, nke dabara n'ọnọdụ a karịa okwu usoro ọchịchị dịka ijide n'aha iwu.
- source_word: ἀπάγετε
  choice: durukwaa ya pụọ
  rationale: Ọ na-egosi iduru ya si ebe ahụ pụọ.
- source_word: ἀσφαλῶς
  choice: nke ọma ka ọ ghara ịgbapụ
  rationale: N'ọnọdụ njide a, adverb ahụ yikarịrị ka ọ na-ekwu ka ha jisie ya ike ma hụ na ọ gaghị agbapụ, ọ bụghị ichekwa ahụ́ ya.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ihe nrịba ama” maka σύσσημον, ebe a kọwara n'ụzọ doro anya ihe ἀσφαλῶς pụtara n'ọnọdụ njide a. E debeghị okwu mmalite dịka “Ugbu a,” n'ihi na isi mmalite Grik enweghị okwu oge dị otú ahụ.
