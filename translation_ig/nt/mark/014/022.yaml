  naturalness: The wording is generally natural Standard Igbo. Adding “wee” before the final giving verb makes the past narrative sequence explicitly smooth and avoids any momentary ambiguity of bare “nye” as an imperative/subjunctive form. The footnote’s final sentence is also adjusted to idiomatic Igbo.
  terminology: “Achịcha,” “gọzie,” “nyawaa,” “Naranụ,” and “ahụ m” are suitable, clear Standard Igbo choices. The main text properly retains the Greek’s unqualified “is” and does not settle sacramental interpretation.
  issues:
