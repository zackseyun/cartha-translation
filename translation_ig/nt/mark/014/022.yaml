  text: Καὶ ἐσθιόντων αὐτῶν ⸀λαβὼν ἄρτον εὐλογήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς καὶ εἶπεν· ⸀Λάβετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: ig
  text: Mgbe ha nọ na-eri nri, o weere achịcha, gọzie ya, nyawaa ya, wee nye ha ya, sị, “Naranụ; nke a bụ ahụ m.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke a na-anọchi anya ahụ m” / “nke a pụtara ahụ m.” N’asụsụ Grik, okwu ahụ bụ n’ụzọ nkịtị, “nke a bụ ahụ m.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: mgbe ha nọ na-eri nri
  rationale: Nkebiokwu genitive absolute nwere participle nke oge ugbu a na-egosi na ihe abụọ ahụ na-eme n’otu oge; ntụgharị a na-edokwa echiche nke omume na-aga n’ihu n’Igbo eke.
- source_word: λαβὼν ἄρτον
  choice: o weere achịcha
  rationale: A tụgharịrị participle aorist ahụ dị ka ngwaa zuru ezu ka akụkọ ahụ na-aga nke ọma n’Igbo. “Achịcha” anaghị akọwapụta karịa ihe Grik kwuru.
- source_word: εὐλογήσας
  choice: gọzie ya
  rationale: N’ọnọdụ nri, okwu a na-ezo aka n’ịgọzi achịcha ahụ ma ọ bụ n’ikwu ngọzi n’elu ya. “Gọzie ya” na-edobe isi okwu Grik n’enweghị nkọwa agbakwunyere.
- source_word: ἔκλασεν
  choice: nyawaa ya
  rationale: Ngwaa a pụtara ịnyawa achịcha ka e kee ya; “ya” na-ezo n’ụzọ doro anya n’achịcha ahụ.
- source_word: ἔδωκεν αὐτοῖς
  choice: nye ha ya
  rationale: Ihe e nyere bụ achịcha ahụ, nke a ghọtara site n’okwu ndị bu ya ụzọ. Nhọrọ a dị nkenke ma doo anya.
- source_word: Λάβετε
  choice: Naranụ
  rationale: Nke a bụ iwu a gwara ọtụtụ ndị ka ha nara achịcha ahụ. “Naranụ” bụ okwu Igbo eke ma na-edobe ike nke imperative ahụ.
- source_word: τοῦτό ἐστιν
  choice: nke a bụ
  rationale: A tụgharịrị copula ἐστιν ozugbo dị ka “bụ,” kama iji okwu nkọwa dị ka “na-anọchi anya” ma ọ bụ “pụtara.”
- source_word: τὸ σῶμά μου
  choice: ahụ m
  rationale: σῶμα pụtara “ahụ”; ọnọdụ a anaghị enye ihe mere a ga-eji tinye nkọwa ihe atụ n’ime isi ederede.
theological_decisions:
- issue: Okwu Jizọs banyere achịcha n’Oriri Nsọ
  choice: “nke a bụ ahụ m”
  alternative: “nke a na-anọchi anya ahụ m” ma ọ bụ “nke a pụtara ahụ m”
  rationale: Grik ji copula nkịtị ἐστιν, ya mere isi ederede na-edobe okwu ahụ kpọmkwem na esemokwu nkà mmụta okpukpe dị n’ime ya, kama idozi arụmụka sacramental site na ntụgharị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ngwaa ndị gara n’usoro na-eme ka akụkọ ahụ dị ndụ ma doo anya. E tinyere akara nkọwa ụkwụ [a] ozugbo n’akụkụ okwu ọ na-akọwa.
