source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ λέγει αὐτὸν κύριον, καὶ πόθεν ⸂αὐτοῦ ἐστιν υἱός⸃; καὶ ὁ πολὺς ὄχλος ἤκουεν αὐτοῦ ἡδέως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: ig
  text: Devid n’onwe ya kpọrọ ya Onyenwe anyị; ya mere, olee otú o si bụrụ nwa ya? Ìgwè mmadụ ahụ buru ibu na-eji ọṅụ na-ege ya ntị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: Devid n’onwe ya
  rationale: Nke a na-edowe nkwusi ike nke αὐτός, ya bụ na ọ bụ Devid n’onwe ya kpọrọ onye ahụ Onyenwe anyị.
- source_word: λέγει αὐτὸν κύριον
  choice: kpọrọ ya Onyenwe anyị
  rationale: N’usoro okwu a, λέγει na-egosi ịkpọ mmadụ aha ma ọ bụ utu aha; “kpọrọ ya Onyenwe anyị” bụ Igbo doro anya nke na-echekwa ike nke utu aha κύριος.
- source_word: πόθεν
  choice: olee otú
  rationale: Ọ bụ ezie na πόθεν pụtara n'ụzọ nkịtị “site ebee,” n’ajụjụ a ọ na-ajụ otú ihe ahụ si kwe omume ma ọ bụ ihe ndabere ya bụ.
- source_word: αὐτοῦ ἐστιν υἱός
  choice: o si bụrụ nwa ya
  rationale: “Nwa ya” na-echekwa okwu υἱός na njikọ ya na utu aha Mesaịa bụ “Nwa Devid,” kama ịkọwa ya ozugbo dịka naanị “nwa sitere n’ezinụlọ ya.”
- source_word: ὁ πολὺς ὄχλος
  choice: ìgwè mmadụ ahụ buru ibu
  rationale: Nkebi a na-egosi ìgwè mmadụ dị ọtụtụ, ọ bụghị otu òtù mmekọrịta mmadụ pụrụ iche.
- source_word: ἤκουεν αὐτοῦ ἡδέως
  choice: jikwa ọṅụ na-ege ya ntị
  rationale: “Na-ege” na-egosipụta omume na-aga n’ihu nke imperfect ἤκουεν; “jikwa ọṅụ” na-ebute echiche ụtọ na obi ụtọ dị na ἡδέως.
theological_decisions:
- issue: Ike gbasara onye Kraịst dị n’ịkpọ Mesaịa “Onyenwe anyị”
  choice: E debere utu aha “Onyenwe anyị” na ajụjụ ahụ n’enweghị nkọwa agbakwunyere.
  alternative: Ịsụgharị ya dịka “onye nwe m” ma ọ bụ itinye “Mesaịa” kpọmkwem n’ahịrịokwu.
  rationale: Okwu ahụ na-eme ka esemokwu dị n’etiti ịbụ nwa Devid na ịbụ Onyenwe Devid pụta ìhè, ma ekwesịghị itinye nkọwa ozizi karịrị ihe amaokwu ahụ kwuru.
- issue: Ihe υἱός pụtara n’ọnọdụ Mesaịa
  choice: nwa
  alternative: nwa sitere n’agbụrụ ya / onye sitere n’ezinụlọ ya
  rationale: “Nwa” na-echekwa ma okwu nkịtị ahụ ma nkuzi aha a maara nke ọma bụ “Nwa Devid,” ebe nkọwa ala peeji na-egosi na ọ pụkwara ịpụta onye sitere n’agbụrụ ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ajụjụ Jizọs n’ụdị na-echekwa esemokwu ya, n’enweghị ịkọwa azịza ya n’ime ederede.
