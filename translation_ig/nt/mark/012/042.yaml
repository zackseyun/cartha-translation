  text: καὶ ἐλθοῦσα μία χήρα πτωχὴ ἔβαλεν λεπτὰ δύο, ὅ ἐστιν κοδράντης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/042.yaml
  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: ig
  text: Otu nwanyị ogbenye nke di ya nwụrụ bịara tinye mkpụrụ ego abụọ a na-akpọ lepta[a][b], ya bụ otu quadrans[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lepton bụ mkpụrụ ego pere nnọọ mpe; lepta abụọ hà otu mkpụrụ ego Rom a na-akpọ quadrans.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “mkpụrụ ego ọla kọpa abụọ pere mpe.”
    reason: lexical_alternative
  - marker: c
    text: Quadrans bụ aha mkpụrụ ego Rom e kpọrọ n’ihe odide Grik.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: bịara
  rationale: 'A sụgharịrị aorist participle ahụ dị ka ngwaa jikọrọ ya na ngwaa bụ isi, ka akụkọ ahụ na-aga nke ọma n''Igbo: “bịara tinye.”'
- source_word: μία
  choice: otu nwanyị
  rationale: μία na-ewebata otu onye n’akụkọ a; “otu nwanyị” bụ ụzọ Igbo si egosi onye ahụ n’enweghị imesi ọnụọgụ ike gabiga ókè.
- source_word: χήρα
  choice: nwanyị di ya nwụrụ
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị akọwa χήρα.
- source_word: πτωχὴ
  choice: ogbenye
  rationale: “Ogbenye” na-egosi ịda ogbenye n'ụzọ eke; e tinyeghị nkọwa siri ike karịa ihe amaokwu a kwuru.
- source_word: ἔβαλεν
  choice: tinye
  rationale: N’ihe gbasara igbe onyinye, “tinye” na-akọwa omume ahụ nke ọma n’Igbo ugbu a, n’enweghị echiche nke ịtụ ihe n’ike.
- source_word: λεπτὰ δύο
  choice: mkpụrụ ego lepta abụọ
  rationale: A hapụrụ aha mkpụrụ ego Grik ahụ ka e chekwaa nkọwa akụkọ ihe mere eme, ma “mkpụrụ ego” na-eme ka onye na-agụ ya mata ihe ọ bụ.
- source_word: ὅ ἐστιν
  choice: nke ha abụọ bụ otu
  rationale: N’ihi na ὅ bụ otu-ọnụọgụ ma na-ezo aka n’ọnụ ahịa ngụkọta nke lepta abụọ ahụ, okwu a na-egosi nha ọnụ ahịa ha n’Igbo nke ọma.
- source_word: κοδράντης
  choice: quadrans
  rationale: A chekwara aha mkpụrụ ego Rom nke dị na Grik kama iji aha ego nke oge a nke nwere ike iduhie.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. E chekwara aha mkpụrụ ego oge ochie, tinyekwa nkọwa n’ala ala peeji ka ederede bụ isi ghara ịdị arọ.
