source:
  edition: SBLGNT
  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: ig
  text: Otu n’ime ndị ọkà n’Iwu bịakwutere. Ọ nụrụ ka ha na-arụrịta ụka, ma mgbe ọ hụrụ na Jizọs zara ha nke ọma, ọ jụrụ ya, “Olee iwu bụ nke mbụ[a] n’iwu niile?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke kachasị elu n’iwu niile” ma ọ bụ “nke kachasị mkpa n’iwu niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματέων
  choice: ndị ọkà n’Iwu
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka ná ndị Juu a maara dị ka ndị maara Iwu nke ọma. Nhọrọ a na-eme ka ọrụ ha doo onye Igbo nke oge a anya, kama iji okwu nwere ike ịdị ka ọ na-ekwu naanị banyere ndị odeakwụkwọ nkịtị.
- source_word: προσελθὼν
  choice: bịarutere n’ebe ahụ
  rationale: Nke a na-egosi na onye ahụ bịara nso n’ebe Jizọs na ndị ọzọ nọ, n’asụsụ Igbo dị mfe ma dị ndụ.
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: Ọ nụrụ ka ha na-arụrịta ụka
  rationale: “Na-arụrịta ụka” na-egosi mkparịta ụka banyere ajụjụ a na-ese okwu, n’ebughị ụzọ kwuo na ha na-alụ ọgụ ma ọ bụ na-ebuso ibe ha iro.
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: mgbe ọ hụrụ na Jizọs zara ha nke ọma
  rationale: A kpọrọ Jizọs aha iji zere mgbagwoju anya nke nnọchiaha “ọ” n’Igbo, ebe ihe Grik na-ekwu—na ọ bụ Jizọs zara ha—ka echekwara.
- source_word: ἐπηρώτησεν
  choice: ọ jụrụ ya
  rationale: Nke a bụ ụzọ Igbo kachasị doo anya na nke sitere n’okike isi kwuo na mmadụ jụrụ onye ọzọ ajụjụ.
- source_word: Ποία
  choice: Olee
  rationale: “Olee” na-ajụ ka a họpụta otu iwu n’etiti iwu ndị ọzọ.
- source_word: ἐντολή
  choice: iwu
  rationale: “Iwu” bụ okwu Igbo doro anya maka ihe e nyere mmadụ n’iwu, ma dabara n’ebe a na-ekwu banyere Iwu Chineke.
- source_word: πρώτη πάντων
  choice: nke mbụ n’iwu niile
  rationale: A hapụrụ echiche bụ́ “nke mbụ” ka ọ dị n’isi okwu, n’ihi na πρῶτος nwere ike ịpụta nke mbụ n’usoro ma ọ bụ nke kachasị elu n’ọkwa; nkọwa ala peeji na-egosi ụzọ ndị ọzọ e nwere ike isi ghọta ya.
theological_decisions:
- issue: Ihe πρώτη pụtara n’ajụjụ banyere iwu
  choice: nke mbụ n’iwu niile
  alternative: nke kachasị mkpa n’iwu niile; nke kachasị elu n’iwu niile
  rationale: Okwu Grik bụ πρώτη, ya bụ “nke mbụ,” ma ọ pụkwara igosi ịdị elu n’ọkwa. Isi okwu ahụ na-edobe okwu a sara mbara kama ikpebi ozugbo na ọ pụtara naanị “nke kachasị mkpa”; nkọwa ala peeji na-egosi nkọwa ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị nsọ, dee ya. “Ndị ọkà n’Iwu” na-eme ka ọrụ ndị γραμματεῖς doo ndị na-agụ akwụkwọ anya; a kpọkwara Jizọs aha n’ahịrị nke abụọ iji wepụ mgbagwoju anya nke ọtụtụ nnọchiaha “ọ” n’Igbo.
