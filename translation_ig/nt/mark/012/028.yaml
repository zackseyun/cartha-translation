- from: Otu n’ime ndị ọkà n’Iwu bịarutere n’ebe ahụ. Ọ nụrụ ka ha na-arụrịta ụka, ma mgbe ọ hụrụ na Jizọs zara ha nke ọma, ọ jụrụ ya, “Olee iwu bụ nke mbụ[a] n’iwu niile?”
  to: Otu n’ime ndị ọkà n’Iwu bịakwutere. Ọ nụrụ ka ha na-arụrịta ụka, ma mgbe ọ hụrụ na Jizọs zara ha nke ọma, ọ jụrụ ya, “Olee iwu bụ nke mbụ[a] n’iwu niile?”
  rationale: Replaced “bịarutere n’ebe ahụ” with “bịakwutere” to represent the approaching sense of προσελθών more faithfully. No other changes are needed; the wording preserves the source’s ranking ambiguity in πρώτη and the footnote remains correctly anchored.
