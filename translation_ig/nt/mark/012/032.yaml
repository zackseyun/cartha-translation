  text: ⸀καὶ εἶπεν αὐτῷ ὁ γραμματεύς· Καλῶς, διδάσκαλε, ἐπ’ ἀληθείας εἶπες ὅτι εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: ig
  text: Onye odeakwụkwọ ahụ wee sị ya[a], “I kwuru nke ọma, Onye Ozizi. I kwuru eziokwu na ọ bụ otu, ọ dịghịkwa ọzọ ma e wezụga ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ doro anya karị n’ihe gbasara okwu gbara ya gburugburu, “Chineke bụ otu.” Grik kwuru naanị, “ọ bụ otu,” ebe a na-amata onye a na-ekwu maka ya site n’ihe e kwuru tupu ya.
    reason: alternative_reading
lexical_decisions:
- source_word: γραμματεύς
  choice: onye odeakwụkwọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị odeakwụkwọ bụ́ ndị ọkachamara n’Iwu n’oge Jizọs; ọ dị nkenke ma ghara ịgbasa ihe Grik kwuru.
- source_word: Καλῶς
  choice: I kwuru nke ọma
  rationale: N’ebe a, okwu ahụ na-egosi na onye odeakwụkwọ kwadoro azịza Jizọs; nkebi a bụ Igbo ebumpụta ụwa nke na-egosi otuto ahụ.
- source_word: διδάσκαλε
  choice: Onye Ozizi
  rationale: Nke a na-egosipụta kpọmkwem ọrụ onye na-akụzi, ma dabara n’ụdị okwu nkwanye ùgwù e ji kpọọ Jizọs ebe a.
- source_word: ἐπ’ ἀληθείας
  choice: eziokwu
  rationale: N’ahịrịokwu “I kwuru eziokwu,” okwu a na-egosi na ihe Jizọs kwuru bụ eziokwu, n’Igbo doro anya ma dị ugbu a.
- source_word: εἶπες
  choice: I kwuru
  rationale: Oge gara aga dị mfe na-egosipụta okwu Jizọs kwuru obere oge tupu nke a, dịka aorist Grik si dị.
- source_word: ὅτι
  choice: na
  rationale: “Na” na-ewebata ihe onye odeakwụkwọ kwuru na Jizọs kwuru; ọ bụghị ihe kpatara otuto ya.
- source_word: εἷς ἐστιν
  choice: ọ bụ otu
  rationale: Nke a na-echekwa ụzọ Grik si hapụ aha onye a na-ekwu maka ya n’emeghị ka “Chineke” pụta ìhè n’amaokwu ahụ n’onwe ya.
- source_word: ἄλλος
  choice: onye ọzọ
  rationale: N’Igbo, “onye ọzọ” bụ ụzọ ebumpụta ụwa isi kwuo onye ọzọ dị iche n’ebe a, ebe okwu gbara ya gburugburu na-ezo aka n’Onye bụ Chineke.
- source_word: πλὴν αὐτοῦ
  choice: ma e wezụga ya
  rationale: Nkebi a na-egosipụta echiche nke iwepụ ihe ndị ọzọ—ọ dịghị onye ọzọ e wezụga ya—n’enweghị mgbasawanye nkọwa.
theological_decisions:
- issue: Onye a na-ekwu maka ya n’okwu εἷς ἐστιν apụtaghị n’aha
  choice: ọ bụ otu
  alternative: Chineke bụ otu; e nwere otu Chineke
  rationale: Ọ bụ ezie na okwu ndị bu ụzọ na-egosi nke ọma na a na-ekwu banyere Chineke Izrel, amaokwu Grik a akpọghị θεός ọzọ. Ya mere, “ọ bụ otu” na-echekwa nkenke na ntakịrị mgbagwoju anya dị na isi mmalite, ebe ihe gbara amaokwu ahụ gburugburu na-eme ka onye a na-ekwu maka ya doo anya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee nsụgharị ahụ. E debere usoro okwu Grik n’ebe ọ na-ekwe omume, ma jiri ahịrịokwu Igbo ebumpụta ụwa mee ka mkparịta ụka ahụ gaa were were.
