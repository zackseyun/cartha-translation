  to: Onye odeakwụkwọ ahụ wee sị ya[a], “I kwuru nke ọma, Onye Ozizi. I kwuru eziokwu na ọ bụ otu, ọ dịghịkwa ọzọ ma e wezụga ya.”
  rationale: The revision removes the added human-person sense in “onye ọzọ,” preserving the Greek’s elliptical “no other.” It also refines the footnote’s Igbo while retaining its explanation that “Chineke” is contextually supplied rather than explicitly repeated in the Greek clause.
