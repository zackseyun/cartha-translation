  text: καὶ πάλιν ἀπέστειλεν πρὸς αὐτοὺς ἄλλον δοῦλον· ⸀κἀκεῖνον ⸀ἐκεφαλίωσαν καὶ ⸀ἠτίμασαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/004.yaml
  text: And again he sent another servant to them[c][b][a], and they struck him on the head and dishonored him.
translation:
  language: ig
  text: Ọ zighachikwara ha ohu ọzọ[a]; ha kụkwara ya n’isi[b] ma mesoro ya n’ụzọ ihere[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye ọzọ na-eje ozi.” Okwu Grik ahụ nwere ike ịpụta “ohu” ma ọ bụ “onye na-eje ozi,” dabere n’ọnọdụ e ji ya mee ihe.
    reason: alternative_reading
  - marker: b
    text: Ngwaa a na-adịghị ahụkarị na-ekwu maka ime ihe ike n’isi; o nwere ike ịpụta “kụrụ ya n’isi” ma ọ bụ “merụọ ya ahụ n’isi,” ọ bụghị “gbupụrụ ya isi.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “wedara ya ala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: ọzọ
  rationale: Na-egosi na onye nwe ubi ahụ megharịrị iziga ohu ọzọ n’usoro akụkọ ilu ahụ.
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: O zigakwara ... ka ọ gakwuru ha
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’omume iziga mmadụ ka ọ gakwuru ndị ọzọ; “-kwara” na-ebukwa echiche nke πάλιν.
- source_word: ἄλλον δοῦλον
  choice: ohu ọzọ
  rationale: “Ohu” na-egosi onye nọ n’okpuru nna ya ukwu, ma n’Igbo ọ pụkwara ịpụta onye e mere ohu; ihe ọzọ enwere ike ịghọta ya dị na nkọwa ala peeji.
- source_word: κἀκεῖνον
  choice: ya
  rationale: Nnochiaha “ya” na-aga nke ọma n’Igbo, ebe “ma” na-egosi njikọ dị na κἀκεῖνον.
- source_word: ἐκεφαλίωσαν
  choice: tụrụ ya ihe n’isi
  rationale: Ngwaa Grik a na-adịghị ahụkarị na-ekwu maka ime ihe ike n’isi. Nhọrọ a bụ nke doro anya, ọ naghịkwa akọwa ya n’ụzọ na-ezighị ezi dịka igbupụ isi.
- source_word: ἠτίμασαν
  choice: mesookwa ya n’ụzọ ihere
  rationale: Na-egosi na ha wedara ya ala ma mesoo ya n’ụzọ na-ewetara ya ihere; ọ bụ okwu Igbo dị ndụ ma doo anya.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “ohu” chekwaa mmekọrịta onye nwe na onye nọ n’okpuru ya, ebe nkọwa ala peeji na-egosi obosara ihe δοῦλος nwere ike ịpụta. E debere ejighị n’aka gbasara ngwaa ἐκεφαλίωσαν na nkọwa ala peeji.
