id: MRK.12.1
reference: Mark 12:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: ig
  text: 'Ọ wee malite ịgwa ha okwu n''ilu: “Otu nwoke kụrụ ubi vaịn, gbara ya ogige gburugburu, gwuo olulu ebe mmanya vaịn na-asọba[a], wuo ụlọ elu nche, gbazitere ya ndị ọrụ ugbo[b], wee gaa ebe ọzọ.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, olulu ma ọ bụ ite dị n'okpuru ebe a na-azọpịa mkpụrụ vaịn, ebe mmiri vaịn na-asọba.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “gbazinye ya ndị ọrụ ugbo,” ma ọ bụ “nye ya ndị na-elekọta vaịn ka ha na-akọ ya.” Ihe odide Grik akọwaghị ụdị ụgwọ ha ga-akwụ.
    reason: lexical_alternative
  - marker: c
    text: Oyiyi nke ubi vaịn a kụrụ, nke e gbara ogige ma kwadebe nke ọma, na-echetara Aịzaya 5:1–2.
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο ... λαλεῖν
  choice: malite ịgwa ha okwu
  rationale: Na-egosipụta usoro mmalite nke ngwaa Grik ahụ n'Igbo dị mfe ma bụrụkwa nke dabara n'akụkọ.
- source_word: ἐν παραβολαῖς
  choice: n'ilu
  rationale: “Ilu” bụ okwu Igbo a na-aghọta nke ọma maka akụkọ atụ e ji akụzi ihe; ọtụtụ n'ọnụọgụ Grik anaghị achọ ka e gosipụta ya iche n'usoro Igbo a.
- source_word: Ἀμπελῶνα
  choice: ubi vaịn
  rationale: Na-akọwa ubi a kụrụ osisi vaịn n'ụzọ doro anya nye onye Igbo nke oge a.
- source_word: ἄνθρωπος
  choice: otu nwoke
  rationale: N'akụkọ a, okwu ahụ na-ezo aka n'otu nwoke nwe ala, ọ bụghị mmadụ n'ozuzu.
- source_word: περιέθηκεν φραγμόν
  choice: gbaa ya ogige gburugburu
  rationale: “Ogige” nwere ike ịpụta ihe mgbochi gbara ubi gburugburu n'emebighị ma ọ bụ ngere ka e ji mee ya.
- source_word: ὤρυξεν ὑπολήνιον
  choice: gwuo olulu ebe mmanya vaịn na-asọba
  rationale: ὑπολήνιον bụ olulu ma ọ bụ ite dị n'okpuru ebe a na-azọpịa vaịn, nke na-anata mmiri vaịn; ntụgharị a na-eme ka ọrụ ya doo anya.
- source_word: ᾠκοδόμησεν πύργον
  choice: wuo ụlọ nche
  rationale: N'ọnọdụ ubi vaịn, πύργος bụ ụlọ elu e si eche ubi nche; “ụlọ nche” bụ okwu eke ma ghọta ọrụ ya.
- source_word: ἐξέδετο ... γεωργοῖς
  choice: nye ya ndị ọrụ ugbo ka ha na-akọ ya n'ịkwụ ụgwọ
  rationale: Na-echekwa echiche nke inyefe ndị ọzọ ala ka ha rụọ ọrụ n'okpuru nkwekọrịta, ma mee ka ọdịiche dị n'etiti onye nwe ubi na ndị na-akọ ya pụta ìhè.
- source_word: ἀπεδήμησεν
  choice: gaa ebe ọzọ
  rationale: Na-egosi na onye nwe ubi hapụrụ ebe ahụ ruo oge ụfọdụ, na-enweghị ịgbakwunye ebe ọ gara ma ọ bụ ogologo njem ahụ.
theological_decisions:
- issue: Mmekọrịta dị n'etiti onye nwe ubi na γεωργοί
  choice: ndị ọrụ ugbo na-akọ ubi ahụ n'ịkwụ ụgwọ
  alternative: ndị ọrụ ugbo; ndị na-elekọta vaịn
  rationale: Ihe odide ahụ na-egosi na nwoke ahụ ka bụ onye nwe ubi ma nyefee ya ndị ọzọ n'okpuru nkwekọrịta. A naghị akọwa ụdị ụgwọ ahụ, ya mere e kwesịghị ịsị ma ọ bụ ego ma ọ bụ mkpụrụ ubi.
- issue: Ntụaka oyiyi ahụ na Aịzaya 5:1–2
  choice: idowe ya na nkọwa ala peeji kama itinye nkọwa ya n'amaokwu
  alternative: ịkọwa ubi vaịn ahụ kpọmkwem dị ka Izrel
  rationale: Oyiyi ahụ na-eme ka Aịzaya 5 pụta n'uche, ma amaokwu a ekwughị kpọmkwem ihe ubi ahụ nọchiri anya ya; ntụgharị ahụ ekwesịghị idozi ihe atụ ahụ tupu akụkọ ahụ akọwa onwe ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. E ji usoro ngwaa so ibe ya mee ka ije akụkọ Grik dịrị ndụ. “Ubi vaịn” na “ụlọ nche” na-akọwapụta ọnọdụ ọrụ ugbo n'ụzọ eke; akọwaghị ihe atụ ahụ n'ime amaokwu ka edowe mgbagwoju anya ya.
