- from: 'Ọ wee malite ịgwa ha okwu n''ilu: “Otu nwoke kụrụ ubi vaịn, gbaa ya ogige gburugburu, gwuo olulu ebe mmanya vaịn na-asọba[a], wuo ụlọ nche, nye ya ndị ọrụ ugbo ka ha na-akọ ya n''ịkwụ ụgwọ[b], wee gaa ebe ọzọ.”[c]'
  to: 'Ọ wee malite ịgwa ha okwu n''ilu: “Otu nwoke kụrụ ubi vaịn, gbara ya ogige gburugburu, gwuo olulu ebe mmanya vaịn na-asọba[a], wuo ụlọ elu nche, gbazitere ya ndị ọrụ ugbo[b], wee gaa ebe ọzọ.”[c]'
  rationale: A safe, limited revision clarifies that the landowner leased the vineyard to the cultivators, as required by ἐξέδετο, without adding terms of tenancy. “Ụlọ elu nche” more closely represents πύργος. The parable's allusive but not yet interpreted character is retained, and the Isaiah reference remains in a footnote.
