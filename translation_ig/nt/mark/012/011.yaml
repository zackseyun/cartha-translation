id: MRK.12.11
reference: Mark 12:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/011.yaml
  text: This came from the Lord[b][a], and it is marvelous in our eyes.
translation:
  language: ig
  text: Nke a sitere n’aka Onyenwe anyị[a], ọ bụkwa ihe dị ịtụnanya n’anya anyị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Onyenwe anyị mere nke a.” Okwu Grik ahụ nwere ike igosi ebe ihe si malite ma ọ bụ onye mere ya.
    reason: lexical_alternative
  - marker: b
    text: Ahịrị a bụ okwu e hotara n’Abụ Ọma 118:23.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ κυρίου
  choice: sitere n’aka Onyenwe anyị
  rationale: παρά ya na genitive na-egosi ebe ihe si malite, ma n’ụdị okwu a ọ pụkwara inwe echiche nke onye mere ka ihe ahụ dịrị. “Sitere n’aka” bụ Igbo dị mma nke na-echekwa echiche isi mmalite ahụ n’ebughị ụzọ mechie ohere nke agency.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: N’Igbo Baịbụl, “Onyenwe anyị” bụ nsụgharị kwesịrị ekwesị ma dị ùgwù maka κύριος mgbe ọ na-ezo aka na Chineke. Ọ na-agbaso ederede Grik nke Agba Ọhụrụ n’etinyeghị aha Chineke dị n’amaokwu Hibru n’ime isi ederede.
- source_word: ἐγένετο
  choice: sitere
  rationale: N’usoro παρὰ κυρίου ἐγένετο, okwu a na-ekwu na ihe ahụ sitere ma ọ bụ bịara site n’aka Onyenwe anyị. “Sitere” na-enye Igbo eke karịa nsụgharị nkịtị dịka “ọ ghọrọ,” ma na-ezere ime ka ihe ahụ daa ka ihe mere na mberede.
- source_word: αὕτη
  choice: Nke a
  rationale: Ngosipụta a na-ezo azụ n’ihe e kwuru banyere nkume ahụ n’amaokwu gara aga. “Nke a” na-echekwa ntụaka ahụ n’etinyeghị “nkume” nke na-adịghị n’ahịrị Grik a.
- source_word: θαυμαστὴ
  choice: ihe dị ịtụnanya
  rationale: θαυμαστός pụtara ihe na-akpali ịtụnanya ma ọ bụ dị ebube. “Ihe dị ịtụnanya” bụ okwu Igbo doro anya, eke, ma ka nwere ụda dị ùgwù nke abụ ọma ahụ.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: n’anya anyị
  rationale: Nke a na-echekwa ihe oyiyi dị n’okwu Grik na nke Semitic, ma ọ bụkwa akpaalaokwu Igbo a na-aghọta nke ọma, nke pụtara “n’echiche anyị” ma ọ bụ “n’ihu anyị.”
theological_decisions:
- issue: Nsụgharị κύριος n’okwu e hotara n’Abụ Ọma nke na-ezo aka na Chineke
  choice: Onyenwe anyị
  alternative: Yahweh / ONYENWE ANYỊ
  rationale: Ọ bụ ezie na Abụ Ọma Hibru nke dị n’azụ ahịrị a nwere aha Chineke, ederede Grik Mak nwere κυρίου. Ya mere, isi ederede na-asụgharị okwu Grik ahụ dịka “Onyenwe anyị,” na-ebubataghị ụdị aha Chineke nke na-anọghị n’ederede Grik a.
- issue: Mmekọrịta παρά + genitive na ἐγένετο
  choice: sitere n’aka Onyenwe anyị
  alternative: Onyenwe anyị mere ya
  rationale: Grik nwere ike igosi ma isi mmalite ma onye mere ihe. “Sitere n’aka” na-ebute echiche isi mmalite n’ihu ma na-ahapụkwa echiche agency ka ọ dị, kama ikwubi naanị na “Onyenwe anyị mere ya.”
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dị ùgwù, dee ya. A hapụrụ ihe oyiyi “n’anya anyị” dịka ọ dị n’isi mmalite, ma e debere mgbagwoju anya dị n’etiti source na agency na nkọwa ala peeji.
