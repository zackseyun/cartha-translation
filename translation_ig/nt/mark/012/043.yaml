id: MRK.12.43
reference: Mark 12:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ ⸀εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ἡ χήρα αὕτη ἡ πτωχὴ πλεῖον πάντων ⸀ἔβαλεν τῶν βαλλόντων εἰς τὸ γαζοφυλάκιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: ig
  text: Ọ kpọrọ ndị na-eso ụzọ ya ka ha bịakwute ya, sị ha, “N’ezie, ana m asị unu na nwanyị a di ya nwụrụ, bụ ogbenye, etinyela karịa ndị niile na-etinye ego n’ebe a na-atụnye onyinye[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “igbe onyinye” ma ọ bụ “ebe a na-edebe akụ ụlọ nsọ.” Okwu Grik ahụ nwere ike ịpụta igbe ma ọ bụ ebe a na-atụnye onyinye, ma ọ bụ mpaghara ebe a na-edebe akụ ụlọ nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: ọ kpọkwara … ka ha bịakwute ya
  rationale: Nke a na-egosi na Jizọs kpọrọ ndị na-eso ụzọ ya ka ha bịaruo ya nso, ma na-edobe njikọ nke participle ahụ na ihe o kwuru n’ụzọ Igbo dị nfe.
- source_word: μαθητὰς
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa μαθηταί dịka ndị na-amụta ihe n’aka onye ha na-eso.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: N’ezie, ana m asị unu
  rationale: Ọ na-edobe ịdị arọ na nkwenye siri ike nke usoro okwu Jizọs, ma bụrụkwa Igbo doro anya.
- source_word: χήρα
  choice: nwanyị … di ya nwụrụ
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya e si akọwa nwanyị di ya nwụrụ.
- source_word: πτωχὴ
  choice: ogbenye
  rationale: Ọ na-enye kpọmkwem echiche nke ịda ogbenye n’etinyeghị echiche siri ike karịa ihe ederede kwuru.
- source_word: πλεῖον πάντων
  choice: karịa ndị niile
  rationale: Ọ na-edobe ntụnyere sara mbara nke Grik ahụ n’akọwaghị n’ime amaokwu ma ọ bụ uru onyinye ya ka e ji atụ ya ma ọ bụ naanị ọnụ ọgụgụ ego.
- source_word: ἔβαλεν
  choice: etinyela
  rationale: Ụdị a na-egosi ihe nwanyị ahụ merela, nke Jizọs na-enyocha ugbu a.
- source_word: τῶν βαλλόντων
  choice: ndị niile na-etinye ego
  rationale: Ọ na-edobe omume ndị ọzọ ka na-aga n’ihu; ‘ego’ na-eme ka ihe a na-etinye n’ebe onyinye ahụ doo onye na-agụ Igbo anya.
- source_word: γαζοφυλάκιον
  choice: ebe a na-edebe onyinye
  rationale: Nke a bụ okwu doro onye Igbo nke oge a anya maka ebe ma ọ bụ ihe nnata onyinye dị n’ụlọ nsọ, ebe nkọwa ala peeji na-edobe nhọrọ ndị ọzọ.
theological_decisions:
- issue: Otú e si atụ onyinye nwanyị di ya nwụrụ
  choice: E debere okwu ntụnyere ahụ dịka ‘etinyela karịa ndị niile’ n’akọwaghị ụdị ịdị ukwuu a na-ekwu.
  alternative: Ịkọwa ya ozugbo dịka na onyinye ya bara uru karịa nke ndị ọzọ n’ihi na o nyere site n’ụkọ ya.
  rationale: Amaokwu na-esote na-akọwa ihe mere Jizọs ji kwuo otú ahụ, ma amaokwu a n’onwe ya hapụrụ ntụnyere ahụ n’ụdị ya siri dị. Nsụgharị ahụ anaghị eme ka ọ bụrụ naanị ntụnyere ọnụ ọgụgụ ego, ọ naghịkwa etinye nkọwa amaokwu 44 n’ime amaokwu 43.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ụda nkwenye siri ike nke Jizọs na ntụnyere na-akọwaghị nke ọma dịka ọ dị na Grik. E tinyere akara [a] kpọmkwem n’akụkụ okwu ọ na-akọwa.
