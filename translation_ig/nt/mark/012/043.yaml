revisions:
- from: Ọ kpọkwara ndị na-eso ụzọ ya ka ha bịakwute ya, sị ha, “N’ezie, ana m asị unu na nwanyị ogbenye a di ya nwụrụ etinyela karịa ndị niile na-etinye ego n’ebe a na-edebe onyinye[a].”
  to: Ọ kpọrọ ndị na-eso ụzọ ya ka ha bịakwute ya, sị ha, “N’ezie, ana m asị unu na nwanyị a di ya nwụrụ, bụ ogbenye, etinyela karịa ndị niile na-etinye ego n’ebe a na-atụnye onyinye[a].”
  rationale: The revision removes a possible unwarranted additive force, makes the description of the widow smoother in modern Standard Igbo, and improves the rendering and note for the temple treasury term. It retains the source’s open comparative, "etinyela karịa ndị niile," without explaining the basis of Jesus’ evaluation.
