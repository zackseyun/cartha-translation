  to: ndị na-eripịa ụlọ ndị inyom di ha nwụrụ, na-ekpekwa ekpere ogologo n’ihi ime ngosi[a]—ndị a ga-anata ikpe ọmụma ka ukwuu[b].
  rationale: The revision replaces the audience-specific phrase with an idiomatic expression for praying ‘for show,’ which better reflects προφάσει while preserving its ambiguity between outward display and pretense. The footnote supplies a closer ‘under a pretext’ alternative. All other wording is retained.
