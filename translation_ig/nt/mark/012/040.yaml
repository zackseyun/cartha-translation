  text: οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσευχόμενοι· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/040.yaml
  text: who devour widows’ houses and for appearance’s sake pray at length—these will receive greater condemnation[a][b].
translation:
  language: ig
  text: ndị na-eripịa ụlọ ndị inyom di ha nwụrụ, na-ekpekwa ekpere ogologo n’ihi ime ngosi[a]—ndị a ga-anata ikpe ọmụma ka ukwuu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’okpuru ngọpụ” ma ọ bụ, “ka e wee hụ ha n’anya mmadụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ikpe ka ukwuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίοντες
  choice: na-eripịa
  rationale: Ọ na-edobe ihe atụ siri ike nke iri ihe kpamkpam, ma n’ebe a ọ na-egosi iji anyaukwu napụ ndị inyom di ha nwụrụ ihe ha nwere.
- source_word: τὰς οἰκίας
  choice: ụlọ
  rationale: Nke a bụ ntụgharị kpọmkwem nke okwu Grik; ọ pụkwara ịgụnye ezinaụlọ ma ọ bụ akụ ha, ma a hapụrụ obosara ahụ n’ime okwu ahụ.
- source_word: τῶν χηρῶν
  choice: ndị inyom di ha nwụrụ
  rationale: Nke a bụ okwu Igbo doro anya ma dị ugwu maka ụmụ nwanyị ndị di ha nwụrụ.
- source_word: προφάσει
  choice: ka ndị mmadụ hụ ha
  rationale: Ọ na-egosi na ogologo ekpere ha bụ ihe ngosi n’ihu mmadụ, ọ bụghị nanị ezi ofufe; a debere ntụgharị ndị dị nso n’ụdị okwu Grik na nkọwa ala peeji.
- source_word: μακρὰ προσευχόμενοι
  choice: na-ekpekwa ogologo ekpere
  rationale: Ọ na-egosi ogologo oge ekpere ahụ ma na-agụ nke ọma n’Igbo ugbu a.
- source_word: λήμψονται
  choice: ga-anata
  rationale: Ọ na-edobe ọdịdị ọdịnihu na ụda dị nsọ nke ịnata ihe ga-esi n’omume ha pụta.
- source_word: περισσότερον
  choice: ka ukwuu
  rationale: Ọ na-edobe ntụnyere ahụ n’enweghị ịkọwa kpọmkwem otú ikpe ahụ ga-esi dị ukwuu.
- source_word: κρίμα
  choice: ikpe ọmụma
  rationale: N’ọnọdụ ịdọ aka ná ntị a, okwu ahụ na-egosi ikpe na-eweta ntaramahụhụ, ma a hapụrụ ‘ikpe’ dịka nhọrọ ọzọ na nkọwa ala peeji.
theological_decisions:
- issue: Ihe κρίμα pụtara n’ịdọ aka ná ntị megide ihu abụọ nke ndị okpukpe
  choice: ikpe ọmụma
  alternative: ikpe
  rationale: ‘Ikpe ọmụma’ na-egosi ike ntaramahụhụ dị n’okwu ahụ na ntụnyere ‘ka ukwuu,’ n’etinyeghị ozizi zuru ezu banyere ikpe ikpeazụ nke amaokwu ahụ na-ekwughị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere ihe atụ siri ike nke ‘iripịa ụlọ,’ ebe nkọwa ala peeji na-echekwa ụzọ ndị ọzọ e nwere isi ghọta προφάσει na κρίμα.
