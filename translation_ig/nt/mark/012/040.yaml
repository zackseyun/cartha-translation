    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ikpe ka ukwuu.”
    reason: lexical_alternative
  revision_rationale: The revision replaces the audience-specific phrase with an idiomatic expression for praying ‘for show,’ which better reflects προφάσει while preserving its ambiguity between outward display and pretense. The footnote supplies a closer ‘under a pretext’ alternative. All other wording is retained.
