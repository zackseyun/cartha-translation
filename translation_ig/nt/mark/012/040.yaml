review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the main syntax and imagery: rapaciously consuming widows’ houses, prolonged prayer, and a future greater punitive judgment. However, “ka ndị mmadụ hụ ha” narrows προφάσει to being seen by people. προφάσει more directly expresses doing something under a pretense or for outward display; the reference to ‘people’ is not stated in the Greek.'
  naturalness: The wording is generally clear and suitably formal in Standard Igbo. “Na-ekpekwa ekpere ogologo n’ihi ime ngosi” is a natural, concise way to express the outward-show/pretense sense without adding an explicit audience.
  terminology: “Ndị inyom di ha nwụrụ” is respectful and clear for ‘widows’; “ụlọ” appropriately retains the concrete Greek term. “Ikpe ọmụma ka ukwuu” adequately conveys the condemnatory judicial force of κρίμα, while the footnote retains the broader alternative ‘ikpe.’
  issues:
  - severity: medium
    issue: The main-text rendering of προφάσει adds an unstated audience and does not directly retain the pretense/display nuance.
    rationale: “Ka ndị mmadụ hụ ha” means ‘so that people may see them.’ Although public display may be implied by the context, the Greek says ‘under a pretense/for appearance’s sake,’ not explicitly ‘people.’
  revised_text: ndị na-eripịa ụlọ ndị inyom di ha nwụrụ, na-ekpekwa ekpere ogologo n’ihi ime ngosi[a]—ndị a ga-anata ikpe ọmụma ka ukwuu[b].
