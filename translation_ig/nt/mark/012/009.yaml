source:
  edition: SBLGNT
  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: ig
  text: Gịnị ka onye nwe ubi vaịn ahụ ga-eme? Ọ ga-abịa bibie ndị ọrụ ugbo ndị ahụ, ma nye ndị ọzọ ubi vaịn ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ποιήσει
  choice: Gịnị ka ... ga-eme?
  rationale: Ọ na-egosipụta ajụjụ ọdịnihu n'ụzọ doro anya ma dịkwa n'okike n'Igbo, n'etinyeghị okwu njikọ na-adịghị na Grik.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: onye nwe ubi vaịn ahụ
  rationale: N'ime ilu a, κύριος bụ onye nwe ala ahụ, ọ bụghị aha nsọ; ‘onye nwe’ na-egosi ihe okwu ahụ pụtara n'ọnọdụ a n'enweghị itinye echiche Kraịst n'okwu ahụ.
- source_word: ἀμπελῶνος / ἀμπελῶνα
  choice: ubi vaịn
  rationale: Nke a bụ okwu Igbo doro anya maka ubi a na-akụ mkpụrụ vaịn.
- source_word: ἐλεύσεται
  choice: Ọ ga-abịa
  rationale: Ọ na-edobe ọdịnihu na ike nke ọbịbịa onye nwe ubi ahụ.
- source_word: ἀπολέσει
  choice: bibie
  rationale: ‘Bibie’ na-edobe ịdị njọ nke ikpe ahụ ma ghara ime ka ngwaa ahụ bụrụ naanị ‘gbuo,’ nke dị warara karịa ἀπόλλυμι.
- source_word: τοὺς γεωργούς
  choice: ndị ọrụ ugbo ahụ gbazitere ubi ahụ
  rationale: Ndị a abụghị naanị ndị ọrụ e goro ego; ha na-arụ ubi onye ọzọ dị ka ndị gbazitere ya. Nkebiokwu a na-egosi ma ọrụ ugbo ha ma ọnọdụ mgbazinye ha.
- source_word: δώσει
  choice: nyezie
  rationale: ‘Nye’ bụ ntụgharị kpọmkwem nke δίδωμι; ‘-zie’ na-eme ka usoro ihe omume abụọ ahụ dị n'okike n'Igbo n'agbanweghị isi okwu ahụ.
- source_word: ἄλλοις
  choice: ndị ọzọ
  rationale: Ọ na-ahapụ ndị a na-ekwu maka ha ka ha bụrụ ndị a na-akọwaghị kpọmkwem, dịka Grik si eme.
theological_decisions:
- issue: Ntughari κύριος ebe ọ na-ezo aka n'onye nọ n'ime ilu, ọ bụghị aha Chineke
  choice: onye nwe
  alternative: onyenwe anyị / nna ukwu
  rationale: Ihe a na-ekwu ozugbo bụ onye nwe ubi vaịn ahụ. ‘Onye nwe’ na-ezere ime ka κύριος bụrụ aha nsọ ebe Grik na-eji ya akọwa onye nwe ihe, ma na-ahapụkwa ihe ilu ahụ na-anọchi anya ya ka ọnọdụ gbara ya gburugburu gosi ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị a. ‘Ubi vaịn’ ka a họọrọ maka vineyard, ebe ‘ndị ọrụ ugbo ahụ gbazitere ubi ahụ’ na-eme ka ọnọdụ γεωργοί n'ilu a doo anya n'enweghị ịgbanwe ha ka ha bụrụ naanị ndị ọrụ e goro ego.
