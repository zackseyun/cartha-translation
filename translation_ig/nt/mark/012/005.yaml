  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: ig
  text: Ọ zigara onye ọzọ; ha gbuokwara onye ahụ. Ọ zigakwara ọtụtụ ndị ọzọ—ha tiri ụfọdụ n’ime ha ihe, gbuokwa ụfọdụ n’ime ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλον
  choice: onye ọzọ
  rationale: Nkebi okwu a na-ezo aka n’ohu ọzọ onye nwe ubi ahụ zigara n’usoro ndị o zigara.
- source_word: ἀπέστειλεν
  choice: Ọ zigakwara
  rationale: ‘Zigara’ na-egosipụta omume iziga n'ụzọ doro anya; ‘-kwara’ na-echekwa njikọ na usoro ndị e zigara tupu ya.
- source_word: κἀκεῖνον
  choice: onye ahụ
  rationale: ‘Onye ahụ’ na-echekwa ike ngosipụta nke ἐκεῖνον, ebe ‘-kwa’ dị na ‘gbuokwa’ na-egosipụta echiche mgbakwunye nke καί.
- source_word: ἀπέκτειναν / ἀποκτέννοντες
  choice: ha gbuokwa / gbuokwa
  rationale: ‘Igbu’ bụ okwu Igbo nkịtị ma doo anya maka ime ka mmadụ nwụọ; ọ na-echekwa ịdị njọ nke omume ahụ n’etinyeghị echiche ikpe iwu na-adịghị na isiokwu Grik.
- source_word: πολλοὺς ἄλλους
  choice: ọtụtụ ndị ọzọ
  rationale: Nke a na-ezo aka n’ọtụtụ ndị ozi ọzọ e zigara mgbe ndị a kpọtụrụ aha.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: ụfọdụ ... ụfọdụ
  rationale: Usoro a na-ekesa omume abụọ ahụ n’etiti ndị ozi dị iche iche n'ụzọ kwekọrọ na nkebi Grik.
- source_word: δέροντες
  choice: ha tiri ... ihe
  rationale: ‘Ịkụ mmadụ ihe’ bụ ụzọ Igbo dị ugbu a ma sara mbara isi kwuo iti mmadụ ahụ, n’etinyeghị nkọwa pụrụ iche nke ịpịa ihe dịka ntaramahụhụ iwu.
theological_decisions:
- issue: Ụzọ e si sụgharịa participle ndị dị na nchịkọta ikpeazụ
  choice: 'E jiri ngwaa zuru ezu kwuo ya: ‘ha tiri ụfọdụ ihe, gbuokwa ụfọdụ.’'
  alternative: ‘na-eti ụfọdụ ihe, na-egbukwa ụfọdụ’
  rationale: Participle ndị Grik na-achịkọta ihe e mere ndị ozi dị iche iche. Ngwaa zuru ezu na-eme ka Igbo bụrụ nke okike ma doo anya, n’agbanweghi nkewa ma ọ bụ ịdị njọ nke omume ndị ahụ.
- issue: Ngwaa ‘zigara’ a ghọtara na πολλοὺς ἄλλους
  choice: E kwughachiri ‘Ọ zigakwara’ n’Igbo.
  alternative: 'Ịhapụ ngwaa ahụ dịka Grik si hapụ ya: ‘na ọtụtụ ndị ọzọ’'
  rationale: Grik hapụrụ ngwaa ahụ ka onye na-agụ ya ghọta ya site n’ahịrịokwu bu ụzọ. Ịkwughachi ya n’Igbo na-eme ka ahịrịokwu doo anya n’enweghị ịgbakwunye ihe ọhụrụ n’ihe ọ pụtara.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro ime ihe ike na-abawanye n’ilu ahụ, tinyere ngosipụta nke ‘onye ahụ’ na nkewa ‘ụfọdụ ... ụfọdụ.’
