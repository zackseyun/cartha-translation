id: MRK.12.33
reference: Mark 12:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: ig
  text: na ịhụ ya n’anya site n’obi dum, site ná nghọta dum, na site n’ike dum, na ịhụ onye agbata obi mmadụ n’anya dị ka mmadụ si hụ onwe ya n’anya, bụ ihe karịrị àjà nsure ọkụ niile[a] na àjà niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a sụgharịrị ‘àjà nsure ọkụ’ na-ezo kpọmkwem n’àjà a na-esure ọkụ kpamkpam n’elu ebe ịchụ àjà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: ịhụ … n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ekwu ‘ịhụ n’anya’; ọ na-echekwa ọdịdị ngwaa nke infinitive abụọ ahụ na nhazi ha yiri ibe ha.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’ebe Chineke nọ n’okwu ndị bu ụzọ; ‘ya’ na-echekwa nnọchiaha Grik kama itinye aha ahụ kpọmkwem n’amaokwu a.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: site n’obi dum
  rationale: Ọ na-egosi nraranye zuru ezu nke ime mmadụ. A hapụrụ ya n’ụdị izugbe dịka Grik si dị, n’etinyeghị ‘gị’.
- source_word: συνέσεως
  choice: nghọta
  rationale: ‘Nghọta’ na-egosipụta ikike ịghọta na ịmata ihe nke ọma, ma ghara ime ka σύνεσις bụrụ naanị uche ma ọ bụ ọgụgụ isi.
- source_word: ἰσχύος
  choice: ike
  rationale: ‘Ike’ bụ okwu Igbo doro anya maka ume na ikike mmadụ niile n’ọnọdụ a.
- source_word: πλησίον
  choice: onye agbata obi mmadụ
  rationale: Ọ bụ ezie na Grik dị n’otu mkpụrụ, ihe ọ pụtara bụ izugbe; okwu Igbo a na-egosi onye agbata obi onye ọ bụla.
- source_word: ὡς ἑαυτόν
  choice: dị ka mmadụ si hụ onwe ya n’anya
  rationale: A tụgharịrị reflexive ahụ n’ụdị izugbe, n’emeghị ya okwu a na-agwa onye na-agụ ya kpọmkwem.
- source_word: περισσότερόν ἐστιν
  choice: bụ ihe karịrị
  rationale: Nke a na-echekwa ntụnyere na ịdị elu nke ihe ahụ n’ụzọ Igbo na-ada nke ọma, n’etinyeghị nkọwa ọzọ dịka ‘dị mkpa’.
- source_word: πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν
  choice: àjà nsure ọkụ niile na àjà niile
  rationale: ‘Àjà nsure ọkụ’ na-egosi ụdị àjà a na-akpọ ὁλοκαύτωμα, ebe ‘àjà’ na-anọchi θυσιῶν. ‘Niile’ na-echekwa πάντων.
theological_decisions:
- issue: Mmekọrịta iwu ịhụnanya na ofufe àjà
  choice: Amaokwu ahụ kwuru na ịhụ Chineke n’anya kpamkpam na ịhụ onye agbata obi n’anya karịrị àjà nsure ọkụ na àjà niile.
  alternative: Ịkọwa ya dịka mkpochapụ usoro àjà kpamkpam, ma ọ bụ dịka itinye ịhụnanya na àjà n’otu ọkwa.
  rationale: περισσότερόν ἐστιν na-egosi n’ụzọ doro anya na ịhụnanya ahụ karịrị àjà; ma amaokwu ahụ ekwughị kpọmkwem na a kagbuola usoro àjà. Ya mere, e chekwara esemokwu nkà mmụta okpukpe ahụ n’enweghị idozi ya karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nhazi yiri ibe ya nke infinitive abụọ ahụ na ụdị izugbe nke okwu ahụ. E tinyere akara ntụaka [a] ozugbo n’akụkụ okwu ọ na-akọwa.
