  source_fidelity: 'The translation faithfully preserves the two parallel articular infinitives, the generic pronouns, the threefold totality (heart, understanding, strength), and the explicit comparative force: such love is greater than all whole burnt offerings and sacrifices. The generic wording for neighbor and self is appropriate.'
  naturalness: 'The verse reads naturally in modern Standard Igbo. A small footnote revision is needed: “a na-akpọ ọkụ kpamkpam” is not idiomatic for an offering being wholly consumed by fire; “a na-esure ọkụ kpamkpam” is clear and accurate.'
  terminology: “ịhụ … n’anya,” “nghọta,” “ike,” “onye agbata obi mmadụ,” and “àjà nsure ọkụ” are suitable Standard Igbo renderings. The distinction between whole burnt offerings and other sacrifices is retained without importing a theological conclusion.
