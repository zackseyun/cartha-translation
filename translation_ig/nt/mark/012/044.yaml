  text: πάντες γὰρ ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον, αὕτη δὲ ἐκ τῆς ὑστερήσεως αὐτῆς πάντα ὅσα εἶχεν ἔβαλεν, ὅλον τὸν βίον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: ig
  text: N’ihi na ha niile nyere site n’ihe ha nwere karịrị mkpa ha; ma nwanyị a, site n’ụkọ ya, tinyere ihe niile o nwere—ihe niile ọ ji ebi ndụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ihe niile o nwere maka ndụ ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ
  choice: N’ihi na ha niile
  rationale: “N’ihi na” na-egosi na okwu a na-akọwa ihe e kwuru n’amaokwu bu ya ụzọ; “ha niile” na-edobe nkwusi ike nke πάντες.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: site n’ihe ha nwere karịrị mkpa ha
  rationale: Nkebi a pụtara na ha nyere site n’ihe fọdụrụ mgbe ha nwere ihe zuru ha; nsụgharị a doro ndị na-agụ Igbo anya karịa okwu nkịtị dịka “ụba.”
- source_word: ἔβαλον
  choice: nyere
  rationale: Ọ bụ ezie na βάλλω pụtara itinye ma ọ bụ ịtụba, n’ebe a ọ na-ekwu banyere inye onyinye; “nyere” bụ okwu Igbo e ji ekwu ya n’ụzọ ebumpụta ụwa.
- source_word: αὕτη δὲ
  choice: ma nwanyị a
  rationale: “Ma” na-egosi ọdịiche dị n’etiti nwanyị ahụ na ndị ọzọ; ịkpọ ya “nwanyị a” na-eme ka onye a na-ekwu maka ya doo anya n’Igbo.
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: n’agbanyeghị ụkọ ya
  rationale: ὑστέρησις na-egosi enweghị ihe zuru ezu ma ọ bụ ịda ogbenye. Okwu a na-egosi na o nyere mgbe ọ nọ n’ụkọ, n’enweghị ịgbakwunye nkọwa ụka ọ bụla.
- source_word: πάντα ὅσα εἶχεν ἔβαλεν
  choice: tinyere ihe niile o nwere
  rationale: “Tinyere” na-egosipụta omume itinye ego n’ebe a na-edebe onyinye, ebe “ihe niile o nwere” na-edobe izu oke na nkwusi ike nke Grik.
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: ihe niile ọ ji ebi ndụ
  rationale: N’ọnọdụ a, βίος na-ezo aka n’ihe mmadụ ji akwado ndụ ya, ọ bụghị ndụ anụ ahụ n’onwe ya. Nkebi a bụ Igbo doro anya ma na-edobe ịdị arọ nke onyinye ahụ.
theological_decisions:
- issue: Ihe βίος pụtara n’okwu banyere onyinye nwanyị di ya nwụrụ
  choice: Ihe niile ọ ji ebi ndụ, ya bụ, ihe ọ na-adabere na ya maka ndụ
  alternative: Ndụ ya niile
  rationale: Ebe okwu a gbara gburugburu bụ ego e nyere n’ụlọ akụ onyinye, βίος na-ezo aka n’ihe e ji ebi ndụ. Nke a na-edobe echiche nke na o nyere ihe niile ọ nwere n’ebughị ụzọ kwuo na o nyere ndụ anụ ahụ ya kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọdịiche siri ike dị n’etiti onyinye sitere n’ihe karịrị mkpa na onyinye sitere n’ụkọ.
