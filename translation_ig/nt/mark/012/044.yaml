revisions:
- from: N’ihi na ha niile nyere site n’ihe ha nwere karịrị mkpa ha; ma nwanyị a, n’agbanyeghị ụkọ ya, tinyere ihe niile o nwere—ihe niile ọ ji ebi ndụ.[a]
  to: N’ihi na ha niile nyere site n’ihe ha nwere karịrị mkpa ha; ma nwanyị a, site n’ụkọ ya, tinyere ihe niile o nwere—ihe niile ọ ji ebi ndụ.[a]
  rationale: The revision replaces the concessive expression “n’agbanyeghị” with “site n’ụkọ ya” to represent Greek ἐκ and preserve the contrast between giving from surplus and giving from deprivation. The final phrase and its footnote retain the economic sense of βίος.
  reviewer_model: gpt-5.6-terra
