    text: Ụfọdụ akwụkwọ mgbe ochie enweghị “na-ahapụghị nwa ọ bụla.”
    reason: textual_variant
  revision_rationale: The revision preserves the contextual marital meaning of λαμβάνω while rendering καταλιπών as “leaving behind,” rather than as begetting or bearing. It also adds a textual-variant note for the bracketed words in the SBLGNT source.
