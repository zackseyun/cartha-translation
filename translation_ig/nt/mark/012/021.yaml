  text: καὶ ὁ δεύτερος ἔλαβεν αὐτήν, καὶ ἀπέθανεν ⸂μὴ καταλιπὼν⸃ σπέρμα, καὶ ὁ τρίτος ὡσαύτως·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: ig
  text: Onye nke abụọ lụrụ ya[a], wee nwụọ na-ahapụghị nwa ọ bụla[b]; onye nke atọ mekwara otu ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “were ya”; n’ebe a ọ pụtara ịlụ ya.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ mgbe ochie enweghị “na-ahapụghị nwa ọ bụla.”
    reason: textual_variant
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: onye nke abụọ
  rationale: Ọ bụ aha ọnụọgụ nwere article nke na-arụ ọrụ dị ka aha. A naghị atụkwasị ‘nwanne’ n’amaokwu a, n’ihi na ọ bụ ezie na gburugburu okwu na-egosi ya, okwu ahụ adịghị kpọmkwem na nkebi a.
- source_word: ἔλαβεν αὐτήν
  choice: lụrụ ya
  rationale: Ọ bụ ezie na λαμβάνω pụtara n'ụzọ nkịtị ‘were/nata,’ n’okwu alụmdi na nwunye nwanne di a ọ pụtara ịlụ nwanyị ahụ. ‘Lụrụ ya’ bụ okwu Igbo doro anya ma bụrụkwa nke e ji eme ihe n’ụzọ ebumpụta ụwa; e tinyere nkọwa ala peeji banyere ntụgharị nkịtị.
- source_word: ἀπέθανεν
  choice: nwụọ
  rationale: A sụgharịrị ngwaa ahụ ozugbo dị ka ‘nwụọ,’ nke kwekọrọ n’ụdị akụkọ ahụ dị mfe ma kwụ ọtọ.
- source_word: μὴ καταλιπὼν σπέρμα
  choice: n’amụtaghị nwa
  rationale: N’ọnọdụ iwu alụmdi na nwunye nwanne di, σπέρμα na-ezo aka n’ọmụmụ ma ọ bụ onye a mụrụ, ọ bụghị mkpụrụ n’ụzọ nkịtị. ‘N’amụtaghị nwa’ na-egosipụta na ọ nwụrụ n’enweghị nwa sitere n’alụmdi na nwunye ahụ, ma ọ naghị amanye ọtụtụ ma ọ bụ otu nwa n’asụsụ isi mmalite.
- source_word: ὁ τρίτος ὡσαύτως
  choice: onye nke atọ mekwara otu ahụ
  rationale: Nke a na-edobe mkpirikpi okwu Grik ahụ ma mee ka ihe e zoro aka na ya doo anya n’Igbo ebumpụta ụwa.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘lụrụ ya’ kama ‘were ya’ n’amaokwu bụ isi n’ihi na nke ahụ bụ ụzọ Igbo si ekwu ihe λαμβάνω pụtara n’ọnọdụ a; e debere ọdịdị okwu nkịtị na nkọwa ala peeji.
