  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν ⸀αὐτοῖς· ⸂Τὰ Καίσαρος ἀπόδοτε⸃ Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ. καὶ ⸀ἐξεθαύμαζον ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: ig
  text: Ma Jizọs sịrị ha, “Nyeghachinụ[a] Siza ihe ndị bụ nke Siza, nyekwa Chineke ihe ndị bụ nke Chineke.” Ha wee juru nnọọ anya n’ebe ọ nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Nyenụ Siza ihe ndị bụ nke Siza, nyekwa Chineke ihe ndị bụ nke Chineke.” Ngwaa ahụ nwere ike ịpụta “inyeghachi,” “ịkwụghachi,” ma ọ bụ “inye” ihe ruuru mmadụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Nyeghachinụ
  rationale: Okwu a bụ iwu nye ọtụtụ mmadụ, ọ pụkwara ịpụta inyeghachi ma ọ bụ inye ihe e ji mmadụ ụgwọ. ‘Nyeghachinụ’ na-egosipụta na a ga-enye onye nwe ihe ihe ruuru ya, n’ebughị ụzọ kpachie ya n’ịtụ ụtụ isi naanị.
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: Siza ihe ndị bụ nke Siza
  rationale: Nke a na-echekwa echiche nke ihe ndị nwe Siza na nhazi okwu abụọ ahụ na ibe ha.
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: Chineke ihe ndị bụ nke Chineke
  rationale: Nke a na-eme ka nkebi nke abụọ daba kpọmkwem n’usoro nke mbụ ma ghara ịkọwa ókè ihe Chineke bụ n’ụzọ amaokwu ahụ n’onwe ya na-akọwaghị.
- source_word: ἐξεθαύμαζον
  choice: O jukwara ha nnọọ anya
  rationale: Ngwaa Grik a na-eme ka echiche nke iju anya sie ike; ‘nnọọ’ na-ebute ike ahụ n’Igbo eke.
- source_word: ἐπ’ αὐτῷ
  choice: banyere ya
  rationale: Nke a na-ahapụ ka okwu ahụ zoo ma ọ bụ onye Jizọs n’onwe ya ma ọ bụ azịza ya kpatara iju anya ahụ, dị ka Grik si ekwe omume.
- source_word: δὲ
  choice: Ma
  rationale: ‘Ma’ na-egosi obere ntụgharị ma ọ bụ mmegide dị n’azịza Jizọs n’ime mkparịta ụka ahụ.
- source_word: εἶπεν αὐτοῖς
  choice: sịrị ha
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụ eke isi sụgharịa okwu mmeghe ahụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ihe ruuru ọchịchị obodo na ihe ruuru Chineke
  choice: E debere nkebi abụọ ahụ n’usoro yiri ibe ha, n’etinyeghị nkọwa pụrụ iche banyere mmekọrịta ọchịchị na okpukpe.
  alternative: Ịkọwa ya dị ka nkwado siri ike nye ọchịchị obodo, ma ọ bụ dị ka ibelata ikike Siza.
  rationale: Amaokwu ahụ kwuru na e nwere ihe ndị bụ nke Siza na ihe ndị bụ nke Chineke, ma ọ naghị akọwa ozizi ọchịchị zuru ezu. Nsụgharị ahụ na-echekwa esemokwu echiche na nhazi okwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Siza’ bụ aha eze ukwu Rom a na-amakarị na nsụgharị Igbo. E debere ntụnyere ahịrịokwu abụọ ahụ nke ọma.
