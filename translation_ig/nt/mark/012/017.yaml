- from: Ma Jizọs sịrị ha, “Nyeghachinụ Siza ihe ndị bụ nke Siza, nyekwa Chineke ihe ndị bụ nke Chineke.”[a] O jukwara ha nnọọ anya banyere ya.
  to: Ma Jizọs sịrị ha, “Nyeghachinụ[a] Siza ihe ndị bụ nke Siza, nyekwa Chineke ihe ndị bụ nke Chineke.” Ha wee juru nnọọ anya n’ebe ọ nọ.
  rationale: The revision retains the draft’s faithful rendering of the two balanced imperatives and its choice of ‘Nyeghachinụ’ for ἀπόδοτε. It revises the reaction clause to a more idiomatic Standard Igbo expression that directly reflects amazement at Jesus, and moves the footnote marker to the verb addressed by the note.
  reviewer_model: gpt-5.6-terra
