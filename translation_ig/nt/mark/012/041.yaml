  text: Καὶ ⸀καθίσας ⸀κατέναντι τοῦ γαζοφυλακίου ἐθεώρει πῶς ὁ ὄχλος βάλλει χαλκὸν εἰς τὸ γαζοφυλάκιον· καὶ πολλοὶ πλούσιοι ἔβαλλον πολλά·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/041.yaml
  text: And sitting opposite the treasury[a], he was watching how the crowd was putting money into the treasury; and many rich people were putting in much.
translation:
  language: ig
  text: Jizọs nọdụrụ ala n’ebe chere ebe a na-edebe onyinye[a] ihu, na-ele otú igwe mmadụ ahụ si etinye mkpụrụ ego ọla kọpa n’ebe a na-edebe onyinye ahụ; ọtụtụ ndị ọgaranya na-etinyekwa ọtụtụ ego.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “igbe onyinye” ma ọ bụ “ebe a na-edebe akụ ụlọ nsọ.” Okwu Grik ahụ nwere ike izo aka n’ebe a na-edebe akụ ụlọ nsọ ma ọ bụ n’igbe onyinye ndị e jikọtara na ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθίσας
  choice: Mgbe Jizọs nọsịrị ala
  rationale: Aorist participle na-esetịpụ ọnọdụ tupu omume bụ isi; ntụgharị a bụ Igbo e ji eme ihe nke ọma ma mee ka onye a na-ekwu banyere ya doo anya site n’okwu gbara amaokwu a gburugburu.
- source_word: κατέναντι
  choice: n’ihu
  rationale: Na-egosi na ọ nọ n’akụkụ chere ebe ahụ ihu; nke a bụ okwu Igbo dị nkenke ma bụrụ ihe a na-aghọta ngwa ngwa.
- source_word: γαζοφυλάκιον
  choice: ebe a na-edebe onyinye
  rationale: Okwu Grik ahụ nwere ike ịpụta ebe akụ ụlọ nsọ dị ma ọ bụ igbe ndị e ji anata onyinye; nhọrọ a bụ nke sitere n’ọnọdụ amaokwu ahụ ma ghara ikwubi kpọmkwem ụdị ihe ahụ.
- source_word: ἐθεώρει
  choice: ọ nọ na-ele
  rationale: Ụdị imperfect na-egosi omume gara n’ihu ruo oge ụfọdụ; ‘nọ na-ele’ na-echekwa akụkụ ahụ.
- source_word: πῶς
  choice: otú ... si
  rationale: Na-echekwa uche nke ileba anya n’ụzọ ma ọ bụ usoro ndị mmadụ si enye, ọ bụghị nanị eziokwu na ha nyere.
- source_word: ὄχλος
  choice: igwe mmadụ ahụ
  rationale: Ọ bụ ntụgharị Igbo doro anya nke otu ìgwè mmadụ gbakọtara.
- source_word: βάλλει / ἔβαλλον
  choice: si etinye / nọkwa na-etinye
  rationale: N’ọnọdụ itinye ego n’ebe onyinye dị, ‘itinye’ bụ Igbo ebumpụta ụwa; ‘nọ na-’ na-echekwa imperfect nke ἔβαλλον.
- source_word: χαλκόν
  choice: ego
  rationale: Ọ bụ ezie na okwu ahụ pụtara ọla kọpa ma nwee ike izo aka ná mkpụrụ ego ọla kọpa, n’ọnọdụ a ọ na-arụ ọrụ dị ka okwu maka ego a na-enye.
- source_word: πολλοὶ πλούσιοι
  choice: ọtụtụ ndị ọgaranya
  rationale: Na-ezipụta ọtụtụ ndị nwere akụ n’Igbo dị ugbu a ma ghara ịgbakwunye nkọwa nwoke ebe okwu ahụ nwere ike izo aka n’ụdị mmadụ n’ozuzu.
- source_word: πολλά
  choice: nnukwu ego
  rationale: Neuter plural a pụtara nnukwu ọnụọgụ n’ọnọdụ ego; ‘nnukwu ego’ bụ Igbo doro anya ma dị mma karịa ntụgharị nkịtị nke ‘ọtụtụ ihe.’
