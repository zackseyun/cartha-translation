translation_notes:
  register: Standard Igbo dị ugbu a, kwanyere ugwu, ma dị mfe nghọta. E ji ‘ebe a na-edebe onyinye’ mee ka ọrụ ebe ahụ pụta ìhè, ebe nkọwa ala peeji na-echekwa obosara na mgbagwoju anya nke γαζοφυλάκιον.
