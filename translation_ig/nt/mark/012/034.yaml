  source_fidelity: 'Ahịrịokwu mbụ na-atụgharị ἰδὼν ... ὅτι νουνεχῶς ἀπεκρίθη n’ụzọ kwesịrị ekwesị: Jizọs hụrụ na nwoke ahụ zara n’amamihe. “Ị nọghị n’ebe dị anya site n’alaeze Chineke” na-echekwa Οὐ μακρὰν εἶ ἀπὸ na-enweghị ikwu na ọ banyela n’alaeze ahụ. N’ahịrịokwu ikpeazụ, “Mgbe ahụ, ọ dịghị onye ọzọ nwara” anaghị akọwa οὐκέτι nke ọma, n’ihi na ọ na-egosi naanị ‘mgbe ahụ’ na ‘onye ọzọ,’ karịa ‘ọ dịkwaghị onye ọbụla,’ ma ọ naghị egosipụtakwa ἐτόλμα (‘dared’) nke ọma.'
