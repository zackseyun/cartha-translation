  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: ig
  text: Mgbe Jizọs hụrụ na ọ zara n’amamihe, ọ sịrị ya, “Ị nọghị n’ebe dị anya site n’alaeze Chineke.”[a] Ọ dịkwaghị onye ọbụla nwere obi ike ịjụ ya ajụjụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ị nọ nso n’alaeze Chineke.” Okwu Grik na-ekwu maka ịdị nso; ọ naghị ekwu kpọmkwem na onye ahụ abanyela n’alaeze ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Mgbe ... hụrụ
  rationale: A sụgharịrị participle ahụ dịka ahịrịokwu oge nke na-ada nke ọma n’Igbo ma na-egosi na okwu Jizọs sochiri ihe ọ chọpụtara n’azịza nwoke ahụ.
- source_word: νουνεχῶς
  choice: n’amamihe
  rationale: Nke a na-egosi ezi nghọta na uche ziri ezi dị n’azịza ahụ, n’asụsụ Igbo dị mfe ma kwanyere ugwu.
- source_word: ἀπεκρίθη
  choice: ọ zara
  rationale: Usoro okwu Igbo na-eme ka usoro ihe ndị a doo anya n’enweghị mkpa iji ụdị past perfect Bekee.
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: Ị nọghị n’ebe dị anya site na
  rationale: Nke a na-echekwa ihe atụ gbasara ịdị nso n’enweghị ikwu na nwoke ahụ abanyelarị n’alaeze ahụ.
- source_word: βασιλείας τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma ma na-echekwa echiche nke ọchịchị na ógbè ọchịchị Chineke.
- source_word: οὐκέτι
  choice: Mgbe ahụ, ọ dịghị onye ọzọ
  rationale: Nke a na-egosi na site n’oge ahụ gaa n’ihu, ajụjụ ndị ahụ kwụsịrị.
- source_word: ἐτόλμα
  choice: nwara
  rationale: N’usoro a, ‘nwara’ na-egosi na ọ dịghị onye nwere obi ike ime ya, ma na-ada n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: ἐπερωτῆσαι
  choice: ịjụ ya ajụjụ
  rationale: Nke a na-egosi ịjụ Jizọs ajụjụ n’ọnọdụ esemokwu ahụ, n’enweghị ime ka ọ bụrụ ajụjụ ọnụ siri ike karịa ihe Grik kwuru.
theological_decisions:
- issue: Ọnọdụ odeakwụkwọ ahụ n’ihe gbasara alaeze Chineke
  choice: Ị nọghị n’ebe dị anya site n’alaeze Chineke
  alternative: Ị nọ nso n’alaeze Chineke
  rationale: 'Grik kwuru na ọ nọ nso, ma o kwughị na ọ banyelarị. Nsụgharị a na-echekwa esemokwu ahụ: Jizọs toro nghọta ya ma o kwupụtaghị na ọ nọworị n’ime alaeze ahụ.'
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma kwanyere ugwu. E ji ‘Jizọs’ na ‘alaeze Chineke’ dịka okwu ndị a maara nke ọma. Enweghị akara nkọwa ala peeji n’ahịrịokwu a, n’ihi na nhọrọ ọzọ nke Bekee e nyere adịghị akọwa ọdịiche pụtara ìhè n’Igbo karịa ederede bụ isi.
