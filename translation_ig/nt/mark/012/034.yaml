  terminology: “Jizọs,” “n’amamihe,” na “alaeze Chineke” dabara n’ọrụ Akwụkwọ Nsọ Igbo ma na-echekwa aha na okwu bụ isi nke Grik. Ekwesịrị itinye akara nkọwa ala peeji maka nhọrọ “Ị nọ nso n’alaeze Chineke,” nke na-echekwa ụzọ ọzọ a kpọrọ aha n’audit trail na enweghị ikwu na mmadụ abanyela n’alaeze ahụ.
