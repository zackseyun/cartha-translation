  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a servant to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: ig
  text: Mgbe oge kwesịrị ekwesị ruru, o zigara ndị na-akọ ubi vaịn ahụ[b] otu ohu[a], ka o si n’aka ndị na-akọ ubi vaịn ahụ nata ụfọdụ n’ime mkpụrụ ubi vaịn ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “otu onye na-ejere ya ozi.” Okwu Grik bụ δοῦλος, nke na-ezo aka n’ohu, ya bụ, onye nọ n’okpuru ikike nna ya ukwu.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “ndị ọrụ ubi” ma ọ bụ, n’akụkọ ihe atụ a, “ndị mgbazinye ubi.” Okwu Grik γεωργοί na-ezo kpọmkwem n’ebe ndị na-arụ ala nọ; “ndị mgbazinye ubi” na-egosi ọrụ ha n’akụkọ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: o zigara
  rationale: Ọ bụ okwu nkịtị na Igbo maka iziga onye, ma na-egosipụta omume aorist ahụ n'ụzọ doro anya.
- source_word: γεωργούς / γεωργῶν
  choice: ndị na-akọ ubi vaịn
  rationale: γεωργός bụ onye na-arụ ala; ebe a bụ ubi vaịn, ya mere okwu a na-edobe nkọwa gburugburu ahụ n’etinyeghị echiche ‘ndị mgbazinye’ nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: τῷ καιρῷ
  choice: mgbe oge kwesịrị ekwesị ruru
  rationale: Nke a na-egosi oge dabara adaba ma ọ bụ oge a kara aka, ikekwe oge owuwe ihe ubi, n’etinyeghị nkọwa karịrị ihe Grik kwuru.
- source_word: δοῦλον
  choice: otu ohu
  rationale: δοῦλος na-egosi onye nọ n’okpuru nwe ya, ọ bụghị naanị onye ọrụ ụlọ; ‘ohu’ na-echekwa ọnọdụ mmekọrịta ahụ n’ụzọ kpọmkwem.
- source_word: ἵνα ... λάβῃ
  choice: ka ... nata
  rationale: ‘Ka’ na-egosipụta ebumnuche nkebiokwu ἵνα, ‘nata’ na-ekwupụta λάβῃ n’ụzọ eke n’Igbo.
- source_word: παρὰ τῶν γεωργῶν
  choice: si n’aka ndị na-akọ ubi vaịn ahụ
  rationale: παρά tinyere genitive na-egosi ebe ihe si; ‘si n’aka’ bụ ụzọ Igbo si ekwu nke a nke ọma.
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: ụfọdụ mkpụrụ nke ubi vaịn ahụ
  rationale: ἀπό tinyere genitive ebe a nwere echiche nke iwere akụkụ n’ime ihe niile; ‘ụfọdụ’ na-eme ka echiche partitive ahụ doo anya n’etinyeghị ‘òkè ya,’ nke adịghị n’okwu Grik.
- source_word: ἀμπελῶνος
  choice: ubi vaịn
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa kpọmkwem maka ubi a na-akụ osisi vaịn.
theological_decisions: []
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ugboro abụọ nke ‘ndị na-akọ ubi vaịn’ dịka ọ dị na Grik, ma jiri ‘ohu’ chekwaa ọnọdụ mmekọrịta δοῦλος. Akara ndetu ala ala [a] na [b] abụọ pụtara n’ahụ ederede.
