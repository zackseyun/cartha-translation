id: MRK.12.29
reference: Mark 12:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: ig
  text: 'Jizọs zara, sị, “Nke mbụ bụ: ‘Nụrụ, Izrel: Onyenwe[b], Chineke anyị, Onyenwe bụ otu[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Onyenwe, Chineke anyị, bụ otu Onyenwe,” ma ọ bụ, “Onyenwe bụ Chineke anyị; ọ bụ naanị Onyenwe.” Okwu Grik a na-emegharị ụda Diuterọnọmi 6:4, ọ pụkwara imesi ike na Chineke bụ otu, na ọ bụ naanị ya bụ Onyenwe anyị, ma ọ bụ ha abụọ.
    reason: alternative_reading
  - marker: b
    text: Ebe ahịrịokwu a bụ ihe e hotara na Shema (Diuterọnọmi 6:4), “Onyenwe” n'ebe a bụ ntụgharị okwu Grik κύριος, nke Septuagint ji anọchi aha Chineke YHWH.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara, sị
  rationale: Nke a bụ ụzọ Igbo si akọ mkparịta ụka n'ụzọ eke; ọ na-egosikwa na Jizọs nyere azịza.
- source_word: Πρώτη
  choice: Nke mbụ
  rationale: Adjective a na-anọchi aha ‘iwu’ nke a ghọtara site n'amaokwu gbara ya gburugburu; ntụgharị a anaghị etinye ihe karịrị ihe ederede kwuru.
- source_word: Ἄκουε
  choice: Nụrụ
  rationale: Ọ bụ iwu e nyere otu onye ma na-ejigide ụda mmalite Shema dị na Diuterọnọmi 6:4; ọ pụtara ka Izrel gee ntị ma nabata okwu ahụ.
- source_word: Ἰσραήλ
  choice: Izrel
  rationale: Aha a ka e dere n'ụdị a na-ejikarị ede ya n'Igbo, ma debe ya dịka okwu a na-akpọ ndị Izrel kpọmkwem.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa κύριος dịka aha nsọpụrụ Chineke. N'ebe a, ọ na-anọchi anya YHWH n'okwu sitere na Shema; e debere nkọwa ahụ n'okpuru peeji.
- source_word: θεὸς ἡμῶν
  choice: Chineke anyị
  rationale: Ọ na-egosipụta n'ụzọ doro anya ma dịkwa eke na Igbo na Chineke bụ Chineke nke ndị na-ekwu okwu.
- source_word: εἷς
  choice: otu
  rationale: Ọ na-anọgide nso n'okwu Grik ma ghara ikpebi n'ụzọ siri ike ma ihe a na-emesi ike bụ ịdị n'otu nke Chineke, ịbụ naanị ya, ma ọ bụ ha abụọ.
theological_decisions:
- issue: Otú e si sụgharịa akụkụ ikpeazụ nke Shema n'enweghị iwepụ nghọta ya karịrị otu
  choice: Onyenwe anyị, Chineke anyị, Onyenwe anyị bụ otu
  alternative: “Onyenwe anyị, Chineke anyị, bụ otu Onyenwe anyị,” ma ọ bụ “Onyenwe anyị bụ Chineke anyị; ọ bụ naanị Onyenwe anyị”
  rationale: Nhazi okwu Grik na-ekwe ka a ghọta nkwupụta ahụ dịka ikwupụta ịdị n'otu Chineke, ịbụ naanị ya kwesịrị ofufe, ma ọ bụ ha abụọ. Isi ederede na-agbaso usoro Grik nke ọma, ebe nkọwa [a] na-edebe ụzọ nghọta ndị ọzọ.
- issue: κύριος dịka nnọchi aha Chineke na Shema
  choice: Onyenwe anyị
  alternative: YHWH
  rationale: Mak dere κύριος, dịka Septuagint si eji ya dochie aha Chineke YHWH na Diuterọnọmi 6:4. A hapụrụ κύριος dịka aha nsọpụrụ n'isi ederede, ma kọwaa ndabere aha ọgbụgba ndụ ahụ na nkọwa [b].
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, nke dị ùgwù ma dị mfe nghọta. “Nụrụ, Izrel” na-edebe ụda iwu na nkwupụta ọgbụgba ndụ nke Shema. E tinyere akara [a] n'akụkụ okwu ọ na-akọwa, tinyekwa [b] ozugbo n'akụkụ “Onyenwe anyị.”
