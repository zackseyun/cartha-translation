  text: ⸀δευτέρα αὕτη· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: ig
  text: 'Nke abụọ bụ nke a: “Ị ga-ahụ onye agbata obi gị n’anya dịka onwe gị.” Ọ dịghị iwu ọzọ dị ukwuu karịa iwu ndị a.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ kacha soro okwu Grik: “Ọ dịghị iwu ọzọ dị ukwuu karịa ndị a.” N’okwu gbara ya gburugburu, “ndị a” na-ezo aka n’iwu abụọ ahụ ọnụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: Nke abụọ bụ nke a
  rationale: Nke a na-egosipụta okwu Grik ahụ e mere mkpụmkpụ, na-etinye ‘bụ’ iji mee ka Igbo doo anya, ma na-ejikọ ya na iwu nke mbụ dị n’okwu gbara ya gburugburu.
- source_word: Ἀγαπήσεις
  choice: Ị ga-ahụ ... n’anya
  rationale: Ọdịdị ngwaa ọdịnihu n’ebe a na-arụ ọrụ dịka iwu n’ihe e hotara n’Akwụkwọ Nsọ; ‘Ị ga-ahụ ... n’anya’ na-edobe ike iwu ahụ n’Igbo dị ùgwù ma dịkwa eke.
- source_word: τὸν πλησίον σου
  choice: onye agbata obi gị
  rationale: Nke a bụ okwu Igbo a na-ahụkarị maka πλησίον n’ọnọdụ gbasara omume ọma, ọ na-echekwa njikọ ya na Levitikọs 19:18 n’enweghị ịgbasa ihe odide ahụ.
- source_word: ὡς σεαυτόν
  choice: dịka onwe gị
  rationale: Ọ na-edobe ntụnyere dị mkpụmkpụ nke Grik n’etinyeghị nkọwa ọzọ dịka ‘dịka ị hụrụ onwe gị n’anya.’
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: Ọ dịghị iwu ọzọ dị ukwuu karịa iwu abụọ ndị a
  rationale: Nke a na-edobe ntụnyere μείζων na ọtụtụ nke τούτων. Itinye ‘iwu abụọ’ na-eme ka onye Igbo ghọta na ‘ndị a’ na-ezo aka n’iwu abụọ ahụ e kwuru n’okwu gbara amaokwu a gburugburu.
- source_word: ἐντολή
  choice: iwu
  rationale: ‘Iwu’ bụ okwu Igbo eke ma dị ùgwù nke na-egosipụta iwu e nyere mmadụ ka o debe, ma dabara n’ọnọdụ iwu Torah a na-ekwu maka ya.
theological_decisions:
- issue: Ihe τούτων (‘ndị a’) na-ezo aka na ya n’ahịrị ikpeazụ
  choice: Ọ na-ezo aka n’iwu abụọ ahụ ọnụ
  alternative: Ọ na-ezo naanị n’iwu nke abụọ e kwuru ozugbo tupu ya, n’ụzọ a na-ekwu n’ozuzu
  rationale: Ụdị ọtụtụ nke okwu ngosi Grik ahụ na-ezo n’ụzọ kachasị eke n’iwu abụọ ahụ a tụlere n’okwu gbara ya gburugburu. Nsụgharị ahụ na-echekwa ihe a n’agbanweghị ya ka ọ bụrụ otu iwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ị ga-ahụ ... n’anya’ na-echekwa olu iwu nke ihe e hotara n’Akwụkwọ Nsọ; e zere okwu pụrụ iche nke otu ụka ma ọ bụ nkọwa na-abụghị nke ederede.
