source:
  edition: SBLGNT
  text: καὶ ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς διανοίας σου καὶ ἐξ ὅλης τῆς ἰσχύος ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: ig
  text: Ị ga-eji obi gị dum na mkpụrụ obi gị dum[a], na uche gị dum[b], na ike gị dum[c] hụ Onyenwe, bụ Chineke gị, n’anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndụ gị dum,” n’ọnọdụ “mkpụrụ obi gị dum” (ψυχῆς).
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nghọta gị dum,” n’ọnọdụ “uche gị dum” (διανοίας).
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ume gị dum,” n’ọnọdụ “ike gị dum” (ἰσχύος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: Ị ga-… hụ … n’anya
  rationale: Ụdị ọdịnihu a na-arụ ọrụ dị ka iwu n’amaokwu e hotara. “Ị ga-… hụ … n’anya” na-edobe ọdịdị ahụ ma na-ada ka Igbo doro anya.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị asụ κύριος n’Igbo, ma na-edobe ụda nke okwu ọgbụgba ndụ dị na “Onyenwe anyị Chineke gị.”
- source_word: θεόν
  choice: Chineke
  rationale: Nke a bụ okwu Igbo a na-ejikarị asụ θεός.
- source_word: ἐξ
  choice: jiri
  rationale: N’agbanyeghị na ἐξ pụtara n’ụzọ nkịtị “site na,” n’usoro okwu a “jiri” na-egosi na mmadụ ga-eji akụkụ onwe ya niile hụ Chineke n’anya, ma ọ bụ Igbo ebumpụta ụwa.
- source_word: ὅλης
  choice: dum
  rationale: '“Dum” na-egosi izu oke ma na-adaba nke ọma mgbe e mesịrị aha na nnọchiaha nwe: “obi gị dum.” E kwughachiri ya dịka e mere na Grik.'
- source_word: καρδίας
  choice: obi
  rationale: “Obi” bụ okwu kwekọrọ ekwekọ nke na-anọchi etiti mmetụta, ọchịchọ, na ndụ ime mmadụ n’enweghị ịkọwa ya karịa ederede.
- source_word: ψυχῆς
  choice: mkpụrụ obi
  rationale: ψυχή nwere ike ịpụta mkpụrụ obi, ndụ, ma ọ bụ onwe mmadụ. “Mkpụrụ obi” na-edobe ọdịiche dị n’etiti okwu anọ ahụ; e nyere “ndụ” dị ka nhọrọ n’ala ala peeji.
- source_word: διανοίας
  choice: uche
  rationale: “Uche” bụ okwu Igbo ebumpụta ụwa maka ikike iche echiche; “nghọta” ka e nyere dị ka nhọrọ.
- source_word: ἰσχύος
  choice: ike
  rationale: “Ike” na-egosi strength ma ọ bụ might n'ụzọ doro anya; e nyere ụzọ ọzọ n’ala ala peeji.
- source_word: καὶ … καὶ … καὶ … καὶ
  choice: na … na … na … na
  rationale: E debere njikọ ndị a ugboro ugboro iji chekwaa usoro na-emekọ ọnụ na nkwusi ike nke Grik.
theological_decisions:
- issue: Nsụgharị κύριος n’iwu ahụ e hotara
  choice: Onyenwe anyị
  alternative: Onyenwe; Nna ukwu
  rationale: “Onyenwe anyị” kwekọrọ n’iji κύριος eme ihe n’Agba Ọhụrụ ma na-echekwa nkuzi nke okwu ahụ sitere n’okwukwe Izrel, n’etinyeghị usoro mkpụrụedemede pụrụ iche na-adịghị na Grik.
- issue: Okwu anọ na-akọwa mmadụ n’iwu ahụ
  choice: obi / mkpụrụ obi / uche / ike
  alternative: obi / ndụ / nghọta / ume
  rationale: E chekwara okwu anọ dị iche iche kama ijikọta ha n’otu echiche gbasara mmadụ niile. Nke a na-edobe nkwusi ike na mgbagwoju echiche nke ederede banyere ịhụ Chineke n’anya site n’akụkụ mmadụ niile.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A haziri ahịrịokwu ahụ ka “jiri” malite usoro ihe anọ ahụ, ebe “hụ … n’anya” mechiri ya dịka usoro ngwaa Igbo si dị. E debere “dum” na “na” ugboro ugboro iji gosipụta izu oke na nkwusi ike nke isi mmalite.
