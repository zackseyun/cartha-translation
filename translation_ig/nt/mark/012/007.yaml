  text: ἐκεῖνοι δὲ οἱ γεωργοὶ ⸂πρὸς ἑαυτοὺς εἶπαν⸃ ὅτι Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτόν, καὶ ἡμῶν ἔσται ἡ κληρονομία.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: ig
  text: Ma ndị ọrụ ubi ahụ, ndị gbazitere ubi ahụ, gwara ibe ha[a], sị, “Onye a bụ onye nketa. Bịanụ, ka anyị gbuo ya, ihe nketa ahụ ga-abụkwa nke anyị[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kwuru n'etiti onwe ha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe nketa ahụ ga-abụ ihe anyị nwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ οἱ γεωργοὶ
  choice: Ma ndị ọrụ ubi ahụ bụ́ ndị nwe ubi n'ọrụ mgbazinye
  rationale: “Ma” na-egosipụta ntụgharị dị nro nke δέ; “ndị ọrụ ubi ahụ bụ́ ndị nwe ubi n'ọrụ mgbazinye” na-eme ka o doo anya na γεωργοί bụ ndị na-arụ ubi vaịn ahụ n'okpuru onye nwe ya, ọ bụghị naanị ndị ọrụ ugbo nkịtị.
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: gwara ibe ha
  rationale: Nke a na-egosipụta mkparịta ụka dị n'etiti ndị otu ahụ; ọ bụkwa okwu Igbo nkịtị ma doo anya.
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: Onye a bụ onye nketa
  rationale: “Onye nketa” bụ okwu Igbo doro anya maka κληρονόμος, ebe “Onye a” na-edobe ike nke Οὗτός.
- source_word: δεῦτε ἀποκτείνωμεν αὐτόν
  choice: Bịanụ, ka anyị gbuo ya
  rationale: “Bịanụ” na-ebute òkù agbamume nke δεῦτε, ebe “ka anyị gbuo ya” na-edobe atụmatụ agbamume nke subjunctive n'ụzọ kwụ ọtọ, na-agbakwụnyeghị echiche iwu nke “igbu ọchụ.”
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: ihe nketa ahụ ga-abụkwa nke anyị
  rationale: Nke a na-edobe nkwusi ike nke ἡμῶν ma ghara ịgbakwunye “nke ya,” nke na-adịghị n'okwu Grik.
theological_decisions:
- issue: Nkọwa γεωργοί n'ilu ubi vaịn
  choice: ndị ọrụ ubi ahụ bụ́ ndị nwe ubi n'ọrụ mgbazinye
  alternative: ndị ọrụ ubi; ndị na-elekọta ubi vaịn
  rationale: Nhọrọ a na-egosi mmekọrịta ha na onye nwe ubi dịka ndị natara ubi ka ha rụọ ma kwụọ ụgwọ ya, n'enweghị itinye nkọwa ihe atụ ma ọ bụ ozizi ọzọ n'amaokwu ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị nsọ ma dị mfe nghọta. A họọrọ “gwara ibe ha” maka okwu ọnụ dị n'etiti otu ahụ, ma debe akara ụkwụ [a] na [b] kpọmkwem n'ahịrịokwu.
