review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the seven male siblings, the first brother's marriage, his death, and the absence of progeny. However, “nwa ọ bụla” is restricted to ‘any child’ and can unnecessarily narrow σπέρμα, which in this context denotes offspring/progeny and can include descendants.
  naturalness: The sentence is clear and natural in modern Standard Igbo. “Ụmụnne nwoke asaa dị” and “Onye mbụ lụrụ nwanyị” read well. “Ọ hapụghị ụmụ” is also idiomatic in a death-and-progeny context.
  terminology: Use “ụmụ” for σπέρμα to retain its collective, potentially broader progeny sense. The footnote should identify “mkpụrụ” as the literal lexical rendering and explain its idiomatic familial sense without the awkward phrase “ụmụ ndị mmadụ mụrụ.”
  issues:
