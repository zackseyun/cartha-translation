    issue: “nwa ọ bụla” renders σπέρμα too narrowly.
    rationale: σπέρμα is collective ‘seed,’ idiomatically offspring/progeny. Although ‘no child’ fits the immediate scenario, it may limit the source term's broader familial/legal scope more than necessary.
  - severity: low
    issue: The footnote's explanation is not fully idiomatic Standard Igbo.
    rationale: “nwa ma ọ bụ ụmụ ndị mmadụ mụrụ” is awkward and redundantly phrased. “ụmụ ma ọ bụ ụmụazụ” expresses the intended semantic range more naturally.
