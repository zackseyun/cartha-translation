base_translation:
  language: en
  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: ig
  text: Ụmụnne nwoke asaa dị. Onye mbụ lụrụ nwanyị, ma mgbe ọ nwụrụ, ọ hapụghị ụmụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “mkpụrụ.” N’asụsụ Grik, a na-eji okwu a ebe a ekwu maka ụmụ ma ọ bụ ụmụazụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: Ụmụnne nwoke asaa dị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo na e nwere ụmụnne asaa; “nwoke” na-egosi na ha niile bụ ndị ikom dịka ọnọdụ alụmdi na nwunye n’akụkọ a chọrọ.
- source_word: ὁ πρῶτος
  choice: Onye mbụ
  rationale: Ọ na-egosi onye mbụ n’usoro ụmụnne ahụ, n’etinyeghị echiche na ọ bụ ya kacha okenye.
- source_word: ἔλαβεν γυναῖκα
  choice: lụrụ nwaanyị
  rationale: Nke a bụ okwu Igbo e ji ekwu n'ụzọ nkịtị na nwoke batara n’alụmdi na nwunye; ọ na-enye isi okwu Grik ahụ nke ọma n’enweghị ntụgharị siri ike nghọta.
- source_word: ἀποθνῄσκων
  choice: mgbe ọ nwụrụ
  rationale: A tụgharịrị participle ahụ dịka nkebiokwu oge, nke bụ ụzọ Igbo dị mma ma na-egosi njikọ ya na ihe sochiri.
- source_word: οὐκ ἀφῆκεν
  choice: ọ hapụghị
  rationale: N’ọnọdụ a, okwu ahụ pụtara na ọ hapụghị onye ga-abụ ụmụ ya mgbe ọ nwụrụ.
- source_word: σπέρμα
  choice: nwa ọ bụla
  rationale: Ọ bụ ezie na okwu Grik ahụ pụtara “mkpụrụ” n’ụzọ nkịtị, n’ọnọdụ ezinụlọ na iwu a ọ na-ezo aka n’ọmụmụ ma ọ bụ onye sitere n’ahụ ya. “Nwa ọ bụla” doro ndị na-agụ Igbo anya, ebe ndetu ala na-echekwa ihe oyiyi dị n’okwu Grik.
