  text: ⸂ἔφη αὐτοῖς ὁ Ἰησοῦς⸃· Οὐ διὰ τοῦτο πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: ig
  text: 'Jizọs sịrị ha[a], “Ọ̀ bụghị n’ihi nke a ka unu ji ehie ụzọ: n’ihi na unu amaghị Akwụkwọ Nsọ ma ọ bụ ike Chineke?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “Ọ̀ bụghị n’ihi nke a ka unu ji akpafu: n’ihi na unu amaghị Akwụkwọ Nsọ ma ọ bụ ike Chineke?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: Jizọs sịrị ha
  rationale: Nke a na-asụgharị φημί n'ụzọ dị mfe dị ka ‘sịrị,’ na-agbakwụghị echiche ‘zara’ nke okwu Grik ahụ n'onwe ya ekwughị kpọmkwem.
- source_word: Οὐ διὰ τοῦτο
  choice: Ọ̀ bụghị nke a mere
  rationale: Ajụjụ nkwenye a na-atụ anya ka ndị na-ege ntị kweta; ‘ọ̀ bụghị nke a mere’ na-egosipụta ma ajụjụ ahụ ma ihe kpatara ya n'Igbo eke.
- source_word: πλανᾶσθε
  choice: unu ji ehie ụzọ
  rationale: ‘Ehie ụzọ’ na-edobe ohere okwu Grik nwere ịpụta ịbụ onye na-ezighị ezi ma ọ bụ ịkpafu, na-ekwusighị ike na onye ọzọ ghọgburu ha.
- source_word: μὴ εἰδότες
  choice: n’ihi na unu amaghị
  rationale: Nkebi participle ahụ na-enye ihe kpatara njehie ha; nkebi ihe kpatara ya bụ ụzọ doro anya ma bụrụkwa Igbo eke.
- source_word: τὰς γραφὰς
  choice: Akwụkwọ Nsọ
  rationale: N'ọnọdụ ndị Juu na Ndị Kraịst oge mbụ, ọtụtụ γραφαί na-ezo aka n'akwụkwọ nsọ ndị a nabatara; ‘Akwụkwọ Nsọ’ bụ okwu Igbo a maara nke ọma.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: unu amaghịkwa ike Chineke
  rationale: ‘Ike Chineke’ na-asụgharị δύναμις τοῦ θεοῦ ozugbo, ebe -kwa na-ejikọta ihe abụọ ahụ n'ụzọ Igbo dị mma.
theological_decisions:
- issue: Ụdị njehie πλανᾶσθε na-akọwa
  choice: unu ji ehie ụzọ
  alternative: a na-eduhie unu / unu na-akpafu
  rationale: Okwu Grik ahụ nwere ike ịpụta ịbụ onye na-ezighị ezi, ịbụ onye e duhiere, ma ọ bụ ịkpafu. Ihe gbara ya gburugburu metụtara nghọtahie ha banyere mbilite n'ọnwụ, Akwụkwọ Nsọ, na ike Chineke; nhọrọ a na-edobe mba Jizọs baara ha n'etinyeghị nkọwa ozizi karịrị amaokwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ajụjụ nkwenye ahụ na ụda ịba mba dị n'okwu Jizọs ka echekwara; e tinyere akara ụda naanị n'okwu ajụjụ ‘Ọ̀’ iji gbochie mgbagwoju anya.
