id: MRK.12.25
reference: Mark 12:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: ig
  text: N’ihi na mgbe ha ga-esi n’etiti ndị nwụrụ anwụ bilie, ha agaghị alụ di ma ọ bụ nwunye, a gaghịkwa enye ha n’alụmdi na nwunye; kama ha ga-adị ka ndị mmụọ ozi nọ n’eluigwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: N’ihi na mgbe
  rationale: “N’ihi na” na-egosipụta ọrụ nkọwa nke γάρ, ebe “mgbe” na-edobe ihe oge nke ὅταν n’ụzọ Igbo doro anya.
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: ha ga-esi n’etiti ndị nwụrụ anwụ bilie
  rationale: “Bilie” kwekọrọ n’ụdị ngwaa active nke ἀναστῶσιν, “site n’etiti ndị nwụrụ anwụ” na-egosipụtakwa ἐκ νεκρῶν n’ụzọ ziri ezi ma doo anya.
- source_word: οὔτε γαμοῦσιν
  choice: ha agaghị alụ di ma ọ bụ nwunye
  rationale: N’Igbo, “ịlụ di ma ọ bụ nwunye” na-agụnye ndị nwoke na ndị nwanyị ma na-egosi ịbanye n’alụmdi na nwunye.
- source_word: οὔτε γαμίζονται
  choice: a gaghịkwa enye ha n’alụmdi na nwunye
  rationale: Nke a na-edobe passive nke γαμίζονται na ọdịiche ya na γαμοῦσιν, kama ijikọta ngwaa abụọ ahụ ka ha bụrụ otu ihe.
- source_word: ἀλλ’ εἰσὶν
  choice: kama ha ga-adị
  rationale: “Kama” na-edobe ntụgharị megidere nke ἀλλά, ebe “ha ga-adị” dabara n’ọnọdụ mbilite n’ọnwụ a na-ekwu maka ya.
- source_word: ὡς ἄγγελοι
  choice: ka ndị mmụọ ozi
  rationale: “Ka” na-egosi ntụnyere nke ὡς, ọ bụghị na ndị bilitere ga-aghọ ndị mmụọ ozi.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: nọ n’eluigwe
  rationale: “N’eluigwe” bụ ụzọ Igbo nkịtị na nke dị ùgwù isi kwuo ọnọdụ a; ọ bụ ezie na okwu Grik dị n’ụdị ọtụtụ, Igbo anaghị achọ ka e mee ya ọtụtụ ebe a.
theological_decisions:
- issue: Ụdị ntụnyere ndị bilitere na ndị mmụọ ozi
  choice: Ndị bilitere ga-adị ka ndị mmụọ ozi n’ihe gbasara alụmdi na nwunye.
  alternative: Ndị bilitere ga-aghọ ndị mmụọ ozi.
  rationale: Akụkụ ntụnyere ὡς pụtara ịdị ka, ọ bụghị ịbụ otu ụdị ihe; ya mere ntụgharị ahụ anaghị ekwu na mmadụ ga-aghọ mmụọ ozi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ọdịiche dị n’etiti “ịlụ di ma ọ bụ nwunye” na “inye mmadụ n’alụmdi na nwunye,” tinyere ntụnyere “ka ndị mmụọ ozi.”
