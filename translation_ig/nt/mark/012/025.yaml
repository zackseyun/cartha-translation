  terminology: 'Key terms are well chosen: ''ndị nwụrụ anwụ'' for the dead, ''alụmdi na nwunye'' for marriage, ''ndị mmụọ ozi'' for angels, and ''eluigwe'' for heaven. ''Ka ndị mmụọ ozi'' correctly preserves comparison rather than identity.'
