source:
  edition: SBLGNT
  text: Καὶ ἔρχονται Σαδδουκαῖοι πρὸς αὐτόν, οἵτινες λέγουσιν ἀνάστασιν μὴ εἶναι, καὶ ⸀ἐπηρώτων αὐτὸν λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/018.yaml
  text: And Sadducees came to him, who say there is no resurrection, and they began questioning him, saying,
translation:
  language: ig
  text: 'Ndị Sadusii, bú ndị na-ekwu na mbilite n''ọnwụ adịghị, bịakwutere ya, ha na-ajụ ya ajụjụ, sị:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: Ndị Sadusii
  rationale: Aha otu okpukpe ahụ n'ụdị a na-aghọta nke ọma n'Igbo.
- source_word: ἀνάστασιν
  choice: mbilite n'ọnwụ
  rationale: Okwu Igbo doro anya maka isi n'ọnwụ bilie, nke na-edobe ihe okwu Grik pụtara n'ọnọdụ a.
- source_word: ἐπηρώτων
  choice: malite ịjụ ya ajụjụ
  rationale: Na-egosipụta omume ajụjụ ahụ dị ka ihe na-aga n'ihu, kwekọọ na imperfect Grik na ntụziaka ederede a nyochara.
- source_word: λέγοντες
  choice: sị
  rationale: Ụzọ Igbo dị mkpụmkpụ ma bụrụkwa nke ebumpụta ụwa iji webata okwu ha na-esote.
theological_decisions:
- issue: Ihe ndị Sadusii na-agọnahụ
  choice: mbilite n'ọnwụ adịghị
  alternative: ndị nwụrụ anwụ agaghị ebili
  rationale: Nhọrọ a na-edobe okwu nkịtị ἀνάστασις na mkpụmkpụ nke isi mmalite, na-akọwaghị karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ahịrịokwu ahụ ka ọ kwụsị na akara ntụpọ abụọ n'ihi na okwu ha ga-esochi n'amaokwu na-abịa.
