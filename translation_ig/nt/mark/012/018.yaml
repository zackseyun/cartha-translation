review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the Sadducees and preserves their denial of resurrection. However, «malite ịjụ ya ajụjụ» adds an explicit inception (“began”) that the Greek imperfect ἐπηρώτων need not state; it more directly presents their questioning as ongoing/repeated. The English audit trail uses “began questioning,” but the source wording does not require that added nuance.
  naturalness: The revised wording is natural Standard Igbo and keeps the introductory colon because the Sadducees’ quoted question continues in the following verse.
  terminology: «Ndị Sadusii» and «mbilite n'ọnwụ» are appropriate, recognizable Standard Igbo renderings. No doctrinal expansion is introduced.
  issues:
  - severity: medium
    issue: «malite ịjụ ya ajụjụ» explicitly marks the start of the questioning.
    rationale: The imperfect ἐπηρώτων primarily portrays questioning in progress or repeatedly; it does not itself require “began.” Rendering it with «na-ajụ» preserves the aspect without importing an inception nuance.
  revised_text: 'Ndị Sadusii, bú ndị na-ekwu na mbilite n''ọnwụ adịghị, bịakwutere ya, ha na-ajụ ya ajụjụ, sị:'
