id: MRK.12.19
reference: Mark 12:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: ig
  text: “Onye Ozizi, Mosis deere anyị[a] na ọ bụrụ na nwanne nwoke mmadụ anwụọ, hapụ nwunye ya, ma ọ hapụghị nwa ọ bụla,[b] nwanne nwoke ya ga-alụ nwanyị ahụ, wee mụtaara nwanne ya ụmụ.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lee Diuterọnọmi 25:5 maka iwu Mosis a ha na-ekwu maka ya.
    reason: cross_reference
  - marker: b
    text: 'N’ụzọ mkpụrụ okwu kpọmkwem: “ọ hapụghị nwa”; ụfọdụ nsụgharị nwere ike ịsị, “ọ hapụghị ụmụ.”'
    reason: lexical_alternative
  - marker: c
    text: 'N’ụzọ mkpụrụ okwu kpọmkwem: “ka o weere nwanne ya mkpụrụ.” Nke a bụ akpaalaokwu nke pụtara ịmụ ụmụ maka nwanne ya nwoke nwụrụ anwụ, dịka iwu alụmdi na nwunye a si dị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Ọ bụ okwu a na-akpọ Jizọs kpọmkwem; ‘Onye Ozizi’ bụ okwu Igbo doro anya nke na-egosipụta ọrụ ịkụzi n’etinyeghị echiche ọchịchị dị n’okwu dịka ‘Nna Ukwu.’
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: Mosis deere anyị
  rationale: ‘Mosis’ bụ ụdị aha a na-ejikarị n’Igbo. ‘Deere anyị’ na-egosipụta na e dere ihe ahụ maka ndị Izrel, dị ka dative ἡμῖν si dị.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: ọ bụrụ na nwanne nwoke mmadụ anwụọ
  rationale: ‘Mmadụ’ na-edobe τινος dịka onye a na-akọwaghị, ebe ‘nwanne nwoke’ na-echekwa ụdị nwoke nke ἀδελφός n’iwu alụmdi na nwunye a.
- source_word: καταλίπῃ γυναῖκα
  choice: hapụ nwunye
  rationale: N’ọnọdụ ọnwụ a, ‘hapụ nwunye’ na-egosi nwanyị onye ahụ hapụrụ mgbe ọ nwụrụ; ọ bụ ụzọ dị mfe ma bụrụ nke nkịtị n’Igbo.
- source_word: μὴ ἀφῇ τέκνον
  choice: ma ọ hapụghị nwa ọ bụla
  rationale: Nke a na-echekwa τέκνον dịka otu nwa n’ụdị izugbe, ebe ‘ọ bụla’ na-eme ka nkwupụta na ọ dịghị nwa doo anya.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: nwanne nwoke ya ga-akpọrọ nwanyị ahụ ka ọ bụrụ nwunye ya
  rationale: N’ebe a, λάβῃ γυναῖκα pụtara ịlụ nwanyị ahụ. Nsụgharị a na-eme ka ihe alụmdi na nwunye ahụ pụta ìhè n’Igbo n’enweghị mgbagwoju anya.
- source_word: ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ
  choice: wee mụtaara nwanne ya ụmụ
  rationale: σπέρμα bụ okwu mkpokọta maka ụmụ ma ọ bụ agbụrụ n’akpaalaokwu iwu a. ‘Mụtaara nwanne ya ụmụ’ na-enye nghọta ebumnuche ahụ n’Igbo ma na-echekwa echiche na a na-ewere ụmụ ahụ dị ka ụmụ nke nwanne nwụrụ anwụ.
theological_decisions:
- issue: Ikwupụta iwu alụmdi na nwunye onye nwanne di nwụrụ n’enweghị itinye nkọwa okpukpe ọzọ
  choice: nwanne nwoke ya ga-akpọrọ nwanyị ahụ ka ọ bụrụ nwunye ya, wee mụtaara nwanne ya ụmụ
  alternative: nwanne ya nwoke ga-ewere nwunye ahụ, kpọlitekwara nwanne ya mkpụrụ
  rationale: Nhọrọ bụ isi na-eme ka iwu alụmdi na nwunye na ebumnuche ịmụ ụmụ doo ndị na-agụ Igbo nke oge a anya. Ihe ọzọ dị nso n’usoro okwu Grik, ma ‘kpọlite mkpụrụ’ nwere ike ghara ịghọta nke ọma.
- issue: Asụsụ metụtara nwoke na nwanyị
  choice: E debere ‘nwanne nwoke’ na ‘nwunye.’
  alternative: Iji okwu na-adịghị egosi nwoke ma ọ bụ nwanyị dịka ‘nwanne’ na ‘di ma ọ bụ nwunye.’
  rationale: Grik kwuru kpọmkwem banyere nwanne nwoke na nwunye n’iwu alụmdi na nwunye nwoke na nwanyị; ya mere, e kwesịghị iwepụ ọdịiche ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Onye Ozizi’ bụ okwu nkwanye ùgwù na-enweghị itinye ọkwa ọchịchị ọzọ. E mere akpaalaokwu iwu ahụ ka ọ doo anya, ma e debere njikọ ụmụ a na nwanne nwoke ahụ nwụrụ anwụ.
