- from: “Onye Ozizi, Mosis deere anyị[a] na ọ bụrụ na nwanne nwoke mmadụ anwụọ, hapụ nwunye, ma ọ hapụghị nwa ọ bụla,[b] nwanne nwoke ya ga-akpọrọ nwanyị ahụ ka ọ bụrụ nwunye ya, wee mụtaara nwanne ya ụmụ.[c]”
  to: “Onye Ozizi, Mosis deere anyị[a] na ọ bụrụ na nwanne nwoke mmadụ anwụọ, hapụ nwunye ya, ma ọ hapụghị nwa ọ bụla,[b] nwanne nwoke ya ga-alụ nwanyị ahụ, wee mụtaara nwanne ya ụmụ.[c]”
  rationale: The revision supplies the wife’s possessive relationship in idiomatic Igbo, uses the direct and natural marital verb “lụọ,” and corrects the note’s treatment of the Greek legal idiom. It retains the source’s general indefinite subject, singular “child” in the main text, and the ambiguity-preserving phrase “mụtaara nwanne ya ụmụ.”
