base_translation:
  language: en
  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: ig
  text: Ha wee weta otu mkpụrụ ego[a]. Ọ sị ha, “Onyinyo a bụ nke onye, ihe e dere n’elu ya bụkwa nke onye?” Ha wee sị ya, “Ọ bụ nke Siza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ha wee weta ya”; ihe a na-ekwughị aha ya ebe a bụ mkpụrụ ego ahụ (otu denarịọs) e kwuru okwu ya n’amaokwu bu ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: Ha wee weta otu mkpụrụ ego
  rationale: φέρω pụtara ‘iweta.’ Ọ bụ ezie na e kwughị ihe e wetara kpọmkwem n’amaokwu a, ihe gbara ya gburugburu na-egosi na ọ bụ mkpụrụ ego ahụ; ‘otu mkpụrụ ego’ na-eme ka Igbo doo anya n’enweghị mgbakwunye ihe na-abụghị n’okwu gbara ya gburugburu.
- source_word: λέγει
  choice: Ọ sị ha
  rationale: λέγει bụ present tense e ji akọ akụkọ gara aga (historical present). N’Igbo, ‘Ọ sị ha’ bụ ụzọ ebumpụta ụwa na nke doro anya isi kọọ okwu a, ebe ‘ọ na-asị ha’ nwere ike ịpụta omume na-aga n’ihu.
- source_word: Τίνος
  choice: bụ nke onye?
  rationale: Ajụjụ genitive a na-ajụ onye ihe ahụ bụ nke ya ma ọ bụ onye e jikọtara ya na ya. Nhazi ‘bụ nke onye?’ na-egosipụta nke a nke ọma n’Igbo ma metụta ma onyinyo ahụ ma ihe e dere.
- source_word: εἰκών
  choice: onyinyo
  rationale: ‘Onyinyo’ bụ okwu Igbo a na-aghọta nke ọma maka ihe oyiyi ma ọ bụ ọdịdị mmadụ e sere n’elu mkpụrụ ego.
- source_word: ἐπιγραφή
  choice: ihe e dere n’elu ya
  rationale: N’ọnọdụ mkpụrụ ego, ἐπιγραφή bụ ederede e tinyere n’elu ya. Nkebiokwu a bụ nke doro ndị na-agụ Igbo anya karịa okwu nka pụrụ iche.
- source_word: Καίσαρος
  choice: nke Siza
  rationale: Genitive a na-aza ajụjụ banyere onye nwe ya ma ọ bụ onye e jikọtara ya na ya. ‘Nke Siza’ bụ azịza Igbo dị nkenke ma kwekọọ n’ụdị okwu Grik ahụ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A haziri ajụjụ ahụ n’ụzọ Igbo si ekwu ya nke ọma, ka ‘nke onye’ metụta ma onyinyo ahụ ma ihe e dere n’elu mkpụrụ ego ahụ.
