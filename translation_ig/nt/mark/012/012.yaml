  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: ig
  text: Ha na-achọ ijide ya, ma ha tụrụ ìgwè mmadụ ahụ egwu, n’ihi na ha matara na ọ bụ megide ha ka o kwuru ilu ahụ.[a] Ha hapụrụ ya, wee laa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na ọ bụ banyere ha ka o kwuru ilu ahụ,” ma ọ bụ, “na ọ bụ ha ka ọ gwara ilu ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: Ha na-achọ
  rationale: Ụdị imperfect na-egosi mgbalị ma ọ bụ omume na-aga n’ihu; “na-achọ” na-echekwa akụkụ ahụ n’Igbo eke.
- source_word: κρατῆσαι
  choice: ijide ya
  rationale: “Ijide” na-anọ nso n’echiche bụ isi nke κρατέω, nke pụtara ijide mmadụ n’ike, na-etinyeghị usoro iwu doro anya nke okwu Grik ahụ ekwughị.
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: ha tụrụ ìgwè mmadụ ahụ egwu
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke eke isi kwuo na ha tụrụ ndị mmadụ ahụ egwu.
- source_word: ἔγνωσαν
  choice: ha matara
  rationale: “Matara” na-egosi na ha ghọtara ma mara nke ọma ihe ilu ahụ metụtara.
- source_word: πρὸς αὐτοὺς
  choice: megide ha
  rationale: N’ọnọdụ esemokwu a, “megide ha” na-egosipụta ike okwu ahụ, ebe e debere ohere nkọwa “banyere ha” ma ọ bụ “nye ha” n’ala peeji.
- source_word: τὴν παραβολὴν
  choice: ilu ahụ
  rationale: “Ilu” bụ okwu Igbo a na-aghọta nke ọma maka παραβολή n’akụkọ a, ebe “ahụ” na-ezo aka n’ilu e kwuru tupu amaokwu a.
- source_word: εἶπεν
  choice: o kwuru
  rationale: Oge gara aga dị mfe bụ ụzọ Igbo eke isi gosipụta okwu ahụ mere tupu ha amata ihe ọ pụtara; Igbo achọghị ụdị past perfect Bekee.
- source_word: ἀφέντες αὐτὸν
  choice: ha hapụrụ ya
  rationale: “Hapụrụ ya” na-egosi na ha kwụsịrị mgbalị ijide ya ma hapụ ya ebe ahụ.
- source_word: ἀπῆλθον
  choice: pụọ
  rationale: “Pụọ” bụ okwu Igbo ugbu a, dị mfe, nke na-egosipụta na ha siri ebe ahụ laa.
theological_decisions:
- issue: Ike na ntụziaka nke πρὸς αὐτούς
  choice: megide ha
  alternative: banyere ha; nye ha
  rationale: Ọnọdụ iro dị n’akụkọ ahụ kwadoro “megide ha,” ma πρός nwere ike igosi naanị na ilu ahụ metụtara ha ma ọ bụ na a gwara ha ya; ya mere e chekwara mgbagwoju anya ahụ n’ala peeji.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ìgwè mmadụ” mee ὄχλος, ma jiri usoro okwu e mesiri ike “ọ bụ megide ha ka...” chekwaa ntụziaka na ike nke πρὸς αὐτούς.
