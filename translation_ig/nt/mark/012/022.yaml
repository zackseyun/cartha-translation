    text: N’ụzọ nkịtị, “ahapụghị mkpụrụ”; nke pụtara na ha ahapụghị ụmụ ma ọ bụ ụmụ ụmụ ga-anọchi ha.
    reason: lexical_alternative
  revision_rationale: The revision replaces the gender-neutral “Mmadụ asaa ahụ” with the contextually established “Ụmụ nwoke asaa ahụ.” It retains the draft’s clear rendering of the descendant idiom and final sequence, while adding a correctly anchored note for the Greek literal expression.
