  text: καὶ ⸂οἱ ἑπτὰ⸃ οὐκ ἀφῆκαν σπέρμα· ⸀ἔσχατον πάντων ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/022.yaml
  text: And the seven left no offspring. Last of all[a], the woman also died.
translation:
  language: ig
  text: Ụmụ nwoke asaa ahụ ahapụghị nwa ọ bụla[a]. N'ikpeazụ, nwanyị ahụ nwụkwara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ahapụghị mkpụrụ”; nke pụtara na ha ahapụghị ụmụ ma ọ bụ ụmụ ụmụ ga-anọchi ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: Mmadụ asaa ahụ
  rationale: Ọnụọgụ ahụ nwere artikel ji onwe ya na-ezo aka n’ụmụnne nwoke asaa e kwuru okwu ha n’amaokwu ndị bu ụzọ. “Mmadụ asaa ahụ” na-eme ka Igbo bụrụ nke eke ma ghara ịgbakwụnye “ụmụnne” n’ebe ederede a ekwughị ya ọzọ.
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: ahapụghị nwa ọ bụla
  rationale: N'ụzọ nkịtị, okwu a bụ ‘ahapụghị mkpụrụ,’ ma n'ebe a ọ pụtara na ha amụtaghị nwa ga-anọchi ha. “Ahapụghị nwa ọ bụla” na-enye echiche ahụ n’Igbo doro anya ma dịkwa eke.
- source_word: ἔσχατον πάντων
  choice: N'ikpeazụ
  rationale: Nkebiokwu a na-egosi onye mechara nwụọ n'usoro ahụ. “N'ikpeazụ” bụ ụzọ Igbo dị nkenke ma kwekọọ n'echiche ‘n'ikpeazụ n'ime ha niile.’
- source_word: καὶ ἡ γυνὴ
  choice: nwanyị ahụ nwụkwara
  rationale: 'καί nwere ike igosi mgbakwunye: nwanyị ahụ sokwa n’ọnwụ ndị ahụ. Mgbakwunye -kwa na “nwụkwara” na-egosipụta nke a n’ụzọ Igbo dị eke.'
- source_word: ἀπέθανεν
  choice: nwụrụ
  rationale: Ngwaa a pụtara ozugbo ‘nwụrụ’; e jighị okwu dị nro dochie kpọmkwem ihe Grik kwuru.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. A tụgharịrị akpaalaokwu σπέρμα site n’echiche ya kama iji “mkpụrụ,” nke nwere ike ghara ido anya n’ebe a.
