review_pass:
  verdict: revise
  source_fidelity: The draft conveys the collective statement that none of the seven produced surviving descendants and accurately preserves the woman's death as the final event. However, “Mmadụ asaa ahụ” is unnecessarily gender-neutral (“those seven people”), whereas the established referent in the immediate context is the seven male brothers. “Ụmụ nwoke asaa ahụ” makes that referent clear without adding information beyond the context. The footnote’s literal ‘seed’ explanation should be anchored to the descendant/child expression, not to the final-sequence phrase.
  naturalness: “ahapụghị nwa ọ bụla” and “N'ikpeazụ, nwanyị ahụ nwụkwara” are clear, idiomatic Standard Igbo. “Ụmụ nwoke asaa ahụ” is more natural and contextually precise than “Mmadụ asaa ahụ” in this narrative.
  terminology: “Nwa ọ bụla” appropriately communicates σπέρμα here as descendant/offspring rather than using the potentially opaque literal “mkpụrụ.” “Nwụrụ” retains the directness of ἀπέθανεν. No theological terminology is involved.
  issues:
  - severity: low
    issue: The seven are called “Mmadụ asaa ahụ.”
    rationale: This can refer to people of either sex. The Greek substantival phrase refers back to the seven brothers in the preceding context, so “Ụmụ nwoke asaa ahụ” is contextually exact and remains natural Igbo.
  - severity: low
    issue: No target-language footnote preserves the audit trail for the literal ‘seed’ idiom.
    rationale: The semantic rendering is sound, but a brief note anchored to “nwa ọ bụla” preserves the lexical alternative and places the note at the expression it explains.
  revised_text: Ụmụ nwoke asaa ahụ ahapụghị nwa ọ bụla[a]. N'ikpeazụ, nwanyị ahụ nwụkwara.
  revised_footnotes:
