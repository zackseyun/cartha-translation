    text: Ma ọ bụ, “n’ebe ọhịa nta ahụ dị”; okwu Grik ahụ pụrụ ịpụta akụkụ Akwụkwọ Nsọ a na-akpọ aha site n’ihe mere n’ọhịa nta ahụ.
    reason: lexical_alternative
