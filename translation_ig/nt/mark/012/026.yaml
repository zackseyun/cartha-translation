id: MRK.12.26
reference: Mark 12:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: ig
  text: Ma banyere ndị nwụrụ anwụ, na a na-akpọlite ha, ọ̀ bụ na unu agụbeghị n’akwụkwọ Mosis, n’akụkụ banyere ọhịa nta ahụ[a], otu Chineke siri gwa ya okwu, sị, ‘Abụ m Chineke nke Ebreham, na Chineke nke Aịzik, na Chineke nke Jekọb’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ebe ọhịa nta ahụ dị”; okwu Grik ahụ pụrụ ịpụta akụkụ Akwụkwọ Nsọ a na-akpọ aha site n’ihe mere n’ọhịa nta ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: Ma banyere ndị nwụrụ anwụ
  rationale: ‘Banyere’ na-ewebata isiokwu a na-atụle, ebe ‘Ma’ na-eburu njikọ δέ n’ụzọ dị mfe n’Igbo.
- source_word: ὅτι ἐγείρονται
  choice: na a na-akpọlite ha
  rationale: Nke a na-echekwa ọdịdị passive nke ἐγείρονται ma na-egosi mbilite n’ọnwụ n’enweghị ịkọwapụta ihe Grik ekwughị.
- source_word: οὐκ ἀνέγνωτε
  choice: ọ̀ bụ na unu agụbeghị
  rationale: Ụdị ajụjụ a dabara n’Igbo maka ajụjụ nkwughachi nke na-arịọ ndị na-ege ntị ka ha cheta ihe dị n’Akwụkwọ Nsọ.
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: n’akwụkwọ Mosis
  rationale: ‘Akwụkwọ Mosis’ bụ okwu doro anya ma dịkwa mfe nghọta maka βίβλος Μωϋσέως.
- source_word: ἐπὶ τοῦ βάτου
  choice: n’akụkụ Akwụkwọ Nsọ banyere ọhịa nta ahụ
  rationale: Nkebiokwu Grik nwere ike ịkpọ akụkụ Akwụkwọ Nsọ aha site n’ihe mere n’ebe ọhịa nta ahụ dị; nsụgharị a na-eme ka ọrụ nrụtụaka ahụ doo anya.
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: otú Chineke si gwa ya, sị
  rationale: Nke a bụ Igbo ebumpụta ụwa nke na-edobe Chineke dịka onye kwuru okwu ma webata okwu e hotara ozugbo.
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: Abụ m Chineke nke Ebreham, na Chineke nke Aịzik, na Chineke nke Jekọb
  rationale: A na-echekwa oge ugbu a ‘Abụ m’ na nkwughachi ‘Chineke nke’ ugboro atọ, dịka usoro na ike okwu Grik si dị.
theological_decisions:
- issue: Asụsụ mbilite n’ọnwụ na ὅτι ἐγείρονται
  choice: na a na-akpọlite ha
  alternative: na ha na-ebili
  rationale: Nhọrọ a na-echekwa passive Grik, nke na-ahapụ Chineke dịka onye na-eme ka ha bilie n’enweghị itinye nkọwa ozizi ọzọ.
- issue: Oge ugbu a na nkwughachi n’okwu Chineke kwuru banyere onwe ya
  choice: Abụ m Chineke nke Ebreham, na Chineke nke Aịzik, na Chineke nke Jekọb
  alternative: Abụ m Chineke Ebreham, Aịzik na Jekọb
  rationale: Oge ugbu a na nkwughachi ahụ dị mkpa n’arụmụka Jizọs; ya mere, a hapụrụ ha dịka ha dị n’isi mmalite.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Ọhịa nta’ na-anọchi βάτος n’enweghị itinye ‘na-ere ọkụ,’ nke adịghị n’amaokwu Grik a; nkọwa akụkụ Akwụkwọ Nsọ dị n’ahịrị bụ iji mee ka idiom ahụ doo anya.
