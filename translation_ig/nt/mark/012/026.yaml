revisions:
- from: Ma banyere ndị nwụrụ anwụ na a na-akpọlite ha, ọ̀ bụ na unu agụbeghị n’akwụkwọ Mosis, n’akụkụ Akwụkwọ Nsọ banyere ọhịa nta ahụ[a], otú Chineke si gwa ya, sị, ‘Abụ m Chineke nke Ebreham, na Chineke nke Aịzik, na Chineke nke Jekọb’?”
  to: Ma banyere ndị nwụrụ anwụ, na a na-akpọlite ha, ọ̀ bụ na unu agụbeghị n’akwụkwọ Mosis, n’akụkụ banyere ọhịa nta ahụ[a], otu Chineke siri gwa ya okwu, sị, ‘Abụ m Chineke nke Ebreham, na Chineke nke Aịzik, na Chineke nke Jekọb’?”
