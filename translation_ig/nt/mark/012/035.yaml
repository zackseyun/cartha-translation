id: MRK.12.35
reference: Mark 12:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: ig
  text: Mgbe Jizọs na-akụzi ihe n'ụlọ nsọ, ọ zara, sị, “Olee otu ndị odeakwụkwọ si ekwu na Mesaịa[a] bụ nwa Devid?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Kraịst.” Okwu Grik bụ Christos; n'ebe a, e ji ya mee utu aha Mesaịa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: ọ zara, sị
  rationale: Ọ bụ ezie na e nweghị ajụjụ e kwuru ozugbo tupu nke a, okwu Grik ahụ na-egosi na Jizọs na-azaghachi ọnọdụ ma ọ bụ echiche a na-atụle. ‘Ọ zara, sị’ bụ ụzọ Igbo dị mfe ma kwesị ntụkwasị obi isi gosi ya.
- source_word: ἔλεγεν διδάσκων
  choice: Mgbe Jizọs na-akụzi ihe ... ọ ... sị
  rationale: Nhazi a na-egosi na okwu ahụ mere n'oge ọ nọ na-akụzi, ma na-asụkwa Igbo nke ọma.
- source_word: ἐν τῷ ἱερῷ
  choice: n'ụlọ nsọ
  rationale: ἱερόν na-ezo aka n'ogige na ụlọ niile metụtara ụlọ nsọ, ọ bụghị naanị ime ebe nsọ ahụ; ‘ụlọ nsọ’ bụ okwu Igbo a maara nke ọma ma dabara n'ebe a.
- source_word: Πῶς
  choice: Olee otu ... si
  rationale: Nke a na-edobe ụdị ajụjụ Grik ahụ ma na-enye ohere ka onye na-agụ ya ghọta ike ajụjụ Jizọs n'onwe ya, n'ebughị ụzọ tinye nkọwa na ọ pụghị ịdị otú ahụ.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nke a na-edobe aha akụkọ ihe mere eme e ji mara ndị ọkachamara n'iwu na ihe odide n'oge ahụ, kama ịgbanwe ya kpamkpam ka ọ bụrụ nkọwa ọrụ ha.
- source_word: ὁ χριστός
  choice: Mesaịa
  rationale: N'ebe a χριστός bụ utu aha onye ahụ ndị Juu na-atụ anya ya; ‘Mesaịa’ na-eme ka nzube ahụ pụta ìhè n'Igbo.
- source_word: υἱὸς Δαυίδ
  choice: nwa Devid
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma kwekọọ na aha Mesaya ahụ, ‘nwa Devid,’ n'emebighị mmekọrịta e kwuru kpọmkwem na Grik.
theological_decisions:
- issue: Ịsụgharị χριστός dị ka utu aha
  choice: Mesaịa
  alternative: Kraịst
  rationale: Mkparịta ụka a gbasara atụmanya ndị Juu banyere onye e kwere ná nkwa, ya mere ‘Mesaịa’ na-egosi ọrụ χριστός dị ka utu aha. E debere ‘Kraịst’ n'ala ala peeji dị ka nsụgharị ọzọ a na-ejikarị eme ihe.
- issue: Mmekọrịta Mesaịa na Devid
  choice: nwa Devid
  alternative: onye si n'agbụrụ Devid
  rationale: E debere okwu ahụ dịka isi mmalite siri kwuo ya, ka ajụjụ na esemokwu nkà mmụta okpukpe Jizọs ga-aga n'ihu ịkọwa ghara ịbụ nke a kọwara tupu oge ya.
translation_notes:
  register: E ji asụsụ Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. ‘Ndị odeakwụkwọ’ na-edobe aha akụkọ ihe mere eme nke otu ahụ; ‘Mesaịa’ na-egosi na χριστός bụ utu aha n'ebe a. E tinyere akara ala ala peeji [a] ozugbo n'akụkụ okwu ọ na-akọwa.
