  text: οὐκ ἔστιν ⸀θεὸς νεκρῶν ⸀ἀλλὰ ζώντων· ⸀πολὺ πλανᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: ig
  text: Ọ bụghị Chineke nke ndị nwụrụ anwụ[a], kama ọ bụ Chineke nke ndị dị ndụ. Unu na-ehi ụzọ nke ukwuu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Chineke abụghị Chineke nke ndị nwụrụ anwụ, kama ọ bụ Chineke nke ndị dị ndụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Unu nọ n’oké njehie,” ma ọ bụ, “Unu na-emehie nke ukwuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸς
  choice: Chineke
  rationale: N'ọnọdụ a, θεός na-ezo aka n'otu Chineke ahụ nke Abraham, Aịzik na Jekọb, ọ bụghị ‘otu chi.’ Ya mere, ‘Chineke’ bụ ntụgharị kwesịrị ekwesị.
- source_word: νεκρῶν
  choice: ndị nwụrụ anwụ
  rationale: Ụdị genitive plural a na-arụ ọrụ dịka aha, na-egosi ndị nwụrụ anwụ; ọ na-echekwa ọdịiche ya na ‘ndị dị ndụ.’
- source_word: ἀλλὰ ζώντων
  choice: kama ọ bụ nke ndị dị ndụ
  rationale: ζώντων bụ participle e ji dịka aha, na-ezo aka ná ndị dị ndụ. E tinyere ‘ọ bụ nke’ ka ahịrịokwu ahụ bụrụ Igbo eke ma doo anya, n'enweghị ịgbakwụnye nkọwa ozizi.
- source_word: πολὺ
  choice: nke ukwuu
  rationale: πολύ na-eme ka πλανᾶσθε sie ike; ‘nke ukwuu’ na-egosipụta ike ịba mba ahụ n'Igbo a na-asụ ugbu a.
- source_word: πλανᾶσθε
  choice: Unu hiere ụzọ
  rationale: N'ebe a, ngwaa ahụ na-egosi ịnọ ná njehie. ‘Unu hiere ụzọ’ bụ okwu Igbo doro anya nke na-anaghị ekpebi ma ọ bụ mmadụ duhiere ha ma ọ bụ na ha onwe ha kpafuru.
- source_word: οὐκ ἔστιν
  choice: Ọ bụghị
  rationale: ‘Ọ bụghị’ na-enye ahịrịokwu Igbo eke ma na-ahapụ ka ihe ndị gbara ya gburugburu gosi na onye a na-ekwu banyere ya bụ Chineke.
theological_decisions:
- issue: Ihe okwu Jizọs pụtara banyere ndụ na mbilite n'ọnwụ
  choice: E debere ọdịiche dị mfe n'etiti ‘ndị nwụrụ anwụ’ na ‘ndị dị ndụ’ n'enweghị nkọwa ozizi agbakwunyere.
  alternative: Ịsụgharị ya dịka nkọwa zuru ezu na ndị nwụrụ anwụ ka dị ndụ n'ihu Chineke ma ọ bụ dịka nkwupụta kpọmkwem banyere ọnọdụ dị n'etiti ọnwụ na mbilite n'ọnwụ.
  rationale: Okwu a so n'arụmụka Jizọs banyere mbilite n'ọnwụ, ma amaokwu ahụ n'onwe ya anaghị akọwa n'ụzọ zuru ezu otú ndị nwụrụ anwụ si bụrụ ‘ndị dị ndụ.’ Ịhapụ ọdịiche ahụ ka ọ dị na-echekwa esemokwu na omimi nke ederede.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. ‘Ndị nwụrụ anwụ’ na ‘ndị dị ndụ’ na-echekwa ntụnyere dị n'asụsụ Grik; ‘Unu hiere ụzọ nke ukwuu’ na-ebuga ike ịba mba ahụ n'ụzọ eke.
