id: MRK.12.10
reference: Mark 12:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: ig
  text: 'Ọ̀ bụ na unu agụbeghị ọbụna akụkụ Akwụkwọ Nsọ a: ‘Nkume ahụ ndị na-ewu ụlọ jụrụ, ọ bụ ya ghọrọ isi nkuku’?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γραφὴν
  choice: ihe a e dere n’Akwụkwọ Nsọ
  rationale: N’ebe a, γραφή na-ezo aka n’ihe dị nsọ e dere, ọ bụghị naanị ihe odide nkịtị. Okwu a bụ Igbo doro anya ma na-egosi na Jizọs na-ehota Akwụkwọ Nsọ.
- source_word: ἀνέγνωτε
  choice: unu agụbeghị
  rationale: Ụdị ajụjụ a na Igbo na-egosipụta ajụjụ ịba mba nke Greek aorist ahụ nke ọma, ma na-ezo aka n’ihe ha kwesịrị ịgụworị.
- source_word: Λίθον
  choice: Nkume ahụ
  rationale: Ọ bụ ezie na Greek enweghị article n’ebe a, nkume ahụ bụ otu nkume a kapịrị ọnụ n’ihe atụ sitere n’Abụ Ọma 118.
- source_word: ἀπεδοκίμασαν
  choice: jụrụ
  rationale: “Jụrụ” bụ okwu Igbo dị mfe ma kpọmkwem maka ịghara ịnakwere ihe mgbe e nyochachara ya; ihe gbasara nyocha ahụ ka ihe gbara amaokwu ahụ gburugburu na-egosi.
- source_word: οἱ οἰκοδομοῦντες
  choice: ndị na-ewu ụlọ
  rationale: Nke a na-egosipụta participle Greek e ji mee aha mmadụ ma na-edobe ihe atụ banyere iwu ụlọ.
- source_word: ἐγενήθη
  choice: ghọrọ
  rationale: “Ghọrọ” na-egosipụta mgbanwe nke ọnọdụ nkume ahụ n’ụzọ eke n’Igbo, n’enweghị ịkọwa onye mere ka ọ dị otu ahụ.
- source_word: εἰς κεφαλὴν γωνίας
  choice: nkume isi nkuku
  rationale: Nke a bụ okwu Igbo a maara nke na-edobe ma nkume ma ọnọdụ ya dị mkpa n’akụkụ ụlọ; nkọwa ọzọ dị n’ala peeji na-echekwa ọdịdị nkịtị nke okwu Greek.
- source_word: οὐδὲ
  choice: ọbụna
  rationale: “Ọbụna” na-echekwa ike nke οὐδέ, nke na-eme ka ajụjụ ịba mba ahụ sie ike karịa naanị ịjụ ma ha agụọla ya.
theological_decisions:
- issue: Ojiji ihe atụ nke Abụ Ọma 118:22 banyere Mesaịa
  choice: E debere ihe atụ nke nkume, ndị na-ewu ụlọ, na nkume isi nkuku n’enweghị ịgbakwunye nkọwa.
  alternative: Ịkpọ nkume ahụ Mesaịa ma ọ bụ Jizọs kpọmkwem n’amaokwu ahụ.
  rationale: Ihe ndị gbara amaokwu ahụ gburugburu na-eme ka njikọ ahụ doo anya, ma okwu e hotara n’onwe ya na-eji ihe atụ eme ihe. Nsụgharị ahụ ekwesịghị idozi ihe atụ ahụ site n’ịgbakwunye nkọwa na-anọghị na Greek.
- issue: Onye mere ka nkume ahụ bụrụ isi nkuku
  choice: “ghọrọ,” nke na-ahapụ onye kpatara ya n’ekwughị.
  alternative: “Chineke mere ka ọ bụrụ,” ma ọ bụ ụdị passive doro anya.
  rationale: ἐγενήθη anaghị akpọ onye mere ihe ahụ aha. Ịghara ịgbakwunye “Chineke” na-echekwa nghọta na esemokwu dị na isi mmalite.
translation_notes:
  register: Standard Igbo; natural, current, and dignified. The rhetorical rebuke is retained through “Ọ̀ bụ na ... agụbeghị ọbụna,” while the Psalm’s building metaphor remains uninterpreted in the main text.
