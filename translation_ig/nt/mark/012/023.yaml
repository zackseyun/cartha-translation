  to: N’mbilite n’ọnwụ[a], mgbe ha ga-ebili, nwanyị ahụ ga-abụ nwunye onye n’ime ha? N’ihi na ha asaa nwere ya dịka nwunye.
  rationale: 'The revision makes two limited idiomatic improvements: it renders the resurrection setting more directly as “N’mbilite n’ọnwụ,” and it uses more natural Igbo question order. It preserves the Greek’s future temporal clause, does not add “ọzọ” to the main text, retains the marital sense of γυνή, and keeps the explanatory statement that the seven had her as wife.'
