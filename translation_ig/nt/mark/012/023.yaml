source:
  edition: SBLGNT
  text: ἐν τῇ ἀναστάσει ⸂ὅταν ἀναστῶσιν⸃ τίνος αὐτῶν ἔσται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: ig
  text: N’mbilite n’ọnwụ[a], mgbe ha ga-ebili, nwanyị ahụ ga-abụ nwunye onye n’ime ha? N’ihi na ha asaa nwere ya dịka nwunye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ha ga-ebili ọzọ.” Grik kwuru naanị “mgbe ha ga-ebili”; ihe a na-ekwu banyere mbilite n’ọnwụ na-eme ka echiche ahụ doo anya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστασις
  choice: mbilite n’ọnwụ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka ná mbilite n’ọnwụ nke a na-atụ anya ya n’ọdịnihu. “Mbilite n’ọnwụ” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwu maka resurrection.
- source_word: ὅταν ἀναστῶσιν
  choice: mgbe ha ga-ebili
  rationale: Njikọ ὅταν na aorist subjunctive na-egosi oge a na-atụ anya ya n’ọdịnihu. A hapụrụ “ọzọ” n’ihi na ọ dịghị kpọmkwem na Grik, ọ bụ ezie na ọnọdụ okwu ahụ nwere ike ịkwado ya.
- source_word: τίνος αὐτῶν
  choice: onye n’ime ha
  rationale: N’ahịrịokwu “nwunye onye n’ime ha,” nke a na-egosi ajụjụ banyere onye kpọmkwem n’etiti mmadụ asaa ahụ, n’ụzọ na-ada nke ọma n’Igbo.
- source_word: ἔσται γυνή
  choice: nwunye ... ka nwanyị ahụ ga-abụ
  rationale: Nhazi a na-egosi mmekọrịta alụmdi na nwunye ahụ nke ọma ma zere mgbagwoju anya nke nnọchiaha Igbo na-adịghị egosi nwoke ma ọ bụ nwanyị.
- source_word: γυνή
  choice: nwunye
  rationale: N’ebe abụọ ahụ, ọnọdụ okwu ahụ bụ nke alụmdi na nwunye, ya mere “nwunye” ziri ezi karịa okwu sara mbara bụ “nwanyị.”
- source_word: οἱ γὰρ ἑπτὰ
  choice: n’ihi na ha asaa
  rationale: “N’ihi na” na-ebute ihe mere ha ji jụọ ajụjụ ahụ, ebe “ha asaa” na-edobe okwu Grik n’enweghị ịgbakwunye “ụmụnne” ma ọ bụ “ndị ikom.”
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: nwere ya dịka nwunye
  rationale: Nke a na-edobe echiche nke inwe ya n’ọnọdụ nwunye, kama ịgbanwe okwu ahụ ka ọ bụrụ naanị ihe omume nke ịlụ ya.
theological_decisions:
- issue: Asụsụ mbilite n’ọnwụ n’arụmụka ha na ndị Sadusii
  choice: mbilite n’ọnwụ ... mgbe ha ga-ebili
  alternative: mbilite n’ọnwụ ... mgbe ha ga-ebili ọzọ
  rationale: Nsụgharị ahụ na-edobe nkwupụta banyere mbilite n’ọnwụ a ga-enwe n’ọdịnihu, ma ọ naghị etinye okwu “ọzọ,” nke na-adịghị kpọmkwem na Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “nwanyị ahụ” n’akụkụ nke abụọ iji mee ka onye a na-ekwu banyere ya doo anya, ebe nnọchiaha Igbo anaghị egosi okike mmadụ.
