  verdict: revise
  source_fidelity: The draft accurately conveys the resurrection setting, the future-oriented clause “when they rise,” the question concerning which of the seven will be her husband, and the explanation that all seven had her as wife. The phrase “N’oge mbilite n’ọnwụ” is somewhat broader than the Greek idiom ἐν τῇ ἀναστάσει, which is more directly rendered “N’mbilite n’ọnwụ.”
  naturalness: The sentence is understandable, but “N’mbilite n’ọnwụ” is more idiomatic and direct in Standard Igbo than “N’oge mbilite n’ọnwụ.” Reordering the question to put “nwanyị ahụ” first also produces a more natural Igbo question while retaining explicit reference to the woman.
  terminology: “Mbilite n’ọnwụ” and “nwunye” are appropriate established Standard Igbo terms. “Nwunye” correctly reflects γυνή in its marital sense. The footnote appropriately marks “ọzọ” as an optional contextual rendering rather than part of the explicit Greek wording.
