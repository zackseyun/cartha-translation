  text: ⸀καὶ λαβόντες αὐτὸν ἔδειραν καὶ ἀπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/003.yaml
  text: And they took him[a], beat him, and sent him away empty-handed.
translation:
  language: ig
  text: Ha jidere ya, tie ya ihe, wee ziga ya laa aka efu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “wee ziga ya laa n’enweghị ihe ọ bụla.” Okwu Grik κενόν pụtara “efu” n'ụzọ nkịtị; n'ebe a, ọ na-egosi na ha zighachiri ohu ahụ n'enweghị ihe ọ bụla.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: jidere
  rationale: 'Ngwaa a na-egosi ihe ha buru ụzọ mee: ha jidere ohu ahụ. “Jidere” bụ okwu Igbo doro anya nke na-adịghị etinye ike karịrị ihe Grik kwuru.'
- source_word: ἔδειραν
  choice: tie ya ihe
  rationale: δέρω pụtara iti mmadụ ihe ma ọ bụ iti ya nke ukwuu. “Tie ya ihe” bụ ụzọ Igbo nkịtị si kwuo nke a, na-enweghị ime ka ọ bụrụ ntaramahụhụ pụrụ iche dịka ịpịa ihe ụtarị.
- source_word: ἀπέστειλαν
  choice: zilaga ya
  rationale: N'ebe a, ἀποστέλλω pụtara izipụ onye ahụ ka ọ laa n'ebe ha nọ. “Zilaga ya” na-egosipụta nke a n'ụzọ Igbo dị nkenke ma dị ndụ.
- source_word: κενόν
  choice: aka efu
  rationale: κενόν bụ “efu” n'ụzọ nkịtị, ma n'okwu a ọ pụtara na ohu ahụ alaghachighị ji ihe ọ bụla. “Aka efu” bụ okwu Igbo e ji ekwu nke ahụ n'ụzọ ebumpụta ụwa.
- source_word: καὶ ... καὶ
  choice: '..., ... wee ...'
  rationale: Njikọ ndị a na-edekọ omume ndị ahụ n'usoro. N'Igbo, rikoma na “wee” na-eme ka usoro ahụ doo anya ma nọgide na-ada ka akụkọ nkịtị.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị mfe, nke oge a ma dị ùgwù. Ahịrịokwu ahụ chekwara usoro omume dị n'asụsụ Grik, ma jiri “aka efu” mee ka ihe κενόν pụtara n'ọnọdụ a doo onye na-agụ ya anya.
