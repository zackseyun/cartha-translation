review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the sequential actions in the Greek: they took/seized him, beat him, and sent him away without what he had come to receive. “Jidere” is suitably restrained for λαβόντες, and “tie ya ihe” adequately renders ἔδειραν without specifying formal flogging. The revision adds “laa” to make the departure implicit in ἀπέστειλαν explicit and idiomatic in Igbo.'
  naturalness: “Ha jidere ya, tie ya ihe, wee ziga ya laa aka efu” is clear, modern Standard Igbo. The draft’s “zilaga ya aka efu” is understandable, but “ziga ya laa” more naturally expresses sending someone away. In the footnote, “n’efu” can readily mean “in vain/free of charge,” rather than ‘empty-handed,’ so it should not be offered as the lexical alternative.
  terminology: “Aka efu” is an idiomatic and contextually accurate rendering of κενόν (‘empty-handed/with nothing’). No theological terminology is at issue.
  issues:
  - severity: medium
    issue: The footnote’s alternative, “wee zilaga ya n'efu,” is semantically misleading.
    rationale: In Standard Igbo, “n’efu” commonly has senses such as ‘in vain’ or ‘for free’ and does not clearly communicate that the servant was sent back with nothing. The alternative should use “n’enweghị ihe ọ bụla” (or equivalent) to retain the force of κενόν.
  - severity: low
    issue: “zilaga ya” is less natural here than “ziga ya laa.”
    rationale: The Greek ἀπέστειλαν includes dispatching the servant away. “Ziga ya laa” clearly and naturally expresses this in Standard Igbo while preserving the narrative sequence.
  revised_text: Ha jidere ya, tie ya ihe, wee ziga ya laa aka efu.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “wee ziga ya laa n’enweghị ihe ọ bụla.” Okwu Grik κενόν pụtara “efu” n'ụzọ nkịtị; n'ebe a, ọ na-egosi na ha zighachiri ohu ahụ n'enweghị ihe ọ bụla.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek’s three coordinated actions and its contextual sense that the servant was sent back without the produce/payment sought. It improves the natural Igbo expression of sending him away and replaces an ambiguous footnote alternative with one that accurately conveys ‘with nothing.’
