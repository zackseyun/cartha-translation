revisions:
- from: Ha jidere ya, tie ya ihe, wee zilaga ya aka efu.[a]
  to: Ha jidere ya, tie ya ihe, wee ziga ya laa aka efu.[a]
  rationale: The revision preserves the Greek’s three coordinated actions and its contextual sense that the servant was sent back without the produce/payment sought. It improves the natural Igbo expression of sending him away and replaces an ambiguous footnote alternative with one that accurately conveys ‘with nothing.’
