  verdict: revise
  source_fidelity: The draft correctly preserves Mark’s sequence of taking, killing, and then expelling the son. However, “tụpụ ya n’ubi vaịn ahụ” means throwing him into/at the vineyard rather than out of it, and so fails to render ἔξω τοῦ ἀμπελῶνος.
  naturalness: The revised wording is clear, idiomatic Standard Igbo, and retains the rapid parabolic narrative.
  terminology: “Ubi vaịn” is suitable for ἀμπελών. “N’èzí ubi vaịn ahụ” explicitly and naturally conveys expulsion outside the vineyard.
  issues:
