  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λαβόντες ⸂ἀπέκτειναν αὐτόν, καὶ ἐξέβαλον αὐτὸν⸃ ἔξω τοῦ ἀμπελῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/008.yaml
  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: ig
  text: Ha wee jide ya[a], gbuo ya, tụpụ ya n’èzí ubi vaịn ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ ndị na-agụ akwụkwọ pụrụ ịtụ anya usoro a: “tụpụ ya n’èzí ubi vaịn ahụ, gbuokwa ya,” n’ihi akụkọ ilu ndị yiri nke a. Ma ederede Grik nke Mak n’ebe a kwuru, “gbuo ya, tụpụkwa ya n’èzí ubi vaịn ahụ.”'
    reason: cross_reference
lexical_decisions:
- source_word: λαβόντες
  choice: Ha wee jide ya
  rationale: Aorist participle ahụ na-ebute omume ndị sochiri ya. “Jide ya” bụ Igbo nkịtị nke na-egosi na ha nara ya n’aka ha, ma ọ naghị etinye ike karịrị nke okwu Grik n’onwe ya chọrọ.
- source_word: ἀπέκτειναν
  choice: gbuo ya
  rationale: ἀποκτείνω pụtara igbu ma ọ bụ ime ka mmadụ nwụọ; “gbuo ya” bụ okwu Igbo doro anya, nke kwekọrọ n’ike akụkọ a.
- source_word: ἐξέβαλον
  choice: tụpụkwa ya
  rationale: ἐκβάλλω n’ebe a na-egosi iji ike wepụ ma tụpụ mmadụ n’èzí. “Tụpụkwa ya” na-edobe ike omume ahụ ma na-aga nke ọma na nkebiokwu na-esote.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: n’ubi vaịn ahụ
  rationale: Mgbe e jikọtara ya na “tụpụ,” nkebiokwu a na-egosi mmegharị site n’ime ubi ahụ gaa n’èzí. N’Igbo, “tụpụ ya n’ubi vaịn ahụ” na-enye echiche ahụ n’ụzọ eke.
- source_word: ἀμπελῶνος
  choice: ubi vaịn
  rationale: “Ubi vaịn” bụ okwu doro anya maka ala a kụrụ osisi vaịn.
theological_decisions:
- issue: Usoro igbu nwa ahụ na ịtụpụ ya n’ubi vaịn
  choice: 'A sụgharịrị ya dịka usoro Grik si dị: ha jidere ya, gbuo ya, mesịa tụpụ ya n’ubi vaịn ahụ.'
  alternative: Akụkọ ndị yiri nke a ma ọ bụ atụmanya ụfọdụ nwere ike idowe ịtụpụ ya n’ubi tupu igbu ya.
  rationale: 'SBLGNT na Mak 12:8 doro usoro ahụ anya: ijide ya, igbu ya, na ịtụpụ ya n’ubi. Nsụgharị ahụ anaghị eme ka Mak kwekọọ n’akụkọ ndị yiri ya.'
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. E ji “wee” mee ka usoro omume dị ngwa doo anya; e debere usoro okwu Grik n’enweghị ime ka ọ kwekọọ na akụkọ ndị yiri ya.
