    issue: The phrase “tụpụ ya n’ubi vaịn ahụ” omits the meaning of ἔξω (‘outside/out of’).
    rationale: With n’, the current phrase locates the throwing in the vineyard, whereas the Greek explicitly says that they threw him outside the vineyard. The same problem occurs in the footnote’s quoted alternative and quotation of Mark’s wording.
