lexical_decisions:
- source_word: πρωτοκαθεδρίας
  choice: oche ndị a na-asọpụrụ karịa
  rationale: Ọ na-egosi oche e nyere ndị nọ n'ọkwa dị elu ma ọ bụ ndị a na-asọpụrụ karịa n'ọgbakọ. Nsụgharị a na-eme ka echiche banyere ugwu na ọkwa doo onye Igbo nke oge a anya.
- source_word: συναγωγαῖς
  choice: ụlọ nzukọ ndị Juu
  rationale: N'ebe a, okwu ahụ na-ezo aka n'ebe ndị Juu na-ezukọ maka ofufe na nkuzi, ọ bụghị naanị n'ọgbakọ mmadụ.
- source_word: πρωτοκλισίας
  choice: ebe ndị a na-asọpụrụ
  rationale: Ọ na-ezo aka n'ọnọdụ iri nri e debere maka ndị kacha nwee ugwu. 'Ebe ndị a na-asọpụrụ' na-ebuga isi echiche ahụ n'ụzọ doro anya n'agbanyeghị na omenala oge ahụ bụ iri nri n'elu ihe ndina.
- source_word: δείπνοις
  choice: oriri
  rationale: N'ọnọdụ a, okwu ahụ pụtara nnukwu nri ọha na eze ebe a na-egosipụta ugwu na ọkwa; 'oriri' bụ okwu Igbo dị mfe ma kwekọọ na ya.
- source_word: καὶ ... καὶ
  choice: na ... na
  rationale: E chekwara njikọ okwu ndị e kwughachiri iji gosipụta nchịkọta ihe ndị odeakwụkwọ ahụ na-achọ.
- source_word: ἐν ταῖς συναγωγαῖς ... ἐν τοῖς δείπνοις
  choice: n'ụlọ nzukọ ndị Juu ... n'oriri
  rationale: A sụgharịrị ἐν otu ụzọ dị mma ma bụrụ nke nkịtị n'Igbo n'ebe abụọ ahụ.
