translation_notes:
  register: Asụsụ Igbo ọkọlọtọ nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ okwu ndị na-egosi ọkwa na nsọpụrụ n'ụzọ ebumpụta ụwa, ma e tinyere ọdịdị omenala oge ochie n'ala ala peeji.
