  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: ig
  text: Ha wee zigara ya ụfọdụ ndị Farisii na ụfọdụ ndị otu Herọd, ka ha jiri okwu jide ya n'ọnyà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ka ha jide ya n'ihe o kwuru.” Ngwaa Grik ahụ bụ ihe atụ sitere n'ịchụ nta; nkebi ikpeazụ na-egosi na ha chọrọ iji okwu jide ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: Ha wee zigara
  rationale: A na-eji usoro akụkọ Igbo “wee zigara” akọ historical present n'ụzọ dị ire, ma ọ naghị etinye onye kpọmkwem n'ọnọdụ isiokwu nke Grik hapụrụ n'amaghị aha.
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: ụfọdụ ndị Farisii na ụfọdụ ndị otu Herọd
  rationale: “Ụfọdụ ... na ụfọdụ ...” na-echekwa partitive construction, na-egosi na e zigara ndị nnọchiteanya sitere n'òtù abụọ ahụ.
- source_word: Φαρισαίων
  choice: ndị Farisii
  rationale: Nke a bụ aha otu ndị Juu a na-ejikarị na Standard Igbo.
- source_word: Ἡρῳδιανῶν
  choice: ndị otu Herọd
  rationale: Nkebi a na-akọwa ndị otu metụtara Herọd n'ụzọ doro anya nye ndị na-agụ Igbo, kama transliteration na-adịghị mfe nghọta.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-egosipụta ebumnuche nke subordinate clause n'ụzọ dị mkpirikpi ma bụrụkwa Igbo eke.
- source_word: ἀγρεύσωσιν
  choice: jide ya n'ọnyà
  rationale: Nke a na-echekwa hunting metaphor nke ngwaa ahụ ma gosipụta ebumnuche ọjọọ nke ịmata ya n'okwu.
- source_word: λόγῳ
  choice: jiri okwu o kwuru
  rationale: “Jiri” na-egosi instrumental dative; “okwu o kwuru” na-eme ka ntụaka nke speech doo anya n'Igbo, ebe okwu Grik dị n'otu nọmba ka na-anọgide n'ụdị “okwu.”
theological_decisions:
- issue: Isiokwu plural nke ngwaa Grik bụ nke a na-akpọghị aha
  choice: Ha
  alternative: Ndị isi nchụàjà, ndị odeakwụkwọ, na ndị okenye
  rationale: Amaokwu ahụ akpọghị ndị mere ihe ahụ aha ọzọ; ya mere “Ha” na-echekwa implicit plural ma ghara ibubata nkọwa sitere n'amaokwu gara aga n'ime amaokwu a.
- issue: Ụzọ e si ghọta λόγῳ dị ka ihe e ji amata Jizọs
  choice: okwu o kwuru
  alternative: otu okwu
  rationale: Nke a na-egosi na atụmatụ ahụ bụ iji azịza ma ọ bụ okwu ya jide ya, n'emebighị ihe atụ nke ọnyà dị na ἀγρεύσωσιν.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. A họọrọ “ndị otu Herọd” iji mee ka aha otu ahụ doo anya, ma e chekwara usoro akụkọ na ihe atụ nke ọnyà.
