review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperfect setting of Jesus’ speech, the warning, the scribes’ status-seeking desire, their public walking, and greetings in the marketplaces. However, “uwe mwụda ogologo” ordinarily suggests a long skirt rather than the conspicuous long outer garment denoted by στολαί.
  naturalness: “Kpacharanụ anya n’ebe ... nọ” is idiomatic, but the original placement of “nọ” and the sequence “ịna-eyiri ... agagharị” are awkward. Recasting the phrase as “ndị chọrọ ịgagharị n’uwe elu ogologo” is clearer, natural Standard Igbo, and retains the participial qualification.
  terminology: “Ndị odeakwụkwọ Iwu” appropriately distinguishes the Gospel-era scribes from modern office secretaries. “Uwe elu ogologo” better represents the long outer garments. The cultural note is adjusted accordingly.
  issues:
  - severity: medium
    issue: “uwe mwụda ogologo” is an unsuitable rendering of στολαί.
    rationale: In contemporary Standard Igbo, “mwụda” commonly denotes a skirt. The Greek refers to long, stately outer garments, not specifically skirts.
  - severity: low
    issue: The clothing-and-walking expression is syntactically awkward.
    rationale: “Ịna-eyiri uwe ... agagharị” does not naturally express walking about while clothed in the garments. “Ịgagharị n’uwe ...” does.
  - severity: low
    issue: Footnote anchor a is attached after the noun phrase rather than the warning expression.
    rationale: The lexical alternatives explain Βλέπετε ἀπό, so the anchor should follow “Kpacharanụ anya.”
