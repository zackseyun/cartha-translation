  text: Καὶ ⸂ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν⸃· Βλέπετε ἀπὸ τῶν γραμματέων τῶν θελόντων ἐν στολαῖς περιπατεῖν καὶ ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: ig
  text: 'N’ime nkuzi ya, ọ nọ na-ekwu, “Kpacharanụ anya[a] n’ebe ndị odeakwụkwọ Iwu ndị chọrọ ịgagharị n’uwe elu ogologo[b] na ịnata ekele n’ámá ahịa nọ,”


    [a] A pụkwara ịsụgharị ya, “Lezienụ ndị odeakwụkwọ Iwu anya,” ma ọ bụ, “Nọrọnụ na nche megide ndị odeakwụkwọ Iwu.”


    [b] “Uwe elu ogologo” na-ezo aka n’uwe elu pụtara ìhè nke ndị mmadụ ji egosi ọkwá ha na nsọpụrụ ha nwere n’ihu ọha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Lezienụ ndị odeakwụkwọ Iwu anya,” ma ọ bụ, “Nọrọnụ na nche megide ndị odeakwụkwọ Iwu.”
    reason: lexical_alternative
  - marker: b
    text: “Uwe elu ogologo” na-ezo aka n’uwe elu pụtara ìhè nke ndị mmadụ ji egosi ọkwá ha na nsọpụrụ ha nwere n’ihu ọha.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: N’ime nkuzi ya
  rationale: Nke a na-egosi ọnọdụ okwu Jizọs n’ime nkuzi ya ma na-edobe usoro okwu Grik n’ụzọ Igbo dị mfe nghọta.
- source_word: ἔλεγεν
  choice: ọ nọ na-ekwu
  rationale: Ụdị imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwukarị; “ọ nọ na-ekwu” na-echekwa akụkụ a.
- source_word: Βλέπετε ἀπὸ
  choice: Kpacharanụ anya n’ebe … nọ
  rationale: Nke a bụ ịdọ aka ná ntị siri ike ka ndị na-ege ntị nọrọ na nche megide àgwà na mmetụta ndị ahụ.
- source_word: γραμματέων
  choice: ndị odeakwụkwọ Iwu
  rationale: Nke a na-edobe echiche ndị odeakwụkwọ n’oge ahụ ma mee ka o doo anya na ọrụ ha metụtara Iwu, ọ bụghị ọrụ odeakwụkwọ nke oge a naanị.
- source_word: τῶν θελόντων
  choice: ndị na-achọ
  rationale: Ọ na-egosi ọchịchọ ma ọ bụ mmasị e ji mara ha, n’emeghị ka okwu ahụ dị nro.
- source_word: ἐν στολαῖς περιπατεῖν
  choice: ịna-eyiri uwe mwụda ogologo agagharị
  rationale: στολή bụ uwe elu ogologo ma pụta ìhè; nsụgharị a na-egosi ma uwe ahụ ma omume ịgagharị n’ihu ọha.
- source_word: ἀσπασμοὺς
  choice: ịnata ekele
  rationale: N’ọnọdụ a, ekele ahụ bụ nkwanye ùgwù a na-egosi ha n’ihu ọha; “ịnata ekele” na-eme ka njikọ ya na ọchịchọ ha doo anya.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: n’ámá ahịa
  rationale: ἀγοραί bụ ebe ahịa na ebe ọha na-ezukọ; “ámá ahịa” bụ okwu Igbo doro anya ma kwekọọ na ọnọdụ ahụ.
theological_decisions:
- issue: Ndị okwu ịdọ aka ná ntị Jizọs gbasara na ike ịdọ aka ná ntị ahụ
  choice: Ịdọ aka ná ntị gbasara ndị odeakwụkwọ Iwu ndị e ji ọchịchọ ugwu n’ihu ọha mara
  alternative: Ikpe ndị odeakwụkwọ Iwu niile ikpe n’enweghị nkewa
  rationale: Nkebi “ndị na-achọ…” na-akọwa ụdị ndị odeakwụkwọ Iwu a na-ekwu maka ha. Nsụgharị ahụ hapụrụ njikọ a ka ọ dị, kama ikwu hoo haa na onye odeakwụkwọ Iwu ọ bụla so na ikpe ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. “Ndị odeakwụkwọ Iwu” na-ezere mgbagwoju anya nke “ndị odeakwụkwọ” n’echiche ọrụ ọfịs nke oge a, ebe “uwe mwụda ogologo” na-eme ka ọdịdị uwe ahụ doo anya n’enweghị ịgbakwunye nkọwa n’ahịrị isi.
