  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: ig
  text: Ma ebe ọ maara ihu abụọ ha, ọ sịrị ha, “Gịnị mere unu ji na-anwale m[b]? Wetaranụ m otu mkpụrụ ego denarịọs[a] ka m lee ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Denarịọs bụ mkpụrụ ego ọlaọcha ndị Rom; ụgwọ ọrụ otu ụbọchị na-abụkarị ihe dị ka otu denarịọs.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “Gịnị mere unu ji na-anwa m ọnwụnwa?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: ebe ọ maara
  rationale: Nke a na-egosipụta na Jizọs maara ihe dị ha n’obi, n’etinyeghị nkọwa ọzọ na-adịghị n’ihe odide Grik.
- source_word: ὑπόκρισιν
  choice: ihu abụọ
  rationale: “Ihu abụọ” bụ okwu Igbo doro anya ma dị ike maka omume aghụghọ nke na-eme ka mmadụ yie onye eziokwu.
- source_word: Τί
  choice: Gịnị mere
  rationale: N’usoro ajụjụ a, Τί na-ajụ ihe kpatara omume ha; “Gịnị mere” bụ ụzọ Igbo si kwuo ya n’ụzọ ebumpụta ụwa.
- source_word: πειράζετε
  choice: ji na-anwale
  rationale: “Na-anwale” na-egosi nnwale iro ha ji achọ ijide Jizọs n’okwu, ma ọ naghị amanye nghọta nke ịrafu mmadụ ime mmehie.
- source_word: φέρετέ
  choice: Wetaranụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha butere ya ihe ahụ.
- source_word: δηνάριον
  choice: otu mkpụrụ ego denarịọs
  rationale: E debere aha mkpụrụ ego ahụ iji chekwaa nkọwa akụkọ ihe mere eme, ma tinyekwa “mkpụrụ ego” ka onye na-agụ ya ghọta ozugbo ihe ọ bụ.
- source_word: ἵνα ἴδω
  choice: ka m lee ya
  rationale: Nke a na-egosipụta ebumnuche nke iweta mkpụrụ ego ahụ; “ya” na-ezo aka na denarịọs ahụ dị ka Grik si mee ka a ghọta.
theological_decisions:
- issue: Ihe πειράζετε pụtara n’accusation Jizọs
  choice: nnwale e ji iro na aghụghọ mee
  alternative: ịnwale mmadụ ọnwụnwa, ya bụ, ịrafu ya ka o mee ihe ọjọọ
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ha chọrọ ijide Jizọs n’okwu. “Na-anwale” na-echekwa ike iro ahụ ma na-ahapụ ọdịiche dị n’etiti nnwale na ọnwụnwa ka ihe odide ahụ nwere ike ịgụnye.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E tinyere akara [a] n’akụkụ “denarịọs,” ebe nkọwa omenala ya metụtara, na [b] n’akụkụ “na-anwale m,” ebe ntụgharị okwu ọzọ metụtara.
