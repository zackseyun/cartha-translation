id: MRK.12.14
reference: Mark 12:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: ig
  text: Ha bịara sị ya, “Onye Ozizi, anyị maara na ị bụ onye eziokwu, na ị naghị ekwe ka onye ọ bụla metụta gị, n’ihi na ị naghị ele mmadụ anya n’ihu[a], kama ị na-akụzi ụzọ Chineke n’eziokwu. Ọ̀ kwere n’iwu ịkwụ Siza ụtụ isi a na-atụ onye ọ bụla[b], ka ọ bụ na o kweghị? Ànyị ga-akwụ ya, ka anyị ghara ịkwụ ya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ị naghị egosi mmadụ ihu ọma ma ọ bụ kwe ka ọdịdị na ọkwá mmadụ metụta gị.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ κῆνσος, ya bụ ụtụ ndị Rom na-atụ onye ọ bụla e debanyere aha ya n’ọnụ ọgụgụ.
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Ọ bụ ụzọ doro anya ma bụrụkwa nke a na-eji n’Igbo ugbu a akpọ onye na-akụzi ihe.
- source_word: ἀληθὴς
  choice: onye eziokwu
  rationale: Nke a na-akọwa Jizọs dị ka onye na-ekwu ma na-eme ihe kwekọrọ n’eziokwu, n’asụsụ Igbo dị mfe ma dị ùgwù.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: ị naghị ekwe ka onye ọ bụla metụta gị
  rationale: Nsụgharị a na-egosi na echiche, ọkwá, ma ọ bụ nrụgide mmadụ adịghị eme ka ọ gbanwee okwu ya; ọ na-ezere nghọtahie nke ‘ị naghị eche banyere onye ọ bụla’ dị ka enweghị ịhụnanya.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: ị naghị ele mmadụ anya n’ihu
  rationale: Nke a bụ akpaalaokwu Igbo e ji ekwu na mmadụ adịghị ele mmadụ anya ma ọ bụ gosi mmadụ ihu ọma n’ihi ọkwá ya; ọ na-edebekwa oyiyi ‘ihu’ dị na Grik.
- source_word: ἐπ’ ἀληθείας
  choice: n’eziokwu
  rationale: Ọ na-akọwa otú o si akụzi ihe, ma kwekọọ nke ọma na okwu Grik ahụ.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: ụzọ Chineke
  rationale: E debere ihe atụ nke ‘ụzọ’ n’ihi na ọ bụ okwu Akwụkwọ Nsọ a maara nke ọma, nke gụnyere nkuzi na omume Chineke chọrọ.
- source_word: ἔξεστιν
  choice: Iwu ò kwere
  rationale: Nke a na-egosipụta ajụjụ gbasara ihe iwu kwadoro ma ọ bụ nyere ohere, n’enweghị ịkọwa tupu oge eruo ma ha bu n’uche iwu Rom, iwu okpukpe, ma ọ bụ ụkpụrụ omume.
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: ka a kwụọ Siza ụtụ isi onye ọ bụla
  rationale: ‘Kwụọ’ bụ ngwaa Igbo kwesịrị ekwesị maka ụtụ isi, ebe ‘ụtụ isi onye ọ bụla’ na-eme ka ụdị ụtụ Rom a kapịrị ọnụ doo anya.
- source_word: Καίσαρι
  choice: Siza
  rationale: A sụgharịrị aha ọchịchị Rom a n’ụdị a maara nke ọma n’Igbo.
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: Ànyị ga-akwụ ya, ka anyị ghara ịkwụ ya?
  rationale: E debere nkwughachi ngwaa ahụ iji chekwaa ịdị nkọ nke ajụjụ ọnyà ahụ.
theological_decisions:
- issue: Akpaalaokwu gbasara ile mmadụ anya n’ihu
  choice: ị naghị ele mmadụ anya n’ihu
  alternative: ị naghị egosi mmadụ ihu ọma; ọdịdị mmadụ adịghị emetụta gị
  rationale: Akpaalaokwu Igbo a na-eburu ma oyiyi ihu dị n’ederede Grik ma echiche nke enweghị ajọ mbunobi; ọ naghị etinye nkọwa ụka pụrụ iche.
- issue: Ihe iwu kwere
  choice: Iwu ò kwere
  alternative: Ọ̀ bụ ihe ziri ezi; à na-enye ohere
  rationale: E debere mgbagwoju anya banyere ụdị iwu ma ọ bụ ikike ha na-ajụ maka ya, kama ikpebi na ọ bụ naanị iwu Rom ma ọ bụ naanị iwu okpukpe.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. E jiri akpaalaokwu Igbo ‘ile mmadụ anya n’ihu’ chekwaa ma oyiyi Grik ma ihe ọ pụtara. E debere nkwughachi dị n’ajụjụ ikpeazụ iji gosipụta ike na ọdịdị ọnyà nke ajụjụ ahụ.
