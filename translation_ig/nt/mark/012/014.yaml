revisions:
- from: Ha bịara sị ya, “Onye Ozizi, anyị maara na ị bụ onye eziokwu, na ị naghị ekwe ka onye ọ bụla metụta gị, n’ihi na ị naghị ele mmadụ anya n’ihu[a], kama ị na-akụzi ụzọ Chineke n’eziokwu. Iwu ò kwere ka a kwụọ Siza ụtụ isi onye ọ bụla[b], ka ọ bụ na o kweghị? Ànyị ga-akwụ ya, ka anyị ghara ịkwụ ya?”
  to: Ha bịara sị ya, “Onye Ozizi, anyị maara na ị bụ onye eziokwu, na ị naghị ekwe ka onye ọ bụla metụta gị, n’ihi na ị naghị ele mmadụ anya n’ihu[a], kama ị na-akụzi ụzọ Chineke n’eziokwu. Ọ̀ kwere n’iwu ịkwụ Siza ụtụ isi a na-atụ onye ọ bụla[b], ka ọ bụ na o kweghị? Ànyị ga-akwụ ya, ka anyị ghara ịkwụ ya?”
