  to: Devid n’onwe ya kwuru n’ime Mmụọ Nsọ[b], sị, “Onyenwe gwara Onyenwe m, ‘Nọdụ ala n’aka nri m ruo mgbe m ga-edobe ndị iro gị n’okpuru ụkwụ gị.’”[a]
