    text: E hotara okwu a n’Abụ Ọma 110:1. N’ederede Hibru, «Onyenwe» nke mbụ nọchiri anya aha Chineke (YHWH, nke a na-asụgharịkarị «ONYENWE ANYỊ»), ebe nke abụọ na-ezo aka n’onye Devid kpọrọ Onyenwe ya.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, «site na Mmụọ Nsọ.»
    reason: alternative_reading
