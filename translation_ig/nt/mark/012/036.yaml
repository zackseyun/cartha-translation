id: MRK.12.36
reference: Mark 12:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: ig
  text: Devid n’onwe ya kwuru n’ime Mmụọ Nsọ[b], sị, “Onyenwe gwara Onyenwe m, ‘Nọdụ ala n’aka nri m ruo mgbe m ga-edobe ndị iro gị n’okpuru ụkwụ gị.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: E hotara okwu a n’Abụ Ọma 110:1. N’ederede Hibru, «Onyenwe» nke mbụ nọchiri anya aha Chineke (YHWH, nke a na-asụgharịkarị «ONYENWE ANYỊ»), ebe nke abụọ na-ezo aka n’onye Devid kpọrọ Onyenwe ya.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, «site na Mmụọ Nsọ.»
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: Devid n’onwe ya
  rationale: Ọ na-echekwa nkwusi ike nke αὐτός, na-egosi na ọ bụ Devid n’onwe ya kwuru okwu ahụ.
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: n’ime Mmụọ Nsọ
  rationale: Ọ na-agbaso ἐν nke ọma ma ghara ikpebi n’ụzọ siri ike ma okwu ahụ pụtara ọnọdụ ime mmụọ ma ọ bụ onye mere ka Devid kwuo ya.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị asụgharị κύριος mgbe ọ na-ezo aka n’Onyenwe Chineke; nkọwa ala peeji na-egosi na n’Abụ Ọma Hibru okwu mbụ nọchiri aha Chineke.
- source_word: τῷ κυρίῳ μου
  choice: Onyenwe m
  rationale: Ọ na-echekwa nkwughachi nke κύριος na ihe Devid kwuru banyere onye ọ na-akpọ Onyenwe ya.
- source_word: Κάθου
  choice: Nọdụ ala
  rationale: Nke a bụ iwu dị mfe ma bụrụkwa Igbo e ji akọwa ịnọ n’oche ọchịchị.
- source_word: ἐκ δεξιῶν μου
  choice: n’aka nri m
  rationale: Ọ bụ ụzọ Igbo sitere n’okike isi kwuo ọnọdụ nsọpụrụ nke akpaalaokwu Grik a na-egosi.
- source_word: ἕως ἂν θῶ
  choice: ruo mgbe m ga-edobe
  rationale: Ọ na-egosi oke oge e nyere n’iwu ahụ na omume ga-eme n’ọdịnihu.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: n’okpuru ụkwụ gị
  rationale: Ọ na-agbaso kpọmkwem onyonyo Grik nke idobe ndị iro n’okpuru ụkwụ, n’etinyeghị okwu ‘ihe mgbakwasị ụkwụ’ nke na-adịghị n’ahịrị Grik a.
theological_decisions:
- issue: Ụzọ e si kọwaa na Devid kwuru okwu site ná mmekọrịta Mmụọ Nsọ
  choice: Devid n’onwe ya kwuru n’ime Mmụọ Nsọ
  alternative: Devid n’onwe ya kwuru site na Mmụọ Nsọ
  rationale: ‘N’ime’ na-echekwa ọdịdị ἐν ma hapụkwa nghọta gbasara kpọmkwem otú Mmụọ Nsọ si rụọ ọrụ n’okwu Devid ka ọ ghara ịbụ nke a kpebiri karịa ihe Grik kwuru.
- issue: Ike okwu Abụ Ọma 110:1 nwere banyere Kraịst
  choice: Onyenwe anyị gwara Onyenwe m
  alternative: Yahweh gwara Onyenwe m
  rationale: Isiokwu ahụ na-echekwa κύριος ugboro abụọ dịka ọ dị na Grik Mak, ebe nkọwa ala peeji na-akọwa na okwu nke mbụ nọchiri aha Chineke n’ederede Hibru.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ugwu ma doo ndị nkịtị anya. E debere usoro okwu amụma ahụ na nkwughachi ‘Onyenwe’ n’ụzọ na-echekwa mgbagwoju anya na ike arụmụka dị n’ederede mbụ.
