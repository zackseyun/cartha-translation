review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the emphasis in αὐτὸς, the double use of κύριος, the enthronement idiom, and Mark’s shorter ‘under your feet’ wording. However, «Onyenwe anyị» (‘our Lord’) introduces a first-person plural possessive not present in the first κύριος; the first occurrence should be unpossessed. The footnote anchors are also attached to the wrong expressions: the alternative ‘by/through the Holy Spirit’ must be anchored at ‘Mmụọ Nsọ,’ while the Psalm/source note belongs with the quotation.'
  naturalness: ‘Devid n’onwe ya kwuru n’ime Mmụọ Nsọ, sị’ is clear, dignified Standard Igbo and preserves the Greek’s noncommittal ἐν phrasing. ‘Nọdụ ala n’aka nri m’ and ‘n’okpuru ụkwụ gị’ are natural biblical-register Igbo.
  terminology: Use «Onyenwe» for the unpossessed first κύριος and «Onyenwe m» for τῷ κυρίῳ μου. This retains the Greek repetition while retaining the possessive only where Greek has μου. The Hebrew-background note may explain the divine-name correspondence without importing it into the text.
  issues:
  - severity: medium
    issue: The first κύριος is translated «Onyenwe anyị».
    rationale: «anyị» means ‘our’ and has no counterpart in the Greek phrase εἶπεν κύριος. It also weakens the exact contrast between unpossessed κύριος and τῷ κυρίῳ μου (‘my Lord’).
  - severity: medium
    issue: Footnote markers are attached to the wrong anchors.
    rationale: Marker a, whose content identifies Psalm 110:1 and discusses the quotation, is attached to ‘Mmụọ Nsọ’; marker b, whose content gives the alternative ‘by the Holy Spirit,’ is attached to ‘Onyenwe m.’ This reverses their stated functions and should be structurally corrected.
  revised_text: Devid n’onwe ya kwuru n’ime Mmụọ Nsọ[b], sị, “Onyenwe gwara Onyenwe m, ‘Nọdụ ala n’aka nri m ruo mgbe m ga-edobe ndị iro gị n’okpuru ụkwụ gị.’”[a]
  revised_footnotes:
