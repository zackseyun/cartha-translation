  text: ἔτι ⸂ἕνα εἶχεν, υἱὸν ἀγαπητόν· ἀπέστειλεν⸃ αὐτὸν ⸂ἔσχατον πρὸς αὐτοὺς⸃ λέγων ὅτι Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/006.yaml
  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: ig
  text: Ọ ka nwere otu onye fọdụrụ—nwa ya nwoke ọ hụrụ n’anya.[a] N’ikpeazụ, o zigara ha ya, na-asị, “Ha ga-asọpụrụ nwa m.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nwa ya nwoke ọ hụrụ n’anya nke ukwuu.”
    reason: lexical_alternative
  - marker: b
    text: Ngwaa Grik a nwekwara ike ịpụta “ha ga-enwe ihere n’ihu ya” ma ọ bụ “ha ga-egosi ya nsọpụrụ”; n’ebe a, ihe ndị gbara ya gburugburu kwadoro “ha ga-asọpụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: Ọ ka nwere otu onye fọdụrụ
  rationale: Nke a na-egosi na, mgbe o zigachara ndị ohu ndị ọzọ, otu onye ka fọdụrụ ya iziga; ọ bụkwa okwu Igbo doro anya ma dị ndụ.
- source_word: υἱὸν ἀγαπητόν
  choice: nwa ya nwoke ọ hụrụ n’anya
  rationale: Ọ na-egosipụta ma na onye ahụ bụ nwa ya nwoke, ma na ọ hụrụ ya n’anya, n’etinyeghị nkọwa ozizi ọzọ n’ime amaokwu ahụ.
- source_word: ἀπέστειλεν ... ἔσχατον πρὸς αὐτούς
  choice: Ọ bụ ya ka o zigara ha n’ikpeazụ
  rationale: Nhazi a na-eme ka ọnọdụ nwa ahụ dịka onye ikpeazụ e zigara pụta ìhè, ma na-ada ka Igbo nkịtị.
- source_word: λέγων ὅτι
  choice: na-asị
  rationale: Ọ na-ewebata okwu onye nwe ubi kwuru kpọmkwem n’ụzọ dabara n’akụkọ Igbo.
- source_word: Ἐντραπήσονται
  choice: Ha ga-asọpụrụ
  rationale: N’ọnọdụ a, ngwaa ahụ na-egosi ịkwanyere onye ahụ ùgwù ma ọ bụ igosi ya nsọpụrụ; “ga-asọpụrụ” bụ okwu Igbo doro anya.
- source_word: τὸν υἱόν μου
  choice: nwa m
  rationale: Ọ na-echekwa okwu onye nwe ubi dị mfe ma na-edobe mkpa okwu ahụ nwere n’ilu ahụ.
theological_decisions:
- issue: Mmetụta okwu “nwa ya nwoke ọ hụrụ n’anya” nwere n’otu Mak si kọwaa Jizọs
  choice: Edobere okwu ahụ n’ederede n’enweghị ịgbasa nkọwa ya.
  alternative: nwa ya nwoke ọ hụrụ n’anya nke ukwuu
  rationale: Okwu ahụ na-eme ka onye na-agụ ya cheta otu Mak si kpọọ Jizọs Ọkpara a hụrụ n’anya, ma nsụgharị ekwesịghị itinye nkọwa ozizi n’elu ihe ederede kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. Ahịrịokwu nke abụọ jiri “Ọ bụ ya ka” mee ka nwa ahụ dịka onye ikpeazụ e zigara pụta ìhè.
