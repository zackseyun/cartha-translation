  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐκείνη πορευθεῖσα ἀπήγγειλεν τοῖς μετ’ αὐτοῦ γενομένοις πενθοῦσι καὶ κλαίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/010.yaml
  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: ig
  text: Ọ wee gaa kọọrọ ndị ha na ya nọbu[a] ihe ahụ, ndị nọ na-eru uju ma na-akwa ákwá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ wee gaa gwa ndị ha na ya nọbu, ndị nọ na-eru uju ma na-akwa ákwá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνη
  choice: Ọ
  rationale: Nnọchiaha a na-ezo aka na Meri Magdalin nke a kpọrọ aha n’amaokwu bu ụzọ; “Ọ” bụ ụzọ Igbo si ekwu ya nke ọma n’enweghị ikwughachi aha ya.
- source_word: πορευθεῖσα
  choice: wee gaa
  rationale: Nke a na-egosi na ọ gara tupu o zie ha ozi; “wee gaa” na-edobe usoro omume ahụ n’Igbo dị mfe ma dị eke.
- source_word: ἀπήγγειλεν
  choice: kọọrọ ... ihe ahụ
  rationale: Okwu Grik ahụ pụtara izisa ma ọ bụ ịkọrọ mmadụ ozi. E tinyere “ihe ahụ” site n’ihe gbara amaokwu ahụ gburugburu, ebe ihe a kọrọ bụ nrịpụta na ọhụhụ a kpọtụrụ aha n’amaokwu bu ụzọ.
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: ndị ha na ya nọbu
  rationale: Nke a na-egosi ndị sokọrọ Jizọs ma ọ bụ ndị ha na ya nọbu. Nsụgharị a na-edobe nnọchiaha dị n’ihe odide Grik kama itinye aha Jizọs n’ahịrị ahụ.
- source_word: πενθοῦσι
  choice: ndị nọ na-eru uju
  rationale: “Iru uju” na-egosi mwute miri emi n’ihi ọnwụ ma dabara n’ọnọdụ a.
- source_word: καὶ κλαίουσιν
  choice: ma na-akwa ákwá
  rationale: “Ịkwa ákwá” bụ okwu Igbo doro anya ma dị ùgwù maka κλαίω n’ọnọdụ iru uju.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù mee ihe. Ahịrị ahụ na-edobe nnọchiaha nke ihe odide Grik, yana omume abụọ nke iru uju na ịkwa ákwá.
