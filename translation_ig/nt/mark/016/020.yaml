revisions:
- from: Ha wee pụọ gaa kwusaa ozi ahụ n’ebe niile, ebe Onyenwe anyị so ha na-arụ ọrụ, na-emekwa ka ozi ahụ bụrụ ihe a pụrụ ịtụkwasị obi site n’ihe ịrịba ama ndị sochiri ya.[a][b]
  to: Ha wee pụọ gaa kwusaa n’ebe niile, ebe Onyenweanyị na ha na-arụkọ ọrụ ma na-akwado okwu ahụ[a] site n’ihe ịrịba ama ndị na-eso.[b]
  rationale: The revision avoids adding an object to “proclaimed,” preserves λόγος at its actual syntactic location as “okwu ahụ,” renders βεβαιοῦντος directly as “na-akwado,” and leaves the implicit relationship of the signs unspecified, as in the Greek. Footnote anchors are placed immediately after the terms they explain.
