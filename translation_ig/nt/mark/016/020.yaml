  text: ἐκεῖνοι δὲ ἐξελθόντες ἐκήρυξαν πανταχοῦ, τοῦ κυρίου συνεργοῦντος καὶ τὸν λόγον βεβαιοῦντος διὰ τῶν ἐπακολουθούντων ⸀σημείων.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: ig
  text: Ha wee pụọ gaa kwusaa n’ebe niile, ebe Onyenweanyị na ha na-arụkọ ọrụ ma na-akwado okwu ahụ[a] site n’ihe ịrịba ama ndị na-eso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “okwu ahụ” dịka “ozi ahụ.” Okwu Grik λόγος nwere ike ịpụta “okwu,” ma n’ebe a ọ na-arụtụ aka n’ozi ha kwusara.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “ihe ịrịba ama ndị na-eso” dịka “ihe ịrịba ama ndị sochiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι
  choice: Ha
  rationale: Nnọchiaha a na-arụtụ aka n’ìgwè ndị na-eso ụzọ a kpọtụrụ aha n’akụkụ okwu bu ụzọ; “Ha” bụ ụzọ Igbo kacha dị mfe ma bụrụkwa nke eke.
- source_word: δὲ
  choice: wee
  rationale: N’ebe a δέ na-aga n’ihu n’akụkọ kama igosi mgbagha siri ike; “wee” na-ejikọta omume ndị ahụ nke ọma n’Igbo.
- source_word: ἐξελθόντες
  choice: pụọ gaa
  rationale: A sụgharịrị participle a dịka omume na-eso ibe ya n’akụkọ; ọ na-echekwa echiche nke ịpụ gaa n’ozi.
- source_word: ἐκήρυξαν
  choice: kwusaa ozi ahụ
  rationale: κηρύσσω pụtara ikwusa ihe n’ihu ọha; “kwusaa ozi ahụ” bụ okwu doro anya nye ndị na-agụ Igbo taa ma ghara ime ka ọ bụrụ naanị okwuchukwu n’ụlọ ụka.
- source_word: πανταχοῦ
  choice: n’ebe niile
  rationale: Nke a bụ ntụgharị Igbo dị mfe ma kwekọọ n’echiche nke ‘everywhere.’
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: Aha a na-echekwa κύριος dịka aha nsọ a na-ejikarị eme ihe n’Igbo; n’akụkụ okwu a, ọ na-arụtụ aka na Jizọs.
- source_word: συνεργοῦντος
  choice: so ha na-arụ ọrụ
  rationale: Ọ na-echekwa echiche συνεργ- nke ịrụkọ ọrụ, ma na-egosi na Onyenwe anyị na-akwado ọrụ ha.
- source_word: τὸν λόγον
  choice: ozi ahụ
  rationale: N’ebe a λόγος na-arụtụ aka n’ozi a na-ekwusa, ọ bụghị naanị otu mkpụrụokwu; e debere ‘okwu ahụ’ dịka ntụgharị ọzọ n’ala ala peeji.
- source_word: βεβαιοῦντος
  choice: na-emekwa ka ozi ahụ bụrụ ihe a pụrụ ịtụkwasị obi
  rationale: Nke a na-ebupụta echiche nke ịkwado ma ọ bụ igosi na ozi ahụ bụ eziokwu n’Igbo doro anya.
- source_word: διὰ
  choice: site na
  rationale: διά na genitive na-egosi ụzọ ma ọ bụ ihe e ji mee ihe; “site na” bụ Igbo eke.
- source_word: τῶν ἐπακολουθούντων σημείων
  choice: ihe ịrịba ama ndị sochiri ya
  rationale: ἐπακολουθέω nwere ike ịpụta iso n’azụ ma ọ bụ iso ihe na-aga; ntụgharị a na-echekwa ihe oyiyi nke iso, ebe ndetu na-egosi nghọta ọzọ nke iso ya na-adị.
theological_decisions:
- issue: Onye okwu ahụ bụ ‘Onyenwe anyị’ na-arụtụ aka na ya
  choice: E debere naanị aha ahụ bụ ‘Onyenwe anyị,’ ebe okwu gbara ya gburugburu na-arụtụ aka na Jizọs onye bilitere n’ọnwụ.
  alternative: Ịghọta ya dịka Chineke n’ozuzu ya.
  rationale: Mak 16:19 kpọrọ Jizọs ‘Onyenwe anyị’; idegharị ya n’aha a na-echekwa njikọ ahụ n’etinyeghị nkọwa ozizi ọzọ n’ime amaokwu.
- issue: Ọrụ ihe ịrịba ama ndị ahụ
  choice: Ihe ịrịba ama ndị ahụ bụ ụzọ Onyenwe anyị si mee ka ozi a kwusara bụrụ ihe a pụrụ ịtụkwasị obi.
  alternative: Ihe ịrịba ama ndị ahụ sochiri ndị nkwusa, ma e kwughị na ha na-akwado ozi ahụ.
  rationale: Nhazi okwu Grik jikọtara ime ka λόγος guzosie ike na ihe ịrịba ama ndị sochiri; nke a na-egosi ọrụ nkwado, ma amaokwu ahụ ekwughị ma ihe ịrịba ama dị otú ahụ ga-adịru mgbe niile.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro “Ha wee…” na-enye akụkọ ahụ ụda Igbo eke. E tinyere akara ndetu [a] na [b] ozugbo n’isiokwu metụtara ha, ma chekwaa nghọtahie kwesịrị ekwesị dị na ἐπακολουθούντων na λόγος.
