revisions:
- from: Ha wee pụọ, gbapụ n’ili ahụ[a], n’ihi na ahụ ịma jijiji na oke ihe ijuanya ejidewo ha. Ha agwaghịkwa onye ọ bụla ihe ọ bụla, n’ihi na ụjọ tụrụ ha.
  to: Ha si n’ili ahụ pụọ wee gbapụ[a], n’ihi na ịma jijiji na oke ihe ijuanya jidere ha. Ha agwaghị onye ọ bụla ihe ọ bụla, n’ihi na ha na-atụ egwu.
  rationale: The revision preserves the Greek meaning and Mark’s concise, fearful conclusion while making the verb sequence and emotional terms natural in Standard Igbo. The footnote remains outside the main text because the supplied SBLGNT places the shorter ending in double brackets; its translation is revised only for clarity and fidelity, especially ‘through them.’
