review_pass:
  verdict: revise
  source_fidelity: The main verse accurately retains the women’s departure and flight, the causal force of γάρ, the twofold description τρόμος καὶ ἔκστασις, and the emphatic statement that they told no one anything. A revision is warranted because “Ha wee pụọ, gbapụ” is not a natural way to coordinate the participial departure and the finite verb ‘fled’ in Standard Igbo. The footnote should also render δι’ αὐτῶν clearly as ‘through them.’
  naturalness: Use a sequential Igbo construction, “Ha si n’ili ahụ pụọ wee gbapụ,” rather than juxtaposing two verbs after one subject. “Ịma jijiji” is idiomatic without “ahụ.” “Ha na-atụ egwu” naturally represents the ongoing imperfect ἐφοβοῦντο.
  terminology: “Ili” appropriately renders μνημεῖον in this context. “Oke ihe ijuanya” is a defensible contextual rendering of ἔκστασις. The textual-variant note is retained and its wording is adjusted for idiomatic Standard Igbo and accurate transmission of the shorter ending.
  issues:
  - severity: medium
    issue: Main-text verb sequence is unnatural
    rationale: “Ha wee pụọ, gbapụ” lacks a natural connective relationship in Standard Igbo. The Greek aorist participle precedes the main verb, and “Ha si n’ili ahụ pụọ wee gbapụ” expresses that sequence clearly.
  - severity: low
    issue: “ahụ ịma jijiji” is awkward
    rationale: The modifier “ahụ” is unnecessary and makes the phrase less idiomatic. “Ịma jijiji” adequately conveys τρόμος.
  - severity: medium
    issue: Footnote wording for δι’ αὐτῶν is unclear
    rationale: “Jizọs n’onwe ya sikwa n’aka ha zipụ” is syntactically awkward. “Jizọs n’onwe ya sikwa n’aka ha ziga” clearly states that Jesus sent the proclamation through them.
  revised_text: Ha si n’ili ahụ pụọ wee gbapụ[a], n’ihi na ịma jijiji na oke ihe ijuanya jidere ha. Ha agwaghị onye ọ bụla ihe ọ bụla, n’ihi na ha na-atụ egwu.
