  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: ig
  text: Ha si n’ili ahụ pụọ wee gbapụ[a], n’ihi na ịma jijiji na oke ihe ijuanya jidere ha. Ha agwaghị onye ọ bụla ihe ọ bụla, n’ihi na ha na-atụ egwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ ihe odide aka gbakwụnyere ihe a na-akpọ ngwụcha dị mkpirikpi: “Ha wee kọọrọ ndị nọ Pita gburugburu ná nkenke ihe niile e nyere ha iwu. Mgbe ihe ndị a gasịrị, Jizọs n’onwe ya sikwa n’aka ha ziga, site n’ọwụwa anyanwụ ruo n’ọdịda anyanwụ, ozi nsọ na nke na-adịghị emebi emebi banyere nzọpụta ebighị ebi. Amen.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: Ha wee pụọ
  rationale: A sụgharịrị aorist participle nke na-ezo aka n’ụmụanyị ahụ n’ụzọ na-egosi usoro ihe mere, ma bụrụkwa Igbo dị mfe ma kwekọọ n’akụkọ.
- source_word: ἔφυγον
  choice: gbapụ
  rationale: “Gbapụ” na-egosipụta ike na ngwa ngwa dị na φεύγω karịa nanị “pụwa.”
- source_word: μνημείου
  choice: ili ahụ
  rationale: N’akụkọ mbilite n’ọnwụ, “ili” bụ okwu Igbo nkịtị na nke ziri ezi maka μνημεῖον.
- source_word: εἶχεν αὐτὰς
  choice: ejidewo ha
  rationale: Nkebiokwu a na-egosi na mmetụta ndị ahụ achịkọtala ha; “ejidewo ha” na-edobe ike nke okwu Grik ahụ.
- source_word: τρόμος
  choice: ahụ ịma jijiji
  rationale: Nke a na-egosipụta ịma jijiji nke ahụ, ma ghara ijikọta ya kpamkpam na ụjọ a kpọrọ aha na ngwụcha amaokwu ahụ.
- source_word: ἔκστασις
  choice: oke ihe ijuanya
  rationale: N’ebe a okwu ahụ pụtara ọnọdụ nke oke akpata oyi na ihe ijuanya, ọ bụghị obi ụtọ dị ukwuu.
- source_word: οὐδενὶ οὐδὲν
  choice: onye ọ bụla ihe ọ bụla
  rationale: Ya na “agwaghịkwa” na-edobe nkwusiri ike zuru ụwa ọnụ nke okwu Grik abụọ ahụ n’Igbo ebumpụta ụwa.
- source_word: ἐφοβοῦντο
  choice: ụjọ tụrụ ha
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo na ha nọgidere na-atụ ụjọ.
- source_word: γάρ
  choice: n’ihi na
  rationale: N’ebe abụọ ahụ, njikọ a na-eme ka ihe kpatara omume ahụ doo anya n’Igbo, ebe a na-ahapụkwa njedebe amaokwu ahụ ka ọ bụrụ nke mberede.
theological_decisions:
- issue: Otu e si mesoo mkpirikpi njedebe e tinyere mgbe Mak 16:8 gasịrị
  choice: E tinyghị ya n’ahịrị isi; e debere ya n’okpuru peeji dịka ọdịiche dị n’ihe odide aka.
  alternative: Itinye mkpirikpi njedebe ahụ n’ahịrị isi, ma ọ bụ ibipụta njedebe abụọ ahụ n’ahịrị isi.
  rationale: SBLGNT tinyere okwu ndị ahụ n’ime akara nkwado abụọ, nke na-egosi na a naghị ewere ha dịka akụkụ nke ihe odide isi. Idebe ha n’okpuru peeji na-eme ka ọdịiche ahụ pụta ìhè n’enweghị itinye mgbakwunye e mesịrị n’amaokwu isi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji “Ha wee pụọ, gbapụ” chekwaa ngwa ngwa nke akụkọ Mak, ebe “ahụ ịma jijiji na oke ihe ijuanya” na-ekewa τρόμος na ἔκστασις. Akara [a] dị n’ahịrị isi ozugbo e kwuchara ili ahụ.
