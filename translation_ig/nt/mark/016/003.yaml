  to: Ha nọ na-ekwu okwu n’etiti onwe ha, sị, “Ònye ga-atụgharị nkume ahụ pụọ n’ọnụ ili ahụ maka anyị?”
  rationale: The verb has been revised to 'ga-atụgharị ... pụọ' to express moving the stone aside by turning/rolling it away. 'Maka anyị' makes the benefactive force explicit. The ongoing reciprocal speech is expressed idiomatically as 'Ha nọ na-ekwu okwu n’etiti onwe ha.'
