  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἔλεγον πρὸς ἑαυτάς· Τίς ἀποκυλίσει ἡμῖν τὸν λίθον ⸀ἐκ τῆς θύρας τοῦ μνημείου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/003.yaml
  text: And they were saying to one another[a], “Who will roll away the stone for us from the entrance of the tomb?”
translation:
  language: ig
  text: Ha nọ na-ekwu okwu n’etiti onwe ha, sị, “Ònye ga-atụgharị nkume ahụ pụọ n’ọnụ ili ahụ maka anyị?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: Ha nọkwa na-agwa
  rationale: Oge imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwughachi; ‘nọ na-agwa’ na-echekwa akụkụ a.
- source_word: πρὸς ἑαυτάς
  choice: ibe ha
  rationale: N’agbanyeghị na okwu ahụ pụtara n’ụzọ nkịtị ‘onwe ha,’ n’ebe a ọ na-egosi na ụmụ nwanyị ahụ na-agwa ibe ha okwu.
- source_word: Τίς
  choice: Ònye
  rationale: Ọ bụ ajụjụ banyere onye ga-arụ ọrụ ahụ; ‘Ònye’ bụ ntụgharị Igbo doro anya ma bụrụkwa nke e ji eme ihe.
- source_word: ἀποκυλίσει
  choice: ga-akpọpụụrụ
  rationale: Ngwaa ahụ na-akọwa ịkpọgharị ihe ka o si n’ebe ọ nọ pụọ; ‘kpọpụ’ na-echekwa echiche nke ịkpọgharị nkume ahụ pụọ n’ọnụ ili.
- source_word: ἡμῖν
  choice: anyị
  rationale: Dative a na-egosi uru ma ọ bụ ọrụ a ga-arụrụ ha; suffix ‘-ụrụ’ tinyere ‘anyị’ na-enye echiche ‘maka anyị’ n’Igbo nkịtị.
- source_word: τὸν λίθον
  choice: nkume ahụ
  rationale: Isiokwu ahụ na-ekwu naanị ‘nkume’; etinyeghị ‘nnukwu’ n’ihi na ọ dịghị n’amaokwu a.
- source_word: ἐκ τῆς θύρας
  choice: n’ọnụ
  rationale: θύρα nwere ike ịbụ ọnụ ụzọ ma ọ bụ ebe mbata. Maka ili a wara n’oké nkume, ‘ọnụ ili’ bụ okwu Igbo eke ma doo anya karịa echiche nke ibo ụzọ e ji osisi mee.
- source_word: τοῦ μνημείου
  choice: ili ahụ
  rationale: N’ọnọdụ a μνημεῖον bụ ebe e liri mmadụ; ‘ili’ bụ okwu Standard Igbo doro anya maka ya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ‘Ha nọkwa na-agwa ibe ha, sị’ na-egosipụta okwu na-aga n’ihu, ebe ‘kpọpụụrụ anyị’ na-ejikọta mmegharị nkume ahụ na uru e meere ụmụ nwanyị ahụ.
