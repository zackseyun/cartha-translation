review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys that the group heard two claims—Jesus was alive and he had been seen by the woman—and did not believe. However, “na ọ hụla ya” is referentially ambiguous in Igbo: after “ọ dị ndụ,” readers can naturally take its subject “ọ” to remain Jesus, producing the opposite sense, that he saw her. The woman must be made explicit.'
  naturalness: “Mgbe ha nụrụ … ha ekweghị” is clear, modern Standard Igbo. Replacing the ambiguous pronouns in the second reported claim with “nwaanyị ahụ hụrụ ya” makes the sentence natural and immediately comprehensible.
  terminology: “ọ dị ndụ” accurately expresses ζῇ in this resurrection context. “nwaanyị ahụ” appropriately identifies the antecedent of αὐτῆς without unnecessarily supplying her name. The direct active wording is idiomatic Igbo while retaining the source sense of the passive “was seen by her.”
  issues:
  - severity: medium
    issue: Ambiguous pronoun reference in “na ọ hụla ya.”
    rationale: The consecutive clauses make “ọ” liable to be understood as Jesus in both clauses, whereas Greek ὑπ’ αὐτῆς identifies the woman as the seer. Explicitly stating “nwaanyị ahụ” preserves the intended participant roles.
  - severity: low
    issue: Footnote b repeats the pronoun ambiguity.
    rationale: “na ọ bụ ya hụrụ ya” does not clearly distinguish the woman from Jesus in Igbo. A passive-style alternative with explicit reference is clearer.
  revised_text: Mgbe ha[a] nụrụ na ọ dị ndụ, nakwa na nwanyị ahụ hụrụ ya[b], ha ekweghị.
  revised_footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “ndị ahụ kwa.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na a hụrụ ya site n'aka nwanyị ahụ.”
    reason: lexical_alternative
  revision_rationale: The revision resolves an unintended reversal/ambiguity of subject and object in the report that Jesus had been seen by the woman. It retains the natural active construction in the main Igbo text and gives a closer passive-style alternative in the footnote. No doctrinal interpretation has been added.
