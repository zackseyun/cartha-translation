revisions:
- from: Mgbe ha[a] nụrụ na ọ dị ndụ, nakwa na ọ hụla ya[b], ha ekweghị.
  to: Mgbe ha[a] nụrụ na ọ dị ndụ, nakwa na nwanyị ahụ hụrụ ya[b], ha ekweghị.
  rationale: The revision resolves an unintended reversal/ambiguity of subject and object in the report that Jesus had been seen by the woman. It retains the natural active construction in the main Igbo text and gives a closer passive-style alternative in the footnote. No doctrinal interpretation has been added.
