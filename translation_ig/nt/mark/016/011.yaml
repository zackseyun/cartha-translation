  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κἀκεῖνοι ἀκούσαντες ὅτι ζῇ καὶ ἐθεάθη ὑπ’ αὐτῆς ἠπίστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/011.yaml
  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: ig
  text: Mgbe ha[a] nụrụ na ọ dị ndụ, nakwa na nwanyị ahụ hụrụ ya[b], ha ekweghị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “ndị ahụ kwa.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na a hụrụ ya site n'aka nwanyị ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: ha
  rationale: Ọ na-ezo aka n'ìgwè ahụ a kpọtụrụ aha n'amaokwu bu ụzọ; njikọ dị na mmalite okwu Grik na-aga n'ihu n'ụzọ ebumpụta ụwa site n'usoro akụkọ Igbo.
- source_word: ἀκούσαντες
  choice: Mgbe ha nụrụ
  rationale: Nkebi a na-egosi oge ihe mere, ya mere ‘Mgbe ha nụrụ’ bụ Igbo doro anya nke na-echekwa usoro ihe ndị ahụ.
- source_word: ὅτι
  choice: na
  rationale: Ọ na-ewebata ihe ha nụrụ.
- source_word: ζῇ
  choice: ọ dị ndụ
  rationale: Okwu Grik dị n'oge ugbu a ma na-egosi ndụ na-aga n'ihu; ‘ọ dị ndụ’ na-echekwa nke a nke ọma n'Igbo.
- source_word: καὶ
  choice: nakwa
  rationale: 'Ọ na-ejikọta eziokwu abụọ dị n''ozi ahụ: na ọ dị ndụ nakwa na nwanyị ahụ ahụla ya.'
- source_word: ἐθεάθη ὑπ’ αὐτῆς
  choice: ọ hụla ya
  rationale: 'Ọ bụ ezie na Grik ji usoro nnara mee ihe, Igbo na-ekwukarị ya n''usoro omume: nwanyị ahụ bụ onye hụrụ ya. Nke a na-echekwa ihe okwu ahụ pụtara n''ụzọ dị mfe ma ghara ịsị na Jizọs ‘pụtara’ n''ụzọ okwu Grik na-amanyeghị.'
- source_word: ἠπίστησαν
  choice: ha ekweghị
  rationale: Nke a bụ ụzọ Igbo dị mkpirikpi ma kwụ ọtọ isi kwuo na ha ekweghị ozi ahụ, n'etinyeghị echiche siri ike karịa ihe odide ahụ.
theological_decisions:
- issue: Nkọwa ndụ Jizọs mgbe mbilite n'ọnwụ
  choice: ọ dị ndụ
  alternative: ọ na-adị ndụ
  rationale: ‘Ọ dị ndụ’ bụ okwu Igbo nkịtị ma na-echekwa oge ugbu a nke ζῇ, nke na-egosi na Jizọs ka dị ndụ.
- issue: Usoro nnara na ἐθεάθη ὑπ’ αὐτῆς
  choice: ọ hụla ya
  alternative: a hụrụ ya site n'aka ya
  rationale: Nhọrọ bụ isi na-enye otu ihe okwu Grik pụtara n'Igbo ebumpụta ụwa. Nhọrọ nke abụọ na-esochi usoro okwu Grik nso karị, ma ọ naghị ada ezigbo ụtọ n'Igbo.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro omume maka ἐθεάθη ὑπ’ αὐτῆς n'ihi na ọ bụ ya kacha bụrụ Igbo ebumpụta ụwa; nkọwa ala peeji na-egosi njikọ ya na usoro nnara Grik.
