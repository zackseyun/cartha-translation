    rationale: The repeated belief-form is not idiomatic Standard Igbo here. “ndị kweere” is natural and adequately reflects τοῖς πιστεύσασιν.
  - severity: low
    issue: “ga na-eso” adds an imperfective/progressive nuance.
    rationale: The Greek future παρακολουθήσει simply states that the signs will accompany/follow. “ga-eso” communicates this more directly.
