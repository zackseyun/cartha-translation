source:
  edition: SBLGNT
  text: σημεῖα δὲ τοῖς πιστεύσασιν ⸂ταῦτα παρακολουθήσει⸃, ἐν τῷ ὀνόματί μου δαιμόνια ἐκβαλοῦσιν, γλώσσαις λαλήσουσιν ⸀καιναῖς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/017.yaml
  text: 'And these signs will accompany those who have believed: in my name they will cast out demons[b][a]; they will speak in new tongues.'
translation:
  language: ig
  text: 'Ihe ịrịba ama ndị a ga-eso[b] ndị kweere: n’aha m ha ga-achụpụ mmụọ ọjọọ; ha ga-asụ asụsụ ọhụrụ[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ire ọhụrụ.” Okwu Grik ahụ nwere ike ịpụta “ire” ma ọ bụ “asụsụ”; amaokwu a akọwaghị kpọmkwem ụdị okwu ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ga-esochi.” Ngwaa Grik ahụ nwekwara ike igosi na ihe ịrịba ama ndị a na-anọnyere ndị kweere ekwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: ihe ịrịba ama
  rationale: Nke a na-edobe echiche nke ihe na-egosi ma na-agba akaebe, kama iji okwu sara mbara nke pụtara naanị ọrụ ebube.
- source_word: τοῖς πιστεύσασιν
  choice: ndị kweere ekwe
  rationale: Ụdị a na-egosi ndị batara n’okwukwe, ma ọ ka na-arụ ọrụ dị ka aha izugbe maka ndị kwere ekwe.
- source_word: ταῦτα
  choice: ndị a
  rationale: Ọ na-atụ aka n’ihe ịrịba ama ndị a ga-edepụta ozugbo n’ihu.
- source_word: παρακολουθήσει
  choice: ga na-eso
  rationale: Nke a na-egosi na ihe ịrịba ama ndị ahụ ga-anọnyere ndị kweere ekwe ma soro ha, ọ bụghị nanị na ha ga-abịa n’azụ ha n’usoro oge.
- source_word: ἐν τῷ ὀνόματί μου
  choice: n’aha m
  rationale: Ọ bụ ụzọ Igbo doro anya e si egosi ime ihe n’okpuru ikike Jizọs.
- source_word: δαιμόνια
  choice: mmụọ ọjọọ
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị mmụọ ọjọọ; ọ naghị ebubata okwu Grik ọzọ nke pụtara ‘mmụọ na-adịghị ọcha.’
- source_word: ἐκβαλοῦσιν
  choice: ga-achụpụ
  rationale: ‘Ịchụpụ’ na-egosi iwepụ ndị mmụọ ọjọọ n’ike ma dabara n’ọnọdụ a.
- source_word: γλώσσαις
  choice: asụsụ
  rationale: N’Igbo nke oge a, ‘asụsụ’ bụ okwu kachasị doo anya maka ikwu okwu n’ụdị asụsụ; ihe odide ahụ akọwaghị ma ọ bụ asụsụ mmadụ ndị a maara ama ka ọ bụ ụdị okwu pụrụ iche.
- source_word: λαλήσουσιν
  choice: ha ga-asụ
  rationale: Ngwaa ‘ịsụ’ na ‘asụsụ’ na-aga nke ọma n’Igbo ma na-enye echiche nkịtị nke ikwu okwu.
- source_word: καιναῖς
  choice: ọhụrụ
  rationale: Nke a na-edobe echiche kpọmkwem nke ihe ọhụrụ n’ụdị ma ọ bụ n’ịdị mma, n’akọwaghị ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Ihe ‘asụsụ ọhụrụ’ pụtara
  choice: E dere ‘asụsụ ọhụrụ’ n’ahịrịokwu bụ isi n’akọwaghị ma ha bụ asụsụ mmadụ ndị a maara ama ka ọ bụ okwu mmụọ pụrụ iche.
  alternative: ire ọhụrụ; ma ọ bụ ịkọwa ya kpọmkwem dị ka asụsụ mmadụ ma ọ bụ okwu ecstatic
  rationale: Okwu Grik γλώσσαις nwere ike ịpụta ire ma ọ bụ asụsụ, ma amaokwu a akọwaghị ụdị ihe ahụ kpọmkwem. Nsụgharị ahụ na-ahapụ esemokwu nkọwa ahụ ka ọ dị, ka ọ ghara ịkwado ozizi otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ga na-eso’ na-enye echiche nke iso na ịnọnyere; ‘n’aha m ka’ na-eme ka ikike Jizọs pụta ìhè n’enweghị mgbakwunye ozizi otu ụka.
