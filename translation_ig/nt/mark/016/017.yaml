  source_fidelity: 'The draft accurately renders the principal clauses: signs accompany believers, exorcism is done in Jesus’ name, and they will speak in new tongues/languages. However, “ga na-eso” can suggest ongoing repeated following rather than the simple future accompaniment of παρακολουθήσει; “ga-eso” is more direct. The marked footnote for παρακολουθήσει is also attached to “ndị kweere ekwe” rather than to the verb it explains.'
  naturalness: “Ndị kweere ekwe” is awkward and redundantly formed in Standard Igbo. “Ndị kweere” naturally expresses those who have believed in this generic context. “Ihe ịrịba ama ndị a ga-eso…” is clear, modern, and suitably formal.
  terminology: “Ihe ịrịba ama,” “n’aha m,” “mmụọ ọjọọ,” “ga-achụpụ,” and “asụsụ ọhụrụ” are suitable. “Asụsụ ọhụrụ” is idiomatic while the note appropriately retains the Greek lexical range without deciding the nature of the tongues.
