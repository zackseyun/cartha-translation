revisions:
- from: Ma gaanụ[a] gwa ndị na-eso ụzọ ya na Pita, sị, “Ọ na-eburu unu ụzọ aga Galili. N’ebe ahụ ka unu ga-ahụ ya[b], dị nnọọ ka ọ gwara unu.”
  to: Ma gaanụ[a] gwa ndị na-eso ụzọ ya na Pita, sị, “Ọ na-eburu unu ụzọ gaa Galili. N’ebe ahụ ka unu ga-ahụ ya[b], dị ka ọ gwara unu.”
  rationale: The revision repairs the Igbo motion construction by changing “aga Galili” to “gaa Galili,” while keeping the source’s sense that Jesus goes ahead of the disciples toward Galilee. It also uses the less overemphatic, natural comparison “dị ka ọ gwara unu.” Footnotes retain the source ambiguity and do not impose an interpretation of Peter’s separate mention.
