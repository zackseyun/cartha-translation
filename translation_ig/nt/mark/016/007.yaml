review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the contrast, the two plural imperatives, the separately named Peter, the future meeting, and the correspondence with Jesus’ prior words. However, “Ọ na-eburu unu ụzọ aga Galili” is not well formed idiomatic Standard Igbo: the motion complement should be “gaa Galili.”'
  naturalness: Most of the verse is clear and appropriately modern. “Ọ na-eburu unu ụzọ gaa Galili” is natural and directly conveys that he goes ahead of them toward Galilee. “Dị ka ọ gwara unu” is more natural and sufficiently precise than the more emphatic “dị nnọọ ka.”
  terminology: “ndị na-eso ụzọ ya,” “Pita,” and “Galili” are suitable standard biblical terms. The wording retains Peter’s distinct mention without adding “especially” or “including.”
  issues:
  - severity: medium
    issue: Malformed/awkward motion construction
    rationale: The main text reads “Ọ na-eburu unu ụzọ aga Galili.” In Standard Igbo, the purposive/motion form here should be “gaa Galili.” This correction preserves Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν naturally and accurately.
  - severity: low
    issue: Overemphasis in the final comparison
    rationale: “dị nnọọ ka” can be stronger than καθώς requires. “dị ka” naturally expresses “just as/as,” without adding emphasis.
  revised_text: Ma gaanụ[a] gwa ndị na-eso ụzọ ya na Pita, sị, “Ọ na-eburu unu ụzọ gaa Galili. N’ebe ahụ ka unu ga-ahụ ya[b], dị ka ọ gwara unu.”
