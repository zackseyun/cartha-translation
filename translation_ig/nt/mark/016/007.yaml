reference: Mark 16:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: ig
  text: Ma gaanụ[a] gwa ndị na-eso ụzọ ya na Pita, sị, “Ọ na-eburu unu ụzọ gaa Galili. N’ebe ahụ ka unu ga-ahụ ya[b], dị ka ọ gwara unu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A kpọrọ Pita aha iche n’ebe “ndị na-eso ụzọ ya” nọ. Nke a nwere ike ịrụtụ aka n’ịnabata ya ọzọ mgbe ọ gọnarịrị Jizọs, ma Grik ekwughị kpọmkwem “karịsịa Pita.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “unu ga-ahụ ya na Galili.” N’usoro Grik, okwu ahụ e ji egosi ebe a na-aga nwere ike ịpụta ịbanye n’ime Galili ma ọ bụ ịga Galili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Na-egosi ntụgharị siri ike site n’ihe e kwuru tupu ya gaa n’iwu a, n’ụzọ dị mkpirikpi ma bụrụkwa Igbo nkịtị.
- source_word: ὑπάγετε
  choice: gaanụ
  rationale: Iwu e nyere ọtụtụ mmadụ ka ha pụọ gaa; ụdị nkwanye ùgwù/ọtụtụ mmadụ “-nụ” na-echekwa ike iwu ahụ.
- source_word: εἴπατε
  choice: gwa
  rationale: Kwesịrị ekwesị mgbe e nwere ndị a na-agwa na ozi a ga-ezigara ha.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Okwu Igbo doro anya na nke a na-ejikarị akọwa ndị na-amụ ma na-eso onye nkuzi.
- source_word: καὶ τῷ Πέτρῳ
  choice: na Pita
  rationale: Na-edebe Pita iche dịka Grik si kwuo, n’etinyeghị “karịsịa” ma ọ bụ “gụnyere.”
- source_word: ὅτι
  choice: sị
  rationale: Na-ewebata ihe ha ga-ekwu kpọmkwem n’ụzọ Igbo sitere n’okike.
- source_word: Προάγει ὑμᾶς
  choice: Ọ na-eburu unu ụzọ
  rationale: Na-egosi na Jizọs na-aga n’ihu ha ma na-edu ụzọ, na-enweghị ịgbakwụnye nkọwa na-adịghị n’isi mmalite.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: aga Galili
  rationale: “Aga Galili” bụ Igbo ebumpụta ụwa maka ngagharị ruo ma ọ bụ banye n’ógbè ahụ; εἰς nwere ike ịpụta “gaa” ma ọ bụ “banye.”
- source_word: ἐκεῖ
  choice: N’ebe ahụ
  rationale: Na-ezo aka Galili n’ụzọ doro anya ma bụrụ Igbo nkịtị.
- source_word: αὐτὸν ὄψεσθε
  choice: unu ga-ahụ ya
  rationale: Na-enye ọdịnihu nke ịhụ ya n’ụzọ kwụ ọtọ.
- source_word: καθὼς εἶπεν ὑμῖν
  choice: dị nnọọ ka ọ gwara unu
  rationale: Na-echekwa echiche nke ihe ga-eme kwekọrọ n’ihe Jizọs kwuru na mbụ.
theological_decisions:
- issue: Ịkpọ Pita aha iche mgbe e kwuchara “ndị na-eso ụzọ ya”
  choice: ndị na-eso ụzọ ya na Pita
  alternative: ndị na-eso ụzọ ya, karịsịa Pita; ndị na-eso ụzọ ya, gụnyere Pita
  rationale: Grik kpọrọ Pita aha iche ma jikọta ya na ndị na-eso ụzọ ahụ. Nke a nwere ike inwe mkpa n’akụkọ banyere ịnabata ya ọzọ mgbe ọ gọnarịrị Jizọs, ma amaokwu ahụ ekwughị kpọmkwem “karịsịa” ma ọ bụ “gụnyere.” Ya mere, a hapụrụ esemokwu na nghọta ahụ ka ọ dị.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E jiri “gaanụ” na “unu” gosi na a na-agwa ọtụtụ mmadụ. A zere okwu ụka pụrụ iche na nkọwa nke ga-ekpebi ihe ịkpọ Pita iche pụtara.
