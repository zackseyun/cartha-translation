id: MRK.16.9
reference: Mark 16:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⟦Ἀναστὰς δὲ πρωῒ πρώτῃ σαββάτου ἐφάνη πρῶτον Μαρίᾳ τῇ Μαγδαληνῇ, ⸀παρ’ ἧς ἐκβεβλήκει ἑπτὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: ig
  text: Mgbe o bilitesịrị n’ọnwụ[a], n’isi ụtụtụ n’ụbọchị mbụ nke izu, o buru ụzọ pụta ìhè nye Meri Magdalin, onye o chụpụlarị mmụọ ọjọọ asaa n’ime ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu 9–20 adịghị n’ụfọdụ n’ime akwụkwọ aka ochie mbụ nke Mak; akwụkwọ aka ochie ndị ọzọ nwere ha, ma ụfọdụ dịgasị iche n’ụdị ha.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναστὰς
  choice: Mgbe o bilitesịrị n’ọnwụ
  rationale: Aorist participle ahụ na-egosi ihe mere tupu ngwaa bụ isi ἐφάνη. N’Igbo, “mgbe o bilitesịrị n’ọnwụ” na-eme ka usoro oge doo anya ma gosipụta na okwu a metụtara mbilite n’ọnwụ.
- source_word: δὲ
  choice: E gosighị ya iche n’Igbo
  rationale: δὲ bụ njikọ dị nro. N’ebe a, usoro ahịrịokwu Igbo na-enye njikọ ahụ n’enweghị itinye “ma” nke nwere ike ime ka o yie mmegide.
- source_word: πρωῒ
  choice: n’isi ụtụtụ
  rationale: Okwu ahụ pụtara n’oge ụtụtụ malitere ọhụrụ; “n’isi ụtụtụ” bụ okwu Igbo doro anya ma bụrụ nke e ji eme ihe ugbu a.
- source_word: πρώτῃ σαββάτου
  choice: n’ụbọchị mbụ nke izu
  rationale: Nke a bụ akpaalaokwu oge ndị Juu na ndị Kraịst n’asụsụ Grik Koine; nsụgharị a na-enye ihe ọ pụtara n’Igbo nke oge a.
- source_word: ἐφάνη
  choice: o ... pụta ìhè nye
  rationale: Ụdị ngwaa a n’akụkọ mbilite n’ọnwụ pụtara na ọ pụtara ka mmadụ hụ ya. “Pụta ìhè nye” na-egosi mpụta ahụ nke ọma, ọ bụghị naanị na a hụrụ ya na mberede.
- source_word: πρῶτον
  choice: buru ụzọ
  rationale: Ọ na-egosi usoro mpụta ya; “buru ụzọ” bụ ụzọ Igbo si ekwu na Meri bụ onye mbụ ọ pụtara nye.
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: Meri Magdalin
  rationale: A na-ede aha onye ahụ n’ụdị Igbo a na-amakarị, ebe “Magdalin” na-akọwa Meri sitere Magdala.
- source_word: παρ’ ἧς
  choice: onye o si n’ime ya
  rationale: Ya na ἐκβεβλήκει jikọtara, ọ na-egosi onye ndị mmụọ ọjọọ ahụ si n’ime ya pụọ; nke a bụ okwu Igbo sitere n’okike.
- source_word: ἐκβεβλήκει
  choice: chụpụ
  rationale: Pluperfect ahụ na-egosi ihe Jizọs merela tupu mpụta a. “Chụpụ” na-edobe ike ἐκβάλλω n’okwu ịchụ mmụọ ọjọọ.
- source_word: ἑπτὰ δαιμόνια
  choice: mmụọ ọjọọ asaa
  rationale: N’Igbo nkịtị, “mmụọ ọjọọ” bụ okwu doro anya maka δαιμόνια n’akụkọ ịchụ mmụọ; e debere ọnụọgụ asaa kpọmkwem.
theological_decisions:
- issue: Ọnọdụ ederede Mak 16:9 n’ime ngwụcha ogologo nke Mak
  choice: A sụgharịrị amaokwu ahụ dịka o si dị n’edemede Grik e nyere, ma tinye akara nkọwa [a] banyere esemokwu akaebe akwụkwọ ochie.
  alternative: Ụfọdụ akwụkwọ aka ochie kwụsịrị Mak na 16:8, ha enweghị 16:9–20; ndị ọzọ nwere amaokwu ndị ahụ, mgbe ụfọdụ n’ụdị dịgasị iche.
  rationale: SBLGNT e nyere tinyere amaokwu a n’akara nkuku nke na-egosi na ọnọdụ ederede ya na-arụ ụka. Ịsụgharị ya ma kọwaa ihe akaebe n’ala ala peeji na-edobe ma ederede e nyere ma esemokwu ahụ, na-enweghị idozi ya n’ezoghị ọnụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-edobe usoro oge nke Grik, ma zere itinye njikọ siri ike ebe δὲ bụ naanị njikọ dị nro.
