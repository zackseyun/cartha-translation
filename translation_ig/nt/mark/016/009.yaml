review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the temporal participle, early-morning setting, first day of the week, the first appearance to Mary Magdalene, and the seven demons. However, the unmarked infinitive-like form “chụpụ” does not adequately express the Greek pluperfect ἐκβεβλήκει, which identifies an expulsion completed before this appearance.
  naturalness: The sentence is clear and suitably formal in Standard Igbo. Recasting the final relative clause with the completive/prior form “chụpụlarị” makes the sequence explicit and is natural in this context.
  terminology: “bilitesịrị n’ọnwụ,” “pụrụ ìhè nye,” “Meri Magdalin,” and “mmụọ ọjọọ” are appropriate Standard Igbo renderings in this register. The textual-variant note is retained and slightly clarified without making claims beyond the English audit trail.
  issues:
  - severity: medium
    issue: The prior expulsion is not explicitly marked as completed before the appearance.
    rationale: ἐκβεβλήκει is pluperfect (“had cast out”). In the draft, “onye o si n’ime ya chụpụ mmụọ ọjọọ asaa” lacks a clear completed-prior marker. “chụpụlarị” preserves the relative temporal force without adding interpretation.
  - severity: low
    issue: Footnote wording can more naturally identify the manuscript evidence.
    rationale: “ụfọdụ n’ime akwụkwọ aka ochie mbụ” clearly means some of the early manuscripts, while retaining the appropriately non-specific statement that other manuscripts contain the verses with variation.
  revised_text: Mgbe o bilitesịrị n’ọnwụ[a], n’isi ụtụtụ n’ụbọchị mbụ nke izu, o buru ụzọ pụta ìhè nye Meri Magdalin, onye o chụpụlarị mmụọ ọjọọ asaa n’ime ya.
  revised_footnotes:
  - marker: a
    text: Amaokwu 9–20 adịghị n’ụfọdụ n’ime akwụkwọ aka ochie mbụ nke Mak; akwụkwọ aka ochie ndị ọzọ nwere ha, ma ụfọdụ dịgasị iche n’ụdị ha.
    reason: textual_variant
  revision_rationale: The revision preserves the supplied Greek text and its textual-critical qualification. It changes only the final clause to mark the pluperfect action as already completed before the appearance and lightly improves the naturalness of the footnote.
