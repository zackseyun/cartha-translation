id: MRK.16.19
reference: Mark 16:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ μὲν οὖν κύριος ⸀Ἰησοῦς μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/019.yaml
  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: ig
  text: Ya mere, mgbe Onyenwe anyị Jizọs gwachara ha okwu, e buliri ya gaa n’eluigwe, o wee nọdụ ala n’aka nri Chineke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὲν οὖν
  choice: Ya mere
  rationale: Ngwakọta urughuru okwu a na-egosi ntụgharị na mmechi; “Ya mere” na-ebute echiche ahụ n’Igbo dị mfe ma kwụ ọtọ.
- source_word: κύριος Ἰησοῦς
  choice: Onyenwe anyị Jizọs
  rationale: “Onyenwe anyị” bụ aha nsọpụrụ Igbo a na-ejikarị atụgharị κύριος mgbe ọ bụ aha Kraịst; “Jizọs” bụ ụdị aha ahụ a nabatara n’Igbo.
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: mgbe ... gwachara ha okwu
  rationale: Usoro “mgbe ... -chara” na-egosipụta nke ọma na ikwu okwu ahụ buru ụzọ mee ma gwụ tupu ihe ọzọ emee; “ha” na-anọchi αὐτοῖς.
- source_word: ἀνελήμφθη
  choice: e buliri ya
  rationale: Nke a na-edobe olu nnara nke ngwaa Grik ahụ ma ghara ịkọ onye mere omume ahụ, ebe ahịrịokwu ahụ ekwughị ya kpọmkwem.
- source_word: εἰς τὸν οὐρανόν
  choice: gaa n’eluigwe
  rationale: “Gaa n’eluigwe” bụ ụzọ Igbo si egosipụta ebe ngagharị ahụ jedebere, dị ka εἰς si gosi.
- source_word: ἐκάθισεν
  choice: o wee nọdụ
  rationale: “Nọdụ” na-egosipụta omume ịnara ọnọdụ oche; “wee” na-ejikọta ya n’usoro ihe ndị mere n’ụzọ Igbo ebumpụta ụwa.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: n’aka nri Chineke
  rationale: Nke a bụ akpaalaokwu Igbo kwekọrọ na akpaalaokwu Grik nke pụtara ịnọ n’ọnọdụ dị n’aka nri Chineke, ọ bụghị isi n’ebe ahụ pụta.
theological_decisions:
- issue: Igosipụta mbuli Jizọs na ọnọdụ ya dị elu n’etinyeghị nkọwa ozizi ọzọ
  choice: e buliri ya gaa n’eluigwe, o wee nọdụ n’aka nri Chineke
  alternative: a nabatara ya n’eluigwe, o wee were ọnọdụ ya n’aka nri Chineke
  rationale: Nhọrọ a na-edobe olu nnara nke ἀνελήμφθη na akpaalaokwu “n’aka nri Chineke,” ma ọ naghị agbakwụnye onye buliri ya ma ọ bụ kọwaa ụdị ọchịchị ọnọdụ ahụ pụtara.
- issue: Ịsụgharị κύριος dịka aha Kraịst
  choice: Onyenwe anyị Jizọs
  alternative: Nna Ukwu Jizọs
  rationale: “Onyenwe anyị” na-echekwa ịdị arọ nke aha κύριος n’Oziọma ma ghara ime ka ọ bụrụ naanị aha onyeisi mmadụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji usoro “mgbe ... gwachara” mee ka usoro oge doo anya, ma debe olu nnara na akpaalaokwu Baịbụl “n’aka nri Chineke.”
