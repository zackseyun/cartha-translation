  text: κἀκεῖνοι ἀπελθόντες ἀπήγγειλαν τοῖς λοιποῖς· οὐδὲ ἐκείνοις ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: ig
  text: Ha wee pụọ gaa kọọrọ ndị fọdụrụ[a], ma ndị fọdụrụ ekweghịkwa ihe ha kwuru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: Ha wee
  rationale: Ngwakọta κἀκεῖνοι pụtara ‘ndị ahụ kwa/ha wee’; ‘Ha wee’ na-aga nke ọma n’Igbo ma na-ejikọta amaokwu a na akụkọ bu ya ụzọ, na-enweghị ịtinye ‘ndị ikom’ nke Grik ekwughị kpọmkwem.
- source_word: ἀπελθόντες
  choice: pụọ gaa
  rationale: Aorist participle a na-egosi na ha buru ụzọ si ebe ahụ pụọ tupu ha akọọrọ ndị ọzọ; ‘pụọ gaa’ na-egosipụta usoro ahụ n’Igbo nkịtị.
- source_word: ἀπήγγειλαν
  choice: kọọrọ
  rationale: ἀπαγγέλλω bụ ịkọ ma ọ bụ izi akụkọ; ‘kọọrọ’ dabara n’ọnọdụ nke izigara ndị ọzọ ihe mere, ebe ihe a kọọrọ doro anya site n’amaokwu ndị gbara ya gburugburu.
- source_word: τοῖς λοιποῖς
  choice: ndị fọdụrụ
  rationale: λοιπός na-ezo aka ná ndị ọzọ fọdụrụ n’òtù ahụ; ‘ndị fọdụrụ’ na-edobe echiche isi okwu ahụ kpọmkwem.
- source_word: οὐδὲ
  choice: ma ... kwa
  rationale: οὐδέ na-agbakwunye na ekweghị ekwe e kwuru na mbụ ma nwee ike ịpụta ‘ha ekweghịkwa’; ‘ma ... kwa’ na-egosipụta ma ntụgharị akụkọ ahụ ma echiche ‘either/also not.’
- source_word: ἐκείνοις
  choice: ihe ha kwuru
  rationale: N’usoro Igbo, ‘ikweta ihe mmadụ kwuru’ na-ada eke karịa ‘ikweta mmadụ’ mgbe okwu bụ ịnabata akaebe. A kọwapụtara ihe dị n’ụdị dative Grik site n’okwu gbara ya gburugburu, na-enweghị ịgbanwe onye akaebe ahụ.
- source_word: ἐπίστευσαν
  choice: ekweghị
  rationale: N’ebe a πιστεύω pụtara ịnabata akụkọ ma ọ bụ akaebe dịka eziokwu; ‘ekweghị’ bụ okwu Igbo doro anya maka echiche ahụ.
theological_decisions:
- issue: Ntụgharị πιστεύω n’ọnọdụ akụkọ gbasara akaebe
  choice: ekweghị ihe ha kwuru
  alternative: atụkwasịghị ha obi
  rationale: Amaokwu a na-ekwu banyere ịjụ akụkọ mmadụ kọọrọ ha, ọ bụghị echiche sara mbara banyere okwukwe nzọpụta ma ọ bụ ntụkwasị obi n’ebe mmadụ nọ. Ya mere, ‘ekweghị ihe ha kwuru’ na-edobe echiche akụkọ ahụ n’enweghị ibu ozizi agbakwunyere.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ùgwù. E ji ‘Ha wee’ mee ka akụkọ na-aga n’ihu n’ụzọ eke; e debere ihe ọzọ λοιποί nwere ike ịpụta n’ala ala peeji.
