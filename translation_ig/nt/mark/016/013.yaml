- from: Ha wee pụọ gaa kọọrọ ndị fọdụrụ[a], ma ndị ahụ ekweghịkwa ihe ha kwuru.
  to: Ha wee pụọ gaa kọọrọ ndị fọdụrụ[a], ma ndị fọdụrụ ekweghịkwa ihe ha kwuru.
  rationale: 'The revision changes only the final-clause subject from the ambiguous “ndị ahụ” to “ndị fọdụrụ.” This explicitly preserves the Greek participant roles: the two report, while the rest do not believe what the two said.'
