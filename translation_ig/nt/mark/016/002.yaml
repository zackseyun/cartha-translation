  source_fidelity: 'The verse rendering correctly conveys the emphatic early time, the first day of the week, Mark’s historical present, the movement to the tomb, and the temporal genitive absolute. The wording for the first day is made more idiomatic in Standard Igbo. The original-language explanation in footnote a requires correction: τῇ μιᾷ τῶν σαββάτων is literally “on the first [day] of the Sabbaths/weeks,” not “on the first day of the days of rest.”'
  naturalness: “N’isi ụtụtụ nke ukwuu” and “n’ụbọchị mbụ nke izu” are natural, clear Standard Igbo. With the motion verb “na-abịa,” “n’ili ahụ” naturally identifies the destination in this context.
  terminology: “Ili” is an appropriate modern Igbo term for μνημεῖον in this burial context. “Anyanwụ wara” naturally expresses the sun’s rising without forcing a stronger sequence such as “after.”
