translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ esemokwu pụtara ìhè dị n’etiti “n’isi ụtụtụ nnọọ” na “mgbe anyanwụ wara,” n’ihi na ha abụọ dị n’ihe odide Grik. E dokwara historical present nke Mak anya site n’iji “ha na-abịa,” ma kọwaa ya n’ala ala peeji.
