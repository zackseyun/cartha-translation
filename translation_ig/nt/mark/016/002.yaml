  yaml_path: translation/nt/mark/016/002.yaml
  text: And very early on the first day of the week[c][b][a], they come to the tomb when the sun had risen.
translation:
  language: ig
  text: N’isi ụtụtụ nke ukwuu, n’ụbọchị mbụ nke izu[a], ha na-abịa[b] n’ili ahụ mgbe anyanwụ wara[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, kpọmkwem, ọ bụ “n’ụbọchị mbụ nke ụbọchị izu ike ndị ahụ”; nke a bụ akpaalaokwu pụtara “n’ụbọchị mbụ nke izu.”
    reason: lexical_alternative
  - marker: b
    text: Mak ji ngwaa dị ugbu a, “ha na-abịa,” kọọ ihe mere n’oge gara aga iji mee ka akụkọ ahụ dị ndụ. A pụkwara ịsụgharị ya, “ha bịara.”
    reason: lexical_alternative
  - marker: c
    text: Nkebi okwu Grik a na-egosi oge ha rutere; a pụkwara ịsụgharị ya, “mgbe anyanwụ awarala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λίαν πρωῒ
  choice: N’isi ụtụtụ nnọọ
  rationale: “Nnọọ” na-eme ka “n’isi ụtụtụ” sie ike, dịka λίαν si eme ka πρωῒ sie ike, ma okwu ahụ ka na-ada nke ọma n’Igbo ugbu a.
- source_word: τῇ μιᾷ τῶν σαββάτων
  choice: n’ụbọchị mbụ n’izu
  rationale: Nke a na-enye ihe akpaalaokwu Grik ahụ pụtara n'ụzọ doro anya, kama ịsụgharị ya mkpụrụokwu n’otu n’otu dị ka “n’ụbọchị mbụ nke ụbọchị izu ike.”
- source_word: ἔρχονται
  choice: ha na-abịa
  rationale: E ji ụdị ngwaa dị ugbu a mee ka akụkọ ahụ dị ndụ, dịka Mak si jiri historical present na Grik. Ọ bụ ezie na “ha bịara” ga-adịkarị mfe n’akụkọ Igbo, ọ ga-ewepụ ụdị oge ngwaa nke isi mmalite ahụ.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: n’ili ahụ
  rationale: N’ebe a μνημεῖον bụ ili e tinyere ozu n’ime ya; “ili ahụ” bụ okwu Igbo dị mfe ma kwekọọ n’ọnọdụ ahụ. Ngwaa “na-abịa” na-eme ka mmegharị ruo ebe ahụ doo anya.
- source_word: ἀνατείλαντος τοῦ ἡλίου
  choice: mgbe anyanwụ wara
  rationale: Nkebi genitive absolute a na-egosi oge ihe ahụ mere. “Mgbe anyanwụ wara” na-edobe mmekọrịta oge ahụ n’enweghị ịgbakwụnye echiche siri ike nke “mgbe e mesịrị.”
