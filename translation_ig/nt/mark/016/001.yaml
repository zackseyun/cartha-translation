  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ διαγενομένου τοῦ σαββάτου ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ τοῦ⸃ Ἰακώβου καὶ Σαλώμη ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: ig
  text: Mgbe ụbọchị izuike gafere, Meri Magdalin, Meri, nne Jemis[a], na Salomi zụtara ihe ndị na-esi ísì ụtọ ka ha gaa tee ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'asụsụ Grik, ọ bụ kpọmkwem, “Meri nke Jemis”; ya bụ, e ji mmekọrịta ya na Jemis mata ya. Dị ka nghọta a na-enwekarị si dị, ọ bụ nne Jemis.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: Mgbe ụbọchị izuike gafere
  rationale: Nkebi okwu a na-egosi na ụbọchị izuike agwụla tupu ụmụanyị ahụ azụta ihe ndị ahụ; ntụgharị a bụ Igbo doro anya ma na-edobe usoro oge ahụ.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Meri Magdalin
  rationale: Nke a bụ ụdị aha a na-amata nke ọma n'Igbo maka Meri onye Magdalin.
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: Meri nne Jemis[a]
  rationale: Asụsụ Grik kwuru n'ụzọ mkpirikpi ‘Meri nke Jemis,’ na-akọwa Meri site ná mmekọrịta ya na Jemis. ‘Nne Jemis’ na-eme ka okwu ahụ doo anya n'Igbo, ebe nkọwa ala peeji na-echekwa ihe okwu Grik kwuru kpọmkwem na obere mgbagwoju anya ya.
- source_word: Σαλώμη
  choice: Salomi
  rationale: Nke a bụ nsụgharị mkpụrụokwu aha ahụ n'ụdị dabara n'usoro ụda Igbo.
- source_word: ἠγόρασαν
  choice: zụtara
  rationale: Okwu a na-akọ otu ihe mere n'akụkọ ahụ; ‘zụtara’ bụ okwu Igbo dị mfe ma kpọmkwem.
- source_word: ἀρώματα
  choice: ihe ndị na-esi ísì ụtọ
  rationale: Ọ na-ezo aka n'ihe na-esi ísì ọma e ji elekọta ozu. Nhọrọ a sara mbara nke ọma iji ghara ịkpọchi ya naanị na uda ma ọ bụ mmanụ otite.
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: ka ha gaa tee ya ha
  rationale: ‘Ka’ na-egosi ebumnuche, ‘gaa’ na-edobe mmegharị ha, ‘tee ya ha’ na-ezo aka n'itinye ihe ndị na-esi ísì ụtọ ahụ n'ahụ ya n'emume olili.
- source_word: ἀλείψωσιν
  choice: tee ya
  rationale: Ngwaa a pụtara ite ma ọ bụ ịsa ihe n'ahụ mmadụ; ‘tee ya’ na-ebute ihe omume ahụ kpọmkwem n'Igbo na-enweghị ịgbasa ya ka ọ bụrụ nanị ‘ịkwadebe ozu.’
theological_decisions:
- issue: Mmekọrịta Meri na Jemis n'okwu Grik dị mkpirikpi Μαρία ἡ τοῦ Ἰακώβου
  choice: Meri nne Jemis
  alternative: Meri nke Jemis
  rationale: Okwu Grik akpọghị ‘nne’ aha n'ụzọ pụtara ìhè, ma omenala okwu ndị ọzọ n'Oziọma na nghọta a na-ahụkarị na-akwado ya. E tinyere nkọwa ala peeji ka a ghara izochi na Grik hapụrụ mmekọrịta ahụ n'okwu dị mkpirikpi.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị mfe ma dị nsọ dee ya. A họọrọ ‘ụbọchị izuike’ kama ịdabere nanị n'aha e si n'asụsụ ọzọ nweta. A hapụrụ okwu gbasara olili n'ụdị doro anya, ma zere itinye nkọwa okpukpe karịrị ihe isi mmalite Grik kwuru.
