    rationale: “Tee ya ha” has both singular object “ya” and an additional plural pronoun “ha.” The Greek has one singular object, αὐτόν (“him”); Standard Igbo should read “tee ya.”
  - severity: low
    issue: Missing punctuation around the appositional relationship
    rationale: A comma in “Meri, nne Jemis” makes the identification clearer and more natural without adding meaning.
