revisions:
- from: Mgbe ha leliri anya elu, ha hụrụ[a] na a kpọgharịala nkume ahụ pụọ, n’ihi na ọ buru nnọọ ibu.
  to: Ha leliri anya, hụ na a kpọgharịala nkume ahụ pụọ, n’ihi na ọ dị nnọọ nnukwu.
  rationale: The revision avoids over-specifying the participle’s temporal relation, improves idiomatic Standard Igbo for “extremely large,” and retains the perfect passive’s completed action and resulting state.
