  text: καὶ ἀναβλέψασαι θεωροῦσιν ὅτι ⸀ἀποκεκύλισται ὁ λίθος, ἦν γὰρ μέγας σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/004.yaml
  text: And looking up[a], they saw that the stone had been rolled away, for it was extremely large.
translation:
  language: ig
  text: Ha leliri anya, hụ na a kpọgharịala nkume ahụ pụọ, n’ihi na ọ dị nnọọ nnukwu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψασαι
  choice: Mgbe ha leliri anya elu
  rationale: Nkebiokwu a na-egosi na ụmụ nwanyị ahụ weliri anya ha lee ebe ili ahụ dị; usoro ‘mgbe...’ na-eme ka participle a bụrụ Igbo doro anya ma dịkwa eke.
- source_word: θεωροῦσιν
  choice: ha hụrụ
  rationale: N’akụkọ a, ọ pụtara ihe ha ji anya hụ ma ghọta. ‘Ha hụrụ’ bụ okwu Igbo dị mfe ma kwekọọ n’ike okwu ahụ.
- source_word: ὅτι
  choice: na
  rationale: ‘Na’ na-ewebata ihe ha hụrụ, dịka ὅτι si eme n’asụsụ Grik.
- source_word: ἀποκεκύλισται
  choice: a kpọgharịala ... pụọ
  rationale: Ụdị perfect passive na-egosi na e mechaala ịkpọgharị nkume ahụ, ọ nọkwa n’ọnọdụ e wepụrụ ya mgbe ha hụrụ ya. ‘-ala’ na ‘pụọ’ na-egosipụta ma omume e mezuru ma ọnọdụ si na ya pụta.
- source_word: ὁ λίθος
  choice: nkume ahụ
  rationale: Nke a bụ nkume e ji mechie ili; ‘nkume ahụ’ zuru ezu n’ebe akụkọ a nọ n’etinyeghị nkọwa na-adịghị n’ederede Grik.
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: n’ihi na ọ buru nnọọ ibu
  rationale: ‘N’ihi na’ na-egosipụta nkọwa γάρ, ebe ‘nnọọ ibu’ na-echekwa ike nke σφόδρα n’Igbo dị ugbu a.
- source_word: καὶ
  choice: Mgbe
  rationale: Kama ịmalite n’ụzọ siri ike site na ‘Na,’ a jikọtara njikọ akụkọ καὶ na participle so ya ka e nweta ‘Mgbe...,’ nke na-aga nke ọma n’Igbo ma na-echekwa usoro ihe mere.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘leliri anya elu’ maka mmegharị anya ahụ, ‘a kpọgharịala ... pụọ’ iji chekwaa ọnọdụ nke perfect passive, na ‘nnọọ ibu’ iji gosipụta nkwusi ike nke σφόδρα.
