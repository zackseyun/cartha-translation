review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the women looking up, seeing the stone in an already-rolled-away state, and the explanatory statement that it was very large. However, the temporal subordinating force of “Mgbe” is stronger than the Greek participle requires, and “ọ buru nnọọ ibu” is not natural Standard Igbo for the stone’s size.
  naturalness: 'Use two coordinated finite clauses for the participial opening: “Ha leliri anya, hụ...” This is natural narrative Igbo and does not unnecessarily specify a temporal relationship. “Ọ dị nnọọ nnukwu” is idiomatic Standard Igbo.'
  terminology: “A kpọgharịala nkume ahụ pụọ” suitably represents the perfect passive and the stone’s removal/rolling away in this tomb context. The footnote correctly explains the resultant state and is retained with minor stylistic improvement.
  issues:
  - severity: medium
    issue: “Mgbe ha leliri anya elu” imposes a temporal ‘when’ relationship.
    rationale: ἀναβλέψασαι is an aorist participle, naturally rendered as a coordinated preceding/concomitant action in Igbo; the Greek does not specifically require a temporal clause.
  - severity: medium
    issue: “ọ buru nnọọ ibu” is unnatural phrasing in Standard Igbo.
    rationale: For an object’s physical size, “ọ dị nnọọ nnukwu” is the ordinary modern expression and communicates μέγας σφόδρα clearly.
  revised_text: Ha leliri anya, hụ na a kpọgharịala nkume ahụ pụọ, n’ihi na ọ dị nnọọ nnukwu.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ha chọpụtara na a kpọgharịala nkume ahụ pụọ.” Ngwaa Grik e ji kwuo “a kpọgharịala” na-emesi ike na, mgbe ha hụrụ nkume ahụ, a kpọgharịworị ya, ọ ka nọkwa n’ọnọdụ ahụ.
    reason: lexical_alternative
  revision_rationale: The revision avoids over-specifying the participle’s temporal relation, improves idiomatic Standard Igbo for “extremely large,” and retains the perfect passive’s completed action and resulting state.
