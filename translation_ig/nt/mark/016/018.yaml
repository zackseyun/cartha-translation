id: MRK.16.18
reference: Mark 16:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ὄφεις ἀροῦσιν κἂν θανάσιμόν τι πίωσιν οὐ μὴ αὐτοὺς βλάψῃ, ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν καὶ καλῶς ἕξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: ig
  text: Ha ga-ebuli agwọ; ọ bụrụkwa na ha aṅụọ ihe ọ bụla pụrụ ịkpata ọnwụ, ọ gaghị emerụ ha ma ọlị. Ha ga-ebikwasị ndị ọrịa aka, ndị ọrịa ahụ ga-adịkwa mma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide Grik ochie enweghị Mak 16:9–20; amaokwu a so na ngwụcha dị ogologo nke Oziọma Mak.
    reason: textual_variant
lexical_decisions:
- source_word: ὄφεις
  choice: agwọ
  rationale: “Agwọ” bụ okwu Igbo a na-ejikarị ekwu snake ma ọ bụ serpent; ọ dabara n'okwu a n'enweghị itinye nkọwa ọzọ na-adịghị na Grik.
- source_word: ἀροῦσιν
  choice: ga-ekulite
  rationale: αἴρω pụtara ibuli ma ọ bụ iwelite ihe; “ga-ekulite” na-egosipụta omume ahụ nke ọma ma ghara ịkọwa ihe mere ha ji eme ya.
- source_word: κἂν ... πίωσιν
  choice: ọ bụrụkwa na ha aṅụọ
  rationale: Nke a na-edobe njikọ καὶ na ọnọdụ nke ἐάν tinyere aorist subjunctive n'Igbo dị ugbu a ma doo anya.
- source_word: θανάσιμόν τι
  choice: ihe ọ bụla pụrụ ịkpata ọnwụ
  rationale: Nhọrọ a na-edobe obosara okwu Grik ahụ—ihe nwere ike ịkpata ọnwụ—ma ghara ime ka ọ bụrụ naanị nsi.
- source_word: οὐ μὴ ... βλάψῃ
  choice: ọ gaghị emerụ ha ma ọlị
  rationale: “Ma ọlị” na-ebute ike nkwusi okwu dị n'οὐ μή, ebe “emerụ” na-ekpuchi mmebi ma ọ bụ mmerụ ahụ n'ozuzu.
- source_word: ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν
  choice: Ha ga-ebikwasị ndị ọrịa aka
  rationale: Nke a bụ ụzọ Igbo doro anya ma kwekọọ n'usoro Grik e si ekwu ịtụkwasị ndị na-arịa ọrịa aka.
- source_word: καλῶς ἕξουσιν
  choice: ahụ ga-adịkwa ha mma
  rationale: Nkebi okwu a pụtara n'ụzọ nkịtị na ha ga-adị mma; okwu Igbo a bụ nke e ji ekwu mgbake n'ụzọ ebumpụta ụwa, ma ọ naghị eme ka okwu ahụ sie ike karịa Grik.
theological_decisions:
- issue: Ụdị nchebe na ọgwụgwọ e kwere ná nkwa
  choice: A sụgharịrị omume na nsonaazụ ndị ahụ dịka ihe amaokwu ahụ kwuru, n'etinyeghị nkọwa ma ha bụ maka ndị kwere ekwe niile, maka otu oge pụrụ iche, ma ọ bụ ihe atụ.
  alternative: Ịkọwa ha dịka iwu ma ọ bụ nkwa zuru ụwa ọnụ nye onye kwere ekwe ọ bụla, ma ọ bụ dịka ihe metụtara naanị oge ndịozi, ma ọ bụ dịka ihe atụ nkịtị.
  rationale: Grik na-ekwu ha dịka omume na nsonaazụ ga-eme, ma ọ naghị edozi esemokwu ndị a; ya mere nsụgharị ahụ echekwala esemokwu nkà mmụta okpukpe ahụ.
- issue: Ọnọdụ Mark 16:9–20 n'ihe odide ochie
  choice: A sụgharịrị amaokwu ahụ dịka e nyere ya, ma tinyekwa nkọwa ala peeji banyere ihe dị iche n'ihe odide.
  alternative: Ịhapụ amaokwu ahụ kpamkpam ma ọ bụ itinye ya naanị n'ime akara nkewa.
  rationale: Amaokwu ahụ dị na isi mmalite e nyere, ma eziokwu na ụfọdụ ihe odide ochie enweghị ngwụcha ogologo Mak kwesịrị ka a gwa onye na-agụ ya n'ụzọ doro anya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta, mee ihe. “Ihe ọ bụla pụrụ ịkpata ọnwụ” na-echekwa obosara θανάσιμόν τι, ebe “ahụ ga-adịkwa ha mma” na-anọ nso na καλῶς ἕξουσιν ma bụrụkwa okwu Igbo ebumpụta ụwa.
