  source_fidelity: 'Ederede ahụ na-esochi Grik nke ọma n''ozuzu ya: ὕστερον, ndị iri na otu, ọnọdụ iri nri n''adabere, ịbara mba, ekweghị-ekwe, na obi kpọrọ nkụ ka edobere. Otú ọ dị, “mgbe a kpọlitere ya n’ọnwụ” nwere ike ịpụta oge a kpọlitere ya, ebe participle perfect ἐγηγερμένον na-ekwu maka ịhụ ya mgbe e mechara kpọlite ya. Iji “ka e mechara kpọlite ya n’ọnwụ” na-eme ka njikọ oge ahụ doo anya ma na-edobe passive Grik.'
