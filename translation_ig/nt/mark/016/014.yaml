id: MRK.16.14
reference: Mark 16:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: ig
  text: Mgbe e mesịrị[a], ọ pụtara n’ihu ndị iri na otu ahụ ka ha dinara n’akụkụ tebụl na-eri nri[b]. Ọ baara ha mba n’ihi ekweghị-ekwe ha na obi ha kpọrọ nkụ, n’ihi na ha ekweghị ndị hụrụ ya ka e mechara kpọlite ya n’ọnwụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Mgbe nke ahụ gasịrị.”
    reason: lexical_alternative
  - marker: b
    text: N’oge ahụ, ndị mmadụ na-adabere ma ọ bụ na-edina n’akụkụ tebụl mgbe ha na-eri nri.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsị, “ndị hụrụ ya ka o bilitechara n’ọnwụ.” N’ụzọ nkịtị, Grik sịrị, “ndị hụrụ ya dịka onye a kpọlitere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕστερον
  choice: Mgbe e mesịrị
  rationale: Ọ na-egosi na ihe a mere mgbe ihe ndị a kọọrọla gasịrị; okwu a bụ Igbo nkịtị ma na-edobe usoro oge ahụ.
- source_word: ἀνακειμένοις
  choice: ka ha dinara n’akụkụ tebụl na-eri nri
  rationale: Nke a na-egosi otú ndị oge ahụ si adabere ma ọ bụ dina n’akụkụ tebụl mgbe ha na-eri nri, kama ịgbanwe ya ka ọ bụrụ nanị ịnọdụ ala.
- source_word: τοῖς ἕνδεκα
  choice: ndị iri na otu ahụ
  rationale: A hapụrụ aha otu ahụ dịka Grik si kwuo ya, n’etinyeghị nkọwa ‘ndị ozi’ nke na-adịghị n’amaokwu ahụ kpọmkwem.
- source_word: ἐφανερώθη
  choice: ọ pụtara n’ihu
  rationale: N’akụkọ banyere mbilite n’ọnwụ, nke a bụ ụzọ Igbo doro anya si kwuo na o mere ka ha hụ ya.
- source_word: ὠνείδισεν
  choice: Ọ baara ha mba
  rationale: Ọ na-egosipụta ịkatọ ha n’ụzọ siri ike ma bụrụkwa okwu ndị Igbo nke oge a na-aghọta ngwa ngwa.
- source_word: ἀπιστίαν
  choice: ekweghị ekwe ha
  rationale: Ọ na-egosi na ha ekweghị akaebe e nyere ha, ọ bụghị nanị na okwukwe ha pere mpe.
- source_word: σκληροκαρδίαν
  choice: obi ha kpọrọ nkụ
  rationale: A na-edobe ihe atụ nke obi siri ike ma ọ bụ jụrụ ịnabata eziokwu, kama ime ka ọ bụrụ naanị isi ike.
- source_word: θεασαμένοις
  choice: ndị hụrụ ya
  rationale: Ọ na-akọwa ndị ji anya ha hụ Jizọs, n’ụzọ dị mfe ma doro anya.
- source_word: ἐγηγερμένον
  choice: mgbe a kpọlitere ya n’ọnwụ
  rationale: Ntụgharị a na-edobe ọdịdị passive nke okwu Grik ma na-egosipụta mbilite n’ọnwụ nke ọma n’Igbo.
- source_word: οὐκ ἐπίστευσαν
  choice: ha ekweghị
  rationale: Ọ na-egosi na tupu ọ pụta n’ihu ha, ha ajụla ikwere ihe ndị ji anya ha hụ kwuru.
theological_decisions:
- issue: Ụdị okwu mbilite n’ọnwụ na ἐγηγερμένον
  choice: mgbe a kpọlitere ya n’ọnwụ
  alternative: mgbe o si n’ọnwụ bilie
  rationale: A họọrọ passive iji debe usoro okwu Grik n’enweghị ịkpọ aha onye mere ka o bilie ma ọ bụ ịgbanwe ya ka ọ bụrụ active.
- issue: Ihe σκληροκαρδία pụtara
  choice: obi ha kpọrọ nkụ
  alternative: isi ike ha
  rationale: Nke a na-edobe ihe atụ Akwụkwọ Nsọ banyere obi nke na-ajụ ịnabata eziokwu; ‘isi ike’ naanị ya ga-eme ka ihe atụ ahụ na ụda ime mmụọ ya laa n’iyi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. A hapụrụ ‘ndị iri na otu ahụ’ dịka aha otu ahụ si dị n’isi mmalite, ma debe ihe atụ ‘obi ha kpọrọ nkụ’ na ụdị passive nke mbilite n’ọnwụ.
