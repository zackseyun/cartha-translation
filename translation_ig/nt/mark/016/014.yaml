  to: Mgbe e mesịrị[a], ọ pụtara n’ihu ndị iri na otu ahụ ka ha dinara n’akụkụ tebụl na-eri nri[b]. Ọ baara ha mba n’ihi ekweghị-ekwe ha na obi ha kpọrọ nkụ, n’ihi na ha ekweghị ndị hụrụ ya ka e mechara kpọlite ya n’ọnwụ[c].
