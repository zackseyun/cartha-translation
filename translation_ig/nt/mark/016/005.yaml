review_pass:
  verdict: revise
  source_fidelity: The temporal rendering “Mgbe ha banyere” appropriately conveys the aorist participle in natural Igbo. “otu nwa okorobịa” retains Mark’s descriptive νεανίσκος without asserting an angelic identity. “n’akụkụ aka nri” more precisely expresses the locative sense of ἐν τοῖς δεξιοῖς. The revision of the garment avoids a potentially misleading garment term while conveying στολὴ as a long robe. “Ụjọ wee jide ha” suitably represents their strong alarmed reaction.
  naturalness: The revised wording is idiomatic Standard Igbo and reads smoothly as narrative prose. “N’akụkụ aka nri” is clearer than “n’aka nri” for a position within the tomb.
  terminology: “Ili” is appropriate for μνημεῖον in this context. “Uwe ogologo ọcha” is a safer, gender-neutral rendering of the distinctive long white garment than “uwe mwụda,” which can suggest a skirt or dress. The footnote preserves the main-text restraint about the young man’s identity and labels “mmụọ ozi” as an interpretive identification rather than a direct lexical alternative.
  issues:
  - severity: medium
    issue: “uwe mwụda ọcha” for στολὴ λευκή
    rationale: “Uwe mwụda” can commonly evoke a skirt or dress and may introduce an unnecessarily gendered or otherwise inaccurate image. The Greek denotes a long, robe-like garment; “uwe ogologo ọcha” conveys this safely.
  - severity: low
    issue: “n’aka nri” can be read as ‘in the right hand’
    rationale: Although understandable from context, “n’akụkụ aka nri” clearly denotes the right side/location intended by the Greek.
  - severity: low
    issue: Footnote presents “mmụọ ozi” as though it were a direct alternative rendering
    rationale: Mark’s word is νεανίσκος, ‘young man.’ Angelic identity is a contextual interpretation, so the note should distinguish it from a lexical alternative.
  revised_text: Mgbe ha banyere n’ime ili ahụ, ha hụrụ otu nwa okorobịa[a] ka ọ nọ ọdụ n’akụkụ aka nri, yi uwe ogologo ọcha; ụjọ wee jide ha.
  revised_footnotes:
  - marker: a
    text: A pụrụ ịghọta ya dịka “mmụọ ozi.” N’ebe a, Mak kpọrọ ya “nwa okorobịa,” ọ bụ ezie na ọnọdụ akụkọ ahụ na akụkọ ndị yiri ya na-egosi na ọ bụ mmụọ ozi.
    reason: alternative_reading
  revision_rationale: The revision clarifies the young man’s location, renders the white στολή as a long white garment without the misleading associations of “uwe mwụda,” and recasts the footnote so that angelic identity remains an interpretation rather than a substitution for Mark’s own wording. No doctrinal conclusion is added to the main text.
