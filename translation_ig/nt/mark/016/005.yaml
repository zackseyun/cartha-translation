source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: ig
  text: Mgbe ha banyere n’ime ili ahụ, ha hụrụ otu nwa okorobịa[a] ka ọ nọ ọdụ n’akụkụ aka nri, yi uwe ogologo ọcha; ụjọ wee jide ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụrụ ịghọta ya dịka “mmụọ ozi.” N’ebe a, Mak kpọrọ ya “nwa okorobịa,” ọ bụ ezie na ọnọdụ akụkọ ahụ na akụkọ ndị yiri ya na-egosi na ọ bụ mmụọ ozi.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: Mgbe ha banyere
  rationale: Aorist participle nwanyị ọtụtụ na-ezo aka n’ụmụ nwanyị ahụ; ntụgharị oge a na-egosi njikọ ya na ngwaa bụ isi n’Igbo eke.
- source_word: μνημεῖον
  choice: ili ahụ
  rationale: N’akụkọ olili na mbilite n’ọnwụ, “ili” bụ okwu Igbo doro anya maka ebe e liri ozu; “ahụ” na-egosi ili ahụ e kwuru okwu ya.
- source_word: νεανίσκον
  choice: otu nwa okorobịa
  rationale: Okwu Grik ahụ pụtara nwa okorobịa, ọ bụghị “mmụọ ozi” kpọmkwem; nke a na-edobe nkọwa Mak n’enweghị itinye nkọwa sitere n’akụkọ ndị ọzọ.
- source_word: καθήμενον
  choice: ka ọ nọ ọdụ
  rationale: Na-egosi ọnọdụ nwa okorobịa ahụ n’ụzọ Igbo dị mfe ma bụrụ eke.
- source_word: ἐν τοῖς δεξιοῖς
  choice: n’aka nri
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị akọwa ebe mmadụ nọ n’akụkụ aka nri.
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: yi uwe mwụda ọcha
  rationale: Na-egosi na o yi uwe ahụ, ma “uwe mwụda” na-enye echiche nke στολή dị ka uwe ogologo pụrụ iche karịa naanị uwe nkịtị.
- source_word: ἐξεθαμβήθησαν
  choice: ụjọ wee jide ha
  rationale: Ngwaa ahụ na-egosi nnukwu akpata oyi na ụjọ karịa nanị iju anya; akpaalaokwu Igbo a bụ nke eke ma ghara ime ka ọ bụrụ oke ụjọ karịa ihe ederede na-ekwu.
theological_decisions:
- issue: Onye νεανίσκος bụ
  choice: A sụgharịrị ya dịka “nwa okorobịa” n’ahịrị bụ isi.
  alternative: mmụọ ozi
  rationale: Ọ bụ ezie na uwe ọcha, ọnọdụ akụkọ ahụ, na akụkọ ndị yiri ya na-egosi onye ozi nke eluigwe, Mak 16:5 n’onwe ya kpọrọ ya νεανίσκος, ya bụ nwa okorobịa. Ya mere, ahịrị bụ isi na-edobe okwu Mak, ebe nkọwa ala peeji na-eme ka onye na-agụ mara nghọta ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro akụkọ Grik, ma jiri njikọ “mgbe” na “wee” mee ka ọ daa nke ọma n’Igbo. Akara nkọwa [a] dị ozugbo n’azụ okwu ọ metụtara.
