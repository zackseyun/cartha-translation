- from: Mgbe ha banyere n’ime ili ahụ, ha hụrụ otu nwa okorobịa[a] ka ọ nọ ọdụ n’aka nri, yi uwe mwụda ọcha; ụjọ wee jide ha.
  to: Mgbe ha banyere n’ime ili ahụ, ha hụrụ otu nwa okorobịa[a] ka ọ nọ ọdụ n’akụkụ aka nri, yi uwe ogologo ọcha; ụjọ wee jide ha.
  rationale: The revision clarifies the young man’s location, renders the white στολή as a long white garment without the misleading associations of “uwe mwụda,” and recasts the footnote so that angelic identity remains an interpretation rather than a substitution for Mark’s own wording. No doctrinal conclusion is added to the main text.
