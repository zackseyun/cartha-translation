  to: Ma ọ sịrị ha, “Ka ụjọ ghara ịtụ unu. Unu na-achọ Jizọs onye Nazaret[a], onye a kpọgidere n’obe. E kpọlitela ya; ọ nọghị ebe a[b]. Leenụ ebe ha tọgbọrọ ya.”
