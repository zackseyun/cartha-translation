review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the address, the search for Jesus, the crucifixion, his absence from the tomb, and the location where he was laid. However, “E mere ka o si n’ọnwụ bilie” is an overly periphrastic and less natural way to represent ἠγέρθη; it also adds “si n’ọnwụ” where the Greek simply says that he was raised. “E kpọlitela ya” is idiomatic Standard Igbo and preserves the Greek passive sense without naming the agent.
  naturalness: Most of the verse is clear and natural in modern Standard Igbo. “Ka ụjọ ghara ịtụ unu,” “Unu na-achọ,” and “Leenụ ebe ha tọgbọrọ ya” fit the narrative register well. Replacing the resurrection clause substantially improves idiomatic flow.
  terminology: “Jizọs onye Nazaret,” “onye a kpọgidere n’obe,” and “ebe ha tọgbọrọ ya” are appropriate and understandable biblical terminology. The revised resurrection wording retains the passive form and avoids interpretive expansion. Footnote b is revised so that its quoted primary rendering agrees exactly with the revised text.
  issues:
  - severity: medium
    issue: The rendering of ἠγέρθη is unnecessarily circumlocutory and adds wording not explicit in the Greek.
    rationale: “E mere ka o si n’ọnwụ bilie” is less idiomatic than the natural passive construction “E kpọlitela ya,” and “si n’ọnwụ” is not stated in the source. The revised form faithfully represents the passive aorist while remaining natural in Igbo.
  - severity: low
    issue: Footnote b does not quote the main-text wording exactly.
    rationale: The existing main text reads “E mere ka o si n’ọnwụ bilie,” while the note quotes “E mere ka o bilie.” Revising both resolves this internal inconsistency.
  revised_text: Ma ọ sịrị ha, “Ka ụjọ ghara ịtụ unu. Unu na-achọ Jizọs onye Nazaret[a], onye a kpọgidere n’obe. E kpọlitela ya; ọ nọghị ebe a[b]. Leenụ ebe ha tọgbọrọ ya.”
