  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: ig
  text: Ma ọ sịrị ha, “Ka ụjọ ghara ịtụ unu. Unu na-achọ Jizọs onye Nazaret[a], onye a kpọgidere n’obe. E kpọlitela ya; ọ nọghị ebe a[b]. Leenụ ebe ha tọgbọrọ ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye Nazorean” ma ọ bụ “onye si Nazaret.” Okwu Grik ahụ bụ aha njirimara e sitere n’aha Nazaret nweta.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsị, “O biliela” ma ọ bụ “O si n’ọnwụ bilie.” Ma ngwaa Grik dị n’olu nnara: “E kpọlitela ya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: Ka ụjọ ghara ịtụ unu
  rationale: Nkebiokwu a na-egosi oké ụjọ ma ọ bụ mgbagwoju obi, ọ bụghị naanị iju anya; ọ bụkwa okwu Igbo doro anya ma bụrụ nke e ji eme ihe ugbu a.
- source_word: Ναζαρηνὸν
  choice: onye Nazaret
  rationale: Ọ na-edobe aha e ji amata Jizọs nke sitere n’aha obodo Nazaret, n’asụsụ Igbo dị mfe nghọta.
- source_word: ἐσταυρωμένον
  choice: onye a kpọgidere n’obe
  rationale: Ọ na-egosi ihe e mere Jizọs nke ka na-akọwa onye a na-ekwu banyere ya, n’enweghị ịgbakwunye nkọwa ozizi.
- source_word: ἠγέρθη
  choice: E mere ka o si n’ọnwụ bilie
  rationale: Ọ na-edobe olu nnara nke ngwaa Grik ma na-eme ka ihe ọnwụ na mbilite n’ọnwụ pụta ìhè n’Igbo.
- source_word: ὧδε
  choice: ebe a
  rationale: Nke a bụ ntụgharị Igbo nkịtị na nke ziri ezi maka nrụtụ aka n’ebe ahụ.
- source_word: ἴδε
  choice: Leenụ
  rationale: Ọ bụ iwu na-adọta uche ndị inyom ahụ n’ebe ahụ, ma bụrụ okwu dị ugbu a na nke kwesịrị nsọpụrụ.
- source_word: τόπος
  choice: ebe
  rationale: Ọ bụ okwu Igbo nkịtị nke na-egosi kpọmkwem ọnọdụ a tọgbọrọ ya.
- source_word: ἔθηκαν
  choice: ha tọgbọrọ
  rationale: “Tọgbọrọ” dabara n’ọnọdụ ili ozu ma na-edobe onye mere ihe ahụ n’ụdị ọtụtụ.
- source_word: ζητεῖτε
  choice: Unu na-achọ
  rationale: Ọ na-egosipụta omume na-aga n’ihu ma kwekọọ na ọtụtụ ndị inyom a na-agwa okwu.
- source_word: λέγει αὐταῖς
  choice: ọ sịrị ha
  rationale: Igbo na-ejikarị oge gara aga kọọ akụkọ n’ụzọ eke; nke a na-ebufe ihe historical present pụtara n’enweghị okwu na-adịghị eke.
theological_decisions:
- issue: Okwu mbilite n’ọnwụ na olu ngwaa
  choice: E mere ka o si n’ọnwụ bilie
  alternative: O biliela / O si n’ọnwụ bilie
  rationale: ἠγέρθη bụ ngwaa olu nnara. Nhọrọ a na-edobe olu ahụ na ntụnye aka n’omume Chineke n’enweghị ịkpọ onye mere ya aha ma ọ bụ ịkọwa ihe karịrị ihe odide ahụ kwuru.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. A họọrọ “Jizọs” na “obe” dịka okwu Ndị Kraịst maara nke ọma. Akara nkọwa ala peeji [a] na [b] dị n’ebe okwu ha na-akọwa pụtara.
