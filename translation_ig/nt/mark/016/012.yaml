  verdict: revise
  source_fidelity: 'Draft ahụ na-atụgharị isi ihe Grik niile nke ọma: usoro oge, mmadụ abụọ sitere n’ìgwè ahụ, ọdịdị dị iche, na njem ha gaa n’ime obodo. Otú ọ dị, njikọ «na-aga ime obodo» adịghị egosi ntụziaka εἰς ἀγρόν n’Igbo nke ọma; «gaa n’ime obodo» na-egosi ebe a na-aga n’ụzọ doro anya.'
  naturalness: «ka ha na-aga ije, na-aga ime obodo» na-ada ugboro ugboro ma «na-aga ime obodo» enweghị njikọ ntụziaka a tụrụ anya ya. «mgbe ha na-aga ije n’ụzọ ha gaa n’ime obodo» bụ Standard Igbo dị ire ma na-echekwa echiche participle abụọ ahụ n’enweghị ikwughachi na-adịghị ekwe omume.
  terminology: «ọ pụtara», «n’ụdị dị iche», na «mmadụ abụọ n’ime ha» dabara n’amaokwu ahụ ma ghara ịtụnye nkọwa ozizi. «Ime obodo» dabara na ἀγρός n’ọnọdụ a, ebe ihe odide ala ala na-echekwa «n’ubi» dịka nhọrọ ọzọ.
