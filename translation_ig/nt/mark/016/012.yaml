- from: Mgbe ihe ndị a gasịrị, ọ pụtara n’ụdị dị iche[a] nye mmadụ abụọ n’ime ha ka ha na-aga ije, na-aga ime obodo[b].
  to: Mgbe ihe ndị a gasịrị, ọ pụtara n’ụdị dị iche[a] nye mmadụ abụọ n’ime ha, mgbe ha na-aga ije n’ụzọ ha gaa n’ime obodo[b].
  rationale: E degharịrị naanị akụkụ na-akọwa njem ahụ ka εἰς ἀγρόν bụrụ «gaa n’ime obodo» n’Igbo. «Mgbe ha na-aga ije n’ụzọ ha» na-egosipụta περιπατοῦσιν na πορευομένοις n’ụzọ dị mma ma na-enweghị ikwughachi na-adịghị ada nke ọma.
