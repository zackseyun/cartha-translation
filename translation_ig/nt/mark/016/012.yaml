  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: ig
  text: Mgbe ihe ndị a gasịrị, ọ pụtara n’ụdị dị iche[a] nye mmadụ abụọ n’ime ha, mgbe ha na-aga ije n’ụzọ ha gaa n’ime obodo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ụdị ọzọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ubi”; n’ebe a, “ime obodo” na-egosipụta ihe ἀγρός yiri ka ọ pụtara n’ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Mgbe ihe ndị a gasịrị
  rationale: Nke a na-echekwa usoro oge nke μετά + accusative; δέ bụ njikọ na-eme ka akụkọ gaa n’ihu, nke a na-egosipụta n’ụzọ ebumpụta ụwa site n’usoro ahịrịokwu Igbo.
- source_word: δυσὶν ἐξ αὐτῶν
  choice: nye mmadụ abụọ n’ime ha
  rationale: Ọ na-egosi mmadụ abụọ e si n’etiti ìgwè ahụ họpụta, n’asụsụ Igbo doro anya ma dịkwa mfe.
- source_word: περιπατοῦσιν
  choice: ka ha na-aga ije
  rationale: Ụdị participle nke oge ugbu a na-egosi ihe ha nọ na-eme mgbe ọ pụtara; ‘ka ha na-aga ije’ na-egosipụta omume ahụ na-aga n’ihu.
- source_word: ἐφανερώθη
  choice: ọ pụtara
  rationale: N’ebe a passive φανερόω na-arụ ọrụ dị ka okwu maka mmadụ ime ka a hụ ya; ‘ọ pụtara’ bụ ụzọ Igbo kacha doo anya ma ghara ịgbakwunye nkọwa.
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: n’ụdị dị iche
  rationale: ἑτέρᾳ na-egosi ịdị iche, μορφή na-egosikwa ụdị ma ọ bụ ọdịdị. Nsụgharị a na-echekwa okwu ahụ n’enweghị ịkọwa kpọmkwem otú ọdịiche ahụ si dị.
- source_word: πορευομένοις
  choice: na-aga
  rationale: Ọ na-egosi njem nwere ebe a na-aga. Ijikọta ya na ‘ka ha na-aga ije’ na-echekwa ma ije ha na njem ha, ọ bụ ezie na e nwere ntakịrị ikwughachi okwu dịka ọ dị na Grik.
- source_word: εἰς ἀγρόν
  choice: ime obodo
  rationale: ἀγρός nwere ike ịpụta ubi, ma n’ọnọdụ a o yikarịrị ka ọ na-ezo aka n’ala ime obodo ma ọ bụ obodo nta, ọ bụghị nanị otu ubi.
theological_decisions:
- issue: Ụdị mbilite n’ọnwụ e gosiri site n’okwu ἐν ἑτέρᾳ μορφῇ
  choice: n’ụdị dị iche
  alternative: n’ọdịdị dị iche; n’ụdị ọzọ
  rationale: Amaokwu ahụ kwuru na Jizọs pụtara n’ụdị dị iche, ma ọ kọwaghị ma ahụ́ ya gbanwere, ma ụzọ ha si hụ ya gbanwere, ma ọ bụ ma nsogbu bụ ịmata onye ọ bụ. Nsụgharị ahụ na-ahapụ esemokwu a ka ọ dị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro akụkọ Grik na ntakịrị ikwughachi nke περιπατοῦσιν na πορευομένοις, ma a haziri ya ka ọ daa nke ọma n’Igbo.
