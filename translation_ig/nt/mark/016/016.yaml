review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the two coordinated descriptions in the first clause, the contrast introduced by δέ, and the future passive outcomes. However, “onye kwere ekwe” is less direct than the aorist participle and can sound like the established label “a believer,” rather than “the one who believed.” The second outcome needs an explicit object pronoun and a clearly condemnatory judicial expression.
  naturalness: “Onye kwere, e meekwa ya baptizim” is idiomatic Standard Igbo and naturally conveys “the one who believed and was baptized.” “Ka a ga-azọpụta ya” and “ka a ga-ama ya ikpe ọmụma” are complete, clear focused clauses. The latter avoids the under-specified sense of merely being tried or judged.
  terminology: “Baptizim” is an established Christian term in Standard Igbo. “Azọpụta” appropriately renders the soteriological sense of σώζω. “Ama ikpe ọmụma” expresses adverse judgment/condemnation without adding a specific doctrinal interpretation.
  issues:
  - severity: medium
    issue: “Onye kwere ekwe” weakens the participial event-description.
    rationale: The reduplicated expression commonly denotes a believer or one who believes. “Onye kwere” more directly represents ὁ πιστεύσας while retaining the generic singular.
  - severity: medium
    issue: The main-clause passives omit the explicit object pronoun, and “a ga-ama ikpe” is under-specified.
    rationale: Adding “ya” makes the person affected explicit. “A ga-ama ya ikpe ọmụma” clearly conveys κατακριθήσεται (“will be condemned”), rather than simply undergoing judgment.
  - severity: low
    issue: Footnotes retain the less precise “kwere ekwe” wording.
    rationale: The alternatives should align with the revised base rendering and remain genuinely usable alternatives.
