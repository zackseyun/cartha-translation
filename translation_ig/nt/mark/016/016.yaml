  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ πιστεύσας καὶ βαπτισθεὶς σωθήσεται, ὁ δὲ ἀπιστήσας κατακριθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: ig
  text: Onye kwere, e meekwa ya baptizim, ka a ga-azọpụta ya[a][b]; ma onye na-ekweghị ekwe ka a ga-ama ya ikpe ọmụma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ okwu na-aga were were: “Onye ọ bụla kwere, e meekwa ya baptizim, ka a ga-azọpụta ya; ma onye ọ bụla na-ekweghị ekwe ka a ga-ama ya ikpe ọmụma.”'
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ na-esochikwu usoro Grik: “Onye kwere, bụrụkwa onye e mere baptizim, ka a ga-azọpụta ya.”'
    reason: aspect_and_form_alternative
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: onye kwere ekwe
  rationale: Nkebiokwu a na-anọchi anya onye e ji omume ikwere mara. ‘Onye kwere ekwe’ na-edobe otu onye e ji anọchi anya mmadụ niile ma na-egosi na ikwere ahụ bu ụzọ tupu nzọpụta a na-ekwu maka ya.
- source_word: βαπτισθεὶς
  choice: e meekwa ya baptizim
  rationale: 'Nke a na-edobe olu nnara nke Grik: ọ bụ onye ahụ ka e mere baptizim. ‘-kwa’ na-ejikọta ya na ikwere n’enweghị ịkọwa otu baptizim si metụta nzọpụta karịa ihe amaokwu ahụ kwuru.'
- source_word: σωθήσεται
  choice: ka a ga-azọpụta
  rationale: N’ebe a, okwu ahụ pụtara nzọpụta n’ụzọ okpukpe, ọ bụghị naanị ịnapụta mmadụ n’ihe ize ndụ nke oge a. Olu a na-edobekwa ọdịdị nnara nke ngwaa Grik.
- source_word: ὁ δὲ ἀπιστήσας
  choice: ma onye na-ekweghị ekwe
  rationale: Nke a na-egosipụta ọdịiche dị n’etiti ikwere na ekweghị ekwe n’Igbo doro anya. Ọ bụ ezie na Grik ji aorist participle, ụdị Igbo a bụ ụzọ ebumpụta ụwa isi kọwaa onye e ji ekweghị ekwe mara.
- source_word: κατακριθήσεται
  choice: ka a ga-ama ikpe
  rationale: Nkebiokwu a na-egosi ikpe na-adịghị mma a mara mmadụ, ma na-edobe olu nnara nke ngwaa Grik.
- source_word: καὶ
  choice: e meekwa
  rationale: Mgbakwunye ‘-kwa’ na njikọ ahịrịokwu ahụ na-arụ ọrụ ‘na/ma’ nke καὶ, na-ejikọta ikwere na ịbụ onye e mere baptizim n’ụzọ Igbo dị larịị.
- source_word: δὲ
  choice: ma
  rationale: ‘Ma’ na-egosi ọdịiche dị n’etiti ihe ga-eme onye kwere ekwe na ihe ga-eme onye na-ekweghị ekwe.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ikwere, baptizim, na nzọpụta
  choice: E jikọtara ikwere na ịbụ onye e mere baptizim dịka nkọwa onye a ga-azọpụta, n’enweghị ịsị na baptizim n’onwe ya bụ ihe na-akpata nzọpụta ma ọ bụ na ọ bụ ihe na-enweghị mkpa.
  alternative: A pụrụ ịsụgharị ya n’ụzọ ga-eme ka baptizim bụrụ kpọmkwem ụzọ nzọpụta si abịa, ma ọ bụ n’ụzọ ga-eme ka baptizim yie ihe a kpọtụrụ naanị n’agbanyeghị.
  rationale: Grik jikọtara participle abụọ ahụ na nkebi nke mbụ, ma n’ọkara nke abụọ ọ kpọrọ naanị onye na-ekweghị ekwe aha dịka onye a ga-ama ikpe. Nsụgharị ahụ na-edobe esemokwu nkà mmụta okpukpe a kama idozi ya n’otu ụzọ ụka pụrụ iche.
- issue: Otu onye nwoke e ji anọchi anya mmadụ niile na Grik
  choice: onye
  alternative: ndị niile; nwoke ahụ
  rationale: ‘Onye’ na-edobe otu onye e ji anọchi anya mmadụ niile ma ọ naghị egosi na okwu ahụ metụtara naanị ụmụ nwoke.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Baptizim’ bụ okwu Ndị Kraịst maara nke ọma; a hapụrụ ya n’enweghị nkọwa otu ụka pụrụ iche. A họọrọ ‘onye’ iji debe otu onye nke Grik ma ka ọ bụrụ okwu metụtara mmadụ niile.
