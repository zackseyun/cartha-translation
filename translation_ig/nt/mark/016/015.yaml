revisions:
- from: O wee sị ha, “Gaanụ n’ụwa niile, kwusaanụ ozi ọma[a] nye ihe niile e kere eke[b].”
  to: Ọ sịrị ha, “Gaanụ n’ụwa niile, kwusaanụ ozi ọma[a] nye okike niile[b].”
  rationale: The revision retains the source text’s imperative force and universal scope, while using more natural Standard Igbo for the debated scope of κτίσις. The footnote explicitly preserves the alternative distributive reading without resolving the ambiguity.
  reviewer_model: gpt-5.6-terra
