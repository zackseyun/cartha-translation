source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἰς τὸν κόσμον ἅπαντα κηρύξατε τὸ εὐαγγέλιον πάσῃ τῇ κτίσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: ig
  text: Ọ sịrị ha, “Gaanụ n’ụwa niile, kwusaanụ ozi ọma[a] nye okike niile[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oziọma.” Okwu Grik εὐαγγέλιον pụtara “ozi ọma.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nye ihe ọ bụla e kere eke.” Enwere ike ịghọta nkebiokwu Grik ahụ dịka okike niile n’ozuzu ma ọ bụ dịka ihe e kere eke n’otu n’otu.
    reason: alternative_reading
lexical_decisions:
- source_word: Πορευθέντες
  choice: Gaanụ
  rationale: Ọ bụ participle aorist nke na-eso n’ike iwu bụ κηρύξατε; n’Igbo dị ire, iji iwu ‘Gaanụ’ na-egosi ike nke ọrụ e nyere ha karịa ntụgharị nkịtị dịka ‘Mgbe unu gara.’
- source_word: κόσμον ἅπαντα
  choice: n’ụwa niile
  rationale: Nke a na-egosi ụwa dum dịka ebe ozi ahụ ga-eru; ‘ụwa niile’ bụ Igbo dị mfe ma na-echekwa oke zuru ụwa ọnụ nke okwu Grik.
- source_word: κηρύξατε
  choice: kwusaanụ
  rationale: κῆρύσσω pụtara ikwupụta ozi n’ihu ọha dịka onye na-ekwusa ọkwa; ‘kwusaanụ’ na-echekwa echiche ahụ n’Igbo nke oge a.
- source_word: τὸ εὐαγγέλιον
  choice: ozi ọma
  rationale: εὐαγγέλιον pụtara ozi ọma. Okwu Igbo a na-enye ihe okwu Grik pụtara ozugbo, ebe ‘oziọma’ dịka otu mkpụrụokwu bụkwa ụdị a na-ejikarị eme ihe.
- source_word: πάσῃ τῇ κτίσει
  choice: nye ihe niile e kere eke
  rationale: κτίσις nwere ike ịpụta ihe e kere eke n’otu n’otu ma ọ bụ okike niile n’ozuzu. Nhọrọ a na-echekwa obosara okwu Grik ma ghara ime ka ọ bụrụ naanị mmadụ niile.
- source_word: εἶπεν αὐτοῖς
  choice: O wee sị ha
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si ewebata okwu n’akụkọ, ma kwekọọ n’echiche ‘ọ sịrị ha.’
theological_decisions:
- issue: Oke πάσῃ τῇ κτίσει n’iwu ikwusa ozi ọma
  choice: ihe niile e kere eke
  alternative: okike niile; ihe ọ bụla e kere eke
  rationale: Nkebiokwu Grik ahụ nwere ike ịbụ mkpokọta (‘okike niile’) ma ọ bụ nkesa (‘ihe ọ bụla e kere eke’). ‘Ihe niile e kere eke’ na-echekwa ma obosara ya ma mgbagwoju anya ya, n’agbanyeghị na n’ihe gbasara ikwusa ozi ọma, a ga-aghọta na ụmụ mmadụ bụ ndị bụ isi a na-ekwu maka ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ụdị iwu ‘Gaanụ… kwusaanụ’ na-eme ka ọrụ e nyere ọtụtụ ndị pụta ìhè. E debere ‘ihe niile e kere eke’ iji chekwaa obosara na ambiguiti nke Grik.
