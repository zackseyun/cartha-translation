  rationale: The revision replaces the repetitive wording for the man’s hand with a natural Standard Igbo expression that reflects the Greek perfect participle’s resulting state. It also restricts the lexical footnote to viable renderings of the source term, removing interpretive medical or physical details not stated in the text.
