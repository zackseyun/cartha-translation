  text: Καὶ εἰσῆλθεν πάλιν ⸀εἰς συναγωγήν, καὶ ἦν ἐκεῖ ἄνθρωπος ἐξηραμμένην ἔχων τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/001.yaml
  text: And he entered a synagogue again[c][b][a], and a man was there with a withered hand.
translation:
  language: ig
  text: Ọ banyere ọzọ n’ụlọ nzukọ ndị Juu,[a] otu nwoke nwere aka akpọnwụwo nọ ebe ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ụlọ nzukọ ahụ,” ma ọ bụrụ na Mak na-ekwu banyere otu ụlọ nzukọ ndị na-agụ akụkọ ahụ marala.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “aka kpọrọ nkụ” ma ọ bụ “aka kpọnwụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: Ọ banyere
  rationale: 'Aorist εἰσῆλθεν na-egosi omume dị mfe n’akụkọ: ọ banyere n’ime ebe ahụ.'
- source_word: πάλιν
  choice: ọzọ
  rationale: πάλιν na-egosi na omume a mere ọzọ; ‘ọzọ’ bụ okwu Igbo dị mfe ma kwekọọ n’ebe a.
- source_word: εἰς συναγωγήν
  choice: n’ụlọ nzukọ ndị Juu
  rationale: ‘Ụlọ nzukọ ndị Juu’ na-akọwa συναγωγή n’Igbo nkịtị; n’ na ngwaa ‘banyere’ na-ebupụta echiche εἰς nke ịbanye n’ime ebe. Enweghị article n’asụsụ Grik, ya mere isiokwu ahụ anaghị ekwusi ike na ọ bụ otu ụlọ nzukọ a kpọtụrụla aha.
- source_word: ἦν ἐκεῖ
  choice: nọkwa n’ebe ahụ
  rationale: Nke a na-ebupụta ma ịdị onye ahụ nọ ma ebe ọ nọ, n’ụzọ Igbo na-aga were were.
- source_word: ἄνθρωπος
  choice: otu nwoke
  rationale: N’akụkọ a, ἄνθρωπος na-ezo aka n’otu nwoke; ‘otu nwoke’ na-ewebata ya dịka onye ọhụrụ n’akụkọ ahụ.
- source_word: ἐξηραμμένην
  choice: kpọnwụrụ akpọnwụ
  rationale: Perfect participle a na-akọwa aka nke ghọrọ nke kpọrọ nkụ ma ọ bụ nke na-adịghịzi arụ ọrụ nke ọma; okwu a na-egosipụta ọnọdụ ahụ na-aga n’ihu.
- source_word: ἔχων τὴν χεῖρα
  choice: nke aka ya ...
  rationale: Nhazi a bụ Igbo ebumpụta ụwa nke na-echekwa njikọ participial ahụ na nwoke ahụ, ebe ‘ya’ na-eme ka onye nwe aka ahụ doo anya.
theological_decisions: []
translation_notes:
  register: 'Asụsụ Igbo izugbe, nke dị ùgwù ma dị mfe nghọta. E debere usoro akụkọ ahụ n’ụzọ ebumpụta ụwa: e buru ụzọ kwuo banyere ịbanye Jizọs, emesịa webata nwoke ahụ. Akara nkọwa ala peeji niile dị n’isiokwu.'
