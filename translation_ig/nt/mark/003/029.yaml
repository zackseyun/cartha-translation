  text: ὃς δ’ ἂν βλασφημήσῃ εἰς τὸ πνεῦμα τὸ ἅγιον, οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα, ἀλλὰ ἔνοχός ἐστιν αἰωνίου ⸀ἁμαρτήματος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/029.yaml
  text: but whoever blasphemes against the Holy Spirit never has forgiveness[c][b][a], but is guilty of an eternal sin.
translation:
  language: ig
  text: Ma onye ọ bụla na-ekwulu Mmụọ Nsọ, a gaghị agbaghara ya ma ọlị[a]; kama ikpe mara ya maka mmehie ebighị ebi[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị: “o nweghị mgbaghara ruo n’oge ebighị ebi,” ya bụ, “a gaghị agbaghara ya mgbe ọbụla” ma ọ bụ “o nweghị mgbaghara ruo mgbe ebighị ebi.”'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ ga-aza ajụjụ maka mmehie ebighị ebi.”
    reason: lexical_alternative
  - marker: c
    text: Ụfọdụ ihe odide ochie nwere “ikpe ebighị ebi” n’ọnọdụ “mmehie ebighị ebi.”
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: Ma onye ọ bụla nke
  rationale: “Onye ọ bụla” na-egosipụta nke ọma ahịrịokwu ikwu maka onye ọbụla nke ὃς ... ἄν na-eweta; “Ma” na-echekwa obere ọdịiche δέ na-egosi n’ihe bu ụzọ.
- source_word: βλασφημήσῃ
  choice: na-ekwulu
  rationale: “Ikwulu” bụ okwu Igbo doro anya maka ikwu okwu mkparị ma ọ bụ okwu na-emebi nsọpụrụ Chineke; ọdịdị “na-ekwulu” na-egosi na okwu a metụtara onye ọbụla mere ụdị omume ahụ.
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: N’usoro a, εἰς na-egosi onye okwu nkwulu ahụ megidere ma ọ bụ lekwasịrị anya n’ebe ọ nọ. Ngwaa Igbo “ikwulu” na-ewere onye a na-emegide kpọmkwem, ya mere ọ dịghị mkpa itinye okwu ọzọ dịka “megide.”
- source_word: οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα
  choice: a gaghị agbaghara ya ma ọlị
  rationale: 'Nke a na-enye n’Igbo nkịtị ike nke nkwupụta na-adịghị mma tinyere akpaalaokwu “ruo n’oge ahụ”: mgbaghara agaghị adị ya mgbe ọbụla. Ihe e dere n’ụdị okwu nkịtị dị na nkọwa ala peeji.'
- source_word: ἀλλὰ
  choice: kama
  rationale: “Kama” na-egosipụta mgbanwe siri ike nke ἀλλά site n’enweghị mgbaghara gaa n’ịbụ onye ikpe mara.
- source_word: ἔνοχός ἐστιν
  choice: ikpe ... mara ya
  rationale: Akpaalaokwu Igbo “ikpe mara ya” na-enye echiche nke ịbụ onye ikpe mara, ma na-ahapụkwa ohere nke ἔνοχος nwere banyere ịbụ onye ga-aza ajụjụ.
- source_word: αἰωνίου ἁμαρτήματος
  choice: mmehie ebighị ebi
  rationale: Nke a na-asụgharị kpọmkwem ihe SBLGNT họọrọ, ἁμαρτήματος (“mmehie”), ma na-echekwa ibu okwu αἰωνίου dịka “ebighị ebi.”
theological_decisions:
- issue: Ụdị mmejọ a na-apụghị ịgbaghara
  choice: E debere kpọmkwem okwu ahụ dịka “na-ekwulu Mmụọ Nsọ.”
  alternative: Ịkọwa ya n’amaokwu ahụ dịka ịnọgide kpachara anya jụ akaebe Mmụọ Nsọ, ma ọ bụ ịsị na ọrụ Mmụọ bụ ọrụ mmụọ ọjọọ.
  rationale: Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-enye aka ịghọta ya, amaokwu a n’onwe ya ekwughị nkọwa ndị ahụ n’uju. Ịhapụ okwu ahụ dịka ọ dị na-echekwa esemokwu nkà mmụta okpukpe ma zere ịmanye otu nkọwa.
- issue: Ọdịiche ederede na ngwụcha amaokwu ahụ
  choice: mmehie ebighị ebi
  alternative: ikpe ebighị ebi; ọmụma ikpe ebighị ebi
  rationale: Ederede SBLGNT e nyere nwere αἰωνίου ἁμαρτήματος, ya bụ “mmehie ebighị ebi.” E debere ọdịiche ederede ndị ọzọ na nkọwa ala peeji kama itinye ha n’isi amaokwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ikwulu” na-echekwa ibu okpukpe nke βλασφημέω; “a gaghị agbaghara ya ma ọlị” bụ ụzọ Igbo sitere n’okike isi kwuo nkwupụta zuru ụwa ọnụ nke οὐκ ... εἰς τὸν αἰῶνα. E tinyere akara nkọwa ala peeji niile [a], [b], na [c] n’ebe ha metụtara n’isi ederede.
