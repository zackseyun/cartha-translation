  verdict: revise
  source_fidelity: A na-agbakwunye “n'ebe ahụ” n'agbanyeghị na ọ dịghị na Grik, “laghachi azụ” na-atụ aro nloghachi nke ἀνεχώρησεν anaghị ekwu, “ndị ọzọ” na-agbakwunye otu ìgwè ọzọ na-enweghị isi na Grik, na “n'akụkụ osimiri” nwere ike igosi na ha rutere n'akụkụ mmiri karịa ngagharị πρὸς chọrọ. E degharịala ya ka ọ nọgide na-egosi ịwepụ onwe ya na ịga n'ebe osimiri dị, ma debe ndepụta na-adịghị ezu ezu nke amaokwu a.
