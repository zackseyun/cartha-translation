  terminology: E debere “ndị na-eso ụzọ,” “osimiri,” “Galili,” na “Judia.” A ka sịrị “osimiri” n'isi ederede, ebe ala ala peeji na-akọwa na ọ bụ Oké Osimiri Galili. E bugharịala akara nkọwa omenala ka ọ rapara n'okwu “osimiri,” ọ bụghị “Judia.”
