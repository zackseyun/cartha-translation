  text: Καὶ ὁ Ἰησοῦς ⸂μετὰ τῶν μαθητῶν αὐτοῦ ἀνεχώρησεν⸃ πρὸς τὴν θάλασσαν· καὶ πολὺ πλῆθος ἀπὸ τῆς Γαλιλαίας ⸀ἠκολούθησεν, καὶ ἀπὸ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/007.yaml
  text: And Jesus withdrew with his disciples to the sea[a], and a great crowd from Galilee followed, and from Judea[b],
translation:
  language: ig
  text: Jizọs wepụrụ onwe ya, ya na ndị na-eso ụzọ ya, gaa n’ebe osimiri dị[a][b]; oké ìgwè mmadụ si Galili soro ya, na ndị si Judia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “gaa n’osimiri.” Mbuụzọ Grik a nwere ike igosi ngagharị n’ebe osimiri ahụ dị.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, Oké Osimiri Galili. Ihe odide Grik kwuru naanị “osimiri.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: si n'ebe ahụ laghachi azụ
  rationale: Ngwaa a pụtara ịpụ ma ọ bụ ịlaghachi azụ, karịsịa n’ọnọdụ nrụgide ma ọ bụ mmegide. Nhọrọ a na-edobe echiche ahụ n’Igbo dị mfe ma ghara ịkọ kpọmkwem ihe mere o ji pụọ.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: na ndị na-eso ụzọ ya
  rationale: N’Oziọma, μαθηταί bụ ndị na-amụta ihe n’aka Jizọs ma na-eso ya; ‘ndị na-eso ụzọ ya’ bụ okwu Igbo a maara nke ọma nke na-ejide akụkụ abụọ ahụ.
- source_word: πρὸς τὴν θάλασσαν
  choice: gaa n'akụkụ osimiri
  rationale: πρός na-egosi ngagharị chere ihu n’ebe mmiri ahụ dị, ma ọ pụtaghị mgbe niile na ha ruru ya. ‘N’akụkụ osimiri’ bụ ụzọ Igbo si akọ ebe dị n’akụkụ nnukwu mmiri, ebe nkọwa ala dị n’ala ala peeji na-akọwa na ọ bụ Oké Osimiri Galili.
- source_word: πολὺ πλῆθος
  choice: Oké ìgwè mmadụ
  rationale: Nkebiokwu a na-emesi ọnụ ọgụgụ buru ibu ike; ‘oké ìgwè mmadụ’ bụ okwu Igbo ebumpụta ụwa ma dị ùgwù.
- source_word: ἠκολούθησεν
  choice: soro ya
  rationale: N'ebe a, ngwaa ahụ na-ekwu na ìgwè mmadụ sooro Jizọs n'ụzọ. E tinyere ‘ya’ n’Igbo iji mee ka onye ha soro doo anya.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: si Galili
  rationale: Nke a na-egosi ebe ìgwè mmadụ ahụ si bịa.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: ndị ọzọ sikwa Judia
  rationale: Asụsụ Grik na-aga n’ihu depụta ebe ndị mmadụ si bịa ruo n’amaokwu na-esonụ. ‘Ndị ọzọ’ na-eme ka nhazi ahụ bụrụ Igbo ebumpụta ụwa, ebe rikoma ikpeazụ na-egosi na ndepụta ahụ ka na-aga n’ihu.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. E debere usoro ndepụta na-aga n’ihu ruo amaokwu na-esonụ, tinyere rikoma ikpeazụ. E ji ‘osimiri’ mee ihe maka θάλασσα dịka ojiji Akwụkwọ Nsọ Igbo si adị, ma ala ala peeji kọwara kpọmkwem nnukwu mmiri a na-ekwu maka ya.
