source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος ⸂τοὺς περὶ αὐτὸν κύκλῳ⸃ καθημένους λέγει· Ἴδε ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/034.yaml
  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: ig
  text: O legharịrị ndị nọ ọdụ gburugburu ya n’ụdị okirikiri anya, sị, “Lee, nne m na ụmụnne m ndị nwoke![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya “ụmụnne m.” Okwu Grik bụ kpọmkwem “ụmụnne nwoke,” ma ìgwè ndị gbara Jizọs gburugburu nwere ike ịgụnye ụmụ nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: legharịa anya
  rationale: Na-egosi na Jizọs tụgharịrị anya ya lee ndị gbara ya gburugburu; okwu a bụ nke Igbo dị mfe ma na-echekwa omume ahụ e kpachapụrụ anya mee.
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: ndị nọ ọdụ gbaa ya gburugburu
  rationale: 'Na-echekwa ihe atọ dị n’ahịrị Grik: ndị ahụ nọ ya gburugburu, ha gbara ya gburugburu, ha nọkwa ọdụ, n’ụzọ na-ada ka Igbo nkịtị.'
- source_word: λέγει
  choice: sị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a n’akụkọ ihe mere eme, ‘sị’ bụ ụzọ Igbo kacha eke si kọọ okwu e kwuru n’usoro akụkọ, na-enweghị ime ka ahịrịokwu sie ike.
- source_word: Ἴδε
  choice: Lee
  rationale: ‘Lee’ bụ okwu Igbo doro anya nke na-akpọ ndị na-ege ntị ka ha tụlee ndị Jizọs na-arụtụ aka.
- source_word: μήτηρ
  choice: nne m
  rationale: Nke a bụ ntụgharị nkịtị na kpọmkwem nke μήτηρ μου.
- source_word: ἀδελφοί
  choice: ụmụnne m ndị nwoke
  rationale: ‘Ụmụnne’ naanị ya nwere ike ịgụnye nwoke na nwanyị n’Igbo; itinye ‘ndị nwoke’ na-echekwa ụdị ọtụtụ nwoke nke okwu Grik, ebe nkọwa ala peeji na-egosi na ndị gbara Jizọs gburugburu nwere ike ịgụnye ụmụ nwanyị.
theological_decisions:
- issue: Okwu ezinụlọ ἀδελφοί bụ ọtụtụ nwoke, ma ndị nọ Jizọs gburugburu nwere ike ịgụnye ụmụ nwanyị.
  choice: ụmụnne m ndị nwoke
  alternative: ụmụnne m
  rationale: Isi ederede na-echekwa ọdịdị nwoke nke okwu Grik, ma nkọwa ala peeji na-ahapụ nghọta sara mbara nke nwere ike ịgụnye ma nwoke ma nwanyị, n’enweghị idozi ihe ederede hapụrụ ka ọ nwee ntakịrị mgbagwoju anya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. Nhazi ahịrịokwu ahụ bụ nke akụkọ Igbo eke; ‘Lee’ na-echekwa ike okwu ntụaka ahụ, ebe ‘ụmụnne m ndị nwoke’ na nkọwa [a] na-echekwa ma ọdịdị okwu Grik ma ohere nghọta sara mbara.
