- from: O wee legharịa anya n’ebe ndị nọ ọdụ gbaa ya gburugburu nọ, sị, “Lee, nne m na ụmụnne m ndị nwoke![a]”
  to: O legharịrị ndị nọ ọdụ gburugburu ya n’ụdị okirikiri anya, sị, “Lee, nne m na ụmụnne m ndị nwoke![a]”
  rationale: The revision removes the unnatural repeated relative-clause wording while explicitly retaining that the people were seated around Jesus in a circular arrangement. It preserves the historical narrative flow, the attention-directing “Lee,” and the masculine lexical rendering of ἀδελφοί, with a footnote that clearly notes the broader possible referential group without altering the text’s wording.
