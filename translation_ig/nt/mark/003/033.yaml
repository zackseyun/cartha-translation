review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys that Jesus responds to the people addressed and asks about his mother and brothers. However, “Ole ndị” is a plural/selection-oriented interrogative and sits poorly with the singular “nne m”; it does not represent the Greek τίς as well as “Ònye.” The first footnote also inaccurately paraphrases the aorist participle ἀποκριθείς as an action in progress (“Mgbe ọ na-aza”).
  naturalness: “Ọ zara ha, sị” is natural Standard Igbo narrative style. “Ònye ka nne m na ụmụnne m ndị nwoke bụ?” is a more idiomatic and coherent Igbo question than “Ole ndị bụ nne m na ụmụnne m ndị nwoke?”
  terminology: “nne” is appropriate. “ụmụnne m ndị nwoke” is a defensible gender-specific rendering of ἀδελφοί and does not settle the nature of the familial relationship. The main-text coordinator “na” is idiomatic, while the footnote should accurately note the Greek ἤ (“ma ọ bụ”).
  issues:
  - severity: medium
    issue: The main text uses “Ole ndị” for Τίς.
    rationale: “Ole ndị” naturally asks which persons or how many people and creates a mismatch with the singular “nne m.” “Ònye ka … bụ?” is the normal Igbo identity question and can govern the coordinated family terms.
  - severity: medium
    issue: Footnote a treats ἀποκριθείς as progressive.
    rationale: ἀποκριθείς is an aorist participle, best represented in a close gloss as “Mgbe/ebe ọ zara ha” or “N’ịzaghachi ha,” not “Mgbe ọ na-aza ha.”
  - severity: low
    issue: The wording of footnote a implies that the historical present is retained in the main text.
    rationale: The main text idiomatically uses past-tense “Ọ zara ha, sị”; the note should distinguish the Greek form from the Igbo rendering.
  revised_text: Ọ zara ha, sị,[a] “Ònye ka nne m na ụmụnne m ndị nwoke bụ?”[b]
