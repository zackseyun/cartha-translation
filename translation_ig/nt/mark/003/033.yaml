  yaml_path: translation/nt/mark/003/033.yaml
  text: And answering them[a], he says[b], “Who are my mother and my brothers?”
translation:
  language: ig
  text: Ọ zara ha, sị,[a] “Ònye ka nne m na ụmụnne m ndị nwoke bụ?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’usoro Grik dị nso: “Mgbe ọ zara ha, ọ na-ekwu.” Grik ji participle aorist na ngwaa ugbu a e ji akọ akụkọ mee ka akụkọ ahụ dị ndụ. N’Igbo nkịtị, a sụgharịrị ya, “Ọ zara ha, sị.”'
    reason: lexical_alternative
  - marker: b
    text: 'N’usoro Grik dị nso: “Ònye bụ nne m, ma ọ bụ ụmụnne m ndị nwoke?” Grik ji ngwaa singular kwekọrọ na “nne,” ma jikọta “ụmụnne” na ya site n’okwu pụtara “ma ọ bụ.”'
    reason: source_structure
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: Ọ zara ha sị
  rationale: Nke a bụ ụzọ Igbo nkịtị si ejikọta participle ἀποκριθείς, nnọchiaha dative αὐτοῖς, na historical present λέγει n’otu ahịrịokwu doro anya. Ọ na-egosi na Jizọs nyere ha nzaghachi ma malite ikwu okwu, n’enweghị okwu siri ike ma ọ bụ nke na-adịghị aga were were n’Igbo.
- source_word: Τίς
  choice: Ole ndị
  rationale: E ji ụdị ajụjụ a mee ka ajụjụ banyere ma ‘nne’ ma ‘ụmụnne ndị nwoke’ bụrụ Igbo dị mma. Ọ bụ ezie na Grik ji Τίς nke singular malite, isiokwu nke ajụjụ ahụ gụnyere otu onye na ọtụtụ mmadụ.
- source_word: μήτηρ
  choice: nne
  rationale: ‘Nne’ bụ okwu Igbo nkịtị, dị ùgwù, nke kwekọrọ kpọmkwem na μήτηρ.
- source_word: ἢ
  choice: na
  rationale: N’ajụjụ njirimara a, ‘na’ na-eme ka okwu ahụ bụrụ Igbo e ji eme ihe nke ọma mgbe a na-ajụ ndị mejupụtara akụkụ abụọ nke otu ìgwè. Ihe odide Grik ji ἢ, ‘ma ọ bụ,’ nke e debere n’ihe e dere n’ala peeji.
- source_word: ἀδελφοί
  choice: ụmụnne m ndị nwoke
  rationale: ἀδελφοί bụ masculine plural. Ịtinye ‘ndị nwoke’ na-egbochi ‘ụmụnne’ ịbụ okwu nwere ike ịgụnye ụmụnne nwanyị, ma na-edebe nkọwa nwoke dị na Grik n’ebughị ụzọ kpebie ụdị mmekọrịta ezinụlọ ha.
theological_decisions:
- issue: Ihe ἀδελφοί pụtara n’ihe gbasara ezinụlọ Jizọs
  choice: ụmụnne m ndị nwoke
  alternative: ụmụnne m
  rationale: Nhọrọ a na-edebe masculine plural nke Grik, ma ọ naghị akpọ ha ụmụnne otu nne na nna, ụmụnne nne ma ọ bụ nna, ma ọ bụ ndị ikwu. N’ihi ya, ọ naghị etinye nkọwa pụrụ iche nke otu ụka banyere ezinụlọ Jizọs.
- issue: Njikọ dị n’etiti ‘nne’ na ‘ụmụnne’
  choice: na n’ahịrịokwu bụ isi, tinyere nkọwa n’ala peeji
  alternative: ma ọ bụ
  rationale: Grik ji ἢ (‘ma ọ bụ’), ma ụdị ajụjụ ahụ nwere singular verb nke kwekọrọ na isiokwu mbụ. Iji ‘na’ na plural interrogative na-enye Igbo doro anya ma na-echekwa ọdịiche Grik n’ihe e dere n’ala peeji kama izochi ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ọ zara ha sị’ bụ usoro akụkọ a na-anụkarị n’Igbo. ‘Ụmụnne ndị nwoke’ na-eme ka gender nke ἀδελφοί doo anya, ebe ihe e dere n’ala peeji na-echekwa usoro na njikọ Grik nke ga-ada ntakịrị arọ ma e tinye ya kpọmkwem n’ahịrịokwu bụ isi.
