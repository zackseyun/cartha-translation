    reason: lexical_alternative
  - marker: b
    text: 'N’usoro Grik dị nso: “Ònye bụ nne m, ma ọ bụ ụmụnne m ndị nwoke?” Grik ji ngwaa singular kwekọrọ na “nne,” ma jikọta “ụmụnne” na ya site n’okwu pụtara “ma ọ bụ.”'
    reason: source_structure
