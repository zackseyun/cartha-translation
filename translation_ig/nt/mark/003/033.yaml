revisions:
- from: Ọ zara ha sị[a], “Ole ndị bụ nne m na ụmụnne m ndị nwoke?”[b]
  to: Ọ zara ha, sị,[a] “Ònye ka nne m na ụmụnne m ndị nwoke bụ?”[b]
  rationale: The revision replaces the unsuitable plural interrogative “Ole ndị” with the idiomatic identity-question construction “Ònye ka … bụ?” It retains natural Igbo coordination in the main text while preserving the Greek’s unusual singular verb and ἤ (“or”) in the footnote. Footnote a is corrected to reflect the aorist participle and the historical present accurately.
