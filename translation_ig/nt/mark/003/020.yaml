  text: Καὶ ⸀ἔρχεται εἰς οἶκον· καὶ συνέρχεται πάλιν ⸀ὁ ὄχλος, ὥστε μὴ δύνασθαι αὐτοὺς ⸀μηδὲ ἄρτον φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/020.yaml
  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: ig
  text: Jizọs wee bata n’ụlọ[a]. Ìgwè mmadụ ahụ gbakọtara ọzọ, nke mere na ha apụghịdị iri achịcha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nke a pụkwara ịpụta, “n’ụlọ ya.” N’asụsụ Grik, e kwughị onye nwe ụlọ ahụ.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “iri achịcha”; n’ebe a, ọ pụrụ ịpụta iri nri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: wee bata
  rationale: Akara akụkọ Igbo “wee” na-eme ka omume akụkọ ahụ gaa n’ihu n’ụzọ dị ndụ ma bụrụ nke e ji eme ihe n’Igbo, n’agbanyeghị na Grik ji historical present.
- source_word: εἰς οἶκον
  choice: n’otu ụlọ
  rationale: Nke a na-echekwa na οἶκον enweghị article ma ghara ikwu hoo haa na ọ bụ ụlọ onye ma ọ bụ ụlọ nke Jizọs.
- source_word: συνέρχεται πάλιν ὁ ὄχλος
  choice: Ìgwè mmadụ ahụ gbakọtara ọzọ
  rationale: “Gbakọtara” na-egosi ìgwè mmadụ bịakọtara n’otu ebe; “ọzọ” na-echekwa πάλιν.
- source_word: ὥστε μὴ δύνασθαι αὐτοὺς
  choice: nke mere na ha apụghịdị
  rationale: “Nke mere na” na-egosi nsonaazụ nke ὥστε; “ha” na-echekwa plural αὐτούς n’enweghị ịkọwapụta ndị ọ na-arụtụ aka karịa isi mmalite.
- source_word: μηδὲ ἄρτον φαγεῖν
  choice: iri nri
  rationale: N’ebe a, “iri achịcha” bụ akpaalaokwu Grik maka iri nri; Igbo nkịtị na-asị “iri nri.”
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị mfe ma nwee ugwu. E jiri “Jizọs” dochie nnọchiaha nwoke dị na Grik iji mee ka onye na-agụ ya ghọta isiokwu amaokwu ahụ n’Igbo; e chekwara nghọtahie dị na onye ụlọ ahụ bụ na nkọwa ala peeji.
