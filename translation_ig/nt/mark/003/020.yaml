review_pass:
  verdict: revise
  source_fidelity: A safe revision is needed. “N’otu ụlọ” can naturally be read as “into one house” in Igbo and thus introduces a numerical nuance absent from the anarthrous Greek εἰς οἶκον. Also, the main text should retain the lexical image of ἄρτον (“bread”), with the idiomatic meal sense explained in the note.
  naturalness: “Jizọs wee bata n’ụlọ” is natural Standard Igbo narrative style and leaves the house and its owner unspecified. “Ìgwè mmadụ ahụ gbakọtara ọzọ” and “nke mere na ha apụghịdị...” are clear and idiomatic.
  terminology: “Jizọs,” “ìgwè mmadụ,” “gbakọtara,” and “achịcha” are appropriate Standard Igbo choices. The plural “ha” appropriately preserves the Greek αὐτούς without adding an interpretive identification of the people unable to eat.
  issues:
  - severity: medium
    issue: “n’otu ụlọ” may add a numerical sense.
    rationale: The Greek has εἰς οἶκον, with no word for “one.” Although “otu” can sometimes support indefiniteness, it can also be read as the numeral; “n’ụlọ” more safely leaves the referent indefinite/unspecified as in the source.
  - severity: low
    issue: The main rendering omits the lexical reference to bread.
    rationale: μηδὲ ἄρτον φαγεῖν literally says “not even to eat bread.” “Iri nri” conveys the contextual sense, but “iri achịcha” in the text, with an idiomatic explanatory note, better serves optimal equivalence.
  revised_text: Jizọs wee bata n’ụlọ[a]. Ìgwè mmadụ ahụ gbakọtara ọzọ, nke mere na ha apụghịdị iri achịcha[b].
