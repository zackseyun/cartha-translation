  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: ig
  text: na Jemis, nwa Zebedi, na Jọn, nwanne nwoke Jemis (ọ kpọrọ ha aha[a] Boanerges, nke pụtara “Ụmụ Égbè Eluigwe”),
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, e dere “aha” n’ụdị ọtụtụ; o yikarịrị ka ọtụtụ ahụ na-arụkọ ọrụ ọnụ maka otu aha a kpọrọ ụmụnne abụọ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰάκωβον
  choice: Jemis
  rationale: Nke a bụ ụdị aha Ἰάκωβος a na-ejikarị eme ihe n’Igbo mgbe a na-ekwu maka onyeozi a; ọ na-ekewapụkwa ya n’ụdị aha Jekọb nke a na-ahụkarị n’Agba Ochie.
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: nwa Zebedi
  rationale: Ọ bụ ụzọ Igbo dị nkenke ma doo anya isi gosipụta na Jemis bụ nwa nwoke Zebedi, dịka usoro edemede Grik ahụ pụtara.
- source_word: Ἰωάννην
  choice: Jọn
  rationale: Jọn bụ ụdị aha Ἰωάννης a maara nke ọma n’Igbo.
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: nwanne Jemis
  rationale: N’ebe a, ἀδελφός na-ekwu maka nwanne nwoke si n’otu ezinụlọ; okwu Igbo “nwanne” na-enye nghọta ahụ n’ụzọ ebumpụta ụwa.
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: ọ gụrụ ha aha
  rationale: N’agbanyeghị na ἐπιτίθημι pụtara n’ụzọ nkịtị ‘itinye n’elu,’ ya na ‘aha’ ọ pụtara ịgụ mmadụ aha ma ọ bụ inye ya aha. “Ọ gụrụ ha aha” bụ okwu Igbo ebumpụta ụwa ma na-echekwa echiche ahụ.
- source_word: Βοανηργές
  choice: Boaneges
  rationale: E degharịrị aha a n’ụda mkpụrụedemede Igbo kama ịsụgharị ya, ebe ederede n’onwe ya nyere nkọwa ihe aha ahụ pụtara.
- source_word: ὅ ἐστιν
  choice: nke pụtara
  rationale: Nke a na-egosi nke ọma na okwu na-esote bụ nkọwa ma ọ bụ nsụgharị nke aha Semitik ahụ.
- source_word: Υἱοὶ Βροντῆς
  choice: Ụmụ Égbè Eluigwe
  rationale: “Ụmụ” na-echekwa ọtụtụ nke Υἱοί, ebe “Égbè Eluigwe” bụ ụzọ Igbo a na-ejikarị ekwu Βροντή, ya bụ ụda égbè eluigwe. Ọ na-echekwa ike na ọdịdị aha ahụ.
theological_decisions:
- issue: Otu e si depụta ma kọwaa aha Jemis na Jọn
  choice: Idowe aha ahụ dịka “Boaneges” ma kọwaa ya dịka “Ụmụ Égbè Eluigwe”
  alternative: Ịsụgharị naanị ihe aha ahụ pụtara ma hapụ “Boaneges”
  rationale: Ederede ahụ n’onwe ya debere ma aha asụsụ ọzọ ahụ ma nkọwa ya. Idebe ha abụọ na-echekwa nkọwa akụkọ ahụ n’enweghị itinye ozizi pụrụ iche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ usoro ahịrịokwu ka ọ gaa n’ihu site n’amaokwu bu ya ụzọ, dịka njikọ καί dị na mmalite si gosi. E tinyere akara nkọwa ụkwụ n’ebe okwu “aha” dị, n’ihi na ọ bụ ya ka nkọwa ahụ metụtara.
