  to: Mgbe ọ bụla ndị mmụọ na-adịghị ọcha hụrụ ya, ha na-ada n’ala n’ihu ya[a], na-eti mkpu, na-asị, “Ị bụ Ọkpara Chineke.”
  rationale: A single small revision removes the unsupported additive suffix in the rendering of κράζω. The rest of the draft accurately and naturally conveys the source text’s iterative narrative action, physical prostration, and confession.
