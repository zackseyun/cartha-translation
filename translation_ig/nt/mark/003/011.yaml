id: MRK.3.11
reference: Mark 3:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τὰ πνεύματα τὰ ἀκάθαρτα, ὅταν αὐτὸν ⸂ἐθεώρουν, προσέπιπτον⸃ αὐτῷ καὶ ⸀ἔκραζον ⸀λέγοντα ὅτι Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: ig
  text: Mgbe ọ bụla ndị mmụọ na-adịghị ọcha hụrụ ya, ha na-ada n’ala n’ihu ya[a], na-eti mkpu, na-asị, “Ị bụ Ọkpara Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha na-atụ onwe ha n’ala n’ihu ya.” Ngwaa Greek ahụ nwere ike ịpụta ịda n’ihu mmadụ n’ime nrube isi ma ọ bụ arịrịọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: ndị mmụọ na-adịghị ọcha
  rationale: Nke a na-edobe okwu e ji mara ụdị mmụọ ndị a n’Oziọma, ma ghara ịkọwa ἀκάθαρτα naanị dịka ‘ndị mmụọ ọjọọ.’
- source_word: ὅταν
  choice: mgbe ọ bụla
  rationale: 'Tinyere ngwaa ndị nọ n’ụdị imperfect, okwu a na-egosi ihe na-eme ugboro ugboro: oge ọ bụla ha hụrụ ya, ha na-eme otu ihe ahụ.'
- source_word: ἐθεώρουν
  choice: hụrụ
  rationale: N’akụkọ a, ‘hụrụ’ bụ okwu Igbo doro anya ma bụrụkwa nke nkịtị; echiche nke ime ugboro ugboro dịrịla na ‘mgbe ọ bụla.’
- source_word: προσέπιπτον αὐτῷ
  choice: ha na-ada n’ala n’ihu ya
  rationale: Nke a na-egosi omume anụ ahụ nke ịda n’ihu mmadụ, ma ọ naghị ekpebi na omume ahụ bụ ofufe.
- source_word: ἔκραζον
  choice: na-etisikwa mkpu
  rationale: Ọ na-egosi olu siri ike nke κράζω n’Igbo dị ugbu a, n’enweghị ime ka okwu ahụ bụrụ nke oke egwu karịa ihe ederede kwuru.
- source_word: λέγοντα
  choice: na-asị
  rationale: A sụgharịrị participle ahụ dịka omume na-eso iti mkpu n’ụzọ Igbo si aga nke ọma.
- source_word: Σὺ εἶ
  choice: Ị bụ
  rationale: Nnọchiaha Greek ahụ nwere nkwusi ike, ma ‘Ị bụ’ na-enye nkwupụta ahụ n’ụzọ Igbo doro anya ma dị ebube.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: Nke a bụ aha a maara nke ọma n’Igbo maka utu aha Kraịst a, ma na-edobe ibu nkà mmụta okpukpe dị n’okwu Greek ahụ.
theological_decisions:
- issue: Ma ịda n’ihu Jizọs ò kwesịrị ịsụgharị dịka ife ofufe ma ọ bụ dịka ịda n’ala n’ihu ya
  choice: ha na-ada n’ala n’ihu ya
  alternative: ha na-efe ya ofufe; ha na-ehulata n’ihu ya
  rationale: προσπίπτω nwere ike ịpụta ịda n’ihu mmadụ n’ihi nrube isi, arịrịọ, ma ọ bụ nkwanye ugwu. Amaokwu ahụ ekwughị hoo haa na ndị mmụọ ahụ fere ya ofufe, ya mere a hapụrụ esemokwu nkà mmụta okpukpe ahụ ka ihe gbara ya gburugburu kọwaa ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dị ùgwù. E ji usoro ‘mgbe ọ bụla ... ha na-’ gosipụta ihe na-eme ugboro ugboro. E zere ‘ife ofufe’ ka a ghara itinye nkọwa nkà mmụta okpukpe nke ederede ahụ ekwughị kpọmkwem.
