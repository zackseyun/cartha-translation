review_pass:
  verdict: revise
  source_fidelity: The draft faithfully represents the repeated setting of ὅταν with the imperfect verbs, the unclean spirits, their falling before Jesus, their cry, and their confession. “Ọkpara Chineke” appropriately preserves the titular “Son of God,” and the wording for falling does not overstate the act as worship.
  naturalness: The sentence is generally clear Standard Igbo. However, “na-etisikwa mkpu” contains the additive enclitic -kwa (“also”), for which the Greek supplies no counterpart. “na-eti mkpu” is the natural, direct expression here.
  terminology: “ndị mmụọ na-adịghị ọcha” retains the Gospel’s established terminology rather than reducing it to “evil spirits.” “Ọkpara Chineke” is a suitable established rendering of the christological title. The footnote responsibly preserves the possible stronger physical sense of προσπίπτω without assigning a motive.
  issues:
  - severity: low
    issue: Unwarranted additive force in “na-etisikwa mkpu.”
    rationale: The suffix -kwa adds “also/as well,” whereas καὶ ἔκραζον simply coordinates the crying with the preceding action. Removing it gives an idiomatic rendering without adding emphasis or meaning.
  revised_text: Mgbe ọ bụla ndị mmụọ na-adịghị ọcha hụrụ ya, ha na-ada n’ala n’ihu ya[a], na-eti mkpu, na-asị, “Ị bụ Ọkpara Chineke.”
