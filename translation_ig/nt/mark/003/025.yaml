  text: καὶ ἐὰν οἰκία ἐφ’ ἑαυτὴν μερισθῇ, οὐ ⸀δυνήσεται ⸂ἡ οἰκία ἐκείνη σταθῆναι⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: ig
  text: Ọ bụrụkwa na e kewaa ụlọ megide onwe ya, ụlọ ahụ agaghị enwe ike iguzo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκία
  choice: ụlọ
  rationale: “Ụlọ” na-ebute ihe oyiyi nke ụlọ a na-ahụ anya ma kwekọọ n'okwu “iguzo”; ma okwu Grik ahụ nwekwara ike ịpụta ezi na ụlọ.
- source_word: ἐφ’ ἑαυτὴν
  choice: megide onwe ya
  rationale: N'usoro okwu a, ọ na-egosi esemokwu dị n'ime ihe ahụ n'onwe ya.
- source_word: μερισθῇ
  choice: ekewa
  rationale: Nke a na-egosipụta ọnọdụ nke e kewara ụlọ ahụ, ya bụ nkewa dị n'ime ya.
- source_word: δυνήσεται
  choice: agaghị enwe ike
  rationale: Ọdịnihu nke δύναμαι na-egosi enweghị ike ga-esochi ọnọdụ ahụ.
- source_word: σταθῆναι
  choice: iguzo
  rationale: “Iguzo” na-echekwa ihe oyiyi nke ụlọ ma na-enye echiche nke ịnọgide ghara ịda.
- source_word: ἡ οἰκία ἐκείνη
  choice: ụlọ ahụ
  rationale: “Ahụ” na-egosipụta ike demonstrative nke ἐκείνη n'ụzọ Igbo si ekwu ya.
- source_word: καὶ ἐὰν
  choice: Ọ bụrụkwa na
  rationale: Usoro a na-echekwa ma njikọ καί (“kwa”) ma ọnọdụ ἐὰν (“ọ bụrụ na”).
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị mfe nghọta ma nwee ugwu. E debere ihe oyiyi nke ụlọ na-ada n'ihi nkewa dị n'ime ya, ebe ndetu ala peeji na-echekwa nkọwa ọzọ nke οἰκία dị ka ezi na ụlọ.
