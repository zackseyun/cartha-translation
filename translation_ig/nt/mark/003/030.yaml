  text: ὅτι ἔλεγον· Πνεῦμα ἀκάθαρτον ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/030.yaml
  text: because they were saying[a], “He has an unclean spirit.”
translation:
  language: ig
  text: N’ihi na ha nọ na-ekwu[a], “O nwere mmụọ na-adịghị ọcha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’okwu Igbo a na-asụkarị: “Mmụọ na-adịghị ọcha ejidela ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ọnọdụ a, ọ na-egosi ihe kpatara okwu ikpe ahụ Jizọs kwuru tupu ya; ‘n’ihi na’ na-eme ka njikọ ihe kpatara ya doo anya.
- source_word: ἔλεγον
  choice: ha nọ na-ekwu
  rationale: Oge imperfect n’asụsụ Grik na-egosi na ha nọgidere ma ọ bụ na-emegharị okwu a; ‘ha nọ na-ekwu’ na-echekwa echiche ahụ karịa ‘ha kwuru.’
- source_word: Πνεῦμα ἀκάθαρτον
  choice: mmụọ na-adịghị ọcha
  rationale: Nke a na-echekwa ihe okwu Grik pụtara ozugbo nakwa aha a na-eji akpọ mmụọ ọjọọ n’Oziọma, n’etinyeghị nkọwa ọzọ n’ahịrị bụ isi.
- source_word: ἔχει
  choice: O nwere
  rationale: Ngwaa Grik pụtara kpọmkwem ‘o nwere.’ Nhọrọ a na-echekwa usoro na ike ebubo ahụ, kama ịkọwa ya ozugbo dị ka ịbụ onye mmụọ ji.
theological_decisions:
- issue: Ụdị ebubo e boro Jizọs
  choice: “O nwere mmụọ na-adịghị ọcha.”
  alternative: “Mmụọ na-adịghị ọcha ejidela ya.”
  rationale: Ahịrị bụ isi na-edobe ebubo ahụ dịka e kwuru ya n’asụsụ Grik, na-agbanweghị ‘o nwere’ ka ọ bụrụ nkọwa doro anya karịa banyere mmụọ ijide mmadụ. Ihe ọzọ dị n’ala peeji na-enye okwu Igbo a na-asụkarị nke na-akọwa ihe ebubo ahụ pụtara.
translation_notes:
  register: Asụsụ Igbo zuru ụwa ọnụ, nke ugbu a, dị ùgwù ma dị mfe nghọta. ‘Ha nọ na-ekwu’ na-echekwa omume na-aga n’ihu ma ọ bụ a na-emegharị emegharị; ‘mmụọ na-adịghị ọcha’ na-echekwa okwu ọdịnala nke Oziọma na njikọ ya na ịdị ọcha.
