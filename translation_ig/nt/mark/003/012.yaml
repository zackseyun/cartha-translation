  text: καὶ πολλὰ ἐπετίμα αὐτοῖς ἵνα μὴ ⸂αὐτὸν φανερὸν⸃ ⸀ποιήσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/012.yaml
  text: And he sternly warned them many times not to make him known[a].
translation:
  language: ig
  text: Ọ dọrọ ha aka ná ntị ọtụtụ ugboro n’ụzọ siri ike ka ha ghara ime ka a mara ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka ha ghara ikpughe ya,” “ka ha ghara ime ka ọha mara ya,” ma ọ bụ, n’ụdị asụsụ dị elu karịa, “ka ha ghara ime ka ọ pụta ìhè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: ọtụtụ ugboro
  rationale: N’ebe a, okwu a na-arụ ọrụ dị ka nkwuwa okwu na-egosi na ịdọ aka ná ntị ahụ mere ugboro ugboro ma ọ bụ n’ike; “ọtụtụ ugboro” na-egosipụta akụkụ nke ugboro ugboro n’Igbo nkịtị.
- source_word: ἐπετίμα
  choice: dọkwara ha aka ná ntị ike
  rationale: Nhọrọ a na-egosipụta iwu siri ike Jizọs nyere mmụọ na-adịghị ọcha, ma na-ada nke ọma n’Igbo ugbu a karịa ntụgharị nkịtị nke nwere ike ịpụta naanị ịbara mba.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha ọtụtụ a na-ezo aka n’ụmụ mmụọ na-adịghị ọcha ndị a kpọtụrụ aha n’amaokwu ndị bu ụzọ.
- source_word: ἵνα μὴ
  choice: ka ha ghara
  rationale: Ọ na-egosipụta ihe iwu ahụ machibidoro ha ime, ma na-echekwa usoro ebumnuche/iwu nke Grik.
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: ime ka a mata onye ọ bụ
  rationale: Akpaokwu a na-egosi ime ka onye ahụ pụta ìhè ma ọ bụ ka ọha mara ya. Nhọrọ Igbo a bụ ihe okike ma na-egosipụta mkpughe banyere njirimara ya n’enweghị ịgbakwụnye aha nsọpụrụ nke amaokwu ahụ ekwughị.
theological_decisions:
- issue: Ụdị iwu Jizọs nyere mmụọ na-adịghị ọcha
  choice: A sụgharịrị ya dị ka mmachibido ime ka a mata onye Jizọs bụ, n’etinyeghị nkọwa ọzọ karịa ihe amaokwu ahụ kwuru.
  alternative: Ịkọwa ya kpọmkwem dị ka mmachibido ikwupụta na ọ bụ Ọkpara Chineke, ma ọ bụ dị ka iwu nkịtị ka ha mechie ọnụ n’enweghị ihe gbasara njirimara ya.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na okwu a metụtara njirimara Jizọs, ma amaokwu a n’onwe ya ekwughị aha nsọpụrụ ọ bụla. Ya mere, ntụgharị ahụ na-echekwa oke okwu na esemokwu dị n’ihe odide ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma doo ndị nkịtị anya. “Dọ aka ná ntị ike” na-egosipụta ịdị siri ike nke ἐπετίμα; “ime ka a mata onye ọ bụ” na-ezere okwu siri ike ma na-echekwa echiche nke ime ka njirimara ya pụta ìhè.
