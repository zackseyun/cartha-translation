    reason: lexical_alternative
  revision_rationale: The revision removes the added specification “onye ọ bụ,” preserving the broader wording of φανερὸν ποιέω while remaining natural in Standard Igbo. It also regularizes the forceful warning and improves the register description in the footnote.
