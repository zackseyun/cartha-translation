review_pass:
  verdict: revise
  source_fidelity: 'Ederede ahụ na-egosipụta ihe Grik kwuru nke ọma n’ozuzu ya: γραμματεῖς, mmegharị ha si Jerusalem rịdata, oge omume na-aga n’ihu nke ἔλεγον, ilu «Βεελζεβοὺλ ἔχει», na ebubo na ọ na-achụpụ ndị mmụọ ọjọọ n’aka onye na-achị ha. Otú ọ dị, nhazi mbụ nke «Ndị odeakwụkwọ ahụ si Jeruselem rịdata nọ na-ekwu» adịghị edo anya nke ọma banyere ndị rịdatara; «ndị si Jerusalem rịdata» kwesịrị ịkọwa «ndị odeakwụkwọ». «Site n’aka» na-enye ἐν n’echiche ngwaọrụ/ikike n’enweghị itinye «ike» nke na-adịghị kpọmkwem n’asụsụ Grik.'
  naturalness: '«Ndị odeakwụkwọ ndị si Jerusalem rịdata nọ na-ekwu» bụ Standard Igbo dị mfe ma doo anya karịa nhazi mbụ. A hazikwara akụkụ nke abụọ ka ọ na-ada n’Igbo nkịtị: «Ọ bụ site n’aka onye na-achị ndị mmụọ ọjọọ ka ọ na-achụpụ ndị mmụọ ọjọọ.»'
  terminology: «Ndị odeakwụkwọ», «Beelzebul», «ndị mmụọ ọjọọ», na «na-achụpụ» dabara adaba. A gbanwere «Jeruselem» ka ọ bụrụ «Jerusalem», nke bụ nsupe a na-ahụkarị n’Standard Igbo. A hapụrụ «O nwere Beelzebul» n’ahịrị bụ isi iji chekwaa ilu Grik ahụ; ala peeji na-akọwa ya n’enweghị ịmanye nkọwa okpukpe.
  issues:
  - severity: medium
    issue: Nhazi nkebi ahịrịokwu banyere ndị si Jerusalem rịdata
    rationale: N’ederede mbụ, «Ndị odeakwụkwọ ahụ si Jeruselem rịdata nọ na-ekwu» nwere ike ịda ka «si Jerusalem» na «rịdata» bụ naanị nkọwa omume na-adịghị ejikọta nke ọma na «ndị odeakwụkwọ». Ịtinye «ndị» n’azụ «Ndị odeakwụkwọ» na-eme ka o doo anya na ha bụ ndị si Jerusalem rịdata, dịka participle Grik si dị.
  - severity: low
    issue: Nsụpe aha obodo
    rationale: «Jerusalem» bụ nsupe Standard Igbo a na-ahụkarị karịa «Jeruselem».
  - severity: low
    issue: «site n’ike» na-agbakwunye echiche ‘ike’
    rationale: Ọ bụ nghọta kwere omume nke ἐν n’ebe a, ma «site n’aka» na-egosipụta ngwaọrụ ma ọ bụ ikike onye ọchịchị ahụ n’ụzọ dị nso karịa, n’enweghị mgbakwunye okwu «ike».
