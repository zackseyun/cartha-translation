  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: ig
  text: Ndị odeakwụkwọ ndị si Jerusalem rịdata nọ na-ekwu[a] sị, “O nwere Beelzebul,”[b] na sị, “Ọ bụ site n’aka onye na-achị ndị mmụọ ọjọọ[c] ka ọ na-achụpụ ndị mmụọ ọjọọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nọgidere na-ekwu.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ doro anya karị, “Beelzebul bi n’ime ya,” ma ọ bụ, “Beelzebul ejidela ya.” A na-akpọkwa Beelzebul “Beelzebub” n’ọdịnala.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “onyeisi ndị mmụọ ọjọọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị ọkachamara n’Iwu ndị Juu n’akụkọ Oziọma; n’ebe a ọ pụtaghị naanị ndị na-edepụtagharị akwụkwọ.
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: ndị ... si Jeruselem rịdata
  rationale: Nkebi ahịrịokwu a na-edobe echiche mmegharị ahụ, ‘ịrịdata,’ ma na-ada ka Igbo nkịtị.
- source_word: ἔλεγον
  choice: nọ na-ekwu
  rationale: Ọ na-egosipụta omume gara n’ihu ma ọ bụ okwu ha na-ekwughachi, dịka imperfect Grik si dị.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: A sụgharịghị aha ahụ kama e depụtara ya dịka ọdịdị Grik Βεελζεβούλ si dị; a debere ‘Beelzebub’ n’ala peeji dịka ọdịdị ọdịnala.
- source_word: ἔχει
  choice: o nwere
  rationale: Nke a na-edobe okwu Grik ahụ kpọmkwem ma ghara itinye nkọwa ‘ọ nọ n’okpuru mmụọ ya’ ozugbo n’ahịrị bụ isi.
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: site n’ike onye na-achị ndị mmụọ ọjọọ
  rationale: ἐν nwere nghọta nke ngwa ma ọ bụ ike e ji eme ihe n’ebe a. ‘Site n’ike’ na-eme ka ebubo ahụ doo anya n’Igbo, ebe ‘onye na-achị’ na-egosipụta ἄρχων n’asụsụ nke oge a.
- source_word: δαιμονίων / δαιμόνια
  choice: ndị mmụọ ọjọọ
  rationale: Nke a bụ ụzọ Igbo doro anya na nke a na-aghọta nke ọma isi kwuo ‘demons,’ n’enweghị ịgbanwe ya ka ọ bụrụ okwu Grik ọzọ, ‘mmụọ na-adịghị ọcha.’
- source_word: ἐκβάλλει
  choice: na-achụpụ
  rationale: Ọ na-egosipụta ịchụ ndị mmụọ ọjọọ pụọ n’ụzọ doro anya ma dịkwa n’Igbo nkịtị.
theological_decisions:
- issue: Nsụgharị ebubo Βεελζεβοὺλ ἔχει
  choice: O nwere Beelzebul
  alternative: Beelzebul bi n’ime ya / Beelzebul ejidela ya
  rationale: Ahịrị bụ isi na-edobe ilu Grik ahụ na mgbagwoju anya ya. Ihe ọ pụtara n’ọnọdụ a—na Beelzebul na-achị ya ma ọ bụ bi n’ime ya—dị n’ala peeji kama itinye ya n’ime ederede dịka naanị nghọta kwere omume.
- issue: Nsụgharị ἄρχων
  choice: onye na-achị ndị mmụọ ọjọọ
  alternative: onyeisi ndị mmụọ ọjọọ
  rationale: ‘Onye na-achị’ na-egosipụta ikike ọchịchị nke okwu Grik ahụ n'ụzọ doro anya; ‘onyeisi’ bụkwa ụzọ dị mkpirikpi ma ziri ezi, ya mere e debere ya n’ala peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ilu ‘O nwere Beelzebul’ n’ahịrị bụ isi iji chekwaa ọdịdị na mgbagwoju anya nke Grik, ma kọwaa nghọta ya n’ala peeji. E tinyere akara ala peeji niile [a], [b], na [c] n’ederede bụ isi.
