revisions:
- from: Ndị odeakwụkwọ ahụ si Jeruselem rịdata nọ na-ekwu[a] sị, “O nwere Beelzebul,”[b] nakwa sị, “Ọ bụ site n’ike onye na-achị ndị mmụọ ọjọọ[c] ka ọ ji achụpụ ndị mmụọ ọjọọ.”
  to: Ndị odeakwụkwọ ndị si Jerusalem rịdata nọ na-ekwu[a] sị, “O nwere Beelzebul,”[b] na sị, “Ọ bụ site n’aka onye na-achị ndị mmụọ ọjọọ[c] ka ọ na-achụpụ ndị mmụọ ọjọọ.”
  rationale: E degharịrị ahịrị ahụ iji mee ka mmekọrịta participle «ndị si Jerusalem rịdata» na «ndị odeakwụkwọ» pụta ìhè ma mee ka ahịrị ahụ bụrụ Standard Igbo na-aga nke ọma. E mekwara nsụpe «Jerusalem» ka ọ kwekọọ n’ọrụ Igbo a na-ahụkarị, ma dochie «site n’ike» anya na «site n’aka» ka nsụgharị ahụ ghara ịgbakwunye echiche na-adịghị n’ederede Grik. Ihe pụtara na nkọwa okpukpe na-anọgide n’ala peeji, ebe ahịrị bụ isi na-echekwa ilu «O nwere Beelzebul».
