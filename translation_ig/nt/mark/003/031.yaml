id: MRK.3.31
reference: Mark 3:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂Καὶ ἔρχονται⸃ ⸂ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ⸃ καὶ ἔξω ⸀στήκοντες ἀπέστειλαν πρὸς αὐτὸν ⸀καλοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: ig
  text: Mgbe ahụ, nne ya na ụmụnne ya ndị nwoke bịara; ha guzoro n’èzí, zigaara ya ozi, na-akpọ ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Mgbe ahụ
  rationale: Καί na-eme ka akụkọ gaa n'ihu; “Mgbe ahụ” bụ ụzọ Igbo dị eke isi gosi usoro ihe mere.
- source_word: ἔρχονται
  choice: bịara
  rationale: Ọ bụ historical present n'Akụkụ Grik a; oge gara aga dabara n'usoro akụkọ Igbo.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: nne ya
  rationale: Ntụgharị kpọmkwem nke njikọ nwe.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ụmụnne ya ndị nwoke
  rationale: ἀδελφοί bụ ọtụtụ nwoke; mgbakwunye “ndị nwoke” na-eme ka ihe Grik kwuru doo anya n'Igbo, ebe “ụmụnne” naanị ya nwere ike ịgụnye nwoke na nwanyị.
- source_word: ἔξω στήκοντες
  choice: Ka ha guzo n'èzí
  rationale: Na-egosi ọnọdụ ha nọ na ya mgbe ha zigara ozi ahụ.
- source_word: ἀπέστειλαν πρὸς αὐτὸν
  choice: ha zigara ya ozi
  rationale: N'ọnọdụ a, okwu ahụ pụtara izigara mmadụ ozi ma ọ bụ onye ozi, ọ bụghị nanị iziga ihe a na-akọwaghị.
- source_word: καλοῦντες αὐτόν
  choice: na-akpọ ya ka ọ bịakwute ha
  rationale: 'Na-egosi ebumnuche oku ahụ n''Igbo eke: ha chọrọ ka ọ pụta bịakwute ha.'
theological_decisions:
- issue: Ihe “ụmụnne ya ndị nwoke” na-ezo aka na ya
  choice: E depụtara ya dị ka “ụmụnne ya ndị nwoke” n'enweghị nkọwa ọzọ banyere ụdị mmekọrịta ezinụlọ ha.
  alternative: Ịkọwa ha dị ka ụmụ otu nne na nna, ma ọ bụ dị ka ndị ikwu sara mbara.
  rationale: ἀδελφοί n'onwe ya pụtara ụmụnne nwoke, ma amaokwu a anaghị akọwa kpọmkwem ụdị mmekọrịta ahụ; ya mere, ntụgharị ahụ ekwesịghị idozi esemokwu ọdịnala n'ime ederede.
translation_notes:
  register: Igbo Izugbe dị ugbu a, kwụ ọtọ ma nwee nsọpụrụ. E kewara ahịrịokwu ahụ ụzọ abụọ ka ọ gụọ nke ọma, ma e chekwara usoro omume na njikọ echiche nke Grik.
