review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the causal connection, Jesus’ prior healing of many, the resultant crowd action, and their purpose of touching him. However, “na-enupụso ya” means ‘rebel/rise up against him’ in Standard Igbo and does not render ἐπιπίπτειν in this crowd context. The phrase “ọrịa na ahụhụ” also unnecessarily coordinates ‘disease’ with ‘affliction,’ whereas μάστιγας is broad and figurative here; “ahụhụ” preserves that breadth better.
  naturalness: The revised wording is clear, idiomatic Standard Igbo, and retains the physical force of the crowd’s movement without suggesting hostility or rebellion.
  terminology: “na-adakwasị ya” appropriately reflects the force of ἐπιπίπτειν (‘falling/rushing upon him’) in context. “ahụhụ” is a suitably broad rendering of μάστιγας; the footnote preserves ‘ọrịa,’ ‘ihe otiti,’ and the literal ‘ụtarị’ as alternatives.
  issues:
  - severity: high
    issue: “na-enupụso ya” is semantically incorrect for ἐπιπίπτειν αὐτῷ.
    rationale: In Standard Igbo, ịnupụ isi/ịnupụ mmadụ isi or na-enupụso mmadụ denotes rebellion or defiance. The Greek describes sufferers physically surging or falling upon Jesus in an effort to touch him.
  - severity: medium
    issue: “ọrịa na ahụhụ” over-specifies μάστιγας by presenting disease and affliction as two coordinated referents.
    rationale: In this healing context μάστιγας figuratively denotes grievous afflictions/maladies. “ahụhụ” keeps the term broad without adding a separate diagnostic category.
  - severity: low
    issue: Footnote a repeats the corrected main-text rendering in the draft’s proposed alternative.
    rationale: Once “na-adakwasị ya” is used in the main text, the footnote should offer a genuine idiomatic alternative while explaining the literal force.
  revised_text: N’ihi na ọ gwọla ọtụtụ mmadụ, nke mere na ndị niile nwere ahụhụ[b] na-adakwasị ya[a] ka ha metụ ya aka.
