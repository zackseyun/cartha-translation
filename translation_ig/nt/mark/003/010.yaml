revisions:
- from: N’ihi na ọ gwọla ọtụtụ mmadụ, nke mere na ndị niile nwere ọrịa na ahụhụ na-enupụso ya ka ha metụ ya aka.[a][b]
  to: N’ihi na ọ gwọla ọtụtụ mmadụ, nke mere na ndị niile nwere ahụhụ[b] na-adakwasị ya[a] ka ha metụ ya aka.
  rationale: The revision replaces a false sense of rebellion with a natural, forceful description of people falling or surging upon Jesus. It simplifies the rendering of μάστιγας to the broader “ahụhụ,” preserving the source’s figurative ambiguity, and relocates the footnote anchors to their relevant expressions.
