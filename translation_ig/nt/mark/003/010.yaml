  text: πολλοὺς γὰρ ἐθεράπευσεν, ὥστε ἐπιπίπτειν αὐτῷ ἵνα αὐτοῦ ἅψωνται ὅσοι εἶχον μάστιγας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: ig
  text: N’ihi na ọ gwọla ọtụtụ mmadụ, nke mere na ndị niile nwere ahụhụ[b] na-adakwasị ya[a] ka ha metụ ya aka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-asọkwuru ya n’ìgwè”; okwu Grik ahụ n’ụzọ nkịtị bụ “na-adakwasị ya,” na-egosi ndị mmadụ na-eji ike abịakwute ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nwere ọrịa” ma ọ bụ “nwere ihe otiti”; okwu Grik ahụ pụrụ ịpụta ahụhụ siri ike, ma n’ụzọ nkịtị ọ bụ “ụtarị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: ọtụtụ mmadụ
  rationale: Ọ bụ ihe nnara nke ἐθεράπευσεν; itinye “mmadụ” na-eme ka Igbo doo anya ma ghara ịgbakwunye echiche ọhụrụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-enye ihe kpatara ọnọdụ ìgwè mmadụ ahụ e kwuru n’akụkọ gbara ya gburugburu.
- source_word: ἐθεράπευσεν
  choice: ọ gwọla
  rationale: Aorist a na-ezo aka n’ọrụ ọgwụgwọ mere tupu mmeghachi omume ìgwè mmadụ a; ụdị a na-egosi ọnọdụ sitere n’ihe o merela.
- source_word: ὥστε
  choice: nke mere na
  rationale: Ọ na-egosi ihe si n’ịgwọ ọtụtụ mmadụ pụta.
- source_word: ἐπιπίπτειν αὐτῷ
  choice: na-enupụso ya
  rationale: Ọ na-egosipụta ìgwè mmadụ ji ike na-asọkwuru ya ma na-abịakwasị ya, kama ịsụgharị ya n’ụzọ nkịtị nke ga-adị arọ n’Igbo.
- source_word: ἵνα
  choice: ka
  rationale: Ọ na-egosi ebumnuche ha ji enupụso ya.
- source_word: αὐτοῦ ἅψωνται
  choice: ha metụ ya aka
  rationale: ἅπτομαι na genitive pụtara imetụ mmadụ aka n’anụ ahụ; nke a bụkwa ihe ọnọdụ ọgwụgwọ ahụ chọrọ.
- source_word: ὅσοι
  choice: ndị niile
  rationale: Ọ na-echekwa ike zuru ezu nke okwu ikwu banyere ndị niile so n’ìgwè ahụ nwere ahụhụ.
- source_word: εἶχον μάστιγας
  choice: nwere ọrịa na ahụhụ
  rationale: μάστιξ bụ ‘ụtarị’ n’ụzọ nkịtị, ma ebe a ọ na-arụ ọrụ ihe atụ maka ọrịa ma ọ bụ ahụhụ siri ike; okwu abụọ a na-edobe obosara ya n’Igbo.
theological_decisions:
- issue: Ụdị μάστιγας n’ọnọdụ ọgwụgwọ a
  choice: ọrịa na ahụhụ
  alternative: ọrịa; ihe otiti; ụtarị
  rationale: Nhọrọ a anaghị egbochi okwu ahụ n’ọrịa ahụ nkịtị naanị, ma na-edobe ịdị arọ nke ahụhụ ahụ n’enweghị ịtụgharị ihe atụ ‘ụtarị’ ka ọ bụrụ ihe nkịtị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Na-enupụso ya” na-egosi mmegharị ìgwè mmadụ ji ike; “ọrịa na ahụhụ” na-echekwa obosara na ịdị arọ nke μάστιγας.
