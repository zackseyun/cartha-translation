id: MRK.3.5
reference: Mark 3:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: ig
  text: Mgbe o legharịrị ha niile anya n’iwe, obi wutere ya n’ihi isi ike nke obi ha[a], ọ sịrị nwoke ahụ, “Setịa aka gị.” O setịrị aka ya, aka ya wee dịghachi ka ọ dị na mbụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “isi ike nke obi onye ọ bụla n’ime ha.” N’asụsụ Grik, okwu a sụgharịrị “obi” dị n’otu ọnụ, ma eleghị anya e ji ya mee okwu mkpokọta.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: Mgbe o legharịrị ha niile anya
  rationale: Aorist participle ahụ na-egosi ihe mere tupu ngwaa bụ́ isi; nkebi a na-enye echiche nke ile ndị nọ gburugburu ya anya n’usoro Igbo dị nfe.
- source_word: μετ’ ὀργῆς
  choice: n’iwe
  rationale: Na-egosipụta iwe so ụzọ o si lee ha anya, n’enweghị ime ka ike okwu ahụ daa.
- source_word: συλλυπούμενος
  choice: obi wutere ya
  rationale: Nke a bụ ụzọ Igbo nkịtị ma dị ùgwù si egosipụta mwute ma ọ bụ ihe mgbu dị n’obi.
- source_word: ἐπὶ τῇ πωρώσει
  choice: n’ihi isi ike
  rationale: ἐπί na dative ebe a na-egosi ihe kpatara mwute; ‘isi ike’ na-edobe ihe atụ nke πώρωσις.
- source_word: τῆς καρδίας αὐτῶν
  choice: nke obi ha
  rationale: A hapụrụ ‘obi’ n’otu dịka Greek si dị, ebe ‘ha’ na-egosi na ọ bụ ọnọdụ jikọrọ ndị ahụ ọnụ.
- source_word: λέγει
  choice: ọ sịrị
  rationale: Ọ bụ ezie na Greek ji historical present, Igbo akụkọ okike na-ejikarị oge gara aga; ‘ọ sịrị’ na-eme ka akụkọ ahụ maa mma ma doo anya.
- source_word: τῷ ἀνθρώπῳ
  choice: nwoke ahụ
  rationale: Ọ na-ezo aka kpọmkwem n’otu nwoke ahụ e kwuru banyere ya n’akụkọ ahụ.
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: Setịa aka gị
  rationale: Iwu a na-egosi ime ka aka pụta ma ọ bụ gbatịa ya; ‘setịa’ bụ okwu Igbo doro anya n’ọnọdụ a.
- source_word: ἐξέτεινεν
  choice: O setịkwara ya
  rationale: Na-emegharị ngwaa e ji nye iwu dịka Greek si eme, ebe ‘ya’ na-ezo anya n’aka ahụ.
- source_word: ἀπεκατεστάθη
  choice: aka ya wee laghachi dị ka ọ dị na mbụ
  rationale: Na-egosipụta mweghachi n’ọnọdụ kwesịrị ekwesị ma ọ bụ nke mbụ, karịa nanị iji okwu izugbe maka ọgwụgwọ.
theological_decisions:
- issue: Iwe na mwute Jizọs
  choice: 'E gosipụtara ha abụọ hoo haa: ‘n’iwe’ na ‘obi wutere ya.’'
  alternative: Ime ka iwe ahụ dị nro site n’ịsụgharị ya dịka naanị iwe n’ihi ajọ omume, ma ọ bụ ịgbasa mwute ahụ karịa ihe Greek kwuru.
  rationale: Ihe odide ahụ jikọtara iwe na mwute Jizọs; nsụgharị ahụ ekwesịghị izochi ma ọ bụ belata nke ọ bụla.
- issue: ‘Obi’ n’otu ọnụ na nnọchiaha ọtụtụ
  choice: ‘isi ike nke obi ha’
  alternative: ‘isi ike nke obi ndị ahụ’ ma ọ bụ ‘isi ike nke obi ha niile’
  rationale: Nke a na-edobe otu ọnụ καρδίας na ọtụtụ αὐτῶν, ya bụ, obi dịka okwu mkpokọta, n’agbanyeghị na Igbo nwekwara ike ịghọta ya dịka obi onye ọ bụla.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ usoro akụkọ Igbo eke, ma debe ihe atụ ‘isi ike nke obi’ na esemokwu dị n’etiti iwe na mwute.
