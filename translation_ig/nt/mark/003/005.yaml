revisions:
- from: Mgbe o legharịrị ha niile anya n’iwe, obi wutere ya n’ihi isi ike nke obi ha[a], ọ sịrị nwoke ahụ, “Setịa aka gị.” O setịkwara ya, aka ya wee laghachi dị ka ọ dị na mbụ.
  to: Mgbe o legharịrị ha niile anya n’iwe, obi wutere ya n’ihi isi ike nke obi ha[a], ọ sịrị nwoke ahụ, “Setịa aka gị.” O setịrị aka ya, aka ya wee dịghachi ka ọ dị na mbụ.
  rationale: The revision clarifies that the man extended his hand, improves the idiom for the hand’s restoration, and replaces the footnote with a genuine, non-doctrinal distributive alternative while preserving the Greek ambiguity.
  reviewer_model: gpt-5.6-terra
