id: MRK.3.24
reference: Mark 3:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: ig
  text: Ọ bụrụkwa na alaeze ekewaa megide onwe ya, alaeze ahụ agaghị enwe ike iguzosi ike.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: -kwa
  rationale: Akụkụ mgbakwunye “-kwa” na-ejikọta okwu a n'ụzọ doro anya na arụmụka bu ya ụzọ, ma na-ada nke ọma n'Igbo.
- source_word: ἐὰν
  choice: ọ bụrụ na
  rationale: Nke a na-egosi ọnọdụ nwere ike ime, kwekọọkwa na ngwaa subjunctive nke Grik.
- source_word: βασιλεία
  choice: alaeze
  rationale: “Alaeze” na-echekwa ihe atụ nke otu obodo ma ọ bụ ọchịchị dị ka otu ahụ, kama ime ka ọ bụrụ naanị omume ịchị achị.
- source_word: ἐφ’ ἑαυτὴν
  choice: megide onwe ya
  rationale: N'ọnọdụ a, akpaalaokwu Grik ahụ pụtara esemokwu dị n'ime otu ahụ megide onwe ya.
- source_word: μερισθῇ
  choice: ekewa
  rationale: Nke a na-echekwa ụda nnara nke ngwaa Grik ma ghara ịkọ onye ma ọ bụ ihe kpatara nkewa ahụ.
- source_word: οὐ δύναται
  choice: agaghị enwe ike
  rationale: Nke a na-egosipụta enweghị ike n'ụzọ nkịtị ma doo anya n'Igbo.
- source_word: σταθῆναι
  choice: iguzosi ike
  rationale: “Iguzosi ike” na-echekwa ihe atụ nke iguzo ma na-egosikwa ịnọgide adị ma ọ bụ ghara ịda.
- source_word: ἡ βασιλεία ἐκείνη
  choice: alaeze ahụ
  rationale: Nkwughachi aha ahụ na nnọchiaha ngosi na-echekwa nkwusi ike nke Grik n'Igbo dị mfe.
theological_decisions:
- issue: Ụdị na oke okwu a
  choice: Ịsụgharị ya dịka ụkpụrụ izugbe dị n'ime arụmụka Jizọs, n'etinyeghị nkọwa ozizi ọzọ.
  alternative: Ịkọwa ya dịka ilu sara mbara banyere ọchịchị niile ma ọ bụ tinye ozizi ọzọ banyere Setan.
  rationale: Amaokwu ahụ ji ihe atụ kwado nzaghachi Jizọs; nsụgharị ahụ kwesịrị idobe ike okwu ahụ n'agbasaghị ihe ọ na-ekwu karịa ederede ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu. Ahịrịokwu ahụ na-echekwa usoro ọnọdụ, nkwughachi “alaeze,” na ihe atụ nke “iguzosi ike,” n'enweghị okwu ụka pụrụ iche.
