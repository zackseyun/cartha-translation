  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: ig
  text: O wee sị ha, “Ọ̀ bụ ihe iwu kwadoro ime ihe ọma n’Ụbọchị Izu Ike[a], ka ime ihe ọjọọ; ịzọpụta ndụ, ka igbu mmadụ?” Ma ha gbara nkịtị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, e ji ọtụtụ mee okwu “Ụbọchị Izu Ike” n’ebe a, ma nke a bụ akpaala okwu a na-ejikarị akọwa otu Ụbọchị Izu Ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔξεστιν
  choice: Ọ̀ bụ ihe iwu kwadoro
  rationale: N’ajụjụ gbasara idebe Ụbọchị Izu Ike, okwu a na-ajụ ihe iwu kwere; nsụgharị a na-egosipụta ike iwu na omenala dị na okwu Grik ahụ.
- source_word: τοῖς σάββασιν
  choice: n’Ụbọchị Izu Ike
  rationale: Ọ bụ ezie na Grik jiri ọtụtụ mee okwu a, ọ bụ akpaala okwu a na-ejikarị akọwa Ụbọchị Izu Ike; otu n’Igbo bụ nke sitere n’okike ma kwekọọ n’ihe na-eme n’ebe a.
- source_word: ἀγαθοποιῆσαι
  choice: ime ihe ọma
  rationale: Nke a na-egosipụta omume bara uru ma na-edobe ọdịdị ngwaa nke okwu Grik.
- source_word: κακοποιῆσαι
  choice: ime ihe ọjọọ
  rationale: Okwu Grik ahụ nwere ike ịpụta ime ihe ọjọọ ma ọ bụ ihe na-emerụ mmadụ; “ime ihe ọjọọ” na-edobe obosara na ịdị arọ nke ntụnyere omume ahụ.
- source_word: ψυχὴν σῶσαι
  choice: ịzọpụta ndụ
  rationale: N’ebe a ψυχή pụtara ndụ mmadụ n’ihi na e tinyere ya megide igbu mmadụ; ọ bụghị mkpụrụobi a na-ekwu kpọmkwem.
- source_word: ἀποκτεῖναι
  choice: igbu mmadụ
  rationale: Nke a na-enye isi ihe okwu Grik pụtara n’enweghị ịgbakwunye echiche pụrụ iche nke igbu ọchụ megidere iwu.
- source_word: ἐσιώπων
  choice: ha gbara nkịtị
  rationale: Oge imperfect na-egosi na ha nọgidere na-agbachi nkịtị; akpaala okwu Igbo a na-enye nzaghachi ahụ n’ụzọ doro anya ma sitere n’okike.
theological_decisions:
- issue: Akpaala okwu Grik banyere Ụbọchị Izu Ike n’ajụjụ gbasara iwu
  choice: 'Jiri otu: “n’Ụbọchị Izu Ike”'
  alternative: “n’Ụbọchị Izu Ike dị iche iche” ma ọ bụ ọtụtụ kpọmkwem
  rationale: Ọtụtụ dị na Grik bụ akpaala okwu Koine, ebe ihe gbara amaokwu ahụ gburugburu na-ekwu banyere otu Ụbọchị Izu Ike ahụ. Iji otu n’Igbo na-egbochi nghọtahie ma ghara ịgbanwe ihe okwu ahụ pụtara.
- issue: Ụdị ihe ọjọọ dị na κακοποιῆσαι
  choice: “ime ihe ọjọọ”
  alternative: “ime ihe na-emerụ mmadụ”
  rationale: “Ime ihe ọjọọ” na-edobe esemokwu omume dị n’etiti ihe ọma na ihe ọjọọ, ebe ahịrị na-esote—ịzọpụta ndụ ma ọ bụ igbu mmadụ—na-eme ka akụkụ mmerụ ahụ doo anya.
translation_notes:
  register: Asụsụ Igbo Standard dị ugbu a, dị ugwu ma dị mfe nghọta. E tinyere akara ntụaka [a] n’isiokwu mgbe ahịrịokwu ahụ gasịrị ka ọ ghara ịkwụsị ajụjụ Jizọs; nkọwa ahụ metụtara okwu “Ụbọchị Izu Ike.”
