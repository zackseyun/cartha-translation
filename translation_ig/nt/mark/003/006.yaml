  rationale: Only the rendering of the named group has been revised. “Ndị Herọd” more faithfully represents the Herodians as a recognized designation, while the remainder of the draft is retained because it is source-faithful, idiomatic, and preserves the Greek verb’s contextual breadth and the footnote anchor.
