  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ Φαρισαῖοι ⸀εὐθὺς μετὰ τῶν Ἡρῳδιανῶν συμβούλιον ⸀ἐδίδουν κατ’ αὐτοῦ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: ig
  text: Ndị Farisii wee pụọ, ozugbo ahụ ha na ndị Herọd malitere ịgba izu megide ya, ka ha ga-esi bibie ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka ọnọdụ a si mee ka ọ pụta ìhè karị, “gbuo ya” ma ọ bụ “mee ka e gbuo ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: wee pụọ
  rationale: Aorist participle ahụ na-egosi ihe sochiri ihe gara aga n’akụkọ ahụ; “wee pụọ” bụ ụzọ Igbo sitere n’okike si jikọta omume ahụ n’usoro akụkọ.
- source_word: εὐθὺς
  choice: ozugbo ahụ
  rationale: Nke a na-edobe ọsọ na ngwa ngwa e ji akọ akụkọ Mak.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: ha na ndị otu Herọd
  rationale: μετά na genitive na-egosi mmekọrịta; “ndị otu Herọd” na-akọwa ìgwè ahụ n’ụzọ onye Igbo nke oge a ga-aghọta, n’enweghị ịgbakwunye nkọwa ndọrọ ndọrọ ọchịchị na-adịghị n’amaokwu ahụ.
- source_word: συμβούλιον ἐδίδουν
  choice: malitere ịgba izu
  rationale: Akpaokwu Grik ahụ pụtara ịgba ndụmọdụ ma ọ bụ ime atụmatụ; ebumnuche ọjọọ dị n’amaokwu a na-eme ka “ịgba izu” dabara, ebe “malitere” na-egosipụta imperfect ἐδίδουν dị ka mmalite nke omume na-aga n’ihu.
- source_word: κατ’ αὐτοῦ
  choice: megide ya
  rationale: κατά na genitive nwere nghọta nke iro n’ebe a, ọ bụghị naanị ikwu banyere onye ahụ.
- source_word: ὅπως
  choice: ka ha ga-esi
  rationale: Nke a na-egosipụta ma ntụgharị uche banyere ụzọ ha ga-eji mee ya ma ebumnuche atụmatụ ahụ, dịka ὅπως na subjunctive si arụ ọrụ n’ebe a.
- source_word: ἀπολέσωσιν
  choice: bibie ya
  rationale: ἀπόλλυμι nwere ike ịpụta ibibi, ime ka ihe laa n’iyi, ma ọ bụ igbu; “bibie ya” na-edobe obosara okwu Grik ahụ, ebe ọnọdụ a na-egosi na ọnwụ bụ ihe a na-atụ anya ya.
theological_decisions:
- issue: Ma a ga-ekwu kpọmkwem n’ahịrị bụ isi na ndị isi ahụ chọrọ igbu Jizọs
  choice: Jiri okwu sara mbara bụ “bibie ya” n’ahịrị bụ isi.
  alternative: “gbuo ya” ma ọ bụ “mee ka e gbuo ya”
  rationale: ἀπόλλυμι sara mbara karịa naanị okwu pụtara igbu mmadụ, ọ bụ ezie na n’ọnọdụ a atụmatụ ahụ doro anya na ọ na-eche ọnwụ Jizọs ihu. Nsụgharị a na-edobe esemokwu na obosara okwu mbụ ahụ, ebe nkọwa ala peeji na-egosi ihe ọ pụtara kpọmkwem n’ọnọdụ a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, mee ihe. “Ịgba izu” na-egosi ndụmọdụ nzuzo nwere ebumnuche ọjọọ; “ndị otu Herọd” na-ezere transliteration siri ike ma na-anọgide na-akọwa otu ndị ahụ nkenke.
