  text: καὶ ἔχειν ⸀ἐξουσίαν ἐκβάλλειν τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/015.yaml
  text: and to have authority to cast out demons[a].
translation:
  language: ig
  text: ka ha nwekwaa ikike ịchụpụ ndị mmụọ ọjọọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịchụ ndị mmụọ ọjọọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -kwaa
  rationale: E ji mgbakwụnye “-kwaa” jikọta nkebi a na ọrụ ndị e kwuru n’ihu, n’ụzọ na-ada nke ọma n’Igbo.
- source_word: ἔχειν
  choice: ka ha nwee
  rationale: N’usoro ahịrịokwu a, infinitive ahụ na-egosi ihe Jizọs họpụtara ha ka ha nwee; “ka ha nwee” bụ Igbo doro anya ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: ἐξουσίαν
  choice: ikike
  rationale: “Ikike” na-egosi ikike e nyere mmadụ ime ihe, ọ bụghị naanị ike nkịtị; nke a dabara n’ọrụ Jizọs nyere ndị ahụ.
- source_word: ἐκβάλλειν
  choice: ịchụpụ
  rationale: “Ịchụpụ” na-egosi ime ka ndị mmụọ ọjọọ pụọ, ma chekwaa ike okwu Grik ahụ n’ọnọdụ a.
- source_word: τὰ δαιμόνια
  choice: ndị mmụọ ọjọọ
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kpọọ demons; ọ naghị agbanwe ya ka ọ bụrụ okwu ọzọ dị ka “mmụọ na-adịghị ọcha.”
theological_decisions:
- issue: Ụdị ἐξουσία dị n’ọrụ e nyere ndị ahụ
  choice: ikike
  alternative: ike
  rationale: “Ikike” na-eme ka o doo anya na ọ bụ ikike Jizọs nyere ha ịrụ ọrụ ahụ, kama ịbụ naanị ike dị n’ime ha; n’agbanyeghị nke ahụ, ọ naghị ebelata ọdịdị ọrụ ebube ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ùgwù, ma dị mfe nghọta. E tinyere njikọ καὶ n’ime “nwekwaa” ka ahịrịokwu ahụ daa nke ọma mgbe a gụrụ ya na amaokwu bu ya ụzọ.
