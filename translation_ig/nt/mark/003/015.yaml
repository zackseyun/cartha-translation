  source_fidelity: 'The main text accurately renders καὶ ἔχειν ἐξουσίαν ἐκβάλλειν τὰ δαιμόνια as a coordinated commission: having granted authority to expel demons. “Ikike” appropriately represents ἐξουσία, and “ịchụpụ” naturally conveys ἐκβάλλειν in this context. The supplied footnote, however, adds “n’ike” (‘by force’), which is not expressed by the Greek and is not a valid lexical alternative.'
