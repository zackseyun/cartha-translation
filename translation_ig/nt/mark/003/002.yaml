  text: καὶ παρετήρουν αὐτὸν εἰ τοῖς σάββασιν θεραπεύσει αὐτόν, ἵνα ⸀κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: ig
  text: Ha nọ na-ele ya anya nke ọma ka ha hụ ma ọ ga-agwọ onye ahụ n’ụbọchị izu ike[a], ka ha wee boo ya ebubo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a dị n’ụdị ọtụtụ (“n’ụbọchị izu ike”); ma n’ebe a, ụdị ọtụtụ ahụ nwere ike ịbụ akpaalaokwu na-ezo aka n’otu ụbọchị izu ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετήρουν
  choice: Ha nọ na-ele ya anya nke ọma
  rationale: Oge imperfect na-egosi omume na-aga n’ihu; okwu a na-egosikwa nlegide anya nke ọma, nke nwere ebumnuche ọjọọ n’ọnọdụ a.
- source_word: εἰ
  choice: ka ha hụ ma
  rationale: N’azụ okwu nke ilegide anya, nke a na-ebute ajụjụ na-apụtaghị ìhè ma na-ada nke ọma n’Igbo.
- source_word: τοῖς σάββασιν
  choice: n’ụbọchị izu ike[a]
  rationale: Ọ bụ ezie na Grik ji ụdị ọtụtụ mee ihe, ọ nwere ike ịbụ akpaalaokwu na-ezo aka n’ụbọchị izu ike. Ụdị otu a bụ nke doro anya ma bụrụkwa nke a na-asụkarị n’Igbo.
- source_word: θεραπεύσει
  choice: ọ ga-agwọ ya
  rationale: Future indicative dị n’ajụjụ na-apụtaghị ìhè; n’Igbo, ‘ọ ga-agwọ ya’ na-echekwa ọdịnihu ahụ n’ụzọ eke.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: ka ha wee nwee ihe ha ga-eji boo ya ebubo
  rationale: ἵνα na-egosi ebumnuche. Nkebiokwu Igbo a na-egosi na ha na-achọ ihe ndabere ha ga-eji boo ya ebubo, n’etinyeghị ikpe ụlọikpe nke ederede ahụ ekwughị kpọmkwem.
theological_decisions:
- issue: Ebumnuche ndị na-ele Jizọs anya
  choice: Nlegide anya nwere iro, iji chọta ihe ha ga-eji boo ya ebubo
  alternative: Ikwu na ha chọrọ ịgba ya akwụkwọ n’ụlọikpe
  rationale: κατηγορέω nwere ike inwe ụda metụtara ikpe, ma amaokwu a kwuru naanị ebumnuche nke ibo ebubo; a naghị etinye usoro iwu karịrị ihe Grik kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. A họọrọ ‘ụbọchị izu ike’ maka Sabbath, ‘gwọ’ maka θεραπεύω, na ‘boo ya ebubo’ maka ebumnuche iro ahụ.
