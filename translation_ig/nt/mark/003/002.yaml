revisions:
- from: Ha nọ na-ele ya anya nke ọma ka ha hụ ma ọ ga-agwọ ya n’ụbọchị izu ike[a], ka ha wee nwee ihe ha ga-eji boo ya ebubo.
  to: Ha nọ na-ele ya anya nke ọma ka ha hụ ma ọ ga-agwọ onye ahụ n’ụbọchị izu ike[a], ka ha wee boo ya ebubo.
  rationale: The revision removes the added idea of finding grounds for an accusation, clarifies the distinct referent of the person to be healed, and corrects the explanatory wording of the footnote concerning the Greek plural. It otherwise preserves the draft’s faithful and natural renderings.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the ongoing, watchful force of παρετήρουν, the indirect question introduced by εἰ, the prospective healing, and the purpose clause. However, “nwee ihe ha ga-eji boo ya ebubo” adds the notion of obtaining evidence/grounds, whereas κατηγορήσωσιν simply states their purpose to accuse him. The revision renders that purpose directly. The plural form of τοῖς σάββασιν is retained in the footnote without implying distinct Sabbath days.
  naturalness: The revised wording is natural Standard Igbo. “Ha nọ na-ele ya anya nke ọma” conveys sustained close observation, while “onye ahụ” avoids an unnecessarily confusing repetition of ya for Jesus and the person to be healed.
  terminology: “Ụbọchị izu ike” is a clear, established rendering for the Sabbath in this register, and “gwọ” suitably renders θεραπεύω. “Boo ya ebubo” is a direct and idiomatic rendering of κατηγορέω without importing a formal prosecution or evidentiary process.
  issues:
  - severity: medium
    issue: The purpose clause adds “nwee ihe ha ga-eji” (“have something they could use”).
    rationale: The Greek says they watched in order that they might accuse him; it does not explicitly say that they sought evidence or grounds. A direct rendering preserves the stated purpose without this added inference.
  - severity: low
    issue: The footnote describes the Greek plural as “ụbọchị izu ike dị iche iche” (“different Sabbath days”).
    rationale: That wording can suggest multiple distinct occasions, which is not the point of the idiomatic plural. The footnote should identify the plural grammatical form while explaining its possible singular Sabbath-day sense.
  revised_text: Ha nọ na-ele ya anya nke ọma ka ha hụ ma ọ ga-agwọ onye ahụ n’ụbọchị izu ike[a], ka ha wee boo ya ebubo.
  revised_footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a dị n’ụdị ọtụtụ (“n’ụbọchị izu ike”); ma n’ebe a, ụdị ọtụtụ ahụ nwere ike ịbụ akpaalaokwu na-ezo aka n’otu ụbọchị izu ike.
    reason: lexical_alternative
  revision_rationale: The revision removes the added idea of finding grounds for an accusation, clarifies the distinct referent of the person to be healed, and corrects the explanatory wording of the footnote concerning the Greek plural. It otherwise preserves the draft’s faithful and natural renderings.
