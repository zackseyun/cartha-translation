  to: Ọ bụrụkwa na Setan ebiliwo imegide onwe ya ma kewaa, ọ pụghị iguzosi ike, kama ọgwụgwụ ya eruola.[a]
  rationale: Revised only the division clause, changing “kewaa onwe ya” to “kewaa,” so that the translation no longer adds an explicit reflexive agent where the Greek uses a passive verb. The existing final-clause rendering and its lexical-alternative footnote are retained.
