  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: ig
  text: Ọ bụrụkwa na Setan ebiliwo imegide onwe ya ma kewaa, ọ pụghị iguzosi ike, kama ọgwụgwụ ya eruola.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ dabara nnọọ n’okwu Grik: “kama o nwere ọgwụgwụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σατανᾶς
  choice: Setan
  rationale: Nsụgharị mkpụrụokwu aha ahụ n’ụdị a na-ejikarị eme ihe n’Igbo.
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: ebiliwo imegide onwe ya
  rationale: Na-egosipụta ibili megide onwe onye n’ụzọ iro, ma na-edobe ike nke okwu Grik.
- source_word: ἐμερίσθη
  choice: kewaa onwe ya
  rationale: N’agbanyeghị na ụdị Grik bụ passive, n’Igbo nke a na-egosi nke ọma na Setan kewara n’ime onwe ya; ọ na-aga nke ọma na nkebi bu ya ụzọ.
- source_word: οὐ δύναται στῆναι
  choice: ọ pụghị iguzosi ike
  rationale: Ọ bụ okwu Igbo doro anya maka enweghị ike ịnọgide ma ọ bụ ịtachi obi, ma na-echekwa ihe oyiyi nke ‘iguzo.’
- source_word: ἀλλὰ τέλος ἔχει
  choice: kama ọgwụgwụ ya eruola
  rationale: Na-egosipụta na ọchịchị kewara ekewa apụghị ịnọgide, ma na-eru njedebe; ọ naghị agbasa amaokwu a ka ọ bụrụ nkwupụta zuru ezu banyere njedebe ikpeazụ Setan.
theological_decisions:
- issue: Ụdị nkwupụta banyere ọdịda Setan
  choice: 'E gosipụtara ya dị ka ihe ga-esi n’arụmụka Jizọs pụta: Setan nke megidere ma kewaa onwe ya agaghị anọgide, ọgwụgwụ ya eruwokwa.'
  alternative: ‘kama o nwere ọgwụgwụ’ ma ọ bụ ‘kama ọ bịala ná njedebe’
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ arụmụka na-egosi na ebubo ndị odeakwụkwọ ekwekọghị n’uche. Ya mere, ekwesịghị itinye n’amaokwu a nkọwa zuru ezu banyere mmeri ikpeazụ n’ọgwụgwụ ụwa.
translation_notes:
  register: Igbo Ọha dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘iguzosi ike’ iji gosi ịnọgide ma chekwaa ihe oyiyi nke iguzo; ‘ọgwụgwụ ya eruola’ na-enye τέλος ἔχει n’ụzọ eke n’Igbo. Akara nkọwa ala peeji [a] dị n’isiokwu ahụ.
