  terminology: The explicit terms 'nwanne m nwoke,' 'nwanne m nwanyị,' and 'nne m' appropriately retain the source's distinct kinship nouns. 'Onye a' accurately retains the force of οὗτος without misleadingly restricting the statement to males.
