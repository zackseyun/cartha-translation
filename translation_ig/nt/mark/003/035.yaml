  text: ὃς ⸀γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ θεοῦ, οὗτος ἀδελφός μου καὶ ⸀ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: ig
  text: N’ihi na onye ọ bụla na-eme uche Chineke, onye a[a] bụ nwanne m nwoke na nwanne m nwanyị na nne m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye ahụ.” Okwu Grik ahụ jiri nnọchiaha ngosi e mesiri ike, nke pụtara n’ụzọ nkịtị, “onye a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ... ἂν ποιήσῃ
  choice: onye ọ bụla nke na-eme
  rationale: Njikọ nnọchiaha na ἄν tinyere aorist subjunctive na-egosi ọnọdụ izugbe na-akọwaghị onye kpọmkwem; ‘onye ọ bụla nke na-eme’ bụ Igbo nkịtị ma na-echekwa echiche ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: γάρ na-enye ihe kpatara ma ọ bụ nkọwa nke okwu bu ya ụzọ; ‘N’ihi na’ na-ejikọta amaokwu a na ihe dị n’ihu ya nke ọma.
- source_word: ποιήσῃ
  choice: na-eme
  rationale: ποιέω pụtara ime ma ọ bụ mezuo; ‘na-eme’ bụ okwu dị mfe ma kwekọọ n’okwu izugbe a.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: uche Chineke
  rationale: ‘Uche Chineke’ bụ ụzọ Igbo doro anya na nke a maara ama isi kwuo ọchịchọ ma ọ bụ ihe Chineke chọrọ, n’enweghị ịgbakwunye nkọwa.
- source_word: οὗτος
  choice: onye ahụ
  rationale: οὗτος bụ nnọchiaha ngosi e mesiri ike. ‘Onye ahụ’ na-echekwa ike ngosi ahụ ma zere nnọchiaha ga-eme ka onye a bụrụ naanị nwoke.
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: nwanne m nwoke na nwanne m nwanyị na nne m
  rationale: E debere aha mmekọrịta ezinụlọ atọ ahụ n’otu n’otu, gụnyere nke nwoke na nke nwanyị, iji chekwaa ike okwu Jizọs.
- source_word: ἐστίν
  choice: bụ
  rationale: ‘Bụ’ bụ copula Igbo kwekọrọ n’ἐστίν ma na-esochi isiokwu otu onye.
theological_decisions:
- issue: Nnọchiaha otu onye na aha mmekọrịta ezinụlọ nke nwoke na nwanyị
  choice: onye ahụ
  alternative: ọ bụ
  rationale: ‘Onye ahụ’ na-echekwa demonstrative οὗτος ma ghara ime ka okwu a yie nke metụtara naanị nwoke, ebe predicate ahụ kpọrọ ma nwanne nwoke ma nwanne nwanyị.
- issue: Ụdị okwu Jizọs gbasara ezinụlọ
  choice: E debere ‘nwanne m nwoke na nwanne m nwanyị na nne m’ kpọmkwem
  alternative: onye ezinụlọ m
  rationale: Aha mmekọrịta ndị a na-akọwa ezinụlọ n’ụzọ ihe atụ dabere n’ime uche Chineke; ịchịkọta ha dịka ‘onye ezinụlọ m’ ga-ebelata ike okwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘onye ahụ’ chekwaa ike nnọchiaha ngosi Grik n’enweghị ịkpa oke nwoke; e debere usoro aha ezinụlọ niile.
