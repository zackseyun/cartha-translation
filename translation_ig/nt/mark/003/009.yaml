  text: καὶ εἶπεν τοῖς μαθηταῖς αὐτοῦ ἵνα πλοιάριον προσκαρτερῇ αὐτῷ διὰ τὸν ὄχλον ἵνα μὴ θλίβωσιν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: ig
  text: Ọ gwara ndị na-eso ụzọ ya ka otu obere ụgbọ mmiri dịrị ya njikere n’ihi igwe mmadụ ahụ, ka igwe mmadụ ahụ ghara ịzọpịa ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka igwe mmadụ ahụ ghara ịpị ya.” Okwu Grik ahụ nwere ike ịpụta ịpị mmadụ, ịkpagide ya, ma ọ bụ ịzọpịa ya n’ihi nrụgide.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: Ọ gwakwara
  rationale: “Gwa” na-eweta okwu e nyere ndị na-eso ụzọ n'ụzọ Igbo dị mfe ma kwekọọ n’usoro okwu na-esochi ya; “-kwara” jikọtara omume a na ihe ndị gara aga.
- source_word: μαθηταῖς
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa μαθηταί n’Oziọma, na-egosipụta ndị na-amụta ihe n’aka onye nkụzi ma na-eso ya.
- source_word: πλοιάριον
  choice: otu obere ụgbọ mmiri
  rationale: “Obere ụgbọ mmiri” na-echekwa echiche nke obere nha dị na πλοιάριον ma bụrụkwa okwu Igbo doro anya.
- source_word: προσκαρτερῇ αὐτῷ
  choice: ka ha doziere ya
  rationale: N’ọnọdụ a, okwu Grik ahụ pụtara ime ka ụgbọ mmiri dị njikere ma dị ya nso mgbe ọ ga-achọ ya. “Doziere ya” na-ekwupụta ịdị njikere ahụ n’Igbo nkịtị.
- source_word: διὰ τὸν ὄχλον
  choice: n’ihi igwe mmadụ ahụ
  rationale: διά na accusative na-egosi ihe kpatara ya; “n’ihi” na-enye ihe ahụ n’ụzọ ziri ezi ma dị mfe.
- source_word: θλίβωσιν
  choice: ịzọpịa ya
  rationale: θλίβω nwere ike ịpụta ịpịgide, ịkpagide, ma ọ bụ ịzọpịa mmadụ site n’ike nrụgide. “Ịzọpịa” na-echekwa ike okwu ahụ, ebe nkọwa ala peeji na-egosi ụzọ ọzọ a pụrụ isi ghọta ya.
