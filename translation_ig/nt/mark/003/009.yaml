  register: 'Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ebumnuche abụọ nke ἵνα: ime ka ụgbọ mmiri dị njikere, na igbochi igwe mmadụ ịkpagide Jizọs.'
