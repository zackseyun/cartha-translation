review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the command, the small boat, the causal reference to the crowd, and the danger of physical pressure. However, the two plural subjects are left ambiguous: “ha doziere” makes the disciples explicitly prepare the boat where the Greek says that a boat should remain available to Jesus, and “ka ha ghara” can grammatically refer back to the disciples rather than to the crowd (ὁ ὄχλος).'
  naturalness: The wording is generally clear Standard Igbo, but an impersonal construction for the boat and an explicit repetition of “igwe mmadụ ahụ” yield a more natural and unambiguous sentence.
  terminology: “ndị na-eso ụzọ ya,” “obere ụgbọ mmiri,” and “igwe mmadụ ahụ” are suitable. “Ịzọpịa” appropriately retains the strong physical-pressure sense of θλίβωσιν; the note should give cleaner, idiomatic alternatives and be anchored to that verb.
  issues:
  - severity: medium
    issue: Ambiguous and slightly over-specific rendering of προσκαρτερῇ αὐτῷ
    rationale: “ka ha doziere ya” assigns the action directly to the disciples and can suggest merely making/preparing a boat. The Greek clause focuses on a small boat remaining available/ready for Jesus.
  - severity: high
    issue: The subject of θλίβωσιν is not explicit in Igbo
    rationale: In “ka ha ghara ịzọpịa ya,” “ha” may refer to the disciples, while the Greek plural verb refers to the crowd. Repeating “igwe mmadụ ahụ” preserves the source meaning.
  - severity: low
    issue: Footnote alternatives need idiomatic refinement
    rationale: The existing explanation includes less natural phrasing such as “ịpịgide mmadụ.” A concise note can state the range as pressing, crowding, or crushing.
  revised_text: Ọ gwara ndị na-eso ụzọ ya ka otu obere ụgbọ mmiri dịrị ya njikere n’ihi igwe mmadụ ahụ, ka igwe mmadụ ahụ ghara ịzọpịa ya.[a]
  revised_footnotes:
