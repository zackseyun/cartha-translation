revisions:
- from: Ọ gwakwara ndị na-eso ụzọ ya ka ha doziere ya otu obere ụgbọ mmiri n’ihi igwe mmadụ ahụ, ka ha ghara ịzọpịa ya.[a]
  to: Ọ gwara ndị na-eso ụzọ ya ka otu obere ụgbọ mmiri dịrị ya njikere n’ihi igwe mmadụ ahụ, ka igwe mmadụ ahụ ghara ịzọpịa ya.[a]
  rationale: The revision preserves the two purpose clauses while making the boat’s continuing availability explicit without unnecessarily specifying how the disciples would arrange it. It also identifies the crowd as the subject of the final clause, as required by the Greek context and grammar. The footnote retains the lexical ambiguity of θλίβωσιν in idiomatic Standard Igbo.
