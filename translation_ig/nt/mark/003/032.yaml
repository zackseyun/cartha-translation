  text: καὶ ἐκάθητο ⸂περὶ αὐτὸν ὄχλος⸃, ⸂καὶ λέγουσιν⸃ αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί ⸀σου ἔξω ζητοῦσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: ig
  text: Ìgwè mmadụ nọ ọdụ gburugburu ya, ha wee sị ya, “Lee, nne gị na ụmụnne gị ndị nwoke nọ n’èzí na-achọ gị.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθητο
  choice: nọkwa ọdụ
  rationale: Oge imperfect na-egosi ọnọdụ na-aga n’ihu n’azụ akụkọ ahụ; ‘nọ ọdụ’ na-egosipụta nke a n’Igbo nkịtị.
- source_word: περὶ αὐτὸν ὄχλος
  choice: Ìgwè mmadụ ... gbaa ya gburugburu
  rationale: περί tinyere accusative na-egosi na ìgwè ahụ nọ ya gburugburu; okwu a bụ ụzọ Igbo doro anya ma dị ndụ isi chekwaa ihe oyiyi ahụ.
- source_word: λέγουσιν
  choice: ha wee sị ya
  rationale: Ọ bụ historical present n’asụsụ Grik; tense gara aga na njikọ ‘wee’ dabara n’usoro akụkọ Igbo.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: ‘Lee’ bụ mkpụrụokwu Igbo dị ugbu a nke na-adọta uche onye a na-agwa okwu n’enweghị ụda ochie.
- source_word: μήτηρ
  choice: nne
  rationale: Ọ bụ aha mmekọrịta ezinụlọ doro anya.
- source_word: ἀδελφοί
  choice: ụmụnne ... ndị nwoke
  rationale: Ụdị Grik bụ masculine plural; ‘ụmụnne ndị nwoke’ na-edobe ntụaka ahụ n’ụmụ nwoke n’enweghị ịkọwa ụdị mmekọrịta ezinụlọ karịrị ihe amaokwu ahụ kwuru.
- source_word: ἔξω
  choice: n’èzí
  rationale: Nke a bụ ntụgharị nkịtị na nke doro anya maka ebe dị n’èzí.
- source_word: ζητοῦσίν σε
  choice: na-achọ gị
  rationale: ζητέω nwere ike ịpụta ịchọ ma ọ bụ ilegharị anya ka a chọta mmadụ; ‘na-achọ gị’ bụ Igbo eke nke na-edobekwa obosara okwu Grik.
theological_decisions:
- issue: Ihe ‘ἀδελφοί’ na-ezo aka na ya
  choice: ụmụnne gị ndị nwoke
  alternative: ụmụnne/ndị ikwu gị; ụmụnne gị
  rationale: Amaokwu ahụ ji okwu mmekọrịta ezinụlọ nke nkịtị ma kọwaa ya n’ụdị masculine plural, ma ọ naghị akọwa kpọmkwem ọdịdị mmekọrịta ahụ. Ya mere, ntụgharị ahụ na-edobe ụmụ nwoke na-enweghị itinye nkọwa ụka ọbụla banyere ezinụlọ Jizọs.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ìgwè mmadụ’ na ‘n’èzí’ mee ka ọnọdụ ahụ doo anya; e zere okwu ụka pụrụ iche na nkọwa karịrị ihe odide Grik.
