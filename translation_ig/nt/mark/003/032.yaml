review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the crowd, its position around Jesus, the report about his mother and brothers, their being outside, and their seeking him. However, “nọkwa ọdụ gbaa ya gburugburu” is grammatically and idiomatically strained; it does not naturally express the Greek imperfect scene of a crowd sitting around him.
  naturalness: Replace the opening clause with the standard, fluent Igbo word order “Ìgwè mmadụ nọ ọdụ gburugburu ya.” The remaining narrative wording is clear, modern Standard Igbo, and suitably restrained.
  terminology: “Nne gị,” “ụmụnne gị ndị nwoke,” “n’èzí,” and “na-achọ gị” preserve the kinship, location, and nontechnical sense of the Greek without imposing an interpretation of the family relationship. No footnote is needed in Igbo, since “na-achọ gị” naturally retains the relevant range here.
