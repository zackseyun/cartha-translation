    rationale: “Ìgwè mmadụ nọkwa ọdụ gbaa ya gburugburu” combines expressions in a nonstandard way. “Nọ ọdụ gburugburu ya” naturally conveys that the crowd was sitting around him and retains the imperfect background scene.
