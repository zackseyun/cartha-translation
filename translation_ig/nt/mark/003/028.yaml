id: MRK.3.28
reference: Mark 3:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: ig
  text: N’ezie, ana m agwa unu na a ga-agbaghara ụmụ mmadụ[a] mmehie ha niile na nkwulu niile ha ga-ekwu;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị mmadụ.” Okwu Grik ahụ pụtara ụmụ mmadụ niile n’ozuzu ha, ọ bụghị naanị ụmụ nwoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: N’ezie
  rationale: N’usoro okwu siri ike Ἀμὴν λέγω ὑμῖν, “N’ezie” na-egosi nkwenye na ịdị arọ nke okwu ahụ n’Igbo nke oge a, kama ide “Amen” dịka ntụgharị mkpụrụokwu.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ ma dị ndụ isi gosipụta okwu onye mbụ a gwara ọtụtụ mmadụ.
- source_word: πάντα ... τὰ ἁμαρτήματα
  choice: mmehie ha niile
  rationale: “Ha niile” na-egosi oke zuru ezu nke πάντα, ebe “mmehie” na-ezo aka n’omume mmehie dị iche iche.
- source_word: ἀφεθήσεται
  choice: a ga-agbaghara
  rationale: N’ebe a, ἀφίημι metụtara mmehie, ya mere “ịgbaghara” na-echekwa ihe okwu ahụ pụtara kpọmkwem.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: ụmụ mmadụ[a]
  rationale: “Ụmụ mmadụ” bụ okwu Igbo a na-ejikarị ezo aka n’ụmụ mmadụ n’ozuzu ha; ọ na-edebekwa oyiyi nke okwu Grik ahụ n’enweghị okwu siri ike ma ọ bụ na-eduhie eduhie.
- source_word: αἱ βλασφημίαι
  choice: nkwulu
  rationale: “Nkwulu” na-echekwa ike okpukpe na nkà mmụta banyere Chineke nke okwu ahụ nwere n’akụkụ amaokwu ndị gbara ya gburugburu.
- source_word: ὅσα ἐὰν βλασφημήσωσιν
  choice: nkwulu niile ha ga-ekwu
  rationale: Nke a na-egosi na ụdị nkwulu ọ bụla ha kwuru so n’ókè okwu ahụ, ma na-asụkwa Igbo n’ụzọ dị mma.
theological_decisions:
- issue: Oke mgbaghara a kpọrọ aha na mmekọrịta ya na ịdọ aka ná ntị banyere ikwulu Mmụọ Nsọ n’amaokwu na-esote
  choice: E debere amaokwu a dịka nkwupụta sara mbara banyere mgbaghara, n’etinyeghị ihe e wepụrụ n’amaokwu na-esote n’ime ya.
  alternative: Ịtinye mmachi banyere nkwulu megide Mmụọ Nsọ n’ime amaokwu a.
  rationale: Amaokwu a n’onwe ya na-ekwupụta oke mgbaghara; amaokwu na-esote ka na-eweta ịdọ aka ná ntị pụrụ iche. Ntụgharị ahụ kwesịrị idobe esemokwu ahụ dịka ederede siri debe ya.
- issue: Okwu nwoke n’ụdị izugbe τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: ụmụ mmadụ[a]
  alternative: ndị mmadụ
  rationale: “Ụmụ mmadụ” na-echekwa ọdịdị okwu mmalite ahụ ma bụrụkwa okwu Igbo na-anọchi mmadụ niile; nkọwa ala peeji na-eme ka ihe izugbe ọ pụtara doo anya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma doo ndị nkịtị anya. E ji usoro okwu dị ndụ zere nsụgharị siri ike, ma e chekwara ịdị arọ nke nkwupụta Jizọs na okwu okpukpe “nkwulu.”
