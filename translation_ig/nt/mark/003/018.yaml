id: MRK.3.18
reference: Mark 3:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ Ἀνδρέαν καὶ Φίλιππον καὶ Βαρθολομαῖον καὶ Μαθθαῖον καὶ Θωμᾶν καὶ Ἰάκωβον τὸν τοῦ Ἁλφαίου καὶ Θαδδαῖον καὶ Σίμωνα τὸν ⸀Καναναῖον
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: ig
  text: na Andru, na Filip, na Batolomiu, na Matiu, na Tọmọs, na Jemis nwa Alfiọs, na Tadiọs, na Saịmọn onye a kpọrọ Kananịa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, Kananaios. O yikarịrị ka ọ pụtara “onye na-anụ ọkụ n’obi,” dịka Luk 6:15 si gosipụta ya; e kwesịghị ịghọta ya ebe a dị ka onye Kenan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: na
  rationale: E ji “na” chekwaa usoro ndepụta ahụ nke na-ejikọta aha ndị ahụ otu otu, dịka Grik si mee ya.
- source_word: Ἀνδρέαν
  choice: Andru
  rationale: Nsụgharị aha mmadụ n’ụdị a maara nke ọma n’Igbo.
- source_word: Φίλιππον
  choice: Filip
  rationale: Nsụgharị aha mmadụ n’ụdị dị mfe ma kwekọọ n’olu Igbo.
- source_word: Βαρθολομαῖον
  choice: Batolomiu
  rationale: Ụdị aha a na-ejikarị eme ihe n’Igbo.
- source_word: Μαθθαῖον
  choice: Matiu
  rationale: Ụdị aha a maara nke ọma n’Igbo.
- source_word: Θωμᾶν
  choice: Tọmọs
  rationale: Ụdị aha a maara nke ọma n’Igbo, tinyere akara ụdaume kwesịrị ekwesị.
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: Jemis nwa Alfiọs
  rationale: Ọdịdị article na genitive n’asụsụ Grik na-egosi mmekọrịta nna na nwa; “nwa Alfiọs” bụ ụzọ Igbo doro anya ma bụrụkwa nke ebumpụta ụwa.
- source_word: Θαδδαῖον
  choice: Tadiọs
  rationale: Nsụgharị aha mmadụ n’ụdị dabara n’usoro ụda Igbo.
- source_word: Σίμωνα τὸν Καναναῖον
  choice: Saịmọn onye Kananịa
  rationale: E debere ọdịdị aha njirimara Grik ahụ n’amaokwu bụ isi kama ịkọwa ya ozugbo dịka agbụrụ; nkọwa ala peeji na-egosi ihe o yikarịrị ka ọ pụtara.
theological_decisions:
- issue: Ihe aha njirimara Καναναῖος nke Saịmọn pụtara
  choice: Saịmọn onye Kananịa
  alternative: Saịmọn Onye Na-anụ Ọkụ n’Obi
  rationale: Κανανaῖος o yikarịrị ka o sitere n’okwu Arameik pụtara onye na-anụ ọkụ n’obi, dịka ζηλωτής dị na Luk 6:15 si kwado. Ma ebe Mak jiri ọdịdị Καναναῖος mee ihe, e debere ọdịdị ahụ n’ahịrịokwu ma kọwaa ihe ọ pụtara na nkọwa ala peeji, ka a ghara ihichapụ ọdịiche dị n’etiti Mak na Luk ma ọ bụ mee ka ọ dị ka Saịmọn bụ onye Kenan.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị nkenke ma dị ùgwù. E chekwara usoro ndepụta jikọtara ya na “na,” ebe e dere njikọ nna na nwa n’ụzọ Igbo ebumpụta ụwa. E tinyere akara nkọwa ala peeji n’ebe ọ metụtara kpọmkwem—mgbe “Kananịa” gasịrị.
