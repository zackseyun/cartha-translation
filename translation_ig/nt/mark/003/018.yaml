    text: N’asụsụ Grik, Kananaios. O yikarịrị ka ọ pụtara “onye na-anụ ọkụ n’obi,” dịka Luk 6:15 si gosipụta ya; e kwesịghị ịghọta ya ebe a dị ka onye Kenan.
    reason: lexical_alternative
  revision_rationale: The revision retains Mark’s Greek-form epithet in the verse while making its titular function natural and clear in Standard Igbo. The note supplies the probable “Zealot” sense without presenting a disputed lexical-historical inference as an absolute claim.
