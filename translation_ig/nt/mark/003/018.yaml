  rationale: The revision retains Mark’s Greek-form epithet in the verse while making its titular function natural and clear in Standard Igbo. The note supplies the probable “Zealot” sense without presenting a disputed lexical-historical inference as an absolute claim.
  reviewer_model: gpt-5.6-terra
