  to: Sitekwa na Jerusalem, na Idumia, na mpaghara dị n’ofe Osimiri Jọdan[a], nakwa n’ógbè ndị gbara Taịa na Saịdọn gburugburu[b], ka oké ìgwè mmadụ bịakwutere ya, n’ịnụ ihe ọ nọ na-eme[c].
