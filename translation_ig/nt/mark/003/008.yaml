  text: καὶ ἀπὸ Ἱεροσολύμων καὶ ἀπὸ τῆς Ἰδουμαίας ⸀καὶ πέραν τοῦ Ἰορδάνου ⸁καὶ περὶ Τύρον καὶ Σιδῶνα, πλῆθος πολύ, ⸀ἀκούοντες ὅσα ⸀ἐποίει ἦλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/008.yaml
  text: and from Jerusalem[a], and from Idumea, and beyond the Jordan, and around Tyre and Sidon, a great crowd, hearing what he was doing[c][b], came to him.
translation:
  language: ig
  text: Sitekwa na Jerusalem, na Idumia, na mpaghara dị n’ofe Osimiri Jọdan[a], nakwa n’ógbè ndị gbara Taịa na Saịdọn gburugburu[b], ka oké ìgwè mmadụ bịakwutere ya, n’ịnụ ihe ọ nọ na-eme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ógbè dị n’akụkụ nke ọzọ nke Osimiri Jọdan.” Okwu Grik a nwere ike izo aka n’ógbè dị n’ofe Osimiri Jọdan.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ógbè dị Taịa na Saịdọn nso.” Okwu Grik ahụ na-ezo aka n’ógbè ndị gbara ha gburugburu, ọ bụghị naanị obodo abụọ ahụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ihe niile ọ nọ na-eme.” Okwu nnọchi anya Grik ahụ nwere ike ibu echiche nke ihe niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: site na Jerusalem
  rationale: ἀπό na-egosi ebe ndị ahụ si bịa; a hapụrụ aha obodo ahụ n’ụdị a na-ejikarị ede ya n’Igbo.
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: na Idumia
  rationale: N’usoro ndepụta a, ‘na’ na-aga n’ihu n’okpuru ‘site na,’ ebe Idumia bụ aha mpaghara ahụ.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: na mpaghara dị n’ofe osimiri Jọdan
  rationale: Nke a na-egosi mpaghara dị n’akụkụ nke ọzọ nke Jọdan, ọ bụghị nanị ntụziaka ngagharị.
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: n’ógbè ndị gbara Taịa na Saịdọn gburugburu
  rationale: περί ebe a na-ezo aka n’ógbè gbara obodo abụọ ahụ gburugburu, ọ bụghị na obodo ndị ahụ naanị.
- source_word: πλῆθος πολύ
  choice: Oké ìgwè mmadụ
  rationale: Nke a na-egosipụta ìgwè dị ukwuu n’asụsụ Igbo dị mfe ma dị ùgwù.
- source_word: ἀκούοντες
  choice: mgbe ha nụrụ
  rationale: A tụgharịrị participle ahụ n’ụzọ Igbo si ekwu okwu nke ọma, n’enweghị ime ka o doo anya karịa isi mmalite ma ọ bụ naanị oge ka ọ bụkwa ihe kpatara ha ji bịa.
- source_word: ὅσα ἐποίει
  choice: ihe ndị ọ nọ na-eme
  rationale: ‘Ihe ndị’ na-echekwa echiche ọtụtụ dị na ὅσα, ebe ‘ọ nọ na-eme’ na-egosipụta omume na-aga n’ihu nke imperfect ἐποίει.
- source_word: ἦλθον πρὸς αὐτόν
  choice: bịakwutere ya
  rationale: Nke a bụ ụzọ Igbo e si egosi ngagharị bịaruru mmadụ nso n’ụzọ dabara adaba.
- source_word: καὶ ... καὶ ... καὶ
  choice: sitekwa ... na ... nakwa
  rationale: E chekwara mmetụta ndepụta na-agbakọta nke καί ugboro ugboro, ma hazie ya ka ọ bụrụ Igbo e ji eme ihe ugbu a.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. Ahịrịokwu ahụ malitere na ‘sitekwa’ n’ihi na amaokwu a na-aga n’ihu na ndepụta sitere n’amaokwu bu ya ụzọ. E kewara ya n’ahịrịokwu abụọ iji mee ka ogologo ndepụta ahụ doo anya n’Igbo, n’enweghị ịgbanwe njikọ echiche ya.
