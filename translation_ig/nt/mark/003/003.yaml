  text: καὶ λέγει τῷ ἀνθρώπῳ τῷ ⸂τὴν χεῖρα ἔχοντι ξηράν⸃· ⸀Ἔγειρε εἰς τὸ μέσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/003.yaml
  text: And he says to the man with the withered hand[a], “Rise and come to the middle.”
translation:
  language: ig
  text: O wee sị nwoke ahụ nwere aka ya kpọnwụrụ akpọnwụ[a], “Bilie, bịa n’etiti.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “nwoke ahụ nwere aka ya kpọrọ nkụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ọ sịkwara
  rationale: Aorist-like Igbo narrative phrasing is more natural here, while the connective -kwara preserves the progression introduced by καί; Igbo does not normally use a historical present in precisely the same way as Markan Greek.
- source_word: ἀνθρώπῳ
  choice: nwoke ahụ
  rationale: The context identifies an adult male, and the article is naturally represented by ahụ.
- source_word: τὴν χεῖρα ἔχοντι ξηράν
  choice: aka ya kpọnwụrụ akpọnwụ
  rationale: This gives a natural Igbo description of the man’s disabled, withered hand without specifying a medical cause absent from the Greek.
- source_word: Ἔγειρε
  choice: Bilie
  rationale: Bilie directly and naturally renders the singular imperative ‘rise/get up/stand up.’
- source_word: εἰς τὸ μέσον
  choice: bịa n’etiti
  rationale: A literal calque would be awkward in Igbo. This wording retains the commanded movement into the midst while making the implied approach explicit.
theological_decisions: []
translation_notes:
  register: Standard Igbo; natural, dignified narrative language. The command is concise and direct, and the description avoids archaic or overly clinical wording.
