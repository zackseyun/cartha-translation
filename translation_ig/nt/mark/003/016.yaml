  text: καὶ ⸂ἐποίησεν τοὺς δώδεκα, καὶ⸃ ἐπέθηκεν ⸂ὄνομα τῷ Σίμωνι⸃ Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/016.yaml
  text: And he appointed the twelve[a], and he gave Simon the name Peter,
translation:
  language: ig
  text: O wee họpụta mmadụ iri na abụọ ahụ, nyekwa Saịmọn aha Pita,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pita pụtara “Nkume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: họpụta
  rationale: N’agbanyeghị na ngwaa ahụ nwere ike ịpụta ‘mee,’ n’ebe a ọ na-egosi na Jizọs họpụtara ma guzobe mmadụ iri na abụọ ahụ dịka otu pụrụ iche. ‘Họpụta’ na-egosipụta nke a n’Igbo nkịtị n’etinyeghị okwu ọchịchị ụka na-adịghị na Grik.
- source_word: τοὺς δώδεκα
  choice: mmadụ iri na abụọ ahụ
  rationale: N’Igbo, ịgbakwunye ‘mmadụ’ na-eme ka okwu ọnụọgụ ahụ doo anya ma na-ezo aka n’otu ndị ahụ Jizọs họpụtara.
- source_word: ἐπέθηκεν ὄνομα
  choice: nyekwa ... aha
  rationale: Nkebiokwu Grik ahụ pụtara n’ụzọ nkịtị ‘tụkwasị aha n’elu.’ ‘Nye ... aha’ bụ ụzọ Igbo si ekwu omume ịkpọ mmadụ aha ọhụrụ n’ụzọ doro anya ma dị mma.
- source_word: Σίμωνι
  choice: Saịmọn
  rationale: E depụtara aha mmadụ a n’ụdị mkpọpụta a na-eji n’Igbo, kama ịsụgharị ihe aha ahụ pụtara.
- source_word: Πέτρον
  choice: Pita
  rationale: E jiri ụdị aha a maara nke ọma n’Igbo mee transliteration nke Πέτρος. E debere ihe aha ahụ pụtara n’ala peeji kama iji ‘Nkume’ dochie aha mmadụ ahụ n’ahịrịokwu.
theological_decisions:
- issue: Ihe omume Jizọs mere n’ebe mmadụ iri na abụọ ahụ nọ
  choice: họpụta mmadụ iri na abụọ ahụ
  alternative: mee mmadụ iri na abụọ ahụ; guzobe mmadụ iri na abụọ ahụ
  rationale: ‘Họpụta’ na-egosi na Jizọs kewapụtara ha dịka otu pụrụ iche, ma ọ naghị etinye n’amaokwu ahụ echiche banyere ọkwa ụka nke mechara pụta.
- issue: Otú e si sụgharị Πέτρος
  choice: Pita
  alternative: Nkume
  rationale: Ebe Πέτρος na-arụ ọrụ dịka aha e nyere Saịmọn, e depụtara ya dịka aha mmadụ. Ihe ọ pụtara ka e gosiri n’ala peeji, nke na-echekwa njikọ okwu ahụ n’etinyeghị nkọwa ahụ ozugbo n’ahịrịokwu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. Nhazi ‘O wee ...’ na-ejikọta amaokwu a na akụkọ gara n’ihu; ‘nyekwa’ na-egosikwa njikọ omume nke καὶ. E debere akara ntụaka [a] ozugbo n’aha Pita nke ala peeji ahụ na-akọwa.
