id: MRK.3.13
reference: Mark 3:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: ig
  text: Ọ rịgoro n’elu ugwu ahụ, kpọọ ndị ọ chọrọ n’onwe ya[a] ka ha bịakwute ya; ha wee bịakwute ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ọ chọrọ”; okwu Grik ahụ na-ekwusi ike na ọ bụ ya onwe ya chọrọ ha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha wee gakwuru ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβαίνει
  choice: Ọ rịgoro
  rationale: Okwu Grik ji oge ugbu a n’akụkọ ihe mere eme, ma oge gara aga na-ada nke ọma n’akụkọ Igbo; ‘rịgoro’ na-echekwa echiche ịgbago elu.
- source_word: εἰς τὸ ὄρος
  choice: n’elu ugwu ahụ
  rationale: N’ọgbakọ ya na ‘rịgoro,’ nke a na-egosi ịrịgoro n’ugwu ruo n’elu ya; ‘ahụ’ na-egosipụta article Grik n’ụzọ kwekọrọ n’Igbo.
- source_word: προσκαλεῖται
  choice: kpọọ ... ka ha bịakwute ya
  rationale: Usoro a na-egosipụta ọkpụkpọ nke na-adọta ndị ahụ n’ebe Jizọs nọ, ma na-anọgide na-ada ka Igbo nkịtị.
- source_word: οὓς ἤθελεν αὐτός
  choice: ndị ọ chọrọ n’onwe ya
  rationale: ‘Chọrọ’ bụ okwu Igbo doro anya maka θέλω ebe a; ‘n’onwe ya’ na-echekwa nkwusi ike nke αὐτός n’etinyeghị ozizi ọzọ n’amaokwu ahụ.
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: ha wee bịakwute ya
  rationale: Ọ bụ mmegharị gaa n’ebe Jizọs nọ. ‘Bịakwute ya’ bụ Igbo dị ndụ ma kwekọọ n’echiche πρὸς αὐτόν, ebe ‘gakwuru ya’ ka bụ nsụgharị ọzọ nwere ike ịdị.
theological_decisions:
- issue: Nkwusi ike n’ọchịchọ Jizọs n’ịkpọ ndị ahụ
  choice: ndị ọ chọrọ n’onwe ya
  alternative: ndị ọ chọrọ
  rationale: αὐτός na-etinye nkwusi ike na mkpebi nke ya. Nsụgharị ahụ na-echekwa nke a, ma ọ naghị agbatị ya ka ọ bụrụ nkwupụta banyere usoro ozizi nhọpụta.
- issue: Ụzọ e si ele mmegharị ndị a kpọrọ anya
  choice: ha wee bịakwute ya
  alternative: ha wee gakwuru ya
  rationale: Grik ἀπῆλθον nwere ike ịpụta ‘gara,’ ma πρὸς αὐτόν na-eme ka mmegharị ahụ bụrụ nke na-aga n’ebe Jizọs nọ. Igbo nwere ike ikwu ya dịka ‘bịakwute’ ma ọ bụ ‘gakwuru,’ ya mere e debere ụzọ ọzọ n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ‘kpọọ ... ka ha bịakwute ya’ iji mee ka olu etiti nke προσκαλεῖται na mmegharị n’ebe Jizọs nọ pụta n’ụzọ Igbo ebumpụta ụwa. Akara ala peeji [a] na [b] dị n’ederede isi.
