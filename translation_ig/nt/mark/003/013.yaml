  verdict: approve
  source_fidelity: The Igbo accurately conveys the ascent, the movement toward the mountain, Jesus’ personal initiative in calling those he wanted, and their subsequent movement to him. “n’onwe ya” appropriately retains the emphasis of αὐτός without adding doctrinal interpretation. “bịakwute ya” is a natural Igbo rendering of movement toward Jesus in the context of πρὸς αὐτόν.
  naturalness: 'The text is clear, idiomatic Standard Igbo, and suitably dignified for Scripture. The apparent repetition of “bịakwute ya” reflects the source sequence: Jesus called them to himself, and they came to him. The semicolon makes the two actions readily intelligible.'
  terminology: “rịgoro,” “ugwu ahụ,” “kpọọ,” “chọrọ,” and “bịakwute” are appropriate modern Standard Igbo choices. The wording preserves the relational force of προσκαλεῖται without overtranslating the Greek middle voice.
