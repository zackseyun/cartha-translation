id: MRK.3.27
reference: Mark 3:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: ig
  text: Ma ọ dịghị onye pụrụ ịbanye n’ụlọ nwoke ahụ dị ike wee kwakọrọ ihe ya[a], ma ọ bụrụ na o bughị ụzọ kee nwoke ahụ dị ike agbụ[b]; mgbe ahụ ka ọ ga-akwakọrọ ụlọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe onwunwe ya”; n'ụzọ nkịtị karị, “arịa ya” ma ọ bụ “ngwa ya.”
    reason: lexical_alternative
  - marker: b
    text: “Nwoke ahụ dị ike” bụ akụkụ nke ihe atụ Jizọs banyere imeri Setan; ntụgharị a na-edobe ihe atụ ahụ kama ịkọwa ya kpọmkwem n’ahịrịokwu bụ isi.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Na-egosi ntụgharị megide ebubo na arụmụka ndị bu ụzọ, n'ụzọ Igbo doro anya.
- source_word: οὐδεὶς δύναται
  choice: ọ dịghị onye pụrụ
  rationale: Na-echekwa echiche nke enweghị onye nwere ike ime ya.
- source_word: εἰς τὴν οἰκίαν ... εἰσελθὼν
  choice: ịbanye n'ụlọ
  rationale: Ọ bụ ụzọ Igbo dị n'okike isi kwuo mmegharị ịbanye n'ime ụlọ.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: nwoke ahụ dị ike
  rationale: Na-echekwa aha nkọwa e ji mee aha mmadụ na ihe atụ Jizọs, tinyere nkwughachi ya.
- source_word: τὰ σκεύη αὐτοῦ
  choice: ihe ya
  rationale: N'ọnọdụ ịkwakọrọ ụlọ, σκεύη pụtara ihe onwunwe ma ọ bụ ngwongwo dị n'ụlọ; 'ihe ya' bụ okwu Igbo sara mbara ma dị mfe nghọta.
- source_word: διαρπάσαι / διαρπάσει
  choice: kwakọrọ / ga-akwakọrọ
  rationale: Na-egosi ịnara ọtụtụ ihe n'ike ma na-echekwa otu ngwaa ahụ ugboro abụọ.
- source_word: ἐὰν μὴ πρῶτον
  choice: ma ọ bụrụ na o bughị ụzọ
  rationale: Na-egosi na ike nwoke ahụ agbụ bụ ọnọdụ a ga-ebu ụzọ mezuo.
- source_word: δήσῃ
  choice: kee ... agbụ
  rationale: Na-enye ihe δέω pụtara n'ụzọ Igbo doro anya ma na-echekwa onyonyo nke ijide onye ahụ.
- source_word: καὶ τότε
  choice: mgbe ahụ ka
  rationale: Na-egosi ihe ga-esochi ozugbo ma na-enye ya ntakịrị nkwusi ike kwekọrọ n'usoro Greek.
- source_word: τὴν οἰκίαν αὐτοῦ διαρπάσει
  choice: ọ ga-akwakọrọ ihe dị n'ụlọ ya
  rationale: N'Igbo, a na-akwakọrọ ihe dị n'ụlọ karịa ịkwakọrọ ụlọ ahụ n'onwe ya; ntụgharị a na-echekwa onyonyo ụlọ na nzube nke okwu ahụ.
theological_decisions:
- issue: Ihe atụ nke “nwoke ahụ dị ike” n'arụmụka Jizọs banyere Setan
  choice: E debere okwu ihe atụ ahụ n'ahịrịokwu bụ isi n'enweghị ịkpọ nwoke ahụ Setan.
  alternative: Ịsụgharị ya kpọmkwem dịka Setan ma ọ bụ “onye ahụ dị ike.”
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi Setan, ma Greek na-enye ya dịka ihe atụ. Idebe ihe atụ ahụ na-ezere ime ka nkọwa ghọọ akụkụ nke okwu ahụ n'onwe ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Kwakọrọ” na-echekwa ike nke διαρπάζω, ebe “kee ... agbụ” na-eme ka onyonyo nke ijide nwoke ahụ doo anya. E tinyere akara poznụkwụ [a] ozugbo n'akụkụ okwu ọ na-akọwa.
