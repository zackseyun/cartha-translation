  to: Ma ọ dịghị onye pụrụ ịbanye n’ụlọ nwoke ahụ dị ike wee kwakọrọ ihe ya[a], ma ọ bụrụ na o bughị ụzọ kee nwoke ahụ dị ike agbụ[b]; mgbe ahụ ka ọ ga-akwakọrọ ụlọ ya.
