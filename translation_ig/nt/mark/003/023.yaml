id: MRK.3.23
reference: Mark 3:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: ig
  text: O wee kpọọ ha ka ha bịakwute ya, jiri ilu na-agwa ha, sị, “Olee otú Setan pụrụ isi chụpụ Setan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: kpọọ ha ka ha bịakwute ya
  rationale: Nkebi a na-egosi na Jizọs kpọrọ ha ka ha bịaruo ya nso tupu ọ gwa ha okwu; nsụgharị a na-egosikwa usoro ihe ndị ahụ n'Igbo nkịtị.
- source_word: ἐν παραβολαῖς
  choice: jiri ilu
  rationale: N'okwu ndị a, παραβολαί bụ okwu ntụnyere ma ọ bụ ihe atụ e ji akụzi ihe. “Jiri ilu” bụ ụzọ dị nkenke, nke kwụ ọtọ, ma bụrụkwa nke ndị na-asụ Igbo na-aghọta nke ọma.
- source_word: ἔλεγεν
  choice: na-agwa ha
  rationale: Ụdị imperfect nke ngwaa Grik na-egosi okwu na-aga n'ihu; “na-agwa ha” na-echekwa echiche ahụ n'Igbo.
- source_word: Πῶς δύναται
  choice: Olee otú ... pụrụ isi
  rationale: Nke a na-egosi ajụjụ gbasara ikike ma ọ bụ ihe ga-ekwe omume, ma na-echekwa ike ajụjụ arụmụka ahụ.
- source_word: Σατανᾶς
  choice: Setan
  rationale: E degharịrị aha ahụ n'ụdị a na-ejikarị ede ya n'Igbo.
- source_word: ἐκβάλλειν
  choice: chụpụ
  rationale: “Chụpụ” na-enye echiche nke ịchụ mmụọ ọjọọ pụọ, dịka ngwaa a si arụ ọrụ n'akụkụ Akwụkwọ Mak a.
theological_decisions:
- issue: Ike ajụjụ Jizọs jụrụ banyere Setan imegide onwe ya
  choice: 'E debere ya dịka ajụjụ arụmụka: “Olee otú Setan pụrụ isi chụpụ Setan?”'
  alternative: “Setan ò nwere ike ịchụpụ Setan?”
  rationale: Ajụjụ Grik ahụ na-ajụ otú ihe dị otú ahụ ga-esi kwe omume. Nsụgharị a na-echekwa mgbagwoju anya na ike ajụjụ ahụ n'emeghị ka nkọwa onye nsụgharị bụrụ akụkụ nke amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi “O wee...” dabara n'akụkọ na-aga n'ihu, ebe “na-agwa ha” na-egosipụta omume okwu na-aga n'ihu.
