  text: καὶ Ἰούδαν ⸀Ἰσκαριώθ, ὃς καὶ παρέδωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/019.yaml
  text: and Judas Iscariot[a], who also betrayed him.
translation:
  language: ig
  text: na Judas Iskarịọt[a], onye rara ya nye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye nyefere ya.” Ngwaa Grik ahụ nwere ike ịpụta “inyefe” ma ọ bụ “nyefe mmadụ”; ebe a, a họọrọ “rara ya nye” n'ihi na ihe Judas mere Jizọs nwere echiche nke nrara n'ọnọdụ akụkọ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: na
  rationale: Njikọ nkịtị nke jikọtara aha ikpeazụ a na ndepụta ndị bu ya ụzọ.
- source_word: Ἰούδαν
  choice: Judas
  rationale: E depụtaghachiri aha mmadụ ahụ n'ụdị a maara nke ọma n'Igbo.
- source_word: Ἰσκαριώθ
  choice: Iskarịọt
  rationale: Ọ bụ aha mgbakwunye Judas; ebe mmalite na nkọwa ya na-ejighị n'aka n'ebe a, idegharị ụda aha ahụ ka mma karịa ịkọwa ya n'ụzọ a na-apụghị ịkwado.
- source_word: ὃς
  choice: onye
  rationale: Okwu nnọchi aha a na-amalite nkebiokwu na-akọwa Judas.
- source_word: καὶ
  choice: —
  rationale: N'usoro Igbo a, echiche καί nke na-agbakwụnye njirimara ọzọ dị na nkebiokwu ahụ n'onwe ya; itinye “kwa” ga-ada ka a na-ekwu na e nwere onye ọzọ rarakwara Jizọs nye.
- source_word: παρέδωκεν
  choice: rara ... nye
  rationale: Ọ bụ ezie na ngwaa Grik pụtara n'ụzọ sara mbara ‘inyefe,’ mgbe Judas bụ onye mere ya megide Jizọs, okwu Igbo a na-ezipụta n'ụzọ ebumpụta ụwa echiche nke nrara dị n'ọnọdụ akụkọ ahụ.
- source_word: αὐτόν
  choice: ya
  rationale: Okwu nnọchi aha ihe e mere ihe na-ezo aka na Jizọs.
theological_decisions:
- issue: Otú e si sụgharị παραδίδωμι mgbe ọ na-ekwu banyere ihe Judas mere Jizọs
  choice: rara ya nye
  alternative: nyefere ya n'aka ndị ọzọ
  rationale: Ngwaa ahụ n'onwe ya nwere ike ịpụta inyefe mmadụ, ma n'akụkọ Oziọma ebe Judas bụ onye mere ihe ahụ megide Jizọs, ọ bụ nrara nye ka ọnọdụ ahụ na-egosi. Ihe odide ukwu na-egosipụta nke a, ebe nkọwa ala peeji na-echekwa nkọwa sara mbara nke okwu Grik.
translation_notes:
  register: Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “rara ya nye” mee ka ahịrịokwu ahụ bụrụ nke ebumpụta ụwa, ma e debere nkọwa nkịtị nke ngwaa Grik n'ala peeji.
