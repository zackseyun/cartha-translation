  rationale: The revision changes only the rendering of κηρύσσειν from “ikwusa ozi” to “ikwusa.” This removes an object not stated in the Greek while preserving natural Standard Igbo. The footnote is correspondingly reversed so that the former idiomatic wording remains available as a lexical alternative. The textual-variant footnote is retained unchanged.
