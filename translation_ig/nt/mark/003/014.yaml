base_translation:
  language: en
  yaml_path: translation/nt/mark/003/014.yaml
  text: And he appointed twelve[a], so that they might be with him and so that he might send them out to preach[b],
translation:
  language: ig
  text: O wee họpụta mmadụ iri na abụọ[a], ka ha na ya nọrọ, ka o wee ziga ha ikwusa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agbakwụnye, “ndị ọ kpọkwara ndịozi.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “ikwusa ozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: họpụta
  rationale: N’agbanyeghị na ngwaa a pụtara n'ụzọ nkịtị ‘ime,’ n’ebe a ọ na-egosi ịhọrọ ma doo mmadụ maka ọrụ; ‘họpụta’ bụ Igbo doro anya nke na-egosipụta nke a n’etinyeghị nkọwa karịrị ihe odide ahụ.
- source_word: δώδεκα
  choice: mmadụ iri na abụọ
  rationale: Grik kwuru naanị ‘iri na abụọ,’ ma n’Igbo, ịgbakwunye ‘mmadụ’ na-eme ka ahịrịokwu bụrụ nke eke ma doo anya, n’agbanyeghị na ihe odide Grik etinyeghị aha ndị ahụ ma ọ bụ utu aha ‘ndịozi.’
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: ka ha na ya nọrọ
  rationale: Nke a na-egosipụta nzube nke ἵνα tinyere subjunctive n’Igbo dị mfe ma bụrụ nke eke.
- source_word: ἀποστέλλῃ
  choice: ka o wee ziga ha
  rationale: ‘Ziga’ na-edobe isi echiche nke izipụ mmadụ maka ọrụ, n’emeghị ka utu aha ‘ndịozi’ bata n’ebe ọ na-adịghị n’ihe odide SBLGNT.
- source_word: κηρύσσειν
  choice: ikwusa ozi
  rationale: ‘Ikwusa ozi’ na-egosipụta omume ikwupụta ihe n’ihu ọha nke κηρύσσειν pụtara, ma na-ada nke ọma n’Igbo nke oge a. Ihe ọzọ kwe omume bụ ‘ikwusa.’
theological_decisions:
- issue: Ma a ga-etinye utu aha ndịozi n’isi ihe odide
  choice: Etinyeghị ‘ndịozi’ n’isi ihe odide.
  alternative: Ụfọdụ ihe odide nwere, ‘ndị ọ kpọkwara ndịozi.’
  rationale: Ihe odide SBLGNT e nyere kwuru naanị na ọ họpụtara mmadụ iri na abụọ. Ịghara itinye ‘ndịozi’ na-edobe nsụgharị ahụ n’ihe odide bụ isi, ebe ndetu ala na-echekwa ọdịiche dị n’ihe odide ụfọdụ.
translation_notes:
  register: 'Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro nzube abụọ dị na Grik: ịnọnyere Jizọs na ịbụ ndị e zigara ikwusa. A hapụrụ rikoma ikpeazụ n’ihi na amaokwu a na-aga n’ihu n’amaokwu na-esote.'
