base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: ig
  text: Mgbe ndị nke ya nụrụ[a], ha pụrụ ka ha jide ya, n’ihi na ha na-ekwu[b], “Uche ya apụọla ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ezinụlọ ya,” “ndị nke ya,” ma ọ bụ “ndị nọ ya nso.” Nkebiokwu Grik a bụ akpaala okwu; ọ pụrụ izo aka n’ezinụlọ Jizọs ma ọ bụ ndị nọ ya nso.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Ọ naghị achịkwa onwe ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: ndị ya na ha dị nso
  rationale: Nkebiokwu Grik a bụ akpaala okwu nke nwere ike izo aka n’ezinụlọ ya, ndị nke ya, ma ọ bụ ndị ya na ha na-akpachi anya. Nsụgharị a na-edobe obosara ihe ọ pụrụ ịpụta n’etinyeghị ‘ezinụlọ’ kpọmkwem n’amaokwu ahụ.
- source_word: ἀκούσαντες
  choice: Mgbe ... nụrụ akụkọ ahụ
  rationale: Aorist participle a na-egosi oge ma ọ bụ ihe mere tupu omume sochirinụ. ‘Nụrụ akụkọ ahụ’ bụ Igbo doro anya ma na-egosi na ha nụrụ banyere ihe ndị a kọrọ n’okirikiri amaokwu ahụ.
- source_word: ἐξῆλθον
  choice: ha pụrụ
  rationale: Ọ na-egosi na ha si ebe ha nọ pụọ ma ọ bụ malite njem ịga ime ihe ahụ; ‘ha pụrụ’ bụ okwu Igbo dị mkpirikpi ma kwekọọ n’usoro akụkọ ahụ.
- source_word: κρατῆσαι
  choice: ijide ya
  rationale: κρατέω pụtara ijide mmadụ ma ọ bụ were ike jide ya. ‘Ijide ya’ na-edobe ike okwu ahụ n’emeghị ka ọ bụrụ njide ndị iwu kpọmkwem.
- source_word: ἔλεγον
  choice: ha nọ na-ekwu
  rationale: Imperfect a nwere ike igosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwughachi; ‘ha nọ na-ekwu’ na-egosipụta akụkụ a nke ngwaa ahụ.
- source_word: ἐξέστη
  choice: Isi adịghị ya mma
  rationale: N’ebe a, okwu ahụ na-ebo ya ebubo na uche ya ezughị ike ma ọ bụ na ọ naghị achị onwe ya nke ọma. Akpaala okwu Igbo a bụ nke a na-aghọta n’ụzọ nkịtị ma ghara iji okwu ọgwụ ma ọ bụ nchọpụta ọrịa siri ike karịa isi mmalite ahụ.
theological_decisions:
- issue: Ndị οἱ παρ’ αὐτοῦ bụ
  choice: ndị ya na ha dị nso
  alternative: ezinụlọ ya; ndị nke ya; ndị ya na ha na-akpachi anya
  rationale: Ọ bụ ezie na ihe gbara amaokwu a gburugburu na-akwado na ha nwere ike ịbụ ezinụlọ Jizọs, okwu Grik ahụ ekwughị njikọ ọbara kpọmkwem. Ya mere, isi ederede na-edobe nghọta ahụ ghe oghe, ebe nkọwa ala peeji na-egosi nhọrọ ndị ọzọ.
- issue: Ihe ἐξέστη pụtara
  choice: Isi adịghị ya mma
  alternative: Ọ naghị achịkwa onwe ya; uche ya apụọla ya
  rationale: Nsụgharị ahụ na-egosi ebubo banyere ọnọdụ uche ma na-edobe ya dị ka ihe ndị ahụ na-ekwu, ọ bụghị dị ka nkwubi okwu onye na-akọ akụkọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. A họọrọ ‘ndị ya na ha dị nso’ iji chekwaa ihe okwu Grik ahụ nwere ike ịpụta, a họpụtakwara ‘Isi adịghị ya mma’ dị ka akpaala okwu Igbo nkịtị maka ebubo ἐξέστη.
