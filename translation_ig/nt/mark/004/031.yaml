  text: ὡς ⸀κόκκῳ σινάπεως, ὃς ὅταν σπαρῇ ἐπὶ τῆς γῆς, ⸂μικρότερον ὂν⸃ πάντων τῶν ⸀σπερμάτων τῶν ἐπὶ τῆς γῆς—
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: ig
  text: Ọ dị ka mkpụrụ mọstad[a], nke, mgbe a kụrụ ya n’ala, dị nta karịa[b] mkpụrụ niile dị n’ala—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “otu ọka mọstad.”
    reason: lexical_alternative
  - marker: b
    text: Grik ji okwu ntụnyere “dị nta karịa,” ọ bụghị okwu ogo kachasị “nke kachasị nta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Ọ dị ka
  rationale: Na-ewebata ntụnyere ahụ ma na-emeju okwu Grik ahụ dị mkpirikpi site n’ihe a jụrụ n’amaokwu gara aga.
- source_word: κόκκῳ σινάπεως
  choice: mkpụrụ mọstad
  rationale: Nke a bụ okwu Igbo dị mfe ma bụrụ nke a na-aghọta nke ọma maka mkpụrụ osisi mọstad; κόκκος nwekwara ike ịbụ mkpụrụ nta.
- source_word: ὅταν σπαρῇ
  choice: mgbe a kụrụ ya
  rationale: Na-egosipụta omume ịkụ mkpụrụ n’ụzọ nkịtị ma debe echiche oge na-adịghị akọwapụta otu oge kpọmkwem.
- source_word: ἐπὶ τῆς γῆς
  choice: n’ala
  rationale: N’ọnọdụ ọrụ ugbo a, γῆ bụ ala a na-akụ mkpụrụ, ọ bụghị ụwa dum; Igbo na-asịkarị na a na-akụ mkpụrụ n’ala.
- source_word: μικρότερον ὂν
  choice: dị nta karịa
  rationale: Na-echekwa ogo ntụnyere nke μικρότερον kama ịgbanwe ya ka ọ bụrụ ogo kachasị nta.
- source_word: πάντων τῶν σπερμάτων τῶν ἐπὶ τῆς γῆς
  choice: mkpụrụ niile dị n’ala
  rationale: Na-echekwa ntụnyere sara mbara na nkwughachi nke ihe ndị dị n’ala n’asụsụ Igbo doro anya.
theological_decisions:
- issue: Ogo ntụnyere ma ọ bụ ogo kachasị nta n’ịkọwa mkpụrụ mọstad
  choice: dị nta karịa mkpụrụ niile
  alternative: bụ nke kachasị nta n’ime mkpụrụ niile
  rationale: Grik jiri μικρότερον, nke bụ ogo ntụnyere, ọ bụghị ụdị okwu doro anya nke ogo kachasị nta. Nsụgharị a na-echekwa ụdị okwu ahụ na esemokwu dị n’ime ya n’enweghị ime ka ọ bụrụ nkwupụta sayensị a haziri ọhụrụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji “kụọ mkpụrụ n’ala” mee ka okwu ọrụ ugbo daa ka Igbo nkịtị, ebe a na-echekwa ntụnyere Grik na akara nkwụsị na-egosi na ahịrịokwu ahụ gara n’ihu n’amaokwu na-esote.
