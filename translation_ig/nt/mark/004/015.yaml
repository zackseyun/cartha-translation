source:
  edition: SBLGNT
  text: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν ὅπου σπείρεται ὁ λόγος, καὶ ὅταν ἀκούσωσιν ⸀εὐθὺς ἔρχεται ὁ Σατανᾶς καὶ αἴρει τὸν λόγον τὸν ἐσπαρμένον ⸂εἰς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: ig
  text: 'Ndị a bụkwa ndị nọ n''akụkụ ụzọ, ebe a na-agha okwu ahụ: mgbe ha nụrụ okwu ahụ, Setan na-abịa ozugbo wee wepụ okwu ahụ nke a ghara n''ime ha.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwu ahụ a ghara banye n'ime ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδόν
  choice: Ndị a bụkwa ndị nọ n'akụkụ ụzọ
  rationale: “Ndị a” na-egosi ndị Jizọs na-akọwa; “bụkwa” na-eburu njikọ dị nro nke δέ. “N'akụkụ ụzọ” na-egosipụta παρά + accusative n'ụzọ doro anya ma kwekọọ n'ihe atụ banyere ịgha mkpụrụ.
- source_word: ὅπου σπείρεται ὁ λόγος
  choice: ebe a na-agha okwu ahụ
  rationale: A hapụrụ σπείρεται n'ụdị na-akọghị onye na-eme ihe (“a na-agha”), ebe “okwu ahụ” na-echekwa nkwughachi na ihe atụ nke λόγος.
- source_word: ὅταν ἀκούσωσιν
  choice: mgbe ha nụrụ ya
  rationale: Nkebiokwu a na-egosi ihe na-eme mgbe ọ bụla ndị a nụrụ okwu ahụ. “Ya” na-eme ka Igbo bụrụ nke eke, ebe ihe ha nụrụ doro anya site n'okwu bu ya ụzọ.
- source_word: εὐθὺς ἔρχεται ὁ Σατανᾶς
  choice: Setan na-abịa ozugbo
  rationale: “Ozugbo” na-echekwa ngwa ngwa nke εὐθύς, ebe “Setan” bụ aha/onye iro e kwuru dịka onye na-eme ihe n'amaokwu ahụ.
- source_word: καὶ αἴρει τὸν λόγον
  choice: wepụ okwu ahụ
  rationale: “Wepụ” na-egosipụta isi echiche αἴρω nke iwepụ ihe, n'etinyeghị ike pụrụ iche dị ka “napụ n'ike” nke Grik ekwughị kpọmkwem.
- source_word: τὸν ἐσπαρμένον εἰς αὐτούς
  choice: okwu ahụ a ghara n'ime ha
  rationale: Nkebiokwu a na-akọwa “okwu ahụ”; “n'ime ha” na-echekwa ntụziaka/ọnọdụ nke εἰς αὐτούς n'etinyeghị “obi” nke na-adịghị n'ederede Grik.
theological_decisions:
- issue: Setan dịka onye na-eme ihe n'onwe ya
  choice: A sụgharịrị ὁ Σατανᾶς dịka “Setan,” onye na-abịa wee wepụ okwu ahụ.
  alternative: Ịsụgharị ya dịka echiche na-abụghị onye, dịka “onye iro” n'ozuzu.
  rationale: N'okwu Grik, aha ahụ na-egosi onye kpọmkwem na-eme ihe. Nsụgharị ahụ anaghị eme ka Setan bụrụ naanị ihe atụ ma ọ bụ echiche na-enweghị ụdị onye.
- issue: Ebe a ghara okwu ahụ
  choice: “n'ime ha”
  alternative: “n'etiti ha” ma ọ bụ itinye “n'ime obi ha”
  rationale: εἰς αὐτούς nwere ike ibu echiche nke ịbanye n'ime ha. “N'ime ha” na-echekwa okwu ahụ n'enweghị ịkọwapụta “obi” nke isi mmalite ahụ ekwughị, ma ọ bụ ịtụgharị ya dịka naanị ịnọ n'etiti ìgwè mmadụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A nọgidere n'ihe atụ nke ịgha mkpụrụ site n'iji “ịgha okwu,” ma zere ịgbakwunye “mkpụrụ” ma ọ bụ “obi” ebe ederede Grik na-ekwughị ha.
