revisions:
- from: 'Ndị a bụkwa ndị nọ n''akụkụ ụzọ ebe a na-agha okwu ahụ: mgbe ha nụrụ ya, Setan na-abịa ozugbo, wepụ okwu ahụ a ghara n''ime ha.[a]'
  to: 'Ndị a bụkwa ndị nọ n''akụkụ ụzọ, ebe a na-agha okwu ahụ: mgbe ha nụrụ okwu ahụ, Setan na-abịa ozugbo wee wepụ okwu ahụ nke a ghara n''ime ha.[a]'
  rationale: The revision corrects the Igbo verbal coordination, clarifies the repeated referent of “hear,” and explicitly marks the Greek adjectival participle as a relative phrase. It retains the source’s ambiguity between “in them” and “into them” in the footnote, without introducing “heart” or weakening Satan’s personal agency.
  reviewer_model: gpt-5.6-terra
