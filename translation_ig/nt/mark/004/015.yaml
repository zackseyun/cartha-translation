    text: Ma ọ bụ, “okwu ahụ a ghara banye n'ime ha.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the Igbo verbal coordination, clarifies the repeated referent of “hear,” and explicitly marks the Greek adjectival participle as a relative phrase. It retains the source’s ambiguity between “in them” and “into them” in the footnote, without introducing “heart” or weakening Satan’s personal agency.
