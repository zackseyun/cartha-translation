  text: καὶ καθεύδῃ καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος ⸀βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: ig
  text: Ọ na-ehi ụra, na-etetakwa, abalị na ehihie; mkpụrụ ahụ na-epupụta ma na-eto[a], ma ya onwe ya amaghị otú mkpụrụ ahụ si eto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-eto ogologo” ma ọ bụ “na-adị ogologo.” Ngwaa nke abụọ na-egosi kpọmkwem ịgbatị ma ọ bụ ịba ogologo.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, okwu Grik ahụ na-ekwu, “otu ya onwe ya na-amaghị.” N’ebe a, ọ na-egosi na onye ahụ amaghị otú mkpụrụ ahụ si eto.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ
  choice: ọ na-ehi ụra
  rationale: Ụdị ngwaa a na-akọ ihe na-eme ugboro ugboro n’ilu ahụ; ‘na-ehi ụra’ bụ ụzọ Igbo dị ndụ si kwuo ya.
- source_word: ἐγείρηται
  choice: na-etetakwa
  rationale: N’ebe a, ngwaa ahụ pụtara mmadụ isi n’ụra teta, ọ bụghị mbilite n’ọnwụ. ‘-kwa’ na-ejikọta ya nke ọma na ‘na-ehi ụra.’
- source_word: νύκτα καὶ ἡμέραν
  choice: abalị na ehihie
  rationale: Nke a na-egosi usoro oge na-aga n’ihu, abalị na ehihie na-esochi ibe ha.
- source_word: ὁ σπόρος
  choice: mkpụrụ ahụ
  rationale: Mkpọaha ahụ nwere ihe ngosi na-ezo aka kpọmkwem ná mkpụrụ a kụrụ n’ilu ahụ.
- source_word: βλαστᾷ
  choice: na-epupụta
  rationale: ‘Na-epupụta’ na-egosi mmalite uto nke mkpụrụ n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: μηκύνηται
  choice: na-eto
  rationale: Ngwaa Grik ahụ nwere echiche nke ịgbatị ma ọ bụ ito ogologo, ma ‘na-eto’ bụ okwu Igbo kacha eke n’ọnọdụ a; nkọwa ala peeji na-edebe nghọta ahụ kpọmkwem.
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: ma ya onwe ya amaghị otú o si eme
  rationale: ‘Ma’ na-egosi ọdịiche dị n’etiti uto mkpụrụ ahụ na amaghị ama nwoke ahụ; ‘ya onwe ya’ na-edebe nkwusi ike nke αὐτός, ebe ‘otú o si eme’ na-eme ka echiche ahụ doo anya n’Igbo.
theological_decisions:
- issue: Onye ma ọ bụ ihe na-eme ka mkpụrụ ahụ too n’ilu a
  choice: Ahịrịokwu ahụ hapụrụ ụzọ mkpụrụ si eto n’amaghị ama nke onye kụrụ ya, n’agwaghị kpọmkwem onye na-eme ka o too.
  alternative: Ikwu hoo haa na Chineke bụ onye na-eme ka o too, ma ọ bụ ịkọwa ya naanị dị ka usoro okike.
  rationale: Amaokwu ahụ na-emesi amaghị ama nke onye kụrụ mkpụrụ na uto mkpụrụ ahụ ike. Nsụgharị ahụ ekwesịghị ịgbakwunye onye na-eme uto ahụ ma ọ bụ dozie esemokwu nke akụkọ ahụ na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, sụgharịa ya. Usoro ‘na-ehi ụra, na-etetakwa’ na-edebe omume na-eme ugboro ugboro; ‘abalị na ehihie’ na-edebe ụda na usoro okwu Grik. E tinyere akara ala peeji n’ebe okwu ha na-akọwa dị.
