- from: Ọ na-ehi ụra, na-etetakwa, abalị na ehihie; mkpụrụ ahụ na-epupụta ma na-eto[a], ma ya onwe ya amaghị otú o si eme[b].
  to: Ọ na-ehi ụra, na-etetakwa, abalị na ehihie; mkpụrụ ahụ na-epupụta ma na-eto[a], ma ya onwe ya amaghị otú mkpụrụ ahụ si eto[b].
  rationale: The revision resolves the only substantive ambiguity by identifying the seed as the subject of its growth in the final clause. It preserves the emphatic “ya onwe ya,” the concessive relationship, and the verse’s deliberate silence about the agency or mechanism of growth. Footnote b is adjusted to explain the Greek idiom accurately in natural Igbo.
