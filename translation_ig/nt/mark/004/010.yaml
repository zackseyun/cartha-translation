  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: ig
  text: Mgbe ọ nọ na nzuzo[a], ndị nọ ya gburugburu, ya na Ndị Iri na Abụọ, nọ na-ajụ ya banyere ilu ndị ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ọ nọ nanị ya.” Okwu Grik ahụ nwere ike izo aka n’ịnọ n’ebe mmadụ ole na ole nọ, pụọ n’ìgwè mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: Mgbe
  rationale: N'Igbo, “Mgbe” na-ewebata oge ihe mere n'ụzọ ebumpụta ụwa; ịgbakwunye “Na” n'isi ahịrịokwu a agaghị ada nke ọma, ọ bụ ezie na njikọ akụkọ Mak ka dị na usoro ahịrịokwu ahụ.
- source_word: ἐγένετο κατὰ μόνας
  choice: ọ nọ nanị ya[a]
  rationale: Nke a na-egosipụta na Jizọs nọ n'ebe nzuzo, pụọ n'ihu ìgwè mmadụ. Ihe e dere n'okpuru peeji na-eme ka o doo anya na okwu ahụ apụtaghị na ọ dịghị onye ọzọ ya na ya nọ.
- source_word: ἠρώτων
  choice: nọ na-ajụ
  rationale: Ụdị ngwaa imperfect na-egosi omume gara n'ihu ma ọ bụ e mere ugboro ugboro; “nọ na-ajụ” na-echekwa akụkụ ahụ n'Igbo dị mfe.
- source_word: οἱ περὶ αὐτὸν
  choice: ndị nọ ya gburugburu
  rationale: Nke a na-echekwa okwu Grik nke na-ezo aka n'òtù sara mbara nke ndị na-eso Jizọs, ọ bụghị naanị ịnọ ya nso n'ụzọ anụ ahụ.
- source_word: σὺν τοῖς δώδεκα
  choice: ha na Ndị Iri na Abụọ
  rationale: Nke a na-egosi na òtù ahụ na Ndị Iri na Abụọ nọkọrọ, ma ọ naghị eme ka òtù abụọ ahụ bụrụ naanị otu aha.
- source_word: τὰς παραβολάς
  choice: banyere ilu ndị ahụ
  rationale: “Ilu” bụ okwu Igbo a na-ejikarị atụgharị παραβολή; “ndị ahụ” na-echekwa ụbara na njirimara nke okwu Grik.
theological_decisions:
- issue: Ndị bụ ndị jụrụ Jizọs ajụjụ
  choice: Ndị ọzọ nọ Jizọs gburugburu, tinyere Ndị Iri na Abụọ, jụrụ ya.
  alternative: Ọ bụ naanị Ndị Iri na Abụọ jụrụ ya; ma ọ bụ òtù ọzọ dị iche nke Ndị Iri na Abụọ so ya.
  rationale: Usoro okwu οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα na-egosi n'ụzọ kacha kwe omume na e nwere ndị ọzọ nọ Jizọs gburugburu, Ndị Iri na Abụọ sokwa ha. Nsụgharị ahụ anaghị ekpochapụ ọdịiche dị n'etiti ha.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. “Ndị Iri na Abụọ” na-arụ ọrụ dị ka aha e ji mara òtù ahụ; “ilu” bụ okwu nkịtị maka akụkọ ntụnyere Jizọs.
