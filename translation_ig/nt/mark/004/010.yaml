    text: Ma ọ bụ, “mgbe ọ nọ nanị ya.” Okwu Grik ahụ nwere ike izo aka n’ịnọ n’ebe mmadụ ole na ole nọ, pụọ n’ìgwè mmadụ.
    reason: lexical_alternative
  revision_rationale: The revision renders κατὰ μόνας as “na nzuzo,” which fits its private-setting sense without creating an unnecessary contradiction with the followers and the Twelve who are present. It also repairs the awkward coordination of the questioning group while preserving the Greek syntax’s distinction between those around Jesus and the Twelve. The footnote supplies “nanị ya” as a viable literal alternative but explains the idiom with appropriate caution.
