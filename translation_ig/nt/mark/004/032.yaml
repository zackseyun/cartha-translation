  to: Ma mgbe a ghachara ya, ọ na-epulite wee ghọọ nke ka ihe ọkụkụ niile dị n’ubi ibu, na-ewepụtakwa alaka ukwu, ka ụmụ nnụnụ nke eluigwe[a] nwee ike ịrụ akwụ[b] n’okpuru ndò ya.
