id: MRK.4.32
reference: Mark 4:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: ig
  text: Ma mgbe a ghachara ya, ọ na-epulite wee ghọọ nke ka ihe ọkụkụ niile dị n’ubi ibu, na-ewepụtakwa alaka ukwu, ka ụmụ nnụnụ nke eluigwe[a] nwee ike ịrụ akwụ[b] n’okpuru ndò ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụ nnụnụ nke mbara igwe,” ma ọ bụ, dịka a na-asụkarị, “ụmụ nnụnụ nke ikuku.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ibi” ma ọ bụ “ịnọ.” Okwu a nwere ike na-emegharị oyiyi Agba Ochie nke nnụnụ na-enweta ebe obibi n’osisi ukwu (dịka ọmụmaatụ, Ezikiel 17:23; Daniel 4:12).
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: a ghara ya
  rationale: Ụdị a na-egosi na a na-agha mkpụrụ ahụ, ma na-ejigide njikọ ya na ihe atụ banyere mkpụrụ.
- source_word: ἀναβαίνει
  choice: ọ na-epulite
  rationale: N’ihe gbasara ihe ọkụkụ, okwu a na-egosi mkpụrụ na-esi n’ala apụta; ‘epulite’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: γίνεται μεῖζον πάντων τῶν λαχάνων
  choice: too ibu karịa ihe ọkụkụ niile dị n’ubi
  rationale: Nke a na-ejigide echiche nke uto na ntụnyere dị na Grik. ‘Ihe ọkụkụ dị n’ubi’ sara mbara karịa ‘akwụkwọ nri’ ma dabara na λάχανα.
- source_word: ποιεῖ κλάδους μεγάλους
  choice: na-ewepụtakwa alaka ukwu
  rationale: Nke a bụ ụzọ Igbo si ekwu n’ụzọ eke na osisi na-amịpụta ma ọ bụ na-ewepụta alaka.
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: n’okpuru ndò ya
  rationale: ‘Ndò’ na-egosi ebe nnụnụ na-enweta nchebe pụọ n’anyanwụ ma kwekọọ n’oyiyi amaokwu ahụ.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ụmụ nnụnụ nke eluigwe
  rationale: Nke a na-esochi okwu Grik nso ma na-ejigide ụda Akwụkwọ Nsọ; ihe ọzọ a pụrụ ikwu bụ ‘ụmụ nnụnụ nke mbara igwe’ ma ọ bụ ‘ụmụ nnụnụ nke ikuku.’
- source_word: κατασκηνοῦν
  choice: ịrụ akwụ
  rationale: Ọ bụ ezie na okwu Grik nwekwara ike ịpụta ‘ibi’ ma ọ bụ ‘ịnọ,’ ‘ịrụ akwụ’ na-egosi omume nnụnụ n’ụzọ Igbo dị mfe nghọta, na-enweghị ịkọwa ihe oyiyi ahụ n’ụzọ nkà mmụta okpukpe.
theological_decisions:
- issue: Oyiyi Akwụkwọ Nsọ mbụ banyere nnụnụ na-enweta ebe obibi n’alaka osisi ukwu
  choice: E debere oyiyi ahụ n’amaokwu n’enweghị ịkọwa kpọmkwem ihe ọ na-anọchi anya.
  alternative: Ịsụgharị κατασκηνοῦν naanị dịka ‘ibi’ iji mee ka njikọ ya na Ezikiel 17:23 na Daniel 4:12 pụta ìhè karịa.
  rationale: O yikarịrị ka okwu ahụ na-emegharị oyiyi dị n’Agba Ochie, ma Grik akọwaghị ihe oyiyi ahụ. Ya mere, nsụgharị ahụ ekwesịghị itinye nkọwa nkà mmụta okpukpe n’ime amaokwu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. ‘Epulite,’ ‘ihe ọkụkụ dị n’ubi,’ na ‘ịrụ akwụ’ na-eme ka ihe atụ ọrụ ugbo na oyiyi nnụnụ doo onye nkịtị anya, ebe nkọwa ala peeji na-echekwa ụzọ ndị ọzọ e si aghọta okwu Grik.
