    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ruo n’ókè ha nwere ike ịnụ ya” ma ọ bụ “dị ka ike ha nwere ịnụ ya hà.”
    reason: lexical_alternative
  revision_rationale: The revision retains every source-level meaning while using idiomatic Standard Igbo. It keeps “ịnụ ya,” rather than interpreting it as understanding, and repairs footnote b so that its alternatives are grammatical, unambiguous, and faithful to καθὼς ἠδύναντο ἀκούειν.
