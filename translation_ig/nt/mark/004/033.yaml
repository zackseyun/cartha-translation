  text: Καὶ τοιαύταις παραβολαῖς πολλαῖς ἐλάλει αὐτοῖς τὸν λόγον, καθὼς ἠδύναντο ἀκούειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/033.yaml
  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: ig
  text: Ọ na-eji ọtụtụ ilu ndị dị otú a agwa ha okwu ahụ,[a] dịka ha nwere ike ịnụ ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ozi ahụ” ma ọ bụ “nkuzi ahụ,” n’ọnọdụ “okwu ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ruo n’ókè ha nwere ike ịnụ ya” ma ọ bụ “dị ka ike ha nwere ịnụ ya hà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις
  choice: ndị dị otú ahụ
  rationale: Nke a na-arụtụ aka n’ụdị ilu ndị e kwuru tupu ya, ma na-edobe echiche nke ‘ilu ndị yiri ndị a.’
- source_word: παραβολαῖς
  choice: ilu
  rationale: ‘Ilu’ bụ okwu Igbo a maara nke ọma maka ụzọ nkuzi Jizọs si eji ihe atụ na akụkọ eme ihe.
- source_word: πολλαῖς
  choice: ọtụtụ
  rationale: Ọ na-egosi ọnụ ọgụgụ buru ibu ma na-akọwa ‘ilu’ n'ụzọ doro anya.
- source_word: ἐλάλει
  choice: na-agwa
  rationale: Ụdị ngwaa imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro; ‘na-agwa’ na-edobe akụkụ ahụ n’Igbo eke.
- source_word: αὐτοῖς
  choice: ha
  rationale: Ọ bụ ndị a na-agwa okwu; usoro ‘na-agwa ha’ bụ Igbo eke.
- source_word: τὸν λόγον
  choice: okwu ahụ
  rationale: ‘Okwu ahụ’ na-edobe okwu Grik λόγος na ụda ya n’Oziọma Mak, ma ọ pụkwara ịpụta ozi ma ọ bụ nkuzi Jizọs.
- source_word: καθὼς
  choice: ruo n’ókè
  rationale: N’ebe a, καθὼς na-egosi nha ma ọ bụ ogo ikike ha, ọ bụghị naanị ntụnyere nkịtị.
- source_word: ἠδύναντο
  choice: ha pụrụ
  rationale: Nke a na-egosi ikike ha nwere n’oge ahụ, n’enweghị ịgbakwunye ihe karịrị ihe ederede kwuru.
- source_word: ἀκούειν
  choice: ịnụ ya
  rationale: ‘Ịnụ’ na-edobe isi ihe ἀκούω pụtara; ‘ya’ na-arụtụ aka n’okwu ahụ. A sụgharịghị ya ‘ịghọta’ ka a ghara idozi ihe ederede hapụrụ ka ọ bụrụ ihe nwere nghọta abụọ.
theological_decisions:
- issue: Ihe τὸν λόγον pụtara n’ozi nkuzi Jizọs
  choice: okwu ahụ
  alternative: ozi ahụ; nkuzi ahụ
  rationale: ‘Okwu ahụ’ na-edobe okwu na ụda Grik n’enweghị ime ka ọ bụrụ naanị otu nkọwa okwukwe; ‘ozi ahụ’ na ‘nkuzi ahụ’ ka bụ nkọwa ndị nwere ike ịdị.
- issue: Ihe ἀκούειν na-egosi
  choice: ịnụ ya
  alternative: ịghọta ya; ịnabata ya
  rationale: Ederede kwuru maka ikike ịnụ. Ọ bụ ezie na nke ahụ nwere ike ịgụnye nghọta na nnabata, nsụgharị a anaghị etinye nkọwa ndị ahụ kpọmkwem n’isi ederede.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke kwụ ọtọ ma dị ùgwù. Usoro ‘O jikwa … na-agwa’ na-egosipụta omume na-aga n’ihu, ebe ‘ruo n’ókè’ na-eme ka echiche nha dị na καθὼς doo anya n’Igbo.
