revisions:
- from: Ndị ọzọ bụ ndị a ghara mkpụrụ n’etiti ogwu[a]; ndị a bụ ndị nụrụ okwu ahụ[b],
  to: Ndị ọzọ bụ ndị a kụrụ n’etiti ogwu[a]; ndị a bụ ndị nụrụ okwu ahụ[b],
  rationale: The revision corrects the passive sense of σπειρόμενοι while preserving the seed metaphor and its deliberate identification of people with what is sown. It also makes the first footnote a valid, parallel alternative for εἰς τὰς ἀκάνθας. No theological interpretation has been added.
