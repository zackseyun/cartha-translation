id: MRK.4.18
reference: Mark 4:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀ἄλλοι εἰσὶν οἱ εἰς τὰς ἀκάνθας σπειρόμενοι· ⸂οὗτοί εἰσιν⸃ οἱ τὸν λόγον ⸀ἀκούσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: ig
  text: Ndị ọzọ bụ ndị a kụrụ n’etiti ogwu[a]; ndị a bụ ndị nụrụ okwu ahụ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime ogwu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ozi ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: Ndị ọzọ
  rationale: Ọ na-arụ ọrụ dị ka aha ma na-egosi ìgwè ọzọ dị iche na ndị a kọwara tupu ha.
- source_word: εἰς τὰς ἀκάνθας
  choice: n’etiti ogwu
  rationale: Ọ bụ ụzọ Igbo si ekwu n'ụzọ eke na mkpụrụ dara ma ọ bụ a ghara ya n'ebe ogwu dị, ebe ọ ka na-edobe echiche nke εἰς n'ọnọdụ ọrụ ugbo a.
- source_word: ἀκάνθας
  choice: ogwu
  rationale: Okwu a bụ okwu Igbo a na-aghọta nke ọma maka osisi ma ọ bụ ahịhịa nwere ogwu n'ilu a.
- source_word: σπειρόμενοι
  choice: ndị a ghara mkpụrụ
  rationale: Ọ na-edobe participle dị na passive na ihe atụ nke mmadụ dị ka mkpụrụ a ghara, kama ịkọwa ihe atụ ahụ n'ụzọ ọzọ.
- source_word: οὗτοί εἰσιν
  choice: ndị a bụ
  rationale: Ọ na-edobe usoro nkwupụta njirimara nke na-amalite nkọwa ilu ahụ.
- source_word: οἱ ... ἀκούσαντες
  choice: ndị nụrụ
  rationale: Ụdị a na-egosi na ịnụ ahụ mere tupu ihe ndị ga-esochi, ma bụrụkwa Igbo dị mfe ma dị eke.
- source_word: τὸν λόγον
  choice: okwu ahụ
  rationale: Ọ na-edobe okwu Baịbụl a na-ahụkarị na njikọ ya na ozi a na-ekwusa, n'enweghị ịgbasa nkọwa ya.
theological_decisions:
- issue: Njirimara ihe atụ nke ndị mmadụ dị ka mkpụrụ n'ime nkọwa ilu ahụ
  choice: 'A hapụrụ ihe atụ ahụ kpọmkwem: “ndị a ghara mkpụrụ n’etiti ogwu.”'
  alternative: “ndị nọ n’ala ogwu” ma ọ bụ “ndị natara ozi n’etiti ogwu.”
  rationale: Grik ahụ gara n'ihu n'ịkọwa ndị mmadụ dịka mkpụrụ a ghara. Idebe ihe atụ ahụ na-echekwa usoro edemede na mgbagwoju anya e bu n'obi, n'enweghị itinye nkọwa okpukpe ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “A ghara mkpụrụ” na-edobe okwu ọrụ ugbo na ihe atụ nke mkpụrụ; “okwu ahụ” na-edobe ụda Baịbụl ma footnote na-enye “ozi ahụ” dịka ụzọ ọzọ.
