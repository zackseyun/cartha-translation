review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the groups, the thorn setting, the resumptive identification, and the prior act of hearing. However, “ndị a ghara mkpụrụ” does not express the Greek passive participle “those being sown”; it instead makes the people agents who sow seed. “Ndị a kụrụ n’etiti ogwu” appropriately retains the passive parabolic metaphor.
  naturalness: “Ndị a kụrụ n’etiti ogwu” is natural, clear Standard Igbo for the metaphorical agricultural expression. The footnote alternative should be a phrase parallel to the translated phrase, not the imperative-like “banye n’ime ogwu.”
  terminology: “okwu ahụ” is an appropriate biblical rendering of τὸν λόγον, with “ozi ahụ” as a valid lexical alternative. “ogwu” is suitable in this parable context.
  issues:
  - severity: high
    issue: The rendering of σπειρόμενοι reverses the participle’s voice.
    rationale: “Ndị a ghara mkpụrụ” means people who sowed seed, whereas σπειρόμενοι is passive and identifies people metaphorically as those sown. Recast it as “ndị a kụrụ.”
  - severity: medium
    issue: Footnote a is not a grammatically parallel alternative rendering.
    rationale: “banye n’ime ogwu” is an imperative (‘enter/go into the thorns’), not an alternative for the prepositional phrase. “n’ime ogwu” supplies the intended lexical alternative.
  revised_text: Ndị ọzọ bụ ndị a kụrụ n’etiti ogwu[a]; ndị a bụ ndị nụrụ okwu ahụ[b],
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime ogwu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ozi ahụ.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the passive sense of σπειρόμενοι while preserving the seed metaphor and its deliberate identification of people with what is sown. It also makes the first footnote a valid, parallel alternative for εἰς τὰς ἀκάνθας. No theological interpretation has been added.
