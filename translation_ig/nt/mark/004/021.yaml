  terminology: “Oriọna” accurately renders λύχνος; “nkata,” clarified by a cultural footnote, is an acceptable rendering for μόδιος; and “ihe ndọba oriọna” conveys λυχνία well. The footnotes retain the personification and the ancient measuring-container sense without overinterpreting either.
