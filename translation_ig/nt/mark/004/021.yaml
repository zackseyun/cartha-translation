id: MRK.4.21
reference: Mark 4:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: ig
  text: Ọ na-agwa ha, “Ọ̀ bụ na oriọna na-abịa[a] ka e debe ya n'okpuru nkata[b] ma ọ bụ n'okpuru ihe ndina? Ọ́ bụghị ka e debe ya n'elu ihe ndọba oriọna?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “Ọ̀ bụ na oriọna na-abịa ka e debe ya n'okpuru nkata ma ọ bụ n'okpuru ihe ndina?” Asụsụ Grik na-ekwu maka oriọna dịka a ga-asị na ọ bụ onye na-abịa.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ μόδιος, ya bụ ihe e ji atụ ihe kpọrọ nkụ, ma ọ bụ akpa e ji atụ ya; a na-asụgharịkarị ya dịka “nkata e ji atụ ọka.”
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ọ nọkwa na-agwa ha
  rationale: Ụdị ngwaa imperfect na-egosi okwu ọ nọ na-ekwu ma ọ bụ na-ekwughachi n'ime akụkọ ahụ; ‘nọkwa na-agwa’ na-egosipụta nke a n'Igbo nkịtị.
- source_word: Μήτι
  choice: Ọ bụ na ...?
  rationale: Μήτι na-ebute ajụjụ a na-atụ anya azịza ‘mba.’ Usoro ‘Ọ bụ na ...?’ na-edobe ike ajụjụ nkwupụta ahụ n'Igbo.
- source_word: ἔρχεται ὁ λύχνος
  choice: oriọna na-abịa
  rationale: Nke a na-edobe okwu Grik ahụ dị ndụ, nke na-eme ka oriọna dị ka onye na-abịa, kama ịgbanwe ya ozugbo ka ọ bụrụ ‘a na-ebute oriọna.’
- source_word: λύχνος
  choice: oriọna
  rationale: Okwu a na-ezo aka n'oriọna mmanụ a na-ebugharị, ọ bụghị naanị ìhè ya.
- source_word: μόδιον
  choice: nkata
  rationale: μόδιος bụ ihe e ji atụ ihe kpọrọ nkụ, ma nwekwara ike ịpụta akpa ma ọ bụ nkata e ji atụ ya. ‘Nkata’ doro ndị na-agụ ugbu a anya, ebe nkọwa ala peeji na-enye ihe gbasara omenala ya.
- source_word: κλίνην
  choice: ihe ndina
  rationale: κλίνη nwere ike ịbụ akwa ma ọ bụ ihe a na-edina na ya; ‘ihe ndina’ bụ okwu sara mbara ma doo anya n'ọnọdụ ụlọ a.
- source_word: λυχνίαν
  choice: ihe ndọba oriọna
  rationale: λυχνία bụ ihe a haziri kpọmkwem ka a dọba oriọna n'elu ya; nsụgharị a na-edobe ihe oyiyi ahụ n'ụzọ doro anya.
- source_word: ἵνα ... τεθῇ
  choice: ka e debe ya
  rationale: Nke a na-egosipụta ebumnuche dị na ἵνα na passive τεθῇ n'Igbo dị mfe ma dị ndụ.
theological_decisions:
- issue: Ma a ga-edobe ime oriọna ka mmadụ n'okwu ‘oriọna na-abịa,’ ka a ga-asụgharị ya n'ụzọ nkịtị dịka ‘a na-ebute oriọna.’
  choice: 'E debere okwu dị ndụ ahụ: ‘oriọna na-abịa.’'
  alternative: ‘A na-ebute oriọna.’
  rationale: Okwu Jizọs bụ ilu nwere ihe oyiyi siri ike. Idebe active expression ahụ na-anọkwu nso na Grik ma ghara ịkọwa ihe atụ ahụ karịa ihe ederede kwuru.
- issue: Ma articular ὁ λύχνος ga-apụta otu oriọna a maara kpọmkwem ma ọ bụ oriọna n'ozuzu ya.
  choice: A sụgharịrị ya dịka ‘oriọna’ n'echiche izugbe.
  alternative: ‘Oriọna ahụ.’
  rationale: N'okwu ilu a, isiokwu ahụ bụ oriọna ọ bụla n'ozuzu ya, ọ bụghị otu oriọna a kpọtụrụla aha. Igbo achọghịkwa article dịka Bekee iji gosi generic sense.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. A hapụrụ ajụjụ nkwupụta abụọ na ihe oyiyi oriọna ‘na-abịa,’ ebe a kọwara μόδιος n'ala peeji ka isi ederede ghara ịdị arọ.
