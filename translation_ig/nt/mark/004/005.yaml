  text: ⸂καὶ ἄλλο⸃ ἔπεσεν ἐπὶ τὸ πετρῶδες ⸀ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ ⸀εὐθὺς ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: ig
  text: Mkpụrụ ọzọ dakwara n’ala nkume[a], ebe ala dị ntakịrị; o pulitere ozugbo n’ihi na ala ahụ emighị emi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ala okwute.” Okwu Grik na-akọwa ebe nkume dị n’okpuru naanị obere oyi akwa ala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: Mkpụrụ ọzọ
  rationale: Ọ bụ adjective neuter singular e ji dochie aha; ihe gbara ya gburugburu na-egosi na ọ na-ezo aka ná mkpụrụ, ya mere itinye “mkpụrụ” na-eme ka Igbo doo anya.
- source_word: πετρῶδες
  choice: ala nkume
  rationale: Ọ na-akọwa ebe nkume dị n’okpuru obere ala, ọ bụghị naanị ala nwere obere okwute; okwu a dabara n’ihe gbasara ịgha mkpụrụ ma ka na-enye ohere maka nkọwa dị n’ala ala peeji.
- source_word: γῆν πολλήν
  choice: ala na-adịghị ukwuu
  rationale: N’ebe a γῆ bụ ala mkpụrụ na-eto n’ime ya; nsụgharị a na-edobe echiche na ala dị n’ebe ahụ pere mpe.
- source_word: εὐθὺς
  choice: ozugbo
  rationale: Ọ na-egosi na mkpụrụ ahụ pulitere na mberede ma ọ bụ ngwa ngwa; “ozugbo” bụ okwu Igbo nkịtị ma kwụ ọtọ.
- source_word: ἐξανέτειλεν
  choice: o pulitere
  rationale: N’ihe gbasara ihe ọkụkụ, ngwaa a pụtara ịmalite ipụta n’ala; “pulitere” na-enye ihe oyiyi ahụ nke ọma.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: n’ihi na ala ahụ emighị emi
  rationale: διά na infinitive nwere article na-egosi ihe kpatara ya. Nsụgharị a bụ Igbo ebumpụta ụwa ma na-edobe echiche nke obere oyi akwa ala dị n’elu nkume.
- source_word: ὅπου
  choice: ebe
  rationale: Ọ bụ okwu na-egosi ọnọdụ; “ebe” bụ nsụgharị Igbo kacha kwụ ọtọ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma dị ùgwù. A họọrọ usoro okwu ebumpụta ụwa, ma e debe ihe oyiyi ọrụ ugbo na mmekọrịta ihe kpatara ya dị n’asụsụ Grik.
