  text: ⸂καὶ ὅτε ἀνέτειλεν ὁ ἥλιος⸃ ⸀ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/006.yaml
  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: ig
  text: Mgbe anyanwụ wara, ọkụ anyanwụ chagburu ya; n’ihi na o nweghị mgbọrọgwụ, ọ kpọnwụụrụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ kpọrọ nkụ.” Ngwaa Grik ahụ nwere ike ịpụta ịkpọ nkụ ma ọ bụ ịkpọnwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: Mgbe anyanwụ wara
  rationale: Nke a na-egosipụta nkebiokwu oge ahụ n’Igbo dị mfe ma doo anya; “wara” bụ okwu a na-ejikarị ekwu maka ọwụwa anyanwụ.
- source_word: ἐκαυματίσθη
  choice: ọkụ ya chagburu ya
  rationale: Nke a na-egosipụta na okpomọkụ anyanwụ mebiri ihe ọkụkụ ahụ, dịka ngwaa Grik nke pụtara ịkpọ ọkụ ma ọ bụ ịcha ọkụ.
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: ebe ọ bụkwa na o nweghị mgbọrọgwụ
  rationale: Ọ na-echekwa ihe kpatara ya nke διά na infinitive na-egosi, ma na-eji usoro okwu Igbo sitere n’okike.
- source_word: ἐξηράνθη
  choice: ọ kpọnwụụrụ
  rationale: “Kpọnwụọ” dabara n’onyonyo ihe ọkụkụ ma na-ekpuchi echiche nke ịkpọ nkụ na ịnwụọ n’ihi enweghị mmiri ma ọ bụ mgbọrọgwụ.
