translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị ugwu ma dị mfe nghọta mee ihe. A kwagara akara nkọwa ụkwụ [a] n’akụkụ “ọ kpọnwụụrụ,” n’ihi na nkọwa ahụ metụtara ἐξηράνθη, ọ bụghị ọwụwa anyanwụ.
