review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the root metaphor, the short-lived character of the hearers, affliction/persecution arising because of the word, and the immediacy of their response. However, “ọ bụrụ na” is conditional (“if”) rather than the temporal force of the Greek genitive absolute (“when”), and “kwa” in “enweghịkwa” unnecessarily suggests “also.”
  naturalness: The wording is generally clear Standard Igbo. Recasting the duration phrase as “ha bụ ndị na-adị naanị nwa oge” is more idiomatic than “ha na-adịgide naanị nwa oge,” since the latter can sound like it asserts endurance. “E mesịa, mgbe … bilitere” gives a natural temporal sequence.
  terminology: “Mgbọrọgwụ,” “ahụhụ,” “mkpagbu,” “okwu ahụ,” and “ozugbo” are appropriate. “Ha na-adapụ” retains the contextual sense of falling away without specifying a doctrine of final salvation. The footnote is adjusted to state the lexical range more idiomatically and without presenting the passive nuance as the only sense.
  issues:
  - severity: medium
    issue: Conditional wording for a temporal construction
    rationale: '“Ọ bụrụ na” means “if,” whereas γενομένης θλίψεως ἢ διωγμοῦ introduces the circumstance temporally: “when affliction or persecution arises.”'
  - severity: low
    issue: Unnecessary additive particle
    rationale: The “kwa” in “Ha enweghịkwa” can imply an additional assertion not marked by καὶ οὐκ in this context; simple “Ha enweghị” is closer and smoother.
  - severity: low
    issue: Duration expression can be clearer
    rationale: “Ha na-adịgide naanị nwa oge” may be heard as ‘they endure for only a while.’ “Ha bụ ndị na-adị naanị nwa oge” more directly renders πρόσκαιροι, ‘short-lived/temporary.’
  revised_text: Ha enweghị mgbọrọgwụ n'ime onwe ha; kama ha bụ ndị na-adị naanị nwa oge. E mesịa, mgbe ahụhụ ma ọ bụ mkpagbu bilitere n'ihi okwu ahụ, ha na-adapụ ozugbo.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha na-asụ ngọngọ,” “a na-eme ka ha sụọ ngọngọ,” ma ọ bụ “ha na-ewe iwe n'ihi ya.” Ngwaa Grik a nwekwara ike ịpụta ịsụ ngọngọ, iwe mmadụ, ma ọ bụ ime ka mmadụ sụọ ngọngọ.
    reason: lexical_alternative
