revisions:
- from: Ha enweghịkwa mgbọrọgwụ n'ime onwe ha, kama ha na-adịgide naanị nwa oge. Mgbe ahụ, ọ bụrụ na ahụhụ ma ọ bụ mkpagbu ebilite n'ihi okwu ahụ, ha na-adapụ ozugbo.[a]
  to: Ha enweghị mgbọrọgwụ n'ime onwe ha; kama ha bụ ndị na-adị naanị nwa oge. E mesịa, mgbe ahụhụ ma ọ bụ mkpagbu bilitere n'ihi okwu ahụ, ha na-adapụ ozugbo.[a]
  rationale: The revision restores the temporal meaning of the Greek construction, removes an unneeded additive nuance, and makes the expression for πρόσκαιροι more natural while preserving the agricultural metaphor, repeated “word” terminology, and the contextual rendering of σκανδαλίζονται. The footnote continues to preserve the verb’s lexical ambiguity.
