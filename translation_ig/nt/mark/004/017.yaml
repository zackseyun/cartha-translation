source:
  edition: SBLGNT
  text: καὶ οὐκ ἔχουσιν ῥίζαν ἐν ἑαυτοῖς ἀλλὰ πρόσκαιροί εἰσιν, εἶτα γενομένης θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον ⸀εὐθὺς σκανδαλίζονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: ig
  text: Ha enweghị mgbọrọgwụ n'ime onwe ha; kama ha bụ ndị na-adị naanị nwa oge. E mesịa, mgbe ahụhụ ma ọ bụ mkpagbu bilitere n'ihi okwu ahụ, ha na-adapụ ozugbo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha na-asụ ngọngọ,” “a na-eme ka ha sụọ ngọngọ,” ma ọ bụ “ha na-ewe iwe n'ihi ya.” Ngwaa Grik a nwekwara ike ịpụta ịsụ ngọngọ, iwe mmadụ, ma ọ bụ ime ka mmadụ sụọ ngọngọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: mgbọrọgwụ
  rationale: Nke a na-edobe ihe atụ nke mkpụrụ na ala n'ụzọ nkịtị, n'etinyeghị echiche dịka ‘mgbọrọgwụ miri emi’ nke Grik ekwughị.
- source_word: ἐν ἑαυτοῖς
  choice: n'ime onwe ha
  rationale: Ọ na-egosipụta echiche reflexive nke Grik n'ụzọ doro anya ma bụrụkwa Igbo a na-aghọta nke ọma.
- source_word: πρόσκαιροί
  choice: ha na-adịgide naanị nwa oge
  rationale: Nkebiokwu a na-egosi na ha na-anọ naanị ruo oge dị mkpirikpi, n'etinyeghị echiche banyere àgwà ha nke okwu Grik ekwughị.
- source_word: εἶτα
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe na-esote n'usoro akụkọ ahụ n'ụzọ dị mfe ma kwekọọ na Igbo nkịtị.
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: ọ bụrụ na ahụhụ ma ọ bụ mkpagbu ebilite
  rationale: ‘Ahụhụ’ na-egosipụta nsogbu na nrụgide nke θλῖψις, ebe ‘mkpagbu’ na-egosipụta ịchụso mmadụ n'ihi nkwenye ya. ‘Ebilite’ na-ebute echiche nke ọnọdụ ahụ ịmalite.
- source_word: διὰ τὸν λόγον
  choice: n'ihi okwu ahụ
  rationale: ‘Okwu ahụ’ na-edobe okwu a na-emegharị n'ilu ahụ ma na-ezo aka n'ozi a kwusara.
- source_word: εὐθὺς
  choice: ozugbo
  rationale: Nke a na-edobe ngwa ngwa e ji mara asụsụ Mak ma bụrụkwa okwu Igbo doro anya.
- source_word: σκανδαλίζονται
  choice: ha na-adapụ
  rationale: N'ọnọdụ a, okwu ahụ na-egosi na ndị nabatara okwu ahụ anaghị anọgide mgbe nrụgide bịara. ‘Na-adapụ’ na-egosipụta ịdị njọ nke ịkwụsị iso ụzọ ahụ n'agbanyeghị na ọ naghị ekpebi ajụjụ nkà mmụta okpukpe banyere nzọpụta ikpeazụ.
theological_decisions:
- issue: Ụzọ e si sụgharịa σκανδαλίζονται n'ọnọdụ metụtara ịnọgide n'eso ụzọ
  choice: ha na-adapụ
  alternative: ha na-asụ ngọngọ; a na-eme ka ha sụọ ngọngọ; ha na-ewe iwe n'ihi ya
  rationale: Akụkọ gbara amaokwu a gburugburu na-ekwu banyere ndị nabatara okwu ahụ ná mmalite ma kwụsị mgbe ahụhụ ma ọ bụ mkpagbu bịara. ‘Ha na-adapụ’ na-egosipụta nkwụsị ahụ n'emeghị nkwubi okwu karịrị ihe ederede kwuru banyere ọnọdụ nzọpụta ha ikpeazụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debeere ihe atụ ‘mgbọrọgwụ’ na okwu a na-emegharị, ‘okwu ahụ.’ E tinyere nkọwa ala peeji iji chekwaa ọtụtụ nghọta σκανδαλίζονται nwere.
