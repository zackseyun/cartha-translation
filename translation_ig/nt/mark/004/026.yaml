revisions:
- from: 'Ọ nọkwa na-ekwu, “Alaeze Chineke dị otu a: ọ dị ka mgbe otu nwoke tụbara mkpụrụ n’elu ala[a],”'
  to: Ọ nọkwa na-ekwu, “Alaeze Chineke dị ka mmadụ fesa mkpụrụ n’ala[a],”
  rationale: The revision removes the awkward doubled comparative construction, uses the generic Standard Igbo term “mmadụ” for ἄνθρωπος, and renders the agricultural action idiomatically as scattering seed. It keeps the comparison syntactically open, as the Greek does, because its completion belongs to Mark 4:27.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:24Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperfect ἔλεγεν, βασιλεία τοῦ θεοῦ, and the agricultural setting. However, “ọ dị ka mgbe” makes ὡς primarily temporal (“when”) and, together with “dị otu a,” is cumbersome. The generic ἄνθρωπος is more naturally represented by “mmadụ” in Standard Igbo; it does not require a specifically male referent in this parabolic comparison. “n’ala” is the normal agricultural expression for ἐπὶ τῆς γῆς.
  naturalness: “Alaeze Chineke dị ka mmadụ fesa mkpụrụ n’ala” is natural, concise Standard Igbo and retains the intentionally unfinished comparison that continues in the following verse. “Fesa” appropriately conveys scattering/casting seed in an agricultural context.
  terminology: “Alaeze Chineke” is established and suitable. “Mmadụ” is a faithful generic rendering of ἄνθρωπος here, while “fesa mkpụrụ” retains the sowing-by-scattering image without importing a theological interpretation.
  issues:
  - severity: medium
    issue: 'The phrase “dị otu a: ọ dị ka mgbe” is awkward and over-specifies the comparison as temporal.'
    rationale: Οὕτως ... ὡς introduces a compressed comparison, not necessarily a temporal “when” clause. The present Igbo wording is less idiomatic and risks obscuring the open comparison.
  - severity: low
    issue: “otu nwoke” unnecessarily narrows the generic representative figure.
    rationale: Ἄνθρωπος commonly denotes a human person generically. In Standard Igbo, “mmadụ” is the natural unmarked equivalent and preserves the parabolic generality.
  - severity: low
    issue: “tụbara” is less idiomatic for broadcasting seed than “fesa.”
    rationale: While βάλλω literally involves casting, “fesa mkpụrụ” naturally expresses scattering seed over soil and preserves the agricultural imagery.
  revised_text: Ọ nọkwa na-ekwu, “Alaeze Chineke dị ka mmadụ fesa mkpụrụ n’ala[a],”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Alaeze Chineke dị ka a ga-asị na mmadụ kụrụ mkpụrụ n’ala.” Ntule a na-aga n’ihu n’amaokwu na-esote, ebe usoro okwu Grik dị mkpirikpi.
    reason: alternative_reading
  revision_rationale: The revision removes the awkward doubled comparative construction, uses the generic Standard Igbo term “mmadụ” for ἄνθρωπος, and renders the agricultural action idiomatically as scattering seed. It keeps the comparison syntactically open, as the Greek does, because its completion belongs to Mark 4:27.
