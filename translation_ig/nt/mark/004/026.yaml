  yaml_path: translation/nt/mark/004/026.yaml
  text: 'And he was saying[c][b][a], “The kingdom of God is like this: as when a man casts the seed upon the ground,”'
translation:
  language: ig
  text: Ọ nọkwa na-ekwu, “Alaeze Chineke dị ka mmadụ fesa mkpụrụ n’ala[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Alaeze Chineke dị ka a ga-asị na mmadụ kụrụ mkpụrụ n’ala.” Ntule a na-aga n’ihu n’amaokwu na-esote, ebe usoro okwu Grik dị mkpirikpi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ọ nọkwa na-ekwu
  rationale: Ụdị imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwughachi; ‘nọ na-ekwu’ na-echekwa akụkụ a, ebe ‘-kwa’ na-egosipụta Καί n’usoro akụkọ.
- source_word: Οὕτως
  choice: dị otu a
  rationale: Ọ na-ewebata ụzọ e si atụnyere alaeze Chineke n’ilu ahụ, ma bụrụkwa okwu Igbo dị mfe ma kwụ ọtọ.
- source_word: βασιλεία τοῦ θεοῦ
  choice: Alaeze Chineke
  rationale: Nke a bụ ntụgharị a maara nke ọma, nke nwere ike ịgụnye ma ọchịchị Chineke ma ebe ọchịchị ya ruru, n’enweghị imechi nghọta ahụ n’otu akụkụ naanị.
- source_word: ὡς
  choice: ọ dị ka mgbe
  rationale: Ọ na-ewebata ntụnyere nke echiche ya gara n’ihu n’amaokwu na-esote; ntụgharị a na-echekwa ọdịdị mepere emepe nke ahịrịokwu Grik.
- source_word: ἄνθρωπος
  choice: otu nwoke
  rationale: N’ebe a, okwu ahụ bụ onye nnọchiteanya e kwuru n’ụdị nwoke; ‘otu nwoke’ na-echekwa nke ahụ n’Igbo nkịtị.
- source_word: βάλῃ
  choice: tụbara
  rationale: Ọ na-echekwa onyonyo nkịtị nke βάλλω, ‘ịtụ/ịfesa,’ ma ka dabara n’omume ịkụ mkpụrụ n’ubi.
- source_word: τὸν σπόρον
  choice: mkpụrụ
  rationale: ‘Mkpụrụ’ bụ okwu Igbo ebumpụta ụwa maka mkpụrụ a na-akụ; ọ na-arụkwa ọrụ dịka aha mkpokọta n’enweghị mkpa ikwughachi njirimara Grik ahụ n’ụzọ na-adịghị eke.
- source_word: ἐπὶ τῆς γῆς
  choice: n’elu ala
  rationale: N’ọnọdụ ọrụ ubi a, γῆ bụ ala a na-akụ, ọ bụghị ụwa dum; ‘n’elu ala’ na-egosikwa ἐπί nke ọma.
theological_decisions:
- issue: Ntule mmeghe nke ahịrịokwu ya na-aga n’ihu ruo amaokwu na-esote
  choice: 'Idowe ‘dị otu a: ọ dị ka mgbe...’ ka ntụnyere ahụ ghara imechi n’amaokwu a'
  alternative: ‘Alaeze Chineke dị ka otu nwoke kụrụ mkpụrụ n’ala.’
  rationale: Grik Οὕτως...ὡς dị mkpirikpi ma ntụnyere ya na-aga n’ihu n’amaokwu 27. Idowe nhazi a na-echekwa esemokwu na mmepe nke isi mmalite kama ịkọwapụta ya karịa ihe e dere.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Alaeze Chineke’ mee ihe n’ihi na ọ bụ okwu a maara nke ọma, ma a zere ịkọwa ya nanị dịka ebe ma ọ bụ naanị dịka omume ọchịchị. Akara ụkwụ [a] dị n’ahịrị isi.
