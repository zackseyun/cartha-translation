  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: ig
  text: Ọ malitekwara izi ihe ọzọ n'akụkụ oke osimiri. Ìgwè mmadụ dị nnọọ ukwuu gbakọtara n'ebe ọ nọ,[a] nke mere na ọ banyere n'ụgbọ mmiri wee nọdụ ala n'ime ya, n'elu mmiri. Ìgwè mmadụ ahụ niile nọkwa n'akụkụ oke osimiri, n'elu ala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, a pụkwara ịsị, “ìgwè mmadụ dị nnọọ ukwuu na-agbakọta n'ebe ọ nọ.” Mak na-ejikarị oge ugbu a akọ ihe gara aga iji mee ka akụkọ dị ka ihe na-eme n'ihu onye na-agụ ya.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, Jizọs nọ n'ụgbọ mmiri n'elu mmiri, ebe ìgwè mmadụ ahụ nọgidere n'ala.
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: ọzọ
  rationale: Na-egosi na Jizọs maliteghachiri ọrụ izi ihe; nke a bụ okwu Igbo dị mfe ma kwekọọ na ntụgharị uche Grik.
- source_word: ἤρξατο διδάσκειν
  choice: Ọ malitekwara ... izi ihe
  rationale: Na-echekwa usoro mmalite nke ngwaa ahụ, ebe '-kwara' jikọtara ya na ihe ndị mere tupu nke a.
- source_word: παρὰ τὴν θάλασσαν
  choice: n'akụkụ oké osimiri
  rationale: Na-egosi ebe dị n'akụkụ mmiri ahụ ma na-edobe θάλασσα dịka 'oké osimiri' kama ịkọwa ya dịka ọdọ mmiri Galili.
- source_word: συνάγεται
  choice: gbakọtara bịakwute ya
  rationale: Igbo nkịtị na-achọkarị oge gara aga n'akụkọ; 'bịakwute ya' na-echekwa ntụgharị πρὸς αὐτόν, ebe 'gbakọtara' na-egosi nzukọ ìgwè mmadụ.
- source_word: ὄχλος πλεῖστος
  choice: Ìgwè mmadụ dị nnọọ ukwuu
  rationale: Na-echekwa ike nke πλεῖστος n'Igbo doro anya ma bụrụ nke e ji eme ihe ugbu a.
- source_word: ὥστε
  choice: nke mere na
  rationale: Na-egosi nsonaazụ nke ịdị ukwuu nke ìgwè mmadụ ahụ.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: ọ banyere n'ụgbọ mmiri
  rationale: Ọ bụ ntụgharị Igbo ebumpụta ụwa nke ịbanye n'ụgbọ mmiri, ma na-edobe omume ahụ tupu ịnọdụ ala.
- source_word: καθῆσθαι ἐν τῇ θαλάσσῃ
  choice: nọdụ n'elu mmiri
  rationale: Na-egosi na ọ nọ ọdụ n'ụgbọ mmiri n'elu mmiri, ọ bụghị na ahụ ya nọ kpọmkwem n'ime mmiri.
- source_word: πᾶς ὁ ὄχλος
  choice: Ìgwè mmadụ ahụ niile
  rationale: Na-echekwa echiche mkpokọta na izu oke nke πᾶς.
- source_word: ἐπὶ τῆς γῆς
  choice: n'elu ala
  rationale: Na-edobe ọdịiche doro anya n'etiti ebe Jizọs nọ n'elu mmiri na ebe ìgwè mmadụ nọ n'ala.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. A họọrọ ahịrịokwu dị mkpirikpi iji zere mgbagwoju anya nke usoro Grik ogologo, ma e debere ọdịiche dị n'etiti oké osimiri/mmiri na ala. A sụgharịrị historical present dịka oge gara aga n'isiokwu ahụ maka Igbo ebumpụta ụwa, ma debe nhọrọ nkịtị ahụ na ndetu [a].
