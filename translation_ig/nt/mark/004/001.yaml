revisions:
- from: Ọ malitekwara ọzọ izi ihe n'akụkụ oké osimiri. Ìgwè mmadụ dị nnọọ ukwuu gbakọtara bịakwute ya,[a] nke mere na ọ banyere n'ụgbọ mmiri nọdụ n'elu mmiri. Ìgwè mmadụ ahụ niile nọkwa n'akụkụ oké osimiri, n'elu ala.[b]
  to: Ọ malitekwara izi ihe ọzọ n'akụkụ oke osimiri. Ìgwè mmadụ dị nnọọ ukwuu gbakọtara n'ebe ọ nọ,[a] nke mere na ọ banyere n'ụgbọ mmiri wee nọdụ ala n'ime ya, n'elu mmiri. Ìgwè mmadụ ahụ niile nọkwa n'akụkụ oke osimiri, n'elu ala.[b]
  rationale: The revision removes redundant verbal wording for the crowd, retains the source's sense that it gathered to Jesus, and clarifies that Jesus sat inside the boat while it was on the water. The historical-present alternative remains available in footnote a, while the narrative past remains natural in Standard Igbo.
