  text: καὶ ἐδίδασκεν αὐτοὺς ἐν παραβολαῖς πολλά καὶ ἔλεγεν αὐτοῖς ἐν τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/002.yaml
  text: 'And he was teaching them many things in parables[a], and in his teaching he was saying to them:'
translation:
  language: ig
  text: 'Ọ nọ na-akụziri ha ọtụtụ ihe n’ilu[a], ọ nọkwa na-agwa ha n’ozizi ya, sị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘Ọ kụziiri ha ọtụtụ ihe n’ilu.’ Okwu Grik πολλά nwere ike ịpụta ‘ọtụtụ ihe’ ma ọ bụ, n’ụzọ dị mkpirikpi, ‘ọtụtụ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: Ọ nọ na-akụziri
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu n’oge ahụ; ‘ọ nọ na-akụziri’ na-edobe akụkụ akụkọ a.
- source_word: ἐν παραβολαῖς
  choice: site n’ilu
  rationale: Nke a na-egosi ụzọ ma ọ bụ ihe e ji akụzi; ‘site n’ilu’ bụ Igbo nkịtị ma doo anya.
- source_word: πολλά
  choice: ọtụtụ ihe
  rationale: Neuter plural a nwere ike ịbụ ihe a na-akụzi; ‘ọtụtụ ihe’ na-egosipụta obosara nke nkuzi ahụ.
- source_word: ἔλεγεν
  choice: ọ nọkwa na-agwa
  rationale: Imperfect a na-egosi okwu na-aga n’ihu ma na-eduga n’okwu kpọmkwem nke na-esote.
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: mgbe ọ na-akụzi ha
  rationale: Nsụgharị a na-enye nkebiokwu Greek ahụ n’Igbo dị mfe ma na-ejikọta okwu na-esote na ọrụ nkuzi ya.
- source_word: καὶ
  choice: Ọ ... kwa
  rationale: E gosipụtara njikọ abụọ nke καί n’usoro Igbo eke, na-enweghị ịmanye ‘na’ na mmalite amaokwu.
- source_word: αὐτοὺς / αὐτοῖς
  choice: ha / ha
  rationale: Igbo na-eji ‘ha’ mee ma onye a na-akụziri ma onye a na-agwa; ọnọdụ ya n’ahịrịokwu na-egosi ọrụ ụtọasụsụ ya.
