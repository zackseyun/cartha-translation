- from: Geenụ ntị! Lee, onye na-agha mkpụrụ pụrụ ịgha mkpụrụ.[a]
  to: Geenụ ntị! Lee[a], onye na-agha mkpụrụ gara pụọ ịgha mkpụrụ.
  rationale: The revision explicitly renders ἐξῆλθεν as “gara pụọ,” avoiding the modal reading that “pụrụ” can create before an infinitive. It retains the plural imperative, the marked attention particle, the role designation ‘the sower,’ and the purpose construction. The alternative note now limits itself to the lexical alternative for ἰδού and does not introduce ‘onye ahụ.’
