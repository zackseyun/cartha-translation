  text: Ἀκούετε. ἰδοὺ ἐξῆλθεν ὁ ⸀σπείρων σπεῖραι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/003.yaml
  text: Listen! Behold[a], the sower went out to sow.
translation:
  language: ig
  text: Geenụ ntị! Lee[a], onye na-agha mkpụrụ gara pụọ ịgha mkpụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Geenụ ntị! Legodị, onye na-agha mkpụrụ gara pụọ ịgha mkpụrụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούετε
  choice: Geenụ ntị!
  rationale: Ọ bụ iwu dị n'ụdị onye nke abụọ ọtụtụ, na-akpọ ndị na-ege ntị ka ha tinye uche. “Geenụ ntị!” bụ Igbo nkịtị nke na-egosipụta ike iwu ahụ.
- source_word: ἰδού
  choice: Lee,
  rationale: Okwu a na-adọta uche n'ihe na-esote. “Lee” na-echekwa ọrụ ya dị ka oku ka onye na-ege ntị hụ ihe a na-akọ.
- source_word: ἐξῆλθεν
  choice: pụrụ
  rationale: Ngwaa a na-egosi na onye ahụ si ebe ọ nọ pụọ. “Pụrụ” bụ ụzọ dị nkenke ma kwekọọ n'Igbo isi kwuo mmegharị ahụ gaa n'èzí.
- source_word: ὁ σπείρων
  choice: onye na-agha mkpụrụ
  rationale: Ọ bụ participle nwere article nke na-arụ ọrụ dị ka aha onye. “Onye na-agha mkpụrụ” na-echekwa ọdịdị okwu Grik ahụ ma doo ndị na-agụ anya.
- source_word: σπεῖραι
  choice: ịgha mkpụrụ
  rationale: Infinitive a na-egosi nzube ọ pụrụ. “Ịgha mkpụrụ” na-egosipụta nzube ahụ n'ụzọ doro anya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ọtụtụ mmadụ “Geenụ” mee ka ọnụọgụ dị n'iwu Grik pụta ìhè; “Lee” na-edowe oku pụrụ iche ἰδού na-akpọ uche.
