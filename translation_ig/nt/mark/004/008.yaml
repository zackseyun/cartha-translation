  to: Mkpụrụ ndị ọzọ dakwara n’ala ọma[a], ha wee na-amị mkpụrụ, na-eto elu ma na-abawanye, na-amị mkpụrụ ruru okpukpu iri atọ, okpukpu iri isii, na okpukpu otu narị.
