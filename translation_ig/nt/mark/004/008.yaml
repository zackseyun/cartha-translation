    text: Ma ọ bụ, “Ndị ọzọ dakwara n’ala ọma,” ebe e si n’ihe ndị gbara ya gburugburu ghọta na ọ bụ mkpụrụ ka a na-ekwu.
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s faithful rendering of the source while making the yield idiom natural and explicit in Standard Igbo. The footnote continues to preserve the source’s substantival adjective and clarifies that the implicit referent is seed.
