  text: καὶ ⸀ἄλλα ἔπεσεν εἰς τὴν γῆν τὴν καλήν, καὶ ἐδίδου καρπὸν ἀναβαίνοντα καὶ ⸀αὐξανόμενα, καὶ ἔφερεν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: ig
  text: Mkpụrụ ndị ọzọ dakwara n’ala ọma[a], ha wee na-amị mkpụrụ, na-eto elu ma na-abawanye, na-amị mkpụrụ ruru okpukpu iri atọ, okpukpu iri isii, na okpukpu otu narị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndị ọzọ dakwara n’ala ọma,” ebe e si n’ihe ndị gbara ya gburugburu ghọta na ọ bụ mkpụrụ ka a na-ekwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Mkpụrụ ndị ọzọ
  rationale: Ọ bụ adjective neuter plural e ji dị ka noun, nke na-ezo aka ná mkpụrụ a kpọtụrụla aha n’ilu ahụ. E tinyere “mkpụrụ” ka okwu ahụ doo anya ma daa nke ọma n’Igbo.
- source_word: γῆν τὴν καλήν
  choice: ala ọma
  rationale: N’ọnọdụ ọrụ ugbo a, γῆ pụtara ala kwesịrị ekwesị maka ịkụ mkpụrụ, ọ bụghị obodo ma ọ bụ mpaghara sara mbara.
- source_word: ἐδίδου καρπὸν
  choice: ha wee na-amị mkpụrụ
  rationale: Imperfect ahụ na-egosi ihe na-aga n’ihu. “Na-amị mkpụrụ” bụ ụzọ Igbo si ekwu nke a n’ụzọ ebumpụta ụwa.
- source_word: ἀναβαίνοντα
  choice: na-eto elu
  rationale: Participial a na-akọ uto ihe a kụrụ ka ọ na-arị elu; “na-eto elu” na-edobe echiche ahụ n’ụzọ doro anya.
- source_word: αὐξανόμενα
  choice: na-abawanye
  rationale: A họọrọ okwu dị iche na “na-eto elu” iji chekwaa ọdịiche dị n’etiti ịrị elu na ịba ụba.
- source_word: ἔφερεν
  choice: na-amịkwa
  rationale: Imperfect ahụ na-egosi ịmị mkpụrụ na-aga n’ihu, “-kwa” na-ejikọkwa nsonaazụ a na usoro uto e kwuru tupu ya.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: okpukpu iri atọ, okpukpu iri isii, na okpukpu otu narị
  rationale: N’ọnọdụ ọrụ ugbo, ọnụ ọgụgụ ndị a na-egosi oke mkpụrụ e nwetara ma e jiri ya tụnyere nke a kụrụ; “okpukpu” na-eme ka nke ahụ doo anya n’Igbo.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E ji “ha” laghachi n’azụ na “mkpụrụ ndị ọzọ” dịka plural, ebe “mkpụrụ” n’Igbo nwekwara ike ịrụ ọrụ dịka aha mkpokọta.
