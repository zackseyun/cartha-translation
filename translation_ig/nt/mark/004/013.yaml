source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς· Οὐκ οἴδατε τὴν παραβολὴν ταύτην, καὶ πῶς πάσας τὰς παραβολὰς γνώσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: ig
  text: Ọ sịrị ha, “Ụnụ aghọtaghị ilu a? Oleezi otú unu ga-esi ghọta ilu niile?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya n’ụzọ gbasoro okwu Grik karịa: “Ụnụ amaghị ilu a? Olee otú unu ga-esi mara ilu niile?” Okwu Grik ndị a nwere ike ịpụta “ịma,” ma n’ebe a ha na-ekwu maka ịghọta ihe ilu pụtara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ọ sịrị
  rationale: Igbo normally uses the narrative past in this setting; retaining a literal present would sound less natural, while the narrative event remains clear.
- source_word: οἴδατε
  choice: Ụnụ aghọtaghị
  rationale: Though the verb can mean ‘know,’ with a parable it concerns grasping its meaning, so ‘aghọtaghị’ conveys the contextual sense naturally.
- source_word: παραβολὴν
  choice: ilu
  rationale: ‘Ilu’ is the established, natural Igbo term for a parable or figurative teaching in this context.
- source_word: ταύτην
  choice: a
  rationale: The demonstrative ‘a’ directly identifies the parable just told.
- source_word: καὶ πῶς
  choice: Oleezi otú
  rationale: '‘-zi’ naturally marks the inferential force: if they do not understand this one, how then will they understand the rest?'
- source_word: πάσας τὰς παραβολὰς
  choice: ilu niile
  rationale: This straightforwardly represents the totalizing plural, ‘all the parables.’
- source_word: γνώσεσθε
  choice: unu ga-esi ghọta
  rationale: The future expression with ‘ghọta’ communicates coming to understand the parables and pairs naturally with the first question.
theological_decisions:
- issue: Relation between οἴδατε and γνώσεσθε
  choice: Both are translated with forms of ‘ghọta’ (understand).
  alternative: Translate one or both with ‘ma’ (know).
  rationale: The immediate issue is comprehension of the meaning of parables, not mere acquaintance or possession of information. The footnote preserves the lexical alternative.
translation_notes:
  register: Standard Igbo; natural, dignified, and accessible. The main text favors contextual comprehension (‘ghọta’), while the footnote preserves the more formally lexical rendering (‘ma’). The footnote marker is placed after the complete saying.
