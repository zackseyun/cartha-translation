  yaml_path: translation/nt/mark/004/040.yaml
  text: And he said to them[c][b][a], “Why are you so fearful? Do you still have no faith?”
translation:
  language: ig
  text: O wee sị ha, “Gịnị mere unu ji atụ ụjọ[a]? Unu ka na-enweghị okwukwe[b][c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ siri ike karị, “Gịnị mere unu ji bụrụ ndị na-atụ ụjọ?”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Unu enwebeghị okwukwe?”
    reason: lexical_alternative
  - marker: c
    text: N’ebe a, a pụkwara ịghọta “okwukwe” dị ka “ntụkwasị obi.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: O wee
  rationale: Njikọ a na-aga n’ihu n’akụkọ ahụ; “wee” bụ ụzọ Igbo si ejikọta omume sochiri nke gara aga n’ụzọ ebumpụta ụwa.
- source_word: εἶπεν αὐτοῖς
  choice: sị ha
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị mfe isi webata okwu a gwara ọtụtụ mmadụ.
- source_word: Τί δειλοί ἐστε;
  choice: Gịnị mere unu ji atụ ụjọ?
  rationale: Τί na-arụ ọrụ dị ka “gịnị mere,” ebe δειλοί na-egosi egwu nke kwesịrị ịta ha ụta n’ọnọdụ oké ifufe ahụ. Isi ederede zere ịkọwa ya dị ka ikpe zuru ezu banyere agwa ha, ma debere echiche siri ike nke “ndị ụjọ” n’ala ala peeji.
- source_word: οὔπω
  choice: ruo ugbu a
  rationale: Na ajụjụ na-adịghị mma, okwu a na-ebupụta echiche “ọ bụghị ọbụna ruo ugbu a/not yet,” ma na-edobe ntụaka oge dị na Greek.
- source_word: ἔχετε πίστιν
  choice: unu enwebeghị okwukwe
  rationale: Ụdị ajụjụ a na-egosi na okwukwe ka na-adịghị ha. “Okwukwe” bụ okwu Igbo a na-ejikarị sụgharịa πίστις, ebe “ntụkwasị obi” bụkwa nghọta kwe omume n’ọnọdụ a.
theological_decisions:
- issue: πίστις nwere ike ịpụta okwukwe ma ọ bụ ntụkwasị obi n’ọnọdụ a.
  choice: okwukwe
  alternative: ntụkwasị obi
  rationale: Isi ederede jiri “okwukwe” n’ihi na ọ na-edobe okwu Greek n’enweghị ịgbakwunye onye ma ọ bụ ihe a tụkwasịrị obi; ala ala peeji na-egosi nghọta “ntụkwasị obi” nke dabara n’ọnọdụ ahụ.
- issue: Ike ajụjụ οὔπω ἔχετε πίστιν
  choice: Unu enwebeghị okwukwe ruo ugbu a?
  alternative: Unu ka enweghị okwukwe?
  rationale: Nhọrọ isi na-edobe kpọmkwem echiche “not yet” nke οὔπω; ụdị ọzọ bụ ụzọ Igbo dị ire ụtọ nke na-egosipụta otu ịta ụta ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Nhazi ajụjụ abụọ ahụ na-edobe ụda ịba mba nke okwu Greek, ebe ala ala peeji na-echekwa ike pụrụ ịdị na δειλοί, ọdịiche dị na οὔπω, na obosara ihe πίστις pụtara.
