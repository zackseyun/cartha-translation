source:
  edition: SBLGNT
  text: καὶ οὗτοί εἰσιν ⸀ὁμοίως οἱ ἐπὶ τὰ πετρώδη σπειρόμενοι, οἳ ὅταν ἀκούσωσιν τὸν λόγον ⸀εὐθὺς μετὰ χαρᾶς λαμβάνουσιν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/016.yaml
  text: 'And these are likewise the ones sown on the rocky ground: when they hear the word[a], they immediately receive it with joy,'
translation:
  language: ig
  text: 'Ndị a kwa bụ ndị a kụrụ n’ala okwute[a]: mgbe ha nụrụ okwu ahụ, ozugbo ha ji ọṅụ anabata ya,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “n’ala jupụtara na nkume” ma ọ bụ “n’ebe okwute dị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: kwa
  rationale: “Kwa” na-ejikọta ìgwè a na nkọwa gara aga ma na-egosi na nke a bụkwa otu n’ime ụdị ndị e sere n’ilu ahụ.
- source_word: ἐπὶ τὰ πετρώδη
  choice: n’ala okwute
  rationale: Nke a na-egosi ala ebe okwute dị n’okpuru ma na-edobe onyinyo ọrụ ugbo dị n’ilu ahụ n’ụzọ Igbo nkịtị.
- source_word: σπειρόμενοι
  choice: ndị a na-agha
  rationale: A hapụrụ okwu ahụ n’ụdị nnabata ka e wee chekwaa ụzọ ilu ahụ si kpọọ ndị mmadụ ‘ndị a na-agha,’ n’enweghị itinye nkọwa banyere obi ha.
- source_word: τὸν λόγον
  choice: okwu ahụ
  rationale: “Okwu ahụ” na-echekwa okwu e ji meegharị n’ilu ahụ ma na-ezo aka n’ozi a na-ekwusa.
- source_word: εὐθύς
  choice: ozugbo
  rationale: “Ozugbo” na-egosipụta ngwa ngwa εὐθύς ma kwekọọ n’ụzọ Mak si eji okwu a eme ihe ugboro ugboro.
- source_word: μετὰ χαρᾶς
  choice: na-eji ọṅụ
  rationale: Nkebiokwu a na-egosi ọnọdụ obi ha ji nabata okwu ahụ n’ụzọ doro anya ma dịrị Igbo nkịtị.
- source_word: λαμβάνουσιν αὐτόν
  choice: anabata ya
  rationale: “Anabata ya” dabara n’ịnụ na ịnabata ozi, ma ọ naghị agbakwụnye echiche na nnabata ahụ ga-adịgide.
theological_decisions:
- issue: Ihe okwu ‘ndị a na-agha’ na-ezo aka na ya n’ime nkọwa ilu ahụ
  choice: 'E debere okwu ilu ahụ: “ndị a na-agha n’ala okwute.”'
  alternative: “Ndị obi ha yiri ala okwute.”
  rationale: Asụsụ Grik ahụ ka na-eji onyinyo ịgha mkpụrụ akọwa ndị mmadụ. Ịsị na ọ bụ obi ha yiri ala okwute ga-abụ ịgbakwunye nkọwa na-adịghị n’amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. A chekwara onyinyo ilu ahụ na obere ijuanya dị n’ịkpọ ndị mmadụ ihe a na-agha. E tinyere akara nkọwa ala ala peeji ozugbo n’akụkụ okwu ọ na-akọwa.
