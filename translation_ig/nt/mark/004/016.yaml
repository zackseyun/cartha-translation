review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately carries the principal elements of the Greek: the analogical connector (ὁμοίως), the rocky location, hearing “the word,” immediate response, joy, and reception. However, “ndị a na-agha” normally expresses an ongoing passive action (“those who are being sown”) rather than the classificatory/parabolic participle intended here. “Ndị a kụrụ” more naturally represents those sown in that setting while retaining the intentionally striking parabolic imagery.'
  naturalness: The revised sentence uses natural Standard Igbo word order. Moving “ozugbo” before the reception clause gives its scope and Mark’s emphatic immediacy clearer expression.
  terminology: “Okwu ahụ” appropriately retains λόγος as the recurring “word” in the parable, and “ji ọṅụ anabata ya” faithfully and naturally renders “receive it with joy.” “Ala okwute” is a suitable rendering of the rocky ground/places image. The alternative footnote has been adjusted so that its first alternative is idiomatic Igbo.
  issues:
  - severity: medium
    issue: Verbal aspect in “ndị a na-agha”
    rationale: The progressive construction a na-agha suggests people presently being sown. In this explanatory classification, Greek σπειρόμενοι is best represented by the completed/adjectival passive “ndị a kụrụ,” without explaining away the parabolic metaphor.
  - severity: low
    issue: First footnote alternative is not idiomatic
    rationale: “Ala nkume jupụtara” lacks the expected complement and can sound incomplete. “Ala jupụtara na nkume” clearly expresses soil full of stones.
  revised_text: 'Ndị a kwa bụ ndị a kụrụ n’ala okwute[a]: mgbe ha nụrụ okwu ahụ, ozugbo ha ji ọṅụ anabata ya,'
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “n’ala jupụtara na nkume” ma ọ bụ “n’ebe okwute dị.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the misleading progressive sense of “a na-agha” while preserving the source’s parabolic wording rather than substituting an interpretation about human hearts. It also improves placement of “ozugbo” and regularizes the lexical-alternative footnote.
