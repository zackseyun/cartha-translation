  to: Mgbe o tetara n’ụra, ọ baara ifufe ahụ mba, wee sị oké osimiri ahụ[b], “Gbachie nkịtị! Mechie ọnụ!”[a] Ifufe ahụ kwụsịrị, e wee nwee oké ịdị jụụ.
