  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ εἶπεν τῇ θαλάσσῃ· Σιώπα, πεφίμωσο. καὶ ἐκόπασεν ὁ ἄνεμος, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: ig
  text: Mgbe o tetara n’ụra, ọ baara ifufe ahụ mba, wee sị oké osimiri ahụ[b], “Gbachie nkịtị! Mechie ọnụ!”[a] Ifufe ahụ kwụsịrị, e wee nwee oké ịdị jụụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya, “Gbachie nkịtị! Daa jụụ!” N’ụzọ nkịtị, Grik nwere iwu abụọ: “Gbachie nkịtị! Ka e kee gị ọnụ!”'
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, Oké Osimiri Galili; Grik sịrị, “oké osimiri.”
    reason: cultural_note
lexical_decisions:
- source_word: διεγερθεὶς
  choice: Mgbe o tetara
  rationale: Nke a na-egosi na Jizọs si n’ụra teta, ma na-edobe ọrụ nkebiokwu a dị ka ihe mere tupu o baara ifufe mba, n’enweghị ịkọwapụta onye kpọtere ya.
- source_word: ἐπετίμησεν
  choice: ọ baara ... mba
  rationale: ‘Ịbara mba’ na-egosi okwu iwu siri ike ma kwekọọ n’ụzọ Mak si eji okwu a eme ihe mgbe Jizọs na-achịkwa ike ndị na-emegide mmadụ.
- source_word: ἀνέμῳ
  choice: ifufe ahụ
  rationale: Okwu Grik ahụ bụ ‘ifufe,’ ọ bụghị ‘oké ifufe,’ ọ bụ ezie na akụkọ gbara ya gburugburu na-ekwu banyere ebili mmiri siri ike.
- source_word: θαλάσσῃ
  choice: oké osimiri ahụ
  rationale: Nke a na-edobe ihe okwu Grik θάλασσα pụtara, kama ịgbanwe ya ka ọ bụrụ naanị ‘ọdọ mmiri.’
- source_word: Σιώπα
  choice: Gbachi nkịtị!
  rationale: Ọ bụ iwu siri ike nke chọrọ ka mkpọtụ kwụsị ozugbo; okwu Igbo a doro anya ma bụrụ nke e ji eme ihe ugbu a.
- source_word: πεφίμωσο
  choice: Mechie ọnụ!
  rationale: Nke a na-edobe ihe atụ doro anya nke imechi ma ọ bụ ikechi ọnụ, ma na-ada ka iwu siri ike na Igbo karịa nsụgharị passive nke ga-ada arọ.
- source_word: ἐκόπασεν
  choice: kwụsịrị
  rationale: Okwu a na-egosi na ifufe ahụ kwụsịrị ma ọ bụ belatara ruo mgbe ọ dara jụụ.
- source_word: ἐγένετο γαλήνη μεγάλη
  choice: e wee nwee oké ịdị jụụ
  rationale: Nke a na-egosi ọnọdụ si na ya pụta ma na-edobe ike nke μεγάλη, ‘nnukwu’ ma ọ bụ ‘oke.’
theological_decisions:
- issue: Ma a ga-eme ka iwu Jizọs nyere oké osimiri dị nro, ka a ga-edobe ihe atụ siri ike nke ikechi ọnụ
  choice: “Gbachi nkịtị! Mechie ọnụ!”
  alternative: “Daa jụụ! Nọrọ jụụ!”
  rationale: Grik enweghị aha pụtara ‘udo’; o nwere iwu abụọ, nke mbụ na-achọ ka ihe gbachi nkịtị, nke abụọ na-eji ihe atụ nke ikechi ọnụ. Nsụgharị a na-edobe ikike na ihe atụ ahụ n’enweghị ịgbakwunye nkọwa ozizi.
- issue: Ma θάλασσα ga-abụ ‘oké osimiri’ ka ọ bụ ‘ọdọ mmiri’
  choice: oké osimiri
  alternative: ọdọ mmiri
  rationale: Ọ bụ ezie na ebe a bụ Oké Osimiri Galili, isi iyi Grik kpọrọ ya ‘oké osimiri.’ Idebe okwu ahụ na-asọpụrụ ederede mbụ ma ghara imechi nghọta ya n’ihe gbasara ọdịdị ala naanị.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ugwu ma dị mfe nghọta. ‘Ịbara mba’ na-edobe ụda iwu siri ike; ‘Mechie ọnụ’ na-eme ka ihe atụ Grik pụta ìhè n’ụzọ ndị na-agụ Igbo ga-aghọta. A tinyere akara nkọwa [a] n’ebe iwu ahụ dị na [b] n’ebe ‘oké osimiri’ dị ka nkọwa nke ọ bụla wee kwekọọ kpọmkwem n’okwu ọ na-akọwa.
