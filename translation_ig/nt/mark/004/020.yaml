source:
  edition: SBLGNT
  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: ig
  text: 'Ndị ahụ bụkwa ndị a kụrụ n’ala ọma: ha na-anụ okwu ahụ, na-anabata ya, na-amịkwa mkpụrụ—okpukpu iri atọ, okpukpu iri isii, na okpukpu narị.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “na-anabata ya” dịka “na-ekweta ya” ma ọ bụ “na-eji obi ụtọ anabata ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: Ndị ahụ
  rationale: Ọ na-arụtụ aka n’ìgwè ikpeazụ a kọwara n’ilu ahụ, ma na-ekewapụ ha n’ìgwè ndị a kpọtụrụ aha tupu ha.
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: ndị a kụrụ n’ala ọma
  rationale: Nke a na-edobe oyiyi mkpụrụ a kụrụ na olu nnara dị n’asụsụ Grik, n’ụzọ Igbo dị mfe nghọta.
- source_word: γῆν τὴν καλὴν
  choice: ala ọma
  rationale: N’ọnọdụ ilu a, γῆ bụ ala a na-akụ ihe; “ala ọma” na-edobe ntụnyere ya na ụdị ala ndị ọzọ.
- source_word: ἀκούουσιν τὸν λόγον
  choice: ha na-anụ okwu ahụ
  rationale: “Okwu ahụ” na-edobe okwu ugboro ugboro nke ilu a ma na-egosi ozi a na-ekwusa n’enweghị nkọwa agbakwunyere.
- source_word: παραδέχονται
  choice: nabata ya
  rationale: '“Nabata” na-egosi ịnata ihe nke ọma ma ọ bụ ịkwado ya, ma na-adabara usoro ahụ: ịnụ, ịnabata, na ịmị mkpụrụ.'
- source_word: καρποφοροῦσιν
  choice: na-amị mkpụrụ
  rationale: Nke a bụ okwu ugbo sitere n’okike n’Igbo, na-edobekwa ihe atụ ime mmụọ ahụ n’enweghị ịkọwa ya gabiga ókè.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: ụfọdụ okpukpu iri atọ, ụfọdụ okpukpu iri isii, ụfọdụkwa okpukpu narị
  rationale: “Okpukpu” na-eme ka ihe owuwe ihe ubi mụbara pụta ìhè; “ụfọdụ” e tinyere ugboro atọ na-eme ka ndepụta ahụ bụrụ Igbo doro anya ma na-edobe ọkwa atọ ahụ.
theological_decisions:
- issue: Ụdị nzaghachi ndị nọ n’ala ọma na-enye okwu ahụ
  choice: Amaokwu ahụ na-ekwu na ha na-anụ okwu ahụ, nabata ya, ma na-amị mkpụrụ.
  alternative: Ịkọwa ya dịka nkwupụta na ha aghaghị ịnọgide ruo ọgwụgwụ, ma ọ bụ na ọ bụ naanị nzaghachi mbụ.
  rationale: Asụsụ Grik akọwaghị usoro ozizi gbasara ịnọgide n’okwukwe ma ọ bụ ịdapụ; nsụgharị ahụ anaghị etinye ihe karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: 'E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere oyiyi ọrụ ugbo ahụ na usoro omume atọ: ịnụ, ịnabata, na ịmị mkpụrụ.'
