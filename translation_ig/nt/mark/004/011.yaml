revisions:
- from: Ọ nọkwa na-agwa ha, “E nyela unu ihe omimi nke alaeze Chineke, ma nye ndị ahụ nọ n’èzí, ihe niile na-abịa n’ilu.”
  to: Ọ na-agwa ha sị, “E nyela unu ihe omimi nke alaeze Chineke; ma ndị nọ n’èzí, ihe niile na-abịakwute ha n’ilu.”
  rationale: The revision retains the source’s passive perfect (“E nyela”), its unqualified “mystery,” and the undefined category “those outside.” It repairs the outsider clause so that the contrast and indirect-object sense are clear in natural Igbo, while “na-abịakwute ha n’ilu” preserves the source/English audit trail’s dynamic “comes” rather than replacing it with a static or interpretively restrictive formulation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:16Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the passive perfect sense of δέδοται without supplying the giver, preserves “the mystery of the kingdom of God,” and does not define “those outside.” However, “ma nye ndị ahụ nọ n’èzí” is syntactically incomplete in this construction and does not clearly carry the contrastive dative. The final clause should explicitly express that all things come to the outsiders in parables, while retaining the δυναμism/ambiguity of γίνεται.
  naturalness: “Ọ nọkwa na-agwa ha” is understandable, but “Ọ na-agwa ha sị” is more idiomatic Standard Igbo for the imperfect speech introduction. “Ihe niile na-abịakwute ha n’ilu” naturally renders the relation expressed by ἐκείνοις ... ἐν παραβολαῖς without introducing “only,” “hear,” or an interpretation of the outsiders.
  terminology: “ihe omimi,” “alaeze Chineke,” “ndị nọ n’èzí,” and “ilu” are suitable Standard Igbo renderings. The wording keeps μυστήριον as revealed divine mystery rather than reducing it to an ordinary secret, and it preserves the plural Greek παραβολαῖς with Igbo’s generic/distributive use of singular “ilu.”
  issues:
  - severity: medium
    issue: The contrastive phrase introducing the outsiders is grammatically and semantically awkward.
    rationale: “ma nye ndị ahụ nọ n’èzí, ihe niile na-abịa n’ilu” can be read as an unfinished passive phrase (“but given to those outside”), rather than as the Greek contrast, “but to those outside, everything comes in parables.” Recasting the clause clarifies the dative relationship without adding doctrinal content.
  - severity: low
    issue: Speech introduction is less idiomatic than necessary.
    rationale: “Ọ na-agwa ha sị” is a natural continuous-past narrative formulation and adequately represents ἔλεγεν.
  revised_text: Ọ na-agwa ha sị, “E nyela unu ihe omimi nke alaeze Chineke; ma ndị nọ n’èzí, ihe niile na-abịakwute ha n’ilu.”
  revised_footnotes: []
