  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: ig
  text: Ọ na-agwa ha sị, “E nyela unu ihe omimi nke alaeze Chineke; ma ndị nọ n’èzí, ihe niile na-abịakwute ha n’ilu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μυστήριον
  choice: ihe omimi
  rationale: Nke a na-egosi eziokwu Chineke kpughere nke mmadụ na-apụghị ịmata n’onwe ya; ọ naghị eme ka okwu ahụ bụrụ naanị ‘ihe nzuzo’ mmadụ zoro.
- source_word: βασιλείας τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa ụzọ a na-ejikarị akọwa ọchịchị na alaeze nke Chineke.
- source_word: τοῖς ἔξω
  choice: ndị ahụ nọ n’èzí
  rationale: E debere ihe atụ gbasara ọnọdụ ha dị ka ndị nọ ‘n’èzí,’ n’ebughị ụzọ kọwaa kpọmkwem ndị okwu ahụ na-ezo aka na ha.
- source_word: ἐν παραβολαῖς
  choice: n’ilu
  rationale: ‘Ilu’ bụ okwu Igbo dị mfe ma kwekọọ na ụdị akụkọ ntụnyere Jizọs ji akụzi ihe n’ebe a.
- source_word: γίνεται
  choice: na-abịa
  rationale: Nke a na-edebe echiche nke ihe ‘na-abịa’ ma ọ bụ ‘na-eme’ n’ilu, kama ịgbanwe ya ka ọ bụrụ naanị nkwupụta ọnọdụ na-adịghị agagharị.
theological_decisions:
- issue: Onye nyere ihe omimi ahụ
  choice: E nyela unu ihe omimi
  alternative: Chineke enyela unu ihe omimi
  rationale: E debere olu nnara nke Grik n’etinyeghị ‘Chineke’ n’ahịrịokwu ahụ, ọ bụ ezie na a pụrụ ịghọta na ọ bụ ya nyere ya.
- issue: Mmekọrịta ndị nọ n’èzí na ilu
  choice: nye ndị ahụ nọ n’èzí, ihe niile na-abịa n’ilu
  alternative: ndị ahụ nọ n’èzí na-anụ ihe niile naanị n’ilu
  rationale: A naghị agbakwụnye ‘naanị’ ma ọ bụ ‘na-anụ,’ n’ihi na ha adịghị kpọmkwem n’ihe odide Grik; nke a na-ahapụ esemokwu na nghọta nke okwu ahụ ka ọ dị.
translation_notes:
  register: Asụsụ Igbo izugbe, nke ugbu a ma dị ùgwù. ‘Ọ nọkwa na-agwa’ na-egosipụta omume gara n’ihu nke ἔλεγεν, ebe ‘E nyela’ na-egosipụta ọnọdụ zuru oke nke δέδοται. E tinyereghị nkọwa ụka ma ọ bụ ozizi pụrụ iche.
