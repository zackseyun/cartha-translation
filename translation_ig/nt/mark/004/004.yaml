id: MRK.4.4
reference: Mark 4:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ σπείρειν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ἦλθεν τὰ πετεινὰ καὶ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/004.yaml
  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: ig
  text: Ka ọ nọ na-agha mkpụrụ, ụfọdụ mkpụrụ dara n'akụkụ ụzọ[a], ụmụ nnụnụ wee bịa richapụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'akụkụ okporo ụzọ.” Okwu Grik ahụ na-egosi ebe dị n'akụkụ ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: Ka ọ nọ na-agha mkpụrụ
  rationale: Nke a na-egosipụta ihe mere n'oge ọ nọ na-agha mkpụrụ n'Igbo dị mfe ma kwekọọ n'usoro akụkọ Grik ahụ, na-enweghị ịsụgharị ἐγένετο n'ụzọ siri ike.
- source_word: ὃ μὲν
  choice: ụfọdụ mkpụrụ
  rationale: Okwu a na-ezo aka n'otu akụkụ nke mkpụrụ a na-agha; ‘ụfọdụ mkpụrụ’ na-eme ka nke ahụ doo anya n'Igbo.
- source_word: ἔπεσεν
  choice: dara
  rationale: Nke a bụ nsụgharị kwụ ọtọ nke πίπτω n'ebe a.
- source_word: παρὰ τὴν ὁδόν
  choice: n'akụkụ ụzọ
  rationale: παρά tinyere accusative na-egosi ebe dị n'akụkụ ụzọ; ‘ụzọ’ dabara n'ọnọdụ ubi karịa ime ka ọ bụrụ nnukwu okporo ụzọ.
- source_word: τὰ πετεινὰ
  choice: ụmụ nnụnụ
  rationale: Okwu Grik a pụtara nnụnụ n'ozuzu ya, n'enweghị mgbakwunye dịka ‘nke eluigwe.’
- source_word: κατέφαγεν
  choice: richapụ
  rationale: ‘Richapụ’ na-echekwa ike dị n'okwu κατεσθίω, ya bụ iri ihe ahụ kpamkpam, karịa naanị ‘rie.’
- source_word: αὐτό
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na mkpụrụ ahụ dị ka otu mkpokọta; ‘ya’ bụ ụzọ e si ekwu ya nke ọma n'Igbo.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ihe. ‘Ka ọ nọ na-agha mkpụrụ’ na-agụ nke ọma dịka mmalite akụkọ, ebe ‘richapụ’ na-eme ka echiche iri mkpụrụ ahụ kpamkpam pụta ìhè.
