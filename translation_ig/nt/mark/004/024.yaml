  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: ig
  text: Ọ na-agwa ha, “Lezienụ anya n’ihe unu na-anụ. Ọ̀tụ̀tụ̀ unu ji atụ ka a ga-eji tụọrọ unu[a], a ga-agbakwụnyekwara unu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ọ̀tụ̀tụ̀ ọ bụla unu ji atụ, ọ bụ ya ka a ga-eji tụọrọ unu.”'
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ na-aghọta “a ga-agbakwụnyekwara unu” dị ka nghọta ka ukwuu a ga-enye ndị na-anabata ozizi Jizọs.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ọ nọkwa na-agwa
  rationale: Ụdị ngwaa imperfect na-egosi okwu ọ nọ na-ekwu n’oge ahụ ma ọ bụ nke ọ na-ekwughachi; ‘Ọ nọkwa na-agwa’ na-echekwa echiche ahụ n’Igbo dị mfe.
- source_word: Βλέπετε
  choice: Lezienụ anya
  rationale: N’ebe a, okwu ahụ abụghị naanị ‘lee,’ kama ọ bụ ịdọ aka ná ntị ka mmadụ tinye uche nke ọma.
- source_word: τί ἀκούετε
  choice: n’ihe unu na-anụ
  rationale: τί pụtara ‘ihe,’ ya mere e chekwara ọdịiche dị n’okwu Mak, kama ịgbanwe ya ka ọ bụrụ ‘otú unu si anụ’ dị ka n’ebe ọzọ.
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: Ọ̀tụ̀tụ̀ unu ji atụ
  rationale: Nke a na-echekwa ihe atụ nke iji otu ọ̀tụ̀tụ̀ atụ ihe, ma na-ada ka Igbo nkịtị.
- source_word: μετρηθήσεται ὑμῖν
  choice: ka a ga-eji tụọrọ unu
  rationale: E ji ahịrịokwu na-enweghị onye a kpọrọ aha chekwaa passive nke Grik na ụkpụrụ nke mmeghachi omume, n’agbakwụnyeghị ‘azụ’ nke na-adịghị n’ederede.
- source_word: προστεθήσεται ὑμῖν
  choice: a ga-atụkwasịkwara unu ihe ọzọ
  rationale: ‘Tụkwasị’ na-egosipụta echiche bụ isi nke ịgbakwunye; ‘ihe ọzọ’ na-eme ka okwu ahụ zuo oke n’Igbo ma ghara ịkọwa kpọmkwem ihe a ga-agbakwunye.
theological_decisions:
- issue: Ihe ụkpụrụ nke ọ̀tụ̀tụ̀ na mmeghachi omume pụtara
  choice: E debere ya dị ka okwu sara mbara banyere nzaghachi a ga-enye mmadụ dabere n’otú o si anabata ihe Jizọs na-akụzi.
  alternative: A pụrụ ịghọta ya kpọmkwem dị ka ikpe, mmesapụ aka, ma ọ bụ mmụba nke nghọta ime mmụọ.
  rationale: Ihe gbara amaokwu a gburugburu metụtara ịnụ na ịnabata ozi Jizọs. Nsụgharị ahụ anaghị amachibido ihe atụ ahụ n’otu ozizi ma ọ bụ n’ihe gbasara ego naanị.
- issue: Ihe a ga-atụkwasị ndị na-ege ntị
  choice: E hapụrụ ‘ihe ọzọ’ n’enweghị nkọwa kpọmkwem.
  alternative: Ụfọdụ na-aghọta ya dị ka nghọta ka ukwuu nke ozizi Jizọs.
  rationale: Ederede Grik ekwughị kpọmkwem ihe a na-agbakwunye; ya mere e chekwara oghere nkọwa ahụ, tinyekwa otu nghọta kwe omume n’ala ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ nke ọ̀tụ̀tụ̀ na mgbagwoju anya dị n’ihe a ga-agbakwunye, n’enweghị itinye nkọwa otu ụka ma ọ bụ otu ozizi pụrụ iche.
