    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ na-aghọta “a ga-agbakwụnyekwara unu” dị ka nghọta ka ukwuu a ga-enye ndị na-anabata ozizi Jizọs.
    reason: alternative_reading
  revision_rationale: The revision removes an unnecessary additive nuance in the narrative verb and restores the source text’s deliberate lack of specification concerning what will be added. It retains the reciprocal measure metaphor, the future passive/impersonal construction, and both footnote anchors.
