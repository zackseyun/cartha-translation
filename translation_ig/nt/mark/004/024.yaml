revisions:
- from: Ọ nọkwa na-agwa ha, “Lezienụ anya n’ihe unu na-anụ. Ọ̀tụ̀tụ̀ unu ji atụ ka a ga-eji tụọrọ unu[a], a ga-atụkwasịkwara unu ihe ọzọ[b].”
  to: Ọ na-agwa ha, “Lezienụ anya n’ihe unu na-anụ. Ọ̀tụ̀tụ̀ unu ji atụ ka a ga-eji tụọrọ unu[a], a ga-agbakwụnyekwara unu[b].”
  rationale: The revision removes an unnecessary additive nuance in the narrative verb and restores the source text’s deliberate lack of specification concerning what will be added. It retains the reciprocal measure metaphor, the future passive/impersonal construction, and both footnote anchors.
  reviewer_model: gpt-5.6-terra
