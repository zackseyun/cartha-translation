  text: καὶ ἄλλο ἔπεσεν εἰς τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ συνέπνιξαν αὐτό, καὶ καρπὸν οὐκ ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/007.yaml
  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: ig
  text: Mkpụrụ ọzọ wee daba n’etiti ogwu[a]; ogwu ndị ahụ wee pulite, kpagbuo ya, ọ mịghịkwa mkpụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “daba n’ime ogwu.” Preposishọn Grik ahụ pụtara n’ụzọ nkịtị “n’ime,” ma “n’etiti ogwu” bụ okwu Igbo ka mma n’ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: Mkpụrụ ọzọ
  rationale: Ụdị okwu a na-ezo n’ụzọ mkpirikpi aka ná mkpụrụ a kpọtụrụ aha n’akụkọ onye na-agha mkpụrụ; ịkpọpụta “mkpụrụ” na-eme ka Igbo doo anya n’etinyeghị echiche ọhụrụ.
- source_word: ἔπεσεν
  choice: wee daba
  rationale: Nke a na-asụgharị πίπτω dị ka ihe dara ma ọ bụ daba; ọ naghị etinye echiche “a kụrụ ya” nke ngwaa Grik n’onwe ya ekwughị.
- source_word: εἰς τὰς ἀκάνθας
  choice: n’etiti ogwu
  rationale: εἰς pụtara n’ụzọ nkịtị “banye n’ime,” ma “n’etiti ogwu” bụ Igbo nkịtị maka ọnọdụ ebe mkpụrụ dabara n’ala ogwu jupụtara.
- source_word: ἀνέβησαν
  choice: wee puo
  rationale: N’ihe gbasara ahịhịa, “puo” na-egosi na ogwu ahụ siri n’ala bilie ma too, n’ụzọ dị mfe ma bụrụkwa nke Igbo.
- source_word: συνέπνιξαν
  choice: kpagbuo
  rationale: “Kpagbuo” na-echekwa ihe atụ ahụ nke ahịhịa na-egbochi mkpụrụ ito ma mịa mkpụrụ, na-enweghị ịkọwa ya gabiga ókè.
- source_word: αὐτό
  choice: ya
  rationale: Nnọchiaha a na-alaghachi n’otu mkpụrụ ahụ; “ya” zuru oke ma kwekọọ n’usoro Igbo.
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: o meghịkwa mkpụrụ ọ bụla
  rationale: Nkebiokwu ahụ pụtara na ọ nyeghị ma ọ bụ mịghị mkpụrụ. “O meghị mkpụrụ ọ bụla” bụ okwu ugbo doro anya n’Igbo ma na-echekwa nsonaazụ a kpọrọ aha.
