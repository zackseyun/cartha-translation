  source_fidelity: Ederede bụ isi na-atụgharị echiche ọrụ ugbo nke ọma, ma “oge owuwe ihe ubi” na-agbakwunye “oge” n’ebe θερισμός na-ekwu naanị “owuwe ihe ubi.” Ịhapụ “oge” na-eme ka ọ bụrụ ihe kwekọrọ n’akwụkwọ Grik karịa. “Ọ na-etinye mma owuwe ihe ubi” bụ ụzọ Igbo eke isi kwuo idiom ahụ, n’agbanyeghị na Grik n’ụzọ nkịtị bụ “zigara mma owuwe ihe ubi.”
