  text: ὅταν δὲ ⸀παραδοῖ ὁ καρπός, ⸀εὐθὺς ἀποστέλλει τὸ δρέπανον, ὅτι παρέστηκεν ὁ θερισμός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: ig
  text: Ma mgbe ihe ubi chara[a], ọ na-etinye mma owuwe ihe ubi ozugbo, n’ihi na owuwe ihe ubi eruola.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “dị njikere” ma ọ bụ “nyefere onwe ya.” N’ụzọ nkịtị, ngwaa Grik ahụ pụtara “nyefee”; n’amaokwu a, ihe ubi n’onwe ya bụ isiokwu nke ngwaa ahụ, nke bụ okwu a na-adịghị ahụkarị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ma mgbe
  rationale: “Ma” na-egosi ntakịrị ntụgharị dị na δέ, ebe “mgbe” na-enye ihe ὅταν pụtara n’ụzọ Igbo doro anya.
- source_word: παραδοῖ
  choice: chara[a]
  rationale: N’ebe a, ngwaa ahụ na-egosi na ihe ubi eruwela ọnọdụ a ga-aghọ ya. “Chara” bụ okwu Igbo eke ma doo anya, ebe nkọwa ala peeji na-echekwa ụdị okwu Grik ahụ pụrụ iche, nke na-egosi ihe ubi dịka ihe na-enyefe onwe ya.
- source_word: ὁ καρπός
  choice: ihe ubi
  rationale: N’agbanyeghị na καρπός nwekwara ike ịpụta mkpụrụ, “ihe ubi” dabara n’ọnọdụ ubi, mma owuwe ihe ubi, na owuwe ihe ubi n’enweghị ime ka ọ bụrụ otu ụdị mkpụrụ kpọmkwem.
- source_word: εὐθὺς
  choice: ozugbo
  rationale: “Ozugbo” na-echekwa ngwa ngwa e ji mee ihe ahụ, bụ́ ihe εὐθύς na-egosi.
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: ọ na-etinye mma owuwe ihe ubi
  rationale: N’Igbo, “itinye mma owuwe ihe ubi” na-ekwupụta omume ibido ịghọ ihe ubi n’ụzọ eke. Ịsụgharị ya kpọmkwem dịka “iziga mma” ga-adị mgbagwoju anya n’Igbo.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Nke a na-egosi ihe kpatara e ji tinye mma ahụ ozugbo.
- source_word: παρέστηκεν
  choice: eruola
  rationale: “Eruola” na-egosi ma ọbịbịa oge owuwe ihe ubi ma na oge ahụ dị ugbu a, dịka oge zuru oke nke ngwaa Grik si egosi.
- source_word: ὁ θερισμός
  choice: oge owuwe ihe ubi
  rationale: N’Igbo, “oge owuwe ihe ubi” na-egosi nke ọma na oge ịghọ ihe ubi abịala, ma kwekọọ n’ọnọdụ ahụ.
theological_decisions:
- issue: Njikere ihe ubi n’ilu banyere alaeze Chineke
  choice: E jiri “ihe ubi chara” chekwaa ihe atụ ọrụ ugbo n’enweghị ịkọwa kpọmkwem ihe owuwe ihe ubi ahụ nọchiri anya ya.
  alternative: A pụrụ ịsụgharị ya dịka “ihe ubi nyere onwe ya” ma ọ bụ kọwaa owuwe ihe ubi ahụ dịka ikpe ikpeazụ.
  rationale: Okwu Grik ahụ nwere ihe oyiyi pụrụ iche, ma amaokwu ahụ akọwaghị kpọmkwem ma owuwe ihe ubi ahụ ọ bụ ikpe, ozi ọma, ma ọ bụ mmezu ikpeazụ. Ya mere, nsụgharị ahụ ekwesịghị idozi esemokwu nkà mmụta okpukpe ahụ n’ime ederede.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ugwu ma dị mfe nghọta. A họọrọ okwu ọrụ ugbo ndị nkịtị, ma e tinyere nkọwa ala peeji iji chekwaa ihe pụrụ iche dị n’okwu Grik.
