  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: ig
  text: ma nchegbu nke oge a[a], aghụghọ nke akụnụba[b], na ọchịchọ maka ihe ndị ọzọ na-abata wee na-akpagbu okwu ahụ, okwu ahụ wee ghọọ nke na-adịghị amị mkpụrụ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nchegbu nke ụwa a.” Okwu Grik ahụ nwere ike ịpụta “oge” ma ọ bụ, site n’ịgbasa ihe ọ pụtara, usoro ụwa dị ugbu a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ụzọ akụnụba si eduhie mmadụ.”
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, ihe e kwuru kpọmkwem bụ, “ọ ghọọkwa nke na-adịghị amị mkpụrụ.” A naghị akọwa onye ma ọ bụ ihe “ọ” na-ezo aka na ya n’ụzọ doro anya; aha otu mkpụrụ kacha nso bụ “okwu ahụ,” ma a pụkwara ịghọta ya dịka mkpụrụ ahụ ma ọ bụ onye nụrụ okwu ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι
  choice: nchegbu
  rationale: “Nchegbu” na-egosi ibu nke ihe mmadụ na-echegbu onwe ya banyere ya, n’enweghị ịkọwa ya naanị dị ka ụjọ nke uche.
- source_word: αἰῶνος
  choice: oge a
  rationale: αἰών pụtara n'ụzọ bụ isi “oge” ma ọ bụ usoro nke oge dị ugbu a; “oge a” na-edobe echiche oge ahụ karịa “ụwa.”
- source_word: ἀπάτη τοῦ πλούτου
  choice: aghụghọ nke akụnụba
  rationale: Nke a na-edobe usoro okwu Grik ma na-egosi na akụnụba nwere ike iduhie mmadụ.
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: ọchịchọ maka ihe ndị ọzọ
  rationale: Nkebiokwu a na-ezo aka n'ọchịchọ a na-etinye n'ihe ndị ọzọ ma e wezụga okwu ahụ; nsụgharị a sara mbara ma bụrụkwa Igbo a na-aghọta ngwa ngwa.
- source_word: εἰσπορευόμεναι
  choice: na-abata
  rationale: Ọ na-edobe onyinyo nke ihe ndị a na-abata wee banye n'ime ndụ onye nụrụ okwu ahụ, n'agbanyeghị na ebe ha na-abata akọwaghị kpọmkwem na isi mmalite.
- source_word: συμπνίγουσιν
  choice: na-akpagbu
  rationale: “Na-akpagbu” na-egosi imechi ma gbochie uto, kwekọọkwa n’onyinyo mkpụrụ a kụrụ nke ihe ndị ọzọ kpuchiri.
- source_word: τὸν λόγον
  choice: okwu ahụ
  rationale: “Okwu ahụ” na-edobe okwu Baịbụl a na-eji maka ozi e kwusara, ma kwekọọkwa n’akụkọ ilu a.
- source_word: ἄκαρπος γίνεται
  choice: aghọọkwa nke na-adịghị amị mkpụrụ
  rationale: Nke a na-edobe echiche mgbanwe gaa n’ọnọdụ enweghị mkpụrụ, kama ịsụgharị ya naanị dị ka na ọ mịghị mkpụrụ.
theological_decisions:
- issue: Ihe onye nke ikpeazụ “aghọọkwa nke na-adịghị amị mkpụrụ” na-ezo aka na ya
  choice: E kwughachiri “okwu ahụ” dịka ihe ọ na-ezo aka na ya.
  alternative: Onye nụrụ okwu ahụ, ma ọ bụ mkpụrụ/osisi ahụ, ghọọ onye ma ọ bụ ihe na-adịghị amị mkpụrụ.
  rationale: τὸν λόγον bụ aha otu mkpụrụ kacha nso, predicate nke otu mkpụrụ ahụ na-esokwa ya n'ụzọ dị mma. Ikwughachi “okwu ahụ” na Igbo na-ewepụ mgbagwoju anya nke nnọchiaha, ma ọ naghị agbanwe onyinyo okwu ahụ dịka mkpụrụ a kụrụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E debere usoro atọ nke ihe na-akpagbu okwu ahụ na onyinyo ịmị mkpụrụ. E kwughachiri “okwu ahụ” na njedebe iji mee ka ebe nnọchiaha na-ezo doo anya n’Igbo, ebe nkọwa ala peeji na-echekwa mgbagwoju anya dị na Grik.
