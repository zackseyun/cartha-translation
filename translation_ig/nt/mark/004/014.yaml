  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ σπείρων τὸν λόγον σπείρει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/014.yaml
  text: The sower sows the word[a].
translation:
  language: ig
  text: Onye na-agha mkpụrụ na-agha okwu ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ozi ahụ.” Okwu Grik λόγος nwere ike ịpụta “okwu” ma ọ bụ “ozi,” dabere n’ihe gbara ya gburugburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: Onye na-agha mkpụrụ
  rationale: Nkebi okwu a bụ participle nwere article nke na-arụ ọrụ dị ka aha, ya bụ, onye a ji omume ịgha mkpụrụ mara. Nsụgharị a bụ Igbo doro anya ma na-echekwa ihe atụ nke ịgha mkpụrụ; ịsị naanị “onye ọrụ ubi” ga-agbasawanye ihe Grik kwuru.
- source_word: τὸν λόγον
  choice: okwu ahụ
  rationale: λόγος nwere ike ịpụta “okwu” ma ọ bụ “ozi.” N’ebe a, “okwu ahụ” na-echekwa ịdị nkenke na obosara nke Grik, na-agbakwụnyeghị “nke Chineke” ma ọ bụ “ozi ọma,” ihe amaokwu a na-ekwughị kpọmkwem.
- source_word: σπείρει
  choice: na-agha
  rationale: Present indicative a na-akọ omume a na-eme n’ozuzu n’ime nkọwa ilu ahụ. Usoro “na-agha” bụ ụzọ Igbo nkịtị si egosi omume dị otú a, ma ikwughachi mgbọrọgwụ “agha” na-echekwa nkwughachi dị na Grik.
theological_decisions:
- issue: Ihe “okwu ahụ” na-ezo aka na ya n’ime nkọwa ilu ahụ
  choice: E debere ya dịka “okwu ahụ,” n’agbakwụnyeghị nkọwa ọzọ.
  alternative: “ozi ahụ,” “okwu Chineke,” ma ọ bụ “ozi ọma”
  rationale: Grik kwuru naanị τὸν λόγον. Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-egosi ozi Chineke a na-ekwusa, ịgbakwunye “nke Chineke” ma ọ bụ “ozi ọma” ga-ekpebi ihe ederede a hapụrụ n’obosara.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. E jiri “onye na-agha mkpụrụ” mee ka ihe oyiyi ilu ahụ doo anya, ebe “okwu ahụ” na-echekwa obosara ihe Grik pụtara.
