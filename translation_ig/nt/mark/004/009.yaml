  yaml_path: translation/nt/mark/004/009.yaml
  text: And he was saying[a], “Whoever has ears to hear, let him hear.”
translation:
  language: ig
  text: Ọ na-ekwu, sị, “Onye nwere ntị ịnụ ihe, ka ọ nụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: kwa
  rationale: Na-ejigide njikọ dị mfe na ihe bu ụzọ, n’etinyeghị echiche oge nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: ἔλεγεν
  choice: Ọ nọ na-ekwu
  rationale: Na-egosipụta ọdịdị imperfect nke ngwaa ahụ dị ka omume na-aga n’ihu, n’enweghị ime ka nkwughachi ya sie ike karịa ihe gbara ya gburugburu chọrọ.
- source_word: Ὃς ἔχει
  choice: Onye nwere
  rationale: Ọ bụ ụzọ Igbo nkịtị si egosipụta onye ọ bụla n’ozuzu, ma na-ejigide usoro otu onye nke okwu Grik ahụ.
- source_word: ὦτα
  choice: ntị
  rationale: “Ntị” bụ aha akụkụ ahụ a na-ejikarị n’Igbo n’enweghị mgbanwe pụrụ iche n’etiti otu na ọtụtụ; ọ dabara n’ụdị ilu nke ahịrịokwu ahụ.
- source_word: ἀκούειν
  choice: ịnụ ihe
  rationale: Na-egosipụta ọrụ nke infinitive ahụ ma na-edobe mgbọrọgwụ echiche nke ịnụ ihe, nke a ga-emeghachi n’iwu na-esote.
- source_word: ἀκουέτω
  choice: ya nụrụ
  rationale: Na-egosipụta iwu nke onye nke atọ n’Igbo dị nkenke ma dị ebube, ma na-edobe nkwughachi nke ngwaa “ịnụ.”
theological_decisions:
- issue: Okwu nwoke otu onye e ji ekwu maka mmadụ niile n’ụdị ilu
  choice: Onye nwere ... ya nụrụ
  alternative: Nwoke nwere ... ya nụrụ
  rationale: “Onye” na Igbo na-emetụta nwoke ma ọ bụ nwanyị ma kwekọọ n’ike izugbe nke relative construction Grik ahụ; ọ naghị etinye nwoke kpọmkwem ebe isi mmalite ahụ na-ekwu maka mmadụ ọ bụla.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị mfe nghọta ma nwee ugwu. E debere ọdịdị okwu na-aga n’ihu nke ἔλεγεν na nkwughachi nke ἀκούειν/ἀκουέτω. Enweghị akara nkọwa ala peeji n’ihi na ọdịiche Bekee gbasara generic masculine anaghị achọ nkọwa ọzọ n’Igbo.
