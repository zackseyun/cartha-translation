review_pass:
  verdict: revise
  source_fidelity: The draft appropriately renders the generic relative expression with “Onye” and retains the hearing-wordplay in “ntị … nụ.” However, “ya nụrụ” is formally ambiguous and is ordinarily read as a completed past form (“he/she heard”), rather than clearly conveying the Greek third-person present imperative ἀκουέτω.
  naturalness: “Ọ nọkwa na-ekwu” is less natural for the simple narrative connective and introduces an unnecessary additive sense through “kwa.” “Ọ na-ekwu, sị” is natural Standard Igbo and suitably represents the imperfective background/action without overstating repetition. “Ka ọ nụ” clearly and naturally expresses the exhortation.
  terminology: “Onye,” “ntị,” and “ịnụ ihe” are appropriate Standard Igbo choices. “Onye” correctly retains the generic-human force without introducing male-specific meaning. No theological terminology issue arises.
  issues:
  - severity: medium
    issue: The imperative is rendered “ya nụrụ.”
    rationale: This form can be understood as perfect/past (“he/she heard”) and does not clearly communicate “let him/her hear.” Replace it with “ka ọ nụ,” the clear third-person exhortative form.
  - severity: low
    issue: “kwa” in “Ọ nọkwa na-ekwu” adds an additive nuance.
    rationale: καὶ here is the ordinary narrative connective and does not require “also/too.” Omitting “kwa” avoids adding that nuance.
  revised_text: Ọ na-ekwu, sị, “Onye nwere ntị ịnụ ihe, ka ọ nụ.”
