- from: Ọ nọkwa na-ekwu, “Onye nwere ntị ịnụ ihe, ya nụrụ.”
  to: Ọ na-ekwu, sị, “Onye nwere ntị ịnụ ihe, ka ọ nụ.”
  rationale: The revision preserves the imperfective force of ἔλεγεν with “Ọ na-ekwu, sị,” retains the generic singular and the lexical echo of hearing, and replaces the potentially past-tense “ya nụrụ” with the unambiguous exhortative “ka ọ nụ.” No footnote is needed in Igbo.
