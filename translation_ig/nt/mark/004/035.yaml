  text: Καὶ λέγει αὐτοῖς ἐν ἐκείνῃ τῇ ἡμέρᾳ ὀψίας γενομένης· Διέλθωμεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/035.yaml
  text: And he says to them on that day[a], when evening had come, “Let us go across to the other side.”
translation:
  language: ig
  text: N’ụbọchị ahụ, mgbe mgbede ruru, ọ sịrị ha, “Ka anyị gafee n’ofe nke ọzọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: ọ sịrị
  rationale: Ọ bụ ezie na Grik ji historical present, ụdị akụkọ Igbo na-eji oge gara aga ebe a ka okwu wee bụrụ nke e kere eke ma doo anya; nke a anaghị agbanwe usoro ihe mere.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: N’ụbọchị ahụ
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi kpọmkwem ụbọchị ahụ e kwuru okwu ya.
- source_word: ὀψίας γενομένης
  choice: mgbe chi jiri
  rationale: Nkebiokwu a na-egosi oge ihe mere; ‘mgbe chi jiri’ bụ okwu Igbo dị mfe ma kwekọọ n’echiche nke mgbede bịara.
- source_word: Διέλθωμεν
  choice: Ka anyị gafee
  rationale: Nke a na-edobe hortatory subjunctive dị ka aro ma ọ bụ oku Jizọs nyere ndị na-eso ụzọ ya ka ha soro ya gafee.
- source_word: εἰς τὸ πέραν
  choice: n’ofe nke ọzọ
  rationale: N’ọnọdụ akụkọ a, ọ na-ezo aka n’akụkụ nke ọzọ nke ọdọ mmiri ahụ, na-enweghị itinye aha ọdọ mmiri n’amaokwu ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji usoro oge gara aga nke akụkọ Igbo mee ka amaokwu ahụ daa nke ọma, ebe a hapụrụ okwu Jizọs n’ụdị aro gụnyere ya na ndị na-eso ụzọ ya.
