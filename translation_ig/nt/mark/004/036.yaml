id: MRK.4.36
reference: Mark 4:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀφέντες τὸν ὄχλον παραλαμβάνουσιν αὐτὸν ὡς ἦν ἐν τῷ πλοίῳ, καὶ ἄλλα ⸀πλοῖα ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/036.yaml
  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: ig
  text: Mgbe ha hapụrụ ìgwè mmadụ ahụ, ha kpọọrọ ya soro ha dịka ọ nọ n’ụgbọ mmiri ahụ[a]; ụgbọ mmiri ndị ọzọ sokwa ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta ya dịka, “ha kpọọrọ ya soro ha n’ụgbọ mmiri ahụ, dịka ọ nọ.” Usoro okwu Grik nwere ike imesi ike na Jizọs nọworị n’ụgbọ mmiri ahụ, ma ọ bụ na ha kpọọrọ ya n’enweghị nkwadebe ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: Mgbe ha hapụrụ
  rationale: Aorist participle a na-egosi ihe ha mere tupu omume bụ isi; ‘Mgbe ha hapụrụ’ bụ Igbo doro anya nke na-ekwughị na ha chụpụrụ igwe mmadụ ahụ n’ụzọ emume.
- source_word: τὸν ὄχλον
  choice: ìgwè mmadụ ahụ
  rationale: Nke a bụ okwu Igbo a na-eji maka ọtụtụ ndị gbakọtara n’otu ebe.
- source_word: παραλαμβάνουσιν αὐτόν
  choice: ha kpọọrọ ya soro ha
  rationale: ‘Kpọọrọ ya soro ha’ na-egosipụta echiche nke ịkpọ mmadụ ka o sonyere ndị na-aga, nke dị na παραλαμβάνω, kama naanị ‘ha kpọrọ ya.’
- source_word: ὡς ἦν
  choice: dịka ọ nọ
  rationale: Nke a na-edobe okwu Grik n’ụzọ dị mkpirikpi ma na-ahapụ ohere na a kpọọrọ Jizọs n’enweghị nkwadebe ọzọ.
- source_word: ἐν τῷ πλοίῳ
  choice: n’ụgbọ mmiri ahụ
  rationale: πλοῖον n’ọnọdụ a bụ ụgbọ mmiri e ji aga n’ọdọ mmiri; nkebi a na-egosi na Jizọs nọworị n’ime ya.
- source_word: ἄλλα πλοῖα
  choice: ụgbọ mmiri ndị ọzọ
  rationale: Grik kwuru naanị ‘ụgbọ mmiri ndị ọzọ’; ọ kọwaghị na ha dị nta.
- source_word: ἦν μετ’ αὐτοῦ
  choice: sokwa ya
  rationale: N’ọnọdụ akụkọ a, ‘sokwa ya’ na-egosi n’Igbo nkịtị na ụgbọ mmiri ndị ahụ na-eso ya aga.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ njikọ nke ‘dịka ọ nọ’ na ‘n’ụgbọ mmiri ahụ’ ka ọ dịtụ obosara dịka ọ dị na Grik, ma kọwaa ụzọ ọzọ e nwere ike isi ghọta ya n’ala ala peeji.
