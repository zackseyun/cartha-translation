revisions:
- from: Ọ dịghị mgbe ọ na-agwa ha okwu nʼejighị ilu; ma mgbe naanị ya na ndị na-eso ụzọ ya nọ, ọ na-akọwara ha ihe niile.[a][b]
  to: Ọ naghị agwa ha okwu ma e wezụga n’ilu; ma na nzuzo, ọ na-akọwara ndị na-eso ụzọ nke ya[b] ihe niile.[a]
  rationale: The revision translates κατ’ ἰδίαν directly as “na nzuzo,” preserves the imperfect sense with habitual forms, retains the broad “ihe niile,” and brings the emphasis of ἰδίοις into the translation itself. The revised footnotes distinguish explanation from interpretation without using “asụgharị,” which can misleadingly suggest language translation.
