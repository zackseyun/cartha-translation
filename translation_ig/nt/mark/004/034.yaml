review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the habitual/iterative force of ἐλάλει and ἐπέλυεν, the contrast between public parabolic speech and private explanation, and the unrestricted scope of πάντα. However, “mgbe naanị ya na ndị na-eso ụzọ ya nọ” more specifically depicts Jesus as being alone with the disciples, whereas κατ’ ἰδίαν directly means “privately.” The possessive emphasis in τοῖς ἰδίοις μαθηταῖς is better represented in the text itself as “ndị na-eso ụzọ nke ya.”
  naturalness: “Ma na nzuzo” is concise, idiomatic Standard Igbo for the private setting. “Ọ naghị agwa ha okwu ma e wezụga n’ilu” naturally expresses that he did not address them except in parables. Footnote anchors are placed beside the words they explain.
  terminology: “Ilu” is the established, natural Igbo rendering for παραβολή in Gospel teaching. “Ndị na-eso ụzọ nke ya” retains the Greek emphasis without unnatural repetition. “Na-akọwara” is appropriate for ἐπέλυεν; the footnote preserves “interpret” as a possible lexical alternative without implying translation between languages.
  issues:
  - severity: medium
    issue: The private-setting phrase is overly specific.
    rationale: “Mgbe naanị ya na ndị na-eso ụzọ ya nọ” can suggest that Jesus and the disciples were the only people present. The Greek idiom κατ’ ἰδίαν states that the explanation was private, without making that further detail explicit.
  - severity: low
    issue: The emphasis of ἰδίοις is not fully carried in the main text.
    rationale: “Ndị na-eso ụzọ ya” is possible, but “ndị na-eso ụzọ nke ya” more directly preserves the marked possessive force of τοῖς ἰδίοις μαθηταῖς.
  - severity: low
    issue: Footnote markers are not attached to their corresponding expressions.
    rationale: Moving [b] to “ndị na-eso ụzọ nke ya” and [a] to “na-akọwara”/the explanatory clause makes the notes easier to audit and use.
  revised_text: Ọ naghị agwa ha okwu ma e wezụga n’ilu; ma na nzuzo, ọ na-akọwara ndị na-eso ụzọ nke ya[b] ihe niile.[a]
