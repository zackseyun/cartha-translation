  text: χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς, κατ’ ἰδίαν δὲ τοῖς ⸂ἰδίοις μαθηταῖς⸃ ἐπέλυεν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: ig
  text: Ọ naghị agwa ha okwu ma e wezụga n’ilu; ma na nzuzo, ọ na-akọwara ndị na-eso ụzọ nke ya[b] ihe niile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ kọwara ihe niile” ma ọ bụ “ọ kọwara ihe ọ pụtara n’ihe niile.” Ngwaa Grik a nwere ike ịpụta ịkọwa, ịtụgharị ihe ọ pụtara, ma ọ bụ ikpughe nkọwa ya nke ọma.
    reason: lexical_alternative
  - marker: b
    text: N’Igbo, “ndị na-eso ụzọ nke ya” na-edobe nkwusi ike dị n’okwu Grik ahụ, nke pụtara “ndị na-eso ụzọ ya onwe ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς
  choice: Ọ dịghị mgbe ọ na-agwa ha okwu nʼejighị ilu
  rationale: Ụdị a na-egosi omume ọ na-emekarị nke imperfect ἐλάλει, ma na-edobekwa echiche χωρὶς ... παραβολῆς, ya bụ na ọ naghị agwa ha okwu nʼejighị ilu.
- source_word: παραβολῆς
  choice: ilu
  rationale: “Ilu” bụ okwu Igbo dị mfe ma bụrụkwa nke a na-ejikarị akọwa παραβολή nʼọnọdụ nkuzi Jizọs.
- source_word: κατ’ ἰδίαν
  choice: mgbe naanị ya na ndị na-eso ụzọ ya nọ
  rationale: Nke a na-egosi ọnọdụ nzuzo, nke dị iche nʼokwu ọ gwara ìgwè mmadụ nʼihu ọha, nʼIgbo sitere nʼọnụ mmadụ.
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: ndị na-eso ụzọ ya
  rationale: Nnọchiaha “ya” na-egosi na ha bụ ndị nke ya; nkọwa ala peeji na-eme ka nkwusi ike dị na ἰδίοις pụta ìhè.
- source_word: ἐπέλυεν
  choice: ọ na-akọwara
  rationale: “Na-akọwara” na-egosi omume na-aga nʼihu ma ọ bụ nke a na-eme ugboro ugboro, ma na-eburu echiche ịkọwa ma ọ bụ ịsụgharị ihe ọ pụtara.
- source_word: πάντα
  choice: ihe niile
  rationale: A hapụrụ okwu ahụ nʼogo sara mbara nke Grik, nʼagbanyeghị na ihe ndị gbara ya gburugburu nwere ike igosi nkuzi ma ọ bụ ilu ndị ahụ.
theological_decisions:
- issue: Oke ihe Jizọs kọwara na nzuzo
  choice: ihe niile
  alternative: ilu niile; ihe niile o kwuru
  rationale: πάντα kwuru naanị “ihe niile.” Ịgbakwunye “ilu” ma ọ bụ “o kwuru” ga-eme ka oke okwu ahụ dị warara karịa ihe ederede Grik kwuru.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E ji usoro “ọ dịghị mgbe ...” gosipụta omume a na-emekarị; e jikwa nkọwa doro anya maka κατ’ ἰδίαν kama okwu nwere ike iduhie dịka “na nzuzo” naanị. Ihe nrịbama ala peeji [a] na [b] dị nʼederede bụ isi.
