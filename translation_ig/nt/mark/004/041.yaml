  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐφοβήθησαν φόβον μέγαν, καὶ ἔλεγον πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ ὁ ἄνεμος καὶ ἡ θάλασσα ⸀ὑπακούει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: ig
  text: Ụjọ dị ukwuu jidere ha[a], ha wee na-agwa ibe ha sị, “Ònyezi ka onye a bụ, na ọbụna ifufe na oké osimiri na-erubere ya isi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karịa, “Ha tụrụ egwu dị ukwuu.” Asụsụ Grik ji ngwaa na aha sitere n’otu mgbọrọgwụ mee ka echiche ụjọ ahụ sie ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: Ụjọ dị ukwuu jidere ha
  rationale: Nkebiokwu Grik ji ngwaa na aha sitere n’otu mgbọrọgwụ mee ka ụjọ ahụ sie ike. Nsụgharị a na-egosipụta ịdị ukwuu nke ụjọ ahụ n’Igbo doro anya ma dịkwa mma.
- source_word: ἔλεγον
  choice: ha wee na-agwa
  rationale: Ụdị imperfect nke Grik nwere ike igosi okwu na-aga n’ihu; “wee na-agwa” na-edebe ntakịrị mmetụta ahụ n’akụkọ Igbo n’enweghị ime ka ọ bụrụ nkwughachi a manyere amanye.
- source_word: πρὸς ἀλλήλους
  choice: ibe ha
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi na ha gwara otu onye ibe ya.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Ònyezi ka onye a bụ
  rationale: “Ònyezi” na-ebute echiche nke iju anya na nkwubi okwu a na-eru mgbe ihe ahụ mere, nke kwekọrọ na ἄρα.
- source_word: ὅτι
  choice: na
  rationale: N’ebe a, “na” na-ejikọta ajụjụ ahụ na ihe kpatara iju ha anya, ma ọ naghị akowapụ mmekọrịta okwu ahụ karịa ka Grik mere.
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: ọbụna ifufe na oké osimiri
  rationale: “Ọbụna” na-egosipụta ike nke καὶ mbụ, ebe “na” jikọtara ifufe na oké osimiri dị ka isiokwu abụọ.
- source_word: ὑπακούει αὐτῷ
  choice: na-erubere ya isi
  rationale: Nke a bụ okwu Igbo doro anya maka irube isi, ọ na-echekwa ngosipụta nke ifufe na oké osimiri dịka ihe na-aza iwu Jizọs.
theological_decisions:
- issue: Otu e si egosi ikike Jizọs nwere n’ebe ihe e kere eke dị
  choice: E debere ajụjụ iju anya nke ndị na-eso ụzọ na irube isi nke ifufe na oké osimiri n’enweghị nkọwa okwukwe agbakwunyere.
  alternative: Ịgbakwunye okwu na-ekwu kpọmkwem na ihe a pụtara gbasara onye Jizọs bụ.
  rationale: Amaokwu ahụ na-eme ka ikike pụrụ iche Jizọs pụta ìhè site n’ajụjụ ndị na-eso ụzọ, ma ọ naghị aza ajụjụ ahụ kpọmkwem n’ebe a. Nsụgharị ahụ kwesịrị ichekwa ibu okwu ahụ na mgbagwoju anya ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ụjọ dị ukwuu jidere ha” bụ okwu nkịtị n’Igbo ma na-echekwa nkwusi ike nke Grik; “Ònyezi” na-egosipụta iju anya na ntụgharị uche dị na ἄρα.
