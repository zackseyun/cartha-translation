  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα βλέποντες βλέπωσι καὶ μὴ ἴδωσιν, καὶ ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν, μήποτε ἐπιστρέψωσιν καὶ ἀφεθῇ ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: ig
  text: ka ha na-ahụ, ha hụ ma ghara ịmata[a], na ka ha na-anụ, ha nụ ma ghara ịghọta[c], ka ha ghara ịtụgharị[b], e wee gbaghara ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ma ha ghara ịghọta.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ “ịtụgharị” dịka “ịlaghachi”; n’ọnọdụ a, ọ pụkwara ịpụta “ichegharị.”
    reason: lexical_alternative
  - marker: c
    text: Okwu Jizọs a na-eme ka a cheta Aịzaya 6:9–10, ma na-edobe esemokwu dị n’etiti ikpe Chineke na enweghị nzaghachi ndị mmadụ.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: ka ha wee
  rationale: Na-ebute echiche nke nzube ma ọ bụ ihe ga-esi na ya pụta, n’Igbo dị mfe ma dịkwa nsọpụrụ.
- source_word: βλέποντες βλέπωσι
  choice: na-ele anya, na-elekwa anya
  rationale: E debere nkwughachi ahụ iji chekwaa ike okwu na ọdịdị ilu nke okwu Grik, kama ijikọta ya n’otu ngwaa.
- source_word: ἴδωσιν
  choice: ghọta ihe ha na-ahụ
  rationale: Nke a na-ekewapụ ya na βλέπω ma na-egosi ịhụ nke ruru n’ịmata ma ọ bụ ịghọta ihe a hụrụ.
- source_word: ἀκούοντες ἀκούωσι
  choice: na-anụ ihe, na-anụkwa ihe
  rationale: E debere nkwughachi ahụ dịka n’akụkụ banyere ịhụ, iji chekwaa ụda okwu e si n’Aịzaya nweta.
- source_word: συνιῶσιν
  choice: ghọta ya
  rationale: Ọ bụ okwu Igbo nkịtị ma doo anya maka nghọta nke uche ma ọ bụ nke ime mmụọ.
- source_word: μήποτε
  choice: ka ha ghara
  rationale: Na-echekwa ike okwu nke igbochi ihe a tụrụ anya na ọ pụrụ ime, n’ụzọ Igbo na-asụkarị.
- source_word: ἐπιστρέψωσιν
  choice: ịlọghachi
  rationale: Na-echekwa oyiyi nke ịtụgharị ma ọ bụ ịlaghachi, na-enweghị ime ka ọ bụrụ naanị okwu nkà mmụta okpukpe maka nchegharị.
- source_word: ἀφεθῇ αὐτοῖς
  choice: e wee gbaghara ha mmehie ha
  rationale: Na-echekwa olu nnara nke na-egosi Chineke n’ụzọ ezoro ezo; ‘mmehie ha’ na-eme ka ihe a na-agbaghara doo anya n’Igbo, dịka ihe okwu a pụtara n’ọnọdụ a.
theological_decisions:
- issue: Ma ἵνα ... μήποτε na-egosi nzube ka ọ bụ ihe si na ya pụta
  choice: E debere ‘ka ha wee ... ka ha ghara,’ nke nwere ọdịdị nzube.
  alternative: N’ihi ya ... ma ọ bụghị ya, ha nwere ike ịlọghachi.
  rationale: Okwu Grik ahụ kpachapụrụ anya sie ike; nsụgharị ahụ echekwaghị esemokwu dị n’etiti ikpe Chineke na enweghị nzaghachi nke ndị mmadụ, kama ịkọwa ya n’otu akụkụ.
- issue: Ihe ἐπιστρέψωσιν pụtara n’ihe gbasara nchegharị
  choice: ịlọghachi
  alternative: ichegharị; ịtụgharị
  rationale: Ngwaa ahụ nwere ike ịpụta ntụgharị nke nchegharị, karịsịa n’okwu sitere n’Aịzaya, ma ọ sara mbara karịa okwu doro anya ‘ichegharị.’ Ihe odide bụ isi na-edobe oyiyi ahụ, ebe nkọwa ala peeji na-egosi nhọrọ ndị ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị nsọpụrụ ma bụrụkwa nke ndị nkịtị ga-aghọta. E debere nkwughachi nke akụkụ ịhụ na ịnụ iji chekwaa ụda na ike okwu mbụ; e zere okwu ụka pụrụ iche.
