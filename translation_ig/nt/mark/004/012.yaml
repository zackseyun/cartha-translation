  verdict: revise
  source_fidelity: A draft ahụ na-achọ idobe nkwughachi dị na Grik, ma «ha agaghị aghọta» na-eme ka ngwaa ndị dị n’okpuru ἵνα bụrụ nkwupụta ọdịnihu karịa ụdị ebumnuche/ohere dị na Grik. Ọ na-etinyekwa «mmehie ha», ebe ἀφεθῇ αὐτοῖς anaghị akọwapụta ihe a gbagharara. E degharịrị ya ka ọdịiche dị n’etiti ἴδωσιν (‘mata/ghọta n’ezie’) na συνιῶσιν (‘ịghọta’) nọgide, na-enweghị itinye ihe na-adịghị n’ederede.
  naturalness: «Ka ha na-ahụ, ha hụ» na «ka ha na-anụ, ha nụ» bụ nkwughachi nwere ụda dị nsọpụrụ nke dabara n’ụzọ okwu Aịzaya, ma bụrụkwa Igbo a na-aghọta. «E wee gbaghara ha» bụ usoro na-adịghị akọwa onye na-agbaghara ma na-adị nnọọ eke karịa ịkọpụta «mmehie ha».
  terminology: A họrọla «ịtụgharị» maka ἐπιστρέψωσιν n’ederede, ebe ọ na-echekwa oyiyi ngwaa ahụ na ohere nke ịlaghachi ma ọ bụ ichegharị. Nkọwa ala peeji na-edobe nhọrọ ndị ahụ. «Ịmata» n’akụkụ ịhụ na «ịghọta» n’akụkụ ịnụ na-edobe ọdịiche okwu Grik n’enweghị ịkọwa ya gabiga ókè.
