id: MRK.4.23
reference: Mark 4:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἴ τις ἔχει ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/023.yaml
  text: If anyone has ears to hear[a], let him hear.
translation:
  language: ig
  text: Ọ bụrụ na onye ọ bụla nwere ntị ịnụ ihe, ya nụrụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ
  choice: Ọ bụrụ na
  rationale: Na-edobe usoro nkwupụta ọnọdụ dị na Grik, ma na-ada nke ọma n'Igbo.
- source_word: τις
  choice: onye ọ bụla
  rationale: Na-egosipụta onye a na-akọwaghị kpọmkwem, ma na-eme ka ọkpụkpọ oku a ruo mmadụ niile.
- source_word: ἔχει
  choice: nwere
  rationale: Ọ bụ okwu nkịtị nke na-egosi inwe ihe, kwekọrọ na present indicative nke Grik.
- source_word: ὦτα
  choice: ntị
  rationale: N'Igbo, “ntị” bụ aha anaghị agbanwekarị ọdịdị ya iji gosi otu ma ọ bụ ọtụtụ; ọ na-edobe ihe okwu Grik pụtara.
- source_word: ἀκούειν
  choice: ịnụ ihe
  rationale: Na-egosipụta ikike ma ọ bụ nzube nke ịnụ, ma na-akwado nkwughachi ngwaa ahụ n'ahịrịokwu a.
- source_word: ἀκουέτω
  choice: ya nụrụ
  rationale: Na-enye iwu n'ụdị onye nke atọ otu onye, ma na-edobe nkwughachi nke ngwaa ἀκούω na ume ime mmụọ nke ịnụ nke ọma na ịnabata okwu ahụ.
theological_decisions:
- issue: Otu onye a na-akọwaghị kpọmkwem n'iwu ahụ
  choice: ya nụrụ
  alternative: ha nụrụ
  rationale: τις na ἀκουέτω dị n'ụdị otu onye na Grik. “Ya nụrụ” na-edobe otu onye ahụ n'ụzọ Igbo na-enweghị itinye okike nwoke ma ọ bụ nwaanyị n'ebe Grik na-akọwaghị ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma nwee ugwu. E debere usoro ọnọdụ nke Grik na nkwughachi echiche nke “ịnụ”; “ya” bụ nnọchiaha na-anaghị ekewa nwoke na nwaanyị.
