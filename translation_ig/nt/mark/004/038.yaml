- from: Ma ya onwe ya nọ n'azụ ụgbọ mmiri[a], na-ehi ụra n'elu ihe e ji atụkwasị isi. Ha kpọtere ya sị ya, “Onye Ozizi, ọ bụ na ị chọghị ịma na anyị na-ala n'iyi?”
  to: Ma ya onwe ya nọ n'akụkụ azụ ụgbọ mmiri, na-ehi ụra n'elu ohiri isi[a]. Ha kpọtere ya, sị ya, “Onye Nkụzi, ọ bụ na ị chọghị ịma na anyị na-ala n'iyi?”
  rationale: The revision clarifies that Jesus was in the rear section of the boat, uses idiomatic Igbo for the head-cushion, and moves the footnote to the word it actually explains. It otherwise retains the draft’s faithful rendering of the emphatic subject, narrative action, and the disciples’ urgent reproach.
