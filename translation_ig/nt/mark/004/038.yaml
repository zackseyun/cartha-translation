  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸂αὐτὸς ἦν⸃ ⸀ἐν τῇ πρύμνῃ ἐπὶ τὸ προσκεφάλαιον καθεύδων· καὶ ⸀ἐγείρουσιν αὐτὸν καὶ λέγουσιν αὐτῷ· Διδάσκαλε, οὐ μέλει σοι ὅτι ἀπολλύμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: ig
  text: Ma ya onwe ya nọ n'akụkụ azụ ụgbọ mmiri, na-ehi ụra n'elu ohiri isi[a]. Ha kpọtere ya, sị ya, “Onye Nkụzi, ọ bụ na ị chọghị ịma na anyị na-ala n'iyi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'elu akwa isi.” Okwu Grik ahụ nwere ike ịpụta ohiri isi ma ọ bụ akwa isi e ji akwado isi.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: ya onwe ya nọ
  rationale: Nnọchiaha a kwusiri ike na-egosipụta ọdịiche dị n'etiti Jizọs na ndị ọzọ; ‘ya onwe ya’ na-echekwa ike ahụ n'Igbo.
- source_word: πρύμνῃ
  choice: n'azụ ụgbọ mmiri
  rationale: Nke a na-akọwa kpọmkwem akụkụ azụ nke ụgbọ mmiri n'ụzọ ndị na-agụ Igbo taa ga-aghọta ngwa ngwa.
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: n'elu ihe e ji atụkwasị isi
  rationale: Okwu Grik ahụ pụtara ihe nro e ji akwado isi; nsụgharị a echekwaghị ụdị ihe ahụ karịa ihe isi mmalite kwuru.
- source_word: καθεύδων
  choice: na-ehi ụra
  rationale: Ọ na-egosi na ụra nọ na-aga n'oge ahụ ma bụrụkwa okwu Igbo dị ire.
- source_word: ἐγείρουσιν
  choice: Ha kpọtere ya
  rationale: Ọ bụ ugbu a akụkọ ihe mere eme n'asụsụ Grik, ma oge gara aga bụ ụzọ ebumpụta ụwa isi kọọ ya n'Igbo.
- source_word: λέγουσιν αὐτῷ
  choice: sị ya
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma dị ire isi kwuo na ha gwara ya okwu.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Ọ na-asụgharị ọrụ διδάσκαλος dị ka onye na-akụzi, n'etinyeghị echiche ọzọ dị na ‘Nna Ukwu.’
- source_word: οὐ μέλει σοι
  choice: ọ bụ na ị chọghị ịma
  rationale: Ajụjụ a na-echekwa ụda ebubo na ngwa ngwa dị n'okwu ndị na-eso ụzọ.
- source_word: ἀπολλύμεθα
  choice: anyị na-ala n'iyi
  rationale: Akpaalaokwu a na-egosi mbibi ma ọ bụ ọnwụ na-abịaru nso, ma na-echekwa ịdị ike nke okwu Grik.
theological_decisions:
- issue: Ike na ụda ajụjụ ndị na-eso ụzọ jụrụ Jizọs
  choice: “ọ bụ na ị chọghị ịma na anyị na-ala n'iyi?”
  alternative: “ọ naghị emetụ gị n'obi na anyị na-achọ ịnwụ?”
  rationale: Okwu Grik ahụ bụ ajụjụ siri ike nke nwere ụda ebubo, ọ bụghị nanị ịjụ maka ozi. Nhọrọ a na-echekwa esemokwu ahụ n'akọwaghị ihe Jizọs bu n'obi ma ọ bụ okwukwe ndị na-eso ụzọ.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. E ji ‘n'azụ ụgbọ mmiri’ dochie okwu nka maka stern; e debere ụda ngwa ngwa na ebubo nke ajụjụ ahụ.
