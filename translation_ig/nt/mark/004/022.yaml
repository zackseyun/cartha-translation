    reason: alternative_reading
  revision_rationale: Changed only the second member where the draft’s causative construction exceeded the sense of ἐγένετο. “Ghọrọ” renders “became,” while the repeated “ihe e zoro ezo” preserves the source’s broad concealed/hidden sense. The purpose/result ambiguity of both ἵνα clauses remains represented by “ka” and is noted in the footnote.
