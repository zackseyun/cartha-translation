  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: ig
  text: N’ihi na ọ dịghị ihe e zoro ezo ma ọ bụghị ka e kpughee ya,[a] ọ dịghịkwa ihe ghọrọ ihe e zoro ezo ma ọ bụghị ka ọ pụta ìhè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “N’ihi na ọ dịghị ihe e zoro ezo ma ọ bụghị na a ga-ekpughe ya … ma ọ bụghị na ọ ga-apụta ìhè.” Ahịrịokwu Grik ndị ji ἵνα nwere ike igosi ma nzube ma ihe ga-esi na ya pụta.'
    reason: alternative_reading
lexical_decisions:
- source_word: κρυπτόν
  choice: ihe e zoro ezo
  rationale: Nke a na-egosi ihe a na-adịghị ahụ anya ma ọ bụ nke e kpuchiri, n’etinyeghị echiche na ọ bụ ihe nzuzo e kpachapụrụ anya debe.
- source_word: ἐὰν μὴ ἵνα
  choice: ma ọ bụghị ka
  rationale: Akpaalaokwu a na-egosi ihe a na-ewepụ iche ma na-edebekwa ike nke nzube dị na ἵνα; ọ bụkwa Igbo nkịtị ma doo anya.
- source_word: φανερωθῇ
  choice: e kpughee ya
  rationale: Ọ na-echekwa olu nnara nke ngwaa ahụ ma na-egosi ime ka ihe a na-amaghị ma ọ bụ a na-adịghị ahụ anya pụta ìhè.
- source_word: ἀπόκρυφον
  choice: ihe nzuzo
  rationale: Ọ na-egosi ihe e wepụrụ n’anya ma na-enye ntakịrị mgbanwe n’okwu nke mbụ, n’agbanyeghị na okwu Grik abụọ ahụ nwere nghọta yiri ibe ha.
- source_word: ἐγένετο
  choice: e mere ka ọ bụrụ
  rationale: Ọ na-egosi ịbanye n’ọnọdụ nke ịbụ ihe nzuzo; a họọrọ usoro a ka ahịrịokwu Igbo wee bụrụ ihe doro anya.
- source_word: ἔλθῃ εἰς φανερόν
  choice: ọ pụta ìhè
  rationale: Akpaalaokwu Igbo a bụ nke sitere n’okike ma na-egosi ịbata n’ọnọdụ a na-ahụ anya ma ọ bụ nke ọha maara.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta okwu a na ihe bu ya ụzọ dịka nkọwa ma ọ bụ ihe kpatara ya.
theological_decisions:
- issue: Mmetụta nzube ma ọ bụ ihe ga-esi na ya pụta n’ahịrịokwu ἵνα abụọ ahụ
  choice: Jiri “ka” mee ka mmetụta nzube pụta, ma hapụkwa ohere ka a ghọta ya dịka ihe ga-esi na ya pụta.
  alternative: “ma ọ bụghị na a ga-ekpughe ya … ma ọ bụghị na ọ ga-apụta ìhè.”
  rationale: ἵνα na-egosikarị nzube, ma n’asụsụ Grik Koine ọ pụkwara ịpụta ihe ga-esi na ya pụta. Nsụgharị ahụ echekwala esemokwu nghọta a n’etinyeghị nkwupụta siri ike banyere onye kpatara izochi ihe ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ntụnyere “zoro ezo/kpughee” na “ihe nzuzo/pụta ìhè” chekwaa nhazi ahịrị abụọ ahụ n’enweghị ikwughachi otu okwu n’ụzọ na-adịghị mkpa.
