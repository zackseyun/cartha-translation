id: MRK.4.25
reference: Mark 4:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: ig
  text: N’ihi na onye nwere, a ga-enyekwu ya[a]; ma onye na-enweghị, ọbụna ihe o nwere ka a ga-anapụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, naanị “a ga-enye ya” ka e kwuru; “-kwu” na-egosi mmụba nke ilu a na-atụpụta n’ọdịiche dị n’etiti akụkụ ya abụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: onye
  rationale: Nnọchiaha njikọ a nwere echiche izugbe; “onye” na-egosi onye ọ bụla dabara n’ọnọdụ ahụ ma na-adịkwa mfe n’Igbo.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta okwu a na nke bu ya ụzọ dịka nkọwa ma ọ bụ ihe ndabere ya.
- source_word: ἔχει
  choice: nwere ihe
  rationale: Ọ bụ ngwaa nke inwe ihe; itinye “ihe” na-eme ka ahịrịokwu Igbo zuo oke n’enweghị ịkọwapụta ihe ahụ.
- source_word: δοθήσεται αὐτῷ
  choice: a ga-enyekwu ya
  rationale: Asụsụ Grik ekwughị ihe a ga-enye kpọmkwem, ma ọdịiche dị n’akụkụ abụọ nke ilu ahụ na-egosi mmụba; “-kwu” na-enye nke a n’Igbo n’ụzọ eke.
- source_word: καὶ
  choice: ma
  rationale: N’ebe a njikọ ahụ na-egosi ọdịiche siri ike n’etiti akụkụ abụọ nke ilu ahụ; “ma” bụ njikọ Igbo kacha eke maka ọdịiche a.
- source_word: οὐκ ἔχει
  choice: na-enweghị ihe
  rationale: Nke a na-egosipụta enweghị ihe n’ụzọ doro anya ma kwekọọ na “onye nwere ihe.”
- source_word: ὃ ἔχει
  choice: ihe o nwere
  rationale: Ọ na-edobe ihe ahụ n’ozuzu ya, dịka nnọchiaha neuter nke Grik si mee, n’enweghị ịkọwa ihe ọ bụ.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: a ga-anapụ ya
  rationale: Ọ na-egosi na a ga-ewepụ ihe ahụ n’aka ya; “anapụ” bụ okwu Igbo siri ike ma dị eke maka mfu a.
theological_decisions:
- issue: Ihe a na-ekwughị kpọmkwem n’okwu δοθήσεται
  choice: a ga-enyekwu ya
  alternative: a ga-enye ya
  rationale: Grik hapụrụ ihe a ga-enye n’ekwughị ya. Otú ọ dị, ọdịiche dị n’etiti inwe na ịnapụ na-egosi na ihe onye ahụ nwere ga-abawanye. “Enyekwu” na-eme ka echiche ahụ doo anya n’Igbo n’etinyeghị nkọwa okwukwe ọzọ.
- issue: Ntụaka nwoke n’otu onye nke Grik
  choice: onye ... ya
  alternative: ndị ... ha
  rationale: “Onye ... ya” na-echekwa otu onye nke asụsụ Grik, ma n’Igbo ọ ka nwere ike ịrụ ọrụ dịka okwu gbasara mmadụ niile n’ozuzu.
translation_notes:
  register: Igbo ọkọlọtọ, nke dị ugbu a, dị nsọ ma dị mfe nghọta. A họọrọ usoro ilu dị nkenke ma debe ọdịiche dị n’etiti onye nwere ihe na onye na-enweghị ihe. Enweghị akara nkọwa ala peeji n’ihi na “enyekwu” na-arụ ọrụ nke ọma n’Igbo n’enweghị mkpa ịkọwa mgbakwunye ahụ iche.
