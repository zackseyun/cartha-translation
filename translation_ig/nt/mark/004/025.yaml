    text: N’asụsụ Grik, naanị “a ga-enye ya” ka e kwuru; “-kwu” na-egosi mmụba nke ilu a na-atụpụta n’ọdịiche dị n’etiti akụkụ ya abụọ.
    reason: lexical_alternative
  revision_rationale: The revision removes added object nouns from the two opening clauses, thereby following the Greek’s unspecified object and avoiding an avoidable tension in Igbo. It retains the naturally implied increase in “enyekwu,” while documenting that implication in a footnote. The reordered final clause clearly marks “ọbụna ihe o nwere” as the item that will be taken away.
