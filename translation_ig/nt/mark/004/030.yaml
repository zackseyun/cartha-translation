  text: Καὶ ἔλεγεν· ⸀Πῶς ὁμοιώσωμεν τὴν βασιλείαν τοῦ θεοῦ, ἢ ἐν ⸀τίνι ⸂αὐτὴν παραβολῇ θῶμεν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/030.yaml
  text: And he was saying[a], “How should we compare the kingdom of God, or in what parable should we set it forth?”
translation:
  language: ig
  text: Ọ nọ na-ekwu, “Olee otú anyị ga-esi tụnyere alaeze Chineke, ma ọ bụ ilu dị aṅaa ka anyị ga-eji kọwaa ya?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ma ọ bụ ilu dị aṅaa ka anyị ga-eji gosipụta ya?” N’ebe a, okwu Grik ἐν τίνι παραβολῇ θῶμεν na-ekwu banyere ilu e ji ewepụta ma ọ bụ akọwa alaeze Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ọ nọkwa na-ekwu
  rationale: Ụdị imperfect na-egosi okwu na-aga n’ihu n’akụkọ ahụ; ‘Ọ nọkwa na-ekwu’ na-edobe akụkụ a karịa naanị ‘Ọ sịrị.’
- source_word: Πῶς
  choice: Olee otú
  rationale: Nke a na-ajụ ụzọ a ga-esi mee ntụnyere ahụ, ya mere ‘Olee otú’ bụ okwu Igbo doro anya ma kwekọọ na ajụjụ ahụ.
- source_word: ὁμοιώσωμεν
  choice: anyị ga-esi tụnyere
  rationale: Subjunctive a dị n’ajụjụ ntụgharị uche; usoro ‘anyị ga-esi’ na-eme ka ajụjụ banyere ihe kwesịrị ime daa nke ọma n’Igbo.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ ntụgharị a maara nke ọma nke na-edobe ma ọchịchị Chineke ma ihe oyiyi alaeze dị n’okwu Grik.
- source_word: ἢ
  choice: ma ọ bụ
  rationale: Ọ na-ejikọta ajụjụ nke abụọ dịka ụzọ ọzọ e si kwuo nke mbụ.
- source_word: ἐν τίνι ... παραβολῇ
  choice: ilu dị aṅaa ka anyị ga-eji
  rationale: ἐν tinyere dative nwere ike igosi ihe e ji eme ihe n’ebe a; ‘ka anyị ga-eji’ bụ usoro Igbo ebumpụta ụwa nke na-egosi na ilu ahụ bụ ụzọ e si kọwaa alaeze ahụ.
- source_word: παραβολῇ
  choice: ilu
  rationale: ‘Ilu’ bụ okwu Igbo a na-ejikarị akọwa parable n’Oziọma ma na-edobe ụdị akụkọ ntụnyere ahụ.
- source_word: αὐτὴν ... θῶμεν
  choice: kọwaa ya
  rationale: Ọ bụ ezie na τίθημι pụtara n'ụzọ nkịtị ‘itinye’ ma ọ bụ ‘idowe,’ n’usoro okwu a ọ pụtara iwepụta ma ọ bụ ịkọwa ihe site n’ilu; ‘kọwaa ya’ na-ekwupụta echiche ahụ n’Igbo dị mma.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ajụjụ abụọ ahụ n’ụdị onye mbụ ọtụtụ dịka ha dị na Grik, ma tinye nkọwa ala peeji iji chekwaa ohere abụọ dị na ἐν tinyere dative na ihe oyiyi dị na τίθημι.
