  to: Ọ nọ na-ekwu, “Olee otú anyị ga-esi tụnyere alaeze Chineke, ma ọ bụ ilu dị aṅaa ka anyị ga-eji kọwaa ya?[a]”
  rationale: The revision retains the source's imperfective introduction and its two deliberative questions, while making the opening more idiomatic and removing the misleading explanation in the footnote. The revised note preserves a genuine contextual alternative—“gosipụta” for presenting/set forth—without asserting an unwarranted syntactic ambiguity.
