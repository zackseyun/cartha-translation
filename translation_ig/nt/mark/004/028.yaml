source:
  edition: SBLGNT
  text: ⸀αὐτομάτη ἡ γῆ καρποφορεῖ, πρῶτον χόρτον, ⸂εἶτα στάχυν, εἶτα⸃ ⸂πλήρης σῖτον⸃ ἐν τῷ στάχυϊ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: ig
  text: 'Ala n’onwe ya na-amị mkpụrụ: na mbụ, ome; e mesịa, isi ọka; e mesịakwa, mkpụrụ ọka zuru ezu n’isi ọka ahụ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτομάτη
  choice: n’onwe ya
  rationale: Nke a na-egosi na ala na-emepụta ihe ubi n’enweghị ọrụ mmadụ a na-ahụ anya; okwu a bụ nke Igbo na-ada nke ọma ma ọ naghị enye echiche igwe na-arụ ọrụ n’onwe ya.
- source_word: ἡ γῆ
  choice: Ala
  rationale: N’ọnọdụ ilu ọrụ ugbo a, γῆ bụ ala a kụrụ ihe, ya mere “ala” bụ okwu doro anya ma bụrụkwa nke a na-ejikarị eme ihe.
- source_word: καρποφορεῖ
  choice: na-amị mkpụrụ
  rationale: Nke a na-edobe ihe atụ ọrụ ugbo nke ibu ma ọ bụ imepụta mkpụrụ, ma bụrụ okwu Igbo e ji akọwa osisi ma ọ bụ ala na-enye mkpụrụ.
- source_word: πρῶτον χόρτον
  choice: na mbụ, ome
  rationale: χόρτος n’ebe a bụ ihe mbụ na-epupụta n’osisi ọka. “Ome” na-akọwa ọ̀gbọ̀ mbụ ahụ nke ọma karịa “ahịhịa,” nke nwere ike ime ka onye na-agụ ya chee banyere ụdị osisi ọzọ.
- source_word: εἶτα στάχυν
  choice: e mesịa, isi ọka
  rationale: στάχυς bụ isi ma ọ bụ ntị nke ihe ubi ọka; “isi ọka” bụ okwu doro anya ma dịrị ndị na-agụ Igbo taa mfe nghọta.
- source_word: πλήρης σῖτον
  choice: mkpụrụ ọka zuru ezu
  rationale: Nke a na-edobe πλήρης dị ka “zuru ezu” n’etinyeghị echiche ọzọ nke “chara acha,” ebe σῖτος bụ mkpụrụ ọka n’ozuzu ya ma ọ dịghị mkpa ịkọwapụta otu ụdị ọka.
- source_word: ἐν τῷ στάχυϊ
  choice: n’isi ọka ahụ
  rationale: Nke a na-egosi ebe mkpụrụ ọka ahụ dị ma na-eji otu okwu ahụ e ji sụgharịa στάχυς na mbụ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. A hapụrụ usoro uto atọ nke Grik—ome, isi ọka, na mkpụrụ zuru ezu n’isi ọka—ka ọ pụta ìhè.
