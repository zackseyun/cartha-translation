  text: καὶ γίνεται λαῖλαψ ⸂μεγάλη ἀνέμου⸃, ⸂καὶ τὰ⸃ κύματα ἐπέβαλλεν εἰς τὸ πλοῖον, ὥστε ⸂ἤδη γεμίζεσθαι τὸ πλοῖον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/037.yaml
  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: ig
  text: Oké ifufe bilitere[a], ebili mmiri na-akụbanye n’ime ụgbọ mmiri ahụ[b], nke mere na ụgbọ mmiri ahụ na-ejularị mmiri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-esochi usoro okwu Grik nso, “nnukwu ifufe bilitere.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ebili mmiri na-akụ ụgbọ mmiri ahụ ma na-abanye n’ime ya.” Ngwaa Grik ahụ dị n’oge imperfect, na-egosi omume na-aga n’ihu ma ọ bụ nke na-eme ugboro ugboro.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “nke mere na ụgbọ mmiri ahụ na-ejupụta na mmiri ugbua.” Ụdị Grik ahụ na-egosi na ụgbọ mmiri ahụ nọ n’usoro iju eju.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεται
  choice: bilitere
  rationale: Okwu a bụ historical present n’akụkọ Mak ma na-egosi mmalite ihe ahụ; “bilitere” bụ ụzọ Igbo si akọ na ifufe malitere na mberede.
- source_word: λαῖλαψ μεγάλη ἀνέμου
  choice: Oké ifufe
  rationale: “Oké ifufe” bụ okwu Igbo doro anya ma dịkwa n’ụzọ ebumpụta ụwa maka nnukwu ajọ ifufe; “oké” na-egosipụta μεγάλη, ebe “ifufe” na-edobe nkọwa ἀνέμου.
- source_word: κύματα
  choice: ebili mmiri
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka κύματα n’ọnọdụ mmiri na-efegharị ike.
- source_word: ἐπέβαλλεν εἰς τὸ πλοῖον
  choice: nọkwa na-akụbanye n’ime ụgbọ mmiri
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro; “na-akụbanye” na-egosipụta ma ike ebili mmiri na-akụ ụgbọ ahụ ma mmegharị mmiri banye n’ime ya.
- source_word: πλοῖον
  choice: ụgbọ mmiri
  rationale: “Ụgbọ mmiri” bụ okwu Igbo nkịtị maka obere ụgbọ a na-eji aga n’elu mmiri, ọ dabakwara n’ọnọdụ Ọdọ Mmiri Galili.
- source_word: ὥστε
  choice: nke mere na
  rationale: Nkebiokwu a na-egosipụta ihe si na omume gara aga pụta, dịka ὥστε si arụ ọrụ n’ebe a.
- source_word: ἤδη
  choice: amalitelarị
  rationale: Nsonaazụ “-larị” na-egosipụta na usoro iju ahụ amalitela tupu oge akụkọ ahụ rutere; a jikọtara ya na “amalite” iji mee ka usoro na-aga n’ihu pụta ìhè.
- source_word: γεμίζεσθαι τὸ πλοῖον
  choice: mmiri amalitelarị iju ụgbọ mmiri ahụ
  rationale: Igbo na-ekwukarị ihe a n’ụdị na-arụ ọrụ site n’ịkpọ “mmiri” aha dịka ihe na-eju ụgbọ ahụ. Nke a na-eme ka okwu doo anya ma ka na-edobe usoro iju ahụ na-aga n’ihu.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ “na-akụbanye” iji jikọta echiche nke ebili mmiri na-akụ ụgbọ ahụ ugboro ugboro na nke mmiri na-abanye n’ime ya; e zere okwu ochie ma ọ bụ nke ụka pụrụ iche.
