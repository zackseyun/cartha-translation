source:
  edition: SBLGNT
  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: ig
  text: Ọtụtụ mmadụ zukọtara, nke mere na ebe ahụ enweghịzi ohere, ọbụnadị n’ọnụ ụzọ; ọ na-agwa ha okwu ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ozi ahụ.” N’asụsụ Grik, “okwu ahụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πολλοὶ
  choice: Ọtụtụ mmadụ zukọtara
  rationale: N’Igbo, “zukọtara” bụ ụzọ ebumpụta ụwa isi kwuo na ọtụtụ mmadụ gbakọtara n’otu ebe; ọ na-enye echiche nke συνήχθησαν n’etinyeghị onye kpọkọtara ha, nke ihe odide ahụ na-ekwughị.
- source_word: ὥστε μηκέτι χωρεῖν
  choice: nke mere na ohere adịghịzi
  rationale: Nke a na-egosipụta nsonaazụ ὥστε na echiche μηκέτι χωρεῖν, ya bụ na ebe ahụ enweghịzi ohere.
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: ọbụna n’ebe dị n’akụkụ ọnụ ụzọ ahụ
  rationale: Nke a na-eme ka okwu Grik banyere ebe chere ihu ma ọ bụ dị nso n’ọnụ ụzọ doo anya n’Igbo, ma ghara ịkọwa ya karịa ihe e dere.
- source_word: ἐλάλει αὐτοῖς
  choice: ọ nọkwa na-agwa ha
  rationale: “Ọ nọ ... na-agwa” na-echekwa omume na-aga n’ihu nke imperfect ἐλάλει, ebe “ha” na-anọchi αὐτοῖς n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: τὸν λόγον
  choice: okwu ahụ
  rationale: “Okwu ahụ” na-anọgide nso n’ụdị okwu Grik ma kwe ka a ghọta ya dị ka ozi Jizọs na-ekwusa, n’etinyeghị “nke Chineke,” nke amaokwu a na-ekwughị kpọmkwem.
theological_decisions:
- issue: Ihe τὸν λόγον pụtara n’ihe Jizọs na-ekwu
  choice: okwu ahụ
  alternative: ozi ahụ; okwu Chineke
  rationale: “Okwu ahụ” na-echekwa nghọta sara mbara nke λόγος ma ghara ịgbakwunye “nke Chineke.” Ihe ọzọ kwe omume bụ “ozi ahụ,” ma nke ahụ na-akọwawanye okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu ebumpụta ụwa n’Igbo, ma chekwaa nsonaazụ ὥστε, omume na-aga n’ihu nke ἐλάλει, na oghere nkọwa dị na λόγος.
