revisions:
- from: Ọtụtụ mmadụ zukọtara, nke mere na ohere adịghịzi, ọbụna n’ebe dị n’akụkụ ọnụ ụzọ ahụ; ọ nọkwa na-agwa ha okwu ahụ[a].
  to: Ọtụtụ mmadụ zukọtara, nke mere na ebe ahụ enweghịzi ohere, ọbụnadị n’ọnụ ụzọ; ọ na-agwa ha okwu ahụ[a].
  rationale: The revision clarifies that the lack in view is physical space, renders the doorway clause more directly and naturally, and retains the imperfective action of Jesus speaking as well as the lexical openness of λόγος.
  reviewer_model: gpt-5.6-terra
