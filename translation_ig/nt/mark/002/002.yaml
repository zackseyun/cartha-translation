    text: 'Ma ọ bụ: “ozi ahụ.” N’asụsụ Grik, “okwu ahụ.”'
    reason: lexical_alternative
  revision_rationale: The revision clarifies that the lack in view is physical space, renders the doorway clause more directly and naturally, and retains the imperfective action of Jesus speaking as well as the lexical openness of λόγος.
