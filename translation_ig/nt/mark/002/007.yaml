- from: “Gịnị mere nwoke a ji ekwu okwu otu a? Ọ na-ekwulu Chineke![a] Ònye pụrụ ịgbaghara mmehie ma e wezụga naanị otu onye ahụ, bụ́ Chineke?”[b]
  to: “Gịnị mere nwoke a ji ekwu okwu otu a?”[a] “Ọ na-ekwu okwu nkwulu! Ònye pụrụ ịgbaghara mmehie ma e wezụga Chineke naanị ya?”[b]
  rationale: The revision removes the added explicit object from the blasphemy accusation, replaces an awkward and over-personal rendering of “the one God” with idiomatic Standard Igbo, and relocates footnote a to the opening idiom it explains. It retains the narrative accusation as the scribes’ charge and preserves the source’s exclusive formulation without resolving broader theological questions.
