  text: Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: ig
  text: “Gịnị mere nwoke a ji ekwu okwu otu a?”[a] “Ọ na-ekwu okwu nkwulu! Ònye pụrụ ịgbaghara mmehie ma e wezụga Chineke naanị ya?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị karịa, “Gịnị ka nwoke a na-ekwu otu a?” N’ụdị okwu Grik a, ajụjụ ahụ pụtara, “Gịnị mere nwoke a ji ekwu okwu otu a?”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ma e wezụga otu Chineke.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ... οὕτως λαλεῖ
  choice: Gịnị mere ... ji ekwu okwu otu a?
  rationale: N’ụdị ajụjụ a, Τί na-ajụ ihe kpatara o ji kwuo otu a, ọ bụghị naanị ihe o kwuru; ntụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: οὗτος
  choice: nwoke a
  rationale: Ọ na-ezo aka n’ebe Jizọs nọ n’ụzọ na-egosi ịjụ ya, ma ‘nwoke a’ adịghị agbakwụnye nlelị karịrị nke Grik kwuru.
- source_word: βλασφημεῖ
  choice: Ọ na-ekwulu Chineke
  rationale: N’Igbo, ‘ikwulu Chineke’ na-ebute ebubo nkwulu dị n’okwu Grik n’ụzọ doro ndị na-agụ akwụkwọ anya, ma na-echekwa omume na-aga n’ihu nke ngwaa ugbu a.
- source_word: τίς δύναται
  choice: Ònye pụrụ
  rationale: Nke a na-egosipụta ajụjụ gbasara ikike ma ọ bụ ike ime ihe ahụ n’Igbo dị nkenke ma dị ùgwù.
- source_word: ἀφιέναι ἁμαρτίας
  choice: ịgbaghara mmehie
  rationale: N’ọnọdụ a, ἀφίημι pụtara ịgbaghara; nke a bụkwa okwu Igbo a na-ejikarị eme ihe mgbe a na-ekwu maka mmehie.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: ma e wezụga naanị otu onye ahụ, bụ́ Chineke
  rationale: Ọ na-echekwa ma echiche nkewapụ (‘ma e wezụga’) ma nkwusi ike εἷς, n’enweghị ịhapụ ohere nke ịsụgharị ya n’ụzọ dị mkpụmkpụ dịka ‘naanị Chineke.’
theological_decisions:
- issue: Ma a ga-eme ka οὗτος bụrụ okwu nlelị siri ike
  choice: nwoke a
  alternative: onye a; nwoke nke a
  rationale: Okwu ndị odeakwụkwọ ahụ nwere nguzogide, ma ntụgharị ekwesịghị ịgbakwunye mkparị nke ederede Grik ekwughị kpọmkwem.
- issue: Ike ebubo βλασφημεῖ
  choice: Ọ na-ekwulu Chineke!
  alternative: Ọ na-ekwu okwu nkwulu!
  rationale: A na-echekwa ebubo okpukpe ndị odeakwụkwọ na-ebo Jizọs, ma a naghị edozi esemokwu gbasara onye Jizọs bụ n’ime ntụgharị ahụ.
- issue: Ihe εἷς ὁ θεός pụtara
  choice: naanị otu onye ahụ, bụ́ Chineke
  alternative: naanị Chineke
  rationale: Nhọrọ bụ isi na-eme ka εἷς pụta ìhè dịka ‘otu,’ ebe ndetu ala peeji na-enye ntụgharị Igbo dị nkenke ma kwe omume; e jighị nke ọ bụla tinye nkọwa ụka pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, mee ihe. A họọrọ ‘nwoke a’ iji gosi ịdị anya nke ndị odeakwụkwọ n’enweghị ịgbakwunye mkparị; a hapụrụ nkwusi ike dị na ‘otu ... Chineke’ ka ọ pụta ìhè, tinyekwa ụzọ ọzọ dị nkenke na ndetu ala peeji.
