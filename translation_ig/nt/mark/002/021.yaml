translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị nsọpụrụ ma dị mfe nghọta. E chekwara ihe atụ banyere akwa ọhụrụ na uwe ochie, ma kọwaa okwu teknụzụ banyere akwa na-atachi site n’okpuru peeji.
