- from: Ọ dịghị onye na-adụnye ibé akwa a na-edozichabeghị nke ga-atachi n’uwe ochie[a]. Ma ọ bụghị ya[b], ibé ọhụrụ ahụ ga-adọkapụ n’uwe ochie ahụ, ebe adọwara adọwa ya adịkwuo njọ.
  to: Ọ dịghị onye na-adụnye ibé akwa a na-edozichabeghị, nke ga-atachi, n’uwe ochie[a]. Ma ọ bụghị ya[b], ibé ọhụrụ ahụ ga-adọpụ n’uwe ochie ahụ, ndọwa ahụ adịkwuo njọ.
  rationale: The revision clarifies the practical force of ‘unfulled/unshrunk’ cloth, improves the natural Igbo expression for the worsening tear, and corrects the literal footnote’s unsupported ‘in it.’ It retains the source’s difficult new/old wording in a note rather than forcing a more specific interpretation into the verse.
