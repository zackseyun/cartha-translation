source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: ig
  text: Ọ dịghị onye na-adụnye ibé akwa a na-edozichabeghị, nke ga-atachi, n’uwe ochie[a]. Ma ọ bụghị ya[b], ibé ọhụrụ ahụ ga-adọpụ n’uwe ochie ahụ, ndọwa ahụ adịkwuo njọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘ibé akwa a na-emebeghị ka ọ ghara ịta.’ Okwu Grik ahụ na-ekwu maka akwa a na-edoziabeghị site n’usoro dị ka ịsa ya ma ọ bụ ịkụ ya, nke na-eme ka ọ ghara ịta mgbe e mesịrị.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ nkịtị: ‘ọ na-ewepụ ihe e ji mejupụta ya n’ebe ahụ—nke ọhụrụ n’ihe ochie.’ Nke a bụ okwu Grik siri ike; ihe a na-ekwu bụ na ibé ọhụrụ ahụ na-adọpụ n’uwe ochie ahụ, mee ka ndọwa ahụ ka njọ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίβλημα
  choice: ibé akwa
  rationale: N’ebe a, okwu ahụ pụtara ibé akwa e ji ekpuchi ma ọ bụ rụzie ebe uwe dọwara; ‘ibé akwa’ bụ okwu Igbo doro anya n’ọnọdụ a.
- source_word: ῥάκους ἀγνάφου
  choice: akwa a na-edozichabeghị nke ga-atachi
  rationale: ἄγναφος bụ akwa a na-arụchabeghị ka ọ ghara ịtachi. Nsụgharị a na-egosi ma ọnọdụ akwa ahụ ma ihe ga-eme ya mgbe e mesịrị.
- source_word: ἐπιράπτει
  choice: na-adụnye ... n’uwe
  rationale: Okwu a pụtara iji agịga na eri dụnye ihe n’ihe ọzọ; ‘dụnye’ na-echekwa ihe a na-eme n’ezie.
- source_word: ἱμάτιον παλαιόν
  choice: uwe ochie
  rationale: ἱμάτιον nwere ike ịbụ uwe n’ozuzu ya, ya mere ‘uwe’ na-ezere ịkọwa ya dị ka otu ụdị uwe pụrụ iche.
- source_word: εἰ δὲ μή
  choice: Ma ọ bụghị ya
  rationale: Nke a na-egosi n'ụzọ Igbo dị ire ụtọ ihe ga-esi n’omume ahụ pụta ma e mee ya.
- source_word: αἴρει
  choice: ga-adọkapụ
  rationale: N’ọnọdụ a, okwu ahụ na-egosi na ibé ọhụrụ ahụ na-adọpụ akụkụ uwe ochie, mee ka ndọwa ahụ ka njọ.
- source_word: τὸ πλήρωμα
  choice: ibé ọhụrụ ahụ
  rationale: N’ebe a, πλήρωμα bụ ihe e tinyere iji mejupụta ebe dọwara, ya bụ ibé akwa ahụ; ịkpọ ya ‘ibé ọhụrụ ahụ’ na-eme ka okwu ahụ doo anya.
- source_word: τὸ καινὸν τοῦ παλαιοῦ
  choice: ibé ọhụrụ ahụ ga-adọkapụ n’uwe ochie ahụ
  rationale: Nke a na-eme ka njikọ siri ike nke Grik doo anya n’Igbo, ma na-echekwa ọdịiche dị n’etiti ihe ọhụrụ na ihe ochie.
- source_word: χεῖρον σχίσμα γίνεται
  choice: ebe adọwara adọwa ya adịkwuo njọ
  rationale: schisma bụ ndọwa ma ọ bụ mgbawa; okwu a na-egosi na ndọwa dịbu adị ga-aka njọ.
