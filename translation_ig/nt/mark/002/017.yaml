id: MRK.2.17
reference: Mark 2:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: ig
  text: Mgbe Jizọs nụrụ ya, ọ sịrị ha, “Ndị siri ike[a] anaghị achọ dibịa, kama ndị na-arịa ọrịa. Abịaghị m ịkpọ ndị ezi omume[b], kama ndị mmehie.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ahụ gbasiri ike” ma ọ bụ “ndị ahụ́ dị mma.” Okwu Grik ahụ n'ụzọ nkịtị na-ekwu maka ndị siri ike ma ọ bụ ndị ahụ́ dị mma.
    reason: lexical_alternative
  - marker: b
    text: N’ihi ihe gbara okwu a gburugburu, a pụkwara ịghọta “ndị ezi omume” dị ka ndị a na-ewere dị ka ndị ezi omume ma ọ bụ ndị na-ewere onwe ha otú ahụ; ma ihe odide Grik n’onwe ya na-ekwu naanị “ndị ezi omume.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Mgbe Jizọs nụrụ ya
  rationale: Nkebiokwu oge a na-egosi na ịnụ ihe ahụ bu ụzọ tupu Jizọs azaghachi; e tinyere ‘ya’ dịka ihe ọ nụrụ, nke ihe gbara amaokwu ahụ gburugburu na-egosi.
- source_word: λέγει
  choice: ọ sịrị ha
  rationale: Ọ bụ ezie na Grik ji historical present, ‘ọ sịrị’ bụ ụzọ Igbo si akọ akụkọ n'ụzọ eke ma doo anya.
- source_word: οἱ ἰσχύοντες
  choice: ndị ahụ siri ike
  rationale: Nke a na-edobe isi echiche nke ἰσχύω, bụ́ inwe ike ma ọ bụ ịdị ike, n’ime ihe atụ gbasara dibịa; ‘ndị ahụ gbasiri ike’ ka edere n’ala peeji dịka nkọwa ọzọ.
- source_word: χρείαν ἔχουσιν ἰατροῦ
  choice: mkpa dibịa dịịrị
  rationale: Akpaalaokwu Igbo a na-ekwupụta n'ụzọ eke na mmadụ chọrọ dibịa, ma njikọ ya na ‘ọ bụghị’ na-egosi na ndị siri ike adịghị mkpa dibịa.
- source_word: οἱ κακῶς ἔχοντες
  choice: ndị ahụ na-arịa ọrịa
  rationale: Akpaalaokwu Grik a na-ejikarị akọwa ndị ahụ na-adịghị ike n’ahụ́ ma ọ bụ ndị ọrịa; nsụgharị a na-eme ka ntụnyere ahụ doo anya.
- source_word: οὐκ ἦλθον καλέσαι
  choice: Abịaghị m ịkpọ
  rationale: Nke a na-edobe nkwupụta Jizọs banyere ebumnuche ọ bịara ya nakwa nghọta sara mbara nke καλέσαι dị ka ịkpọ mmadụ.
- source_word: δικαίους
  choice: ndị ezi omume
  rationale: Nke a na-edobe aha otu ndị a kpọrọ ndị na-eme ezi omume n’emeghị ka okwu ahụ bụrụ ihe e kwuru n’ụzọ ịkwa emo n’ahịrị bụ isi.
- source_word: ἁμαρτωλούς
  choice: ndị mmehie
  rationale: Ọ bụ okwu Igbo a na-ejikarị eme ihe maka ndị a na-akọwa site ná mmehie ha, ma ọ na-edobe ụdị aha otu mmadụ dị na Grik.
theological_decisions:
- issue: Ma a ga-eme ka ihe Jizọs nụrụ pụta ìhè
  choice: E tinyere ‘ya’ n’enweghị ịkọwa kpọmkwem ihe ahụ bụ.
  alternative: Ịsị naanị ‘Mgbe Jizọs nụrụ’ ma ọ bụ ịkọwa ya dị ka mkpesa ndị odeakwụkwọ.
  rationale: Grik ekwughị ihe ọ nụrụ kpọmkwem, ọ bụ ezie na ihe gbara ya gburugburu na-egosi ya. ‘Ya’ na-eme ka Igbo dịrị eke n’ebughị nkọwa ọzọ bata.
- issue: Historical present dị na λέγει
  choice: A sụgharịrị ya ‘ọ sịrị ha.’
  alternative: ‘ọ na-asị ha’ ma ọ bụ ‘ọ sị ha.’
  rationale: Igbo na-ejikarị oge gara aga akọ akụkọ; nhọrọ a na-eme ka okwu ahụ bụrụ nke eke ma ghara ịgbanwe ihe ọ pụtara.
- issue: Ma ‘ndị ezi omume’ bụ okwu e ji ịkwa emo
  choice: E debere ‘ndị ezi omume’ n’ahịrị bụ isi.
  alternative: ‘ndị na-ewere onwe ha dị ka ndị ezi omume.’
  rationale: Ọnọdụ ahụ nwere ike ime ka a ghọta okwu ahụ n’ụzọ ịkwa emo, ma Grik n’onwe ya na-ekwu naanị ‘ndị ezi omume.’ Ihe odide bụ isi na-edobe esemokwu nkọwa ahụ; ndetu ala peeji na-akọwa ohere ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Dibịa’ dabara na ihe atụ gbasara ọgwụgwọ n’amaokwu a; a zere nkọwa ụka pụrụ iche. Akara ndetu [a] na [b] dị n’ahịrị bụ isi, ha kwekọrọ na ndetu ala peeji.
