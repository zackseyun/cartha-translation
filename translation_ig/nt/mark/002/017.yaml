revisions:
- from: Mgbe Jizọs nụrụ ya, ọ sịrị ha, “Ọ bụghị ndị ahụ siri ike[a] ka mkpa dibịa dịịrị, kama ọ bụ ndị ahụ na-arịa ọrịa. Abịaghị m ịkpọ ndị ezi omume[b], kama ndị mmehie.”
  to: Mgbe Jizọs nụrụ ya, ọ sịrị ha, “Ndị siri ike[a] anaghị achọ dibịa, kama ndị na-arịa ọrịa. Abịaghị m ịkpọ ndị ezi omume[b], kama ndị mmehie.”
  rationale: The revision corrects the central syntactic reversal in the medical proverb while retaining the source's contrast between the strong/well and the sick. It keeps the Greek's unqualified “the righteous” in the main text and confines the possible contextual irony to the footnote. Footnote a is made idiomatic and restricted to the actual lexical alternative.
  reviewer_model: gpt-5.6-terra
