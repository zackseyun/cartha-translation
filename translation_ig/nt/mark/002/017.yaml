review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the temporal participle, the medical contrast, Jesus'' mission statement, and the unexpanded categories “the righteous” and “sinners.” However, the first saying''s Igbo construction reverses the intended relationship: “Ọ bụghị ndị ahụ siri ike ka mkpa dibịa dịịrị” states, in effect, that the need for a physician belongs to the strong, rather than that the strong have no need of one.'
  naturalness: Most of the register is clear Standard Igbo. “Ndị siri ike anaghị achọ dibịa” is a natural, idiomatic way to express having no need of a physician. The retained past-tense narrative form “ọ sịrị ha” is natural Igbo, even though it does not reproduce the Greek historical present formally.
  terminology: “Jizọs,” “dibịa,” “ndị ezi omume,” and “ndị mmehie” are appropriate and theologically noncommittal. The lexical footnote should be recast because its current final sentence (“na-ezo aka n’ebe ... nọ”) is not idiomatic and inaccurately frames the Greek wording as a reference to a place.
  issues:
  - severity: high
    issue: The clause “Ọ bụghị ndị ahụ siri ike ka mkpa dibịa dịịrị” misassigns who has the need for a physician.
    rationale: Greek οὐ χρείαν ἔχουσιν ... ἰατροῦ means that the strong/well do not have need of a physician. The draft's cleft construction says that need belongs to the strong.
  - severity: medium
    issue: 'Footnote a contains an unnatural and imprecise explanation: “na-ezo aka n’ebe ndị siri ike ma ọ bụ ndị ahụ́ dị mma nọ.”'
    rationale: The Greek expression describes persons as strong/well; it does not refer to their location or situation. A direct lexical explanation is clearer and more accurate.
  revised_text: Mgbe Jizọs nụrụ ya, ọ sịrị ha, “Ndị siri ike[a] anaghị achọ dibịa, kama ndị na-arịa ọrịa. Abịaghị m ịkpọ ndị ezi omume[b], kama ndị mmehie.”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ahụ gbasiri ike” ma ọ bụ “ndị ahụ́ dị mma.” Okwu Grik ahụ n'ụzọ nkịtị na-ekwu maka ndị siri ike ma ọ bụ ndị ahụ́ dị mma.
    reason: lexical_alternative
  - marker: b
    text: N’ihi ihe gbara okwu a gburugburu, a pụkwara ịghọta “ndị ezi omume” dị ka ndị a na-ewere dị ka ndị ezi omume ma ọ bụ ndị na-ewere onwe ha otú ahụ; ma ihe odide Grik n’onwe ya na-ekwu naanị “ndị ezi omume.”
    reason: alternative_reading
  revision_rationale: The revision corrects the central syntactic reversal in the medical proverb while retaining the source's contrast between the strong/well and the sick. It keeps the Greek's unqualified “the righteous” in the main text and confines the possible contextual irony to the footnote. Footnote a is made idiomatic and restricted to the actual lexical alternative.
