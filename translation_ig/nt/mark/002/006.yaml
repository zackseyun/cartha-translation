  text: ἦσαν δέ τινες τῶν γραμματέων ἐκεῖ καθήμενοι καὶ διαλογιζόμενοι ἐν ταῖς καρδίαις αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/006.yaml
  text: 'But some of the scribes were sitting there[a], reasoning in their hearts:'
translation:
  language: ig
  text: 'Ma ụfọdụ n’ime ndị odeakwụkwọ nọ ọdụ n’ebe ahụ, na-atụgharị uche n’obi ha, sị:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Ma ... nọ
  rationale: δέ na-egosi mgbanwe gaa n’echiche nke ìgwè ọzọ ma nwee ntakịrị ọdịiche; “Ma” na-egosipụta nke a n’Igbo nkịtị, ebe “nọ” dabara na nhazi ahịrịokwu ahụ.
- source_word: τινες τῶν γραμματέων
  choice: ụfọdụ n’ime ndị odeakwụkwọ
  rationale: “ụfọdụ n’ime” na-echekwa genitive partitive, ya bụ na ọ bụ naanị ụfọdụ ndị so n’ìgwè ndị odeakwụkwọ ahụ.
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: Nke a bụ ntụgharị doro anya ma bụrụ nke a na-asụkarị maka adverb ebe ahụ.
- source_word: καθήμενοι
  choice: nọ ọdụ
  rationale: Ọ na-akọ ọnọdụ ha n’ebe ahụ n’ụzọ Igbo dị mfe ma kwekọọ n’omume na-aga n’ihu nke participle ahụ.
- source_word: διαλογιζόμενοι
  choice: na-atụgharị uche
  rationale: Okwu a na-egosi iche echiche ma ọ bụ ịtụle ihe n’ime onwe mmadụ; “na-atụgharị uche” na-egosipụta echiche ime obi a n’enweghị ịgbakwunye na ha amalitela ikwu okwu.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: n’obi ha
  rationale: Nke a na-echekwa akpaalaokwu Akwụkwọ Nsọ nke na-ewere obi dị ka ebe echiche ime mmadụ dị, ma ọ bụkwa okwu Igbo sitere n’okike.
theological_decisions:
- issue: 'Akpaalaokwu banyere mmadụ: καρδίαις'
  choice: n’obi ha
  alternative: n’ime onwe ha; n’uche ha
  rationale: “N’obi ha” na-echekwa ihe odide Grik kwuru na echiche Akwụkwọ Nsọ banyere obi dị ka ebe mmadụ na-eche echiche, n’enweghị ime ka ọdịiche ọgbara ọhụrụ dị n’etiti obi na uche banye n’amaokwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E jiri “ndị odeakwụkwọ” mee γραμματεῖς n’ihi ọrụ ha dị ka ndị maara ma na-akụzi Iwu; ahịrịokwu ahụ na-agwụ na “sị:” iji jikọta echiche ime obi ha na okwu na-esochi n’amaokwu ọzọ.
