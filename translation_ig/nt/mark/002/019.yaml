    text: N’ụzọ nkịtị, “ụmụ nke ụlọ agbamakwụkwọ” ma ọ bụ “ụmụ nke ime ụlọ agbamakwụkwọ.” Nke a bụ akpaalaokwu a na-akpọ ndị sonyere n’emume na ọṅụ agbamakwụkwọ.
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s rhetorical question, bridegroom metaphor, and explicit ‘have’ in the second sentence. It corrects the temporal idiom and the lexical footnote without adding theological interpretation.
