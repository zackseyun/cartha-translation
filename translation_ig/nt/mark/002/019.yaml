source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: ig
  text: Jizọs wee sị ha, “Ndị sonyere n’emume agbamakwụkwọ[a] hà pụrụ ibu ọnụ mgbe nwoke na-alụ nwanyị ọhụrụ nọnyere ha? Ọ bụrụhaala na ha nwere nwoke na-alụ nwanyị ọhụrụ nọnyere ha, ha apụghị ibu ọnụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ụmụ nke ụlọ agbamakwụkwọ” ma ọ bụ “ụmụ nke ime ụlọ agbamakwụkwọ.” Nke a bụ akpaalaokwu a na-akpọ ndị sonyere n’emume na ọṅụ agbamakwụkwọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: hà pụrụ ibu ọnụ ...?
  rationale: Ajụjụ a ji μή atụ anya azịza na-adịghị mma. Ụdị ajụjụ Igbo a na-egosi nke ọma na a tụrụ anya azịza, ‘Mba, ha apụghị.’
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: Ndị sonyere n’emume agbamakwụkwọ
  rationale: Nke a bụ akpaalaokwu pụtara ndị so n'ọṅụ na emume agbamakwụkwọ, ọ bụghị ‘ụmụ nke ụlọ agbamakwụkwọ’ n'ụzọ nkịtị.
- source_word: ἐν ᾧ ... ἐστιν
  choice: mgbe ... nọnyere ha
  rationale: Nkebiokwu a na-egosi oge n'ebe a; ‘mgbe’ bụ ụzọ Igbo doro anya ma dị mfe.
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: nwoke na-alụ nwanyị ọhụrụ
  rationale: Nhọrọ a na-echekwa ihe atụ nke nwoke na-alụ nwanyị n’agbamakwụkwọ ma ghara ịkọwa ihe ọ pụtara n’ụzọ nkà mmụta okpukpe.
- source_word: μετ’ αὐτῶν
  choice: nọnyere ha / n’etiti ha
  rationale: μετά na genitive na-egosi ịnọkọ ọnụ. A họọrọ ụzọ abụọ kwekọrọ n’Igbo iji zere nkwughachi na-adịghị eke, ebe a ka na-echekwa otu echiche ahụ.
- source_word: ὅσον χρόνον
  choice: Ruo oge
  rationale: Nkebiokwu ahụ na-egosi ogologo oge ọnọdụ ahụ dị; ‘Ruo oge’ na-enye echiche ahụ n’Igbo dị ugbu a.
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: ha nwere nwoke na-alụ nwanyị ọhụrụ n’etiti ha
  rationale: A na-echekwa ngwaa ἔχουσιν, ‘ha nwere,’ kama ime ya naanị ‘ọ nọnyere ha.’
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: Jizọs wee sị ha
  rationale: Nke a bụ ụzọ akụkọ Igbo dị larịị na nke kwanyere ugwu si gosipụta njikọ καί na okwu Jizọs kwuru.
theological_decisions:
- issue: Ihe atụ nke Jizọs dịka nwoke na-alụ nwanyị ọhụrụ
  choice: Echekwara ihe atụ ahụ n’ederede n’enweghị nkọwa ọzọ.
  alternative: Ịkọwa ya n'ụzọ ga-eme ka njirimara Mesaya ma ọ bụ ihe oyiyi di na nwunye pụta ìhè karịa.
  rationale: Amaokwu ahụ na-eji ihe oyiyi nwoke na-alụ nwanyị ọhụrụ eme ihe maka Jizọs, ma nsụgharị ekwesịghị itinye nkọwa nkà mmụta okpukpe nke okwu ahụ n’onwe ya ekwughị.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, doro anya, ma kwanyere ugwu. E jiri ‘ibu ọnụ’ mee fasting, ma debe ajụjụ nkwupụta na ihe atụ nke nwoke na-alụ nwanyị ọhụrụ.
