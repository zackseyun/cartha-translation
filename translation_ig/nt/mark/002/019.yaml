review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the rhetorical negative question, fasting, the bridegroom image, and the second clause’s explicit ‘have.’ However, ‘Ruo oge’ does not adequately convey ὅσον χρόνον (‘as long as/for as long as’) in this context.
  naturalness: Most of the verse is clear Standard Igbo. Replacing ‘Ruo oge’ with ‘Ọ bụrụhaala na’ produces a natural duration/continuance expression and avoids an abrupt, less idiomatic construction.
  terminology: '‘Ndị sonyere n’emume agbamakwụkwọ’ is an appropriate idiomatic rendering of the wedding-participant idiom without narrowing it to attendants. ‘Nwoke na-alụ nwanyị ọhụrụ’ suitably preserves the bridegroom image. The footnote’s second literal alternative needs correction: νυμφῶνος refers to a wedding/bridal chamber setting, not specifically ‘ime ụlọ nwanyị a na-alụ ọhụrụ.’'
  issues:
  - severity: medium
    issue: Temporal phrase ‘Ruo oge’
    rationale: Ὅσον χρόνον means ‘as long as’ and introduces the duration during which the bridegroom remains with them. ‘Ruo oge’ is less natural here and can suggest ‘until a time’ rather than the intended continuing condition.
  - severity: low
    issue: Footnote’s literal wording for ‘bridal chamber’
    rationale: ‘Ime ụlọ nwanyị a na-alụ ọhụrụ’ shifts the reference from the bridal/wedding chamber to the bride herself. A wording such as ‘ime ụlọ agbamakwụkwọ’ better reflects the lexical alternative while remaining intelligible.
  revised_text: Jizọs wee sị ha, “Ndị sonyere n’emume agbamakwụkwọ[a] hà pụrụ ibu ọnụ mgbe nwoke na-alụ nwanyị ọhụrụ nọnyere ha? Ọ bụrụhaala na ha nwere nwoke na-alụ nwanyị ọhụrụ nọnyere ha, ha apụghị ibu ọnụ.”
  revised_footnotes:
