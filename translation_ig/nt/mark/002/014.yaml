id: MRK.2.14
reference: Mark 2:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: ig
  text: Mgbe ọ na-agafe, ọ hụrụ Livaị, nwa Alfiọs, ka ọ nọ ọdụ n'ebe a na-anakọta ụtụ isi[a]. Ọ sịrị ya, “Soro m.” O wee bilie soro ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe a na-anakọta ụgwọ kọstọm ma ọ bụ ụgwọ ụzọ.” Okwu Grik ahụ pụrụ izo aka n'ebe a na-anakọta ụtụ isi ma ọ bụ ụgwọ kọstọm.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων
  choice: Mgbe ọ na-agafe
  rationale: Nkebi a na-egosi omume na-aga n’ihu n’otu oge ahụ ọ hụrụ Livاي; nsụgharị a bụ Igbo ebumpụta ụwa ma debe usoro ihe ahụ.
- source_word: εἶδεν
  choice: ọ hụrụ
  rationale: Nke a bụ ntụgharị kpọmkwem nke ὁράω, n’etinyeghị echiche ọzọ dịka ‘ọ chọpụtara.’
- source_word: Λευὶν
  choice: Livاي
  rationale: A sụgharịghị aha mmadụ; e dere ya dịka ụda aha Grik si kwekọọ n’Igbo.
- source_word: τὸν τοῦ Ἁλφαίου
  choice: nwa Alfiọs
  rationale: Usoro genitiv a na-egosi na Livاي bụ nwa Alfiọs; Igbo chọrọ ka e kwuo mmekọrịta ahụ hoo haa.
- source_word: καθήμενον
  choice: ka ọ nọ ọdụ
  rationale: Ọ na-akọ ọnọdụ Livاي mgbe Jizọs hụrụ ya, ma okwu a bụ nke a na-aghọta ngwa ngwa n’Igbo.
- source_word: ἐπὶ τὸ τελώνιον
  choice: n’ụlọ nta ebe a na-anakọta ụtụ isi
  rationale: τελώνιον bụ ebe a na-anakọta ụtụ isi ma ọ bụ ụgwọ kọstọm; nkọwa a doro anya ma ghara ime ka ọ bụrụ naanị ọnụ ụzọ okporo ụzọ.
- source_word: λέγει
  choice: Ọ sịrị ya
  rationale: Ọ bụ ezie na Grik ji present akụkọ ihe mere eme, Igbo nkịtị na-eji oge gara aga n’akụkọ; nke a na-eme ka akụkọ ahụ dị ire n’enweghị mgbanwe n’ihe ọ pụtara.
- source_word: Ἀκολούθει μοι
  choice: Soro m
  rationale: Iwu a dị nkenke ma debe njikọ nke iso mmadụ n’ụzọ nkịtị nakwa dịka onye na-eso ụzọ.
- source_word: ἀναστὰς
  choice: O wee bilie
  rationale: Ọ na-egosi omume Livاي mere tupu ya esoro Jizọs; ‘wee’ na-enye usoro omume ahụ n’Igbo nke ọma.
- source_word: ἠκολούθησεν αὐτῷ
  choice: soro ya
  rationale: Ọ na-emegharị otu ngwaa ahụ dị n’iwu Jizọs, ma ghara ịkọwa ya karịa ihe ederede kwuru.
theological_decisions:
- issue: Oge ngwaa n’akụkọ Mak—historical present λέγει
  choice: 'Jiri oge gara aga n’Igbo: “Ọ sịrị ya.”'
  alternative: 'Debe present ahụ: “Ọ na-asị ya.”'
  rationale: Historical present na-enye akụkọ Grik ndụ, ma n’Igbo Standard, “ọ na-asị ya” n’etiti omume gara aga nwere ike ịdị ka omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro. Oge gara aga na-ebuga ọrụ akụkọ ahụ nke ọma n’enweghị mgbakwunye ozizi.
- issue: Ihe τελώνιον na-ezo aka na ya
  choice: Kọwaa ya dịka “ụlọ nta ebe a na-anakọta ụtụ isi,” ma tinye ụzọ ọzọ na nkọwa ala peeji.
  alternative: “ụlọ ọrụ ụtụ isi” ma ọ bụ “ebe a na-anakọta ụgwọ ụzọ”
  rationale: Okwu Grik nwere ike ịgụnye ebe a na-anakọta ụtụ isi ma ọ bụ ụgwọ kọstọm/ụzọ. Isi ederede jiri okwu sara mbara; nkọwa ala peeji na-echekwa ọdịiche ahụ.
translation_notes:
  register: Igbo Standard dị ugbu a, dị mfe ma dị nsọpụrụ. E mere ka ahịrịokwu ahụ na-aga were were site n’iji “wee.” A họọrọ nkọwa doro anya maka τελώνιον kama okwu teknụzụ a na-agaghị aghọta ngwa ngwa. Agbanyeghị, a ga-enyocha ide aha “Livاي,” n’ihi na mkpụrụedemede na-abụghị nke Igbo batara na ya.
