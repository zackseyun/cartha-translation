revisions:
- from: Ọ na-agwakwa ha sị, “Ụbọchị Izu Ike bịara dịrị mmadụ[a], ọ bụghịkwa mmadụ ka o ji dịrị Ụbọchị Izu Ike.”
  to: Ọ nọ na-agwa ha sị, “E mere ụbọchị izu ike maka mmadụ[a], ọ bụghịkwa mmadụ ka e mere maka ụbọchị izu ike.”
  rationale: 'The revision replaces unclear expressions with a balanced passive construction: “E mere ... maka ...; ọ bụghị ... ka e mere maka ....” This accurately communicates the Greek contrast of purpose while remaining natural in Standard Igbo. The footnote retains the inclusive, representative sense of the singular ἄνθρωπος.'
