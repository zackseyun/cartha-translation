  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: ig
  text: Ọ nọ na-agwa ha sị, “E mere ụbọchị izu ike maka mmadụ[a], ọ bụghịkwa mmadụ ka e mere maka ụbọchị izu ike.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụ mmadụ niile” ma ọ bụ “agbụrụ mmadụ.” N’asụsụ Grik, okwu ahụ bụ mmadụ n’otu, ma e jiri ya na-ekwu maka mmadụ niile n’ozuzu ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ọ na-agwakwa ha sị
  rationale: Ụdị imperfect na-egosi okwu ọ nọ na-ekwu n’oge ahụ ma ọ bụ nke ọ na-ekwughachi; ‘na-agwakwa’ na-egosipụta akụkụ a n’Igbo n’ụzọ sitere n’okwu nkịtị.
- source_word: σάββατον
  choice: Ụbọchị Izu Ike
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ụbọchị na usoro Sabbath. ‘Ụbọchị Izu Ike’ bụ okwu Igbo doro anya nke na-adịghị etinye nkọwa agbakwunyere n’amaokwu ahụ.
- source_word: διὰ τὸν ἄνθρωπον
  choice: dịrị mmadụ
  rationale: διά ya na accusative na-egosi nzube ma ọ bụ uru—ihe dị maka mmadụ. ‘Dịrị mmadụ’ na-ebute echiche ahụ n’Igbo eke.
- source_word: ἐγένετο
  choice: bịara dịrị
  rationale: γίνομαι pụtara ịbịa ịdị ma ọ bụ ịmalite ịdị. ‘Bịara dịrị’ na-echekwa echiche mmalite na nzube ya n’enweghị ịkọwapụta kpọmkwem na e ‘kere’ ya.
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: ọ bụghịkwa mmadụ ka o ji dịrị Ụbọchị Izu Ike
  rationale: 'Nke a na-echekwa ntụnyere megidere ibe ya: ọ bụghị mmadụ ka e mere ma ọ bụ ka ọ dị maka uru Ụbọchị Izu Ike. Nhazi ahụ na-eme ka ellipsis Grik bụrụ Igbo a na-aghọta nke ọma.'
theological_decisions:
- issue: ἄνθρωπος dị n’otu mkpụrụokwu ma na-anọchi mmadụ niile
  choice: Jiri ‘mmadụ’ n’isiokwu, tinyekwa nkọwa ala peeji na ọ na-ezo aka n’ụmụ mmadụ niile.
  alternative: ụmụ mmadụ niile / agbụrụ mmadụ
  rationale: ‘Mmadụ’ n’Igbo nwere ike ịbụ otu onye ma ọ bụ mmadụ n’ozuzu ya, ya mere ọ na-echekwa otu mkpụrụokwu na ike nnọchianya nke Grik n’enweghị ime ka okwu ahụ bụrụ naanị maka nwoke.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. ‘Ụbọchị Izu Ike’ na-eme ka Sabbath doo ndị na-agụ akwụkwọ anya; ‘bịara dịrị’ na-echekwa echiche γίνομαι na-enweghị ịmanye nkọwa banyere usoro e si kee ya.
