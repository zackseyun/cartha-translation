base_translation:
  language: en
  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: ig
  text: Ana m asị gị, bilie, buru ute gị[a], gaa n’ụlọ gị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “buru ihe ndina gị.” Okwu Grik κράβαττος na-ezo aka n’ute ma ọ bụ ihe ndina dị mfe a pụrụ iburu.
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ, “laa be gị.” N’asụsụ Grik: “gaa n’ụlọ gị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοὶ λέγω
  choice: Ana m asị gị
  rationale: Nke a na-egosipụta okwu a gwara onye ahụ kpọmkwem ma na-edobe usoro okwu nwere ikike, “Ana m asị gị.”
- source_word: ἔγειρε
  choice: bilie
  rationale: “Bilie” bụ iwu doro anya, nke a na-eji n’Igbo oge a agwa onye dinara ala ka o bilie.
- source_word: ἆρον
  choice: buru
  rationale: “Buru” na-egosi ibuli ihe ahụ ma were ya pụọ; ọ dabara na ute dị mfe ibugharị.
- source_word: κράβαττόν
  choice: ute
  rationale: Okwu Grik a na-ezo aka n’ihe dị mfe mmadụ na-edina n’elu ya, nke a pụrụ iburu; “ute” anaghị enye echiche nke akwa buru ibu nwere osisi.
- source_word: ὕπαγε
  choice: laa
  rationale: N’usoro iwu a, “laa” bụ ụzọ Igbo si ekwu ka mmadụ gaa ebe e kwuru, karịchaa mgbe ebe ahụ bụ ụlọ ya.
- source_word: εἰς τὸν οἶκόν σου
  choice: n’ụlọ gị
  rationale: Nke a na-edobe aha doro anya bụ “ụlọ gị,” kama iji naanị okwu pụtara ịla be gị.
theological_decisions:
- issue: Ụda na ike nke iwu Jizọs nyere onye ahụ
  choice: 'E debere ya dị ka iwu kpọmkwem nwere ikike: “Ana m asị gị, bilie, buru ute gị, laa n’ụlọ gị.”'
  alternative: A pụrụ ịsụgharị ya n’ụzọ dị ntakịrị elu dịka “Ana m agwa gị, kulie, chịrị ihe ndina gị, laghachi n’ụlọ gị.”
  rationale: Isi mmalite ahụ na-egosi okwu Jizọs nwere ikike ozugbo. Nsụgharị a na-edobe usoro iwu ahụ n’enweghị ịgbakwụnye nkọwa ozizi.
translation_notes:
  register: 'E ji Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. “Bilie,” “buru,” na “laa” bụ iwu ndị mmadụ na-aghọta ngwa ngwa. E debere akara nkọwa ala peeji n’ebe okwu ha na-akọwa dị: [a] so “ute gị,” [b] so “ụlọ gị.”'
