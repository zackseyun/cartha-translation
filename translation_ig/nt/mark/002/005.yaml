  text: ⸂καὶ ἰδὼν⸃ ὁ Ἰησοῦς τὴν πίστιν αὐτῶν λέγει τῷ παραλυτικῷ· Τέκνον, ⸂ἀφίενταί σου⸃ αἱ ⸀ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: ig
  text: Jizọs hụrụ okwukwe ha, ọ sịrị nwoke ahụ kpọnwụrụ akpọnwụ, “Nwa, a gbagharala gị mmehie gị.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν
  choice: Mgbe ... hụrụ
  rationale: Nkebiokwu a ji ngwaa participle jikọta ịhụ okwukwe ha na okwu Jizọs kwuru. ‘Mgbe ... hụrụ’ na-eme ka njikọ ahụ doo anya ma bụrụkwa Igbo e ji ekwu okwu n'ụzọ ebumpụta ụwa.
- source_word: πίστιν
  choice: okwukwe
  rationale: N'ebe a, ọ na-egosi ntụkwasị obi nke ndị butere nwoke ahụ nwere n'ebe Jizọs nọ; ‘okwukwe’ bụ okwu Igbo a na-ejikarị akọwa πίστις.
- source_word: αὐτῶν
  choice: ha
  rationale: A hapụrụ ya n'ụdị ọtụtụ mmadụ ka ọ na-ezo aka n'ìgwè ahụ, n'emeghị mkpebi ma nwoke ahụ kpọnwụrụ akpọnwụ ọ̀ so kpọmkwem ná ndị ahụ.
- source_word: λέγει
  choice: ọ sịrị
  rationale: Ọ bụ ezie na Grik ji historical present, Igbo akụkọ na-eji oge gara aga n'ụzọ ebumpụta ụwa; ‘ọ sịrị’ na-edobe ihe omume ahụ nke ọma n'usoro akụkọ.
- source_word: παραλυτικῷ
  choice: nwoke ahụ kpọnwụrụ akpọnwụ
  rationale: Nke a na-akọwa onye ahụ n'okwu ndị nkịtị ga-aghọta, kama iji aha ọrịa ma ọ bụ okwu ochie pụrụ isi ike.
- source_word: Τέκνον
  choice: Nwa m[a]
  rationale: τέκνον bụ okwu ịhụnanya e ji akpọ mmadụ ‘nwa.’ N'Igbo, ‘Nwa m’ na-ebupụta ịdị nro nke ịkpọ oku ahụ n'ụzọ ebumpụta ụwa, ọ bụ ezie na ‘m’ adịghị n'okwu Grik kpọmkwem; ndetu ala kọwara nke a.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: a gbagharala gị mmehie gị
  rationale: Ụdị a bụ nkwupụta doro anya na mgbaghara bụ eziokwu dị ugbu a. Isiokwu a na-amaghị aha na-ahapụ onye mere mgbaghara ahụ n'ekwughị ya kpọmkwem, dịka passive Grik si eme.
- source_word: ἁμαρτίαι
  choice: mmehie
  rationale: ‘Mmehie’ bụ okwu Igbo kwesịrị ekwesị maka ἁμαρτίαι, ma n'Igbo otu ụdị aha a nwere ike ibu echiche ọtụtụ mmehie n'enweghị akara plural ọzọ.
theological_decisions:
- issue: Ụdị nkwupụta Jizọs banyere mgbaghara mmehie
  choice: “a gbagharala gị mmehie gị” dịka nkwupụta kpọmkwem nke ọnọdụ dị ugbu a
  alternative: “a na-agbaghara gị mmehie gị” ma ọ bụ “a gbaghaara gị mmehie gị”
  rationale: ‘A gbagharala’ na-egosi na mgbaghara ahụ adịla irè ugbu a, n'emeghị ka ọ bụrụ naanị usoro na-aga n'ihu ma ọ bụ ihe e mere n'oge gara aga. Ọ naghịkwa atụkwasị nkọwa banyere onye mere ya ma ọ bụ usoro o si mee karịa ihe Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Nwa m’ na-ada nro ma bụrụkwa ụzọ ebumpụta ụwa e si akpọ mmadụ n'Igbo; e tinyere ndetu ala iji gosi na okwu Grik n'onwe ya pụtara ‘Nwa’ ma ọ dịghị etinye nnọchiaha ‘m’ kpọmkwem.
