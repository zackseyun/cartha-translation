revisions:
- from: Mgbe Jizọs hụrụ okwukwe ha, ọ sịrị nwoke ahụ kpọnwụrụ akpọnwụ, “Nwa m[a], a gbagharala gị mmehie gị.”
  to: Jizọs hụrụ okwukwe ha, ọ sịrị nwoke ahụ kpọnwụrụ akpọnwụ, “Nwa, a gbagharala gị mmehie gị.”
  rationale: The revision removes the unexpressed possessive from the form of address and avoids making the participial clause explicitly temporal. It retains the natural Igbo passive declaration of forgiveness, leaving the agent unstated as in Greek. No footnote is needed because “Nwa” directly represents τέκνον without an added lexical alternative.
  reviewer_model: gpt-5.6-terra
