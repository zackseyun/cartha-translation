revisions:
- from: Mgbe ọ banyere ọzọ na Kapanọm, ka ụbọchị ole na ole gachara, a nụrụ na ọ nọ n'ụlọ[a].
  to: Mgbe ụbọchị ole na ole gachara, ọ banyere ọzọ na Kapanọm; a nụrụ na ọ nọ n’ụlọ[a].
  rationale: The revision places the unspecified elapsed interval unambiguously before Jesus’ renewed entry into Capernaum, while retaining the Greek’s narrative sequence and impersonal passive report. “N’ụlọ” preserves the contextual ambiguity of ἐν οἴκῳ, and the footnote supplies a literal locative alternative without adding definiteness absent from the Greek.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the principal meanings: Jesus’ return to Capernaum, an unspecified interval of days, the impersonal report, and his presence in a house. However, the placement of “ka ụbọchị ole na ole gachara” after the temporal clause is less clear and less idiomatic than attaching the elapsed-days phrase directly to the return/entry.'
  naturalness: “Mgbe ọ banyere ọzọ na Kapanọm, ka ụbọchị ole na ole gachara” is awkwardly punctuated and can momentarily obscure whether the days elapsed after the entry. Recasting the sequence as “Mgbe ụbọchị ole na ole gachara, ọ banyere ọzọ…” is clear, natural Standard Igbo, and retains the source sequence.
  terminology: “Kapanọm,” “a nụrụ,” and “ọ nọ n’ụlọ” are suitable. “N’ụlọ” appropriately leaves open whether the sense is ‘at home’ or simply ‘in a house.’ The footnote should not add the demonstrative “ahụ,” since the Greek ἐν οἴκῳ does not explicitly identify a particular house.
  issues:
  - severity: medium
    issue: Temporal phrase placement is awkward and potentially ambiguous.
    rationale: The Greek δι’ ἡμερῶν modifies the return/entry before the report was heard. In the draft, the comma-separated “ka ụbọchị ole na ole gachara” follows “Mgbe ọ banyere…,” producing an unnatural construction and can suggest a different temporal relationship.
  - severity: low
    issue: The footnote adds specificity not explicit in the source.
    rationale: “N'ime ụlọ ahụ” introduces “ahụ” (‘that/the particular’), whereas the Greek’s anarthrous ἐν οἴκῳ need not specify a particular house. “N'ime ụlọ” gives the literal alternative without this addition.
  revised_text: Mgbe ụbọchị ole na ole gachara, ọ banyere ọzọ na Kapanọm; a nụrụ na ọ nọ n’ụlọ[a].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ime ụlọ.”
    reason: lexical_alternative
  revision_rationale: The revision places the unspecified elapsed interval unambiguously before Jesus’ renewed entry into Capernaum, while retaining the Greek’s narrative sequence and impersonal passive report. “N’ụlọ” preserves the contextual ambiguity of ἐν οἴκῳ, and the footnote supplies a literal locative alternative without adding definiteness absent from the Greek.
