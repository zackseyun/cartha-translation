source:
  edition: SBLGNT
  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: ig
  text: Mgbe ụbọchị ole na ole gachara, ọ banyere ọzọ na Kapanọm; a nụrụ na ọ nọ n’ụlọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ime ụlọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: mgbe ọ banyere
  rationale: A sụgharịrị participle aorist ahụ dị ka nkebiokwu oge iji mee ka Igbo bụrụ nke e ji ọnụ ekwu nke ọma, ma chekwaa njikọ ya na ihe sochirinụ.
- source_word: πάλιν
  choice: ọzọ
  rationale: Nke a na-egosi na ọ laghachiri ma ọ bụ mee ihe ahụ ọzọ.
- source_word: Καφαρναούμ
  choice: Kapanọm
  rationale: E depụtara aha obodo ahụ n'ụdị dabara n'usoro mkpọpụta na odide Igbo.
- source_word: δι’ ἡμερῶν
  choice: ka ụbọchị ole na ole gachara
  rationale: Nkebiokwu a na-egosi na oge na-abụghị nke a kpọrọ kpọmkwem, nke ruru ụbọchị ole na ole, agafeela.
- source_word: ἠκούσθη
  choice: a nụrụ
  rationale: E chekwara ọdịdị impersonal passive nke Grik n'ụzọ dị nkenke ma bụrụkwa Igbo nkịtị.
- source_word: ἐν οἴκῳ
  choice: n'ụlọ
  rationale: N'Igbo, nke a nwere ike ịpụta na ọ nọ n'ụlọ ya ma ọ bụ na ọ nọ n'ime otu ụlọ; ya mere ọ na-echekwa ntakịrị mgbagwoju anya dị n'okwu Grik.
- source_word: ἐστίν
  choice: ọ nọ
  rationale: Ọ bụ ezie na Grik ji present tense, Igbo na-eji ụdị a nke ọma n'akụkọ gara aga mgbe okwu ahụ sochiri ‘a nụrụ na.’
theological_decisions:
- issue: Ma ἐν οἴκῳ ọ pụtara ‘n'ụlọ ya’ ka ọ bụ ‘n'ime ụlọ ahụ.’
  choice: n'ụlọ
  alternative: n'ime ụlọ ahụ
  rationale: ‘N'ụlọ’ bụ okwu Igbo dị mfe ma dịkwa eke nke nwere ike iburu echiche abụọ ahụ, ya mere ọ naghị ekpebi karịa ihe Grik kwuru; e tinyere nsụgharị doro anya karị na nkọwa ala peeji.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E ji ‘a nụrụ’ chekwaa usoro akụkọ nke isi mmalite, ma e zere itinye onye nwe ụlọ ebe Grik ekwughị ya kpọmkwem.
