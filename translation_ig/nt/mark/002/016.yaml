  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: ig
  text: Ndị odeakwụkwọ so n’òtù ndị Farisii[a], mgbe ha hụrụ na ọ na-eso ndị mmehie na ndị ọnaụtụ eri nri, ha na-ekwu ndị na-eso ụzọ ya sị, “Gịnị mere o ji eso ndị ọnaụtụ na ndị mmehie eri nri?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị odeakwụkwọ bụ́ ndị Farisii.” Okwu Grik nwere ike igosi ndị odeakwụkwọ so n’òtù ndị Farisii ma ọ bụ ndị odeakwụkwọ bụ́ ndị Farisii.
    reason: textual_and_syntactic_ambiguity
lexical_decisions:
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọwa ndị ode akwụkwọ na ndị ọkachamara n’iwu n’akụkọ Oziọma; ọ naghị agbakwụnye nkọwa karịrị nke okwu Grik kwuru.
- source_word: τῶν Φαρισαίων
  choice: so n’òtù ndị Farisii
  rationale: Nke a na-egosi njikọ ma ọ bụ ịbụ ndị otu Farisii n’ụzọ doro anya, ma na-ahapụ ntakịrị ohere dị na njikọ genitiv Grik.
- source_word: ἰδόντες
  choice: mgbe ha hụrụ
  rationale: Ọ na-egosipụta ọrụ participle ahụ dị ka ọnọdụ oge n’Igbo nkịtị.
- source_word: ὅτι ἐσθίει
  choice: na ọ na-eso ... eri nri
  rationale: Ụdị ‘na-’ na-egosipụta omume ahụ ka ọ na-aga n’ihu n’ebe akụkọ a nọ.
- source_word: μετὰ
  choice: na-eso ... eri nri
  rationale: Nhazi Igbo a na-egosipụta iri nri ‘na’ mmadụ n’ụzọ eke, tinyere echiche nke ịnọkọ n’otu tebụl n’enweghị ịkọwa ya gabiga ókè.
- source_word: ἁμαρτωλῶν
  choice: ndị mmehie
  rationale: Ọ bụ ntụgharị kpọmkwem nke na-echekwa aha mkparị mmekọrịta mmadụ na okpukpe dị n’amaokwu ahụ.
- source_word: τελωνῶν
  choice: ndị ọnaụtụ
  rationale: Ọ bụ okwu Igbo a ghọtara nke ọma maka ndị na-anakọta ụtụ isi, bụ́ ndị a na-elelị n’ọnọdụ akụkọ a.
- source_word: ἔλεγον
  choice: na-ajụ ... sị
  rationale: Ụdị ‘na-ajụ’ na-echekwa akụkụ imperfect, ya bụ, okwu ma ọ bụ mkpesa ahụ na-aga n’ihu.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ ntụgharị Igbo doro anya ma guzosie ike maka μαθηταί, nke na-echekwa mmekọrịta onye nkuzi na ndị na-amụ n’aka ya.
- source_word: Ὅτι
  choice: Gịnị mere
  rationale: N’ọnọdụ ajụjụ a, ọ na-enye mkpesa ahụ n’Igbo eke karịa ntụgharị nkịtị ‘na’.
- source_word: ἐσθίει
  choice: o ji eso ... eri nri
  rationale: Ọ na-egosipụta ajụjụ banyere omume Jizọs nke iso ndị ahụ eri nri, n’Igbo dị mfe ma dị ugbu a.
theological_decisions:
- issue: Ike mmekọrịta mmadụ na okpukpe dị n’iso mmadụ rie nri
  choice: E kwuru ya n’ụzọ dị mfe dịka ‘iso ndị mmehie na ndị ọnaụtụ eri nri,’ n’enweghị nkọwa nkà mmụta okpukpe agbakwunyere n’ahịrị isi.
  alternative: ‘Ịnọkọ n’otu tebụl rie nri’ ma ọ bụ ‘ịkekọrịta nri,’ nke ga-eme ka echiche mmekọrịta ahụ pụta ìhè karịa.
  rationale: Grik ji ngwaa nkịtị ‘iri’ na preposition ‘na/ya na’ kwuo ya. Ịhapụ ya otu a na-eme ka akụkọ ahụ n’onwe ya gosipụta esemokwu dị n’iso ndị a na-elelị na-akpakọrịta.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘na-eso ... eri nri’ ka ọ daa nke ọma n’Igbo ma chekwaa echiche iri nri ọnụ. Akara nkọwa [a] dị n’ahịrị isi ma kwekọọ na nkọwa ala peeji.
