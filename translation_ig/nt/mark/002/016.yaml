    reason: textual_and_syntactic_ambiguity
  revision_rationale: Only the rendering of ἔλεγον is adjusted, from the more specific “were asking” to “were saying,” while retaining the Greek imperfective sense and the direct question. The existing wording for shared eating and the syntactic note are otherwise retained.
