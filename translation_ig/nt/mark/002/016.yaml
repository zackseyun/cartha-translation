review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the two groups, the accusation of eating with them, and the question's force. However, «ἔλεγον» is an imperfect of speaking, not specifically asking; the direct question itself supplies the interrogative force. Revising this to «ha na-ekwu ... sị» better represents the source's ongoing/repeated speech.
  naturalness: «Na-eso ... eri nri» is natural Standard Igbo for eating with someone. «Ha na-ekwu ndị na-eso ụzọ ya sị» is also idiomatic in this narrative setting and preserves the imperfective progression.
  terminology: «Ndị odeakwụkwọ», «ndị Farisii», «ndị mmehie», «ndị ọnaụtụ», and «ndị na-eso ụzọ» are appropriate, clear Standard Igbo renderings. The existing note responsibly preserves the possible sense of the Pharisee-related genitive without imposing one analysis.
  issues:
  - severity: low
    issue: «na-ajụ ndị na-eso ụzọ ya sị» narrows ἔλεγον to asking.
    rationale: Although the quotation is a question, the Greek verb means “were saying,” and its imperfect aspect is better represented by an ongoing speech verb. The question should remain in the quotation.
  revised_text: Ndị odeakwụkwọ so n’òtù ndị Farisii[a], mgbe ha hụrụ na ọ na-eso ndị mmehie na ndị ọnaụtụ eri nri, ha na-ekwu ndị na-eso ụzọ ya sị, “Gịnị mere o ji eso ndị ọnaụtụ na ndị mmehie eri nri?”
  revised_footnotes:
