id: MRK.2.18
reference: Mark 2:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: ig
  text: Ndị na-eso ụzọ Jọn na ndị Farisii nọ na-ebu ọnụ. Ha bịakwutere ya wee sị ya[a], “Gịnị mere ndị na-eso ụzọ Jọn na ndị na-eso ụzọ ndị Farisii ji ebu ọnụ, ma ndị na-eso ụzọ gị adịghị ebu ọnụ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ụfọdụ ndị mmadụ bịakwutere ya wee sị ya.” Grik ekwughị kpọmkwem ndị bịara gwa ya okwu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: nọ na-ebu ọnụ
  rationale: Ngwakọta imperfect nke εἰμί na present participle na-egosi omume na-aga n’ihu n’oge gara aga; ‘nọ na-ebu ọnụ’ na-egosipụta nke a n’ụzọ Igbo dị mma.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: ndị na-eso ụzọ Jọn
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ndị na-amụ ihe ma na-eso onye nkụzi.
- source_word: οἱ Φαρισαῖοι
  choice: ndị Farisii
  rationale: Aha otu ndị Juu a ka e dere n’ụdị a maara nke ọma n’Igbo.
- source_word: ἔρχονται καὶ λέγουσιν
  choice: Ha abịakwute ya wee sị ya
  rationale: Historical presents ndị a na-eme ka akụkọ Mak dị ndụ; n’Igbo, usoro a na-akọ ihe mere eme n’ụzọ eke ma na-egosi na ha bịakwutere Jizọs tupu ha agwa ya okwu.
- source_word: Διὰ τί
  choice: Gịnị mere ... ji
  rationale: Nke a bụ usoro ajụjụ Igbo kachasị eke maka ịjụ ihe kpatara ihe.
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: ndị na-eso ụzọ ndị Farisii
  rationale: Ọ na-echekwa njikọ genitive ahụ n’enweghị ịkọwa karịa ihe odide Grik kwuru.
- source_word: νηστεύουσιν
  choice: na-ebu ọnụ
  rationale: Okwu a na-egosi omume ibu ọnụ; ụdị present na ajụjụ ahụ nwere ike ịpụta omume ha na-emekarị, nke ntụgharị a na-ahapụ ka ọ dị.
- source_word: οἱ δὲ σοὶ μαθηταὶ
  choice: ma ndị na-eso ụzọ gị
  rationale: ‘Ma’ na-egosipụta ọdịiche nke δέ, ebe ‘gị’ na-echekwa echiche possessive nke σοὶ.
theological_decisions:
- issue: Ndị bụ isiokwu nke ἔρχονται καὶ λέγουσιν
  choice: E ji nnọchiaha ‘Ha’ mee ihe n’ebughị ụzọ kpọọ kpọmkwem ndị ọ na-anọchi anya ha; e tinyere nkọwa ala peeji.
  alternative: Ịsị ‘ụfọdụ ndị mmadụ bịakwutere ya’ ma ọ bụ ikwu na ọ bụ ndị na-eso ụzọ Jọn na ndị Farisii.
  rationale: Grik ekwughị kpọmkwem onye bụ isiokwu ngwaa ndị a. Nnọchiaha Igbo nwere ike ịdị ka ọ na-ezo aka n’òtù ndị a kpọrọ aha n’ahịrị bu ụzọ, ya mere nkọwa ala peeji na-echekwa nghọtahie dị n’isi mmalite.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Ibu ọnụ’ bụ okwu a maara nke ọma maka fasting. A hapụrụ ajụjụ ahụ ka ọ nwee ike ịkọwa omume ha na-emekarị, ọ bụghị naanị ihe ha na-eme n’oge ahụ.
