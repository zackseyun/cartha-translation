- from: O wee bilie, ozugbo ahụ, o bulitere ute ya, pụọ n’ihu ha niile. Nke a mere ka ọ tụrụ ha niile n’anya, ha wee nye Chineke otuto, na-asị, “Ọ dịtụbeghị mgbe anyị hụrụ ihe dị otu a.”
  to: O wee bilie, ozugbo ahụ ọ buliri ute ya wee pụọ n’ihu mmadụ niile. Nke a mere ka ijuanya tụọ ha niile n’anya, ha wee nye Chineke otuto, na-ekwu, “Ọ dịtụbeghị mgbe anyị hụrụ ihe dị otu a.”
  rationale: The revision corrects the two grammatical defects while retaining the source’s action sequence, public setting, collective amazement, and God-directed glorification. No footnote is needed in Igbo, since the final saying naturally communicates its idiomatic sense without obscuring an unresolved ambiguity.
