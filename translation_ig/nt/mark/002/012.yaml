source:
  edition: SBLGNT
  text: καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: ig
  text: O wee bilie, ozugbo ahụ ọ buliri ute ya wee pụọ n’ihu mmadụ niile. Nke a mere ka ijuanya tụọ ha niile n’anya, ha wee nye Chineke otuto, na-ekwu, “Ọ dịtụbeghị mgbe anyị hụrụ ihe dị otu a.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγέρθη
  choice: O wee bilie
  rationale: N’akụkọ ọgwụgwọ a, ngwaa ahụ na-egosi na nwoke ahụ biliri dịka Jizọs nyere ya n’iwu; nsụgharị a anaghị etinye echiche mbilite n’ọnwụ n’ebe a na-ekwughị ya kpọmkwem.
- source_word: εὐθύς
  choice: ozugbo ahụ
  rationale: Nke a na-echekwa ngwa ngwa na ọsọ akụkọ Mak na-egosipụta.
- source_word: ἄρας
  choice: o bulitere
  rationale: Ọ na-egosi omume ibuli ute ahụ ka o buru ya, n’asụsụ Igbo doro anya.
- source_word: κράβαττον
  choice: ute ya
  rationale: Ọ bụ ihe dị mfe mmadụ na-edina n’elu ya, ọ bụghị akwa ukwu; “ute” bụ okwu ndị Igbo na-aghọta ngwa ngwa.
- source_word: ἔμπροσθεν πάντων
  choice: n’ihu ha niile
  rationale: Nke a na-echekwa echiche na ihe ahụ mere ebe mmadụ niile nọ na-ahụ ya.
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: Nke a mere ka ọ tụrụ ha niile n’anya
  rationale: Ọ na-egosipụta nsonaazụ ahụ—oke ihe ijuanya jidere mmadụ niile—n’ụzọ Igbo ebumpụta ụwa.
- source_word: δοξάζειν τὸν θεόν
  choice: ha wee nye Chineke otuto
  rationale: Akpaokwu a na-echekwa omume inye Chineke ebube ma na-ada nke ọma n’Igbo.
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: Ọ dịtụbeghị mgbe anyị hụrụ ihe dị otu a
  rationale: Nke a na-egosipụta akpaokwu Grik nke pụtara na ha ahụtụbeghị ihe yiri nke a mbụ.
theological_decisions:
- issue: Ma ἠγέρθη ò nwere echiche mbilite n’ọnwụ
  choice: A sụgharịrị ya “O wee bilie” dịka omume nwoke ahụ e gwọrọ.
  alternative: “E mere ka o bilie” ma ọ bụ okwu nwere ike ịpụta na e mere ka o si n’ọnwụ bilie.
  rationale: Ọnọdụ akụkọ ahụ bụ nwoke ahụ kpọnwụrụ akpọnwụ na-erubere iwu Jizọs isi site n’ibilite; ya mere, ekwesịghị ịmanye echiche mbilite n’ọnwụ n’amaokwu a.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji njikọ “wee” mee ka usoro omume na-aga were were dịka akụkọ Grik ahụ si aga.
