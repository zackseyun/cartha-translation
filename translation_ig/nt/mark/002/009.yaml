revisions:
- from: '“Olee nke dị mfe karị: ịgwa nwoke ahụ kpọnwụrụ akpọnwụ, ‘A gbagharala gị mmehie gị,’[a] ka ọ bụ ịsị, ‘Bilie, chịrị ute gị, jegharịa’?”'
  to: '“Olee nke dị mfe karị: ịgwa nwoke ahụ kpọnwụrụ akpọnwụ, ‘A gbagharala gị mmehie gị,’[a] ka ọ bụ ịsị, ‘Bilie, buru ute gị, jee ije’?”'
  rationale: The revision retains the source’s contrast between declaring forgiveness and commanding a visible healing, without naming the forgiver or adding theological explanation. It replaces terms that introduce unnecessary nuances with direct, modern Standard Igbo equivalents. The footnote preserves the Greek form’s possible resultative sense while avoiding an unwarranted implication of an ongoing process.
