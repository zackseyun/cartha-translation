source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: ig
  text: '“Olee nke dị mfe karị: ịgwa nwoke ahụ kpọnwụrụ akpọnwụ, ‘A gbagharala gị mmehie gị,’[a] ka ọ bụ ịsị, ‘Bilie, buru ute gị, jee ije’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “A gbagharawo gị mmehie gị.” Ngwaa Grik ahụ pụrụ imesi ọnọdụ mgbaghara nke dị ugbu a ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Olee nke dị mfe karị
  rationale: Nke a na-egosipụta ajụjụ ntụnyere dị na Grik n'ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: εἰπεῖν τῷ παραλυτικῷ
  choice: ịgwa nwoke ahụ kpọnwụrụ akpọnwụ
  rationale: “Ịgwa” dabara n'okwu a na-agwa mmadụ kpọmkwem; “nwoke ahụ kpọnwụrụ akpọnwụ” na-akọwa ọnọdụ onye ahụ n'asụsụ ndị mmadụ na-aghọta.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: A gbagharala gị mmehie gị
  rationale: Ihe owuwu a na-edebe olu nnara nke Grik ma na-egosi ọnọdụ nke mgbaghara sitere n'omume e mere, n'ejighị aha onye mere ya.
- source_word: ἁμαρτίαι
  choice: mmehie
  rationale: “Mmehie” bụ okwu Igbo kwesịrị ekwesị ma guzosie ike maka ἁμαρτίαι n'ọnọdụ a.
- source_word: Ἔγειρε
  choice: Bilie
  rationale: “Bilie” bụ iwu dị mfe, kpọmkwem, nke na-egosi ka nwoke ahụ si n'ọnọdụ o dina ebili.
- source_word: ἆρον τὸν κράβαττόν σου
  choice: chịrị ute gị
  rationale: κράβαττος bụ ute ma ọ bụ ihe ndina dị mfe e nwere ike iburu; “chịrị” na-egosi iweli ya ma buru ya.
- source_word: περιπάτει
  choice: jegharịa
  rationale: “Jegharịa” na-egosi ije a na-ahụ anya ma na-edebe ntakịrị ike nke iwu presẹnt Grik karịa naanị “gaa.”
theological_decisions:
- issue: Ụdị nkwupụta mgbaghara
  choice: A gbagharala gị mmehie gị
  alternative: A na-agbaghara gị mmehie gị
  rationale: Nhọrọ a na-egosi ọnọdụ mgbaghara dị ugbu a nke sitere n'omume e mere, ma ọ naghị akpọ onye mere mgbaghara ahụ aha ma ọ bụ kọwaa kpọmkwem oge o mere; ya mere, ọ na-echekwa esemokwu nkà mmụta okpukpe dị n'akụkọ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “ute” kama okwu nwere ike ime ka onye na-agụ ya chee banyere akwa ukwu nke oge a; ahịrịokwu ahụ na-edebekwa usoro iwu atọ dị na isi mmalite.
