  text: Καὶ ἐξῆλθεν πάλιν παρὰ τὴν θάλασσαν· καὶ πᾶς ὁ ὄχλος ἤρχετο πρὸς αὐτόν, καὶ ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/013.yaml
  text: And he went out again beside the sea[a], and the whole crowd was coming to him[c][b], and he was teaching them.
translation:
  language: ig
  text: Ọ pụtakwara ọzọ gaa n’akụkụ oke osimiri[a]. Ìgwè mmadụ ahụ dum nọ na-abịakwute ya, ọ nọ na-akụziri ha ihe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’akụkụ osimiri.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ndị a sụgharịrị “nọ na-abịakwute” na “nọ na-akụziri” bụ imperfect; ha nwere ike igosi omume ndị na-aga n’ihu n’oge gara aga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν πάλιν
  choice: Ọ pụkwara ọzọ gaa
  rationale: Aorist ἐξῆλθεν na-egosi na ọ pụrụ gaa, ebe πάλιν na-egosi na nke a mere ọzọ. Usoro a bụ Igbo dị mfe ma ghara ịgbakwụnye ebe o si pụta.
- source_word: παρὰ τὴν θάλασσαν
  choice: n’akụkụ osimiri
  rationale: Παρά na accusative ebe a na-egosi ịga n’akụkụ mmiri ahụ. N’Igbo Baịbụl na okwu nkịtị, ‘osimiri’ nwere ike ịkọwa nnukwu mmiri a kpọrọ θάλασσα n’ọnọdụ a.
- source_word: πᾶς ὁ ὄχλος
  choice: Ìgwè mmadụ ahụ niile
  rationale: Nke a na-egosi ìgwè ahụ dum n’ụzọ dị mma ma bụrụ Igbo eke, na-echekwa ike πᾶς tinyere collective noun.
- source_word: ἤρχετο πρὸς αὐτόν
  choice: nọ na-abịakwute ya
  rationale: ‘Nọ na-abịakwute’ na-echekwa imperfect ahụ dị ka omume na-aga n’ihu n’oge gara aga; ‘-kwute ya’ na-egosi ngagharị gaa n’ebe ọ nọ.
- source_word: ἐδίδασκεν αὐτούς
  choice: ya onwe ya ana-akụziri ha ihe
  rationale: ‘Ana-akụziri’ na-egosipụta imperfect dị ka ọrụ na-aga n’ihu. ‘Ha’ na-alaghachi n’ìgwè mmadụ ahụ, ebe ‘ihe’ na-eme ka okwu Igbo ahụ zuo oke n’enweghị ịkọwapụta ihe a na-akụzi.
theological_decisions: []
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘osimiri’ mee isi okwu dịka ojiji Igbo a na-ahụkarị, ma tinye ‘oke osimiri’ n’ala ala peeji iji chekwaa nkọwa ọzọ. A haziri ahịrịokwu nke abụọ ka imperfect abụọ ahụ pụta dị ka omume na-aga n’ihu.
