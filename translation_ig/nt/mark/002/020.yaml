review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the future contrast, the passive and unspecified removal, the wedding metaphor, the future fasting, and the singular expression “n’ụbọchị ahụ.” However, “n’etiti ha” means more specifically “among them” and can imply removal from a group rather than the Greek’s broader separation “from them.”
  naturalness: The proposed revision uses the more natural Standard Igbo expression “a ga-anapụ ha …,” clearly expressing that the bridegroom will be taken away from the companions. The sentence is also punctuated and sequenced more smoothly.
  terminology: “Nwoke na-alụ nwanyị ọhụrụ” adequately conveys νυμφίος (bridegroom), and “ibu ọnụ” is the established Igbo term for fasting. No theological interpretation is added.
  issues:
  - severity: low
    issue: “n’etiti ha” is narrower than ἀπ’ αὐτῶν.
    rationale: The Greek indicates separation from the people concerned, without requiring the locative sense “from among them.” “A ga-anapụ ha” is idiomatic Igbo and conveys the intended loss/separation while retaining the unspecified passive action.
  revised_text: Ma ụbọchị ga-abịa mgbe a ga-anapụ ha nwoke na-alụ nwanyị ọhụrụ; mgbe ahụ ha ga-ebu ọnụ n’ụbọchị ahụ.[a]
  revised_footnotes:
  - marker: a
    text: 'Grik kwuru ya n’ọnụọgụ otu: “n’ụbọchị ahụ,” ọ bụghị “n’ụbọchị ndị ahụ.”'
    reason: lexical_alternative
  revision_rationale: Replaced “a ga-ewepụ nwoke na-alụ nwanyị ọhụrụ n’etiti ha” with “a ga-anapụ ha nwoke na-alụ nwanyị ọhụrụ” to render ἀπαρθῇ ἀπ’ αὐτῶν more naturally and precisely in Standard Igbo. The passive construction leaves the agent and manner of removal unstated, as does the Greek. The singular temporal phrase and its footnote are retained.
