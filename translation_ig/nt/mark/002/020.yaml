  to: Ma ụbọchị ga-abịa mgbe a ga-anapụ ha nwoke na-alụ nwanyị ọhụrụ; mgbe ahụ ha ga-ebu ọnụ n’ụbọchị ahụ.[a]
  rationale: Replaced “a ga-ewepụ nwoke na-alụ nwanyị ọhụrụ n’etiti ha” with “a ga-anapụ ha nwoke na-alụ nwanyị ọhụrụ” to render ἀπαρθῇ ἀπ’ αὐτῶν more naturally and precisely in Standard Igbo. The passive construction leaves the agent and manner of removal unstated, as does the Greek. The singular temporal phrase and its footnote are retained.
  reviewer_model: gpt-5.6-terra
