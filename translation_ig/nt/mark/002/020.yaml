  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: ig
  text: Ma ụbọchị ga-abịa mgbe a ga-anapụ ha nwoke na-alụ nwanyị ọhụrụ; mgbe ahụ ha ga-ebu ọnụ n’ụbọchị ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grik kwuru ya n’ọnụọgụ otu: “n’ụbọchị ahụ,” ọ bụghị “n’ụbọchị ndị ahụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Ma ụbọchị ga-abịa
  rationale: Nke a na-egosipụta okwu Grik banyere ụbọchị ndị ga-abịa, ebe “Ma” na-egosi ọdịiche dị n’etiti ọnọdụ dị ugbu a na ihe ga-eme n’ọdịnihu.
- source_word: ὅταν
  choice: mgbe
  rationale: N’ebe a, okwu ahụ na-ezo aka n’otu ihe ga-eme n’ọdịnihu, ya mere “mgbe” dabara karịa okwu ga-egosi ihe na-eme ugboro ugboro.
- source_word: ἀπαρθῇ
  choice: a ga-ewepụ
  rationale: Nke a na-edobe ụdị nnara-eme nke Grik ma ghara ịkpọ onye ga-ewepụ ya aha ma ọ bụ kọwaa kpọmkwem otú e si ewepụ ya.
- source_word: ἀπ’ αὐτῶν
  choice: n’etiti ha
  rationale: N’Igbo, “iwepụ mmadụ n’etiti ha” na-egosi nkewa ya na ndị ya na ha nọ n’ụzọ doro anya ma dịkwa eke.
- source_word: ὁ νυμφίος
  choice: nwoke na-alụ nwaanyị ọhụrụ
  rationale: Nke a bụ okwu Igbo doro anya maka nwoke na-alụ nwaanyị n’emume agbamakwụkwọ, ma na-edobe ihe atụ agbamakwụkwọ nke ederede ahụ.
- source_word: καὶ τότε
  choice: mgbe ahụ
  rationale: 'Ọ na-eme ka usoro ihe ndị ahụ doo anya: ibu ọnụ ga-esochi iwepụ nwoke na-alụ nwaanyị ọhụrụ.'
- source_word: νηστεύσουσιν
  choice: ha ga-ebu ọnụ
  rationale: “Ibu ọnụ” bụ okwu Igbo a na-ejikarị akọwa izere nri n’ihi ofufe ma ọ bụ nzube ime mmụọ.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: n’ụbọchị ahụ
  rationale: Nke a na-edobe ọnụọgụ otu nke okwu Grik ma bụrụkwa okwu Igbo dị eke.
theological_decisions:
- issue: Iji nwoke na-alụ nwaanyị ọhụrụ mee ihe atụ banyere Jizọs
  choice: Edobere “nwoke na-alụ nwaanyị ọhụrụ” dị ka ihe atụ, n’agbanyeghị na ihe gbara amaokwu ahụ gburugburu na-egosi na Jizọs na-ekwu banyere onwe ya.
  alternative: “mgbe a ga-ewepụ m n’etiti ha”
  rationale: Ederede Grik ji ihe atụ mee ihe, ọ kpọghị Jizọs aha n’ebe a. Idebe ihe atụ ahụ na-echekwa ike edemede na ihe ọ pụtara n’ụzọ mmụọ.
- issue: Ụdị iwepụ nwoke na-alụ nwaanyị ọhụrụ
  choice: Ejiri “a ga-ewepụ” mee ka onye ga-eme ya na ụzọ a ga-esi mee ya ghara ịkọwa karịa ka ederede si kwuo.
  alternative: “mgbe a ga-egbu ya ma wepụ ya n’etiti ha”
  rationale: Amaokwu ahụ na-atụ anya iwepụ Jizọs, ma ọ kpọghị ọnwụ ya aha kpọmkwem n’ebe a, ọ kpọghịkwa onye ga-eme ya aha. Nsụgharị ahụ na-edobe ihe a na-akọwaghị akọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, sụgharịa amaokwu ahụ. E debere usoro ihe atụ agbamakwụkwọ na nnara-eme nke ederede Grik, ma zere ịgbakwunye nkọwa banyere onye ga-ewepụ nwoke ahụ ma ọ bụ kpọọ ọnwụ Jizọs aha n’ime isi okwu.
