    rationale: Greek κύριος governs the genitive τοῦ σαββάτου (“Lord of the Sabbath”). “Onyenwe ọbụna ụbọchị Izuike” is less precise and can sound compressed. “Onyenwe ọbụna nke ụbọchị Izuike” explicitly preserves the source relation.
  - severity: low
