  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε κύριός ἐστιν ὁ υἱὸς τοῦ ἀνθρώπου καὶ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/028.yaml
  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: ig
  text: Ya mere, Nwa nke Mmadụ bụ Onyenwe ọbụna nke ụbọchị Izuike[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ya mere, Nwa nke Mmadụ bụkwa Onyenwe nke ụbọchị Izuike.” Okwu njikọ Grik ahụ nwekwara ike ịpụta “kwa/na,” ma n’ebe a o yiri ka ọ pụtara “ọbụna,” iji mesie ókè ọchịchị ya ruru ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ya mere
  rationale: Ọ na-ewebata nkwubi okwu sitere n’ihe Jizọs kwuru tupu nke a; “Ya mere” bụ okwu Igbo doro anya ma dịkwa n’usoro ekwu okwu nke oge a.
- source_word: κύριος
  choice: Onyenwe
  rationale: N’ebe a, okwu ahụ na-egosi onye nwere ọchịchị na ikike. “Onyenwe” na-echekwa ike okwu Grik ahụ na ihe ọ na-ekwu banyere Nwa nke Mmadụ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: E chekwara aha a Jizọs ji akọwa onwe ya n’Oziọma ndị ahụ, ka njikọ ya na akụkụ Akwụkwọ Nsọ ndị ọzọ na omimi ihe ọ pụtara ghara ifu.
- source_word: καὶ
  choice: ọbụna
  rationale: N’usoro okwu a, καί nwere ike imesi ókè ikike Nwa nke Mmadụ ruru ike; “ọbụna” na-egosi na ọ bụ Onyenwe ruo n’ụbọchị Izuike kwa. E debere nsụgharị nkịtị karịa na nkọwa ala peeji.
- source_word: σαββάτου
  choice: ụbọchị Izuike
  rationale: Nke a bụ ụzọ doro anya e si akọwa ụbọchị izuike e nyere iwu banyere ya, nke bụ isi okwu n’arụmụka gbara amaokwu a gburugburu.
theological_decisions:
- issue: Ike okwu ahụ gbasara ọchịchị Nwa nke Mmadụ n’ebe ụbọchị Izuike dị
  choice: A sụgharịrị ya ozugbo dị ka nkwupụta na Nwa nke Mmadụ bụ Onyenwe ụbọchị Izuike.
  alternative: Ikwu n’ụzọ dị nro na ọ bụ naanị onye “nwere ikike n’ihe gbasara ụbọchị Izuike.”
  rationale: κύριος na-egosi ịbụ Onyenwe, ọ bụghị naanị ikike e nyere maka otu ihe. Nsụgharị a na-echekwa ike nkwupụta ahụ n’etinyeghị nkọwa ozizi ọzọ.
- issue: Onye okwu “Nwa nke Mmadụ” na-ezo aka na ya
  choice: E debere “Nwa nke Mmadụ” dị ka aha Jizọs ji akọwa onwe ya.
  alternative: Ịsụgharị ya dị ka “onye mmadụ” ma ọ bụ “mmadụ” n’ozuzu ya.
  rationale: N’Oziọma Mak, okwu a na-arụ ọrụ dị ka aha Jizọs ji ezo aka n’onwe ya ma nwee njikọ nwere ike ịdị na Daniel. Idebe aha ahụ na-echekwa ebumnuche na omimi ya n’edoziweghị esemokwu nkọwa ahụ n’ime nsụgharị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “Ya mere” maka nkwubi okwu, “Onyenwe” maka ọchịchị siri ike, na “ụbọchị Izuike” maka Sabbath. E debere aha “Nwa nke Mmadụ” iji chekwaa ụda na njikọ Akwụkwọ Nsọ ya.
