  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: ig
  text: Ma ka unu wee mara na Nwa nke Mmadụ[a] nwere ikike n’ụwa ịgbaghara mmehie—ọ sịrị onye ahụ kpọnwụrụ akpọnwụ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Onye Mmadụ.” Aha Grik a, “Nwa nke Mmadụ,” pụrụ igosi ma ịbụ mmadụ ma ntụaka na Daniel 7.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “onye ahụ ahụ ya kpọnwụrụ akpọnwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: Ma ka
  rationale: “Ma” na-egosi ntughari dị nro nke δέ, ebe “ka” na-ebute ebumnuche nke ἵνα n’ụzọ Igbo na-ada nke ọma.
- source_word: εἰδῆτε
  choice: unu wee mara
  rationale: Nke a na-egosi ebumnuche ka ndị a na-agwa okwu mata ihe ahụ site n’ihe akaebe ga-esochi.
- source_word: ἐξουσίαν ἔχει
  choice: nwere ikike
  rationale: “Ikike” na-egosi ikike ziri ezi ma ọ bụ ikike ịchị, ọ bụghị naanị ike mmadụ nwere ime ihe.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Ọ na-echekwa aha Jizọs ji akpọ onwe ya na njikọ o nwere ike inwe na Daniel 7, n’ebughị ụzọ kpebie otu nkọwa naanị.
- source_word: ἐπὶ τῆς γῆς
  choice: n’ụwa
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ziri ezi isi gosipụta ebe a na-eji ikike ahụ eme ihe.
- source_word: ἀφιέναι ἁμαρτίας
  choice: ịgbaghara mmehie
  rationale: N’ebe a, ἀφίημι pụtara ịgbaghara ma ọ bụ ịhapụ mmehie; okwu a bụ nke doro ndị na-agụ Igbo anya.
- source_word: λέγει τῷ παραλυτικῷ
  choice: ọ sịrị nwoke ahụ ahụ ya kpọnwụrụ akpọnwụ
  rationale: “Ọ sịrị” bụ akụkọ ugbu a a kọwara n’ụzọ Igbo kwesịrị ekwesị, ebe nkọwa onye ahụ na-eji okwu ndị mmadụ na-aghọta ngwa ngwa.
theological_decisions:
- issue: Nsụgharị aha ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: Aha ọdịnala ahụ na-echekwa ma echiche gbasara mmadụ ma ntụaka nwere ike ịdị na Daniel 7, n’enweghị imechi esemokwu nkọwa ahụ.
- issue: Ihe ἐξουσία pụtara n’ihe gbasara ịgbaghara mmehie
  choice: ikike
  alternative: ike
  rationale: Ihe a na-ekwu bụ ikike kwesịrị ekwesị Jizọs nwere ịgbaghara mmehie, ọ bụghị naanị ike ma ọ bụ ikike ime ihe n’ụzọ nkịtị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere akara nkwụsị ogologo n’ihi na ahịrịokwu ahụ na-aga n’ihu n’amaokwu na-esote. E tinyere akara ndetu ala ala [a] na [b] kpọmkwem n’ebe okwu ndị ha na-akọwa dị.
