reference: Mark 2:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: ig
  text: Ọ dịghịkwa onye na-awụnye mmanya ọhụrụ n’ime akpa akpụkpọ anụ ochie.[a] Ma ọ bụghị ya, mmanya ahụ ga-agbawa akpa ndị ahụ; mmanya ahụ ga-ala n’iyi,[b] akpa ndị ahụkwa ga-emebi. Kama, mmanya ọhụrụ bụ maka akpa akpụkpọ anụ ọhụrụ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akpa ndị a bụ akpa e ji akpụkpọ anụ anụmanụ mee, nke ndị mmadụ ji echekwa ma ọ bụ ebu mmanya.
    reason: cultural_clarification
  - marker: b
    text: A pụkwara ịsụ, “mmanya ahụ ga-emebi.”
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, nkebi a kwuru n’ụzọ nkịtị, “Kama mmanya ọhụrụ n’ime akpa ọhụrụ”; e kwughị ngwaa ya.
    reason: source_form
lexical_decisions:
- source_word: βάλλει
  choice: na-awụnye
  rationale: Ọ bụ ezie na ngwaa Grik a pụtara n’ozuzu ‘itinye,’ ‘ịwụnye’ bụ okwu Igbo kachasị dịrị n’ọnọdụ itinye mmiri dị ka mmanya n’ime akpa.
- source_word: οἶνον νέον
  choice: mmanya ọhụrụ
  rationale: Nke a na-edobe njikọ aha na nkọwa dị na Grik; n’ihe atụ a, ọ bụ mmanya e mere ọhụrụ nke ka nwere ike ịgba ụka.
- source_word: ἀσκούς
  choice: akpa akpụkpọ anụ e ji echekwa mmanya
  rationale: Ndị a bụ akpa e ji akpụkpọ anụ anụmanụ mee maka idebe mmanya. Nsụgharị a na-eme ka ihe omenala ahụ doo onye Igbo nke oge a anya.
- source_word: παλαιούς
  choice: ochie
  rationale: ‘Ochie’ kwekọrọ kpọmkwem na παλαιούς ma ghara ịgbakwụnye nkọwa na akpa ndị ahụ adịkwaghị mma karịa ihe okwu Grik kwuru.
- source_word: ῥήξει
  choice: ga-agbawa
  rationale: Okwu a na-egosi na nrụgide mmanya na-agba ụka ga-eme ka akpa akpụkpọ anụ ahụ gbawaa.
- source_word: ἀπόλλυται
  choice: ga-ala n’iyi
  rationale: N’ebe a, okwu ahụ nwere echiche nke ịla n’iyi ma ọ bụ imebi nke na mmanya ahụ agaghịzi aba uru; ‘ga-ala n’iyi’ na-edobe echiche ọnwụ/waste ahụ n’enweghị ịkọwa ya gabiga ókè.
- source_word: καινούς
  choice: ọhụrụ
  rationale: ‘Ọhụrụ’ bụ nsụgharị Igbo doro anya maka καινούς ma na-emegide ‘ochie.’ Ihe banyere ịdị ọhụrụ n’ụdị ma ọ bụ ọnọdụ ka a kọwara na ndetu ala peeji.
- source_word: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινούς
  choice: Kama, mmanya ọhụrụ bụ maka akpa akpụkpọ anụ ọhụrụ e ji echekwa mmanya
  rationale: Nkebi ikpeazụ n’asụsụ Grik enweghị ngwaa e dere ede. ‘Bụ maka’ na-edobe ya dịka ụkpụrụ ilu dị mkpirikpi, kama ime ya iwu a na-enyeghị kpọmkwem.
theological_decisions:
- issue: Ụdị nkebi ikpeazụ nke okwu ahụ, nke enweghị ngwaa n’asụsụ Grik
  choice: 'E gosiri ya dịka ụkpụrụ: ‘mmanya ọhụrụ bụ maka akpa ... ọhụrụ.’'
  alternative: ‘A ga-awụnye mmanya ọhụrụ n’ime akpa ... ọhụrụ’ ma ọ bụ ‘onye na-awụnye mmanya ọhụrụ n’ime akpa ... ọhụrụ.’
  rationale: Grik kwuru naanị, n’ụzọ nkịtị, ‘kama mmanya ọhụrụ n’ime akpa ọhụrụ.’ Nsụgharị ahọrọla anaghị etinye iwu siri ike ma ọ bụ onye na-eme ihe ebe ederede ahụ ekwughị ha.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. A kọwara ‘wineskins’ n’ahịrị n’onwe ya n’ihi na otu okwu Igbo dị mkpirikpi agaghị egosi ngwa ngwa na ọ bụ akpa akpụkpọ anụ e ji echekwa mmanya. Ahịrị ikpeazụ ka nwere ụda ilu ma na-echekwa ntakịrị enweghị nkọwa nke Grik.
