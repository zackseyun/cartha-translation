revisions:
- from: Ọ dịghịkwa onye na-awụnye mmanya ọhụrụ n’ime akpa akpụkpọ anụ ochie e ji echekwa mmanya.[a] Ọ bụrụ na o mee otú ahụ, mmanya ahụ ga-agbawa akpa ndị ahụ; mmanya ahụ ga-ala n’iyi,[b] akpa ndị ahụkwa ga-emebi. Kama, mmanya ọhụrụ bụ maka akpa akpụkpọ anụ ọhụrụ e ji echekwa mmanya.[c]
  to: Ọ dịghịkwa onye na-awụnye mmanya ọhụrụ n’ime akpa akpụkpọ anụ ochie.[a] Ma ọ bụghị ya, mmanya ahụ ga-agbawa akpa ndị ahụ; mmanya ahụ ga-ala n’iyi,[b] akpa ndị ahụkwa ga-emebi. Kama, mmanya ọhụrụ bụ maka akpa akpụkpọ anụ ọhụrụ.[c]
  rationale: 'The revision makes one small source-sensitive and idiomatic correction: “Ma ọ bụghị ya” directly conveys the conditional transition εἰ δὲ μή. It also removes repeated explanatory wording from the verse while retaining the necessary cultural clarification in footnote a. No theological interpretation has been added; the final Greek ellipsis remains represented as a general principle.'
