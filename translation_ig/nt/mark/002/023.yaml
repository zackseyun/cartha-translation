  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: ig
  text: O wee bụrụ na, n’ụbọchị Sabat, mgbe Jizọs na-agafe n’etiti ubi ọka[a], ndị na-eso ụzọ ya malitere ịgafe n’ime ubi ọka ahụ, na-atụtụ isi ọka[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’etiti ọka ndị toro n’ubi.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “malitere ime ụzọ”; n’ebe a, ọ pụtara na ha malitere ịgafe n’ubi ahụ ka ha na-atụtụ isi ọka.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ntị ọka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: O wee ruo na
  rationale: Ọ bụ ụzọ Igbo dị ebube ma dịkwa mfe nghọta e si webata ihe mere n’akụkọ, na-enweghị iji okwu ochie gabiga ókè.
- source_word: ἐν τοῖς σάββασιν
  choice: n’ụbọchị izuike
  rationale: Ọ bụ ezie na okwu Grik dị n’ụdị ọtụtụ, n’ebe a ọ bụ ụzọ e si ekwu otu ụbọchị izuike.
- source_word: παραπορεύεσθαι
  choice: na-agafe
  rationale: Nke a na-egosi omume ahụ na-aga n’ihu, ya bụ ịgafe n’etiti ubi ahụ.
- source_word: διὰ τῶν σπορίμων
  choice: n’etiti ubi ọka
  rationale: σπόριμα na-ezo aka n’ubi a kụrụ mkpụrụ ọka; okwu a bụ Igbo nkịtị ma doo anya.
- source_word: ἤρξαντο
  choice: wee malite
  rationale: Ọ na-echekwa echiche nke ịmalite omume nke ngwaa na-esote ya.
- source_word: ὁδὸν ποιεῖν
  choice: ịgafe
  rationale: N’ebe a akpaalaokwu ahụ pụtara na ha nọ na-aga n’ihu n’ụzọ ha, ọ bụghị na ha na-arụ okporo ụzọ.
- source_word: τίλλοντες
  choice: na-aghọtụ
  rationale: Okwu a na-egosi ịghọtụ ma ọ bụ ịdọpụ isi ọka n’osisi ya.
- source_word: τοὺς στάχυας
  choice: isi ọka
  rationale: Nke a bụ okwu Igbo doro anya maka akụkụ ọka nke nwere mkpụrụ.
- source_word: αὐτὸν
  choice: Jizọs
  rationale: E jiri aha onye a na-ekwu maka ya mee ka amaokwu ahụ doo anya n’Igbo; ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Jizọs.
theological_decisions:
- issue: Aha ụbọchị izuike
  choice: n’ụbọchị izuike
  alternative: n’ụbọchị Sabat
  rationale: “Ụbọchị izuike” na-enye echiche okwu ahụ n’Igbo nkịtị, na-ezerekwa itinye nkọwa otu ụka pụrụ iche.
- issue: Ihe ὁδὸν ποιεῖν pụtara n’arụmụka banyere ụbọchị izuike
  choice: ịgafe
  alternative: ime ụzọ
  rationale: A họọrọ akpaalaokwu na-egosi na ndị na-eso ụzọ nọ na-aga n’ihu n’ubi ahụ. Ọ naghị eme ka a ghọta na ha na-arụ ụzọ, ma ọ naghịkwa ebelata omume ịghọtụ ọka nke dugara n’arụmụka sochirinụ.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro akụkọ ahụ n’ụdị ebumpụta ụwa, a kọwakwara akpaalaokwu Grik n’ala ala peeji ka e wee ghara ime ka ọ pụta na ndị na-eso ụzọ na-arụ okporo ụzọ.
