    text: Ma ọ bụ, “n’etiti ọka ndị toro n’ubi.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “malitere ime ụzọ”; n’ebe a, ọ pụtara na ha malitere ịgafe n’ubi ahụ ka ha na-atụtụ isi ọka.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ntị ọka.”
    reason: lexical_alternative
  revision_rationale: The revision replaces the generic “day of rest” with “Ụbọchị Sabat,” improves the narrative formula, and makes the disciples’ movement through the field explicit while retaining the source idiom in a footnote. No disputed reading or doctrinal interpretation has been introduced.
