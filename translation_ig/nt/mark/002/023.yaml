revisions:
- from: O wee ruo na n’ụbọchị izuike, Jizọs na-agafe n’etiti ubi ọka[a], ndị na-eso ụzọ ya wee malite ịgafe, na-aghọtụ isi ọka[b][c].
  to: O wee bụrụ na, n’ụbọchị Sabat, mgbe Jizọs na-agafe n’etiti ubi ọka[a], ndị na-eso ụzọ ya malitere ịgafe n’ime ubi ọka ahụ, na-atụtụ isi ọka[b][c].
  rationale: The revision replaces the generic “day of rest” with “Ụbọchị Sabat,” improves the narrative formula, and makes the disciples’ movement through the field explicit while retaining the source idiom in a footnote. No disputed reading or doctrinal interpretation has been introduced.
  reviewer_model: gpt-5.6-terra
