id: MRK.2.8
reference: Mark 2:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: ig
  text: Ozugbo ahụ, Jizọs matara n'ime mmụọ ya[a] na ha na-eche echiche dị otu a n'ime onwe ha. Ọ sịrị ha, “Gịnị mere unu ji na-eche ihe ndị a n'obi unu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site na mmụọ ya,” ma ọ bụ “n'ime onwe ya.” Okwu Grik akọwaghị kpọmkwem ụzọ Jizọs si mata ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Ozugbo ahụ
  rationale: Ọ na-edobe ngwa ngwa na ume nke akara akụkọ Mak ji εὐθύς egosi, n'Igbo dị ugbu a ma dịkwa mfe nghọta.
- source_word: ἐπιγνοὺς
  choice: matara
  rationale: Matara na-egosi ịghọta ma ọ bụ ịmata nke ọma, n'ebughị ụzọ kọwaa kpọmkwem ụzọ Jizọs si nweta nghọta ahụ.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: n'ime mmụọ ya
  rationale: Nke a na-esochi okwu Grik nke ọma ma na-ahapụ ohere ma dative ahụ ọ̀ bụ mpaghara nghọta ka ọ bụ ụzọ e si ghọta, n'ekpebighị ihe amaokwu ahụ na-akọwaghị.
- source_word: οὕτως
  choice: dị otu a
  rationale: Ọ bụ okwu Igbo nkịtị nke na-egosi ụdị echiche ha na-eche.
- source_word: διαλογίζονται
  choice: na-eche echiche
  rationale: N'ebe a okwu ahụ na-ekwu maka ntụgharị uche dị n'ime, ọ bụghị mkparịta ụka a na-ekwu n'ọnụ.
- source_word: ἐν ἑαυτοῖς
  choice: n'ime onwe ha
  rationale: Ọ na-egosi na echiche ahụ dị n'ime onye ọ bụla n'ime ha, kama ịbụ naanị mkparịta ụka ha na ibe ha.
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: Gịnị mere unu ji na-eche ihe ndị a
  rationale: Ọ bụ ụzọ Igbo sitere n'okike isi jụọ ihe kpatara ha ji eche echiche ndị ahụ; ọ na-ebute ike ajụjụ τί n'ọnọdụ a.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: n'obi unu
  rationale: Obi na-edobe ihe atụ Akwụkwọ Nsọ nke ime mmadụ, ebe echiche na ebumnuche dị, n'emeghị ka ọ bụrụ naanị uche.
theological_decisions:
- issue: Ụdị amamihe Jizọs gosiri n'okwu ‘n'ime mmụọ ya’
  choice: E debere ‘n'ime mmụọ ya,’ ma kwuo na Jizọs matara echiche ime ha n'akọwaghị ụzọ nghọta ahụ si bịa.
  alternative: Ịkọwa ya kpọmkwem dị ka ịma ihe niile n'ụzọ Chineke, ọrụ Mmụọ Nsọ, ma ọ bụ naanị nghọta miri emi nke mmadụ.
  rationale: Amaokwu ahụ na-egosi nke ọma na Jizọs matara echiche dị n'ime ha, ma τῷ πνεύματι αὐτοῦ akọwaghị kpọmkwem ụzọ o si mata ya. Nsụgharị ahụ na-edobe ike na mgbagwoju okwu ahụ n'etinyeghị nkọwa otu ozizi n'ime ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Na-eche echiche’ dabara n'okwu ndị mmadụ na-eji kwa ụbọchị, ebe ‘n'obi unu’ na-edobe asụsụ na echiche Akwụkwọ Nsọ.
