base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: ig
  text: Ebe ọ bụ na ha enweghị ike ibute ya n’ebe Jizọs nọ n’ihi igwe mmadụ ahụ, ha kpughere elu ụlọ ahụ n’ebe ọ nọ. Mgbe ha gwupụsịrị ya, ha wedatara ute ahụ onye ahụ kpọnwụrụ akpọnwụ dina n’elu ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha hapụrụ ute ahụ ka ọ gbadaa.” Ngwaa Grik ahụ nwere ike ịpụta “iwedata” ma ọ bụ “ịhapụ ka ọ gbadaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δυνάμενοι
  choice: Ebe ha na-enweghị ike
  rationale: Nke a na-egosipụta ọnọdụ kpatara ihe ha mere, ma na-edobe ọdịdị participle ahụ n’Igbo dị mfe.
- source_word: προσενέγκαι αὐτῷ
  choice: ibute ya n’ebe Jizọs nọ
  rationale: Nnochiaha abụọ nke Grik na-ezo aka n’ọrịa ahụ na Jizọs. Ịkpọ Jizọs aha na-ewepụ mgbagwoju anya nke ‘ibute ya n’ebe ọ nọ’ n’Igbo, n’enweghị ịgbanwe ihe amaokwu ahụ pụtara.
- source_word: διὰ τὸν ὄχλον
  choice: n’ihi igwe mmadụ ahụ
  rationale: Ọ na-egosipụta ihe kpatara na ha enweghị ike ịbịaru Jizọs nso.
- source_word: ἀπεστέγασαν τὴν στέγην
  choice: ha wepụrụ elu ụlọ ahụ
  rationale: Ọ na-egosi na ha kpughere ma ọ bụ wepụ akụkụ elu ụlọ, na-enweghị ịkọwa ihe e ji rụọ ya karịa ihe Grik kwuru.
- source_word: ὅπου ἦν
  choice: n’ebe ọ nọ
  rationale: A hapụrụ nkebiokwu a n’ụdị ya dị mfe; ọnọdụ elu ụlọ na-eme ka a ghọta na oghere ahụ dị n’elu ebe Jizọs nọ.
- source_word: ἐξορύξαντες
  choice: Mgbe ha gwupusịrị oghere n’elu ụlọ ahụ
  rationale: Ngwaa ahụ na-egosi igwuputa ma ọ bụ ịgbajisị elu ụlọ ka oghere pụta; ‘gwupusịrị oghere’ bụ Igbo kwụ ọtọ ma ghara ịkọwa ihe e ji rụọ ụlọ ahụ.
- source_word: χαλῶσι
  choice: ha wedatara
  rationale: A sụgharịrị historical present ahụ n’oge gara aga maka usoro akụkọ Igbo nke na-ada nke ọma; ihe bụ isi bụ na ha si n’elu wedata ute ahụ.
- source_word: κράβαττον
  choice: ute
  rationale: Okwu a na-ezo aka n’ihe ndina dị mfe a pụrụ iburu, ọ bụghị nnukwu akwa.
- source_word: ὁ παραλυτικὸς
  choice: onye ahụ kpọnwụrụ akpọnwụ
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọwa onye akụkụ ahụ ya na-adịghị arụ ọrụ, kama iji okwu ọrịa dịka aha mmadụ.
- source_word: ὅπου ὁ παραλυτικὸς κατέκειτο
  choice: onye ahụ kpọnwụrụ akpọnwụ dina n’elu ya
  rationale: N’ọnọdụ a, nkebiokwu ahụ na-akọwa ute ahụ onye ọrịa ahụ dina n’elu ya.
