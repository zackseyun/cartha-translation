review_pass:
  verdict: revise
  source_fidelity: The draft conveys the causal inability to approach Jesus because of the crowd, the removal/uncovering of the roof, the opening made through it, and the lowering of the mat bearing the paralyzed man. However, “wepụrụ elu ụlọ ahụ” can naturally suggest removing the entire roof structure rather than uncovering the roof covering, and the causal opening “Ebe ha na-enweghị ike” is less idiomatic than a finite causal clause in Standard Igbo.
  naturalness: The narrative is generally clear and appropriately formal. “Ebe ọ bụ na ha enweghị ike” is more natural Standard Igbo, and “kpughere elu ụlọ ahụ” better expresses the roof action without implying that the entire roof was carried away. The historical present need not be mechanically retained, since past-tense narration is natural in Igbo.
  terminology: “Jizọs,” “igwe mmadụ,” “ute,” and “onye ahụ kpọnwụrụ akpọnwụ” are suitable modern Standard Igbo renderings. No doctrinal terminology is at issue. The lexical-alternative footnote on the lowering verb remains appropriate.
  issues:
  - severity: medium
    issue: “ha wepụrụ elu ụlọ ahụ” is potentially over-specific or misleading.
    rationale: The Greek rare verb ἀπεστέγασαν denotes uncovering or removing the roof covering. In Igbo, this wording may imply removal of the whole roof, whereas “ha kpughere elu ụlọ ahụ” more safely retains the action’s scope.
  - severity: low
    issue: “Ebe ha na-enweghị ike” is less idiomatic as the verse opening.
    rationale: The Greek participle has causal force. “Ebe ọ bụ na ha enweghị ike” expresses that relationship in fluent Standard Igbo without adding meaning.
  revised_text: Ebe ọ bụ na ha enweghị ike ibute ya n’ebe Jizọs nọ n’ihi igwe mmadụ ahụ, ha kpughere elu ụlọ ahụ n’ebe ọ nọ. Mgbe ha gwupụsịrị ya, ha wedatara ute ahụ onye ahụ kpọnwụrụ akpọnwụ dina n’elu ya.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha hapụrụ ute ahụ ka ọ gbadaa.” Ngwaa Grik ahụ nwere ike ịpụta “iwedata” ma ọ bụ “ịhapụ ka ọ gbadaa.”
    reason: lexical_alternative
  revision_rationale: The revision replaces an idiomatically weak causal opening and clarifies the roof action as uncovering rather than removing an entire roof. “Mgbe ha gwupụsịrị ya” preserves the Greek’s participial action of digging through the roof without specifying construction materials. The verse’s referents, narrative sequence, and lexical-alternative footnote are retained.
