revisions:
- from: Ebe ha na-enweghị ike ibute ya n’ebe Jizọs nọ n’ihi igwe mmadụ ahụ, ha wepụrụ elu ụlọ ahụ n’ebe ọ nọ. Mgbe ha gwupusịrị oghere n’elu ụlọ ahụ, ha wedatara ute ahụ onye ahụ kpọnwụrụ akpọnwụ dina n’elu ya.[a]
  to: Ebe ọ bụ na ha enweghị ike ibute ya n’ebe Jizọs nọ n’ihi igwe mmadụ ahụ, ha kpughere elu ụlọ ahụ n’ebe ọ nọ. Mgbe ha gwupụsịrị ya, ha wedatara ute ahụ onye ahụ kpọnwụrụ akpọnwụ dina n’elu ya.[a]
  rationale: The revision replaces an idiomatically weak causal opening and clarifies the roof action as uncovering rather than removing an entire roof. “Mgbe ha gwupụsịrị ya” preserves the Greek’s participial action of digging through the roof without specifying construction materials. The verse’s referents, narrative sequence, and lexical-alternative footnote are retained.
