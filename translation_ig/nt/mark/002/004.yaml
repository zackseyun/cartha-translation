  register: Asụsụ Igbo Standard dị ugbu a, dị ùgwù ma dị mfe nghọta. E kpọrọ Jizọs aha iji zere mgbagwoju anya nke nnochiaha abụọ. A naghị akọwapụta ihe e ji rụọ elu ụlọ, ebe ihe odide Grik ekwughị ya.
