review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the rhetorical negative question, David, his need, his hunger, and those with him. However, «na-agụbeghị» is not the most accurate form for the completed act of reading in this question, and «agụụ agụọkwa ya» does not naturally express the past event ἐπείνασεν.
  naturalness: «Ọ̀ dịtụbeghị mgbe unu gụrụ» is a natural Standard Igbo rhetorical formulation. «agụụ gụkwara ya» is the idiomatic past expression for David becoming/being hungry.
  terminology: «Devid», «mkpa», and «ndị ya na ha nọ» are suitable Standard Igbo choices. No theological terminology is involved.
  issues:
  - severity: medium
    issue: Aspect and idiom in the hunger clause
    rationale: «agụụ agụọkwa ya» is not the normal past-event form here. The Greek aorist ἐπείνασεν calls for an idiomatic past expression such as «agụụ gụkwara ya».
  - severity: low
    issue: Reading-question phrasing
    rationale: «Ọ̀ dịtụla mgbe unu na-agụbeghị» is less idiomatic and can suggest an ongoing/noncompleted reading situation. «Ọ̀ dịtụbeghị mgbe unu gụrụ» directly conveys «Have you never read?».
