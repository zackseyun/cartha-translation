  text: καὶ ⸀λέγει αὐτοῖς· Οὐδέποτε ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε χρείαν ἔσχεν καὶ ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/025.yaml
  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: ig
  text: Ọ sịrị ha, “Ọ̀ dịtụbeghị mgbe unu gụrụ ihe Devid mere mgbe mkpa dị ya, agụụ gụkwara ya, ya na ndị ya na ha nọ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: Ọ̀ dịtụla mgbe unu na-agụbeghị
  rationale: Na-egosipụta ajụjụ nkwutọ nke na-atụ anya azịza ‘Mba,’ ma na-edobe echiche nke ‘ọ dịtụbeghị mgbe unu gụrụ.’
- source_word: χρείαν ἔσχεν
  choice: mgbe mkpa bịara ya
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo na Devid nọ ná mkpa, n’ebughị ụzọ kọwaa ụdị mkpa ahụ karịa ihe Grik kwuru.
- source_word: ἐπείνασεν
  choice: agụụ agụọkwa ya
  rationale: Na-asụgharị ngwaa ahụ kpọmkwem dị ka ọnọdụ agụụ nke Devid, ma na-edobe ‘kwa’ nke καί.
- source_word: οἱ μετ’ αὐτοῦ
  choice: ndị ya na ha nọ
  rationale: Na-edobe nkọwa sara mbara nke ndị ha na Devid nọ, n’etinyeghị okwu dị ka ‘ndị enyi’ ma ọ bụ ‘ndị agha’ nke isi mmalite ahụ ekwughị.
theological_decisions: []
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere ajụjụ ahụ dị ka nkwutọ, yana nkwughachi ‘ya na ndị ya na ha nọ’ iji chekwaa nrụgide nke ederede Grik.
