    reason: alternative_reading
  revision_rationale: The revision replaces an unnatural opening with a standard Igbo narrative transition and clarifies that the tax collectors and sinners were dining together with Jesus and his disciples. It leaves the owner of the house unspecified, as does the Greek, and retains the explanatory statement that many of them were following Jesus.
