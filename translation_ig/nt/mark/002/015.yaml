revisions:
- from: O wee ruo na mgbe ọ nọ na-eri nri n’ụlọ ya[a], ọtụtụ ndị ọna ụtụ isi na ndị mmehie sokwa Jizọs na ndị na-eso ụzọ ya na-eri nri; n’ihi na ha dị ọtụtụ, ha na-esokwa ya.
  to: O wee mee na, ka ọ nọ n’ụlọ ya[a] na-eri nri, ọtụtụ ndị ọna ụtụ isi na ndị mmehie ha na Jizọs na ndị na-eso ụzọ ya na-eri nri; n’ihi na ha dị ọtụtụ, ha na-esokwa ya.
  rationale: The revision replaces an unnatural opening with a standard Igbo narrative transition and clarifies that the tax collectors and sinners were dining together with Jesus and his disciples. It leaves the owner of the house unspecified, as does the Greek, and retains the explanatory statement that many of them were following Jesus.
