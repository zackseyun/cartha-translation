id: MRK.2.15
reference: Mark 2:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: ig
  text: O wee mee na, ka ọ nọ n’ụlọ ya[a] na-eri nri, ọtụtụ ndị ọna ụtụ isi na ndị mmehie ha na Jizọs na ndị na-eso ụzọ ya na-eri nri; n’ihi na ha dị ọtụtụ, ha na-esokwa ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ụlọ Livaị”; ụfọdụ na-aghọta ya dịka “n’ụlọ Jizọs.” Naanị “n’ụlọ ya” ka okwu Grik ahụ kwuru.
    reason: alternative_reading
lexical_decisions:
- source_word: γίνεται
  choice: O wee ruo na
  rationale: Ọ bụ ụzọ Igbo si akọwa mgbanwe ihe omume n’akụkọ n’ụzọ dị ndụ, kama ịsụgharị historical present ahụ n’ụzọ siri ike.
- source_word: κατακεῖσθαι
  choice: nọ na-eri nri
  rationale: Okwu Grik ahụ na-ezo aka n’ịdabere ala mgbe a na-eri nri dịka omenala oge ahụ. Igbo a na-akọwa ọnọdụ iri nri n’ụzọ doro anya ma bụrụkwa nke ndị na-agụ taa ga-aghọta.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: n’ụlọ ya
  rationale: Nke a na-edobe nnọchiaha nwe ihe dị n’odide Grik ma ghara ikpebi onye nwe ụlọ ahụ.
- source_word: τελῶναι
  choice: ndị ọna ụtụ isi
  rationale: Ọ bụ okwu Igbo doro anya maka ndị na-anakọta ụtụ maka ọchịchị.
- source_word: ἁμαρτωλοὶ
  choice: ndị mmehie
  rationale: Nke a bụ nsụgharị kwụ ọtọ nke aha ahụ, na-edobekwa otú e si kpọọ ìgwè mmadụ ahụ n’ebe a.
- source_word: συνανέκειντο
  choice: sokwa ... na-eri nri
  rationale: Nke a na-egosi ma iri nri ahụ ma mkpakọrịta ha na Jizọs, n’Igbo dị mfe ma dị ndụ.
- source_word: μαθηταῖς
  choice: ndị na-eso ụzọ
  rationale: Ọ bụ okwu Igbo a na-ejikarị eme ihe maka ndị na-amụta ihe n’aka onye nkuzi ma na-eso ya.
- source_word: ἦσαν γὰρ πολλοὶ
  choice: n’ihi na ha dị ọtụtụ
  rationale: Nke a na-edobe ọrụ γάρ dị ka nkọwa ihe kpatara ya, tinyere nkwughachi banyere ịdị ọtụtụ ha.
- source_word: ἠκολούθουν αὐτῷ
  choice: ha na-esokwa ya
  rationale: Ụdị ngwaa na-aga n’ihu na-egosi omume nọgidere na-eme ma ọ bụ nke ha na-emebu; “na-esokwa” na-edobe echiche ahụ.
theological_decisions:
- issue: Onye nnọchiaha dị na “n’ụlọ ya” (αὐτοῦ) na-ezo aka na ya
  choice: A hapụrụ ya dịka “n’ụlọ ya” n’ahịrịokwu bụ isi.
  alternative: Ụlọ Livayị; ma ọ bụ ụlọ Jizọs.
  rationale: Odide Grik ekwughị kpọmkwem onye nwe ụlọ ahụ. Ọtụtụ na-aghọta ya dịka ụlọ Livayị n’ihi amaokwu bu ụzọ, ebe ụfọdụ na-aghọta ya dịka ụlọ Jizọs. Nsụgharị ahụ ekpebighị ihe odide ahụ na-ekpebighị.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. A sụgharịrị ọnọdụ iri nri n’ụzọ ebumpụta ụwa n’Igbo, ma e debere mgbagwoju anya nke nnọchiaha “ya” yana nkwughachi dị n’ahịrị ikpeazụ.
