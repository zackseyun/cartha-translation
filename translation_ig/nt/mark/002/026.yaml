  source_fidelity: 'Isi nsụgharị ahụ na-esochi Grik nke ọma: ọ na-edobe okwu ajụjụ πῶς, ịbanye n’ụlọ Chineke, nkebi okwu oge nke ἐπὶ Ἀβιαθὰρ ἀρχιερέως n’enweghị idozi esemokwu akụkọ, achịcha nsọ, mmachi ndị nchụaja, na inye ndị so ya. Otú ọ dị, ‘ndị ya na ha nọ’ gbanwere ntụaka τοῖς σὺν αὐτῷ οὖσιν (‘ndị nọnyere ya’) ka ọ dị ka ndị ‘ya’ nọnyere ndị ọzọ.'
  naturalness: '‘N’oge Abịata onyeisi nchụaja’ na-agụ nke ọma, ma kọmaa ya site n’itinye ‘bụ’ ka apposition ahụ doo anya: ‘n’oge Abịata bụ onyeisi nchụaja.’ ‘Ndị nọnyere ya’ bụ okwu Igbo eke ma zie ezi karịa ‘ndị ya na ha nọ.’'
