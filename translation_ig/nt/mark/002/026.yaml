id: MRK.2.26
reference: Mark 2:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: ig
  text: otú o si banye n’ụlọ Chineke n’oge Abịata bụ onyeisi nchụaja[a], rie achịcha a na-edebe n’ihu Chineke[b], nke iwu na-akwadoghị ka onye ọ bụla rie ma e wezụga ndị nchụaja, nyekwa ndị nọnyere ya ụfọdụ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “mgbe Abịata bụ onyeisi nchụaja.” Nkebi okwu ahụ nwekwara ike izo aka n’oge ma ọ bụ n’akụkụ akụkọ e jikọtara ya na Abịata onyeisi nchụaja.
    reason: alternative_reading
  - marker: b
    text: “Achịcha a na-edebe n’ihu Chineke” bụ achịcha e doro nsọ nke a na-edebe n’ihu Chineke n’ebe nsọ; a na-akpọkarị ya “achịcha ngosi.”
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: otú o si
  rationale: Nke a na-ewebata akụkọ banyere ihe Devid mere n’ụzọ Igbo dị mfe ma kwekọọ n’ọrụ okwu Grik ahụ.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: banye n’ụlọ Chineke
  rationale: Ọ na-edobe ma omume ịbanye ma okwu ahụ bụ ‘ụlọ Chineke’ n’asụsụ Igbo eke.
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: n’oge Abịata onyeisi nchụaja
  rationale: ‘N’oge’ na-egosipụta echiche oge nke ἐπί na genitive n’ebughị ụzọ mee ka okwu ahụ bụrụ nkwupụta kpọmkwem banyere mgbe Abịata malitere ijide ọkwa ahụ.
- source_word: ἄρτους τῆς προθέσεως
  choice: achịcha a na-edebe n’ihu Chineke
  rationale: Nke a na-eme ka onye Igbo nke oge a ghọta na ọ bụ achịcha nsọ e debere n’ihu Chineke, ma na-ezere okwu ọdịnala nke na-agaghị edo anya.
- source_word: ἔφαγεν
  choice: rie
  rationale: Oge omume Igbo a na-akọ akụkọ ahụ n'ụzọ dị mkpirikpi ma kwekọọ na aorist Grik.
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν
  choice: nke iwu na-akwadoghị ka onye ọ bụla rie
  rationale: Ọ na-egosipụta na e kweghị iri ya n’usoro iwu na ọnọdụ nsọ a, ma mee ka ahịrịokwu ahụ doo anya n’Igbo.
- source_word: εἰ μὴ τοὺς ἱερεῖς
  choice: ma e wezụga ndị nchụaja
  rationale: Nke a na-egosipụta nke ọma na ọ bụ naanị ndị nchụaja ka e nyere ikike iri achịcha ahụ.
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: nyekwa ndị ya na ha nọ ụfọdụ
  rationale: ‘Ndị ya na ha nọ’ na-anọ nso n’okwu Grik; ‘ụfọdụ’ na-eme ka ihe e nyere ha, ya bụ achịcha ahụ, doo anya n’Igbo n’enweghị ikwughachi ya n’ụzọ arọ.
theological_decisions:
- issue: Nkebi okwu oge banyere Abịata na njikọ ya na akụkọ dị na 1 Samuel 21
  choice: n’oge Abịata onyeisi nchụaja
  alternative: mgbe Abịata bụ onyeisi nchụaja; n’akụkụ akụkọ gbasara Abịata onyeisi nchụaja
  rationale: Nkebi okwu Grik ahụ nwere ike ịkọwa oge ma ọ bụ ọnọdụ sara mbara nke akụkọ ahụ. Nsụgharị bụ isi anaghị amanye nkọwa oge dị warara; ihe odide ala peeji na-edobe nhọrọ ndị ọzọ na esemokwu onye na-agụ nwere ike ịhụ mgbe o jiri ya tụnyere 1 Samuel 21.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘onyeisi nchụaja’ maka ἀρχιερεύς, ma kọwaa okwu ofufe pụrụ iche n’ụzọ pụtara ìhè kama iji naanị aha ọdịnala na-edochaghị anya.
