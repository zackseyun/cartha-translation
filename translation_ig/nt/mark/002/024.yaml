  text: καὶ οἱ Φαρισαῖοι ἔλεγον αὐτῷ· Ἴδε τί ⸀ποιοῦσιν τοῖς σάββασιν ὃ οὐκ ἔξεστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/024.yaml
  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: ig
  text: Ndị Farisii nọ na-asị ya, “Lee, gịnị mere ha ji eme ihe a na-ekweghị ka e mee n’Ụbọchị Izu Ike?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Lee, gịnị ka ha na-eme nke a na-ekweghị ka e mee n’Ụbọchị Izu Ike?” A pụrụ ịghọta okwu Grik τί dịka “gịnị,” ọ bụ ezie na ihe ọ pụtara n’ọnọdụ a yiri ka ọ bụ “gịnị mere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ndị Farisii
  rationale: E tinyere njikọ καὶ n’usoro akụkọ Igbo n’enweghị ‘na’ mmalite, n’ihi na nke a bụ ụzọ Igbo si aga nke ọma ma ọ naghị etinye echiche oge ọzọ.
- source_word: οἱ Φαρισαῖοι
  choice: Ndị Farisii
  rationale: A họọrọ aha otu a nke a na-ejikarị n’Igbo, tinyere ‘Ndị’ iji gosi ìgwè ahụ.
- source_word: ἔλεγον
  choice: nọ na-asị
  rationale: Ụdị ngwaa imperfect na-egosi okwu na-aga n’ihu ma ọ bụ a na-ekwu ugboro ugboro; ‘nọ na-asị’ na-echekwa akụkụ a n’Igbo eke.
- source_word: αὐτῷ
  choice: ya
  rationale: ‘Ya’ bụ ụzọ Igbo dị nkenke ma bụrụkwa nke eke isi gosipụta onye a na-agwa okwu, ya bụ Jizọs.
- source_word: Ἴδε
  choice: Lee
  rationale: Ọ bụ iwu e ji adọta uche onye na-ege ntị; ‘Lee’ bụ okwu Igbo doro anya ma dị ùgwù.
- source_word: τί
  choice: gịnị mere
  rationale: N’agbanyeghị na τί nwere ike ịbụ ‘gịnị,’ n’usoro mkpesa a ọ na-arụ ọrụ dịka ‘gịnị mere,’ ya bụ ‘why,’ ma a hapụrụ ụzọ ọzọ n’ala ala peeji.
- source_word: ποιοῦσιν
  choice: ha ji eme
  rationale: N’ime ajụjụ ‘gịnị mere,’ ‘ji eme’ bụ usoro Igbo eke nke na-ebute ngwaa dị ugbu a.
- source_word: τοῖς σάββασιν
  choice: n’Ụbọchị Izu Ike
  rationale: Ọ bụ ezie na Grik ji ụdị ọtụtụ, ọ bụ akpaalaokwu na-ezo aka n’otu ụbọchị Sabbath; ‘Ụbọchị Izu Ike’ bụ okwu Igbo doro anya.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ihe a na-ekweghị ka e mee
  rationale: Nke a na-echekwa echiche nke ihe na-abụghị nke e kwere ime, na-akọwaghị ma ọ bụ iwu Akwụkwọ Nsọ, omenala ndị Farisii, ma ọ bụ nkọwa iwu okpukpe.
theological_decisions:
- issue: Ụdị ebubo ndị Farisii
  choice: ihe a na-ekweghị ka e mee
  alternative: ihe megidere iwu
  rationale: Grik kwuru naanị na e kweghị ime ya. Nsụgharị a na-echekwa ike ebubo metụtara iwu na okpukpe, ma ọ naghị ekpebi kpọmkwem ụdị iwu ma ọ bụ omenala e kwuru maka ya.
- issue: Ihe τί pụtara n’ajụjụ ahụ
  choice: gịnị mere
  alternative: gịnị
  rationale: Ọnọdụ mkpesa ahụ na-akwado ihe kpatara omume ahụ (‘why’), ma ebe Grik nwekwara ike ịgụ dịka ‘what,’ e debere nghọta ọzọ ahụ n’ala ala peeji iji chekwaa mgbagwoju anya dị n’isi mmalite.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘Ụbọchị Izu Ike’ mee ka echiche Sabbath doo anya, a zerekwa ikwu kpọmkwem ụdị iwu ndị Farisii na-ekwu maka ya.
