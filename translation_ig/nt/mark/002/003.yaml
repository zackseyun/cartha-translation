  yaml_path: translation/nt/mark/002/003.yaml
  text: And they came[a], bringing to him a paralyzed man carried by four.
translation:
  language: ig
  text: Ha bịakwutere ya, na-ebute otu nwoke ahụ ya kpọnwụrụ akpọnwụ, nke ndị anọ[a] bu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, e kwuru naanị ‘anọ’; a kpọghị ndị ahụ aha kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ha
  rationale: Njikọ ahụ dị na Grik na-aga n'ihu n’akụkọ ahụ. N’Igbo, ịmalite ozugbo na ‘Ha’ na-eme ka njikọ ahụ doo anya n’enweghị itinye okwu na-akọwa oge nke na-adịghị na isi mmalite.
- source_word: ἔρχονται
  choice: bịakwutere ya
  rationale: Ọ bụ ngwaa dị n’oge ugbu a e ji akọ akụkọ gara aga. Oge gara aga dabara n’akụkọ Igbo, ebe ‘-kwute’ na-egosi na ha bịara n’ebe Jizọs nọ.
- source_word: φέροντες πρὸς αὐτὸν
  choice: na-akpọtara ya
  rationale: Nke a na-egosi ihe ha na-eme mgbe ha na-abịa, ya bụ, ịkpọtara onye ahụ Jizọs. Usoro ‘na-akpọtara ya’ bụ Igbo nkịtị ma chekwaa omume na-aga n’otu oge ahụ.
- source_word: παραλυτικὸν
  choice: otu nwoke ahụ ya kpọnwụrụ akpọnwụ
  rationale: Adjective Grik a na-anọchi aha mmadụ. Nsụgharị a na-akọ ọnọdụ nwoke ahụ n’asụsụ Igbo dị mfe ma ghara ime ka ọrịa ya bụrụ aha e ji amata ya.
- source_word: αἰρόμενον
  choice: bu ya
  rationale: Participle a bụ passive ma na-egosi na ndị ọzọ ji ahụ ha na-ebu nwoke ahụ. ‘Bu ya’ bụ okwu Igbo kpọmkwem ma dị mfe.
- source_word: ὑπὸ τεσσάρων
  choice: mmadụ anọ[a]
  rationale: Grik kwuru naanị ‘anọ,’ ma Igbo chọrọ aha a na-agụ ọnụ n’ebe a ka ahịrịokwu wee bụrụ nke eke. ‘Mmadụ’ anaghị akọwa ha karịa ihe ọnọdụ ahụ na-egosi, ebe ndetu ala na-echekwa mkpụmkpụ okwu Grik.
