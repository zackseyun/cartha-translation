review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the principal sense: people come to Jesus bringing a paralyzed man, and four bear him. However, the final comma-separated clause is syntactically loose in Igbo and leaves the pronoun "ya" less clearly linked to the paralyzed man. The Greek''s ellipsis after "four" should be retained in the note without claiming that it explicitly says "people."'
  naturalness: '"Ha bịakwutere ya, na-ebute..." is natural narrative Igbo. Adding a relative connector before the bearing clause makes the sentence read smoothly and clearly. "Ndị anọ" is idiomatic in this context while retaining the source''s concise expression.'
  terminology: '"Nwoke ahụ ya kpọnwụrụ akpọnwụ" is an understandable, respectful Standard Igbo expression for the substantival παραλυτικός. No theological terminology is involved.'
  issues:
  - severity: medium
    issue: The clause "mmadụ anọ[a] bu ya" is joined only by a comma and has an ambiguous pronoun.
    rationale: It can momentarily make "ya" unclear between Jesus and the paralyzed man. A relative clause explicitly attaches the carrying action to the paralyzed man.
  - severity: low
    issue: The footnote says that the context means "mmadụ anọ" (four people).
    rationale: The Greek literally says only "four"; although human bearers are naturally inferred, the note should distinguish inference from what is explicitly stated.
  revised_text: Ha bịakwutere ya, na-ebute otu nwoke ahụ ya kpọnwụrụ akpọnwụ, nke ndị anọ[a] bu.
