translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara usoro akụkọ ahụ na omume abụọ na-aga n’otu oge, ma zere ịgbakwunye nkọwa okpukpe ma ọ bụ ịkọwa ndị anọ ahụ karịa ihe Grik kwuru.
