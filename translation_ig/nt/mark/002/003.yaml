  to: Ha bịakwutere ya, na-ebute otu nwoke ahụ ya kpọnwụrụ akpọnwụ, nke ndị anọ[a] bu.
  rationale: The revision preserves the Greek narrative sequence and its ambiguity about the identity of the four bearers. It makes the bearing clause a clear modifier of the paralyzed man and revises the footnote to state precisely that Greek says only “four,” without adding an explicit identification not present in the source.
