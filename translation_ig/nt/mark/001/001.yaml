  yaml_path: translation/nt/mark/001/001.yaml
  text: The beginning of the good news of Jesus the Messiah[a][b].
translation:
  language: ig
  text: Mmalite ozi ọma Jizọs, bụ́ Mesaịa[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “oziọma.” Okwu Grik bụ εὐαγγέλιον pụtara ozi ọma; “oziọma” bụ ụdị e ji ya eme ihe n'ọdịnala ụka.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị “Jizọs Kraịst.” Okwu Grik bụ Χριστός pụtara “Mesaịa” mgbe e ji ya dị ka utu aha.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρχὴ
  choice: Mmalite
  rationale: Aha a na-enweghị ngwaa na-edobe ụdị mmalite isiokwu dị n'okwu Grik, n'etinyeghị nkọwa karịrị nke isi mmalite ma ọ bụ mmalite akụkọ ahụ.
- source_word: εὐαγγελίου
  choice: ozi ọma
  rationale: Nke a na-egosipụta ihe okwu Grik ahụ pụtara n'ụzọ doro ndị na-agụ Igbo nke oge a anya; e debere ụdị okwu omenala “oziọma” dị ka nhọrọ n'okpuru ederede.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: E dere aha mmadụ ahụ n'ụdị mkpụrụokwu Igbo nke oge a.
- source_word: χριστοῦ
  choice: Mesaịa
  rationale: N'ebe a, Χριστός na-arụ ọrụ dị ka utu aha nke na-akọwa Jizọs dị ka Mesaịa, ọ bụghị nanị dị ka akụkụ aha ya; ya mere, a họọrọ utu aha ahụ kama “Kraịst.”
theological_decisions:
- issue: Ma a ga-asụgharị Χριστός dị ka utu aha ma ọ bụ debe ya n'ụdị aha omenala
  choice: Mesaịa
  alternative: Kraịst
  rationale: Usoro genitive “Ἰησοῦ χριστοῦ” n'okwu mmeghe a na-egosi njirimara ọrụ Jizọs dị ka Mesaịa. “Kraịst” ka bụkwa nsụgharị omenala ziri ezi, ya mere e nyere ya n'okpuru ederede.
- issue: Mmekọrịta genitive dị na “εὐαγγελίου Ἰησοῦ”
  choice: ozi ọma Jizọs
  alternative: ozi ọma banyere Jizọs
  rationale: Ụdị Igbo a dị mkpirikpi na-edobe ohere na ozi ọma ahụ bụ nke gbasara Jizọs, nke sitere n'aka ya, ma ọ bụ nke jikọrọ ya na ya, kama ikpebi naanị otu nghọta nke genitive Grik ahụ.
translation_notes:
  register: Asụsụ ahụ dị mkpirikpi, dị nsọ ma bụrụ Igbo ọkọlọtọ nke oge a. E debere usoro aha nke okwu Grik n'enweghị itinye ngwaa ma ọ bụ ịkọwa mmekọrịta genitive ahụ n'ụzọ ga-emechi nghọta ndị ọzọ.
