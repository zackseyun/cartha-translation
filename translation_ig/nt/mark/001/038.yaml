  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἄγωμεν ⸀ἀλλαχοῦ εἰς τὰς ἐχομένας κωμοπόλεις, ἵνα καὶ ἐκεῖ κηρύξω, εἰς τοῦτο γὰρ ⸀ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: ig
  text: Ọ sịrị ha, “Ka anyị gaa ebe ọzọ, n’obodo nta ndị dị nso[a], ka m kwusaakwa ozi n’ebe ahụ, n’ihi na ọ bụ maka nke a ka m ji pụta[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị ‘obodo nta’ nwere ike ịpụta ebe obibi pere mpe, nke dị n’etiti obodo nta na obodo ukwu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta ya dịka, ‘ọ bụ maka nzube a ka m ji pụta.’ Nkebiokwu ahụ nwere ike izo aka naanị n’ịhapụ ebe ọ nọ ugbu a, ma ọ bụ n’ụzọ sara mbara, na nzube ya nke ịpụ izi ozi.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγωμεν
  choice: Ka anyị gaa
  rationale: Ụdị ngwaa a bụ hortatory subjunctive nke onye mbụ n’ọtụtụ; ‘Ka anyị gaa’ bụ ụzọ Igbo dị mfe ma bụrụ nke okike isi nye ndị ọzọ òkù ka ha soro gaa.
- source_word: ἀλλαχοῦ
  choice: ebe ọzọ
  rationale: Ọ pụtara ịga n’ebe ọzọ, n’ebe na-abụghị ebe ha nọ ugbu a; ‘ebe ọzọ’ na-ekwupụta nke a n’Igbo nkịtị.
- source_word: ἐχομένας
  choice: ndị dị nso
  rationale: N’ebe a, okwu ahụ na-egosi ebe ndị na-esote ma ọ bụ ndị gbara ha gburugburu; ‘ndị dị nso’ na-enye echiche ala ahụ nke ọma.
- source_word: κωμοπόλεις
  choice: obodo nta
  rationale: Okwu Grik a na-ezo aka n’obodo ndị pere mpe, nke nwere ike ịdị n’etiti ime obodo na obodo buru ibu. ‘Obodo nta’ bụ okwu Igbo doro anya ma dị mfe, ebe nkọwa ala peeji na-echekwa obosara ihe okwu ahụ nwere ike ịpụta.
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: ka m kwusakwaa ozi n’ebe ahụ
  rationale: ‘Ka’ na-egosi nzube nke ἵνα; ‘kwusaa ozi’ na-egosipụta ikwusa n’ihu ọha, ebe ‘-kwaa’ na ‘n’ebe ahụ’ na-echekwa echiche καὶ ἐκεῖ, ya bụ, imekwa ya n’ebe ahụ.
- source_word: εἰς τοῦτο
  choice: ọ bụ maka nke a
  rationale: Nkebiokwu a na-egosi ihe kpatara ya ma ọ bụ nzube ya. Nsụgharị a bụ Igbo dị mfe ma ọ naghị akọwapụta ihe ahụ karịa ka Grik mere.
- source_word: ἐξῆλθον
  choice: ka m ji pụta
  rationale: ‘Pụta’ na-echekwa isi echiche nke isi n’ime ebe pụọ. Ọ dịghị ekwu kpọmkwem ma Jizọs ọ̀ na-ekwu maka ịhapụ ebe ọ nọ ugbu a ka ọ bụ maka nzube sara mbara nke ọpụpụ ya.
- source_word: λέγει αὐτοῖς
  choice: Ọ sịrị ha
  rationale: Ọ bụ ezie na Grik ji historical present, oge gara aga bụ ụzọ akụkọ Igbo si ada nke ọma n’ebe a ma ọ naghị agbanwe ihe ọ pụtara.
theological_decisions:
- issue: Ihe ἐξῆλθον na-ezo aka na ya
  choice: A sụgharịrị ya n’ụzọ sara mbara dịka ‘ka m ji pụta,’ n’akọwaghị ebe ọ si pụta ma ọ bụ ókè nzube ahụ ruru.
  alternative: ‘ka m ji si n’ebe ahụ pụọ’ ma ọ bụ ‘ọ bụ maka ozi a ka m ji bịa’
  rationale: Grik nwere ike izo aka n’ịhapụ ụlọ ma ọ bụ ebe ahụ, ma n’ọnọdụ akụkọ a ọ pụkwara inwe echiche sara mbara banyere ịpụ izi ozi. Nsụgharị bụ isi na ala peeji na-echekwa mgbagwoju a kama idozi ya dịka ozizi banyere ebe Jizọs si bịa ma ọ bụ ozi ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘kwusaa ozi’ kama itinye ‘ozi ọma,’ n’ihi na κηρύξω n’onwe ya ekwughị ihe a na-ekwusa kpọmkwem, ọ bụ ezie na ọnọdụ gbara amaokwu ahụ gburugburu na-akọwa ya.
