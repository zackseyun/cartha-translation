  source_fidelity: The draft accurately represents the hortatory invitation, the movement to nearby smaller settlements, the purpose clause, and the deliberately open-ended sense of ἐξῆλθον. The placement of the two footnote anchors appropriately corresponds to κωμοπόλεις and ἐξῆλθον.
