    rationale: Replace “kwusakwaa” with “kwusaakwa.” This more transparently joins kwusaa (“proclaim”) with the additive -kwa (“also”), preserving καὶ ἐκεῖ naturally.
  - severity: low
    issue: Wording of the lexical footnote for κωμοπόλεις
    rationale: “N’etiti ime obodo na obodo” can be less precise, since ime obodo may mean rural/interior areas rather than a settlement category. “N’etiti obodo nta na obodo ukwu” more directly communicates the village-town range intended by the note.
