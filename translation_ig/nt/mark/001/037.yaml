  yaml_path: translation/nt/mark/001/037.yaml
  text: And they found him and said to him[a], “Everyone is looking for you.”
translation:
  language: ig
  text: Ha chọtara ya wee sị ya, “Mmadụ niile na-achọ gị[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ha niile na-achọ gị.” N’okwu Grik, ζητοῦσίν nwekwara ike ịpụta “na-achọ” ma ọ bụ “na-agbalị ịchọta”; n’ebe a, o yikarịrị ka ọ na-ekwu maka ndị mmadụ na-achọ ịchọta Jizọs n’onwe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρον
  choice: chọtara
  rationale: 'Ngwaa a n’ụdị aorist na-egosi na nchọ ha rụpụtara ihe: ha mechara hụ onye ha na-achọ. “Chọtara” bụ ụzọ Igbo si ekwu nke a n’akụkọ.'
- source_word: λέγουσιν
  choice: wee sị
  rationale: Ọ bụ ezie na Grik ji historical present, “wee sị” dabara n’usoro akụkọ Igbo ma na-egosikwa ihe sochiri nchọta ahụ.
- source_word: ὅτι
  choice: akara mmeghe okwu kpọmkwem
  rationale: ὅτι na-ewebata ihe ha kwuru kpọmkwem; akara nhota na-egosipụta nke a n’Igbo nke ọma.
- source_word: Πάντες
  choice: Onye ọ bụla
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ozuzu ndị nọ na-achọ Jizọs, ọ bụghị na mmadụ niile n’ụwa n’enweghị oke.
- source_word: ζητοῦσίν σε
  choice: na-achọ gị
  rationale: ζητέω nwere ike ịpụta ịchọ ma ọ bụ ịgbalị ịchọta mmadụ. “Na-achọ gị” bụ okwu Igbo dị mfe ma kwekọọ n’ọnọdụ ebe ndị mmadụ na-agbalị ịchọta Jizọs.
- source_word: καὶ ... καὶ
  choice: Ha ... wee
  rationale: Nhazi a na-edobe njikọ na ọsọ akụkọ Mak n’ụzọ na-ada nke ọma n’Igbo.
- source_word: αὐτὸν / αὐτῷ / σε
  choice: ya / ya / gị
  rationale: 'A sụgharịrị nnọchiaha ndị a dịka ọrụ ha si dị: onye a chọtara, onye a gwara okwu, na onye a na-achọ.'
