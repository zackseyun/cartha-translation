translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe ma dị ùgwù. E ji “chọtara” gosipụta nchọta gara nke ọma, ebe “na-achọ gị” na-edobe ma echiche ịchọ mmadụ ma obere obosara pụtara ζητέω.
