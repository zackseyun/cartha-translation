  text: καὶ ⸀εὐθὺς ἦν ἐν τῇ συναγωγῇ αὐτῶν ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ καὶ ἀνέκραξεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/023.yaml
  text: And immediately there was in their synagogue a man with an unclean spirit[a], and he cried out[b],
translation:
  language: ig
  text: Ozugbo ahụ, otu nwoke nwere mmụọ na-adịghị ọcha nọ n’ụlọ nzukọ ha, o wee tie mkpu,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ụfọdụ nsụgharị sụgharịrị ya, “mmụọ na-adịghị ọcha ji ya.” Nke a bụ nkọwa gbasapụrụ agbasapụ nke okwu Grik.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: Ozugbo ahụ
  rationale: Nke a na-egosipụta ọsọ akụkọ Mak na-aga, ma bụrụkwa okwu Igbo doro anya ma dị ugbu a.
- source_word: ἦν
  choice: otu nwoke ... nọ
  rationale: Igbo na-egosipụta ịdị adị n’ebe a nke ọma site n’iji ‘nọ,’ kama ịgbaso usoro okwu Grik n’ụzọ ga-adị arọ.
- source_word: συναγωγῇ αὐτῶν
  choice: n’ụlọ nzukọ ha
  rationale: ‘Ụlọ nzukọ’ bụ okwu Igbo a na-aghọta maka synagogue ndị Juu; ‘ha’ na-echekwa αὐτῶν.
- source_word: ἄνθρωπος
  choice: otu nwoke
  rationale: N’akụkọ a, okwu ahụ na-ezo aka n’otu nwoke kpọmkwem.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: nke mmụọ na-adịghị ọcha nọ n’ime ya
  rationale: Nke a na-enye echiche okwu Grik n’Igbo dị mfe nghọta, na-agbakwụnyeghị okwu nkọwa siri ike dịka ‘mmụọ ... ji ya.’
- source_word: ἀκαθάρτῳ
  choice: na-adịghị ọcha
  rationale: Nke a na-echekwa echiche adịghị ọcha nke okwu Grik, gụnyere ọdịnaya ime mmụọ ya.
- source_word: ἀνέκραξεν
  choice: o wee tie mkpu
  rationale: ‘Tie mkpu’ na-egosi mkpu dara ụda ma ghara ịkọwapụta mmetụta uche karịa ihe isi mmalite kwuru.
theological_decisions:
- issue: Otu e si sụgharịta asụsụ nhụjuanya mmụọ ọjọọ dị na ἐν πνεύματι ἀκαθάρτῳ
  choice: nke mmụọ na-adịghị ọcha nọ n’ime ya
  alternative: onye mmụọ na-adịghị ọcha ji; onye nọ n’ime mmụọ na-adịghị ọcha
  rationale: Nhọrọ a na-ekwupụta njikọ nwoke ahụ na mmụọ ahụ nke ọma, ma ọ naghị etinye nkọwa sara mbara nke okwu Grik ekwughị kpọmkwem. Ihe e dere n’okpuru peeji na-echekwa ọdịdị nkịtị nke okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, kwanyere ugwu, ma dị mfe nghọta. A họọrọ usoro okwu na-asọ asọ n’Igbo, ebe ihe e dere n’okpuru peeji na-echekwa ọdịdị Grik na nsụgharị nwere nkọwa karịa.
