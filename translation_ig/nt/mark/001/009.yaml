  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: ig
  text: O mere n’ụbọchị ndị ahụ na Jizọs si Nazaret dị na Galili bịa, Jọn wee mee ya baptizim n’Osimiri Jọdan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ime Osimiri Jọdan.” N’ụzọ kpọmkwem karị, okwu Grik ahụ nwere ike ịpụta “n’ime.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: O wee ruo
  rationale: Nke a bụ ụzọ Igbo dị ugbu a ma dịkwa ugwu si webata ihe ọhụrụ mere n’akụkọ, na-enweghị iji okwu ochie ma ọ bụ nke siri ike.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: n’ụbọchị ndị ahụ
  rationale: Ọ na-edobe nkọwa oge ahụ n’ụzọ doro anya ma kwekọọ n’ụdị akụkọ Grik.
- source_word: ἦλθεν
  choice: bịa
  rationale: Nke a bụ nsụgharị nkịtị na nke sitere n’okwu Grik n’onwe ya, na-agbakwụnyeghị echiche pụrụ iche banyere iru ebe ahụ.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Aha a bụ ụdị a na-ejikarị eme ihe n’Igbo ugbu a.
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: si Nazaret nke Galili
  rationale: Ọ na-edobe njikọ ebe dị n’ahịrị Grik ma na-ada nke ọma n’Igbo.
- source_word: ἐβαπτίσθη
  choice: Jọn wee mee ya baptizim
  rationale: E gbanwere ahịrị passive Grik ka ọ bụrụ active n’Igbo maka ịdị mfe na ịdị mma nke asụsụ, ma e debere onye mere ihe ahụ na onye e mere ya. “Baptizim” ezere ịkọwa usoro emume ahụ karịa ihe amaokwu ahụ kwuru.
- source_word: εἰς τὸν Ἰορδάνην
  choice: n’Osimiri Jọdan
  rationale: Nke a bụ ụzọ Igbo si akọ ebe e mere baptizim n’enweghị isi ike. E tinyere “Osimiri” iji mee ka aha ebe ahụ doo onye na-agụ Igbo anya; e debere nsụgharị nke na-egosi “n’ime” na nkọwa ala peeji.
- source_word: ὑπὸ Ἰωάννου
  choice: Jọn wee mee ya
  rationale: Ọ bụ Jọn bụ onye mere baptizim ahụ. Igbo active na-ekwupụta agency nke ὑπό na genitive n’ụzọ eke.
theological_decisions:
- issue: Nsụgharị βαπτίζω n’ebe echiche ụka dị iche iche nwere ike imetụta okwu a
  choice: mee ya baptizim
  alternative: mikpuo ya n’ime mmiri
  rationale: “Mee ya baptizim” na-akọ ihe amaokwu ahụ kwuru n’enweghị ịhọrọ otu nkọwa ụka banyere etu e si mee emume ahụ.
- issue: Passive Grik na onye mere baptizim ahụ
  choice: Jọn wee mee ya baptizim
  alternative: e mekwara ya baptizim site n’aka Jọn
  rationale: Nhọrọ active na-ada nke ọma karịa n’Igbo ma ọ naghị agbanwe eziokwu ahụ na Jizọs natara baptizim ahụ n’aka Jọn.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. E ji usoro akụkọ “O wee ruo” chekwaa ụda mmalite akụkọ ahụ; e jikwa ahịrị active mee ka okwu baptizim ahụ bụrụ nke eke n’Igbo.
