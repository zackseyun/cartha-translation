  rationale: The revision removes the additional sense introduced by “kwa” and substitutes more idiomatic Standard Igbo for the kingdom’s having drawn near. It otherwise preserves the draft’s faithful rendering, theological breadth, plural exhortations, and footnote-anchor placement.
