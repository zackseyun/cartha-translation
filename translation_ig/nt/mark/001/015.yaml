id: MRK.1.15
reference: Mark 1:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: ig
  text: na-ekwu sị, “Oge ahụ emezuola, alaeze Chineke[a] abịala nso. Chegharịanụ ma kwerenụ n’ozi ọma[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọchịchị Chineke.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “oziọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: emezuola
  rationale: Ngwaa a dị n’ụdị perfect, ya mere “emezuola” na-egosi ihe mezuru nke nsonaazụ ya ka dị ugbu a.
- source_word: καιρὸς
  choice: oge ahụ
  rationale: Καιρός ebe a bụ oge pụrụ iche e zubere, ọ bụghị naanị oge n’ozuzu; “oge ahụ” na-egosi oge ahụ a kapịrị ọnụ n’enweghị ịgbasa ihe odide ahụ.
- source_word: ἤγγικεν
  choice: abịaruola nso
  rationale: “Abịaruola nso” na-echekwa echiche perfect nke ihe bịaruru nso, nke ịdị nso ya ka dị ugbu a.
- source_word: βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: “Alaeze Chineke” bụ okwu Igbo doro anya nke na-ejigide ma echiche ọchịchị Chineke ma obosara nke alaeze ya; “ọchịchị Chineke” dị n’ala ala peeji dịka ụzọ ọzọ.
- source_word: μετανοεῖτε
  choice: Chegharịanụ
  rationale: “Chegharịanụ” na-egosi ntụgharị uche na ndụ nke iwu a na-akpọ mmadụ ime, ọ bụghị naanị ịgbanwe echiche n’uche.
- source_word: πιστεύετε
  choice: kwerenụ
  rationale: “Kwerenụ” bụ iwu e nyere ọtụtụ mmadụ, ma na-ejigide echiche ikwere/nwe okwukwe n’enweghị ịkọwa ya n’ụzọ dị warara.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: n’ozi ọma
  rationale: “Ozi ọma” na-enye ihe εὐαγγέλιον pụtara n’Igbo dị ugbu a ma na-edebe njikọ ἐν dịka “n’.”
- source_word: λέγων
  choice: na-asịkwa
  rationale: Nke a na-ejikọta okwu a na akụkọ dị n’amaokwu gara aga, dịka participle Grik ahụ si eme.
theological_decisions:
- issue: Ntụgharị βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  alternative: ọchịchị Chineke
  rationale: “Alaeze” na-edebe obosara okwu Grik ahụ n’etinyeghị ya naanị n’omume ịchị ma ọ bụ naanị n’ebe a na-achị; ala ala peeji na-egosi echiche “ọchịchị” dịkwa n’okwu ahụ.
- issue: Ntụgharị εὐαγγέλιον
  choice: ozi ọma
  alternative: oziọma
  rationale: “Ozi ọma” bụ nkọwa pụtara ìhè nye ndị na-agụ Igbo nke oge a, ebe “oziọma” bụkwa ụdị okwu ụka a na-ahụkarị.
- issue: Ike dị n’iwu μετανοεῖτε καὶ πιστεύετε
  choice: Chegharịanụ ma kwerenụ
  alternative: Na-echegharịanụ ma na-ekwerenụ
  rationale: Ụdị present imperative nwere ike igosi omume na-aga n’ihu, ma iwu dị mfe n’Igbo na-echekwa oku ahụ na ngwa ngwa ya n’etinyeghị nkọwa aspect nke karịrị ihe odide ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Akara ala ala peeji [a] nọ n’akụkụ “alaeze Chineke,” ebe [b] nọ n’akụkụ “ozi ọma,” ka nke ọ bụla kwekọọ n’ezie na nhọrọ okwu ọ na-akọwa.
