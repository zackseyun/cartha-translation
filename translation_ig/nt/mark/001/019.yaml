revisions:
- from: Mgbe ọ gara n’ihu ntakịrị, ọ hụrụ Jems nwa Zebedi na Jọn nwanne ya. Ha nọ n’ụgbọ mmiri na-edozi[a] ụgbụ ha.
  to: Mgbe ọ gawara n’ihu ntakịrị, ọ hụrụ Jemis, nwa Zebedi, na Jọn, nwanne ya, ka ha nọ n’ụgbọ mmiri na-edozi[a] ụgbụ.
  rationale: 'The revision retains the Greek temporal movement and makes the dependent perception sense explicit: Jesus saw the two men while they were in the boat working on the nets. It removes the unexpressed possessive, uses the established Igbo form ''Jemis,'' and preserves the lexical footnote without imposing a single narrower sense for καταρτίζω.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:39Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies Jesus' brief onward movement, James as Zebedee's son, John as James's brother, and the activity of putting fishing nets in order. However, recasting the Greek object-of-perception construction into an independent sentence ('Ha nọ ...') weakens the explicit relation that he saw them while they were working. The explicit possessive in 'ụgbụ ha' is a small addition where Greek has simply 'the nets.'
  naturalness: The wording is generally clear Standard Igbo, but a single perception construction with 'ka ha ...' is both natural and closer to the source. 'Jemis' is the more established Igbo biblical spelling than 'Jems.'
  terminology: 'Use established Igbo biblical name forms: Jemis, Zebedi, and Jọn. ''Ụgbọ mmiri'' and ''ụgbụ'' are suitable. ''Na-edozi'' works in context, while the footnote appropriately preserves the broader range of καταρτίζω.'
  issues:
  - severity: medium
    issue: The perception construction is split into an independent statement.
    rationale: 'καὶ αὐτοὺς ἐν τῷ πλοίῳ καταρτίζοντας depends on ''he saw'': he saw them in the boat mending/preparing the nets. Using ''ọ hụrụ ... ka ha nọ ...'' retains this relation explicitly.'
  - severity: low
    issue: The translation supplies an explicit possessive in 'ụgbụ ha.'
    rationale: τὰ δίκτυα is 'the nets,' without an explicit possessive. Igbo need not add 'ha' here; omitting it is natural and more formally precise.
  - severity: low
    issue: The name spelling 'Jems' is not the usual established Igbo biblical form.
    rationale: '''Jemis'' is the conventional Standard Igbo biblical rendering of James and promotes consistency in names.'
  revised_text: Mgbe ọ gawara n’ihu ntakịrị, ọ hụrụ Jemis, nwa Zebedi, na Jọn, nwanne ya, ka ha nọ n’ụgbọ mmiri na-edozi[a] ụgbụ.
  revised_footnotes:
