  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀προβὰς ὀλίγον εἶδεν Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ αὐτοὺς ἐν τῷ πλοίῳ καταρτίζοντας τὰ δίκτυα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/019.yaml
  text: And going on a little farther[a], he saw James the son of Zebedee and John his brother, and they were in the boat mending the nets,
translation:
  language: ig
  text: Mgbe ọ gawara n’ihu ntakịrị, ọ hụrụ Jemis, nwa Zebedi, na Jọn, nwanne ya, ka ha nọ n’ụgbọ mmiri na-edozi[a] ụgbụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-arụzi” ma ọ bụ “na-akwadebe” ụgbụ. Ngwaa Grik ahụ nwere ike ịpụta ime ka ihe dịrị n’usoro ma ọ bụ iweghachi ya n’ọnọdụ kwesịrị ekwesị.
    reason: lexical_alternative
lexical_decisions:
- source_word: προβὰς ὀλίγον
  choice: Mgbe ọ gara n’ihu ntakịrị
  rationale: Nke a na-egosi na ọ gara n’ihu obere ụzọ tupu ihe sochirinụ emee; ọ bụkwa usoro okwu Igbo doro anya ma bụrụ nke e ji akọ akụkọ.
- source_word: εἶδεν
  choice: ọ hụrụ
  rationale: Nke a bụ ntụgharị nkịtị nke ngwaa ahụ n’akụkọ, n’etinyeghị echiche ọzọ dị ka ‘ọ chọpụtara.’
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Jems nwa Zebedi
  rationale: Nkebi okwu Grik a na-akọwa Jems site n’ịkpọ nna ya; ‘nwa Zebedi’ bụ ụzọ Igbo sitere n’okike si kwuo ya.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: Jọn nwanne ya
  rationale: ‘Ya’ na-ezo aka na Jems n’ụzọ kacha kwekọọ n’usoro ahịrịokwu ahụ.
- source_word: ἐν τῷ πλοίῳ
  choice: n’ụgbọ mmiri
  rationale: Ọ na-ezo aka n’ụgbọ mmiri ahụ ha nọ n’ime ya n’akụkọ a.
- source_word: καταρτίζοντας
  choice: na-edozi
  rationale: ‘Na-edozi’ na-ekpuchi echiche nke ime ka ihe dịrị n’usoro ma ọ bụ iweghachi ya n’ọnọdụ kwesịrị ekwesị, ma kwekọọ n’ọrụ a na-arụ n’ụgbụ.
- source_word: τὰ δίκτυα
  choice: ụgbụ ha
  rationale: ‘Ụgbụ’ bụ okwu Igbo nkịtị maka ụgbụ e ji egbu azụ. E tinyere ‘ha’ ka njikọ ya na ndị nọ n’ụgbọ mmiri doo anya n’Igbo, ọ bụ ezie na Grik ji naanị mkpụrụokwu njirimara.
- source_word: καὶ αὐτούς
  choice: Ha nọ
  rationale: A haziri ihe Grik kwuru dị ka ‘ọ hụrụ ha ka ha…’ ka ọ bụrụ ahịrịokwu Igbo eke, ‘Ha nọ…,’ na-enweghị ịgbanwe onye ọ hụrụ ma ọ bụ ihe ha na-eme.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe nghọta ma nwee ugwu. E kewara ahịrịokwu ahụ ụzọ abụọ ka ọ na-aga nke ọma n’Igbo, ma echekwara usoro ihe mere na njikọ ndị mmadụ nọ n’akụkọ ahụ.
