    text: A pụkwara ịsị, “na-arụzi” ma ọ bụ “na-akwadebe” ụgbụ. Ngwaa Grik ahụ nwere ike ịpụta ime ka ihe dịrị n’usoro ma ọ bụ iweghachi ya n’ọnọdụ kwesịrị ekwesị.
    reason: lexical_alternative
  revision_rationale: 'The revision retains the Greek temporal movement and makes the dependent perception sense explicit: Jesus saw the two men while they were in the boat working on the nets. It removes the unexpressed possessive, uses the established Igbo form ''Jemis,'' and preserves the lexical footnote without imposing a single narrower sense for καταρτίζω.'
