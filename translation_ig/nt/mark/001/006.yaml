    reason: cross_reference
  revision_rationale: The revision explicitly translates ζώνην as “eriri” (belt) while preserving the descriptive, stative portrayal of John’s clothing and his customary diet. The footnote retains the Elijah allusion as an interpretive cross-reference rather than placing it in the main text or presenting it as an explicit identification.
