  text: ⸂καὶ ἦν⸃ ὁ Ἰωάννης ἐνδεδυμένος τρίχας καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, καὶ ἔσθων ἀκρίδας καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/006.yaml
  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: ig
  text: Jọn yi uwe e ji ajị kamel mee, kee eriri akpụkpọ anụ n’úkwù ya[a], ọ na-erikwa igurube na mmanụ aṅụ ọhịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Uwe Jọn na-echetara nkọwa e kwuru banyere Ịlaịja na 2 Ndị Eze 1:8, ma na-atụnye aka n’otú Mak si egosi Jọn dịka onye amụma na-ebute ụzọ.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος τρίχας καμήλου
  choice: yi uwe e ji ajị kamel mee
  rationale: Nke a na-egosi ọnọdụ Jọn dị ka onye yi uwe e ji ajị kamel mee; ọ naghị ekwu na o yi akpụkpọ kamel.
- source_word: ζώνην δερματίνην
  choice: ihe e ji akpụkpọ anụ mee
  rationale: ζώνη bụ ihe a na-eke n’úkwù, δερματίνην na-egosikwa na e ji akpụkpọ anụ mee ya. Nsụgharị a doro ndị na-agụ Igbo nke oge a anya.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: n’úkwù ya
  rationale: ὀσφύς na-ezo aka n’ebe úkwù dị; okwu a bụ nke ebumpụta ụwa ma doo anya n’Igbo.
- source_word: ἔσθων
  choice: ọ na-erikwa
  rationale: Participul nke oge ugbu a na-akọ omume Jọn na-emekarị ma ọ bụ nke na-aga n’ihu n’ime nkọwa a.
- source_word: ἀκρίδας
  choice: igurube
  rationale: 'Nke a bụ ihe okwu Grik ahụ na-apụtakarị: ahụhụ a na-akpọ igurube.'
- source_word: μέλι ἄγριον
  choice: mmanụ aṅụ ọhịa
  rationale: Nke a na-egosi mmanụ aṅụ sitere n’ọhịa, ma bụrụkwa ụzọ doro anya e si kwuo ya n’Igbo.
- source_word: καὶ ἦν
  choice: Jọn yi
  rationale: E tinyghị okwu dịka ‘Ugbu a’ n’isi ahịrịokwu, n’ihi na isi mmalite enweghị okwu oge pụtara ‘ugbu a’; njikọ καί na-aga n’ihu n’akụkọ ahụ.
theological_decisions:
- issue: Uwe na nri Jọn n’ihe gbasara onyinyo onye amụma Ịlaịja
  choice: Kọwaa uwe na nri Jọn naanị, ma ghara ịkpọ ya Ịlaịja n’ahịrịokwu bụ isi.
  alternative: Ime ka njikọ ahụ pụta ìhè n’ahịrịokwu bụ isi.
  rationale: Okwu ndị a na-echetara nkọwa Ịlaịja na 2 Ndị Eze 1:8, ma Mak 1:6 ekwughị kpọmkwem na Jọn bụ Ịlaịja. Ya mere, a hapụrụ njikọ ahụ n’ihe odide ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. A họọrọ ‘ihe e ji akpụkpọ anụ mee’ kama okwu mgbazinye maka belt, ka ihe ahụ doo ndị nkịtị anya. Akara [a] dị n’ahịrịokwu bụ isi ma kwekọọ n’ihe odide ala peeji.
