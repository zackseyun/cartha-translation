  verdict: revise
  source_fidelity: The draft accurately represents the unclean spirit as the agent that violently convulses the man, cries out loudly, and exits him. “Mere ka ahụ ya maa jijiji n’ike” conveys the force of σπαράξαν, but its possessive pronoun can momentarily be read as referring to the spirit’s own body rather than the afflicted man.
  naturalness: The sentence is fluent Standard Igbo. Replacing “ahụ ya” with “nwoke ahụ” makes the referent explicit and is especially appropriate because the immediately preceding context identifies the afflicted person as a man.
  terminology: “Mmụọ ahụ na-adịghị ọcha” is a suitable, established rendering of τὸ πνεῦμα τὸ ἀκάθαρτον. “Tie mkpu n’oké olu” naturally conveys crying out with a loud voice. No doctrinal expansion is introduced.
