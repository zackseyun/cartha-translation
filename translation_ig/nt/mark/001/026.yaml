  text: καὶ σπαράξαν αὐτὸν τὸ πνεῦμα τὸ ἀκάθαρτον καὶ ⸀φωνῆσαν φωνῇ μεγάλῃ ἐξῆλθεν ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: ig
  text: Mmụọ ahụ na-adịghị ọcha mere ka nwoke ahụ maa jijiji n’ike, tie mkpu n’oké olu, wee si n’ime ya pụta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπαράξαν
  choice: mere ka ahụ ya maa jijiji n’ike
  rationale: Nke a na-egosi na mmụọ ahụ mere ka nwoke ahụ maa jijiji nke ukwuu, ma zere okwu nwere ike ịpụta na ọ dọwara anụ ahụ ya.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: Mmụọ ahụ na-adịghị ọcha
  rationale: Nke a bụ okwu Igbo doro anya nke na-echekwa echiche nke adịghị ọcha ma na-egosikwa mmụọ ahụ dịka onye na-eme ihe n’akụkọ ahụ.
- source_word: φωνῆσαν φωνῇ μεγάλῃ
  choice: tie mkpu n’oké olu
  rationale: Ọ na-egosipụta iti mkpu siri ike ma na-echekwa nkọwa gbasara ịdị ukwuu nke olu ahụ n’ụzọ Igbo na-ada nke ọma.
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: wee si n’ime ya pụta
  rationale: Nke a na-echekwa echiche doro anya na mmụọ ahụ hapụrụ nwoke ahụ site n’ime ya.
- source_word: καὶ ... καὶ
  choice: '..., ..., wee ...'
  rationale: Usoro ngwaa Igbo a na-ejikọta omume ndị ahụ nke ọma ma na-egosi na ịpụ bụ omume ikpeazụ n’usoro ahụ.
theological_decisions:
- issue: Ụdị onye ihe a na-akpọ mmụọ na-adịghị ọcha bụ
  choice: E gosiri ya dịka mmụọ nwere ike ime ihe n’onwe ya
  alternative: Ike ọjọọ na-abụghị onye
  rationale: N’amaokwu Grik ahụ, mmụọ ahụ bụ isiokwu nke mere ka nwoke ahụ maa jijiji, tie mkpu, ma pụta. Nsụgharị ahụ na-echekwa ọrụ ya dịka onye na-eme ihe n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro ngwaa “mere ka…, tie…, wee…” na-eme ka otu isiokwu—mmụọ ahụ—nọgide na-achị omume niile, dịka ọ dị n’asụsụ Grik.
