    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported possessive attached to “boat,” improves the idiomatic expression for hired workers, and adjusts the footnote so that it preserves the Greek phrase’s spatial and discipleship-related possibilities without making the beginning of discipleship explicit.
