review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus' immediate call, the brothers' leaving of their father Zebedee with hired workers in the boat, and their going after him. However, “ụgbọ mmiri ya” adds a possessive (“his boat”) that is absent from the Greek; the text only says “in the boat.”
  naturalness: “Ndị ọrụ e goro ego” is understandable but less idiomatic than “ndị ọrụ a goro akwụ ụgwọ.” The revised wording is natural Standard Igbo while retaining the narrative sequence and concise register.
  terminology: “Ozugbo ahụ,” “kpọrọ ha,” “nna ha, bụ Zebedi,” and “soro ya gawa” are suitable. The note should offer “iso ya” as the lexical alternative rather than “malite iso ya,” since the Greek phrase can imply discipleship in context but does not explicitly state its beginning.
  issues:
  - severity: medium
    issue: Added possessive in “ụgbọ mmiri ya”
    rationale: The Greek τῷ πλοίῳ means “the boat,” not “his boat.” Adding the possessive introduces information not supplied by the source.
  - severity: low
    issue: Footnote alternative overstates inception
    rationale: “Malite iso ya” (“begin to follow him”) makes explicit an inception that is interpretively plausible but not lexically stated by ὀπίσω αὐτοῦ.
  - severity: low
    issue: Less natural hired-worker expression
    rationale: “Ndị ọrụ a goro akwụ ụgwọ” is more idiomatic Standard Igbo for workers hired for pay.
  revised_text: Ozugbo ahụ, ọ kpọrọ ha. Ha wee hapụ nna ha, bụ Zebedi, n’ụgbọ mmiri ahụ, ya na ndị ọrụ a goro akwụ ụgwọ, soro ya gawa[a].
