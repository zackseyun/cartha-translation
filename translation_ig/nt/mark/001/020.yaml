  text: καὶ ⸀εὐθὺς ἐκάλεσεν αὐτούς. καὶ ἀφέντες τὸν πατέρα αὐτῶν Ζεβεδαῖον ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν ἀπῆλθον ὀπίσω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: ig
  text: Ozugbo ahụ, ọ kpọrọ ha. Ha wee hapụ nna ha, bụ Zebedi, n’ụgbọ mmiri ahụ, ya na ndị ọrụ a goro akwụ ụgwọ, soro ya gawa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “gawa n’azụ ya” ma ọ bụ “iso ya.” Okwu Grik ahụ nwere ike igosi ma ịga n’azụ mmadụ n’ezie ma iso ya dịka onye na-eso ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Ozugbo ahụ
  rationale: Ọ na-echekwa echiche nke ihe mere n’egbughị oge, bụ́ otu n’ime ụzọ Mak si eme ka akụkọ ya na-aga ngwa ngwa.
- source_word: ἐκάλεσεν
  choice: ọ kpọrọ ha
  rationale: “Kpọrọ” bụ ntụgharị kwụ ọtọ ma dịkwa eke nke καλέω; ọ naghị agbakwụnye echiche nke ịmanye ha ma ọ bụ nanị ịrịọ ha arịrịọ.
- source_word: ἀφέντες
  choice: Ha wee hapụ
  rationale: Nke a na-egosi omume ha mere tupu ha esoro Jizọs gawa, na-etinyeghị echiche siri ike nke ịgbahapụ mmadụ kpamkpam.
- source_word: πατέρα αὐτῶν Ζεβεδαῖον
  choice: nna ha, bụ Zebedi
  rationale: Ọ na-egosi nke ọma na Zebedi bụ nna ha, n’ụzọ Igbo dị mfe ma doo anya.
- source_word: πλοίῳ
  choice: ụgbọ mmiri
  rationale: Nke a bụ okwu Igbo a na-ejikarị maka ụgbọ e ji akụ azụ n’ọnọdụ a.
- source_word: μισθωτῶν
  choice: ndị ọrụ e goro ego
  rationale: Ọ na-egosi ndị na-arụ ọrụ maka ụgwọ, na-enweghị ịkọwa ihe odide ahụ na-ekwughị banyere ogologo oge ọrụ ha ma ọ bụ ụdị nkwekọrịta ha.
- source_word: ἀπῆλθον ὀπίσω αὐτοῦ
  choice: soro ya gawa
  rationale: Nkebiokwu a bụ Igbo eke nke na-egosi ma ịpụ n’ebe ahụ soro ya gaa, ma na-ekwekwa ka echiche nke ịmalite iso ya dịrị n’ime okwu ahụ.
theological_decisions:
- issue: Echiche ịbụ onye na-eso ụzọ dị na ὀπίσω αὐτοῦ
  choice: soro ya gawa
  alternative: gawa n’azụ ya; malite iso ya dịka ndị na-eso ụzọ
  rationale: “Soro ya gawa” na-echekwa ma mmegharị ahụ n’akụkọ ahụ ma mmalite nke iso Jizọs, na-enweghị ime ka naanị otu n’ime echiche abụọ ahụ bụrụ ihe odide ahụ kwuru kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu abụọ ahụ na-agbaso usoro akụkọ Grik, ebe “wee” na-ejikọta ihe ndị mere n’usoro eke n’Igbo.
