source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ ἡ ἀκοὴ αὐτοῦ εὐθὺς ⸀πανταχοῦ εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: ig
  text: Akụkọ banyere ya[a] gbasara ozugbo n'ebe niile n’ógbè dum gbara Galili gburugburu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “akụkọ a nụrụ banyere ya,” ma ọ bụ, “aha ya ma ama.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n'ebe niile n’ime ógbè dum gbara Galili gburugburu.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: gbasara
  rationale: N’okwu gbasara akụkọ, “gbasara” na-egosi na akụkọ ahụ si n’otu ebe ruo ebe ndị ọzọ. Ọ bụ okwu Igbo dị ndụ ma doo anya, ọ bụ ezie na “pụtara” ga-esochikwu ihe oyiyi okwu Grik ahụ n’ụzọ nkịtị.
- source_word: ἀκοὴ
  choice: akụkọ
  rationale: N’ebe a, ἀκοή pụtara ihe ndị mmadụ nụrụ banyere Jizọs—akụkọ ma ọ bụ akụkọ a na-akọ—ọ bụghị naanị ịnụ ihe ma ọ bụ ịbụ onye a ma ama.
- source_word: αὐτοῦ
  choice: banyere ya
  rationale: Njikọ a na-egosi ihe akụkọ ahụ metụtara, ya bụ, akụkọ banyere ya, kama igosi na akụkọ ahụ bụ ihe o nwere.
- source_word: εὐθὺς
  choice: Ozugbo ahụ
  rationale: Nke a na-egosi ọsọ na enweghị oge furu efu, dịka ojiji εὐθύς nke Mak si dị.
- source_word: πανταχοῦ
  choice: ebe niile
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ isi kwuo “everywhere,” na-emesi obosara mgbasa akụkọ ahụ ike.
- source_word: περίχωρον
  choice: ógbè ... gbara ... gburugburu
  rationale: Nhọrọ a na-egosi mpaghara ma ọ bụ ala gbara otu ebe gburugburu n’enweghị itinye echiche na ọ bụ naanị ime obodo.
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: n’ógbè niile gbara Galili gburugburu
  rationale: Nke a na-ewepụta oke mpaghara ahụ dum n’Igbo dị mfe. Ọ na-ahapụ njikọ Galili na mpaghara gbara ya gburugburu dịka okwu Grik si kwuo, n’enweghị ịkọwa ya karịa ihe ederede kwuru.
theological_decisions:
- issue: Ihe ἀκοὴ αὐτοῦ na-ezo aka na ya
  choice: akụkọ banyere ya
  alternative: aha ya ma ama; akụkọ a kọrọ banyere ya
  rationale: Ihe a na-ekwu bụ mgbasa nke ihe ndị mmadụ nụrụ banyere Jizọs. “Akụkọ banyere ya” anaghị etinye echiche siri ike banyere ịbụ onye a ma ama nke mkpụrụokwu ahụ n’onwe ya na-achọghị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ debere ike nke “ozugbo” na obosara nke “ebe niile” na “ógbè niile,” ma zere ntụgharị siri ike nke ga-ada ka okwu mba ọzọ.
