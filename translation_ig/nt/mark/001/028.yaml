    text: Ma ọ bụ, “akụkọ a nụrụ banyere ya,” ma ọ bụ, “aha ya ma ama.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n'ebe niile n’ime ógbè dum gbara Galili gburugburu.”
    reason: previous_rendering
  revision_rationale: The revision preserves the immediacy, the circulating report about Jesus, and the double geographic emphasis of πανταχοῦ plus ὅλην. It corrects the number of the geographic noun from plural to singular and updates the related footnote without adding interpretation.
