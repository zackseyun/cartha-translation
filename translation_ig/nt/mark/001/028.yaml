- from: Ozugbo ahụ, akụkọ banyere ya[a] gbasara ebe niile n’ógbè niile gbara Galili gburugburu[b].
  to: Akụkọ banyere ya[a] gbasara ozugbo n'ebe niile n’ógbè dum gbara Galili gburugburu[b].
  rationale: The revision preserves the immediacy, the circulating report about Jesus, and the double geographic emphasis of πανταχοῦ plus ὅλην. It corrects the number of the geographic noun from plural to singular and updates the related footnote without adding interpretation.
