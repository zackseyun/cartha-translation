revisions:
- from: Ma mgbe ọ pụrụ, ọ malitere ikwusa ya ebe niile na ịgbasa okwu ahụ, nke mere na Jizọs enwekwaghị ike ịbanye n’obodo n’ihu ọha. Kama, ọ nọ n’èzí n’ebe ndị mmadụ na-adịghị; ndị mmadụ sikwa n’akụkụ niile na-abịakwute ya.
  to: Ma mgbe o si ebe ahụ pụọ, ọ malitere ikwusa nke ukwuu na ịgbasa okwu ahụ, nke mere na Jizọs enwekwaghị ike ịbanye n’obodo n’ihu ọha. Kama, ọ nọ n’èzí, n’ebe tọgbọrọ chakoo; ndị mmadụ na-esikwa n’ebe niile abịakwute ya.
  rationale: 'The revision preserves the source’s sequence and ambiguity: the healed man goes out, proclaims extensively, and spreads the message; as a result Jesus remains outside in deserted places while people continue coming from everywhere. It removes the added object after «ikwusa», renders the extent and origin expressions more closely, and uses natural Standard Igbo.'
  reviewer_model: gpt-5.6-terra
