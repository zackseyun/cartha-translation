id: MRK.1.45
reference: Mark 1:45
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: ig
  text: Ma mgbe o si ebe ahụ pụọ, ọ malitere ikwusa nke ukwuu na ịgbasa okwu ahụ, nke mere na Jizọs enwekwaghị ike ịbanye n’obodo n’ihu ọha. Kama, ọ nọ n’èzí, n’ebe tọgbọrọ chakoo; ndị mmadụ na-esikwa n’ebe niile abịakwute ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσειν πολλὰ
  choice: ikwusa ya ebe niile
  rationale: Akpaalaokwu Grik a pụtara ikwusa nke ukwuu ma ọ bụ n’ebe sara mbara; nsụgharị a na-egosipụta mgbasawanye nke nkwusa ahụ n’Igbo dị mfe.
- source_word: διαφημίζειν τὸν λόγον
  choice: ịgbasa okwu ahụ
  rationale: “Okwu ahụ” na-edobe λόγος n’enweghị ịkọwapụta ya karịa ka ederede si mee, ebe “ịgbasa” na-egosipụta ime ka akụkọ ahụ bụrụ ihe a maara ebe niile.
- source_word: φανερῶς
  choice: n’ihu ọha
  rationale: Ọ pụtara n’ụzọ pụtara ìhè ma ọ bụ n’enweghị izobe onwe ya; “n’ihu ọha” bụ okwu Igbo kwụ ọtọ n’ọnọdụ a.
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: n’ebe ndị mmadụ na-adịghị
  rationale: ἐρήμοις na-akọwa ebe tọgbọrọ chakoo ma ọ bụ ebe ndị mmadụ na-ebighị; nke a na-ezere echiche na ọ bụ naanị otu ọzara kpọrọ nkụ.
- source_word: πάντοθεν
  choice: n’akụkụ niile
  rationale: Na-egosipụta na ha si ebe niile na-abịa.
theological_decisions:
- issue: Onye nnọchiaha αὐτόν na nkebi gbasara ịbanye n’obodo
  choice: Jizọs
  alternative: ya
  rationale: Ọ bụ ezie na Grik ji nnọchiaha, ịkpọ Jizọs aha na-egbochi mgbagwoju anya n’Igbo n’ihi na nwoke ahụ a gwọrọ bụ isiokwu nke nkebi bu ụzọ.
- issue: Ihe “okwu ahụ” na-ezo aka na ya
  choice: Edebere ya dịka “okwu ahụ”
  alternative: akụkọ banyere ọgwụgwọ ahụ
  rationale: Ederede Grik akọwaghị kpọmkwem ọdịnaya λόγος; idebe okwu sara mbara na-echekwa ambiguiti ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ebe ndị mmadụ na-adịghị” kama okwu nwere ike ime ka onye na-agụ ya chee naanị banyere ọzara kpọrọ nkụ.
