id: MRK.1.22
reference: Mark 1:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: ig
  text: O juru ha anya n’ozizi ya, n’ihi na ọ nọ na-akụziri ha dịka onye nwere ikike, ọ bụghịkwa dịka ndị odeakwụkwọ iwu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: O juru ha anya
  rationale: Nke a na-egosi oke ihe ijuanya ha nwere; n’akụkọ Igbo, ọ bụ ụzọ ebumpụta ụwa isi kwupụta mmeghachi omume ahụ na-aga n’ihu n’oge ozizi ahụ.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: n’ozizi ya
  rationale: “Ozizi” na-ekpuchi ihe ọ kụziri na ụzọ o si kụzie, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: ἦν γὰρ διδάσκων
  choice: n’ihi na ọ nọ na-akụziri ha
  rationale: “Ọ nọ na-akụziri” na-echekwa ọdịdị omume na-aga n’ihu nke ἦν tinyere participle.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: dịka onye nwere ikike
  rationale: Nke a na-echekwa ntụnyere ὡς na echiche ἐξουσία dị ka ikike ziri ezi mmadụ nwere, kama ịgbanwe ya naanị ka ọ bụrụ nkọwa banyere ụdị olu o ji kwuo okwu.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ iwu
  rationale: N’okwu a, okwu ahụ na-ezo aka n’ọkachamara ndị Juu n’Iwu; “ndị odeakwụkwọ iwu” na-eme ka ọrụ ha doo onye Igbo nke oge a anya karịa “ndị odeakwụkwọ” naanị.
theological_decisions:
- issue: Ụdị ikike Jizọs nwere ma e jiri ya tụnyere nke ndị odeakwụkwọ iwu
  choice: A kọwara ya naanị dịka onye nwere ikike.
  alternative: “Dịka onye nwere ikike Chineke” ma ọ bụ “jiri ikike Chineke na-akụzi.”
  rationale: Amaokwu ahụ na-egosi ọdịiche dị n’etiti ụzọ Jizọs si akụzi na nke ndị odeakwụkwọ iwu, ma ọ kọwaghị ebe ikike ahụ si bịa ma ọ bụ ọdịdị ya. Ya mere, e tinyeghị nkọwa nkà mmụta okpukpe nke ihe odide ahụ ekwughị kpọmkwem.
translation_notes:
  register: Standard Igbo dị ugbu a, nke kwanyere ugwu ma dị mfe nghọta. Ejiri “ndị odeakwụkwọ iwu” mee ka ihe γραμματεῖς pụtara n’ọnọdụ ndị Juu doo anya n’enweghị ogologo nkọwa. Enweghị ihe odide ala peeji n’ihi na ntụgharị “dịka onye nwere ikike” na-echekwa usoro na nghọta Grik nke ọma.
