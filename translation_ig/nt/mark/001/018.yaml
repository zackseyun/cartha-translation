revisions:
- from: Ozugbo ahụkwa, ha hapụrụ ụgbụ ndị ahụ soro ya.[a]
  to: Ozugbo ahụ, ha hapụrụ ụgbụ ndị ahụ wee soro ya.[a]
  rationale: The revision removes the unwarranted additive force of -kwa and uses the natural coordinating particle wee to connect “left” and “followed.” It retains the promptness of εὐθύς, the definite but non-possessive sense of τὰ δίκτυα, and the unexpanded sense of following Jesus.
  reviewer_model: gpt-5.6-terra
