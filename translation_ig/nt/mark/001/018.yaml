  text: καὶ ⸀εὐθὺς ἀφέντες τὰ ⸀δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/018.yaml
  text: And immediately they left the nets and followed him[a].
translation:
  language: ig
  text: Ozugbo ahụ, ha hapụrụ ụgbụ ndị ahụ wee soro ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'otu ntabi anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -kwa
  rationale: E ji mgbakwunye “-kwa” jikọta amaokwu a na akụkọ bu ya ụzọ, n’ụzọ kwekọrọ na njikọ dị mfe nke καὶ na usoro akụkọ Mak.
- source_word: εὐθὺς
  choice: ozugbo ahụ
  rationale: Nke a na-egosi ngwa ngwa na ịdị ọkụ nke ihe ahụ, ma bụrụkwa okwu Igbo nke oge a na-aghọta nke ọma.
- source_word: ἀφέντες
  choice: hapụrụ
  rationale: Ọ bụ omume mere tupu omume bụ isi; n’Igbo, ijikọ ngwaa abụọ n’usoro—“ha hapụrụ ... soro”—na-ada nke ọma ma ghara ime ka okwu ahụ sie ike karịa ka o si dị.
- source_word: τὰ δίκτυα
  choice: ụgbụ ndị ahụ
  rationale: A na-edobe article Grik site na “ndị ahụ”; e tinyeghị “ụgbụ ha” n’ihi na onye nwe ha apụtaghị kpọmkwem n’okwu Grik.
- source_word: ἠκολούθησαν
  choice: soro
  rationale: “Soro” na-echekwa ma echiche iso mmadụ n'ụzọ nkịtị ma echiche na-amalite ịpụta banyere ịbụ ndị na-eso ụzọ, n’etinyeghị nkọwa ọzọ.
- source_word: αὐτῷ
  choice: ya
  rationale: A na-edobe nnọchiaha dị na Grik kama iji aha “Jizọs” dochie ya.
theological_decisions:
- issue: Echiche ịbụ onye na-eso ụzọ dị na ἠκολούθησαν
  choice: soro ya
  alternative: ghọrọ ndị na-eso ụzọ ya
  rationale: “Soro ya” na-edobe mfe okwu ahụ na ma ihe omume nkịtị ma ihe ọ pụtara n’ihe gbasara ịbụ ndị na-eso ụzọ; “ghọrọ ndị na-eso ụzọ ya” ga-akọwa karịa ihe isi mmalite kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ngwaa “ha hapụrụ ... soro ya” ka ọ bụrụ asụsụ Igbo eke, ebe a na-echekwa ọsọ akụkọ Mak na nghọta abụọ nke iso Jizọs.
