  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ πρωῒ ἔννυχα λίαν ἀναστὰς ἐξῆλθεν καὶ ἀπῆλθεν εἰς ἔρημον τόπον κἀκεῖ προσηύχετο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: ig
  text: N’isi ụtụtụ nnọọ, mgbe ọchịchịrị ka dị, o biliri, wee pụọ, wee gaa n’ebe tọgbọrọ n’efu[a]; n’ebe ahụ ka ọ nọ na-ekpe ekpere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “n’ebe mmadụ na-ebighị,” “n’ebe mmadụ na-anọghị,” ma ọ bụ “n’ebe yiri ọzara.” Okwu Grik ahụ nwere ike ịkọwa ebe tọgbọrọ n’efu, ebe mmadụ na-ebighị, ma ọ bụ ebe yiri ọzara.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωῒ ... λίαν
  choice: N’isi ụtụtụ nnọọ
  rationale: Ngwakọta okwu a na-egosi na ọ bụ n’isi ụtụtụ nke ukwuu; “nnọọ” na-echekwa nkwusi ike dị na λίαν n’Igbo dị mma.
- source_word: ἔννυχα
  choice: mgbe ọchịchịrị ka dị
  rationale: Nke a na-egosi na abalị akwụsịbeghị kpamkpam. Nsụgharị a doro onye Igbo nke oge a anya ma ghara ime ka okwu ahụ bụrụ nanị “tupu chi abọọ.”
- source_word: ἀναστὰς
  choice: o biliri
  rationale: Ọ na-egosi omume mere tupu ngwaa ndị sochirinụ ma na-edobe usoro akụkọ ahụ n’Igbo ebumpụta ụwa.
- source_word: ἐξῆλθεν
  choice: pụọ
  rationale: Ọ na-echekwa echiche nke isi n’ebe ọ nọ pụta.
- source_word: ἀπῆλθεν
  choice: gawa
  rationale: 'E kewapụrụ ya na “pụọ” iji chekwaa nzọụkwụ abụọ dị n’akụkọ Grik: ọ pụtara, wee gawa ebe ọzọ.'
- source_word: εἰς ἔρημον τόπον
  choice: n’ebe tọgbọrọ n’efu
  rationale: Okwu a na-egosi ebe mmadụ na-ebighị ma ọ bụ ebe gbahapụrụ agbahapụ, n’ebughị ụzọ kpebie na ọ bụ ọzara n’ụdị ala kpọmkwem.
- source_word: κἀκεῖ
  choice: ọ nọkwa ebe ahụ
  rationale: “Ebe ahụ” na-echekwa ntụaka kpọmkwem n’ebe ọ gara, ebe “-kwa” na-ejikọta akụkụ akụkọ ahụ.
- source_word: προσηύχετο
  choice: na-ekpe ekpere
  rationale: Ụdị okwu a na-egosi omume na-aga n’ihu n’oge gara aga; “ọ nọ ... na-ekpe ekpere” na-echekwa akụkụ ahụ nke ọma.
theological_decisions:
- issue: Nkwusi ike akụkọ ahụ banyere ekpere Jizọs
  choice: Ịkọwa nanị na Jizọs gawara ebe mmadụ na-anọghị ma nọ na-ekpe ekpere
  alternative: Ịtinye na nsụgharị ahụ na omume a bụ ụkpụrụ ndị na-eso ụzọ ga-agbaso, ma ọ bụ ịkọwa ihe ọ pụtara banyere onye Jizọs bụ
  rationale: Amaokwu Grik ahụ na-akọ ihe Jizọs mere, ma ọ naghị ekwupụta nkọwa ozizi ndị ahụ kpọmkwem. Ya mere, nsụgharị ahụ anaghị atụkwasị nkọwa okpukpe n’ihe e dere.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, dee ya. “Pụọ, gawa” na-echekwa ngwaa ngagharị abụọ nke Grik n’enweghị asụsụ siri ike. E debere akara nkọwa ala peeji [a] n’akụkụ “ebe tọgbọrọ n’efu,” bụ okwu nkọwa ahụ metụtara.
