  text: Ὀψίας δὲ γενομένης, ὅτε ⸀ἔδυ ὁ ἥλιος, ἔφερον πρὸς αὐτὸν πάντας τοὺς κακῶς ἔχοντας καὶ τοὺς δαιμονιζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: ig
  text: Mgbe o ruru mgbede, mgbe anyanwụ dara, ha nọ na-ewetara ya ndị niile na-arịa ọrịa na ndị mmụọ ọjọọ ji.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Mgbe chi jiri
  rationale: Nkebiokwu a bụ genitive absolute nke na-egosi mgbanwe oge. “Mgbe chi jiri” bụ Igbo nkịtị ma dịkwa n’usoro, na-egosi na mgbede eruola.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: mgbe anyanwụ dara
  rationale: ὅτε na-egosi oge ihe mere, ἔδυ na-ekwukwa banyere ọdịda anyanwụ. Nsụgharị a na-edobe nkwughachi oge dị n’asụsụ Grik n’enweghị ịgbakwụnye nkọwa na ọ bụ ‘mgbe e mesịrị.’
- source_word: ἔφερον
  choice: ndị mmadụ nọ na-akpọtara
  rationale: Imperfect ἔφερον na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro. “Nọ na-akpọtara” na-echekwa akụkụ a; “ndị mmadụ” na-eme ka isiokwu a na-akọwaghị kpọmkwem doo anya n’Igbo.
- source_word: πρὸς αὐτὸν
  choice: ya
  rationale: πρός ya na accusative na-egosi iwetara mmadụ ihe. N’Igbo, ngwaa “kpọtara ya” na-eburu echiche ‘brought to him’ n’ụzọ eke.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: ndị niile na-arịa ọrịa
  rationale: Akpaalaokwu ahụ pụtara ndị ahụ na-adịghị ike ma ọ bụ na-arịa ọrịa; “ndị niile na-arịa ọrịa” bụ nke doro anya ma na-echekwa ike nke πάντας.
- source_word: τοὺς δαιμονιζομένους
  choice: ndị mmụọ ọjọọ ji
  rationale: Nke a bụ okwu Igbo doro anya maka ndị nọ n’okpuru ike mmụọ ọjọọ. Ọ naghị ewepụ eziokwu banyere ọrụ ndị mmụọ ọjọọ, ma ọ naghịkwa akọwa usoro njide ahụ karịa ihe Grik kwuru.
theological_decisions:
- issue: Otu e si asụgharị δαιμονιζομένους n’enweghị iwepụ ma ọ bụ ịgbakwụnye ihe okwu Grik kwuru
  choice: ndị mmụọ ọjọọ ji
  alternative: ndị mmụọ ọjọọ na-emegbu
  rationale: “Ndị mmụọ ọjọọ ji” na-echekwa echiche nke ndị nọ n’okpuru ike mmụọ ọjọọ. Nhọrọ ọzọ nwere ike ime ka ike okwu ahụ dị nro karịa ka participle Grik si kwuo.
- issue: Akụkụ omume nke imperfect ἔφερον
  choice: ndị mmadụ nọ na-akpọtara
  alternative: ndị mmadụ kpọtaara
  rationale: “Nọ na-akpọtara” na-egosi na ịkpọta ndị ahụ bụ ihe na-aga n’ihu, dịka imperfect Grik si egosi, ebe simple past nwere ike ime ka ọ dị ka otu ihe mere ozugbo.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere ahịrịokwu oge abụọ nke Grik (“mgbe chi jiri, mgbe anyanwụ dara”) iji chekwaa nhazi na nkwughachi nke isi mmalite.
