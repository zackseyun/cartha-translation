- from: Mgbe chi jiri, mgbe anyanwụ dara, ndị mmadụ nọ na-akpọtara ya ndị niile na-arịa ọrịa na ndị mmụọ ọjọọ ji.
  to: Mgbe o ruru mgbede, mgbe anyanwụ dara, ha nọ na-ewetara ya ndị niile na-arịa ọrịa na ndị mmụọ ọjọọ ji.
  rationale: The revision preserves the Greek temporal repetition and imperfect narrative aspect while using more direct, modern Standard Igbo. It avoids adding an explicit subject not stated in the source and retains the established wording for demonic affliction without theological over-specification.
