id: MRK.1.10
reference: Mark 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀναβαίνων ⸀ἐκ τοῦ ὕδατος εἶδεν σχιζομένους τοὺς οὐρανοὺς καὶ τὸ πνεῦμα ⸀ὡς περιστερὰν καταβαῖνον ⸀εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: ig
  text: Ozugbo ahụ, ka ọ na-esi n'ime mmiri ahụ arịpụta, ọ hụrụ ka eluigwe na-adọwa[a], hụkwa Mmụọ ahụ, dị ka nduru, ka ọ na-agbadata bịakwasị ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “eluigwe ka ọ na-ekewa abụọ.” Ngwaa Grik a siri ike karịa nanị “imeghe.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “banye n'ime ya.” Okwu Grik εἰς nwere ike ịpụta “banye n'ime,” ma n'ebe a, “bịakwasị ya” dabara nke ọma n'okwu banyere mgbadata Mmụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Ozugbo ahụ
  rationale: Nke a na-egosipụta ọsọ na ịdị ngwa nke akụkọ Mak n'ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: ka ọ na-esi na mmiri ahụ arịpụta
  rationale: “Ka ọ na-” na-egosi na omume a na ihe ọ hụrụ mere n'otu oge; “si na mmiri ... arịpụta” na-edokwa ike nke ἐκ, ya bụ isi n'ime mmiri pụta.
- source_word: εἶδεν
  choice: ọ hụrụ
  rationale: Nke a bụ ntụgharị kwụ ọtọ nke ngwaa nghọta ahụ, na-enweghị itinye ihe ọzọ na-adịghị n'isi mmalite.
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: eluigwe ka ọ na-adọwa emeghe
  rationale: “Dọwa emeghe” siri ike karịa naanị “meghee,” ma na-echekwa ihe oyiyi dị egwu nke σχίζω.
- source_word: τοὺς οὐρανούς
  choice: eluigwe
  rationale: N'Igbo, “eluigwe” bụ aha mkpokọta e ji akọwa heavens ma na-echekwa ụda Akwụkwọ Nsọ karịa “mbara igwe.”
- source_word: τὸ πνεῦμα
  choice: Mmụọ ahụ
  rationale: Akara ukwu na-egosi na ọ bụ Mmụọ Chineke ka a na-ekwu maka ya, ma etinyeghị “Nsọ” n'ihi na okwu Grik ahụ ekwughị ya kpọmkwem.
- source_word: ὡς περιστερὰν
  choice: dị ka nduru
  rationale: Nke a na-echekwa ntụnyere ahụ n'ekwughị ma ọ bụ ọdịdị, ụzọ o si agbadata, ma ọ bụ ha abụọ ka a na-atụnyere.
- source_word: καταβαῖνον
  choice: ka ọ na-agbadata
  rationale: Nke a na-egosipụta omume na-aga n'ihu n'oge Jizọs hụrụ ya ma kwekọọ n'ụzọ e si akọ akụkọ n'Igbo.
- source_word: εἰς αὐτόν
  choice: bịakwasị ya
  rationale: N'ọnọdụ a, “bịakwasị ya” bụ Igbo ebumpụta ụwa maka Mmụọ nke na-agbadata n'ahụ mmadụ, ebe ndetu ala peeji na-echekwa ohere nke “banye n'ime ya.”
theological_decisions:
- issue: Onye “Mmụọ ahụ” na-ezo aka na ya
  choice: Mmụọ Chineke, nke a sụgharịrị “Mmụọ ahụ”
  alternative: “Mmụọ Nsọ”
  rationale: Ọnọdụ baptizim a na-egosi na ọ bụ Mmụọ Chineke, ma isi okwu Grik kwuru τὸ πνεῦμα, ọ bụghị “Mmụọ Nsọ”; ya mere, a naghị agbakwunye nkọwa ahụ n'ahịrịokwu.
- issue: Ihe ntụnyere nduru pụtara kpọmkwem
  choice: E debere ya dị ka “dị ka nduru” n'akatọghị ma ọ bụ ọdịdị ya ma ọ bụ ụzọ o si agbadata
  alternative: “Mmụọ ahụ gbanwere bụrụ nduru” ma ọ bụ “Mmụọ ahụ gbadatara n'ụzọ nduru si efe”
  rationale: ὡς περιστερὰν na-egosi ntụnyere, ma ọ kọwaghị akụkụ ntụnyere ahụ; ntụgharị a na-echekwa nghọtahie ziri ezi dị n'isi mmalite.
- issue: Ntụziaka nke εἰς αὐτόν
  choice: “bịakwasị ya” n'ahịrịokwu, ebe e tinyere “banye n'ime ya” na ndetu
  alternative: “banye n'ime ya”
  rationale: εἰς nwere ike ịpụta “banye n'ime,” ma n'okwu banyere mgbadata Mmụọ, “bịakwasị ya” dabara n'okwu Igbo ma ghara ikwu karịa ihe ọnọdụ ahụ na-akwado.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Eluigwe” na “Mmụọ ahụ” na-echekwa ụda Akwụkwọ Nsọ, ebe “dọwa emeghe” na-ebupụta ike na ihe oyiyi nke okwu Grik. E debere akara ndetu [a] na [b] n'akụkụ okwu ndị ndetu ha na-akọwa.
