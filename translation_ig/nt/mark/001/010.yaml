- from: Ozugbo ahụ, ka ọ na-esi na mmiri ahụ arịpụta, ọ hụrụ eluigwe ka ọ na-adọwa emeghe[a], hụkwa Mmụọ ahụ ka ọ na-agbadata dị ka nduru bịakwasị ya[b].
