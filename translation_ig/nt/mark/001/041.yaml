  rationale: The revision makes only small grammatical and stylistic corrections. It retains the printed Greek reading ‘being angry’ in the main text, preserves the manuscript alternative in the footnote, and leaves unexplained the object or reason for the anger. Metụrụ ya aka supplies the appropriate completed narrative form for ‘touched him.’
