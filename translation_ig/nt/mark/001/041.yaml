  text: ⸀καὶ ⸀ὀργισθεὶς ἐκτείνας τὴν χεῖρα ⸂αὐτοῦ ἥψατο⸃ καὶ λέγει αὐτῷ· Θέλω, καθαρίσθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/041.yaml
  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: ig
  text: Iwe ji ya[a], o setịrị aka ya, metụrụ ya aka, sị ya, “Achọrọ m; dị ọcha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ, “Mgbe obi ebere kpaliri ya,” kama “Iwe ji ya.”
    reason: textual_variant
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: Mgbe iwe ji ya
  rationale: Nke a na-egosipụta ihe odide SBLGNT bụ́ ὀργισθείς n'ụzọ doro anya ma bụrụkwa Igbo nkịtị maka ‘being angry,’ n'etinyeghị ihe kpatara iwe ahụ n'okwu.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: ọ setịrị aka ya
  rationale: Ọ na-echekwa omume ahụ kpọmkwem ma na-eme ka usoro akụkọ ahụ bụrụ nke e ji Igbo dị mfe ma kwekọọ n'okike kwuo.
- source_word: ἥψατο
  choice: metụ ya aka
  rationale: N'ọnọdụ ọgwụgwọ a, okwu a pụtara imetụ mmadụ aka; nsụgharị a na-echekwa mkpa nke Jizọs iji aka metụ onye ekpenta ahụ.
- source_word: λέγει αὐτῷ
  choice: sị ya
  rationale: Ọ bụ ezie na λέγει bụ historical present, ‘sị ya’ bụ ụzọ Igbo sitere n'okike si akọ okwu e kwuru n'usoro akụkọ gara aga.
- source_word: Θέλω
  choice: Achọrọ m
  rationale: N'ebe a θέλω na-egosi na ọ chọrọ ime ihe onye ahụ rịọrọ, ya bụ na o kwetara ime ya; ‘Achọrọ m’ bụ okwu Igbo dị mfe ma na-aza arịrịọ ahụ ozugbo.
- source_word: καθαρίσθητι
  choice: dị ọcha
  rationale: Iwu a na-egosipụta ime ka onye ekpenta dị ọcha, ma n'ahụ ma n'ihe metụtara ịdị ọcha n'okpukpe. ‘Dị ọcha’ dị nkenke, dị ike, ma na-echekwa asụsụ ịdị ọcha ahụ.
theological_decisions:
- issue: Ọdịiche dị n'ihe odide banyere mmetụta Jizọs
  choice: Isi okwu sụgharịrị ὀργισθείς dị ka ‘Mgbe iwe ji ya.’
  alternative: ‘Mgbe obi ebere kpaliri ya.’
  rationale: A gbasoro ihe SBLGNT bipụtara dịka isi ihe odide. E debeghị ọdịiche a n'akụkụ n'ihi na ọ na-emetụta otú a ga-esi ghọta mmetụta Jizọs; e tinyere ya n'ala peeji kama idozi esemokwu ahụ n'ụzọ nzuzo.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ isi ihe odide ahụ ka o kwuo na iwe ji Jizọs, n'agbanyeghị na a kọwaghị onye ma ọ bụ ihe iwe ji ya maka ya; nke a na-echekwa mgbagwoju anya nke Grik.
