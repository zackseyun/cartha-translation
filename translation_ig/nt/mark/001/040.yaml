source:
  edition: SBLGNT
  text: Καὶ ἔρχεται πρὸς αὐτὸν λεπρὸς παρακαλῶν αὐτὸν καὶ ⸀γονυπετῶν λέγων αὐτῷ ὅτι Ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: ig
  text: Otu nwoke nwere ọrịa ekpenta bịakwutere ya[a], rịọsie ya ike[b], gbuo ikpere n’ala, sị ya, “Ọ bụrụ na ị dị njikere, i nwere ike ime ka m dị ọcha[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “otu onye ekpenta.” Okwu Grik ahụ nwere ike ịgụnye ụdị ọrịa akpụkpọ ahụ dị iche iche e weere n’oge ahụ dị ka ekpenta; ọ bụghị iwu na ọ bụ naanị ọrịa Hansen nke oge a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “rịọ ya arịrịọ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “mee m ọcha.” Ngwaa Grik ahụ nwere ike izo aka ma n’iwepụ adịghị ọcha n’usoro okpukpe ma na mgbake anụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: otu nwoke nwere ọrịa ekpenta
  rationale: E ji okwu na-ebute onye ahụ ụzọ kama iji aha ọrịa kpọọ ya. N’ebe a, okwu Grik ahụ na-ezo aka n’onye nwere ọrịa akpụkpọ ahụ e weere dị ka ekpenta, ma ọ bụghị iwu na ọ bụ naanị ọrịa Hansen nke oge a.
- source_word: παρακαλῶν
  choice: rịọsie ya ike
  rationale: N’ọnọdụ a, okwu ahụ na-egosi arịrịọ siri ike ma ọ bụ ịrịọ mmadụ arịrịọ; nsụgharị a bụ Igbo nkịtị ma na-egosipụta ịdị uchu nke arịrịọ ahụ.
- source_word: γονυπετῶν
  choice: gbuo ikpere n’ala
  rationale: Nke a na-egosipụta kpọmkwem ọnọdụ mmadụ ji ikpere ya daa n’ala, n’enweghị ịgbakwụnye ihe kpatara o ji mee ya.
- source_word: Ἐὰν θέλῃς
  choice: Ọ bụrụ na ị chọrọ
  rationale: Nkebi a na-ekwu banyere ọchịchọ ma ọ bụ ịdị njikere Jizọs, ọ bụghị naanị ihe ga-eme n’ọdịnihu.
- source_word: δύνασαί
  choice: i nwere ike
  rationale: Nke a na-edobe echiche nke ikike ma ọ bụ ike ime ihe, ma bụrụkwa okwu Igbo a na-aghọta ngwa ngwa.
- source_word: καθαρίσαι
  choice: ime ka m dị ọcha
  rationale: A hapụrụ echiche nke ‘ịdị ọcha’ ka ọ nwee ike ịgụnye ma mgbake n’ahụ ma iwepụ adịghị ọcha n’usoro okpukpe, kama imechi ya naanị n’echiche ‘gwọọ m.’
- source_word: ἔρχεται
  choice: bịakwutere
  rationale: Ọ bụ ezie na Grik ji present akụkọ mee ka akụkọ dị ndụ, oge gara aga bụ ụzọ Igbo si akọ akụkọ a n’ụzọ kacha adị ire ma doo anya.
theological_decisions:
- issue: Ụdị ime ka onye ekpenta dị ọcha
  choice: ime ka m dị ọcha
  alternative: gwọọ m
  rationale: Isiokwu Grik ji ngwaa nke pụtara ime ka ihe dị ọcha, ọ bụghị ngwaa nkịtị maka ịgwọ ọrịa. Nhọrọ a na-echekwa njikọ dị n’etiti mgbake anụ ahụ na iwepụ adịghị ọcha n’usoro okpukpe.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. A họọrọ usoro ngwaa ndị so ibe ha—“rịọsie… gbuo… sị”—iji mee ka mmegharị ahịrịokwu ahụ bụrụ nke e ji akọ akụkọ n’Igbo, ebe a na-echekwa usoro omume ndị dị na Grik.
