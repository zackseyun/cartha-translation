revisions:
- from: Otu nwoke nwere ọrịa ekpenta bịakwutere ya[a], rịọsie ya ike[b], gbuo ikpere n’ala, sị ya, “Ọ bụrụ na ị chọrọ, i nwere ike ime ka m dị ọcha[c].”
  to: Otu nwoke nwere ọrịa ekpenta bịakwutere ya[a], rịọsie ya ike[b], gbuo ikpere n’ala, sị ya, “Ọ bụrụ na ị dị njikere, i nwere ike ime ka m dị ọcha[c].”
  rationale: The revision makes the conditional phrase explicitly one of willingness and replaces a potentially misleading cleansing alternative. It otherwise retains the draft’s accurate, idiomatic rendering and its appropriate explanatory note concerning λεπρὸς.
