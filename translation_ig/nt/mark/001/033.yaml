translation:
  language: ig
  text: Obodo ahụ dum gbakọtara n'ọnụ ụzọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n'ebe ọnụ ụzọ dị.” N'ụzọ nkịtị, preposition Grik ahụ nwere ike ịpụta “n'ebe ... dị”; ma n'ọnọdụ a, ọ na-ekwu banyere ìgwè mmadụ gbakọtara n'ebe e si abanye n'ụlọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ... ἐπισυνηγμένη
  choice: gbakọtara
  rationale: Ngwakọta imperfect nke εἰμί na perfect passive participle na-akọwa ọnọdụ a hụrụ n'oge ahụ. N'Igbo, “gbakọtara” na-enye okwu dị ire ma gosipụta na ndị obodo ahụ anọworị n'ebe ahụ ọnụ.
- source_word: ὅλη ἡ πόλις
  choice: obodo ahụ dum
  rationale: Nke a na-echekwa nkwupụta sara mbara nke Grik, “obodo ahụ dum,” n'emeghị ka ọ daa mbà ma ọ bụ mee ya ka ọ bụrụ ọnụ ọgụgụ e ji nlezianya gụọ.
- source_word: πρὸς τὴν θύραν
  choice: n'ọnụ ụzọ
  rationale: N'ọnọdụ a, πρός na accusative na-egosi ebe ìgwè mmadụ gbakọtara, ya bụ n'ebe e si abanye n'ụlọ. “N'ọnụ ụzọ” bụ okwu Igbo nkịtị ma doo anya.
- source_word: θύραν
  choice: ọnụ ụzọ
  rationale: θύρα pụtara ụzọ ma ọ bụ ebe e si abanye. “Ọnụ ụzọ” dabara n'okwu ụlọ a ma na-ada nke ọma n'Igbo ugbu a.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ùgwù. E debere nkwupụta “obodo ahụ dum” dịka ọ dị ike n'isi mmalite, ma jiri “n'ọnụ ụzọ” kọwaa ọnọdụ ìgwè mmadụ n'ụzọ nkịtị.
