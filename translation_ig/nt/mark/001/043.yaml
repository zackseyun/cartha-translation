  naturalness: The sentence structure is natural Standard Igbo. The completed form of “dọọ ... aka ná ntị” should be “dọrọ ... aka ná ntị,” not “dọsịrị ... aka ná ntị.”
  terminology: “dọrọ ya aka ná ntị n’ụzọ siri ike” appropriately renders the stern, directive force of ἐμβριμησάμενος without deciding whether the emotion was indignation directed at the man. “chụpụrụ ya ka ọ pụọ” better represents ἐξέβαλεν’s marked force in this context.
