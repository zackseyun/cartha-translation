lexical_decisions:
- source_word: ἐμβριμησάμενος
  choice: Mgbe ọ dọsịrị ya aka ná ntị n’ụzọ siri ike
  rationale: Okwu Grik a na-egosi mmetụta na iwu siri ike. Nsụgharị a na-eme ka ike dị n’okwu ahụ pụta ìhè n’Igbo dị mfe nghọta, n’etinyeghị echiche doro anya na Jizọs baara nwoke ahụ mba n’ihi mmejọ.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’ nwoke ahụ a gwọrọ, ọ bụkwa onye a dọrọ aka ná ntị.
- source_word: εὐθύς
  choice: ozugbo ahụ
  rationale: Nke a na-echekwa ọsọ akụkọ Mak na-egosikarị site n’okwu a.
- source_word: ἐξέβαλεν
  choice: o zipụrụ ya ka ọ laa
  rationale: Ngwaa Grik ahụ siri ike karịa iziga mmadụ nanị, ma n’ọnọdụ a ihe ọ na-ekwu bụ ịchụpụ ma ọ bụ izipu nwoke ahụ ozugbo. A họọrọ okwu Igbo a dị mma n’ọnụ, tinyekwa nhọrọ ndị siri ike karị n’ala peeji.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’otu nwoke ahụ a gwọrọ.
- source_word: καὶ
  choice: Mgbe
  rationale: A haziri njikọ ahịrịokwu ahụ dịka nkebi oge n’Igbo ka omume participle ahụ na omume isi ngwaa jikọta n’ụzọ ebumpụta ụwa, ebe a ka na-echekwa usoro ihe mere.
theological_decisions:
- issue: Ụda olu na omume Jizọs n’ebe nwoke ahụ a gwọrọ nọ
  choice: Jizọs dọrọ ya aka ná ntị ma zipụ ya ka ọ laa n’ụzọ gosiri ike dị ukwuu.
  alternative: Jizọs nyere ya iwu siri ike na-enweghị mmetụta iwe ọ bụla; ma ọ bụ Jizọs baara nwoke ahụ mba kpọmkwem.
  rationale: Ngwaa abụọ ahụ dị n’asụsụ Grik siri ike nke ukwuu. Nsụgharị a na-echekwa ike ahụ ma ọ naghị ekpebi na Jizọs nwere iwe mmehie ma ọ bụ na ọ kpọrọ nwoke ahụ asị.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “dọsịrị ya aka ná ntị n’ụzọ siri ike” iji chekwaa ike na edoghị anya nke ἐμβριμησάμενος, ebe “zipụrụ ya ka ọ laa” na-ada nke ọma n’Igbo ma ala peeji na-echekwa ike pụrụ iche nke ἐξέβαλεν.
