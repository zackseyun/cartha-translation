    issue: The completed verb form “dọsịrị ya aka ná ntị” is nonstandard in this idiom.
    rationale: Standard Igbo uses “dọrọ ... aka ná ntị” as the completed form of “dọọ ... aka ná ntị.”
  - severity: medium
    issue: “o zipụrụ ya ka ọ laa” understates ἐξέβαλεν in the main text.
    rationale: Although “sent him away” is contextually possible, ἐκβάλλω is notably forceful. “chụpụrụ ya ka ọ pụọ” preserves that force without implying that the man was a demon.
