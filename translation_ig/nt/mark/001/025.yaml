  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: ig
  text: Jizọs baara ya mba, sị, “Mechie ọnụ[a], pụọ n’ime ya!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị, “Ka e kechie gị ọnụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: baara ya mba
  rationale: Nkebi okwu a na-egosi ịgwa onye okwu n’ike na ịkatọ ya; ọ na-echekwa ma ịdị nkọ nke okwu Jizọs ma ikike o ji kwuo ya.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha a na-arụtụ aka n’ajọ mmụọ ahụ Jizọs na-agwa okwu, ọ bụghị nwoke ahụ mmụọ ahụ nọ n’ime ya.
- source_word: λέγων
  choice: sị
  rationale: “Sị” bụ ụzọ Igbo dị nkenke ma bụrụkwa eke isi webata kpọmkwem ihe e kwuru.
- source_word: Φιμώθητι
  choice: Mechie ọnụ
  rationale: N’ebe a, okwu ahụ bụ iwu siri ike ka onye a na-agwa kwụsị ikwu okwu. “Mechie ọnụ” na-egosipụta ike iwu ahụ n’Igbo nkịtị; ihe oyiyi nkịtị nke ikechi ọnụ ka edebere n’ala peeji.
- source_word: ἔξελθε
  choice: pụta
  rationale: N’ọnọdụ ịchụ mmụọ a, okwu ahụ pụtara isi n’ime onye ahụ pụta.
- source_word: ἐξ αὐτοῦ
  choice: sikwa n’ime ya
  rationale: Nkwupụta a na-egosi ngagharị site n’ime nwoke ahụ ruo n’èzí, ma na-edobe ọdịiche dị n’etiti nwoke ahụ na mmụọ a na-achụpụ.
theological_decisions:
- issue: Onye Jizọs baara mba
  choice: Jizọs na-agwa ajọ mmụọ ahụ okwu kpọmkwem, ọ bụghị nwoke ahụ.
  alternative: Ịghọta na nwoke ahụ bụ onye Jizọs baara mba ozugbo.
  rationale: Ihe gbara amaokwu a gburugburu na iwu ahụ, “sikwa n’ime ya pụta,” na-egosi na “ya” mbụ bụ mmụọ ahụ, ebe “ya” nke abụọ bụ nwoke ahụ. Nsụgharị ahụ na-edobe ọdịiche akụkọ ahụ mere n’etiti onye ahụ na mmụọ nọ n’ime ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, mee nsụgharị ahụ. “Baara ya mba” na “Mechie ọnụ” na-enye iwu ahụ ịdị nkọ n’enweghị okwu ụka pụrụ iche.
