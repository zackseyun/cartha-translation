id: MRK.1.13
reference: Mark 1:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀ἦν ἐν τῇ ἐρήμῳ ⸂τεσσεράκοντα ἡμέρας⸃ πειραζόμενος ὑπὸ τοῦ Σατανᾶ, καὶ ἦν μετὰ τῶν θηρίων, καὶ οἱ ἄγγελοι διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: ig
  text: Ọ nọ n’ọzara ụbọchị iri anọ[a], Setan na-anwa ya ọnwụnwa; ya na anụ ọhịa nọ, ndị mmụọ ozi na-ejekwara ya ozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Setan na-anwale ya.” Ngwaa Grik ahụ nwere ike ịpụta “ịnwa ọnwụnwa” ma ọ bụ “ịnwale.” Ebe Setan bụ onye na-eme ya n’ebe a, “ịnwa ọnwụnwa” kacha daba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρήμῳ
  choice: n’ọzara
  rationale: Ọzara bụ okwu Igbo doro anya maka ebe tọgbọrọ chakoo nke a na-anọghịkarị; ọ na-edobe echiche ala na ụda Akwụkwọ Nsọ n’enweghị ịkọwa ya dị ka naanị ala aja.
- source_word: τεσσεράκοντα ἡμέρας
  choice: ụbọchị iri anọ
  rationale: Nke a na-asụgharị kpọmkwem oge e gosiri n’asụsụ Grik, ma hapụkwa mkpọtụ Akwụkwọ Nsọ nke ụbọchị iri anọ ka onye na-agụ ya ghọta n’onwe ya.
- source_word: πειραζόμενος
  choice: na-anwa ya ọnwụnwa
  rationale: Ngwaa Grik ahụ nwere ike ịpụta ịnwa ọnwụnwa ma ọ bụ ịnwale. Ebe Setan bụ onye na-eme ya ebe a, ịnwa ọnwụnwa dabara nke ọma, ma ihe ọzọ ọ pụrụ ịpụta ka e debere n’ala ala peeji.
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: Setan na-anwa ya
  rationale: Setan bụ aha/utu aha a maara nke ọma n’Igbo. E mere ahịrịokwu ahụ ka ọ bụrụ nke onye na-eme ihe nọ n’isi iji mee ka ọ bụrụ Igbo eke, n’agbanyeghị na Grik jiri usoro passive.
- source_word: μετὰ τῶν θηρίων
  choice: ya na anụ ọhịa nọkwa
  rationale: Anụ ọhịa na-egosi anụ ndị na-abụghị anụ ụlọ n’asụsụ Igbo nke oge a, ma na-edobe ọnọdụ ọhịa ahụ n’enweghị okwu ochie.
- source_word: ἄγγελοι
  choice: ndị mmụọ ozi
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ụmụ mmụọ nke eluigwe, ọ bụghị ndị ozi mmadụ; ya mere ndị mmụọ ozi bụ nsụgharị kwesịrị ekwesị.
- source_word: διηκόνουν αὐτῷ
  choice: na-ejekwara ya ozi
  rationale: Nkebi a na-egosi ije ozi na-aga n’ihu, kwekọrọ n’imperfect Grik, ma nwee ụda dị nsọ ma bụrụkwa Igbo a na-aghọta.
- source_word: καὶ ἦν ... καὶ ἦν ... καὶ
  choice: Ọ nọkwa ...; ya na ... nọkwa, ndị ... na-ejekwara
  rationale: E debere njikọ ugboro ugboro nke Mak site n’iji kwa na usoro ahịrịokwu ndị na-esochi ibe ha, ma hazie ya ntakịrị ka ọ bụrụ Igbo dị mfe ọgụgụ.
theological_decisions:
- issue: Ihe πειραζόμενος pụtara mgbe Setan bụ onye na-eme ya
  choice: Setan na-anwa ya ọnwụnwa
  alternative: Setan na-anwale ya
  rationale: Okwu Grik nwere ma echiche ịnwa ọnwụnwa ma nke ịnwale. N’ihi na Setan ka a kpọrọ aha dị ka onye na-eme ihe ahụ, echiche nke ọnwụnwa kacha dabara; ma e debere ihe ọzọ ọ pụrụ ịpụta n’ala ala peeji ka e wee ghara iwepụ mgbagwoju pụtara n’ezie.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ụdị akụkọ Mak nke na-ejikọ nkebi ahịrịokwu n’usoro, ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa agbakwunyere.
