  text: Καὶ εὐθὺς τὸ πνεῦμα αὐτὸν ἐκβάλλει εἰς τὴν ἔρημον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/012.yaml
  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: ig
  text: Mgbe ahụ, ozugbo Mmụọ ahụ chụpụrụ ya gaa n’ọzara[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ ọzọ, “chụpụrụ ya” ma ọ bụ “zipụrụ ya.” Ngwaa Grik ahụ siri ike; tulee otú Mak si ejikarị otu ngwaa ahụ ekwu maka ịchụpụ mmụọ ọjọọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: ahụ
  rationale: N'Igbo, ijikọ “ozugbo” na “ahụ” na-eme ka njikọ akụkọ ahụ na ihe bu ya ụzọ doo anya n'ụzọ ebumpụta ụwa, kama ịmalite ahịrịokwu a na “Na” nke ga-ada arọ.
- source_word: εὐθὺς
  choice: Ozugbo
  rationale: “Ozugbo” na-egosipụta ngwa ngwa na ọsọ akụkọ Mak nke ọma n'Igbo nke oge a.
- source_word: τὸ πνεῦμα
  choice: Mmụọ ahụ
  rationale: Akara nkọwa Grik na-atụ aka na Mmụọ ahụ e kwuru okwu ya na Mak 1:10. “Mmụọ ahụ” na-anọgide nso n'okwu Grik, n'etinyeghị “Nsọ” nke adịghị n'ahịrịokwu a.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnochiaha a na-atụ aka na Jizọs ma bụrụ onye ihe ngwaa ahụ metụtara.
- source_word: ἐκβάλλει
  choice: chụbara
  rationale: “Chụbara” na-ejikọta ike dị na ngwaa ἐκβάλλω na mmegharị ịbanye n'otu ebe. Ọ siri ike karịa “duuru” ma ọ bụ “zipụrụ,” ma ọ dabara n'okwu Igbo ebumpụta ụwa.
- source_word: εἰς τὴν ἔρημον
  choice: n'ọzara
  rationale: “Ọzara” bụ okwu Igbo a na-aghọta nke ọma maka ebe tọgbọrọ chakoo, mmadụ na-ebighị, ma ọ naghị amanye echiche na ọ bụ naanị ala aja.
theological_decisions:
- issue: Ike omume Mmụọ ahụ n'ebe Jizọs nọ
  choice: A sụgharịrị ἐκβάλλει dị ka “chụbara,” nke na-egosipụta omume siri ike.
  alternative: “duuru ya” ma ọ bụ “zipụrụ ya”
  rationale: 'Ngwaa Grik ahụ siri ike. Idobe ike ya na-echekwa esemokwu dị n''okwu ahụ: ọ bụ Mmụọ ahụ malitere njem Jizọs gaa ebe ọnwụnwa ga-adị. E meghị ka okwu ahụ dị nro iji mee ka ọ daba n''otú Oziọma ndị ọzọ si kwuo ya.'
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị nkenke ma dị ùgwù. “Chụbara” na-eme ka ahịrịokwu ahụ bụrụ nke ebumpụta ụwa n'Igbo ma na-echekwa ike ngwaa Grik; “Mmụọ ahụ” na-ezere ịgbakwunye okwu na-adịghị na isi mmalite.
