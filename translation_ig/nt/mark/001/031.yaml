id: MRK.1.31
reference: Mark 1:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἤγειρεν αὐτὴν κρατήσας τῆς ⸀χειρός· καὶ ἀφῆκεν αὐτὴν ὁ ⸀πυρετός, καὶ διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: ig
  text: Ọ bịakwutere ya, jide ya n’aka, kulite ya. Ahụ ọkụ ahụ wee hapụ ya, ọ wee na-ejere ha ozi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ wee malite ijere ha ozi.” Ụdị ngwaa Grik a nwere ike ịkọwa na ọ nọ na-ejere ha ozi; ma ihe ndị gbara ya gburugburu na-akwadokwa na ọ malitere ime ya ozugbo a gwọchara ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: Ọ bịakwutere ya
  rationale: Aorist participle ahụ na-egosi na Jizọs bịaruru nwanyị ahụ nso tupu o kulite ya. “Bịakwutere ya” bụ Igbo doro anya nke na-egosikwa onye ọ bịakwutere n’enweghị nkọwa gabigara ihe odide ahụ.
- source_word: ἤγειρεν αὐτὴν
  choice: kulite ya
  rationale: “Kulite ya” na-egosi ime ka o si n’ebe o dina bilie, ma ọ naghị eme ka okwu ahụ bụrụ naanị ‘nyere ya aka ibili’; ya mere, ọ na-edobe ike okwu ἐγείρω.
- source_word: κρατήσας τῆς χειρός
  choice: jide ya n’aka
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ nkịtị na mmadụ jidere onye ọzọ n’aka; ọ na-egosipụta ihe κρατέω na genitive χειρός pụtara.
- source_word: ἀφῆκεν αὐτὴν
  choice: hapụ ya
  rationale: N’ọnọdụ ọgwụgwọ a, ἀφίημι pụtara na ọrịa ahụ siri n’ahụ ya pụọ. “Hapụ ya” na-edobe ihe oyiyi ahụ n'ụzọ dị mfe.
- source_word: ὁ πυρετός
  choice: Ahụ ọkụ ahụ
  rationale: “Ahụ ọkụ” bụ okwu Igbo nkịtị maka fever, ebe “ahụ” nke so ya na-egosipụta ọrịa ahụ a maara nke na-arịa ya.
- source_word: διηκόνει
  choice: ọ wee na-ejere ha ozi
  rationale: Ụdị imperfect ahụ nwere ike igosi ọrụ na-aga n’ihu. “Na-ejere ha ozi” na-edobe akụkụ a ma kwe ka ọnọdụ ahụ gosi na ọ bụ ihe sochiri ọgwụgwọ ahụ ozugbo.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnochiaha plural ahụ na-ezo aka n’ìgwè ndị nọ ebe ahụ, ọ bụghị naanị Jizọs.
theological_decisions:
- issue: Okwu ἐγείρω nwere ike icheta okwu mbilite n’ọnwụ
  choice: kulite ya
  alternative: nyere ya aka ka o bilie
  rationale: “Kulite ya” dabara na omume ime ka nwanyị ahụ bilie n’elu akwa ma na-edobekwa ike okwu Mak ji mee ihe, n’etinyeghị ozizi mbilite n’ọnwụ kpọmkwem n’akụkọ ọgwụgwọ a.
- issue: Ma imperfect διηκόνει ọ̀ pụtara naanị ọrụ na-aga n’ihu ka ọ̀ bụ mmalite ọrụ ahụ
  choice: ọ wee na-ejere ha ozi
  alternative: ọ wee malite ijere ha ozi
  rationale: Ụdị Grik ahụ n’onwe ya na-egosi omume na-aga n’ihu, ma ọnọdụ ahụ nwere ike ime ka a ghọta na ọ malitere ozugbo. E debere nghọta abụọ ahụ n’enweghị ịmanye otu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-agbaso mmegharị dị n’isi mmalite—ịbịakwute, ijide n’aka, na ikulite—ma kewaa n’ahịrịokwu abụọ ka ọ na-asọ nke ọma n’Igbo.
