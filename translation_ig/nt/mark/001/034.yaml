review_pass:
  verdict: revise
  source_fidelity: 'A chọrọ mmezi. Akụkụ «ndị mmụọ ọjọọ ji» agbanweela ihe Grik δαιμόνια πολλὰ na-ekwu: ihe a chụpụrụ bụ ọtụtụ mmụọ ọjọọ, ọ bụghị ọtụtụ mmadụ mmụọ ọjọọ ji. Ọzọkwa, nhazi «ọtụtụ ndị ọrịa dị iche iche na-arịa» adịghị akọwa nke ọma na ndị ahụ na-arịa ọrịa dị iche iche.'
  naturalness: Ederede ahụ na-agụ nke ọma n'ozuzu ya, ma «ọtụtụ ndị ọrịa dị iche iche na-arịa» adịghị eke n'Igbo Standard. «Ọtụtụ ndị na-arịa ọrịa dị iche iche» doro anya ma bụrụ okwu nkịtị. «Ọ dịghị ekwe ka» dabara nke ọma n'akụkọ gara aga ma na-egosi mgbochi na-aga n'ihu n'ọnọdụ a.
  terminology: «Ịgwọ», «ọrịa», «mmụọ ọjọọ», na «chụpụ» bụ okwu kwesịrị ekwesị. A ghaghị iji «ọtụtụ mmụọ ọjọọ» sụgharịa δαιμόνια πολλὰ n'enweghị itinye ndị mmụọ ahụ ji. A chekwala «ha maara ya» n'enweghị ịgbasa njirimara ahụ.
  issues:
