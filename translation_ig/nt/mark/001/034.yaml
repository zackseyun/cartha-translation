- from: Ọ gwọkwara ọtụtụ ndị ọrịa dị iche iche na-arịa, chụpụkwa ọtụtụ ndị mmụọ ọjọọ ji. Ọ naghị ekwe ka mmụọ ọjọọ ndị ahụ kwuo okwu, n’ihi na ha maara ya.[a]
  to: Ọ gwọkwara ọtụtụ ndị na-arịa ọrịa dị iche iche, chụpụkwa ọtụtụ mmụọ ọjọọ. Ọ dịghị ekwe ka mmụọ ọjọọ ndị ahụ kwuo okwu, n’ihi na ha maara ya.[a]
  rationale: E meziri ntụgharị ahụ ka ihe a chụpụrụ bụrụ «ọtụtụ mmụọ ọjọọ», dị ka δαιμόνια πολλὰ si kwuo, ma ọ bụghị ndị mmụọ ọjọọ ji. E hazikwara nkebi banyere ọrịa ka o doo anya na ọtụtụ ndị ahụ na-arịa ụdị ọrịa dị iche iche. E chekwara okwu dị mkpirikpi «ha maara ya» na ndetu ala ya, n'ihi na αὐτόν anaghị akọwa kpọmkwem ihe ha maara banyere ya.
