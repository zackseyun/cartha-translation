    rationale: Nke a pụtara ịchụpụ ọtụtụ ndị mmadụ mmụọ ọjọọ ji, ebe Grik na-ekwu kpọmkwem na ọ chụpụrụ ọtụtụ mmụọ ọjọọ.
  - severity: medium
    issue: «ọtụtụ ndị ọrịa dị iche iche na-arịa»
    rationale: 'Nhazi a enweghị isi doro anya: o nwere ike ime ka «dị iche iche» kọwaa ndị ọrịa karịa ọrịa ha na-arịa. «Ọtụtụ ndị na-arịa ọrịa dị iche iche» na-ewepụta κακῶς ἔχοντας ποικίλαις νόσοις nke ọma.'
  - severity: low
