  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: ig
  text: Ọ gwọkwara ọtụtụ ndị na-arịa ọrịa dị iche iche, chụpụkwa ọtụtụ mmụọ ọjọọ. Ọ dịghị ekwe ka mmụọ ọjọọ ndị ahụ kwuo okwu, n’ihi na ha maara ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha maara onye ọ bụ.” Okwu Grik ahụ kwuru naanị, “ha maara ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: Ọ gwọkwara
  rationale: “Ịgwọ” bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị ekwu maka ime ka onye ọrịa gbakee; “-kwara” na-egosikwa njikọ καί na ihe ndị bu ụzọ.
- source_word: πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις
  choice: ọtụtụ ndị ọrịa dị iche iche na-arịa
  rationale: A sụgharịrị akpaalaokwu κακῶς ἔχω n’ụzọ Igbo si ekwu na mmadụ na-arịa ọrịa, ebe “ọrịa dị iche iche” na-echekwa echiche ποικίλαις νόσοις banyere ụdị ọrịa dịgasị iche.
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: chụpụkwa ọtụtụ ndị mmụọ ọjọọ ji
  rationale: N’Igbo, ikwu na Jizọs “chụpụrụ ndị mmụọ ọjọọ ji” na-egosi ma ịchụpụ mmụọ ndị ahụ ma ndị ha ji, n’ụzọ nkịtị ndị na-agụ akwụkwọ ga-aghọta.
- source_word: οὐκ ἤφιεν
  choice: Ọ naghị ekwe
  rationale: Ụdị ngwaa imperfect na-egosi ihe ọ nọgidere na-ajụ ikwe n’oge ahụ; “ọ naghị ekwe” na-echekwa ọdịdị a karịa “o kweghị” naanị.
- source_word: λαλεῖν
  choice: kwuo okwu
  rationale: “Ikwuo okwu” bụ ntụgharị Igbo nkịtị, doro anya, ma dabara n’ụdị akụkọ dị nsọ.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a ὅτι na-enye ihe kpatara Jizọs ji gbochie ha ikwu okwu.
- source_word: ᾔδεισαν αὐτόν
  choice: ha maara ya
  rationale: Nke a na-esochi okwu Grik ahụ kpọmkwem, nke nwere naanị nnọchiaha “ya,” ma ghara ịgbasa ihe mmụọ ọjọọ ndị ahụ maara banyere onye ọ bụ.
theological_decisions:
- issue: Ma a ga-akọwapụta ihe mmụọ ọjọọ ndị ahụ maara dị ka nkwupụta banyere onye Kraịst bụ
  choice: ha maara ya
  alternative: ha maara onye ọ bụ
  rationale: Okwu Grik ahụ kwuru naanị “ha maara ya.” Ịsị “ha maara onye ọ bụ” ga-eme ka echiche dị na ya pụta ìhè karị, ma ederede a n’onwe ya akọwaghị ya otú ahụ; ya mere, e chekwara nkenke na mgbagwoju echiche dị n’isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ bụ nke nkịtị n’Igbo, ma e chekwara njikọ omume atọ na ọdịiche dị n’etiti ịgwọ ọrịa na ịchụpụ mmụọ ọjọọ.
