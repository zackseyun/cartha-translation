  source_fidelity: 'Ihe e dere na-edobe nhazi bụ isi nke Grik: “olu” nke onye na-eti mkpu, ọnọdụ “n''ọzara,” na iwu ọtụtụ mmadụ abụọ ahụ. Otú ọ dị, “kwụzie” adịghị akọwa nke ọma εὐθείας (“kpọmkwem/kwụ ọtọ”), ya mere a gbanwere ya ka o doo anya na ụzọ ndị ahụ ga-adị kwụ ọtọ.'
  naturalness: “Meenụ ka okporo ụzọ ya kwụ ọtọ” bụ okwu Standard Igbo eke ma doo ihe oyiyi nke ụzọ kwụ ọtọ anya karịa “meenụ ka ... kwụzie.” A na-ede “Onyenweanyị” ọnụ dịka aha nsọpụrụ e guzobere n'Igbo maka “Lord,” ka ọ ghara ịdị ka nkebiokwu nkịtị “onyenwe anyị.”
