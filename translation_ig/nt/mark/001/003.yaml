  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: ig
  text: 'Olu onye na-eti mkpu n''ọzara, sị: “Kwadebenụ ụzọ Onyenweanyị[b]; meenụ ka okporo ụzọ ya kwụ ọtọ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, ma e soro ntụpọokwu ọzọ nke okwu Aịzaya a hotara: “Olu onye na-eti mkpu, sị: ‘N''ọzara, kwadebenụ ụzọ Onyenweanyị …’”'
    reason: alternative_reading
  - marker: b
    text: “Onyenweanyị” bụ nsụgharị okwu Grik kyriou; okwu a hotara na-echetara Aịzaya 40:3, ebe okwu Hibru ahụ bụ YHWH, nke a na-asụgharịkarị “ONYENWE ANYỊ.”
    reason: cross_reference
lexical_decisions:
- source_word: φωνὴ
  choice: Olu
  rationale: “Olu” bụ nsụgharị Igbo nkịtị na nke doro anya maka φωνή n'ọnọdụ a; Igbo achọghị iji okwu dịka “otu” gosi na aha ahụ enweghị article.
- source_word: βοῶντος
  choice: onye na-eti mkpu
  rationale: Nkebiokwu a na-egosi ịkpọsa ozi n'olu ike, ma na-ejigide njikọ genitive participle ahụ na “olu.”
- source_word: ἐν τῇ ἐρήμῳ
  choice: n'ọzara
  rationale: “Ọzara” na-egosi ebe mmadụ na-ebighị nke ọma ma kwekọọ n'ọnọdụ Jọn n'akwụkwọ Mak; n'ahịrị bụ isi, e jikọtara ya na onye na-eti mkpu dịka syntax Grik si adịkarị.
- source_word: Ἑτοιμάσατε
  choice: Kwadebenụ
  rationale: Imperative plural a na-akpọ ọtụtụ mmadụ ka ha mee nkwadebe n'ụzọ doro anya na ozugbo.
- source_word: τὴν ὁδὸν
  choice: ụzọ
  rationale: “Ụzọ” na-ejigide ma ihe oyiyi nke ụzọ a na-aga ma nghọta amụma ya.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo a na-amakarị maka κύριος dịka aha nsọpụrụ; footnote na-akọwa njikọ ya na YHWH n'Aịzaya.
- source_word: εὐθείας
  choice: kwụzie
  rationale: “Kwụzie” n'okwu a pụtara ime ka ụzọ ghara ịgbagọ, ọ bụghị ịdị ezi omume.
- source_word: ποιεῖτε
  choice: meenụ ka
  rationale: Nke a na-enye iwu plural nke ποιεῖτε n'Igbo eke mgbe adjective “kwụ ọtọ/kwụzie” so ya.
- source_word: τὰς τρίβους αὐτοῦ
  choice: okporo ụzọ ya
  rationale: “Okporo ụzọ” na-anọchi τρίβους dịka ụzọ ndị a na-aga; Igbo anaghị egosi plural mgbe niile n'ụdị aha, ma “ya” na-edobe αὐτοῦ.
theological_decisions:
- issue: Nsụgharị κύριος n'okwu e hotara n'Aịzaya ebe Hibru na-ekwu YHWH
  choice: Onyenwe anyị
  alternative: YHWH / ONYENWE ANYỊ
  rationale: E debere aha nsọpụrụ dị na Grik n'ahịrị bụ isi, kama ibubata ụdị aha Hibru n'ime ya; footnote na-edobe ndabere nke YHWH na Aịzaya.
- issue: Ebe a ga-ejikọta “n'ọzara”
  choice: E jikọtara ya na “onye na-eti mkpu”
  alternative: “N'ọzara, kwadebenụ ụzọ Onyenwe anyị …”
  rationale: Usoro okwu Grik dị na Mak na-akwado nghọta “onye na-eti mkpu n'ọzara,” ma ntụpọokwu ọzọ nke okwu Aịzaya ka e debere na footnote ka e ghara ikpochapụ ambiguity ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke nwere ùgwù ma dị mfe nghọta. A họọrọ “na-eti mkpu” iji gosipụta olu onye nkwusa siri ike, “ụzọ/okporo ụzọ” iji chekwaa ihe oyiyi abụọ dị na Grik, ma debe ambiguity nke ọnọdụ “n'ọzara” na footnote.
