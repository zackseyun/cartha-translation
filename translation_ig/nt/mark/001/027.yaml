id: MRK.1.27
reference: Mark 1:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: ig
  text: O juru ha niile anya, nke mere ha ji na-akparịta ụka n’etiti onwe ha, na-asị, “Gịnị bụ ihe a? Ozizi ọhụrụ[a] nke nwere ikike! Ọ na-enye ọbụna mmụọ ndị na-adịghị ọcha iwu, ha ana-erubere ya isi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Gịnị bụ ihe a? Gịnị bụ ozizi ọhụrụ a nke nwere ikike?” E nwere ike itinye akara edemede n’okwu Grik ka e wee jikọta “ozizi ọhụrụ” ozugbo na ajụjụ ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: O juru ha anya
  rationale: Nke a na-egosi na ihe ha hụrụ tụrụ ha n’anya nke ukwuu, ma ọ naghị etinye ike karịrị nke okwu Grik chọrọ.
- source_word: ἅπαντες
  choice: ha niile
  rationale: Ọ na-echekwa nkwusi ike na mmadụ niile nọ ebe ahụ sonyere na mmeghachi omume ahụ.
- source_word: ὥστε συζητεῖν
  choice: nke mere na ha malitere ịtụle okwu ahụ
  rationale: “Nke mere na” na-egosi nsonaazụ; “ịtụle okwu ahụ” na-egosi mkparịta ụka ha na ibe ha n’enweghị ime ka ọ bụrụ esemokwu.
- source_word: πρὸς ἑαυτούς
  choice: n’etiti onwe ha
  rationale: Ọ na-egosi na ndị nọ n’ìgwè ahụ na-ekwurịta okwu ahụ n’etiti ibe ha.
- source_word: Τί ἐστιν τοῦτο;
  choice: Gịnị bụ ihe a?
  rationale: Ọ bụ ajụjụ kpọmkwem nke na-echekwa ụjọ na ihe ijuanya dị n’okwu Grik.
- source_word: διδαχὴ καινή
  choice: Ozizi ọhụrụ
  rationale: “Ozizi” bụ okwu Igbo dị ugbu a ma doo anya maka ihe a na-akụzi; ọ naghị eme ka okwu ahụ bụrụ nkọwa okpukpe pụrụ iche.
- source_word: κατ’ ἐξουσίαν
  choice: nke nwere ikike
  rationale: Ọ na-ejikọta ikike ahụ na ozizi ahụ n’ụzọ dị mfe, ma ihe sochirinụ na-egosikwa ikike Jizọs n’inye mmụọ iwu.
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: mmụọ ndị na-adịghị ọcha
  rationale: Ọ na-echekwa echiche nke ἀκάθαρτος nke ọma karịa okwu ga-apụta naanị adịghị ọcha n’anụ ahụ.
- source_word: ἐπιτάσσει
  choice: ọ na-enye ... iwu
  rationale: Nkebiokwu a na-egosi iwu e nyere site n’ikike ma na-ada nke ọma n’Igbo nkịtị.
- source_word: ὑπακούουσιν αὐτῷ
  choice: ha ana-erubere ya isi
  rationale: Ọ na-egosi nrubeisi ha nye iwu ya, ọ bụghị naanị ịnụrụ ihe o kwuru.
theological_decisions:
- issue: Mmekọrịta “nke nwere ikike” na nhazi ahịrịokwu ahụ
  choice: “Ozizi ọhụrụ nke nwere ikike!” dị ka mkpu nke na-akọwa ozizi ahụ, ebe ahịrịokwu na-esote na-egosikwa ikike ahụ n’iwu e nyere mmụọ.
  alternative: “Gịnị bụ ihe a? Gịnị bụ ozizi ọhụrụ a nke nwere ikike?” ma ọ bụ ijikọ “n’ikike” kpọmkwem na ngwaa “ọ na-enye ... iwu.”
  rationale: Okwu Grik nwere ike ịnabata nhazi na akara edemede dị iche iche. Nsụgharị bụ isi na-agụ ya dị ka mkpu, ebe nkọwa ala peeji na-echekwa ohere nke ịgụ ya niile dị ka ajụjụ, n’enweghị idozi ihe mgbagwoju anya ahụ n’ike.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Mmụọ ndị na-adịghị ọcha” na-echekwa okwu Akwụkwọ Nsọ n’enweghị itinye nkọwa otu ụka pụrụ iche; “ana-erubere” na-egosi omume na-eme n’ọnọdụ a.
