  text: Καὶ εἰσπορεύονται εἰς Καφαρναούμ. καὶ ⸀εὐθὺς τοῖς σάββασιν ⸂ἐδίδασκεν εἰς τὴν συναγωγήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/021.yaml
  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: ig
  text: Ha banyere Kapanọm.[a] Ozugbo ahụ, n’Ụbọchị Izu Ike,[b] ọ nọ na-ezi ihe n’ụlọ nzukọ ndị Juu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ha na-abanye Kapanọm.” Mak na-ejikarị ngwaa nke oge ugbu a akọ ihe mere n’oge gara aga iji mee ka akụkọ dị ndụ.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ bụ “n’ụbọchị izu ike” n’ụdị ọtụtụ, ma nke a bụ akpaalaokwu nke nwere ike ịpụta “n’Ụbọchị Izu Ike.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ọ malitere izi ihe” ma ọ bụ “ọ ziri ihe.” Ụdị ngwaa Grik a nwere ike igosi omume na-aga n’ihu ma ọ bụ mmalite omume ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: Ha wee banye
  rationale: Ụdị ngwaa Grik a bụ historical present, nke Mak na-ejikarị eme ka akụkọ dị ndụ. “Ha wee banye” na-aga nke ọma n’usoro akụkọ Igbo ma na-echekwa echiche nke ịbanye n’ime ebe.
- source_word: Καφαρναούμ
  choice: Kapanọm
  rationale: A họọrọ ụdị aha obodo a maara nke ọma n’Igbo kama idegharị aha Bekee.
- source_word: εὐθύς
  choice: Ozugbo ahụ
  rationale: Nke a na-egosi ngwa ngwa na ịdị ọsọ nke εὐθύς n’akụkọ Mak, n’asụsụ Igbo doro anya ma dị ugbu a.
- source_word: τοῖς σάββασιν
  choice: n’ụbọchị izu ike
  rationale: Ọ bụ ezie na okwu Grik dị n’ụdị ọtụtụ, ọ bụ akpaalaokwu oge nke n’ebe a pụtara otu ụbọchị izu ike.
- source_word: ἐδίδασκεν
  choice: ọ nọ na-ezi ihe
  rationale: Ụdị imperfect nke Grik nwere ike igosi omume na-aga n’ihu. Nsụgharị a na-echekwa echiche ahụ n’ebughị ụzọ kpebie na ihe a na-emesi ike bụ mmalite omume ahụ.
- source_word: συναγωγήν
  choice: ụlọ nzukọ ndị Juu
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ebe ndị Juu na-ezukọ maka ofufe na nkuzi, ọ bụghị naanị nzukọ mmadụ n’ozuzu.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị mfe, nke ugwu ya ka dị, dee ya. E jiri “ụlọ nzukọ ndị Juu” mee ka ihe συναγωγή pụtara doo onye na-agụ akwụkwọ taa anya. E tinyere akara nkọwa ala peeji [a], [b], na [c] n’ebe okwu ndị ha na-akọwa dị n’ahịrịokwu.
