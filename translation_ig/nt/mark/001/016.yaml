source:
  edition: SBLGNT
  text: ⸂Καὶ παράγων⸃ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν Σίμωνα καὶ Ἀνδρέαν τὸν ⸀ἀδελφὸν Σίμωνος ⸀ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: ig
  text: Mgbe ọ na-aga n'akụkụ Osimiri Galili, ọ hụrụ Saịmọn na Andru, nwanne Saịmọn, ka ha na-atụ ụgbụ n'ime osimiri ahụ, n'ihi na ha bụ ndị ọkụ azụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ παράγων
  choice: Mgbe ọ na-aga
  rationale: Nkebi a na-egosi na ịga ya na ịhụ ha mere n'otu oge; “Mgbe ọ na-aga” na-enye nghọta a n'Igbo dị mfe ma ghara ime ka παράγων bụrụ ngwaa zuru ezu dị iche.
- source_word: παρὰ τὴν θάλασσαν
  choice: n'akụkụ Osimiri
  rationale: παρά na accusative na-egosi ngagharị n'akụkụ mmiri ahụ; “n'akụkụ” bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: Osimiri Galili
  rationale: Ọ bụ aha mpaghara a maara n'omenala nsụgharị Igbo. Ọ bụ ezie na mmiri a bụ ọdọ mmiri, θάλασσα bụ okwu isi mmalite ji mee ihe, ya mere e chekwara aha ọdịnala ahụ.
- source_word: εἶδεν
  choice: ọ hụrụ
  rationale: Nke a bụ ntụgharị kwụ ọtọ nke ngwaa ὁράω, na-enweghị ịgbakwunye echiche dịka ilebara anya pụrụ iche.
- source_word: Σίμωνα καὶ Ἀνδρέαν
  choice: Saịmọn na nwanne ya Andru
  rationale: A sụgharịrị aha ndị ahụ n'ụdị a na-aghọta n'Igbo, ebe njikọ nwanne dị na nkebi na-esote jikọtara ya n'ụzọ na-asụ ụtọ.
- source_word: τὸν ἀδελφὸν Σίμωνος
  choice: nwanne ya Andru
  rationale: Okwu Grik ahụ kọwara Andru dịka nwanne Saịmọn. “nwanne ya Andru” na-echekwa njikọ ahụ ma na-ezere nkwughachi aha Saịmọn na-adịghị mkpa n'Igbo.
- source_word: ἀμφιβάλλοντας
  choice: ka ha na-atụ ụgbụ
  rationale: Ngwaa ahụ pụtara ịtụ ụgbụ maka ịkụ azụ. Ịkpọ “ụgbụ” aha doro anya dị n'ime ihe ngwaa Grik ahụ pụtara.
- source_word: ἐν τῇ θαλάσσῃ
  choice: n'ime mmiri ahụ
  rationale: N'agbanyeghị na ἐν pụtarakarị “n'ime,” ya na ịtụ ụgbụ na-akọ ebe ụgbụ ahụ na-abanye. “n'ime mmiri ahụ” bụ Igbo e ji akọ omume ahụ n'ụzọ eke.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: n'ihi na ha bụ ndị ọkụ azụ
  rationale: γάρ na-enye ihe mere ha ji na-atụ ụgbụ; “n'ihi na” na-egosipụta nkọwa ahụ nke ọma n'Igbo.
theological_decisions: []
translation_notes:
  register: 'E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ chekwara usoro akụkọ: ịga Jizọs, ịhụ ụmụnne abụọ ahụ, ọrụ ha na-eme, na nkọwa na ha bụ ndị ọkụ azụ.'
