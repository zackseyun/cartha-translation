review_pass:
  verdict: revise
  source_fidelity: The draft preserves the ongoing passing, the location by the Sea of Galilee, the sighting, the net-casting activity, and the explanatory statement that the two men were fishermen. However, the rendering of Andrew's appositional identification is structurally ambiguous in Igbo.
  naturalness: The sentence is generally clear and uses natural Standard Igbo. Explicitly repeating Saịmọn in the kinship apposition is clearer and more idiomatic than relying on the pronoun ya after a coordinated pair of names.
  terminology: Osimiri Galili, Saịmọn, Andru, ụgbụ, and ndị ọkụ azụ are suitable Standard Igbo forms. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: “Saịmọn na nwanne ya Andru” / “nwanne ya Andru” leaves the referent of ya less precise after the coordinated names.
    rationale: Greek τὸν ἀδελφὸν Σίμωνος specifically identifies Andrew as Simon's brother. In Igbo, “Andru, nwanne Saịmọn” makes this apposition explicit without adding meaning.
  revised_text: Mgbe ọ na-aga n'akụkụ Osimiri Galili, ọ hụrụ Saịmọn na Andru, nwanne Saịmọn, ka ha na-atụ ụgbụ n'ime osimiri ahụ, n'ihi na ha bụ ndị ọkụ azụ.
