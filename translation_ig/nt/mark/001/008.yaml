  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: ig
  text: Mụ onwe m ji mmiri mee unu baptizim, ma ya onwe ya ga-eji Mmụọ Nsọ mee unu baptizim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ ọzọ, a pụrụ ịsị, “n’ime Mmụọ Nsọ.” Okwu Grik ahụ nwere ike ịpụta nke ọ bụla n’ime ụzọ abụọ a.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: Mụ onwe m
  rationale: E debere nnọchiaha ahụ n’ụzọ na-egosi nkwusi ike, ka ọdịiche dị n’etiti Jọn na onye ahụ na-abịa pụta ìhè.
- source_word: ἐβάπτισα
  choice: mee unu baptizim
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa omume baptizim; ọ na-echekwa echiche emume ahụ n’ebughị ụzọ kpebie kpọmkwem otú e si tinye mmadụ na mmiri.
- source_word: ὑμᾶς
  choice: unu
  rationale: Ụdị Igbo a na-egosi nke ọma na ihe a na-ekwu bụ ọtụtụ mmadụ.
- source_word: ὕδατι
  choice: ji mmiri
  rationale: ‘Ji mmiri’ na-egosi mmiri dị ka ihe e ji mee baptizim, ma na-ada nke ọma n’Igbo.
- source_word: αὐτὸς
  choice: ya onwe ya
  rationale: Ụdị a na-echekwa nkwusi ike na ọdịiche dị n’etiti ‘mụ onwe m’ na ‘ya onwe ya.’
- source_word: δὲ
  choice: ma
  rationale: ‘Ma’ na-egosi ọdịiche dị n’etiti baptizim Jọn na baptizim onye ahụ na-abịa.
- source_word: βαπτίσει
  choice: ga-eme unu baptizim
  rationale: E chekwara oge ọdịnihu na njikọ okwu ya na baptizim Jọn.
- source_word: ἐν
  choice: ga-eji
  rationale: N’ahịrịokwu bụ isi, ‘iji’ na-enye Igbo dị mfe ma na-edobe myirịta ya na ‘ji mmiri’; a hapụrụkwa nghọta ‘n’ime’ na nkọwa ala peeji.
- source_word: πνεύματι ἁγίῳ
  choice: Mmụọ Nsọ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ebe Mmụọ Nsọ nke Chineke nọ, ọ bụghị naanị ike dị nsọ na-abụghị onye.
theological_decisions:
- issue: Ma πνεύματι ἁγίῳ ọ na-ezo aka na Mmụọ Nsọ nke Chineke ka ọ bụ naanị ike dị nsọ
  choice: Mmụọ Nsọ
  alternative: mmụọ dị nsọ
  rationale: N’ọnọdụ Oziọma Mak, ọdịiche Jọn mere n’etiti baptizim ya na nke onye ka ya ike na-abịa na-egosi nke ọma na ọ na-ekwu maka Mmụọ Nsọ nke Chineke.
- issue: Otu e si ghọta ἐν n’okwu ἐν πνεύματι ἁγίῳ
  choice: iji Mmụọ Nsọ
  alternative: n’ime Mmụọ Nsọ
  rationale: Okwu Grik ahụ nwere ike igosi ihe e ji eme ihe ma ọ bụ ọnọdụ mmadụ nọ n’ime ya. E ji ‘iji’ mee ka Igbo dị mma ma kwekọọ na ‘ji mmiri,’ ebe nkọwa ala peeji na-echekwa nghọta ọzọ.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. ‘Mụ onwe m’ na ‘ya onwe ya’ na-echekwa nkwusi ike na ọdịiche dị na Grik; ‘mee baptizim’ na-echekwa ma ọdịnala okwu ahụ ma obosara ihe ọ pụtara.
