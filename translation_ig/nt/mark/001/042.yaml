  text: καὶ ⸀εὐθὺς ἀπῆλθεν ἀπ’ αὐτοῦ ἡ λέπρα, καὶ ἐκαθαρίσθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/042.yaml
  text: And immediately the leprosy left him[a], and he was cleansed.
translation:
  language: ig
  text: Ozugbo ahụ, ekpenta ahụ hapụrụ ya, e wee mee ka ọ dị ọcha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “e wee kpochaa ya.” Ngwaa a nwekwara ike igosi ime ka mmadụ dị ọcha n’usoro ofufe, ọ bụghị naanị ịgwọ ọrịa anụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Ozugbo ahụ
  rationale: Nke a na-egosi na ihe ahụ mere n’egbughị oge, ma na-edobekwa ọsọ e ji akọ akụkọ n’Oziọma Mak.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: hapụrụ ya
  rationale: N’Igbo dị ire, ‘hapụrụ ya’ na-egosipụta nke ọma echiche nke ọrịa ahụ isi n’ahụ ya pụọ.
- source_word: λέπρα
  choice: ekpenta ahụ
  rationale: ‘Ekpenta’ bụ okwu Igbo a na-ejikarị asụgharị ọrịa akpụkpọ ahụ a kpọrọ λέπρα n’Akwụkwọ Nsọ; ‘ahụ’ na-anọchi nnọchiaha njirimara dị n’asụsụ Grik.
- source_word: ἐκαθαρίσθη
  choice: e wee mee ka ọ dị ọcha
  rationale: Nke a na-echekwa ma echiche nke mgbake n’ọrịa ma nke iwepụ adịghị ọcha n’usoro ofufe, kama ịsụgharị ya naanị dị ka ‘a gwọrọ ya.’
theological_decisions:
- issue: Mmekọrịta dị n’etiti ọgwụgwọ anụ ahụ na ịdị ọcha n’usoro ofufe n’okwu καθαρίζω
  choice: e wee mee ka ọ dị ọcha
  alternative: e wee gwọọ ya
  rationale: Ihe odide ahụ abụghị naanị maka ọrịa ahụ ịkwụsị; n’ọnọdụ ekpenta n’Akwụkwọ Nsọ, ọ na-egosikwa iwepụ adịghị ọcha. Nsụgharị a na-edobe echiche abụọ ahụ n’etinyeghị ozizi ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa ugwu, dee ya. Ahịrịokwu ahụ na-edobe nkenke na ọsọ nke akụkọ Mak, ma na-echekwa nghọta abụọ dị na ἐκαθαρίσθη.
