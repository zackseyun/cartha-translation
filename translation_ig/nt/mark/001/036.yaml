review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents κατεδίωξεν with a stronger term than merely “searched for,” and ya properly refers to Jesus. However, the pronoun arrangement in “ndị ya na ha nọ” does not faithfully express οἱ μετ’ αὐτοῦ (“those who were with him”); it instead reads as those with whom Simon was present.
  naturalness: “Saimọn na ndị ha na ya nọ” is the clear, natural Standard Igbo way to identify Simon together with his companions. “Chụsooro ya” is an idiomatic completed-narrative rendering of the energetic pursuit.
  terminology: “Saimọn” follows ordinary Standard Igbo biblical name spelling. “Chụsooro” retains the force of καταδιώκω without importing a hostile motive. The footnote preserves “searched for” as a legitimate, less forceful contextual alternative.
  issues:
  - severity: medium
    issue: The phrase “ndị ya na ha nọ” reverses the intended relationship of the pronouns.
    rationale: οἱ μετ’ αὐτοῦ means “those with him,” namely people who were with Simon. In Igbo this is “ndị ha na ya nọ,” not “ndị ya na ha nọ.”
  - severity: low
    issue: The footnote’s alternative repeats the sequential particle “wee,” which is not part of the lexical alternative itself.
    rationale: Giving simply “chọọrọ ya” makes the alternative directly correspond to the verb and reads more naturally as a note.
  revised_text: Saimọn na ndị ha na ya nọ wee chụsooro ya[a].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “chọọrọ ya.” Ngwaa Grik ahụ pụrụ igosi ịchụso mmadụ n’ike, nke ụfọdụ na-ekwu n’ụzọ dị mfe dịka ịchọ ya.
    reason: lexical_alternative
  revision_rationale: The revision corrects the pronoun relationship so that Simon’s companions, rather than Simon’s associates in an inverted sense, are identified. It retains the narrative conjunction and the stronger sense of the Greek verb, while making the lexical-alternative footnote more focused and idiomatic.
