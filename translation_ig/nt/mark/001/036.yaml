- from: Saịmọn na ndị ya na ha nọ wee chụsoo ya[a].
  to: Saimọn na ndị ha na ya nọ wee chụsooro ya[a].
  rationale: The revision corrects the pronoun relationship so that Simon’s companions, rather than Simon’s associates in an inverted sense, are identified. It retains the narrative conjunction and the stronger sense of the Greek verb, while making the lexical-alternative footnote more focused and idiomatic.
