  text: And Simon and those with him pursued him,[a]
translation:
  language: ig
  text: Saimọn na ndị ha na ya nọ wee chụsooro ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “chọọrọ ya.” Ngwaa Grik ahụ pụrụ igosi ịchụso mmadụ n’ike, nke ụfọdụ na-ekwu n’ụzọ dị mfe dịka ịchọ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: wee
  rationale: Ọ na-ejikọta omume a na akụkọ bu ya ụzọ n’ụzọ Igbo si akọ akụkọ nke ọma, ma na-echekwa usoro njikọ dị mfe nke Mak.
- source_word: κατεδίωξεν
  choice: chụsoo
  rationale: Okwu Grik a nwere ike ịpụta ịchụ mmadụ n’azụ ya ma ọ bụ iji ịnụ ọkụ n’obi na-achọ ya. “Chụsoo” na-echekwa ike dị n’okwu ahụ karịa naanị “chọọ.”
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs n’ihe gbara amaokwu ahụ gburugburu.
- source_word: Σίμων
  choice: Saịmọn
  rationale: E dere aha onye ahụ dịka a na-asụ ya n’Igbo Standard.
- source_word: οἱ μετ’ αὐτοῦ
  choice: ndị ya na ha nọ
  rationale: Nke a na-egosipụta n'ụzọ doro anya ndị ha na Saịmọn nọ, n’agbanyeghị na usoro nnọchiaha Igbo dị iche na nke Grik.
