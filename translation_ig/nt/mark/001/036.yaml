translation_notes:
  register: Asụsụ Igbo Standard nke oge a, dị mfe nghọta ma dịkwa ugwu. E ji “chụsoo” chekwaa ike dị na καταδιώκω, ebe nkọwa ala peeji na-egosi ntụgharị ọzọ nwere ike ịdị nro.
