id: MRK.1.29
reference: Mark 1:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: ig
  text: Ozugbo ahụ, mgbe ha si n’ụlọ nzukọ ahụ pụta, ha na Jemis na Jọn wee banye n’ụlọ Saịmọn na Andru.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: Ozugbo ahụ
  rationale: N’Oziọma Mak, okwu a na-eme ka akụkọ na-aga ngwa ngwa; “Ozugbo ahụ” bụ Igbo doro anya ma na-echekwa ịdị ngwa ahụ.
- source_word: ἐκ τῆς συναγωγῆς
  choice: si n’ụlọ nzukọ ahụ pụta
  rationale: Nke a na-egosi isi n’ime ụlọ nzukọ pụta; “ụlọ nzukọ” bụ okwu Igbo a na-aghọta nke ọma maka συναγωγή n’ọnọdụ a.
- source_word: ἐξελθόντες ἦλθον
  choice: mgbe ha ... pụta, ha ... wee banye
  rationale: 'Nhazi a na-echekwa usoro omume abụọ ahụ: ha buru ụzọ pụta, mesịa banye n’ụlọ ahụ.'
- source_word: ἦλθον
  choice: wee banye
  rationale: Ebe εἰς na-egosi ngagharị banye n’ime ụlọ, “banye” na-enye Igbo eke ma na-echekwa ebe ngagharị ahụ kwụsịrị.
- source_word: εἰς τὴν οἰκίαν
  choice: n’ụlọ
  rationale: “Banye n’ụlọ” na-egosipụta ngagharị banye n’ime ebe obibi ahụ n’ụzọ Igbo si ekwu ya.
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: Saịmọn na Andru
  rationale: A sụgharịrị aha ndị a n’ụdị mkpọpụta a na-ejikarị n’Igbo; njikọ ha na “ụlọ” na-egosi na ọ bụ ụlọ ha.
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: ha na Jemis na Jọn
  rationale: μετά na genitive na-egosi iso mmadụ; nhazi “ha na ...” bụ ụzọ Igbo eke isi gosipụta ndị so ha.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ụlọ nzukọ” mee synagogue, a hapụkwara esemokwu ụka ọ bụla n’èzí. Ahịrịokwu ahụ na-echekwa ọsọ akụkọ Mak na usoro omume ndị dị n’asụsụ Grik.
