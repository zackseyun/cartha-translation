revisions:
- from: Mgbe e nyefechara Jọn n’aka ndị ọchịchị[a], Jizọs bịara na Galili, na-ekwusa ozi ọma nke Chineke[b].
  to: Mgbe e nyefere Jọn[a], Jizọs bịara na Galili, na-ekwusa ozi ọma nke Chineke[b].
  rationale: The revision removes unsupported specification of those to whom John was handed over and corrects the corresponding footnote wording. It thereby preserves the deliberate openness and later passion-language resonance of παραδοθῆναι while retaining the draft’s otherwise sound Standard Igbo rendering.
  reviewer_model: gpt-5.6-terra
