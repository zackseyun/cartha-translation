id: MRK.1.14
reference: Mark 1:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂Καὶ μετὰ⸃ τὸ παραδοθῆναι τὸν Ἰωάννην ἦλθεν ὁ Ἰησοῦς εἰς τὴν Γαλιλαίαν κηρύσσων τὸ ⸀εὐαγγέλιον τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/014.yaml
  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: ig
  text: Mgbe e nyefere Jọn[a], Jizọs bịara na Galili, na-ekwusa ozi ọma nke Chineke[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mgbe e jidere Jọn.” Grik ahụ kwuru n’ụzọ nkịtị karịa, “mgbe e nyefere Jọn,” bụkwa okwu yiri nke Mak ji emesịa kọwaa inyefe Jizọs.
    reason: lexical_alternative
  - marker: b
    text: “Nke Chineke” nwere ike ịpụta ozi ọma nke si n’aka Chineke, nke bụ nke Chineke, ma ọ bụ nke lekwasịrị anya na Chineke.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: mgbe e nyefechara ... n’aka ndị ọchịchị
  rationale: Nkebiokwu a na-egosi oge, ‘mgbe ... gasịrị.’ ‘Nyefee n’aka’ na-echekwa echiche παραδίδωμι nke inyefe mmadụ n’aka ndị ọzọ, ma mee ka njikọ ya na okwu Mak ji emesịa kọwaa ahụhụ Jizọs nọgide pụta ìhè. A gbakwụnyere ‘ndị ọchịchị’ iji mee ka Igbo doo anya n’enweghị ikwu kpọmkwem na e jidere ya.
- source_word: Ἰωάννην
  choice: Jọn
  rationale: Ụdị aha Ἰωάννης a na-ejikarị eme ihe n’Igbo.
- source_word: ἦλθεν
  choice: bịara
  rationale: ‘Bịara’ na-enye अर्थ nkịtị nke ἔρχομαι ebe a, n’enweghị ime ka ọ bụrụ naanị ‘rutere.’
- source_word: εἰς τὴν Γαλιλαίαν
  choice: na Galili
  rationale: N’Igbo nkịtị, ‘bịara na Galili’ na-egosi ịbata ma ọ bụ ịga ebe ahụ n'ụzọ doro anya, ọ bụ ezie na εἰς nwere ike ikwusi ngagharị banye ebe ahụ ike.
- source_word: κηρύσσων
  choice: na-ekwusa
  rationale: ‘Na-ekwusa’ na-egosi ịkpọsa ozi n’ihu ọha dịka κηρύσσω si pụta, ma bụrụkwa okwu Igbo dị mfe nghọta.
- source_word: εὐαγγέλιον
  choice: ozi ọma
  rationale: ‘Ozi ọma’ na-egosipụta kpọmkwem ihe εὐαγγέλιον pụtara, ma ghara ịdabere naanị n’okwu ụka pụrụ iche.
- source_word: τοῦ θεοῦ
  choice: nke Chineke
  rationale: '‘Nke Chineke’ na-ahapụ genitive Grik ahụ ka ọ saa mbara: ozi ahụ nwere ike isi n’aka Chineke, bụrụ nke ya, ma ọ bụ gbasara ya.'
theological_decisions:
- issue: Otu e si tụgharịa παραδοθῆναι n’ụzọ kwekọrọ n’okwu Mak ji akọ banyere ahụhụ
  choice: e nyefechara Jọn n’aka ndị ọchịchị
  alternative: mgbe e jidere Jọn
  rationale: ‘Nyefee n’aka’ na-echekwa nkwughachi okwu Mak ji emesịa maka inyefe Jizọs, ebe ‘jidere’ ga-akọwa ihe ahụ kpọmkwem karịa ka Grik si kwuo.
- issue: Ihe genitive pụtara na τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ozi ọma nke Chineke
  alternative: ozi ọma si n’aka Chineke; ozi ọma gbasara Chineke
  rationale: Ụdị a na-echekwa ọtụtụ nghọta kwe omume kama ịhọrọ naanị na ozi ahụ si n’aka Chineke ma ọ bụ na ọ bụ banyere Chineke.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agba nke ọma n’Igbo ma na-echekwa isi mgbagwoju anya dị na Grik. E tinyere akara ndetu ala ala [a] na [b] n’ebe okwu ha metụtara dị n’ahịrịokwu.
