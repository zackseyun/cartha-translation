    text: A pụkwara ịsị, “mgbe e jidere Jọn.” Grik ahụ kwuru n’ụzọ nkịtị karịa, “mgbe e nyefere Jọn,” bụkwa okwu yiri nke Mak ji emesịa kọwaa inyefe Jizọs.
    reason: lexical_alternative
  - marker: b
    text: “Nke Chineke” nwere ike ịpụta ozi ọma nke si n’aka Chineke, nke bụ nke Chineke, ma ọ bụ nke lekwasịrị anya na Chineke.
    reason: alternative_reading
  revision_rationale: The revision removes unsupported specification of those to whom John was handed over and corrects the corresponding footnote wording. It thereby preserves the deliberate openness and later passion-language resonance of παραδοθῆναι while retaining the draft’s otherwise sound Standard Igbo rendering.
