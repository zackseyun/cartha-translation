revisions:
- from: Ọ sịrị ya, “Lezie anya ka ị ghara ịgwa onye ọ bụla ihe ọ bụla. Kama, gaa gosi onye nchụaja onwe gị, chụọkwa maka ime ka ị dị ọcha ihe Mosis nyere n’iwu, ka ọ bụrụ ihe akaebe nye ha.[a]”
  to: Ọ gwara ya, sị, “Lezie anya ka ị ghara ịgwa onye ọ bụla ihe ọ bụla. Kama, gaa gosi onwe gị onye nchụaja, chụọkwa àjà maka ịdị ọcha gị dịka Mosis nyere n’iwu, ka ọ bụrụ ihe akaebe nye ha.[a]”
  rationale: The revision improves Standard Igbo idiom and clarifies the cultic offering while retaining the source text’s scope. It preserves the comprehensive prohibition (“onye ọ bụla ... ihe ọ bụla”), the priestly presentation, the Mosaic command, and the unresolved reference and force of “nye ha.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:50Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition, the command to appear before the priest, and the deliberately broad sense of εἰς μαρτύριον αὐτοῖς. However, “maka ime ka ị dị ọcha” can sound as though the offering itself causes the healing, whereas περὶ τοῦ καθαρισμοῦ σου refers to the man's cleansing/purification. The construction “chụọkwa ... ihe Mosis nyere n’iwu” is also less idiomatic Igbo for the prescribed sacrificial offering.
  naturalness: “Gosi onye nchụaja onwe gị” is understandable but marked word order; “gosi onwe gị onye nchụaja” is more natural. “Chụọ àjà ... dịka Mosis nyere n’iwu” is clear, natural in biblical register, and expresses the cultic force of προσένεγκε.
  terminology: Use “àjà” explicitly for the prescribed offering. “Ịdị ọcha gị” appropriately renders the cleansing/purification context without implying that the man has not already been cleansed. “Ihe akaebe nye ha” preserves the source ambiguity and avoids importing “megide.”
  issues:
  - severity: medium
    issue: The phrase “maka ime ka ị dị ọcha” may imply a causative cleansing yet to occur.
    rationale: The Greek τοῦ καθαρισμοῦ σου denotes the man's cleansing/purification in the context of the prescribed rite; “maka ịdị ọcha gị” is more faithful and idiomatic.
  - severity: low
    issue: “Chụọkwa ... ihe Mosis nyere n’iwu” is awkward without an explicit sacrificial noun.
    rationale: Since προσένεγκε is cultic and the Mosaic prescription concerns offerings, “chụọ àjà ... dịka Mosis nyere n’iwu” communicates the intended action naturally without material interpretive expansion.
  - severity: low
    issue: The reflexive phrase has less natural word order.
    rationale: “Gosi onwe gị onye nchụaja” is the ordinary and clear Igbo arrangement for “show yourself to the priest.”
  revised_text: Ọ gwara ya, sị, “Lezie anya ka ị ghara ịgwa onye ọ bụla ihe ọ bụla. Kama, gaa gosi onwe gị onye nchụaja, chụọkwa àjà maka ịdị ọcha gị dịka Mosis nyere n’iwu, ka ọ bụrụ ihe akaebe nye ha.[a]”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịghọta ya dịka “ihe akaebe megide ha.” Okwu Grik ahụ nwere ike ịpụta ihe e gosiri ndị nchụaja ma ọ bụ ndị ọzọ dịka ihe akaebe; ụfọdụ na-aghọta ya n’ụzọ siri ike dịka ihe akaebe megide ha.
    reason: alternative_reading
  revision_rationale: The revision improves Standard Igbo idiom and clarifies the cultic offering while retaining the source text’s scope. It preserves the comprehensive prohibition (“onye ọ bụla ... ihe ọ bụla”), the priestly presentation, the Mosaic command, and the unresolved reference and force of “nye ha.”
