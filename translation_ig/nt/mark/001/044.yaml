id: MRK.1.44
reference: Mark 1:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: ig
  text: Ọ gwara ya, sị, “Lezie anya ka ị ghara ịgwa onye ọ bụla ihe ọ bụla. Kama, gaa gosi onwe gị onye nchụaja, chụọkwa àjà maka ịdị ọcha gị dịka Mosis nyere n’iwu, ka ọ bụrụ ihe akaebe nye ha.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta ya dịka “ihe akaebe megide ha.” Okwu Grik ahụ nwere ike ịpụta ihe e gosiri ndị nchụaja ma ọ bụ ndị ọzọ dịka ihe akaebe; ụfọdụ na-aghọta ya n’ụzọ siri ike dịka ihe akaebe megide ha.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα
  choice: Lezie anya ka
  rationale: Nke a na-egosipụta iwu siri ike nke ịdọ aka ná ntị ma na-eduga n’ihe a machibidoro, n’Igbo dị ugbu a ma doo anya.
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: ị ghara ịgwa onye ọ bụla ihe ọ bụla
  rationale: 'Ọ na-echekwa nkwuwa okwu abụọ nke Grik: ọ bụghị onye ọ bụla, ọ bụghịkwa ihe ọ bụla.'
- source_word: ἀλλὰ
  choice: Kama
  rationale: Ọ na-egosipụta mgbanwe site n’ihe nwoke ahụ na-ekwesịghị ime gaa n’ihe o kwesịrị ime.
- source_word: ὕπαγε
  choice: gaa
  rationale: Ọ bụ iwu ngagharị dị mfe ma bụrụkwa okwu Igbo kacha kwekọọ na ya.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: gosi onye nchụaja onwe gị
  rationale: Ọ na-echekwa nnọchiaha nloghachi nke Grik ma na-egosi na onye nchụaja ga-enyocha ya dịka Iwu si dị.
- source_word: ἱερεῖ
  choice: onye nchụaja
  rationale: Ọ na-ezo aka n’aka onye nchụaja kwesịrị ekwesị maka nyocha ahụ, n’enweghị ịgbakwụnye nkọwa na-adịghị na amaokwu ahụ.
- source_word: προσένεγκε
  choice: chụọkwa
  rationale: N’ọnọdụ ofufe na àjà a, ‘chụọ’ na-egosipụta iweta ihe a chọrọ nye Chineke karịa okwu izugbe dịka ‘weta.’
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: maka ime ka ị dị ọcha
  rationale: Ọ na-egosipụta nzube metụtara emume ime ka onye ahụ dị ọcha, ma bụrụ okwu ndị nkịtị na-aghọta.
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: ihe Mosis nyere n’iwu
  rationale: Ọ na-anọchi ọtụtụ ihe iwu ahụ chọrọ n’ụzọ Igbo dị mfe ma ghara ịkọwapụta ihe ndị amaokwu ahụ akpọghị aha.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ka ọ bụrụ ihe akaebe nye ha
  rationale: Ọ na-echekwa echiche nke nzube ma ọ bụ ihe ga-esi na ya pụta, tinyere nghọta sara mbara nke ‘ihe akaebe,’ n’akọwaghị ma ọ bụ nye ha ka ọ bụ megide ha.
theological_decisions:
- issue: Ndị okwu ‘nye ha’ na-ezo aka na ha, na ụdị ihe akaebe ahụ
  choice: E debere ya sara mbara dịka ‘ihe akaebe nye ha.’
  alternative: ‘Ihe akaebe megide ha,’ ma ọ bụ ‘ihe akaebe nye ndị nchụaja.’
  rationale: Grik akpọghị ndị ‘ha’ bụ aha, ọ naghịkwa etinye okwu pụtara ‘megide.’ Nsụgharị a na-echekwa ma ndị ọ na-ezo aka na ha ma ike okwu ahụ n’amaghị ama, n’etinyeghị nghọta esemokwu n’ime ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke kwụ ọtọ ma dị nsọ n’ụzọ kwesịrị Akwụkwọ Nsọ. E zere okwu ụka pụrụ iche, ma chekwaa nkwuwa okwu nke iwu ahụ na nghọta abụọ dị n’okwu ikpeazụ.
