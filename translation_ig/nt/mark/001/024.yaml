id: MRK.1.24
reference: Mark 1:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγων· ⸀Τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: ig
  text: na-asị, “Gịnị ka anyị na gị nwekọrọ[a], Jizọs onye Nazaret[b]? Ị bịara ibibi anyị? Amaara m onye ị bụ—Onye Nsọ nke Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Gịnị dị n’etiti anyị na gị?” Akpaalaokwu Grik a na-egosi ikewapụ onwe ma ọ bụ mmegide.
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ, “Jizọs si Nazaret.” N’asụsụ Grik: “Jizọs onye Nazaret.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: na-asị
  rationale: E ji nkebi ngwaa na-aga n’ihu sụgharịa participle a n’enweghị itinye onye ọhụrụ na-eme omume ahụ; ọ na-ejikọta okwu a na ihe e kwuru n’amaokwu bu ya ụzọ.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Gịnị ka anyị na gị nwekọrọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma dị ndụ isi gosipụta akpaalaokwu Grik nke na-egosi ikewapụ onwe ma ọ bụ mmegide, n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Jizọs onye Nazaret
  rationale: “Jizọs” bụ aha a na-ejikarị na Standard Igbo; “onye Nazaret” na-egosipụta ụdị ịkpọ mmadụ Ναζαρηνέ, kama ime ya naanị nkọwa banyere ebe o si.
- source_word: ἦλθες
  choice: Ị bịara
  rationale: Oge gara aga dị mfe n’Igbo na-enye ajụjụ a ụda ebumpụta ụwa ma na-egosipụta ọbịbịa ahụ nke nwere nzube a na-ajụ banyere ya.
- source_word: ἀπολέσαι
  choice: ibibi
  rationale: “Ibibi” na-egosipụta mbibi zuru ezu ma dabara n’ọnọdụ ịchụ mmụọ ọjọọ a.
- source_word: ἡμᾶς
  choice: anyị
  rationale: E chekwara nnọchiaha ọtụtụ nke onye mbụ dịka ọ dị n’asụsụ Grik.
- source_word: οἶδά σε τίς εἶ
  choice: Amaara m onye ị bụ
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke ebumpụta ụwa n’Igbo isi kwuo nkwupụta nke ịmata onye Jizọs bụ.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: Onye Nsọ nke Chineke
  rationale: A sụgharịrị ya dịka aha pụrụ iche ma chekwaa njikọ genitive “nke Chineke,” n’enweghị ịgbakwunye nkọwa ozizi.
theological_decisions:
- issue: Aha Kraịst nke mmụọ ọjọọ ji mata ya
  choice: Onye Nsọ nke Chineke
  alternative: Onye Nsọ Chineke
  rationale: Nhọrọ a na-echekwa ike aha pụrụ iche ahụ na njikọ ya na Chineke, ma ọ naghị agbasawanye nkwupụta ahụ ka ọ bụrụ nkọwa ozizi zuru ezu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. E chekwara ajụjụ abụọ ahụ, nnọchiaha ọtụtụ “anyị,” na aha pụrụ iche “Onye Nsọ nke Chineke.”
