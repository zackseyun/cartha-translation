  text: ἡ δὲ πενθερὰ Σίμωνος κατέκειτο πυρέσσουσα, καὶ ⸀εὐθὺς λέγουσιν αὐτῷ περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/030.yaml
  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: ig
  text: Nne nwunye Saịmọn dina ala, ahụ ọkụ na-agba ya; ozugbo ahụkwa, ha gwara ya banyere nwanyị ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, okwu ahụ bụ n’oge ugbu a: “ha na-agwa ya.” E ji oge ugbu a kọọ ihe mere n’oge gara aga iji mee ka akụkọ ahụ dị ndụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πενθερὰ
  choice: nne nwunye
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa nne di ma ọ bụ nne nwunye; n’ebe a, ọ bụ nne nwunye Saịmọn.
- source_word: κατέκειτο
  choice: dina ala
  rationale: Ọ na-egosi ọnọdụ nọgidere na-aga n’oge ahụ, ya bụ na nwanyị ahụ dina n’ihi ọrịa, n’etinyeghị echiche siri ike na ọ naghị esi n’àkwà ebili ma ọlị.
- source_word: πυρέσσουσα
  choice: ọkụ na-agba ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ihe kwa ụbọchị iji kwuo na mmadụ nwere ahụ ọkụ.
- source_word: εὐθὺς
  choice: ozugbo ahụ
  rationale: Ọ na-edobe echiche nke ime ihe n’egbughị oge, nke Mak na-ejikarị eme ka akụkọ ya na-aga ngwa ngwa.
- source_word: λέγουσιν
  choice: ha gwara ya
  rationale: A sụgharịrị historical present Grik ahụ n’oge gara aga ka akụkọ ahụ daa nke ọma n’Igbo; nkọwa ala peeji na-egosi ọdịdị okwu Grik ahụ.
- source_word: περὶ αὐτῆς
  choice: banyere nwanyị ahụ
  rationale: Nke a na-enye ihe περί na genitive pụtara, ma na-ezere mgbagwoju anya nke iji nnọchiaha ‘ya’ ugboro abụọ n’otu ahịrịokwu.
- source_word: δὲ
  choice: — / njikọ e gosipụtara site n’usoro ahịrịokwu
  rationale: δὲ bụ njikọ dị nro n’akụkọ a. A naghị etinye okwu dịka ‘ugbu a’ n’ihi na isi mmalite ahụ enweghị okwu oge doro anya; usoro ahịrịokwu na ‘ahụkwa’ na-ebuga akụkọ n’ihu.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe dị mfe, nke ugwu dị na ya. Nkebi ahịrịokwu ‘ọkụ na-agba ya’ bụ okwu nkịtị ma doo anya maka ịrịa ahụ ọkụ. E debere ọsọ akụkọ Mak site n’okwu ‘ozugbo ahụkwa,’ ebe a sụgharịrị historical present n’oge gara aga ka ọ bụrụ Igbo na-aga nke ọma.
