review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus speaking to a plural audience and the prospective transformation implied by ποιήσω ὑμᾶς γενέσθαι. However, ‘ndị na-akụta mmadụ’ means people who catch people and does not explicitly retain the fishing image in ἁλιεῖς (‘fishers’). ‘emekwa’ can also introduce an unwarranted additive sense (‘also’).
  naturalness: ‘Bịanụ soro m’ is a clear, natural Standard Igbo invitation corresponding to Δεῦτε ὀπίσω μου. ‘ndị na-akụ mmadụ azụ’ is the established and intelligible Igbo metaphor for fishing for people, while preserving the deliberately striking image.
  terminology: ‘Jizọs,’ plural ‘ha/unu,’ and ‘mmadụ’ as a collective human referent are appropriate. The revised fishing expression retains the lexical image without importing an explanation or theological interpretation.
  issues:
  - severity: medium
    issue: The expression ‘ndị na-akụta mmadụ’ omits the explicit fishing component of ἁλιεῖς.
    rationale: Although ‘akụta’ can mean ‘catch,’ it does not by itself specify fishing and can suggest apprehending people. The Greek uses the specific occupational metaphor ‘fishers of people.’
  - severity: low
    issue: ‘m ga-emekwa’ may imply ‘I will also make.’
    rationale: The Greek conjunction simply coordinates the clauses here; ‘m ga-eme ka’ conveys the future causative statement without a possible extra additive nuance.
  revised_text: Jizọs wee sị ha, “Bịanụ soro m, m ga-eme ka unu ghọọ ndị na-akụ mmadụ azụ.”
