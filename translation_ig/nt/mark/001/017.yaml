  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς γενέσθαι ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: ig
  text: Jizọs wee sị ha, “Bịanụ soro m, m ga-eme ka unu ghọọ ndị na-akụ mmadụ azụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: Sorọnụ m
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke e ji akpọ mmadụ ka ọ bụrụ onye na-eso ụzọ; ọ na-eburu echiche nkịtị nke ‘bịanụ n’azụ m’ n’enweghị asụsụ siri ike.
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: m ga-emekwa ka unu ghọọ
  rationale: E debere ma echiche nke ime ka ihe mee (ποιήσω) ma nke ịghọ ihe n’usoro oge (γενέσθαι), kama ime ka ha bụrụ naanị ‘m ga-eme unu.’
- source_word: ἁλιεῖς ἀνθρώπων
  choice: ndị na-akụta mmadụ
  rationale: ‘Ndị na-akụta’ na-echekwa ihe atụ nke ọrụ ịkụ azụ, ebe ‘mmadụ’ bụ aha mkpokọta nkịtị n’Igbo nke na-agụnye ụmụ mmadụ n’ozuzu, dịka ἀνθρώπων.
theological_decisions:
- issue: Ihe atụ nke ịkụ mmadụ dịka azụ
  choice: ndị na-akụta mmadụ
  alternative: ndị ọkụ azụ mmadụ
  rationale: Nhọrọ a na-echekwa ihe atụ ahụ ma na-ada nke ọma n’Igbo oge a; ọ naghị akọwa n’ime amaokwu ahụ ihe ‘ịkụta mmadụ’ pụtara, ya mere ọ na-echekwa mkpakọrịta na nghọta sara mbara nke okwu Jizọs.
- issue: Usoro ịghọ ndị na-akụta mmadụ
  choice: m ga-emekwa ka unu ghọọ
  alternative: m ga-eme unu ndị na-akụta mmadụ
  rationale: Nke a na-echekwa γενέσθαι, nke nwere echiche nke ịbịaghachi bụrụ ma ọ bụ itolite ghọọ ihe ahụ, na-enweghị itinye ozizi pụrụ iche banyere otú mgbanwe ahụ ga-esi mee.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị nsọ ma dị mfe nghọta. E jiri ‘unu’ mee ka o doo anya na Jizọs na-agwa ọtụtụ mmadụ okwu. Enweghị akara nkọwa ala peeji n’ihi na ederede a achọghị nke ọ bụla.
