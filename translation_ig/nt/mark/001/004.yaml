id: MRK.1.4
reference: Mark 1:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγένετο Ἰωάννης ⸀ὁ βαπτίζων ἐν τῇ ⸀ἐρήμῳ κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/004.yaml
  text: John the Baptist appeared in the wilderness[a], proclaiming a baptism of repentance for the forgiveness of sins.
translation:
  language: ig
  text: Jọn Onye Na-eme Baptizim pụtara n’ọzara[a], na-ekwusa baptizim nke nchegharị maka mgbaghara mmehie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Jọn pụtara n’ọzara, na-eme baptizim ma na-ekwusa…” Okwu Grik ahụ nwere ike ịkọwa ọrụ Jọn kama iji ya mee aha e ji amata ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: pụtara
  rationale: N’akụkọ Mak, okwu a na-ewebata mmadụ ka onye pụtara n’ebe akụkọ ahụ na-aga; “pụtara” na-enye echiche a n’Igbo n’enweghị ntụgharị siri ike dịka “ọ ghọrọ.”
- source_word: Ἰωάννης
  choice: Jọn
  rationale: E ji ụdị aha a maara nke ọma n’Igbo dee aha Grik ahụ.
- source_word: ὁ βαπτίζων
  choice: Onye Na-eme Baptizim
  rationale: Nkebiokwu a na-akọwa Jọn site n’ọrụ baptizim ọ na-arụ. Nsụgharị a bụ aha ọrụ doro anya ma bụrụkwa nke ndị na-agụ Igbo maara.
- source_word: ἐν τῇ ἐρήμῳ
  choice: n’ọzara
  rationale: “Ọzara” na-egosi ebe mmadụ na-ebighị nke ọma, ma ọ naghị amanye echiche na ọ bụ naanị ala aja.
- source_word: κηρύσσων
  choice: na-ekwusa
  rationale: “Na-ekwusa” na-echekwa echiche nke onye ozi na-akpọsa ozi n’ihu ọha.
- source_word: βάπτισμα
  choice: baptizim
  rationale: Nke a bụ okwu a nabatara n’Igbo maka emume ahụ Grik na-ekwu maka ya.
- source_word: μετανοίας
  choice: nke nchegharị
  rationale: “Nchegharị” na-egosi ịgbanwe uche na ụzọ ndụ n’ebe mmehie dị; njikọ “nke” na-echekwa njikọ genitiv nke Grik n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: maka mgbaghara mmehie
  rationale: “Maka” nwere ike ibu echiche ebumnuche ma ọ bụ ihe na-esi na ya pụta, dị ka εἰς si dị ebe a, n’enweghị idozi arụmụka banyere otú baptizim, nchegharị, na mgbaghara si metụta ibe ha.
theological_decisions:
- issue: Mmekọrịta dị n’etiti baptizim, nchegharị, na mgbaghara mmehie
  choice: baptizim nke nchegharị maka mgbaghara mmehie
  alternative: baptizim na-egosi nchegharị nke na-eweta mgbaghara mmehie
  rationale: A hapụrụ njikọ ahụ dịka Grik si kwuo ya. E tinyeghị nkọwa na baptizim bụ naanị ihe nnọchianya, ma ọ bụ na ọ bụ ya n’onwe ya na-arụpụta mgbaghara.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta, dee ya. E debere okwu ndị Ndị Kraịst Igbo maara—“baptizim,” “nchegharị,” na “mgbaghara mmehie”—ma zere ịgbakwunye nkọwa ụka pụrụ iche.
