  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ φωνὴ ἐγένετο ἐκ τῶν οὐρανῶν· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν ⸀σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: ig
  text: Otu olu si n’eluigwe[a] bịa, sị, “Ị bụ Nwa m m hụrụ n’anya; n’ebe ị nọ ka obi m dị m ụtọ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, “eluigwe” bụ n’ụdị ọtụtụ (“eluigwe ndị ahụ”). N’Igbo, “eluigwe” anaghị egosi ọdịiche dị n’etiti otu na ọtụtụ n’ụzọ doro anya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “n’ebe ị nọ ka m nwere mmasị,” ma ọ bụ “Gị masịrị m nke ukwuu.”
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: Olu wee ... bịa
  rationale: Nke a na-egosi na olu ahụ pụtara n’akụkọ ahụ ma na-ada nke ọma n’Igbo, kama ịsụ ya n’ụzọ siri ike dị ka ‘olu mere.’
- source_word: ἐκ τῶν οὐρανῶν
  choice: si n’eluigwe
  rationale: ‘Si ... bịa’ na-egosi ebe olu ahụ si. Okwu Igbo ‘eluigwe’ anaghị agbanwe ọdịdị ya mgbe ọ bụ otu ma ọ bụ ọtụtụ; ya mere, nkọwa ala peeji na-eme ka o doo anya na Grik jiri ụdị ọtụtụ.
- source_word: Σὺ εἶ
  choice: Ị bụ
  rationale: Nnọchiaha e dere kpọmkwem na Grik na-eme ka okwu ahụ bụrụ nke a gwara Jizọs ihu na ihu; ‘Ị bụ’ na-echekwa nke a n’Igbo.
- source_word: ὁ υἱός μου
  choice: Nwa m
  rationale: ‘Nwa m’ bụ ụzọ Igbo dị mfe ma kwekọọ n’okike isi kwuo mmekọrịta nna na nwa ebe a. A zere ‘Ọkpara m,’ n’ihi na ọ pụtara nwa nwoke mbụ ma tinye echiche na-adịghị n’okwu Grik a.
- source_word: ὁ ἀγαπητός
  choice: onye m hụrụ n’anya
  rationale: Nke a na-egosipụta ịhụnanya nke ἀγαπητός n’Igbo nkịtị ma dị ùgwù. Rịkọm ahụ na-enyere aka igosi na ọ bụ nkọwa gbasara Nwa ahụ.
- source_word: ἐν σοὶ
  choice: n’ime gị
  rationale: Nke a na-esochi preposition Grik ἐν nke ọma ma na-ahapụ ohere nghọta dị n’okwu mbụ, kama ịgbanwe ya ozugbo ka ọ bụrụ naanị ‘n’ebe ị nọ.’
- source_word: εὐδόκησα
  choice: ka obi dị m ụtọ
  rationale: Akpaalaokwu Igbo a na-egosi nnabata na ihe ụtọ Chineke nwere n’ebe Nwa ahụ nọ. Ọ na-ebute ike okwu ahụ n’oge a, ebe nkọwa ala peeji na-enye ụzọ ndị ọzọ e nwere ike isi ghọta aorist ahụ.
theological_decisions:
- issue: Otu e si akọwa okwu Chineke gwara Jizọs n’enweghị ibelata ịdị mkpa ya dị ka Nwa
  choice: Nwa m, onye m hụrụ n’anya
  alternative: Nwa m m hụrụ n’anya; Ọkpara m m hụrụ n’anya
  rationale: Nhọrọ a na-echekwa ma njirimara ya dị ka Nwa ma ịhụnanya Chineke nwere n’ebe ọ nọ, n’etinyeghị echiche nke ‘ọkpara’ ma ọ bụ okwu nkwenkwe e mepụtara mgbe e mesịrị.
- issue: Ma a ga-egosi ụdị ọtụtụ nke οὐρανῶν kpọmkwem n’ahịrị bụ isi
  choice: si n’eluigwe, tinyere nkọwa ala peeji na Grik bụ ọtụtụ
  alternative: si n’eluigwe dị iche iche; si n’eluigwe niile
  rationale: N’Igbo, aha ‘eluigwe’ anaghị enwe akara pụrụ iche maka otu ma ọ bụ ọtụtụ. Ịtinye ‘dị iche iche’ ma ọ bụ ‘niile’ ga-agbakwunye echiche nke Grik ekwughị kpọmkwem; ya mere, a na-echekwa ozi gbasara ọtụtụ na nkọwa ala peeji.
- issue: Oge na ụdị nnabata dị na εὐδόκησα
  choice: n’ime gị ka obi dị m ụtọ
  alternative: n’ime gị ka m nwere mmasị; ihe banyere gị masịrị m
  rationale: Okwu a na-egosipụta nkwado na ihe ụtọ Chineke ma na-ahapụ esemokwu dị n’etiti aorist Grik na ike okwu ahụ nwere ugbu a. A naghị eme ya ka ọ bụrụ nkwupụta ozizi karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke oge a ma dị ùgwù dee ya. Ahịrịokwu ahụ dị mfe maka ndị nkịtị ịghọta, ma a zere ‘Ọkpara’ n’ihi echiche ‘nwa mbụ’ ọ na-agbakwụnye. E debere ‘Nwa’ na mkpụrụedemede ukwu iji gosi na ọ bụ aha njirimara e ji agwa Jizọs kpọmkwem n’ọnọdụ a, n’etinyeghị nkọwa ozizi ọzọ.
