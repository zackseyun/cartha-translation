    reason: alternative_reading
  revision_rationale: The revision improves idiomatic Standard Igbo while preserving the Greek’s indefinite voice, plural “heavens” note, direct address, “beloved Son,” and the relational ambiguity of ἐν σοὶ. It does not introduce “firstborn,” later doctrinal language, or a stronger interpretive claim than the source supports.
