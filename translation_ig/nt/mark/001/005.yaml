reference: Mark 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: ig
  text: Ndị mmadụ sitere n’akụkụ niile nke Judia na ndị niile bi na Jerusalem nọ na-apụ ịgakwuru ya, ọ na-emekwa ha baptizim n’Osimiri Jọdan, na-ekwupụta mmehie ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: nọ na-apụ ịgakwuru ya
  rationale: Ngwaa imperfect na-egosi omume gara n’ihu ma ọ bụ nke a na-eme ugboro ugboro n’oge gara aga; “nọ na-apụ” na-egosipụta nke a n’Igbo nkịtị.
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: Ndị si n’akụkụ niile nke ime obodo Judia
  rationale: χώρα nwere ike ịpụta mpaghara ma ọ bụ ime obodo. N’Igbo, itinye “ndị si” na-eme ka ndị mmadụ bụ ndị na-apụ doo anya, ebe “n’akụkụ niile” na-echekwa ike okwu πᾶσα n’enweghị nkwubi okwu na ọ bụ onye ọ bụla n’otu n’otu.
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: ndị niile bi na Jerusalem
  rationale: Ἱεροσολυμῖται bụ ndị bi na Jerusalem; nsụgharị a bụ Igbo dị mfe ma na-echekwa πάντες, “niile.”
- source_word: ἐβαπτίζοντο
  choice: Ọ nọkwa na-eme ha baptizim
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu ma na-eme ọtụtụ ndị. Igbo na-ahọrọkarị ahịrịokwu active ebe onye mere ihe pụtara ìhè; nke a anaghị akọwa usoro baptizim ma ọ bụ ihe ọ pụtara n’ụzọ nke otu ụka.
- source_word: ὑπ’ αὐτοῦ
  choice: Ọ ... na-eme ha
  rationale: Nnọchiaha ahụ na-ezo aka na Jọn dịka ihe ndị gbara amaokwu ahụ gburugburu si gosi. E debere ya dịka nnọchiaha, n’etinyeghị aha Jọn n’amaokwu a.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: n’Osimiri Jọdan
  rationale: ποταμός pụtara osimiri; “Osimiri Jọdan” bụ usoro okwu Igbo doro anya ma zuru ezu.
- source_word: ἐξομολογούμενοι
  choice: ka ha na-ekwupụta
  rationale: Participle a na-egosi omume ha na-eme mgbe baptizim na-aga n’ihu. “Na-ekwupụta” na-egosipụta nkwupụta mmehie n’ụzọ doro anya; “ka” ebe a na-ejikọta omume abụọ ahụ, ọ bụghị ịkọwa nzube.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: mmehie ha
  rationale: Nke a bụ nsụgharị Igbo kpọmkwem na nke ebumpụta ụwa maka ihe ha na-ekwupụta.
theological_decisions:
- issue: Oke okwu “niile” banyere Judia na Jerusalem
  choice: E debere “niile” dịka nkwupụta mkpokọta siri ike
  alternative: Ịsụgharị ya dịka “ọtụtụ ndị si Judia na Jerusalem”
  rationale: Grik ji πᾶσα na πάντες mee ihe, ya mere nsụgharị ahụ kwesịrị ichekwa ike okwu a. “N’akụkụ niile” na “ndị niile” na-ahapụkwa ohere ka a ghọta ya dịka nkwupụta mkpokọta a na-ahụkarị n’akụkọ, ọ bụghị iwu na onye ọ bụla n’enweghị onye fọdụrụ bịara.
- issue: Ụdị na ihe baptizim pụtara
  choice: E ji “mee ha baptizim” mee ihe n’enweghị nkọwa ọzọ
  alternative: “mikpuo ha” ma ọ bụ “saa ha ahụ”
  rationale: Amaokwu ahụ kọrọ omume ahụ ma ọ kọwaghị ebe a usoro e ji mee ya ma ọ bụ nkọwa ozizi ya. “Baptizim” na-ezere itinye ozizi pụrụ iche nke otu ụka.
- issue: Passive Grik na active Igbo
  choice: E ji active Igbo, “Ọ nọkwa na-eme ha baptizim,” mee ihe
  alternative: “A nọkwa na-eme ha baptizim site n’aka ya”
  rationale: Active bụ ụzọ Igbo dị ugbu a na nke ebumpụta ụwa si egosipụta otu ihe ahụ, ebe onye na-eme ya ka bụ nnọchiaha “ọ.” Ọ naghị agbanwe onye mere omume ahụ ma ọ bụ ndị natara ya.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “Judia,” “Jerusalem,” na “Jọdan” dịka aha ebe ndị na-agụ Igbo maara. E kewara ahịrịokwu ahụ ụzọ abụọ iji mee ka ogologo usoro Grik doo anya n’Igbo, ma e chekwara njikọ na-aga n’ihu site na “Ọ nọkwa.”
