  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐκήρυσσεν λέγων· Ἔρχεται ὁ ἰσχυρότερός μου ὀπίσω μου, οὗ οὐκ εἰμὶ ἱκανὸς κύψας λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: ig
  text: Ọ na-ekwusa[a], na-asị, “Onye dị ike karịa m na-abịa n’azụ m[b], onye m na-abụghị onye ruru eru ihulata tọpụ eriri akpụkpọ ụkwụ ya[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-ekwusa ozi” ma ọ bụ “na-ekwusa n’ihu ọha.”
    reason: lexical_alternative
  - marker: b
    text: “N’azụ m” nwekwara ike ịpụta “mgbe m gasịrị.”
    reason: source_ambiguity
  - marker: c
    text: Ma ọ bụ, “onye m na-ezughị oke” ma ọ bụ “onye m na-erughị eru”; okwu ahụ na-egosi na Jọn weere onwe ya dị ka onye na-erughị eru n’ihu onye na-abịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: Ọ nọkwa na-ekwusa
  rationale: Ụdị ngwaa imperfect na-egosi omume na-aga n’ihu ma ọ bụ a na-eme ugboro ugboro; “na-ekwusa” na-edobekwa echiche nke onye mgbasa ozi n’ihu ọha.
- source_word: λέγων
  choice: na-asị
  rationale: Nke a bụ ụzọ Igbo nkịtị si webata okwu e hotara mgbe ọ na-esochi ngwaa nkwusa.
- source_word: Ἔρχεται
  choice: na-abịa
  rationale: Ọ na-egosipụta ọbịbịa dị nso ma na-edobe ịdị ndụ nke present Greek.
- source_word: ὁ ἰσχυρότερός μου
  choice: Onye dị ike karịa m
  rationale: Adjective comparative a nwere article ma na-arụ ọrụ dị ka aha; nsụgharị a doro anya ma dịkwa n’Igbo nke oge a.
- source_word: ὀπίσω μου
  choice: n’azụ m
  rationale: Ọ na-edobe ma echiche ọnọdụ ‘n’azụ’ ma echiche oge ma ọ bụ usoro ‘mgbe m gasịrị,’ n’enweghị ịkagbu ihe abụọ ahụ.
- source_word: ἱκανὸς
  choice: Erughị m eru
  rationale: N’okwu a, ἱκανός na-egosi na Jọn ahụghị onwe ya dị ka onye ruru eru n’ihu onye na-abịa, ọ bụghị nanị na ike ime ihe ahụ adịghị ya.
- source_word: κύψας
  choice: ihulata
  rationale: “Ihulata” na-egosi iweda ahụ ala tupu ma ọ bụ mgbe a na-atọpụ eriri ahụ, ma na-ada nke ọma n’Igbo.
- source_word: λῦσαι
  choice: tọpụ
  rationale: N’ihe gbasara eriri akpụkpọ ụkwụ, “tọpụ” bụ okwu Igbo doro anya maka ịkpọpu ihe e kere eke ma ọ bụ e kekọrọ.
- source_word: τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: eriri akpụkpọ ụkwụ ya
  rationale: “Eriri” na-anọchi eriri akpụkpọ ahụ e ji kee sandal, ebe “akpụkpọ ụkwụ” bụ okwu a na-aghọta nke ọma maka ụdị ihe e ji eyi n’ụkwụ n’ọnọdụ a.
theological_decisions:
- issue: Ogo ịdị umeala n’obi dị n’okwu Jọn
  choice: Erughị m eru ... tọpụ eriri akpụkpọ ụkwụ ya
  alternative: Ezughị m oke / enweghị m ike ... tọpụ eriri akpụkpọ ụkwụ ya
  rationale: Nhọrọ a na-egosipụta ọdịiche dị n’ọkwa Jọn na onye na-abịa, kama ime ka okwu ahụ bụrụ naanị enweghị ike ịrụ ọrụ ahụ.
- issue: Ihe ὀπίσω μου pụtara
  choice: n’azụ m
  alternative: mgbe m gasịrị
  rationale: “N’azụ m” na-ahapụ nghọta ọnọdụ na nke usoro oge ka ha abụọ dị, dịka okwu Greek ahụ nwere ike isi kwuo.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. Ahịrịokwu ahụ na-edobe ụda nkwusa Jọn na ịdị umeala n’obi ya, ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa nkwenkwe agbakwunyere.
