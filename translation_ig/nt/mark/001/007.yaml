  to: Ọ na-ekwusa[a], na-asị, “Onye dị ike karịa m na-abịa n’azụ m[b], onye m na-abụghị onye ruru eru ihulata tọpụ eriri akpụkpọ ụkwụ ya[c].”
  rationale: The revision replaces the non-idiomatic "Erughị m eru" with "onye m na-abụghị onye ruru eru," which naturally expresses the contextual force of ἱκανός. It also keeps κύψας and λῦσαι as coordinated infinitival actions, a fluent Igbo representation that does not over-specify their temporal relation. The revised footnote c supplies idiomatic lexical alternatives. No disputed source-text ambiguity is removed.
