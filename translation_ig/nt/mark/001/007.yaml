  source_fidelity: 'The draft accurately renders the imperfect proclamation, the comparative "stronger than I," the present "is coming," and the sandal-strap image. "N’azụ m" appropriately retains the Greek expression’s possible spatial and successive sense, with a helpful footnote. The wording for ἱκανός, however, needs revision: "Erughị m eru" is not idiomatic Standard Igbo and obscures the source’s sense of personal unworthiness/fitness.'
  naturalness: Most of the verse is clear modern Standard Igbo. "Ọ nọkwa na-ekwusa" is acceptable, though "Ọ na-ekwusa" is more direct and natural for the ongoing past action in this narrative context. "Abụghị m onye ruru eru" is idiomatic and clearly conveys John’s humility.
  terminology: '"ekwusa," "ihulata," "tọpụ," and "eriri akpụkpọ ụkwụ" are suitable contemporary terms. "Onye ruru eru" gives ἱκανός its contextual force without asserting a doctrinal interpretation.'
