revisions:
- from: Ọ gagharịrị Galili niile[a], na-ekwusa ozi n’ụlọ nzukọ ha ma na-achụpụ ndị mmụọ ọjọọ.
  to: Ọ gagharịrị n’ime Galili dum[a], na-ekwusa n’ụlọ nzukọ ha ma na-achụpụ mmụọ ọjọọ.
  rationale: The revision removes the unspecified added object «ozi», uses the more natural and established expression «mmụọ ọjọọ» for δαιμόνια, and makes the geographic extent explicit with «n’ime Galili dum». The footnote continues to preserve the lexical alternative “came” while presenting the alternate construction clearly in Standard Igbo.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:50Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Jesus' itinerant ministry, proclamation in the synagogues, and expulsion of demons. However, «na-ekwusa ozi» supplies an object not expressed in the Greek, and «ndị mmụọ ọjọọ» is less idiomatic and slightly more explicitly personal than necessary for the neuter plural δαιμόνια.
  naturalness: «Ọ gagharịrị n’ime Galili dum» is a natural Standard Igbo expression for movement throughout the region. «Na-ekwusa» and «na-achụpụ mmụọ ọjọọ» are concise, contemporary, and appropriate to the register.
  terminology: «Ụlọ nzukọ» is retained for συναγωγαί. «Mmụọ ọjọọ» is the established, natural Igbo expression for demons/evil spirits and avoids treating the Greek neuter plural as a marked human-person plural through «ndị».
  issues:
  - severity: low
    issue: Added object in «na-ekwusa ozi»
    rationale: κηρύσσων means “proclaiming/preaching” and does not specify what is proclaimed in this verse. «Na-ekwusa» preserves that economy.
  - severity: medium
    issue: «Ndị mmụọ ọjọọ» for τὰ δαιμόνια
    rationale: While understandable, this phrasing is less idiomatic than «mmụọ ọjọọ» and the personal plural marker «ndị» adds an explicit grammatical characterization not required by the Greek neuter plural.
  - severity: low
    issue: Footnote alternative’s regional phrase
    rationale: The alternative should explicitly convey movement throughout Galilee and retain the source order without making “Galilee” sound only like the location of the synagogues.
  revised_text: Ọ gagharịrị n’ime Galili dum[a], na-ekwusa n’ụlọ nzukọ ha ma na-achụpụ mmụọ ọjọọ.
