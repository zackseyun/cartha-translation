  text: καὶ ⸀ἦλθεν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ αὐτῶν εἰς ὅλην τὴν Γαλιλαίαν καὶ τὰ δαιμόνια ἐκβάλλων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: ig
  text: Ọ gagharịrị n’ime Galili dum[a], na-ekwusa n’ụlọ nzukọ ha ma na-achụpụ mmụọ ọjọọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ bịara, na-ekwusa n’ụlọ nzukọ ha n’ime Galili dum ma na-achụpụ mmụọ ọjọọ.” Ngwaa Grik ahụ nwekwara ike ịpụta “ọ bịara,” ma n’ebe a o yikarịrị ka ọ na-akọwa njem ọ na-agagharị n’ógbè ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: Ọ gagharịrị
  rationale: N’agbanyeghị na ἔρχομαι pụrụ ịpụta ‘ọ bịara,’ n’ebe a, ya na nkebi na-ekwu banyere Galili niile, ọ na-egosi njem Jizọs na-agagharị n’ógbè ahụ. ‘Ọ gagharịrị’ na-enye echiche a n’Igbo nkịtị.
- source_word: κηρύσσων
  choice: na-ekwusa ozi
  rationale: κηρύσσω pụtara ikwusa ihe n’ihu ọha. ‘Na-ekwusa ozi’ bụ Igbo doro anya nke na-edobe echiche nke nkwupụta n’ihu ọha n’ụlọ nzukọ.
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: n’ụlọ nzukọ ha
  rationale: Ọ bụ ezie na εἰς nwere ike ịpụta ‘banye n’ime,’ n’usoro okwu a ọ na-egosi ebe ọrụ ahụ na-eme. ‘N’ụlọ nzukọ ha’ bụ nsụgharị Igbo sitere n’okike ma na-edobe αὐτῶν dị ka ‘ha.’
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: Galili niile
  rationale: Nkebi a na-egosi obosara njem ahụ n’ógbè Galili dum. Ya na ‘gagharịrị,’ ‘Galili niile’ na-edobe ὅλην ma na-asụ Igbo nke ọma.
- source_word: τὰ δαιμόνια
  choice: ndị mmụọ ọjọọ
  rationale: δαιμόνια na-ezo aka n’ihe ndị mmụọ nwere ajọ ọdịdị. ‘Ndị mmụọ ọjọọ’ bụ okwu Igbo doro anya ma na-ahụ ha dị ka ndị a na-achụpụ, n’enweghị ịgbakwụnye nkọwa ozizi ọzọ.
- source_word: ἐκβάλλων
  choice: na-achụpụ
  rationale: N’ọnọdụ ịchụ mmụọ ọjọọ, ἐκβάλλω pụtara ịchụpụ ma ọ bụ ime ka ha pụọ. ‘Na-achụpụ’ bụ okwu Igbo dị ndụ ma kwekọọ n’usoro participle ahụ.
theological_decisions:
- issue: Ọdịdị nke δαιμόνια
  choice: A sụgharịrị ya ‘ndị mmụọ ọjọọ,’ dị ka ndị mmụọ onwe ha Jizọs na-achụpụ.
  alternative: mmụọ ọjọọ
  rationale: Okwu Grik ahụ na-egosi ndị mmụọ ọjọọ dị ka ndị a na-achụpụ. Iji ‘ndị’ na-eme ka nke a doo anya n’Igbo, ma ọ naghị etinye nkwupụta ozizi karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ọ gagharịrị’ na-ejikọta echiche njem na obosara Galili dum; akara ndetu [a] dị n’ederede dịka achọrọ.
