id: MRK.1.2
reference: Mark 1:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Καθὼς γέγραπται ἐν ⸂τῷ Ἠσαΐᾳ τῷ προφήτῃ⸃· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: ig
  text: 'Dị ka e dere n’akwụkwọ Aịzaya onye amụma[a], sị: “Lee, ana m eziga onye ozi m n’ihu gị[c]; ọ ga-akwadebe ụzọ gị.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide oge ochie nwere “n’akwụkwọ ndị amụma” kama “n’akwụkwọ Aịzaya onye amụma.”
    reason: textual_variant
  - marker: b
    text: Okwu e hotara n’ebe a jikọtara okwu sitere na Malakaị 3:1 na Aịzaya 40:3.
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, “tupu gị.” N’ụzọ nkịtị, okwu Grik ahụ bụ “n’ihu ihu gị,” ya bụ, “n’ihu gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς
  choice: Dị nnọọ ka
  rationale: Na-egosi nkwekọrịta kpọmkwem n’etiti ihe Mak na-ekwu na ihe e dere n’Akwụkwọ Nsọ, ma bụrụkwa okwu Igbo doro anya.
- source_word: γέγραπται
  choice: e dere ya
  rationale: Na-egosipụta usoro e ji ewebata ihe e dere n’Akwụkwọ Nsọ, nke ka dị ire dị ka ihe e dere ede.
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: n’akwụkwọ onye amụma Aịzaya
  rationale: A gbakwụnyere ‘akwụkwọ’ iji mee ka ụzọ ntụaka ahụ doo anya n’Igbo, na-agbanweghị onye e kwuru na ọ bụ isi iyi ya.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Ọ bụ oku ka onye na-agụ gee ntị; ‘Lee’ nwere ụda amụma dị nsọ ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: ἀποστέλλω
  choice: ana m eziga
  rationale: Na-edobe oge ugbu a na ịdị ngwa nke okwu amụma ahụ n’ụzọ na-ada nke ọma n’Igbo.
- source_word: ἄγγελόν
  choice: onye ozi
  rationale: N’ebe a okwu ahụ na-ezo aka n’onye e zigara ka ọ buru ụzọ gaa, ọ bụghị kpọmkwem mmụọ ozi nke eluigwe.
- source_word: πρὸ προσώπου σου
  choice: n’ihu gị
  rationale: Ọ bụ ụzọ Igbo dị mma isi kwuo na onye ozi ahụ ga-ebu ụzọ gaa n’ihu onye a na-agwa okwu, ma na-echekwa onyinyo nke okwu Grik.
- source_word: κατασκευάσει
  choice: ọ ga-akwadebe
  rationale: Na-enye echiche ime ka ihe dị njikere n’ụzọ dị nkenke ma doo anya.
- source_word: τὴν ὁδόν σου
  choice: ụzọ gị
  rationale: Na-echekwa ma onyinyo nke ụzọ a na-aga ma ihe atụ ime mmụọ dị n’okwu amụma ahụ.
theological_decisions:
- issue: Mak kpọrọ Aịzaya naanị aha, ma okwu e hotara jikọtara okwu sitere na Malakaị 3:1 na Aịzaya 40:3.
  choice: E debere ‘n’akwụkwọ onye amụma Aịzaya’ n’ahịrị bụ isi.
  alternative: n’akwụkwọ ndị amụma
  rationale: Nke a na-agbaso ihe SBLGNT họọrọ, ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ, n’edoziwaghị esemokwu ahụ n’ime ntụgharị; e debere ọgụgụ ọzọ na nkọwa ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. ‘Lee’ na-edobe ụda amụma; ‘ana m eziga’ na ‘n’ihu gị’ na-enye okwu ahụ ọdịdị nkịtị n’Igbo ma na-anọgide nso n’ihe Grik kwuru.
