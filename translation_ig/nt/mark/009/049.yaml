  yaml_path: translation/nt/mark/009/049.yaml
  text: For everyone will be salted with fire[a][b].
translation:
  language: ig
  text: N’ihi na a ga-eji ọkụ tinye nnu n’ahụ onye ọ bụla[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a ga-eji ọkụ mee onye ọ bụla ka ihe e tinyere nnu.” Ihe atụ a nwere ike ịkpọlite echiche banyere ikpe, nsacha, ma ọ bụ àjà; tụlee Levitikọs 2:13.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie gbakwụnyere, “a ga-ejikwa nnu tinye nnu n’àjà ọ bụla.”
    reason: textual_variant
lexical_decisions:
- source_word: Πᾶς
  choice: onye ọ bụla
  rationale: Okwu a bụ otu onye, ụdị nwoke, ma na-arụ ọrụ dịka aha; n’ọnọdụ a, ọ kacha pụta ‘onye ọ bụla,’ ebe okwu ndị gbara ya gburugburu na-ekwu banyere ndị mmadụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe kpatara ma ọ bụ nkọwa na-akwado ịdọ aka ná ntị dị n’ihu ya.
- source_word: πυρὶ
  choice: jiri ọkụ
  rationale: Dative a nwere ike igosi ihe e ji eme ihe ma ọ bụ ihe a na-eme ya n’ime ya. ‘Jiri ọkụ’ na-edobe njikọ ahụ n’enweghị ịkọwa ya kpọmkwem dịka ikpe ma ọ bụ nsacha.
- source_word: ἁλισθήσεται
  choice: a ga-… tee … nnu
  rationale: Nke a bụ future passive nke ἁλίζω, ‘itinye ma ọ bụ ite nnu.’ Nsụgharị a na-edobe ihe atụ ahụ siri ike ma dị ịtụnanya kama ịkọwagharị ya.
theological_decisions:
- issue: Ihe okwu atụ ‘iji ọkụ tee nnu’ pụtara
  choice: E debere okwu atụ ahụ n’ụdị ya n’enweghị ikpebi ma ọ bụ ikpe, nsacha, àjà, ma ọ bụ ule nke ndị na-eso ụzọ ka ọ kacha na-ekwu maka ya.
  alternative: Ịsụgharị ya dịka ‘ọkụ ga-ekpe onye ọ bụla ikpe,’ ‘ọkụ ga-asachapụ onye ọ bụla,’ ma ọ bụ ‘a ga-edo onye ọ bụla nsọ dịka àjà e tinyere nnu.’
  rationale: Grik ahụ dị nkenke ma na-atụ aka n’ihe karịrị otu echiche; ọnọdụ okwu ahụ na-enye ohere ka nkọwa ndị a nwee njikọ. Ya mere, e kwesịghị idozi esemokwu nkà mmụta okpukpe ahụ n’ime isi nsụgharị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. ‘Tee … nnu’ na-edobe ihe oyiyi Grik ahụ n’ụzọ a pụrụ ịghọta, ebe ndetu ala peeji na-akọwa ntụgharị ọzọ na ọdịiche dị n’akwụkwọ aka ochie.
