review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders Πᾶς as ‘onye ọ bụla,’ preserves γάρ with ‘N’ihi na,’ and retains the deliberately difficult passive image of being salted ‘with fire.’ However, the wording is more idiomatic and transparent when the salt is explicitly applied to the person, and footnote b currently contains an erroneous duplicated ‘nnu’ construction.
  naturalness: ‘A ga-eji ọkụ tinye nnu n’ahụ onye ọ bụla’ is natural Standard Igbo while retaining the startling metaphor. It avoids suggesting that the person is merely rubbed with salt in an incomplete or awkward construction.
  terminology: ‘Ọkụ,’ ‘nnu,’ and ‘àjà’ are appropriate standard terms. The revised notes preserve the lexical alternative and the manuscript addition without assigning a particular theological interpretation.
  issues:
  - severity: medium
    issue: The main clause ‘a ga-eji ọkụ tee onye ọ bụla nnu’ is syntactically awkward in Standard Igbo.
    rationale: Although intelligible, ‘tee ... nnu’ is less natural here. ‘Tinye nnu n’ahụ ...’ clearly conveys ‘salt someone’ while preserving the source image and its ambiguity.
  - severity: high
    issue: 'Footnote b has an erroneous and awkward double-nnu phrase: ‘a ga-ejikwa nnu tee àjà ọ bụla nnu.’'
    rationale: The manuscript reading means ‘and every sacrifice will be salted with salt.’ The revised wording expresses both the action and the salt instrument without the malformed repetition.
  - severity: low
    issue: Footnote a’s ‘mee onye ọ bụla ka ọ dị ụtọ’ can imply making a person tasty.
    rationale: That phrasing is potentially misleading for persons. The revision states the alternative as the image of a person being treated like something salted.
