id: MRK.9.15
reference: Mark 9:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς πᾶς ὁ ὄχλος ⸂ἰδόντες αὐτὸν ἐξεθαμβήθησαν⸃, καὶ προστρέχοντες ἠσπάζοντο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/015.yaml
  text: And immediately the whole crowd[a], when they saw him, were greatly amazed, and running up to him, greeted him.
translation:
  language: ig
  text: Ozugbo ahụ, mgbe ìgwè mmadụ ahụ dum hụrụ ya, o juru ha anya nke ukwuu[a]; ha gbara ọsọ gbakwuru ya, kelee ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha juru nnọọ anya,” ma ọ bụ “ụjọ tụrụ ha.” Okwu Grik ahụ nwere ike ịpụta oke iju anya, ịtụnanya, ma ọ bụ ụjọ, dịka ihe ndị gbara ya gburugburu si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Ozugbo ahụ
  rationale: Nke a na-egosipụta ngwa ngwa nke ihe mere, ma na-echekwa ọsọ akụkọ Mak.
- source_word: πᾶς ὁ ὄχλος
  choice: ìgwè mmadụ ahụ niile
  rationale: Ọ na-egosipụta ìgwè ahụ dịka otu cele ma na-echekwa echiche nke mmadụ niile nọ n’ìgwè ahụ.
- source_word: ἰδόντες αὐτόν
  choice: hụrụ ya
  rationale: A haziri nkebi participle a dịka ihe mere tupu ma kpalie mmeghachi omume ha; usoro Igbo a dị nkenke ma doo anya.
- source_word: ἐξεθαμβήθησαν
  choice: o juru ha anya nke ukwuu
  rationale: Nke a na-egosipụta oke ịtụnanya dị n’okwu Grik ahụ n’enweghị ịkọwa ihe kpatara ya ma ọ bụ ime ka ọ bụrụ egwu naanị.
- source_word: προστρέχοντες
  choice: ha gbakwuru ya ọsọ
  rationale: Nke a na-egosipụta na ha ji ọsọ gaa n’ebe Jizọs nọ.
- source_word: ἠσπάζοντο αὐτόν
  choice: kelee ya
  rationale: ‘Kelee ya’ bụ ụzọ Igbo nkịtị na nke na-anọpụ iche isi kwuo na ha nabatara ya site n’ekele.
theological_decisions:
- issue: Ụdị mmetụta ìgwè mmadụ ahụ gosipụtara n’okwu ἐξεθαμβήθησαν
  choice: O juru ha anya nke ukwuu
  alternative: Ụjọ tụrụ ha; ma ọ bụ, ihe ha hụrụ tụrụ ha n’anya nke ukwuu
  rationale: Amaokwu ahụ na-ekwu naanị na ịhụ Jizọs kpaliri mmetụta siri ike n’ime ha, mgbe ahụ ha gbakwuru ya kelee ya. Nsụgharị ahụ anaghị etinye echiche banyere ìhè pụrụ iche ma ọ bụ ihe ọzọ amaokwu ahụ na-ekwughị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu na-aga nke ọma n’Igbo, ma chekwaa ngwa ngwa na ike nke akụkọ Mak.
