review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the full Greek sequence: immediacy, the crowd as a whole seeing Jesus, intense astonishment, then running toward and greeting him. A small revision makes the temporal relation of the first participle explicit and renders the running action more idiomatically in Standard Igbo.'
  naturalness: “Ha gbakwuru ya ọsọ” is understandable but less natural than “ha gbara ọsọ gbakwuru ya.” Adding “mgbe” clearly expresses the temporal participle, and “ìgwè mmadụ ahụ dum” naturally represents the collective sense of πᾶς ὁ ὄχλος.
  terminology: “O juru ha anya nke ukwuu” appropriately renders ἐξεθαμβήθησαν without supplying a reason for the reaction. “Kelee ya” is a neutral, natural rendering of ἠσπάζοντο αὐτόν. The footnote should offer lexical alternatives for the Greek verb itself, not introduce “ihe ha hụrụ” as the grammatical subject.
  issues:
  - severity: medium
    issue: The phrase “ha gbakwuru ya ọsọ” is awkward Standard Igbo.
    rationale: The Greek προστρέχοντες specifically denotes running toward him. “Ha gbara ọsọ gbakwuru ya” is clearer and idiomatic while retaining the action.
  - severity: low
    issue: The temporal force of ἰδόντες is only implicit in the draft.
    rationale: Using “mgbe ... hụrụ ya” makes clear that seeing him prompted the crowd’s reaction.
  - severity: low
    issue: The first footnote alternative changes the construction to “what they saw amazed them.”
    rationale: Although contextually possible as an explanation, it is not a direct lexical alternative for ἐξεθαμβήθησαν. The note should retain alternatives such as intense astonishment or alarm.
  revised_text: Ozugbo ahụ, mgbe ìgwè mmadụ ahụ dum hụrụ ya, o juru ha anya nke ukwuu[a]; ha gbara ọsọ gbakwuru ya, kelee ya.
  revised_footnotes:
