revisions:
- from: Ozugbo ahụ, ìgwè mmadụ ahụ niile hụrụ ya, o juru ha anya nke ukwuu[a]; ha gbakwuru ya ọsọ, kelee ya.
  to: Ozugbo ahụ, mgbe ìgwè mmadụ ahụ dum hụrụ ya, o juru ha anya nke ukwuu[a]; ha gbara ọsọ gbakwuru ya, kelee ya.
  rationale: The revision preserves the Greek meaning and narrative urgency while using more natural Standard Igbo. It makes the temporal relation explicit, renders the crowd’s running idiomatically, and narrows the footnote to defensible lexical alternatives without adding a speculative cause for their reaction.
