    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek meaning and narrative urgency while using more natural Standard Igbo. It makes the temporal relation explicit, renders the crowd’s running idiomatically, and narrows the footnote to defensible lexical alternatives without adding a speculative cause for their reaction.
