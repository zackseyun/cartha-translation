  yaml_path: translation/nt/mark/009/034.yaml
  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: ig
  text: Ma ha nọgidere jụụ, n’ihi na n’ụzọ ha rụrụrịta ụka n’etiti onwe ha banyere onye ka ibe ya ukwuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya, “onye kacha ukwuu.” Ọtụtụ nsụgharị na-eji ụdị kachasị elu n’ihi otú e si ekwu ya n’asụsụ ha, ma okwu Grik bụ ụdị ntụnyere: “onye ka ibe ya ukwuu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπων
  choice: ha nọgidere na-agbachi nkịtị
  rationale: Ụdị ngwaa imperfect na-egosi na ha gara n’ihu ịgbachi nkịtị mgbe Jizọs jụrụ ha ajụjụ; okwu a na-egosipụta ịdịgide nke omume ahụ.
- source_word: διελέχθησαν
  choice: ha arụrịta ụka
  rationale: N’ebe a, ihe ha na-ekwu bụ asọmpi banyere ọkwa onye ka ibe ya; ya mere ‘rụrịta ụka’ na-egosipụta esemokwu dị na mkparịta ụka ahụ karịa okwu na-anọpụ iche.
- source_word: πρὸς ἀλλήλους
  choice: n’etiti onwe ha
  rationale: Nke a na-egosi na ha niile na ibe ha na-emekọrịta okwu; ọ bụkwa ụzọ Igbo dị mfe ma kwekọọ n’echiche ahụ.
- source_word: ἐν τῇ ὁδῷ
  choice: mgbe ha nọ n’ụzọ
  rationale: Nke a na-egosipụta ọnọdụ njem ahụ n’Igbo nkịtị ma doo anya.
- source_word: τίς μείζων
  choice: onye ka ibe ya ukwuu
  rationale: Nhọrọ a na-echekwa ụdị ntụnyere nke μείζων (‘ka ... ukwuu’) kama ịgbanwe ya ozugbo ka ọ bụrụ ụdị kachasị elu.
- source_word: οἱ δὲ
  choice: Ma ha
  rationale: δέ na-egosi ntakịrị ọdịiche n’etiti ajụjụ Jizọs na nzaghachi ndị na-eso ụzọ site n’ịgbachi nkịtị.
- source_word: γὰρ
  choice: n’ihi na
  rationale: γάρ na-enye ihe mere ha ji gbachi nkịtị; ‘n’ihi na’ na-eme ka njikọ nke ihe kpatara ihe pụta ìhè n’Igbo ugbu a.
theological_decisions:
- issue: Ụdị ntụnyere μείζων ma ọ bụ ụdị kachasị elu
  choice: onye ka ibe ya ukwuu
  alternative: onye kacha ukwuu
  rationale: Ihe odide Grik ji adjective ntụnyere, ọ bụghị ụdị kachasị elu. Nsụgharị a na-echekwa ọdịiche ahụ na asọmpi ndị na-eso ụzọ banyere ọkwa, n’agbanyeghị na n’ụfọdụ ọnọdụ a pụrụ ịghọta ya dịka ajụjụ banyere onye kachasị ukwuu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Nọgidere na-agbachi nkịtị’ na-egosipụta omume na-aga n’ihu, ebe ‘onye ka ibe ya ukwuu’ na-echekwa ntụnyere dị n’asụsụ Grik.
