  - severity: low
    issue: Idiomatic expression for sustained silence
    rationale: “Nọgidere na-agbachi nkịtị” is comprehensible but somewhat literal and heavy. “Nọgidere jụụ” naturally expresses continued silence in response to Jesus’ question.
