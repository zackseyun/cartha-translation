revisions:
- from: Mgbe ọ banyere n’ụlọ, ndị na-eso ụzọ ya nọọrọ onwe ha jụọ ya, sị, “Gịnị mere anyị enweghị ike ịchụpụ ya[a]?”
  to: Mgbe ọ banyere n’ụlọ, ndị na-eso ụzọ ya nọ na-ajụ ya na nzuzo, sị, “Gịnị mere na anyị enweghị ike ịchụpụ ya[a]?”
  rationale: The revision replaces an unnatural expression for private questioning with idiomatic Standard Igbo, better reflects the imperfect verbal aspect, and retains the existing ambiguity of the final pronoun. The footnote remains anchored to “ya” and explains the Greek grammatical evidence without making the alternative impossible.
  reviewer_model: gpt-5.6-terra
