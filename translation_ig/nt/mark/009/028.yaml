  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸂εἰσελθόντος αὐτοῦ⸃ εἰς οἶκον οἱ μαθηταὶ αὐτοῦ ⸂κατ’ ἰδίαν ἐπηρώτων αὐτόν⸃· Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: ig
  text: Mgbe ọ banyere n’ụlọ, ndị na-eso ụzọ ya nọ na-ajụ ya na nzuzo, sị, “Gịnị mere na anyị enweghị ike ịchụpụ ya[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O yikarịrị ka “ya” na-ezo aka na mmụọ ahụ, n’ihi na nnọchiaha ahụ n’asụsụ Grik bụ nke neuter; ma a pụkwara ịghọta ya dịka onye na-ezo aka na nwata nwoke ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: Mgbe ọ banyere
  rationale: Nkebi aorist dị na genitive absolute na-enye oge ihe mere; nsụgharị a na-egosi na mbanye ya bu ụzọ tupu ajụjụ ahụ, ma na-ada nke ọma n’Igbo.
- source_word: εἰς οἶκον
  choice: n’ụlọ
  rationale: Ọ bụ ezie na οἶκον enweghị article n’asụsụ Grik, n’akụkọ a ọ na-ezo aka n’ụlọ a maara n’ọnọdụ ahụ; ‘n’ụlọ’ bụkwa ụzọ Igbo si ekwu ya nke ọma.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka μαθηταί, na-egosipụta ndị na-amụta ihe site n’iso onye nkuzi ha.
- source_word: κατ’ ἰδίαν
  choice: nọọrọ onwe ha
  rationale: Nkebi a pụtara na ha nọpụrụ iche n’ebe ndị ọzọ nọ. Okwu a na-egosi na ajụjụ ahụ bụ nke nzuzo.
- source_word: ἐπηρώτων
  choice: jụọ ya
  rationale: Imperfect ahụ nwere ike igosi omume na-aga n’ihu, ma n’Igbo, ‘jụọ ya’ na-akọ ihe ahụ n’ụzọ nkịtị na-enweghị itinye echiche nke ịjụ ugboro ugboro nke ederede ahụ na-ekwughị hoo haa.
- source_word: Ὅτι
  choice: Gịnị mere
  rationale: N’ajụjụ a, ὅτι na-arụ ọrụ dị ka ‘n’ihi gịnị’; ‘Gịnị mere’ bụ ụzọ Igbo nkịtị si ajụ ihe kpatara ya.
- source_word: ἡμεῖς οὐκ ἠδυνήθημεν
  choice: anyị enweghị ike
  rationale: Nsụgharị a na-egosi enweghị ikike ma ọ bụ enweghị ike ime ihe ahụ, ma na-edobe nkwusi ike dị na nnọchiaha ἡμεῖς site n’iji ‘anyị’.
- source_word: ἐκβαλεῖν
  choice: ịchụpụ
  rationale: N’ọnọdụ ịchụ mmụọ ọjọọ, ‘ịchụpụ’ na-enye echiche nke iwepụ ma ọ bụ ịchụ mmụọ ahụ pụọ n’ụzọ doro anya.
- source_word: αὐτό
  choice: ya[a]
  rationale: Igbo ‘ya’ anaghị egosi okike ma nwee ike izo aka na mmụọ ahụ ma ọ bụ nwata ahụ. Ihe odide Grik ji nnọchiaha neuter, nke na-adakarị na mmụọ ahụ; ihe e dere n’ala peeji na-akọwa ihe a na-enweghị ịmanye Igbo ka ọ mee ọdịiche ọ na-adịghị eme n’nnọchiaha a.
theological_decisions:
- issue: Ihe αὐτό ikpeazụ na-ezo aka na ya
  choice: A hapụrụ ya dị ka ‘ya,’ ebe ihe odide ala peeji na-egosi na o yikarịrị ka ọ na-ezo aka na mmụọ ahụ.
  alternative: Ọ nwere ike ịbụ na a ghọtara ya dị ka ihe na-ezo aka na nwata nwoke ahụ.
  rationale: αὐτό bụ neuter singular, ya mere ọ na-ezokarị aka na mmụọ ahụ karịa nwata nwoke ahụ; ma ‘ya’ n’Igbo anaghị egosi ọdịiche okike ahụ. Ihe odide ala peeji na-echekwa ihe akaebe Grik na ezi mgbagwoju anya nke onye okwu ahụ na-ezo aka na ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ndị na-eso ụzọ’ bụ okwu a maara nke ọma n’asụsụ Akwụkwọ Nsọ, ebe ‘nọọrọ onwe ha’ na-egosi ọnọdụ nzuzo n’ụzọ nkịtị. E tinyere akara [a] ozugbo n’azụ nnọchiaha ọ na-akọwa.
