  text: καὶ ἐπηρώτησεν τὸν πατέρα αὐτοῦ· Πόσος χρόνος ἐστὶν ὡς τοῦτο γέγονεν αὐτῷ; ὁ δὲ εἶπεν· ⸀Ἐκ παιδιόθεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/021.yaml
  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: ig
  text: Ọ jụrụ nna ya, sị, “Kemgbe ole ka ihe a bidoro ime ya?” Nna ya zara, sị, “Kemgbe ọ bụ nwata.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: jụrụ
  rationale: Ngwaa a na-egosi ajụjụ nkịtị n'okwu a; “jụrụ” bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji ekwu okwu kwa ụbọchị.
- source_word: τὸν πατέρα αὐτοῦ
  choice: nna ya
  rationale: αὐτοῦ na-ezo aka n'ahụ nwata ahụ dịka ihe gbara amaokwu ahụ gburugburu si dị; “nna ya” na-edobe mkpụmkpụ na ọdịdị okwu Grik.
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: Kemgbe ole ka
  rationale: Nke a na-ajụ ogologo oge site na mmalite ruo ugbu a; “Kemgbe ole ka” na-enye echiche ahụ n'Igbo dị ndụ.
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: ihe a na-eme ya
  rationale: Perfect γέγονεν ebe a na-egosi ọnọdụ na-aga n'ihu ruo ugbu a; usoro “na-eme ya” na-egosipụta ịdịgide ahụ nke ọma.
- source_word: ὁ δὲ εἶπεν
  choice: Nna ya zara, sị
  rationale: δέ na-akwalite akụkọ ahụ n'ihu, ebe “zara” dabara n'usoro ajụjụ na azịza. Ikwughachi “nna ya” na-eme ka onye na-ekwu doo anya n'Igbo.
- source_word: Ἐκ παιδιόθεν
  choice: Site mgbe ọ bụ nwata
  rationale: ἐκ na παιδιόθεν na-egosi ebe oge ahụ malitere, ya bụ n'oge ọ bụ nwata; nsụgharị a bụ nke okike ma doo ndị na-agụ oge a anya.
