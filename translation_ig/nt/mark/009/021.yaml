translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ajụjụ ahụ dịka ajụjụ banyere ogologo oge, ma e gosipụtara ọnọdụ ahụ dịka ihe na-aga n'ihu.
