    issue: The textual-variant footnote marker is attached to “ha” rather than to “ekpere.”
    rationale: The note concerns the variant expansion of προσευχῇ, not the referent “them.” Moving the anchor to “ekpere” makes the note’s scope accurate.
  - severity: low
    issue: The instrumental expression is stylistically heavy.
    rationale: “enweghị ike ịpụ ma e wezụga site n'ekpere” is intelligible, but “enweghị ike ịpụ n'ụzọ ọ bụla ma ọ bụghị site n'ekpere” is more idiomatic while maintaining the Greek contrast between no other means and prayer.
  - severity: low
    issue: The footnote wording uses “gụrụ” for a manuscript reading.
    rationale: For a textual-variant note, “nwere” is more natural Igbo wording for what later manuscripts contain.
  revised_text: Ọ sịrị ha, “Ụdị a enweghị ike ịpụ n'ụzọ ọ bụla ma ọ bụghị site n'ekpere[a].”
