  verdict: revise
  source_fidelity: The draft correctly follows the SBLGNT reading, retaining only “ekpere” in the main text and not supplying “mmụọ” after “Ụdị a.” However, the means construction is clearer and more idiomatic when both Greek instrumental phrases are represented as “n'ụzọ ọ bụla ... site n'ekpere.”
  naturalness: “ma e wezụga site n'ekpere” is understandable but somewhat cumbersome after “enweghị ike ịpụ.” “n'ụzọ ọ bụla ma ọ bụghị site n'ekpere” is natural Standard Igbo and preserves the exclusive-means sense.
  terminology: “Ụdị a,” “ekpere,” and “ibu ọnụ” are appropriate. The variant note is better phrased with “nwere” (“have/read”) rather than “gụrụ,” and its marker should be anchored to the variant-bearing phrase, not to “ha.”
  issues:
