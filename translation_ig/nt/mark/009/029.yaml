base_translation:
  language: en
  yaml_path: translation/nt/mark/009/029.yaml
  text: And he said to them[a], “This kind cannot come out by anything except prayer.”
translation:
  language: ig
  text: Ọ sịrị ha, “Ụdị a enweghị ike ịpụ n'ụzọ ọ bụla ma ọ bụghị site n'ekpere[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka e dere n'oge e mesịrị nwere, “ekpere na ibu ọnụ.”
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: Ụdị a
  rationale: γένος na-ezo aka n'ụdị ma ọ bụ otu ihe. Ihe gbara amaokwu ahụ gburugburu na-egosi mmụọ na-adịghị ọcha, ma Grik ekwughachịghị ‘mmụọ’; ya mere ‘Ụdị a’ na-edobe okwu ahụ nkenke n'etinyeghị aha na-adịghị na ya.
- source_word: ἐν οὐδενὶ
  choice: enweghị ike ... ma e wezụga site na
  rationale: ἐν ya na οὐδενί na-egosi ụzọ ma ọ bụ ihe e ji eme ihe. N'Igbo, usoro ‘enweghị ike ... ma e wezụga site na’ na-egosi nke ọma na ọ dịghị ụzọ ọzọ ga-arụ ọrụ.
- source_word: δύναται ἐξελθεῖν
  choice: enweghị ike ịpụ
  rationale: Okwu a na-egosi enweghị ike ịpụ. ‘Ịpụ’ bụ okwu Igbo doro anya ma kwekọọ n'ọnọdụ a nke mmụọ ọjọọ na-ahapụ mmadụ.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: εἰ μὴ na-egosi naanị otu ihe a na-ewepụ n'okwu njụ gara aga; ‘ma e wezụga’ na-ebute echiche ahụ n'ụzọ eke n'Igbo.
- source_word: ἐν προσευχῇ
  choice: site n'ekpere
  rationale: Nkebiokwu a na-egosi ụzọ e si eme ya. ‘Site n'ekpere’ na-edobe echiche instrumental nke ἐν ma bụrụkwa Igbo doro anya.
theological_decisions:
- issue: Ma a ga-etinye ‘na ibu ọnụ’
  choice: ekpere
  alternative: ekpere na ibu ọnụ
  rationale: SBLGNT nwere naanị προσευχῇ (‘ekpere’). Ụfọdụ akwụkwọ aka e dere n'oge e mesịrị gbakwụnyere ‘na ibu ọnụ.’ N'ihi ya, isiokwu bụ naanị ‘ekpere,’ ebe ndetu ala na-echekwa ọgụgụ ọzọ ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere nkenke na ihe edoghị anya nke ‘Ụdị a’ kama ịgbakwunye ‘mmụọ’ n'isiokwu.
