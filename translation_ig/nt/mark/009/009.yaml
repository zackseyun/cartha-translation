revisions:
- from: Mgbe ha si n’ugwu ahụ na-arịdata, o nyere ha iwu ka ha ghara ịkọrọ onye ọ bụla ihe ha hụrụ, ma e wezụga mgbe[a] Nwa nke Mmadụ ga-esi n’etiti ndị nwụrụ anwụ[b] bilie.
  to: Ka ha na-agbadata n’ugwu ahụ, o nyere ha iwu ka ha ghara ịkọrọ onye ọ bụla ihe ha hụrụ, ma e wezụga mgbe[a] Nwa nke Mmadụ ga-esi n’etiti ndị nwụrụ anwụ[b] bilie.
  rationale: The revision replaces only the non-idiomatic opening motion expression with a natural progressive Standard Igbo clause that faithfully conveys “as they were coming down from the mountain.” It also polishes footnote a’s editorial phrasing. The temporal wording “ma e wezụga mgbe” is retained because it reflects the Greek form while the footnote supplies the idiomatic temporal alternative “ruo mgbe.”
  reviewer_model: gpt-5.6-terra
