reference: Mark 9:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂Καὶ καταβαινόντων⸃ αὐτῶν ⸀ἐκ τοῦ ὄρους διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸂ἃ εἶδον διηγήσωνται⸃, εἰ μὴ ὅταν ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ἀναστῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: ig
  text: Ka ha na-agbadata n’ugwu ahụ, o nyere ha iwu ka ha ghara ịkọrọ onye ọ bụla ihe ha hụrụ, ma e wezụga mgbe[a] Nwa nke Mmadụ ga-esi n’etiti ndị nwụrụ anwụ[b] bilie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ na-adịkarị n’Igbo, “ruo mgbe Nwa nke Mmadụ ga-esi n’etiti ndị nwụrụ anwụ bilie.”
    reason: alternative_reading
  - marker: b
    text: 'N’asụsụ Grik: “si n’etiti ndị nwụrụ anwụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων
  choice: mgbe ha ... na-arịdata
  rationale: Nkebiokwu a na-egosi na ịrịdata ha na iwu ahụ mere n’otu oge; ntụgharị a bụ Igbo nkịtị ma na-echekwa omume ahụ na-aga n’ihu.
- source_word: ὄρους
  choice: ugwu
  rationale: “Ugwu” bụ okwu Igbo kwesịrị ekwesị maka ὄρος n’ọnọdụ akụkọ a.
- source_word: διεστείλατο
  choice: o nyere ha iwu
  rationale: Ngwaa ahụ na-egosi iwu ma ọ bụ ntụziaka siri ike; okwu a na-echekwa ike ya n’Igbo nke oge a.
- source_word: ἵνα μηδενὶ
  choice: ka ha ghara ịkọrọ onye ọ bụla
  rationale: Nke a na-egosipụta ọdịnaya nke iwu ahụ ma na-echekwa echiche nke ịghara ịgwa onye ọbụla.
- source_word: ἃ εἶδον
  choice: ihe ha hụrụ
  rationale: Nke a bụ ụzọ Igbo sitere n’okike e si sụgharịa njikọ nnọchiaha neuter plural ahụ.
- source_word: διηγήσωνται
  choice: ịkọrọ
  rationale: Ngwaa Grik ahụ pụtara ịkọ ma ọ bụ ịkọwa ihe a hụrụ; “ịkọrọ” dabara n’ebe a n’enweghị ịgbakwunye nkọwa na-adịghị na isiokwu.
- source_word: εἰ μὴ ὅταν
  choice: ma e wezụga mgbe
  rationale: Nke a na-esochi ọdịdị okwu Grik, “except when,” ma na-ahapụ nghọta metụtara oge n’enweghị ịgbanwe ya ozugbo ka ọ bụrụ “ruo mgbe.”
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: A sụgharịrị aha a n’ụzọ na-echekwa ya dịka aha Jizọs ji akpọ onwe ya na mkpọtụ echiche Akwụkwọ Nsọ dị n’azụ ya.
- source_word: ἐκ νεκρῶν
  choice: si n’etiti ndị nwụrụ anwụ
  rationale: Nke a na-echekwa echiche Grik nke isi n’etiti ndị nwụrụ anwụ pụta, ọ bụghị nanị isi n’ọnọdụ ọnwụ bilie.
- source_word: ἀναστῇ
  choice: ga-... bilie
  rationale: Aorist subjunctive ahụ na-ezo aka n’ihe ga-eme n’ọdịnihu ma e jiri ya tụnyere oge e nyere iwu ahụ; usoro “ga-... bilie” bụ nke doro anya ma bụrụ Igbo nkịtị.
theological_decisions:
- issue: Nsụgharị ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: “Nwa nke Mmadụ” na-echekwa aha ahụ, njikọ ya na ihe Akwụkwọ Nsọ kwuru n’oge gara aga, na nghọta Kraịst dị n’ime ya n’enweghị ịtụgharị ya ka ọ bụrụ naanị nkọwa gbasara mmadụ.
- issue: Ike oge nke εἰ μὴ ὅταν
  choice: ma e wezụga mgbe
  alternative: ruo mgbe
  rationale: Nhọrọ a dị nso n’usoro Grik ma na-echekwa esemokwu nta dị n’etiti “e wezụga mgbe” na nghọta okwu ahụ dịka mmachibido iwu nke ga-adị “ruo mgbe” mbilite n’ọnwụ gasịrị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Na-arịdata,” “nyere ha iwu,” na “ịkọrọ onye ọ bụla” bụ okwu nkịtị; e chekwara aha “Nwa nke Mmadụ” na nkọwa pụrụ iche nke ἐκ νεκρῶν.
