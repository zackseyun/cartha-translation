  to: Nnu dị mma; ma ọ bụrụ na nnu akwụsị ịdị nnu[a], gịnị ka unu ga-eji nye ya ụtọ? Nweenụ nnu n’ime onwe unu[b], bikwanụ n’udo n’etiti onwe unu.
