source:
  edition: SBLGNT
  text: καλὸν τὸ ἅλας· ἐὰν δὲ τὸ ἅλας ἄναλον γένηται, ἐν τίνι αὐτὸ ἀρτύσετε; ἔχετε ἐν ἑαυτοῖς ⸀ἅλα, καὶ εἰρηνεύετε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: ig
  text: Nnu dị mma; ma ọ bụrụ na nnu akwụsị ịdị nnu[a], gịnị ka unu ga-eji nye ya ụtọ? Nweenụ nnu n’ime onwe unu[b], bikwanụ n’udo n’etiti onwe unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ bụrụ na nnu atụfuo ụtọ ya” ma ọ bụ “ọ bụrụ na nnu aghọọ nke na-enweghị ụtọ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Nweenụ nnu n’etiti onwe unu.” Ihe “nnu” pụtara ebe a akọwaghị kpọmkwem; ọ pụrụ izo aka n’ịdị ọcha, amamihe, iguzosi ike n’ọgbụgba ndụ, ma ọ bụ mmetụta nke ichekwa ihe. A hapụrụ ihe atụ ahụ dịka ọ dị na Grik.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: dị mma
  rationale: Nkebiokwu a na-egosi na nnu bara uru n’ụzọ sara mbara; “dị mma” bụ okwu Igbo doro anya nke na-adịghị akọwapụta uru ahụ karịa ihe Grik kwuru.
- source_word: ἅλας / ἅλα
  choice: nnu
  rationale: E ji “nnu” mee ihe n’ebe abụọ ahụ iji chekwaa nkwughachi okwu na ihe atụ dị na Grik.
- source_word: ἄναλον γένηται
  choice: nnu akwụsị ịdị nnu
  rationale: Nke a na-egosi mgbanwe gaa n’ọnọdụ enweghị ụtọ nnu, na-echekwakwa egwuregwu okwu dị n’etiti “nnu” na “ịdị nnu” n’Igbo nkịtị.
- source_word: ἐν τίνι αὐτὸ ἀρτύσετε
  choice: gịnị ka unu ga-eji nye ya ụtọ?
  rationale: Ajụjụ a na-achọ ihe a ga-eji mee ka nnu nwee ụtọ ọzọ. “Nye ya ụtọ” bụ okwu nri a na-aghọta nke ọma ma ọ naghị etinye nkọwa ime mmụọ n’ihe atụ ahụ.
- source_word: ἔχετε
  choice: Nweenụ
  rationale: Ọ bụ iwu nye ọtụtụ mmadụ ka ha nọgide nwee ihe ahụ; ụdị iwu “Nweenụ” dị nkenke ma bụrụkwa Igbo e ji ugwu ekwu.
- source_word: ἐν ἑαυτοῖς
  choice: n’ime onwe unu
  rationale: Nke a na-echekwa ntụaka Grik na ihe dị n’ime ndị na-eso ụzọ, kama ịgbanwe ya ozugbo ka ọ bụrụ naanị mmekọrịta dị n’etiti ha.
- source_word: εἰρηνεύετε ἐν ἀλλήλοις
  choice: dịrịtanụkwa n’udo
  rationale: Ngwaa nwere nsonaazụ mmeghachi omume “-rịta-” na-egosi na udo ahụ bụ nke ha na ibe ha, ebe ụdị iwu ahụ na-egosi ụzọ ndụ na-aga n’ihu.
theological_decisions:
- issue: Ihe “nnu” pụtara n’iwu ikpeazụ
  choice: 'E chekwara ihe atụ ahụ kpọmkwem: “Nweenụ nnu n’ime onwe unu.”'
  alternative: Ịkọwa ya n’ahịrịokwu bụ isi dị ka ịdị ọcha, amamihe, ikwesị ntụkwasị obi n’ọgbụgba ndụ, ma ọ bụ mmetụta na-echekwa ndị ọzọ.
  rationale: Amaokwu ahụ akọwaghị kpọmkwem otu ihe “nnu” na-anọchi anya ya. Ịhapụ ya dịka ihe atụ na-echekwa ọtụtụ nghọta ndị ihe odide ahụ nwere ike ikwe ka ha dị, n’etinyeghị ozizi pụrụ iche.
- issue: Ma ἐν ἑαυτοῖς ọ̀ bụ “n’ime onwe unu” ka ọ bụ “n’etiti onwe unu”
  choice: n’ime onwe unu
  alternative: n’etiti onwe unu
  rationale: Nnọchiaha ntụgharị uche ahụ na-akwado nghọta nke ihe ha kwesịrị inwe n’ime onwe ha; ma nghọta nke mmekọrịta otu ahụ ka nwere ike ịdị, ya mere e tinyere ya n’okpuru peeji.
- issue: Iwu gbasara udo
  choice: dịrịtanụkwa n’udo
  alternative: weenụkwa udo n’etiti onwe unu
  rationale: Nke a na-egosi iwu ka udo bụrụ omume na-aga n’ihu ma na-echekwa na ọ bụ udo ha na ibe ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu mee ihe. “Dịrịtanụ n’udo” bụ ụzọ ebumpụta ụwa isi gosipụta udo ha na ibe ha, ebe “Nweenụ nnu n’ime onwe unu” na-echekwa ihe atụ siri ike ma kpachara anya ghara ịkọwa ya karịa ihe odide ahụ.
