review_pass:
  verdict: revise
  source_fidelity: The temporal phrase, named disciples, high mountain, separation, and public nature of the transformation are substantially represented. However, “duru ha rigoro n’elu otu ugwu” is syntactically awkward and can imply arrival specifically on the summit; εἰς ὄρος is better rendered as movement up/to a high mountain. The alternative note “E mere ka ọdịdị ya gbanwee” introduces an explicit external causer that the Greek passive does not identify.
  naturalness: “Duru ha gbagoo n’ugwu dị elu” is idiomatic Standard Igbo and clearly expresses leading them upward. “Naanị ha” is natural and sufficiently conveys the combined emphasis of κατ’ ἰδίαν μόνους without needless redundancy.
  terminology: Jizọs, Pita, Jemis, and Jọn are appropriate Standard Igbo forms. “Ọ gbanwere ọdịdị n’ihu ha” is clear for μετεμορφώθη and does not impose a theological explanation. The note’s alternative is revised to avoid suggesting that an unnamed agent caused the change.
  issues:
  - severity: medium
    issue: The ascent clause is awkward and over-specific in location.
    rationale: “Duru ha rigoro n’elu otu ugwu dị elu” is not smooth Igbo and “n’elu” can mean on top of the mountain. The Greek expresses taking them up to/onto a high mountain, not necessarily to its summit.
  - severity: medium
    issue: Footnote c supplies an explicit causative meaning.
    rationale: “E mere ka ọdịdị ya gbanwee” can mean that someone caused his appearance to change. μετεμορφώθη is passive, but does not state an agent; the translation should preserve that lack of specification.
  revised_text: Mgbe ụbọchị isii gachara[a], Jizọs kpọọrọ Pita, Jemis na Jọn, duru ha gbagoo n’ugwu dị elu, naanị ha[b]. Ọ gbanwere ọdịdị n’ihu ha[c].
