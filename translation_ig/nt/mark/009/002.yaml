source:
  edition: SBLGNT
  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: ig
  text: Mgbe ụbọchị isii gachara[a], Jizọs kpọọrọ Pita, Jemis na Jọn, duru ha gbagoo n’ugwu dị elu, naanị ha[b]. Ọ gbanwere ọdịdị n’ihu ha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ụbọchị isii ka e mesịrị.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “n’ebe naanị ha nọ.” Grik ji okwu abụọ na-egosi nkewapụ mesie ike na Jizọs kpọọrọ naanị mmadụ atọ ndị a.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “Ọ gbanwere n’ihu ha.”
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: Mgbe ụbọchị isii gachara
  rationale: Nke a na-egosipụta usoro oge μετά na accusative n’Igbo nkịtị; ọ pụtara ‘mgbe ụbọchị isii gachara’ ma ọ bụ ‘ụbọchị isii ka e mesịrị.’
- source_word: παραλαμβάνει
  choice: kpọọrọ
  rationale: ‘Kpọọrọ’ na-egosi na Jizọs kpọrọ ndị ahụ aha kpọrọ ha soro ya, nke dabara n’ọrụ παραλαμβάνω ebe a. Igbo anaghị ejikarị historical present eme akụkọ otú Grik si eme ya, ya mere e ji oge gara aga mee ya n’ụzọ ebumpụta ụwa.
- source_word: ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν
  choice: duru ha rigoro n’elu otu ugwu dị elu
  rationale: Nkebi a na-echekwa ma iduru ha ma ngagharị elu nke ἀναφέρει, ebe ‘n’elu otu ugwu dị elu’ na-egosi ebe ha ruru.
- source_word: κατ’ ἰδίαν μόνους
  choice: naanị ha onwe ha
  rationale: Okwu a na-eme ka o doo anya na ọ kpọọrọ naanị ndị na-eso ụzọ atọ a, ndị ọzọ esoghị ha; ọ na-enye ike nkewapụ dị na okwu Grik abụọ ahụ n’Igbo na-adịghị arọ.
- source_word: μετεμορφώθη
  choice: Ọ gbanwere ọdịdị
  rationale: Nke a bụ nsụgharị kpọmkwem ma doo anya nke mgbanwe a hụrụ anya, na-enweghị itinye nkọwa banyere otu mgbanwe ahụ si mee.
- source_word: ἔμπροσθεν αὐτῶν
  choice: n’ihu ha
  rationale: ‘N’ihu ha’ na-egosi na mgbanwe ahụ mere ebe ha nọ na-ahụ ya.
theological_decisions:
- issue: Nsụgharị μετεμορφώθη n’ihe gbasara Kraịst
  choice: Ọ gbanwere ọdịdị
  alternative: E mere ka ọdịdị ya gbanwee
  rationale: ‘Ọ gbanwere ọdịdị’ na-anọgide nso n’ihe a hụrụ anya nke ngwaa Grik na-ekwu, ma ọ naghị akọwa onye ma ọ bụ ihe kpatara mgbanwe ahụ. Nhọrọ passive ga-echekwa ụdị okwu Grik nke ọma karị, ma n’Igbo ọ nwere ike ịdị arọ ma ọ bụ mee ka e chee na e nwere onye ọzọ a kpọghị aha mere ya.
translation_notes:
  register: E ji Standard Igbo nke dị ùgwù ma dị mfe nghọta mee ihe. E jiri usoro akụkọ oge gara aga nke Igbo kama iṅomi historical present nke Mak n’ụzọ ga-ada ụda na-abụghị nke Igbo. Akara nkọwa ala peeji [a], [b], na [c] niile dị n’ederede isi.
