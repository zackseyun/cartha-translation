    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “Ọ gbanwere n’ihu ha.”
    reason: alternative_reading
  revision_rationale: The revision makes the ascent clause natural while retaining both Jesus’ taking the three disciples and leading them upward. It removes the summit-like implication of “n’elu otu ugwu.” The transformation wording remains direct and visually intelligible, while the revised alternative note no longer introduces an unstated external agent. All footnote anchors remain present and correctly matched.
