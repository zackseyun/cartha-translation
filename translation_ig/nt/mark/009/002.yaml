- from: Mgbe ụbọchị isii gachara[a], Jizọs kpọọrọ Pita, Jemis na Jọn, duru ha rigoro n’elu otu ugwu dị elu, naanị ha onwe ha[b]. Ọ gbanwere ọdịdị n’ihu ha[c].
  to: Mgbe ụbọchị isii gachara[a], Jizọs kpọọrọ Pita, Jemis na Jọn, duru ha gbagoo n’ugwu dị elu, naanị ha[b]. Ọ gbanwere ọdịdị n’ihu ha[c].
  rationale: The revision makes the ascent clause natural while retaining both Jesus’ taking the three disciples and leading them upward. It removes the summit-like implication of “n’elu otu ugwu.” The transformation wording remains direct and visually intelligible, while the revised alternative note no longer introduces an unstated external agent. All footnote anchors remain present and correctly matched.
