revisions:
- from: Ọtụtụ mgbe, ọ tụbawo ya n’ọkụ nakwa n’ime mmiri[a] ka o bibie ya. Ma ọ bụrụ na i nwere ike ime ihe ọ bụla, nyere anyị aka, nwee ọmịiko n’ebe anyị nọ.[b]
  to: Ọtụtụ mgbe, ọ tụbawo ya n’ọkụ nakwa n’ime mmiri[a] ka o bibie ya. Ma ọ bụrụ na i nwere ike ime ihe ọ bụla, were ọmịiko n’ebe anyị nọ nyere anyị aka.[b]
  rationale: The revision retains the source’s ambiguity and the father’s uncertainty (“ọ bụrụ na i nwere ike ime ihe ọ bụla”). It adjusts the compassion phrase so that it qualifies the request for help, as in Greek, and corrects the plural-water footnote so it does not overstate the lexical sense.
