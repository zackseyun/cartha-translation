    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “n’ihi ọmịiko i nwere n’ebe anyị nọ, nyere anyị aka,” ma ọ bụ, “meere anyị ebere.”
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s ambiguity and the father’s uncertainty (“ọ bụrụ na i nwere ike ime ihe ọ bụla”). It adjusts the compassion phrase so that it qualifies the request for help, as in Greek, and corrects the plural-water footnote so it does not overstate the lexical sense.
