  text: καὶ πολλάκις ⸂καὶ εἰς πῦρ αὐτὸν⸃ ἔβαλεν καὶ εἰς ὕδατα ἵνα ἀπολέσῃ αὐτόν· ἀλλ’ εἴ τι ⸀δύνῃ, βοήθησον ἡμῖν σπλαγχνισθεὶς ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: ig
  text: Ọtụtụ mgbe, ọ tụbawo ya n’ọkụ nakwa n’ime mmiri[a] ka o bibie ya. Ma ọ bụrụ na i nwere ike ime ihe ọ bụla, were ọmịiko n’ebe anyị nọ nyere anyị aka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ahụ bụ ọtụtụ, ya bụ, “n’ime mmiri.” N’Igbo, okwu “mmiri” anaghị agbanwe ụdị iji gosi otu ma ọ bụ ọtụtụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “n’ihi ọmịiko i nwere n’ebe anyị nọ, nyere anyị aka,” ma ọ bụ, “meere anyị ebere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: Ọtụtụ mgbe
  rationale: Nke a na-egosi na ihe ahụ mere ugboro ugboro; ọ bụkwa okwu Igbo doro anya ma bụrụ nke a na-asụ n’ụzọ ebumpụta ụwa.
- source_word: ἔβαλεν
  choice: ọ tụbawo ya
  rationale: Ụdị a na-achịkọta omume mere ugboro ugboro ruo n’oge nna ahụ na-ekwu okwu.
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: n’ọkụ nakwa n’ime mmiri
  rationale: E debere nkwughachi echiche nke ịtụba ya n’ime ihe abụọ ahụ. N’Igbo, ‘mmiri’ anaghị egosi otu ma ọ bụ ọtụtụ n’ụdị okwu ya.
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: ka o bibie ya
  rationale: ‘Ka’ na-egosi nzube; ‘bibie’ na-edebe obosara nke ἀπόλλυμι karịa ịkọwa ya naanị dị ka igbu mmadụ.
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: Ma ọ bụrụ na i nwere ike ime ihe ọ bụla
  rationale: E tinyere ‘ihe ọ bụla’ iji gosipụta τι ma debe obi abụọ dị n’arịrịọ nna ahụ.
- source_word: βοήθησον ἡμῖν
  choice: nyere anyị aka
  rationale: Nke a bụ arịrịọ ozugbo, nke doro anya ma kwekọọ n’Igbo nkịtị.
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: nwee ọmịiko n’ebe anyị nọ
  rationale: Nke a na-egosipụta ọmịiko miri emi na ntụgharị ya n’ebe ndị na-arịọ enyemaka nọ, n’asụsụ Igbo dị mfe ma dị ùgwù.
theological_decisions:
- issue: Ụda arịrịọ nna ahụ na obi abụọ ọ na-egosi banyere ike Jizọs
  choice: ọ bụrụ na i nwere ike ime ihe ọ bụla
  alternative: ọ bụrụ na i nwere ike
  rationale: Okwu Grik ahụ gosiri obi abụọ n’ụzọ doro anya. A hapụrụ esemokwu ahụ otú ọ dị, a naghị eme ka arịrịọ ya yie nkwupụta okwukwe siri ike.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dị ùgwù. E ji ‘Jizọs’ eme ihe naanị na nkọwa mkpebi; amaokwu n’onwe ya na-agbaso nnọchiaha nke isi mmalite. Akara ukwu [a] na [b] dị n’ederede isi.
