  to: Ma Jizọs sịrị ya, “‘Ọ bụrụ na ị pụrụ’?[a] Ihe niile kwere omume nye onye na-ekwere.[b]”
  rationale: The revision removes a source-unexpressed addition while preserving the Greek’s abrupt, emphatic echo through a quoted question. It also revises both footnotes for grammatical Standard Igbo, a clearer explanation of the article-plus-quotation construction, and a more accurate aspectual alternative for πιστεύοντι.
