  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: ig
  text: Ma Jizọs sịrị ya, “‘Ọ bụrụ na ị pụrụ’?[a] Ihe niile kwere omume nye onye na-ekwere.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ kpọmkwem karịa dị ka, “‘Ọ bụrụ na ị pụrụ’ ahụ?” Jizọs na-ekwughachi okwu nna ahụ kwuru n’amaokwu bu nke a ụzọ ma na-agbagha ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “onye na-ekwere” dịka “onye nwere okwukwe” ma ọ bụ “onye na-atụkwasị obi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: ‘Ọ bụrụ na ị pụrụ’ ka ị na-ekwu?
  rationale: Artikịl na-anọpụ iche Τὸ na-eme ka okwu nna ahụ kwuru bụrụ ihe Jizọs kpọghachiri kpọmkwem ma maa aka. Nsụgharị a na-eme ka nke ahụ doo anya n’Igbo dị ugbu a, ma na-edobe ajụjụ ahụ dị ka okwu e kwuru n’ụzọ na-egosi ịma aka.
- source_word: δύνῃ
  choice: ị pụrụ
  rationale: δύναμαι pụtara inwe ike ma ọ bụ pụrụ ime ihe. “Ị pụrụ” dị nkenke ma dabara n’okwu ahụ Jizọs kpọghachiri.
- source_word: πάντα
  choice: ihe niile
  rationale: Nke a na-anọchi ọtụtụ ihe n’enweghị oke e depụtara, ma na-edobe ibu okwu Grik ahụ.
- source_word: δυνατὰ
  choice: kwere omume
  rationale: N’usoro ahịrịokwu a, δυνατά pụtara na ihe nwere ike ime; “kwere omume” bụ okwu Igbo doro anya na nke kwesịrị ekwesị.
- source_word: τῷ πιστεύοντι
  choice: nye onye na-ekwere
  rationale: Ụdị participle dị ugbu a na-ezo aka n’ozuzu onye na-ekwere. “Onye na-ekwere” na-edobe omume ahụ kama ime ya naanị aha otu mmadụ.
- source_word: πιστεύοντι
  choice: na-ekwere
  rationale: πιστεύω na-egosi ikwere ma nwee ntụkwasị obi. “Na-ekwere” bụ nsụgharị bụ isi ebe a; a kọwara ụzọ ndị ọzọ e nwere n’ala ala peeji.
theological_decisions:
- issue: Ókè okwu ahụ bụ “Ihe niile kwere omume” ruru
  choice: E debere okwu ahụ n’enweghị mgbakwunye nkọwa n’ahịrịokwu bụ isi.
  alternative: “N’ebe Chineke nọ, ihe niile kwere omume nye onye na-ekwere,” ma ọ bụ nkọwa na-ekwupụta kpọmkwem na ike ahụ bụ nke Chineke.
  rationale: Grik ahụ kwuru okwu ahụ nkenke ma tinyeghị “n’ebe Chineke nọ” n’amaokwu a. Ịghara ịgbakwunye ya na-edobe ike okwu ahụ na esemokwu nkà mmụta okpukpe dị n’ime ya, n’agbanyeghị na gburugburu Akwụkwọ Nsọ na-egbochi ịghọta ya dị ka ike mmadụ nwere n’onwe ya.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ “Ọ bụrụ na ị pụrụ” ka ọ bụrụ iberibe okwu e hotara, dịka ọ dị na Grik, ma tinye “ka ị na-ekwu?” iji mee ka nkwughachi Jizọs na ịma aka ya doo anya n’Igbo.
