- from: Ma Jizọs jidere ya n’aka, welie ya elu[a], o wee bilie ọtọ[b].
  to: Ma Jizọs jidere ya n’aka, welie ya elu[a], o wee bilie[b].
  rationale: 'The revision removes the erroneous added sense of “ọtọ” while retaining the Greek progression: Jesus raises the boy, and the boy rises. It also adjusts footnote b so that it supplies a real, natural Igbo alternative for ἀνέστη. No doctrinal conclusion about death or resurrection is imposed.'
