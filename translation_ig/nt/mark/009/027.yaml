    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “o wee guzoro.”
    reason: lexical_alternative
  revision_rationale: 'The revision removes the erroneous added sense of “ọtọ” while retaining the Greek progression: Jesus raises the boy, and the boy rises. It also adjusts footnote b so that it supplies a real, natural Igbo alternative for ἀνέστη. No doctrinal conclusion about death or resurrection is imposed.'
