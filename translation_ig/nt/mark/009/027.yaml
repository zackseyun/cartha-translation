  text: ὁ δὲ Ἰησοῦς κρατήσας ⸂τῆς χειρὸς αὐτοῦ⸃ ἤγειρεν αὐτόν, καὶ ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: ig
  text: Ma Jizọs jidere ya n’aka, welie ya elu[a], o wee bilie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kpọlite ya.” Okwu Grik a nwekwara ike ịpụta ịkpọlite mmadụ n’ụra ma ọ bụ n’ọnwụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “o wee guzoro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị megide echiche ìgwè mmadụ kwuru n’amaokwu bu ụzọ na nwata ahụ anwụọla.
- source_word: κρατήσας
  choice: jidere ya n’aka
  rationale: Nke a bụ ụzọ Igbo si ekwu n’ụzọ nkịtị na Jizọs jidere aka nwata ahụ; ọ na-echekwa omume mmetụ ahụ n’enweghị echiche ime ihe ike.
- source_word: τῆς χειρὸς αὐτοῦ
  choice: ya n’aka
  rationale: Ọ na-echekwa akụkụ ahụ a kpọrọ kpọmkwem, χείρ, ma na-eji usoro okwu Igbo dị nfe.
- source_word: ἤγειρεν
  choice: welie ya elu
  rationale: Ọ na-egosi na Jizọs mere ka nwata ahụ si n’ala bilie, ma ka na-echekwa njikọ okwu ahụ nwere ike inwe na ịkpọlite onye n’ụra ma ọ bụ n’ọnwụ.
- source_word: ἀνέστη
  choice: o wee bilie ọtọ
  rationale: 'Ọ na-akọ ihe si n’omume Jizọs pụta: nwata ahụ biliri guzoro; okwu a bụ nke Igbo ugbu a ma doo anya.'
theological_decisions:
- issue: Ụda okwu mbilite n’ọnwụ nke ἤγειρεν na ἀνέστη nwere ike inwe
  choice: E ji okwu nkịtị banyere isi n’ala bilie, ma tinye nkọwa ala peeji iji chekwaa obosara ihe okwu Grik ahụ pụrụ ịpụta.
  alternative: Ịsụgharị ya n’ụzọ ga-eme ka ọ dị ka a kpọlitere nwata ahụ n’ọnwụ, ma ọ bụ jiri naanị okwu enyemaka nke ga-ewepụ ụda ahụ kpamkpam.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ekwu na Jizọs mere ka nwata ahụ bilie mgbe mmụọ ọjọọ pụchara, ọ bụghị na ọ na-ekwupụta kpọmkwem na a kpọlitere ya n’ọnwụ. Ma okwu Grik abụọ ahụ nwekwara ike ịpụta n’akụkọ mbilite n’ọnwụ, ya mere e kwesịghị ikpochapụ ụda ahụ kpamkpam.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Jidere ya n’aka” bụ usoro okwu nkịtị; “bilie ọtọ” na-eme ka ọnọdụ ahụ doo anya n’enweghị okwu ochie ma ọ bụ nkọwa ụka pụrụ iche.
