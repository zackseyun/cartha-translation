  to: Ha na-ajụ ya, sị, “Gịnị mere[a] ndị odeakwụkwọ ji ekwu na Ịlaịja aghaghị ibu ụzọ bịa?”
  rationale: The revision corrects the designation of the scribes and lightly smooths the verbal expression. It retains the question’s ambiguity as reflected in the footnote and does not add any interpretation concerning the nature or timing of Elijah’s coming.
