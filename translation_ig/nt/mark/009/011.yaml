  edition: SBLGNT
  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: ig
  text: Ha na-ajụ ya, sị, “Gịnị mere[a] ndị odeakwụkwọ ji ekwu na Ịlaịja aghaghị ibu ụzọ bịa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Olee otú o si bụrụ na ndị odeakwụkwọ na-ekwu na Ịlaịja aghaghị ibu ụzọ bịa?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτων
  choice: nọkwa na-ajụ
  rationale: Ụdị ngwaa imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro; “nọ na-ajụ” na-egosipụta nke a n’Igbo nkịtị, ebe “-kwa” na-eburu καί.
- source_word: λέγοντες
  choice: sị
  rationale: N’Igbo, “sị” bụ ụzọ ebumpụta ụwa isi webata kpọmkwem ihe ha jụrụ, ma na-echekwa ọrụ participle a n’enweghị nhazi okwu na-adịghị eke.
- source_word: Ὅτι
  choice: Gịnị mere
  rationale: N’ajụjụ a, ὅτι na-arụ ọrụ idiomatik nke “n’ihi gịnị” ma ọ bụ “olee otú o si bụrụ na”; “Gịnị mere” na-enye ajụjụ ahụ nke ọma n’Igbo ugbu a.
- source_word: γραμματεῖς
  choice: ndị ode akwụkwọ
  rationale: Nke a na-echekwa aha ọrụ akụkọ ihe mere eme nke ndị ọkachamara n’iwu na Akwụkwọ Nsọ, na-agbakwụghị nkọwa n’ime amaokwu ahụ.
- source_word: Ἠλίαν
  choice: Ịlaịja
  rationale: E dere aha ahụ n’ụdị a na-ejikarị eme ihe n’Igbo.
- source_word: δεῖ
  choice: aghaghị
  rationale: “Aghaghị” na-egosipụta mkpa siri ike dị na δεῖ, n’agbanyeghị ma mkpa ahụ sitere n’amụma, Akwụkwọ Nsọ, ma ọ bụ nzube Chineke.
- source_word: ἐλθεῖν
  choice: bịa
  rationale: “Bịa” bụ ntụgharị kpọmkwem na nke ebumpụta ụwa maka infinitive a n’okwu amụma.
- source_word: πρῶτον
  choice: ibu ụzọ
  rationale: “Ibu ụzọ” na-egosipụta na ọbịbịa Ịlaịja ga-ebu ụzọ mee, na-agbakwụghị onye ma ọ bụ ihe ọ ga-ebu ụzọ mee tupu ya.
theological_decisions:
- issue: Ike ajụjụ nke Ὅτι webatara
  choice: E gosipụtara ya dịka ajụjụ “Gịnị mere ...?”
  alternative: “Olee otú o si bụrụ na ...?”
  rationale: Ha abụọ kwekọrọ n’ọrụ ὅτι n’ebe a. Isi ederede jiri ajụjụ kacha doo anya n’Igbo, ebe e debere ihe ọzọ o nwere ike ịpụta n’ala peeji.
- issue: Ụdị ọbịbịa Ịlaịja
  choice: “Ịlaịja aghaghị ibu ụzọ bịa” na-enweghị nkọwa agbakwunyere
  alternative: “Ịlaịja aghaghị ibu ụzọ bịaghachi” ma ọ bụ “Ịlaịja aghaghị ịbịa tupu Mesaya abịa”
  rationale: Ederede Grik ekwughị “ọzọ” ma ọ bụ kpọọ Mesaya aha n’amaokwu a; ịgbakwunye ha ga-ekpebi nkọwa nke ederede hapụrụ n’ọnọdụ ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị ode akwụkwọ” dịka aha ọrụ akụkọ ihe mere eme, ebe “nọ na-ajụ” na-echekwa omume na-aga n’ihu nke imperfect Grik.
