revisions:
- from: Mgbe mmụọ ahụ tisịrị mkpu ma mee ka ahụ ya maa jijiji nke ukwuu[a], o si n’ime ya pụta. Nwata ahụ wee dị ka onye nwụrụ anwụ, nke mere na ọtụtụ ndị nọ na-ekwu[b], “Ọ nwụọla.”
  to: Mgbe mmụọ ahụ tisịrị mkpu ma mee ka nwata ahụ maa jijiji nke ukwuu[a], o si n’ime ya pụta; nwata ahụ wee dị ka onye nwụrụ anwụ, nke mere na ọtụtụ ndị nọ na-ekwu[b], “Ọ nwụọla.”
  rationale: 'The revision resolves the only substantive clarity problem by explicitly identifying the boy as the one convulsed. It retains the source’s ambiguity concerning whether the boy actually died: the narrator says he was like a dead person, while the statement that he died remains the crowd’s conclusion. The footnote is refined to reflect the Greek wording more exactly.'
