  text: καὶ ⸂κράξας καὶ πολλὰ σπαράξας⸃ ἐξῆλθεν· καὶ ἐγένετο ὡσεὶ νεκρὸς ὥστε ⸀τοὺς πολλοὺς λέγειν ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: ig
  text: Mgbe mmụọ ahụ tisịrị mkpu ma mee ka nwata ahụ maa jijiji nke ukwuu[a], o si n’ime ya pụta; nwata ahụ wee dị ka onye nwụrụ anwụ, nke mere na ọtụtụ ndị nọ na-ekwu[b], “Ọ nwụọla.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mee ka nwata ahụ maa jijiji n’ike.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “o wee dị ka onye nwụrụ anwụ”; nke a na-akọ otú o si yie ndị nọ ebe ahụ, ọ bụghị nkwupụta doro anya na ọ nwụrụ n’ezie.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: tisịrị mkpu
  rationale: Aorist participle ahụ na-egosi ihe mere tupu ἐξῆλθεν; “tisịrị mkpu” na-edobe echiche nke iti mkpu n’enweghị ịkọwa ụda ya karịa ihe Grik kwuru.
- source_word: πολλὰ σπαράξας
  choice: mee ka ahụ ya maa jijiji nke ukwuu
  rationale: N’ọnọdụ ịchụ mmụọ ọjọọ a, σπαράσσω na-ezo aka n’ime ka ahụ maa jijiji ma ọ bụ kụwaa n’ọkpụkpụ, ọ bụghị ịdọka anụ ahụ. πολλὰ na-eme ka ike omume ahụ pụta ìhè.
- source_word: ἐξῆλθεν
  choice: o si n’ime ya pụta
  rationale: Onye a na-aghọta dị ka isiokwu bụ mmụọ ahụ e kwuru banyere ya n’akụkụ gbara amaokwu a gburugburu; “si n’ime ya pụta” na-eme ka nghọta ahụ doo anya n’Igbo.
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: Nwata ahụ wee dị ka onye nwụrụ anwụ
  rationale: “Dị ka” na-edobe ntụnyere ὡσεὶ ma ghara ikwu na onye na-akọ akụkọ kwadoro na nwata ahụ nwụrụ n’ezie.
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: nke mere na ọtụtụ ndị nọ na-ekwu
  rationale: “Ọtụtụ ndị” na-egosipụta τοὺς πολλούς n’enweghị ime ka ọ bụrụ “ihe ka ọtụtụ”; “nọ na-ekwu” na-egosi omume na-aga n’ihu nke λέγειν.
- source_word: ὅτι ἀπέθανεν
  choice: “Ọ nwụọla.”
  rationale: Okwu a kpọmkwem na-ada nke ọma n’Igbo, ebe “nwụọla” na-egosipụta nkwubi okwu ndị nọ ebe ahụ mere na ọnwụ emeelala.
theological_decisions:
- issue: Ma nwata ahụ ọ nwụrụ n’ezie ka ọ bụ naanị na ọ dị ka onye nwụrụ anwụ
  choice: E kwuru na nwata ahụ dị ka onye nwụrụ anwụ, ebe ọnwụ ya bụ ihe ọtụtụ ndị kwuru.
  alternative: Ikwu hoo haa na nwata ahụ nwụrụ nwa oge, ma ọ bụ ikwu na o nweghị ihe mere ya ma e wezụga ọdịdị elu.
  rationale: ὡσεὶ bụ ntụnyere (“dị ka”), ebe ὅτι ἀπέθανεν bụ nkwubi okwu ndị mmadụ kwuru, ọ bụghị nkwupụta doro anya nke onye na-akọ akụkọ. Nsụgharị ahụ na-edobe ọdịiche a.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Mmụọ ahụ” na “nwata ahụ” na-eme ka ndị a na-ekwu banyere ha doo anya n’Igbo, ebe a ka debere ntụnyere na mgbagwoju anya dị n’ihe odide Grik.
