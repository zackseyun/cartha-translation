    reason: lexical_alternative
  revision_rationale: 'The revision resolves the only substantive clarity problem by explicitly identifying the boy as the one convulsed. It retains the source’s ambiguity concerning whether the boy actually died: the narrator says he was like a dead person, while the statement that he died remains the crowd’s conclusion. The footnote is refined to reflect the Greek wording more exactly.'
