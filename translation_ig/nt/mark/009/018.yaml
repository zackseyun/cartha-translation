id: MRK.9.18
reference: Mark 9:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: ig
  text: Ebe ọ bụla mmụọ ahụ jidere ya, ọ na-akụda ya n’ala; ọ na-agbọ ụfụfụ, na-ata ikikere ezé ya, ahụ ya ana-ekwesi ike.[a] Agwara m ndị na-eso ụzọ gị ka ha chụpụ ya, ma ha enweghị ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị okwu a, “ahụ ya na-ala n’iyi,” “ahụ ya na-akpọnwụ,” ma ọ bụ “ahụ ya na-akpọ nkụ.” N’ụzọ nkịtị karị, ọ bụ “ọ na-akpọ nkụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: Ebe ọ bụla
  rationale: Nkebiokwu a na-egosi ọnọdụ na-eme ugboro ugboro n’ebe ọ bụla; “Ebe ọ bụla” na-eweta echiche ahụ n’Igbo nkịtị.
- source_word: καταλάβῃ
  choice: jidere
  rationale: Okwu a pụtara ijide mmadụ n’ike. “Jidere” dabara n’omume ọjọọ nke mmụọ ahụ ma kwekọọ na aorist subjunctive nke na-egosi ihe na-eme mgbe ọ bụla.
- source_word: ῥήσσει
  choice: na-akụda ya n’ala
  rationale: N’ọnọdụ a, ngwaa ahụ na-egosi na mmụọ ahụ na-eme ka nwata ahụ daa n’ike. Nsụgharị a doro anya karịa okwu nwere ike ime ka a ghọta na ọ na-adọka ahụ ya.
- source_word: ἀφρίζει
  choice: na-agbọ ụfụfụ
  rationale: Nke a bụ ụzọ Igbo si akọwa ịpụta ụfụfụ n’ọnụ n’ụzọ a na-aghọta ngwa ngwa.
- source_word: τρίζει τοὺς ὀδόντας
  choice: na-ata ikikere ezé
  rationale: Akpaalaokwu Igbo a na-egosi ịna-akụkọta ma ọ bụ ịna-egweri ezé, nke dabara na mgbaàmà anụ ahụ e kwuru ebe a.
- source_word: ξηραίνεται
  choice: ahụ ya ana-ekwesi ike
  rationale: N’usoro mgbaàmà ndị a, nke a na-enye echiche nke ahụ ịkpọchi ma ọ bụ ikwesi ike. E debere nkọwa nkịtị karịa nke ngwaa ahụ n’ala peeji n’ihi na ihe ọ pụtara kpọmkwem ebe a edochaghị anya.
- source_word: εἶπα
  choice: Agwara m
  rationale: N’Igbo, “Agwara m” bụ ụzọ ebumpụta ụwa isi kwuo na onye ahụ nyere ndị na-eso ụzọ ahụ iwu ma ọ bụ rịọ ha ka ha mee ihe.
- source_word: ἐκβάλωσιν
  choice: ka ha chụpụ ya
  rationale: “Chụpụ” bụ okwu Igbo kwesịrị ekwesị maka ịchụ mmụọ ọjọọ n’ime mmadụ, ebe “ya” na-edobe nnọchiaha dị n’asụsụ Grik.
- source_word: οὐκ ἴσχυσαν
  choice: ma ha enweghị ike
  rationale: Nke a na-egosi enweghị ike ime ihe ahụ n’etinyeghị nkọwa ọzọ banyere ihe mere ha ji daa.
theological_decisions:
- issue: Ihe αὐτό na-anọchi anya na “ka ha chụpụ ya”
  choice: “Ya” na-ezo aka na mmụọ ahụ na-emekpa nwata ahụ ahụ.
  alternative: A pụrụ ịghọta ya n’ụzọ sara mbara dị ka nsogbu ahụ na-emekpa ya ahụ.
  rationale: Akụkọ gbara amaokwu a gburugburu na-ekwu maka mmụọ ọjọọ bi n’ime nwata ahụ nke ndị na-eso ụzọ ahụ chọrọ ịchụpụ. Iji “ya” eme ihe na-edobe nnọchiaha nke Grik ma ghara ịgbasa okwu ahụ karịa ihe e dere.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. E debere usoro mgbaàmà ndị dị na Grik, ma tinye akara ala peeji [a] kpọmkwem n’ebe ξηραίνεται pụtara ka njikọ ya doo anya.
