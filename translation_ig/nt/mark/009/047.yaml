id: MRK.9.47
reference: Mark 9:47
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: ig
  text: Ọ bụrụkwa na anya gị na-eme ka ị sụọ ngọngọ, tụpụ ya. Ọ kaara gị mma ka ị banye n’alaeze Chineke dịka onye nwere otu anya karịa ka a tụba gị na Gehena[a] mgbe ị nwere anya abụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “hel.” Okwu Grik bụ “Gehena,” aha sitere na Ndagwurugwu Hinom nke e jikwa mee ihe maka ikpe nke oge ikpeazụ.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: na-eme ka ị sụọ ngọngọ
  rationale: Nke a na-edobe ihe atụ nke ịsụ ngọngọ dị na Grik, ma n’ọnọdụ a ọ na-egosikwa ihe na-eduba mmadụ ná mmehie n’enweghị ịkpa ókè ahụ n’ụzọ dị warara.
- source_word: ἔκβαλε
  choice: tụpụ ya
  rationale: ἐκβάλλω pụtara ịtụpụ ma ọ bụ ịchụpụ. “Tụpụ ya” bụ okwu Igbo dị ndụ ma sie ike, na-etinyeghị echiche pụrụ iche nke ịghọpụ anya nke ngwaa ahụ n’onwe ya ekwughị kpọmkwem.
- source_word: καλόν
  choice: Ọ kaara gị mma
  rationale: Ọ bụ ezie na καλόν bụ “ọ dị mma,” nhazi ya na ἤ (“karịa”) chọrọ ntụnyere; “ọ kaara gị mma” bụ Igbo nkịtị nke na-egosipụta ya nke ọma.
- source_word: μονόφθαλμον
  choice: iji otu anya
  rationale: Nke a na-enye echiche nke onye nwere naanị otu anya n’ụzọ dabara adaba n’ahịrịokwu Igbo.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ ntụgharị doro anya ma bụrụkwa okwu a maara nke ọma maka ọchịchị ma ọ bụ alaeze Chineke, na-ahapụghị ịdị arọ nke okwu ahụ.
- source_word: βληθῆναι
  choice: bụrụ onye a tụbara
  rationale: Nke a na-edobe ụdị nnara-eme nke infinitive Grik, ya bụ, na onye ọzọ tụbara onye ahụ.
- source_word: γέενναν
  choice: Gehena
  rationale: Ntụgharị-ụda “Gehena” na-edobe aha pụrụ iche nke sitere na Ndagwurugwu Hinom na njikọ ya na ikpe ikpeazụ, kama ịgbasa ya ozugbo ka ọ bụrụ naanị okwu izugbe maka hel.
theological_decisions:
- issue: Otú e si sụgharị γέεννα n’okwu gbasara ikpe
  choice: Gehena
  alternative: hel
  rationale: Grik ji okwu pụrụ iche γέεννα, ọ bụghị okwu izugbe maka ụwa ndị nwụrụ anwụ ma ọ bụ ntaramahụhụ. Ide “Gehena” na-edobe ọdịiche ahụ na mgbọrọgwụ ya na Ndagwurugwu Hinom; a kọwara ihe ọ pụtara n’ala peeji.
- issue: Ihe σκανδαλίζῃ pụtara n’ịdọ aka ná ntị a
  choice: na-eme ka ị sụọ ngọngọ
  alternative: na-eme ka i mee mmehie
  rationale: Nhọrọ a na-edobe ihe atụ mbụ nke Grik na nghọta omume ya, n’emeghị ka okwu ahụ bụrụ naanị otu nkọwa e mesịrị gbasara mmehie.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Sụọ ngọngọ” na-edobe ihe atụ nke Grik; “tụpụ ya” na-edobe ike iwu ahụ n’etinyeghị nkọwa nke ‘ghọpụ’ nke na-adịghị na ngwaa Grik. Akara ala peeji [a] dị n’isiokwu ozugbo n’azụ “Gehena.”
