  naturalness: The verse is generally clear Standard Igbo. Recasting the comparison makes the one-eyed condition and the passive outcome more explicit and idiomatic without adding interpretation.
  terminology: “Alaeze Chineke” and “Gehena” are appropriate. The footnote responsibly gives “hel” as an alternative while retaining the historically specific main-text term.
