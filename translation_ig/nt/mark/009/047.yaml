    rationale: μονόφθαλμον describes the person as one-eyed, not the means by which the person enters. “dịka onye nwere otu anya” conveys the predicate more clearly.
  revised_text: Ọ bụrụkwa na anya gị na-eme ka ị sụọ ngọngọ, tụpụ ya. Ọ kaara gị mma ka ị banye n’alaeze Chineke dịka onye nwere otu anya karịa ka a tụba gị na Gehena[a] mgbe ị nwere anya abụọ.
