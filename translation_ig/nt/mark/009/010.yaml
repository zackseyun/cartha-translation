review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the disciples’ keeping Jesus’ statement within their circle and their attempt to understand resurrection language. However, “isi n’etiti ndị nwụrụ anwụ bilie” is not a well-formed or natural Igbo rendering of the articular infinitive ἐκ νεκρῶν ἀναστῆναι; it needs the infinitival/nominal form “ibilite.”
  naturalness: '“Ha debere okwu ahụ n’etiti onwe ha” is understandable, but “debeere” better expresses keeping the saying to themselves. The quoted construction in the second clause is unnatural and should be replaced with a normal Igbo content clause: “ihe ibilite n’ọnwụ pụtara.”'
  terminology: 'Use “ibilite n’ọnwụ” for the accessible main rendering of resurrection, while the footnote can preserve the more explicit sense of ἐκ νεκρῶν, “ibilite site n’etiti ndị nwụrụ anwụ.” The existing footnote b is inaccurate: “N’ụzọ dị mkpirikpi” does not mean “more literally,” and “isi n’ọnwụ bilie” is grammatically defective.'
  issues:
  - severity: high
    issue: Malformed rendering of the resurrection infinitive
    rationale: “isi n’etiti ndị nwụrụ anwụ bilie” lacks the required infinitival form and is not natural Standard Igbo. It obscures the sense of ἀναστῆναι, “to rise.”
  - severity: medium
    issue: Footnote b is both mislabeled and linguistically defective
    rationale: “N’ụzọ dị mkpirikpi” means roughly “briefly,” not “more literally”; moreover, “isi n’ọnwụ bilie” is not a valid alternative translation and omits the explicit plural sense of νεκρῶν.
  - severity: low
    issue: Verb choice for keeping the saying
    rationale: “Debeere ... n’etiti onwe ha” more naturally conveys κρατέω πρὸς ἑαυτούς, retaining the saying within their own group.
  revised_text: Ha debeere okwu ahụ n’etiti onwe ha[a], na-atụle ihe ibilite n’ọnwụ pụtara.[b]
