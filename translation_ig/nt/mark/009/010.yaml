- from: Ha debere okwu ahụ n’etiti onwe ha[a], na-atụle ihe “isi n’etiti ndị nwụrụ anwụ bilie” pụtara.[b]
  to: Ha debeere okwu ahụ n’etiti onwe ha[a], na-atụle ihe ibilite n’ọnwụ pụtara.[b]
  rationale: 'The revision retains the source’s sequence and ambiguity: the disciples keep Jesus’ saying within their group while discussing its meaning. “Ibilite n’ọnwụ” is natural modern Standard Igbo for the main text, and the footnote supplies the more explicit “from among the dead” force without introducing doctrinal explanation.'
