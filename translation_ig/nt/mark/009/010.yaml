  text: καὶ τὸν λόγον ἐκράτησαν πρὸς ἑαυτοὺς συζητοῦντες τί ἐστιν τὸ ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/010.yaml
  text: And they kept the matter to themselves[b][a], discussing what it meant to rise from the dead.
translation:
  language: ig
  text: Ha debeere okwu ahụ n’etiti onwe ha[a], na-atụle ihe ibilite n’ọnwụ pụtara.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ahụ o kwuru.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ kpọmkwem, “ibilite site n’etiti ndị nwụrụ anwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: okwu ahụ
  rationale: N’ebe a, λόγος na-ezo aka n’ihe Jizọs kwuru n’amaokwu bu ụzọ. “Okwu ahụ” bụ ntụgharị Igbo dị mfe ma na-edobe njikọ ahụ.
- source_word: ἐκράτησαν πρὸς ἑαυτοὺς
  choice: debere ... n’etiti onwe ha
  rationale: Ngwakọta okwu a na-egosi na ha jidere okwu ahụ n’ime òtù ha, ghara ịkọrọ ya ndị ọzọ; ọ dịkwa nso n’echiche nke ha na-ekwurịta ya n’etiti onwe ha.
- source_word: συζητοῦντες
  choice: na-atụle
  rationale: “Na-atụle” na-egosi mkparịta ụka iji ghọta ihe, n’etinyeghị echiche na ha na-arụrịta ụka n’ike.
- source_word: τί ἐστιν
  choice: ihe ... pụtara
  rationale: N’agbanyeghị na ọdịdị okwu Grik bụ “ihe ọ bụ,” n’ọnọdụ a ndị na-eso ụzọ na-achọ ịghọta ihe okwu Jizọs pụtara.
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: “isi n’etiti ndị nwụrụ anwụ bilie”
  rationale: Nke a na-edobe ἐκ, ya bụ isi n’etiti ndị nwụrụ anwụ pụta, ma na-egosikwa na ọ bụ okwu ahụ kpọmkwem ka ha na-atụle.
theological_decisions:
- issue: Okwu mbilite n’ọnwụ nke ndị na-eso ụzọ na-atụle
  choice: isi n’etiti ndị nwụrụ anwụ bilie
  alternative: isi n’ọnwụ bilie
  rationale: Nhọrọ a na-edobe nghọta kpọmkwem nke ἐκ νεκρῶν na mgbagwoju anya ndị na-eso ụzọ, n’akọwaghị ya site n’ozizi e mesịrị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “debere ... n’etiti onwe ha” iji gosipụta nzuzo na mkparịta ụka dị n’ime òtù ahụ; a hapụrụ mgbagwoju anya banyere mbilite n’ọnwụ ka ọ dị na isi mmalite.
