  source_fidelity: 'The main rendering accurately conveys οὐ γὰρ ᾔδει τί ἀποκριθῇ: Peter did not know what to answer. It also rightly keeps the plural referent in the final clause. “Oké egwu jidere ha” is an idiomatic rendering of their intense fear and reasonably conveys their entering that state, though it is less formally close to ἐγένοντο than “ha ghọrọ ndị ụjọ tụrụ nke ukwuu.”'
