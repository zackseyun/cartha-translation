  yaml_path: translation/nt/mark/009/006.yaml
  text: For he did not know what he should answer[b][a], for they were terrified.
translation:
  language: ig
  text: N’ihi na ọ maghị ihe ọ ga-aza[a], n’ihi na oké egwu jidere ha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ọ ga-ekwu dịka nzaghachi.”
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ dị nso n’okwu Grik: “n’ihi na ha ghọrọ ndị ụjọ tụrụ nke ukwuu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: ọ maghị
  rationale: Οἶδα na-egosi ịma ma ọ bụ ịghọta ihe; ụdị oge gara aga nke Igbo a na-enye echiche οὐ ᾔδει n'ụzọ doro anya ma dịkwa eke.
- source_word: τί ἀποκριθῇ
  choice: ihe ọ ga-aza
  rationale: Ἀποκρίνομαι pụtara ịza ma ọ bụ ikwu ihe dịka nzaghachi; ‘ihe ọ ga-aza’ na-echekwa echiche nke ajụjụ banyere ihe kwesịrị ịbụ nzaghachi ya.
- source_word: ἔκφοβοι
  choice: oké egwu jidere ha
  rationale: Ἔκφοβος na-egosi egwu siri ike karịa naanị ịtụ egwu; akpaokwu a bụ ụzọ Igbo dị eke isi kwuo na ụjọ tụrụ ha nke ukwuu.
- source_word: ἐγένοντο
  choice: jidere ha
  rationale: N'ọnọdụ a, γίνομαι na-egosi na ha banyere n'ọnọdụ egwu. ‘Jidere ha’ na-egosi mmalite ma ọ bụ ịdakwasị ha nke egwu karịa naanị ikwu ‘ha tụrụ egwu.’
- source_word: γὰρ ... γὰρ
  choice: n’ihi na ... n’ihi na
  rationale: Ikwughachi ‘n’ihi na’ ugboro abụọ na-echekwa njikọ nkọwa nke γάρ abụọ ahụ n’agbanyeghị na nke a dịtụ arọ n’Igbo.
theological_decisions:
- issue: Onye ma ọ bụ ndị e zoro aka na ha n’ahịrịokwu nke abụọ
  choice: ha
  alternative: ọ
  rationale: Ἔκφοβοι na ἐγένοντο bụ ụdị ọtụtụ; ya mere, ha na-ezo aka n’ebe Pita na ndị ya na ha nọ nọ, ọ bụghị naanị Pita. Nke a bụ mkpebi ụtọasụsụ, ọ bụghị itinye nkọwa ozizi.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara γὰρ abụọ ahụ, ebe e ji akpaokwu Igbo eke ‘oké egwu jidere ha’ gosipụta ike ἔκφοβοι na nbanye n’ọnọdụ ahụ nke ἐγένοντο.
