  terminology: “Ọ ga-aza” correctly preserves the reply-specific force of ἀποκριθῇ. “Oké egwu jidere ha” naturally expresses the intensified fear of ἔκφοβοι without overstating it. The revised note supplies a grammatical closer alternative that makes the change-of-state nuance explicit.
