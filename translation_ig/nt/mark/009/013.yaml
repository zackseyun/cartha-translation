id: MRK.9.13
reference: Mark 9:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: ig
  text: Ma ana m agwa unu na Ịlaịja abịaworịkwa[a], ha mere ya ihe ọ bụla ha chọrọ, dị nnọọ ka e dere banyere ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, Ịlaịja abịaworị site n’ọrụ na ozi Jọn Onye Na-eme Baptizim; lee Mak 9:11–12, tụleekwa Matiu 11:14; 17:12–13.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Na-egosi mgbanwe megidere ihe ndị na-eso ụzọ tụrụ anya ya; ọ bụkwa okwu Igbo dị mfe ma dabara n'ọnọdụ a.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Na-echekwa onye na-ekwu okwu na ndị ọ na-agwa, ma na-ada nke ọma n'Igbo ugbu a.
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: na Ịlaịja abịaworị
  rationale: '‘Abịaworị’ na-egosipụta perfect ἐλήλυθεν: ọbịbịa ahụ emezuola, ihe ọ pụtara ka dịkwa mkpa ugbu a. N''Igbo, -rị na-enyekwa echiche ‘already/also’ n''ọnọdụ a n''enweghị okwu na-adịghị eke.'
- source_word: ἐποίησαν αὐτῷ
  choice: ha mekwara ya
  rationale: Na-echekwa okwu sara mbara nke ποιέω tupu nkebi na-esote akọwaa ihe ha mere, ma na-ada eke n'Igbo.
- source_word: ὅσα ἤθελον
  choice: ihe ọ bụla ha chọrọ
  rationale: 'Na-egosipụta oke na-enweghị mgbochi nke ὅσα: ihe niile ha chọrọ ime ya.'
- source_word: καθὼς γέγραπται
  choice: dị nnọọ ka e dere
  rationale: Na-echekwa usoro a na-eji arụtụ aka n'Akwụkwọ Nsọ, ma ‘dị nnọọ ka’ na-egosipụta καθὼς nke ọma.
- source_word: ἐπ’ αὐτόν
  choice: banyere ya
  rationale: N'usoro a nke γράφω, echiche kachasị kwesị ekwesị bụ ‘concerning/about him’; a naghị akpọchi ya ka ọ bụrụ ‘megide ya.’
theological_decisions:
- issue: Onye ‘Ịlaịja’ na-anọchi anya n'okwu a
  choice: A hapụrụ ‘Ịlaịja’ n'ahịrịokwu bụ isi n'enweghị nkọwa agbakwunyere.
  alternative: Ịkọwa n'ahịrịokwu bụ isi na Ịlaịja bụ Jọn Onye Na-eme Baptizim.
  rationale: Ederede Grik kpọrọ Ịlaịja aha kpọmkwem. Ọ bụ ezie na ọnọdụ okwu ahụ na-ejikọta ya na Jọn Onye Na-eme Baptizim, ekwesịghị itinye nkọwa ahụ n'ime amaokwu ahụ; e debere ya n'ala peeji ka esemokwu na omimi nke ederede dịgide.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma doo ndị nkịtị anya. A họọrọ ‘abịaworị’ iji gosipụta omume mezuru nke ka nwere mkpa ugbu a; a zere ịtinye njirimara Jọn n'ime ederede bụ isi.
