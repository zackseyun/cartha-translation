  rationale: The revision preserves the source’s perfect aspect through «abịaworị» and explicitly represents καὶ with -kwa. It also removes the potentially misplaced additive nuance from «mekwara» while retaining the broad wording ‘did to him whatever they wanted.’ No theological interpretation has been added to the main text.
