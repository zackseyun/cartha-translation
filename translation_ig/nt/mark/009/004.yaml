revisions:
- from: Ịlaịja na Mosis pụtakwara ìhè n’ihu ha, ha abụọ na Jizọs na-akparịtakwa ụka.
  to: Ịlaịja pụtara n’ihu ha, ya na Mosis; ha nọ na Jizọs na-akparịta ụka.
  rationale: The revision removes the unintended radiance in «pụta ìhè», follows the singular syntax of ὤφθη with Elijah appearing accompanied by Moses, and marks the continuing conversation with «ha nọ na». It neither explains the event as a vision nor adds theological interpretation.
  reviewer_model: gpt-5.6-terra
