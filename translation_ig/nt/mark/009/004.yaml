  text: καὶ ὤφθη αὐτοῖς Ἠλίας σὺν Μωϋσεῖ, καὶ ἦσαν συλλαλοῦντες τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: ig
  text: Ịlaịja pụtara n’ihu ha, ya na Mosis; ha nọ na Jizọs na-akparịta ụka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: pụtara ìhè n’ihu ha
  rationale: Aorist passive nke ὁράω ebe a pụtara na mmadụ pụtara ka a hụ ya. Nkebi a bụ Igbo doro anya nke na-egosi mpụta ahụ n’ihu ndị na-eso ụzọ, na-agbanweghị ya ka ọ bụrụ naanị ọhụụ n’uche.
- source_word: αὐτοῖς
  choice: n’ihu ha
  rationale: Dative a na-egosi ndị hụrụ mpụta ahụ; ‘n’ihu ha’ bụ ụzọ Igbo sitere n’okike kwuo na ha pụtara nye ndị ahụ.
- source_word: Ἠλίας
  choice: Ịlaịja
  rationale: Ụdị aha onye amụma a a na-ejikarị eme ihe n’Igbo.
- source_word: σὺν Μωϋσεῖ
  choice: na Mosis
  rationale: σύν na-egosi iso mmadụ nọ; ‘na Mosis’ na-enye ya n’ụzọ Igbo dị mfe ma na-edebe Mosis dịka onye so Ịlaịja pụta.
- source_word: συλλαλοῦντες
  choice: na-akparịtakwa ụka
  rationale: Okwu a na-egosi mkparịta ụka mmadụ na ibe ya, ọ bụghị naanị otu onye ịgwa onye ọzọ okwu. ‘Na-akparịta ụka’ na-egosipụta mmekọrịta ahụ nke ọma.
- source_word: τῷ Ἰησοῦ
  choice: na Jizọs
  rationale: Dative ahụ na ngwaa συλλαλέω na-egosi onye ha na ya na-akparịta ụka; ‘na Jizọs’ bụ Igbo sitere n’okike ma na-edebe echiche nke mkparịta ụka ọnụ.
theological_decisions:
- issue: Ụdị mpụta Ịlaịja na Mosis na ihe ha mere n’oge nnwogha ahụ
  choice: E kwuru kpọmkwem na Ịlaịja na Mosis pụtara ìhè n’ihu ha ma soro Jizọs kparịta ụka.
  alternative: Ịkọwa ya dịka naanị ọhụụ, ihe nnọchianya, ma ọ bụ mpụta na-abụghị nke mmadụ n’onwe ya.
  rationale: Akụkọ Grik na-egosi ha dịka ndị pụtara ma na Jizọs na-akparịta ụka. Nsụgharị ahụ ekwesịghị ịgbakwunye nkọwa ozizi ma ọ bụ belata eziokwu akụkọ ahụ kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘pụtara ìhè n’ihu ha’ zere ụdị siri ike ma debe echiche nke ὤφθη; e ji ‘na-akparịta ụka’ gosi mkparịta ụka ọnụ nke συλλαλοῦντες.
