  yaml_path: translation/nt/mark/009/046.yaml
  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: ig
  text: ebe[a] ikpuru ha na-adịghị anwụ anwụ, ọkụ ahụkwa na-adịghị anyụ anyụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a adịghị n’ime ihe odide Grik ndị kacha ochie (gụnyere Codex Sinaiticus na Codex Vaticanus nke narị afọ nke anọ), ọ dịghịkwa n’ime nsụgharị Coptik oge ochie. Ma ọ dị n’ọtụtụ ihe odide ọdịnala Byzantine nakwa n’ọdịnala Latin. O yikarịrị ka ndị odeakwụkwọ mechara tinye ya site n’ịmegharị otu okwu ahụ dị n’amaokwu 48 (nakwa n’amaokwu 44).
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: ikpuru
  rationale: “Ikpuru” bụ okwu Igbo nkịtị maka worm ma ọ bụ maggot na-eri ihe rere ere; ọ na-echekwakwa njikọ doro anya ya na Aịzaya 66:24.
- source_word: τελευτᾷ
  choice: na-adịghị anwụ anwụ
  rationale: N’ọnọdụ a, τελευτάω pụtara ịnwụ ma ọ bụ iru ọgwụgwụ. Usoro a na-egosipụta omume na-aga n’ihu nke na-adịghị akwụsị.
- source_word: σβέννυται
  choice: na-adịghị anyụ anyụ
  rationale: Maka ọkụ, “ịnyụ” bụ ụzọ Igbo sitere n’okike isi kwuo na ọkụ akwụsịla ire; mmegharị okwu ahụ na-egosipụta na ọkụ ahụ anaghị akwụsị ma ọlị.
theological_decisions:
- issue: Ihe oyiyi nke ikpuru na ọkụ na-adịghị akwụsị
  choice: E debere ihe oyiyi ahụ kpọmkwem n’enweghị nkọwa ọzọ banyere ọdịdị ntaramahụhụ ahụ.
  alternative: Ịkọwa ya n’ụzọ ga-ekpebi kpọmkwem ma ọ bụ ihe atụ ka ọ bụ ihe nkịtị.
  rationale: Asụsụ Grik sitere n’Aịzaya 66:24 na-eji ihe oyiyi siri ike eme ihe ma ọ naghị edozi ajụjụ ahụ n’amaokwu a; nsụgharị ekwesịghị itinye nkọwa otu ụka.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “ikpuru” mee ka ihe oyiyi ahụ bụrụ nke nkịtị ma doo anya; e jikwa mmegharị “anwụ anwụ” na “anyụ anyụ” gosipụta nkwụsịghị nke ngwaa ndị Grik dị n’oge ugbu a.
