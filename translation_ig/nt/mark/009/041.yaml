- from: N’ihi na onye ọ bụla nke nyere unu otu iko mmiri ka unu ṅụọ n’ihi na unu bụ ndị Mesaya, n’ezie, ana m asị unu, ọ gaghị efunahụ ụgwọ ọrụ ya ma ọlị.
  to: N’ihi na onye ọ bụla nke nyere unu otu iko mmiri ka unu ṅụọ n’aha ahụ, n’ihi na unu bụ ndị nke Mesaya, n’ezie, ana m asị unu, ọ gaghị efunahụ ụgwọ ọrụ ya ma ọlị.
  rationale: The revision restores the omitted ἐν ὀνόματι as “n’aha ahụ” while avoiding the unsupported expansion “n’aha m.” It also renders χριστοῦ ἐστε as belonging to the Messiah and supplies a footnote to preserve the syntactic ambiguity of the Greek construction.
