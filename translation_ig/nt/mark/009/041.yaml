id: MRK.9.41
reference: Mark 9:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: ig
  text: N’ihi na onye ọ bụla nke nyere unu otu iko mmiri ka unu ṅụọ n’aha ahụ, n’ihi na unu bụ ndị nke Mesaya, n’ezie, ana m asị unu, ọ gaghị efunahụ ụgwọ ọrụ ya ma ọlị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: N’ihi na onye ọ bụla nke
  rationale: “Onye ọ bụla nke” na-egosipụta indefinite relative construction ahụ n’Igbo doro anya, ebe “N’ihi na” na-edobe njikọ γάρ na okwu bu ya ụzọ.
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: nyere unu otu iko mmiri ka unu ṅụọ
  rationale: Nke a na-egosipụta echiche ποτίζω, ‘inye mmadụ ihe ka ọ ṅụọ,’ ma na-ada ka Igbo nkịtị.
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: n’ihi na unu bụ ndị Mesaya
  rationale: N’ebe a, ἐν ὀνόματι na-esochi nkọwa ὅτι χριστοῦ ἐστε; nsụgharị a na-egosipụta ihe mere e ji nye ha mmiri—njikọ ha na Mesaya—n’enweghị itinye ‘n’aha m,’ nke adịghị kpọmkwem n’ihe odide Greek.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: n’ezie, ana m asị unu
  rationale: Ọ bụ usoro okwu siri ike Jizọs ji emesi ihe ọ na-ekwu ike; okwu Igbo a bụ nke dị ùgwù ma doo anya.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: ọ gaghị efunahụ ... ma ọlị
  rationale: “Ọ gaghị ... ma ọlị” na-ebupụta nkwụsi ike nke emphatic negation οὐ μή.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: ụgwọ ọrụ ya
  rationale: “Ụgwọ ọrụ” nwere ike ịpụta ụgwọ ma ọ bụ nkwụghachi e nyere mmadụ, ma dabara n’echiche μισθός n’ebe a.
theological_decisions:
- issue: Ụzọ e si sụgharịa χριστοῦ ἐστε
  choice: unu bụ ndị Mesaya
  alternative: unu bụ nke Kraịst
  rationale: “Ndị Mesaya” na-egosipụta mmekọrịta ma ọ bụ ịbụ ndị nke Mesaya n’Igbo dị mfe, ma na-edobe Χριστός dị ka aha-ọkwa ‘Mesaya,’ ọ bụghị nanị aha mmadụ.
- issue: Mmekọrịta ἐν ὀνόματι na ὅτι
  choice: n’ihi na unu bụ ndị Mesaya
  alternative: n’aha ahụ, ya bụ na unu bụ ndị Mesaya
  rationale: Greek nwere nhịahụ n’usoro okwu a. A họọrọ causal sense nke ὅτι n’ahịrị bụ isi n’ihi na ọ bụ Igbo kacha eke, ma e tinyeghị ‘aha m’ n’ihi na possessive adịghị na Greek.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “Mesaya” mee aha-ọkwa Χριστός; e zere ịgbakwunye “n’aha m,” n’ihi na ọ bụghị okwu doro anya n’ihe odide Greek.
