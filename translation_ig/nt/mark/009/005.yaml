revisions:
- from: 'Pita wee zaa sị Jizọs, “Rabaị, ọ dị mma ka anyị nọrọ n’ebe a. Ka anyị wuo ụlọ ntu atọ[a]: otu maka gị, otu maka Mosis, na otu maka Ịlaịja.”'
  to: 'Pita zara Jizọs sị, “Rabaị, ọ dị mma ka anyị nọrọ n’ebe a. Ka anyị mee ụlọ ntu atọ[a]: otu maka gị, otu maka Mosis, na otu maka Ịlaịja.”'
  rationale: The revision replaces the narrower “wuo” with “mee,” improves the speech-introduction word order for natural Standard Igbo, and corrects the footnote so that it offers accurate, neutral lexical alternatives without importing an explicit sanctuary or festival association.
