  text: καὶ ἀποκριθεὶς ὁ Πέτρος λέγει τῷ Ἰησοῦ· Ῥαββί, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν ⸂τρεῖς σκηνάς⸃, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: ig
  text: 'Pita zara Jizọs sị, “Rabaị, ọ dị mma ka anyị nọrọ n’ebe a. Ka anyị mee ụlọ ntu atọ[a]: otu maka gị, otu maka Mosis, na otu maka Ịlaịja.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ụlọikwuu” ma ọ bụ “ụlọ ntu.” Okwu Grik ahụ na-ezo aka n’ebe obibi ma ọ bụ ndo a na-eme nwa oge; ọ pụrụ ịkpọtakwa echiche ụlọikwuu ma ọ bụ ụlọ ntu, ma amaokwu a ekwughị njikọ ndị ahụ hoo haa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... λέγει
  choice: wee zaa sị
  rationale: 'Nke a na-egosipụta akpaalaokwu akụkọ Grik ahụ n’Igbo eke: Pita zara wee gwa Jizọs okwu, ọ bụ ezie na e nweghị ajụjụ doro anya tupu ya.'
- source_word: Ῥαββί
  choice: Rabaị
  rationale: E debere aha nsọpụrụ Semitik a kama ịsụgharị ya naanị dị ka “Onye Ozizi,” ka ọnọdụ akụkọ ahụ na ụdị ọkpụkpọ ahụ wee nọgide.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: ọ dị mma ka anyị nọrọ n’ebe a
  rationale: Nke a na-echekwa nkwupụta Pita na ọ dị mma ka ha nọrọ ebe ahụ, n’enweghị ịgbakwunye echiche dịka “ọ bụ ihe magburu onwe ya.”
- source_word: ποιήσωμεν
  choice: Ka anyị wuo
  rationale: Ụdị subjunctive a bụ arịrịọ nke gụnyere onye na-ekwu okwu na ndị ọzọ. “Ka anyị wuo” bụ Igbo eke maka ime ụlọ ntu ndị a, ọ bụ ezie na ngwaa Grik n’onwe ya pụtara n’ozuzu ya “mee.”
- source_word: σκηνάς
  choice: ụlọ ntu
  rationale: “Ụlọ ntu” na-egosi ebe obibi ma ọ bụ ndo a na-ewu nwa oge, ma ghara ime ka ihe metụtara Ememme Ụlọ Ntu ma ọ bụ ụlọ nsọ bụrụ ihe amaokwu ahụ kwuru hoo haa.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: otu maka gị, otu maka Mosis, na otu maka Ịlaịja
  rationale: Nke a na-echekwa nkwughachi “otu” na nhazi atọ yiri ibe ha dị n’asụsụ Grik.
theological_decisions:
- issue: Ihe σκηνάς nwere ike ịpụta banyere ememme ma ọ bụ ofufe
  choice: Jiri “ụlọ ntu” n’ahịrịokwu bụ isi
  alternative: ụlọikwu; ụlọ nsọ ntu
  rationale: Amaokwu ahụ ekwughị hoo haa na Pita na-ekwu maka Ememme Ụlọ Ntu ma ọ bụ ihe nnọchianya ụlọ nsọ. Ya mere, a họọrọ okwu nkịtị nke na-egosi ụlọ a na-ewu nwa oge, ma debe nhọrọ ndị ọzọ n’okpuru amaokwu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Wee zaa sị” dabara n’usoro akụkọ Igbo; “Rabaị” na-echekwa aha nsọpụrụ mbụ; “ụlọ ntu” bụ okwu doro anya nke na-adịghị amanye nkọwa okpukpe pụrụ iche.
