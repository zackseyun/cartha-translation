  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: ig
  text: Ozugbo ahụ, nna nwata ahụ tiri mkpu sị, “Ekwere m; nyere m aka n’ekweghị-ekwe m![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nyere m aka n’ụkọ okwukwe m.” Okwu Grik ἀπιστία nwere ike ịpụta ekweghị-ekwe ma ọ bụ ụkọ okwukwe.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: Ozugbo ahụ
  rationale: Ọ na-egosi na nna ahụ zara n'egbughị oge ma na-echekwa ngwa ngwa a na-ahụkarị n'akụkọ Mak.
- source_word: κράξας
  choice: tiri mkpu
  rationale: Nkebi a na-egosi olu dara ụda nke jupụtara ná ngwa na mmetụta; ‘tiri mkpu’ na-eweta ihe abụọ ahụ n'Igbo nkịtị.
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: nna nwata ahụ
  rationale: ‘Nwata’ bụ okwu Igbo sara mbara nke dabara na παιδίον, ebe ihe gbara amaokwu ahụ gburugburu na-akọwa onye ahụ nke ọma.
- source_word: ἔλεγεν
  choice: sị
  rationale: ‘Sị’ bụ ụzọ Igbo kacha pụta ihe n'okike isi webata okwu e kwuru kpọmkwem; ọ dịghị mkpa ime ka imperfect Greek bụrụ okwu na-aga n'ihu ebe a.
- source_word: Πιστεύω
  choice: Ekwere m
  rationale: Ọ na-ejigide okwu gbasara ikwere n'ụzọ doro anya ma na-adaba na mmegide e zubere ime n'etiti πιστεύω na ἀπιστία.
- source_word: βοήθει
  choice: nyere ... aka
  rationale: Nke a bụ arịrịọ enyemaka kpọmkwem ma dị ngwa; usoro a bụ Igbo dị ugbu a ma kwekọọ na imperative Greek.
- source_word: μου τῇ ἀπιστίᾳ
  choice: ekweghị-ekwe m
  rationale: ‘Ekwụghị-ekwe m’ na-echekwa mmegide okwu dị n'etiti ‘Ekwere m’ na ‘ekweghị-ekwe,’ kama ịkọwa ya n'ụzọ ga-eme ka esemokwu ahụ laa n'iyi.
theological_decisions:
- issue: Esemokwu dị n'etiti Πιστεύω na ἀπιστίᾳ
  choice: “Ekwere m; nyere ekweghị-ekwe m aka!”
  alternative: “Ekwere m; nyere ụkọ okwukwe m aka!”
  rationale: Isi mmalite ahụ na-ejikọta ikwere n'ezie na ekweghị-ekwe ka fọdụrụ. Nsụgharị ahụ na-ahapụ esemokwu ime mmụọ a ka ọ dị, kama idozi ya ma ọ bụ mee ka ọ bụrụ nkọwa ozizi.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘nna nwata ahụ’ mee ka genitive Greek bụrụ Igbo nkịtị. A hapụrụ arịrịọ ikpeazụ n'ụdị siri ike ma dị nkenke iji chekwaa mmetụta na esemokwu dị na isi mmalite.
