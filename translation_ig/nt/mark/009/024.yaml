revisions:
- from: Ozugbo ahụ, nna nwata ahụ tiri mkpu sị, “Ekwere m; nyere ekweghị-ekwe m aka![a]”
  to: Ozugbo ahụ, nna nwata ahụ tiri mkpu sị, “Ekwere m; nyere m aka n’ekweghị-ekwe m![a]”
  rationale: The revision corrects the Igbo argument structure of the final plea while retaining the direct paradox of belief and unbelief, the urgent imperative, and the English audit trail's legitimate alternative reading.
  reviewer_model: gpt-5.6-terra
