source:
  edition: SBLGNT
  text: ⸂Ἔφη αὐτῷ ὁ Ἰωάννης⸃· Διδάσκαλε, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, ⸂καὶ ἐκωλύομεν αὐτόν, ὅτι οὐκ ἠκολούθει ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: ig
  text: Jọn sịrị ya, “Onye Ozizi, anyị hụrụ otu onye ka ọ na-achụpụ mmụọ ọjọọ n’aha gị, anyị gbalịrị igbochi ya[a], n’ihi na ọ naghị eso anyị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị na-achọ igbochi ya.” Ụdị ngwaa Grik ahụ nwere ike ịkọwa omume e mere ugboro ugboro ma ọ bụ mgbalị e mere; n’ihi ya, e ji “anyị gbalịrị igbochi ya” mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: Jọn sịrị ya
  rationale: A sụgharịrị ngwaa akụkọ ἔφη dị ka “sịrị,” ebe αὐτῷ na ὁ Ἰωάννης pụtara “ya” na “Jọn.” Nke a bụ usoro okwu Igbo doro anya ma dịkwa mma n’akụkọ.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: διδάσκαλος pụtara onye na-ezi ihe. “Onye Ozizi” na-ezipụta aha a kpọrọ Jizọs n'ụzọ ziri ezi, n’enweghị itinye nkọwa ọzọ dịka “Rabaị” ma ọ bụ “Nna Ukwu.”
- source_word: εἴδομέν τινα
  choice: anyị hụrụ otu onye
  rationale: τινα na-ekwu maka onye a na-akọwaghị kpọmkwem. “Otu onye” bụ ụzọ Igbo ebumpụta ụwa si gosi nke a.
- source_word: ἐν τῷ ὀνόματί σου
  choice: n’aha gị
  rationale: Nke a na-echekwa akpaalaokwu nke isi mmalite ahụ ma na-egosi na onye ahụ ji aha na ikike Jizọs rụọ ọrụ ahụ.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: ka ọ na-achụpụ ndị mmụọ ọjọọ
  rationale: “Ịchụpụ ndị mmụọ ọjọọ” bụ okwu Igbo doro anya maka ọrụ ἐκβάλλω na δαιμόνια; usoro “ka ọ na-” na-egosikwa omume ahụ Jọn hụrụ ka ọ na-eme.
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: anyị wee gbalịa igbochi ya
  rationale: Imperfect ἐκωλύομεν nwere ike igosi mgbalị ma ọ bụ omume gara n’ihu. “Gbalịa igbochi ya” na-egosi mgbalị ahụ n’Igbo dị mfe, ebe nkọwa ala peeji na-edebe ihe ọzọ okwu Grik ahụ nwere ike ịpụta.
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: n’ihi na ọ naghị eso anyị
  rationale: A hapụrụ ἡμῖν kpọmkwem dị ka “anyị,” ọ bụghị “gị” ma ọ bụ “ndị otu anyị,” ka esemokwu dị n’otú Jọn si lekwasị anya n’òtù ndị na-eso ụzọ ghara ịla n’iyi.
theological_decisions:
- issue: Onye nwoke ahụ na-esoghị n’ahịrịokwu ikpeazụ
  choice: “ọ naghị eso anyị”
  alternative: “ọ naghị eso gị” ma ọ bụ “ọ bụghị onye otu anyị”
  rationale: 'Ihe odide Grik kwuru ἡμῖν, ya bụ “anyị.” Ide ya otú ahụ na-echekwa esemokwu dị n’akụkọ ahụ: Jọn mere ka okwu ahụ bụrụ gbasara iso òtù ndị na-eso ụzọ, ihe Jizọs ga-aza n’amaokwu ndị na-esote.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ “Onye Ozizi,” “n’aha gị,” na “ndị mmụọ ọjọọ” ka okwu ahụ bụrụ nke ebumpụta ụwa ma ka o chekwaa akpaalaokwu na echiche nke isi mmalite Grik.
