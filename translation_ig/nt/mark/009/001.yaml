id: MRK.9.1
reference: Mark 9:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: ig
  text: 'Ọ nọkwa na-agwa ha, “N’ezie, ana m agwa unu: ụfọdụ n’ime ndị guzo n’ebe a agaghị anwụ ma ọlị[a] ruo mgbe ha ga-ahụ alaeze Chineke ka ọ bịarala n’ike[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’okwu Grik, e kwuru n’ụzọ nkịtị, “agaghị edetụ ọnwụ ire ma ọlị”; nke a bụ akpaalaokwu pụtara “agaghị anwụ ma ọlị.”
    reason: lexical_alternative
  - marker: b
    text: Okwu a nwere ike izo aka na nnwogha Jizọs n’ugwu, mbilite n’ọnwụ ya, Pentikọst, ikpe dakwasịrị Jerusalem, ma ọ bụ mmezu ikpeazụ nke alaeze ahụ; amaokwu ahụ n’onwe ya ekwughị kpọmkwem nke e bu n’uche.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ọ nọkwa na-agwa ha
  rationale: Ụdị imperfect na-egosi okwu na-aga n’ihu n’akụkọ; ‘ọ nọ na-agwa’ na-echekwa akụkụ a n’Igbo, ebe ‘-kwa’ jikọtara amaokwu a na ihe bu ya ụzọ.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: N’ezie, ana m agwa unu
  rationale: ‘N’ezie’ bụ ụzọ Igbo doro anya ma dị ùgwù isi webata nkwupụta siri ike; ‘ana m agwa unu’ na-egosipụta okwu Jizọs n’oge ọ na-ekwu ya.
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: ụfọdụ n’ime ndị guzo n’ebe a
  rationale: Nke a na-echekwa echiche partitive—ọ bụghị mmadụ niile nọ ebe ahụ, kama ụfọdụ n’ime ha—ma na-ada nke ọma n’Igbo.
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: agaghị anwụ ma ọlị
  rationale: Akpaalaokwu Grik ‘detụ ọnwụ ire’ pụtara ịnwụ. Igbo nkịtị na-ekwu ‘ịnwụ’; ‘ma ọlị’ na-echekwa nkwusi ike dị na οὐ μή.
- source_word: ἕως ἂν ἴδωσιν
  choice: ruo mgbe ha ga-ahụ
  rationale: Nke a na-egosipụta ókè oge na ihe a na-atụ anya ime n’ọdịnihu n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma, na-echekwakwa ma ọchịchị Chineke ma akụkụ eskatọlọjị nke okwu ahụ.
- source_word: ἐληλυθυῖαν
  choice: ka ọ bịarala
  rationale: 'Ihe owuwu ‘hụ ... ka ọ bịarala’ na-ada nke ọma n’Igbo ma na-echekwa perfect participle ahụ: ọbịbịa ahụ emezuola, ọnọdụ ya apụtakwala ìhè.'
- source_word: ἐν δυνάμει
  choice: n’ike
  rationale: Nke a na-esochi okwu Grik anya, na-egosipụta ike Chineke pụtara ìhè n’ebughị ụzọ kọwaa ụdị ihe omume e bu n’uche.
theological_decisions:
- issue: Ihe omume na oge okwu ‘alaeze Chineke ka ọ bịarala n’ike’ na-ezo aka na ya
  choice: A hapụrụ okwu ahụ n’ụdị sara mbara, n’akọwaghị kpọmkwem ihe omume ọ bụ.
  alternative: Ịkọwa ya dị ka nnwogha Jizọs n’ugwu, mbilite n’ọnwụ/nbuli elu, Pentikọst, ikpe Jerusalem, ma ọ bụ mmezu ikpeazụ nke alaeze ahụ.
  rationale: Grik ahụ ekwughị kpọmkwem ihe omume e bu n’uche. Nsụgharị ahụ na-echekwa nghọta dị iche iche na esemokwu nkà mmụta okpukpe kama idozi ya n’ime amaokwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A zere ntụgharị okwu Grik nke ga-ada ka Igbo a manyere amanye, ma chekwaa nkwusi ike, akụkụ ngwaa, na amaghị kpọmkwem ihe omume eskatọlọjị e zoro aka na ya.
