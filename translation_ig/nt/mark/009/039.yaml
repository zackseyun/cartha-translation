  to: Ma Jizọs sịrị, “Unu egbochila ya, n’ihi na ọ dịghị onye ga-eji aha m rụọ ọrụ dị ike[a] ma n’oge na-adịghị anya nwee ike ikwu okwu ọjọọ megide m[b].”
