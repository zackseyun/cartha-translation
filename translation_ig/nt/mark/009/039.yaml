source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Μὴ κωλύετε αὐτόν, οὐδεὶς γάρ ἐστιν ὃς ποιήσει δύναμιν ἐπὶ τῷ ὀνόματί μου καὶ δυνήσεται ταχὺ κακολογῆσαί με·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: ig
  text: Ma Jizọs sịrị, “Unu egbochila ya, n’ihi na ọ dịghị onye ga-eji aha m rụọ ọrụ dị ike[a] ma n’oge na-adịghị anya nwee ike ikwu okwu ọjọọ megide m[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọrụ ebube.” N’asụsụ Grik, okwu ahụ bụ “ike” (δύναμιν), ma ebe a ọ na-ezo aka n’ọrụ e ji ike dị ukwuu rụọ.
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ, “kparịa m” ma ọ bụ “kwutọọ m.” N’asụsụ Grik: “kwuo okwu ọjọọ megide m.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλύετε
  choice: unu egbochila ya
  rationale: Iwu dị ugbu a nke μή so ya na-egosi ka a kwụsị igbochi nwoke ahụ; ‘unu egbochila ya’ bụ Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
- source_word: δύναμιν
  choice: ọrụ dị ike
  rationale: Nke a na-echekwa echiche δύναμις dị ka ọrụ nke ike pụtara ìhè, n’agbanyeghị na ọ pụkwara izo aka n’ọrụ ebube.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: jiri aha m
  rationale: N’ọnọdụ a, nkebiokwu ahụ na-egosi ime ihe site n’ịkpọku aha Jizọs ma ọ bụ n’ike aha ya; ‘jiri aha m’ bụ okwu Igbo e ji eme ihe n’ụzọ ebumpụta ụwa.
- source_word: ταχὺ
  choice: ngwa ngwa
  rationale: 'Ọ na-egosi oge dị nso: onye ahụ agaghị enwe ike ịtụgharị ozugbo kwuo ihe ọjọọ megide Jizọs.'
- source_word: κακολογῆσαί
  choice: ikwu okwu ọjọọ megide m
  rationale: Nke a na-echekwa obosara nke ngwaa ahụ—ikwu ihe ọjọọ, ịkparị, ma ọ bụ ikwutọ—n’enweghị ime ka ọ bụrụ naanị ebubo ụgha.
- source_word: οὐδεὶς γάρ ἐστιν ὃς
  choice: n’ihi na ọ dịghị onye
  rationale: Ọ na-echekwa ihe kpatara iwu Jizọs nyere na nkwusi ike nke okwu Grik ahụ.
- source_word: δυνήσεται
  choice: ga-enwekwa ike
  rationale: Ọ na-egosipụta ọdịnihu na ikike dị na ụdị ngwaa Grik ahụ.
theological_decisions:
- issue: Ụdị ọrụ e ji aha Jizọs rụọ
  choice: ọrụ dị ike
  alternative: ọrụ ebube
  rationale: ‘Ọrụ dị ike’ na-echekwa echiche bụ isi nke δύναμις, ghara ịkọwa ya n’ụzọ dị warara karịa ihe Grik kwuru.
- issue: Ihe mmekọrịta onye ahụ na Jizọs pụtara
  choice: A kọwara naanị na onye ji aha Jizọs rụọ ọrụ dị ike agaghị enwe ike ikwu okwu ọjọọ megide ya ngwa ngwa.
  alternative: Ịkpọ onye ahụ ezigbo onye na-eso ụzọ Jizọs, ma ọ bụ onye ji aha ya achọ uru naanị ya
  rationale: Amaokwu ahụ ekpebighị ọnọdụ ime mmụọ onye ahụ n’ozuzu ya; ọ bụ naanị njikọ dị n’etiti ọrụ ahụ na enweghị ike ikwu okwu ọjọọ megide Jizọs ngwa ngwa ka ọ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Jizọs’ na ‘unu egbochila ya’ bụ ụdị okwu ndị nkịtị na-aghọta nke ọma; a hapụrụ echiche okwu Grik ka ọ ghara ịdị warara karịa isi mmalite.
