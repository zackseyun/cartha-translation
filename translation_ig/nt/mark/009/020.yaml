id: MRK.9.20
reference: Mark 9:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: ig
  text: Ha wee kpọta nwata ahụ n’ebe Jizọs nọ. Mgbe mmụọ ahụ[a] hụrụ ya, o mere ka ahụ ya maa jijiji n’ike ozugbo. Nwata ahụ wee daa n’ala, na-atụgharịgharị n’ala[b], na-asụkwa ụfụfụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmụọ na-adịghị ọcha ahụ.” Ihe ndị gbara amaokwu a gburugburu na-egosi na mmụọ ahụ adịghị ọcha, ma amaokwu a n’onwe ya kwuru naanị “mmụọ ahụ.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “na-akpụgharị n’ala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν αὐτὸν πρὸς αὐτόν
  choice: Ha wee kpọtara nwata ahụ bịakwute ya
  rationale: A sụgharịrị φέρω dị ka “kpọtara,” nke bụ okwu Igbo a na-ejikarị ekwu na a kpọgara mmadụ n’ebe onye ọzọ nọ. E kwuru “nwata ahụ” iji mee ka onye nnọchiaha mbụ doo anya n’Igbo, ma hapụ “ya” nke ikpeazụ ka ọ na-arụtụ aka n’ebe Jizọs nọ dịka ihe ndị gbara amaokwu ahụ gburugburu si gosi.
- source_word: τὸ πνεῦμα
  choice: mmụọ ahụ
  rationale: Amaokwu a kwuru naanị “mmụọ ahụ”; ya mere, etinyeghị “na-adịghị ọcha” ma ọ bụ “mmụọ ọjọọ” n’ahịrị bụ isi.
- source_word: εὐθὺς
  choice: ozugbo ahụ
  rationale: Nke a na-egosipụta ngwa ngwa nke ihe ahụ mere ma na-ada nke ọma n’Igbo nke oge a.
- source_word: συνεσπάραξεν αὐτόν
  choice: mere ka ahụ ya maa jijiji n’ike
  rationale: Nkebiokwu a na-egosi na mmụọ ahụ kpatara oké ịma jijiji ma ọ bụ ahụ ịdọkasị n’ike; nsụgharị a doro ndị na-agụ Igbo anya ma zere echiche nke ịdọka anụ ahụ.
- source_word: πεσὼν ἐπὶ τῆς γῆς
  choice: Nwata ahụ wee daa n’ala
  rationale: E mere participle ahụ ka ọ bụrụ ahịrịokwu na-esochi ihe gara aga n’ụzọ e si akọ akụkọ n’Igbo. Ikwughachi “nwata ahụ” na-egbochi mgbagwoju anya banyere ma ọ bụ nwata ahụ ka ọ bụ mmụọ ahụ dara.
- source_word: ἐκυλίετο
  choice: na-atụgharịgharị onwe ya
  rationale: Imperfect ahụ na-egosi mmegharị na-aga n’ihu; “na-atụgharịgharị onwe ya” na-ebute echiche nke ịtụgharị ugboro ugboro n’ala.
- source_word: ἀφρίζων
  choice: na-asụkwa ụfụfụ
  rationale: Nke a bụ ụzọ dị mkpirikpi ma bụrụkwa nke mmadụ na-aghọta nke ọma isi kwuo na ụfụfụ na-apụta ya, n’etinyeghị “n’ọnụ,” nke adịghị kpọmkwem n’asụsụ Grik.
theological_decisions:
- issue: Njirimara nke πνεῦμα
  choice: mmụọ ahụ
  alternative: mmụọ na-adịghị ọcha ahụ; mmụọ ọjọọ ahụ
  rationale: Ọ bụ ezie na amaokwu ndị gbara ya gburugburu na-egosi na ọ bụ mmụọ na-adịghị ọcha, amaokwu a n’onwe ya kwuru naanị τὸ πνεῦμα. A hapụrụ okwu ahụ otú ahụ iji ghara itinye nkọwa nke na-adịghị kpọmkwem n’amaokwu a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E kwughachiri “nwata ahụ” ebe ọ dị mkpa iji wepụ mgbagwoju anya nke ọtụtụ “ya” n’Igbo, ebe a ka chekwara ngwa ngwa, ike, na usoro ihe omume dị n’asụsụ Grik.
