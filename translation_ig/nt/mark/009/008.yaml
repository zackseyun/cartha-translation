  text: καὶ ἐξάπινα περιβλεψάμενοι οὐκέτι οὐδένα εἶδον ⸂ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/008.yaml
  text: And suddenly, looking around, they no longer saw anyone except Jesus alone with them.
translation:
  language: ig
  text: Na mberede, mgbe ha legharịrị anya gburugburu, ha ahụghịzi onye ọ bụla ọzọ ma e wezụga naanị Jizọs, onye ha na ya nọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: Na mberede
  rationale: Ọ na-egosi na ihe a mere na ntabi anya, n'ụzọ a na-atụghị anya ya.
- source_word: περιβλεψάμενοι
  choice: mgbe ha legharịrị anya gburugburu
  rationale: Nke a na-egosipụta ilegharị anya n'akụkụ niile, kwekọrọ n'omume nke participle ahụ.
- source_word: οὐκέτι οὐδένα εἶδον
  choice: ha ahụghịzi onye ọ bụla ọzọ
  rationale: “Ha ahụghịzi” na-eburu echiche οὐκέτι, ebe “onye ọ bụla ọzọ” na-akwadebe ọdịiche nke ἀλλά.
- source_word: ἀλλὰ τὸν Ἰησοῦν μόνον
  choice: ma e wezụga naanị Jizọs
  rationale: Ọ na-echekwa ma echiche ‘ma e wezụga’ nke ἀλλά ma nkwusi ike nke μόνον.
- source_word: μεθ’ ἑαυτῶν
  choice: onye ha na ya nọ
  rationale: Ọ na-enye echiche nke Jizọs ịnọnyere ha n'Igbo dị mfe ma doo anya.
theological_decisions:
- issue: Nkwusi ike na ọ bụ naanị Jizọs fọdụrụ ka ha hụrụ
  choice: ma e wezụga naanị Jizọs
  alternative: ma ọ bụghị Jizọs naanị ya
  rationale: Nhọrọ a na-echekwa nkwusi ike nke ederede Grik n'enweghị ịgbakwụnye nkọwa banyere ihe ọ pụtara n'okpukpe.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta; e ji usoro okwu eke zere ntụgharị siri ike nke Grik.
