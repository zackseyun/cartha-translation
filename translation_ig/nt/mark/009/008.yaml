  source_fidelity: 'Ederede Igbo na-ebufe akụkụ niile dị mkpa nke Grik: ἐξάπινα (“Na mberede”), participle περιβλεψάμενοι (“mgbe ha legharịrị anya gburugburu”), οὐκέτι οὐδένα εἶδον (“ha ahụghịzi onye ọ bụla”), ọdịiche ἀλλά ... μόνον (“ma e wezụga naanị Jizọs”), na μεθ’ ἑαυτῶν (“onye ha na ya nọ”). “Onye ọ bụla ọzọ” na-arụ ọrụ nke ọma n’ihi na Jizọs bụ onye e wepụrụ n’ọnụọgụ ahụ.'
