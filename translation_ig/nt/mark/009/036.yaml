  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro omume dị n’amaokwu Grik ahụ ma zere ịkọwapụta ihe gbasara afọ ma ọ bụ okike nwatakịrị ahụ nke isi mmalite ahụ na-ekwughị kpọmkwem.
