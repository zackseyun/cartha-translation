  text: καὶ λαβὼν παιδίον ἔστησεν αὐτὸ ἐν μέσῳ αὐτῶν καὶ ἐναγκαλισάμενος αὐτὸ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/036.yaml
  text: 'And taking a child[a], he set him in their midst, and taking him in his arms[b], he said to them:'
translation:
  language: ig
  text: 'O wee were otu nwatakịrị, mee ka ọ guzo n’etiti ha[a]; makụọ ya[b], wee sị ha:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “dobe ya n’etiti ha.” Ngwaa Grik ahụ pụtara ime ka mmadụ guzo, ma a pụkwara ikwu ya n’ụzọ dị mfe dịka idobe mmadụ n’otu ebe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “buru ya n’aka ya.” Ngwaa Grik ahụ nwere ike ịpụta ịkpọrọ mmadụ n’aka ma ọ bụ ịmakụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: kpọrọ
  rationale: N’ọnọdụ a, “kpọrọ” na-egosi na Jizọs kpọtara nwatakịrị ahụ nso ka o debe ya n’etiti ndị na-eso ụzọ ya; ọ na-asụkwa Igbo nke ọma karịa ntụgharị nkịtị dịka “were.”
- source_word: παιδίον
  choice: otu nwatakịrị
  rationale: Okwu Grik a pụtara nwatakịrị, ma ọ dịghị mkpa ịgbakwụnye na ọ bụ obere nwa ebe amaokwu a ekwughị afọ ya kpọmkwem.
- source_word: ἔστησεν
  choice: mee ka o guzo
  rationale: Nke a na-edobe nghọta causative nke ngwaa Grik ahụ, ya bụ, o mere ka nwatakịrị ahụ guzo, kama ịsị naanị na o debere ya ebe ahụ.
- source_word: ἐν μέσῳ αὐτῶν
  choice: n’etiti ha
  rationale: Nke a na-egosi ọnọdụ nwatakịrị ahụ n’etiti ìgwè ahụ n'ụzọ doro anya ma bụrụkwa Igbo a na-asụkarị.
- source_word: ἐναγκαλισάμενος
  choice: ọ makụrụ ya
  rationale: “Makụrụ” na-egosi ịnabata mmadụ n’aka ma ọ bụ ịmakụ ya, na-edobekwa obosara nghọta ngwaa Grik ahụ.
- source_word: εἶπεν αὐτοῖς
  choice: wee sị ha
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’usoro akụkọ iji sụgharịa “ọ sịrị ha.”
