review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the conditional warning, the stumbling metaphor, the forceful command to cut off the foot, the contrast between entering life lame and being thrown into Gehenna with both feet, and it does not expand ζωή to “eternal life.” The wording “ma bụrụ onye a tụbara” is less direct than the Greek passive infinitive and can be clarified.
  naturalness: Most of the draft is idiomatic Standard Igbo. “Ọ bụrụkwa na ụkwụ gị emee ka ị sụọ ngọngọ” is a more natural generic conditional than the progressive “na-eme ka,” and recasting the final clause makes the passive action and the retained two feet clearer.
  terminology: “Gehena” appropriately preserves γέεννα. The footnote’s “ọkụ ala mmụọ” adds “fire,” which is not present in the English alternative “hell” or in γέεννα itself; “ala mmụọ” is a closer familiar alternative, while the explanatory sentence can retain the historical association with the Valley of Hinnom and divine judgment.
  issues:
  - severity: medium
    issue: The alternative rendering in the footnote adds “ọkụ” (“fire”).
    rationale: Neither γέεννα nor the audit trail’s alternative “hell” explicitly contains “fire.” Adding it narrows and heightens the image beyond this verse’s wording.
  - severity: low
    issue: The final comparison is phrased as “inwe ụkwụ abụọ ma bụrụ onye a tụbara.”
    rationale: Although understandable, this nominal passive construction is less natural and can momentarily obscure that God’s judgment action is “to be thrown into Gehenna” while retaining both feet.
  revised_text: Ọ bụrụkwa na ụkwụ gị emee ka ị sụọ ngọngọ, bepụ ya. Ọ kaara gị mma ịbanye ná ndụ dịka onye ngwọrọ karịa ka a tụba gị na Gehena mgbe ị ka nwere ụkwụ abụọ.[a]
  revised_footnotes:
