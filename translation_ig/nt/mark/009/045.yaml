source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: ig
  text: Ọ bụrụkwa na ụkwụ gị emee ka ị sụọ ngọngọ, bepụ ya. Ọ kaara gị mma ịbanye ná ndụ dịka onye ngwọrọ karịa ka a tụba gị na Gehena mgbe ị ka nwere ụkwụ abụọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ala mmụọ.” Okwu Grik bụ “Gehena,” nke na-akpalite echiche banyere Ndagwurugwu Hinọm na njikọ ya na ikpe Chineke.'
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: na-eme ka ị sụọ ngọngọ
  rationale: Nke a na-edobe ihe atụ nke ịsụ ngọngọ dị na Grik, ma n'ọnọdụ a ọ na-egosikwa iduba mmadụ na mmehie ma ọ bụ ọdịda.
- source_word: ἀπόκοψον
  choice: bipụ ya
  rationale: Okwu iwu a siri ike ma doo anya; “bipụ ya” na-edobe ịdị ndụ na ike nke ihe atụ ahụ.
- source_word: καλόν ἐστίν ... ἢ
  choice: Ọ kaara gị mma ... karịa
  rationale: N'ime usoro ntụnyere a, καλόν pụtara ihe ka mma, ọ bụghị naanị ihe ọma.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: ịbanye ná ndụ
  rationale: A hapụrụ “ndụ” dịka isi mmalite si kwuo ya, n'etinyeghị “ebighị ebi,” ma debe ihe atụ nke ịbanye.
- source_word: χωλὸν
  choice: dịka onye ngwọrọ
  rationale: Okwu a na-ekwu kpọmkwem banyere onye ụkwụ ya nwere nkwarụ nke na-eme ka ije sie ya ike.
- source_word: βληθῆναι
  choice: bụrụ onye a tụbara
  rationale: Nke a na-egosipụta passive infinitive nke βάλλω n'ụzọ doro anya ma dị mma n'Igbo.
- source_word: γέενναν
  choice: Gehena
  rationale: A na-edobe aha Grik pụrụ iche nke sitere na Ndagwurugwu Hinọm, kama iji okwu sara mbara nke nwere ike ikpuchi ihe oyiyi akụkọ ihe mere eme ya.
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: inwe ụkwụ abụọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ na nkebi Grik ahụ, na-edobekwa ntụnyere ya na ịbụ onye ngwọrọ.
theological_decisions:
- issue: Nsụgharị γέεννα n'ọnọdụ ikpe Chineke
  choice: Gehena
  alternative: ọkụ ala mmụọ
  rationale: γέεννα bụ aha pụrụ iche nwere njikọ na Ndagwurugwu Hinọm na ihe oyiyi ikpe Chineke. Ide “Gehena” n'isiokwu bụ isi na-edobe nkọwa na mgbagwoju anya nke isi mmalite; ihe a na-akpọkarị ya n'ọdịnala dị na nkọwa ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E debere ihe atụ siri ike nke ịsụ ngọngọ na ibipụ ụkwụ, ma zere ịgbasa “ndụ” ka ọ bụrụ “ndụ ebighị ebi” n'ihi na okwu ahụ adịghị kpọmkwem n'amaokwu Grik.
