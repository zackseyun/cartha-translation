    text: 'Ma ọ bụ: “ala mmụọ.” Okwu Grik bụ “Gehena,” nke na-akpalite echiche banyere Ndagwurugwu Hinọm na njikọ ya na ikpe Chineke.'
    reason: alternative_reading
  revision_rationale: The revision preserves the Greek metaphor and forceful imperative, improves the conditional and passive-comparative phrasing in modern Standard Igbo, and removes the unsupported addition of “fire” from the alternative footnote rendering. “Gehena” remains in the main text to preserve the source term and its historical specificity.
