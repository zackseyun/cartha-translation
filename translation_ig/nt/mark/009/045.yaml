  to: Ọ bụrụkwa na ụkwụ gị emee ka ị sụọ ngọngọ, bepụ ya. Ọ kaara gị mma ịbanye ná ndụ dịka onye ngwọrọ karịa ka a tụba gị na Gehena mgbe ị ka nwere ụkwụ abụọ.[a]
  rationale: The revision preserves the Greek metaphor and forceful imperative, improves the conditional and passive-comparative phrasing in modern Standard Igbo, and removes the unsupported addition of “fire” from the alternative footnote rendering. “Gehena” remains in the main text to preserve the source term and its historical specificity.
