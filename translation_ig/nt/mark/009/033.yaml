review_pass:
  verdict: revise
  source_fidelity: The main text accurately renders the plural arrival at Capernaum, then identifies Jesus as the singular subject in the house. “na-ekwurịta” appropriately preserves the open sense of διελογίζεσθε without prematurely requiring an argumentative tone. The imperfect in ἐπηρώτα is reasonably represented by “ọ nọ na-ajụ.”
  naturalness: The main text is clear, modern Standard Igbo, and maintains an appropriate biblical narrative register. The footnote’s alternative wording, however, contains the unnecessary pronoun “ya,” which makes the proposed question less natural and can suggest an antecedent not present in Greek.
  terminology: “Kapanọm,” “ụlọ ahụ,” and the terms for discussion/debate are suitable. The alternative should express “arguing/disputing” without adding an object (“it/about it”) absent from the source.
  issues:
  - severity: low
    issue: The alternative translation in footnote a adds “ya” (“it”).
    rationale: The Greek asks simply what they were discussing/debating on the way; it supplies no pronoun or other object corresponding to “ya.” In Igbo, “Gịnị ka unu nọ na-arụrịta ụka banyere ya?” is also less idiomatic because “gịnị” already asks for the matter under dispute.
  revised_text: Ha wee bịarute Kapanọm. Mgbe Jizọs nọ n’ụlọ ahụ, ọ nọ na-ajụ ha, sị, “Gịnị ka unu nọ na-ekwurịta n’ụzọ?”[a]
