  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ⸀ἦλθον εἰς Καφαρναούμ. καὶ ἐν τῇ οἰκίᾳ γενόμενος ἐπηρώτα αὐτούς· Τί ἐν τῇ ⸀ὁδῷ διελογίζεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: ig
  text: Ha wee bịarute Kapanọm. Mgbe Jizọs nọ n’ụlọ ahụ, ọ nọ na-ajụ ha, sị, “Gịnị ka unu nọ na-ekwurịta n’ụzọ?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Gịnị ka unu na-arụrịta ụka banyere n’ụzọ?” Okwu Grik a nwere ike ịpụta ikwurịta, ịtụle, ma ọ bụ ịrụrịta ụka; amaokwu na-esonụ na-egosi na isiokwu ha bụ onye n’ime ha kachasị ukwuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: ha wee bịarute
  rationale: Ụdị a na-akọ mbịarute ha na Kapanọm n’ụzọ doro anya ma kwekọọ n’usoro akụkọ Igbo.
- source_word: Καφαρναούμ
  choice: Kapanọm
  rationale: E ji ụdị aha obodo a a na-ahụkarị na nsụgharị Baịbụl Igbo, nke na-agbaso ụda aha Grik.
- source_word: ἐν τῇ οἰκίᾳ
  choice: n’ụlọ ahụ
  rationale: Nke a na-echekwa kpọmkwem ebe ihe ahụ mere na njirimara nke article Grik, na-akọwaghị ya dị ka ụlọ nke onye ọ bụla.
- source_word: γενόμενος
  choice: Mgbe Jizọs nọ
  rationale: Participle ahụ na-egosi oge. Ịkpọ Jizọs aha na-eme ka mgbanwe site n’isiokwu ọtụtụ gaa n’isiokwu otu doo anya n’Igbo.
- source_word: ἐπηρώτα
  choice: ọ nọ na-ajụ
  rationale: Ụdị a na-echekwa akụkụ imperfect nke na-egosi omume na-aga n’ihu ma ọ bụ a na-eme ugboro ugboro n’oge ahụ.
- source_word: Τί
  choice: Gịnị
  rationale: Nke a bụ ajụjụ Igbo nkịtị ma kpọmkwem maka ihe ha na-ekwu.
- source_word: ἐν τῇ ὁδῷ
  choice: n’ụzọ
  rationale: Ọ bụ okwu Igbo dị nkenke ma bụrụkwa nke ebumpụta ụwa maka ihe mere mgbe a nọ na-eme njem.
- source_word: διελογίζεσθε
  choice: unu nọ na-ekwurịta
  rationale: Nke a na-echekwa obosara ihe okwu Grik ahụ pụtara—mkparịta ụka, arụmụka, ma ọ bụ ịtụle ihe—n’etinyeghị echiche esemokwu n’amaokwu a tupu oge ya.
theological_decisions:
- issue: Mgbanwe isiokwu site na ἦλθον nke ọtụtụ gaa na γενόμενος/ἐπηρώτα nke otu
  choice: A sụgharịrị mbịarute ahụ dị ka “ha wee bịarute,” ma kpọọ Jizọs aha n’omume sochirinụ.
  alternative: “Ha wee bịarute Kapanọm. Mgbe ọ nọ n’ụlọ ahụ, ọ nọ na-ajụ ha...”
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na Jizọs bụ onye isiokwu otu ahụ na-ezo aka na ya. Ịkpọ aha ya na-ewepụ mgbagwoju anya n’enweghị itinye ozizi ọzọ.
- issue: Ma διελογίζεσθε ọ pụtara mkparịta ụka nkịtị ka ọ bụ arụmụka
  choice: “na-ekwurịta” n’ederede isi
  alternative: “na-arụrịta ụka”
  rationale: Okwu Grik ahụ nwere ike ịpụta mkparịta ụka, ntụle, ma ọ bụ arụmụka. Amaokwu na-esonụ na-egosi na okwu ha nwere ihe metụtara onye kachasị ukwuu, ma amaokwu a n’onwe ya akọwaghị ụda esemokwu ahụ kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Wee bịarute” na-ejikọta akụkọ ahụ n’ụzọ ebumpụta ụwa; “ọ nọ na-ajụ” na-echekwa imperfect Grik. Akara nkọwa [a] dị n’ederede isi dịka iwu si dị.
