  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: ig
  text: Ma onye ọ bụla nke na-eme ka otu n’ime ndị nta ndị a, ndị kwere na m, sụọ ngọngọ, ọ ga-akara ya mma karịa ma a kegide nnukwu nkume igwe nri[a] n’olu ya, tụba ya n’oké osimiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, nnukwu nkume igwe nri nke ịnyịnya ibu na-atụgharị.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: mee ka ... sụọ ngọngọ
  rationale: Nke a na-echekwa ihe atụ Grik nke ime ka mmadụ sụọ ngọngọ, ma ọ nwekwara ike ịgụnye iduba ya ná mmehie ma ọ bụ ime ka ọ dapụ n’okwukwe; ọ naghị eme ka ihe okwu ahụ pụtara dị warara.
- source_word: μικρῶν τούτων
  choice: ndị nta ndị a
  rationale: Ọ naghị ekpebi na ọ bụ naanị ụmụaka; ọ nwere ike ịgụnye ndị a na-ele anya dị ka ndị nta, ndị na-adịghị ike, ma ọ bụ ndị na-enweghị nnukwu ọnọdụ.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: kwere na m
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwụ ọtọ isi gosipụta ndị okwu a na-ekwu banyere ha dị ka ndị kwere na Jizọs.
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: ọ ga-akara ya mma
  rationale: Nke a na-ebupụta ntụnyere na ịdọ aka ná ntị siri ike n’ụzọ Igbo nkịtị.
- source_word: μύλος ὀνικός
  choice: nnukwu nkume igwe nri
  rationale: Ọ bụ nnukwu nkume igwe nri nke ịnyịnya ibu na-atụgharị, n’adịghị ka obere nkume igwe nri e ji aka atụgharị; nkọwa ala peeji na-edobe nkọwa ahụ kpọmkwem.
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: e kere ... n’olu ya
  rationale: Okwu a na-egosi na e tinyere ma ọ bụ kee ihe ahụ gburugburu olu ya; ‘e kere’ bụ okwu Igbo doro anya n’ọnọdụ a.
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: tụba ya n’oké osimiri
  rationale: Nke a na-enye ihe omume ahụ na nsonaazụ ya n’ụzọ doro anya ma dị ndụ n’Igbo.
theological_decisions:
- issue: Ndị okwu ‘ndị nta ndị a’ na-ezo aka na ha
  choice: E debere ya n’obosara ka ọ gụnye ndị kwere ekwe a na-ele anya dị ka ndị nta ma ọ bụ ndị na-adịghị ike, n’achịghị ụmụaka apụ.
  alternative: Ịsụgharị ya kpọmkwem dị ka ‘ụmụaka ndị a’ ma ọ bụ ‘ndị na-eso ụzọ dị umeala n’obi.’
  rationale: Nkebi ‘kwere na m’ na-egosi na ihe a karịrị naanị afọ mmadụ; nsụgharị ahụ anaghị amanye otu nkọwa dị warara.
- issue: Oke ihe σκανδαλίζω pụtara
  choice: E ji ihe atụ ‘mee ka ... sụọ ngọngọ.’
  alternative: ‘Mee ka ... mehie’ ma ọ bụ ‘mee ka ... dapụ n’okwukwe.’
  rationale: Ihe atụ ahụ na-edobe ohere nke mmehie, ịda, ma ọ bụ ịdapụ n’okwukwe n’ebughị ụzọ họrọ naanị otu n’ime ha.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ndị nta ndị a’ zere ime ka ndị a na-ekwu banyere ha bụrụ naanị ụmụaka, e jikwa ‘sụọ ngọngọ’ chekwaa ihe atụ na obosara okwu Grik.
