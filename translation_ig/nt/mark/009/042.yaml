revisions:
- from: Ma onye ọ bụla nke ga-eme ka otu n’ime ndị nta ndị a kwere na m sụọ ngọngọ, ọ ga-akara ya mma ma a sị na e kere nnukwu nkume igwe nri[a] n’olu ya tụba ya n’oké osimiri.
  to: Ma onye ọ bụla nke na-eme ka otu n’ime ndị nta ndị a, ndị kwere na m, sụọ ngọngọ, ọ ga-akara ya mma karịa ma a kegide nnukwu nkume igwe nri[a] n’olu ya, tụba ya n’oké osimiri.
  rationale: The revision retains the draft’s broad and source-sensitive renderings of ‘little ones’ and ‘cause to stumble,’ while replacing an unnatural fastening verb and repairing the coordination of the passive actions. The footnote continues to specify that the millstone is the large kind turned by a donkey.
