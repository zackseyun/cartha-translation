- from: Ọ zara ha, sị, “Ọgbọ na-ekweghị ekwe[a], ruo ole mgbe ka m ga-anọnyere unu? Ruo ole mgbe ka m ga-anagide unu[b]? Kpọtaranụ ya bịakwute m.”
  to: Ọ zara ha, sị, “Ọgbọ na-ekweghị ekwe[a], ruo ole mgbe ka m ga-anọnyere unu? Ruo ole mgbe ka m ga-anagide unu[b]? Kpọtaranụ ya n’ebe m nọ.”
  rationale: 'The revision is limited to the final imperative, making it grammatical and natural in Standard Igbo while maintaining the Greek command to bring the boy to Jesus. Footnote a is refined so that its alternatives represent the semantic range of ἄπιστος more precisely. The existing anchors remain correctly attached: [a] to “Ọgbọ na-ekweghị ekwe” and [b] to “ka m ga-anagide unu.”'
