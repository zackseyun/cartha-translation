base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: ig
  text: Ọ zara ha, sị, “Ọgbọ na-ekweghị ekwe[a], ruo ole mgbe ka m ga-anọnyere unu? Ruo ole mgbe ka m ga-anagide unu[b]? Kpọtaranụ ya n’ebe m nọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọgbọ na-enweghị okwukwe” ma ọ bụ “ọgbọ na-adịghị ntụkwasị obi.” Okwu Grik ahụ nwere ike ịpụta enweghị nkwenye ma ọ bụ enweghị ikwesị ntụkwasị obi.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ruo ole mgbe ka m ga-eji tachie unu obi?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: Ọ zara ha, sị
  rationale: Nke a bụ ụzọ Igbo nkịtị si webata nzaghachi mmadụ n’akụkọ. Ọ na-ejigide echiche nke participle ἀποκριθείς na okwu akụkọ λέγει n’enweghị ntụgharị siri ike nke na-agaghị ada ka Igbo.
- source_word: γενεὰ ἄπιστος
  choice: Ọgbọ na-ekweghị ekwe
  rationale: ἄπιστος n’ebe a na-akatọ enweghị okwukwe ma ọ bụ ntụkwasị obi. ‘Na-ekweghị ekwe’ na-egosipụta isi echiche ahụ nke ọma n’Igbo, ebe e debere echiche ọzọ nke enweghị ikwesị ntụkwasị obi n’ala peeji.
- source_word: ἕως πότε
  choice: ruo ole mgbe
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị ajụ ogologo oge.
- source_word: πρὸς ὑμᾶς ἔσομαι
  choice: ka m ga-anọnyere unu
  rationale: ‘Ịnọnyere unu’ na-egosipụta ọnụnọ Jizọs n’etiti ha na mmekọrịta ya na ha, nke πρός na-egosi n’ebe a.
- source_word: ἀνέξομαι ὑμῶν
  choice: ka m ga-anagide unu
  rationale: ‘Ịnagide’ na-ebute echiche nke iburu ma ọ bụ ịtachi obi n’ebe mmadụ nọ, ma na-ejigide iwe na mwute dị n’ajụjụ Jizọs.
- source_word: φέρετε αὐτὸν πρός με
  choice: Kpọtaranụ ya bịakwute m
  rationale: Iwu ahụ na-arịọ ka a kpọta nwata ahụ n’ebe Jizọs nọ. Ụdị ọtụtụ mmadụ nke ‘kpọtaranụ’ kwekọrọ n’iwu Greek ahụ.
theological_decisions:
- issue: Ihe ἄπιστος pụtara n’okwu Jizọs
  choice: na-ekweghị ekwe
  alternative: na-enweghị okwukwe; na-adịghị eguzosi ike n’okwukwe
  rationale: Ihe gbara amaokwu ahụ gburugburu na-elekwasị anya n’enweghị nkwenye na ntụkwasị obi, ma okwu Greek ahụ nwekwara ike ịpụta enweghị okwukwe ma ọ bụ enweghị ikwesị ntụkwasị obi. Ya mere, a họọrọ ntụgharị kachasị doo anya n’ahịrịokwu ahụ ma debe obosara ihe ọ pụtara n’ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, mee ntụgharị ahụ. ‘Ọ zara ha, sị’ bụ usoro akụkọ sitere n’ọnụ Igbo nke na-ezere asụsụ a tụgharịrị n’ụzọ osisi. Ajụjụ abụọ ahụ na iwu ikpeazụ ka edobere n’usoro siri ike iji chekwaa ụda iwe na mwute nke okwu Jizọs.
