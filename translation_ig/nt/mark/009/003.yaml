  text: καὶ τὰ ἱμάτια αὐτοῦ ⸀ἐγένετο στίλβοντα λευκὰ ⸀λίαν οἷα γναφεὺς ἐπὶ τῆς γῆς οὐ δύναται ⸀οὕτως λευκᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: ig
  text: Uwe ya wee na-egbu maramara, na-acha ọcha nke ukwuu karịa ka onye na-asa ákwà ọ bụla n’ụwa pụrụ ime ka ha cha ọcha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱμάτια
  choice: uwe
  rationale: “Uwe” bụ okwu Igbo nkịtị ma sara mbara maka ihe mmadụ na-eyi; ọ naghị eme ka okwu ahụ bụrụ uwe mwụda ma ọ bụ ụdị uwe pụrụ iche.
- source_word: ἐγένετο
  choice: wee na-
  rationale: Usoro “wee na-” na-egosi mgbanwe ọnọdụ n’ime akụkọ ahụ n’ụzọ Igbo na-aga were were.
- source_word: στίλβοντα
  choice: na-egbu maramara
  rationale: Nkebi a na-enye echiche nke ìhè na-egbuke egbuke ma ọ bụ na-amụgharị amụgharị, n’etinyeghị nkọwa okpukpe nke okwu Grik ahụ ekwughị.
- source_word: λευκὰ λίαν
  choice: na-achakwa ọcha nke ukwuu
  rationale: “Ọcha” na-edebe isi agba λευκά, ebe “nke ukwuu” na-ebute ike nkwusi okwu dị na λίαν.
- source_word: γναφεύς
  choice: onye na-asa ákwà
  rationale: Nke a bụ ụzọ ndị Igbo nke oge a ga-aghọta onye ọrụ ya bụ ihicha na ime ka ákwà cha ọcha; ọ ka doo anya karịa iji okwu teknụzụ ochie.
- source_word: ἐπὶ τῆς γῆς
  choice: n’ụwa
  rationale: Ọ na-edebe oke ntụnyere ahụ n’ebe ikike mmadụ nọ n’ụwa.
- source_word: οὐ δύναται οὕτως λευκᾶναι
  choice: na-apụghị ime ka ọ cha otú ahụ
  rationale: Nkebi a na-edebe enweghị ike ahụ, ọrụ ime ka uwe cha ọcha, na ogo ntụnyere οὕτως. Nnọchiaha “ọ” na-ezo aka n’uwe n’ụzọ Igbo kwesịrị ekwesị.
theological_decisions:
- issue: Nsonaazụ a na-ahụ anya nke mgbanwe ahụ
  choice: Kọwaa naanị na uwe Jizọs na-egbu maramara ma na-acha ọcha n’ụzọ karịrị ikike mmadụ.
  alternative: Ịsụgharị ya dịka “na-enwu site n’ebube” ma ọ bụ itinye nkọwa banyere ebube Chineke.
  rationale: Amaokwu ahụ na-akọ ihe anya hụrụ n’uwe ya; ọ naghị enye nkọwa ozizi kpọmkwem banyere ihe kpatara ìhè ahụ. Nsụgharị ahụ kwesịrị ịhapụ nkọwa ime mmụọ ahụ ka ọ pụta site n’okirikiri akụkọ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. “Na-egbu maramara” na-enye ihe onyonyo doro anya; akara ogologo ahụ na-eme ka ntụnyere ikpeazụ guzo nke ọma n’enweghị ahịrịokwu siri ike ma ọ bụ nke na-ada ka ntụgharị okwu n’otu n’otu.
