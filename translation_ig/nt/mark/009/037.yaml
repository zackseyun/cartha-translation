source:
  edition: SBLGNT
  text: Ὃς ⸀ἂν ἓν τῶν τοιούτων παιδίων δέξηται ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται· καὶ ὃς ⸁ἂν ἐμὲ ⸀δέχηται, οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: ig
  text: Onye ọ bụla nabatara otu n’ime ụmụaka dị otu a n’aha m, na-anabata m; onye ọ bụla na-anabata m, ọ bụghị m ka ọ na-anabata, kama ọ bụ Onye ahụ zitere m.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃς ἂν
  choice: Onye ọ bụla
  rationale: Nkebi a na-egosi onye ọ bụla nke ga-eme ihe ahụ; ‘Onye ọ bụla’ bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-asụkarị.
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: otu n’ime ụmụaka dị otu a
  rationale: Nke a na-echekwa usoro nkewa nke ‘otu n’ime’ na kwa echiche τοιούτων nke pụtara ụmụaka ‘dị otu a’ ma ọ bụ ‘ụdị a,’ kama ime ka ọ bụrụ naanị ụmụaka ndị a nọ nso.
- source_word: δέξηται / δέχεται / δέχηται
  choice: nabatara
  rationale: ‘Nabata’ nwere ike ịpụta ịkpọbata ma ọ bụ iji obi ọma anara mmadụ. Ikwughachi otu ngwaa ahụ na-echekwa njikọ okwu dị n’ahịrịokwu Grik.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: n’aha m
  rationale: Nke a bụ ntụgharị dị nkenke ma kwekọọ n’Igbo, na-egosi ime ihe n’ihi njikọ mmadụ na Jizọs, aha ya, ma ọ bụ ikike ya.
- source_word: οὐκ ἐμὲ δέχεται ἀλλὰ
  choice: ọ bụghị m ka ọ nabatara, kama ọ bụ
  rationale: Usoro a na-echekwa esemokwu okwu Grik nke ‘ọ bụghị m ... kama,’ n’ebughị ụzọ kọwaa ya dị ka ‘ọ bụghị naanị m.’
- source_word: τὸν ἀποστείλαντά με
  choice: Onye ahụ zitere m
  rationale: Aha-nkọwa Grik a na-atụgharị n’ụzọ Igbo dị mfe ma na-echekwa echiche nke onye nyere Jizọs ozi wee zite ya.
theological_decisions:
- issue: 'Ike esemokwu ikpeazụ ahụ: ‘ọ bụghị m ... kama Onye ahụ zitere m’'
  choice: 'E chekwara esemokwu ahụ kpọmkwem: ‘ọ bụghị m ka ọ nabatara, kama ọ bụ Onye ahụ zitere m.’'
  alternative: ‘ọ bụghị naanị m ka ọ nabatara, kama ọ nabatakwara Onye ahụ zitere m’
  rationale: Grik ekwughị ‘ọ bụghị naanị’ ma ọ bụ ‘kwa.’ Ya mere, e chekwara nghọta siri ike na esemokwu nkà mmụta okpukpe dị n’okwu ahụ, n’agbanyeghị na ihe gbara ya gburugburu na-egosi na ịnabata Jizọs na-erute Onye zitere ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Nabata’ ka e kwughachiri iji chekwaa usoro na njikọ okwu dị na Grik. E ji ‘ụmụaka dị otu a’ zere ime τοιούτων ka ọ bụrụ okwu na-atụ aka kpọmkwem naanị n’ụmụaka nọ ebe ahụ.
