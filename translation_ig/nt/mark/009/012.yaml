    text: Ma ọ bụ, “na a ga-ewere ya dịka onye na-abaghị uru.” Ngwaa Grik ahụ na-ekwu maka ile mmadụ anya ma ọ bụ imeso ya dịka onye na-enweghị uru.
    reason: lexical_alternative
  revision_rationale: The revision keeps the Greek rhetorical question and its unresolved juxtaposition of Elijah’s restoration with the Son of Man’s suffering. It uses a neutral connective, makes the two ἵνα-subjunctive events parallel in natural Igbo, and uses the idiomatic passive expression “a ga-eleda ya anya,” while preserving the fuller ‘treated as worthless’ sense in the footnote.
