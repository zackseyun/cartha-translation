id: MRK.9.12
reference: Mark 9:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: ig
  text: Ọ sịrị ha, “N’ezie, Ịlaịja na-ebu ụzọ bịa, na-eweghachi ihe niile n’ọnọdụ ha. Oleekwa otú e si dee banyere Nwa nke Mmadụ na ọ ga-ata ọtụtụ ahụhụ, nakwa na a ga-eleda ya anya?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na a ga-ewere ya dịka onye na-abaghị uru.” Ngwaa Grik ahụ na-ekwu maka ile mmadụ anya ma ọ bụ imeso ya dịka onye na-enweghị uru.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: Ọ sịrị ha
  rationale: Nke a bụ ụzọ Igbo nkịtị, doro anya, si ewebata okwu onye kwuru, ma ọ na-edobe ma ngwaa ahụ ma ndị a gwara okwu.
- source_word: Ἠλίας
  choice: Ịlaịja
  rationale: E ji ọdịdị aha a na-ahụkarị na Baịbụl Igbo dee aha onye ahụ.
- source_word: ἐλθὼν πρῶτον
  choice: na-ebu ụzọ bịa
  rationale: Nke a na-egosi na ọbịbịa Ịlaịja na-ebute ọrụ iweghachi ihe niile ụzọ, ma na-ada nke ọma n'Igbo karịa nsụgharị ga-ejidesi ọdịdị participle Grik ike.
- source_word: ἀποκαθιστάνει πάντα
  choice: na-eweghachikwa ihe niile n’ọnọdụ ha
  rationale: ‘Iweghachi ... n’ọnọdụ ha’ na-enye echiche nke idozi ma ọ bụ iweghachi ihe n’ọnọdụ kwesịrị ekwesị; ‘ihe niile’ na-edobe obosara πάντα.
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: olee otú e si dee banyere Nwa nke Mmadụ
  rationale: A hapụrụ ya dịka ajụjụ, a sụgharịkwara γέγραπται dịka usoro okwu Akwụkwọ Nsọ bụ ‘e si dee’; ‘banyere’ na-egosipụta ntụaka ἐπί.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: A na-edobe aha-ọrụ dị mkpa a n’enweghị ịkọwa ya dịka ‘Mesaya’ ma ọ bụ itinye nkọwa ọzọ.
- source_word: πολλὰ πάθῃ
  choice: ọ ga-ata ọtụtụ ahụhụ
  rationale: Nke a bụ Igbo kwụ ọtọ ma dị mfe nghọta nke na-edobe echiche nke ọtụtụ ahụhụ.
- source_word: ἐξουδενηθῇ
  choice: ka e werekwa ya dị ka onye na-abaghị uru
  rationale: Nke a na-egosipụta olu nnara nke ngwaa ahụ na echiche nke ile mmadụ anya dịka onye na-enweghị uru ma ọ bụ onye na-enweghị ihe ọ bụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ọrụ Ịlaịja nke iweghachi ihe niile na ahụhụ Nwa nke Mmadụ
  choice: 'A hapụrụ nkebi nke abụọ dịka ezigbo ajụjụ: “Ma olee otú e si dee...?”'
  alternative: Ịgbakwunye okwu nkọwa dịka “Ma ọ bụrụ otu a...” ma ọ bụ ịgbanwe ajụjụ ahụ ka ọ bụrụ nkọwa ozizi.
  rationale: Grik ahụ na-etinye ọrụ iweghachi ihe na ahụhụ Nwa nke Mmadụ n’akụkụ ibe ha n’ajụjụ na-enweghị idozi esemokwu echiche ahụ kpọmkwem.
- issue: Onye aha ‘Nwa nke Mmadụ’ na-ezo aka na ya
  choice: Nwa nke Mmadụ
  alternative: Mesaya; Onye ahụ bụ mmadụ
  rationale: A na-edobe aha ahụ dịka o siri dị n’isi mmalite, n’ihi na ịgbanwe ya ka ọ bụrụ aha nkọwa ọzọ ga-etinye nkọwa karịrị okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A họọrọ ahịrịokwu na-asọ nke ọma n’Igbo ma debe ajụjụ na esemokwu echiche dị n’isi mmalite. E tinyere akara poznụkwụ [a] kpọmkwem n’ebe okwu ἐξουδενηθῇ dị.
