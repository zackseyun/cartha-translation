source:
  edition: SBLGNT
  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: ig
  text: 'Igwe ojii wee bịa kpuchie ha, olu wee si n’igwe ojii ahụ pụta: “Onye a bụ Nwa m m hụrụ n’anya; geenụ ya ntị[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nụrụnụ ya.” Iwu a pụtara ịnụ ya ma jiri nlezianya ṅaa ntị n’ihe ọ na-ekwu, ọ bụghị naanị ịnụ ụda olu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: wee bịa / wee ... pụta
  rationale: N’ebe igwe ojii dị, “wee bịa” na-egosi na ọ bịara na mberede; n’ebe olu dị, “wee si ... pụta” na-enye n’Igbo n'ụzọ eke echiche nke ihe malitere ma si n’igwe ojii ahụ bịa, n’etinyeghị nkọwa ọzọ.
- source_word: νεφέλη
  choice: igwe ojii
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa cloud; a hapụrụ ihe ọ pụrụ ịpụta banyere ọnụnọ Chineke ka ọnọdụ amaokwu ahụ gosipụta ya.
- source_word: ἐπισκιάζουσα
  choice: kpuchie ha
  rationale: “Kpuchie ha” bụ okwu Igbo doro anya, nke na-egosi na igwe ojii ahụ bịakwasịrị ha ma kpuchie ha, n’agbanyeghị na ọ naghị edochi ihe oyiyi nke onyinyo n’ụzọ siri ike.
- source_word: φωνή
  choice: olu
  rationale: Ọ bụ olu nwere okwu a pụrụ ịghọta, ọ bụghị naanị ụda.
- source_word: ἐκ τῆς νεφέλης
  choice: si n’igwe ojii ahụ pụta
  rationale: Nke a na-echekwa echiche nke ἐκ, ya bụ na olu ahụ sitere n’ime igwe ojii ahụ pụta.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Ọkpara m m hụrụ n’anya
  rationale: “Ọkpara m” na-egosi mmekọrịta Nna na Ọkpara, ebe “m hụrụ n’anya” bụ Igbo dị ugbu a ma dị mfe nghọta maka ἀγαπητός.
- source_word: ἀκούετε αὐτοῦ
  choice: geenụ ya ntị
  rationale: Iwu a bụ maka ọtụtụ mmadụ. “Geenụ ya ntị” gụnyere ịnụ ihe ọ na-ekwu na ilebara ya anya, n’emeghị ka okwu ahụ bụrụ naanị “rubeerenụ ya isi.”
theological_decisions:
- issue: Nkwupụta Chineke banyere onye Jizọs bụ
  choice: “Onye a bụ Ọkpara m m hụrụ n’anya”
  alternative: “Onye a bụ Nwa m m hụrụ n’anya”
  rationale: A tụgharịrị nkwupụta ahụ ozugbo dịka okwu sitere n’eluigwe. “Ọkpara” na-echekwa aha mmekọrịta ahụ n’ụzọ e ji ya eme ihe n’Igbo Ndị Kraịst, n’etinyeghị nkọwa ozizi ọzọ.
- issue: Ike iwu dị na ἀκούετε αὐτοῦ
  choice: “geenụ ya ntị”
  alternative: “nụrụnụ ya” ma ọ bụ “rubeerenụ ya isi”
  rationale: Okwu ahụ chọrọ ka ha nụrụ ma ṅaa ntị n’ihe ọ na-ekwu. A họrọghị “rubeerenụ ya isi” n’ihi na nke ahụ nwere ike ime ka ihe okwu Grik ahụ pụtara dị warara karịa ka ọ dị.
translation_notes:
  register: E ji asụsụ Igbo Izugbe dị ugwu ma dị mfe nghọta mee ya. Usoro “wee” na-eme ka akụkọ ahụ na-aga n’ihu n’ụzọ eke. E debere akara ntụaka [a] ozugbo n’akụkụ okwu ọ na-akọwa.
