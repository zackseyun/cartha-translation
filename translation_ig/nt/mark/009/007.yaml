  to: 'Igwe ojii wee bịa kpuchie ha, olu wee si n’igwe ojii ahụ pụta: “Onye a bụ Nwa m m hụrụ n’anya; geenụ ya ntị[a].”'
  rationale: The revision replaces ‘Ọkpara m’ with ‘Nwa m’ to avoid importing a firstborn meaning absent from Mark 9:7. All other wording is retained because it is faithful to the Greek and natural in Standard Igbo. The footnote anchor is repositioned for consistent punctuation.
