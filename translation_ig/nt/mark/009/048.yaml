  yaml_path: translation/nt/mark/009/048.yaml
  text: where their worm does not die[b][a], and the fire is not quenched.
translation:
  language: ig
  text: ebe ikpuru ha na-adịghị anwụ[b][a], ọkụ ahụkwa na-adịghị anyụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe ikpuru ha anaghị akwụsị, ọkụ ahụkwa anaghị emenyụ.”
    reason: lexical_alternative
