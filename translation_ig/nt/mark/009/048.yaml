    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: ebe
  rationale: Ọ bụ adverb na-egosi ebe; “ebe” bụ nsụgharị Igbo dị mfe ma dabara adaba.
- source_word: ὁ σκώληξ αὐτῶν
  choice: ikpuru ha
  rationale: “Ikpuru” na-edobe ihe oyiyi doro anya nke σκώληξ, ebe “ha” na-egosipụta αὐτῶν dị ka nke ha.
- source_word: οὐ τελευτᾷ
  choice: na-adịghị anwụ anwụ
  rationale: Ebe ikpuru bụ isiokwu ahịrịokwu ahụ, “anwụ anwụ” bụ okwu Igbo sitere n'okike maka τελευτᾷ ma na-edobe ịdịgide nke ihe oyiyi ahụ.
- source_word: τὸ πῦρ
  choice: ọkụ ahụ
  rationale: “Ọkụ” bụ nsụgharị kpọmkwem; “ahụ” na-anọchi mkpụrụokwu njirimara Greek ahụ n'ụzọ kwesịrị ekwesị n'Igbo.
- source_word: οὐ σβέννυται
  choice: na-adịghị anyụ anyụ
  rationale: N'Igbo, a na-ekwu na ọkụ “na-anyụ”; ụdị a na-egosi na ọ naghị akwụsị ịna-ere, n'emebighị ihe oyiyi ahụ.
theological_decisions:
- issue: Ụdị ihe oyiyi nke ikpe
  choice: Idowe ihe oyiyi pụtara ìhè nke ikpuru na ọkụ n'akọwaghị ya dịka mkpochapụ, mmekpa ahụ na-adịgide adịgide, ma ọ bụ naanị ihe atụ.
  alternative: Ịsụgharị ya n'ụzọ ga-eme ka ọ bụrụ ozizi doro anya banyere mmekpa ahụ na-adịghị agwụ agwụ, mkpochapụ a na-apụghị ịgbanwe, ma ọ bụ ihere na mmetọ dịka naanị ihe atụ.
  rationale: Amaokwu ahụ na-ekwughachi Aịzaya 66:24 ma na-enye ihe oyiyi siri ike banyere ikpe, ma ọ naghị edozi n'onwe ya esemokwu ozizi niile gbasara ọdịdị ikpe ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ “ikpuru” kama okwu ga-akọwapụta ụdị ahụhụ ahụ karịa ka Greek si mee; e deberekwa nkwughachi “anwụ anwụ/anyụ anyụ” dịka usoro Igbo sitere n'okike maka ọnọdụ na-aga n'ihu.
