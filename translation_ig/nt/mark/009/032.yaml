  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα, καὶ ἐφοβοῦντο αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/032.yaml
  text: But they did not understand the statement[a], and they were afraid to ask him.
translation:
  language: ig
  text: Ma ha aghọtaghị okwu ahụ[a], ha tụrụ egwu ịjụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘ihe ahụ o kwuru.’ Okwu Grik ῥῆμα nwere ike ịpụta okwu e kwuru, ihe e kwuru, ma ọ bụ nkwupụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ma ha
  rationale: δέ na-egosi ọdịiche dị nro n’etiti amụma Jizọs kwuru tupu nke a na mmeghachi omume ndị na-eso ụzọ; ‘Ma ha’ bụ ụzọ Igbo dị mfe ma doo anya isi kwuo ya.
- source_word: ἠγνόουν
  choice: aghọtaghị
  rationale: ἀγνοέω n’ebe a pụtara na ha enweghị nghọta banyere ihe Jizọs kwuru. Ụdị a na-egosipụta ọnọdụ ha n’oge gara aga n’Igbo nkịtị.
- source_word: τὸ ῥῆμα
  choice: okwu ahụ
  rationale: ῥῆμα na-ezo aka n’ihe Jizọs kwuru, ọ bụghị naanị otu mkpụrụokwu. ‘Okwu ahụ’ bụ okwu Igbo sara mbara, dịkwa mma maka okwu ma ọ bụ nkwupụta e kwuru.
- source_word: ἐφοβοῦντο
  choice: egwu tụkwara ha
  rationale: Nkebiokwu a bụ ụzọ Igbo ebumpụta ụwa isi gosi na ha nọ n’ọnọdụ egwu.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs dịka onye ha tụrụ egwu ịjụ.
- source_word: ἐπερωτῆσαι
  choice: ịjụ
  rationale: ἐπερωτάω pụtara ịjụ ajụjụ ma ọ bụ ịrịọ ka a kọwaa ihe; ‘ịjụ’ na-enye isi ihe ahụ n’Igbo doro anya.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma nwee ugwu. Ahịrịokwu ahụ na-echekwa ọdịiche nke δέ, enweghị nghọta ndị na-eso ụzọ, na egwu ha tụrụ ịjụ Jizọs; e doghị ihe kpatara egwu ahụ n’ihi na isi mmalite akọwaghị ya.
