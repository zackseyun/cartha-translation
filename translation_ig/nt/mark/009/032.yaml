review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the disciples’ failure to understand Jesus’ saying and their fear of asking him. However, “egwu tụkwara ha” introduces the additive sense of -kwa (“also”), which is not present in the Greek, and can suggest that fear newly came upon them rather than simply expressing their continuing reluctance.
  naturalness: “Ha tụrụ egwu ịjụ ya” is a more natural, direct Standard Igbo rendering of “they were afraid to ask him.” The rest of the sentence is clear and suitably restrained.
  terminology: “Okwu ahụ” is an appropriate broad rendering of τὸ ῥῆμα in this context. The footnote responsibly supplies “ihe ahụ o kwuru” as a possible contextual alternative without narrowing the Greek to a single lexical sense.
  issues:
  - severity: medium
    issue: The particle -kwa in “egwu tụkwara ha” adds an unwarranted additive nuance.
    rationale: The Greek has καί (“and”), coordinating the two clauses, but does not say that fear “also” came upon them. Removing -kwa avoids adding meaning and yields more idiomatic Igbo.
  revised_text: Ma ha aghọtaghị okwu ahụ[a], ha tụrụ egwu ịjụ ya.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘ihe ahụ o kwuru.’ Okwu Grik ῥῆμα nwere ike ịpụta okwu e kwuru, ihe e kwuru, ma ọ bụ nkwupụta.
    reason: lexical_alternative
  revision_rationale: The revision replaces “egwu tụkwara ha” with the idiomatic “ha tụrụ egwu,” preserving the sense that they were afraid to ask Jesus while removing the unsupported additive implication of -kwa. No other change is needed.
