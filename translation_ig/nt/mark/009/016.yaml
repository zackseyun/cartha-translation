  text: καὶ ἐπηρώτησεν ⸀αὐτούς· Τί συζητεῖτε πρὸς ⸀αὑτούς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/016.yaml
  text: And he asked them[a], “What are you discussing with one another?”
translation:
  language: ig
  text: Ọ jụrụ ha[a] sị, “Gịnị ka unu na-arụrịta ụka n’etiti onwe unu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Gịnị ka unu na-atụle n’etiti onwe unu?” Ngwaa ahụ nwere ike ịpụta mkparịta ụka, arụmụka, ma ọ bụ esemokwu, dabere n’ọnọdụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: Ọ jụrụ
  rationale: N’akụkọ a, ụdị ngwaa a na-ewebata ajụjụ kpọmkwem; “ọ jụrụ” bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa.
- source_word: αὐτούς
  choice: ha
  rationale: Nnọchiaha Grik ahụ bụ ọtụtụ ma amaokwu a akọwaghị kpọmkwem ndị ọ na-ekwu maka ha; “ha” na-edobe enweghị nkọwa ahụ.
- source_word: Τί
  choice: Gịnị
  rationale: Ajụjụ ahụ na-achọ ihe ma ọ bụ isiokwu ha na-atụle, ọ bụghị ihe kpatara ya.
- source_word: συζητεῖτε
  choice: na-arụrịta ụka
  rationale: N’ọnọdụ gbara amaokwu a gburugburu, ngwaa ahụ nwere ike ịpụta mkparịta ụka, arụmụka, ma ọ bụ esemokwu; “na-arụrịta ụka” na-egosipụta mkparịta ụka nwere echiche dị iche iche n’Igbo nkịtị.
- source_word: πρὸς αὑτούς
  choice: n’etiti onwe unu
  rationale: Nkebiokwu a na-egosi omume ndị nọ n’ìgwè ahụ na-emekọrịta n’etiti onwe ha; nke a bụ Igbo doro anya ma dị mma.
- source_word: καὶ
  choice: Ọ
  rationale: Ọ bụ ezie na καί jikọtara omume a na akụkọ bu ya ụzọ, n’Igbo nke oge a njikọ ahụ nwere ike ịdị n’usoro akụkọ na-enweghị ịsụgharị ya iche; ibido na “Ọ” na-eme ka ahịrịokwu ahụ bụrụ nke ebumpụta ụwa.
