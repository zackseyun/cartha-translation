  source_fidelity: '"Ọ jụrụ ha sị" faithfully renders ἐπηρώτησεν αὐτούς without specifying the antecedent of the plural pronoun. “Gịnị ka unu na-arụrịta ụka n’etiti onwe unu?” accurately conveys the reciprocal force of πρὸς ἑαυτούς. Although συζητεῖτε has a broad range that includes discussion and debate, “na-arụrịta ụka” is a contextually sound rendering in this scene and does not exceed the Greek’s possible sense.'
