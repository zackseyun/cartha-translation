  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸂ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου⸃· Διδάσκαλε, ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: ig
  text: Otu onye n’ime igwe mmadụ ahụ zara ya, sị, “Onye Ozizi, akpọtara m gị nwa m nwoke, onye mmụọ ogbi ji.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ihi na mmụọ ogbi ji ya.”
    reason: Ụdị participle ἔχοντα nwere ike ịpụta dịka nkọwa kpọmkwem banyere nwa ahụ ma ọ bụ dịka nkebi na-akọwa ihe kpatara e ji kpọta ya.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: zara
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọ nzaghachi n’akụkọ, ọ naghịkwa agbakwụnye ihe na-adịghị na Grik.
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: Otu onye n’ime igwe mmadụ ahụ
  rationale: Nke a na-edobe echiche nke otu onye sitere n’etiti ìgwè ahụ, n’agbanyeghị na Grik ekwughị kpọmkwem na ọ bụ nwoke.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Nke a bụ okwu Igbo doro anya maka onye na-akụzi ihe, ọ dịkwa nso n’ihe διδάσκαλος pụtara.
- source_word: ἤνεγκα
  choice: akpọtara m
  rationale: Ụdị ngwaa a na-egosi na onye ahụ mere ka nwa ya bịakwute Jizọs; ọ bụkwa ụzọ e si ekwu ya nke ọma n’Igbo.
- source_word: τὸν υἱόν μου
  choice: nwa m nwoke
  rationale: Nke a na-edobe mmekọrịta ezinụlọ na okike nwoke nke υἱός gosiri.
- source_word: πρὸς σέ
  choice: gị
  rationale: N’usoro ‘akpọtara m gị,’ Igbo na-egosi n’ụzọ ebumpụta ụwa na ọ bụ Jizọs ka a kpọtaara nwa ahụ.
- source_word: ἔχοντα
  choice: onye … ji
  rationale: Nkebi a na-akọwa nwa nwoke ahụ ozugbo ma na-enye echiche na mmụọ ahụ na-achị ya, kama ime ka o yie na nwa ahụ nwe mmụọ dịka ihe onwunwe.
- source_word: πνεῦμα ἄλαλον
  choice: mmụọ ogbi
  rationale: Nke a na-asụgharị okwu abụọ ahụ nkenke ma hapụ okwu ahụ dịka ‘mmụọ,’ n’etinyeghị ‘ọjọọ’ ma ọ bụ ‘mmụọ ọjọọ’ nke a na-akọwaghị kpọmkwem n’amaokwu a.
theological_decisions:
- issue: Ihe πνεῦμα pụtara n’akụkọ ịchụ mmụọ a
  choice: mmụọ ogbi
  alternative: mmụọ ọjọọ nke na-eme ka ọ ghara ikwu okwu
  rationale: Ọnọdụ akụkọ ahụ na-egosi mmụọ na-enye nwa ahụ nsogbu, ma amaokwu Grik kpọrọ ya naanị ‘mmụọ.’ Ya mere, e tinyeghị ‘ọjọọ’ ma ọ bụ ‘ekwensu’ n’isiokwu ahụ.
- issue: Mmekọrịta ἔχοντα na ‘nwa m nwoke’
  choice: onye mmụọ ogbi ji
  alternative: n’ihi na mmụọ ogbi ji ya
  rationale: Nhọrọ bụ isi na-edobe nkebi participle ahụ dịka nkọwa nwa nwoke ahụ. Nhọrọ ọzọ nwere ike ime ka ihe kpatara nna ya ji kpọta ya pụta ìhè karịa, ma nke ahụ bụ ntakịrị nkọwa agbakwunyere.
translation_notes:
  register: Ejiri Igbo Izugbe dị ugbu a, nke nwere nsọpụrụ ma dịkwa mfe nghọta. ‘Onye Ozizi’ bụ okwu nkịtị ma dị ugwu; ‘mmụọ ogbi ji’ na-agbaso ụzọ Igbo si akọ njide mmụọ n’etinyeghị nkọwa ụka pụrụ iche.
