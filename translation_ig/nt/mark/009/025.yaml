    issue: Footnote a contains an awkward alternative rendering.
    rationale: “Igwe mmadụ na-agbakọ ọsọ abịa” does not naturally convey ἐπισυντρέχει in Standard Igbo. A wording such as “igwe mmadụ na-agba ọsọ na-abịakọta” clearly conveys people converging rapidly.
