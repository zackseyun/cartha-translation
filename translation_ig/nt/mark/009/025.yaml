id: MRK.9.25
reference: Mark 9:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: ig
  text: 'Ma mgbe Jizọs hụrụ na igwe mmadụ na-agbakọta ọsọ ọsọ[a], ọ baara mmụọ ahụ na-adịghị ọcha mba, sị ya, “Gị, mmụọ ogbi na ntị chiri, ana m enye gị iwu: si n’ime ya pụta, abanyekwala n’ime ya ọzọ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “igwe mmadụ na-agba ọsọ na-abịakọta.” Ngwaa Grik ahụ na-egosi na ndị mmadụ si ebe dị iche iche na-agbakọta ngwa ngwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Ma mgbe Jizọs hụrụ
  rationale: A sụgharịrị participle ahụ dị ka nkebiokwu oge n’Igbo, ebe “Ma” na-egosi njikọ akụkọ dị nro nke δέ.
- source_word: ἐπισυντρέχει ὄχλος
  choice: igwe mmadụ na-agbakọta ọsọ ọsọ
  rationale: Nhọrọ a na-egosi ma ọganihu omume ahụ na ịdị ngwa nke ndị mmadụ si ebe dị iche iche na-ezukọta; ihe ọzọ nwere ike ịbụ na ha “na-agbakọ ọsọ abịa.”
- source_word: ἐπετίμησεν
  choice: ọ baara ... mba
  rationale: “Ịbara mba” na-egosipụta okwu siri ike nke onye nwere ikike, ma kwekọọ n’ụzọ a na-asụkarị ἐπιτιμάω n’akụkọ banyere Jizọs na mmụọ ọjọọ.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: mmụọ ahụ na-adịghị ọcha
  rationale: Nke a na-echekwa okwu na echiche nke ἀκάθαρτος n’ọnọdụ ịchụ mmụọ, kama ịgbanwe ya ozugbo ka ọ bụrụ naanị “mmụọ ọjọọ.”
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: Gị mmụọ ogbi na ntị chiri
  rationale: “Gị” na-eme ka ọkpụkpọ aha ahụ doo anya n’Igbo; “ogbi” na “ntị chiri” na-edobe nkwarụ ikwu okwu na nke ịnụ ihe dịka ihe abụọ dị iche.
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: ana m enye gị iwu
  rationale: Nke a bụ okwu Igbo doro anya nke na-egosipụta iwu e nyere site n’ikike; nnọchiaha dị n’ụdị ngwaa ahụ na-ejigide onye na-enye iwu n’enweghị ikwubiga okwu ókè.
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: si n’ime ya pụta
  rationale: Ọ bụ ụzọ ebumpụta ụwa n’Igbo isi nye iwu ka ihe bi n’ime mmadụ pụọ.
- source_word: μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: abanyekwala n’ime ya ọzọ
  rationale: Ụdị iwu mgbochi a na-egosi na a machibidoro mmụọ ahụ ịbanyeghachi n’ọdịnihu, nke kwekọrọ na μηκέτι na subjunctive ahụ.
theological_decisions:
- issue: Aha e nyere mmụọ ahụ na ikike Jizọs nwere n’ebe ọ nọ
  choice: “mmụọ ahụ na-adịghị ọcha,” “ọ baara ... mba,” na “ana m enye gị iwu”
  alternative: “mmụọ ọjọọ,” “ọ gwara mmụọ ahụ okwu n’ike,” ma ọ bụ okwu ga-eme ka ihe ahụ yie naanị ọrịa
  rationale: Ihe odide ahụ na-egosi mmụọ dị ka onye Jizọs na-agwa okwu kpọmkwem ma na-enye iwu. Nsụgharị ahụ anaghị eme ka nke a bụrụ naanị ọrịa, ọ naghịkwa atụkwasị nkọwa ozizi na-adịghị n’amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. “Ịbara mba” na “inye iwu” na-enye okwu Jizọs ike kwesịrị ekwesị, ebe “mmụọ ahụ na-adịghị ọcha” na-edobe akpaokwu pụrụ iche nke ederede Grik.
