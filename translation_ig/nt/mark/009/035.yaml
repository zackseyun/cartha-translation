  text: καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς· Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: ig
  text: Ọ nọdụ ala, kpọọ mmadụ iri na abụọ ahụ, sị ha, “Ọ bụrụ na onye ọ bụla chọrọ ịbụ onye mbụ, ọ ga-abụ onye ikpeazụ nke mmadụ niile na onye na-ejere mmadụ niile ozi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: Mgbe ọ nọsịrị ala
  rationale: Ọ na-egosi omume Jizọs nke ịnọdụ ala tupu ọ kpọọ mmadụ iri na abụọ ahụ; nke a bụ ụzọ Igbo doro anya ma kwekọọ n’usoro participle ahụ.
- source_word: ἐφώνησεν
  choice: ọ kpọrọ
  rationale: N’ebe a, okwu ahụ pụtara ịkpọ ndị mmadụ ka ha bịakwute ya, ọ bụghị nanị ikwupụta okwu n’olu dara ụda.
- source_word: λέγει
  choice: sị ha
  rationale: Present akụkọ ihe mere eme nke Grik na-eme ka akụkọ ahụ dị ndụ; n’Igbo, “sị ha” bụ ụzọ nkịtị na nke dị ire isi webata okwu kpọmkwem n’akụkọ gara aga.
- source_word: πρῶτος
  choice: onye mbụ
  rationale: Ọ na-echekwa echiche nke ịbụ onye kacha n’ọkwa ma ọ bụ n’ịdị mkpa, n’enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: ἔσχατος
  choice: onye ikpeazụ
  rationale: Nke a na-echekwa ntụnyere kpọmkwem dị n’etiti “onye mbụ” na “onye ikpeazụ.”
- source_word: διάκονος
  choice: onye na-ejere ... ozi
  rationale: N’ebe a διάκονος pụtara onye na-ejere ndị ọzọ ozi; nsụgharị a bụ nke ndị Igbo oge a ga-aghọta nke ọma ma ọ naghị ebubata aha ọkwa ụka.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ọchịchọ ịbụ onye mbụ na ịbụ onye ikpeazụ/onye ozi
  choice: ọ ga-abụ onye ikpeazụ n’etiti mmadụ niile na onye na-ejere mmadụ niile ozi
  alternative: ọ ghaghị ịbụ onye ikpeazụ n’etiti mmadụ niile na onye na-ejere mmadụ niile ozi
  rationale: Grik ἔσται bụ future “ọ ga-abụ,” ọ bụghị iwu e kwuru n’ụdị imperative. A hapụrụ esemokwu dị n’okwu Jizọs n’enweghị ịgbanwe ya ka ọ bụrụ iwu doro anya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E jiri “mmadụ iri na abụọ ahụ” mee ka aha otu ndị ahụ doo anya; e zere “diyacon” ka a ghara ime διάκονος aha ọkwa ụka n’ebe a.
