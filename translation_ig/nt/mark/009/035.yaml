- from: Mgbe ọ nọsịrị ala, ọ kpọrọ mmadụ iri na abụọ ahụ, sị ha, “Ọ bụrụ na onye ọ bụla chọrọ ịbụ onye mbụ, ọ ga-abụ onye ikpeazụ n’etiti mmadụ niile na onye na-ejere mmadụ niile ozi.”
  to: Ọ nọdụ ala, kpọọ mmadụ iri na abụọ ahụ, sị ha, “Ọ bụrụ na onye ọ bụla chọrọ ịbụ onye mbụ, ọ ga-abụ onye ikpeazụ nke mmadụ niile na onye na-ejere mmadụ niile ozi.”
  rationale: The revision directly renders the aorist participle as a preceding seated action and removes the added “among” nuance. It retains the Greek historical present’s natural Igbo narrative equivalent (“sị ha”), the future force of ἔσται (“ọ ga-abụ”), and the non-ecclesiastical service sense of διάκονος.
