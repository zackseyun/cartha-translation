  yaml_path: translation/nt/mark/009/040.yaml
  text: For whoever is not against us is for us[a].
translation:
  language: ig
  text: N’ihi na onye ọ bụla na-adịghị emegide anyị nọ n’akụkụ anyị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-akwado anyị.” Okwu Grik ὑπὲρ ἡμῶν nwekwara ike ịpụta “maka anyị” ma ọ bụ “n’aha anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: onye ọ bụla
  rationale: Nnọchiaha a na-ekwu maka mmadụ n’ozuzu ya; ‘onye ọ bụla’ na-egosipụta nke ọma na okwu ahụ metụtara onye ọbụla dabara n’ọnọdụ a.
- source_word: γὰρ
  choice: N’ihi na
  rationale: γάρ na-enye nkọwa maka okwu bu ya ụzọ; ‘N’ihi na’ bụ njikọ nkọwa doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: οὐκ ἔστιν
  choice: na-adịghị
  rationale: N’ime ahịrịokwu Igbo a, ụdị njụ a na-asụkarị na-enye echiche copula e jụrụ ajụ n’enweghị mgbakwunye na-adịghị na Grik.
- source_word: καθ’ ἡμῶν
  choice: emegide anyị
  rationale: κατά ya na genitive na-egosi mmegide; ‘imegide anyị’ bụ ntụgharị doro anya ma kwekọọ n’ọnọdụ a.
- source_word: ὑπὲρ ἡμῶν
  choice: nọnyeere anyị
  rationale: N’ime ọdịiche dị n’etiti mmegide na nkwado, ‘nọnyeere anyị’ na-egosi ịnọ n’akụkụ anyị, ma okwu nkọwa na-edebe ụzọ ọzọ nke nwere ike ịbụ ‘na-akwado anyị’ ma ọ bụ ‘na-eme ihe n’ihi anyị.’
- source_word: ἐστιν
  choice: nọnyere
  rationale: ‘Nọnyere’ na-arụ ọrụ dị ka copula n’ụzọ eke n’Igbo ma mezue ọdịiche dị n’etiti onye na-emegide anyị na onye nọ n’akụkụ anyị.
theological_decisions:
- issue: Oke ihe ‘na-emegide anyị’ na ‘nọnyere anyị’ pụtara
  choice: E debere nnọchiaha ‘anyị’ na asụsụ mmekọrịta ahụ n’enweghị ịgbasa ya.
  alternative: ‘Onye na-adịghị emegide ozi anyị nọ n’akụkụ anyị’ ma ọ bụ ‘Onye na-adịghị emegide Chineke nọnyere Chineke.’
  rationale: Grik kwuru kpọmkwem ‘anyị.’ Ịgbakwunye ‘ozi anyị,’ ‘alaeze,’ ma ọ bụ ‘Chineke’ ga-akọwa ihe ederede ahụ karịa ka isi mmalite si kwuo ma wepụ ụfọdụ nghọtahie ziri ezi dị n’okwu ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. E ji ‘nọnyere anyị’ mee ka ọdịiche dị n’etiti ‘imegide anyị’ na ịnọ n’akụkụ anyị pụta n’ụzọ eke; akara nkọwa [a] na-echekwa obosara nghọta nke ὑπὲρ ἡμῶν.
