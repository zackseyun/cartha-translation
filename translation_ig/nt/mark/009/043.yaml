id: MRK.9.43
reference: Mark 9:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: ig
  text: Ọ bụrụkwa na aka gị emee ka ị sụọ ngọngọ[a], bipụ ya. Ọ kaara gị mma ịbanye ná ndụ dịka onye nwere nkwarụ n’aka, karịa inwe aka abụọ wee laa na Gehena[b], n’ọkụ a na-apụghị imenyụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “na-eme ka ị mehie.” Ngwaa Grik a nwere ike ịpụta ime ka mmadụ sụọ ngọngọ, daa, ma ọ bụ mehie.'
    reason: lexical_alternative
  - marker: b
    text: Gehena bụ ụdị Grik nke aha ebe e jikọtara ya na ikpe Chineke; a na-asụgharịkarị ya “hel.”
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: na-eme ka ị sụọ ngọngọ
  rationale: Nke a na-edowe ihe atụ Grik nke ịsụ ngọngọ, ma hapụkwa ohere ọ pụtara ime ka mmadụ mehie ma ọ bụ daa.
- source_word: ἀπόκοψον
  choice: bipụ ya
  rationale: Iwu a siri ike ma doo anya; okwu a na-egosipụta ibipụ aka ahụ n'enweghị ime ka ihe oyiyi ahụ dị nro.
- source_word: καλόν
  choice: ọ kaara gị mma
  rationale: Ọ bụ ezie na okwu ahụ pụtara ‘ọ dị mma,’ usoro ntụnyere ya na ἢ chọrọ ntụgharị nkịtị nke pụtara ‘ọ ka mma.’
- source_word: κυλλόν
  choice: dị ka onye aka ya ezughị ezu
  rationale: N'ọnọdụ a, okwu ahụ na-ekwu maka onye a napụrụ aka ma ọ bụ onye akụkụ ahụ ya ezughị ezu; ntụgharị a na-ejikọta ya kpọmkwem na aka a kpọtụrụ aha.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: ịbanye ná ndụ
  rationale: Nke a na-edowe okwu banyere ịbanye ná ndụ n'echiche ọdịnihu nke ikpeazụ, ọ bụghị naanị ịdị ndụ n'anụ ahụ.
- source_word: ἀπελθεῖν
  choice: wee laa
  rationale: ‘Laa’ na-egosipụta ije pụọ, ma na-eme ka ọdịiche dị n'etiti ịbanye ná ndụ na ịla na Gehena pụta ìhè.
- source_word: γέενναν
  choice: Gehena
  rationale: Aha ebe ahụ ka e debere, kama ijikọta ya ozugbo na otu okwu nkà mmụta okpukpe nke nwere ike ibu echiche ndị ọzọ.
- source_word: ἄσβεστον
  choice: a na-apụghị imenyụ emenyụ
  rationale: Nke a na-egosi ọkụ na-apụghị ịkwụsị site n'ịmenyụ ya ma na-ada nke ọma n'Igbo ugbu a.
- source_word: χείρ σου
  choice: aka gị
  rationale: Ọ bụ ntụgharị kpọmkwem, ebe ihe oyiyi akụkụ ahụ dị mkpa n'ịdọ aka ná ntị a.
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: inwe aka abụọ
  rationale: Nke a na-edowe ọdịiche doro anya dị n'etiti ịbụ onye aka ya ezughị ezu na onye nwere aka abụọ.
theological_decisions:
- issue: Otú e si sụgharị γέεννα n'okwu ikpe
  choice: Gehena
  alternative: hel
  rationale: Idowe aha ahụ na-echekwa ihe oyiyi ndị Juu na ndabere aha ebe ahụ, kama ime ka ọ bụrụ naanị okwu nkà mmụta okpukpe sara mbara.
- issue: Ike ihe oyiyi nke ibipụ aka
  choice: Idowe okwu ahụ n'ụzọ anụ ahụ ma sie ike
  alternative: Ịkọwa ya n'ụzọ dị nro dịka izere mmehie naanị
  rationale: Isi mmalite ahụ jiri ihe oyiyi na-awụ akpata oyi mesie ịdị njọ nke ịda na ikpe ike; ekwesịghị ịkọwa ihe oyiyi ahụ pụọ na ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ihe. A hapụrụ ihe atụ ‘ịsụ ngọngọ,’ a debekwara ‘Gehena’ n'ahịrị isi, ebe nkọwa ndị ọzọ dị n'ala peeji.
