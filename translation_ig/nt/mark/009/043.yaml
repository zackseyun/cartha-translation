review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the conditional warning, the stumbling metaphor, the forceful command to cut off the hand, the contrast between entering life and going to Gehenna, and the designation of the fire as unquenchable. A few phrasing adjustments make the Igbo more idiomatic while retaining the Greek nuance.
  naturalness: “Aka gị na-eme ka ị sụọ ngọngọ” is understandable but less natural in this conditional construction than “aka gị emee ka ị sụọ ngọngọ.” “Onye aka ya ezughị ezu” is awkward and can suggest merely an incomplete/insufficient hand rather than being maimed. “Nke nwere nkwarụ n’aka” is clearer and more natural without overexplaining the image.
  terminology: “Gehena” appropriately retains γέεννα, and the footnote responsibly supplies “hel” as a traditional rendering. “Ọkụ a na-apụghị imenyụ” is a concise, natural rendering of τὸ πῦρ τὸ ἄσβεστον; the reduplicated “imenyụ emenyụ” is unnecessary.
  issues:
  - severity: medium
    issue: Rendering of κυλλόν
    rationale: “Dị ka onye aka ya ezughị ezu” is not idiomatic Standard Igbo and may weaken the sense of being maimed or disabled. “Nke nwere nkwarụ n’aka” clearly conveys the bodily impairment while retaining the source’s concise description.
  - severity: low
    issue: Conditional verbal phrasing
    rationale: In this conditional warning, “emee ka ị sụọ ngọngọ” is more natural Standard Igbo than the progressive “na-eme ka ị sụọ ngọngọ,” while adequately representing the present-subjunctive warning sense.
  - severity: low
    issue: Unquenchable-fire expression
    rationale: “A na-apụghị imenyụ emenyụ” is understandable, but “a na-apụghị imenyụ” is the more economical and idiomatic expression.
