  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro onyinyo ahụ—ikpuru na ọkụ—n’enweghị ịkọwa esemokwu nkà mmụta okpukpe karịrị ihe Grik kwuru.
