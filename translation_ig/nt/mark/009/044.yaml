  text: ebe[a] ikpuru ha na-adịghị anwụ, ọkụ ahụkwa na-adịghị anyụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a adịghị n’ihe odide Grik ndị kacha ochie (gụnyere Sinaiticus na Vaticanus nke narị afọ nke anọ) nakwa na nsụgharị ndị mbụ e mere n’asụsụ Coptic. Ma ọ dị na Alexandrinus nke narị afọ nke ise, n’ọdịnala Latin, nakwa n’ọtụtụ ihe odide Byzantine ndị e dere mgbe e mesịrị. O yikarịrị ka onye odeakwụkwọ mechara tinye ya site n’ịmegharị otu ahịrịokwu ahụ dị n’amaokwu 48.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: ikpuru
  rationale: Ọ bụ okwu Igbo a na-ahụkarị maka ikpuru ma ọ bụ ụmụ ahụhụ na-eri ihe rere ure; ọ na-echekwa onyinyo e hotara site n'Aịzaya 66:24.
- source_word: τελευτᾷ
  choice: na-adịghị anwụ anwụ
  rationale: N'ebe a, ngwaa ahụ na-ekwu maka ihe dị ndụ, ya mere 'anwụ anwụ' bụ nsụgharị Igbo kachasị eke ma doo anya.
- source_word: σβέννυται
  choice: na-adịghị anyụ anyụ
  rationale: N'okwu gbasara ọkụ, 'ịnyụ' na-egosi na ọkụ kwụsịrị ire; usoro a na-egosipụta omume passive nke Grik n'ụzọ Igbo dị eke.
