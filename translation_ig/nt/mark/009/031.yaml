  verdict: revise
  source_fidelity: The draft faithfully represents the Greek imperfects (ἐδίδασκεν/ἔλεγεν), the unspecified passive of παραδίδοται, the future plural ‘they will kill,’ the prior passive action in ἀποκτανθείς, and the distinct χρονological wording μετὰ τρεῖς ἡμέρας, ‘after three days.’ ‘Ọ ga-ebili’ appropriately retains the intransitive future sense of ἀναστήσεται rather than importing a passive ‘be raised.’
  naturalness: 'The verse is clear and suitably formal Standard Igbo. A small revision is warranted in the footnotes: referring to the language/text as ‘Greek’ is unnecessary code-switching and is less natural than ‘asụsụ Grik.’ The verse wording itself is retained because its paired temporal phrases clearly preserve the Greek sequence without needless restructuring.'
  terminology: ‘Nwa nke Mmadụ’ is an established, reverent rendering of the Gospel designation. ‘Ụmụ mmadụ’ naturally conveys ἀνθρώπων as human beings and maintains the rhetorical contrast with ‘Nwa nke Mmadụ’; it does not restrict the agents to males. ‘A na-enyefe’ correctly preserves the broad passive force without deciding that the act is specifically betrayal.
