id: MRK.9.31
reference: Mark 9:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: ig
  text: N’ihi na ọ nọ na-akụziri ndị na-eso ụzọ ya ihe, na-agwakwa ha, sị, “A na-enyefe Nwa nke Mmadụ n’aka ụmụ mmadụ[a]. Ha ga-egbu ya, ma mgbe e gbuchara ya, ụbọchị atọ gachaa[b], ọ ga-ebili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’aka ndị mmadụ.” N’asụsụ Grik, ọ bụ kpọmkwem, “n’aka ụmụ mmadụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ime ụbọchị atọ.” N’ebe a, asụsụ Grik kwuru, “mgbe ụbọchị atọ gachara,” okwu a na-ejikwa n’ebe ndị ọzọ n’akụkụ okwu ahụ bụ “n’ụbọchị nke atọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: ọ nọ na-akụziri … ihe
  rationale: Ụdị imperfect na-egosi na nkuzi ahụ nọ na-aga n’ihu ma ọ bụ na-eme ugboro ugboro; ‘ọ nọ na-akụziri’ na-egosipụta nke a n’Igbo doro anya.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-ejikọta amaokwu a na ihe bu ya ụzọ dịka nkọwa ma ọ bụ ihe kpatara ya.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka μαθηταί, ma na-egosikwa mmekọrịta ndị na-amụta ihe site n’iso onye nkụzi ha.
- source_word: ἔλεγεν αὐτοῖς
  choice: na-agwakwa ha, sị
  rationale: ‘Na-agwakwa’ na-egosipụta imperfect nke omume na-aga n’ihu, ebe ‘sị’ na-ebute okwu kpọmkwem n’ụzọ Igbo si ekwu okwu.
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Na-echekwa aha ahụ Jizọs ji akọwa onwe ya na njikọ ọ pụrụ inwe na Daniel, n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: παραδίδοται
  choice: A na-enyefe
  rationale: Na-echekwa passive na obosara echiche nke ‘inyefe n’aka’ n’agwaghị onye na-eme ya ma ọ bụ belata ya naanị ka ọ bụrụ nrara nye.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: n’aka ụmụ mmadụ
  rationale: Na-echekwa ilu doro anya nke ịbụ n’okpuru ike ndị ọzọ nakwa ọdịiche dị n’etiti ‘Nwa nke Mmadụ’ na ụmụ mmadụ.
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: Ha ga-egbu ya
  rationale: Na-enye future active plural n’ụzọ Igbo dị mfe ma kwụ ọtọ.
- source_word: ἀποκτανθεὶς
  choice: mgbe e gbuchara ya
  rationale: 'Na-echekwa passive na usoro oge nke participle ahụ: e buru ụzọ gbuo ya tupu o bilie.'
- source_word: μετὰ τρεῖς ἡμέρας
  choice: ụbọchị atọ gachaa
  rationale: Na-asụgharị μετά na accusative dịka ‘mgbe ụbọchị atọ gachara,’ n’enweghị ime ka okwu a kwekọọ n’ike na ‘n’ụbọchị nke atọ’ dị n’ebe ndị ọzọ.
- source_word: ἀναστήσεται
  choice: ọ ga-ebili
  rationale: Na-egosipụta future middle dịka ngwaa intransitive, ‘ọ ga-ebili,’ kama ịgbanwe ya ka ọ bụrụ passive ‘a ga-akpọlite ya.’
theological_decisions:
- issue: Ihe παραδίδοται pụtara na onye na-eme omume ahụ
  choice: A na-enyefe
  alternative: A na-arara nye
  rationale: Greek ekwughị onye na-enyefe ya ma nwee ike ịgụnye nrara nye, ijide ya, na ikwe ka ihe ahụ mee. ‘A na-enyefe’ na-echekwa obosara na esemokwu echiche ahụ.
- issue: Ọdịiche dị n’etiti Ὁ υἱὸς τοῦ ἀνθρώπου na ἀνθρώπων
  choice: Nwa nke Mmadụ … ụmụ mmadụ
  alternative: Nwa nke Mmadụ … ndị mmadụ
  rationale: Nhọrọ a na-eme ka nkwugharị mmadụ/ụmụ mmadụ nke Greek pụta ìhè, ma ọ naghị ekwu na ọ bụ naanị ndị nwoke ka a na-ekwu maka ha.
- issue: Ụdị olu nke ἀναστήσεται
  choice: ọ ga-ebili
  alternative: a ga-akpọlite ya
  rationale: Future middle dị n’ihe odide a na-akwado ‘ọ ga-ebili’; passive ga-ebubata ụdị okwu sitere n’amaokwu ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dịkwa mfe nghọta. A hapụrụ ilu ‘n’aka ụmụ mmadụ,’ passive ndị dị na παραδίδοται na ἀποκτανθεὶς, na usoro ‘ụbọchị atọ gachaa’ ka nkọwa na esemokwu dị n’isi mmalite ghara ịla n’iyi.
