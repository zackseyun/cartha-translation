  text: Κἀκεῖθεν ἐξελθόντες ⸀παρεπορεύοντο διὰ τῆς Γαλιλαίας, καὶ οὐκ ἤθελεν ἵνα τις γνοῖ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: ig
  text: Ha si n’ebe ahụ pụọ, wee na-agafe n’ime Galili, ma ọ chọghị ka onye ọ bụla mata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grik ekwughị kpọmkwem ihe ọ chọghị ka onye ọ bụla mata; n’ọnọdụ akụkọ a, ọ pụrụ ịpụta ọnụnọ ya ma ọ bụ ụzọ ha si na-agafe Galili.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντες
  choice: Ha si n’ebe ahụ pụọ
  rationale: Nkebi a na-ejikọta akụkọ ahụ na ihe gara aga ma na-egosi na ha hapụrụ ebe ahụ; ntụgharị a na-egosipụta ma καί + ἐκεῖθεν ma participle ἐξελθόντες n’Igbo dị mfe.
- source_word: παρεπορεύοντο
  choice: na-agafe
  rationale: Ụdị imperfect na-egosi njem na-aga n’ihu; “na-agafe” na-egosipụta na ha nọ n’ụzọ, ọ bụghị na ha kwụsịrị n’ógbè ahụ.
- source_word: διὰ τῆς Γαλιλαίας
  choice: Galili
  rationale: N’usoro “na-agafe Galili,” aha ebe ahụ na-arụ ọrụ dịka ógbè ha si n’ime ya na-agafe, nke kwekọrọ na διά na genitive.
- source_word: οὐκ ἤθελεν
  choice: ọ chọghị
  rationale: Nke a bụ ụzọ Igbo nke oge a si egosipụta ọchịchọ a jụrụ ajụ, n’enweghị ịgbakwunye echiche gbasara ikike ma ọ bụ enweghị ike.
- source_word: ἵνα τις γνοῖ
  choice: ka onye ọ bụla mara ya
  rationale: Nkebi ka + subjunctive na-egosipụta ihe Jizọs achọghị ka o mee. “Ya” na-arụtụ aka n’ihe a ga-amara, ma ihe okwu ahụ bụ kpọmkwem ka akọwaghị ya n’amaokwu Grik.
theological_decisions:
- issue: Onye bụ isiokwu nke ἤθελεν
  choice: “ọ” na-arụtụ aka na Jizọs
  alternative: Ịghọta ya dịka isiokwu na-abụghị otu onye ma ọ bụ ndị niile nọ n’ìgwè
  rationale: Ngwaa singular ahụ na usoro akụkọ na-arụtụ aka n’ụzọ kachasị eke na Jizọs.
- issue: Ihe a na-achọghị ka onye ọ bụla mara
  choice: E debere ihe ahụ n’enweghị nkọwa kpọmkwem, site n’iji “ya”
  alternative: Ịkọwa ya dịka ọnụnọ Jizọs ma ọ bụ ụzọ njem ha
  rationale: Grik ekwughị kpọmkwem ihe a ga-amara; ntụgharị ahụ ekwesịghị idozi ihe isi mmalite hapụrụ n’amaghị ama.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere mmegharị na-aga n’ihu nke imperfect site na “na-agafe,” ma zere ịkọwapụta ihe Grik hapụrụ n’enweghị isiokwu kpọmkwem.
