revisions:
- from: Ha si n’ebe ahụ pụọ, na-agafe Galili, ma ọ chọghị ka onye ọ bụla mara ya.[a]
  to: Ha si n’ebe ahụ pụọ, wee na-agafe n’ime Galili, ma ọ chọghị ka onye ọ bụla mata.[a]
  rationale: The revision removes the explicit object “ya” in order to preserve the Greek’s unstated object of γνοῖ. It also uses “wee na-agafe n’ime Galili” to express both the departure participle and the ongoing movement through Galilee in idiomatic Standard Igbo.
  reviewer_model: gpt-5.6-terra
