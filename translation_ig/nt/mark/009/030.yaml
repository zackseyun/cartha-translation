    reason: lexical_alternative
  revision_rationale: The revision removes the explicit object “ya” in order to preserve the Greek’s unstated object of γνοῖ. It also uses “wee na-agafe n’ime Galili” to express both the departure participle and the ongoing movement through Galilee in idiomatic Standard Igbo.
