  text: Καὶ ⸂ἐλθόντες πρὸς τοὺς μαθητὰς εἶδον⸃ ὄχλον πολὺν περὶ αὐτοὺς καὶ γραμματεῖς συζητοῦντας ⸂πρὸς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/014.yaml
  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: ig
  text: Mgbe ha bịakwutere ndị na-eso ụzọ ahụ, ha hụrụ nnukwu ìgwè mmadụ gbara ha gburugburu, hụkwa ndị odeakwụkwọ na-arụrịta ụka[a] na ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ekwurịta okwu na ha.” Okwu Grik ahụ nwere ike ịpụta mkparịta ụka, arụmụka, ma ọ bụ nrụrịta ụka; ma n’ọnọdụ a, o yikarịrị ka ọ na-egosi esemokwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες πρὸς τοὺς μαθητάς
  choice: Mgbe ha bịakwutere ndị na-eso ụzọ ya
  rationale: A tụgharịrị aorist participle ahụ dị ka nkebiokwu oge n’Igbo ka ọ bụrụ asụsụ akụkọ dị ire, ebe ‘bịakwutere’ na-egosikwa ngagharị ruo n’ebe ndị ahụ nọ.
- source_word: εἶδον
  choice: ha hụrụ
  rationale: Nke a na-enye aorist nke ὁράω n’ụzọ dị mfe ma kwekọọ n’usoro akụkọ.
- source_word: ὄχλον πολὺν
  choice: oké ìgwè mmadụ
  rationale: ‘Oké’ na-egosi na ọnụ ọgụgụ ìgwè mmadụ ahụ buru ibu, n’asụsụ Igbo dị mfe ma dị ùgwù.
- source_word: περὶ αὐτούς
  choice: gbara ha gburugburu
  rationale: Nkebiokwu a na-egosi ọnọdụ ìgwè mmadụ ahụ gburugburu ndị na-eso ụzọ ahụ.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nke a na-edobe aha otu ndị Juu maara Akwụkwọ Nsọ na Iwu nke ọma, kama ime ka ha bụrụ naanị ndị nkụzi n’ozuzu.
- source_word: συζητοῦντας πρὸς αὐτούς
  choice: na-arụrịta ụka na ha
  rationale: συζητέω nwere ike ịpụta mkparịta ụka ma ọ bụ arụmụka; ọnọdụ esemokwu dị n’akụkọ a na-akwado ‘na-arụrịta ụka,’ ebe ‘na ha’ na-egosi ndị na-eso ụzọ ahụ.
