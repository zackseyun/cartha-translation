- from: Mgbe ha bịakwutere ndị na-eso ụzọ ya, ha hụrụ oké ìgwè mmadụ gbara ha gburugburu, hụkwa ndị odeakwụkwọ na-arụrịta ụka[a] na ha.
  to: Mgbe ha bịakwutere ndị na-eso ụzọ ahụ, ha hụrụ nnukwu ìgwè mmadụ gbara ha gburugburu, hụkwa ndị odeakwụkwọ na-arụrịta ụka[a] na ha.
  rationale: The revision removes the unexpressed possessive “ya,” retains the source's ambiguity of reference through “ndị na-eso ụzọ ahụ” and “ha,” uses a more direct idiom for a numerically large crowd, and revises the footnote to present a distinct neutral alternative without weakening the contextual sense of dispute.
