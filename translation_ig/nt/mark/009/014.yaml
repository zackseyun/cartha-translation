translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù, mee ntụgharị a. E debere usoro akụkọ na ihe nnọchiaha Grik na-akọwapụtaghị aha ndị ahụ kpọmkwem; ‘ha’ ikpeazụ na-ezo aka n’ebe ndị na-eso ụzọ nọ.
