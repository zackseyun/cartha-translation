- from: Ozugbo ahụ, ọ manyere ndị na-eso ụzọ ya ka ha banye n’ụgbọ mmiri, buru ya ụzọ gaa n’ofe nke ọzọ, chee ihu na Betseida[a], ruo mgbe ya onwe ya ga-ezilaga igwe mmadụ ahụ.[b]
  to: Ozugbo ahụ, ọ manyere ndị na-eso ụzọ ya ka ha banye n’ụgbọ mmiri, buru ya ụzọ gaa n’ofe nke ọzọ n’ebe Betsaida dị[a], ruo mgbe ya onwe ya ga-eziga igwe mmadụ ahụ ka ha laa.[b]
  rationale: The revision replaces an unnatural directional idiom with clear Standard Igbo, removes an unintended iterative nuance from the dismissal verb, and updates both footnotes to correspond exactly to the revised translation. It preserves the Greek’s directional nuance, emphatic “ya onwe ya,” and the temporal present’s natural narrative rendering.
