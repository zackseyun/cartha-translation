    text: A pụkwara ịsụgharị ya, “gaa Betsaida.” Preposition Grik a pụrụ igosi ntụziaka n’ozuzu ya (“n’ebe Betsaida dị”) ma ọ bụ ebe a na-aga kpọmkwem (“gaa Betsaida”).
    reason: lexical_alternative
  - marker: b
