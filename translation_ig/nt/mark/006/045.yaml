  text: Καὶ ⸀εὐθὺς ἠνάγκασεν τοὺς μαθητὰς αὐτοῦ ἐμβῆναι εἰς τὸ πλοῖον καὶ προάγειν ⸂εἰς τὸ πέραν⸃ πρὸς Βηθσαϊδάν, ἕως αὐτὸς ⸀ἀπολύει τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: ig
  text: Ozugbo ahụ, ọ manyere ndị na-eso ụzọ ya ka ha banye n’ụgbọ mmiri, buru ya ụzọ gaa n’ofe nke ọzọ n’ebe Betsaida dị[a], ruo mgbe ya onwe ya ga-eziga igwe mmadụ ahụ ka ha laa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “gaa Betsaida.” Preposition Grik a pụrụ igosi ntụziaka n’ozuzu ya (“n’ebe Betsaida dị”) ma ọ bụ ebe a na-aga kpọmkwem (“gaa Betsaida”).
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ bụ “ruo mgbe ọ na-eziga igwe mmadụ ahụ ka ha laa,” ebe e ji ngwaa nke oge ugbu a mee ihe n’ahịrịokwu na-egosi oge. N’Igbo, “ga-eziga” na-ada nke ọma n’usoro akụkọ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Ozugbo ahụ
  rationale: Nke a na-egosipụta ngwa ngwa na ọsọ akụkọ Mak n’asụsụ Igbo doro anya.
- source_word: ἠνάγκασεν
  choice: ọ manyere
  rationale: “Manyere” na-echekwa echiche nke nrụgide siri ike ma ọ bụ ime ka mmadụ mee ihe, n’ebughị ụzọ kwuo na e ji ike anụ ahụ mee ya.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka μαθηταί, ma na-echekwa mmekọrịta onye nkuzi na ndị na-amụ n’aka ya.
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: ka ha banye n’ụgbọ mmiri
  rationale: Ọ bụ ụzọ Igbo kwụ ọtọ na nke ebumpụta ụwa isi kwuo ịbanye n’ụgbọ mmiri.
- source_word: προάγειν
  choice: buru ya ụzọ gaa
  rationale: Nke a na-egosi na ndị na-eso ụzọ ga-aga n’ihu tupu Jizọs, ọ bụghị naanị na ha ga-aga.
- source_word: εἰς τὸ πέραν
  choice: gaa n’ofe nke ọzọ
  rationale: Nkebiokwu a na-ezo aka n’ịgafe ọdọ mmiri gaa n’akụkụ nke ọzọ.
- source_word: πρὸς Βηθσαϊδάν
  choice: chee ihu na Betseida
  rationale: Nke a na-echekwa nghọta ntụziaka nke πρός—ịga n’ebe Betseida dị—na-ekwughị hoo haa na ọ bụ ebe ikpeazụ ha ga-eru.
- source_word: ἕως
  choice: ruo mgbe
  rationale: Ọ na-egosi oke oge metụtara ọpụpụ ndị na-eso ụzọ na ihe Jizọs ga-eme.
- source_word: αὐτὸς
  choice: ya onwe ya
  rationale: 'Nke a na-echekwa nkwusi ike dị na nnọchiaha Grik ahụ: Jizọs n’onwe ya ga-anọ ziga igwe mmadụ ahụ.'
- source_word: ἀπολύει
  choice: ga-ezilaga
  rationale: Ụdị ugbu a dị na Grik nọ n’ahịrịokwu oge; ụdị ọdịnihu a na-ada nke ọma n’Igbo mgbe ọ gbasoro “ruo mgbe,” ma na-egosi iziga igwe mmadụ ahụ ka ha laa.
- source_word: τὸν ὄχλον
  choice: igwe mmadụ ahụ
  rationale: Nke a bụ okwu Igbo doro anya ma dị ugbu a maka ìgwè mmadụ gbakọtara.
