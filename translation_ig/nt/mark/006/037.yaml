id: MRK.6.37
reference: Mark 6:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: ig
  text: Ma ọ zara ha sị, “Unu onwe unu nye ha ihe ha ga-eri.” Ha wee sị ya, “Ànyị ga-aga zụta achịcha[a] ndị ga-efu narị denarị abụọ, nye ha ka ha rie?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “zụta ogbe achịcha ndị ga-efu narị denarị abụọ.” Okwu Grik bụ ἄρτους, nke nwere ike ịpụta “achịcha” ma ọ bụ “ogbe achịcha.”
    reason: lexical_alternative
  - marker: b
    text: Otu denarị bụ ụgwọ ọrụ a na-akwụkarị onye ọrụ ma ọ bụ onye agha maka otu ụbọchị.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ọ zara ha sị
  rationale: Nke a na-edobe njikọ okwu abụọ ahụ n’asụsụ Grik, ma bụrụkwa ụzọ e si ekwu ya n’Igbo nke ọma.
- source_word: Δότε
  choice: nye
  rationale: Ọ bụ iwu kpọmkwem nke na-edobe ihe δίδωμι pụtara n’enweghị ịgbasa ya.
- source_word: ὑμεῖς
  choice: unu onwe unu
  rationale: Nnọchiaha ahụ e dere n’ụzọ pụtara ìhè na-enye iwu ahụ ike pụrụ iche; “unu onwe unu” na-egosipụta nkwusi ike ahụ.
- source_word: φαγεῖν
  choice: ihe ha ga-eri
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya si kwuo echiche nke inye mmadụ ihe ọ ga-eri.
- source_word: Ἀπελθόντες
  choice: ga-aga
  rationale: N’ime ajụjụ a, participle ahụ na-ejikọta n'ụzọ ebumpụta ụwa na ngwaa ịzụta dị ka “gaa zụta,” kama ịsụgharị ya n’usoro siri ike.
- source_word: ἀγοράσωμεν
  choice: Ànyị ga-... zụta
  rationale: Ajụjụ a na-egosi deliberative subjunctive—ha na-ajụ ma nke ahụ ọ bụ ihe ha kwesịrị ime—ma usoro a bụ nke ebumpụta ụwa n’Igbo.
- source_word: δηναρίων διακοσίων
  choice: ndị ga-efu narị denarị abụọ
  rationale: Genitive ahụ na-egosi ọnụ ahịa; “ga-efu” na-eme ka nke a doo anya n’Igbo ma ghara ịkọwa ya karịa ihe ederede kwuru.
- source_word: ἄρτους
  choice: achịcha
  rationale: “Achịcha” nwere ike izo aka n’achịcha dịka nri n’ozuzu; ndetu ala na-echekwa echiche ọzọ nke ogbe achịcha dị iche iche.
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: nye ha ka ha rie
  rationale: Nke a na-edobe ngwaa “nye” dịka n’iwu Jizọs, ma na-ada ka Igbo nkịtị.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E tinyere nkwusi ike nke ὑμεῖς dịka “unu onwe unu,” ma chekwaa ajụjụ ndị na-eso ụzọ ahụ n’enweghị ime ka ebumnuche ma ọ bụ ụda olu ha bụrụ nke doro anya karịa ihe Grik gosiri.
