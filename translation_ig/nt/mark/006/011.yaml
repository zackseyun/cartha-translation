  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: ig
  text: Ma ebe ọ bụla a na-anabataghị unu ma ọ bụ na-egeghị unu ntị, mgbe unu na-apụ n’ebe ahụ, kụpụnụ ájá dị n’okpuru ụkwụ unu[b] ka ọ bụrụ ihe akaebe nye ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka ọ bụrụ ihe akaebe megide ha.” Okwu Grik ahụ pụtara kpọmkwem, “ka ọ bụrụ ihe akaebe nye ha”; ma ihe gbara ya gburugburu pụrụ igosi na akaebe ahụ bụ megide ndị jụrụ ozi ahụ.
    reason: alternative_reading
  - marker: b
    text: Ịkụpụ ájá n’ụkwụ bụ omume ihe atụ nke na-egosi na mmadụ kewapụrụ onwe ya n’ebe ndị jụrụ ozi ahụ nọ, ma bụrụkwa ịdọ ha aka ná ntị.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: ebe ọ bụla
  rationale: Nke a na-egosipụta echiche izugbe na nke a na-akọwaghị kpọmkwem, ma na-edobekwa aha τόπος, ‘ebe.’
- source_word: μὴ δέξηται ὑμᾶς
  choice: a na-anabataghị unu
  rationale: Ụdị okwu a na-asụkarị n’Igbo na-egosi na ndị nọ n’ebe ahụ ajụghị ịnabata ndị ozi, n’agbanyeghị na Grik ji ‘ebe’ mee isiokwu n’ụzọ nnọchianya.
- source_word: μηδὲ ἀκούσωσιν ὑμῶν
  choice: ma ọ bụ na-egeghị unu ntị
  rationale: ‘Ige ntị’ na-egosi ịnụrụ ihe ndị ozi kwuru ma lebara ya anya, kama ịbụ naanị ịnụ ụda.
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: mgbe unu si n’ebe ahụ na-apụ
  rationale: Nke a na-ewere participle ahụ dị ka nke na-egosi oge, ma na-edobe echiche nke isi n’ebe ahụ pụọ.
- source_word: ἐκτινάξατε
  choice: kụpụnụ
  rationale: Okwu a na-enye iwu ka ha mee ka ájá pụọ n’ụkwụ ha site n’ịkụ ya; ọ bụ okwu dị mkpirikpi ma doo anya n’Igbo.
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: ájá dị n’okpuru ụkwụ unu
  rationale: Nsụgharị a na-edobe ‘ájá’ na ọnọdụ ya ‘n’okpuru ụkwụ unu’ dịka okwu Grik si dị.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ka ọ bụrụ ihe akaebe megide ha
  rationale: N’ọnọdụ a, omume ahụ na-agba akaebe megide ndị jụrụ ndị ozi na ozi ha. E debere nsụgharị nkịtị karị, ‘nye ha,’ n’ala ala peeji n’ihi na αὐτοῖς n’onwe ya apụtaghị ‘megide’ kpọmkwem.
theological_decisions:
- issue: Ike okwu omume ịkụpụ ájá nwere
  choice: Ihe akaebe megide ndị jụrụ ndị ozi
  alternative: Ihe akaebe nye ha, ma ọ bụ ihe àmà nye ha
  rationale: Ọnọdụ nke ịjụ ndị ozi na-eme ka echiche nke ịgba akaebe megide ha bụrụ nke dabara adaba. Ma εἰς μαρτύριον αὐτοῖς ka nwere ike ịsụgharị n’ụzọ na-akọwaghị ma akaebe ahụ ọ bụ megide ha, ya mere e chekwara nhọrọ ahụ n’ala ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu a na-asụkarị n’Igbo, ma e chekwara ihe ndị bụ isi n’usoro Grik na nghọtahie nwere ike ịdị n’okwu ikpeazụ.
