  to: Ma ebe ọ bụla a na-anabataghị unu ma ọ bụ na-egeghị unu ntị, mgbe unu na-apụ n’ebe ahụ, kụpụnụ ájá dị n’okpuru ụkwụ unu[b] ka ọ bụrụ ihe akaebe nye ha.[a]
  rationale: The revision preserves the grammatical openness of εἰς μαρτύριον αὐτοῖς in the main text by using “nye ha.” The plausible contextual sense “megide ha” is retained in an anchored footnote. A minor wording adjustment improves natural modern Standard Igbo.
