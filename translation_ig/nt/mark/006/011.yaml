review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the indefinite reference to any place, non-reception, refusal to listen, departure, and the commanded dust-shaking action. However, rendering εἰς μαρτύριον αὐτοῖς as “ihe akaebe megide ha” in the main text adds an adversative force not expressed explicitly by αὐτοῖς. The context can support that implication, but the Greek wording is formally and genuinely open enough that the main text should retain “nye ha,” with the adverse contextual reading in a footnote.
  naturalness: The Igbo is generally clear, idiomatic, and suitably dignified. “Mgbe unu na-apụ n’ebe ahụ” is slightly smoother than “mgbe unu si n’ebe ahụ na-apụ,” while retaining the temporal force of the participle.
  terminology: “Ịnabata,” “ige ntị,” “kụpụ ájá,” and “ihe akaebe” are appropriate Standard Igbo choices. The revised footnote retains “megide ha” as a contextually possible interpretation without making that interpretation the only reading of the verse.
  issues:
  - severity: medium
    issue: The main text resolves εἰς μαρτύριον αὐτοῖς as explicitly adversative (“megide ha”).
    rationale: The dative αὐτοῖς most directly permits “nye ha/to them.” Although the symbolic context may imply adverse testimony, that implication should not be imposed in the main rendering where the Greek leaves it unstated.
  - severity: low
    issue: The departure clause can be made more natural in Standard Igbo.
    rationale: “Mgbe unu na-apụ n’ebe ahụ” is more direct and natural than “mgbe unu si n’ebe ahụ na-apụ,” without changing the temporal or circumstantial sense.
  revised_text: Ma ebe ọ bụla a na-anabataghị unu ma ọ bụ na-egeghị unu ntị, mgbe unu na-apụ n’ebe ahụ, kụpụnụ ájá dị n’okpuru ụkwụ unu[b] ka ọ bụrụ ihe akaebe nye ha.[a]
