id: MRK.6.15
reference: Mark 6:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: ig
  text: Ma ndị ọzọ nọ na-ekwu, “Ọ bụ Ịlaịja,” ebe ndị ọzọ nọkwa na-ekwu, “Ọ bụ onye amụma, dịka otu n’ime ndị amụma.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: Ma ndị ọzọ
  rationale: ἄλλοι na-egosi ìgwè ọzọ n’etiti ndị na-ekwu banyere Jizọs, ebe δέ na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche; “Ma ndị ọzọ” na-egosipụta nke a n’Igbo n’ụzọ doro anya.
- source_word: ἔλεγον
  choice: nọ na-ekwu
  rationale: Ụdị imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwu ugboro ugboro; “nọ na-ekwu” na-echekwa echiche ahụ n’Igbo nkịtị.
- source_word: ὅτι Ἠλίας ἐστίν
  choice: “Ọ bụ Ịlaịja,”
  rationale: E ji okwu e kwuru kpọmkwem mee ka akụkọ ahụ bụrụ nke Igbo na-asụkarị, ebe a sụgharịrị aha Ἠλίας dịka “Ịlaịja.”
- source_word: προφήτης
  choice: onye amụma
  rationale: N’ebe a, aha a enweghị article ma okwu na-esote ya jiri ya tụnyere otu n’ime ndị amụma; ya mere ọ na-egosi otu onye amụma, ọ bụghị utu aha pụrụ iche “Onye Amụma ahụ.” Igbo achọghị article dịka Bekee.
- source_word: ὡς εἷς τῶν προφητῶν
  choice: dịka otu n’ime ndị amụma
  rationale: ὡς na-egosi ntụnyere, ebe εἷς τῶν προφητῶν pụtara otu onye so n’etiti ndị amụma; nsụgharị a na-echekwa ma ntụnyere ahụ ma echiche nke ịbụ otu n’ime ha.
theological_decisions:
- issue: Ma προφήτης ọ̀ bụ naanị “onye amụma” ka ọ bụ utu aha pụrụ iche “Onye Amụma ahụ”
  choice: onye amụma
  alternative: Onye Amụma ahụ
  rationale: Greek enweghị article, ma nkebi na-esote—“dịka otu n’ime ndị amụma”—na-akwado nghọta izugbe. N’ihi ya, ederede bụ isi na-eji “onye amụma” eme ihe n’enweghị ịmanye echiche banyere otu onye e buru n’amụma pụrụ iche.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị mfe nghọta ma nwee ugwu kwesịrị ederede Akwụkwọ Nsọ. E ji “nọ na-ekwu” chekwaa omume na-aga n’ihu nke imperfect, ma zere okwu ụka nke otu òtù pụrụ iche.
