  yaml_path: translation/nt/mark/006/051.yaml
  text: And he got into the boat with them[a], and the wind stopped. And they were utterly astonished within themselves[b],
translation:
  language: ig
  text: Ọ banyere n’ụgbọ ahụ n’ebe ha nọ, ifufe ahụ wee kwụsị. Ha wee ju anya nke ukwuu n’ime onwe ha.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya, “Ha ju anya gabiga ókè.” N’asụsụ Grik, e jikọtara okwu nkwusi ike iji mesie oke ijuanya ha ike: “nke ukwuu karịa ókè.”'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ha tụrụ nnọọ n’anya.” Okwu Grik ahụ na-egosi ijuanya siri ike nke ukwuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: banye
  rationale: N’agbanyeghị na okwu Grik a pụtara n’ụzọ nkịtị ‘rigoro,’ mgbe ọ na-eso εἰς τὸ πλοῖον n’akụkọ a, ọ pụtara ịbanye n’ụgbọ.
- source_word: πρὸς αὐτοὺς
  choice: ka ya na ha nọrọ
  rationale: Nke a na-egosipụta na ọ banyere n’ụgbọ wee nọnyere ha; ọ bụ Igbo nkịtị ma na-echekwa echiche nke ịbịaru ha nso.
- source_word: πλοῖον
  choice: ụgbọ
  rationale: ‘Ụgbọ’ bụ okwu Igbo doro anya ma kwesị ekwesị maka ụgbọ e ji aga n’elu mmiri n’akụkọ a.
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: ifufe ahụ wee kwụsị
  rationale: κοπάζω na-ekwu maka ifufe ịda jụụ ma ọ bụ ịkwụsị; ‘kwụsị’ na-egosipụta ya nke ọma n’Igbo nke oge a.
- source_word: λίαν ἐκ περισσοῦ
  choice: nke ukwuu
  rationale: Ngwakọta okwu Grik a na-emesi oke mmetụta ha ike. ‘Nke ukwuu’ bụ okwu Igbo dị mfe ma sie ike, ebe nkọwa ala peeji na-egosi otú Grik si kpokọta okwu nkwusi ike.
- source_word: ἐν ἑαυτοῖς
  choice: n’ime obi ha
  rationale: N’Igbo, ‘n’ime obi ha’ na-egosipụta nke ọma na mmeghachi omume ahụ mere n’ime ha, ọ bụghị naanị ihe ha gosipụtara n’èzí.
- source_word: ἐξίσταντο
  choice: O jukwara ha anya
  rationale: Ụdị okwu a nwere ike ịpụta iju mmadụ anya nke ukwuu ma ọ bụ ime ka uche ghara ịdị ya mma. Nhọrọ a bụ Igbo nkịtị ma na-echekwa isi mmetụta ahụ.
theological_decisions:
- issue: Ike nke mmeghachi omume ndị na-eso ụzọ ahụ n’ebe ihe Jizọs mere dị
  choice: O jukwara ha anya nke ukwuu n’ime obi ha
  alternative: Ha nọ n’akụkụ onwe ha n’ihi oke ijuanya
  rationale: Nsụgharị ahụ na-echekwa oke ijuanya ha n’enweghị ịgbakwụnye nkọwa banyere onye Jizọs bụ nke amaokwu ahụ n’onwe ya na-ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘n’ime obi ha’ kama nsụgharị mkpụrụokwu ‘n’ime onwe ha’ n’ihi na ọ na-ada ka Igbo nkịtị ma na-echekwa echiche nke mmeghachi omume dị n’ime mmadụ. Akara nkọwa [a] na [b] dị n’ahịrị isi.
