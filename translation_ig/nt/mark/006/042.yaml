  text: And they all ate and were satisfied.
translation:
  language: ig
  text: Ha niile riri nri, afọ jukwara ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: rie nri
  rationale: Ụdị a bụ aorist active nke ἐσθίω, ngwaa nkịtị pụtara iri. N'Igbo, “rie nri” bụ ụzọ ebumpụta ụwa e si kwuo ya; “nri” na-arụ ọrụ dị ka mmeju ngwaa a na-ejikarị eme ihe, ọ naghịkwa etinye echiche nke iriju afọ nke ngwaa na-esote kwuru.
- source_word: πάντες
  choice: Ha niile
  rationale: Adjective plural a ji dịka aha na-ezo aka n'ìgwè mmadụ ahụ dum. “Ha niile” na-eme ka onye a na-ekwu maka ya doo anya ma na-echekwa echiche nke mmadụ niile.
- source_word: ἐχορτάσθησαν
  choice: rijukwa afọ
  rationale: χορτάζω n'ebe a pụtara na e nyere ha nri ruo mgbe afọ juru ha. “Rijukwa afọ” bụ okwu Igbo doro anya ma bụrụ nke ebumpụta ụwa maka afọ ojuju sitere n'iri nri.
- source_word: καὶ ... καὶ
  choice: wee ... -kwa
  rationale: καί abụọ ahụ jikọtara omume abụọ ahụ n'ụzọ kwụ ọtọ. “wee” na-ebuga akụkọ ahụ n'ihu, ebe “-kwa” na-egosi omume nke abụọ na-esochi nke mbụ, n'Igbo dị ire ụtọ.
