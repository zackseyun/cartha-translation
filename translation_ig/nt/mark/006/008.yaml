  text: καὶ παρήγγειλεν αὐτοῖς ἵνα μηδὲν αἴρωσιν εἰς ὁδὸν εἰ μὴ ῥάβδον μόνον, μὴ ⸂ἄρτον, μὴ πήραν⸃, μὴ εἰς τὴν ζώνην χαλκόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/008.yaml
  text: And he instructed them to take nothing for the journey except a staff only—no bread[a], no bag[b], no copper in their belt—
translation:
  language: ig
  text: O nyere ha iwu ka ha ghara iwere ihe ọ bụla maka njem, ma e wezụga naanị mkpara—ọ bụghị achịcha, ọ bụghị akpa[a], ọ bụghịkwa ọla kọpa n’eriri úkwù ha[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, akpa onye njem ji ebu ihe oriri.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, ‘ọla kọpa’; ya bụ, mkpụrụ ego ọla kọpa ma ọ bụ ego a na-edebe n’eriri úkwù.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: nyere ha iwu
  rationale: Okwu a na-egosi ntụziaka nwere ikike; ‘nyere ha iwu’ bụ Igbo doro anya ma na-echekwa ike dị n’okwu Grik ahụ.
- source_word: μηδὲν αἴρωσιν
  choice: ka ha ghara iwere ihe ọ bụla
  rationale: N’ọnọdụ nkwadebe njem, αἴρω pụtara iwere ma ọ bụ iburu ihe; ntụgharị a bụ nke ebumpụta ụwa n’Igbo.
- source_word: εἰς ὁδὸν
  choice: maka njem ahụ
  rationale: Nkebiokwu a na-ekwu maka ihe a ga-ewere maka njem, ọ bụghị naanị okporo ụzọ n’onwe ya.
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: ma e wezụga naanị mkpara
  rationale: ‘Mkpara’ na-egosi mkpara onye njem, ebe ‘naanị’ na-echekwa nkwusi ike nke μόνον.
- source_word: ἄρτον
  choice: achịcha
  rationale: A hapụrụ okwu ahụ dịka ihe kpọmkwem Grik kwuru, kama ịgbasa ya ka ọ bụrụ nri niile.
- source_word: πήραν
  choice: akpa
  rationale: πήρα bụ akpa onye njem ji ebu ihe oriri ma ọ bụ ihe ndị ọzọ; ‘akpa’ bụ okwu Igbo dị mfe ma doo anya, ebe nkọwa ala peeji na-eme ka ụdị akpa ahụ pụta ìhè.
- source_word: ζώνην
  choice: eriri ukwu
  rationale: Ọ bụ ihe a na-eke n’úkwù, nke nwekwara ike ịbụ ebe a na-edebe mkpụrụ ego.
- source_word: χαλκόν
  choice: ọla kọpa
  rationale: A na-echekwa ihe okwu Grik pụtara kpọmkwem; n’ebe a ọ na-anọchi anya mkpụrụ ego ọla kọpa, dịka nkọwa ala peeji si kọwaa.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ usoro mmachibido iwu ugboro atọ ka ike na ụda nke Grik pụta ìhè. E debere akara nkọwa [a] n’akụkụ ‘akpa’ na [b] n’akụkụ ‘ọla kọpa,’ n’ihi na ọdịnaya nkọwa Bekee e nyere kwekọrọ na okwu abụọ ahụ, ọ bụghị ‘achịcha.’
