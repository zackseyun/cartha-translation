id: MRK.6.34
reference: Mark 6:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν ⸀εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ ⸀αὐτοὺς ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα, καὶ ἤρξατο διδάσκειν αὐτοὺς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: ig
  text: Mgbe o si n'ụgbọ mmiri rịdata[a], ọ hụrụ oké ìgwè mmadụ, o nwekwara ọmịiko n'ebe ha nọ, n'ihi na ha dị ka atụrụ na-enweghị onye ọzụzụ atụrụ[b]. Ọ malitere ịkụziri ha ọtụtụ ihe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ọ pụtara.”
    reason: lexical_alternative
  - marker: b
    text: Ihe atụ a, “atụrụ na-enweghị onye ọzụzụ atụrụ,” na-echetara okwu Akwụkwọ Nsọ banyere ndị na-enweghị onye ndu; tulee Ọnụ Ọgụgụ 27:17; 1 Ndị Eze 22:17; Ezikiel 34:5.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: mgbe ọ rịdata n'ụgbọ mmiri
  rationale: N'ụzọ nkịtị, okwu ahụ pụtara ‘mgbe ọ pụtara’; ma n'ọnọdụ akụkọ a, ebe Jizọs ji ụgbọ mmiri gafee, ọ na-ezo aka n'ịpụ n'ụgbọ mmiri. Nsụgharị a na-eme ka ọnọdụ ahụ doo anya n'Igbo.
- source_word: εἶδεν
  choice: ọ hụrụ
  rationale: Nke a bụ nsụgharị Igbo kwụ ọtọ ma bụrụkwa nke e ji eme ihe maka omume ịhụ mmadụ ma ọ bụ ihe.
- source_word: πολὺν ὄχλον
  choice: oké ìgwè mmadụ
  rationale: ‘Ìgwè mmadụ’ na-enye echiche nke crowd, ebe ‘oké’ na-egosipụta ịdị ukwuu nke ìgwè ahụ.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοὺς
  choice: obi ebere wee mee ya n'ebe ha nọ
  rationale: Ngwaa Grik ahụ na-egosi ọmịiko miri emi. Akpaalaokwu Igbo a bụ nke dị ndụ ma na-egosi na ọnọdụ ha metụrụ ya n'obi.
- source_word: ὅτι
  choice: n'ihi na
  rationale: Ọ na-ewebata ihe mere obi ebere ji mee Jizọs n'ebe ha nọ.
- source_word: ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: dị ka atụrụ na-enweghị onye ọzụzụ atụrụ
  rationale: A hapụrụ ihe atụ atụrụ na onye ọzụzụ atụrụ ka ọ dị, n'ebughị nkọwa ya banyere nduzi banye n'ahịrịokwu ahụ.
- source_word: ἤρξατο διδάσκειν
  choice: ọ wee malite ịkụziri
  rationale: Nke a na-echekwa echiche ingressive nke ịmalite ime ihe, ma na-ada nke ọma n'Igbo.
- source_word: αὐτοὺς πολλά
  choice: ha ọtụtụ ihe
  rationale: ‘Ọtụtụ ihe’ na-echekwa ọtụtụ ọdịnaya e kuziri ha, kama ịtụgharị ya naanị dịka ogologo oge e ji akụzi ihe.
theological_decisions:
- issue: Ihe atụ nke atụrụ na-enweghị onye ọzụzụ atụrụ
  choice: Idowe okwu ahụ dịka ‘atụrụ na-enweghị onye ọzụzụ atụrụ’ n'ahịrịokwu bụ isi.
  alternative: Ịgbasa ya dịka ‘ndị na-enweghị ezigbo onye ndu ime mmụọ.’
  rationale: Ihe atụ ahụ nwere mgbọrọgwụ n'asụsụ Akwụkwọ Nsọ banyere ndị Chineke na ndị ndu ha, ma nsụgharị ekwesịghị ịkọwa ma ọ bụ mechie nghọta ya n'ahịrịokwu bụ isi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E jigidere ihe atụ Akwụkwọ Nsọ ahụ ma zere ịgbakwunye nkọwa otu ụka. Akara ndetu [a] na [b] dị n'ahịrịokwu bụ isi.
