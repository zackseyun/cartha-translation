  to: Mgbe o si n'ụgbọ mmiri rịdata[a], ọ hụrụ oké ìgwè mmadụ, o nwekwara ọmịiko n'ebe ha nọ, n'ihi na ha dị ka atụrụ na-enweghị onye ọzụzụ atụrụ[b]. Ọ malitere ịkụziri ha ọtụtụ ihe.
