revisions:
- from: Mgbe ụbọchị Izuike bịara, ọ malitere izi ihe n'ụlọ nzukọ ndị Juu. Ọtụtụ ndị nụrụ ihe ọ na-akụzi juru anya, na-asị, “Olee ebe onye a si nweta ihe ndị a? Gịnị bụ amamihe a e nyere ya? Oleekwa banyere ọrụ ebube ndị dị ike dị otu a[a] a na-arụ site n'aka ya?”
  to: Mgbe ụbọchị Izuike bịara, ọ malitere izi ihe n'ụlọ nzukọ ndị Juu. Ọtụtụ ndị nụrụ ihe ọ na-akụzi juru anya, na-asị, “Olee ebe onye a si nweta ihe ndị a? Gịnị bụ amamihe a e nyere ya, oleekwa ọrụ ndị dị ike dị otu a[a] a na-arụ site n'aka ya?”
