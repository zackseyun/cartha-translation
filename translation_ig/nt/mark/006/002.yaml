id: MRK.6.2
reference: Mark 6:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: ig
  text: Mgbe ụbọchị Izuike bịara, ọ malitere izi ihe n'ụlọ nzukọ ndị Juu. Ọtụtụ ndị nụrụ ihe ọ na-akụzi juru anya, na-asị, “Olee ebe onye a si nweta ihe ndị a? Gịnị bụ amamihe a e nyere ya, oleekwa ọrụ ndị dị ike dị otu a[a] a na-arụ site n'aka ya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ọrụ ebube” ma ọ bụ “ngosipụta nke ike.” Okwu Grik δυνάμεις nwere ike ịpụta ọrụ ebube ma ọ bụ ihe omume ndị na-egosipụta ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: Mgbe ụbọchị Izuike bịara
  rationale: Nke a na-egosipụta ọnọdụ oge nke genitive absolute ahụ, ma na-ada ka Igbo a na-asụ ugbu a.
- source_word: ἤρξατο διδάσκειν
  choice: ọ malitere izi ihe
  rationale: Ọ na-echekwa echiche ingressive nke ἄρχομαι tinyere infinitive.
- source_word: συναγωγῇ
  choice: ụlọ nzukọ ndị Juu
  rationale: N'ọnọdụ a, okwu ahụ na-ezo aka n'ebe ndị Juu na-ezukọ maka ofufe na nkuzi; nsụgharị a doro ndị Igbo nkịtị anya.
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: Ọtụtụ ndị nụrụ ihe ọ na-akụzi
  rationale: A kọwara ihe ha nụrụ site n'ọnọdụ ahịrịokwu ahụ, nke mere ka Igbo ya bụrụ ihe doro anya ma dị mfe.
- source_word: ἐξεπλήσσοντο
  choice: juru anya
  rationale: Nke a bụ okwu Igbo sitere n'okike maka mmeghachi omume siri ike nke ịtụnanya.
- source_word: Πόθεν τούτῳ ταῦτα
  choice: Olee ebe onye a si nweta ihe ndị a?
  rationale: “Onye a” na-echekwa demonstrative τούτῳ na ntakịrị olu ịdọpụ onwe ha n'ebe Jizọs nọ, ebe “si nweta” na-egosipụta ajụjụ banyere isi mmalite.
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: Gịnị bụ amamihe a e nyere ya?
  rationale: A hapụrụ amamihe ahụ dịka ihe e nyere ya, dịka passive participle δοθεῖσα si kwuo, n'enweghị nkọwa ọzọ banyere onye nyere ya.
- source_word: δυνάμεις
  choice: ọrụ ebube ndị dị ike
  rationale: Plural δυνάμεις n'ime Mak na-ezokarị aka n'omume pụrụ iche nke na-egosipụta ike. “Ọrụ ebube ndị dị ike” na-ejigide ma omume ahụ ma echiche nke ike.
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: a na-arụ site n'aka ya
  rationale: Nke a na-echekwa idiom instrumental nke διά tinyere “aka,” nakwa ụdị passive nke γινόμεναι.
theological_decisions:
- issue: Ihe δυνάμεις pụtara n'ọnọdụ a
  choice: ọrụ ebube ndị dị ike
  alternative: ọrụ dị ike; ngosipụta nke ike
  rationale: N'akwụkwọ Mak, plural a na-ezokarị aka n'omume pụrụ iche e mere site n'ike, ma footnote na-echekwa ụzọ ndị ọzọ e nwere isi ghọta okwu Grik ahụ.
- issue: Olu demonstrative τούτῳ
  choice: onye a
  alternative: ya
  rationale: “Onye a” na-egosipụta demonstrative ahụ na olu ndị obodo ya nke nwere ike ịdị ntakịrị ka nke nlelị ma ọ bụ ịdọpụ onwe ha, n'enweghị ime ka nke ahụ sie ike karịa ihe odide Grik kwuru.
- issue: Onye nyere amamihe ahụ
  choice: e nyere ya
  alternative: Chineke nyere ya
  rationale: Ihe odide ahụ ji passive kwuo ya ma ọ kpọghị onye nyere amamihe ahụ aha; nsụgharị ahụ echekwala nghọta a na-emeghe emeghe.
translation_notes:
  register: E ji Standard Igbo nke dị ùgwù ma dị mfe nghọta mee ihe. “Ụlọ nzukọ ndị Juu” na-akọwa synagogue n'ụzọ onye Igbo nke oge a ga-aghọta ngwa ngwa. E tinyere akara footnote n'akụkụ δυνάμεις, nke bụ okwu footnote ahụ na-akọwa.
