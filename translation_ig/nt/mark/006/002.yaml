    text: A pụkwara ịsụgharị ya “ọrụ ebube” ma ọ bụ “ngosipụta nke ike.” Okwu Grik δυνάμεις nwere ike ịpụta ọrụ ebube ma ọ bụ ihe omume ndị na-egosipụta ike.
    reason: lexical_alternative
