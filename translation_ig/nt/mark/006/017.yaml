source:
  edition: SBLGNT
  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: ig
  text: N’ihi na Herọd n’onwe ya zipụrụ ka e jide Jọn[a], kee ya agbụ n’ụlọ mkpọrọ n’ihi Herodias, nwunye Filip, nwanne Herọd, n’ihi na Herọd lụrụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “zipụrụ ndị mmadụ ka ha jide Jọn.” N’asụsụ Grik, okwu a sụgharịrị “zipụrụ” so okwu ndị bụ isi pụtara “jidere” na “kere agbụ”; nke a na-egosi na Herọd bụ onye kpatara ka e jide Jọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: N’ihi na Herọd n’onwe ya
  rationale: “N’onwe ya” na-echekwa nkwusiri ike dị na Αὐτὸς, ebe “N’ihi na” na-egosi na amaokwu a na-akọwa ihe e kwuru tupu ya.
- source_word: ἀποστείλας ἐκράτησεν
  choice: zipụrụ ka e jide
  rationale: Nke a na-egosi na Herọd bụ onye nyere iwu ma mee ka e jide Jọn, n’enweghị ịgbakwunye kpọmkwem ndị o zipụrụ, ndị ederede Grik na-akpọghị aha.
- source_word: τὸν Ἰωάννην
  choice: Jọn
  rationale: Nke a bụ ụdị aha ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: ἔδησεν αὐτὸν ἐν φυλακῇ
  choice: kee ya agbụ n’ụlọ mkpọrọ
  rationale: “Kee ya agbụ” na-echekwa ihe δέω pụtara n’ụzọ doro anya, ebe “n’ụlọ mkpọrọ” na-enye ebe e ji ya mee ihe n’enweghị ịkọwa ụdị agbụ a na-ekwughị.
- source_word: διὰ Ἡρῳδιάδα
  choice: n’ihi Herodias
  rationale: διά na accusative ebe a na-egosi ihe kpatara omume ahụ.
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: nwunye Filip, nwanne Herọd
  rationale: “Nwunye” bụ ihe γυνή pụtara n’ebe a. Ikwughachi “Herọd” na-eme ka o doo anya na Filip bụ nwanne Herọd, ghara ịhapụ nnọchiaha Igbo ka ọ bụrụ ihe mgbagwoju anya.
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: n’ihi na Herọd lụrụ ya
  rationale: Aha “Herọd” mere ka onye mere alụmdi na nwunye ahụ doo anya. Oge gara aga dị mfe bụ ụzọ Igbo si ekwu ihe mere tupu mkpọrọ ahụ n’ụzọ dị mma, ebe usoro akụkọ na-egosi mmekọrịta oge ahụ.
theological_decisions:
- issue: Otú e si akọ ihe mere Herọd ji tụọ Jọn mkpọrọ
  choice: A kọwara ihe mere eme na ihe kpatara ya n’enweghị itinye ikpe omume ọzọ n’amaokwu a.
  alternative: Ịkpọ alụmdi na nwunye ahụ ihe iwu na-akwadoghị n’ime amaokwu a.
  rationale: Amaokwu a n’onwe ya na-ekwu naanị na ihe ahụ mere n’ihi Herodias na n’ihi na Herọd lụrụ ya; amaokwu ndị gbara ya gburugburu ka na-akọwa nsogbu omume na iwu dị na ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. Ahịrịokwu ahụ na-echekwa usoro nkọwa na ihe kpatara ihe dị n’asụsụ Grik, ma na-eme ka ọrụ Herọd na njikọ Filip na Herọd doo anya.
