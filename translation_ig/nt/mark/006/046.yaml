  text: καὶ ἀποταξάμενος αὐτοῖς ἀπῆλθεν εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: ig
  text: Mgbe ọ sịrị ha ka ha laa nke ọma[a], ọ gawara ugwu ahụ ikpe ekpere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ọ hapụsịrị ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποταξάμενος
  choice: mgbe o kwusịrị ha nọdụ nke ọma
  rationale: Ngwaa a n’ụdị etiti pụtara ịrịọ mmadụ ka ọ nọdụ nke ọma ma ọ bụ ịsị ya ka ọ gaa nke ọma. Nke a bụ okwu Igbo dị ugbu a ma dabara na αὐτοῖς.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha a bụ nke ọtụtụ n’ọnọdụ dative; e jikọtara ya n’ụzọ ebumpụta ụwa n’okwu ‘kwusịrị ha nọdụ nke ọma.’
- source_word: ἀπῆλθεν
  choice: ọ gara
  rationale: Ọ na-egosi na ọ hapụrụ ndị ahụ gaa ebe ọzọ; n’Igbo, ‘ọ gara’ na-eburu echiche ahụ nke ọma n’usoro akụkọ a.
- source_word: εἰς τὸ ὄρος
  choice: n’elu ugwu ahụ
  rationale: ὄρος nwere ike ịbụ ugwu ma ọ bụ ala ugwu. Edemede Grik ahụ ji article, ya mere ‘ugwu ahụ’ na-echekwa nkọwa doro anya ahụ n’etinyeghị ihe atụ ime mmụọ.
- source_word: προσεύξασθαι
  choice: ikpe ekpere
  rationale: 'Infinitive a na-egosi nzube ọ gara: ikpe ekpere.'
- source_word: καὶ
  choice: Mgbe
  rationale: N’Igbo, ịmalite ahịrịokwu site n’ahịrịokwu oge nke participle ahụ na-eme ka akụkọ ahụ gaa nke ọma; njikọ καὶ ka dị n’usoro njikọ ihe omume ndị ahụ.
theological_decisions:
- issue: Ihe ‘ugwu ahụ’ na-ezo aka na ya
  choice: A sụgharịrị ya ‘ugwu ahụ’ n’enweghị ịgbakwunye ihe ọ bụla gbasara ihe atụ ma ọ bụ ihe omimi.
  alternative: ‘otu ugwu’ ma ọ bụ ịkọwa ya dị ka ebe mkpughe pụrụ iche
  rationale: Grik ji article ma ọ kọwaghị na ugwu ahụ nwere ihe ọ pụtara n’ụzọ ime mmụọ. Nsụgharị ahụ kwesịrị idobe nkọwa akụkọ ahụ n’etinyeghị ozizi na-adịghị n’ederede.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ùgwù. ‘Kwusịrị ha nọdụ nke ọma’ bụ ụzọ ebumpụta ụwa e si egosi ịsị mmadụ ka ọ gaa nke ọma; ihe e dere n’ala ala peeji na-echekwa ụzọ ọzọ nke na-adịtụ nso n’usoro okwu Grik.
