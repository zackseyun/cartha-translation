  to: Mgbe ọ sịrị ha ka ha laa nke ọma[a], ọ gawara ugwu ahụ ikpe ekpere.
  rationale: The farewell expression has been corrected to convey taking leave of the people. The movement phrase has been revised to avoid implying that Jesus went onto the summit rather than to the mountain. The footnote retains a viable, though somewhat broader, alternative for the participle.
