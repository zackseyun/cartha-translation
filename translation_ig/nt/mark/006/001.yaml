source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: ig
  text: Ọ si ebe ahụ pụọ gaa n’obodo ya[a], ndị na-eso ụzọ ya soro ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ si ebe ahụ pụọ, ọ na-abịa n’obodo ya, ndị na-eso ụzọ ya na-esokwa ya.” Asụsụ Grik ji ngwaa oge ugbu a kọọ ihe mere n’oge gara aga iji mee ka akụkọ ahụ yie ihe na-eme n’ihu onye na-agụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: Ọ hapụrụ
  rationale: Aorist nke ἐξέρχομαι na-egosi na ọ si n’ebe ọ nọ pụọ. “Hapụrụ” bụ ụzọ Igbo dị mfe ma kwekọọ n’akụkọ a.
- source_word: ἐκεῖθεν
  choice: ebe ahụ
  rationale: Ọ na-egosi ebe o si pụọ; n’usoro “hapụrụ ebe ahụ,” echiche “site n’ebe ahụ” pụtara nke ọma n’Igbo.
- source_word: ἔρχεται
  choice: gaa
  rationale: Ọ bụ historical present n’asụsụ Grik, ma a gbanwere ya ka ọ bụrụ usoro oge gara aga nke dabara n’akụkọ Igbo. “Gaa” na-egosi ngagharị ruo ebe a na-aga n’enweghị ịmanye echiche onye na-akọ akụkọ.
- source_word: πατρίδα
  choice: obodo ya
  rationale: N’ebe a πατρίς na-ezo aka n’obodo Jizọs, ya bụ ebe o si. “Obodo ya” bụ okwu Igbo dị ndụ ma ghara ịgbasa ya ka ọ bụrụ mba dum.
- source_word: ἀκολουθοῦσιν
  choice: ndị na-eso ụzọ ya sokwa ya
  rationale: “Soro” na-echekwa ma omume iso mmadụ aga ma njikọ ya na aha ndị na-eso ụzọ; “-kwa” na-egosipụta na ha sonyere ya.
- source_word: μαθηταὶ
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-anabata nke ọma maka μαθηταί, na-egosikwa ndị na-amụta ihe n’aka onye nkụzi ma na-eso ya.
theological_decisions:
- issue: Nsụgharị historical presents (ἔρχεται, ἀκολουθοῦσιν)
  choice: 'E ji usoro oge gara aga kwekọrọ n’akụkọ Igbo: “gaa” na “sokwa.”'
  alternative: 'Idowe ụdị ugbu a: “na-aga ... na-esokwa.”'
  rationale: Nke a bụ mkpebi gbasara usoro akụkọ, ọ bụghị ozizi. Ụdị oge gara aga na-ada nke ọma n’Igbo, ebe nkọwa ala ala na-edobe nhọrọ Grik nke na-eme ka akụkọ dị ka ihe na-eme ugbu a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee nsọpụrụ. “Obodo ya” bụ okwu a na-aghọta ngwa ngwa maka ebe onye si; e zere “ala nna ya” n’ihi na ọ pụrụ ịpụta mpaghara ma ọ bụ mba sara mbara karịa ihe okwu a pụtara n’ebe a.
