revisions:
- from: Ha nọkwa na-achụpụ ọtụtụ ndị mmụọ ọjọọ, na-etekwa ọtụtụ ndị ọrịa mmanụ[a], na-agwọkwa ha.
  to: Ha na-achụpụ ọtụtụ mmụọ ọjọọ, na-ete ọtụtụ ndị ọrịa mmanụ[a], na-agwọkwa ha.
  rationale: The revision removes the potentially person-marking “ndị” before “mmụọ ọjọọ” and uses smoother Standard Igbo progressive coordination. It preserves the source’s repeated/ongoing narrative actions, the quantity “many,” the sequence of anointing with oil and healing, and the theological neutrality of the source.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:46Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the three coordinated actions, the plural quantity, the oil, and the healing. However, “ndị mmụọ ọjọọ” can suggest a class of persons/people in Igbo; the unmarked plural “mmụọ ọjọọ” is a more direct rendering of δαιμόνια. The progressive construction can retain the Greek imperfective narrative summary without the heavier “nọkwa na-” construction.
  naturalness: “Ha nọkwa na-achụpụ” is grammatically understandable but less idiomatic and unnecessarily weighty in this concise narrative. “Ha na-achụpụ” is natural Standard Igbo. “Na-ete ọtụtụ ndị ọrịa mmanụ” is also smoother than “na-etekwa ọtụtụ ndị ọrịa mmanụ” while preserving the coordination.
  terminology: “Mmụọ ọjọọ,” “ndị ọrịa,” “mmanụ,” and “gwọọ” are suitable Standard Igbo terms. The wording does not assign a sacramental or mechanical role to the oil. The lexical-alternative footnote for olive oil is appropriate.
  issues:
  - severity: medium
    issue: Use of “ndị” in “ọtụtụ ndị mmụọ ọjọọ.”
    rationale: Although understandable, “ndị” commonly marks human persons or a people-group. Since δαιμόνια denotes demons/evil spirits, “ọtụtụ mmụọ ọjọọ” is more precise and natural.
  - severity: low
    issue: Heavy progressive phrasing “Ha nọkwa na-achụpụ.”
    rationale: The Greek imperfect permits repeated or ongoing action, but simple “Ha na-achụpụ” expresses this naturally in Igbo and avoids adding the marked continuative nuance of “nọ na-.”
  revised_text: Ha na-achụpụ ọtụtụ mmụọ ọjọọ, na-ete ọtụtụ ndị ọrịa mmanụ[a], na-agwọkwa ha.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “mmanụ oliv.”
    reason: lexical_alternative
  revision_rationale: The revision removes the potentially person-marking “ndị” before “mmụọ ọjọọ” and uses smoother Standard Igbo progressive coordination. It preserves the source’s repeated/ongoing narrative actions, the quantity “many,” the sequence of anointing with oil and healing, and the theological neutrality of the source.
