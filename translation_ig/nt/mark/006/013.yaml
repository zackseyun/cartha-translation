  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: ig
  text: Ha na-achụpụ ọtụtụ mmụọ ọjọọ, na-ete ọtụtụ ndị ọrịa mmanụ[a], na-agwọkwa ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmanụ oliv.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δαιμόνια
  choice: ndị mmụọ ọjọọ
  rationale: Ọ bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa mmụọ ọjọọ; ọ naghị ebubata okwu ọzọ dị ka “mmụọ na-adịghị ọcha,” nke na-anọghị n'amaokwu a.
- source_word: πολλὰ
  choice: ọtụtụ
  rationale: Ọ na-egosi ọnụ ọgụgụ buru ibu n'ụzọ dị mfe, dịka okwu Grik ahụ si dị.
- source_word: ἐξέβαλλον
  choice: nọ ... na-achụpụ
  rationale: Ụdị a na-egosi omume ha nọgidere na-eme ma ọ bụ mee ugboro ugboro, kwekọrọ n'ụdị imperfect nke Grik.
- source_word: ἤλειφον
  choice: na-etekwa ... mmanụ
  rationale: “Ite mmadụ mmanụ” bụ ụzọ Igbo dị mfe ma kwekọọ n'omume ịwụsa ma ọ bụ ịsa mmanụ n'ahụ mmadụ; usoro ngwaa ahụ na-echekwa omume na-aga n'ihu ma ọ bụ ugboro ugboro.
- source_word: ἐλαίῳ
  choice: mmanụ
  rationale: Okwu Grik ahụ pụtara mmanụ, nke na-abụkarị mmanụ oliv n'oge na ebe ahụ; “mmanụ” zuru oke n'ahịrị isi, ebe nkọwa ala peeji na-egosi nkọwa kpọmkwem karị.
- source_word: ἀρρώστους
  choice: ndị ọrịa
  rationale: Nke a bụ okwu Igbo nkịtị, doro anya, maka ndị na-arịa ọrịa.
- source_word: ἐθεράπευον
  choice: na-agwọkwa ha
  rationale: Ọ na-ezo aka n'ịgwọ ndị ọrịa ahụ ma na-echekwa echiche omume a na-eme ugboro ugboro nke imperfect.
- source_word: καὶ
  choice: -kwa / na-
  rationale: E ji njikọ ndị a debe usoro omume ndị ahụ n'ụzọ Igbo na-asụkarị, ma chekwaa njikọ paratactic nke καί ugboro ugboro.
theological_decisions:
- issue: Ọrụ ite mmanụ n'ihe gbasara ọgwụgwọ
  choice: A kọwara ya dịka omume ndị na-eso ụzọ mere, n'ekwughị na mmanụ ahụ n'onwe ya bụ ihe gwọrọ ndị ọrịa.
  alternative: Ịsị na mmanụ ahụ mere ka ọgwụgwọ ahụ pụta, ma ọ bụ na ite mmanụ ahụ bụ naanị ihe nnọchianya na-enweghị ọrụ ọ bụla.
  rationale: Amaokwu ahụ kwuru na ha tere ndị ọrịa mmanụ ma gwọọ ha, mana ọ kọwaghị otú mmanụ ahụ na ọgwụgwọ ahụ si metụta ibe ha n'ụzọ nkà mmụta okpukpe. Ya mere, nsụgharị ahụ hapụrụ esemokwu ahụ dịka ọ dị.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwụ ọtọ ma dị ùgwù. E ji “nọ ... na-” na ngwaa ndị so ya gosipụta omume na-aga n'ihu ma ọ bụ nke a na-eme ugboro ugboro n'akụkọ nchịkọta.
