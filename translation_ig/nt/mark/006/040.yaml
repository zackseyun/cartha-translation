  text: καὶ ἀνέπεσαν πρασιαὶ πρασιαὶ ⸀κατὰ ἑκατὸν καὶ ⸁κατὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/040.yaml
  text: And they reclined in groups of hundreds and of fifties[a].
translation:
  language: ig
  text: Ha wee nọdụ ala n’ìgwè n’ìgwè, otu narị otu narị na iri ise iri ise.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “àkwà ubi, àkwà ubi,” bụ ihe oyiyi na-egosi ahịrị ma ọ bụ nkebi ndị a haziri ahazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπεσαν
  choice: nọdụ ala iri nri
  rationale: N'ọnọdụ a, ngwaa ahụ pụtara ịnọdụ ma ọ bụ ịdabere ala n'ọnọdụ e ji eri nri. Nkebi a na-egosi nzube ahụ nke ọma n'Igbo nkịtị, n'agbanyeghị na o mepụtaghị kpọmkwem ọdịdị ịdabere ala nke ndị oge ahụ.
- source_word: πρασιαὶ πρασιαὶ
  choice: n'ìgwè n'ìgwè
  rationale: Ntughari nke aha a na-eme ka nkewa a haziri ahazi pụta ìhè, ma na-echekwa nkwughachi na-enye echiche nkesa. Ihe oyiyi nkịtị nke 'oghere ubi' dị n'ala okwu Grik ka edebere n'okpuru amaokwu.
- source_word: κατὰ ἑκατὸν
  choice: ụfọdụ dị otu narị
  rationale: κατά na ọnụọgụ na-egosi nkesa; okwu Igbo a na-egosi na ụfọdụ ìgwè nwere otu narị mmadụ.
- source_word: κατὰ πεντήκοντα
  choice: ụfọdụ adị iri ise
  rationale: A na-echekwa nhazi yiri nke nkebi gara aga, na-egosi na ìgwè ndị ọzọ nwere mmadụ iri ise.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị mfe, dị nsọpụrụ, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. “Nọdụ ala iri nri” na-enye echiche nke ọnọdụ oriri n'ụzọ eke karịa ntụgharị siri ike nke ga-asị na ha dabere ala.
