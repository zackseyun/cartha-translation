revisions:
- from: Ha wee nọdụ ala iri nri n'ìgwè n'ìgwè, ụfọdụ dị otu narị, ụfọdụ adị iri ise.[a]
  to: Ha wee nọdụ ala n’ìgwè n’ìgwè, otu narị otu narị na iri ise iri ise.[a]
  rationale: The revision removes the unexpressed action of eating, represents the distributive force of κατά with repeated numerals, and corrects the footnote’s literal garden-bed imagery while keeping the natural contextual main-text rendering.
  reviewer_model: gpt-5.6-terra
