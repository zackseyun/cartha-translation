source:
  edition: SBLGNT
  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: ig
  text: Ọ sịrị ha, “Bịanụ, naanị unu, ka unu gaa n’ebe mmadụ na-adịghị ebi[a], ka unu zuru ike ntakịrị.” N’ihi na ọtụtụ mmadụ nọ na-abịa ma na-ala, ha enweghịdị ohere iri nri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ebe tọgbọrọ n’efu” ma ọ bụ “n’ebe dịpụrụ adịpụ.” Okwu Grik ahụ na-ezo aka n’ebe mmadụ na-adịghị ebi ma ọ bụ ebe dịpụrụ adịpụ; ọ pụtaghị na ebe ahụ ga-abụrịrị ọzara dị ka a na-aghọta ya taa.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha enweghịdị oge iri nri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ọ sịrị
  rationale: Ọ bụ ezie na Grik ji ngwaa oge ugbu a n’akụkọ a, iji oge gara aga n’Igbo na-eme ka akụkọ ahụ daa nke ọma n’enweghị ịgbanwe ihe ọ pụtara.
- source_word: Δεῦτε
  choice: Bịanụ
  rationale: Nke a bụ oku e nyere ọtụtụ mmadụ ka ha soro onye na-ekwu okwu pụọ n’ebe ahụ.
- source_word: ὑμεῖς αὐτοὶ κατ’ ἰδίαν
  choice: unu onwe unu, gaa iche
  rationale: Okwu ndị a jikọtara ọnụ na-emesi ike na ọ bụ naanị ndị na-eso ụzọ ka a kpọrọ ka ha pụọ iche n’ebe ìgwè mmadụ nọ.
- source_word: ἔρημον τόπον
  choice: ebe mmadụ na-ebighị
  rationale: Ọ na-egosi ebe dịpụrụ adịpụ ma ọ bụ ebe mmadụ na-ebighị; ọ pụtaghị na ọ ga-abụrịrị ọzara aja.
- source_word: ἀναπαύσασθε ὀλίγον
  choice: zuru ike ntakịrị
  rationale: Nke a na-egosi ịkwụsị ọrụ ka mmadụ zuru ike ruo obere oge.
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί
  choice: ọtụtụ mmadụ nọ na-abịa ma na-ala
  rationale: Nhazi a na-egosi ọtụtụ mmadụ nọgidere na-abata ma na-apụ.
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: ha enweghịdị ohere iri nri
  rationale: εὐκαιρέω na-ezo aka n’inwe ohere ma ọ bụ oge kwesịrị ekwesị; “enweghịdị ohere” na-echekwa ike οὐδέ.
