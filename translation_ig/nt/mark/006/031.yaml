  to: Ọ sịrị ha, “Bịanụ, naanị unu, ka unu gaa n’ebe mmadụ na-adịghị ebi[a], ka unu zuru ike ntakịrị.” N’ihi na ọtụtụ mmadụ nọ na-abịa ma na-ala, ha enweghịdị ohere iri nri[b].
