    text: A pụkwara ịsụgharị ya, “onye agha nche” ma ọ bụ “onye nche nke eze.” Okwu Grik ahụ bụ mbinye sitere n’asụsụ Latin, spekoulátọr, ma na-ezo aka n’onye so n’òtù nche onye ọchịchị; n’ebe a, ọ rụrụ ọrụ igbu mmadụ.
    reason: lexical_alternative
