  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere njikọ akụkọ abụọ ahụ n’usoro doro anya, ma kpọọ Jọn aha iji zere mgbagwoju anya nke nnọchiaha n’Igbo.
