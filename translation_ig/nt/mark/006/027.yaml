  text: καὶ ⸀εὐθὺς ἀποστείλας ὁ βασιλεὺς σπεκουλάτορα ἐπέταξεν ⸀ἐνέγκαι τὴν κεφαλὴν αὐτοῦ. ⸀καὶ ἀπελθὼν ἀπεκεφάλισεν αὐτὸν ἐν τῇ φυλακῇ
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/027.yaml
  text: And immediately the king sent an executioner and ordered him to bring his head[a]. And he went and beheaded him in the prison.
translation:
  language: ig
  text: Ozugbo ahụ, eze zipụrụ onye nche ya, onye na-egbu mmadụ,[a] ma nye ya iwu ka o weta isi ya. Onye ahụ wee gaa bipụ ya isi n’ụlọ mkpọrọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye agha nche” ma ọ bụ “onye nche nke eze.” Okwu Grik ahụ bụ mbinye sitere n’asụsụ Latin, spekoulátọr, ma na-ezo aka n’onye so n’òtù nche onye ọchịchị; n’ebe a, ọ rụrụ ọrụ igbu mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Ozugbo ahụ
  rationale: Ọ na-egosi na e mere ihe ahụ n’egbughị oge, ma na-adaba n’ụzọ Mak si akọ akụkọ.
- source_word: βασιλεὺς
  choice: eze
  rationale: A hapụrụ aha Mak kpọrọ Herọd n’asụsụ Grik, kama ịgbanwe ya ka ọ bụrụ aha ọkwa ọchịchị ya n’akụkọ ihe mere eme.
- source_word: σπεκουλάτορα
  choice: otu onye nche ya, onye na-egbu ndị a mara ikpe ọnwụ
  rationale: Okwu a sitere na Latin na-ezo aka n’onye so n’òtù ndị nche onye ọchịchị; n’ebe a, ọ bụ ya na-arụ ọrụ igbu onye a mara ikpe ọnwụ. Nsụgharị a na-egosi ma ọkwa ya ma ọrụ ya n’amaokwu a.
- source_word: ἐπέταξεν ἐνέγκαι
  choice: nye ya iwu ka o weta
  rationale: Nke a na-ekwupụta ike iwu ahụ n’Igbo dị ugbu a ma dịkwa mfe nghọta.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: isi Jọn
  rationale: Ọ bụ ezie na Grik kwuru ‘isi ya,’ ịkpọ Jọn aha na-eme ka onye a na-ekwu maka ya doo anya n’Igbo n’enweghị mgbanwe n’ihe okwu ahụ pụtara.
- source_word: ἀπεκεφάλισεν
  choice: bipụ Jọn isi
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụ nke mmadụ na-ejikarị ekwu igbupụ isi mmadụ.
- source_word: ἐν τῇ φυλακῇ
  choice: n’ụlọ mkpọrọ
  rationale: Ọ na-echekwa ebe a kapịrị ọnụ ihe ahụ mere, dịka mkpụrụokwu Grik nwere nkwupụta aha kpọmkwem.
