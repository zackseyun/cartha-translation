review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the sequence, the narrative designation “king,” the command to bring John’s head, and the beheading in prison. However, “ndị a mara ikpe ọnwụ” adds that John had been formally condemned to death, which the Greek does not state and the narrative context does not require. The source says simply that the guard carried out the beheading.
  naturalness: The revised wording is concise, natural Standard Igbo, and retains a sober narrative register appropriate to Mark. “Onye nche ya, onye na-egbu mmadụ” communicates both the guard affiliation and the executionary function in context without an overly long appositional description.
  terminology: “Eze” properly follows Mark’s βασιλεύς rather than correcting the historical title. “Onye nche ya, onye na-egbu mmadụ” is a contextually clear rendering of σπεκουλάτωρ; the footnote preserves the guard/bodyguard alternatives and notes the Latin loanword. “Bipụ ya isi” is an idiomatic equivalent for beheading and preserves the Greek pronoun.
  issues:
  - severity: medium
    issue: The phrase “onye na-egbu ndị a mara ikpe ọnwụ” introduces a formal death sentence.
    rationale: Neither σπεκουλάτωρ nor ἀπεκεφάλισεν says that John was legally sentenced or convicted. This qualification should be removed to avoid adding a judicial circumstance absent from the source.
  - severity: low
    issue: The main text identifies the victim as “Jọn” both times where the Greek uses pronouns.
    rationale: The identification is contextually accurate, but using “ya” more closely preserves the source’s referential form while remaining fully clear in Igbo.
  revised_text: Ozugbo ahụ, eze zipụrụ onye nche ya, onye na-egbu mmadụ,[a] ma nye ya iwu ka o weta isi ya. Onye ahụ wee gaa bipụ ya isi n’ụlọ mkpọrọ.
  revised_footnotes:
