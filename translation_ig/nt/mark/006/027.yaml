revisions:
- from: Ozugbo ahụ, eze zipụrụ otu onye nche ya, onye na-egbu ndị a mara ikpe ọnwụ,[a] ma nye ya iwu ka o weta isi Jọn. Onye ahụ wee gaa bipụ Jọn isi n’ụlọ mkpọrọ.
  to: Ozugbo ahụ, eze zipụrụ onye nche ya, onye na-egbu mmadụ,[a] ma nye ya iwu ka o weta isi ya. Onye ahụ wee gaa bipụ ya isi n’ụlọ mkpọrọ.
  rationale: The revision removes the unsupported implication that John had received a formal death sentence, while preserving the contextual sense that the ruler’s guard member acted as an executioner. It also retains the source’s pronoun reference to John and refines the note’s wording for accuracy and natural Standard Igbo.
