  source_fidelity: A safe revision is needed. The Greek imperative ἀπόλυσον is singular, whereas “Zilaganụ” is plural. Also, the purpose-clause verb ἀγοράσωσιν is future-oriented/subjunctive and should be rendered with “zụta,” not the past form “zụtara.”
  naturalness: “N’ime ime obodo” is not natural in this context and risks obscuring ἀγρούς. “N’ala ubi na n’obodo nta ndị dị gburugburu” is clear, idiomatic Standard Igbo and maintains the distinction between rural/farm areas and villages.
  terminology: “Zilaga ha” suitably renders the directive force of ἀπόλυσον. “Ala ubi” is an appropriately specific and contextually natural rendering of ἀγρούς; it avoids treating it as a second term for “village.” “Ihe ha ga-eri” naturally conveys τί φάγωσιν.
