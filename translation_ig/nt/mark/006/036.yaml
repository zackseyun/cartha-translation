  yaml_path: translation/nt/mark/006/036.yaml
  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: ig
  text: Zilaga ha[a], ka ha gaa n’ala ubi na n’obodo nta ndị dị gburugburu zụtaara onwe ha ihe ha ga-eri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ dabara kpọmkwem n’usoro okwu Grik: “Hapụ ha ka ha laa, ka, mgbe ha gasịrị n’ala ubi na n’obodo nta ndị dị gburugburu, ha zụtara onwe ha ihe ha ga-eri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλυσον αὐτούς
  choice: Zilaganụ ha
  rationale: N’ọnọdụ a, ἀπολύω pụtara ịgwa ìgwè mmadụ ka ha lawa. “Zilaganụ ha” bụ okwu Igbo dị mfe ma doo anya nke na-echekwa ike nke iwu ahụ.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-egosi nzube nke izilaga ha n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: ἀπελθόντες
  choice: ha gaa
  rationale: Ọ bụ ezie na okwu Grik ahụ bụ participle nke na-egosi na ha eburu ụzọ pụọ, itinye ya dịka “ha gaa” n’ahịrịokwu nzube na-eme ka Igbo dị ire ma na-echekwa usoro omume ahụ.
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: ime obodo na obodo nta ndị gbara ebe a gburugburu
  rationale: ἀγροί nwere ike ịpụta ubi, ala ọrụ ugbo, ma ọ bụ ime obodo. N’ebe a, “ime obodo” na-egosi mpaghara ndị mmadụ nwere ike ịga chọta nri, ebe κῶμαι bụ “obodo nta”; κύκλῳ bụ “ndị gbara ebe a gburugburu.”
- source_word: ἀγοράσωσιν
  choice: zụtara
  rationale: “Zụtara” na-enye kpọmkwem echiche nke inweta ihe site n’ịkwụ ụgwọ, ma kwekọọ n’usoro nkebiokwu “ka ... zụtara” n’Igbo.
- source_word: ἑαυτοῖς
  choice: onwe ha
  rationale: Nke a na-echekwa echiche reflexive dative ahụ, ya bụ, na ha ga-azụtara onwe ha nri.
- source_word: τί φάγωσιν
  choice: ihe ha ga-eri
  rationale: Nkebiokwu a bụ ụzọ Igbo doro anya ma dị ire isi kwuo “ihe ha nwere ike iri” ma ọ bụ “ihe oriri.”
