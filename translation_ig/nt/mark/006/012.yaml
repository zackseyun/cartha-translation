  text: And they went out and proclaimed that people should repent[a].
translation:
  language: ig
  text: Ha wee pụọ kwusaa ka ndị mmadụ chegharịa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ka nso n’okwu mbụ, “ka ha chegharịa,” ebe “ha” na-ezo aka na ndị nụrụ nkwusa ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: wee
  rationale: Njikọ akụkọ a na-aga n’ihu n’ụzọ e si akọkarị akụkọ n’Igbo, na-agbakwụnyeghị nkọwa oge na-adịghị na Grik.
- source_word: ἐξελθόντες
  choice: Ha wee pụọ
  rationale: Ọ bụ participle aorist na-ezo aka n’ebe ndị na-eso ụzọ nọ; e jiri ngwaa zuru ezu sụgharịa ya ka Igbo bụrụ nke eke ma gosipụta na ha pụrụ tupu ha ekwusaa ozi ahụ.
- source_word: ἐκήρυξαν
  choice: kwusaa
  rationale: Okwu a pụtara ikwupụta ozi n’ihu ọha; ‘kwusaa’ na-echekwa echiche ahụ n’enweghị itinye okwu ụka pụrụ iche.
- source_word: ἵνα
  choice: na
  rationale: N’ebe a ọ na-ewebata ihe ha kwusara ka ndị na-anụ ya mee.
- source_word: μετανοῶσιν
  choice: kwesịrị ichegharị
  rationale: ‘Ichegharị’ bụ okwu Igbo doro anya maka mgbanwe uche na ụzọ ndụ a na-akpọ mmadụ ka o mee; ‘kwesịrị’ na-egosipụta ụdị subjunctive dị n’okwu Grik.
theological_decisions:
- issue: Onye bụ isiokwu zoro ezo nke μετανοῶσιν
  choice: ndị mmadụ kwesịrị ichegharị
  alternative: ha kwesịrị ichegharị
  rationale: Ngwaa Grik ahụ nwere isiokwu ọtụtụ zoro ezo, ya bụ ndị nụrụ nkwusa ahụ. ‘Ndị mmadụ’ na-eme ka nke a doo anya ma zere ka ‘ha’ yie ka ọ na-ezo aka n’ebe ndị na-eso ụzọ nọ; nkọwa ala peeji na-echekwa ntụgharị nkịtị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị mfe nghọta ma nwee ugwu. E ji ‘kwusaa’ mee ka echiche nkwupụta n’ihu ọha pụta ìhè, jiri ‘ichegharị’ chekwaa ibu okpukpe na omume nke μετανοέω.
