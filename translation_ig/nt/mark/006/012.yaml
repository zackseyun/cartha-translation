revisions:
- from: Ha wee pụọ, kwusaa na ndị mmadụ kwesịrị ichegharị.[a]
  to: Ha wee pụọ kwusaa ka ndị mmadụ chegharịa.[a]
  rationale: The revision retains the explicit audience (“ndị mmadụ”), preserving the source sense and avoiding ambiguity with the disciples. It replaces the added modal “kwesịrị” with the natural Igbo subjunctive construction “ka ... chegharịa,” which more closely represents the Greek ἵνα plus subjunctive clause. The footnote is conformed to that rendering and clarified stylistically.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:46Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the disciples as the subject of ἐξελθόντες and ἐκήρυξαν, and it correctly makes the recipients of the proclamation the understood subject of μετανοῶσιν. However, “kwesịrị” introduces a stronger explicit sense of obligation than the Greek ἵνα clause requires. Igbo subjunctive wording with “ka ... chegharịa” better reflects the intended response without over-specifying modality.
  naturalness: “Ha wee pụọ kwusaa ka ndị mmadụ chegharịa” is concise, natural Standard Igbo narrative prose. It also avoids the somewhat awkward comma-separated verb sequence in the draft.
  terminology: “kwusaa” appropriately renders κηρύσσω in this context, and “chegharịa” is an established, clear rendering for μετανοέω/repent. The revised footnote preserves the alternative literal pronoun without risking ambiguity in the main text.
  issues:
  - severity: medium
    issue: The modal “kwesịrị” in the main text and footnote is overly explicit.
    rationale: The Greek present subjunctive μετανοῶσιν under ἵνα expresses the intended content/result of their proclamation. It does not itself require the deontic modal force conveyed by “kwesịrị” (“ought to/should”).
  - severity: low
    issue: The footnote's final phrase is unnatural Igbo.
    rationale: “ebe ‘ha’ na-ezo aka n’ebe ndị nụrụ nkwusa ahụ nọ” is better expressed directly as “‘ha’ na-ezo aka na ndị nụrụ nkwusa ahụ.”
  revised_text: Ha wee pụọ kwusaa ka ndị mmadụ chegharịa.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ka nso n’okwu mbụ, “ka ha chegharịa,” ebe “ha” na-ezo aka na ndị nụrụ nkwusa ahụ.
    reason: lexical_alternative
  revision_rationale: The revision retains the explicit audience (“ndị mmadụ”), preserving the source sense and avoiding ambiguity with the disciples. It replaces the added modal “kwesịrị” with the natural Igbo subjunctive construction “ka ... chegharịa,” which more closely represents the Greek ἵνα plus subjunctive clause. The footnote is conformed to that rendering and clarified stylistically.
