id: MRK.6.14
reference: Mark 6:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: ig
  text: Eze Herọd nụrụ banyere ya, n’ihi na aha Jizọs amawo ebe niile. Ndị mmadụ na-asị, “A kpọlitela Jọn Onye Na-eme Baptizim[a] site n’etiti ndị nwụrụ anwụ[b]; ọ bụkwa n’ihi nke a ka ike ndị a[c] ji na-arụ ọrụ n’ime ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka aha ọdịnala si dị, “Jọn Onye Baptizim.”
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ, “Jọn si n’etiti ndị nwụrụ anwụ bilie.” Ngwaa Grik bụ olu nnara: “a kpọlitela Jọn.”'
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ “ike ịrụ ọrụ ebube” ma ọ bụ “ọrụ ebube.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: Eze Herọd
  rationale: Nke a bụ ụzọ ebumpụta ụwa Standard Igbo si etinye aha ọchịchị n’ihu aha mmadụ, ma na-edobe ihe βασιλεύς pụtara.
- source_word: ἤκουσεν
  choice: nụrụ banyere ihe ndị a
  rationale: Ngwaa Grik pụtara ‘nụrụ’; ihe ọ nụrụ ekwughị kpọmkwem n’amaokwu a, kama ọ na-ezo aka n’ihe ndị a kọrọ tupu ya. Nsụgharị a na-eme ka Igbo doo anya n’etinyeghị ozi ọhụrụ.
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: n’ihi na aha ya amawo ebe niile
  rationale: Ọ na-edobe okwu ‘aha ya’ ma na-egosipụta n’ụzọ Igbo dị ire na aha ahụ aghọọla ihe ọha maara.
- source_word: ἔλεγον
  choice: Ndị mmadụ na-asị
  rationale: Isiokwu nke ngwaa ọtụtụ ahụ akọwaghị ndị ọ bụ; ‘Ndị mmadụ’ na-egosipụta plural na-enweghị ịkpọ otu ndị pụrụ iche aha.
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: Jọn Onye Na-eme Baptizim
  rationale: 'Ọ na-edobe ike ngwaa dị na participle Grik: Jọn bụ onye na-eme ndị mmadụ baptizim. Aha ọdịnala dị n’okpuru peeji.'
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: ka e si n’etiti ndị nwụrụ anwụ kpọlite
  rationale: ‘Ka e ... kpọlite’ na-edobe olu nnara nke ngwaa Grik, ebe ‘n’etiti ndị nwụrụ anwụ’ na-egosipụta ἐκ νεκρῶν nke ọma.
- source_word: διὰ τοῦτο
  choice: ọ bụkwa n’ihi nke a
  rationale: Nke a na-egosipụta ihe kpatara okwu na-esochi ya, dịka ahịrịokwu Grik si eme.
- source_word: ἐνεργοῦσιν
  choice: ji na-arụ ọrụ
  rationale: Ọdịdị ‘na-arụ ọrụ’ na-egosipụta omume na-aga n’ihu, ma jikọta nke ọma na ‘ike ndị a’.
- source_word: αἱ δυνάμεις
  choice: ike ndị a
  rationale: δύναμεις nwere ike ịbụ ike ma ọ bụ ọrụ ebube. ‘Ike ndị a’ na-edobe obosara na ntakịrị mgbagwoju anya nke okwu Grik n’enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Nke a bụ nsụgharị kwụ ọtọ nke ἐν αὐτῷ ma na-edobe echiche na ike ndị ahụ na-arụ ọrụ n’ime onye ahụ, kama ịhọrọ ‘site n’aka ya.’
theological_decisions:
- issue: Olu ngwaa ἐγήγερται n’okwu banyere mbilite n’ọnwụ
  choice: ka e si n’etiti ndị nwụrụ anwụ kpọlite
  alternative: o si n’etiti ndị nwụrụ anwụ bilie
  rationale: Ngwaa Grik bụ olu nnara n’ụdị perfect. Isi nsụgharị na-edobe na e mere ihe ahụ nye Jọn, kama ịgbanwe ya ka ọ bụrụ na Jọn biliri n’onwe ya.
- issue: Nsụgharị aha Ἰωάννης ὁ βαπτίζων
  choice: Jọn Onye Na-eme Baptizim
  alternative: Jọn Onye Baptizim
  rationale: Participial Grik na-akọwa ihe Jọn na-eme. Nhọrọ a na-egosipụta ọrụ ahụ n'ụzọ doro anya, ebe aha ọdịnala ka e nyere n’okpuru peeji.
- issue: Ihe αἱ δυνάμεις na-ezo aka na ya
  choice: ike ndị a
  alternative: ọrụ ebube ndị a
  rationale: Okwu Grik nwere ike ịpụta ike dị irè ma ọ bụ ọrụ ebube. Isi nsụgharị anaghị emechi oghere nghọta ahụ; ihe ọzọ e nwere ike ịsụ dị n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. E debere usoro okwu ndị dị mkpa dịka ‘aha ya,’ olu nnara n’okwu mbilite n’ọnwụ, na obosara ihe δύναμεις nwere ike ịpụta; e ji nkọwa n’okpuru peeji gosi ụzọ ndị ọzọ a pụrụ isi sụ ha.
