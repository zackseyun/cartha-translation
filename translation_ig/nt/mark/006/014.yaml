revisions:
- from: Eze Herọd nụrụ banyere ihe ndị a, n’ihi na aha ya amawo ebe niile. Ndị mmadụ na-asị, “Jọn Onye Na-eme Baptizim[a] ka e si n’etiti ndị nwụrụ anwụ kpọlite[b]; ọ bụkwa n’ihi nke a ka ike ndị a[c] ji na-arụ ọrụ n’ime ya.”
  to: Eze Herọd nụrụ banyere ya, n’ihi na aha Jizọs amawo ebe niile. Ndị mmadụ na-asị, “A kpọlitela Jọn Onye Na-eme Baptizim[a] site n’etiti ndị nwụrụ anwụ[b]; ọ bụkwa n’ihi nke a ka ike ndị a[c] ji na-arụ ọrụ n’ime ya.”
  rationale: The revision explicitly identifies Jesus as the one whose name had become publicly known, in accordance with the immediate Markan context and the intended referent of αὐτοῦ. It also replaces an incomplete passive construction with natural Standard Igbo that preserves the Greek perfect passive. Footnote anchors and alternatives remain aligned with their corresponding expressions.
