revisions:
- from: Ọ kpọkwara Ndị Iri na Abụọ ahụ, malite izipụ ha abụọ abụọ[a], na-enye ha ikike n’ebe mmụọ ndị na-adịghị ọcha nọ[b].
  to: Ọ kpọrọ Ndị Iri na Abụọ ahụ, wee malite izipu ha abụọ abụọ[a], na-enye ha ikike n’ahụ mmụọ ndị na-adịghị ọcha[b].
  rationale: The revision removes the added sense in “kpọkwara,” restores the finite ‘began’ construction, and retains the Greek imperfect’s contemporaneous sense with “na-enye.” It keeps the source’s distinction between authority and power and does not interpret ‘unclean spirits’ as a different term.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Jesus’ calling of the Twelve, their being sent in pairs, and the granting of authority over unclean spirits. However, “kpọkwara” adds an unwarranted ‘also,’ and “malite izipụ” lacks the finite verb required by the Greek ἤρξατο and by natural Igbo syntax.
  naturalness: The proposed revision supplies a finite verb and uses a smoother narrative sequence. “N’ìgwè mmadụ abụọ abụọ” is a clear, idiomatic alternative for the distributive expression. “Ikike n’ahụ” naturally expresses authority over without turning authority into mere physical power.
  terminology: “Ndị Iri na Abụọ ahụ,” “ikike,” and “mmụọ ndị na-adịghị ọcha” appropriately preserve the recognized designation, delegated-authority sense, and Mark’s literal terminology. The footnote for “ike” should retain the same relation ‘over,’ rather than merely replacing one noun.
  issues:
  - severity: medium
    issue: “kpọkwara” introduces ‘also.’
    rationale: The Greek καί here is simply connective (‘and’); no emphatic or additive ‘also’ is required.
  - severity: high
    issue: “malite izipụ ha” is structurally incomplete.
    rationale: ἤρξατο is a finite verb (‘he began’). Standard Igbo needs “wee malite” or an equivalent finite verbal construction.
  - severity: low
    issue: Footnote b does not fully express the alternative’s relation to the spirits.
    rationale: The alternative ‘power’ should still say that this power is over the unclean spirits.
  revised_text: Ọ kpọrọ Ndị Iri na Abụọ ahụ, wee malite izipu ha abụọ abụọ[a], na-enye ha ikike n’ahụ mmụọ ndị na-adịghị ọcha[b].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ìgwè mmadụ abụọ abụọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ike n’ahụ mmụọ ndị na-adịghị ọcha.”
    reason: alternative_reading
  revision_rationale: The revision removes the added sense in “kpọkwara,” restores the finite ‘began’ construction, and retains the Greek imperfect’s contemporaneous sense with “na-enye.” It keeps the source’s distinction between authority and power and does not interpret ‘unclean spirits’ as a different term.
