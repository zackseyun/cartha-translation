  text: καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: ig
  text: Ọ kpọrọ Ndị Iri na Abụọ ahụ, wee malite izipu ha abụọ abụọ[a], na-enye ha ikike n’ahụ mmụọ ndị na-adịghị ọcha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ìgwè mmadụ abụọ abụọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ike n’ahụ mmụọ ndị na-adịghị ọcha.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσκαλεῖται
  choice: Ọ kpọkwara
  rationale: A sụgharịrị historical present nke Mak n’oge gara aga ka akụkọ ahụ na-aga were were n’Igbo; ‘kpọkwara’ na-egosikwa njikọ ya na ihe bu ụzọ.
- source_word: τοὺς δώδεκα
  choice: Ndị Iri na Abụọ ahụ
  rationale: Nke a bụ aha e ji amata ìgwè mmadụ iri na abụọ Jizọs họpụtara, ọ bụghị naanị ọnụ ọgụgụ nkịtị.
- source_word: ἤρξατο ... ἀποστέλλειν
  choice: malite izipụ ha
  rationale: Nke a na-egosipụta mmalite nke iziga ha n’ozi n’asụsụ Igbo dị mfe ma bụrụkwa nke sitere nso n’ihe Grik kwuru.
- source_word: δύο δύο
  choice: abụọ abụọ
  rationale: Ntughari a na-edobe nkwughachi nkesa dị na Grik ma na-ada nke ọma n’Igbo.
- source_word: ἐδίδου
  choice: na-enye ha
  rationale: Ụdị a na-egosipụta omume na-aga n’ihu ma ọ bụ nke so izipụ ha na-eme, dịka imperfect Grik si dị.
- source_word: ἐξουσίαν
  choice: ikike
  rationale: ‘Ikike’ na-egosipụta ikike e nyere mmadụ ime ihe, ọ bụghị naanị ike anụahụ ma ọ bụ ume.
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: mmụọ ndị na-adịghị ọcha
  rationale: Nke a na-edobe okwu Mak n’ụzọ nkịtị n’enweghị ịkọwa ya ozugbo dịka ndị mmụọ ọjọọ.
theological_decisions:
- issue: Ụdị ikike Jizọs nyere Ndị Iri na Abụọ n’ebe mmụọ ndị na-adịghị ọcha nọ
  choice: ikike n’ebe mmụọ ndị na-adịghị ọcha nọ
  alternative: ike imeri mmụọ ndị na-adịghị ọcha
  rationale: ‘Ikike’ na-echekwa echiche ἐξουσία banyere ikike e nyere ha, ebe ‘ike imeri’ nwere ike ime ka okwu ahụ bụrụ naanị ume ma gbakwunye ihe ederede ekwughị kpọmkwem.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E mere ka ahịrịokwu ahụ bụrụ nke na-aga were were n’akụkọ, ma chekwaa ọdịiche dị n’etiti ‘ikike’ na ‘ike.’
