id: MRK.6.25
reference: Mark 6:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσα ⸀εὐθὺς μετὰ σπουδῆς πρὸς τὸν βασιλέα ᾐτήσατο λέγουσα· Θέλω ἵνα ⸂ἐξαυτῆς δῷς μοι⸃ ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: ig
  text: O wee jiri ọsọ banye ozugbo n’ihu eze, rịọ ya sị, “Achọrọ m ka i nye m, n’otu ntabi anya, n’elu efere, isi Jọn onye na-eme baptizim.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: O wee bata
  rationale: Nkebi a na-egosi na ọ banyere n’ebe oriri ahụ ma ọ bụ n’ihu eze; “bata” bụ Igbo nkịtị nke na-edobe mmegharị ahụ n’akụkọ.
- source_word: εὐθὺς
  choice: ozugbo
  rationale: Ọ na-edobe ngwa ngwa nke a na-ahụkarị n’akụkọ Mak.
- source_word: μετὰ σπουδῆς
  choice: jiri ọsọ
  rationale: Ọ na-egosi na ọ gara ngwa ngwa n’enweghị ịtụ aro na obi tọrọ ya ụtọ ime ya.
- source_word: πρὸς τὸν βασιλέα
  choice: gaa n’ebe eze nọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo na ọ bịakwutere eze; a nọgidere na-asụgharị βασιλεύς dịka “eze.”
- source_word: ᾐτήσατο
  choice: rịọ ya
  rationale: Ngwaa ahụ pụtara ịrịọ ihe; ike arịrịọ ahụ pụtara ìhè n’okwu nwaanyị ahụ kwuru, ya mere e meghị ya ka ọ bụrụ “nyere iwu.”
- source_word: Θέλω
  choice: Achọrọ m
  rationale: Ọ na-egosipụta ọchịchọ ya n’ụzọ kwụ ọtọ ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ἵνα ... δῷς μοι
  choice: ka i nye m
  rationale: Nke a na-asụgharị ọdịnaya nke ihe ọ chọrọ n’ụzọ Igbo kwesịrị ekwesị.
- source_word: ἐξαυτῆς
  choice: ugbu a
  rationale: Ọ na-edobe arịrịọ ya ka e mee ihe ahụ n’otu ntabi anya, ma ghara ịgwakọta ya na εὐθὺς nke na-akọ ọsọ ọ banyere.
- source_word: ἐπὶ πίνακι
  choice: n’elu efere
  rationale: πίναξ bụ efere sara mbara e ji ebu ma ọ bụ enye nri; “efere” bụ okwu Igbo doro ọtụtụ ndị anya n’ọnọdụ oriri.
- source_word: τὴν κεφαλὴν
  choice: isi
  rationale: A hapụrụ nkọwa ọjọọ ahụ dịka ọ dị n’asụsụ mbụ, n’enweghị ime ka ọ dị nro.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Jọn Onye Na-eme Baptizim
  rationale: A sụgharịrị βαπτιστής dịka aha ọrụ na-akọ ihe Jọn na-eme, kama iji aha otu ụka ma ọ bụ hapụ nkọwa Grik ahụ.
theological_decisions:
- issue: Nsụgharị Ἰωάννου τοῦ βαπτιστοῦ
  choice: Jọn Onye Na-eme Baptizim
  alternative: Jọn Baptist
  rationale: βαπτιστής bụ aha na-akọ ọrụ Jọn. “Onye Na-eme Baptizim” na-eme ka ihe okwu Grik ahụ pụtara doo onye Igbo nke oge a anya ma zere ka a ghọta “Baptist” dịka aha otu ụka.
translation_notes:
  register: 'Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. E debere ngwa ngwa abụọ dị n’asụsụ Grik iche: “ozugbo” maka εὐθὺς na “ugbu a” maka ἐξαυτῆς. Enweghị akara nkọwa ala peeji n’ihi na ihe e tinyere dịka footnote n’English POB bụ maka ọdịiche okwu Bekee (“Baptizer/Baptist”), ọ bụghị ọdịiche dị mkpa n’Igbo.'
