  yaml_path: translation/nt/mark/006/043.yaml
  text: And they picked up twelve basketfuls of broken pieces[a], and some of the fish.
translation:
  language: ig
  text: Ha chịkọtara iberibe ndị juru nkata iri na abụọ, tinyekwara ụfọdụ n’ime azụ ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịtụgharị ya, “iberibe, ihe juru nkata iri na abụọ.” N’okwu Grik, e jikọtara okwu ndị a: “iberibe,” “nkata iri na abụọ,” na “ihe juru nkata.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: Ha chịkọtara
  rationale: N'ọnọdụ akụkọ a, αἴρω pụtara ịchịkọta ihe fọdụrụ mgbe mmadụ niile richara, ọ bụghị naanị ibuli ya elu.
- source_word: κλάσματα
  choice: iberibe achịcha fọdụrụ
  rationale: κλάσματα bụ iberibe a nyawara; ebe akụkọ gbara ya gburugburu gosiri na ọ bụ achịcha, ịkpọ ya iberibe achịcha na-eme ka Igbo doo anya n'ụzọ nkịtị.
- source_word: δώδεκα κοφίνων πληρώματα
  choice: ha ejuo nkata iri na abụọ
  rationale: Nke a na-egosipụta ma ọnụọgụ nkata ma eziokwu na ihe a chịkọtara jupụtara na ha, ma na-ezere usoro okwu Grik na-adịghị aga were were n'Igbo.
- source_word: κόφινος
  choice: nkata
  rationale: Nkata bụ okwu Igbo doro anya maka ụdị arịa a; ịkọwa kpọmkwem nha ya ga-agbakwụnye ihe amaokwu ahụ ekwughị.
- source_word: πληρώματα
  choice: ha ejuo
  rationale: Okwu a na-egosi ihe jupụtara n'ime nkata ma ọ bụ oke zuru ezu juru ha; usoro a bụ Igbo nkịtị ma na-echekwa echiche ahụ.
- source_word: ἀπὸ τῶν ἰχθύων
  choice: tinyere iberibe azụ ndị fọdụrụ
  rationale: ἀπό ebe a na-egosi na ihe a chịkọtara sitere kwa n'azụ. 'Iberibe azụ ndị fọdụrụ' dabara n'ọnọdụ ahụ ma ghara ime ka a ghọta na ha chịkọtara azụ niile.
