  rationale: The revision removes contextual additions not stated in the Greek, retains the sense that the fragments filled twelve baskets, and renders the final ἀπό phrase as a natural Igbo partitive expression. The footnote preserves the notable compactness and syntactic ambiguity of the Greek expression.
