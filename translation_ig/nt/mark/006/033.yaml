- from: Ọtụtụ mmadụ hụrụ ha ka ha na-aga, matakwa ndị ha bụ. Ndị mmadụ si n’obodo niile jiri ụkwụ gbakọọ ọsọ ruo ebe ahụ[a], buru ha ụzọ rute.
  to: Ọtụtụ mmadụ hụrụ ha ka ha na-aga, matakwa ndị ha bụ. Ha si n’obodo niile jiri ụkwụ gbaa ọsọ gaa ebe ahụ[a], burukwa ha ụzọ rute.
  rationale: The revision replaces an unclear idiom with natural Standard Igbo for running on foot to a place, retains the source’s movement and precedence in arrival, and improves the lexical-alternative footnote without adding interpretive content.
