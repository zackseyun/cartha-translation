base_translation:
  language: en
  yaml_path: translation/nt/mark/006/033.yaml
  text: And many saw them going and recognized them[b][a], and on foot from all the towns they ran there together and got there ahead of them.
translation:
  language: ig
  text: Ọtụtụ mmadụ hụrụ ha ka ha na-aga, matakwa ndị ha bụ. Ha si n’obodo niile jiri ụkwụ gbaa ọsọ gaa ebe ahụ[a], burukwa ha ụzọ rute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site n’ala,” iji mee ka ọdịiche dị n’etiti njem n’ala na njem ụgbọ mmiri pụta ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: hụrụ
  rationale: Ọ bụ okwu nkịtị na-egosi na ha ji anya hụ ndị ahụ, n’etinyeghị nkọwa ọzọ na-adịghị na Grik.
- source_word: ὑπάγοντας
  choice: ka ha na-aga
  rationale: Ọ na-egosi na ha nọ n’ime njem; amaokwu bu ụzọ na-akọwa na ha ji ụgbọ mmiri.
- source_word: ἐπέγνωσαν
  choice: matakwa ndị ha bụ
  rationale: N’ebe a, okwu ahụ pụtara ịmata ndị a hụrụ, ọ bụghị ịmụ ihe ọhụrụ banyere ha.
- source_word: πολλοί
  choice: Ọtụtụ mmadụ
  rationale: Adjective ahụ nọchiri aha mmadụ; ịkpọpụta “mmadụ” na-eme ka Igbo doo anya ma dịkwa mma.
- source_word: πεζῇ
  choice: jiri ụkwụ
  rationale: Nke a na-echekwa ọdịiche dị n’etiti njem ha ji ụkwụ mee na njem Jizọs na ndị na-eso ụzọ ya ji ụgbọ mmiri mee.
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: si n’obodo niile
  rationale: “Obodo” bụ okwu Igbo sara mbara nke nwere ike ịgụnye town ma ọ bụ city, ya mere ọ na-echekwa obosara πόλις.
- source_word: συνέδραμον
  choice: gbakọọ ọsọ
  rationale: Nke a na-egosi ma ịgba ọsọ ma nnọkọ ndị si ebe dị iche iche gbakọta n’otu ebe.
- source_word: ἐκεῖ
  choice: ruo ebe ahụ
  rationale: Ọ na-ezo aka n’ebe ha na-aga n’ụzọ doro anya ma bụrụ Igbo sitere n’ọnụ.
- source_word: προῆλθον αὐτούς
  choice: buru ha ụzọ rute
  rationale: Okwu a na-egosi na igwe mmadụ rutere ebe ahụ tupu Jizọs na ndị na-eso ụzọ ya.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu nke abụọ doziri usoro okwu Grik ka ọ bụrụ Igbo sitere n’ọnụ, ma chekwaa echiche nke ndị mmadụ si n’obodo dị iche iche gbakọọ ọsọ ma buru ha ụzọ rute.
