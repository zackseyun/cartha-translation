review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the sequence: many people saw them going, recognized who they were, ran from all the towns to that place, and arrived before them. The phrase “gbakọọ ọsọ” is less clear as an equivalent for συνέδραμον and can sound like gathering speed rather than people converging in a run.'
  naturalness: “Jiri ụkwụ gbakọọ ọsọ ruo ebe ahụ” is not the most natural modern Standard Igbo expression. “Jiri ụkwụ gbaa ọsọ gaa ebe ahụ” is clear and idiomatic while retaining the explicit on-foot contrast.
  terminology: “Ọtụtụ mmadụ,” “matakwa ndị ha bụ,” and “obodo niile” are appropriate Standard Igbo renderings. No theological terminology is involved. The footnote’s proposed alternative should use “site n’ala,” rather than “jiri ala,” for ‘by land.’
  issues:
  - severity: medium
    issue: The expression “jiri ụkwụ gbakọọ ọsọ” is awkward and potentially ambiguous.
    rationale: συνέδραμον means that they ran/converged together. In this context, “gbakọọ ọsọ” does not plainly express running to the destination; “jiri ụkwụ gbaa ọsọ gaa ebe ahụ” does.
  - severity: low
    issue: The footnote’s alternative “jiri ala gaa” is unnatural for the sense ‘by land.’
    rationale: “Site n’ala” more naturally expresses travel by land and preserves the intended contrast with travel by boat.
  revised_text: Ọtụtụ mmadụ hụrụ ha ka ha na-aga, matakwa ndị ha bụ. Ha si n’obodo niile jiri ụkwụ gbaa ọsọ gaa ebe ahụ[a], burukwa ha ụzọ rute.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site n’ala,” iji mee ka ọdịiche dị n’etiti njem n’ala na njem ụgbọ mmiri pụta ìhè.
    reason: lexical_alternative
  revision_rationale: The revision replaces an unclear idiom with natural Standard Igbo for running on foot to a place, retains the source’s movement and precedence in arrival, and improves the lexical-alternative footnote without adding interpretive content.
