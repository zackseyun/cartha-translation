- from: Mgbe ọ hụrụ ka ha na-adọgbu onwe ha n'ịkwọ ụgbọ mmiri[d], n’ihi na ifufe na-emegide ha, n’ihe dị ka nche nke anọ nke abalị[a], ọ bịakwutere ha, na-aga ije n’elu oké osimiri[b]. O bu n’obi ịgafe ha[c].
  to: Mgbe ọ hụrụ ka ha na-adọgbu onwe ha n'ịkwọ ụgbọ mmiri[d], n’ihi na ifufe na-emegide ha, n’ihe dị ka nche nke anọ nke abalị[a], ọ bịakwutere ha, na-aga ije n’elu oké osimiri[b]. Ọ chọrọ ịgafe ha[c].
  rationale: Only the final clause is revised for natural Standard Igbo. “Ọ chọrọ ịgafe ha” is a direct and natural rendering of ἤθελεν παρελθεῖν αὐτούς, while retaining the textual and theological openness documented in footnote c. Footnote c is correspondingly updated to quote the revised wording.
