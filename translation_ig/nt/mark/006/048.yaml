id: MRK.6.48
reference: Mark 6:48
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: ig
  text: Mgbe ọ hụrụ ka ha na-adọgbu onwe ha n'ịkwọ ụgbọ mmiri[d], n’ihi na ifufe na-emegide ha, n’ihe dị ka nche nke anọ nke abalị[a], ọ bịakwutere ha, na-aga ije n’elu oké osimiri[b]. Ọ chọrọ ịgafe ha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nche nke anọ nke abalị” bụ oge ikpeazụ nke abalị n’usoro ndị Rom, ihe dị ka elekere atọ ruo elekere isii nke ụtụtụ.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsị, “na-aga ije n’elu mmiri.” Grik kwuru “n’elu oké osimiri.”
    reason: lexical_alternative
  - marker: c
    text: “Ọ chọrọ ịgafe ha” nwere ike ịpụta naanị na ọ chọrọ ịgabiga ha. Ma ọ pụkwara ime ka ebe ndị dị n’Agba Ochie, ebe Chineke “gafere” mgbe ọ na-egosi onwe ya, bata n’uche (dịka Ọpụpụ 33:19, 22; 34:6; 1 Ndị Eze 19:11).
    reason: alternative_reading
  - marker: d
    text: 'N’ụzọ dị nso karị n’okwu Grik: “ka ha na-ata ahụhụ n’ịkwọ ụgbọ mmiri.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἰδὼν
  choice: Mgbe ọ hụrụ
  rationale: A sụgharịrị aorist participle ahụ dịka nkebiokwu oge dị n’Igbo, nke na-egosi njikọ ya na ihe sochirinụ n’enweghị ịkọwa usoro ihe ahụ karịa ihe Grik kwuru.
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: ka ha na-adọgbu onwe ha n'ịkwọ ụgbọ mmiri
  rationale: Nke a na-egosi nnukwu mgbalị na ahụhụ ha nwere mgbe ha na-akwọ ụgbọ mmiri, ma ọ bụkwa okwu Igbo dị ndụ ma doo anya. Ihe odide ala peeji na-edebe nsụgharị siri ike karị nke βασανιζομένους.
- source_word: ἐναντίος αὐτοῖς
  choice: na-emegide ha
  rationale: N’ihe gbasara ifufe, okwu a na-egosi na ifufe na-efe ihu na ihu megide ụzọ ha na-aga.
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: n’ihe dị ka nche nke anọ nke abalị
  rationale: E debere usoro oge ochie ahụ n’ahịrị bụ isi, ebe περὶ pụtara ihe dị ka.
- source_word: ἔρχεται πρὸς αὐτούς
  choice: ọ bịakwutere ha
  rationale: Ọ bụ ezie na Grik ji historical present mee ka akụkọ dị ndụ, oge gara aga bụ ụzọ Igbo kacha eke si akọ ihe mere n’usoro akụkọ a.
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: na-aga ije n’elu oké osimiri
  rationale: A họọrọ “oké osimiri” maka θάλασσα ma debe “n’elu” maka ἐπί, kama ịgbanwe ya n’ahịrị bụ isi ka ọ bụrụ naanị mmiri.
- source_word: ἤθελεν παρελθεῖν αὐτούς
  choice: O bu n’obi ịgafe ha
  rationale: “Bu n’obi” na-egosi ebumnuche, ebe “ịgafe ha” na-ahapụ okwu ahụ ka ọ nwee ma nghọta nkịtị nke ịgafe ha ma mgbagwoju anya nke nwere ike izo aka n’igosipụta onwe Chineke.
theological_decisions:
- issue: Ihe “o bu n’obi ịgafe ha” pụtara
  choice: 'E debere okwu ahụ n’ụzọ nkịtị ma ghe oghe: “O bu n’obi ịgafe ha.”'
  alternative: Ọ chọrọ ịgafe ha n’ụzọ nkịtị; ma ọ bụ na okwu ahụ na-akpọghachi ebe Chineke “gafere” iji gosi onwe ya.
  rationale: Grik akọwaghị ebumnuche ahụ kpọmkwem. Ya mere, nsụgharị ahụ ekpebighị n’ahịrị bụ isi ma ọ bụ naanị ngagharị nkịtị ka ọ bụ ihe ngosi nke na-eme ka akụkọ Agba Ochie bata n’uche.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ okwu ndị na-ada ka Igbo nkịtị n’akụkọ, ma debe okwu oge ochie na mgbagwoju anya gbasara “ịgafe ha” site n’ihe odide ala peeji.
