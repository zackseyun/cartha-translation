- from: N’ihi na Herọd na-atụ Jọn egwu, ebe ọ maara na ọ bụ nwoke onye ezi omume na onye dị nsọ. Ọ na-echebekwa ya. Mgbe ọ bụla ọ nụrụ okwu ya, ihe gbagwojuru ya anya nke ukwuu[a]; ma ọ na-eji obi ụtọ ege ya ntị.
  to: N’ihi na Herọd na-atụ Jọn egwu, ebe ọ maara na ọ bụ nwoke bụ onye ezi omume na onye dị nsọ; ọ na-echebekwa ya. Mgbe ọ nụrụ Jọn, ọ na-enwe nnukwu mgbagwoju anya, ma ọ na-eji obi ụtọ ege ya ntị.
  rationale: The revision removes interpretive additions, more closely represents the Greek subject and verbal sense of πολλὰ ἠπόρει, and keeps the contrast between Herod’s perplexity and his glad listening. The textual-variant footnote remains anchored at the critical-text clause and states the alternative without preferring it.
