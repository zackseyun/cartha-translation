  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: ig
  text: N’ihi na Herọd na-atụ Jọn egwu, ebe ọ maara na ọ bụ nwoke bụ onye ezi omume na onye dị nsọ; ọ na-echebekwa ya. Mgbe ọ nụrụ Jọn, ọ na-enwe nnukwu mgbagwoju anya, ma ọ na-eji obi ụtọ ege ya ntị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: na-atụ Jọn egwu
  rationale: Oge ngwaa imperfect na-egosi na nke a bụ ọnọdụ na-aga n’ihu. Nkebiokwu a na-edobe isi ihe φοβέομαι pụtara, n’agbanyeghị na ihe gbara ya gburugburu na-egosikwa nkwanye ùgwù Herọd nwere n’ebe Jọn nọ.
- source_word: εἰδὼς
  choice: ebe ọ maara
  rationale: Nke a na-egosipụta participle ahụ n’ụzọ Igbo dị mma ma na-ahapụ njikọ ya na egwu Herọd na nchebe ọ na-enye Jọn ka ọ pụta ìhè.
- source_word: ἄνδρα δίκαιον καὶ ἅγιον
  choice: nwoke onye ezi omume na onye dị nsọ
  rationale: “Onye ezi omume” na-egosi ịdị kwụ ọtọ n’omume, ebe “onye dị nsọ” na-egosi àgwà e doro nsọ nye Chineke; “nwoke” na-anọchi ἄνδρα kpọmkwem.
- source_word: συνετήρει
  choice: na-echebekwa ya
  rationale: N’ọnọdụ akụkọ a, okwu ahụ na-egosi idebe Jọn pụọ ná mmerụ ahụ. “Na-echebekwa ya” bụ Igbo doro anya ma ghara ịpụta nanị ijide ya n’ụlọ mkpọrọ.
- source_word: ἀκούσας αὐτοῦ
  choice: Mgbe ọ bụla ọ nụrụ okwu ya
  rationale: Participle a na-ejikọta ịnụ Jọn na mmeghachi omume Herọd. “Okwu ya” na-eme ka Igbo doo anya na ihe a na-ekwu bụ ịnụ Jọn ka ọ na-ekwu okwu, ọ bụghị naanị ịnụ ụda olu ya.
- source_word: πολλὰ ἠπόρει
  choice: ihe gbagwojuru ya anya nke ukwuu
  rationale: A họọrọ ọgụgụ SBLGNT ἠπόρει, nke pụtara ịnọ ná mgbagwoju anya ma ọ bụ amaghị ihe a ga-eme; πολλὰ na-eme ka ogo mgbagwoju anya ahụ sie ike.
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: ọ na-eji obi ụtọ ege ya ntị
  rationale: Nke a na-egosi na Herọd ji obi ụtọ ma ọ bụ mmasị na-ege Jọn ntị. “Ma” na-eme ka esemokwu dị n’etiti mgbagwoju anya ya na obi ụtọ o ji ege ntị pụta ìhè.
theological_decisions:
- issue: Ọgụgụ dị iche iche n’akụkụ na-akọ mmeghachi omume Herọd mgbe ọ nụrụ Jọn
  choice: 'Ịgbaso SBLGNT: “ihe gbagwojuru ya anya nke ukwuu” (ἠπόρει)'
  alternative: “ọ mere ọtụtụ ihe” (ἐποίει)
  rationale: 'Ọgụgụ ederede nkatọ na-edobe esemokwu dị n’ime Herọd: okwu Jọn na-agbagwoju ya anya, ma ọ ka ji obi ụtọ na-ege ya ntị. E tinyere ọgụgụ ọzọ dị mkpa n’ala ala peeji kama idozi esemokwu ahụ n’ime nsụgharị.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A nọgidere na imperfect Greek site n’iji “na-” na “mgbe ọ bụla” gosi omume ma ọ bụ ọnọdụ na-aga n’ihu ugboro ugboro. E debere mgbagwoju anya na obi ụtọ Herọd ọnụ n’emeghị ka esemokwu ahụ laa n’iyi.
