- from: Eze ahụ wee nwee mwute nke ukwuu, ma n’ihi iyi ndị ọ ṅụrụ nakwa ndị ya na ha nọ na-eri nri[a], ọ chọghị ịjụ ya[b].
  to: Eze ahụ wee nwee nnukwu mwute; n’ihi iyi ndị ọ ṅụrụ na ndị ya na ha nọ na-eri nri[a], ọ chọghị ịjụ arịrịọ ya[b].
  rationale: The revision removes the non-explicit adversative conjunction, improves the natural clause structure, clarifies that the refusal concerns the girl's request, and refines the historical-meal footnote. It retains the source's causal linkage and does not resolve beyond the text any debated nuance of the participle.
