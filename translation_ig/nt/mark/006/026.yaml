  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: ig
  text: Eze ahụ wee nwee nnukwu mwute; n’ihi iyi ndị ọ ṅụrụ na ndị ya na ha nọ na-eri nri[a], ọ chọghị ịjụ arịrịọ ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, Grik kwuru “ndị so ya dina eri nri.” Ọ na-ekwu maka ndị ọbịa nọ n’oriri ahụ, bụ ndị na-adịkarị dina eri nri dịka omenala oge ahụ si dị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ chọghị ịghara imezu ihe o kwere ya ná nkwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περίλυπος
  choice: nwee mwute nke ukwuu
  rationale: Nke a na-egosi oke mwute dị n’okwu Grik ahụ n’asụsụ Igbo doro anya ma dịkwa ugwu.
- source_word: γενόμενος
  choice: wee nwee
  rationale: Ọ na-egosi na eze ahụ banyere n’ọnọdụ mwute ahụ n’ihi ihe nwa agbọghọ ahụ rịọrọ.
- source_word: βασιλεὺς
  choice: Eze ahụ
  rationale: “Eze” bụ ntụgharị nkịtị nke βασιλεύς; “ahụ” na-eme ka ntụaka ya nye Herọd n’akụkọ a doo anya.
- source_word: διὰ τοὺς ὅρκους
  choice: n’ihi iyi ndị ọ ṅụrụ
  rationale: διά na accusative na-egosi ihe kpatara omume ahụ; “iyi ndị ọ ṅụrụ” bụ ụzọ Igbo si ekwu okwu a n’ụzọ ebumpụta ụwa.
- source_word: ἀνακειμένους
  choice: ndị ya na ha nọ na-eri nri
  rationale: Nke a na-egosi ndị bịara oriri ahụ n’Igbo dị mfe nghọta; nkọwa ala peeji na-edebe eziokwu na Grik kpọrọ ọnọdụ ha ji eri nri.
- source_word: οὐκ ἠθέλησεν
  choice: ọ chọghị
  rationale: Nke a na-edebe echiche nke ọchịchọ ma ọ bụ enweghị ọchịchọ, ọ bụghị enweghị ike.
- source_word: ἀθετῆσαι αὐτήν
  choice: ịjụ ya
  rationale: N’ọnọdụ a, okwu ahụ pụtara na ọ chọghị ịjụ nwanyị ahụ ma ọ bụ ịkwụsị imezu ihe o kwere ya ná nkwa; ntụgharị ahụ na-edebe αὐτήν dị ka “ya.”
theological_decisions:
- issue: Mmekọrịta dị n’etiti mwute eze ahụ na mkpebi ya
  choice: E ji “ma” gosi ọdịiche dị n’etiti oke mwute ya na enweghị ọchịchọ ya ịjụ nwa agbọghọ ahụ.
  alternative: 'Ịsụgharị participle ahụ n’enweghị okwu na-egosi ọdịiche: “Eze ahụ wee nwee mwute nke ukwuu, n’ihi…”'
  rationale: 'Ọ bụ ezie na “ma” adịghị n’ederede Grik dịka conjunction, usoro ahịrịokwu ahụ na-egosi ọdịiche dị n’etiti mwute eze ahụ na ihe o mesịrị họrọ ime. Nke a na-eme ka Igbo bụrụ nke ebumpụta ụwa n’enweghị ịgbanwe ihe kpatara mkpebi ya: iyi ya na ndị nọ n’oriri.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Ndị ya na ha nọ na-eri nri” bụ okwu nkịtị nye ndị na-agụ akwụkwọ taa, ebe nkọwa ala peeji na-echekwa ọnọdụ iri nri nke okwu Grik ahụ kpọrọ kpọmkwem.
