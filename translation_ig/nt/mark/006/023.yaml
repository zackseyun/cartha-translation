    issue: The expression “ọ bụrụgodị na ọ bụ ihe ruru ọkara alaeze m” introduces an unwarranted concessive nuance.
    rationale: The Greek ἕως ἡμίσους τῆς βασιλείας μου marks a limit of extent, “up to half of my kingdom.” It does not say “even if it amounts to half.”
