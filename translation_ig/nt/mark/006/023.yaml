  source_fidelity: 'The main clause and indefinite promise are conveyed accurately. However, “ọ bụrụgodị na ọ bụ ihe ruru” adds a concessive sense (“even if it is as much as”) that is not present in ἕως ἡμίσους, which simply sets the upper limit: “up to half.”'
  naturalness: “Ọ ṅụkwara ya iyi” and “Ihe ọ bụla ị ga-arịọ m, aga m enye gị” are natural Standard Igbo in this narrative register. The direct phrase “ruo ọkara alaeze m” is both more idiomatic and closer to the Greek than the expanded concessive wording.
  terminology: “Ịṅụ iyi” appropriately renders ὀμνύω, and “alaeze m” is a suitable nontechnical rendering of βασιλεία in this royal speech. No theological reinterpretation is introduced.
  issues:
