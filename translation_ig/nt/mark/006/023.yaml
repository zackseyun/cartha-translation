  text: καὶ ὤμοσεν ⸀αὐτῇ· ⸂Ὅ τι⸃ ἐάν με αἰτήσῃς δώσω σοι ἕως ἡμίσους τῆς βασιλείας μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: ig
  text: Ọ ṅụkwara ya iyi, sị, “Ihe ọ bụla ị ga-arịọ m, aga m enye gị, ruo ọkara alaeze m.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'N’asụsụ Grik: “ruo ọkara alaeze m.” Nke a bụ ụdị nkwa ndị eze ji ekwubiga ihe ókè iji gosi na ha dị njikere inye nnukwu onyinye.'
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν
  choice: ṅụkwara ... iyi
  rationale: “Ịṅụ iyi” bụ ụzọ Igbo nkịtị ma dị ùgwù si egosipụta ịṅụ iyi siri ike; “-kwara” na-ejikọ omume a na ihe e kwuru n’amaokwu gara aga.
- source_word: αὐτῇ
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’ebe nwa agbọghọ ahụ nọ dịka onye Herọd ṅụrụ iyi nye.
- source_word: Ὅ τι ἐάν
  choice: Ihe ọ bụla
  rationale: Ọ na-echekwa echiche nke arịrịọ na-enweghị ihe a kapịrị ọnụ, ya bụ, “ihe ọbụla.”
- source_word: με αἰτήσῃς
  choice: ị ga-arịọ m
  rationale: “Ịrịọ m” bụ okwu Igbo doro anya maka ịrịọ mmadụ ihe; ọdịdị “ga-” na-arụ ọrụ nke ọma n’ahịrịokwu ọnọdụ a.
- source_word: δώσω σοι
  choice: aga m enye gị
  rationale: Ọ na-egosipụta nkwa ahụ n’ụzọ doro anya ma kwekọọ n’ọdịnihu nke ngwaa Grik.
- source_word: ἕως ἡμίσους
  choice: ọ bụrụgodị na ọ bụ ihe ruru ọkara
  rationale: Nke a na-egosipụta oke kacha elu nke onyinye ahụ n’Igbo eke, na-enweghị ime ka ἕως bụrụ okwu oge.
- source_word: τῆς βασιλείας μου
  choice: alaeze m
  rationale: N’ọnọdụ okwu eze a, “alaeze m” na-egosi ókèala ọchịchị ya, ọ bụghị echiche nkà mmụta okpukpe banyere ọchịchị Chineke.
theological_decisions:
- issue: Ihe βασιλεία pụtara n’okwu Herọd
  choice: alaeze
  alternative: ọchịchị eze / ikike ịchị
  rationale: βασιλεία nwere ike ịpụta ọchịchị ma ọ bụ ókèala eze, ma n’okwu nkwa a na-ekwubiga ihe ókè, “alaeze” na-enye nghọta kacha kwekọọ n’ọnọdụ akụkọ ahụ n’enweghị itinye nkọwa okpukpe pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. Ahịrịokwu ahụ na-echekwa ịdị ukwuu nke iyi Herọd na ọdịdị nkwupụta eze ahụ, ma na-akọwa ἕως ἡμίσους n’ụzọ Igbo na-ada eke.
