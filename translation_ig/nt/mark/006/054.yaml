  text: καὶ ἐξελθόντων αὐτῶν ἐκ τοῦ πλοίου ⸀εὐθὺς ἐπιγνόντες αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/054.yaml
  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: ig
  text: Mgbe ha si n’ụgbọ mmiri pụta[a], ndị nọ n’ebe ahụ matara ya ozugbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ na-esochikwu Grik anya, “Mgbe ha si n'ụgbọ mmiri pụta, ozugbo ha matara ya.” Grik ekwughị kpọmkwem ndị matara ya; ihe gbara okwu ahụ gburugburu na-egosi na ọ bụ ndị nọ n'ebe ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: Mgbe ha si … pụta
  rationale: Nkebiokwu a dị n'ụdị genitive absolute ma na-egosi oge; nsụgharị a na-egosipụta ya n'Igbo nkịtị dị ka ‘mgbe ha … pụtara.’
- source_word: πλοίου
  choice: ụgbọ mmiri
  rationale: N'ọnọdụ a, πλοῖον bụ ụgbọ e ji aga n'elu mmiri, nke yikarịrị ụgbọ nta a na-eji n'Ọdọ Mmiri Galili; ‘ụgbọ mmiri’ bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe.
- source_word: εὐθὺς
  choice: ozugbo
  rationale: ‘Ozugbo’ na-edobe ike okwu ahụ ma na-egosipụta ngwa ngwa nke Mak na-ekwukarị.
- source_word: ἐπιγνόντες
  choice: matara
  rationale: N'ebe a, ἐπιγινώσκω pụtara ịmata onye a hụworo ma ọ bụ onye a maara; ‘matara’ bụ ụzọ Igbo kachasị eke isi kwuo ya.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs dịka akụkọ gbara ya gburugburu si egosi.
- source_word: implicit subject of ἐπιγνόντες
  choice: ndị nọ n’ebe ahụ
  rationale: Grik ekwughị aha ndị matara ya kpọmkwem, ma usoro ahịrịokwu na amaokwu na-esote na-egosi na ọ bụ ndị bi ma ọ bụ ndị nọ n'ebe ahụ. Ịkpọ ha ‘ndị nọ n’ebe ahụ’ na-eme ka Igbo doo anya n'etinyeghị nkọwa ozizi.
theological_decisions:
- issue: Ndị bụ ndị matara Jizọs
  choice: ndị nọ n’ebe ahụ matara ya
  alternative: ha matara ya, na-ahapụ onye ‘ha’ na-anọchi anya ya ka ọ ghara ido anya
  rationale: Nke a bụ mkpebi gbasara usoro asụsụ na ọnọdụ akụkọ, ọ bụghị mkpebi ozizi. ἐπιγνόντες dị na nominative plural, ya mere ọ naghị adaba n'ụzọ nkịtị na αὐτῶν nke dị na genitive absolute. Amaokwu na-esote na-egosi na ndị mpaghara ahụ bụ ndị matara Jizọs ma gbaa gburugburu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta, dee ya. A họọrọ ‘ndị nọ n’ebe ahụ’ kama okwu pụrụ ịpụta naanị ndị nwe obodo, n'ihi na isi Grik ekwughị kpọmkwem ụdị ndị ahụ.
