id: MRK.6.30
reference: Mark 6:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: ig
  text: Ndịozi ahụ gbakọtara n’ebe Jizọs nọ, kọọrọ ya ihe niile ha mere na ihe niile ha kụziri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάγονται
  choice: gbakọtara
  rationale: Oge ugbu a e ji kọọ akụkọ n’asụsụ Grik na-arụ ọrụ dị ka oge gara aga n’ebe a. “Gbakọtara” na-egosi na ha bịara ọnụ dịka otu ìgwè.
- source_word: οἱ ἀπόστολοι
  choice: Ndịozi ahụ
  rationale: N’Oziọma Mak, okwu a na-akọwa mmadụ iri na abụọ ahụ n’ọrụ Jizọs zipụrụ ha; “ndịozi” bụ okwu Igbo a maara nke ọma maka aha na ọrụ a.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: n’ebe Jizọs nọ
  rationale: πρός na-egosi na ha bịakwutere Jizọs. N’usoro “gbakọtara n’ebe Jizọs nọ,” ntụgharị a na-ada nke ọma n’Igbo ma na-echekwa echiche nke ịbịakwute ya.
- source_word: ἀπήγγειλαν
  choice: kọọrọ
  rationale: Ngwaa a pụtara inye onye ọzọ akụkọ ma ọ bụ akụkọ banyere ihe mere; “kọọrọ ya” dabara n’ọnọdụ ndịozi ahụ laghachiri ịgwa Jizọs ọrụ ha rụrụ.
- source_word: πάντα ὅσα ἐποίησαν
  choice: ihe niile ha mere
  rationale: Nke a na-echekwa ike zuru ezu nke πάντα na nkebi njikọ ὅσα n’Igbo doro anya.
- source_word: ὅσα ἐδίδαξαν
  choice: ihe niile ha kụziri
  rationale: Ikwughachi “ihe niile” na-echekwa nhazi yiri ibe ya nke nkebi Grik abụọ ahụ ma na-egosi na akụkọ ha metụtara ma omume ha ma nkuzi ha.
theological_decisions:
- issue: Aha e ji kpọọ ndị na-eso ụzọ dịka ἀπόστολοι
  choice: Ndịozi ahụ
  alternative: ndị e zipụrụ; ndị ozi
  rationale: “Ndịozi” na-echekwa aha ọrụ ndị ahụ Jizọs zipụrụ n’enweghị ime ka ọ bụrụ naanị ndị na-ebuga ozi n’ozuzu.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro akụkọ na myirịta dị n’etiti “ihe niile ha mere” na “ihe niile ha kụziri,” n’enweghị ịgbakwunye nkọwa ụka pụrụ iche.
