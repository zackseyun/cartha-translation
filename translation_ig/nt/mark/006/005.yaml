source:
  edition: SBLGNT
  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: ig
  text: Ọ pụghịkwa ịrụ ọrụ ebube ọ bụla n'ebe ahụ[a], ma e wezụga na ọ bikwasịrị ndị ọrịa ole na ole aka ma gwọọ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ọrụ ike ọ bụla” ma ọ bụ “ọrụ ọ bụla nke ike.” Okwu Grik ahụ pụtara n'ụzọ nkịtị “ike ọ bụla”; Mak ji ya akọwa ọrụ ebube.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: Ọ pụghị
  rationale: Nke a na-egosipụta n'ụzọ doro anya enweghị ike nke ngwaa δύναμαι n'okpuru ngọnarị, na-emeghị ka ọ bụrụ nanị na ọ chọghị ime ya.
- source_word: ποιῆσαι οὐδεμίαν δύναμιν
  choice: ịrụ ọrụ ebube ọ bụla
  rationale: N'okwu Mak, δύναμις na-ezo aka n'ọrụ pụrụ iche nke ike Chineke. “Ọrụ ebube” bụ okwu Igbo doro anya ma bụrụkwa nke mmadụ niile na-aghọta; nkọwa ala peeji na-echekwa njikọ okwu Grik ahụ na “ike.”
- source_word: εἰ μὴ
  choice: ma e wezụga na
  rationale: Ọ na-ewebata ihe e wepụrụ n'okwu ngọnarị bu ya ụzọ, ma mee ka njikọ ahịrịokwu ahụ doo anya n'Igbo.
- source_word: ὀλίγοις ἀρρώστοις
  choice: ndị ọrịa ole na ole
  rationale: Nke a na-egosipụta ma ọnụ ọgụgụ dị nta ma ọnọdụ ndị ahụ n'Igbo nkịtị.
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: o bikwasịrị ... aka
  rationale: Nke a bụ ụzọ Igbo e si ekwu omume mmadụ ịbikwasị onye ọzọ aka, ma na-echekwa omume anụ ahụ dị n'okwu Grik.
- source_word: ἐθεράπευσεν
  choice: gwọọ ha
  rationale: “Ịgwọ” bụ okwu Igbo kwesịrị ekwesị maka θεραπεύω n'ọnọdụ ọgwụgwọ, ebe “ha” na-eme ka ndị a gwọrọ doo anya.
theological_decisions:
- issue: Ma a ga-eme ka οὐκ ἐδύνατο dị nro ka ọ ghara ịdị ka e nwere ihe Jizọs na-apụghị ime
  choice: Ọ pụghịkwa ịrụ ọrụ ebube ọ bụla n'ebe ahụ
  alternative: Ọ rụghị ọrụ ebube ọ bụla n'ebe ahụ / Ọ chọghị ịrụ ọrụ ebube ọ bụla n'ebe ahụ
  rationale: Okwu Grik kwuru enweghị ike n'ụzọ doro anya site na δύναμαι ya na ngọnarị. Nsụgharị ahụ na-echekwa esemokwu nkà mmụta okpukpe dị n'amaokwu ahụ kama ịkọwa ya dịka naanị enweghị ọchịchọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ọrụ ebube” ka ahọrọ maka ịdị mma n'Igbo nkịtị, ebe nkọwa ala peeji na-echekwa ihe okwu δύναμις pụtara n'ụzọ nkịtị.
