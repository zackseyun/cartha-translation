review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the maternal designation, the named brothers (including Joses), the sisters' local presence, and the unresolved familial relationship. However, ‘ọkwá nkà osisi’ denotes a position or office rather than the artisan himself, and ‘sụọ ngọngọ n’ihi ya’ is less direct and natural here than the contextual sense of taking offense at him.
  naturalness: Replace the occupational phrase with the ordinary Standard Igbo agentive expression ‘onye na-arụ osisi.’ Render the final reaction idiomatically as ‘Ha were ya iwe.’
  terminology: ‘nwanne’ and ‘ụmụnne ya ndị inyom’ appropriately preserve the ordinary senses of ἀδελφός and ἀδελφαί without adjudicating later familial interpretations. ‘Nwa Meri’ and the retained form ‘Joses’ are suitable. The revised note on kinship is more natural and avoids implying a specific doctrinal resolution.
  issues:
  - severity: medium
    issue: ‘ọkwá nkà osisi’ is not an appropriate designation for τέκτων.
    rationale: Ọkwá normally denotes a rank, post, or office. τέκτων identifies a worker/artisan. ‘Onye na-arụ osisi’ naturally identifies a carpenter while retaining the traditional and contextually likely sense.
  - severity: low
    issue: The rendering and note for ἐσκανδαλίζοντο ἐν αὐτῷ are overly literal and somewhat awkward.
    rationale: In this context the verb expresses offense or rejection in response to Jesus, not physical stumbling. ‘Ha were ya iwe’ is natural Standard Igbo; the footnote can retain the literal stumbling image as an alternative.
  - severity: low
    issue: Footnote a's expressions for alternative kinship are awkward and overly specific.
    rationale: ‘Ndị ikwu ya nwoke/anyị nwanyị’ is unnatural phrasing, and ‘ụmụ nne/nna ọzọ’ is unclear. A concise note that the Greek may be understood as ‘ndị ikwu,’ while noting some traditions understand step-siblings, preserves the issue without settling it.
  revised_text: “Onye a ọ́ bụghị onye na-arụ osisi, nwa Meri, na nwanne Jemis, Joses, Judas na Saịmọn?[a] Ụmụnne ya ndị inyom ọ́ nọghịkwa n’ebe a n’etiti anyị?” Ha were ya iwe.[b]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ikwu.” Okwu Grik ndị a na-apụtakarị ụmụnne, ma ụfọdụ ọdịnala Ndị Kraịst na-aghọta ha ebe a dịka ndị ikwu nso ma ọ bụ ụmụnne site n’alụmdi na nwunye ọzọ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Ha sụrụ ngọngọ n’ihi ya.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the occupational noun, improves the contextual and idiomatic rendering of the final clause, and recasts both notes in natural Standard Igbo. It preserves the Greek's ordinary familial vocabulary and leaves disputed family relationships unresolved.
