revisions:
- from: “Onye a ọ́ bụghị ọkwá nkà osisi, nwa Meri, na nwanne Jemis, Joses, Judas na Saịmọn?[a] Ụmụnne ya ndị inyom ọ́ nọghịkwa n’ebe a n’etiti anyị?” Ha wee sụọ ngọngọ n’ihi ya.[b]
  to: “Onye a ọ́ bụghị onye na-arụ osisi, nwa Meri, na nwanne Jemis, Joses, Judas na Saịmọn?[a] Ụmụnne ya ndị inyom ọ́ nọghịkwa n’ebe a n’etiti anyị?” Ha were ya iwe.[b]
  rationale: The revision corrects the occupational noun, improves the contextual and idiomatic rendering of the final clause, and recasts both notes in natural Standard Igbo. It preserves the Greek's ordinary familial vocabulary and leaves disputed family relationships unresolved.
