id: MRK.6.3
reference: Mark 6:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: ig
  text: “Onye a ọ́ bụghị onye na-arụ osisi, nwa Meri, na nwanne Jemis, Joses, Judas na Saịmọn?[a] Ụmụnne ya ndị inyom ọ́ nọghịkwa n’ebe a n’etiti anyị?” Ha were ya iwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ikwu.” Okwu Grik ndị a na-apụtakarị ụmụnne, ma ụfọdụ ọdịnala Ndị Kraịst na-aghọta ha ebe a dịka ndị ikwu nso ma ọ bụ ụmụnne site n’alụmdi na nwunye ọzọ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Ha sụrụ ngọngọ n’ihi ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: ọkwá nkà osisi
  rationale: Okwu Grik a na-ezo aka n’akaọrụ ma ọ bụ onye na-ewu ihe; n’ọnọdụ a, nghọta ọdịnala na nke yiri ka ọ kachasị dabara bụ onye na-arụ ọrụ osisi. ‘Ọkwá nkà osisi’ bụ Igbo doro anya ma dị mfe nghọta.
- source_word: υἱὸς τῆς Μαρίας
  choice: nwa Meri
  rationale: Nke a na-edobe njirimara pụrụ iche e ji nne ya kpọọ ya n’okwu ndị obodo ahụ, n’etinyeghị nkọwa ma ọ bụ mkparị na-adịghị n’ederede.
- source_word: ἀδελφὸς / ἀδελφαὶ
  choice: nwanne / ụmụnne ya ndị inyom
  rationale: Ndị a bụ ihe okwu Grik ahụ na-apụtakarị. E debere nghọta nkịtị ahụ n’ederede, ebe e tinyere ohere nke ‘ndị ikwu’ ma ọ bụ ụmụ nne/nna ọzọ n’ala peeji.
- source_word: Ἰωσῆτος
  choice: Joses
  rationale: E degharịrị ụdị aha Grik dị n’amaokwu a ka ọ ghara ịgbanwe bụrụ Josef.
- source_word: ὧδε πρὸς ἡμᾶς
  choice: n’ebe a n’etiti anyị
  rationale: Nke a na-egosi na ụmụnne ya ndị inyom bi ma ọ bụ nọ n’otu obodo ahụ n’etiti ndị na-ekwu okwu.
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: Ha wee sụọ ngọngọ n’ihi ya
  rationale: Nke a na-edobe ihe atụ dị n’okwu Grik banyere ịsụ ngọngọ, ma n’ọnọdụ a ọ pụtara na ha jụrụ ya ma ọ bụ were ya iwe.
theological_decisions:
- issue: Mmekọrịta ‘nwanne’ na ‘ụmụnne ndị inyom’ ha na Jizọs
  choice: E jiri okwu ezinụlọ ndị a na-ejikarị eme ihe, n’akwaghị ikpe ma ha bụ ụmụ otu nne na nna, ụmụ nne/nna ọzọ, ma ọ bụ ndị ikwu nso.
  alternative: A pụrụ ịsụgharị ha dịka ‘ndị ikwu’ ma ọ bụ ghọta ha dịka ụmụ nne/nna ọzọ.
  rationale: ἀδελφός na ἀδελφή na-apụtakarị nwanne nwoke na nwanne nwanyị, ma ọdịnala Ndị Kraịst akọwawo mmekọrịta ahụ n’ụzọ dị iche iche. Nsụgharị ekwesịghị idozi esemokwu ahụ n’aha ederede.
- issue: Ike mmekọrịta mmadụ dị n’okwu ‘nwa Meri’
  choice: A sụgharịrị ya ozugbo dịka njirimara ndị obodo ji kpọọ ya.
  alternative: A pụrụ ịghọta ya dịka njirimara nkịtị ma ọ bụ dịka okwu nwere ntakịrị mkparị.
  rationale: Ederede ahụ akọwaghị kpọmkwem ma okwu a bụ mkparị; ya mere, a hapụrụ nghọta abụọ ahụ ka ha dị.
- issue: Ihe ἐσκανδαλίζοντο ἐν αὐτῷ pụtara
  choice: ‘Ha wee sụọ ngọngọ n’ihi ya,’ nke na-edobe ihe atụ Grik.
  alternative: ‘Ha wee were ya iwe’ ma ọ bụ ‘ha jụrụ ya.’
  rationale: Okwu a abụghị ịsụ ngọngọ n’ụzọ nkịtị ebe a, kama ọ na-egosi na ihe banyere Jizọs ghọrọ ha ihe mgbochi nke mere ha ji jụ ya; ala peeji na-eme ka nke a doo anya.
translation_notes:
  register: Standard Igbo; okwu ahụ bụ nke dị ùgwù ma bụrụkwa nke ndị nkịtị nwere ike ịghọta. E ji ‘ọkwá nkà osisi’ mee ka ụdị ọrụ τέκτων doo anya, ma e chekwara ihe atụ nke ‘ịsụ ngọngọ’ n’ahịrị ikpeazụ. Akara ala peeji [a] na [b] dị n’ederede ma kwekọọ n’ala peeji.
