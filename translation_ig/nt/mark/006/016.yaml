source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸀ὁ Ἡρῴδης ⸀ἔλεγεν· Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην, οὗτος ⸀ἠγέρθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/016.yaml
  text: But when Herod heard it[a], he said, “John, whom I beheaded[b], has been raised.”
translation:
  language: ig
  text: Ma mgbe Herọd nụrụ nke a, ọ sịrị[a], “Jọn ahụ m gbupụrụ isi—ọ bụ ya ka a kpọlitere[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ nọ na-ekwu,” ma ọ bụ “ọ na-ekwukarị.” Ụdị ngwaa Grik e ji mee ihe nwere ike igosi okwu na-aga nʼihu ma ọ bụ nke a na-ekwughachi.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “o biliri.” Ngwaa Grik dị na passive; ya bụ, “a kpọlitere ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: mgbe Herọd nụrụ nke a
  rationale: A tụgharịrị participle aorist ahụ dị ka ahịrịokwu oge ka Igbo wee na-aga were were; “nke a” na-anọchi ihe Herọd nụrụ nʼakụkọ gbara ya gburugburu.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi obere mgbanwe ma ọ bụ ntụgharị nʼakụkọ ahụ, dịka δέ si arụ ọrụ ebe a.
- source_word: ἔλεγεν
  choice: ọ sịrị[a]
  rationale: Nʼakụkọ Igbo, “ọ sịrị” bụ ụzọ dị mfe ma bụrụkwa nke e ji ekwu okwu nʼoge gara aga. Akara ala peeji na-edebe ohere na imperfect ahụ nwere ike igosi okwu na-aga nʼihu ma ọ bụ nke a na-ekwughachi.
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: Jọn ahụ m gbupụrụ isi
  rationale: Nhazi a bụ Igbo doro anya ma na-edebe aha Jọn na nkọwa kpọmkwem na Herọd gbupụrụ ya isi.
- source_word: οὗτος
  choice: ọ bụ ya
  rationale: Cleft Igbo “ọ bụ ya” na-edebe nkwusi ike nke demonstrative οὗτος nʼụzọ na-ada nke ọma nʼokwu ọnụ.
- source_word: ἠγέρθη
  choice: ka e si nʼọnwụ kpọlite[b]
  rationale: Nhazi a na-edebe olu passive nke ngwaa Grik, na-egosikwa nke ọma na ihe a na-ekwu bụ ịkpọlite Jọn site nʼọnwụ, nʼagbanyeghị na onye mere ya ekwughị aha.
theological_decisions:
- issue: Otu a ga-esi sụgharịa ἠγέρθη nʼokwu gbasara isi nʼọnwụ bilie
  choice: e si nʼọnwụ kpọlite
  alternative: o si nʼọnwụ bilie
  rationale: Ngwaa Grik dị na passive. Nhọrọ a na-edebe passive ahụ na onye mere omume ahụ nʼenweghị aha, kama ịgbanwe okwu Herọd ka ọ bụrụ active ma ọ bụ kọwaa onye kpọlitere Jọn.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta. “Gbupụrụ isi” bụ okwu kpọmkwem ma bụrụ nke mmadụ nkịtị ga-aghọta; “ọ bụ ya” na-echekwa nkwusi ike nke οὗτος nʼenweghị nhazi siri ike nke Grik.
