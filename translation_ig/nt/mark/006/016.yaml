revisions:
- from: Ma mgbe Herọd nụrụ nke a, ọ sịrị[a], “Jọn ahụ m gbupụrụ isi—ọ bụ ya ka e si nʼọnwụ kpọlite[b].”
  to: Ma mgbe Herọd nụrụ nke a, ọ sịrị[a], “Jọn ahụ m gbupụrụ isi—ọ bụ ya ka a kpọlitere[b].”
  rationale: The revision replaces an unnatural and overexpanded passive construction with “ọ bụ ya ka a kpọlitere.” This retains the emphasis of οὗτος (“ọ bụ ya”), preserves the passive voice of ἠγέρθη, and avoids adding “from death,” which is contextually understandable but not stated in the Greek. Footnote b is aligned with the revised main text and retains the relevant active alternative.
