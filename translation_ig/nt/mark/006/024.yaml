review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the sequence of her departure, her deliberative question, her mother, and the literal request for John's head. However, “Mgbe ọ pụrụ” normally means “when she went out” and can leave the completed, antecedent force of the aorist participle less explicit. “Mgbe ọ pụtachara” naturally marks that she had gone out before speaking.
  naturalness: “Mgbe ọ pụtachara, ọ sịrị nne ya” is idiomatic Standard Igbo and retains the source sequence without adding detail. The remaining wording is clear and appropriately direct for the narrative.
  terminology: “Jọn onye na-eme baptizim” translates the identifying participle by its meaning. Lowercasing the descriptive phrase avoids making it look like a modern denominational title while retaining its function as John's epithet.
  issues:
  - severity: low
    issue: Temporal wording of ἐξελθοῦσα
    rationale: “Mgbe ọ pụrụ” can mean “when she went out”; “Mgbe ọ pụtachara” more clearly represents departure as completed before the speech.
  - severity: low
    issue: Capitalization of the participial epithet
    rationale: “Onye Na-eme Baptizim” is understandable, but sentence-style lowercase in “Jọn onye na-eme baptizim” is more natural for a transparently translated descriptive epithet.
  revised_text: Mgbe ọ pụtachara, ọ sịrị nne ya, “Gịnị ka m ga-arịọ?” Nne ya sịrị ya, “Isi Jọn onye na-eme baptizim.”
