  to: Mgbe ọ pụtachara, ọ sịrị nne ya, “Gịnị ka m ga-arịọ?” Nne ya sịrị ya, “Isi Jọn onye na-eme baptizim.”
  rationale: The revision clarifies the prior action expressed by the Greek aorist participle and regularizes the participial epithet in natural Standard Igbo. It preserves the deliberative question and the stark literal reference to John’s head.
