  text: ⸀καὶ ἐξελθοῦσα εἶπεν τῇ μητρὶ αὐτῆς· Τί ⸀αἰτήσωμαι; ἡ δὲ εἶπεν· Τὴν κεφαλὴν Ἰωάννου τοῦ ⸀βαπτίζοντος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: ig
  text: Mgbe ọ pụtachara, ọ sịrị nne ya, “Gịnị ka m ga-arịọ?” Nne ya sịrị ya, “Isi Jọn onye na-eme baptizim.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: Mgbe ọ pụrụ
  rationale: Aorist participle a na-egosi na ọ pụtara tupu ya agwa nne ya okwu; nsụgharị a na-egosi usoro oge ahụ n’Igbo dị mfe.
- source_word: Τί αἰτήσωμαι
  choice: Gịnị ka m ga-arịọ?
  rationale: Subjunctive a bụ ajụjụ onye na-atụle ihe o kwesịrị ịrịọ; ‘ga-arịọ’ na-egosipụta echiche ahụ n’Igbo nkịtị.
- source_word: μητρὶ αὐτῆς
  choice: nne ya
  rationale: Nke a na-asụgharị possessive construction ahụ ozugbo n’ụzọ Igbo si ekwu ya.
- source_word: κεφαλήν
  choice: Isi
  rationale: E debere ihe ọ rịọrọ kpọmkwem n’enweghị ikpuchi obi ọjọọ dị na ya.
- source_word: τοῦ βαπτίζοντος
  choice: Onye Na-eme Baptizim
  rationale: Present participle a ghọrọ aha e ji amata Jọn site n’ọrụ ọ na-arụ; okwu a na-egosipụta ihe Grik pụtara n’enweghị itinye aha otu ụka nke oge a.
theological_decisions:
- issue: Otú e si asụgharị aha e ji amata Jọn, βαπτίζων
  choice: Onye Na-eme Baptizim
  alternative: Onye Baptist
  rationale: A họọrọ nkọwa ọrụ participle Grik ahụ kama iji aha ọdịnala nke nwere ike ịdị ka aha otu ụka n’Igbo nke oge a.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma doo ndị nkịtị anya. A hapụrụ ‘isi’ n’ụzọ doro anya, ma jiri ‘Onye Na-eme Baptizim’ kọwaa epithet Jọn n’enweghị mgbakwunye nkwenkwe otu ụka.
