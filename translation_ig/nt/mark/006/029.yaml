  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: ig
  text: Mgbe ndị na-eso ụzọ ya nụrụ, ha bịara buru ozu ya ma tinye ya n’ili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Mgbe ... nụrụ ihe ahụ
  rationale: Aorist participle ahụ nwere ọrụ oge n’ebe a. ‘Mgbe ... nụrụ ihe ahụ’ bụ Igbo dị mfe ma na-egosi usoro ihe ndị mere; ‘ihe ahụ’ na-eme ka ngwaa ‘nụrụ’ zuo oke n’Igbo n’agbanyeghị na Grik ekwughị ihe a nụrụ kpọmkwem.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa μαθηταί, ma na-echekwa mmekọrịta ha na onye nkuzi ha. N’ọnọdụ a, ‘ya’ na-ezo aka na Jọn Onye Na-eme Baptizim.
- source_word: ἦλθον
  choice: ha bịara
  rationale: Ọ bụ ntụgharị nkịtị nke ἦλθον, na-egosikwa na ha rutere ebe ozu ahụ dị.
- source_word: ἦραν
  choice: buru
  rationale: αἴρω nwere ike ịpụta ibuli ma ọ bụ iburu pụọ. ‘Buru’ na-egosi omume ibuli ozu ahụ ma were ya gaa, n’ụzọ dị nkenke ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: πτῶμα
  choice: ozu
  rationale: πτῶμα na-ezo kpọmkwem n’ahụ onye nwụrụ anwụ. ‘Ozu’ na-echekwa nkọwa ahụ nke ọma karịa ‘ahụ,’ ya mere ihe odide ala peeji adịghị mkpa.
- source_word: ἔθηκαν
  choice: lie
  rationale: Ọ bụ ezie na τίθημι pụtara ‘dọba’ ma ọ bụ ‘tinye,’ n’ọnọdụ olili onye nwụrụ anwụ, ‘lie’ bụ okwu Igbo kachasị pụta ihe ma dịkwa ugwu.
- source_word: ἐν μνημείῳ
  choice: n’ili
  rationale: μνημεῖον ebe a bụ ebe a na-eli ozu. ‘Ili’ bụ okwu Igbo nkịtị, doro anya maka ebe olili.
theological_decisions:
- issue: Onye ‘ndị na-eso ụzọ ya’ na-ezo aka na ya
  choice: Ndị na-eso ụzọ Jọn Onye Na-eme Baptizim
  alternative: Ndị na-eso ụzọ Jizọs
  rationale: N’akụkọ gbara amaokwu a gburugburu, onye e gburu ma e buru ozu ya bụ Jọn. Ya mere, nnọchiaha ‘ya’ na-ezo aka na Jọn, ọ bụghị Jizọs.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. A họọrọ ‘ozu’ iji wepụta n’ụzọ doro anya ihe πτῶμα pụtara, ma jikọta ‘ἔθηκαν ... ἐν μνημείῳ’ dịka ‘lie ya n’ili,’ nke bụ ụzọ Igbo ebumpụta ụwa si akọ olili.
