review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the disciples as John's and renders πτῶμα clearly as “ozu.” However, “lie ya n’ili” makes the verb explicitly “bury,” whereas the Greek says that they laid/placed the body in a tomb. The source describes placement in a burial place without specifying the burial action itself. “Ihe ahụ” also supplies an unspecified object not stated in Greek; Igbo can retain the source's ellipsis.
  naturalness: The revised wording is fluent, modern Standard Igbo and retains a dignified narrative register. “Bụrụ ozu ya ma tinye ya n’ili” naturally expresses taking the corpse and placing it in the burial place.
  terminology: “Ndị na-eso ụzọ ya” is appropriate for μαθηταί, “ozu” accurately conveys the dead-body sense of πτῶμα, and “ili” is an acceptable contextual rendering of μνημεῖον. No footnote is needed because “ozu” makes the lexical force explicit in the text.
  issues:
  - severity: medium
    issue: “lie ya n’ili” is more specific than the Greek verb.
    rationale: ἔθηκαν means “laid” or “placed.” Although burial is contextually likely, the Greek wording does not itself state “buried”; replacing it with “tinye ya n’ili” preserves the source's wording and avoids adding an action.
  - severity: low
    issue: “ihe ahụ” adds an explicit object to “nụrụ.”
    rationale: The Greek participle ἀκούσαντες is used absolutely (“having heard/when they heard”). The addition is understandable, but omitting it better preserves the source's ellipsis.
  revised_text: Mgbe ndị na-eso ụzọ ya nụrụ, ha bịara buru ozu ya ma tinye ya n’ili.
  revised_footnotes: []
