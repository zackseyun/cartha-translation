revisions:
- from: Mgbe ndị na-eso ụzọ ya nụrụ ihe ahụ, ha bịara buru ozu ya, lie ya n’ili.
  to: Mgbe ndị na-eso ụzọ ya nụrụ, ha bịara buru ozu ya ma tinye ya n’ili.
  rationale: The revision preserves the temporal sense of ἀκούσαντες, the contextual reference to John's disciples, and the explicit corpse sense of πτῶμα. It changes “lie” to “tinye” so that the translation reflects the Greek statement that the body was placed in a tomb, without asserting the more specific act of burial.
  reviewer_model: gpt-5.6-terra
