revisions:
- from: O wee were ogbe achịcha ise ahụ na azụ abụọ ahụ, lelie anya n’eluigwe, gọzie[a], nyawaa ogbe achịcha ndị ahụ, nọgidekwa na-enye ndị na-eso ụzọ ya ha ka ha dọba ha n’ihu ndị mmadụ. O kekwara azụ abụọ ahụ n’etiti mmadụ niile.
  to: O wee were ogbe achịcha ise ahụ na azụ abụọ ahụ, wee lelịa anya n’eluigwe, gọzie[a], nyawaa ogbe achịcha ndị ahụ, ma nọgide na-enye ndị na-eso ụzọ ya ha ka ha dobe ha n’ihu ndị mmadụ. O kesara azụ abụọ ahụ nye ha niile.
  rationale: The revision retains the source’s ambiguity concerning what, if anything, is the explicit object of “gọzie.” It corrects the meal-service verb, renders the final distribution as being to all, and adjusts the upward-looking expression for Standard Igbo. The footnote preserves the viable meal-context alternative without adding an unstated recipient.
  reviewer_model: gpt-5.6-terra
