id: MRK.6.41
reference: Mark 6:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: ig
  text: O wee were ogbe achịcha ise ahụ na azụ abụọ ahụ, wee lelịa anya n’eluigwe, gọzie[a], nyawaa ogbe achịcha ndị ahụ, ma nọgide na-enye ndị na-eso ụzọ ya ha ka ha dobe ha n’ihu ndị mmadụ. O kesara azụ abụọ ahụ nye ha niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nye ekele.” Okwu Grik bụ “gọzie” (εὐλόγησεν); mgbe a na-eri nri, ihe ọ pụtara nwere ike ịgụnyekwa inye ekele.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: O wee were
  rationale: Na-egosi omume mbụ nke dugara n’usoro omume ndị ọzọ, n’Igbo dị mfe ma na-aga were were.
- source_word: ἄρτους
  choice: ogbe achịcha
  rationale: Ebe a, a na-agụ achịcha ndị ahụ ọnụ; “ogbe achịcha” na-egosi achịcha ise dị iche iche karịa achịcha n’ozuzu ya.
- source_word: ἰχθύας
  choice: azụ
  rationale: Nke a bụ okwu Igbo nkịtị na nke ziri ezi maka azụ; ọnụọgụ “abụọ” na-egosi plural ya.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: lelie anya n’eluigwe
  rationale: Na-echekwa omume ile anya elu na ntụziaka ya gaa n’eluigwe, n’asụsụ Igbo ebumpụta ụwa.
- source_word: εὐλόγησεν
  choice: gọzie
  rationale: Na-anọ nso n’okwu Grik εὐλογέω ma ghara ịgbakwunye ihe e kwuru na ọ bụ ya ka a gọziri; ihe ọzọ ọ pụrụ ịpụta n’oge iri nri dị n’ihe odide ala peeji.
- source_word: κατέκλασεν τοὺς ἄρτους
  choice: nyawaa ogbe achịcha ndị ahụ
  rationale: Na-echekwa ma omume ịnyawa ma ihe doro anya e nyawara.
- source_word: ἐδίδου
  choice: nọgidekwa na-enye
  rationale: Na-egosipụta imperfect Grik dị ka omume gara n’ihu ugboro ugboro mgbe a na-ekesa nri ahụ.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Na-egosipụta ma μαθηταί ma nnọchiaha αὐτοῦ nke pụtara “ya.”
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: ka ha dọba ha n’ihu ndị mmadụ
  rationale: Na-echekwa ebumnuche nke ἵνα na ihe oyiyi doro anya nke ịdọba nri n’ihu ndị ga-eri ya; “ndị mmadụ” na-eme ka onye nnọchiaha ikpeazụ na-ezo aka na ya doo anya.
- source_word: ἐμέρισεν πᾶσιν
  choice: kekwara ... n’etiti mmadụ niile
  rationale: Na-egosi ikere ma ọ bụ ikesa azụ ahụ ruo mmadụ niile, na-anọ nso na μέριζω na πᾶσιν.
theological_decisions:
- issue: Otú e si sụgharịa εὐλόγησεν n’oge iri nri
  choice: gọzie
  alternative: kele Chineke
  rationale: Okwu Grik bụ εὐλογέω, ọ bụghị εὐχαριστέω. “Gọzie” na-eme ka njikọ ya na okwu Grik pụta ìhè, ebe ihe odide ala peeji na-echekwa ohere na n’ọnọdụ nri ọ pụrụ ịgụnye inye Chineke ekele, n’etinyeghị ihe Grik ekwughị kpọmkwem n’ahịrị isi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ogbe achịcha” mee ka ihe ise a gụrụ ọnụ doo anya; e jikwa “ndị mmadụ” kọwaa onye nnọchiaha Grik αὐτοῖς na-ezo aka na ya, ka ọtụtụ “ha” ghara ịkpata mgbagwoju anya.
