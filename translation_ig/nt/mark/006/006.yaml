  text: καὶ ⸀ἐθαύμαζεν διὰ τὴν ἀπιστίαν αὐτῶν. Καὶ περιῆγεν τὰς κώμας κύκλῳ διδάσκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/006.yaml
  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: ig
  text: Ekweghị ekwe ha juru ya anya.[a] Ọ na-agagharị n’obodo nta ndị dị gburugburu, na-akụzi ihe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “O tụrụ ya n’anya n’ihi ekweghị ekwe ha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ọ na-agagharị n’etiti obodo nta ndị ahụ,” ma ọ bụ, “Ọ na-agagharị n’usoro okirikiri n’obodo nta ndị ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: O wee ju ya anya
  rationale: Nke a na-egosipụta ihe θαυμάζω pụtara n’Igbo dị ugbu a—iju anya nke ukwuu—ma imperfect ahụ na akụkọ a na-eme ka ọ bụrụ omume e kọwara n’oge gara aga.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: n’ihi ekweghị ekwe ha
  rationale: διά ya na accusative na-egosi ihe kpatara ya; ‘ekweghị ekwe’ na-egosipụta ἀπιστία dịka ịjụ ikwere, ọ bụghị naanị okwukwe na-esighị ike.
- source_word: περιῆγεν
  choice: na-agagharị
  rationale: Ụdị a na-egosipụta njem na-aga n’ihu site n’otu ebe ruo ebe ọzọ, dịka imperfect περιῆγεν si dị.
- source_word: τὰς κώμας
  choice: n’obodo nta
  rationale: ‘Obodo nta’ bụ okwu Igbo doro anya maka κώμη, ya bụ obodo ma ọ bụ ebe obibi dị nta.
- source_word: κύκλῳ
  choice: ndị gbara ya gburugburu
  rationale: N’ọnọdụ a κύκλῳ nwere ike ịpụta obodo nta ndị dị gburugburu, ma nwekwara ike ịkọwa ịgagharị n’usoro okirikiri; isi ederede họọrọ nkebiokwu Igbo a na-aghọta ngwa ngwa ma debe ụzọ ndị ọzọ na nkọwa ala peeji.
- source_word: διδάσκων
  choice: na-akụzi ihe
  rationale: Nkebiokwu a na-egosi na ịkụzi ihe na-eme n’otu oge ahụ ya na ịgagharị ya.
theological_decisions:
- issue: Igosipụta na ekweghị ekwe ndị ahụ juru Jizọs anya n’enweghị ịkọwa ihe ederede na-akọwaghị
  choice: O wee ju ya anya n’ihi ekweghị ekwe ha.
  alternative: O wee tụọ ya n’anya n’ihi enweghị okwukwe ha.
  rationale: 'E debere okwu akụkọ ahụ n’ụzọ kwụ ọtọ: ekweghị ekwe ha juru ya anya. A naghị eme ka okwu ahụ dị nro, a naghịkwa etinye nkọwa banyere ihe Jizọs maara ma ọ bụ amaghị; ya mere esemokwu nkà mmụta okpukpe dị n’ederede ka dị.'
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma nwee ugwu. E ji ‘ekweghị ekwe’ mee ka ike ἀπιστία pụta ìhè; e ji ‘obodo nta’ mee ka κώμα doo ndị na-agụ akwụkwọ anya. Nkọwa ala peeji na-echekwa nghọta abụọ κύκλῳ nwere ike inwe.
