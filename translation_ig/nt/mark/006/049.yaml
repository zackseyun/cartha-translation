id: MRK.6.49
reference: Mark 6:49
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: ig
  text: Ma mgbe ha hụrụ ya ka ọ na-eje ije n’elu oké osimiri, ha chere na ọ bụ mmụọ[a], ha wee tie mkpu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ọdịdị mmụọ” ma ọ bụ “ihe yiri mmụọ.” Okwu Grik φάντασμα na-ezo aka n’ihe pụtara dị ka mmụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ma ... ha
  rationale: δέ nwere obere ike nke igosi ntụgharị n’akụkọ; “Ma” na-ebute mmeghachi omume ndị na-eso ụzọ n’ụzọ doro anya.
- source_word: ἰδόντες αὐτὸν
  choice: mgbe ha hụrụ ya
  rationale: A sụgharịrị participle aorist ahụ dị ka nkebiokwu oge ka Igbo wee bụrụ nke eke ma chekwaa usoro ihe mere.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: ka ọ na-eje ije n’elu oké osimiri
  rationale: ἐπί ya na genitive n’ebe a na-egosi na ọ nọ n’elu mmiri ahụ; “oké osimiri” na-edobe okwu θάλασσα na ọdịdị ebube nke ihe ahụ.
- source_word: ἔδοξαν
  choice: ha chere
  rationale: δοκέω n’ebe a pụtara iche ma ọ bụ were dị ka ihe bụ eziokwu, ọ bụ ezie na echiche ahụ ezighị ezi.
- source_word: ὅτι φάντασμά ἐστιν
  choice: na ọ bụ mmụọ
  rationale: φάντασμα na-ezo aka n’ihe yiri mmụọ pụtara ìhè. “Mmụọ” bụ okwu Igbo ndị mmadụ na-aghọta ngwa ngwa, ebe nkọwa ala peeji na-echekwa nghọta pụrụ iche nke ọdịdị mmụọ.
- source_word: καὶ ἀνέκραξαν
  choice: ha wee tie mkpu
  rationale: ἀνακράζω na-egosi iti mkpu n’olu ike; “tie mkpu” bụ okwu Igbo eke nke na-echekwa ike ahụ n’etinyeghị nkọwa karịrị isi mmalite.
theological_decisions:
- issue: Ụdị ije Jizọs mere n’elu mmiri
  choice: na-eje ije n’elu oké osimiri
  alternative: na-eje ije n’akụkụ oké osimiri
  rationale: N’akụkọ a, ἐπὶ τῆς θαλάσσης pụtara ije n’elu mmiri ahụ, ọ bụghị ije n’akụkụ ya; nke a na-edobe ihe ama ahụ dịka ederede Grik si kwuo.
- issue: Ihe ndị na-eso ụzọ chere na ha hụrụ
  choice: mmụọ
  alternative: ọdịdị mmụọ / ihe yiri mmụọ
  rationale: Ederede ahụ na-akọ nghọta ha hiere ụzọ, ọ naghị ekwenye na onye ahụ bụ mmụọ n’ezie. Nsụgharị ahụ na-echekwa ọdịiche a site n’okwu “ha chere.”
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E ji “oké osimiri” debe θάλασσα, e ji “ha wee tie mkpu” mee ka njikọ na usoro akụkọ ahụ bụrụ nke eke.
