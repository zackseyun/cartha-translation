  source_fidelity: 'The translation accurately represents every major element of the Greek: the narrative shift (δέ), temporal participle (''mgbe ha hụrụ ya''), Jesus walking on the sea, the disciples'' mistaken supposition, φάντασμα as ''mmụọ,'' and the loud cry. ''N’elu oké osimiri'' correctly conveys ἐπὶ τῆς θαλάσσης without weakening the action to walking beside the water.'
  naturalness: The wording is clear, modern Standard Igbo, and appropriately narrative in register. 'Ka ọ na-eje ije n’elu oké osimiri' and 'ha wee tie mkpu' are natural idioms. The sentence maintains the source’s sequence and urgency.
  terminology: '''Mmụọ'' is a suitable, readily understood rendering for φάντασμα in context. The footnote appropriately preserves the lexical range of apparition/phantom and makes clear that the term concerns a ghostlike appearance, without asserting that Jesus actually was a spirit. ''Oké osimiri'' faithfully retains the Greek θάλασσα (''sea'').'
