  text: ⸂περιέδραμον ὅλην τὴν χώραν ἐκείνην καὶ⸃ ἤρξαντο ἐπὶ τοῖς κραβάττοις τοὺς κακῶς ἔχοντας περιφέρειν ὅπου ἤκουον ⸀ὅτι ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/055.yaml
  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: ig
  text: Ha gbara ọsọ n'ógbè ahụ dum, wee malite iburu ndị ọrịa n'elu ute gaa ebe ọ bụla ha nụrụ na ọ nọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n'elu ihe ndina dị mfe” ma ọ bụ “n'elu akwa nta”; okwu Grik ahụ na-ezo aka n'ihe ndina dị mfe a pụrụ iburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: Ha gbara ọsọ gaa n'akụkụ niile
  rationale: Nke a na-egosi ma ọsọ na ngagharị gbasara ógbè ahụ dum, kama nanị ịsị na ha gara ebe dị iche iche.
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: ógbè ahụ
  rationale: “Ógbè” na-egosi mpaghara gbara ebe ahụ gburugburu, ọ bụghị mba n'echiche nke oge a; echiche nke izu oke dị n'okwu “n'akụkụ niile.”
- source_word: ἤρξαντο ... περιφέρειν
  choice: malitekwa iburu
  rationale: Ọ na-echekwa echiche nke ịmalite omume ahụ ma na-egosi ibugharị ndị ọrịa n'ụzọ anụ ahụ.
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: n'elu ute
  rationale: “Ute” bụ okwu Igbo dị mfe nghọta maka ihe ndina dị mfe nke a pụrụ iburu; nkọwa ala na-egosi okwu ndị ọzọ kwe omume.
- source_word: τοὺς κακῶς ἔχοντας
  choice: ndị ọrịa
  rationale: Nke a bụ nsụgharị Igbo ebumpụta ụwa nke akpaalaokwu Grik pụtara ndị ahụ na-arịa ọrịa.
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: gaa ebe ọ bụla ha nụrụ na ọ nọ
  rationale: Nke a na-echekwa ma echiche ebe a na-aga ma akụkọ ha nụrụ banyere ebe Jizọs nọ.
