translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, mee nsụgharị ahụ. E debere ọsọ na ngwa ngwa nke omume ahụ, tinyekwa akara nkọwa ala [a] ozugbo n'amaokwu.
