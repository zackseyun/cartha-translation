- from: Ha gbara ọsọ gaa n'akụkụ niile nke ógbè ahụ, malitekwa iburu ndị ọrịa n'elu ute gaa ebe ọ bụla ha nụrụ na ọ nọ.[a]
  to: Ha gbara ọsọ n'ógbè ahụ dum, wee malite iburu ndị ọrịa n'elu ute gaa ebe ọ bụla ha nụrụ na ọ nọ.[a]
  rationale: The revision makes the distributive sense of running throughout the region more natural in Standard Igbo and refines the lexical note without changing the verse's meaning or supplying unstated details.
