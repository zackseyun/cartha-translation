review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rapid movement, the whole surrounding district, the beginning of the carrying, the sick persons, and the destination wherever Jesus was reported to be. The phrase “n'akụkụ niile nke ógbè ahụ” is understandable but can suggest only the various sides or parts of the district rather than movement throughout it.
  naturalness: “Ha gbara ọsọ n'ógbè ahụ dum” is more concise and idiomatic Standard Igbo for running throughout the entire region. “Wee malite” gives the Greek sequential καί plus ἤρξαντο naturally.
  terminology: “Ógbè,” “ndị ọrịa,” and “ute” are suitable. The footnote's alternative “akwa e ji ebu mmadụ” can imply a stretcher, whereas κράβαττοι denotes simple portable bedding; “akwa nta” is a closer accessible alternative.
  issues:
  - severity: low
    issue: Spatial wording is slightly imprecise.
    rationale: “N'akụkụ niile nke ógbè ahụ” may be read as ‘to all sides/parts of the region.’ The Greek says they ran throughout the whole region.
  - severity: low
    issue: One footnote alternative is overly specific.
    rationale: “Akwa e ji ebu mmadụ” may suggest a purpose-built stretcher rather than a mat, pallet, or simple cot.
  revised_text: Ha gbara ọsọ n'ógbè ahụ dum, wee malite iburu ndị ọrịa n'elu ute gaa ebe ọ bụla ha nụrụ na ọ nọ.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “n'elu ihe ndina dị mfe” ma ọ bụ “n'elu akwa nta”; okwu Grik ahụ na-ezo aka n'ihe ndina dị mfe a pụrụ iburu.
    reason: lexical_alternative
  revision_rationale: The revision makes the distributive sense of running throughout the region more natural in Standard Igbo and refines the lexical note without changing the verse's meaning or supplying unstated details.
