id: MRK.6.22
reference: Mark 6:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἰσελθούσης τῆς θυγατρὸς ⸂αὐτῆς τῆς⸃ Ἡρῳδιάδος καὶ ὀρχησαμένης ⸂καὶ ἀρεσάσης⸃ τῷ Ἡρῴδῃ καὶ τοῖς συνανακειμένοις, ⸂εἶπεν ὁ βασιλεὺς⸃ τῷ κορασίῳ· Αἴτησόν με ὃ ἐὰν θέλῃς, καὶ δώσω σοι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: ig
  text: Mgbe ada Herodias[a] batara gbaa egwu, ọ masịrị Herọd na ndị ha na ya nọ na-eri nri[b]. Eze ahụ wee sị nwa agbọghọ ahụ, “Rịọ m ihe ọ bụla ị chọrọ, m ga-enye gị ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie ma ọ bụ ọdịnala ghọtara okwu a dịka “ada ya, Herodias” kama “ada Herodias.” Ederede Grik a gbasoro ebe a na-ekwu “ada Herodias.”
    reason: textual_variant
  - marker: b
    text: N'ụzọ nkịtị, okwu Grik ahụ na-ekwu maka ndị ha na Herọd so dina n’akụkụ tebụl rie nri, dị ka omenala oriri oge ahụ si dị.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθούσης
  choice: Mgbe ... batara
  rationale: A sụgharịrị aorist participle dị na genitive absolute dị ka nkebiokwu oge; ‘mgbe ... batara’ bụ Igbo nkịtị ma na-egosi nbata ya n'ebe oriri ahụ.
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: ada Herodias
  rationale: Usoro genitive a na-egosi n'ụzọ kacha kwe omume na nwa agbọghọ ahụ bụ ada Herodias; e debere nghọta a n'ahịrị isi ma kọwaa ọdịiche ederede n'ala peeji.
- source_word: ὀρχησαμένης
  choice: gbaa egwu
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma bụrụkwa kpọmkwem isi ὀρχέομαι n'ọnọdụ a.
- source_word: ἀρεσάσης
  choice: o mere ... obi ụtọ
  rationale: Nke a na-eburu echiche ‘ime ka obi dị mmadụ ụtọ’ nke ἀρέσκω n'enweghị ịgbakwunye ike mmetụta karịrị nke Greek kwuru.
- source_word: τοῖς συνανακειμένοις
  choice: ndị ya na ha nọ na-eri nri
  rationale: Ọ na-egosi ndị ha na Herọd nọ n'otu oriri; Igbo a bụ nke doro anya karịa ịmanye ihe oyiyi nke ịdabere n'akụkụ tebụl, bụ́ omenala oriri oge ahụ.
- source_word: εἶπεν ὁ βασιλεὺς
  choice: Eze ahụ wee sị
  rationale: A hapụrụ βασιλεύς ka ọ bụrụ ‘Eze,’ dị ka Mak dere ya, kama iji aha ọchịchị teknụzụ ọzọ dochie ya.
- source_word: τῷ κορασίῳ
  choice: nwa agbọghọ ahụ
  rationale: κοράσιον pụtara nwa agbọghọ; okwu Igbo a bụ nke oge a, kwanyere ugwu, ma dị mfe nghọta.
- source_word: Αἴτησόν με ὃ ἐὰν θέλῃς
  choice: Rịọ m ihe ọ bụla ị chọrọ
  rationale: Nke a na-egosipụta iwu ịrịọ na ohere sara mbara nke ὃ ἐὰν θέλῃς n'Igbo nkịtị.
- source_word: δώσω σοι
  choice: m ga-enye gị ya
  rationale: ‘Ya’ na-alaghachi n'ihe ọ bụla ọ ga-arịọ, ma mee ka ahịrịokwu ahụ zuo oke n'Igbo.
theological_decisions:
- issue: Aha ọchịchị βασιλεύς e ji kpọọ Herọd Antipas
  choice: Eze ahụ
  alternative: onye na-achị achị; Herọd onye tetrak
  rationale: E soro okwu akụkọ Mak, βασιλεύς, kama idozi ya site n'itinye aha ọchịchị teknụzụ sitere n'akụkọ ihe mere eme.
- issue: Onye nwa agbọghọ ahụ bụ n'ọdịiche ederede
  choice: ada Herodias
  alternative: ada ya, Herodias
  rationale: Ederede SBLGNT e nyere na-akwado nghọta ‘ada Herodias’; e chekwara ọdịiche ahụ n'ala peeji kama ikpochapụ ya.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘na-eri nri’ nye συνανακειμένοις n'ụzọ eke, ebe ala peeji na-echekwa nkọwa omenala banyere ịdabere n'akụkụ tebụl. A debere akara [a] ozugbo n'akụkụ ‘gbaa egwu,’ dịka data ndụmọdụ nyere, ọ bụ ezie na ihe odide ala peeji ya na-akọwa ọdịiche metụtara njirimara nwa agbọghọ ahụ; akara [b] ka etinyere na njedebe ahịrịokwu ka ọ kọwaa ọnọdụ ndị sonyere n'oriri.
