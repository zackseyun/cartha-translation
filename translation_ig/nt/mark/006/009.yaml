  text: ἀλλὰ ὑποδεδεμένους σανδάλια, καὶ μὴ ⸀ἐνδύσησθε δύο χιτῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/009.yaml
  text: but wear sandals[a], and do not put on two tunics.
translation:
  language: ig
  text: kama ka ha yie akpụkpọ ụkwụ,[a] ka ha ghara iyikwasị uwe ime abụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ebe a, “akpụkpọ ụkwụ” pụtara akpụkpọ ụkwụ mepere emepe a na-akpọ sandal.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀλλὰ
  choice: kama
  rationale: Ọ na-egosi ọdịiche dị n’etiti iwu a na ntụziaka njem ndị bu ya ụzọ.
- source_word: ὑποδεδεμένους
  choice: ha ga-eyiri
  rationale: Perfect participle a na-arụ ọrụ dịka iwu; ntụgharị a na-egosi ọnọdụ nke iyi ihe n’ụkwụ n’Igbo dị mfe ma doo anya.
- source_word: σανδάλια
  choice: akpụkpọ ụkwụ
  rationale: Nke a bụ okwu Igbo nkịtị maka ihe a na-eyi n’ụkwụ; nkọwa ala peeji na-akọwapụta na ọ bụ ụdị sandal.
- source_word: μὴ ἐνδύσησθε
  choice: ha agaghịkwa eyikwasị
  rationale: Aorist middle subjunctive ya na μή bụ mmachibido; ‘eyikwasị’ na-echekwa echiche nke ime ihe ahụ, ya bụ itinye uwe n’ahụ.
- source_word: δύο
  choice: abụọ
  rationale: E debere ọnụọgụ ahụ kpọmkwem.
- source_word: χιτῶνας
  choice: uwe ime
  rationale: χιτών bụ uwe bụ isi a na-eyi n’ahụ, n’okpuru uwe ọzọ; ‘uwe ime’ na-enye ihe ọ pụtara n’Igbo nkịtị n’enweghị iji okwu Bekee oge ochie.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma nwee ugwu. E ji usoro onye nke atọ ọtụtụ mee ka amaokwu a jikọọ nke ọma na iwu Jizọs nyere ndị ozi n’amaokwu ndị gbara ya gburugburu.
