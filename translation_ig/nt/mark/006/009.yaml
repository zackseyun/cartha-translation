  source_fidelity: The draft correctly conveys the contrast, sandals, and the prohibition against two tunics. However, “ha ga-eyiri ... ha agaghịkwa eyikwasị” is primarily future/predictive in form, whereas the Greek participle and prohibition function as instructions. An imperative-oriented Igbo construction is needed. The main rendering “iyikwasị” appropriately represents the action of putting on, while “uwe ime” is a suitable functional rendering of χιτῶνας in this context.
  naturalness: Replacing the future forms with “ka ha yie” and “ka ha ghara iyikwasị” gives clear, natural Standard Igbo instructions and fits the surrounding commissioning discourse.
  terminology: “Akpụkpọ ụkwụ” is understandable for sandals; the note can retain the specific footwear clarification. “Uwe ime abụọ” adequately conveys two tunics without importing an anachronistic garment name.
