  naturalness: “Chi jirila ike” na “chi ejiela ike” bụ Igbo nkịtị, doro anya, ma na-echekwa nkwughachi e nwere n’asụsụ Grik. “Ebe a tọgbọ chakoo” dabara n’ọnọdụ a karịa “Ebe a bụ ọzara.”
