  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: ig
  text: Mgbe chi jirila ike[a], ndị na-eso ụzọ ya bịakwutere ya, na-asị, “Ebe a tọgbọ chakoo[b], chi ejiela ike.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, n’ụzọ nkịtị: “mgbe oge dị ukwuu bịara.” Nke a bụ akpaalaokwu na-ekwu na chi ma ọ bụ ụbọchị agafela nke ukwuu.'
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “Ebe a dịpụrụ adịpụ,” ma ọ bụ, “Ebe a bụ ebe mmadụ na-adịghị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: -worịị / -worịkwa (egosiri na ‘agafechara’ na ‘agafewokwa’)
  rationale: Ọ na-egosi na oge eruola n’ókè dị anya; ụdị ngwaa ndị a na-eme ka nke ahụ daa nke ọma n’Igbo.
- source_word: ὥρας πολλῆς γενομένης
  choice: Mgbe oge gafechara nke ukwuu
  rationale: Nke a na-asụgharị genitive absolute dị ka ahịrịokwu oge nke na-ada nke ọma n’Igbo, ma na-echekwa echiche na chi ejiela nke ukwuu.
- source_word: προσελθόντες αὐτῷ
  choice: bịakwutere ya
  rationale: ‘Bịakwutere ya’ na-egosi ịbịa nso n’ebe ọ nọ n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka ndị na-amụta ihe n’aka onye nkụzi ma na-eso ya.
- source_word: ἔλεγον
  choice: na-asị
  rationale: Ọ na-echekwa ọdịdị imperfect nke na-egosi okwu na-aga n’ihu, n’enweghị ịmanye echiche na ha kwuru ya ugboro ugboro.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Ebe a bụ ọzara
  rationale: N’ebe a, ἔρημος pụtara ebe mmadụ na-ebighị ma ọ bụ ebe dịpụrụ adịpụ; ‘ọzara’ na-enye echiche ahụ nkenke. Ihe ọzọ e nwere bụ ‘Ebe a tọgbọ chakoo.’
- source_word: καὶ ἤδη ὥρα πολλή
  choice: oge agafewokwa nke ukwuu
  rationale: Nke a na-echekwa nkwughachi banyere ịdị anya nke oge ma na-ada ka okwu mmadụ ga-ekwu n’Igbo.
