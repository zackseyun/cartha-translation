translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta mee ihe. A hapụrụ nkwughachi nke okwu banyere oge dị n’asụsụ Grik, ma gbanwee akpaalaokwu ya ka ọ daa nke ọma n’Igbo. A haziri akara nkọwa [a] na [b] ka ha kwekọọ n’ebe okwu ha na-akọwa dị n’ahịrịokwu.
