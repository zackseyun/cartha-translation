  rationale: E degharịrị okwu banyere oge ka ọ pụta na chi ejiela ike, nke dabara n’akpaalaokwu Grik na n’ọnọdụ akụkọ ahụ. E dochiri “ọzara” anya na “ebe tọgbọ chakoo” ka ntụgharị ahụ ghara ịmanye echiche ala aja kpọrọ nkụ. A chekwara usoro na-aga n’ihu nke ἔλεγον site na “na-asị,” nakwa nkwughachi banyere oge dị n’okwu ndị na-eso ụzọ ya.
