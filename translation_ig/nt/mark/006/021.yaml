  text: Καὶ γενομένης ἡμέρας εὐκαίρου ὅτε Ἡρῴδης τοῖς γενεσίοις αὐτοῦ δεῖπνον ⸀ἐποίησεν τοῖς μεγιστᾶσιν αὐτοῦ καὶ τοῖς χιλιάρχοις καὶ τοῖς πρώτοις τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/021.yaml
  text: And when an opportune day came[a], Herod gave a banquet on his birthday for his nobles and military commanders and the leading men of Galilee[d][c][b],
translation:
  language: ig
  text: Mgbe ụbọchị dabara adaba bịara[a][d], Herọd mere nnukwu oriri[b] n’ụbọchị ọmụmụ ya maka ndị ukwu ya, ndị isi agha, na ndị nwoke a ma ama na Galili[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe ụbọchị kwesịrị ekwesị bịara” ma ọ bụ “mgbe ụbọchị nyere ezigbo ohere bịara.” Okwu Grik ahụ na-egosi oge dabara adaba ma ọ bụ ohere e nwere ike iji mee ihe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “mere oriri nri anyasị.” N’ụzọ nkịtị, okwu Grik ahụ bụ “mere nri anyasị.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “ndị nwoke kacha pụta ìhè na Galili.” Nkebi okwu ahụ na-ezo aka n’ụmụ nwoke a ma ama ma nọ n’ọkwá dị elu n’ógbè ahụ.
    reason: lexical_alternative
  - marker: d
    text: N’ụzọ na-esochikwu usoro Grik, a pụkwara ịsụgharị ya, “Mgbe ụbọchị dabara adaba bịara, mgbe Herọd mere nnukwu oriri...”
    reason: previous_rendering
lexical_decisions:
- source_word: γενομένης ἡμέρας εὐκαίρου
  choice: Mgbe ụbọchị dabara adaba bịara
  rationale: Nkebi a na-egosi ọnọdụ oge. “Dabara adaba” na-edobe echiche nke ụbọchị kwesịrị ekwesị ma ọ bụ ohere a na-eche, n’enweghị ịkọwapụta atụmatụ onye ọ bụla karịa ihe Grik kwuru.
- source_word: ὅτε
  choice: — e jikọtara ya n’usoro ahịrịokwu Igbo
  rationale: Ọ bụ njikọ oge nke na-akọwa ihe mere ụbọchị ahụ ji bụrụ nke dabara adaba. Igbo na-ekwe ka e tinye nkọwa ahụ ozugbo n’ahịrịokwu bụ isi n’enweghị ikwughachi “mgbe” ugboro abụọ.
- source_word: τοῖς γενεσίοις αὐτοῦ
  choice: n’ụbọchị ọmụmụ ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke a na-aghọta nke ọma isi kwuo emume ụbọchị ọmụmụ.
- source_word: δεῖπνον ἐποίησεν
  choice: mere nnukwu oriri
  rationale: Ọ bụ ezie na okwu Grik ahụ pụtara n’ụzọ nkịtị “mere nri anyasị,” ọ bụ akpaalaokwu maka ịhazi oriri. “Nnukwu oriri” dabara n’ụdị emume a haziri maka ndị nọ n’ọkwá dị elu.
- source_word: τοῖς μεγιστᾶσιν αὐτοῦ
  choice: maka ndị nọ n’ọkwá dị elu n’obí ya
  rationale: Nke a na-egosi ndị ukwu ma ọ bụ ndị nọ n’ọkwá dị elu metụtara ọchịchị Herọd, ma na-ezere okwu Igbo nwere ike ịpụta nanị “ndị isi” n’ozuzu.
- source_word: τοῖς χιλιάρχοις
  choice: ndịisi agha
  rationale: Okwu a na-ezo aka n’ọchịagha ndị nọ n’ọkwá dị elu; nsụgharị ọrụ ha doro ndị na-agụ Igbo anya karịa ịsụgharị ya n’ụzọ nkịtị dịka “ndịisi otu puku.”
- source_word: τοῖς πρώτοις τῆς Γαλιλαίας
  choice: ndị nwoke a ma ama nke Galili
  rationale: Nke a na-egosi ndị nwoke kacha pụta ìhè ma ọ bụ ndị nọ n’ọkwá mbụ n’ógbè ahụ, ma na-edobe ntụaka nwoke dị na ọnọdụ akụkọ ahụ.
- source_word: Καὶ
  choice: — e gosipụtara njikọ akụkọ ahụ site n’ịmalite na “Mgbe”
  rationale: N’Igbo, ịmalite nkebi oge ozugbo bụ usoro eke; ịgbakwunye “Na” n’ihu “Mgbe” ga-eme ka ahịrịokwu ahụ daa arọ n’enweghị ịgbanwe njikọ ya na akụkọ gara aga.
- source_word: Ἡρῴδης
  choice: Herọd
  rationale: Nke a bụ nsụgharị mkpụrụokwu aha ahụ n’ụdị a na-ahụkarị n’Igbo.
