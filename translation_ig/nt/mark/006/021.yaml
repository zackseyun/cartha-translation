translation_notes:
  register: E ji Standard Igbo dị ugwu ma dị mfe nghọta dee ya. A họọrọ usoro ahịrịokwu na-aga were were n’Igbo, ma e debere echiche nke ụbọchị ahụ dị ka ohere dabara adaba. E tinyere “ndị nwoke” n’otu ndị ikpeazụ iji chekwaa ntụaka nwoke nke ọnọdụ na ihe àmà asụsụ isi mmalite.
