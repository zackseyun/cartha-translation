  text: καὶ ἦσαν οἱ φαγόντες ⸂τοὺς ἄρτους⸃ πεντακισχίλιοι ἄνδρες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/044.yaml
  text: And those who ate the loaves were five thousand men[a][b].
translation:
  language: ig
  text: Ndị riri ogbe achịcha ndị ahụ[a] bụ ndị ikom puku ise.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “achịcha ahụ.” Okwu Grik ahụ nwere ike ịpụta achịcha n’ozuzu ya ma ọ bụ ogbe achịcha; n’ebe a, ọ na-ezo aka n’ogbe achịcha ndị e nyere ìgwè mmadụ ahụ.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, okwu a bụ “ndị ikom,” ya bụ ụmụ nwoke torola eto, ọ bụghị okwu izugbe maka mmadụ niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: dị
  rationale: N’ebe a, ngwaa ahụ na-ejikọta ndị riri nri na ọnụ ọgụgụ ha. “Dị” bụ ụzọ Igbo kwụ ọtọ si kwuo ngụkọta ahụ n’etinyeghị echiche ọzọ dịka na a gụrụ ha ọnụ.
- source_word: οἱ φαγόντες
  choice: Ndị riri
  rationale: Nke a na-akọwa ìgwè ahụ site n’ihe ha mere, ya bụ iri nri; “ndị riri” bụ okwu Igbo doro anya ma na-adịkwa mfe.
- source_word: τοὺς ἄρτους
  choice: ogbe achịcha ndị ahụ
  rationale: Ọtụtụ nke ἄρτος na-ezo aka n’ogbe achịcha ndị a kpọtụrụ aha n’akụkọ a. “Ogbe achịcha ndị ahụ” na-echekwa ma ọtụtụ ha ma nkọwa na ọ bụ ogbe ndị ahụ kpọmkwem.
- source_word: πεντακισχίλιοι
  choice: puku ... ise
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke ziri ezi si kwuo ọnụ ọgụgụ puku ise.
- source_word: ἄνδρες
  choice: ndị ikom
  rationale: Okwu Grik a na-ekwu kpọmkwem banyere ụmụ nwoke torola eto, ọ bụghị okwu izugbe maka mmadụ niile; “ndị ikom” na-echekwa nkọwa ahụ.
theological_decisions:
- issue: Okwu ngụkọta nke kpọmkwem maka nwoke
  choice: E dere ἄνδρες dịka “ndị ikom” n’ahịrị bụ isi.
  alternative: ndị mmadụ
  rationale: Grik ji okwu kpọmkwem maka ụmụ nwoke mee ihe, ọ bụghị okwu izugbe maka mmadụ. Nsụgharị ahụ ekwesịghị ime ka ọdịiche a fuo ma ọ bụ kwuo na puku ise ahụ bụ ngụkọta mmadụ niile.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ bụ nke Igbo nkịtị, ebe a tinyere “ndị ikom” n’ime okwu ọnụ ọgụgụ. Akara nkọwa ala [a] na [b] dị n’ahịrị bụ isi.
