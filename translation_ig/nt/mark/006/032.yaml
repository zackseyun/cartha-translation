- from: Ha wee jiri ụgbọ mmiri gaa n’ebe tọgbọrọ n’efu[a], naanị ha.[b]
  to: Ha wee jiri ụgbọ mmiri gaa n’ebe tọgbọrọ n’efu[a], naanị ha.[b]
