  yaml_path: translation/nt/mark/006/032.yaml
  text: And they went away in the boat to a desolate place by themselves[a][b].
translation:
  language: ig
  text: Ha wee jiri ụgbọ mmiri gaa n’ebe tọgbọrọ n’efu[a], naanị ha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ebe mmadụ na-adịghị ebi” ma ọ bụ “n’ebe dị n’ọzara.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’iche.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ha wee
  rationale: “Wee” na-egosi njikọ na ịga n’ihu nke akụkọ ahụ n’ụzọ e ji asụ Igbo nke ọma, ma ọ naghị etinye nkọwa dịka ihe kpatara ihe ahụ.
- source_word: ἀπῆλθον
  choice: gaa
  rationale: N’ebe a, “gaa” na-egosi na ha hapụrụ ebe ha nọ gawa ebe ọzọ; njikọ ya na “jiri ụgbọ mmiri” na-eme ka mmegharị ahụ doo anya n’Igbo nkịtị.
- source_word: ἐν τῷ πλοίῳ
  choice: jiri ụgbọ mmiri
  rationale: N’agbanyeghị na okwu Grik ahụ pụtara n’ụzọ nkịtị “n’ime ụgbọ mmiri ahụ,” “jiri ụgbọ mmiri” bụ ụzọ Igbo dị ezigbo mma isi kwuo ụdị njem ha mere, n’enweghị ịgbanwe ihe akụkọ ahụ kwuru.
- source_word: εἰς ἔρημον τόπον
  choice: n’ebe tọgbọrọ n’efu
  rationale: Nkebi a na-akọwa ebe mmadụ na-ebighị ma ọ bụ ebe dịpụrụ adịpụ. “Ebe tọgbọrọ n’efu” na-edobe echiche nke ebe mmadụ na-anọghị n’enweghị ịkọwa ya kpọmkwem dị ka ọzara.
- source_word: κατ’ ἰδίαν
  choice: naanị ha
  rationale: Nkebi okwu a pụtara ịnọ iche n’ebe ndị ọzọ nọ ma ọ bụ ịnọ naanị onwe ha. “Naanị ha” dabara n’isiokwu ọtụtụ ma bụrụkwa Igbo doro anya.
