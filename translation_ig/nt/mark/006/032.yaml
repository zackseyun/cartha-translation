review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the narrative connection, departure by boat, destination in an uninhabited/isolated place, and the group’s separation from others. The idiomatic use of “jiri ụgbọ mmiri” is faithful to ἐν τῷ πλοίῳ, though less formally literal than “n’ime ụgbọ mmiri ahụ.”
  naturalness: The main text is natural Standard Igbo. “N’ebe tọgbọrọ n’efu” is an understandable and suitably concise rendering of ἔρημον τόπον. The second footnote’s “na nzuzo,” however, can imply secrecy, which is not required by κατ’ ἰδίαν; “n’iche” better expresses being apart from others.
  terminology: No theological terminology is involved. The alternative “n’ebe ọzara” in footnote a is incomplete/non-idiomatic as a destination phrase in this context; it should be phrased as “n’ebe dị n’ọzara” or omitted. The revised note preserves the lexical range without imposing a precise geography.
  issues:
  - severity: medium
    issue: Footnote a contains the non-idiomatic phrase “n’ebe ọzara.”
    rationale: As written, it is not a complete natural Igbo expression for “to a wilderness place.” “N’ebe dị n’ọzara” is grammatically and idiomatically clear.
  - severity: medium
    issue: Footnote b renders κατ’ ἰδίαν as “na nzuzo.”
    rationale: “Na nzuzo” commonly suggests acting secretly. The Greek means apart, privately, or by themselves, without necessarily implying concealment.
  revised_text: Ha wee jiri ụgbọ mmiri gaa n’ebe tọgbọrọ n’efu[a], naanị ha.[b]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ebe mmadụ na-adịghị ebi” ma ọ bụ “n’ebe dị n’ọzara.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’iche.”
    reason: lexical_alternative
  revision_rationale: The verse itself is retained because it faithfully and naturally represents the Greek. The footnotes are revised to give idiomatic Standard Igbo alternatives and to avoid adding an implication of secrecy to κατ’ ἰδίαν.
