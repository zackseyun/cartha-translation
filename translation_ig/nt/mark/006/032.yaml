translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, mee nsụgharị a. A hapụrụ usoro akụkọ dị mkpirikpi nke Mak, ma jiri okwu ndị Igbo na-asụkarị mee ka amaokwu ahụ daa nke ọma.
