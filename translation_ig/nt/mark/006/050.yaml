source:
  edition: SBLGNT
  text: πάντες γὰρ αὐτὸν εἶδον καὶ ἐταράχθησαν. ⸂ὁ δὲ εὐθὺς⸃ ἐλάλησεν μετ’ αὐτῶν, καὶ λέγει αὐτοῖς· Θαρσεῖτε, ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: ig
  text: N’ihi na ha niile hụrụ ya, obi ha wee maa jijiji. Ma ozugbo ahụ, ọ gwara ha okwu, sị ha, “Nweenụ obi ike; Abụ m; unu atụla egwu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: obi wee maa ha jijiji
  rationale: Na-egosipụta oke ụjọ na mgbagwoju obi nke ngwaa ahụ n’Igbo nkịtị, kama okwu na-adịghị eke nke pụtara naanị na e nyere ha nsogbu.
- source_word: Θαρσεῖτε
  choice: Nweenụ obi ike
  rationale: Iwu a na-agwa ọtụtụ mmadụ ka ha nwee obi ike; nke a bụ nsụgharị doro anya ma bụrụkwa nke e ji eme ihe n’Igbo.
- source_word: ἐγώ εἰμι
  choice: Abụ m
  rationale: Na-edobe usoro okwu Grik ahụ na nkọwa ya nke nwere ike ịbụ nkwupụta njirimara nkịtị ma ọ bụ nwee ụda mmụọ miri emi, n’etinyeghị ihe mgbakwunye dịka “ọ bụ m.”
- source_word: μὴ φοβεῖσθε
  choice: unu atụla egwu
  rationale: Na-edobe iwu a gwara ọtụtụ mmadụ n’asụsụ Igbo doro anya.
theological_decisions:
- issue: Ihe ἐγώ εἰμι pụtara n’ebe a
  choice: Abụ m
  alternative: Ọ bụ m
  rationale: A họọrọ “Abụ m” iji chekwaa nkwupụta Grik ahụ n’ụdị ya ghe oghe, na-ekpebighị ma ọ bụ naanị igosi onye na-ekwu okwu ka ọ bụ okwu nwere ntụaka mmụọ miri emi.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị nsọ ma dị mfe nghọta. E debere mgbanwe oge ngwaa dị n’isi mmalite Grik n’ụzọ Igbo na-asụkarị, “ọ gwara… sị,” ka ahịrịokwu ahụ na-aga were were.
