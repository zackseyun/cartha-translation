  yaml_path: translation/nt/mark/006/039.yaml
  text: And he commanded them all to recline in groups on the green grass[a][b].
translation:
  language: ig
  text: O wee nye ha iwu ka ha mee ka mmadụ niile nọdụ ala[b] n’ìgwè n’ìgwè[a] n’elu ahịhịa ndụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ikwughachi okwu Grik ahụ na-egosi na a haziri ha n’ìgwè dị iche iche maka iri nri.
    reason: lexical_clarification
  - marker: b
    text: Okwu Grik ahụ nwere ike ịpụta ịdabere azụ mgbe a na-eri nri; n’Igbo nke oge a, a sụgharịrị ya “nọdụ ala.”
    reason: cultural_clarification
lexical_decisions:
- source_word: ἐπέταξεν
  choice: nye ha iwu
  rationale: Nkebiokwu a na-egosi inye iwu n’ike, ọ bụghị nanị ịgwa mmadụ ihe.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha a na-ezo aka ná ndị Jizọs na-agwa okwu; ihe gbara amaokwu ahụ gburugburu na-egosi na ha bụ ndị na-eso ụzọ ya, ma edeghị aha ha kpọmkwem n’ebe a.
- source_word: ἀνακλῖναι πάντας
  choice: ka ha mee ka mmadụ niile nọdụ ala
  rationale: Nke a na-edobe ọdịiche dị n’etiti ‘ha,’ bụ́ ndị e nyere iwu, na ‘mmadụ niile,’ bụ́ ndị ha ga-eme ka ha nọdụ ala. ‘Nọdụ ala’ bụ ụzọ Igbo nke oge a si ekwu ya n’ụzọ doro anya, ebe nkọwa ala na-egosi ọdịnala iri nri n’ịdabere azụ.
- source_word: συμπόσια συμπόσια
  choice: n’ìgwè n’ìgwè
  rationale: 'Ikwughachi ‘ìgwè’ na Igbo na-egosipụta echiche nkesa dị n’ikwu okwu Grik ahụ ugboro abụọ: a haziri ndị ahụ n’ìgwè dị iche iche.'
- source_word: ἐπὶ τῷ χλωρῷ χόρτῳ
  choice: n’elu ahịhịa ndụ
  rationale: Nke a bụ nsụgharị kpọmkwem ma dịkwa mfe nghọta nke ahịhịa dị ndụ ma ọ bụ ọhụrụ.
