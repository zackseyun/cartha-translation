translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. Ahịrịokwu ahụ kpachapụrụ anya kewaa ndị natara iwu (‘ha’) na mmadụ niile a ga-eme ka ha nọdụ ala, dịka usoro okwu Grik si dị.
