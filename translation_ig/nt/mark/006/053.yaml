  text: Καὶ διαπεράσαντες ⸂ἐπὶ τὴν γῆν ἦλθον εἰς⸃ Γεννησαρὲτ καὶ προσωρμίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/053.yaml
  text: And after crossing over to the land[b][a], they came to Gennesaret and moored there.
translation:
  language: ig
  text: Mgbe ha gafesịrị, ha rutere n’ala[a] Genesaret, wee dọba ụgbọ mmiri ahụ n’ebe ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ụsọ mmiri”; okwu Grik ahụ sịrị “n’ala,” nke n’ọnọdụ njem ụgbọ mmiri a pụrụ ịghọta dịka iru n’ala site n’ụgbọ mmiri.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “tụọ arịlịka n’ebe ahụ,” “kwụsị ụgbọ mmiri ahụ,” ma ọ bụ “mee ka ụgbọ mmiri ahụ rute n’ala”; ngwaa Grik ahụ bụ okwu pụrụ iche gbasara ịdọba ma ọ bụ ịkwụsị ụgbọ mmiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: Mgbe ha gafesịrị mmiri ahụ
  rationale: Aorist participle a na-egosi na ịgafe ahụ buru ụzọ mee tupu ha erute. E tinyere “mmiri ahụ” n’ụzọ doro anya n’Igbo n’ihi ọnọdụ njem ụgbọ mmiri, n’agbanyeghị na Grik ekwughị ihe ha gafere kpọmkwem n’ahịrịokwu a.
- source_word: ἐπὶ τὴν γῆν ... ἦλθον εἰς Γεννησαρὲτ
  choice: ha rutere n’ala Genesaret[a]
  rationale: γῆ pụtara ala, ma n’ọnọdụ njem ụgbọ mmiri ọ nwekwara echiche nke ụsọ mmiri. “Rutere n’ala Genesaret” bụ okwu Igbo dị mfe nke na-edebe ma iru ala ma ebe ha rutere.
- source_word: Γεννησαρὲτ
  choice: Genesaret
  rationale: A sụgharịghị aha ebe ahụ; e dere ya n’ụdị dabara n’usoro mkpụrụokwu na mkpọpụta Igbo.
- source_word: προσωρμίσθησαν
  choice: dọbakwa ụgbọ mmiri ahụ n’akụkụ mmiri[b]
  rationale: Ngwaa Grik a bụ okwu njem mmiri nke na-egosi ime ka ụgbọ mmiri bịaruo ebe a ga-adọba ya. Nsụgharị a na-eme ka echiche ụgbọ mmiri ahụ doo anya n’Igbo ma ghara ime ka ọ bụrụ naanị “ha rutere.”
- source_word: καί
  choice: -kwa
  rationale: Mgbakwunye “-kwa” n’ime “dọbakwa” na-ejigide njikọ akụkọ nke καί n’Igbo dị larịị.
theological_decisions: []
translation_notes:
  register: 'E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A haziri ahịrịokwu ahụ ka usoro ihe mere doo anya: ha gafere mmiri, rute n’ala Genesaret, wee dọba ụgbọ mmiri. Ihe nrịbama nkọwa ala [a] na nke ịdọba ụgbọ mmiri [b] dị kpọmkwem n’ebe okwu ndị ahụ pụtara.'
