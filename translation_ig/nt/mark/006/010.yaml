  text: καὶ ἔλεγεν αὐτοῖς· Ὅπου ⸀ἐὰν εἰσέλθητε εἰς οἰκίαν, ἐκεῖ μένετε ἕως ἂν ἐξέλθητε ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: ig
  text: Ọ nọ na-agwa ha, “N’ebe ọ bụla unu banyere n’ụlọ, nọrọnụ n’ebe ahụ ruo mgbe unu ga-esi n’ebe ahụ pụọ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “ruo mgbe unu ga-ahapụ ebe ahụ.” Okwu Grik pụtara n’ụzọ nkịtị “ruo mgbe unu ga-esi n’ebe ahụ pụọ”; n’ọnọdụ a, o yiri ka ọ na-ezo aka n’oge ha ga-ahapụ obodo ma ọ bụ ógbè ahụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ọ nọkwa na-agwa ha
  rationale: Ụdị imperfect na-egosi okwu a na-aga n’ihu n’akụkọ ahụ; ‘ọ nọkwa na-agwa ha’ na-echekwa akụkụ a n’Igbo dị ugbu a.
- source_word: Ὅπου ἐὰν
  choice: N’ebe ọ bụla
  rationale: Ngwakọta okwu a na-egosi ebe a na-akọwaghị kpọmkwem, ya bụ ‘n’ebe ọ bụla.’
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: unu banyere n’ụlọ
  rationale: ‘Banye n’ụlọ’ bụ ụzọ Igbo si ekwu nbata n’ime ụlọ n’ụzọ doro anya ma bụrụkwa nke e ji eme ihe kwa ụbọchị.
- source_word: οἰκίαν
  choice: ụlọ
  rationale: N’ebe a, οἰκία na-ezo isi n’ụlọ ebe a ga-anabata ha ma ha biri nwa oge, ọ bụghị n’ezinụlọ dịka otu ìgwè mmadụ.
- source_word: ἐκεῖ μένετε
  choice: nọrọnụ n’ebe ahụ
  rationale: μένετε bụ iwu ka ha nọgide ma ọ bụ nọrọ ebe ahụ; ‘nọrọnụ’ na-enye iwu ahụ n’ụzọ eke ma doo anya.
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: ruo mgbe unu ga-esi n’ebe ahụ pụọ
  rationale: Nsụgharị a na-esochi okwu Grik nke ọma ma na-ahapụ ‘ebe ahụ’ ka ọ ghara ikpebi n’ime ahịrịokwu ma ọ̀ bụ ụlọ ahụ kpọmkwem ka ọ bụ obodo/ógbè ahụ.
theological_decisions:
- issue: Ihe ἐκεῖθεν (‘n’ebe ahụ’) na-ezo aka na ya
  choice: 'E chekwara okwu ahụ n’ụdị na-adịghị ekpebi kpọmkwem: ‘ruo mgbe unu ga-esi n’ebe ahụ pụọ.’'
  alternative: ‘Ruo mgbe unu ga-ahapụ obodo ahụ,’ nke ga-akọwa ya dịka ịhapụ obodo ma ọ bụ ógbè ahụ.
  rationale: Okwu Grik nwere ike ịpụta ịpụ ‘n’ebe ahụ,’ ebe ọnọdụ gbara ya gburugburu na-egosi na ọ pụrụ ịbụ ịhapụ obodo ahụ. Kama imechi ihe odide ahụ n’otu nkọwa, nsụgharị bụ isi na-echekwa obosara okwu ahụ, ebe nkọwa ala peeji na-akọwa nghọta nke ọnọdụ ya kwadoro.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. ‘Nọrọnụ’ na-egosi iwu a gwara ọtụtụ mmadụ; ahịrịokwu ahụ anaghị ebubata nkọwa ụka ọ bụla ma na-echekwa ntakịrị mgbagwoju anya dị na ἐκεῖθεν.
