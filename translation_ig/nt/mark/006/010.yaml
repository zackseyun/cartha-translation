    issue: Unnecessary -kwa in “Ọ nọkwa na-agwa ha.”
    rationale: The Greek καὶ is the ordinary narrative conjunction ‘and’; -kwa can suggest addition (‘also’) not required by the source. Removing it improves naturalness and precision while preserving the imperfect aspect.
