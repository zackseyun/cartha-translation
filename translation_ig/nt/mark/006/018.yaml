source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: ig
  text: N’ihi na Jọn nọ na-agwa Herọd, sị, “Iwu akwadoghị ka ị nwee nwunye nwanne gị.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “E kweghị gị inwe nwunye nwanne gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: nọ na-agwa
  rationale: Oge imperfect na-egosi omume gara aga nke nọgidere na-eme ma ọ bụ nke e mere ugboro ugboro; “nọ na-agwa” na-egosipụta nke a n’Igbo nkịtị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe bu ya ụzọ dịka nkọwa nke ihe mere; “N’ihi na” na-egosipụta njikọ nkọwa ahụ nke ọma.
- source_word: Ἡρῴδῃ
  choice: Herọd
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị dabara na ụda na usoro odide Igbo.
- source_word: Οὐκ ἔξεστίν σοι
  choice: Iwu akwadoghị ka gị
  rationale: ἔξεστιν na-ekwu maka ihe iwu ma ọ bụ ikike kwadoro. Nhọrọ a na-echekwa ike iwu na omume ọma dị n’ịdọ aka ná ntị Jọn, n’etinyeghị nkọwa iwu Mosis nke amaokwu ahụ ekwughị kpọmkwem.
- source_word: ἔχειν
  choice: na ... biri dị ka di na nwunye
  rationale: Ọ bụ ezie na ἔχειν pụtara n'ụzọ nkịtị “inwe,” n’ọnọdụ alụmdi na nwunye a, ịsị “inwe nwunye” nwere ike ịdị ka mmadụ bụ ihe onwunwe n’Igbo. Nkebi a na-enye nghọta alụmdi na nwunye ahụ n’asụsụ Igbo doro anya.
- source_word: γυναῖκα
  choice: nwunye
  rationale: γυνή nwere ike ịbụ “nwaanyị” ma ọ bụ “nwunye,” ma njikọ ya na “nwanne gị” na ọnọdụ alụmdi na nwunye na-egosi na “nwunye” bụ ihe e bu n’obi.
- source_word: τοῦ ἀδελφοῦ σου
  choice: nwanne gị
  rationale: Nke a bụ ụzọ Igbo si egosipụta onye nwunye ahụ bụ nke ọma ma na-echekwa mmekọrịta ezinụlọ dị n’ebubo Jọn.
theological_decisions:
- issue: Ụdị ịdọ aka ná ntị Jọn
  choice: “Iwu akwadoghị” dịka nkwupụta mmachibido iwu na omume ọma
  alternative: “O zighị ezi” ma ọ bụ “E kweghị gị”
  rationale: ἔξεστιν metụtara ihe e kwere ma ọ bụ ihe iwu kwadoro. N’ọnọdụ alụmdi na nwunye Herọd na iwu ndị dị n’azụ okwu a, “Iwu akwadoghị” na-echekwa ike okwu ahụ n’agbakwụnyeghị ntụaka kpọmkwem n’iwu Levitikọs.
- issue: Ihe ἔχειν pụtara n’ọnọdụ a
  choice: “ka gị na nwunye nwanne gị biri dị ka di na nwunye”
  alternative: “ka i nwee nwunye nwanne gị”
  rationale: Nhọrọ a na-egosipụta mmekọrịta alụmdi na nwunye a na-ekwu maka ya, ma zere ka okwu ahụ daa ka a na-ekwu na mmadụ bụ ihe onwunwe. Ọ naghị ekpebi karịa ihe ọnọdụ amaokwu ahụ na-egosi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. E ji “nọ na-agwa” chekwaa omume na-aga n’ihu nke imperfect; e ji “Iwu akwadoghị” chekwaa ụda iwu na omume ọma nke ἔξεστιν. Akara ndetu [a] dị n’isiokwu ahụ dịka achọrọ.
