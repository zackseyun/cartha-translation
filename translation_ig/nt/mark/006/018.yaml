review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents γάρ, the imperfect ἔλεγεν, Herod’s name, and the legal-prohibitive force of οὐκ ἔξεστίν σοι. However, “ka gị na nwunye nwanne gị biri dị ka di na nwunye” expands the concise infinitive ἔχειν (“to have”) into an explicit description of cohabitation. Although compatible with the context, this is less formally equivalent than necessary.
  naturalness: “Jọn nọ na-agwa Herọd” is natural Standard Igbo for the ongoing/repeated past sense. “Iwu akwadoghị ka ị nwee nwunye nwanne gị” is idiomatic and maintains an appropriately formal biblical register. Using “ị” rather than “gị” before the verb in this construction improves grammatical clarity.
  terminology: “Iwu akwadoghị” suitably conveys the moral-legal sense of ἔξεστιν without asserting an unstated specific legal citation. “Nwunye nwanne gị” accurately renders “your brother’s wife.” “Inwe” should be retained here because it closely reflects ἔχειν and is an established, non-dehumanizing marital expression in this register.
  issues:
  - severity: medium
    issue: The rendering of ἔχειν is expanded beyond the source wording.
    rationale: “Biri dị ka di na nwunye” specifies living together as spouses, whereas the Greek simply says “to have” the brother’s wife. The marital context is clear from “nwunye,” so the additional phrasing is unnecessary and slightly reduces formal correspondence.
  - severity: low
    issue: Pronoun form in the subordinate clause can be improved.
    rationale: In “ka ị nwee,” the subject pronoun is directly followed by its verb. This is clearer and more standard than retaining “gị” from the comitative expanded construction.
  revised_text: N’ihi na Jọn nọ na-agwa Herọd, sị, “Iwu akwadoghị ka ị nwee nwunye nwanne gị.”[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “E kweghị gị inwe nwunye nwanne gị.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the imperfect aspect with “nọ na-agwa,” retains the explanatory connective and the legal-moral prohibition, and renders ἔχειν directly as “inwe.” It avoids adding the specific notion of living together while preserving the source’s marital meaning.
