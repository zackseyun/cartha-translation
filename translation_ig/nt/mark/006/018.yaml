revisions:
- from: N’ihi na Jọn nọ na-agwa Herọd, sị, “Iwu akwadoghị ka gị na nwunye nwanne gị biri dị ka di na nwunye.”[a]
  to: N’ihi na Jọn nọ na-agwa Herọd, sị, “Iwu akwadoghị ka ị nwee nwunye nwanne gị.”[a]
  rationale: The revision preserves the imperfect aspect with “nọ na-agwa,” retains the explanatory connective and the legal-moral prohibition, and renders ἔχειν directly as “inwe.” It avoids adding the specific notion of living together while preserving the source’s marital meaning.
  reviewer_model: gpt-5.6-terra
