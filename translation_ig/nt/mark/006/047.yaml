  text: Καὶ ὀψίας γενομένης ἦν τὸ πλοῖον ἐν μέσῳ τῆς θαλάσσης, καὶ αὐτὸς μόνος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/047.yaml
  text: And when evening had come[a], the boat was in the middle of the sea, and he was alone on the land.
translation:
  language: ig
  text: Mgbe mgbede ruru, ụgbọ mmiri ahụ nọ n’etiti oke osimiri, ọ nọkwa naanị ya n’elu ala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “n’ikpere mmiri.” Asụsụ Grik kwuru “n’elu ala,” iji mee ọdịiche dị n’etiti ebe ọ nọ na ebe ụgbọ mmiri ahụ nọ n’oké osimiri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: Mgbe chi jiri
  rationale: Nkebiokwu genitive absolute a na-egosi oge ihe mere. “Mgbe chi jiri” bụ ụzọ Igbo nkịtị si ekwu na mgbede abatala.
- source_word: πλοῖον
  choice: ụgbọ mmiri ahụ
  rationale: N’ọnọdụ Oké Osimiri Galili, “ụgbọ mmiri” bụ okwu Igbo doro anya ma kwekọọ n’ụgbọ e kwuru maka ya.
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: n’etiti oke osimiri
  rationale: Nke a na-echekwa echiche nke ịnọ n’etiti mmiri, n’ebe dị anya n’ala, na-enweghị ịgbakwunye nkọwa na-adịghị na Greek.
- source_word: θάλασσα
  choice: oke osimiri
  rationale: Ọ bụ ezie na Galili bụ ọdọ mmiri n’usoro ala, Greek kpọrọ ya θάλασσα; “oke osimiri” na-echekwa aha na ọdịiche dị n’etiti mmiri na ala.
- source_word: αὐτὸς μόνος
  choice: naanị ya nọ
  rationale: Nhọrọ a na-egosi nke ọma na ọ nọ naanị ya ma na-anọgide n’ụzọ okwu Igbo si ada n’ọnụ.
- source_word: ἐπὶ τῆς γῆς
  choice: n’elu ala
  rationale: Nke a na-asụgharị okwu Greek n’ụzọ kpọmkwem ma na-echekwa ọdịiche dị n’etiti ebe ụgbọ ahụ nọ n’oké osimiri na ebe Jizọs nọ n’ala.
