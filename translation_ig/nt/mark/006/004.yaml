source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτοῖς ὁ Ἰησοῦς ὅτι Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ πατρίδι αὐτοῦ καὶ ἐν τοῖς ⸂συγγενεῦσιν αὐτοῦ⸃ καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: ig
  text: Jizọs nọ na-agwa ha, sị, “A na-asọpụrụ onye amụma n'ebe ọ bụla, ma e wezụga n’obodo ya[a], n’etiti ndị ikwu ya[b], na n’ezinụlọ ya[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘ebe o si’ ma ọ bụ ‘ala nna ya.’ Okwu Grik ahụ na-ezo aka n’ebe mmadụ si; n’ebe a, ọ bụ obodo Nazaret.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘ụmụnna ya.’ Okwu Grik ahụ na-ezo aka ná ndị ikwu ma ọ bụ ndị otu agbụrụ mmadụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, ‘ụlọ ya.’ Okwu Grik ahụ nwere ike ịpụta ụlọ nkịtị ma ọ bụ ndị bi n’ụlọ ahụ, ya bụ ezinụlọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: nọ na-agwa
  rationale: Oge imperfect na-egosi okwu na-aga n’ihu n’akụkọ ahụ; ‘nọ na-agwa’ na-egosipụta nke a n’Igbo dị mfe.
- source_word: προφήτης
  choice: onye amụma
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka προφήτης.
- source_word: ἄτιμος
  choice: a na-adịghị asọpụrụ
  rationale: Nke a na-edobe echiche nke enweghị nsọpụrụ ma na-eme ka ilu ahụ bụrụ Igbo sitere n’ọnụ mmadụ.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: N’ahịrịokwu a jụrụ ajụ, ọ na-egosi ebe a kpọpụrụ iche, ọ bụghị ọnọdụ nke ‘ọ bụrụ na ọ bụghị.’
- source_word: πατρίδι
  choice: obodo ya
  rationale: N’ọnọdụ Nazaret, okwu ahụ na-ezo aka n’obodo onye si, ọ bụghị n’ala nna sara mbara.
- source_word: συγγενεῦσιν
  choice: ndị ikwu ya
  rationale: Ọ na-ezo aka n’ụmụnna na ndị so n’agbụrụ onye; ‘ndị ikwu’ bụ okwu Igbo doro anya ma dị ugbu a.
- source_word: οἰκίᾳ
  choice: ezinụlọ ya
  rationale: N’usoro si n’obodo ruo ná ndị ikwu, okwu a dabara nke ọma dị ka ndị bi n’ụlọ ma ọ bụ ezinụlọ kacha nso, ọ bụ ezie na ọ pụkwara ịpụta ụlọ nkịtị.
- source_word: καὶ ... καὶ ... καὶ
  choice: '..., n’etiti ..., na ...'
  rationale: E debere nchịkọta ebe atọ ahụ n’usoro, n’Igbo na-agụ nke ọma ma na-egosi mgbasawanye ruo n’ezinụlọ kacha nso.
theological_decisions:
- issue: Ókè ilu Jizọs kwuru banyere nsọpụrụ onye amụma
  choice: A sụgharịrị ya dị ka ilu zuru ezu nke ọnọdụ ahụ metụtara Jizọs, n’etinyeghị nkọwa ọzọ banyere ịbụ Mesaya ma ọ bụ ekweghị ekwe.
  alternative: Ịkọwapụta ya hoo haa dị ka okwu banyere Mesaya a jụrụ ajụ ma ọ bụ banyere ekweghị ekwe n’ozuzu ya.
  rationale: Grik ahụ kwuru naanị ilu banyere onye amụma a na-adịghị asọpụrụ n’ebe ndị maara ya nke ọma nọ; ntụgharị ekwesịghị ịgbakwunye nkọwa ozizi na-adịghị n’amaokwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ilu Igbo sitere n’ọnụ mmadụ—‘Ọ dịghị ebe... ma e wezụga...’—iji chekwaa ntụgharị echiche Grik nke ‘ọ bụghị onye na-enweghị nsọpụrụ ma e wezụga...’ n’enweghị ahịrịokwu siri ike ma ọ bụ nke na-edoghị anya.
