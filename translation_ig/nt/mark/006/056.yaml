id: MRK.6.56
reference: Mark 6:56
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: ig
  text: N’ebe ọ bụla ọ banyere—ma n’obodo nta, ma n’obodo ukwu, ma n’ala ime obodo[a]—ndị mmadụ na-atọgbọ ndị ọrịa n’ámá ahịa. Ha na-arịọ ya ka ha metụ ọbụna ọnụ uwe ya aka[b]. Onye ọ bụla metụrụ ya aka, a na-agwọ ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ubi” ma ọ bụ “mpaghara ime obodo.” N’ebe a, ἀγροί nwere ike ịpụta ala ma ọ bụ mpaghara ndị dị n’èzí obodo.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọnụ ala uwe ya,” “ọnụ uwe ya,” ma ọ bụ “eriri dị n’ọnụ uwe ya.” Okwu Grik κράσπεδον nwere ike ịpụta ọnụ uwe, ma n’ọnọdụ ndị Juu ọ pụkwara ime ka a cheta eriri ndị a na-etinye n’ọnụ uwe.
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ kpọmkwem, Grik kwuru “a na-azọpụta ha” ma ọ bụ “a na-eme ka ahụ dị ha mma.” N’ebe a, okwu ahụ na-ezo aka n’ịgwọ ọrịa ma ọ bụ ime ka ahụ dị mmadụ mma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν
  choice: N’ebe ọ bụla
  rationale: Nke a na-egosipụta echiche izugbe nke ebe ọ bụla Jizọs gara, dị ka njikọ ὅπου na ἄν si eme na Grik.
- source_word: εἰσεπορεύετο
  choice: ọ banyere
  rationale: Ọ bụ ngwaa imperfect nke na-akọ omume e mere ugboro ugboro; ‘N’ebe ọ bụla’ emeela ka echiche ahụ pụta ìhè n’Igbo n’enweghị ikwubiga okwu ókè.
- source_word: κώμας ... πόλεις ... ἀγρούς
  choice: obodo nta ... obodo ukwu ... ala ime obodo
  rationale: Nhọrọ ndị a na-ekewa obodo nta, obodo ukwu, na mpaghara ndị na-abụghị obodo n’ụzọ ndị na-agụ Igbo nke oge a ga-aghọta.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: n’ámá ahịa
  rationale: ἀγορά bụ ebe ahịa ma ọ bụ ámá ọha; ‘ámá ahịa’ bụ okwu Igbo doro anya nke dabara n’ọnọdụ a.
- source_word: ἐτίθεσαν
  choice: na-atọgbọ
  rationale: Ụdị na-aga n’ihu na-egosipụta omume a na-eme ugboro ugboro, dị ka imperfect Grik si dị.
- source_word: τοὺς ἀσθενοῦντας
  choice: ndị ọrịa
  rationale: Nke a bụ ụzọ Igbo dị mkpirikpi ma doo anya isi kwuo ndị ahụ na-arịa ọrịa ma ọ bụ na-adịghị ike.
- source_word: παρεκάλουν
  choice: na-arịọ ya
  rationale: N’ọnọdụ a, okwu ahụ pụtara ịrịọsi ike; usoro ahịrịokwu ahụ na-eme ka arịrịọ ahụ pụta ìhè n’Igbo.
- source_word: ἵνα κἂν ... ἅψωνται
  choice: ka o kwe ka ha metụ naanị ... aka
  rationale: ‘naanị’ na-egosipụta echiche nke ihe kacha nta ha na-arịọ—na imetụ ọnụ ọnụ uwe ahụ aka ga-ezu.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: ọnụ ọnụ uwe ya
  rationale: κράσπεδον nwere ike ịbụ ọnụ, hem, fringe, ma ọ bụ tassel nke uwe. ‘Ọnụ ọnụ uwe’ na-edobe obosara ihe okwu Grik nwere ike ịpụta n’egosighị otu nkọwa naanị.
- source_word: ἥψαντο αὐτοῦ
  choice: metụrụ ya aka
  rationale: Grik ji nnọchiaha na-ezo aka n’onwe ya mee ihe; okwu banyere ọnụ ọnụ uwe ya dị n’ahịrịokwu bu ụzọ na-eme ka ụzọ e si metụ ya aka doo anya.
- source_word: ἐσῴζοντο
  choice: a na-agwọ ya
  rationale: σῴζω nwere ike ịpụta ịzọpụta, ime ka mmadụ dịrị mma, ma ọ bụ ịgwọ. N’ebe a, ndị ọrịa na imetụ aka na-egosi na ọgwụgwọ anụ ahụ bụ isi echiche.
theological_decisions:
- issue: Ụzọ e si sụgharịa ἐσῴζοντο (σῴζω)
  choice: a na-agwọ ya
  alternative: a na-azọpụta ya; a na-eme ka ahụ dị ya mma
  rationale: Ọ bụ ezie na σῴζω na-apụtakarị ‘ịzọpụta,’ ihe gbara ya gburugburu bụ ọrịa na ọgwụgwọ anụ ahụ. Isi ederede na-ekwu ‘a na-agwọ ya,’ ebe nkọwa ala peeji na-echekwa obosara okwu Grik ahụ.
- issue: Ihe αὐτοῦ na-ezo aka na ya n’okwu ἥψαντο αὐτοῦ
  choice: metụrụ ya aka
  alternative: metụrụ uwe ya aka; metụrụ ọnụ ọnụ uwe ya aka
  rationale: Isi ederede Grik kwuru ‘ya,’ ọ bụghị ‘ya/uwe ahụ.’ Ide ‘metụrụ ya aka’ na-edobe usoro Grik ma hapụ ahịrịokwu bu ụzọ ka ọ kọwaa na ha chọrọ imetụ ọnụ ọnụ uwe ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro ‘na-atọgbọ’ na ‘na-arịọ’ na-egosipụta omume ndị a na-eme ugboro ugboro n’akụkọ nchịkọta a. E tinyere akara nkọwa [a], [b], na [c] n’isi ederede n’ebe ha kwesịrị ịdị.
