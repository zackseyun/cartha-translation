revisions:
- from: N’ebe ọ bụla ọ banyere—ma n’obodo nta, ma n’obodo ukwu, ma n’ala ime obodo[a]—ndị mmadụ na-atọgbọ ndị ọrịa n’ámá ahịa. Ha na-arịọ ya ka o kwe ka ha metụ naanị ọnụ ọnụ uwe ya aka[b]. Onye ọ bụla metụrụ ya aka, a na-agwọ ya[c].
  to: N’ebe ọ bụla ọ banyere—ma n’obodo nta, ma n’obodo ukwu, ma n’ala ime obodo[a]—ndị mmadụ na-atọgbọ ndị ọrịa n’ámá ahịa. Ha na-arịọ ya ka ha metụ ọbụna ọnụ uwe ya aka[b]. Onye ọ bụla metụrụ ya aka, a na-agwọ ya[c].
  rationale: The sole substantive correction removes an added permission concept and renders κἄν with “ọbụna.” Minor wording and footnote adjustments make the Igbo more natural and keep the lexical notes internally consistent, without changing the verse’s meaning.
