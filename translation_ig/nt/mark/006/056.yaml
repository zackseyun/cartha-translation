review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the locations, public marketplaces, sick people, and the contextual physical-healing sense of ἐσῴζοντο. However, “ka o kwe ka ha ...” introduces Jesus’ granting permission, which is not stated by ἵνα κἂν ... ἅψωνται. The revised wording retains their request without adding that element.
  naturalness: The revised text uses clear, modern Standard Igbo. “Ka ha metụ ọbụna ọnụ uwe ya aka” is direct and idiomatic, and avoids the slightly cumbersome “ka o kwe ka.”
  terminology: “Ámá ahịa,” “ndị ọrịa,” and “ọnụ uwe ya” are appropriate. “Ọnụ uwe” preserves κράσπεδον’s broad edge/fringe sense; the footnote records the viable more specific senses. “A na-agwọ ya” is suitable in this healing context, while the note preserves the lexical range of σῴζω.
  issues:
  - severity: medium
    issue: The phrase “ka o kwe ka ha metụ naanị ọnụ ọnụ uwe ya aka” adds permission and alters the force of the request.
    rationale: The Greek says that they begged him “that they might touch even the fringe of his garment.” It does not explicitly say that they asked him to allow them. Also, “naanị” is less exact here than “ọbụna,” which naturally conveys κἄν (“even/at least”).
  - severity: low
    issue: The wording “ọnụ ọnụ uwe ya” is needlessly repetitive in the main text.
    rationale: “Ọnụ uwe ya” naturally conveys the garment’s edge/hem while leaving room for the lexical ambiguity of κράσπεδον, which is explained in the footnote.
  revised_text: N’ebe ọ bụla ọ banyere—ma n’obodo nta, ma n’obodo ukwu, ma n’ala ime obodo[a]—ndị mmadụ na-atọgbọ ndị ọrịa n’ámá ahịa. Ha na-arịọ ya ka ha metụ ọbụna ọnụ uwe ya aka[b]. Onye ọ bụla metụrụ ya aka, a na-agwọ ya[c].
