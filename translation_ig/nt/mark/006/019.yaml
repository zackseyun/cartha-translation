    text: A pụkwara ịsị, “nọ na-eburu ya iwe n’obi” ma ọ bụ “nọ na-akpaso ya iwe.” Akpaalaokwu Grik a na-egosi iro ma ọ bụ iwe na-adịgide adịgide.
    reason: lexical_alternative
  revision_rationale: The revision corrects the finite verb to “chọrọ,” avoiding the potentially additive force of -kwa, and makes the final clause explicitly refer to carrying out the killing. It retains the clear antecedent “Jọn,” the adversative structure, and the Greek sense of entrenched hostility without overtranslating it.
