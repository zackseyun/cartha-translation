  to: Ma Herodias buuru Jọn iwe n’obi, chọọ igbu ya[a], ma o nweghị ike ime ya.
  rationale: The revision corrects the finite verb to “chọrọ,” avoiding the potentially additive force of -kwa, and makes the final clause explicitly refer to carrying out the killing. It retains the clear antecedent “Jọn,” the adversative structure, and the Greek sense of entrenched hostility without overtranslating it.
