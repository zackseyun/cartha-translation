  text: ἡ δὲ Ἡρῳδιὰς ἐνεῖχεν αὐτῷ καὶ ἤθελεν αὐτὸν ἀποκτεῖναι, καὶ οὐκ ἠδύνατο·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/019.yaml
  text: But Herodias held a grudge against him and wanted to kill him[a], but she could not.
translation:
  language: ig
  text: Ma Herodias buuru Jọn iwe n’obi, chọọ igbu ya[a], ma o nweghị ike ime ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nọ na-eburu ya iwe n’obi” ma ọ bụ “nọ na-akpaso ya iwe.” Akpaalaokwu Grik a na-egosi iro ma ọ bụ iwe na-adịgide adịgide.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi mgbanwe nwere ọdịiche n’ihe e kwuru n’amaokwu bu ụzọ; “Ma” dabara n’ọnọdụ a.
- source_word: Ἡρῳδιὰς
  choice: Herodias
  rationale: E depụtara aha onye ahụ n’ụdị ntụgharị mkpụrụokwu a na-ejikarị n’Igbo.
- source_word: ἐνεῖχεν αὐτῷ
  choice: buuru Jọn iwe n’obi
  rationale: Akpaalaokwu Grik a na-egosi iwe na iro na-adịgide adịgide megide mmadụ; iji aha Jọn mee ihe kama nnọchiaha na-eme ka onye a na-ekwu maka ya doo anya n’Igbo.
- source_word: ἤθελεν
  choice: chọọkwa
  rationale: Ọ na-egosi ọchịchọ Herodias; njikọ “-kwa” jikọtara ọchịchọ ahụ na iwe o buuru ya.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: igbu ya
  rationale: Nke a bụ ntụgharị kwụ ọtọ na nke ebumpụta ụwa nke ἀποκτείνω, n’etinyeghị echiche iwu ma ọ bụ ikpe ọzọ na-adịghị n’okwu Grik.
- source_word: καὶ οὐκ ἠδύνατο
  choice: ma o nweghị ike
  rationale: 'Ọ bụ ezie na καὶ na-abụkarị “na,” ebe a ọ na-egosi ihe megidere ọchịchọ ya: ọ chọrọ igbu ya, ma enweghị ike ime ya.'
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ugwu ma dịkwa mfe nghọta. “Buuru ... iwe n’obi” na-ekwupụta iro na-adịgide adịgide n’ụzọ ndị na-agụ Igbo ga-aghọta nke ọma.
