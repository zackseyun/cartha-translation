  text: ὁ δὲ λέγει αὐτοῖς· Πόσους ⸂ἔχετε ἄρτους⸃; ⸀ὑπάγετε ἴδετε. καὶ γνόντες λέγουσιν· Πέντε, καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/038.yaml
  text: But he said to them, “How many loaves do you have? Go and see.” And when they found out, they said, “Five, and two fish.”
translation:
  language: ig
  text: Ma ọ sịrị ha, “Ogbe achịcha ole ka unu nwere? Gaanụ chọpụta.” Mgbe ha matara, ha sịrị, “Ise, na azụ abụọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρτους
  choice: ogbe achịcha
  rationale: ‘Ogbe achịcha’ na-egosi achịcha a na-agụ ọnụ n'ụzọ doro anya ma bụrụkwa okwu Igbo nkịtị.
- source_word: ὑπάγετε ἴδετε
  choice: Gaanụ hụ
  rationale: Nke a na-edobe iwu abụọ ahụ nkenke ma kwekọọ n’usoro na ike okwu Grik.
- source_word: γνόντες
  choice: Mgbe ha chọpụtakwara
  rationale: Ọ na-egosi na ha gara mata ọnụ ọgụgụ ahụ tupu ha azaa, dịka participle Grik si dị.
- source_word: ἰχθύας
  choice: azụ
  rationale: ‘Azụ’ bụ okwu Igbo zuru oke maka fish; ọnụọgụ ‘abụọ’ na-eme ka plural pụta ìhè.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ùgwù. A sụgharịrị present akụkọ ihe mere eme λέγει/λέγουσιν dịka oge gara aga (‘sịrị’) ka akụkọ ahụ na-asọ nke ọma n’Igbo, n’enweghị mgbanwe n’ihe ọ pụtara.
