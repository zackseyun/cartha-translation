    rationale: In “nye ya nwa agbọghọ ahụ,” the placement of “ya” before the recipient can hinder clear identification of the head as the item given. “nye nwa agbọghọ ahụ isi ahụ” is clear and idiomatic.
  - severity: medium
    issue: Ambiguous pronouns in the transfer chain
    rationale: The repeated pronoun “ya” in the draft can be read unclearly across the girl and her mother. Repeating “isi ahụ” preserves the Greek chain of transfer in natural Igbo.
  - severity: low
    issue: “Nnukwu efere” is less precise for πίναξ
    rationale: A πίναξ is a serving dish/platter; “efere sara mbara” better conveys this without implying only size or a bowl.
