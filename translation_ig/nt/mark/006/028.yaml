base_translation:
  language: en
  yaml_path: translation/nt/mark/006/028.yaml
  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: ig
  text: Ọ wetara isi ya n’elu efere sara mbara[a] ma nye nwa agbọghọ ahụ isi ahụ; nwa agbọghọ ahụ nyekwara nne ya isi ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’elu tray” ma ọ bụ “n’elu efere.” Okwu Grik πίναξ na-ezo aka n’efere sara mbara, tray, ma ọ bụ ihe e ji enye nri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκεν
  choice: bute
  rationale: Ngwaa a na-egosi na o ji isi ahụ bịa n’ebe oriri ahụ; “bute” bụ okwu Igbo doro anya ma kwekọọ n’omume ahụ.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: isi ya
  rationale: Nke a bụ ụzọ Igbo si egosipụta ihe mmadụ nwe; n’akụkọ gbara amaokwu a gburugburu, “ya” na-ezo aka n’isi Jọn Onye Na-eme Baptizim.
- source_word: ἐπὶ πίνακι
  choice: n’elu nnukwu efere
  rationale: πίναξ bụ efere sara mbara ma ọ bụ ihe e ji ebu ma na-enye nri; “nnukwu efere” dabara n’ọnọdụ oriri ahụ ma dị mfe nghọta n’Igbo.
- source_word: ἔδωκεν
  choice: nye
  rationale: A nọgidere n’otu ngwaa ahụ n’ebe abụọ ahụ dịka Grik siri kwughachi δίδωμι, ka usoro inyefe isi ahụ pụta ìhè.
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: nwa agbọghọ ahụ
  rationale: κοράσιον na-ezo aka n’ebe nwaanyị na-eto eto nọ; “nwa agbọghọ ahụ” bụ okwu Igbo nke oge a, doro anya, na-enweghị ụda okwu ochie.
- source_word: τῇ μητρὶ αὐτῆς
  choice: nne ya
  rationale: Nke a bụ usoro Igbo e ji egosi onye e nyere ihe na mmekọrịta ya na nwa agbọghọ ahụ.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Wee” na-eme ka usoro omume atọ ahụ na-esochi ibe ha pụta ìhè. E debere ntụaka “ya” n’ụzọ dabara n’Igbo, ebe ihe gbara amaokwu ahụ gburugburu na-eme ka onye na ihe ọ na-ezo aka na ha doo anya. E tinyere akara nkọwa [a] ozugbo n’akụkụ “nnukwu efere,” nke bụ okwu nkọwa ahụ metụtara.
