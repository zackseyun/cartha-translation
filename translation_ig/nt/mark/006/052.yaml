  text: οὐ γὰρ συνῆκαν ἐπὶ τοῖς ἄρτοις, ⸂ἀλλ’ ἦν⸃ αὐτῶν ἡ καρδία πεπωρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/052.yaml
  text: for they did not understand about the loaves[b][a], but their hearts were hardened.
translation:
  language: ig
  text: N’ihi na ha aghọtaghị ihe gbasara ogbe achịcha ndị ahụ[b], kama obi ha esila ike[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “obi ha kpọrọ nkụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha aghọtaghị ihe ogbe achịcha ndị ahụ pụtara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: ha aghọtaghị
  rationale: “Ịghọta” bụ okwu Igbo doro anya nke na-egosi na ndị na-eso ụzọ ahụ amataghị ma ọ bụ aghọtabeghị ihe omume ahụ nke ọma.
- source_word: ἐπὶ τοῖς ἄρτοις
  choice: ihe ogbe achịcha ndị ahụ pụtara
  rationale: Nke a na-egosi na nsogbu ahụ abụghị nanị icheta ogbe achịcha, kama ọ bụ ịghọta ihe ọrụ ebube ahụ na-egosi; e tinyekwara nkọwa ọzọ n’akwụkwọ ala iji chekwaa nsụgharị dị nso n’usoro Grik.
- source_word: ἄρτοις
  choice: ogbe achịcha ndị ahụ
  rationale: Ụdị ọtụtụ nke okwu Grik na-ezo aka n’ogbe achịcha ndị e ji nye ìgwè mmadụ nri n’akụkọ gara aga.
- source_word: καρδία
  choice: obi
  rationale: “Obi” na Igbo nwere ike ịpụta ime mmadụ, nghọta ya, na ọnọdụ uche ya, dịka okwu Grik si arụ ọrụ ebe a.
- source_word: πεπωρωμένη
  choice: kpọrọ nkụ
  rationale: Akpaalaokwu a na-echekwa ihe atụ nke obi ghọrọ ihe siri ike ma na-adịghị anabata nghọta; akwụkwọ ala na-enye “siri ike” dịka ụzọ ọzọ.
- source_word: ἀλλ’ ἦν
  choice: kama ... kpọrọ
  rationale: “Kama” na-egosi ọdịiche dị n’etiti enweghị nghọta ha na ọnọdụ obi ha.
- source_word: αὐτῶν ἡ καρδία
  choice: obi ha
  rationale: “Obi ha” bụ usoro Igbo ebumpụta ụwa ma na-echekwa aha otu onye nke Grik ji n’ụzọ mkpokọta.
theological_decisions:
- issue: Ụdị ọnọdụ ndị na-eso ụzọ ahụ nke πεπωρωμένη na-akọwa
  choice: obi ha kpọrọ nkụ
  alternative: obi ha siri ike
  rationale: Nsụgharị ahụ na-egosi enweghị mmetụta na nghọta ime mmụọ, ma ọ naghị ekwu onye mere ka obi ha sie ike ma ọ bụ tinye ozizi karịrị ihe Mak kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ogbe achịcha” na-ezo kpọmkwem n’ogbe achịcha nke ọrụ ebube gara aga; “obi ha” na-echekwa otu mkpokọta dị na Grik.
