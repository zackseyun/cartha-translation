revisions:
- from: n’ihi na ha aghọtaghị ihe ogbe achịcha ndị ahụ pụtara[b], kama obi ha kpọrọ nkụ[a].
  to: N’ihi na ha aghọtaghị ihe gbasara ogbe achịcha ndị ahụ[b], kama obi ha esila ike[a].
  rationale: The revision places the more neutral expression for ἐπὶ τοῖς ἄρτοις in the main text and retains the contextual ‘significance’ interpretation as an alternative. It also replaces “kpọrọ nkụ” with the more precise “esila ike” for the metaphor of a heart that has become hardened, while preserving the Greek perfect-state sense and avoiding any claim about the cause of that hardening.
