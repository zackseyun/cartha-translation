  text: καὶ ἐδίδουν ⸀αὐτῷ ἐσμυρνισμένον οἶνον, ⸀ὃς δὲ οὐκ ἔλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/023.yaml
  text: And they were giving him wine mixed with myrrh[b][a], but he did not take it.
translation:
  language: ig
  text: Ha na-enye ya mmanya a gwakọtara na máá[a], ma ọ[b] naraghị ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmanya e tinyere máá.”
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik, okwu ahụ pụtara n’ụzọ nkịtị “onye/ọ bụ onye—ma”; ebe a ọ na-alaghachi n’ebe Jizọs nọ: “ma ọ naraghị ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδουν
  choice: Ha na-enye
  rationale: Oge imperfect na-egosi omume na-aga n’ihu ma ọ bụ mgbalị a na-eme n’akụkọ ahụ. “Na-enye” na-echekwa ọdịdị a karịa naanị “nyere,” ma ọ ka na-anọ nso na δίδωμι, “inye.”
- source_word: ἐσμυρνισμένον οἶνον
  choice: mmanya a gwakọtara na máá
  rationale: Nke a na-egosi n’ụzọ doro anya na a kwadebere mmanya ahụ na máá, na-agbakwụghị ihe banyere nzube ya.
- source_word: ὃς δὲ
  choice: ma ọ
  rationale: Ọ bụ ezie na ὃς bụ nnọchiaha njikọ n’ụdị ya, ebe a ọ na-alaghachi n’ebe Jizọs nọ; “ma ọ” bụ Igbo ebumpụta ụwa ma na-echekwa ntakịrị mmegide nke δέ.
- source_word: ἔλαβεν
  choice: naraghị ya
  rationale: λαμβάνω nwere ike ịpụta ‘ịnara’ ma ọ bụ ‘ịnata.’ “Naraghị ya” na-echekwa ihe e kwuru kpọmkwem, n’etinyeghị nkọwa na ọ ṅụghị ya ma ọ bụ ihe mere o ji jụ ya.
theological_decisions:
- issue: Ihe mere Jizọs ji ghara ịnara mmanya ahụ
  choice: A kọwara naanị na ọ naraghị ya, n’enyeghị ihe kpatara ya.
  alternative: Ịkọwa ya dị ka ọgwụ na-ebelata ihe mgbu nke ọ kpachapụrụ anya jụ.
  rationale: Amaokwu ahụ ekwughị nzube mmanya ahụ ma ọ bụ ihe mere Jizọs ji ghara ịnara ya; ya mere, nsụgharị ahụ ekwesịghị idozi ajụjụ ahụ site n’itinye nkọwa okpukpe ma ọ bụ akụkọ ọdịnala.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu. “Máá” bụ aha ihe ahụ a gwakọtara na mmanya; ahịrịokwu ahụ ezere ịkọwa ya dị ka ọgwụ ma ọ bụ ikwu na Jizọs ṅụrụ ya, ebe Grik kwuru naanị na ọ naraghị ya.
