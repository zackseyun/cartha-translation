  yaml_path: translation/nt/mark/015/042.yaml
  text: And when evening had already come[a], since it was the Preparation Day—that is[c][b], the day before the Sabbath—
translation:
  language: ig
  text: Ma mgbe mgbede ruworị[a], ebe ọ bụ na ọ bụ Ụbọchị Nkwadebe—ya bụ, ụbọchị tupu Ụbọchị Izu Ike—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ọ ghọwororị mgbede.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἤδη ὀψίας γενομένης
  choice: Mgbe chi jirila
  rationale: Nkebi ahịrịokwu a na-egosi oge ihe mere. “Chi jirila” bụ ụzọ Igbo nkịtị si ekwu na mgbede abịala, ma ọ na-eburu echiche ἤδη, ‘ugbua/ama,’ n’ụzọ dabara adaba n’akụkọ.
- source_word: ἐπεὶ
  choice: ebe ọ bụ
  rationale: N’ebe a, okwu ahụ na-enye ihe kpatara ma na-akọwakwa ọnọdụ ahụ; “ebe ọ bụ” na-egosipụta ọrụ abụọ ahụ n’Igbo doro anya.
- source_word: παρασκευή
  choice: Ụbọchị Nkwadebe
  rationale: N’ọnọdụ a, ọ bụghị nkwadebe n’ozuzu ya kama ọ bụ aha ụbọchị a na-akwadebe maka Ụbọchị Izu Ike. Itinye “Ụbọchị” na-eme ka ihe ọ pụtara doo onye na-agụ anya.
- source_word: ὅ ἐστιν
  choice: ya bụ
  rationale: “Ya bụ” bụ usoro Igbo a na-ejikarị akọwa okwu e kwuru tupu ya, kwekọrọ n’usoro nkọwa Grik.
- source_word: προσάββατον
  choice: ụbọchị bu Ụbọchị Izu Ike ụzọ
  rationale: Nhọrọ a na-enye ihe okwu Grik pụtara kpọmkwem—ụbọchị dị tupu Ụbọchị Izu Ike—na-akpọghị ya Fraịdee, nke ga-abụ nkọwa karịa ụdị okwu ahụ n’onwe ya.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Ụbọchị Izu Ike” mee Sabbath, ma zere itinye nkọwa ụka pụrụ iche. E debeere ahịrịokwu ahụ akara njedebe ogologo n’ihi na amaokwu a na-eduga ozugbo n’ihe na-esote.
