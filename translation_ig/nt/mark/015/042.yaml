  rationale: The revision directly renders evening’s arrival, preserves the Greek explanatory relationship (“since it was”), and replaces an unidiomatic expression for the day before the Sabbath with standard, clear Igbo. The initial “Ma” retains Mark’s connective Καὶ, while the closing dash remains appropriate because the sentence continues in the next verse.
