revisions:
- from: Mgbe elekere nke itoolu ruru, Jizọs jiri oké olu tie mkpu, sị, “Eloi, Eloi, lema sabachthani?”[a] Nke a, mgbe a sụgharịrị ya, bụ, “Chineke m, Chineke m,[b] n’ihi gịnị ka ị gbahapụrụ m?”[c]
  to: Mgbe elekere nke itoolu ruru, Jizọs jiri oké olu tie mkpu, sị, “Eloi, Eloi, lema sabachthani?”[a] nke pụtara, “Chineke m, Chineke m,[b] n’ihi gịnị ka ị gbahapụrụ m?”[c]
  rationale: A small stylistic revision makes Mark’s parenthetical explanation sound natural in Standard Igbo. The wording continues to preserve the Semitic cry, the Psalm 22 resonance in the note, and the unsoftened question of divine abandonment without adding doctrinal interpretation.
