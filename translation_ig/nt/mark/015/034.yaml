id: MRK.15.34
reference: Mark 15:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: ig
  text: Mgbe elekere nke itoolu ruru, Jizọs jiri oké olu tie mkpu, sị, “Eloi, Eloi, lema sabachthani?”[a] nke pụtara, “Chineke m, Chineke m,[b] n’ihi gịnị ka ị gbahapụrụ m?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide ochie na ọtụtụ ọdịnala Bekee nwere ụdị okwu Semitik a bụ “lama sabachthani” kama “lema sabachthani.”
    reason: textual_variant
  - marker: b
    text: Okwu Jizọs ndị a na-ekwughachi Abụ Ọma 22:1.
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, “Gịnị mere i ji gbahapụ m?”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: Mgbe elekere nke itoolu ruru
  rationale: Nke a na-edobe usoro oge dị n’akwụkwọ Mak n’ụzọ Igbo doro anya, kama ịgbanwe ya ozugbo ka ọ bụrụ elekere atọ nke ehihie.
- source_word: ἐβόησεν
  choice: tie mkpu
  rationale: Nkebiokwu a na-egosi iti mkpu n’olu ike ma bụrụkwa okwu Igbo a na-aghọta ngwa ngwa.
- source_word: φωνῇ μεγάλῃ
  choice: jiri oké olu
  rationale: Ọ na-egosi otú Jizọs si tie mkpu ma na-edobe ike na ịdị arọ nke okwu Grik.
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: Eloi, Eloi, lema sabachthani?
  rationale: E debere okwu Semitik Mak dere tupu e nye nsụgharị ya, a naghịkwa agwakọta ya na ụdị okwu dị na Matiu.
- source_word: μεθερμηνευόμενον
  choice: Nke a, mgbe a sụgharịrị ya, bụ
  rationale: Nke a na-egosi n'ụzọ doro anya na Mak na-enye nsụgharị nke okwu Semitik ndị ahụ.
- source_word: εἰς τί
  choice: n’ihi gịnị
  rationale: Ọ na-edobe ajụjụ banyere ihe kpatara omume ahụ, n’ụzọ dị nso n’usoro okwu Grik ma bụrụkwa Igbo nkịtị.
- source_word: ἐγκατέλιπές με
  choice: ị gbahapụrụ m
  rationale: “Gbahapụ” na-egosi ịhapụ mmadụ kpamkpam ma na-edobe ịdị arọ nke mkpu ahụ na njikọ ya na Abụ Ọma 22:1.
theological_decisions:
- issue: Njikọ mkpu Jizọs na Abụ Ọma 22:1
  choice: E debere ya dịka ezigbo mkpu nke ịbụ onye a gbahapụrụ, tinyere ntụaka na Abụ Ọma 22:1 n’ala peeji.
  alternative: Ịkọwa n’ahịrịokwu ahụ otú e kwesịrị isi ghọta njikọ dị n’etiti Nna na Ọkpara n’oge ahụ.
  rationale: Amaokwu ahụ n’onwe ya anaghị edozi esemokwu nkà mmụta okpukpe ahụ. Nsụgharị ahụ na-edobe mkpu ahụ na ụda Akwụkwọ Nsọ ya n’enweghị itinye nkọwa otu ụka.
- issue: Otu e si dee okwu Semitik Jizọs kwuru
  choice: E debere “Eloi, Eloi, lema sabachthani?” ma nyezie nsụgharị ya ozugbo.
  alternative: Ịhapụ okwu Semitik ahụ ma nye naanị ihe ọ pụtara, ma ọ bụ ịgbanwe ya ka ọ bụrụ ụdị dị na Matiu.
  rationale: Nke a na-agbaso usoro Mak n’onwe ya ma na-ezere ime ka akụkọ Mak kwekọọ n’ụzọ aka mere na nke Matiu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. E debere okwu Semitik ahụ dịka ntụgharị mkpụrụedemede, a na-ejikwa “oké olu,” “tie mkpu,” na “gbahapụ” chekwaa ike na ịdị arọ nke amaokwu ahụ.
