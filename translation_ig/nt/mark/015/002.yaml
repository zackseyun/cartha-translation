id: MRK.15.2
reference: Mark 15:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: ig
  text: Paịlet jụrụ ya, sị, “Ị bụ eze ndị Juu[a]?” Ọ zara ya, sị, “Ọ bụ gị na-ekwu ya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị Judia.” N’ebe a, okwu ahụ bụ “eze ndị Juu” na-egosi ebubo ndọrọ ndọrọ ọchịchị a na-ebokarị n’ihu Paịlet.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “Ọ bụ gị na-ekwu ya,” ma ọ bụ, n’ụzọ doro anya karị, “Ọ bụ ihe gị onwe gị kwuru.” Azịza Jizọs dị nkenke, ọ naghị ekwupụtakwa ihe o pụtara n’ụzọ zuru ezu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: jụrụ
  rationale: Okwu a pụtara ịjụ ajụjụ ma ọ bụ ịgba mmadụ ajụjụ ọnụ. “Jụrụ” bụ okwu Igbo doro anya nke na-adịghị eme ka ajụjụ Paịlet yie ajụjụ ọnụ siri ike karịa ka Grik si kwuo ya.
- source_word: Σὺ εἶ
  choice: Ị bụ
  rationale: N’ọnọdụ a, ọ bụ ajụjụ a na-ajụ kpọmkwem. Nnọchiaha dị n’ime “Ị” na-egosi onye a na-agwa okwu, ebe usoro ajụjụ na ụda olu na-ebute nrụgide okwu Grik ahụ n’ụzọ Igbo na-ada nke ọma.
- source_word: βασιλεὺς
  choice: eze
  rationale: “Eze” na-echekwa echiche nke ọchịchị eze na ebubo ndọrọ ndọrọ ọchịchị dị n’ajụjụ ahụ; “onye ọchịchị” ga-abụ okwu sara mbara karịa.
- source_word: Ἰουδαίων
  choice: ndị Juu
  rationale: N’ebe a, “eze ndị Juu” bụ aha ebubo ndọrọ ndọrọ ọchịchị e wetara n’ihu Paịlet. “Ndị Juu” bụkwa okwu a maara nke ọma n’Igbo, ebe nkọwa ọzọ “ndị Judia” ka e debere n’ala peeji.
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: Ọ zara ya, sị
  rationale: Usoro a na-enye Igbo dị ugbu a, dị mfe nghọta, ma na-ejikọta participle “ọ zara” na ngwaa ikwu okwu n’enweghị nhazi okwu siri ike. “Sị” na-arụ ọrụ nke iwebata okwu ọnụ n’akụkọ Igbo nke ọma.
- source_word: Σὺ λέγεις
  choice: Ọ bụ gị na-ekwu ya
  rationale: Nke a na-edebe nrụgide dị n’aha “gị” ma ghara itinye “ee” nke na-adịghị na Grik. Ọ na-ahapụkwa azịza ahụ ka ọ bụrụ nke mkpirikpi, nke a pụrụ ịghọta dịka nkwenye a kpaara ókè ma ọ bụghị nkwenye zuru ezu.
theological_decisions:
- issue: Ike na nghọta nke azịza Jizọs, Σὺ λέγεις
  choice: A sụgharịrị ya dịka “Ọ bụ gị na-ekwu ya,” nke bụ nzaghachi a kpaara ókè ma ka nwere mgbagwoju nghọta ụfọdụ.
  alternative: “Ee, ọ dị ka i kwuru” ma ọ bụ “Gị na-ekwu.”
  rationale: Grik etinyeghị “ee” n’ahịrịokwu ahụ. Ya mere, nsụgharị ahụ ekwesịghị ime ka ọ bụrụ nkwenye zuru ezu ma ọ bụ ịgọnahụ okwu Paịlet; ọ na-eme ka okwu ahụ nọgide n’ọnụ Paịlet dịka isi mmalite aha ahụ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Paịlet,” “eze,” na “ndị Juu” bụ okwu ndị a maara nke ọma. Nhazi “jụrụ ya, sị” na “zara ya, sị” bụ usoro akụkọ ọnụ na ederede na-ada nke ọma n’Igbo; azịza ikpeazụ ka e debere nkenke iji chekwaa esemokwu na nghọta abụọ dị na isi Grik.
