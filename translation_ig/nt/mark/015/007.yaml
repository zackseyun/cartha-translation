- from: Nwoke ahụ a na-akpọ Barabas nọ n’agbụ ya na ndị nnupụisi ahụ bụ́ ndị gburu mmadụ n’oge nnupụisi ahụ[a].
  to: Nwoke ahụ a na-akpọ Barabas nọ n’agbụ ya na ndị nnupụisi ahụ, ndị gburu mmadụ na nnupụisi ahụ[a].
  rationale: The revision preserves the source’s syntax and ambiguity while using the more direct Igbo locative expression for “in the rebellion.” It also makes the footnote’s alternatives and explanation more precise and idiomatic.
