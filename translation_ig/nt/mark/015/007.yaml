translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E ji ‘nọ n’agbụ’ mee ka ọnọdụ njide ahụ pụta n’Igbo ebumpụta ụwa; e jikwa ‘nnupụisi’ ugboro abụọ chekwaa njikọ okwu dị na Grik.
