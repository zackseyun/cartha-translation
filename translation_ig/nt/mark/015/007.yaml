  text: ἦν δὲ ὁ λεγόμενος Βαραββᾶς μετὰ τῶν ⸀στασιαστῶν δεδεμένος οἵτινες ἐν τῇ στάσει φόνον πεποιήκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/007.yaml
  text: The man called Barabbas was bound with the rebels who had committed murder in the rebellion[a].
translation:
  language: ig
  text: Nwoke ahụ a na-akpọ Barabas nọ n’agbụ ya na ndị nnupụisi ahụ, ndị gburu mmadụ na nnupụisi ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ya na ndị so ná mbilite megide ọchịchị” / “na mbilite ahụ.” N’asụsụ Grik, e ji okwu abụọ sitere n’otu mgbọrọgwụ kọwaa ndị sonyere ná mbilite ahụ na mbilite ahụ n’onwe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: nọ
  rationale: A sụgharịrị ἦν n’ụzọ kwekọrọ n’ọnọdụ onye nọ n’agbụ; δέ bụ njikọ dị nro nke usoro okwu Igbo achọghị ka e kwupụta iche n’ebe a.
- source_word: ὁ λεγόμενος
  choice: Nwoke ahụ a na-akpọ
  rationale: Nke a na-akọwa onye ahụ n’enweghị echiche nlelị nke okwu dịka ‘onye a sị na a na-akpọ’ pụrụ iweta.
- source_word: Βαραββᾶς
  choice: Barabas
  rationale: E dere aha onye ahụ n’ụdị ntụgharị mkpụrụokwu dabara n’Igbo.
- source_word: μετὰ τῶν στασιαστῶν
  choice: ya na ndị nnupụisi ahụ
  rationale: ‘Ndị nnupụisi’ na-egosi ndị sonyere ná mbilite megide ọchịchị, ma bụrụkwa okwu doro ndị na-agụ Igbo anya.
- source_word: δεδεμένος
  choice: nọ n’agbụ
  rationale: Perfect passive participle na-egosi ọnọdụ nke ịbụ onye e kere agbụ; ‘nọ n’agbụ’ bụ Igbo ebumpụta ụwa ma na-edebe ihe okwu Grik pụtara.
- source_word: οἵτινες
  choice: bụ́ ndị
  rationale: Nke a na-amalite nkebiokwu na-akọwakwu ndị nnupụisi ahụ.
- source_word: ἐν τῇ στάσει
  choice: n’oge nnupụisi ahụ
  rationale: στάσις ebe a bụ nnupụisi ma ọ bụ mbilite megide ọchịchị; ‘n’oge’ na-enye Igbo dị mma ma na-edebe njikọ ahụ.
- source_word: φόνον πεποιήκεισαν
  choice: gburu mmadụ
  rationale: Okwu ahụ na-egosi igbu mmadụ nke mere tupu oge akụkọ a; ‘gburu mmadụ’ bụ okwu Igbo doro anya ma ọ naghị ekpebi ma e gburu otu onye ma ọ bụ karịa karịa ihe Grik kwuru.
