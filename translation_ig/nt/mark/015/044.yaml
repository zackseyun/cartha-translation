    reason: lexical_alternative
  revision_rationale: The revision supplies the needed temporal complement for kemgbe and revises the footnote to preserve the alternative temporal nuance of πάλαι in natural Standard Igbo. It retains the source’s sequence, Pilate’s astonishment, and the centurion’s historical role without adding interpretation.
