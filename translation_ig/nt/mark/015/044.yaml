translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A kọwara ọkwa agha Rom kama iji mkpụrụokwu mbịarambịa ‘senturọn,’ ka nkọwa akụkọ ihe mere eme ghara ifu ma ndị na-agụ ya ghọta ya ngwa ngwa.
