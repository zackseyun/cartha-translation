  to: Ma o juru Paịlet anya na ọ nwụọlarị. O wee kpọọ ọchịagha na-achị otu narị ndị agha, jụọ ya ma ọ nwụọla kemgbe oge ụfọdụ[a].
  rationale: The revision supplies the needed temporal complement for kemgbe and revises the footnote to preserve the alternative temporal nuance of πάλαι in natural Standard Igbo. It retains the source’s sequence, Pilate’s astonishment, and the centurion’s historical role without adding interpretation.
