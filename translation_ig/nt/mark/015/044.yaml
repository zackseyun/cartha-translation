  text: ὁ δὲ Πιλᾶτος ἐθαύμασεν εἰ ἤδη τέθνηκεν, καὶ προσκαλεσάμενος τὸν κεντυρίωνα ἐπηρώτησεν αὐτὸν εἰ ⸀πάλαι ἀπέθανεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/044.yaml
  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: ig
  text: Ma o juru Paịlet anya na ọ nwụọlarị. O wee kpọọ ọchịagha na-achị otu narị ndị agha, jụọ ya ma ọ nwụọla kemgbe oge ụfọdụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “ma ọ nwụrụ kemgbe oge ụfọdụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: o juru ... anya
  rationale: Nke a na-egosi na Paịlet tụrụ n’anya n’ihi na ọnwụ ahụ mere n’oge dị mkpirikpi, ma ọ bụkwa okwu Igbo doro anya ma kwekọọ n’ụdị akụkọ.
- source_word: εἰ ἤδη τέθνηκεν
  choice: na ọ nwụọlarị
  rationale: N’agbanyeghị na εἰ nwere ike ịpụta ‘ma,’ mgbe o sochiri okwu ịtụ n’anya, ‘na ọ nwụọlarị’ bụ Igbo eke. ‘Nwụọlarị’ na-egosi ma ọnwụ ahụ merechaala ma ọnọdụ ọnwụ ahụ ka dị.
- source_word: προσκαλεσάμενος
  choice: O wee kpọọ
  rationale: Nke a na-egosi omume Paịlet mere tupu ọ jụọ ọchịagha ahụ ajụjụ, n’ụzọ akụkọ Igbo na-aga were were.
- source_word: κεντυρίωνα
  choice: ọchịagha na-achị otu narị ndị agha
  rationale: Nkọwa a na-echekwa ọkwa agha Rom nke κεντυρίων ma mee ka onye Igbo nke oge a ghọta ọrụ onye ahụ ozugbo.
- source_word: ἐπηρώτησεν αὐτόν
  choice: jụọ ya
  rationale: Ọ bụ ntụgharị Igbo dị mfe ma kpọmkwem maka ịjụ mmadụ ajụjụ.
- source_word: εἰ πάλαι ἀπέθανεν
  choice: ma ọ nwụọla kemgbe
  rationale: ‘Kemgbe’ na-egosi na Paịlet na-ajụ ma oge ụfọdụ agaala kemgbe ọ nwụrụ, n’enweghị ime ka oge ahụ yie ogologo karịa ka ọnọdụ akụkọ ahụ na-enye ohere.
