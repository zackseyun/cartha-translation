revisions:
- from: Mgbe ọ nụrụ n’ọnụ ọchịagha ahụ na Jizọs anwụọla, o nyere Josef ikike ka o buru ozu ahụ.[a]
  to: Mgbe ọ nụsịrị ya site n’aka onyeisi agha narị mmadụ ahụ, o nyere Josef ozu ahụ.
  rationale: 'The revision retains the Greek’s implicit object with the minimal pronoun “ya,” avoids specifying that Jesus had died, renders the centurion precisely, and directly states that Pilate gave/granted the corpse to Joseph. No footnote is needed: “ozu” already conveys the explicit sense of πτῶμα (“corpse”).'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:25:36Z'
review_pass:
  verdict: revise
  source_fidelity: The draft adds “na Jizọs anwụọla” (“that Jesus had died”), although the Greek verse leaves the content of Pilate’s learning unexpressed. It also renders ἐδωρήσατο τὸ πτῶμα as granting Joseph permission to take the corpse rather than directly granting the corpse to Joseph. Both expansions should be removed to retain the source’s wording and ambiguity.
  naturalness: “N’ọnụ ọchịagha ahụ” is less idiomatic here for receiving information from an official. “Site n’aka onyeisi agha narị mmadụ ahụ” clearly and naturally expresses the Greek source relation. The revised sentence is natural Standard Igbo and maintains the narrative’s formal register.
  terminology: “Onyeisi agha narị mmadụ” accurately identifies a centurion, rather than the broader “ọchịagha.” “Ozu” is an accurate, ordinary Igbo equivalent for πτῶμα in this context. “Josef” is retained as an established Igbo form of Joseph.
  issues:
  - severity: medium
    issue: The draft explicitly states that Pilate learned that Jesus had died.
    rationale: γνοὺς has no expressed object in this verse. The preceding context may supply it, but the translation should not insert it into the main text.
  - severity: medium
    issue: The draft changes Pilate’s direct grant of the corpse into authorization for Joseph to take it.
    rationale: ἐδωρήσατο τὸ πτῶμα τῷ Ἰωσήφ directly states that Pilate granted/gave the corpse to Joseph; permission is an interpretive expansion.
  - severity: low
    issue: “Ọchịagha” is too broad for κεντυρίωνος, and “n’ọnụ” is not the clearest idiom for the source of Pilate’s information.
    rationale: “Onyeisi agha narị mmadụ” preserves the specific historical office, while “site n’aka” naturally marks the person from whom he learned.
  revised_text: Mgbe ọ nụsịrị ya site n’aka onyeisi agha narị mmadụ ahụ, o nyere Josef ozu ahụ.
  revised_footnotes: []
  revision_rationale: 'The revision retains the Greek’s implicit object with the minimal pronoun “ya,” avoids specifying that Jesus had died, renders the centurion precisely, and directly states that Pilate gave/granted the corpse to Joseph. No footnote is needed: “ozu” already conveys the explicit sense of πτῶμα (“corpse”).'
