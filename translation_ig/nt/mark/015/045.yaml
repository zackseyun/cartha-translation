base_translation:
  language: en
  yaml_path: translation/nt/mark/015/045.yaml
  text: And after learning from the centurion[a], he granted the body to Joseph.
translation:
  language: ig
  text: Mgbe ọ nụsịrị ya site n’aka onyeisi agha narị mmadụ ahụ, o nyere Josef ozu ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: Mgbe ọ nụrụ
  rationale: 'Aorist participle ahụ na-egosi ọnọdụ na usoro oge: Paịlet mere ihe a mgbe ọ natara ozi ahụ. N’Igbo, “Mgbe ọ nụrụ” bụ okwu ebumpụta ụwa ma na-edobe njikọ ahụ.'
- source_word: ἀπὸ τοῦ κεντυρίωνος
  choice: n’ọnụ ọchịagha ahụ
  rationale: ἀπό tinyere genitive na-egosi ebe ozi si bịa. “N’ọnụ” na-egosi na Paịlet nwetara nkwenye ahụ site n’aka onyeisi ndị agha ahụ; “ọchịagha” bụ okwu Igbo a na-aghọta nke ọma maka centurion n’ebe a.
- source_word: ἐδωρήσατο
  choice: nyere Josef ikike ka o buru
  rationale: N’ọnọdụ ọchịchị a, δωρέομαι pụtara na Paịlet kwadoro ma nye ikike ka Josef nata ozu ahụ, ọ bụghị nanị na o ji aka ya nye ya ihe.
- source_word: πτῶμα
  choice: ozu ahụ
  rationale: πτῶμα pụtara ahụ onye nwụrụ anwụ, ya bụ ozu. “Ozu” bụ okwu Igbo ziri ezi ma doo anya n’akụkọ a.
- source_word: τῷ Ἰωσήφ
  choice: Josef
  rationale: Dative a na-egosi onye natara ikike ahụ; nhazi ahịrịokwu Igbo mere ka aha Josef bụrụ onye e nyere ikike.
theological_decisions:
- issue: Ihe γνοὺς na-ezo aka na ya
  choice: Tinyere “na Jizọs anwụọla” iji mee ka ihe Paịlet nụrụ doo anya n’Igbo.
  alternative: Ịsị naanị “Mgbe ọ nụrụ n’ọnụ ọchịagha ahụ.”
  rationale: Ọ bụ ezie na Greek enweghị direct object ekwupụtara n’amaokwu a, amaokwu bu ya ụzọ na ọnọdụ akụkọ ahụ gosiri na ihe a kwadoro bụ ọnwụ Jizọs. Ntinye a na-eme ka Igbo bụrụ nke doro anya n’enweghị ịgbanwe ihe akụkọ ahụ pụtara.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma nwee ugwu. A họọrọ ahịrịokwu doro anya nye ndị nkịtị, ma e debere ọnọdụ ọchịchị nke Paịlet nyere ikike ka a hapụ ozu ahụ.
