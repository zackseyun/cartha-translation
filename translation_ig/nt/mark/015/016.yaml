source:
  edition: SBLGNT
  text: Οἱ δὲ στρατιῶται ἀπήγαγον αὐτὸν ἔσω τῆς αὐλῆς, ὅ ἐστιν πραιτώριον, καὶ συγκαλοῦσιν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/016.yaml
  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: ig
  text: Ndị agha ahụ wee duuru ya banye n'ime ogige ahụ, ya bụ, praetorium[a], kpọkọta kọhọt ahụ dum[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụlọọrụ gọvanọ.”
    reason: lexical_alternative
  - marker: b
    text: “Kọhọt” bụ otu ngalaba agha Rom; n'ebe a, ọ na-ezo aka n'òtù ndị agha e kpọkọtara n'okpuru ọchịchị Rom.
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Ndị agha ahụ wee
  rationale: A sụgharịrị δέ dịka “wee” iji gosi nzọụkwụ ọzọ n'akụkọ ahụ, ọ bụghị esemokwu siri ike.
- source_word: στρατιῶται
  choice: Ndị agha
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ndị na-eje ozi agha.
- source_word: ἀπήγαγον
  choice: kpọrọ ya baa
  rationale: Nke a na-egosi na ha duuru ma ọ bụ kpọrọ ya gaa n'ebe a kpọpụtara, ebe ἔσω na-egosi ịbanye n'ime ya.
- source_word: ἔσω τῆς αὐλῆς
  choice: n'ime ogige ahụ
  rationale: “N'ime ogige” na-echekwa echiche nke ebe ghe oghe gbara ụlọ gburugburu ma ọ bụ nke dị n'ime ụlọ ọchịchị, n'ebughị ụzọ kọwaa ya karịa ihe Grik kwuru.
- source_word: ὅ ἐστιν πραιτώριον
  choice: ya bụ, praetorium
  rationale: E debere aha ọchịchị Rom ahụ iji chekwaa nkọwa akụkọ ihe mere eme; ihe odide ala peeji na-akọwa ọrụ ebe ahụ.
- source_word: συγκαλοῦσιν
  choice: kpọkọtakwa
  rationale: Okwu a na-enye echiche ịkpọ ndị mmadụ ka ha gbakọta. Ọ bụ ezie na Grik ji present tense dị ndụ, usoro ngwaa Igbo na-eme ka akụkọ a daa nke ọma n'asụsụ nkịtị.
- source_word: ὅλην τὴν σπεῖραν
  choice: ndị agha niile nke otu ndị agha ahụ
  rationale: Nke a na-egosi otu agha Rom a kpọrọ σπεῖρα ma zere iji okwu teknụzụ na-agaghị adị ndị na-agụ akwụkwọ mfe; ihe odide ala peeji na-enye nkọwa omenala.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere “praetorium” dịka aha akụkọ ihe mere eme, ma kọwaa echiche ya n'ihe odide ala peeji. Akara [a] na [b] abụọ pụtara n'ahịrị bụ isi.
