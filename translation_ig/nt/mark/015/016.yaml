revisions:
- from: Ndị agha ahụ wee kpọrọ ya baa n'ime ogige ahụ[a], ya bụ, praetorium, kpọkọtakwa ndị agha niile nke otu ndị agha ahụ[b].
  to: Ndị agha ahụ wee duuru ya banye n'ime ogige ahụ, ya bụ, praetorium[a], kpọkọta kọhọt ahụ dum[b].
  rationale: The revision renders the leading action directly, removes repetition, retains the Roman technical terms with accessible notes, and aligns each footnote marker with the word it explains. It does not add an identification of the precise praetorium location beyond the Greek text.
