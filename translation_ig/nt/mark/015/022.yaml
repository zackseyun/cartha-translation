  text: καὶ φέρουσιν αὐτὸν ἐπὶ ⸀τὸν ⸀Γολγοθᾶν τόπον, ὅ ἐστιν ⸀μεθερμηνευόμενον Κρανίου Τόπος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: ig
  text: Ha wee kpọrọ ya gaa n’ebe ahụ bụ Gọlgọta[a], nke a sụgharịrị ịbụ, “Ebe Okpokoro Isi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ebe Okpokoro Isi ahụ.” N’asụsụ Grik, okwu ahụ bụ Κρανίου Τόπος enweghị article; ya mere, a pụkwara ịghọta ya dịka “Ebe otu okpokoro isi” ma ọ bụ “Ebe okpokoro isi ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: kpọrọ ya gaa
  rationale: N’ebe a, φέρω na-egosi na ha duuru ma ọ bụ butere ya ruo ebe ahụ; “kpọrọ ya gaa” bụ Igbo nkịtị nke na-akọwaghị na ha buuru ya n’ahụ.
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: gaa n’ebe a na-akpọ Gọlgọta
  rationale: ἐπί na accusative na-egosi ije ruo ebe a na-aga. Okwu a na-edobe echiche nke τόπος na aha ebe ahụ, ma jiri usoro Igbo ebumpụta ụwa mee ya.
- source_word: Γολγοθᾶν
  choice: Gọlgọta
  rationale: A tụgharịghị aha ebe a; e dere ya n’ụda na usoro mkpụrụokwu Igbo.
- source_word: μεθερμηνευόμενον
  choice: nke a sụgharịrị
  rationale: Nke a na-egosipụta kpọmkwem na a na-enye ntụgharị nke aha ahụ, ọ bụghị nanị nkọwa sara mbara banyere ihe ọ pụtara.
- source_word: Κρανίου Τόπος
  choice: Ebe Okpokoro Isi
  rationale: Genitive Κρανίου na-akọwa τόπος. Igbo anaghị achọ article dịka Bekee, ya mere “Ebe Okpokoro Isi” na-edobe nghọtahie ziri ezi ma ghara ịmanye “otu okpokoro isi” ma ọ bụ “okpokoro isi ahụ.”
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Kpọrọ ya gaa” na-asọpụta nke ọma n’akụkọ Igbo; “wee” na-egosi usoro ihe omume. E tinyere akara ntụaka [a] ozugbo n’aha Gọlgọta.
