id: MRK.15.33
reference: Mark 15:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: ig
  text: Mgbe elekere nke isii ruru[b], ọchịchịrị kpuchiri ala ahụ dum[a] ruo elekere nke itoolu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụwa dum.” Okwu Grik a nwere ike ịpụta “ala” ma ọ bụ “ụwa.”
    reason: alternative_reading
  - marker: b
    text: Ya bụ, malite n'ihe dị ka etiti ehihie ruo ihe dị ka elekere atọ nke ehihie.
    reason: cultural_note
lexical_decisions:
- source_word: γενομένης ὥρας ἕκτης
  choice: Mgbe elekere nke isii ruru
  rationale: Nke a na-egosipụta genitive absolute ahụ dịka oge, ma na-edobe usoro ịgụ oge dị n'isi mmalite kama ịgbanwe ya ozugbo ka ọ bụrụ oge nke oge a.
- source_word: σκότος
  choice: ọchịchịrị
  rationale: Ọ bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa enweghị ìhè.
- source_word: ἐγένετο
  choice: kpuchiri
  rationale: N'usoro okwu 'ọchịchịrị kpuchiri,' nke a bụ Igbo dị ndụ nke na-egosipụta na ọchịchịrị bịara gbasaa n'ebe ahụ, n'agbanyeghị na ọ bụghị ntụgharị okwu n'otu n'otu nke γίνομαι.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: ala ahụ dum
  rationale: γῆ nwere ike ịpụta ala mpaghara ma ọ bụ ụwa. 'Ala ahụ dum' dabara n'akụkọ ahụ ma ghara ikpebi na ọ bụ ụwa dum; ihe ọzọ ahụ dị n'okpuru peeji.
- source_word: ἕως ὥρας ἐνάτης
  choice: ruo elekere nke itoolu
  rationale: Nke a na-edobe otu usoro ịgụ oge ahụ e ji kwuo elekere nke isii.
theological_decisions:
- issue: Ókè ọchịchịrị ahụ n'okwu γῆ
  choice: ala ahụ dum
  alternative: ụwa dum
  rationale: Okwu Grik γῆ nwere nghọta abụọ a. Isi ederede ji 'ala' zere ikwu hoo haa na ọchịchịrị ahụ kpuchiri ụwa niile, ebe nkọwa ala peeji na-echekwa nghọta ọzọ ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro oge ndị Juu n'isi ederede, tinyekwa nkọwa oge nke oge a n'okpuru peeji. E debere akara [b] n'akụkụ oge mbụ na [a] n'akụkụ okwu γῆ nke ọ na-akọwa.
