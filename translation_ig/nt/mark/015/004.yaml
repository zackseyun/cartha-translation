  yaml_path: translation/nt/mark/015/004.yaml
  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: ig
  text: Ma Paịlet jụkwara ya ọzọ, sị, “Ị naghị aza ihe ọ bụla? Lee ọtụtụ ebubo ha na-ebo gị.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “Lee ọtụtụ ihe ha na-ebo gị ebubo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche n’akụkọ a; “Ma” dabara n’ọnọdụ a.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na Paịlet jụrụ ya ajụjụ ọzọ.
- source_word: ἐπηρώτα
  choice: jụkwara
  rationale: Oge ngwaa Grik a nwere ike igosi ajụjụ gara n’ihu ma ọ bụ e jụrụ ugboro ugboro; “jụkwara” na-enye echiche nke ịjụ ya ọzọ n’ọnọdụ ikpe ahụ n’enweghị ime ka okwu ahụ sie ike karịa isi mmalite.
- source_word: λέγων
  choice: sị
  rationale: Nke a bụ ụzọ Igbo si ewebata okwu onye kwuru n'ụzọ dị mfe ma bụrụkwa eke.
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: Ọ̀ bụ na ị naghị aza ihe ọ bụla?
  rationale: Ọ na-echekwa ike ajụjụ nke na-akọwapụta na Jizọs azaghị ihe, ma na-ada n’ụzọ eke n’Igbo.
- source_word: ἴδε
  choice: Lee
  rationale: Ọ bụ iwu nke na-adọta uche onye a na-agwa n’ihe na-eme.
- source_word: πόσα
  choice: ọtụtụ ebubo
  rationale: N'ụzọ nkịtị ọ pụtara “ọtụtụ ihe,” ma ngwaa κατηγοροῦσιν na ọnọdụ ikpe na-egosi na ihe ndị ahụ bụ ebubo.
- source_word: σου
  choice: gị
  rationale: N’ebe κατηγορέω dị, ọ na-akọwa onye a na-ebo ebubo; n’Igbo a na-ekwu “ibo mmadụ ebubo.”
- source_word: κατηγοροῦσιν
  choice: ha na-ebo
  rationale: Ụdị ugbu a na-egosi ebubo a na-aga n’ihu; “ha na-ebo gị” na-egosipụta nke a nke ọma.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo izugbe, nke ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “Paịlet” dịka nsụgharị aha Πιλᾶτος, “ebubo” maka ọnọdụ ikpe, na usoro “ha na-ebo gị” iji gosipụta omume na-aga n’ihu.
