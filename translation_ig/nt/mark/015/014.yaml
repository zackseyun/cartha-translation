  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: ig
  text: Ma Paịlet nọ na-ajụ ha[a], “Gịnị mere, gịnị bụ ihe ọjọọ o mere?” Ma ha tiri mkpu karịa, “Kpọgide ya n’obe!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi gịnị? Olee ihe ọjọọ o mere?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: nọ na-ajụ
  rationale: Ụdị ngwaa imperfect na-egosi okwu na-aga n’ihu n’oge ahụ; “nọ na-ajụ” na-echekwa nke a n’Igbo n’enweghị ịgbakwụnye na ọ jụrụ ha ọtụtụ ugboro.
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: Ma olee ihe ọjọọ o mere?
  rationale: Ajụjụ a na-achọ ihe ga-akwado ebubo ahụ. “Ma” na-egosi njikọ na mmeghachi omume Paịlet, ebe “olee ihe ọjọọ” na-echekwa ịdị arọ nke κακόν.
- source_word: κακόν
  choice: ihe ọjọọ
  rationale: “Ihe ọjọọ” na-egosi ihe dị njọ n’omume ma na-echekwa ike nke okwu Grik karịa okwu dị nro.
- source_word: περισσῶς
  choice: ike karịa
  rationale: Nke a na-egosi na iti mkpu ha rịkwuru elu ma siekwuo ike.
- source_word: ἔκραξαν
  choice: tikwara mkpu
  rationale: “Iti mkpu” bụ ụzọ Igbo doro anya ma dị ndụ isi kwuo iti olu ike n’ihu ọha; “-kwara” na-ejikọta nzaghachi ahụ na ajụjụ Paịlet.
- source_word: Σταύρωσον αὐτόν
  choice: Kpọgide ya n’obe!
  rationale: Nke a bụ iwu kpọmkwem a gwara Paịlet, ọ bụkwa ụzọ Igbo a na-aghọta nke ọma isi kwuo ọnwụ site n’ịkpọgide n’obe.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi ntụgharị na esemokwu dị n’etiti okwu Paịlet na mkpu igwe mmadụ.
- source_word: Πιλᾶτος
  choice: Paịlet
  rationale: E degharịrị aha ahụ n’ụdị a na-ejikarị ede ya n’Igbo.
theological_decisions:
- issue: Ike gbasara omume ọma na ajọ omume dị n’okwu κακόν n’ajụjụ Paịlet
  choice: ihe ọjọọ
  alternative: ihe na-ezighị ezi
  rationale: “Ihe ọjọọ” na-echekwa ịdị arọ nke ebubo iwu na omume ọma dị n’amaokwu ahụ, n’ebughị echiche ozizi ọzọ abata.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa akụkụ imperfect nke ἔλεγεν, ike nke κακόν, na ịrị elu nke mkpu igwe mmadụ n’enweghị ịkọwa ihe ederede ahụ ekwughị.
