base_translation:
  language: en
  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: ig
  text: Ha kpọgidekwara ndị ohi abụọ n’obe n’akụkụ ya, otu n’aka nri ya, otu n’aka ekpe ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: ya na ya
  rationale: σύν na dativ na-egosi iso mmadụ nọkọọ n’otu ihe; n’ebe a, ọ pụtara na a kpọgidere ha n’obe n’otu oge na Jizọs.
- source_word: σταυροῦσιν
  choice: Ha kpọgidekwara ... n’obe
  rationale: Ọ bụ present active indicative nke Mak ji dị ka historical present. Igbo na-akọkarị akụkọ gara aga n’ụdị gara aga; “kpọgidekwara” na-enye akụkọ ahụ n’ụzọ eke ma na-ejikọta ya na ihe bu ụzọ mee.
- source_word: δύο λῃστάς
  choice: ndị ohi abụọ
  rationale: λῃστής nwere ike ịpụta onye ohi na-eji ike eme ihe, onye na-apụnara mmadụ ihe, ma ọ bụ onye nnupụisi. “Ndị ohi” bụ okwu sara mbara, dị mfe nghọta, nke na-adịghị amanye nkọwa ndọrọ ndọrọ ọchịchị.
- source_word: ἕνα ἐκ δεξιῶν
  choice: otu n’aka nri ya
  rationale: Akpaokwu a na-egosi ọnọdụ otu onye n’akụkụ aka nri Jizọs; “n’aka nri ya” bụ Igbo eke.
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: otu n’aka ekpe ya
  rationale: εὐώνυμος bụ okwu e ji akọwa akụkụ aka ekpe n’ụzọ na-abụghị kpọmkwem. N’ọnọdụ a, “n’aka ekpe ya” na-enye ihe ọ pụtara nke ọma.
theological_decisions:
- issue: Nkọwa λῃσταί n’akụkọ ịkpọgide n’obe
  choice: ndị ohi
  alternative: ndị na-apụnara mmadụ ihe; ikekwe ndị nnupụisi
  rationale: Okwu Grik ahụ nwere ike ịgụnye ndị ohi na-eme ihe ike ma ọ bụ ndị ohi ọhịa, ma n’ọnọdụ ụfọdụ ọ pụrụ inwe echiche nke nnupụisi. Amaokwu a n’onwe ya anaghị akwado ka e kpebie na ha bụ ndị nnupụisi, ya mere ederede bụ isi ji okwu sara mbara, ebe nkọwa ala peeji na-edobe nhọrọ ndị ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. Ahịrịokwu ahụ na-eji usoro akụkọ gara aga nke na-ada eke n’Igbo, ebe “-kwara” na-egosipụta njikọ nke καί na ihe bu ụzọ mee.
