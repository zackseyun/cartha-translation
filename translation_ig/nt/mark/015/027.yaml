revisions:
- from: Ha kpọgidekwara ndị ohi abụọ[a] n’obe ya na ya, otu n’aka nri ya, otu n’aka ekpe ya.
  to: Ha kpọgidekwara ndị ohi abụọ n’obe n’akụkụ ya, otu n’aka nri ya, otu n’aka ekpe ya.
  rationale: The revision removes an ambiguous phrase and explicitly yet naturally expresses that the two crucified men were alongside Jesus. It preserves the historical narrative style, the source’s right/left parallelism, and the lexical ambiguity of λῃσταί.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:00:22Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the two λῃσταί and their positions at Jesus’ right and left. However, “n’obe ya na ya” is structurally unclear and can be read as referring to Jesus’ cross rather than expressing that the two were crucified alongside him. Replacing it with “n’akụkụ ya” clearly conveys σὺν αὐτῷ in this positional crucifixion context.
  naturalness: “Ha kpọgidekwara ndị ohi abụọ n’obe n’akụkụ ya” is clear, idiomatic Standard Igbo, and naturally maintains the narrative connection expressed by καί/-kwara. “Otu n’aka nri ya, otu n’aka ekpe ya” is natural and precise.
  terminology: “Ndị ohi” is an acceptable broad rendering of λῃσταί. The footnote should offer “ndị ohi ọhịa” as the more direct Igbo alternative for ‘bandits,’ while retaining the qualified possibility of ‘rebels’ without asserting it.
  issues:
  - severity: medium
    issue: Ambiguous expression of accompaniment
    rationale: The wording “n’obe ya na ya” is not a clear Standard Igbo way to say that the two men were crucified with/alongside Jesus. It risks suggesting ‘on his cross.’ “n’akụkụ ya” expresses the intended accompanying spatial placement and accords with the following right/left specification.
  - severity: low
    issue: Footnote’s first alternative does not closely represent ‘bandits’
    rationale: “ndị na-apụnara mmadụ ihe” is possible but is more descriptive. “ndị ohi ọhịa” more directly supplies the lexical alternative ‘bandits’ while the main text remains broad.
  revised_text: Ha kpọgidekwara ndị ohi abụọ n’obe n’akụkụ ya, otu n’aka nri ya, otu n’aka ekpe ya.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ohi ọhịa”; ikekwe, “ndị nnupụisi,” ma ọ bụrụ na a ghọta okwu ahụ n’echiche ndọrọ ndọrọ ọchịchị.
    reason: lexical_alternative
  revision_rationale: The revision removes an ambiguous phrase and explicitly yet naturally expresses that the two crucified men were alongside Jesus. It preserves the historical narrative style, the source’s right/left parallelism, and the lexical ambiguity of λῃσταί.
