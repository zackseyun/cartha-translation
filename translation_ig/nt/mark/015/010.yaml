  text: ἐγίνωσκεν γὰρ ὅτι διὰ φθόνον παραδεδώκεισαν αὐτὸν οἱ ἀρχιερεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/010.yaml
  text: For he knew that the chief priests had handed him over because of envy[a].
translation:
  language: ig
  text: N’ihi na ọ maara na ndị isi nchụaja nyefere Jizọs n’aka ya n’ihi anyaụfụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi ekworo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: ọ maara
  rationale: Oge imperfect na-egosi nghọta Paịlet nwere nke nọgidere ma ọ bụ guzosie ike; ‘ọ maara’ bụ ụzọ Igbo dị ire na nke doro anya isi kwuo ya.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe kpatara okwu bu ya ụzọ, ma na-echekwa njikọ nkọwa ahụ n’Igbo eke.
- source_word: ὅτι
  choice: na
  rationale: Ọ na-ewebata ọdịnaya nke ihe Paịlet maara.
- source_word: διὰ φθόνον
  choice: n’ihi anyaụfụ
  rationale: διά ya na accusative na-egosi ihe kpatara omume ahụ; ‘anyaụfụ’ na-egosi φθόνος nke ọma n’Igbo, n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: παραδεδώκεισαν
  choice: ka ... ji nyefee
  rationale: ‘Nyefee’ dabara n’ọnọdụ ikpe na inyefe Jizọs n’aka onye ọchịchị. Usoro ‘ọ bụ ... ka ... ji’ na-egosi ihe kpatara omume ahụ n’Igbo; ihe ndị gbara amaokwu ahụ gburugburu na-eme ka o doo anya na inyefe ahụ emeela tupu nghọta a a kọwara.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs.
- source_word: οἱ ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị ndu kachasị elu n’etiti ndị nchụaja, ọ bụghị ọtụtụ ndị isi nchụaja ukwu n’otu oge.
theological_decisions:
- issue: Ihe kpaliri ndị isi nchụaja inyefe Jizọs
  choice: Amaokwu ahụ kwuru na anyaụfụ bụ ihe mere ha ji nyefee ya.
  alternative: Ekworo
  rationale: A hapụrụ okwu ahụ dịka ntule Paịlet banyere ebumnobi ha, n’enweghị ịgbasawanye ya ma ọ bụ itinye nkọwa ozizi pụrụ iche.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ndị isi nchụaja’ mee ka ọkwa ndị ọchịchị nchụaja pụta ìhè; e tinyere akara ndetu ala ala [a] ozugbo n’azụ okwu ọ metụtara.
