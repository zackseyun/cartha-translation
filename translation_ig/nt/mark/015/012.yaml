id: MRK.15.12
reference: Mark 15:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: ig
  text: Paịlet zaghachikwara ha, sị, “Gịnịzi ka unu chọrọ ka m mee onye unu na-akpọ eze ndị Juu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: kwara
  rationale: Mgbakwunye ‘-kwara’ n’ime ‘zaghachikwara’ na-egosi na Paịlet zaghachiri ha ọzọ n’arụmụka ahụ, n’ụzọ Igbo si ada nke ọma.
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: zaghachikwara ha, sị
  rationale: Nke a na-enye okwu participle na imperfect ahụ n’ụzọ akụkọ Igbo si aga nke ọma, na-enweghị ịsụgharị ya n’ụzọ siri ike dị ka ‘ọ zara ma nọ na-ekwu.’
- source_word: Τί οὖν
  choice: Gịnịzi
  rationale: ‘-zi’ na-ejikọta ajụjụ ahụ na ihe ìgwè mmadụ ahụ kwuru na mbụ ma na-egosi nkwubi okwu sitere na ya.
- source_word: θέλετε ποιήσω
  choice: ka unu chọrọ ka m mee
  rationale: Nke a na-egosipụta ọchịchọ ìgwè mmadụ ahụ na subjunctive ποιήσω n’ụzọ doro anya ma bụrụ Igbo nkịtị.
- source_word: ὃν λέγετε
  choice: onye unu na-akpọ
  rationale: Nke a na-edobe aha ahụ dịka ihe ndị mmadụ ahụ na-akpọ Jizọs, kama ime ka ọ bụrụ nkwupụta nke Paịlet n’onwe ya.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: eze ndị Juu
  rationale: Nke a bụ aha ndọrọ ndọrọ ọchịchị e ji mara Jizọs n’akụkọ ahụ; okwu ahụ dị mfe ma kwekọọ n’asụsụ Igbo ugbu a.
theological_decisions:
- issue: Ma okwu Paịlet ò kwadoro na Jizọs bụ eze, ka ọ̀ na-ekwughachi naanị ihe ìgwè mmadụ ahụ na-akpọ ya
  choice: onye unu na-akpọ eze ndị Juu
  alternative: onye ahụ, bụ́ eze ndị Juu, dịka unu na-ekwu
  rationale: Nkebiokwu Grik ὃν λέγετε na-eme ka aha ahụ bụrụ nke ndị a na-agwa okwu na-eji akpọ ya. Nsụgharị a na-edobe oghere Paịlet nwere n’okwu ahụ, gharakwa ime ya nkwupụta okwukwe ma ọ bụ ịgọnahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. ‘Gịnịzi’ na ‘zaghachikwara’ na-eme ka mkparịta ụka ahụ gaa were were, ebe ‘onye unu na-akpọ’ na-echekwa ike na mgbagwoju anya dị n’aha eze ahụ.
