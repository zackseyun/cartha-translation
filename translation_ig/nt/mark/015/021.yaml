id: MRK.15.21
reference: Mark 15:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἀγγαρεύουσιν παράγοντά τινα Σίμωνα Κυρηναῖον ἐρχόμενον ἀπ’ ἀγροῦ, τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου, ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: ig
  text: Ha manyere otu nwoke na-agafe ebe ahụ[b], bụ Saịmọn onye Saịrini, onye si n’ime obodo na-abịa[a]—nna Aleksanda na Rufọs—ka o buru obe Jizọs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye si n’ubi na-abịa”; okwu Grik ahụ nwere ike ịpụta ubi ma ọ bụ ime obodo.
    reason: lexical_alternative
  - marker: b
    text: Okwu a sụgharịrị “manyere” na-ekwu maka ịmanye mmadụ ịrụ ọrụ, ọkachasị ọrụ ọchịchị ma ọ bụ ndị agha chọrọ.
    reason: cultural_note
  - marker: c
    text: Ụfọdụ na-aghọta “obe” ebe a dịka naanị osisi a na-agbatị n’akụkụ n’obe (crossbeam), ma ihe odide Grik kwuru naanị “obe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγαρεύουσιν
  choice: Ha manyere
  rationale: Ngwaa a na-egosi ọrụ a manyere mmadụ ịrụ, ọ bụghị arịrịọ nkịtị; “manyere” na-echekwa ike mmanye ahụ n’Igbo doro anya.
- source_word: παράγοντά τινα
  choice: otu nwoke na-agafe agafe
  rationale: Nke a na-egosi otu onye a na-akpọghị aha nke nọ na-agafe ebe ahụ; nsụgharị a bụ Igbo eke ma na-echekwa enweghị nkọwa kpọmkwem dị na τινα.
- source_word: Σίμωνα Κυρηναῖον
  choice: Saịmọn onye Saịrini
  rationale: A tụgharịrị aha obodo/agbụrụ ahụ n’ụzọ Igbo a na-aghọta nke ọma, ya bụ onye si Saịrini.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: onye si n’ime ime obodo na-abịa
  rationale: ἀγρός nwere ike ịpụta ubi ma ọ bụ ime obodo; “ime ime obodo” na-echekwa nghọta sara mbara n’ọnọdụ akụkọ a, ebe nkọwa ala ọzọ dị n’akwụkwọ nkọwa [a].
- source_word: τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου
  choice: nna Aleksanda na Rufọs
  rationale: E debere nkọwa njirimara Saịmọn n’ụzọ kwụ ọtọ n’enweghị ịkọwa ihe mere Mak ji kpọọ ụmụ ya aha.
- source_word: ἵνα ἄρῃ
  choice: ka o buru
  rationale: Akụkụ a na-egosi nzube nke mmanye ahụ; “ka o buru” bụ usoro Igbo eke nke na-enye nghọta ahụ.
- source_word: σταυρὸν
  choice: obe
  rationale: “Obe” bụ okwu Igbo a na-ejikarị maka σταυρός, ma ọ naghị eme ka ihe ahụ bụrụ naanị osisi obe kwụ ọtọ n’akụkụ dịka ụfọdụ nkọwa akụkọ ihe mere eme si kwuo.
- source_word: αὐτοῦ
  choice: ya
  rationale: E debere nnọchiaha Grik ahụ; n’ọnọdụ gbara amaokwu a gburugburu, ọ na-ezo aka na Jizọs.
theological_decisions:
- issue: Ụdị mmanye e tinyere Saịmọn
  choice: E manyere Saịmọn iburu obe ahụ.
  alternative: Naanị ha rịọrọ ya ma ọ bụ kpọrọ ya ka o nyere aka n’enweghị mmanye.
  rationale: ἀγγαρεύω na-egosi ọrụ ọchịchị ma ọ bụ ndị agha manyere mmadụ ịrụ; ya mere, e kwesịghị ime ka ike mmanye ahụ dị nro.
- issue: Ihe Saịmọn buru kpọmkwem
  choice: obe
  alternative: osisi obe nke a na-adọ n’akụkụ (crossbeam)
  rationale: Ihe odide Grik kwuru σταυρός, “obe”; ịkọwa ya kpọmkwem dịka crossbeam ga-etinye nkọwa akụkọ ihe mere eme karịrị ihe ederede ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-eme ka njirimara Saịmọn na nke ụmụ ya doo anya, ma na-edebe mgbagwoju anya nke ἀγρός na σταυρός n’akwụkwọ nkọwa.
