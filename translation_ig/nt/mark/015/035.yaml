id: MRK.15.35
reference: Mark 15:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καί τινες τῶν παρεστηκότων ἀκούσαντες ἔλεγον· ⸀Ἴδε Ἠλίαν φωνεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/035.yaml
  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: ig
  text: Ụfọdụ n’ime ndị guzo n’ebe ahụ, mgbe ha nụrụ ya, na-ekwu, “Lee, ọ na-akpọ Ịlaịja[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Lee, ọ na-akpọku Ịlaịja.”
    reason: φωνεῖ nwere ike ịpụta ịkpọ mmadụ ma ọ bụ ịkpọku ya; ihe ọzọ a sụgharịrị na-eme ka echiche ịkpọku Ịlaịja pụta ìhè.
lexical_decisions:
- source_word: καί
  choice: Ụfọdụ…
  rationale: A hapụrụ njikọ ahụ ka usoro ahịrịokwu Igbo si dịrị eke; ịga n’ihu n’akụkọ ahụ ka doro anya site n’ọnọdụ ya, n’enweghị itinye nkọwa oge ọhụrụ.
- source_word: τινες
  choice: Ụfọdụ
  rationale: Ọ na-egosi akụkụ ndị a na-akọwaghị kpọmkwem n’etiti ndị nọ ebe ahụ.
- source_word: τῶν παρεστηκότων
  choice: n’ime ndị guzo n’ebe ahụ
  rationale: Nke a na-echekwa echiche doro anya banyere ndị nọ guzo nso n’ebe ihe ahụ mere.
- source_word: ἀκούσαντες
  choice: mgbe ha nụrụ ya
  rationale: Nkebiokwu oge a na-egosi na ha buru ụzọ nụ mkpu ahụ tupu ha ekwuo; ‘ya’ na-ezo aka n’ihe Jizọs kwuru n’amaokwu gara aga.
- source_word: ἔλεγον
  choice: na-ekwu
  rationale: Ụdị na-aga n’ihu na-echekwa echiche imperfect nke okwu ha nọ na-ekwu, n’etinyeghị echiche siri ike na ha kwughachiri ya ọtụtụ ugboro.
- source_word: Ἴδε
  choice: Lee
  rationale: Ọ bụ okwu e ji adọta uche, dịkwa nkenke ma bụrụ nke ndị Igbo nke oge a na-aghọta.
- source_word: Ἠλίαν
  choice: Ịlaịja
  rationale: Nke a bụ ide aha onye amụma ahụ n’ụdị a na-ahụkarị n’Igbo.
- source_word: φωνεῖ
  choice: ọ na-akpọ
  rationale: 'Nke a na-egosipụta present tense ahụ ma na-echekwa ohere ihe okwu ahụ pụtara: ịkpọ onye aha ma ọ bụ ịkpọku ya.'
theological_decisions:
- issue: Ma a ga-akọwa hoo haa na ndị guzo ebe ahụ ghọtahiere mkpu Jizọs dị ka ịkpọ Ịlaịja
  choice: 'E debere naanị ihe ndị ahụ kwuru: “ọ na-akpọ Ịlaịja.”'
  alternative: “ọ na-akpọku Ịlaịja” ma ọ bụ “ha chere na ọ na-akpọ Ịlaịja”
  rationale: Grik na-akọ ihe ha kwuru, ọ naghị etinye nkọwa onye na-akọ akụkọ na ha ghọtahiere ya. Ya mere, a hapụrụ esemokwu ahụ ka ọnọdụ amaokwu ndị gbara ya gburugburu gosi ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma dị nsọ n’ụda ya. E tinyere akara [a] ozugbo n’ebe nhọrọ okwu φωνεῖ metụtara, kama itinye ya n’akụkụ “ndị guzo n’ebe ahụ.”
