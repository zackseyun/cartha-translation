revisions:
- from: Mgbe onyeisi agha narị[a] ahụ, bụ́ onye guzo chere ya ihu, hụrụ na ọ kubiri ume n’ụzọ dị otu a, ọ sịrị, “N’ezie, nwoke a bụ Ọkpara Chineke.”
  to: Mgbe ọchịagha ahụ[a], onye guzo ya chere ihu, hụrụ otú o si kubie ume, ọ sịrị, “N’ezie, nwoke a bụ Ọkpara Chineke.”
  rationale: The revision corrects the footnote’s referent from lower-case chi to Chineke, preserves the disputed qualitative/indefinite force of υἱὸς θεοῦ, and improves idiomatic Standard Igbo without changing the verse’s meaning. The main rendering retains the conventional title “Ọkpara Chineke,” while the footnote keeps the alternative visible.
