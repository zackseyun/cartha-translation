  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: ig
  text: Mgbe ọchịagha ahụ[a], onye guzo ya chere ihu, hụrụ otú o si kubie ume, ọ sịrị, “N’ezie, nwoke a bụ Ọkpara Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ezie, nwoke a bụ otu nwa Chineke.” Okwu Grik a nwere ike ịpụta “nwa Chineke” n’ụzọ na-akọwa àgwà, ma ọ bụ “otu nwa Chineke”; ma n’usoro akụkọ Mak, o yikarịrị ka ọ na-arụ ọrụ dịka aha ahụ bụ “Ọkpara Chineke.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Mgbe ... hụrụ
  rationale: A sụgharịrị participle aorist ahụ dị ka nkebiokwu oge; δέ bụ njikọ dị nro nke na-achọghị ka e mesie ọdịiche ike n’Igbo.
- source_word: κεντυρίων
  choice: onyeisi agha narị
  rationale: Nke a na-akọwa ọkwa onye agha Rom nke na-achị ndị agha ihe dị ka otu narị, ma bụrụkwa okwu ndị na-agụ Igbo ga-aghọta.
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: bụ́ onye guzo chere ya ihu
  rationale: Ọ na-echekwa echiche nke onye nọ n’ọnọdụ kwụ ọtọ n’ihu Jizọs, na-enweghị ịgbakwunye nkọwa ọzọ.
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: na ọ kubiri ume n’ụzọ dị otu a
  rationale: “Kubie ume” bụ akpaalaokwu Igbo pụtara ịnwụ, ma na-echekwa onyonyo iku ume nke ἐκπνέω; “n’ụzọ dị otu a” na-anọchi οὕτως.
- source_word: Ἀληθῶς
  choice: N’ezie
  rationale: Ọ na-enye nkwupụta ahụ ụda siri ike ma dị nsọ n’Igbo nkịtị.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: nwoke a
  rationale: N’ebe a ἄνθρωπος na-ezo aka kpọmkwem n’ebe Jizọs nọ dị ka nwoke; “nwoke a” bụ okwu Igbo ebumpụta ụwa.
- source_word: υἱὸς θεοῦ
  choice: Ọkpara Chineke
  rationale: “Ọkpara Chineke” bụ aha a maara nke ọma n’Igbo maka christological title a, ma ahịrịokwu Grik na-enweghị article nwekwara ike ịghọta n’ụzọ qualitative ma ọ bụ indefinite; e debere nke ahụ n’ala peeji.
- source_word: ἦν
  choice: bụ
  rationale: Igbo anaghị agbanwe copula “bụ” dịka oge gara aga n’ụdị a; n’ọnọdụ akụkọ a, ọ na-ebute ihe imperfect Grik kwuru n’enweghị ịgbanwe nkwupụta ahụ ka ọ bụrụ present tense pụrụ iche.
theological_decisions:
- issue: Ike na nghọta nke υἱὸς θεοῦ n’okwu onyeisi agha ahụ
  choice: Ọkpara Chineke
  alternative: otu nwa chi / nwa nke otu chi
  rationale: N’usoro akụkọ Mak, okwu a na-arụ ọrụ dịka aha dị mkpa e ji akọwa Jizọs. Ma n’ihi na Grik enweghị article ma nwee ike ịgụ ya n’ụzọ qualitative ma ọ bụ indefinite, e gosipụtara nghọta ọzọ n’ala peeji kama ikpochapụ mgbagwoju anya ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. “Onyeisi agha narị” na-akọwa ọkwa Rom n’enweghị iji okwu Bekee; “kubiri ume” na-echekwa ma ihe ọnwụ pụtara ma onyonyo iku ume dị na Grik. Akara ala peeji [a] dị n’isiokwu ozugbo n’azụ okwu ọ na-akọwa.
