id: MRK.15.15
reference: Mark 15:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος βουλόμενος τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, καὶ παρέδωκεν τὸν Ἰησοῦν φραγελλώσας ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: ig
  text: Ma Paịlet, ebe ọ chọrọ imeju ìgwè mmadụ ahụ afọ[a], tọhapụrụ ha Barabas; mgbe o mechara mee ka a pịa Jizọs ụtarị, o nyefere ya ka a kpọgide ya n’obe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ime ihe ga-atọ ìgwè mmadụ ahụ ụtọ.” N’ụzọ nkịtị, “ime ihe zuru ìgwè mmadụ ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενος
  choice: ebe ọ chọrọ
  rationale: Nke a na-egosi ọchịchọ ma ọ bụ ebumnuche Paịlet n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: imeju ìgwè mmadụ ahụ afọ
  rationale: Akpaalaokwu Igbo a na-egosi ime ihe ga-emeju ọchịchọ ma ọ bụ arịrịọ ha, kwekọọ na akpaalaokwu Grik nke pụtara imere ìgwè mmadụ ihe ga-eju ha afọ.
- source_word: ἀπέλυσεν
  choice: hapụrụ
  rationale: N’ọnọdụ ikpe a, okwu ahụ pụtara ịtọhapụ onye mkpọrọ; ‘hapụrụ’ bụ okwu Igbo dị mfe ma doo anya n’ahịrịokwu a.
- source_word: αὐτοῖς
  choice: ha
  rationale: Ọ na-ezo aka n’ìgwè mmadụ ahụ dịka ndị e meere mkpebi ịtọhapụ Barabas.
- source_word: παρέδωκεν
  choice: nyefere ya
  rationale: ‘Nyefere ya’ na-echekwa echiche nke itinye Jizọs n’aka na n’okpuru ike ndị ọzọ.
- source_word: φραγελλώσας
  choice: mgbe o mechara nye iwu ka a pịa Jizọs ụtarị
  rationale: Aorist participle ahụ na-egosi ihe mere tupu inyefe ya. N’ọnọdụ a, Paịlet mere ka e tie Jizọs ihe, ya mere nsụgharị a na-egosi ọrụ iwu ya n’enweghị ikwu na ọ bụ aka ya tiri ya.
- source_word: ἵνα σταυρωθῇ
  choice: ka a kpọgide ya n’obe
  rationale: Nke a na-egosi ebumnuche nke inyefe Jizọs, ma na-edobe passive nke Grik n’ụdị Igbo ebumpụta ụwa.
- source_word: Βαραββᾶν
  choice: Barabas
  rationale: E degharịrị aha ahụ n’ụdị a na-ahụkarị ma dị mfe ịgụ n’Igbo.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: E ji ụdị aha Jizọs a maara nke ọma n’Igbo.
theological_decisions:
- issue: Ihe kpaliri Paịlet n’okwu τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: Paịlet chọrọ imeju ìgwè mmadụ ahụ afọ
  alternative: Paịlet chọrọ ime ihe ga-atọ ìgwè mmadụ ahụ ụtọ
  rationale: ‘Imeju ... afọ’ na-egosi na ọ chọrọ imezu ihe ha na-achọ, ma na-echekwa esemokwu omume dị na akụkọ ahụ. ‘Ịtọ ha ụtọ’ pụrụ ịdị ka okwu dị nro karịa ihe ọnọdụ ahụ na-egosi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘imeju ìgwè mmadụ ahụ afọ’ iji mee ka akpaalaokwu Grik doo anya, ebe nkọwa ala peeji na-echekwa nsụgharị ọzọ na ọdịdị nkịtị ya.
