  to: Ma Paịlet, ebe ọ chọrọ imeju ìgwè mmadụ ahụ afọ[a], tọhapụrụ ha Barabas; mgbe o mechara mee ka a pịa Jizọs ụtarị, o nyefere ya ka a kpọgide ya n’obe.
  rationale: The revision replaces the ambiguous verb for Barabbas with a precise judicial-release term and slightly refines the causative expression for the flogging. It retains the source’s sequence, purpose clause, and the crowd-appeasement motive, while preserving the lexical alternative in the footnote.
