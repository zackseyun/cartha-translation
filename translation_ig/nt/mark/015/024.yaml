  to: Ha kpọgidere ya n’obe ma kewaa uwe ya n’etiti onwe ha, na-atụ nza n’elu ha ka a mata onye ga-ewere nke ọ bụla.[a]
  rationale: 'Removed the unsupported additive suffix, avoided describing the garments as inherently varied, and made the prepositional reference in the lot-casting phrase more explicit. The final clause remains appropriately concise while conveying the distributive sense: the lot determined who would take each garment.'
