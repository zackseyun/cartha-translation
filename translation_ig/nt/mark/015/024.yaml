  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: ig
  text: Ha kpọgidere ya n’obe ma kewaa uwe ya n’etiti onwe ha, na-atụ nza n’elu ha ka a mata onye ga-ewere nke ọ bụla.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-atụ nza n’elu uwe ndị ahụ, ka a mata onye ga-ewere nke ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σταυροῦσιν
  choice: kpọgidekwara ya n’obe
  rationale: Nkebiokwu a bụ ụzọ doro anya e si ekwu ‘crucify’ n’Igbo. Ọ bụ ezie na Grik ji oge ugbu a nke akụkọ, iji oge gara aga n’Igbo na-eme ka akụkọ ahụ bụrụ nke e kere eke ma ghara ịgbanwe ihe ọ pụtara.
- source_word: διαμερίζονται
  choice: keekwaa ... dị iche iche n’etiti onwe ha
  rationale: Nke a na-egosi ikewa uwe ahụ ka ndị dị iche iche were akụkụ ya, ma na-asụkwa nke ọma n’Igbo.
- source_word: ἱμάτια
  choice: uwe ya
  rationale: ‘Uwe’ bụ okwu Igbo nkịtị ma dị ùgwù nke na-ezo aka n’ihe ndị mmadụ na-eyi; gburugburu okwu ahụ na-egosi na ihe karịrị otu uwe nwere ike ịdị.
- source_word: βάλλοντες κλῆρον
  choice: na-atụ nzà
  rationale: ‘Ịtụ nzà’ bụ akpaalaokwu Igbo a na-eji maka iji nzà kpebie onye ga-enweta ihe.
- source_word: ἐπ’ αὐτὰ
  choice: maka ha
  rationale: ‘Ha’ na-alaghachi n’uwe ndị ahụ ma na-egosi ihe a na-atụ nzà banyere ya.
- source_word: τίς τί ἄρῃ
  choice: iji mara onye ga-ewere nke ọ bụla
  rationale: 'Nke a na-echekwa nkesa abụọ dị na τίς τί: onye ga-ewere ihe nke ọ bụla.'
theological_decisions:
- issue: Oge ugbu a nke akụkọ n’akụkọ ahụhụ Jizọs
  choice: 'Jiri oge gara aga nke Igbo: ‘Ha kpọgidekwara ya n’obe’'
  alternative: 'Ichekwa ọdịdị oge ugbu a kpọmkwem: ‘Ha na-akpọgide ya n’obe’'
  rationale: σταυροῦσιν bụ historical present nke Mak ji eme ka akụkọ dị ndụ. N’Igbo, ọdịdị ‘na-akpọgide’ nwere ike ịpụta omume na-aga n’ihu karịa ọrụ akụkọ a rụchara; oge gara aga na-enye otu ọrụ akụkọ ahụ n’ụzọ e kere eke, n’enweghị mgbakwunye ozizi.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E tinyere akara ntụaka [a] n’isi ederede, e chekwakwara nghọta nke nkebi ikpeazụ n’enweghị ịkọwapụta ya karịa ihe Grik kwuru.
