id: MRK.15.41
reference: Mark 15:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀αἳ ὅτε ἦν ἐν τῇ Γαλιλαίᾳ ἠκολούθουν αὐτῷ καὶ διηκόνουν αὐτῷ, καὶ ἄλλαι πολλαὶ αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: ig
  text: Ụmụ nwanyị ndị a, mgbe ọ nọ na Galili, na-esobu ya ma na-ejere ya ozi[a]. Ọtụtụ ụmụ nwanyị ndị ọzọ sokwa ya rịgoro Jerusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-elekọta mkpa ya.” Ngwaa Grik ahụ nwere ike ịpụta ijere mmadụ ozi n’ụzọ bara uru ma ọ bụ ịkwado ya.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “soro ya rịgoro Jerusalem.” Nke a na-egosipụta akpaalaokwu Akwụkwọ Nsọ a na-ejikarị ekwu maka ịga Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: αἳ
  choice: Ụmụ nwanyị ndị a
  rationale: Nnọchiaha njikọ a na-arụtụ aka n’ụmụ nwanyị ndị a kpọrọ aha n’amaokwu bu ụzọ; nsụgharị a na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: mgbe ọ nọ na Galili
  rationale: Nke a na-egosipụta nkebiokwu oge ahụ kpọmkwem ma na-eji aha ebe ahụ n’ụzọ Igbo si adị mma.
- source_word: ἠκολούθουν
  choice: na-esobu ya
  rationale: Ụdị ngwaa imperfect na-egosi omume ha na-emebu, ọ bụghị nanị otu ugboro ha soro ya.
- source_word: διηκόνουν
  choice: na-ejere ya ozi
  rationale: Nkebiokwu a sara mbara nke na-egosi ọrụ na nkwado ha na-enye Jizọs, na-enweghị ime ka ọ bụrụ naanị ọrụ ụlọ ma ọ bụ ọkwa chọọchị.
- source_word: ἄλλαι πολλαὶ
  choice: Ọtụtụ ụmụ nwanyị ndị ọzọ
  rationale: E tinyere ‘ụmụ nwanyị’ n’Igbo iji mee ka onye a na-ekwu maka ya doo anya, dịka ụdị nwanyị ọtụtụ nke Grik si gosi.
- source_word: αἱ συναναβᾶσαι αὐτῷ
  choice: sokwa ya rịgoro
  rationale: Nke a na-echekwa echiche nke iso ya gaa nakwa akpaalaokwu Akwụkwọ Nsọ nke ‘ịrịgo’ Jerusalem.
- source_word: εἰς Ἱεροσόλυμα
  choice: Jerusalem
  rationale: N’usoro ‘rịgoro Jerusalem,’ aha obodo ahụ na-egosi ebe njem ahụ na-aga n’Igbo doro anya.
theological_decisions:
- issue: Ụdị ọrụ ụmụ nwanyị ahụ nke διηκόνουν na-egosi
  choice: na-ejere ya ozi
  alternative: na-elekọta mkpa ya
  rationale: ‘Na-ejere ya ozi’ na-echekwa obosara okwu Grik ahụ—ọrụ bara uru na nkwado onwe onye—ma ọ naghị ebubata echiche banyere ọkwa pụrụ iche n’ọgbakọ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Na-esobu’ na-egosi omume ha na-emebu n’oge Jizọs nọ na Galili; ‘rịgoro Jerusalem’ na-echekwa akpaalaokwu njem nke isi mmalite ahụ.
