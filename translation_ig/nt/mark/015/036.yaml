  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: ig
  text: Mgbe ahụ, otu onye[a] gbara ọsọ, jupụta ogbo na mmanya gbara ụka, tinye ya n'osisi amị, na-enye ya ka ọ ṅụọ, na-asị, “Hapụnụ ya[b]. Ka anyị hụ ma Elaija ọ̀ na-abịa iwetu ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ederede ochie anaghị agụ, “otu onye kwa.”
    reason: textual_note
  - marker: b
    text: Ma ọ bụ, “Cherekwanụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δραμὼν
  choice: gbara ọsọ
  rationale: Aorist participle ahụ na-egosi ihe mbụ onye ahụ mere; n'Igbo, usoro ngwaa ndị a na-aga nke ọma dị ka akụkọ ihe mere eme.
- source_word: τις καὶ
  choice: otu onye
  rationale: τις na-ezo aka n'onye a na-akpọghị aha. A naghị asụgharị καί iche ebe a n'ihi na ‘otu onye kwa’ agaghị ada ka Igbo nkịtị n'ọnọdụ a.
- source_word: γεμίσας σπόγγον ὄξους
  choice: were mmanya gbara ụka jupụta ogbo
  rationale: ὄξος bụ mmanya dị ọnụ ala nke gbara ụka, ọ bụghị kpọmkwem mmanya ogbugba ma ọ bụ naanị vinega e ji esi nri n'oge a.
- source_word: περιθεὶς καλάμῳ
  choice: tụkwasị ya n'osisi amị
  rationale: κάλαμος pụtara amị ma ọ bụ osisi amị; okwu a na-egosi na e tinyere ogbo ahụ n'osisi ahụ iji bulie ya.
- source_word: ἐπότιζεν αὐτόν
  choice: nye ya ka ọ ṅụọ
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa n'okike isi kọwaa inye mmadụ ihe ọṅụṅụ. Ọ bụ ezie na imperfect nwere ike igosi omume na-aga n'ihu ma ọ bụ nke a na-anwa ime, ọnọdụ a na-enye ohere ịkọwa ya dị ka omume akụkọ.
- source_word: Ἄφετε
  choice: Hapụnụ ya
  rationale: Imperative plural ahụ pụtara ka ndị ọzọ hapụ ya ma ọ bụ kwụsị ihe ha na-eme; a na-edobe nghọta ọzọ, ‘Cherekwanụ,’ n'ala peeji.
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: Ka anyị hụ ma Ịlaịja ọ̀ na-abịa
  rationale: Nke a na-edobe echiche nke ịnwale ma ihe ahụ ọ ga-eme, tinyere ịdị ngwa nke present ἔρχεται.
- source_word: καθελεῖν αὐτόν
  choice: iwetu ya
  rationale: N'ọnọdụ mkpọgide n'obe, καθαιρέω pụtara iwetu mmadụ site n'ebe dị elu, ya bụ, n'obe.
theological_decisions:
- issue: Ihe onye na-ekwu bu n'obi mgbe ọ sịrị Ἄφετε
  choice: A sụgharịrị ya dị ka iwu ka ndị ọzọ hapụ Jizọs nwa oge, ka ha hụ ma Ịlaịja ọ ga-abịa nyere ya aka.
  alternative: A pụkwara ịsụgharị ya, “Cherekwanụ.”
  rationale: Okwu Grik ahụ nwere ike ịbụ iwu ka a hapụ mmadụ ma ọ bụ, n'ọnọdụ a, okwu e ji agwa ndị mmadụ ka ha chere. Isi ederede na-edobe nghọta nkịtị, ebe ala peeji na-echekwa nghọta ọzọ n'ebughị ụzọ kpebie ya kpamkpam.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, mee ntụgharị ahụ. ‘Mmanya gbara ụka’ na-ezere echiche nke vinega nri nke oge a, ebe ‘osisi amị’ na-edobe nkọwa κάλαμος. E tinyere akara ala peeji [a] na [b] n'isi ederede.
