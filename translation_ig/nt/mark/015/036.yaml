revisions:
- from: Mgbe ahụ, otu onye gbara ọsọ[a], were mmanya gbara ụka jupụta ogbo, tụkwasị ya n'osisi amị, nye ya ka ọ ṅụọ, na-asị, “Hapụnụ ya[b]. Ka anyị hụ ma Ịlaịja ọ̀ na-abịa iwetu ya.”
  to: Mgbe ahụ, otu onye[a] gbara ọsọ, jupụta ogbo na mmanya gbara ụka, tinye ya n'osisi amị, na-enye ya ka ọ ṅụọ, na-asị, “Hapụnụ ya[b]. Ka anyị hụ ma Elaija ọ̀ na-abịa iwetu ya.”
  rationale: The revision improves Standard Igbo idiom, represents the ongoing force of ἐπότιζεν, uses the conventional biblical name Elaija, and replaces the confusing textual note with a concise note accurately tied to the bracketed τις καὶ. The alternative sense of Ἄφετε is retained without forcing a single interpretation.
