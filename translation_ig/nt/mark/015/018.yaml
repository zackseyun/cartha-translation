  yaml_path: translation/nt/mark/015/018.yaml
  text: 'And they began to salute him: “Hail[b][a], King of the Jews!”'
translation:
  language: ig
  text: Ha wee malite ikele ya[a], sị, “Ekele, Eze ndị Juu[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịgwa ya ekele.” Ngwaa Grik a nwere ike ịpụta ekele nkịtị, ma n'ebe a ọ bụ ekele dịka a na-enye eze, nke ha ji na-akwa ya emo.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị Judia.” Okwu Grik ahụ nwere ike ịpụta ma ndị Juu ma ndị Judia; a họọrọ “ndị Juu” ebe ọ bụ nghọta a na-ahụkarị n'aha e nyere Jizọs n'akụkọ ahụhụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ha wee
  rationale: Nke a na-ejikọta ihe omume a na nke bu ya ụzọ n'ụzọ e si akọ akụkọ n'Igbo, ma na-edobe usoro akụkọ Mak.
- source_word: ἤρξαντο
  choice: malite
  rationale: Ọ na-egosi mmalite omume ahụ, dịka ngwaa Grik ἄρχομαι na infinitive si arụ ọrụ n'ahịrịokwu a.
- source_word: ἀσπάζεσθαι
  choice: ikele ya
  rationale: N'Igbo, ‘ikele ya’ nwere ike ịpụta ịgwa mmadụ ekele; n'ọnọdụ a, ọ na-egosikwa ekele a haziri ka nsọpụrụ eze, ma ndị agha ji ya na-akwa ya emo.
- source_word: Χαῖρε
  choice: Ekele dịrị gị
  rationale: N'ebe a, Χαῖρε bụ okwu e ji ekele mmadụ, ọ bụghị iwu ka ọ ṅụrịa. ‘Ekele dịrị gị’ na-enye ụda ekele dị elu nke dabara n'ịkwa eze emo.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: Eze ndị Juu
  rationale: βασιλεῦ bụ ụdị okwu a na-akpọ mmadụ kpọmkwem, ya mere ‘Eze’ dabara. N'akụkọ ahụhụ Jizọs a, ‘ndị Juu’ bụ nghọta a na-ahụkarị maka Ἰουδαίων, n'agbanyeghị na okwu ahụ nwekwara ike ịpụta ndị Judia.
theological_decisions:
- issue: Igosipụta ekele ndị agha nyere Jizọs dịka ekele eze nke ịkwa emo, n'emeghị ka ihe gbasara ịbụ eze pụọ n'anya
  choice: “Ekele dịrị gị, Eze ndị Juu!”
  alternative: “Ndeewo, Eze ndị Juu!”
  rationale: Nhọrọ a na-edobe ụda ekele eze na ihe ọchị ọjọọ ndị agha ahụ bu n'obi, ma ọ naghị etinye nkọwa ozizi karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Ha wee malite’ na-enye usoro akụkọ n'ụzọ Igbo nkịtị; ‘Ekele dịrị gị’ na-edobe ụda ekele dị elu na nke ịkwa emo dị n'okwu Grik.
