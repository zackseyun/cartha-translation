  source_fidelity: 'The draft accurately represents the connective, the ingressive force of ἤρξαντο (''began''), the act of greeting/saluting Jesus, and the royal title. The direct acclamation should be adjusted: “Ekele dịrị gị” more naturally functions as a wish or expression of congratulations/thanks in Igbo, rather than as a direct formal salutation corresponding to Χαῖρε.'
