review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the chief priests, the crowd, the purpose clause, Barabbas, and the contextual comparative force of μᾶλλον. However, “ọ hapụrụ” is a completed past form and does not adequately represent the purpose expressed by ἵνα with the aorist subjunctive ἀπολύσῃ. “Hapụ” can also mean ‘leave’; “tọhapụ” is more precise for release from custody.
  naturalness: The revised wording uses a natural Standard Igbo purpose construction and places “kama” where it clearly modifies the intended release. It also removes the awkward expanded quotation in footnote a.
  terminology: “ndị isi nchụàjà,” “ìgwè mmadụ,” and “Barabas” are appropriate. “tọhapụụrụ ha” accurately conveys release to/for the crowd, while “kama” retains the source’s contextually implied comparison without explicitly inserting Jesus.
  issues:
  - severity: medium
    issue: The main verb “hapụrụ” is perfective/past in a purpose clause.
    rationale: 'Greek ἵνα ... ἀπολύσῃ expresses the intended outcome: that Pilate might/would release Barabbas. Standard Igbo is better served by “ka ọ kama tọhapụụrụ ha Barabas.”'
  - severity: low
    issue: “Hapụ” is less specific than needed in this custody setting.
    rationale: “Tọhapụ” naturally means release or set free and avoids the possible sense ‘leave behind.’
  - severity: low
    issue: Footnote a’s proposed alternative is unnecessarily expansive and slightly awkward.
    rationale: The lexical alternative can directly state “kpalite ìgwè mmadụ ahụ,” while the explanation supplies the intended-action nuance.
  revised_text: Ma ndị isi nchụàjà kpaliri ìgwè mmadụ ahụ[a] ka ọ kama tọhapụụrụ ha Barabas[b].
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “kpalite ìgwè mmadụ ahụ.” Ngwaa Grik a nwere ike ịpụta ịkpalite ma ọ bụ ịkpasu otu ìgwè ime ihe e bu n’obi.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “karịa nke ọzọ.” Ihe ọ pụtara bụ na a ga-atọhapụ Barabas karịa onye ọzọ a na-atụnyere ya, onye a ghọtara site n’ihe gbara amaokwu a gburugburu.
    reason: lexical_alternative
  revision_rationale: The revision changes the purpose-clause verb to a natural and semantically precise Igbo expression for release, while preserving the implied—not explicitly named—alternative signaled by μᾶλλον. Footnotes retain the two supplied lexical alternatives and their anchors.
