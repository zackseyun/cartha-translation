  text: οἱ δὲ ἀρχιερεῖς ἀνέσεισαν τὸν ὄχλον ἵνα μᾶλλον τὸν Βαραββᾶν ἀπολύσῃ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/011.yaml
  text: But the chief priests stirred up the crowd so that he would release Barabbas to them instead[a][b].
translation:
  language: ig
  text: Ma ndị isi nchụàjà kpaliri ìgwè mmadụ ahụ[a] ka ọ kama tọhapụụrụ ha Barabas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “kpalite ìgwè mmadụ ahụ.” Ngwaa Grik a nwere ike ịpụta ịkpalite ma ọ bụ ịkpasu otu ìgwè ime ihe e bu n’obi.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “karịa nke ọzọ.” Ihe ọ pụtara bụ na a ga-atọhapụ Barabas karịa onye ọzọ a na-atụnyere ya, onye a ghọtara site n’ihe gbara amaokwu a gburugburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ma
  rationale: δέ na-egosi obere ọdịiche n’ihe a na-akọ; “Ma” na-ejikọta amaokwu a na atụmanya e kwuru tupu ya.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Nke a bụ okwu Igbo doro anya maka ndị ndu nchụàjà nọ na Jerusalem.
- source_word: ἀνέσεισαν
  choice: kpaliri
  rationale: “Kpaliri” na-egosi ime ka ìgwè mmadụ bilie mee ihe a chọrọ, n’enweghị ịgbakwụnye ihe na-adịghị na Grik.
- source_word: τὸν ὄχλον
  choice: ìgwè mmadụ ahụ
  rationale: Ọ bụ okwu Igbo nkịtị ma doo anya maka ìgwè ndị gbakọrọ ọnụ e kwuru n’akụkọ ahụ.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-ewebata ebumnuche nke ihe ndị isi nchụàjà mere.
- source_word: μᾶλλον
  choice: kama
  rationale: “Kama” na-egosi na a họọrọ Barabas karịa onye ọzọ a ghọtara site n’ihe gbara amaokwu ahụ gburugburu, n’agbanyeghị na aha onye ahụ adịghị n’amaokwu Grik a.
- source_word: τὸν Βαραββᾶν
  choice: Barabas
  rationale: A sụgharịghị aha onye ahụ; e dere ya n’usoro mkpụrụokwu dabara n’Igbo.
- source_word: ἀπολύσῃ
  choice: ọ hapụrụ
  rationale: Ụdị a na-enye ebumnuche dị n’ἵνα na subjunctive, ebe “ọ” na-ezo aka na Paịlet, onye a ghọtara site n’akụkọ gbara ya gburugburu.
- source_word: αὐτοῖς
  choice: ha
  rationale: “Ha” na-egosi na ọ bụ ìgwè mmadụ ahụ ga-anata uru nke ntọhapụ ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E chekwaghị aha onye a na-atụnyere Barabas na ya n’ahịrị isi, n’ihi na μᾶλλον hapụrụ ya ka ihe ndị gbara amaokwu ahụ gburugburu mee ka a ghọta ya.
