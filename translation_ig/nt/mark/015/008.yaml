- from: Ìgwè mmadụ ahụ bịarutere, malite ịrịọ ya ka o meere ha ihe ọ na-emere ha mgbe niile.[a]
  to: Ìgwè mmadụ ahụ bịarutere, malitere ịrịọ ya ka o meere ha dịka ọ na-emebu.[a]
  rationale: The revision changes the aspectual rendering from a present ongoing habit to a customary past practice and makes the narrative verb sequence natural in Standard Igbo. It retains the contextual object “ya” (Pilate), the benefactive “ha,” and the source’s concise, somewhat implicit formulation rather than supplying a specific customary favor.
