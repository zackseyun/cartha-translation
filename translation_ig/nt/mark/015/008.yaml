  yaml_path: translation/nt/mark/015/008.yaml
  text: And the crowd came up and began to ask him to do as he used to do for them[a].
translation:
  language: ig
  text: Ìgwè mmadụ ahụ bịarutere, malitere ịrịọ ya ka o meere ha dịka ọ na-emebu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ na-esochikwu usoro okwu Grik: “Ìgwè mmadụ ahụ, ebe ọ bịarutere, malitere ịrịọ ya ka o meere ha dịka ọ na-emebu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: bịarutere
  rationale: Aorist participle nke ἀναβαίνω na-egosi na ìgwè mmadụ ahụ gbagoro ma ọ bụ bịakwutere Paịlet. “Bịarutere” bụ ụzọ Igbo si kwuo ya nke ọma n’ebe a, n’ebughị echiche banyere ụzọ mgbago karịa ihe amaokwu ahụ chọrọ.
- source_word: ὁ ὄχλος
  choice: ìgwè mmadụ ahụ
  rationale: ὄχλος pụtara ìgwè mmadụ; ụdị a bụ Igbo nkịtị, doo anya, ma dabara n’akụkọ ahụ.
- source_word: ἤρξατο αἰτεῖσθαι
  choice: malite ịrịọ ya
  rationale: ἄρχομαι tinyere infinitive pụtara ịmalite ime ihe, ebe αἰτέω pụtara ịrịọ. E tinyere “ya” n’ihi na Paịlet bụ onye ha na-arịọ dịka ihe gbara amaokwu a gburugburu si gosi.
- source_word: καθὼς
  choice: ka ... ihe ... mgbe niile
  rationale: καθώς bụ “dịka,” ma n’usoro okwu a ọ na-ezo aka n’omume Paịlet na-emere ha mgbe niile. Nhazi Igbo a na-eme ka ihe a na-ekwu doo anya ma na-echekwa ntụnyere ahụ.
- source_word: ἐποίει
  choice: ọ na-emere ... mgbe niile
  rationale: Imperfect nke ποιέω n’ebe a na-egosi omume a na-emebu. “Na-emere ... mgbe niile” na-egosipụta omume ahụ nke ọma n’Igbo.
- source_word: αὐτοῖς
  choice: ha
  rationale: Dative αὐτοῖς nwere nghọta benefactive n’ebe a, ya bụ, ihe a na-emere ha; usoro “meere ha” bụ Igbo ebumpụta ụwa.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma dị ùgwù. Isi ederede na-akọwa n’ụzọ ebumpụta ụwa na ihe ha rịọrọ bụ ka Paịlet meere ha omume ya a na-emebu; nkọwa ala peeji na-echekwa usoro okwu Grik nke nwere ntakịrị nghọta abụọ.
