  text: Ἦσαν δὲ καὶ γυναῖκες ἀπὸ μακρόθεν θεωροῦσαι, ἐν ⸀αἷς καὶ ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸀ἡ Ἰακώβου τοῦ μικροῦ καὶ ⸀Ἰωσῆτος μήτηρ καὶ Σαλώμη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/040.yaml
  text: There were also women watching from a distance[a], among whom were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome[c][b],
translation:
  language: ig
  text: E nwekwara ụmụ nwanyị na-ekiri site n'ebe dị anya[a]. N'ime ha bụ Meri Magdalin, Meri nne Jemis nke nta[b] na Joses[c], na Salome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n'ebe tere aka.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “Jemis nke nta.” Okwu Grik ahụ nwere ike izo aka n'ịdị nta n'afọ, n'ahụ, ma ọ bụ n'ọkwa.
    reason: lexical_alternative
  - marker: c
    text: Aha Grik e dere n'ebe a bụ Joses, ụdị aha dị iche na Josef.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ γυναῖκες
  choice: Ụmụ nwanyị ụfọdụ nọkwa ebe ahụ
  rationale: Nke a na-egosipụta ịdị adị nke ụmụ nwanyị ndị ọzọ n'ebe ahụ na ike mgbakwunye nke δέ na καί, n'Igbo dị mfe ma bụrụkwa nke akụkọ.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: na-ekiri site n'ebe dị anya
  rationale: Na-egosipụta omume ha nọgidere na-eme nakwa ohere dị n'etiti ha na ebe ihe ahụ na-eme.
- source_word: ἐν αἷς
  choice: N'ime ha bụ
  rationale: Na-egosi na ndị a kpọrọ aha so n'ìgwè ụmụ nwanyị ahụ.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Meri Magdalin
  rationale: Ụdị aha a na-aghọta nke ọma n'Igbo, ma na-edobe njirimara ya dị ka nwanyị si Magdala.
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: Meri nne Jemis nke a na-akpọ Onye Nta na Joses
  rationale: Na-eme ka o doo anya na Meri bụ nne ụmụ nwoke abụọ ahụ, ma ghara ikpebi na μικρός pụtara nanị afọ, ogo ahụ, ma ọ bụ mkpa.
- source_word: Ἰωσῆτος
  choice: Joses
  rationale: Na-edobe ụdị aha Grik dị iche kama ime ka ọ bụrụ Josef.
- source_word: Σαλώμη
  choice: Salome
  rationale: Ntinye aha ahụ n'ụdị a maara nke ọma n'Igbo.
theological_decisions:
- issue: Ihe nkọwa τοῦ μικροῦ pụtara n'aha Jemis
  choice: nke a na-akpọ Onye Nta
  alternative: Jemis nke obere; Jemis nke nta n'afọ
  rationale: Okwu Grik ahụ nwere ike ịpụta onye nta n'afọ, n'ahụ, ma ọ bụ n'ọkwa. Nsụgharị a na-edobe ya dịka aha e ji amata ya n'ekpebighị kpọmkwem ụdị 'ịdị nta' a na-ekwu.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “na-ekiri” gosipụta nlele gara n'ihu; e debeghị nkọwa μικρός ka ọ bụrụ naanị afọ n'ihi na isi mmalite ekwughị ya hoo haa. Akara nkọwa ụkwụ niile [a], [b], na [c] dị n'ederede.
