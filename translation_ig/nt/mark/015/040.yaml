  rationale: Removed the unsupported “ụfọdụ,” retained the women’s ongoing observation from a distance, and replaced the title-like “Onye Nta” with the more source-shaped and ambiguity-preserving “Jemis nke nta.” Footnote anchors are placed directly after the terms they explain.
