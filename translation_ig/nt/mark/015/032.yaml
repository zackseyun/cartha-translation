source:
  edition: SBLGNT
  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: ig
  text: “Ka Mesaịa[a] ahụ, bụ Eze Izrel, si n’obe ahụ rịdata ugbu a, ka anyị hụ wee kwere.” Ndị a kpọgidere n’obe ọnụ na ya nọkwa na-akparị ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” “Mesaịa” pụtara “Onye e tere mmanụ.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “na-ekwujọ ya” ma ọ bụ “na-akọcha ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ χριστός
  choice: Mesaịa ahụ
  rationale: A sụgharịrị ya dịka aha ọkwa nke Onye E Tere Mmanụ, n’ihi na n’ebe a ọ bụ akụkụ nke ịkwa emo banyere ịbụ eze, ọ bụghị naanị aha a na-akpọ Jizọs.
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: bụ Eze Izrel
  rationale: Nke a na-echekwa aha ọkwa eze ahụ ma na-eme ka njikọ ya na “Mesaịa ahụ” doo anya n’Igbo.
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: si n’obe ahụ rịdata ugbu a
  rationale: “Rịdata” na-egosi ngagharị ala; “ugbu a” na-echekwa ngwa ngwa na olu ịkwa emo dị n’iwu ahụ.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: ka anyị hụ wee kwere
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma dịkwa eke isi chekwaa usoro ịhụ na ikwere, yana ebumnuche a na-ekwu n’ụdị ịkwa emo.
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: Ndị a kpọgidekọrọ ya n’obe
  rationale: Nke a na-egosi ndị ha na ya nọkọrọ n’ọnọdụ ịkpọgide n’obe, na-etinyeghị nkọwa ọzọ na-adịghị n’ederede.
- source_word: ὠνείδιζον αὐτόν
  choice: nọkwa na-akparị ya
  rationale: Ụdị “nọ na-akparị” na-egosi omume na-aga n’ihu nke imperfect ahụ; “kwa” na-anọchi καί nke jikọtara ha na ndị ọzọ na-akwa ya emo.
theological_decisions:
- issue: Nsụgharị Χριστός n’ọnọdụ ịkwa emo banyere ọchịchị eze
  choice: Mesaịa
  alternative: Kraịst
  rationale: “Mesaịa” na-eme ka echiche nke Onye E Tere Mmanụ na onye eze a na-atụ anya ya pụta ìhè n’ọnọdụ a, ebe “Kraịst” nwere ike ịdị ka aha nkịtị.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ka ... rịdata” na-eburu olu iwu nke ịkwa emo; “nọkwa na-akparị” na-echekwa omume na-aga n’ihu na njikọ καί.
