    text: A pụkwara ịsụgharị ya, “na-ekwujọ ya” ma ọ bụ “na-akọcha ya.”
    reason: lexical_alternative
  revision_rationale: 'The revision resolves the only material ambiguity: the final subject is explicitly those crucified with Jesus, not those participating in crucifying him. The rest of the draft accurately preserves the taunting register, royal-messianic terminology, ongoing force of the imperfect, and available lexical alternatives.'
