revisions:
- from: “Ka Mesaịa[a] ahụ, bụ Eze Izrel, si n’obe ahụ rịdata ugbu a, ka anyị hụ wee kwere.” Ndị a kpọgidekọrọ ya n’obe nọkwa na-akparị ya.[b]
  to: “Ka Mesaịa[a] ahụ, bụ Eze Izrel, si n’obe ahụ rịdata ugbu a, ka anyị hụ wee kwere.” Ndị a kpọgidere n’obe ọnụ na ya nọkwa na-akparị ya.[b]
  rationale: 'The revision resolves the only material ambiguity: the final subject is explicitly those crucified with Jesus, not those participating in crucifying him. The rest of the draft accurately preserves the taunting register, royal-messianic terminology, ongoing force of the imperfect, and available lexical alternatives.'
