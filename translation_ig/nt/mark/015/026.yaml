- from: 'Ihe e dere banyere ebubo e boro ya bụ: “Eze ndị Juu.”[a]'
  to: 'Ihe e dere dịka ebubo e boro ya bụ: “Eze ndị Juu.”[a]'
  rationale: The revision preserves the compact Igbo expression “ihe e dere” for ἐπιγραφή/ἐπιγεγραμμένη while clarifying that the posted wording is the charge against Jesus, not merely a notice about a charge. The quotation and lexical-alternative footnote are retained unchanged.
