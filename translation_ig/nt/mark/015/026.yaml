source:
  edition: SBLGNT
  text: καὶ ἦν ἡ ἐπιγραφὴ τῆς αἰτίας αὐτοῦ ἐπιγεγραμμένη· Ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/026.yaml
  text: 'And the inscription of the charge against him was written: “The King of the Jews.”[a]'
translation:
  language: ig
  text: 'Ihe e dere dịka ebubo e boro ya bụ: “Eze ndị Juu.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Eze ndị Judia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: ihe e dere
  rationale: Ọ na-ezo aka n’ihe e dere nke e tinyere n’obe ma ọ bụ n’elu ya; okwu a bụ nke Igbo nkịtị ma doo anya.
- source_word: αἰτία
  choice: ebubo e boro ya
  rationale: N’ọnọdụ ikpe a, okwu ahụ pụtara ebubo iwu e kwuru megide ya.
- source_word: ἐπιγεγραμμένη
  choice: e dere
  rationale: Ọ na-egosi na ihe ahụ nọgidere dịka ihe e dere; nsụgharị a dị mfe ma bụrụ Igbo eke.
- source_word: βασιλεὺς
  choice: Eze
  rationale: Ọ bụ aha ọchịchị dị n’okwu ebubo ahụ.
- source_word: Ἰουδαίων
  choice: ndị Juu
  rationale: N’akụkọ ahụhụ Jizọs, nke a bụ aha ndị a maara nke ọma n’okwu e tinyere n’obe; ‘ndị Judia’ ka bụ ihe ọzọ okwu Grik ahụ nwere ike ịpụta.
theological_decisions:
- issue: Nsụgharị Ἰουδαίων n’aha e tinyere n’obe
  choice: ndị Juu
  alternative: ndị Judia
  rationale: “Ndị Juu” na-echekwa aha otu ndị ahụ dịka ebubo ndị Rom si kwuo ya, n’ebughị ụzọ mee ka ọ bụrụ naanị aha mpaghara. E debere ‘ndị Judia’ n’ala peeji n’ihi na okwu Grik ahụ nwekwara ike inwe nghọta ahụ n’ọnọdụ ụfọdụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A haziri ahịrịokwu ahụ ka ọ bụrụ Igbo eke, ebe a ka na-echekwa ebubo ahụ na aha eze dị n’ihe odide Grik.
