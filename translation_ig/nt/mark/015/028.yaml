  yaml_path: translation/nt/mark/015/028.yaml
  text: And[a] the scripture was fulfilled that says, "And he was numbered with the transgressors."
translation:
  language: ig
  text: Ihe e dere n’Akwụkwọ Nsọ mezuru[a], nke sịrị, “E gụkọrọ ya na ndị na-emebi iwu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a adịghị n’akwụkwọ odide Grik ndị kacha ochie, gụnyere Codex Sinaiticus na Codex Vaticanus nke narị afọ nke anọ, nakwa na nsụgharị Kọptik ndị mbụ. Ma ọ dị n’ọtụtụ akwụkwọ odide nke omenala Byzantium nakwa n’omenala Latin. O yikarịrị ka ndị na-edegharị akwụkwọ mechara tinye ya ka ebe a kwekọọ na Luk 22:37, nke hotara Aịzaya 53:12.
    reason: textual_critical
lexical_decisions:
- source_word: πληρόω
  choice: mezukwara
  rationale: N’ọnọdụ a, okwu a na-egosi na ihe e dere n’amụma bịara ná mmezu; “mezuru” bụ okwu Igbo doro anya ma dabara n’ọrụ passive nke Grik.
- source_word: γραφή
  choice: ihe e dere n’Akwụkwọ Nsọ
  rationale: N’ebe a, γραφή na-ezo aka n’ihe Akwụkwọ Nsọ kwuru, ọ bụghị nanị ide ihe n’ozuzu ya.
- source_word: ἄνομος
  choice: ndị na-emebi iwu
  rationale: Nke a na-egosipụta echiche nkịtị nke ndị na-enweghị isi n’iwu ma ọ bụ ndị na-emebi ya, na-enweghị ime ka okwu ahụ bụrụ naanị aha ndị omempụ.
- source_word: λογίζομαι
  choice: gụnyere
  rationale: Ụdị passive ahụ pụtara na e weere ya ma tinye ya n’otu ndị ahụ; “a gụnyere ya” bụ Igbo eke ma na-echekwa echiche nke ịgụkọ ma ọ bụ ịhazi ya n’etiti ha.
theological_decisions:
- issue: Njikọ amaokwu ahụ na amụma Aịzaya 53:12
  choice: E ji okwu mmezu mee ihe n’ụzọ kwụ ọtọ, n’enweghị nkọwa agbakwunyere banyere onye mere ka ọ mezue.
  alternative: Ịsị na Chineke mezuru amụma ahụ.
  rationale: Ụdị passive Grik ekwughị onye mere ihe ahụ; ntụgharị ahụ na-echekwa oghere ahụ ma ghara ịgbakwunye nkọwa nkà mmụta okpukpe.
translation_notes:
  register: Ejiri Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. E tinyere akara [a] ozugbo n’amaokwu ahụ, ma chekwaa usoro okwu amụma ahụ n’enweghị ịgbakwunye nkọwa otu ụka.
