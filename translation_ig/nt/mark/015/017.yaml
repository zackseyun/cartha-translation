  text: καὶ ⸀ἐνδιδύσκουσιν αὐτὸν πορφύραν καὶ περιτιθέασιν αὐτῷ πλέξαντες ἀκάνθινον στέφανον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: ig
  text: Ha yikwasịrị ya akwa odo odo[a], mgbe ha kpasịrị okpueze ogwu, ha wee kpukwasị ya okpueze ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ha yikwasịrị ya uwe odo odo”; okwu Grik ahụ ekwughị kpọmkwem na ọ bụ uwe n’amaokwu a, n’agbanyeghị na ihe ndị gbara ya gburugburu na-egosi uwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: yikwasị ya uwe
  rationale: Ngwaa a pụtara iyikwasị mmadụ uwe; okwu a bụ Igbo nkịtị ma na-egosi na ndị agha bụ ndị yi ya uwe ahụ.
- source_word: πορφύραν
  choice: uwe odo odo
  rationale: Aha Grik a nwere ike ịpụta akwa odo odo ma ọ bụ uwe e ji akwa dị otú ahụ mee. N'Igbo, itinye ‘uwe’ na-eme ka ahịrịokwu doo anya, ma ihe odide Grik ekwughị kpọmkwem na ọ bụ uwe mwụda.
- source_word: περιτιθέασιν
  choice: kpukwasị ya ya
  rationale: Ngwaa a pụtara itinye ihe gburugburu ma ọ bụ n'elu mmadụ. N'ebe a, nnọchiaha nke abụọ na-ezo aka n'okpueze ahụ, ebe nke mbụ na-ezo aka na Jizọs.
- source_word: πλέξαντες
  choice: ha kpaa
  rationale: Nkebi a na-egosi ihe ha buru ụzọ mee tupu ha ekpukwasị ya okpueze ahụ; usoro ahịrịokwu Igbo na-egosi usoro omume ahụ nke ọma.
- source_word: ἀκάνθινον
  choice: ogwu
  rationale: Ọ na-akọwa ihe e ji ogwu mee; ‘okpueze ogwu’ bụ okwu Igbo doro anya ma dị mfe.
- source_word: στέφανον
  choice: okpueze
  rationale: Ọ bụ ezie na okwu ahụ nwekwara ike ịpụta okooko e kpụrụ gburugburu, ‘okpueze’ na-echekwa ihe oyiyi nke ndị agha ji mee ihe ọchị banyere ịbụ eze.
theological_decisions:
- issue: Ihe oyiyi ịkwa eze emo n'ime mmechuihu Jizọs
  choice: Jiri ‘okpueze’ maka στέφανος.
  alternative: Ihe e kpụrụ gburugburu isi ma ọ bụ okooko isi
  rationale: Uwe odo odo na okpueze ogwu na-egosi na ndị agha na-eme ihe e ji asọpụrụ eze ka ọ bụrụ ihe ịkwa emo. ‘Okpueze’ na-echekwa ebumnuche akụkọ ahụ n'etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. A họọrọ ‘odo odo’ dị ka aha agba a na-ahụkarị maka purple, ebe nkọwa ala peeji na-echekwa ohere na πορφύρα nwere ike ịpụta akwa ma ọ bụ uwe.
