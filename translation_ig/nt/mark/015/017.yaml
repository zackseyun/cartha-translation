  rationale: The revision retains the source’s lack of an explicit noun for a robe by using “akwa odo odo,” preserves the prior weaving of the crown with “mgbe ha kpasịrị,” and resolves the unclear final pronoun by explicitly referring to “okpueze ahụ.”
