revisions:
- from: N'otu aka ahụ kwa, ndị isi nchụàjà na ndị odeakwụkwọ na-akwa ya emo, na-agwa ibe ha okwu[a] sị, “Ọ zọpụtara ndị ọzọ; ọ pụghị ịzọpụta onwe ya.”
  to: N'otu aka ahụ kwa, ndị isi nchụàjà, ha na ndị odeakwụkwọ, nọ na-akwa ya emo, na-ekwu n’etiti onwe ha, sị, “Ọ zọpụtara ndị ọzọ; ọ pụghị ịzọpụta onwe ya.”
  rationale: The revision preserves the source’s grammatical focus on the chief priests, represents the scribes as accompanying them, and renders the reciprocal speech naturally. It retains “zọpụtara ... ịzọpụta” to preserve the deliberate verbal repetition in the taunt. A footnote remains appropriate because the precise syntactic scope of “with the scribes” and “to one another” is not entirely explicit.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:00:24Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the parallel action, the chief-priestly group, derision directed at Jesus, and the repeated σῴζω wordplay. However, coordinating “ndị isi nchụàjà na ndị odeakwụkwọ” as the full subject slightly obscures the Greek syntax, in which the chief priests are the explicit subject and the scribes accompany them. The revised wording keeps the scribes’ participation while retaining the chief priests as the primary grammatical subject. It also more directly renders the reciprocal/conversational force of πρὸς ἀλλήλους and the imperfect ἔλεγον.
  naturalness: The revision uses natural, formal modern Standard Igbo. “Ha na ndị odeakwụkwọ” idiomatically means “together with the scribes,” while “na-ekwu n’etiti onwe ha, sị” avoids the slightly redundant “na-agwa ibe ha okwu sị.”
  terminology: “Ndị isi nchụàjà,” “ndị odeakwụkwọ,” and “zọpụtara ... ịzọpụta” are suitable. Repeating the zọpụta root preserves the Greek repetition and its contextual irony without narrowing σῴζω to a doctrinal sense.
  issues:
  - severity: medium
    issue: The scribes are coordinated with the chief priests as an equal grammatical subject.
    rationale: The Greek explicitly names “the chief priests” as subject and adds “with the scribes.” The revision retains this distinction without implying that the scribes were uninvolved.
  - severity: low
    issue: “na-agwa ibe ha okwu sị” is somewhat repetitive and less direct for the imperfect speech verb.
    rationale: “na-ekwu n’etiti onwe ha, sị” is more idiomatic and represents their ongoing speech among themselves.
  - severity: low
    issue: The footnote’s proposed alternative is awkwardly phrased.
    rationale: The revised note states the syntactic ambiguity clearly and naturally, without presenting a strained alternative construction.
  revised_text: N'otu aka ahụ kwa, ndị isi nchụàjà, ha na ndị odeakwụkwọ, nọ na-akwa ya emo, na-ekwu n’etiti onwe ha, sị, “Ọ zọpụtara ndị ọzọ; ọ pụghị ịzọpụta onwe ya.”
  revised_footnotes:
  - marker: a
    text: Okwu Grik ahụ nwere ike igosi na ndị isi nchụàjà na-akwa Jizọs emo ma na-ekwu okwu n’etiti onwe ha, ndị odeakwụkwọ sokwa ha.
    reason: lexical_alternative
