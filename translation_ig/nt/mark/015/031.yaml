source:
  edition: SBLGNT
  text: ὁμοίως καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες πρὸς ἀλλήλους μετὰ τῶν γραμματέων ἔλεγον· Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: ig
  text: N'otu aka ahụ kwa, ndị isi nchụàjà, ha na ndị odeakwụkwọ, nọ na-akwa ya emo, na-ekwu n’etiti onwe ha, sị, “Ọ zọpụtara ndị ọzọ; ọ pụghị ịzọpụta onwe ya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: N'otu aka ahụ kwa
  rationale: Na-egosi na ịkwa emo a yiri nke ndị a kpọrọ aha n'amaokwu ndị bu ya ụzọ; “kwa” na-anọchikwa καί.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Nke a na-ezo aka n'ọnụ ọgụgụ ndị ndu nchụàjà, ọ bụghị na e nwere ọtụtụ ndị ji otu ọkwa onyeisi nchụàjà n'otu oge.
- source_word: ἐμπαίζοντες
  choice: na-akwa ya emo
  rationale: Ọ na-egosi nkwutọ na ịkwa Jizọs emo; itinye “ya” na-eme ka okwu Igbo doo anya dịka ọnọdụ gbara ya gburugburu si gosi.
- source_word: πρὸς ἀλλήλους
  choice: na-agwa ibe ha okwu
  rationale: Na-echekwa echiche nke omume ha na-eme n'etiti onwe ha, karịsịa na ha na-ekwu okwu ịkwa emo ahụ nye ibe ha.
- source_word: μετὰ τῶν γραμματέων
  choice: na ndị odeakwụkwọ
  rationale: Na-egosi na ndị odeakwụkwọ sonyeere ndị isi nchụàjà; “ndị odeakwụkwọ” bụ aha a na-ejikarị maka ndị ọkachamara n'Iwu ahụ.
- source_word: ἔλεγον
  choice: sị
  rationale: N'usoro okwu Igbo a, “na-agwa ibe ha okwu sị” na-enye echiche nke okwu na-aga n'ihu ma ọ bụ a na-ekwughachi, n'enweghị okwu siri ike karịa ihe Grik kwuru.
- source_word: Ἄλλους ἔσωσεν
  choice: Ọ zọpụtara ndị ọzọ
  rationale: “Zọpụtara” nwere ike ịpụta ịnapụta ma ọ bụ ịzọpụta, ya mere ọ na-echekwa obosara ihe σῴζω pụtara na okwu njakịrị a.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: ọ pụghị ịzọpụta onwe ya
  rationale: 'Na-echekwa okwu gbasara ikike nakwa mmegharị otu mgbọrọgwụ okwu ahụ: “zọpụtara ... ịzọpụta.”'
theological_decisions:
- issue: Ịsụgharị σῴζω n'otu ụzọ n'ahịrịokwu abụọ ahụ
  choice: zọpụtara ... ịzọpụta
  alternative: napụtara ... ịnapụta
  rationale: Iji otu okwu ahụ ugboro abụọ na-echekwa mmegharị dị na Grik na nkọcha miri emi dị n'okwu ndị na-akwa ya emo, n'emeghị ka ihe ọ pụtara bụrụ naanị otu nkọwa ozizi.
- issue: Onye a na-akwa emo
  choice: na-akwa ya emo
  alternative: na-akwa emo
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi na Jizọs bụ onye a na-akwa emo. “Ya” dị mkpa maka Igbo eke, ma ọ naghị etinye ozizi ọzọ n'ihe odide ahụ.
translation_notes:
  register: Asụsụ Igbo izugbe, nke ugbu a ma dị ùgwù. E ji usoro okwu dị mfe mee ka njikọ dị n'etiti ịkwa emo na ịgwa ibe ha okwu doo anya, ebe nkọwa ala peeji na-echekwa mgbagwoju anya dị n'usoro okwu Grik.
