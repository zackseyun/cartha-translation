  text: ὁ δὲ Ἰησοῦς οὐκέτι οὐδὲν ἀπεκρίθη, ὥστε θαυμάζειν τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/005.yaml
  text: But Jesus no longer answered anything[a], so that Pilate was amazed.
translation:
  language: ig
  text: Ma Jizọs azaghịzi ihe ọ bụla[a], nke mere na o juru Paịlet anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ma Jizọs enyeghịzi azịza ọ bụla, nke mere na o juru Paịlet anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị megidere ebubo na ajụjụ ndị gara aga, n’enweghị ime ka mmegide ahụ sie ike karịa ka Grik si kwuo.
- source_word: οὐκέτι
  choice: azaghịkwa
  rationale: Mgbakwunye “-kwa” n’usoro a na-egosi na Jizọs akwụsịla ịza, ya bụ, ọ zaghị ọzọ.
- source_word: οὐδὲν
  choice: ihe ọ bụla
  rationale: N’ahịrịokwu a jụrụ ajụ, “ihe ọ bụla” na-egosi na ọ zaghị otu ihe ma ọlị, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἀπεκρίθη
  choice: azaghị
  rationale: “Ịza” bụ okwu Igbo doro anya ma kwesịkwa ekwesị n’ọnọdụ ajụjụ na ikpe a.
- source_word: ὥστε
  choice: nke mere na
  rationale: Ọ na-egosi ihe si n’ịgbachi nkịtị Jizọs pụta, ọ bụghị naanị ebumnuche.
- source_word: θαυμάζειν
  choice: o juru ... anya
  rationale: Akpaokwu a bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo na mmadụ tụrụ n’anya nke ukwuu.
- source_word: Πιλᾶτον
  choice: Paịlet
  rationale: A sụgharịghị aha onye ahụ; e dere ya n’ụdị a na-ejikarị ede Pilate n’Igbo.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa obere mmegide nke δὲ, echiche nke ịkwụsị ịza dị na οὐκέτι, na nsonaazụ nke ὥστε.
