id: MRK.15.1
reference: Mark 15:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: ig
  text: Ozugbo, n’isi ụtụtụ, ndị isi nchụaja na ndị okenye na ndị odeakwụkwọ, ya na ndị niile so n’ọgbakọ ndị ọchịchị[a], mere nzukọ ndụmọdụ. Ha kegidere Jizọs, duru ya pụọ, nyefee ya n’aka Paịlet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Sanhedrin niile.” Okwu Grik συνέδριον na-ezo aka n’ọgbakọ ọchịchị ndị Juu.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς πρωῒ
  choice: Ozugbo chi bọrọ
  rationale: Nke a na-ejikọta ngwa ngwa nke εὐθύς na oge ụtụtụ nke πρωΐ n'Igbo dị mfe ma dị ndụ; ọ na-egosi na ha mere ihe ahụ n'egbughị oge mgbe chi bọrọ.
- source_word: συμβούλιον ποιήσαντες
  choice: gbara izu
  rationale: Akpaokwu Igbo a na-egosi na ha zukọrọ kparịta ma kwekọọ n'ihe ha ga-eme, kwekọrọ n'idiom Grik nke ime ndụmọdụ.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Ọ na-ezo aka n'òtù ndị ndu n'etiti ndị nchụaja, ọ bụghị ọtụtụ ndị isi nchụaja nọ n'ọkwa otu onye n'otu oge.
- source_word: πρεσβυτέρων
  choice: ndị okenye
  rationale: N'ebe a okwu ahụ bụ aha ndị ndu obodo na okpukpe, ọ bụghị nanị ndị kara nká.
- source_word: γραμματέων
  choice: ndị odeakwụkwọ
  rationale: Nsụgharị ọdịnala a na-ejigide aha ọrụ ahụ; n'ebe a ọ na-ezo aka n'òtù ndị maara ma na-akọwa Iwu.
- source_word: ὅλον τὸ συνέδριον
  choice: ndị niile so nʼọgbakọ ndị ọchịchị
  rationale: Ọ na-akọwa συνέδριον dị ka òtù ọchịchị ndị Juu, kama iji aha a sụgharịghị asụgharị nke ọtụtụ ndị na-agụ Igbo nwere ike ghara ịma.
- source_word: δήσαντες
  choice: kekọtara Jizọs agbụ
  rationale: Ọ na-egosi n'ụzọ doro anya na e ji ihe kee ya tupu e duru ya pụọ.
- source_word: ἀπήνεγκαν
  choice: duru ya pụọ
  rationale: N'ọnọdụ onye nọ n'okpuru ndị nche, nke a bụ Igbo ebumpụta ụwa maka iwepụ ya n'ebe ahụ, na-enweghị ikwu na ha buuru ya.
- source_word: παρέδωκαν
  choice: nyefee ya nʼaka
  rationale: Nke a na-echekwa echiche nke inyefe onye nọ n'okpuru ikike otu ndị n'aka ikike ọzọ.
- source_word: Πιλάτῳ
  choice: Paịlet
  rationale: Ụdị aha a bụ nke a na-aghọta nke ọma n'Igbo maka Πιλᾶτος.
theological_decisions:
- issue: Ihe συνέδριον na-ezo aka na ya
  choice: ọgbakọ ndị ọchịchị
  alternative: Sanhedrin
  rationale: Isi ederede na-akọwa ọrụ òtù ahụ n'Igbo a na-aghọta, ebe ndetu ala na-edebe aha akụkọ ihe mere eme a maara nke ọma.
- issue: Ike παρέδωκαν n'akụkọ ahụhụ Jizọs
  choice: nyefee ya nʼaka Paịlet
  alternative: rara ya nye Paịlet
  rationale: “Nyefee” na-egosi kpọmkwem nnyefe onye mkpọrọ n'aka ọchịchị Rom, na-etinyeghị echiche aghụghọ ma ọ bụ nkọwa nkà mmụta okpukpe karịa ihe amaokwu a kwuru.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ na-eme ka ndị isi nchụaja, ndị okenye, ndị odeakwụkwọ, na ọgbakọ ahụ dum bụrụ ndị sonyere n'ịgba izu; e kewara usoro omume ikpeazụ ka ọ bụrụ Igbo na-aga were were.
