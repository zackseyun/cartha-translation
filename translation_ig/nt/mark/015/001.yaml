- from: Ozugbo chi bọrọ, ndị isi nchụaja na ndị okenye na ndị odeakwụkwọ, ya na ndị niile so nʼọgbakọ ndị ọchịchị[a], gbara izu. Ha kekọtara Jizọs agbụ, duru ya pụọ, nyefee ya nʼaka Paịlet.
  to: Ozugbo, n’isi ụtụtụ, ndị isi nchụaja na ndị okenye na ndị odeakwụkwọ, ya na ndị niile so n’ọgbakọ ndị ọchịchị[a], mere nzukọ ndụmọdụ. Ha kegidere Jizọs, duru ya pụọ, nyefee ya n’aka Paịlet.
