  edition: SBLGNT
  text: Ἦν δὲ ὥρα τρίτη καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/025.yaml
  text: It was the third hour[a], and they crucified him.
translation:
  language: ig
  text: Ọ bụ elekere nke atọ[a], ha wee kpọgide ya n’obe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ihe dị ka elekere itoolu nke ụtụtụ, dịka ụzọ ndị Juu si agụ oge n’oge ahụ.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν
  choice: Ọ bụ
  rationale: Okwu εἰμί n’ụdị imperfect na-egosi oge ma na-akọwa ọnọdụ ahụ; “Ọ bụ” bụ ụzọ Igbo nkịtị si webata oge.
- source_word: δὲ
  choice: wee
  rationale: δέ bụ njikọ dị nro nke na-aga n’ihu n’akụkọ, ọ bụghị nnukwu mmegide; “wee” na-egosi usoro akụkọ ahụ n’Igbo n’enweghị itinye “ugbu a” na-adịghị n’isi mmalite Greek.
- source_word: ὥρα τρίτη
  choice: elekere nke atọ
  rationale: Nke a na-edobe ụdị oge ochie nke isi mmalite kama ịgbanwe ya ozugbo ka ọ bụrụ elekere itoolu nke ụtụtụ.
- source_word: ἐσταύρωσαν
  choice: kpọgide ... n’obe
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị akọwa igbu mmadụ site n’ịkpọgide ya n’obe.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a bụ onye a na-eme ihe, ya bụ Jizọs; “ya” zuru oke n’Igbo.
theological_decisions:
- issue: Otú e si tụgharị oge ahụ n’ihe metụtara usoro oge
  choice: Idobe “elekere nke atọ” n’ahịrịokwu bụ isi.
  alternative: Ịsụgharị ya “ihe dị ka elekere itoolu nke ụtụtụ.”
  rationale: Amaokwu ahụ n’onwe ya ji usoro oge ochie kwuo okwu. Idobe ya na-echekwa ihe isi mmalite kwuru ma zere idozi esemokwu usoro oge ma ọ bụ ịmanye otu nkọwa n’ime ederede.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị mfe nghọta ma nwee nsọpụrụ. “Kpọgide ya n’obe” bụ okwu nkịtị ma doo anya; ihe e dere n’okpuru peeji na-akọwa usoro ịgụ oge ndị Juu n’enweghị ịgbanwe ederede bụ isi.
