  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν πορφύραν καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια ⸂τὰ ἴδια⸃. καὶ ἐξάγουσιν αὐτὸν ἵνα ⸀σταυρώσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/020.yaml
  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: ig
  text: Mgbe ha kwara ya emo, ha yipụrụ ya uwe na-acha odo odo[a], yikwasịkwa ya uwe nke ya. Ha wee kpọpụta ya ka ha kpọgide ya n’obe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “uwe odo odo ahụ” ma ọ bụ “akwa odo odo ahụ.” N’asụsụ Grik, e kwuru naanị “odo odo,” ma ihe gbara ya gburugburu na-egosi na ọ bụ uwe.
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik, nke a bụ nkebiokwu na-egosi nzube: “ka ha wee kpọgide ya n’obe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: kwasịrị ya emo
  rationale: Okwu a na-egosi ịkwa mmadụ emo na ime ya ihe ihere; ntụgharị a bụ nke nkịtị ma dịkwa ùgwù n’Igbo.
- source_word: ἐξέδυσαν αὐτὸν τὴν πορφύραν
  choice: ha yipụrụ ya uwe na-acha odo odo
  rationale: ἐκδύω na-egosi iyipụ mmadụ uwe, ebe πορφύρα pụtara ihe na-acha odo odo ma na-anọchi uwe n’ọnọdụ a.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια τὰ ἴδια
  choice: yikwasịkwa ya uwe nke ya
  rationale: Nke a na-egosi na ha weghachiri ya uwe nke ya mgbe ha yipụrụ ya uwe e ji mee ya eze n’ụzọ ịkwa emo.
- source_word: ἐξάγουσιν
  choice: Ha wee kpọpụta ya
  rationale: Historical present Grik na-eme ka akụkọ dị ndụ; n’Igbo, usoro akụkọ gara aga nke ‘wee kpọpụta’ bụ nke sitere n’okike ma na-echekwa usoro omume ahụ.
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: ka ha kpọgide ya n’obe
  rationale: ἵνα na subjunctive na-egosi nzube; ‘ka ha’ na-echekwa nkebiokwu nzube ahụ nke ọma, ebe ‘kpọgide ya n’obe’ na-akọwa σταυρόω kpọmkwem.
theological_decisions:
- issue: Nkọwa banyere mmechuihu Jizọs tupu a kpọgide ya n’obe
  choice: 'Ịkọ omume ndị ahụ ozugbo: ịkwa ya emo, iyipụ ya uwe odo odo, iyikwasị ya uwe nke ya, na ịkpọpụta ya maka ịkpọgide ya n’obe.'
  alternative: Ịgbakwụnye nkọwa na uwe odo odo ahụ bụ uwe eze ma ọ bụ ịkọwa ihe omume ahụ n’ụzọ ozizi.
  rationale: Amaokwu ahụ bụ akụkọ doro anya. A naghị etinye nkọwa ozizi na-adịghị n’ederede, ma a na-echekwa mmechuihu dị n’omume ndị ahụ.
- issue: ἵνα dị ka nkebiokwu nzube
  choice: ka ha kpọgide ya n’obe
  alternative: ịkpọgide ya n’obe
  rationale: ‘Ka ha’ na-egosipụta nzube dị na Grik n’enweghị idozi ma ọ bụ belata njikọ ahụ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘wee’ mee ka usoro akụkọ dị n’Igbo bụrụ nke sitere n’okike, ebe a chekwara nzube nke ἵνα site na ‘ka ha.’
