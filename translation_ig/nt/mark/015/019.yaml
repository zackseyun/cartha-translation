  text: καὶ ἔτυπτον αὐτοῦ τὴν κεφαλὴν καλάμῳ καὶ ἐνέπτυον αὐτῷ, καὶ τιθέντες τὰ γόνατα προσεκύνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: ig
  text: Ha nọkwa na-eji amị eti ya n’isi, na-agbụ ya ọnụ mmiri; ha na-egbukwa ikpere n’ala na-akpọ isiala nye ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-efe ya ofufe.” Okwu Grik a nwere ike ịpụta ịkpọ isiala n’ihu mmadụ, inye ya nsọpụrụ, ma ọ bụ ife ya ofufe; ma n’ebe a, ọ na-akọwa otú ndị agha si eme ka à ga-asị na ha na-enye eze nsọpụrụ, iji kwaa ya emo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: nọkwa na-eji … eti
  rationale: Oge imperfect na-egosi omume a na-eme ugboro ugboro ma ọ bụ na-aga n’ihu; usoro a na-egosipụta nke ahụ n’Igbo nkịtị.
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: ya n’isi
  rationale: Nke a bụ ụzọ Igbo si egosipụta ihe onye nwe ya n'ụzọ dị mfe ma bụrụkwa eke.
- source_word: καλάμῳ
  choice: ahịhịa amị
  rationale: κάλαμος bụ amị ma ọ bụ mkpara e ji amị mee; ‘ahịhịa amị’ na-edobe ụdị ihe ahụ n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: ἐνέπτυον αὐτῷ
  choice: na-agbụ ya ọnụ mmiri
  rationale: Nke a bụ okwu Igbo doro anya maka ịgbụ mmadụ ọnụ mmiri; usoro na- na-egosikwa omume na-aga n’ihu ma ọ bụ a na-eme ugboro ugboro.
- source_word: τιθέντες τὰ γόνατα
  choice: na-egbukwa ikpere n’ala
  rationale: Nkebi Grik ahụ pụtara n'ụzọ okwu n’ụzọ okwu ‘itinye ikpere’; ‘igbu ikpere n’ala’ bụ akpaalaokwu Igbo eke maka ikpere n’ala.
- source_word: προσεκύνουν
  choice: na-akpọ isiala nye ya
  rationale: προσκυνέω nwere ike ịpụta ịkpọ isiala, ịsọpụrụ dịka eze, ma ọ bụ ife ofufe. N’ọnọdụ a ndị agha na-eme ihe nlelị yiri nsọpụrụ eze; ‘ịkpọ isiala’ na-edobe mmegharị ahụ na nghọta ahụ n’enweghị ikwu na ofufe ha bụ ezi ofufe.
- source_word: αὐτῷ
  choice: nye ya
  rationale: Dative a so προσκυνέω na-apụta nke ọma n’Igbo dịka ‘nye ya.’
theological_decisions:
- issue: Otú e si sụgharịta προσκυνέω n’ọnọdụ ịkwa emo
  choice: na-akpọ isiala nye ya
  alternative: na-efe ya ofufe
  rationale: Ndị agha ahụ na-eme nsọpụrụ eze n’ụzọ ịkwa emo, ọ bụghị ofufe sitere n’obi. Nhọrọ a na-edobe ihe omume ahụ na ilu dị n’akụkọ ahụ, ebe ndetu ala peeji na-echekwa ihe ọzọ okwu Grik ahụ nwekwara ike ịpụta.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji usoro na- gosi omume ndị a na-eme ugboro ugboro ma ọ bụ na-aga n’ihu; e chekwara nghọtahie okwu προσκυνέω site na ndetu ala peeji.
