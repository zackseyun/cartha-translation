  rationale: The sole revision replaces the collective expression “ahịhịa amị” with “amị” to match the singular reed in the source and to improve natural precision in Standard Igbo. The rendering of the repeated abuse, the mock kneeling, and the lexical footnote for προσεκύνουν are retained.
