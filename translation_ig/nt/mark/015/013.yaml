  yaml_path: translation/nt/mark/015/013.yaml
  text: But they cried out again, “Crucify him!”
translation:
  language: ig
  text: Ma ha tiri mkpu ọzọ, sị, “Kpọgide ya n’obe!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: ha
  rationale: Artikụl ọtụtụ a ji arụ ọrụ dị ka nnọchiaha, na-ezo aka n’ìgwè ndị a kpọtụrụla aha n’okwu gbara ya gburugburu.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị nwere ọdịiche n’azịza ha nye okwu Paịlet kwuru tupu nke a.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na ha mereghachiri mkpu ahụ; “ọzọ” bụ ụzọ Igbo dị mfe ma kwekọọ n’ihe odide ahụ.
- source_word: ἔκραξαν
  choice: tikwara mkpu
  rationale: Ngwaa ahụ pụtara iti mkpu n’olu dara ụda; “tikwara mkpu” na-ejigide ike na nkwughachi ahụ n’Igbo nkịtị.
- source_word: Σταύρωσον
  choice: Kpọgide
  rationale: Ọ bụ iwu kpọmkwem e nyere otu onye, ya bụ Paịlet. “Kpọgide ... n’obe” bụ okwu Igbo doro anya maka igbu mmadụ site n’obe, n’ebughị ụzọ mee iwu ahụ ka ọ bụrụ nke na-apụtachaghị ìhè.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha ihe a na-eme ihe, na-ezo aka na Jizọs.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọdịiche nke “Ma,” nkwughachi nke “ọzọ,” na ike nke iwu ìgwè ahụ nyere.
