- from: Mgbe ọ zụtasịrị ákwà lìnen[a], o buturu ya, kechie ya n’ákwà lìnen ahụ, wee dọba ya n’ili e gwupụtara n’oké nkume[b]. Mgbe ahụ, ọ nyịgharịtara otu nkume mechie ọnụ ụzọ ili ahụ[c].
  to: Mgbe ọ zụtasịrị ákwà linen[a], o budatara ya, kechie ya n’ákwà linen ahụ, wee dọba ya n’ili e wara n’oké nkume[b]. Mgbe ahụ, ọ nyịgharịrị otu nkume n’ọnụ ụzọ ili ahụ[c].
  rationale: E dochiri ‘buturu’ anya na ‘budatara’ ka o gosipụta omume ibudata n’obe. E wepụrụ ‘mechie,’ ebe ọ bụ nkọwa e si n’ọnọdụ ahụ ghọta karịa ihe ngwaa Grik kwuru, ma debe omume ịnyịgharị nkume n’ọnụ ụzọ. E dochikwara ‘e gwupụtara’ anya na ‘e wara’ n’ahịrịokwu bụ isi iji gosipụta ili a kpụpụtara n’oké nkume.
