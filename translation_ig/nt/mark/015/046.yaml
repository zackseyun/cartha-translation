source:
  edition: SBLGNT
  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: ig
  text: Mgbe ọ zụtasịrị ákwà linen[a], o budatara ya, kechie ya n’ákwà linen ahụ, wee dọba ya n’ili e wara n’oké nkume[b]. Mgbe ahụ, ọ nyịgharịrị otu nkume n’ọnụ ụzọ ili ahụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “ákwà linen sara mbara” ma ọ bụ “ákwà e ji eli ozu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “n’ili e gwupụtara n’oké nkume.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ “n’ọnụ mbata ili ahụ”; okwu Grik ahụ nwere ike ịpụta “ọnụ ụzọ” ma ọ bụ “ọnụ mbata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: ákwà lìnen / ákwà lìnen ahụ
  rationale: Nke a na-egosi ụdị ákwà e ji lìnen mee, nke e ji kechie ozu n’ọnọdụ a; ọ naghị akpọ ya kpọmkwem ákwà olili karịa ihe Grik kwuru.
- source_word: καθελὼν αὐτόν
  choice: o buturu ya
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara ibutu Jizọs n’obe; Igbo a dị nkenke ma doo anya n’usoro akụkọ ahụ.
- source_word: ἐνείλησεν
  choice: kechie ya
  rationale: ‘Kechie’ na-egosi ikpuchi ma ọ bụ ịfụkọta mmadụ n’ákwà n’enweghị ịgbakwụnye nkọwa na-adịghị n’ihe odide ahụ.
- source_word: ἔθηκεν αὐτόν
  choice: dọba ya
  rationale: ‘Dọba’ bụ okwu Igbo kwesịrị ekwesị ma dị ùgwù maka itinye ozu n’ili.
- source_word: μνημείῳ / μνημείου
  choice: ili / ili ahụ
  rationale: N’ebe a μνημεῖον bụ ebe e liri mmadụ, karịchaa ili a wara n’oké nkume; ‘ili’ bụ okwu Igbo nkịtị ma ziri ezi.
- source_word: λελατομημένον ἐκ πέτρας
  choice: e gwupụtara n’oké nkume
  rationale: Nke a na-egosi na e warala ma ọ bụ gwupụta ili ahụ n’ime nkume, dịka participle perfect passive si egosi ọnọdụ ihe arụcharala.
- source_word: προσεκύλισεν λίθον
  choice: ọ nyịgharịtara otu nkume
  rationale: ‘Nyịgharịtara’ na-egosi ibugharị nkume site n’ịkpọgharị ya ruo n’ọnụ ili.
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: mechie ọnụ ụzọ ili ahụ
  rationale: N’ọnọdụ a, ịnyịgharị nkume ruo n’ọnụ ụzọ ili bụ imechi ya; ‘ọnụ ụzọ’ na-edobe ohere θύρα nwere ịbụ ụzọ ma ọ bụ oghere mbata.
- source_word: ἀγοράσας
  choice: Mgbe ọ zụtasịrị
  rationale: Nke a na-egosi na ịzụ ákwà ahụ buru ụzọ tupu omume ndị ọzọ, dịka aorist participle si eme.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro omume ndị dị n’ahịrịokwu Grik, ma jiri njikọ Igbo mee ka ọ na-aga were were. Akara ụda olu e tinyere na ‘ákwà lìnen’ na-enyere aka izere mgbagwoju anya, ebe apostrophe Unicode dị na n’ákwà na n’oké.
