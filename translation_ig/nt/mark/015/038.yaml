  yaml_path: translation/nt/mark/015/038.yaml
  text: And the curtain of the temple was torn in two[b][a], from top to bottom.
translation:
  language: ig
  text: Na ákwà mgbochi[a] nke ụlọ nsọ[b] dọwara ụzọ abụọ, site n’elu ruo n’ala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ákwà mkpuchi.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a pụrụ izo aka kpọmkwem n’ebe nsọ dị n’ime ụlọ nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταπέτασμα
  choice: ákwà mgbochi
  rationale: Nke a na-egosi ákwà e ji kpuchie ma ọ bụ kewaa ebe dị n’ime ụlọnsọ ukwu. “Ákwà mgbochi” bụ okwu Igbo doro anya ma na-echekwa ihe a na-ahụ anya n’amaokwu ahụ.
- source_word: ναοῦ
  choice: nke ụlọnsọ ukwu
  rationale: ναός pụrụ izo aka kpọmkwem n’ebe nsọ dị n’ime ụlọ nsọ, ma “ụlọnsọ ukwu” bụ okwu a maara nke ọma ma dị mfe nghọta; nkọwa ala peeji na-echekwa nkọwa ya nke kapịrị ọnụ.
- source_word: ἐσχίσθη
  choice: dọwara
  rationale: Ụdị ngwaa a na-egosi na ákwà ahụ natara omume ịdọwa. N’Igbo, “dọwara” na-akọ ihe ahụ n’ụzọ dị ndụ ma dị mfe, n’enweghị ịkọ onye mere ya.
- source_word: εἰς δύο
  choice: abụọ
  rationale: “Dọwara abụọ” bụ usoro okwu Igbo sitere n’okike nke na-egosi na e kewara ákwà ahụ ụzọ abụọ.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: site n’elu ruo n’ala
  rationale: Nke a na-echekwa ụzọ na oke ịdọwa ahụ, site n’akụkụ elu ya ruo n’akụkụ ala ya.
- source_word: καὶ
  choice: Mgbe ahụ
  rationale: N’akụkọ Igbo, “Mgbe ahụ” na-ejikọta ihe a na ihe mere tupu ya nke ọma. Ọ na-arụ ọrụ dịka njikọ akụkọ ebe καί ji gaa n’ihu n’usoro ihe omume.
theological_decisions:
- issue: Ihe ịdọwa ákwà mgbochi ụlọnsọ ukwu pụrụ ịpụta n’ụzọ ime mmụọ
  choice: Ịkọ naanị ihe mere, n’enweghị ịkọwa ihe nnọchianya ya n’amaokwu bụ isi.
  alternative: Ịsị na ọ pụtara na ụzọ ịbịakwute Chineke emegheworo, ma ọ bụ na ọ bụ ikpe e kpere usoro ụlọnsọ ukwu.
  rationale: Amaokwu ahụ n’onwe ya na-akọ ihe mere, ma ọ kọwaghị ihe ọ pụtara n’ụzọ nkà mmụta okpukpe. Nsụgharị ahụ kwesịrị ịhapụ esemokwu na nkọwa dị iche iche ka ha dị.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere akara nkọwa n’usoro [b][a] dịka ha dị n’ederede ntụnyere Bekee, ma a na-enye nkọwa abụọ ahụ n’enweghị ịtinye nkọwa ozizi n’ime amaokwu.
