  text: ὁ δὲ Ἰησοῦς ἀφεὶς φωνὴν μεγάλην ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/037.yaml
  text: But Jesus[a], uttering a loud cry[b], breathed his last.
translation:
  language: ig
  text: Ma Jizọs tiri nnukwu mkpu[a], kubie ume.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mkpu dị ukwuu” ma ọ bụ “mkpu n’olu dara ụda.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nwụọ”; n’ụzọ nkịtị, “kupụrụ ume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: δὲ bụ njikọ dị nro; “Ma” na-egosi ntụgharị dị mkpa n’akụkọ ahụ n’ụzọ Igbo na-ada nke ọma, n’agbanyeghị na a pụkwara ịsụgharị ya “Mgbe ahụ” ma ọ bụ hapụ ya n’ụfọdụ ọnọdụ.
- source_word: ἀφεὶς
  choice: tiri
  rationale: Mgbe ἀφίημι jikọtara ya na φωνή n’ebe a, ọ pụtara iwepụta ụda. Akpaalaokwu Igbo “iti mkpu” na-enye echiche ahụ n’ụzọ doro anya ma dị ndụ.
- source_word: φωνὴν μεγάλην
  choice: mkpu n’olu dara ụda
  rationale: φωνή nwere ike ịbụ “olu,” “ụda,” ma ọ bụ “mkpu,” ebe μεγάλην na-egosi ịdị ukwuu ma ọ bụ ike. N’ọnọdụ a, “mkpu n’olu dara ụda” na-egosipụta mkpu siri ike a nụrụ nke ọma.
- source_word: ἐξέπνευσεν
  choice: kubie ume
  rationale: ἐκπνέω pụtara n’ụzọ nkịtị ikupụ ume, ma n’ebe a ọ bụ akpaalaokwu maka ịnwụ. “Kubie ume” bụ ụzọ Igbo dị ùgwù ma bụrụkwa nke nkịtị isi kwuo na mmadụ nwụrụ, ma ọ ka na-echekwa oyiyi ume dị n’okwu Grik.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Ma Jizọs
  rationale: Edemede aha ahụ dị n’asụsụ Grik anaghị achọ okwu pụrụ iche n’Igbo; a na-enye δὲ site na “Ma,” ebe “Jizọs” bụ isiokwu ahịrịokwu ahụ.
theological_decisions:
- issue: Ikwupụta ọnwụ Jizọs n’etinyeghị nkọwa nkà mmụta okpukpe ọzọ
  choice: kubie ume
  alternative: nwụọ; nyefee mmụọ ya
  rationale: “Kubie ume” na-egosipụta ma ọnwụ ahụ ma oyiyi iku ume dị na ἐξέπνευσεν. “Nyefee mmụọ ya” nwere ike ibubata okwu na echiche sitere n’akụkụ Oziọma ndị ọzọ, ya mere ahọrọghị ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. “Tiri mkpu n’olu dara ụda” bụ akpaalaokwu nkịtị; “kubie ume” na-ejigide ịdị nsọ na ịdị mkpụmkpụ nke akụkọ ahụ.
