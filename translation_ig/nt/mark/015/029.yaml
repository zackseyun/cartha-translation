  source_fidelity: 'The translation accurately represents the Greek: the ongoing actions of passersby, their reviling of Jesus, the derisive head movement, the taunting exclamation, and the temple saying are all retained. “Ga-akwatu ... ma wuo” appropriately conveys the reported, mocking force of the participial description without importing an interpretation of the saying.'
