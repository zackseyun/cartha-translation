id: MRK.15.29
reference: Mark 15:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ οἱ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν καὶ λέγοντες· Οὐὰ ὁ καταλύων τὸν ναὸν καὶ ⸂οἰκοδομῶν ἐν τρισὶν ἡμέραις⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/029.yaml
  text: And those passing by were reviling him[a], shaking their heads and saying[b], “Aha! You who would tear down the temple and build it in three days,”
translation:
  language: ig
  text: Ndị na-agafe ebe ahụ nọ na-ekwujọ ya, na-efufe isi ha ma na-ekwu, “Haa! Gị onye ga-akwatu ụlọnsọ ukwu[a] ma wuo ya n’ime ụbọchị atọ[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kapịrị ọnụ, “ebe nsọ dị n’ime ụlọnsọ ukwu ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “wughachi ya n’ime ụbọchị atọ.” Ngwaa Grik ahụ pụtara nanị “wuo,” ọ bụ ezie na ihe gbara okwu ahụ gburugburu nwere ike igosi iwughachi.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: Ndị na-agafe ebe ahụ
  rationale: Nke a na-egosi ndị nọ na-agafe ebe a kpọgidere Jizọs, ma na-echekwa omume ahụ na-aga n’ihu.
- source_word: ἐβλασφήμουν
  choice: nọ na-ekwujọ ya
  rationale: N’ebe a, okwu ahụ pụtara ịkatọ na ịkparị Jizọs n’okwu; “ikwujọ” na-egosi okwu mkparị ahụ n’enweghị ịmanye naanị nghọta okpukpe pụrụ iche.
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: na-efufe isi ha
  rationale: Nke a bụ ụzọ Igbo dị ndụ si egosi mmegharị isi nke ịkwa emo na nlelị.
- source_word: Οὐὰ
  choice: Haa!
  rationale: Mkpu a na-egosipụta ịkwa emo na mkparị dị n’okwu ndị na-agafe agafe.
- source_word: ὁ καταλύων
  choice: Gị onye ga-akwatu
  rationale: Akụkụ aha na participle ahụ na-arụ ọrụ dị ka ịkpọ mmadụ okwu ozugbo; “ga-akwatu” na-echekwa ụdị ebubo ha na-atụ ya.
- source_word: ναὸν
  choice: ụlọnsọ ukwu
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ụlọ nsọ ahụ; nkọwa ala peeji na-echekwa ohere na okwu Grik ahụ nwere ike ịrụtụ aka kpọmkwem n’ebe nsọ dị n’ime ya.
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: ma wuo ya n’ime ụbọchị atọ
  rationale: “Wuo” sụgharịrị ngwaa Grik ahụ kpọmkwem; “n’ime ụbọchị atọ” na-egosi oge e kwuru, ebe nkọwa ala peeji na-echekwa nghọta nwere ike ịbụ iwughachi.
theological_decisions:
- issue: Ihe okwu banyere ụlọnsọ ukwu ahụ na-arụtụ aka na ya
  choice: A sụgharịrị okwu ndị na-akwa emo dịka ebubo ha kwuru, n’etinyeghị n’ahịrịokwu ahụ nkọwa na ụlọnsọ ukwu ahụ bụ ahụ Jizọs.
  alternative: Ịsụgharị ya n’ụzọ ga-egosi ozugbo na Jizọs na-ekwu maka ahụ ya.
  rationale: Mak na-akọ okwu ịkwa emo nke ndị nọ n’ebe a kpọgidere Jizọs. Nsụgharị kwesịrị ichekwa ọnọdụ akụkọ ahụ na esemokwu nkà mmụta okpukpe ya, kama idozi ihe okwu ahụ pụtara site n’iwebata nkọwa sitere n’ebe ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, mee ihe. A họọrọ “nọ na-ekwujọ” iji gosipụta imperfect Grik na okwu mkparị na-aga n’ihu; “na-efufe isi” bụ okwu Igbo eke maka mmegharị isi nke ịkwa emo.
