  terminology: “Ụlọnsọ ukwu” is an intelligible rendering of ναός in context. The first footnote responsibly preserves the more specific sense of the sanctuary proper. The second accurately explains that the Greek says “build,” while allowing that “rebuild” may be inferred from context.
