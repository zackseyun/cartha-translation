revisions:
- from: Josef onye Arimatia, onye a na-akwanyere ùgwù n'ime ndị òtù kansụl[a], onye ya onwe ya na-echekwa alaeze Chineke, ji obi ike baa n'ihu Paịlet[b] rịọ ya ka o nye ya ozu Jizọs.
  to: Josef, onye si Arimatia, bụ onye òtù kansụl a na-akwanyere ùgwù, onye ya onwe ya kwa nọ na-atụ anya alaeze Chineke[a]. Ọ bịara, jirikwa obi ike banye n'ebe Paịlet nọ ma rịọ Paịlet ka o nye ya ozu Jizọs[b].
  rationale: The revision restores the sense of ἐλθών with “Ọ bịara,” renders entry into Pilate’s presence explicitly and idiomatically, and smooths the descriptions of Joseph and his council status. It retains the source’s emphasis that Joseph himself was awaiting God’s kingdom and that he courageously requested Jesus’ body. Footnote markers are retained and placed at their relevant clauses.
