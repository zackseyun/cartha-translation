id: MRK.15.43
reference: Mark 15:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: ig
  text: Josef, onye si Arimatia, bụ onye òtù kansụl a na-akwanyere ùgwù, onye ya onwe ya kwa nọ na-atụ anya alaeze Chineke[a]. Ọ bịara, jirikwa obi ike banye n'ebe Paịlet nọ ma rịọ Paịlet ka o nye ya ozu Jizọs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye òtù kansụl a ma ama” ma ọ bụ “onye òtù kansụl nwere ugwu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mgbe o nwesịrị obi ike, ọ banyere n'ebe Paịlet nọ”; okwu Grik ahụ na-eme ka obi ike Josef n'ịgakwuru Paịlet pụta ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: (etinyere echiche ya n'ime “baa n'ihu”)
  rationale: Ọ bụ participle aorist nke na-ebute isi omume. N'Igbo, ikwughachi “bịa” tupu “baa” ga-ada arọ; ngwaa ngagharị “baa n'ihu” na-eburu echiche ọbịbịa ahụ n'ụzọ ebumpụta ụwa.
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: onye Arimatia
  rationale: Ụzọ Igbo dị mkpirikpi ma doo anya isi gosi ebe Josef si, kwekọrọ n'echiche ἀπό.
- source_word: εὐσχήμων
  choice: onye a na-akwanyere ùgwù
  rationale: Nke a na-egosi na ọ bụ onye nwere ọnọdụ ọma na nsọpụrụ n'etiti ọha, n'asụsụ Igbo nke ndị mmadụ na-aghọta ngwa ngwa.
- source_word: βουλευτής
  choice: onye ... n'ime ndị òtù kansụl
  rationale: Ọ na-egosi onye so n'òtù na-achị ndụmọdụ, ma ọ naghị akpọ Sanhedrin aha kpọmkwem.
- source_word: ὃς καὶ αὐτὸς
  choice: onye ya onwe ya na-echekwa
  rationale: '“Ya onwe ya” na “-kwa” jikọtara ọnụ na-echekwa nkwusi ike nke καὶ αὐτός: Josef n''onwe ya sokwa na ndị na-atụ anya ya.'
- source_word: ἦν προσδεχόμενος
  choice: na-echekwa
  rationale: Ụdị omume na-aga n'ihu na Igbo na-egosi na nke a bụ atụmanya Josef nọgidere na-enwe.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Ntụgharị kwụ ọtọ, nke a maara nke ọma, maka okwu bụ isi a n'Oziọma.
- source_word: τολμήσας
  choice: ji obi ike
  rationale: Ọ na-ebupụta obi ike Josef nwere mgbe ọ gara n'ihu Paịlet, n'enweghị usoro participle ga-ada arọ n'Igbo.
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: baa n'ihu Paịlet
  rationale: Nke a na-echekwa echiche nke ịbanye ebe Paịlet nọ na ịbịaru ya nso, ma na-ada ebumpụta ụwa n'Igbo.
- source_word: ᾐτήσατο
  choice: rịọ ya ka o nye ya
  rationale: Nke a na-egosi nke ọma na Josef rịọrọ Paịlet ka o nye ya ihe ahụ, ma na-eme ka ihe nnọchiaha ndị dị n'ahịrịokwu doo anya.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: ozu Jizọs
  rationale: N'ọnọdụ a, Jizọs anwụọla; “ozu” bụ okwu Igbo ebumpụta ụwa ma kpọmkwem maka ahụ onye nwụrụ anwụ.
theological_decisions:
- issue: Njirimara na ọnọdụ Josef dịka βουλευτής
  choice: onye so n'ime ndị òtù kansụl
  alternative: onye Sanhedrin
  rationale: Okwu Grik na-ekwu naanị na ọ bụ onye kansụl; ọ bụ ezie na ihe gbara ya gburugburu nwere ike igosi kansụl ndị Juu, amaokwu ahụ akpọghị Sanhedrin aha.
- issue: Ike okwu τολμήσας
  choice: ji obi ike baa n'ihu Paịlet
  alternative: mgbe o nwesịrị obi ike, ọ banyere n'ihu Paịlet
  rationale: Nhọrọ a na-echekwa nkwusi ike na obi ike Josef ma na-enye ahịrịokwu Igbo dị larịị.
- issue: Ihe σῶμα pụtara n'ọnọdụ ọnwụ Jizọs
  choice: ozu Jizọs
  alternative: ahụ Jizọs
  rationale: “Ozu” na-egosi kpọmkwem na ọ bụ ahụ onye nwụrụ anwụ, dịka ọnọdụ akụkọ ahụ si dị, n'ebughị ozizi ọzọ bata.
translation_notes:
  register: Standard Igbo; asụsụ dị ùgwù ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. E ji “kansụl” mee ihe n'ihi na ọ bụ okwu a na-anụkarị, ma e zere ịkpọ òtù ahụ Sanhedrin ebe Grik akpọghị ya otú ahụ. E debere akara ntụaka ụkwụ niile n'ahịrịokwu isi.
