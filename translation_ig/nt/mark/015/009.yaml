  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: ig
  text: Ma Paịlet zara ha, sị, “Ụnụ chọrọ ka m tọhapụ unu Eze ndị Juu?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “eze ndị Judia.” Okwu Grik bụ Ἰουδαίων nwere ike ịpụta “ndị Juu” ma ọ bụ “ndị Judia,” ma n’aha a e ji eme ihe n’akụkọ ahụhụ Jizọs, “ndị Juu” bụ ntụgharị ọdịnala nke dabara n’ọnọdụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche n’ihe a na-akọ, n’ụzọ dabara adaba n’Igbo.
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: zara ha, sị
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa eke isi gosi na Paịlet zara ha ma kwuo okwu; ọ na-echekwa echiche nke nzaghachi na participle λέγων n’enweghị nkwugharị siri ike.
- source_word: Θέλετε
  choice: Ụnụ chọrọ
  rationale: θέλω ebe a na-egosi ọchịchọ; ‘chọrọ’ bụ okwu Igbo nke oge a, doro anya ma kwekọọ n’ajụjụ ahụ.
- source_word: ἀπολύσω ὑμῖν
  choice: ka m tọhapụrụ unu
  rationale: N’ọnọdụ ikpe a, ἀπολύω pụtara ịhapụ onye mkpọrọ ka ọ nwere onwe ya; ‘tọhapụrụ unu’ na-egosikwa ndị a ga-emere ihe ahụ.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: Eze ndị Juu
  rationale: Ọ bụ aha ọchịchị a na-eji n’akụkọ ahụ. ‘Ndị Juu’ bụ ntụgharị a maara nke ọma ma dabara n’aha a, ebe mkpụrụokwu Grik nwekwara ike ịpụta ndị Judia.
theological_decisions:
- issue: Ntughari aha τὸν βασιλέα τῶν Ἰουδαίων
  choice: Eze ndị Juu
  alternative: eze ndị Judia
  rationale: Aha a nwere ụda ndọrọ ndọrọ ọchịchị na nke ịkwa emo n’akụkọ ahụ; ntụgharị ahụ anaghị etinye nkwupụta okwukwe nke onye ntụgharị. A họọrọ ‘ndị Juu’ n’ihi na ọ bụ ụdị aha a maara nke ọma ma dabara n’ọnọdụ a, ma e debere nhọrọ lexical ọzọ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. ‘zara ha, sị’ bụ usoro okwu Igbo eke; ‘tọhapụrụ’ na-echekwa ọnọdụ ikpe na ịhapụ onye mkpọrọ. E dere ‘Eze’ na mkpụrụedemede ukwu dịka akụkụ nke aha ọchịchị a kpọrọ Jizọs n’okwu Paịlet.
