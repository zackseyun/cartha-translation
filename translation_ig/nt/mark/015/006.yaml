  text: Κατὰ δὲ ἑορτὴν ἀπέλυεν αὐτοῖς ἕνα δέσμιον ⸂ὃν παρῃτοῦντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/006.yaml
  text: At the feast he would release for them one prisoner whom they asked for[a].
translation:
  language: ig
  text: N’oge ememme ahụ, ọ na-ahapụ ha otu onye mkpọrọ ha rịọrọ ka a hapụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu onye mkpọrọ ha rịọrọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: N’oge Ememme Ngabiga
  rationale: κατά na accusative na-egosi oge a na-eme ihe dịka omenala. N’ebe a, ἑορτή na-ezo aka n’Ememme Ngabiga nke amaokwu ndị gbara ya gburugburu mere ka o doo anya; ịkpọ ya aha na-eme ka Igbo bụrụ nke doro anya ma dịrị ndị na-agụ ya mfe.
- source_word: ἀπέλυεν
  choice: ọ na-ahapụụrụ
  rationale: Imperfect a na-egosi ihe ọ na-emebu, ọ bụghị nanị otu ihe mere n’otu oge. Usoro ‘ọ na-...’ na Igbo na-egosipụta omume a na-eme dịka omenala.
- source_word: αὐτοῖς
  choice: ha
  rationale: Dative a na-egosi ndị a na-emere ihe ahụ; suffix ‘-ụrụ’ n’ahapụụrụ na ‘ha’ na-egosipụta na ọ bụ maka uru ha.
- source_word: ἕνα δέσμιον
  choice: otu onye mkpọrọ
  rationale: ‘Otu’ na-echekwa ọnụọgụ ἕνα kpọmkwem, ebe ‘onye mkpọrọ’ bụ okwu Igbo kwesịrị ekwesị maka δέσμιος n’ọnọdụ ikpe a.
- source_word: ὃν παρῃτοῦντο
  choice: ha rịọrọ ka a hapụ
  rationale: παραιτέομαι pụtara ịrịọ maka mmadụ ma ọ bụ ihe. N’Igbo, ‘rịọrọ ka a hapụ’ na-ekwupụta ihe ha chọrọ n’ụzọ eke ma na-ezere mgbagwoju anya nke ‘onye ha rịọrọ.’
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere echiche nke omume a na-emebu site n’usoro ‘ọ na-ahapụụrụ.’ Akara nkọwa ala peeji [a] dị n’ahịrị isi dịka achọrọ.
