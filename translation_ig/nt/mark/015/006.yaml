- from: N’oge Ememme Ngabiga, ọ na-ahapụụrụ ha otu onye mkpọrọ ha rịọrọ ka a hapụ.[a]
  to: N’oge ememme ahụ, ọ na-ahapụ ha otu onye mkpọrọ ha rịọrọ ka a hapụ.[a]
  rationale: Removed the unsupported explicit identification of the feast as Passover, while retaining the definite, contextually known feast. The revised wording preserves the habitual action, the single prisoner, and the sense that the people requested that prisoner’s release. The footnote has been clarified so that its alternative remains natural and unambiguous in Igbo.
