base_translation:
  language: en
  yaml_path: translation/nt/mark/015/030.yaml
  text: Save yourself[a], coming down from the cross!
translation:
  language: ig
  text: Zọpụta onwe gị[a], si n’obe ahụ rịdata!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ na-eso usoro okwu Grik nso karị: “Zọpụta onwe gị site n’isi n’obe ahụ rịdata,” ma ọ bụ, “Zọpụta onwe gị mgbe i si n’obe ahụ rịdata.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶσον
  choice: Zọpụta
  rationale: Ngwaa a bụ iwu aorist e nyere otu onye. “Zọpụta” bụ okwu Igbo doro anya nke na-echekwa ma ihe ịnapụta mmadụ n’ọnwụ pụtara ma njikọ ya na echiche nzọpụta, n’emeghị ka ọ bụrụ naanị ịgbapụ n’ihe mgbu.
- source_word: σεαυτόν
  choice: onwe gị
  rationale: Nnọchiaha nlọghachi a bụ ihe σῶσον na-emetụta kpọmkwem; “onwe gị” na-echekwa ike nke okwu ịkwa emo ahụ.
- source_word: καταβάς
  choice: si … rịdata
  rationale: Nke a bụ participle aorist active nke καταβαίνω. N’Igbo, ijikọta ya na iwu ahụ dị ka omume so ya—“si … rịdata”—dị eke ma na-ezere ahịrịokwu participle siri ike nke na-adịghị ada ka Igbo ugbu a.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: n’obe ahụ
  rationale: “Si n’obe ahụ rịdata” na-egosi ngagharị pụọ n’obe ahụ n’ụzọ Igbo nkịtị; “obe” bụ okwu a na-ejikarị asụgharị σταυρός n’akụkọ ahụhụ Jizọs.
theological_decisions:
- issue: Mmekọrịta participle καταβάς na iwu σῶσον
  choice: 'E gosipụtara ya dị ka omume so iwu ahụ: “Zọpụta onwe gị, si n’obe ahụ rịdata!”'
  alternative: “Zọpụta onwe gị site n’ịsi n’obe ahụ rịdata!” ma ọ bụ “Zọpụta onwe gị mgbe i si n’obe ahụ rịdata!”
  rationale: Asụsụ Grik ahụ nwere otu iwu na participle aorist, ma mmekọrịta ha nwere ike ịbụ ụzọ e si eme ihe, omume so ya, ma ọ bụ omume bu ụzọ. Nsụgharị bụ isi na-ada nke ọma n’Igbo ma na-echekwa mkparị ahụ; nkọwa ala peeji na-edobe ihe ndị ọzọ syntax ahụ nwere ike ịpụta, n’etinyeghị instrumental ma ọ bụ temporal nuance n’ahịrị bụ isi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke doro anya ma nwee ugwu, sụgharịa ya. “Si n’obe ahụ rịdata” bụ usoro okwu nkịtị n’Igbo ma na-edobe ụda iwu na ịkwa emo nke ndị na-ekwu okwu ahụ.
