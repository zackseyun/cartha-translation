translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị nsọ n’ụda; a họọrọ usoro “nọ na-ebo” iji gosipụta omume na-aga n’ihu, ebe “banyere ọtụtụ ihe” na-ezere ịkọwapụta πολλά karịa ihe Grik kwuru.
