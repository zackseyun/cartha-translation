  text: And the chief priests were accusing him of many things[a].
translation:
  language: ig
  text: Ndị isi nchụàjà nọkwa na-ebo ya ebubo n’ọtụtụ ihe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ebo ya ọtụtụ ebubo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” jikọtara amaokwu a na akụkọ bu ya ụzọ ma chekwaa njikọ dị mfe nke Mak.
- source_word: κατηγόρουν
  choice: nọ na-ebo ... ebubo
  rationale: Ụdị imperfect na-egosi omume gara n’ihu ma ọ bụ e mere ugboro ugboro n’oge gara aga; “nọ na-ebo” na-egosipụta nke a n’Igbo eke.
- source_word: αὐτοῦ
  choice: ya
  rationale: Genitive a na-egosi onye a na-ebo ebubo; n’usoro Igbo, “ibo ya ebubo” na-egosipụta ihe ahụ nke ọma.
- source_word: οἱ ἀρχιερεῖς
  choice: Ndịisi nchụaja
  rationale: Nke a na-ezo aka n’ọchịchị ndị ndu nchụaja, ọ bụghị ọtụtụ ndị ji otu ọkwa onyeisi nchụaja n’otu oge.
- source_word: πολλά
  choice: banyere ọtụtụ ihe
  rationale: Nke a na-echekwa obosara okwu Grik ahụ n’etinyeghị nkọwa iwu pụrụ iche dịka “ọtụtụ ebubo iwu.”
