  text: ἡ δὲ Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ Ἰωσῆτος⸃ ἐθεώρουν ποῦ ⸀τέθειται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: ig
  text: Meri Magdalin na Meri nne Joses nọ na-ele ebe e debere ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ka dị nso n’okwu Grik, “Meri nke Joses.” Okwu Grik ji mmekọrịta ya na Joses amata Meri a.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: N’ebe a, δέ bụ njikọ dị nro nke na-aga n’ihu n’akụkọ olili ahụ; “Ma” bụ ụzọ Igbo si jikọta ahịrịokwu a nke ọma n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Meri onye Magdala
  rationale: Nke a na-egosipụta aha nwanyị ahụ na obodo e ji amata ya n’ụzọ doro anya ma bụrụkwa Igbo dị ndụ.
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: Meri nne Joses
  rationale: Genitive ahụ na-akọwa mmekọrịta Meri na Joses. N’usoro akụkọ Mak, a ghọtara ya nke ọma dị ka nne Joses, ebe nkọwa ala na-echekwa ọdịdị okwu Grik ahụ.
- source_word: ἐθεώρουν
  choice: nọ na-ele
  rationale: Ụdị imperfect na-egosi omume gara n’ihu n’oge gara aga; “nọ na-ele” na-echekwa echiche ahụ nke ilegide anya.
- source_word: ποῦ
  choice: ebe
  rationale: “Ebe” na-enye kpọmkwem echiche adverbial nke ποῦ n’Igbo eke.
- source_word: τέθειται
  choice: e liri ya
  rationale: N’ọnọdụ akụkọ a, passive perfect nke τίθημι na-ekwu maka ebe e debere Jizọs n’ili. “E liri ya” bụ okwu Igbo doro anya maka omume ahụ ma na-ezere ịkpọ Jizọs ihe.
theological_decisions:
- issue: Ihe a na-ekwughị aha ya n’ọrụ passive
  choice: E tinyere “ya,” nke na-ezo aka na Jizọs.
  alternative: Ịsị “ebe e debere ozu ya” ma ọ bụ ịhapụ onye a na-ekwu maka ya n’enweghị nnọchiaha.
  rationale: Grik hapụrụ onye a na-ekwu maka ya n’ihi na ọnọdụ okwu mere ka o doo anya. Igbo chọrọ nnọchiaha n’ebe a ka okwu dị larịị; “ya” na-ezo aka na Jizọs n’onwe ya, ọ bụghị nanị n’ozu dịka ihe.
- issue: Mmekọrịta Meri na Joses
  choice: E kwuru ya dịka “nne Joses.”
  alternative: “Meri nke Joses.”
  rationale: Grik kwuru naanị mmekọrịta genitive, ma ojiji Mak na ọnọdụ ahụ na-akwado nghọta nke ịbụ nne ya. Nkọwa ala na-echekwa ntụgharị okwu nke na-adịghị ekwupụta ụdị mmekọrịta ahụ kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “nọ na-ele” iji chekwaa omume gara n’ihu, ma jiri “e liri ya” mee ka ọnọdụ olili ahụ doo anya n’Igbo eke.
