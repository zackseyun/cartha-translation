revisions:
- from: Ma Meri onye Magdala na Meri nne Joses nọ na-ele ebe e liri ya[a].
  to: Meri Magdalin na Meri nne Joses nọ na-ele ebe e debere ya[a].
  rationale: The revision replaces “e liri ya” with “e debere ya” to retain the specific placement sense of τέθειται, uses the conventional Standard Igbo form “Meri Magdalin,” and removes an unnecessarily adversative connective. The relational rendering and its footnote are retained because the immediate Markan context supports “nne Joses,” while the Greek expression itself does not state the relationship explicitly.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:01:42Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the two women and preserves the imperfect sense in “nọ na-ele.” However, “e liri ya” means “he was buried,” while τέθειται specifically refers to his having been placed/laid in the tomb. “E debere ya” more closely represents the Greek perfect passive without adding the burial action itself.
  naturalness: “Nọ na-ele” is natural modern Standard Igbo. “Meri Magdalin” is the established, immediately recognizable Standard Igbo biblical form and is more idiomatic as a personal epithet than “Meri onye Magdala.” Omitting initial “Ma” avoids giving the mild Greek connective an unnecessarily adversative force.
  terminology: “Meri nne Joses” is a clear contextual rendering of Μαρία ἡ Ἰωσῆτος. The footnote appropriately retains the more literal but relationally unspecified alternative, “Meri nke Joses.”
  issues:
  - severity: medium
    issue: “e liri ya” translates the action as burial rather than placement.
    rationale: τέθειται is the perfect passive of τίθημι, “has been placed/laid.” Although burial is the surrounding context, the verse itself points to where Jesus had been laid.
  - severity: low
    issue: “Meri onye Magdala” is less idiomatic than the conventional Igbo biblical name form.
    rationale: “Meri Magdalin” is standard and natural in contemporary Igbo Scripture usage while retaining identification with Magdala.
  - severity: low
    issue: Initial “Ma” can sound adversative.
    rationale: δέ is only a mild narrative connective here; Igbo can naturally leave it unexpressed without losing the discourse flow.
  revised_text: Meri Magdalin na Meri nne Joses nọ na-ele ebe e debere ya[a].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ka dị nso n’okwu Grik, “Meri nke Joses.” Okwu Grik ji mmekọrịta ya na Joses amata Meri a.
    reason: lexical_alternative
  revision_rationale: The revision replaces “e liri ya” with “e debere ya” to retain the specific placement sense of τέθειται, uses the conventional Standard Igbo form “Meri Magdalin,” and removes an unnecessarily adversative connective. The relational rendering and its footnote are retained because the immediate Markan context supports “nne Joses,” while the Greek expression itself does not state the relationship explicitly.
