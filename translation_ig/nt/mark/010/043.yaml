  text: οὐχ οὕτως δέ ⸀ἐστιν ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ⸂μέγας γενέσθαι⸃ ἐν ὑμῖν, ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/043.yaml
  text: But it is not so among you[a]. Instead, whoever wants to become great among you will be your servant[b],
translation:
  language: ig
  text: Ma ọ bụghị otú ahụ ka ọ dị n'etiti unu.[a] Kama, onye ọ bụla chọrọ ịghọ onye ukwu n'etiti unu ga-abụ onye na-ejere unu ozi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ma ọ bụghị n'ụzọ a ka ọ dị n'etiti unu.”
    reason: lexical_alternative
  - marker: b
    text: 'N''ọnọdụ a, ngwaa ọdịnihu “ga-abụ” nwekwara ike inwe echiche nke “aghaghị ịbụ”: onye ọ bụla chọrọ ịghọ onye ukwu n''etiti unu aghaghị ịbụ onye na-ejere unu ozi.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: Ma ọ bụghị otú ahụ ka ọ dị n'etiti unu
  rationale: Nke a na-egosipụta njikọ mmegide δέ na okwu banyere ụzọ ndị ọchịchị mba ọzọ si achị, ma na-edobe οὕτως dị ka “otú ahụ” n'Igbo dị ugbu a.
- source_word: ἀλλ’
  choice: Kama
  rationale: “Kama” na-egosi mmegide siri ike na mmezi Jizọs wetara n'ụzọ doro anya.
- source_word: ὃς ἂν θέλῃ
  choice: onye ọ bụla chọrọ
  rationale: Nke a na-egosipụta ọnọdụ izugbe nke ὃς ἂν na subjunctive, ma na-edobe echiche ọchịchọ dị na θέλῃ.
- source_word: μέγας γενέσθαι
  choice: ịghọ onye ukwu
  rationale: “Ịghọ” na-edobe echiche mgbanwe dị na γενέσθαι, ebe “onye ukwu” na-egosipụta ọnọdụ ma ọ bụ ịdị elu dị na μέγας n'ụzọ nkịtị n'Igbo.
- source_word: ἐν ὑμῖν
  choice: n'etiti unu
  rationale: Nkebiokwu a dabara n'echiche mmekọrịta mmadụ na ibe ya ma jiri otu nsụgharị mee ihe n'ebe abụọ o pụtara.
- source_word: ἔσται ὑμῶν διάκονος
  choice: ga-abụ onye na-ejere unu ozi
  rationale: “Ga-abụ” na-edobe ọdịdị future nke ἔσται; “onye na-ejere unu ozi” na-egosipụta διάκονος dị ka onye na-arụ ọrụ ijere ndị ọzọ ozi, ọ bụghị aha ọkwa ụka ma ọ bụ ohu e kere agbụ.
theological_decisions:
- issue: Ike ntụziaka dị na future ἔσται
  choice: ga-abụ onye na-ejere unu ozi
  alternative: aghaghị ịbụ onye na-ejere unu ozi
  rationale: Future indicative a nwere ike ibu ike iwu ma ọ bụ ihe a chọrọ n'okwu a, ma isi nsụgharị na-edobe ụdị ngwaa Grik; nkọwa ala peeji na-echekwa nghọta nke “aghaghị.”
- issue: Nkọwa διάκονος
  choice: onye na-ejere unu ozi
  alternative: onye ozi unu
  rationale: N'okwu a, okwu ahụ na-elekwasị anya n'ọrụ ịdị umeala n'obi nke ijere ndị ọzọ ozi, ọ bụghị n'ọkwa nchụàjà ma ọ bụ ọkwa ụka e guzobere mgbe e mesịrị.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere nsọpụrụ ma doo ndị nkịtị anya. E ji “onye na-ejere ... ozi” zere nghọta nke ọkwa ụka dị na “onye ozi,” ma mee ka ọrụ ịdị umeala n'obi pụta ìhè.
