  source_fidelity: 'The Igbo faithfully represents every principal element of the Greek: the contrasting negation (οὐχ οὕτως δέ), the corrective ἀλλά, the indefinite volitional clause (ὃς ἂν θέλῃ), the ingressive sense of γενέσθαι (''ịghọ''), both occurrences of ἐν ὑμῖν, and the future ἔσται with διάκονος understood as one who serves. The wording retains the future form while the note appropriately records its possible directive force.'
