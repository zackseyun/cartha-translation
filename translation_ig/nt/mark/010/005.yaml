  to: Ma Jizọs sịrị ha, “Ọ bụ n’ihi na obi unu siri ike[b] ka o[a] ji deere unu iwu a[c].”
  rationale: The revision replaces an awkward nominal expression with the idiomatic Standard Igbo clause “obi unu siri ike,” while retaining the metaphor of a hard heart and the causal relationship in the Greek. It retains the implicit subject as “o,” anchored directly by footnote a, and preserves the legal sense of ἐντολή with “iwu.”
