  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: ig
  text: Ma Jizọs sịrị ha, “Ọ bụ n’ihi na obi unu siri ike[b] ka o[a] ji deere unu iwu a[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, Mosis, onye a kpọtụrụ aha n’amaokwu bu ụzọ.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “isiike nke obi unu.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “ntụziaka a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche n’etiti okwu ndị Farisii kwuru banyere Mosis na nzaghachi Jizọs.
- source_word: Πρὸς
  choice: Ọ bụ n’ihi ... ka
  rationale: Usoro a na-egosi ihe kpatara e ji dee iwu ahụ, ma bụrụkwa ụzọ Igbo si ekwu ya nke ọma.
- source_word: σκληροκαρδίαν
  choice: isiike nke obi
  rationale: Ọ na-edobe ihe atụ nke obi siri ike dị n’asụsụ Grik, kama ịgbanwe ya naanị ka ọ bụrụ isi akwara.
- source_word: ἔγραψεν
  choice: o ... deere
  rationale: Aha onye mere ihe ahụ apụtaghị ọzọ n’amaokwu Grik; ‘o’ na-ezo aka na Mosis e kwuru banyere ya n’amaokwu bu ụzọ.
- source_word: ἐντολήν
  choice: iwu
  rationale: ‘Iwu’ bụ okwu Igbo doro anya ma dị ugwu maka ntuziaka nwere ikike n’ihe gbasara iwu Mosis.
- source_word: ταύτην
  choice: a
  rationale: Ọ na-arụ ọrụ dị ka okwu ngosi nke na-ezo aka n’iwu a kpọtụrụ aha kpọmkwem.
theological_decisions:
- issue: Ma a ga-akpọ Mosis aha kpọmkwem dịka onye dere iwu ahụ
  choice: E debere nnọchiaha ‘o,’ nke na-ezo aka na Mosis n’amaokwu bu ụzọ.
  alternative: ‘Mosis deere unu iwu a.’
  rationale: Asụsụ Grik akpọghị Mosis aha ọzọ n’amaokwu a. Idobe nnọchiaha ahụ na-echekwa usoro okwu na enweghị mgbakwunye nkwusi ike.
- issue: Otu e si asụgharị σκληροκαρδία n’enweghị ibelata ihe atụ na ike mmụọ ya
  choice: ‘isiike nke obi’
  alternative: ‘obi ike’ ma ọ bụ ‘isi akwara’
  rationale: Nhọrọ a na-echekwa ihe atụ gbasara obi na ọnọdụ omume mmadụ dị n’asụsụ Grik, n’enweghị itinye nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. E ji ‘Ọ bụ n’ihi ... ka’ mee ka njikọ ihe kpatara ihe pụta ihe nke ọma. E debere nnọchiaha ‘o’ iji soro nghọta doro anya nke asụsụ mmalite.
