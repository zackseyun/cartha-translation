  text: τὰς ἐντολὰς οἶδας· Μὴ ⸂φονεύσῃς, Μὴ μοιχεύσῃς⸃, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: ig
  text: 'Ị maara iwu ndị a: “Egbula mmadụ[a]; akwala iko; ezula ohi; agbaala akaebe ụgha; anapụla mmadụ ihe ruuru ya[b]; sọpụrụ nna gị na nne gị.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Egbula.” Ma ngwaa Grik e ji mee ihe n’ebe a na-ezo kpọmkwem n’iji aka megidere iwu gbuo mmadụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “aghọgbula mmadụ” ma ọ bụ “apụnala mmadụ ihe.” Okwu ahụ pụtara igbochi mmadụ inweta ihe ruuru ya ma ọ bụ ịnara ya ihe ahụ, ọtụtụ mgbe site n’iji ya emegbu mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολάς
  choice: iwu ndị a
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’iwu Chineke ndị a maara nke ọma, karịchaa iwu ndị dị n’Iwu Iri ahụ.
- source_word: οἶδας
  choice: Ị maara
  rationale: Ọ bụ ezie na οἶδα dị n’ụdị perfect n’asụsụ Grik, ọ na-arụ ọrụ dị ka okwu oge ugbu a; “Ị maara” bụ Igbo doro anya ma bụrụkwa nke e ji ekwu okwu kwa ụbọchị.
- source_word: Μὴ φονεύσῃς
  choice: Egbula mmadụ[a]
  rationale: φονεύω na-ezo kpọmkwem n’iji aka megidere iwu gbuo mmadụ. “Egbula mmadụ” bụ usoro iwu dị nkenke ma bụrụ nke ndị Igbo ga-aghọta; nkọwa ala peeji na-egosi na ọ bụghị ụdị igbu ihe niile ka okwu Grik ahụ pụtara.
- source_word: Μὴ μοιχεύσῃς
  choice: akwala iko
  rationale: “Ịkwa iko” bụ akpaalaokwu Igbo a na-ejikarị akọwa mmebi ntụkwasị obi nke alụmdi na nwunye n’ihe gbasara mmekọahụ.
- source_word: Μὴ κλέψῃς
  choice: ezula ohi
  rationale: Nke a bụ ntụgharị Igbo a na-ahụkarị ma doo anya maka κλέπτω n’usoro iwu.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: agbaala akaebe ụgha
  rationale: Nke a na-echekwa echiche nke ịgba akaebe ụgha, karịchaa n’ọnọdụ ikpe, kama ime ka okwu ahụ bụrụ naanị “agwala ụgha.”
- source_word: Μὴ ἀποστερήσῃς
  choice: anapụla onye ọzọ ihe ruuru ya[b]
  rationale: ἀποστερέω pụtara igbochi mmadụ inweta ma ọ bụ ịnapụ ya ihe bụ nke ya n’ụzọ ziri ezi. Nhọrọ a na-egosipụta echiche ahụ nke ọma n’Igbo na-enweghị imechi ya naanị n’ụdị aghụghọ ego.
- source_word: Τίμα
  choice: sọpụrụ
  rationale: “Sọpụrụ” na-enye echiche siri ike nke inye nne na nna nsọpụrụ kwesịrị ha, karịa naanị ịkwanyere ha ùgwù n’obi.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: nna gị na nne gị
  rationale: Usoro a bụ Igbo eke, ma ọ na-echekwa aha nne na nna abụọ ahụ dị ka ihe odide Grik si mee.
theological_decisions:
- issue: Usoro e si sụgharịa ntụaka ndị e mere n’Iwu Iri ahụ
  choice: E ji ụdị okwu iwu ndị Igbo maara nke ọma mee ya, ma chekwaa nkọwa pụrụ iche nke okwu Grik.
  alternative: A pụrụ ịsụgharị φονεύω n’ụzọ sara mbara dị ka “igbu,” ma ọ bụ jiri nkọwa efu kọwaa iwu ndị ahụ.
  rationale: Amaokwu a na-edepụta iwu Chineke ndị a maara nke ọma. Ya mere, okwu ndị ahụ kwesịrị ịdị nkenke ma dị ka iwu, ma nkọwa ala peeji na-echekwa ókè ihe φονεύω na ἀποστερέω pụtara n’asụsụ mbụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere iwu ndị ahụ n’ụdị mmachibido iwu dị nkenke—“egbula,” “akwala,” “ezula,” “agbaala,” na “anapụla”—iji chekwaa ụda ndepụta iwu nke ederede Grik.
