  text: ὁ δὲ ⸀ἔφη αὐτῷ· Διδάσκαλε, ταῦτα πάντα ἐφυλαξάμην ἐκ νεότητός μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/020.yaml
  text: And he said to him, “Teacher, I have kept all these things from my youth.”
translation:
  language: ig
  text: Ọ sịrị ya, “Onye Ozizi, edebewo m ihe ndị a niile kemgbe m bụ nwata.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: Ọ sịrị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke a na-ejikarị akọwa okwu mmadụ kwuru; ọ naghị etinye echiche nke ‘ịza’ nke na-adịghị n’okwu Grik n’onwe ya.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Ọ bụ okwu a na-akpọ onye na-ezi ihe ihu na ihu, ya mere ọ na-egosipụta kpọmkwem ọrụ διδάσκαλος n’ụzọ doro anya.
- source_word: ταῦτα πάντα
  choice: ihe ndị a niile
  rationale: Nke a na-edobe ma okwu ngosi ταῦτα ma echiche nke πάντα, na-ezo aka n’iwu ndị a ka kpọtụrụ aha.
- source_word: ἐφυλαξάμην
  choice: edebewo m
  rationale: N’ihe gbasara iwu, ‘idebe’ bụ okwu Igbo ebumpụta ụwa nke pụtara ịsọpụrụ ma rube isi n’iwu; ụdị ‘edebewo m’ na-achịkọta omume ya site n’oge gara aga ruo ugbu a.
- source_word: ἐκ νεότητός μου
  choice: kemgbe m bụ nwata
  rationale: ‘Kemgbe’ na-egosi mmalite n’oge gara aga na ịdịgide ruo ugbu a; ‘m bụ nwata’ bụ okwu Igbo a na-aghọta ngwa ngwa maka νεότης n’ebe a.
- source_word: ὁ δὲ
  choice: Ọ
  rationale: δὲ bụ njikọ akụkọ dị nro n’ebe a. N’Igbo, ịmalite naanị na ‘Ọ’ na-eme ka akụkọ gaa nke ọma n’etinyeghị esemokwu nke ‘ma’ nwere ike igosi.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị nsọ ma dị mfe nghọta. E ji ‘Onye Ozizi’ mee okwu ịkpọ mmadụ ihu na ihu, e jighị ‘Nna Ukwu’ ma ọ bụ okwu ọzọ nwere ike itinye echiche ọchịchị karịrị ihe okwu Grik kwuru.
