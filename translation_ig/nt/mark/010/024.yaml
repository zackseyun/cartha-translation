source:
  edition: SBLGNT
  text: οἱ δὲ μαθηταὶ ἐθαμβοῦντο ἐπὶ τοῖς λόγοις αὐτοῦ. ὁ δὲ Ἰησοῦς πάλιν ἀποκριθεὶς λέγει αὐτοῖς· Τέκνα, πῶς δύσκολόν ⸀ἐστιν εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: ig
  text: Ma okwu ya juru ndị na-eso ụzọ ya anya. Jizọs zaghachikwara, sị ha[a], “Ụmụ, lee ka o si sie ike ịbanye n’alaeze Chineke!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide nwere, “Ụmụ, lee ka o si esiri ndị na-atụkwasị akụnụba obi ike ịbanye n’alaeze Chineke.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: okwu ya juru ... anya
  rationale: Nke a na-egosi na ihe ahụ nọ na-eju ha anya nke ukwuu, ma ọ bụkwa ụzọ Igbo dị ndụ si kwuo mmeghachi omume ahụ.
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: okwu ya
  rationale: Nke a na-edobe okwu Jizọs dị ka ihe kpatara iju ha anya, n’enweghị nkọwa agbakwunyere.
- source_word: πάλιν
  choice: -kwara
  rationale: Mgbakwunye “-kwara” na “zaghachi” na-egosi na Jizọs kwuru okwu ọzọ, n’ụzọ Igbo na-aga were were.
- source_word: ἀποκριθεὶς λέγει
  choice: zaghachikwara, sị ha
  rationale: Nke a na-echekwa ma echiche nke ịzaghachi ma nke ikwu okwu, na-enweghị ime ka Igbo sie ike.
- source_word: Τέκνα
  choice: Ụmụ
  rationale: “Ụmụ” bụ okwu ịhụnanya onye okenye nwere ike iji kpọọ ndị nọ ya nso; ọ naghị agbakwunye “m” nke na-adịghị na Grik.
- source_word: πῶς δύσκολόν ἐστιν
  choice: lee ka o si sie ike
  rationale: “Lee ka” na-echekwa ike mkpu dị na πῶς, ebe “o si sie ike” na-enye δύσκολον n’Igbo ebumpụta ụwa.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: ịbanye n’alaeze Chineke
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-eji eme ihe maka ịbanye n’ọchịchị ma ọ bụ alaeze Chineke.
theological_decisions:
- issue: Ma a ga-etinye okwu ogologo ahụ, “ọ na-esiri ndị tụkwasịrị obi n’akụnụba ike,” n’ahụ amaokwu ahụ
  choice: 'Ịgbaso ọgụgụ dị mkpụmkpụ nke SBLGNT: “lee ka o si sie ike ịbanye n’alaeze Chineke”'
  alternative: “Ụmụ, lee ka o si esiri ndị tụkwasịrị obi n’akụnụba ike ịbanye n’alaeze Chineke.”
  rationale: Ọgụgụ dị mkpụmkpụ bụ nke dị na isi mmalite e nyere, ọ na-echekwakwa obosara na nrụgide nke okwu Jizọs kama ịkpa ya ókè n’ebe ndị bara ọgaranya nọ. E debere ọgụgụ ogologo ahụ n’ala ala peeji dịka ọdịiche dị n’ihe odide.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ndị na-eso ụzọ” doro ndị nkịtị anya; “Ụmụ” na-echekwa olu ịhụnanya nke Jizọs. E debere akara ala ala peeji [a] ozugbo n’ebe ọdịiche ihe odide ahụ metụtara.
