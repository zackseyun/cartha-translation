  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ⸀οἱ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: ig
  text: Ma ọtụtụ ndị bụ ndị mbụ ga-abụ ndị ikpeazụ, ndị ikpeazụ ga-abụkwa ndị mbụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ doro anya karị: “Ọtụtụ ndị nọ n’ọnọdụ mbụ ga-adị n’ọnọdụ ikpeazụ, ndị nọkwa n’ọnọdụ ikpeazụ ga-adị n’ọnọdụ mbụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: ọtụtụ ndị
  rationale: Adjective a na-arụ ọrụ dị ka aha ma na-ezo aka n’ìgwè mmadụ sara mbara, ọ bụghị mmadụ niile; ‘ọtụtụ ndị’ doro anya ma bụrụ Igbo nkịtị.
- source_word: δὲ
  choice: Ma
  rationale: δέ na-egosi obere ọdịiche ma ọ bụ ntụgharị n’okwu; ‘Ma’ na-echekwa ọdịiche ahụ n’ihe gbara amaokwu a gburugburu.
- source_word: ἔσονται
  choice: ga-abụ
  rationale: Ọ bụ future copula dị mfe; ‘ga-abụ’ bụ ntụgharị Igbo nke oge ọdịnihu n’ụzọ eke.
- source_word: πρῶτοι
  choice: ndị mbụ
  rationale: πρῶτοι na-egosi ọnọdụ ma ọ bụ ọkwa; ‘ndị mbụ’ na-echekwa nkọwa ahụ na ntụnyere ya na ‘ndị ikpeazụ.’
- source_word: ἔσχατοι
  choice: ndị ikpeazụ
  rationale: N’okwu ntụgharị ọnọdụ a, ἔσχατοι bụ ihe megidere πρῶτοι; ‘ndị ikpeazụ’ na-echekwa esemokwu ahụ n’enweghị ịkọwa ya dịka ‘ndị kacha nta.’
- source_word: οἱ ἔσχατοι
  choice: ndị ikpeazụ
  rationale: Article ahụ mere adjective a ka ọ bụrụ aha otu ìgwè; Igbo ‘ndị ikpeazụ’ na-egosipụta nke a n'ụzọ dị mkpirikpi ma doo anya.
- source_word: καὶ
  choice: ndị ... abụrụ
  rationale: A haziri njikọ nke akụkụ abụọ ahụ n’usoro Igbo eke, ebe akụkụ nke abụọ ka jikọtara na nke mbụ ma chekwaa nhata okwu ahụ.
theological_decisions:
- issue: Ụdị ntụgharị ọnọdụ a na-ekwu maka ya
  choice: E gosipụtara ya dịka ụkpụrụ sara mbara banyere mgbanwe nke ọnọdụ n’ọdịnihu, n’akọwaghị kpọmkwem ụdị ndị ‘mbụ’ na ndị ‘ikpeazụ’ bụ.
  alternative: Ịkọwa ha kpọmkwem dịka ndị ọgaranya na ndị ogbenye, ndị na-eso ụzọ na ndị nọ n’èzí, ma ọ bụ dịka iwu zuru oke metụtara onye ọ bụla.
  rationale: Amaokwu ahụ bụ okwu ilu dị nkenke nke na-ekwupụta ntụgharị ọnọdụ, ma ọ naghị akọwa ìgwè ndị ahụ kpọmkwem; ya mere ntụgharị a na-echekwa obosara na mgbagwoju anya ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara usoro okwu ilu na ntụnyere ‘ndị mbụ/ndị ikpeazụ’ n’enweghị ịgbakwunye nkọwa ụka ma ọ bụ ozizi otu okpukpe.
