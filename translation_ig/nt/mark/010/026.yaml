- from: O jukwara ha nnọọ anya, ha wee na-agwa ibe ha, “Ọ bụrụ otu a, ònye pụrụ ịzọpụta?”
  to: Ha jukwara nnọọ anya, wee sị ibe ha, “Ya mere, ònye ka a pụrụ ịzọpụta?”
  rationale: The revision corrects the active/passive mismatch in the salvation expression and slightly refines the connective for closer fidelity to the Greek while retaining natural modern Standard Igbo.
