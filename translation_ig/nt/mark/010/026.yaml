review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the disciples’ extreme astonishment and their reciprocal discussion. However, "ịzọpụta" is an active infinitive (“to save”) and does not represent the passive infinitive σωθῆναι (“to be saved”). The revised wording uses an impersonal passive construction that naturally conveys “be saved” in Standard Igbo.
  naturalness: '"Ha jukwara nnọọ anya" and "wee sị ibe ha" are natural, clear Standard Igbo. "Ya mere" gives the contextual inferential force of Καὶ without making the conditional implication more explicit than the Greek does.'
  terminology: The revised "a pụrụ ịzọpụta" preserves salvation terminology while correctly expressing its passive sense. It avoids reducing σωθῆναι to mere rescue or deliverance.
  issues:
  - severity: high
    issue: The draft renders σωθῆναι as "ịzọpụta."
    rationale: '"Ịzọpụta" is active (“to save”), whereas σωθῆναι is passive (“to be saved”). This changes who performs versus receives the saving action.'
  - severity: low
    issue: '"Ọ bụrụ otu a" is more conditional than the source expression.'
    rationale: Καὶ here can carry an inferential discourse sense, but it does not itself state a conditional clause. "Ya mere" more directly supplies the contextual consequence.
  revised_text: Ha jukwara nnọọ anya, wee sị ibe ha, “Ya mere, ònye ka a pụrụ ịzọpụta?”
