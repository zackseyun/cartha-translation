  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ περισσῶς ἐξεπλήσσοντο λέγοντες πρὸς ⸀ἑαυτούς· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: ig
  text: Ha jukwara nnọọ anya, wee sị ibe ha, “Ya mere, ònye ka a pụrụ ịzọpụta?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: O jukwara ha
  rationale: A na-eji njikọ “-kwara” mee ka okwu a gaa n’ihu n'ụzọ Igbo na-asụkarị, ebe nnọchiaha “ha” na-ezo aka n’ ndị na-eso ụzọ n'okwu gbara ya gburugburu.
- source_word: περισσῶς
  choice: nnọọ
  rationale: “Nnọọ” na-egosi oke ịdị ukwuu nke ihe ijuanya ahụ n'Igbo dị mfe ma dị ike.
- source_word: ἐξεπλήσσοντο
  choice: O ... ha ... anya
  rationale: Akpaalaokwu “o juru ha anya” bụ ụzọ Igbo sitere n'okike isi kwuo oke ihe ijuanya; usoro ahịrịokwu ahụ na-egosi ọnọdụ ha nọ na ya.
- source_word: λέγοντες
  choice: ha wee na-agwa
  rationale: “Na-agwa” na-egosi na okwu ha na ihe ijuanya ha na-eme n'otu oge, ebe “wee” na-ejikọta omume abụọ ahụ n'ụzọ Igbo dị mma.
- source_word: πρὸς ἑαυτούς
  choice: ibe ha
  rationale: 'N''ọnọdụ mkparịta ụka nke ọtụtụ mmadụ, okwu a nwere nghọta mmeghachi omume: ha na-agwa ibe ha, ọ bụghị nanị na onye ọ bụla na-agwa onwe ya.'
- source_word: Καὶ
  choice: Ọ bụrụ otu a
  rationale: N'ebe a καί na-ebute ajụjụ sitere n'ihe Jizọs kwuru; “Ọ bụrụ otu a” na-egosipụta nghọta nkwubi okwu ahụ n'ụzọ Igbo sitere n'okike.
- source_word: τίς
  choice: ònye
  rationale: “Ònye” na-ajụ onye ọ bụla pụrụ ịbụ nke a metụtara.
- source_word: δύναται
  choice: pụrụ
  rationale: “Pụrụ” na-egosi ikike ma ọ bụ ohere, dịka δύναται si pụta.
- source_word: σωθῆναι
  choice: ịzọpụta
  rationale: “Ịzọpụta” na-edowe ịdị arọ nke okwu nzọpụta n'ọnọdụ a, nke metụtara ịbanye n'alaeze Chineke, kama ibelata ya ka ọ bụrụ nanị ịnapụta mmadụ n'ihe ize ndụ nkịtị.
theological_decisions:
- issue: Ihe okwu nzọpụta pụtara n'ọnọdụ a
  choice: ịzọpụta
  alternative: ịnapụta
  rationale: N'ihi na okwu gbara amaokwu a gburugburu metụtara ịbanye n'alaeze Chineke, a họọrọ okwu na-edowe nghọta sara mbara nke nzọpụta Chineke, ọ bụghị naanị nzọpụta pụọ n'ihe ize ndụ nwa oge.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. A họọrọ akpaalaokwu Igbo sitere n'okike ma debe ike nke ihe ijuanya na ajụjụ ahụ.
