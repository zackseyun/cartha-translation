  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποβαλὼν τὸ ἱμάτιον αὐτοῦ ⸀ἀναπηδήσας ἦλθεν πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/050.yaml
  text: And throwing off his cloak[a], he sprang up and came to Jesus.
translation:
  language: ig
  text: Ọ tụpụrụ uwe mwụda ya[a], wụliri elu, bịakwute Jizọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “uwe elu ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβαλών
  choice: wepụrụ
  rationale: Okwu a na-egosi omume e mere ozugbo nke iwepụ ma ọ bụ ịtụpụ ihe; “wepụrụ” bụ okwu Igbo doro anya ma kwekọọ na uwe a na-ekwu maka ya.
- source_word: ἱμάτιον
  choice: uwe mwụda
  rationale: N'ebe a, ἱμάτιον na-abụkarị uwe a na-eyi n'elu uwe ndị ọzọ; “uwe mwụda” na-enye echiche ahụ n'Igbo nkịtị.
- source_word: ἀναπηδήσας
  choice: wulie elu ozugbo
  rationale: Nkebiokwu a na-egosi ngagharị mberede nke juputara n'ike; “wulie elu ozugbo” na-echekwa ịdị ngwa na ịnụ ọkụ n'obi ahụ.
- source_word: ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: bịakwute Jizọs
  rationale: “Bịakwute” na-egosi ịga n'ebe mmadụ nọ ruo ya nso, nke kwekọrọ na ἔρχομαι na πρός n'akụkọ a.
- source_word: δὲ
  choice: O
  rationale: N'Igbo, ịga n'ihu n'akụkọ site n'isiokwu “O” na-ada nke ọma n'enweghị itinye echiche mmegide siri ike nke δέ na-enweghị ebe a.
