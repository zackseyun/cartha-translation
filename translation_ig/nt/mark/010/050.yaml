review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the sequence of actions and Jesus as the destination. However, “wepụrụ” primarily means ‘removed/took off’ and weakens the decisive casting-away sense of ἀποβαλών; “ozugbo” adds an explicit ‘immediately’ not stated in the Greek. “Uwe mwụda” can suitably render the outer garment in this setting.
  naturalness: The revised serial-verb narrative is natural Standard Igbo and retains the brisk movement of the Greek without an added adverb.
  terminology: “Uwe mwụda” is retained for ἱμάτιον. “Tụpụrụ” better represents ἀποβάλλω here than the milder “wepụrụ.” Jizọs is correctly spelled.
  issues:
  - severity: medium
    issue: “wepụrụ” understates ἀποβαλών.
    rationale: The Greek depicts casting off/throwing away the garment, not simply taking it off.
  - severity: low
    issue: “ozugbo” adds a temporal detail.
    rationale: ἀναπηδήσας expresses a sudden, energetic springing up, but does not explicitly say ‘immediately.’
  revised_text: Ọ tụpụrụ uwe mwụda ya[a], wụliri elu, bịakwute Jizọs.
