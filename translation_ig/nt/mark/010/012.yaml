review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the feminine subject, her husband, another man, and the adultery predicate. However, the conditional sequence needs an explicit Igbo conjunction between the two actions, and “ahụ” introduces a demonstrative nuance not present in αὐτή.
  naturalness: '“Ọ bụrụkwa na nwaanyị ahụ agbaa di ya alụkwaghịm, lụọ nwoke ọzọ” is awkward as a conditional sequence: the second action should be joined with “ma,” and the verbal form after “ọ bụrụ na” is more natural as “gbaa.”'
  terminology: “Ịgba alụkwaghịm,” “di ya,” “nwoke ọzọ,” and “ịkwa iko” are accurate, clear Standard Igbo choices for this context. The footnote appropriately records the more literal lexical sense without making it the main translation.
  issues:
  - severity: medium
    issue: The two conditional actions are not clearly coordinated in the Igbo text.
    rationale: The Greek has ‘if she, having divorced her husband, marries another.’ Standard Igbo naturally expresses the coordinated conditional actions as “ọ bụrụ na ... gbaa ... ma lụọ ...”.
  - severity: low
    issue: “Nwaanyị ahụ” adds a demonstrative element.
    rationale: αὐτή marks the feminine subject, with possible emphasis, but does not mean ‘that woman.’ “Nwaanyị” retains the explicit feminine reference without adding a demonstrative.
  revised_text: Ọ bụrụkwa na nwaanyị gbaa di ya alụkwaghịm ma lụọ nwoke ọzọ, ọ na-akwa iko.[a]
