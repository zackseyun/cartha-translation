  yaml_path: translation/nt/mark/010/012.yaml
  text: and if she divorces her husband and marries another man[a], she commits adultery.
translation:
  language: ig
  text: Ọ bụrụkwa na nwaanyị gbaa di ya alụkwaghịm ma lụọ nwoke ọzọ, ọ na-akwa iko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ka nso n’okwu Grik, “chụpụ di ya.” N’ọnọdụ alụmdi na nwunye a, ihe ọ pụtara bụ “ịgba alụkwaghịm.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” jikọtara okwu a na ikpe yiri ya dị n’amaokwu bu ụzọ.
- source_word: ἐὰν
  choice: ọ bụrụ na
  rationale: Nke a na-egosi ọnọdụ e debere, ma bụrụkwa ụzọ Igbo nkịtị si kwuo ya.
- source_word: αὐτὴ
  choice: nwaanyị ahụ
  rationale: Ọ na-edobe onye a na-ekwu maka ya dị ka nwaanyị, tinyekwa ntakịrị nkwusi ike nke nnọchiaha Grik ahụ nwere.
- source_word: ἀπολύσασα
  choice: agbaa ... alụkwaghịm
  rationale: N’ọnọdụ alụmdi na nwunye a, okwu ahụ pụtara ịgba alụkwaghịm, ọ bụghị nanị ịchụpụ mmadụ.
- source_word: τὸν ἄνδρα αὐτῆς
  choice: di ya
  rationale: Ọ bụ ezie na ἀνήρ nwekwara ike ịpụta nwoke, n’ebe a mmekọrịta alụmdi na nwunye chọrọ “di ya.”
- source_word: γαμήσῃ ἄλλον
  choice: lụọ nwoke ọzọ
  rationale: ἄλλον bụ nke nwoke; “nwoke ọzọ” na-edobe nkọwa okike dị n’asụsụ Grik.
- source_word: μοιχᾶται
  choice: ọ na-akwa iko
  rationale: Nke a bụ ụzọ Igbo doro anya ma kwekọọ n’ụdị ngwaa ugbu a si ekwu ime mmehie ịkwa iko n’alụmdi na nwunye.
theological_decisions:
- issue: Ma a ga-edobe nkọwa okike kpọmkwem nke okwu ahụ
  choice: “nwaanyị ahụ ... di ya ... nwoke ọzọ”
  alternative: “ọ bụrụ na nwunye agbaa di ya alụkwaghịm, lụọ onye ọzọ”
  rationale: Grik kpọmkwem na-ekwu banyere nwaanyị na nwoke ọzọ; idebe nke a na-echekwa ntụnyere ahụ na amaokwu bu ụzọ n’enweghị ime ka okwu ahụ bụrụ nke na-enweghị okike.
- issue: Ma a ga-asụgharị ἀπολύω n’ụzọ nkịtị ka ọ bụ dịka okwu metụtara iwu alụmdi na nwunye
  choice: “agbaa ... alụkwaghịm”
  alternative: “achụpụ di ya”
  rationale: N’ebe a, isi okwu bụ ịkwụsị alụmdi na nwunye. “Ịgba alụkwaghịm” na-enye nghọta ahụ nke ọma, ebe nkọwa nkịtị ka e debere n’ala ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke doro anya ma nwee ugwu, mee ihe. A họọrọ “ịgba alụkwaghịm” maka nghọta nkịtị, ma debe okwu nkịtị “ịchụpụ” n’ala ala peeji.
