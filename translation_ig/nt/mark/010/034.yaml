  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: ig
  text: Ha ga-akwa ya emo, gbụọ ya ọnụ mmiri, pịa ya ụtarị, gbuo ya; mgbe ụbọchị atọ gachara[a], ọ ga-ebili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime ụbọchị atọ.” N’asụsụ Grik, Mak dere, “mgbe ụbọchị atọ gachara,” ebe akụkụ Akwụkwọ Nsọ ndị ọzọ na-ekwu oge ahụ dịka “n’ụbọchị nke atọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμπαίξουσιν
  choice: ga-akwa ya emo
  rationale: “Ịkwa mmadụ emo” bụ ụzọ Igbo nkịtị ma doo anya isi kwuo ịkwa mmadụ ọchị n’ụzọ nlelị na mkparị.
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: gbụọ ya ọnụ mmiri
  rationale: Nke a na-egosi na ha ga-agbụ ya ọnụ mmiri dị ka omume mkparị na iweda ya ala.
- source_word: μαστιγώσουσιν
  choice: pịa ya ụtarị
  rationale: Okwu a na-egosi iti mmadụ ihe dịka ntaramahụhụ; “ịpịa ụtarị” na-enye ihe ọ pụtara n’Igbo ugbu a n’ụzọ doro anya.
- source_word: ἀποκτενοῦσιν
  choice: gbuokwa ya
  rationale: “Igbu” na-enye ihe ngwaa Grik ahụ pụtara n’enweghị itinye echiche iwu ma ọ bụ ikpe omume na-adịghị n’okwu ahụ n’onwe ya.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: mgbe ụbọchị atọ gachara
  rationale: μετά tinyere aha nọ n’ọnọdụ accusative pụtara “mgbe ... gachara”; nsụgharị a na-edobe kpọmkwem otú Mak si kwuo oge ahụ kama ime ka ya na “n’ụbọchị nke atọ” kwekọọ n’ụzọ a manyere amanye.
- source_word: ἀναστήσεται
  choice: ọ ga-ebili
  rationale: Ụdị ngwaa future middle a na-akwado okwu na-egosi na onye ahụ n’onwe ya ga-ebili; etinyeghị “ọzọ” n’ihi na ọ dịghị n’okwu Grik.
theological_decisions:
- issue: Okwu banyere mbilite n’ọnwụ
  choice: ọ ga-ebili
  alternative: a ga-eme ka o si n’ọnwụ bilie; ọ ga-ebili ọzọ
  rationale: ἀναστήσεται bụ future middle, ya mere “ọ ga-ebili” na-edobe usoro okwu ahụ. Nke a anaghị agọnahụ ebe ndị ọzọ kwuru na Nna kpọlitere Jizọs, ma ọ naghị etinye passive ma ọ bụ okwu “ọzọ” nke na-adịghị ebe a.
- issue: Oge mbilite n’ọnwụ
  choice: mgbe ụbọchị atọ gachara
  alternative: n’ime ụbọchị atọ; n’ụbọchị nke atọ
  rationale: A na-edobe okwu Mak, “mgbe ụbọchị atọ gachara,” n’agbanyeghị na ebe ndị ọzọ na-ekwu “n’ụbọchị nke atọ,” ka a ghara ikpuchi ọdịiche dị n’ụzọ e si kwuo oge ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma nwee nsọpụrụ, dee ya. E tinyere akara nkọwa [a] n’akụkụ okwu oge ọ na-akọwa, ọ bụghị n’akụkụ “ịkwa emo.”
