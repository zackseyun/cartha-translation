revisions:
- from: Ha sịrị, “Mosis kwere ka nwoke dee akwụkwọ ịgba alụkwaghịm[a], wee chụpụ nwunye ya[b].”
  to: Ha sịrị, “Mosis kwere ka nwoke dee akwụkwọ ịgba alụkwaghịm[a] ma hapụ nwunye ya[b].”
  rationale: Replaced “chụpụ nwunye ya” with “hapụ nwunye ya” to avoid a forceful-expulsion nuance absent from the Greek while preserving the contextual sense of divorce. The supplied generic “nwoke” and “nwunye ya” make explicit the marital scenario assumed by the context and by the divorce certificate, without changing the source’s meaning. Footnote b is adjusted to reflect the literal verbal sense accurately.
  reviewer_model: gpt-5.6-terra
