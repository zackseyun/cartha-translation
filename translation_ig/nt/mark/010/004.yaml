  text: οἱ δὲ εἶπαν· ⸂Ἐπέτρεψεν Μωϋσῆς⸃ βιβλίον ἀποστασίου γράψαι καὶ ἀπολῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/004.yaml
  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: ig
  text: Ha sịrị, “Mosis kwere ka nwoke dee akwụkwọ ịgba alụkwaghịm[a] ma hapụ nwunye ya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, ‘akwụkwọ iwu ịgba alụkwaghịm.’ Nkebiokwu Grik ahụ na-ezo aka n’akwụkwọ iwu e dere iji gosi ịgba alụkwaghịm.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, ‘ma gbaa nwunye ya alụkwaghịm.’ N’ụzọ nkịtị, okwu Grik ahụ bụ ‘ma hapụ ya’ ma ọ bụ ‘ma zipụ ya’; n’ebe a ọ na-ekwu maka ịgba alụkwaghịm.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Ha sịrị
  rationale: Nke a na-ezo aka n’aka ndị Farisii a kpọtụrụ aha n’amaokwu bu ụzọ. δέ na-egosi ịga n’ihu ma ọ bụ obere ntụnyere; n’Igbo ebumpụta ụwa, ‘Ha sịrị’ na-egosipụta nzaghachi ahụ nke ọma.
- source_word: Ἐπέτρεψεν
  choice: kwere ka
  rationale: ἐπιτρέπω pụtara inye ikike ma ọ bụ ikwe ka e mee ihe. ‘Kwere ka’ na-echekwa ọdịiche dị n’etiti ihe Mosis nyere ohere ime na ihe e nyere n’iwu.
- source_word: Μωϋσῆς
  choice: Mosis
  rationale: Nke a bụ ụdị aha Mosis a na-ejikarị n’Igbo.
- source_word: βιβλίον ἀποστασίου
  choice: akwụkwọ ịgba alụkwaghịm
  rationale: Nkebiokwu Grik a na-ezo aka n’akwụkwọ iwu na-egosi na alụmdi na nwunye agwụla. Nsụgharị a doro ndị na-agụ Igbo nke oge a anya ma na-echekwa ọdịdị iwu ya.
- source_word: γράψαι
  choice: dee
  rationale: γράφω pụtara ide; ‘dee’ bụ nsụgharị Igbo kwụ ọtọ na nke ebumpụta ụwa.
- source_word: καὶ ἀπολῦσαι
  choice: wee chụpụ nwunye ya
  rationale: N’ọnọdụ alụmdi na nwunye a, ἀπολύω pụtara ịhapụ ma ọ bụ ịgba nwunye alụkwaghịm. ‘Chụpụ nwunye ya’ na-echekwa ihe oyiyi nke okwu Grik bụ ‘zipụ ya,’ ebe akwụkwọ ịgba alụkwaghịm na-eme ka ihe a na-ekwu doo anya. A gbakwụnyere ‘nwunye ya’ n’Igbo site n’ihe gbara amaokwu ahụ gburugburu.
theological_decisions:
- issue: Ụdị ntụziaka Mosis nyere banyere ịgba alụkwaghịm
  choice: Mosis kwere ka e gbaa alụkwaghịm; o nyeghị ya dịka iwu a ga-emerịrị
  alternative: Mosis nyere nwoke iwu ka o dee akwụkwọ ịgba alụkwaghịm
  rationale: Okwu Ἐπέτρεψεν pụtara n’ụzọ doro anya ‘kwere ka.’ Nke a na-echekwa esemokwu dị n’akụkọ ahụ n’etiti ohere e nyere n’ihi isi ike nke obi na nzube Chineke site ná mmalite.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Kwere ka’ na-egosipụta echiche nke ikike e nyere, ebe ‘akwụkwọ ịgba alụkwaghịm’ na-enye nghọta iwu doro anya. Etinyere akara ntụaka ụkwụ [a] na [b] kpọmkwem n’ebe okwu ndị ha na-akọwa dị.
