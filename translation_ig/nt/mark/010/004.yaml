review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Moses' permission, the written divorce document, and the marital force of ἀπολῦσαι. However, “chụpụ nwunye ya” ordinarily suggests driving/expelling a wife and is stronger and more coercive than the Greek verb in this context. “Hapụ nwunye ya” retains the sense of releasing/sending away without adding that connotation.
  naturalness: The revised wording is natural, dignified Standard Igbo. “Ka nwoke dee … ma hapụ nwunye ya” clearly links both infinitives to the permitted action and avoids the unnecessarily harsh wording “chụpụ.”
  terminology: “Mosis,” “kwere ka,” and “akwụkwọ ịgba alụkwaghịm” are appropriate. The footnote for the second expression should identify the literal sense as “hapụ/zipụ ya,” rather than treating “chụpụ” as the literal imagery.
  issues:
  - severity: medium
    issue: “chụpụ nwunye ya” overstates καὶ ἀπολῦσαι.
    rationale: Although ἀπολύω can mean divorce in a marital context, “chụpụ” commonly means drive out or expel and can imply forceful eviction. The source says to release/send away; “hapụ” is a closer and less loaded rendering.
  revised_text: Ha sịrị, “Mosis kwere ka nwoke dee akwụkwọ ịgba alụkwaghịm[a] ma hapụ nwunye ya[b].”
