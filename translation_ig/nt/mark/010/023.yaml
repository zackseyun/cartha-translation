  verdict: revise
  source_fidelity: The draft accurately conveys Jesus looking around, addressing his disciples, wealth, and entry into God's kingdom. However, “Lee ka o si sie ike” leaves the future force of εἰσελεύσονται unexpressed. The exclamatory construction can naturally retain that future reference in Igbo.
  naturalness: 'The proposed revision uses a more idiomatic Standard Igbo construction: “Lee ka ọ ga-esi siere ... ike ịbanye.” It is clear, public-reading suitable, and retains the emphatic force of Πῶς δυσκόλως.'
  terminology: “Ndị na-eso ụzọ ya,” “akụ na ụba,” and “alaeze Chineke” are appropriate, clear Standard Igbo renderings. The footnote appropriately preserves the wider sense of χρήματα as money or possessions.
  issues:
