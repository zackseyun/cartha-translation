id: MRK.10.23
reference: Mark 10:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: ig
  text: Jizọs lere anya gburugburu, wee sị ndị na-eso ụzọ ya, “Lee ka ọ ga-esi siere ndị nwere akụ na ụba[a] ike ịbanye n’alaeze Chineke!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ndị nwere ego,” “ndị nwere ihe onwunwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: legharịrị anya gburugburu
  rationale: Nke a na-egosi na Jizọs lere ndị nọ ya gburugburu anya tupu o kwuo okwu, dịka aorist participle ahụ si hazie omume abụọ ahụ.
- source_word: λέγει
  choice: wee sị
  rationale: Ọ bụ ezie na Grik ji historical present mee akụkọ ahụ ka ọ dị ndụ, usoro a bụ ụzọ Igbo dị ire ma dị n’okike isi jikọta omume ahụ na okwu Jizọs.
- source_word: Πῶς δυσκόλως
  choice: Lee ka o si sie ike
  rationale: Nke a na-ebupụta ike nke nkwupụta ahụ n’Igbo n’ebughị ya gaa n’echiche na ọ gaghị ekwe omume ma ọlị.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: ndị nwere akụ na ụba
  rationale: Ọ na-edobe nkọwa nke ndị nwere ihe onwunwe bara ụba kama ịgbanwe ya ka ọ bụrụ naanị aha otu ndị mmadụ.
- source_word: χρήματα
  choice: akụ na ụba
  rationale: Okwu a nwere ike ịpụta ego ma ọ bụ ihe onwunwe n’ozuzu; “akụ na ụba” na-ekpuchi echiche ahụ nke ọma n’ebe a.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ ntụgharị doro anya, nke a na-ejikarị eme ihe, ma na-edobe ihe oyiyi nke alaeze dị n’okwu Grik.
- source_word: εἰσελεύσονται
  choice: ịbanye
  rationale: Infinitive Igbo a na-esochi “o si sie ike nye...” n’ụzọ e bu pụta ụwa ma na-eburu echiche nke ịbanye dị n’future verb Grik.
theological_decisions:
- issue: Ma okwu Jizọs ọ na-ekwu na ọ gaghị ekwe ndị bara ọgaranya omume ịbanye, ka ọ̀ na-ekwu na ọ ga-esiri ha ike nke ukwuu
  choice: 'E gosipụtara ya dịka ihe siri ike nke ukwuu: “Lee ka o si sie ike...”'
  alternative: Ịsụgharị ya n’ụzọ na-egosi na ọ gaghị ekwe omume ma ọlị
  rationale: δυσκόλως pụtara “n’ụzọ siri ike,” ọ bụghị na ihe ahụ agaghị ekwe omume. Ya mere, ntụgharị a na-edobe esemokwu na ịdị arọ nke okwu ahụ n’etinyeghị nkwubi okwu nkà mmụta okpukpe karịrị ihe amaokwu a kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Lee ka o si sie ike” na-ebupụta ụda mkpu nke okwu Grik, ebe “wee sị” na-eme ka usoro akụkọ ahụ na-aga nke ọma n’Igbo.
