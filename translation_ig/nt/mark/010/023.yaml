  to: Jizọs lere anya gburugburu, wee sị ndị na-eso ụzọ ya, “Lee ka ọ ga-esi siere ndị nwere akụ na ụba[a] ike ịbanye n’alaeze Chineke!”
  rationale: The revision explicitly expresses the future reference of the Greek verb with “ọ ga-esi,” while preserving the exclamatory emphasis, the broad sense of wealth/possessions, and the source’s statement of severe difficulty rather than impossibility.
