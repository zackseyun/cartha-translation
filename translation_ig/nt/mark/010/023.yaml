    issue: The future sense of εἰσελεύσονται is not explicit.
    rationale: The draft’s “Lee ka o si sie ike” reads most readily as a present/general assertion. Since the Greek finite verb is future, the Igbo should mark the prospective difficulty without altering the statement into impossibility.
  revised_text: Jizọs lere anya gburugburu, wee sị ndị na-eso ụzọ ya, “Lee ka ọ ga-esi siere ndị nwere akụ na ụba[a] ike ịbanye n’alaeze Chineke!”
