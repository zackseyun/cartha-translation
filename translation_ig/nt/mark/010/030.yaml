id: MRK.10.30
reference: Mark 10:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: ig
  text: onye na-agaghị anata ihe okpukpu otu narị[a] ugbu a n’oge a—ụlọ, ụmụnne nwoke, ụmụnne nwanyị, ndị nne, ụmụ, na ala ubi, tinyere mkpagbu—ma n’oge na-abịa[b], ọ ga-anata ndụ ebighị ebi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ugboro otu narị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ọgbọ na-abịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβῃ
  choice: anata
  rationale: “Anata” na-egosi ịnata ihe e nyere, nke dabara na nkwa ụgwọ ọrụ dị n’ebe a karịa okwu pụtara iji aka were ihe.
- source_word: ἑκατονταπλασίονα
  choice: ihe okpukpu otu narị
  rationale: Nke a na-edobe ike ọnụọgụ okwu Grik ma na-ada nke ọma n’Igbo nke oge a.
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: ugbu a n’oge a
  rationale: Ọ na-edobe nkwughachi na nrụgide oge dị ugbu a, n’ụzọ doro anya megide oge na-abịa.
- source_word: οἰκίας
  choice: ụlọ
  rationale: Ọ bụ okwu Igbo kpọmkwem ma kwekọọ n’ọtụtụ ụlọ dị n’ederede Grik; n’Igbo, otu ụdị “ụlọ” nwere ike ịrụ ọrụ maka otu na ọtụtụ.
- source_word: ἀδελφοὺς καὶ ἀδελφὰς
  choice: ụmụnne nwoke, ụmụnne nwanyị
  rationale: A kewapụrụ ụmụnne nwoke na ụmụnne nwanyị dịka Grik si kewapụ ha.
- source_word: μητέρας
  choice: ndị nne
  rationale: Ọ na-edobe ọtụtụ nne e kwuru n’ederede ahụ.
- source_word: τέκνα
  choice: ụmụ
  rationale: “Ụmụ” bụ okwu sara mbara nke gụnyere ụmụ nwoke na ụmụ nwanyị n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: ἀγρούς
  choice: ala ubi
  rationale: Ọ na-egosi ala a na-akọ ma ọ bụ ubi, n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: μετὰ διωγμῶν
  choice: tinyere mkpagbu
  rationale: Ọ na-edobe eziokwu na ngọzi ndị a na-abịa n’etiti mkpagbu, ọ bụghị na-enweghị ahụhụ.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: n’oge na-abịa
  rationale: Nke a na-egosi oge ma ọ bụ era na-abịa, kama ime ka αἰών bụrụ naanị ụwa a na-ahụ anya.
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ ntụgharị Igbo doro anya na nke a maara nke ọma maka ndụ eskatọlọjikal na-adịghị agwụ agwụ.
theological_decisions:
- issue: Ụdị ụgwọ ọrụ e kwere ná nkwa n’oge a
  choice: E depụtara ụlọ, ndị ezinụlọ, na ala ubi dịka ezigbo ihe a ga-anata ugbu a, ma e debekwara “tinyere mkpagbu.”
  alternative: Ịkọwa ha naanị dịka ngọzi ime mmụọ, ma ọ bụ dịka nkwa akụnụba na-enweghị ahụhụ.
  rationale: Grik jikọtara ụgwọ ọrụ bara ụba na mkpagbu. Ntụgharị ahụ ekwesịghị iwepụ esemokwu a site n’ịkwado ozizi akụnụba ma ọ bụ ime ihe niile naanị ihe atụ.
- issue: Nkọwa nwoke na nwanyị n’okwu ndị ezinụlọ
  choice: “ụmụnne nwoke, ụmụnne nwanyị”
  alternative: Ijikọta ha naanị n’okwu mkpokọta “ụmụnne.”
  rationale: Grik kpọrọ ἀδελφοὺς na ἀδελφὰς iche iche, ya mere ntụgharị ahụ na-edobe ọdịiche ahụ.
- issue: Mmekọrịta ndụ ebighị ebi na oge na-abịa
  choice: E debere ndụ ebighị ebi dịka ihe a ga-anata n’oge na-abịa.
  alternative: Ime ka ndụ ebighị ebi bụrụ naanị ogologo ndụ n’oge ugbu a.
  rationale: Usoro okwu Grik na-eme ọdịiche doro anya n’etiti “oge a” na αἰών na-abịa.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ nhazi ahịrịokwu ahụ dịka akụkụ na-aga n’ihu site n’amaokwu bu ya ụzọ. E tinyere “ọ ga-anata” tupu “ndụ ebighị ebi” iji mee ka njikọ ngwaa ahụ doo anya n’Igbo, n’enweghị ịgbanwe ihe Grik pụtara.
