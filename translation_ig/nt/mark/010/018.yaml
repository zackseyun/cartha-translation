  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: ig
  text: Ma Jizọs sịrị ya, “Gịnị mere i ji akpọ m onye ọma?[a] Ọ dịghị onye bụ onye ọma ma e wezụga naanị otu—Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ ka nso n'okwu Grik, “Gịnị ka i ji akpọ m onye ọma?”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: ‘Ma’ na-egosi ntakịrị mgbanwe ma ọ bụ nzaghachi Jizọs nye okwu nwoke ahụ; ọ dabara n'usoro okwu Igbo.
- source_word: εἶπεν αὐτῷ
  choice: sịrị ya
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa nkenke isi sụgharị λέγω tinyere onye a gwara okwu.
- source_word: Τί
  choice: Gịnị mere
  rationale: Ọ bụ ezie na τί pụtara ‘gịnị’ n'ụzọ nkịtị, n'ajụjụ a ọ na-arụ ọrụ nke ‘gịnị mere/why’; nke a bụ okwu Igbo ebumpụta ụwa.
- source_word: με λέγεις ἀγαθόν
  choice: i ji akpọ m onye ọma
  rationale: Nke a na-echekwa echiche nke ịkpọ mmadụ ‘ọma’ dịka njirimara, ma na-ada nke ọma n'Igbo.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: onye ọma / ezi onye
  rationale: N'ọnọdụ abụọ ahụ okwu ahụ na-egosi ịdị mma. A gbanwere nhazi ya ntakịrị ka ahịrịokwu Igbo abụọ ahụ bụrụ ihe a na-asụ n'ụzọ ebumpụta ụwa, n'ebughị nkọwa omume ọzọ bata.
- source_word: οὐδεὶς
  choice: Ọ dịghị onye
  rationale: Nke a na-echekwa nkwụsi ike zuru ụwa ọnụ nke οὐδεὶς ma bụrụkwa Igbo doro anya.
- source_word: εἰ μὴ εἷς
  choice: ma e wezụga naanị otu onye
  rationale: Nke a na-egosi ma mwepu ahụ ma nkwusi ike e tinyere n'ịbụ naanị otu.
- source_word: ὁ θεός
  choice: Chineke
  rationale: ‘Chineke’ bụ aha a na-ejikarị akpọ God n'Igbo Standard, ọ dịghịkwa mkpa itinye mkpụrụokwu ọzọ nke ga-anọchi article Grik.
theological_decisions:
- issue: Ihe okwu Jizọs banyere ịdị mma nwere ike ịpụta n'ihe gbasara onye Kraịst bụ
  choice: Ịsụgharị okwu ahụ kpọmkwem n'etinyeghị nkọwa na-egosi na Jizọs na-agọnahụ ma ọ bụ na-ekwupụta ịbụ Chineke n'ụzọ doro anya n'amaokwu a.
  alternative: Ịsụgharị ya n'ụzọ ga-ekpebi na Jizọs gọnahụrụ ịdị nsọ ya, ma ọ bụ n'ụzọ ga-eme ka ọ bụrụ nkwupụta doro anya na ya bụ Chineke.
  rationale: 'Okwu Grik na-ahapụ esemokwu nkà mmụta okpukpe ahụ ka ọ dị: Jizọs na-ajụ ihe mere nwoke ahụ ji kpọọ ya onye ọma, wee kwuo na naanị Chineke bụ ezi onye. Nsụgharị ahụ ekwesịghị ikpebi ihe ederede ahụ ekwughị hoo haa.'
translation_notes:
  register: E ji Igbo Standard nke oge a, nke dị ugwu ma dị mfe nghọta. ‘Jizọs,’ ‘Chineke,’ ‘Gịnị mere,’ na ‘Ọ dịghị onye’ bụ ụdị okwu ndị a na-aghọta n'ọtụtụ ebe. Akara ukwu [a] dị n'ederede isi dịka achọrọ.
