  text: καὶ ἀποκριθεὶς ⸂αὐτῷ ὁ Ἰησοῦς εἶπεν⸃· Τί ⸂σοι θέλεις ποιήσω⸃; ὁ δὲ τυφλὸς εἶπεν αὐτῷ· Ραββουνι, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: ig
  text: Jizọs zara ya sị, “Gịnị ka ị chọrọ ka m meere gị?” Nwoke ahụ kpuru ìsì sịrị ya, “Rabuni,[a] ka m hụ ọzọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rabuni” bụ okwu Arameik e ji akpọ mmadụ; ọ pụtara “onye nkuzi m” ma ọ bụ “nna m ukwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: zara ya sị
  rationale: Nkebi okwu a na-egosi nzaghachi nke sochiri okwu; “zara ya sị” bụ ụzọ Igbo dị n’usoro ma doo anya isi jikọta participle ahụ na εἶπεν.
- source_word: Τί σοι θέλεις ποιήσω
  choice: Gịnị ka ị chọrọ ka m meere gị?
  rationale: “Meere gị” na-egosipụta dative σοι, ebe “ị chọrọ” na-ebute ike ọchịchọ dị na θέλεις n’Igbo nkịtị.
- source_word: τυφλὸς
  choice: nwoke ahụ kpuru ìsì
  rationale: Adjective a na-arụ ọrụ dịka aha mmadụ; ịgbakwunye “nwoke ahụ” na-eme ka ọ bụrụ Igbo eke ma na-echekwa onye a kpọrọ aha n’akụkọ ahụ.
- source_word: Ραββουνι
  choice: Rabuni
  rationale: E debere okwu Arameik a dịka utu-aha a kpọrọ Jizọs, kama ịgbanwe ya kpamkpam; odide “Rabuni” kwekọrọ na ụda na usoro mkpụrụedemede Igbo, ebe nkọwa ala peeji na-akọwa ihe ọ pụtara.
- source_word: ἵνα ἀναβλέψω
  choice: ka m hụkwa ụzọ ọzọ
  rationale: “Ka” na-echekwa nzube/arịrịọ nke ἵνα, ebe “hụkwa ụzọ ọzọ” na-egosi n’ụzọ Igbo dị ndụ na onye ahụ chọrọ inwetaghachi ịhụ ụzọ.
theological_decisions:
- issue: Otu e si sụgharị Ραββουνι dịka utu-aha a kpọrọ Jizọs
  choice: E debere “Rabuni” n’ahịrịokwu ma kọwaa ya n’ala peeji.
  alternative: “Onye Ozizi m” ma ọ bụ “Nna m ukwu”
  rationale: Grik ahụ n’onwe ya debere ụdị okwu Semitik a kama iji utu-aha Grik nkịtị dochie ya. Idebe ya na-echekwa agba akụkọ na mmetụta okwu ahụ, ebe nkọwa na-eme ka ndị na-agụ ya ghọta ya n’enweghị itinye echiche otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. A họọrọ “Jizọs zara ya sị” maka ịdị eke n’Igbo, ma debe usoro ajụjụ na arịrịọ nke isi mmalite. Ihe nrịbama [a] dị ozugbo n’akụkụ “Rabuni,” okwu nkọwa ya metụtara.
