  text: οἱ δὲ εἶπαν αὐτῷ· Δὸς ἡμῖν ἵνα εἷς ⸂σου ἐκ δεξιῶν⸃ καὶ εἷς ἐξ ⸀ἀριστερῶν καθίσωμεν ἐν τῇ δόξῃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: ig
  text: Ha sịrị ya, “Mee ka otu onye n’ime anyị nọdụ n’aka nri gị, onye nke ọzọkwa n’aka ekpe gị, n’ebube gị.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν ἵνα
  choice: Mee ka
  rationale: N’ebe a, okwu Grik a bụ arịrịọ ka Jizọs mee ka ihe ha na-arịọ bụrụ eziokwu; ‘Mee ka’ bụ ụzọ Igbo doro anya ma kwekọọ n’echiche ahụ.
- source_word: εἷς … καὶ εἷς
  choice: otu onye n’ime anyị … onye nke ọzọkwa
  rationale: Nke a na-eme ka o doo anya na ndị na-ekwu okwu na-arịọ maka oche abụọ ahụ maka onwe ha, dị ka ihe ndị gbara amaokwu ahụ gburugburu na-egosi.
- source_word: ἐκ δεξιῶν … ἐξ ἀριστερῶν
  choice: n’aka nri gị … n’aka ekpe gị
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi ọnọdụ dị n’akụkụ aka nri na aka ekpe mmadụ.
- source_word: ἐν τῇ δόξῃ σου
  choice: n’ebube gị
  rationale: ‘Ebube’ na-eburu echiche δόξα nke ịdị ukwuu na nsọpụrụ n’enweghị ịkọwa kpọmkwem ọdịdị ngosipụta ahụ.
theological_decisions:
- issue: Ihe ‘n’ebube gị’ pụtara kpọmkwem
  choice: E debere ya dịka ‘n’ebube gị.’
  alternative: ‘mgbe ị ga-abata n’alaeze ebube gị’
  rationale: Ihe odide Grik kwuru naanị ‘n’ebube gị’; ịgbakwunye ‘alaeze’ ma ọ bụ oge ọ ga-eme ga-akọwa ihe amaokwu ahụ hapụrụ nkenke.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E debere usoro arịrịọ ahụ nkenke, a gbakwụnyeghịkwa echiche na-adịghị n’ihe odide Grik.
