  source_fidelity: 'The Igbo accurately conveys the request introduced by Δὸς ἡμῖν ἵνα (“grant to us that”), the paired positions at Jesus’ right and left, and the final phrase ἐν τῇ δόξῃ σου (“in your glory”). “Otu onye n’ime anyị … onye nke ọzọkwa” appropriately makes explicit what the immediate discourse context identifies: the two speakers seek these places for themselves. No unsupported theological expansion is introduced.'
