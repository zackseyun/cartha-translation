  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: ig
  text: Ndị mmadụ nọ na-akpọtara ya ụmụaka ka o metụ ha aka[a], ma ndị na-eso ụzọ ya baara ha mba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ụmụntakịrị.” Okwu Grik παιδία nwere ike ịpụta ụmụaka n’ozuzu, gụnyere ụmụaka ka dị obere.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: nọ na-akpọtara
  rationale: Oge imperfect na-egosi omume gara n’ihu ma ọ bụ nke a na-eme ugboro ugboro; ‘nọ na-akpọtara’ na-echekwa echiche ahụ ma na-egosi na a na-akpọtara Jizọs ha.
- source_word: παιδία
  choice: ụmụaka
  rationale: Okwu a na-ezo aka n’ụmụaka n’ozuzu, gụnyere ndị ka dị obere; ‘ụmụaka’ bụ okwu Igbo doro anya ma saa mbara nke na-adịghị amanye nkọwa ‘ụmụ ọhụrụ.’
- source_word: ἵνα αὐτῶν ἅψηται
  choice: ka o metụ ha aka
  rationale: ἵνα na subjunctive na-egosi ebumnuche, ebe ἅπτομαι pụtara imetụ aka ma ọ bụ ijide; ntụgharị a na-enye isi okwu ahụ kpọmkwem n’etinyeghị omume ibikwasị aka sitere n’akụkọ ndị ọzọ.
- source_word: ἐπετίμησαν
  choice: baara ... mba
  rationale: Nkebi okwu Igbo ‘ịbara mmadụ mba’ na-egosi ịkatọ ma ọ bụ ịdọ mmadụ aka ná ntị n’ụzọ siri ike, ya mere ọ na-echekwa ike nke ἐπιτιμάω.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha a yikarịrị ka ọ na-ezo aka ná ndị na-akpọta ụmụaka ahụ. ‘Ha’ na-echekwa nnọchiaha nke isi mmalite ma hapụ ka ọnọdụ okwu gosi ndị ọ na-ezo aka na ha.
- source_word: δὲ
  choice: ma
  rationale: ‘Ma’ na-egosi obere ọdịiche dị n’etiti ndị mmadụ ịkpọta ụmụaka ahụ na mmeghachi omume ndị na-eso ụzọ.
theological_decisions:
- issue: Ndị ndị na-eso ụzọ baara mba
  choice: Ha baara ndị na-akpọta ụmụaka ahụ mba.
  alternative: Ha baara ụmụaka ahụ mba.
  rationale: Ndị e zoro aka na ha dịka ndị nọ na-akpọta ụmụaka bụ ndị αὐτοῖς yikarịrị ka ọ na-ezo aka na ha; nke a kwekọkwara n’usoro akụkọ na mmeghachi omume Jizọs n’amaokwu na-esote. N’agbanyeghị nke ahụ, ntụgharị bụ ‘ha’ iji chekwaa nnọchiaha na obere ohere nghọta dị na Grik.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘ndị mmadụ’ mee ka isiokwu plural a na-ekwughị aha ya doo anya n’Igbo, ma e jighị ya kọwaa kpọmkwem ndị ha bụ. Akara nkọwa [a] dị ozugbo n’ebe okwu metụtara ya dị.
