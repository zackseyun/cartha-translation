revisions:
- from: O si n’ebe ahụ bilie, gaa na mpaghara Judia na n’akụkụ nke ọzọ nke Osimiri Jọdan[a][b]. Ìgwè mmadụ bịakwutekwara ya, dịkwa ka ọ na-emebu, ọ kụzikwaara ha ihe.
  to: O biliri site n’ebe ahụ gaa na mpaghara Judia na n’ofe Osimiri Jọdan[a][b]. Ìgwè mmadụ bịakwutere ya ọzọ, dịkwa ka ọ na-emebu, ọ kuziri ha ihe ọzọ.
  rationale: The revision corrects the opening into idiomatic past-tense Standard Igbo while retaining the antecedent sense of ἀναστὰς. It explicitly preserves both occurrences of πάλιν as “ọzọ,” retains the geographical ambiguity in the text and footnote, and leaves both footnote anchors on the relevant geographical phrase.
