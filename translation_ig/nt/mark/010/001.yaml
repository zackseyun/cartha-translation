id: MRK.10.1
reference: Mark 10:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: ig
  text: O biliri site n’ebe ahụ gaa na mpaghara Judia na n’ofe Osimiri Jọdan[a][b]. Ìgwè mmadụ bịakwutere ya ọzọ, dịkwa ka ọ na-emebu, ọ kuziri ha ihe ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “n’ofe Osimiri Jọdan.” Okwu Grik ahụ nwere ike ịpụta mpaghara dị n’akụkụ nke ọzọ nke osimiri ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta okwu ndị a dị ka “mpaghara Judia nke dị n’akụkụ nke ọzọ nke Osimiri Jọdan,” kama ịghọta ha dị ka mpaghara Judia na mpaghara dị n’ofe Jọdan.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: si n’ebe ahụ
  rationale: Nke a na-egosi n’ụzọ doro anya na ọ hapụrụ ebe a kpọtụrụ aha tupu nke a.
- source_word: ἀναστὰς
  choice: bilie
  rationale: Ọ na-egosi omume bu ụzọ mee tupu ịga; ebe a, ọ pụtara ibili pụọ, ọ bụghị mbilite n’ọnwụ.
- source_word: ἔρχεται
  choice: gaa
  rationale: Ọ bụ ezie na Grik ji ugbu a akụkọ ihe mere eme, ‘gaa’ bụ ụzọ Igbo si akọ njem site n’ebe a hapụrụ gaa ebe ọzọ n’enweghị mgbagwoju anya.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: mpaghara Judia
  rationale: ὅρια nwere ike ịpụta ókè ma ọ bụ ala/mpaghara; ‘mpaghara’ dabara n’akụkọ njem ma ghara ime ka okwu ahụ bụrụ naanị ahịrị ókè.
- source_word: καὶ πέραν τοῦ Ἰορδάνου
  choice: na n’akụkụ nke ọzọ nke Osimiri Jọdan
  rationale: Nke a na-egosi ala dị n’ofe Jọdan ma na-edobe καὶ dị ka njikọ, n’agbanyeghị na nhazi okwu Grik ka nwere ụzọ abụọ e nwere ike isi ghọta ya.
- source_word: συμπορεύονται … ὄχλοι πρὸς αὐτόν
  choice: Ìgwè mmadụ bịakwutere ya
  rationale: N’ọnọdụ a, ngwaa ahụ na-egosi ìgwè mmadụ na-agbakọta bịakwute Jizọs; nke a bụ Igbo e ji eme ihe kwa ụbọchị ma na-edobe mmegharị ahụ n’ebe ọ nọ.
- source_word: πάλιν
  choice: -kwara
  rationale: Mgbakwunye ‘-kwara’ na ngwaa abụọ ahụ na-egosi ‘ọzọ’ ugboro abụọ dị ka ọ dị na Grik, n’enweghị ikwughachi okwu n’ụzọ siri ike.
- source_word: ὡς εἰώθει
  choice: dị ka ọ na-emebu
  rationale: Nke a na-egosi omume ọ na-eme mgbe niile n’Igbo dị mfe ma dị ùgwù.
- source_word: ἐδίδασκεν αὐτούς
  choice: ọ kụzikwaara ha ihe
  rationale: ‘Kụziiri ha ihe’ na-enye ihe imperfect ahụ pụtara n’akụkọ a; ‘-kwara’ na-edobe echiche nke ime ya ọzọ.
theological_decisions:
- issue: Ugbu a akụkọ ihe mere eme n’okwu ἔρχεται
  choice: E jiri ‘gaa’ n’ụdị akụkọ gara aga nke Igbo
  alternative: ‘ọ na-abịa’ ma ọ bụ ‘ọ bịara’
  rationale: Igbo nkịtị anaghị eji ugbu a n’ebe a n’ụzọ ga-adị mfe ma doo anya; mgbanwe oge ngwaa anaghị agbanwe ihe omume ma ọ bụ ozizi dị na ya.
- issue: Nhazi okwu καὶ πέραν τοῦ Ἰορδάνου
  choice: ‘mpaghara Judia na n’akụkụ nke ọzọ nke Osimiri Jọdan’ dị ka nkọwa ebe abụọ jikọtara ọnụ
  alternative: ‘mpaghara Judia nke dị n’akụkụ nke ọzọ nke Osimiri Jọdan’ dị ka otu mpaghara
  rationale: Grik ahụ dị mkpirikpi, o nwekwara ike ịkwado nghọta abụọ ahụ. E debere isi ederede nso n’usoro Grik, ebe nkọwa ala ala peeji na-echekwa nghọta nke ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. ‘Mpaghara’ ka a họọrọ kama ‘ókèala’ iji zere echiche na ọ bụ naanị ahịrị ókè ka a na-ekwu. E tinyere akara nkọwa [a] na [b] n’akụkụ ahịrịokwu gbasara Jọdan, ebe ha na-akọwa, kama idowe ha n’ebe na-agaghị adabara ọdịnaya ha.
