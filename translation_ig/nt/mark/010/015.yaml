id: MRK.10.15
reference: Mark 10:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: ig
  text: 'N’ezie, ana m agwa unu: onye ọ bụla na-adịghị anabata alaeze Chineke dị ka nwatakịrị[a] agaghị abanye n’ime ya ma ọlị.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nkebiokwu a nwere ike na-ezo aka n’ịdị umeala n’obi, ntụkwasị obi, ma ọ bụ ịdabere n’ebe onye ọzọ nọ dịka nwatakịrị; ma Grik ekwughị kpọmkwem àgwà nke e bu n’uche.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: N’ezie
  rationale: Ọ na-ebute okwu e kwuru n’ụzọ siri ike ma nwee ikike. “N’ezie” na-egosipụta ọrụ okwu ahụ n’Igbo nkịtị n’ebugharịghị ụdị okwu Hibru/Arameik ahụ ozugbo.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a isi kwuo na onye na-ekwu okwu na-agwa ọtụtụ mmadụ okwu.
- source_word: ὃς ἂν
  choice: onye ọ bụla
  rationale: Njikọ nnọchiaha ahụ na ἄν na-enye echiche zuru ụwa ọnụ nke na-adịghị akọwa otu onye kpọmkwem; “onye ọ bụla” na-egosipụta nke a nke ọma.
- source_word: μὴ δέξηται
  choice: na-anabataghị
  rationale: δέχομαι nwere ike ịpụta ịnata, ịnabata, ma ọ bụ ịnabata nke ọma. “Ịnabata” dabara n’ebe ihe a na-anabata bụ alaeze Chineke, ma ghara ime ka ọ bụrụ ihe mmadụ ji ike ya nweta.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ okwu doro anya nke na-echekwa ma echiche ọchịchị Chineke ma echiche mpaghara ọchịchị ya, n’akọwaghị otu akụkụ karịa nke ọzọ.
- source_word: ὡς παιδίον
  choice: dị ka nwatakịrị
  rationale: ὡς bụ ntụnyere, παιδίον bụkwa nwatakịrị. Nsụgharị a na-echekwa ntụnyere ahụ n’akọwaghị ma ihe e bu n’uche bụ ịdị umeala n’obi, ntụkwasị obi, ma ọ bụ ịdabere n’ebe onye ọzọ nọ.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: agaghị abanye … ma ọlị
  rationale: οὐ μή na subjọnktivu aorist bụ nkwụsi ike siri ike. “Agaghị … ma ọlị” na-egosipụta nkwenye siri ike ahụ n’Igbo dị ugbu a.
- source_word: εἰς αὐτήν
  choice: n’ime ya
  rationale: Nnọchiaha ahụ na-alaghachi n’alaeze Chineke; “n’ime ya” na-echekwa echiche nke ịbanye n’ime alaeze ahụ.
theological_decisions:
- issue: Ihe ịnabata alaeze Chineke “dị ka nwatakịrị” pụtara
  choice: E debere ntụnyere ahụ n’ụdị ghere oghe n’akọwaghị àgwà nwatakịrị e bu n’uche.
  alternative: Ịkọwa ya kpọmkwem dịka ịdị umeala n’obi, ntụkwasị obi, ma ọ bụ ịdabere n’ebe onye ọzọ nọ.
  rationale: Grik na-enye ntụnyere ahụ, ma ọ naghị ekwu kpọmkwem àgwà nwatakịrị e bu n’uche. Ịhapụ ya otú a na-echekwa nghọta dị iche iche isi mmalite ahụ nwere ike ibu, kama itinye nkọwa otu ozizi n’ime amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ana m agwa unu” na “ma ọlị” bụ okwu nkịtị na-egosipụta kpọmkwem okwu a na ike nkwụsi ike dị na Grik, ebe “dị ka nwatakịrị” na-echekwa nghọta ghere oghe nke ntụnyere ahụ.
