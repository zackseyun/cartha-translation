    reason: πάλιν nwere ike ịkọwa na ha lọghachiri n’ụlọ, ma ọ bụ na ndị na-eso ụzọ ya jụrụ ya ajụjụ a ọzọ.
  revision_rationale: The revision makes the primary narrative sense of εἰς τὴν οἰκίαν πάλιν explicit in idiomatic Igbo (“lọghachiri n’ụlọ”), preserves the imperfect with “nọ na-ajụ,” and retains the possible alternative attachment of πάλιν in a footnote without forcing a disputed syntactic nuance.
