  text: Καὶ ⸂εἰς τὴν οἰκίαν⸃ πάλιν οἱ μαθηταὶ ⸂περὶ τούτου⸃ ⸀ἐπηρώτων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: ig
  text: Mgbe ha lọghachiri n’ụlọ, ndị na-eso ụzọ ya nọ na-ajụ ya banyere okwu a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “Mgbe ha nọ n’ụlọ, ndị na-eso ụzọ ya nọ na-ajụkwa ya banyere okwu a.”'
    reason: πάλιν nwere ike ịkọwa na ha lọghachiri n’ụlọ, ma ọ bụ na ndị na-eso ụzọ ya jụrụ ya ajụjụ a ọzọ.
lexical_decisions:
- source_word: Καὶ
  choice: Mgbe
  rationale: N’Igbo, njikọ a na-edobe usoro akụkọ n’ụzọ dị nro; a hapụrụ ‘na’ kpọmkwem iji zere ahịrịokwu siri ike.
- source_word: εἰς τὴν οἰκίαν
  choice: ha nọ n’ụlọ
  rationale: Ọ bụ ezie na εἰς pụtara n’ụzọ nkịtị ‘banye n’ụlọ,’ n’ebe a ọ na-egosi ọnọdụ ha nọ mgbe mkparịta ụka nzuzo malitere.
- source_word: πάλιν
  choice: kwa
  rationale: πάλιν nwere ike ịkọwa ịnọ ha ọzọ n’ụlọ ma ọ bụ ịjụ ajụjụ ọzọ. ‘Kwa’ na-ahapụ njikọ ya ka ọ ghara ido anya kpamkpam dịka o si dị na Grik.
- source_word: οἱ μαθηταὶ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-eso Jizọs; ‘ya’ na-eme ka onye ha na-eso doo anya n’asụsụ Igbo.
- source_word: περὶ τούτου
  choice: banyere okwu a
  rationale: ‘Okwu a’ na-ezo aka n’ihe a ka kwurula banyere ịgba alụkwaghịm, ma ọ naghị akọwa ya karịa isi mmalite.
- source_word: ἐπηρώτων
  choice: nọ na-ajụ
  rationale: Ọdịdị imperfect na-egosi omume gara n’ihu ma ọ bụ e mere ugboro ugboro; ‘nọ na-ajụ’ na-egosipụta nke a n’Igbo na-enweghị itinye echiche ‘malitere’ nke na-adịghị kpọmkwem na Grik.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs dịka onye a na-ajụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji akara ụda olu naanị ebe ọkọlọtọ odide chọrọ ya; e chekwara ntakịrị mgbagwoju anya nke ọnọdụ πάλιν site n’isiokwu nkọwa.
