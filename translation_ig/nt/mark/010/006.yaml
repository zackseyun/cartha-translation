  text: ἀπὸ δὲ ἀρχῆς κτίσεως ἄρσεν καὶ θῆλυ ἐποίησεν ⸀αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/006.yaml
  text: But from the beginning of creation[b][a], he made them male and female.
translation:
  language: ig
  text: Ma site ná mmalite nke okike, o mere[a] ha nwoke na nwanyị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “o kere.” Ngwaa Grik dị ebe a pụtara “mere,” ọ bụ ezie na “kere” na-eme ka ndabere ya n'akụkọ Jenesis pụta ìhè.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nwoke na nwanyị ka o mere ha.” Nke a na-esochikwu usoro okwu Grik.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ
  choice: site ná
  rationale: N'ebe a, ἀπό na-egosi ebe oge si malite; “site ná” na-egosipụta nke a nke ọma n'Igbo.
- source_word: δὲ
  choice: Ma
  rationale: δέ na-egosi ọdịiche dị n'etiti ihe a na nkwenye e kwuru tupu ya banyere ịgba alụkwaghịm.
- source_word: ἀρχῆς κτίσεως
  choice: mmalite nke okike
  rationale: Nke a na-edobe njikọ genitiv ahụ n'ụzọ doro anya ma dịkwa mfe nghọta n'Igbo.
- source_word: ἄρσεν καὶ θῆλυ
  choice: nwoke na nwanyị
  rationale: N'Igbo a na-asụ ugbu a, okwu abụọ a bụ ụzọ ebumpụta ụwa e si akọwa mmadụ dịka nwoke na nwanyị; ha na-echekwa njikọ nke okwu Grik ahụ n'akwụkwọ Jenesis.
- source_word: ἐποίησεν
  choice: o mere
  rationale: ποιέω pụtara “ime” n'ụzọ kwụ ọtọ. Ọ bụ ezie na “o kere” dabara n'ọnọdụ akụkọ okike, “o mere” na-esochikwu ngwaa Grik e ji mee ihe ebe a.
- source_word: αὐτούς
  choice: ha
  rationale: Nnochiaha a na-ezo aka n'ụmụ mmadụ ahụ e mere nwoke na nwanyị; “ha” anaghị agbakwụnye nkwusi ike na-adịghị n'okwu Grik.
theological_decisions:
- issue: Okwu e ji akọwa nwoke na nwanyị n'ahịrị e hotara na Jenesis
  choice: nwoke na nwanyị
  alternative: oke na nwanyị
  rationale: “Nwoke na nwanyị” bụ okwu dị ùgwù ma doo ndị na-agụ Igbo anya mgbe a na-ekwu banyere ụmụ mmadụ. Ọ na-echekwa ọdịiche ἄρσεν/θῆλυ n'enweghị ibubata echiche ọzọ gbasara ọrụ mmadụ n'obodo.
- issue: Onye mere ha, bụ́ onye a na-akpọghị aha kpọmkwem na Grik
  choice: o mere ha
  alternative: Chineke mere ha
  rationale: Ngwaa Grik ahụ nwere onye nke atọ otu, ma aha onye mere ihe ahụ adịghị n'amaokwu a. “O mere ha” na-echekwa nke a; itinye “Chineke” ga-eme ka ihe a ghọtara site n'ọnọdụ okwu ghọọ ihe agbakwunyere n'amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrị bụ isi na-eji usoro okwu Igbo ebumpụta ụwa, ebe nkọwa [b] na-enye usoro nke na-esochikwu Grik.
