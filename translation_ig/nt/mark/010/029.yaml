id: MRK.10.29
reference: Mark 10:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: ig
  text: Jizọs kwuru, “N’ezie, ana m asị unu, ọ dịghị onye ọ bụla hapụrụ ụlọ, ma ọ bụ ụmụnne nwoke, ma ọ bụ ụmụnne nwanyị, ma ọ bụ nne, ma ọ bụ nna, ma ọ bụ ụmụ, ma ọ bụ ubi, n’ihi m na n’ihi oziọma ahụ,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: kwuru
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi webata okwu Jizọs, n’etinyeghị echiche ọzọ na-adịghị n’okwu Grik.
- source_word: Ἀμὴν
  choice: N’ezie
  rationale: N’ọnọdụ a, ọ na-ebute okwu nkwenye siri ike; “N’ezie” bụ okwu Igbo doro anya ma dịkwa ugwu.
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Nke a na-echekwa ụdị okwu kpọmkwem na ịdị solemnụ nke usoro Grik ahụ n’Igbo dị ugbu a.
- source_word: οὐδείς ἐστιν ὃς
  choice: ọ dịghị onye ọ bụla
  rationale: Ọ na-egosipụta n'ụzọ Igbo ebumpụta ụwa na nkwupụta ahụ metụtara mmadụ niile n’enweghị onye e wepụrụ.
- source_word: ἀφῆκεν
  choice: hapụrụ
  rationale: “Hapụrụ” na-egosipụta ịla n’azụ ma ọ bụ ịpụ n’ebe ihe na ndị a nọ, n’ebughị ụzọ kwuo na onye ahụ jụrụ ha kpamkpam ma ọ bụ gbahapụ ibu ọrụ ya.
- source_word: οἰκίαν
  choice: ụlọ
  rationale: Nke a bụ ntụgharị kpọmkwem ma bụrụkwa okwu ndị Igbo na-eji kwa ụbọchị maka ebe obibi.
- source_word: ἀδελφοὺς
  choice: ụmụnne nwoke
  rationale: Ebe okwu Grik a kpọrọ ụmụnne ndị nwoke aha iche, okwu a na-echekwa nkewa ahụ.
- source_word: ἀδελφὰς
  choice: ụmụnne nwanyị
  rationale: Ọ bụ ntụgharị kpọmkwem nke ụmụnne ndị nwanyị, bụ́ ndị e depụtara iche na ụmụnne ndị nwoke.
- source_word: μητέρα
  choice: nne
  rationale: Ọ bụ okwu Igbo kpọmkwem maka “mother.”
- source_word: πατέρα
  choice: nna
  rationale: Ọ bụ okwu Igbo kpọmkwem maka “father.”
- source_word: τέκνα
  choice: ụmụ
  rationale: N’ebe a, “ụmụ” na-egosi ụmụ mmadụ mụrụ n’enweghị ikewa ha dịka nwoke na nwanyị.
- source_word: ἀγρούς
  choice: ubi
  rationale: “Ubi” bụ okwu Igbo doro anya maka ala a na-akọ ma kwekọọ nke ọma na ἀγρούς.
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: n’ihi m na n’ihi oziọma ahụ
  rationale: 'Nke a na-echekwa ihe abụọ ahụ dị ka ihe kpatara ịhapụ ihe ndị e depụtara: Jizọs na oziọma ahụ.'
theological_decisions:
- issue: Ịsụgharị ndepụta ihe a hapụrụ n’emeghị ka ọ pụta na onye ahụ ajụla ezinụlọ ya ma ọ bụ ibu ọrụ ya kpamkpam
  choice: hapụrụ ụlọ ... ma ọ bụ ubi
  alternative: gbahapụrụ ụlọ ... ma ọ bụ ubi
  rationale: “Hapụrụ” na-echekwa ịdị arọ nke ihe mmadụ na-atụfu n’ihi iso Jizọs, ma ọ naghị etinye echiche siri ike nke ịjụ ezinụlọ kpamkpam, nke okwu ahụ n’onwe ya ekwughị hoo haa.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa ugwu. E debere usoro ndepụta ahụ na nkwughachi “ma ọ bụ” iji mee ka ihe ọ bụla a kpọrọ aha doo anya, ma chekwaa ọdịdị okwu Grik.
