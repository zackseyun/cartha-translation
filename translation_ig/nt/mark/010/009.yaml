review_pass:
  verdict: revise
  source_fidelity: Draft preserves the inferential “Ya mere,” God as agent, and the generic force of ἄνθρωπος. However, “atọsala ya” is not a clear or natural rendering of the present prohibitive imperative μὴ χωριζέτω, and the added pronoun “ya” makes the object less explicit than the Greek relative clause.
  naturalness: “Ka mmadụ ghara ikewapụ ihe Chineke jikọtara ọnụ” is clear, idiomatic Standard Igbo for a general prohibition and retains the explicit object.
  terminology: “Chineke,” “mmadụ,” “jikọtara ọnụ,” and “ikewapụ” are appropriate, dignified terms in this marriage context. “Mmadụ” naturally carries the generic human sense and does not require a male-only reading.
  issues:
