    issue: “atọsala ya” is an unsuitable/unclear form for the prohibition.
    rationale: 'The Greek μὴ χωριζέτω is a present imperative prohibition: “let no person separate.” “Atọsala ya” does not plainly express that ongoing prohibition in modern Standard Igbo and obscures the direct object with “ya.”'
  - severity: low
    issue: The relative object should remain explicit in the prohibition.
    rationale: Repeating “ihe Chineke jikọtara ọnụ” after the prohibitive clause directly reflects ὃ ... συνέζευξεν and avoids ambiguity about what is not to be separated.
