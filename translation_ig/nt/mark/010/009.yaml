  text: ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: ig
  text: Ya mere, ka mmadụ[a] ghara ikewapụ ihe Chineke jikọtara ọnụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ebe a, “mmadụ” pụtara onye ọ bụla; okwu Grik ahụ dị n'ụdị otu onye ma a na-eji ya ekwu maka mmadụ n'izugbe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: ihe ... ya
  rationale: A na-eji “ihe” amalite nkebiokwu ntụaka ahụ, ebe “ya” na-eme ka ahịrịokwu ahụ bụrụ Igbo eke ma na-ezo aka n'ihe ahụ Chineke jikọtara ọnụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n'ihe Jizọs kwuru tupu nke a banyere nzube Chineke maka alụmdi na nwunye.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ aha onye mere omume ahụ, e sikwa otú a na-akpọ God n'Igbo nkịtị.
- source_word: συνέζευξεν
  choice: jikọtara ọnụ
  rationale: Ọ na-egosi na Chineke mere ka ha abụọ bụrụ otu njikọ. Okwu a bụ nke eke n'Igbo, ma ọ naghị amanye ihe atụ nke ịnya yok n'ahịrịokwu ahụ.
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: “Mmadụ” na-egosipụta otu onye n'ụdị izugbe, ya bụ, onye ọ bụla, n'enweghị ime ka iwu ahụ bụrụ naanị maka nwoke.
- source_word: μὴ χωριζέτω
  choice: atọsala ya
  rationale: Ụdị mmachibido iwu a na-enye iwu doro anya ka onye ọ bụla ghara ịtọsa njikọ Chineke mere.
theological_decisions:
- issue: Ike izugbe nke ἄνθρωπος n'okwu gbasara alụmdi na nwunye
  choice: A sụgharịrị ya “mmadụ,” nke pụtara onye ọ bụla.
  alternative: nwoke
  rationale: N'okwu Grik a, ἄνθρωπος bụ otu onye e ji anọchi anya mmadụ niile; “mmadụ” na-echekwa ike izugbe ahụ n'Igbo ma ghara ime ka ndị na-agụ ya chee na ọ bụ naanị nwoke ka iwu a metụtara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Atọsala ya” bụ mmachibido iwu kpọmkwem ma kwekọọ n'okwu gbasara ịtọsa njikọ alụmdi na nwunye.
