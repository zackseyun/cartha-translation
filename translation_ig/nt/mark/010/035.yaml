    text: A pụkwara ịsụgharị ya, “bịaruru ya nso.” Ngwaa Grik ahụ na-egosi ngagharị ịbịakwute ya.
    reason: lexical_alternative
  revision_rationale: The revision explicitly retains ‘sons,’ smooths the sequential narrative wording, and relocates the lexical footnote marker to the verb phrase it actually explains. The footnote is also kept within the wording of the verse by saying ‘ya’ rather than supplying Jesus’ name.
