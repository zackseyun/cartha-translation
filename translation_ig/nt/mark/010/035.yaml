id: MRK.10.35
reference: Mark 10:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: ig
  text: Jemis na Jọn, ụmụ nwoke Zebedi, bịakwutere ya[a] wee sị ya, “Onye Ozizi, anyị chọrọ ka i meere anyị ihe ọ bụla anyị ga-arịọ gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “bịaruru ya nso.” Ngwaa Grik ahụ na-egosi ngagharị ịbịakwute ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπορεύονται
  choice: bịakwutere ya
  rationale: Ọ na-egosi na ha bịaruru Jizọs nso; e jiri oge gara aga kọọ historical present ahụ n’ụzọ Igbo si akọ akụkọ nke ọma.
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: ụmụ Zebedi
  rationale: Nke a bụ ụzọ Igbo doro anya na nke eke si akọwa na ha bụ ụmụ nwoke Zebedi, n’enweghị mkpa itinye okwu ‘ndị nwoke’ ebe ọnọdụ ahụ emeela ka o doo anya.
- source_word: λέγοντες αὐτῷ
  choice: sị ya
  rationale: Ọ na-agbanwe participle Grik ka ọ bụrụ ngwaa zuru ezu nke dabara n’akụkọ Igbo ma chekwaa onye a gwara okwu.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Ọ na-egosipụta kpọmkwem ọrụ onye na-akụzi, kama iji aha nwere ike ịgbasawanye gaa n’echiche nke onye nwe ma ọ bụ onye ọchịchị.
- source_word: θέλομεν
  choice: anyị chọrọ
  rationale: Nke a bụ okwu Igbo dị ugbu a, kwụ ọtọ, nke na-egosipụta ọchịchọ ha nke ọma.
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ na-ewebata ihe ha chọrọ ka Jizọs mee n’ụzọ dị mma ma bụrụkwa nke eke n’Igbo.
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: ihe ọ bụla anyị ga-arịọ gị
  rationale: ‘Ihe ọ bụla’ na-echekwa indefiniteness nke ὃ ἐάν, ebe ‘anyị ga-arịọ gị’ na-egosipụta arịrịọ ahụ n’enweghị ịkọwa ihe ọ bụ tupu oge eruo.
- source_word: ποιήσῃς ἡμῖν
  choice: i meere anyị
  rationale: Ọ na-echekwa nkọwa sara mbara nke ποιέω na uru e mere ‘anyị,’ n’enweghị ịtụgharị ya n’ụzọ ga-abụ ‘inye’ ma ọ bụ ‘ikwe’ naanị.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. E debere arịrịọ ụmụ Zebedi n’ụdị kwụ ọtọ nke amaokwu Grik ahụ, n’enweghị ime ka ọ dịkwuo nro ma ọ bụ kọwaa ebumnuche ha.
