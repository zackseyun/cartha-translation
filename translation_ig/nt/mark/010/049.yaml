  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: ig
  text: Jizọs wee kwụsị[a] sị, “Kpọọnụ ya.” Ha wee kpọọ nwoke ahụ kpuru ìsì, sị ya, “Ka obi sie gị ike[b]; bilie, ọ na-akpọ gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “wee guzo”; n’ebe a, ọ pụtara na ọ kwụsịrị ije.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Nwee obi ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: wee kwụsị
  rationale: Ọ bụ ezie na ọdịdị okwu a pụtara n'ụzọ nkịtị ‘guzoro,’ n’akụkọ a ọ na-egosi na Jizọs kwụsịrị ije ya. ‘Wee kwụsị’ bụ Igbo doro anya ma dịkwa mma n’ọnọdụ a.
- source_word: Φωνήσατε αὐτόν
  choice: Kpọọnụ ya
  rationale: φωνέω n’ebe a pụtara ịkpọ mmadụ ka ọ bịa. ‘Kpọọnụ ya’ na-enye iwu ahụ kpọmkwem ma na-echekwa nkwughachi nke otu ngwaa ahụ n’amaokwu ahụ.
- source_word: φωνοῦσι
  choice: Ha wee kpọọ
  rationale: ‘Kpọọ’ na-echekwa njikọ okwu ya na iwu Jizọs nyere, ma ‘wee’ na-egosi usoro ihe ndị mere n’akụkọ ahụ.
- source_word: τὸν τυφλὸν
  choice: nwoke ahụ kpuru ìsì
  rationale: τυφλός bụ nkọwa e ji mee aha mmadụ n’ebe a. N’ihi na ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ nwoke, okwu a bụ Igbo nkịtị ma doo anya.
- source_word: Θάρσει
  choice: Ka obi sie gị ike
  rationale: Iwu a bụ okwu agbamume na mmesi obi ike. Nkebiokwu Igbo a na-ebunye ike na nkasi obi dị n’okwu Grik ahụ n’ụzọ sitere n’ọnụ mmadụ.
- source_word: ἔγειρε
  choice: bilie
  rationale: Iwu a na-akpọ ya ka o si n’ọnọdụ ọ nọ bilie. ‘Bilie’ dị nkenke, kwụ ọtọ, ma dabara n’ihe a tụrụ anya ka Batimiọs mee ozugbo.
- source_word: φωνεῖ σε
  choice: ọ na-akpọ gị
  rationale: Oge ugbu a nke ngwaa Grik ahụ na-egosi na ọkpụkpọ ahụ na-eme ugbu a. ‘Ọ na-akpọ gị’ na-echekwa ịdị ngwa nke ọkpụkpọ Jizọs.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. E chekwara nkwughachi nke φωνέω site n’iji ‘kpọọ’ ugboro atọ, ma dozie akara nkọwa ala peeji ka nke ọ bụla soro okwu ọ na-akọwa.
