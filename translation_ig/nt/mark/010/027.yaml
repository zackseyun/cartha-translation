  to: Jizọs legidere ha anya wee sị, “N’ebe ụmụ mmadụ nọ, ọ gaghị ekwe omume, ma ọ bụghị n’ebe Chineke nọ, n’ihi na ihe niile pụrụ ime n’ebe Chineke nọ.”
  rationale: The revision retains the original’s deliberate contrast and broad “all things,” while replacing a potentially future-oriented final verb with an idiomatic present statement of possibility. No footnote is required.
