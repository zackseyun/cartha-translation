  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: ig
  text: Jizọs legidere ha anya wee sị, “N’ebe ụmụ mmadụ nọ, ọ gaghị ekwe omume, ma ọ bụghị n’ebe Chineke nọ, n’ihi na ihe niile pụrụ ime n’ebe Chineke nọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας αὐτοῖς
  choice: legidere ha anya
  rationale: Na-egosipụta ile mmadụ anya nke ọma ma ọ bụ ilegide ya anya, ọ bụghị naanị ịhụ ya.
- source_word: Παρὰ ἀνθρώποις
  choice: N’ebe ụmụ mmadụ nọ
  rationale: Na-echekwa ihe owuwu παρά nke na-egosi ihe dị n’aka ma ọ bụ n’ike mmadụ.
- source_word: ἀδύνατον
  choice: nke a agaghị ekwe omume
  rationale: Ihe a na-ekwu maka ya sitere n’ọnọdụ amaokwu ndị bu ụzọ; ‘nke a’ na-eme ka Igbo doo anya n’etinyeghị nkọwa ozizi ọzọ.
- source_word: δυνατὰ
  choice: ga-ekwe omume
  rationale: Ntụgharị Igbo nkịtị na nke doro anya maka ihe mmadụ nwere ike ime ma ọ bụ ihe nwere ike ime.
- source_word: παρὰ τῷ θεῷ
  choice: n’ebe Chineke nọ
  rationale: Na-edobe myirịta dị n’etiti ‘n’ebe ụmụ mmadụ nọ’ na ‘n’ebe Chineke nọ,’ ma na-egosi na ikike ahụ dị n’aka Chineke.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Na-egosipụta ihe kpatara okwu bu ya ụzọ, kwekọrọ n’ọrụ njikọ nkọwa γάρ n’ebe a.
theological_decisions:
- issue: Oke okwu ‘ihe niile’
  choice: E debere ya dịka ‘ihe niile’ n’enweghị nkọwa mgbakwunye.
  alternative: Ịkọwa ya dịka naanị ihe niile gbasara nzọpụta.
  rationale: πάντα bụ okwu sara mbara n’usoro ahịrịokwu ahụ; ọnọdụ gbara ya gburugburu na-edu nghọta ya, ma ntụgharị ekwesịghị itinye oke ozizi na-adịghị n’ahịrịokwu Grik.
- issue: Ihe dị iche n’ike mmadụ na nke Chineke
  choice: E chekwara myirịta ‘n’ebe ụmụ mmadụ nọ ... n’ebe Chineke nọ.’
  alternative: ‘Ụmụ mmadụ enweghị ike ... Chineke nwere ike.’
  rationale: Nhọrọ ahụ na-edobe ụdị okwu na esemokwu dị n’akwụkwọ mbụ n’enweghị ime ka ọ ghọọ nkọwa nkà mmụta okpukpe.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘Jizọs’ na ‘Chineke’ dịka mkpụrụokwu ndị a na-amakarị. Enweghị akara ntụaka ala peeji n’ihi na ọ dịghị ntụaka dị mkpa n’amaokwu a.
