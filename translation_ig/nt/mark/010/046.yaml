source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: ig
  text: Ha rutere Jeriko.[a] Mgbe Jizọs na-apụ na Jeriko, ya na ndị na-eso ụzọ ya na nnukwu ìgwè mmadụ, Batimiọs, nwa Timiọs, onye kpuru ìsì, onye arịrịọ, nọ ọdụ n'akụkụ ụzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N''asụsụ Grik, e ji oge ugbu a nke akụkọ kwuo ya: “Ha na-abịa Jeriko.” E ji oge gara aga sụgharịa ya ebe a ka akụkọ ahụ daa nke ọma n''Igbo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: Ha bịarutere
  rationale: Ọ bụ ezie na Grik ji oge ugbu a nke akụkọ, oge gara aga na-eme ka akụkọ ahụ daa nke ọma n'Igbo ma na-echekwa usoro ihe ndị mere.
- source_word: ἐκπορευομένου αὐτοῦ
  choice: Mgbe Jizọs ... na-apụ
  rationale: Nke a na-egosi ihe na-eme n'otu oge ahụ. Ịkpọ aha Jizọs kama iji naanị nnọchiaha na-eme ka onye a na-ekwu banyere ya doo anya n'Igbo.
- source_word: ὄχλου ἱκανοῦ
  choice: oké ìgwè mmadụ
  rationale: ἱκανός n'ebe a na-egosi ìgwè buru ibu ma ọ bụ bara ụba; okwu a bụ Igbo doro anya ma dị mfe nghọta.
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: Batimiọs, nwa Timiọs
  rationale: A hapụrụ ma aha onye ahụ ma nkọwa Mak nyere banyere ya, n'usoro dabara n'Igbo.
- source_word: τυφλὸς
  choice: onye kpuru ìsì
  rationale: Nke a bụ ụzọ Igbo nkịtị, doro anya e si akọwa onye na-adịghị ahụ ụzọ.
- source_word: προσαίτης
  choice: na-arịọ arịrịọ
  rationale: N'ọnọdụ a, nkebiokwu a na-ekwupụta na ọ bụ onye na-arịọ ihe n'aka ndị mmadụ, n'asụsụ Igbo dị ugbu a ma na-enweghị okwu mkparị.
- source_word: παρὰ τὴν ὁδόν
  choice: n'akụkụ ụzọ
  rationale: παρά na-egosi ebe dị n'akụkụ ụzọ; nsụgharị a dị nkenke ma bụrụkwa nke e ji eme ihe n'Igbo.
- source_word: Ἰεριχώ
  choice: Jeriko
  rationale: Nke a bụ ndegharị aha obodo ahụ n'ụdị dabara na mkpụrụokwu na mkpọpụta Igbo.
theological_decisions:
- issue: Otu e si kọwaa Batimiọs n'akụkọ ahụ
  choice: Idowe ma aha Batimiọs ma nkọwa ‘nwa Timiọs’ n'ahịrịokwu bụ isi.
  alternative: Ịhapụ otu n'ime ha ma sụgharịa naanị ‘nwa Timiọs’ ma ọ bụ naanị ‘Batimiọs.’
  rationale: Ederede Grik nyere aha abụọ ahụ n'ụzọ nkọwa; idowe ha abụọ na-echekwa nkọwa Mak ma ghara itinye nkọwa ozizi nke na-adịghị na ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘oké ìgwè mmadụ’ maka okwu sitere na ὄχλου ἱκανοῦ, ma jiri ‘n'akụkụ ụzọ’ sụgharịa παρὰ τὴν ὁδόν. Akara ndetu [a] dị n'ahịrịokwu bụ isi.
