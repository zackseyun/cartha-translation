    text: 'N''asụsụ Grik, e ji oge ugbu a nke akụkọ kwuo ya: “Ha na-abịa Jeriko.” E ji oge gara aga sụgharịa ya ebe a ka akụkọ ahụ daa nke ọma n''Igbo.'
    reason: lexical_alternative
  revision_rationale: The revision improves Standard Igbo idiom and renders the Greek noun προσαίτης as the clear nominal expression “onye arịrịọ.” It also uses “nnukwu ìgwè mmadụ” for the substantial, rather than necessarily extraordinary, crowd. The wording continues to reflect the contemporaneous departure from Jericho and retains all source identifications without doctrinal expansion.
