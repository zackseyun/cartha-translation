  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: ig
  text: Jizọs wee sị ya, “Gaa; okwukwe[c] gị azọpụtala gị[a].” Ozugbo ahụ, ọ hụziri ụzọ, na-esokwa ya n'ụzọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “emewo ka ahụ dị gị mma” ma ọ bụ “agwọọla gị.” Ngwaa Grik a pụrụ izo aka n'ọgwụgwọ nakwa na nzọpụta.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “n'okporo ụzọ.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara iji “ntụkwasị obi” kwupụta “okwukwe” n'ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὕπαγε
  choice: Laa
  rationale: Nke a bụ iwu ka nwoke ahụ pụọ ma ọ bụ gaa; “Laa” bụ okwu Igbo doro anya, dịkwa nkenke, nke na-etinyeghị echiche nke ‘ụzọ gị’ na-adịghị n'okwu Grik.
- source_word: πίστις
  choice: okwukwe
  rationale: “Okwukwe” na-edobe isi okwu ahụ n'ụzọ a na-amata nke ọma, ma n'ọnọdụ a ọ na-egosi ntụkwasị obi nwoke ahụ tụkwasịrị Jizọs.
- source_word: σέσωκέν
  choice: azọpụtala gị
  rationale: Oge perfect dị n'okwu Grik na-egosi ihe mezuru nke nsonaazụ ya ka dị. “Azọpụtala” na-edobe obosara σῴζω, nke pụrụ ịpụta nzọpụta ma ọ bụ ime ka onye ahụ dị mma, kama imechi ya naanị n'ịgwọ anya.
- source_word: εὐθύς
  choice: Ozugbo ahụ
  rationale: Nke a na-egosipụta ngwa ngwa akụkọ Mak ma bụrụ okwu Igbo a na-aghọta nke ọma.
- source_word: ἀνέβλεψεν
  choice: ọ malitere ịhụ ụzọ ọzọ
  rationale: N'ọnọdụ nwoke kpuru ìsì, ngwaa ahụ pụtara na e weghachiri ọhụụ ya; ntụgharị a na-ekwu nke ahụ n'Igbo nkịtị.
- source_word: ἠκολούθει
  choice: na-esokwa ya
  rationale: Imperfect ahụ na-egosi omume na-aga n'ihu. Usoro “na-esokwa” na-edobe echiche ahụ karịa naanị ikwu na ọ soro ya otu mgbe.
- source_word: ἐν τῇ ὁδῷ
  choice: n'ụzọ
  rationale: “N'ụzọ” bụ ntụgharị eke nke nwere ike ịpụta n'okporo ụzọ ha na-aga ma ghara iwepụ ndumodu banyere iso Jizọs n'Ụzọ.
- source_word: καὶ ὁ Ἰησοῦς
  choice: Jizọs wee
  rationale: “Wee” na-ejikọta ihe Jizọs kwuru na akụkọ gara aga n'ụzọ Igbo dị ire, ma na-edobe usoro akụkọ nke καί.
theological_decisions:
- issue: Ihe σῴζω pụtara n'okwu Jizọs
  choice: azọpụtala gị
  alternative: emela ka ahụ dị gị mma; agwọọla gị
  rationale: Ọnọdụ ahụ na-egosi ọgwụgwọ anụ ahụ ozugbo, ma σῴζω nwere obosara nke gụnyere nzọpụta na ọgwụgwọ. “Azọpụtala gị” na-ahapụ obosara na esemokwu echiche ahụ ka ọ dị.
- issue: Ihe πίστις pụtara n'ọnọdụ a
  choice: okwukwe
  alternative: ntụkwasị obi
  rationale: “Okwukwe” na-edobe okwu bụ isi, ebe ntụkwasị obi nwoke ahụ nwere n'ebe Jizọs nọ ka bụ ihe okwu ahụ na-egosi n'ebe a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Wee” na-eme ka njikọ akụkọ ahụ dị ire; “na-esokwa” na-egosipụta omume na-aga n'ihu. E debere akara nkọwa ụkwụ ozugbo n'akụkụ okwu ha na-akọwa.
