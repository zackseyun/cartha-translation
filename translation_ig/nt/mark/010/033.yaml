revisions:
- from: sị, “Lee, anyị na-arịgo Jerusalem, a ga-enyefekwa Nwa nke Mmadụ n’aka ndị isi nchụaja na ndị odeakwụkwọ Iwu[a]. Ha ga-ama ya ikpe ọnwụ, nyefekwa ya n’aka ndị mba ọzọ[b].”
  to: sị, “Lee, anyị na-arịgo Jerusalem, a ga-enyefe Nwa nke Mmadụ n’aka ndị isi nchụaja na ndị odeakwụkwọ[a], ha ga-ama ya ikpe ọnwụ, nyefee ya n’aka ndị mba ọzọ[b].”
  rationale: The revision restores the direct lexical rendering “ndị odeakwụkwọ” for γραμματεῖς, moves the explanatory sense into its footnote, removes the unnecessary additive nuance in the first passive verb, and retains the repeated “nyefee” wording and the historical sense of τοῖς ἔθνεσιν.
