id: MRK.10.33
reference: Mark 10:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: ig
  text: sị, “Lee, anyị na-arịgo Jerusalem, a ga-enyefe Nwa nke Mmadụ n’aka ndị isi nchụaja na ndị odeakwụkwọ[a], ha ga-ama ya ikpe ọnwụ, nyefee ya n’aka ndị mba ọzọ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ọkachamara n’Iwu.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “mba dị iche iche”; n’ebe a ọ pụtara ndị na-abụghị ndị Juu.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: sị
  rationale: N’ebe a, okwu a na-ewebata ihe Jizọs kwuru na-aga n’ihu site n’amaokwu bu ụzọ; ‘sị’ bụ ụzọ Igbo nkịtị si ewebata okwu kpọmkwem n’enweghị itinye echiche nke ihe kpatara ya.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu ịdọrọ uche; ‘Lee’ dị nkenke, dị ùgwù, ma na-edobe ike nke ọkpụkpọ uche dị na Grik.
- source_word: ἀναβαίνομεν
  choice: anyị na-arịgo
  rationale: Ọ na-egosi njem a na-aga Jerusalem, obodo dị n’elu ugwu; ‘na-arịgo’ na-edobe ma oge ugbu a ma echiche nke ịrịgo.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-edobe usoro okwu Grik na mkpa aha Jizọs ji akpọ onwe ya, kama ịkọwa ya n’ụzọ ga-eme ka ihe ọ pụtara dị warara.
- source_word: παραδοθήσεται / παραδώσουσιν
  choice: a ga-enyefe / ha ga-enyefe
  rationale: ‘Nyefee n’aka’ na-egosi inye mmadụ n’okpuru ike ndị ọzọ. E ji otu ngwaa ahụ n’ebe abụọ ahụ iji chekwaa nkwughachi dị na Grik, n’agbanyeghị na nhazi olu dị iche.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: ndị isi nchụaja
  rationale: Ọ na-ezo aka n’òtù ndị isi ọchịchị nchụaja, ọ bụghị naanị otu nnukwu onye nchụaja.
- source_word: τοῖς γραμματεῦσιν
  choice: ndị odeakwụkwọ Iwu
  rationale: Nhọrọ a na-eme ka ndị na-agụ Igbo taa ghọta na ọ bụghị naanị ndị na-ede akwụkwọ ka a na-ekwu, kama ọ bụ ndị ọkachamara n’Iwu; ọ ka na-ejigide ihe oyiyi nke ‘ndị odeakwụkwọ.’
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: ha ga-ama ya ikpe ọnwụ
  rationale: Nke a bụ okwu ikpe ziri ezi n’Igbo ma na-edobe ikpe ọchịchị siri ike dị na Grik.
- source_word: τοῖς ἔθνεσιν
  choice: ndị mba ọzọ
  rationale: N’ọnọdụ a, ọ na-ezo aka n’aka ndị na-abụghị ndị Juu, karịchaa ndị ọchịchị Rom; ‘ndị mba ọzọ’ bụ okwu Igbo doro anya nke na-edobekwa ọdịiche ahụ.
theological_decisions:
- issue: Nsụgharị ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: Nhọrọ nkịtị a na-edobe aha ahụ dịka aha Jizọs ji akpọ onwe ya na njikọ ya na ihe oyiyi Akwụkwọ Nsọ, n’ebughị ụzọ kpebie nkọwa ya.
- issue: Nsụgharị τοῖς ἔθνεσιν
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: N’akụkọ ahụ, a na-enyefe Jizọs site n’aka ndị isi Juu n’aka ndị na-abụghị ndị Juu. Nhọrọ a na-egosi ọdịiche akụkọ ihe mere eme ahụ n’etinyeghị ozizi ọzọ.
- issue: Ihe παραδίδωμι pụtara n’ebe abụọ ahụ
  choice: nyefee n’aka
  alternative: rara nye / nyefee
  rationale: ‘Nyefee n’aka’ na-edobe echiche sara mbara nke itinye mmadụ n’okpuru ike onye ọzọ, ma ọ naghị eme ka ngwaa mbụ pụta naanị ‘ịrara nye,’ ebe onye na-eme ya ekwughị n’amaokwu a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Lee’ na-edobe ụda ịdọrọ uche; ‘anyị na-arịgo Jerusalem’ bụ okwu njem nkịtị. E tinyere nkọwa ‘Iwu’ na isi ederede iji zere ka ‘ndị odeakwụkwọ’ bụrụ naanị ndị na-ede akwụkwọ n’uche onye na-agụ, ma e debere ụdị nkịtị na nkọwa ala peeji.
