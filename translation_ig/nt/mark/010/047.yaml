source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὅτι Ἰησοῦς ὁ ⸀Ναζαρηνός ἐστιν ἤρξατο κράζειν καὶ λέγειν· ⸀Υἱὲ Δαυὶδ Ἰησοῦ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/047.yaml
  text: And when he heard that it was Jesus the Nazarene[a], he began to cry out and say, “Jesus, Son of David, have mercy on me!”
translation:
  language: ig
  text: Mgbe ọ nụrụ na ọ bụ Jizọs onye Nazaret[a], ọ malitere iti mkpu na-asị, “Jizọs, Nwa Devid, meere m ebere!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Jizọs nke Nazaret.” N’asụsụ Grik, e ji aha njirimara “onye Nazaret” kọwaa Jizọs, kama iji nkọwa ebe o si nke pụtara ìhè karị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Mgbe ọ nụrụ
  rationale: A sụgharịrị aorist participle ahụ dịka nkebiokwu oge iji gosi ihe mere tupu ngwaa bụ isi n’ụzọ Igbo dị larịị.
- source_word: Ναζαρηνός
  choice: onye Nazaret
  rationale: Nke a na-echekwa aha njirimara e nyere Jizọs, kama ime ka ọ bụrụ naanị nkọwa ebe o si.
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: ọ malitere iti mkpu na-asị
  rationale: Nke a na-egosi mmalite omume ahụ ma na-echekwa ma iti mkpu ma ikwu okwu n’ụzọ Igbo na-ada eke.
- source_word: κράζειν
  choice: iti mkpu
  rationale: Ọ na-egosi olu dara ụda na arịrịọ siri ike, n’enweghị echiche na iwe bụ ihe kpatara ya.
- source_word: Υἱὲ Δαυὶδ
  choice: Nwa Devid
  rationale: Nke a na-echekwa ọdịdị aha ahụ na mkpa ya dịka aha eze-Mezaịa, kama ịgbanwe ya ka ọ bụrụ naanị ‘nwa sitere n’agbụrụ Devid.’
- source_word: ἐλέησόν με
  choice: meere m ebere
  rationale: Nke a bụ arịrịọ doro anya ma dị nsọ n’Igbo, nke na-egosipụta ike nke imperative Grik ahụ.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: E ji ụdị aha a na-ahụkarị n’Igbo dee aha onye ahụ.
theological_decisions:
- issue: Ike Mezaịa dị n’aha ‘Nwa Devid’
  choice: E debere ‘Nwa Devid’ dịka aha Bartimịọs ji kpọọ Jizọs.
  alternative: nwa sitere n’agbụrụ Devid
  rationale: N’akụkọ Mak, okwu a nwere ụda eze na Mezaịa; nsụgharị nkịtị na-echekwa ma ọdịdị ya ma esemokwu nkà mmụta okpukpe dị na ya.
- issue: Nsụgharị Ναζαρηνός
  choice: onye Nazaret
  alternative: Jizọs nke Nazaret
  rationale: Okwu Grik ahụ bụ aha njirimara yiri epithet. ‘Onye Nazaret’ na-echekwa ụdị ahụ karịa nkọwa ebe onye ahụ si, ebe ndetu ala na-enye ụdị ọzọ a pụrụ iji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ùgwù. ‘Iti mkpu na-asị’ na-eme ka ahịrịokwu ahụ daa eke n’Igbo ma na-echekwa ngwaa abụọ dị na Grik. E debere akara ndetu [a] ozugbo n’akụkụ okwu ọ na-akọwa.
