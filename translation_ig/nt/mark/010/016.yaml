  text: καὶ ἐναγκαλισάμενος αὐτὰ ⸂κατευλόγει τιθεὶς τὰς χεῖρας ἐπ’ αὐτά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/016.yaml
  text: And he took them in his arms and blessed them[b][a], laying his hands on them.
translation:
  language: ig
  text: O wee kuru ha n’aka ya[a], nọgide na-agọzi ha[b], na-ebikwasị ha aka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “makụọ ha” ma ọ bụ “kuru ha n’aka ya.” Okwu Grik ahụ na-ekwu kpọmkwem banyere ịkpọrọ mmadụ n’aka.
    reason: lexical_alternative
  - marker: b
    text: Ngwaa Grik ahụ dị n’ụdị imperfect, nke nwere ike igosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro. Ya mere, a pụkwara ịsụgharị ya, “nọgidere na-agọzi ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: kuru ha n’aka ya
  rationale: Okwu a pụtara kpọmkwem ịkpọrọ mmadụ n’aka ma ọ bụ ịmakụ ya; nsụgharị a bụ Igbo dị mfe ma na-echekwa omume ịhụnanya ahụ.
- source_word: κατευλόγει
  choice: nọgide na-agọzi ha
  rationale: Ngwaa ahụ dị n’ụdị imperfect, ma bụrụkwa okwu e mesiri ike; ‘nọgide na-agọzi ha’ na-egosi omume na-aga n’ihu ma ọ bụ nke e mere ugboro ugboro.
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: na-ebikwasị ha aka ya
  rationale: Nke a na-akọwa otú ọ si agọzi ha. Ọ bụ okwu Igbo doro anya nke na-echekwa omume ịbikwasị aka dị n’amaokwu ahụ.
- source_word: αὐτὰ ... αὐτά
  choice: ha
  rationale: Nnochiaha ndị a na-ezo aka n’ụmụaka ndị a kpọtụrụ aha n’amaokwu ndị bu ụzọ; ‘ha’ bụ ụzọ Igbo si ekwu ya n’enweghị nkwughachi na-adịghị mkpa.
- source_word: καὶ
  choice: O wee
  rationale: ‘O wee’ na-ejikọta omume a na akụkọ bu ya ụzọ n’ụzọ kwekọrọ n’usoro akụkọ Mak ma ghara ịgbakwụnye ihe ọzọ na-adịghị n’asụsụ Grik.
theological_decisions:
- issue: Ụdị omume Jizọs mere ụmụaka ahụ
  choice: 'E debere omume ndị a kpọmkwem: ịkpọrọ ha n’aka, ịgọzi ha, na ịbikwasị ha aka.'
  alternative: Ịkọwa ya dị ka emume sacrament ma ọ bụ usoro okpukpe e guzobere.
  rationale: Amaokwu ahụ na-egosi nnabata ịhụnanya Jizọs na ngọzi ọ gọziri ụmụaka ahụ, ma ọ naghị akpọ omume ahụ emume sacrament ma ọ bụ nye ya nkọwa ụka pụrụ iche.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị nsọ ma dị mfe nghọta. E ji ‘nọgide na-agọzi’ mee ka imperfect na ike dị na κατευλόγει pụta ìhè n’ahịrị isi, ebe nkọwa ala peeji na-echekwa ụzọ ndị ọzọ e nwere ike isi ghọta ya.
