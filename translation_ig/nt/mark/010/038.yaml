id: MRK.10.38
reference: Mark 10:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω, ⸀ἢ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: ig
  text: Ma Jizọs sịrị ha, “Unu amaghị ihe unu na-arịọ. Unu ọ̀ pụrụ ịṅụ iko ahụ m na-aṅụ[a], ma ọ bụ ka e mee unu baptizim ahụ a na-eme m[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Iko” bụ ihe atụ Akwụkwọ Nsọ ji akọwa oke e kenyere mmadụ; n'ebe a, ọ na-atụ aka karịchaa n'ahụhụ Jizọs na-abịanụ.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsụgharị nke a n'ụzọ nkọwa dịka, “ịgabiga baptizim ahụ m na-agabiga.” Okwu Grik ji okwu ndị sitere n'otu mgbọrọgwụ maka “baptizim” na “ime baptizim” mee nkwughachi iji mesie ihe ahụ ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: Unu amaghị
  rationale: Nke a na-edobe isi echiche nke οἶδα, ‘ịma,’ ma na-ada nke ọma n'Igbo; ọnọdụ okwu ahụ nwekwara ike ịgụnye enweghị nghọta.
- source_word: τί αἰτεῖσθε
  choice: ihe unu na-arịọ
  rationale: ‘Ịrịọ’ bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwupụta αἰτέω n'ọnọdụ a.
- source_word: δύνασθε
  choice: Unu ọ̀ pụrụ
  rationale: ‘Ịpụ’ n'ajụjụ a na-egosi ike ma ọ bụ ikike ime ihe, kwekọrọ na δύναμαι.
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: ịṅụ iko ahụ m na-aṅụ
  rationale: A hapụrụ ihe atụ nke ‘iko’ ka ọ dị n'ederede, n'ebughị ụzọ kọwaa ya dị ka ahụhụ.
- source_word: ἢ
  choice: ma ọ bụ
  rationale: Nke a na-edobe njikọ nhọrọ dị na ederede SBLGNT, n'enweghị ime ka ya na amaokwu yiri ya kwekọọ n'ụzọ a manyere amanye.
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: ka e mee unu baptizim ahụ a na-eme m
  rationale: Nke a na-edobe okwu ‘baptizim’ na usoro nnara nke okwu Grik, ma na-eme ka ahịrịokwu ahụ bụrụ Igbo a pụrụ ịghọta. Ihe e bu n'obi abụghị naanị emume mmiri, kama a hapụrụ ihe atụ ahụ n'enweghị ịkọwa ya n'ụzọ wara wara.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ma Jizọs sịrị ha
  rationale: ‘Ma’ na-egosi ntughari na nzaghachi mmezi nke δέ na-eweta ebe a.
theological_decisions:
- issue: Ihe atụ nke ‘iko’ na ‘baptizim’
  choice: Idowe ihe atụ abụọ ahụ n'ederede bụ isi n'ebughị ụzọ kọwaa ha kpọmkwem dị ka ahụhụ, ọnwụ, ma ọ bụ iwe Chineke.
  alternative: Ịsụgharị ha n'ụzọ nkọwa dịka ‘ịta ahụhụ ahụ m ga-ata.’
  rationale: Okwu abụọ ahụ na-atụ aka n'ahụhụ Jizọs na-abịanụ, ma amaokwu a anaghị akọwa oke ihe ha pụtara. Idowe ha na-echekwa obosara na esemokwu nkà mmụta okpukpe dị n'okwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugwu ma dị mfe nghọta. E debere ihe atụ ndị bụ isi na ụdị ajụjụ ahụ, ebe e mere usoro baptizim ka ọ bụrụ nke na-ada nke ọma n'Igbo n'agbanyeghị nkwughachi siri ike nke Grik.
