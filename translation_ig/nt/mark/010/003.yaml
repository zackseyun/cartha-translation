source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Τί ὑμῖν ἐνετείλατο Μωϋσῆς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/003.yaml
  text: But he answered them, “What did Moses command you?”
translation:
  language: ig
  text: Ma ọ zara ha sị, “Gịnị ka Mosis nyere unu n’iwu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ bụ njikọ dị nro nke na-egosi ntughari na obere ọdịiche n’etiti ajụjụ ndị Farisii na nzaghachi Jizọs.
- source_word: ἀποκριθεὶς εἶπεν
  choice: ọ zara ha, sị
  rationale: Nke a bụ ụzọ Igbo dị mma isi gosipụta ma nzaghachi ahụ ma okwu kpọmkwem sochiri ya, n’enweghị ikwughachi okwu n’ụzọ na-adịghị eke.
- source_word: αὐτοῖς
  choice: ha
  rationale: A tinyere nnọchiaha a n’ime ahịrịokwu ‘ọ zara ha,’ dịka ụtọasụsụ Igbo si dị.
- source_word: Τί
  choice: Gịnị
  rationale: Ọ na-ebute ajụjụ na-achọ ịmata ihe iwu ahụ kwuru.
- source_word: ὑμῖν
  choice: unu
  rationale: Ọ na-egosi ndị e nyere iwu ahụ; ‘unu’ dabara n’ihi na a na-agwa ọtụtụ mmadụ okwu.
- source_word: ἐνετείλατο
  choice: nyere ... n’iwu
  rationale: Nkebiokwu a na-egosipụta iwu nwere ikike, ma bụrụkwa okwu Igbo doro anya ma dị ugbu a.
- source_word: Μωϋσῆς
  choice: Mosis
  rationale: E ji ụdị aha a na-ahụkarị n’Igbo dee aha onye ahụ.
theological_decisions:
- issue: Aha Mosis dịka onye nyere iwu n’ajụjụ Jizọs
  choice: E debere ‘Mosis’ dịka onye a kpọrọ aha nyere ha iwu.
  alternative: ‘Gịnị ka iwu Mosis nyere unu n’iwu?’ ma ọ bụ ‘Gịnị ka Chineke si n’ọnụ Mosis nye unu n’iwu?’
  rationale: Ihe odide Grik kpọrọ Mosis aha kpọmkwem, ọ kpọghịkwa ‘iwu Mosis’ ma ọ bụ ‘Chineke site n’ọnụ Mosis.’ Nsụgharị ahụ anaghị agbakwụnye nkọwa nkà mmụta okpukpe nke amaokwu ahụ ekwughị.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị nsọpụrụ, ma dị mfe nghọta. E chekwara ọdịdị ajụjụ kpọmkwem na ikike dị n’okwu iwu ahụ.
