revisions:
- from: Jizọs kpọrọ ha ka ha bịakwute ya, sị ha, “Unu maara na ndị a na-ewere dị ka ndị na-achị[a] ndị mba ọzọ[b] na-achị ha n’ike, ndị ukwu ha na-ejikwa ike achị ha.”
  to: Jizọs kpọrọ ha ka ha bịakwute ya, sị ha, “Unu maara na ndị a na-ewere dị ka ndị ọchịchị n’etiti ndị mba ọzọ[a] na-achị ha n’ike, ndị ukwu ha na-ejikwa ikike ha achị ha.”
  rationale: The revision resolves the Igbo attachment ambiguity around the rulers and refines the second authority verb without altering the source meaning. Since both the lexical scope of τῶν ἐθνῶν and the nuance of δοκοῦντες are relevant at the same location in Igbo, they are preserved together in one footnote anchored to “ndị mba ọzọ.”
