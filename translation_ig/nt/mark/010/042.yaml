source:
  edition: SBLGNT
  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: ig
  text: Jizọs kpọrọ ha ka ha bịakwute ya, sị ha, “Unu maara na ndị a na-ewere dị ka ndị ọchịchị n’etiti ndị mba ọzọ[a] na-achị ha n’ike, ndị ukwu ha na-ejikwa ikike ha achị ha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị a na-ewere dị ka ndị ọchịchị n’etiti mba dị iche iche”; okwu ahụ nwekwara ike ịpụta, “ndị yiri ka ha na-achị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: kpọrọ ha ka ha bịakwute ya
  rationale: Nke a na-egosipụta echiche nke ịkpọ ndị ahụ ka ha bịakwute onye kpọrọ ha, nke olu etiti nke ngwaa Grik a na-enye.
- source_word: λέγει
  choice: sị ha
  rationale: Ọ bụ ezie na Grik ji oge ugbu a n’akụkọ, ‘sị ha’ bụ ụzọ Igbo si akọ ihe mere n’oge gara aga n’enweghị imebi ọrụ okwu ahụ.
- source_word: Οἴδατε
  choice: Unu maara
  rationale: οἶδα nwere nghọta nke oge ugbu a ebe a; ‘Unu maara’ bụ ntụgharị kwụ ọtọ ma bụrụkwa Igbo nkịtị.
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: ndị a na-ewere dị ka ndị na-achị
  rationale: Nke a na-echekwa echiche nke ndị mmadụ na-ele ha anya ma na-anabata ha dị ka ndị ọchịchị, n’enweghị ikwu na ọchịchị ha bụ naanị ihe yiri eziokwu.
- source_word: τῶν ἐθνῶν
  choice: ndị mba ọzọ
  rationale: N’ọnọdụ okwu ndị Juu, okwu a na-ezo aka ná mba ndị na-abụghị ndị Juu; ‘ndị mba ọzọ’ bụ okwu Igbo doro anya ma na-edobe ọdịiche ahụ.
- source_word: κατακυριεύουσιν
  choice: na-achị ha n’ike
  rationale: Ngwaa a karịrị naanị ‘ịchị’; ọ na-egosi ịchị mmadụ n’ụzọ ike na mmegbu.
- source_word: οἱ μεγάλοι αὐτῶν
  choice: ndị ukwu ha
  rationale: Nke a na-edobe njikọ okwu Grik ma na-ezo aka ná ndị a ma ama ma ọ bụ ndị nwere nnukwu ọnọdụ na ikike, n’enweghị ịkpọ ha otu ndị ọrụ ọchịchị pụrụ iche.
- source_word: κατεξουσιάζουσιν
  choice: na-ejikwa ike achị ha
  rationale: Nke a na-egosi iji ikike mee ihe n’ebe ndị ọzọ nọ ma na-edobe ọdịiche dị nta n’etiti ngwaa a na κατακυριεύουσιν.
theological_decisions:
- issue: Ihe τῶν ἐθνῶν na-ezo aka na ya
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: N’ọnọdụ ndị Juu nke okwu a, ọ na-ezo aka ná ndị na-abụghị ndị Juu; ihe odide ala peeji na-edobekwa nghọta sara mbara nke ‘mba dị iche iche.’
- issue: Ike okwu δοκοῦντες
  choice: ndị a na-ewere dị ka ndị na-achị
  alternative: ndị yiri ka ha na-achị
  rationale: Nhọrọ bụ isi na-egosi na a na-ele ha anya dị ka ndị ọchịchị n’ezie, ma ihe odide ala peeji na-echekwa ihe okwu Grik ahụ nwekwara ike ịpụta, ya bụ ‘ndị yiri ka ha na-achị.’
translation_notes:
  register: 'E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe nhazi abụọ yiri ibe ha: ndị ọchịchị na-achị n’ike, ndị ukwu ha na-ejikwa ike achị. E debere ihe abụọ Grik nwere ike ịpụta n’ihe odide ala peeji kama idozi ha n’otu ụzọ naanị.'
