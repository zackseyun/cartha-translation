  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: ig
  text: N’ihi na ọbụna Nwa nke Mmadụ abịaghị ka e jeere ya ozi, kama ka o jee ozi, ka o nyekwa ndụ ya dị ka ụgwọ mgbapụta maka ọtụtụ mmadụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “dị ka ụgwọ mgbapụta n’ọnọdụ ọtụtụ mmadụ.” Okwu Grik a sụgharịrị “maka” nwere ike igosi ịnọchi mmadụ ma ọ bụ mgbanwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: N’ihi na ọbụna
  rationale: Nke a na-egosi na okwu a na-enye ihe mere e ji kwuo ihe dị n’ihu ya, ma na-emesikwa ike na ọbụna Nwa nke Mmadụ gbasoro ụkpụrụ ahụ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Aha a na-edobe ụzọ Jizọs si akpọ onwe ya na njikọ ya na Akwụkwọ Nsọ ndị ọzọ, n’enweghị nkọwa agbakwunyere.
- source_word: οὐκ ἦλθεν
  choice: abịaghị
  rationale: Ọ bụ ntụgharị doro anya nke ngwaa ahụ, ma infinitive ndị na-esochi ya na-egosi ebumnuche ọbịbịa ahụ.
- source_word: διακονηθῆναι
  choice: ka e jeere ya ozi
  rationale: Ọ na-egosipụta olu nnara nke ọma ma na-eme ka ọdịiche ya na ‘ije ozi’ doo anya.
- source_word: ἀλλὰ διακονῆσαι
  choice: kama ọ bịara ije ozi
  rationale: Iji otu mgbọrọgwụ okwu ahụ eme ihe na-edobe ntụgharị okwu dị n’etiti ịbụ onye a na-ejere ozi na ịbụ onye na-eje ozi.
- source_word: δοῦναι
  choice: inye
  rationale: ‘Inye’ bụ isi nghọta ngwaa ahụ ma ọ naghị ebubata nkọwa ọzọ na-adịghị n’ederede.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ndụ ya
  rationale: N’ebe a ψυχή pụtara ndụ mmadụ nke a na-enye ruo n’ọnwụ, ọ bụghị naanị mkpụrụobi.
- source_word: λύτρον
  choice: ụgwọ mgbapụta
  rationale: Nkebi okwu a na-egosi ọnụ ahịa e ji tọhapụ mmadụ ma na-anọgide bụrụ asụsụ Igbo doro anya na nke kwesịrị ekwesị.
- source_word: ἀντὶ πολλῶν
  choice: n’ọnọdụ ọtụtụ mmadụ
  rationale: ἀντί na-ebu echiche mgbanwe ma ọ bụ ịnọchi anya; ‘n’ọnọdụ’ na-edobe ike ahụ karịa okwu sara mbara dịka ‘maka’.
theological_decisions:
- issue: Ike ἀντί n’okwu banyere ụgwọ mgbapụta
  choice: n’ọnọdụ ọtụtụ mmadụ
  alternative: maka ọtụtụ mmadụ
  rationale: ἀντί na-egosikarị ịnọchi mmadụ ma ọ bụ mgbanwe. E debere nke a n’ahịrị isi n’ihi na ọ bụkwa Igbo a na-aghọta nke ọma; ndetu ala na-egosi na a pụkwara ikwu ya n’ụzọ ọzọ na-adịghị akọwapụta nnọchi ahụ nke ukwuu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere aha ‘Nwa nke Mmadụ,’ meekwa ka ọdịiche dị n’etiti ‘e jeere ya ozi’ na ‘ije ozi’ pụta ìhè.
