revisions:
- from: N’ihi na ọbụna Nwa nke Mmadụ abịaghị ka e jeere ya ozi, kama ọ bịara ije ozi na inye ndụ ya ka ọ bụrụ ụgwọ mgbapụta n’ọnọdụ ọtụtụ mmadụ.[a]
  to: N’ihi na ọbụna Nwa nke Mmadụ abịaghị ka e jeere ya ozi, kama ka o jee ozi, ka o nyekwa ndụ ya dị ka ụgwọ mgbapụta maka ọtụtụ mmadụ.[a]
  rationale: The revision retains the source’s explanatory emphasis, title, service reversal, and ransom terminology. It uses idiomatic Standard Igbo in the main line while preserving the stronger possible force of ἀντί in an auditable footnote, without deciding a theological interpretation beyond the lexical evidence.
