revisions:
- from: Ha sịrị ya, “Anyị pụrụ ime ya.” Ma Jizọs sịrị ha, “Iko ahụ m na-aṅụ ka unu ga-aṅụkwa; e meekwa unu baptizim ahụ a na-eme m,[a]”
  to: Ha sịrị ya, “Anyị nwere ike.” Ma Jizọs sịrị ha, “Iko ahụ m na-aṅụ ka unu ga-aṅụ; baptizim ahụ a na-eme m ka a ga-emekwa unu baptizim,”
