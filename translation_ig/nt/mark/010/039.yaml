    reason: cross_reference
  revision_rationale: The revision removes an unnecessary supplied object from the disciples’ reply, improves the Standard Igbo syntax of the baptism parallel, and refines the explanatory footnote. It preserves the Greek metaphors and their ambiguity in the main text, as well as the source’s concluding comma.
