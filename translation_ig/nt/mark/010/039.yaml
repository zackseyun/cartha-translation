  text: οἱ δὲ εἶπαν αὐτῷ· Δυνάμεθα. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· ⸀Τὸ ποτήριον ὃ ἐγὼ πίνω πίεσθε καὶ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθήσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: ig
  text: Ha sịrị ya, “Anyị nwere ike.” Ma Jizọs sịrị ha, “Iko ahụ m na-aṅụ ka unu ga-aṅụ; baptizim ahụ a na-eme m ka a ga-emekwa unu baptizim,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δυνάμεθα
  choice: Anyị pụrụ ime ya
  rationale: Nke a na-egosi ikike ha kwuru na ha nwere n'okwu Igbo doro anya ma dịkwa nsọpụrụ; “ime ya” na-ezo aka n'ajụjụ Jizọs jụrụ n'amaokwu bu ụzọ.
- source_word: ποτήριον
  choice: iko
  rationale: E debere ihe atụ nke iko, nke nwere ike igosi ahụhụ ma ọ bụ akara aka e kenyere mmadụ, n'ebughị ụzọ kọwaa ya n'ahịrịokwu ahụ.
- source_word: πίνω / πίεσθε
  choice: m na-aṅụ / unu ga-aṅụkwa
  rationale: Nke a na-echekwa njikọ dị n'etiti omume Jizọs na nke ndị na-eso ụzọ ya, tinyere nghọta nke ikere òkè n'ihe ọ ga-agabiga.
- source_word: βάπτισμα
  choice: baptizim
  rationale: A họọrọ okwu a na-ejikarị eme ihe n'Igbo iji chekwaa ihe atụ Grik na njikọ ya na okwu banyere baptizim, kama ịgbanwe ya ozugbo ka ọ bụrụ “ahụhụ.”
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: a na-eme m / e meekwa unu baptizim
  rationale: Nhazi a na-egosipụta ụdị nnara-eme dị na Grik n'Igbo dị mfe nghọta, ma na-edobe njikọ ya na “baptizim.”
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ma Jizọs sịrị ha
  rationale: “Ma” na-egosi obere ọdịiche dị n'etiti nkwuwa okwu ndị ahụ na nzaghachi Jizọs.
theological_decisions:
- issue: Ihe atụ nke iko na baptizim
  choice: E debere “iko” na “baptizim” n'ahịrịokwu bụ isi, ebe nkọwa ala peeji na-akọwa na ha na-ezo aka n'ahụhụ na akara aka.
  alternative: Ịsụgharị ha ozugbo dịka “ahụhụ,” “ọnwụ,” ma ọ bụ “ọnwụ n'ihi okwukwe.”
  rationale: Asụsụ Grik ji ihe atụ abụọ a mee ihe. Idebe ha na-echekwa ịdị omimi na njikọ Akwụkwọ Nsọ ha n'enweghị itinye nkọwa karịrị ihe ederede kwuru.
- issue: Njikọ okwu a na baptizim dịka emume
  choice: E ji “baptizim” mee ihe, ma ihe gbara amaokwu ahụ gburugburu na nkọwa ala peeji na-egosi na ọ bụ ihe atụ nke ahụhụ.
  alternative: Iji “imikpu” ma ọ bụ “ahụhụ” mee ka a ghara iche banyere emume baptizim.
  rationale: Okwu isi Grik bụ βάπτισμα; nsụgharị kwesịrị ichekwa okwu ahụ na ihe atụ ya kama iwepụ njikọ ahụ n'ihi otu nghọta pụrụ ibilite.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị nsọpụrụ ma dị mfe nghọta. A tụgharịrị Δυνάμεθα n'ụzọ nkịtị dịka “Anyị pụrụ ime ya”; ya mere, achọghị nkọwa ala peeji ọzọ maka ụdị okwu Bekee “We can.”
