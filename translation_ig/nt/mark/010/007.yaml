  text: ἕνεκεν τούτου καταλείψει ἄνθρωπος τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα ⸂καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/007.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife,[a]
translation:
  language: ig
  text: N’ihi nke a, nwoke ga-ahapụ nna ya na nne ya, ọ ga-araparakwa n’ahụ nwunye ya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a ga-ejikọta ya na nwunye ya.” Ngwaa Grik ahụ pụrụ imesi njikọ chiri anya ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: N’ihi nke a
  rationale: Ọ bụ okwu na-egosi ihe kpatara ihe a na-ekwu; nsụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: καταλείψει
  choice: ga-ahapụ
  rationale: Ọ na-egosi na nwoke ahụ ga-esi n’ụlọ nne na nna ya pụọ; ‘ga-ahapụ’ na-edobe ọdịdị ngwaa ọdịnihu ahụ.
- source_word: ἄνθρωπος
  choice: nwoke
  rationale: Ọ bụ ezie na okwu Grik a pụrụ ịpụta mmadụ n’ozuzu, ebe a okwu banyere ‘nwunye ya’ na-egosi kpọmkwem nwoke nọ n’alụmdi na nwunye.
- source_word: τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: nna ya na nne ya
  rationale: Nke a na-asụgharị ihe abụọ ahụ kpọmkwem n’ụzọ Igbo na-adị ire ụtọ.
- source_word: προσκολληθήσεται
  choice: e jikọtara ya na
  rationale: Ọdịdị ngwaa Grik bụ ọdịdị nnara, ọ na-egosikwa njikọ chiri anya; okwu a na-edobe ma nnara ahụ ma echiche nke njikọ alụmdi na nwunye.
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: na nwunye ya
  rationale: N’ebe a γυνή pụtara nwunye n’ihi na ihe a na-ekwu bụ alụmdi na nwunye.
theological_decisions:
- issue: Okwu na-egosi nwoke kpọmkwem n’okwu e hotara banyere alụmdi na nwunye
  choice: nwoke ... nwunye ya
  alternative: mmadụ ... di ma ọ bụ nwunye ya
  rationale: Ebe okwu ahụ kwuru banyere nwunye nwoke, a hapụrụ ọdịiche nwoke na nwanyị dị n’ihe odide ahụ kama ime ka ọ bụrụ okwu gbasara mmadụ niile.
- issue: Ọdịdị nnara nke προσκολληθήσεται
  choice: e jikọtara ya na nwunye ya
  alternative: ọ ga-arapara n’ahụ nwunye ya
  rationale: Nhọrọ bụ isi na-edobe ọdịdị nnara nke Grik ma na-ekwupụta njikọ alụmdi na nwunye; ihe ọzọ na-egosipụta ike nke ịrapara ma na-adị ka ọdịdị omume.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro ọdịnihu na ọdịdị nnara nke ihe odide Grik, ebe nkọwa ala peeji na-egosi ihe ọzọ ngwaa ahụ pụrụ ịpụta.
