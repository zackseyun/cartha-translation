  text: Ἤρξατο ⸂λέγειν ὁ Πέτρος⸃ αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ⸀ἠκολουθήκαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: ig
  text: Pita malitere ịsị ya, “Lee[a], anyị ahapụla ihe niile ma soro gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Hụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: malitere ịsị
  rationale: Ngwakọta ngwaa a pụtara n'ụzọ ebumpụta ụwa na Pita ‘malitere ịsị’; ọ dabara n’akụkọ ma na-eduga n’okwu a kpọrọ kpọmkwem.
- source_word: ὁ Πέτρος
  choice: Pita
  rationale: E ji ụdị aha a na-ahụkarị n’Igbo dee aha onyeozi ahụ.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs dịka ihe gbara amaokwu ahụ gburugburu si gosi; a hapụghị ya dochie anya aha Jizọs ebe Grik ekwughị aha ahụ ọzọ.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: ‘Lee’ bụ okwu Igbo dị nkenke nke na-adọta uche onye a na-agwa okwu, ma na-echekwa ike okwu Grik ahụ.
- source_word: ἡμεῖς
  choice: anyị
  rationale: Nnọchiaha ahụ doro anya n’ahịrịokwu iji chekwaa nkwusi ike Pita tinyere n’‘anyị.’
- source_word: ἀφήκαμεν
  choice: ahapụla
  rationale: Ụdị a na-egosi ihe ha mere n’oge gara aga nke ọnọdụ ya ka dị ugbu a; ọ naghị ebubata echiche siri ike karị dịka ‘ajụla kpamkpam.’
- source_word: πάντα
  choice: ihe niile
  rationale: Nke a na-egosipụta oke zuru ezu nke okwu ahụ n’Igbo nkịtị ma dị mfe nghọta.
- source_word: ἠκολουθήκαμέν σοι
  choice: soro gị
  rationale: ‘Iso gị’ bụ ụzọ Igbo ebumpụta ụwa si kwuo iso mmadụ dịka onye na-eso ụzọ; njikọ ya na ‘ahapụla’ na-eme ka omume gara aga na mkpa ya ugbu a doo anya.
theological_decisions:
- issue: Okwu Pita banyere ihe ndị na-eso ụzọ hapụrụ
  choice: A sụgharịrị ya dịka nkwupụta Pita n’onwe ya, n’etinyeghị nkwado ma ọ bụ mbelata n’ọnụ onye na-akọ akụkọ.
  alternative: Ịsụgharị ya dịka ‘anyị enyefela ihe niile’ ma ọ bụ tinye nkọwa ga-ebu ụzọ kọwaa nzaghachi Jizọs.
  rationale: Amaokwu ahụ na-edekọ ihe Pita kwuru; ọ naghị enye mkpebi onye na-akọ akụkọ banyere izi ezi ma ọ bụ oke nkwupụta ahụ. Nsụgharị ahụ na-echekwa esemokwu nkà mmụta okpukpe ahụ.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Lee’ chekwaa ụda ịdọta uche, ebe ‘ahapụla ihe niile soro gị’ na-aga were were n’okwu Igbo ma na-edobe usoro echiche Grik.
