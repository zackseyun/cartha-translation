revisions:
- from: Pita malitere ịsị ya, “Lee[a], anyị ahapụla ihe niile soro gị.”
  to: Pita malitere ịsị ya, “Lee[a], anyị ahapụla ihe niile ma soro gị.”
  rationale: The revision supplies ‘ma’ to coordinate Peter’s two actions and thus clearly renders καί ... ἠκολουθήκαμεν σοι. It retains the direct, emphatic claim without interpretive expansion. The footnote is adjusted to avoid adding the nuance of ‘kwa.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:51Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders Peter, the indirect object (''ya''), the attention marker, and the claim that the disciples have left everything. However, it omits the Greek coordinating conjunction καί and, more seriously, fails to express ἠκολουθήκαμεν σοι (''[we] have followed you''): in Igbo, ''anyị ahapụla ihe niile soro gị'' makes ''soro gị'' attach improperly to ''ihe niile'' rather than coordinate a second action of ''anyị.'''
  naturalness: The proposed wording is not syntactically natural because 'soro gị' lacks the required coordination with the preceding predicate. Adding 'ma' produces clear, idiomatic Standard Igbo.
  terminology: ‘Pita,’ ‘Lee,’ ‘ahapụla,’ ‘ihe niile,’ and ‘soro gị’ are suitable Standard Igbo choices. The alternative footnote ‘Hụkwa’ introduces the additive nuance of -kwa, which is not present in ἰδού; ‘Hụ’ is a safer lexical alternative.
  issues:
  - severity: high
    issue: The predicate ‘soro gị’ is not coordinated with ‘anyị ahapụla.’
    rationale: 'The Greek has two coordinated verbal claims: ‘we have left everything’ and ‘[we] have followed you.’ Without ‘ma,’ the Igbo wording can construe ‘soro gị’ with ‘ihe niile,’ and does not faithfully state the second action.'
  - severity: low
    issue: The footnote alternative ‘Hụkwa’ adds an unwarranted additive particle.
    rationale: Ἰδού is an attention-getting particle, but does not contain the sense ‘also’ conveyed by -kwa. ‘Hụ’ preserves the alternative without added meaning.
  revised_text: Pita malitere ịsị ya, “Lee[a], anyị ahapụla ihe niile ma soro gị.”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Hụ.”
    reason: lexical_alternative
  revision_rationale: The revision supplies ‘ma’ to coordinate Peter’s two actions and thus clearly renders καί ... ἠκολουθήκαμεν σοι. It retains the direct, emphatic claim without interpretive expansion. The footnote is adjusted to avoid adding the nuance of ‘kwa.’
