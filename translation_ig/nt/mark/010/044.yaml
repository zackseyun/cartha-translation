  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν θέλῃ ⸂ἐν ὑμῖν εἶναι⸃ πρῶτος, ἔσται πάντων δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the servant of all[a].
translation:
  language: ig
  text: Onye ọ bụla n’ime unu chọrọ ịbụ onye mbụ ga-abụ ohu mmadụ niile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-ejere mmadụ niile ozi.” Okwu Grik bụ doulos, okwu siri ike karịa okwu a sụgharịrị “onye na-eje ozi” n’amaokwu gara aga; ya mere, e ji “ohu” ebe a iji chekwaa ọdịiche ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: Onye ọ bụla ... chọrọ
  rationale: Njikọ nnọchiaha na ἄν tinyere ngwaa n’ụdị subjunctive na-egosi ọnọdụ metụtara onye ọ bụla; “chọrọ” na-edobe echiche nke ọchịchọ dị na θέλω n’Igbo nkịtị.
- source_word: ἐν ὑμῖν
  choice: n’ime unu
  rationale: N’ebe a, okwu ahụ na-ekwu maka ọnọdụ ma ọ bụ ọkwa n’etiti ndị na-eso ụzọ, ọ bụghị naanị ịnọ n’otu ebe.
- source_word: πρῶτος
  choice: onye mbụ
  rationale: Nke a na-egosi onye nọ n’ihu n’ọkwa ma ọ bụ n’ugwu, ma na-edobekwa okwu doro anya nke ihe odide Grik.
- source_word: ἔσται
  choice: ga-abụ
  rationale: Nke a na-asụgharị future nke εἰμί kpọmkwem, ma ihe gbara ya gburugburu ka na-enye ya ike nke ntụziaka Jizọs.
- source_word: πάντων
  choice: mmadụ niile
  rationale: Genitive plural a na-egosi na onye ahụ nọ n’okpuru mmadụ niile; “mmadụ niile” na-eme ka ókè ya zuru ụwa ọnụ doo anya n’Igbo.
- source_word: δοῦλος
  choice: ohu
  rationale: δοῦλος siri ike karịa διάκονος e ji mee ihe n’amaokwu gara aga. “Ohu” na-edobe echiche nke onye a na-achị ma na-ebuli ịdị omimi nke iweda onwe ala n’okwu a.
theological_decisions:
- issue: Nsụgharị δοῦλος n’okwu banyere iso ụzọ Jizọs
  choice: ohu
  alternative: onye na-ejere ozi
  rationale: Amaokwu 43 ji διάκονος, ma amaokwu 44 ji okwu ka ya ike, δοῦλος. Ịsụgharị ya “ohu” na-edobe ọdịiche ahụ na oku a na-akpọ mmadụ ka o wedata onwe ya kpamkpam, n’enweghị itinye nkọwa otu ụka pụrụ iche.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ bụ nke eke n’Igbo, ebe “n’ime unu” na-egosi ọnọdụ n’etiti ìgwè ahụ, “ga-abụ” na-edobe future nke Grik, “ohu” na-echekwa ịdị ike nke δοῦλος.
