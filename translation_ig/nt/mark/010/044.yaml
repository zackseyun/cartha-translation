  verdict: approve
  source_fidelity: The translation faithfully renders the indefinite subject (ὃς ἂν θέλῃ), the group-relative sense of ἐν ὑμῖν, rank in πρῶτος, the future ἔσται, the universal πάντων, and the stronger social-status force of δοῦλος. “Ohu mmadụ niile” accurately expresses “slave of all.”
  naturalness: “Onye ọ bụla n’ime unu chọrọ ịbụ onye mbụ ga-abụ ohu mmadụ niile” is clear, grammatical, and natural Standard Igbo. The placement of “n’ime unu” naturally identifies the relevant community without obscuring the ranking sense.
  terminology: “Ohu” appropriately preserves the escalation from διάκονος in the preceding verse to δοῦλος here. The footnote supplies the less forceful service-oriented alternative without treating it as the primary rendering.
