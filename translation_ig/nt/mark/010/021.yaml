id: MRK.10.21
reference: Mark 10:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: ig
  text: 'Jizọs wee legide ya anya, hụ ya n’anya, sị ya, “Otu ihe ka kọrọ gị: gaa ree ihe ọ bụla i nwere[a], nye ndị ogbenye, ị ga-enwekwa akụ n’eluigwe; bịa, soro m.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe niile i nwere.” Okwu Grik ahụ nwere ike ịpụta “ihe ọ bụla i nwere” ma ọ bụ “ihe niile i nwere”; ihe gbara ya gburugburu na-egosi na ọ metụtara ihe onwunwe ya niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψας
  choice: legide ya anya
  rationale: Nkebiokwu a na-egosi na Jizọs tụkwasịrị nwoke ahụ anya nke ọma. “Legide ya anya” bụ Igbo dị mfe ma na-egosipụta ile mmadụ anya kpọmkwem n’etinyeghị ike karịrị nke okwu Grik ahụ chọrọ.
- source_word: ἠγάπησεν αὐτόν
  choice: hụ ya n’anya
  rationale: Nke a na-asụgharị okwu ahụ kpọmkwem dị ka ezi ịhụnanya Jizọs nwere n’ebe nwoke ahụ nọ, n’ebelataghị ya ka ọ bụrụ naanị imere ya ebere ma ọ bụ ịkwanyere ya ùgwù.
- source_word: Ἕν σε ὑστερεῖ
  choice: Otu ihe ka kọrọ gị
  rationale: Ọ bụ ụzọ e si ekwu ya n’Igbo nke ọma, na-egosikwa na e nwere otu ihe nwoke ahụ na-enweghị ma ọ bụ na-emezughị.
- source_word: ὅσα ἔχεις
  choice: ihe ọ bụla i nwere
  rationale: Nkebiokwu Grik a nwere ike ịpụta “ihe ọ bụla i nwere” ma ọ bụ “ihe niile i nwere.” Nhọrọ a na-agbasochi ọdịdị okwu Grik anya, ebe ihe gbara ya gburugburu ka na-egosi na iwu ahụ metụtara ihe onwunwe ya n’ozuzu.
- source_word: πώλησον
  choice: ree
  rationale: Nke a bụ iwu dị mfe ma kwụ ọtọ ka o ree ihe ndị o nwere.
- source_word: δὸς τοῖς πτωχοῖς
  choice: nye ndị ogbenye ego ya
  rationale: N’asụsụ Igbo, ịgbakwụnye “ego ya” na-eme ka o doo anya na ihe a ga-enye ndị ogbenye bụ ego e nwetara n’ire ihe ndị ahụ; nke a bụ ihe njikọ okwu ndị ahụ pụtara n’ọnọdụ a.
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: akụ n’eluigwe
  rationale: “Akụ” na-enye echiche nke ihe dị oké ọnụ ahịa echekwara, ebe “n’eluigwe” na-edobe ebe okwu Grik ahụ kwuru.
- source_word: δεῦρο ἀκολούθει μοι
  choice: bịa soro m
  rationale: Nke a bụ ọkpụkpọ oku doro anya ka nwoke ahụ bịakwute Jizọs ma nọgide bụrụ onye na-eso ụzọ ya; “soro m” na-eburu echiche nke iso mmadụ n’ụzọ na ndụ.
theological_decisions:
- issue: Ihe ịhụnanya Jizọs n’ebe nwoke ahụ nọ pụtara
  choice: A sụgharịrị ya n’ụzọ kwụ ọtọ dịka “hụ ya n’anya.”
  alternative: Ịghọta ya naanị dịka imere ya obiọma, ma ọ bụ itinye n’ime ya ozizi pụrụ iche banyere ịhụnanya nhọpụta.
  rationale: Okwu ahụ kwuru hoo haa na Jizọs hụrụ ya n’anya. Nsụgharị ahụ ekwesịghị ime ka ịhụnanya ahụ daa mba, ma ọ bụ tinye nkọwa usoro ozizi nke okwu ahụ n’onwe ya na-ekwughị.
- issue: Ókè iwu ahụ banyere ihe onwunwe nwoke ahụ ruru
  choice: “Ihe ọ bụla i nwere” na-edobe ụdị okwu Grik ahụ, ebe ọnọdụ akụkọ ahụ na-egosi na ọ gbasara ihe o nwere n’uju.
  alternative: Ịsụgharị ya kpọmkwem dịka “ihe niile i nwere,” ma ọ bụ ime ka iwu ahụ dị nro ka ọ bụrụ naanị inye ndị ogbenye ihe n’ụba.
  rationale: ὅσα ἔχεις nwere ike ịpụta “ihe ọ bụla i nwere” ma ọ bụ “ihe niile i nwere.” A hapụrụ ohere okwu ahụ nwere, ma e meghị ka iwu Jizọs dị nro.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dịkwa mfe nghọta. Ahịrịokwu ahụ na-edobe ike nke iwu Jizọs na esemokwu dị n’etiti ịhụnanya o nwere n’ebe nwoke ahụ nọ na ihe siri ike ọ gwara ya mee.
