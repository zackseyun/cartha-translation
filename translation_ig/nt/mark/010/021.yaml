review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus' attentive look, his love for the man, the single deficiency, the commands to sell and give, treasure in heaven, and the call to follow him. However, “ego ya” (“its/the money from it”) supplies an explicit object and proceeds-of-sale interpretation not stated by δὸς τοῖς πτωχοῖς. Though proceeds are contextually plausible, the Greek leaves the object implicit; the Igbo should likewise avoid making that inference explicit.
  naturalness: “Legide ya anya,” “hụ ya n’anya,” “Otu ihe ka kọrọ gị,” and “akụ n’eluigwe” are natural, dignified Standard Igbo. Adding a comma in “bịa, soro m” improves the direct, two-part summons.
  terminology: “Ndị ogbenye,” “akụ n’eluigwe,” and “soro m” are appropriate, clear renderings. The lexical-alternative footnote appropriately preserves the possible force of ὅσα ἔχεις without imposing one disputed English-style formulation.
  issues:
  - severity: medium
    issue: “nye ndị ogbenye ego ya” explicitly introduces money/proceeds.
    rationale: The Greek says simply “give to the poor,” with the object understood from context. Specifying “money from it” is a plausible interpretation but exceeds the wording of the source. Removing it preserves the source's compact ambiguity.
  revised_text: 'Jizọs wee legide ya anya, hụ ya n’anya, sị ya, “Otu ihe ka kọrọ gị: gaa ree ihe ọ bụla i nwere[a], nye ndị ogbenye, ị ga-enwekwa akụ n’eluigwe; bịa, soro m.”'
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe niile i nwere.” Okwu Grik ahụ nwere ike ịpụta “ihe ọ bụla i nwere” ma ọ bụ “ihe niile i nwere”; ihe gbara ya gburugburu na-egosi na ọ metụtara ihe onwunwe ya niile.
    reason: lexical_alternative
  revision_rationale: The revision removes the added phrase “ego ya” so that the implicit object of “nye ndị ogbenye” remains implicit, as in the Greek. It also punctuates “bịa, soro m” to reflect the paired imperatival invitation and command. No theological interpretation is added or removed.
