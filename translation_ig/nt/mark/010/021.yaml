  to: 'Jizọs wee legide ya anya, hụ ya n’anya, sị ya, “Otu ihe ka kọrọ gị: gaa ree ihe ọ bụla i nwere[a], nye ndị ogbenye, ị ga-enwekwa akụ n’eluigwe; bịa, soro m.”'
