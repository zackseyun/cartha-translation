revisions:
- from: 'Ha nọ n’ụzọ[a], na-arịgo Jerusalem. Jizọs nọ n’ihu ha na-aga[b]; o jukwara ha anya, ma ndị na-eso ha nọ na-atụ egwu. Ọ kpọọrọ ndị Iri na Abụọ ahụ ọzọ iche, wee malite ịgwa ha ihe ndị gaje ime ya.


    [a] Ma ọ bụ, “ka ha na-aga.”

    [b] Ma ọ bụ, “na-aga ha n’ihu.”'
  to: 'Ha nọ n’ụzọ[a], na-arịgo Jerusalem; Jizọs na-aga n’ihu ha. Ha tụrụ n’anya, ma ndị na-eso n’azụ na-atụ egwu. Ọ kpọọrọ ndị Iri na Abụọ ahụ iche ọzọ, wee malite ịgwa ha ihe ndị ga-eme ya.


    [a] Ma ọ bụ, “ka ha na-aga.”'
  rationale: The revised text corrects the unintended “following them” sense, improves idiomatic phrasing for Jesus’ position and the group’s astonishment, and retains the Greek distinction between astonishment and fear. The redundant [b] footnote and anchor are removed; the remaining [a] note continues to give the valid alternative for ἐν τῇ ὁδῷ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:41:03Z'
review_pass:
  verdict: revise
  source_fidelity: A correction is needed for οἱ δὲ ἀκολουθοῦντες. The draft’s “ndị na-eso ha” means “those following them,” introducing an unintended object and obscuring the Greek’s deliberately unspecified “those following.” “ndị na-eso n’azụ” preserves the distinct following group without supplying a possessive referent. The revision also renders ἐθαμβοῦντο with the more natural Igbo expression “ha tụrụ n’anya.”
  naturalness: “Jizọs na-aga n’ihu ha” is more idiomatic and direct than “Jizọs nọ n’ihu ha na-aga.” “Ha tụrụ n’anya” and “ndị na-eso n’azụ na-atụ egwu” are natural modern Standard Igbo and retain the narrative contrast.
  terminology: “Ndị Iri na Abụọ” appropriately renders τοὺς δώδεκα without adding “apostles.” “Jerusalem” is retained as in the draft. No doctrinal interpretation has been added.
  issues:
  - severity: medium
    issue: “ndị na-eso ha” supplies an unintended possessive object.
    rationale: The Greek says only “those following,” not “those following them.” In Igbo, “na-eso ha” naturally means following them, which can alter the relationship and referent of the group.
  - severity: low
    issue: The [b] note is not a meaningful lexical alternative to its anchored wording.
    rationale: The draft text already says that Jesus was going ahead of them; the note merely rearranges essentially the same words. It is omitted rather than retained as a redundant note.
  revised_text: 'Ha nọ n’ụzọ[a], na-arịgo Jerusalem; Jizọs na-aga n’ihu ha. Ha tụrụ n’anya, ma ndị na-eso n’azụ na-atụ egwu. Ọ kpọọrọ ndị Iri na Abụọ ahụ iche ọzọ, wee malite ịgwa ha ihe ndị ga-eme ya.


    [a] Ma ọ bụ, “ka ha na-aga.”'
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ha na-aga.”
    reason: lexical_alternative
  revision_rationale: The revised text corrects the unintended “following them” sense, improves idiomatic phrasing for Jesus’ position and the group’s astonishment, and retains the Greek distinction between astonishment and fear. The redundant [b] footnote and anchor are removed; the remaining [a] note continues to give the valid alternative for ἐν τῇ ὁδῷ.
