  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: ig
  text: 'Ha nọ n’ụzọ[a], na-arịgo Jerusalem; Jizọs na-aga n’ihu ha. Ha tụrụ n’anya, ma ndị na-eso n’azụ na-atụ egwu. Ọ kpọọrọ ndị Iri na Abụọ ahụ iche ọzọ, wee malite ịgwa ha ihe ndị ga-eme ya.


    [a] Ma ọ bụ, “ka ha na-aga.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ha na-aga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: Ha nọ n’ụzọ
  rationale: Nke a na-echekwa ọnọdụ njem ahụ n’ụzọ dị mfe ma bụrụkwa okwu Igbo nkịtị; nkọwa ala peeji na-egosi echiche ọzọ, ‘ka ha na-aga.’
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: na-arịgo Jerusalem
  rationale: ‘Na-arịgo’ na-echekwa ma ịdị elu Jerusalem ma ụzọ e si ekwu njem a na-aga obodo ahụ.
- source_word: προάγων αὐτούς
  choice: Jizọs nọ n’ihu ha na-aga
  rationale: Nke a na-egosi kpọmkwem na Jizọs nọ n’ihu ndị ọzọ, n’etinyeghị echiche ọzọ siri ike na ọ na-edu ha.
- source_word: ἐθαμβοῦντο
  choice: o jukwara ha anya
  rationale: Ọ bụ okwu Igbo ebumpụta ụwa maka oke iju anya ma ọ bụ mgbagwoju anya, na-enweghị ime ka ọ bụrụ ụjọ kpọmkwem.
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: ma ndị na-eso ha
  rationale: Nke a na-edobe ọdịdị participle ahụ, ghara ịkọwa ndị ahụ karịa ihe Grik kwuru.
- source_word: ἐφοβοῦντο
  choice: nọ na-atụ egwu
  rationale: Ọ na-enye echiche nke ọnọdụ ụjọ na-aga n’ihu dịka imperfect Grik ahụ si dị.
- source_word: παραλαβὼν ... τοὺς δώδεκα
  choice: Ọ kpọọrọ ndị Iri na Abụọ ahụ ... iche
  rationale: ‘Kpọọrọ ... iche’ na-enye n’Igbo echiche nke ịkpọpụ ha maka okwu nzuzo, dịka ọnọdụ akụkọ ahụ si gosi.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na Jizọs emeworị ụdị nkuzi a mbụ.
- source_word: ἤρξατο αὐτοῖς λέγειν
  choice: wee malite ịgwa ha
  rationale: Nke a bụ usoro okwu Igbo doro anya nke na-echekwa mmalite nke omume ahụ na ndị a na-agwa okwu.
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: ihe ndị gaje ime ya
  rationale: Ọ na-echekwa na ihe ndị ahụ dị nso ime, na-etinyeghị echiche siri ike nke akara aka nke okwu Grik ahụ ekwughị kpọmkwem.
theological_decisions:
- issue: Ọdịiche dị n’etiti mmetụta nke ìgwè abụọ ahụ
  choice: E depụtara ἐθαμβοῦντο dịka ‘o jukwara ha anya,’ ma ἐφοβοῦντο dịka ‘nọ na-atụ egwu.’
  alternative: Ijikọ mmetụta abụọ ahụ ọnụ dịka ụdị ụjọ ma ọ bụ iju anya.
  rationale: Grik ji ngwaa abụọ dị iche, ya mere nsụgharị ahụ na-echekwa ọdịiche na esemokwu dị n’akụkọ ahụ n’akọwaghị ihe kpatara mmetụta ha.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. ‘Ndị Iri na Abụọ’ ka e ji mee aha otu ahụ n’enweghị ịtinye ‘ndịozi,’ nke adịghị na amaokwu Grik a. E tinyere akara [b] n’ebe okwu προάγων αὐτούς dị, n’ihi na nkọwa ya metụtara ọnọdụ Jizọs n’ihu ha, ọ bụghị okwu πάλιν (‘ọzọ’).
