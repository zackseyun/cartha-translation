  text: τὸ δὲ καθίσαι ἐκ δεξιῶν μου ⸀ἢ ἐξ εὐωνύμων οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: ig
  text: Ma ịnọdụ n’aka nri m ma ọ bụ n’aka ekpe m abụghị nke m inye[a], kama ọ bụ maka ndị e kwadebeere ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụghị nke m inye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... καθίσαι
  choice: ịnọdụ
  rationale: Ngwaa a e mere aha n’asụsụ Grik na-egosi ịnọdụ ala ma ọ bụ ịnọ n’otu ọnọdụ; “ịnọdụ” bụ Igbo dị mfe ma na-edobe ike nke ngwaa ahụ.
- source_word: ἐκ δεξιῶν μου
  choice: n’aka nri m
  rationale: Nke a bụ akpaalaokwu na-egosi ọnọdụ dị n’akụkụ aka nri mmadụ; “n’aka nri m” bụ ụzọ Igbo si ekwu ya n’enweghị nkọwa agbakwunyere.
- source_word: ἢ ἐξ εὐωνύμων
  choice: ma ọ bụ n’aka ekpe m
  rationale: Akpaalaokwu ahụ pụtara akụkụ aka ekpe; e mere ya ka o kwekọọ n’usoro okwu “n’aka nri m.”
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: abụghị nke m inye
  rationale: Nsụgharị a na-esochi okwu Grik nso ma na-ahapụ nghọtahie ziri ezi banyere ma ihe a abụghị ikike ya ma ọ bụ na ọ bụghị ọrụ ya inye ya.
- source_word: ἀλλ’ οἷς
  choice: kama ọ bụ nke ndị
  rationale: Okwu Grik hapụrụ akụkụ ụfọdụ ka onye na-agụ ya ghọta site n’ahịrịokwu gara aga; Igbo a na-eme ka njikọ ahụ doo anya n’etinyeghị echiche ọhụrụ.
- source_word: ἡτοίμασται
  choice: a kwadebeere ya
  rationale: Perfect passive ahụ na-egosi na e meela nkwadebe ahụ, ihe a kwadebere ka dịkwa njikere; usoro a na-egosikwa onye mere nkwadebe ahụ n’ezoghị ọnụ.
theological_decisions:
- issue: Ma okwu Jizọs ọ̀ na-agọnahụ ikike ya kpamkpam ka ọ̀ bụ naanị na ọnọdụ akụkọ a
  choice: abụghị nke m inye
  alternative: ọ bụghị m ka ọ dịịrị inye
  rationale: Okwu Grik kwuru mmachi ahụ n’enweghị nkọwa ọzọ. Nsụgharị bụ isi na-edobe esemokwu nkà mmụta okpukpe ahụ kama ịgbakwunye nkọwa banyere uche Nna nke na-adịghị n’amaokwu a.
- issue: Onye kwadebere ebe ndị ahụ
  choice: a kwadebeere ya
  alternative: Chineke kwadebeere ya
  rationale: ἡτοίμασται bụ passive na-akpọghị onye mere ya aha. Ịkpọ Chineke aha n’ahịrịokwu bụ isi ga-eme ka ihe e zoro n’asụsụ isi pụta ìhè karịa ka ederede si kwuo.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “N’aka nri m” na “n’aka ekpe m” bụ akpaalaokwu Igbo nkịtị maka ọnọdụ ndị ahụ. E debere passive nke ikpeazụ n’enweghị ịkpọ onye mere nkwadebe ahụ aha, dịka isi Grik si dị.
