  text: καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν· ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ μία σάρξ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/008.yaml
  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: ig
  text: Ha abụọ ga-aghọ otu anụ ahụ. Ya mere, ha abụkwaghị abụọ, kama ha bụ otu anụ ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσονται
  choice: ga-aghọ
  rationale: Ọ bụ ezie na ngwaa ahụ sitere na εἰμί (‘ịbụ’), njikọ ya na εἰς na-egosi nsonaazụ nke ịdị n’otu; ‘ga-aghọ’ na-egosipụta nke a nke ọma n’Igbo.
- source_word: οἱ δύο
  choice: ha abụọ ahụ
  rationale: Nke a na-echekwa nkwusi ike dị n’ọnụọgụ abụọ ahụ ma na-eme ka ntụnyere ya na ‘mmadụ abụọ’ nke na-esote doo anya.
- source_word: εἰς σάρκα μίαν
  choice: otu anụ ahụ
  rationale: ‘Otu anụ ahụ’ na-echekwa okwu Akwụkwọ Nsọ banyere ịdị n’otu n’alụmdi na nwunye n’enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: σάρκα / σάρξ
  choice: anụ ahụ
  rationale: N’ebe a σάρξ pụtara anụ ahụ, ọ bụghị ‘ọdịdị mmehie’; ntụgharị a na-echekwakwa njikọ okwu ahụ na Jenesis.
- source_word: ὥστε
  choice: N’ihi ya
  rationale: Nke a na-egosi nkwubi okwu ma ọ bụ nsonaazụ sitere n’okwu bu ya ụzọ n’Igbo doro anya.
- source_word: οὐκέτι
  choice: abụghịzi
  rationale: 'Ụdị a na-egosi na ọnọdụ mbụ akwụsịla: ha adịkwaghị ka mmadụ abụọ.'
- source_word: ἀλλὰ μία σάρξ
  choice: kama ha bụ otu anụ ahụ
  rationale: Nke a na-echekwa ọdịiche siri ike dị n’etiti ‘abụọ’ na ‘otu anụ ahụ’.
theological_decisions:
- issue: Ihe ‘otu anụ ahụ’ pụtara n’okwu Jenesis Jizọs hotara
  choice: E debere okwu ahụ dị ka ‘otu anụ ahụ’ n’enweghị nkọwa agbakwunyere.
  alternative: otu ahụ; otu onye; ndị jikọrọ n’ụzọ mmekọahụ
  rationale: Akụkụ Akwụkwọ Nsọ a akọwaghị okwu ahụ n’otu ụzọ dị warara. Idebe ‘otu anụ ahụ’ na-echekwa obosara ihe ọ pụtara banyere njikọ alụmdi na nwunye ma ghara itinye nkọwa otu ụka ma ọ bụ onye nkọwa n’ime ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma dị ùgwù. E jiri ‘anụ ahụ’ chekwaa okwu anụ ahụ nke ederede Gris na njikọ ya na Jenesis; ahịrịokwu ahụ bụkwa nke ndị na-agụ akwụkwọ taa ga-aghọta ngwa ngwa.
