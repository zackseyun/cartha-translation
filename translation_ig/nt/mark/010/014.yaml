id: MRK.10.14
reference: Mark 10:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: ig
  text: Ma mgbe Jizọs hụrụ nke a, iwe were ya, ọ sị ha, “Kweenụ ka ụmụaka bịakwute m; unu egbochila ha, n’ihi na alaeze Chineke bụ nke ndị dị otu a.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara nnọọ n’okwu Grik, “n’ihi na nke ndị dị otu a ka alaeze Chineke bụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: Ma mgbe Jizọs hụrụ nke a
  rationale: A na-egosi ọnọdụ mere tupu mmeghachi omume Jizọs; ‘nke a’ na-ezo aka n’ihe ndị na-eso ụzọ mere n’amaokwu bu ụzọ, ebe ‘Ma’ na-egosi ọdịiche dị nro.
- source_word: ἠγανάκτησεν
  choice: iwe were ya
  rationale: Nke a bụ ụzọ Igbo dị ndụ si egosi oke iwe ma ọ bụ iwe sitere n’ịhụ ihe na-adịghị mma, n’etinyeghị echiche nke iwe na-enweghị njide.
- source_word: εἶπεν αὐτοῖς
  choice: ọ sị ha
  rationale: Ọ bụ usoro okwu Igbo nkịtị ma doo anya maka ikwu na mmadụ gwara ndị ọzọ okwu.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Kweenụ ka ụmụntakịrị bịakwute m
  rationale: ‘Kweenụ ka’ na-ebupụta iwu nke ikwe ma ọ bụ inye ohere; ‘ụmụntakịrị’ dabara n’ọnọdụ a nke metụtara ụmụaka a na-ekuru ma ọ bụ na-ewetara Jizọs.
- source_word: μὴ κωλύετε αὐτά
  choice: unu egbochila ha
  rationale: Na-enye iwu ka ha kwụsị ma ọ bụ ghara igbochi ụmụaka ịbịakwute Jizọs.
- source_word: τῶν γὰρ τοιούτων ἐστὶν
  choice: n’ihi na ... bụ nke ndị dị otu a
  rationale: Na-echekwa usoro na mgbagwoju anya nke Grik, ma na-egosi na τοιούτων na-ezo aka n’ụdị ndị yiri ụmụaka ndị a, ọ bụghị naanị n’ụmụaka ahụ nọ ebe ahụ.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Ọ bụ okwu Akwụkwọ Nsọ a maara nke ọma n’Igbo, na-echekwakwa echiche nke ọchịchị ma ọ bụ alaeze Chineke n’enweghị ịkọwa ya karịa ihe amaokwu ahụ kwuru.
theological_decisions:
- issue: Ihe okwu ‘τῶν ... τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ’ pụtara
  choice: Alaeze Chineke bụ nke ndị dị otu a
  alternative: Ọ bụ ndị dị otu a mejupụtara alaeze Chineke; ma ọ bụ, alaeze Chineke bụ naanị nke ụmụaka nkịtị
  rationale: ‘Ndị dị otu a’ na-echekwa ike nnọchiteanya nke τοιούτων ma ghara ikwu na ọ bụ naanị ụmụaka nkịtị ka okwu ahụ metụtara. Ọ naghịkwa etinye ozizi banyere ịdị ọcha ma ọ bụ nzọpụta ụmụaka nke amaokwu ahụ ekwughị kpọmkwem.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Kweenụ’ na ‘unu egbochila’ gosi na Jizọs na-agwa ọtụtụ ndị okwu; e zere okwu ụka pụrụ iche na nkọwa ozizi a na-adịghị ahụ kpọmkwem n’amaokwu ahụ.
