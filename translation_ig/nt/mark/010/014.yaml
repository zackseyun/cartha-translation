  verdict: revise
  source_fidelity: The translation accurately conveys Jesus' seeing the situation, his indignant reaction, the twofold command, and the representative sense of τῶν τοιούτων ('those such as these'). However, 'ụmụntakịrị' explicitly means 'little children' and adds a diminutive nuance not present in παιδία, which is adequately represented here by 'ụmụaka.'
  naturalness: The wording is clear, contemporary Standard Igbo, and appropriately dignified. 'Iwe were ya,' 'Kweenụ ka ... bịakwute m,' and 'unu egbochila ha' are natural in this context.
  terminology: '''Jizọs,'' ''alaeze Chineke,'' and ''ndị dị otu a'' are suitable Standard Igbo biblical terminology. ''Ndị dị otu a'' properly avoids restricting the saying to the particular children present or importing a doctrinal conclusion.'
  issues:
