    issue: The term 'ụmụntakịrị' is more specific than the Greek παιδία.
    rationale: While the immediate narrative concerns young children, παιδία itself means 'children' and is not formally diminutive. 'Ụmụaka' preserves the source wording without unnecessary narrowing.
