  text: And he said to them, “What do you want me to do for you?”
translation:
  language: ig
  text: Ọ sịrị ha, “Gịnị ka unu chọrọ ka m meere unu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ọ
  rationale: N’ebe a, ὁ δὲ na-aga n’ihu n’akụkọ ma na-egosi onye a na-ekwu maka ya. N’Igbo, ịmalite na ‘Ọ’ bụ ụzọ ebumpụta ụwa; itinye ‘ma’ ga-emesi ọdịiche ike karịa ka ọnọdụ a chọrọ.
- source_word: εἶπεν
  choice: sịrị
  rationale: λέγω bụ ngwaa nkịtị maka ikwu okwu. Ọ bụ ezie na okwu ahụ bụ ajụjụ, ‘sịrị’ na-anọgide nso n’okwu Grik, ebe ọdịdị ajụjụ ahụ n’onwe ya na-egosi na ọ jụrụ ha.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnochiaha dative plural a pụtara ‘ha.’ E tinyeghị ‘ha abụọ,’ n’ihi na ọ bụ ezie na gburugburu amaokwu ahụ na-egosi Jemis na Jọn, okwu Grik etinyeghị ‘abụọ.’
- source_word: Τί
  choice: Gịnị
  rationale: Nnochiaha ajụjụ neuter a na-ewebata ajụjụ ahụ ozugbo; ‘Gịnị’ bụ ntụgharị Igbo doro anya ma dị mfe.
- source_word: θέλετε
  choice: ka unu chọrọ
  rationale: θέλω na-egosi ọchịchọ. Usoro ‘Gịnị ka unu chọrọ...?’ bụ Igbo nkịtị ma na-edowe ajụjụ ahụ kpọmkwem.
- source_word: ποιήσω
  choice: ka m meere
  rationale: Aorist subjunctive nke ποιέω mgbe θέλετε gasịrị na-egosi ihe ha chọrọ ka o mee. ‘Ka m meere’ na-enye usoro Igbo ebumpụta ụwa ma kwekọọ na benefactive dative so ya.
- source_word: ὑμῖν
  choice: unu
  rationale: 'Dative a bụ benefactive: ihe a ga-eme maka ọdịmma ha. Mkpụrụedemede ‘-ere’ dị na ‘meere’ na nnochiaha ‘unu’ na-egosipụta echiche ‘meere unu.’'
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu ebumpụta ụwa ‘Gịnị ka unu chọrọ ka m meere unu?’ ma ghara ịgbakwunye ‘abụọ’ ma ọ bụ ime ka δέ bụrụ ọdịiche siri ike.
