  text: ⸀Καὶ ⸀ἐπηρώτων αὐτὸν εἰ ἔξεστιν ἀνδρὶ γυναῖκα ἀπολῦσαι, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/002.yaml
  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: ig
  text: Ha nọ na-ajụ ya ma iwu ò kwere ka nwoke gbaa nwunye alụkwaghịm[a], iji nwaa ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ma iwu ò kwere ka di gbaa nwunye ya alụkwaghịm.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτων
  choice: Ha nọ na-ajụ
  rationale: Oge imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro; ‘nọ na-ajụ’ na-egosipụta nke a n’Igbo eke.
- source_word: ἔξεστιν
  choice: iwu ò kwere
  rationale: N’ajụjụ gbasara alụmdi na nwunye, okwu a na-ekwu maka ihe iwu kwere, ọ bụghị naanị ihe mmadụ nwere ike ime.
- source_word: ἀνδρὶ
  choice: nwoke
  rationale: ἀνήρ nwere ike ịpụta ‘nwoke’ ma ọ bụ ‘di’; ‘nwoke’ na-edobe ọdịdị ajụjụ izugbe dị na Grik.
- source_word: γυναῖκα
  choice: nwunye
  rationale: N’ọnọdụ okwu gbasara ịgba alụkwaghịm, γυνή pụtara nwunye, ọ bụghị naanị nwanyị.
- source_word: ἀπολῦσαι
  choice: ịgba nwunye alụkwaghịm
  rationale: N’ọnọdụ iwu alụmdi na nwunye, ngwaa a pụtara ịgba alụkwaghịm karịa naanị ‘ịchụpụ’ ma ọ bụ ‘ịhapụ.’
- source_word: πειράζοντες
  choice: iji nwaa ya
  rationale: Nke a na-egosi na ebumnuche ha bụ ịnwa Jizọs; ntụgharị a na-edobe okwu ahụ n’enweghị ịgbakwunye na ha chọrọ ‘ịma ya n’ọnyà.’
- source_word: Καὶ
  choice: Ha
  rationale: Njikọ Καὶ na-aga n’ihu n’akụkọ ahụ; n’Igbo, enwere ike ịghara ịsụgharị ya iche ka ahịrịokwu wee bụrụ nke eke.
theological_decisions:
- issue: Ma a ga-asụgharị ἀνδρὶ dị ka ‘nwoke’ ka ọ bụ ‘di’
  choice: nwoke
  alternative: di
  rationale: ‘Nwoke’ na-echekwa ụdị ajụjụ iwu izugbe dị na Grik, ebe ‘nwunye’ na-eme ka ọnọdụ alụmdi na nwunye doo anya.
- issue: Ma πειράζοντες pụtara naanị ịnwa ya ka ọ bụ ịchọ ijide ya n’ọnyà
  choice: iji nwaa ya
  alternative: iji jide ya n’ọnyà
  rationale: ‘Iji nwaa ya’ na-echekwa obosara ihe okwu Grik nwere ike ịpụta ma ghara ime ka ebumnuche iro ahụ sie ike karịa ihe e kwuru kpọmkwem.
translation_notes:
  register: E ji Igbo Ọha na nke oge a dee ya n’ụzọ dị ùgwù ma dị mfe nghọta. Akara ụda dị mkpa n’ajụjụ ‘ò’ na enyere aka igosi ajụjụ n’ụzọ doro anya.
