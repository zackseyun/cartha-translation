revisions:
- from: Ọtụtụ ndị nọ na-abara ya mba ka ọ gbachie nkịtị, ma ọ nọgidere na-eti mkpu karịa, sị, “Nwa Devid[a], meere m ebere!”
  to: Ọtụtụ ndị nọ na-abara ya mba ka ọ gbachie nkịtị, ma ya onwe ya nọ na-eti mkpu karịa nnọọ, sị, “Nwa Devid[a], meere m ebere!”
  rationale: The revision preserves the Greek imperfect in both verbal clauses, makes the emphatic ‘all the more’ explicit, and corrects the footnote’s description of the translation practice. It retains the literal Davidic title rather than substituting an interpretation.
  reviewer_model: gpt-5.6-terra
