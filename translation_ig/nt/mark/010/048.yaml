    text: “Nwa Devid” bụ aha eze-Mesaya. A pụkwara ịkọwa ihe ọ pụtara dịka “Mesaya,” ma ebe a, a sụgharịwo aha Grik ahụ n’ụzọ nkịtị.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek imperfect in both verbal clauses, makes the emphatic ‘all the more’ explicit, and corrects the footnote’s description of the translation practice. It retains the literal Davidic title rather than substituting an interpretation.
