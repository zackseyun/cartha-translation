  text: καὶ ἐπετίμων αὐτῷ πολλοὶ ἵνα σιωπήσῃ· ὁ δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: ig
  text: Ọtụtụ ndị nọ na-abara ya mba ka ọ gbachie nkịtị, ma ya onwe ya nọ na-eti mkpu karịa nnọọ, sị, “Nwa Devid[a], meere m ebere!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nwa Devid” bụ aha eze-Mesaya. A pụkwara ịkọwa ihe ọ pụtara dịka “Mesaya,” ma ebe a, a sụgharịwo aha Grik ahụ n’ụzọ nkịtị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: nọ na-abara ya mba
  rationale: Nkebi okwu a na-egosi omume siri ike nke ọtụtụ ndị nọ na-eme ugboro ugboro ma ọ bụ na-aga n’ihu, dịka imperfect Grik si gosi.
- source_word: πολλοὶ
  choice: Ọtụtụ ndị
  rationale: Nke a na-asụgharị adjective ahụ e ji dị ka aha kpọmkwem, n’etinyeghị ‘ìgwè mmadụ,’ nke na-adịghị kpọmkwem n’asụsụ Grik.
- source_word: ἵνα σιωπήσῃ
  choice: ka ọ gbachie nkịtị
  rationale: Nke a na-egosi ebumnuche ha ji na-abara ya mba n’Igbo doro anya ma dịkwa eke.
- source_word: πολλῷ μᾶλλον
  choice: karịa
  rationale: N’ọnọdụ a, ‘karịa’ na-egosi na ọ mụbara iti mkpu ya n’agbanyeghị mba ha baara ya, ma ọ naghị etinye nkọwa ‘n’olu ka ukwuu’ nke Grik na-ekwughị kpọmkwem.
- source_word: ἔκραζεν
  choice: ọ nọgidere na-eti mkpu
  rationale: ‘Nọgidere’ na-echekwa ọdịdị omume na-aga n’ihu nke imperfect, ebe ‘iti mkpu’ na-egosi arịrịọ siri ike nke κράζω.
- source_word: Υἱὲ Δαυίδ
  choice: Nwa Devid
  rationale: Aha a ka a sụgharịrị n’ụzọ nkịtị iji chekwaa okwu Grik ahụ na ihe ọ pụtara banyere eze Mesaya.
- source_word: ἐλέησόν με
  choice: meere m ebere
  rationale: Nke a bụ arịrịọ Igbo dị eke nke na-echekwa ike nke imperative ahụ na echiche ebere.
theological_decisions:
- issue: Ihe aha ‘Nwa Devid’ pụtara banyere Mesaya
  choice: E debere aha ahụ dịka ‘Nwa Devid’ kama ịkọwa ya dịka ‘Mesaya.’
  alternative: “Mesaya, meere m ebere.”
  rationale: Grik kwuru Υἱὲ Δαυίδ kpọmkwem. Idebe aha ahụ na-echekwa okwu ederede na njikọ ya na nkwa eze sitere n’agbụrụ Devid, n’ebughị ụzọ kpebie nkọwa ya maka onye na-agụ ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. ‘Ịbara mba,’ ‘ịgbachi nkịtị,’ na ‘imere ebere’ bụ okwu ndị nkịtị ga-aghọta, ma ha ka na-echekwa ịdị arọ na ngwa ngwa nke ọnọdụ ahụ.
