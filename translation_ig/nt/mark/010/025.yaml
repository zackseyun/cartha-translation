  text: εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸂τῆς τρυμαλιᾶς τῆς⸃ ῥαφίδος ⸀διελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: ig
  text: Ọ dịịrị kamel mfe ịgafe n’anya agịga karịa ka ọ dịịrị ọgaranya ịbanye n’alaeze Chineke.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ka kpọmkwem, “isi n’anya agịga gafee.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ atụpụtala “eriri” kama “kamel,” ma ederede Grik dị ebe a nwere “kamel.”
    reason: alternative_reading
  - marker: c
    text: Okwu Grik a sụgharịrị “ọgaranya” dị n’ụdị nwoke otu, ma o nwere nnọchite anya n’ozuzu.
    reason: cultural_note
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: Ọ dịrị ... mfe ... karịa
  rationale: Nke a na-egosipụta ntụnyere nke pụtara ‘ọ dị mfe karịa,’ ma na-edobe ike nke ihe atụ ahụ.
- source_word: κάμηλον
  choice: kamel
  rationale: Okwu Grik ahụ pụtara kamel; ọ bụghị ‘eriri.’ Nke a na-echekwa ihe atụ siri ike Jizọs ji kwuo okwu.
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: isi n’oghere anya agịga
  rationale: Nkebiokwu a na-ezo aka n’obere oghere dị n’agịga e ji akwa ihe; ‘oghere anya agịga’ doro anya n’Igbo.
- source_word: διελθεῖν
  choice: gafee
  rationale: Ọ na-enye echiche nke isi n’otu akụkụ nke oghere gafee n’akụkụ nke ọzọ.
- source_word: πλούσιον
  choice: ọgaranya
  rationale: Ọ bụ adjective Grik e ji mee aha, n’ụdị nwoke otu; n’Igbo, ‘ọgaranya’ bụ okwu ebumpụta ụwa nke nwere ike ịnọchite anya onye bara ọgaranya n’ozuzu.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ịbanye n’alaeze Chineke
  rationale: ‘Alaeze Chineke’ bụ nsụgharị kwụ ọtọ nke βασιλεία τοῦ θεοῦ, ‘ịbanye’ kwekọrọ na ngwaa nke isi banye.
- source_word: εἰσελθεῖν
  choice: ịbanye
  rationale: Ọ bụ okwu Igbo dị mkpirikpi ma doo anya maka ‘to enter.’
theological_decisions:
- issue: Ihe ihe atụ kamel na anya agịga pụtara
  choice: Idowe kamel na oghere anya agịga dịka ihe atụ siri ike nke ihe na-apụghị ime eme.
  alternative: Ịkọwa ‘anya agịga’ dịka otu obere ọnụ ụzọ ámá na Jerusalem, ma ọ bụ iji ‘eriri’ dochie ‘kamel.’
  rationale: Ihe odide Grik n’onwe ya kwuru ‘kamel’ na ‘oghere anya agịga.’ Nsụgharị ahụ ekwesịghị itinye ọdịnala nkọwa e mesịrị ma ọ bụ belata ike na esemokwu dị n’okwu Jizọs.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ‘Ọ dịrị ... mfe ... karịa ka ọ dịrị ...’ na-eme ka ntụnyere ahụ bụrụ nke ebumpụta ụwa n’Igbo, ebe ‘oghere anya agịga’ na-echekwa ihe oyiyi kpọmkwem nke isi mmalite.
