  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὃς ⸀ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ καὶ γαμήσῃ ἄλλην μοιχᾶται ἐπ’ αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: ig
  text: Ọ sịrị ha, “Onye ọ bụla gbara nwunye ya alụkwaghịm ma lụọ nwanyị ọzọ na-akwa iko megide nwunye ya ahụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Ọ sịrị
  rationale: A sụgharịrị historical present nke Mak n’ụdị oge gara aga nke na-ada nke ọma n’akụkọ Igbo; ọ ka na-egosi na Jizọs bụ onye kwuru okwu ahụ.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnochiaha dative a na-arụ ọrụ dị ka ndị a gwara okwu.
- source_word: Ὃς ἂν
  choice: Onye ọ bụla
  rationale: Nke a na-egosipụta ọnọdụ izugbe a na-akọwaghị onye kpọmkwem, dị ka njikọ relative pronoun na ἄν si pụta.
- source_word: ἀπολύσῃ
  choice: gbara ... alụkwaghịm
  rationale: N’ọnọdụ alụmdi na nwunye a, okwu ahụ pụtara ịgba alụkwaghịm, ọ bụghị nanị ịchụpụ mmadụ.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: nwunye ya
  rationale: Ọnọdụ okwu na ihe gbasara ịgba alụkwaghịm na-egosi na γυνή bụ ‘nwunye,’ ọ bụghị naanị ‘nwanyị.’
- source_word: γαμήσῃ ἄλλην
  choice: lụọkwa nwanyị ọzọ
  rationale: ἄλλην bụ feminine ma na-ezo aka n’ịlụ nwanyị ọzọ; ikwu ‘nwanyị ọzọ’ doro anya ma bụrụ Igbo nkịtị.
- source_word: μοιχᾶται
  choice: na-akwa iko
  rationale: Nke a bụ ụzọ Igbo a na-aghọta nke ọma isi kwuo ime mmehie ịkwa iko n’alụmdi na nwunye.
- source_word: ἐπ’ αὐτήν
  choice: megide nwunye ya ahụ
  rationale: 'Nke a na-edobe ike preposition ahụ: ihe nwoke ahụ mere bụ mmejọ megide nwunye mbụ ya, ọ bụghị nanị ịkwa iko n’ozuzu.'
theological_decisions:
- issue: Ma a ga-edobe ike ἐπ’ αὐτήν dị ka mmejọ e mere nwunye ahụ
  choice: na-akwa iko megide nwunye ya ahụ
  alternative: na-akwa iko; na-akwa iko na nwanyị ọzọ
  rationale: Okwu Grik ahụ gụnyere ἐπ’ αὐτήν, ya mere nsụgharị ahụ ekwesịghị iwepụ echiche na omume di ahụ bụ mmejọ megide nwunye ya.
- issue: Ụdị okwu masculine singular nke na-ewebata ọnọdụ izugbe
  choice: Onye ọ bụla
  alternative: Nwoke ọ bụla
  rationale: ‘Onye ọ bụla’ na-egosipụta indefinite general condition nke ọma, ebe ‘nwunye ya’ na-eme ka o doo anya na onye a na-ekwu banyere ya n’ebe a bụ di.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Ọ sịrị’ mee ka akụkọ ahụ daa nke ọma n’Igbo, ebe a kọwara ἄλλην n’uju dị ka ‘nwanyị ọzọ.’
