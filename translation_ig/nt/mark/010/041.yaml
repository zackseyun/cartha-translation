review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the antecedent hearing, the group designated simply as ‘the ten,’ the ingressive force of ἤρξαντο (‘began’), and their indignation directed toward James and John. The supplied ‘nke a’ is a natural contextual object for ἀκούσαντες. ‘Mmadụ iri ahụ’ is not wrong, but ‘ndị iri ahụ’ more idiomatically identifies the known group without adding ‘disciples’ or ‘the other ten.’
  naturalness: The sentence structure is natural Standard Igbo. Replacing ‘mmadụ iri ahụ’ with ‘ndị iri ahụ’ improves idiomatic reference to a defined group. The footnote needed more natural wording and a clearer description of the Greek preposition’s semantic range.
  terminology: For Ἰάκωβος in this New Testament context, ‘Jemis’ is the established and readily recognizable Igbo biblical form for James; ‘Jakọb’ is liable to be understood as Jacob and should not be used here. ‘Jọn’ is appropriate for John.
  issues:
  - severity: medium
    issue: The personal name ‘Jakọb’ is used for Ἰακώβου.
    rationale: In Mark 10:41 the referent is James, son of Zebedee. Standard Igbo biblical usage distinguishes this name as ‘Jemis’; ‘Jakọb’ risks conflation with Jacob.
  - severity: low
    issue: ‘Mmadụ iri ahụ’ is less idiomatic than ‘ndị iri ahụ’ for this contextual group.
    rationale: Both can convey ‘the ten,’ but ‘ndị iri ahụ’ naturally refers to the identified group while preserving the Greek’s lack of an explicit ‘disciples’ or ‘other.’
  - severity: low
    issue: The footnote’s explanation of the preposition is awkwardly phrased.
    rationale: It should clearly state that the preposition may identify either the target/object of the indignation or its occasion/cause.
  revised_text: Mgbe ndị iri ahụ nụrụ nke a, ha malitere iwe Jemis na Jọn iwe.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha malitere iwe banyere Jemis na Jọn,” ma ọ bụ, “ha malitere iwe n'ihi Jemis na Jọn.” Okwu mmalite Grik ahụ nwere ike igosi ndị iwe ahụ lekwasịrị anya, ma ọ bụ ihe kpatara iwe ahụ.
    reason: lexical_alternative
  revision_rationale: The revision retains the source text’s ambiguity about περί through the footnote, improves the idiomatic designation of ‘the ten,’ and uses the standard Igbo New Testament name ‘Jemis’ for James. No interpretive or doctrinal material has been added.
