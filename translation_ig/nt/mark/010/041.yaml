- from: Mgbe mmadụ iri ahụ nụrụ nke a, ha malitere iwe Jakọb na Jọn iwe.[a]
  to: Mgbe ndị iri ahụ nụrụ nke a, ha malitere iwe Jemis na Jọn iwe.[a]
