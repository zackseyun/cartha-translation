  text: Καὶ ἀκούσαντες οἱ δέκα ἤρξαντο ἀγανακτεῖν περὶ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/041.yaml
  text: And when the ten heard it[a], they began to be indignant with James and John.
translation:
  language: ig
  text: Mgbe ndị iri ahụ nụrụ nke a, ha malitere iwe Jemis na Jọn iwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha malitere iwe banyere Jemis na Jọn,” ma ọ bụ, “ha malitere iwe n'ihi Jemis na Jọn.” Okwu mmalite Grik ahụ nwere ike igosi ndị iwe ahụ lekwasịrị anya, ma ọ bụ ihe kpatara iwe ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Mgbe
  rationale: N'Igbo, njikọ temporal nke participle na-enye usoro akụkọ ahụ n'ụzọ ebumpụta ụwa; a hapụrụ ‘na’ dị iche iji zere ntụgharị siri ike.
- source_word: ἀκούσαντες
  choice: mgbe ... nụrụ nke a
  rationale: Aorist participle na-egosi ihe mere tupu isi ngwaa; ‘mgbe ... nụrụ’ bụ Igbo dị mfe ma doo anya. ‘Nke a’ na-anọchi ihe e kwuru n'amaokwu ndị bu ụzọ.
- source_word: οἱ δέκα
  choice: mmadụ iri ahụ
  rationale: Nke a na-edobe kpọmkwem ‘ndị iri ahụ’ n'enweghị ịgbakwunye ‘ndị ọzọ’ ma ọ bụ ‘ndị na-eso ụzọ,’ ọ bụ ezie na a maara ha site n'ọnọdụ akụkọ.
- source_word: ἤρξαντο
  choice: malitere
  rationale: Na-egosipụta mmalite nke mmeghachi omume ahụ kpọmkwem.
- source_word: ἀγανακτεῖν
  choice: iwe ... iwe
  rationale: Akpaokwu Igbo a na-egosi oke iwe ma ọ bụ iwe sitere n'ịjụ omume mmadụ; ọ bụ okwu ndị mmadụ na-aghọta nke ọma.
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: Jakọb na Jọn
  rationale: N'usoro ‘iwe mmadụ iwe,’ aha ndị a bụ ndị iwe ahụ chere ihu; nkọwa ala peeji na-echekwa ohere na περί nwekwara ike igosi ihe kpatara iwe ahụ.
- source_word: Ἰακώβου
  choice: Jakọb
  rationale: Ụdị aha a na-ejikarị eme ihe n'Igbo maka Ἰάκωβος.
- source_word: Ἰωάννου
  choice: Jọn
  rationale: Ụdị aha a na-ejikarị eme ihe n'Igbo maka Ἰωάννης.
