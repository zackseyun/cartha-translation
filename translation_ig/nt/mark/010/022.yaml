source:
  edition: SBLGNT
  text: ὁ δὲ στυγνάσας ἐπὶ τῷ λόγῳ ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: ig
  text: Ma, ihu ya gbarụrụ ọchịchịrị n’ihi okwu ahụ[a]; o wee jiri mwute pụọ, n’ihi na o nwere ọtụtụ ihe onwunwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “obi dara ya,” ma ọ bụ “ihu ya dara.” Okwu Grik na-egosi na ọdịdị ihu ya gbanwere wee gbaa ọchịchịrị n’ihi mwute.
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνάσας
  choice: ihu ya gbara ọchịchịrị
  rationale: Nke a na-egosipụta mgbanwe a pụrụ ịhụ n’ihu ya—ọ ghọrọ onye ihu jọrọ njọ n’ihi mwute—ma ghara ime ka ọ bụrụ nanị mmetụta dị n’ime obi.
- source_word: ἐπὶ τῷ λόγῳ
  choice: n’ihi okwu ahụ
  rationale: Akpaokwu a na-egosi na okwu ahụ bụ ihe kpatara mmeghachi omume ya; ‘okwu ahụ’ na-edebekwa λόγῳ dị ka otu okwu ma na-ada nke ọma n’Igbo.
- source_word: ἀπῆλθεν
  choice: ọ ... pụọ
  rationale: ‘Pụọ’ bụ ụzọ Igbo nkịtị ma doo anya si akọ na ọ hapụrụ ebe ahụ.
- source_word: λυπούμενος
  choice: jiri mwute
  rationale: Nke a na-egosi na mwute ahụ so ya mgbe ọ na-apụ, dịka participle nke oge ugbu a si egosi omume/mmetụta na-aga n’ihu.
- source_word: κτήματα πολλά
  choice: ọtụtụ ihe onwunwe
  rationale: ‘Ihe onwunwe’ gụnyere akụ na ihe mmadụ nwere; ‘ọtụtụ’ na-egosipụta πολλά n’enweghị ịkọwa ya dịka naanị nnukwu ala ma ọ bụ ịdị ukwuu.
- source_word: ἦν γὰρ ἔχων
  choice: n’ihi na o nwere
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa maka ọnọdụ na-adịgide adịgide nke inwe ihe.
theological_decisions:
- issue: Ụdị mmeghachi omume nwoke ahụ n’ihi ihe Jizọs gwara ya
  choice: E gosipụtara ihu ya nke gbara ọchịchịrị na mwute ya na-aga n’ihu, n’etinyeghị ikpe ọzọ banyere ebumnobi ya.
  alternative: Ịsị na iwe were ya, ma ọ bụ na ọ bụ naanị mmechu ihu ka o nwere.
  rationale: Okwu Grik na-akọ ọdịdị mwute a pụrụ ịhụ na iru uju ya, ma ọ naghị ekwu kpọmkwem na iwe were ya ma ọ bụ kọwaa omume ya n’ụzọ ikpe okpukpe.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. A họọrọ ‘ihu ya gbara ọchịchịrị’ iji chekwaa ihe oyiyi a pụrụ ịhụ dị na στυγνάσας. E tinyere naanị otu akara nkọwa ala peeji [a], nke dịkwa n’ahịrị isi.
