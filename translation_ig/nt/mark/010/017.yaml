id: MRK.10.17
reference: Mark 10:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: ig
  text: Mgbe ọ na-apụ ịmalite njem[a], otu nwoke gbara ọsọ bịakwute ya, gbuo ikpere n’ala n’ihu ya, wee jụọ ya, “Onye Ozizi ọma, gịnị ka m ga-eme ka m wee keta ndụ ebighị ebi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Mgbe ọ na-apụ banye n’ụzọ.” Nkebiokwu Grik ahụ pụrụ ịpụta ịpụ banye n’ụzọ ma ọ bụ ịmalite njem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: Mgbe ọ na-apụ abanye n’ụzọ
  rationale: Nkebiokwu a na-egosi ihe na-eme n’otu oge ahụ nwoke ahụ bịakwutere ya. Nsụgharị a na-echekwa echiche nke ịpụ banye n’ụzọ, ebe nkọwa ala peeji na-egosikwa na ọ pụrụ ịpụta ịmalite njem.
- source_word: προσδραμὼν
  choice: gbara ọsọ bịakwute ya
  rationale: Nke a na-egosipụta ọsọ na ngwa ngwa nwoke ahụ ji bịakwute Jizọs n’ụzọ doro anya n’Igbo.
- source_word: εἷς
  choice: otu nwoke
  rationale: Okwu Grik ahụ bụ otu onye n'ụdị nwoke, ya mere “otu nwoke” na-echekwa nkọwa ya n’akụkọ a.
- source_word: γονυπετήσας αὐτόν
  choice: gbuo ikpere n’ala n’ihu ya
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị ndụ isi kwuo na ọ sekpuru n’ikpere n’ihu ya n’ụzọ nkwanye ùgwù na arịrịọ.
- source_word: ἐπηρώτα αὐτόν
  choice: wee jụọ ya
  rationale: Ọ bụ nsụgharị dị mfe ma bụrụ nke ebumpụta ụwa n’usoro akụkọ Igbo; ọ naghị agbakwunye ike ajụjụ okwu ahụ na-akwadoghị.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Ezigbo Onye Ozizi
  rationale: “Onye Ozizi” na-asụgharị διδάσκαλος n’enweghị ibubata aha dị ike karịa ya, ebe “ezigbo” na-echekwa ἀγαθέ nke dị mkpa n’okwu na-esote.
- source_word: τί ποιήσω
  choice: gịnị ka m ga-eme
  rationale: Ajụjụ a na-achọ ịmata ihe omume a chọrọ n’aka ya. Ụdị a bụ nke ebumpụta ụwa n’Igbo ma na-echekwa ajụjụ ahụ n’enweghị ịkọwa ihe karịrị ederede.
- source_word: ἵνα
  choice: ka m wee
  rationale: Nke a na-egosi nzube ma ọ bụ ihe omume ahụ ga-eweta n'ụzọ doro anya n’Igbo.
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndụ na-adịru mgbe ebighị ebi, ma na-echekwa ịdị arọ nke okwu ahụ n’ọmụmụ okpukpe.
- source_word: κληρονομήσω
  choice: keta
  rationale: “Keta” na-echekwa echiche nke ịnata ihe dịka ihe nketa, kama ime ka ọ bụrụ naanị inweta ihe.
theological_decisions:
- issue: Aha nwoke ahụ kpọrọ Jizọs
  choice: Ezigbo Onye Ozizi
  alternative: Ezigbo Nna Ukwu
  rationale: Ederede Grik ji διδάσκαλε, ya bụ onye ozizi, ọ bụghị okwu pụtara Onyenwe anyị ma ọ bụ nna ukwu. Nke a na-echekwa okwu ahụ nke ọma ma ghara ibubata nkwupụta ọzọ.
- issue: Igosipụta ụdị nwoke nke εἷς
  choice: otu nwoke
  alternative: otu onye
  rationale: Ụdị okwu Grik ahụ bụ nke nwoke, ọnọdụ akụkọ ahụ na-akwadokwa “otu nwoke”; nke a na-echekwa nkọwa ederede kama ime ka ọ ghara igosi nwoke ma ọ bụ nwaanyị.
- issue: Mmekọrịta dị n’etiti ime ihe na iketa ndụ ebighị ebi
  choice: gịnị ka m ga-eme ka m wee keta ndụ ebighị ebi?
  alternative: gịnị ka m kwesịrị ime iji nweta ndụ ebighị ebi?
  rationale: Nsụgharị a na-echekwa ajụjụ nwoke ahụ kpọmkwem, tinyere echiche “iketa,” n’enweghị ikpebi ma ọ bụ kọwaa n’ihu oge otú ime ihe na ihe nketa si metụta ibe ha n’ụzọ nkà mmụta okpukpe.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-agbaso akụkọ Igbo dị ndụ, ma na-echekwa okwu ndị dị mkpa dịka “Onye Ozizi,” “keta,” na “ndụ ebighị ebi.”
