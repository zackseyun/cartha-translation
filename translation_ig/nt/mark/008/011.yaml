revisions:
- from: Ndị Farisii wee pụta, malite ịrụrịta ụka na ya. Ha rịọrọ ya ka o nye ha ihe ịrịba ama sitere n’eluigwe[a], iji nwalee ya.
  to: Ndị Farisii pụtara, wee malite ịrụrịta ụka na ya, na-achọ n’aka ya ihe ịrịba ama sitere n’eluigwe[a], iji nwalee ya.
  rationale: The revision smooths the Standard Igbo coordination, preserves the Greek ingressive sense (“wee malite”), and renders the participial ζητοῦντες more directly as “na-achọ n’aka ya.” It retains the literal and theologically resonant “sitere n’eluigwe” in the main text and preserves the lexical alternative in the footnote.
  reviewer_model: gpt-5.6-terra
