source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: ig
  text: Ndị Farisii pụtara, wee malite ịrụrịta ụka na ya, na-achọ n’aka ya ihe ịrịba ama sitere n’eluigwe[a], iji nwalee ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “sitere na mbara igwe”; ma o yikarịrị ka okwu a pụtara ihe ịrịba ama sitere n’eluigwe, ya bụ, n’aka Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: wee pụta
  rationale: Aorist nke ἐξέρχομαι na-egosi na ha pụtara banye n’ihe a na-akọ, n’ebughị ụzọ kọwaa ebe ha si pụta.
- source_word: ἤρξαντο συζητεῖν
  choice: malite ịrụrịta ụka
  rationale: ἤρξαντο na-enye echiche mmalite, ebe συζητεῖν n’ọnọdụ iro a pụtara ịrụrịta ụka karịa naanị ikwurịta okwu.
- source_word: αὐτῷ
  choice: na ya
  rationale: Dative ahụ na συζητεῖν na-egosi onye ha na ya na-arụrịta ụka; e debere nnọchiaha ahụ kama itinye aha Jizọs nke na-adịghị na Grik.
- source_word: ζητοῦντες παρ’ αὐτοῦ
  choice: Ha rịọrọ ya ka o nye ha
  rationale: Nke a bụ ụzọ Igbo dị ndụ si gosipụta na ha na-achọ ihe n’aka ya, ma ọ naghị eme ka arịrịọ ahụ bụrụ iwu siri ike karịa ihe Grik kwuru.
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: Nhọrọ a na-echekwa echiche nke ihe akaebe na-egosi ikike ma ọ bụ nkwado, kama ịsụgharị ya naanị dị ka ọrụ ebube.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: sitere n’eluigwe
  rationale: Ọ na-echekwa usoro na ụda okpukpe nke Grik, nke n’ọnọdụ a yikarịrị ka ọ na-ezo aka n’ebe Chineke nọ ma ọ bụ nkwado ya.
- source_word: πειράζοντες αὐτόν
  choice: iji nwalee ya
  rationale: πειράζω ebe a bụ nnwale iro; 'nwalee' na-echekwa nke ahụ n’emeghị ka ọ pụta na ha na-arafu ya ime mmehie.
theological_decisions:
- issue: Ihe ‘sitere n’eluigwe’ pụtara n’arịrịọ maka ihe ịrịba ama
  choice: Ihe ịrịba ama sitere n’aka Chineke ma ọ bụ nke nwere nkwado eluigwe
  alternative: Ihe ịrịba ama sitere na mbara igwe
  rationale: N’ọnọdụ akụkọ Oziọma a, okwu ahụ yikarịrị ka ọ na-achọ ihe akaebe sitere n’aka Chineke. Ma isi ederede ka debere okwu sara mbara ‘sitere n’eluigwe’ iji ghara imechi nghọta ọzọ kpamkpam.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ịrụrịta ụka’ na-egosi esemokwu dị n’ọnọdụ ahụ; ‘ihe ịrịba ama’ na-echekwa okwu nkà mmụta okpukpe n’enweghị ịgbakwunye nkọwa otu ụka.
