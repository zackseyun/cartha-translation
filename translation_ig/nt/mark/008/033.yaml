revisions:
- from: Ma ọ tụgharịrị, hụ ndị na-eso ụzọ ya, ọ baara Pita mba, sị, “Gaa n’azụ m, Setan! N’ihi na ị naghị etinye uche gị n’ihe nke Chineke, kama n’ihe nke ụmụ mmadụ[a].”
  to: Ma o tụgharịrị wee hụ ndị na-eso ụzọ ya, ọ baara Pita mba, sị, “Gaa n’azụ m, Setan! N’ihi na ị naghị etinye uche gị n’ihe Chineke, kama n’ihe ụmụ mmadụ.”
  rationale: The revision corrects the Igbo linkage of the initial actions and uses a more idiomatic possessive construction. It preserves the source’s force, direct address to Peter as “Setan,” historical narrative sense, and open-ended contrast between God’s concerns and human concerns. The redundant footnote has been removed.
