id: MRK.8.33
reference: Mark 8:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: ig
  text: Ma o tụgharịrị wee hụ ndị na-eso ụzọ ya, ọ baara Pita mba, sị, “Gaa n’azụ m, Setan! N’ihi na ị naghị etinye uche gị n’ihe Chineke, kama n’ihe ụmụ mmadụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: ọ tụgharịrị
  rationale: Ọ na-egosi na Jizọs tụgharịrị ahụ ya; aorist participle ahụ na-ebute ihe omume sochiri ya n’akụkọ.
- source_word: ἰδὼν
  choice: hụ
  rationale: 'Nke a na-edobe usoro omume ahụ n’asụsụ Igbo dị mfe: ọ tụgharịrị wee hụ ndị na-eso ụzọ ya.'
- source_word: μαθητὰς
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị na-amụta ihe n’aka Jizọs ma na-eso ya.
- source_word: ἐπετίμησεν
  choice: ọ baara ... mba
  rationale: Akpaalaokwu a na-egosi ịdọ aka ná ntị ma ọ bụ ịkatọ mmadụ n’ike, dabara n’ụda ἐπιτιμάω ebe a.
- source_word: καὶ λέγει
  choice: sị
  rationale: A sụgharịrị historical present dị ka ihe gara aga ka akụkọ ahụ na-aga nke ọma n’Igbo.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Gaa n’azụ m
  rationale: Nke a na-edobe iwu ahụ na ọnọdụ ‘n’azụ m’ n’enweghị ịgbakwunye na Pita ga-apụ kpamkpam.
- source_word: Σατανᾶ
  choice: Setan
  rationale: Nke a bụ aha a na-amakarị n’Igbo maka vocative ahụ; ọ na-edobe ịdị nkọ nke okwu Jizọs.
- source_word: φρονεῖς
  choice: ị naghị etinye uche gị n’
  rationale: Ọ bụghị naanị iche echiche ka φρονέω pụtara; ọ gụnyere ebe ọchịchọ na echiche mmadụ gbadoro ụkwụ.
- source_word: τὰ τοῦ θεοῦ
  choice: ihe nke Chineke
  rationale: Nke a na-edobe okwu Grik ahụ sara mbara ma ghara ịkọwa ya naanị dị ka ‘ọchịchọ’ ma ọ bụ ‘uru’ Chineke.
- source_word: τὰ τῶν ἀνθρώπων
  choice: ihe nke ụmụ mmadụ
  rationale: ‘Ụmụ mmadụ’ na-egosi ihe gbasara mmadụ niile, ma na-edobe ntụnyere dị n’etiti nke Chineke na nke mmadụ.
theological_decisions:
- issue: Onye okwu ‘Setan’ na-ezo aka na ya mgbe Jizọs na-agwa Pita okwu
  choice: Jizọs baara Pita mba ozugbo ma kpọọ ya ‘Setan,’ n’enweghị ịsị na Pita bụ Setan n’onwe ya.
  alternative: Jizọs na-agwa Setan nọ n’azụ Pita okwu, ma ọ bụ na ‘Setan’ pụtara naanị ‘onye iro.’
  rationale: Grik kpọrọ Pita aha dị ka onye a baara mba, okwu ahụ e kwuru sokwa ya ozugbo. Nsụgharị ahụ na-edobe ịdị nkọ na mgbagwoju anya nke amaokwu ahụ n’enweghị ịgbakwunye nkọwa banyere ụdị njikọ Pita na Setan.
- issue: Ihe ἀνθρώπων pụtara
  choice: ụmụ mmadụ
  alternative: ndị nwoke; mmadụ
  rationale: N’ebe a, okwu Grik ahụ na-ekwu maka ụmụ mmadụ niile, ọ bụghị naanị ụmụ nwoke. ‘Ụmụ mmadụ’ na-egosi nke a n’Igbo ma na-edobe ntụnyere Chineke na mmadụ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị mfe ma dị nsọ, mee nsụgharị ahụ. A hapụrụ ntụnyere ‘ihe nke Chineke ... ihe nke ụmụ mmadụ’ ka ọ saa mbara dịka ọ dị na Grik, ma e zere ịkọwa ya karịa ihe amaokwu ahụ kwuru.
