  to: N’ihi na onye ọ bụla ihere m na okwu m mere n’ọgbọ a na-akwa iko, bụkwa ọgbọ mmehie[a], Nwa nke Mmadụ ga-emekwa onye ahụ ihere mgbe ọ ga-abịa n’ebube Nna ya, ya na ndị mmụọ ozi dị nsọ.
  rationale: The correction restores the direction of ἐπαισχυνθῇ by using the idiomatic construction “ihere m na okwu m mere.” It removes the added fullness nuance from the description of the generation while retaining the source’s paired characterization. No doctrinal interpretation has been added.
