id: MRK.8.38
reference: Mark 8:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: ig
  text: N’ihi na onye ọ bụla ihere m na okwu m mere n’ọgbọ a na-akwa iko, bụkwa ọgbọ mmehie[a], Nwa nke Mmadụ ga-emekwa onye ahụ ihere mgbe ọ ga-abịa n’ebube Nna ya, ya na ndị mmụọ ozi dị nsọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọgbọ a na-ekwesịghị ntụkwasị obi, bụkwa ọgbọ mmehie.” E debere “na-akwa iko” n’ahịrị bụ isi n’ihi na Grik ji ihe atụ amụma nke ịkwa iko gosipụta ekwesịghị ntụkwasị obi nye Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: ihere m ... na-eme / ga-emekwa onye ahụ ihere
  rationale: Nkebiokwu Igbo a na-egosipụta ihere mmadụ na-eme n’ihi mmekọrịta ya na Jizọs na okwu ya, ma na-echekwakwa mmeghachi omume kwekọrọ na ya n’ọdịnihu. A sụgharịghị ya dị ka ‘ịjụ’ n’ihi na nke ahụ ga-esi ike karịa ihe ngwaa Grik pụtara.
- source_word: λόγους
  choice: okwu m
  rationale: ‘Okwu’ bụ ụzọ ebumpụta ụwa e si egosipụta ọtụtụ λόγους n’Igbo, ma na-echekwa njikọ onwe onye dị n’etiti Jizọs na ihe ndị o kwuru.
- source_word: γενεᾷ
  choice: ọgbọ
  rationale: ‘Ọgbọ’ dabara na γενεά ma nwee ike ịpụta ndị bi n’otu oge dịka otu ndị e ji ọnọdụ omume ha mara.
- source_word: μοιχαλίδι
  choice: na-akwa iko
  rationale: Nke a na-echekwa ihe atụ amụma ahụ kpọmkwem banyere ịkwa iko kama ịtụgharị ya ozugbo ka ọ bụrụ ekwesịghị ntụkwasị obi.
- source_word: ἁμαρτωλῷ
  choice: nke jupụtara ná mmehie
  rationale: N’Igbo, nkebiokwu a na-akọwa ọgbọ ahụ n’ụzọ doro anya ma dị mfe nghọta, na-enweghị ịgbakwunye ike okwu dịka ‘ajọ omume’.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: A na-echekwa aha pụrụ iche a na ihe ọ na-ezo aka na ya n’Akwụkwọ Nsọ, kama iji ‘m’ ma ọ bụ ‘Mesaịa’ dochie ya.
- source_word: δόξῃ
  choice: ebube
  rationale: ‘Ebube’ bụ okwu Igbo kwesịrị ekwesị maka nsọpụrụ, ịdị ukwuu, na ìhè Chineke nke δόξα na-eburu.
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: ya na ndị mmụọ ozi dị nsọ
  rationale: Nke a na-egosipụta ndị mmụọ ozi dị nsọ n’enweghị ịgbakwunye nnọchiaha nwe ‘ya,’ nke na-adịghị na Grik.
- source_word: ὃς γὰρ ἐὰν
  choice: N’ihi na onye ọ bụla
  rationale: Nke a na-echekwa γάρ nke na-enye ihe kpatara okwu bu ya ụzọ, tinyere ọnọdụ izugbe nke ‘onye ọ bụla.’
- source_word: ἐν τῇ γενεᾷ ταύτῃ
  choice: n’etiti ọgbọ a
  rationale: ‘N’etiti’ na-egosipụta ọnọdụ mmekọrịta mmadụ nke ihere ahụ pụtara ìhè, ma ka na-anọgide nso n’echiche ἐν.
theological_decisions:
- issue: Ike ihe atụ nke μοιχαλίδι
  choice: Idowe ‘na-akwa iko’ n’ahịrị bụ isi dịka ihe atụ amụma banyere ekwesịghị ntụkwasị obi nye Chineke na mmebi omume.
  alternative: ‘na-ekwesịghị ntụkwasị obi’
  rationale: Grik ji okwu ịkwa iko a na-ahụ anya mee ihe; idowe ya na-echekwa njikọ ya na asụsụ ndị amụma ma zere ịkọwa ihe atụ ahụ karịa ka isi mmalite kwuru.
- issue: Ihe ‘Nwa nke Mmadụ’ na-ezo aka na ya
  choice: Idowe aha Mesaịa ahụ, ‘Nwa nke Mmadụ.’
  alternative: ‘m’ ma ọ bụ ‘Mesaịa’
  rationale: Aha Grik ahụ nwere ụda banyere njirimara Kraịst na ọbịbịa ikpeazụ ya; iji nnọchiaha ma ọ bụ aha ọzọ dochie ya ga-ebelata omimi na esemokwu dị n’okwu ahụ.
- issue: Nnọchiaha αὐτόν nke na-ezo aka n’onye ahụ
  choice: ‘onye ahụ’
  alternative: ‘ha’
  rationale: ‘Onye ahụ’ na-echekwa otu onye nke usoro Grik na-ekwu maka ya ma bụrụkwa Igbo ebumpụta ụwa nke na-adịghị amanye nwoke ma ọ bụ nwanyị ebe asụsụ Igbo na-adịghị eme ụdị ọdịiche ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘n’etiti ọgbọ a’ mee ka ọnọdụ mmekọrịta mmadụ doo anya; e chekwara aha ‘Nwa nke Mmadụ,’ okwu ‘ebube,’ na ihe atụ ‘na-akwa iko’ n’ihi ibu Akwụkwọ Nsọ ha.
