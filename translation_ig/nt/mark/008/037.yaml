  text: ⸂τί γὰρ⸃ ⸀δοῖ ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/037.yaml
  text: For what can a man give in exchange for his life?[a]
translation:
  language: ig
  text: N’ihi na, gịnị ka mmadụ pụrụ inye n’ọnọdụ ndụ ya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ obi ya.” Okwu Grik a nwere ike ịpụta “ndụ,” “onwe,” ma ọ bụ “mkpụrụ obi,” dabere n’ihe gbara ya gburugburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: N’ihi na gịnị
  rationale: “Gịnị” na-ebute ajụjụ ahụ, ebe “n’ihi na” na-ejigide ọrụ nkọwa γάρ nke jikọtara amaokwu a na okwu gara aga.
- source_word: δοῖ
  choice: pụrụ inye
  rationale: Ụdị subjunctive a dị n’ajụjụ nkwupụta; “pụrụ inye” na-egosi na ọ dịghị ihe mmadụ nwere ike inye nke ga-abụ ụgwọ zuru ezu.
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: “Mmadụ” bụ okwu Igbo ebumpụta ụwa nke na-anọchi onye ọ bụla ma kwekọọ n’ọrụ nnọchianya nke ἄνθρωπος.
- source_word: ἀντάλλαγμα
  choice: iji gbapụta
  rationale: ἀντάλλαγμα bụ ihe a na-enye n’ọnọdụ ihe ọzọ, dị ka ụgwọ mgbapụta; “iji gbapụta” na-eme ka ajụjụ ahụ daa nke ọma n’Igbo ma chekwaa echiche nke mgbanwe/ụgwọ.
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: ndụ ya
  rationale: N’ọnọdụ Mak 8:35–37, ψυχή pụtara ndụ mmadụ ma tinyekwa onye ahụ n’onwe ya. “Ndụ ya” doro anya n’Igbo, ebe nkọwa ala peeji na-echekwa “mkpụrụ obi ya” dị ka ntụgharị ọzọ.
theological_decisions:
- issue: Nsụgharị ψυχή n’okwu metụtara nzọpụta
  choice: ndụ ya
  alternative: mkpụrụ obi ya; onwe ya
  rationale: Ihe gbara amaokwu a gburugburu na-ekwu maka ịzọpụta ma ọ bụ ịla ndụ n’iyi, ma ψυχή nwere nghọta sara mbara karịa ndụ anụ ahụ naanị. E debere “ndụ” n’ahịrị isi maka nghọta na njikọ okwu, ma a hapụrụ “mkpụrụ obi” na nkọwa ala peeji iji ghara iwepụ ịdị omimi nke okwu ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ajụjụ ebumpụta ụwa; “mmadụ” na-arụ ọrụ izugbe n’enweghị itinye nkọwa ụka pụrụ iche.
