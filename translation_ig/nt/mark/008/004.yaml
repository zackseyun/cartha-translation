source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ὅτι Πόθεν τούτους δυνήσεταί τις ὧδε χορτάσαι ἄρτων ἐπ’ ἐρημίας;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/004.yaml
  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: ig
  text: Ndị na-eso ụzọ ya zara ya[a], sị, “Olee ebe mmadụ ga-esi nwee ike iji achịcha mee ka afọ ndị a jupụta n’ebe a tọgbọrọ n’efu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndị na-eso ụzọ ya sịrị ya, ‘Olee otú mmadụ ga-esi nwee ike inye ndị a achịcha ka afọ ndị a jupụta n’ọzara a?’”
    reason: 'Nhọrọ ntụgharị okwu: Πόθεν nwere ike ịjụ ebe ihe ga-esi bịa, ma n’Igbo enwere ike igosikwa ya dịka ajụjụ banyere otú a ga-esi mee ya; ἐρημία nwekwara ike ịsụgharị dịka ‘ọzara.’'
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: zara
  rationale: Ọ bụ ngwaa nkịtị e ji akọ nzaghachi n’akụkọ; ‘zara’ dabara nke ọma n’Igbo.
- source_word: ὅτι
  choice: sị
  rationale: N’ebe a, ὅτι na-ewebata okwu a kpọrọ kpọmkwem; ‘sị’ bụ ụzọ Igbo si eme nke a n’enweghị ịsụgharị ya dị ka ‘na.’
- source_word: Πόθεν
  choice: Olee ebe ... ga-esi
  rationale: Nke a na-edobe ajụjụ gbasara ebe ihe oriri ga-esi bịa, kama ịgbanwe ya ka ọ bụrụ naanị ajụjụ banyere otú e si eme ya.
- source_word: τούτους
  choice: ndị a
  rationale: Ọ na-ezo aka n’ìgwè mmadụ ahụ ma ghara ikwu na ha bụ naanị ụmụ nwoke.
- source_word: δυνήσεταί τις
  choice: onye ọ bụla ga-esi nweta
  rationale: Usoro a na-egosi ma ikike ma ohere nke inweta ihe n’ọdịnihu, ma na-ada nke ọma n’ajụjụ Igbo a.
- source_word: ὧδε
  choice: n’ebe ... dị otu a
  rationale: Ọ na-egosi ebe ha nọ ugbu a n’ụzọ Igbo doro anya.
- source_word: χορτάσαι
  choice: ga-eju ... afọ
  rationale: Nkebiokwu Igbo a na-egosi inye mmadụ nri ruo mgbe afọ juru ya, nke bụ isi echiche χορτάζω.
- source_word: ἄρτων
  choice: achịcha
  rationale: ‘Achịcha’ bụ okwu Igbo kwụ ọtọ maka nri achịcha e kwuru n’ebe a, na-enweghị ime ka ọ bụrụ nri n’ozuzu ya.
- source_word: ἐπ’ ἐρημίας
  choice: n’ebe tọgbọrọ n’efu
  rationale: Nke a na-egosi ebe mmadụ na-ebighị ma ọ bụ ebe ihe adịghị, na-enweghị ịgbakwunye nkọwa ọzọ.
