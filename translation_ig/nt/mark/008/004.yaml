translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ga-eju ... afọ’ na-ebuga echiche nke iri ruo n’afọ ojuju karịa ntụgharị sara mbara dịka ‘inye nri.’
