revisions:
- from: O wee gwa ìgwè mmadụ ahụ ka ha nọdụ ala n'elu ala[a]. Mgbe ahụ, o were ogbe achịcha asaa ahụ, kelee ekele, nyawaa ha, na-enyekwa ndị na-eso ụzọ ya ka ha dobe ha n'ihu ìgwè mmadụ ahụ[b]; ha wee dobe ha n'ihu ìgwè mmadụ ahụ.
  to: O nyere ìgwè mmadụ ahụ iwu ka ha nọdụ ala n'ala[a]. Mgbe ahụ, o weere ogbe achịcha asaa ahụ, nyechaa ekele, nyawaa ha, na-enye ndị na-eso ụzọ ya ogbe achịcha ndị ahụ ka ha debe ha n'ihu ìgwè mmadụ ahụ[b]; ha wee debe ha n'ihu ìgwè mmadụ ahụ.
  rationale: The revision corrects the purpose-clause verb, improves idiomatic Standard Igbo, and more fully conveys the authoritative instruction while retaining the original’s meal context. It keeps the thanksgiving unexpanded, preserves the imperfect sense through “na-enye,” and retains the repeated “debe ... n'ihu” corresponding to παρατιθῶσιν and παρέθηκαν.
