id: MRK.8.6
reference: Mark 8:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀παραγγέλλει τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τῆς γῆς· καὶ λαβὼν τοὺς ἑπτὰ ἄρτους εὐχαριστήσας ἔκλασεν καὶ ἐδίδου τοῖς μαθηταῖς αὐτοῦ ἵνα ⸀παρατιθῶσιν καὶ παρέθηκαν τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: ig
  text: O nyere ìgwè mmadụ ahụ iwu ka ha nọdụ ala n'ala[a]. Mgbe ahụ, o weere ogbe achịcha asaa ahụ, nyechaa ekele, nyawaa ha, na-enye ndị na-eso ụzọ ya ogbe achịcha ndị ahụ ka ha debe ha n'ihu ìgwè mmadụ ahụ[b]; ha wee debe ha n'ihu ìgwè mmadụ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ha dinara ala.” Okwu Grik ahụ na-egosi kpọmkwem ọnọdụ ndị mmadụ na-anọ mgbe ha na-eri nri.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka ha jeere ìgwè mmadụ ahụ ozi.” N'ụzọ nkịtị, okwu Grik pụtara “idobe n'ihu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: ọ gwa
  rationale: N'ọnọdụ a, ọ pụtara inye ntụziaka nwere ikike. “Ọ gwa” bụ okwu Igbo dị mfe ma na-egosi na Jizọs nyere ìgwè mmadụ ahụ iwu; a gbanwere present akụkọ Grik ka ọ bụrụ usoro akụkọ Igbo sitere n'okwu “wee.”
- source_word: ἀναπεσεῖν
  choice: ka ha nọdụ ala
  rationale: Okwu Grik ahụ na-ezo aka n'ịnọdụ ma ọ bụ n'ịdabere ala maka iri nri. N'Igbo nke oge a, “nọdụ ala” bụ okwu kachasị eke; nkọwa ala peeji na-echekwa nkọwa kpọmkwem nke ọnọdụ iri nri ahụ.
- source_word: ἐπὶ τῆς γῆς
  choice: n'elu ala
  rationale: γῆ ebe a bụ elu ala ebe ìgwè mmadụ ahụ ga-anọdụ, ọ bụghị ụwa ma ọ bụ obodo.
- source_word: λαβὼν τοὺς ἑπτὰ ἄρτους
  choice: o were ogbe achịcha asaa ahụ
  rationale: ἄρτοι bụ ogbe achịcha n'akụkọ inye nri; “ogbe achịcha” doro anya karịa naanị “achịcha” ma na-echekwa ọnụọgụ asaa.
- source_word: εὐχαριστήσας
  choice: kelee ekele
  rationale: Nke a na-egosi ikwu ekele maka nri ahụ. A kpọghị Chineke aha n'ahịrịokwu Grik a, ya mere nsụgharị ahụ etinyeghị onye a na-ekele.
- source_word: ἔκλασεν
  choice: nyawaa ha
  rationale: Ọ na-ezo aka n'ịnyawa ogbe achịcha ndị ahụ. “Ha” na-eme ka ihe a nyawara doo anya n'Igbo.
- source_word: ἐδίδου
  choice: na-enyekwa
  rationale: Imperfect Grik na-egosi omume gara n'ihu ma ọ bụ ugboro ugboro; usoro “na-enyekwa” na-echekwa echiche ahụ.
- source_word: ἵνα παρατιθῶσιν
  choice: ka ha dobe ha n'ihu ìgwè mmadụ ahụ
  rationale: παρατίθημι pụtara n'ụzọ nkịtị idobe nri n'ihu mmadụ. Nsụgharị a na-echekwa ihe oyiyi ahụ kama ịkọwa ya naanị dị ka “ikesa” ma ọ bụ “ije ozi.”
- source_word: παρέθηκαν
  choice: ha wee dobe ha n'ihu ìgwè mmadụ ahụ
  rationale: A na-emegharị otu okwu ahụ iji kwekọọ na παρατιθῶσιν ma gosipụta na ndị na-eso ụzọ mezuru ihe e nyere ha.
- source_word: ὄχλος
  choice: ìgwè mmadụ
  rationale: Nke a bụ okwu Igbo nke oge a, doro anya ma kwesịkwa ekwesị maka crowd n'akụkọ a.
theological_decisions:
- issue: Usoro akụkọ na ụda nwere ike icheta Oriri Nsọ
  choice: A sụgharịrị εὐχαριστήσας dị ka “kelee ekele,” n'etinyeghị okwu sacrament ma ọ bụ aha onye a na-ekele.
  alternative: “kele Chineke” ma ọ bụ okwu na-akọwa ya dịka omume Oriri Nsọ
  rationale: Asụsụ Grik na-ekwu naanị na o kwuru ekele. Ọ bụ ezie na usoro a nwere ike ime ka onye na-agụ ya cheta omume Ndị Kraịst mechara, amaokwu a n'onwe ya akọwaghị ozizi sacrament, ya mere e tinyeghị nkọwa okwukwe ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “wee” hazie usoro akụkọ ahụ n'ụzọ Igbo; e chekwara omume na-aga n'ihu dị na ἐδίδου site na “na-enyekwa.” Akara ala peeji [a] na [b] pụtara n'ederede bụ isi.
