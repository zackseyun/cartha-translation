  text: And he asked them, “How many loaves do you have?” They said, “Seven.”
translation:
  language: ig
  text: Ọ jụkwara ha, sị, “Ogbe achịcha ole ka unu nwere?” Ha sịrị, “Asaa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: -kwara
  rationale: Mgbakwunye ngwaa a na-ejikọta ajụjụ ahụ na akụkọ gara aga n'ụzọ dị mfe, dị ka njikọ καὶ si eme.
- source_word: ἠρώτα αὐτούς
  choice: Ọ jụkwara ha
  rationale: Nke a na-asụgharị ngwaa ajụjụ na nnọchiaha ihe a na-eme ihe; ụdị a bụ asụsụ Igbo nkịtị ma dabara n'usoro akụkọ.
- source_word: Πόσους ἔχετε ἄρτους;
  choice: Ogbe achịcha ole ka unu nwere?
  rationale: Ebe a na-agụ ἄρτους ọnụ, “ogbe achịcha” na-egosi achịcha dị iche iche a pụrụ ịgụ; “unu” na-egosipụta onye nke abụọ n'ụbara.
- source_word: οἱ δὲ εἶπαν
  choice: Ha sịrị
  rationale: Nke a na-enye nzaghachi otu ahụ n'ụzọ dị mkpirikpi ma ghara ịgbakwunye echiche mmegide nke δέ na-achọghị n'ebe a.
- source_word: Ἑπτά
  choice: Asaa
  rationale: Ọ bụ ntụgharị kpọmkwem nke ọnụọgụ asaa.
