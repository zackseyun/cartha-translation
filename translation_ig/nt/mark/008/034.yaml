revisions:
- from: Mgbe ọ kpọkọtara ìgwè mmadụ ahụ na ndị na-eso ụzọ ya, ọ sịrị ha, “Ọ bụrụ na onye ọ bụla chọrọ ịbịa n’azụ m[a], ya jụ onwe ya, buru obe nke ya[b], sorokwa m.”
  to: Ọ kpọrọ ìgwè mmadụ ahụ na ndị na-eso ụzọ ya ka ha bịakọta, wee sị ha, “Ọ bụrụ na onye ọ bụla chọrọ ịbịa n’azụ m[a], ka ọ gọnahụ onwe ya, bulie obe ya[b], ma soro m.”
  rationale: Edoziri ngwaa mbụ ka ọ bụrụ ịkpọ ìgwè mmadụ na ndị na-eso ụzọ ka ha bịakọta, nke dabara na προσκαλεσάμενος. Edozikwara iwu ndị sochiri ọnọdụ ahụ ka “gọnahụ,” “bulie,” na “soro” wee debe nkọwa na ike iwu Greek n’Igbo eke. A hapụrụ “obe” n’ụzọ nkịtị, a gbanweghịkwa mgbagwoju anya ọ bụla n’ihe amaokwu ahụ pụtara.
