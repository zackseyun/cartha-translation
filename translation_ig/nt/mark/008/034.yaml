  verdict: revise
  source_fidelity: A chọrọ obere ndegharị iji gosipụta προσκαλεσάμενος nke ọma dịka ịkpọ ìgwè mmadụ ahụ na ndị na-eso ụzọ ya ka ha bịakọta, kama ikwu naanị na ọ “kpọkọtara” ha. “Gọnahụ onwe ya” na “bulie obe ya” na-egosipụtakwa ἀπαρνησάσθω na ἀράτω n'ụzọ kpọmkwem karịa.
  naturalness: 'Ntụgharị a edegharịrị dị n’Standard Igbo nke oge a ma na-agba nke ọma: “Ọ kpọrọ ... ka ha bịakọta, wee sị ha.” Usoro “ka onye ọ bụla ... gọnahụ ... bulie ... soro” bụ ụzọ doro anya ma dị mma isi nye iwu onye nke atọ.'
  terminology: E debere “obe” maka σταυρός, n’enweghị ime ka ọ bụrụ naanị ibu arọ ma ọ bụ nsogbu. “Ndị na-eso ụzọ” dabara maka μαθηταί; “gọnahụ onwe ya” na-edobe echiche nke ịjụ/ịnapụ onwe onye, ọ bụghị naanị ịhapụ otu ihe.
  issues:
  - severity: medium
    issue: “Mgbe ọ kpọkọtara” anaghị akọwa kpọmkwem omume προσκαλεσάμενος.
    rationale: Okwu Greek ahụ pụtara ịkpọ mmadụ ka ọ bịakwute onye na-ekwu okwu. “Ọ kpọrọ ... ka ha bịakọta” na-edobe omume ịkpọkọta ahụ nke ọma karịa “kpọkọtara,” nke nwere ike ịpụta naanị na ndị ahụ zukọrọ.
  - severity: low
    issue: “ya jụ onwe ya, buru obe nke ya” adịghị edobe ngwaa Greek abụọ ahụ nke ọma dịka o nwere ike ịdị.
    rationale: “Gọnahụ onwe ya” bụ okwu doro anya maka ἀπαρνησάσθω, ebe “bulie obe ya” na-egosipụta ἀράτω, ‘take up.’ “Obe ya” dị mkpụmkpụ ma bụrụkwa nke eke karịa “obe nke ya” n’ebe a.
