id: MRK.8.34
reference: Mark 8:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: ig
  text: Ọ kpọrọ ìgwè mmadụ ahụ na ndị na-eso ụzọ ya ka ha bịakọta, wee sị ha, “Ọ bụrụ na onye ọ bụla chọrọ ịbịa n’azụ m[a], ka ọ gọnahụ onwe ya, bulie obe ya[b], ma soro m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ bụrụ na onye ọ bụla chọrọ iso m.”
    reason: lexical_alternative
  - marker: b
    text: “Bulie obe ya” na-edobe ihe oyiyi obe n’onwe ya kama ịkọwa ya naanị dịka iburu ibu arọ ma ọ bụ nsogbu.
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Mgbe ọ kpọkọtara
  rationale: Okwu a na-egosi na ọ kpọrọ ndị ahụ ka ha zukọta bịakwute ya tupu ya agwa ha okwu; “Mgbe ọ kpọkọtara” na-egosipụta usoro omume ahụ n’Igbo doro anya.
- source_word: ὄχλον
  choice: ìgwè mmadụ ahụ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ọtụtụ mmadụ zukọtara n’otu ebe, ma ọ naghị ada ka okwu mgbe ochie.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: na ndị na-eso ụzọ ya
  rationale: Ọ na-edobe echiche nke iso n’otu ahụ, ma na-egosikwa na ìgwè mmadụ na ndị na-eso ụzọ nọ mgbe ọ na-ekwu okwu.
- source_word: Εἴ τις θέλει
  choice: Ọ bụrụ na onye ọ bụla chọrọ
  rationale: Ọ na-edobe ọnọdụ mmeghe ahụ na ịkpọ òkù nke metụtara onye ọ bụla chọrọ.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: ịbịa n’azụ m
  rationale: Ọ na-edobe ihe atụ nke ịbịa n’azụ Jizọs n’enweghị ịgwakọta ya kpamkpam na iwu doro anya nke ἀκολουθείτω μοι nke na-abịa n’ikpeazụ.
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: ya jụ onwe ya
  rationale: Nke a na-egosipụta iwu ka mmadụ hapụ ọchịchọ na ikike onwe ya ịbụ ihe na-achị ya; ọ bụghị nanị ịhapụ otu ihe na-atọ ya ụtọ.
- source_word: ἀράτω
  choice: buru
  rationale: N’ọnọdụ a, “buru” na-egosipụta iburu obe mmadụ n’ahụ dịka onye a na-eduga n’ọnwụ, ọ bụghị nanị iweli ya elu.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: obe nke ya
  rationale: A hapụrụ “obe” dịka ihe oyiyi nkịtị nke Greek si kwuo, ebe “nke ya” na-edobe njikọ ya na onye ahụ n’onwe ya.
- source_word: ἀκολουθείτω μοι
  choice: sorokwa m
  rationale: Ọ na-enye iwu ịgbaso Jizọs; “-kwa” jikọtara iwu ikpeazụ a na abụọ ndị bu ya ụzọ n’ụzọ Igbo si aga nke ọma.
theological_decisions:
- issue: Ike iwu ndị metụtara ịbụ onye na-eso ụzọ
  choice: 'A sụgharịrị ya dịka ịkpọ òkù nye onye ọ bụla chọrọ, nke iwu atọ siri ike na-esochi: “ya jụ onwe ya, buru obe nke ya, sorokwa m.”'
  alternative: Iji “aghaghị” kwugharịa ugboro atọ.
  rationale: Greek nwere ahịrịokwu ọnọdụ nke iwu onye nke atọ na-esochi. Nhọrọ a na-edobe ma nnwere onwe dị n’ịchọ iso ya ma ikike iwu dị n’ihe onye ahụ ga-eme, n’etinyeghị nkọwa otu ụka.
- issue: Ihe σταυρός pụtara n’ebe a
  choice: obe
  alternative: ibu arọ; ahụhụ; ọnwụ n’ihi okwukwe
  rationale: E kwesịghị ime ka ihe oyiyi obe ndị Rom ghọọ naanị ihe atụ nke nsogbu ma ọ bụ ibu arọ. “Obe” na-edobe ịdị arọ nke akụkọ ihe mere eme na nke nkà mmụta okpukpe n’akwụkwọ ahụ n’enweghị imechi ihe ọ pụtara n’otu nkọwa.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ihe oyiyi “ịbịa n’azụ” na “obe” ka e wee ghara ịkọwafere okwu Greek ókè; e tinyere akara nkọwa ala peeji [a] na [b] kpọmkwem n’ebe ha metụtara.
