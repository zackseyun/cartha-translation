id: MRK.8.31
reference: Mark 8:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: ig
  text: Ọ malitekwara ịkụziri ha na Nwa nke Mmadụ aghaghị ịta ọtụtụ ahụhụ, na ndị okenye, ndị isi nchụaja na ndị odeakwụkwọ jụ ya, na a gbuo ya, ma o bilie mgbe ụbọchị atọ gasịrị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ ọzọ, “n'ime ụbọchị atọ.” N'asụsụ Grik, Mak dere, “mgbe ụbọchị atọ gasịrị”; ụfọdụ nsụgharị na-ekwu ya n'ụzọ akpaalaokwu ma ọ bụ mee ka o kwekọọ n'amaokwu ndị ọzọ na-ekwu, “n'ụbọchị nke atọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξατο διδάσκειν
  choice: Ọ malitekwara ịkụziri ha
  rationale: Nke a na-egosipụta mmalite nke nkuzi ahụ ma na-edobekwa Καὶ dị ka njikọ akụkọ n'Igbo nkịtị.
- source_word: δεῖ
  choice: aghaghị
  rationale: “Aghaghị” na-egosipụta mkpa siri ike dị n'okwu Grik ahụ n'ebughị ụzọ kọwaa ihe kpatara mkpa ahụ.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-echekwa aha ahụ dị ka aha pụrụ iche ma na-ahapụ njikọ Akwụkwọ Nsọ ya ka ọ dị.
- source_word: πολλὰ παθεῖν
  choice: ịta ọtụtụ ahụhụ
  rationale: Nke a bụ okwu Igbo doro anya ma dị ebube nke na-echekwa obosara nke ọtụtụ ihe mgbu e kwuru na Grik.
- source_word: ἀποδοκιμασθῆναι
  choice: ka ... jụ ya
  rationale: Ụdị a bụ Igbo eke maka ajụjụ onye ndị ọchịchị nyochara ma jụ; ọ na-echekwa olu nnara site n'ime ndị mere ya isiokwu.
- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: ndị okenye
  rationale: N'ebe a ọ na-ezo aka n'òtù ndị ndu ndị Juu, ọ bụghị nanị ndị merela agadi.
- source_word: τῶν ἀρχιερέων
  choice: ndịisi nchụaja
  rationale: Ọ na-ezo aka n'òtù ndị nchụaja kachasị elu, ọ bụghị ọtụtụ ndị ji otu ọkwa nnukwu onye nchụaja.
- source_word: τῶν γραμματέων
  choice: ndị odeakwụkwọ
  rationale: Nke a na-echekwa aha akụkọ ihe mere eme nke òtù ahụ n'enweghị ịgbasa ya ozugbo ka ọ bụrụ nkọwa ọrụ ha.
- source_word: ἀποκτανθῆναι
  choice: ka e gbuo ya
  rationale: Nke a na-egosipụta infinitive passive ahụ n'Igbo doro anya ma kpọmkwem.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: mgbe ụbọchị atọ gasịrị
  rationale: Nke a na-asụgharị μετά na accusative n'ụzọ kwụ ọtọ dịka “mgbe ... gasịrị,” kama ime ka ya na “n'ụbọchị nke atọ” kwekọọ.
- source_word: ἀναστῆναι
  choice: ya ebiliekwa
  rationale: Nke a na-echekwa ụdị intransitive nke okwu Grik ahụ; ọnọdụ ọnwụ e kwuru tupu ya emee ka mbilite n'ọnwụ pụta ìhè.
theological_decisions:
- issue: Mkpa e gosipụtara site na δεῖ n'amụma ahụhụ Jizọs
  choice: aghaghị
  alternative: ọ dị mkpa ka
  rationale: “Aghaghị” na-echekwa ibu nkà mmụta okpukpe nke mkpa ahụ, ma ọ naghị etinye nkọwa ọzọ banyere otú ma ọ bụ ihe mere o ji bụrụ mkpa.
- issue: Oge nke μετὰ τρεῖς ἡμέρας
  choice: mgbe ụbọchị atọ gasịrị
  alternative: n'ụbọchị nke atọ
  rationale: Ihe odide Mak na-ekwu “mgbe ụbọchị atọ gasịrị.” Ịsụgharị ya dịka “n'ụbọchị nke atọ” ga-eme ka ọ kwekọọ na amaokwu ndị ọzọ kama ichekwa okwu Mak.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji usoro ahịrịokwu ndị na-esochi “aghaghị” mee ka ndepụta ahụhụ, ajụjụ, ọnwụ na mbilite n'ọnwụ bụrụ otu amụma jikọrọ ọnụ. E tinyere akara [a] ozugbo n'akụkụ okwu oge ọ na-akọwa.
