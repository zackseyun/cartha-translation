revisions:
- from: Ọ malitekwara ịkụziri ha na Nwa nke Mmadụ aghaghị ịta ọtụtụ ahụhụ, ka ndị okenye, ndịisi nchụaja na ndị odeakwụkwọ jụ ya, ka e gbuo ya, ya ebiliekwa mgbe ụbọchị atọ gasịrị.[a]
  to: Ọ malitekwara ịkụziri ha na Nwa nke Mmadụ aghaghị ịta ọtụtụ ahụhụ, na ndị okenye, ndị isi nchụaja na ndị odeakwụkwọ jụ ya, na a gbuo ya, ma o bilie mgbe ụbọchị atọ gasịrị.[a]
  rationale: The revision corrects the compound-spacing error, makes the dependent sequence governed by ‘aghaghị’ more natural in Standard Igbo, and uses ‘bilie’ for the Greek intransitive ἀναστῆναι. It preserves Mark’s ‘after three days’ rather than harmonizing it to ‘on the third day.’ The footnote remains anchored to the temporal expression and now states the Greek evidence naturally and accurately.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:29Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the ingressive ‘began to teach,’ the necessity expressed by δεῖ, the title ‘Nwa nke Mmadụ,’ the three leadership groups, death, and Mark’s distinct temporal wording ‘after three days.’ However, the linked infinitive sequence is more clearly and naturally represented in Igbo with parallel dependent clauses. ‘Ndịisi’ also requires separation.
  naturalness: The current repeated ‘ka’ construction is understandable but somewhat strained after ‘aghaghị.’ A more fluent coordinated structure preserves the single necessity governing suffering, rejection, death, and rising. ‘Bilie’ is the natural intransitive verb here and avoids adding ‘again,’ which is not explicit in the Greek.
  terminology: ‘ndị isi nchụaja’ correctly represents chief priests and must be spaced as separate words. ‘ndị odeakwụkwọ’ can denote the historical scribal group in this context; adding ‘iwu’ would over-specify beyond the source. ‘Nwa nke Mmadụ’ and ‘aghaghị’ are appropriate.
  issues:
  - severity: medium
    issue: The phrase ‘ndịisi nchụaja’ is incorrectly joined.
    rationale: Standard Igbo requires ‘ndị isi nchụaja’; the present joining impairs readability and is orthographically defective.
  - severity: low
    issue: The coordination ‘aghaghị ịta ọtụtụ ahụhụ, ka ... jụ ya, ka e gbuo ya, ya ebiliekwa’ is less idiomatic and uneven.
    rationale: A parallel dependent construction more naturally conveys the Greek series of infinitives governed by δεῖ without changing the meaning.
  - severity: low
    issue: The footnote wording ‘Grik Mak kwuru’ is unnatural and inaccurately frames the Greek as speech.
    rationale: The note should say that Mark wrote the expression in Greek, while retaining the alternative English-tradition rendering as an alternative translation rather than a competing Greek reading.
  revised_text: Ọ malitekwara ịkụziri ha na Nwa nke Mmadụ aghaghị ịta ọtụtụ ahụhụ, na ndị okenye, ndị isi nchụaja na ndị odeakwụkwọ jụ ya, na a gbuo ya, ma o bilie mgbe ụbọchị atọ gasịrị.[a]
  revised_footnotes:
  - marker: a
    text: N'ụzọ ọzọ, “n'ime ụbọchị atọ.” N'asụsụ Grik, Mak dere, “mgbe ụbọchị atọ gasịrị”; ụfọdụ nsụgharị na-ekwu ya n'ụzọ akpaalaokwu ma ọ bụ mee ka o kwekọọ n'amaokwu ndị ọzọ na-ekwu, “n'ụbọchị nke atọ.”
    reason: alternative_reading
  revision_rationale: The revision corrects the compound-spacing error, makes the dependent sequence governed by ‘aghaghị’ more natural in Standard Igbo, and uses ‘bilie’ for the Greek intransitive ἀναστῆναι. It preserves Mark’s ‘after three days’ rather than harmonizing it to ‘on the third day.’ The footnote remains anchored to the temporal expression and now states the Greek evidence naturally and accurately.
