  text: καὶ παρρησίᾳ τὸν λόγον ἐλάλει. καὶ προσλαβόμενος ⸂ὁ Πέτρος αὐτὸν⸃ ἤρξατο ἐπιτιμᾶν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: ig
  text: Ọ nọ na-ekwu okwu a hoo haa[a]. Pita wee kpọọrọ ya iche, malite ịba ya mba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ụzọ doro anya” ma ọ bụ “n’ezoghị ọnụ.” Okwu Grik ahụ na-egosi ikwu okwu ghe oghe, n’ezoghị ọnụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: n’ihu ọha n’ezoghị ọnụ
  rationale: Nkebiokwu a na-egosi ikwu okwu n’ụzọ ghe oghe, doro anya, na-enweghị izochi ihe. Ọ na-eburu ma echiche nke ikwu ya n’ihu ọha ma nke ikwu ya hoo haa.
- source_word: τὸν λόγον
  choice: okwu a
  rationale: Ọ na-ezo aka n’ihe Jizọs kwuru n’amụma ya dị n’amaokwu bu ụzọ; “a” na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: ἐλάλει
  choice: ọ nọ na-ekwu
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu, nke “ọ nọ na-ekwu” na-echekwa nke ọma.
- source_word: προσλαβόμενος
  choice: kpọrọ ya n’akụkụ
  rationale: N’ọnọdụ a, ọ pụtara na Pita kpọọrọ Jizọs iche ka ọ gwa ya okwu; nke a bụ ụzọ Igbo dị mma isi kwupụta echiche ahụ.
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: malite ịbara ya mba
  rationale: “Malite” na-echekwa ἤρξατο, ebe “ịbara ya mba” na-egosi mgbazi siri ike nke ἐπιτιμάω karịa ịdọ aka ná ntị nkịtị.
theological_decisions:
- issue: Ike παρρησίᾳ n’ihe gbasara amụma Jizọs banyere ahụhụ ya
  choice: n’ihu ọha n’ezoghị ọnụ
  alternative: hoo haa; n’atụghị egwu
  rationale: Nhọrọ a na-emesi ike na Jizọs kwuru ihe ahụ n’ụzọ ghe oghe na doro anya, na-enweghị itinye echiche ọzọ na-abụghị nke ederede. Ihe bụ isi ebe a abụghị naanị obi ike, kama ọ bụ okwu na-enweghị ihe mkpuchi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. “Ịbara ya mba” bụ okwu ndị mmadụ na-aghọta nke na-echekwa ịdị ike nke mgbazi Pita, ebe “kpọrọ ya n’akụkụ” na-ada nke ọma n’Igbo.
