revisions:
- from: Ọ nọ na-ekwu okwu a n’ihu ọha n’ezoghị ọnụ[a]. Pita wee kpọrọ ya n’akụkụ, malite ịbara ya mba.
  to: Ọ nọ na-ekwu okwu a hoo haa[a]. Pita wee kpọọrọ ya iche, malite ịba ya mba.
  rationale: Removed the added implication that the speech occurred 'before the public' and rendered παρρησίᾳ with the natural contextual equivalent 'hoo haa.' Changed 'kpọrọ ya n’akụkụ' to 'kpọọrọ ya iche' to state more naturally that Peter drew Jesus aside. The footnote now presents alternatives that retain the verse's emphasis on plain, unhidden speech.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:24Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the imperfect ἐλάλει ('Ọ nọ na-ekwu'), the discourse-linked τὸν λόγον ('okwu a'), Peter's action of taking Jesus aside, and the inceptive force of ἤρξατο ἐπιτιμᾶν ('malite ịba ya mba'). However, 'n’ihu ọha' adds a specifically public setting that παρρησίᾳ does not itself require here. In this context the principal sense is frank/plain, unhidden speech.
  naturalness: 'The revision uses idiomatic Standard Igbo: ''Ọ nọ na-ekwu okwu a hoo haa'' is clear and natural, and ''kpọọrọ ya iche'' naturally conveys taking someone aside. ''Ịba mmadụ mba'' is an appropriate, modern rendering of a sharp rebuke.'
  terminology: '''Hoo haa'' appropriately conveys the contextual force of παρρησίᾳ without adding public-location language. The footnote preserves viable lexical alternatives, especially ''n’ụzọ doro anya''; ''n’atụghị egwu'' is less suitable in this context because it foregrounds courage rather than plainness.'
  issues:
  - severity: medium
    issue: The phrase 'n’ihu ọha' is overly specific for παρρησίᾳ.
    rationale: The Greek denotes open, frank, or plain speech. Although such speech can be public, the word does not state that Jesus was speaking before the public; the narrative emphasis is that he spoke plainly.
  - severity: low
    issue: The footnote's alternative 'n’atụghị egwu' is contextually secondary.
    rationale: It can reflect one semantic association of παρρησία, but Mark 8:32 contrasts formerly veiled teaching with plain speech, not fearful speech with courageous speech.
  revised_text: Ọ nọ na-ekwu okwu a hoo haa[a]. Pita wee kpọọrọ ya iche, malite ịba ya mba.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ụzọ doro anya” ma ọ bụ “n’ezoghị ọnụ.” Okwu Grik ahụ na-egosi ikwu okwu ghe oghe, n’ezoghị ọnụ.
    reason: lexical_alternative
  revision_rationale: Removed the added implication that the speech occurred 'before the public' and rendered παρρησίᾳ with the natural contextual equivalent 'hoo haa.' Changed 'kpọrọ ya n’akụkụ' to 'kpọọrọ ya iche' to state more naturally that Peter drew Jesus aside. The footnote now presents alternatives that retain the verse's emphasis on plain, unhidden speech.
