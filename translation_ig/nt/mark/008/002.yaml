translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘ìgwè mmadụ’ mee ὄχλος, ‘ọmịiko’ mee σπλαγχνίζομαι, ma zere okwu chọọchị pụrụ iche ma ọ bụ nkọwa okpukpe agbakwunyere.
