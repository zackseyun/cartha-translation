  text: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/002.yaml
  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: ig
  text: “Enwere m ọmịiko n’ahụ ìgwè mmadụ a, n’ihi na ha anọgidela n’ebe m nọ ụbọchị atọ ugbu a, ha enweghịkwa ihe ha ga-eri.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: Enwere m ọmịiko
  rationale: Okwu a na-egosi ọmịiko miri emi. Nhọrọ a bụ asụsụ Igbo doro anya, dị ùgwù, ma chekwaa ọnọdụ ugbu a nke ngwaa Grik ahụ.
- source_word: ἐπὶ τὸν ὄχλον
  choice: n’ebe ìgwè mmadụ a nọ
  rationale: ἐπί na-egosi ndị ọmịiko ahụ metụtara. Usoro a bụ ụzọ ebumpụta ụwa e si ejikọta ya na ‘Enwere m ọmịiko’ n’Igbo; ‘a’ na-ezo aka n’ìgwè mmadụ ahụ nọ n’ihu Jizọs.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a, ὅτι na-ewebata ihe kpatara ọmịiko Jizọs.
- source_word: ἤδη
  choice: ugbu a
  rationale: Ọ na-egosi na ogologo oge ahụ eruola ụbọchị atọ ugbu a, n’enweghị ịgbakwunye echiche ọzọ.
- source_word: ἡμέραι τρεῖς
  choice: ụbọchị atọ
  rationale: Nke a na-egosipụta kpọmkwem oge ha nọrọ.
- source_word: προσμένουσίν μοι
  choice: ha na m anọọla
  rationale: προσμένω na dative μοι pụtara ịnọgide ma ọ bụ ịnọnyere mmadụ. ‘Ha na m anọọla’ bụ Igbo dị larịị ma na-egosi na ọnụnọ ahụ gara n’ihu ruo ugbu a.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: ha enweghịkwa ihe ha ga-eri
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si kwuo na nri adịghị ha; ọ na-echekwa njikọ ‘ihe ... eri’ nke okwu Grik ahụ.
