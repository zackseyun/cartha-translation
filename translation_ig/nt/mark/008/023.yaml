  to: O wee jide nwoke ahụ kpuru ìsì n'aka, duru ya pụọ n'obodo nta ahụ. Mgbe ọ gbasịrị ya ọnụ mmiri n'anya[a] ma bikwasịrị ya aka abụọ, ọ jụrụ ya, “Ị̀ na-ahụ ihe ọ bụla?”
