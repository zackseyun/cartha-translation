id: MRK.8.23
reference: Mark 8:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: ig
  text: O wee jide nwoke ahụ kpuru ìsì n'aka, duru ya pụọ n'obodo nta ahụ. Mgbe ọ gbasịrị ya ọnụ mmiri n'anya[a] ma bikwasịrị ya aka abụọ, ọ jụrụ ya, “Ị̀ na-ahụ ihe ọ bụla?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, kpọmkwem karịa, “gbasịrị ya ọnụ mmiri banye n'anya ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς
  choice: jide ... n'aka
  rationale: Nkebiokwu a na-egosi na Jizọs jidere nwoke ahụ n'aka iji duru ya; ntụgharị a bụ nke Igbo nkịtị ma na-edobe omume ahụ kpọmkwem.
- source_word: τοῦ τυφλοῦ
  choice: nwoke ahụ kpuru ìsì
  rationale: τυφλός bụ aha e ji njirimara mee ebe a; ‘nwoke ahụ kpuru ìsì’ bụ okwu Igbo doro anya ma na-egosi onye nwoke a na-ekwu maka ya.
- source_word: ἐξήνεγκεν αὐτὸν
  choice: duru ya pụọ
  rationale: Ọ bụ ezie na ἐκφέρω nwere ike ịpụta ‘wepụ’ ma ọ bụ ‘bupụta,’ ọnọdụ ebe Jizọs jidere ya n'aka na-akwado echiche iduru ya pụọ.
- source_word: ἔξω τῆς κώμης
  choice: pụọ n'obodo nta ahụ
  rationale: κώμη bụ obere obodo; ‘obodo nta’ na-egosi nke a nke ọma, ebe ‘pụọ n’ na-edobe mmegharị gaa n'èzí.
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: Mgbe ọ gbasịrị ọnụ mmiri n'anya ya
  rationale: A sụgharịrị aorist participle ahụ dị ka ihe mere tupu omume na-esote. ‘Gbaa ọnụ mmiri n’anya’ bụ Igbo ebumpụta ụwa nke na-edobe nkọwa anụ ahụ nke ihe ahụ, ebe ndetu ala na-egosi ike kpọmkwem nke εἰς.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: bikwasị ya aka
  rationale: Nke a bụ ụzọ Igbo kwesịrị ekwesị isi kọwaa itinye aka n'ahụ onye ahụ, n'etinyeghị echiche emume ọzọ na-adịghị na ederede.
- source_word: ἐπηρώτα αὐτόν
  choice: ọ jụrụ ya
  rationale: Ọ bụ ezie na imperfect nwere ike igosi omume na-aga n'ihu, n'akụkọ a ‘ọ jụrụ ya’ na-enye ajụjụ kpọmkwem ahụ n'ụzọ doro anya.
- source_word: Εἴ τι βλέπεις;
  choice: Ị̀ na-ahụ ihe ọ bụla?
  rationale: Ajụjụ a na-achọ ịmata ma ọ̀ dị ihe ọbụla nwoke ahụ na-ahụ; ntụgharị a na-edobe τι n'enweghị ịkọwa karịa ihe ederede kwuru.
theological_decisions:
- issue: Idobe ọdịdị anụ ahụ nke omume ọgwụgwọ ahụ
  choice: 'E debere usoro ahụ kpọmkwem: ịgbasa ọnụ mmiri n''anya nwoke ahụ na ibikwasị ya aka.'
  alternative: Iji okwu dị nro nke ga-ezochi ma ọ bụ belata nkọwa anụ ahụ ahụ.
  rationale: Amaokwu ahụ ji ụma kọwaa ọgwụgwọ a dịka omume a na-ahụ anya ma na-emetụ ahụ; ntụgharị ekwesịghị ime ka nkọwa ahụ dị nro karịa isi mmalite.
- issue: Echiche emume pụrụ iso ‘ibikwasị aka’
  choice: A sụgharịrị ya dịka ‘bikwasị ya aka’ n'enweghị mgbakwunye nkọwa emume.
  alternative: Ịkọwa ya dịka emume ụka ma ọ bụ omume sakrament.
  rationale: N'ọnọdụ a, okwu ahụ na-akọwa mmetụ Jizọs metụrụ nwoke ahụ n'oge ọgwụgwọ; ederede anaghị achọ ka a tinye echiche emume e mesịrị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘O wee’ na-ejikọta amaokwu a na usoro akụkọ Mak, ebe ‘obodo nta’ na-egosi κώμη nke ọma. E tinyere akara ndetu [a] ozugbo n'akụkụ okwu ndetu ahụ na-akọwa.
