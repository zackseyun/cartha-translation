    text: Ma ọ bụ, kpọmkwem karịa, “gbasịrị ya ọnụ mmiri banye n'anya ya.”
    reason: lexical_alternative
  revision_rationale: The revision clarifies that Jesus spat on the man’s eyes, retains the vivid possible sense of εἰς (“into”) in the footnote, and translates the plural “hands” explicitly. No doctrinal interpretation has been added.
