    issue: “mgbe nnukwu ìgwè mmadụ gbakọtara ọzọ” adds an assembling event.
    rationale: πολλοῦ ὄχλου ὄντος is a genitive absolute meaning that a large crowd was present/there. “Gbakọtara” describes gathering together, an action not expressed by the Greek. “Nọ” preserves the source’s stative circumstantial sense.
