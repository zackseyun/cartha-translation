  text: Ἐν ἐκείναις ταῖς ἡμέραις ⸂πάλιν πολλοῦ⸃ ὄχλου ὄντος καὶ μὴ ἐχόντων τί φάγωσιν, ⸀προσκαλεσάμενος τοὺς ⸀μαθητὰς λέγει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/001.yaml
  text: In those days[a], when again a large crowd was present and they had nothing to eat, he called his disciples and says to them[b],
translation:
  language: ig
  text: N’ụbọchị ndị ahụ, mgbe nnukwu ìgwè mmadụ nọ ọzọ ma ha enweghị ihe ha ga-eri, ọ kpọrọ ndị na-eso ụzọ ya, sị ha:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Greek, ọ bụ “ọ na-asị ha.” Mak na-ejikarị ngwaa oge ugbu a akọ ihe mere n’oge gara aga iji mee ka akụkọ dị ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: N’ụbọchị ndị ahụ
  rationale: Ọ bụ ụzọ Igbo nkịtị ma dị ugwu si egosipụta ọnọdụ oge ahụ, n’etinyeghị ogologo oge na-adịghị n’ederede.
- source_word: πάλιν
  choice: ọzọ
  rationale: Na-egosi na ọnọdụ yiri nke a mere ọzọ n’akụkọ Mak.
- source_word: πολλοῦ ὄχλου ὄντος
  choice: mgbe nnukwu ìgwè mmadụ gbakọtara
  rationale: Na-enye genitive absolute ahụ dịka ọnọdụ ndabere n’Igbo dị ire, ma na-echekwa ịdị ukwuu nke ìgwè ahụ.
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: ma ha enweghị ihe ha ga-eri
  rationale: Na-egosi n’ụzọ doro anya na ìgwè mmadụ ahụ enweghị nri.
- source_word: προσκαλεσάμενος
  choice: ọ kpọrọ
  rationale: ‘Kpọrọ’ na-enye ihe προσκαλέομαι pụtara n’ọnọdụ a n’enweghị itinye okwu na-adịghị mkpa n’Igbo.
- source_word: τοὺς μαθητάς
  choice: ndị na-eso ụzọ ya
  rationale: Ọ bụ okwu Igbo doro anya maka ndị na-amụ ihe n’aka Jizọs ma na-eso ya; ‘ya’ na-eme ka onye a na-ekwu banyere ya doo anya dịka asụsụ Igbo si achọ.
- source_word: λέγει αὐτοῖς
  choice: sị ha
  rationale: ‘Sị ha’ bụ ụzọ akụkọ Igbo dị ndụ si ewebata okwu mmadụ; ọ naghị amanye ọdịiche oge ngwaa nke Greek n’ụzọ ga-adị arọ n’Igbo.
theological_decisions:
- issue: Historical present λέγει n’akụkọ Mak
  choice: sị ha
  alternative: ọ gwara ha
  rationale: Igbo anaghị egosipụta historical present ahụ n’otu usoro ahụ Greek si eme. ‘Sị ha’ na-echekwa ịdị ndụ na ozugbo nke akụkọ ahụ n’enweghị ịgbanwe ihe ọ pụtara.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. A haziri genitive absolute ka ọ bụrụ nkebiokwu ọnọdụ dabara n’ụzọ Igbo si aga. E tinyere naanị akara nkọwa [a] n’ebe e nwere ọdịiche bara uru banyere historical present; a naghị achọ nkọwa ọzọ maka nhazi genitive absolute n’ihi na isi ederede ahụ na-enye ya nke ọma.
