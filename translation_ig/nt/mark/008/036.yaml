    rationale: “Olee uru ọ ga-abara mmadụ” is understandable, but “Gịnị ka ọ ga-abara mmadụ uru” is more idiomatic Standard Igbo.
  - severity: low
    issue: The conditional phrase “ma ọ bụrụ na” is unnecessarily expanded.
    rationale: The Greek expresses the hypothetical situation through infinitives. In Igbo, “ma o rite ... ma tufuo ...” is smoother and keeps the compact rhetorical force.
  - severity: low
    issue: Footnote b is grammatically awkward.
    rationale: Replacing “na-anọchi anya” with “pụtara” states more naturally that “mmadụ” has a generic reference here.
