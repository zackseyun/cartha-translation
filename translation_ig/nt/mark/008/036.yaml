review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rhetorical question, the explanatory force of γάρ, the gain/loss contrast, and the contextual rendering of ψυχή as “ndụ.” The conditional wording is not incorrect, but a more direct Igbo rhetorical construction better reflects the Greek infinitival phrasing.
  naturalness: “Gịnị ka ọ ga-abara mmadụ uru” is the more natural Standard Igbo expression than “olee uru ọ ga-abara mmadụ.” Removing “ma ọ bụrụ na” also makes the sentence less cumbersome while retaining the intended hypothetical sense.
  terminology: “Ndụ ya” is appropriate in this Markan context, while the footnote properly preserves “mkpụrụ obi” as a legitimate lexical alternative. “Ụwa niile,” “rite,” and “tufuo” preserve the comprehensive gain and severe loss contrast well.
