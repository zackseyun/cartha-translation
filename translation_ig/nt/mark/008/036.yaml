  rationale: The revision improves Standard Igbo idiom and concision without changing the sense. It retains the source’s rhetorical question, explanatory connection, totality of “the whole world,” and the gain/loss contrast. The lexical ambiguity of ψυχή remains explicitly preserved in footnote a.
