  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφελεῖ ⸀ἄνθρωπον ⸂κερδῆσαι τὸν κόσμον ὅλον καὶ ζημιωθῆναι⸃ τὴν ψυχὴν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/036.yaml
  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: ig
  text: N’ihi na, gịnị ka ọ ga-abara mmadụ uru ma o rite ụwa niile ma tufuo ndụ ya?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ obi ya.” Okwu Grik bụ ψυχή pụrụ ịpụta “ndụ,” “mkpụrụ obi,” ma ọ bụ “onwe mmadụ,” dabere n’ihe gbara ya gburugburu.
    reason: lexical_alternative
  - marker: b
    text: “Mmadụ” n’ebe a pụtara mmadụ ọ bụla.
    reason: cultural_note
lexical_decisions:
- source_word: τί γὰρ
  choice: N’ihi na, olee uru
  rationale: “N’ihi na” na-ejikọta ajụjụ a na nkuzi bu ya ụzọ, ebe “olee uru” na-edobe ajụjụ nkwuwa okwu ahụ n’ụzọ Igbo sitere n’okike.
- source_word: ὠφελεῖ
  choice: ọ ga-abara ... uru
  rationale: Nkebi a pụtara iweta abamuru ma ọ bụ uru; ọ na-edobekwa ihe atụ azụmahịa nke inweta na ịtụfu.
- source_word: ἄνθρωπον
  choice: mmadụ
  rationale: N’ebe a, okwu Grik ahụ na-anọchi anya mmadụ ọ bụla; “mmadụ” bụ okwu Igbo ebumpụta ụwa na nke na-agụnye mmadụ niile.
- source_word: κερδῆσαι
  choice: ọ nweta
  rationale: “Inweta” na-egosipụta uru ma ọ bụ ihe mmadụ ritere, dabara na ntụnyere dị n’etiti uru na mfu.
- source_word: τὸν κόσμον ὅλον
  choice: ụwa niile
  rationale: Nke a na-egosipụta ụwa n’ozuzu ya ma na-edobe ike okwu ὅλον, ‘niile.’
- source_word: ζημιωθῆναι
  choice: ma tụfuo
  rationale: “Ịtụfu” na-egosi mfu nke ihe bara oke uru ma na-ada nke ọma n’Igbo; ọ na-edobe ntụnyere ya na ‘inweta.’
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ndụ ya
  rationale: N’ọnọdụ Mak 8:35–37, ψυχή na-ezo n’ụzọ doro anya n’ụzọ dị ukwuu ná ndụ mmadụ nke a pụrụ ịzọpụta ma ọ bụ tụfuo. Ma ebe okwu ahụ nwekwara ike ịpụta ‘mkpụrụ obi,’ e debere nke ahụ n’ala peeji.
theological_decisions:
- issue: Otu e si sụgharị ψυχή n’okwu banyere iso ụzọ Jizọs, ebe ọ pụrụ ịpụta ‘ndụ’ ma ọ bụ ‘mkpụrụ obi’
  choice: ndụ
  alternative: mkpụrụ obi
  rationale: Ihe gbara amaokwu a gburugburu na Mak 8:35–37 na-akwado ‘ndụ,’ n’ihi na a na-ekwu maka ịzọpụta ma ọ bụ ịtụfu ψυχή n’ihi Jizọs na ozi ọma. Nhọrọ a anaghị amanye ozizi pụrụ iche banyere ọdịdị mmadụ; a hapụrụ ‘mkpụrụ obi’ dị ka ezigbo nkọwa ọzọ n’ala peeji.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ụdị ajụjụ nkwuwa okwu, njikọ ya na amaokwu bu ụzọ, na ntụnyere azụmahịa nke uru, inweta, na ịtụfu.
