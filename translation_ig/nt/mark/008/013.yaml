  terminology: “ụgbọ mmiri” na “n’ofe nke ọzọ” dabara adaba n’ọnọdụ a. Ekwesịrị idozi naanị okwu ọzọ dị na nkọwa ala peeji ka “ọzọ” ghara ịkọwa ụgbọ mmiri kama ọ kọwaa omume ịbanye.
