  text: And leaving them[a], he got back into the boat and went to the other side.
translation:
  language: ig
  text: Ọ hapụrụ ha, banyeghachi n’ụgbọ mmiri[a], wee gaa n’ofe nke ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ hapụrụ ha, banye ọzọ n’ụgbọ mmiri, wee gaa n’ofe nke ọzọ.” Okwu Grik πάλιν nwere ike ịpụta “ọzọ” karịa “laghachi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς
  choice: Ọ hapụrụ
  rationale: Aorist participle ahụ na-egosi na ọ hapụrụ ndị ahụ; n’Igbo, iji ngwaa zuru ezu malite ahịrịokwu a bụ ụzọ dị mfe ma bụrụkwa nke na-aga nke ọma n’akụkọ.
- source_word: αὐτοὺς
  choice: ha
  rationale: Nnochiaha a na-ezo aka n’ebe ndị Farisii nọ n’okwu ndị bu ụzọ.
- source_word: πάλιν
  choice: -ghachi na banyeghachi
  rationale: πάλιν nwere ike ịpụta ‘ọzọ’ ma ọ bụ ‘laghachi.’ N’ọnọdụ njem a, itinye ya n’ime ‘banyeghachi’ na-egosi na ọ laghachiri banye n’ụgbọ mmiri n’Igbo ebumpụta ụwa.
- source_word: ἐμβὰς
  choice: banyeghachi n’ụgbọ mmiri
  rationale: Participle a pụtara ịbanye ma ọ bụ ịrị n’ime ihe; ọnọdụ akụkọ ahụ na-eme ka o doo anya na ihe ahụ bụ ụgbọ mmiri, ya mere ekwuru ya kpọmkwem.
- source_word: ἀπῆλθεν
  choice: wee gaa
  rationale: Ụdị ngwaa a na-egosi ọpụpụ; ‘wee gaa’ jikọtara usoro omume ndị ahụ n’ụzọ doro anya ma dị mfe n’Igbo.
- source_word: εἰς τὸ πέραν
  choice: n’ofe nke ọzọ
  rationale: Nkebiokwu a na-egosi akụkụ nke ọzọ nke ọdọ mmiri ahụ; ntụgharị a na-edobe nghọta ala ahụ n’enweghị ịgbakwunye nkọwa na-adịghị na ederede.
