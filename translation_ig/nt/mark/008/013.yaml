    rationale: N’Igbo, “ụgbọ mmiri ọzọ” na-atụ aka n’ụgbọ mmiri ọzọ/dị iche, ebe πάλιν na-akọwa ịbanye ọzọ ma ọ bụ ịlaghachi banye, ọ bụghị ụdị ụgbọ mmiri ọzọ.
