  verdict: revise
  source_fidelity: Isi ntụgharị ahụ na-egosipụta nke ọma ἀφεὶς αὐτούς, ἐμβὰς, na ἀπῆλθεν εἰς τὸ πέραν. “banyeghachi” bụ ụzọ Igbo kwesịrị ekwesị isi gosipụta πάλιν na ἐμβὰς ọnụ, ebe ụgbọ mmiri ahụ bụ ihe ọnọdụ akụkọ na-egosi. Otú ọ dị, nkọwa ala peeji dị ugbu a na-ekwu “banye n’ụgbọ mmiri ọzọ,” nke pụtara ịbanye n’ụgbọ mmiri dị iche ọzọ; nke ahụ abụghị ihe Grik na-ekwu.
