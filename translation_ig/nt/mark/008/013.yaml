translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A haziri participle Grik dị ka usoro ngwaa Igbo, ma chekwaa ihe πάλιν nwere ike ịpụta site n’ihe odide ukwu na nkọwa ala peeji.
