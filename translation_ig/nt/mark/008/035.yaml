  to: N’ihi na onye ọ bụla chọrọ ịzọpụta ndụ ya[a] ga-atụfu ya; ma onye ọ bụla ga-atụfu ndụ ya n’ihi m na ozi ọma ahụ[b] ga-azọpụta ya.
