id: MRK.8.35
reference: Mark 8:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: ig
  text: N’ihi na onye ọ bụla chọrọ ịzọpụta ndụ ya[a] ga-atụfu ya; ma onye ọ bụla ga-atụfu ndụ ya n’ihi m na ozi ọma ahụ[b] ga-azọpụta ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ obi ya.” Okwu Grik a pụrụ ịpụta “ndụ” ma ọ bụ “mkpụrụ obi,” dabere n’ọnọdụ e ji ya mee ihe; otu ihe ahụ metụtara n’oge ọ bụla ọ pụtara n’amaokwu a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “n’ihi m na n’ihi ozi ọma ahụ.”
    reason: syntactic_clarification
lexical_decisions:
- source_word: ψυχή
  choice: ndụ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka ná ndụ mmadụ ma ọ bụ onwe ya. “Ndụ” na-eme ka ọdịiche dị n’ịzọpụta ndụ na ịtụfu ya pụta ìhè, n’enweghị ịkpa ya ókè ka ọ bụrụ naanị akụkụ ime mmụọ mmadụ.
- source_word: σῶσαι / σώσει
  choice: ịzọpụta / ga-azọpụta
  rationale: Nhọrọ a na-edobe otu ngwaa ahụ n’akụkụ abụọ ma na-eme ka ihe mgbagwoju anya e bu n’obi—ịzọpụta ndụ ma tụfuo ya, ma ọ bụ ịtụfu ya ma zọpụta ya—doo anya.
- source_word: ἀπολέσει / ἀπολέσει
  choice: ga-atụfu / tụfuru
  rationale: Mgbe ihe a na-ekwu maka ya bụ ndụ, “ịtụfu” bụ okwu Igbo doro anya ma kwekọọ n’ọdịiche ya na “ịzọpụta.” Nke mbụ na-egosi ihe ga-esi na ya pụta; nke abụọ nọ n’usoro ọnọdụ nke na-akọ onye mere otú ahụ.
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: n’ihi m na ozi ọma ahụ
  rationale: “N’ihi” na-egosi ihe kpatara omume ahụ ma ọ bụ onye na ihe e mere ya n’ihi ha. Ọ na-emetụta ma Jizọs ma ozi ọma ahụ, dịka usoro Grik si dị.
- source_word: εὐαγγέλιον
  choice: ozi ọma
  rationale: Nke a bụ ntụgharị Igbo doro anya, nke mmadụ nkịtị na-aghọta, ma na-edobe isi echiche okwu Grik ahụ.
- source_word: ὃς ... ὃς
  choice: onye ọ bụla ... onye ọ bụla
  rationale: Ọ na-egosi na okwu a metụtara onye ọbụla, ma na-edobe ọdịdị ilu ma ọ bụ nkwupụta zuru ụwa ọnụ nke ahịrịokwu ahụ.
- source_word: θέλῃ
  choice: chọrọ
  rationale: “Chọrọ” bụ okwu Igbo dị ugbu a ma dị mfe nke na-egosi ọchịchọ ma ọ bụ mkpebi mmadụ.
theological_decisions:
- issue: Ihe ψυχή pụtara n’okwu a banyere ịbụ onye na-eso ụzọ
  choice: E jiri “ndụ” mee ihe n’ahịrịokwu bụ isi.
  alternative: mkpụrụ obi
  rationale: Ihe gbara amaokwu a gburugburu bụ ịjụ onwe onye na ịdị njikere ịtụfu ndụ n’ihi Jizọs na ozi ọma ahụ. “Ndụ” na-ejide isi okwu a nke ọma, ebe ihe e dere n’ala peeji na-echekwa ohere okwu Grik ahụ nwere ịpụta “mkpụrụ obi.”
- issue: Mmekọrịta ἕνεκεν na ihe abụọ so ya
  choice: A sụgharịrị ya “n’ihi m na ozi ọma ahụ.”
  alternative: n’ihi m na n’ihi ozi ọma ahụ
  rationale: Otu ἕνεκεν ahụ na-achị ma “m” ma “ozi ọma ahụ.” Igbo nkịtị ekwesịghị ikwughachi “n’ihi,” ma enwere ike ikwughachi ya iji mee njikọ ahụ pụta ìhè.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, kwụ ọtọ ma dị ùgwù mee ihe. A hapụrụ usoro ilu na ọdịiche dị n’etiti “ịzọpụta” na “ịtụfu” ka ha guzosie ike. “Onye ọ bụla” na-egosi na okwu ahụ metụtara mmadụ niile n’enweghị iji usoro nnọchiaha Bekee manye asụsụ Igbo.
