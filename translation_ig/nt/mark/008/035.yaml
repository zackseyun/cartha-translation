review_pass:
  verdict: revise
  source_fidelity: 'The main rendering correctly preserves the twofold ψυχή/ndụ paradox, the future consequences, and the motivation ‘for me and the gospel.’ A prospective form for the second ἀπολέσει is preferable in Igbo: the Greek aorist subjunctive in this generic relative clause is not naturally best represented as completed ‘tufuru.’'
  naturalness: The wording is generally clear Standard Igbo. Replacing ‘tufuru’ with ‘ga-atụfu’ makes the paired clauses more idiomatic and maintains the deliberate future contrast. The alternative-rendering footnote should use ‘ịtụgharị’ rather than ‘ịsụ,’ which is not natural here for a translation alternative.
  terminology: ‘ndụ,’ ‘ịzọpụta,’ and ‘ozi ọma’ are suitable and theologically nonrestrictive. The ψυχή footnote appropriately retains ‘mkpụrụ obi’ as a lexical alternative without imposing an anthropological reading.
  issues:
  - severity: medium
    issue: The second occurrence of ‘tufuru’ can suggest a completed past action.
    rationale: ὃς δ’ ἂν ἀπολέσει is a generic, prospective condition parallel to the first clause. ‘Ga-atụfu’ clearly represents this force in contemporary Standard Igbo.
  - severity: low
    issue: Footnote b uses ‘A pụkwara ịsụ ya.’
    rationale: For an alternative translation, ‘A pụkwara ịtụgharị ya’ is the natural Standard Igbo formulation.
  - severity: low
    issue: Footnote a’s final sentence is awkwardly phrased.
    rationale: ‘n’oge ọ bụla ọ pụtara n’amaokwu a’ clearly states that the lexical alternative applies to each occurrence in the verse.
  revised_text: N’ihi na onye ọ bụla chọrọ ịzọpụta ndụ ya[a] ga-atụfu ya; ma onye ọ bụla ga-atụfu ndụ ya n’ihi m na ozi ọma ahụ[b] ga-azọpụta ya.
