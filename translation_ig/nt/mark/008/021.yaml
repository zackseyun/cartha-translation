  text: καὶ ἔλεγεν αὐτοῖς· ⸀Οὔπω συνίετε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/021.yaml
  text: And he was saying to them[a], “Do you not yet understand?”
translation:
  language: ig
  text: Ọ nọ na-agwa ha, sị, “Unu aghọtabeghị?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu ka na-aghọtaghị?”
    reason: Ụzọ ọzọ e si asụgharị Οὔπω; ọ pụrụ igosi na nghọta ka adịghị ruo oge ahụ.
lexical_decisions:
- source_word: καὶ
  choice: kwa
  rationale: E ji “kwa” jikọta okwu a na ihe bu ya ụzọ n'ụzọ dị mfe, n’etinyeghị echiche oge ma ọ bụ ihe ọzọ Grik ahụ na-ekwughị.
- source_word: ἔλεγεν
  choice: Ọ nọ na-agwa
  rationale: Ụdị ngwaa imperfect na-egosi omume na-aga n’ihu ma ọ bụ okwu e kwuru ugboro ugboro; “ọ nọ na-agwa” na-echekwa akụkụ ahụ nke ngwaa.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnochiaha a pụtara “ha”; a kpọghị ndị ọ na-ekwu maka ha aha kpọmkwem n’amaokwu a.
- source_word: Οὔπω
  choice: aghọtabeghị ruo ugbu a
  rationale: Nchịkọta “-beghị ruo ugbu a” na-enye echiche nke “ọ kabeghị eme ruo ugbu a/not yet” n’Igbo doro anya ma dịkwa eke.
- source_word: συνίετε
  choice: aghọta
  rationale: “Ịghọta” na-egosi ịmata ihe nke ọma n’uche, nke bụ isi echiche συνίημι n’ebe a.
theological_decisions:
- issue: Ma a ga-etinye ihe a na-aghọtaghị, dị ka “nke a” ma ọ bụ “ya.”
  choice: 'A hapụrụ ihe a na-aghọtaghị n’ekwughị ya: “Unu aghọtabeghị ruo ugbu a?”'
  alternative: “Unu aghọtabeghị nke a ruo ugbu a?”
  rationale: Grik ekwughị ihe a na-aghọtaghị kpọmkwem. Ịhapụ ya otu ahụ na-echekwa obosara na ike ajụjụ Jizọs n’etinyeghị nkọwa na-adịghị n’ihe odide ahụ.
translation_notes:
  register: E jiri Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “Ọ nọkwa na-agwa ha” iji chekwaa ọdịdị imperfect nke ἔλεγεν, ebe ajụjụ ahụ hapụrụ ihe ọ na-ekwu maka ya n’ekwughị ya dịka Grik siri dị.
