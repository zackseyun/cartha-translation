revisions:
- from: Ọ nọkwa na-agwa ha, sị, “Unu aghọtabeghị ruo ugbu a?”[a]
  to: Ọ nọ na-agwa ha, sị, “Unu aghọtabeghị?”[a]
  rationale: The revision preserves the Greek imperfective framing (“Ọ nọ na-agwa”), the unspecified plural referent (“ha”), and the open-ended question. It replaces an awkwardly explicit temporal phrase with the natural Igbo negative-perfect expression for ‘not yet,’ while retaining the viable ‘still not understand’ alternative in the footnote.
  reviewer_model: gpt-5.6-terra
