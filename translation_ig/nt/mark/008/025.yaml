  text: εἶτα πάλιν ⸀ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ, καὶ ⸂διέβλεψεν καὶ ἀπεκατέστη καὶ ἐνέβλεπεν⸃ τηλαυγῶς ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/025.yaml
  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: ig
  text: 'Mgbe ahụ, o bikwasịrị aka ya abụọ n’anya nwoke ahụ ọzọ[a]. Nwoke ahụ wee hụ nke ọma, e weghachikwara ịhụ ụzọ ya; ọ nọkwa na-ahụ ihe niile n’ụzọ doro anya[b].


    [a] Ụfọdụ ihe odide oge ochie nwere okwu nke a pụrụ ịsụgharị, “o wee legide anya, e weghachikwara ịhụ ụzọ ya, o wee hụ ihe niile nke ọma.”


    [b] Ma ọ bụ, “o nwekwara ike ịhụ ihe niile nke ọma.” N’ahịrịokwu ikpeazụ, ngwaa Grik ahụ nọ n’ụdị na-egosi omume na-aga n’ihu, tinyere okwu na-egosi ido anya n’ịhụ ụzọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide oge ochie nwere okwu nke a pụrụ ịsụgharị, “o wee legide anya, e weghachikwara ịhụ ụzọ ya, o wee hụ ihe niile nke ọma.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “o nwekwara ike ịhụ ihe niile nke ọma.” N’ahịrịokwu ikpeazụ, ngwaa Grik ahụ nọ n’ụdị na-egosi omume na-aga n’ihu, tinyere okwu na-egosi ido anya n’ịhụ ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: Mgbe ahụ ... ọzọ
  rationale: “Mgbe ahụ” na-egosi usoro oge nke εἶτα, ebe “ọzọ” na-egosi nkwughachi nke πάλιν; nhazi a bụ nke sitere n’okike n’Igbo.
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: o bikwasịrị aka ya n’anya nwoke ahụ
  rationale: “Bikwasị aka” bụ ụzọ Igbo si ekwu itinye aka n’ahụ́ mmadụ, ma “n’anya nwoke ahụ” na-eme ka onye a na-ekwu banyere ya doo anya n’enweghị mgbakwunye nkọwa.
- source_word: διέβλεψεν
  choice: Nwoke ahụ wee hụ ụzọ nke ọma
  rationale: διαβλέπω n’ebe a na-egosi ịhụ ụzọ nke ọma mgbe ọhụụ ya na-edochaghị anya na mbụ; nsụgharị a ezere ibubata echiche “ile anya elu” ma ọ bụ “ilesi anya ike” sitere n’ọdịiche ụfọdụ nke ihe odide.
- source_word: ἀπεκατέστη
  choice: e weghachikwara ịhụ ụzọ ya
  rationale: ἀποκαθίστημι pụtara iweghachi ihe n’ọnọdụ kwesịrị ya. Ikwu kpọmkwem banyere ịhụ ụzọ dabara n’ọnọdụ akụkọ a ma na-edebe echiche nke iweghachi.
- source_word: ἐνέβλεπεν
  choice: ọ nọkwa na-ahụ
  rationale: Ụdị imperfect nke ngwaa ahụ na-egosi ọnọdụ ma ọ bụ omume na-aga n’ihu. “Ọ nọkwa na-ahụ” na-echekwa akụkụ a karịa naanị “ọ hụrụ.”
- source_word: τηλαυγῶς
  choice: n’ụzọ doro anya
  rationale: Okwu a na-egosi ịhụ ihe nke ọma ma doo anya, ma ọ pụrụ inwe ndò echiche nke ịhụ ihe dị anya. Nhọrọ a na-echekwa isi ihe bụ ido anya n’ebughị nkọwa a na-ejighị n’aka banye n’ahịrịokwu.
- source_word: ἅπαντα
  choice: ihe niile
  rationale: Neuter plural ἅπαντα pụtara n’ụzọ nkịtị “ihe niile,” nke bụ okwu Igbo doro anya ma dị mfe.
theological_decisions:
- issue: Otú akụkọ ahụ si gosi ọgwụgwọ nke mere n’usoro abụọ
  choice: 'E debere usoro ahụ: Jizọs bikwasịrị ya aka ọzọ, nwoke ahụ hụzie ụzọ nke ọma, e weghachikwa ịhụ ụzọ ya, ọ nọgidekwa na-ahụ ihe niile n’ụzọ doro anya.'
  alternative: Ịsụgharị ngwaa niile dịka omume ndị mechara ozugbo, n’enweghị ihe na-egosi ọganihu ma ọ bụ ọnọdụ na-aga n’ihu.
  rationale: Usoro ngwaa Grik, karịsịa imperfect ἐνέβλεπεν, na-egosi ọganihu na ọnọdụ si na ọgwụgwọ ahụ pụta. Idebe nke a na-egbochi ime ka ọgwụgwọ nke usoro abụọ ghọọ otu omume mere n’otu ntabi anya.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “nwoke ahụ” mee ka mgbanwe onye na-eme ihe doo anya, ebe Grik ji nnọchiaha. E debere ụdị imperfect site n’okwu “ọ nọkwa na-ahụ,” n’agbanyeghị na ọ dị ntakịrị arọ, ka akụkụ ngwaa ahụ ghara ịla n’iyi.
