  verdict: approve
  source_fidelity: '“O wee dọọ ha aka ná ntị” faithfully conveys ἐπετίμησεν in this prohibitive context, retaining the forceful warning/charge without asserting why Jesus imposed secrecy. “Ka ha ghara ịgwa onye ọ bụla banyere ya” accurately represents ἵνα μηδενὶ λέγωσιν περὶ αὐτοῦ: the negative directive, universal indirect object, and reference to Jesus are all preserved.'
  naturalness: The wording is fluent, contemporary Standard Igbo. “Dọọ ha aka ná ntị” and “ka ha ghara ịgwa onye ọ bụla” are idiomatic and maintain an appropriately restrained biblical register. “O wee” naturally carries the narrative connection without woodenly reproducing Greek καί.
  terminology: The alternatives in the footnote appropriately document the lexical range of ἐπιτιμάω. “Ọ baara ha mba” reflects the rebuke sense, while “O nyere ha iwu siri ike” expresses the strong-charge sense. The footnote marker is correctly anchored after the sentence.
