  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μηδενὶ λέγωσιν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/030.yaml
  text: And he warned them to tell no one about him[a].
translation:
  language: ig
  text: O wee dọọ ha aka ná ntị ka ha ghara ịgwa onye ọ bụla banyere ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ baara ha mba,” ma ọ bụ, “O nyere ha iwu siri ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: dọọ ha aka ná ntị
  rationale: Okwu a na-enwekarị echiche nke ịba mba, ma n’ebe a ọ na-egosi na Jizọs nyere ndị na-eso ụzọ ya iwu siri ike ka ha ghara ikpughe onye ọ bụ. “Dọọ ha aka ná ntị” na-egosipụta ịdị arọ nke iwu ahụ n’Igbo dị ugbu a, n’agbanyeghị na e nwekwara ike ịsụgharị ya dị ka “baara ha mba” ma ọ bụ “nyere ha iwu siri ike.”
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha a dị n’ụdị otutu ma na-ezo aka n’ebe ndị na-eso ụzọ Jizọs nọ.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: ka ha ghara ịgwa onye ọ bụla
  rationale: Mgbe ἵνα na ngwaa dị n’ọnọdụ subjunctive sochiri ngwaa nke inye iwu ma ọ bụ ịdọ aka ná ntị, nkebiokwu Igbo “ka ha ghara…” na-egosipụta nke ọma ihe e nyere ha iwu ka ha ghara ime. “Ịgwa onye ọ bụla” na-enye echiche nke ikwusara mmadụ ozi.
- source_word: περὶ αὐτοῦ
  choice: banyere ya
  rationale: περί na genitive pụtara “banyere” ma ọ bụ “n’ihe gbasara”; “banyere ya” bụ okwu Igbo doro anya ma dịkwa n’ụzọ nkịtị.
theological_decisions:
- issue: Ike iwu Jizọs nyere n’ihe gbasara izochi onye ọ bụ
  choice: E gosipụtara ya dị ka ịdọ aka ná ntị siri ike ka ha ghara ịgwa onye ọ bụla banyere ya.
  alternative: A pụrụ ịsụgharị ya “ọ baara ha mba” ma ọ bụ “o nyere ha iwu siri ike.”
  rationale: Amaokwu ahụ na-egosi mmachibido siri ike, ma ọ kọwaghị ihe mere Jizọs ji nye iwu ahụ. Nsụgharị a anaghị etinye ozizi ọ bụla gbasara ihe kpatara izochi onye ọ bụ, kama ọ na-ahapụ mgbagwoju anya ahụ dịka ihe odide Grik si mee.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “O wee” na-eme ka njikọ καί na usoro akụkọ ahụ pụta n’ụzọ Igbo sitere n’okike; “dọọ ha aka ná ntị” na-echekwa ịdị arọ nke okwu ahụ n’enweghị ịkọwa ihe kpatara iwu ahụ.
