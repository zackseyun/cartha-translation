- from: Ha bịarutere na Betseida. Ha kpọtaara ya otu nwoke kpuru ìsì, rịọsiekwa ya ike ka o metụ ya aka.
  to: Ha bịarutere na Betsaida. Ha kpọtaara ya otu nwoke kpuru ìsì, rịọsie ya ike ka o metụ nwoke ahụ aka.
  rationale: Minor revisions improve conventional name spelling, avoid an unintended additive nuance, and clarify the object of Jesus’ touch. No footnote is needed because the Greek syntax and referents are not textually disputed.
