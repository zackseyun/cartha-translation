  text: Καὶ ⸀ἔρχονται εἰς Βηθσαϊδάν. καὶ φέρουσιν αὐτῷ τυφλὸν καὶ παρακαλοῦσιν αὐτὸν ἵνα αὐτοῦ ἅψηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/022.yaml
  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: ig
  text: Ha bịarutere na Betsaida. Ha kpọtaara ya otu nwoke kpuru ìsì, rịọsie ya ike ka o metụ nwoke ahụ aka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: Ha bịarutere
  rationale: Okwu Grik a dị n'oge ugbu a nke a na-eji akọ akụkọ gara aga; oge gara aga bụ ụzọ Igbo si akọ ya n'ụzọ ebumpụta ụwa. “Bịarutere” na-egosikwa iru ebe ahụ nke ọma.
- source_word: εἰς Βηθσαϊδάν
  choice: na Betseida
  rationale: N'okwu Igbo, “bịarutere na” bụ ụzọ ebumpụta ụwa isi kwuo na ha rutere obodo ahụ; a sụgharịghị aha obodo ahụ kama e dere ya dịka ụda ya si dị.
- source_word: φέρουσιν
  choice: kpọtaara ya
  rationale: Oge ugbu a nke akụkọ a ka e gosipụtara n'oge gara aga. “Kpọtaara” na-egosi na ha mere ka nwoke ahụ bịakwute Jizọs n'ekwughị kpọmkwem ma hà bu ya ma ọ bụ du ya.
- source_word: τυφλὸν
  choice: otu nwoke kpuru ìsì
  rationale: Adjective Grik ahụ nọchiri aha ma bụrụ nke nwoke; okwu a bụ nke doro anya ma dịkwa ebumpụta ụwa n'Igbo.
- source_word: παρακαλοῦσιν
  choice: rịọsiekwa ya ike
  rationale: N'ebe a, okwu ahụ pụtara arịrịọ siri ike, ọ bụghị naanị ịrịọ ihe n'ụzọ nkịtị.
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: ka o metụ ya aka
  rationale: “Ka” na-egosi ihe ha rịọrọ ya ka o mee; “metụ ya aka” bụ ụzọ Igbo si ekwu ἅπτομαι n'ụzọ ziri ezi ma dị mfe nghọta.
- source_word: καὶ
  choice: Ha … Ha … -kwa
  rationale: E chekwara njikọ na-aga n'ihu nke Mak ji καί wuo, ma e mere ya n'usoro Igbo ebumpụta ụwa site n'ịmalite ahịrịokwu abụọ na “Ha” na iji “-kwa” jikọta arịrịọ ahụ.
