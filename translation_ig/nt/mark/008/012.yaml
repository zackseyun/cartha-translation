id: MRK.8.12
reference: Mark 8:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: ig
  text: O wee sụọ ude nke ukwuu n’ime mmụọ ya, sị, “Gịnị mere ọgbọ a ji achọ ihe ịrịba ama? N’ezie, ana m asị unu, a gaghị enye ọgbọ a ihe ịrịba ama ọ bụla.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kpọmkwem karị, “ọ bụrụ na a ga-enye ọgbọ a ihe ịrịba ama”—ụdị okwu iyi n’asụsụ Grik nke pụtara na a gaghị enye ọgbọ a ihe ịrịba ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστενάξας
  choice: sụọ ude nke ukwuu
  rationale: Nke a na-egosi ude miri emi nke okwu Grik ahụ na-akọ, ma ọ naghị etinye mmetụta karịrị ihe dị n’ederede.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: si n’ime mmụọ ya
  rationale: Nke a na-edobe okwu gbasara mmụọ nke dị na Grik ma na-egosi na ude ahụ sitere n’ime ya.
- source_word: λέγει
  choice: na-ekwu
  rationale: A họọrọ oge ugbu a iji chekwaa historical present nke Mak ji eme ka akụkọ ahụ dị ndụ.
- source_word: Τί
  choice: Gịnị mere
  rationale: N’ajụjụ a, τί na-ajụ ihe kpatara omume ahụ; “Gịnị mere” bụ Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
- source_word: γενεὰ
  choice: ọgbọ
  rationale: “Ọgbọ” na-echekwa echiche nke otu ndị bi n’otu oge na ibu ọrụ ha dịka otu.
- source_word: ζητεῖ
  choice: na-achọ
  rationale: Nke a bụ ntụgharị kpọmkwem nke ngwaa ahụ, na-ezere ime ka ọ pụta “na-amanye” ma ọ bụ “na-achọsi ike” karịa ihe Grik kwuru.
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: Ọ bụ okwu Igbo doro anya maka akara na-egosi ma ọ bụ na-akwado ihe, n’etinyeghị okwu “ọrụ ebube” nke na-adịghị n’ederede.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: N’ezie, ana m asị unu
  rationale: Nke a na-ebute ịdị nsọ na nkwenye siri ike nke usoro okwu Jizọs ma bụrụkwa Igbo dị ugbu a.
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: a gaghị enye ọgbọ a ihe ịrịba ama ọ bụla
  rationale: εἰ dị ebe a bụ usoro iyi nke na-egosi ngọnarị siri ike; ntụgharị a na-eme ka ihe ọ pụtara doo onye na-agụ Igbo anya.
theological_decisions:
- issue: Otu e si ghọta nkebi εἰ nke yiri okwu iyi mgbe ἀμὴν λέγω ὑμῖν gasịrị
  choice: 'A tụgharịrị ya dịka ngọnarị siri ike: “a gaghị enye ọgbọ a ihe ịrịba ama ọ bụla.”'
  alternative: “ọ bụrụ na a ga-enye ọgbọ a ihe ịrịba ama”
  rationale: Usoro Grik a, nke sitere n’ụdị okwu iyi ndị Sem, na-arụ ọrụ dịka ngọnarị siri ike. Ikwupụta ngọnarị ahụ hoo haa na Igbo na-ezipụta ihe e bu n’obi n’enweghị ikpochapụ ụdị okwu mbụ ahụ, nke a kọwara n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ihe ịrịba ama” na “mmụọ ya” na-echekwa isi okwu na mgbagwoju anya kwesịrị ekwesị nke ederede Grik; e tinyere akara ala ala peeji n’ebe nkebi iyi ahụ dị.
