    issue: The opening clause has an incorrect syntactic relationship.
    rationale: '“O wee si n’ime mmụọ ya sụọ ude nke ukwuu” places “si” before the sigh infinitive-like complement and can present the sigh as the content/purpose of speech. In Greek, ἀναστενάξας is a participle preceding λέγει: Jesus sighs deeply in his spirit and then speaks.'
