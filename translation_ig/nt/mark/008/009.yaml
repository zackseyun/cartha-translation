id: MRK.8.9
reference: Mark 8:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦσαν ⸀δὲ ὡς τετρακισχίλιοι. καὶ ἀπέλυσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/009.yaml
  text: There were about four thousand[a], and he sent them away.
translation:
  language: ig
  text: Ọnụ ọgụgụ ha dị ihe dị ka puku mmadụ anọ. Ọ wee zipụ ha ka ha laa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν
  choice: Ha dị
  rationale: N'Igbo, “Ha dị” na-egosi ọnụọgụ ìgwè mmadụ n'ụzọ doro anya ma kwekọọ n'ọrụ ịdị adị nke εἰμί.
- source_word: δὲ
  choice: wee
  rationale: δέ bụ njikọ dị nro; n'usoro ahịrịokwu Igbo a, “wee” na-ejikọta omume na-esote nke ọma n'ebughị echiche oge ọzọ abụghị nke dị n'isi mmalite.
- source_word: ὡς
  choice: ihe dị ka
  rationale: N'ihu ọnụọgụ, ὡς na-egosi na ọnụọgụ ahụ abụghị kpọmkwem; “ihe dị ka” bụ okwu Igbo nkịtị maka nke a.
- source_word: τετρακισχίλιοι
  choice: puku mmadụ anọ
  rationale: Ọnụọgụ ahụ na-ekwu banyere ndị nọ n'ìgwè mmadụ; itinye “mmadụ” na-eme ka okwu Igbo doo anya ma bụrụ nke ebumpụta ụwa.
- source_word: ἀπέλυσεν
  choice: zipụ ha ka ha laa
  rationale: N'ebe a ἀπολύω pụtara ịhapụ ma ọ bụ izipụ ìgwè mmadụ ka ha laa; nhọrọ a doro ndị na-agụ Igbo anya.
- source_word: αὐτούς
  choice: ha
  rationale: Nnọchiaha a na-ezo aka n'ìgwè mmadụ ahụ.
theological_decisions:
- issue: Isiokwu zoro ezo nke ἀπέλυσεν
  choice: Jizọs
  alternative: ọ
  rationale: Ngwaa Grik ahụ nwere isiokwu onye nke atọ nke a na-amata site n'akụkọ gbara ya gburugburu. Ịkpọ Jizọs aha na-egbochi mgbagwoju anya n'Igbo, n'agbanyeghị na aha ahụ apụtaghị ọzọ n'amaokwu a.
translation_notes:
  register: 'Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma nwee ugwu. E jighị akara ntụaka [a] nke English POB mee ihe, n''ihi na ndetu Bekee ahụ yiri ka etinyere ya n''ebe na-ekwesịghị ekwesị: “dismissed them” bụ nhọrọ maka ἀπέλυσεν, ọ bụghị maka “four thousand.” Nhọrọ Igbo ahụ “zipụ ha ka ha laa” na-enye isi echiche ahụ kpọmkwem, ya mere ndetu ọzọ adịghị mkpa.'
