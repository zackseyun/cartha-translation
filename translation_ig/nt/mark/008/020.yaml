  text: ὅτε ⸀καὶ τοὺς ἑπτὰ εἰς τοὺς τετρακισχιλίους, πόσων σπυρίδων πληρώματα κλασμάτων ἤρατε; ⸂καὶ λέγουσιν αὐτῷ⸃· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: ig
  text: Mgbe m jikwa ogbe achịcha asaa ahụ zụọ puku mmadụ anọ[a], nkata ukwu ole jupụtara n'iberibe achịcha ka unu chịkọtara?” Ha zara ya, sị, “Asaa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ σπυρίς, nke na-ezo aka na nkata buru ibu, dị iche na okwu e ji kpọọ nkata nta na Mak 8:19.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε καὶ
  choice: Mgbe o jikwa
  rationale: Nke a na-ejikọta ajụjụ nke abụọ a na nke bu ya ụzọ ma na-egosi oge; “jikwa” na-eburu echiche καὶ n'Igbo nkịtị.
- source_word: τοὺς ἑπτὰ
  choice: ogbe achịcha asaa ahụ
  rationale: N'asụsụ Grik, “asaa ahụ” hapụrụ aha ihe ahụ n'ihi na a matala ya site n'akụkọ gara aga. Itinye “ogbe achịcha” n'Igbo na-eme ka okwu doo anya n'enweghị ịgbanwe ihe e zoro aka na ya.
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: nye puku mmadụ anọ
  rationale: “Nye” na-egosi ndị e ji achịcha ahụ zụọ, ebe “mmadụ” na-eme ka ọnụọgụ ahụ bụrụ nke doro anya ma bụrụ Igbo e ji eme ihe ugbu a.
- source_word: πόσων σπυρίδων
  choice: nkata ukwu ole
  rationale: σπυρίς bụ nkata buru ibu, ọ dị iche na κόφινος e ji mee ihe na Mak 8:19; “nkata ukwu” na-echekwa ọdịiche ahụ.
- source_word: πληρώματα κλασμάτων
  choice: jupụtara n'iberibe achịcha
  rationale: Nke a na-egosi na nkata ndị ahụ jupụtara n'iberibe fọdụrụ. “Iberibe achịcha” na-eme ka ihe κλασμάτων na-ezo aka na ya doo anya n'okwu a.
- source_word: ἤρατε
  choice: ka unu chịkọtara
  rationale: N'ọnọdụ a, αἴρω pụtara ịnakọta ma bulie ihe fọdụrụ; “chịkọtara” bụ okwu Igbo doro anya maka omume ahụ.
- source_word: καὶ λέγουσιν αὐτῷ
  choice: Ha zara ya, sị
  rationale: Ọ bụ ezie na Grik kwuru ya n'ụdị ugbu a nke akụkọ, Igbo na-akọ ya nke ọma n'oge gara aga. “Zara” dabara n'ihi na okwu ha bụ azịza nye ajụjụ Jizọs.
- source_word: Ἑπτά
  choice: Asaa
  rationale: Azịza ọnụọgụ kpọmkwem nye ajụjụ ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A kọwapụtara aha “achịcha” nke Grik hapụrụ n'amaokwu a n'ihi na Igbo chọrọ ya ka nkebiokwu ahụ daa nke ọma; ihe a na-ezo aka na ya sitere na Mak 8:5–6.
