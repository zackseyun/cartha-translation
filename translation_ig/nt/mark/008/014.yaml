  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐπελάθοντο λαβεῖν ἄρτους, καὶ εἰ μὴ ἕνα ἄρτον οὐκ εἶχον μεθ’ ἑαυτῶν ἐν τῷ πλοίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/014.yaml
  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: ig
  text: Ha echefuola iwere achịcha, ma ha enweghị achịcha ha ji n’ụgbọ mmiri ahụ, e wezụga otu ogbe achịcha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kpọmkwem, “iwere ogbe achịcha.” Okwu Grik ἄρτους dị n’ụdị ọtụtụ, ọ pụkwara ịpụta ogbe achịcha dị iche iche; ma n’ebe a, o yikarịrị ka ọ pụtara achịcha ma ọ bụ ihe oriri n’ozuzu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: Ha echefuola
  rationale: 'Aorist ahụ na-akọ ihe mere tupu ọnọdụ a nọ n’akụkọ: ndị na-eso ụzọ echefuola iweta nri.'
- source_word: λαβεῖν
  choice: iwere
  rationale: Infinitive a na-emeju ‘echefuola’; n’ọnọdụ a, ‘iwere’ pụtara iwere ihe soro ha.
- source_word: ἄρτους
  choice: anyịcha
  rationale: Plural ahụ nwere ike ịpụta ogbe achịcha dị iche iche, ma n’ebe a ọ na-arụ ọrụ dịka aha nri n’ozuzu.
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: ọ bụkwa naanị otu ogbe achịcha
  rationale: 'εἰ μή bụ okwu mwepụ n’ebe a: ọ dịghị ọzọ ma e wezụga otu ogbe achịcha. Nsụgharị a na-edebe echiche ahụ n’Igbo dị mfe.'
- source_word: οὐκ εἶχον μεθ’ ἑαυτῶν
  choice: ka ha ji
  rationale: N’Igbo, ‘ka ha ji’ na-egosi nke ọma na nke a bụ naanị achịcha ha nwere soro ha.
- source_word: ἐν τῷ πλοίῳ
  choice: n’ụgbọ mmiri ahụ
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi na ha na ihe ahụ nọ n’ime ụgbọ mmiri ahụ.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. ‘Naanị otu ogbe achịcha’ na-egosi ọdịiche dị n’etiti achịcha dịka nri n’ozuzu na otu ogbe a pụrụ ịgụ ọnụ.
