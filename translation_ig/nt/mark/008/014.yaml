  naturalness: 'The revised wording uses natural Standard Igbo while retaining the Greek contrast: they had forgotten to take bread, yet had only one loaf with them. “Ha enweghị achịcha ha ji n’ụgbọ mmiri ahụ, e wezụga otu ogbe achịcha” is clear and idiomatic.'
  terminology: “Achịcha” appropriately conveys bread as provisions, while “otu ogbe achịcha” preserves the singular, countable loaf. The footnote accurately notes the plural form ἄρτους without forcing a plural rendering into the main text.
