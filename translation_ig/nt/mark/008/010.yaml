  text: καὶ ⸀εὐθὺς ἐμβὰς εἰς τὸ πλοῖον μετὰ τῶν μαθητῶν αὐτοῦ ἦλθεν εἰς τὰ μέρη Δαλμανουθά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/010.yaml
  text: And immediately[a], getting into the boat with his disciples, he went to the region of Dalmanutha.
translation:
  language: ig
  text: Ozugbo ahụ, ya na ndị na-eso ụzọ ya, ọ banyere n’ụgbọ mmiri wee gaa n’ógbè Dalmanuta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’akụkụ Dalmanuta.” N’asụsụ Grik, e ji okwu dị n’ụdị ọtụtụ mee ihe, nke pụtara kpọmkwem “akụkụ/mpaghara Dalmanuta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: Ozugbo ahụ
  rationale: Na-egosipụta ngwa ngwa nke a na-ahụkarị n’akụkọ Mak, ma bụrụkwa okwu Igbo dị ugbu a ma doo anya.
- source_word: ἐμβὰς
  choice: banyere
  rationale: Na-egosipụta omume ịbanye n’ụgbọ mmiri nke mere tupu ngwaa bụ isi; nhazi ahịrịokwu Igbo na-ejikọta ya n'ụzọ ebumpụta ụwa.
- source_word: πλοῖον
  choice: ụgbọ mmiri
  rationale: Kwesịrị ekwesị maka obere ụgbọ e ji aga n’elu Oké Osimiri Galili, ma bụrụ okwu ndị Igbo na-aghọta nke ọma.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: ya na ndị na-eso ụzọ ya
  rationale: Na-egosipụta mkpakọrịta nke μετά na genitive n’Igbo ebumpụta ụwa.
- source_word: ἦλθεν
  choice: gaa
  rationale: N’akụkọ njem a, ọ na-egosi ịga n’ebe a kpọrọ aha; “gaa” bụ okwu Igbo kacha kwekọọ n’echiche ahụ.
- source_word: τὰ μέρη
  choice: ógbè
  rationale: Ọ bụ ezie na Grik ji ụdị ọtụtụ mee ihe, nkebiokwu ahụ na-ezo aka n’otu mpaghara ma ọ bụ distrikti; “ógbè” na-enye echiche ahụ n’Igbo doro anya.
- source_word: Δαλμανουθά
  choice: Dalmanuta
  rationale: A sụgharịghị aha ebe ahụ; e dere ya n’ụdị kwekọrọ n’usoro mkpụrụokwu na mkpọpụta Igbo.
