translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ọsọ akụkọ Mak site n’okwu “Ozugbo ahụ,” ma jiri nhazi ahịrịokwu Igbo ebumpụta ụwa.
