  yaml_path: translation/nt/mark/008/016.yaml
  text: And they were discussing with one another that they had no bread[a].
translation:
  language: ig
  text: Ha wee na-ekwurịta n’etiti onwe ha na ha enweghị achịcha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kwekọrọ kpọmkwem n’asụsụ Grik, “ha enweghị ogbe achịcha dị iche iche.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διελογίζοντο
  choice: na-ekwurịta
  rationale: Oge na-aga n’ihu nke ngwaa Grik a na-egosi mkparịta ụka na-aga n’ihu. “Na-ekwurịta” bụ Igbo nkịtị, doro anya, ma ọ naghị etinye echiche esemokwu nke okwu Grik ahụ anaghị achọrịrị.
- source_word: πρὸς ἀλλήλους
  choice: n’etiti onwe ha
  rationale: Nke a na-egosi na ha na ibe ha na-ekwurịta; okwu a bụ nke a na-anụkarị ma doo anya n’Igbo.
- source_word: ὅτι
  choice: na
  rationale: N’ebe a, ὅτι na-ewebata ihe ha na-ekwu maka ya, ọ bụghị ihe kpatara ya. “Na” na-egosi nke a nke ọma n’Igbo.
- source_word: ἄρτους
  choice: achịcha
  rationale: Ọ bụ ezie na okwu Grik dị n’ụdị ọtụtụ ma nwee ike ịpụta ogbe achịcha, “achịcha” bụ ụzọ dị mma ma dị mfe isi kwuo ya n’Igbo. Ihe ndị gbara amaokwu a gburugburu metụtara ogbe achịcha a pụrụ ịgụ ọnụ, ya mere e debere nke ahụ n’ala ala peeji.
- source_word: οὐκ ἔχουσιν
  choice: ha enweghị
  rationale: Nke a na-enye ihe okwu ndị na-eso ụzọ ahụ pụtara n'ụzọ eke n’Igbo, n’agbanyeghị na ngwaa Grik dị n’oge ugbu a n’okwu a kọrọ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu dee ya. A họọrọ “wee na-ekwurịta” iji gosipụta omume gara aga nke nọ na-aga n’ihu; e zere okwu ndị nwere ike ime ka ọ dị ka ha na-arụrịta ụka n’enweghị ihe akaebe doro anya.
