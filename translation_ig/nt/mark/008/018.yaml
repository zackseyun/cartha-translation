    text: Ma ọ bụ, “Ọ bụ ezie na unu nwere anya, unu anaghị aghọta? Ọ bụ ezie na unu nwere ntị, unu anaghị aghọta?” Okwu Grik ji ngwaa nkịtị pụtara “ịhụ” na “ịnụ,” ma n’ọnọdụ a ha nwekwara ike igosi nghọta ime mmụọ.
    reason: lexical_alternative
