  text: ὀφθαλμοὺς ἔχοντες οὐ βλέπετε καὶ ὦτα ἔχοντες οὐκ ἀκούετε; καὶ οὐ μνημονεύετε
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: ig
  text: Unu nwere anya, ma unu anaghị ahụ? Unu nwere ntị, ma unu anaghị anụ? Unu anaghị echeta?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: Unu nwere anya
  rationale: Nke a na-edobe okwu banyere inwe anya n'ụzọ doro anya ma dịkwa ụtọ n'Igbo; ajụjụ na-esochi ya na-eme ka echiche nkwenye megidere ọnọdụ ahụ pụta ìhè.
- source_word: βλέπετε
  choice: unu adịghị ahụ ụzọ
  rationale: “Ịhụ ụzọ” bụ okwu Igbo nkịtị maka ịhụ, ma n'ọnọdụ a ọ ka nwere ike ịpụta ịghọta n'ime mmụọ n'emeghị ka nkọwa ahụ bụrụ naanị otu.
- source_word: ὦτα ἔχοντες
  choice: Unu nwekwara ntị
  rationale: Ọ na-edobe nhazi yiri nke ahịrịokwu mbụ; “-kwa” na-egosipụta καὶ na njikọ ya.
- source_word: ἀκούετε
  choice: unu adịghị anụ ihe
  rationale: “Ịnụ ihe” na-asụgharị isi nghọta nke ngwaa ahụ kpọmkwem, ebe ọnọdụ okwu ahụ nwere ike igosi ịnụ nke na-eduga ná nghọta ma ọ bụ nrube isi.
- source_word: μνημονεύετε
  choice: Unu adịghịkwa echeta
  rationale: “Icheta” bụ okwu Igbo doro anya ma bụrụkwa nke nkịtị maka ijide ma ọ bụ ịkpọghachi ihe n'uche.
- source_word: καὶ
  choice: nwekwara / adịghịkwa
  rationale: E tinyere njikọ ahụ n'ụdị “-kwa,” nke bụ ụzọ Igbo dị mma isi chekwaa ike nchịkọta nke ajụjụ ndị a.
- source_word: οὐ / οὐκ
  choice: adịghị
  rationale: Nke a bụ ụdị ngọnarị dabara adaba n'ajụjụ nkwutọ ndị a n'Igbo.
theological_decisions:
- issue: Ma “ịhụ” na “ịnụ” bụ naanị ihe mmetụta anụ ahụ ka hà na-egosikwa nghọta ime mmụọ
  choice: E debere okwu nkịtị “ịhụ ụzọ” na “ịnụ ihe” n'ahịrịokwu bụ isi, ka ọnọdụ okwu ahụ gosipụta nghọta ime mmụọ dị n'ime ya.
  alternative: Ịsụgharị ha dịka “ịghọta” na “ịmata ihe” iji mee ka ihe atụ ime mmụọ pụta ìhè ozugbo.
  rationale: Grik ji ngwaa nkịtị maka ịhụ na ịnụ mee ihe. Idebe ha na-echekwa nkwughachi asụsụ amụma na ike ajụjụ Jizọs, n'emeghị ka otu nkọwa mechie nghọta ndị ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nhazi ajụjụ atọ na ike nkwutọ dị n'okwu Grik; e jiri “unu” mee ihe n'ihi na ngwaa Grik bụ ọtụtụ mmadụ.
