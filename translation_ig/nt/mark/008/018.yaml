- from: Unu nwere anya ma unu adịghị ahụ ụzọ?[a] Unu nwekwara ntị ma unu adịghị anụ ihe? Unu adịghịkwa echeta?
  to: Unu nwere anya, ma unu anaghị ahụ? Unu nwere ntị, ma unu anaghị anụ? Unu anaghị echeta?
  rationale: The revision removes added objects that narrow or alter the meaning, restores the direct parallelism of the Greek, and retains natural Igbo rhetorical phrasing. The footnote continues to identify the possible figurative force without imposing it on the main text.
