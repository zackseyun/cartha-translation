  text: οἱ δὲ ⸂εἶπαν αὐτῷ λέγοντες⸃ ⸀ὅτι Ἰωάννην τὸν βαπτιστήν, καὶ ἄλλοι Ἠλίαν, ἄλλοι δὲ ⸂ὅτι εἷς⸃ τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/028.yaml
  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: ig
  text: Ha sịrị ya, sị, “Jọn Onye Na-eme Baptizim; ụfọdụ na-asị, Ịlaịja; ndị ọzọkwa na-asị, otu n’ime ndị amụma.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ha
  rationale: Ọ na-ezo aka n’ebe ndị na-eso ụzọ nọ n’okwu bu ụzọ; Igbo anaghị achọ ka a tụgharịa δέ iche ebe a.
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: zara ya sị
  rationale: N’ọnọdụ ajụjụ Jizọs jụrụ n’amaokwu bu ụzọ, “zara ya sị” bụ Igbo nkịtị ma na-edobe usoro okwu mmeghe nke Grik n’enweghị ikwughachi ngwaa ahụ n’ụzọ na-adịghị eke eke.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Jọn Onye Na-eme Baptizim
  rationale: Ọ na-akọwa Jọn site n’ọrụ o ji mara, na-ezere ime aha ahụ ka ọ yie aha otu ụka.
- source_word: ἄλλοι ... ἄλλοι δὲ
  choice: ụfọdụ ... ma ndị ọzọ
  rationale: Nke a na-egosi ìgwè dị iche iche na azịza dị iche iche, ma na-eme ka ọdịiche nke δέ nke ikpeazụ pụta ìhè.
- source_word: Ἠλίαν
  choice: Ịlaịja
  rationale: Ụdị aha a bụ nke a na-ahụkarị ma ghọta n’Igbo maka onye amụma Elaịja.
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: na-asị, otu n’ime ndị amụma
  rationale: A hapụrụ “ị bụ” ka ọ bụrụ ihe a ghọtara n’ime okwu ahụ, dịka n’asụsụ Grik, ebe “na-asị” na-eme ka ndepụta ahụ doo anya n’Igbo.
- source_word: προφητῶν
  choice: ndị amụma
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka ndị na-ekwuchitere Chineke n’akụkọ Izrel.
theological_decisions:
- issue: Otu e si gosi echiche ndị mmadụ banyere onye Jizọs bụ
  choice: E gosiri ha dịka ndepụta azịza dị mkpirikpi, na-etinyeghị “ị bụ” ugboro ugboro.
  alternative: “Ha zara ya sị, ‘Ụfọdụ na-asị na ị bụ Jọn Onye Na-eme Baptizim; ụfọdụ na-asị na ị bụ Ịlaịja; ndị ọzọkwa na-asị na ị bụ otu n’ime ndị amụma.’”
  rationale: Grik hapụrụ ngwaa e chere n’uche n’ahịrị ndị na-esote. Nsụgharị a na-edobe mkpirikpi na esemokwu dị n’etiti echiche ndị mmadụ, ma ọ naghị agbakwụnye nkọwa ozizi.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Jizọs” naanị na nkọwa mkpebi, ọ bụghị n’amaokwu ahụ. A họọrọ usoro na-asụ ụtọ n’Igbo karịa ijigide nkwughachi λέγω n’ụzọ siri ike.
