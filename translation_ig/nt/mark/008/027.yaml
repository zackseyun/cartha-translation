    issue: Participial quotation introduction is slightly repetitive
    rationale: “Ọ nọ na-ajụ ... na-asị ha” is understandable, but Standard Igbo more naturally introduces the direct question with “sị ha.” This retains the source’s asking/saying construction without unnecessary repetition.
