id: MRK.8.27
reference: Mark 8:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: ig
  text: Jizọs na ndị na-eso ụzọ ya wee pụọ gaa n’obodo nta ndị dị na Sesaria Filipai. Ka ha nọ n’ụzọ, ọ nọ na-ajụ ndị na-eso ụzọ ya, sị ha, “Ònye ka ndị mmadụ[a] na-ekwu na m bụ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik e ji mee ihe ebe a pụtara “ndị mmadụ” n’ozuzu, ọ bụghị naanị ndị nwoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: wee pụọ gaa
  rationale: “Pụọ gaa” na-egosi mmegharị nke ἐξέρχομαι n’Igbo nkịtị; “wee” na-ejikọta ya nke ọma na akụkọ gara aga n’enweghị ịkọwa ebe o siri pụọ karịa ihe odide ahụ kwuru.
- source_word: κώμας
  choice: obodo nta
  rationale: κώμη na-ezo aka n’obodo nta ma ọ bụ ebe obibi na-abụghị nnukwu obodo; “obodo nta” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Sesaria Filipai
  rationale: E degharịrị aha ebe ahụ n’ụdị dabara n’usoro ụda na odide Igbo kama ịsụgharị ya dịka nkọwa.
- source_word: ἐν τῇ ὁδῷ
  choice: Ka ha nọ n’ụzọ
  rationale: Nke a na-enye echiche nke “n’ụzọ” n’Igbo dị ndụ ma na-egosikwa na ihe ahụ mere mgbe njem ahụ na-aga n’ihu.
- source_word: ἐπηρώτα
  choice: ọ nọ na-ajụ
  rationale: Ụdị a na-echekwa ọrụ na-aga n’ihu nke imperfect Greek karịa naanị “ọ jụrụ.”
- source_word: λέγων αὐτοῖς
  choice: na-asị ha
  rationale: 'A hapụrụ participle ahụ ka ọ pụta ìhè n’ụzọ Igbo sitere n’okike: “na-ajụ … na-asị ha.”'
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: Ònye ka ndị mmadụ na-ekwu na m bụ?
  rationale: Ajụjụ ahụ bụ maka onye Jizọs bụ. “Ndị mmadụ” na-anọchi ἄνθρωποι dịka mmadụ niile n’ozuzu, ọ bụghị naanị ndị nwoke, ma usoro ajụjụ ahụ bụ Igbo doro anya.
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka μαθηταί, ma “ya” na-echekwa αὐτοῦ nke pụtara ugboro abụọ.
theological_decisions:
- issue: Ojiji ἄνθρωποι dịka aha mmadụ niile n’ajụjụ Jizọs
  choice: ndị mmadụ
  alternative: ndị nwoke
  rationale: N’agbanyeghị na okwu Greek ahụ nwere ụdị ụtọasụsụ nwoke, ihe ọ pụtara ebe a bụ ọha mmadụ n’ozuzu. “Ndị mmadụ” anaghị eme ka a ghọta na ọ bụ naanị ndị nwoke ka Jizọs na-ekwu maka ha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A kpọgidere akara nkọwa [a] n’akụkụ “ndị mmadụ,” ebe nkọwa ya metụtara, kama n’akụkụ ngwaa mmegharị. A nọgidere na-edebe mmegharị akụkọ Mak na ụdị ọrụ na-aga n’ihu nke ἐπηρώτα.
