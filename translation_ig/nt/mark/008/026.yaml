  source_fidelity: Isi ederede Grik na-ekwu na o zigaara nwoke ahụ n’ụlọ ya ma machibido ya ịbanye ọbụna n’obodo nta ahụ. Nsụgharị ahụ na-edobe echiche ndị a nke ọma. Otú ọ dị, a pụrụ ịsụgharị iwu mgbochi ahụ n’ụzọ Igbo ka eke karịa, ebe a na-edobe nkwusi ike nke μηδέ.
  naturalness: “Ọbụna abanyekwala” ghọtara nke ọma, ma “Abanyela ọbụna n’obodo nta ahụ” bụ usoro iwu mgbochi Igbo Izugbe nke eke ma doo anya karịa. N’ala ala, “ekwukwala ya nye” na-enye ihe ekwuru (“ya”) nke ọdịiche ederede ahụ ekwughị kpọmkwem; “agwala onye ọ bụla” na-edobe mkpirisi na amaghị ama nke ederede ahụ.
  terminology: “obodo nta” dabara nke ọma maka κώμη; “ụlọ ya” dabara maka εἰς οἶκον αὐτοῦ. Aha ma ọ bụ okwu okpukpe pụrụ iche adịghị n’amaokwu a.
