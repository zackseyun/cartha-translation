  text: καὶ ἀπέστειλεν αὐτὸν ⸀εἰς οἶκον αὐτοῦ λέγων· Μηδὲ εἰς τὴν κώμην ⸀εἰσέλθῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: ig
  text: O wee ziga ya n’ụlọ ya[a], na-asị ya, “Abanyela ọbụna n’obodo nta ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ odide ochie gbakwụnyere, “agwala onye ọ bụla nọ n’obodo nta ahụ.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: ziga
  rationale: N’ebe a, ngwaa a pụtara na Jizọs zipụrụ nwoke ahụ ka ọ laa; “ziga” na-egosipụta nke a n’ụzọ doro anya ma ghara ịgbakwụnye echiche banyere ozi pụrụ iche.
- source_word: εἰς οἶκον αὐτοῦ
  choice: n’ụlọ ya
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi na e zipụrụ ya ebe obibi nke ya; ọ na-edobe echiche nke ịlaghachi n’ụlọ ya.
- source_word: λέγων
  choice: na-asị ya
  rationale: Ọ na-ejikọta okwu Jizọs na omume iziga nwoke ahụ, ma mee ka onye a na-agwa doo anya n’Igbo.
- source_word: Μηδὲ
  choice: Ọbụna ... -la
  rationale: 'Njikọ “ọbụna” na ụdị iwu mgbochi “abanyekwala” na-egosipụta nkwusi ike dị na μηδέ: ọ gaghịdị abanye n’obodo nta ahụ.'
- source_word: κώμην
  choice: obodo nta ahụ
  rationale: κώμη na-ezo aka n’obodo nta ma ọ bụ obere ebe mmadụ bi; “obodo nta” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: εἰσέλθῃς
  choice: abanyekwala
  rationale: Ụdị a bụ iwu mgbochi e ji Igbo nkịtị na nke ugwu kwuo, ma na-edobe echiche nke ịghara ịbanye.
theological_decisions:
- issue: Oke iwu Jizọs banyere obodo nta ahụ
  choice: E depụtara ya naanị dị ka iwu ka nwoke ahụ ghara ọbụna ịbanye n’obodo nta ahụ.
  alternative: Ụfọdụ ọdịnala ederede gbakwụnyere iwu ka ọ ghara ịgwa onye ọ bụla nọ n’obodo nta ahụ.
  rationale: Ederede SBLGNT nyere nwere naanị iwu megide ịbanye n’obodo nta ahụ; ya mere, a naghị etinye okwu sitere n’ọdịnala ederede toro ogologo n’ahụ amaokwu ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị mfe nghọta ma dịkwa ugwu. “O wee” na-aga n’ihu n’usoro akụkọ ahụ; “obodo nta ahụ” na-egosipụta ebe a kpọtụrụ aha kpọmkwem. E debere akara ntụaka [a] ozugbo n’ahụ amaokwu ahụ.
