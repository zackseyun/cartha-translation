revisions:
- from: Mgbe ọ matara nke a, ọ sịrị ha, “Gịnị mere unu ji na-ekwurịta n’etiti onwe unu na unu enweghị achịcha? Unu amatabeghị ihe ọ pụtara, unu aghọtabeghịkwa? Obi unu ò siri ike?”[a]
  to: Mgbe ọ matara nke a, ọ sịrị ha, “Gịnị ka unu na-atụle n’ihi na unu enweghị achịcha? Unu ò amatabeghị, unu aghọtabeghịkwa? Obi unu ò akpọọla nkụ?”[a]
  rationale: The revision replaces an ambiguous expression for a hardened heart with a clear, natural Igbo biblical idiom and removes an explanatory addition from the first of the paired questions. It otherwise retains the draft’s faithful treatment of Jesus’ awareness, the disciples’ discussion, and the plural/mass-noun sense of bread.
  reviewer_model: gpt-5.6-terra
