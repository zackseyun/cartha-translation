    text: 'N’asụsụ Grik, usoro okwu ya dị nso na: “Unu ò nwere obi akpọọla nkụ?”'
    reason: alternative_reading
  revision_rationale: The revision replaces an ambiguous expression for a hardened heart with a clear, natural Igbo biblical idiom and removes an explanatory addition from the first of the paired questions. It otherwise retains the draft’s faithful treatment of Jesus’ awareness, the disciples’ discussion, and the plural/mass-noun sense of bread.
