id: MRK.8.17
reference: Mark 8:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: ig
  text: Mgbe ọ matara nke a, ọ sịrị ha, “Gịnị ka unu na-atụle n’ihi na unu enweghị achịcha? Unu ò amatabeghị, unu aghọtabeghịkwa? Obi unu ò akpọọla nkụ?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, usoro okwu ya dị nso na: “Unu ò nwere obi akpọọla nkụ?”'
    reason: alternative_reading
lexical_decisions:
- source_word: γνοὺς
  choice: Mgbe ọ matara nke a
  rationale: Nkebi a na-egosi na Jizọs matara ihe ndị na-eso ụzọ ya nọ na-ekwurịta. ‘Nke a’ na-ezo aka n’ihe gbara amaokwu ahụ gburugburu ma mee ka Igbo doo anya.
- source_word: διαλογίζεσθε
  choice: na-ekwurịta n’etiti onwe unu
  rationale: Nhọrọ a na-egosi mkparịta ụka ma ọ bụ ntụgharị uche ha na-eme n’etiti onwe ha, dị ka ọnọdụ amaokwu ahụ si dị.
- source_word: ἄρτους
  choice: achịcha
  rationale: Ọ bụ ezie na okwu Grik dị n’ụdị ọtụtụ, ‘achịcha’ bụ ụzọ Igbo si ekwu ya n’ụdị nkịtị mgbe a na-ekwu banyere nri ahụ n’ozuzu ya.
- source_word: νοεῖτε
  choice: amatabeghị ihe ọ pụtara
  rationale: Nke a na-egosi ịmata ma ọ bụ ịghọta ihe ihe ịrịba ama ahụ pụtara, ma na-edobe ọdịiche dịtụ n’etiti ya na συνίετε.
- source_word: συνίετε
  choice: aghọtabeghịkwa
  rationale: ‘Ịghọta’ na-enye isi echiche nke ịghọta nke ọma, ma jikọta ya n’ụzọ ebumpụta ụwa na ajụjụ bu ya ụzọ.
- source_word: πεπωρωμένην
  choice: siri ike
  rationale: Nke a na-echekwa ihe atụ nke obi nke ghọrọ ihe na-adịghị anabata nghọta ma ọ bụ nzaghachi.
- source_word: καρδίαν
  choice: obi
  rationale: ‘Obi’ na-echekwa ihe atụ Akwụkwọ Nsọ nke mmadụ ime, gụnyere uche, nghọta, na nzaghachi ya.
theological_decisions:
- issue: Otú e si sụgharịa ajụjụ ikpeazụ banyere ọnọdụ obi ndị na-eso ụzọ
  choice: Obi unu ò siri ike?
  alternative: Unu ò nwere obi e mere ka o sie ike?
  rationale: Nhọrọ bụ isi bụ Igbo doro anya ma dị ebumpụta ụwa, ma ọ ka na-echekwa ajụjụ siri ike Jizọs jụrụ banyere ọnọdụ obi ha. Nhọrọ nke ọzọ na-esochi usoro okwu Grik nso, ma ọ na-ada arọ n’Igbo; ntụaka ala peeji na-egosi usoro ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke kwanyere ugwu ma dị mfe nghọta, dee ya. A hapụrụ ihe atụ ‘obi siri ike’ ka ọ nọgide nwee ike na ụda ịdọ aka ná ntị nke okwu mbụ.
