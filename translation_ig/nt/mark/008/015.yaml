  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: ig
  text: Ọ nọkwa na-adọ ha aka ná ntị, na-asị, “Lezienụ anya! Kpacharanụ anya maka ihe na-eko achịcha[a] nke ndị Farisii na nke Herọd.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “yist.” E debere “ihe na-eko achịcha” iji chekwaa ihe atụ Akwụkwọ Nsọ banyere mmetụta na-agbasa.
    reason: lexical_alternative
  - marker: b
    text: Nke a na-atụ aka n'ihe metụtara ndị Farisii na Herọd nke ndị na-eso ụzọ kwesịrị izere; amaokwu a akọwaghị kpọmkwem ma ọ bụ ozizi, ihu abụọ, ma ọ bụ ụdị mmetụta ọzọ. Tụlee Mat. 16:6, 12 na Luk 12:1.
    reason: cross_reference
lexical_decisions:
- source_word: διεστέλλετο
  choice: Ọ nọkwa na-adọ ha aka ná ntị
  rationale: Ụdị imperfect na-egosi ihe ọ nọ na-eme ma ọ bụ na-ekwughachi n'oge gara aga. N'ọnọdụ a, okwu ahụ bụ ịdọ aka ná ntị siri ike; ntụgharị a na-egosipụta ma ịdịgide nke omume ahụ ma ịdị arọ ya.
- source_word: λέγων
  choice: na-asị
  rationale: Nke a na-ewebata kpọmkwem ihe dị n'ịdọ aka ná ntị ahụ ma na-ada nke ọma n'Igbo.
- source_word: Ὁρᾶτε
  choice: Lezienụ anya!
  rationale: N'ebe a ọ bụghị naanị ịhụ ihe anya, kama ọ bụ ịnọ na nche. Imperative a na-ebute ịdọ aka ná ntị ahụ n'ụzọ doro anya.
- source_word: βλέπετε
  choice: Kpacharanụ anya
  rationale: E debere iwu abụọ yiri ibe ha ka ike nkwughachi dị na Grik ghara ịla n'iyi.
- source_word: ἀπὸ
  choice: maka
  rationale: Mgbe a na-ekwu maka ihe mmadụ kwesịrị ịkpachara anya banyere ya, “kpachara anya maka” bụ usoro okwu Igbo dị mma. Ọ na-egosi ihe egwu a ga-ezere, ọ bụ ezie na preposition Grik nwere isi echiche nke isi n'ebe ihe ahụ nọ pụọ.
- source_word: ζύμης
  choice: ihe na-eko achịcha
  rationale: Nke a bụ okwu ndị mmadụ na-aghọta nke na-edobe onyinyo ihe e ji eme ka ntụ ọka koo; e meghị ka ihe ọ pụtara n'ụzọ ihe atụ bụrụ naanị “ozizi,” “ihu abụọ,” ma ọ bụ “mmetụta ọjọọ.”
- source_word: Φαρισαίων
  choice: ndị Farisii
  rationale: Nke a bụ aha otu ahụ n'ụdị Igbo a na-ejikarị, ebe njikọ ya na ihe na-eko achịcha gosiri mmekọrịta.
- source_word: Ἡρῴδου
  choice: Herọd
  rationale: E debere Herọd kpọmkwem dịka ederede Grik si kwuo, n'agbasaghị ya ka ọ bụrụ ndị ụlọ ya ma ọ bụ ndị otu ndọrọ ndọrọ ọchịchị ya.
theological_decisions:
- issue: Ihe onyinyo “ihe na-eko achịcha” pụtara
  choice: Idobe ihe atụ ahụ n'ahịrịokwu bụ isi n'akọwaghị kpọmkwem ihe ọ na-anọchi anya ya
  alternative: Ịtụgharị ya ozugbo dịka “ozizi,” “ihu abụọ,” ma ọ bụ “mmetụta na-emebi emebi”
  rationale: Amaokwu a n'onwe ya akọwaghị kpọmkwem akụkụ ihe atụ ahụ Jizọs bu n'obi. Ebe amaokwu ndị yiri ya na-enyere onye na-agụ aka, ha ekwesịghị ime ka ntụgharị isi dozie ihe Mak hapụrụ ka a tụgharịa uche na ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Lezienụ anya! Kpacharanụ anya” na-edobe nkwughachi siri ike nke iwu abụọ Grik, ebe “ihe na-eko achịcha” na-echekwa ihe atụ ahụ n'enweghị ịmanye otu nkọwa.
