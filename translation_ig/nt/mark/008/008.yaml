- from: Ha niile riri nri, rijukwa afọ. Ha wee chịkọta iberibe nri ndị fọdụrụ—nkata asaa[a].
  to: Ha riri nri, afọ jukwara ha. Ha wee chịkọta nkata asaa nke iberibe nri ndị fọdụrụ[a].
  rationale: The revision removes the unneeded “niile,” uses an idiomatic Standard Igbo expression for being satisfied, and makes explicit that what was collected amounted to seven baskets of remaining fragments. The footnote remains accurate, appropriately qualified, and anchored to “nkata asaa.”
