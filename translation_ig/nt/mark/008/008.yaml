translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. E ji ahịrị ogologo (—) jikọta “nkata asaa” na iberibe nri ndị a chịkọtara, iji chekwaa usoro mkpirikpi nke Grik n’enweghị ịgbakwunye ngwaa “jupụtara,” nke adịghị n’isi mmalite.
