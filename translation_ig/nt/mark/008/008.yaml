  text: ⸂καὶ ἔφαγον⸃ καὶ ἐχορτάσθησαν, καὶ ἦραν περισσεύματα κλασμάτων ἑπτὰ σπυρίδας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/008.yaml
  text: And they ate and were satisfied[a], and they picked up seven baskets of leftover pieces.
translation:
  language: ig
  text: Ha riri nri, afọ jukwara ha. Ha wee chịkọta nkata asaa nke iberibe nri ndị fọdụrụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ σπυρίδας, nke na-ezo aka na nkata, ma eleghị anya nkata buru ibu. Mak ji okwu Grik ọzọ, κόφινοι, mee ihe n’akụkọ banyere inye puku mmadụ ise nri (6:43).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: Ha niile riri nri
  rationale: Ọ bụ ngwaa na-akọ ihe mere n’oge gara aga n’ụzọ dị mfe. Ịgbakwunye “niile” na-eme ka onye nnọchiaha ọtụtụ ahụ doo anya n’Igbo, n’enweghị ịgbakwunye echiche ọhụrụ n’akụkọ ahụ.
- source_word: ἐχορτάσθησαν
  choice: rijukwa afọ
  rationale: Nkebi okwu a bụ Igbo e ji eme ihe ugbu a maka iri nri ruo mgbe mmadụ zuru afọ; ọ na-egosi na nri zuru ha nke ọma.
- source_word: ἦραν
  choice: chịkọta
  rationale: N’ọnọdụ a, αἴρω pụtara iburu ma ọ bụ ịnakọta ihe fọdụrụ. “Chịkọta” bụ okwu Igbo dabara n’omume ahụ nke ọma.
- source_word: περισσεύματα
  choice: ndị fọdụrụ
  rationale: Nke a na-egosi ihe gafere mkpa ndị riri nri ma nọgide fọdụ mgbe ha risịrị.
- source_word: κλασμάτων
  choice: iberibe nri
  rationale: κλάσματα bụ iberibe e nyawara na nri, karịchaa achịcha. “Iberibe nri” doro ndị na-agụ akwụkwọ anya ma ghara imechi ya naanị n’achịcha karịa ka amaokwu a kwuru.
- source_word: ἑπτὰ σπυρίδας
  choice: nkata asaa
  rationale: σπυρίς bụ ụdị nkata, ma o yikarịrị ka ọ bụ nkata buru ibu. E debere “nkata” n’amaokwu ka ọ bụrụ okwu Igbo dị mfe ma doo anya, e wee kọwaa ọdịiche okwu Grik ahụ n’ala ala peeji.
