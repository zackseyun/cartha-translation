review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the few small fish, Jesus’ blessing of them, and the instruction to place them before the recipients. However, «dokwasị ... n’ihu» is less idiomatic for serving food than «dowe ... n’ihu».
  naturalness: «Dowe ... n’ihu ndị mmadụ» is clearer, natural modern Standard Igbo for setting food before people. Retaining «M̀gbe ọ gọzichara ha» appropriately expresses the antecedent participial action.
  terminology: «azụ nta ole na ole» faithfully reflects ἰχθύδια ὀλίγα. «gọzichara» is suitable for εὐλογήσας in this meal setting. No doctrinally loaded terminology is introduced.
  issues:
  - severity: low
    issue: Meal-serving verb is slightly unnatural
    rationale: «Dọkwasị» commonly evokes placing something onto/on another object. For food being presented to eaters, «dowe ... n’ihu» is the more idiomatic Standard Igbo expression and retains the sense of παρατιθέναι.
  revised_text: Ha nwekwara azụ nta ole na ole. Mgbe ọ gọzichara ha, ọ sịrị ka e dowekwa ha n’ihu ndị mmadụ.
  revised_footnotes: []
