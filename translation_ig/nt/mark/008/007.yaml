  text: καὶ εἶχον ἰχθύδια ὀλίγα· καὶ εὐλογήσας ⸀αὐτὰ εἶπεν ⸂καὶ ταῦτα παρατιθέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/007.yaml
  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: ig
  text: Ha nwekwara azụ nta ole na ole. Mgbe ọ gọzichara ha, ọ sịrị ka e dowekwa ha n’ihu ndị mmadụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰχθύδια
  choice: azụ nta
  rationale: Ụdị okwu a na-egosi azụ ndị pere mpe; “azụ nta” bụ Igbo doro anya ma na-echekwa echiche ahụ.
- source_word: ὀλίγα
  choice: ole na ole
  rationale: Nke a na-egosi na ọnụ ọgụgụ azụ ndị ahụ dị ntakịrị n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: εὐλογήσας
  choice: Mgbe ọ gọzichara
  rationale: Nke a na-egosi na ngọzi ahụ bu ụzọ mee tupu o kwuo ihe a ga-eme, ma na-anọ nso n’echiche εὐλογέω.
- source_word: αὐτά
  choice: ha
  rationale: Okwu nnọchiaha a na-ezo aka n’azụ nta ndị ahụ.
- source_word: καὶ ταῦτα
  choice: ha ... kwa
  rationale: “Kwa” na-echekwa ike mgbakwunye nke καί, ya bụ na a ga-edokwa azụ ndị a dịka nri ahụ e kwuru banyere ya na mbụ.
- source_word: παρατιθέναι
  choice: ka e dokwasị ... n’ihu ndị mmadụ
  rationale: N’ọnọdụ nri, okwu a pụtara idowe nri n’ihu ndị ga-eri ya ma ọ bụ inye ha ya. Nsụgharị a na-echekwa ihe oyiyi nke idowe nri n’ihu ha.
- source_word: εἶπεν
  choice: ọ sịrị
  rationale: Nke a bụ ntụgharị nkịtị na nke ziri ezi nke λέγω, ebe usoro “ka e...” na-egosi iwu dị n’ihe o kwuru.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu nke abụọ na-eji usoro iwu “ọ sịrị ka e...” mee ka onye na-eme ihe ghara ịbụ nke a kpọrọ aha, dịka ọ dị n’isi mmalite, ma “ndị mmadụ” na-akọwa ndị a na-edokwasị nri n’ihu ha site n’ọnọdụ akụkọ ahụ.
