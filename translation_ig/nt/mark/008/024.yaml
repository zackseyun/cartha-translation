source:
  edition: SBLGNT
  text: καὶ ἀναβλέψας ἔλεγεν· Βλέπω τοὺς ἀνθρώπους ὅτι ὡς δένδρα ὁρῶ περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: ig
  text: O leliri anya elu, sị, “Ana m ahụ ndị mmadụ, n’ihi na ana m ahụ ha dị ka osisi na-ejegharị.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψας
  choice: Mgbe o leliri anya elu
  rationale: Ọ na-egosipụta omume nke ileli anya elu n'ụzọ doro anya ma kwekọọ na usoro ahịrịokwu Grik.
- source_word: τοὺς ἀνθρώπους
  choice: ndị mmadụ
  rationale: Nke a bụ ntụgharị nkịtị na nke sara mbara maka mmadụ n’ọnụọgụ ọtụtụ.
- source_word: ὅτι
  choice: n’ihi na
  rationale: E debere njikọ nkọwa kpatara ihe dị n’akwụkwọ isi mmalite, n’agbanyeghị na okwu nwoke ahụ na-anọgide ntakịrị ihe mgbagwoju anya.
- source_word: ὡς δένδρα
  choice: ka osisi
  rationale: Na-echekwa ntụnyere ahụ kpọmkwem n’etinyeghị nkọwa na mmadụ yiri osisi n’ụdị ma ọ bụ n’ogo.
- source_word: περιπατοῦντας
  choice: ka ha na-ejegharị
  rationale: Ọ na-egosi na ndị ọ na-ahụ nọ na-agagharị, ma na-edebe participle ahụ dịka nkebiokwu omume na-aga n’ihu.
theological_decisions:
- issue: Okwu nwoke ahụ na-akọ ọhụụ ya nke na-edochaghị anya
  choice: E debere, “Ana m ahụ ndị mmadụ, n’ihi na ana m ahụ ha ka osisi, ka ha na-ejegharị.”
  alternative: “Ana m ahụ ndị mmadụ ka osisi na-ejegharị.”
  rationale: Nhọrọ a na-echekwa ma ὅτι ma nhazi okwu Grik, na-ejikọghị ‘osisi’ na ‘ijegharị’ n’ụzọ ga-eme ka nkọwa ahụ bụrụ naanị otu ihe.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu dị na ya ma dị mfe nghọta. E jighị okwu ụka pụrụ iche; e chekwara ọdịdị okwu onye ọhụụ ya ka na-edochaghị anya.
