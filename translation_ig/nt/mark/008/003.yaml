base_translation:
  language: en
  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: ig
  text: Ọ bụrụkwa na m eziga ha n’ụlọ ha ka agụụ na-agụ ha, ike ga-agwụ ha n’ụzọ[a], ma ụfọdụ n’ime ha esitela ebe dị anya bịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha ga-ada mbà n’ụzọ.” Ngwaa Grik ahụ nwere ike ịpụta na ike na-agwụ mmadụ nke ukwuu, ruo n’ókè mmadụ pụrụ ịmakpu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσω
  choice: m eziga ha
  rationale: N’ọnọdụ a, okwu ahụ pụtara ịhapụ ìgwè mmadụ ka ha laa; “eziga ha” bụ okwu Igbo doro anya nke na-adịghị ewebata echiche ịtọhapụ onye mkpọrọ.
- source_word: νήστεις
  choice: ka agụụ na-agụ ha
  rationale: Ọ bụ ezie na okwu Grik nwere ike ịpụta ịnọ n’ọnụ, ebe a ọ na-akọwa na ha eribeghị nri. Nsụgharị a bụ nke mmadụ nkịtị ga-aghọta, ọ naghịkwa eme ka ọ dị ka ibu ọnụ okpukpe.
- source_word: εἰς οἶκον αὐτῶν
  choice: n’ụlọ ha
  rationale: Nke a na-egosi na onye ọ bụla ga-alaghachi n’ụlọ nke ya, dị ka okwu Grik si kwuo n’ụzọ nkesa.
- source_word: ἐκλυθήσονται
  choice: ike ga-agwụ ha
  rationale: Ngwaa ahụ na-egosi ịda mbà ma ọ bụ ịbụ onye ike gwụrụ nke ukwuu. “Ike ga-agwụ ha” bụ Igbo eke nke na-echekwa ihe okwu ahụ pụtara n’ebughị ụzọ kpebie na ha ga-amakpu kpamkpam.
- source_word: ἐν τῇ ὁδῷ
  choice: n’ụzọ
  rationale: Nke a bụ ụzọ dị mkpirikpi ma bụrụkwa nke e ji ekwu maka ihe ga-eme n’oge njem.
- source_word: καί τινες αὐτῶν
  choice: ụfọdụ n’ime ha esikwa
  rationale: “Ụfọdụ n’ime ha” na-egosi otu akụkụ nke ìgwè ahụ, ebe “-kwa” na-echekwa njikọ καί n’ụzọ dabara adaba n’Igbo.
- source_word: ἀπὸ μακρόθεν
  choice: ebe dị anya
  rationale: N’ebe a, ọ na-ekwu maka ogologo ebe ụfọdụ n’ime ha siri mee njem, ọ bụghị nanị ebe ha nọ ugbu a.
- source_word: ἥκασιν
  choice: esikwa ... bịa
  rationale: Ụdị a na-egosi na ha esitela n’ebe dị anya bịa ma nọkwa ebe ahụ ugbu a, nke kwekọrọ n’ụdị perfect nke Grik.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro echiche Grik, ma e mere ya ka ọ na-ada nke ọma n’Igbo. E tinyere akara nkọwa [a] kpọmkwem n’ebe okwu ἐκλυθήσονται dị, n’ihi na nkọwa ahụ metụtara adịghị ike ma ọ bụ ịda mbà, ọ bụghị ‘ụlọ ha.’
