  text: καὶ αὐτὸς ⸂ἐπηρώτα αὐτούς⸃· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸀ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ· Σὺ εἶ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: ig
  text: Ya onwe ya nọ na-ajụ ha, “Ma unu onwe unu, ònye ka unu na-ekwu na m bụ?” Pita zara ya, “Ị bụ Mesaịa ahụ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst ahụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτα
  choice: Ọ nọkwa na-ajụ
  rationale: Ụdị ngwaa imperfect na-egosi ihe na-aga n’ihu n’akụkọ ahụ; ‘nọ na-ajụ’ na-echekwa akụkụ a n’ụzọ Igbo dị ndụ. ‘-kwa’ na-anọchi καί n’usoro akụkọ.
- source_word: Ὑμεῖς δὲ
  choice: Ma unu onwe unu
  rationale: ‘Ma’ na-egosi ọdịiche δέ na-eweta, ebe ‘unu onwe unu’ na-echekwa nkwusi ike dị n’aha nnọchiaha Ὑμεῖς.
- source_word: τίνα με λέγετε εἶναι
  choice: ònye ka unu na-ekwu na m bụ?
  rationale: Nke a bụ usoro Igbo ebumpụta ụwa maka accusative na infinitive Grik, ma ọ na-echekwa ajụjụ banyere onye Jizọs bụ.
- source_word: ἀποκριθεὶς ... λέγει αὐτῷ
  choice: Pita zara ya
  rationale: A chịkọtara participle na historical present ka ha bụrụ ngwaa akụkọ oge gara aga nke na-ada nke ọma n’Igbo.
- source_word: Σὺ εἶ
  choice: Ị bụ
  rationale: Nke a na-enye nkwupụta ahụ kpọmkwem n’enweghị itinye nkwusi ike na-adịghị mkpa.
- source_word: ὁ χριστός
  choice: Mesaịa ahụ
  rationale: Χριστός bụ aha ọkwa n’ebe a, ọ bụghị naanị aha mmadụ. ‘Mesaịa’ na-echekwa echiche onye e tere mmanụ na ntọala ndị Juu, ebe ‘ahụ’ na-egosipụta article ὁ na aha ọkwa a.
theological_decisions:
- issue: Nsụgharị Χριστός dị ka aha ọkwa
  choice: Mesaịa ahụ
  alternative: Kraịst ahụ
  rationale: Nkwupụta Pita ji Χριστός mee ihe dị ka aha ọkwa a tụrụ anya ya. ‘Mesaịa’ na-ebupụta ihe aha ọkwa ahụ pụtara na ọnọdụ ndị Juu; e debere ‘Kraịst’ n’okpuru peeji dị ka nsụgharị ọdịnala a maara nke ọma.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Unu onwe unu’ na-eme ka ọdịiche ajụjụ Jizọs pụta ìhè, ebe usoro ‘ònye ka unu na-ekwu na m bụ?’ bụ okwu Igbo ebumpụta ụwa.
