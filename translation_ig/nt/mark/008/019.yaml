id: MRK.8.19
reference: Mark 8:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτε τοὺς πέντε ἄρτους ἔκλασα εἰς τοὺς πεντακισχιλίους, πόσους κοφίνους ⸂κλασμάτων πλήρεις⸃ ἤρατε; λέγουσιν αὐτῷ· Δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: ig
  text: “Mgbe m nyawara ogbe achịcha ise ahụ nye puku mmadụ ise ahụ[a], nkata ole jupụtara n’iberibe achịcha[b] ka unu chịkọtara[c]?” Ha sịrị ya, “Iri na abụọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “puku ise ahụ.” N’ihi na okwu Grik ahụ dị n’ụdị nwoke, a pụkwara ịsụgharị ya “puku ndị ikom ise ahụ.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ “iberibe.” Okwu Grik ahụ na-ekwu banyere iberibe fọdụrụ n’ogbe achịcha ndị ahụ a nyawara.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ “ka unu buliri” ma ọ bụ “ka unu wepụrụ.” N’ọnọdụ a, ọ pụtara ịchịkọta ihe fọdụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε
  choice: Mgbe
  rationale: Ọ na-ewebata nkebiokwu oge ma na-ezo aka n’oge Jizọs nyere ìgwè mmadụ nri.
- source_word: τοὺς πέντε ἄρτους
  choice: ogbe achịcha ise ahụ
  rationale: ἄρτος bụ achịcha a pụrụ ịgụta ọnụ n’akụkọ a; “ogbe achịcha” na-egosi nke a nke ọma n’Igbo.
- source_word: ἔκλασα
  choice: m nyawara
  rationale: κλάω pụtara ịnyawa achịcha; okwu a na-edobe ihe Jizọs mere n’ụzọ doro anya.
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: nye puku mmadụ ise ahụ
  rationale: εἰς n’ebe a na-egosi ndị e nyere achịcha ahụ. “Puku mmadụ ise” bụ Igbo dị mfe ma ọ naghị etinye “ndị ikom” n’ahịrịokwu bụ isi karịa ka okwu ahụ si dị mkpa.
- source_word: κοφίνους
  choice: nkata
  rationale: κόφινος bụ ụdị nkata; “nkata” bụ okwu Igbo doro anya, ebe nkọwa banyere nha ya adịghị mkpa n’amaokwu a.
- source_word: κλασμάτων πλήρεις
  choice: juputara n’iberibe achịcha
  rationale: Nke a na-egosi na nkata ndị ahụ jupụtara n’iberibe sitere n’achịcha ahụ a nyawara.
- source_word: ἤρατε
  choice: unu chịkọtara
  rationale: Ọ bụ ezie na αἴρω nwere ike ịpụta ibuli ma ọ bụ iwepụ, n’ọnọdụ a ọ na-ekwu maka ịchịkọta iberibe achịcha fọdụrụ.
- source_word: λέγουσιν αὐτῷ
  choice: Ha sịrị ya
  rationale: A tụgharịrị present akụkọ Grik a n’oge gara aga ka ọ bụrụ Igbo akụkọ dị ire ma kwekọọ n’ihe gbara ya gburugburu.
- source_word: Δώδεκα
  choice: Iri na abụọ
  rationale: Azịza ọnụọgụ kpọmkwem; ọ dịghị mkpa ikwughachi “nkata” n’ihi na ihe ọ na-ezo aka na ya doro anya.
theological_decisions:
- issue: Ma πεντακισχιλίους ọ na-ekwu kpọmkwem banyere ndị ikom ma ọ bụ ìgwè mmadụ ahụ n’ozuzu
  choice: puku mmadụ ise ahụ
  alternative: puku ndị ikom ise ahụ
  rationale: Ụdị okwu Grik ahụ bụ oke, ma n’amaokwu a ọ bụ aha e ji echeta ìgwè mmadụ ahụ e nyere nri. Nsụgharị bụ isi anaghị ekwusi ike na ha niile bụ ndị ikom, ma ihe odide ala peeji na-edobe ohere ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ogbe achịcha,” “nkata,” na “iberibe achịcha” na-eme ka ihe ndị a na-ahụ anya n’akụkọ ahụ doo anya, ebe a hapụrụ nkọwa gbasara ma puku ise ahụ bụ kpọmkwem ndị ikom n’ihe odide ala peeji.
