id: MRK.11.13
reference: Mark 11:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: ig
  text: Mgbe ọ hụrụ otu osisi fig n'ebe dị anya nke nwere akwụkwọ, ọ gakwuuru ya ịhụ ma eleghị anya ọ ga-ahụ ihe ọ bụla n'elu ya. Ma mgbe ọ bịaruru ya, ọ hụghị ihe ọ bụla ma e wezụga akwụkwọ, n'ihi na ọ bụghị oge mkpụrụ fig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ihi na ọ bụghị oge fig.”
    reason: Nhọrọ ọzọ dị nkenke maka “oge mkpụrụ fig,” nke na-edobe echiche Grik ahụ banyere oge fig.
lexical_decisions:
- source_word: ἰδὼν
  choice: Ọ hụrụ
  rationale: A sụgharịrị participle a n’ụzọ na-egosi ihe mere n’otu usoro, jiri “wee” jikọta ya na omume sochirinụ n’Igbo dị ire.
- source_word: συκῆν
  choice: otu osisi fiig
  rationale: “Osisi fiig” bụ aha doro anya ma dị mfe nghọta maka osisi ahụ n’Igbo nke oge a.
- source_word: ἀπὸ μακρόθεν
  choice: site n’ebe dị anya
  rationale: Nke a na-edobe echiche gbasara ebe ọ nọ mgbe ọ hụrụ osisi ahụ.
- source_word: ἔχουσαν φύλλα
  choice: nke nwere akwụkwọ
  rationale: Nke a na-agbaso okwu Grik ahụ kpọmkwem n’enweghị ịgbakwunye na akwụkwọ ahụ juru osisi ahụ.
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: wee gakwuuru ya ka ọ hụ ma eleghị anya ọ ga-ahụ ihe ọ bụla n’elu ya
  rationale: “Ka ọ hụ” na-egosi nzube, ebe “ma eleghị anya” na-echekwa ejighị n’aka dị na εἰ ἄρα.
- source_word: ἐν αὐτῇ
  choice: n’elu ya
  rationale: Ọ bụ ụzọ Igbo si ekwu n’ụzọ ebumpụta ụwa banyere mkpụrụ dị n’osisi, n’agbanyeghị na ἐν pụtara “n’ime” n’ụzọ nkịtị.
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: mgbe ọ bịaruru ya nso
  rationale: Nke a na-enye echiche nke ịgakwuru osisi ahụ n’Igbo dị mfe ma dị ire.
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: ọ hụghị ihe ọ bụla ma e wezụga akwụkwọ
  rationale: 'Nke a na-echekwa nkwuwa okwu ahụ: ọ dịghị ihe ọzọ ọ hụrụ karịa akwụkwọ.'
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: n’ihi na mgbe ahụ abụghị oge mkpụrụ fiig
  rationale: Nke a na-asụgharị okwu nkọwa ahụ ozugbo ma ghara ịkọwa ihe kpatara Jizọs ji chọọ mkpụrụ n’oge ahụ.
theological_decisions:
- issue: Ike nkọwa nke ahịrịokwu banyere oge mkpụrụ fiig
  choice: 'E debere ya dịka nkọwa onye na-akọ akụkọ: “n’ihi na mgbe ahụ abụghị oge mkpụrụ fiig.”'
  alternative: Ịgbasa okwu ahụ site n’ịkọwa usoro osisi fiig si amị mkpụrụ ma ọ bụ ihe mere e ji tụọ anya ịhụ mkpụrụ.
  rationale: Okwu Grik ahụ hapụrụ esemokwu dị n’etiti ịchọ mkpụrụ na nkọwa na ọ bụghị oge mkpụrụ fiig; nsụgharị ahụ ekwesịghị idozi esemokwu a site n’ịgbakwunye nkọwa na-adịghị na isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “fiig” dịka mkpụrụokwu mbịarambịa e dere n’usoro ụda Igbo; ahịrịokwu ahụ na-anọgide nso n’ihe Grik kwuru ma na-asọkwa nke ọma n’Igbo.
