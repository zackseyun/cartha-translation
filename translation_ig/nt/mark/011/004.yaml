    rationale: Although “hụ” can occasionally be acceptable in context, εὗρον directly means “found.” “Chọta” better preserves the source verb’s meaning and the narrative action.
  - severity: low
    issue: Spatial phrasing and clause flow
    rationale: Reordering to “n'akụkụ ọnụ ụzọ, n'èzí n'okporo ụzọ[a]” more naturally presents the location while preserving the source phrase’s attachment ambiguity, which the footnote documents.
