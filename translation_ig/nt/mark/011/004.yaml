  source_fidelity: A safe revision is needed. εὗρον is more precisely rendered by “chọta” (“found”) than by “hụ” (“saw”). The revised placement of the spatial phrases keeps the Greek’s deliberately somewhat flexible relationship between “outside” and “on the street,” with the alternative retained in the footnote.
  naturalness: 'The revised sequence is natural Standard Igbo narrative: “Ha wee pụọ, wee chọta …, wee tọpụ ya.” It also avoids the slightly abrupt coordination of “pụọ, hụ.”'
  terminology: “Nwa ịnyịnya” suitably renders the non-specific πῶλον (“colt/young animal”) without importing “ịnyịnya ibu” (donkey) into this verse. “E kegidere” and “tọpụ” clearly express the tied state and the act of untying.
