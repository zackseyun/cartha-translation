  text: ⸂καὶ ἀπῆλθον⸃ καὶ εὗρον πῶλον δεδεμένον ⸀πρὸς θύραν ἔξω ἐπὶ τοῦ ἀμφόδου, καὶ λύουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/004.yaml
  text: And they went away and found a colt tied at a door outside on the street[a], and they untied it.
translation:
  language: ig
  text: Ha wee pụọ, wee chọta nwa ịnyịnya e kegidere n'akụkụ ọnụ ụzọ, n'èzí n'okporo ụzọ[a], wee tọpụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'akụkụ ọnụ ụzọ dị n'èzí n'okporo ụzọ.” Akpaokwu Grik ahụ nwere ike igosi ọnọdụ ebe ahụ n'ụzọ abụọ dịtụ iche.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: ha wee pụọ
  rationale: Ọ na-egosi na ha hapụrụ ebe Jizọs nyere ha ntụziaka; “pụọ” na-echekwa echiche nke isi n'ebe ahụ pụọ ma bụrụkwa Igbo nkịtị.
- source_word: εὗρον
  choice: hụ
  rationale: N'akụkọ a, “hụ” bụ ụzọ Igbo dị mfe ma kwekọọ n'echiche nke ịchọta ihe ha gara ịchọ.
- source_word: πῶλον
  choice: nwa ịnyịnya
  rationale: πῶλος pụtara nwa anụmanụ nke ezinụlọ ịnyịnya; amaokwu a n'onwe ya ekwughị kpọmkwem na ọ bụ ịnyịnya ibu, ya mere a zere ịkọwapụta ihe Grik ahụ na-akọwaghị n'ebe a.
- source_word: δεδεμένον
  choice: e kegidere
  rationale: Ọ na-egosi ọnọdụ nwa ịnyịnya ahụ nọ na ya mgbe ha hụrụ ya; “e kegidere” bụ okwu doro anya ma kwekọọ n'ọnọdụ a.
- source_word: πρὸς θύραν
  choice: n'akụkụ ọnụ ụzọ
  rationale: πρός ebe a na-egosi ịdị nso n'ọnụ ụzọ; “n'akụkụ ọnụ ụzọ” bụ Igbo e ji eme ihe ma na-echekwa echiche ahụ.
- source_word: ἔξω
  choice: n'èzí
  rationale: Ọ na-egosi na ebe ahụ dị n'èzí, ọ bụghị n'ime ụlọ.
- source_word: ἐπὶ τοῦ ἀμφόδου
  choice: n'okporo ụzọ
  rationale: ἄμφοδον nwere ike ịpụta okporo ụzọ, ụzọ nta, ma ọ bụ oghere a na-agafe agafe; “n'okporo ụzọ” dabara n'okwu a, ebe e debere nkọwa ọzọ n'ala ala peeji.
- source_word: λύουσιν αὐτόν
  choice: ha wee tọpụ ya
  rationale: Ọ bụ ezie na Grik ji oge ugbu a nke akụkọ, oge gara aga na-aga nke ọma n'akụkọ Igbo; “tọpụ” na-akọwa iwepụ ihe e ji kee ya n'ụzọ nkịtị.
theological_decisions: []
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị mfe ma dị ùgwù. A hapụrụ πῶλον ka ọ bụrụ “nwa ịnyịnya” kama ịsị kpọmkwem “nwa ịnyịnya ibu,” n'ihi na amaokwu a n'onwe ya anaghị akọwapụta ụdị anụmanụ ahụ karịa nke ahụ; akara ala ala peeji [a] dị n'ahịrị isi dịka achọrọ.
