  verdict: revise
  source_fidelity: A chọrọ mmezi nta iji mee ka usoro mmegharị ahụ na nkebiokwu oge kwekọọ nke ọma na Grik. «Ọ banyere na Jerusalem, banye n’ime...» adịghị edo anya n’Igbo, ebe «oge agaworịala» anaghị akọwa kpọmkwem na ụbọchị eruola mgbede/chi ejiziwo. Nsụgharị e degharịrị na-edobe na Jizọs banyere Jerusalem, gaa n’ogige ụlọ nsọ, legharịa anya n’ihe niile, ma pụọ n’ihi na chi ejiziworị.
  naturalness: «Ọ banyere Jerusalem, gaa n’ogige ụlọ nsọ ahụ» bụ Igbo Izugbe dị ire karịa nrụpụta «Ọ banyere na Jerusalem, banye n’ime mpaghara...». «Mgbe o legharịrị anya hụ ihe niile» na-ekwu ihe περιβλεψάμενος πάντα pụtara n’ụzọ nkịtị na nke doro anya. «N’ihi na chi ejiziworị» bụ ụzọ eke e si akọwa na oge eruola mgbede.
  terminology: «Ogige ụlọ nsọ ahụ» na-egosi ἱερόν dị ka ogige/ebe ụlọ nsọ dum dị, ọ bụghị ναός, ya bụ ime ụlọ nsọ. «ndị iri na abụọ ahụ» na-adị mma ma na-edobe nkọwa Grik ahụ n’enweghị ịmanye aha ọkwa.
