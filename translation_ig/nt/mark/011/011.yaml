  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: ig
  text: Ọ banyere Jerusalem, gaa n’ogige ụlọ nsọ ahụ[a]. Mgbe o legharịrị anya hụ ihe niile, n’ihi na chi ejiziworị[b], ya na ndị iri na abụọ ahụ[c] wee pụọ gaa Betani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “mpaghara ụlọ nsọ” ma ọ bụ naanị “ụlọ nsọ.” Okwu Grik a na-ezo aka n’ogige na mpaghara ụlọ nsọ dum, ọ bụghị kpọmkwem n’ime ebe nsọ ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “n’ihi na oge eruola mgbede” ma ọ bụ “ebe ọ bụ na chi ejiziworị.”
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, ndị na-eso ụzọ Jizọs iri na abụọ.
    reason: cross_reference
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: Ọ banyere
  rationale: Ngwaa a na-egosi ịbanye; “banyere” bụ okwu Igbo doro anya ma na-edobe ngagharị akụkọ ahụ.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Nke a bụ aha obodo ahụ nke a na-eji n’Igbo n’ụdị a maara nke ọma.
- source_word: τὸ ἱερόν
  choice: mpaghara ụlọnsọ ukwu
  rationale: ἱερόν na-ezo aka n’ebe niile nke ụlọ nsọ ahụ dị, ọ bụghị naanị ime ụlọ nsọ kachasị nsọ; “mpaghara ụlọnsọ ukwu” na-egosipụta obosara ebe ahụ.
- source_word: περιβλεψάμενος
  choice: Mgbe o lechara ... gburugburu
  rationale: Nke a na-egosi na ọ tụgharịrị lee ihe ndị gbara ya gburugburu; “mgbe o lechara” na-edobekwa usoro omume ndị ahụ.
- source_word: πάντα
  choice: ihe niile
  rationale: Nke a na-edobe nghọta zuru ezu nke okwu Grik ahụ n’enweghị ịgbakwụnye ihe a na-akọwaghị.
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: ebe oge agaworịala
  rationale: Nkebiokwu a na-egosi ọnọdụ oge, ma pụkwara ịkọwa ihe mere o ji pụọ; nsụgharị a na-edobe ike oge na ihe kpatara omume ahụ n’ụzọ Igbo dị ndụ.
- source_word: ἐξῆλθεν
  choice: wee pụọ gaa
  rationale: “Pụọ” na-edobe echiche nke isi n’ebe ahụ pụọ, ebe “gaa” na-ejikọta ya nke ọma na ebe ọ na-aga, bụ Betani.
- source_word: Βηθανίαν
  choice: Betani
  rationale: Nke a bụ nsụgharị mkpụrụokwu aha obodo ahụ n’ụdị Igbo a na-aghọta ngwa ngwa.
- source_word: μετὰ τῶν δώδεκα
  choice: ya na ndị iri na abụọ ahụ
  rationale: Nke a na-edobe ọnụọgụ ahụ dịka Grik si kwuo ya, ma “ahụ” na-egosi na ọ bụ ìgwè a maara ama ka a na-ekwu maka ya, n’enweghị ime ya aha ọkwa.
theological_decisions:
- issue: Ihe τὸ ἱερόν na-ezo aka na ya
  choice: mpaghara ụlọnsọ ukwu, ya bụ, ebe niile gbara ụlọ nsọ ahụ gburugburu
  alternative: ụlọ nsọ
  rationale: Okwu Grik bụ ἱερόν, nke na-adịkarị iche na ναός, ime ebe nsọ ahụ. Nhọrọ a na-ezere ime ka ndị na-agụ ya chee na Jizọs banyere n’ime ebe nsọ nke naanị ndị nchụàjà nwere ike ịbanye.
- issue: Ụdị e si kpọọ τῶν δώδεκα
  choice: ndị iri na abụọ ahụ
  alternative: Ndị Iri na Abụọ
  rationale: Grik ahụ nyere naanị ọnụọgụ e ji dochie aha. Ide ya dịka okwu nkịtị na-edobe nke ahụ, ebe “ahụ” na-eme ka o doo anya na ọ bụ ìgwè ndị amaara ama.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. Ahịrịokwu ahụ na-edobe usoro ngagharị sitere na Jerusalem banye n’ebe ụlọnsọ ukwu ahụ dị, lee gburugburu, wee pụọ gaa Betani. E doziri akara nkọwa ala peeji ka [a] soro “mpaghara ụlọnsọ ukwu,” [b] soro okwu gbasara oge, [c] soro “ndị iri na abụọ ahụ,” dịka ọdịnaya nkọwa nke ọ bụla si dị.
