revisions:
- from: Ndị na-aga n'ihu na ndị na-eso ha nọ na-eti mkpu,[a][b] sị, “Hosana! Onye a gọziri agọzi ka ọ bụ, bụ onye na-abịa n'aha Onyenwe anyị!”
  to: Ndị na-aga n'ihu na ndị na-eso n'azụ nọ na-eti mkpu,[a][b] sị, “Hosana! Ngọzi dịrị onye na-abịa n'aha Onyenwe anyị!”
  rationale: The revision removes an unintended pronoun object, uses a natural Standard Igbo biblical benediction for the passive blessing formula, and strengthens the wording of the Psalm cross-reference. It retains the Greek ambiguity regarding whom the trailing crowd follows and does not add a messianic title.
