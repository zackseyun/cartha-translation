  text: καὶ οἱ προάγοντες καὶ οἱ ἀκολουθοῦντες ⸀ἔκραζον· Ὡσαννά· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: ig
  text: Ndị na-aga n'ihu na ndị na-eso n'azụ nọ na-eti mkpu,[a][b] sị, “Hosana! Ngọzi dịrị onye na-abịa n'aha Onyenwe anyị!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosana” bụ mkpu ofufe sitere n'asụsụ Hibru/Arameik, nke pụtara ihe dịka “biko, zọpụta” ma ọ bụ “zọpụta ugbu a”; ma n'ebe a, ọ na-arụkwa ọrụ dị ka mkpu otuto.
    reason: lexical_alternative
  - marker: b
    text: Okwu otuto a na-ekwughachi Abụ Ọma 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: ndị na-aga n'ihu
  rationale: Na-egosi ìgwè ndị nọ n'ihu Jizọs n'usoro njem ahụ, ma na-echekwa omume na-aga n'ihu nke participle dị na Grik.
- source_word: οἱ ἀκολουθοῦντες
  choice: ndị na-eso ha
  rationale: Na-egosi ndị nọ n'azụ na-eso Jizọs na ìgwè ahụ; ọ dabara n'ụzọ okike na Igbo ma nọgide na-enwe nhazi ya na okwu bu ya ụzọ.
- source_word: ἔκραζον
  choice: nọ na-eti mkpu
  rationale: Imperfect ahụ na-egosi mkpu a na-aga n'ihu ma ọ bụ a na-eme ugboro ugboro; nkebi a na-echekwa echiche ahụ.
- source_word: Ὡσαννά
  choice: Hosana
  rationale: E debere okwu ofufe Hibru/Arameik ahụ n'ụdị ntụgharị mkpụrụokwu, n'ihi na n'ọnọdụ a ọ bụ ma arịrịọ maka nzọpụta ma mkpu otuto.
- source_word: Εὐλογημένος
  choice: Onye a gọziri agọzi ka ọ bụ
  rationale: Na-echekwa usoro ngọzi na ntughari uche nke Abụ Ọma 118:26, n'enweghị ịgbanwe ya ka ọ bụrụ naanị otuto ma ọ bụ ihu ọma.
- source_word: ὁ ἐρχόμενος
  choice: onye na-abịa
  rationale: Na-atụgharị articular present participle n'ụzọ Igbo doro anya, n'etinyeghị aha Mesaya nke na-adịghị n'okwu Grik n'onwe ya.
- source_word: ἐν ὀνόματι κυρίου
  choice: n'aha Onyenwe anyị
  rationale: Na-echekwa akpaalaokwu Akwụkwọ Nsọ nke na-egosi ịbịa n'okpuru ikike ma ọ bụ dịka onye nnọchi anya Onyenwe anyị.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ ntụgharị Igbo a na-ejikarị eme ihe maka κύριος n'okwu Akwụkwọ Nsọ a.
theological_decisions:
- issue: Ma a ga-eme ka njirimara Mesaya pụta ìhè n'okwu otuto ahụ
  choice: E debere, “onye na-abịa n'aha Onyenwe anyị,” n'etinyeghị “Mesaya” ma ọ bụ “eze.”
  alternative: “Mesaya nke na-abịa n'aha Onyenwe anyị” ma ọ bụ “Eze nke na-abịa n'aha Onyenwe anyị.”
  rationale: Ọnọdụ ahụ nwere ihe ọ pụtara gbasara Mesaya, ma okwu Grik a ekwughị aha ahụ kpọmkwem. Ichekwa okwu yiri nke Abụ Ọma 118:26 na-eme ka ike nkà mmụta okpukpe ya dịgide n'enweghị mgbakwunye nkọwa.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “nọ na-eti mkpu” iji gosi omume na-aga n'ihu; e debere “Hosana” dịka okwu ofufe, tinyekwa nkọwa ya n'ala peeji. Akara ala peeji abụọ ahụ dị n'isiokwu n'usoro [a][b].
