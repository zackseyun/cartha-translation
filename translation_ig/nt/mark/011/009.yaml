review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the two groups before and behind, the imperfect sense of their repeated shouting, the retained liturgical cry «Hosana», and the Psalm-like blessing. However, «ndị na-eso ha» means ‘those following them’ and can wrongly make the group ahead the object of following; the Greek leaves the object implicit. The benediction «Onye a gọziri agọzi ka ọ bụ, bụ onye...» is also unnecessarily cumbersome and less idiomatic than an Igbo benedictory formulation.
  naturalness: «Ndị na-aga n'ihu na ndị na-eso n'azụ» is clear, balanced Standard Igbo and naturally depicts the two parts of the crowd. «Ngọzi dịrị onye na-abịa n'aha Onyenwe anyị!» is a natural elevated biblical acclamation.
  terminology: «Hosana», «Onyenwe anyị», and «n'aha» appropriately preserve established biblical and liturgical terminology. The Psalm footnote is revised to state a direct echo rather than merely a similarity of ideas.
  issues:
  - severity: medium
    issue: «ndị na-eso ha» introduces an unsuitable pronoun reference.
    rationale: In ordinary Igbo, «ha» points to the preceding people (‘those going ahead’), whereas οἱ ἀκολουθοῦντες simply identifies the people following, with Jesus/processional context understood but not explicitly supplied.
  - severity: medium
    issue: The wording of the blessing is syntactically heavy and weakly idiomatic.
    rationale: «Onye a gọziri agọzi ka ọ bụ, bụ onye na-abịa...» redundantly combines demonstrative and relative structures. A conventional benedictory expression conveys Εὐλογημένος naturally without adding interpretation.
  - severity: low
    issue: The cross-reference footnote understates the verbal/scriptural echo.
    rationale: «na-emegharị echiche dị na» means it reprises an idea, while the acclamation closely echoes Psalm 118:26.
  revised_text: Ndị na-aga n'ihu na ndị na-eso n'azụ nọ na-eti mkpu,[a][b] sị, “Hosana! Ngọzi dịrị onye na-abịa n'aha Onyenwe anyị!”
  revised_footnotes:
