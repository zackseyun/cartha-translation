revisions:
- from: Mgbe ọ bụla unu guzo na-ekpe ekpere, gbagharanụ onye ọ bụla ma ọ bụrụ na unu nwere ihe megide ya, ka Nna unu nke nọ n’eluigwe[a] wee gbagharakwa unu mmejọ unu.[b]
  to: Mgbe ọ bụla unu guzo na-ekpe ekpere, ọ bụrụ na unu nwere ihe ọ bụla megide onye ọ bụla, gbagharanụ ya, ka Nna unu nke nọ n’eluigwe[a] wee gbagharakwa unu mmejọ unu.[b]
  rationale: The revision moves the conditional clause before the command to forgive and adds ‘ihe ọ bụla’ and ‘ya’ to preserve the broad but conditional reference of εἴ τι ἔχετε κατὰ τινος. It also corrects the explanatory footnote on the plural ‘heavens’ so that it does not introduce an unwarranted sense of separate heavens. No doctrinal interpretation has been added.
