  text: καὶ ὅταν ⸀στήκετε προσευχόμενοι, ἀφίετε εἴ τι ἔχετε κατά τινος, ἵνα καὶ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφῇ ὑμῖν τὰ παραπτώματα ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: ig
  text: Mgbe ọ bụla unu guzo na-ekpe ekpere, ọ bụrụ na unu nwere ihe ọ bụla megide onye ọ bụla, gbagharanụ ya, ka Nna unu nke nọ n’eluigwe[a] wee gbagharakwa unu mmejọ unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, okwu Grik ahụ bụ ‘n’eluigwe’ n’ụdị ọtụtụ; n’Igbo, a na-ekwukarị ya dịka ‘n’eluigwe.’
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ‘mmejọ’ dịka ‘mmebi iwu’ ma ọ bụ ‘ịkpa ókè.’
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε
  choice: unu guzo
  rationale: Nke a na-edobe ihe oyiyi doro anya nke iguzo mgbe a na-ekpe ekpere, kama ịsụgharị ya naanị dịka ‘mgbe unu na-ekpe ekpere.’
- source_word: προσευχόμενοι
  choice: na-ekpe ekpere
  rationale: Ọ na-egosi omume na-aga n’otu oge na ‘unu guzo,’ ma bụrụkwa okwu Igbo nkịtị ma doo anya.
- source_word: ἀφίετε
  choice: gbagharanụ
  rationale: N’ọnọdụ esemokwu dị n’etiti mmadụ na mmadụ, okwu a pụtara ịgbaghara mmejọ; ụdị iwu ọtụtụ mmadụ ahụ dabara na ndị a na-agwa okwu.
- source_word: εἴ τι ἔχετε κατά τινος
  choice: onye ọ bụla ma ọ bụrụ na unu nwere ihe megide ya
  rationale: Nke a na-edobe echiche sara mbara nke τι na τινος—ihe ọ bụla megide onye ọ bụla—n’ụzọ na-ada nke ọma n’Igbo.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: Nna unu nke nọ n’eluigwe
  rationale: ‘N’eluigwe’ bụ ụzọ Igbo nkịtị e si ekwu ebe obibi Chineke; nkọwa ala peeji na-egosi na okwu Grik dị n'ụdị ọtụtụ.
- source_word: ἀφῇ
  choice: wee gbagharakwa
  rationale: ‘Wee’ na-egosi nzube e webatara site na ἵνα, ebe ‘-kwa’ na-edobe καί, ya bụ, na Nna ga-agbagharakwa ha.
- source_word: παραπτώματα
  choice: mmejọ
  rationale: ‘Mmejọ’ na-ekwupụta omume ịda iwu ma ọ bụ imejọ mmadụ, na-enweghị ime ka okwu ahụ bụrụ naanị okwu izugbe maka mmehie.
theological_decisions:
- issue: Njikọ dị n’etiti mmadụ ịgbaghara ibe ya na Chineke ịgbaghara mmadụ
  choice: A sụgharịrị ἵνα ... ἀφῇ dịka ‘ka ... wee gbagharakwa,’ nke na-edobe njikọ nzube/ntụpụta ahụ n’ụzọ kwụ ọtọ.
  alternative: Ịsụgharị ya dịka ihe akaebe nkịtị nke mgbaghara Chineke nke na-adịghị egosi njikọ ọ bụla.
  rationale: Ihe odide Grik jikọtara iwu ka mmadụ gbaghara na mgbaghara Nna ga-enye. Nsụgharị ahụ anaghị eme ka njikọ a daa mbà, ọ naghịkwa eji ozizi ọzọ akọwa ya pụọ n’ihe amaokwu ahụ kwuru.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ọnọdụ ahụ nke iguzo ekpe ekpere, iwu nke ịgbaghara, na njikọ siri ike nke ἵνα n’etinyeghị nkọwa ụka pụrụ iche.
