review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the posture of standing while praying, the imperative to forgive, the purpose linkage introduced by ἵνα, and the reciprocal force of καί in ‘gbagharakwa.’ However, its word order—‘gbagharanụ onye ọ bụla ma ọ bụrụ na...’—can be read as an unconditional command to forgive every person, with the condition appended afterward. Reordering the condition first better represents εἴ τι ἔχετε κατὰ τινος: ‘if you have anything against anyone, forgive [that person].’'
  naturalness: The register is clear, modern Standard Igbo. ‘Mgbe ọ bụla unu guzo na-ekpe ekpere’ and ‘Nna unu nke nọ n’eluigwe’ are natural. Adding ‘ihe ọ bụla’ preserves the indefinite breadth of τί, and ‘gbagharanụ ya’ makes the intended object of forgiveness explicit and idiomatic.
  terminology: ‘Gbagharanụ’ is appropriate for ἀφίετε in this interpersonal context. ‘Mmejọ’ is a suitable rendering of παραπτώματα, though it is somewhat broader than ‘trespasses’; the footnote may offer ‘mmebi iwu’ or ‘ịkpa ókè’ as alternatives without forcing a technical distinction. The Greek plural in τοῖς οὐρανοῖς should not be described as ‘eluigwe dị iche iche,’ which suggests distinct heavens rather than simply a plural form.
  issues:
  - severity: medium
    issue: The conditional grievance clause is placed after ‘forgive everyone.’
    rationale: 'The current syntax can imply ‘forgive everyone, if you have something against him,’ rather than the source’s conditional instruction: if a grievance exists against anyone, forgive that person. Reordering preserves the scope of εἴ τι ... κατά τινος.'
  - severity: medium
    issue: Footnote a glosses the Greek plural as ‘n’eluigwe dị iche iche.’
    rationale: ‘Dị iche iche’ adds the idea of differing or separate heavens, which the Greek plural does not itself assert. The note should identify it simply as a plural form.
  revised_text: Mgbe ọ bụla unu guzo na-ekpe ekpere, ọ bụrụ na unu nwere ihe ọ bụla megide onye ọ bụla, gbagharanụ ya, ka Nna unu nke nọ n’eluigwe[a] wee gbagharakwa unu mmejọ unu.[b]
