  to: Ụfọdụ n’ime ndị guzo n’ebe ahụ nọ na-ajụ ha, “Gịnị ka unu na-eme, na-atọpụ nwa anụmanụ ahụ?”
  rationale: The revision preserves the Greek term's non-specific wording rather than identifying the animal as a donkey in the main text. The footnote transparently gives the lexical range and the contextual indication, without treating that indication as part of the verse's explicit wording.
