review_pass:
  verdict: revise
  source_fidelity: The clause structure, indefinite 'some,' local participial phrase, addressees, direct question, and ongoing past sense are conveyed well. However, 'nwa ịnyịnya ibu ahụ' explicitly identifies the animal as a young donkey, whereas πῶλος in this verse is a less specific term ('colt/young animal'). The wider context may support donkey, but the verse's lexical ambiguity should be retained in the text and supplied in a note.
  naturalness: The draft is clear, natural Standard Igbo. 'nọ na-ajụ ha' works idiomatically for speakers putting this question to the disciples. The revised wording remains natural, though 'nwa anụmanụ ahụ' is necessarily broader in order not to specify an animal type absent from πῶλος itself.
  terminology: Use 'nwa anụmanụ ahụ' in the text to avoid making πῶλος explicitly a donkey. A footnote records that the Greek can mean a colt/young animal and that the narrative context points to a donkey.
  issues:
  - severity: medium
    issue: The text specifies 'nwa ịnyịnya ibu ahụ' (the young donkey).
    rationale: πῶλος can denote a colt or young animal and Mark 11:5 does not itself name the species. Rendering it explicitly as a donkey imports contextual interpretation into the verse text; this should instead be noted.
  revised_text: Ụfọdụ n’ime ndị guzo n’ebe ahụ nọ na-ajụ ha, “Gịnị ka unu na-eme, na-atọpụ nwa anụmanụ ahụ?”
  revised_footnotes:
