  text: καί τινες τῶν ἐκεῖ ἑστηκότων ἔλεγον αὐτοῖς· Τί ποιεῖτε λύοντες τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/005.yaml
  text: And some of those standing there were saying to them[a], “What are you doing, untying the colt?”
translation:
  language: ig
  text: Ụfọdụ n’ime ndị guzo n’ebe ahụ nọ na-ajụ ha, “Gịnị ka unu na-eme, na-atọpụ nwa anụmanụ ahụ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινες
  choice: Ụfọdụ
  rationale: Na-egosi otu akụkụ ndị mmadụ a na-akọwaghị kpọmkwem, dịka okwu Grik si dị.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: n’ime ndị guzo n’ebe ahụ
  rationale: Na-edobe echiche nke ndị nọ ebe ahụ guzo, ma bụrụkwa Igbo nkịtị na-aga nke ọma.
- source_word: ἔλεγον
  choice: nọ na-ajụ
  rationale: Ụdị imperfect ahụ na-egosi okwu na-aga n’ihu n’oge gara aga; ebe ọ bụ ajụjụ ka ha kwuru, ‘na-ajụ’ bụ okwu Igbo ebumpụta ụwa.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha ọtụtụ nke na-ezo aka n’ebe ndị na-eso ụzọ a na-agwa okwu nọ.
- source_word: Τί ποιεῖτε
  choice: Gịnị ka unu na-eme
  rationale: Na-asụgharị ajụjụ ahụ kpọmkwem n’etinyeghị echiche ‘gịnị mere’ nke na-adịghị n’ihe odide Grik.
- source_word: λύοντες
  choice: na-atọpụ
  rationale: N’ọnọdụ anụmanụ e kere agbụ, ‘ịtọpụ’ na-egosi nke ọma omume ịtọpụ eriri e ji kee ya.
- source_word: τὸν πῶλον
  choice: nwa ịnyịnya ibu ahụ
  rationale: πῶλος nwere ike ịpụta nwa anụmanụ, ma ọnọdụ akụkọ a na-egosi na ọ bụ nwa ịnyịnya ibu. Nhọrọ a doro onye Igbo nke oge a anya ma ghara iji okwu nwere ike ime ka a ghọta ịnyịnya nkịtị.
theological_decisions: []
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ ‘nwa ịnyịnya ibu’ ka ụdị anụmanụ ahụ doo anya n’Igbo; ya mere, enweghị mkpa itinye nkọwa ala peeji maka πῶλος.
