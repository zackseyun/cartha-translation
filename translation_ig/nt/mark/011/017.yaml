review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the two imperfect actions, the rhetorical Scripture formula, the future passive (''A ga-akpọ''), the universal scope of πᾶσιν τοῖς ἔθνεσιν (''maka mba niile''), the emphatic contrast, and the perfect-result sense of πεποιήκατε (''emeela''). The principal needed refinement is the rendering of σπήλαιον λῃστῶν: ''ọgba ndị ohi'' is a more idiomatic, established Igbo equivalent while preserving the Jeremiah allusion and allowing λῃσταί to retain its nontechnical breadth.'
  naturalness: ‘Ọ̀ bụghị na e dere ya, sị’ is understandable, but the object pronoun ‘ya’ is unnecessary and makes the citation formula less natural. ‘Ọ̀ bụghị na e dere, sị’ is concise and idiomatic. ‘Ọgba ndị ohi’ is also more natural and more recognizable than the explanatory ‘ọgba ndị na-apụnara mmadụ ihe.’
  terminology: ‘Ụlọ m,’ ‘ụlọ ekpere,’ ‘mba niile,’ and ‘emeela’ are appropriate Standard Igbo renderings. Retaining ‘ọgba ndị ohi’ in the text preserves the biblical register; the footnote can note the more explicit sense ‘ndị na-apụnara mmadụ ihe’ or ‘ndị ohi na-eji ike’ without imposing a specific political interpretation.
  issues:
  - severity: low
    issue: The formula ‘e dere ya’ is slightly redundant in this citation.
    rationale: The Greek γέγραπται is impersonal (‘it is written’). Standard Igbo naturally expresses this as ‘e dere,’ followed by ‘sị’ to introduce the citation.
  - severity: medium
    issue: ‘Ọgba ndị na-apụnara mmadụ ihe’ is overly paraphrastic in the main text.
    rationale: Although it communicates the sense, ‘ọgba ndị ohi’ is more idiomatic and preserves the compact, conventional wording of the Jeremiah 7:11 echo. The broader ‘robbers/bandits’ nuance belongs appropriately in the note.
  revised_text: Ọ na-akụziri ha ihe, na-asị ha, “Ọ̀ bụghị na e dere, sị, ‘A ga-akpọ ụlọ m ụlọ ekpere maka mba niile’?[a] Ma unu emeela ya ọgba ndị ohi.”[b]
