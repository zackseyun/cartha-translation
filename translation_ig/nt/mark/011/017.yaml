revisions:
- from: Ọ nọ na-akụziri ha ihe, na-asị ha, “Ọ̀ bụghị na e dere ya, sị, ‘A ga-akpọ ụlọ m ụlọ ekpere maka mba niile’?[a] Ma unu emeela ya ọgba ndị na-apụnara mmadụ ihe.”[b]
  to: Ọ na-akụziri ha ihe, na-asị ha, “Ọ̀ bụghị na e dere, sị, ‘A ga-akpọ ụlọ m ụlọ ekpere maka mba niile’?[a] Ma unu emeela ya ọgba ndị ohi.”[b]
  rationale: The revisions improve idiomatic Standard Igbo and retain the concise scriptural register. They do not alter aspect, tense, scope, or the intertextual echoes of Isaiah 56:7 and Jeremiah 7:11. The revised notes remain correctly anchored to ‘mba niile’ and ‘ọgba ndị ohi.’
