id: MRK.11.17
reference: Mark 11:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: ig
  text: Ọ na-akụziri ha ihe, na-asị ha, “Ọ̀ bụghị na e dere, sị, ‘A ga-akpọ ụlọ m ụlọ ekpere maka mba niile’?[a] Ma unu emeela ya ọgba ndị ohi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “maka ndị mmadụ niile.” Grik kwuru “maka mba niile,” na-ekwughachi Aịzaya 56:7 ma na-emesi ike na e bu n’obi ka ụlọ nsọ ahụ nabata ndị si ná mba niile, ọ bụghị naanị Izrel.
    reason: lexical_alternative
  - marker: b
    text: “Ọgba ndị ohi” na-ekwughachi Jeremaya 7:11. Okwu Grik ahụ nwekwara ike ịpụta “ndị na-apụnara mmadụ ihe” ma ọ bụ “ndị ohi na-eji ike” n’ọnọdụ ụfọdụ.
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν καὶ ἔλεγεν
  choice: Ọ nọ na-akụziri ha ihe, na-asị ha
  rationale: Ụdị ngwaa abụọ ahụ na-egosi omume na-aga n’ihu; nsụgharị a na-echekwa echiche na Jizọs nọgidere na-akụzi ma na-ekwu.
- source_word: Οὐ γέγραπται
  choice: Ọ̀ bụghị na e dere ya
  rationale: Nke a na-echekwa ajụjụ na-atụ anya nkwenye nakwa usoro e ji akpọtụrụ ihe e dere n’Akwụkwọ Nsọ.
- source_word: Ὁ οἶκός μου
  choice: ụlọ m
  rationale: “Ụlọ” bụ ihe okwu Grik pụtara kpọmkwem, ọ na-echekwakwa ụda okwu e hotara n’Aịzaya 56:7.
- source_word: οἶκος προσευχῆς
  choice: ụlọ ekpere
  rationale: Nke a bụ ụzọ dị mfe ma bụrụkwa nke ndị na-asụ Igbo na-aghọta nke ọma iji gosipụta ụlọ e debere maka ekpere.
- source_word: κληθήσεται
  choice: A ga-akpọ
  rationale: Ọ na-egosipụta ngwaa ọdịnihu nke onye a na-eme ihe n’ahụ ya n’ụzọ Igbo dị mma.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: maka mba niile
  rationale: “Mba niile” na-echekwa ἔθνη ma na-egosipụta na ụlọ ahụ bụ maka ndị nọ ná mba niile, dịka ihe e hotara n’Aịzaya si kwuo.
- source_word: ὑμεῖς δὲ
  choice: Ma unu
  rationale: “Ma” na-egosi ọdịiche siri ike, ebe “unu” na-echekwa nnọchiaha e mesiri ike n’ahịrịokwu Grik.
- source_word: πεποιήκατε
  choice: emeela
  rationale: Ụdị ngwaa a na-egosi ihe e mere nke nsonaazụ ya ka dị ugbu a.
- source_word: σπήλαιον λῃστῶν
  choice: ọgba ndị na-apụnara mmadụ ihe
  rationale: “Ọgba” na-echekwa ihe oyiyi nke ebe nzuzo, ebe nkọwa “ndị na-apụnara mmadụ ihe” na-enye nghọta doro anya banyere λῃσταί n’Igbo ugbu a ma na-echekwa njikọ ya na Jeremaya 7:11.
theological_decisions:
- issue: Oke zuru ụwa ọnụ nke okwu amụma ahụ
  choice: maka mba niile
  alternative: maka mmadụ niile
  rationale: Nhọrọ a na-echekwa okwu ἔθνη na nkwughachi Aịzaya 56:7, na-egosikwa na nzube ụlọ Chineke gafere naanị Izrel n’etinyeghị usoro nkà mmụta okpukpe ọzọ n’ime amaokwu ahụ.
- issue: Ihe λῃστῶν pụtara n’ebo ebubo Jizọs
  choice: ndị na-apụnara mmadụ ihe
  alternative: ndị ohi; ndị ohi na-eji ike
  rationale: Ihe e hotara na Jeremaya 7:11 na-akwado echiche ndị na-apụnara mmadụ ihe. Nhọrọ a anaghị amanye amaokwu ahụ ikwu kpọmkwem banyere ndị nnupụisi ndọrọ ndọrọ ọchịchị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E tinyere akara nkọwa [a] n’akụkụ “mba niile” na [b] n’akụkụ “ọgba ndị na-apụnara mmadụ ihe,” ebe nkọwa nke ọ bụla metụtara kpọmkwem.
