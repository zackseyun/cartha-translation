base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: ig
  text: Ha zara Jizọs, sị, “Anyị amaghị.” Jizọs wee sị ha, “Mụ onwe m agaghịkwa agwa unu ikike dị aṅaa ka m ji eme ihe ndị a.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες τῷ Ἰησοῦ λέγουσιν
  choice: Ha zara Jizọs, sị
  rationale: Nke a na-egosi na okwu ha bụ azịza e nyere Jizọs, ma na-asụkwa ya n’ụzọ Igbo dị ire ụtọ.
- source_word: Οὐκ οἴδαμεν
  choice: Anyị amaghị
  rationale: Ọ bụ ntụgharị doro anya nke nkwupụta ha na ha enweghị ihe ọmụma ahụ.
- source_word: Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: Mụ onwe m agaghịkwa agwa unu
  rationale: 'Nke a na-edobe nzaghachi kwekọrọ na nke ha: ebe ha na-ekweghị ịza, Jizọs ekweghịkwa ịgwa ha. Ọdịdị ọdịnihu a bụ ụzọ Igbo si egosipụta mkpebi ịghara ikwu ihe n’ọnọdụ a.'
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ụdị ikike m ji
  rationale: Ọ na-egosi ikike ma ọ bụ ihe ndabere nke Jizọs ji eme omume ndị ahụ, n’asụsụ Igbo nkịtị.
- source_word: ταῦτα ποιῶ
  choice: eme ihe ndị a
  rationale: A hapụrụ ọtụtụ ihe nke ταῦτα na-ekwu maka ya ka ọ bụrụ “ihe ndị a,” ebe ποιῶ bụ “eme.”
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Jizọs wee sị” na-eme ka akụkọ ahụ gaa n’ihu n’ụzọ Igbo nkịtị, ebe “Mụ onwe m” na-edobe nkwusi ike dị na ἐγώ.
