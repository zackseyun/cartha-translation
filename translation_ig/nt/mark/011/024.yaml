id: MRK.11.24
reference: Mark 11:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πάντα ὅσα ⸂προσεύχεσθε καὶ αἰτεῖσθε⸃, πιστεύετε ὅτι ⸀ἐλάβετε, καὶ ἔσται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: ig
  text: N’ihi ya, ana m agwa unu, ihe ọ bụla unu na-arịọ n’ekpere, kwere na unu anatala ya[a], ọ ga-abụkwa nke unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ odide ma ọ bụ ọgụgụ nwere okwu a pụrụ ịghọta ma ọ bụ sụgharịa dịka, “kwere na unu na-anata ya,” kama “kwere na unu anatala ya.” Ihe odide Grik e ji mee nsụgharị a na-ekwu “anatala,” nke na-egosi omume e mezuru.
    reason: alternative_reading
  - marker: b
    text: 'A pụkwara ịsụgharị ya: “ihe niile unu na-ekpe ekpere maka ha ma na-arịọ maka ha.”'
    reason: previous_rendering
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi ya
  rationale: Na-egosi njikọ nkwubi okwu a na ihe Jizọs kwuru tupu ya banyere okwukwe na ekpere.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Ọ bụ ụzọ Igbo dị ugbu a ma dịkwa ebube e si egosipụta okwu a Jizọs ji ikike gwa ndị na-ege ya ntị.
- source_word: πάντα ὅσα
  choice: ihe ọ bụla
  rationale: Na-echekwa obosara nke okwu Grik ahụ n’ụzọ Igbo na-ada nke ọma.
- source_word: προσεύχεσθε καὶ αἰτεῖσθε
  choice: unu na-arịọ n’ekpere
  rationale: Na-ejikọta echiche abụọ ahụ—ikpe ekpere na ịrịọ arịrịọ—n’ụzọ Igbo doro anya ma ghara ịdị arọ.
- source_word: πιστεύετε
  choice: kwere
  rationale: Na-edobe ụdị iwu nke ngwaa ahụ, ma na-eduga nke ọma n’ihe a ga-ekwere.
- source_word: ὅτι ἐλάβετε
  choice: na unu anatala ya
  rationale: Anatala na-egosipụta omume e mezuru nke ka nwere mkpa ugbu a, si otú ahụ chekwaa ike na mgbagwoju anya nke aorist ἐλάβετε.
- source_word: καὶ ἔσται ὑμῖν
  choice: ọ ga-abụkwa nke unu
  rationale: Na-egosipụta nkwa ọdịnihu ahụ n’ụzọ Igbo sitere n’okike ma na-ejikọta ya na ‘ihe ọ bụla’ dị ka otu echiche.
theological_decisions:
- issue: Oge a na-egosi n’ịnata azịza ekpere n’ihe metụtara okwukwe
  choice: Kwere na unu anatala ya, ọ ga-abụkwa nke unu.
  alternative: Kwere na unu na-anata ya, ọ ga-abụkwa nke unu.
  rationale: 'SBLGNT nwere ἐλάβετε, aorist, ya mere nsụgharị ahụ na-echekwa usoro okwu ahụ na-akpali echiche: buru ụzọ kwere na a natala ya, mgbe ahụ ọ ga-abụ nke unu. A naghị eme ka esemokwu mmụta okpukpe dị n’okwu ahụ laa n’iyi.'
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Unu na-arịọ n’ekpere’ na-enye echiche nke ngwaa abụọ Grik ahụ n’ụzọ Igbo na-asọ asọ; ‘anatala’ na-echekwa mkpụrụ okwu oge gara aga nke isi mmalite ahụ. E tinyere akara ndetu ala peeji [a] na [b] n’ahịrị bụ isi.
