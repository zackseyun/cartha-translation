  terminology: 'Key terms are well handled: “ugwu,” “oké osimiri,” “obi abụọ,” “obi,” and “kwere” are natural and theologically non-sectarian. Footnote a''s alternatives adequately signal the possible nuance of inward division/wavering, though “ịma jijiji” is less exact than the inward-division explanation that follows.'
