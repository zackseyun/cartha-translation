id: MRK.11.23
reference: Mark 11:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: ig
  text: N’ezie, ana m asị unu, onye ọ bụla nke ga-asị ugwu a, ‘Ka e bulie gị, ka e tụbakwa gị n’oké osimiri,’ ma ghara inwe obi abụọ n’obi ya[a], kama o kwere na ihe ọ na-ekwu na-eme[b], ọ ga-abụrụ ya otu ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ma ghara ịma jijiji” ma ọ bụ “obi ya ekewaghị abụọ.” Ngwaa Grik ahụ nwere ike ịpụta nkewa dị n’ime mmadụ nakwa obi abụọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “na ihe ọ na-ekwu na-emezu” ma ọ bụ “na ihe ọ na-ekwu na-apụta.” Grik ji present tense (“na-eme”) tupu ahịrịokwu nke nsonaazụ ga-eme n’ọdịnihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: N’ezie
  rationale: N’ọnọdụ a, ἀμὴν bụ okwu nkwenye siri ike Jizọs ji ebido okwu ya; “N’ezie” na-enye ya n’Igbo doro anya ma dị ugwu.
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Nke a na-edebe onye na-ekwu okwu, ndị a na-agwa okwu, na usoro okwu ahụ n’Igbo sitere n’ọnụ mmadụ.
- source_word: ὃς ἂν εἴπῃ
  choice: onye ọ bụla nke ga-asị
  rationale: Ọ na-egosipụta ọnọdụ metụtara onye ọ bụla, dịka njikọ nke nnọchiaha na ἄν tinyere subjunctive si dị.
- source_word: τῷ ὄρει τούτῳ
  choice: ugwu a
  rationale: “Ugwu” bụ ihe ὄρος na-egosikarị, ebe “a” na-edebe demonstrative τούτῳ na oyiyi okwu ahụ dị ndụ.
- source_word: Ἄρθητι καὶ βλήθητι
  choice: Ka e bulie gị, ka e tụbakwa gị
  rationale: Usoro “ka e…” na-edebe ọdịdị passive nke iwu abụọ ahụ ma na-eme ka oyiyi ibuli ugwu na ịtụba ya pụta ìhè.
- source_word: εἰς τὴν θάλασσαν
  choice: n’oké osimiri
  rationale: Nke a bụ ntụgharị nkịtị nke okwu ahụ ma na-edebe oyiyi siri ike nke amaokwu ahụ.
- source_word: μὴ διακριθῇ
  choice: ghara inwe obi abụọ
  rationale: N’ebe a, ngwaa ahụ na-egosi obi abụọ ma ọ bụ ịma jijiji n’ime mmadụ; isi ederede ji okwu Igbo kacha doo anya, ebe nkọwa ala peeji na-edebe nghọta ndị ọzọ.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: n’obi ya
  rationale: Nke a na-edebe oyiyi Baịbụl nke obi dịka ebe echiche na mkpebi dị, tinyere masculine singular nke Grik.
- source_word: πιστεύῃ
  choice: o kwere
  rationale: “Ikwere” bụ ụzọ Igbo nkịtị isi gosi πιστεύω n’ebe a n’enweghị itinye nkọwa ozizi ọzọ.
- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: na ihe ọ na-ekwu na-eme
  rationale: Nke a na-edebe present γίνεται dịka ihe na-eme, kama ịgbanwe ya ozugbo ka ọ bụrụ naanị ihe ga-eme n’ọdịnihu.
- source_word: ἔσται αὐτῷ
  choice: ọ ga-abụrụ ya otu ahụ
  rationale: Nke a na-edebe future result ahụ na ịdịtụ ghe oghe nke okwu Grik, n’enweghị ịkọwapụta usoro ihe ahụ ga-esi mee.
theological_decisions:
- issue: Ụdị nkwa Jizọs kwuru banyere okwukwe na okwu a na-ekwu
  choice: E nyere okwu ahụ dịka ọnọdụ na nkwa metụtara ikwere n’enweghị obi abụọ, n’etinyeghị ihe mgbochi ozizi ndị ọzọ n’ime amaokwu ahụ.
  alternative: Ịkọwa ya naanị dịka ikwubiga okwu ókè, ma ọ bụ dịka nkwa na-enweghị oke nye ihe ọ bụla mmadụ kwuru.
  rationale: Amaokwu ahụ n’onwe ya ji oyiyi siri ike kwuo maka okwukwe, ma ọ naghị akọwa usoro ozizi ndị ọzọ; ntụgharị ahụ na-ahapụ ike okwu ahụ na esemokwu nkà mmụta okpukpe ya ka ha dị.
- issue: Masculine singular αὐτοῦ / αὐτῷ
  choice: “ya” n’ọnọdụ onye otu ahụ
  alternative: Ịgbanwe ya ka ọ bụrụ ọtụtụ mmadụ n’ụzọ ga-eme ka singular ahụ ghara ịpụta.
  rationale: Nnọchiaha Igbo “ya” adịghị egosi nwoke ma ọ bụ nwaanyị, ma ọ na-edebe singular onye nnọchiaha Grik ahụ na-arụtụ aka na ya n’enweghị ịgbanwe nọmba.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ oyiyi ugwu, obi, na oké osimiri dịka ha dị; e zere okwu ochie na nkọwa ụka pụrụ iche.
