revisions:
- from: Ndị isi nchụàjà na ndị odeakwụkwọ nụkwara ihe ahụ, ha wee na-achọ ụzọ ha ga-esi bibie ya[a]; n’ihi na ha na-atụ ya egwu, n’ihi na ìgwè mmadụ ahụ dum nọ na-atụ n’anya n’ihi ozizi ya.
  to: Ndị isi nchụàjà na ndị odeakwụkwọ nụkwara ihe ahụ, ha na-achọkwa ụzọ ha ga-esi bibie ya[a]. Ha na-atụ ya egwu n’ihi na ìgwè mmadụ ahụ dum nọ na-atụ n’anya n’ozizi ya.
  rationale: The revision preserves the lexical breadth of ἀπολέσωσιν and its contextual lethal implication, while making the paired explanatory clauses and the ongoing action of ἐζήτουν read more naturally in Standard Igbo. The footnote is narrowed to a direct lexical alternative and avoids implying a causative method absent from the Greek.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:05Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the priestly leaders and scribes hearing of the matter, their continuing effort to destroy Jesus, their fear of him, and the crowd's astonishment at his teaching. ‘Bibie ya’ appropriately preserves the broader force of ἀπολέσωσιν, with the lethal contextual sense retained in the note.
  naturalness: The repeated ‘n’ihi na’ is possible but heavy in this short sentence. Using ‘n’ihi na’ for the leaders’ fear and ‘ebe ọ bụ na’ for the following explanatory clause better reflects the two γάρ clauses in fluent Standard Igbo. ‘Ha na-achọkwa’ also expresses the Greek imperfect coordination more directly than the sequential-sounding ‘ha wee na-achọ.’
  terminology: ‘Ndị isi nchụàjà’ and the established Gospel term ‘ndị odeakwụkwọ’ are suitable. ‘Ozizi ya’ is appropriate for διδαχῇ αὐτοῦ. The lexical footnote should retain ‘gbuo ya’ as the direct alternative; ‘mee ka e gbuo ya’ can suggest an indirect causative action not explicit in the verb.
  issues:
  - severity: low
    issue: The two consecutive clauses beginning ‘n’ihi na’ are stylistically cumbersome.
    rationale: The Greek has two explanatory γάρ clauses; varying the second connective improves Igbo flow without altering the relationship.
  - severity: low
    issue: ‘Ha wee na-achọ’ can suggest a sequential result.
    rationale: The Greek καὶ ἐζήτουν coordinates a completed hearing with an ongoing effort. ‘Ha na-achọkwa’ more naturally preserves this in Igbo.
  - severity: low
    issue: The footnote’s ‘mee ka e gbuo ya’ is more causative than the Greek verb itself.
    rationale: The source verb can mean ‘kill,’ but does not specifically state that they would cause others to kill him. A direct ‘gbuo ya’ alternative is sufficient.
  revised_text: Ndị isi nchụàjà na ndị odeakwụkwọ nụkwara ihe ahụ, ha na-achọkwa ụzọ ha ga-esi bibie ya[a]. Ha na-atụ ya egwu n’ihi na ìgwè mmadụ ahụ dum nọ na-atụ n’anya n’ozizi ya.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “gbuo ya.” Ngwaa Grik ahụ nwekwara ike ịpụta “ibibi” n’ụzọ sara mbara, ọ bụ ezie na ọnọdụ akụkọ a na-egosi na ha bu n’obi igbu ya.
    reason: lexical_alternative
  revision_rationale: The revision preserves the lexical breadth of ἀπολέσωσιν and its contextual lethal implication, while making the paired explanatory clauses and the ongoing action of ἐζήτουν read more naturally in Standard Igbo. The footnote is narrowed to a direct lexical alternative and avoids implying a causative method absent from the Greek.
