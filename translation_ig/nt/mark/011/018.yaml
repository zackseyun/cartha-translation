  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ ⸂ἀρχιερεῖς καὶ οἱ γραμματεῖς⸃, καὶ ἐζήτουν πῶς αὐτὸν ἀπολέσωσιν· ἐφοβοῦντο γὰρ αὐτόν, ⸂πᾶς γὰρ⸃ ὁ ὄχλος ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: ig
  text: Ndị isi nchụàjà na ndị odeakwụkwọ nụkwara ihe ahụ, ha na-achọkwa ụzọ ha ga-esi bibie ya[a]. Ha na-atụ ya egwu n’ihi na ìgwè mmadụ ahụ dum nọ na-atụ n’anya n’ozizi ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “gbuo ya.” Ngwaa Grik ahụ nwekwara ike ịpụta “ibibi” n’ụzọ sara mbara, ọ bụ ezie na ọnọdụ akụkọ a na-egosi na ha bu n’obi igbu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: nụkwara ihe ahụ
  rationale: ‘Nụrụ’ na-egosi ịnụ ma ọ bụ ịmata akụkọ ihe mere; ‘ihe ahụ’ na-ezo aka n’ihe Jizọs mere ma kụzie n’ụlọ nsọ n’amaokwu ndị bu ụzọ, n’enweghị ịkọwa ya karịa ihe odide ahụ.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Nke a bụ aha ìgwè ndị ndu nchụàjà na Jerusalem, ọ bụghị ịsị na e nwere ọtụtụ ndị isi nchụàjà kachasị elu n’otu oge.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Okwu a bụ aha a na-ejikarị akọwa ndị Juu maara Akwụkwọ Nsọ na iwu nke ọma; ntụgharị a na-edobe aha ìgwè ahụ n’enweghị ime ka ọ bụrụ naanị ‘ndị nkụzi iwu.’
- source_word: ἐζήτουν
  choice: ha wee na-achọ
  rationale: Ụdị imperfect na-egosi ọchịchọ ma ọ bụ mgbalị na-aga n’ihu, nke ‘na-achọ’ na-egosipụta n’Igbo.
- source_word: πῶς
  choice: ụzọ ha ga-esi
  rationale: Nke a na-egosi na ha na-atụgharị uche banyere ụzọ ma ọ bụ usoro ha ga-eji mee ihe ahụ.
- source_word: ἀπολέσωσιν
  choice: bibie ya
  rationale: ἀπόλλυμι nwere ike ịpụta ibibi ma ọ bụ igbu. ‘Bibie ya’ na-edobe obosara okwu Grik ahụ, ebe ọnọdụ akụkọ ahụ na-egosi na ebumnuche ha bụ ọnwụ.
- source_word: ἐφοβοῦντο
  choice: ha na-atụ ya egwu
  rationale: Ụdị imperfect na-egosi egwu na-adịgide, ma okwu a na-edobe Jizọs dịka onye egwu ahụ metụtara.
- source_word: πᾶς ὁ ὄχλος
  choice: ìgwè mmadụ ahụ dum
  rationale: Nke a na-edobe nkwusi ike nke πᾶς ma na-egosi ìgwè ahụ n’ozuzu ya.
- source_word: ἐξεπλήσσετο
  choice: nọ na-atụ n’anya
  rationale: Okwu ahụ na-egosi ịtụ n’anya nke ukwuu na nke na-aga n’ihu; usoro a bụ nke okike ma doo anya n’Igbo.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: n’ihi ozizi ya
  rationale: ἐπί ya na dative na-egosi ihe kpatara ma ọ bụ ihe mere ha ji tụ n’anya; ‘n’ihi ozizi ya’ na-ekwupụta njikọ ahụ n’ụzọ doro anya.
theological_decisions:
- issue: Oke ebumnuche ndị ndu ahụ dị na ἀπολέσωσιν
  choice: bibie ya
  alternative: gbuo ya; mee ka e gbuo ya
  rationale: Ọnọdụ akụkọ ahụ na-egosi atụmatụ nke ga-eweta ọnwụ, ma ngwaa Grik ahụ n’onwe ya sara mbara karịa ‘igbu.’ Isi ederede na-edobe obosara ahụ, ebe ndetu ala na-akọwa ihe okwu ahụ nwere ike ịpụta n’ebe a.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro akụkọ na-aga n’ihu site n’iji ‘na-achọ,’ ‘na-atụ,’ na ‘nọ na-atụ,’ ma zere ịgbakwunye nkọwa gbasara ihe mere ndị ndu ji tụọ Jizọs egwu karịa ihe amaokwu ahụ kwuru.
