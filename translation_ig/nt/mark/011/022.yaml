  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς λέγει αὐτοῖς· Ἔχετε πίστιν θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/022.yaml
  text: And Jesus answered them[a], “Have faith in God.”
translation:
  language: ig
  text: Jizọs wee zaa ha[a], sị, “Nweenụ okwukwe na Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ kpọmkwem n'okwu Grik, “Nweenụ okwukwe nke Chineke.” A pụkwara ịghọta nke a dịka “Nweenụ ikwesị ntụkwasị obi nke Chineke” ma ọ bụ “Nweenụ okwukwe sitere na Chineke.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: wee zaa
  rationale: Okwu a na-egosikarị nzaghachi e nyere n'okwu. “Wee zaa” bụ ụzọ Igbo si akọ ihe n'usoro ma na-egosipụta ọrụ participle ahụ nke ọma.
- source_word: λέγει
  choice: sị
  rationale: Ọ bụ ezie na Grik ji historical present, “sị” dabara n'akụkọ Igbo ma na-ejikọta okwu Jizọs kwuru na ngwaa “zaa” n'ụzọ ebumpụta ụwa.
- source_word: Ἔχετε
  choice: Nweenụ
  rationale: Imperative a bụ iwu e nyere ọtụtụ mmadụ. “Nweenụ” na-egosi ka ha nọgide nwee ọnọdụ okwukwe, n'ebughị nkọwa aspect ahụ gabiga ókè.
- source_word: πίστιν
  choice: okwukwe
  rationale: “Okwukwe” bụ okwu Igbo a na-ejikarị eme ihe maka πίστις, ma n'ebe a ọ dabara n'iwu ka ndị na-eso ụzọ tụkwasị Chineke obi.
- source_word: θεοῦ
  choice: na Chineke
  rationale: Genitive ahụ nwere ike ịpụta ihe karịrị otu. N'ọnọdụ a, “okwukwe na Chineke” na-enye objective sense nke kacha dabaa n'ozizi na-esote banyere ikwere na ikpe ekpere; e debere ụzọ ndị ọzọ e nwere ike isi ghọta ya n'okpuru peeji.
theological_decisions:
- issue: Genitive na-edochaghị anya n'okwu πίστιν θεοῦ
  choice: “okwukwe na Chineke” (okwukwe a tụkwasịrị na Chineke)
  alternative: “okwukwe nke Chineke,” nke nwekwara ike ịpụta “ikwesị ntụkwasị obi Chineke” ma ọ bụ “okwukwe sitere na Chineke”
  rationale: Ihe gbara amaokwu ahụ gburugburu—osisi fig kpọrọ nkụ na ozizi gbasara ikwere na ikpe ekpere—na-akwado ntụziaka ka ndị na-eso ụzọ nwee okwukwe n'ebe Chineke nọ. Ma ebe usoro Grik ahụ na-anabata nkọwa ndị ọzọ, e chekwara mgbagwoju anya ahụ n'okpuru peeji kama ikpochapụ ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Jizọs wee zaa ha, sị” na-ada ka akụkọ Igbo ebumpụta ụwa, ebe “Nweenụ” na-egosi na ọ na-agwa ọtụtụ ndị okwu.
