- from: Ọ sịrị ha, “Gaanụ n’obodo nta ahụ dị n’ihu unu. Ozugbo unu banyere n’ime ya, unu ga-ahụ nwa ịnyịnya ibu[a] e kegidere, nke mmadụ ọ bụla na-anọtụbeghị n’elu ya[b]. Tọpụnụ ya, kpọtakwanụ ya.”
  to: Ọ sịrị ha, “Gaanụ n’obodo nta ahụ chere unu ihu. Ozugbo unu banyere n’ime ya, unu ga-ahụ nwa anụmanụ[a] e kegidere, nke mmadụ ọbụla nọdụbeghị n’elu ya[b]. Tọpụnụ ya, kpọtaranụ ya.”
  rationale: The revision preserves the lexical ambiguity of πῶλον, improves the rendering of the ‘opposite’ village, and corrects the Igbo expression for the fact that no human has yet sat on the animal. Footnote markers remain correctly anchored after “nwa anụmanụ” and “n’elu ya.”
