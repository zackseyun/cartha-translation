source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: ig
  text: Ọ sịrị ha, “Gaanụ n’obodo nta ahụ chere unu ihu. Ozugbo unu banyere n’ime ya, unu ga-ahụ nwa anụmanụ[a] e kegidere, nke mmadụ ọbụla nọdụbeghị n’elu ya[b]. Tọpụnụ ya, kpọtaranụ ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik πῶλον na-ezo aka na nwa anụmanụ, ma n’ọnọdụ a ọ pụrụ ịpụta nwa ịnyịnya ibu.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ nkịtị: “nke mmadụ ọbụla n’etiti ụmụ mmadụ nọdụbeghị n’elu ya.” Okwu Grik ahụ na-ekwu kpọmkwem na ọ dịghị mmadụ nọdụtụrụla n’elu ya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Gaanụ
  rationale: Ọ bụ iwu ka ha gaa; ‘Gaanụ’ bụ okwu Igbo dị mfe ma kwekọọ n’ọnọdụ ahụ.
- source_word: κώμην
  choice: obodo nta
  rationale: κώμη na-egosi obodo nta, ọ bụghị nnukwu obodo.
- source_word: τὴν κατέναντι ὑμῶν
  choice: ahụ dị n’ihu unu
  rationale: Nke a na-egosi obodo nta ahụ chere ha ihu ma ọ bụ dị n’ofe ebe ha nọ, n’asụsụ Igbo a na-asụkarị.
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτήν
  choice: Ozugbo unu banyere n’ime ya
  rationale: 'Ọ na-echekwa njikọ oge ahụ: ozugbo ha banyere, ha ga-ahụ anụmanụ ahụ.'
- source_word: πῶλον
  choice: nwa ịnyịnya ibu
  rationale: πῶλος n’onwe ya nwere ike ịbụ nwa anụmanụ a na-agba; ọnọdụ akụkọ a na-egosi na ọ bụ nwa ịnyịnya ibu. Nsụgharị a doro onye Igbo anya karịa okwu sara mbara.
- source_word: δεδεμένον
  choice: e kegidere
  rationale: Ọ na-egosi na anụmanụ ahụ nọ n’ọnọdụ e ji ihe kee ya.
- source_word: οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: nke mmadụ ọ bụla na-anọtụbeghị n’elu ya
  rationale: Nke a na-echekwa ntụaka doro anya nye mmadụ nakwa na ruo oge ahụ, ọ dịghị onye nọtụrụla n’elu ya.
- source_word: λύσατε
  choice: Tọpụnụ
  rationale: N’ihe gbasara anụmanụ e kegidere, ‘tọpụnụ’ bụ iwu Igbo kwesịrị ekwesị.
- source_word: φέρετε
  choice: kpọtakwanụ
  rationale: Ọ na-enye echiche sara mbara nke ‘wetara/bring’ n’enweghị ịkọwa ma hà ga-eduru ya ka ọ bụ buru ya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ọtụtụ ‘unu’ kwekọọ n’iwu na nnọchiaha ọtụtụ dị n’asụsụ Grik. Akara nkọwa [a] na [b] dị n’ahịrị ederede ma kwekọọ na nkọwa ala peeji.
