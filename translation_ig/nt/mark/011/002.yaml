review_pass:
  verdict: revise
  source_fidelity: 'A revision is needed. The draft’s “nwa ịnyịnya ibu” specifies a donkey, whereas πῶλον in this verse itself denotes a young animal/colt and does not explicitly state the species. The phrase for no person having sat on it also needs correction: “na-anọtụbeghị” is not the natural perfect expression for ‘has not sat.’'
  naturalness: 'The revised wording uses natural Standard Igbo: “chere unu ihu” conveys the village opposite them; “nọdụbeghị n’elu ya” naturally expresses that nobody has sat on the animal; and “kpọtaranụ” is an idiomatic plural imperative for ‘bring [it].’'
  terminology: “Nwa anụmanụ” retains the lexical breadth of πῶλον, with a footnote explaining that it may refer to a young donkey in this setting. “Nọdụbeghị n’elu ya” accurately represents οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν without importing an interpretive action such as mounting or riding.
  issues:
  - severity: medium
    issue: The main text specifies “nwa ịnyịnya ibu” (young donkey).
    rationale: πῶλον is not species-specific in Mark 11:2. Although a young donkey is contextually plausible, the main translation should preserve the Greek word’s breadth, as the English audit trail does.
  - severity: medium
    issue: “nke mmadụ ọ bụla na-anọtụbeghị n’elu ya” is grammatically and aspectually awkward for ‘on which no one has yet sat.’
    rationale: The progressive-style “na-anọtụbeghị” does not naturally express completed non-occurrence. “Mmadụ ọbụla nọdụbeghị n’elu ya” clearly conveys that no human has yet sat on it.
  - severity: low
    issue: “dị n’ihu unu” may simply mean ‘in front of you’ rather than the more specific ‘opposite you.’
    rationale: “Chere unu ihu” more directly communicates the reciprocal spatial sense of κατέναντι.
  revised_text: Ọ sịrị ha, “Gaanụ n’obodo nta ahụ chere unu ihu. Ozugbo unu banyere n’ime ya, unu ga-ahụ nwa anụmanụ[a] e kegidere, nke mmadụ ọbụla nọdụbeghị n’elu ya[b]. Tọpụnụ ya, kpọtaranụ ya.”
