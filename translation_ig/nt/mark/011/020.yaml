source:
  edition: SBLGNT
  text: Καὶ ⸂παραπορευόμενοι πρωῒ⸃ εἶδον τὴν συκῆν ἐξηραμμένην ἐκ ῥιζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/020.yaml
  text: And as they were passing by early in the morning[a], they saw the fig tree withered from the roots.
translation:
  language: ig
  text: Ka ha na-agafe n’isi ụtụtụ, ha hụrụ na osisi fig ahụ akpọnwụọla malite na mgbọrọgwụ ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “osisi fig ahụ akpọnwụọla site na mgbọrọgwụ ya.”
    reason: Nkebiokwu Grik ahụ pụtara na akpọnwụ ahụ sitere, ma ọ bụ malite, na mgbọrọgwụ osisi ahụ.
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: Ka ha na-agafe
  rationale: Nke a na-egosi omume na-aga n’ihu n’otu oge ahụ ha hụrụ osisi ahụ, dị ka participle Grik si arụ ọrụ.
- source_word: πρωῒ
  choice: n’isi ụtụtụ
  rationale: Okwu a na-ezo aka n’oge ụtụtụ malitere ọhụrụ; ‘n’isi ụtụtụ’ bụ ụzọ Igbo si ekwu ya nke ọma ma doo anya.
- source_word: εἶδον
  choice: ha hụrụ
  rationale: Nke a bụ ntụgharị kpọmkwem nke ngwaa nghọta ahụ, n’etinyeghị echiche ọzọ dịka ‘ha chọpụtara.’
- source_word: συκῆν
  choice: osisi fig ahụ
  rationale: ‘Osisi fig’ bụ aha a na-aghọta nke ọma maka ụdị osisi ahụ, ebe ‘ahụ’ na-egosi osisi a kpọtụrụla aha n’akụkọ ahụ.
- source_word: ἐξηραμμένην
  choice: akpọnwụọla
  rationale: Ụdị okwu a na-egosi ọnọdụ osisi ahụ nọ na ya n’ihi ihe mere tupu mgbe ahụ; ‘akpọnwụọla’ na-egosipụta ma nsonaazụ ahụ ma ọnọdụ ya ugbu a.
- source_word: ἐκ ῥιζῶν
  choice: malite na mgbọrọgwụ ya
  rationale: Nke a na-edobe echiche Grik nke na-egosi na nkụ ahụ sitere ma ọ bụ malite na mgbọrọgwụ, n’agbanyeghị na a pụkwara ịghọta ya dịka nkụ ruru mgbọrọgwụ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù, dee amaokwu ahụ. Nhazi ‘Ka ha na-agafe’ na-edobe mmekọrịta oge dị n’etiti participle na ngwaa bụ isi, ebe ‘akpọnwụọla’ na-egosi ọnọdụ sitere n’ihe mere na mbụ.
