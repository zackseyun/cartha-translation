  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ⸀ὅταν ὀψὲ ἐγένετο, ⸀ἐξεπορεύοντο ἔξω τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/019.yaml
  text: And whenever evening came, they would go out of the city.
translation:
  language: ig
  text: Mgbe ọ bụla mgbede ruru, ha na-esi n’obodo ahụ apụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: Mgbe ọ bụla
  rationale: Njikọ a na ngwaa imperfect na-egosi ihe na-eme ugboro ugboro ma ọ bụ dị ka omenala; ‘Mgbe ọ bụla’ na-egosipụta nke a nke ọma.
- source_word: ὀψὲ ἐγένετο
  choice: o ruru ná mgbede
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu na mgbede eruola, ma ọ ka na-echekwa echiche oge dị n'okwu Grik ahụ.
- source_word: ἐξεπορεύοντο
  choice: ha na-esi ... apụ
  rationale: Ụdị ‘na-’ na Igbo na-egosi omume a na-eme ugboro ugboro, dịka imperfect Grik si mee n'ebe a.
- source_word: ἔξω τῆς πόλεως
  choice: na-esi n’obodo ahụ apụ
  rationale: Nhazi a na-egosipụta mmegharị site n'ime obodo gaa n'èzí, ọ bụghị naanị ịnọ n'èzí.
- source_word: πόλεως
  choice: obodo ahụ
  rationale: Isi okwu Grik kwuru naanị ‘obodo ahụ’; a kpọghị Jerusalem aha kpọmkwem, ya mere nsụgharị ahụ etinyeghị aha ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị mfe, nke oge a ma dị ùgwù. Nhazi ‘Mgbe ọ bụla ... ha na-’ na-eme ka omume ahụ a na-eme ugboro ugboro pụta ìhè n'ụzọ ndị na-agụ Igbo ga-aghọta ngwa ngwa.
