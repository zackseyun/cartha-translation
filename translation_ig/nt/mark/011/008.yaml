translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘alaka akwụkwọ ndụ’ iji gosipụta ihe στιβάδας nwere ike ịpụta, ma e tinyere nkọwa ala peeji iji chekwaa obosara na mgbagwoju anya nke okwu Grik.
