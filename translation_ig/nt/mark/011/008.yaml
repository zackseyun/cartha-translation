  yaml_path: translation/nt/mark/011/008.yaml
  text: And many spread their cloaks on the road, and others spread leafy branches cut from the fields.
translation:
  language: ig
  text: Ọtụtụ mmadụ gbasara uwe elu ha nʼụzọ, ndị ọzọ gbasakwara alaka nwere akwụkwọ ndụ ndị ha gbupụtara nʼubi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị naanị “alaka.” Okwu Grik bụ στιβάδας, nke nwere ike ịpụta ùkwù akwụkwọ ndụ, ahịhịa, ma ọ bụ alaka e gbuturu; ọ naghị ekwu kpọmkwem na ha bụ alaka nkwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Ọtụtụ mmadụ
  rationale: Nke a na-egosi ọnụ ọgụgụ buru ibu n'ụzọ doro anya, na-agbakwụghị nkwusi ike na-adịghị na Grik.
- source_word: ἱμάτια
  choice: uwe mwụda
  rationale: N'ọnọdụ akụkọ a, okwu ahụ na-ezo aka n'uwe elu ndị mmadụ yipụrụ gbasaa n'ụzọ; ‘uwe mwụda’ bụ okwu Igbo a na-aghọta nke ọma.
- source_word: ἔστρωσαν
  choice: gbasara
  rationale: Ngwaa a na-egosi ịgbasa ihe n'elu ala, ma dabara ma uwe ma ihe ọkụkụ.
- source_word: εἰς τὴν ὁδόν
  choice: nʼụzọ
  rationale: Ọ bụ ntụgharị Igbo ebumpụta ụwa maka itinye ihe n'elu ụzọ n'ọnọdụ a.
- source_word: ἄλλοι δὲ
  choice: ndị ọzọ ... kwa
  rationale: Nke a na-egosi mgbakwunye nwere obere ọdịiche, n'ebughị ibu mee δέ ka ọ bụrụ mmegide siri ike.
- source_word: στιβάδας
  choice: alaka akwụkwọ ndụ
  rationale: στιβάδας nwere ike ịpụta ùkwù ahịhịa, akwụkwọ ndụ, ma ọ bụ alaka e gbuturu; nhọrọ a na-eme ka ihe a gbasara n'ụzọ doo anya n'ebughị ‘alaka nkwụ’ nke ederede ekwughị.
- source_word: κόψαντες
  choice: ha gbupụtara
  rationale: Nke a na-egosi na ha buru ụzọ gbutuo alaka ndị ahụ tupu ha agbasa ha.
- source_word: ἐκ τῶν ἀγρῶν
  choice: nʼubi
  rationale: ἀγροί nwere ike ịbụ ubi ma ọ bụ ala ime obodo; ‘nʼubi’ bụ ntụgharị kpọmkwem ma dị mfe nghọta ebe a.
