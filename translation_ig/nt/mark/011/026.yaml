  rationale: A hapụrụ amaokwu ahụ n’onwe ya ka ọ dị, n’ihi na ọ na-eguzosi ike n’ihe Greek Byzantine kwuru ma na-ada nke ọma n’Igbo. E degharịla naanị nkọwa ala iji wepụ ‘ụfọdụ,’ nke na-agbakwụnye oke na-adịghị na audit trail Bekee, ma melite aha ọdịnala na nkọwa ‘scribes’ n’Igbo. Nkọwa ala ahụ ka na-egosi na amaokwu a nwere esemokwu ederede, n’enweghị ikwu karịa ihe àmà ahụ kwadoro.
