  text: But[a] if you do not forgive, neither will your Father who is in heaven forgive your trespasses.
translation:
  language: ig
  text: Ma[a] ọ bụrụ na unu anaghị agbaghara, Nna unu nke nọ n’eluigwe agaghịkwa agbaghara mmejọ unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a adịghị n’ihe odide Grik ndị kacha ochie, gụnyere Codex Sinaiticus na Codex Vaticanus nke narị afọ nke anọ, nakwa na nsụgharị Kọptik oge ochie. Ma ọ dị n’ọtụtụ ihe odide nke ọdịnala Bizantịn, n’ọdịnala Latin, nakwa n’ọtụtụ n’ime ihe akaebe Siriak. O yikarịrị ka ndị na-edegharị ihe odide n’oge e mesịrị tinyere ya iji mee ka amaokwu a kwekọọ n’okwu Jizọs kwuru na Matiu 6:15.
    reason: textual_critical
lexical_decisions:
- source_word: ἀφίημι
  choice: ịgbaghara
  rationale: N’ọnọdụ a, okwu a pụtara ịhapụ mmadụ n’ụgwọ omume ọjọọ ya; “ịgbaghara” bụ okwu Igbo doro anya ma kwekọọ ma n’ịgbaghara ibe mmadụ ma n’ịgbaghara nke Chineke.
- source_word: παράπτωμα
  choice: mmejọ
  rationale: “Mmejọ” na-egosi ịdapụ n’ihe ziri ezi ma ọ bụ ime ihe na-ezighị ezi, na-enweghị ime ka παράπτωμα bụrụ otu ihe kpọmkwem na okwu Grik sara mbara maka mmehie, ἁμαρτία.
theological_decisions:
- issue: Mmekọrịta dị n’etiti mmadụ ịgbaghara ndị ọzọ na Nna ịgbaghara mmadụ
  choice: 'E debere nkwupụta ahụ kpọmkwem dịka ọnọdụ na nsonaazụ: “ọ bụrụ na unu anaghị agbaghara ... agaghịkwa agbaghara.”'
  alternative: Ịkọwa ya dịka ihe àmà nke nzọpụta ma ọ bụ dịka ụzọ e si enweta nzọpụta.
  rationale: Okwu Grik kwuru njikọ ahụ n’ụzọ siri ike ma ọ kọwaghị usoro nkà mmụta okpukpe dị n’azụ ya; ntụgharị ahụ ekwesịghị itinye nkọwa otu ụka n’ime amaokwu ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. “Nna unu nke nọ n’eluigwe” na-edobe nkebi aha nke Grik, ebe “agaghịkwa” na-egosipụta οὐδέ nke ọma. Akara nkọwa [a] dị ozugbo n’akụkụ “Ma,” ka o doo anya na nkọwa ahụ metụtara ịdị adị nke amaokwu dum.
