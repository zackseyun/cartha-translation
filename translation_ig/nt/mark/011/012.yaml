  text: Καὶ τῇ ἐπαύριον ἐξελθόντων αὐτῶν ἀπὸ Βηθανίας ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: ig
  text: N’echi ya, mgbe ha si na Betani pụọ, agụụ gụrụ ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: N’echi ya
  rationale: A naghị atụgharị Καί iche dịka “Na” n’ebe a, n’ihi na njikọ oge “N’echi ya” na-aga n’ihu n’akụkọ ahụ n’ụzọ Igbo dị ndụ ma na-echekwa usoro akụkọ Mak.
- source_word: τῇ ἐπαύριον
  choice: n’echi ya
  rationale: Nkebi a na-arụ ọrụ dị ka okwu oge, na-egosi ụbọchị sochirinụ. “N’echi ya” bụ Standard Igbo doro anya ma bụrụ nke a na-ejikarị eme ihe.
- source_word: ἐξελθόντων αὐτῶν
  choice: mgbe ha ... pụọ
  rationale: Genitive absolute a na-egosi omume nke ìgwè ahụ mere tupu ma ọ bụ n’oge ọnọdụ isiokwu ahụ. “Mgbe ha ... pụọ” na-echekwa onye ọtụtụ “ha” na njikọ oge ahụ n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: ἀπὸ Βηθανίας
  choice: si na Betani
  rationale: ἀπό na-egosi isi ebe mmegharị ahụ malitere. “Si na Betani” bụ ụzọ Igbo nkịtị isi kwuo ịpụ n’ebe ahụ; Betani bụ ntụgharị ụda aha obodo ahụ.
- source_word: ἐπείνασεν
  choice: agụụ gụrụ ya
  rationale: Nke a bụ akpaalaokwu Igbo eke maka inwe agụụ. Ọ na-akọ ọnọdụ ahụ nke ọma ma ọ naghị amanye nghọta ingressive nke “malitere ịgụ ya,” nke a na-apụghị ikwu na ụdị a ga-enwerịrị ebe a.
theological_decisions:
- issue: Onye a na-ekwughị aha ya nke ἐπείνασεν na-ezo aka na ya
  choice: E ji nnọchiaha “ya” zoo aka na Jizọs n’etinyeghị aha ya n’amaokwu ahụ.
  alternative: Ịsị “agụụ gụrụ Jizọs” iji mee ka onye ahụ pụta ìhè.
  rationale: Ngwaa Grik ahụ bụ otu onye, ma ọnọdụ akụkọ na-eme ka o doo anya na ọ bụ Jizọs. Nnọchiaha “ya” na-echekwa nkenke nke isi mmalite ahụ, ma na-ahapụ nkwupụta ahụ banyere ezigbo agụụ anụ ahụ ya ka ọ dị n’enweghị mgbasawanye nkụzi.
- issue: Ma ἐπείνασεν pụtara ọnọdụ agụụ ka ọ bụ mmalite agụụ kpọmkwem
  choice: “agụụ gụrụ ya”
  alternative: “agụụ malitere ịgụ ya”
  rationale: Aorist ahụ nwere ike ịkọ ihe mere n’akụkọ n’enweghị ikwusi ike na mmalite ọnọdụ ahụ. Ya mere, a họọrọ okwu Igbo na-anọpụ iche nke na-echekwa ohere nghọta ahụ kama idozi ya n’otu ụzọ.
translation_notes:
  register: Asụsụ bụ Standard Igbo nke oge a, dị mfe ma nwee ugwu. E ji “Betani” dee Βηθανία dịka aha obodo a tụgharịrị n’ụda Igbo. Enweghị akara nkọwa ala peeji n’ihi na amaokwu a achọghị otu.
