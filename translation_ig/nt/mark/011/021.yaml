review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter’s recollection, his address to Jesus, the demonstrative imperative, the fig tree, and its completed withered state. The historical present λέγει may naturally be rendered with Igbo narrative sị. A small adjustment is needed in the relative clause so that the tree is clearly the object affected by Jesus’ curse.
  naturalness: The wording is generally clear Standard Igbo. Using bụụrụ ọnụ rather than bụrụ ọnụ more naturally expresses ‘the tree against which you pronounced a curse’ and removes any momentary ambiguity about the relation of the curse to the tree.
  terminology: Rabaị appropriately preserves Ῥαββί, and osisi fig clearly identifies a fig tree. Akpọnwụọla is an idiomatic rendering of the perfect ἐξήρανται and suitably conveys its present result.
  issues:
  - severity: low
    issue: The relative clause ‘osisi fiig ahụ ị bụrụ ọnụ’ lacks the object-oriented form most natural for ‘the tree which you cursed.’
    rationale: The Greek relative pronoun ἣν makes the fig tree the object of κατηράσω. ‘Ị bụụrụ ọnụ’ naturally marks the tree as the one against which the curse was spoken, while preserving the source meaning.
  - severity: low
    issue: The spelling ‘fiig’ is not the usual modern Igbo presentation of the borrowed crop name.
    rationale: ‘Fig’ after osisi is clear and conventional in contemporary Bible-style Standard Igbo.
  revised_text: Pita wee cheta, sị ya, “Rabaị, lee! Osisi fig ahụ ị bụụrụ ọnụ akpọnwụọla.”
  revised_footnotes: []
