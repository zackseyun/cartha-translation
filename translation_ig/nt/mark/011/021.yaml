- from: Pita wee cheta, sị ya, “Rabaị, lee! Osisi fiig ahụ ị bụrụ ọnụ akpọnwụọla.”
  to: Pita wee cheta, sị ya, “Rabaị, lee! Osisi fig ahụ ị bụụrụ ọnụ akpọnwụọla.”
  rationale: 'The revision preserves the source’s narrative sequence and perfect-result sense while making the curse clause idiomatic and explicitly linked to the fig tree. No footnote is required in Igbo here: akpọnwụọla adequately expresses the main sense, and the English footnote marker was attached to an unrelated word.'
