id: MRK.11.21
reference: Mark 11:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀναμνησθεὶς ὁ Πέτρος λέγει αὐτῷ· Ῥαββί, ἴδε ἡ συκῆ ἣν κατηράσω ἐξήρανται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/021.yaml
  text: And Peter[a], remembering, says to him, “Rabbi, look—the fig tree that you cursed has withered.”
translation:
  language: ig
  text: Pita wee cheta, sị ya, “Rabaị, lee! Osisi fig ahụ ị bụụrụ ọnụ akpọnwụọla.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναμνησθεὶς
  choice: wee cheta
  rationale: Ọ na-egosi na Pita chetara ihe mere tupu o kwuo okwu; usoro a bụ nke sitere n’ọnụ Igbo ma na-ejigide njikọ participle ahụ na okwu ya.
- source_word: λέγει
  choice: sị
  rationale: Ọ bụ ezie na Grik ji historical present, akụkọ Igbo na-adịkarị mma ma doo anya mgbe e ji ụdị ngwaa gara aga “sị”; ọ naghị agbanwe usoro ihe omume ahụ.
- source_word: αὐτῷ
  choice: ya
  rationale: Aha nnọchi a na-ezo aka n’ebe Jizọs nọ site n’ihe gbara amaokwu ahụ gburugburu, ma “ya” na-edobe aha nnọchi nke Grik.
- source_word: Ῥαββί
  choice: Rabaị
  rationale: E debere aha a translitere iji chekwaa ọnọdụ ndị Juu na ụdị okwu Pita kpọrọ Jizọs kpọmkwem.
- source_word: ἴδε
  choice: lee
  rationale: “Lee” bụ iwu dị mkpirikpi, doro anya, ma kwekọọ n’oku Pita ji atụ Jizọs aka n’osisi ahụ.
- source_word: συκῆ
  choice: osisi fiig
  rationale: N’ebe a okwu ahụ pụtara osisi, ọ bụghị naanị mkpụrụ ya; “osisi fiig” na-eme ka nke ahụ doo anya.
- source_word: κατηράσω
  choice: ị bụrụ ọnụ
  rationale: Ọ na-egosi kpọmkwem omume Jizọs mere n’oge gara aga, ebe Pita na-agwa ya okwu.
- source_word: ἐξήρανται
  choice: akpọnwụọla
  rationale: 'Ụdị a na-egosi omume mezuru nke nsonaazụ ya ka dị ugbu a: osisi ahụ akpọnwụwo ma nọgide n’ọnọdụ ahụ.'
theological_decisions: []
translation_notes:
  register: 'Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Rabaị” chekwaa ọnọdụ ndị Juu; e zere ime ka ihe karịrị ihe Grik kwuru pụta ìhè. Enweghị akara nkọwa ala peeji n’ihi na nkọwa Bekee e nyere yiri ka akara [a] nọ n’ebe na-ekwesịghị ekwesị: ihe nkọwa ya metụtara ἐξήρανται, ọ bụghị “Pita.” Nhọrọ abụọ ahụ, “akpọnwụọla” na “akpọọla nkụ,” dị nso n’Igbo, ma nke mbụ dabara osisi nke ọma ma na-egosi nsonaazụ ka dị ugbu a.'
