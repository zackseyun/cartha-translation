source:
  edition: SBLGNT
  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: ig
  text: Ha na-atụle okwu n’etiti onwe ha, na-ekwu sị, “Gịnị ka anyị ga-ekwu? Ọ bụrụ na anyị asị, ‘O sitere n’eluigwe,’[a] ọ ga-asị, ‘Gịnịzi mere unu ekweghị ya?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O sitere n’eluigwe” bụ ụzọ nkwanye ùgwù ndị Juu si ekwu na ihe sitere n’aka Chineke ma ọ bụ nwee ikike sitere n’aka Chineke.
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο
  choice: na-atụgharị uche
  rationale: Oge imperfect na-egosi ntụgharị uche na-aga n’ihu; okwu a na-edobe akụkụ echiche na ịtụle ihe, ọ bụghị nanị mkparịta ụka nkịtị.
- source_word: πρὸς ἑαυτοὺς
  choice: n’etiti onwe ha
  rationale: Ọ na-egosi na ndị otu ahụ na-atụle okwu ahụ ọnụ n’etiti onwe ha, ọ bụghị na onye ọ bụla na-eche naanị n’obi ya.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-ewebata kpọmkwem ihe ha kwuru mgbe ha na-atụgharị uche.
- source_word: Τί εἴπωμεν;
  choice: Gịnị ka anyị ga-ekwu?
  rationale: Nke a na-egosipụta ajụjụ ntụle banyere azịza ha kwesịrị inye n’Igbo dị ugbu a ma dị mfe nghọta.
- source_word: ἐὰν εἴπωμεν
  choice: Ọ bụrụ na anyị asị
  rationale: Ọ bụ usoro ọnọdụ dị mfe ma bụrụkwa okwu Igbo sitere n’okike.
- source_word: Ἐξ οὐρανοῦ
  choice: O si n’eluigwe bịa
  rationale: Ọ na-edobe okwu ‘eluigwe’ nke Greek ma na-eme ka azịza mkpirikpi ahụ doo anya n’Igbo dịka ihe sitere n’ebe ahụ.
- source_word: ἐρεῖ
  choice: ọ ga-asị
  rationale: Ọ na-asụgharị future nke λέγω ozugbo; ajụjụ so ya na-egosi ụdị nzaghachi ahụ.
- source_word: Διὰ τί οὖν
  choice: Gịnịzi mere
  rationale: Mgbakwunye ‘-zi’ na-egosi njikọ nkwubi okwu nke οὖν n’ụzọ Igbo sitere n’okike.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: unu ekweghị ya
  rationale: πιστεύω tinyere dative ebe a pụtara ikwere onye ahụ ma ọ bụ ịnakwere ihe akaebe ya; ‘ekweghị ya’ na-ezere echiche siri ike karịa nke ‘ikwere na ya.’
theological_decisions:
- issue: Ihe ‘si n’eluigwe’ pụtara banyere baptizim ma ọ bụ ikike Jọn
  choice: Idobe okwu ‘O si n’eluigwe bịa’ n’ahịrịokwu bụ isi
  alternative: O si n’aka Chineke bịa
  rationale: Okwu ahụ bụ ụzọ nkwanye ùgwù ndị Juu si egosi mmalite ma ọ bụ ikike sitere n’aka Chineke. Idobe ‘eluigwe’ na-echekwa ọdịdị na ike arụmụka nke isi mmalite, ebe nkọwa ala peeji na-akọwa omenala ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘na-atụgharị uche n’etiti onwe ha’ gosipụta ntụle ha na-eme ọnụ; e debere akpaalaokwu ‘eluigwe’ ma kọwaa ya n’ala peeji.
