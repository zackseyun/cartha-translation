  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: ig
  text: Ha bịarutere Jerusalem ọzọ. Mgbe ọ na-ejegharị n’ogige ụlọ nsọ[a], ndị isi nchụaja, ndị odeakwụkwọ, na ndị okenye bịakwutere ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ụlọ nsọ” ma ọ bụ “n’ógbè ụlọ nsọ.” Okwu Grik a na-ezo aka n’ogige na mpaghara ụlọ nsọ ahụ dum, ọ bụghị kpọmkwem n’ebe nsọ dị n’ime ụlọ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: ha bịakwara / bịakwutere
  rationale: Oge ugbu a nke Grik bụ historical present; Igbo nkịtị n’akụkọ na-eji oge gara aga akọ ya. A sụgharịrị ọdịdị abụọ nke okwu ahụ dịka ọnọdụ ha si dị.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na ha laghachiri Jerusalem ọzọ.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Nke a bụ aha obodo ahụ a na-eji n’Igbo ugbu a.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ogige ụlọ nsọ
  rationale: ἱερόν na-ezo aka n’ebe sara mbara nke ụlọ nsọ ahụ, ọ bụghị naanị ebe nsọ dị n’ime ya.
- source_word: περιπατοῦντος αὐτοῦ
  choice: mgbe ọ na-agagharị
  rationale: Nke a na-egosi ihe Jizọs nọ na-eme mgbe ndị ahụ bịakwutere ya, ma na-echekwa omume ahụ na-aga n’ihu.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: N’ụdị ọtụtụ, okwu a na-ezo aka ná ndị ọchịchị kachasị elu n’etiti ndị nchụaja.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nke a bụ ntụgharị okwu kpọmkwem nke na-ezo aka ná ndị ọkachamara n’iwu na ihe odide, n’agbanyeghị na ọ nwere ike ịchọ nkọwa n’ụfọdụ ọnọdụ.
- source_word: πρεσβύτεροι
  choice: ndị okenye
  rationale: N’ọnọdụ a, ọ na-ezo aka ná ndị ndu ndị Juu a ma ama, ọ bụghị naanị ndị kara nká.
- source_word: πρὸς αὐτόν
  choice: bịakwutere ya
  rationale: Ngwaa ngagharị tinyere πρός na-egosi ịbịaru Jizọs nso; okwu Igbo a na-egosipụta ya nke ọma.
theological_decisions:
- issue: Ntụgharị ἱερόν
  choice: ogige ụlọ nsọ
  alternative: ụlọ nsọ; gburugburu ụlọ nsọ
  rationale: Nhọrọ a na-ezere ime ka onye na-agụ ya chee na Jizọs nọ n’ebe nsọ dị n’ime ụlọ ahụ; ọ na-egosi ogige na mpaghara sara mbara ebe ọha na eze nwere ike ịnọ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “na-agagharị” iji gosipụta ije Jizọs na-aga n’ihu, ma depụta ihe omume ndị bụ isi n’oge gara aga dịka akụkọ Igbo si adị.
