revisions:
- from: Ha bịakwara ọzọ na Jerusalem. Mgbe ọ na-agagharị n’ogige ụlọ nsọ[a], ndị isi nchụaja, ndị odeakwụkwọ, na ndị okenye bịakwutere ya.
  to: Ha bịarutere Jerusalem ọzọ. Mgbe ọ na-ejegharị n’ogige ụlọ nsọ[a], ndị isi nchụaja, ndị odeakwụkwọ, na ndị okenye bịakwutere ya.
  rationale: 'The revision makes two small idiomatic improvements while maintaining the source meaning and established biblical register. It also corrects the spatial nuance of the footnote: ἱερόν is the wider temple complex, in contrast to the inner sanctuary.'
  reviewer_model: gpt-5.6-terra
