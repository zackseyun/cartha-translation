    text: A pụkwara ịsị, “n’ụlọ nsọ” ma ọ bụ “n’ógbè ụlọ nsọ.” Okwu Grik a na-ezo aka n’ogige na mpaghara ụlọ nsọ ahụ dum, ọ bụghị kpọmkwem n’ebe nsọ dị n’ime ụlọ ahụ.
    reason: lexical_alternative
  revision_rationale: 'The revision makes two small idiomatic improvements while maintaining the source meaning and established biblical register. It also corrects the spatial nuance of the footnote: ἱερόν is the wider temple complex, in contrast to the inner sanctuary.'
