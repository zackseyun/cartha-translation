  text: And they said to them just as Jesus had said[a], and they let them go.
translation:
  language: ig
  text: Ha wee gwa ha dị ka Jizọs kwuru; ndị ahụ ekwe ka ha gawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị ahụ hapụrụ ha” ma ọ bụ “ndị ahụ kwere ka ha mee otú ahụ.” Okwu Grik ahụ nwere ike ịpụta ikwe, ịhapụ, ma ọ bụ ịtọhapụ; n’ebe a, ọ pụtara na ndị nọ n’ebe ahụ akwụsịghịzi ndị na-eso ụzọ ịkpọrọ nwa ịnyịnya ibu ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ha wee
  rationale: ‘Ha’ na-ezo aka n’ebe ndị na-eso ụzọ nọ n’okwu gbara amaokwu a gburugburu; ‘wee’ na-ejikọta ihe omume ahụ n’usoro akụkọ n’Igbo dị mfe.
- source_word: εἶπαν αὐτοῖς
  choice: gwa ha
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu na ndị na-eso ụzọ gwara ndị ahụ okwu; onye a gwara okwu pụtara ìhè n’ọnọdụ a.
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: kpọmkwem ihe Jizọs kwuru
  rationale: ‘kpọmkwem’ na-egosi na azịza ha kwekọrọ n’ihe Jizọs kwuru, na-enweghị ịgbakwunye na Jizọs gwara ha okwu ahụ kpọmkwem.
- source_word: ἀφῆκαν αὐτούς
  choice: ha ekwekwara ka ha laa
  rationale: N’ebe a, ἀφίημι pụtara na ndị nọ ebe ahụ kwụsịrị igbochi ndị na-eso ụzọ ma kwe ka ha gaa; ntụgharị a na-edobe echiche nke inye ohere n’Igbo eke.
