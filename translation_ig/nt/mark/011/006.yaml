- from: Ha wee gwa ha kpọmkwem ihe Jizọs kwuru, ha ekwekwara ka ha laa.[a]
  to: Ha wee gwa ha dị ka Jizọs kwuru; ndị ahụ ekwe ka ha gawa.[a]
  rationale: The revision retains the narrative sense and the contextual meaning of ἀφίημι while making the change from the disciples to the bystanders explicit. It also renders καθώς without adding emphasis beyond the Greek.
