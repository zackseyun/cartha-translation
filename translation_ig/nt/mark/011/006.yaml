translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. E ji usoro akụkọ ‘Ha wee ... ha ekwekwara ...’ mee ka amaokwu ahụ na-aga nke ọma ma doo ndị nkịtị anya.
