  terminology: ‘Ogige ụlọ nsọ’ suitably conveys ἱερόν as the temple precincts rather than the inner sanctuary. ‘Ihe’ appropriately preserves the breadth of σκεῦος. The footnotes are idiomatic and accurately state the lexical alternatives.
