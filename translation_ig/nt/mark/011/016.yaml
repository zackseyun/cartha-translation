  text: καὶ οὐκ ἤφιεν ἵνα τις διενέγκῃ σκεῦος διὰ τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/016.yaml
  text: And he would not allow anyone to carry a vessel through the temple courts[a][b].
translation:
  language: ig
  text: Ọ naghị ekwe ka onye ọ bụla buru ihe gafee n’ogige ụlọ nsọ ahụ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘gafee n’mpaghara ụlọ nsọ.’ Okwu Grik ahụ na-ezo aka n’ogige na mpaghara ụlọ nsọ niile, ọ bụghị kpọmkwem ime ebe nsọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘buru arịa’ ma ọ bụ ‘buru ngwá ọrụ.’ Okwu Grik ahụ sara mbara, ọ kọwaghị kpọmkwem ụdị ihe ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤφιεν
  choice: O kweghịkwa
  rationale: Ụdị imperfect a na-egosi na Jizọs nọgidere na-egbochi omume ahụ; n'Igbo, ahịrịokwu a na-egosi na o nyeghị onye ọ bụla ohere ime ya.
- source_word: ἵνα τις διενέγκῃ
  choice: ka onye ọ bụla buru ... gafee
  rationale: Mgbe ἤφιεν gachara, ἵνα tinyere subjunctive na-egosi ihe ọ na-ekweghị ka e mee; usoro ‘kwe ka onye ...’ bụ ụzọ Igbo si ekwu ya n'ụzọ doro anya.
- source_word: διενέγκῃ
  choice: buru ... gafee
  rationale: Ngwaa ahụ pụtara iburu ma ọ bụ ibufe ihe site n'otu ebe gaa ebe ọzọ; ‘buru ... gafee’ na-echekwa ma iburu ihe ma ntụziaka nke ịgafe ebe ahụ.
- source_word: σκεῦος
  choice: ihe
  rationale: σκεῦος bụ okwu sara mbara maka ihe e ji eme ihe, arịa, ma ọ bụ ngwá ọrụ. ‘Ihe’ na-ezere ịkọwa ụdị ya karịa ka Grik si kwuo, ebe nkọwa ala na-egosi nhọrọ ndị ọzọ.
- source_word: διὰ τοῦ ἱεροῦ
  choice: gafee n’ogige ụlọ nsọ ahụ
  rationale: ἱερόν na-ezo aka n'ogige na mpaghara ụlọ nsọ niile, ọ bụghị kpọmkwem ime ebe nsọ (ναός); ‘ogige ụlọ nsọ’ na-eme ka ọdịiche a doo onye Igbo anya.
theological_decisions:
- issue: Ihe ἱερόν pụtara n’ihe gbasara ụlọ nsọ dị na Jerusalem
  choice: mpaghara sara mbara nke ụlọ nsọ, nke a sụgharịrị ‘ogige ụlọ nsọ’
  alternative: ‘ụlọ nsọ’ ma ọ bụ ‘mpaghara ụlọ nsọ’
  rationale: Nke a na-echekwa ọdịiche dị n’etiti ἱερόν, ya bụ ogige na mpaghara ụlọ nsọ niile, na ναός, ya bụ ime ebe nsọ; ọ naghị ekwu na ndị mmadụ na-ebufe ihe n'ime ebe nsọ kpọmkwem.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. ‘Ogige ụlọ nsọ’ na-eme ka ebe a na-ekwu maka ya doo anya; ‘ihe’ na-echekwa obosara nke σκεῦος, ebe nkọwa ala na-enye nsụgharị ndị ọzọ.
