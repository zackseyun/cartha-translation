source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐγγίζουσιν εἰς Ἱεροσόλυμα εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ Ὄρος τῶν Ἐλαιῶν, ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/001.yaml
  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: ig
  text: Mgbe ha na-abịaru Jerusalem nso[a], na Betfage na Betani, n'akụkụ Ugwu Oliv, o zipụrụ[b] mmadụ abụọ n'ime ndị na-eso ụzọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n'ụzọ kpọmkwem karịa, “Mgbe ha na-abịaru Jerusalem nso, ruo Betfage na Betani, n'akụkụ Ugwu Oliv.” Okwu ntụaka ebe ndị Grik ji mee ihe nwere ike igosi ebe a na-aga ma ọ bụ ịdị nso n'ebe ahụ.
    reason: lexical_alternative
  - marker: b
    text: Mak na-ejikarị ngwaa nke oge ugbu a akọ ihe ndị mere n'oge gara aga. Ya mere, a pụkwara ịsụgharị “o zipụrụ” dịka “ọ na-ezipụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζουσιν
  choice: na-abịaru ... nso
  rationale: Ọ na-egosi ngagharị ịbịaru Jeruselem nso; usoro a na-ada nke ọma n'Igbo ma kwekọọ na akụkọ na-aga n'ihu.
- source_word: εἰς Ἱεροσόλυμα
  choice: Jeruselem
  rationale: N'usoro Igbo, ‘ịbịaru Jeruselem nso’ anaghị achọ ka a sụgharịa εἰς iche.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: ha rutere Betfage na Betani
  rationale: Nkwupụta a na-eme ka ọnọdụ obodo ndị ahụ n'ụzọ ha doro anya n'Igbo, n'agbanyeghị na preposition Grik nwere ike ịpụta ebe a na-aga ma ọ bụ ebe a bịaruru.
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: n'akụkụ Ugwu Oliv
  rationale: πρός bụ okwu gbasara ọnọdụ ebe a, ya mere ‘n'akụkụ’ na-egosi ịdị nso n'etinyeghị echiche ngagharị nke na-adịghị mkpa.
- source_word: ἀποστέλλει
  choice: o zipụrụ
  rationale: Ọ bụ historical present n'akụkọ Mak; oge gara aga bụ ụzọ ebumpụta ụwa e si akọ akụkọ n'Igbo.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: mmadụ abụọ n'ime ndị na-eso ụzọ ya
  rationale: Nke a na-echekwa partitive construction ahụ ma doo anya n'Igbo.
- source_word: Βηθφαγὴ
  choice: Betfage
  rationale: E degharịrị aha obodo ahụ n'ụdị dabara n'usoro ụda na mkpụrụedemede Igbo.
- source_word: Βηθανίαν
  choice: Betani
  rationale: E degharịrị aha obodo ahụ n'ụdị a na-aghọta ngwa ngwa n'Igbo.
- source_word: Ὄρος τῶν Ἐλαιῶν
  choice: Ugwu Oliv
  rationale: Nke a na-echekwa aha ebe ahụ na njikọ ya na osisi oliv n'ụzọ dị mkpirikpi ma doo anya.
theological_decisions:
- issue: Oge ngwaa n'akụkọ Mak
  choice: 'A sụgharịrị ἀποστέλλει dị ka oge gara aga: ‘o zipụrụ.’'
  alternative: ‘ọ na-ezipụ’
  rationale: Ngwaa Grik bụ historical present nke na-eme ka akụkọ dị ndụ; Igbo na-ejikarị oge gara aga akọ ihe mere, ya mere nhọrọ a anaghị agbanwe isi ihe ma ọ bụ echiche okpukpe.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. E ji ‘ndị na-eso ụzọ’ mee μαθηταί, ebe ọ bụ okwu doro ndị na-agụ Igbo nke oge a anya. Akara nkọwa [a] na [b] dị n'ahịrị isi.
