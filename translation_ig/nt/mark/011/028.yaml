  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: ig
  text: Ha na-asị ya, “Ọ bụ ikike dị aṅaa ka i ji eme ihe ndị a?[a] Ma ònye nyere gị ikike a iji mee ihe ndị a?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n'ụzọ nkịtị karịa, “N'ikike dị aṅaa ka ị na-eme ihe ndị a?”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ka i wee na-eme ihe ndị a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: Ha nọkwa na-asị
  rationale: Oge ngwaa imperfect na-egosi okwu ha nọgidere na-ekwu n'oge ahụ; ‘nọkwa na-asị’ na-egosipụta akụkụ a karịa nanị ‘ha sịrị.’
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Ọ bụ ikike dị aṅaa ka i ji
  rationale: Nke a bụ ụzọ Igbo dị ndụ si ajụ ihe ikike mmadụ ji eme ihe, ma ọ ka na-edobe echiche nke ntọala ma ọ bụ ikike e nyere ya.
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: ikike
  rationale: ‘Ikike’ nwere ike ịpụta ikike ime ihe ma ọ bụ ikike e nyere mmadụ, nke dabara n'ịma aka ndị isi na-ama Jizọs banyere ihe ndị ọ na-eme.
- source_word: ταῦτα ποιεῖς / ταῦτα ποιῇς
  choice: i ji eme ihe ndị a / iji mee ihe ndị a
  rationale: E debere ụbara ταῦτα dịka ‘ihe ndị a,’ ebe e ji usoro Igbo kwekọrọ n'ajụjụ dị ugbu a na nkebi ebumnuche.
- source_word: ἢ
  choice: Ma
  rationale: ‘Ma’ na-ewebata ajụjụ nke abụọ dịka ụzọ ọzọ e si jụọ otu ihe ahụ.
- source_word: τίς σοι ἔδωκεν
  choice: ònye nyere gị
  rationale: Nke a na-egosipụta ajụjụ banyere onye nyere ikike ahụ, ma na-edobe aorist dị ka ihe mere eme.
- source_word: ἵνα ταῦτα ποιῇς
  choice: iji mee ihe ndị a
  rationale: Ụdị infinitive Igbo a na-egosipụta ebumnuche nke ἵνα n'ụzọ dị nkenke ma bụrụ nke a na-asụkarị.
theological_decisions:
- issue: Ebe ikike Jizọs si bịa
  choice: E dere ajụjụ ndị isi ahụ n'ụzọ na-anọpụ iche, dịka ịma aka banyere ikike Jizọs.
  alternative: Ịsụgharị ya n'ụzọ ga-egosi kpọmkwem na ha na-ajụ maka ikike Chineke nyere ya.
  rationale: Amaokwu a na-enye ajụjụ ha, ọ naghị aza ya. Ya mere, nsụgharị ahụ ekwesịghị itinye azịza nkà mmụta okpukpe n'okwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere nkwughachi ‘ihe ndị a’ nke dị n'asụsụ Grik, ma e zere ịkọwa onye nyere ikike ahụ.
