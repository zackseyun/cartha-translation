review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the sequence, Jesus' entry into the ἱερόν, the begun action of expelling both sellers and buyers, and the overturning of the money changers' tables and dove sellers' seats. A small revision improves the rendering of the arrival verb and retains the Greek's single linked sentence.
  naturalness: “Ha wee bịaruo Jerusalem” is less idiomatic and can suggest approaching rather than arriving. “Ha wee bịarute Jerusalem” is natural Standard Igbo narrative usage. Keeping the final overturning clause joined by “ma” also gives the sentence a smoother and closer Greek narrative flow.
  terminology: “Ụlọ nsọ,” “ndị na-agbanwe ego,” “oche,” and “nduru” are suitable. The footnote should identify ἱερόν as the wider temple precinct/complex without the unnecessarily specific claim that it denotes “ogige na ụlọ niile.”
  issues:
  - severity: low
    issue: Arrival wording
    rationale: “Bịaruo” may convey coming near; “bịarute” clearly expresses arrival at Jerusalem, matching ἔρχονται in this narrative context.
  - severity: low
    issue: Footnote scope wording
    rationale: The note's phrase “ogige na ụlọ niile” over-specifies the referent. Ἱερόν denotes the broader temple precinct/complex, in contrast to the inner sanctuary, but does not require that particular description.
  revised_text: Ha wee bịarute Jerusalem. Mgbe ọ banyere n'ụlọ nsọ[a], ọ malitere ịchụpụ ndị na-ere ihe na ndị na-azụ ihe n'ụlọ nsọ ahụ, ma kwatuo tebụl ndị na-agbanwe ego na oche ndị na-ere nduru.
