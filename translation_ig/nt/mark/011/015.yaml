id: MRK.11.15
reference: Mark 11:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: ig
  text: Ha wee bịarute Jerusalem. Mgbe ọ banyere n'ụlọ nsọ[a], ọ malitere ịchụpụ ndị na-ere ihe na ndị na-azụ ihe n'ụlọ nsọ ahụ, ma kwatuo tebụl ndị na-agbanwe ego na oche ndị na-ere nduru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ogige ụlọ nsọ” ma ọ bụ “mpaghara ụlọ nsọ.” Okwu Greek a na-ezo aka n’akụkụ ụlọ nsọ dum, ọ bụghị kpọmkwem ebe nsọ dị n’ime.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: Ha wee bịaruo
  rationale: A sụgharịrị historical present dịka ihe mere n'oge gara aga, nke kwekọrọ n'usoro akụkọ Igbo; “wee” na-egosi usoro ihe omume.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Nke a bụ aha obodo ahụ a na-ejikarị na Standard Igbo.
- source_word: εἰσελθὼν
  choice: Mgbe ọ banyere
  rationale: Nkebiokwu a na-egosi na mbanye ahụ metụtara ma buru isi omume ahụ ụzọ, n'Igbo doro anya ma dị mfe.
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: ụlọ nsọ
  rationale: “Ụlọ nsọ” bụ okwu Igbo a maara nke ọma; n'ebe a ἱερόν pụtara ogige ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n'ime, ya mere e tinyere nkọwa ala peeji.
- source_word: ἤρξατο ἐκβάλλειν
  choice: ọ malitere ịchụpụ
  rationale: Nke a na-echekwa echiche nke ịmalite ime ihe ahụ nakwa ike dị n'omume ịchụ ndị ahụ pụọ.
- source_word: τοὺς πωλοῦντας καὶ τοὺς ἀγοράζοντας
  choice: ndị na-ere ihe na ndị na-azụ ihe
  rationale: Nke a na-echekwa nhata na omume na-aga n'ihu nke participle abụọ ahụ.
- source_word: κολλυβιστῶν
  choice: ndị na-agbanwe ego
  rationale: Ọ bụ nkọwa Igbo doro anya maka ndị ọrụ ha bụ ịgbanwe otu ụdị ego gaa n'ụdị ọzọ.
- source_word: καθέδρας
  choice: oche
  rationale: “Oche” bụ okwu sara mbara ma kwesị ekwesị, n'ebughị ụdị oche a na-akọwaghị na Greek.
- source_word: περιστερὰς
  choice: nduru
  rationale: “Nduru” bụ okwu Igbo a na-ejikarị maka anụ ufe a n'ọnọdụ àjà.
- source_word: κατέστρεψεν
  choice: Ọ kwaturu
  rationale: Okwu a na-egosi n'ụzọ doro anya na ọ tụgharịrị tebụl na oche ndị ahụ daa.
theological_decisions:
- issue: Ókè ihe ἱερόν na-ezo aka na ya
  choice: ụlọ nsọ, ya bụ ogige ụlọ nsọ dum
  alternative: ogige ụlọ nsọ
  rationale: ἱερόν na-ezo aka n'ogige na ụlọ dị iche iche nke ụlọ nsọ ahụ, ọ bụghị kpọmkwem ebe nsọ dị n'ime. E debere “ụlọ nsọ” n'ahịrị isi maka ịdị mfe, ma nkọwa ala peeji na-echekwa ókè okwu Greek ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “wee” mee ka usoro akụkọ ahụ bụrụ nke ebumpụta ụwa, ebe e debere ike na nhata nke okwu Greek.
