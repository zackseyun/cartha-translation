revisions:
- from: Ha wee bịaruo Jerusalem. Mgbe ọ banyere n'ụlọ nsọ[a], ọ malitere ịchụpụ ndị na-ere ihe na ndị na-azụ ihe n'ụlọ nsọ ahụ. Ọ kwaturu tebụl ndị na-agbanwe ego na oche ndị na-ere nduru.
  to: Ha wee bịarute Jerusalem. Mgbe ọ banyere n'ụlọ nsọ[a], ọ malitere ịchụpụ ndị na-ere ihe na ndị na-azụ ihe n'ụlọ nsọ ahụ, ma kwatuo tebụl ndị na-agbanwe ego na oche ndị na-ere nduru.
  rationale: The revision replaces an ambiguous arrival expression with idiomatic Standard Igbo, links the final coordinated action more closely to the source, and refines the footnote so that it accurately distinguishes the temple complex from the inner sanctuary without adding spatial detail beyond the Greek.
  reviewer_model: gpt-5.6-terra
