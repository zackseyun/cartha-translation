  text: ἀλλὰ εἴπωμεν· Ἐξ ἀνθρώπων;— ἐφοβοῦντο τὸν ⸀ὄχλον, ἅπαντες γὰρ εἶχον τὸν Ἰωάννην ⸂ὄντως ὅτι⸃ προφήτης ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: ig
  text: Ma ọ bụrụ na anyị asị[a], ‘O sitere n’aka mmadụ’?”—ha na-atụ ìgwè mmadụ ahụ egwu, n’ihi na onye ọ bụla kwenyere na Jọn bụ n’ezie onye amụma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “O sitere n’ụmụ mmadụ,” ma ọ bụ n’ụzọ kọwakwuru ya, “Ọ bụ ihe sitere n’aka mmadụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị okwu Grik ahụ, “n’ihi na onye ọ bụla weere Jọn dịka onye amụma n’ezie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ εἴπωμεν
  choice: Ma ọ bụrụ na anyị asị
  rationale: Na-egosi ụzọ ọzọ ha na-atụle, ma na-edobe ụdị okwu ọnọdụ dị na deliberative subjunctive ahụ nʼIgbo dị mfe.
- source_word: Ἐξ ἀνθρώπων
  choice: O sitere nʼaka mmadụ
  rationale: Nʼọnọdụ a, ọ na-ekwu na isi mmalite baptizim ma ọ bụ ikike Jọn bụ nke mmadụ, ọ bụghị nke Chineke. Igbo na-ejikarị ‘mmadụ’ nʼụdị mkpokọta gụnyere ụmụ mmadụ niile.
- source_word: ἐφοβοῦντο τὸν ὄχλον
  choice: ụjọ ìgwè mmadụ ahụ tụrụ ha
  rationale: Nke a bụ ụzọ Igbo sitere nʼọdịdị ya si kwuo na ha tụrụ ìgwè mmadụ ahụ egwu, ma na-eburu ọnọdụ egwu na-aga nʼihu nke imperfect ahụ.
- source_word: ἅπαντες γὰρ
  choice: nʼihi na onye ọ bụla
  rationale: ‘Onye ọ bụla’ na-egosi distributive force nke ἅπαντες; ‘nʼihi na’ na-ejikọta ihe kpatara egwu ha.
- source_word: εἶχον τὸν Ἰωάννην ὄντως ὅτι προφήτης ἦν
  choice: kwenyere nʼezie na Jọn bụ onye amụma
  rationale: Na-egosipụta echiche siri ike nke mmadụ niile banyere Jọn, na-edobekwa ike nke ὄντως nʼokwu ‘nʼezie’ nʼemeghị ka ọ bụrụ nkwupụta ọhụrụ sitere nʼọnụ onye na-akọ akụkọ.
theological_decisions:
- issue: Isi mmalite baptizim ma ọ bụ ikike Jọn nʼokwu Ἐξ ἀνθρώπων
  choice: O sitere nʼaka mmadụ
  alternative: O sitere nʼụmụ mmadụ; Ọ bụ ihe sitere nʼaka mmadụ
  rationale: Nhọrọ a na-edobe ọdịiche dị nʼetiti isi mmalite nke mmadụ na nke Chineke, ma ọ naghị agbakwụnye nkọwa karịa ihe Grik kwuru.
- issue: Ike na echiche dị nʼokwu ὄντως ὅτι προφήτης ἦν
  choice: onye ọ bụla kwenyere nʼezie na Jọn bụ onye amụma
  alternative: onye ọ bụla weere Jọn nʼezie dị ka onye amụma; onye ọ bụla weere Jọn dị ka onye amụma nʼezie
  rationale: Ọ na-edobe nkwenye nke ìgwè mmadụ ahụ na ike nke ὄντως, ma na-ahapụ okwu ahụ nʼime echiche ha kama ime ya nkwupụta nkà mmụta okpukpe kwụụrụ onwe ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji ‘ìgwè mmadụ’ mee ὄχλος, ‘onye amụma’ mee προφήτης, ma jiri akpaalaokwu Igbo ‘ụjọ ... tụrụ ha’ mee ἐφοβοῦντο. E tinyere akara ndetu ala ala [a] na [b] nʼederede bụ isi.
