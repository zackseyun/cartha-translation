    issue: Possible misplaced attachment of “nke na-abịa”
    rationale: In “alaeze nna anyị Devid nke na-abịa,” the relative clause can naturally be understood as qualifying “Devid.” The Greek participle qualifies βασιλεία (“kingdom”), so the Igbo wording should make that relationship clear.
  - severity: low
    issue: Footnote adds “anyị” (“us”) to the lexical alternatives
    rationale: The underlying expression is conventionally glossed “Save, please” or “Save now.” Adding “us” is understandable in context but goes beyond the concise lexical alternative supplied by the source audit trail.
