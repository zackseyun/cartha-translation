  text: Εὐλογημένη ἡ ἐρχομένη ⸀βασιλεία τοῦ πατρὸς ἡμῶν Δαυίδ· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/010.yaml
  text: Blessed is the coming kingdom of our father David! Hosanna in the highest![a]
translation:
  language: ig
  text: A gọziri alaeze na-abịa nke nna anyị Devid! Hosanna n’ebe kachasị elu![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Hosanna” nwere ike ịpụta, “Biko, zọpụta,” ma ọ bụ “Zọpụta ugbu a,” ọ bụ ezie na n’ebe a ọ na-arụ ọrụ dị ka mkpu otuto n’ofufe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογημένη
  choice: A gọziri
  rationale: Ọ bụ nkọwa e ji tie mkpu ngọzi; “A gọziri” na-edobe ụda ngọzi nke okwu Grik karịa ịsụgharị ya nanị dị ka otuto.
- source_word: ἡ ἐρχομένη βασιλεία
  choice: alaeze ... nke na-abịa
  rationale: Nke a na-egosipụta participle dị ugbu a nke Grik n'ụzọ doro anya ma dịkwa mfe nghọta n’Igbo, n’etinyeghị echiche ọzọ banyere mgbe ọ ga-emezu.
- source_word: βασιλεία
  choice: alaeze
  rationale: “Alaeze” bụ okwu Igbo kwesịrị ekwesị n’ebe a, karịchaa n’ihi njikọ ya na Devid na ọchịchị eze; ọ naghị emechi ụzọ n’echiche nke ọchịchị ma ọ bụ ógbè eze.
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: nna anyị Devid
  rationale: Nke a na-edobe aha nsọpụrụ nke nna nna ma jikọta alaeze ahụ na Devid n’enweghị ịgbakwunye nkọwa Mesaya n’ime amaokwu ahụ.
- source_word: Ὡσαννὰ
  choice: Hosanna
  rationale: N’ojiji Agba Ọhụrụ, okwu a aghọwo mkpu ofufe a na-asụgharịghị; e debere ihe ọ pụtara na mbụ n’ihe odide ala peeji.
- source_word: ἐν τοῖς ὑψίστοις
  choice: n’ebe kachasị elu
  rationale: Nke a na-edobe akpaala okwu Grik nkenke, n’akọwaghị ya kpọmkwem dị ka eluigwe kachasị elu ebe ederede ahụ n’onwe ya hapụrụ ya nkenke.
theological_decisions:
- issue: Ụdị mkpu banyere alaeze Devid
  choice: E gosipụtara ya ozugbo dị ka ngọzi nye alaeze nna anyị Devid nke na-abịa.
  alternative: A gọziri alaeze Mesaya nke nna anyị Devid nke na-abịa.
  rationale: Ọnọdụ okwu ahụ na-egosi olileanya Mesaya, ma Grik ekwughị okwu ahụ bụ “Mesaya.” Ịhapụ ya otú ahụ na-echekwa ihe ederede kwuru na esemokwu nkà mmụta okpukpe dị n’ime ya.
- issue: Ihe “Hosanna” na-arụ n’amaokwu a
  choice: E debere “Hosanna” dị ka mkpu ofufe na otuto.
  alternative: Biko, zọpụta anyị / Zọpụta anyị ugbu a.
  rationale: Okwu Hibru/Aramaik nke dị n’azụ ya malitere dị ka arịrịọ maka nzọpụta, ma n’ebe a ọ na-arụ ọrụ dịka mkpu ofufe; ihe odide ala peeji na-echekwa echiche abụọ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “A gọziri” maka ụda mkpu ngọzi, “nke na-abịa” iji dobe mmegharị participle Grik, ma hapụ “Hosanna” dị ka okwu ofufe amaara ama.
