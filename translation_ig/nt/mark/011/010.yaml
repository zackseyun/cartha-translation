  source_fidelity: The draft accurately renders the blessing, the Davidic kingdom, and the liturgical acclamation. However, in “alaeze nna anyị Devid nke na-abịa,” the relative clause may be read as modifying the immediately preceding “Devid,” rather than “alaeze.” Reordering makes the Greek syntactic sense unambiguous without adding interpretation. The footnote’s “anyị” in “zọpụta anyị” adds an object not expressed in the lexical gloss and is best omitted.
  naturalness: “A gọziri” and “Hosanna n’ebe kachasị elu” are natural, dignified Standard Igbo. Placing “na-abịa” directly after “alaeze” improves clarity and flow.
  terminology: “Alaeze,” “nna anyị Devid,” and the retained liturgical form “Hosanna” are appropriate. The revised note uses idiomatic language while retaining the plea/praise distinction.
