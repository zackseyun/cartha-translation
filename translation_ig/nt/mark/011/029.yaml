  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: ig
  text: Ma Jizọs sịrị ha, “M ga-ajụ unu otu ajụjụ.[a] Zaanụ m, m ga-agwakwa unu ikike dị aṅaa m ji eme ihe ndị a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu ihe,” ma ọ bụ n’ụzọ nkịtị karị, “otu okwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche n’azịza Jizọs nye ndị jụrụ ya ajụjụ n’amaokwu bu ụzọ.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Ụdị aha a bụ nke a na-ejikarị eme ihe n’Igbo Izugbe.
- source_word: εἶπεν αὐτοῖς
  choice: sịrị ha
  rationale: Nke a bụ ụzọ dị nkenke ma dịkwa eke isi kọwaa okwu onye gwara ọtụtụ mmadụ.
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: M ga-ajụ unu
  rationale: Na-egosi na Jizọs ga-ajụ ha ajụjụ nke ya dịka nzaghachi nye ajụjụ ha.
- source_word: ἕνα λόγον
  choice: otu ajụjụ
  rationale: Ọ bụ ezie na λόγος nwere ike ịpụta ‘okwu’ ma ọ bụ ‘ihe,’ ihe gbara ya gburugburu gosiri na ọ bụ ajụjụ a chọrọ ka a zaa.
- source_word: ἀποκρίθητέ μοι
  choice: Zaanụ m
  rationale: Na-echekwa iwu e nyere ọtụtụ ndị ka ha zaa Jizọs ozugbo.
- source_word: ἐρῶ ὑμῖν
  choice: m ga-agwakwa unu
  rationale: Na-egosi nkwa Jizọs na ọ ga-enye ha ozi ahụ ma ha zaa ya.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ikike m ji
  rationale: Ụdị a bụ Igbo eke maka ntọala ma ọ bụ ikike e ji eme ihe.
- source_word: ταῦτα ποιῶ
  choice: eme ihe ndị a
  rationale: Na-ezo aka n’omume Jizọs ndị a na-agbagha n’ebe a, ma na-echekwa oge ugbu a nke ngwaa Gris.
theological_decisions:
- issue: Ihe ἐξουσία pụtara n’ebe a
  choice: ikike
  alternative: ike; ikike ziri ezi
  rationale: ‘Ikike’ na-echekwa echiche banyere ikike ma ọ bụ nkwado ziri ezi Jizọs ji eme ihe, kama ime ka okwu ahụ bụrụ naanị ike mmadụ nwere.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E kewara nkwupụta mbụ na iwu sochirinụ ka okwu ahụ daa nke ọma n’Igbo, ebe a ka jikwa ‘-kwa’ jikọta nkwa nke na-esochi azịza ha.
