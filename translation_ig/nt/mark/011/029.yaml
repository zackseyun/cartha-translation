review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ response, his intent to ask one question, and the command to answer. However, “m ga-agwakwa unu ikike m ji eme ihe ndị a” omits the interrogative force of ἐν ποίᾳ ἐξουσίᾳ (“by what authority”). As written, it says he will tell them the authority he uses, rather than tell them what authority he uses.
  naturalness: The wording is generally clear and natural Standard Igbo. “Zaanụ m” is an appropriate plural imperative. Adding “dị aṅaa” makes the final clause both natural and explicitly faithful to the Greek question.
  terminology: “Ikike” appropriately renders ἐξουσία here as authority, preserving its sense of legitimate warrant rather than mere power. “Otu ajụjụ” is suitable for ἕνα λόγον in context.
  issues:
  - severity: medium
    issue: The interrogative element in “by what authority” is absent.
    rationale: ποίᾳ modifies ἐξουσίᾳ and must be represented. The current text lacks an equivalent of “what/which kind of,” potentially implying that Jesus will merely disclose his authority.
  revised_text: Ma Jizọs sịrị ha, “M ga-ajụ unu otu ajụjụ.[a] Zaanụ m, m ga-agwakwa unu ikike dị aṅaa m ji eme ihe ndị a.”
  revised_footnotes:
