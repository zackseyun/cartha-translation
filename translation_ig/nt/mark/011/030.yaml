  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: ig
  text: Baptizim nke Jọn ọ̀ sitere n’eluigwe ka ọ̀ sitere n’aka ụmụ mmadụ? Zaanụ m.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “sitere n’aka Chineke.” Grik sịrị, “sitere n’eluigwe,” nke na-echekwa akpaokwu ndị Juu ji egosi mmalite ma ọ bụ ikike sitere n’aka Chineke.
    reason: lexical_alternative
  - marker: b
    text: “Sitere n’aka ụmụ mmadụ” pụtara na o sitere n’aka mmadụ, ya bụ, na mmalite ya ma ọ bụ ikike ya bụ naanị nke mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: Baptizim Jọn
  rationale: Nkebi a na-ezo aka na baptizim Jọn na-eme ma ọ bụ nke e jikọtara ya na Jọn. “Baptizim Jọn” bụ ụzọ dị nkenke ma bụrụkwa nke a na-aghọta nke ọma n’Igbo.
- source_word: ἐξ οὐρανοῦ
  choice: sitere n’eluigwe
  rationale: Nke a na-edobe okwu Grik ahụ kpọmkwem na akpaokwu ndị Juu ji egosi na ihe sitere n’aka Chineke ma ọ bụ na o nwere ikike Chineke.
- source_word: ἐξ ἀνθρώπων
  choice: sitere n’aka mmadụ
  rationale: “Mmadụ” nwere ike ịgụnye ụmụ mmadụ n’ozuzu ha, ọ na-egosikwa ọdịiche dị n’etiti mmalite ma ọ bụ ikike sitere n’aka Chineke na nke sitere nanị n’aka mmadụ.
- source_word: ἀποκρίθητέ μοι
  choice: Zaanụ m
  rationale: Okwu iwu a na-achọ azịza ozugbo. Ụdị nsọpụrụ/otutu “Zaanụ” dabara n’Igbo ọkọlọtọ mgbe a na-agwa ọtụtụ ndị okwu.
- source_word: ἦν ἢ
  choice: ò sitere ... ka ò sitere ...?
  rationale: N’Igbo, iji “sitere” kwuo ebe ihe malitere ma ọ bụ ebe ikike ya si bụrụ ihe eke karịa ịsụgharị ngwaa ahụ n’ụzọ siri ike, ma ọ ka na-edobe ajụjụ nhọrọ abụọ ahụ.
theological_decisions:
- issue: Ihe “sitere n’eluigwe” pụtara n’ajụjụ Jizọs
  choice: E debere “sitere n’eluigwe” n’ahịrịokwu bụ isi.
  alternative: sitere n’aka Chineke
  rationale: Nke a na-echekwa akpaokwu nkwanye ùgwù ndị Juu ji ekwu banyere Chineke, na-enweghị ime ka nkọwa ya bụrụ naanị otu ihe n’ahịrịokwu bụ isi.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị ùgwù ma doo ndị nkịtị anya. E ji akara ụda olu n’ajụjụ “ò” nyere aka igosi ajụjụ nhọrọ, ma e zere asụsụ ụka nke otu denominashọn.
