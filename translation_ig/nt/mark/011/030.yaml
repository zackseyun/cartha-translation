    reason: lexical_alternative
  - marker: b
    text: “Sitere n’aka ụmụ mmadụ” pụtara na o sitere n’aka mmadụ, ya bụ, na mmalite ya ma ọ bụ ikike ya bụ naanị nke mmadụ.
    reason: lexical_alternative
  revision_rationale: The revision retains the Greek’s ‘heaven’ idiom and Jesus’ demand for an answer, while making the human-source alternative explicitly plural/generic as in ἀνθρώπων. It also uses a more transparent Igbo genitive expression for John’s baptism. The footnotes retain interpretation as a note rather than moving it into the main text.
