revisions:
- from: Baptizim Jọn, ò sitere n’eluigwe ka ò sitere n’aka mmadụ? Zaanụ m.[a][b]
  to: Baptizim nke Jọn ọ̀ sitere n’eluigwe ka ọ̀ sitere n’aka ụmụ mmadụ? Zaanụ m.[a][b]
  rationale: The revision retains the Greek’s ‘heaven’ idiom and Jesus’ demand for an answer, while making the human-source alternative explicitly plural/generic as in ἀνθρώπων. It also uses a more transparent Igbo genitive expression for John’s baptism. The footnotes retain interpretation as a note rather than moving it into the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the twofold contrast in the Greek—origin/authority ‘from heaven’ versus ‘from human beings’—and renders the direct imperative appropriately. However, the singular mmadụ in the main text weakens the explicitly plural generic ἀνθρώπων. Using ụmụ mmadụ better represents the source without losing the contrast.
  naturalness: The revised wording is idiomatic Standard Igbo. ‘Baptizim nke Jọn’ clearly expresses the genitive relationship, and the repeated ọ̀ with sitere makes the alternative question easy to follow.
  terminology: ‘Baptizim,’ ‘eluigwe,’ and ‘Zaanụ m’ are suitable, established terms/register. ‘Sitere n’eluigwe’ should remain in the text, rather than replacing it with an interpretive reference to God.
  issues:
  - severity: medium
    issue: The main text has ‘sitere n’aka mmadụ.’
    rationale: The Greek ἐξ ἀνθρώπων is plural and generic (‘from human beings/people’). Although mmadụ can sometimes be generic in Igbo, ụmụ mmadụ is clearer and more faithful here, especially since the footnote itself explains the plural sense.
  - severity: low
    issue: ‘Baptizim Jọn’ is somewhat compressed.
    rationale: It is understandable, but ‘Baptizim nke Jọn’ more transparently represents τὸ βάπτισμα τὸ Ἰωάννου in formal modern Standard Igbo.
  revised_text: Baptizim nke Jọn ọ̀ sitere n’eluigwe ka ọ̀ sitere n’aka ụmụ mmadụ? Zaanụ m.[a][b]
