  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτῇ· Μηκέτι ⸂εἰς τὸν αἰῶνα ἐκ σοῦ⸃ μηδεὶς καρπὸν φάγοι. καὶ ἤκουον οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: ig
  text: O wee zaa[a] sị ya, “Ka onye ọ bụla ghara iri mkpụrụ n’ahụ gị mgbe ọ bụla ọzọ.”[b] Ndị na-eso ụzọ ya na-egekwa ntị.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị karị: “O wee zaa, sị ya.” Okwu Grik a sụgharịrị “zaa” bụ akpaalaokwu a na-ejikarị kọọ akụkọ, ọbụna mgbe e deghị okwu onye ọzọ kwuru tupu ya.'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “Ka onye ọ bụla ghara iri mkpụrụ n’ahụ gị ọzọ ruo mgbe ebighị ebi.” N’ụzọ nkịtị, okwu Grik ahụ bụ “ruo n’ọgbọ ahụ,” ma ebe a ọ bụ akpaalaokwu na-egosi oge na-enweghị ọgwụgwụ.'
    reason: alternative_reading
  - marker: c
    text: 'A pụkwara ịsụgharị imperfect Grik ahụ: “Ndị na-eso ụzọ ya nụrụ ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: O wee zaghachi
  rationale: Nke a na-echekwa echiche nke ‘ịza’ ma ọ bụ ‘ịzaghachi,’ bụ́ akpaalaokwu a na-ahụkarị n’akụkọ Grik ọbụna mgbe e deghị okwu onye ọzọ kwuru tupu ya.
- source_word: αὐτῇ
  choice: sị ya
  rationale: Nnọchiaha ahụ na-ezo aka n’osisi fig ahụ. ‘Ya’ bụ ụzọ Igbo si ekwu ya n’enweghị itinye okike ụtọasụsụ Grik n’asụsụ Igbo.
- source_word: Μηκέτι … εἰς τὸν αἰῶνα
  choice: ọzọ ruo mgbe ebighị ebi
  rationale: Njikọ okwu abụọ a na-egosi na iri mkpụrụ ya ga-akwụsị kpamkpam, ọ bụghị naanị nwa oge.
- source_word: ἐκ σοῦ
  choice: n’ahụ gị
  rationale: Jizọs na-agwa osisi ahụ okwu ihu na ihu. N’Igbo, ‘mkpụrụ n’ahụ gị’ bụ ụzọ dị ndụ ma doo anya isi kwuo mkpụrụ sitere n’osisi ahụ.
- source_word: μηδεὶς
  choice: onye ọ bụla ghara
  rationale: N’usoro ‘Ka … ghara,’ nke a na-egosipụta onye na-adịghị onye ọ bụla n’ụzọ Igbo na-ada nke ọma.
- source_word: καρπὸν
  choice: mkpụrụ
  rationale: Okwu a bụ aha mkpụrụ n’ozuzu ya; ‘mkpụrụ’ bụ okwu Igbo nkịtị ma kwekọọ n’ebe a.
- source_word: φάγοι
  choice: Ka … ghara iri
  rationale: Aorist optative a na-egosi ọchịchọ ma ọ bụ ikpe a na-ekwupụta, ọ bụghị naanị amụma banyere ihe ga-eme.
- source_word: ἤκουον
  choice: nọkwa na-ege ntị
  rationale: Imperfect ahụ nwere ike igosi ihe na-aga n’ihu; okwu a na-echekwa echiche na ndị na-eso ụzọ ya nọ na-anụ okwu ahụ mgbe ọ na-ekwu ya.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Ndị na-eso ụzọ ya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi sụgharịa okwu njirimara ahụ.
theological_decisions:
- issue: Ụdị okwu Jizọs gwara osisi fig ahụ
  choice: Ka onye ọ bụla ghara iri mkpụrụ n’ahụ gị ọzọ ruo mgbe ebighị ebi.
  alternative: Ọ dịghị onye ga-eri mkpụrụ n’ahụ gị ọzọ ruo mgbe ebighị ebi.
  rationale: φάγοι bụ optative nke na-egosi ọchịchọ ma ọ bụ ọbụbụ ọnụ/ikpe a na-ekwupụta, kama ịbụ naanị future indicative nke na-ebu amụma. Usoro ‘Ka … ghara’ na-echekwa ike ahụ n’Igbo.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. Usoro ‘Ka … ghara’ na-echekwa ụdị ọchịchọ/ikpe dị na optative Grik. E chekwaghị okike ụtọasụsụ nke αὐτῇ n’ihi na Igbo anaghị akpa nnọchiaha okike otú Grik si eme.
