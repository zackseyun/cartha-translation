revisions:
- from: O wee zaghachi[a] sị ya, “Ka onye ọ bụla ghara iri mkpụrụ n’ahụ gị ọzọ ruo mgbe ebighị ebi.”[b] Ndị na-eso ụzọ ya nọkwa na-ege ntị.[c]
  to: O wee zaa[a] sị ya, “Ka onye ọ bụla ghara iri mkpụrụ n’ahụ gị mgbe ọ bụla ọzọ.”[b] Ndị na-eso ụzọ ya na-egekwa ntị.[c]
  rationale: The revision retains the source’s imprecatory optative and its emphatic permanent sense while using a natural Igbo main-line expression, “mgbe ọ bụla ọzọ.” Footnote b now supplies the valid fuller alternative, “ọzọ ruo mgbe ebighị ebi,” and explains the Greek idiom. The disciples’ imperfect action remains durative in the main text.
