    issue: Footnote b duplicates the main text.
    rationale: An alternative-reading footnote must give a distinct legitimate rendering. As written, it provides no alternative and its literal gloss is not adequately connected to the idiomatic force of εἰς τὸν αἰῶνα.
  - severity: low
    issue: The main narrative verb can be made more direct.
    rationale: “O wee zaa sị ya” preserves the conventional Greek narrative idiom without suggesting a stronger prior exchange than the text requires.
