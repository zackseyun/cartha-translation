  text: καὶ ⸀φέρουσιν τὸν πῶλον πρὸς τὸν Ἰησοῦν, καὶ ⸀ἐπιβάλλουσιν αὐτῷ τὰ ἱμάτια αὐτῶν, καὶ ἐκάθισεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/007.yaml
  text: And they brought the colt to Jesus, and they threw their cloaks on it, and he sat on it.
translation:
  language: ig
  text: Ha kpọtara nwa ịnyịnya ibu ahụ nye Jizọs, tụkwasị ya uwe elu ha, Jizọs wee nọdụ n’elu ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: nwa ịnyịnya ibu
  rationale: N’akụkọ a, okwu ahụ na-ezo aka n’anụmanụ nta e ji agba, ya bụ nwa ịnyịnya ibu; nsụgharị a doro onye Igbo nke oge a anya.
- source_word: ἐπιβάλλουσιν
  choice: tụkwasị
  rationale: Ọ pụtara ịtụ ma ọ bụ ịkwasị ihe n’elu ihe ọzọ; “tụkwasị” na-egosi na ha tinyere uwe mwụda ha n’elu anụmanụ ahụ.
- source_word: ἱμάτια
  choice: uwe mwụda
  rationale: Ọ na-ezo aka n’uwe ndị a na-eyi n’elu uwe ndị ọzọ, ọ bụghị naanị uwe n’ozuzu.
- source_word: ἐκάθισεν ἐπ’ αὐτόν
  choice: Jizọs wee nọkwasị n’elu ya
  rationale: E kpọghachiri Jizọs aha iji mee ka onye mere ihe ahụ doo anya n’Igbo, ebe “nọkwasị n’elu ya” na-edobe echiche Grik ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke dị mfe, dị ugwu, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. E tinyere aha Jizọs n’ahịrị ikpeazụ iji zere mgbagwoju anya nke nnọchiaha n’Igbo.
