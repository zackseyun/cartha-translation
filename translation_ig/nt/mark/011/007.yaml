review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the sequence and referents of the Greek: they bring the colt to Jesus, place their garments on it, and Jesus sits on it. A small adjustment makes πρὸς clearer as ‘nye Jizọs’ and renders ἱμάτια more precisely as outer garments.'
  naturalness: The revision uses clearer contemporary Standard Igbo word order and the straightforward verb phrase ‘nọdụ n’elu ya’ for sitting on the colt.
  terminology: ‘nwa ịnyịnya ibu’ appropriately identifies πῶλος in this context. ‘uwe elu’ is more precise and idiomatic for ἱμάτια, garments worn over other clothing, than ‘uwe mwụda.’
  issues:
  - severity: low
    issue: ‘kpọtaara Jizọs’ can be read as bringing the colt for Jesus rather than explicitly to him.
    rationale: The Greek πρὸς τὸν Ἰησοῦν directly marks the destination; ‘kpọtara ... nye Jizọs’ states this clearly.
  - severity: low
    issue: ‘uwe mwụda’ is less precise for ἱμάτια.
    rationale: In this context ἱμάτια denotes outer garments/cloaks; ‘uwe elu’ communicates this without over-specifying the garment type.
  - severity: low
    issue: ‘nọkwasị n’elu ya’ is less direct than the ordinary verb for sitting.
    rationale: ‘Jizọs wee nọdụ n’elu ya’ is natural Standard Igbo and accurately expresses ἐκάθισεν ἐπ’ αὐτόν.
  revised_text: Ha kpọtara nwa ịnyịnya ibu ahụ nye Jizọs, tụkwasị ya uwe elu ha, Jizọs wee nọdụ n’elu ya.
