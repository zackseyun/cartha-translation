id: MRK.11.3
reference: Mark 11:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ· Τί ποιεῖτε τοῦτο; εἴπατε ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει· καὶ ⸀εὐθὺς αὐτὸν ἀποστέλλει ⸀πάλιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: ig
  text: Ọ bụrụkwa na onye ọ bụla asị unu, ‘Gịnị mere unu ji eme nke a?’ sịnụ, ‘Onyenwe[a] chọrọ ya,’ ọ ga-ezighachi ya ebe a ozugbo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘Nna ukwu.’ Okwu Grik κύριος nwere ike ịpụta ‘Onyenwe’ ma ọ bụ ‘nna ukwu’; ebe a, a sụgharịrị ya ‘Onyenwe’ dịka ọnọdụ Oziọma Mak si dị.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, ‘ọ na-ezighachi ya ebe a ozugbo.’ Ngwaa Grik ἀποστέλλει dị n’ụdị ugbu a, ma n’ọnọdụ a, a pụkwara ịghọta ya dịka ihe ga-eme n’ọdịnihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: ọ bụrụ na onye ọ bụla asị unu
  rationale: Nke a na-edobe ọnọdụ ghe oghe nke ἐάν tinyere subjunctive, ma bụrụkwa okwu Igbo dị mfe ma kwekọọ n’ọnọdụ ga-ekwe omume n’ọdịnihu.
- source_word: Τί ποιεῖτε τοῦτο;
  choice: Gịnị mere unu ji eme nke a?
  rationale: N’ebe a, ajụjụ ahụ bụ ịma ihe mere ha ji eme omume ahụ, ọ bụghị naanị ịjụ ụdị ihe ha na-eme; nsụgharị a na-egosipụta aka mgba dị n’ajụjụ Grik ahụ n’Igbo nkịtị.
- source_word: εἴπατε
  choice: unu asị
  rationale: Ọ bụ iwu a gwara ọtụtụ mmadụ; ‘unu asị’ na-egosipụta nke ahụ n’ụzọ doro anya.
- source_word: Ὁ κύριος
  choice: Onyenwe
  rationale: ‘Onyenwe’ na-edobe κύριος dị ka aha nsọpụrụ e ji kpọọ Jizọs n’akụkọ a, na-agbakwụnyeghị nnọchiaha ‘anyị’ nke na-adịghị na Grik.
- source_word: αὐτοῦ χρείαν ἔχει
  choice: chọrọ ya
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma doo anya isi kwuo na Onyenwe nwere mkpa nwa ịnyịnya ibu ahụ; ‘ya’ na-ezo aka n’anụmanụ ahụ.
- source_word: εὐθὺς
  choice: ozugbo
  rationale: ‘Ozugbo’ na-egosipụta ọsọ na ịdị ngwa nke εὐθύς, nke Mak na-ejikarị eme ihe.
- source_word: ἀποστέλλει
  choice: ga-ezigachi
  rationale: Ọ bụ ezie na ụdị ngwaa Grik bụ present, ihe ọ pụtara n’ọnọdụ a nwere ike ịbụ ihe ga-eme ozugbo e kwuchara okwu ahụ; ọdịnihu Igbo na-eme ka nke a doo anya.
- source_word: πάλιν ὧδε
  choice: ya ebe a
  rationale: ‘Ezigachi ya ebe a’ na-egosipụta n’ụzọ ebumpụta ụwa na a ga-eweghachi anụmanụ ahụ n’ebe a; echiche πάλιν nke nlọghachi dị n’ime ngwaa ‘ezigachi’ n’ọnọdụ a.
theological_decisions:
- issue: Onye κύριος na-ezo aka na ya na ike aha ahụ nwere
  choice: A sụgharịrị ya ‘Onyenwe,’ dị ka aha nsọpụrụ na-ezo aka na Jizọs.
  alternative: ‘Nna ukwu’ ma ọ bụ ‘onye nwe ya,’ dị ka onye nwe anụmanụ ahụ n’echiche nkịtị.
  rationale: N’akụkọ Mak, Jizọs bụ onye na-enye iwu ahụ, κύριος nwekwara ike ibu aha nsọpụrụ karịrị naanị onye nwe ihe. ‘Onyenwe’ na-edobe ike ahụ n’ebughị ozizi ọzọ na-adịghị n’amaokwu ahụ.
- issue: Onye bụ isiokwu nke ἀποστέλλει
  choice: ‘onye ahụ ga-ezigachi’—ya bụ, onye jụrụ ndị na-eso ụzọ ajụjụ ahụ.
  alternative: 'E nwere ike ịghọta isiokwu ahụ n’enweghị ịkpọ ya aha kpọmkwem: ‘a ga-ezigachi ya.’'
  rationale: Grik hapụrụ isiokwu ahụ n’ime ngwaa onye nke atọ; n’usoro okwu a, onye jụrụ ajụjụ bụ onye kacha nso e nwere ike ịghọta dị ka onye ga-eziga ya. ‘Onye ahụ’ na-eme ka Igbo dị mfe nghọta n’ebughị onye ọhụrụ n’akụkọ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Gịnị mere unu ji…?’ maka ajụjụ aka mgba ahụ, ‘Onyenwe’ iji zere ịgbakwunye ‘anyị’ na-adịghị na Grik, na ‘ezigachi’ iji mee ka echiche iziga ihe azụ pụta ìhè n’Igbo.
