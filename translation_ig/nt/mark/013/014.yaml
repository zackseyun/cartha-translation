revisions:
- from: Ma mgbe unu hụrụ “ihe arụ nke na-eweta ịtọgbọrọ n’efu” ka ọ kwụ ebe ọ na-ekwesịghị ịnọ (ka onye na-agụ ya ghọta)[a], mgbe ahụ, ka ndị nọ na Judia gbaga n’ugwu[b],
  to: Ma mgbe unu hụrụ “ihe arụ nke mbibi” ka o guzoro ebe ọ na-ekwesịghị ịdị (ka onye na-agụ ya ghọta)[a], mgbe ahụ ka ndị nọ na Judia gbaga n’ugwu[b],
  rationale: The revision removes the causative expansion from the Danielic expression, uses clearer contemporary Igbo for desolation, and improves the expression of the participle’s resultant standing state. It preserves the source ambiguity regarding the referent and retains both required footnote anchors and their functions.
