reference: Mark 13:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως ⸀ἑστηκότα ὅπου οὐ δεῖ, ὁ ἀναγινώσκων νοείτω, τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: ig
  text: Ma mgbe unu hụrụ “ihe arụ nke mbibi” ka o guzoro ebe ọ na-ekwesịghị ịdị (ka onye na-agụ ya ghọta)[a], mgbe ahụ ka ndị nọ na Judia gbaga n’ugwu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, akụkụ okwu a sụgharịrị “ka o guzoro” dị n’ụdị nwoke; ya mere, ọ pụrụ ịpụta, “ka onye ahụ guzoro ebe o kwesịghị ịdị.”
    reason: alternative_reading
  - marker: b
    text: Okwu “ihe arụ nke mbibi” na-ekwughachi okwu dị n’akwụkwọ Daniel (lee Dan. 9:27; 11:31; 12:11).
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Ma mgbe
  rationale: “Mgbe” na-egosi ọnọdụ oge, ebe “ma” na-ejikọta okwu a na ịdọ aka ná ntị gara aga n’enweghị ime ka ọdịiche ahụ sie ike karịa Grik.
- source_word: ἴδητε
  choice: unu hụrụ
  rationale: Ọ bụ ụzọ Igbo dị mfe ma kwekọọ n’ụdị onye nke abụọ n’ọnụọgụ ọtụtụ dị na Grik.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: “ihe arụ nke na-eweta ịtọgbọrọ n’efu”
  rationale: “Ihe arụ” na-egosi ihe a na-asọ oyi n’ihu Chineke; nkebi nke ọzọ na-edobe njikọ ya na ịtọgbọrọ n’efu ma ghara ịkọwa kpọmkwem onye ma ọ bụ ihe okwu a na-ezo aka na ya.
- source_word: ἑστηκότα
  choice: ka ọ kwụ
  rationale: Na-egosipụta ọnọdụ dị ugbu a nke sitere n’ịkwụnye ma ọ bụ ịbịa guzo, ma na-edobe ihe oyiyi doro anya nke Grik.
- source_word: ὅπου οὐ δεῖ
  choice: ebe ọ na-ekwesịghị ịnọ
  rationale: Na-egosipụta na ebe ahụ abụghị ebe kwesịrị ekwesị; nnọchiaha “ọ” na-ekwe ka isiokwu ahụ nọgide nwee ntakịrị mgbagwoju anya n’Igbo.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: ka onye na-agụ ya ghọta
  rationale: Na-edobe ndụmọdụ etinyere n’etiti okwu ahụ ma na-asụ ya n’Igbo nkịtị.
- source_word: τότε
  choice: mgbe ahụ
  rationale: Na-egosi ihe ndị ahụ ga-eme ozugbo ihe ịrịba ama ahụ pụtara.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: ndị nọ na Judia
  rationale: Na-edobe kpọmkwem ebe ala ahụ na ndị nọ n’ime ya.
- source_word: φευγέτωσαν
  choice: ka ... gbaga
  rationale: Na-edobe iwu ngwa ngwa nke onye nke atọ n’ọnụọgụ ọtụtụ.
- source_word: εἰς τὰ ὄρη
  choice: n’ugwu
  rationale: Ọ bụ ntụgharị Igbo kwesịrị ekwesị nke na-egosi ebe mgbaba ahụ bụ ugwu.
theological_decisions:
- issue: Ihe okwu Daniel, βδέλυγμα τῆς ἐρημώσεως, na-ezo aka na ya
  choice: Edobere ya dịka “ihe arụ nke na-eweta ịtọgbọrọ n’efu” n’akọwaghị kpọmkwem ihe omume, ihe, ma ọ bụ onye ọ bụ.
  alternative: “ihe arụ nke ịtọgbọrọ n’efu” ma ọ bụ ịkpọ ya kpọmkwem ihe arụ na-emebi ebe nsọ
  rationale: Okwu ahụ nwere njikọ siri ike na Daniel, ma ihe ọ na-ezo aka na ya ka a na-arụrịta ụka; ntụgharị ekwesịghị idozi mgbagwoju anya ahụ n’isi ederede.
- issue: Ụdị nwoke nke ἑστηκότα na-eso aha etiti βδέλυγμα
  choice: E ji nnọchiaha Igbo “ọ,” nke na-adịghị egosi okike ụtọasụsụ, mee ka okwu ahụ dị mfe ma debe mgbagwoju anya ya; nkọwa ala peeji kọwara na Grik nwere ike ịtụ aka n’onye.
  alternative: “ka onye ahụ kwụ ebe o kwesịghị ịnọ”
  rationale: Grik nwere ihe isi ike n’ụtọasụsụ nke nwere ike igosi onye nọ n’azụ okwu ahụ, mana ịkpọ ya “onye ahụ” n’isi ederede ga-akọwa ihe ederede ahụ karịa ka o mere.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. E debere ụda ịdọ aka ná ntị na iwu ngwa ngwa nke amaokwu ahụ, ma zere ịkpọpụta nkọwa akụkọ ihe mere eme ma ọ bụ nke otu ụka.
