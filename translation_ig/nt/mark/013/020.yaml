revisions:
- from: Ọ bụrụkwa na Onyenwe anyị emeghị ka ụbọchị ndị ahụ dị mkpụmkpụ, ọ dịghị anụ ahụ ọ bụla a gaara azọpụta.[a] Ma n’ihi ndị a họọrọ, bụ́ ndị ọ họọrọ, o mere ka ụbọchị ndị ahụ dị mkpụmkpụ.
  to: Ọ bụrụkwa na Onyenweanyị emeghị ka ụbọchị ndị ahụ dị mkpụmkpụ, ọ dịghị mmadụ ọ bụla a gaara azọpụta.[a] Ma n’ihi ndị a họọrọ, bụ́ ndị Onyenweanyị họọrọ, o mere ka ụbọchị ndị ahụ dị mkpụmkpụ.
  rationale: 'The revision replaces the unnatural literal rendering anụ ahụ in the main text with mmadụ ọ bụla, which conveys the established biblical idiom’s meaning here: no human being would be saved/alive. The footnote preserves the literal image. It also identifies Onyenweanyị as the one who chose the elect, matching the Greek antecedent while maintaining the text’s theological restraint.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:21:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'The conditional construction, the two occurrences of ‘cut short,’ and the reference to the elect whom the Lord chose are faithfully represented. However, ‘ọ dịghị anụ ahụ ọ bụla a gaara azọpụta’ is not a natural Igbo way to use the biblical idiom πᾶσα σάρξ: in ordinary Igbo, anụ ahụ denotes physical flesh/body and cannot naturally be the recipient of salvation. The idiom’s referent, humanity, should be used in the main text, with the literal wording retained in a note.'
  naturalness: The revised wording uses standard, clear Igbo. ‘Onyenweanyị’ is the conventional biblical form, and explicitly naming him in the relative clause avoids an unnecessary ambiguity in ‘ndị ọ họọrọ.’
  terminology: ‘Onyenweanyị,’ ‘a họọrọ,’ and ‘azọpụta’ suitably retain the passage’s biblical register and theological breadth without imposing a doctrinal account of election or narrowing salvation to spiritual salvation. ‘Mmadụ ọ bụla’ properly conveys πᾶσα σάρξ in this context.
  issues:
  - severity: medium
    issue: ‘Anụ ahụ ọ bụla’ is used as the main-text equivalent of πᾶσα σάρξ.
    rationale: Although ‘flesh’ is literal at the word level, anụ ahụ in Standard Igbo ordinarily denotes bodily flesh/the body, not ‘any human being.’ The resulting phrase is unnatural and risks implying that literal flesh, rather than persons, is saved. The source idiom should be translated by its contextual referent and explained literally in a footnote.
  - severity: low
    issue: The antecedent of ‘ọ’ in ‘bụ́ ndị ọ họọrọ’ is less explicit than the Greek context requires in Igbo.
    rationale: The Greek verb’s subject is supplied from κύριος in the preceding clause. Repeating ‘Onyenweanyị’ in the relative clause is natural Igbo and makes the referent unambiguous.
  revised_text: Ọ bụrụkwa na Onyenweanyị emeghị ka ụbọchị ndị ahụ dị mkpụmkpụ, ọ dịghị mmadụ ọ bụla a gaara azọpụta.[a] Ma n’ihi ndị a họọrọ, bụ́ ndị Onyenweanyị họọrọ, o mere ka ụbọchị ndị ahụ dị mkpụmkpụ.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ dịghị onye ọ bụla a gaara azọpụta.” N’ụzọ nkịtị, “ọ dịghị anụ ahụ ọ bụla.”
    reason: lexical_alternative
  revision_rationale: 'The revision replaces the unnatural literal rendering anụ ahụ in the main text with mmadụ ọ bụla, which conveys the established biblical idiom’s meaning here: no human being would be saved/alive. The footnote preserves the literal image. It also identifies Onyenweanyị as the one who chose the elect, matching the Greek antecedent while maintaining the text’s theological restraint.'
