id: MRK.13.20
reference: Mark 13:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: ig
  text: Ọ bụrụkwa na Onyenweanyị emeghị ka ụbọchị ndị ahụ dị mkpụmkpụ, ọ dịghị mmadụ ọ bụla a gaara azọpụta.[a] Ma n’ihi ndị a họọrọ, bụ́ ndị Onyenweanyị họọrọ, o mere ka ụbọchị ndị ahụ dị mkpụmkpụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ dịghị onye ọ bụla a gaara azọpụta.” N’ụzọ nkịtị, “ọ dịghị anụ ahụ ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: mere ka ... dị mkpụmkpụ
  rationale: Nke a na-egosipụta ime ka oge ahụ dị mkpụmkpụ ma na-edobe otu nsụgharị ahụ n’ebe ngwaa ahụ pụtara ugboro abụọ.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha Igbo a na-ejikarị asụgharị κύριος mgbe ọ na-ezo aka n’Onyenwe anyị dị ka onye a maara kpọmkwem.
- source_word: τὰς ἡμέρας
  choice: ụbọchị ndị ahụ
  rationale: Ngosipụta “ndị ahụ” na-ejikọta ụbọchị ndị a na oge mkpagbu a kọwara n’amaokwu ndị bu ụzọ, n’enweghị ịkọwakwu ihe ederede ahụ na-ekwughị.
- source_word: οὐκ ἂν ἐσώθη
  choice: ọ dịghị ... a gaara azọpụta
  rationale: Ụdị “a gaara” na-egosipụta ihe gaara eme ma a sị na Onyenwe anyị emeghị ka ụbọchị ndị ahụ dị mkpụmkpụ; “azọpụta” na-edobe obosara ihe σῴζω pụtara.
- source_word: πᾶσα σάρξ
  choice: ọ dịghị anụ ahụ ọ bụla
  rationale: A na-edobe okwu ihe atụ ahụ nke pụtara mmadụ dị ndụ n’ozuzu ya; ihe odide ala peeji na-enye nghọta Igbo ka mfe.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: n’ihi ndị a họọrọ
  rationale: “N’ihi” na-egosipụta ihe kpatara ma ọ bụ ndị e mere ihe ahụ maka ha, ebe “ndị a họọrọ” bụ Igbo doro anya nke na-adịghị ewebata nkọwa ụka pụrụ iche.
- source_word: οὓς ἐξελέξατο
  choice: bụ́ ndị ọ họọrọ
  rationale: Nke a na-asụgharị nkebi njikọ ahụ n’ụzọ kpọmkwem ma na-edobe nkwughachi mgbọrọgwụ okwu ἐκλεκτούς/ἐξελέξατο dị n’asụsụ Grik.
theological_decisions:
- issue: Ihe “a gaara azọpụta” pụtara n’ebe a
  choice: E debere “azọpụta,” ebe ọnọdụ okwu ahụ na-egosi ichebe ndụ mmadụ n’oge mkpagbu.
  alternative: “A gaara ahapụ ndụ” ma ọ bụ “a gaara alanarị.”
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ mbibi na ọnwụ n’oge mkpagbu. Ma ide “azọpụta” na-edobe obosara okwu Grik ma ghara ime ka ọ bụrụ naanị nkwupụta banyere nzọpụta ime mmụọ.
- issue: Ndị “a họọrọ” bụ ndị ole
  choice: E debere aha ahụ n’enweghị ịkọwa usoro ma ọ bụ ọdịdị nhọpụta ahụ.
  alternative: Ịkọwa ya kpọmkwem dị ka nhọpụta otu ìgwè ma ọ bụ nhọpụta onye n’otu n’otu tupu oge eruo.
  rationale: Amaokwu ahụ kwuru na Chineke họọrọ ha, ma ọ naghị edozi arụmụka sara mbara banyere ozizi nhọpụta; nsụgharị ahụ na-ahapụ esemokwu ahụ dịka ederede si dị.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “anụ ahụ” debe ihe atụ Akwụkwọ Nsọ dị na σάρξ, ebe ihe odide ala peeji kọwara na ọ pụtara mmadụ ọ bụla. E ji “ndị a họọrọ” kama okwu nkà mmụta okpukpe siri ike iji zere itinye ozizi otu ụka n’ime ederede.
