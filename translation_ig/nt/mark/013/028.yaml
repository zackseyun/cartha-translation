review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the imperative to learn from the fig tree, the illustrative term παραβολή, the seasonal signs, and the conclusion that summer is near. It appropriately preserves ἤδη with “adịlarị” and does not add an unwarranted temporal “now.” However, “ya epupụta akwụkwọ ndụ” is structurally unclear and does not naturally maintain “alaka” (branch) as the subject of ἐκφύῃ.
  naturalness: 'Most of the verse is clear Standard Igbo. Recasting the second plant-growth predicate with an explicit pronoun yields a natural, unambiguous conditional description: the branch becomes tender and it puts out leaves.'
  terminology: “Ilu” is an established Gospel rendering for παραβολή. The attached footnote responsibly gives “ihe mmụta” and “ihe atụ” as contextual alternatives without imposing an interpretation. “Oge ọkọchị” and “dị nso” accurately and naturally render θέρος and ἐγγύς.
  issues:
  - severity: medium
    issue: Unclear subject and awkward verb construction in “ya epupụta akwụkwọ ndụ.”
    rationale: After “alaka ya adịlarị nro,” the phrase “ya epupụta” is not a clear or natural Standard Igbo continuation. The Greek has the fig tree’s branch as the singular subject of both “becomes tender” and “puts out leaves.” Using “ma ọ na-epupụta akwụkwọ ndụ” clearly retains that subject and expresses the general seasonal observation.
  revised_text: 'Mụtanụ ilu[a] site n’osisi fiig: mgbe alaka ya adịlarị nro ma ọ na-epupụta akwụkwọ ndụ, unu na-amara na oge ọkọchị dị nso.'
  revised_footnotes:
