    text: Ma ọ bụ “ihe mmụta” ma ọ bụ “ihe atụ” n’ọnọdụ “ilu.”
    reason: lexical_alternative
  revision_rationale: The sole revision clarifies and naturalizes the clause rendering ἐκφύῃ τὰ φύλλα while preserving the fig branch as its subject, the general temporal force of ὅταν, and the already-attained tenderness indicated by ἤδη. The footnote anchor remains directly attached to “ilu.”
