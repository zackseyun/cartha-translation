source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: ig
  text: 'Mụtanụ ilu[a] site n’osisi fiig: mgbe alaka ya adịlarị nro ma ọ na-epupụta akwụkwọ ndụ, unu na-amara na oge ọkọchị dị nso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ihe mmụta” ma ọ bụ “ihe atụ” n’ọnọdụ “ilu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: site n’osisi fiig
  rationale: ἀπό na-egosi ebe a na-enweta ihe mmụta. A naghị etinye okwu oge dịka “ugbu a,” n’ihi na δέ bụ naanị njikọ dị fechaa n’ebe a.
- source_word: μάθετε
  choice: Mụtanụ
  rationale: Ọ bụ iwu aorist nke na-agwa ọtụtụ ndị ka ha nata ihe mmụta; “Mụtanụ” bụ ntụgharị kpọmkwem ma bụrụkwa Igbo nkịtị.
- source_word: τὴν παραβολήν
  choice: ilu[a]
  rationale: παραβολή bụ ntụnyere e ji akụzi ihe. “Ilu” na-echekwa ụdị okwu a na-ejikarị eme ihe n’Oziọma, ebe nkọwa ala peeji na-egosi na ọ pụkwara ịpụta ihe mmụta ma ọ bụ ihe atụ.
- source_word: ὅταν
  choice: mgbe
  rationale: ὅταν na subjunctive na-ewebata ọnọdụ oge nke na-emekarị; “mgbe” na-ada nke ọma n’Igbo.
- source_word: ἤδη ὁ κλάδος αὐτῆς ἁπαλὸς γένηται
  choice: mgbe alaka ya adịlarị nro
  rationale: “Adịlarị” na-echekwa echiche ἤδη nke ihe ruworola n’ọnọdụ ahụ, ebe “nro” na-egosi ịdị ọhụrụ na ịdị mềm nke alaka na-eto eto.
- source_word: ἐκφύῃ τὰ φύλλα
  choice: ya epupụta akwụkwọ ndụ
  rationale: ἐκφύω pụtara ipupụta ma ọ bụ iwepụta ihe ọhụrụ. “Epupụta akwụkwọ ndụ” na-enye onyinyo osisi na-amalite iwepụta akwụkwọ ya.
- source_word: γινώσκετε
  choice: unu na-amara
  rationale: N’ebe a ọ bụ present indicative, ọ bụghị iwu; ya mere ntụgharị ahụ na-ekwu ihe ndị mmadụ na-amata site n’ihe ịrịba ama ahụ.
- source_word: ἐγγὺς τὸ θέρος ἐστίν
  choice: oge ọkọchị dị nso
  rationale: θέρος pụtara oge ọkọchị ma ọ bụ summer n’ụzọ bụ isi; “dị nso” na-echekwa echiche oge na-abịaru nso nke ἐγγύς.
theological_decisions:
- issue: Ihe παραβολή pụtara n’ebe a
  choice: E tinyere “ilu” n’ahịrịokwu bụ isi.
  alternative: ihe mmụta; ihe atụ
  rationale: “Ilu” na-echekwa okwu a na-ahụkarị n’ozizi Jizọs, ma nkọwa ala peeji na-eme ka o doo anya na n’ebe a ọ bụ ntụnyere na-enye ihe mmụta, n’enweghị ịtinye nkọwa atụ ime mmụọ ọzọ.
translation_notes:
  register: E jiri Standard Igbo dị ugbu a, nke kwụ ọtọ ma dị ùgwù. E debere okwu ọtụtụ mmadụ n’ụdị “Mụtanụ/unu,” ma zere ịgbakwunye okwu oge na-adịghị na isi mmalite. Akara nkọwa [a] dị ozugbo n’akụkụ okwu “ilu” nke nkọwa ahụ metụtara.
