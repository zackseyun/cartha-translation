  text: Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ⸂ταῦτα συντελεῖσθαι πάντα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/004.yaml
  text: Tell us[a], when will these things be, and what will be the sign when all these things are about to be accomplished?
translation:
  language: ig
  text: “Gwa anyị, olee mgbe ihe ndị a ga-eme? Gịnịkwa ga-abụ ihe ịrịba ama mgbe ihe ndị a niile na-achọ ka ha mezuo?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “mgbe ihe ndị a niile ga-emezu.” Okwu Grik μέλλῃ, nke e ji infinitive soro, pụrụ ịkọwa n'ụzọ kpọmkwem na ihe ndị ahụ na-achọ ka ha mezuo, ya bụ, na mmezu ha na-eru nso.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: Gwa anyị
  rationale: Nke a na-egosipụta iwu/arịrịọ a gwara Jizọs, tinyere nnọchiaha nnata ‘anyị,’ n’ụzọ Igbo dị mfe ma bụrụkwa eke.
- source_word: πότε ταῦτα ἔσται
  choice: olee mgbe ihe ndị a ga-eme?
  rationale: ‘Olee mgbe’ bụ ajụjụ oge a na-asụkarị; ‘ga-eme’ na-egosipụta n'ụzọ eke na Igbo na okwu ahụ na-ekwu banyere ihe ndị ga-apụta ma ọ bụ ga-eme, ebe ọ ka na-edobe njikọ ya na ihe ndị e buru ụzọ kwuo.
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ihe na-egosi ma ọ bụ na-eme ka a mata na ihe ọzọ na-abịa.
- source_word: ὅταν μέλλῃ
  choice: mgbe ... na-achọ
  rationale: ‘Na-achọ’ tinyere infinitive na-egosipụta na ihe ahụ na-eru nso ime, ma ọ bụ na ọ nọ n’ọnụ ụzọ ime, nke kwekọrọ na echiche prospective/imminent nke μέλλω.
- source_word: ταῦτα συντελεῖσθαι πάντα
  choice: ihe ndị a niile ... imezu
  rationale: ‘Ihe ndị a niile’ na-edobe plural na πάντα; ‘imezu’ na-egosipụta iru n’ókè mmecha ya n’etinyeghị echiche amụma n’ụzọ siri ike karịa ngwaa Grik ahụ.
- source_word: καὶ τί τὸ σημεῖον
  choice: Gịnịkwa ga-abụ ihe ịrịba ama
  rationale: E tinyere ‘ga-abụ’ dịka Igbo si achọ maka ajụjụ ọdịnihu doro anya, dịka a ghọtara ya site n’ahịrịokwu gbara ya gburugburu.
theological_decisions:
- issue: Ike okwu gbasara ọdịnihu dị na μέλλῃ + infinitive
  choice: mgbe ihe ndị a niile na-achọ imezu
  alternative: mgbe ihe ndị a niile ga-emezu
  rationale: Nhọrọ a na-edobe echiche na mmezu ahụ na-eru nso ma ọ bụ na-achọ ịmalite, na-enweghị iji ya kpebie usoro nkuzi ọ bụla gbasara oge ikpeazụ.
- issue: Ihe συντελεῖσθαι pụtara n’ọnọdụ a
  choice: imezu
  alternative: ịgwụcha; iru n’isi njedebe
  rationale: ‘Imezu’ na-edobe echiche nke ihe niile iru n’ókè mmecha ya, ma ọ naghị akọwapụta n’ụzọ karịrị ihe Grik kwuru ma nke a bụ mmezu amụma kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Gwa anyị’ na ‘olee mgbe’ maka okwu ọnụ eke; ‘ihe ịrịba ama’ na ‘imezu’ na-edobe ụda Akwụkwọ Nsọ n’enweghị okwu ochie siri ike. E debere akara nkọwa ụkwụ [a] n’isiokwu.
