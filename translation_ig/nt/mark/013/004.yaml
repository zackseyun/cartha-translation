  to: “Gwa anyị, olee mgbe ihe ndị a ga-eme? Gịnịkwa ga-abụ ihe ịrịba ama mgbe ihe ndị a niile na-achọ ka ha mezuo?”[a]
  rationale: The revision resolves the Igbo syntactic ambiguity in the final temporal clause. It retains the source text’s plural reference (“all these things”), completion sense, and the prospective/imminent nuance of μέλλῃ, while the footnote preserves the legitimate simpler-future alternative.
