  text: βλέπετε ⸀ἀγρυπνεῖτε, οὐκ οἴδατε γὰρ πότε ὁ καιρός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/033.yaml
  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: ig
  text: Kpacharanụ anya; nọgidenụ na-amụ anya, n’ihi na unu amaghị mgbe oge ahụ[a] ga-eru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oge a kara aka” ma ọ bụ “oge pụrụ iche.” Okwu Grik καιρός na-ezokarị aka n’oge dị mkpa ma ọ bụ oge a kara aka.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Kpacharanụ anya
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ, nke pụtara ịmụrụ anya ma kpachara anya, ọ bụghị naanị iji anya hụ ihe. Nhọrọ a na-ekewakwa ya nke ọma n’ihe ἀγρυπνεῖτε pụtara.
- source_word: ἀγρυπνεῖτε
  choice: mụrụnụ anya
  rationale: Ọ bụ iwu ka mmadụ ghara ịrahụ ụra, ma ọ bụ ka ọ nọgide na-eche nche. Okwu a na-edobe ihe atụ nke ịmụrụ anya n’Igbo dị mfe ma doo anya.
- source_word: οὐκ οἴδατε
  choice: unu amaghị
  rationale: Nke a na-asụgharị ngwaa ịma ihe e jiri okwu njụ gọnahụ n’enweghị ịgbakwụnye echiche na-adịghị na Grik.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-egosi ihe mere e ji nye iwu ndị bu ya ụzọ.
- source_word: πότε
  choice: mgbe
  rationale: Ọ bụ okwu ajụjụ na-ezo aka n’oge; “mgbe” bụ ụzọ Igbo nkịtị si kwuo ya.
- source_word: ὁ καιρός
  choice: oge ahụ
  rationale: καιρός nwere ike ịpụta oge pụrụ iche ma ọ bụ oge a kara aka. “Oge ahụ” na-edobe obosara okwu Grik ma na-enye ya ịdị arọ kwesịrị ekwesị n’ọnọdụ a.
- source_word: ἐστιν
  choice: ga-eru
  rationale: N’Igbo, “mgbe oge ahụ ga-eru” bụ ụzọ ebumpụta ụwa isi kwupụta “when the time is,” na-edobe ntụaka ya n’oge a na-atụ anya ya.
theological_decisions:
- issue: Nkọwa καιρός n’okwu banyere ihe ndị ga-eme n’ọdịnihu
  choice: oge ahụ
  alternative: oge a kara aka; oge pụrụ iche
  rationale: N’okwu Jizọs a, καιρός nwere ike izo aka n’oge dị mkpa ma ọ bụ nke a kara aka. Isi ederede anaghị akọwa ya karịa ihe Grik kwuru; ihe ndị ọzọ enwere ike ịsụgharị ya dị n’okpuru peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ụdị iwu ọtụtụ “-nụ” mee ka o doo anya na Jizọs na-agwa ọtụtụ mmadụ okwu. A họọrọ ahịrịokwu ebumpụta ụwa n’Igbo ma debe ọdịiche dị n’etiti ịkpachara anya na ịmụrụ anya.
