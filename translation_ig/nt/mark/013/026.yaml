source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλαις μετὰ δυνάμεως πολλῆς καὶ δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/026.yaml
  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: ig
  text: Mgbe ahụ, ha ga-ahụ Nwa nke Mmadụ ka ọ na-abịa n'ígwé ojii, ya na ike dị ukwuu na ebube[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ọ na-abịa ya na ígwé ojii.” Okwu Grik kwuru “n'ígwé ojii,” ma nhọrọ nke ọzọ na-eme ka njikọ o yiri ka ọ nwere na Daniel 7:13 pụta ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: ha ga-ahụ
  rationale: Okwu a bụ ọdịnihu nke ὁράω; “ha ga-ahụ” bụ Igbo nkịtị ma doo anya, na-egosikwa na ihe a ga-apụta ìhè nye ndị na-ahụ ya.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-edobe aha pụrụ iche ahụ n'ụzọ a maara n'Igbo ma na-echekwa njikọ ya na Daniel 7 na nghọta ya gbasara Kraịst.
- source_word: ἐρχόμενον
  choice: ka ọ na-abịa
  rationale: Nke a na-egosipụta participle nke na-akọwa Nwa nke Mmadụ, ma debe okwu ọbịbịa ahụ n'asụsụ Igbo dị ndụ.
- source_word: ἐν νεφέλαις
  choice: n'ígwé ojii
  rationale: ἐν pụtara n'ụzọ bụ isi “n'ime/n'elu ọnọdụ nke,” ebe νεφέλαις bụ ọtụtụ; “n'ígwé ojii” bụ ụzọ Igbo sitere n'okike si kwuo ihe oyiyi ahụ. Nhọrọ “ya na ígwé ojii” dị n'okpuru ederede iji chekwaa nkwughachi Daniel 7:13.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: jiri ike dị ukwuu
  rationale: μετά ya na genitive na-egosi ihe so ya; “jiri ike dị ukwuu” bụ Igbo doro anya nke na-egosipụta ịdị ukwuu nke δύναμις.
- source_word: καὶ δόξης
  choice: na ebube
  rationale: “Ebube” na-echekwa nghọta Akwụkwọ Nsọ nke δόξα dịka ịdị ukwuu na nsọpụrụ pụtara ìhè.
theological_decisions:
- issue: Aha apọkaliptik na ihe oyiyi ígwé ojii
  choice: Idobe “Nwa nke Mmadụ” na ọbịbịa n'ígwé ojii n'enweghị nkọwa agbakwunyere n'ahịrịokwu ahụ.
  alternative: Ịsụgharị aha ahụ dịka “Onye Mmadụ,” ma ọ bụ ịkọwa njikọ ya na Daniel 7 ozugbo n'ahịrịokwu ahụ.
  rationale: Amaokwu ahụ na-ezo aka n'ụzọ siri ike na Daniel 7:13, ma ntụgharị kwesịrị idebe ntugharị uche ahụ kama ịkọwa ya kpamkpam. “Nwa nke Mmadụ” na-echekwakwa esemokwu na nghọta gbasara Kraịst na ihe ikpeazụ dị n'okwu Grik.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, kwụ ọtọ ma dị ùgwù. Ahịrịokwu ahụ zere nkọwa ụka pụrụ iche ma debe ihe oyiyi na nghọta abụọ okwu Grik nwere.
