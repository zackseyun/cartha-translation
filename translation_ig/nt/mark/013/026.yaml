review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the future public seeing, the established title “Nwa nke Mmadụ,” the continuing action of coming, the cloud imagery, and the paired concepts of great power and glory. However, “jiri ike” can imply that the Son of Man is using power as an instrument, whereas μετὰ marks accompanying power; “ya na” represents this more directly.
  naturalness: The sentence is clear Standard Igbo. Replacing “jiri” with “ya na” improves both idiomatic flow and the relation of accompaniment. The footnote is understandable and its alternate wording is acceptable.
  terminology: “Nwa nke Mmadụ” and “ebube” are appropriate established biblical terms. “Ígwé ojii” naturally conveys the plural cloud imagery. The Daniel reference is retained as an allusion rather than imposed as an interpretation in the main text.
  issues:
  - severity: low
    issue: “jiri ike dị ukwuu” presents power instrumentally.
    rationale: The Greek μετὰ δυνάμεως πολλῆς means “with/accompanied by great power.” In this context, “ya na ike dị ukwuu” more closely preserves that relationship without materially changing the sense.
  revised_text: Mgbe ahụ, ha ga-ahụ Nwa nke Mmadụ ka ọ na-abịa n'ígwé ojii, ya na ike dị ukwuu na ebube[a].
