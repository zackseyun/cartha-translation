  text: ὁ δὲ Ἰησοῦς ⸂ἤρξατο λέγειν αὐτοῖς⸃· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: ig
  text: Jizọs wee malite ịgwa ha, sị, “Kpacharanụ anya[a] ka onye ọ bụla ghara iduhie unu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Lezienụ anya ka onye ọ bụla ghara iduhie unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: wee
  rationale: N’ebe a, δέ bụ njikọ dị nro nke na-aga n’ihu n’akụkọ ahụ; “wee” na-egosi usoro ihe mere n’Igbo nke ọma n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: ἤρξατο λέγειν
  choice: malite ịgwa
  rationale: Nke a na-edobe echiche nke ịmalite ikwu okwu, ma na-ada ka Igbo nkịtị mgbe onye na-agwa ndị ọzọ okwu.
- source_word: αὐτοῖς
  choice: ha
  rationale: E debere nnọchiaha Grik ahụ kama ịtinye “ndị na-eso ụzọ ya,” ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-egosi ndị ọ na-ekwu maka ha.
- source_word: Βλέπετε
  choice: Kpacharanụ anya
  rationale: Iwu a na-akpọ ndị a na-agwa ka ha nọgide na-amụ anya. “Kpacharanụ anya” bụ ịdọ aka ná ntị doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: ka onye ọ bụla ghara iduhie unu
  rationale: Usoro a na-egosi ihe a ga-akpachara anya gbochie. “Iduhie” na-ejigide ma echiche nke aghụghọ ma nke ime ka mmadụ si n’ụzọ ziri ezi pụọ.
theological_decisions:
- issue: Ụdị ịdọ aka ná ntị dị na πλανήσῃ
  choice: Ịdọ aka ná ntị megide aghụghọ nke na-eduhie mmadụ pụọ n’ụzọ ziri ezi
  alternative: Ịdọ aka ná ntị gbasara naanị ime ka mmadụ kwenye n’ihe na-abụghị eziokwu
  rationale: πλανάω nwere ike ịpụta ime ka mmadụ hie ụzọ ma ọ bụ kpafuo, ọ bụghị naanị ịgwa ya okwu ụgha. “Iduhie” na-edobe obosara echiche ahụ n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji ụdị iwu ọtụtụ mmadụ “Kpacharanụ” mee ka ọnụ ọgụgụ dị na Grik pụta ìhè.
