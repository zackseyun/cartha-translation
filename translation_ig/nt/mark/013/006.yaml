source:
  edition: SBLGNT
  text: ⸀πολλοὶ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες ὅτι Ἐγώ εἰμι, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: ig
  text: Ọtụtụ ga-abịa n’aha m, na-asị, ‘Ọ bụ m.’[a] Ha ga-eduhiekwa ọtụtụ mmadụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “Abụ m.” N’asụsụ Grik, e kwughị okwu mmeju ahụ kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Ọtụtụ mmadụ
  rationale: Aha-nkọwa a ji n’ọnọdụ aha na-ezo aka n’ọtụtụ ndị mmadụ; nsụgharị a doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ἐλεύσονται
  choice: ga-abịa
  rationale: Ọ na-egosipụta omume ga-eme n’ọdịnihu; ‘ga-abịa’ bụ nsụgharị kpọmkwem na nke sitere n’okike n’Igbo.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: n’aha m
  rationale: Akpaalaokwu a na-egosi na ha ga-azọrọ na ha ji aha Jizọs, ikike ya, ma ọ bụ njikọ ha na ya abịa; ‘n’aha m’ na-edebe ohere nghọta ndị a.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-akọwa ihe ha ga na-ekwu mgbe ha na-abịa, n’etinyeghị echiche ọzọ dịka ‘na-azọrọ’ nke na-akọwakarị ebumnuche ha.
- source_word: ὅτι Ἐγώ εἰμι
  choice: ‘Abụ m ya’
  rationale: N’ọnọdụ a, ‘ya’ na-eme ka okwu ahụ bụrụ Igbo a na-aghọta nke ọma ma na-egosi nzọrọ njirimara ahụ; n’agbanyeghị nke ahụ, ebe Grik enweghị okwu mmeju e kwuru hoo haa, e debere nsụgharị nkịtị karị na nkọwa ala peeji.
- source_word: πολλοὺς
  choice: ọtụtụ mmadụ
  rationale: Ọ bụ ndị omume iduhie ahụ ga-emetụta; ikwughachi ‘ọtụtụ mmadụ’ doro anya n’Igbo.
- source_word: πλανήσουσιν
  choice: ga-eduhiekwa
  rationale: ‘Iduhie’ na-egosi ime ka mmadụ hapụ eziokwu ma soro ụzọ na-ezighị ezi, nke kwekọrọ n’echiche πλανάω n’ebe a; ‘-kwa’ na-egosipụta njikọ καί.
theological_decisions:
- issue: Otu e si asụgharị Ἐγώ εἰμι n’okwu gbasara ndị ga-azọrọ njirimara ụgha
  choice: Abụ m ya
  alternative: Abụ m
  rationale: ‘Abụ m ya’ na-eme ka nzọrọ ahụ doo anya n’Igbo n’ebughị ya gafee ọnọdụ amaokwu a. Ma n’ihi na Grik ekwughị okwu mmeju ọ bụla kpọmkwem, nkọwa ala peeji na-edebe ‘Abụ m,’ nke na-egosipụta ọdịdị na mgbagwoju anya nke okwu Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. Usoro ahịrịokwu ahụ na-eso usoro echiche Grik n’enweghị ịmanye nkọwa otu ụka ma ọ bụ ozizi pụrụ iche.
