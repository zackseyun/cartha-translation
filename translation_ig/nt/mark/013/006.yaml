  to: Ọtụtụ ga-abịa n’aha m, na-asị, ‘Ọ bụ m.’[a] Ha ga-eduhiekwa ọtụtụ mmadụ.
  rationale: The revision uses the idiomatic Standard Igbo self-identification “Ọ bụ m” for the contextual sense of “I am he,” while the footnote preserves the more formally literal “Abụ m” and explicitly notes that Greek leaves the predicate unstated. It also improves clause punctuation and retains the meaning of both occurrences of πολλοί without needless repetition.
