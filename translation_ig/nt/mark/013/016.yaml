  text: καὶ ὁ εἰς τὸν ⸀ἀγρὸν μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω ἆραι τὸ ἱμάτιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: ig
  text: Onye nọ n’ubi ekwesịghị ịlaghachi iji were uwe mgbokwasị ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “uwe elu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: onye nọ n’ubi
  rationale: Nkebiokwu nwere artikel a na-arụ ọrụ dị ka aha onye, na-ezo aka n’otu onye a kọwara dị ka onye nọ n’ubi. Nsụgharị a bụ Igbo nkịtị ma na-edobe onye otu n’enweghị ịkọwapụta na ọ bụ nwoke naanị.
- source_word: ἀγρός
  choice: ubi
  rationale: N’ebe a, okwu ahụ pụtara ala ubi ma ọ bụ ebe a na-akọ ihe; “ubi” bụ okwu Igbo kacha zie ezi ma dịkwa mfe nghọta.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: ekwesịghị ịlaghachi azụ
  rationale: Iwu aorist ya na μή bụ mmachibido siri ike. “Ekwesịghị ịlaghachi azụ” na-egosi ngwa ngwa na ịdị ike nke iwu ahụ n’Igbo dị ugbu a.
- source_word: ἆραι
  choice: ịga were
  rationale: Infinitive a na-egosi ebumnuche nke ịlaghachi—iji were ihe ahụ. “Ịga were” na-ada nke ọma n’Igbo ma na-egosi iweghachite uwe ahụ.
- source_word: ἱμάτιον
  choice: uwe mwụda
  rationale: Okwu ahụ na-ezo aka n’uwe a na-eyi n’elu uwe ndị ọzọ. “Uwe mwụda” na-enye echiche ahụ n'ụzọ dị nkenke; nkọwa ala peeji na-edobe nhọrọ sara mbara.
- source_word: αὐτοῦ
  choice: ya
  rationale: “Ya” na-edobe nnọchiaha onye otu nke isi mmalite; n’Igbo, ọ naghị amanye ịkọwa nwoke ma ọ bụ nwaanyị.
theological_decisions:
- issue: Ntụaka onye otu nke na-anọchite anya mmadụ niile
  choice: 'Idobe onye otu: “onye ... uwe mwụda ya.”'
  alternative: 'Ime ya ọtụtụ: “ndị nọ n’ubi ... uwe mwụda ha.”'
  rationale: Grik ji okwu onye otu na nnọchiaha onye otu. Igbo “onye ... ya” na-edobe ụdị ahụ ma ka na-emetụta onye ọ bụla nọ n’ọnọdụ ahụ, n’enweghị ịgbakwunye nkọwa nwoke naanị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị nsọ ma dị mfe nghọta. A họọrọ usoro okwu na-ada nke ọma n’Igbo ma debe ike nke mmachibido ahụ na onye otu nke Grik.
