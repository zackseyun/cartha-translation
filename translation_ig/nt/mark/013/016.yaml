review_pass:
  verdict: revise
  source_fidelity: The prohibition and generic singular subject are conveyed accurately. However, “uwe mwụda” normally denotes a skirt in contemporary Standard Igbo and is not a dependable rendering of ἱμάτιον, the outer wrap/cloak. The purpose infinitive is more directly expressed with “iji were” than “ịga were.”
  naturalness: “Onye nọ n’ubi ekwesịghị ịlaghachi iji were …” is clear, idiomatic Standard Igbo, and avoids the slightly cumbersome sequence “ịlaghachi azụ ịga were.”
  terminology: Use “uwe mgbokwasị” for the outer wrap or cloak (ἱμάτιον). Retain “uwe elu” as a broader lexical alternative in the footnote.
  issues:
  - severity: medium
    issue: “uwe mwụda” is potentially misleading.
    rationale: In modern Standard Igbo it commonly means a skirt, whereas ἱμάτιον denotes an outer garment/cloak. “Uwe mgbokwasị” more clearly identifies the relevant type of garment.
  - severity: low
    issue: Purpose construction is awkward.
    rationale: After “ịlaghachi,” “iji were” directly expresses the Greek purpose infinitive ἆραι; “ịga were” unnecessarily repeats the idea of going.
  revised_text: Onye nọ n’ubi ekwesịghị ịlaghachi iji were uwe mgbokwasị ya[a].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “uwe elu.”
    reason: lexical_alternative
  revision_rationale: The revision replaces a potentially inaccurate modern garment term with a clear term for an outer wrap/cloak and makes the purpose clause more natural, while preserving the singular generic reference, the urgent prohibition, and the lexical alternative.
