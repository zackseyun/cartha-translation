- from: Onye nọ n’ubi ekwesịghị ịlaghachi azụ ịga were uwe mwụda ya[a].
  to: Onye nọ n’ubi ekwesịghị ịlaghachi iji were uwe mgbokwasị ya[a].
  rationale: The revision replaces a potentially inaccurate modern garment term with a clear term for an outer wrap/cloak and makes the purpose clause more natural, while preserving the singular generic reference, the urgent prohibition, and the lexical alternative.
