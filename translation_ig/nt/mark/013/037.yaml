  text: ⸀ὃ δὲ ὑμῖν λέγω πᾶσιν λέγω· γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/037.yaml
  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: ig
  text: 'Ihe m na-agwa unu ka m na-agwa mmadụ niile: nọgidenụ na nche[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-eche nche” ma ọ bụ “na-amụ anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: Ihe
  rationale: Nnọchiaha a na-arụ ọrụ dị ka aha; “Ihe” na-egosipụta echiche sara mbara nke “ihe m na-ekwu” n’Igbo nkịtị.
- source_word: δὲ
  choice: —
  rationale: N’ebe a δέ bụ njikọ dị nro. Igbo anaghị achọ ka e tinye “ma” ma ọ bụ “na” n’isi ahịrịokwu a; ịhapụ ya na-eme ka okwu ahụ bụrụ nke eke n’enweghị ime ka ọ bụrụ mmegide.
- source_word: ὑμῖν
  choice: unu
  rationale: “Unu” na-egosi nke ọma na nnọchiaha Grik a bụ ọtụtụ mmadụ, ya bụ ndị Jizọs na-agwa okwu ozugbo.
- source_word: λέγω ... λέγω
  choice: na-agwa ... na-agwa
  rationale: E debere nkwughachi dị na Grik iji chekwaa nhazi okwu na nkwusi ike ya; “na-agwa” bụ ụzọ Igbo si ekwu okwu a n’ụzọ eke mgbe onye a na-agwa sochiri ya.
- source_word: πᾶσιν
  choice: mmadụ niile
  rationale: Nke a na-egosipụta obosara nke “niile” n'ụzọ doro anya ma dịkwa eke n’Igbo, n’enweghị ikpuchi ọdịiche dị n’etiti “unu” na mmadụ niile.
- source_word: γρηγορεῖτε
  choice: nọgidenụ na nche
  rationale: Iwu ọtụtụ mmadụ a na-akpọ ha ka ha na-amụ anya mgbe niile. “Nọgidenụ na nche” na-egosipụta omume na-aga n’ihu ma na-echekwa echiche nke ịmụrụ anya.
theological_decisions:
- issue: Ókè ndị ndụmọdụ Jizọs gbasara
  choice: E gosipụtara na ihe Jizọs gwara ndị na-eso ụzọ ya metụtara mmadụ niile.
  alternative: A pụrụ iwere okwu ahụ dị ka nke metụtara naanị ndị nọ na-ege ya ntị n’akụkọ ahụ.
  rationale: Grik ahụ na-ekewapụ “unu” na “niile” n’ụzọ doro anya; nsụgharị ahụ chekwara mgbasa a n’enweghị ịkọwa onye ọ bụla “niile” ahụ kpọmkwem gụnyere.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji ụdị iwu ọtụtụ mmadụ “nọgidenụ” kwekọọ na γρηγορεῖτε, ma tinye akara ntụaka [a] ozugbo n’ederede.
