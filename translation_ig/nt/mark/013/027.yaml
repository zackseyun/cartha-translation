id: MRK.13.27
reference: Mark 13:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: ig
  text: Mgbe ahụ, ọ ga-ezipụ ndị mmụọ ozi, kpọkọtakwa ndị a họọrọ[a] site n’ifufe anọ[b], site na nsọtụ ụwa ruo na nsọtụ eluigwe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị ahọpụtara.”
    reason: lexical_alternative
  - marker: b
    text: “Ifufe anọ” bụ okwu-atụ nke pụtara akụkụ niile ma ọ bụ ebe niile.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịkọwa nkebi ikpeazụ a dịka, “site n’ebe kasị anya n’ụwa ruo n’ebe kasị anya n’eluigwe,” ma ọ bụ, “site n’otu nsọtụ eluigwe ruo na nsọtụ nke ọzọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi oge na usoro ihe ga-eme; okwu a bụ Igbo doro anya ma kwekọọ na ‘mgbe ahụ.’
- source_word: ἀποστελεῖ
  choice: ọ ga-ezipụ
  rationale: Ụdị ọdịnihu a na-egosi iziga ndị nnọchiteanya ka ha rụọ ọrụ; ‘zipụ’ bụ okwu Igbo dị ndụ ma kwesị ekwesị n’ebe a.
- source_word: ἀγγέλους
  choice: ndị mmụọ ozi
  rationale: N’ọnọdụ ọhụụ banyere ọgwụgwụ oge a, ihe a na-ekwu bụ ndị ozi si n’ụwa mmụọ, ọ bụghị mmadụ nkịtị.
- source_word: ἐπισυνάξει
  choice: kpọkọtakwa
  rationale: ‘Kpọkọta’ na-enye echiche nke ịchịkọta ndị gbasasịrị n’otu ebe; mgbakwunye ‘-kwa’ na-ejigide njikọ καὶ nke abụọ.
- source_word: ἐκλεκτούς
  choice: ndị a họọrọ
  rationale: Ọ na-egosi ndị a họọrọ n’enweghị itinye onye nwe ha n’ahịrịokwu, ebe Grik enweghị nnọchiaha nwe; ọ na-ezerekwa ime okwu ahụ ka ọ bụrụ naanị aha nkà mmụta okpukpe.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: site n’ifufe anọ
  rationale: Nsụgharị a na-echekwa ihe atụ Grik nke ifufe anọ, ebe nkọwa ala peeji na-eme ka nghọta ya dịka akụkụ niile doo anya.
- source_word: ἀπ’ ἄκρου γῆς
  choice: site na nsọtụ ụwa
  rationale: ‘Nsọtụ’ na-egosi oke ma ọ bụ ebe kasị anya, ma na-echekwa ihe oyiyi gbasara obosara niile.
- source_word: ἕως ἄκρου οὐρανοῦ
  choice: ruo na nsọtụ eluigwe
  rationale: Ọ na-echekwa usoro yiri nke ‘nsọtụ ụwa’; ‘eluigwe’ hapụrụ ohere nke okwu οὐρανός n’ọnọdụ ọhụụ a kama ịkọwa ya naanị dịka mbara igwe.
- source_word: καὶ τότε ... καὶ
  choice: Mgbe ahụ ... kpọkọtakwa
  rationale: ‘Mgbe ahụ’ na-egosi usoro oge, ebe ‘-kwa’ na-ejigide njikọ dị n’etiti izipụ na ịkpọkọta n’ụzọ Igbo na-asụkarị.
theological_decisions:
- issue: Nsụgharị ἐκλεκτούς n’okwu banyere ọgwụgwụ oge
  choice: ndị a họọrọ
  alternative: ndị ahọpụtara
  rationale: ‘Ndị a họọrọ’ na-ebute isi echiche nke nhọrọ Chineke n’asụsụ ndị mmadụ na-aghọta, ma ọ naghị eme ka okwu ahụ bụrụ okwu teknụzụ nke otu usoro ozizi e mesịrị.
- issue: Oke ebe ihe oyiyi nke ịkpọkọta ahụ gụnyere
  choice: site n’ifufe anọ, site na nsọtụ ụwa ruo na nsọtụ eluigwe
  alternative: site n’akụkụ anọ niile, site n’otu nsọtụ ruo na nke ọzọ
  rationale: Nhọrọ ahụ na-echekwa ma okwu-atụ ‘ifufe anọ’ ma ụzọ Grik si jikọta ụwa na eluigwe iji gosi oke niile, n’enweghị ime ka ihe oyiyi ahụ dị mfe karịa ka isi mmalite si kwuo.
- issue: Onye nwe ‘ndị a họọrọ’
  choice: enweghị nnọchiaha nwe
  alternative: ndị ọ họọrọ / ndị nke ya a họọrọ
  rationale: Grik kwuru ‘ndị a họọrọ’ ma o tinyeghị ‘nke ya’; nsụgharị ahụ anaghị etinye ihe isi mmalite ekwughị kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro na ihe oyiyi Grik, ma na-eji ‘kpọkọtakwa’ mee ka njikọ omume abụọ ahụ bụrụ nke e bu pụta ụwa n’Igbo. Akara nkọwa ala peeji niile dị n’ahịrịokwu isi.
