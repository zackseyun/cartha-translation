source:
  edition: SBLGNT
  text: ⸀ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω μηδὲ εἰσελθάτω ⸂τι ἆραι⸃ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: ig
  text: Onye nọ n’elu ụlọ[a] ekwesịghị ịrịdata, ọ kwesịghịkwa ịbanye n’ụlọ ya iji were ihe ọ bụla n’ime ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye nọ n’elu ụlọ.” Okwu Grik ahụ na-ekwu maka elu ụlọ larịị mmadụ pụrụ ịnọ ma ọ bụ jiri eme ihe.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Onye nọ n’elu ụlọ
  rationale: Nkebiokwu a na-ezo aka n’onye nọ n’elu ụlọ ahụ; n’ọnọdụ ndị Juu oge ahụ, elu ụlọ na-adị larịị ma bụrụ ebe mmadụ nwere ike ịnọ.
- source_word: μὴ καταβάτω
  choice: ekwesịghị ịrịdata
  rationale: Nke a na-egosipụta iwu mgbochi nke onye nke atọ. “Ịrịdata” na-egosi isi n’ebe dị elu gbadata nke ọma.
- source_word: μηδὲ εἰσελθάτω
  choice: ma ọ bụ banye n’ụlọ ya
  rationale: μηδέ na-ejikọta iwu mgbochi nke abụọ; ebe a na-abanye pụtara ìhè site na ἐκ τῆς οἰκίας αὐτοῦ, ya mere ịkpọ “ụlọ ya” ebe a na-eme ka Igbo doo anya ma bụrụ nke e ji eme ihe.
- source_word: τι ἆραι
  choice: iwere ihe ọ bụla
  rationale: Infinitive a na-egosi ebumnuche nke ịbanye, ebe τι na-ahapụ ihe ahụ n’enweghị nkọwa kpọmkwem.
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: n’ụlọ ya
  rationale: N’usoro Igbo a, ịbanye n’ụlọ ya iwere ihe pụtara iwepụta ya n’ụlọ. “Ya” na-echekwa onye nke atọ otu na ụdị nnọchiteanya nke okwu Grik.
theological_decisions:
- issue: Nwoke otu onye e ji anọchi anya mmadụ n’ozuzu ya
  choice: ụlọ ya
  alternative: ụlọ ha; ụlọ ahụ
  rationale: Okwu Grik ji nnọchiaha nwoke otu onye nke nwere ike ịnọchite anya onye ọ bụla. “Ụlọ ya” na-echekwa otu onye ahụ na-enweghị ịgbakwunye nkọwa okpukpe.
translation_notes:
  register: Igbo Ọkọlọtọ nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ “elu ụlọ” n’ihi na ọ bụ ụzọ nkịtị e si ekwu roof/rooftop n’Igbo; nkọwa ọdịnala banyere elu ụlọ larịị adịghị mkpa dị ka ihe odide ala peeji n’Igbo a, ebe isi okwu ahụ doro anya.
