review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the person on the housetop and the purpose of entering, but “ma ọ bụ” means “or” and weakens/recasts the Greek coordinated prohibitions (μηδέ, “nor”). It also leaves ἐκ (“out of/from within”) only implicit.
  naturalness: “Onye nọ n’elu ụlọ” and “ịrịdata” are natural Standard Igbo. Recasting the second prohibition with “ọ kwesịghịkwa” is clear, idiomatic, and retains the urgent parallel structure.
  terminology: “Elu ụlọ” suitably conveys the accessible housetop. “ụlọ ya” preserves the singular representative pronoun. “n’ime ya” makes clear that the object is to be taken from inside his house without adding interpretation.
  issues:
  - severity: medium
    issue: “ma ọ bụ” is used for μηδέ.
    rationale: 'In Standard Igbo, “ma ọ bụ” ordinarily means “or,” whereas the Greek gives a second coordinated negative command: “nor enter.”'
  - severity: low
    issue: The removal “out of his house” is not explicitly represented.
    rationale: “Iwere ihe ọ bụla n’ime ya” naturally and explicitly conveys taking an item from within the house.
