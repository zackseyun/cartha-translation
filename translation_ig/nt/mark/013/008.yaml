id: MRK.13.8
reference: Mark 13:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: ig
  text: N’ihi na mba ga-ebili megide mba, alaeze ga-ebilikwa megide alaeze. Ala ọma jijiji ga-adị n’ebe dị iche iche, ụnwụ ga-adịkwa. Ihe ndị a bụ mmalite mgbu ịmụ nwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “mgbu ime” ma ọ bụ “ihe mgbu ọmụmụ nwa.” Ihe atụ Grik bụ mgbu metụtara ịmụ nwa, nke e ji mee ihe atụ maka ahụhụ na-ebute ihe ga-esochi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: ga-ebili
  rationale: N’ọnọdụ a, ngwaa ahụ na-egosi otu mba ibili imegide mba ọzọ; “ga-ebili” bụ Igbo doro anya nke na-echekwa echiche ọgụ ahụ n’enweghị ịmanye ọdịdị passive Grik.
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: mba ... megide mba
  rationale: N’ihi na e jikọtara ἔθνος na βασιλεία n’okwu gbasara esemokwu ọchịchị, “mba” kacha egosipụta echiche ahụ ma na-echekwa nhazi okwu Grik.
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: alaeze ... megide alaeze
  rationale: N’ebe a βασιλεία pụtara ógbè ọchịchị ma ọ bụ alaeze, ọ bụghị naanị omume ịchị; “alaeze” na-echekwa myirịta ya na “mba.”
- source_word: σεισμοὶ
  choice: ala ọma jijiji
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka σεισμός, ya bụ earthquake.
- source_word: κατὰ τόπους
  choice: n’ebe dị iche iche
  rationale: Ọ na-egosipụta na ihe ndị ahụ ga-eme n’ọtụtụ ebe, ọ bụghị naanị n’otu ebe.
- source_word: λιμοί
  choice: ụnwụ
  rationale: “Ụnwụ” bụ okwu Igbo kwesịrị ekwesị maka nnukwu ụkọ nri nke λιμός na-egosi, ọ bụghị naanị agụụ mmadụ na-agụ.
- source_word: ἀρχὴ
  choice: mmalite
  rationale: “Mmalite” na-egosi na ihe ndị a bụ ihe na-amalite usoro ahụ, ọ bụghịzu ihe niile ga-eme.
- source_word: ὠδίνων
  choice: mgbu ịmụ nwa
  rationale: Okwu a na-echekwa ihe atụ Grik nke mgbu na-abịa mgbe a na-amụ nwa, nke e ji akọwa ahụhụ ndị na-ebute ihe ga-esochi.
- source_word: ταῦτα
  choice: Ihe ndị a
  rationale: Nke a na-ezo aka n’ihe niile e depụtara n’amaokwu ahụ, ma ọ bụkwa ụzọ Igbo sitere n’okike si kwuo ya.
theological_decisions:
- issue: Ihe atụ apọkaliptik dị na ἀρχὴ ὠδίνων
  choice: Ihe ndị a bụ mmalite mgbu ịmụ nwa.
  alternative: Ihe ndị a bụ naanị mmalite nsogbu.
  rationale: A hapụrụ ihe atụ ọmụmụ nwa ka ọ dị, ka ederede wee nọgide na-egosi ahụhụ na-ebute ihe ọzọ n’enweghị ịgbakwunye usoro nkọwa banyere ọgwụgwụ oge nke amaokwu ahụ ekwughị kpọmkwem.
translation_notes:
  register: E jiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere nhazi abụọ ahụ—“mba megide mba” na “alaeze megide alaeze”—ma chekwaa ihe atụ nke ịmụ nwa. E tinyere akara nkọwa ala peeji [a] n’ebe okwu ọ na-akọwa dị, ya bụ mgbe “mgbu ịmụ nwa” gasịrị.
