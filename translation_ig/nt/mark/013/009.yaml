revisions:
- from: Ma unu onwe unu, lezienụ anya. Ha ga-enyefe unu n'aka ndị kansụl; a ga-etikwa unu ihe n'ụlọ nzukọ ndị Juu. Unu ga-eguzokwa n'ihu ndị gọvanọ na ndị eze n'ihi m, ka ọ bụrụ ihe àmà nye ha.[a]
  to: Ma unu onwe unu, lezienụ anya. Ha ga-enyefe unu n’ụlọikpe, a ga-etikwa unu ihe n’ụlọ nzukọ ndị Juu. Unu ga-eguzokwa n’ihu ndị gọvanọ na ndị eze n'ihi m, ka ọ bụrụ ihe àmà nye ha.[a]
  rationale: The revision corrects the referent of συνέδρια from individual council members to judicial bodies while preserving the source’s plural/general judicial reference in idiomatic Igbo. It also makes the alternative footnote rendering correspond more closely to “for a witness to them,” without resolving the possible adverse sense of the witness phrase.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:32Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the warning, handing over, beating, appearance before governors and kings, causal reference to Jesus, and the open-ended witness phrase. However, “ndị kansụl” means council members rather than the judicial councils/courts denoted by συνέδρια. “Ụlọikpe” communicates the intended local judicial setting naturally in Standard Igbo.
  naturalness: The verse is generally clear and appropriately formal. Replacing “ndị kansụl” with “ụlọikpe” removes an awkward loanword construction and avoids changing an institution into the people who belong to it. “A ga-eti unu ihe” is a natural passive expression for physical beating.
  terminology: “Ụlọ nzukọ ndị Juu” suitably identifies συναγωγαί without falsely equating them with Christian churches. “Gọvanọ,” “ndị eze,” “ihe àmà,” and “n'ihi m” are suitable. The footnote should use “akaebe” as the alternative rendering of “witness,” while retaining “ihe àmà megide ha” as a possible contextual sense.
  issues:
  - severity: medium
    issue: “ndị kansụl” translates persons rather than councils.
    rationale: Συνέδρια is plural and refers to deliberative/judicial bodies. The phrase “n'aka ndị kansụl” makes the recipients individual councillors, whereas the Greek says the disciples will be handed over to councils. “N’ụlọikpe” idiomatically retains the judicial sense in Igbo.
  revised_text: Ma unu onwe unu, lezienụ anya. Ha ga-enyefe unu n’ụlọikpe, a ga-etikwa unu ihe n’ụlọ nzukọ ndị Juu. Unu ga-eguzokwa n’ihu ndị gọvanọ na ndị eze n'ihi m, ka ọ bụrụ ihe àmà nye ha.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka ọ bụrụ akaebe nye ha.” Okwu a nwekwara ike ịpụta, “ka ọ bụrụ ihe àmà megide ha.”
    reason: alternative_reading
  revision_rationale: The revision corrects the referent of συνέδρια from individual council members to judicial bodies while preserving the source’s plural/general judicial reference in idiomatic Igbo. It also makes the alternative footnote rendering correspond more closely to “for a witness to them,” without resolving the possible adverse sense of the witness phrase.
