id: MRK.13.9
reference: Mark 13:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: ig
  text: Ma unu onwe unu, lezienụ anya. Ha ga-enyefe unu n’ụlọikpe, a ga-etikwa unu ihe n’ụlọ nzukọ ndị Juu. Unu ga-eguzokwa n’ihu ndị gọvanọ na ndị eze n'ihi m, ka ọ bụrụ ihe àmà nye ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka ọ bụrụ akaebe nye ha.” Okwu a nwekwara ike ịpụta, “ka ọ bụrụ ihe àmà megide ha.”
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: Ma unu onwe unu, lezienụ anya
  rationale: Okwu iwu dị n'ụdị na-aga n'ihu na-akpọ ndị na-eso ụzọ ka ha nọgide na-amụ anya; “unu onwe unu” na-echekwa nkwusi ike nke ὑμεῖς ἑαυτούς n'Igbo dị eke.
- source_word: παραδώσουσιν
  choice: Ha ga-enyefe unu n'aka
  rationale: N'ọnọdụ mkpagbu na ikpe a, okwu a pụtara inyefe mmadụ n'aka ndị ọchịchị, ọ bụghị nanị ịrara mmadụ nye.
- source_word: συνέδρια
  choice: ndị kansụl
  rationale: Ụdị ọtụtụ na-ezo aka na kansụl ndị obodo na-ekpe ikpe, ọ bụghị naanị Sanhedrin dị na Jerusalem.
- source_word: συναγωγάς
  choice: ụlọ nzukọ ndị Juu
  rationale: Nkọwa a doro ndị na-agụ Igbo anya ma na-egosi ụlọ na nzukọ okpukpe ndị Juu ebe a pụrụ inye ntaramahụhụ.
- source_word: δαρήσεσθε
  choice: a ga-etikwa unu ihe
  rationale: Ọ na-egosi iti mmadụ ahụ n'ụzọ sara mbara, na-akọwaghị kpọmkwem ụdị ihe e ji tie ya.
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων
  choice: n'ihu ndị gọvanọ na ndị eze
  rationale: Ọ na-echekwa ọnọdụ ọchịchị abụọ dị iche iche ndị Grik kpọrọ aha.
- source_word: σταθήσεσθε
  choice: Unu ga-eguzokwa n'ihu
  rationale: Ọ na-echekwa ihe oyiyi nke iguzo n'ihu ndị ọchịchị maka ikpe, ebe ọnọdụ mkpagbu ahụ n'onwe ya na-egosi na a manyere ha ime ya.
- source_word: ἕνεκεν ἐμοῦ
  choice: n'ihi m
  rationale: Ọ na-egosi n'ụzọ doro anya na mmekọrịta ha na Jizọs bụ ihe kpatara mkpagbu ahụ.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ka ọ bụrụ ihe àmà nye ha
  rationale: Ọ na-echekwa echiche bụ isi nke akaebe a na-enye ndị ọchịchị ahụ, n'etinyeghị n'amaokwu ahụ echiche ikpe ọmụma nke okwu Grik na-achọghị ka ọ bụrụ naanị ya.
theological_decisions:
- issue: Ihe εἰς μαρτύριον αὐτοῖς pụtara
  choice: Ịpụta ndị na-eso ụzọ n'ihu ndị ọchịchị ga-abụ ihe àmà nye ndị ọchịchị ahụ.
  alternative: Ọ ga-abụ ihe àmà megide ha, nke nwere ụda ikpe ọmụma.
  rationale: Dative αὐτοῖς nwere ike ịkọwa ndị a na-enye ihe àmà, ma n'ọnọdụ ụfọdụ okwu ahụ nwekwara ike ibu echiche nke ihe àmà megide ha. Isi ederede họọrọ okwu na-adịghị ekpebi esemokwu ahụ n'ụzọ siri ike, ebe ndetu ala na-edebe ohere nke ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma doo onye nkịtị anya. “Kansụl” na “gọvanọ” bụ okwu a na-aghọta nke ọma ma na-echekwa ụdị ụlọ ikpe na ọkwa ọchịchị ndị ederede Grik kpọrọ aha; “ụlọ nzukọ ndị Juu” kọwara synagogue n'ụzọ doro anya.
