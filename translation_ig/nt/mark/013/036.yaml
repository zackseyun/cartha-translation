id: MRK.13.36
reference: Mark 13:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ ἐλθὼν ἐξαίφνης εὕρῃ ὑμᾶς καθεύδοντας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/036.yaml
  text: lest, coming suddenly, he find you sleeping.
translation:
  language: ig
  text: ka ọ ghara ịbịa na mberede chọta unu ka unu na-ehi ụra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαίφνης
  choice: na mberede
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si egosi ihe mere na-atụghị anya ya.
- source_word: καθεύδοντας
  choice: ka unu na-ehi ụra
  rationale: E debere ihe oyiyi nkịtị nke ihi ụra dị n'okwu Grik, n'agbanyeghị na ihe gbara amaokwu ahụ gburugburu na-enye ya ịdị arọ nke ime mmụọ.
- source_word: μὴ ... εὕρῃ
  choice: ka ọ ghara ... hụ
  rationale: Usoro a na-egosipụta nzube ịdọ aka ná ntị nke μὴ na subjunctive n'Igbo eke.
- source_word: ἐλθὼν
  choice: ịbịa
  rationale: A jikọtara participle ahụ n'ụzọ Igbo eke na usoro 'ịbịa ... hụ' n'emebighị njikọ omume abụọ ahụ.
theological_decisions:
- issue: Ma 'ihi ụra' ò kwesịrị ịghọ nkọwa ime mmụọ kpọmkwem
  choice: E debere ya dịka 'na-ehi ụra.'
  alternative: Ịsụgharị ya dịka 'na-anọghị na nche' ma ọ bụ 'na-adịghị njikere.'
  rationale: Okwu Grik ji ihe oyiyi ihi ụra n'onwe ya; ịkọwa ya ozugbo dịka enweghị njikere ga-emechi ihe oyiyi na obosara ihe ọ pụtara.
translation_notes:
  register: Standard Igbo; asụsụ dị mfe, dị ùgwù, ma bụrụ nke ndị nkịtị na-aghọta. E jighị akara ntụaka ụkwụ n'ihi na ọ dịghị mkpa nkọwa ọdịiche ederede ma ọ bụ nsụgharị ọzọ n'amaokwu a.
