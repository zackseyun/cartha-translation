source:
  edition: SBLGNT
  text: καὶ εἰς πάντα τὰ ἔθνη ⸂πρῶτον δεῖ⸃ κηρυχθῆναι τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/010.yaml
  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: ig
  text: Na, a ghaghị ibu ụzọ kwusaa Oziọma ahụ nye mba niile[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ozi ọma.” Okwu Grik εὐαγγέλιον pụtara n'ụzọ nkịtị “ozi ọma.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’etiti mba niile”; n’ọnọdụ ụfọdụ, ἔθνη nwekwara ike ịpụta “ndị mba ọzọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: ahụ
  rationale: καὶ na-ejikọta amaokwu a na okwu ndị bu ya ụzọ. N'Igbo, iji “ahụ” mee njikọ n'ime “Oziọma ahụ” na-eme ka okwu ahụ na-aga were were n'ọnọdụ a, kama ịmalite ya n'ụzọ na-adịghị eke eke site na “Na.”
- source_word: εἰς πάντα τὰ ἔθνη
  choice: nye mba niile
  rationale: εἰς na κηρυχθῆναι nwere ike igosi ndị a na-ezigara nkwusa ahụ ma ọ bụ ókè ọ ga-eru. “Nye mba niile” na-egosi mgbasa zuru ụwa ọnụ, ma ọ naghị akpọchi ihe ἔθνη pụtara nanị n'okwu “ndị mba ọzọ.”
- source_word: πρῶτον
  choice: ibu ụzọ
  rationale: Nke a na-echekwa echiche nke ihe ga-ebu ụzọ mee, n'asụsụ Igbo dị mfe ma bụrụ nke eke.
- source_word: δεῖ
  choice: aghaghị
  rationale: “Aghaghị” na-egosi mkpa siri ike nke δεῖ, ma ọ naghị agbakwụnye nkọwa doro anya banyere onye kpebiri mkpa ahụ.
- source_word: κηρυχθῆναι
  choice: kwusaa
  rationale: N'ụdị “aghaghị ... kwusaa,” okwu a na-enye echiche nke nkwupụta n'ihu ọha. Igbo na-ejikarị ụdị a na-enweghị ịmanye passive dị arọ, ebe ozi a na-ekwusa ka bụ isi okwu.
- source_word: τὸ εὐαγγέλιον
  choice: Oziọma ahụ
  rationale: “Oziọma” bụ okwu Igbo a maara nke ọma maka εὐαγγέλιον; ndetu ala peeji na-eme ka ihe ọ pụtara n'ụzọ nkịtị, “ozi ọma,” doo anya.
theological_decisions:
- issue: Ókè ἔθνη pụtara
  choice: mba niile
  alternative: n'etiti mba niile; ndị mba ọzọ niile
  rationale: “Mba niile” na-echekwa obosara zuru ụwa ọnụ nke okwu ahụ. Ndetu ala peeji na-edebe ohere na εἰς nwere ike ịpụta “n'etiti,” nakwa na ἔθνη nwere ike ịpụta “ndị mba ọzọ” n'ọnọdụ ụfọdụ.
- issue: Ike δεῖ nwere
  choice: aghaghị
  alternative: ọ dị mkpa ka
  rationale: “Aghaghị” na-echekwa mkpa dị n'okwu Grik ahụ, ma ọ naghị akọwa kpọmkwem na ọ bụ iwu Chineke, ebe amaokwu a ekwughị isi mmalite mkpa ahụ n'ụzọ doro anya.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji “Oziọma” maka okwu a maara n'ọgbakọ na n'akwụkwọ nsọ, ma e nyere ihe ọ pụtara n'ụzọ nkịtị na ndetu. Nhazi okwu ahụ na-ezere passive dị arọ nke na-adịghị ada nke ọma n'Igbo, ma na-echekwa mkpa, usoro oge, na ókè zuru ụwa ọnụ nke isi mmalite Grik.
