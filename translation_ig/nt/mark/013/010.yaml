    text: Ma ọ bụ, “ozi ọma.” Okwu Grik εὐαγγέλιον pụtara n'ụzọ nkịtị “ozi ọma.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’etiti mba niile”; n’ọnọdụ ụfọdụ, ἔθνη nwekwara ike ịpụta “ndị mba ọzọ.”
    reason: alternative_reading
  revision_rationale: The revision supplies “Na,” for καὶ while retaining the draft's accurate rendering of necessity, temporal sequence, public proclamation, and universal scope. Footnote b has only been normalized typographically; it continues to preserve, rather than settle, the contextual range of ἔθνη.
