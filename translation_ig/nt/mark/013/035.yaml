source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: ig
  text: 'Ya mere, mụrụnụ anya[a], n’ihi na unu amaghị mgbe onye nwe ụlọ ahụ ga-abịa: ma ọ̀ bụ ná mgbede, ma ọ bụ n’etiti abalị, ma ọ bụ n’oge akwa oke ọkụkọ[b], ma ọ bụ n’ụtụtụ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nọgidenụ na-eche nche.” Iwu a pụtara ịnọ na nche, ịmụrụ anya, na ịdị njikere.
    reason: lexical_alternative
  - marker: b
    text: “Oge akwa oke ọkụkọ” bụ otu n’ime oge e kewara abalị maka nche, nke e ji mkpu oke ọkụkọ amata.
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: mụrụ anya
  rationale: Iwu a na-akpọ ndị na-ege ntị ka ha nọgide na-amụ anya ma dị njikere; okwu Igbo a bụ nke mmadụ nkịtị na-aghọta ma na-eburu echiche nke ịmụrụ anya na nche.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya.
- source_word: οὐκ οἴδατε
  choice: unu amaghị
  rationale: Nke a na-asụgharị ngwaa ịma nke a jụrụ n’ụzọ kwụ ọtọ, n’etinyeghị nkọwa na-adịghị na Grik.
- source_word: πότε
  choice: mgbe
  rationale: Ọ bụ okwu oge n’ajụjụ na-apụtaghị ìhè; “mgbe” bụ okwu Igbo dị mfe ma ziri ezi.
- source_word: ὁ κύριος τῆς οἰκίας
  choice: onye nwe ụlọ ahụ
  rationale: N’onyonyo banyere ezinụlọ a, okwu a na-egosi onye nwere ikike n’ụlọ. “Onye nwe ụlọ” na-enye nghọta ahụ n’Igbo n’emeghị ka ọ bụrụ aha nsọ kpọmkwem.
- source_word: ἔρχεται
  choice: ga-abịa
  rationale: Ọ bụ ugbu a nke na-arụ ọrụ maka ọbịbịa a na-atụ anya n’ọdịnihu; ọdịnihu Igbo na-ekwupụta ya nke ọma.
- source_word: ὀψὲ
  choice: ná mgbede
  rationale: N’usoro oge nche abalị a, ọ na-ezo aka n’oge mgbede.
- source_word: μεσονύκτιον
  choice: n’etiti abalị
  rationale: Nke a bụ ụzọ Igbo doro anya e si ekwu etiti abalị.
- source_word: ἀλεκτοροφωνίας
  choice: n’oge oke ọkụkọ na-akụ
  rationale: Okwu ahụ na-ezo aka n’oge nche abalị e ji mkpu oke ọkụkọ amata; ntụgharị a na-eme ka omenala oge ahụ doo onye Igbo anya.
- source_word: πρωΐ
  choice: n’ụtụtụ
  rationale: Ọ na-egosi oge nche ikpeazụ nke abalị na-abanye n’ụtụtụ, n’akọwaghị ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Ịsụgharị κύριος n’okwu ihe atụ banyere onye isi ụlọ nke nwekwara ike izo aka na Jizọs
  choice: onye nwe ụlọ ahụ
  alternative: Onyenwe ụlọ ahụ
  rationale: Ọnọdụ okwu a bụ ihe atụ nke ụlọ, ya mere ntụgharị a na-edobe echiche nkịtị nke onye nwere ụlọ na onye nwere ikike n’ime ya, ma ọ naghị agọnahụ na ihe atụ ahụ nwere ike izo aka na Jizọs.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro oge nche anọ nke Grik, tinyekwa akara ukwu okwu [a] na [b] n’ebe kwesịrị ekwesị.
