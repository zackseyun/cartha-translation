review_pass:
  verdict: revise
  source_fidelity: The translation preserves the imperative, causal connection, uncertainty of the householder's arrival, and all four time markers. However, γρηγορεῖτε is a plural imperative addressed to «unu», so «mụrụ anya» should be corrected to «mụrụnụ anya». «N’oge akwa oke ọkụkọ» more directly represents ἀλεκτοροφωνίας (“at cockcrow/crowing of a rooster”) than the finite-clause form «n’oge oke ọkụkọ na-akụ».
  naturalness: The revised plural imperative is grammatical Standard Igbo and agrees with the plural audience. «Akwa oke ọkụkọ» is a natural concise temporal expression. The rest is clear, dignified, and suitable for Scripture.
  terminology: «Onye nwe ụlọ ahụ» naturally conveys the householder/master in this domestic parabolic context without imposing a titular reading of κύριος. The cultural footnote appropriately explains the cockcrow time marker.
  issues:
  - severity: medium
    issue: Plural imperative agreement
    rationale: The Greek γρηγορεῖτε is plural, and the verse explicitly addresses «unu». Standard Igbo should use «mụrụnụ anya», not singular «mụrụ anya».
  - severity: low
    issue: Cockcrow expression can be more idiomatic and lexically direct
    rationale: «N’oge akwa oke ọkụkọ» directly names the rooster's crowing, whereas «n’oge oke ọkụkọ na-akụ» uses a fuller verbal expression. Both are understandable, but the former better matches the source time-marker.
  revised_text: 'Ya mere, mụrụnụ anya[a], n’ihi na unu amaghị mgbe onye nwe ụlọ ahụ ga-abịa: ma ọ̀ bụ ná mgbede, ma ọ bụ n’etiti abalị, ma ọ bụ n’oge akwa oke ọkụkọ[b], ma ọ bụ n’ụtụtụ.'
  revised_footnotes:
