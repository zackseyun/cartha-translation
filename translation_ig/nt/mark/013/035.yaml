    text: Ma ọ bụ, “nọgidenụ na-eche nche.” Iwu a pụtara ịnọ na nche, ịmụrụ anya, na ịdị njikere.
    reason: lexical_alternative
  - marker: b
    text: “Oge akwa oke ọkụkọ” bụ otu n’ime oge e kewara abalị maka nche, nke e ji mkpu oke ọkụkọ amata.
    reason: cultural_note
