id: MRK.13.21
reference: Mark 13:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: ig
  text: Mgbe ahụkwa, ọ bụrụ na onye ọ bụla asị unu, “Lee, Mesaịa ahụ[a] nọ ebe a!” ma ọ bụ, “Lee, ọ nọ ebe ahụ!” unu ekwela okwu ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst ahụ.”
    reason: Ọ bụ nsụgharị ọzọ nke utu aha Greek bụ χριστός.
lexical_decisions:
- source_word: καὶ τότε
  choice: Mgbe ahụkwa
  rationale: Nke a na-ejikọta ịdọ aka ná ntị a na okwu ndị bu ya ụzọ ma na-egosikwa oge na-esochi; “-kwa” na-echekwa njikọ καὶ n’ụzọ Igbo na-ada nke ọma.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: ọ bụrụ na onye ọ bụla asị unu
  rationale: Nke a na-egosipụta ọnọdụ izugbe, ebe τις pụtara onye ọ bụla a na-akọwaghị kpọmkwem.
- source_word: Ἴδε
  choice: Lee
  rationale: “Lee” bụ okwu Igbo doro anya nke a na-eji adọta uche mmadụ, n’enweghị ụda okwu ochie na-adịghịzi mfe nghọta.
- source_word: ὧδε
  choice: nọ ebe a
  rationale: “Ebe a” na-egosipụta ebe dị nso dịka ὧδε si dị; e tinyere “nọ” ka ahịrịokwu Igbo zuo oke ma daa nke ọma.
- source_word: ὁ χριστός
  choice: Mesaịa ahụ
  rationale: N’ebe a χριστός bụ utu aha nke onye a tere mmanụ, ọ bụghị aha onwe; “Mesaịa ahụ” na-echekwa ọnọdụ ahụ na isiokwu a kapịrị ọnụ nke Greek.
- source_word: ἐκεῖ
  choice: nọ ebe ahụ
  rationale: “Ebe ahụ” na-echekwa ọdịiche dị n’etiti ebe dị nso na ebe dị anya; e weghachiri isiokwu ahụ n’Igbo ka okwu ahụ doo anya.
- source_word: μὴ πιστεύετε
  choice: unu ekwela okwu ahụ
  rationale: Greek ahapụghị ihe a na-ekwesịghị ikwere n’aha kpọmkwem. N’ọnọdụ a, “okwu ahụ” na-egosi na ihe a na-ajụ bụ nkwupụta ahụ, ọ bụghị naanị onye kwuru ya.
theological_decisions:
- issue: Nsụgharị χριστός
  choice: Mesaịa
  alternative: Kraịst; Onye ahụ e tere mmanụ
  rationale: N’ọnọdụ a, okwu ahụ na-arụ ọrụ dị ka utu aha nke onye nzọpụta a na-atụ anya ya. “Mesaịa” na-echekwa ike nke utu aha ahụ, ebe e debere “Kraịst” n’okpuru peeji maka ndị maara nsụgharị ọdịnala.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị nsọ n’ụda ya. E jiri “Lee” mee ka ịdọ aka ná ntị ahụ sie ike, ma zere okwu ochie ma ọ bụ nkọwa nke otu ụka pụrụ iche.
