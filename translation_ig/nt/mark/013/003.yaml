translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ usoro aha ndị jikọtara na “na” ugboro ugboro iji gosipụta usoro okwu Grik, ma e chekwara imperfect ἐπηρώτα dịka omume na-aga n'ihu.
