  text: Καὶ καθημένου αὐτοῦ εἰς τὸ Ὄρος τῶν Ἐλαιῶν κατέναντι τοῦ ἱεροῦ ⸀ἐπηρώτα αὐτὸν κατ’ ἰδίαν Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: ig
  text: Mgbe ọ nọ ọdụ n'Ugwu Oliv, n'ebe chere ụlọ nsọ[a] ihu, Pita na Jemis na Jọn na Andru nọ na-ajụ ya n'iche,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ ἱερόν na-ezo aka n'ogige ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n'ime ya (ναός).
    reason: lexical_alternative
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: Mgbe ọ nọ ọdụ
  rationale: Nkebiokwu genitive absolute nke nwere present participle na-egosi ọnọdụ na-aga n'ihu; nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke eke isi kọwaa ọnọdụ ahụ.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: n'Ugwu Oliv
  rationale: N'ebe a, εἰς na-egosi ebe ọ nọ, ọ bụghị mmegharị ịbanye n'ebe ahụ. “Ugwu Oliv” bụ aha ala a ghọtara nke ọma n'Igbo.
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: na ncherita ihu ụlọ nsọ
  rationale: κατέναντι pụtara ịnọ n'ihu ihe ma ọ bụ n'akụkụ nke chere ya ihu. Nsụgharị a na-echekwa echiche ahụ n'ụzọ doro anya.
- source_word: ἐπηρώτα
  choice: nọ na-ajụ ya
  rationale: Imperfect ἐπηρώτα na-egosi omume na-aga n'ihu n'oge ahụ; “nọ na-ajụ” na-echekwa akụkụ a karịa naanị “jụrụ.”
- source_word: κατ’ ἰδίαν
  choice: na nzuzo
  rationale: Nkebiokwu a pụtara ịgwa mmadụ okwu iche, n'ebe ndị ọzọ na-anọghị; “na nzuzo” bụ okwu Igbo dị nkenke ma dịkwa eke.
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: Pita na Jemis na Jọn na Andru
  rationale: Aha ndị ahụ ka e depụtara n'ụdị a na-ahụkarị n'Igbo, ebe e chekwara njikọ “na” ugboro ugboro dịka ọ dị n'asụsụ Grik.
- source_word: ἱεροῦ
  choice: ụlọ nsọ
  rationale: ἱερόν na-ezo aka n'ogige ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n'ime; “ụlọ nsọ” bụ okwu ndị nkịtị na-aghọta, ebe nkọwa ala peeji na-eme ka oke ihe okwu Grik ahụ pụtara doo anya.
