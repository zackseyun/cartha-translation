revisions:
- from: Mgbe ọ nọ ọdụ n'Ugwu Oliv, na ncherita ihu ụlọ nsọ[a], Pita na Jemis na Jọn na Andru nọ na-ajụ ya na nzuzo,
  to: Mgbe ọ nọ ọdụ n'Ugwu Oliv, n'ebe chere ụlọ nsọ[a] ihu, Pita na Jemis na Jọn na Andru nọ na-ajụ ya n'iche,
  rationale: The revision replaces an unnatural locative expression with idiomatic Standard Igbo while retaining the spatial sense of κατέναντι. It also renders κατ’ ἰδίαν as “n'iche” to express a private, apart-from-others conversation without implying concealment. The imperfect “nọ na-ajụ” is retained for ἐπηρώτα, and the temple-complex footnote remains anchored to “ụlọ nsọ.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:21:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the genitive-absolute setting, the location on the Mount of Olives facing the temple complex, the imperfect aspect of ἐπηρώτα ('nọ na-ajụ'), the four named disciples, and the private character of the questioning. The Greek text has ἐπηρώτα, an imperfect, so the ongoing formulation should be retained rather than the aoristic English audit-trail revision 'asked.'
  naturalness: “Na ncherita ihu ụlọ nsọ” is not idiomatic Standard Igbo for a location opposite/facing something. “N'ebe chere ụlọ nsọ ihu” is clear and natural. “N'iche” conveys private/apart more precisely in this context than “na nzuzo,” which can suggest secrecy.
  terminology: “Ugwu Oliv,” “ụlọ nsọ,” and the established Igbo forms Pita, Jemis, Jọn, and Andru are suitable. The footnote properly distinguishes ἱερόν, the temple precinct/complex, from ναός, the inner sanctuary.
  issues:
  - severity: medium
    issue: Unidiomatic rendering of κατέναντι
    rationale: “Na ncherita ihu ụlọ nsọ” is awkward and not standard modern Igbo idiom. The source means 'opposite/facing the temple [complex],' naturally expressed as “n'ebe chere ụlọ nsọ ihu.”
  - severity: low
    issue: Potentially misleading nuance for κατ’ ἰδίαν
    rationale: “Na nzuzo” may imply covert action. “N'iche” more directly communicates that the disciples addressed him apart from others, without adding a secrecy implication.
  revised_text: Mgbe ọ nọ ọdụ n'Ugwu Oliv, n'ebe chere ụlọ nsọ[a] ihu, Pita na Jemis na Jọn na Andru nọ na-ajụ ya n'iche,
  revised_footnotes:
