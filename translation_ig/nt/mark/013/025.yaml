  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: ig
  text: Kpakpando ga na-ada site n’eluigwe[a], ike ndị dị n’eluigwe[b] ga-ama jijiji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site na mbara igwe.” Okwu Grik οὐρανός nwere ike ịpụta “eluigwe” ma ọ bụ “mbara igwe,” dịka ọnọdụ okwu siri dị.
    reason: lexical_alternative
  - marker: b
    text: “Ike ndị dị n’eluigwe” nwere ike izo aka n’ike nke eluigwe, n’ike dị iche iche nke mbara igwe, ma ọ bụ n’usoro na ihe ndị mejupụtara eluigwe; okwu Grik akọwaghị ya karịa nke a.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: Kpakpando
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa kpakpando, ọ dabakwara n’ọnọdụ ihe ndị dị na mbara elu a na-ekwu maka ha.
- source_word: ἔσονται ... πίπτοντες
  choice: ga na-esi ... na-ada
  rationale: Usoro ‘ga na-...’ na-egosi omume ga na-aga n’ihu ma na-echekwa mmetụta nke future periphrastic dị n’asụsụ Grik karịa nanị ‘ga-ada.’
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: n’eluigwe
  rationale: ‘Eluigwe’ nwere ike ịpụta ebe obibi nke eluigwe ma ọ bụ mbara elu, ya mere ọ na-echekwa obosara ihe οὐρανός pụtara n’ebe a.
- source_word: δυνάμεις
  choice: ike
  rationale: ‘Ike’ na-ahapụ okwu ahụ n’obosara ya, n’akọwaghị ma ọ bụ ndị mmụọ nwere ike, ike ndị na-achị ihe dị n’ụwa na mbara igwe, ma ọ bụ ihe ndị mejupụtara eluigwe.
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: dị n’eluigwe
  rationale: Nkebi a na-egosi ebe ike ndị ahụ dị n’enweghị ịkọwa ụdị ha. Ọ bụ ezie na Grik ji ụdị ọtụtụ mee ‘heavens,’ Igbo na-ejikarị ‘eluigwe’ n’otu ụdị kpuchie echiche ahụ n’ụzọ ebumpụta ụwa.
- source_word: σαλευθήσονται
  choice: ga-ama jijiji
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa ike isi kwuo na a ga-eme ka ihe maa jijiji ma ọ bụ na ntọala ya ga-ama jijiji; ọ dabara n’usoro okwu amụma nke ebe a.
theological_decisions:
- issue: Ihe ‘ike dị n’eluigwe’ pụtara
  choice: E debere ya n’ozuzu dịka ‘ike dị n’eluigwe,’ n’akọwaghị ụdị ike ndị ahụ.
  alternative: A pụrụ ịkọwa ya dịka ndị mmụọ nwere ike n’eluigwe, ike dị iche iche nke eluigwe, ma ọ bụ usoro na ihe ndị mejupụtara eluigwe.
  rationale: Okwu Grik ahụ akọwaghị nke ọ bụ kpọmkwem, ọnọdụ amụma a na-enyekwa ohere maka nghọta ndị a; nsụgharị ekwesịghị ikpebi ihe ederede ahụ hapụrụ ghe oghe.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị nsọ ma dịkwa mfe nghọta. ‘Ga na-esi ... na-ada’ na-eme ka omume ọdịda ahụ pụta ìhè dịka ihe ga na-eme, ebe ‘ga-ama jijiji’ na-enye njedebe okwu ahụ ike kwesịrị ekwesị n’asụsụ Igbo.
