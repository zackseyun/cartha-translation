  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ ⸀μὴ ⸁παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ig
  text: Eluigwe na ụwa ga-agabiga, ma okwu m agaghị agabiga ma ọlị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “agaghị agabiga mgbe ọ bụla.” Grik ji njụ e mesiri ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: Eluigwe
  rationale: N'okwu a e jikọtara ya na “ụwa,” ọ na-ezo aka n'eluigwe dịka akụkụ nke ihe niile e kere eke, ọ bụghị naanị mbara elu a na-ahụ anya.
- source_word: ἡ γῆ
  choice: ụwa
  rationale: N'ahịrịokwu a bụ “eluigwe na ụwa,” ọ pụtara ụwa dum, ọ bụghị otu ala ma ọ bụ obodo.
- source_word: παρελεύσονται
  choice: ga-agabiga
  rationale: Nhọrọ a na-egosi na eluigwe na ụwa ga-akwụsị ịdị n'ọnọdụ ha dị ugbu a, ma ọ naghị akọwa n'ụzọ karịrị ihe Grik kwuru otú nke ahụ ga-esi mee.
- source_word: δὲ
  choice: ma
  rationale: “Ma” na-egosipụta ọdịiche siri ike dị n'etiti ihe ndị e kere eke ga-agabiga na okwu Jizọs nke na-agaghị agabiga.
- source_word: οἱ λόγοι μου
  choice: okwu m
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke ziri ezi si ekwu okwu ma ọ bụ nkwupụta Jizọs.
- source_word: οὐ μὴ παρελεύσονται
  choice: agaghị agabiga ma ọlị
  rationale: “Ma ọlị” na-eme ka nkwụsi ike nke njụ Grik οὐ μή pụta ìhè n'Igbo nke oge a.
theological_decisions:
- issue: Ike nke njụ siri ike Jizọs ji kwuo banyere okwu ya
  choice: agaghị agabiga ma ọlị
  alternative: agaghị agabiga mgbe ọ bụla
  rationale: Nsụgharị ahụ na-echekwa ọdịiche dị n'etiti ihe e kere eke nke ga-agabiga na ịdịgide nke okwu Jizọs, ma na-eme ka njụ siri ike dị na οὐ μή doo anya.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ga-agabiga” na-echekwa otu ngwaa ahụ n'akụkụ abụọ nke amaokwu ahụ, ebe “ma ọlị” na-eme ka njụ e mesiri ike pụta ìhè.
