revisions:
- from: Ma na-ekpe ekpere ka ọ ghara ime n'oge oyi.[a]
  to: Ma kpeenụ ekpere ka ọ ghara ime n'oge oyi.[a]
  rationale: The revision makes the plural imperative explicit in idiomatic Standard Igbo while retaining the source text’s unspecified “it.” The footnote continues to offer the contextual expansion only as an alternative and explains Mark’s ellipsis without treating Matthew’s wording as part of Mark’s text.
