  text: προσεύχεσθε δὲ ἵνα μὴ ⸀γένηται χειμῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: ig
  text: Ma kpeenụ ekpere ka ọ ghara ime n'oge oyi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ma a kọwaa ya n'ụzọ zuru ezu site n'ihe ndị gbara ya gburugburu, “ka mgbapụ unu ghara ime n'oge oyi.” N'asụsụ Grik Mak dere, ekwughị ihe ahụ ga-eme kpọmkwem; okwu ya dị mkpirikpi karịa nke Matiu 24:20.
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: na-ekpe ekpere
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ. N'Igbo, njikọ ya na “Ma” na-eme ka “na-ekpe ekpere” bụrụ ụzọ dị mfe ma kwekọọ n'asụsụ ugbu a, n'etinyeghị echiche siri ike nke ‘na-ekpe ekpere mgbe niile’ nke akụkụ ngwaa ahụ anaghị achọ ka a kọwaa kpọmkwem ebe a.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi njikọ nwere ntakịrị ọdịiche na ịdọ aka ná ntị dị n'amaokwu bu ụzọ; “Ma” dabara nke ọma n'usoro okwu Igbo.
- source_word: ἵνα μὴ
  choice: ka ... ghara
  rationale: Nke a bụ ụzọ Igbo si egosipụta ihe a na-arịọ n'ekpere n'ụdị nkwụsị, n'ụzọ doro anya ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: γένηται
  choice: ọ ghara ime
  rationale: “Ime” na-egosi na ihe ahụ agaghị eme ma na-ahapụkwa ihe “ọ” na-anọchi anya ya n'ụzọ na-akọwaghị kpọmkwem, dịka Grik si mee.
- source_word: χειμῶνος
  choice: n'oge oyi
  rationale: Ọ bụ genitive nke oge e ji mee adverb; “n'oge oyi” bụ okwu Igbo doro anya ma kwekọọ n'echiche nke oge oyi.
theological_decisions:
- issue: Ihe γένηται na-ezo aka na ya ekwughị kpọmkwem
  choice: 'E debere ya n''ụdị izugbe: “ka ọ ghara ime.”'
  alternative: “ka mgbapụ unu ghara ime n'oge oyi”
  rationale: Grik Mak ekwughị “mgbapụ unu” kpọmkwem, n'adịghị ka Mat 24:20. Ya mere, ntụgharị ahụ anaghị ebubata okwu sitere n'ebe yiri ya, kama ọ na-echekwa mkpụmkpụ na enweghị nkọwa zuru ezu nke Mak.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị nsọ ma dị mfe nghọta. E chekwara mkpụmkpụ na ihe a hapụrụ n'amaghị kpọmkwem n'ahịrịokwu Grik, ebe nkọwa ọzọ dị n'okpuru ala.
