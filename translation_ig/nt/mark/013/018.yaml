review_pass:
  verdict: revise
  source_fidelity: The draft properly preserves Mark’s elliptical subject of γένηται and does not import “your flight” into the main text. However, “na-ekpe ekpere” is normally read as a progressive/descriptive form rather than an unambiguous plural imperative in this brief independent clause. The Greek is a plural imperative.
  naturalness: “Ma kpeenụ ekpere” is a clear, natural Standard Igbo exhortation. “Ka ọ ghara ime n'oge oyi” naturally retains the unspecified event/circumstance.
  terminology: “Kpeenụ ekpere” appropriately renders προσεύχεσθε. The footnote is revised for smoother Standard Igbo and identifies Matthew by its usual Igbo name.
  issues:
  - severity: medium
    issue: Main-clause verb form is not clearly imperative
    rationale: “Ma na-ekpe ekpere” can be understood as “but [they/you] are praying,” whereas προσεύχεσθε directly commands the plural audience. “Kpeenụ ekpere” clearly conveys the command without over-specifying continuous action.
  - severity: low
    issue: Footnote wording and book name are somewhat awkward
    rationale: “Grik Mak” is less natural than “Grik Mak dere,” and “Matiu” is the usual Igbo form for Matthew. The revised note also more precisely says that Mark does not state the referent explicitly.
  revised_text: Ma kpeenụ ekpere ka ọ ghara ime n'oge oyi.[a]
