  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης ἢ ⸀τῆς ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι ⸀ἐν οὐρανῷ οὐδὲ ὁ υἱός, εἰ μὴ ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: ig
  text: Ma banyere ụbọchị ahụ ma ọ bụ oge awa ahụ, ọ dịghị onye maara—ọbụnadị ndị mmụọ ozi nọ n’eluigwe, ọbụnadị Ọkpara ahụ—ma e wezụga Nna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ndị na-akọwa Akwụkwọ Nsọ na-aghọta nkebi okwu ahụ banyere Ọkpara ahụ dịka ihe metụtara ọrụ Ọkpara mgbe ọ ghọrọ mmadụ ma ọ bụ ọdịdị mmadụ ya. Ntụgharị a debere okwu Grik ahụ dịka ọ dị, n’etinyeghị nkọwa ahụ n’ahịrị bụ isi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Ma banyere
  rationale: “Banyere” na-ewebata isiokwu a na-ekwu maka ya, ebe “ma” na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n’ihe e kwuru tupu ya.
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: ụbọchị ahụ ma ọ bụ oge awa ahụ
  rationale: Nke a na-edobe ọdịiche dị n’etiti ụbọchị ahụ n’ozuzu ya na oge awa ahụ kpọmkwem, ma na-ada nke ọma n’Igbo.
- source_word: οὐδεὶς οἶδεν
  choice: ọ dịghị onye maara
  rationale: οἶδα nwere nghọta nke ugbu a n’ebe a; okwu Igbo a na-egosipụta ya n'ụzọ doro anya ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: ọbụladị ndị mmụọ ozi nọ n’eluigwe
  rationale: “Ọbụladị” na-egosipụta ike nke οὐδέ, ebe “ndị ... nọ n’eluigwe” na-egosipụta ἐν οὐρανῷ dị ka ebe ha nọ.
- source_word: οὐδὲ ὁ υἱός
  choice: ma Ọkpara ahụ amaghịkwa ya
  rationale: Nke a na-aga n’ihu n’usoro ịjụ ahụ n'ụzọ Igbo doro anya, ma na-edobe “Ọkpara ahụ” dị ka aha-ọkwa Kraịst n’enweghị ịkọwa ya n’ụzọ ga-ebelata esemokwu dị n’okwu Grik.
- source_word: εἰ μὴ ὁ πατήρ
  choice: naanị Nna maara ya
  rationale: Mgbe ọ gbasịrị okwu ịjụ, εἰ μή na-egosi otu onye a kpọpụrụ iche; “naanị Nna” na-egosipụta na ọ bụ naanị ya maara.
theological_decisions:
- issue: Nkwupụta banyere Ọkpara na-amaghị ụbọchị ahụ ma ọ bụ oge awa ahụ
  choice: E debere n’ahịrị ntụgharị okwu ahụ na Ọkpara ahụ amaghị ya, n’enweghị ime ka okwu ahụ dị nro ma ọ bụ tinye nkọwa ozizi n’ime ya.
  alternative: Ịgbakwunye “n’ọdịdị mmadụ ya” ma ọ bụ “n’ọrụ ya mgbe ọ ghọrọ mmadụ,” ma ọ bụ iwepụ nkebi okwu ahụ.
  rationale: SBLGNT nwere οὐδὲ ὁ υἱός n'ụzọ doro anya. Ya mere, ntụgharị a na-edobe okwu na esemokwu nkà mmụta okpukpe dị na ya, ma hapụ nkọwa ndị na-achọ ime ka ya na ozizi ndị ọzọ kwekọọ n’ihe odide ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Oge awa ahụ” na-ezere nghọtahie nke “oge” naanị, ebe “Ọkpara ahụ” na-edobe aha-ọkwa ahụ. Akara ala peeji [a] dị ozugbo n’akụkụ nkebi okwu ọ na-akọwa.
