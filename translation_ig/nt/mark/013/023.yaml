- from: Ma unu onwe unu[a], nọrọnụ na nche; agwala m unu ihe niile tupu oge eruo.[b]
  to: Ma unu, kpacharanụ anya[a]; agwala m unu ihe niile tupu oge eruo.[b]
  rationale: The revision retains the contrastive emphasis of ὑμεῖς with “Ma unu” but avoids adding an unnecessary reflexive nuance. It uses the more direct modern Igbo warning “kpacharanụ anya” for βλέπετε and moves the lexical-alternative anchor to that imperative. The perfect force and advance disclosure of προείρηκα are retained in “agwala m … tupu oge eruo.”
