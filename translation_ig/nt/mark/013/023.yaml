  yaml_path: translation/nt/mark/013/023.yaml
  text: But you[a], watch out[b]; I have told you all things beforehand.
translation:
  language: ig
  text: Ma unu, kpacharanụ anya[a]; agwala m unu ihe niile tupu oge eruo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nọrọnụ na nche” ma ọ bụ, “lezienụ anya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ekwuola m unu ihe niile tupu oge eruo,” ma ọ bụ, “Adọọla m unu aka ná ntị banyere ihe niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: unu onwe unu
  rationale: Nnọchiaha a pụtara ìhè n'asụsụ Grik ma nwee nkwusiri ike; “unu onwe unu” na-echekwa nkwusiri ike na ọdịiche ahụ n'Igbo.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi ntụgharị nwere ọdịiche n'ihe e kwuru tupu ya.
- source_word: βλέπετε
  choice: nọrọnụ na nche
  rationale: N'ebe a, ngwaa ahụ bụ iwu nye ọtụtụ mmadụ ka ha na-amụ anya ma na-akpachara anya, ọ bụghị naanị ka ha lee anya.
- source_word: προείρηκα
  choice: agwala m ... tupu oge eruo
  rationale: Nke a na-egosi na Jizọs kwuru ihe ndị a tupu ha emee, nakwa na okwu ahụ ka bara uru ugbu a.
- source_word: ὑμῖν
  choice: unu
  rationale: Ọ bụ ndị a na-agwa okwu; Igbo na-etinye ya n'ụzọ nkịtị dịka “agwala m unu.”
- source_word: πάντα
  choice: ihe niile
  rationale: “Ihe niile” bụ nsụgharị Igbo doro anya ma dị mma nke na-echekwa obosara okwu Grik ahụ n'enweghị ịkọwa oke ya karịa ihe gbara amaokwu ahụ gburugburu.
theological_decisions:
- issue: Ike ịdọ aka ná ntị Jizọs na ihe o kwuru tupu oge eruo
  choice: A hapụrụ iwu ahụ ka ọ bụrụ oku siri ike ka ndị na-eso ụzọ nọgide na nche, ebe Jizọs gwaworola ha ihe niile tupu oge eruo.
  alternative: Ịkọwa ya dịka na Jizọs nyere nkọwa zuru ezu banyere ihe ọ bụla ga-eme n'ọdịnihu, ma ọ bụ na ọ na-ekwu naanị banyere ịdọ aka ná ntị ndị dị ozugbo tupu amaokwu a.
  rationale: πάντα nwere obosara nke e kwesịghị ibelata ma ọ bụ gbasaa site na nsụgharị. “Ihe niile” na-echekwa mgbagwoju anya ahụ, ebe ihe gbara amaokwu ahụ gburugburu na-enyere onye na-agụ ya aka ịghọta ihe ọ na-ezo aka na ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “nọrọnụ na nche” zipụta iwu na-aga n'ihu nye ọtụtụ mmadụ; e ji “unu onwe unu” chekwaa nkwusiri ike nke ὑμεῖς. Akara nkọwa ala peeji [a] na [b] dị n'ederede bụ isi.
