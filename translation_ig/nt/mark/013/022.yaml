id: MRK.13.22
reference: Mark 13:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται καὶ δώσουσιν σημεῖα καὶ τέρατα πρὸς τὸ ἀποπλανᾶν εἰ ⸀δυνατὸν τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: ig
  text: N’ihi na ndị Mesaya ụgha[a] na ndị amụma ụgha ga-apụta, ha ga-emekwa ihe ịrịba ama na ihe ebube iji duhie ndị a họọrọ, ma ọ bụrụ na ọ ga-ekwe omume[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị Kraịst ụgha.” Okwu Grik a sitere na Christos, nke e ji dịka aha-ọkwa pụtara “Mesaya” n’ebe a.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “a sị na ọ ga-ekwe omume.” Okwu Grik ahụ ekwughị hoo haa ma a pụrụ iduhie ndị a họọrọ n’ezie; ọ na-ekwu maka nzube ndị nduhie ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: ga-apụta
  rationale: N’ebe a, ngwaa ahụ na-ekwu maka mpụta ma ọ bụ bilie nke ndị ahụ n’ihu ọha; “ga-apụta” bụ Igbo doro anya nke na-adịghị egosi na Chineke bụ onye welitere ha.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ịdọ aka ná ntị dị n’ihu ya dịka nkọwa ma ọ bụ ihe kpatara ya.
- source_word: ψευδόχριστοι
  choice: ndị Mesaya ụgha
  rationale: Χριστός dị n’okwu a bụ aha-ọkwa pụtara Mesaya; nsụgharị a na-egosipụta echiche ahụ n’enweghị ime ka ọ bụrụ naanị aha mmadụ.
- source_word: ψευδοπροφῆται
  choice: ndị amụma ụgha
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ ma bụrụkwa nke a na-aghọta nke ọma isi sụgharịa ngwakọta okwu ahụ.
- source_word: δώσουσιν σημεῖα καὶ τέρατα
  choice: ha ga-emekwa ihe ịrịba ama na ihe ebube
  rationale: Ọ bụ ezie na δώσουσιν pụtara n’ụzọ nkịtị “ha ga-enye,” n’Igbo, “ime ihe ịrịba ama na ihe ebube” bụ okwu eke maka ịrụ ihe ndị ahụ ma na-echekwa njikọ σημεῖα καὶ τέρατα.
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: iji duhie
  rationale: “Iji” na-egosipụta nzube nke ihe ha ga-eme; “duhie” na-enye echiche nke iduga mmadụ pụọ n’ezi ụzọ.
- source_word: εἰ δυνατόν
  choice: ma ọ bụrụ na ọ ga-ekwe omume
  rationale: Ọ na-echekwa ọnọdụ nke okwu Grik ahụ n’emeghị mkpebi ma a pụrụ iduhie ndị a họọrọ n’ezie ma ọ bụ na a pụghị.
- source_word: τοὺς ἐκλεκτούς
  choice: ndị a họọrọ
  rationale: Ọ na-egosipụta kpọmkwem ndị Chineke họọrọ, ma na-ezere ịtinye nkọwa otu ụka ma ọ bụ ozizi pụrụ iche.
theological_decisions:
- issue: Otu e si asụgharị ψευδόχριστοι ebe Χριστός bụ aha-ọkwa
  choice: ndị Mesaya ụgha
  alternative: ndị Kraịst ụgha; ndị na-azọrọ na ha bụ Kraịst
  rationale: N’ime ngwakọta okwu a, Χριστός pụtara Mesaya. “Ndị Mesaya ụgha” na-eme ka ihe okwu ahụ pụtara doo anya ma na-echekwa ọnọdụ ndị Juu na-atụ anya Mesaya.
- issue: Ma εἰ δυνατόν na-ekwu na iduhie ndị a họọrọ ga-ekwe omume n’ezie
  choice: ma ọ bụrụ na ọ ga-ekwe omume
  alternative: ọ bụrụ na ọ pụrụ ime; a sị na ọ ga-ekwe omume
  rationale: Okwu Grik ahụ hapụrụ ya dịka ọnọdụ, ọ kọwaghị hoo haa ma ihe ahụ ga-ekwe omume ma ọ bụ na ọ gaghị ekwe omume. Nsụgharị ahụ na-echekwa esemokwu nkà mmụta okpukpe a.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke nwere ugwu ma dịkwa mfe nghọta. Nhazi “iji duhie, ma ọ bụrụ na ọ ga-ekwe omume, ndị a họọrọ” na-anọ nso n’usoro Grik ma na-echekwa mgbagwoju anya nke ọnọdụ ahụ; akara rikoma na-enyere onye na-agụ ya aka ịghọta nkebi ahịrịokwu ahụ.
