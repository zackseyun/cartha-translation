revisions:
- from: N’ihi na ndị Mesaya ụgha[a] na ndị amụma ụgha ga-apụta, ha ga-emekwa ihe ịrịba ama na ihe ebube iji duhie, ma ọ bụrụ na ọ ga-ekwe omume[b], ndị a họọrọ.
  to: N’ihi na ndị Mesaya ụgha[a] na ndị amụma ụgha ga-apụta, ha ga-emekwa ihe ịrịba ama na ihe ebube iji duhie ndị a họọrọ, ma ọ bụrụ na ọ ga-ekwe omume[b].
  rationale: The revision improves Standard Igbo word order by keeping the object of “duhie” adjacent to the verb. The final conditional still naturally modifies the intended deception and does not decide whether deceiving the elect is actually possible. Footnote b is corrected for idiomatic grammar, with no theological or semantic expansion.
