id: MRK.13.11
reference: Mark 13:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: ig
  text: Ma mgbe ha duru unu gaa nyefee unu, unu echegbula onwe unu tupu oge eruo banyere ihe unu ga-ekwu. Kama, ihe ọ bụla e nyere unu n’oge ahụ, kwuonụ ihe ahụ. N’ihi na ọ bụghị unu bụ ndị na-ekwu okwu, kama ọ bụ Mmụọ Nsọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὅταν
  choice: Ma mgbe
  rationale: Nke a jikọtara okwu ahụ na ihe bu ya ụzọ ma gosipụta ọnọdụ a tụrụ anya na ọ ga-eme n’ọdịnihu.
- source_word: ἄγωσιν ὑμᾶς παραδιδόντες
  choice: ha kpọọrọ unu gaa nyefee unu n’aka ndị ọchịchị[a]
  rationale: “Kpọọrọ unu gaa” na-egosi mmegharị a manyere amanye; “nyefee unu n’aka” na-egosi inyefe ndị e jidere n’aka ndị nwere ikike. A kọwara mgbakwunye dabere n’ọnọdụ ahụ na ndetu ala peeji.
- source_word: μὴ προμεριμνᾶτε
  choice: unu echegbula onwe unu tupu oge eruo
  rationale: Nke a na-echekwa ma echiche nke nchegbu ma echiche nke ime ya tupu oge ahụ eruo.
- source_word: τί λαλήσητε
  choice: ihe unu ga-ekwu
  rationale: N’Igbo nke oge a, nke a bụ ụzọ doro anya ma dịkwa mfe isi kwuo ihe λαλέω pụtara n’ebe a.
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: ihe ọ bụla e nyere unu
  rationale: A hapụrụ ngwaa ahụ n’ụdị nnara ka a ghara ịkpọ onye na-enye ya aha n’ebe Grik na-akpọghị ya aha.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: n’oge ahụ
  rationale: Nke a bụ okwu Igbo sitere n’okike maka oge ahụ kpọmkwem; ịsụgharị ὥρα dịka “awa” ga-ada ka ọ na-ekwu banyere nkeji iri isii.
- source_word: τοῦτο λαλεῖτε
  choice: kwuonụ ya
  rationale: Iwu a na-ezo aka kpọmkwem n’ihe e nyere ha, ma na-ada nke ọma n’Igbo.
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον
  choice: N’ihi na ọ bụghị unu bụ ndị na-ekwu okwu, kama ọ bụ Mmụọ Nsọ
  rationale: Nhazi a na-echekwa nkwusi ike dị na ὑμεῖς na ọdịiche doro anya dị n’etiti ndị na-eso ụzọ na Mmụọ Nsọ.
theological_decisions:
- issue: Onye na-eme ka okwu ahụ pụta mgbe a na-akpagbu ndị na-eso ụzọ
  choice: E debere ma ọrụ ndị na-eso ụzọ—e nyere ha iwu ka ha kwuo okwu—ma nkwupụta na Mmụọ Nsọ bụ isi iyi nke okwu ahụ.
  alternative: Ịkọwa ndị na-eso ụzọ dị ka ngwa na-adịghị etinye aka ma ọ bụ ịkọwa Mmụọ Nsọ naanị dị ka mmetụta n’ime mmadụ.
  rationale: 'Grik na-ejikọta ọrụ mmadụ na ọrụ Chineke: ndị na-eso ụzọ ga-ekwu ihe e nyere ha, ma a na-ekwu na onye na-ekwu okwu n’ụzọ kacha mkpa bụ Mmụọ Nsọ. Nsụgharị ahụ anaghị ewepụ esemokwu echiche a.'
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta. “Unu” na ụdị iwu “kwuonụ” na-egosi na a na-agwa ọtụtụ mmadụ okwu. E zere okwu ụka pụrụ iche na nkọwa ga-eme ka ọrụ Mmụọ Nsọ ma ọ bụ nke ndị na-eso ụzọ bụrụ ihe karịrị ihe Grik kwuru.
