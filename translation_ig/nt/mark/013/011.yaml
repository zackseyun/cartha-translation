review_pass:
  verdict: revise
  source_fidelity: The added phrase “n’aka ndị ọchịchị” (“into the hands of the authorities”) is not stated in the Greek. Though authorities are plausible in the wider persecution context, παραδιδόντες does not identify the recipients here, and the translation should preserve that unspecified reference. The passive “e nyere unu” appropriately leaves the giver unnamed, as does the Greek.
  naturalness: The revised wording is clear, contemporary Standard Igbo, and retains the plural address and imperative. “Duru unu gaa nyefee unu” naturally conveys the linked acts of being led away and handed over without adding a destination or recipient.
  terminology: “Mmụọ Nsọ” is the standard, fitting rendering of τὸ πνεῦμα τὸ ἅγιον. “Echegbula onwe unu tupu oge eruo” adequately communicates anxious advance concern, while “kwuonụ ihe ahụ” makes the referent of τοῦτο explicit.
  issues:
  - severity: medium
    issue: The translation supplies “n’aka ndị ọchịchị” (“to the authorities”).
    rationale: The Greek says only that they will lead the disciples and hand them over; it does not state to whom. This contextual clarification narrows an unspecified element of the source and should not appear in the main text or be retained through a footnote.
  - severity: low
    issue: The existing footnote attempts to justify an unsupported specification.
    rationale: A footnote may explain context, but it should not present an interpretive addition as part of the translation. Removing the addition makes the footnote unnecessary.
  revised_text: Ma mgbe ha duru unu gaa nyefee unu, unu echegbula onwe unu tupu oge eruo banyere ihe unu ga-ekwu. Kama, ihe ọ bụla e nyere unu n’oge ahụ, kwuonụ ihe ahụ. N’ihi na ọ bụghị unu bụ ndị na-ekwu okwu, kama ọ bụ Mmụọ Nsọ.
  revised_footnotes: []
  revision_rationale: The sole substantive revision removes the unsupported recipient “ndị ọchịchị,” thereby preserving the Greek’s ambiguity about those to whom the disciples are handed over. “Kwuonụ ihe ahụ” retains the emphatic demonstrative sense of τοῦτο while reading naturally in Igbo. No footnote is needed once the added contextual detail is removed.
