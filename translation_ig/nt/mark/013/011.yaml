revisions:
- from: Ma mgbe ha kpọọrọ unu gaa nyefee unu n’aka ndị ọchịchị[a], unu echegbula onwe unu tupu oge eruo banyere ihe unu ga-ekwu. Kama, ihe ọ bụla e nyere unu n’oge ahụ, kwuonụ ya. N’ihi na ọ bụghị unu bụ ndị na-ekwu okwu, kama ọ bụ Mmụọ Nsọ.
  to: Ma mgbe ha duru unu gaa nyefee unu, unu echegbula onwe unu tupu oge eruo banyere ihe unu ga-ekwu. Kama, ihe ọ bụla e nyere unu n’oge ahụ, kwuonụ ihe ahụ. N’ihi na ọ bụghị unu bụ ndị na-ekwu okwu, kama ọ bụ Mmụọ Nsọ.
  rationale: The sole substantive revision removes the unsupported recipient “ndị ọchịchị,” thereby preserving the Greek’s ambiguity about those to whom the disciples are handed over. “Kwuonụ ihe ahụ” retains the emphatic demonstrative sense of τοῦτο while reading naturally in Igbo. No footnote is needed once the added contextual detail is removed.
