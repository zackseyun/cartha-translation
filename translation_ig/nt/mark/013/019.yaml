revisions:
- from: N’ihi na ụbọchị ndị ahụ ga-abụ oge mkpagbu, ụdị nke na-adịbeghị site ná mmalite nke ihe e kere eke, nke Chineke kere, ruo ugbu a[a], ọ gaghịkwa adị ọzọ ma ọlị.
  to: N’ihi na ụbọchị ndị ahụ ga-abụ oge mkpagbu, mkpagbu nke ụdị ya na-adịbeghị site ná mmalite nke ihe e kere eke, nke Chineke kere, ruo ugbu a[a], ọ gaghịkwa adị ọzọ ma ọlị.
  rationale: 'A gbanwere naanị okwu ntụnyere ahụ ka o kpọpụta “mkpagbu” n’ụzọ doro anya: “mkpagbu nke ụdị ya na-adịbeghị.” Nke a na-eme ka ahịrịokwu ahụ bụrụ Igbo dịkwuo eke ma na-echekwa ntụnyere pụrụ iche nke Grik, oge sitere ná mmalite okike ruo ugbu a, na njụ siri ike banyere ọdịnihu. Akara na ọdịnaya ndetu ala ka echekwara, mana e mere okwu ya ka ọ dabaa kpọmkwem na ntụgharị ọhụrụ.'
