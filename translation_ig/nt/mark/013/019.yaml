id: MRK.13.19
reference: Mark 13:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: ig
  text: N’ihi na ụbọchị ndị ahụ ga-abụ oge mkpagbu, mkpagbu nke ụdị ya na-adịbeghị site ná mmalite nke ihe e kere eke, nke Chineke kere, ruo ugbu a[a], ọ gaghịkwa adị ọzọ ma ọlị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oge mkpagbu dị otú ahụ enwebeghị mgbe ọ bụla site ná mmalite nke ihe e kere eke, nke Chineke kere, ruo ugbu a, ọ gaghịkwa adị ọzọ ma ọlị.”
    reason: Nhọrọ a na-ejikọta okwu ntụnyere ahụ n’ụzọ Igbo ọzọ, na-eme ka “mgbe ọ bụla” pụta ìhè ma na-echekwa otu ihe Grik pụtara.
lexical_decisions:
- source_word: θλῖψις
  choice: oge mkpagbu
  rationale: “Oge mkpagbu” na-egosi nnukwu ahụhụ na nsogbu siri ike nke ụbọchị ndị ahụ ga-abụ, ma na-ada nke ọma n’Igbo karịa iji aha nkịtị naanị ya.
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: ụdị nke na-adịbeghị
  rationale: Nke a na-echekwa ntụnyere Grik nke na-ekwusi ike na ụdị mkpagbu a enwebeghị mbụ, n’asụsụ Igbo dị mfe nghọta.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: site ná mmalite nke ihe e kere eke
  rationale: A hapụrụ echiche “okike” n’ụzọ doro anya, kama ịgbanwe ya ka ọ bụrụ naanị “ụwa,” ka obosara okwu Grik wee dịgide.
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: nke Chineke kere
  rationale: A sụgharịrị nkebiokwu a ozugbo iji chekwaa nkwupụta doro anya na Chineke bụ onye kere ihe e kere eke.
- source_word: ἕως τοῦ νῦν
  choice: ruo ugbu a
  rationale: Nke a bụ okwu oge nkịtị na nke ziri ezi n’Igbo.
- source_word: οὐ μὴ γένηται
  choice: ọ gaghịkwa adị ọzọ ma ọlị
  rationale: “Ma ọlị” na-egosipụta nkwusiri ike nke njụ Grik οὐ μή, ebe “ọzọ” na-eme ka ntụgharị ọdịnihu ahụ doo anya n’Igbo.
- source_word: ἔσονται ... αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: ụbọchị ndị ahụ ga-abụ oge mkpagbu
  rationale: Nke a na-egosi na ụbọchị ndị ahụ n’onwe ha ga-abụ oge e ji nnukwu mkpagbu mara, ma na-enye ahịrịokwu Igbo doro anya.
theological_decisions:
- issue: Oke ihe okwu banyere okike na-ezo aka na ya
  choice: E jidere “ihe e kere eke, nke Chineke kere” dị ka ihe niile Chineke kere, n’enweghị ime ka ọ bụrụ naanị ihe metụtara otu ebe ma ọ bụ otu ọgbụgba ndụ.
  alternative: “site ná mmalite ụwa”
  rationale: κτίσις na κτίζω pụtara okike na ike ihe; Chineke bụkwa onye mere ihe ahụ. Nsụgharị a na-echekwa okwu ahụ n’obosara ya n’etinyeghị usoro nkọwa banyere ọgwụgwụ ụwa.
translation_notes:
  register: Ejiri Standard Igbo nke ugbu a, dị ùgwù ma dị mfe nghọta. “Oge mkpagbu” na-egbochi ahịrịokwu ahụ ịda ka ụbọchị ndị ahụ bụ ihe a na-akpọ mkpagbu n’ụzọ na-ekwekọghị n’Igbo, ma ọ ka na-echekwa prediketi aha dị na Grik. E tinyere akara [a] n’ebe kwesịrị ekwesị n’ahịrịokwu isi.
