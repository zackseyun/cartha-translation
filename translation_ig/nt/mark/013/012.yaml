  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: ig
  text: Nwanne ga-enyefe nwanne ya ka e gbuo ya[a], nna ga-enyekwa nwa ya ka e gbuo ya; ụmụ ga-ebili megide nne na nna ha, gbuo ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ga-arara nwanne ya nye”; ngwaa Grik a nwere ike ịpụta “inyefe,” “inye n’aka,” ma ọ bụ, n’ọnọdụ a, “ịrara nye.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ga-etinye ha n’ọnwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: ga-enyefe
  rationale: “Inyefe” na-echekwa echiche bụ isi nke inyefe mmadụ n’aka ndị ọzọ, n’etinyeghị ozugbo nkọwa mmetụta uche dị na “ịrara mmadụ nye.”
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: nwanne ... nwanne ya
  rationale: Asụsụ Igbo anaghị ekewa nwoke na nwanyị n’okwu “nwanne”; nkwụnye “ya” na-eme ka njikọ ezinụlọ doo anya ma debe nkwughachi siri ike nke Grik.
- source_word: εἰς θάνατον
  choice: ka e gbuo ya
  rationale: Nke a bụ ụzọ Igbo dị ndụ e si kwuo na inyefe mmadụ ga-eduga n’ọnwụ ya, kama iji ntụgharị okwu na-adịghị eke dịka “nye n’ọnwụ.”
- source_word: πατὴρ τέκνον
  choice: nna ... nwa ya
  rationale: “Nna” na-edebe okwu nwoke kpọmkwem πατήρ, ebe “nwa” na-egosipụta τέκνον nke nwere ike ịbụ nwa nwoke ma ọ bụ nwaanyị.
- source_word: ἐπαναστήσονται
  choice: ga-ebili megide
  rationale: Nke a na-edebe onyonyo na ike nke omume iro dị n’okwu Grik, na-enweghị ime ka ọ bụrụ naanị nghọtahie ma ọ bụ nnupụisi nkịtị.
- source_word: γονεῖς
  choice: nne na nna ha
  rationale: N’Igbo, “nne na nna” bụ ụzọ nkịtị ma doo anya isi kwuo “parents.”
- source_word: θανατώσουσιν αὐτούς
  choice: mee ka e gbuo ha
  rationale: Nke a na-egosipụta ime ka e tinye ha n’ọnwụ, ma na-ahapụ ohere ma ụmụ ahụ ji aka ha gbuo ha ma ọ bụ mee ka ndị ọchịchị gbuo ha.
theological_decisions:
- issue: Okwu ezinụlọ metụtara nwoke, nwanyị, na ụmụ
  choice: Debe “nna” maka πατήρ, ma jiri “nwanne,” “nwa,” na “nne na nna” dịka okwu Igbo na-ekwe.
  alternative: Iji “nne ma ọ bụ nna” n’akụkụ nke abụọ, ma ọ bụ ịkọwa “nwanne nwoke” n’akụkụ nke mbụ.
  rationale: πατήρ bụ “nna” kpọmkwem, ebe τέκνον na γονεῖς sara mbara. Ọ bụ ezie na ἀδελφός bụ ụdị okwu Grik nke nwoke, okwu Igbo nkịtị “nwanne” anaghị ekewa nwoke na nwanyị; ịsị “nwanne nwoke” ga-eme ka ihe e kwuru dị warara karịa ka onye na-agụ Igbo ga-aghọta okwu ahụ n’ụzọ nkịtị.
- issue: Onye na-eme ogbugbu n’ahịrị ikpeazụ
  choice: “mee ka e gbuo ha”
  alternative: “ga-egbu ha”
  rationale: θανατόω nwere ike ịpụta igbu mmadụ ma ọ bụ ime ka e tinye ya n’ọnwụ. N’ọnọdụ mkpagbu a, ntụgharị a na-echekwa ohere nke igbu kpọmkwem ma ọ bụ inyefe ndị mụrụ ha ka e gbuo ha.
translation_notes:
  register: Ejiri Igbo ọkọlọtọ nke oge a, dị mfe ma dị nsọ. E zere ntụgharị nkịtị na-adịghị eke dịka “inye n’ọnwụ,” ma chekwaa usoro na-arịwanye elu nke esemokwu n’etiti ndị ezinụlọ.
