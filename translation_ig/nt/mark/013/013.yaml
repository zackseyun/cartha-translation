  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου. ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: ig
  text: Mmadụ niile ga-akpọ unu asị n’ihi aha m. Ma onye tachiri obi ruo ọgwụgwụ ka a ga-azọpụta.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ihi m.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “onye nọgidere guzosie ike ruo ọgwụgwụ.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “a ga-anapụta.” Okwu Grik ahụ nwere ike ịpụta nnapụta ma ọ bụ nzọpụta; ihe gbara ya gburugburu anaghị eme ka naanị otu n’ime ha doo anya kpamkpam.
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: Mmadụ niile ga-akpọkwa unu asị
  rationale: Nke a na-egosipụta echiche ọdịnihu nke ἔσεσθε na participle μισούμενοι n’Igbo dị ire, ma na-edobekwa okwu sara mbara πάντων, ‘mmadụ niile.’
- source_word: διὰ τὸ ὄνομά μου
  choice: n’ihi aha m
  rationale: διά ya na accusative na-egosi ihe kpatara ya. ‘N’ihi aha m’ bụ okwu Igbo doro anya nke na-ahapụ ‘aha’ ka ọ nọchite anya onye Jizọs bụ na nrubeisi nye ya.
- source_word: ὁ δὲ ὑπομείνας
  choice: Ma onye tachiri obi
  rationale: ‘Ịtachi obi’ na-egosi ịnọgide n’okpuru mkpagbu ma ghara ịda mbà, n’enweghị itinye okwu nkà mmụta okpukpe pụrụ iche.
- source_word: εἰς τέλος
  choice: ruo ọgwụgwụ
  rationale: Nke a na-edobe njedebe a na-akọwaghị kpọmkwem—ma ọ bụ nke ule, ndụ mmadụ, ma ọ bụ ọgwụgwụ oge.
- source_word: οὗτος
  choice: ka
  rationale: Usoro Igbo ‘onye ... ka ...’ na-ebufe nkwusi ike nke οὗτος n’ụzọ dị ire karịa ikwughachi ‘onye ahụ.’
- source_word: σωθήσεται
  choice: a ga-azọpụta
  rationale: ‘Ịzọpụta’ na-edobe ma echiche nnapụta ma ịdị arọ nke nzọpụta n’ọnọdụ a, n’emeghị ka ihe ọ pụtara dị warara.
theological_decisions:
- issue: Ihe σωθήσεται pụtara n’okwu banyere ịtachi obi
  choice: a ga-azọpụta
  alternative: a ga-anapụta
  rationale: '‘A ga-azọpụta’ na-edobe ohere sara mbara nke okwu Grik: ọ pụrụ ịgụnye nnapụta ma ọ bụ nzọpụta zuru ezu, n’akọwaghị ya dịka otu ozizi ụka pụrụ iche.'
- issue: Oke πάντων
  choice: mmadụ niile
  alternative: onye ọ bụla
  rationale: E debere okwu ahụ dịka nkwupụta sara mbara ma sie ike, n’etinyeghị nkọwa ga-eme ka ọ dị nro.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. Usoro ‘onye ... ka ...’ na-eme ka nkwusi ike nke Greek pụta n’Igbo dị ire. E tinyere akara ndetu ala ala niile n’isiokwu.
