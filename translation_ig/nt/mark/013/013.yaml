revisions:
- from: Mmadụ niile ga-akpọkwa unu asị n’ihi aha m. Ma onye tachiri obi ruo ọgwụgwụ ka a ga-azọpụta.[a][b][c]
  to: Mmadụ niile ga-akpọ unu asị n’ihi aha m. Ma onye tachiri obi ruo ọgwụgwụ ka a ga-azọpụta.[a][b][c]
  rationale: Removed the unsupported additive nuance in “kpọkwa” and corrected footnote a so that it does not add ‘me and my name.’ The revised wording preserves the Greek’s passive sense through natural Igbo active expression, its sweeping ‘all,’ the causal force of ‘because of my name,’ and the unresolved breadth of σωθήσεται.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:43Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the verse’s main sense well: universal hostility because of Jesus’ name and salvation for the person who endures to the end. However, “kpọkwa” adds an unwarranted ‘also’ nuance. The Greek καί is connective here, not a basis for adding ‘also’ to the hatred clause.'
  naturalness: “Mmadụ niile ga-akpọ unu asị” is clear, natural Standard Igbo. “Ma onye tachiri obi ruo ọgwụgwụ ka a ga-azọpụta” is likewise idiomatic and appropriately preserves the emphatic result without woodenly repeating the subject.
  terminology: “Ịkpọ mmadụ asị,” “aha m,” “ịta obi,” “ọgwụgwụ,” and “a ga-azọpụta” are suitable Standard Igbo choices. The salvation wording retains the Greek’s open scope; the alternative ‘a ga-anapụta’ properly notes the possible rescue/deliverance sense.
  issues:
  - severity: medium
    issue: The adverb “kpọkwa” adds ‘also.’
    rationale: The source says that the disciples will be hated by all; it does not contrast this with a prior hatred in a way that requires ‘also’ in Igbo. Removing it more closely represents the Greek and avoids added emphasis.
  - severity: medium
    issue: Footnote a’s proposed alternative, “n’ihi mụ na aha m,” changes the sense.
    rationale: It means ‘because of me and my name,’ adding ‘me and’ where the Greek has only ‘my name.’ A valid idiomatic alternative may express the name-metonymy as ‘because of me.’
  revised_text: Mmadụ niile ga-akpọ unu asị n’ihi aha m. Ma onye tachiri obi ruo ọgwụgwụ ka a ga-azọpụta.[a][b][c]
  revised_footnotes:
