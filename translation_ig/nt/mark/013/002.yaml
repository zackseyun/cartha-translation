  text: καὶ ὁ ⸀Ἰησοῦς εἶπεν αὐτῷ· Βλέπεις ταύτας τὰς μεγάλας οἰκοδομάς; οὐ μὴ ἀφεθῇ ⸀ὧδε λίθος ἐπὶ ⸀λίθον ὃς οὐ μὴ καταλυθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: ig
  text: Jizọs wee sị ya, “Ị na-ahụ nnukwu ụlọ ndị a[a]? N’ebe a, a gaghị ahapụ ọbụna otu nkume n’elu nke ọzọ[b]; a ga-akwatu ha niile[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “nnukwu ụlọ ụlọnsọ ndị a.” Ihe gbara amaokwu a gburugburu na-egosi ụlọ ndị dị n’ogige ụlọnsọ, ọ bụ ezie na okwu Grik kwuru naanị “ụlọ.”
    reason: lexical_alternative
  - marker: b
    text: Okwu a, “otu nkume n’elu nke ọzọ,” bụ ụzọ e si ekwu na a ga-ebibi ihe ahụ kpamkpam.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịtụgharị ya, “ebibi” ma ọ bụ “tụda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπεις
  choice: Ị na-ahụ
  rationale: Ọ bụ ajụjụ e ji ngwaa dị n’ụdị ugbu a jụọ; ‘Ị na-ahụ’ na-egosipụta ajụjụ ahụ n’Igbo nkịtị n’emeghị ya iwu dịka ‘Lee.’
- source_word: μεγάλας οἰκοδομάς
  choice: nnukwu ụlọ
  rationale: ‘Nnukwu’ nwere ike igosi ịdị ukwuu n’ogo na ịdị ebube, ebe ‘ụlọ’ na-edobe okwu Grik n’ozuzu ya n’agbakwụnyeghị ‘ụlọ ụlọnsọ’ n’ahịrị bụ isi.
- source_word: οὐ μὴ ἀφεθῇ
  choice: A gaghị ahapụ ọbụna
  rationale: ‘A gaghị’ na-egosi ịjụ ihe ga-eme n’ọdịnihu, ‘ọbụna’ na-enyekwa ike nkwusioru dị na οὐ μή n’Igbo dị ndụ.
- source_word: ὧδε
  choice: n’ebe a
  rationale: Nke a na-egosipụta ebe ahụ kpọmkwem dịka okwu Grik si mee.
- source_word: λίθος ἐπὶ λίθον
  choice: otu nkume n’elu nkume ibe ya
  rationale: Nke a na-echekwa ihe atụ okwu Grik nke na-egosi mbibi zuru ezu ma bụrụkwa okwu ndị Igbo nwere ike ịghọta nke ọma.
- source_word: καταλυθῇ
  choice: akwatu
  rationale: ‘Ịkwatu’ dabara n’ihe gbasara ịkwatu ụlọ ma ọ bụ ihe e wuru, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: Jizọs wee sị ya
  rationale: ‘Wee’ na-ejikọta akụkọ ahụ n’ụzọ Igbo sitere n’okike, ebe ‘sị ya’ na-egosi εἶπεν αὐτῷ n’enweghị ịgbakwụnye echiche nke ‘ịza.’
theological_decisions:
- issue: Oke amụma Jizọs banyere ụlọ ndị dị n’ogige ụlọnsọ
  choice: nnukwu ụlọ ndị a
  alternative: nnukwu ụlọ ụlọnsọ ndị a
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ ụlọ ndị dị n’ogige ụlọnsọ, ma okwu Grik n’onwe ya bụ naanị ‘ụlọ.’ Ya mere, ahịrị bụ isi anaghị agbakwụnye aha na-anọghị na Grik; nkọwa ala peeji na-eme ka ebe okwu ahụ na-arụtụ aka doo anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E debere ihe atụ nkume dị n’asụsụ Grik, tinyekwa ‘ọbụna’ iji mee ka nkwusioru siri ike nke οὐ μή pụta n’ụzọ nkịtị.
