revisions:
- from: Jizọs wee sị ya, “Ị na-ahụ nnukwu ụlọ ndị a[a]? A gaghị ahapụ ọbụna otu nkume n’elu nkume ibe ya n’ebe a[b] nke a na-agaghị akwatu[c].”
  to: Jizọs wee sị ya, “Ị na-ahụ nnukwu ụlọ ndị a[a]? N’ebe a, a gaghị ahapụ ọbụna otu nkume n’elu nke ọzọ[b]; a ga-akwatu ha niile[c].”
  rationale: 'The revision resolves the ambiguous relative-clause attachment by stating the result explicitly: no stone will be left upon another, and all will be torn down. This preserves the sense and emphatic totality of οὐ μὴ ἀφεθῇ ... ὃς οὐ μὴ καταλυθῇ without importing an interpretation about the precise historical extent of the destruction. Footnote language and the idiom note are also made more natural in Standard Igbo.'
