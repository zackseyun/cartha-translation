id: MRK.13.17
reference: Mark 13:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/017.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: ig
  text: Ma ahụhụ ga-adịrị ndị inyom dị ime na ndị na-enye ụmụ ọhụrụ ara n’ụbọchị ndị ahụ!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: ahụhụ ga-adịrị
  rationale: N’Igbo nkịtị, akpaokwu a na-egosipụta ma akwa arịrị ma ịdọ aka ná ntị banyere oke nsogbu na-abịanụ; ọ dabara n’ike okwu amụma nke οὐαί.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi mgbanwe dị nro site n’ihe e kwuru n’amaokwu bu ụzọ, n’enweghị ime ka ọdịiche ahụ sie ike karịa ka Grik si kwuo.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: ndị inyom dị ime
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke a na-asụ n’Igbo ugbu a iji kọwaa akpaokwu Grik nke pụtara ịnọ ime.
- source_word: θηλαζούσαις
  choice: ndị na-enye ụmụ ọhụrụ ara
  rationale: Ọ na-egosipụta omume inye nwa ara n’asụsụ Igbo dị mfe ma doo anya; e mere ihe a na-enye ara, nke Grik hapụrụ ka a ghọta ya, ka ọ pụta ìhè n’ụzọ ebumpụta ụwa.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: n’ụbọchị ndị ahụ
  rationale: Ọ bụ ntụgharị oge kpọmkwem, dị mfe, nke na-ejikọ amaokwu a na ụbọchị nsogbu ndị a kpọtụrụ aha n’akụkụ okwu a.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ahụhụ ga-adịrị” kama okwu mkpesa naanị, iji debe njikọ nke akwa arịrị na ịdọ aka ná ntị dị na οὐαί. Enweghị ihe odide ala peeji n’ihi na ụzọ ndị ọzọ e nyere n’English adịghị eweta ọdịiche bara uru n’Igbo.
