  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: ig
  text: N’ezie, ana m asị unu na ọgbọ a agaghị agabiga ma ọlị ruo mgbe ihe ndị a niile ga-eme[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị mmadụ a” ma ọ bụ “agbụrụ a”; okwu Grik γενεά nwere ike inwe nghọta sara mbara karị, ọ bụ ezie na “ọgbọ” bụ ntụgharị kacha eke n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: Okwu ahụ bụ “agaghị agabiga ma ọlị” na-egosipụta ngọnarị siri ike e ji okwu Grik kwuo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: N’ezie
  rationale: Ọ na-ewebata okwu dị nsọ ma sie ike; “N’ezie” na-enye ike okwu ahụ n’Igbo oge a n’enweghị ịhapụ ya dịka okwu mbinye “Amen.”
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Nke a bụ ụzọ Igbo nkịtị ma dị ugwu si ekwu okwu a na-agwa mmadụ ozugbo, ma na-esochikwa nhazi okwu Grik nke ọma.
- source_word: οὐ μὴ παρέλθῃ
  choice: agaghị agabiga ma ọlị
  rationale: Njikọ οὐ μή na aorist subjunctive bụ nkw否 siri ike; “ma ọlị” na-eme ka nkw否 ahụ pụta ìhè n’Igbo.
- source_word: ἡ γενεὰ αὕτη
  choice: ọgbọ a
  rationale: “Ọgbọ a” bụ ihe γενεά pụtara n’ụzọ kacha eke n’ọnọdụ okwu a, ma ọ na-ahapụ esemokwu nkọwa dị n’amaokwu ahụ ka ọ dị.
- source_word: μέχρις οὗ
  choice: ruo mgbe
  rationale: Ọ na-egosi oke oge, “ruo mgbe” bụkwa ntụgharị Igbo doro anya ma dị nkenke.
- source_word: ταῦτα πάντα
  choice: ihe ndị a niile
  rationale: Ọ na-egosipụta nke ọma ma ọtụtụ ihe demonstrative ahụ ma echiche πᾶς nke gụnyere ha niile.
- source_word: γένηται
  choice: ga-eme
  rationale: N’ọnọdụ a γίνομαι na-ekwu maka ihe omume ndị ga-eme; “ga-eme” bụ Igbo nkịtị ma doo anya.
theological_decisions:
- issue: Ihe “ọgbọ a” (ἡ γενεὰ αὕτη) pụtara n’okwu gbasara ihe ndị ga-eme n’ọdịnihu
  choice: A sụgharịrị ya ozugbo dịka “ọgbọ a” n’enweghị mgbakwunye nkọwa.
  alternative: “ndị a” ma ọ bụ “agbụrụ a”; ma ọ bụ ọgbọ ga-ahụ ihe ịrịba ama ndị ahụ amalite
  rationale: N’ọnọdụ a, okwu Grik ahụ kacha kwekọọ na “ọgbọ a.” Ebe ọ bụ na ndị mmadụ na-arụrịta ụka nke ukwuu banyere ya, ntụgharị ahụ ekwesịghị idozi ya dịka usoro nkà mmụta banyere ọgwụgwụ oge ọ bụla si dị, kama ọ ga-echekwa mgbagwoju anya na nrụgide dị n’ihe odide mbụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. A họọrọ “N’ezie” dịka okwu mmeghe siri ike, “ọgbọ a” iji chekwaa nghọta nkịtị na esemokwu nkọwa, na “ma ọlị” iji gosipụta ike nkw否 Grik.
