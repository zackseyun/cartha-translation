source:
  edition: SBLGNT
  text: Ἀλλὰ ἐν ἐκείναις ταῖς ἡμέραις μετὰ τὴν θλῖψιν ἐκείνην ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/024.yaml
  text: But in those days[a], after that tribulation, the sun will be darkened, and the moon will not give its light,
translation:
  language: ig
  text: Ma n’ụbọchị ndị ahụ, mgbe mkpagbu ahụ[a] gasịrị, anyanwụ ga-agba ọchịchịrị, ọnwa agaghịkwa enye ìhè ya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe nhụjuanya ahụ gasịrị” ma ọ bụ “mgbe ahụhụ ahụ gasịrị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Ma
  rationale: Na-egosi ntụgharị siri ike ma ọ bụ ọdịiche n’ihe Jizọs kwuru tupu nke a; “Ma” bụ okwu Igbo dị nkenke ma kwekọọ n’ebe a.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: n’ụbọchị ndị ahụ
  rationale: Na-echekwa okwu oge ahụ na ụda amụma ya n’Igbo nkịtị.
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: mgbe mkpagbu ahụ gasịrị
  rationale: μετά na-egosi ihe ga-eme mgbe ihe ọzọ gasịrị. “Mkpagbu” na-eburu ịdị arọ nke θλῖψις n’okwu amụma a, ebe “ahụ” na-echekwa nkọwa demonstrative ἐκείνην.
- source_word: ὁ ἥλιος
  choice: anyanwụ
  rationale: Ọ bụ ihe okwu Grik ahụ pụtara kpọmkwem.
- source_word: σκοτισθήσεται
  choice: ga-agba ọchịchịrị
  rationale: Na-egosi ọdịnihu ma na-ada nke ọma n’Igbo; ọ na-ezipụta na ìhè anyanwụ ga-agbanwe ghọọ ọchịchịrị n’akwụsịghị ịkọ onye kpatara ya.
- source_word: καὶ
  choice: —kwa
  rationale: E tinyere njikọ ahụ n’ụdị mgbakwunye “-kwa” n’okwu “agaghịkwa,” nke bụ usoro Igbo ebumpụta ụwa maka ijikọ ihe ịrịba ama abụọ a.
- source_word: ἡ σελήνη
  choice: ọnwa
  rationale: Ọ bụ ihe okwu Grik ahụ pụtara kpọmkwem.
- source_word: οὐ δώσει
  choice: agaghị enye
  rationale: Na-echekwa ọdịnihu na ihe oyiyi nke ọnwa ‘inye’ ìhè ya.
- source_word: τὸ φέγγος αὐτῆς
  choice: ìhè ya
  rationale: “Ìhè” bụ okwu Igbo doro anya maka φέγγος n’ebe a; “ya” na-ezo aka n’ọnwa.
theological_decisions:
- issue: Ịsụgharị θλῖψις n’okwu amụma banyere ihe ndị ikpeazụ
  choice: mkpagbu
  alternative: ahụhụ; oke nhụjuanya
  rationale: “Mkpagbu” na-echekwa ịdị arọ na ike nke okwu ahụ n’ọnọdụ a, ma ọ naghị ekpebi usoro nkà mmụta banyere oge ọgwụgwụ nke amaokwu ahụ n’onwe ya na-akọwaghị.
translation_notes:
  register: 'Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu ebumpụta ụwa n’Igbo ma chekwaa njikọ na ihe oyiyi dị n’Grik. Enweghị akara nkọwa ala peeji n’ederede n’ihi na nkọwa Bekee [a] yiri ka etinyere ya n’ebe na-ekwesịghị ekwesị: nhọrọ ‘distress/affliction’ metụtara θλῖψις (“mkpagbu”), ọ bụghị “ụbọchị ndị ahụ.”'
