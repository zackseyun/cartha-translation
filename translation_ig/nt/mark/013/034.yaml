  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his servants, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: ig
  text: Ọ dị ka nwoke gara njem, hapụrụ ụlọ ya ma nye ndị ohu ya ikike, nye onye ọ bụla n'ime ha ọrụ ya, ma nye onye na-eche ọnụ ụzọ iwu ka ọ na-amụ anya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς
  choice: Ọ dị ka
  rationale: Ọ na-ewebata ihe atụ ahụ n'ụzọ doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: ἄνθρωπος ἀπόδημος
  choice: otu nwoke gara njem
  rationale: ἄνθρωπος na-ekwu banyere nwoke nọ n’ihe atụ a, ebe ἀπόδημος na-egosi onye hapụrụ ebe obibi ya gaa njem.
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: hapụ ụlọ ya
  rationale: Nke a na-edobe usoro na ihe aorist participle pụtara n’ụzọ dị mfe ma kwekọọ n’Igbo.
- source_word: δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν
  choice: nye ndị ohu ya ikike
  rationale: “Ndị ohu” na-egosipụta ọnọdụ ndị nọ n’okpuru nna ukwu nke δοῦλοι pụtara n’ezinụlọ ahụ; “ikike” na-edobe isi echiche ἐξουσία dị ka ikike e nyere ha ime ihe.
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: nye onye ọ bụla ọrụ ya
  rationale: Ọ na-edobe nkesa ahụ—onye ọ bụla—na okwu nkịtị ἔργον, “ọrụ,” n’enweghị ịgbakwunye nkọwa na-adịghị n’ederede.
- source_word: τῷ θυρωρῷ
  choice: onye nche ọnụ ụzọ
  rationale: Nke a bụ okwu Igbo doro anya maka onye ọrụ ya bụ iche ọnụ ụzọ nche.
- source_word: ἐνετείλατο ἵνα γρηγορῇ
  choice: nye ... iwu ka ọ mụrụ anya
  rationale: “Nye iwu” na-echekwa ike ἐνετείλατο; “mụrụ anya” na-eburu ma echiche ịnọ na nche ma echiche ịghara ịrahụ ụra nke γρηγορέω nwere n’okwu a.
theological_decisions:
- issue: Nsụgharị δοῦλος n’ihe atụ gbasara ụlọ nna ukwu
  choice: ndị ohu
  alternative: ndị na-ejere ya ozi
  rationale: Ọnọdụ ịbụ ndị nọ n’okpuru ikike nna ukwu bụ akụkụ nke ihe atụ ahụ. “Ndị ohu” na-anọgide nso n’eziokwu mmekọrịta ọha mmadụ nke okwu Grik ahụ, n’enweghị ime ka ọ dị nro ma ọ bụ tinye ozizi otu ụka.
- issue: Uche γρηγορέω n’okwu ịdọ aka ná ntị a
  choice: mụrụ anya
  alternative: nọrọ na nche; atụla ụra
  rationale: “Mụrụ anya” na-echekwa njikọ dị n’etiti ịnọ na nche na ịghara ịrahụ ụra, kama ịmanye naanị otu akụkụ nke okwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji akara ogologo ahụ kewaa nkebi “nye onye ọ bụla ọrụ ya” iji mee ka ahịrịokwu ogologo ahụ doo anya n’enweghị ịgbanwe mmekọrịta okwu Grik.
