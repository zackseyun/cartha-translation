revisions:
- from: Ọ dị ka otu nwoke gara njem, hapụ ụlọ ya, nye ndị ohu ya ikike—nye onye ọ bụla ọrụ ya—ma nye onye nche ọnụ ụzọ iwu ka ọ mụrụ anya.
  to: Ọ dị ka nwoke gara njem, hapụrụ ụlọ ya ma nye ndị ohu ya ikike, nye onye ọ bụla n'ime ha ọrụ ya, ma nye onye na-eche ọnụ ụzọ iwu ka ọ na-amụ anya.
  rationale: The revision retains the source’s household-slave terminology, delegated authority, individual allocation of work, and command to the doorkeeper. It improves idiomatic Standard Igbo and marks the doorkeeper’s continuing watchfulness without adding interpretation.
