  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: ig
  text: Otú a ka unu onwe unu, mgbe unu hụrụ ihe ndị a na-eme, maranụ na ọ dị nso, n’ọnụ ụzọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ nọ nso.” Grik ekwughị isiokwu ya kpọmkwem.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: N’otu aka ahụ, unu onwe unu
  rationale: “N’otu aka ahụ” jikọtara okwu a na ihe atụ osisi fig dị n’amaokwu bu ya ụzọ; “unu onwe unu” na-egosipụta nkwusi ike dị na καὶ ὑμεῖς n’Igbo nkịtị.
- source_word: ὅταν ἴδητε
  choice: mgbe unu hụrụ
  rationale: ὅταν na aorist subjunctive na-egosi ihe a tụrụ anya ya n’ọdịnihu; “mgbe unu hụrụ” bụ ntụgharị Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: ταῦτα γινόμενα
  choice: ihe ndị a ka ha na-eme
  rationale: “Ihe ndị a” debere plural demonstrative ταῦτα, ebe “ka ha na-eme” na-egosi ihe ndị ahụ na-abịa imezu ma ọ bụ na-eme n’ezie.
- source_word: γινώσκετε
  choice: maranụ
  rationale: Ụdị iwu ahụ na-akpọ ndị na-eso ụzọ ka ha mata nkwubi okwu kwesịrị ekwesị site n’ihe ha hụrụ; “maranụ” na-ebuga nke a ozugbo.
- source_word: ὅτι ἐγγύς ἐστιν
  choice: na ọ dị nso
  rationale: Grik ekwughị kpọmkwem onye ma ọ bụ ihe bụ isiokwu nke ἐστιν. “Ọ” na Igbo na-ahapụ ihe a na-ekwu banyere ya ka ọ bụrụ nke a na-akọwaghị kpọmkwem, kama ịmanye ya ịbụ Onye nke mmadụ ma ọ bụ otu ihe omume.
- source_word: ἐπὶ θύραις
  choice: n’ọnụ ụzọ
  rationale: Ọ bụ ezie na θύραις bụ plural n’ụdị Grik, akpaala okwu Igbo “n’ọnụ ụzọ” na-egosipụta nke ọma na ihe ahụ eruola ezigbo nso; ịmanye plural ga-ada ka ntụgharị siri ike na-adịghị eke.
theological_decisions:
- issue: Isiokwu a na-ekwughị kpọmkwem na ἐστιν (“dị nso”)
  choice: Jiri “ọ dị nso” n’ahịrị bụ isi, na-ahapụghị kpọmkwem ma “ọ” na-ezo aka n’ihe omume/ mmezu ahụ ma ọ bụ n’onye.
  alternative: “Ọ nọ nso,” nke nwere ike ime ka ndị na-agụ ya ghọta na ọ bụ “ya,” ya bụ Onye nke mmadụ.
  rationale: Ederede Grik enweghị isiokwu e kwuru hoo haa. Nhọrọ bụ isi na-echekwa mgbagwoju anya ahụ; ihe odide ala peeji na-egosi nghọta nke onwe onye n’enweghị ịmanye ya n’ahịrị bụ isi.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “maranụ” debe olu iwu, ma jiri akpaala okwu “n’ọnụ ụzọ” gosipụta ezigbo ịdị nso n’ụzọ Igbo na-ada eke.
