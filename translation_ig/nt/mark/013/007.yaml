review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the principal elements: hearing of wars and reports concerning wars, the prohibition against alarm, the necessity that these things occur, and the fact that the end has not yet arrived. However, attaching “kwa” directly to “nụrụ” can imply ‘also hear’ rather than functioning as the Greek’s mild connective δέ. A clearer connective is warranted.'
  naturalness: “Mgbe unu nụrụkwa banyere agha” is less natural and can carry an unintended additive nuance. “Ma mgbe unu nụrụ…” is idiomatic Standard Igbo and preserves the discourse connection. The remainder is clear, dignified, and suitable for a Bible translation.
  terminology: “Agha,” “akụkọ banyere agha,” “atụla ụjọ,” “aghaghị ime,” and “ọgwụgwụ ahụ erubeghị” are appropriate modern Standard Igbo renderings. The footnote properly preserves “asịrị” as a possible but narrower alternative for ἀκοαί.
  issues:
  - severity: low
    issue: The placement and force of “kwa” in “nụrụkwa” are potentially misleading.
    rationale: Greek δέ is a mild connective (‘and/but/now’), whereas Igbo “nụrụkwa” can naturally be read as ‘hear also.’ Rendering the connective separately as “Ma” avoids adding an additive sense to the act of hearing.
  revised_text: Ma mgbe unu nụrụ banyere agha na akụkọ banyere agha[a], unu atụla ụjọ; ihe ndị a aghaghị ime, ma ọgwụgwụ ahụ erubeghị.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “asịrị banyere agha.” Okwu Grik ahụ nwere ike ịpụta akụkọ, ozi, ma ọ bụ asịrị a nụrụ banyere agha.
    reason: lexical_alternative
  revision_rationale: The revision replaces the potentially additive “nụrụkwa” with the separate mild connective “Ma,” which better represents δέ without altering the verse’s meaning. All other wording and the lexical-alternative footnote are retained because they faithfully and naturally represent the Greek.
