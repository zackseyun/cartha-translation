  text: ὅταν δὲ ⸀ἀκούσητε πολέμους καὶ ἀκοὰς πολέμων, μὴ θροεῖσθε· ⸀δεῖ γενέσθαι, ἀλλ’ οὔπω τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: ig
  text: Ma mgbe unu nụrụ banyere agha na akụkọ banyere agha[a], unu atụla ụjọ; ihe ndị a aghaghị ime, ma ọgwụgwụ ahụ erubeghị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “asịrị banyere agha.” Okwu Grik ahụ nwere ike ịpụta akụkọ, ozi, ma ọ bụ asịrị a nụrụ banyere agha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Mgbe ... kwa
  rationale: “Mgbe” na-egosi ọnọdụ ga-eme n’ọdịnihu, ebe “kwa” na-ejikọta okwu a nwayọọ na ihe bu ya ụzọ n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: ἀκούσητε
  choice: unu nụrụ banyere
  rationale: Ụdị a bụ okwu Igbo e ji ekwu ịnụ akụkọ banyere ihe, ma na-edobe echiche nke ngwaa Grik n’ahịrịokwu na-ele anya n’ọdịnihu.
- source_word: πολέμους
  choice: agha
  rationale: “Agha” bụ okwu Igbo doro anya maka πόλεμος; n’Igbo, otu ụdị okwu a nwere ike ịrụ ọrụ maka otu agha ma ọ bụ ọtụtụ agha dịka ọnọdụ siri dị.
- source_word: ἀκοὰς πολέμων
  choice: akụkọ banyere agha
  rationale: ἀκοή nwere ike ịpụta akụkọ, ozi, ma ọ bụ asịrị mmadụ nụrụ. “Akụkọ banyere agha” sara mbara ma ghara ikwu na akụkọ ahụ bụ ụgha.
- source_word: μὴ θροεῖσθε
  choice: unu atụla ụjọ
  rationale: N’ebe a θροέομαι pụtara ịma jijiji n’obi ma ọ bụ ịbanye n’ụjọ n’ihi akụkọ ahụ. “Unu atụla ụjọ” bụ okwu Igbo dị ndụ ma doo anya.
- source_word: δεῖ γενέσθαι
  choice: ihe ndị a aghaghị ime
  rationale: “Aghaghị” na-edobe ike nke δεῖ, ebe “ime” na-egosi ihe ndị a ga-emezu ma ọ bụ ga-adapụta. “Ihe ndị a” na-ezo aka n’agha na akụkọ banyere ha dịka ọnọdụ okwu ahụ si dị.
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: ma ọgwụgwụ ahụ erubeghị
  rationale: “Ma” na-edobe mmegide nke ἀλλά; “ọgwụgwụ ahụ erubeghị” bụ Igbo ebumpụta ụwa nke na-egosi na ọgwụgwụ a na-atụ anya ya abịabeghị.
theological_decisions:
- issue: Mkpa ihe ndị a ime na δεῖ γενέσθαι
  choice: ihe ndị a aghaghị ime
  alternative: ọ dị mkpa ka ihe ndị a mee
  rationale: “Aghaghị” na-edobe echiche nke mkpa sitere n’atụmatụ Chineke ma ọ bụ n’amụma, ma ọ naghị akọwa usoro nkà mmụta okpukpe pụrụ iche banyere ọgwụgwụ oge.
- issue: Ihe τὸ τέλος na-ezo aka na ya
  choice: ọgwụgwụ ahụ
  alternative: njedebe ahụ
  rationale: “Ọgwụgwụ ahụ” na-edobe ntụaka a maara nke ọma n’ọdịnaya okwu Jizọs banyere ihe ikpeazụ, n’enweghị ịkọwapụta kpọmkwem usoro ihe ga-eme n’oge ọgwụgwụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E họọrọ “akụkọ banyere agha” kama “asịrị” n’ahịrị isi ka a ghara ịsị na ozi ahụ bụ nke a na-enyo enyo karịa ka Grik kwuru; e debere nhọrọ ahụ n’okpuru peeji.
