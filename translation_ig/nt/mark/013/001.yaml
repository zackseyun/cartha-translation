id: MRK.13.1
reference: Mark 13:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ ἐκ τοῦ ἱεροῦ λέγει αὐτῷ εἷς τῶν μαθητῶν αὐτοῦ· Διδάσκαλε, ἴδε ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: ig
  text: Mgbe ọ na-apụ n'ụlọ nsọ ahụ[a], otu n'ime ndị na-eso ụzọ ya sịrị ya, “Onye Ozizi, lee ka nkume ndị a si dị ebube, leekwa ka ụlọ ndị a si dị ebube![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ ἱερόν, nke pụtara ogige ụlọ nsọ niile na ụlọ ndị dị na ya, ọ bụghị naanị ebe nsọ dị n'ime ụlọ ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Lee nnukwu nkume ndị a na nnukwu ụlọ ndị a!” Okwu nkọwa Grik ahụ na-egosi ịtụnanya ma ọ bụ mmasị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: Mgbe ọ na-apụ
  rationale: Nkebiokwu a na-egosi na ọpụpụ ya ka na-aga n’ihu mgbe onye na-eso ụzọ ahụ kwuru okwu; nsụgharị a na-egosipụta omume abụọ ahụ na-eme n’otu oge n’Igbo nkịtị.
- source_word: τοῦ ἱεροῦ
  choice: n'ụlọ nsọ ahụ
  rationale: “Ụlọ nsọ” bụ okwu Igbo a na-aghọta ngwa ngwa; ihe odide ala ala kọwara na ἱερόν pụtara ogige ụlọ nsọ niile, ọ bụghị naanị ebe nsọ dị n’ime ya.
- source_word: λέγει
  choice: sịrị ya
  rationale: Ọ bụ ezie na Grik ji ihe a na-akpọ historical present mee ka akụkọ dị ndụ, iji “sịrị” bụ ụzọ Igbo si akọ akụkọ gara aga n'ụzọ doro anya ma dị ebumpụta ụwa.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: otu n'ime ndị na-eso ụzọ ya
  rationale: Nke a na-edobe kpọmkwem echiche nke otu onye sitere n’etiti ndị na-eso ụzọ ya.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Nke a bụ okwu nkwanye ùgwù doro anya maka onye na-ezi ihe, na-enweghị itinye echiche ọzọ n’ime aha ahụ.
- source_word: ἴδε
  choice: lee
  rationale: Ọ bụ iwu a na-eji adọta uche mmadụ ka ọ hụ ihe a na-ekwu maka ya.
- source_word: ποταποὶ ... καὶ ποταπαὶ
  choice: lee ka ... si dị ebube, leekwa ka ... si dị ebube
  rationale: ποταπός ebe a bụ mkpu na-egosi oke ịtụnanya na mmasị. Usoro Igbo a na-ebupụta mmetụta ahụ n'ụzọ dị mma ma na-ahapụ ihe odide ala ala ka o gosipụta na a pụkwara ịghọta ya dị ka ịdị ukwuu.
- source_word: λίθοι
  choice: nkume
  rationale: Ọ na-ezo aka kpọmkwem na nkume ndị e ji rụọ ụlọ nsọ.
- source_word: οἰκοδομαί
  choice: ụlọ
  rationale: N’ebe a, okwu ahụ pụtara ọtụtụ ụlọ ma ọ bụ ihe owuwu dị n’ogige ụlọ nsọ; “ụlọ” bụ okwu Igbo dị mfe ma kwekọọ n’ọnọdụ ahụ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, mee nsụgharị ahụ. E debere mkpu onye na-eso ụzọ ahụ n’ụdị okwu Igbo na-egosipụta mmasị na ịtụnanya, ma kọwaa ọdịiche okwu ndị dị mkpa n’ihe odide ala ala.
