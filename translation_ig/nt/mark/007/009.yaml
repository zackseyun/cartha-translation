source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν αὐτοῖς· Καλῶς ἀθετεῖτε τὴν ἐντολὴν τοῦ θεοῦ, ἵνα τὴν παράδοσιν ὑμῶν ⸀τηρήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/009.yaml
  text: And he was saying to them[a], “You neatly set aside the commandment of God so that you may keep your tradition.”
translation:
  language: ig
  text: Ọ na-agwa ha, sị, “Unu maara nke ọma[a] otú unu si ajụ iwu Chineke, ka unu wee debe ọdịnala unu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Unu na-eme nke ọma ịjụ iwu Chineke ka unu wee debe ọdịnala unu.” Okwu Grik a na-ekwu “nke ọma” n’ụzọ njakịrị na-akatọ ha n’ebe a; ọ bụghị otuto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ọ nọkwa na-agwa ha
  rationale: Oge imperfect na-egosi okwu na-aga n’ihu n’akụkọ ahụ; ‘ọ nọkwa na-agwa ha’ na-egosipụta nke a n’Igbo dị mfe ma dị mma.
- source_word: Καλῶς
  choice: Lee ka unu si maa nke ọma
  rationale: N’ebe a okwu a bụ okwu njakịrị na-akatọ ha, ọ bụghị otuto. Usoro a na-eme ka ụda njakịrị ahụ pụta ìhè n’Igbo.
- source_word: ἀθετεῖτε
  choice: wepụ ... nʼụzọ
  rationale: Nke a na-egosi ịjụ ma ọ bụ ime ka iwu ghara ịchị, ma na-echekwa ihe dị iche n’etiti iwepụ iwu Chineke na idebe ọdịnala ha.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: iwu Chineke
  rationale: ‘Iwu Chineke’ bụ okwu Igbo nkịtị, dị ugwu, nke na-egosipụta isi iyi na ikike nke iwu ahụ.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a na-egosipụta ebumnuche ma ọ bụ ihe ha chọrọ ime, dịka ἵνα si arụ ọrụ n’ahịrịokwu a.
- source_word: τὴν παράδοσιν ὑμῶν
  choice: ọdịnala unu
  rationale: ‘Ọdịnala’ na-egosi ihe e nyefere n’aka ndị ọzọ ruo n’ọgbọ ọzọ; ‘unu’ na-echekwa ọdịiche dị n’etiti nke ha na iwu Chineke.
- source_word: τηρήσητε
  choice: debe
  rationale: ‘Debe’ pụtara ijidesi ma ọ bụ idebe ihe, ma na-enye ọdịiche doro anya na ‘wepụ ... n’ụzọ.’
theological_decisions:
- issue: Ụda okwu Jizọs
  choice: Ịba mba n’ụzọ njakịrị, ọ bụghị otuto n’ezie
  alternative: 'Otuto nkịtị: ‘Unu na-eme nke ọma iwepụ iwu Chineke’'
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na Jizọs na-akatọ ime ka ọdịnala mmadụ dị elu karịa iwu Chineke. Nsụgharị ahụ na-echekwa njakịrị dị na καλῶς n’etinyeghị nkọwa okpukpe ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dịrị ndị nkịtị mfe nghọta. E ji usoro ‘Lee ka unu si maa nke ọma’ mee ka njakịrị na ịkatọ dị na okwu Grik pụta ìhè; e zere okwu pụrụ iche nke otu ụka.
