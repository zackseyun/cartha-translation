id: MRK.7.6
reference: Mark 7:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: ig
  text: 'Ma ọ sịrị ha, “Aịzaya buru amụma nke ọma banyere unu ndị ihu abụọ, dị ka e dere, sị:

    ‘Ndị a ji egbugbere ọnụ ha asọpụrụ m,

    ma obi ha dị anya n’ebe m nọ.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi obere ntụgharị ma ọ bụ mgbagha n’ihe Jizọs zara; ‘Ma’ dabara nke ọma n’usoro arụmụka ahụ.
- source_word: εἶπεν αὐτοῖς
  choice: ọ sịrị ha
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke kwesịrị ntụkwasị obi si kwuo ngwaa λέγω tinyere ndị a gwara okwu.
- source_word: Καλῶς ἐπροφήτευσεν
  choice: buru amụma nke ọma
  rationale: ‘Nke ọma’ na-edobe ike adverb Καλῶς n’ebughị ụzọ kpebie ma ọ pụtara naanị ‘n’ụzọ ziri ezi’ ma ọ bụ ‘n’ụzọ dabara kpọmkwem.’
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: banyere unu ndị ihu abụọ
  rationale: περί na genitive pụtara ‘banyere,’ ebe τῶν ὑποκριτῶν na-akọwa ndị a na-agwa okwu dịka ndị omume ha adabaghị n’ihe ha na-egosi n’èzí.
- source_word: ὡς γέγραπται ὅτι
  choice: 'dị ka e dere, sị:'
  rationale: Nke a bụ usoro Igbo doro anya eji webata ihe e dere n’Akwụkwọ Nsọ.
- source_word: Οὗτος ὁ λαὸς
  choice: Ndị a
  rationale: Ọ bụ ezie na Greek ji aha otu, λαός na-ezo aka n’otu ìgwè mmadụ; ‘Ndị a’ bụ okwu Igbo dị ndụ ma na-edobe ntụ aka siri ike nke amụma ahụ.
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: ji egbugbere ọnụ ha asọpụrụ m
  rationale: Na-edobe ihe atụ banyere egbugbere ọnụ na ihe τιμάω pụtara, ya bụ ịsọpụrụ.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: ma obi ha
  rationale: Na-edobe καρδία dịka otu ‘obi’ nke na-anọchi anya ọnọdụ ime mmụọ nke ìgwè ahụ, ebe ‘ha’ na-ezo aka n’ìgwè mmadụ ahụ n’ụzọ Igbo nkịtị.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: dị anya n’ebe m nọ
  rationale: Na-egosipụta ịdị anya n’ihe gbasara mmekọrịta na mmụọ, ma ọ naghị eme ka okwu ahụ bụrụ naanị anya nke ebe.
theological_decisions:
- issue: Jizọs itinye amụma Aịzaya 29:13 n’ahụ ndị na-emegide ya
  choice: 'E debere okwu ikpe ahụ kpọmkwem: ‘banyere unu ndị ihu abụọ’ na ‘Ndị a.’'
  alternative: Ịgbanwe ya ka ọ bụrụ okwu izugbe ma ọ bụ ime ka nkọcha ahụ dị nro.
  rationale: Greek na-egosi na Jizọs tinyere okwu Aịzaya kpọmkwem n’ahụ ndị ọ na-agwa; nsụgharị ahụ ekwesịghị ime ka ike okwu ahụ belata ma ọ bụ tinye nkọwa ụka ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E ji ‘ndị ihu abụọ’ mee ὑποκριταί n’ihi na ọ bụ okwu ndị mmadụ na-aghọta nke na-egosi ọdịiche dị n’etiti ihe a na-egosi n’èzí na ezi ọnọdụ obi. Usoro ahịrị atọ na-eme ka nhota Akwụkwọ Nsọ pụta ìhè.
