  source_fidelity: 'The Igbo accurately represents the Greek: the contrastive δέ (''Ma''), Jesus'' reply, Isaiah''s successful prophecy concerning the addressed hypocrites, the written citation formula, lip-service honor, and the people''s inward distance from God are all retained. The collective Greek singular λαός is idiomatically rendered as “Ndị a,” without changing the referent.'
