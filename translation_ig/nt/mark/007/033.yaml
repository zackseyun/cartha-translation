  text: καὶ ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου κατ’ ἰδίαν ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ καὶ πτύσας ἥψατο τῆς γλώσσης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/033.yaml
  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: ig
  text: O wee kpọrọ ya pụọ n’ìgwè mmadụ ahụ n’iche[a]. O tinyere mkpịsị aka ya n’ime ntị nwoke ahụ, mgbe ọ gbụsịrị ọnụ mmiri[b], o metụrụ ire nwoke ahụ aka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na nzuzo.”
    reason: lexical_alternative
  - marker: b
    text: Grik kwuru, “mgbe ọ gbụsịrị ọnụ mmiri, o metụrụ ire ya aka”; o kwughị kpọmkwem na Jizọs tinyere ọnụ mmiri n’ire nwoke ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου
  choice: O wee kpọrọ ya pụọ n’ìgwè mmadụ ahụ
  rationale: Nke a na-egosi na Jizọs kewapụrụ nwoke ahụ n’ebe ìgwè mmadụ nọ, n’asụsụ Igbo dị mfe ma doo anya.
- source_word: κατ’ ἰδίαν
  choice: ka naanị ha abụọ nọrọ
  rationale: Nkebiokwu a na-egosi ịnọ iche n’ebe ndị ọzọ nọ; ntụgharị a na-eme ka ihe a pụtara doo onye Igbo anya n’enweghị ịgbakwụnye nkọwa ọzọ.
- source_word: ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: O tinyere mkpịsị aka ya n’ime ntị nwoke ahụ
  rationale: “Tinyere” dabara n’omume ahụ karịa ntụgharị nkịtị nke βάλλω dị ka “tụbara”; ịkpọ “nwoke ahụ” aha na-ewepụ mgbagwoju anya nke nnọchiaha abụọ.
- source_word: πτύσας
  choice: mgbe ọ gbasịrị ọnụ mmiri
  rationale: Aorist participle ahụ na-egosi omume mere tupu imetụ ire ahụ aka. Okwu a anaghị ekwu ebe ọnụ mmiri ahụ gara.
- source_word: ἥψατο τῆς γλώσσης αὐτοῦ
  choice: o metụrụ ire ya aka
  rationale: ἅπτομαι ya na genitive pụtara imetụ ihe aka; ntụgharị a bụ nke e ji eme ihe n’Igbo ma na-echekwa omume ahụ kpọmkwem.
theological_decisions:
- issue: Nkọwa banyere omume Jizọs ji gwọọ nwoke ahụ
  choice: Kọwaa omume ndị ahụ dịka ederede si kwuo, n’ekwughị na Jizọs tinyere ọnụ mmiri n’ire nwoke ahụ.
  alternative: Ịsị na Jizọs tinyere ọnụ mmiri ya n’ire nwoke ahụ, ma ọ bụ ịkọwa ihe omume ahụ dị ka ihe atụ, ọgwụ, ma ọ bụ emume.
  rationale: Grik kwuru na ọ gbasịrị ọnụ mmiri ma metụ ire nwoke ahụ aka, ma o kwughị kpọmkwem ebe ọnụ mmiri ahụ gara ma ọ bụ ihe omume ahụ nọchiri anya ya. Ya mere, ntụgharị ahụ na-echekwa njide onwe nke akụkọ ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “nwoke ahụ” mee ka onye nwe ntị doo anya, ebe a hapụrụ “ire ya” n’ihi na ihe gbara ya gburugburu egosila onye a na-ekwu maka ya.
