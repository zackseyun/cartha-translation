  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: ig
  text: Ma ha na-efe m n’efu, na-akụzi iwu ndị mmadụ dị ka ozizi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “na-akụzi iwu mmadụ dị ka ozizi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μάτην
  choice: n’efu
  rationale: Na-egosi na ofufe ahụ enweghị uru ma ọ bụ nzube; ọ bụ ụzọ Igbo dị nkenke ma kwụ ọtọ isi kwupụta echiche a.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosipụta ọdịiche dị n’etiti nkwanye ùgwù e ji egbugbere ọnụ egosi na ịdị anya nke obi e kwuru n’amaokwu bu ụzọ.
- source_word: σέβονταί
  choice: ha na-efe
  rationale: N’ebe Chineke bụ onye a na-eme ihe ahụ, okwu a na-egosi ife ofufe, ọ bụghị naanị ịsọpụrụ mmadụ.
- source_word: με
  choice: m
  rationale: E debere nnọchiaha onye nke mbụ dịka onye ihe ahụ na-eru, dị ka o si dị n’akwụkwọ e hotara.
- source_word: διδάσκοντες
  choice: na-akụzi
  rationale: Na-edobe participle ahụ dị ka ihe na-akọwa ụdị ofufe efu ha na-eme.
- source_word: διδασκαλίας
  choice: dị ka ozizi
  rationale: 'Na-eme ka mmekọrịta apposition nke Grik doo anya n’Igbo: a na-enye iwu mmadụ ọnọdụ nke ozizi.'
- source_word: ἐντάλματα
  choice: iwu
  rationale: ‘Iwu’ bụ okwu Igbo nkịtị ma dị ùgwù maka ntụziaka e nyere n’ike; ọ dabara n’olu amụma a.
- source_word: ἀνθρώπων
  choice: ndị mmadụ
  rationale: Na-egosi na iwu ndị ahụ sitere n’aka ụmụ mmadụ, n’enweghị ime ka okwu ahụ bụrụ naanị gbasara nwoke.
theological_decisions:
- issue: Ọdịiche dị n’etiti ife Chineke na ikike iwu mmadụ
  choice: na-akụzi iwu ndị mmadụ dị ka ozizi
  alternative: na-akụzi ozizi ndị bụ iwu ndị mmadụ
  rationale: 'Nhọrọ ahụ na-egosi n’ụzọ doro anya na a na-ebuli iwu sitere n’aka mmadụ elu ka ọ bụrụ ozizi, ma ọ naghị atụkwasị ihe na-adịghị na isi mmalite. Ọ na-edobekwa nkọcha ahụ: ofufe na-aghọ ihe efu mgbe e nyere iwu mmadụ ọnọdụ kwesịrị ozizi.'
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘ndị mmadụ’ gosipụta isi mmalite mmadụ n’ozuzu, ọ bụghị nwoke naanị. Akara poznụkwụ [a] dị n’ederede isi.
