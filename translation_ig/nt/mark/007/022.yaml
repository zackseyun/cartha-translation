  terminology: “Nkwulu” suitably retains the broad possible force of βλασφημία; footnote [b] properly explains its reference either to abusive/slanderous speech against people or blasphemous speech against God. The literal “anya ọjọọ” is correctly retained in the text, with an explanatory note rather than a doctrinally narrowed rendering.
