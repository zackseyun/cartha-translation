base_translation:
  language: en
  yaml_path: translation/nt/mark/007/022.yaml
  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: ig
  text: ịkwa iko, anyaukwu, ajọ omume dị iche iche, aghụghọ, omume na-enweghị ihere, anya ọjọọ[a], nkwulu[b], mpako, na enweghị uche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyaụfụ” ma ọ bụ “ile mmadụ anya ọjọọ.” N'ụzọ nkịtị, “anya ọjọọ”; ọ bụ akpaalaokwu na-egosi anyaụfụ, anwụghị anwụ, ma ọ bụ obi ọjọọ.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a nwere ike ịpụta okwu nkwutọ ma ọ bụ mkparị megide mmadụ, ma ọ bụ okwu nkwulu megide Chineke.
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχεῖαι
  choice: ịkwa iko
  rationale: Ọ bụ aha n'ụdị ọtụtụ na Grik, ma n'Igbo, aha omume a na-adịkarị n'ụdị mkpokọta; “ịkwa iko” na-ekwupụta omume ịkwa iko n'ụzọ doro anya ma dịkwa nkịtị.
- source_word: πλεονεξίαι
  choice: anyaukwu
  rationale: “Anyaukwu” na-egosi ọchịchọ ijide ma ọ bụ inweta ihe karịrị oke, nke kwekọrọ n'ike okwu Grik.
- source_word: πονηρίαι
  choice: ajọ omume dị iche iche
  rationale: Nke a na-edobe echiche ọtụtụ dị n'okwu Grik ma na-ada nke ọma karịa imepụta ọtụtụ nke “ajọ omume” n'Igbo.
- source_word: δόλος
  choice: aghụghọ
  rationale: “Aghụghọ” bụ okwu Igbo doro anya maka iji ụzọ aghụghọ duhie mmadụ.
- source_word: ἀσέλγεια
  choice: omume ihere na-enweghị njide onwe onye
  rationale: Okwu Grik na-egosi omume a na-eme n'enweghị ihere ma ọ bụ mgbochi, nke na-abụkarị omume mmekọahụ; nsụgharị a anaghị emechi ya naanị n'ihe gbasara mmekọahụ.
- source_word: ὀφθαλμὸς πονηρός
  choice: anya ọjọọ
  rationale: E debere ihe atụ okwu ahụ n'ụzọ nkịtị, ebe nkọwa ala peeji na-akọwa echiche anyaụfụ ma ọ bụ obi ọjọọ dị n'akpaalaokwu ahụ.
- source_word: βλασφημία
  choice: nkwulu
  rationale: “Nkwulu” nwere ike ịgụnye okwu mkparị megide mmadụ ma ọ bụ okwu na-ekwulu Chineke, ya mere ọ na-echekwa obosara na mgbagwoju anya nke okwu Grik.
- source_word: ὑπερηφανία
  choice: mpako
  rationale: “Mpako” bụ okwu Igbo nkịtị na nke siri ike maka ibuli onwe elu n'ụzọ mpako.
- source_word: ἀφροσύνη
  choice: enweghị uche
  rationale: Nke a na-egosi enweghị ezi nghọta n'omume na n'omume ndụ, ọ bụghị naanị enweghị ọgụgụ isi.
theological_decisions:
- issue: Ihe βλασφημία pụtara n'usoro ndepụta ajọ omume
  choice: nkwulu
  alternative: okwu nkwutọ megide mmadụ; ma ọ bụ nkwulu megide Chineke
  rationale: Okwu Grik nwere ike izo aka n'okwu na-emebi aha mmadụ ma ọ bụ n'okwu megide Chineke. “Nkwulu” na nkọwa ala peeji na-edobe nhọrọ abụọ ahụ kama ikpebi otu naanị.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A haziri amaokwu ahụ dịka ndepụta aha omume; e jiri “na” tupu ihe ikpeazụ mee ka ndepụta ahụ daa nke ọma n'Igbo. E debere mgbagwoju anya nke ὀφθαλμὸς πονηρός na βλασφημία site na akara [a] na [b].
