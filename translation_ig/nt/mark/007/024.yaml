  source_fidelity: A revision is needed. The draft's first clause gives an awkward and potentially misleading sequence ('O si n'ebe ahụ bilie, gaa'); the Greek has Jesus first rising and then departing from there. It also supplies 'na ọ nọ ebe ahụ' for the implicit object of γνῶναι, which narrows an object intentionally left implicit in Greek.
  naturalness: 'The revised wording uses a natural Igbo narrative sequence: ''O biliri si n''ebe ahụ gaa ...'' and avoids the unnecessarily emphatic ''n''otu ụlọ.'' ''O nweghị ike izo ezo'' is an idiomatic, concise rendering of his inability to remain concealed.'
  terminology: '''Ógbè Taịa'' appropriately renders the contextual sense of τὰ ὅρια Τύρου as a region or territory. The revised text retains the name form used in the draft and preserves the lexical alternatives in footnotes.'
  issues:
