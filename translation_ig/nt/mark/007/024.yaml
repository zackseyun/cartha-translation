  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: ig
  text: O biliri si n'ebe ahụ gaa n'ógbè Taịa.[a] Mgbe ọ banyere n’ụlọ, ọ chọghị ka onye ọ bụla mara.[b] Ma o nweghị ike izo ezo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n'ókèala Taịa”; okwu Grik ahụ nwere ike ịpụta ógbè ma ọ bụ mpaghara metụtara Taịa, ọ bụghị naanị ahịrị oke ala ya.
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “ọ chọghị ka onye ọ bụla mara”; ihe ha ga-amara ekwughị ya kpọmkwem n'asụsụ Grik, ma ọ pụrụ izo aka n'ịnọ ya ma ọ bụ ebe ọ nọ.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “ma o nweghị ike ịgbanahụ ka a mata ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: O si n'ebe ahụ
  rationale: Ἐκεῖθεν na-egosi isi n'ebe a kpọtụrụ aha tupu nke a pụọ; δέ bụ njikọ dị nro nke a na-egosipụta nke ọma n'usoro ahịrịokwu Igbo na-enweghị itinye okwu mmegide siri ike.
- source_word: ἀναστὰς
  choice: bilie
  rationale: N'akụkọ a, participle a na-ebute ihe omume sochirinụ; “bilie” na-echekwa mmegharị ahụ n'Igbo dị mfe ma kwekọọ n'usoro ngwaa ndị sochiri ibe ha.
- source_word: ἀπῆλθεν
  choice: gaa
  rationale: ἀπέρχομαι na-egosi isi n'otu ebe gaa ebe ọzọ. N'usoro “si n'ebe ahụ bilie, gaa,” ngwaa “gaa” na-enye echiche ahụ n'ụzọ Igbo nkịtị.
- source_word: εἰς τὰ ὅρια Τύρου
  choice: n'ógbè Taịa
  rationale: ὅρια nwere ike ịpụta oke ala, mpaghara, ma ọ bụ ógbè. N'ebe a, “ógbè” na-egosi mpaghara metụtara Taịa, ọ bụghị naanị ahịrị oke ala.
- source_word: καὶ εἰσελθὼν εἰς οἰκίαν
  choice: Mgbe ọ banyere n'otu ụlọ
  rationale: Participle ahụ na-egosi ihe mere tupu ihe sochirinụ; οἰκίαν enweghị article, ya mere “otu ụlọ” na-egosi ụlọ a na-akọwaghị kpọmkwem.
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: ọ chọghị ka onye ọ bụla mara na ọ nọ ebe ahụ
  rationale: Ihe mmadụ ga-amara adịghị n'okwu Grik n'ụzọ doro anya, ma ọ na-ezo aka n'ịnọ ya ma ọ bụ ebe ọ nọ. Nkebi a na-eme ka Igbo doo anya n'enweghị ịkọwa karịa ihe ọnọdụ ahụ na-egosi.
- source_word: καὶ οὐκ ἠδυνήθη λαθεῖν
  choice: ma o nweghị ike izonarị ndị mmadụ
  rationale: λανθάνω pụtara ịgbanahụ nchọpụta ma ọ bụ ịnọ n'enweghị ndị ọzọ achọpụta. “Izonarị ndị mmadụ” bụ Igbo ebumpụta ụwa nke na-echekwa echiche nke enweghị ike ịgbanahụ anya ha; “ma” na-egosi ọdịiche dị n'etiti ọchịchọ ya na ihe mere.
