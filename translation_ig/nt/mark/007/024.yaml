    issue: The opening verbal sequence is awkward and reverses the most natural representation of the Greek action sequence.
    rationale: 'ἀναστὰς precedes ἀπῆλθεν: Jesus rose and departed from there. ''O biliri si n''ebe ahụ gaa'' expresses this clearly.'
  - severity: medium
    issue: The main text over-specifies the implicit object of 'no one to know.'
    rationale: The Greek does not explicitly state that people were to know that he was there. This is a plausible contextual inference but should remain in the footnote rather than be imposed in the text.
  - severity: low
    issue: '''n''otu ụlọ'' can imply one particular or emphatically one house.'
    rationale: The anarthrous οἰκίαν is indefinite; 'n’ụlọ' is a more natural unmarked Igbo rendering in this context.
  revised_text: O biliri si n'ebe ahụ gaa n'ógbè Taịa.[a] Mgbe ọ banyere n’ụlọ, ọ chọghị ka onye ọ bụla mara.[b] Ma o nweghị ike izo ezo.[c]
