- from: O si n'ebe ahụ bilie, gaa n'ógbè Taịa.[a] Mgbe ọ banyere n'otu ụlọ, ọ chọghị ka onye ọ bụla mara na ọ nọ ebe ahụ,[b] ma o nweghị ike izonarị ndị mmadụ.[c]
