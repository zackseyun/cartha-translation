translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu mee nsụgharị ahụ. E debere usoro akụkọ ngwa ngwa nke Grik, ma mee ka ihe e zoro ezo n'okwu Grik doo anya naanị ruo ókè asụsụ Igbo chọrọ. A hapụrụ nghọta abụọ nke ὅρια na λανθάνω n'ihe odide ala peeji.
