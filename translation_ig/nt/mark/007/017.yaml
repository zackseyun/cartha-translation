revisions:
- from: Mgbe ọ banyere n’otu ụlọ, pụọ n’etiti ìgwè mmadụ ahụ, ndị na-eso ụzọ ya jụrụ ya ihe ilu ahụ[a] pụtara.
  to: Mgbe ọ hapụsịrị ìgwè mmadụ ahụ banye n’ụlọ, ndị na-eso ụzọ ya jụrụ ya banyere ilu ahụ[a].
  rationale: The revision replaces the malformed phrase for separation from the crowd with a natural Igbo serial-verb construction and removes the added assertion that the disciples specifically asked for the parable’s meaning. It retains the source’s anarthrous “house” without artificially emphasizing numerical “one,” while preserving the lexical ambiguity of παραβολή in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:08Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the setting, disciples, and παραβολή, but “pụọ n’etiti ìgwè mmadụ ahụ” is not grammatically integrated with the past narrative and does not reliably render ἀπὸ τοῦ ὄχλου. Further, “ihe ilu ahụ pụtara” adds an explicit request for meaning that is not stated in the Greek, which says that the disciples asked him about the parable.
  naturalness: The proposed serial-verb construction is natural Standard Igbo and clearly expresses that Jesus left the crowd and entered a house. “Jụrụ ya banyere ilu ahụ” is idiomatic and does not over-specify the content of their question.
  terminology: “Ndị na-eso ụzọ ya” suitably renders οἱ μαθηταὶ αὐτοῦ, and “ilu” is an appropriate primary rendering of παραβολή. The footnote responsibly retains “okwu ahụ” and “ihe atụ ahụ” as lexical alternatives.
  issues:
  - severity: high
    issue: Ungrammatical/unclear rendering of ἀπὸ τοῦ ὄχλου
    rationale: In “Mgbe ọ banyere n’otu ụlọ, pụọ n’etiti ìgwè mmadụ ahụ,” “pụọ” is not correctly linked to the past-tense clause and may be read as an imperative. The source indicates entering the house away from/after leaving the crowd.
  - severity: medium
    issue: Added meaning in “ihe ilu ahụ pụtara”
    rationale: The Greek has “asked him about the parable,” without explicitly saying “asked what the parable meant.” The revision preserves the broader wording.
  revised_text: Mgbe ọ hapụsịrị ìgwè mmadụ ahụ banye n’ụlọ, ndị na-eso ụzọ ya jụrụ ya banyere ilu ahụ[a].
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “okwu ahụ” ma ọ bụ “ihe atụ ahụ.” Okwu Grik bụ παραβολή (parabolē).
    reason: lexical_alternative
  revision_rationale: The revision replaces the malformed phrase for separation from the crowd with a natural Igbo serial-verb construction and removes the added assertion that the disciples specifically asked for the parable’s meaning. It retains the source’s anarthrous “house” without artificially emphasizing numerical “one,” while preserving the lexical ambiguity of παραβολή in the footnote.
