source:
  edition: SBLGNT
  text: Καὶ ὅτε εἰσῆλθεν ⸀εἰς οἶκον ἀπὸ τοῦ ὄχλου, ἐπηρώτων αὐτὸν οἱ μαθηταὶ αὐτοῦ ⸂τὴν παραβολήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: ig
  text: Mgbe ọ hapụsịrị ìgwè mmadụ ahụ banye n’ụlọ, ndị na-eso ụzọ ya jụrụ ya banyere ilu ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “okwu ahụ” ma ọ bụ “ihe atụ ahụ.” Okwu Grik bụ παραβολή (parabolē).
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Mgbe
  rationale: N’Igbo, a jikọtara njikọ Καὶ na nkebi oge nke ὅτε n’ụzọ dị ire ụtọ; ịmalite na “Mgbe” na-edobe usoro akụkọ ahụ n’enweghị “Na” nke ga-adị arọ.
- source_word: ὅτε
  choice: Mgbe
  rationale: Ọ bụ njikọ oge na-egosi ọnọdụ nke ajụjụ ndị na-eso ụzọ ahụ sochiri.
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: ọ banyere n’otu ụlọ
  rationale: “Banyere” na-egosipụta omume ịbanye, ebe “otu ụlọ” na-egosipụta na οἶκον enweghị njirimara kpọmkwem n’asụsụ Grik.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: pụọ n’etiti ìgwè mmadụ ahụ
  rationale: Nke a na-egosi na ọ kewapụrụ onwe ya n’ìgwè mmadụ mgbe ọ banyere n’ụlọ, ma na-ada ka Igbo ebumpụta ụwa.
- source_word: ἐπηρώτων
  choice: jụrụ ya
  rationale: Oge imperfect nwere ike igosi ajụjụ na-aga n’ihu, ma ngwaa gara aga dị mfe bụ ụzọ akụkọ Igbo si ekwu ya nke ọma n’ebe a.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ndị μαθηταί Jizọs.
- source_word: τὴν παραβολήν
  choice: ihe ilu ahụ pụtara
  rationale: “Ilu” na-edobe ọdịdị okwu παραβολή dịka okwu ihe atụ; itinye “ihe ... pụtara” na-eme ka ajụjụ banyere ya bụrụ Igbo nkịtị n’enweghị ịkọwa ilu ahụ n’onwe ya.
theological_decisions:
- issue: Otu a ga-esi sụgharịa παραβολή ebe okwu Jizọs nwere ike ịbụ ilu, okwu, ma ọ bụ ihe atụ
  choice: ilu
  alternative: okwu ahụ; ihe atụ ahụ
  rationale: “Ilu” na-edobe aha Grik ahụ nyere ụdị nkuzi Jizọs, ma ndetu ala peeji na-echekwa ohere sara mbara nke okwu ahụ n’ebe a.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. E debere enweghị akara kpọmkwem n’ihu οἶκον site n’iji “otu ụlọ,” ma e chekwara nghọtahie ziri ezi nke παραβολή na ndetu ala peeji.
