  text: Μωϋσῆς γὰρ εἶπεν· Τίμα τὸν πατέρα σου καὶ τὴν μητέρα σου, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: ig
  text: N’ihi na Mosis kwuru, “Sọpụrụ nna gị na nne gị,” nakwa, “Onye ọ bụla na-ekwu okwu ọjọọ megide nna ya ma ọ bụ nne ya[a] aghaghị ịnwụ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye ọ bụla na-akọcha nna ya ma ọ bụ nne ya.” Ngwaa Grik a nwere ike ịpụta ikwu okwu ọjọọ megide mmadụ, ikwujọ ya, ma ọ bụ ịkọcha ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “aghaghị igbu ya.” Grik ji usoro okwu iwu nke pụtara n’ụzọ nkịtị, “ka ọ nwụọ ọnwụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: Μωϋσῆς
  choice: Mosis
  rationale: Ụdị aha a bụ nke a na-ejikarị eme ihe n’Igbo maka Moses.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a na-enye ihe nkwado ma ọ bụ ihe kpatara arụmụka Jizọs.
- source_word: εἶπεν
  choice: kwuru
  rationale: Ọ bụ ụzọ nkịtị na nke doro anya e si akọwa okwu e kwuru n’oge gara aga.
- source_word: Τίμα
  choice: Sọpụrụ
  rationale: Ọ na-egosipụta iwu ka mmadụ nye nne na nna ùgwù kwesịrị ha, ma na-edobe ịdị arọ nke iwu ahụ.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: nna gị na nne gị
  rationale: Ọ na-edobe ihe abụọ ahụ Greek kwuru kpọmkwem n’ụzọ Igbo si ada nke ọma.
- source_word: Ὁ κακολογῶν
  choice: Onye ọ bụla na-ekwu okwu ọjọọ megide
  rationale: κακολογέω nwere ike ịpụta ikwu okwu ọjọọ megide mmadụ, ikwujọ ya, ma ọ bụ ịkọcha ya; nhọrọ a na-edobe obosara ihe okwu ahụ pụtara.
- source_word: πατέρα ἢ μητέρα
  choice: nna ya ma ọ bụ nne ya
  rationale: Nnọchiaha nwe ‘ya’ dị mkpa n’Igbo ka mmekọrịta ahụ doo anya, ọ bụ ezie na Greek ekwughị ya iche.
- source_word: θανάτῳ τελευτάτω
  choice: aghaghị ịnwụ
  rationale: Nke a na-ebute ike iwu nke usoro okwu ikpe ahụ n’Igbo eke, n’enweghị ịkọwapụta kpọmkwem onye ga-egbu ya ma ọ bụ ụzọ ọnwụ ahụ.
theological_decisions:
- issue: Otu e si sụgharịa usoro okwu ikpe θανάτῳ τελευτάτω
  choice: aghaghị ịnwụ
  alternative: aghaghị igbu ya
  rationale: Nhọrọ bụ isi na-edobe okwu Greek nke na-ekwu kpọmkwem na onye ahụ ga-anwụ, ma hapụkwa nghọtahie ziri ezi banyere ma ọ bụ usoro iwu nke igbu onye ahụ ka e bu n’obi.
- issue: Oke ihe κακολογῶν pụtara
  choice: na-ekwu okwu ọjọọ megide
  alternative: na-akọcha
  rationale: ‘Na-ekwu okwu ọjọọ megide’ na-edobe ohere nke ikwujọ, ịkparị, ma ọ bụ ịkọcha, kama ime ka ọ bụrụ naanị ọbụbụ ọnụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘Sọpụrụ’ maka ụda iwu ahụ, ‘na-ekwu okwu ọjọọ megide’ iji chekwaa obosara κακολογέω, na ‘aghaghị ịnwụ’ iji chekwaa ike usoro okwu ikpe ahụ n’enweghị ịgbakwụnye nkọwa na-adịghị n’ụdị Greek.
