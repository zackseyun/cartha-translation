  text: Καὶ συνάγονται πρὸς αὐτὸν οἱ Φαρισαῖοι καί τινες τῶν γραμματέων ἐλθόντες ἀπὸ Ἱεροσολύμων
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/001.yaml
  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: ig
  text: Ndị Farisii na ụfọdụ n’ime ndị odeakwụkwọ Iwu, bụ́ ndị si Jerusalem bịa, wee gbakọta n’ebe ọ nọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “wee gbakọta bịakwute ya.” N’okwu Grik, a pụrụ ịsụ ya n’ụzọ kpọmkwem, “gbakọta n’ebe ya nọ” ma ọ bụ “gbakọta bịakwute ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: wee
  rationale: “Wee” na-ejikọta ihe a na akụkọ gara aga n’ụzọ Igbo si akwọ akụkọ, ma na-edobe ọrụ njikọ nke καί.
- source_word: συνάγονται πρὸς αὐτὸν
  choice: gbakọta n’ebe ọ nọ
  rationale: Nke a bụ okwu Igbo dị mfe ma dị ndụ nke na-egosi na ha bịakọrọ ọnụ n’ebe ọ nọ. Ọ na-edobe echiche nke ịgbakọta n’ebe mmadụ nọ n’enweghị ịmanye ya ka ọ pụta nanị ‘gburugburụ ya.’
- source_word: οἱ Φαρισαῖοι
  choice: Ndị Farisii
  rationale: Aha a nabatara n’Igbo maka òtù ndị Juu a.
- source_word: τινες τῶν γραμματέων
  choice: ụfọdụ n’ime ndị odeakwụkwọ Iwu
  rationale: “Ụfọdụ n’ime” na-edobe partitive genitive nke Grik, ebe “ndị odeakwụkwọ Iwu” na-egosi na ndị a bụ ndị maara ma na-akọwa Iwu, ọ bụghị ndị odeakwụkwọ nkịtị.
- source_word: ἐλθόντες ἀπὸ Ἱεροσολύμων
  choice: bụ́ ndị si Jerusalem bịa
  rationale: Nkebiokwu a na-egosi na ọbịbịa ha si Jerusalem buru ụzọ mee tupu ha agbakọta n’ebe ọ nọ, ma bụrụkwa Igbo ebumpụta ụwa.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ndị odeakwụkwọ Iwu” na-ezere nghọtahie na ọ bụ ndị odeakwụkwọ nkịtị, ebe “n’ebe ọ nọ” na-enye συνάγονται πρὸς αὐτόν n’ụzọ Igbo na-asụkarị.
