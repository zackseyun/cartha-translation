- from: Ọ dịghị ihe ọ bụla si n’èzí mmadụ na-abanye n’ime ya nke pụrụ imerụ ya[a]; kama, ọ bụ ihe ndị si n’ime mmadụ pụta na-emerụ mmadụ.
