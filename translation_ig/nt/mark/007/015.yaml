  rationale: The revision replaces the overly broad “imerụ” with “imetọ,” which better represents κοινόω as defiling or rendering unclean. It also recasts the first clause slightly for clear, natural Standard Igbo while retaining the Greek contrast between what is outside and enters a person and what comes out from within.
