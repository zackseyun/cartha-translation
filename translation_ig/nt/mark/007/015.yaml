id: MRK.7.15
reference: Mark 7:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: ig
  text: Ọ dịghị ihe ọ bụla dị n’èzí mmadụ nke, mgbe ọ banyere n’ime ya, pụrụ imetọ ya[a]; kama, ihe ndị si n’ime mmadụ apụta bụ ihe na-emetọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ime ka ọ ghara ịdị ọcha.” Okwu Grik a pụrụ izo aka n’ime ka mmadụ ghara ịdị ọcha n’ihe gbasara iwu ịdị ọcha; “imetọ” na-ebukwa mmetụta sara mbara nke mmebi omume dị n’okwu gbara ya gburugburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: ọ dịghị ihe ọ bụla
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji ekwu okwu kwa ụbọchị iji gosipụta ‘nothing’ n’enweghị mbelata ike nkwupụta ahụ.
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: si n’èzí mmadụ
  rationale: Ọ na-echekwa echiche nke ihe sitere n’èzí ma na-akwado ọdịiche ya na ihe ‘si n’ime mmadụ pụta’ n’ọgwụgwụ amaokwu ahụ.
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: na-abanye n’ime ya
  rationale: Ọ na-egosipụta participle ahụ n’ụzọ Igbo dị ndụ ma mee ka ihe sitere n’èzí na-abanye n’ime mmadụ doo anya.
- source_word: δύναται
  choice: pụrụ
  rationale: ‘Pụrụ’ na-egosipụta ikike ma ọ bụ ohere nke ọma n’ụzọ dị mkpirikpi ma bụrụ nke e ji asụ Igbo nke ọma.
- source_word: κοινῶσαι / κοινοῦντα
  choice: imerụ / na-emerụ
  rationale: N’okwu a gbasara ịdị ọcha, κοινόω pụtara ime ka mmadụ ghara ịdị ọcha, ma o nwekwara mmetụta gbasara mmebi omume. ‘Imerụ’ na-ejide obosara ahụ nke ọma; e nyere nkọwa ọzọ n’ala peeji.
- source_word: ἀλλὰ
  choice: kama
  rationale: ‘Kama’ na-egosipụta ntụgharị siri ike na mmezi echiche dị n’etiti akụkụ abụọ nke okwu Jizọs.
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: ihe ndị si n’ime mmadụ pụta
  rationale: Ọ na-echekwa plural ‘ihe ndị’ na mmegharị si n’ime mmadụ pụta, ma na-eme ka ọdịiche dị n’etiti n’èzí na n’ime pụta ìhè.
- source_word: τοῦ ἀνθρώπου / τὸν ἄνθρωπον
  choice: mmadụ
  rationale: N’Igbo, ‘mmadụ’ bụ aha nkịtị maka onye mmadụ n’agbanyeghị nwoke ma ọ bụ nwanyị, ma ọ na-echekwa singular generic force nke ἄνθρωπος n’enweghị okwu na-adịghị eke eke.
theological_decisions:
- issue: Ihe κοινόω pụtara n’arụmụka gbasara ịdị ọcha
  choice: imerụ
  alternative: ime ka ọ ghara ịdị ọcha
  rationale: ‘Imerụ’ na-ahapụ ma echiche nke adịghị ọcha n’usoro okpukpe ma mmetụta sara mbara nke mmebi omume; nkọwa ala peeji na-edobe ntụgharị nke kpọmkwem gbasara ịdị ọcha.
- issue: Iji ἄνθρωπος mee ihe n’ụzọ na-anọchi mmadụ niile
  choice: mmadụ
  alternative: nwoke
  rationale: ἄνθρωπος ebe a na-anọchi onye mmadụ n’ozuzu. ‘Mmadụ’ bụ okwu Igbo ziri ezi ma dị eke maka nke a, ebe ‘nwoke’ ga-eme ka ihe ahụ pụta naanị nwoke ma mebie obosara isi mmalite ahụ.
translation_notes:
  register: Asụsụ Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ntụnyere doro anya n’etiti ihe si n’èzí abanye na ihe si n’ime mmadụ pụta. A họọrọ ‘mmadụ’ dịka okwu generic eke n’Igbo.
