    issue: “Imerụ” is an imprecise rendering of κοινόω.
    rationale: In ordinary Igbo, “imerụ” primarily means to harm or damage. Mark 7:15 concerns what renders a person defiled/unclean; “imetọ” is the closer and more contextually appropriate term.
