  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντα ταῦτα τὰ πονηρὰ ἔσωθεν ἐκπορεύεται καὶ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: ig
  text: Ihe ọjọọ ndị a niile na-esi n'ime mmadụ apụta, na-emekwa ka mmadụ ghara ịdị ọcha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: Ihe ọjọọ ndị a niile
  rationale: Nke a na-egosipụta nkwusi ike na mkpokọta ihe ọjọọ ndị e depụtara n'amaokwu ndị bu ụzọ, ma na-edobe ha dịka ọtụtụ ihe kpọmkwem.
- source_word: ἔσωθεν
  choice: n'ime mmadụ
  rationale: Ọ na-egosi na mmalite ihe ndị ahụ dị n'ime mmadụ; itinye “mmadụ” ebe a na-eme ka okwu Igbo doo anya n'ụzọ kwekọrọ n'okwu gbara ya gburugburu.
- source_word: ἐκπορεύεται
  choice: na-esi ... apụta
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa maka mmegharị sitere n'ime gaa n'èzí, ma na-egosikwa omume a na-ekwu n'ozuzu ya.
- source_word: κοινοῖ
  choice: na-eme ka mmadụ ghara ịdị ọcha
  rationale: N'ọnọdụ a gbasara ịdị ọcha na adịghị ọcha, nkebiokwu a na-egosipụta ime mmadụ ka ọ bụrụ onye na-adịghị ọcha, kama ịsụgharị ya dịka nanị ime ihe ka ọ bụrụ ihe nkịtị.
- source_word: τὸν ἄνθρωπον
  choice: mmadụ
  rationale: “Mmadụ” bụ aha Igbo dị n'otu nke a na-eji ekwu maka nwoke ma ọ bụ nwaanyị n'ozuzu; ya mere ọ na-edobe otu onye e ji anọchi anya mmadụ niile n'okwu Grik ahụ n'enweghị mgbagwoju anya gbasara okike.
theological_decisions:
- issue: Ihe κοινόω pụtara n'okwu gbasara ịdị ọcha
  choice: na-eme ka mmadụ ghara ịdị ọcha
  alternative: na-emerụ mmadụ
  rationale: Nhọrọ a na-edobe njikọ okwu ahụ na arụmụka Jizọs banyere ihe na-eme mmadụ ka ọ ghara ịdị ọcha, ma ọ naghị ekpebi ma adịghị ọcha ahụ bụ naanị nke emume ma ọ bụ naanị nke omume.
- issue: Ojiji τὸν ἄνθρωπον dịka aha otu onye na-anọchi mmadụ niile
  choice: mmadụ
  alternative: onye ahụ
  rationale: “Mmadụ” na Standard Igbo na-arụ ọrụ dịka aha otu onye e ji ekwu maka mmadụ n'ozuzu ya, ya mere ọ na-echekwa ịdị n'otu na nghọta zuru ụwa ọnụ nke okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Nhazi “na-esi ... apụta” bụ nke a na-asụkarị, ebe “na-eme ka mmadụ ghara ịdị ọcha” na-echekwa isiokwu ịdị ọcha nke akụkụ Akwụkwọ Nsọ a.
