  source_fidelity: Ihe ọjọọ ndị a niile reflects πάντα ταῦτα τὰ πονηρά comprehensively. “Na-esi n'ime mmadụ apụta” conveys interior origin, and “na-eme ka mmadụ ghara ịdị ọcha” accurately communicates κοινόω in Mark's purity context. Although ἔσωθεν is more literally “from within,” specifying mmadụ is a natural, contextually supplied complement in Igbo and does not alter the sense.
  naturalness: The wording is fluent, clear Standard Igbo. The paired progressive forms, “na-esi ... apụta, na-emekwa,” naturally present the general truth expressed by the Greek.
  terminology: “Ihe ọjọọ” is appropriate for τὰ πονηρά, and “ghara ịdị ọcha” preserves the purity/defilement sense without reducing it to physical dirtiness or imposing a narrow doctrinal interpretation. “Mmadụ” naturally carries the generic singular force of τὸν ἄνθρωπον in Igbo; no gender-related footnote is necessary.
