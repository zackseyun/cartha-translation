  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι οὐκ εἰσπορεύεται αὐτοῦ εἰς τὴν καρδίαν ἀλλ’ εἰς τὴν κοιλίαν, καὶ εἰς τὸν ἀφεδρῶνα ἐκπορεύεται; —⸀καθαρίζων πάντα τὰ βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/019.yaml
  text: because it does not enter into his heart but into his stomach[a], and goes out into the latrine"—thus cleansing all foods.
translation:
  language: ig
  text: N’ihi na ọ naghị abanye n’obi ya, kama ọ na-abanye n’afọ ya, ọ na-apụkwa gaa n’ụlọ mposi”—n’ụzọ dị otu a, a na-eme ka ihe oriri niile dị ọcha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “si otú ahụ na-ekpochapụ ihe oriri niile,” ma ewere okwu ikpeazụ ahụ dịka ihe na-ekwu banyere usoro mgbari nri, ọ bụghị dịka nkọwa nke Mak.
    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν
  choice: obi
  rationale: E ji “obi” debe ihe atụ gbasara akụkụ dị n’ime mmadụ, nke e ji tụnyere afọ na usoro mgbari nri, n’enweghị ịkọwa ya gabiga ihe Grik kwuru.
- source_word: κοιλίαν
  choice: afọ
  rationale: “Afọ” bụ okwu Igbo nkịtị ma doo anya maka akụkụ ahụ nri na-abanye n’usoro mgbari nri.
- source_word: ἀφεδρῶνα
  choice: ụlọ mposi
  rationale: Nke a na-egosi ebe a na-ewepụ nsị n’ụzọ doro anya, dị ùgwù, ma bụrụkwa asụsụ ndị mmadụ na-aghọta taa.
- source_word: καθαρίζων
  choice: site n’otu a na-eme ka … dị ọcha
  rationale: Nsụgharị a na-anọ nso n’echiche “ime ka ọ dị ọcha,” ma na-ahapụ okwu ahụ ka ọ bụrụ nkọwa Mak banyere ihe ozizi Jizọs pụtara, n’etinyeghị okwu siri ike dịka “kwupụta.”
- source_word: βρώματα
  choice: ihe oriri niile
  rationale: “Ihe oriri” na-anọchi ọtụtụ ụdị nri Grik plural ahụ na-ekwu maka ha; “niile” na-egosipụta πάντα.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnochiaha a na-ezo aka n’onye a na-ekwu maka ya, dịka Grik si dị.
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: abanye / apụ gaa
  rationale: A debere mmegharị nke ịbanye na ịpụ n’asụsụ Igbo dị mfe ma kwekọọ na usoro mgbari nri.
theological_decisions:
- issue: Nkọwa nke καθαρίζων πάντα τὰ βρώματα
  choice: 'Okwu nkọwa Mak: “site n’otu a na-eme ka ihe oriri niile dị ọcha”'
  alternative: 'E nwere ike iwere ya dịka ihe usoro mgbari nri na-eme: “si otú ahụ na-ekpochapụ ihe oriri niile.”'
  rationale: Ụdị participle nwoke otu n’Grik na-akwado nghọta na Mak na-akọwa ihe okwu Jizọs pụtara. Ma n’ihi na njikọ ahịrịokwu ahụ siri ike ma nghọta gbasara usoro mgbari nri kwekwara omume, e debere nhọrọ ahụ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. A họọrọ “ụlọ mposi” maka nghọta nkịtị, ebe a hapụrụ nghọtahie dị n’ahịrịokwu ikpeazụ n’isiokwu bụ isi na nkọwa ala peeji.
