    issue: The introductory final clause is slightly awkward in Igbo.
    rationale: “Site n’otu a na-eme ka...” is understandable, but “N’ụzọ dị otu a, a na-eme ka...” is more idiomatic and preserves the participial/resultative relationship without supplying an explicit doctrinal subject.
  - severity: low
    issue: Footnote possessive wording is incomplete.
    rationale: “nkọwa Mak” should be “nkọwa nke Mak” in natural Standard Igbo.
