  text: Καὶ προσκαλεσάμενος ⸀πάλιν τὸν ὄχλον ἔλεγεν αὐτοῖς· ⸀Ἀκούσατέ μου πάντες καὶ ⸀σύνετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/014.yaml
  text: And calling the crowd to him again, he was saying to them, “Listen to me, all of you, and understand.”
translation:
  language: ig
  text: Mgbe ọ kpọrọ ìgwè mmadụ ahụ ọzọ ka ha bịakwute ya, ọ nọ na-agwa ha, sị, “Unu niile, geenụ m ntị, ghọtanụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: mgbe ọ kpọkọtara ... ka ha bịakwute ya
  rationale: Na-egosi na ọ kpọrọ ìgwè mmadụ ahụ ka ha bịaruo ya nso, n’asụsụ Igbo doro anya ma kwekọọ n’ụdị participle ahụ.
- source_word: πάλιν
  choice: ọzọ
  rationale: Na-edobe echiche nke ime ihe ahụ ọzọ.
- source_word: ἔλεγεν
  choice: ọ nọ na-agwa
  rationale: Imperfect a na-egosi omume na-aga n’ihu ma ọ bụ okwu ọ na-ekwu n’oge ahụ; nke a na-echekwa ọdịiche dị na ‘ọ gwara ha’.
- source_word: Ἀκούσατέ μου
  choice: geenụ m ntị
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi nye ọtụtụ mmadụ iwu ka ha gee onye na-ekwu okwu ntị.
- source_word: πάντες
  choice: unu niile
  rationale: Na-eme ka o doo anya na iwu ahụ metụtara onye ọ bụla n’ìgwè ahụ.
- source_word: σύνετε
  choice: ghọtakwanụ
  rationale: Na-egosi iwu e nyere ọtụtụ mmadụ ka ha ghọta ihe ọ na-ekwu; ‘-kwa-’ jikọtara iwu nke abụọ na nke mbụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ịdị na-aga n’ihu nke ἔλεγεν site n’okwu ‘ọ nọ na-agwa,’ ma ghara itinye nkọwa okpukpe na-adịghị n’amaokwu ahụ.
