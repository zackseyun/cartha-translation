  yaml_path: translation/nt/mark/007/020.yaml
  text: And he was saying, “What comes out from the man—that defiles the man.”
translation:
  language: ig
  text: Ọ nọkwa na-ekwu, “Ihe si n’ime mmadụ pụta—ọ bụ ihe ahụ na-emerụ mmadụ.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-eme ka mmadụ ghara ịdị ọcha.” Ngwaa Grik a bụ okwu gbasara ịdị ọcha n’emume; ọ pụtara ime ka mmadụ ghara ịdị ọcha, ya bụ, imerụ ya n’ụzọ metụtara ịdị ọcha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ọ nọkwa na-ekwu
  rationale: Oge imperfect na-egosi okwu ọ nọ na-aga n’ihu ikwu; usoro a na-echekwa akụkụ ahụ n’Igbo dị ugbu a.
- source_word: δὲ
  choice: -kwa
  rationale: Ihe mgbakwunye -kwa na-ejikọta okwu a nwayọọ na ihe bu ya ụzọ, n’ebughị echiche nke nnukwu mmegide.
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: Ihe si n’ime mmadụ pụta
  rationale: Nke a na-asụgharị articular participle dị ka ‘ihe ... pụta’ n’ụzọ Igbo na-ada nke ọma; ‘si n’ime mmadụ’ na-egosipụta isi mmalite e kwuru n’amaokwu gbara ya gburugburu.
- source_word: ἀνθρώπου / ἄνθρωπον
  choice: mmadụ
  rationale: ἄνθρωπος ebe a bụ mmadụ n’ozuzu ya; ‘mmadụ’ bụ okwu Igbo nkịtị nke na-echekwa ike nnọchianya ahụ n’enweghị ịmanye okike nwoke.
- source_word: ἐκεῖνο
  choice: ọ bụ ihe ahụ
  rationale: 'Usoro a na-echekwa nkwusi ike nke demonstrative ahụ: ihe ahụ kpọmkwem bụ ihe na-emerụ mmadụ.'
- source_word: κοινοῖ
  choice: na-emerụ
  rationale: N’ọnọdụ a, ngwaa ahụ bụ asụsụ gbasara ịdị ọcha ma pụta ime ka mmadụ ghara ịdị ọcha; ‘na-emerụ’ dị nkenke ma kwekọọ n’asụsụ Igbo dị ugwu, ebe nkọwa ọzọ dị n’ala peeji.
theological_decisions:
- issue: Asụsụ ịdị ọcha nke κοινόω n’ozizi Jizọs
  choice: na-emerụ
  alternative: na-eme ka mmadụ ghara ịdị ọcha
  rationale: ‘Na-emerụ’ na-enye echiche nke mmetọ n’ụzọ dị mfe ma dị ike; ihe e dere n’ala peeji na-echekwa njikọ doro anya ya na usoro ịdị ọcha, ka a ghara ihichapụ ọnọdụ okpukpe ndị Juu.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị mfe ma dị ugwu. E ji ‘mmadụ’ mee ihe maka mmadụ n’ozuzu ya. Akara ogologo ahụ na-enye nkwusi ike nke ἐκεῖνο, ebe akara ala peeji [a] nọ kpọmkwem n’ebe nhọrọ okwu κοινόω metụtara.
