review_pass:
  verdict: revise
  source_fidelity: The rendering accurately conveys returning from the marketplace, abstaining from eating unless ritual washing has occurred, and the received practices of washing vessels. ‘Akwa ndị e ji eri nri,’ however, can mean cloths or mats used in eating rather than the couches/reclining beds denoted by κλινῶν. ‘Ite mmiri’ also adds ‘water,’ which ξέστης does not state.
  naturalness: The sentence is generally clear Standard Igbo. Recasting the final item as couches on which people reclined while eating makes the historical object clear and avoids the ambiguity of ‘akwa ndị e ji eri nri.’ ‘Ite’ is a natural broad term for the vessel without supplying an unstated content.
  terminology: ‘Ịsa onwe ha’ and ‘ịsa’ appropriately render βαπτίσωνται and βαπτισμούς in this purity context without introducing Christian sacramental meaning. The lexical footnote’s phrase ‘ime baptizim’ is understandable, but its wording is improved to identify it as the Greek verb commonly rendered by that expression.
  issues:
  - severity: medium
    issue: ‘akwa ndị e ji eri nri’ does not clearly denote dining couches.
    rationale: κλινῶν denotes beds/couches; in this setting it plausibly refers to reclining couches. The current Igbo may instead be understood as cloths, mats, or other items used for eating.
  - severity: low
    issue: ‘ite mmiri’ specifies water although the Greek only names a vessel.
    rationale: ξέστης is a vessel such as a pitcher or jar; no contents are identified. ‘Ite’ preserves the source’s breadth.
  revised_text: 'Mgbe ha si n’ahịa lọta, ha adịghị eri nri ma ọ bụrụ na ha asaghị onwe ha[a]. E nwekwara ọtụtụ ihe ndị ọzọ ha natara ka ha debe: ịsa iko, ite, arịa ọla kọpa, na akwa ndị a na-adabere n’elu ha mgbe a na-eri nri[b]—'
