id: MRK.7.4
reference: Mark 7:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀπ’ ⸀ἀγορᾶς ἐὰν μὴ ⸀βαπτίσωνται οὐκ ἐσθίουσιν, καὶ ἄλλα πολλά ἐστιν ἃ παρέλαβον κρατεῖν, βαπτισμοὺς ποτηρίων καὶ ξεστῶν καὶ χαλκίων ⸂καὶ κλινῶν⸃—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: ig
  text: 'Mgbe ha si n’ahịa lọta, ha adịghị eri nri ma ọ bụrụ na ha asaghị onwe ha[a]. E nwekwara ọtụtụ ihe ndị ọzọ ha natara ka ha debe: ịsa iko, ite, arịa ọla kọpa, na akwa ndị a na-adabere n’elu ha mgbe a na-eri nri[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ma ha emikpughị onwe ha n’ime mmiri.” Okwu Grik e ji ebe a bụ ụdị ngwaa a na-asụgharịkarị dị ka “ime baptizim,” ma n’ebe a ọ na-ekwu maka ịsa ahụ dịka omenala ịdị ọcha.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ ihe odide ochie ahapụrụ “na akwa ndị a na-adabere n’elu ha mgbe a na-eri nri.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: ahịa
  rationale: N’Igbo nkịtị, “ahịa” na-egosi ebe ọha na-azụ ma na-ere ihe; ọ dabara nke ọma na ἀγορά n’amaokwu a.
- source_word: βαπτίσωνται
  choice: asaghị onwe ha
  rationale: N’ọnọdụ a, ngwaa ahụ na-ekwu maka ịsa ahụ dịka omenala ịdị ọcha tupu iri nri, ọ bụghị baptizim Ndị Kraịst. “Ịsa onwe ha” gosikwara ụdị middle nke ngwaa Grik ahụ.
- source_word: παρέλαβον κρατεῖν
  choice: ha natara ka ha debe
  rationale: Nke a na-edobe echiche nke omenala ha natara ma nọgide na-eme, n’enweghị ịgbanwe isi okwu ahụ ka ọ bụrụ naanị inyefe ya ndị ọzọ.
- source_word: βαπτισμοὺς
  choice: ịsacha
  rationale: Ọ na-ezo aka n’ịsa ihe dị iche iche dịka akụkụ nke omenala ịdị ọcha; “ịsacha” bụ okwu doro anya nke na-adịghị ebubata echiche baptizim.
- source_word: ξεστῶν
  choice: ite mmiri
  rationale: ξέστης bụ ụdị ite ma ọ bụ jug; “ite mmiri” bụ okwu Igbo dị mfe nghọta ma ghara ịkọwa ụdị arịa ahụ karịa ihe isi mmalite kwuru.
- source_word: χαλκίων
  choice: arịa ọla kọpa
  rationale: Okwu a na-ezo aka n’arịa e ji kọpa ma ọ bụ ngwakọta ọla yiri ya mee; “arịa ọla kọpa” na-egosipụta ihe ahụ n'ụzọ doro anya.
- source_word: κλινῶν
  choice: akwa ndị e ji eri nri
  rationale: κλίνη nwere ike ịbụ akwa ma ọ bụ ihe e ji edina/anọdụ ala. N’ọnọdụ iri nri a, ọ na-ezo aka n’akwa ndị mmadụ na-adabere n’elu ha mgbe ha na-eri nri.
- source_word: ἄλλα πολλά
  choice: ọtụtụ ihe ndị ọzọ
  rationale: Nke a na-edobe obosara nke okwu Grik ahụ n’ebughị ụzọ kọwaa ihe ndị ahụ niile dị ka omenala ma ọ bụ usoro.
theological_decisions:
- issue: Ihe βαπτίσωνται na βαπτισμοὺς pụtara n’ọnọdụ omenala ịdị ọcha
  choice: Ịsụgharị ha dịka “ịsa onwe ha” na “ịsacha.”
  alternative: “imikpu onwe ha na mmiri” na “imikpu ihe na mmiri,” ma ọ bụ iji okwu metụtara baptizim.
  rationale: Amaokwu a na-ekwu maka omenala ịdị ọcha nke ndị Farisii, ọ bụghị baptizim Ndị Kraịst. Nsụgharị a na-edobe ọnọdụ ndị Juu ahụ ma na-ezere itinye echiche sakrament n’ebe ederede ahụ na-etinyeghị ya.
- issue: κλινῶν dị na ụfọdụ ihe odide ma ọ bụghị na ndị ọzọ
  choice: Itinye “akwa ndị e ji eri nri” n’ederede ma tinye nkọwa ọdịiche ihe odide n’ala peeji.
  alternative: Ịhapụ okwu ahụ n’ederede.
  rationale: SBLGNT tinyere okwu ahụ n’ederede ma gosipụta na e nwere ọdịiche n’ihe odide; ya mere, a na-edobe ya ma gwa onye na-agụ banyere ọdịiche ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa nsọpụrụ. “Akwa ndị e ji eri nri” na-akọwa ihe ndina ma ọ bụ couch ndị mmadụ na-adabere n’elu ya mgbe ha na-eri nri n’oge ahụ. E tinyere akara [a] n’akụkụ “asaghị onwe ha,” ebe nkọwa lexical ahụ metụtara, kama itinye ya n’akụkụ “ahịa.”
