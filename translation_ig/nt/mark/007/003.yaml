  text: οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι ἐὰν μὴ πυγμῇ νίψωνται τὰς χεῖρας οὐκ ἐσθίουσιν, κρατοῦντες τὴν παράδοσιν τῶν πρεσβυτέρων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: ig
  text: N’ihi na ndị Farisii na ndị Juu niile anaghị eri nri ma ọ bụrụ na ha ejighị ọkpọ aka saa aka ha[a], ebe ha na-agbaso ọdịnala ndị okenye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ọkpọ aka”; ikekwe, “ruo na nkwojiaka” ma ọ bụ “n'ụzọ zuru ezu.” Okwu Grik a siri ike ịkọwa, o yikwara ka ọ na-ekwu banyere usoro omenala e si asa aka.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-egosi na amaokwu a bụ nkọwa e tinyere iji kọwaa ihe e kwuru tupu ya.
- source_word: Φαρισαῖοι
  choice: ndị Farisii
  rationale: Aha a bụ ntụgharị mkpụrụokwu a na-ejikarị eme ihe n’Igbo maka òtù ndị Juu a.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: ndị Juu niile
  rationale: Na-edobe okwu sara mbara nke Grik; ọ bụ nkọwa izugbe, ọ bụghị iwu na ọ pụtara onye Juu ọ bụla n’enweghị onye fọdụrụ.
- source_word: ἐὰν μὴ
  choice: ma ọ bụrụ na ... ejighị
  rationale: Ọ bụ ụzọ Igbo doro anya si egosipụta ọnọdụ na-adịghị eme ma e wezụga mgbe ihe ọzọ mere.
- source_word: πυγμῇ
  choice: ejighị aka apịaji
  rationale: Na-edobe ihe oyiyi nkịtị nke okwu Grik ahụ, nke pụtara ‘ọkụ aka/aka apịaji,’ ma tinye nkọwa ala peeji n’ihi na kpọmkwem ụzọ ịsa aka ọ na-ekwu banyere ya ka a na-arụrịta ụka.
- source_word: νίψωνται τὰς χεῖρας
  choice: saa aka ha
  rationale: Ntụgharị Igbo nkịtị na nke doro anya maka ịsa akụkụ ahụ, ebe a bụ aka.
- source_word: οὐκ ἐσθίουσιν
  choice: adịghị eri nri
  rationale: Na-egosi omume ha na-emekarị; ‘nri’ na-eme ka ahịrịokwu ahụ daa nke ọma n’Igbo.
- source_word: κρατοῦντες
  choice: si otú a na-edebe
  rationale: Na-egosi ịrapara n’ihe e nyefere ha ma na-egosikwa njikọ omume ịsa aka ahụ na ọdịnala ahụ.
- source_word: παράδοσιν τῶν πρεσβυτέρων
  choice: ọdịnala ndị okenye nyere ha
  rationale: Na-akọwa genitive ahụ n’ụzọ Igbo dị ndụ dịka ọdịnala sitere n’aka ndị okenye ma nyefee ya.
theological_decisions:
- issue: Ogologo okwu ‘ndị Juu niile’
  choice: E debere ‘ndị Juu niile’ dịka nkọwa sara mbara Mak dere.
  alternative: ndị Judia niile; ọtụtụ ndị Juu
  rationale: Grik kwuru πάντες, ‘niile.’ Ịgbanwe ya ka ọ bụrụ ‘ọtụtụ’ ga-eme ka okwu isi mmalite dị nro karịa ka ọ dị, ọ bụ ezie na a pụrụ ịghọta ya dịka okwu izugbe kama ọnụ ọgụgụ kpọmkwem.
- issue: Ihe πυγμῇ pụtara
  choice: E ji ‘aka apịaji’ mee ntụgharị bụ́ isi ma debe nghọta ndị ọzọ n’ala peeji.
  alternative: ruo na nkwonkwo aka; nke ọma; nke ọma nke ukwuu
  rationale: Okwu ahụ siri ike ma eleghị anya ọ na-ekwu banyere otu usoro omenala e si asa aka. Tụgharị ya n’ụzọ nkịtị ma kọwaa nhọrọ ndị ọzọ na-egbochi ka ntụgharị kpebie ihe isi mmalite hapụrụ n’ọnọdụ a na-ejighị n’aka.
translation_notes:
  register: E ji Igbo Ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ndị Farisii,’ ‘ndị Juu,’ na ‘ọdịnala ndị okenye’ bụ okwu ndị a na-amata ngwa ngwa. Nkọwa ala peeji na-echekwa mgbagwoju anya nke πυγμῇ n’etinyeghị nkọwa otu òtù okpukpe.
