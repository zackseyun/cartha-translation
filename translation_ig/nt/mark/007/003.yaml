- from: N’ihi na ndị Farisii na ndị Juu niile adịghị eri nri ma ọ bụrụ na ha ejighị aka apịaji saa aka ha[a], si otú a na-edebe ọdịnala ndị okenye nyere ha.
  to: N’ihi na ndị Farisii na ndị Juu niile anaghị eri nri ma ọ bụrụ na ha ejighị ọkpọ aka saa aka ha[a], ebe ha na-agbaso ọdịnala ndị okenye.
