  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ φέρουσιν αὐτῷ κωφὸν ⸀καὶ ⸀μογιλάλον, καὶ παρακαλοῦσιν αὐτὸν ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: ig
  text: Ha kpọtaara ya otu nwoke ntị chiri, nke ikwu okwu na-esikwa ike, ma rịọsie ya ike ka o bikwasị nwoke ahụ aka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φέρουσιν
  choice: Ha kpọtaara
  rationale: A sụgharịrị historical present nke Mak dịka oge gara aga, nke dabara n’usoro akụkọ Igbo ma na-edobe usoro ihe mere.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnochiaha dative a na-egosi na a kpọtaara nwoke ahụ Jizọs; ‘ya’ bụ ntụgharị Igbo dị nkenke ma kwekọọ n’ebe a.
- source_word: κωφόν
  choice: otu nwoke ntị chiri
  rationale: κωφός n’ebe a na-egosi onye na-adịghị anụ ihe; okwu na-esote ya kọwara nsogbu ikwu okwu iche, ya mere a sụgharịghị ya dịka onye ogbi.
- source_word: μογιλάλον
  choice: nke na-asụkwa okwu n’ike
  rationale: Okwu a na-adịghị apụtakarị na-egosi onye okwu na-esiri ike, ọ bụghị onye na-apụghị ikwu okwu kpamkpam. Nkebi a na-enye nghọta ahụ n’Igbo nkịtị.
- source_word: παρακαλοῦσιν
  choice: rịọsie ya ike
  rationale: N’ọnọdụ ịgwọ ọrịa a, ngwaa ahụ na-egosi arịrịọ siri ike karịa naanị ‘rịọ.’
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: ka o bikwasị nwoke ahụ aka ya
  rationale: Nkebi a na-egosi ihe ha rịọrọ. ‘Aka ya’ na-edobe otu aka nke Greek τὴν χεῖρα, ebe ‘nwoke ahụ’ na-eme ka onye a ga-ebikwasị aka doo anya n’Igbo.
theological_decisions:
- issue: Ụdị nsogbu nwoke ahụ nwere
  choice: Ọ bụ onye ntị chiri nke ikwu okwu na-esikwa ike, ọ bụghị onye ogbi kpamkpam.
  alternative: Onye ntị chiri na onye ogbi.
  rationale: 'κωφός na μογιλάλος bụ nkọwa abụọ dị iche: nke mbụ na-egosi ntị chiri, nke abụọ na-egosi ikwu okwu n’ike. Ịsị ‘ogbi’ ga-eme ka μογιλάλος sie ike karịa ihe okwu Greek pụtara.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ntị chiri’ na ‘na-asụ okwu n’ike’ kewapụtara nsogbu ịnụ ihe na nsogbu ikwu okwu, ebe ‘rịọsie ... ike’ na-egosi ịdị ọkụ n’obi nke arịrịọ ahụ.
