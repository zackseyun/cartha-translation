source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτῇ· Ἄφες πρῶτον χορτασθῆναι τὰ τέκνα, οὐ γὰρ ⸂καλόν ἐστιν⸃ λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ ⸂τοῖς κυναρίοις βαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: ig
  text: Ọ nọ na-asị ya, “Ka e buru ụzọ nye ụmụaka nri ka afọ ju ha, n’ihi na ọ dịghị mma iwere achịcha ụmụaka tụba ya nye ụmụ nkịta[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “nkịta ụlọ” ma ọ bụ naanị “nkịta.” Okwu Grik e ji mee ihe bụ ụdị na-egosi obere nkịta, ma eleghị anya nkịta a na-azụ n’ụlọ, ọ bụghị nkịta ọhịa na-awagharị achọ ihe oriri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ọ nọ na-asị
  rationale: Oge imperfect na-egosi okwu na-aga n’ihu; ‘ọ nọ na-asị’ na-echekwa akụkụ ahụ n’Igbo dị ugbu a.
- source_word: Ἄφες
  choice: Ka e
  rationale: N’ebe a, imperative ahụ pụtara ikwe ka ihe mee; usoro ‘Ka e…’ bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche ahụ.
- source_word: πρῶτον
  choice: buru ụzọ
  rationale: Nke a na-echekwa usoro oge na mkpa ibute ụmụaka ụzọ, n’enweghị ikwu na a ga-ajụ ndị ọzọ ruo mgbe ebighị ebi.
- source_word: χορτασθῆναι
  choice: nye … nri ka afọ ju ha
  rationale: Nke a na-egosipụta ma inye nri ma iriju afọ, ya bụ, ike zuru ezu nke ngwaa Grik ahụ, n’Igbo eke.
- source_word: τὰ τέκνα
  choice: ụmụaka
  rationale: Ọ bụ okwu Igbo nkịtị maka ụmụ, ma na-echekwa ihe atụ ezinụlọ ahụ n’egosighị afọ ndụ ma ọ bụ okike.
- source_word: καλόν ἐστιν
  choice: ọ dịghị mma
  rationale: Nke a na-anọ nso n’ụdị Grik ma nwee ike ịpụta ihe na-adịghị mma ma ọ bụ na-ekwesịghị ekwesị n’ọnọdụ a.
- source_word: λαβεῖν
  choice: iwere
  rationale: Nke a bụ nkọwa kpọmkwem ma dị eke nke infinitive ahụ.
- source_word: ἄρτον
  choice: achịcha
  rationale: Ọ na-echekwa ihe oyiyi nri a kapịrị ọnụ nke dị na Grik kama ime ya naanị ‘nri.’
- source_word: κυναρίοις
  choice: ụmụ nkịta
  rationale: Ụdị diminutive ahụ na-atụ aka ná nkịta nta ma ọ bụ nkịta ụlọ; ‘ụmụ nkịta’ na-echekwa obere-ụdị okwu ahụ n’Igbo.
- source_word: βαλεῖν
  choice: tụbara ya
  rationale: ‘Tụbara’ na-echekwa ihe oyiyi siri ike nke βάλλω; ‘ya’ na-ezo aka n’achịcha ahụ ma mee ka Igbo doo anya.
theological_decisions:
- issue: Ihe atụ nke ‘ụmụaka’ na ‘ụmụ nkịta’
  choice: E debere ihe atụ ezinụlọ ahụ n’ederede n’enweghị ịkọwa ndị ọ na-anọchi anya.
  alternative: Ịsụgharị ‘ụmụaka’ dị ka ndị Izrel/Juu, na ‘ụmụ nkịta’ dị ka ndị mba ọzọ.
  rationale: Grik n’onwe ya na-enye ihe atụ, ọ bụghị nkọwa doro anya banyere ndị ọ na-anọchi anya. Idebe ihe atụ ahụ na-egbochi itinye nkọwa okpukpe n’ime ederede.
- issue: Ike okwu πρῶτον
  choice: E chekwara ya dị ka ‘buru ụzọ.’
  alternative: Ịhapụ echiche usoro oge ahụ ka ahịrịokwu dị mkpụmkpụ.
  rationale: 'Ọ na-echekwa esemokwu dị mkpa: e nyere ụmụaka ụzọ, ma okwu ahụ ekwughị na a ga-achụpụ ndị ọzọ kpamkpam.'
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị nsọ ma dị mfe nghọta. A họọrọ usoro ahịrịokwu eke n’Igbo ma chekwaa ihe oyiyi achịcha, ụmụaka, na ụmụ nkịta, tinyere echiche nke ibute ụmụaka ụzọ.
