  source_fidelity: The draft retains all source elements and accurately renders πνεῦμα ἀκάθαρτον as “mmụọ na-adịghị ọcha.” However, the relative construction “otu nwanyị, onye obere nwa ya nwanyị…” is not the natural or precise Igbo way to express “a woman whose little daughter…,” and footnote anchor [a] is attached to the wrong expression.
  naturalness: The revised sentence uses a parenthetical relative clause, a natural Standard Igbo way to identify the woman while preserving the Greek narrative sequence. “Ozugbo” remains associated with her hearing about Jesus, as in εὐθὺς ἀκούσασα.
  terminology: “Mmụọ na-adịghị ọcha” appropriately preserves Mark’s recurring term without imposing the more interpretive “mmụọ ọjọọ.” “Nwa ya nwanyị nta” retains both the filial sense and the diminutive nuance of θυγάτριον.
  issues:
