  to: Ma ozugbo otu nwanyị—nwa ya nwanyị nta[a] nwere mmụọ na-adịghị ọcha[b]—nụrụ akụkọ banyere ya[c], ọ bịara daa n’ụkwụ ya.
  rationale: The revision corrects the possessive relative expression and relocates the lexical footnote anchor to “nwa ya nwanyị nta.” It preserves the source’s sequence, the diminutive nuance of θυγάτριον, Mark’s phrase “unclean spirit,” and the restrained depiction of the woman’s act of supplication.
