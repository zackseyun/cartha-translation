  text: ⸂ἀλλ’ εὐθὺς ἀκούσασα⸃ γυνὴ περὶ αὐτοῦ, ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον, ἐλθοῦσα προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/025.yaml
  text: But immediately a woman whose little daughter had an unclean spirit[a], having heard about him[c][b], came and fell at his feet.
translation:
  language: ig
  text: Ma ozugbo otu nwanyị—nwa ya nwanyị nta[a] nwere mmụọ na-adịghị ọcha[b]—nụrụ akụkọ banyere ya[c], ọ bịara daa n’ụkwụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “obere nwa agbọghọ ya.” Okwu Grik θυγάτριον bụ ụdị mbelata nke okwu pụtara “nwa nwanyị.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “mmụọ rụrụ arụ”; a na-aghọtakarịkwa ya dịka mmụọ ọjọọ.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “Ma otu nwanyị—nwa ya nwanyị nta nwere mmụọ na-adịghị ọcha—nụrụ akụkọ banyere ya, ozugbo ahụ ọ bịara daa n’ụkwụ ya.”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: “Ma” na-egosipụta ntụgharị dị nro n’akụkọ ahụ ma na-ejikọta amaokwu a na ihe bu ya ụzọ.
- source_word: εὐθὺς
  choice: ozugbo
  rationale: “Ozugbo” na-echekwa ngwa ngwa e ji mara usoro akụkọ Mak, ma ọ dabara nke ọma n’Igbo oge a.
- source_word: ἀκούσασα ... περὶ αὐτοῦ
  choice: ọ nụrụ akụkọ banyere ya
  rationale: Nkebi a na-ekwu na nwanyị ahụ nụrụ ozi ma ọ bụ akụkọ gbasara Jizọs; “nụrụ akụkọ banyere ya” bụ okwu Igbo doro anya ma bụrụ nke e ji eme ihe.
- source_word: γυνὴ
  choice: otu nwanyị
  rationale: Aha ahụ enweghị edemede na Grik ma na-ewebata nwanyị ahụ ọhụrụ n’akụkọ; “otu nwanyị” na-arụ ọrụ a n’Igbo.
- source_word: θυγάτριον
  choice: obere nwa ya nwanyị
  rationale: Ụdị okwu Grik a bụ diminutive nke “nwa nwanyị”; ntụgharị a na-egosi ma mmekọrịta ezinụlọ ma echiche na ọ bụ obere nwa.
- source_word: πνεῦμα ἀκάθαρτον
  choice: mmụọ na-adịghị ọcha
  rationale: Nke a na-echekwa okwu Mak kpọmkwem na njikọ ya na echiche nke adịghị ọcha, kama iji “mmụọ ọjọọ” ma ọ bụ “mmụọ demon” kọwaa ya karịa ihe ederede kwuru.
- source_word: ἐλθοῦσα
  choice: bịara
  rationale: “Bịara” na-egosi mmegharị nwanyị ahụ bịakwutere Jizọs n’ụzọ dị mfe ma kwekọọ n’usoro akụkọ.
- source_word: προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: daa n’ụkwụ ya
  rationale: Okwu a na-echekwa ihe oyiyi nke nwanyị ahụ dara n’ụkwụ Jizọs n’arịrịọ na ịdị umeala n’obi, n’enweghị ịkọwa ọnọdụ ahụ karịa Grik.
theological_decisions:
- issue: Ntụgharị πνεῦμα ἀκάθαρτον
  choice: mmụọ na-adịghị ọcha
  alternative: mmụọ rụrụ arụ; mmụọ ọjọọ
  rationale: A họọrọ ntụgharị nke na-esochi okwu Grik anya ma na-echekwa okwu Mak na-eji ugboro ugboro. “Mmụọ ọjọọ” nwere ike ịkọwa onye a na-ekwu maka ya, ma ọ naghị egosipụta akụkụ “adịghị ọcha” dị n’okwu Grik kpọmkwem.
- issue: Ihe εὐθὺς (“ozugbo”) na-akọwa
  choice: e tinyere ya na ịnụ akụkọ ahụ n’ahịrịokwu bụ isi
  alternative: enwere ike ịghọta ya dị ka ngwa ngwa o ji bịa mgbe ọ nụrụ akụkọ ahụ
  rationale: Usoro okwu Grik jikọtara εὐθὺς na participle ἀκούσασα nke ukwuu, ma n’usoro akụkọ, ọ pụkwara igosi nzaghachi ngwa ngwa nwanyị ahụ mere. Ihe odide na nkọwa ala peeji na-ahapụ esemokwu a ka ọ dị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe ngwa ngwa nke akụkọ Mak, okwu ezinụlọ dị na θυγάτριον, na okwu “mmụọ na-adịghị ọcha” n’enweghị itinye nkọwa ụka pụrụ iche.
