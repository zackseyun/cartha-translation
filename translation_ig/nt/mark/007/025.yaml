    issue: The relative pronoun “onye” is unsuitable in “otu nwanyị, onye obere nwa ya nwanyị nwere…”.
    rationale: “Onye” ordinarily refers to a person and does not naturally express the possessive relative sense “whose” here. A parenthetical clause avoids ambiguity and reads idiomatically.
