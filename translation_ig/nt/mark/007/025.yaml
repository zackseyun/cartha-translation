    issue: Footnote anchor [a] is placed after “mmụọ na-adịghị ọcha” rather than after the rendering of θυγάτριον.
    rationale: Footnote [a] concerns “little daughter/little girl,” while [b] concerns “unclean spirit.” The anchors should directly follow the relevant terms.
