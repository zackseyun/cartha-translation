source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: ig
  text: Ntị ya wee meghee[a], ihe e ji kee ire ya wee tọpụ[b], o wee kwuo okwu nke ọma[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikike ya ịnụ ihe meghere.” Okwu Grik ahụ nwere ike ịpụta ntị ma ọ bụ ikike ịnụ ihe.
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “ihe e ji kee ire ya wee tọpụ”; ya bụ, ihe na-egbochi ya ikwu okwu akwụsịla.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n'ụzọ ziri ezi” ma ọ bụ “n'ụzọ doro anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: wee meghee
  rationale: Na-egosipụta aorist passive nke ἀνοίγω n'usoro akụkọ Igbo dị mfe, na-egosi na mmeghe ahụ mere ozugbo.
- source_word: αἱ ἀκοαί
  choice: Ntị ya
  rationale: ἀκοαί nwere ike ịpụta akụkụ ahụ bụ ntị ma ọ bụ ikike ịnụ ihe; “ntị ya” bụ okwu Igbo ebumpụta ụwa ma na-edobe ihe oyiyi doro anya nke ihe odide Grik.
- source_word: ἐλύθη
  choice: wee tọpụ
  rationale: Aorist passive nke λύω pụtara na ihe na-egbochi ya tọpụla; okwu a na-edobe ihe oyiyi nke ihe e kere eke ma ọ bụ e kekọrọ eke.
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: ihe kekọrọ ire ya
  rationale: δεσμός bụ ihe nkekọ ma ọ bụ ihe mgbochi. Nsụgharị a na-edobe ihe atụ ahụ n'Igbo a na-aghọta, n'ejighị okwu ọgwụ kọwaa ya karịa ka isi mmalite si kwuo.
- source_word: ἐλάλει
  choice: o wee kwuo okwu
  rationale: Na-enye imperfect ἐλάλει n'ụzọ akụkọ Igbo dị mma, na-enweghị ịgbakwunye echiche “ọ malitere” nke ngwaa ahụ ekwughị kpọmkwem.
- source_word: ὀρθῶς
  choice: nke ọma
  rationale: N'ọnọdụ ọgwụgwọ okwu, ὀρθῶς na-egosi ikwu okwu n'ụzọ ziri ezi na nke a na-aghọta; “nke ọma” bụ okwu Igbo nkịtị nke na-ezere ime ka ọ bụrụ naanị izi ezi n'ụtọasụsụ.
theological_decisions:
- issue: Ma a ga-edobe ihe atụ banyere ihe kekọrọ ire ya, ka a kọwaa ya ozugbo dị ka nsogbu ikwu okwu
  choice: 'E debere ihe atụ ahụ: “ihe kekọrọ ire ya wee tọpụ.”'
  alternative: “E wepụrụ nsogbu ikwu okwu ya” ma ọ bụ “ire ya nweere onwe ya.”
  rationale: Grik ji ihe oyiyi nkekọ kọwaa ọgwụgwọ ebube ahụ. Idebe ya na-egbochi nsụgharị ahụ ịkọwa karịa ihe odide ahụ, ma ọ ka na-eme ka ihe mere doo anya.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe ma dị ugwu. E ji usoro “wee” mee ka njikọ atọ nke καὶ na usoro akụkọ pụta nke ọma, ma e debere ihe atụ Grik banyere ire e kekọrọ eke.
