    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “ihe e ji kee ire ya wee tọpụ”; ya bụ, ihe na-egbochi ya ikwu okwu akwụsịla.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n'ụzọ ziri ezi” ma ọ bụ “n'ụzọ doro anya.”
    reason: lexical_alternative
