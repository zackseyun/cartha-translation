- from: Mgbe ọ laruru n'ụlọ ya, ọ hụrụ nwata ahụ ka o dina n'elu ihe ndina, mmụọ ọjọọ ahụ apụwokwa[a].
  to: Mgbe ọ gara n’ụlọ ya, ọ hụrụ nwata ahụ ka o dina n’elu ihe ndina, na mmụọ ọjọọ ahụ apụla[a].
  rationale: The revision removes the unwarranted arrival sense, renders the perfect participle with the natural resultative form “apụla,” and places the retained lexical-alternative note at its proper referent. It preserves the source’s sequence and avoids specifying the child as female within this verse.
