  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: ig
  text: Mgbe ọ gara n’ụlọ ya, ọ hụrụ nwata ahụ ka o dina n’elu ihe ndina, na mmụọ ọjọọ ahụ apụla[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N''ụzọ ọzọ, nke na-esochi okwu Grik anya karịa: “mmụọ ọjọọ ahụ esiwo pụọ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς
  choice: Mgbe ọ laruru n'ụlọ ya
  rationale: Aorist participle ahụ na-egosi ihe mere tupu εὗρεν. “Mgbe ọ laruru” na-enye usoro ahụ n'Igbo dị mma; “n'ụlọ ya” na-edobe na ọ bụ ebe obibi ya.
- source_word: εὗρεν
  choice: ọ hụrụ
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka εὑρίσκω n'akụkọ.
- source_word: παιδίον
  choice: nwata ahụ
  rationale: παιδίον pụtara nwata; amaokwu a n'onwe ya ekwughị kpọmkwem “nwa nwanyị,” ọ bụ ezie na ihe ndị gbara ya gburugburu na-egosi nke ahụ.
- source_word: βεβλημένον ἐπὶ τὴν κλίνην
  choice: ka o dina n'elu ihe ndina
  rationale: Perfect passive participle ahụ na-akọ ọnọdụ nwata ahụ nọ na ya. “Ka o dina” bụ Igbo ebumpụta ụwa nke na-ezere itinye echiche na a tụbara ya n'ike; “n'elu ihe ndina” na-egosipụta ἐπί na κλίνη nke ọma.
- source_word: δαιμόνιον
  choice: mmụọ ọjọọ ahụ
  rationale: “Mmụọ ọjọọ” bụ okwu Standard Igbo doro anya maka δαιμόνιον ma ghara ịgbanwe ya ka ọ bụrụ naanị aha ọzọ e ji kpọọ mmụọ na-adịghị ọcha.
- source_word: ἐξεληλυθός
  choice: apụwokwa
  rationale: Perfect participle ahụ na-egosi na ọpụpụ ahụ emezuola, ọnọdụ nke fọdụrụ abụrụ na mmụọ ahụ anọkwaghị ebe ahụ. “Apụwokwa” na-ejide ma usoro okwu καί ma nsonaazụ ahụ.
theological_decisions:
- issue: Nsonaazụ nchụpụ mmụọ ọjọọ ahụ
  choice: mmụọ ọjọọ ahụ apụwokwa
  alternative: mmụọ ọjọọ ahụ esiwo n'ime ya pụọ
  rationale: Nhọrọ bụ isi na-edobe nkwupụta nke ederede na mmụọ ọjọọ ahụ apụla, n'etinyeghị nkọwa ọzọ. Nhọrọ dị n'ala peeji na-eme ka echiche “ịpụ n'ime” nke ἐξέρχομαι pụta ìhè.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A họọrọ “ihe ndina” kama okwu mbinye, ma debe ahịrịokwu ahụ dịka akụkọ dị mfe na-aga n'ihu.
