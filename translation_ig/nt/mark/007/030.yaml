review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies the child, her position on the bed, and the completed departure of the demon. However, “laruru” means ‘arrived/reached’ and therefore translates an arrival not stated by ἀπελθοῦσα (‘having gone away/departed’). “apụwokwa” is less precise here: -kwa commonly carries an additive sense (‘also’), whereas the Greek καί simply coordinates the two findings; it also does not clearly express the perfect-result sense as naturally as “apụla.”'
  naturalness: The revised wording is clear, modern Standard Igbo narrative prose. “Mgbe ọ gara n’ụlọ ya” is idiomatic, while “na mmụọ ọjọọ ahụ apụla” gives a smooth coordinated result clause. “Ka o dina n’elu ihe ndina” remains natural and does not introduce the potentially misleading notion that the child was violently thrown there.
  terminology: “Nwata ahụ” appropriately preserves the non-specific παιδίον rather than making the verse itself say ‘daughter’ or ‘girl.’ “Mmụọ ọjọọ” is an established, understandable rendering for δαιμόνιον. The note is retained as a lexical/formal alternative and its anchor is moved to the expression it explains.
  issues:
  - severity: medium
    issue: “laruru” adds arrival
    rationale: The Greek participle ἀπελθοῦσα describes departure/going away, not arrival. Although arrival at the house is pragmatically implied, it should not replace the source action in an optimal-equivalence rendering.
  - severity: medium
    issue: “apụwokwa” is ambiguous and adds an additive nuance
    rationale: The suffix -kwa commonly means ‘also/too’; it is not needed to render καί here. “apụla” naturally conveys the completed, presently effective departure expressed by ἐξεληλυθός.
  - severity: low
    issue: Footnote anchor placement
    rationale: The existing footnote explains the demon’s departure, not the bed; it should be attached to “apụla.”
  revised_text: Mgbe ọ gara n’ụlọ ya, ọ hụrụ nwata ahụ ka o dina n’elu ihe ndina, na mmụọ ọjọọ ahụ apụla[a].
  revised_footnotes:
  - marker: a
    text: 'N''ụzọ ọzọ, nke na-esochi okwu Grik anya karịa: “mmụọ ọjọọ ahụ esiwo pụọ.”'
    reason: lexical_alternative
  revision_rationale: The revision removes the unwarranted arrival sense, renders the perfect participle with the natural resultative form “apụla,” and places the retained lexical-alternative note at its proper referent. It preserves the source’s sequence and avoids specifying the child as female within this verse.
