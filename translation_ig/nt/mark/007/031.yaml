  rationale: The revision clarifies that Sidon is the route taken (διὰ Σιδῶνος), preserves the antecedent departure expressed by the aorist participle, and renders ἀνὰ μέσον with “site n’etiti” while retaining its disputed spatial nuance in a footnote. It also repairs the footnote's naturalness without resolving the geographical difficulty.
