  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ πάλιν ἐξελθὼν ἐκ τῶν ὁρίων Τύρου ⸂ἦλθεν διὰ Σιδῶνος εἰς⸃ τὴν θάλασσαν τῆς Γαλιλαίας ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: ig
  text: Ọzọ, mgbe o si n’ókèala Taịa pụọ, o si n’ụzọ Saịdọn bịaruo n’Oké Osimiri Galili, site n’etiti ókèala Dekapọlis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “n’agbata ókèala Dekapọlis.” Okwu Grik ἀνὰ μέσον nwere ike ịpụta “n’etiti,” “n’ime,” ma ọ bụ “n’agbata”; ụzọ njem a siri ike ịkọwa n’usoro ala.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: ọzọ
  rationale: Na-egosi na njem a bụ mmegharị ọzọ n’akụkọ ahụ; “ọzọ” bụ okwu Igbo doro anya ma dị nkenke.
- source_word: ἐξελθὼν ἐκ τῶν ὁρίων Τύρου
  choice: Ọ hapụkwara ógbè Taịa
  rationale: Aorist participle na-egosi ihe mere tupu ngwaa bụ isi; “hapụ ógbè” na-enye usoro ahụ n’Igbo eke, ebe ὅρια pụtara mpaghara ma ọ bụ ógbè, ọ bụghị naanị ahịrị oke.
- source_word: ἦλθεν διὰ Σιδῶνος εἰς
  choice: wee si Saịdọn gafee ruo
  rationale: διά tinyere genitive na-egosi ịgafe ebe ma ọ bụ isi ebe ahụ gaa; nhazi a na-egosikwa njedebe njem nke εἰς n’Igbo eke.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: n’Oké Osimiri Galili
  rationale: “Oké Osimiri Galili” bụ aha ala a maara nke ọma ma na-edobe θάλασσα dị ka “oké osimiri.”
- source_word: ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως
  choice: na-agafe n’etiti ógbè Dekapọlis
  rationale: Na-edobe echiche njem n’etiti ma ọ bụ n’ime mpaghara ahụ, n’agbanyeghị na nkọwa ụzọ njem ahụ siri ike; ὅρια bụ ógbè, ebe Δεκάπολις bụ aha mpaghara.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere aha ebe dị ka Taịa, Saịdọn, Galili, na Dekapọlis n’ụdị ntụgharị-ụda a na-amata. E tinyere naanị otu ndetu ala iji chekwaa mgbagwoju anya dị na ἀνὰ μέσον na ụzọ njem ahụ.
