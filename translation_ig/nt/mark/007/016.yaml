translation:
  language: ig
  text: Ọ bụrụ na onye ọ bụla nwere ntị ịnụ ihe, ya nụrụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a adịghị n’ihe odide Grik ndị kacha ochie (gụnyere Sinaiticus na Vaticanus, ndị nke narị afọ nke anọ) nakwa n’nsụgharị Coptic oge mbụ. Ma ọ dị n’ọtụtụ ihe odide ọdịnala Byzantine, n’ọdịnala Latin, nakwa n’ọtụtụ ihe akaebe Syriac. O yikarịrị ka ọ bụ ihe mgbakwunye ndị odegharị ihe mere n’oge ọzọ, nke na-ekwughachi otu okwu ahụ kpọmkwem dị na Mak 4:9 na 4:23.
    reason: textual_critical
lexical_decisions:
- source_word: ὦτα
  choice: ntị
  rationale: Ọ bụ akụkụ ahụ mmadụ e ji anụ ihe, ma n'ebe a a na-eji ya eme ihe atụ maka ịdị njikere ige ntị na ịghọta.
- source_word: ἀκουέτω
  choice: ya nụrụ
  rationale: Nke a na-egosipụta iwu dị na ngwaa Grik nke onye nke atọ, otu onye, ma na-edobe njikọ dị n'etiti ‘ịnụ ihe’ na ‘nụrụ.’
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo zuru oke, dị mfe ma dị nsọ n’ụzọ kwesịrị ekwesị. E debere ụdị onye ọ bụla n’ahịrịokwu ọnọdụ na ụdị iwu nke onye nke atọ n’enweghị itinye nkọwa okpukpe ọzọ.
