  verdict: revise
  source_fidelity: 'A chọrọ mmezi n’ahịrịokwu ikpeazụ. «ihe ọ bụla ị gaara enweta n’aka m nke ga-abara gị uru» na-atụgharị ὠφεληθῇς n’ụzọ na-adịghị kpọmkwem: ọ na-ekwu maka ihe a natara ma tinye nkọwa ọzọ «nke ga-abara gị uru». Grik ahụ na-ekwu maka uru ma ọ bụ enyemaka nne ma ọ bụ nna ga-erite n’aka onye ahụ. «ihe ọ bụla ị gaara erite n’aka m» na-edobe echiche a na nkwekọrịta nwere ike ime nke ọma karịa.'
  naturalness: «Ọ bụrụ na mmadụ agwa nna ya ma ọ bụ nne ya sị» bụ usoro Igbo Izugbe nke eke karịa «Ọ bụrụ na mmadụ asị nna ya ...». A na-edobe onye nke abụọ n’otu onye («ị/gị») n’ihi na nne ma ọ bụ nna ọ bụla bụ onye a na-agwa okwu n’otu n’otu.
  terminology: «Kọban» kwesịrị ịdịgide, ebe Mak n’onwe ya debere okwu mbinye Semitik a ma kọwaa ya dịka «onyinye». «Onyinye» bụ ntụgharị kwesịrị ekwesị maka δῶρον; nkọwa ala peeji na-enye nkọwa omenala n’ebughị n’amaokwu isi nkọwa karịa ihe Grik kwuru.
  issues:
