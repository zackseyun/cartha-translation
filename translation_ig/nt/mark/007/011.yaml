  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: ig
  text: Ma unu na-ekwu, ‘Ọ bụrụ na mmadụ agwa nna ya ma ọ bụ nne ya sị, “Kọban”[a] (ya bụ, onyinye[b]), ihe ọ bụla ị gaara erite n’aka m—’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kọban bụ okwu e ji akọwa ihe e doro nye Chineke dịka onyinye, nke a na-agaghịzi eji eme ihe ndị ezinụlọ na-ejikarị ya eme.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “onyinye e nyere Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Ma unu na-ekwu
  rationale: “Ma” na-egosi ọdịiche dị n’etiti iwu Chineke a kpọtụrụ aha na mbụ na ihe ha na-ekwu; “unu na-ekwu” na-edobe ngwaa ahụ n’oge ugbu a.
- source_word: Ἐὰν εἴπῃ
  choice: Ọ bụrụ na ... asị
  rationale: Nke a na-egosipụta ọnọdụ nwere ike ime n’ụzọ Igbo dị mfe ma bụrụkwa ihe kwekọrọ na ἐὰν tinyere ngwaa subjunctive.
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: N’ebe a, okwu Grik ahụ na-anọchi anya onye ọ bụla n’otu onye; “mmadụ” bụ okwu Igbo ebumpụta ụwa ma ọ naghị etinye okike nwoke ebe ebumnobi ahụ bụ nke nnọchianya.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: nna ya ma ọ bụ nne ya
  rationale: Nke a na-edobe ndị a na-agwa okwu abụọ ahụ na mmekọrịta ezinụlọ ha n’ụzọ doro anya.
- source_word: Κορβᾶν
  choice: Kọban
  rationale: E debere okwu Semitik ahụ nke ederede Grik n’onwe ya debere, ma dee ya n’ụzọ dabara n’ọdịdị mkpụrụokwu Igbo; nkọwa ya sochiri dịka ọ dị na Mak.
- source_word: ὅ ἐστιν Δῶρον
  choice: ya bụ, onyinye
  rationale: “Onyinye” bụ ezigbo nkọwa nkịtị nke δῶρον; ihe gbara amaokwu ahụ gburugburu na nkọwa ala peeji na-eme ka o doo anya na ọ bụ onyinye e nyefere Chineke.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: ihe ọ bụla ị gaara enweta n’aka m nke ga-abara gị uru
  rationale: Nke a na-edobe echiche nke ihe ọ bụla nne ma ọ bụ nna ahụ gaara enweta n’aka nwa ya dị ka enyemaka ma ọ bụ uru, n’ebughị ụzọ kpebie kpọmkwem ụdị enyemaka ahụ. Akara ogologo na-egosi na ahịrịokwu ahụ ga-aga n’ihu n’amaokwu nke 12.
theological_decisions:
- issue: Otu e si asụgharị usoro okwu nkwa Κορβᾶν n’ihe gbasara ihe e nyefere Chineke na ọdịnala mmadụ
  choice: Idobe “Kọban” n’ahụ amaokwu ma kọwaa ya dịka “ya bụ, onyinye.”
  alternative: Ịsụgharị ya ozugbo dịka “onyinye e nyere Chineke” ma ọ bụ “ihe e ji achụ àjà.”
  rationale: Ederede Grik n’onwe ya debere okwu Semitik ahụ ma nyezie nkọwa ya. Idobe ya na-echekwa ọnọdụ akụkọ ihe mere eme na nke okpukpe n’ebughị n’ime amaokwu nkọwa karịrị ihe ederede ahụ kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere nhazi okwu a na-agwụbeghị agwụ site n’akara ogologo n’ihi na amaokwu nke 12 na-emezu echiche ahụ.
