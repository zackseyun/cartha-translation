id: MRK.7.37
reference: Mark 7:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὑπερπερισσῶς ἐξεπλήσσοντο λέγοντες· Καλῶς πάντα πεποίηκεν, καὶ τοὺς κωφοὺς ποιεῖ ἀκούειν ⸀καὶ ἀλάλους λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: ig
  text: O juru ha anya nke ukwuu, ha na-asị, “O meela ihe niile nke ọma.[a] Ọ na-emekwa ka ndị ntị chiri nụ ihe, ndị na-enweghị ike ikwu okwu kwuo okwu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ihe niile” dịka “ihe ọ bụla.” Okwu a nwere ike na-echetara asụsụ Akwụkwọ Nsọ banyere ịdị mma nke ọrụ Chineke.
    reason: lexical_alternative
  - marker: b
    text: Okwu a na-echetara Aịzaya 35:5–6, ebe ndị ntị chiri ga-anụ ihe, ndị na-enweghị ike ikwu okwu ekwukwa okwu mgbe Chineke na-eweta mweghachi.
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς
  choice: nke ukwuu
  rationale: Nke a na-egosi oke ịdị ukwuu nke ihe ahụ tụrụ ha n’anya n’ụzọ Igbo nke dị mfe ma dị ike.
- source_word: ἐξεπλήσσοντο
  choice: O juru ha anya
  rationale: Nkebiokwu a bụ ụzọ Igbo nkịtị si akọ na mmadụ nọ n’ọnọdụ oke ịtụnanya; imperfect Grik na-egosi mmeghachi omume ha na-aga n’ihu n’oge ahụ.
- source_word: λέγοντες
  choice: ha na-asị
  rationale: Ọ na-ewebata okwu ha kwuru ma na-edobe mmetụta nke participle nke na-eso mmeghachi omume ha.
- source_word: Καλῶς
  choice: nke ọma
  rationale: Ọ na-akọwa ịdị mma nke ihe Jizọs mere, n’ejighị okwu nke ga-amanye nkọwa ọzọ n’elu ederede ahụ.
- source_word: πάντα
  choice: ihe niile
  rationale: Ọ na-edobe oke okwu ahụ n’ozuzu ya ma bụrụkwa okwu Igbo a na-aghọta ngwa ngwa.
- source_word: πεποίηκεν
  choice: O meela
  rationale: Ụdị perfect Grik na-egosi ihe e mezuru nke uru ya ka dị ugbu a; perfect Igbo a na-egosipụta nke ahụ nke ọma.
- source_word: κωφοὺς
  choice: ndị ntị chiri
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-adịghị anụ ihe n’ọnọdụ ọgwụgwọ a.
- source_word: ποιεῖ ἀκούειν
  choice: na-eme ka ... nụ ihe
  rationale: Ọ na-edobe echiche causative nke ποιέω na infinitive n’ụzọ Igbo sitere n’okike.
- source_word: ἀλάλους
  choice: ndị ogbi
  rationale: Ọ bụ okwu Igbo dị nkenke ma doo anya maka ndị na-apụghị ikwu okwu.
- source_word: λαλεῖν
  choice: kwuo okwu
  rationale: Ọ na-enye echiche nkịtị nke ikwu okwu ma kwekọọ na nkọwa ọgwụgwọ ahụ.
- source_word: καὶ
  choice: na-emekwa ... ekwuokwa
  rationale: Njikọ ndị a na-egosi na ọ na-eme ihe abụọ ahụ—ime ka ndị ntị chiri nụ na ime ka ndị ogbi kwuo—ma na-ebute ntakịrị mmetụta mgbakwunye dị na Grik.
theological_decisions:
- issue: Okwu a nwere ike na-echetara Aịzaya 35:5–6 nakwa asụsụ Akwụkwọ Nsọ banyere ịdị mma nke ọrụ Chineke.
  choice: E debere okwu ìgwè mmadụ ahụ n’ụzọ kwụ ọtọ n’ime amaokwu ahụ, ebe nkọwa ala peeji na-egosi njikọ Akwụkwọ Nsọ ahụ.
  alternative: A gaara eji asụsụ siri ike karị mee ka njikọ ahụ pụta ìhè n’amaokwu n’onwe ya.
  rationale: Ederede Grik na-enye ohere ka ndị na-agụ ya nụ ụda Akwụkwọ Nsọ ndị ahụ, ma ọ naghị ekwu njikọ ahụ kpọmkwem; ya mere nsụgharị ahụ anaghị amanye otu nkọwa.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “ndị ntị chiri” na “ndị ogbi” maka nkọwa doro anya na nhazi yiri ibe ya; a zere itinye nkọwa ụka pụrụ iche n’ime ederede.
