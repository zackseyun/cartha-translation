revisions:
- from: O juru ha anya nke ukwuu, ha na-asị, “O meela ihe niile nke ọma.[a] Ọ na-emekwa ka ndị ntị chiri nụ ihe, ndị ogbi ekwuokwa okwu.”[b]
  to: O juru ha anya nke ukwuu, ha na-asị, “O meela ihe niile nke ọma.[a] Ọ na-emekwa ka ndị ntị chiri nụ ihe, ndị na-enweghị ike ikwu okwu kwuo okwu.”[b]
  rationale: The revision replaces the ambiguous ndị ogbi with ndị na-enweghị ike ikwu okwu, preserving the Greek distinction between deafness and inability to speak. It also revises footnote a so that it offers a real lexical alternative rather than repeating the main text verbatim. No doctrinal implication is added, and the Isaiah resonance remains confined to the footnote.
