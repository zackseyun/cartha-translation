id: MRK.7.12
reference: Mark 7:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀οὐκέτι ἀφίετε αὐτὸν οὐδὲν ποιῆσαι τῷ ⸀πατρὶ ἢ τῇ ⸀μητρί,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/012.yaml
  text: you no longer allow him to do anything for his father or mother,[a]
translation:
  language: ig
  text: unu anaghịkwa ekwe ka o meere nna ya ma ọ bụ nne ya ihe ọ bụla.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mee ihe ọ bụla iji nyere nna ya ma ọ bụ nne ya aka.” Okwu Grik a sara mbara nwere ike ịgụnye inyere ha aka n'ihe ha chọrọ ma ọ bụ inye ha ego n'ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: anaghịkwa
  rationale: N'ọnọdụ a, njikọ ‘anaghịkwa’ na-egosi na ha kwụsịrị ikwe ihe ha gaara ekwe na mbụ; ọ na-eburu echiche ‘ọ bụghịzi’ n'Igbo dị eke.
- source_word: ἀφίετε
  choice: ekwe ka
  rationale: N'ebe a ἀφίημι pụtara ikwe ka mmadụ mee ihe, ọ bụghị ‘ịgbaghara’ ma ọ bụ ‘ịhapụ.’
- source_word: αὐτὸν
  choice: o
  rationale: Nnochiaha onye nke atọ na-ezo aka n'onye ahụ nwere ihe ọ gaara eji nyere nne na nna ya aka.
- source_word: οὐδὲν ποιῆσαι
  choice: meere ... ihe ọ bụla
  rationale: N'usoro ahịrịokwu a, nkwuwa okwu Grik na-egosi na a naghị ekwe ka o mee ihe ọbụla; Igbo na-etinye ‘ihe ọ bụla’ n'ụzọ dị eke mgbe ngwaa ahụ gasịrị.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: nna ya ma ọ bụ nne ya
  rationale: Ndị dative a na-egosi ndị a na-emere ihe maka uru ha. ‘Ya’ na-eme ka o doo anya n'Igbo na ndị a bụ nne na nna onye ahụ, ebe ‘ma ọ bụ’ na-echekwa ἢ.
theological_decisions:
- issue: Ma a ga-eme ka enyemaka ego ma ọ bụ ihe e ji akwado nne na nna pụta ìhè n'ihi ihe gbasara Kọban gbara amaokwu a gburugburu
  choice: 'E debe okwu sara mbara: ‘meere nna ya ma ọ bụ nne ya ihe ọ bụla’'
  alternative: ‘mee ihe ọ bụla iji nyere nna ya ma ọ bụ nne ya aka’
  rationale: Okwu Grik n'onwe ya sara mbara ma na-ekwu ime ihe ọ bụla nye nne ma ọ bụ nna maka uru ha. Ọnọdụ gbara ya gburugburu na-egosi enyemaka bara uru ma ọ bụ nke ego, ma amaokwu a akọwaghị ya kpọmkwem; ya mere, e kwesịghị ime ka ntụgharị ahụ dị warara karịa isi mmalite.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. ‘Unu’ na-echekwa onye nke abụọ ọtụtụ nke ἀφίετε; ‘anaghịkwa’ na-enye echiche nkwụsị nke οὐκέτι n'ụzọ Igbo dị eke.
