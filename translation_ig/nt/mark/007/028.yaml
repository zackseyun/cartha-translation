  text: ἡ δὲ ἀπεκρίθη καὶ λέγει αὐτῷ· ⸀Κύριε, ⸀καὶ τὰ κυνάρια ὑποκάτω τῆς τραπέζης ⸀ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: ig
  text: Ma nwanyị ahụ zara ya, sị, “Onyenweanyị[a], ọbụna ụmụ nkịta[b] ndị nọ n'okpuru tebụl na-eri ụfọdụ n'ime iberibe nri ụmụaka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nna ukwu.” Okwu Grik bụ κύριε; a pụrụ iji ya kpọọ mmadụ n'ụzọ nkwanye ùgwù, ma ọ bụ jiri ya dị ka aha “Onyenweanyị.”
    reason: alternative_reading
  - marker: b
    text: Okwu Grik a na-ezo aka n'obere nkịta ma ọ bụ nkịta a na-azụ n'ụlọ; “ụmụ nkịta” na-edobe echiche nke ịdị nta dị n'okwu ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει
  choice: zara ya, sị
  rationale: Nke a bụ ụzọ Igbo si akọwa nzaghachi sochiri okwu ọnụ n'ụzọ ebumpụta ụwa; ọ na-edobe ihe ἀπεκρίθη na λέγει pụtara n'agbanyeghị na λέγει dị na historical present.
- source_word: Κύριε
  choice: Onyenweanyị
  rationale: Aha a na-edobe nsọpụrụ na ibu aha κύριος mgbe a na-agwa Jizọs okwu; ihe odide ala peeji na-egosi na n'ọnọdụ a ọ pụkwara ịbụ naanị okwu nkwanye ùgwù.
- source_word: καὶ
  choice: ọbụna
  rationale: 'N''ebe a καί na-agbakwụnye echiche nwanyị ahụ n''ụzọ siri ike: ụmụ nkịta kwa na-enweta ihe. “Ọbụna” na-egosipụta nke a nke ọma.'
- source_word: κυνάρια
  choice: ụmụ nkịta
  rationale: Ụdị okwu Grik a bụ diminutive ma nwee ike ịpụta obere nkịta ma ọ bụ nkịta a na-azụ n'ụlọ; “ụmụ nkịta” na-edobe echiche nke ịdị nta n'Igbo na-enweghị ịgbanwe ya ka ọ bụrụ naanị nwa nkịta.
- source_word: ὑποκάτω τῆς τραπέζης
  choice: ndị nọ n'okpuru tebụl
  rationale: Nke a na-egosipụta ọnọdụ ahụ kpọmkwem n'Igbo doro anya.
- source_word: ἐσθίουσιν
  choice: na-eri
  rationale: Present tense a na-ekwu maka ihe a na-emekarị; “na-eri” dabara n'okwu atụ a.
- source_word: ἀπὸ τῶν ψιχίων
  choice: iberibe nri
  rationale: ψιχίων bụ obere iberibe ma ọ bụ crumbs. “Iberibe nri” bụ okwu Igbo nkịtị ma ghara ịgbakwunye na ha dara n'ala, nke isi mmalite ekwughị kpọmkwem.
- source_word: τῶν παιδίων
  choice: ụmụaka
  rationale: Genitive a na-ejikọta iberibe nri ahụ na ụmụaka; usoro “iberibe nri ụmụaka” na-eme nke ahụ n'ụzọ dị mkpirikpi ma doo anya.
theological_decisions:
- issue: Otu e si sụgharị κύριος mgbe nwanyị ahụ na-agwa Jizọs okwu
  choice: Onyenweanyị
  alternative: Nna anyị ukwu / onye nwe m (okwu nkwanye ùgwù dịka “Sir”)
  rationale: “Onyenweanyị” na-edobe aha κύριος dịka a na-ejikarị ya eme ihe banyere Jizọs, ma ihe odide ala peeji na-echekwa nghọta ọzọ nke okwu nkwanye ùgwù nke ọnọdụ a kwere.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu a na-asụkarị n'Igbo, ebe a na-edobe ntụnyere tebụl, ụmụaka, na ụmụ nkịta n'enweghị nkọwa agbakwunyere. E tinyere akara [a] n'akụkụ “Onyenweanyị” na [b] n'akụkụ “ụmụ nkịta” ka ha kwekọọ kpọmkwem n'ihe odide ala peeji ha.
