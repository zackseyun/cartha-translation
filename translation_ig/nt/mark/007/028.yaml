revisions:
- from: Ma nwanyị ahụ zara ya, sị, “Onyenweanyị[a], ọbụna ụmụ nkịta[b] ndị nọ n'okpuru tebụl na-eri iberibe nri ụmụaka.”
  to: Ma nwanyị ahụ zara ya, sị, “Onyenweanyị[a], ọbụna ụmụ nkịta[b] ndị nọ n'okpuru tebụl na-eri ụfọdụ n'ime iberibe nri ụmụaka.”
  rationale: The revision explicitly conveys the partitive sense of ἀπό while preserving the concise proverbial force of the saying. It also corrects the alternative address in footnote a without altering the main-text rendering or imposing a theological interpretation.
