  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀναβλέψας εἰς τὸν οὐρανὸν ἐστέναξεν, καὶ λέγει αὐτῷ· Εφφαθα, ὅ ἐστιν Διανοίχθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: ig
  text: O weliri anya ya n’eluigwe, sụọ ude[a], wee sị ya, “Efata”[b]—nke pụtara, “Ka e meghee gị!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “sụọ ude nke ukwuu”; ngwaa Grik a nwere ike igosi ude miri emi ma ọ bụ ịsụ ude n’ahụhụ.
    reason: lexical_alternative
  - marker: b
    text: “Efata” bụ okwu Arameik nke pụtara “Ka e meghee gị!”
    reason: cultural_note
lexical_decisions:
- source_word: ἀναβλέψας
  choice: leliri anya n’eluigwe
  rationale: Nke a na-egosi na o weliri anya ya lee n’elu; usoro a bụ Igbo nkịtị ma na-edobe omume nke mere tupu okwu ahụ.
- source_word: εἰς τὸν οὐρανόν
  choice: n’eluigwe
  rationale: N’ọnọdụ a, οὐρανός na-arụtụ aka n’eluigwe, ọ bụghị naanị mbara elu, n’ihi omume Jizọs nke yiri nke ekpere.
- source_word: ἐστέναξεν
  choice: sụọ ude
  rationale: στενάζω nwere ike ịpụta ịsụ ude ma ọ bụ ịsụ ude nke ukwuu dịka onye na-asụ ude n’ahụhụ. ‘Sụọ ude’ bụ okwu Igbo doro anya nke na-adịghị etinye ike mmetụta karịrị nke Grik kwuru.
- source_word: λέγει αὐτῷ
  choice: wee sị ya
  rationale: Ọ bụ ezie na Grik ji oge dị ugbu a n’akụkọ ihe mere eme, oge gara aga na njikọ ‘wee’ na-eme ka akụkọ ahụ gaa were were n’Igbo ma na-edobe onye a gwara okwu.
- source_word: Εφφαθα
  choice: Efefata
  rationale: E debere okwu Arameik ahụ dịka ụda ya si kwekọọ n’usoro edemede Igbo, ebe Mak n’onwe ya kọwara ihe ọ pụtara ozugbo.
- source_word: Διανοίχθητι
  choice: Meghee!
  rationale: Nke a bụ iwu nye otu onye ka e meghee ya. ‘Meghee!’ bụ ụzọ Igbo dị nkenke ma dị ike isi kwuo ya, ma ọ naghị akọwa kpọmkwem akụkụ ahụ a ga-emeghe.
theological_decisions:
- issue: Ihe αὐτῷ na-arụtụ aka na ya
  choice: sị ya—nwoke ahụ ntị chiri
  alternative: ịgwa ntị ya ma ọ bụ ikike ikwu okwu ya okwu n’ụzọ na-apụtaghị ìhè
  rationale: Dative Grik ahụ na-arụtụ aka n’ụzọ kacha pụta ìhè n’ebe nwoke ahụ Jizọs na-agwa okwu nọ. Nsụgharị ahụ anaghị agbanwe ya ka ọ bụrụ ịgwa akụkụ ahụ ya okwu.
- issue: Ihe iwu Διανοίχθητι metụtara
  choice: A hapụrụ iwu ahụ n’enweghị ịkpọ ntị ma ọ bụ ọnụ aha
  alternative: ‘Ka ntị gị meghee’ ma ọ bụ ‘Ka e meghee gị’
  rationale: Grik kwuru naanị ‘Meghee,’ ya mere nsụgharị ahụ na-echekwa obosara na ntakịrị mgbagwoju anya ya, kama ikpebi ma ọ bụ naanị ntị, ọnụ, ma ọ bụ ikike abụọ ahụ ka okwu ahụ metụtara.
translation_notes:
  register: 'E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. ‘Wee sị ya’ na-eme ka usoro akụkọ ahụ bụrụ ihe a na-anụkarị n’Igbo. E tinyere akara nkọwa n’ebe ihe ha na-akọwa dị: [a] n’akụkụ ‘sụọ ude,’ [b] n’akụkụ okwu Arameik ahụ.'
