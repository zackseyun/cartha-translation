- from: O leliri anya n’eluigwe, sụọ ude[a], wee sị ya, “Efefata”[b]—nke pụtara, “Meghee!”
  to: O weliri anya ya n’eluigwe, sụọ ude[a], wee sị ya, “Efata”[b]—nke pụtara, “Ka e meghee gị!”
  rationale: The revision retains the source’s ambiguity about precisely what is to be opened while restoring the passive force of Mark’s Greek gloss. It also uses a more idiomatic expression for Jesus’ upward gaze and corrects the transliteration of the Aramaic word.
