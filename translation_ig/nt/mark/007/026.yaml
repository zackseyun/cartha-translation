id: MRK.7.26
reference: Mark 7:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ἡ δὲ γυνὴ ἦν⸃ Ἑλληνίς, Συροφοινίκισσα τῷ γένει· καὶ ἠρώτα αὐτὸν ἵνα τὸ δαιμόνιον ἐκβάλῃ ἐκ τῆς θυγατρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: ig
  text: Nwanyị ahụ bụ onye Gris[a], onye Siro-Fọnisia site n’agbụrụ ya[b]. Ọ nọgidere na-arịọ ya ka ọ chụpụ mmụọ ọjọọ ahụ n’ahụ nwa ya nwanyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye mba ọzọ.” Grik kpọrọ ya “onye Gris”; n’ọnọdụ a, o yikarịrị ka okwu ahụ na-egosikwa na ọ bụghị onye Juu, nakwa na omenala Gris metụtara ya.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “onye Siro-Fọnisia n’agbụrụ”; ya bụ, o sitere n’agbụrụ Siro-Fọnisia.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: onye Gris
  rationale: Nke a na-asụgharị okwu Grik ahụ kpọmkwem dịka nwanyị onye Gris, ma nkọwa ala peeji na-egosi na n’ọnọdụ a ọ pụkwara ịpụta onye mba ọzọ na-abụghị onye Juu.
- source_word: Συροφοινίκισσα τῷ γένει
  choice: onye Siro-Fọnisia site n’agbụrụ ya
  rationale: Nkebiokwu a na-akọwa ebe agbụrụ na usoro ọmụmụ ya si; ‘site n’agbụrụ ya’ na-echekwa echiche γένος n’Igbo doro anya.
- source_word: ἠρώτα
  choice: Ọ nọgidere na-arịọ
  rationale: Ụdị imperfect na-egosi arịrịọ gara n’ihu ma ọ bụ nke e mere ugboro ugboro, ọ bụghị naanị otu arịrịọ.
- source_word: ἵνα ... ἐκβάλῃ
  choice: ka ọ chụpụ ... n’ahụ
  rationale: Nke a na-egosi ihe nwanyị ahụ rịọrọ ma na-enye ἐκβάλλω okwu Igbo kwekọrọ n’ọnọdụ ịchụ mmụọ.
- source_word: τὸ δαιμόνιον
  choice: mmụọ ọjọọ ahụ
  rationale: N’Igbo nkịtị, ‘mmụọ ọjọọ’ bụ okwu doro anya maka δαιμόνιον ma ghara ịgbanwe nkwupụta nke ederede banyere ihe karịrị ike mmadụ.
- source_word: ἐκ τῆς θυγατρὸς αὐτῆς
  choice: n’ahụ nwa ya nwanyị
  rationale: ‘N’ahụ’ bụ ụzọ Igbo si ekwu nke ọma banyere ịchụ mmụọ si n’ime mmadụ pụọ, ebe ‘nwa ya nwanyị’ na-echekwa mmekọrịta ahụ kpọmkwem.
- source_word: δὲ
  choice: ahụ
  rationale: A naghị etinye okwu mmalite dịka ‘Ugbu a’; njikọ akụkọ dị nro nke δέ na-apụta n’usoro ahịrịokwu, ebe ‘ahụ’ na-ejikọta nwanyị ahụ na onye a kpọtụrụ aha n’okwu gbara ya gburugburu.
theological_decisions:
- issue: Njirimara agbụrụ nwanyị ahụ
  choice: 'E debere nkọwa abụọ ahụ: ‘onye Gris’ na ‘onye Siro-Fọnisia site n’agbụrụ ya.’'
  alternative: ‘onye mba ọzọ, onye Siro-Fọnisia site n’ọmụmụ ya’
  rationale: Ederede Grik nyere nkọwa abụọ dị iche ma metụtara ibe ha. Nsụgharị ahụ anaghị agwakọta ha ma ọ bụ mee ka otu dochie ibe ya.
- issue: Ụdị nsogbu nwa nwanyị ahụ nwere
  choice: E kwuru na mmụọ ọjọọ ahụ ga-esi n’ahụ ya pụọ.
  alternative: ‘mmụọ na-adịghị ọcha’
  rationale: A gbasoro δαιμόνιον dị n’amaokwu a, kama iji okwu πνεῦμα ἀκάθαρτον nke na-apụta n’ebe ọzọ, ma e meghị ka nkwupụta karịrị ike mmadụ dị nro.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere ịdị iche n’etiti njirimara Gris na usoro ọmụmụ Siro-Fọnisia, ma jiri imperfect gosipụta arịrịọ gara n’ihu.
