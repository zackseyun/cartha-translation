  yaml_path: translation/nt/mark/007/036.yaml
  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: ig
  text: O wee nye ha iwu ka ha ghara ịgwa onye ọ bụla. Ma, ka ọ na-enye ha iwu ugboro ugboro, otú ahụ ka ha na-ekwusawanye ya karịa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Ka ọ na-esikwu ha ike, otú ahụ ka ha na-ekwusawanye ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο
  choice: nye ha iwu
  rationale: Nkebiokwu a na-egosi ntụziaka siri ike. “Nye ha iwu” bụ Igbo doro anya nke oge a, ma ọ naghị etinye okwu ọzọ nke ga-eme ka ike iwu ahụ karịa ihe Grik kwuru.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: ka ha ghara ịgwa onye ọ bụla
  rationale: 'Nke a na-egosipụta ihe iwu ahụ kwuru n’ụzọ Igbo si ada nke ọma: ha agaghị agwa onye ọ bụla ihe mere.'
- source_word: ὅσον ... διεστέλλετο
  choice: ka ọ na-enyekwu ha iwu ahụ
  rationale: Oge imperfect na usoro ὅσον na-egosi iwu a na-enye ugboro ugboro ma ọ bụ nke na-abawanye; usoro “ka … otú ahụ ka …” na-echekwa ntụnyere ahụ n’Igbo.
- source_word: μᾶλλον περισσότερον
  choice: otú ahụ ka ha na-ekwusakwu ya nke ukwuu
  rationale: Okwu abụọ a na-emesi mmụba ike. “Na-ekwusakwu ya nke ukwuu” na-echekwa nkwusi ike ahụ n’asụsụ Igbo a na-aghọta ngwa ngwa.
- source_word: ἐκήρυσσον
  choice: ha na-ekwusakwu ya
  rationale: κηρύσσω pụtara ikwusa ihe n’ihu ọha. “Kwụsaa” na-egosi mgbasa ozi ahụ nke ọma karịa okwu pụrụ ịpụta nanị ịgwa mmadụ ihe; “ya” na-anọchi ihe a na-aghọta site n’ọnọdụ ahụ.
theological_decisions:
- issue: Iwu Jizọs ka a ghara ịkọrọ onye ọ bụla na esemokwu dị n’etiti iwu ahụ na omume ndị mmadụ
  choice: A sụgharịrị ya dịka iwu n’ezie, ma hapụkwara mmegide ndị mmadụ megide ya ka ọ dị n’amaokwu ahụ.
  alternative: Ịsụgharị ya dịka “ọ dọrọ ha aka ná ntị nke ukwuu,” ma ọ bụ itinye nkọwa banyere ihe mere o ji chọọ ka ha gbaa nkịtị.
  rationale: Ihe odide ahụ kwuru iwu ahụ na mmeghachi omume ndị mmadụ, ma ọ kọwaghị ihe kpatara iwu ahụ. Ya mere, nsụgharị ahụ echekwaghị echiche okpukpe ọ bụla e tinyere n’èzí amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro “ka … otú ahụ ka …” na-eme ka njikọ ntụnyere dị n’amaokwu ahụ pụta ìhè, ebe “na-ekwusakwu” na-echekwa echiche nke nkwusa n’ihu ọha na omume na-aga n’ihu.
