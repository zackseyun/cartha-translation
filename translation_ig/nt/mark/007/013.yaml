  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: ig
  text: Unu na-eme ka okwu Chineke ghara ịdị irè site n’omenala unu, nke unu nyefere.[a][b] Unu na-emekwa ọtụtụ ihe ndị ọzọ yiri nke a.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kagbuo” ma ọ bụ “mee ka okwu Chineke ghara ịdị irè.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nke unu bufere.”
    reason: lexical_alternative
  - marker: c
    text: 'N’ụzọ dị nso karị n’okwu Grik: “ọtụtụ ihe ndị yiri nke a.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: mee ka ... ghara ịdị ire
  rationale: Nke a na-egosi ime ka okwu Chineke ghara inwe ike ma ọ bụ ikike o kwesịrị inwe; ọ bụkwa okwu Igbo doro anya ma kwekọọ n’ụdị participle nke na-aga n’ihu n’ebubo Jizọs.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: okwu Chineke
  rationale: “Okwu Chineke” bụ nsụgharị kpọmkwem na nke a na-ejikarị eme ihe maka okwu ma ọ bụ iwu sitere n’aka Chineke, ma na-edobe ọdịiche ya na omenala ha.
- source_word: τῇ παραδόσει ὑμῶν
  choice: site n’omenala unu
  rationale: “Site na” na-egosi instrumental dative—omenala ha bụ ụzọ ha si eme ka okwu Chineke ghara ịdị ire. “Omenala unu” anaghị atụkwasị “nke mmadụ” nke Grik na-ekwughị kpọmkwem.
- source_word: ᾗ παρεδώκατε
  choice: nke unu nyefere ndị ọzọ
  rationale: “Nyefere” na-ejide echiche nke ịnyefe ihe e ketara ma ọ bụ nkuzi gaa n’aka ndị ọzọ; ịgbakwunye “ndị ọzọ” na-eme ka ihe nnọchiaha a na-aghọta n’Igbo n’enweghị ịgbanwe isi echiche ya.
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: ọtụtụ ihe ndị ọzọ yiri nke a
  rationale: Nke a bụ Igbo dị larịị nke na-edobe echiche nke ọtụtụ omume ndị ọzọ yiri ihe a, na-enweghị nkwughachi na-adịghị eke.
- source_word: ποιεῖτε
  choice: Unu na-emekwa
  rationale: Ụdị a na-egosi omume ha na-eme ugboro ugboro ma ọ bụ na-aga n’ihu, dịka present indicative Grik si dị.
theological_decisions:
- issue: Ụdị omenala a na-akatọ
  choice: omenala unu
  alternative: omenala mmadụ unu
  rationale: Grik kwuru kpọmkwem “omenala unu,” ọ bụghị “omenala mmadụ.” Nsụgharị ahụ hapụrụ ọnọdụ gbara amaokwu ahụ gburugburu ka o gosi na omenala a na-emegide okwu Chineke, kama ịgbakwunye nkọwa okpukpe na-adịghị n’amaokwu ahụ.
- issue: Ike ma ọ bụ ịdị ire nke okwu Chineke
  choice: mee ka okwu Chineke ghara ịdị ire
  alternative: kagbuo okwu Chineke
  rationale: Nhọrọ a na-egosi na ha na-eme ka okwu Chineke ghara ịrụ ọrụ ma ọ bụ ijide ikike n’omume ha; ọ naghị ekwu na okwu Chineke n’onwe ya akwụsịla ịdị adị ma ọ bụ enwekwaghị ike kpamkpam.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Omenala” na “okwu Chineke” bụ okwu ndị nkịtị maara nke ọma. Ahịrịokwu abụọ ahụ na-edobe ebubo siri ike nke Grik, ebe akara nkọwa [a], [b], na [c] niile pụtara n’ederede isi.
