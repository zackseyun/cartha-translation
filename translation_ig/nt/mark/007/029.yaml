  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῇ· Διὰ τοῦτον τὸν λόγον ὕπαγε, ἐξελήλυθεν ⸂ἐκ τῆς θυγατρός σου τὸ δαιμόνιον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/029.yaml
  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: ig
  text: O wee sị ya, “N’ihi okwu a[a], laa; mmụọ ọjọọ ahụ apụla n’ahụ nwa gị nwanyị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “N’ihi ihe a i kwuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: N’ihi okwu a
  rationale: “N’ihi” na-egosipụta ihe kpatara ya dịka διά tinyere accusative si eme ebe a. “Okwu a” na-edobe λόγος n’otu mkpụrụ okwu ma na-ezo aka n’azịza nwanyị ahụ kwuru tupu nke a.
- source_word: ὕπαγε
  choice: laa
  rationale: “Laa” bụ iwu dị nkenke ma bụrụ ụzọ Igbo si ekwu ka mmadụ gawa; ọ dabara n’ọrụ ὕπαγε dị ka okwu ịhapụ onye ka ọ laa.
- source_word: ἐξελήλυθεν
  choice: esitela … pụọ
  rationale: 'Ụdị a na-egosi na ọpụpụ ahụ emechaala, ọnọdụ si na ya pụta ka dịkwa: mmụọ ọjọọ ahụ apụọla, ọ nọkwaghị n’ime nwa ahụ.'
- source_word: ἐκ τῆς θυγατρός σου
  choice: n’ahụ nwa gị nwanyị
  rationale: “N’ahụ” bụ ụzọ Igbo doro anya isi gosipụta onye mmụọ ahụ si n’ime ya pụta, ebe “nwa gị nwanyị” na-asụgharị θυγάτηρ n’enweghị mgbagwoju anya.
- source_word: τὸ δαιμόνιον
  choice: mmụọ ọjọọ ahụ
  rationale: N’Igbo a bụ okwu nkịtị, doro anya maka mmụọ ọjọọ nke na-emekpa mmadụ ahụ; ọ naghị eme ka okwu Grik ahụ bụrụ naanị ọrịa ma ọ bụ mmetụta ọjọọ.
- source_word: καὶ εἶπεν αὐτῇ
  choice: O wee sị ya
  rationale: “Wee” na-ejikọta ihe a na akụkọ bu ya ụzọ n’ụzọ Igbo dị mma, n’enweghị ịtinye nkọwa ọzọ karịa καί.
theological_decisions:
- issue: Idobe okwu gbasara ịchụ mmụọ ọjọọ dịka nkwupụta kpọmkwem
  choice: mmụọ ọjọọ ahụ esitela n’ahụ nwa gị nwanyị pụọ
  alternative: ihe ọjọọ ahụ ahapụla nwa gị nwanyị
  rationale: Grik kpọrọ δαιμόνιον aha ma kwuo na o si n’ime nwa ahụ pụta. Nsụgharị a na-edobe nkwupụta banyere mmụọ ọjọọ n’ụzọ doro anya kama ime ka ọ bụrụ naanị ọrịa ma ọ bụ ihe ọjọọ na-enweghị onye na-eme ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “O wee sị ya” na “laa” na-eme ka ahịrịokwu ahụ na-aga nke ọma n’Igbo, ebe “N’ihi okwu a” na-edobe okwu na ike kpatara ihe dị na Grik.
