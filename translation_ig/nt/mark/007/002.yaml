source:
  edition: SBLGNT
  text: καὶ ἰδόντες τινὰς τῶν μαθητῶν αὐτοῦ ⸂ὅτι κοιναῖς χερσίν, τοῦτ’ ἔστιν ἀνίπτοις, ἐσθίουσιν⸃ ⸀τοὺς ⸀ἄρτους—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/002.yaml
  text: and they saw that some of his disciples were eating the bread with defiled hands—that is[a], unwashed hands—
translation:
  language: ig
  text: Ha hụkwara na ụfọdụ n’ime ndị na-eso ụzọ ya ji aka e weere na ha rụrụ arụ[a]—ya bụ, aka a na-asaghị—na-eri achịcha—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ọ pụtara n’ụzọ nkịtị ‘aka nkịtị.’ N’ebe a, ọ na-ezo aka n’aka e weere na ha rụrụ arụ ma ọ bụ na ha adịghị ọcha n’usoro emume okpukpe, ọ bụghị naanị aka nwere unyi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Ha hụkwara
  rationale: Aorist participle a na-ejikọta ya n'ụzọ ebumpụta ụwa na ndị e kwuru okwu ha n’amaokwu bu ụzọ; ụdị ngwaa zuru ezu na Igbo na-egosi ihe ha hụrụ nke ọma.
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: ụfọdụ n’ime ndị na-eso ụzọ ya
  rationale: Nke a na-egosipụta partitive genitive ahụ n’Igbo doro anya ma bụrụkwa okwu a na-asụ taa.
- source_word: ὅτι
  choice: na
  rationale: N’ebe a, ὅτι na-ewebata ihe ha hụrụ, ọ bụghị ihe kpatara ya.
- source_word: κοιναῖς χερσίν
  choice: ji aka ndị e weere dị ka ndị rụrụ arụ
  rationale: κοινός pụtara n’ụzọ nkịtị ihe bụ ‘nke mmadụ niile’ ma ọ bụ ‘nkịtị,’ ma n’ọnọdụ iwu ịdị ọcha ndị Juu ọ na-ezo aka n’ihe e weere na ọ dịghị ọcha n’emume okpukpe. Nsụgharị a na-eme ka echiche ahụ doo onye Igbo anya n’enweghị ịtụgharị ya ka ọ bụrụ naanị unyi anụ ahụ.
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: ya bụ, aka a na-asaghị
  rationale: Nke a na-edobe nkọwa Mak nyere, ma na-ekwughachi ‘aka’ ka okwu ahụ doo anya n’Igbo.
- source_word: ἐσθίουσιν
  choice: na-eri
  rationale: Present tense ahụ na-egosi omume ha nọ na-eme mgbe a hụrụ ha; progressive Igbo dabara nke ọma.
- source_word: τοὺς ἄρτους
  choice: achịcha
  rationale: Ọ bụ ezie na ụdị Grik ahụ bụ plural ma nwee article, ‘achịcha’ bụ ụzọ Igbo ebumpụta ụwa si ekwu nri ahụ n’ozuzu ya n’ọnọdụ a.
theological_decisions:
- issue: Nkọwa ịdị ọcha dị n’okwu κοινός
  choice: N’ahịrị isi, a sụgharịrị ya ‘aka ndị e weere dị ka ndị rụrụ arụ,’ tinyekwa nkọwa ‘aka a na-asaghị.’
  alternative: aka nkịtị; aka na-adịghị ọcha
  rationale: Okwu a metụtara ọnọdụ ịdị ọcha n’usoro emume ndị Juu, ọ bụghị naanị unyi anụ ahụ. ‘Ndị e weere dị ka’ na-egosi na ọ bụ ọnọdụ e nyere aka ndị ahụ n’usoro ahụ, ebe ihe odide ahụ n’onwe ya kọwara ya dịka aka a na-asaghị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrị ahụ ka bụ akụkụ nke ahịrịokwu na-aga n’ihu, dịka dash ikpeazụ si egosi; e chekwakwara nkọwa Mak nyere n’etiti dash abụọ.
