- from: Ha hụkwara na ụfọdụ n’ime ndị na-eso ụzọ ya ji aka ndị e weere dị ka ndị rụrụ arụ[a]—ya bụ, aka a na-asaghị—na-eri achịcha.
  to: Ha hụkwara na ụfọdụ n’ime ndị na-eso ụzọ ya ji aka e weere na ha rụrụ arụ[a]—ya bụ, aka a na-asaghị—na-eri achịcha—
  rationale: 'The revision preserves the source’s open-ended final dash and smooths the Igbo relative construction. It does not alter the meaning: the hands are regarded as ritually defiled, and Mark’s explanatory gloss identifies them as unwashed.'
