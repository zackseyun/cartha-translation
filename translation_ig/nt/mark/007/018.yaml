  text: καὶ λέγει αὐτοῖς· Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε; οὐ νοεῖτε ὅτι πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον οὐ δύναται αὐτὸν κοινῶσαι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: ig
  text: O wee sị ha, “Unu onwe unu kwa, ọ̀ bụ na unu enweghị nghọta? Unu aghọtaghị na ihe ọ bụla si n’èzí banye n’ime mmadụ apụghị imetọ ya[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ime ka ọ ghara ịdị ọcha.” N’ebe a, ngwaa Grik ahụ na-ekwu banyere ịdị ọcha n’usoro ofufe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: O wee sị
  rationale: A sụgharịrị historical present ahụ n’oge gara aga ka akụkọ Igbo na-aga nke ọma, ebe ‘wee’ na-ejikọ okwu a na ihe bu ya ụzọ.
- source_word: Οὕτως καὶ ὑμεῖς
  choice: Ọ̀ bụ na unu onwe unu ka
  rationale: Nke a na-egosipụta nkwusiri ike dị na καί na ὑμεῖς, tinyere ụda ajụjụ ịbara ndị na-eso ụzọ mba.
- source_word: ἀσύνετοί
  choice: na-enweghị nghọta
  rationale: Ọ na-egosi enweghị nghọta ma ọ bụ amamihe ịghọta ihe, ma na-ejikọta nke ọma na νοεῖτε n’ajụjụ na-esochi.
- source_word: νοεῖτε
  choice: aghọtaghị
  rationale: ‘Ịghọta’ bụ okwu Igbo doro anya ma kwekọọ n’echiche ọgụgụ isi nke ngwaa ahụ n’ebe a.
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον
  choice: ihe ọ bụla si n’èzí banye
  rationale: ‘Ihe ọ bụla’ na-egosipụta nkọwa izugbe nke πᾶν na participle e ji dị ka aha; ‘si n’èzí banye’ na-edobe isi mmalite na mmegharị ahụ.
- source_word: εἰς τὸν ἄνθρωπον
  choice: n’ime mmadụ
  rationale: Ọ na-egosipụta εἰς n'ụzọ Igbo dị mma; ‘mmadụ’ na-arụ ọrụ dị ka mmadụ n’ozuzu, dịka ἄνθρωπον siri dị ebe a.
- source_word: κοινῶσαι
  choice: imerụ ya
  rationale: N’ọnọdụ a, okwu ahụ pụtara ime ka mmadụ ghara ịdị ọcha n’usoro nsọ; ‘imerụ’ bụ okwu dị mfe ma dị ugwu, ebe nkọwa ala peeji na-eme ka echiche ịdị ọcha ahụ doo anya.
theological_decisions:
- issue: Okwu ịdị ọcha dị na κοινόω
  choice: imerụ ya
  alternative: ime ka ọ ghara ịdị ọcha
  rationale: Mkparịta ụka a gbasara ịdị ọcha n’usoro okpukpe, ọ bụghị naanị mmebi omume. Isi okwu ahụ ka dị mfe ịgụ, ebe nkọwa ala peeji na-echekwa kpọmkwem echiche ịdị ọcha ahụ n’enweghị itinye nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji ‘unu onwe unu’ chekwaa nkwusiri ike nke Greek; e jikwa ‘mmadụ’ gosipụta mmadụ n’ozuzu. Ahịrịokwu ahụ kwụsịrị na rịkọm n’ihi na okwu Jizọs gara n’ihu n’amaokwu na-esote.
