    text: 'Ma ọ bụ: “ime ka ọ ghara ịdị ọcha.” N’ebe a, ngwaa Grik ahụ na-ekwu banyere ịdị ọcha n’usoro ofufe.'
    reason: lexical_alternative
  revision_rationale: The revision replaces a harm-oriented verb with a defilement-oriented one, preserving the ritual-purity sense of κοινῶσαι through an anchored lexical footnote. It also removes the unsupported temporal implication in “ka na-enweghị” and retains the Greek emphasis on the hearers with “unu onwe unu kwa.”
