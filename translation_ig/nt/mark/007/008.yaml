source:
  edition: SBLGNT
  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: ig
  text: Unu ahapụla iwu Chineke, ma unu na-ejidesi ọdịnala ụmụ mmadụ ike.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες
  choice: na-ahapụ
  rationale: Ọ na-egosi ịhapụ ma ọ bụ iwepụ iwu Chineke n'akụkụ; ntụgharị a bụ nke okike n'Igbo ma ghara ime ka okwu ahụ sie ike karịa Grik.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: iwu Chineke
  rationale: “Iwu Chineke” na-egosi nke ọma na iwu ahụ sitere n'aka Chineke ma kwekọọ n'okwu okpukpe a na-ekwu.
- source_word: κρατεῖτε
  choice: na-ejidesi ... ike
  rationale: Nke a na-egosi ịrapara n'ihe nke ọma na ịnọgide na-agbasochi ya, dịka κρατέω si pụta n'ebe a.
- source_word: τὴν παράδοσιν
  choice: ọdịnala
  rationale: “Ọdịnala” bụ okwu Igbo doro anya maka ihe e nyefere site n'aka ndị gara aga ma na-agbaso.
- source_word: τῶν ἀνθρώπων
  choice: ụmụ mmadụ
  rationale: ἀνθρώπων n'ebe a na-ezo aka n mmadụ n'ozuzu ha, ọ bụghị naanị ndị nwoke; “ụmụ mmadụ” na-edobe ọdịiche dị n'etiti ihe sitere n'aka Chineke na ihe sitere n'aka mmadụ.
theological_decisions:
- issue: Ọdịiche dị n'etiti iwu Chineke na ọdịnala mmadụ
  choice: E debere mmegide ahụ dịka “iwu Chineke” megide “ọdịnala ụmụ mmadụ.”
  alternative: “ọdịnala ndị mmadụ”
  rationale: 'Nke a na-echekwa isi ịdọ aka ná ntị Jizọs: ha na-ewepụ ihe Chineke nyere n''iwu ma na-arapara n''ihe mmadụ nyefere. Ọ naghị ekwu na ọdịnala niile dị njọ.'
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee nsọpụrụ. E ji “unu” mee ka onye nke abụọ ọtụtụ pụta ìhè; “ma” na-eme ka mmegide dị n'ahịrịokwu Grik doo anya n'Igbo, n'agbanyeghị na njikọ ahụ adịghị n'ụdị ederede Grik.
