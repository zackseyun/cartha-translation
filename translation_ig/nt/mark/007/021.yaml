id: MRK.7.21
reference: Mark 7:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔσωθεν γὰρ ἐκ τῆς καρδίας τῶν ἀνθρώπων οἱ διαλογισμοὶ οἱ κακοὶ ἐκπορεύονται, ⸂πορνεῖαι, κλοπαί, φόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: ig
  text: 'N’ihi na ọ bụ site n’ime[a], site n’obi ụmụ mmadụ, ka echiche ọjọọ si apụta: omume rụrụ arụ n’ihe gbasara mmekọahụ[b], izu ohi, igbu ọchụ,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a dị n’ụdị ọtụtụ, na-ezo aka n’omume mmekọahụ na-adịghị mma dị iche iche.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσωθεν
  choice: n’ime
  rationale: Ọ na-egosi ebe ihe si malite n’ime mmadụ ma na-echekwa ọdịiche dị n’etiti ihe dị n’ime na ihe dị n’èzí n’okwu ndị gbara amaokwu a gburugburu.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata nkọwa na-akwado ihe Jizọs kwuru tupu nke a.
- source_word: καρδίας
  choice: obi
  rationale: “Obi” bụ okwu Igbo a na-ejikarị akọwa ebe echiche, ọchịchọ, na mkpebi omume mmadụ si apụta; ọ na-echekwa ihe atụ dị n’asụsụ Grik.
- source_word: ἀνθρώπων
  choice: ụmụ mmadụ
  rationale: N’ebe a, ọtụtụ ἄνθρωπος na-ezo aka n’ụmụ mmadụ niile, ọ bụghị naanị ndị nwoke; “ụmụ mmadụ” bụ okwu Igbo doro anya ma kwekọọ n’echiche ahụ.
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: echiche ọjọọ
  rationale: Ọ na-egosi echiche na ntụgharị uche nke omume ọjọọ; okwu a bụ nke a na-aghọta ngwa ngwa n’Igbo ugbu a.
- source_word: ἐκπορεύονται
  choice: si apụta
  rationale: Ọ na-echekwa onyinyo nke ihe na-esi n’ime mmadụ pụta, bụrụkwa okwu Igbo eke.
- source_word: πορνεῖαι
  choice: omume rụrụ arụ n’ihe gbasara mmekọahụ
  rationale: Ọ na-ezo n’ụzọ sara mbara n’omume mmekọahụ na-adịghị mma, ma ghara imechi okwu Grik ahụ n’otu ụdị mmehie kpọmkwem.
- source_word: κλοπαί
  choice: izu ohi
  rationale: Nke a bụ ụzọ Igbo eke na kpọmkwem isi kwuo omume nke mmadụ ji ihe onye ọzọ n’enweghị ikike.
- source_word: φόνοι
  choice: igbu ọchụ
  rationale: Ọ na-egosi igbu mmadụ n’ụzọ iwu na omume jụrụ, karịa okwu sara mbara dịka “igbu mmadụ.”
theological_decisions:
- issue: Ihe ἀνθρώπων pụtara n’okwu a metụtara mmadụ niile
  choice: ụmụ mmadụ
  alternative: ndị mmadụ; ụmụ nwoke
  rationale: Ọ bụ ezie na ọdịdị okwu Grik ahụ bụ nke nwoke n’ụtọ asụsụ, ihe ọ pụtara ebe a bụ mmadụ niile. “Ụmụ mmadụ” na-enye echiche ahụ n’Igbo n’enweghị ịgbakwunye nkọwa okpukpe.
- issue: Otú e si tụgharị πορνεῖαι
  choice: omume rụrụ arụ n’ihe gbasara mmekọahụ
  alternative: ịkwa iko; omume mmekọahụ rụrụ arụ
  rationale: Okwu Grik ahụ bụ ọtụtụ ma na-ekpuchi ụdị omume mmekọahụ na-akwadoghị dị iche iche. Nsụgharị a na-echekwa obosara ya n’enweghị ime ka ọ bụrụ naanị otu ụdị omume.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi “site n’obi ... ka ... si apụta” na-ada eke n’Igbo ma na-echekwa isi iyi dị n’ime mmadụ nke ederede Grik mesiri ike. E debere akara edemede ikpeazụ dịka rikoma n’ihi na ndepụta omume ọjọọ ahụ na-aga n’ihu n’amaokwu na-esonụ.
