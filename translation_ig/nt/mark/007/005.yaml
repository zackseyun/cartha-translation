source:
  edition: SBLGNT
  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: ig
  text: Ndị Farisii na ndị odeakwụkwọ jụrụ ya, “Gịnị mere ndị na-eso ụzọ gị anaghị ebi ndụ dịka omenala ndị okenye si dị, kama ha ji aka na-adịghị ọcha eri achịcha?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: wee jụọ
  rationale: A na-eji oge ugbu a akọ akụkọ n’asụsụ Grik; ‘wee jụọ’ bụ ụzọ Igbo si akọ ihe mere n’usoro akụkọ n’enweghị ịgbakwụnye echiche na ha jụrụ ugboro ugboro.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nke a bụ aha a na-ejikarị akọwa òtù ndị ọkachamara n’Iwu n’akụkọ Oziọma, ma ọ naghị agbanwe okwu ahụ ka ọ bụrụ nkọwa sara mbara.
- source_word: Διὰ τί
  choice: Gịnị mere
  rationale: Nke a bụ ajụjụ Igbo dị mfe ma kwekọọ na ‘n’ihi gịnị?’
- source_word: περιπατοῦσιν
  choice: ebi ndụ
  rationale: N’ebe a, ‘ije ije’ bụ akpaalaokwu gbasara omume ma ọ bụ ụzọ ndụ. ‘Ibi ndụ’ na-enye ihe akpaalaokwu ahụ pụtara n’Igbo eke.
- source_word: κατὰ τὴν παράδοσιν
  choice: dịka omenala ... si dị
  rationale: Nke a na-egosi ime ihe n’ụzọ kwekọrọ n’ọdịnala e nyefere.
- source_word: τῶν πρεσβυτέρων
  choice: ndị okenye
  rationale: Ọ bụ nsụgharị genitive kwụ ọtọ, na-ezo aka n’omenala sitere n’aka ndị isi ochie, ọ bụghị kpọmkwem ndị okenye chọọchị.
- source_word: κοιναῖς χερσίν
  choice: aka ndị e merụrụ emerụ n’usoro okpukpe
  rationale: κοινός n’arụmụka a pụtara aka a na-ewere dị ka nke emetọworo n’usoro ịdị ọcha okpukpe, ọ bụghị naanị aka ruru unyi n’anụ ahụ. E mere ka akụkụ ritual pụta ìhè ka onye na-agụ ghara ịghọta ya dịka okwu ịdị ọcha nkịtị.
- source_word: ἄρτον
  choice: achịcha
  rationale: E chekwara aha kpọmkwem nke Grik, ọ bụ ezie na ọ pụkwara ịnọchite anya nri dum.
theological_decisions:
- issue: Ọnọdụ ritual nke κοινός
  choice: aka ndị e merụrụ emerụ n’usoro okpukpe
  alternative: aka na-adịghị ọcha; aka nkịtị
  rationale: Arụmụka ahụ metụtara ọdịnala ndị Farisii banyere ịdị ọcha n’usoro okpukpe, ọ bụghị mmehie omume ma ọ bụ unyi nkịtị. Nsụgharị a na-edobe esemokwu ahụ n’enweghị itinye mkpebi okpukpe ọzọ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma doo ndị nkịtị anya. A sụgharịrị akpaalaokwu περιπατεῖν dịka ‘ibi ndụ’ n’ihi na ‘ije ije dịka omenala si dị’ agaghị ada ka Igbo eke. E tinyere ‘n’usoro okpukpe’ iji kewaa mmetọ ritual na unyi anụ ahụ.
