revisions:
- from: Ndị Farisii na ndị odeakwụkwọ wee jụọ ya, “Gịnị mere ndị na-eso ụzọ gị anaghị ebi ndụ dịka omenala ndị okenye si dị, kama ha ji aka ndị e merụrụ emerụ n’usoro okpukpe eri achịcha?”
  to: Ndị Farisii na ndị odeakwụkwọ jụrụ ya, “Gịnị mere ndị na-eso ụzọ gị anaghị ebi ndụ dịka omenala ndị okenye si dị, kama ha ji aka na-adịghị ọcha eri achịcha?”
  rationale: The revision replaces the misleading ‘injured hands’ expression with natural Igbo, “aka na-adịghị ọcha.” The footnote preserves the literal sense of κοινός (‘common’) and identifies its ritual-purity force without confusing it with physical dirt or making a doctrinal inference. The rest of the draft remains faithful and natural.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the question, the disciples’ nonconformity to the elders’ tradition, and eating bread. However, “aka ndị e merụrụ emerụ” normally denotes injured or wounded hands and does not convey Greek κοιναῖς χερσίν, ritual/common (that is, defiled) hands.
  naturalness: The sentence is generally fluent Standard Igbo, but “aka ndị e merụrụ emerụ n’usoro okpukpe” is unnatural and semantically misleading. “Ji aka na-adịghị ọcha eri achịcha” is idiomatic and, with a note, clearly communicates the ritual issue.
  terminology: “Ndị Farisii,” “ndị odeakwụkwọ,” “omenala ndị okenye,” and “achịcha” are suitable. “Ndị odeakwụkwọ” is the established Gospel designation for scribes. The ritual connotation of κοινός should be retained in a footnote rather than expanded into a misleading phrase in the text.
  issues:
  - severity: high
    issue: “aka ndị e merụrụ emerụ n’usoro okpukpe”
    rationale: The expression “e merụrụ emerụ” means ‘were injured/wounded,’ not ritually defiled. It changes the accusation’s meaning. Greek κοινός here concerns a ritual status, not physical injury.
  - severity: medium
    issue: Ritual sense is embedded in an unnatural explanatory phrase
    rationale: The explanatory addition “n’usoro okpukpe” is understandable in intent but is attached to a phrase with the wrong meaning. A concise translation with a lexical footnote preserves both naturalness and source-level ambiguity.
  revised_text: Ndị Farisii na ndị odeakwụkwọ jụrụ ya, “Gịnị mere ndị na-eso ụzọ gị anaghị ebi ndụ dịka omenala ndị okenye si dị, kama ha ji aka na-adịghị ọcha eri achịcha?”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “aka nkịtị”; n’ụzọ nkịtị, “aka nkịtị/common.” N’ebe a, ọ na-ezo aka n’aka a na-ewere na ha emerụọla n’usoro okpukpe, ọ bụghị naanị aka ruru unyi.
    reason: lexical_alternative
  revision_rationale: The revision replaces the misleading ‘injured hands’ expression with natural Igbo, “aka na-adịghị ọcha.” The footnote preserves the literal sense of κοινός (‘common’) and identifies its ritual-purity force without confusing it with physical dirt or making a doctrinal inference. The rest of the draft remains faithful and natural.
