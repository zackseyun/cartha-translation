  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ⸀ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: ig
  text: Unu makwa na ọ pụtara[b] ka o wee wepụ mmehie[a], nakwa na mmehie adịghị n’ime ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “buru mmehie pụọ.” Ngwaa Grik ahụ nwere ike ịpụta “iwepụ,” “ibupu,” ma ọ bụ “iburu pụọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “e mere ka ọ pụta ìhè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: unu maara
  rationale: Ọdịdị perfect nke οἶδα na-arụkarị ọrụ dị ka okwu oge ugbu a n’asụsụ Grik Koine; n’ebe a, ọ pụtara ihe ndị na-agụ akwụkwọ maara ugbu a.
- source_word: ἐκεῖνος
  choice: ọ
  rationale: N’ọnọdụ okwu a, nnọchiaha a na-arụtụ aka n’ebe Jizọs Kraịst nọ. ‘Ọ’ bụ ụzọ ebumpụta ụwa e si kwuo ya n’Igbo ma ghara ịgbakwunye aha na-adịghị n’ahịrịokwu Grik.
- source_word: ἐφανερώθη
  choice: ọ pụtara
  rationale: Okwu a na-ekwu maka mpụta Kraịst n’akụkọ ihe mere eme. ‘Ọ pụtara’ doro ndị na-agụ akwụkwọ nke oge a anya; ihe ọzọ nwere ike ịbụ ‘e mere ka ọ pụta ìhè,’ nke na-egosikwu ụdị passive nke Grik.
- source_word: ἵνα
  choice: ka o wee
  rationale: Nke a na-egosi nzube e ji mee ihe; ‘ka o wee’ na-echekwa echiche nke nzube ahụ n’Igbo dị mfe ma dịkwa ebumpụta ụwa.
- source_word: ἁμαρτίας
  choice: mmehie
  rationale: Aha a dị n’ụdị ọtụtụ na Grik. ‘Mmehie’ n’Igbo nwere ike ịgụnye ọtụtụ omume mmehie n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: ἄρῃ
  choice: wepụ
  rationale: αἴρω nwere ike ịpụta ibuli, ibu pụọ, ma ọ bụ iwepụ. ‘Wepụ’ na-ekwupụta iwepụ mmehie n’ụzọ doro anya, ma ọ naghị ekpebi otu nkọwa pụrụ iche banyere usoro mgbaghara mmehie.
- source_word: ἁμαρτία
  choice: mmehie
  rationale: N’ahịrịokwu ikpeazụ, otu aha a na-egosi mmehie n’ozuzu ya; ‘mmehie adịghịkwa n’ime ya’ na-echekwa nkwupụta ahụ kpọmkwem.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Nke a na-echekwa usoro okwu Jọn na echiche na mmehie adịghị n’ime ya.
theological_decisions:
- issue: Onye ἐκεῖνος na-arụtụ aka na ya
  choice: Jizọs Kraịst, nke e ji nnọchiaha ‘ọ’ gosi
  alternative: ‘onye ahụ’ n’ụzọ na-akọwaghị onye ọ bụ
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na onye ahụ pụtara iji wepụ mmehie, onye mmehie na-adịghịkwa n’ime ya, bụ Jizọs Kraịst. Nnọchiaha ‘ọ’ na-ahapụ njikọ ahụ ka ọnọdụ okwu kọwaa ya, dịka Grik si eme.
- issue: Ihe αἴρω pụtara mgbe mmehie bụ ihe ọ na-emetụta
  choice: iwepụ mmehie
  alternative: ibu mmehie pụọ
  rationale: ‘Wepụ’ na-echekwa isi echiche nke ime ka mmehie pụọ, n’ebughị ụzọ kpebie ma ngwaa ahụ n’onwe ya na-akọwa iburu mmehie dịka ibu. Ihe ọzọ ga-ekwe omume ka e debere n’ala ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Unu’ na-egosi na οἴδατε bụ onye nke abụọ n’ụdị ọtụtụ. E tinyere ‘-kwa’ iji gosipụta καί nke na-amalite ahịrịokwu ahụ. Akara ala ala peeji [b] na-eso ‘ọ pụtara,’ ebe [a] na-eso ‘mmehie’ n’akụkụ ngwaa ‘wepụ,’ ka njikọ ha doo anya.
