id: 1JN.3.1
reference: 1 John 3:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: ig
  text: Lee ụdị ịhụnanya Nna nyere anyị[a], ka e wee kpọọ anyị ụmụ Chineke—anyị bụkwa ụmụ Chineke[b]. Ọ bụ ya mere ụwa anaghị ama anyị[c], n’ihi na ọ maghị ya[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Lee ụdị ịhụnanya dị aṅaa.” Grik na-ekwusi ike n’ụdị ma ọ bụ àgwà ịhụnanya Nna ahụ n’ụzọ jupụtara n’ịtụnanya; ọ bụghị naanị n’ịdị ukwuu ya.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ ihe odide ochie enweghị “anyị bụkwa ụmụ Chineke.”
    reason: textual_variant
  - marker: c
    text: Ma ọ bụ, “ụwa anaghị amata anyị ... ọ mataghị ya.” N’ebe a, “ịma” pụrụ ịgụnye ịmata onye maka onye ọ bụ.
    reason: lexical_alternative
  - marker: d
    text: “Ya” nwere ike izo aka na Nna, dịka usoro ahịrịokwu a si dị; ụfọdụ na-aghọta na ọ na-ezo aka na Kraịst n’echiche sara mbara nke akwụkwọ Jọn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: Lee
  rationale: Okwu iwu a na-akpọ ndị na-agụ akwụkwọ ka ha tụgharịa uche n’ihe dị ịtụnanya; “Lee” bụ okwu Igbo doro anya ma dịkwa nsọpụrụ.
- source_word: ποταπὴν ἀγάπην
  choice: ụdị ịhụnanya
  rationale: Nke a na-egosi ụdị na àgwà ịhụnanya ahụ n’ụzọ jupụtara n’ịtụnanya, ọ bụghị naanị ịdị ukwuu ya.
- source_word: δέδωκεν ἡμῖν
  choice: nyere anyị
  rationale: “Nyere anyị” bụ ntụgharị Igbo nkịtị. N’ọnọdụ a, ihe ịhụnanya ahụ rụpụtara ka dịgide, ọ bụ ezie na Igbo anaghị egosi perfect tense dịka Grik.
- source_word: ὁ πατὴρ
  choice: Nna
  rationale: N’akwụkwọ Jọn, nke a bụ aha e ji akpọ Chineke; mkpụrụedemede ukwu na-egosi onye a na-ekwu maka ya.
- source_word: τέκνα θεοῦ
  choice: ụmụ Chineke
  rationale: τέκνα na-agụnye nwoke na nwanyị; “ụmụ Chineke” bụ okwu Igbo eke nke na-adịghị akọwapụta otu okike naanị.
- source_word: κληθῶμεν
  choice: ka a kpọọ anyị
  rationale: Nke a na-echekwa passive na nzube/ọgwụgwụ nke ἵνα n’ụzọ Igbo na-ada nke ọma.
- source_word: καὶ ἐσμέν
  choice: anyị bụkwa ha
  rationale: Nke a na-edobe nkwenye siri ike na ọ bụghị naanị aha ka a na-akpọ ndị kwere ekwe, kama na ha bụ ụmụ Chineke n’ezie.
- source_word: διὰ τοῦτο
  choice: Ọ bụ ya mere
  rationale: Okwu Igbo a na-egosi ihe kpatara nkwubi okwu na-esochi.
- source_word: ὁ κόσμος
  choice: ụwa
  rationale: E debere ihe atụ Jọn bụ “ụwa” kama ịkọwa ya n’isiokwu dịka ụmụ mmadụ na-emegide Chineke.
- source_word: οὐ γινώσκει ἡμᾶς
  choice: na-amaghị anyị
  rationale: Nke a na-edobe njikọ kpọmkwem ya na “ọ maghị ya”; echiche nke ‘ịmata onye’ ka a kọwara n’ala peeji.
theological_decisions:
- issue: Onye αὐτόν (“ya”) na-ezo aka na ya
  choice: A hapụrụ ya dịka “ya,” ebe Nna bụ onye kacha nso e kwuru okwu ya
  alternative: Ọ pụrụ izo aka na Kraịst n’echiche sara mbara nke akwụkwọ Jọn
  rationale: Nnọchiaha Grik ahụ anaghị akpọ aha onye ahụ ọzọ. Usoro ahịrịokwu a na-akwado Nna, ma nkà mmụta okpukpe Jọn na-eme ka nghọta Kraịst kwe omume; ya mere, e doghị ya anya karịa isi mmalite ahụ.
- issue: Ịgụnye καὶ ἐσμέν
  choice: E tinyere ya n’isiokwu dịka “anyị bụkwa ha”
  alternative: Ụfọdụ ihe odide ochie enweghị okwu ndị a
  rationale: SBLGNT tinyere okwu ahụ, ọ na-ekwusi ike na ndị ahụ bụ ụmụ Chineke n’ezie; e debere ọdịiche ihe odide n’ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. E ji “Lee” kpọọ uche onye na-agụ akwụkwọ; e zere okwu ụka pụrụ iche. E debere “ụwa” na “ya” iji chekwaa ihe atụ na ntakịrị mgbagwoju anya dị na Grik.
