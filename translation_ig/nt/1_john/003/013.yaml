id: 1JN.3.13
reference: 1 John 3:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀μὴ θαυμάζετε, ⸀ἀδελφοί, εἰ μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/013.yaml
  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: ig
  text: Ejula unu anya, ụmụnna[a], ma ọ bụrụ na ụwa akpọ unu asị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụmụnna” na-atụgharị okwu Grik ἀδελφοί, nke dị n’ụdị ọtụtụ nwoke; n’ebe a, o yikarịrị ka ọ na-agwa ọgbakọ ndị kwere ekwe niile okwu, ụmụ nwanyị sokwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Ya ejula unu anya
  rationale: Nke a bụ ụzọ Igbo dị ugbu a si ekwu n'ụzọ ebumpụta ụwa ka mmadụ ghara iju anya; ọ na-egosikwa iwu mmachibido nke μή tinyere ngwaa dị n’oge ugbu a.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu nkwanye ùgwù na nke ebumpụta ụwa e ji akpọ ndị otu okwukwe dịka ndị otu ezinụlọ. Ọ naghị amanye echiche nke ụmụnne nwoke sitere n’otu nne na nna, ebe okwu Grik a nọ n’ebe a yikarịrị ka ọ na-agwa ọgbakọ ndị kwere ekwe niile okwu.
- source_word: εἰ
  choice: ma ọ bụrụ na
  rationale: Nke a na-edobe ọdịdị okwu ọnọdụ dị na Grik, n’agbanyeghị na ọnọdụ ahụ nwere ike ịbụ ihe a tụrụ anya na ọ ga-eme.
- source_word: μισεῖ
  choice: akpọ ... asị
  rationale: “Ịkpọ mmadụ asị” bụ ụzọ Igbo nkịtị si kwuo μισέω, ma na-egosipụta ọnọdụ na-aga n’ihu nke ngwaa Grik ahụ.
- source_word: ὁ κόσμος
  choice: ụwa
  rationale: “Ụwa” na-edobe obosara na ibu echiche nke κόσμος n’akwụkwọ Jọn, n’akọwaghị ya n’ime amaokwu dịka usoro mmadụ na-emegide Chineke.
theological_decisions:
- issue: Okwu ịkpọ òkù nke nwoke n’ụdị ἀδελφοί
  choice: Jiri “ụmụnna” n’ahịrịokwu, tinyekwa nkọwa n’ala peeji
  alternative: ụmụnne nwoke; ụmụnna nwoke na nwanyị
  rationale: Ụdị Grik bụ nke ọtụtụ ndị nwoke, ma n’ọnọdụ a o yikarịrị ka ọ na-anọchi anya ọgbakọ niile. “Ụmụnna” bụ okwu Igbo kwesịrị ekwesị maka njikọ ezinụlọ ime mmụọ; nkọwa ala peeji na-echekwa ozi gbasara ụdị nwoke nke okwu Grik na oke ndị a na-agwa okwu.
- issue: Ihe κόσμος pụtara n’ozizi Jọn
  choice: Tụgharịa ya “ụwa” n’enweghị nkọwa agbakwunyere n’ahịrịokwu
  alternative: usoro ụwa; ndị mmadụ na-emegide Chineke
  rationale: N’akwụkwọ Jọn, κόσμος nwere ike ịpụta ụmụ mmadụ ma ọ bụ usoro ndụ nke na-emegide Chineke. “Ụwa” na-echekwa obosara na esemokwu echiche ahụ kama idozi ya site n’ịkọwa karịa ihe ederede kwuru.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị mfe nghọta ma nwee ugwu. Usoro “ya ejula unu anya” na “ịkpọ mmadụ asị” bụ akpaalaokwu Igbo ebumpụta ụwa; e debere “ụwa” n’enweghị nkọwa okpukpe agbakwunyere.
