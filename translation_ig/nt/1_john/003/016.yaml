    reason: cultural_note
  revision_rationale: Only the verb expressing knowledge has been revised, from a present/general construction to the perfect-resultative "anyị amarala," so that the Igbo reflects ἐγνώκαμεν more closely. The rest faithfully preserves the Greek's wording, contrast, and idiomatic parallelism without imposing further theological interpretation.
