- from: 'Ọ bụ site na nke a[a] ka anyị ji mata ịhụnanya: onye ahụ tọgbọrọ ndụ ya n’ihi anyị; anyị onwe anyị kwesịkwara ịtọgbọ ndụ anyị n’ihi ụmụnna[b].'
  to: 'Ọ bụ site na nke a[a] ka anyị amarala ịhụnanya: onye ahụ tọgbọrọ ndụ ya n’ihi anyị; anyị onwe anyị kwesịkwara ịtọgbọ ndụ anyị n’ihi ụmụnna[b].'
  rationale: Only the verb expressing knowledge has been revised, from a present/general construction to the perfect-resultative "anyị amarala," so that the Igbo reflects ἐγνώκαμεν more closely. The rest faithfully preserves the Greek's wording, contrast, and idiomatic parallelism without imposing further theological interpretation.
  reviewer_model: gpt-5.6-terra
