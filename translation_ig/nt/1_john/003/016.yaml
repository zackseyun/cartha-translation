reference: 1 John 3:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: ig
  text: 'Ọ bụ site na nke a[a] ka anyị amarala ịhụnanya: onye ahụ tọgbọrọ ndụ ya n’ihi anyị; anyị onwe anyị kwesịkwara ịtọgbọ ndụ anyị n’ihi ụmụnna[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “n’ime nke a” ma ọ bụ “site n’ụzọ a.”'
    reason: lexical_alternative
  - marker: b
    text: N’ebe a, “ụmụnna” pụtara ụmụnna n’okwukwe n’ozuzu, ma ụmụ nwoke ma ụmụ nwanyị.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: site na nke a
  rationale: Nkebiokwu a na-egosi ihe ndabere ma ọ bụ ụzọ e si mata ịhụnanya. “Site na nke a” bụ Igbo doro anya ma na-edobe ike nkọwa nke okwu Grik.
- source_word: ἐγνώκαμεν
  choice: anyị ji mata
  rationale: Oge perfect nke Grik na-egosi nghọta e nwetara nke ka dị irè ugbu a. N’usoro “Ọ bụ ... ka,” “anyị ji mata” na-enye echiche ahụ n’ụzọ Igbo na-asụkarị.
- source_word: ἀγάπην
  choice: ịhụnanya
  rationale: Nke a bụ okwu Igbo nkịtị, sara mbara, ma kwesịrị ekwesị maka ἀγάπη n’ebe a.
- source_word: ἐκεῖνος
  choice: onye ahụ
  rationale: “Onye ahụ” na-edobe ntakịrị nkwusi ike nke nnọchiaha Grik ma hapụkwa ihe gbara amaokwu ahụ gburugburu ka ọ kọwaa na ọ na-ezo aka na Jizọs.
- source_word: ὑπὲρ ἡμῶν
  choice: n’ihi anyị
  rationale: Nke a na-egosi na o mere ya maka ọdịmma anyị na n’ihi anyị, ma ọ naghị amanye otu nkọwa ozizi kpọmkwem banyere ọnwụ Kraịst.
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: tọgbọrọ ndụ ya
  rationale: ψυχή pụtara ndụ n’ilu okwu a, ebe τίθημι na-egosi iji aka mmadụ nye ndụ ya n’àjà. “Tọgbọrọ ndụ ya” na-edobekwa onyonyo okwu Grik.
- source_word: ὀφείλομεν
  choice: anyị onwe anyị kwesịkwara
  rationale: “Kwesịrị” na-egosi ọrụ omume mmadụ ji, ebe “onwe anyị” na “-kwa” na-eme ka ntụnyere dị n’etiti ihe o mere na ihe anyị ga-eme pụta ìhè.
- source_word: τῶν ἀδελφῶν
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo ebumpụta ụwa maka ndị e jikọtara dị ka nwanne; n’ebe a ọ na-ezo aka n’ụmụnna n’okwukwe, ma ụmụ nwoke ma ụmụ nwanyị.
- source_word: τὰς ψυχὰς θεῖναι
  choice: ịtọgbọ ndụ anyị
  rationale: Nke a kwekọrọ na nkebiokwu mbụ ma na-edobe njikọ okwu na onyonyo nke ψυχή/τίθημι.
theological_decisions:
- issue: Onye ἐκεῖνος na-ezo aka na ya
  choice: E dere ya “onye ahụ,” ebe ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Jizọs, Ọkpara ahụ.
  alternative: Ịkpọ ya “Jizọs” ozugbo n’ahịrị bụ isi.
  rationale: O doro anya n’akwụkwọ 1 Jọn na ọ na-ezo aka na Jizọs, ma okwu Grik n’onwe ya bụ nnọchiaha. “Onye ahụ” na-edobe ụdị okwu ahụ n’enweghị itinye aha na-adịghị n’ahịrị ahụ.
- issue: Oke ndị τῶν ἀδελφῶν gụnyere
  choice: “Ụmụnna,” nke n’Igbo nwere ike ịgụnye ndị kwere ekwe niile, ma ndị nwoke ma ndị nwanyị.
  alternative: “Ụmụnna nwoke na ụmụnna nwanyị.”
  rationale: Ọtụtụ ἀδελφῶν nke Grik bụ ụdị nwoke n’ụtọ asụsụ, ma n’ọnọdụ nzukọ ndị kwere ekwe ọ na-anọchi anya ndị otu okwukwe n’ozuzu. Okwu Igbo “ụmụnna” na-edobe mmekọrịta ezinụlọ ahụ ma ghara iwepụ ụmụ nwanyị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro nkwusi ike “Ọ bụ ... ka” na-eme ka mmalite amaokwu ahụ daa nke ọma n’Igbo; a hapụrụ ntụnyere na ọrụ omume dị n’ahịrị abụọ ahụ ka ha pụta ìhè.
