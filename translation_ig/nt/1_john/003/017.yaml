review_pass:
  verdict: revise
  source_fidelity: The rendering of material possessions, awareness of a brother's need, the rhetorical question, and the deliberately unresolved genitive in “ịhụnanya Chineke” is sound. However, “n’ebe ọ nọ” means “where he is” and does not adequately convey the directed withdrawal expressed by ἀπ’ αὐτοῦ. The main text should express withholding compassion from the needy brother.
  naturalness: “Nwanna nwoke ya” is less idiomatic and potentially less clear than Standard Igbo “nwanne ya nwoke.” “Mechie obi ebere ya n’ebe ọ nọ” is a natural modern idiom that retains the source metaphor while clearly communicating refusal of compassion.
  terminology: “Ihe onwunwe nke ụwa a,” “nwanne ya nwoke,” “ịhụnanya Chineke,” and “na-anọgide n’ime ya” are appropriate. “Obi ebere” supplies the idiomatic compassionate force of σπλάγχνα without resolving the rhetorical question or theological ambiguity.
  issues:
  - severity: medium
    issue: The phrase “mechie obi ya n’ebe ọ nọ” does not clearly mean withholding compassion from the brother.
    rationale: In Standard Igbo, “n’ebe ọ nọ” ordinarily locates someone (“where he is”). The Greek κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ depicts shutting off compassionate feeling from the needy person. “Mechie obi ebere ya n’ebe ọ nọ” supplies this required relational sense.
  - severity: low
    issue: “nwanna nwoke ya” is less idiomatic than “nwanne ya nwoke.”
    rationale: “Nwanne ya nwoke” is the usual clear Standard Igbo expression for “his brother” and preserves the masculine singular form of ἀδελφόν.
  - severity: medium
    issue: Footnote b's alternative wording, “gbochie ya ọmịiko ya,” is not natural Igbo.
    rationale: The possessive and object relationship is unclear. “jụ igosi ya ọmịiko” naturally conveys withholding compassion, while the literal explanation preserves the underlying bodily idiom.
  revised_text: Ma onye ọ bụla nwere ihe onwunwe nke ụwa a, hụkwa nwanne ya nwoke[a] ka ọ nọ ná mkpa, ma mechie obi ebere ya n’ebe ọ nọ[b]—olee otú ịhụnanya Chineke[c] si anọgide n’ime ya?
