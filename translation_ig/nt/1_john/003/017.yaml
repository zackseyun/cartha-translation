id: 1JN.3.17
reference: 1 John 3:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: ig
  text: Ma onye ọ bụla nwere ihe onwunwe nke ụwa a, hụkwa nwanne ya nwoke[a] ka ọ nọ ná mkpa, ma mechie obi ebere ya n’ebe ọ nọ[b]—olee otú ịhụnanya Chineke[c] si anọgide n’ime ya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwanne nwoke ma ọ bụ nwanyị.” Okwu Grik ahụ kwuru “nwanne nwoke,” ma ọ pụrụ ịnọchite anya onye kwere ekwe ibe ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “jụ igosi ya ọmịiko.” N’ụzọ nkịtị, ọ bụ “mechie akụkụ ime ya pụọ n’ebe ọ nọ,” akpaalaokwu pụtara ịjụ igosi ọmịiko sitere n’obi.
    reason: lexical_alternative
  - marker: c
    text: “Ịhụnanya Chineke” nwere ike ịpụta ịhụnanya Chineke nke dị n’ime ya, ma ọ bụ ịhụnanya o nwere n’ebe Chineke nọ.
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: ihe onwunwe nke ụwa a
  rationale: N’ebe a, βίος na-ezo aka n’ihe mmadụ nwere e ji akwado ndụ, karịchaa akụ ma ọ bụ ihe a pụrụ iji nyere onye nọ ná mkpa aka; “ihe onwunwe nke ụwa a” bụ Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: θεωρῇ
  choice: hụkwa
  rationale: Okwu a na-egosi na onye ahụ hụrụ ma mara ọnọdụ nwanna ya; “hụkwa” na-ekwupụta nke a n’ụzọ dị mfe ma dị ndụ.
- source_word: ἀδελφὸν αὐτοῦ
  choice: nwanna nwoke ya
  rationale: ἀδελφός dị n’ụdị nwoke otu onye. “Nwanna nwoke ya” na-edebe nkọwa nwoke nke isi mmalite, ebe ihe odide ala peeji na-akọwa na ọ pụrụ ịnọchite anya onye kwere ekwe ibe ya.
- source_word: χρείαν ἔχοντα
  choice: ka ọ nọ ná mkpa
  rationale: Nkebi a pụtara n’ụzọ nkịtị “onye nwere mkpa.” Nsụgharị a bụ Igbo ebumpụta ụwa nke na-egosi enweghị ihe ndị dị mkpa.
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: mechie obi ya n’ebe ọ nọ
  rationale: σπλάγχνα pụtara akụkụ ime ahụ n’ụzọ nkịtị, ma ọ bụ akpaalaokwu maka ọmịiko sitere n’obi. “Mechie obi ya” na-edebe ihe atụ ahụ ma na-egosi ịjụ imere onye ahụ ebere.
- source_word: πῶς
  choice: olee otu ... si
  rationale: Nke a na-edebe ụdị ajụjụ nke Grik ma hapụ ike ajụjụ nkwupụta ahụ ka ọ pụta n’onwe ya, n’etinyeghị okwu modal ọzọ.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: ịhụnanya Chineke
  rationale: Nhọrọ a na-esochi okwu Grik nke ọma ma zere idozi ozugbo ma ọ bụ ịhụnanya Chineke nọ n’ime mmadụ, ma ọ bụ ịhụnanya mmadụ nwere n’ebe Chineke nọ.
- source_word: μένει ἐν αὐτῷ
  choice: na-anọgide n’ime ya
  rationale: “Na-anọgide” bụ okwu Igbo dị mfe ma na-edebe echiche ịdịgide nke μένω, okwu dị mkpa n’ihe odide Jọn.
theological_decisions:
- issue: Ihe ἡ ἀγάπη τοῦ θεοῦ pụtara
  choice: ịhụnanya Chineke
  alternative: ịhụnanya Chineke nwere n’ebe mmadụ nọ; ma ọ bụ ịhụnanya mmadụ nwere n’ebe Chineke nọ
  rationale: Ụdị njikọ mkpụrụokwu Grik ahụ nwere ike ịkwado nghọta abụọ ahụ. Isi okwu ahụ na ihe odide ala peeji na-edebe esemokwu nkọwa a kama ikpebi otu naanị.
- issue: Otú e si sụgharịa ἀδελφὸν n’ihe gbasara nwoke na nwanyị
  choice: nwanna nwoke ya
  alternative: nwanna ya; onye kwere ekwe ibe ya
  rationale: Isi mmalite ahụ bụ aha nwoke otu onye. A na-edebe nke a n’isi okwu, ma ihe odide ala peeji na-egosi na n’iji okwu a eme ihe, ọ pụrụ ịnọchite anya onye kwere ekwe ibe ya, nwoke ma ọ bụ nwanyị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-edebe ajụjụ nkwupụta nke isi mmalite, ihe atụ nke imechi obi, na nghọta abụọ nwere ike ịdị na “ịhụnanya Chineke.”
