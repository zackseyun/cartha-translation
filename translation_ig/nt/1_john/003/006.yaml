id: 1JN.3.6
reference: 1 John 3:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: ig
  text: Onye ọ bụla na-anọgide n’ime ya anaghị eme mmehie[a]; onye ọ bụla na-eme mmehie ahụbeghị ya, ọ matabeghịkwa ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ ọzọ: “anaghị anọgide na-eme mmehie ... onye na-anọgide na-eme mmehie.” Ụdị ngwaa Grik dị ugbu a nwere ike ịkọwa omume na-aga n’ihu ma ọ bụ omume e ji mmadụ mara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ
  choice: Onye ọ bụla nke
  rationale: Nke a na-egosipụta ike izugbe nke usoro Grik ahụ ma bụrụkwa Igbo nkịtị na nke doro anya.
- source_word: ἐν αὐτῷ μένων
  choice: na-anọgide n’ime ya
  rationale: ‘Na-anọgide’ na-echekwa echiche nke μένω banyere ịnọgide na mmekọrịta; ‘n’ime ya’ na-edobekwa okwu njikọ ahụ n’enweghị ịkọwa onye nnọchiaha ahụ karịa isi mmalite.
- source_word: οὐχ ἁμαρτάνει
  choice: adịghị anọgide na-eme mmehie[a]
  rationale: N’ebe a, ụdị ngwaa dị ugbu a nwere ike ịkọwa omume na-aga n’ihu ma ọ bụ nke e ji mmadụ mara. Nsụgharị a na-egosipụta nke ahụ, ebe ihe odide ala ala peeji na-echekwa nsụgharị nkịtị karịa.
- source_word: ὁ ἁμαρτάνων
  choice: onye ọ bụla nke na-anọgide na-eme mmehie
  rationale: A sụgharịrị participle dị ugbu a n’ụzọ kwekọrọ na nkebi mbụ, dị ka omume na-aga n’ihu ma ọ bụ nke e ji mmadụ mara.
- source_word: οὐχ ἑώρακεν αὐτόν
  choice: ahụbeghị ya
  rationale: Nke a na-echekwa perfect tense dị ka ọnọdụ dị ugbu a nke sitere n’ịghara ịhụ ya.
- source_word: οὐδὲ ἔγνωκεν αὐτόν
  choice: ọ matabeghịkwa ya
  rationale: ‘Matabeghị’ nwere ike ibu echiche mmekọrịta nke γινώσκω, ebe ‘-kwa’ na-egosipụta njikọ mgbakwunye nke οὐδέ.
- source_word: αὐτῷ / αὐτόν
  choice: ya
  rationale: E debere nnọchiaha ahụ dịka isi Grik si mee, n’ebughị ụzọ kpebie ma ọ bụ Chineke, Ọkpara, ma ọ bụ Kraịst.
theological_decisions:
- issue: Ma amaokwu a ọ na-akụzi na ndị kwere ekwe anaghị eme mmehie ọ bụla ma ọlị
  choice: 'E gosipụtara ngwaa ndị dị ugbu a dịka omume na-aga n’ihu ma ọ bụ nke e ji mmadụ mara: ‘na-anọgide na-eme mmehie.’'
  alternative: 'Nsụgharị nkịtị: ‘adịghị eme mmehie ... onye na-eme mmehie.’'
  rationale: Nke a na-echekwa ịdị arọ nke ịdọ aka ná ntị Jọn banyere mmehie, ma ghara ime ka ọ megide 1 Jọn 1:8–2:2, ebe a nabatara na ndị kwere ekwe nwere ike ime mmehie. Ihe odide ala ala peeji na-echekwa ezi mgbagwoju anya nke ụdị Grik.
- issue: Onye ‘ya’ na-ezo aka na ya
  choice: E debere ya dịka nnọchiaha ‘ya.’
  alternative: Ịkpọ ya ‘Chineke,’ ‘Ọkpara,’ ma ọ bụ ‘Kraịst.’
  rationale: Grik ji nnọchiaha mee ihe, ọnọdụ gbara ya gburugburu nwekwara ike iduga onye na-agụ ya n’ebe Nna ma ọ bụ Ọkpara nọ; ya mere, a naghị ekpebi ihe amaokwu ahụ ekpebighị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘mmehie’ mee ihe dịka okwu Baịbụl a maara nke ọma; e zere okwu ụka pụrụ iche na ịkọwa nnọchiaha Grik karịa ihe odide ahụ.
