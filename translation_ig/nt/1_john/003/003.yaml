revisions:
- from: Onye ọ bụla nke nwere olileanya a n’ebe ọ nọ[a] na-eme onwe ya ka ọ dị ọcha, dị nnọọ ka onye ahụ[b] dị ọcha.
  to: Onye ọ bụla nke nwere olileanya a dabeere na ya[a] na-eme ka onwe ya dị ọcha, dị nnọọ ka onye ahụ[b] dị ọcha.
  rationale: The revision corrects the misleading locative rendering of ἐπ’ αὐτῷ while retaining its likely sense of hope resting on the unnamed referent. It preserves the Greek pronouns in the verse itself, maintains the purity wordplay, and supplies footnotes with natural Standard Igbo and appropriately cautious contextual identification.
  reviewer_model: gpt-5.6-terra
