reference: 1 John 3:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἔχων τὴν ἐλπίδα ταύτην ἐπ’ αὐτῷ ἁγνίζει ἑαυτὸν καθὼς ἐκεῖνος ἁγνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: ig
  text: Onye ọ bụla nke nwere olileanya a dabeere na ya[a] na-eme ka onwe ya dị ọcha, dị nnọọ ka onye ahụ[b] dị ọcha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nwere olileanya a n’ime ya.” Nkebiokwu Grik ahụ pụrụ ịpụta ụzọ abụọ; “olileanya a dabeere na ya” na-eme ka onye olileanya ahụ dabeere na ya pụta ìhè.
    reason: lexical_alternative
  - marker: b
    text: “Onye ahụ” n’ọnọdụ okwu a yikarịrị ka ọ na-ezo aka na Nwa ahụ, bụ Kraịst, ọ bụ ezie na Grik ji naanị nnọchiaha mee ntụaka ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: Onye ọ bụla nke nwere
  rationale: Ọ na-egosi onye ọ bụla a na-akọwa site n’inwe olileanya ahụ; ụdị a bụ Igbo nkịtị ma na-echekwa echiche nke omume ma ọ bụ ọnọdụ na-aga n’ihu.
- source_word: ἐλπίδα ταύτην
  choice: olileanya a
  rationale: “Olileanya” na-egosi atụmanya siri ike e kwuru n’amaokwu ndị bu ụzọ, ebe “a” na-atụ aka kpọmkwem n’olileanya ahụ.
- source_word: ἐπ’ αὐτῷ
  choice: n’ebe ọ nọ
  rationale: Nkebiokwu a na-egosi onye olileanya ahụ dabeere na ya ma ọ bụ lekwasịrị anya n’ebe ọ nọ, ma ọ naghị etinye aha Kraịst n’ebe Grik ji nnọchiaha.
- source_word: ἁγνίζει ἑαυτὸν
  choice: na-eme onwe ya ka ọ dị ọcha
  rationale: Nke a bụ ụzọ Igbo doro anya isi kwuo ime onwe onye ka ọ dị ọcha, ma ọ na-echekwa njikọ okwu ya na ἁγνός nke na-esote.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Ọ na-egosi ntụnyere siri ike n’ụzọ Igbo dị mma ma dị ugbu a.
- source_word: ἐκεῖνος
  choice: onye ahụ
  rationale: Ọ na-echekwa ike ngosi nke nnọchiaha Grik ahụ n’etinyeghị “Kraịst” ma ọ bụ “Nwa ahụ” ozugbo n’ihe odide.
- source_word: ἁγνός
  choice: dị ọcha
  rationale: Ọ dabara n’ọnọdụ omume ime mmụọ a ma na-echekwa nkwughachi echiche dị n’etiti “ime ka ọ dị ọcha” na “dị ọcha.”
theological_decisions:
- issue: Onye αὐτῷ na ἐκεῖνος na-atụ aka na ya
  choice: E ji “ọ” na “onye ahụ” hapụ ntụaka ahụ dịka nnọchiaha; n’ọnọdụ okwu ahụ, o yikarịrị ka ha na-atụ aka n’ebe Nwa ahụ/Kraịst nọ.
  alternative: Ha nwere ike ịtụ aka n’ebe Chineke Nna nọ, ma ọ bụ jiri ụma hapụ ntakịrị mgbagwoju anya n’etiti Nna na Nwa.
  rationale: Amaokwu ndị gbara ya gburugburu na-akwado Kraịst/Nwa ahụ, ma ebe Grik akpọghị aha ahụ kpọmkwem, nsụgharị ekwesịghị idozi ihe odide ahụ karịa ka isi mmalite mere.
- issue: Ụdị nnọchiaha onwe ἑαυτὸν
  choice: onwe ya
  alternative: onwe onye
  rationale: “Onwe ya” bụ nnọchiaha onwe Igbo sitere n’okike nke na-arụ ọrụ maka mmadụ ọ bụla, ma kwekọọ na “onye ọ bụla” n’enweghị itinye nwoke ma ọ bụ nwanyị ebe asụsụ Igbo anaghị eme nkewa ahụ n’ụdị nnọchiaha a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ntụnyere na nkwughachi “dị ọcha,” ma zere itinye aha onye nnọchiaha ndị Grik na-atụ aka na ya n’ime isi ihe odide.
