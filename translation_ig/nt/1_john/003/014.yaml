id: 1JN.3.14
reference: 1 John 3:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν, ὅτι ἀγαπῶμεν τοὺς ἀδελφούς· ὁ μὴ ⸀ἀγαπῶν μένει ἐν τῷ θανάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/014.yaml
  text: We know that we have passed from death into life[a], because we love the brothers. The one who does not love remains in death.
translation:
  language: ig
  text: anyị maara na anyị esiwo n’ọnwụ banye ná ndụ[a], n’ihi na anyị hụrụ ụmụnna n’anya. Onye na-adịghị ahụ n’anya ka nọ n’ọnwụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnne nwoke na ụmụnne nwanyị”; okwu Grik ahụ kwuru “ụmụnne nwoke,” ma n’ebe a o yikarịrị ka ọ na-ezo aka n’ebe ndị kwere ekwe ibe ha nọ n’ozuzu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: Anyị maara
  rationale: Ọ bụ ezie na οἶδα dị n’ụdị perfect, ọ na-arụ ọrụ dị ka ngwaa na-egosi ọnọdụ dị ugbu a; “anyị maara” bụ Igbo doro anya ma kwekọọ na ya.
- source_word: μεταβεβήκαμεν
  choice: anyị esiwo ... banye
  rationale: Ụdị perfect na-egosi mgbanwe e mezuru nke nsonaazụ ya ka dị. “Esiwo ... banye” na-echekwa ma ngagharị ahụ ma ọnọdụ ọhụrụ ahụ.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: n’ọnwụ banye ná ndụ
  rationale: Nhazi “esiwo ... banye” na-egosipụta ngagharị site n’otu ọnọdụ pụta banye n’ọzọ, dị ka ἐκ...εἰς si kwuo.
- source_word: ἀγαπῶμεν
  choice: anyị hụrụ ... n’anya
  rationale: “Ịhụ ... n’anya” bụ ụzọ Igbo nkịtị na nke kwesịrị ekwesị isi kwuo ịhụnanya na-aga n’ihu dịka àgwà.
- source_word: τοὺς ἀδελφούς
  choice: ụmụnna anyị
  rationale: “Ụmụnna” bụ okwu Igbo ebumpụta ụwa maka ndị otu ezinụlọ ma ọ bụ obodo okwukwe; n’ọnọdụ a ọ pụrụ ịgụnye ndị nwoke na ndị nwanyị. E tinyere “anyị” iji mee ka njikọ obodo ahụ doo anya, na-enweghị ịgbasa ihe okwu ahụ pụtara.
- source_word: ὁ μὴ ἀγαπῶν
  choice: Onye na-adịghị ahụ n’anya
  rationale: Nke a na-echekwa ike nke participle nwere article nke na-ekwu maka ụdị onye n’ozuzu, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: μένει
  choice: ka nọ
  rationale: “Ka nọ” na-egosi ọnọdụ na-aga n’ihu n’ụzọ dị mfe ma doo anya, ma na-echekwa isi echiche μένει.
- source_word: ἐν τῷ θανάτῳ
  choice: n’ọnwụ
  rationale: A hapụrụ ihe atụ ahụ n’ụdị ya dị mkpirikpi, n’etinyeghị nkọwa dịka “ọnwụ ime mmụọ” nke Grik ekwughị kpọmkwem.
theological_decisions:
- issue: Ndị okwu τοὺς ἀδελφούς na-ezo aka na ha
  choice: ụmụnna anyị, tinyere nkọwa ala peeji na ọ pụrụ ịpụta ụmụnna nwoke na ụmụnna nwanyị n’okwukwe
  alternative: ụmụnne nwoke
  rationale: Grik bụ aha nwoke n’ụdị ọtụtụ, ma n’ọnọdụ akwụkwọ Jọn ọ na-abụkarị okwu maka ndị kwere ekwe n’ozuzu. “Ụmụnna” bụ okwu Igbo nke na-echekwaghị ụmụ nwanyị n’èzí n’amaghị ama, ebe nkọwa ala peeji na-eme ka ihe okwu Grik kwuru pụta ìhè.
- issue: Ụdị ‘ọnwụ’ na ‘ndụ’
  choice: ọnwụ na ndụ, na-enweghị mgbakwunye nkọwa
  alternative: ọnwụ ime mmụọ na ndụ ebighị ebi
  rationale: Amaokwu ahụ na-ekwu maka mgbanwe dị omimi n’ihe gbasara Chineke, ma ọ hapụrụ okwu abụọ ahụ dịka ihe atụ dị nkenke. Ịghara ịgbasa ha na-echekwa obosara na esemokwu nkà mmụta okpukpe nke ederede ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ugwu ma dị mfe nghọta mee ntụgharị a. “Esiwo ... banye” na-echekwa ihe atụ nke ịgafe site n’ọnwụ baa ná ndụ, ebe “ka nọ” na-enye μένει n’ụzọ mmadụ nkịtị ga-aghọta.
