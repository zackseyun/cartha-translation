id: 1JN.3.20
reference: 1 John 3:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na obi anyị ama anyị ikpe[a], Chineke karịrị obi anyị[b], ọ makwa ihe niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “taa anyị ụta,” ma ọ bụ “chọpụta mmejọ anyị.”
    reason: lexical_alternative
  - marker: b
    text: “Chineke karịrị obi anyị” nwere ike izo aka n’otú Chineke si mara eziokwu niile banyere anyị karịa ka obi anyị si mara ya, nakwa, n’otú ikike ikpe ya si karịrị ikpe anyị na-ama onwe anyị.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: ὅτι nke mbụ na-enye ihe ndabere ma ọ bụ nkọwa maka okwu bu ya ụzọ; “N’ihi na” na-egosipụta ọrụ nkọwa a n’Igbo nkịtị.
- source_word: ἐὰν
  choice: ọ bụrụ na
  rationale: Ya na ngwaa dị n’ụdị subjunctive, ἐὰν na-egosi ọnọdụ nwere ike ịdị; “ọ bụrụ na” bụ ntụgharị Igbo doro anya.
- source_word: καταγινώσκῃ
  choice: amaa … ikpe
  rationale: Nkebiokwu “ịma mmadụ ikpe” na-egosipụta echiche nke ikpe ọmụma ma ọ bụ ịchọpụta ihe megide mmadụ, ma kwe ka nkọwa ndị dị ka ịta ụta nọgide bụrụ ihe a pụrụ ịghọta.
- source_word: ἡ καρδία ἡμῶν
  choice: obi anyị
  rationale: E debere “obi” kama ịkọwa ya naanị dịka akọnuche, ka ihe atụ Jọn ji maka ndụ ime mmadụ ghara ịla n’iyi.
- source_word: ὅτι
  choice: '[a naghị atụgharị ya iche n’okwu nke abụọ]'
  rationale: ὅτι nke abụọ na-ewebata ihe ndabere ma ọ bụ ọdịnaya nke mmesi obi ike ahụ. Usoro ahịrịokwu Igbo na-eburu ọrụ ya n’enweghị ikwughachi “na.”
- source_word: μείζων ἐστὶν
  choice: karịrị
  rationale: “Karịrị” na-echekwa obosara nke ntụnyere ahụ n’ebughị ụzọ kpebie na ọ bụ naanị n’amara, ikike, ma ọ bụ ihe ọmụma ka Chineke ji karịa obi.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ aha a na-ejikarị atụgharị θεός n’Igbo.
- source_word: τῆς καρδίας ἡμῶν
  choice: obi anyị
  rationale: Mgbe “karịrị” gachara, “obi anyị” na-egosipụta ntụnyere genitive nke Grik n’ụzọ Igbo dị mfe ma doo anya.
- source_word: γινώσκει πάντα
  choice: ọ makwaara ihe niile
  rationale: “Ihe niile” na-echekwa oke zuru ezu nke πάντα; “-kwaara” na-egosikwa njikọ καί na nkebiokwu bu ya ụzọ.
theological_decisions:
- issue: Ihe “Chineke karịrị obi anyị” pụtara
  choice: E debere okwu ahụ n’obosara ya, n’emeghị ka ọ bụrụ naanị ebere Chineke, naanị ikike ya, ma ọ bụ naanị ihe ọmụma ya.
  alternative: A pụrụ ịghọta ya na Chineke maara eziokwu banyere anyị karịa ikpe obi anyị na-ama, ma ọ bụ na mkpebi ya karịrị ikpe anyị na-ama onwe anyị.
  rationale: Grik kwuru n’ụzọ sara mbara na Chineke karịrị obi anyị, wee gbakwunye na ọ maara ihe niile. Nkebiokwu ikpeazụ na-eme ka ihe ọmụma pụta ìhè, ma ntụnyere ahụ n’onwe ya ka nwere obosara karịa otu nkọwa naanị.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere “obi” na obosara nke “karịrị” iji chekwaa ihe atụ na esemokwu nkà mmụta okpukpe dị n’ederede Grik.
