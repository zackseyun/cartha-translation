  verdict: revise
  source_fidelity: The draft accurately retains the conditional force, the metaphorical “heart,” the broad comparison that God is greater than the heart, and the comprehensive scope of πάντα. However, “ọ makwaara” normally carries a completed/past sense (“he also knew/has also known”) and does not best represent the present γινώσκει. “Ọ makwa ihe niile” expresses the present gnomic assertion and the connective καί.
  naturalness: The verse is generally clear Standard Igbo. “Obi anyị ama anyị ikpe” is a natural idiom for inward condemnation in this conditional construction. The footnote wording is adjusted slightly for smoother contemporary Igbo.
  terminology: “Chineke,” “obi anyị,” “ịta anyị ụta,” and “karịrị” are appropriate. The main text properly avoids reducing καρδία to “akọnuche” or specifying the respect in which God is “greater.”
  issues:
