source:
  edition: SBLGNT
  text: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν καὶ τὴν ἀνομίαν ποιεῖ, καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/004.yaml
  text: Everyone who practices sin also practices lawlessness[b][a], and sin is lawlessness.
translation:
  language: ig
  text: Onye ọ bụla na-eme mmehie[a] na-emekwa mmebi iwu; mmehie bụkwa mmebi iwu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụdị ngwaa Grik dị ugbu a nwere ike ịpụta n’ụzọ nkịtị ‘onye ọ bụla na-eme mmehie.’ N’ọnọdụ a, ọ pụkwara igosi omume a na-eme ugboro ugboro ma ọ bụ nke e ji mara mmadụ.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ ἀνομία, nke pụtara ileghara iwu anya ma ọ bụ imegide ya. A pụkwara ịsụgharị ya ‘enweghị iwu’ ma ọ bụ ‘nnupụisi megide iwu,’ ma ‘mmebi iwu’ bụ ụzọ Igbo doro anya karịa n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν
  choice: Onye ọ bụla na-eme
  rationale: Nkebi a na-ezo aka n’ozuzu ya n’onye ọ bụla na-eme ihe ahụ. Usoro ‘na-eme’ bụ Igbo dị mfe ma kwekọọ na present participle Grik; ọ pụkwara igosi omume na-aga n’ihu ma ọ bụ nke mmadụ na-emekarị n’enweghị ịgbakwunye nkọwa karịrị ihe ederede kwuru.
- source_word: τὴν ἁμαρτίαν
  choice: mmehie
  rationale: ‘Mmehie’ bụ okwu Igbo a na-aghọta nke ọma maka ἁμαρτία. Igbo anaghị achọ article n’ebe a, okwu ahụ na-ekwukwa maka mmehie n’ozuzu ya, ọ bụghị otu mmehie a kpọtụrụ aha tupu ya.
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: na-emekwa mmebi iwu
  rationale: ‘Na-emekwa’ na-echekwa καί na myiri dị n’etiti ποιῶν na ποιεῖ. ‘Mmebi iwu’ bụ ụzọ Igbo nkịtị isi kwuo omume megidere iwu, ma ọ naghị akọwapụta n’ime isiokwu ahụ kpọmkwem iwu nke a na-ekwu banyere ya.
- source_word: ἀνομία
  choice: mmebi iwu
  rationale: ‘Mmebi iwu’ na-echekwa njikọ ἀνομία nwere na νόμος, ‘iwu,’ ma bụrụkwa okwu doro ndị na-agụ Igbo nke oge a anya. ‘Enweghị iwu’ nwere ike ime ka a ghọta ya dịka ọnọdụ ebe iwu na-adịghị, kama omume nke ileghara iwu anya ma ọ bụ imegide ya.
- source_word: καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: mmehie bụkwa mmebi iwu
  rationale: Nke a na-echekwa nkwupụta nkọwa ahụ n’ụzọ siri ike ma dị mkpirikpi. Ọ naghị eme ka njikọ ahụ bụrụ naanị ihe mmehie na-akpata ma ọ bụ otu ihe atụ nke mmehie.
theological_decisions:
- issue: Ma present tense Grik ọ na-ekwu naanị maka otu omume, ka ọ na-egosi omume a na-eme ugboro ugboro ma ọ bụ nke e ji mara mmadụ
  choice: Jiri ‘na-eme,’ nke na-enye ohere maka echiche omume na-aga n’ihu ma ọ bụ nke a na-emekarị n’ọnọdụ a
  alternative: ‘na-ebi ndụ ime mmehie’ ma ọ bụ ‘na-eme mmehie mgbe niile’
  rationale: N’Igbo, ‘na-eme’ nwere ike igosi omume na-aga n’ihu ma ọ bụ nke a na-emekarị, ma ọ naghị emechi ụzọ nye ịdị mfe nke present forms Grik. Nhọrọ ndị ọzọ ga-eme ka echiche omume a na-emekarị sie ike karịa ka ụdị ngwaa n’onwe ya chọrọ.
- issue: Ihe ἀνομία pụtara n’okwu nkọwa ‘mmehie bụ ἀνομία’
  choice: mmebi iwu
  alternative: enweghị iwu; ajọ omume; nnupụisi megide iwu
  rationale: ‘Mmebi iwu’ na-edobe njikọ ya na ‘iwu’ ma ghara itinye nkọwa okpukpe ọzọ banyere ma ọ bụ Iwu Mosis, iwu obodo, ma ọ bụ ụdị iwu ọzọ. Ya mere, ọ na-echekwa mkpakọ na esemokwu nkà mmụta okpukpe dị n’ahịrịokwu ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị mfe ma nwee ugwu. E ji ‘onye ọ bụla’ zere ịkpọ naanị nwoke. E jighị okwu ochie dịka ‘nmehie’ ma ọ bụ akara ụda olu ndị na-adịghị mkpa; e ji ‘mmehie’ na ‘mmebi iwu’ nke ndị na-agụ akwụkwọ taa ga-aghọta ngwa ngwa.
