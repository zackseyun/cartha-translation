id: 1JN.3.12
reference: 1 John 3:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: ig
  text: Ọ bụghị dị ka Ken[a], onye sitere n’aka ajọ onye ahụ, wee gbuo nwanne ya n’ụzọ obi ọjọọ.[b] Gịnịkwa mere o ji gbuo ya? Ọ bụ n’ihi na omume ya dị njọ, ma nke nwanne ya ziri ezi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye sitere n’ihe ọjọọ.” Okwu Grik ahụ nwere ike izo aka n’ihe ọjọọ n’ozuzu ya, ma n’akwụkwọ Jọn ọ na-ezokarị aka n’ajọ onye ahụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “wee gbuo nwanne ya.” Ngwaa Grik ahụ na-egosi igbu mmadụ n’ụzọ jọgburu onwe ya, dịka igbu anụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ καθὼς Κάϊν
  choice: Ọ bụghị dị ka Ken
  rationale: Na-egosipụta ntụnyere a jụrụ ajụ n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ἐκ τοῦ πονηροῦ
  choice: sitere n’aka ajọ onye ahụ
  rationale: Na-echekwa echiche ἐκ banyere isi mmalite, ma na-egosipụta τοῦ πονηροῦ dị ka onye ọjọọ n’usoro okwu Jọn.
- source_word: ἔσφαξεν
  choice: gbuo ... n’ụzọ obi ọjọọ
  rationale: σφάζω siri ike ma doo anya karịa naanị ‘igbu’; nkebi a na-ebupụta ịdị egwu na ime ihe ike dị n’okwu Grik.
- source_word: ἀδελφὸν αὐτοῦ
  choice: nwanne ya
  rationale: Ọ bụ nsụgharị kpọmkwem na nke e ji eme ihe n’Igbo, ma na-echekwa mmekọrịta ezinụlọ ahụ.
- source_word: χάριν τίνος
  choice: Gịnịkwa mere
  rationale: Ọ bụ ụzọ Igbo sitere n’okike isi jụọ ihe kpatara omume ahụ.
- source_word: τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: omume ya dị njọ
  rationale: ‘Omume’ na-egosipụta ọrụ ma ọ bụ ihe mmadụ mere n’ọnọdụ omume ọma na ihe ọjọọ; ‘dị njọ’ na-enye ọdịiche doro anya.
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: ma nke nwanne ya ziri ezi
  rationale: Na-echekwa mwepụ aha ‘omume’ dị na Grik, ma na-egosipụta ịdị ziri ezi nke omume nwanne ya.
theological_decisions:
- issue: Ma τοῦ πονηροῦ ọ na-ezo aka n’ajọ onye ahụ ma ọ bụ n’ihe ọjọọ n’ozuzu ya
  choice: ajọ onye ahụ
  alternative: ihe ọjọọ
  rationale: N’akwụkwọ Jọn, okwu a nwere mkpụrụokwu njirimara na-ezokarị aka n’ajọ onye ahụ dị ka onye; ihe odide ala peeji na-echekwa nghọta nke ọzọ.
- issue: Ike okwu σφάζω
  choice: gbuo n’ụzọ obi ọjọọ
  alternative: gbuo
  rationale: Nhọrọ a na-echekwa ihe ike na ịdị egwu nke ngwaa Grik n’enweghị okwu ochie ma ọ bụ nkọwa iwu agbakwunyere.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘Ken’ dịka ụdị aha Kain a na-ahụkarị n’Igbo. E debere ọdịiche dị n’etiti ajọ omume Ken na omume ezi omume nke nwanne ya, ma chekwaa mgbagwoju anya dị na τοῦ πονηροῦ site n’ihe odide ala peeji.
