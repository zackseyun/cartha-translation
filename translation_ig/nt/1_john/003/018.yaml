base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: ig
  text: Ụmụntakịrị[a], ka anyị ghara ịhụ n’anya n’okwu, ọ bụghịkwa n’okwu ọnụ[b], kama n’omume na n’eziokwu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ụmụ m.” Okwu Grik a bụ mkpọku ịhụnanya, ọ bụghị naanị ịkpọ ụmụaka n’afọ.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ pụtara n’ụzọ nkịtị, “n’ire.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n’ihe anyị na-eme na n’eziokwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: Ụmụntakịrị
  rationale: Okwu a bụ mkpọku dị nro nke onye dere akwụkwọ ji akpọ ndị ọ na-elekọta. “Ụmụntakịrị” na-echekwa echiche nke ụmụ na ịdị nro dị n’okwu Grik ahụ, n’agbanyeghị na ọ bụghị nanị ụmụaka n’afọ ka a na-ekwu maka ha.
- source_word: μὴ ἀγαπῶμεν
  choice: ka anyị ghara ịhụ n’anya
  rationale: Nke a na-egosipụta ndụmọdụ ma ọ bụ agbamume onye na-ekwu tinyere onwe ya na ya, dịka subjunctive onye mbụ ọtụtụ dị na Grik si mee.
- source_word: λόγῳ
  choice: n’okwu
  rationale: λόγος ebe a na-ezo aka n’ihe a na-ekwu. “N’okwu” na-echekwa nkenke na ntụnyere dị n’etiti okwu na omume.
- source_word: μηδὲ τῇ γλώσσῃ
  choice: ma ọ bụ n’ire
  rationale: γλῶσσα pụtara “ire” n’ụzọ nkịtị, ma ebe a ọ na-anọchi anya okwu ọnụ. Ịhapụ ihe oyiyi nke ire na-echekwa nkwughachi okwu Grik ahụ; e tinyere nkọwa ọzọ n’ala peeji maka ọgụgụ dị mfe.
- source_word: ἀλλὰ
  choice: kama
  rationale: “Kama” na-egosipụta ntụgharị siri ike site n’ịhụnanya a na-ekwu naanị n’ọnụ gaa n’ịhụnanya a na-eme eme.
- source_word: ἐν ἔργῳ
  choice: n’omume
  rationale: ἔργον pụtara ọrụ, ihe e mere, ma ọ bụ omume. “N’omume” bụ Igbo doro anya nke na-egosi ịhụnanya e tinyere n’ọrụ.
- source_word: καὶ ἀληθείᾳ
  choice: na n’eziokwu
  rationale: “Eziokwu” na-echekwa isi ihe ἀλήθεια pụtara na mkpa okwu ahụ nwere n’ihe odide Jọn, kama ime ka ọ bụrụ naanị “obi eziokwu” ma ọ bụ “ezigbo ọchịchọ.”
theological_decisions:
- issue: Ihe “eziokwu” pụtara n’okwu “n’omume na n’eziokwu”
  choice: E debere “eziokwu” n’enweghị ịkọwa ya nanị dịka obi eziokwu ma ọ bụ enweghị aghụghọ.
  alternative: n’omume na n’obi eziokwu
  rationale: N’ihe odide Jọn, ἀλήθεια nwere ike ịgụnye ma ịdị adị n’ezie nke ịhụnanya ma nkwekọrịta ya na eziokwu Chineke. Nsụgharị ahụ na-ahapụ ike abụọ a ka ha dị.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a ma dị ùgwù dee ya. Ahịrịokwu ahụ na-echekwa mkpọku ịhụnanya, agbamume onye mbụ ọtụtụ, na ntụnyere dị n’etiti okwu ọnụ na omume. “N’ire” bụ ihe oyiyi siri ike mana o nwere ike ịdịtụ iche n’Igbo; ya mere e nyere “n’okwu ọnụ” dịka ọgụgụ ọzọ n’ala peeji.
