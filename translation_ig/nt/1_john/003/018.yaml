revisions:
- from: Ụmụntakịrị[a], ka anyị ghara ịhụ n’anya n’okwu ma ọ bụ n’ire[b], kama n’omume na n’eziokwu.[c]
  to: Ụmụntakịrị[a], ka anyị ghara ịhụ n’anya n’okwu, ọ bụghịkwa n’okwu ọnụ[b], kama n’omume na n’eziokwu.[c]
  rationale: The revision explicitly marks the Greek μηδέ (“nor”) and replaces the potentially ambiguous standalone “n’ire” with idiomatic “n’okwu ọnụ.” The footnote retains the literal Greek image of the tongue. No interpretive expansion has been made to “eziokwu.”
  reviewer_model: gpt-5.6-terra
