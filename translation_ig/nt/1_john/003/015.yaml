id: 1JN.3.15
reference: 1 John 3:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν ⸀αὐτῷ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: ig
  text: Onye ọ bụla kpọrọ nwanne ya asị[b] bụ ogbu mmadụ; unu makwaara na ogbu mmadụ ọ bụla enweghị ndụ ebighị ebi nke na-anọgide n’ime ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nke na-ebi n’ime ya.” Ngwaa Grik μένω bụ okwu Jọn na-ejikarị eme ihe, nke pụtara ịnọgide ma ọ bụ ịnọgide na-ebi.
    reason: lexical_alternative
  - marker: b
    text: N’ihe gbara amaokwu a gburugburu, “nwanne ya” yikarịrị ka ọ na-ezo aka n’onye kwere ekwe ibe ya; okwu Grik ahụ dị n’otu ọnụọgụ ma bụrụ nke nwoke.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: Onye ọ bụla kpọrọ ... asị
  rationale: Nkebiokwu a na-egosi ụdị mmadụ niile omume ịkpọ asị ji mara; nsụgharị a bụ Igbo nkịtị ma na-edobe ike nke participle dị ugbu a.
- source_word: ἀδελφὸν αὐτοῦ
  choice: nwanne ya
  rationale: “Nwanne” bụ okwu Igbo sitere n’okike nke nwere ike izo aka nwanne nwoke ma ọ bụ onye otu ezinụlọ/obodo okwukwe; ọ naghị amanye nkọwa karịa ihe gbara amaokwu ahụ gburugburu.
- source_word: ἀνθρωποκτόνος
  choice: ogbu mmadụ
  rationale: Nke a bụ okwu Igbo doro anya maka onye na-egbu mmadụ, ma na-edobe ịdị arọ nke ikpe omume dị n’okwu Grik ahụ.
- source_word: οἴδατε
  choice: unu makwaara
  rationale: “Unu” na-egosipụta onye nke abụọ n’ụbara nke ngwaa Grik; “-kwaara” na-ejikọta okwu a n’ụzọ eke na nkwupụta gara aga.
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: ogbu mmadụ ọ bụla enweghị
  rationale: Usoro a na-edobe universal πᾶς ma na-ekwu negation ahụ n’Igbo doro anya na nke eke.
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndụ na-adị ruo mgbe ebighị ebi, ma dabara n’ojiji Jọn.
- source_word: ἐν αὐτῷ μένουσαν
  choice: nke na-anọgide n’ime ya
  rationale: “Na-anọgide” na-edobe echiche nke ịnọgide/ịdịgide nke μένω, bụkwa okwu dị mkpa n’ihe odide Jọn.
theological_decisions:
- issue: Ókè ihe “nwanne ya” pụtara
  choice: E debere “nwanne ya” n’ahịrị bụ isi, ebe ihe gbara ya gburugburu nwere ike igosi onye otu obodo ndị kwere ekwe.
  alternative: onye kwere ekwe ibe ya
  rationale: Okwu Grik ahụ bụ masculine singular, ma n’ojiji Jọn ọ na-ezokarị aka n’onye otu obodo okwukwe. “Nwanne” na-edobe okwu mmekọrịta ahụ n’enweghị ịkachi nkọwa ya n’ahịrị bụ isi.
- issue: Nsụgharị nke μένω n’ihe odide Jọn
  choice: na-anọgide n’ime ya
  alternative: na-ebi n’ime ya
  rationale: “Na-anọgide” na-echekwa echiche nke ịga n’ihu ịnọ, n’enweghị ịgbanwe ya ka ọ bụrụ naanị ibi n’ime mmadụ.
- issue: Mmekọrịta ịkpọ asị na igbu mmadụ
  choice: bụ ogbu mmadụ
  alternative: dị ka ogbu mmadụ
  rationale: A naghị etinye “dị ka,” n’ihi na Grik na-ekwu njirimara ahụ ozugbo ma ghara ime ka ike okwu ahụ dị nro.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. “Unu” mere ka ụbara nke οἴδατε pụta ìhè. E debere ahịrịokwu ahụ n’ụdị siri ike nke isi mmalite, ma zere okwu ụka ochie ma ọ bụ nkọwa otu ụka pụrụ iche.
