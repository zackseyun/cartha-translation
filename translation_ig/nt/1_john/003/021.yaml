  text: ἀγαπητοί, ἐὰν ἡ καρδία ⸂μὴ καταγινώσκῃ ἡμῶν⸃, παρρησίαν ἔχομεν πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/021.yaml
  text: Beloved[a], if our heart does not condemn us, we have confidence before God[c][b],
translation:
  language: ig
  text: Ndị m hụrụ n’anya, ọ bụrụ na obi[c] anyị anaghị ama anyị ikpe[a], anyị nwere obi ike n’ihu Chineke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘obi anyị anaghị ebo anyị ebubo’ ma ọ bụ ‘obi anyị anaghị ahụ anyị ụta.’
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘anyị nwere nkwuwa okwu’ ma ọ bụ ‘anyị nwere ntụkwasị obi n’ihu Chineke.’
    reason: lexical_alternative
  - marker: c
    text: ‘Obi’ n’ebe a na-ezo aka n’ime mmadụ ma ọ bụ n’akọ na uche ya nke na-enyocha omume ya.
    reason: cultural_note
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Ndị m hụrụ n’anya
  rationale: Ọ bụ okwu a na-akpọ ọtụtụ ndị n’ịhụnanya. Nhọrọ a bụ Igbo dị ndụ ma debe njikọ ya na isiokwu ịhụnanya jupụtara n’akwụkwọ a.
- source_word: ἐὰν
  choice: ọ bụrụ na
  rationale: Ọ na-ewebata ọnọdụ nwere ike ịdị; ‘ọ bụrụ na’ bụ ụzọ Igbo nkịtị si kwuo ya.
- source_word: καρδία
  choice: obi
  rationale: ‘Obi’ na-edebe ihe atụ dị na Grik kama ịkọwa ya ozugbo dị ka ‘akọ na uche.’ N’ebe a, ọ na-arụ ọrụ dị ka ime mmadụ nke na-enyocha omume ya.
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: anyị amaghị anyị ikpe
  rationale: ‘Ịma ikpe’ na-egosipụta ịkatọ ma ọ bụ ikpe mmadụ ikpe, ma na-edebe ụda ikpe dị n’okwu Grik.
- source_word: παρρησίαν
  choice: obi ike
  rationale: N’ọnọdụ a, ọ pụtara nnwere onwe na ntụkwasị obi mmadụ nwere n’ihu Chineke. ‘Obi ike’ bụ okwu Igbo doro anya nke na-adịghị eme ka okwu ahụ daa ka mpako ma ọ bụ ọgụ.
- source_word: πρὸς τὸν θεόν
  choice: n’ihu Chineke
  rationale: Nke a na-egosipụta ọnọdụ mmadụ n’ebe Chineke nọ, kwekọọkwa na nyocha ime mmụọ a na-ekwu maka ya.
theological_decisions:
- issue: Ihe ‘obi’ (καρδία) na-anọchi anya ya
  choice: obi
  alternative: akọ na uche
  rationale: ‘Obi’ na-edebe okwu na ihe atụ Jọn ji mee ihe ma ghara ime ka ihe ọ pụtara bụrụ naanị akọ na uche; nkọwa ala peeji na-eme ka ọrụ ya n’ebe a doo anya.
- issue: Ụdị obi ike nke παρρησίαν na-egosi n’ihu Chineke
  choice: obi ike n’ihu Chineke
  alternative: nkwuwa okwu n’ebe Chineke nọ; ntụkwasị obi n’ihu Chineke
  rationale: Nhọrọ a na-edebe echiche nke nnwere onwe na enweghị ihere n’ihu Chineke, ma ọ naghị eme ka ọ bụrụ mpako ma ọ bụ nkwenye mmetụta uche karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A hapụrụ ihe atụ ‘obi’ na isi ederede, ebe a kọwara ọrụ ya n’ala peeji; a zere okwu ụka pụrụ iche nke otu denominashọn.
