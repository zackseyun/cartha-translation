id: 1JN.3.19
reference: 1 John 3:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἐν τούτῳ ⸀γνωσόμεθα ὅτι ἐκ τῆς ἀληθείας ἐσμέν, καὶ ἔμπροσθεν αὐτοῦ πείσομεν ⸂τὴν καρδίαν⸃ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/019.yaml
  text: By this we will know that we are from the truth[a], and before him we will persuade our hearts[b],
translation:
  language: ig
  text: Ọ bụ site na nke a ka anyị ga-amata na anyị sitere n'eziokwu[a], anyị ga-emekwa ka obi anyị kwenye n'ihu ya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị bụ ndị nke eziokwu,” ma ọ bụ, “anyị bụ nke eziokwu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anyị ga-eme ka obi anyị ruo ala n'ihu ya,” ma ọ bụ, “anyị ga-emesi obi anyị ike n'ihu ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Ọ bụ site na nke a
  rationale: Nke a na-egosi ụzọ ma ọ bụ ihe ndabere e ji amata ihe na-esote, ma na-edobe ike demonstrative nke okwu Grik ahụ.
- source_word: γνωσόμεθα
  choice: anyị ga-amata
  rationale: Nke a bụ nsụgharị kwụ ọtọ, nke sitere n'ụdị future nke γινώσκω, na-etinyeghị echiche nke mmalite usoro ịmata ihe.
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: anyị sitere n'eziokwu
  rationale: “Sitere n'eziokwu” na-edobe echiche isi mmalite ma ọ bụ ebe e si pụta nke ἐκ nwere, kama ịkọwa ya n'ụzọ ozizi sara mbara.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: n'ihu ya
  rationale: Nke a na-egosipụta ma ọnọdụ ma mmekọrịta nke ịnọ n'ihu mmadụ; n'ọnọdụ a onye ahụ bụ Chineke dịka ihe gbara amaokwu ahụ gburugburu na-egosi.
- source_word: πείσομεν
  choice: anyị ga-eme ka ... kwenye
  rationale: Okwu a na-edobe isi echiche πείθω nke ime ka ihe kwenye, n'agbanyeghị na n'ọnọdụ a ọ pụkwara ịpụta ime ka obi ruo ala.
- source_word: τὴν καρδίαν ἡμῶν
  choice: obi anyị
  rationale: E debere singular mkpokọta nke Grik n'ụzọ Igbo dị n'okike; “obi anyị” nwere ike ịpụta obi onye ọ bụla n'ime ndị a na-ekwu maka ha.
theological_decisions:
- issue: Ihe “anyị sitere n'eziokwu” pụtara n'echiche Jọn
  choice: anyị sitere n'eziokwu
  alternative: anyị bụ ndị nke eziokwu; anyị bụ nke eziokwu
  rationale: E debere okwu gbasara isi mmalite ma ọ bụ njikọ na eziokwu, na-enweghị ịgbanwe ya ka ọ bụrụ nkwupụta doro anya banyere ịbụ ndị Chineke.
- issue: Ihe πείσομεν pụtara mgbe “obi” bụ ihe a na-eme ihe
  choice: anyị ga-eme ka obi anyị kwenye
  alternative: anyị ga-eme ka obi anyị ruo ala; anyị ga-emesi obi anyị ike
  rationale: Nhọrọ bụ isi na-edobe ihe πείθω pụtara n'ụzọ sara mbara ma ghara imechi mgbagwoju anya dị n'etiti ime ka obi kwenye na ime ka ọ ruo ala n'ihu Chineke.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. E ji “obi anyị” mee ihe dịka singular mkpokọta dabara n'Igbo, ma e debeghị nkọwa ozizi karịrị ihe ederede Grik kwuru.
