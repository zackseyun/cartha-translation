id: 1JN.3.2
reference: 1 John 3:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: ig
  text: Ndị m hụrụ n’anya, ugbu a anyị bụ ụmụ Chineke, ma ekpughebeghị ihe anyị ga-abụ. Anyị maara na ọ bụrụ na e kpughee ya[a][b], anyị ga-adị ka ya, n’ihi na anyị ga-ahụ ya otú ọ dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịghọta “ya” dịka “ihe anyị ga-abụ”: “ọ bụrụ na e kpughee ya.” Grik ekwughị isiokwu ngwaa ahụ kpọmkwem; ma ihe ndị gbara ya gburugburu na-akwado na ọ na-ezo aka na Kraịst.'
    reason: alternative_reading
  - marker: b
    text: Ọtụtụ nsụgharị na-asụgharị akụkụ a, “mgbe ọ ga-apụta.” Ma Grik kwuru n’ụzọ dị nso karị, “ọ bụrụ na e kpughee ya,” jiri otu ngwaa ahụ e ji mee ihe n’akụkụ mbụ nke amaokwu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Ndị m hụrụ n’anya
  rationale: Ọ bụ okwu ịhụnanya e ji akpọ ọtụtụ ndị; nsụgharị a bụ nke dị ugbu a, dị ùgwù, ma na-echekwa njikọ ya na ịhụnanya.
- source_word: νῦν
  choice: ugbu a
  rationale: Ọ na-egosi ọnọdụ ndị kwere ekwe n’oge a, n’iche na ihe a ga-ekpughe n’ọdịnihu.
- source_word: τέκνα θεοῦ
  choice: ụmụ Chineke
  rationale: “Ụmụ” na-egosi mmekọrịta ezinụlọ n’etinyeghị okike nwoke ma ọ bụ nwaanyị na-adịghị na Grik.
- source_word: οὔπω ἐφανερώθη
  choice: ekpughebeghị
  rationale: Ọ na-egosi na ihe ahụ apụtabeghị n’ụzọ a ga-amata ya; “kpughee” na-enyekwa ohere idebe otu mgbọrọgwụ okwu ahụ n’ebe abụọ nke amaokwu ahụ.
- source_word: τί ἐσόμεθα
  choice: ihe anyị ga-abụ
  rationale: Ọ na-ezo aka n’ụdị ma ọ bụ ọnọdụ anyị n’ọdịnihu, ọ bụghị nanị n’aha onye anyị ga-abụ.
- source_word: οἴδαμεν
  choice: Anyị maara
  rationale: Nke a na-enye kpọmkwem echiche ngwaa Grik nke nwere ihe ọ pụtara n’oge ugbu a.
- source_word: ἐὰν φανερωθῇ
  choice: ọ bụrụ na e kpughee ya
  rationale: Ọ na-echekwa ọnọdụ “ọ bụrụ na,” olu nnara nke ngwaa ahụ, na njikọ okwu ya na “ekpughebeghị.” Nnọchiaha Igbo “ya” na-echekwakwa na isiokwu Grik ekwughị kpọmkwem onye ma ọ bụ ihe ọ bụ.
- source_word: ὅμοιοι αὐτῷ
  choice: anyị ga-adị ka ya
  rationale: “Dị ka ya” na-egosi ezigbo oyiyi ma ọ bụ myirịta, ọ bụghị ịbụ otu ihe n’essence ma ọ bụ n’ọdịdị niile.
- source_word: ὀψόμεθα αὐτὸν
  choice: anyị ga-ahụ ya
  rationale: Ọ bụ nsụgharị doro anya ma dị nfe nke ngwaa ọdịnihu na ihe ọ na-arụtụ aka.
- source_word: καθώς ἐστιν
  choice: otú ọ dị
  rationale: Ọ na-egosi na a ga-ahụ ya n’ezi ọnọdụ ya, ma bụrụkwa okwu Igbo dị ndụ ma dị nfe.
theological_decisions:
- issue: Ihe nnọchiaha a na-ekwughị kpọmkwem na ἐὰν φανερωθῇ na-ezo aka na ya
  choice: E ji “ọ bụrụ na e kpughee ya” mee ka ebe ahụ nwee ike izo aka na Kraịst, dịka ihe ndị gbara ya gburugburu na-akwado.
  alternative: “Ọ bụrụ na e kpughee ya” nwekwara ike ịzo aka n’ihe anyị ga-abụ; ma ọ bụ a sụgharịa ya n’ụzọ nkọwa dịka “mgbe ọ ga-apụta.”
  rationale: Ịhụ “ya” na ịdị “ka ya” na-akwado na ọ bụ Kraịst ka a na-ekwu maka ya. Ma ebe Grik na-ekwughị isiokwu ahụ kpọmkwem, nnọchiaha Igbo na nkọwa ala peeji na-echekwa ezigbo mgbagwoju anya ahụ.
- issue: Ụdị myirịta ndị kwere ekwe na Kraịst n’ọdịnihu
  choice: “Anyị ga-adị ka ya” na-ekwupụta ezigbo mgbanwe na myirịta, ma ọ naghị ekwu na anyị ga-abụ otu onye ma ọ bụ otu ọdịdị zuru oke na ya.
  alternative: Nsụgharị siri ike karịa dịka “anyị ga-abụ kpọmkwem otú ọ dị.”
  rationale: ὅμοιοι pụtara ịdị ka onye ma ọ bụ iyi ya, ọ bụghị ịbụ otu ihe kpọmkwem; ya mere nsụgharị ahụ na-echekwa ike nke nkwa ahụ n’ebughị ihe karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ndị m hụrụ n’anya” na-edobe olu ịhụnanya nke onye dere akwụkwọ ahụ; “kpughee” na-edobe nkwughachi okwu dị na Grik; nnọchiaha “ya” na-enyekwa aka ichekwa mgbagwoju anya nke isiokwu a na-ekwughị kpọmkwem.
