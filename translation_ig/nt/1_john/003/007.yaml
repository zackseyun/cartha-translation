  text: τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: ig
  text: Ụmụntakịrị, unu ekwela ka onye ọ bụla duhie unu.[a] Onye na-eme ezi omume[b] bụ onye ezi omume, dị nnọọ ka onye ahụ[c] bụ onye ezi omume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu ekwela ka onye ọ bụla duga unu n’ụzọ na-ezighị ezi.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị okwu Grik a dịka “ikpe ziri ezi”; n’ebe a ọ pụtara omume kwụ ọtọ nke kwekọrọ n’ịbụ onye ezi omume.
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, “onye ahụ.” O yikarịrị ka ọ na-ezo aka na Kraịst, ọ bụ ezie na ụfọdụ na-aghọta ya dịka Chineke.
    reason: alternative_reading
lexical_decisions:
- source_word: τεκνία
  choice: Ụmụntakịrị
  rationale: Okwu a bụ aha ọkpụkpọ e ji ịhụnanya na ịdị nro kpọọ ụmụ; “Ụmụntakịrị” na-echekwa ma njikọ ezinụlọ ahụ ma nro dị n’ụdị okwu Grik ahụ, n’etinyeghị “m” nke na-adịghị na ihe e dere.
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: unu ekwela ka onye ọ bụla duhie unu
  rationale: Nke a bụ iwu mgbochi. “Duhie” nwere ike ịpụta ịghọgbu mmadụ ma ọ bụ iduga ya n’ụzọ na-ezighị ezi, ya mere ọ dabara n’ihe gbasara ozizi na omume n’ebe a.
- source_word: ὁ ποιῶν
  choice: Onye na-eme
  rationale: Ngwaa dị n’ụdị ugbu a na-egosi omume mmadụ na-eme dịka ụzọ ndụ ya, ọ bụghị nanị otu ihe o mere otu ugboro.
- source_word: τὴν δικαιοσύνην
  choice: ezi omume
  rationale: N’ebe a okwu ahụ na-elekwasị anya n’omume ziri ezi nke kwekọrọ n’ịbụ onye ezi omume; okwu a bụ nke ndị Igbo nke oge a na-aghọta nke ọma.
- source_word: δίκαιός ἐστιν
  choice: bụ onye ezi omume
  rationale: Nhọrọ a na-echekwa njikọ echiche dị n’etiti ime “ezi omume” na ịbụ “onye ezi omume,” dịka okwu Grik abụọ ahụ si nwee otu mgbọrọgwụ.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Ọ na-egosi ntụnyere doro anya, ya bụ na onye ahụ bụ ụkpụrụ e ji atụnyere onye na-eme ezi omume.
- source_word: ἐκεῖνος
  choice: onye ahụ
  rationale: Nke a na-echekwa nnọchiaha ngosi dị na Grik ma ghara ịkpọ onye a na-ekwu banyere ya Kraịst ma ọ bụ Chineke kpọmkwem n’ahịrịokwu bụ isi.
theological_decisions:
- issue: Onye ἐκεῖνος na-ezo aka na ya
  choice: E debere ya dịka “onye ahụ”; n’ọnọdụ okwu a, o yikarịrị ka ọ na-ezo aka na Kraịst.
  alternative: Ọ pụrụ izo aka na Chineke Nna, ma ọ bụ bụrụ ụzọ nsọpụrụ e si hapụ onye Chineke ahụ ka ọ ghe oghe.
  rationale: N’akwụkwọ 1 Jọn, a na-ejikarị ἐκεῖνος ezo aka na Jizọs mgbe a na-ekwu maka iṅomi omume ya. Ma ebe okwu Grik n’onwe ya akpọghị aha ahụ, ịsụgharị ya “onye ahụ” na-echekwa mgbagwoju anya ziri ezi kama idozi ya n’ime isiokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-eji “unu” mee ka ọkpụkpọ ọtụtụ mmadụ doo anya. E zere itinye aha Kraịst n’ahịrịokwu bụ isi ka e wee chekwaa oghere ntụaka dị na Grik.
