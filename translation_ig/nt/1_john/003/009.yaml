id: 1JN.3.9
reference: 1 John 3:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: ig
  text: Onye ọ bụla a mụrụ site na Chineke anaghị eme mmehie dịka omume ya[a], n’ihi na mkpụrụ ya na-anọgide n’ime ya[b]; ọ pụghịkwa ịnọgide na-eme mmehie[c], n’ihi na a mụrụ ya site na Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara okwu Grik nso karị, “anaghị eme mmehie.” O yikarịrị ka okwu Grik a na-ekwu maka ime mmehie dịka omume na-aga n’ihu, ọ bụghị naanị otu mmehie e mere otu mgbe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “na-ebi n’ime ya.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị karị, “ọ pụghị ime mmehie.” N’ọnọdụ a, infinitive ugbu a n’asụsụ Grik nwere ike ịpụta “ịnọgide na-eme mmehie.”
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος
  choice: Onye ọ bụla a mụrụ
  rationale: Nke a na-egosi onye ọ bụla so n’òtù ndị a mụrụ, ma na-echekwa echiche nke ọmụmụ mere eme nke nsonaazụ ya ka dị ugbu a.
- source_word: ἐκ τοῦ θεοῦ
  choice: site na Chineke
  rationale: N’okwu Jọn banyere ọmụmụ ọhụrụ, ἐκ na-egosi isi mmalite; “site na Chineke” bụ Igbo doro anya ma bụrụkwa nke e ji asụkarị.
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: anaghị eme mmehie ka ọ bụrụ omume ya
  rationale: Nkebi a na-egosi ime mmehie dịka ụzọ ndụ ma ọ bụ omume na-aga n’ihu, ọ bụghị naanị otu mmehie e mere otu mgbe.
- source_word: σπέρμα αὐτοῦ
  choice: mkpụrụ ya
  rationale: A hapụrụ ihe atụ nkịtị nke σπέρμα dịka “mkpụrụ,” ebe ọ bụ na amaokwu ahụ akọwaghị kpọmkwem ma ọ bụ okwu Chineke, ndụ Chineke, ma ọ bụ ihe ọzọ.
- source_word: ἐν αὐτῷ μένει
  choice: na-anọgide n’ime ya
  rationale: “Na-anọgide” na-egosipụta ịdịgide nke μένω n’Igbo dị ugbu a ma doo anya.
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: ọ pụghị ịnọgide na-eme mmehie
  rationale: Present infinitive ἁμαρτάνειν n’ọnọdụ a nwere ike igosi omume na-aga n’ihu; “ịnọgide na-eme mmehie” na-echekwa echiche ahụ n’enweghị ikwu na onye ahụ apụghị ime otu mmehie ọbụla.
- source_word: γεγέννηται
  choice: a mụrụ ya
  rationale: N’agbanyeghị na Igbo anaghị egosipụta perfect tense n’otu ụzọ ahụ Grik si eme, ọnọdụ na nkwughachi okwu a na-egosi ọmụmụ mere eme nke ọnọdụ ya ka dị.
theological_decisions:
- issue: Ma amaokwu a ọ na-akụzi na onye a mụrụ site na Chineke apụghị ime mmehie ọbụla, ka ọ bụ na ọmụmụ site na Chineke ekwekọghị na ibi ndụ mmehie na-aga n’ihu
  choice: Isi ederede na-ekwu maka ime mmehie dịka omume ma ọ bụ ụzọ ndụ na-aga n’ihu.
  alternative: Ịghọta ya dịka enweghị ike ime otu mmehie ọbụla.
  rationale: Present-tense ποιεῖ na ἁμαρτάνειν, tinyere ọnọdụ akwụkwọ ozi ahụ, kwadoro echiche nke omume na-aga n’ihu. Nke a na-echekwa esemokwu dị n’etiti okwu a na 1 Jọn 1:8–2:1 kama idozi ya n’ụzọ na-adịghị n’ederede.
- issue: Ihe “mkpụrụ ya” pụtara
  choice: E debere ihe atụ ahụ dịka “mkpụrụ ya” n’isi ederede.
  alternative: Ịkọwa ya dịka okwu Chineke, ndụ Chineke, ma ọ bụ ọdịdị Chineke.
  rationale: Ederede Grik akọwaghị kpọmkwem ihe σπέρμα na-anọchi anya ya; ya mere, ịhapụ ihe atụ ahụ na-egbochi itinye nkọwa ozizi nke ederede ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ya. A họọrọ “ka ọ bụrụ omume ya” iji kọwaa omume mmehie na-aga n’ihu n’ụzọ onye Igbo nkịtị ga-aghọta, ebe ihe ndị ọzọ ga-ekwe omume dị na nkọwa ala peeji.
