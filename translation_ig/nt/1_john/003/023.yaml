reference: 1 John 3:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: ig
  text: 'Nke a bụkwa iwu ya: ka anyị kwere n’aha Ọkpara ya[b], Jizọs bụ Mesaya[a], hụkwa ibe anyị n’anya, dịka o nyere anyị iwu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya “Jizọs Kraịst.” N’asụsụ Grik, Χριστός bụ aha-ọkwa pụtara “Mesaya,” ya bụ, Onye E Tere Mmanụ.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụ “tụkwasị obi n’aha Ọkpara ya.” “Aha” n’ebe a na-anọchi anya onye Jizọs bụ na ikike ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολή
  choice: iwu
  rationale: “Iwu” bụ okwu Igbo doro anya nke na-egosi ihe e nyere n’ike; e debere ya n’otu n’ebe abụọ ahụ dịka Grik si dị.
- source_word: ἵνα πιστεύσωμεν
  choice: ka anyị kwere
  rationale: Mgbe okwu “Iwu ya bụkwa nke a” gasịrị, “ka anyị kwere” na-egosi ọdịnaya na ike nke iwu ahụ n’Igbo dị mfe ma kwekọọ na subjunctive Grik.
- source_word: πιστεύω τῷ ὀνόματι
  choice: kwere n’aha
  rationale: Nke a na-echekwa ụzọ Jọn si ekwu maka okwukwe a tụkwasịrị n’Onye aha ahụ na-anọchi anya, ọ bụghị naanị ikweta na aha ahụ bụ eziokwu.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: Ọkpara ya
  rationale: “Ọkpara ya” bụ ụzọ e si akọwa mmekọrịta pụrụ iche nke Jizọs na Chineke n’Igbo Akwụkwọ Nsọ; mkpụrụedemede ukwu na-egosi na ọ bụ aha-ọkwa Kraịst.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mesaya
  rationale: “Mesaya” na-eme ka Χριστός pụta dịka aha-ọkwa, ebe “bụ” na-eme ka usoro ahụ daa nke ọma n’Igbo ma ghara ime “Mesaya” ka ọ bụrụ aha ezinụlọ.
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: hụkwa ibe anyị n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo ịhụnanya mmadụ na ibe ya; “-kwa” jikọtara akụkụ abụọ nke iwu ahụ.
- source_word: καθὼς
  choice: dịka
  rationale: “Dịka” na-echekwa ntụnyere na nkwekọrịta nke καθὼς.
- source_word: ἔδωκεν ἐντολὴν ἡμῖν
  choice: o nyere anyị iwu
  rationale: Nke a na-edobe aha ἐντολή na ngwaa δίδωμι (“nyere ... iwu”) ma bụrụkwa Igbo sitere n’okike.
theological_decisions:
- issue: Ntụgharị Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a Χριστός na-arụ ọrụ dịka aha-ọkwa nke na-akọwa Ọkpara ahụ; “Mesaya” na-echekwa ọrụ ahụ nke ọma, ebe “Kraịst” nwekwara ike ịdị ka akụkụ aha.
- issue: Ike nke πιστεύω τῷ ὀνόματι
  choice: kwere n’aha
  alternative: tụkwasị aha ... obi
  rationale: “Kwere n’aha” na-echekwa asụsụ nkà mmụta okpukpe nke Jọn na obosara okwu πιστεύω, n’akọwaghị ya karịa ihe Grik kwuru.
- issue: Otu iwu nwere akụkụ abụọ
  choice: otu “iwu” nke gụnyere ikwere na ịhụnanya
  alternative: iwu abụọ dị iche iche
  rationale: ἐντολή dị n’otu, ebe καί jikọtara πιστεύσωμεν na ἀγαπῶμεν dịka ọdịnaya abụọ nke otu iwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A na-eji “Ọkpara” dịka okwu Akwụkwọ Nsọ a maara nke ọma; ahịrịokwu ahụ na-edobe otu iwu nwere akụkụ abụọ ma na-ezere ịkọwa ihe karịrị Grik.
