base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: ig
  text: 'N’ihi na nke a bụ ozi ahụ unu nụrụ site ná mmalite[a]: na anyị kwesịrị ịhụrịta ibe anyị n’anya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ: “nke unu nụrụ site ná mmalite.”'
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụ: “ka anyị wee hụrịta ibe anyị n’anya” ma ọ bụ “ka anyị hụrịta ibe anyị n’anya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτι
  choice: N’ihi na
  rationale: N’ebe a, okwu a na-akọwa ihe e kwuru tupu ya; “N’ihi na” na-egosipụta njikọ nkọwa ahụ n’Igbo nkịtị.
- source_word: αὕτη ἐστὶν ἡ ἀγγελία
  choice: nke a bụ ozi ahụ
  rationale: “Ozi” bụ okwu Igbo doro anya maka ihe e ziri ma ọ bụ nkwupụta e nyere; nhazi ahụ na-edobe ịdị kpọmkwem nke okwu Grik.
- source_word: ἣν ἠκούσατε
  choice: unu nụrụ
  rationale: Oge gara aga dị mfe bụ ụzọ ebumpụta ụwa n’Igbo isi kwuo na ndị a natara ozi ahụ; ihe ndị gbara ya gburugburu na-egosi na ozi ahụ ka dị mkpa ugbu a.
- source_word: ἀπ’ ἀρχῆς
  choice: site ná mmalite
  rationale: Nke a na-echekwa akpaokwu Jọn na-ejikarị eme ihe nakwa echiche nke ihe a kụziri kemgbe mmalite.
- source_word: ἵνα ἀγαπῶμεν
  choice: ka anyị na-ahụrịta
  rationale: “Ka anyị na-” na-eburu ike nke subjunctive ahụ ma na-egosikwa omume na-aga n’ihu. Ọ na-ahapụkwa ntakịrị oghere dị n’etiti ịkọ ọdịnaya ozi ahụ na ịgba ume ka e mee ya.
- source_word: ἀλλήλους
  choice: ibe anyị n’anya
  rationale: “Ịhụrịta ibe anyị n’anya” bụ ụzọ Igbo doro anya na nke ebumpụta ụwa isi kwuo ịhụnanya mmadụ na ibe ya.
theological_decisions:
- issue: Ike na ọrụ nke ἵνα ἀγαπῶμεν ἀλλήλους
  choice: ka anyị na-ahụrịta ibe anyị n’anya
  alternative: “ka anyị wee na-ahụrịta ibe anyị n’anya” ma ọ bụ “anyị kwesịrị ịhụrịta ibe anyị n’anya”
  rationale: Isi ntụgharị ahụ na-ewere nkebiokwu a dị ka ọdịnaya na agbamume omume nke ozi ahụ, n’agbanyeghị na ἵνα nwekwara ike igosi nzube. Ihe odide ala peeji na-echekwa ụzọ abụọ ahụ n’emeghị ka otu nkọwa bụrụ naanị nke kwe omume.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Na-ahụrịta” na-egosipụta omume a na-aga n’ihu, ebe “ibe anyị” na-eme ka mmekọrịta dị n’etiti ndị kwere ekwe doo anya.
