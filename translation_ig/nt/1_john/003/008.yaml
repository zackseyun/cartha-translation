  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: ig
  text: 'Onye na-eme mmehie sitere n’Ekwensu[a][b], n’ihi na Ekwensu anọwo na-eme mmehie site ná mmalite. Ọ bụ maka nzube a ka e mere ka Ọkpara Chineke pụta ìhè[c]: ka o mebie ọrụ Ekwensu[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “onye na-eme mmehie.” Ụdị okwu Grik na-egosi omume na-aga n’ihu ma ọ bụ nke e ji amata mmadụ, ọ bụghị naanị otu mmehie e mere otu mgbe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “bụ nke Ekwensu.” Okwu Grik ἐκ pụtara “si na,” na-egosi isi mmalite ma ọ bụ njikọ n’omume na n’ime mmụọ.
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsị, “e kpughere Ọkpara Chineke” ma ọ bụ “Ọkpara Chineke bịara pụta.” Okwu Grik na-elekwasị anya n’ime ka a hụ ma mara ya.
    reason: lexical_alternative
  - marker: d
    text: A pụkwara ịsị, “ka o tọsa ọrụ Ekwensu.” Ngwaa Grik pụtara n’ụzọ nkịtị “ịtọpụ,” ma n’ebe a ọ pụtara ịkwatu, imebi, ma ọ bụ ibibi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: Onye na-eme mmehie mgbe niile
  rationale: Ụdị ngwaa dị ugbu a na-egosi omume na-aga n’ihu ma ọ bụ nke e ji amata mmadụ. ‘Mgbe niile’ na-eme ka nke a doo onye na-agụ Igbo anya, n’enweghị ikwu na ọ bụ naanị otu mmehie onye mere otu mgbe.
- source_word: ἐκ τοῦ διαβόλου
  choice: sitere n’Ekwensu
  rationale: Nke a na-edobe echiche ἐκ nke isi mmalite ma ọ bụ njikọ nke omume na mmụọ. Ọ naghị ekwu na Ekwensu mụrụ onye ahụ n’ụzọ anụ ahụ.
- source_word: διάβολος
  choice: Ekwensu
  rationale: ‘Ekwensu’ bụ aha a maara nke ọma n’Igbo maka onye ahụ a na-akpọ διάβολος n’ebe a, kama ịtụgharị ya naanị dị ka ‘onye nkwutọ.’
- source_word: ὅτι ἀπ’ ἀρχῆς
  choice: n’ihi na ... site ná mmalite
  rationale: ‘N’ihi na’ na-enye ihe kpatara okwu bu ya ụzọ, ebe ‘site ná mmalite’ na-edobe obosara na ntakịrị mgbagwoju anya nke okwu Jọn n’akọwaghị kpọmkwem mmalite ọ na-ekwu maka ya.
- source_word: ἁμαρτάνει
  choice: anọwo na-eme mmehie
  rationale: Ụdị a na-egosi omume malitere n’oge gara aga ma na-aga n’ihu, dịka ‘site ná mmalite’ chọrọ.
- source_word: εἰς τοῦτο
  choice: maka nzube a
  rationale: Nkebiokwu a na-atụ aka n’ihu n’ihe e ji ἵνα kọwaa; ‘maka nzube a’ na-egosipụta nzube ahụ n’ụzọ doro anya.
- source_word: ἐφανερώθη
  choice: pụtara ìhè
  rationale: N’Igbo nkịtị, ‘pụtara ìhè’ na-ekwupụta na e mere ka a hụ ma mara Ọkpara ahụ; ọ na-eburu echiche nke ngosipụta, ọ bụghị naanị ịhụ anya.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: Nke a bụ ụzọ dị nkenke ma dị ùgwù e si edobe aha Kraịst ahụ na mmekọrịta Nwa na Nna nke okwu Grik kwuru kpọmkwem.
- source_word: ἵνα λύσῃ
  choice: ka o mebie
  rationale: λύω pụtara ịtọpụ, ịkwatu, ma n’ebe a ọ bụ ime ka ọrụ Ekwensu ghara ịdị irè. ‘Mebie’ na-enye echiche nke ịkwatu ma ọ bụ ibibi ya n’Igbo dị mfe.
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: ọrụ Ekwensu
  rationale: ‘Ọrụ’ nwere ike ịgụnye ma omume Ekwensu ma ihe omume ndị ahụ na-eweta, ma na-edobe njikọ onye nwe ọrụ dị na Grik.
theological_decisions:
- issue: Ike okwu dị ugbu a banyere ime mmehie
  choice: 'A sụgharịrị ya dị ka omume na-aga n’ihu ma ọ bụ nke e ji amata mmadụ: ‘na-eme mmehie mgbe niile.’'
  alternative: Ịghọta ya dị ka mmehie ọ bụla mmadụ mere otu mgbe.
  rationale: Nke a na-edobe ọdịiche dị n’etiti ụzọ ndụ nke mmehie na otu mmehie e mere, ma na-echekwa esemokwu dị n’akwụkwọ ozi ahụ na 1 Jọn 1:8–2:2 n’enweghị idozi ya site n’itinye nkọwa ozizi ọzọ.
- issue: Ihe ‘sitere n’Ekwensu’ pụtara
  choice: Isi mmalite ma ọ bụ njikọ n’omume na n’ime mmụọ.
  alternative: Na Ekwensu mụrụ mmadụ ahụ n’ezie.
  rationale: ἐκ na-eji ihe atụ nke isi mmalite akọwa njikọ omume na nke mmụọ; ederede anaghị ekwu na mmadụ sitere n’Ekwensu n’ọmụmụ anụ ahụ.
- issue: Nzube e ji mee ka Ọkpara Chineke pụta ìhè
  choice: Ka o mebie ma mee ka ọrụ Ekwensu ghara ịdị irè.
  alternative: Naanị ikpughe ọrụ Ekwensu ka a hụ ya.
  rationale: Nkebiokwu ἵνα λύσῃ na-ekwu kpọmkwem banyere nzube nke ịtọsa ma ọ bụ ibibi ọrụ ndị ahụ, ọ bụghị naanị ime ka a mara ha.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ekwensu,’ ‘mmehie,’ na ‘Ọkpara Chineke’ bụ okwu Ndị Kraịst maara nke ọma. Ahịrịokwu ahụ na-edobe usoro echiche Grik, ma jiri ‘mgbe niile’ na ‘anọwo na-eme’ mee ka omume na-aga n’ihu doo anya n’Igbo.
