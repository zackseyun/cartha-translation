review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the indefinite-relative sense ('whatever'), the general-present verbs, the causal force of ὅτι ('n'ihi na'), and the paired actions of keeping God's commands and doing what pleases him. The object pronoun in 'anyị na-anata ya' is not required by the Greek or by natural Igbo and can create avoidable pronoun repetition beside 'n'aka ya.'
  naturalness: The wording is generally clear Standard Igbo. However, 'ihe na-atọ ya ụtọ n'ihu ya' is less idiomatic, since something that pleases him is more naturally described as pleasing 'n'anya ya' (in his sight). Omitting 'ya' after 'na-anata' gives a smoother expression while retaining the antecedent supplied by 'Ihe ọ bụla anyị na-arịọ.'
  terminology: '''iwu ya'' and ''na-edebe'' suitably render the Johannine command/keep terminology without importing an interpretive doctrinal framework. ''N''anya ya'' is the natural Standard Igbo equivalent here for ἐνώπιον αὐτοῦ; ''n''ihu ya'' remains a legitimate, more spatial alternative.'
  issues:
  - severity: low
    issue: The phrase 'ihe na-atọ ya ụtọ n'ihu ya' is stylistically awkward in this context.
    rationale: ἐνώπιον αὐτοῦ means 'in his sight/before him.' In Standard Igbo, 'n'anya ya' naturally conveys the evaluative sense required by what is pleasing to him.
  - severity: low
    issue: The explicit object pronoun in 'anyị na-anata ya n'aka ya' is unnecessarily repetitive.
    rationale: The Greek leaves the object of 'we receive' implicit, and Igbo naturally permits it to remain implicit after 'Ihe ọ bụla anyị na-arịọ.' This also avoids two adjacent pronouns with distinct referents.
  revised_text: Ihe ọ bụla anyị na-arịọ, anyị na-anata n'aka ya, n'ihi na anyị na-edebe iwu ya, na-emekwa ihe na-atọ ya ụtọ n'anya ya.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ihu ya.”
    reason: lexical_alternative
  revision_rationale: The revision retains the source text's scope, present-tense generality, causal connection, and ethical vocabulary. It uses the more idiomatic Igbo expression 'n'anya ya' for the evaluative sense of ἐνώπιον αὐτοῦ and retains 'n'ihu ya' as a transparent lexical alternative. The unnecessary explicit object after 'na-anata' is omitted for naturalness, without altering meaning.
