revisions:
- from: Ihe ọ bụla anyị na-arịọ, anyị na-anata ya n'aka ya, n'ihi na anyị na-edebe iwu ya, na-emekwa ihe na-atọ ya ụtọ n'ihu ya.[a]
  to: Ihe ọ bụla anyị na-arịọ, anyị na-anata n'aka ya, n'ihi na anyị na-edebe iwu ya, na-emekwa ihe na-atọ ya ụtọ n'anya ya.[a]
  rationale: The revision retains the source text's scope, present-tense generality, causal connection, and ethical vocabulary. It uses the more idiomatic Igbo expression 'n'anya ya' for the evaluative sense of ἐνώπιον αὐτοῦ and retains 'n'ihu ya' as a transparent lexical alternative. The unnecessary explicit object after 'na-anata' is omitted for naturalness, without altering meaning.
  reviewer_model: gpt-5.6-terra
