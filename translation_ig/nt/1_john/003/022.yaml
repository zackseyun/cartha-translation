  text: καὶ ὃ ⸀ἐὰν αἰτῶμεν λαμβάνομεν ⸀ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: ig
  text: Ihe ọ bụla anyị na-arịọ, anyị na-anata n'aka ya, n'ihi na anyị na-edebe iwu ya, na-emekwa ihe na-atọ ya ụtọ n'anya ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ihu ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἐὰν αἰτῶμεν
  choice: Ihe ọ bụla anyị na-arịọ
  rationale: Ngwakọta ὃ ἐὰν na-enye echiche nke ihe ọ bụla; “anyị na-arịọ” na-egosipụta arịrịọ n'ụzọ doro anya ma kwekọọ n'Igbo nkịtị.
- source_word: λαμβάνομεν ἀπ’ αὐτοῦ
  choice: anyị na-anata ya n'aka ya
  rationale: Oge ugbu a ebe a na-egosi eziokwu a na-ekwu n'ozuzu. “N'aka ya” na-egosipụta isi iyi nke ihe a natara, ebe “ya” na-eme ka ihe a na-anata pụta ìhè n'Igbo.
- source_word: ὅτι
  choice: n'ihi na
  rationale: Nke a na-edobe njikọ nke ihe kpatara ya nke dị na Grik, kama ime ka ọ bụrụ naanị ihe abụọ jikọrọ ọnụ.
- source_word: τὰς ἐντολὰς αὐτοῦ τηροῦμεν
  choice: anyị na-edebe iwu ya
  rationale: “Na-edebe” na-echekwa echiche nke τηρέω—idebe na ịgbaso—na-enweghị ime ka ọ bụrụ naanị okwu nkọwa; “iwu ya” bụ ụzọ Igbo doro anya si kwuo ἐντολάς.
- source_word: τὰ ἀρεστὰ ... ποιοῦμεν
  choice: na-emekwa ihe na-atọ ya ụtọ
  rationale: Nke a na-asụgharị adjective neuter plural ahụ n'ụzọ ebumpụta ụwa dị ka “ihe,” ma na-edobe ποιέω dị ka “ime.”
- source_word: ἐνώπιον αὐτοῦ
  choice: n'ihu ya
  rationale: “N'ihu ya” na-echekwa ihe oyiyi nke ịnọ n'ihu onye ahụ, ma na-ahapụkwa echiche nke ịbụ ihe a na-eme n'anya ya.
theological_decisions:
- issue: Mmekọrịta dị n'etiti ịnata ihe a rịọrọ na idebe iwu Chineke
  choice: E debere “n'ihi na” iji gosi na amaokwu ahụ kpọrọ idebe iwu ya na ime ihe na-atọ ya ụtọ ihe kpatara ịnata n'aka ya.
  alternative: Ịsụgharị ya dị ka naanị ihe abụọ na-esochi ibe ha, na-enweghị njikọ nke ihe kpatara ya.
  rationale: ὅτι na-egosi ihe kpatara ya kpọmkwem. Nsụgharị ahụ ekwesịghị ime ka esemokwu nkà mmụta okpukpe dị n'okwu ahụ dị nro, ma ọ bụ gbasaa ya ka ọ bụrụ usoro na-ekwe nkwa na a ga-enweta arịrịọ ọ bụla n'enweghị ọnọdụ ndị ọzọ dị n'akụkụ ederede.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “na-arịọ,” “na-anata,” na “na-edebe” iji gosipụta okwu a na-ekwu n'ozuzu n'oge ugbu a; e zere okwu ụka pụrụ iche ma ọ bụ nkọwa agbakwunyere.
