revisions:
- from: Ihe anyị hụrụ ma nụkwara ka anyị na-ekwusakwara unu, ka unu onwe unu na anyị nwee mmekọrịta[a]. N’ezie, mmekọrịta anyị bụ mmekọrịta anyị na Nna na Ọkpara ya, bụ Jizọs Mesaịa[b], nwere.
  to: Ihe anyị hụrụ ma nụ, anyị na-ekwusakwaara unu, ka unu kwa soro anyị nwee mmekọrịta[a]. N’ezie, mmekọrịta anyị bụ nke anyị na Nna na Ọkpara ya, bụ Jizọs Mesaịa[b].
  rationale: The revision corrects the defective final sentence and uses idiomatic Standard Igbo to express both the readers’ fellowship with the witnesses and the witnesses’ fellowship with the Father and the Son. It preserves the source’s repeated κοινωνία, the purpose relation introduced by ἵνα, and the titular rendering ‘Mesaịa.’
