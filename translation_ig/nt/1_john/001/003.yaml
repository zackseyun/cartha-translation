id: 1JN.1.3
reference: 1 John 1:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: ig
  text: Ihe anyị hụrụ ma nụ, anyị na-ekwusakwaara unu, ka unu kwa soro anyị nwee mmekọrịta[a]. N’ezie, mmekọrịta anyị bụ nke anyị na Nna na Ọkpara ya, bụ Jizọs Mesaịa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “mmekọrịta” dịka “ịdị n’otu,” “ikekọrịta,” ma ọ bụ “iso nwee oke”; okwu ahụ na-egosi ndụ na njikọ ndị ha na ibe ha na-ekerịta.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “Jizọs Kraịst.” Okwu Grik bụ Χριστός, bụ utu aha pụtara “Mesaịa,” ya bụ, Onye E Tere Mmanụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: Ihe
  rationale: “Ihe” na-edebe ntụaka ahụ n’ụdị sara mbara dịka nnọchiaha neuter Grik si dị, n’emeghị ka ọ ghọọ “onye.”
- source_word: ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: anyị hụrụ ma nụkwara
  rationale: Nke a na-egosipụta akaebe sitere n’ihe ndị dere akwụkwọ ahụ hụrụ ma nụ, ebe “-kwara” na-ejikọta omume abụọ ahụ n’Igbo dị mfe.
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: ka anyị na-ekwusakwara unu
  rationale: “Na-ekwusa” na-enye echiche nke ịgwa ndị ọzọ ihe ndị akaebe maara; “-kwara” na-anọchi καὶ nke na-egosi na a na-agwakwa ndị a.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” bụ ụzọ Igbo nkịtị si webata nzube.
- source_word: κοινωνίαν
  choice: mmekọrịta
  rationale: “Mmekọrịta” na-egosipụta ịdị n’otu, ikekọrịta ndụ, na iso ibe ha nwee oke, n’emeghị ka okwu ahụ bụrụ naanị mmekọrịta mmadụ na ibe ya ma ọ bụ naanị emume okpukpe.
- source_word: ἔχητε μεθ’ ἡμῶν
  choice: unu onwe unu na anyị nwee mmekọrịta
  rationale: Nhazi a na-egosipụta nke ọma na ndị a na-agwa okwu ga-eso ndị akaebe ahụ kerịta mmekọrịta ahụ; “onwe unu” na-ebupụta καὶ ὑμεῖς.
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: N’ezie, mmekọrịta anyị
  rationale: “N’ezie” na-egosipụta ike nkọwa na nkwusi okwu nke καὶ ... δὲ n’ebe a, ebe “mmekọrịta anyị” na-anọchi ἡ κοινωνία ἡ ἡμετέρα n’ụzọ Igbo doro anya.
- source_word: πατρὸς
  choice: Nna
  rationale: E ji mkpụrụedemede ukwu gosi na ọ bụ aha nsọ na-ezo aka na Chineke dịka Nna.
- source_word: υἱοῦ αὐτοῦ
  choice: Ọkpara ya
  rationale: “Ọkpara ya” na-edebe njikọ Nna na Ọkpara ma na-ada n’Igbo dị ebube ma doo anya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs Mesaịa
  rationale: “Mesaịa” na-ebupụta Χριστός dịka utu aha pụtara Onye E Tere Mmanụ, kama ime ka ọ bụrụ naanị akụkụ aha mmadụ.
theological_decisions:
- issue: Ihe Χριστός pụtara n’ebe a
  choice: Mesaịa
  alternative: Kraịst
  rationale: A họọrọ “Mesaịa” iji mee ka utu aha ahụ na ihe ọ pụtara pụta ìhè; “Kraịst” ka bụ nsụgharị ọdịnala a pụrụ iji.
- issue: Oke echiche κοινωνία
  choice: mmekọrịta
  alternative: ịdị n’otu; ikekọrịta; iso nwee oke
  rationale: “Mmekọrịta” nwere ike ịgụnye ma njikọ ndị kwere ekwe na ndị akaebe ahụ, ma njikọ ha na Nna na Ọkpara, n’emeghị ka otu akụkụ kpuchie akụkụ ndị ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E debere ugboro abụọ nke “mmekọrịta” iji gosipụta nkwughachi κοινωνία dị n’ederede Grik na njikọ dị n’etiti mmekọrịta ndị kwere ekwe na mmekọrịta ha na Nna na Ọkpara.
