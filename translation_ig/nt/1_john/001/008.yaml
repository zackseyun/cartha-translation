source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια ⸂οὐκ ἔστιν ἐν ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: ig
  text: Ọ bụrụ na anyị asị na anyị enweghị mmehie,[a] anyị na-eduhie onwe anyị, eziokwu ahụ adịghịkwa n’ime anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkọwa karị, “mmehie adịghị n’ime anyị”; Grik kwuru n’ụzọ nkịtị, “anyị enweghị mmehie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Ọ bụrụ na anyị asị
  rationale: Nke a na-egosipụta ọnọdụ e ji ‘ọ bụrụ na’ webata, ma na-ada nke ọma n'Igbo ugbu a.
- source_word: ἁμαρτίαν οὐκ ἔχομεν
  choice: mmehie adịghị n’ime anyị
  rationale: N'Igbo, ntụgharị a na-egosipụta na a na-ekwu maka ịdị adị nke mmehie n'ime mmadụ, ọ bụghị naanị otu mmehie e mere; ọ na-ezerekwa nkọwa na-adịghị eke, ‘anyị enweghị mmehie.’
- source_word: ἑαυτοὺς πλανῶμεν
  choice: anyị na-eduhie onwe anyị
  rationale: ‘Na-eduhie onwe anyị’ na-enye echiche doro anya nke mmadụ ime ka onwe ya kwere ihe na-abụghị eziokwu.
- source_word: ἡ ἀλήθεια
  choice: eziokwu ahụ
  rationale: ‘Ahụ’ na-egosipụta isiokwu Grik ahụ ma na-echekwa ịdị arọ nke okwu ‘eziokwu’ n'akwụkwọ Jọn.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: adịghịkwa n’ime anyị
  rationale: Nke a na-echekwa okwu Grik ‘n'ime anyị’ na echiche ya gbasara ọnọdụ dị n'ime mmadụ.
theological_decisions:
- issue: Ihe ‘mmehie’ pụtara n'okwu a
  choice: E debere ‘mmehie’ dị ka aha na-egosi mmehie nke dị n'ime mmadụ, ọ bụghị otu omume mmehie.
  alternative: ‘anyị emebeghị mmehie’ ma ọ bụ ‘anyị enweghị ọnọdụ mmehie’
  rationale: Grik kwuru ‘inwe mmehie,’ nke dị iche na ịsị na mmadụ emebeghị mmehie (lee amaokwu 10). A naghị akọwakarị ya karịa ka isi mmalite si kwuo.
- issue: Ihe okwu ‘eziokwu ahụ adịghị n’ime anyị’ pụtara
  choice: E debere okwu ahụ n'ụzọ dị mkpirikpi dịka Grik si dị.
  alternative: ‘eziokwu Chineke adịghị n’ime anyị’ ma ọ bụ ‘anyị anaghị ebi n’eziokwu’
  rationale: Okwu Jọn nwere ike ịgụnye ma eziokwu sitere n'aka Chineke ma ịbụ onye eziokwu; ịgbasawanye ya ga-ekpebi ihe Grik hapụrụ ka ọ nwee nghọta abụọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘mmehie adịghị n’ime anyị’ mee ka echiche nke inwe mmehie doo anya n'Igbo, ebe ihe e dere na Grik n'ụzọ nkịtị dị n'ala ala peeji.
