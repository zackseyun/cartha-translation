id: 1JN.1.7
reference: 1 John 1:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: ig
  text: Ma ọ bụrụ na anyị na-ejegharị n’ìhè, dị ka ya onwe ya dị n’ìhè, anyị na-enwe mmekọrịta n’etiti onwe anyị[a], ọbara Jizọs, Ọkpara ya, na-asachapụkwa anyị pụọ ná mmehie ọ bụla[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị na ibe anyị na-enwe mmekọrịta.” Ụfọdụ ndị na-akọwa ya dịka mmekọrịta dị n’etiti ndị kwere ekwe na Chineke, ma okwu nnọchiaha mmeghachi omume a n’asụsụ Grik na-ezokarị aka na mmekọrịta ndị kwere ekwe nwere n’etiti onwe ha.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “mmehie niile.” Okwu Grik ahụ nwere ike ịpụta mmehie ọ bụla n’otu n’otu, ma ọ bụ mmehie niile n’ozuzu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Ma ọ bụrụ na
  rationale: “Ma” na-egosi ọdịiche dị n’etiti okwu a na nkwupụta banyere ijegharị n’ọchịchịrị n’amaokwu bu ya ụzọ; “ọ bụrụ na” na-edobe ọnọdụ nke ἐὰν.
- source_word: ἐν τῷ φωτὶ
  choice: n’ìhè
  rationale: Nke a na-edobe ihe atụ Jọn ji “ìhè” mee, n’enweghị ịkọwa ihe atụ ahụ karịa ka isi mmalite si kwuo.
- source_word: περιπατῶμεν
  choice: anyị na-ejegharị
  rationale: “Na-ejegharị” na-echekwa ihe atụ nke ije dịka omume na ụzọ ndụ, ma na-egosikwa omume na-aga n’ihu.
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: dị ka ya onwe ya nọ n’ìhè
  rationale: “Ya onwe ya” na-egosipụta ntakịrị nkwusi ike dị na αὐτός; “dị ka” na-edobe ntụnyere ahụ n’ebughị nkọwa ọzọ tinye ya.
- source_word: κοινωνίαν ἔχομεν μετ’ ἀλλήλων
  choice: anyị na ibe anyị nwere mmekọrịta
  rationale: “Mmekọrịta” na-egosi ikere òkè na ịdị n’otu; “anyị na ibe anyị” na-edobe nghọta mmeghachi omume nke ἀλλήλων.
- source_word: τὸ αἷμα Ἰησοῦ τοῦ υἱοῦ αὐτοῦ
  choice: ọbara Jizọs, Ọkpara ya
  rationale: Usoro a na-edobe “ọbara” dịka isiokwu ahịrịokwu ahụ ma mee ka o doo anya na Jizọs bụ Ọkpara ya.
- source_word: καθαρίζει
  choice: na-asachapụkwa
  rationale: Okwu a na-eburu echiche nke ime ka ihe dị ọcha n’ụzọ omume na nke ofufe; ọdịdị “na-” na-ekwe ka a ghọta ya dịka omume na-aga n’ihu ma ọ bụ nke a na-eme mgbe niile.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: pụọ ná mmehie niile
  rationale: Nke a bụ Igbo doro anya maka nsachapụ site ná mmehie; “mmehie niile” nwere ike ịpụta mmehie ọ bụla n’otu n’otu ma ọ bụ mmehie n’ozuzu ya.
theological_decisions:
- issue: Onye “anyị na ibe anyị” (μετ’ ἀλλήλων) na-ezo aka na ya
  choice: mmekọrịta ndị kwere ekwe nwere n’etiti onwe ha
  alternative: mmekọrịta dị n’etiti ndị kwere ekwe na Chineke
  rationale: ἀλλήλων bụ okwu mmeghachi omume nke na-ezokarị aka n’ime ndị otu ahụ n’etiti onwe ha. Ọnọdụ sara mbara na-ekwu maka mmekọrịta ha na Chineke, ma ahịrịokwu a ekwesịghị ịgbanwe ka ọ kwuo nke ahụ n’ụzọ doro anya karịa Grik.
- issue: Ike nke oge ugbu a na καθαρίζει
  choice: nsachapụ na-aga n’ihu ma ọ bụ nke a na-eme mgbe niile, nke e gosipụtara site na “na-asachapụ”
  alternative: nsachapụ mere naanị otu ugboro, ma ọ bụ okwu gbasaa dịka “na-anọgide na-asachapụ”
  rationale: Oge ugbu a n’asụsụ Grik nwere ike igosi omume na-aga n’ihu ma ọ bụ nke a na-ahụ mgbe niile. “Na-asachapụ” na-echekwa ohere ahụ n’etinyeghị nkwusi ike karịrị nke isi mmalite.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ “ijegharị n’ìhè” na “ọbara ... na-asachapụ,” n’ihi na ha bụ ihe oyiyi dị mkpa n’akwụkwọ Jọn. E debere akara nkọwa ala peeji ozugbo n’ebe okwu ha na-akọwa dị.
