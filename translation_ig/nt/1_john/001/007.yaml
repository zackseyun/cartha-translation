revisions:
- from: Ma ọ bụrụ na anyị na-ejegharị n’ìhè, dị ka ya onwe ya nọ n’ìhè, anyị na ibe anyị nwere mmekọrịta[a], ọbara Jizọs, Ọkpara ya, na-asachapụkwa anyị pụọ ná mmehie niile[b].
  to: Ma ọ bụrụ na anyị na-ejegharị n’ìhè, dị ka ya onwe ya dị n’ìhè, anyị na-enwe mmekọrịta n’etiti onwe anyị[a], ọbara Jizọs, Ọkpara ya, na-asachapụkwa anyị pụọ ná mmehie ọ bụla[b].
