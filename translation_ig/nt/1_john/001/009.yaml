revisions:
- from: Ọ bụrụ na anyị ekwupụta mmehie anyị, ọ kwesịrị ntụkwasị obi, bụrụkwa onye ezi omume[a], ịgbaghara anyị mmehie anyị na ịsachapụ anyị ajọ omume niile.
  to: Ọ bụrụ na anyị ekwupụta mmehie anyị, ọ kwesịrị ntụkwasị obi ma bụrụkwa onye ezi omume[a]; ọ ga-agbaghara anyị mmehie anyị ma sachapụ anyị n’ajọ omume niile.
  rationale: The revision replaces the unnatural infinitive construction with a finite clause that naturally expresses the consequence/purpose in the conditional statement. It also revises the footnote to offer a direct lexical alternative for δίκαιος (“just”) rather than a narrowed judicial paraphrase. No disputed textual or theological claim is introduced.
