review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the conditional confession, divine faithfulness, forgiveness, and cleansing. However, the infinitives “ịgbaghara ... na ịsachapụ” do not form a natural or complete predicate after “ọ kwesịrị ntụkwasị obi, bụrụkwa onye ezi omume.” A finite verbal clause is needed to convey the Greek ἵνα clause idiomatically. The proposed wording retains the relationship expressed by ἵνα without adding a doctrinal interpretation.
  naturalness: “Ọ kwesịrị ntụkwasị obi, bụrụkwa onye ezi omume, ịgbaghara...” is structurally awkward in Standard Igbo. Using “ọ ga-agbaghara ... ma sachapụ...” makes the condition and its outcome clear and natural. “Sachapụ anyị n’ajọ omume niile” appropriately retains the cleansing image and the comprehensive scope.
  terminology: “Ekwupụta mmehie anyị,” “kwesịrị ntụkwasị obi,” “onye ezi omume,” and “agbaghara” are suitable Standard Igbo renderings. The footnote’s “onye na-ekpe ikpe ziri ezi” is too interpretive and narrows δίκαιος to a judicial activity; “onye ziri ezi” is the closer lexical alternative for “just.”
  issues:
  - severity: medium
    issue: The main clause uses infinitives where Standard Igbo requires a finite predicate.
    rationale: The phrase “ọ kwesịrị ntụkwasị obi, bụrụkwa onye ezi omume, ịgbaghara...” is not idiomatic syntax and leaves the relation of forgiveness and cleansing unclear. A finite clause resolves this while preserving the source sense.
  - severity: low
    issue: The lexical-alternative footnote paraphrases δίκαιος too narrowly.
    rationale: “Onye na-ekpe ikpe ziri ezi” means one who judges rightly, whereas δίκαιος describes being righteous/just. “Onye ziri ezi” preserves the alternative without imposing a judicial reading.
  revised_text: Ọ bụrụ na anyị ekwupụta mmehie anyị, ọ kwesịrị ntụkwasị obi ma bụrụkwa onye ezi omume[a]; ọ ga-agbaghara anyị mmehie anyị ma sachapụ anyị n’ajọ omume niile.
  revised_footnotes:
