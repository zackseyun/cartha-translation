base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: ig
  text: Ọ bụrụ na anyị ekwupụta mmehie anyị, ọ kwesịrị ntụkwasị obi ma bụrụkwa onye ezi omume[a]; ọ ga-agbaghara anyị mmehie anyị ma sachapụ anyị n’ajọ omume niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “onye ziri ezi”: “ọ kwesịrị ntụkwasị obi ma bụrụkwa onye ziri ezi; ọ ga-agbaghara anyị mmehie anyị ma sachapụ anyị n’ajọ omume niile.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: Ọ bụrụ na
  rationale: Ọ na-egosi ọnọdụ a na-atụ anya na ọ pụrụ ime, n’ebughị ụzọ kwuo na ọ na-eme mgbe niile.
- source_word: ὁμολογῶμεν
  choice: anyị ekwupụta
  rationale: “Ikwupụta” na-egosi ikweta mmehie ma were ọnụ kwuo ya; ọ dabara n’ọnọdụ a karịa okwu ga-egosi naanị ịmata ya n’obi.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: mmehie anyị
  rationale: Nke a bụ ntụgharị Igbo doro anya ma bụrụkwa nke a na-asụkarị maka ihe Grik ahụ pụtara.
- source_word: πιστός
  choice: kwesịrị ntụkwasị obi
  rationale: Ọ na-egosi na a pụrụ ịtụkwasị Chineke obi n’ihi na ọ na-emezu okwu ya ma na-agbanweghị n’àgwà ya.
- source_word: δίκαιος
  choice: onye ezi omume
  rationale: Nhọrọ a na-egosi izu oke nke àgwà Chineke n’ebughị ụzọ mechie ihe okwu ahụ pụtara n’ebe ikpe iwu naanị dị; a debere echiche “onye na-ekpe ikpe ziri ezi” n’ala peeji.
- source_word: ἵνα
  choice: ịgbaghara … na ịsachapụ
  rationale: Infinitive Igbo ndị a jikọtara omume abụọ ahụ na àgwà Chineke nke e kwuru tupu ha, ma ghara ịgbakwunye nkọwa siri ike ma ọ bụ nke iwu kpọmkwem na-adịghị n’ahịrị Grik.
- source_word: ἀφῇ
  choice: ịgbaghara
  rationale: N’ebe mmehie dị, nke a bụ okwu Igbo ziri ezi ma doo anya maka ịhapụ mmadụ mmehie ya.
- source_word: καθαρίσῃ
  choice: ịsachapụ
  rationale: Ọ na-echekwa onyinyo nke iwepụ unyi ma ọ bụ mmetọ nke mmehie, tinyere echiche ime ka mmadụ dị ọcha.
- source_word: ἀπὸ πάσης ἀδικίας
  choice: ajọ omume niile
  rationale: “Ajọ omume” bụ okwu Igbo ndị mmadụ na-aghọta ngwa ngwa, ma ọ ka nwere obosara nke omume na ọnọdụ na-ezighị ezi; “niile” na-anọchi πάσης.
theological_decisions:
- issue: Ihe δίκαιος pụtara n’ihe gbasara mgbaghara Chineke
  choice: onye ezi omume
  alternative: onye na-ekpe ikpe ziri ezi
  rationale: “Onye ezi omume” na-echekwa obosara nke àgwà ziri ezi nke Chineke. “Onye na-ekpe ikpe ziri ezi” bụkwa ihe okwu Grik ahụ pụrụ ịpụta, ma ọ pụrụ ime ka onye na-agụ ya were okwu ahụ naanị dịka okwu ụlọikpe; ya mere, e debere ya n’ala peeji iji chekwaa nghọta abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ekwupụta mmehie” n’ihi na ọ bụ okwu doro anya n’okwu okpukpe ma ndị nkịtị ka na-aghọta ya. A haziri ahịrịokwu ahụ ka ọ nọgide nso n’usoro na njikọ nke Grik, n’agbanyeghị na njikọ infinitive ahụ dị ntakịrị elu n’ọkwa asụsụ.
