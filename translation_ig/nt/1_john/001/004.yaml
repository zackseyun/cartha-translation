id: 1JN.1.4
reference: 1 John 1:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ταῦτα γράφομεν ⸀ἡμεῖς ἵνα ἡ χαρὰ ἡμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/004.yaml
  text: And we are writing these things so that our joy may be complete[a].
translation:
  language: ig
  text: Anyị na-edekwa ihe ndị a ka ọṅụ anyị wee zuo oke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide ochie nwere “ọṅụ unu” kama “ọṅụ anyị.”
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: na-
  rationale: E jikọtara ya na ngwaa dị ka njikọ nkịtị n'Igbo, iji jikọta okwu a na ama e nyere tupu ya.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nke a na-echekwa ụdị ọtụtụ nke nnọchiaha ngosi ahụ ma na-ezo aka n'ihe ndị ode akwụkwọ na-ede.
- source_word: γράφομεν
  choice: anyị na-edekwa
  rationale: Ụdị ugbu a na-egosi omume ide akwụkwọ ahụ; “na-ede” bụ ụzọ Igbo si ekwu ya n'ụzọ dị ndụ. Mgbakwunye “-kwa” na-eburu ọrụ njikọ καὶ n'ụzọ ebumpụta ụwa.
- source_word: ἡμεῖς
  choice: anyị
  rationale: Nnọchiaha doro anya na-echekwa nkwusi ike dị n'okwu Grik, n'agbanyeghị na akara onye dịkwa na ngwaa Igbo.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a bụ ụzọ Igbo nkịtị si egosi ebumnuche ma ọ bụ ihe a tụrụ anya na ọ ga-esi na ya pụta.
- source_word: χαρά
  choice: ọṅụ
  rationale: “Ọṅụ” bụ okwu Igbo doro anya, dị ugwu, nke na-enye echiche χαρά nke ọma.
- source_word: ἡμῶν
  choice: anyị
  rationale: Ihe odide SBLGNT nyere nwere ἡμῶν, ya bụ “anyị/anyị nwe,” ọ bụghị “unu.”
- source_word: ᾖ πεπληρωμένη
  choice: wee zuo oke
  rationale: Nke a na-egosi ọnọdụ nke ihe ruru n'uju ma ọ bụ n'ókè zuru ezu, ma na-ada nke ọma n'Igbo ugbu a.
theological_decisions:
- issue: Nnọchiaha dị na ἡ χαρὰ ἡμῶν
  choice: ọṅụ anyị
  alternative: ọṅụ unu
  rationale: A sụgharịrị ἡμῶν dị n'ihe odide isi dị ka “anyị.” E debeghị ọdịiche “unu” n'ahịrị isi, ma e gosiri ya n'okpuru peeji ka ọdịiche ihe odide ahụ ghara ifu.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. Ahịrịokwu ahụ na-echekwa njikọ ya na okwu ndị bu ya ụzọ, ụdị ọtụtụ nke “ihe ndị a,” na ọdịiche ihe odide banyere “anyị/unu.”
