id: 1JN.1.5
reference: 1 John 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: ig
  text: 'Nke a bụkwa ozi anyị nụrụ n''aka ya ma na-ekwusara unu[a]: Chineke bụ ìhè, ọ dịghịkwa ọchịchịrị ọ bụla n''ime ya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-eme ka unu mara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγελία
  choice: ozi
  rationale: “Ozi” bụ okwu Igbo dị mfe ma kwekọọ n’ihe a nụrụ ma na-ezisa; ọ na-arụ ọrụ nke ọma karịa okwu nwere naanị echiche nke ọkwa e mere n’ihu ọha.
- source_word: ἀκηκόαμεν
  choice: anyị nụrụ
  rationale: Igbo anaghị egosikarị ọdịiche nke perfect tense n’ụdị ngwaa dịka Grik; “anyị nụrụ” na-egosi ịnụ ihe gara aga nke ihe ọ nụrụ ka bụkwa ozi ha na-ekwusa ugbu a.
- source_word: ἀπ’ αὐτοῦ
  choice: n'aka ya
  rationale: E debere nnọchiaha ahụ dịka ọ dị na Grik, n’etinyeghị “Jizọs” ma ọ bụ “Ọkpara ahụ,” ka nsụgharị ghara idozi ihe ederede hapụrụ ka a ghọta site n’okirikiri ya.
- source_word: ἀναγγέλλομεν
  choice: na-ekwusara
  rationale: “Na-ekwusara” na-egosi ime ka ndị ọzọ nụ ozi a natara, ma bụrụkwa okwu Igbo sitere n’ọnụ mmadụ nke dabara n’usoro ahịrịokwu a.
- source_word: ὅτι
  choice: ':'
  rationale: Akara ntụpọ abụọ na Igbo na-ewebata ọdịnaya nke ozi ahụ n'ụzọ doro anya ma dị mfe, na-enweghị ịgbakwụnye nkọwa na-adịghị na Grik.
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: Chineke bụ ìhè
  rationale: E debere ihe atụ ahụ kpọmkwem. Enweghị edemede tupu “ìhè” n’asụsụ Grik, ya mere nsụgharị a na-ekwu banyere ọdịdị Chineke, ọ bụghị na-akpọ ya otu ìhè pụrụ iche.
- source_word: σκοτία
  choice: ọchịchịrị
  rationale: “Ọchịchịrị” na-echekwa ma ihe ọ pụtara n’ụzọ nkịtị ma ike ihe atụ ya n’akwụkwọ Jọn.
- source_word: ἐν αὐτῷ
  choice: n'ime ya
  rationale: Nke a bụ ụzọ Igbo e si egosipụta “in him” n’ụzọ na-adịghị akọwa ihe atụ ahụ karịa ka ederede si kwuo.
- source_word: οὐδεμία
  choice: ọ bụla
  rationale: 'Mgbe e jikọtara ya na “ọ dịghị,” okwu “ọ bụla” na-egosipụta nkwusi ike nke Grik: ọchịchịrị ọbụla adịghị n’ime ya.'
theological_decisions:
- issue: Ihe atụ nke na-ekwu “Chineke bụ ìhè”
  choice: E debere ya kpọmkwem dịka “Chineke bụ ìhè.”
  alternative: “Chineke bụ ìhè dị ọcha” ma ọ bụ “Chineke bụ ìhè dị nsọ.”
  rationale: Ịgbakwụnye “dị ọcha” ma ọ bụ “dị nsọ” ga-akọwa otu akụkụ nke ihe atụ ahụ ma belata obosara na ike okwu Grik.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E debere nnọchiaha na ihe atụ nke ederede mbụ n’enweghị ịgbakwụnye nkọwa ụka ma ọ bụ idozi ihe ederede hapụrụ ka ọ bụrụ ihe a ga-aghọta site n’okirikiri ya.
