revisions:
- from: Ọ bụrụ na anyị asị na anyị na ya nwere mmekọrịta, ma anyị ka na-ejegharị n’ọchịchịrị[a], anyị na-agha ụgha, anyị adịghịkwa etinye eziokwu n’ọrụ[b].
  to: Ọ bụrụ na anyị asị na anyị na ya nwere mmekọrịta, ma anyị na-ejegharị n’ọchịchịrị ahụ[a], anyị na-agha ụgha, anyị adịghịkwa etinye eziokwu n’ọrụ[b].
  rationale: The revision removes the unsupported continuative force of “ka na-” and restores the source’s definite expression “the darkness” with “ọchịchịrị ahụ.” It also updates footnote a so that it accurately explains the Greek article and supplies the corresponding Igbo alternative. The rendering of fellowship, lying, and practicing/doing the truth is retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:23:59Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the conditional structure, fellowship, the darkness metaphor, lying, and doing the truth. However, “ka na-ejegharị” adds continuative/contrastive force (“still/continue to”) not expressed by καὶ περιπατῶμεν, and the translation omits the Greek definite article in ἐν τῷ σκότει.
  naturalness: The Igbo is generally clear and appropriately dignified. “Na-ejegharị n’ọchịchịrị ahụ” is natural enough in this biblical ethical metaphor and avoids the added meaning of “ka na-.”
  terminology: “Mmekọrịta” is an acceptable contemporary rendering of κοινωνία in this context. “Etinye eziokwu n’ọrụ” naturally communicates the idiom ποιεῖν τὴν ἀλήθειαν; the literal alternative should remain footnoted. “Ọchịchịrị ahụ” better represents the marked Johannine expression “the darkness.”
  issues:
  - severity: medium
    issue: “ka na-ejegharị” adds “still/continue to.”
    rationale: The Greek joins the claimed fellowship and walking in darkness with καὶ (“and”), without a particle corresponding to Igbo “ka na-.” The addition can imply persistence despite a prior contrary state and should be removed.
  - severity: medium
    issue: The definite article in “ἐν τῷ σκότει” is not represented in the main text.
    rationale: The source reads “in the darkness.” While Igbo article use is not mechanically identical to Greek, “n’ọchịchịrị ahụ” appropriately retains the marked expression and its Johannine thematic force.
  - severity: low
    issue: Footnote a inaccurately describes the Greek article and gives a less direct alternative.
    rationale: The Greek does not merely contain a descriptive word; it contains the definite article τῷ. With “ọchịchịrị ahụ” in the main text, the useful alternative is “n’ọchịchịrị,” without the article.
  revised_text: Ọ bụrụ na anyị asị na anyị na ya nwere mmekọrịta, ma anyị na-ejegharị n’ọchịchịrị ahụ[a], anyị na-agha ụgha, anyị adịghịkwa etinye eziokwu n’ọrụ[b].
  revised_footnotes:
