source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: ig
  text: Ọ bụrụ na anyị asị na anyị na ya nwere mmekọrịta, ma anyị na-ejegharị n’ọchịchịrị ahụ[a], anyị na-agha ụgha, anyị adịghịkwa etinye eziokwu n’ọrụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ọchịchịrị.” N’asụsụ Grik, e ji mkpụrụokwu akọwapụta ihe kpọmkwem mee “ọchịchịrị”; n’otú Jọn si eji okwu a eme ihe, ọ pụrụ ịrụtụ aka n’ọnọdụ omume na nke ime mmụọ nke na-emegide Chineke.
    reason: lexical_alternative
  - marker: b
    text: N’okwu nkịtị, “anyị adịghịkwa eme eziokwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Ọ bụrụ na anyị asị
  rationale: Nke a na-edobe ọnọdụ nke okwu Grik ahụ n'ụzọ doro anya ma dịkwa mma n’Igbo, n’etinyeghị echiche siri ike karịa nke dị na isi mmalite.
- source_word: κοινωνίαν ἔχομεν
  choice: anyị na ya nwere mmekọrịta
  rationale: “Mmekọrịta” na-egosi ikekọrịta ndụ na ịdị n’otu nke κοινωνία pụtara, ma ọ ka bụ okwu ndị Igbo nke oge a na-aghọta nke ọma.
- source_word: μετ’ αὐτοῦ
  choice: na ya
  rationale: E debere nnọchiaha ahụ dịka ọ dị na Grik, kama ịkpọ onye ọ na-anọchi aha kpọmkwem.
- source_word: ἐν τῷ σκότει
  choice: n’ọchịchịrị
  rationale: Nke a na-edobe ihe atụ Jọn ji ọchịchịrị gosi ọnọdụ ime mmụọ na omume nke na-emegide Chineke, n’akọwaghị ya nanị dịka mmehie.
- source_word: περιπατῶμεν
  choice: anyị ka na-ejegharị
  rationale: “Na-ejegharị” na-edobe ihe atụ nke ụzọ mmadụ si ebi ndụ. “Ka” na-eme ka ọdịiche dị n’etiti ihe a na-ekwu na omume na-aga n’ihu pụta ìhè, dịka καὶ si arụ ọrụ n’ebe a.
- source_word: ψευδόμεθα
  choice: anyị na-agha ụgha
  rationale: Nke a bụ ụzọ Igbo nkịtị si kwuo omume ịgha ụgha, ma na-egosikwa omume dị ugbu a nke ngwaa Grik ahụ.
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: anyị adịghịkwa etinye eziokwu n’ọrụ
  rationale: 'Nke a na-egosipụta akpaalaokwu Grik ahụ n’Igbo sitere n’okike: eziokwu abụghị nanị ihe a na-ekwu, kama ọ bụ ihe a na-eme. Ihe e dere n’ala peeji na-edobe ntụgharị nkịtị ya.'
theological_decisions:
- issue: Ihe atụ ime mmụọ na omume nke ọchịchịrị
  choice: E debere “na-ejegharị n’ọchịchịrị” dịka ihe atụ.
  alternative: ibi na mmehie
  rationale: N’akwụkwọ Jọn, ọchịchịrị gụnyere ajọ omume, ụgha, na ịnọpụ n’ebe Chineke nọ. Ịsụgharị ya naanị dịka “mmehie” ga-emechi nghọta sara mbara na esemokwu dị n’ihe atụ ahụ.
- issue: Ime eziokwu
  choice: anyị adịghịkwa etinye eziokwu n’ọrụ
  alternative: anyị adịghịkwa eme eziokwu
  rationale: Nhọrọ a na-eme ka akpaalaokwu ahụ doo onye Igbo nke oge a anya n’agbanyeghị na ọ na-edobe eziokwu dịka ihe a na-eme. Ihe e dere n’ala peeji na-echekwa ọdịdị okwu Grik ahụ kpọmkwem.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ihe atụ “ijegharị n’ọchịchịrị,” ebe a sụgharịrị akpaalaokwu “ime eziokwu” n’ụzọ na-ada nke ọma n’Igbo ma chekwaa ọdịdị nkịtị ya n’ihe e dere n’ala peeji.
