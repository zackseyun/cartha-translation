    text: A pụkwara ịsụgharị ya, “n’ọchịchịrị.” N’asụsụ Grik, e ji mkpụrụokwu akọwapụta ihe kpọmkwem mee “ọchịchịrị”; n’otú Jọn si eji okwu a eme ihe, ọ pụrụ ịrụtụ aka n’ọnọdụ omume na nke ime mmụọ nke na-emegide Chineke.
    reason: lexical_alternative
  - marker: b
    text: N’okwu nkịtị, “anyị adịghịkwa eme eziokwu.”
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported continuative force of “ka na-” and restores the source’s definite expression “the darkness” with “ọchịchịrị ahụ.” It also updates footnote a so that it accurately explains the Greek article and supplies the corresponding Igbo alternative. The rendering of fellowship, lying, and practicing/doing the truth is retained.
