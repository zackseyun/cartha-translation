id: 1JN.1.1
reference: 1 John 1:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: ig
  text: Ihe ahụ dị site ná mmalite[a], nke anyị nụworo, nke anyị ji anya anyị hụworo, nke anyị lere anya nke ọma, nke aka anyị metụrụ, banyere okwu nke ndụ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, ‘Nke ahụ dị site ná mmalite.’ N'asụsụ Grik, nnọchiaha mmekọrịta e ji mee ihe anaghị akọwa okike; ya mere, ọ pụrụ izo aka n'ụzọ sara mbara n'ihe ndịozi na-agba ama banyere Ọkpara ahụ, kama ịkpọ ya ozugbo ‘onye ahụ.’
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịghọta ya dịka ‘Okwu nke ndụ.’ Nkebiokwu a pụrụ izo aka n'Ọkpara ahụ n'onwe ya, n'ụzọ na-eme ka Jọn 1:1 bata n'uche, ma ọ bụ n'ozi na-enye ndụ nke na-ekwu banyere ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: Ihe ahụ nke / nke
  rationale: Nnọchiaha njikọ Grik ahụ bụ nke na-adịghị akọwa nwoke ma ọ bụ nwaanyị; ‘ihe ahụ nke’ na-edobe obosara nke ihe ndịozi na-agba ama banyere ya, kama ịkọwa ya ozugbo dịka ‘onye ahụ.’
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: dịrị site ná mmalite
  rationale: Nke a na-egosipụta ịdị adị site ná mmalite ma na-edobe ụda okwu Jọn n'ụzọ doro anya.
- source_word: ἀκηκόαμεν
  choice: anyị nụrụ
  rationale: Igbo anaghị egosipụta perfect tense dịka Grik site n'ụdị ngwaa pụrụ iche; n'ọnọdụ a, ‘anyị nụrụ’ bụ okwu ebumpụta ụwa ma ihe gbara ya gburugburu na-egosi na akaebe ahụ ka dị irè.
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: anyị ji anya anyị hụ
  rationale: E debere ‘ji anya anyị’ iji kwusie ike na nke a bụ akaebe ndị ji anya ha hụ.
- source_word: ἐθεασάμεθα
  choice: anyị lere anya nke ọma
  rationale: Nkebi a na-egosi ile ihe anya nke ọma, ọ bụghị naanị ịhụ ya na mberede.
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: aka anyị metụkwara
  rationale: ‘Metụkwara’ na-edobe ihe akaebe anụ ahụ pụtara ma na-ejikọta ya nke ọma na usoro ahịrịokwu Igbo.
- source_word: περὶ
  choice: banyere
  rationale: ‘Banyere’ na-ewebata isiokwu akaebe ahụ n'Igbo dị ugbu a ma dị ùgwù.
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: okwu nke ndụ
  rationale: ‘Okwu’ nwere ike ịpụta okwu ma ọ bụ ozi, ya mere ọ na-edobe njikọ pụrụ ịdị na Ọkpara nakwa ozi na-enye ndụ, na-enweghị idozi mgbagwoju anya ahụ.
theological_decisions:
- issue: Ihe nnọchiaha ndị na-adịghị akọwa nwoke ma ọ bụ nwaanyị na λόγος na-ezo aka na ya
  choice: Jiri ‘Ihe ahụ nke’ na ‘okwu nke ndụ’ n'ahịrị bụ isi.
  alternative: ‘Onye ahụ nke dịrị site ná mmalite’ ma ọ bụ ịkọwa ‘Okwu’ dịka aha pụrụ iche nke na-ezo aka n'Ọkpara naanị.
  rationale: Ọ bụ ezie na okwu a nwere ihe ọ na-ekwu banyere Kraịst, Grik ji nnọchiaha neuter ma ọ naghị egosi mkpụrụedemede ukwu. Nsụgharị a na-edobe ma onye ahụ na ozi banyere ya n'echiche, kama idozi esemokwu ahụ n'otu ụzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro nkwughachi ‘nke anyị...’ chekwaa ụda na nhazi nke okwu Grik; e zere okwu ochie na nkọwa ụka nke ga-eme ka ihe odide ahụ kwuo karịa ihe o kwuru.
