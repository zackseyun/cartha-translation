reference: 1 John 1:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: ig
  text: E mere ka ndụ ahụ pụta ìhè[a], anyị ahụla ya, anyị na-agbakwa akaebe banyere ya ma na-ekwusakwaara unu ndụ ebighị ebi ahụ[b], nke ya na Nna nọ, nke e mekwara ka ọ pụta ìhè nye anyị—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “pụtara” ma ọ bụ “e mere ka ọ pụta ìhè.”
    reason: lexical_alternative
  - marker: b
    text: N’usoro ụtọasụsụ, e kwuru “ndụ ebighị ebi ahụ” dịka ihe; ma n’ọnọdụ a, okwu a na-ezo aka n’Onye ahụ bụ Ọkpara, onye ya na Nna nọ na onye e mere ka ọ pụta ìhè nye ndị ozi.
    reason: cross_reference
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: ndụ ahụ
  rationale: E ji “ahụ” debe nkọwa doro anya nke mmejuokwu Grik ma gosi na ọ bụghị naanị ndụ n’ozuzu, kama ọ bụ ndụ ahụ a kapịrị ọnụ nke a na-akọwa n’ọnọdụ a.
- source_word: ἐφανερώθη
  choice: pụtara ìhè / e mere ka ọ pụta ìhè
  rationale: Nkebiokwu a bụ Igbo dị ndụ nke na-egosi ime ka ihe zoro ezo pụta ìhè. N’oge nke abụọ, usoro “e mere ka” na-eme ka ọdịdị passive nke Grik pụta nke ọma.
- source_word: ἑωράκαμεν
  choice: anyị ahụla ya
  rationale: Ụdị perfect “ahụla” na-egosi ịhụ nke mere eme ma ka nwere mkpa ugbu a; “ya” na-eme ka ahịrịokwu ahụ bụrụ Igbo eke, ebe ihe ọ na-anọchi anya ka bụ “ndụ ahụ.”
- source_word: μαρτυροῦμεν
  choice: na-agbakwa akaebe
  rationale: “Ịgba akaebe” bụ okwu Igbo a na-aghọta nke ọma, na-edebekwa echiche onye hụrụ ihe ji ihe ọ hụrụ gbaa akaebe.
- source_word: ἀπαγγέλλομεν
  choice: na-ekwusakwa
  rationale: “Ikwusa” na-egosi izi ndị ọzọ ozi n’ihu ọha ma na-adị iche na “ịgba akaebe.”
- source_word: ὑμῖν
  choice: unu
  rationale: E tinyere ya dịka ihe nnata nke ngwaa “na-ekwusa,” n’usoro Igbo eke.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: ndụ ebighị ebi ahụ
  rationale: Nke a na-edebe ịdị kpọmkwem nke nkebiokwu ahụ ma ghara ịgbanwe “ndụ” ka ọ bụrụ aha mmadụ n’ahịrịokwu bụ isi.
- source_word: ἥτις
  choice: nke
  rationale: “Nke” na-alaghachi n’ụzọ ụtọasụsụ n’ebe “ndụ ebighị ebi ahụ” nọ, na-ahapụghị ma ọ bụ dozigharịa kpamkpam esemokwu dị n’etiti ihe e kwuru dịka ndụ na onye a na-ezo aka na ya.
- source_word: ἦν πρὸς τὸν πατέρα
  choice: ya na Nna nọ
  rationale: Nke a bụ ụzọ Igbo eke isi kwuo na ndụ ahụ nọnyere Nna, ma na-edebe mmekọrịta na ịdị nso nke πρὸς n’ọnọdụ a.
- source_word: τὸν πατέρα
  choice: Nna
  rationale: E dere ya dịka aha nsọ na-ezo aka n’ebe Chineke Nna nọ.
- source_word: ἡμῖν
  choice: nye anyị
  rationale: Nke a na-edebe onye e mere ka ndụ ahụ pụta ìhè nye ya, nke dị mkpa n’ihe gbasara akaebe ndị ji anya ha hụ.
theological_decisions:
- issue: Ma a ga-eme ka “ndụ ahụ” bụrụ okwu na-abụghị onye ma ọ bụ kpọọ ya onye kpọmkwem
  choice: E debere “ndụ ahụ” na “ndụ ebighị ebi ahụ” n’ahịrịokwu bụ isi.
  alternative: “Ọ pụtara ìhè” ma ọ bụ ịkpọ Ọkpara aha ozugbo.
  rationale: Grik ji ζωὴ, “ndụ,” ọ bụghị nnọchiaha nwoke ma ọ bụ aha Ọkpara. N’ọnọdụ ya, okwu ahụ na-ezo aka n’ebe Ọkpara nọ, ma ntụgharị ahụ ekwesịghị idozi ihe odide ahụ karịa ka isi mmalite si mee.
- issue: Otu a ga-esi gosipụta ịdị adị tupu oge n’okwu πρὸς τὸν πατέρα
  choice: “nke ya na Nna nọ”
  alternative: “nke nọ n’ihu Nna”
  rationale: Nhọrọ a na-ekwupụta na ndụ ahụ nọnyere Nna na mmekọrịta, ma ọ naghị agbakwunye nkọwa ozizi na-adịghị n’okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro nkwughachi nke Grik—ịhụ, ịgba akaebe, na ikwusa—ma jiri “ndụ ahụ” chekwaa omimi na esemokwu nkà mmụta okpukpe dị n’ederede.
