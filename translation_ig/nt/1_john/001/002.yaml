revisions:
- from: Ndụ ahụ pụtakwara ìhè[a]; anyị ahụla ya, na-agbakwa akaebe, na-ekwusakwa unu ndụ ebighị ebi ahụ[b], nke ya na Nna nọ, nke e mere ka ọ pụta ìhè nye anyị—
  to: E mere ka ndụ ahụ pụta ìhè[a], anyị ahụla ya, anyị na-agbakwa akaebe banyere ya ma na-ekwusakwaara unu ndụ ebighị ebi ahụ[b], nke ya na Nna nọ, nke e mekwara ka ọ pụta ìhè nye anyị—
  rationale: The revision corrects the passive sense of both instances of ἐφανερώθη, improves the dative construction for proclamation, and repairs the explanatory footnote. It retains the source text’s deliberate designation “life/the eternal life,” its eyewitness and testimony sequence, and its relational statement that this life was with the Father.
