id: 1JN.1.10
reference: 1 John 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: ig
  text: Ọ bụrụ na anyị asị na anyị emehiebeghị[a], anyị na-eme ka ọ bụrụ onye ụgha, okwu ya[b] adịghịkwa n’ime anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị emeghị mmehie.” Grik ji ngwaa perfect mee ihe; “anyị emehiebeghị” na-egosi ihe mere n’oge gara aga nke ka nwere mkpa ugbu a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “okwu ya” dịka “ozi ya.” Okwu Grik λόγος nwere ike ibu nke ọ bụla n’ime echiche abụọ ahụ; e debere “okwu” iji chekwaa otú Jọn si eji okwu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Ọ bụrụ na anyị asị
  rationale: Nke a na-edobe ọnọdụ nke njikọ ἐὰν na ngwaa subjunctive n’ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a; ọ naghị agbakwụnye echiche siri ike nke ‘ịzọrọ.’
- source_word: οὐχ ἡμαρτήκαμεν
  choice: anyị emehiebeghị
  rationale: Ụdị perfect nke ngwaa Grik na-ekwu maka mmehie e mere n’oge gara aga nke ka nwere mkpa ugbu a. ‘Anyị emehiebeghị’ na-eburu echiche ahụ n’ụzọ Igbo dị mkpirikpi, n’etinyeghị ‘ọ dịghị mgbe’ nke ga-agbatị ihe Grik kwuru.
- source_word: ψεύστην
  choice: onye ụgha
  rationale: ψεύστης bụ aha mmadụ, ‘onye ụgha’; e debeghị ya ka ọ bụrụ naanị nkọwa dị nro dịka ‘onye na-ezighị ezi.’
- source_word: ποιοῦμεν αὐτὸν
  choice: anyị na-eme ya
  rationale: Nke a na-edobe okwu Grik nke pụtara ime ma ọ bụ igosi mmadụ dịka ihe a kpọrọ ya n’ahịrịokwu a. Ya na ‘onye ụgha’ jikọrọ ọnụ, ọ na-egosi na nkwupụta ahụ na-eme ka Chineke pụta dịka onye ụgha, ọ bụghị na mmadụ na-agbanwe ọdịdị ya n’ezie.
- source_word: ὁ λόγος αὐτοῦ
  choice: okwu ya
  rationale: λόγος nwere ike ịpụta ‘okwu’ ma ọ bụ ‘ozi.’ ‘Okwu ya’ na-edobe obosara okwu Jọn na-eji ma ka bụ Igbo nkịtị.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: adịghịkwa n’ime anyị
  rationale: Nsụgharị a na-edobe echiche nke ihe dị n’ime mmadụ nke ἐν ἡμῖν nwere, n’etinyeghị ihe oyiyi ọzọ dịka ‘ibi n’ime anyị.’
theological_decisions:
- issue: Onye αὐτόν / αὐτοῦ na-ezo aka na ya
  choice: E debeghị aha Chineke n’ahịrịokwu ahụ; a sụgharịrị nnọchiaha ndị ahụ dịka ‘ya,’ ebe ihe ndị gbara amaokwu ahụ gburugburu na-egosi na ha na-ezo aka na Chineke.
  alternative: 'Itinye ‘Chineke’ kpọmkwem: ‘anyị na-eme Chineke onye ụgha, okwu Chineke adịghịkwa n’ime anyị.’'
  rationale: Ihe gbara 1 Jọn 1:5–10 gburugburu na-egosi na Chineke bụ onye a na-ekwu maka ya, ma Grik n’onwe ya ji nnọchiaha. Idebe ‘ya’ na-echekwa usoro na nrụgide nke ederede mbụ n’agbanyeghị na ihe ọ na-ezo aka na ya doro anya site n’okwu ndị gbara ya gburugburu.
- issue: Ike okwu ‘anyị na-eme ya onye ụgha’
  choice: 'E debeere nkwupụta ahụ ike ya: onye na-agọnahụ na ya emehiela na-eme ka Chineke pụta dịka onye ụgha.'
  alternative: ‘Anyị na-emeso ya dịka onye ụgha’ ma ọ bụ ‘anyị na-egosi ya dịka onye ụgha.’
  rationale: Nhọrọ bụ isi na-esochi ποιέω na predicate accusative nke ọma ma ghara ime ka ebubo ahụ dị nro. Ọ pụtaghị na mmadụ pụrụ ime ka Chineke ghọọ onye ụgha n’ezie, kama na nkwupụta ya na-emegide eziokwu Chineke.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. E zere okwu ụka pụrụ iche na nkọwa nke otu okwukwe. E tinyere akara [b] n’azụ ‘okwu ya,’ n’ihi na nkọwa ala peeji ahụ na-akọwa λόγος, ọ bụghị ‘onye ụgha.’
