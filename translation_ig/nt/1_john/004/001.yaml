id: 1JN.4.1
reference: 1 John 4:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: ig
  text: Ndị m hụrụ n’anya[a], unu ekwela mmụọ ọ bụla; kama, nwaleenụ mmụọ ndị ahụ ka unu mara ma hà sitere na Chineke[b], n’ihi na ọtụtụ ndị amụma ụgha apụwo gaa n’ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ezigbo ndị enyi m.” Okwu Grik ahụ pụtara n’ụzọ nkịtị “ndị a hụrụ n’anya.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, nwaleenụ isi mmalite ime mmụọ dị n’azụ nkwupụta amụma; akụkụ na-esote kpọrọ ndị mmadụ na-ekwu nkwupụta ndị ahụ “ndị amụma ụgha.”
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Ndị m hụrụ n’anya
  rationale: Ọ bụ okwu e ji ịhụnanya na-akpọ ọtụtụ ndị. Nhọrọ a bụ Igbo nkịtị, dị ugwu, ma na-echekwa njikọ ya na echiche ịhụnanya.
- source_word: παντὶ πνεύματι
  choice: mmụọ ọ bụla
  rationale: A hapụrụ okwu ahụ ka ọ bụrụ ‘mmụọ’ iji chekwaa etu ihe odide ahụ si kwuo maka isi mmalite ime mmụọ nke okwu ndị amụma, kama ime ka ọ bụrụ naanị ndị mmadụ ma ọ bụ okwu ha.
- source_word: πιστεύετε
  choice: unu ekwela ... ozugbo
  rationale: '‘Ikwere’ na-egosi ịnabata ihe dị ka eziokwu. ‘Ozugbo’ na-eme ka iwu a na-asụ n’Igbo bụrụ nke doro anya: a naghị ekwu ka ha jụ mmụọ niile, kama ka ha ghara ikwere ha n’enweghị nnwale.'
- source_word: δοκιμάζετε
  choice: nwaleenụ
  rationale: Ngwaa a pụtara inyocha ihe iji mata ma ọ bụ ezigbo ya. ‘Nwaleenụ’ na-echekwa ike iwu ahụ ma bụrụ okwu ndị mmadụ na-aghọta.
- source_word: τὰ πνεύματα
  choice: mmụọ ndị ahụ
  rationale: A jigidere ọtụtụ ‘mmụọ’ na usoro okwu karịrị nke mmadụ nke amaokwu ahụ, n’agbanyeghị na a na-enyocha ha site n’ọnụ ndị amụma.
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: ka unu mara ma hà si n’aka Chineke
  rationale: ‘Ma hà’ na-egosi ajụjụ nke a ga-ekpebi site na nnwale; ‘si n’aka Chineke’ na-egosi isi mmalite ma na-ada nke ọma n’Igbo.
- source_word: πολλοὶ ψευδοπροφῆται
  choice: ọtụtụ ndị amụma ụgha
  rationale: Nke a bụ ntụgharị kwụ ọtọ ma doo anya nke aha ndị na-ekwu amụma n’ụgha.
- source_word: ἐξεληλύθασιν
  choice: apụwo gaa
  rationale: 'Ụdị a na-egosi omume merela nke nsonaazụ ya ka dị ugbu a: ha apụwo, ha nọkwa na-arụ ọrụ n’ụwa.'
- source_word: εἰς τὸν κόσμον
  choice: gaa n’ụwa
  rationale: Ọ na-echekwa onyonyo nke ịpụ gaa n’etiti ụwa mmadụ n’enweghị ịgbakwunye nkọwa pụrụ iche banyere ‘usoro ụwa.’
theological_decisions:
- issue: Ihe ‘mmụọ’ na-ezo aka na ya
  choice: Mmụọ ma ọ bụ isi mmalite ime mmụọ ndị dị n’azụ okwu amụma, nke a na-amata site n’ule a na-anwale ndị amụma mmadụ
  alternative: Naanị ndị nkuzi mmadụ, ma ọ bụ naanị okwu amụma e kwuru
  rationale: Amaokwu ahụ kwuru ma ‘mmụọ’ ma ‘ndị amụma ụgha.’ Ya mere, ntụgharị a echekwala ọdịiche na esemokwu dị n’etiti ndị bụ mmadụ na isi mmalite ime mmụọ dị n’azụ nkwupụta ha, n’emeghị ka otu nkọwa mechie ndị ọzọ kpamkpam.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘Ndị m hụrụ n’anya’ maka olu ịhụnanya Jọn, ‘mmụọ’ iji chekwaa asụsụ ime mmụọ nke isi mmalite ahụ, na ụdị iwu ọtụtụ mmadụ ‘unu ekwela ... nwaleenụ.’
