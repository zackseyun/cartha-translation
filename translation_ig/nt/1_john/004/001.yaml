- from: Ndị m hụrụ n’anya[a], unu ekwela mmụọ ọ bụla ozugbo; kama, nwaleenụ mmụọ ndị ahụ ka unu mara ma hà si n’aka Chineke[b], n’ihi na ọtụtụ ndị amụma ụgha apụwo gaa n’ụwa.
  to: Ndị m hụrụ n’anya[a], unu ekwela mmụọ ọ bụla; kama, nwaleenụ mmụọ ndị ahụ ka unu mara ma hà sitere na Chineke[b], n’ihi na ọtụtụ ndị amụma ụgha apụwo gaa n’ụwa.
