review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the contrast between believing every spirit and testing the spirits, the divine-source criterion, and the statement that many false prophets have gone out into the world. However, “ozugbo” (‘immediately/at once’) adds a temporal qualification not present in μή ... πιστεύετε and should be removed. “Sitere na Chineke” expresses ἐκ τοῦ θεοῦ more directly than “si n’aka Chineke.”
  naturalness: The revised wording is clear, modern Standard Igbo, and retains an appropriately warm but dignified epistolary register. “Ndị m hụrụ n’anya” and “nwaleenụ” are natural in this context.
  terminology: “Mmụọ,” “ndị amụma ụgha,” and “Chineke” preserve the source terminology without reducing spirits to human teachers. The note appropriately explains the relationship between spirits and false prophets without making it a doctrinal resolution.
  issues:
  - severity: medium
    issue: Added temporal adverb “ozugbo”
    rationale: The Greek prohibits believing every spirit; it does not specify believing ‘immediately’ or ‘at once.’ The added adverb may soften or alter the command's scope.
  - severity: low
    issue: “si n’aka Chineke” is less direct for divine origin
    rationale: Although intelligible, “sitere na Chineke” more plainly represents ἐκ (‘from, out of’) and avoids the more agentive ‘from God’s hand’ nuance.
  - severity: low
    issue: Footnote wording can be made more idiomatic and precise
    rationale: “Okwu ndị a na-ekwu na ha bụ amụma” is awkward. “Nkwupụta amụma” directly expresses prophetic claims, and “akụkụ na-esote” avoids implying a separate later passage.
  revised_text: Ndị m hụrụ n’anya[a], unu ekwela mmụọ ọ bụla; kama, nwaleenụ mmụọ ndị ahụ ka unu mara ma hà sitere na Chineke[b], n’ihi na ọtụtụ ndị amụma ụgha apụwo gaa n’ụwa.
