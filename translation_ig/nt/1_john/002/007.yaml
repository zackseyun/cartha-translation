id: 1JN.2.7
reference: 1 John 2:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: ig
  text: Ndị m hụrụ n’anya, ọ bụghị iwu ọhụrụ ka m na-edegara unu, kama ọ bụ iwu ochie nke unu nwerela site ná mmalite. Iwu ochie ahụ bụ ozi ahụ unu nụrụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “okwu”: “Iwu ochie ahụ bụ okwu ahụ unu nụrụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Ndị m hụrụ n’anya
  rationale: Ọ bụ okwu a na-eji kpọọ ọtụtụ mmadụ n’ịhụnanya. Nsụgharị a na-edobe njikọ ya na ịhụnanya ma na-ada ka okwu ọzụzụ atụrụ dị ọkụ ma bụrụkwa Igbo e ji eme ihe taa.
- source_word: ἐντολήν
  choice: iwu
  rationale: “Iwu” bụ okwu Igbo doro anya maka ntụziaka e nyere mmadụ ka o debe; ọ na-edobekwa ịdị arọ nke okwu ahụ n’akwụkwọ Jọn.
- source_word: καινήν
  choice: ọhụrụ
  rationale: Nke a na-edobe mmegide doro anya dị n’etiti καινός na παλαιός, ya bụ “ọhụrụ” na “ochie.”
- source_word: γράφω
  choice: ka m na-edere
  rationale: Ụdị a na-egosi omume ide akwụkwọ nke onye dere ya na-eme ugbu a, ma na-adabara okwu e dere n’akwụkwọ ozi.
- source_word: παλαιάν / παλαιά
  choice: ochie
  rationale: “Ochie” na-emegide “ọhụrụ” kpọmkwem ma na-egosi na ndị na-agụ akwụkwọ ahụ enweela iwu a ogologo oge.
- source_word: εἴχετε
  choice: nke unu nwere
  rationale: N’agbanyeghị na Greek jiri imperfect, ọnọdụ a na-egosi ihe ha nwetara n’oge gara aga ma ka bụ nke ha; “nwere” na-enye echiche a n’Igbo n’enweghị okwu arọ.
- source_word: ἀπ’ ἀρχῆς
  choice: site ná mmalite
  rationale: A hapụrụ okwu ahụ n’obosara ya dịka ọ dị na Jọn, n’akọwaghị kpọmkwem mmalite e zoro aka na ya.
- source_word: λόγος
  choice: ozi
  rationale: N’ebe a, λόγος na-ezo aka n’ihe e kwusara nke ndị na-agụ ya nụrụ. “Ozi” na-eme ka echiche ahụ doo anya; “okwu” ka edere n’ala peeji dịka nhọrọ nwere ike ịdị.
- source_word: ἠκούσατε
  choice: unu nụrụ
  rationale: Aorist ahụ na-ezo aka n’oge ha natara ihe e kwusara; “unu nụrụ” bụ nsụgharị Igbo dị mfe ma kwụ ọtọ.
theological_decisions:
- issue: Ihe “site ná mmalite” na-ezo aka na ya
  choice: A hapụrụ ya dịka “site ná mmalite” n’akọwaghị mmalite ahụ kpọmkwem.
  alternative: “site ná mmalite ndụ unu n’ime Kraịst” ma ọ bụ “site ná mmalite nkwusa oziọma”
  rationale: Ihe gbara amaokwu ahụ gburugburu na-akwado mmalite nke ihe ha nụrụ, ma Greek akọwaghị ya nke ọma. Ya mere, nsụgharị ahụ na-edobe obosara na mgbagwoju anya nke okwu Jọn.
- issue: Mmekọrịta dị n’etiti “iwu ochie” na λόγος ha nụrụ
  choice: 'A sụgharịrị ya dịka nhata kpọmkwem: “Iwu ochie ahụ bụ ozi ahụ unu nụrụ.”'
  alternative: Ịgbasa ya dịka “iwu ochie ahụ bụ okwu/ozi nke unu nụrụ site ná mmalite”
  rationale: Greek na-eme ka iwu ochie ahụ na ihe ha nụrụ bụrụ otu, n’etinyeghị nkọwa ndị ọzọ. Nsụgharị ahụ anaghị atụkwasị nkọwa sitere n’amaokwu ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dịkwa mfe nghọta. “Ndị m hụrụ n’anya” na-edobe olu ịhụnanya nke onye dere akwụkwọ ahụ; ahịrịokwu ndị ọzọ na-agbaso usoro Igbo eke n’enweghị ịgbakwunye nkọwa okpukpe na-adịghị na isi mmalite.
