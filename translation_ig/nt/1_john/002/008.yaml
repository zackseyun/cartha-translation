id: 1JN.2.8
reference: 1 John 2:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: ig
  text: Ọzọkwa, ana m edegara unu iwu ọhụrụ, nke bụ eziokwu n’ime Kraịst[a] na n’ime unu, n’ihi na ọchịchịrị na-agabiga, ezi ìhè ahụ na-enwuworị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke bụ eziokwu n’iwu ahụ na n’ime unu,” ma ọ bụrụ na nnọchiaha ahụ na-ezo aka n’iwu ahụ kama na Kraịst n’onwe ya.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν
  choice: Ọzọkwa
  rationale: Ọ na-egosi na Jọn na-alaghachi n’okwu iwu ahụ ma na-ele ya anya n’ụzọ ọzọ; ọ naghị akọwacha njikọ ahụ karịa ka Grik si mee.
- source_word: ἐντολὴν καινὴν
  choice: iwu ọhụrụ
  rationale: Nke a bụ okwu Igbo doro anya ma kwekọọ n’iwu nke ọhụrụ n’ụdị ma ọ bụ n’ọnọdụ ya, ọ bụghị naanị iwu e nyere n’oge na-adịbeghị anya.
- source_word: γράφω
  choice: ana m edere
  rationale: Ọ na-egosipụta omume ide akwụkwọ ozi nke na-aga n’ihu n’oge onye dere ya na-ekwu okwu.
- source_word: ὅ ἐστιν ἀληθὲς
  choice: nke bụ eziokwu
  rationale: Ọ na-ejikọta okwu ahụ na echiche dum banyere iwu ahụ ma chekwaa nkwughachi echiche ‘eziokwu’ nke dị n’amaokwu ahụ.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: ‘Ya’ bụ nnọchiaha Igbo sitere n’okike na-adịghị egosi nwoke ma ọ bụ ihe; ọ na-enye ohere ka ihe a na-ezo aka na ya bụrụ Kraịst dịka ihe gbara amaokwu gburugburu na-egosi, ma ọ naghị ehichapụ mgbagwoju anya dị n’ahịrịokwu Grik.
- source_word: ἐν ὑμῖν
  choice: na n’ime unu
  rationale: Ọ na-echekwa myirịta ya na ‘n’ime ya’ ma na-egosi na eziokwu ahụ na-arụ ọrụ n’ime ndị a na-edegara akwụkwọ ozi.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe mere nkwupụta gara aga ji bụrụ eziokwu.
- source_word: ἡ σκοτία παράγεται
  choice: ọchịchịrị na-agabiga
  rationale: Ọ na-echekwa onyonyo nke ọchịchịrị na-agafe ma na-egosi na usoro ahụ ka na-aga n’ihu.
- source_word: τὸ φῶς τὸ ἀληθινὸν
  choice: ezi ìhè ahụ
  rationale: Ọ bụ okwu Igbo dị mfe nke na-echekwa okwu pụrụ iche Jọn ji ekwu maka ìhè bụ ezigbo ya, ma na-emegide ya na ọchịchịrị.
- source_word: ἤδη φαίνει
  choice: na-enwuworị
  rationale: Ọ na-egosi ma omume na-aga n’ihu ma na ìhè ahụ amalitelarị inwu ugbu a.
theological_decisions:
- issue: Ihe ἐν αὐτῷ (‘n’ime ya’) na-ezo aka na ya
  choice: E debere ‘n’ime ya,’ nke n’ebe a yikarịrị ka ọ na-ezo aka na Kraịst.
  alternative: 'Ọ pụrụ izo aka n’iwu ahụ: ‘nke bụ eziokwu n’iwu ahụ na n’ime unu.’'
  rationale: Ihe gbara amaokwu gburugburu na-akwado na nnọchiaha ahụ na-ezo aka na Kraịst na na iwu ahụ mezuru n’ime ya na n’ime ndị kwere ekwe. Ma usoro ahịrịokwu ahụ ka nwere ike ime ka ụfọdụ ghọta ya dịka ihe na-ezo aka n’iwu ahụ; ya mere, e chekwara nhọrọ ahụ na nkọwa ala peeji.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ chekwaa ọtụtụ mmadụ nke ὑμῖν, e jikwa ahịrịokwu dị mkpirikpi chekwaa myirịta na mmegide dị n’etiti ọchịchịrị na ìhè.
