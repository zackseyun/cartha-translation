revisions:
- from: Ha si n’etiti anyị pụọ, ma ha abụghị ndị nke anyị; n’ihi na a sị na ha bụ ndị nke anyị, ha gaara anọgide n’ebe anyị nọ[a]. Ma nke a mere ka e mee ka o doo anya[b] na ọ bụghị ha niile bụ ndị nke anyị.
  to: Ha si n’etiti anyị pụọ, ma ha abụghị ndị nke anyị; n’ihi na ọ bụrụ na ha bụ ndị nke anyị, ha gaara anọgide na anyị[a]. Ma ọ bụ ka e wee kpughee ha, ka o doo anya[b] na ọ bụghị ha niile bụ ndị nke anyị.
  rationale: The revision corrects the counterfactual conditional, renders remaining “with us” as communal association rather than location, and replaces the double-causative final wording with an idiomatic purpose clause that retains the disclosure/making-manifest sense. The repeated phrase “ndị nke anyị” is retained to preserve the source’s relational ambiguity and theological restraint. Footnote anchors remain attached to the relevant expressions.
