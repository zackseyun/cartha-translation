review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the departure from the community and the contrast between departure and genuine belonging. However, “n’ihi na a sị na” is not the appropriate conditional construction here; the Greek contrary-to-fact condition is better rendered with “ọ bụrụ na,” together with “gaara.” The final purpose clause should retain the purpose connection while naturally expressing the making-manifest idea.
  naturalness: Most of the wording is clear Standard Igbo. “Ha gaara anọgide na anyị” is more natural and relationally precise than “n’ebe anyị nọ.” Recasting the final clause avoids the cumbersome repeated causative sequence “ka e mee ka o doo anya.”
  terminology: “ndị nke anyị” suitably retains the community-belonging language without deciding later theological questions. “anọgide” appropriately preserves the Johannine sense of μένω. The revised purpose clause preserves the passive/revelatory force of φανερωθῶσιν without imposing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: The conditional phrase “n’ihi na a sị na ha bụ ndị nke anyị” is not the natural or accurate form for the Greek contrary-to-fact condition.
    rationale: εἰ ... ἦσαν, μεμενήκεισαν ἄν is a counterfactual condition. “N’ihi na ọ bụrụ na ... ha gaara ...” expresses this correctly in Standard Igbo.
  - severity: medium
    issue: “Ma nke a mere ka e mee ka o doo anya” is unnecessarily repetitive and weakens the specific revelatory sense of φανερωθῶσιν.
    rationale: 'The Greek states a purpose: that they might be made manifest, with the following content clause. “Ma ọ bụ ka e wee kpughee ha, ka o doo anya ...” keeps the purpose and the disclosure of the persons in idiomatic Igbo.'
  - severity: low
    issue: “n’ebe anyị nọ” can sound primarily locative for μεθ’ ἡμῶν.
    rationale: “na anyị” more directly expresses remaining with the community and is a natural equivalent of μεθ’ ἡμῶν.
  revised_text: Ha si n’etiti anyị pụọ, ma ha abụghị ndị nke anyị; n’ihi na ọ bụrụ na ha bụ ndị nke anyị, ha gaara anọgide na anyị[a]. Ma ọ bụ ka e wee kpughee ha, ka o doo anya[b] na ọ bụghị ha niile bụ ndị nke anyị.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ha gaara anọgide na anyị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka e kpughee ha,” ma ọ bụ “ka e mee ka ha pụta ìhè.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the counterfactual conditional, renders remaining “with us” as communal association rather than location, and replaces the double-causative final wording with an idiomatic purpose clause that retains the disclosure/making-manifest sense. The repeated phrase “ndị nke anyị” is retained to preserve the source’s relational ambiguity and theological restraint. Footnote anchors remain attached to the relevant expressions.
