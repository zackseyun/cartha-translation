source:
  edition: SBLGNT
  text: ἐξ ἡμῶν ἐξῆλθαν, ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ⸂ἐξ ἡμῶν ἦσαν⸃, μεμενήκεισαν ἂν μεθ’ ἡμῶν· ἀλλ’ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: ig
  text: Ha si n’etiti anyị pụọ, ma ha abụghị ndị nke anyị; n’ihi na ọ bụrụ na ha bụ ndị nke anyị, ha gaara anọgide na anyị[a]. Ma ọ bụ ka e wee kpughee ha, ka o doo anya[b] na ọ bụghị ha niile bụ ndị nke anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha gaara anọgide na anyị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka e kpughee ha,” ma ọ bụ “ka e mee ka ha pụta ìhè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: si n’etiti anyị / ndị nke anyị
  rationale: N’ebe mbụ, nkebiokwu a na-egosi isi n’etiti ọgbakọ pụọ; n’ebe ndị ọzọ, ọ na-egosi ịbụ ndị nke otu ahụ. Nsụgharị abụọ a na-edobe njikọ dị n’etiti ugboro ndị ahụ ma na-eme ka Igbo bụrụ nke e ji eme ihe n’ezie.
- source_word: ἐξῆλθαν
  choice: pụọ
  rationale: Okwu a na-egosi ịpụ n’ụzọ doro anya, na-akọwaghị ya ozugbo dị ka ịhapụ okwukwe.
- source_word: οὐκ ἦσαν ἐξ ἡμῶν
  choice: ha abụghị ndị nke anyị
  rationale: Nke a na-edobe asụsụ nke ịbụ ndị otu ahụ n’etinyeghị nkọwa gbasara ọnọdụ nzọpụta ha.
- source_word: εἰ γὰρ ἐξ ἡμῶν ἦσαν
  choice: n’ihi na a sị na ha bụ ndị nke anyị
  rationale: “A sị na” na-egosi ọnọdụ megidere ihe mere n’ezie, ebe “ndị nke anyị” na-aga n’ihu idobe otu asụsụ ahụ.
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: ha gaara anọgide n’ebe anyị nọ
  rationale: “Gaara” na-egosi ihe gaara eme ma ọnọdụ ahụ bụrụ eziokwu; “anọgide” na-echekwa echiche Johann banyere μένω, ya bụ ịnọgide ma ọ bụ ịnọgide na mmekọrịta.
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: Ma nke a mere ka e mee ka o doo anya
  rationale: E tinyere “nke a mere” iji mee ka nkebiokwu ahụ zuo oke n’Igbo, ebe “mee ka o doo anya” na-egosipụta passive φανερωθῶσιν n’asụsụ nkịtị.
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: na ọ bụghị ha niile bụ ndị nke anyị
  rationale: Nke a na-edobe oke okwu οὐκ…πάντες—ọ bụghị ha niile—ma ghara ịgbanwe ya ka ọ bụrụ nkwupụta sara mbara karịa nke Grik.
theological_decisions:
- issue: Ma a ga-akọwa “ndị nke anyị” n’ụzọ ga-ekpebi ajụjụ banyere ndị nọ n’ọgbakọ anya na ndị bụ ezi ndị kwere ekwe
  choice: E debere okwu mmekọrịta “ndị nke anyị.”
  alternative: “Ha abụghị ezi ndị kwere ekwe” ma ọ bụ “ọ dịghị mgbe ha bụ ndị a zọpụtara.”
  rationale: Grik na-ekwu maka ịbụ “ndị nke anyị,” ọ naghị eji kpọmkwem usoro nkà mmụta okpukpe nke oge ndị ọzọ. Nsụgharị a na-edobe esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ n’etinyeghị ozizi otu ụka.
- issue: Nzube ma ọ bụ nsonaazụ nke ἵνα
  choice: “ka e mee ka o doo anya”
  alternative: “n’ihi ya, e mere ka o doo anya”
  rationale: ἵνα nwere ike ịkọwa nzube ma ọ bụ nsonaazụ n’ọnọdụ a. “Ka” na-ahapụ njikọ ahụ ka ọ nwee obosara ya kama idozi ya naanị dị ka nsonaazụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. E ji “ndị nke anyị” chekwaa asụsụ mmekọrịta nke ἐξ ἡμῶν; e zere okwu ụka pụrụ iche na nkọwa ga-ekpebi ọnọdụ nzọpụta ndị ahụ.
