  text: I have written these things to you concerning those who are leading you astray[a].
translation:
  language: ig
  text: Edere m unu ihe ndị a banyere ndị na-eduhie unu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị na-aghọgbu unu” ma ọ bụ “ndị na-eduga unu n’ụzọ na-ezighị ezi.” Okwu Grik ahụ nwere ike ịpụta iduhie mmadụ ma ọ bụ iduga ya n’ụzọ na-ezighị ezi; ọ naghị ekpebi ma nduhie ahụ enweela ihe ịga nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ihe ndị a
  rationale: Okwu ngosi a dị n'ụdị ọtụtụ ma na-ezo aka n'ihe onye dere akwụkwọ ahụ kwurula tupu amaokwu a.
- source_word: ἔγραψα
  choice: Edere m
  rationale: Oge aorist na-egosi omume ide ihe e mechara; ụdị a bụ ụzọ Igbo nkịtị na nke doro anya si ekwu ya.
- source_word: ὑμῖν
  choice: unu
  rationale: Ọ bụ nnọchiaha na-egosi ndị e degaara akwụkwọ ozi ahụ.
- source_word: περὶ
  choice: banyere
  rationale: Ọ na-ewebata isiokwu onye dere akwụkwọ ahụ na-ekwu maka ya.
- source_word: τῶν πλανώντων ὑμᾶς
  choice: ndị na-eduhie unu
  rationale: Nke a na-akọwa ndị ọrụ ha bụ ime ka ndị na-agụ ya hapụ eziokwu. ‘Na-eduhie’ bụ okwu Igbo dị mfe nke na-eburu echiche nke iduhie ma ọ bụ iduga mmadụ n'ụzọ na-ezighị ezi, na-ekwughị hoo haa na ha emeriela.
theological_decisions:
- issue: Ma πλανώντων ọ̀ pụtara na nduhie ahụ enweela ihe ịga nke ọma, ka ọ̀ bụ mgbalị iduhie
  choice: ndị na-eduhie unu
  alternative: ndị na-agbalị iduhie unu
  rationale: Participle Grik ahụ na-akọwa omume ndị mmegide na-eme n'ebe ndị na-agụ akwụkwọ ahụ nọ, ma ọ naghị ekpebi hoo haa ma ha enweela ihe ịga nke ọma. Isiokwu ahụ na-anọgide na-enweghị mkpebi n'ala ala site n'ihe odide bụ isi na nkọwa ala peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe ma nwee nsọpụrụ. Ahịrịokwu ahụ dị nkenke dịka nke Grik, ebe nkọwa ala peeji na-echekwa nghọta dị iche iche nke πλανώντων.
