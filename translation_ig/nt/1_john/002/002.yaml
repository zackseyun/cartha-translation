  to: Ya onwe ya bụ àjà mkpuchi mmehie maka mmehie anyị[a]; ọ bụghịkwa naanị maka mmehie anyị, kama ọ bụkwa maka mmehie ụwa dum.
  rationale: The revision supplies the noun understood from the preceding phrase in the second clause. It preserves the Greek contrast, avoids ambiguity, and makes no interpretive narrowing of the scope of «ụwa dum» or of the debated meaning of ἱλασμός.
