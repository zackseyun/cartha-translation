id: 1JN.2.2
reference: 1 John 2:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: ig
  text: Ya onwe ya bụ àjà mkpuchi mmehie maka mmehie anyị[a]; ọ bụghịkwa naanị maka mmehie anyị, kama ọ bụkwa maka mmehie ụwa dum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “àjà na-eme ka iwe Chineke dajụọ”; ụfọdụ na-aghọtakwa ya dị ka “àjà na-ewepụ mmehie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: ya onwe ya
  rationale: Nke a na-egosipụta ike e tinyere n’aha nnọchi αὐτός, na-eme ka o doo anya na ọ bụ ya n’onwe ya na-arụ ọrụ a.
- source_word: ἱλασμός
  choice: àjà mkpuchi mmehie
  rationale: Nhọrọ a na-egosi echiche nke àjà na-eme ka e nwee mgbaghara ma na-edozi nsogbu mmehie, n’asụsụ Igbo dị mfe nghọta, n’emeghị ka otu nkọwa nkà mmụta okpukpe merie ndị ọzọ.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: maka mmehie anyị
  rationale: ‘Maka’ na-enye echiche περί n’ọnọdụ a n'ụzọ ebumpụta ụwa ma na-ejikọta àjà ahụ na mmehie anyị.
- source_word: τῶν ἡμετέρων
  choice: nke anyị
  rationale: Nke a na-echekwa okwu e hapụrụ n’ụzọ mkpirikpi na Grik; ‘nke anyị’ na-ezoghachi n’ụzọ doro anya na mmehie anyị.
- source_word: ὅλου τοῦ κόσμου
  choice: ụwa dum
  rationale: Nke a na-echekwa oke okwu Grik ahụ n’enweghị ibelata ya ka ọ bụrụ otu ìgwè mmadụ ma ọ bụ tinye nkọwa otu ụka.
- source_word: οὐ ... μόνον ἀλλὰ καὶ
  choice: ọ bụghịkwa naanị ... kama ọ bụkwa
  rationale: Usoro a bụ Igbo dị mma nke na-echekwa ntụnyere siri ike dị n’etiti ‘ọ bụghị naanị’ na ‘kama ọ bụkwa.’
theological_decisions:
- issue: Oke okwu ‘ụwa dum’
  choice: E debere ‘ụwa dum’ n’enweghị mbelata nkọwa ya.
  alternative: ndị mmadụ sitere n’ụwa dum; ndị a họpụtara nọ n’ụwa dum
  rationale: Grik kwuru okwu sara mbara; nsụgharị ahụ ekwesịghị itinye oke nke ederede ahụ n’onwe ya na-etinyeghị.
- issue: Ihe ἱλασμός pụtara
  choice: àjà mkpuchi mmehie
  alternative: ihe na-eme ka iwe Chineke dajụọ; ihe na-ewepụ mmehie
  rationale: Isi okwu ahụ nwere echiche àjà na idozi mmehie, ma a na-arụrịta ụka ma isi ike ya ọ̀ bụ ime ka iwe dajụọ, iwepụ mmehie, ma ọ bụ ha abụọ. Isi ederede jiri okwu a na-aghọta ngwa ngwa, ebe nkọwa ala peeji na-echekwa ụzọ ndị ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke kwanyere ugwu ma dị mfe nghọta. E ji ‘àjà mkpuchi mmehie’ zere okwu nkà mmụta okpukpe siri ike, ma nkọwa ala peeji chekwara nghọtahie ndị dị mkpa gbasara ἱλασμός.
