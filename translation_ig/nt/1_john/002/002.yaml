    reason: lexical_alternative
  revision_rationale: The revision supplies the noun understood from the preceding phrase in the second clause. It preserves the Greek contrast, avoids ambiguity, and makes no interpretive narrowing of the scope of «ụwa dum» or of the debated meaning of ἱλασμός.
