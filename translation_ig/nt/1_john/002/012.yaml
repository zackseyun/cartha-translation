id: 1JN.2.12
reference: 1 John 2:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Γράφω ὑμῖν, τεκνία, ὅτι ἀφέωνται ὑμῖν αἱ ἁμαρτίαι διὰ τὸ ὄνομα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/012.yaml
  text: I am writing to you[a], little children[c][b], because your sins have been forgiven for the sake of his name.
translation:
  language: ig
  text: Ana m edegara unu[a], ụmụntakịrị, n’ihi na[b] a gbagharala unu mmehie unu n’ihi aha ya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “M na-edegara unu.” Oge ugbu a n’asụsụ Grik nwere ike ịpụta ma omume a na-eme ugbu a ma okwu a na-eji n’akwụkwọ ozi.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịghọta “n’ihi na” dịka “na”: “Ana m edegara unu ... na a gbagharala unu mmehie unu.”'
    reason: alternative_reading
  - marker: c
    text: Amaokwu a ekwughị kpọmkwem ma “ya” ọ na-ezo aka na Chineke ka ọ bụ Jizọs Kraịst.
    reason: alternative_reading
lexical_decisions:
- source_word: Γράφω
  choice: Ana m edetara unu akwụkwọ
  rationale: Oge ugbu a nke ngwaa Grik nwere ike ịpụta ‘ana m ede’ ma ọ bụ ‘edetara m’; usoro a na-egosi omume ide akwụkwọ ozi nke na-aga n’ihu ma na-ada nke ọma n’Igbo.
- source_word: τεκνία
  choice: ụmụntakịrị m
  rationale: Okwu a bụ mkpọku ịhụnanya nke onye na-ele ndị ọ na-agwa anya dịka ụmụ ya; ‘m’ na-eme ka mmetụta ahụ doo anya n’Igbo, ọ bụghị ikwu na ha bụ ụmụ ya n’anụ ahụ.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’usoro okwu gbara amaokwu a gburugburu, njikọ a yikarịrị ka ọ na-enye ihe mere Jọn ji ede, ọ bụ ezie na o nwekwara ike ibute ọdịnaya nke ihe ọ na-ede.
- source_word: ἀφέωνται
  choice: a gbagharala
  rationale: 'Ngwaa zuru-oke dị n’olu nnabata na-egosi ihe e mere nke nsonaazụ ya ka dị: a gbagharala ha, mgbaghara ahụ ka dịkwa ire.'
- source_word: αἱ ἁμαρτίαι ... ὑμῖν
  choice: unu mmehie unu
  rationale: 'Ọ bụ ezie na Grik kwuru ‘mmehie ndị ahụ’ tinyere ‘unu,’ usoro Igbo nke mgbaghara na-achọkarị ka e kwuo onye nwe mmehie ahụ: ‘a gbagharala unu mmehie unu.’'
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: n’ihi aha ya
  rationale: διά tinyere accusative na-egosi ihe kpatara ya ma ọ bụ ntọala ya. ‘N’ihi aha ya’ na-echekwa ịdị arọ nke ‘aha’ dịka onye ahụ na ikike ya, n’enweghị ịtụgharị ya naanị ka ọ bụrụ aha ọma.
theological_decisions:
- issue: Onye ‘ya’ na ‘aha ya’ na-ezo aka na ya
  choice: A hapụrụ ya dịka ‘ya’ n’ahịrị bụ isi
  alternative: Chineke ma ọ bụ Jizọs Kraịst
  rationale: Amaokwu a n’onwe ya ekwughị kpọmkwem onye nnọchiaha ahụ na-ezo aka na ya. Ịhapụ ‘ya’ na-echekwa nghọtahie ezi uche dị na Grik ma ghara ikpebi okwu nkà mmụta okpukpe ahụ n’aha onye na-agụ ya.
- issue: Ọrụ ὅτι
  choice: A tụgharịrị ya ‘n’ihi na’ dịka ihe kpatara ide ahụ
  alternative: ‘na’ dịka mmalite ọdịnaya ihe e dere
  rationale: Usoro amaokwu ndị sochirinụ na-akwado nghọta nke ihe kpatara Jọn ji ede, ma e debere nhọrọ nke ọzọ n’okpuru peeji n’ihi na Grik nwere ike ịnabata ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. ‘Ụmụntakịrị m’ na-eburu ịhụnanya nke mkpọku τεκνία; ‘n’ihi aha ya’ na-echekwa akpaalaokwu Akwụkwọ Nsọ na amaghị kpọmkwem onye ‘ya’ bụ.
