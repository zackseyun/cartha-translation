id: 1JN.2.27
reference: 1 John 2:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: ig
  text: Ma unu onwe unu, otite ahụ unu natara n’aka ya na-anọgide n’ime unu,[b] ọ dịghịkwa unu mkpa ka onye ọ bụla kụziere unu. Kama, dịka otite ya si akụziri unu banyere ihe niile, otite ahụ bụ eziokwu, ọ bụghịkwa ụgha. Dịkwa ka o si kuziri unu, nọgidenụ n’ime ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka ụfọdụ ihe odide aka ochie si kwuo, “dịkwa ka o si kuziri unu, unu na-anọgide n’ime ya.”
    reason: textual_variant
  - marker: b
    text: A pụkwara ịsụgharị ya “na-adịgide n’ime unu” na “nọgidenụ n’ime ya”; otu ngwaa Grik ahụ ka e ji mee ihe n’ebe ndị a niile n’amaokwu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῖσμα
  choice: ite mmanụ
  rationale: Nke a na-edobe ihe atụ Grik nke ite mmanụ n’ebughị ụzọ kọwaa ya kpọmkwem dị ka Mmụọ Nsọ ma ọ bụ ozi ọma. Ọ bụkwa okwu Igbo doro ndị na-agụ akwụkwọ taa anya.
- source_word: ἀπ’ αὐτοῦ
  choice: n’aka ya
  rationale: A hapụrụ nnọchiaha ahụ ka ihe gbara amaokwu a gburugburu gosi onye ọ na-ezo aka na ya, kama ịtinye ‘Chineke’ ma ọ bụ ‘Onye Nsọ ahụ’ n’ime amaokwu a.
- source_word: μένει ἐν ὑμῖν / μένετε ἐν αὐτῷ
  choice: na-anọgide n’ime unu / na-anọgidenụ n’ime ya
  rationale: ‘Ịnọgide’ bụ Igbo ugbu a, dịkwa mfe nghọta; iji ya n’ebe abụọ ahụ na-echekwa nkwughachi nke μένω n’amaokwu ahụ.
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: ọ dịghịkwa unu mkpa ka onye ọ bụla kụziere unu ihe
  rationale: Nsụgharị a na-edobe ike nke okwu Grik n’emeghị ka ọ dị nro, ma ọ naghị atụkwasị nkọwa na ọ na-ajụ ụdị nkuzi mmadụ niile.
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: kụziere / na-akụziri / kụziere
  rationale: E ji otu mgbọrọgwụ okwu mee ihe ugboro atọ iji chekwaa nkwughachi na ike okwu mbụ.
- source_word: περὶ πάντων
  choice: banyere ihe niile
  rationale: Nke a na-echekwa obosara πάντων n’enweghị ịkpa ókè ma ọ bụ ime ka ihe ọ na-ekwu dị warara.
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: ọ bụ eziokwu, ọ bụghịkwa ụgha
  rationale: Nke a na-egosipụta n’ụzọ doro anya mmegide Jọn na-eme n’etiti eziokwu na ụgha.
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: dịkwa ka o si kụziere unu
  rationale: A na-edobe njikọ ntụnyere ahụ, nke jikọtara iwu ikpeazụ na nkuzi ahụ ha natara.
theological_decisions:
- issue: Ihe χρῖσμα (‘ite mmanụ’) na-ezo aka na ya
  choice: E debere ihe atụ ahụ dị ka ‘ite mmanụ’ n’amaokwu bụ isi.
  alternative: ‘Mmụọ Nsọ’ ma ọ bụ ‘ozi ọma ahụ’
  rationale: O nwere ike ịbụ ọrụ ido nsọ na ikuzi ihe nke Mmụọ Nsọ, ma ihe odide ahụ n’onwe ya ji ihe atụ ‘ite mmanụ.’ Ịhapụ ya otu a na-egbochi nsụgharị ịkwado otu nkọwa okwukwe karịa ihe ederede kwuru.
- issue: Ike okwu ‘ọ dịghịkwa unu mkpa ka onye ọ bụla kụziere unu ihe’
  choice: E debere okwu ahụ n’ike o nwere n’asụsụ Grik.
  alternative: Ịkọwa ya dị ka ịjụ ndị nkuzi mmadụ niile, ma ọ bụ ime ka ọ bụrụ naanị ịjụ ndị kewapụrụ onwe ha
  rationale: Nsụgharị ekwesịghị ime ka okwu ahụ bụrụ nkwupụta sara mbara karịa ederede, ọ kwesịghịkwa ime ka ike ya belata. Ihe gbara ya gburugburu ga-enyere onye na-agụ ya aka ịghọta oke ya.
- issue: Ụdị ngwaa ikpeazụ μένετε
  choice: 'Iwu: ‘na-anọgidenụ n’ime ya.’'
  alternative: 'Nkwupụta: ‘unu na-anọgide n’ime ya.’'
  rationale: Ihe odide SBLGNT dabara n’ụzọ kachasị mma dị ka iwu n’ebe a. E tinyere ọgụgụ nke ụfọdụ ihe odide aka ochie, nke na-ewere ya dị ka nkwupụta, n’okpuru amaokwu.
- issue: Onye nnọchiaha ikpeazụ ἐν αὐτῷ na-ezo aka na ya
  choice: ‘n’ime ya’
  alternative: ‘n’ime ite mmanụ ahụ’
  rationale: E debere nnọchiaha ahụ n’ebughị ụzọ kpebie ihe ọ na-ezo aka na ya. Nke a na-echekwa njikọ nke okwu Grik na onye a kpọtụrụ aha n’ihe gbara amaokwu ahụ gburugburu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. ‘Unu onwe unu’ na-eme ka nkwusi ike nke καὶ ὑμεῖς pụta ìhè. E debere ihe atụ ‘ite mmanụ,’ nkwughachi ‘kụziere,’ na ‘ịnọgide’ n’enweghị ịtinye nkọwa ụka pụrụ iche. E debere akara [a] n’akụkụ okwu ikpeazụ ọ na-akọwa, ma [b] n’akụkụ mbido nkwughachi ngwaa μένω.
