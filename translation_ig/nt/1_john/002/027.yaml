review_pass:
  verdict: revise
  source_fidelity: The draft preserves the overall clause sequence, the imperative reading of μένετε, and the intentional ambiguity of the anointing’s referent. However, “ite mmanụ” normally denotes a container for oil (“oil pot”), not χρῖσμα, and thus materially misrepresents the source metaphor.
  naturalness: “Otite” is the established, natural Standard Igbo noun for anointing in this biblical register. Recasting the middle clause with an explicit repeated subject also prevents the pronoun from being read unclearly.
  terminology: Replace “ite mmanụ” with “otite” throughout. This retains the metaphor without identifying it as the Holy Spirit or reducing it to a physical vessel. Keep “ịnọgide” consistently for μένω.
  issues:
  - severity: high
    issue: “ite mmanụ” is used for χρῖσμα.
    rationale: In Standard Igbo, “ite mmanụ” ordinarily means an oil container, whereas χρῖσμα means an anointing. The draft therefore says that an oil pot remains in the readers and teaches them.
  - severity: medium
    issue: The main-text clause “Kama, dị ka ite mmanụ ya si akụziri unu banyere ihe niile, ọ bụ eziokwu...” has an unclear pronoun reference.
    rationale: After correcting χρῖσμα, repeating “otite ahụ” before “bụ eziokwu” makes clear that the anointing—not an unspecified masculine/person—is said to be true and not a lie.
  - severity: low
    issue: The lexical footnote’s alternative “na-ebinụ n’ime ya” is less apt for the final imperative than “nọgidenụ.”
    rationale: “Na-adịgide/ịnọgide” better reflects the repeated Johannine μένω language and avoids implying merely physical residence.
  revised_text: Ma unu onwe unu, otite ahụ unu natara n’aka ya na-anọgide n’ime unu,[b] ọ dịghịkwa unu mkpa ka onye ọ bụla kụziere unu. Kama, dịka otite ya si akụziri unu banyere ihe niile, otite ahụ bụ eziokwu, ọ bụghịkwa ụgha. Dịkwa ka o si kuziri unu, nọgidenụ n’ime ya.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, dịka ụfọdụ ihe odide aka ochie si kwuo, “dịkwa ka o si kuziri unu, unu na-anọgide n’ime ya.”
    reason: textual_variant
  - marker: b
    text: A pụkwara ịsụgharị ya “na-adịgide n’ime unu” na “nọgidenụ n’ime ya”; otu ngwaa Grik ahụ ka e ji mee ihe n’ebe ndị a niile n’amaokwu a.
    reason: lexical_alternative
  revision_rationale: The revision corrects the central lexical error by rendering χρῖσμα as “otite” (“anointing”), preserves the metaphor and its disputed referent, maintains the imperative in the SBLGNT text, and keeps the repeated μένω terminology clear and idiomatic in Standard Igbo. The textual-variant and lexical footnotes are retained with anchors placed at the relevant wording.
