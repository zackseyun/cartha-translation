revisions:
- from: Ma unu onwe unu, ite mmanụ ahụ unu natara n’aka ya na-anọgide n’ime unu[b], ọ dịghịkwa unu mkpa ka onye ọ bụla kụziere unu ihe. Kama, dị ka ite mmanụ ya si akụziri unu banyere ihe niile, ọ bụ eziokwu, ọ bụghịkwa ụgha. Dịkwa ka o si kụziere unu, na-anọgidenụ n’ime ya.[a]
  to: Ma unu onwe unu, otite ahụ unu natara n’aka ya na-anọgide n’ime unu,[b] ọ dịghịkwa unu mkpa ka onye ọ bụla kụziere unu. Kama, dịka otite ya si akụziri unu banyere ihe niile, otite ahụ bụ eziokwu, ọ bụghịkwa ụgha. Dịkwa ka o si kuziri unu, nọgidenụ n’ime ya.[a]
  rationale: The revision corrects the central lexical error by rendering χρῖσμα as “otite” (“anointing”), preserves the metaphor and its disputed referent, maintains the imperative in the SBLGNT text, and keeps the repeated μένω terminology clear and idiomatic in Standard Igbo. The textual-variant and lexical footnotes are retained with anchors placed at the relevant wording.
  reviewer_model: gpt-5.6-terra
