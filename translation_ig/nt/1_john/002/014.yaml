id: 1JN.2.14
reference: 1 John 2:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: ig
  text: Edela m unu akwụkwọ ozi[a], ụmụntakịrị, n’ihi na unu amatala Nna ahụ. Edela m unu akwụkwọ ozi, ndị nna, n’ihi na unu amatala onye ahụ nọ kemgbe mmalite[b]. Edela m unu akwụkwọ ozi, ụmụ okorobịa, n’ihi na unu siri ike, okwu Chineke na-anọgidekwa n’ime unu[c], unu emerielakwa onye ọjọọ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Edere m unu akwụkwọ ozi,” n’echiche oge gara aga dị mfe, otu a kwa n’ebe atọ okwu a pụtara n’amaokwu a. Oge aorist Grik nwere ike ịpụta otu ahụ; ebe a, “Edela m” na-egosikwa na ihe e dere ka bara uru ugbu a.
    reason: lexical_alternative
  - marker: b
    text: “Onye ahụ nọ kemgbe mmalite” yiri ka ọ na-ezo aka n’Ọkpara ahụ dịrị tupu ihe niile, dịka ojiji Jọn si dị; ma amaokwu a akpọghị onye ahụ aha kpọmkwem.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “okwu Chineke na-adịgide n’ime unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: Edere m unu akwụkwọ
  rationale: Oge aorist na-egosi ihe e derela; n’ọnọdụ akwụkwọ ozi a, nsụgharị a na-eme ka omume ahụ na uru ọ ka bara ugbu a pụta ìhè, ma debeghachi usoro okwu ugboro atọ.
- source_word: παιδία
  choice: ụmụntakịrị
  rationale: Okwu a bụ aha a na-akpọ ndị na-agụ akwụkwọ n’ụzọ ezinụlọ; ‘ụmụntakịrị’ na-edebe ihe atụ ahụ n’etinyeghị ‘ndị m hụrụ n’anya,’ nke na-adịghị n’okwu Grik.
- source_word: ἐγνώκατε
  choice: unu amatala
  rationale: Perfect ahụ na-egosi na ha bịara mata onye ahụ, ihe ọmụma ahụ ka dịkwa; ‘amatala’ na-egosipụta nke a n’Igbo nkịtị.
- source_word: τὸν πατέρα
  choice: Nna ahụ
  rationale: N’akwụkwọ Jọn, nke a bụ aha e ji ezo aka na Chineke; ‘Nna ahụ’ na-edebe aha na ntụaka ya.
- source_word: πατέρες
  choice: ndị nna
  rationale: Nke a na-edebe okwu nwoke dị na Grik na usoro ìgwè atọ ahụ, n’agbanyeghị na ọ pụrụ ịpụta ntozu ime mmụọ karịa naanị afọ ndụ.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: onye ahụ nke dị site ná mmalite
  rationale: Ọ na-edebe onye a na-ekwu maka ya n’amaghị aha kpọmkwem, ma gosipụta ‘site ná mmalite’ n’enweghị ịkpọ ya Kraịst ma ọ bụ Ọkpara n’ime isiokwu.
- source_word: νεανίσκοι
  choice: ụmụ okorobịa
  rationale: Nke a bụ nsụgharị nwoke doro anya nke na-edebe ọdịiche dị n’etiti ha na ‘ndị nna’ na ‘ụmụntakịrị.’
- source_word: ἰσχυροί
  choice: unu siri ike
  rationale: Ọ bụ okwu Igbo dị mfe ma kwekọọ n’ike ime mmụọ na nke omume a na-ekwu maka ya.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Ọ na-edebe okwu Akwụkwọ Nsọ a maara nke ọma ma ghara ikpebi ma ọ bụ ozi Chineke n’ozuzu ya ka ọ bụ ozi ọma kpọmkwem.
- source_word: μένει
  choice: na-anọgide
  rationale: Ọ na-egosipụta ịdịgide nke μένω n’Igbo nke oge a, n’enweghị asụsụ ochie.
- source_word: νενικήκατε
  choice: unu emeriekwala
  rationale: Perfect ahụ na-egosi mmeri e nwetara nke uru ya ka na-adị; ‘emeriekwala’ jikọtara ya n’usoro ahịrịokwu ahụ ma debe nke a.
- source_word: τὸν πονηρόν
  choice: ajọ onye ahụ
  rationale: Article na ọdịdị nwoke nke okwu Grik na-akwado ntụaka nye onye, ọ bụghị ajọ ihe n’ozuzu ya.
theological_decisions:
- issue: Onye ‘onye ahụ nke dị site ná mmalite’ na-ezo aka na ya
  choice: 'E hapụrụ ntụaka ahụ n’ụzọ isiokwu Grik si hapụ ya: ‘onye ahụ nke dị site ná mmalite.’'
  alternative: Ịkpọ ya Kraịst ma ọ bụ Ọkpara kpọmkwem; ma ọ bụ ịkọwa ya dịka Chineke n’ozuzu ya.
  rationale: Ojiji Jọn na-eme ka o yie ka ọ bụ Ọkpara dịrị tupu ihe niile, ma amaokwu ahụ akpọghị ya aha; nsụgharị ahụ echekwala nghọta na esemokwu ahụ.
- issue: Okike nke ndị a na-akpọ n’ìgwè atọ ahụ
  choice: A sụgharịrị παιδία dịka ‘ụmụntakịrị,’ πατέρες dịka ‘ndị nna,’ na νεανίσκοι dịka ‘ụmụ okorobịa.’
  alternative: Ịsụgharị ìgwè atọ ahụ niile n’okwu na-enweghị akara okike dịka ọkwa ntozu nke ọgbakọ.
  rationale: Grik nwere okwu ụmụaka na okwu nwoke abụọ; nsụgharị a na-edebe ụdị okwu ahụ ma ghara ikpebi ma ìgwè ndị a hà bụ naanị afọ ndụ ka ọ bụ ihe atụ nke ntozu ime mmụọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘n’ihi na’ maka ὅτι, ‘na-anọgide’ maka isiokwu Jọn μένω, ma debe usoro okwu ugboro atọ. Akara nkọwa ụkwụ [a], [b], na [c] niile dị n’isiokwu n’ebe okwu ha metụtara dị.
