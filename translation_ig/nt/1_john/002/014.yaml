revisions:
- from: Edere m unu akwụkwọ[a], ụmụntakịrị, n’ihi na unu amatala Nna ahụ. Edere m unu akwụkwọ, ndị nna, n’ihi na unu amatala onye ahụ nke dị site ná mmalite[b]. Edere m unu akwụkwọ, ụmụ okorobịa, n’ihi na unu siri ike, okwu Chineke na-anọgidekwa n’ime unu[c], unu emeriekwala ajọ onye ahụ.
  to: Edela m unu akwụkwọ ozi[a], ụmụntakịrị, n’ihi na unu amatala Nna ahụ. Edela m unu akwụkwọ ozi, ndị nna, n’ihi na unu amatala onye ahụ nọ kemgbe mmalite[b]. Edela m unu akwụkwọ ozi, ụmụ okorobịa, n’ihi na unu siri ike, okwu Chineke na-anọgidekwa n’ime unu[c], unu emerielakwa onye ọjọọ ahụ.
  rationale: The revision removes the unwarranted additive force in the final clause, improves idiomatic Standard Igbo for the repeated epistolary formula and the phrase “from the beginning,” and retains the Greek rhetorical pattern, perfect-result sense, personal force of “the evil one,” and the text’s unstated referent. The final -kwa in “emerielakwa” is retained only as natural Igbo clause linkage corresponding to Greek coordination, not as a separate claim of additional victory.
