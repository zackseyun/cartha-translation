id: 1JN.2.5
reference: 1 John 2:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: ig
  text: 'Ma onye ọ bụla nke na-edebe okwu ya, n’ezie, ọ bụ n’ime onye ahụ[a] ka e meela ka ịhụnanya Chineke zuo oke[b]. Ọ bụ site na nke a ka anyị ji mara na anyị nọ n’ime ya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ dabara nnọọ n’okwu Grik, a pụkwara ịsị, “n’ime nke a” ma ọ bụ “n’ime onye a.” Nkebiokwu Grik ahụ nwere ike izo aka n’onye na-edebe okwu ya, ma ọ bụ n’ihe a dịka ihe akaebe.
    reason: alternative_reading
  - marker: b
    text: “Ịhụnanya Chineke” nwere ike ịpụta ịhụnanya Chineke nwere n’ebe onye kwere ekwe nọ, ma ọ bụ ịhụnanya onye kwere ekwe nwere n’ebe Chineke nọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: Ma onye ọ bụla
  rationale: “Onye ọ bụla” na-egosipụta ọnọdụ izugbe nke nnọchiaha ya na ἄν, ebe “Ma” na-echekwa obere ọdịiche δέ na-eweta.
- source_word: τηρῇ
  choice: na-edebe
  rationale: “Na-edebe” gụnyere ichekwa, irubere isi, na ime ihe okwu ahụ kwuru; ọ na-echekwakwa njikọ okwu Jọn na-eji maka idebe okwu na iwu.
- source_word: αὐτοῦ τὸν λόγον
  choice: okwu ya
  rationale: “Okwu ya” na-echekwa otu nọmba λόγος na obosara echiche ya karịa ịkọwa ya naanị dị ka ozi ma ọ bụ iwu.
- source_word: ἀληθῶς
  choice: n’ezie
  rationale: “N’ezie” bụ okwu Igbo dị ugbu a ma dị ugwu nke na-enye nkwupụta ahụ ike dịka adverb Grik ahụ si eme.
- source_word: ἐν τούτῳ
  choice: n’ime onye ahụ
  rationale: Nkebiokwu a nwere ike izo aka n’onye na-edebe okwu ahụ ma ọ bụ n’ihe a dịka ihe akaebe. “N’ime onye ahụ” na-enye nghọta onye nke dabara n’usoro ahịrịokwu, ebe ndetu ala na-echekwa ihe ọzọ ọ pụrụ ịpụta.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: ịhụnanya Chineke
  rationale: 'Nhazi a na-echekwa mgbagwoju anya nke genitive Grik: ọ pụrụ ịbụ ịhụnanya Chineke nwere ma ọ bụ ịhụnanya mmadụ nwere n’ebe Chineke nọ.'
- source_word: τετελείωται
  choice: e meworo ... ka o zuo oke
  rationale: Nhazi perfect passive a na-egosi na e mechaala ime ka ịhụnanya ahụ ruo n’uju, ọnọdụ ahụ ka dịkwa ugbu a.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: Ọ bụ site na nke a ka anyị ji mara
  rationale: Nke a bụ ụzọ Igbo doro anya isi gosipụta na ihe a bụ ihe akaebe ma ọ bụ ntọala e ji amata ihe na-esochi.
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: na anyị nọ n’ime ya
  rationale: “N’ime ya” na-echekwa okwu Jọn pụrụ iche banyere mmekọrịta na ịdị n’otu n’enweghị ịgbasa nkọwa ya n’isiokwu ahụ.
theological_decisions:
- issue: Ihe τοῦ θεοῦ pụtara n’okwu ἡ ἀγάπη τοῦ θεοῦ
  choice: ịhụnanya Chineke
  alternative: ịhụnanya Chineke nwere n’ime onye kwere ekwe; ma ọ bụ ịhụnanya onye kwere ekwe nwere n’ebe Chineke nọ
  rationale: Genitive Grik ahụ nwere mgbagwoju anya n’ezie. Isi ederede na-ahapụ “ịhụnanya Chineke” ka echiche abụọ ahụ nwee ike ịdị, ndetu ala akọwaa ha.
- issue: Ihe ἐν τούτῳ mbụ na-ezo aka na ya
  choice: n’ime onye ahụ
  alternative: n’ime nke a; site n’ihe a
  rationale: Ọ pụrụ izo aka n’onye na-edebe okwu Chineke, ma ọ bụ n’omume idebe okwu ahụ dịka ihe akaebe. A họọrọ nghọta onye n’isi ederede n’ihi ịdị mfe nghọta, ma e debeghị ụzọ ọzọ n’azụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro echiche Jọn, mgbagwoju anya nke “ịhụnanya Chineke,” na akara ntụpọ abụọ n’ọgwụgwụ nke na-eduga n’ihe na-esote.
