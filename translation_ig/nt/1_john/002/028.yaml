revisions:
- from: Ma ugbu a, ụmụntakịrị, nọgidenụ n’ime ya, ka ọ bụrụ na e kpughee ya[a], anyị enwee nkwuwa okwu, ghara ịla azụ n’ihere pụọ n’ebe ọ nọ[b] n’oge ọbịbịa ya[c].
  to: Ma ugbu a, ụmụntakịrị, nọgidenụ n’ime ya, ka, ọ bụrụ na e kpughee ya[a], anyị wee nwee obi ike, ghara ịdọkpụ azụ n’ihere n’ihu ya[b] n’oge ọbịbịa ya[c].
  rationale: The revision improves Standard Igbo syntax and replaces a potentially over-literal depiction of withdrawal with wording that can express shameful shrinking back before him. It retains the Greek passive in the manifestation clause, the conditional force of ἐάν, and the eschatological meaning of παρουσία. The footnote preserves the less expansive reading of the shame expression.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:26:53Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the principal elements of the Greek, including the affectionate vocative, the imperative to remain in him, the passive force of φανερωθῇ, and παρουσία in its eschatological sense. However, the main clause after the conditional is awkward in Igbo, and “ịla azụ n’ihere pụọ n’ebe ọ nọ” over-specifies a physical withdrawal. The Greek expression admits the sense of being ashamed before him as well as shrinking back from him; the main text should not make the latter overly concrete.
  naturalness: “Ka ọ bụrụ na … anyị enwee” is not a smooth way to express this purpose/conditional construction in Standard Igbo. “Ka, ọ bụrụ na …, anyị wee nwee …” is clear and preserves the conditional. “Nwee obi ike” is more idiomatic in this setting than “enwee nkwuwa okwu,” which can suggest outspoken speech or frankness rather than confidence at Christ’s coming.
  terminology: “Nọgidenụ n’ime ya” and “ọbịbịa ya” are appropriate Johannine and eschatological renderings. The passive “e kpughee ya” is retained. The shame clause is rendered in a way that retains the possible recoil/shrinking nuance without presenting it as a literal departure.
  issues:
  - severity: medium
    issue: Awkward conditional-purpose syntax
    rationale: The sequence “ka ọ bụrụ na e kpughee ya, anyị enwee” is strained in Standard Igbo. Punctuation and “anyị wee nwee” make the relationship of purpose and condition natural without changing the Greek ambiguity of ἐάν.
  - severity: medium
    issue: The shame clause is too physically explicit
    rationale: “Ịla azụ … pụọ n’ebe ọ nọ” can read as literal movement away from him. αἰσχυνθῶμεν ἀπ’ αὐτοῦ can convey shame before him or shrinking back from him; “ịdọkpụ azụ n’ihere n’ihu ya” better preserves this range, with the footnote retaining the alternative.
  - severity: low
    issue: “Nkwuwa okwu” is less fitting than “obi ike” here
    rationale: While παρρησία can include frankness, the eschatological context calls for confidence/boldness. “Obi ike” is natural modern Igbo and less liable to be understood as merely verbal outspokenness.
  revised_text: Ma ugbu a, ụmụntakịrị, nọgidenụ n’ime ya, ka, ọ bụrụ na e kpughee ya[a], anyị wee nwee obi ike, ghara ịdọkpụ azụ n’ihere n’ihu ya[b] n’oge ọbịbịa ya[c].
