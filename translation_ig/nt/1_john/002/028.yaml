id: 1JN.2.28
reference: 1 John 2:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ⸀ἐὰν φανερωθῇ ⸀σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: ig
  text: Ma ugbu a, ụmụntakịrị, nọgidenụ n’ime ya, ka, ọ bụrụ na e kpughee ya[a], anyị wee nwee obi ike, ghara ịdọkpụ azụ n’ihere n’ihu ya[b] n’oge ọbịbịa ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “ọ pụta ìhè.” Ngwaa Grik dị n’ụdị nnara: “e kpughee ya” ma ọ bụ “e mee ka ọ pụta ìhè.”'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka ihere ghara ime anyị n’ihu ya.” A pụkwara ịghọta nkebiokwu ahụ dịka ịbụ ndị ihere na-eme n’ihu ya, n’enweghị ime ka echiche ịdọkpụ azụ pụta ìhè.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “n’oge ọnụnọ ya.” N’ebe a, “ọbịbịa” na-egosipụta ihe okwu Grik ahụ pụtara banyere ọbịbịa Kraịst n’oge ikpeazụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: ụmụntakịrị
  rationale: Ọ bụ okwu onye na-azụ ndị kwere ekwe ji ịhụnanya na-akpọ ha; ‘ụmụntakịrị’ na-edobe ma oyiyi ezinụlọ ma ụdị okwu nta dị na Grik, n’agbanyeghị na n’Igbo ọ pụkwara ịdị ka ọ na-ekwu banyere ụmụaka n’ezie.
- source_word: μένετε
  choice: nọgidenụ
  rationale: ‘Nọgidenụ’ bụ okwu Igbo doro anya nke na-egosi ịnọgide n’ọnọdụ ma ọ bụ mmekọrịta; ọ na-edobekwa mkpa μένω nwere n’akwụkwọ Jọn.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Nsụgharị a na-edobe okwu atụ Jọn n’ụzọ kwụ ọtọ, kama ịkọwa ya karịa ihe odide ahụ dịka ‘dịrị n’otu na ya.’
- source_word: φανερωθῇ
  choice: e kpughee ya
  rationale: 'Nke a na-edobe ụdị nnara nke ngwaa Grik: a na-ekpughe ya ma ọ bụ na-eme ka ọ pụta ìhè. Ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ mkpughe Kraịst n’ọdịnihu.'
- source_word: σχῶμεν παρρησίαν
  choice: anyị enwee nkwuwa okwu
  rationale: ‘Nkwuwa okwu’ na-egosi nnwere onwe na obi ike mmadụ nwere n’ihu onye ọzọ, ọ bụghị naanị obi ike ọgụ; ọ dabara n’otú Jọn si eji παρρησία.
- source_word: αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: ghara ịla azụ n’ihere pụọ n’ebe ọ nọ
  rationale: Nkebiokwu a na-ejikọta ihere na echiche ịla azụ ma ọ bụ ịpụ n’ebe ọ nọ. Ọ na-edobe ike ἀπό n’enweghị ịsị na ọ bụ ya kpatara ihere ahụ.
- source_word: παρουσίᾳ
  choice: ọbịbịa
  rationale: N’ọnọdụ amụma banyere oge ikpeazụ, παρουσία na-ezo aka n’ọbịbịa Kraịst n’ọdịnihu. ‘Ọbịbịa’ bụ okwu Igbo doro anya ma na-edobe akụkụ ihe omume ahụ.
theological_decisions:
- issue: Onye nnọchiaha ndị a na-ezo aka na ya na mkpughe nke oge ikpeazụ
  choice: A hapụrụ nnọchiaha ahụ dịka ‘ya,’ ebe ihe gbara amaokwu ahụ gburugburu na-egosi Ọkpara ahụ, Jizọs Kraịst, na ọbịbịa ya n’ọdịnihu.
  alternative: Ịghọta ya dịka okwu zuru ezu banyere Chineke n’akọwapụtaghị Ọkpara ahụ.
  rationale: Ihe ndị bu ụzọ n’isi nke abụọ na-ekwu maka ịnọgide n’ime Ọkpara ahụ, mkpughe na παρουσία ya. Ma itinye ‘Jizọs’ ma ọ bụ ‘Kraịst’ n’ahịrị amaokwu ahụ ga-eme ka ihe odide ahụ kọwaa karịa Grik.
- issue: Ihe ihere ahụ pụtara n’oge ọbịbịa Kraịst
  choice: E gosiri ya dịka ịla azụ n’ihere pụọ n’ebe ọ nọ, ọ bụghị dịka ikpe ọmụma ikpeazụ n’onwe ya.
  alternative: ‘Ka ihere ghara ime anyị n’ihu ya,’ n’enweghị echiche ịla azụ.
  rationale: Njikọ αἰσχυνθῶμεν na ἀπ’ αὐτοῦ nwere ike igosi ịla azụ n’ihere. Nsụgharị ahụ na-edobe ịdọ aka ná ntị siri ike, ma ọ naghị agbakwụnye echiche banyere ikpe ikpeazụ nke okwu Grik ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke dị ùgwù ma dị mfe nghọta mee ihe. ‘Nọgidenụ n’ime ya’ na-edobe okwu atụ pụrụ iche nke Jọn; ‘e kpughee ya’ na-edobe ụdị nnara nke Grik ọbụna ma ‘ọ pụta ìhè’ ga-adịtụ mfe n’okwu Igbo. E tinyere akara nkọwa ụkwụ [a], [b], na [c] kpọmkwem n’ebe okwu ha na-akọwa dị.
