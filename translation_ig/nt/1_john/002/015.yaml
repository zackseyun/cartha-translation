id: 1JN.2.15
reference: 1 John 2:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: ig
  text: Unu ahụla ụwa n’anya, unu ahụkwala ihe ndị dị n’ụwa n’anya.[a] Ọ bụrụ na onye ọ bụla ahụ ụwa n’anya, ịhụnanya nke Nna adịghị n’ime ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụwa” ebe a abụghị ihe niile Chineke kere; ihe ndị gbara amaokwu a gburugburu na-egosi usoro ọchịchọ na ndụ nke na-emegide Chineke.
    reason: contextual_clarification
  - marker: b
    text: “Ịhụnanya nke Nna” nwere ike ịpụta “ịhụnanya mmadụ nwere n’ebe Nna nọ”; n’ụzọ ọzọ, ọ pụkwara ịpụta “ịhụnanya Nna nwere.” Nghọta nke mbụ yiri ka ọ ka dabara n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: Μὴ ἀγαπᾶτε
  choice: Unu ahụla ... n’anya
  rationale: A na-eji usoro iwu a machibidoro ihe n’Igbo mee ka mmachibido ahụ doo anya, ma a naghị ekpebi ma ọ bụ ịkwụsị omume na-aga n’ihu ka Grik present imperative nwere ike ịpụta.
- source_word: τὸν κόσμον
  choice: ụwa
  rationale: “Ụwa” bụ okwu Igbo sara mbara nke na-edobe okwu Grik κόσμος; ihe ndị gbara amaokwu a gburugburu ga-egosi na ebe a ọ bụ usoro ndụ na-emegide Chineke, ọ bụghị ihe Chineke kere n’onwe ya.
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: unu ahụkwala ihe ndị dị n’ụwa n’anya
  rationale: Nkwughachi nke “ahụla ... n’anya” na-eme ka Igbo bụrụ nke doro anya ma na-edobe ike nke μηδέ, nke na-agbakwunye ihe ndị dị n’ụwa ná mmachibido ahụ.
- source_word: ἐάν τις ἀγαπᾷ
  choice: Ọ bụrụ na onye ọ bụla ahụ ... n’anya
  rationale: “Onye ọ bụla” na-egosipụta τις dịka onye ọbụla n’enweghị oke, ebe usoro “ọ bụrụ na” na-edobe ọnọdụ ahụ.
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: ịhụnanya nke Nna
  rationale: 'Usoro “nke Nna” na-edobe nghọtahie nwere ike ịdị na genitive Grik: ọ pụrụ ịbụ ịhụnanya a hụrụ Nna ma ọ bụ ịhụnanya sitere n’aka Nna.'
- source_word: ἐν αὐτῷ
  choice: adịghị n’ime ya
  rationale: Nke a na-agbaso okwu Grik n’ụzọ nkịtị. “Ya” n’Igbo anaghị egosi nwoke ma ọ bụ nwanyị, ya mere ọ na-arụ ọrụ nke ọma maka onye ọ bụla e kwuru banyere ya.
theological_decisions:
- issue: Ihe “ụwa” pụtara n’omume Ndị Kraịst dịka Jọn si kọwaa ya
  choice: A sụgharịrị ya dịka “ụwa” n’isiokwu ahụ, n’enweghị ịgbasa nkọwa ya.
  alternative: usoro ụwa nke na-emegide Chineke
  rationale: Amaokwu a anaghị akụzi ịkpọ ihe Chineke kere ma ọ bụ ụmụ mmadụ asị; ọ na-adọ aka ná ntị banyere ịhụ usoro ọchịchọ na nrubeisi na-emegide Chineke n’anya. Ide “ụwa” na-ahapụ gburugburu okwu ahụ ka ọ kọwaa ya.
- issue: Ụdị genitive dị na ἡ ἀγάπη τοῦ πατρὸς
  choice: ịhụnanya nke Nna
  alternative: ịhụnanya mmadụ nwere n’ebe Nna nọ; ma ọ bụ ịhụnanya Nna nwere
  rationale: Ihe dị nso n’amaokwu ahụ na-akwado karịa nghọta nke ịhụ Nna n’anya, n’ihi na e ji ya tụnyere ịhụ ụwa n’anya. Ma Grik ahụ nwekwara ike ịpụta ịhụnanya Nna nwere, ya mere e debeghị otu nghọta naanị n’isiokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu, dee ya. “Unu” na-egosipụta na iwu Grik ahụ bụ maka ọtụtụ mmadụ. E ji “ahụ ... n’anya” mee ngwaa ἀγαπάω, ebe “ịhụnanya” na-anọchi aha ἀγάπη. Akara mgbakwunye [a] na [b] pụtara n’isiokwu ahụ.
