  text: ὁ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῷ φωτὶ μένει, καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: ig
  text: Onye hụrụ nwanne ya n’anya na-anọgide n’ìhè, ọ dịghịkwa ihe na-akpata ịsụ ngọngọ n’ime ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ dịghị ihe ga-eme ka ọ sụọ ngọngọ.” Nkebi okwu Grik ahụ pụrụ ịpụta ma na ọ dịghị ihe na-akpata ịsụ ngọngọ n’ime ya, ma na ọ dịghị ihe na-eche ya ihu nke ga-eme ka ọ sụọ ngọngọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: Onye hụrụ … n’anya
  rationale: Nkebi a na-arụ ọrụ dị ka aha onye ma na-egosi omume na-aga n’ihu ma ọ bụ àgwà e ji mara onye ahụ. Usoro Igbo a bụ nke nkịtị, doo anya, ma na-echekwa echiche nke ịhụ n’anya.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: nwanne ya
  rationale: “Nwanne” bụ okwu Igbo ebumpụta ụwa maka nwanne nwoke ma ọ bụ onye otu ezinụlọ/òtù okwukwe dịka gburugburu okwu si dị; ọ naghị etinye nkọwa karịrị nke Grik kwuru.
- source_word: ἐν τῷ φωτὶ
  choice: n’ìhè
  rationale: Ọ na-echekwa onyinyo ìhè dị n’akwụkwọ Jọn ma bụrụkwa okwu Igbo doro anya.
- source_word: μένει
  choice: na-anọgide
  rationale: Ọ na-egosi ịnọgide ma ọ bụ ịdịgide n’ọnọdụ ahụ, bụ isi echiche nke μένω n’ihe odide Jọn.
- source_word: σκάνδαλον
  choice: ihe na-eme ka a sụọ ngọngọ
  rationale: Nkebi a na-echekwa ihe atụ nke ihe na-akpata ịsụ ngọngọ, ma na-ada nke ọma n’Igbo karịa ịsụgharị ya dịka ihe nkịtị naanị.
- source_word: ἐν αὐτῷ
  choice: dị n’ime ya
  rationale: Nke a bụ nsụgharị kpọmkwem nke nghọta kachasị mfe, ya bụ na ihe ahụ adịghị n’ime onye hụrụ nwanne ya n’anya; a hapụrụ nghọta ọzọ na nkọwa ala peeji.
- source_word: οὐκ ἔστιν
  choice: ọ dịghịkwa
  rationale: Usoro a na-egosipụta n’Igbo n’ụzọ ebumpụta ụwa na ihe ahụ adịghị.
theological_decisions:
- issue: Ihe καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν pụtara kpọmkwem
  choice: Ọ dịghị ihe na-eme ka a sụọ ngọngọ dị n’ime onye hụrụ nwanne ya n’anya.
  alternative: Ọ dịghị ihe ịsụ ngọngọ dịịrị ya.
  rationale: ἐν αὐτῷ nwere ike ịkọwa ihe na-adịghị n’ime onye ahụ, ma ọ bụ ihe na-adịghị eche ya ihu nke ga-eme ka ọ sụọ ngọngọ. Isi ederede na-agbaso usoro Grik nso, ebe nkọwa ala peeji na-echekwa nghọta nke ọzọ n’ebughị ụzọ kpebie esemokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E chekwara onyinyo “ìhè” na “ịsụ ngọngọ” dị n’asụsụ Grik, ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa okpukpe nke na-emechi nghọta ndị ọzọ.
