id: 1JN.2.4
reference: 1 John 2:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ λέγων ⸀ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: ig
  text: Onye na-ekwu, “Amatala m ya,”[a] ma ọ naghị edebe iwu ndị o nyere, bụ onye ụgha; eziokwu adịghịkwa n’ime onye ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “Ama m ya.” Ụdị ngwaa Grik na-egosi ịmata nke malitere na mbụ ma ka na-adị ugbu a.'
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụ ya: “eziokwu adịghị n’ime ya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λέγων
  choice: Onye na-ekwu
  rationale: Nke a na-egosipụta participle nwere article nke na-arụ ọrụ dịka aha, ma na-edobe echiche izugbe banyere onye ọ bụla na-ekwu otu a.
- source_word: Ἔγνωκα
  choice: Amatala m
  rationale: Ụdị perfect nke γινώσκω na-egosi ịmata nke malitere na mbụ ma nsonaazụ ya ka dị ugbu a. “Amatala m” bụ ụzọ Igbo dị nkenke ma dị ndụ isi chekwaa akụkụ a.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-alaghachi n’ebe Chineke nọ n’okwu ndị gbara ya gburugburu, ma ntụgharị ahụ ahaghị onye ahụ kpọmkwem dịka Kraịst, ya mere ọ na-echekwa obosara nke ederede.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: ihe o nyere n’iwu
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka iwu onye ahụ nyere, na-echekwa ịdị arọ nke ἐντολή n’enweghị asụsụ siri ike nghọta.
- source_word: μὴ τηρῶν
  choice: ọ naghị edebe
  rationale: Present participle na-akọ omume na-aga n’ihu. “Idebe” na-echekwa echiche Johannine nke ịsọpụrụ na ime ihe e nyere n’iwu, kama ịkọwa ya naanị dịka nrubeisi.
- source_word: ψεύστης
  choice: onye ụgha
  rationale: Predicate noun a na-akọwa onye ahụ n’onwe ya dịka onye ụgha, ọ bụghị nanị na okwu ya bụ ụgha.
- source_word: ἐν τούτῳ
  choice: n’ime onye ahụ
  rationale: τούτῳ na-ezo aka n’onye a kọwara. “Onye ahụ” doro anya n’Igbo ma na-echekwa ike ngosipụta nke okwu Grik karịa nnọchiaha nkịtị.
- source_word: ἡ ἀλήθεια οὐκ ἔστιν
  choice: eziokwu adịghị
  rationale: Nke a na-edobe copula e jụrụ n’ụzọ dị mfe ma na-echekwa obosara echiche Johannine nke “eziokwu.”
theological_decisions:
- issue: Onye αὐτόν / αὐτοῦ na-ezo aka na ya
  choice: E debere ya dịka nnọchiaha “ya/o” nke n’ọnọdụ okwu a na-ezo n’ebe Chineke nọ.
  alternative: Ịkọwa ya kpọmkwem dịka Kraịst.
  rationale: Amaokwu gbara ya gburugburu na-akwado na ọ na-ezo n’ebe Chineke nọ, ma njikọ dị n’etiti Chineke na Ọkpara n’akwụkwọ Jọn na-eme ka ọ ghara ịdị mma ịgbakwunye aha nke Grik na-ekwughị.
- issue: Ike okwu Johannine banyere “ịmata”
  choice: “Amatala m” na-egosi ịmata nke mere na mbụ ma ka na-adị ugbu a.
  alternative: “Ama m ya,” nke na-egosipụta ọnọdụ dị ugbu a n’ụzọ dị mfe.
  rationale: Perfect Ἔγνωκα nwere ma omume ịbịa mata na ọnọdụ mmekọrịta nke si na ya pụta; ntụgharị isi na-echekwa akụkụ abụọ ahụ n’enweghị ịkọwa ya dịka naanị ihe ọmụma nke uche.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “ihe o nyere n’iwu” mee ka ἐντολάς bụrụ okwu nkịtị nye ndị na-agụ akwụkwọ, ebe “onye ụgha” na-edobe ịdị nkọ nke ederede. Akara nkọwa ụkwụ niile dị n’ederede isi.
