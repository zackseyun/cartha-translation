  to: Onye na-ekwu, “Amatala m ya,”[a] ma ọ naghị edebe iwu ndị o nyere, bụ onye ụgha; eziokwu adịghịkwa n’ime onye ahụ.[b]
  rationale: The revision only makes the plural commandment term more explicit and adjusts footnote b to identify its wording as an alternative. It retains the Greek ambiguity concerning the referent of “him/his,” the perfect force of Ἔγνωκα, and the demonstrative force of ἐν τούτῳ.
