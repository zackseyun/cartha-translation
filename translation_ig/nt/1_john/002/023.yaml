id: 1JN.2.23
reference: 1 John 2:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶς ὁ ἀρνούμενος τὸν υἱὸν οὐδὲ τὸν πατέρα ἔχει· ⸂ὁ ὁμολογῶν τὸν υἱὸν καὶ τὸν πατέρα ἔχει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/023.yaml
  text: Everyone who denies the Son does not have the Father either[a]; whoever confesses the Son has the Father also.
translation:
  language: ig
  text: Onye ọ bụla na-agọnahụ Ọkpara ahụ enweghịkwa Nna ahụ[a]; onye na-ekwupụta Ọkpara ahụ nwekwara Nna ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ ihe odide aka ochie enweghị okwu ndị a: “onye na-ekwupụta Ọkpara ahụ nwekwara Nna ahụ.”'
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: Onye ọ bụla na-agọnahụ
  rationale: Nke a na-egosi onye ọ bụla nke omume a metụtara, ma na-edobe ọdịdị izugbe nke participle Grik ahụ n'Igbo e ji eme ihe ugbu a.
- source_word: ἀρνούμενος
  choice: na-agọnahụ
  rationale: “Ịgọnahụ” na-egosi ịjụ ma ọ bụ ịsị na ihe a na-ekwu abụghị eziokwu n'ọnọdụ nkwupụta okwukwe, n'etinyeghị nkọwa ọzọ n'ime okwu ahụ.
- source_word: τὸν υἱὸν
  choice: Ọkpara ahụ
  rationale: Grik kwuru naanị “Ọkpara ahụ.” E tinyeghị “nke Chineke,” ka a ghara ịgbakwunye ihe na-adịghị n'ahịrịokwu ahụ.
- source_word: οὐδὲ
  choice: enweghịkwa
  rationale: 'Mgbakwunye “-kwa” na-ebuga nkwụghachi nke njụ ahụ n''ebe Nna ahụ nọ: onye ahụ enweghịkwa Nna ahụ.'
- source_word: τὸν πατέρα ἔχει
  choice: nwere Nna ahụ
  rationale: A hapụrụ okwu ahụ n'ụdị “inwe Nna ahụ,” kama ịkọwa ya dị ka mkpakọrịta ma ọ bụ ịbụ nke Nna, ka obosara echiche Jọn ghara ịbelata.
- source_word: ὁ ὁμολογῶν
  choice: onye na-ekwupụta
  rationale: “Onye na-ekwupụta” na-eburu echiche nke ikweta ma kwupụta ihe n'ụzọ doro anya, ma na-adabara ọdịdị izugbe nke participle ahụ.
- source_word: καὶ
  choice: nwekwara
  rationale: '“-kwara” na-egosi njikọ kwekọrọ na nkebi mbụ: onye na-ekwupụta Ọkpara ahụ nwere Nna ahụ kwa.'
theological_decisions:
- issue: Nkebi nke abụọ e tinyere akara na ederede Grik e bipụtara
  choice: 'E tinyere ya n''ederede bụ isi: “onye na-ekwupụta Ọkpara ahụ nwekwara Nna ahụ.”'
  alternative: Ịhapụ nkebi nke abụọ n'ihi na ụfọdụ ihe odide enweghị ya.
  rationale: SBLGNT tinyere nkebi ahụ n'ederede ya, ọ bụ ezie na akara ya na-egosi ọdịiche dị n'ihe odide aka ochie. Ya mere, a sụgharịrị ya n'ederede bụ isi ma kọwaa ọdịiche ahụ n'okpuru peeji.
- issue: Ihe “inwe Nna ahụ” pụtara n'ihe gbasara mmekọrịta
  choice: Idobe okwu ahụ dịka “nwere Nna ahụ” n'enweghị nkọwa agbakwunyere.
  alternative: Ịsụgharị ya dịka “ya na Nna ahụ nwere mmekọrịta” ma ọ bụ “ọ bụ nke Nna ahụ.”
  rationale: Okwu ahụ na-egosi na ịkwupụta Ọkpara ahụ na inwe Nna ahụ enweghị ike ikewapụ. Idobe akpaalaokwu Jọn na-echekwa ịdị arọ na obosara nke nkwupụta ahụ n'etinyeghị otu nkọwa ozizi pụrụ iche.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji mkpụrụedemede ukwu dee “Ọkpara” na “Nna” dịka aha nsọpụrụ doro anya n'ọnọdụ a. A hapụrụ akpaalaokwu “inwe Nna ahụ” ka ntụgharị ghara ịkọwa ya karịa ka Grik siri kwuo.
