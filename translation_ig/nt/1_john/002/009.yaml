  text: ὁ λέγων ἐν τῷ φωτὶ εἶναι καὶ τὸν ἀδελφὸν αὐτοῦ μισῶν ἐν τῇ σκοτίᾳ ἐστὶν ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/009.yaml
  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: ig
  text: Onye na-ekwu na ya nọ n’ìhè, ma na-akpọ nwanne ya nwoke asị, ka nọ n’ọchịchịrị ruo ugbu a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwanne ya nwoke ma ọ bụ nwanyị.” N’asụsụ Grik, e ji okwu nwoke nke otu onye, “nwanne nwoke”; ma n’okwu gbasara omume a, ọ pụrụ ịnọchite anya nwoke ma ọ bụ nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Onye na-ekwu
  rationale: Nkebi a na-ewere participle ahụ dị ka aha onye, na-arụtụ aka n’otu onye nnọchianya; nke a bụkwa Igbo nkịtị ma na-egosi omume na-aga n’ihu.
- source_word: ἐν τῷ φωτὶ εἶναι
  choice: na ya nọ n’ìhè
  rationale: A gbanwere infinitive ahụ ka ọ bụrụ ahịrịokwu zuru ezu dịka usoro Igbo si dị, ma debe ihe atụ Jọn ji ìhè akọwa ọnọdụ ime mmụọ na omume.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: nwanne ya nwoke
  rationale: Nke a na-edebe ụdị nwoke otu onye nke ἀδελφός n’ahịrịokwu bụ isi, n’agbanyeghị na okwu ahụ nwere ike ịnọchite anya nwanne nwoke ma ọ bụ nwanyị n’ọnọdụ a.
- source_word: μισῶν
  choice: na-akpọ ... asị
  rationale: Nke a bụ ụzọ Igbo sitere n’okike si kwuo ‘ịkpọ asị’; akara oge na-egosi àgwà ma ọ bụ omume na-aga n’ihu.
- source_word: ἐν τῇ σκοτίᾳ ἐστὶν
  choice: ka nọkwa n’ọchịchịrị
  rationale: ‘Ka nọ’ na-egosi na ezi ọnọdụ onye ahụ ka na-adịgide, ebe ‘ọchịchịrị’ na-edebe ihe atụ Jọn na ọdịiche ya na ‘ìhè.’
- source_word: ἕως ἄρτι
  choice: ruo ugbu a
  rationale: Nke a na-ebute kpọmkwem echiche nke ọnọdụ ahụ ịdịgide ruo n’oge a.
theological_decisions:
- issue: Otú e si sụgharịta ἀδελφός n’okwu ụkpụrụ omume nke otu onye nwere ike ịnọchite anya ọtụtụ mmadụ
  choice: nwanne ya nwoke
  alternative: nwanne ya nwoke ma ọ bụ nwanyị; onye kwere ekwe ibe ya
  rationale: Isi ederede na-edebe nwoke otu onye dị na Grik. Ihe odide ala peeji na-egosi na n’ọnọdụ a okwu ahụ nwere ike ịdị nnọchianya, n’ebughị nkọwa gbasara onye kwere ekwe n’ime isi ederede.
- issue: Mmekọrịta dị n’etiti nkwupụta onye ahụ na ezi ọnọdụ ya
  choice: na ya nọ n’ìhè ... ka nọkwa n’ọchịchịrị
  alternative: na ya bụ onye ìhè ... ọ ka bụ onye ọchịchịrị
  rationale: Nhọrọ a na-edebe ihe atụ banyere ịnọ n’ime mpaghara ìhè ma ọ bụ ọchịchịrị, ma ghara ịtụgharị ya ka ọ bụrụ aha njirimara nke Grik ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E debere ihe atụ Jọn nke ìhè na ọchịchịrị, jiri ‘ịkpọ asị’ mee ka μισέω bụrụ okwu Igbo sitere n’okike, ma tinye akara ụda n’ebe ọ na-enyere aka ịmata ‘ìhè’ na ‘ọchịchịrị.’
