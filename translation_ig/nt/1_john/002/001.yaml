id: 1JN.2.1
reference: 1 John 2:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: ig
  text: Ụmụntakịrị m, ana m edeere unu ihe ndị a ka unu ghara ime mmehie. Ma ọ bụrụ na onye ọ bụla emee mmehie, anyị nwere onye na-ekwuchitere anyị[a] n’ebe Nna nọ—Jizọs, bụ Mesaya[b], Onye Ziri Ezi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta “onye na-ekwuchitere anyị” n’ụzọ sara mbara dịka “onye inyeaka,” “onye ndụmọdụ,” ma ọ bụ “onye nkasi obi”; okwu Grik bụ παράκλητος.
    reason: lexical_alternative
  - marker: b
    text: 'Nsụgharị ọdịnala: “Jizọs Kraịst.” Aha-ọkwa Grik Χριστός nwere ike ịpụta “Mesaya” ma ọ bụ rụọ ọrụ dịka akụkụ aha, “Kraịst.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τεκνία μου
  choice: Ụmụntakịrị m
  rationale: Nke a na-echekwa okwu ezinụlọ ahụ na mmetụta ịhụnanya dị n’ụdị mbelata τεκνία, ma bụrụkwa okwu a pụrụ ịghọta n’Igbo ugbu a.
- source_word: ταῦτα γράφω ὑμῖν
  choice: ana m edere unu ihe ndị a
  rationale: Ụdị a na-egosi omume ide akwụkwọ ahụ nke na-aga n’ihu, ma na-echekwa ταῦτα dịka “ihe ndị a” n’etinyeghị nkọwa na-adịghị n’isi mmalite.
- source_word: ἵνα μὴ ἁμάρτητε
  choice: ka unu ghara ime mmehie
  rationale: Ọ na-egosipụta ebumnuche nke ἵνα na subjunctive n’Igbo doro anya, n’ekwughị na ndị a na-agwa agaghị enwe ike ime mmehie ma ọlị.
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: Ma ọ bụrụ na onye ọ bụla emee mmehie
  rationale: “Ma” na-egosi ọdịiche dị n’etiti ebumnuche ka ha ghara ime mmehie na ọnọdụ e nwere ike ime; “ọ bụrụ na” na-echekwa ọnọdụ ahụ.
- source_word: παράκλητον
  choice: onye na-ekwuchitere anyị
  rationale: N’ọnọdụ a, okwu ahụ na-egosi onye na-anọchite anya ma na-arịọchitere ndị ọzọ; ntụgharị a bụ nke ndị Igbo nkịtị ga-aghọta ma ọ naghị egbochi obosara ihe okwu Grik ahụ pụrụ ịpụta.
- source_word: πρὸς τὸν πατέρα
  choice: n’ebe Nna nọ
  rationale: Nke a na-egosi ọnụnọ na mmekọrịta ya na Nna, kama ịkọwa πρός naanị dịka ngagharị n’ebe mmadụ nọ.
- source_word: Ἰησοῦν Χριστὸν
  choice: Jizọs, bụ Mesaya
  rationale: Χριστός nọ ebe a dịka aha-ọkwa nke na-akọwa Jizọs. “Bụ Mesaya” bụ usoro Igbo eke nke na-eme ka aha-ọkwa ahụ doo anya.
- source_word: δίκαιον
  choice: Onye Ezi Omume
  rationale: Nke a na-enye adjective ahụ ike aha-ọkwa n’Igbo ma na-egosipụta na Jizọs bụ onye ziri ezi, n’etinyeghị nkọwa ozizi ọzọ.
theological_decisions:
- issue: Ebumnuche nke ἵνα μὴ ἁμάρτητε na ohere onye kwere ekwe ime mmehie
  choice: E chekwara ma ebumnuche “ka unu ghara ime mmehie” ma ọnọdụ “ọ bụrụ na onye ọ bụla emee mmehie.”
  alternative: Ịsụgharị ya n’ụzọ ga-egosi na ndị a na-agwa eruola ọnọdụ nke enweghị ike ime mmehie.
  rationale: 'Ahịrịokwu abụọ ahụ na-edobe esemokwu dị n’ihe odide ahụ: Jọn chọrọ ka ha ghara ime mmehie, ma ọ na-ekwukwa ihe ga-adị ma onye ọ bụla mee ya.'
- issue: Ọrụ παράκλητος n’ebe Nna nọ
  choice: onye na-ekwuchitere anyị
  alternative: onye inyeaka; onye ndụmọdụ; onye nkasi obi
  rationale: Ọnọdụ nke ịnọ n’ebe Nna nọ na-akwado echiche nke onye na-anọchite anya ma na-arịọchitere ndị ọzọ, ma nkọwa ala peeji na-echekwa obosara okwu Grik ahụ.
- issue: Igosipụta Χριστός dịka aha-ọkwa
  choice: Mesaya
  alternative: Kraịst
  rationale: N’usoro a, Χριστός na-arụ ọrụ dịka aha-ọkwa e nyere Jizọs; “Mesaya” na-eme ka ọrụ aha-ọkwa ahụ pụta ìhè, ebe e debere ụdị ọdịnala “Kraịst” na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. “Ụmụntakịrị m” na-echekwa olu ịhụnanya nke onye ode akwụkwọ; “onye na-ekwuchitere anyị” bụ okwu nkịtị karịa okwu iwu siri ike. E tinyere akara nkọwa [a] ozugbo n’akụkụ okwu παράκλητος na [b] n’akụkụ aha-ọkwa Mesaya ka akara ọ bụla kwekọọ na nkọwa ya.
