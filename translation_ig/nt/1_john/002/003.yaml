  text: Καὶ ἐν τούτῳ γινώσκομεν ὅτι ἐγνώκαμεν αὐτόν, ἐὰν τὰς ἐντολὰς αὐτοῦ τηρῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/003.yaml
  text: 'And by this we know that we have come to know him: if we keep his commandments[a].'
translation:
  language: ig
  text: 'Sitekwa na nke a ka anyị ji mara na anyị abịala ịmata ya: ma ọ bụrụ na anyị na-edebe iwu ya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ka nso n’okwu Grik, ‘na anyị amatala ya’; ụdị perfect nke ngwaa Grik nwere ike ịpụta ‘anyị abịala ịmata ya.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: site na nke a
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ doro anya na ihe na-esote bụ ihe akaebe e ji amata eziokwu ahụ; ọ na-echekwa ike nke okwu nrụtụ aka Grik.
- source_word: γινώσκομεν
  choice: anyị ji mara
  rationale: Oge ugbu a nke ngwaa Grik na-egosi ịmata ma ọ bụ inwe nkwenye ugbu a; ‘anyị ji mara’ dabara n’usoro ‘site na nke a’ ma bụrụkwa Igbo nkịtị.
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: na anyị abịala ịmata ya
  rationale: Ụdị perfect nke ἐγνώκαμεν na-egosi na mmadụ batara n’ịmata ya, nke nsonaazụ ya ka dị ugbu a. ‘Abịala ịmata’ na-echekwa nghọta a karịa naanị ‘anyị maara.’
- source_word: αὐτόν
  choice: ya
  rationale: E debere nnọchiaha ahụ dịka Grik si dị, n’akọwaghị ya kpọmkwem dịka Chineke ma ọ bụ Kraịst, ka a ghara idozi ihe amaokwu ahụ hapụrụ n’ụzọ nwere ike ịpụta ihe karịrị otu.
- source_word: ἐὰν
  choice: ma ọ bụrụ na
  rationale: Nke a na-egosipụta ọnọdụ ma ọ bụ ule e nyere n’ahịrịokwu ahụ n’Igbo doro anya.
- source_word: ἐντολάς
  choice: ihe o nyere n’iwu
  rationale: Nkebiokwu a bụ Igbo ebumpụta ụwa maka iwu onye nyere, ma na-echekwa ịdị arọ nke ἐντολή karịa okwu nwere naanị echiche ndụmọdụ.
- source_word: τηρῶμεν
  choice: anyị na-edebe
  rationale: ‘Idobe’ na-agụnye irube isi na ilekọta iwu, ma na-echekwa obosara ihe τηρέω pụtara karịa ịkọwa ya naanị dịka nrubeisi.
theological_decisions:
- issue: Onye αὐτόν (‘ya’) na-ezo aka na ya
  choice: Idowe nnọchiaha ‘ya’ n’akọwaghị ma ọ bụ Chineke ma ọ bụ Jizọs/Kraịst.
  alternative: Ịsụgharị ya kpọmkwem dịka ‘Chineke’ ma ọ bụ ‘Jizọs/Kraịst.’
  rationale: Ihe odide Grik jiri nnọchiaha, ebe gburugburu akwụkwọ ahụ na-ejikọta ịmata Chineke na mmekọrịta mmadụ na Ọkpara ya. Idowe ‘ya’ na-echekwa mgbagwoju anya na esemokwu nkà mmụta okpukpe dị n’ederede n’onwe ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta nye ndị na-agụ akwụkwọ taa. E ji ‘ihe o nyere n’iwu’ zere usoro siri ike ma ọ bụ nke ochie, ebe ‘na-edebe’ na-echekwa ụda Akwụkwọ Nsọ na nghọta nke irube isi.
