  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: ig
  text: Ụwa na ọchịchọ ya na-agabiga[a][b]; ma onye na-eme uche Chineke na-anọgide ruo mgbe ebighị ebi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “na-agabiga” dịka “na-ala n’iyi.” Ụdị ngwaa Grik na-egosi na ihe a na-aga n’ihu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “ọchịchọ” dịka “agụụ” ma ọ bụ “agụụ ọjọọ.” N’ebe a, ọ na-ezo aka n’ọchịchọ ụwa a kọwara n’amaokwu nke 16, ọ bụghị nanị agụụ mmekọahụ.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị “na-anọgide” dịka “na-adịgide.” Ọ bụ okwu dị mkpa n’ihe odide Jọn, nke na-egosi ịnọgide ma ọ bụ ịdịgide.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: ụwa
  rationale: “Ụwa” bụ okwu Igbo sara mbara ma kwekọọ na ojiji Jọn. N’ebe a, amaokwu ndị gbara ya gburugburu na-egosi na ọ pụtara ụwa nke ọchịchọ na ụkpụrụ ya na-emegide Chineke, ọ bụghị nanị ihe e kere eke.
- source_word: παράγεται
  choice: na-agabiga
  rationale: Ụdị ngwaa dị ugbu a na-egosi ihe na-aga n’ihu. “Na-agabiga” na-egosipụta na ụwa a adịghị adịgide, kama ọ nọ n’ụzọ ịla n’iyi.
- source_word: ἐπιθυμία
  choice: ọchịchọ
  rationale: “Ọchịchọ” na-eburu echiche nke agụụ siri ike n’enweghị ime ka ọ bụrụ nanị agụụ mmekọahụ. Ọnọdụ 1 Jọn 2:15–16 na-eme ka ọdịdị ọjọọ nke ọchịchọ a doo anya.
- source_word: αὐτοῦ
  choice: ya
  rationale: “Ya” na-ezo aka n’ụwa ma na-echekwa njikọ doro anya dị n’asụsụ Grik.
- source_word: ὁ δὲ ποιῶν
  choice: ma onye na-eme
  rationale: Nke a na-egosipụta otu onye nnọchiteanya nke a na-amata site n’ime uche Chineke, n’asụsụ Igbo dị mfe ma dị ugwu.
- source_word: θέλημα τοῦ θεοῦ
  choice: uche Chineke
  rationale: “Uche Chineke” bụ ụzọ e si ekwu nke a n’Igbo nke ọma; ọ na-echekwa echiche nke ihe Chineke chọrọ na nzube ya.
- source_word: μένει
  choice: na-anọgide
  rationale: “Na-anọgide” na-echekwa isi echiche Jọn nke ịnọgide na ịdịgide, ma bụrụkwa okwu ndị na-agụ Igbo ugbu a ga-aghọta nke ọma.
- source_word: εἰς τὸν αἰῶνα
  choice: ruo mgbe ebighị ebi
  rationale: Nkebi okwu a na-egosi ịdịgide na-enweghị ọgwụgwụ; “ruo mgbe ebighị ebi” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe.
theological_decisions:
- issue: Ihe κόσμος pụtara n’ebe a
  choice: E debere ya dịka “ụwa,” ebe ọnọdụ okwu na-egosi usoro ọchịchọ na ụkpụrụ ụwa nke na-emegide Chineke.
  alternative: Ịkọwa ya kpọmkwem dịka “usoro ụwa nke na-emegide Chineke,” ma ọ bụ were ya dịka ụwa e kere eke.
  rationale: Okwu Grik ahụ sara mbara, ma 1 Jọn 2:15–16 na-akọwa ihe onye dere akwụkwọ bu n’obi. Ide naanị “ụwa” na-echekwa ịdị sara mbara nke okwu ahụ ma ghara itinye nkọwa n’ime amaokwu ahụ karịa ihe e kwuru.
- issue: Ihe μένει εἰς τὸν αἰῶνα na-ekwu banyere onye na-eme uche Chineke
  choice: “Na-anọgide ruo mgbe ebighị ebi,” nke na-ekwupụta ịdịgide onye ahụ.
  alternative: Ịkọwa ya n’ụzọ sara mbara dịka nkwa kpọmkwem banyere ndụ ebighị ebi.
  rationale: Asụsụ Grik na-ekwupụta ịdịgide ruo mgbe ebighị ebi, ma ọ naghị akọwa usoro nkà mmụta okpukpe nke nkwa ahụ. Nsụgharị ahụ na-echekwa ibu okwu ahụ n’etinyeghị nkọwa ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma dị ugwu. Nhazi ahịrịokwu ahụ na-echekwa ọdịiche dị n’etiti ụwa na-agabiga na onye na-eme uche Chineke nke na-anọgide. E zere okwu ụka ochie ebe okwu ndị mmadụ na-aghọta nke ọma nwere ike iburu otu echiche ahụ.
