id: 1JN.2.21
reference: 1 John 2:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ ἔγραψα ὑμῖν ὅτι οὐκ οἴδατε τὴν ἀλήθειαν, ἀλλ’ ὅτι οἴδατε αὐτήν, καὶ ὅτι πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: ig
  text: Edeere m unu akwụkwọ[a], ọ bụghị n’ihi na unu amaghị eziokwu ahụ, kama n’ihi na unu maara ya, nakwa n’ihi na ọ dịghị ụgha ọ bụla sitere n’eziokwu ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya n’ụzọ na-esochi usoro okwu Grik nso: “Edeghị m unu akwụkwọ n’ihi na unu amaghị eziokwu ahụ, kama n’ihi na unu maara ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: Edeere m unu akwụkwọ
  rationale: 'Oge aorist ahụ na-ekwu banyere idegara ndị a akwụkwọ. Nhazi a bụ Igbo dị ire ma na-edobe isi ọdịiche ahụ: ihe kpatara o ji dee abụghị na ha amaghị eziokwu, kama na ha maara ya.'
- source_word: οἴδατε
  choice: unu maara
  rationale: “Ịma” bụ okwu Igbo nkịtị kwekọrọ na οἶδα; mmegharị ya n’ahịrịokwu ahụ na-echekwa ọdịiche dị n’etiti “unu amaghị” na “unu maara.”
- source_word: τὴν ἀλήθειαν
  choice: eziokwu ahụ
  rationale: “Eziokwu ahụ” na-echekwa aha ngosi dị na Grik ma ghara ime ka okwu Jọn pụtara naanị otu ozi ozizi pụrụ iche.
- source_word: πᾶν ψεῦδος
  choice: ọ dịghị ụgha ọ bụla
  rationale: 'Nke a bụ ụzọ Igbo si ekwu ngọnarị zuru ụwa ọnụ n’ụzọ doro anya: ọ dịghị otu ụgha ọbụla.'
- source_word: ἐκ τῆς ἀληθείας
  choice: sitere n’eziokwu ahụ
  rationale: “Sitere” na-egosi isi mmalite ma ọ bụ ebe ihe si bịa, nke kwekọrọ na ἐκ n’ebe a.
theological_decisions:
- issue: Ihe “eziokwu ahụ” pụtara n’akwụkwọ Jọn
  choice: eziokwu ahụ
  alternative: ozi eziokwu ahụ; eziokwu nke ozi ọma
  rationale: E debere okwu ahụ n’obosara ya dịka Grik siri kwuo ya, n’agbanyeghị omimi okpukpe ọ nwere n’akwụkwọ Jọn; a gbakwụnyeghị nkọwa ozizi nke amaokwu a n’onwe ya ekwughị.
- issue: Mmekọrịta ụgha na eziokwu
  choice: ọ dịghị ụgha ọ bụla sitere n’eziokwu ahụ
  alternative: ọ dịghị ụgha ọ bụla bụ nke eziokwu ahụ
  rationale: Nhọrọ a na-edobe echiche nke isi mmalite dị na ἐκ ma ghara ịgbanwe ya ka ọ bụrụ nkwupụta sara mbara karịa ihe ederede kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A haziri mmalite ahịrịokwu ahụ n’ụzọ Igbo nkịtị iji gbochie ka ngọnarị abụọ ahụ mee ka ihe ọ pụtara gbagwojuo anya, ma e debere ọdịiche na esemokwu dị n’ederede Grik.
