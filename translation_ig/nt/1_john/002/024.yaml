id: 1JN.2.24
reference: 1 John 2:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: ig
  text: Ma unu, ka ihe unu nụrụ site ná mmalite[a] nọgide n’ime unu. Ọ bụrụ na ihe unu nụrụ site ná mmalite anọgide n’ime unu,[b] unu kwa ga-anọgide n’ime Ọkpara na n’ime Nna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe ahụ unu nụrụ site ná mmalite.” Okwu ahụ anaghị kpọọ ya “ozi” kpọmkwem, n’agbanyeghị na ọnọdụ ya na-ekwu maka ozi mbụ banyere Ọkpara.
    reason: lexical_alternative
  - marker: b
    text: “Nọgide” sụgharịrị otu ngwaa Grik ahụ e ji mee ihe ugboro atọ n’amaokwu a; a pụkwara ịsụgharị ya “dịgide.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Ma unu onwe unu
  rationale: Nnọchiaha ahụ dị n’ihu ahịrịokwu maka imesi ndị a na-agwa okwu ike ma gosi ọdịiche dị n’etiti ha na ndị nkuzi ụgha a kpọtụrụ aha n’amaokwu ndị bu ụzọ. “Ma unu onwe unu” na-egosipụta nke a n’Igbo dị ugbu a.
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: ihe unu nụrụ site ná mmalite
  rationale: “Ihe unu nụrụ” na-edebe obosara nke nnọchiaha neuter ὃ n’ebughị ụzọ kọwaa ya dị ka “oziọma” ma ọ bụ “ozizi ndịozi.” “Site ná mmalite” na-echekwa okwu Jọn na nkwughachi ya.
- source_word: ἐν ὑμῖν μενέτω
  choice: ka ... nọgide n’ime unu
  rationale: Ụdị iwu dị ugbu a na-akpọ ndị na-agụ akwụkwọ ka ihe ahụ nọgide na-adị n’ime ha. “Nọgide” bụ okwu Igbo doro anya nke na-enye ohere idowe otu mgbọrọgwụ okwu n’ebe μένω pụtara ugboro atọ n’amaokwu a.
- source_word: ἐὰν ἐν ὑμῖν μείνῃ
  choice: Ọ bụrụ na ... anọgide n’ime unu
  rationale: Nke a na-egosipụta ọnọdụ nke ἐάν na subjunctive n'ụzọ Igbo nkịtị, ma na-ejigide nkwughachi nke μένω.
- source_word: καὶ ὑμεῖς
  choice: unu onwe unu ... kwa
  rationale: “Unu onwe unu” na-echekwa nkwesi ike nke nnọchiaha e kwuru kpọmkwem, ebe “kwa” na-ebute echiche nke καί, ya bụ, “unu kwa.”
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: n’ime Ọkpara ahụ na n’ime Nna ahụ
  rationale: A kwughachiri “n’ime” iji chekwaa nhazi yiri ibe ya nke ἐν ... καὶ ἐν. “Ọkpara ahụ” na “Nna ahụ” na-arụ ọrụ dị ka aha nsọpụrụ n’ebe a.
- source_word: μενεῖτε
  choice: ga-anọgide
  rationale: “Ga-anọgide” na-egosipụta future indicative n’enweghị ịgbanwe ya ka ọ bụrụ iwu ma ọ bụ itinye nkọwa ozizi ọzọ.
theological_decisions:
- issue: Ihe ọnọdụ ahụ na nkwa dị na nkebi ikpeazụ pụtara
  choice: unu onwe unu ga-anọgidekwa n’ime Ọkpara ahụ na n’ime Nna ahụ
  alternative: Ịsụgharị ya dị ka ndụmọdụ ma ọ bụ iwu, ma ọ bụ ịkọwa ya dịka nkwupụta zuru ezu banyere ozizi ntachi obi nke ndị kwere ekwe
  rationale: Asụsụ Grik na-enye okwu nwere ọnọdụ, ma jiri future indicative kwuo ihe ga-esi na ya pụta. Nsụgharị ahụ na-edebe njikọ a n’akọwaghị ya dịka otu ozizi ụka pụrụ iche.
- issue: Ihe okwu “ihe unu nụrụ site ná mmalite” na-ezo aka na ya
  choice: A hapụrụ ya ka ọ bụrụ “ihe unu nụrụ,” dịka asụsụ Grik si kwuo ya n’obosara.
  alternative: oziọma unu nụrụ; ozi ndịozi unu nụrụ; ozizi banyere Ọkpara ahụ
  rationale: Ọnọdụ okwu gbara amaokwu a gburugburu na-egosi na ọ ga-abụ ozi mbụ banyere Ọkpara ahụ, ma ὃ n’onwe ya akọwaghị ya kpọmkwem. Ya mere, e debere obosara ahụ n’ahịrịokwu, kọwaa ihe nwere ike ịbụ ihe ọ na-ezo aka na ya n’okpuru ala peeji.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ugwu ma dị mfe nghọta. E debere nkwughachi nke “nọgide,” “n’ime unu,” na “n’ime ... na n’ime ...” n’ihi na ha bụ akụkụ dị mkpa nke usoro na echiche nke amaokwu Grik ahụ. Akara ụdaume dị na “ná mmalite” na-enyere aka igosi njikọ “na + a” nke ọma.
