source:
  edition: SBLGNT
  text: ἐὰν εἰδῆτε ὅτι δίκαιός ἐστιν, γινώσκετε ⸀ὅτι πᾶς ὁ ποιῶν τὴν δικαιοσύνην ἐξ αὐτοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: ig
  text: Ọ bụrụ na unu maara na ọ bụ onye ezi omume[b], unu makwaara na onye ọ bụla na-eme ezi omume bụ onye a mụrụla site na ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “onye a mụrụla nke ya.” Okwu Grik ahụ ἐξ αὐτοῦ nwere ike igosi mmekọrịta nke sitere n’aka ya ma ọ bụ nke ya.
    reason: lexical_alternative
  - marker: b
    text: Nnọchiaha “ọ” nwere ike ịzo aka na Chineke Nna ma ọ bụ n’Ọkpara; okwu Grik ebe a akọwaghị kpọmkwem onye ọ bụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν εἰδῆτε
  choice: Ọ bụrụ na unu maara
  rationale: “Ọ bụrụ na” na-egosi ọnọdụ e tinyere n’okwu ahụ, ebe “unu maara” na-enye echiche οἶδα n’Igbo dị mfe ma doo anya.
- source_word: δίκαιός ἐστιν
  choice: ọ bụ onye ezi omume
  rationale: N’Igbo nke oge a, “onye ezi omume” na-egosi onye ziri ezi n’omume na n’ọnọdụ omume; ọ na-ejikọkwa nke ọma na δικαιοσύνη nke sochiri ya.
- source_word: γινώσκετε
  choice: unu makwaara
  rationale: A ghọtara ụdị ngwaa a dị ka nkwupụta, ọ bụghị iwu. “-kwa-” na-eme ka njikọ na ihe ọmụma e kwuru ná mmalite pụta ìhè, ma ọ naghị ekwu na ngwaa Grik abụọ ahụ bụ otu.
- source_word: πᾶς ὁ ποιῶν τὴν δικαιοσύνην
  choice: onye ọ bụla na-eme ezi omume
  rationale: Ụdị “na-eme” na-egosi omume a na-eme mgbe niile ma ọ bụ nke e ji mara mmadụ, dịka present participle si dị, ebe “ezi omume” na-enye echiche δικαιοσύνη n’ọnọdụ a.
- source_word: ἐξ αὐτοῦ γεγέννηται
  choice: bụ onye a mụrụla site n’aka ya
  rationale: “A mụrụla” na-echekwa olu nnara na ọnọdụ na-adịgide adịgide nke perfect passive; “site n’aka ya” na-egosi isi mmalite ma hapụ “ya” ka ọ ghara ịkọwapụta onye ọ bụ.
theological_decisions:
- issue: Onye nnọchiaha “ọ/ya” na-ezo aka na ya na δίκαιός ἐστιν ... ἐξ αὐτοῦ
  choice: E debere nnọchiaha “ọ” na “ya” n’akpọghị onye ahụ aha.
  alternative: Ịkpọ ya Chineke Nna ma ọ bụ Ọkpara.
  rationale: Amaokwu a n’onwe ya akọwaghị kpọmkwem ma nnọchiaha ahụ ọ na-ezo aka na Chineke Nna ka ọ bụ Ọkpara. Ịhapụ nnọchiaha ahụ na-echekwa nghọta abụọ ahụ na esemokwu nkà mmụta okpukpe dị na ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. “Unu” na-egosi na okwu ahụ bụ nye ọtụtụ ndị. A họọrọ “onye ezi omume/ezi omume” iji debe njikọ okwu dị n’etiti δίκαιος na δικαιοσύνη; a zere ịkpọ Nna ma ọ bụ Ọkpara aha n’ihi na isi mmalite ahụ hapụrụ onye nnọchiaha ahụ na-ezo aka na ya ka ọ ghara ido anya.
