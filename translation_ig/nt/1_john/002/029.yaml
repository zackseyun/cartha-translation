    rationale: ‘Onye sitere na ya mụọ’ is not idiomatic Standard Igbo in this context, while the explanation that the Greek ‘indicates that he is the source’ presents one interpretive nuance as though it exhausted the expression’s range. The note should state the lexical alternative without resolving the referent or overexplaining the relationship.
  - severity: low
    issue: ‘site n’aka ya’ in the verse can imply agency or instrumentality.
    rationale: For ἐξ αὐτοῦ with γεγέννηται, ‘site na ya’ is the more direct Igbo expression of origin/source and better preserves the Greek wording.
