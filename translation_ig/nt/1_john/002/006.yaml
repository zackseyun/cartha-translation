  text: ὁ λέγων ἐν αὐτῷ μένειν ὀφείλει καθὼς ἐκεῖνος περιεπάτησεν καὶ ⸀αὐτὸς περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/006.yaml
  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: ig
  text: Onye na-ekwu na ọ na-anọgide n'ime ya[a] kwesịrị ka ya onwe ya kwa na-eje ije dịka onye ahụ[b] jere ije.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ na-adịgide n'ime ya.” Okwu Grik μένω bụ okwu dị mkpa n'akwụkwọ ndị Jọn dere, na-egosi ịnọgide, ịdịgide, ma ọ bụ ịnọgide na mmekọrịta.
    reason: lexical_alternative
  - marker: b
    text: “Onye ahụ” na-ezo aka na Jizọs ma na-edobe nkwusi ike nke okwu ngosipụta Grik; ọtụtụ nsụgharị na-eji naanị “ọ.”
    reason: alternative_reading
  - marker: c
    text: “Ije ije” bụ ihe atụ Akwụkwọ Nsọ maka ụzọ mmadụ si ebi ndụ; ya bụ, onye ahụ kwesịrị ibi ndụ dịka Jizọs biri.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λέγων
  choice: Onye na-ekwu
  rationale: Nkebi okwu a na-arụ ọrụ dịka aha ma na-ezo aka n'onye ọ bụla na-ekwu ihe a; nsụgharị a na-edobe otu onye nke Grik ma bụrụkwa Igbo doro anya.
- source_word: ἐν αὐτῷ μένειν
  choice: ọ na-anọgide n'ime ya
  rationale: “Na-anọgide” na-egosipụta ịdịgide ma ọ bụ ịnọgide na mmekọrịta, nke bụ isi echiche μένω n'akwụkwọ Jọn; “n'ime ya” na-edobe ἐν αὐτῷ n'enweghị ịkọwapụta ihe odide ahụ ekwughị kpọmkwem.
- source_word: ὀφείλει
  choice: kwesịkwara
  rationale: “Kwesịrị” na-egosipụta ọrụ omume ma ọ bụ ihe mmadụ ji ụgwọ ime, n'enweghị ụda iwu siri ike karịa nke okwu Grik; “-kwa” na-enyere aka iburu καί dị n'ahịrịokwu ahụ.
- source_word: καθὼς
  choice: dịka
  rationale: “Dịka” na-egosipụta ntụnyere nke ụzọ ma ọ bụ ụdị omume n'ụzọ dị mfe ma kwekọọ na καθώς.
- source_word: ἐκεῖνος
  choice: onye ahụ
  rationale: “Onye ahụ” na-edobe ike ngosipụta nke ἐκεῖνος karịa iji naanị nnọchiaha “ọ”; ihe gbara amaokwu ahụ gburugburu na-egosi na ọ na-ezo aka na Jizọs.
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: jere ije ... ije ije
  rationale: E debere ihe atụ nke “ije ije,” nke na-anọchi anya ụzọ mmadụ si ebi ndụ n'okwu Akwụkwọ Nsọ; ọdịiche dị n'etiti ihe onye ahụ mere na ihe a chọrọ ka onye na-ekwu mee ka dị.
- source_word: καὶ αὐτὸς
  choice: ya onwe ya
  rationale: “Ya onwe ya” na-edobe nkwusi ike αὐτός tinyere echiche na onye ahụ kwa kwesịrị ime otu ihe ahụ.
theological_decisions:
- issue: Onye αὐτῷ na ἐκεῖνος na-ezo aka na ya
  choice: E jiri “ya” na “onye ahụ,” ebe ihe gbara amaokwu ahụ gburugburu na-eme ka a ghọta na ọ bụ Kraịst/Jizọs.
  alternative: Ịsụgharị ya ozugbo dịka “Jizọs” ma ọ bụ “Kraịst.”
  rationale: Ihe gbara amaokwu ahụ gburugburu na-akwado Jizọs dịka onye a na-ezo aka na ya, ma Grik n'onwe ya ji nnọchiaha na okwu ngosipụta; ide aha ya ozugbo ga-ewepụ ntakịrị ohere ntụaka dị n'ụdị okwu mbụ.
- issue: Ije ije dịka ihe atụ nke ndụ
  choice: E debere “ije ije” n'amaokwu ahụ ma kọwaa ya n'okpuru.
  alternative: Ịsụgharị ya ozugbo dịka “ibi ndụ.”
  rationale: περιπατέω bụ ihe atụ Akwụkwọ Nsọ a ma ama maka omume na ụzọ ndụ. Ide “ibi ndụ” ga-eme ka ihe ọ pụtara doo anya, ma ọ ga-efunahụ ihe atụ na njikọ ya na okwu ndị ọzọ dị n'Akwụkwọ Nsọ.
- issue: Ụdị otu onye nke ὁ λέγων na αὐτός
  choice: 'E debere otu onye: “Onye na-ekwu ... ya onwe ya.”'
  alternative: Ịgbanwe ya ka ọ bụrụ ọtụtụ mmadụ ma ọ bụ kwuo ya n'ụzọ na-enweghị nnọchiaha.
  rationale: Grik na-eji otu onye dịka onye nnọchiteanya. Igbo nwere ike ide ya n'ụzọ sitere n'okike n'enweghị ịgbanwe ya ka ọ bụrụ ọtụtụ mmadụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro otu onye na ihe atụ “ije ije,” ma jiri nkọwa ala peeji mee ka echiche mmekọrịta nke μένω na echiche ụzọ ndụ nke περιπατέω pụta ìhè.
