revisions:
- from: Onye na-ekwu na ọ na-anọgide n'ime ya[a] kwesịkwara, ya onwe ya, ije ije dịka onye ahụ[b] jere ije.[c]
  to: Onye na-ekwu na ọ na-anọgide n'ime ya[a] kwesịrị ka ya onwe ya kwa na-eje ije dịka onye ahụ[b] jere ije.[c]
  rationale: The revision retains every major lexical and rhetorical feature of the Greek while replacing an awkward infinitive-like phrase with a natural ongoing Igbo construction. It also makes the Johannine scope of the lexical note accurate without specifying more than the Greek text does.
  reviewer_model: gpt-5.6-terra
