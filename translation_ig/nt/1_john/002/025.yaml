id: 1JN.2.25
reference: 1 John 2:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐπαγγελία ἣν αὐτὸς ἐπηγγείλατο ἡμῖν, τὴν ζωὴν τὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/025.yaml
  text: 'And this is the promise that he himself promised us: eternal life[a][b].'
translation:
  language: ig
  text: 'Nke a bụkwa nkwa ahụ ya onwe ya[b] kwere anyị: ndụ ebighị ebi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndụ ebighị ebi ahụ.” Asụsụ Grik ji okwu na-egosi na ndụ ahụ bụ nke a kapịrị ọnụ, ma n’Igbo, “ndụ ebighị ebi” na-ada nke ọma ma ka na-enye otu echiche ahụ.
    reason: lexical_alternative
  - marker: b
    text: Okwu “ya onwe ya” nwere nkwusi ike n’asụsụ Grik. Amaokwu a ekwughị kpọmkwem ma ọ na-ezo aka na Nna ka ọ bụ n’Ọkpara.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελία / ἐπηγγείλατο
  choice: nkwa / kwere
  rationale: “Nkwa” na “kwere” bụ ụzọ Igbo doro anya si akọwa nkwa na ime nkwa. Iji ha abụọ na-echekwa njikọ dị n’etiti aha na ngwaa ndị si n’otu mgbọrọgwụ pụta n’asụsụ Grik.
- source_word: αὐτός
  choice: ya onwe ya
  rationale: “Ya onwe ya” na-echekwa nkwusi ike dị na nnọchiaha Grik kama ịsụgharị ya nanị dị ka “o.”
- source_word: ἡμῖν
  choice: anyị
  rationale: “Kwere anyị” bụ usoro okwu Igbo dị mfe ma kwekọọ na dative nke na-egosi ndị e kwere nkwa ahụ.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ okwu Igbo doro anya na nke a na-ejikarị akọwa ζωή αἰώνιος; ọ na-egosikwa ihe nkwa ahụ bụ.
- source_word: καὶ αὕτη ἐστίν
  choice: Nke a bụkwa
  rationale: Usoro a na-ejikọta amaokwu ahụ na ihe e kwuru tupu ya ma na-egosipụta ihe a na-achọ ịkọwa ugbu a.
theological_decisions:
- issue: Onye “ya onwe ya” na-ezo aka na ya
  choice: E debere ya dị ka “ya onwe ya” n’akọwaghị ma ọ bụ Nna ka ọ bụ Ọkpara.
  alternative: Nna; ma ọ bụ Ọkpara
  rationale: Amaokwu Grik a akpọghị onye ahụ aha ọzọ kpọmkwem. Nsụgharị ahụ na-echekwa mgbagwoju anya na nkwusi ike nke ederede kama ikpebi ihe ederede n’onwe ya na-ekwughị hoo haa.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ikwughachi “nkwa … kwere” iji gosipụta njikọ okwu dị na Grik, a hapụkwara onye nnọchiaha ahụ na-ezo aka na ya ka ọ ghara ịbụ nke nsụgharị kpebiri n’enweghị nkwado doro anya n’amaokwu ahụ.
