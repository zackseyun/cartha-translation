id: 1JN.2.13
reference: 1 John 2:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: ig
  text: Ana m edegara unu[a], ndị nna, n’ihi na unu amatala onye ahụ dị site ná mmalite; ana m edegara unu, ụmụ okorobịa, n’ihi na unu emeriwo ajọ onye ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ahụ sitere ná mmalite”; o yikarịrị ka okwu a na-ezo aka n’Ọkpara ahụ, ọ bụ ezie na ụfọdụ na-ewere ya dịka okwu na-ezo aka na Chineke n’ozuzu.
    reason: alternative_reading
lexical_decisions:
- source_word: γράφω
  choice: ana m edetara unu
  rationale: Okwu a dị n’ụdị ugbu a; ntụgharị a na-egosi omume ide akwụkwọ ozi a ugbu a ma na-ada nke ọma n’Igbo.
- source_word: πατέρες
  choice: ndị nna
  rationale: Nke a na-echekwa kpọmkwem aha nwoke ọtụtụ nke Grik, n’agbanyeghị na n’ebe a o nwere ike ịbụ aha a na-akpọ ndị tozuru oke n’okwukwe.
- source_word: ἐγνώκατε
  choice: unu amatala
  rationale: Ụdị perfect na-egosi ịmata nke mere eme ma nke nsonaazụ ya ka dị ugbu a; “amatala” na-egosipụta nke a n’Igbo.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: onye ahụ dị site ná mmalite
  rationale: A hapụrụ onye okwu a na-ezo aka na ya n’ụzọ na-akpọghị aha, dịka Grik si mee, ma debe echiche nke ịdị site ná mmalite.
- source_word: νεανίσκοι
  choice: ụmụ okorobịa
  rationale: Okwu Grik bụ aha nwoke ọtụtụ; “ụmụ okorobịa” bụ okwu Igbo doro anya ma kwekọọ na ya.
- source_word: νενικήκατε
  choice: unu emeriwo
  rationale: Ụdị perfect na-egosi mmeri e meriri nke mmetụta ya ka na-adị; “emeriwo” na-echekwa akụkụ a.
- source_word: τὸν πονηρόν
  choice: ajọ onye ahụ
  rationale: Edemede nwoke otu na adjective e ji dịka noun na-akwado onye ajọ omume kpọmkwem, ọ bụghị ajọ ihe n’ozuzu; a kpọghị ya Setan n’ihi na Grik akpọghị aha ahụ.
theological_decisions:
- issue: Onye “onye ahụ dị site ná mmalite” na-ezo aka na ya
  choice: E debere ya dịka “onye ahụ dị site ná mmalite” n’akpọghị onye ahụ aha kpọmkwem.
  alternative: Ịkọwa ya kpọmkwem dịka Ọkpara ahụ/Kraịst, ma ọ bụ dịka Chineke n’ozuzu.
  rationale: Ojiji Jọn na-egosi na o yikarịrị ka ọ na-ezo aka n’Ọkpara ahụ, ma amaokwu Grik akpọghị ya aha; ntụgharị ahụ na-echekwa oghere nkọwa na esemokwu nkà mmụta okpukpe dị n’ederede.
- issue: Ihe “ajọ onye ahụ” pụtara
  choice: Onye iro ajọ omume kpọmkwem.
  alternative: Ajọ ihe dịka echiche na-abụghị onye.
  rationale: Ụdị nwoke otu nke nwere article na-akwado onye kpọmkwem, nke a na-aghọtakarị dịka Setan, ma a naghị etinye aha nke Grik na-ekwughị.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. E debere usoro okwu abụọ ahụ yiri ibe ha, ọdịiche nwoke dị na “ndị nna” na “ụmụ okorobịa,” na mgbagwoju anya gbasara onye dị site ná mmalite.
