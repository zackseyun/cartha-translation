id: 1JN.2.22
reference: 1 John 2:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: ig
  text: Ònye bụ onye ụgha ahụ ma ọ bụghị onye na-agọnahụ na Jizọs bụ Mesaịa ahụ[a]? Onye dị otu a bụ Antikraịst ahụ[b], onye na-agọnahụ Nna na Ọkpara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Kraịst ahụ.” Okwu Grik bụ ὁ χριστός; ebe a ọ bụ utu aha, ya mere e jiri “Mesaịa ahụ” sụgharịa ya.
    reason: alternative_reading
  - marker: b
    text: 'A pụkwara ịsụgharị ya, “antikraịst.” N’asụsụ Grik, okwu ahụ nwere mkpụrụokwu nkọwa: “antikraịst ahụ.” N’akwụkwọ ozi Jọn, okwu a pụrụ ịpụta onye ma ọ bụ ụdị ndị mmegide a na-amata site n’ịgọnahụ Nna na Ọkpara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: onye ụgha ahụ
  rationale: Njikọ ya na mkpụrụokwu njirimara ὁ na-egosi onye ụgha a kọwara kpọmkwem n’ọnọdụ a, ọ bụghị naanị onye ụgha ọ bụla.
- source_word: ἀρνούμενος
  choice: onye na-agọnahụ
  rationale: Ụdị participle dị ugbu a na-akọwa omume na-akọwapụta ụdị onye ahụ; ‘onye na-agọnahụ’ na-egosi nke a n’Igbo nkịtị.
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: na Jizọs bụ Mesaịa ahụ
  rationale: N’usoro a, ihe a na-agọnahụ bụ nkwupụta ‘Jizọs bụ Mesaịa ahụ.’ Ịsị ‘na Jizọs abụghị Mesaịa’ n’Igbo nwere ike ime ka ọ bụrụ na onye ahụ na-agọnahụ nkwupụta na-adịghị mma, nke ga-agbanwe ihe Grik pụtara.
- source_word: ὁ χριστός
  choice: Mesaịa ahụ
  rationale: Χριστός na-arụ ọrụ dị ka utu aha ebe a; ‘Mesaịa’ na-ebupụta ihe utu aha ahụ pụtara ma chekwaa mgbọrọgwụ ndị Juu nke nkwupụta ahụ.
- source_word: ὁ ἀντίχριστος
  choice: onye ahụ na-emegide Kraịst
  rationale: Nke a bụ okwu a maara nke ọma n’Igbo maka ἀντίχριστος, ebe ‘onye ahụ’ na-egosipụta article Grik ma na-ahapụ ma ọ̀ bụ otu onye pụrụ iche ka ọ̀ bụ ụdị ndị mmegide ka akụkụ akwụkwọ ozi ahụ kọwaa.
- source_word: τὸν πατέρα καὶ τὸν υἱόν
  choice: Nna ahụ na Ọkpara ahụ
  rationale: Aha ndị a na-ekwu kpọmkwem banyere Chineke Nna na Ọkpara n’ mmekọrịta ha; mkpụrụedemede ukwu na-egosi na ha bụ utu aha ndị a kapịrị ọnụ.
- source_word: οὗτός ἐστιν
  choice: Onye dị otu a bụ
  rationale: Nke a na-atụ aka azụ n’onye a ka kọwara ma na-eme ka njirimara ahụ doo anya n’Igbo eke.
theological_decisions:
- issue: Nsụgharị Χριστός n’okwu nkwupụta banyere Jizọs
  choice: Mesaịa
  alternative: Kraịst
  rationale: Ebe a okwu ahụ bụ utu aha a na-ekwu na ọ bụ nke Jizọs; ‘Mesaịa’ na-asụgharị ihe utu aha ahụ pụtara kama ime ka ọ dị naanị ka aha mmadụ.
- issue: Ihe ὁ ἀντίχριστος na-ezo aka na ya
  choice: onye ahụ na-emegide Kraịst
  alternative: onye na-emegide Kraịst
  rationale: ‘Onye ahụ’ na-edebe article Grik, ma nsụgharị ahụ anaghị ekpebi n’ike na okwu ahụ ga-abụ naanị otu onye nke oge ikpeazụ; n’akwụkwọ ozi Jọn, ọ pụkwara ịkọwa ụdị onye mmegide.
- issue: Ọnọdụ nkwupụta na-adịghị mma n’okwu ἀρνούμενος ὅτι
  choice: onye na-agọnahụ na Jizọs bụ Mesaịa ahụ
  alternative: onye na-ekwu na Jizọs abụghị Mesaịa ahụ
  rationale: Nhọrọ e bipụtara na-edebe isi ihe Grik—ịjụ nkwupụta na Jizọs bụ Mesaịa—ma zere mgbagwoju anya nke ịgọnahụ okwu nwere ‘abụghị’ n’Igbo.
translation_notes:
  register: E ji Igbo izugbe nke oge a, dị nsọ ma doo ndị nkịtị anya. A họọrọ “na-agọnahụ” maka omume na-akọwapụta onye ahụ, “Mesaịa” maka utu aha Χριστός, na “Nna ahụ na Ọkpara ahụ” iji chekwaa mmekọrịta nkà mmụta okpukpe dị n’amaokwu ahụ n’enweghị itinye nkọwa otu ụka.
