id: 1JN.2.18
reference: 1 John 2:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: ig
  text: Ụmụntakịrị, ọ bụ awa ikpeazụ; dị ka unu nụrụ na onye na-emegide Kraịst[a] na-abịa, ọbụna ugbu a, ọtụtụ ndị na-emegide Kraịst apụtala[b]. Nke a mere anyị ji mara na ọ bụ awa ikpeazụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye ahụ na-emegide Kraịst,” ma ọ bụ jiri aha “Antikraịst.” Okwu Grik ahụ enweghị mkpụrụokwu nkọwa, ebe Igbo enweghịkwa mkpụrụokwu dị otú ahụ kwekọrọ kpọmkwem; n’agbanyeghị nke ahụ, ihe a nụrụ na mbụ nwere ike ịpụta onye a ma ama nke a tụrụ anya ya.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ebiliela” ma ọ bụ “abịala.” Ụdị perfect nke ngwaa Grik na-emesi ike na ha apụtala, ha nọkwa ugbu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδία
  choice: Ụmụntakịrị
  rationale: Ọ bụ okwu onye na-elekọta ndị kwere ekwe ji ịhụnanya na-akpọ ha. “Ụmụntakịrị” na-echekwa ọdịdị ezinụlọ nke okwu ahụ n’Igbo, n’etinyeghị “m” nke na-adịghị n’ahịrị Grik.
- source_word: ἐσχάτη ὥρα
  choice: awa ikpeazụ
  rationale: Nsụgharị a na-echekwa ihe atụ nke “awa” na echiche banyere oge ikpeazụ, na-akọwaghị ya dị ka awa nkeji iri isii kpọmkwem ma ọ bụ dị ka usoro nkwenkwe banyere ọgwụgwụ ụwa.
- source_word: καθὼς
  choice: Dị nnọọ ka
  rationale: Nke a na-egosipụta nke ọma na ihe na-eme ugbu a kwekọrọ n’ihe ndị na-agụ akwụkwọ ozi ahụ nụrụ na mbụ.
- source_word: ἠκούσατε
  choice: unu nụrụ
  rationale: Oge ngwaa gara aga na-ezo aka n’ozizi ha natara na mbụ; “unu nụrụ” bụ Igbo doro anya ma kwekọọ na aorist ahụ.
- source_word: ἀντίχριστος
  choice: onye na-emegide Kraịst
  rationale: Okwu a na-enye onye Igbo nkịtị nghọta ozugbo ma na-echekwa njikọ ya na Kraịst. E jighị okwu na-eme ka o doo anya karịa Grik ma ọ bụ na ọ bụ naanị otu onye a kọwapụtara nke ọma.
- source_word: ἔρχεται
  choice: na-abịa
  rationale: Nke a na-egosipụta ihe a tụrụ anya na ọ ga-abịa, dị ka present tense nke nwere ntụziaka n’ọdịnihu si dị.
- source_word: καὶ νῦν
  choice: ọbụna ugbu a
  rationale: Ọ na-eme ka ọdịiche dị n’etiti onye a nụrụ na ọ na-abịa na ọtụtụ ndị dị ugbu a pụta ìhè.
- source_word: ἀντίχριστοι πολλοὶ
  choice: ọtụtụ ndị na-emegide Kraịst
  rationale: A na-emegharị otu okwu ahụ n’ụdị ọtụtụ, ka njikọ dị n’etiti otu onye na ọtụtụ ndị ghara ịla n’iyi.
- source_word: γεγόνασιν
  choice: ebiliela
  rationale: Ụdị perfect a na-egosi na ha apụtala ma ka nọkwa ugbu a. “Ebiliela” na-egosipụta mpụta ha n’ihu ọha na nsonaazụ ya ka dị.
- source_word: ὅθεν
  choice: Ọ bụ site na nke a
  rationale: Ọ na-ejikọta ihe a maara na ihe akaebe e kwuru ozugbo tupu ya, kama ịsụgharị ya naanị dị ka nkwubi okwu na-enweghị njikọ ahụ.
- source_word: γινώσκομεν
  choice: anyị ji mara
  rationale: Ọ bụ ụzọ Igbo sitere n’okike isi kwuo na ihe e kwuru bụ ihe ndabere nke ihe ha maara.
theological_decisions:
- issue: Ihe “awa ikpeazụ” pụtara
  choice: E debere “awa ikpeazụ” dị ka okwu banyere oge ikpeazụ nke nwere mkpa gbasara ọgwụgwụ, n’akọwaghị ya dị ka awa nkịtị kpọmkwem.
  alternative: Ịsụgharị ya dị ka oge dị mkpirikpi nke ọgwụgwụ ga-erute ozugbo, ma ọ bụ dị ka naanị okwu e ji akpọ oge nsogbu.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-enye okwu ahụ mkpa gbasara ọgwụgwụ, ma nsụgharị ekwesịghị ikpebi ogologo oge ahụ ma ọ bụ tinye usoro nkọwa banyere ọgwụgwụ ụwa n’ime ederede.
- issue: Njikọ dị n’etiti otu “onye na-emegide Kraịst” na “ọtụtụ ndị na-emegide Kraịst”
  choice: E debere ma otu onye a na-atụ anya ya ma ọtụtụ ndị bilitere ugbu a, na-ejikọghị ha n’otu nkọwa e kpebiri tupu oge eruo.
  alternative: Ịkọwa otu onye ahụ naanị dị ka ụdị ndị mmadụ, ma ọ bụ ime ka o doo anya na ọ bụ otu onye pụrụ iche a kọwapụtara n’ụzọ zuru ezu.
  rationale: Ederede ahụ n’onwe ya na-etinye otu onye na ọtụtụ ndị n’akụkụ ibe ha. Nsụgharị ahụ na-echekwa esemokwu echiche a n’enweghị itinye ozizi otu òtù.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ndị ahụ dị mkpirikpi iji mee ka nkwughachi “awa ikpeazụ” na ọdịiche dị n’etiti otu onye na ọtụtụ ndị pụta ìhè. E zere okwu otu ụka pụrụ iche na nkọwa na-ekpebi usoro ọgwụgwụ ụwa.
