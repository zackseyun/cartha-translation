  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: ig
  text: Ma unu nwere otite mmanụ sitere n’aka Onye Nsọ[a], unu niile maara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka ọgụgụ ederede ọzọ si dị, “unu maara ihe niile.” Ihe SBLGNT dere na-akwado “unu niile maara.”
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Ma
  rationale: N'ebe a, καί na-egosi ọdịiche dị n'etiti ndị a na-agwa okwu na ndị na-emegide Kraịst e kwuru okwu ha n'amaokwu gara aga; “Ma” na-egosipụta ọdịiche ahụ n'Igbo dị ugbu a.
- source_word: ὑμεῖς
  choice: unu
  rationale: Nnọchiaha a pụtara ìhè na Grik ma na-emesi ndị a na-agwa okwu ike. “Unu” dabara n'ọnụọgụ ọtụtụ ma okwu “Ma” na ọnọdụ ya na-egosikwa nkwusi ike ahụ.
- source_word: χρῖσμα
  choice: otite mmanụ
  rationale: Nhọrọ a na-edobe ihe atụ nke ite mmanụ dị n'okwu Grik kama ịkọwa ya ozugbo dị ka Mmụọ Nsọ ma ọ bụ ọrụ ya.
- source_word: ἔχετε
  choice: nwere
  rationale: “Nwere” bụ ụzọ Igbo nkịtị na nke ziri ezi isi kwuo na ihe ahụ dị ha n'aka ugbu a.
- source_word: ἀπὸ τοῦ ἁγίου
  choice: sitere n’aka Onye Nsọ
  rationale: Nke a na-edobe aha nsọpụrụ ahụ n'ozuzu ya, n'ekwughị kpọmkwem ma ọ bụ Nna ka ọ bụ Ọkpara.
- source_word: καὶ
  choice: —
  rationale: Njikọ nke abụọ dị na Grik na-ejikọta ahịrịokwu abụọ ahụ. N'Igbo, rikoma na usoro ahịrịokwu ahụ na-eme njikọ a n'ụzọ eke, na-enweghị mkpa itinye “na” ọzọ.
- source_word: οἴδατε
  choice: makwaara
  rationale: “Ịma” bụ nkọwa kwụ ọtọ nke οἶδα; “-kwa-” na-egosipụta njikọ ya na eziokwu e kwuru na mbụ.
- source_word: πάντες
  choice: unu niile
  rationale: πάντες bụ ụdị na-ezo aka n'ọrụ ahịrịokwu, ya mere ọ pụtara na ha niile maara, ọ bụghị na ha maara ihe niile.
theological_decisions:
- issue: Onye okwu ahụ bụ “Onye Nsọ” na-ezo aka na ya
  choice: E debere ya dịka “Onye Nsọ,” n'ekwughị ma ọ bụ Nna ka ọ bụ Ọkpara.
  alternative: “Chineke Nsọ” ma ọ bụ “Jizọs Kraịst, Onye Nsọ”
  rationale: Okwu Grik akọwaghị onye ọ bụ kpọmkwem, ọnọdụ akwụkwọ Jọn nwekwara ike ikwe ka aha ahụ zoo aka na Nna ma ọ bụ Ọkpara. Nsụgharị ahụ ekwesịghị idozi ihe ederede hapụrụ ghe oghe.
- issue: Ihe χρῖσμα pụtara n'ọnọdụ a
  choice: E sụgharịrị ya “otite mmanụ,” ka ihe atụ ahụ dịgide.
  alternative: “Mmụọ Nsọ,” “otite nke Mmụọ Nsọ,” ma ọ bụ “onyinye otite”
  rationale: Ọ bụ ezie na a pụrụ ịghọta ya dịka Mmụọ Nsọ ma ọ bụ ọrụ Mmụọ Nsọ, ederede ahụ ji okwu na-egosi otite mmanụ. Ịhapụ ihe atụ ahụ na-echekwa nghọta na esemokwu nkà mmụta okpukpe dị na isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Otite mmanụ” na-echekwa ihe atụ nke asụsụ mbụ; “Onye Nsọ” na-echekwa aha nsọpụrụ ahụ na-enweghị ịkọwa onye ọ bụ karịa ka ederede siri mee.
