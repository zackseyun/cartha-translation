- from: Ma unu nwere otite mmanụ sitere n’aka Onye Nsọ[a], unu niile makwaara.
  to: Ma unu nwere otite mmanụ sitere n’aka Onye Nsọ[a], unu niile maara.
  rationale: This revision changes only the Igbo verbal form in the main text and textual note so that the translation expresses the present sense of οἴδατε. It retains the source ambiguity concerning the Holy One and the metaphorical term for anointing, while preserving the SBLGNT distinction between “all of you know” and the variant “you know all things.”
