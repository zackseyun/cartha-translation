id: 1JN.2.16
reference: 1 John 2:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: ig
  text: N’ihi na ihe niile dị n’ụwa—ọchịchọ nke anụ ahụ[a][b], ọchịchọ nke anya, na mpako nke ndụ[c]—esiteghị na Nna, kama ọ sitere n’ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “agụụ nke anụ ahụ.” Okwu Grik ahụ nwere ike ịpụta ọchịchọ siri ike, agụụ, ma ọ bụ ọchịchọ ọjọọ; e ji “ọchịchọ” mee ihe ebe a ka a ghara ime ka ọ bụrụ naanị agụụ mmekọahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ọchịchọ nke ọdịdị mmehie.” N’ọnọdụ ụfọdụ, okwu Grik a sụgharịrị “anụ ahụ” nwere ike ịbụ ihe atụ na-ezo aka n’ọdịdị mmadụ nke mmehie merụrụ.
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsị, “nganga nke ndụ” ma ọ bụ “ịnya isi n’ụzọ ụwa si ebi ndụ.” Okwu ahụ nwere ike ịgụnye mpako mmadụ n’ọnọdụ ya, n’ihe o nwere, ma ọ bụ n’ụzọ o si ebi ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-egosi ihe mere e ji nye iwu dị n’amaokwu bu ụzọ; ọ na-echekwa njikọ nke ihe kpatara ihe.
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: ihe niile dị n’ụwa
  rationale: Ọ na-ewere okwu Grik ahụ dịka mkpokọta ma na-enye ya n’Igbo doro anya ma dịkwa nkenke.
- source_word: κόσμῳ / κόσμου
  choice: ụwa
  rationale: ‘Ụwa’ na-echekwa obosara na esemokwu dị n’okwu κόσμος, kama ịgbakwunye nkọwa dịka ‘usoro ụwa dara ada.’
- source_word: ἐπιθυμία
  choice: ọchịchọ
  rationale: Okwu a nwere ike ịpụta ọchịchọ siri ike, agụụ, ma ọ bụ anyaukwu; ‘ọchịchọ’ anaghị emechi ihe ọ pụtara n’ọchịchọ mmekọahụ naanị.
- source_word: τῆς σαρκὸς
  choice: nke anụ ahụ
  rationale: Ọ na-echekwa ihe atụ nke σάρξ na-enweghị ịkọwa ya ozugbo dịka otu ozizi pụrụ iche banyere ọdịdị mmadụ.
- source_word: τῶν ὀφθαλμῶν
  choice: nke anya
  rationale: Nke a bụ ntụgharị genitive ahụ n’ụzọ kwụ ọtọ ma na-echekwa ọtụtụ nke okwu Grik.
- source_word: ἀλαζονεία
  choice: mpako
  rationale: ‘Mpako’ na-egosi nganga, ịnya isi, na ime ka mmadụ dị ka onye ka ihe ọ bụ.
- source_word: τοῦ βίου
  choice: nke ndụ
  rationale: Ọ na-ahapụ βίος ka ọ gụnye ụzọ mmadụ si ebi, ọnọdụ ya, na ihe o ji ebi ndụ, n’emeghị ka naanị otu n’ime ha bụrụ ihe okwu ahụ pụtara.
- source_word: οὐκ ἔστιν ἐκ τοῦ πατρός
  choice: esiteghị na Nna
  rationale: Ọ na-egosi isi mmalite ma na-echekwa aha mmekọrịta Chineke dịka Nna.
- source_word: ἀλλὰ ἐκ τοῦ κόσμου ἐστίν
  choice: kama ha sitere n’ụwa
  rationale: Ọ na-echekwa ntụnyere doro anya n’etiti Nna na ụwa dịka isi mmalite.
theological_decisions:
- issue: Ihe σάρξ pụtara n’usoro ihe ọjọọ a
  choice: anụ ahụ
  alternative: ọdịdị mmehie
  rationale: ‘Anụ ahụ’ na-anọ nso n’okwu Grik ma na-echekwa mgbagwoju anya nke ihe atụ ahụ; e tinyere ntụgharị nkọwa karịa n’ala peeji.
- issue: Ihe κόσμος pụtara
  choice: ụwa
  alternative: usoro ụwa nke na-emegide Chineke
  rationale: Amaokwu ahụ na-eme ka ihe si na Nna dị iche n’ihe si n’ụwa. Ịsị naanị ‘ụwa’ na-ahapụ ọnọdụ gbara okwu ahụ gburugburu ka ọ kọwaa mmetụta ime mmụọ ya.
- issue: Obosara nke ἀλαζονεία τοῦ βίου
  choice: mpako nke ndụ
  alternative: ịnya isi n’ọnọdụ mmadụ, n’ihe o nwere, ma ọ bụ n’ụzọ o si ebi ndụ
  rationale: Isiokwu ahụ nwere ike ịgụnye nganga banyere ọnọdụ, ihe onwunwe, ma ọ bụ ụzọ e si ebi ndụ; ntụgharị isi anaghị akpọchi ya n’otu ihe naanị.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro ihe atọ dị na Grik na ntụnyere dị n’etiti ‘Nna’ na ‘ụwa.’ E ji ‘ha’ mee ihe n’ahịrịokwu ikpeazụ n’ihi na ‘ihe niile’ na usoro ihe atọ ahụ na-arụ ọrụ dịka ọtụtụ n’Igbo nkịtị.
