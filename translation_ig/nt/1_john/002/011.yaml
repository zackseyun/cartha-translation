  naturalness: The Standard Igbo is clear, dignified, and natural. A small adjustment from 'na-ejekwa ije' to 'na-eje ije' avoids the potentially additive/emphatic force of -kwa ('also/too') where Greek καί is simply connective, while retaining John's walking image.
  terminology: ‘Ọchịchịrị’ properly retains the Johannine metaphor without interpretive expansion. ‘Nwanne’ is appropriate in the text as a representative relational term; the note appropriately explains the masculine Greek form and likely community referent.
