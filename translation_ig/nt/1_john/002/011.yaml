id: 1JN.2.11
reference: 1 John 2:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: ig
  text: Ma onye kpọrọ nwanne ya[a] asị nọ n’ọchịchịrị ma na-eje ije n’ọchịchịrị. Ọ maghị ebe ọ na-aga, n’ihi na ọchịchịrị emewo ka anya ya kpuo ìsì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ebe a, “nwanne” nwere ike ịpụta nwanna nwoke ma ọ bụ nwanna nwanyị; okwu Grik kwuru “nwanna nwoke,” ma o yikarịrị ka ọ na-arụtụ aka n’onye otu okwukwe n’etiti ọgbakọ Ndị Kraịst.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: onye kpọrọ ... asị
  rationale: Nkebi okwu Igbo a na-egosipụta onye àgwà ya bụ ịkpọ nwanne ya asị, kwekọrọ na participle nke e ji dịka aha.
- source_word: ἀδελφὸν
  choice: nwanne
  rationale: “Nwanne” bụ okwu Igbo ebumpụta ụwa nke nwere ike ịpụta nwoke ma ọ bụ nwanyị si n’otu nne/nna, ma n’ebe a ọ na-arụtụ aka n’onye otu okwukwe.
- source_word: ἐν τῇ σκοτίᾳ
  choice: n’ọchịchịrị
  rationale: E debere ihe atụ Jọn ji maka ọnọdụ omume na nke mmụọ, tinyere nkwughachi ya ugboro abụọ.
- source_word: περιπατεῖ
  choice: na-ejekwa ije
  rationale: Nke a na-echekwa ihe atụ nke ije dịka ụzọ mmadụ si ebi ndụ, kama ịkọwa ya naanị dịka “ibi ndụ.”
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: Ọ maghị ebe ọ na-aga
  rationale: Nke a bụ Igbo doro anya ma dị ugbu a nke na-echekwa echiche mmegharị dị na Grik.
- source_word: ἐτύφλωσεν
  choice: emewo ka ... kpuo ìsì
  rationale: Ụdị a na-egosi omume ọchịchịrị mere nke nsonaazụ ya ka dị ugbu a.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: anya ya
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosipụta akụkụ ahụ nwere onye nwe ya, ma na-echekwa onyonyo anya dị n’isi mmalite.
theological_decisions:
- issue: Ọchịchịrị dịka ihe atụ omume na mmụọ n’akwụkwọ Jọn
  choice: ọchịchịrị
  alternative: ihe ọjọọ; ọchịchịrị nke mmehie
  rationale: Ịhapụ “ọchịchịrị” dịka ihe atụ na-echekwa omimi na esemokwu ya na ìhè, n’etinyeghị nkọwa ozizi dị warara n’ime ederede.
- issue: Onye “nwanne” na-arụtụ aka na ya
  choice: nwanne
  alternative: nwanna nwoke; onye otu okwukwe
  rationale: Okwu Igbo “nwanne” dabara nke ọma dịka okwu mmekọrịta ma nwee ike ịgụnye nwoke ma ọ bụ nwanyị; ihe odide a yikarịrị ka ọ na-ekwu maka onye ọzọ nọ n’obodo ndị kwere ekwe.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “na-ejekwa ije” chekwaa ihe atụ ije nke Jọn, ebe “kpọrọ ... asị” na-enye okwu Igbo ebumpụta ụwa maka μισῶν. Akara ụda dị mkpa dị na “ọchịchịrị” na “ìsì.”
