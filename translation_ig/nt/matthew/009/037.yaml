id: MAT.9.37
reference: Matthew 9:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: ig
  text: Mgbe ahụ, ọ na-agwa ndị na-eso ụzọ ya, “Owuwe ihe ubi bara ụba n’ezie, ma ndị ọrụ dị ole na ole.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe sochiri n’usoro akụkọ, ma bụrụkwa ụzọ Igbo doro anya si kwuo ‘then.’
- source_word: λέγει
  choice: ọ na-agwa
  rationale: E ji oge ugbu a mee ka akụkọ dị ndụ n’asụsụ Grik; ụdị ‘ọ na-agwa’ na-echekwa mmetụta ahụ n’Igbo.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a na-echekwa αὐτοῦ (‘ya’) ma jiri okwu Igbo a na-aghọta nke ọma kọwaa μαθηταί.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: n’ezie ... ma
  rationale: Ọ na-egosipụta ọdịiche μέν...δέ n’ụzọ dị mma ma bụrụkwa Igbo eke.
- source_word: θερισμός
  choice: owuwe ihe ubi
  rationale: Ọ na-echekwa ihe atụ ọrụ ugbo dị n’amaokwu ahụ n’enweghị ịkọwa ihe ọ pụtara karịa ihe ederede kwuru.
- source_word: πολύς
  choice: bara ụba
  rationale: N’ọnọdụ owuwe ihe ubi, okwu a na-egosi ịdị ukwuu ma ọ bụ ịba ụba n’ụzọ doro anya.
- source_word: ἐργάται
  choice: ndị ọrụ
  rationale: Ọ bụ okwu Igbo dị ugbu a, dị mfe nghọta, nke na-akọwa ndị na-arụ ọrụ owuwe ihe ubi.
- source_word: ὀλίγοι
  choice: dị ole na ole
  rationale: Ọ na-enye ọdịiche kpọmkwem megide owuwe ihe ubi bara ụba, n’etinyeghị echiche ‘dị oke ntakịrị’ nke Grik ekwughị kpọmkwem.
theological_decisions:
- issue: Ike ihe atụ nke owuwe ihe ubi
  choice: Idobe ihe atụ ọrụ ugbo ahụ n’enweghị ịkọwa kpọmkwem ihe owuwe ihe ubi ahụ nọchiri anya ya.
  alternative: Ịkọwagharị ya ka o kwuo na owuwe ihe ubi bụ ndị mmadụ dị njikere ịnata ozi ma ọ bụ ije ozi Jizọs.
  rationale: Amaokwu ahụ n’onwe ya na-ekwu naanị ihe atụ ahụ; ịkọwa onye ma ọ bụ ihe ọ nọchiri anya ya n’ahịrị bụ itinye nkọwa karịrị ihe isi mmalite kwuru.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere historical present nke Grik dịka ‘ọ na-agwa,’ ma zere okwu ochie ma ọ bụ nkọwa okpukpe agbakwunyere.
