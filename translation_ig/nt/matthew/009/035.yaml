revisions:
- from: Jizọs na-agagharị n’obodo ukwu niile na n’obodo nta niile, na-ezi ihe n’ụlọ nzukọ ha, na-ekwusa ozi ọma nke alaeze ahụ[a], na-agwọkwa ọrịa ọ bụla na adịghị ike ọ bụla[b].
  to: Jizọs na-agagharị n’obodo ukwu niile na n’obodo nta niile, na-ezi ihe n’ụlọ nzukọ ndị Juu ha, na-ekwusa ozi ọma nke alaeze ahụ[a], na-agwọkwa ọrịa ọ bụla na adịghị ike ọ bụla[b].
  rationale: The sole revision makes the historically and lexically specific sense of συναγωγαῖς explicit in Standard Igbo. It does not alter the meaning or impose a theological interpretation; “ha” continues to represent the Greek pronoun αὐτῶν. The footnote anchors remain attached to the relevant phrases and the alternatives preserve the intended lexical range.
