id: MAT.9.35
reference: Matthew 9:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: ig
  text: Jizọs na-agagharị n’obodo ukwu niile na n’obodo nta niile, na-ezi ihe n’ụlọ nzukọ ndị Juu ha, na-ekwusa ozi ọma nke alaeze ahụ[a], na-agwọkwa ọrịa ọ bụla na adịghị ike ọ bụla[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oziọma nke alaeze ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọrịa ọ bụla na nrịanrịa ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: na-agagharị
  rationale: Ụdị ngwaa imperfect na-egosi na Jizọs nọgidere na-agagharị site n’otu ebe ruo n’ebe ọzọ; “na-agagharị” na-egosipụta omume a na-aga n’ihu n’Igbo nkịtị.
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: n’obodo ukwu niile na n’obodo nta niile
  rationale: Nke a na-edobe ọdịiche dị n’etiti πόλεις, bụ́ obodo ndị buru ibu, na κῶμαι, bụ́ obodo nta, ma na-egosikwa oke okwu πάσας.
- source_word: διδάσκων
  choice: na-ezi ihe
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị egosipụta izi ndị mmadụ ihe; ọ na-edobekwa omume ahụ dị ka nke na-aga n’ihu.
- source_word: συναγωγαῖς αὐτῶν
  choice: n’ụlọ nzukọ ha
  rationale: “Ụlọ nzukọ” na-egosipụta ebe ndị Juu na-ezukọ n’akụkọ ihe mere eme, ebe “ha” na-edobe nnọchiaha αὐτῶν n’enweghị mgbasawanye na-adịghị na Greek.
- source_word: κηρύσσων
  choice: na-ekwusa
  rationale: “Na-ekwusa” na-edobe echiche nke onye na-akpọsa ozi n’ihu ọha nke dị na κηρύσσω, ma bụrụkwa okwu Igbo dị ugbu a ma dị ùgwù.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: ozi ọma nke alaeze ahụ
  rationale: “Ozi ọma” na-eme ka ihe εὐαγγέλιον pụtara doo onye na-agụ ya anya, ebe usoro “nke alaeze ahụ” na-edobe njikọ genitive ahụ n’enweghị ịkọwa ya karịa ihe Greek kwuru.
- source_word: θεραπεύων
  choice: na-agwọkwa
  rationale: “Ịgwọ” bụ okwu Igbo kwesịrị ekwesị maka ime ka ndị na-arịa ọrịa dịrị mma; “-kwa” na-ejikọta ọrụ a na izi ihe na ikwusa ozi.
- source_word: πᾶσαν νόσον
  choice: ọrịa ọ bụla
  rationale: “Ọrịa” na-anọchi νόσος n’ụzọ doro anya, ebe “ọ bụla” na-edobe ike nkesa nke πᾶσαν.
- source_word: πᾶσαν μαλακίαν
  choice: adịghị ike ọ bụla
  rationale: μαλακία pụrụ ịpụta adịghị ike, nrịanrịa, ma ọ bụ ọrịa; “adịghị ike” na-edobe ọdịiche ya na νόσος ma ghara imechi obosara ihe okwu Greek ahụ pụrụ ịpụta.
theological_decisions:
- issue: Nsụgharị εὐαγγέλιον
  choice: ozi ọma
  alternative: oziọma
  rationale: “Ozi ọma” na-egosipụta ihe okwu Greek ahụ pụtara ozugbo n’Igbo nke oge a, ebe “oziọma” bụ okwu ụka a maara nke ọma. Isiokwu a adịghị achọ ka e jiri naanị okwu omenala ụka.
- issue: Njikọ dị na τὸ εὐαγγέλιον τῆς βασιλείας
  choice: ozi ọma nke alaeze ahụ
  alternative: ozi ọma banyere alaeze ahụ
  rationale: “Nke” na-edobe obosara na mgbagwoju anya nke genitive Greek, kama ikpebi na ọ pụtara naanị na ozi ahụ bụ “banyere” alaeze ahụ.
- issue: Oke ọgwụgwọ dị na πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: ọrịa ọ bụla na adịghị ike ọ bụla
  alternative: ọrịa ọ bụla na nrịanrịa ọ bụla
  rationale: E dekwara πᾶσαν ugboro abụọ na Greek; ikwughachi “ọ bụla” na-egosipụta oke zuru ezu nke ahịrịokwu ahụ n’enweghị ibubata nkwupụta ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “obodo ukwu” na “obodo nta” iji mee ka ọdịiche ebe obibi abụọ ahụ pụta ìhè. E debere ahịrịokwu ahụ n’usoro omume atọ na-aga n’ihu—izi ihe, ikwusa, na ịgwọ—dị ka participle Greek atọ si hazie ya.
