id: MAT.9.29
reference: Matthew 9:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: ig
  text: Mgbe ahụ, o metụrụ anya ha aka, sị, “Dị ka okwukwe unu si dị[a], ka e meere unu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Dị ka ntụkwasị obi unu si dị, ka o meere unu.” Okwu Grik bụ pistis nwekwara ike ịpụta “ntụkwasị obi” ma ọ bụ, n’ọnọdụ ụfọdụ, “ikwesị ntụkwasị obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe mere na-esote n’usoro akụkọ; nke a bụ ụzọ Igbo nkịtị si ekwu ‘mgbe nke ahụ gasịrị/oge ahụ.’
- source_word: ἥψατο τῶν ὀφθαλμῶν αὐτῶν
  choice: o metụrụ anya ha aka
  rationale: ἅπτομαι na genitive ebe a pụtara imetụ ihe aka n’anụ ahụ. Usoro a bụ Igbo ebumpụta ụwa ma na-akọwapụta na ọ metụrụ anya ha.
- source_word: λέγων
  choice: sị
  rationale: Ọ na-egosi okwu o kwuru n’otu oge ahụ o metụrụ ha aka; ‘sị’ dị mkpirikpi ma bụrụkwa usoro akụkọ Igbo kwesịrị ekwesị.
- source_word: Κατὰ τὴν πίστιν ὑμῶν
  choice: Dị ka okwukwe unu si dị
  rationale: κατά na accusative na-egosi ihe kwekọrọ n’ókè ma ọ bụ n’ụdị ihe ọzọ. Nsụgharị a anaghị eme ka okwukwe bụrụ ihe kpatara ọgwụgwọ n’ụzọ siri ike karịa ihe Grik kwuru.
- source_word: γενηθήτω ὑμῖν
  choice: ka e meere unu
  rationale: γενηθήτω bụ aorist passive imperative nke na-arụ ọrụ dịka nkwupụta na-emezu ihe a na-ekwu. ‘Ka e meere unu’ na-echekwa ike iwu/ikwe ka ihe mee na uru dative ὑμῖν na-enye ha.
theological_decisions:
- issue: Nsụgharị πίστις n’okwu gbasara ọgwụgwọ
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka na ntụkwasị obi ndị ìsì ahụ nwere n’ike Jizọs ịgwọ ha. ‘Okwukwe’ bụ okwu Igbo a na-ejikarị asụgharị πίστις ma ọ ka na-ahapụ obosara ihe okwu Grik ahụ pụtara; e debere ‘ntụkwasị obi’ dịka nhọrọ n’okpuru peeji.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa ugwu. E debere usoro okwu ahụ ka nkwupụta Jizọs nwee ibu kwesịrị ekwesị, na-enweghị ịgbakwunye nkọwa ụka pụrụ iche.
