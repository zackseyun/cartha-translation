  text: καὶ ἐγερθεὶς ὁ Ἰησοῦς ⸀ἠκολούθει αὐτῷ καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/019.yaml
  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: ig
  text: Jizọs biliri soro ya, ndị na-eso ụzọ ya sokwa ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: biliri
  rationale: Nke a na-egosi na Jizọs si n'ọnọdụ ọ nọ bilie tupu o soro onye ahụ; ọ bụ okwu Igbo dị nkenke ma kwekọọ n'usoro akụkọ.
- source_word: ἠκολούθει
  choice: soro ya
  rationale: Ngwaa ahụ pụtara iso onye ahụ na-aga. N'Igbo, “soro ya” na-enye ihe omume ahụ n'ụzọ eke, n'agbanyeghị na imperfect Grik nwere ike igosi ihe na-aga n'ihu.
- source_word: αὐτῷ
  choice: ya
  rationale: Aha nnọchi a na-ezo aka n'onye ọchịchị ahụ a kpọrọ aha n'amaokwu gara aga; “soro ya” bụ usoro okwu Igbo kwesịrị ekwesị.
- source_word: μαθηταὶ
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa μαθηταί n'Oziọma, ma na-echekwa mmekọrịta onye nkuzi na ndị na-amụ ma na-eso ya.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya sokwa ya
  rationale: Grik ekwughachighị ngwaa ahụ, ma Igbo na-ada nke ọma ma a kwughachi ya. “-kwa” na-egosi na ndị na-eso ụzọ Jizọs sonyekwara n'iso nwoke ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo izugbe, dị mfe ma nwee ugwu. A họọrọ usoro okwu eke “biliri soro ya,” ma kwughachi ngwaa ahụ n'akụkụ nke abụọ iji zere mgbagwoju anya gbasara onye ndị na-eso ụzọ ahụ soro.
