id: MAT.9.10
reference: Matthew 9:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: ig
  text: O wee mee, mgbe Jizọs na-adina n’akụkụ tebụl n’ụlọ ahụ[a], lee[b], ọtụtụ ndị ọnaụtụ na ndị mmehie bịara soro Jizọs na ndị na-eso ụzọ ya dina n’akụkụ tebụl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a kwuru naanị “n’ụlọ ahụ”; ọ kọwaghị kpọmkwem onye nwe ụlọ ahụ.
    reason: ambiguity_preservation
  - marker: b
    text: “Lee” bụ okwu e ji adọta uche n’ihe na-esote n’akụkọ.
    reason: discourse_marker
lexical_decisions:
- source_word: ἐγένετο
  choice: O wee ruo na mgbe ...
  rationale: Nke a na-egosipụta καὶ ἐγένετο dị ka ụzọ e si aga n’ihu n’akụkọ ma na-ejikọkwa ya na ọnọdụ oge nke participle na-esochi ya, n’Igbo dị mfe ma dị ugwu.
- source_word: ἀνακειμένου
  choice: dina n'akụkụ tebụl na-eri nri
  rationale: N’ọnọdụ oriri, okwu a pụtara ịdina n’akụkụ tebụl dịka omenala oge ahụ si dị, ọ bụghị naanị ịnọdụ ala. Ịtinye ‘na-eri nri’ na-eme ka ihe a na-eme doo onye na-agụ Igbo anya.
- source_word: ἐν τῇ οἰκίᾳ
  choice: n'ụlọ ahụ
  rationale: Nke a na-edobe definite article nke Grik ma ghara ịkọwa onye nwe ụlọ ahụ, ebe amaokwu a n’onwe ya ekwughị ya.
- source_word: ἰδοὺ
  choice: lee
  rationale: ‘Lee’ bụ akara okwu Igbo doro anya nke na-adọta uche onye na-agụ n’ihe na-esote ma na-edobe ndụ akụkọ ahụ.
- source_word: τελῶναι
  choice: ndị ọnaụtụ
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị na-anakọta ụtụ, ma na-edobe aha ìgwè ahụ n’akụkọ Oziọma.
- source_word: ἁμαρτωλοὶ
  choice: ndị mmehie
  rationale: Adjective ahụ na-arụ ọrụ dịka aha ìgwè mmadụ; ‘ndị mmehie’ na-edobe ma ihe okwu ahụ pụtara ma otu e si akpọpụta ìgwè ahụ n’ọnọdụ a.
- source_word: ἐλθόντες
  choice: bịara
  rationale: Aorist participle a na-asụgharị nke ọma dịka ngwaa kwụụrụ onwe ya n’usoro akụkọ Igbo.
- source_word: συνανέκειντο
  choice: soro ... dina n'akụkụ tebụl na-eri nri
  rationale: Compound verb a na-egosi na ha so Jizọs na ndị na-eso ụzọ ya kee otu tebụl na otu oriri; nsụgharị a na-edobe ma ọnọdụ ahụ ma mkpakọrịta oriri ahụ.
- source_word: τῷ Ἰησοῦ
  choice: Jizọs
  rationale: ‘Jizọs’ bụ nsụgharị aha ahụ a kacha mara ma na-eji n’Igbo ọkọlọtọ.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ ụzọ Igbo e ji akọ μαθηταί nke ọma, na-egosi mmekọrịta nke ndị na-amụta ihe n’aka onye nkụzi ma na-eso ya.
theological_decisions:
- issue: Ọnọdụ ahụ mmadụ na-anọ mgbe a na-eri nri na ihe oyiyi nke mkpakọrịta n'otu tebụl
  choice: E debere ‘dina n'akụkụ tebụl na-eri nri’ n’ebe abụọ ahụ.
  alternative: ‘nọ na-eri nri’ ma ọ bụ ‘nọdụ na tebụl’
  rationale: Okwu Grik abụọ ahụ na-egosi omenala ịdina n’akụkụ tebụl mgbe a na-eri nri, tinyere echiche nke isoro ibe ha rie nri. Idebe ya na-eme ka akụkụ mmekọrịta ahụ pụta ìhè n’etinyeghị nkọwa ozizi ọzọ.
- issue: Onye nwe ụlọ ahụ
  choice: A sụgharịrị ya ‘n'ụlọ ahụ’ n’akọwaghị onye nwe ya.
  alternative: ‘n'ụlọ ya’ ma ọ bụ ‘n'ụlọ Matiu’
  rationale: Grik kwuru naanị ‘n’ụlọ ahụ.’ Ọ bụ ezie na gburugburu akụkọ nwere ike ime ka onye na-agụ chee banyere ụlọ Matiu, amaokwu a n’onwe ya akọwaghị onye nwe ya.
translation_notes:
  register: Ejiri Igbo ọkọlọtọ nke oge a, nke dị ugwu ma dị mfe nghọta. E debere usoro oriri nke ụwa oge ahụ n’amaokwu ahụ, ma kọwaa ya n’ala ala peeji ka okwu ahụ ghara ịdị mgbagwoju anya. A zere ịkpọ ụlọ ahụ ụlọ Jizọs ma ọ bụ ụlọ Matiu n’ihi na Grik amaokwu a ekwughị nke ahụ.
