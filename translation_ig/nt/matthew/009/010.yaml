revisions:
- from: O wee ruo na mgbe Jizọs dina n'akụkụ tebụl na-eri nri[a] n'ụlọ ahụ[b], lee[c], ọtụtụ ndị ọnaụtụ na ndị mmehie bịara soro Jizọs na ndị na-eso ụzọ ya dina n'akụkụ tebụl na-eri nri.
  to: O wee mee, mgbe Jizọs na-adina n’akụkụ tebụl n’ụlọ ahụ[a], lee[b], ọtụtụ ndị ọnaụtụ na ndị mmehie bịara soro Jizọs na ndị na-eso ụzọ ya dina n’akụkụ tebụl.
  rationale: 'A gbanwere naanị mmalite amaokwu ahụ ka ọ bụrụ Igbo ọkọlọtọ a na-asụ n’ụzọ nkịtị: “O wee mee, mgbe …” Nke a na-edobe ọrụ καὶ ἐγένετο dịka mgbanwe n’akụkọ, na-edobekwa ọnọdụ oge nke “mgbe Jizọs na-adina …” A hapụrụ “na-adina n’akụkụ tebụl” n’ebe abụọ ahụ ka ọdịiche nke ọnọdụ oriri n’oge ahụ na mkpakọrịta n’otu tebụl dịgide. Nkọwa ụkwụ nke na-akọwa ọnọdụ ịdina adịghị mkpa ebe nsụgharị ahụ n’onwe ya doro anya; a debere naanị nkọwa ndị jikọtara n’amaokwu ahụ banyere ụlọ ahụ na “lee.”'
