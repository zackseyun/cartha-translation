id: MAT.9.22
reference: Matthew 9:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: ig
  text: Ma Jizọs tụgharịrị, hụ ya, wee sị, “Obi sie gị ike[b], nwa m nwanyị; okwukwe[c] gị azọpụtala gị[a].” Ahụ́ nwanyị ahụ wee dị mma site n'oge ahụ gawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “okwukwe gị emeela ka ahụ́ dị gị mma,” ma ọ bụ “okwukwe gị agwọọla gị.” Ngwaa Grik a nwere ike ịpụta ịzọpụta, ịgwọ ọrịa, ma ọ bụ ime ka ahụ́ dị mma.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Nwee obi ike.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịtụgharị πίστις ebe a dịka “ntụkwasị obi.”
    reason: alternative_reading
lexical_decisions:
- source_word: στραφεὶς
  choice: tụgharịrị
  rationale: Okwu a na-egosi na Jizọs tụgharịrị onwe ya; ntụgharị a bụ nke doro anya n’Igbo ma ọ naghị agbakwụnye ụzọ o si tụgharịa.
- source_word: ἰδὼν
  choice: hụ ya
  rationale: 'A jikọtara omume abụọ ahụ n’usoro Igbo dị mfe: ọ tụgharịrị, hụ ya, wee kwuo okwu.'
- source_word: Θάρσει
  choice: Obi sie gị ike
  rationale: Nke a bụ ụzọ Igbo dị ndụ na nke a na-aghọta nke ọma isi gwa mmadụ ka o nwee obi ike.
- source_word: θύγατερ
  choice: nwa m nwanyị
  rationale: Ọ na-echekwa okwu ịhụnanya e ji kpọọ nwanyị ahụ dịka nwa nwanyị, n’agbanyeghị na m nke Igbo bụ ihe ụtọ asụsụ na-achọ n’ụdị okwu a.
- source_word: πίστις
  choice: okwukwe
  rationale: Okwukwe bụ okwu Igbo a na-ejikarị akọwa πίστις; n’ebe a ọ gụnyere ntụkwasị obi nwanyị ahụ nwere.
- source_word: σέσωκέν σε
  choice: azọpụtala gị
  rationale: Ụdị a na-echekwa obosara σῴζω, nke nwere ike ịpụta nzọpụta ma ọ bụ ime ka ahụ dị mma; oge mmecha nke Igbo na-egosikwa ihe rụzuru nke ka nwere mmetụta.
- source_word: ἐσώθη
  choice: ahụ́ wee dị ... mma
  rationale: N’okwu onye na-akọ akụkọ, ihe a na-ahụ anya bụ na ọrịa nwanyị ahụ kwụsịrị; ya mere, okwu a na-eme ka nsonaazụ ọgwụgwọ ahụ doo anya.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: site n'oge ahụ gawa
  rationale: Nke a bụ Igbo ebumpụta ụwa nke na-egosi na ọnọdụ ọhụrụ ahụ malitere ozugbo ma gaa n’ihu, ebe ‘site n’awa ahụ’ ga-ada ka ntụgharị okwu n’usoro okwu.
theological_decisions:
- issue: Nkọwa πίστις
  choice: okwukwe
  alternative: ntụkwasị obi
  rationale: ‘Okwukwe’ na-echekwa okwu nkà mmụta okpukpe sara mbara, ebe ‘ntụkwasị obi’ bụ ezi nkọwa nke ihe okwu ahụ pụtara n’ọnọdụ a ma debe ya n’ala ala peeji.
- issue: Nkọwa σῴζω n’okwu Jizọs na n’akụkọ onye dere ya
  choice: ‘azọpụtala gị’ n’okwu Jizọs, ma ‘ahụ́ wee dị ... mma’ na nsonaazụ akụkọ ahụ
  alternative: iji ‘agwọọla gị’ ma ọ bụ ‘emeela ka ahụ́ dị gị mma’ n’ebe abụọ ahụ
  rationale: Otu ngwaa Grik ahụ nwere ma echiche nzọpụta ma echiche ọgwụgwọ. Ịsị ‘azọpụtala gị’ n’okwu Jizọs na-echekwa obosara ahụ, ebe njedebe akụkọ na-eme ka ọgwụgwọ anụ ahụ pụta ìhè, n’enweghị ikpochapụ esemokwu dị n’etiti echiche abụọ ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ usoro ngwaa ‘tụgharịrị, hụ ya, wee sị’ ka njikọ omume ndị ahụ daa nke ọma n’Igbo. ‘Nwa m nwanyị’ na-echekwa ịdị nro na mmekọrịta dị n’okwu θύγατερ, ebe ‘site n'oge ahụ gawa’ na-enye echiche oge ahụ n’ụzọ Igbo ebumpụta ụwa.
