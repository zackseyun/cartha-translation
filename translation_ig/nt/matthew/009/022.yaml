  to: Ma Jizọs tụgharịrị, hụ ya, wee sị, “Obi sie gị ike[b], nwa m nwanyị; okwukwe[c] gị azọpụtala gị[a].” Ahụ́ nwanyị ahụ wee dị mma site n'oge ahụ gawa.
