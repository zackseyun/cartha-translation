id: MAT.9.1
reference: Matthew 9:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: ig
  text: Mgbe ọ banyere n’ụgbọ mmiri, ọ gafere mmiri wee bịarute n’obodo nke ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “obodo amụrụ ya.” Okwu Grik bụ “obodo nke ya”; ọ pụrụ izo aka n’obodo e jikọtara ya na ya n’akụkụ a nke akụkọ ahụ, ikekwe Kapanaum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: Mgbe ọ banyere
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa ndị bụ isi; “Mgbe ọ banyere” na-egosipụta usoro oge ahụ n’Igbo dị mfe ma bụrụkwa eke.
- source_word: πλοῖον
  choice: n’ụgbọ mmiri
  rationale: πλοῖον bụ aha izugbe maka ụgbọ e ji aga na mmiri; “ụgbọ mmiri” dabara n’ọnọdụ Oké Osimiri Galili karịa okwu ga-egosi nnukwu ship.
- source_word: διεπέρασεν
  choice: ọ gafere n’ofe mmiri
  rationale: διαπεράω pụtara isi n’otu akụkụ gafee ruo n’akụkụ nke ọzọ, karịchaa n’elu mmiri; mgbakwunye “n’ofe mmiri” na-eme ka echiche ntụziaka ahụ doo anya n’Igbo.
- source_word: ἦλθεν
  choice: wee bịarute
  rationale: N’ebe a ἔρχομαι na-akọ ọbịbịa n’ebe a na-aga; “bịarute” na-egosi iru ebe ahụ n'ụzọ doro anya, ebe “wee” jikọtara usoro omume ahụ.
- source_word: ἰδίαν πόλιν
  choice: n’obodo nke ya
  rationale: ἴδιος na-egosi ihe mmadụ nwere ma ọ bụ ebe e ji ya mara. “Obodo nke ya” na-edobe nkọwa ahụ n’ezoghị ọnụ, n’agbanyeghị na Igbo “obodo” nwere ike ịpụta city, town, ma ọ bụ ebe mmadụ si.
- source_word: Καὶ ... καὶ
  choice: Mgbe ... wee
  rationale: Kama idegharị καί abụọ ahụ n’ụzọ siri ike, usoro “Mgbe ... wee” na-ebufe njikọ na usoro akụkọ ahụ n’Igbo eke, ma na-edobe omume mbụ dịka nke mere tupu ndị ọzọ.
theological_decisions:
- issue: Ebe okwu “obodo nke ya” na-ezo aka
  choice: E debere ya dịka “obodo nke ya” n’akpọghị obodo ahụ aha n’ahịrị bụ isi.
  alternative: Ịkọwa ya dịka Kapanaum, ma ọ bụ dịka obodo ebe o bi n’oge ahụ.
  rationale: Grik akpọghị obodo ahụ aha. Ọ bụ ezie na usoro akụkọ Matiu na-atụ aka na Kapanaum, nsụgharị ekwesịghị itinye njirimara ahụ n’ahịrị bụ isi ma mechie ohere okwu mbụ hapụrụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “obodo nke ya” iji debe nkwupụta Grik n’enweghị ịkpọ Kapanaum aha n’ahịrị bụ isi; ndetu ala na-akọwa nghọta ọzọ nwere ike ịdị.
