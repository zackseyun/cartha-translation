    text: Ma ọ bụ, “obodo amụrụ ya.” Okwu Grik bụ “obodo nke ya”; ọ pụrụ izo aka n’obodo e jikọtara ya na ya n’akụkụ a nke akụkọ ahụ, ikekwe Kapanaum.
    reason: lexical_alternative
  revision_rationale: The revision retains the source sequence and ambiguity while using more idiomatic Standard Igbo for crossing the water. The footnote no longer equates “his own city” with a definite current residence; it offers a possible hometown sense and explains the Greek’s broader wording.
