id: MAT.9.31
reference: Matthew 9:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: ig
  text: Ma mgbe ha pụtachara, ha kesara akụkọ banyere ya n’ógbè ahụ dum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ala ahụ dum.” Okwu Grik bụ γῆ nwere ike ịpụta “ala,” “ógbè,” ma ọ bụ “ebe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị megide iwu Jizọs nyere ha n’amaokwu bu ụzọ ka ha ghara ịkọrọ onye ọ bụla.
- source_word: ἐξελθόντες
  choice: mgbe ha pụrụ
  rationale: Ọ na-egosi na ọpụpụ ha mere tupu omume bụ isi, ma bụrụkwa okwu Igbo na-aga were were.
- source_word: διεφήμισαν
  choice: ha gbasara akụkọ
  rationale: Ngwaa ahụ pụtara ime ka akụkọ gbasaa ebe niile; okwu a na-egosipụta mgbasa ozi ahụ n’Igbo nke oge a.
- source_word: αὐτὸν
  choice: banyere ya
  rationale: N’usoro okwu Igbo, ‘akụkọ banyere ya’ na-egosi nke ọma na ọ bụ akụkọ banyere Jizọs ka ha gbasara.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: n’ógbè ahụ dum
  rationale: ‘Ógbè’ dabara n’ọnọdụ a nke na-ekwu maka ebe dị gburugburu, ebe ‘dum’ na-echekwa echiche nke ὅλῃ.
theological_decisions:
- issue: Ókè ala nke γῆ na-egosi
  choice: ógbè
  alternative: ala
  rationale: Ihe gbara amaokwu a gburugburu na-ekwu maka mgbasa akụkọ n’ebe ahụ, ọ bụghị n’ụwa niile ma ọ bụ n’ala otu mba dum; ‘ógbè’ na-echekwa nghọta ahụ n’enweghị ikwubiga ókè.
translation_notes:
  register: Asụsụ Igbo Izugbe nke dị ugwu ma doo ndị na-agụ akwụkwọ n’oge a anya. E ji ‘pụrụ’ mee ihe maka ịpụ, e jikwa ‘gbasara akụkọ banyere ya’ mee ka ihe διεφήμισαν αὐτόν pụtara doo anya n’ụzọ e si ekwu Igbo.
