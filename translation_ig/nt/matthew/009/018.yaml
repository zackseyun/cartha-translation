review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the ruler’s unspecified status, his act of bowing, the daughter’s recent death, and the confident request that Jesus lay his hand upon her. A small adjustment is needed to render ἄρτι (‘just now/recently’) more precisely than ugbu a (‘now’).
  naturalness: The sentence is generally clear Standard Igbo. ‘Nwa m nwanyị’ is the more natural, unambiguous expression for ‘my daughter’; ‘ka nwụrụ anwụ’ naturally conveys that she has just died. Adding the locative complement after ‘bikwasị ... aka gị’ makes the physical action explicit and idiomatic.
  terminology: ‘Onye isi’ appropriately retains the broad sense of ἄρχων. ‘Kpọọ isiala n’ihu ya’ preserves the noncommittal reverential sense of προσεκύνει without imposing ‘worship.’
  issues:
  - severity: medium
    issue: ‘anwụọla ugbu a’ renders ἄρτι imprecisely.
    rationale: Ἄρτι modifies the death as having occurred just now or very recently; ugbu a ordinarily means ‘now’ and can suggest a present event rather than a recent completed one.
  - severity: low
    issue: ‘Nwa m nwaanyị’ is less idiomatic than ‘Nwa m nwanyị.’
    rationale: ‘Nwa m nwanyị’ is the standard natural Igbo expression for ‘my daughter.’
  - severity: low
    issue: The hand-laying phrase benefits from an explicit locative complement.
    rationale: ‘Bikwasị ya aka gị n’ahụ ya’ clearly expresses laying one’s hand upon her, matching ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν.
  revised_text: Mgbe ọ ka na-agwa ha ihe ndị a, lee, otu onye isi bịara kpọọ isiala n’ihu ya, sị, “Nwa m nwanyị ka nwụrụ anwụ. Ma bịa bikwasị ya aka gị n’ahụ ya, ọ ga-adị ndụ.”
  revised_footnotes: []
