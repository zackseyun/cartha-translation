revisions:
- from: Mgbe ọ ka na-agwa ha ihe ndị a, lee, otu onye isi bịara kpọọ isiala n’ihu ya, sị, “Nwa m nwaanyị anwụọla ugbu a. Ma bịa bikwasị ya aka gị, ọ ga-adịkwa ndụ.”
  to: Mgbe ọ ka na-agwa ha ihe ndị a, lee, otu onye isi bịara kpọọ isiala n’ihu ya, sị, “Nwa m nwanyị ka nwụrụ anwụ. Ma bịa bikwasị ya aka gị n’ahụ ya, ọ ga-adị ndụ.”
  rationale: The revision preserves the source’s narrative emphasis, the ruler’s unspecified office, and the ambiguity of his bowing. It improves the temporal sense of ἄρτι, uses idiomatic Standard Igbo for ‘daughter,’ and makes the laying-on-of-hand construction explicit without adding theological interpretation.
