id: MAT.9.18
reference: Matthew 9:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: ig
  text: Mgbe ọ ka na-agwa ha ihe ndị a, lee, otu onye isi bịara kpọọ isiala n’ihu ya, sị, “Nwa m nwanyị ka nwụrụ anwụ. Ma bịa bikwasị ya aka gị n’ahụ ya, ọ ga-adị ndụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: lee
  rationale: Ọ na-adọta uche onye na-agụ n’ihe mberede na-abịa n’akụkọ ahụ, dị ka okwu Grik si eme.
- source_word: ἄρχων
  choice: otu onye isi
  rationale: Okwu Grik a anaghị akọwa kpọmkwem ụdị ọkwá onye ahụ n’amaokwu a; ‘onye isi’ na-echekwa obosara ya.
- source_word: προσεκύνει
  choice: kpọọ isiala n’ihu ya
  rationale: Nke a na-egosi omume ịkpọ isiala ma ghara ikpebi n’onwe ya ma ọ bụ ofufe Chineke ma ọ bụ nkwanye ùgwù miri emi.
- source_word: ἄρτι ἐτελεύτησεν
  choice: anwụọla ugbu a
  rationale: Ọ na-egosi na ọnwụ ahụ mere nso nso a, kwekọrọ n’ike okwu ἄρτι.
- source_word: ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν
  choice: bikwasị ya aka gị
  rationale: Ọ bụ ụzọ Igbo dị n’ụdị nkịtị isi kwuo itinye aka n’ahụ mmadụ, ma na-echekwa otu aka nke ederede Grik.
- source_word: ζήσεται
  choice: ọ ga-adịkwa ndụ
  rationale: Ọ na-echekwa nkwenye onye isi ahụ banyere nsonaazụ omume Jizọs n’enweghị ịgbakwunye nkọwa ọzọ.
theological_decisions:
- issue: Ihe προσεκύνει pụtara n’ebe a
  choice: kpọọ isiala n’ihu ya
  alternative: fee ya ofufe
  rationale: Okwu Grik nwere ike ịpụta ịkpọ isiala maka nkwanye ùgwù ma ọ bụ ofufe; nsụgharị ahọpụtara na-echekwa mgbagwoju ahụ kama ikpebi ya dịka ofufe kpọmkwem.
- issue: Ọnọdụ nwaanyị ahụ
  choice: anwụọla ugbu a
  alternative: ọ nọ n’ọnụ ọnwụ
  rationale: ἐτελεύτησεν bụ okwu gara aga nke pụtara na ọ nwụrụ; e kwesịghị ime ka ọ bụrụ naanị na ọ na-achọ ịnwụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Lee’ na-echekwa akara akụkọ ἰδοὺ; usoro okwu ahụ dị eke n’Igbo ma na-edobe ngwa ngwa na nkwenye dị n’arịrịọ onye isi ahụ.
