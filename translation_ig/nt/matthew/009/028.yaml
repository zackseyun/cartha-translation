id: MAT.9.28
reference: Matthew 9:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: ig
  text: Mgbe ọ banyere n’ụlọ, ndị ikom ahụ kpuru ìsì bịakwutere ya. Jizọs wee sị ha, “Ùnu kwenyere na m nwere ike ime nke a?” Ha sịrị ya, “Ee, Onyenwe anyị.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nna ukwu.” Okwu Grik ahụ, κύριε, pụrụ ịbụ okwu nkwanye ùgwù; ma ebe a, “Onyenwe anyị” na-echekwa ohere ọ nwere igosi na ha matara ikike Jizọs.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: Mgbe ọ banyere n’ụlọ
  rationale: Nkebi okwu a na-egosi ihe mere n’oge ihe ọzọ mere. ‘Banyere n’ụlọ’ na-egosipụta ịbanye n’ụlọ n’Igbo doro anya ma dịkwa mfe.
- source_word: προσῆλθον αὐτῷ οἱ τυφλοί
  choice: ndị ikom ahụ kpuru ìsì bịakwutere ya
  rationale: ‘Bịakwutere ya’ na-egosi ịbịaru mmadụ nso ma ọ bụ ịbịakwute ya. A kọwara οἱ τυφλοί dị ka ndị ikom kpuru ìsì n’ihi na ihe gbara amaokwu a gburugburu na-ekwu banyere ndị ikom abụọ.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Jizọs wee sị ha
  rationale: Ọ bụ ezie na Grik ji historical present, akụkọ Igbo na-adịkarị ụtọ ma doo anya mgbe e ji ‘wee sị’ gosi usoro ihe mere n’oge gara aga.
- source_word: Πιστεύετε
  choice: Ùnu kwenyere
  rationale: ‘Kwenyere’ na-egosipụta ntụkwasị obi ha nwere n’ikike Jizọs, n’enweghị ịgbakwunye nkọwa okpukpe na-adịghị n’okwu Grik.
- source_word: ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: na m nwere ike ime nke a
  rationale: ‘Nwere ike’ bụ ụzọ Igbo sitere n’okike si kwuo δύναμαι, ebe ‘ime nke a’ na-ahapụ ihe a na-ekwu maka ya ka ọnọdụ akụkọ kọwaa ya.
- source_word: Ναί
  choice: Ee
  rationale: Nke a bụ azịza nkwenye kwụ ọtọ nke kwekọrọ na Ναί.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ahụkarị maka κύριε mgbe a na-akpọ Jizọs; ọ na-echekwa ma nkwanye ùgwù ma ohere nke ịmata ikike ya.
theological_decisions:
- issue: Otú e si sụgharị κύριε mgbe a na-akpọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: κύριε nwere ike ịbụ okwu nkwanye ùgwù ma ọ bụ nkwupụta banyere ikike Jizọs. ‘Onyenwe anyị’ na-echekwa ibu okwu ahụ, ebe ndetu ala peeji na-egosi ụzọ ọzọ n’enweghị ịmanye otu nghọta naanị.
- issue: Historical presents λέγει na λέγουσιν
  choice: wee sị / sịrị
  alternative: na-asị / na-asị
  rationale: E ji oge gara aga nke akụkọ Igbo mee ka okwu ahụ bụrụ nke sitere n’okike ma doo anya. Nke a anaghị agbanwe usoro ma ọ bụ ihe okwu Grik pụtara.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E zere ntụgharị okwu n’otu n’otu nke ga-eme ka ahịrịokwu sie ike, ma echekwara ajụjụ banyere okwukwe ha na mgbagwoju pụtara na κύριε.
