  edition: SBLGNT
  text: ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: ig
  text: N’ihi na ọ na-ekwu n’ime onwe ya sị, “Ọ bụrụ na m emetụ naanị uwe ya aka, a ga-azọpụta m[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a ga-agwọ m” ma ọ bụ “ahụ ga-adị m mma.” Grik kwuru, “a ga-azọpụta m,” jiri ngwaa nke nwekwara ike izo aka n’ọgwụgwọ n’ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ọ nọ na-asị
  rationale: Oge imperfect na-egosi okwu dị n’obi nke na-aga n’ihu ma ọ bụ nke a na-ekwughachi; ‘ọ nọ na-asị’ na-egosipụta nke a n’Igbo eke.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na akụkọ gbara ya gburugburu dịka nkọwa maka ihe mere nwanyị ahụ ji mee ihe ahụ.
- source_word: ἐν ἑαυτῇ
  choice: onwe ya
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu mmadụ kwuru n’ime onwe ya, ọ bụghị okwu o kwuru n’olu nye onye ọzọ.
- source_word: Ἐὰν μόνον
  choice: Ọ bụrụ na ... naanị
  rationale: Nhazi a na-egosi na imetụ uwe ahụ aka bụ naanị ihe nwanyị ahụ weere dị mkpa.
- source_word: ἅψωμαι
  choice: m emetụ ... aka
  rationale: ‘Imetụ aka’ bụ okwu Igbo doro anya maka mmetụ a; ọ naghị agbakwụnye echiche nke ijide uwe ahụ aka.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: uwe ya
  rationale: ἱμάτιον na-ezo aka n’uwe, karịchaa uwe elu; ‘uwe ya’ bụ okwu sara mbara, eke, nke na-adịghị akọwapụta ụdị uwe karịa ihe Grik chọrọ.
- source_word: σωθήσομαι
  choice: a ga-azọpụta m
  rationale: A na-edobe isi echiche sara mbara nke σῴζω n’ahịrịokwu bụ isi, ebe ndetu ala na-akọwa na n’ọnọdụ a ọ pụkwara ịpụta ọgwụgwọ ma ọ bụ ime ka ahụ dị mma.
theological_decisions:
- issue: Nsụgharị σωθήσομαι n’ọnọdụ metụtara ọgwụgwọ
  choice: a ga-azọpụta m
  alternative: a ga-agwọ m; ahụ ga-adị m mma
  rationale: Ọnọdụ akụkọ ahụ na-ekwu maka ọgwụgwọ anụ ahụ, ma ngwaa Grik σῴζω sara mbara karịa okwu ọgwụgwọ kpọmkwem. Ide ‘a ga-azọpụta m’ na-edobe obosara okwu ahụ na ụda okwukwe ya n’etinyeghị nkọwa ozizi n’ime ya; ndetu ala na-eme ka ihe ọ pụtara n’ọnọdụ a doo anya.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E jiri ‘ọ nọ na-asị onwe ya’ chekwaa akụkụ imperfect na okwu dị n’ime obi; e debere ‘a ga-azọpụta m’ n’ahịrịokwu bụ isi iji chekwaa obosara okwu Grik, ma kọwaa echiche ọgwụgwọ na ndetu ala.
