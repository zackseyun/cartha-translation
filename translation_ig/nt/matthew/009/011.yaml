  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: ig
  text: Mgbe ndị Farisii hụrụ nke a[a], ha nọ na-ajụ ndị na-eso ụzọ ya, sị, “Gịnị mere onye nkụzi unu ji eso ndị ọna ụtụ na ndị mmehie eri nri?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-esochi usoro okwu Grik karịa, “Mgbe ndị Farisii hụrụ, ha nọ na-ajụ ndị na-eso ụzọ ya...” Grik ekwughị kpọmkwem ihe ha hụrụ; ihe a na-ekwu banyere ya bụ ọnọdụ iri nri dị n’akụkọ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Mgbe ... hụrụ nke a
  rationale: A tụgharịrị nkebi-ngwaa aorist ahụ dị ka ihe mere n’oge ahụ ka akụkọ ahụ wee na-aga nke ọma n’Igbo. E tinyere “nke a” iji zoo aka n’ihe ha hụrụ—Jizọs na ndị ahụ na-eri nri—ọ bụ ezie na Grik ekwughị ihe ahụ kpọmkwem.
- source_word: ἔλεγον
  choice: ha nọ na-ajụ
  rationale: Ụdị imperfect na-egosi okwu na-aga n’ihu n’oge gara aga. “Ha nọ na-ajụ” na-echekwa echiche ahụ ma dabara n’ụdị ajụjụ sochiri ya.
- source_word: μαθηταῖς
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-amụ ihe n’aka onye nkụzi ma na-eso ya, dịka ọ dị n’akụkọ Oziọma.
- source_word: Διὰ τί
  choice: Gịnị mere
  rationale: Nke a bụ ụzọ nkịtị na nke doro anya e si ajụ “n’ihi gịnị?” n’Igbo.
- source_word: τελωνῶν
  choice: ndị ọna ụtụ
  rationale: Okwu a na-akọwa ndị ọrụ ha bụ ịnakọta ụtụ, ma ghara itinye nkọwa ọzọ banyere ọnọdụ ha n’obodo nke Grik ekwughị kpọmkwem.
- source_word: ἁμαρτωλῶν
  choice: ndị mmehie
  rationale: Nke a bụ ntụgharị kwụ ọtọ nke okwu Grik ahụ ma na-echekwa ma echiche omume ọjọọ ma aha otu ndị a na-ele anya n’ụzọ pụrụ iche n’ọnọdụ a.
- source_word: ἐσθίει
  choice: ji eso ... eri nri
  rationale: Ụdị a bụ Igbo ebumpụta ụwa maka mmadụ iso ndị ọzọ rie nri, ma na-echekwa present tense nke ajụjụ ahụ.
- source_word: διδάσκαλος
  choice: onye nkụzi
  rationale: Nke a na-enye isi okwu Grik ahụ n’Igbo doro anya ma na-echekwa mmekọrịta onye nkụzi na ndị na-eso ụzọ ya.
theological_decisions:
- issue: Ma a ga-ekwupụta kpọmkwem ihe ndị Farisii hụrụ
  choice: E tinyere “nke a” n’ahịrịokwu bụ isi.
  alternative: “Mgbe ndị Farisii hụrụ...” ma ọ bụ “Ndị Farisii hụkwara...” n’enweghị ihe e kwuru na ha hụrụ.
  rationale: Grik hapụrụ ihe ἰδόντες na-arụtụ aka na ya n’ime ọnọdụ akụkọ ahụ. Igbo ga-aka doo anya ma bụrụ ihe a na-ekwu n’ụzọ ebumpụta ụwa site n’itinye “nke a”; ọ na-ezo aka n’ọnọdụ iri nri ahụ ma ọ naghị agbakwunye ozizi okpukpe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ndị na-eso ụzọ,” “onye nkụzi,” na “ndị ọna ụtụ” bụ okwu doro anya nye ọtụtụ ndị na-agụ Igbo. A họọrọ “ha nọ na-ajụ” iji gosipụta imperfective aspect nke ἔλεγον n’enweghị ime ka okwu ahụ sie ike.
