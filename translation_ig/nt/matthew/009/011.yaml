  to: Mgbe ndị Farisii hụrụ nke a[a], ha nọ na-ajụ ndị na-eso ụzọ ya, sị, “Gịnị mere onye nkụzi unu ji eso ndị ọna ụtụ na ndị mmehie eri nri?”
