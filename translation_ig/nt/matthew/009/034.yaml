  naturalness: The draft is intelligible Standard Igbo. A direct “site n’aka ... ka ọ na-achụpụ” is equally natural and more closely aligned with the Greek construction while preserving the imperfect sense.
  terminology: “Ndị Farisii,” “onye na-achị,” and “ndị mmụọ ọjọọ” are appropriate modern Standard Igbo terms. No doctrinally loaded terminology has been introduced.
