source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: ig
  text: Ma ndị Farisii nọ na-ekwu, “Ọ bụ site n’aka onye na-achị ndị mmụọ ọjọọ ka ọ na-achụpụ ndị mmụọ ọjọọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị megidere mmeghachi omume ọma dị n’amaokwu bu ụzọ.
- source_word: Φαρισαῖοι
  choice: ndị Farisii
  rationale: Nke a bụ aha otu ndị Juu ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: ἔλεγον
  choice: nọ na-ekwu
  rationale: Ọ na-echekwa ọdịdị imperfect nke Grik, nke nwere ike igosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwughachi.
- source_word: Ἐν τῷ ἄρχοντι
  choice: Ọ bụ site n’ike onye na-achị
  rationale: ἐν na dative ebe a na-egosi ụzọ ma ọ bụ ike e ji mee ihe; ntụgharị a bụ Igbo doro anya ma na-echekwa ebubo ahụ.
- source_word: ἄρχοντι
  choice: onye na-achị
  rationale: Ọ na-egosi onye nwere ikike n’ụzọ dị mfe ma kwekọọ na Igbo nke oge a.
- source_word: τῶν δαιμονίων / τὰ δαιμόνια
  choice: ndị mmụọ ọjọọ
  rationale: Ọ na-ezo kpọmkwem aka n’ụdị ndị mmụọ ọjọọ a na-achụpụ, ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: ἐκβάλλει
  choice: ọ ji achụpụ
  rationale: “Ịchụpụ” na-enye echiche nke ịmanye ndị mmụọ ahụ ka ha pụọ, dịka okwu Grik si dị n’ọnọdụ a.
theological_decisions:
- issue: Isi iyi nke ike Jizọs ji achụpụ ndị mmụọ ọjọọ
  choice: site n’ike onye na-achị ndị mmụọ ọjọọ
  alternative: n’ime onye na-achị ndị mmụọ ọjọọ
  rationale: N’ebe a ἐν nwere ọrụ instrumental, ya bụ, ndị Farisii na-ekwu na ike ahụ sitere n’aka onyeisi ndị mmụọ ọjọọ; a hapụrụ ya dịka ebubo ha, ọ bụghị nkwenye onye na-akọ akụkọ.
- issue: Ntughari δαιμόνια
  choice: ndị mmụọ ọjọọ
  alternative: ndị mmụọ
  rationale: “Ndị mmụọ ọjọọ” na-eme ka ụdị mmụọ ndị ahụ doo anya n’Igbo ma ghara ibelata ihe karịrị mmadụ nke okwu ahụ na-ekwu.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji usoro “Ọ bụ ... ka ...” mee ka ebubo ahụ bụrụ nke e ji ọnụ ekwu n’ụzọ ebumpụta ụwa, ebe “nọ na-ekwu” na-echekwa akụkụ imperfect nke Grik.
