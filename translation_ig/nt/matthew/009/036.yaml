  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: ig
  text: Mgbe ọ hụrụ ìgwè mmadụ ahụ, o nwere ọmịiko n’ebe ha nọ, n’ihi na a na-enye ha nsogbu, a tụdarakwa ha n’ala[a], dị ka atụrụ na-enweghị onye ọzụzụ atụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ike agwụla ha, ha enweghịkwa enyemaka.” Okwu Grik abụọ a nwekwara ike ịkọwa ndị ike gwụrụ, ndị dara mba, ndị na-enweghịkwa ike ilekọta onwe ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Mgbe ọ hụrụ
  rationale: A sụgharịrị participle aorist ahụ dị ka nkebiokwu oge ka Igbo wee na-aga were were; δέ bụ njikọ dị nro, nke usoro ahịrịokwu Igbo a na-egosipụta n’enweghị ịgbakwunye okwu njikọ pụrụ iche.
- source_word: τοὺς ὄχλους
  choice: ìgwè mmadụ ahụ
  rationale: Nke a bụ okwu Igbo nke oge a, doro anya maka ọtụtụ mmadụ gbakọtara ọnụ.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: o nwere ọmịiko n’ahụ ha
  rationale: Ọ na-egosi ọmịiko miri emi Jizọs nwere n’ebe ha nọ n’asụsụ Igbo dị mfe ma dị ugwu.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara ọmịiko ahụ n’ụzọ doro anya.
- source_word: ἐσκυλμένοι
  choice: e megburu ha
  rationale: Nhọrọ a na-ejigide echiche nke ndị e nyere nsogbu ma ọ bụ e mesoro ihe ọjọọ, n’etinyeghị nkọwa karịrị ihe okwu Grik ahụ nwere ike ịpụta.
- source_word: καὶ ἐρριμμένοι
  choice: a tụdakwaa ha n’ala
  rationale: Nke a na-echekwa oyiyi nkịtị nke participle passive sitere na ῥίπτω—ndị a tụdara ma hapụ n’ala—kama ịsụgharị ya nanị dị ka enweghị enyemaka.
- source_word: ὡσεὶ πρόβατα
  choice: dị ka atụrụ
  rationale: Ọ bụ ntụnyere Igbo dị mfe nke na-echekwa oyiyi atụrụ dị n’ederede Grik.
- source_word: μὴ ἔχοντα ποιμένα
  choice: na-enweghị onye ọzụzụ atụrụ
  rationale: Nke a bụ ụzọ Igbo doro anya isi kwuo na atụrụ ndị ahụ enweghị onye na-elekọta ma na-edu ha.
theological_decisions:
- issue: Okwu e ji kọwaa ọmịiko Jizọs
  choice: o nwere ọmịiko n’ahụ ha
  alternative: obi ebere metụrụ ya n’ebe ha nọ
  rationale: Nhọrọ a na-egosi ọmịiko miri emi n’enweghị okwu ochie ma ọ bụ ịgbakwunye nkọwa ozizi na-adịghị na Grik.
- issue: Ọnọdụ ìgwè mmadụ ahụ
  choice: e megburu ha, a tụdakwaa ha n’ala
  alternative: ike agwụla ha, ha enweghịkwa enyemaka
  rationale: 'Nhọrọ bụ isi na-anọ nso n’oyiyi participle passive abụọ ahụ: e mesoro ha ihe ọjọọ, a tụdakwara ha. Nhọrọ ọzọ na-akọwa mmetụta ha nke ọma, ma ọ na-ahapụ oyiyi nke ịtụda ha n’ala.'
translation_notes:
  register: Standard Igbo nke oge a; ahịrịokwu ahụ dị mfe ma dị ugwu. E chekwara oyiyi onye ọzụzụ atụrụ na nke ndị a tụdara n’ala, ebe nkọwa okwu ọzọ dị n’ala peeji na-egosi nghọta ndị ọzọ okwu Grik ahụ nwere ike inwe.
