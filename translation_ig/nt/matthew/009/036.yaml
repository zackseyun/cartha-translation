revisions:
- from: Mgbe ọ hụrụ ìgwè mmadụ ahụ, o nwere ọmịiko n’ahụ ha, n’ihi na e megburu ha, a tụdakwaa ha n’ala[a], dị ka atụrụ na-enweghị onye ọzụzụ atụrụ.
  to: Mgbe ọ hụrụ ìgwè mmadụ ahụ, o nwere ọmịiko n’ebe ha nọ, n’ihi na a na-enye ha nsogbu, a tụdarakwa ha n’ala[a], dị ka atụrụ na-enweghị onye ọzụzụ atụrụ.
  rationale: The revision avoids implying literal beating where the Greek permits the broader sense “harassed/troubled,” while preserving the passive imagery of being cast down. It also makes the compassion expression and the second passive clause more natural in modern Standard Igbo. The footnote remains anchored to the second descriptive phrase and presents the interpretive alternative without treating it as the only meaning.
