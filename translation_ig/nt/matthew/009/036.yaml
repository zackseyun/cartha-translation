review_pass:
  verdict: revise
  source_fidelity: The draft faithfully retains the temporal participle, Jesus' compassion, the causal clause, and the sheep/shepherd comparison. However, “e megburu ha” most readily suggests that they had been beaten or injured, which is too specific for ἐσκυλμένοι in this context. “A tụdakwaa ha n’ala” preserves the image of ἐρριμμένοι but is less natural than a simple passive perfect form.
  naturalness: The overall sentence is clear Standard Igbo. “O nwere ọmịiko n’ahụ ha” is understandable, but “o nwere ọmịiko n’ebe ha nọ” is more idiomatic. Replacing “a tụdakwaa” with “a tụdarakwa” improves ordinary modern usage.
  terminology: “Ìgwè mmadụ,” “ọmịiko,” “atụrụ,” and “onye ọzụzụ atụrụ” are suitable, clear Standard Igbo terms. The revision keeps the pastoral metaphor and does not add theological interpretation.
  issues:
  - severity: medium
    issue: “e megburu ha” is overly specific for ἐσκυλμένοι.
    rationale: In ordinary Igbo it commonly evokes beating, injury, or severe physical mistreatment. The Greek can denote people troubled, harassed, or worn down, without specifying physical assault.
  - severity: low
    issue: The expression “a tụdakwaa ha n’ala” is marked and less idiomatic.
    rationale: “A tụdarakwa ha n’ala” expresses the perfect-passive image naturally while retaining the sense of people having been thrown down.
  - severity: low
    issue: “n’ahụ ha” after “ọmịiko” is less idiomatic than “n’ebe ha nọ.”
    rationale: The latter is a more natural contemporary Igbo way to express compassion directed toward people.
  revised_text: Mgbe ọ hụrụ ìgwè mmadụ ahụ, o nwere ọmịiko n’ebe ha nọ, n’ihi na a na-enye ha nsogbu, a tụdarakwa ha n’ala[a], dị ka atụrụ na-enweghị onye ọzụzụ atụrụ.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ike agwụla ha, ha enweghịkwa enyemaka.” Okwu Grik abụọ a nwekwara ike ịkọwa ndị ike gwụrụ, ndị dara mba, ndị na-enweghịkwa ike ilekọta onwe ha.
    reason: lexical_alternative
  revision_rationale: The revision avoids implying literal beating where the Greek permits the broader sense “harassed/troubled,” while preserving the passive imagery of being cast down. It also makes the compassion expression and the second passive clause more natural in modern Standard Igbo. The footnote remains anchored to the second descriptive phrase and presents the interpretive alternative without treating it as the only meaning.
