id: MAT.9.13
reference: Matthew 9:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: ig
  text: 'Ma gaanụ mụta ihe nke a pụtara[a]: “Ọ bụ ebere ka m chọrọ, ọ bụghị àjà.”[b] N’ihi na abịaghị m ịkpọ ndị ezi omume[c], kama ọ bụ ndị mmehie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “ihe nke a bụ.”
    reason: lexical_alternative
  - marker: b
    text: E hotara ya n’Hosịa 6:6.
    reason: cross_reference
  - marker: c
    text: Ma eleghị anya, “ndị na-ewere onwe ha dị ka ndị ezi omume”; Grik kwuru naanị “ndị ezi omume.”
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: gaanụ
  rationale: Aorist participle a na-arụkọ ọrụ na iwu na-esochi ya; “gaanụ” na-enye ụda iwu ahụ n’Igbo nkịtị ma na-egosi na a na-agwa ọtụtụ mmadụ okwu.
- source_word: μάθετε
  choice: mụta
  rationale: Na-echekwa iwu ka ha nweta nghọta, tinyere ụda ịdọ aka ná ntị dị n’okwu Jizọs.
- source_word: τί ἐστιν
  choice: ihe nke a pụtara
  rationale: Nke a bụ ụzọ Igbo doro anya si kwuo ajụjụ banyere ihe okwu Akwụkwọ Nsọ ahụ na-egosi; ntụgharị nkịtị ka e debere na nkọwa ala peeji.
- source_word: ἔλεος
  choice: ebere
  rationale: “Ebere” bụ okwu Igbo a na-ahụkarị nke na-eburu echiche ọmịiko na omume obi ebere dị na ἔλεος.
- source_word: θέλω
  choice: ka m chọrọ
  rationale: Usoro “ọ bụ ... ka m chọrọ” na-egosipụta ọchịchọ na nkwusi ike nke ntụnyere ahụ n’Igbo dị ebube ma dị mfe.
- source_word: θυσίαν
  choice: àjà
  rationale: “Àjà” bụ ntụgharị kpọmkwem na nke a na-ejikarị eme ihe maka onyinye a na-achụ n’ofufe; a hapụrụ ya n’otu dịka Grik si dị.
- source_word: ἦλθον
  choice: abịaghị m
  rationale: Na-egosi ọbịbịa Jizọs na ebumnuche ozi ya n’ụzọ Igbo sitere n’okwu aorist ahụ.
- source_word: καλέσαι
  choice: ịkpọ
  rationale: “Ịkpọ” na-echekwa obosara nke καλέσαι—ịkpọ mmadụ ka ọ bịa ma ọ bụ ịkpọ ya n’ụzọ metụtara ozi—na-enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: δικαίους
  choice: ndị ezi omume
  rationale: Na-echekwa aha otu ndị ahụ dịka Grik si kwuo ya, na-enweghị itinye n’ahịrị bụ isi na ha bụ ndị na-eche na ha bụ ndị ezi omume.
- source_word: ἁμαρτωλούς
  choice: ndị mmehie
  rationale: Nke a bụ ntụgharị Igbo doro anya maka aha ndị a kọwara site ná mmehie, ma na-echekwa ntụnyere siri ike ya na “ndị ezi omume.”
theological_decisions:
- issue: Ike okwu e hotara n’Hosịa 6:6
  choice: “Ọ bụ ebere ka m chọrọ, ọ bụghị àjà.”
  alternative: Ịsụgharị ya ka ọ pụta na Chineke jụrụ ụdị àjà niile kpamkpam, ma ọ bụ ime ka ntụnyere ahụ ghara ịdị ike.
  rationale: Usoro a na-echekwa nkwusi ike amụma ahụ na ntụnyere ebere na àjà, ma ọ naghị ewebata nkwubi okwu banyere àjà niile nke amaokwu ahụ ekwughị kpọmkwem.
- issue: Ndị okwu “ndị ezi omume” na-ezo aka na ha
  choice: Hapụ ya dịka “ndị ezi omume.”
  alternative: “Ndị na-ewere onwe ha dị ka ndị ezi omume” ma ọ bụ “ndị ezi omume n’anya onwe ha.”
  rationale: Ọnọdụ okwu ahụ nwere ike igosi okwu e kwuru n’ụzọ ịkwa emo, ma Grik ekwughị nke ahụ kpọmkwem. Ya mere, ahịrị bụ isi na-echekwa mgbagwoju anya ahụ, ebe nkọwa ala peeji na-egosi ihe ọzọ nwere ike ịbụ nghọta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. “Gaanụ” na-egosi na a na-agwa ọtụtụ ndị okwu; “ọ bụ ... ka” na-enye nkwusi ike sitere n’okwu amụma ahụ. E tinyere akara nkọwa ala peeji [a], [b], na [c] niile n’ahịrị bụ isi.
