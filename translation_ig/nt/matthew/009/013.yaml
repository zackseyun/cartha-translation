  source_fidelity: 'The translation accurately renders the idiomatic participle-imperative sequence as “Ma gaanụ mụta,” preserves the interpretive sense of τί ἐστιν as “ihe nke a pụtara,” and maintains the Greek contrast: mercy rather than sacrifice, and righteous rather than sinners. “Abịaghị m ịkpọ” suitably conveys οὐ γὰρ ἦλθον καλέσαι without adding an interpretation of Jesus’ purpose.'
