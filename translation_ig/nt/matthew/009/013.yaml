  terminology: “Ebere” for ἔλεος and “àjà” for θυσία are established, contextually appropriate biblical terms. The rendering leaves “ndị ezi omume” unexpanded in the main text, properly preserving the source’s ambiguity. The Hosea cross-reference and lexical/interpretive footnotes are accurate and their anchors are correctly placed.
