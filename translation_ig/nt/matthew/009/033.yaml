id: MAT.9.33
reference: Matthew 9:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: ig
  text: Mgbe a chụpụsịrị mmụọ ọjọọ ahụ, nwoke ogbi ahụ[a] kwuru okwu. Ìgwè mmadụ ahụ juru anya, ha sị, “A hụtụbeghị ụdị ihe a n’Izrel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwoke ntị chiri ahụ.” Okwu Grik a nwere ike ịpụta onye ntị chiri ma ọ bụ onye ogbi; n’ebe a, ihe a na-ekwusi ike bụ na nwoke ahụ kwuru okwu, ya mere “ogbi” dabara nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: mgbe a chụpụsịrị
  rationale: Ụdị a na-egosi na ịchụpụ mmụọ ahụ mere tupu nwoke ahụ ekwuo okwu, ma na-anọgidekwa n’ụzọ Igbo si ekwu okwu nke ọma.
- source_word: δαιμονίου
  choice: mmụọ ọjọọ ahụ
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa δαιμόνιον n’akụkọ ịchụpụ mmụọ ọjọọ.
- source_word: ἐλάλησεν
  choice: kwuru okwu
  rationale: Ọ na-egosipụta ihe aorist ahụ kwuru n’enweghị ịgbakwụnye echiche na ọ ‘malitere’ ikwu okwu.
- source_word: ὁ κωφός
  choice: nwoke ogbi ahụ
  rationale: κωφός pụrụ ịpụta onye ntị chiri ma ọ bụ onye ogbi, ma ihe so ya ozugbo—na nwoke ahụ kwuru okwu—mere ka ‘ogbi’ kwekọọ nke ọma n’ebe a. E tinyere ‘nwoke’ dịka ihe ọnọdụ akụkọ ahụ na-egosi.
- source_word: ἐθαύμασαν
  choice: o jukwara ... anya
  rationale: Nke a bụ ụzọ Igbo dị ugbu a ma bụrụkwa nke ebumpụta ụwa isi gosipụta oke ihe ijuanya nke ìgwè mmadụ ahụ.
- source_word: οἱ ὄχλοι
  choice: ìgwè mmadụ ahụ
  rationale: Ọ bụ ụzọ Igbo ebumpụta ụwa isi kpọọ ọtụtụ mmadụ gbakọrọ ọnụ; ọ naghị achọ ka e debe ọtụtụ nke Grik n’ụzọ ga-ada arọ n’Igbo.
- source_word: Οὐδέποτε
  choice: a hụtụbeghị
  rationale: Ngwakọta ‘-tụ-’ na ‘-beghị’ na-egosi nke ọma na ụdị ihe ahụ emetụbeghị mbụ.
- source_word: ἐφάνη ... οὕτως
  choice: a hụtụbeghị ụdị ihe a
  rationale: Ọ bụ ntụgharị Igbo ebumpụta ụwa nke okwu na-ekwu na ihe dị otu a apụtabeghị ma ọ bụ ahụbeghị mbụ, n’enweghị ịkọwapụta ihe Grik hapụrụ n’ụdị okwu mkpu ahụ.
- source_word: ἐν τῷ Ἰσραήλ
  choice: n’Izrel
  rationale: Nke a dị nkenke ma nwee ike ịpụta n’etiti ndị Izrel ma ọ bụ n’ala Izrel, dịka okwu Grik ahụ si nwee obosara.
theological_decisions:
- issue: Ọtụtụ ihe κωφός pụrụ ịpụta n’ọnọdụ ọgwụgwọ na ịchụpụ mmụọ ọjọọ
  choice: nwoke ogbi ahụ
  alternative: nwoke ntị chiri ahụ
  rationale: Okwu Grik ahụ nwere ike ịpụta onye ntị chiri ma ọ bụ onye ogbi. N’ihi na amaokwu ahụ na-ekwusi ike na nwoke ahụ kwuru okwu, ‘ogbi’ bụ nke kacha dabara ebe a. Ihe odide ala ala peeji na-echekwa ụzọ ọzọ ahụ n’enweghị ịgbakwụnye ọnọdụ ọzọ na-adịghị doo anya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ndị ahụ na-agbaso usoro akụkọ Igbo ebumpụta ụwa, ebe ‘A hụtụbeghị ụdị ihe a’ na-eburu ike nke mkpu ìgwè mmadụ ahụ n’enweghị ịkọwa karịa ihe Grik kwuru.
