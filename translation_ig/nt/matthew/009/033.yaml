revisions:
- from: Mgbe a chụpụsịrị mmụọ ọjọọ ahụ, nwoke ogbi ahụ[a] kwuru okwu. O jukwara ìgwè mmadụ ahụ anya, ha wee sị, “A hụtụbeghị ụdị ihe a n’Izrel.”
  to: Mgbe a chụpụsịrị mmụọ ọjọọ ahụ, nwoke ogbi ahụ[a] kwuru okwu. Ìgwè mmadụ ahụ juru anya, ha sị, “A hụtụbeghị ụdị ihe a n’Izrel.”
  rationale: The revision makes ìgwè mmadụ ahụ ('the crowds') the explicit subject of juru anya ('were amazed/marveled'), matching the Greek syntax and sense. The remainder is retained because it faithfully and naturally expresses the source text in Standard Igbo. The footnote is retained with a minor stylistic clarification.
