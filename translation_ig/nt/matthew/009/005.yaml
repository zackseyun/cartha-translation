source:
  edition: SBLGNT
  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: ig
  text: 'N’ihi na, olee nke dị mfe karị: ịsị, “A gbagharala gị mmehie”[a] ka ọ bụ ịsị, “Bilie jee ije”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “A gbaghaara gị mmehie.” Okwu Grik e ji mee ihe n’ebe a dị n’oge ugbu a, n’olu nnara, ma a pụkwara ịghọta ya dịka mgbaghara e merela nke nsonaazụ ya ka dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: N’ihi na olee nke dị mfe karị
  rationale: “Olee nke” na-egosi nhọrọ dị n’etiti okwu abụọ ahụ; “dị mfe karị” na-edobe ntụnyere ahụ. “N’ihi na” na-ejikọ ajụjụ a na nkọwa dị n’amaokwu bu ya ụzọ.
- source_word: εἰπεῖν
  choice: ịsị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’okwu nkịtị e ji akọ ihe mmadụ kwuru; e jikwa ya mee ihe n’ahịrịokwu abụọ ahụ.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: A gbagharala gị mmehie gị
  rationale: Ụdị a bụ okwu Igbo e ji ekwu n’ụzọ ebumpụta ụwa na mmehie onye ahụ nọ ugbu a n’ọnọdụ nke mgbaghara. Ọ naghị akọwapụta onye mere mgbaghara ahụ, dị ka passive Grik ahụ.
- source_word: ἁμαρτίαι
  choice: mmehie
  rationale: “Mmehie” bụ okwu Igbo zuru oke maka ọtụtụ mmehie n’ebe a, n’enweghị itinye nkọwa ọzọ na-adịghị n’ederede ahụ.
- source_word: Ἔγειρε
  choice: Bilie
  rationale: Iwu a na-agwa onye ahụ ka o si n’ọnọdụ ọ nọ bilie; “Bilie” bụ okwu Igbo doro anya ma dịkwa ebumpụta ụwa n’akụkọ ọgwụgwọ.
- source_word: καὶ περιπάτει
  choice: jee ije
  rationale: “Jee ije” na-enye iwu ka onye ahụ malite ije mgbe o biliri, n’ụzọ Igbo dị mfe ma ghara ịgbakwunye echiche nke ịgagharị ebe niile.
- source_word: σου
  choice: gị / gị
  rationale: A na-edobe onye nke abụọ otu n’ọnụ ọgụgụ. Igbo na-eji “gị” gosi ma onye a gbaghaara ma na mmehie ndị ahụ bụ nke ya.
theological_decisions:
- issue: Ụzọ e si sụgharịọ nkwupụta Jizọs banyere mgbaghara mmehie
  choice: A gbagharala gị mmehie gị
  alternative: A gbaghaara gị mmehie gị
  rationale: Ụdị nwere “-la” na-egosi ọnọdụ nke mgbaghara ahụ na-adị ugbu a, ma ọ naghị amanye nkọwa pụrụ iche banyere kpọmkwem mgbe mgbaghara ahụ mere. Ihe odide Grik nwere ike ibu echiche nke ihe a gbaghaara nke nsonaazụ ya ka dị; e debere ohere ahụ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. A họọrọ “ịsị” na “Bilie jee ije” ka okwu ahụ daa ka okwu mmadụ na-ekwu n’ezie, ebe a ka na-edobe njikọ nkọwa nke γάρ na ntụnyere dị n’ajụjụ ahụ.
