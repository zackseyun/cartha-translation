  to: Mgbe Jizọs na-esi n’ebe ahụ aga n’ihu, ndị ìsì abụọ soro ya, na-eti mkpu na-asị, “Nwa Devid[a], meere anyị ebere!”
  rationale: The revision preserves the Greek narrative sense and all semantic elements while improving the idiomatic movement clause, moving the note marker to the title it explains, and refining the footnote’s statement of Davidic heirship.
