    text: “Nwa Devid” bụ aha nsọpụrụ eze nke metụtara Mesaịa; ọ na-egosi na Jizọs bụ onye nketa e kwere ná nkwa n’usoro Devid.
    reason: cross_reference
  revision_rationale: The revision preserves the Greek narrative sense and all semantic elements while improving the idiomatic movement clause, moving the note marker to the title it explains, and refining the footnote’s statement of Davidic heirship.
