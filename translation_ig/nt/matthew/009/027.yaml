id: MAT.9.27
reference: Matthew 9:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: ig
  text: Mgbe Jizọs na-esi n’ebe ahụ aga n’ihu, ndị ìsì abụọ soro ya, na-eti mkpu na-asị, “Nwa Devid[a], meere anyị ebere!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nwa Devid” bụ aha nsọpụrụ eze nke metụtara Mesaịa; ọ na-egosi na Jizọs bụ onye nketa e kwere ná nkwa n’usoro Devid.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν
  choice: Mgbe Jizọs si n’ebe ahụ na-aga n’ihu
  rationale: 'Nke a na-egosipụta omume na-aga n’ihu n’otu oge ahụ: Jizọs nọ na-esi n’ebe ahụ aga n’ihu. Ọ na-echekwa usoro akụkọ ahụ n’enweghị ịkọwa ya dị ka naanị ịgafe n’akụkụ mmadụ.'
- source_word: ἠκολούθησαν αὐτῷ
  choice: soro ya
  rationale: N’ebe a, okwu ahụ pụtara iso mmadụ n’ụzọ nkịtị, ya bụ ịga n’azụ ya.
- source_word: δύο τυφλοὶ
  choice: ndị ìsì abụọ
  rationale: Ụdị a bụ okwu Igbo doro anya ma kwekọọ n’ọtụtụ nwoke e kwuru n’asụsụ Grik, n’enweghị okwu na-adịghị mkpa.
- source_word: κράζοντες καὶ λέγοντες
  choice: na-eti mkpu na-asị
  rationale: Nke a na-echekwa ma olu ike na arịrịọ ngwa ngwa nke κράζω, tinyekwara usoro ikwu okwu nke λέγοντες n’Igbo eke.
- source_word: Ἐλέησον ἡμᾶς
  choice: meere anyị ebere
  rationale: Ọ bụ arịrịọ kpọmkwem ka e jiri ebere mee ihe; nkebiokwu a bụ nke eke, dị ùgwù, ma doo anya n’Igbo.
- source_word: υἱὲ Δαυίδ
  choice: Nwa Devid
  rationale: A hapụrụ ya dị ka aha nsọpụrụ ọdịnala nke metụtara eze na Mesaịa, kama ịgbanwe ya ka ọ bụrụ naanị nkọwa agbụrụ.
theological_decisions:
- issue: Ihe aha “Nwa Devid” pụtara gbasara Mesaịa
  choice: Idebe “Nwa Devid” dị ka aha nsọpụrụ n’ahịrịokwu bụ isi
  alternative: “Nwa Devid bụ́ Mesaịa” ma ọ bụ “onye sitere n’agbụrụ Devid”
  rationale: Asụsụ Grik kọwara ya naanị site n’aha ọdịnala ahụ. Idebe ya otú ahụ na-echekwa ihe ọ na-ekwu banyere eze na Mesaịa n’enweghị ịtinye nkọwa ọzọ n’ahịrịokwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. “Na-eti mkpu na-asị” na-egosipụta arịrịọ siri ike; “Nwa Devid” na-echekwa aha nsọpụrụ ahụ na ihe ọ pụtara n’akụkọ Matiu.
