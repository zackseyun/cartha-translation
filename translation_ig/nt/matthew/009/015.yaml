id: MAT.9.15
reference: Matthew 9:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: ig
  text: Jizọs wee sị ha, “Ndị enyi onye na-alụ nwanyị ọhụrụ[a] hà pụrụ iru uju mgbe onye na-alụ nwanyị ọhụrụ nọnyere ha? Ma ụbọchị ga-abịa mgbe a ga-anapụ ha onye na-alụ nwanyị ọhụrụ[b]; mgbe ahụ ha ga-ebu ọnụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ụmụ ụlọ agbamakwụkwọ”; ọ bụ akpaalaokwu maka ndị enyi onye na-alụ nwanyị ọhụrụ ma ọ bụ ndị so ya n’emume agbamakwụkwọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “mgbe a ga-ewepụ onye na-alụ nwanyị ọhụrụ n’ebe ha nọ.” Ụdị nnara-eme nke okwu ahụ na-egosi ihe karịrị nanị ịla n’ụzọ nkịtị.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: ndị na-eso nwoke na-alụ nwaanyị n’emume agbamakwụkwọ
  rationale: Nkebiokwu Grik a bụ akpaalaokwu pụtara ndị enyi ma ọ bụ ndị na-enyere nwoke na-alụ nwaanyị aka n’emume agbamakwụkwọ. Nsụgharị a na-eme ka ọrụ ha doo onye Igbo nke oge a anya, kama ịsụgharị ya n’ụzọ nkịtị dị ka ‘ụmụ ụlọ agbamakwụkwọ.’
- source_word: πενθεῖν
  choice: iru uju
  rationale: ‘Iru uju’ na-egosipụta mwute na akwa arịrị nke okwu Grik ahụ pụtara, ma na-echekwa ọdịiche ya na ibu ọnụ.
- source_word: ἐφ’ ὅσον
  choice: mgbe ... ka nọnyere ha
  rationale: Nke a bụ ụzọ Igbo si egosipụta oge na-aga n’ihu n’ụzọ dị mfe ma kwekọọ na ‘ruo ogologo oge ọ nọnyere ha.’
- source_word: νυμφίος
  choice: nwoke na-alụ nwaanyị
  rationale: Nke a bụ okwu Igbo doro anya maka nwoke a na-agba alụmdi na nwunye, ma na-ahapụ ihe atụ ahụ ka ọ dị n’amaokwu ahụ n’enweghị ịkọwa ya karịa ihe e dere.
- source_word: ἀπαρθῇ
  choice: a ga-ewepụ ... n’etiti ha
  rationale: Ụdị nnara-eme nke okwu Grik ahụ na-egosi na ọ bụghị nanị ịla n’onwe ya; ‘a ga-ewepụ’ na-echekwa echiche nke iwepụ ya n’ebe ha nọ.
- source_word: νηστεύσουσιν
  choice: ha ga-ebu ọnụ
  rationale: Nke a bụ okwu Igbo a na-ejikarị ekwu ịhapụ iri nri dịka omume ibu ọnụ.
- source_word: Μὴ δύνανται ... ;
  choice: hà pụrụ ...?
  rationale: Ajụjụ a na-atụ anya azịza na-adịghị mma. Ụdị ajụjụ Igbo a na-echekwa ike ajụjụ ahụ n’ụzọ ebumpụta ụwa.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Ma ụbọchị ga-abịa
  rationale: Nke a na-echekwa okwu ọdịnihu na obere ọdịiche δέ na-egosi.
theological_decisions:
- issue: Ihe oyiyi nwoke na-alụ nwaanyị nwere ike ịpụta banyere Kraịst
  choice: Idobe ‘nwoke na-alụ nwaanyị’ dịka ihe atụ n’enweghị ịgbakwunye nkọwa na ọ bụ Jizọs ma ọ bụ onye Mesaya.
  alternative: Ịgbasa okwu ahụ n’ụzọ nkọwa dịka ‘Jizọs, nwoke na-alụ nwaanyị nke Mesaya.’
  rationale: Amaokwu ahụ n’onwe ya na-eji ihe atụ ahụ eme ihe ma na-ahapụ ndị na-agụ ya ka ha ghọta ihe ọ pụtara. Ịghara ịgbakwunye nkọwa na-echekwa mgbagwoju na ibu mmụta okpukpe dị n’ederede.
- issue: Ụdị iwepụ nwoke na-alụ nwaanyị
  choice: ‘A ga-ewepụ’ iji chekwaa nnara-eme na echiche nke iwepụ ya n’ike n’enweghị ịkpọ ọnwụ Jizọs aha kpọmkwem.
  alternative: ‘Ọ ga-ahapụ ha’ ma ọ bụ ‘mgbe a ga-egbu ya.’
  rationale: Nke mbụ ga-eme ka ike ἀπαρθῇ daa; nke abụọ ga-akọwa ihe amaokwu a na-egosi n’ụzọ atụ karịa ihe e kwuru kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘nwoke na-alụ nwaanyị’ kama okwu mbite ma ọ bụ okwu ochie, ma kọwaa akpaalaokwu Grik n’ahịrị okwu n’enweghị ime ka ihe atụ gbasara agbamakwụkwọ funahụ.
