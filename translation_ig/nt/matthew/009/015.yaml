revisions:
- from: Jizọs wee sị ha, “Ndị na-eso nwoke na-alụ nwaanyị n’emume agbamakwụkwọ[a] hà pụrụ iru uju mgbe nwoke ahụ na-alụ nwaanyị ka nọnyere ha? Ma ụbọchị ga-abịa mgbe a ga-ewepụ nwoke ahụ na-alụ nwaanyị n’etiti ha[b]; mgbe ahụ ka ha ga-ebu ọnụ.”
  to: Jizọs wee sị ha, “Ndị enyi onye na-alụ nwanyị ọhụrụ[a] hà pụrụ iru uju mgbe onye na-alụ nwanyị ọhụrụ nọnyere ha? Ma ụbọchị ga-abịa mgbe a ga-anapụ ha onye na-alụ nwanyị ọhụrụ[b]; mgbe ahụ ha ga-ebu ọnụ.”
  rationale: The revision clarifies the bridegroom and his companions in idiomatic modern Standard Igbo, while preserving the wedding metaphor, the rhetorical question expecting a negative answer, the future contrast, and the passive implication that the bridegroom will be removed rather than merely leave. The footnotes retain the literal idiom and the alternative passive rendering without imposing a doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
