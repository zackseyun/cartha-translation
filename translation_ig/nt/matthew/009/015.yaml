review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the rhetorical negative question, the contrast between mourning and fasting, the future coming of days, and the passive/forcible sense of ἀπαρθῇ. However, “nwoke na-alụ nwaanyị” is overly general (“a man marrying a woman”) and does not clearly carry the established bridegroom role or the verse’s sustained wedding imagery.
  naturalness: The sentence is generally understandable Standard Igbo, but repeated “nwoke na-alụ nwaanyị” is cumbersome and can sound like a generic description of a marrying man rather than the bridegroom in a wedding-party image. “Ndị enyi nwoke na-alụ nwanyị ọhụrụ” and “onye na-alụ nwanyị ọhụrụ” are clearer, natural contextual renderings.
  terminology: Use “onye na-alụ nwanyị ọhụrụ” consistently for νυμφίος. Render υἱοὶ τοῦ νυμφῶνος as “ndị enyi onye na-alụ nwanyị ọhụrụ,” which communicates the idiom’s referent without claiming a more specific formal role than the Greek supports. “A ga-anapụ ha” preserves the passive removal-from-them sense more directly than “a ga-ewepụ … n’etiti ha.”
  issues:
  - severity: medium
    issue: “Nwoke na-alụ nwaanyị” does not adequately identify the bridegroom.
    rationale: It can refer broadly to any man marrying a woman and weakens the lexical and metaphorical continuity of νυμφίος. “Onye na-alụ nwanyị ọhụrụ” is the clearer contextual designation.
  - severity: low
    issue: The phrase for the wedding attendants is less idiomatic than necessary.
    rationale: “Ndị na-eso nwoke na-alụ nwaanyị n’emume agbamakwụkwọ” is intelligible, but “ndị enyi onye na-alụ nwanyị ọhụrụ” is more natural and directly conveys the companions implied by the source idiom.
  - severity: low
    issue: “A ga-ewepụ … n’etiti ha” is slightly less direct for ἀπ’ αὐτῶν.
    rationale: The Greek explicitly expresses removal from them. “A ga-anapụ ha” retains both separation from them and the passive, potentially forceful nuance.
  revised_text: Jizọs wee sị ha, “Ndị enyi onye na-alụ nwanyị ọhụrụ[a] hà pụrụ iru uju mgbe onye na-alụ nwanyị ọhụrụ nọnyere ha? Ma ụbọchị ga-abịa mgbe a ga-anapụ ha onye na-alụ nwanyị ọhụrụ[b]; mgbe ahụ ha ga-ebu ọnụ.”
  revised_footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ụmụ ụlọ agbamakwụkwọ”; ọ bụ akpaalaokwu maka ndị enyi onye na-alụ nwanyị ọhụrụ ma ọ bụ ndị so ya n’emume agbamakwụkwọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “mgbe a ga-ewepụ onye na-alụ nwanyị ọhụrụ n’ebe ha nọ.” Ụdị nnara-eme nke okwu ahụ na-egosi ihe karịrị nanị ịla n’ụzọ nkịtị.
    reason: lexical_alternative
