id: MAT.9.2
reference: Matthew 9:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: ig
  text: Lee! Ha wetara Jizọs otu onye kpọnwụrụ akpọnwụ, nke dina n’elu àkwà. Mgbe Jizọs hụrụ okwukwe ha[a], ọ sịrị onye ahụ kpọnwụrụ akpọnwụ, “Nwee obi ike[b], nwa; e gbagharala gị mmehie gị[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ha” nwere ike izo aka naanị n’ebe ndị wetara ya nọ, ma ọ bụ gụnyekwa onye ahụ kpọnwụrụ akpọnwụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Ka obi sie gị ike.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “A gbagharawo gị mmehie gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lee
  rationale: Na-echekwa ọrụ okwu a dị ka ihe na-adọta uche onye na-agụ, ma bụrụkwa Igbo dị mfe ma dị ùgwù.
- source_word: προσέφερον
  choice: ha wetara ya
  rationale: Na-egosi na ha kpọtara onye ahụ bịakwute Jizọs; n’ọnọdụ akụkọ a, oge gara aga dị mfe na-ada nke ọma n’Igbo n’agbanyeghị ụdị imperfect dị na Grik.
- source_word: παραλυτικὸν
  choice: onye ahụ ya kpọnwụrụ akpọnwụ
  rationale: Nkọwa doro anya nke onye ahụ na-enweghị itinye aha nwoke n’ebe Grik na-ekwughị ya kpọmkwem.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: onye dina n’àkwà
  rationale: Na-egosi ọnọdụ onye ahụ n’ụzọ Igbo nkịtị; κλίνη pụtara àkwà ma ọ bụ obere àkwà, ọ bụghị iwu na ọ bụ ute.
- source_word: πίστιν
  choice: okwukwe
  rationale: Ọ bụ okwu Igbo a na-ahụkarị maka πίστις, ma n’ebe a ọ gụnyere ntụkwasị obi e gosipụtara n’omume.
- source_word: Θάρσει
  choice: Nwee obi ike
  rationale: Na-enye iwu agbamume ahụ n’Igbo doro anya ma kwekọọ n’ike okwu Grik.
- source_word: τέκνον
  choice: nwa m
  rationale: τέκνον bụ okwu e ji ịhụnanya na-akpọ mmadụ ‘nwa’; ‘m’ na-eme ka ụdị ịkpọ mmadụ a daa nke ọma n’Igbo n’enweghị ịkọwa ya dịka nwa nwoke.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: a gbagharala gị mmehie gị
  rationale: Na-enye nkwupụta mgbaghara ahụ n’ụzọ Igbo sitere n’okike, ma hapụ onye mere mgbaghara ahụ n’ekwughị aha dịka passive Grik si eme.
- source_word: ἁμαρτίαι
  choice: mmehie
  rationale: Ọ bụ okwu Igbo kwesịrị ekwesị maka mmejọ megide Chineke ma na-echekwa ihe okwu Grik pụtara.
theological_decisions:
- issue: Ndị okwu ‘okwukwe ha’ (τὴν πίστιν αὐτῶν) na-ezo aka na ha
  choice: E debere ‘okwukwe ha’ n’ụdị ọtụtụ mmadụ n’akwụkwọ bụ isi.
  alternative: Ọ pụrụ izo aka naanị n’ebe ndị bu ya nọ, ma ọ bụ gụnyekwa onye ahụ ya kpọnwụrụ akpọnwụ.
  rationale: Grik doro anya na ọ bụ ọtụtụ mmadụ, ma ọ kọwaghị kpọmkwem ma onye ahụ na-arịa ọrịa so n’otu ahụ; ya mere ntụgharị ekwesịghị idozi ihe ederede hapụrụ emeghe.
- issue: Ike nkwupụta mgbaghara Jizọs kwuru
  choice: ‘A gbagharala gị mmehie gị,’ ebe onye mere mgbaghara ahụ na-anọghị n’aha.
  alternative: A pụrụ ịghọta ya dịka nkwupụta na-eme ka mgbaghara ahụ dị irè ozugbo, ma ọ bụ dịka passive nke na-ezo aka n’omume Chineke.
  rationale: Ụdị passive Grik na-ekwupụta mgbaghara nke ọma ma hapụ onye na-eme ya n’ekwughị aha. Igbo a na-echekwa nke ahụ n’ebughị nkọwa nkà mmụta okpukpe ọzọ bata n’ahịrịokwu ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị mfe ma dị ùgwù. ‘Lee’ na-echekwa ụda akụkọ Matiu nke na-adọta uche. ‘Nwa m’ bụ ụdị ịkpọ mmadụ n’ịhụnanya nke na-ada nke ọma n’Igbo, ọ naghị etinye ozizi otu ụka. A haziri akara nkọwa ụkwụ n’ebe okwu nke ọ bụla metụtara dị.
