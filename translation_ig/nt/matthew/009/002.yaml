revisions:
- from: Lee, ha wetara ya onye ahụ ya kpọnwụrụ akpọnwụ, onye dina n’àkwà. Mgbe Jizọs hụrụ okwukwe ha[a], ọ sịrị onye ahụ ya kpọnwụrụ akpọnwụ, “Nwee obi ike[b], nwa m; a gbagharala gị mmehie gị[c].”
  to: Lee! Ha wetara Jizọs otu onye kpọnwụrụ akpọnwụ, nke dina n’elu àkwà. Mgbe Jizọs hụrụ okwukwe ha[a], ọ sịrị onye ahụ kpọnwụrụ akpọnwụ, “Nwee obi ike[b], nwa; e gbagharala gị mmehie gị[c].”
  rationale: The revision removes the added possessive in the form of address, replaces an awkward description of the paralytic with clear Standard Igbo, and clarifies that the people brought him to Jesus. It keeps the narrative attention marker, the plural “okwukwe ha,” the tender vocative, and the agentless forgiveness declaration. The revised forgiveness footnote gives a natural completed-state alternative rather than implying that forgiveness is necessarily an ongoing process.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:32:40Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the principal clauses and preserves the plural ambiguity of τὴν πίστιν αὐτῶν and the unstated agent of the passive forgiveness pronouncement. However, “nwa m” adds the possessive “my,” which is absent from τέκνον, and the wording for the paralytic is unnecessarily repetitive and unclear.
  naturalness: Several phrases are understandable but not idiomatic Standard Igbo. “onye ahụ ya kpọnwụrụ akpọnwụ” is awkward; “otu onye kpọnwụrụ akpọnwụ” is clearer. Naming Jizọs as the recipient in the first clause removes an avoidable pronoun ambiguity. “nwa” works as a tender direct address without adding a possessive.
  terminology: “okwukwe,” “mmehie,” and “kpọnwụrụ akpọnwụ” are suitable. “E gbagharala gị mmehie gị” naturally expresses a current, completed state of forgiveness while retaining the impersonal/passive formulation and unstated agent.
  issues:
  - severity: medium
    issue: The address “nwa m” adds a possessive not present in the Greek.
    rationale: τέκνον is “child” as a tender form of address; it has no μου (“my”). “Nwa” preserves the address without supplying additional possessive content.
  - severity: medium
    issue: “onye ahụ ya kpọnwụrụ akpọnwụ” is structurally awkward and repeats “onye ahụ.”
    rationale: The phrase does not express παραλυτικόν naturally in Standard Igbo. “otu onye kpọnwụrụ akpọnwụ” is clear and does not specify the person’s sex.
  - severity: low
    issue: The first “ya” can be read ambiguously in Igbo.
    rationale: Using “Jizọs” after the verb clearly represents αὐτῷ (“to him”) and improves readability without adding interpretive content.
  - severity: low
    issue: The forgiveness footnote overstates an ongoing-process sense.
    rationale: The Greek present passive is a declarative pronouncement; an explicitly progressive Igbo gloss (“A na-agbaghara…”) can suggest an ongoing process more strongly than the Greek requires. A completed-state alternative is safer.
  revised_text: Lee! Ha wetara Jizọs otu onye kpọnwụrụ akpọnwụ, nke dina n’elu àkwà. Mgbe Jizọs hụrụ okwukwe ha[a], ọ sịrị onye ahụ kpọnwụrụ akpọnwụ, “Nwee obi ike[b], nwa; e gbagharala gị mmehie gị[c].”
  revised_footnotes:
  - marker: a
    text: “Ha” nwere ike izo aka naanị n’ebe ndị wetara ya nọ, ma ọ bụ gụnyekwa onye ahụ kpọnwụrụ akpọnwụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Ka obi sie gị ike.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “A gbagharawo gị mmehie gị.”
    reason: lexical_alternative
  revision_rationale: The revision removes the added possessive in the form of address, replaces an awkward description of the paralytic with clear Standard Igbo, and clarifies that the people brought him to Jesus. It keeps the narrative attention marker, the plural “okwukwe ha,” the tender vocative, and the agentless forgiveness declaration. The revised forgiveness footnote gives a natural completed-state alternative rather than implying that forgiveness is necessarily an ongoing process.
