  source_fidelity: 'Isi ederede na-anọchi anya akụkụ Grik ahụ nke ọma: ἄρχων ka edobere dịka “onyeisi,” αὐληταί dịka “ndị na-afụ ọjà,” na θορυβούμενον dịka “na-eme mkpọtụ.” A naghị ebubata “onyeisi ụlọ nzukọ” n’isi ederede. Otú ọ dị, “ma hụ” adịghị ejikọta nke ọma mgbe “Mgbe” malitere nkebiokwu a; “wee hụ” na-egosi nke ọma usoro participle abụọ ahụ n’Igbo.'
