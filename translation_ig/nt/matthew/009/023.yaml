  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: ig
  text: Mgbe Jizọs batara n’ụlọ onyeisi ahụ[a] wee hụ ndị na-afụ ọjà[b] na igwe mmadụ ahụ na-eme mkpọtụ[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye ọchịchị” ma ọ bụ “onye nọ n’ọkwa ọchịchị”; ọ bụrụ na e jiri akụkọ ndị yiri nke a tụnyere ya, “onyeisi ụlọ nzukọ.” N’ebe a, okwu Matiu ji bụ naanị “onyeisi.”
    reason: alternative_reading
  - marker: b
    text: Ya bụ, ndị a na-akwụ ụgwọ ka ha kwaa ákwá n’oge iru uju anọworị ebe ahụ; ụfọdụ n’ime ha bụ ndị na-afụ ọjà, dị ka omenala olili ozu nke oge ahụ si dị.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “nọ n’ọgba aghara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Mgbe Jizọs batara
  rationale: Aorist participle ahụ na-egosi oge na usoro ihe mere; “Mgbe Jizọs batara” bụ Igbo doro anya ma na-ejikọta nkebiokwu a na ihe ga-esochi ya.
- source_word: οἰκίαν
  choice: ụlọ
  rationale: “Ụlọ” bụ okwu nkịtị na nke ziri ezi maka ebe obibi a kpọrọ aha n’akụkọ ahụ.
- source_word: ἄρχοντος
  choice: onyeisi ahụ
  rationale: “Onyeisi” na-edobe nkọwa sara mbara nke ἄρχων n’ebe a, n’etinyeghị nkọwa sitere n’akụkọ ndị yiri nke a na akwụkwọ ndị ọzọ.
- source_word: ἰδὼν
  choice: ma hụ
  rationale: Nke a na-enye ihe participle ahụ pụtara n’ụzọ Igbo dị mfe, ma na-ejikọta ya na “batara” dị ka omume nke otu onye ahụ.
- source_word: αὐλητὰς
  choice: ndị na-afụ ọjà
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-akụ ụdị ngwa egwu ikuku ahụ, ndị a na-ahụkarị n’oge iru uju na olili ozu.
- source_word: ὄχλον
  choice: igwe mmadụ ahụ
  rationale: “Igwe mmadụ” bụ ntụgharị Igbo kwesịrị ekwesị maka ìgwè mmadụ buru ibu n’akụkọ.
- source_word: θορυβούμενον
  choice: na-eme mkpọtụ
  rationale: Ọ na-egosi ụzụ na ọgba aghara ahụ n’akọwaghị kpọmkwem ụdị mmetụta uche ha nwere; “nọ n’ọgba aghara” ka bụkwa ntụgharị kwe omume.
theological_decisions:
- issue: Onye nwe ụlọ ahụ bụ onye dị aṅaa
  choice: onyeisi ahụ
  alternative: onye ọchịchị; onyeisi ụlọ nzukọ
  rationale: Matiu ji naanị ἄρχων, okwu sara mbara nke pụtara onyeisi ma ọ bụ onye ọchịchị. Ya mere, isi ederede anaghị etinye nkọwa “onyeisi ụlọ nzukọ” sitere n’akụkọ ndị yiri nke a.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere ahịrịokwu ahụ dị ka nkebiokwu na-eduga n’ihe Jizọs kwuru n’amaokwu na-esochi ya, dịka nhazi Grik si dị. E tinyere akara ndetu ozugbo n’ebe okwu nke ọ bụla metụtara dị.
