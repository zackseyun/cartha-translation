id: MAT.9.17
reference: Matthew 9:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: ig
  text: A naghịkwa awụnye mmanya a ka mere n’ime akpa mmanya e ji akpụkpọ anụ mee ochie. Ọ bụrụ na e mee otú ahụ, akpa ndị ahụ ga-agbawa, mmanya ahụ awụfuo, akpa ndị ahụ alakwa n’iyi. Kama, a na-awụnye mmanya a ka mere n’ime akpa mmanya e ji akpụkpọ anụ mee ọhụrụ[a], a na-echekwakwa ha abụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “akpa mmanya e ji akpụkpọ anụ mee ndị dị ọhụrụ.” Asụsụ Grik ji νέος kọwaa mmanya a ka mere, ma jiri καινός kọwaa akpa ndị ọhụrụ ma ọ bụ ndị dị mma n’ọnọdụ ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: A naghịkwa
  rationale: Ọ na-ejikọta ihe atụ a na okwu bu ya ụzọ ma na-egosi na nke a bụkwa ihe ndị mmadụ na-adịghị eme.
- source_word: βάλλουσιν
  choice: awụnye
  rationale: N’ihe gbasara mmanya na akpa, “ịwụnye” bụ okwu Igbo kachasị kwekọọ n’omume itinye mmiri n’ime ihe.
- source_word: οἶνον νέον
  choice: mmanya e mere ọhụrụ
  rationale: Nke a na-egosi mmanya a rụpụtara n’oge ọhụrụ, ma na-enyekwa ohere ịmata ọdịiche dị n’etiti νέος na καινός.
- source_word: ἀσκοὺς
  choice: akpa akpụkpọ mmanya
  rationale: Ọ kọwara akpa e ji akpụkpọ anụ mee nke a na-etinye mmanya n’ime ya n’oge ochie.
- source_word: παλαιούς
  choice: ochie
  rationale: Ọ na-egosi afọ na ọnọdụ akpa ndị ahụ, ma na-emegide “ndị dị ọhụrụ.”
- source_word: εἰ δὲ μή γε
  choice: Ọ bụrụ na e mee otú ahụ
  rationale: Nke a na-eme ka ọnọdụ ịdọ aka ná ntị na ihe ga-esi na ya pụta doo anya n’Igbo nkịtị.
- source_word: ῥήγνυνται
  choice: ga-agbawa
  rationale: Ọ na-egosi akpa ndị ahụ ịgbawa n’ihi nrụgide mmanya ọhụrụ.
- source_word: ἐκχεῖται
  choice: awụfuo
  rationale: Ọ na-egosi na mmanya ahụ ga-awụpụ ma laa n’iyi mgbe akpa gbawara.
- source_word: ἀπόλλυνται
  choice: alakwa n’iyi
  rationale: N’ebe a, okwu ahụ pụtara na akpa ndị ahụ emebiela, ha agaghịzi aba uru.
- source_word: ἀλλὰ
  choice: Kama
  rationale: Ọ na-egosi omume kwesịrị ekwesị nke dị iche n’omume ọjọọ a kọwara tupu ya.
- source_word: καινούς
  choice: ndị dị ọhụrụ
  rationale: Ọ na-egosi akpa ndị ọhụrụ n’ọnọdụ ha ma dị mma iji, ebe νέος na-akọwa mmanya e mere ọhụrụ.
- source_word: ἀμφότεροι συντηροῦνται
  choice: e wee chekwaa ha abụọ
  rationale: “Ha abụọ” na-ezo aka na mmanya ahụ na akpa akpụkpọ mmanya ahụ, na-egosikwa na ọ dịghị nke ga-ala n’iyi.
theological_decisions:
- issue: Ịmata ọdịiche dị n’etiti νέος na καινός n’otu amaokwu ahụ
  choice: Ịsụgharị νέος dị ka “e mere ọhụrụ,” ma καινός dị ka “dị ọhụrụ”
  alternative: Ịsụgharị ha abụọ naanị dị ka “ọhụrụ”
  rationale: 'Asụsụ Grik ji mkpụrụokwu abụọ dị iche. Nsụgharị a na-edobe ntakịrị ọdịiche ahụ: mmanya ahụ bụ nke e mere n’oge ọhụrụ, ebe akpa ndị ahụ bụ ndị ọhụrụ ma dị mma n’ọnọdụ ha, n’etinyeghị nkọwa ozizi ọzọ.'
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Akpa akpụkpọ mmanya” na-akọwa ihe ọdịnala oge ahụ n’enweghị iji okwu Bekee; usoro ahịrịokwu ahụ na-edobekwa ihe atụ na ịdọ aka ná ntị dị na Grik.
