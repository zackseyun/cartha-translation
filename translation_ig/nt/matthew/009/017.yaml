revisions:
- from: A naghịkwa awụnye mmanya e mere ọhụrụ n’ime akpa akpụkpọ mmanya ochie. Ọ bụrụ na e mee otú ahụ, akpa ndị ahụ ga-agbawa, mmanya ahụ awụfuo, akpa ndị ahụ alakwa n’iyi. Kama, a na-awụnye mmanya e mere ọhụrụ n’ime akpa akpụkpọ mmanya ndị dị ọhụrụ[a], e wee chekwaa ha abụọ.
  to: A naghịkwa awụnye mmanya a ka mere n’ime akpa mmanya e ji akpụkpọ anụ mee ochie. Ọ bụrụ na e mee otú ahụ, akpa ndị ahụ ga-agbawa, mmanya ahụ awụfuo, akpa ndị ahụ alakwa n’iyi. Kama, a na-awụnye mmanya a ka mere n’ime akpa mmanya e ji akpụkpọ anụ mee ọhụrụ[a], a na-echekwakwa ha abụọ.
  rationale: The revisions improve Standard Igbo idiom and clarify the generic formulation while retaining every element of the Greek text. They preserve the lexical distinction between νέος and καινός in both the translation and the footnote, without adding interpretive or doctrinal content.
  reviewer_model: gpt-5.6-terra
