source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: ig
  text: Ma mgbe a chụpụrụ ìgwè mmadụ ahụ n’èzí, ọ banyere n’ime wee jide ya n’aka, nwa agbọghọ ahụ wee bilie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a kpọlitere nwa agbọghọ ahụ.” Okwu Grik ahụ nwere ike ịpụta nke ọ bụla n’ime ụzọ abụọ a.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ma mgbe
  rationale: “Mgbe” na-egosi oge, ebe “ma” na-edobe njikọ dị nro nke δέ na mgbanwe akụkọ ahụ.
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: a chụpụsịrị igwe mmadụ ahụ n’èzí
  rationale: Usoro a na-edobe echiche passive nke aorist ma na-egosi na e mere ka igwe mmadụ ahụ pụọ, n’enweghị ihe ọ bụla na-egosi ịchụ mmụọ ọjọọ.
- source_word: εἰσελθὼν
  choice: ọ banyere n’ime
  rationale: Nke a na-enye participle a dị ka omume sochiri nke mbụ n’ụzọ Igbo na-asụkarị.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: jide ya n’aka
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị ndụ isi kwuo na ọ jidere aka nwa agbọghọ ahụ.
- source_word: τὸ κοράσιον
  choice: nwa agbọghọ ahụ
  rationale: Ọ na-egosi nwa nwanyị na-eto eto n’ụzọ doro anya ma kwekọọ n’okwu gbara ya gburugburu.
- source_word: ἠγέρθη
  choice: wee bilie
  rationale: “Bilie” bụ okwu Igbo eke nke nwere ike ịkọwa na nwa agbọghọ ahụ biliri, n’enweghị ịkpọpụta onye mere ka o bilie.
theological_decisions:
- issue: Otu e si sụgharị ἠγέρθη n’akụkọ ime ka nwa agbọghọ ahụ dịghachi ndụ
  choice: nwa agbọghọ ahụ wee bilie
  alternative: e mere ka nwa agbọghọ ahụ bilie
  rationale: Ụdị Grik ahụ bụ passive, ma a pụkwara iji okwu na-adịghị akpọpụta onye mere omume ahụ kọwaa nsonaazụ ya. Isiokwu a na-edobe esemokwu ahụ ma ghara ịgbakwunye nkọwa banyere onye mere ka o bilie.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere akara nkọwa ụkwụ [a] n’akụkụ “bilie,” ebe ọ metụtara ἠγέρθη, kama itinye ya n’akụkụ ịchụpụ igwe mmadụ.
