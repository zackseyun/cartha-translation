revisions:
- from: Ma mgbe a chụpụsịrị igwe mmadụ ahụ n’èzí, ọ banyere n’ime, jide ya n’aka, nwa agbọghọ ahụ wee bilie.[a]
  to: Ma mgbe a chụpụrụ ìgwè mmadụ ahụ n’èzí, ọ banyere n’ime wee jide ya n’aka, nwa agbọghọ ahụ wee bilie.[a]
  rationale: The revision corrects the Igbo verbal sequence while preserving the Greek narrative order and the source's restraint concerning agency in ἠγέρθη. The footnote remains anchored to “bilie” and presents the passive alternative without imposing a theological interpretation.
  reviewer_model: gpt-5.6-terra
