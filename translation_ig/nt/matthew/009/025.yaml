review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the crowd's removal, Jesus' entry, his taking the girl's hand, and the girl's rising. The passive nuance of ἠγέρθη is appropriately retained as an alternative in the footnote. However, the finite narrative sequence requires an explicit connective/verb before “jide.”
  naturalness: “Ọ banyere n’ime, jide ya n’aka” is not a natural, complete Standard Igbo narrative sequence, since “jide” here lacks the needed verbal framing. “Ọ banyere n’ime wee jide ya n’aka” is idiomatic and clear. “Ìgwè mmadụ” is the standard orthography.
  terminology: “Nwa agbọghọ” suitably renders κοράσιον, and “bilie” is a natural non-agent-specifying rendering in the main text. The footnote’s “a kpọlitere” supplies the passive alternative more directly and naturally than the causative construction “e mere ka ... bilie.”
  issues:
  - severity: medium
    issue: Incomplete verbal sequence in the central action
    rationale: The wording “ọ banyere n’ime, jide ya n’aka” leaves “jide” improperly unframed in this past narrative. Adding “wee” produces a grammatical sequential clause without changing meaning.
  - severity: low
    issue: Footnote's passive alternative is unnecessarily periphrastic
    rationale: “E mere ka nwa agbọghọ ahụ bilie” is understandable, but “a kpọlitere nwa agbọghọ ahụ” more directly expresses the passive alternative (“the girl was raised”).
  - severity: low
    issue: Standard orthography for ‘crowd’
    rationale: “Ìgwè mmadụ” is preferable to the unaccented initial form in a polished Standard Igbo text.
  revised_text: Ma mgbe a chụpụrụ ìgwè mmadụ ahụ n’èzí, ọ banyere n’ime wee jide ya n’aka, nwa agbọghọ ahụ wee bilie.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “a kpọlitere nwa agbọghọ ahụ.” Okwu Grik ahụ nwere ike ịpụta nke ọ bụla n’ime ụzọ abụọ a.
    reason: alternative_reading
  revision_rationale: The revision corrects the Igbo verbal sequence while preserving the Greek narrative order and the source's restraint concerning agency in ἠγέρθη. The footnote remains anchored to “bilie” and presents the passive alternative without imposing a theological interpretation.
