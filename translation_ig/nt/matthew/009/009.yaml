id: MAT.9.9
reference: Matthew 9:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: ig
  text: Ka Jizọs na-esi ebe ahụ agafe, ọ hụrụ otu nwoke a na-akpọ Matiu ka ọ nọ ọdụ n’ebe a na-anakọta ụtụ isi. Ọ sịrị ya,[a] “Soro m.” Matiu biliri[b] soro ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị, Grik ji ụdị oge ugbu a kwuo ya: “Ọ na-asị ya.” E ji ya eme ka akụkọ ahụ dị ndụ.'
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Matiu guzoro ọtọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων ... ἐκεῖθεν
  choice: Mgbe Jizọs si ebe ahụ na-agafe
  rationale: Nke a na-egosi omume na-aga n’ihu mgbe Jizọs na-esi n’ebe ahụ pụọ, ma na-ada nke ọma n’Igbo.
- source_word: ἄνθρωπον
  choice: otu nwoke
  rationale: N’ebe a, okwu ahụ na-ezo aka n’otu nwoke a kapịrị ọnụ.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: ka ọ nọ ọdụ n’ebe a na-anakọta ụtụ isi
  rationale: Nke a na-akọwa ebe Matiu nọ na-arụ ọrụ nnakọta ụtụ isi, n’ejighị okwu ga-eme ka ọ dị ka nnukwu ụlọ ọrụ ọgbara ọhụrụ.
- source_word: Μαθθαῖον λεγόμενον
  choice: a na-akpọ Matiu
  rationale: Ọ bụ ụzọ Igbo doro anya ma bụrụkwa nke nkịtị isi gosi aha e ji mara mmadụ.
- source_word: λέγει αὐτῷ
  choice: Ọ sịrị ya
  rationale: A gbanwere historical present Grik ka ọ bụrụ ụdị akụkọ gara aga nke na-ada nke ọma n’Igbo; ndetu ala na-echekwa ụdị okwu Grik ahụ.
- source_word: Ἀκολούθει μοι
  choice: Soro m
  rationale: Ọ bụ iwu dị mkpirikpi nke na-echekwa ma iso Jizọs n’ezie ma ọkpụkpọ ịbụ onye na-eso ụzọ ya, n’etinyeghị nkọwa ọzọ.
- source_word: ἀναστὰς
  choice: biliri
  rationale: Ọ na-egosi omume Matiu mere ozugbo tupu ya esoro Jizọs.
- source_word: ἠκολούθησεν αὐτῷ
  choice: soro ya
  rationale: Nke a na-echekwa omume ahụ kpọmkwem na ihe ọ pụtara banyere ịbụ onye na-eso ụzọ, n’enweghị ịkọwa ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Ụdị ọkpụkpọ Jizọs kpọrọ Matiu
  choice: Soro m
  alternative: Bịa bụrụ onye na-eso ụzọ m
  rationale: Grik kwuru iwu dị mfe. Nsụgharị ahụ ekwesịghị ịgbakwunye nkọwa nke ezi ihe okwu ahụ pụtara n’akụkọ ahụ na-egosilarị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù, dee ya. A kpọghachiri aha “Matiu” n’ahịrịokwu ikpeazụ iji mee ka onye mere omume ahụ doo anya n’Igbo, ebe Grik hapụrụ ya ka a ghọta ya site n’usoro okwu.
