    text: A pụkwara ịsị, “ákwà a na-akwọchabeghị.” Okwu Grik ahụ na-ekwu maka ákwà a na-edozichabeghị nke ọma; mgbe e mesịrị, ọ pụrụ ịbelata ma dọpụ n’uwe ochie ahụ.
    reason: lexical_alternative
  revision_rationale: The revision replaces an unclear expression for unprocessed cloth with idiomatic Standard Igbo, retains the source image and causal sequence, and uses habitual-present phrasing appropriate to the proverb. The note gives the technical alternative and explains the shrinkage implication without imposing it as a more specific main-text term.
