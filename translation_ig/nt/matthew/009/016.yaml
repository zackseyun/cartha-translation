id: MAT.9.16
reference: Matthew 9:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: ig
  text: Ma ọ dịghị onye na-etinye ibé ákwà a na-edozichabeghị[a] n’uwe ochie; n’ihi na ibé ákwà ahụ na-adọpụ n’uwe ahụ, ndọka ahụ na-adịkwu njọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ákwà a na-akwọchabeghị.” Okwu Grik ahụ na-ekwu maka ákwà a na-edozichabeghị nke ọma; mgbe e mesịrị, ọ pụrụ ịbelata ma dọpụ n’uwe ochie ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: ọ dịghị onye
  rationale: Na-egosipụta onye ọ bụla n’enweghị ịkọwa nwoke ma ọ bụ nwaanyị, ma bụrụkwa okwu Igbo nkịtị.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosipụta obere mgbanwe ma ọ bụ ntụnyere megide ihe bu ya ụzọ.
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: na-etinye ibé ákwà
  rationale: ἐπιβάλλει pụtara itinye ihe n’elu ihe ọzọ; ‘ibé ákwà’ na-eme ka ọrụ ἐπίβλημα dị ka ihe e ji ekpuchi ndọka doo anya n’Igbo, n’agbanyeghị na ngwaa ahụ ekwughị kpọmkwem ‘ịkwa.’
- source_word: ῥάκους ἀγνάφου
  choice: ibé ákwà a na-akpụchabeghị
  rationale: ἄγναφος na-akọwa ákwà a na-arụchabeghị ma ọ bụ a na-akpụchabeghị, nke mere na ọ ka pụrụ ịda mgbe e mesịrị; ntụgharị a na-edebe ma ọnọdụ nhazi ákwà ahụ ma isi ihe atụ ahụ.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: n’uwe ochie
  rationale: ‘Uwe’ bụ okwu sara mbara ma dị mfe maka ἱμάτιον; ‘ochie’ na-atụgharị παλαιῷ ozugbo.
- source_word: αἴρει
  choice: ga-adọpụ
  rationale: N’ọnọdụ a, ngwaa ahụ na-egosi na ibé ahụ na-adọpụ onwe ya n’uwe ahụ n’ihi esemokwu, n’emeghị ka usoro ahụ bụrụ ihe akọwapụtara karịa Grik.
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: ibé ahụ
  rationale: N'ụzọ nkịtị ọ bụ ‘ihe na-emeju ya,’ ma n’ihe atụ ịkwa uwe a ọ na-ezo aka n’ibé ákwà e tinyere iji kpuchie ndọka.
- source_word: χεῖρον σχίσμα γίνεται
  choice: ndọka ahụ adịkwuo njọ
  rationale: Na-echekwa echiche ntụnyere χεῖρον na nsonaazụ γίνεται n’ụzọ Igbo doro anya ma dị ndụ.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘ibé ákwà’ mee ka ihe e ji ekpuchi ndọka pụta ìhè, ebe e debere nkọwa teknụzụ nke ἄγναφος na amaokwu ukwu na nkọwa ala peeji.
