review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the contrast, patching image, separation from the old garment, and worsening tear. However, “ákwà a na-akpụchabeghị” does not naturally and reliably convey ἀγνάφου (“unfulled/unprocessed,” with the practical implication of later shrinkage).
  naturalness: The sentence structure and the terms “ibé ákwà,” “uwe ochie,” and “ndọka” are natural Standard Igbo. Replacing the less idiomatic textile expression improves clarity. Gnomic present forms better suit the proverbial present verbs in Greek.
  terminology: “Ákwà a na-edozichabeghị” is a clear, nontechnical way to retain the sense of cloth not yet properly processed. The footnote preserves the more specific explanation without making a disputed technical process the main-text translation.
  issues:
  - severity: medium
    issue: “a na-akpụchabeghị” is an unclear rendering of ἀγνάφου.
    rationale: The Greek denotes cloth not yet fulled/processed, conventionally understood as liable to shrink. The present Igbo expression is not a dependable modern textile description and may suggest something merely not formed or not cut.
  - severity: low
    issue: The generic action is expressed as future (“ga-adọpụ”) rather than proverb-like present.
    rationale: Greek αἴρει and γίνεται are present-tense statements of the usual result. Igbo present forms read more naturally in this maxim while preserving the meaning.
  revised_text: Ma ọ dịghị onye na-etinye ibé ákwà a na-edozichabeghị[a] n’uwe ochie; n’ihi na ibé ákwà ahụ na-adọpụ n’uwe ahụ, ndọka ahụ na-adịkwu njọ.
  revised_footnotes:
