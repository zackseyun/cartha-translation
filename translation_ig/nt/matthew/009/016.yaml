- from: Ma ọ dịghị onye na-etinye ibé ákwà a na-akpụchabeghị[a] n’uwe ochie; n’ihi na ibé ahụ ga-adọpụ n’uwe ahụ, ndọka ahụ adịkwuo njọ.
  to: Ma ọ dịghị onye na-etinye ibé ákwà a na-edozichabeghị[a] n’uwe ochie; n’ihi na ibé ákwà ahụ na-adọpụ n’uwe ahụ, ndọka ahụ na-adịkwu njọ.
  rationale: The revision replaces an unclear expression for unprocessed cloth with idiomatic Standard Igbo, retains the source image and causal sequence, and uses habitual-present phrasing appropriate to the proverb. The note gives the technical alternative and explains the shrinkage implication without imposing it as a more specific main-text term.
