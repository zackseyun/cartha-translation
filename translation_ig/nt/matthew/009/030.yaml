source:
  edition: SBLGNT
  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: ig
  text: Anya ha wee meghee. Jizọs wee dọọ ha aka ná ntị n’ike[a], sị[b], “Lezienụ anya ka onye ọ bụla ghara ịma.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nyere ha iwu siri ike” ma ọ bụ “dọọ ha aka ná ntị n’ike.” Ngwaa Grik ahụ na-egosi mmetụta siri ike na ike dị n’ịdọ aka ná ntị ahụ.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, okwu ahụ bụ n’ụzọ nkịtị, “Hụnụ ka onye ọ bụla ghara ịma.” Ihe a na-agaghị ama adịghị kpọmkwem n’ahịrịokwu ahụ; a na-aghọta ya site n’ihe gbasara ọgwụgwọ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν
  choice: wee meghee
  rationale: Nke a na-egosipụta ngwaa a dị n’ụdị nnata n’asụsụ Grik ma na-ekwupụta n’ụzọ Igbo si ada mma na e mere ka ha hụ ụzọ, n’etinyeghị onye mere ya n’ahịrịokwu ahụ.
- source_word: οἱ ὀφθαλμοί
  choice: Anya ha
  rationale: Nke a na-edobe nnọchiaha nke na-egosi na anya ndị ahụ bụ nke ha, ma bụrụkwa usoro okwu Igbo doro anya.
- source_word: ἐνεβριμήθη
  choice: jiri olu ike dọọ ha aka ná ntị
  rationale: Ngwaa Grik a na-egosi mmetụta siri ike na ịdọ aka ná ntị n’ike. Nhọrọ a na-ebupụta ike iwu ahụ n’Igbo n’agbanyeghị na ọ naghị akọwa ihe mere Jizọs ji nye ya.
- source_word: Ὁρᾶτε
  choice: Lezienụ anya
  rationale: N’ebe a, ngwaa iwu a bụ okwu ịkpachara anya nke na-ebute iwu ahụ; ‘Lezienụ anya’ bụ okwu Igbo dị ugbu a ma doo anya.
- source_word: μηδεὶς γινωσκέτω
  choice: ka onye ọ bụla ghara ịma
  rationale: Nke a na-egosipụta iwu mgbochi ahụ ma na-ahapụ ihe a na-agaghị ama ka ọ bụrụ ihe a ghọtara site n’ihe gbara amaokwu ahụ gburugburu, dịka Grik si mee.
- source_word: λέγων
  choice: sị
  rationale: ‘Sị’ jikọtara ịdọ aka ná ntị ahụ na kpọmkwem ihe Jizọs kwuru n’ụzọ Igbo na-asụkarị.
theological_decisions:
- issue: Ike iwu Jizọs nyere mgbe ọgwụgwọ ahụ gasịrị
  choice: Jizọs jiri olu ike dọọ ha aka ná ntị ka onye ọ bụla ghara ịma
  alternative: Jizọs baara ha mba; ma ọ bụ, Jizọs nyere ha iwu siri ike
  rationale: Amaokwu ahụ na-egosi iwu mgbochi siri ike, ma ọ kọwaghị ihe kpatara Jizọs ji chọọ ka a ghara ikwusa ihe ahụ. Nsụgharị a na-edobe ike na esemokwu dị n’okwu ahụ n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Jiri olu ike dọọ ha aka ná ntị’ na-egosipụta ịdị ike nke ἐνεβριμήθη n’enweghị ịtụkwasị ebumnuche Jizọs n’elu ihe odide ahụ. A hapụrụ ihe dị ka ihe mmeju nke ‘ịma’ n’ekwughị ya kpọmkwem, dịka isi mmalite Grik si mee.
