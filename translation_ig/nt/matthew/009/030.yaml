review_pass:
  verdict: revise
  source_fidelity: ‘Jiri olu ike’ introduces a specific manner of speaking (‘with a loud/forceful voice’) that is not stated by ἐνεβριμήθη. The Greek conveys Jesus’ forceful, stern charge, not necessarily vocal volume. ‘Dọrọ ha aka ná ntị n’ike’ retains the force without that addition. The prohibition is accurately represented and appropriately leaves its implicit object unstated.
  naturalness: The revised wording is idiomatic Standard Igbo, clear, and suitably dignified. ‘Lezienụ anya ka onye ọ bụla ghara ịma’ naturally communicates the cautionary imperative and prohibition.
  terminology: ‘Jizọs,’ ‘anya ha,’ and ‘ịdọ aka ná ntị’ are appropriate. The lexical note should not claim that the verb itself specifies a voice; its reference to strong feeling and forcefulness is appropriate.
  issues:
  - severity: medium
    issue: ‘jiri olu ike’ adds an unstated detail about Jesus’ voice.
    rationale: ἐνεβριμήθη denotes a stern, forceful warning/charge and strong feeling, but the source does not say that Jesus spoke loudly or used a forceful voice. The translation should preserve the warning’s intensity without specifying its vocal manner.
  revised_text: Anya ha wee meghee. Jizọs wee dọọ ha aka ná ntị n’ike[a], sị[b], “Lezienụ anya ka onye ọ bụla ghara ịma.”
