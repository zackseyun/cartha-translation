id: MAT.9.6
reference: Matthew 9:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: ig
  text: Ma ka unu wee mara na Nwa nke Mmadụ nwere ikike n’ụwa ịgbaghara mmehie”—mgbe ahụ, ọ sịrị onye ahụ kpọnwụrụ akpọnwụ, “Bilie, buru ihe ndina gị[a], laa n’ụlọ gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “akwa gị” ma ọ bụ “ute gị.” Okwu Grik κλίνη nwere ike ịpụta akwa, ihe e ji anọdụ ala, ma ọ bụ obere ute e ji edina.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Ma ka unu wee mara
  rationale: Nke a na-egosipụta ntụgharị dị nro nke δέ na ebumnuche nke ἵνα, ma na-ada ka Igbo nkịtị.
- source_word: ἐξουσίαν ἔχει
  choice: nwere ikike
  rationale: “Ikike” na-egosi ikike ziri ezi ime ihe, ọ bụghị nanị ike mmadụ nwere.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: A hapụrụ ya dị ka aha Jizọs ji akpọ onwe ya, ka njikọ ya na Daniel 7 ghara ịla n’iyi.
- source_word: ἐπὶ τῆς γῆς
  choice: n’elu ụwa
  rationale: Nke a na-egosipụta ebe ma ọ bụ mpaghara ikike ahụ dị dịka okwu Grik si dị.
- source_word: ἀφιέναι ἁμαρτίας
  choice: ịgbaghara mmehie
  rationale: N’ebe a ἀφίημι pụtara ịgbaghara ma ọ bụ ịhapụ mmehie.
- source_word: τότε λέγει
  choice: mgbe ahụ, ọ sịrị
  rationale: Ọ bụ ezie na Grik ji ụdị oge ugbu a mee akụkọ ahụ ka ọ dị ndụ, oge gara aga bụ ụzọ Igbo kacha eke si kọọ ihe a mere.
- source_word: τῷ παραλυτικῷ
  choice: onye ahụ akụkụ ahụ ya kpọnwụrụ akpọnwụ
  rationale: Nkọwa a bụ nke doro ndị na-agụ Igbo anya, ma ọ naghị atụkwasị nwoke n’ụzọ na-adịghị mkpa ebe ụdị okwu Grik n’onwe ya na-ezo aka n’onye ahụ.
- source_word: Ἐγερθεὶς
  choice: Bilie
  rationale: Participul Grik ahụ na-arụ ọrụ dịka iwu n’usoro okwu a.
- source_word: ἆρόν
  choice: chịrị
  rationale: Ọ na-egosi ibuli ihe ahụ ma buru ya pụọ.
- source_word: κλίνην
  choice: ihe ndina
  rationale: κλίνη nwere ike ịbụ akwa, ute, ma ọ bụ obere ihe e ji edina; “ihe ndina” na-edebe obosara ahụ.
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: laa n’ụlọ gị
  rationale: “Laa” bụ iwu Igbo eke maka ịga n’ebe mmadụ bi, ebe “ụlọ gị” na-anọchi οἶκόν σου nke ọma.
theological_decisions:
- issue: Aha Kraịst ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ Mmadụ
  rationale: Nhọrọ a na-echekwa aha ọdịnala Jizọs ji akpọ onwe ya na mgbagwoju njikọ ya na Daniel 7, kama ịkọwa ya n’ụzọ ga-emechi ihe ọ pụtara.
- issue: Ụdị ἐξουσία n’ịgbaghara mmehie
  choice: ikike
  alternative: ike
  rationale: Amaokwu ahụ na-ekwu maka ikike ziri ezi ịgbaghara mmehie, ọ bụghị nanị ume ma ọ bụ ikike ime ọrụ ebube.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara aha “Nwa nke Mmadụ,” ma jiri “ikike” mee ka ọdịiche dị n’etiti ikike ziri ezi na ike nkịtị doo anya.
