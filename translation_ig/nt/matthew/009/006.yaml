revisions:
- from: Ma ka unu wee mara na Nwa nke Mmadụ nwere ikike n’elu ụwa ịgbaghara mmehie”—mgbe ahụ, ọ sịrị onye ahụ akụkụ ahụ ya kpọnwụrụ akpọnwụ[a], “Bilie, chịrị ihe ndina gị[b], laa n’ụlọ gị.”
  to: Ma ka unu wee mara na Nwa nke Mmadụ nwere ikike n’ụwa ịgbaghara mmehie”—mgbe ahụ, ọ sịrị onye ahụ kpọnwụrụ akpọnwụ, “Bilie, buru ihe ndina gị[a], laa n’ụlọ gị.”
  rationale: The revision retains the source’s purpose-and-demonstration structure and its established Christological title, while replacing an awkward description of the paralytic and an unclear carrying command with natural Standard Igbo. The bedding footnote is retained and re-anchored; the redundant paraphrase footnote is removed.
