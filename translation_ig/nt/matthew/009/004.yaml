id: MAT.9.4
reference: Matthew 9:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: ig
  text: Jizọs, ebe ọ maara[a] echiche ha, sịrị, “Gịnị mere unu ji eche ihe ọjọọ n’obi unu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe ọ ghọtara echiche ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: matara
  rationale: Okwu a na-egosi na Jizọs maara echiche dị n’ime ha. “Matara” bụ okwu Igbo doro anya ma dị nkenke, ebe “ghọtara” ka edebere dị ka ụzọ ọzọ n’ala peeji.
- source_word: ἐνθυμήσεις
  choice: echiche
  rationale: Aha a na-ezo aka n’echiche ma ọ bụ ntụgharị uche dị n’ime mmadụ; “echiche” bụ okwu Igbo nkịtị nke na-adabara ebe a.
- source_word: Ἱνατί
  choice: Gịnị mere
  rationale: Ajụjụ a na-achọ ihe kpatara omume ahụ; “Gịnị mere” bụ ụzọ Igbo sitere n’okike isi jụọ ya.
- source_word: ἐνθυμεῖσθε
  choice: unu ji eche
  rationale: Ngwaa a na-egosi echiche na-aga n’ihu n’ime mmadụ. Usoro “Gịnị mere unu ji eche” na-ebute ajụjụ ahụ n’Igbo dị ugbu a ma doo anya.
- source_word: πονηρὰ
  choice: ihe ọjọọ
  rationale: Adjective neuter plural a na-arụ ọrụ dị ka aha, ya mere “ihe ọjọọ” na-egosipụta ihe a na-eche n’enweghị ịgbakwunye nkọwa karịrị isi mmalite.
- source_word: καρδίαις
  choice: n’obi
  rationale: “Obi” na-echekwa ihe atụ nke isi mmalite banyere ime mmadụ, ebe echiche na ebumnobi dị, kama ịbelata ya naanị ka ọ bụrụ uche.
theological_decisions:
- issue: Otú e si kọwaa na Jizọs maara echiche ha a na-ekwughị ekwu
  choice: Jizọs matara echiche ha
  alternative: Jizọs ghọtara echiche ha
  rationale: Nsụgharị ahụ na-edobe nkwupụta amaokwu ahụ na Jizọs maara echiche dị n’ime ha, ma ọ naghị agbasawanye ya ka ọ bụrụ nkọwa ozizi nke ederede ahụ ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ajụjụ ahụ bụ nke sitere n’okike n’Igbo, ebe “n’obi unu” na-echekwa ihe atụ na ịdị arọ nke okwu Grik.
