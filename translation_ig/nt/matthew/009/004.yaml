revisions:
- from: Jizọs matara[a] echiche ha, wee sị, “Gịnị mere unu ji eche ihe ọjọọ n’obi unu?”
  to: Jizọs, ebe ọ maara[a] echiche ha, sịrị, “Gịnị mere unu ji eche ihe ọjọọ n’obi unu?”
  rationale: The revision replaces “matara” with “maara” to express the source participle’s sense of knowing without suggesting that Jesus only then came to know their thoughts. The remaining wording faithfully and naturally preserves the Greek’s internal thoughts, evil, and hearts imagery. The footnote remains anchored to the expression for Jesus’ awareness and offers a permissible contextual alternative.
