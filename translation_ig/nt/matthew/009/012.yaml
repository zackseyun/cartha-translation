revisions:
- from: Ma mgbe ọ nụrụ nke a, ọ sịrị, “Ndị ahụ dị mma n’ahụ adịghị achọ dibịa; kama ọ bụ ndị ahụ na-arịa ọrịa ka ọ dị mkpa.”
  to: Ma mgbe ọ nụrụ nke a, ọ sịrị, “Ndị dị mma n’ahụ anaghị achọ dọkịta, ma ndị na-arịa ọrịa na-achọ dọkịta.”
  rationale: The revision restores the essential meaning of the final Greek clause by explicitly stating that sick people need a physician. It uses natural generic expressions and the unambiguous modern medical term “dọkịta,” while retaining the proverb’s literal medical imagery and making no added spiritual interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:32:13Z'
review_pass:
  verdict: revise
  source_fidelity: The temporal participle, mild adversative transition, and medical proverb are represented accurately in principle. However, the final clause, “ka ọ dị mkpa,” means roughly “are what is necessary/important” and does not express that the sick need a physician. It therefore fails to convey the predicate implied by the Greek contrast.
  naturalness: “Ndị ahụ dị mma n’ahụ” is understandable Standard Igbo, but “Ndị dị mma n’ahụ” is more natural for the Greek generic substantive participle. “Dọkịta” is the clearest contemporary Standard Igbo term in this medical context.
  terminology: Replace “dibịa” with “dọkịta.” Although dibịa can denote a healer, it can also evoke a traditional/divinatory practitioner; dọkịta unambiguously conveys ἰατρός, “physician,” without importing that ambiguity.
  issues:
  - severity: high
    issue: The second half omits the sick persons’ need for a physician.
    rationale: “kama ọ bụ ndị ahụ na-arịa ọrịa ka ọ dị mkpa” does not mean “but those who are sick [need one].” The Greek contrasts two groups in relation to their need for a physician; the Igbo must state that relationship.
  - severity: medium
    issue: “Dibịa” is potentially ambiguous in modern Igbo.
    rationale: In a straightforward medical proverb, “dọkịta” is more precise and avoids unintended associations with traditional healing or divination.
  revised_text: Ma mgbe ọ nụrụ nke a, ọ sịrị, “Ndị dị mma n’ahụ anaghị achọ dọkịta, ma ndị na-arịa ọrịa na-achọ dọkịta.”
  revised_footnotes: []
  revision_rationale: The revision restores the essential meaning of the final Greek clause by explicitly stating that sick people need a physician. It uses natural generic expressions and the unambiguous modern medical term “dọkịta,” while retaining the proverb’s literal medical imagery and making no added spiritual interpretation.
