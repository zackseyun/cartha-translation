id: MAT.9.12
reference: Matthew 9:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: ig
  text: Ma mgbe ọ nụrụ nke a, ọ sịrị, “Ndị dị mma n’ahụ anaghị achọ dọkịta, ma ndị na-arịa ọrịa na-achọ dọkịta.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: mgbe ọ nụrụ nke a
  rationale: Nkebi aorist a nwere ike igosi oge; “nke a” na-eweghachi ihe Jizọs nụrụ n'amaokwu bu ụzọ ma mee ka Igbo bụrụ nke eke.
- source_word: δὲ
  choice: Ma
  rationale: δέ na-egosi ntakịrị mgbagha ma ọ bụ ntụgharị n'okwu; “Ma” dabara na nzaghachi Jizọs nyere.
- source_word: εἶπεν
  choice: ọ sịrị
  rationale: Nke a bụ nsụgharị kwụ ọtọ ma bụrụkwa ụzọ Igbo eke si akọ okwu mmadụ kwuru, n'emeghị ya “ọ zara” ebe Grik ekwughị ya kpọmkwem.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: adịghị achọ
  rationale: Nke a na-ebute echiche nke enweghị mkpa n'Igbo doro anya ma dị mfe nghọta.
- source_word: οἱ ἰσχύοντες
  choice: ndị ahụ dị mma n’ahụ
  rationale: Ọ bụ ezie na ἰσχύω pụtara ịdị ike, ebe a ọdịiche ya na ndị na-arịa ọrịa na-egosi ahụ ike; okwu a na-echekwa ọdịiche ahụ n'ụzọ Igbo eke.
- source_word: ἰατροῦ
  choice: dibịa
  rationale: N'ebe a okwu ahụ bụ onye na-agwọ ọrịa; “dibịa” bụ okwu Igbo a na-aghọta nke ọma n'onyonyo ahụike a.
- source_word: οἱ κακῶς ἔχοντες
  choice: ndị ahụ na-arịa ọrịa
  rationale: Akpaokwu Grik a na-apụtakarị ndị ọrịa; nhọrọ a doro anya ma bụrụ nke Igbo ugbu a.
theological_decisions:
- issue: Ma ilu ahụ ọ bụ naanị banyere ọrịa anụ ahụ ka ọ bụ ihe atụ nke mkpa ime mmụọ
  choice: E debere okwu ahụ n'usoro ahụike nkịtị dịka Grik si kwuo ya.
  alternative: Ịkọwa ya ozugbo dịka ndị mmehie chọrọ ọgwụgwọ ime mmụọ.
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-enye ya nghọta ime mmụọ, ma okwu Grik n'onwe ya ji ihe atụ dibịa na ọrịa. Ịhapụ ya otu a na-echekwa ihe atụ ahụ na nrụgide nkà mmụta okpukpe n'enweghị ịkọwa ihe ederede ekwughị kpọmkwem.
translation_notes:
  register: Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-eji usoro okwu nkịtị; e zere okwu ụka pụrụ iche. “Dibịa” pụtara onye na-agwọ ọrịa n'ọnọdụ a, ọ bụghị ịkpọ ụdị onye na-agwọ ọrịa ọdịnala kpọmkwem.
