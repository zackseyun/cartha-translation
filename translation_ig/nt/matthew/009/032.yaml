  text: Αὐτῶν δὲ ἐξερχομένων ἰδοὺ προσήνεγκαν αὐτῷ ⸀ἄνθρωπον κωφὸν δαιμονιζόμενον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: ig
  text: Mgbe ha na-apụ[a], lee, a kpọtaara ya otu nwoke ogbi[b] nke mmụọ ọjọọ ji[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ka ha na-apụ.”
    reason: translation_alternative
  - marker: b
    text: Ma ọ bụ, “onye ntị chiri.” Okwu Grik ahụ nwere ike ịpụta onye ogbi ma ọ bụ onye ntị chiri; n'ebe a, amaokwu na-esote, nke kwuru na nwoke ahụ kwuru okwu, na-akwado “ogbi.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “nke nọ n'okpuru ike mmụọ ọjọọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: Mgbe ha na-apụ
  rationale: Nke a na-egosipụta oge ihe ahụ mere dịka genitive absolute si dị; mgbanwe akụkọ nke δέ na-egosi adịghị mkpa ka e jiri njikọ dị arọ kọwaa ya n'Igbo.
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” bụ ụzọ Igbo dị mkpirikpi ma dị ndụ isi dọta uche onye na-agụ dịka ἰδού si eme.
- source_word: προσήνεγκαν αὐτῷ
  choice: ndị mmadụ kpọtaara ya
  rationale: “Kpọtaara ya” na-egosi na a kpọtara nwoke ahụ bịakwute Jizọs ma na-edobe αὐτῷ. Isiokwu Grik akọwaghị ndị mere ya; “ndị mmadụ” bụ isiokwu Igbo na-enweghị ịkọwapụta ndị ha bụ.
- source_word: ἄνθρωπον
  choice: otu nwoke
  rationale: N'ọnọdụ a, “nwoke” na-egosipụta onye nwoke ahụ; “otu” na-eme ka ahịrịokwu ahụ bụrụ Igbo e ji eme ihe ma na-egosipụta onye a na-akọwaghị tupu mgbe ahụ.
- source_word: κωφὸν
  choice: ogbi
  rationale: Amaokwu na-esote kwuru na nwoke ahụ malitere ikwu okwu, ya mere “ogbi” dabara n'ọnọdụ a. E debere ihe ọzọ okwu Grik nwere ike ịpụta n'okpuru ala peeji.
- source_word: δαιμονιζόμενον
  choice: nke mmụọ ọjọọ ji
  rationale: Nke a bụ okwu Igbo doro anya maka onye nọ n'okpuru ike mmụọ ọjọọ, na-enweghị ịgbakwụnye nkọwa gbasara ụdị njide ahụ nke ederede ahụ na-ekwughị.
theological_decisions:
- issue: Otu e si asụ banyere nsogbu mmụọ ọjọọ
  choice: nke mmụọ ọjọọ ji
  alternative: nke nọ n'okpuru ike mmụọ ọjọọ
  rationale: Nhọrọ a na-ekwu n'ụzọ kwụ ọtọ na ihe ahụ metụtara mmụọ ọjọọ dịka δαιμονιζόμενον si kwuo, ma ọ naghị akọwa karịa ihe ederede ahụ kwuru.
- issue: Ihe κωφός pụtara n'ọnọdụ a
  choice: ogbi
  alternative: onye ntị chiri
  rationale: κωφός nwere ike ịpụta onye ogbi ma ọ bụ onye ntị chiri. N'ihi na amaokwu 33 lekwasịrị anya n'ikwu okwu ya, “ogbi” ka dabara ebe a, ebe nkọwa ala peeji na-echekwa nghọta nke ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Lee” na-echekwa ịdị ndụ nke akụkọ ahụ; “mmụọ ọjọọ ji” bụ okwu nkịtị ma doro anya, ebe nkọwa ala peeji na-echekwa nhọrọ ndị sitere na nghọta mkpụrụokwu Grik.
