  verdict: revise
  source_fidelity: The draft accurately represents the temporal genitive absolute, the attention marker ἰδού, κωφός in its contextually likely sense of inability to speak, and δαιμονιζόμενον. However, “ndị mmadụ” (‘people’) explicitly supplies an agent-group that the Greek leaves unidentified. The Greek has an unspecified third-person plural (‘they brought’), so the Igbo should likewise avoid identifying the agents.
  naturalness: “Mgbe ha na-apụ, lee, a kpọtaara ya otu nwoke ogbi nke mmụọ ọjọọ ji” is natural, clear Standard Igbo. The impersonal passive construction avoids an unclear antecedent for “ha” in the second clause while maintaining the source’s non-identification of those who brought the man.
  terminology: “Ogbi” is appropriate in light of verse 33, while the footnote properly preserves the possible ‘deaf’ sense of κωφός. “Nke mmụọ ọjọọ ji” is an idiomatic and suitably non-speculative rendering of δαιμονιζόμενον. “Lee” appropriately retains the narrative prominence of ἰδού.
  issues:
