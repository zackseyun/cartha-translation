revisions:
- from: Ọ nọ na-asị[a], “Pụọnụ, n’ihi na nwa agbọghọ ahụ anwụghị, kama ọ na-ehi ụra.” Ha wee na-achị ya ọchị.
  to: Ọ na-ekwu[a], “Pụọnụ, n’ihi na nwa agbọghọ ahụ anwụghị, kama ọ na-ehi ụra.” Ha na-achị ya ọchị.
  rationale: The revision replaces a non-idiomatic progressive construction with natural Standard Igbo while retaining the ongoing/repeated nuance signaled by the Greek imperfect. It also renders the crowd’s derisive response more directly. The literal ‘anwụghị, kama ọ na-ehi ụra’ is retained without resolving its narrative or theological ambiguity.
