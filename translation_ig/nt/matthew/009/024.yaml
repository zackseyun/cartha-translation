base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: ig
  text: Ọ na-ekwu[a], “Pụọnụ, n’ihi na nwa agbọghọ ahụ anwụghị, kama ọ na-ehi ụra.” Ha na-achị ya ọchị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ sịrị.” Oge imperfect nke ngwaa Grik nwere ike igosi na ọ nọ na-ekwu okwu ma ọ bụ na-ekwu ya ugboro ugboro; n’ọnọdụ a, a pụkwara iji oge gara aga dị mfe sụgharịa ya n’Igbo.
    reason: grammatical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ọ nọ na-asị
  rationale: Oge imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwu ugboro ugboro n’ọnọdụ ahụ; ‘Ọ nọ na-asị’ na-echekwa akụkụ a.
- source_word: Ἀναχωρεῖτε
  choice: Pụọnụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha si ebe ahụ pụọ; ‘Pụọnụ’ bụ Igbo nkịtị, doro anya, ma nwee ike iwu ahụ.
- source_word: οὐ γὰρ
  choice: n’ihi na ...ghị
  rationale: γάρ na-enye ihe kpatara iwu ahụ; ‘n’ihi na’ na-egosipụta njikọ ahụ n’Igbo n'ụzọ ebumpụta ụwa.
- source_word: ἀπέθανεν
  choice: anwụghị
  rationale: Aorist na-ele ọnwụ anya dịka ihe mere; ‘anwụghị’ na-echekwa nkwupụta ahụ n’enweghị ịgbakwunye nkọwa.
- source_word: τὸ κοράσιον
  choice: nwa agbọghọ ahụ
  rationale: κοράσιον pụtara nwa agbọghọ, ọtụtụ mgbe onye ka na-eto eto; nhọrọ a bụ Igbo doro anya ma ghara ịgbakwunye ịdị nta nke a na-ekwughị kpọmkwem n’amaokwu a.
- source_word: ἀλλὰ καθεύδει
  choice: kama ọ na-ehi ụra
  rationale: Present tense na-egosi ọnọdụ ma ọ bụ omume dị ugbu a; ‘ọ na-ehi ụra’ na-echekwa ihe oyiyi ụra na ọdịiche Jizọs kwuru.
- source_word: κατεγέλων αὐτοῦ
  choice: Ha wee na-achị ya ọchị
  rationale: Ngwaa ahụ nwere ike ịpụta ịchị mmadụ ọchị n’ụzọ ịkwa emo. Akụkụ ‘na-achị’ na-enyere aka igosipụta imperfect, ebe nkebi ahịrịokwu ahụ ka na-echekwa ihe oyiyi nke ịchị ọchị.
theological_decisions:
- issue: Okwu Jizọs na nwa agbọghọ ahụ ‘anwụghị, kama ọ na-ehi ụra’
  choice: E debere ‘ọ na-ehi ụra’ dịka o si dị, n’enweghị nkọwa ntụgharị uche agbakwunyere.
  alternative: Ịsụgharị ya dịka ‘ọ bụ naanị ụra ka ọ na-ehi,’ ma ọ bụ ịkọwa n’ahịrịokwu ahụ na ụra bụ ihe atụ nke ọnwụ.
  rationale: Isi mmalite ahụ na-ahapụ okwu Jizọs n’ụdị na-akpalite esemokwu n’akụkọ ahụ. Idebe ‘ụra’ na-echekwa ihe a na-edoghị anya—ma ọ bụ ihe atụ, nkọwa nke ọnọdụ ahụ, ma ọ bụ okwu na-ele anya n’ihe Jizọs ga-eme—kama idozi ya n’aha onye na-agụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘nwa agbọghọ’ na ‘na-ehi ụra’ zere okwu ochie ma chekwaa ihe oyiyi na esemokwu dị n’isi mmalite. Akara ndetu [a] dị n’ahịrịokwu bụ isi ma kwekọọ na ndetu ala peeji.
