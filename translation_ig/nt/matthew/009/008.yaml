id: MAT.9.8
reference: Matthew 9:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: ig
  text: Ma mgbe ìgwè mmadụ ahụ hụrụ nke a, egwu jidere ha[a], ha wee nye Chineke otuto, bụ́ onye nyere ụmụ mmadụ ikike dị otu a[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha jupụtara n’ịtụnanya na nsọpụrụ.” Okwu Grik ahụ pụtara n’ụzọ nkịtị na ụjọ tụrụ ha, ma ụjọ ahụ nwekwara ike ịgụnye ịtụnanya nke nsọpụrụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ndị mmadụ.” Okwu Grik ahụ na-ezo aka n’ụmụ mmadụ n’ozuzu ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: mgbe ... hụrụ nke a
  rationale: A sụgharịrị participle aorist ahụ dị ka nkebiokwu oge n’Igbo. “Nke a” na-ezo aka n’ihe ndị ahụ hụrụ n’amaokwu ndị bu ụzọ, na-agbakwụnyeghị nkọwa karịrị ihe dị na gburugburu okwu ahụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị n’akụkọ ahụ ma na-eduga n’otú ìgwè mmadụ si meghachi omume.
- source_word: οἱ ὄχλοι
  choice: ìgwè mmadụ ahụ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma dị ugbu a isi kwuo igwe mmadụ, n’agbanyeghị na aha Grik ahụ dị n’ụdị ọtụtụ.
- source_word: ἐφοβήθησαν
  choice: egwu jidere ha
  rationale: Akpaalaokwu Igbo a na-edobe isi ihe φοβέομαι pụtara, ya bụ ịtụ egwu, kama ịgbanwe ya ozugbo ka ọ bụrụ naanị ịtụnanya nke nsọpụrụ.
- source_word: ἐδόξασαν
  choice: nye Chineke otuto
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi kwupụta inye Chineke ebube ma ọ bụ otuto, ma na-edobe ịdị arọ nke okwu δοξάζω.
- source_word: τὸν θεὸν
  choice: Chineke
  rationale: Ọ bụ ihe e mere ihe n’ahịrịokwu ahụ, ma nke a bụ nsụgharị Igbo a na-anabata.
- source_word: τὸν δόντα
  choice: bụ́ onye nyere
  rationale: Articular participle ahụ na-akọwa Chineke; nkebiokwu njikọ a bụ ụzọ Igbo doro anya isi gosi ọrụ ya.
- source_word: ἐξουσίαν
  choice: ikike
  rationale: “Ikike” na-egosi ikike ma ọ bụ ikike e nyere mmadụ, ọ bụghị naanị ike anụ ahụ.
- source_word: τοιαύτην
  choice: dị otu a
  rationale: Ọ na-akọwa ụdị ikike ahụ n’ụzọ kwekọrọ na τοιαύτην.
- source_word: τοῖς ἀνθρώποις
  choice: ụmụ mmadụ
  rationale: ἄνθρωποι nwere ike izo aka n’ụmụ mmadụ n’ozuzu ha. “Ụmụ mmadụ” bụ okwu Igbo sitere n’okike nke na-adịghị etinye echiche na ọ bụ naanị ụmụ nwoke, nke okwu Grik ahụ achọghị ịmanye.
theological_decisions:
- issue: Ma a ga-eme ka mmeghachi omume ìgwè mmadụ dị nro site n’ịsụgharị ya naanị dị ka ịtụnanya nke nsọpụrụ
  choice: egwu jidere ha
  alternative: oke ịtụnanya na nsọpụrụ jupụtara ha
  rationale: φοβέομαι na-egosi ụjọ n’ụzọ doro anya. Ọ bụ ezie na nsọpụrụ na ịtụnanya nwere ike ịdị n’ime mmeghachi omume ahụ, isi ederede na-edobe esemokwu dị n’etiti ụjọ na nsọpụrụ.
- issue: Otú a ga-esi sụgharịa τοῖς ἀνθρώποις
  choice: ụmụ mmadụ
  alternative: ndị mmadụ
  rationale: Okwu Grik ahụ bụ masculine plural n’ụtọ asụsụ, ma ἄνθρωποι nwere ike ịnọchite anya ụmụ mmadụ niile. Igbo anaghị eji grammatical gender otu Grik si eji ya; ịsị “ụmụ nwoke” ga-etinye mmachi nwoke naanị nke isi okwu ahụ anaghị achọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Egwu jidere ha” bụ akpaalaokwu nkịtị nke na-edobe ike okwu Grik ahụ. “Nye Chineke otuto” na “ikike” na-enye ụda Akwụkwọ Nsọ n’enweghị iji okwu ochie ma ọ bụ okwu otu ụka pụrụ iche.
