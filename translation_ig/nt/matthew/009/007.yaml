  text: And he got up and went away to his house[a].
translation:
  language: ig
  text: O wee bilie, laa n'ụlọ ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “si ebe ahụ pụọ gaa n'ụlọ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: O wee
  rationale: Njikọ akụkọ a na-egosi na ihe a mere sochiri ihe gara aga n'ụzọ dị mfe; “wee” bụ ụzọ Igbo nkịtị si jikọta omume ndị na-esochi ibe ha.
- source_word: ἐγερθεὶς
  choice: bilie
  rationale: Ọ bụ participle aorist nke ἐγείρω e ji mee ihe n'echiche na onye ahụ biliri; “bilie” bụ ntụgharị Igbo doro anya ma dịkwa eke.
- source_word: ἀπῆλθεν
  choice: laa
  rationale: ἀπέρχομαι na-egosi isi n'ebe ahụ pụọ; “laa” na-ejikọta echiche ịpụ na ịga ebe obibi ya n'ụzọ Igbo na-adịkarị.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: n'ụlọ ya
  rationale: εἰς na οἶκος na-egosi ịga n'ebe obibi nke ya; “n'ụlọ ya” bụ okwu Igbo eke maka ịla n'ụlọ mmadụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị mfe, dị ugwu, ma kwekọọ n'usoro akụkọ. E debere akara nkọwa ala peeji [a] n'amaokwu ahụ.
