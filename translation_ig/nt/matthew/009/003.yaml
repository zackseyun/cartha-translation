id: MAT.9.3
reference: Matthew 9:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: ig
  text: Ma lee, ụfọdụ ndị odeakwụkwọ kwuru n’ime onwe ha,[a] “Nwoke a na-ekwulu Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kwuru n’etiti onwe ha.” Okwu Grik a nwere ike ịpụta okwu nzuzo ma ọ bụ okwu ha kwuru n’obi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ma
  rationale: Njikọ a na-aga n’ihu n’akụkọ ahụ; “Ma” dabara n’ebe a n’ihi mgbanwe gaa ná mmeghachi omume ndị odeakwụkwọ.
- source_word: ἰδού
  choice: lee
  rationale: Ọ na-edobe ike okwu ahụ nke na-adọta uche onye na-agụ ma na-eme ka akụkọ ahụ dị ndụ.
- source_word: τινες τῶν γραμματέων
  choice: ụfọdụ ndị odeakwụkwọ
  rationale: “Ụfọdụ” na-egosi ìgwè a na-akọwaghị ọnụ ọgụgụ ya; “ndị odeakwụkwọ” bụ aha a na-ejikarị akọwa ndị maara ma na-akụzi Iwu n’oge ahụ, na-enweghị ịgbasa nkọwa n’ime amaokwu.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: kwuru n’etiti onwe ha
  rationale: Nhọrọ a na-edobe ngwaa “kwuru” na ụdị ọtụtụ, ma ghara ikpebi kpamkpam ma okwu ahụ bụ mkparịta ụka nzuzo ka ọ bụ echiche dị n’obi.
- source_word: Οὗτος
  choice: Nwoke a
  rationale: Ọ bụ ụzọ Igbo doro anya isi zoo aka n’ebe Jizọs nọ, ma na-edobe ụda nkwutọ dị n’okwu ahụ n’enweghị ịgbakwunye mkparị.
- source_word: βλασφημεῖ
  choice: na-ekwulu Chineke
  rationale: N’ọnọdụ a, okwu Grik ahụ bụ ebubo ikwu okwu na-emebi nsọpụrụ Chineke; ịkpọ Chineke aha na-eme ka ihe okwu Igbo pụtara doo anya.
theological_decisions:
- issue: Otu e si sụgharịa ebubo ndị odeakwụkwọ boro Jizọs
  choice: Nwoke a na-ekwulu Chineke
  alternative: Nwoke a na-ekwu okwu nkwulu
  rationale: Nhọrọ ahụ na-edobe ebubo siri ike ha boro ya ma ghara ịkọwa ma ebubo ahụ ziri ezi; ya mere esemokwu nke akụkọ na nke nkà mmụta okpukpe ka dị.
- issue: Ma okwu ndị odeakwụkwọ bụ okwu ọnụ ka ọ bụ echiche n’obi
  choice: kwuru n’etiti onwe ha
  alternative: kwuru n’ime onwe ha
  rationale: Akụkụ Grik nwere ike izo aka n’okwu nzuzo ma ọ bụ mkparịta ụka dị n’obi. Isi ederede na ihe odide ala peeji na-edobe ohere abụọ ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E debere “lee” dị ka akara na-adọta uche; e jighị okwu ụka pụrụ iche ma ọ bụ nkọwa ozizi gbakwunyere.
