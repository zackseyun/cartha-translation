    issue: “n’etiti onwe ha” shifts the likely sense of ἐν ἑαυτοῖς.
    rationale: The Greek idiom presents what the scribes said internally/to themselves, whether as inward deliberation or private speech. “N’etiti onwe ha” normally means “among themselves” and more readily suggests a mutual conversation. The main text should preserve the inward/private sense; “n’etiti onwe ha” may be retained as an alternative in the note.
