  source_fidelity: The accusation is conveyed accurately as blasphemy against God, and “Nwoke a” appropriately retains the hostile demonstrative force. However, ἐν ἑαυτοῖς is more directly “within/to themselves” than “among themselves”; the latter can imply an audible exchange between members of the group.
  naturalness: The Igbo is clear and appropriately formal. “kwuru n’ime onwe ha” is natural Standard Igbo in this narrative context and better represents private or inward speech.
  terminology: “ndị odeakwụkwọ” is the established direct rendering for scribes in this setting. “na-ekwulu Chineke” naturally expresses the charge of blasphemy without deciding whether the charge is true.
  issues:
