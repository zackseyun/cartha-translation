  text: δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ἐκβάλῃ ἐργάτας εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: ig
  text: Ya mere, kpeenụ ekpere ike nye Onyenwe owuwe ihe ubi ka o zipụ ndị ọrụ n’owuwe ihe ubi ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka o chụpụ ndị ọrụ.” Ngwaa Grik ahụ siri ike karịa nanị “zipụ,” ma n’ebe a ọ na-ekwu maka iziga ndị ọrụ ka ha gaa n’owuwe ihe ubi.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: rịọsienụ ... ike
  rationale: Nke a na-egosi iwu e nyere ọtụtụ mmadụ ka ha jiri ịdị uchu na arịrịọ siri ike rịọ; ọ na-adabara okwu ekpere n’Igbo nke oge a.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’okwu bu ụzọ banyere nnukwu owuwe ihe ubi na ndị ọrụ dị ole na ole.
- source_word: κυρίου
  choice: Onyenwe
  rationale: Ọ na-echekwa echiche nke onye nwere ikike na onye nwe owuwe ihe ubi, n’akọwaghị kpọmkwem onye a na-ekwu maka ya.
- source_word: θερισμοῦ
  choice: owuwe ihe ubi
  rationale: Nke a bụ okwu Igbo doro anya maka ‘harvest,’ ma na-echekwa ihe atụ dị n’amaokwu ahụ.
- source_word: ὅπως
  choice: ka
  rationale: ‘Ka’ na-ewebata ihe a na-arịọ n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: ἐκβάλῃ
  choice: zipụ
  rationale: N’ebe a, ngwaa ahụ pụtara iziga ndị ọrụ gaa rụọ ọrụ, ọ bụ ezie na okwu Grik ahụ nwere ike ịpụta omume siri ike karịa iziga nkịtị.
- source_word: ἐργάτας
  choice: ndị ọrụ
  rationale: Ọ bụ okwu Igbo dị mfe ma doo anya maka ndị na-arụ ọrụ n’owuwe ihe ubi.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: n’owuwe ihe ubi ya
  rationale: Ọ na-echekwa owuwe ihe ubi dị ka ihe atụ na nnọchiaha nke na-egosi na owuwe ihe ubi ahụ bụ nke Onyenwe ya.
theological_decisions:
- issue: Onye a na-akpọ ‘Onyenwe owuwe ihe ubi’
  choice: A hapụrụ ya dịka ‘Onyenwe owuwe ihe ubi’ n’akọwaghị onye ọ bụ kpọmkwem.
  alternative: Ịkọwa ya dịka Nna, Jizọs, ma ọ bụ Chineke kpọmkwem.
  rationale: Amaokwu ahụ n’onwe ya akọwaghị onye a na-ekwu maka ya karịa aha ‘Onyenwe owuwe ihe ubi’; ya mere nsụgharị ahụ echekwala nghọta sara mbara na mgbagwoju anya nke ederede ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Iwu ahụ dị n’ụdị ọtụtụ mmadụ (‘rịọsienụ’), a hapụkwara ihe atụ nke owuwe ihe ubi dịka ọ dị n’ederede Grik.
