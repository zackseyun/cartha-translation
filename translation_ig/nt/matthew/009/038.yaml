    reason: lexical_alternative
  revision_rationale: The revision is limited to making the earnest-prayer imperative idiomatic in modern Standard Igbo. It does not identify the Lord of the harvest, alter the metaphor, or soften the Greek verb in the main text; the lexical force of ἐκβάλῃ remains documented in the footnote.
