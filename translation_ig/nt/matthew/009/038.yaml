review_pass:
  verdict: revise
  source_fidelity: The draft preserves the inferential οὖν, the plural imperative, the generic title ‘Lord of the harvest,’ the harvest metaphor, the possessive ‘his,’ and the contextual sense of ἐκβάλῃ. The footnote appropriately retains the stronger lexical alternative ‘drive out.’
  naturalness: ‘Rịọsienụ Onyenwe owuwe ihe ubi ike’ is understandable, but its placement of ‘ike’ after the object is less idiomatic and can momentarily sound as though the Lord is being treated as the direct object of a forceful request. ‘Kpeenụ ekpere ike nye…’ is clear, natural Standard Igbo and explicitly conveys earnest prayer.
  terminology: ‘Onyenwe owuwe ihe ubi,’ ‘owuwe ihe ubi,’ and ‘ndị ọrụ’ are suitable, dignified Standard Igbo renderings. The title remains deliberately unspecified, as required by the Greek.
  issues:
  - severity: low
    issue: The phrase ‘rịọsienụ Onyenwe owuwe ihe ubi ike’ is stylistically awkward in Standard Igbo.
    rationale: The source calls for urgent/earnest prayer, not merely a request. Recasting it as ‘Kpeenụ ekpere ike nye Onyenwe…’ gives a more natural prayer construction while retaining the urgency and plural command.
  revised_text: Ya mere, kpeenụ ekpere ike nye Onyenwe owuwe ihe ubi ka o zipụ ndị ọrụ n’owuwe ihe ubi ya[a].
  revised_footnotes:
