- from: Ya mere, rịọsienụ Onyenwe owuwe ihe ubi ike ka o zipụ ndị ọrụ n’owuwe ihe ubi ya[a].
  to: Ya mere, kpeenụ ekpere ike nye Onyenwe owuwe ihe ubi ka o zipụ ndị ọrụ n’owuwe ihe ubi ya[a].
  rationale: The revision is limited to making the earnest-prayer imperative idiomatic in modern Standard Igbo. It does not identify the Lord of the harvest, alter the metaphor, or soften the Greek verb in the main text; the lexical force of ἐκβάλῃ remains documented in the footnote.
  reviewer_model: gpt-5.6-terra
