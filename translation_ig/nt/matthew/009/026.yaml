  text: And this report went out into all that region[a].
translation:
  language: ig
  text: Akụkọ a wee gbasaa n’ógbè ahụ dum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ala ahụ dum” ma ọ bụ “n’mpaghara ahụ dum.” Okwu Grik bụ γῆ nwere ike ịpụta ala, ókèala, ma ọ bụ ógbè; n’ebe a, o yikarịrị ka ọ na-ezo aka n’ógbè gbara ebe ahụ gburugburu, ọ bụghị ụwa dum.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: wee
  rationale: N’akụkọ a, καί na-ejikọta ihe a na ihe mere tupu ya. “Wee” bụ ụzọ Igbo dị mfe ma dị ndụ isi mee ka akụkọ gaa n’ihu.
- source_word: ἐξῆλθεν
  choice: gbasaa
  rationale: Ọ bụ ezie na okwu Grik a pụtara n’ụzọ nkịtị ‘pụtara’ ma ọ bụ ‘pụ̀ọ,’ mgbe ọ na-ekwu maka akụkọ, ‘gbasaa’ na-enye nghọta ahụ n’Igbo n’enweghị mgbagwoju anya.
- source_word: ἡ φήμη αὕτη
  choice: Akụkọ a
  rationale: φήμη bụ akụkọ ma ọ bụ ozi na-eru ọtụtụ mmadụ; ‘akụkọ’ anaghị etinye echiche na ọ bụ asịrị ụgha. αὕτη gosipụtara kpọmkwem akụkọ banyere ihe ahụ mere.
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: n’ógbè ahụ dum
  rationale: N’ebe a γῆ na-ezo aka n’ala ma ọ bụ mpaghara gbara ebe ahụ gburugburu, ọ bụghị ụwa niile. ‘N’ógbè ahụ dum’ bụ Igbo nkịtị nke na-egosi oke mgbasa akụkọ ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe ma nwee ugwu. Ahọrọ ‘gbasaa’ kama ntụgharị nkịtị dịka ‘pụtara’ n’ihi na ọ bụ ụzọ ndị Igbo si ekwu maka akụkọ na-eru ebe niile; e debere nhọrọ γῆ n’okpuru nkọwa ala/ógbè n’ihe odide ala peeji.
