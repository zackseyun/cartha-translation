id: MAT.9.14
reference: Matthew 9:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: ig
  text: Mgbe ahụ ndị na-eso ụzọ Jọn bịakwutere ya, sị, “Gịnị mere anyị na ndị Farisii ji ebu ọnụ ọtụtụ mgbe[a], ma ndị na-eso ụzọ gị anaghị ebu ọnụ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “na-ebu ọnụ nke ukwuu” ma ọ bụ “na-ebu ọnụ ọtụtụ ugboro”; okwu Grik πολλά mgbe e jikọtara ya na “ibu ọnụ” na-egosi omume a na-eme ugboro ugboro.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi na ihe a mere n’usoro ihe ndị na-aga n’ihu; okwu a bụkwa ụzọ Igbo dị mfe ma kwekọọ n’asụsụ ugbu a.
- source_word: προσέρχονται αὐτῷ
  choice: bịakwutere ya
  rationale: Ọ na-egosi ịbịaru Jizọs nso ma ọ bụ ịbịa n’ebe ọ nọ, n’Igbo na-ada nke ọma.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: ndị na-eso ụzọ Jọn
  rationale: Nke a bụ ụzọ Igbo doro anya e si akọwa ndị na-amụ ihe n’aka Jọn ma na-eso ya.
- source_word: λέγοντες
  choice: sị
  rationale: Ọ na-egosipụta okwu ha kwuru n’otu usoro dị mkpụmkpụ ma bụrụ nke Igbo nkịtị.
- source_word: Διὰ τί
  choice: Gịnị mere
  rationale: Nke a bụ ajụjụ Igbo a na-ejikarị achọ ihe kpatara otu ihe.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: anyị na ndị Farisii
  rationale: Ọ na-edobe njikọ na ntụnyere dị n’etiti ndị na-ekwu okwu na ndị Farisii.
- source_word: νηστεύομεν
  choice: ji ebu ọnụ
  rationale: ‘Ibu ọnụ’ bụ okwu Igbo a na-eji maka ịghara iri nri dịka omume okpukpe.
- source_word: πολλά
  choice: ọtụtụ mgbe
  rationale: N’ebe a, πολλά na-arụ ọrụ dịka adverb ma na-egosi ugboro omume ahụ na-eme, ọ bụghị naanị ịdị ukwuu ya.
- source_word: οἱ δὲ μαθηταί σου
  choice: ma ndị na-eso ụzọ gị
  rationale: ‘Ma’ na-edobe ọdịiche δέ gosipụtara n’etiti omume ìgwè abụọ ahụ.
- source_word: οὐ νηστεύουσιν
  choice: anaghị ebu ọnụ
  rationale: Ụdị a na-egosi omume ha na-adịghị eme dịka usoro ha, kama ime ka ọ bụrụ naanị otu ihe mere n’otu oge.
theological_decisions:
- issue: Ụdị mkpesa banyere ibu ọnụ
  choice: E depụtara ajụjụ ahụ dịka ntụnyere omume okpukpe ha na-emekarị.
  alternative: Ịkọwa ya dịka ebubo na ndị na-eso ụzọ Jizọs na-emebi iwu, ma ọ bụ dịka naanị otu oge ibu ọnụ kpọmkwem.
  rationale: Ngwaa ndị dị n’oge ugbu a na πολλά na-egosi usoro omume a na-emekarị. Nsụgharị ahụ anaghị etinye ebubo ma ọ bụ nkọwa ozizi karịrị ihe ederede kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọdịiche dị n’etiti omume ndị otu abụọ ahụ n’enweghị ịgbakwunye ikpe ozizi. E tinyere akara nkọwa [a] n’akụkụ okwu ‘ọtụtụ mgbe,’ nke ọ na-akọwa.
