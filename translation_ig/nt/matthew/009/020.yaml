  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: ig
  text: Ma lee, otu nwanyị onye ọbara na-agba kemgbe afọ iri na abụọ bịakwute ya n’azụ metụ ọnụ uwe ya aka.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ụdọ dị n’ọnụ uwe” ma ọ bụ “ọnụ uwe.” Okwu Grik a nwere ike ịpụta ọnụ ma ọ bụ nsọtụ uwe, ma eleghị anya ụdọ e tinyere n’ọnụ uwe.
    reason: lexical_alternative
  - marker: b
    text: Lee Ọnụ Ọgụgụ 15:38 na Diuterọnọmi 22:12 maka ndabere iwu Izrel banyere ụdọ ndị e ji achọ ọnụ uwe mma.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Ma lee
  rationale: Na-edowe akara akụkọ nke na-adọta uche ma na-egosi ihe mberede n’ụzọ Igbo dị ndụ ma bụrụkwa nke a na-aghọta ngwa ngwa.
- source_word: γυνὴ
  choice: otu nwanyị
  rationale: Na-egosi nwanyị a na-akọwa na nke mbụ n’enweghị ịgbakwụnye nkọwa na-adịghị na Grik.
- source_word: αἱμορροοῦσα
  choice: nke ọbara na-agba
  rationale: Na-egosi ọnọdụ ọbara ọgbụgba na-aga n’ihu, n’asụsụ Igbo nkịtị, n’emeghị ka ọ dị ka naanị ihe mberede malitere ọhụrụ.
- source_word: δώδεκα ἔτη
  choice: kemgbe afọ iri na abụọ
  rationale: Ụzọ Igbo e ji egosi ogologo oge ọnọdụ ahụ nọgidere ruo n’oge ihe a mere.
- source_word: προσελθοῦσα ὄπισθεν
  choice: bịara n’azụ ya
  rationale: Na-edowe mmegharị nwanyị ahụ bịaruru Jizọs nso site n’azụ ya.
- source_word: ἥψατο
  choice: metụ ... aka
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa isi kwuo mmetụ, n’emeghị ka o doo anya na ọ jidere uwe ahụ ike.
- source_word: τοῦ κρασπέδου
  choice: ọnụ ọnụ
  rationale: Na-anọgide n’ogo sara mbara nke okwu Grik, nke nwere ike ịpụta akụkụ mpụta, ọnụ, ma ọ bụ ụdọ e tinyere n’ọnụ uwe.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: uwe ya
  rationale: ‘Uwe’ bụ okwu sara mbara nke na-adịghị amanye ụdị uwe elu pụrụ iche nke Grik ekwughị kpọmkwem.
theological_decisions:
- issue: Ma κράσπεδον na-ezo aka naanị n’ọnụ uwe ka ọ bụ ụdọ pụrụ iche e tinyere n’uwe ndị Juu
  choice: ọnụ ọnụ uwe ya
  alternative: ụdọ e tinyere n’ọnụ uwe ya
  rationale: Isiokwu ahụ ekwughị kpọmkwem ụdị ihe ahụ. Nhọrọ sara mbara na-echekwa mgbagwoju anya nke okwu Grik; nkọwa ala peeji na-egosi ihe ọzọ ọ pụrụ ịpụta na ndabere iwu Izrel.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “Ma lee” debe ike akara akụkọ ahụ; e zere okwu ahụike siri ike na nkọwa okpukpe karịrị ihe Grik kwuru.
