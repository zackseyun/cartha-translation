- from: Ma lee, otu nwanyị nke ọbara na-agba kemgbe afọ iri na abụọ bịara n’azụ ya metụ ọnụ ọnụ uwe ya aka.[a][b]
  to: Ma lee, otu nwanyị onye ọbara na-agba kemgbe afọ iri na abụọ bịakwute ya n’azụ metụ ọnụ uwe ya aka.[a][b]
  rationale: The revision resolves the directional ambiguity of the approach, replaces a repetitive garment expression with idiomatic Standard Igbo, and preserves the lexical ambiguity of κράσπεδον in both the text and notes. It does not add a diagnosis, ritual interpretation, or theological conclusion beyond the Greek text.
