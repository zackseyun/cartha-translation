    reason: cross_reference
  revision_rationale: The revision resolves the directional ambiguity of the approach, replaces a repetitive garment expression with idiomatic Standard Igbo, and preserves the lexical ambiguity of κράσπεδον in both the text and notes. It does not add a diagnosis, ritual interpretation, or theological conclusion beyond the Greek text.
