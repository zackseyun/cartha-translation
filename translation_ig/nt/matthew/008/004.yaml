id: MAT.8.4
reference: Matthew 8:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: ig
  text: Jizọs wee sị ya, “Lezie anya ka ị ghara ịgwa onye ọ bụla. Kama, gaa gosi onwe gị onye nchụàjà, chụọ onyinye ahụ Mosis nyere n’iwu[a], ka ọ bụrụ ihe akaebe nye ha[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ntụziaka a dabere n’usoro Iwu Mosis nyere maka onye e mere ka ọ dị ọcha pụọ n’ọrịa ekpenta; lee Levitikọs 14.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “maka ihe akaebe nye ha.” “Ha” nwere ike izo aka n’ụlọ ndị nchụàjà, ma odide Grik akọwaghị nke ọma ndị a na-ekwu maka ha; ụfọdụ na-aghọta ya dịka akaebe megide ndị na-ekweghị ekwe.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: Lezie anya ka ị ghara ịgwa onye ọ bụla
  rationale: Ὅρα na-arụ ọrụ dị ka ịdọ aka ná ntị ma ọ bụ iwu siri ike; njikọ ya na μηδενὶ εἴπῃς pụtara ka ọ ghara ịgwa onye ọbụla. Okwu Igbo a bụ ihe doro anya ma na-echekwa ike nke iwu ahụ.
- source_word: ὕπαγε
  choice: gaa
  rationale: Nke a bụ iwu dị mfe nke na-agwa mmadụ ka ọ pụọ gaa ebe ọzọ; “gaa” bụ okwu Igbo nkịtị kwekọrọ na ya.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: gosi onye nchụàjà onwe gị
  rationale: Nsụgharị a na-echekwa ahịrịokwu ntụgharị-onwe nke Grik, tinyere echiche nke igosi onwe ya ka onye nchụàjà nyochaa ya.
- source_word: τῷ ἱερεῖ
  choice: onye nchụàjà
  rationale: Artikul Grik na-ezo aka n’onye nchụàjà kwesịrị ilekọta usoro ahụ. N’Igbo, ihe gbara okwu ahụ gburugburu na-eme ka nkọwa a doo anya n’enweghị itinye okwu ọzọ.
- source_word: προσένεγκον τὸ δῶρον
  choice: nyekwa onyinye ahụ
  rationale: N’ọnọdụ ofufe a, προσένεγκον pụtara iweta ma nye ihe e nyere n’iwu. “Nye onyinye ahụ” bụ okwu Igbo sitere n’okike, ma “onyinye” na-echekwa isi ihe δῶρον pụtara.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: Mosis nyere n’iwu
  rationale: προστάσσω pụtara inye iwu ma ọ bụ ịtọ ihe a ga-eme. Okwu a na-echekwa ikike iwu Mosis n’enweghị ịgbakwunye nkọwa.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ka ọ bụrụ ihe akaebe nye ha
  rationale: “Ka ọ bụrụ” na-egosi nzube ma ọ bụ ihe ga-esi na ya pụta, ebe “ihe akaebe” na-echekwa ohere sara mbara nke μαρτύριον. “Ha” anaghị akọwapụta ndị nnọchiaha ahụ na-ezo aka na ha.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jizọs wee sị ya
  rationale: Ọ bụ ezie na λέγει bụ present tense e ji kọọ akụkọ, “wee sị” bụ ụzọ Igbo sitere n’okike isi gaa n’ihu n’akụkọ ma gosipụta ihe mere n’oge gara aga.
theological_decisions:
- issue: Ndị αὐτοῖς na-ezo aka na ha na ụdị akaebe ahụ
  choice: E debere ya dịka “ihe akaebe nye ha,” n’akọwaghị ndị “ha” bụ ma ọ bụ ma akaebe ahụ ọ dị mma ka ọ bụ nke ikpe.
  alternative: “ihe akaebe nye ndị nchụàjà” ma ọ bụ “ihe akaebe megide ha”
  rationale: Grik akọwaghị ndị αὐτοῖς na-ezo aka na ha, μαρτύριον kwa nwere ike ịbụ akaebe ma ọ bụ ihe e ji egosi eziokwu. Ịhapụ ya otú a na-echekwa nghọta dịgasị iche nke ihe odide ahụ kwere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, mee ihe. “Onye nchụàjà” na “ihe akaebe” bụ okwu ndị a maara nke ọma n’asụsụ ofufe na nke iwu. E zere ịkọwapụta ndị “ha” bụ ka mgbagwoju anya dị n’odide Grik nọgide.
