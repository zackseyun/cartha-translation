- from: Jizọs wee sị ya, “Lezie anya ka ị ghara ịgwa onye ọ bụla. Kama, gaa gosi onye nchụàjà onwe gị, nyekwa onyinye ahụ Mosis nyere n’iwu[a], ka ọ bụrụ ihe akaebe nye ha[b].”
  to: Jizọs wee sị ya, “Lezie anya ka ị ghara ịgwa onye ọ bụla. Kama, gaa gosi onwe gị onye nchụàjà, chụọ onyinye ahụ Mosis nyere n’iwu[a], ka ọ bụrụ ihe akaebe nye ha[b].”
  rationale: 'The revision corrects Igbo syntax, makes the commanded offering clearly cultic, and repairs the explanatory footnote while retaining every material ambiguity in the Greek: neither the identity of «ha» nor whether the testimony is favorable or adverse is resolved in the translated text.'
