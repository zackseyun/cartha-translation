review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition, the command to go to the priest, the Mosaic prescription, and the deliberately unspecified referent of αὐτοῖς. However, «gosi onye nchụàjà onwe gị» has an unnatural/possibly misparsed word order in Igbo, and «nyekwa onyinye ahụ» can sound like giving a gift rather than presenting the prescribed cultic offering.
  naturalness: «Gosi onwe gị onye nchụàjà» is the natural Standard Igbo order for ‘show yourself to the priest.’ «Chụọ onyinye ahụ» clearly expresses the required sacrificial presentation in this context. The revised note avoids claiming that the existing translation is merely an alternative translation.
  terminology: «onye nchụàjà», «onyinye», «Mosis», and «ihe akaebe» are suitable Standard Igbo terms. «Chụọ onyinye ahụ» retains δῶρον as ‘gift/offering’ while appropriately marking προσένεγκον as a cultic act. The phrase «ihe akaebe nye ha» preserves the ambiguity of εἰς μαρτύριον αὐτοῖς without making it ‘against them.’
  issues:
  - severity: medium
    issue: Word order in the command to appear before the priest
    rationale: «gosi onye nchụàjà onwe gị» is less idiomatic and may momentarily suggest that the priest is what is shown. «gosi onwe gị onye nchụàjà» clearly means ‘show yourself to the priest.’
  - severity: medium
    issue: Cultic force of προσένεγκον is underrepresented
    rationale: «nyekwa onyinye ahụ» may be read as ordinary gift-giving. In the Levitical setting, «chụọ onyinye ahụ» more clearly communicates presenting the prescribed offering without adding a specific sacrifice absent from the Greek.
  - severity: low
    issue: Footnote b labels the adopted wording as an alternative
    rationale: The note says the phrase ‘may also mean’ exactly what the main text already says. It should instead give the genuine formal alternative ‘maka ihe akaebe nye ha’ and retain the explanation of the open referent and possible force.
  revised_text: Jizọs wee sị ya, “Lezie anya ka ị ghara ịgwa onye ọ bụla. Kama, gaa gosi onwe gị onye nchụàjà, chụọ onyinye ahụ Mosis nyere n’iwu[a], ka ọ bụrụ ihe akaebe nye ha[b].”
  revised_footnotes:
  - marker: a
    text: Ntụziaka a dabere n’usoro Iwu Mosis nyere maka onye e mere ka ọ dị ọcha pụọ n’ọrịa ekpenta; lee Levitikọs 14.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “maka ihe akaebe nye ha.” “Ha” nwere ike izo aka n’ụlọ ndị nchụàjà, ma odide Grik akọwaghị nke ọma ndị a na-ekwu maka ha; ụfọdụ na-aghọta ya dịka akaebe megide ndị na-ekweghị ekwe.
    reason: alternative_reading
  revision_rationale: 'The revision corrects Igbo syntax, makes the commanded offering clearly cultic, and repairs the explanatory footnote while retaining every material ambiguity in the Greek: neither the identity of «ha» nor whether the testimony is favorable or adverse is resolved in the translated text.'
