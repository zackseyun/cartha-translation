id: MAT.8.16
reference: Matthew 8:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: ig
  text: Mgbe mgbede ruru, ha kpọtaara ya ọtụtụ ndị mmụọ ọjọọ ji[a]. O ji okwu chụpụ mmụọ ndị ahụ, gwọọkwa ndị niile na-arịa ọrịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọtụtụ ndị mmụọ ọjọọ na-emekpa.” Okwu Grik ahụ na-ekwu maka ndị nọ n'okpuru mmetụta ma ọ bụ ike ndị mmụọ ọjọọ; “ndị mmụọ ọjọọ ji” bụ ụzọ dị nkenke a na-ejikarị akọwa ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Mgbe chi jiri
  rationale: Nkebi a na-egosi oge ihe ahụ mere. “Mgbe chi jiri” bụ ụzọ Igbo nkịtị si ekwu ya nke ọma, ma ọ ka na-echekwa echiche nke mgbede bịara.
- source_word: προσήνεγκαν αὐτῷ
  choice: ha kpọtaara ya
  rationale: N'ebe a, προσφέρω pụtara ịkpọta ndị mmadụ bịakwute Jizọs. “Ha kpọtaara ya” bụ Igbo dị mfe ma doo anya.
- source_word: δαιμονιζομένους πολλούς
  choice: ọtụtụ ndị mmụọ ọjọọ ji[a]
  rationale: Partisịpụ Grik ahụ na-ekwu maka ndị nọ n'okpuru ike ma ọ bụ mmetụta ndị mmụọ ọjọọ. “Ndị mmụọ ọjọọ ji” bụ okwu Igbo dị nkenke ma a na-aghọta ya nke ọma; ihe odide ala peeji na-edebe ụzọ ọzọ e nwere ike isi ghọta obosara okwu ahụ.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: chụpụ mmụọ ndị ahụ
  rationale: ἐκβάλλω pụtara ịchụpụ. “Mmụọ ndị ahụ” na-ezo aka n'ụzọ doro anya ná mmụọ ọjọọ ndị a kpọtụrụ aha, ma na-echekwa ihe Grik kpọrọ kpọmkwem, ya bụ “mmụọ.”
- source_word: λόγῳ
  choice: O ji otu okwu
  rationale: Dative a na-egosi ihe e ji mee ihe. “O ji otu okwu” na-egosipụta na Jizọs ji naanị okwu chụpụ ha, n'etinyeghị “okwu ya,” nke na-adịghị n'okwu Grik kpọmkwem.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: ndị niile na-arịa ọrịa
  rationale: Akpaala okwu Grik κακῶς ἔχειν pụtara ịrịa ọrịa ma ọ bụ ịnọ n'ahụhụ ọrịa. Nsụgharị a bụ Igbo doro anya, kwekọọkwa n'ọnọdụ ọgwụgwọ dị n'amaokwu ahụ.
- source_word: ἐθεράπευσεν
  choice: gwọọkwa
  rationale: θεραπεύω n'akụkọ ọgwụgwọ ndị Oziọma pụtara ịgwọ ọrịa. Njikọ “-kwa” na-ejikọta ọgwụgwọ ahụ na nchụpụ mmụọ e kwuru tupu ya.
theological_decisions:
- issue: Ụdị ọnọdụ δαιμονιζομένους na τὰ πνεύματα na-akọwa
  choice: 'E gosiri ya dị ka mkpagbu mmụọ ọjọọ n''ezie: “ndị mmụọ ọjọọ ji” na “mmụọ ndị ahụ.”'
  alternative: “ndị mmụọ ọjọọ na-emekpa ahụ” ma ọ bụ ịkọwa ha naanị dị ka ndị nwere nsogbu uche
  rationale: Amaokwu ahụ kewapụtara ịchụpụ mmụọ na ịgwọ ndị ọrịa. Ya mere, nsụgharị ahụ na-echekwa ụdị abụọ ihe odide ahụ n'onwe ya kwuru, kama ịgbanwe okwu mmụọ ka ọ bụrụ naanị nkọwa gbasara ọrịa uche.
- issue: Ihe λόγῳ pụtara
  choice: 'A sụgharịrị ya n''ụdị ihe e ji mee ihe: “O ji otu okwu.”'
  alternative: “site n'okwu ya” ma ọ bụ “site n'ikwu okwu”
  rationale: Nhọrọ a na-eme ka ikike dị n'iwu Jizọs pụta ìhè n'etinyeghị nkọwa ozizi karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “Mgbe chi jiri” na “O ji otu okwu” maka ịdị n'okike n'Igbo, ebe a hapụrụ ọdịiche dị n'etiti ịchụpụ mmụọ na ịgwọ ọrịa ka ọ dị n'ihe odide Grik. E debere akara ihe odide ala peeji [a] ozugbo n'akụkụ okwu ọ na-akọwa, kama idowe ya n'akụkụ nkebi oge.
