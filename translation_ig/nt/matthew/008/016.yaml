revisions:
- from: Mgbe chi jiri, ha kpọtaara ya ọtụtụ ndị mmụọ ọjọọ ji[a]. O ji otu okwu chụpụ mmụọ ndị ahụ, gwọọkwa ndị niile na-arịa ọrịa.
  to: Mgbe mgbede ruru, ha kpọtaara ya ọtụtụ ndị mmụọ ọjọọ ji[a]. O ji okwu chụpụ mmụọ ndị ahụ, gwọọkwa ndị niile na-arịa ọrịa.
  rationale: 'The revision makes two small, safe improvements in Standard Igbo: it uses “Mgbe mgbede ruru” for the temporal genitive absolute, and “O ji okwu” for the instrumental λόγῳ, avoiding an unwarranted implication of precisely one word. It also smooths the lexical-alternative footnote while preserving the source text’s category of demonic affliction and the distinction from illness.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:31:52Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the temporal setting, the bringing of many afflicted people to Jesus, the distinction between expelling spirits and healing illness, and the universal scope of the healing. However, “otu okwu” can imply exactly one word, whereas λόγῳ is best represented in Igbo here without a numeral.
  naturalness: “Mgbe chi jiri” is understandable, but “Mgbe mgbede ruru” is a more direct, natural Standard Igbo equivalent for the arrival of evening. “O ji okwu” is idiomatic and avoids an unintended numerical nuance. The revised footnote wording is smoother and explicitly retains the people affected by the spirits.
  terminology: “ndị mmụọ ọjọọ ji” is a concise, natural rendering of δαιμονιζομένους and retains the narrative’s demonic category. “mmụọ ndị ahụ” appropriately renders τὰ πνεύματα in context without adding a doctrinal gloss. “na-arịa ọrịa” and “gwọọ” accurately render the illness/healing expressions.
  issues:
  - severity: low
    issue: “otu okwu” may suggest a single, countable word.
    rationale: The Greek instrumental λόγῳ means “with/by a word” or “by speech”; it emphasizes the means/authority but does not specify the number of words. “ji okwu” preserves this without narrowing it.
  - severity: low
    issue: “Mgbe chi jiri” can evoke dusk or darkness rather than simply the onset of evening.
    rationale: Ὀψίας δὲ γενομένης denotes evening having come. “Mgbe mgbede ruru” is closer and more neutral in Standard Igbo.
  - severity: low
    issue: The footnote alternative is syntactically incomplete and slightly unnatural.
    rationale: Adding “ndị” and using “mmụọ ọjọọ na-emekpa” produces a clear alternative referring to the persons concerned.
  revised_text: Mgbe mgbede ruru, ha kpọtaara ya ọtụtụ ndị mmụọ ọjọọ ji[a]. O ji okwu chụpụ mmụọ ndị ahụ, gwọọkwa ndị niile na-arịa ọrịa.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ọtụtụ ndị mmụọ ọjọọ na-emekpa.” Okwu Grik ahụ na-ekwu maka ndị nọ n'okpuru mmetụta ma ọ bụ ike ndị mmụọ ọjọọ; “ndị mmụọ ọjọọ ji” bụ ụzọ dị nkenke a na-ejikarị akọwa ya.
    reason: lexical_alternative
  revision_rationale: 'The revision makes two small, safe improvements in Standard Igbo: it uses “Mgbe mgbede ruru” for the temporal genitive absolute, and “O ji okwu” for the instrumental λόγῳ, avoiding an unwarranted implication of precisely one word. It also smooths the lexical-alternative footnote while preserving the source text’s category of demonic affliction and the distinction from illness.'
