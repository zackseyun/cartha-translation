  yaml_path: translation/nt/matthew/008/005.yaml
  text: When he entered Capernaum[a], a centurion came to him, pleading with him[b],
translation:
  language: ig
  text: Mgbe Jizọs banyere na Kapanọm, otu ọchịagha na-ahụ maka ndị agha narị bịakwutere ya, na-arịọsi ya ike[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-arịọ ya arịrịọ,” ma ọ bụ “na-arịọ ya nke ukwuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: Mgbe Jizọs banyere
  rationale: A tụgharịrị genitive absolute ahụ dị ka nkebiokwu oge. E tinyere aha Jizọs n’ọnọdụ nnọchiaha ahụ iji mee ka Igbo doo anya n’enweghị ịgbanwe onye a na-ekwu maka ya.
- source_word: εἰς Καφαρναοὺμ
  choice: na Kapanọm
  rationale: ‘Banye na Kapanọm’ bụ ụzọ Igbo si egosipụta ịbanye n’ebe; a sụgharịrị aha obodo ahụ dịka ụda ya si kwekọọ n’Igbo.
- source_word: προσῆλθεν αὐτῷ
  choice: bịakwutere ya
  rationale: Nke a na-egosipụta ma ‘ịbịakwute’ ma ‘ịgaru nso,’ ma kwekọọ n'ụzọ akụkọ Igbo si aga.
- source_word: ἑκατόνταρχος
  choice: otu ọchịagha na-achị ndị agha narị
  rationale: Nkọwa a na-edobe ihe ọkwa agha ahụ pụtara n’ụzọ onye Igbo nke oge a ga-aghọta, kama iji naanị okwu mbịarambịa na-edoghị anya.
- source_word: παρακαλῶν αὐτὸν
  choice: na-arịọsi ya arịrịọ ike
  rationale: Nke a na-egosipụta arịrịọ siri ike nke participle ahụ, ma ghara ikwu kpọmkwem na ọ na-akpọku ma ọ bụ na-arịọ ebere karịa ihe okwu Grik ahụ kwuru.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E jiri ‘ọchịagha na-achị ndị agha narị’ kọwaa ọkwa ἑκατόνταρχος n'ụzọ doro anya. Akara ntụaka [a] dị n’isiokwu ahụ ma na-edobe nhọrọ dị iche iche nke παρακαλέω.
