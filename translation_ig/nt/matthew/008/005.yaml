- from: Mgbe Jizọs banyere na Kapanọm, otu ọchịagha na-achị ndị agha narị bịakwutere ya, na-arịọsi ya arịrịọ ike[a],
  to: Mgbe Jizọs banyere na Kapanọm, otu ọchịagha na-ahụ maka ndị agha narị bịakwutere ya, na-arịọsi ya ike[a],
  rationale: The revision removes an awkward redundant request expression and uses a more idiomatic explanation of the centurion’s role. It preserves the Greek temporal sequence, the centurion’s approach, and the participial sense of earnest pleading. The footnote remains anchored to the rendering of παρακαλῶν αὐτόν and supplies natural lexical alternatives.
