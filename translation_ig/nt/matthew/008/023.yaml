id: MAT.8.23
reference: Matthew 8:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: ig
  text: Mgbe ọ banyere[b] n’ụgbọ mmiri[a], ndị na-eso ụzọ ya soro ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grik kwuru naanị “n’ụgbọ mmiri,” nke nwere ike ịpụta “n’otu ụgbọ mmiri” ma ọ bụ “n’ụgbọ mmiri ahụ,” dabere n’ihe gbara amaokwu ahụ gburugburu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “Ka ọ na-abanye,” ma ọ bụ, n’ụzọ na-egosi na o buru ụzọ banye, “Mgbe ọ banyesịrị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντι
  choice: Mgbe ọ banyere
  rationale: A tụgharịrị participle aorist ahụ ka ọ bụrụ nkebiokwu oge n’Igbo. Nke a na-egosi na ịbanye ya n’ụgbọ mmiri metụtara ihe ndị na-eso ụzọ ya mere, n’ebughị ụzọ kpebie nke ọma ma ihe nke abụọ mere ozugbo ọ na-abanye ma ọ bụ mgbe ọ banyesịrị.
- source_word: πλοῖον
  choice: ụgbọ mmiri
  rationale: N’ọnọdụ a, πλοῖον na-ezo aka n’ụgbọ e ji aga n’elu mmiri. “Ụgbọ mmiri” bụ okwu Igbo doro anya ma dịkwa mma maka ụgbọ dị n’Ọdọ Mmiri Galili; Igbo anaghị achọ ka e tinye okwu pụrụ iche maka “a” ma ọ bụ “the.”
- source_word: ἠκολούθησαν
  choice: soro
  rationale: “Soro” na-egosi iso Jizọs banye ma na-ahapụkwa nghọta sara mbara nke iso onye dịka onye na-eso ụzọ, n’agbasaghị ya ka ọ bụrụ nkọwa ozizi.
- source_word: μαθηταὶ
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị na-amụta ihe n’aka onye nkuzi ma na-eso ya; ọ dabara n’ọrụ μαθηταί n’Oziọma.
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: ọ / ya / ya
  rationale: N’ọnọdụ amaokwu a, nnọchiaha ndị a niile na-ezo aka na Jizọs. Nhazi Igbo chọrọ “ọ” dịka isiokwu nkebiokwu oge, ma jiri “ya” n’ebe ndị ọzọ.
theological_decisions:
- issue: Nghọta nke iso ụzọ dị n’okwu ἀκολουθέω
  choice: soro ya
  alternative: so ya banye; ghọọ ndị na-eso ụzọ ya
  rationale: Amaokwu ahụ na-akọ banyere mmegharị ahụ ha mere, ma okwu Grik ahụ nwekwara ike ịkpọlite echiche nke ịbụ onye na-eso ụzọ. “Soro ya” na-echekwa nghọta abụọ ahụ n’etinyeghị nkọwa ozizi karịrị ihe e dere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu, dee ya. Nhazi ahịrịokwu ahụ bụ nke nkịtị n’Igbo, ma e debere ma njikọ oge nke participle Grik ma nghọta abụọ nwere ike ịdị n’okwu “soro.”
