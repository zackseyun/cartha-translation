id: MAT.8.21
reference: Matthew 8:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: ig
  text: Mgbe ahụ, otu onye ọzọ n’ime ndị na-eso ụzọ ahụ sịrị ya, “Onyenwe anyị, kwe ka m[a] buru ụzọ pụọ gaa lie nna m[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nye m ohere” ma ọ bụ “hapụ m.”
    reason: lexical_alternative
  - marker: b
    text: Arịrịọ a nwere ike ịpụta ili nna ya ozugbo, ma ọ bụ, n’ụzọ sara mbara, ịnọgide na-arụ ọrụ dịịrị ya dịka nwa ruo mgbe nna ya ga-anwụ; asụsụ Grik akọwaghị nke ọ bụ.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος
  choice: otu onye ọzọ
  rationale: Nke a na-egosi onye ọzọ dị iche n’onye kwuru okwu na mbụ, n’ụzọ Igbo na-ada nke ọma.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N’ebe a, δέ bụ njikọ dị nro nke na-eme ka akụkọ gaa n’ihu; “Mgbe ahụ” anaghị etinye esemokwu siri ike n’okwu ahụ.
- source_word: τῶν μαθητῶν
  choice: n’ime ndị na-eso ụzọ ahụ
  rationale: Ọ na-akọwa na onye ahụ so n’ìgwè ndị na-eso ụzọ; okwu a bụ Igbo doro anya ma bụrụkwa nke a na-eji eme ihe ugbu a.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nkwanye ùgwù a na-ejikarị akpọ Jizọs n’Igbo, ma na-echekwa ibu okwu κύριος nwere ike inwe karịa ịsụgharị ya naanị dị ka onye nkụzi.
- source_word: ἐπίτρεψόν μοι
  choice: kwe ka m
  rationale: Ọ bụ arịrịọ maka ikike. “Kwe ka m” bụ Igbo ebumpụta ụwa nke na-echekwa nkwanye ùgwù dị n’arịrịọ ahụ.
- source_word: πρῶτον
  choice: buru ụzọ
  rationale: Ọ na-egosi ihe onye ahụ chọrọ ime tupu ihe ọzọ; “buru ụzọ” bụ ụzọ Igbo ziri ezi isi kwuo ya.
- source_word: ἀπελθεῖν
  choice: pụọ gaa
  rationale: Ọ na-echekwa echiche nke isi n’ebe ahụ pụọ ma gaa ebe ọzọ, kama ịsị naanị “gaa.”
- source_word: θάψαι
  choice: lie
  rationale: “Lie” bụ ngwaa Igbo kpọmkwem na nke nkịtị maka ili onye nwụrụ anwụ.
- source_word: τὸν πατέρα μου
  choice: nna m
  rationale: Nke a bụ nsụgharị kpọmkwem na nke doro anya nke nkebiokwu ahụ.
theological_decisions:
- issue: Ihe arịrịọ ili nna ya pụtara
  choice: E debere ya dịka arịrịọ ka e kwe ka ọ pụọ gaa lie nna ya, n’akọwaghị ma nna ya anwụọla ugbu a.
  alternative: Ọ pụrụ ịbụ na nna ya ka nwụrụ, ma ọ bụ na onye ahụ na-ekwu maka ịnọnyere nna ya ruo mgbe ọ ga-anwụ ma mezue ọrụ nwa kwesịrị ịrụ.
  rationale: Asụsụ Grik ekwughị kpọmkwem mgbe nna ahụ nwụrụ ma ọ bụ ga-anwụ. Ya mere, nsụgharị ahụ echekwala nghọta abụọ ahụ kama ikpebi otu n’ime ha.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ arịrịọ ahụ n’ụdị ya dị n’asụsụ Grik, n’etinyeghị nkọwa banyere ma nna ahụ anwụọla ma ọ bụ na ọ ka dị ndụ.
