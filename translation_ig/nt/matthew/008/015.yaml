revisions:
- from: O metụrụ ya aka n’aka, ahụ ọkụ ahụ wee hapụ ya. O biliri malite ijere ya ozi.[a]
  to: O metụrụ aka ya, ahụ ọkụ ahụ wee hapụ ya. Nwanyị ahụ biliri wee malite ijere ya ozi.[a]
  rationale: The revision replaces an unnatural literal expression with idiomatic Standard Igbo and makes the woman’s rising and serving syntactically clear. It retains the possible inceptive force of the Greek imperfect in the main text while preserving the ongoing-action alternative in the anchored footnote.
  reviewer_model: gpt-5.6-terra
