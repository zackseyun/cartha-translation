review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Greek sequence: Jesus touches her hand, the fever leaves her, she rises, and she serves him. The rendering of the imperfect διηκόνει as an inceptive action is possible in context and is appropriately qualified by the footnote. However, the wording for touching her hand and the transition to her rising need correction for idiomatic clarity.'
  naturalness: “metụrụ ya aka n’aka” is not natural Standard Igbo for “touched her hand”; “metụrụ aka ya” is the normal expression. “O biliri malite...” is also awkward and can momentarily leave the referent of “O” unclear. Explicitly identifying her as “Nwanyị ahụ” gives natural narrative clarity without altering the source meaning.
  terminology: “ahụ ọkụ” suitably renders πυρετός, and “ijere ya ozi” is an appropriate, non-sectarian rendering of διηκόνει αὐτῷ. The footnote accurately preserves the non-inceptive reading of the imperfect.
  issues:
  - severity: medium
    issue: Unidiomatic expression for touching her hand
    rationale: “metụrụ ya aka n’aka” is a literalized and awkward construction. “O metụrụ aka ya” naturally means “he touched her hand.”
  - severity: medium
    issue: Awkward and potentially unclear clause describing her response
    rationale: “O biliri malite ijere ya ozi” lacks the natural connective and its subject can be briefly ambiguous after the preceding subject is Jesus. “Nwanyị ahụ biliri wee malite...” is clear Standard Igbo.
  revised_text: O metụrụ aka ya, ahụ ọkụ ahụ wee hapụ ya. Nwanyị ahụ biliri wee malite ijere ya ozi.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “wee na-ejere ya ozi.” Ụdị ngwaa Grik a nwere ike nanị ịkọ omume na-aga n’ihu, ọ bụ ezie na ọ pụkwara igosi na ọ malitere ijere ya ozi.
    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural literal expression with idiomatic Standard Igbo and makes the woman’s rising and serving syntactically clear. It retains the possible inceptive force of the Greek imperfect in the main text while preserving the ongoing-action alternative in the anchored footnote.
