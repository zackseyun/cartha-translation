source:
  edition: SBLGNT
  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: ig
  text: O metụrụ aka ya, ahụ ọkụ ahụ wee hapụ ya. Nwanyị ahụ biliri wee malite ijere ya ozi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “wee na-ejere ya ozi.” Ụdị ngwaa Grik a nwere ike nanị ịkọ omume na-aga n’ihu, ọ bụ ezie na ọ pụkwara igosi na ọ malitere ijere ya ozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο τῆς χειρὸς αὐτῆς
  choice: metụrụ ya aka n’aka
  rationale: Nke a na-egosi imetụ aka n’ahụ́ n’ụzọ Igbo na-ada nke ọma, ma ọ naghị eme ka omume ahụ sie ike karịa ihe Grik kwuru.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: ahụ ọkụ ahụ wee hapụ ya
  rationale: Nke a bụ okwu Igbo doro anya maka ahụ ọkụ ịkwụsị, ma na-echekwa ụzọ Grik si mee ka ahụ ọkụ bụrụ ihe na-ahapụ mmadụ.
- source_word: πυρετός
  choice: ahụ ọkụ
  rationale: ‘Ahụ ọkụ’ bụ okwu Igbo a na-eji eme ihe kwa ụbọchị maka fever, n’enweghị mgbakwunye nkọwa na-adịghị na isi mmalite.
- source_word: ἠγέρθη
  choice: O biliri
  rationale: N’ebe a, okwu ahụ pụtara na nwanyị ahụ biliri mgbe ahụ́ dị ya mma; nsụgharị a anaghị etinye echiche mbilite n’ọnwụ n’akụkọ ahụ.
- source_word: διηκόνει αὐτῷ
  choice: malite ijere ya ozi
  rationale: διακονέω pụtara ijere mmadụ ozi. Imperfect ahụ nwere ike igosi omume na-aga n’ihu ma ọ bụ mmalite omume; isi nsụgharị na-egosipụta mmalite, ebe ndetu ala na-echekwa ihe ọzọ ọ pụrụ ịpụta.
theological_decisions:
- issue: ἠγέρθη nwere ike ịkpalite echiche banyere mbilite n’ọnwụ
  choice: O biliri
  alternative: E mere ka o bilie
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ekwu nanị na ọ biliri mgbe a gwọrọ ya; ya mere, ekwesịghị ịmanye echiche mbilite n’ọnwụ n’ebe a.
- issue: Ike imperfect dị na διηκόνει
  choice: malite ijere ya ozi
  alternative: na-ejere ya ozi / jere ya ozi
  rationale: Imperfect nwere ike igosi na omume ahụ malitere ma na-aga n’ihu, ma ọ pụkwara nanị ịkọ omume na-aga n’ihu. E debere nghọtahie a na ndetu ala kama imechi ya kpamkpam.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E jiri ‘ijere ya ozi’ kama okwu ụka pụrụ iche, ka ọnọdụ ije ozi n’ụlọ pụta ìhè n’enweghị itinye nkọwa okpukpe ọzọ.
