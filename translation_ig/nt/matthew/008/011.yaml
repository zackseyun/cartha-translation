id: MAT.8.11
reference: Matthew 8:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: ig
  text: Ma ana m agwa unu na ọtụtụ ndị ga-esi n’ọwụwa anyanwụ na ọdịda anyanwụ[b] bịa, soro Ebraham na Aịzik na Jekọb nọdụ ala n’oriri[a] n’alaeze eluigwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kpọmkwem, “ga-adabere n’oche oriri”; okwu Grik ahụ na-ezo aka n’ịnọ n’oche oriri dịka omenala iri oriri n’oge ahụ si dị.
    reason: cultural_note
  - marker: b
    text: “Site n’ọwụwa anyanwụ na ọdịda anyanwụ” nwere ike ịpụta ndị si ógbè ndị dị anya, ma eleghị anya gụnyekwa ndị na-abụghị ndị Izrel.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ma ana m agwa unu
  rationale: “Ana m agwa unu” na-egosipụta okwu Jizọs kwuru ozugbo, ebe “Ma” na-edobe ntakịrị ntụgharị ma ọ bụ ihe dị iche nke δέ na-egosi n’okwu ndị bu ya ụzọ.
- source_word: πολλοὶ
  choice: ọtụtụ ndị
  rationale: Okwu Grik a bụ adjective e ji mee noun; n’Igbo, “ọtụtụ ndị” bụ ụzọ doro anya ma bụrụkwa nke e ji asụ okwu kwa ụbọchị.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: ga-esi n’ọwụwa anyanwụ na ọdịda anyanwụ
  rationale: N’agbanyeghị na okwu Grik maka ọwụwa na ọdịda dị n’ụdị plural, ha bụ akpaalaokwu na-ezo aka n’akụkụ ụwa ma ọ bụ ógbè ndị ahụ. Nsụgharị a na-edobe ịdị obosara ya n’etinyeghị “ndị mba ọzọ” n’ahịrịokwu ahụ.
- source_word: ἥξουσιν
  choice: ga-… bịa
  rationale: Nke a na-enye ihe ἥκω pụtara n’ụzọ Igbo dị mfe ma kwekọọ n’echiche nke ndị mmadụ si ebe dị anya na-abịa.
- source_word: ἀνακλιθήσονται
  choice: ga-anọdụ ala rie nri
  rationale: Omume a bụ ịdabere ma ọ bụ ịnọdụ n’oche nri dịka omenala iri oriri n’oge ahụ si dị. Igbo a na-asụ ugbu a na-ekwu ya n’ụzọ a iji mee ka ihe oyiyi nke iso ndị ọzọ nọrọ n’oriri doo anya, ebe nkọwa ala peeji na-echekwa nkọwa omenala nke “ịdabere n’oche nri.”
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: ha na Ebraham na Aịzik na Jekọb
  rationale: μετά tinyere genitive na-egosi iso mmadụ nọkọọ; nhazi “ha na…” bụ Igbo ebumpụta ụwa nke na-egosipụta mkpakọrịta ha na ndị nna ochie ahụ n’oriri.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: n’alaeze eluigwe
  rationale: Nke a bụ okwu Matiu na-ejikarị eme ihe. “Alaeze eluigwe” bụ nsụgharị Igbo doro anya nke na-edobe “alaeze” n’otu ma ghara ịsụgharị plural Grik “eluigwe” n’ụzọ na-adịghị mma n’Igbo.
theological_decisions:
- issue: Ihe oyiyi oriri na mkpakọrịta nke alaeze ga-abịa
  choice: Edobere ihe oyiyi iri nri site n’okwu “ga-anọdụ ala rie nri.”
  alternative: “ga-anọdụ ala” naanị
  rationale: Okwu Grik ahụ na-ezo aka n’ịnọ n’oche oriri, ọ bụghị nanị ịnọ n’otu ebe. Nsụgharị a na-echekwa echiche nke iso ndị nna ochie nwee mkpakọrịta n’oriri n’etinyeghị nkọwa ozizi ọzọ.
- issue: Ndị “ọtụtụ” si n’ọwụwa anyanwụ na ọdịda anyanwụ bụ ndị
  choice: A sụgharịrị ya dịka ebe ha si bịa, n’akpọghị ha “ndị mba ọzọ” n’ahịrịokwu bụ isi.
  alternative: “ọtụtụ ndị mba ọzọ ga-esi n’ọwụwa anyanwụ na ọdịda anyanwụ bịa”
  rationale: Ọnọdụ okwu ahụ nwere ike igosi nsonye nke ndị na-abụghị ndị Izrel, ma ihe odide Grik kwuru naanị “ọtụtụ ndị.” Ya mere, nsụgharị ahụ na-ahapụ ihe ọ pụtara n’ụzọ yiri nke isi mmalite ma ghara idozi ihe a na-egosighị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. Nhazi ahịrịokwu ahụ bụ nke ebumpụta ụwa n’Igbo, ma a hapụrụ “ọtụtụ ndị” na ntụaka ebe ha si bịa n’ụdị sara mbara dịka ihe odide Grik si mee. E debere akara nkọwa ala peeji [a] na [b] n’ahịrịokwu bụ isi.
