id: MAT.8.10
reference: Matthew 8:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: ig
  text: Mgbe Jizọs nụrụ nke a, o juru ya anya; ọ gwara ndị na-eso ya, sị, “N’ezie, ana m agwa unu, ahụbeghị m onye ọ bụla n’Izrel nke nwere okwukwe dị ukwuu otú a.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: Mgbe Jizọs nụrụ nke a
  rationale: A tụgharịrị participle aorist ahụ ka ọ bụrụ nkebiokwu oge nke na-ada nke ọma n’Igbo. E tinyere “nke a” iji gosi na ọ bụ okwu onyeisi ndị agha ahụ kwuru tupu nke a ka Jizọs nụrụ.
- source_word: ἐθαύμασεν
  choice: o juru ya anya
  rationale: Nke a na-egosi oke ihe ijuanya dị n’okwu Grik ahụ n’asụsụ Igbo dị ugbu a, n’enweghị ịgbakwunye echiche na Jizọs amaghị ihe.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: ndị na-eso ya
  rationale: Ọ na-ezo aka kpọmkwem ná ndị na-eso Jizọs n’oge ahụ, ọ bụghị naanị n’òtù a na-akpọ ndị na-eso ụzọ ya.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: N’ezie, ana m agwa unu
  rationale: Nke a na-edobe nkwusi ike na ịdị nsọ nke usoro okwu ahụ ma na-adakwa nke ọma n’Igbo.
- source_word: παρ’ οὐδενὶ
  choice: n’ebe onye ọ bụla nọ
  rationale: παρά tinyere dative na-egosi na a chọtaghị okwukwe dị otú ahụ n’ahụ onye ọ bụla ma ọ bụ n’ihe gbasara onye ọ bụla.
- source_word: τοσαύτην πίστιν
  choice: okwukwe dị ukwuu otú a
  rationale: “Okwukwe” bụ ntụgharị kwesịrị ekwesị nke πίστις n’ebe a, ebe “dị ukwuu otú a” na-eme ka ogo nke τοσαύτην pụta ìhè.
- source_word: ἐν τῷ Ἰσραήλ
  choice: n’Izrel
  rationale: 'Nke a na-edobe nghọta locative na corporate nke okwu Grik ahụ: n’etiti ndị Izrel.'
- source_word: εὗρον
  choice: ahụbeghị m
  rationale: Ụdị perfect Igbo a na-egosi nchọpụta Jizọs ruo n’oge ọ na-ekwu okwu ahụ, ma na-ada nke ọma karịa ntụgharị aorist siri ike.
theological_decisions:
- issue: Ntụgharị πίστις
  choice: okwukwe
  alternative: ntụkwasị obi
  rationale: N’ebe a, okwu ahụ na-ekwu maka ntụkwasị obi onyeisi ndị agha ahụ nwere n’ikike na ọchịchị Jizọs. “Okwukwe” na-edobe okwu nkà mmụta okpukpe ahụ n’enweghị imechi nghọta nke ntụkwasị obi dị n’ime ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu na-aga were were n’Igbo, ma e debeghị ihe ọ bụla ga-egosi echiche pụrụ iche nke otu ụka.
