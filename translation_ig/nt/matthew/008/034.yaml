id: MAT.8.34
reference: Matthew 8:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: ig
  text: Ma, lee, obodo ahụ dum pụrụ izute Jizọs; mgbe ha hụrụ ya, ha rịọrọ ya nnọọ ka o si n’ógbè ha pụọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: Ọ na-edobe ọrụ okwu a dị ka ihe na-adọta uche ma na-eme ka akụkọ ahụ pụta ìhè n’ụzọ dị ndụ.
- source_word: πᾶσα ἡ πόλις
  choice: obodo ahụ dum
  rationale: Nke a bụ ụzọ Igbo si ekwu maka ndị obodo ahụ n’ozuzu ha, na-enweghị ikwusi ike na onye ọ bụla n’otu n’otu bịara.
- source_word: ἐξῆλθεν
  choice: pụrụ
  rationale: Ọ na-egosi na ndị obodo ahụ si n’obodo pụta gaa izute Jizọs.
- source_word: εἰς ὑπάντησιν
  choice: izute
  rationale: Ọ bụ okwu Igbo doro anya ma bụrụkwa nke e ji eme ihe kwa ụbọchị maka ịpụ gaa hụ onye na-abịa.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: A gbasoro nsụpe aha a nke a na-ejikarị eme ihe n’Igbo Izugbe.
- source_word: ἰδόντες αὐτὸν
  choice: Mgbe ha hụrụ ya
  rationale: Ọ na-egosipụta njikọ oge na usoro ihe ndị mere nke participle a na-enye.
- source_word: παρεκάλεσαν
  choice: rịọrọ ya arịrịọ
  rationale: Ọ na-egosi arịrịọ siri ike karịa nanị ịrịọ mmadụ ihe n’ụzọ nkịtị.
- source_word: ὅπως μεταβῇ
  choice: ka o ... pụọ
  rationale: Ọ na-enye ọdịnaya arịrịọ ha n’Igbo dị nro ma doo anya.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: si n’ógbè ha
  rationale: Ὅρια nwere ike ịpụta ókèala n'ụzọ nkịtị, ma n'ebe a ọ na-ezo aka n'ala ma ọ bụ mpaghara ndị ahụ.
theological_decisions:
- issue: Ihe mere ndị obodo ahụ ji rịọ Jizọs ka ọ pụọ
  choice: A hapụrụ ihe kpatara arịrịọ ha n’ekwughị ya.
  alternative: Egwu ike Jizọs; iwe maka ezi ndị lara n’iyi; ma ọ bụ ụjọ n’ihi ihe ahụ mere.
  rationale: Ihe odide Grik na-akọ naanị ihe ha mere, ọ naghị akọwa ebumnobi ha; ya mere, nsụgharị ahụ anaghị etinye nkọwa nke aka ya.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere “Ma lee” iji chekwaa ike ἰδού dị ka akara akụkọ na-adọta uche; a họọrọ “ógbè” maka echiche ala ma ọ bụ mpaghara dị na ὅρια.
