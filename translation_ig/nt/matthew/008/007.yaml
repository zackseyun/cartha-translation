  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: ig
  text: O wee sị ya[a], “M ga-abịa gwọọ ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “M̀ ga-abịa gwọọ ya?” Ụfọdụ ndị na-akọwa Akwụkwọ Nsọ na-ewere okwu Jizọs dịka ajụjụ n’ihi ọnọdụ akụkọ ahụ, ma okwu Grik ahụ n’onwe ya na-adị mfe ịgụ dịka nkwupụta.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: O wee
  rationale: Ọ bụ njikọ akụkọ dị mfe; “wee” na-eme ka usoro akụkọ ahụ bụrụ nke Igbo nkịtị n’etinyeghị ihe ọzọ na-adịghị na Grik.
- source_word: λέγει
  choice: sị
  rationale: Ọ bụ historical present n’asụsụ Grik. N’akụkọ Igbo, “sị” bụ ụzọ ebumpụta ụwa isi kọọ okwu ahụ, ebe idobe ụdị oge ugbu a n’ụzọ siri ike ga-ada ụda na-adịghị mma.
- source_word: αὐτῷ
  choice: ya
  rationale: Dative a bụ onye a gwara okwu; “ya” na-egosipụta nke a n'ụzọ doro anya dịka ọnọdụ ahụ si dị.
- source_word: Ἐγὼ
  choice: M
  rationale: Nnọchiaha ahụ pụtara ìhè na Grik ma nwee ntakịrị nkwusi ike; “M” na-edobe onye na-ekwu n’enweghị ịgbakwunye nkwusi ike karịrị isi mmalite.
- source_word: ἐλθὼν
  choice: ga-abịa
  rationale: Aorist participle a na-eso future verb ma na-egosi ihe ga-ebu ụzọ mee ma ọ bụ omume na-eso ibe ya; “ga-abịa” na-enye usoro ahụ n’Igbo dị mma.
- source_word: θεραπεύσω
  choice: gwọọ
  rationale: N’ọnọdụ ọrịa a, θεραπεύω pụtara ịgwọ onye ọrịa; “gwọọ” bụ okwu Igbo nkịtị ma doo anya.
- source_word: αὐτόν
  choice: ya
  rationale: Accusative a na-ezo aka n’ohu ahụ na-arịa ọrịa; “ya” bụ ntụgharị ebumpụta ụwa n’Igbo.
theological_decisions:
- issue: Ma a ga-asụgharị okwu Jizọs dịka nkwupụta ka ọ bụ ajụjụ
  choice: 'Nkwupụta: “M ga-abịa gwọọ ya.”'
  alternative: 'Ajụjụ: “M̀ ga-abịa gwọọ ya?”'
  rationale: Grik ahụ enweghị mkpụrụokwu ajụjụ, a na-agụkwa nhazi okwu ya n'ụzọ ebumpụta ụwa dịka nkwupụta. Ma ebe ụfọdụ na-ewere ya dịka ajụjụ n’ihi ọnọdụ akụkọ ahụ, e debere nke ahụ n’okpuru peeji kama ịmanye ya n’ahịrị isi.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro “O wee sị ya” mee ka njikọ akụkọ ahụ daa ụda nke ọma; e zere okwu ụka pụrụ iche na nkọwa ozizi agbakwunyere.
