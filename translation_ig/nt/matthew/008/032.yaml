  to: Ọ sịrị ha, “Gaanụ.” Ha we pụọ banye n’ime ezi ndị ahụ. Lee, ìgwè ezi ahụ dum gbara ọsọ gbadaa ná mkpọda ahụ[a] banye n’oké osimiri, wee nwụọ n’ime mmiri[b].
  rationale: The revision makes limited idiomatic corrections only. It strengthens the rendering of the herd’s headlong rush, smooths the sequential action of the spirits’ exit and entry, and improves footnote phrasing. It retains the source’s ambiguity concerning the precise mechanism of death and preserves the footnote anchors.
