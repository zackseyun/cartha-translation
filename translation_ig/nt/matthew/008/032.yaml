  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: ig
  text: Ọ sịrị ha, “Gaanụ.” Ha we pụọ banye n’ime ezi ndị ahụ. Lee, ìgwè ezi ahụ dum gbara ọsọ gbadaa ná mkpọda ahụ[a] banye n’oké osimiri, wee nwụọ n’ime mmiri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “gbadaa n’ọnụ ugwu ahụ.” Okwu Grik ahụ nwere ike ịpụta mkpọda dị ukwuu, akụkụ ala dị elu gbadara agbada, ma ọ bụ ọnụ ugwu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “mmiri wee rie ha.” N’ụzọ nkịtị, Grik ahụ kwuru, “ha nwụrụ n’ime mmiri.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Gaanụ
  rationale: Okwu iwu a dị mkpirikpi ma kwụ ọtọ, dị ka okwu Grik ahụ; ọ naghị atụkwasị nkọwa ọzọ.
- source_word: ἐξελθόντες
  choice: Ha wee pụta
  rationale: Nke a na-egosi na ha si n’ime ndị mmụọ ọjọọ ji pụta, ma na-asụ ya n’ụzọ akụkọ Igbo si aga nke ọma.
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: banye n’ime ezi ndị ahụ
  rationale: Nke a na-egosi mmegharị ndị mmụọ ahụ banye n’ime anụmanụ ndị ahụ n’ụzọ doro anya.
- source_word: ἰδοὺ
  choice: Lee
  rationale: “Lee” na-adọta uche onye na-agụ ya n’ihe mberede na-esote, ma na-echekwa ike okwu ngosi ahụ.
- source_word: πᾶσα ἡ ἀγέλη
  choice: ìgwè ezi ahụ dum
  rationale: “Dum” na-echekwa echiche nke ìgwè ahụ niile, ebe “ìgwè ezi” bụ okwu Igbo doro anya maka herd.
- source_word: ὥρμησεν
  choice: jiri ọsọ gbadaa
  rationale: Nkebi a na-egosi mmegharị mberede nke siri ike, n’ebughị ụzọ kọwaa ihe kpatara ya karịa ihe ederede kwuru.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: ná mkpọda ahụ
  rationale: “Mkpọda” nwere ike ịgụnye ebe gbadara agbada nke ukwuu ma ọ bụ ọnụ ugwu, ya mere ọ na-echekwa obosara okwu Grik ahụ.
- source_word: θάλασσαν
  choice: oké osimiri
  rationale: Nke a na-asụgharị θάλασσα dị ka “sea,” kama ịgbanwe ya ka ọ bụrụ ọdọ mmiri n’ihi ihe ọmụma ala.
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: nwụọ n’ime mmiri
  rationale: Nke a na-agbaso kpọmkwem ihe Grik kwuru, ya bụ na ha nwụrụ n’ime mmiri, kama ịkọwa kpọmkwem na mmiri riri ha.
theological_decisions:
- issue: Ogo nkọwa gbasara otú ìgwè ezi ahụ si nwụọ
  choice: wee nwụọ n’ime mmiri
  alternative: mmiri wee rie ha
  rationale: Akụkọ ahụ na-eme ka o doo anya na mmiri nwere ike ịbụ ihe gburu ha, ma ngwaa Grik ahụ pụtara nanị “nwụrụ.” Nsụgharị bụ isi anaghị agbakwụnye nkọwa ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma dị ugwu. Ahịrịokwu ahụ na-echekwa mkpụmkpụ nke iwu Jizọs, ike okwu “Lee,” na enweghị nkọwa kpọmkwem banyere otú ezi ndị ahụ si nwụọ.
