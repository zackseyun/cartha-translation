id: MAT.8.28
reference: Matthew 8:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: ig
  text: Mgbe ọ bịarutere n'akụkụ nke ọzọ, n'ógbè ndị Gadara[a], ndị ikom abụọ ndị mmụọ ọjọọ ji, ndị si n'ili pụta, zutere ya. Ha dị oke egwu[b], nke mere na ọ dịghị onye nwere ike isi n'okporo ụzọ ahụ gafee[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide ochie nwere “ndị Gergesa” ma ọ bụ “ndị Gerasa” kama “ndị Gadara.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “Ha siri nnọọ ike imeso.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ịgabiga n'okporo ụzọ ahụ.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Mgbe ọ bịarutere
  rationale: A tụgharịrị genitive absolute ahụ dị ka ahịrịokwu oge, nke na-ada nke ọma n'Igbo ma na-egosi usoro ihe omume ahụ.
- source_word: τὸ πέραν
  choice: n'akụkụ nke ọzọ
  rationale: N'ọnọdụ a, okwu ahụ na-ezo aka n'akụkụ nke ọzọ nke ọdọ mmiri ahụ; nke a bụ ntụgharị Igbo doro anya ma dị ebumpụta ụwa.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: n'ókèala ndị Gadara
  rationale: χώρα bụ mpaghara ma ọ bụ ókèala. E debere aha ndị ebe ahụ dịka ọgụgụ SBLGNT si dị.
- source_word: δύο δαιμονιζόμενοι
  choice: ndị ikom abụọ mmụọ ọjọọ ji
  rationale: Nke a bụ ụzọ Igbo dị mkpirikpi ma doo anya isi kwuo na ndị mmụọ ọjọọ nọ n'ike n'ahụ ndị ikom ahụ, n'etinyeghị nkọwa ọzọ Gris ahụ na-ekwughị.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: si n'ili pụta
  rationale: μνημεῖα n'ebe a bụ ebe e liri ndị nwụrụ anwụ; ‘ili’ bụ okwu Igbo nkịtị, doro anya.
- source_word: χαλεποὶ λίαν
  choice: Ha dị oke egwu
  rationale: χαλεπός nwere ike ịpụta ndị dị egwu, ndị siri ike imeso, ma ọ bụ ndị dị ize ndụ. ‘Dị oke egwu’ na-echekwa obosara ihe ọ pụtara ma λίαν na-eme ka ọ sie ike.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης
  choice: nke mere na ọ dịghị onye pụrụ isi n'okporo ụzọ ahụ gafee
  rationale: ὥστε na-egosi ihe si na ọnọdụ ahụ pụta, ἰσχύειν bụ inwe ike, διὰ τῆς ὁδοῦ pedigosi ụzọ njem. Ahịrịokwu Igbo a na-ejikọta ha n'ụzọ doro anya.
theological_decisions:
- issue: Okwu gbasara ndị mmụọ ọjọọ na-achị mmadụ
  choice: ndị ikom abụọ mmụọ ọjọọ ji
  alternative: ndị ikom abụọ nọ n'okpuru ike ndị mmụọ ọjọọ
  rationale: Nhọrọ a na-ekwupụta ọchịchị ndị mmụọ ọjọọ n'ụzọ ndị na-agụ Igbo ga-aghọta, ma ọ naghị etinye ozizi pụrụ iche banyere kpọmkwem otú ọnọdụ ahụ si arụ ọrụ.
- issue: Ọdịiche aha ebe dị n'ihe odide ochie
  choice: ndị Gadara
  alternative: ndị Gergesa; ndị Gerasa
  rationale: Isi ederede na-agbaso Γαδαρηνῶν nke SBLGNT; e tinyere ọgụgụ ndị ọzọ n'okpuru peeji ka a ghara izochi ọdịiche ihe odide ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E kewara ahịrịokwu Gris ahụ ụzọ abụọ ka ọ na-aga nke ọma n'Igbo, ma e chekwara njikọ nke ndị ikom ahụ si n'ili pụta na ihe mere ndị mmadụ enweghị ike iji ụzọ ahụ.
