revisions:
- from: Mgbe ọ bịarutere n'akụkụ nke ọzọ, n'ókèala ndị Gadara[a], ndị ikom abụọ mmụọ ọjọọ ji si n'ili pụta zute ya. Ha dị oke egwu[b], nke mere na ọ dịghị onye pụrụ isi n'okporo ụzọ ahụ gafee[c].
  to: Mgbe ọ bịarutere n'akụkụ nke ọzọ, n'ógbè ndị Gadara[a], ndị ikom abụọ ndị mmụọ ọjọọ ji, ndị si n'ili pụta, zutere ya. Ha dị oke egwu[b], nke mere na ọ dịghị onye nwere ike isi n'okporo ụzọ ahụ gafee[c].
  rationale: The revision makes only safe grammatical and idiomatic improvements. It retains the SBLGNT reading Γαδαρηνῶν in the text, preserves the manuscript alternatives in a footnote, and does not narrow χαλεποὶ λίαν beyond the broad sense ‘extremely fierce/dangerous.’
