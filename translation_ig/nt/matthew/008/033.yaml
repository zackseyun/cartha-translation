review_pass:
  verdict: revise
  source_fidelity: A chọrọ mmezi iji chekwaa obosara nke καὶ τὰ τῶν δαιμονιζομένων. Okwu bụ “ihe mere ... ji” na-eme ka okwu Grik ahụ bụrụ kpọmkwem ihe omume mere, ebe Grik ahụ na-ekwu n’obosara banyere ihe ndị metụtara ha. “Nakọta/tinyere” nwekwara ike ime ka καὶ dị ka nkọwa mgbakwunye karịa njikọ “na.”
  naturalness: Nsụgharị a gbanwetụrụ bụ Standard Igbo eke ma doo usoro ihe omume ahụ anya. “Mgbe ha banyere n’obodo ahụ” na-arụ ọrụ nke ọma maka participle ἀπελθόντες, ebe “ha kọọrọ ndị obodo” na-eme ka ngwaa ahụ bụrụ Igbo zuru oke n’enweghị mgbanwe bara uru n’ihe a na-ekwu.
  terminology: “Ụmụ nwoke ndị mmụọ ọjọọ ji” na-egosi δαιμονιζομένων n’ụzọ doro anya ma kwekọọ na ndị nwoke abụọ dị n’akụkụ okwu a. A naghị etinye nkọwa ozizi karịrị nke ederede. “Ihe ndị metụtara” na-echekwa enweghị nkọwa kpọmkwem dị na τὰ τῶν.
  issues:
  - severity: medium
    issue: “tinyere ihe mere ụmụ nwoke ndị mmụọ ọjọọ ji” na-akọwa okwu Grik ahụ karịa ka o kwesịrị.
    rationale: τὰ τῶν δαιμονιζομένων pụtara n’obosara “ihe ndị metụtara ndị mmụọ ọjọọ ji,” ọ bụghị naanị “ihe mere” ha. Nsụgharị ahụ kwesịrị ịhapụ obosara a.
  - severity: low
    issue: “tinyere” adịghị egosipụta njikọ καὶ nke ọma dịka “na/nakwa.”
    rationale: καὶ na-ejikọta “ihe niile” na “ihe ndị metụtara...” Dị ka “nakwa” ọ na-echekwa njikọ ahụ n’enweghị ime ka nkebi nke abụọ bụrụ naanị ihe atụ nke ihe niile.
