source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: ig
  text: Ma ndị na-azụ ezi ahụ gbara ọsọ; mgbe ha banyere n’obodo ahụ, ha kọọrọ ndị obodo ihe niile, nakwa ihe ndị metụtara ụmụ nwoke ndị mmụọ ọjọọ ji[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ dị nso karị n’okwu Grik: “na ihe ndị metụtara ụmụ nwoke ndị mmụọ ọjọọ ji.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: Ma ndị na-azụ ezi ahụ
  rationale: βόσκοντες bụ ‘ndị na-azụ ma ọ bụ na-elekọta anụ ụlọ.’ E tinyere ‘ezi’ site n’ihe gbara amaokwu a gburugburu iji mee ka ntụaka ahụ doo anya n’Igbo; δέ ghọrọ ‘Ma’ dịka njikọ akụkọ.
- source_word: ἔφυγον
  choice: gbara ọsọ
  rationale: Nke a na-egosi na ha gbapụrụ n’egwu ma ọ bụ n’ihi ihe merenụ; ‘gbara ọsọ’ bụ ụzọ Igbo dị ndụ ma bụrụ nke a na-aghọta ngwa ngwa.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: Ha wee banye n’obodo ahụ
  rationale: A sụgharịrị participle a dịka omume sochiri nke mbụ n’usoro akụkọ. ‘Banye n’obodo ahụ’ na-echekwa ntụgharị εἰς τὴν πόλιν.
- source_word: ἀπήγγειλαν πάντα
  choice: kọọrọ ndị obodo ihe niile
  rationale: ἀπαγγέλλω pụtara ịkọ ma ọ bụ ịgwa mmadụ akụkọ. E tinyere ‘ndị obodo’ dịka ndị a na-agwa akụkọ, nke ọnọdụ ahụ na-egosi, ka ahịrịokwu ahụ bụrụ Igbo eke.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: tinyere ihe mere ụmụ nwoke ndị mmụọ ọjọọ ji
  rationale: Nkebiokwu Grik ahụ pụtara n’ụzọ sara mbara ‘na ihe ndị metụtara ndị mmụọ ọjọọ ji.’ Nsụgharị bụ isi na-egosi ihe omume metụtara ha n’ụzọ Igbo dị mfe, ebe nkọwa ala peeji na-edebe ọdịdị sara mbara nke Grik.
- source_word: δαιμονιζομένων
  choice: ụmụ nwoke ndị mmụọ ọjọọ ji
  rationale: ‘Ndị mmụọ ọjọọ ji’ bụ okwu Igbo doro anya maka ndị nọ n’okpuru ike mmụọ ọjọọ, n’enweghị ịgbakwunye nkọwa ozizi nke okwu Grik na-ekwughị. ‘Ụmụ nwoke’ kwekọrọ n’ọnụọgụ ọtụtụ na ndị nwoke abụọ a kpọtụrụ aha n’akụkụ a.
theological_decisions:
- issue: Otu e si akọwa δαιμονιζομένων n’enweghị ịgbakwunye nkọwa ozizi pụrụ iche
  choice: ụmụ nwoke ndị mmụọ ọjọọ ji
  alternative: ụmụ nwoke ndị mmụọ ọjọọ na-emekpa ahụ
  rationale: Nhọrọ bụ isi na-egosi n’ezie na ha nọ n’okpuru ike mmụọ ọjọọ dịka akụkọ ahụ si kwuo, ma ọ naghị akọwapụta usoro ma ọ bụ ogo ọnọdụ ahụ karịa ihe ederede kwuru.
- issue: Ihe τὰ τῶν δαιμονιζομένων na-ezo aka na ya
  choice: ihe mere ụmụ nwoke ndị mmụọ ọjọọ ji
  alternative: ihe ndị metụtara ụmụ nwoke ndị mmụọ ọjọọ ji
  rationale: Grik ahụ hapụrụ ụdị ‘ihe’ ndị ahụ n’ọtụtụ nghọta. Nsụgharị bụ isi bụ Igbo eke dabere n’ọnọdụ akụkọ, ma nkọwa ala peeji na-echekwa nsụgharị sara mbara na nke dị nso n’okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara okwu ahụ ụzọ ahịrịokwu abụọ ka usoro ihe omume doo anya, ma e chekwara ọsọ akụkọ ahụ site n’okwu ‘wee.’
