id: MAT.8.14
reference: Matthew 8:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: ig
  text: Mgbe Jizọs batara n'ụlọ Pita, ọ hụrụ nne nwunye Pita ka ọ dina[a], ahụ ọkụ na-atụkwa ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘ka ọ dina n'àkwà n'ihi ọrịa.’ N'ụzọ nkịtị, okwu Grik ahụ na-ekwu na ‘a tọgbọrọ ya’ ma ọ bụ na ọ ‘dina,’ nakwa na ahụ ọkụ na-atụ ya; a ghọtara ‘n'àkwà’ site n'ọnọdụ akụkọ ahụ, ma e kwughị ya kpọmkwem.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘ọ nọkwa na-ata ahụhụ n'ihi ahụ ọkụ.’
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλθὼν
  choice: Mgbe Jizọs batara
  rationale: Aorist participle ahụ na-egosi oge ma ọ bụ usoro ihe mere; ‘mgbe ... batara’ bụ Igbo doro anya nke na-edobe nghọta ahụ.
- source_word: οἰκίαν Πέτρου
  choice: n'ụlọ Pita
  rationale: Nke a na-egosi n'ụzọ nkịtị na ụlọ ahụ bụ nke Pita, ma ‘ụlọ’ kwekọrọ nke ọma na οἰκία.
- source_word: πενθερὰν αὐτοῦ
  choice: nne nwunye Pita
  rationale: πενθερά pụtara nne di ma ọ bụ nne nwunye; n'ebe a, onye nnọchiaha ahụ na-ezo aka na Pita. Ikwughachi ‘Pita’ na-ewepụ mgbagwoju anya banyere onye ‘ya’ ga-ezo aka na ya.
- source_word: βεβλημένην
  choice: ka o dina
  rationale: Perfect passive participle a na-akọ ọnọdụ onye e dinara ma ọ bụ onye dina; ‘ka o dina’ na-egosi ọnọdụ ahụ n'etinyeghị ‘n'àkwà,’ nke ederede Grik ekwughị kpọmkwem.
- source_word: πυρέσσουσαν
  choice: ahụ ọkụ na-atụkwa ya
  rationale: Nke a bụ ụzọ Igbo nkịtị, doro anya isi kwuo na onye nwere ahụ ọkụ, ma na-egosikwa ọnọdụ ahụ ka ọ na-aga n'ihu.
theological_decisions:
- issue: Onye αὐτοῦ na-ezo aka na ya n'okwu ‘nne nwunye ya’
  choice: A kọwara ya dị ka nne nwunye Pita.
  alternative: Ịsụgharị ya naanị dịka ‘nne nwunye ya,’ nke onye na-agụ nwere ike iche na ọ na-ezo aka na Jizọs.
  rationale: N'usoro ahịrịokwu na n'akụkọ gbara ya gburugburu, ụlọ ahụ bụ nke Pita, nwanyị ahụ bụkwa nne nwunye Pita. Ikwughachi aha Pita na-eme ka nke a doo anya n'enweghị itinye nkwubi okwu ozizi ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-aga n'ụzọ akụkọ nkịtị; e zere ịgbakwunye ‘n'àkwà’ n'ime isi ederede, ma debe ya dị ka nkọwa ọzọ n'okpuru.
