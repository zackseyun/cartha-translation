  text: ἦν δὲ μακρὰν ἀπ’ αὐτῶν ἀγέλη χοίρων πολλῶν βοσκομένη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: ig
  text: E nwere nnukwu ìgwè ezi na-ata nri n'ebe dị anya site n'ebe ha nọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ebe dịtụ anya site n'ebe ha nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: E nwere
  rationale: Nke a na-egosipụta na ìgwè ahụ dị n’ebe ahụ; a hapụrụ δέ ka usoro akụkọ na gburugburu amaokwu gosipụta njikọ ya, kama itinye okwu oge na-adịghị na Grik.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: n'ebe dịtụ anya site n'ebe ha nọ
  rationale: Nke a bụ Igbo doro anya nke na-egosi na ha anọghị nso, ma na-ahapụghị ohere nke nsụgharị siri ike karị, ‘n'ebe dị anya,’ nke e debere n’ala peeji.
- source_word: ἀγέλη
  choice: ìgwè
  rationale: ‘Ìgwè’ bụ okwu Igbo kwesịrị ekwesị maka ọtụtụ anụmanụ nọkọtara ọnụ.
- source_word: χοίρων
  choice: ezi
  rationale: ‘Ezi’ bụ okwu Igbo nkịtị, nke oge a, maka pigs.
- source_word: πολλῶν
  choice: nnukwu
  rationale: N’akụkụ aha nchịkọta ‘ìgwè,’ ‘nnukwu ìgwè’ na-egosi n'ụzọ ebumpụta ụwa na ezi ndị ahụ dị ọtụtụ.
- source_word: βοσκομένη
  choice: na-ata nri
  rationale: Nke a na-egosi ọrụ ụmụ anụmanụ ahụ na-eme n’oge ahụ, n’etinyeghị echiche na mmadụ na-azụ ma ọ bụ na-elekọta ha.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. Ahịrịokwu ahụ na-agụ nke ọma n’akụkọ, na-enweghị ịgbakwunye akara oge nke na-adịghị n’ihe odide Grik.
