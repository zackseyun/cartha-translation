id: MAT.8.8
reference: Matthew 8:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: ig
  text: Onyeisi ndị agha narị ahụ zara sị, “Onyenwe m, erughị m eru ka ị bata n’okpuru elu ụlọ m. Kama, naanị kwuo otu okwu[a], a ga-agwọkwa onye na-ejere m ozi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “kwuo okwu ahụ.” N’asụsụ Grik, ọ bụ n’ụzọ nkịtị, “kwuo otu okwu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “nwata nwoke” ma ọ bụ “nwa.” Okwu Grik ahụ pụrụ ịpụta nwa, onye na-eto eto, ma ọ bụ onye na-eje ozi, dabere n’ọnọdụ e ji ya mee ihe.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: zara sị
  rationale: Okwu abụọ Grik a jikọtara ọnụ na-ewebata nzaghachi ya. ‘Zara sị’ bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji akọ akụkọ n’ụzọ ebumpụta ụwa.
- source_word: ἑκατόνταρχος
  choice: onyeisi ndị agha narị
  rationale: Nke a na-akọwa n'ụzọ ziri ezi ọkwá onye agha na-achị ihe dị ka ndị agha otu narị, ma bụrụkwa okwu ndị na-agụ Igbo taa ga-aghọta.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ na-echekwa ma nkwanye ùgwù dị n’ịkpọ Jizọs aha a ma ihe omimi ọ pụrụ inwe banyere onye ọ bụ, n’etinyeghị nkọwa karịrị ihe odide ahụ.
- source_word: οὐκ εἰμὶ ἱκανὸς
  choice: erughị m eru
  rationale: Akpaalaokwu Igbo a na-egosipụta na nwoke ahụ weere onwe ya dị ka onye na-erughị eru, ọ bụghị naanị onye na-enweghị ike ime ihe.
- source_word: ὑπὸ τὴν στέγην
  choice: n’okpuru elu ụlọ m
  rationale: Nke a na-echekwa ihe oyiyi ụlọ dị n’okwu Grik, ma ihe ọ pụtara bụ ịbanye n’ụlọ ya.
- source_word: μόνον εἰπὲ λόγῳ
  choice: naanị kwuo otu okwu
  rationale: Ọ na-echekwa ike mmachibido nke μόνον na echiche na naanị okwu Jizọs zuru ime ka ọgwụgwọ ahụ mee.
- source_word: ἰαθήσεται
  choice: a ga-agwọkwa
  rationale: Ọ na-echekwa ọdịdị okwu nnara nke ngwaa Grik ma na-egosi ọgwụgwọ n’ụzọ doro anya.
- source_word: παῖς
  choice: onye na-ejere m ozi
  rationale: N’ọnọdụ akụkọ a, ‘onye na-ejere m ozi’ dabara karịa, ma okwu Grik ahụ nwekwara ike ịpụta nwata nwoke ma ọ bụ nwa; e debere nghọta ndị ahụ n’ala peeji.
theological_decisions:
- issue: Aha κύριος e ji kpọọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu; Nna m ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa ohere na aha ahụ karịrị nkwanye ùgwù nkịtị, ma ọ naghị amanye onye na-agụ ya ka ọ were ya n’otu nkọwa naanị.
- issue: Ihe παῖς pụtara
  choice: onye na-ejere m ozi
  alternative: nwata nwoke; nwa
  rationale: Ọnọdụ onyeisi agha na akụkọ yiri nke a na Luk kwadoro nghọta ‘onye na-ejere ozi,’ ma obosara okwu Grik ahụ chọrọ ka e gosipụta nhọrọ ndị ọzọ n’ala peeji.
translation_notes:
  register: E ji asụsụ Igbo Izugbe nke dị ùgwù ma dị mfe nghọta mee ihe. ‘Zara sị’ na ‘erughị m eru’ bụ usoro Igbo ebumpụta ụwa; ‘n’okpuru elu ụlọ m’ na-echekwa ihe oyiyi dị n’asụsụ Grik n’agbanyeghị na ‘n’ụlọ m’ ga-adịtụ mfe.
