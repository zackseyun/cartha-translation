  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: ig
  text: 'ka ihe e kwuru site n’aka Aịzaya onye amụma wee mezuo, sị: “Ya onwe ya weere adịghị ike anyị, buru ọrịa anyị.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “adịghị ike” dịka “nkwarụ” ma ọ bụ “ọrịa.” Okwu Grik a pụrụ ịpụta adịghị ike, nkwarụ, ma ọ bụ ọrịa.
    reason: lexical_alternative
  - marker: b
    text: “Buru” pụkwara ịpụta “bore.” Ọ na-echekwa njikọ okwu ahụ na Aịzaya 53:4.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: ka ... wee mezuo
  rationale: Ọ bụ ụzọ Igbo dị ndụ e si egosipụta nzube ma ọ bụ nsonaazụ nke usoro mmezu amụma Matiu ji eme ihe.
- source_word: τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου
  choice: ihe e kwuru site n’ọnụ Aịzaya onye amụma
  rationale: “Site n’ọnụ” na-egosi na Aịzaya bụ onye e si n’aka ya kwuo okwu ahụ, ma ghara ime ka ọ pụta na okwu ahụ sitere naanị n’aka ya.
- source_word: Αὐτὸς
  choice: Ya onwe ya
  rationale: Na-echekwa nkwusi ike dị na nnọchiaha Grik ahụ.
- source_word: ἀσθενείας
  choice: adịghị ike
  rationale: Na-echekwa obosara okwu ahụ, nke pụrụ ịpụta adịghị ike, nkwarụ, ma ọ bụ ọrịa; ọnọdụ akụkọ a na-ejikọ ya na ọgwụgwọ anụ ahụ.
- source_word: ἔλαβεν
  choice: weere
  rationale: Ọ bụ nsụgharị kwụ ọtọ nke λαμβάνω, na-enweghị ịgbakwunye echiche “wepụ” nke ngwaa ahụ n’onwe ya ekwughị kpọmkwem.
- source_word: νόσους
  choice: ọrịa
  rationale: Okwu Igbo a na-egosi ọrịa n’ụzọ doro anya ma bụrụkwa nke ndị mmadụ na-asụkarị.
- source_word: ἐβάστασεν
  choice: bukwa
  rationale: Na-echekwa echiche nke ibu ma ọ bụ iburu ihe, nakwa njikọ ya na Aịzaya 53:4.
theological_decisions:
- issue: Otu e si sụgharịa ntụaka Aịzaya 53:4 n’ọnọdụ ọrụ ọgwụgwọ Jizọs
  choice: “adịghị ike” na “ọrịa”
  alternative: “ọrịa” na “nrịa”; ma ọ bụ okwu ndị ga-eme ka echiche nnọchi anya pụta ìhè karịa
  rationale: Matiu tinyere okwu Aịzaya a kpọmkwem n’akụkọ ọgwụgwọ ọrịa. Nsụgharị a na-egosi nhụjuanya anụ ahụ ma na-echekwa obosara ἀσθενείας na ihe “ibu” dị na ἐβάστασεν, n’ebughị ozizi pụrụ iche bata n’amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Site n’ọnụ” bụ akpaalaokwu Igbo dabara adaba maka onye amụma dịka ụzọ e si kwuo okwu; “Ya onwe ya” na-echekwa nkwusi ike nke Αὐτός.
