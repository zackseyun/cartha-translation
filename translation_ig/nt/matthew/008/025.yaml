id: MAT.8.25
reference: Matthew 8:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: ig
  text: Ha bịakwutere ya, kpọtere ya, sị, “Onyenwe anyị, zọpụta anyị[a]! Anyị na-ala n’iyi!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “napụta anyị.” Okwu Grik σῶσον nwere ike ịpụta ịnapụta mmadụ ozugbo n’ihe ize ndụ, ma nwekwaa nghọta sara mbara nke “ịzọpụta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: Ha bịakwutere ya
  rationale: Aorist participle ahụ na-egosi na ha gakwuuru Jizọs tupu ha akpọtee ya. “Bịakwutere ya” bụ okwu Igbo doro anya ma na-echekwa mmegharị ahụ n’ebe ọ nọ.
- source_word: ἤγειραν
  choice: kpọtee ya
  rationale: N’ọnọdụ a, ἐγείρω pụtara ịkpọte onye na-ehi ụra, ọ bụghị ibili n’ọnwụ ma ọ bụ ibuli mmadụ elu.
- source_word: λέγοντες
  choice: sị
  rationale: “Sị” bụ ụzọ Igbo dị mfe ma dị ndụ e si webata okwu ha kwuru; ọ naghị agbakwụnye echiche nke iti mkpu nke na-adịghị kpọmkwem na λέγοντες.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a na-echekwa κύριος dị ka aha nsọpụrụ a kpọrọ Jizọs, n’enweghị ime ka ọ bụrụ naanị “Nna ukwu.”
- source_word: σῶσον
  choice: zọpụta anyị
  rationale: Imperative a bụ arịrịọ ka a napụta ha ozugbo n’ihe ize ndụ. Ọ bụ ezie na “anyị” adịghị dị ka okwu iche na Grik, ọnọdụ ahụ na ἀπολλύμεθα na-eme ka onye a ga-azọpụta doo anya, Igbo kwa chọrọ ka e kwuo ya n’ụzọ a.
- source_word: ἀπολλύμεθα
  choice: Anyị na-ala n’iyi
  rationale: Nke a na-egosi mbibi ma ọ bụ ọnwụ na-abịaru ha nso ma na-echekwa ịdị ngwa na ịdịgide nke present tense ahụ.
theological_decisions:
- issue: Ikwu κύριος dịka aha a kpọrọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” na-echekwa ma nsọpụrụ okwu ahụ nwere n’ọnọdụ a ma ohere ọ nwere ibu ibu n’ihe gbasara onye Jizọs bụ; ọ naghị amanye naanị nghọta nke onye nkuzi ma ọ bụ onye isi.
- issue: Ime ka onye σῶσον metụtara pụta ìhè
  choice: zọpụta anyị
  alternative: zọpụta
  rationale: Igbo nkịtị chọrọ ihe nnọchiaha ebe a, okwu sochirinụ “Anyị na-ala n’iyi” na-egosikwa n’enweghị mgbagha na ha na-arịọ ka a zọpụta ha.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe ma nwee ugwu. Ahịrịokwu ahụ na-echekwa usoro omume ndị dị na Grik—ịbịakwute Jizọs, ịkpọte ya, na ịgwa ya okwu—ma na-eji “na-ala n’iyi” chekwaa ịdị ngwa na esemokwu dị n’arịrịọ ha.
