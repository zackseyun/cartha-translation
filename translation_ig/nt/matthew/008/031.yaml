id: MAT.8.31
reference: Matthew 8:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: ig
  text: Ndị mmụọ ọjọọ ahụ nọgidere na-arịọ ya[a], sị, “Ọ bụrụ na ị chụpụ anyị, zipụ anyị n’ime ìgwè ezi[b] ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “rịọrọ ya” ma ọ bụ “na-ekpesiri ya arịrịọ ike.” Ụdị ngwaa Grik a na-egosi na omume ahụ gara n’ihu ma ọ bụ na-eme ugboro ugboro.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anụ ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δαίμονες
  choice: ndị mmụọ ọjọọ
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa mmụọ ọjọọ ndị nwere ụdị omume onwe ha n’akụkọ a, n’etinyeghị nkọwa ozizi ọzọ.
- source_word: παρεκάλουν
  choice: nọgidere na-arịọ ya arịrịọ
  rationale: Ụdị imperfect nke ngwaa Grik na-egosi arịrịọ gara n’ihu ma ọ bụ e mere ugboro ugboro; ‘nọgidere na-arịọ’ na-egosipụta nke a n’Igbo nkịtị.
- source_word: λέγοντες
  choice: sị
  rationale: ‘Sị’ bụ ụzọ Igbo dị mfe na nke eke isi webata okwu e kwuru kpọmkwem, ma na-ebufe ọrụ participle Grik nke ọma.
- source_word: Εἰ
  choice: Ọ bụrụ na
  rationale: Nke a na-edobe ọnọdụ nke ndị mmụọ ahụ kwuru n’ebughị ụzọ gbanwee ya ka ọ bụrụ nkwenye doro anya.
- source_word: ἐκβάλλεις
  choice: ị chụpụ anyị
  rationale: ‘Chụpụ’ na-egosipụta iwepụ ha n’ike ma bụrụ okwu Igbo kwesịrị ekwesị n’ọnọdụ ịchụ mmụọ ọjọọ.
- source_word: ἀπόστειλον
  choice: zipụ anyị
  rationale: ‘Zipụ’ na-ebufe iwu arịrịọ ahụ n’ụzọ kpọmkwem ma dịkwa eke n’Igbo.
- source_word: ἀγέλην
  choice: ìgwè
  rationale: ‘Ìgwè’ bụ okwu Igbo nkịtị maka ọtụtụ anụmanụ zukọtara ọnụ.
- source_word: χοίρων
  choice: ezi
  rationale: ‘Ezi’ bụ okwu Igbo nke oge a, doro anya, maka pigs/swine.
- source_word: οἱ δὲ
  choice: Ndị ... ahụ
  rationale: N’Igbo, njikọ akụkọ na ntụgharị isiokwu nke δέ pụtara nke ọma site n’ịkpọ ndị mmụọ ahụ ozugbo; itinye ‘ma’ ga-eme ka ọdịiche ahụ sie ike karịa ka isi mmalite chọrọ.
theological_decisions:
- issue: Otu e si kpọọ ndị mmụọ ọjọọ
  choice: ndị mmụọ ọjọọ
  alternative: ndị mmụọ demon
  rationale: Nhọrọ a na-edobe ha dị ka ndị mmụọ ọjọọ nwere ike ikwu okwu ma rịọ Jizọs arịrịọ, dị ka amaokwu ahụ si gosi, na-enweghị ịgbakwunye ozizi pụrụ iche.
- issue: Ọnọdụ dị n’okwu ndị mmụọ ahụ
  choice: Ọ bụrụ na ị chụpụ anyị
  alternative: Ebe ọ bụ na ị na-achụpụ anyị
  rationale: Εἰ bụ okwu ọnọdụ; ‘Ọ bụrụ na’ na-echekwa ambiguity na esemokwu dị n’okwu ha kama ime ka ọ bụrụ nkwenye a kọwara nke ọma.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. E ji ‘nọgidere na-arịọ’ gosipụta omume gara n’ihu, ebe ‘ìgwè ezi’ na-enye okwu anụmanụ ahụ n’ụzọ eke.
