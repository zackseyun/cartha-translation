id: MAT.8.1
reference: Matthew 8:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂Καταβάντος δὲ αὐτοῦ⸃ ἀπὸ τοῦ ὄρους ἠκολούθησαν αὐτῷ ὄχλοι πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/001.yaml
  text: When he came down from the mountain[a], large crowds followed him.
translation:
  language: ig
  text: Mgbe ọ si n’ugwu ahụ rịdata, ọtụtụ ìgwè mmadụ[a] sooro ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ìgwè mmadụ buru ibu.” N’asụsụ Grik, ọ bụ n’ụzọ nkịtị “ìgwè mmadụ ọtụtụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: Mgbe ọ ... rịdata
  rationale: A sụgharịrị genitive absolute nke nwere aorist participle dị ka nkebiokwu oge, nke bụ usoro Igbo kwụ ọtọ. ‘Mgbe’ na-egosi usoro ihe mere n’etinyeghị nkọwa oge na-adịghị na Grik; δέ bụ njikọ dị nro nke usoro ahịrịokwu Igbo egosilarị.
- source_word: ἀπὸ τοῦ ὄρους
  choice: si n’ugwu ahụ
  rationale: ‘Ugwu’ bụ okwu Igbo a na-ejikarị maka ὄρος, ebe ‘ahụ’ na-ezo azụ n’ugwu a kpọtụrụ aha n’akụkọ bu ụzọ.
- source_word: ἠκολούθησαν
  choice: sooro
  rationale: ‘Sooro’ na-egosi iso mmadụ n’azụ ma ọ bụ iso ya na-aga, dabara nke ọma n’ọrụ ἀκολουθέω n’akụkọ a.
- source_word: αὐτῷ
  choice: ya
  rationale: N’usoro okwu Igbo, ‘ya’ bụ nnọchiaha ihe nnara kwesịrị ekwesị mgbe e jiri ngwaa ‘soro.’
- source_word: ὄχλοι πολλοί
  choice: ọtụtụ ìgwè mmadụ
  rationale: Nhọrọ a na-edobe ma echiche ọnụ ọgụgụ dị ukwuu nke πολλοί ma ụdị ọtụtụ nke ὄχλοι, n’agbanyeghị na a pụkwara ikwu ya n’ụzọ Igbo dị mfe dịka ‘ìgwè mmadụ buru ibu.’
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘ọtụtụ ìgwè mmadụ’ iji chekwaa ụdị ọtụtụ dị n’asụsụ Grik; e tinyere ụzọ ọzọ dị nro karị n’ala ala peeji.
