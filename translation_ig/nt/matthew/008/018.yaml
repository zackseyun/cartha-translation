  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: ig
  text: Mgbe Jizọs hụrụ ọtụtụ ìgwè mmadụ gbara ya gburugburu, o nyere iwu ka a gafee nʼofe nke ọzọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: Mgbe ... hụrụ
  rationale: A sụgharịrị participle a dị ka nkebiokwu oge n’Igbo ka ahịrịokwu ahụ bụrụ nke e ji eme ihe n’okwu nkịtị.
- source_word: πολλοὺς ὄχλους
  choice: ọtụtụ ìgwè mmadụ
  rationale: Nke a na-edobe ma echiche nke ịdị ọtụtụ ma plural nke ὄχλοι, kama ime ya naanị ‘ọtụtụ mmadụ.’
- source_word: περὶ αὐτόν
  choice: gbara ya gburugburu
  rationale: Ọ bụ ụzọ Igbo doro anya na nke e bu pụta ụwa isi kwuo na ìgwè mmadụ nọ ya gburugburu.
- source_word: ἐκέλευσεν
  choice: o nyere iwu
  rationale: 'Nke a na-egosi ike nke ngwaa ahụ: ọ bụghị naanị arịrịọ ma ọ bụ ntụziaka nkịtị.'
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: ka a gafee nʼakụkụ nke ọzọ
  rationale: E ji ‘a’ hapụ onye a na-enye iwu ka ọ ghara ịbụ nke akọwapụtara karịa isi mmalite; ‘nʼakụkụ nke ọzọ’ na-edobe ntụaka ahụ n’enweghị ịtinye ‘ọdọ mmiri’ nke na-adịghị n’amaokwu a.
theological_decisions:
- issue: Onye e nyere iwu ịgafe
  choice: 'E ji ahịrịokwu na-akọwaghị kpọmkwem onye ahụ: ‘ka a gafee.’'
  alternative: ‘O nyere ndị na-eso ụzọ ya iwu ka ha gafee’ ma ọ bụ ‘o nyere iwu ka ha gafee.’
  rationale: Isi mmalite ekwughị kpọmkwem onye natara iwu ma ọ bụ onye ga-agafe; ya mere, a naghị etinye ‘ndị na-eso ụzọ’ site n’ihe gbara amaokwu ahụ gburugburu.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘Jizọs’ dịka nsụpe aha a na-ahụkarị n’Igbo, ma zere ịgbakwunye nkọwa na-adịghị n’amaokwu Grik.
