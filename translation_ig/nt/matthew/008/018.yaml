  to: Mgbe Jizọs hụrụ ọtụtụ ìgwè mmadụ gbara ya gburugburu, o nyere iwu ka a gafee nʼofe nke ọzọ.
  rationale: A small lexical refinement clarifies the directional sense of εἰς τὸ πέραν while retaining the draft’s faithful, noncommittal treatment of the unstated subject of the infinitive.
