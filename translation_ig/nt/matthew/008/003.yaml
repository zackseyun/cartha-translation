id: MAT.8.3
reference: Matthew 8:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: ig
  text: O setịrị aka ya, metụ ya aka, sị, “Achọrọ m; dị ọcha.” Ozugbo ahụ, a sachara ya n’ekpenta ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: O setịpụrụ aka ya
  rationale: Nke a na-egosi mmegharị aka ahụ n'ụzọ doro anya ma dịkwa mfe n'Igbo; a tụgharịrị participle ahụ dị ka omume butere imetụ ya aka.
- source_word: ἥψατο αὐτοῦ
  choice: metụ ya aka
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu ‘touch him,’ kwekọrọ na ἅπτομαι ya na genitive.
- source_word: Θέλω
  choice: Achọrọ m ime ya
  rationale: N'ọnọdụ a, okwu ahụ na-aza ajụjụ banyere njikere Jizọs. ‘Ime ya’ bụ ihe ọnọdụ okwu ahụ na-egosi, ma nsụgharị a adịghị eme Θέλω ka ọ bụrụ naanị ihe ga-eme n'ọdịnihu.
- source_word: καθαρίσθητι
  choice: dị ọcha
  rationale: Iwu a dị nkenke ma bụrụ Igbo eke. Ọ na-edobe asụsụ ịdị ọcha nke καθαρίζω kama iji naanị okwu pụtara ọgwụgwọ.
- source_word: εὐθέως
  choice: Ozugbo ahụ
  rationale: Ọ na-egosi na ihe ahụ mere n'egbughị oge, dị ka εὐθέως si kwuo.
- source_word: ἐκαθαρίσθη αὐτοῦ ἡ λέπρα
  choice: ekpenta ya dịkwara ọcha
  rationale: A hapụrụ ekpenta ahụ ka ọ bụrụ isiokwu nke ahịrịokwu ahụ, dị ka ọ dị n'asụsụ Grik, ma debe njikọ okwu dị n'etiti iwu ‘dị ọcha’ na ihe mezuru.
- source_word: ἡ λέπρα
  choice: ekpenta
  rationale: ‘Ekpenta’ bụ okwu Igbo a maara nke ọma maka λέπρα n'Akwụkwọ Nsọ; nkọwa ala peeji na-akọwa na okwu Grik ahụ sara mbara karịa ọrịa Hansen naanị.
theological_decisions:
- issue: Asụsụ ịdị ọcha na ọgwụgwọ dị na καθαρίζω
  choice: E ji ‘dị ọcha’ mee ma iwu ahụ ma ihe si na ya pụta.
  alternative: Iji ‘gwọọ’ ma ọ bụ ‘ahụ gbasiri ya ike.’
  rationale: καθαρίζω nwere ma echiche nke iwepụ ọrịa ma nke iwepụ adịghị ọcha. Iji naanị ‘gwọọ’ ga-ewepụ akụkụ ịdị ọcha ahụ.
- issue: Ihe Θέλω pụtara n'azịza Jizọs
  choice: Achọrọ m ime ya
  alternative: 'Ọ bụ uche m; ma ọ bụ: M ga-eme ya.'
  rationale: Onye ahụ jụrụ ma Jizọs ọ̀ chọrọ ime ka ọ dị ọcha. Nsụgharị a na-egosi nkwenye na njikere ya, na-emeghị okwu ahụ ka ọ bụrụ naanị nkwa maka ọdịnihu.
- issue: Isiokwu nke nkebi ikpeazụ
  choice: Ekpenta ya ka bụ isiokwu, dị ka n'asụsụ Grik.
  alternative: 'A sachapụrụ ya ekpenta; ma ọ bụ: ekpenta ahụ hapụrụ ya.'
  rationale: Nhọrọ a na-edobe nhazi na asụsụ ịdị ọcha nke isi mmalite, ọbụna ma ụzọ ọzọ ga-adịtụ mfe n'Igbo.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị nsọ, dee ya. Ahịrịokwu ahụ na-edobe nkenke na ike nke okwu Jizọs, yana asụsụ ịdị ọcha nke Grik. Akara nkọwa ala peeji [a] na [b] dị n'ederede n'ebe okwu ndị ha na-akọwa dị.
