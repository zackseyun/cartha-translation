revisions:
- from: O setịpụrụ aka ya metụ ya aka, sị, “Achọrọ m ime ya[a]; dị ọcha.” Ozugbo ahụ, ekpenta[b] ya dịkwara ọcha.
  to: O setịrị aka ya, metụ ya aka, sị, “Achọrọ m; dị ọcha.” Ozugbo ahụ, a sachara ya n’ekpenta ya.
  rationale: The revision removes the added object from Jesus’ declaration and uses a direct, idiomatic Igbo equivalent of his willingness. It retains the imperative “dị ọcha,” which conveys the cleansing register. The final clause is recast as an impersonal passive because retaining λέπρα/ekpenta as the grammatical subject produces unnatural Igbo; “a sachara ya n’ekpenta ya” accurately communicates the immediate cleansing and preserves the καθαρίζω lexical field.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:31:51Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the hand gesture, touch, immediate result, and the traditional term for λέπρα. However, “Achọrọ m ime ya” introduces an unspecified object (‘to do it’) absent from Θέλω, and “ekpenta ya dịkwara ọcha” is not a natural or semantically suitable Igbo expression for the cleansing result.
  naturalness: “O setịrị aka ya, metụ ya aka” is natural Standard Igbo. “Achọrọ m; dị ọcha” retains the concise force of the Greek exchange. For the result clause, “a sachara ya n’ekpenta ya” is idiomatic Igbo and preserves cleansing language, although it necessarily recasts the Greek clause’s grammatical subject.
  terminology: “Ekpenta” remains appropriate in the main text, with a cultural footnote to prevent identification of biblical λέπρα exclusively with modern Hansen’s disease. “Dị ọcha” and “sachara” preserve the cleansing/purity vocabulary of καθαρίζω rather than reducing it to healing alone.
  issues:
  - severity: medium
    issue: “Achọrọ m ime ya” adds “ime ya” (‘to do it’).
    rationale: Θέλω is an absolute, concise declaration of willingness. The added vague object is not in the Greek and weakens the direct response to the command that follows.
  - severity: high
    issue: “ekpenta ya dịkwara ọcha” is unnatural and semantically unclear.
    rationale: In Standard Igbo, a disease is not normally said to ‘be/become clean’ in this construction. The wording fails to communicate clearly that the man was cleansed from the condition.
  - severity: low
    issue: The first footnote gives alternatives that do not clearly correspond to the revised concise rendering.
    rationale: It should identify “Ọ bụ uche m” as the principal natural alternative for the expression of willingness.
  revised_text: O setịrị aka ya, metụ ya aka, sị, “Achọrọ m; dị ọcha.” Ozugbo ahụ, a sachara ya n’ekpenta ya.
  revised_footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “Ọ bụ uche m.”'
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a sụgharịrị “ekpenta” nwere ike ịgụnye ọrịa akpụkpọ siri ike dị iche iche, ọ bụghị naanị ọrịa Hansen nke a na-akpọ ekpenta n'oge a.
    reason: cultural_note
  revision_rationale: The revision removes the added object from Jesus’ declaration and uses a direct, idiomatic Igbo equivalent of his willingness. It retains the imperative “dị ọcha,” which conveys the cleansing register. The final clause is recast as an impersonal passive because retaining λέπρα/ekpenta as the grammatical subject produces unnatural Igbo; “a sachara ya n’ekpenta ya” accurately communicates the immediate cleansing and preserves the καθαρίζω lexical field.
