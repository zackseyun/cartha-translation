id: MAT.8.9
reference: Matthew 8:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: ig
  text: N’ihi na mụ onwe m bụkwa mmadụ nọ n’okpuru ikike, nwekwara m ndị agha nọ n’okpuru m. Ana m asị onye a, ‘Gaa,’ ọ na-aga; ana m asị onye ọzọ, ‘Bịa,’ ọ na-abịa; ana m asị ohu m[a], ‘Mee nke a,’ ọ na-emekwa ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya, “odibo m” (Grik: doulos).'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ ἐγὼ
  choice: N’ihi na mụ onwe m bụkwa
  rationale: “N’ihi na” na-egosi na okwu a bụ ihe mere onyeisi agha ahụ ji kwuo ihe o kwuru; “mụ onwe m” na “bụkwa” na-echekwa nkwusi ike nke ἐγώ na καί.
- source_word: ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν
  choice: bụ onye nọ n’okpuru ikike
  rationale: Nke a na-echekwa echiche nke onye nọ n’okpuru iwu na ikike e nyere onye ọzọ, karịchaa n’usoro ndị agha.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: enwekwara m ndị agha nọ n’okpuru m
  rationale: 'Ọ na-egosi akụkụ abụọ nke ọnọdụ ya: ọ nọ n’okpuru ikike, ma o nwekwara ndị agha ọ na-achị.'
- source_word: λέγω τούτῳ
  choice: Ana m asị onye a
  rationale: “Onye a” na-echekwa ụdị ngosi nke τούτῳ ma na-eme ka usoro ihe atụ atọ ahụ doo anya.
- source_word: Πορεύθητι ... πορεύεται
  choice: ‘Gaa,’ ọ gaa
  rationale: Iwu dị mfe na nzaghachi ozugbo na-egosipụta nrubeisi n’enweghị mgbakwunye echiche na-adịghị na Grik.
- source_word: Ἔρχου ... ἔρχεται
  choice: ‘Bịa,’ ọ bịa
  rationale: Nsụgharị kpọmkwem na nke eke na-echekwa nhazi iwu na nrubeisi nke okwu mbụ.
- source_word: δούλῳ
  choice: ohu
  rationale: N’ọnọdụ ụlọ ndị Rom, δοῦλος na-egosikarị onye bụ ohu, ọ bụghị nanị onye ọrụ; “ohu” na-echekwa ọnọdụ mmekọrịta ahụ n’enweghị ime ka ọ dị nro.
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: ‘Mee nke a,’ o mee ya
  rationale: Ọ na-echekwa iwu ahụ na mmezu ya ozugbo, ma “ya” na-eme ka Igbo dị ire n’ọnụ.
theological_decisions:
- issue: Nsụgharị δοῦλος n’ihe atụ onyeisi agha ahụ
  choice: ohu
  alternative: odibo
  rationale: “Ohu” na-egosipụta n'ụzọ ziri ezi ọnọdụ onye nọ n’okpuru onye nwe ya nke δοῦλος nwere ike ịpụta n’ụwa Rom. E tinyere “odibo” n’ala ala peeji dịka nhọrọ sara mbara karị n’ihi na isi okwu amaokwu a bụ ikike na nrubeisi, ọ bụghị ịkọwa ọnọdụ iwu nke onye ahụ n’uju.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-echekwa mmegharị iwu na nrubeisi nke Grik, ebe “mụ onwe m” na-egosipụta nkwusi ike doro anya nke onye na-ekwu okwu.
