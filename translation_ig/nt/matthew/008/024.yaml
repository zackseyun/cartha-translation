id: MAT.8.24
reference: Matthew 8:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: ig
  text: Ma lee, oké ifufe[a] bilitere n’oké osimiri, nke mere ka ebili mmiri na-ekpuchi ụgbọ mmiri ahụ; ma ya onwe ya nọ na-ehi ụra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik σεισμός na-apụtakarị “ala ọma jijiji” ma ọ bụ “ịma jijiji”; ma n’ebe a, ihe ndị gbara ya gburugburu na-egosi oke ifufe kpụ ọkụ n’ọnụ n’oké osimiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” bụ ụzọ Igbo doro anya ma dị ndụ isi dọta uche onye na-agụ ya n’ihe mberede na-esote.
- source_word: σεισμὸς μέγας
  choice: oke ifufe
  rationale: Ọ bụ ezie na σεισμός na-apụtakarị “ala ọma jijiji” ma ọ bụ “ịma jijiji,” okwu ndị gbara ya gburugburu—oké osimiri, ụgbọ mmiri, na ebili mmiri—na-egosi nnukwu oke ifufe n’elu mmiri.
- source_word: ἐγένετο
  choice: bilitere
  rationale: “Bilitere” na-egosi mmalite ihe ihu igwe a n’ụzọ Igbo dị mfe ma kwekọọ na ihe okwu Grik ahụ pụtara n’ebe a.
- source_word: ἐν τῇ θαλάσσῃ
  choice: n’oké osimiri
  rationale: Nke a na-edobe okwu isi mmalite nke pụtara “sea,” kama ịgbanwe ya ka ọ bụrụ ọdọ mmiri.
- source_word: ὥστε
  choice: nke mere na
  rationale: Nkebiokwu a na-egosi ihe si n’oke ifufe ahụ pụta.
- source_word: τὸ πλοῖον
  choice: ụgbọ mmiri ahụ
  rationale: “Ụgbọ mmiri” bụ okwu Igbo nkịtị maka ụgbọ e ji aga n’elu mmiri ma dabara n’ọnọdụ a.
- source_word: καλύπτεσθαι
  choice: na-ekpuchi
  rationale: Ụdị ngwaa ahụ na-egosi omume na-aga n’ihu; “na-ekpuchi” na-edobe isi echiche ahụ n’enweghị ịkọwa karịa ihe odide ahụ kwuru.
- source_word: ὑπὸ τῶν κυμάτων
  choice: ebili mmiri na-ekpuchi
  rationale: A haziri ahịrịokwu ahụ n’usoro Igbo sitere n’okike, ebe ebili mmiri bụ ihe na-eme omume ikpuchi ahụ.
- source_word: αὐτὸς δὲ
  choice: ma ya onwe ya
  rationale: “Ma” na-egosi ọdịiche dị n’etiti ọgba aghara ahụ na ihe Jizọs na-eme, ebe “ya onwe ya” na-echekwa ntakịrị nkwusi ike dị na nnọchiaha Grik.
- source_word: ἐκάθευδεν
  choice: nọ na-ehi ụra
  rationale: Nke a na-egosi na ihi ụra ahụ nọ na-aga n’ihu, dị ka imperfect Grik si gosi.
theological_decisions:
- issue: Ụdị ihe omume σεισμός na-akọwa
  choice: A sụgharịrị ya dịka “oke ifufe” dabere n’ọnọdụ ya n’oké osimiri.
  alternative: “Nnukwu ala ọma jijiji” ma ọ bụ “nnukwu ịma jijiji.”
  rationale: Nke a bụ mkpebi gbasara okwu na ọnọdụ ya, ọ bụghị mkpebi ozizi. Ebili mmiri na-ekpuchi ụgbọ mmiri na-egosi na σεισμός ebe a bụ nnukwu ọgba aghara nke ifufe na mmiri.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. “Ma lee” na-edobe ike okwu ndọta uche ahụ; “na-ekpuchi” na “nọ na-ehi ụra” na-echekwa omume abụọ ahụ dịka ihe nọ na-aga n’ihu.
