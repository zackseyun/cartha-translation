review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the participial connection, the servant/child ambiguity through a footnote, the domestic location, paralysis, and severe suffering. However, “Onyenwe anyị” adds the plural possessive “our,” which is not present in Κύριε and can sound like a fixed confessional title rather than the centurion’s direct address. “Onyenwe” retains the source wording without adding possession. The expression for paralysis is also revised to a more idiomatic and specific Igbo wording.
  naturalness: The revised sentence is fluent Standard Igbo. “Mkpọnwụ akpụla ya” naturally states that he is paralyzed, while “na-ata ahụhụ nke ukwuu” clearly conveys his grievous suffering.
  terminology: “Onyenwe” renders Κύριε without deciding between a respectful and a fuller titular sense. “Ohu m” is appropriate in this centurion context, with the lexical alternatives preserved. “Mkpọnwụ” directly identifies paralysis without the potentially unclear image of a body having dried up.
  issues:
  - severity: medium
    issue: “Onyenwe anyị” introduces a possessive plural absent from Κύριε.
    rationale: The Greek is simply a vocative, “Lord.” The plural “anyị” (“our”) adds meaning and may make the address sound more explicitly confessional than the source requires.
  - severity: medium
    issue: “Ahụ ya akpọnwụọla” is not the clearest Standard Igbo expression for paralysis.
    rationale: It can evoke bodily withering or drying and does not as directly identify the condition denoted by παραλυτικός. “Mkpọnwụ akpụla ya” is more idiomatic and precise.
  revised_text: na-asị, “Onyenwe, ohu m[a] dina n’ụlọ; mkpọnwụ akpụla ya, ọ na-ata ahụhụ nke ukwuu.[b]”
