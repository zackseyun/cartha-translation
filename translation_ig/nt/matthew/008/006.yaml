id: MAT.8.6
reference: Matthew 8:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: ig
  text: na-asị, “Onyenwe, ohu m[a] dina n’ụlọ; mkpọnwụ akpụla ya, ọ na-ata ahụhụ nke ukwuu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwata nwoke m” ma ọ bụ “nwa m.” Okwu Grik a nwere ike ịpụta ohu ma ọ bụ nwa, ọ bụ ezie na “ohu” kacha daba n’ọnọdụ onyeisi agha a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a na-emekpa ya ahụ nke ukwuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: na-asị
  rationale: Ụdị a na-egosi njikọ nke participle λέγων na ihe e kwuru n’amaokwu bu ụzọ, ma na-adakwa nke ọma n’Igbo.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị akpọ κύριος mgbe a na-agwa Jizọs okwu. Ọ na-ahapụ ohere ka a ghọta ya dị ka nkwanye ùgwù ma ọ bụ dị ka aha nwere nghọta miri emi.
- source_word: ὁ παῖς μου
  choice: ohu m
  rationale: παῖς nwere ike ịpụta ohu, nwata nwoke, ma ọ bụ nwa. N’ọnọdụ onyeisi agha a, ‘ohu m’ kacha daba, ebe nkọwa ala peeji na-echekwa nghọta ndị ọzọ.
- source_word: βέβληται ἐν τῇ οἰκίᾳ
  choice: dina n’ụlọ
  rationale: Perfect passive βέβληται na-akọ ọnọdụ onye ahụ nọ na ya; ‘dina n’ụlọ’ na-enye nghọta ahụ n’Igbo doro anya n’enweghị ịsụgharị βάλλω n’ụzọ siri ike nke na-agaghị adị eke.
- source_word: παραλυτικός
  choice: ahụ ya akpọnwụọla
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị mfe isi kọwaa ọnọdụ mkpọnwụ nke adjective παραλυτικός na-egosi.
- source_word: δεινῶς βασανιζόμενος
  choice: ọ na-atakwa ahụhụ nke ukwuu
  rationale: Nke a na-egosi oke mgbu ma ọ bụ nhụjuanya okwu Grik ahụ pụtara, n’enweghị ịkọwa kpọmkwem ihe na-akpata ya. A na-edebe nghọta siri ike nke ‘imekpa ahụ’ na nkọwa ala peeji.
theological_decisions:
- issue: Ike okwu Κύριε mgbe onyeisi agha na-agwa Jizọs okwu
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: '‘Onyenwe anyị’ na-echekwa ohere abụọ dị n’okwu ahụ: ọ pụrụ ịbụ okwu nkwanye ùgwù, ma ọ pụkwara igosi nghọta dị elu banyere onye Jizọs bụ. ‘Nna anyị ukwu’ nwere ike ime ka ọ bụrụ naanị nkwanye ùgwù.'
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke kwanyere ugwu ma dị mfe nghọta. A haziri ahịrịokwu ahụ ka ọ na-aga nke ọma n’ọnụ onye Igbo, ebe a ka chekwara njikọ participle na amaokwu bu ụzọ na nghọta abụọ dị na παῖς na βασανιζόμενος.
