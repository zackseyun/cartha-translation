id: MAT.8.13
reference: Matthew 8:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: ig
  text: Jizọs wee sị ọchịagha na-achị otu narị ndị agha[a], “Laa; ka e meere gị dịka i kwere.” N’otu oge ahụ kwa, a gwọrọ ohu ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwa okorobịa” ma ọ bụ “nwatakịrị.” Okwu Grik bụ παῖς nwere ike ịpụta ohu/onye na-eje ozi ma ọ bụ onye na-eto eto. N’ebe a, “ohu” kacha dabara n’ihi na ọ bụ onye nọ n’okpuru ọchịagha ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: ọchịagha na-achị otu narị ndị agha
  rationale: Nke a na-akọwa ọkwa onyeisi ndị agha Rom nke na-achị ihe dịka otu narị ndị agha, n’asụsụ Igbo doro ndị na-agụ akwụkwọ anya.
- source_word: Ὕπαγε
  choice: Laa
  rationale: Iwu dị nkenke nke pụtara ka onye ahụ pụọ ma ọ bụ laghachi; “Laa” bụ okwu Igbo eke ma doo anya.
- source_word: ὡς ἐπίστευσας
  choice: dịka i kwere
  rationale: Na-echekwa ọdịdị ngwaa na omume nke nwoke ahụ ikwere, kama ịgbanwe ya ka ọ bụrụ naanị aha bụ okwukwe.
- source_word: γενηθήτω σοι
  choice: ka e meere gị
  rationale: Na-egosipụta iwu/arịrịọ nke ụdị passive n’ụzọ Igbo na-adị ire, n’agbanyeghị na onye na-eme ya ekwughị kpọmkwem.
- source_word: παῖς
  choice: ohu
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’onye nọ n’okpuru ọchịagha; amaokwu ndị gbara ya gburugburu kwadoro nghọta nke onye na-ejere ya ozi. A debere nkọwa ndị ọzọ n’ala peeji.
- source_word: ἰάθη
  choice: a gwọrọ
  rationale: Na-egosipụta na onye ahụ natara ọgwụgwọ, ma na-echekwa ụdị passive nke okwu Grik.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: n’otu oge ahụ
  rationale: Ọ bụ okwu Igbo eke nke na-echekwa njikọ oge na ịdị ngwa, na-enweghị ikwu n’ụzọ siri ike karịa ihe Grik kwuru na ọ bụ kpọmkwem otu ntabi anya.
theological_decisions:
- issue: Otú e si sụgharị πιστεύω
  choice: kwere
  alternative: tụkwasịrị obi; nwere okwukwe
  rationale: “Kwere” na-echekwa ngwaa kpọmkwem na omume onye ọchịagha, ma ghara ịgbakwunye nkọwa okwukwe nke ederede ekwughị.
- issue: Njikọ dị n’etiti ikwere na ihe e mere
  choice: ka e meere gị dịka i kwere
  alternative: ka e meere gị dịka okwukwe gị si dị
  rationale: A hapụrụ njikọ ahụ dịka okwu Jizọs si kwuo ya, na-enweghị idozi ajụjụ gbasara ụzọ okwukwe si metụta ọgwụgwọ ma ọ bụ onye mere ọgwụgwọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ọchịagha na-achị otu narị ndị agha” na-akọwa centurion n’enweghị ịdabere n’okwu mbịarambịa; “ohu” na-ekwekọ n’ọnọdụ ahụ, ebe e chekwara nghọta ndị ọzọ nke παῖς na nkọwa ala peeji.
