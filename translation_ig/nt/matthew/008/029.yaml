  naturalness: “Gịnị ka anyị na gị nwekọrọ?” is a more natural Standard Igbo rendering of the confrontational dissociation expressed by the Greek/Semitic idiom. The remaining wording is clear, suitably solemn, and modern.
  terminology: “Nwa Chineke,” “oge a kara aka,” and “ịta anyị ahụhụ” appropriately preserve the title, the implied appointed time, and the severe suffering denoted by βασανίσαι without adding doctrinal detail.
