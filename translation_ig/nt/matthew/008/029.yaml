id: MAT.8.29
reference: Matthew 8:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: ig
  text: Ma lee, ha tiri mkpu sị, “Gịnị ka anyị na gị nwekọrọ[a], Nwa Chineke? Ị bịala ebe a tupu oge a kara aka[b] ịta anyị ahụhụ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Gịnị dị n’etiti anyị na gị?” Akpaalaokwu a na-egosi ịjụ njikọ ma ọ bụ itinye aka.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “tupu oge ahụ.” Okwu Grik ahụ nwere ike izo aka n’oge Chineke kara aka.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Ma lee
  rationale: Na-edobe akara okwu nke na-adọta uche ma na-egosi na ihe a mere na mberede, n’ụzọ Igbo nke oge a na-aghọta nke ọma.
- source_word: ἔκραξαν λέγοντες
  choice: ha tiri mkpu sị
  rationale: “Tiri mkpu” na-egosi olu ike dị na κράζω, ebe “sị” na-eburu λέγοντες n’ụzọ Igbo ebumpụta ụwa.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Gịnị dị n’etiti anyị na gị
  rationale: Na-edobe ọdịdị na esemokwu dị n’ilu Grik/Semitik ahụ n’enweghị ịkọwapụta ya karịa ihe ederede kwuru.
- source_word: υἱὲ τοῦ θεοῦ
  choice: Nwa Chineke
  rationale: Nsụgharị kpọmkwem nke aha e ji kpọọ Jizọs; ọ na-edobe ịdị arọ nke nkwupụta ahụ.
- source_word: ἦλθες ὧδε
  choice: Ị bịala ebe a
  rationale: Na-egosi ọbịbịa nke metụtara ọnọdụ dị ugbu a, ma na-edobe ὧδε dị ka “ebe a.”
- source_word: πρὸ καιροῦ
  choice: tupu oge a kara aka
  rationale: καιρός nwere ike ịpụta oge e debere ma ọ bụ oge kwesịrị ekwesị; “oge a kara aka” na-edobe echiche ahụ n’enweghị ịgbakwụnye usoro ozizi.
- source_word: βασανίσαι
  choice: ịta anyị ahụhụ
  rationale: Akpaalaokwu Igbo a na-egosi ahụhụ siri ike nke okwu ahụ pụtara n’ọnọdụ ikpe a.
- source_word: ἡμᾶς
  choice: anyị
  rationale: Nnochiaha ọtụtụ na-ezo aka n’ndị mmụọ ọjọọ na-ekwu okwu site n’ọnụ ndị ahụ.
theological_decisions:
- issue: Ndị mmụọ ọjọọ matara onye Jizọs bụ
  choice: Nwa Chineke
  alternative: nwa nke Chineke
  rationale: Ederede ahụ ji aha a kpọọ Jizọs ozugbo; nsụgharị ahụ anaghị ebelata ma ọ bụ gbasaa nkwupụta ahụ.
- issue: Echiche metụtara oge ikpe dị na καιρός
  choice: oge a kara aka
  alternative: oge ahụ
  rationale: Nke a na-edobe echiche na e nwere oge e debere maka ahụhụ ma ọ bụ ikpe, ma ọ naghị ekwu onye kara ya aka ma ọ bụ kọwaa usoro ihe ga-eme.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ike nke mkpu ahụ, esemokwu dị n’ajụjụ ha, na mgbagwoju anya dị na “oge” ahụ n’enweghị itinye nkọwa otu ụka.
