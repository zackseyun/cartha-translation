review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the question, the address to those of little faith, Jesus' rising, his rebuke of both the winds and the sea, and the resulting great calm. “Na-atụ egwu” is a natural contextual rendering of δειλοί, though it somewhat softens its overtone of timidity/cowardice; it remains appropriate here without overinterpreting the rebuke.
  naturalness: “Nnukwu juu wee dịrị” is not idiomatic Standard Igbo in this narrative context. “Oke jụụ dị” is natural and clearly expresses the great calm. Adding “ahụ” after “oké osimiri” also gives a more natural anaphoric reference to the sea at hand.
  terminology: “Ndị okwukwe nta” preserves the compact, figurative force of ὀλιγόπιστοι. “Baara ... mba” appropriately represents ἐπετίμησεν without replacing rebuke with a merely explanatory command.
  issues:
  - severity: medium
    issue: The final clause uses an unnatural collocation for the calm.
    rationale: “Juu” is not the normal Standard Igbo wording here, and “wee dịrị” is awkward. “Oke jụụ dị” is idiomatic while preserving γαλήνη μεγάλη (‘a great calm’).
  - severity: low
    issue: The sea is not explicitly anaphoric in the Igbo wording.
    rationale: Greek has the definite noun τῇ θαλάσσῃ. “Oké osimiri ahụ” naturally represents the particular sea in the scene; this is a minor stylistic/source-correspondence improvement.
  revised_text: Ọ sịrị ha, “Gịnị mere unu ji atụ egwu, unu ndị okwukwe nta?” Mgbe ahụ, o biliri baara ifufe na oké osimiri ahụ mba, oke jụụ dị.
  revised_footnotes: []
  revision_rationale: The revision is limited to making the concluding description of the calm idiomatic Standard Igbo and supplying the natural definite reference to the sea. It preserves the source sequence and ambiguity, including Jesus’ rebuke and the direct characterization of the disciples as having little faith.
