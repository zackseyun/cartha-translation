id: MAT.8.26
reference: Matthew 8:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: ig
  text: Ọ sịrị ha, “Gịnị mere unu ji atụ egwu, unu ndị okwukwe nta?” Mgbe ahụ, o biliri baara ifufe na oké osimiri ahụ mba, oke jụụ dị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: na-atụ egwu
  rationale: Ọ na-egosipụta ụjọ na enweghị obi ike n'ụzọ doro anya ma bụrụkwa okwu Igbo nkịtị.
- source_word: ὀλιγόπιστοι
  choice: ndị okwukwe nta
  rationale: Ọ na-edobe ihe oyiyi na nkọcha dị n'okwu Grik—ndị okwukwe ha dị nta—na-enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: ἐπετίμησεν
  choice: baara ... mba
  rationale: Nke a bụ ụzọ Igbo si egosipụta ịbara mmadụ ma ọ bụ ihe mba n'ike, kwekọrọ n'omume Jizọs n'ebe ifufe na osimiri nọ.
- source_word: γαλήνη μεγάλη
  choice: nnukwu juu
  rationale: Ọ na-egosi na ọgba aghara mmiri ahụ kwụsịrị nke ukwuu; 'nnukwu' na-edobe ike nke μεγάλη.
theological_decisions:
- issue: Nkọwa nke ὀλιγόπιστοι
  choice: ndị okwukwe nta
  alternative: ndị okwukwe na-adịghị ike
  rationale: Nhọrọ a na-edobe okwu Jizọs dị ka nkọcha kpọmkwem banyere ịdị nta nke okwukwe ha, kama ịkọwa ya dịka adịghị ike n'ụzọ pụrụ iche.
- issue: Ịbara ifufe na oké osimiri mba
  choice: E debere ha dịka ihe Jizọs baara mba
  alternative: O nyere ifufe na oké osimiri iwu ka ha kwụsị
  rationale: Ederede Grik kwuru ἐπετίμησεν, ya mere e kwesịghị dochie ya na nkọwa na-ekwu naanị na o nyere iwu.
translation_notes:
  register: 'Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro akụkọ Grik: ajụjụ na nkọcha, mbilite, ịbara mba, na nnukwu ịdị jụụ.'
