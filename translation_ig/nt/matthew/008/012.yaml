id: MAT.8.12
reference: Matthew 8:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ig
  text: Ma a ga-atụpụ ụmụ alaeze ahụ n'ọchịchịrị dị n'èzí. N'ebe ahụ ka ịkwa ákwá na ịta ikikere ezé ga-adị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ τῆς βασιλείας
  choice: Ma ... ụmụ alaeze ahụ
  rationale: “Ụmụ alaeze” na-edobe akpaala okwu Grik nke na-ezo aka ná ndị e lere anya dị ka ndị kwesịrị iso n'alaeze ahụ. N'Igbo, “ụmụ” nwere ike ịgụnye mmadụ niile n'agbanyeghị nwoke ma ọ bụ nwaanyị, ma ka na-eburu echiche nke ndị nwe ọnọdụ ma ọ bụ ihe nketa. “Ma” na-egosi ọdịiche dị n'amaokwu bu ụzọ.
- source_word: ἐκβληθήσονται
  choice: a ga-atụpụ
  rationale: Nke a na-egosipụta future passive ahụ na ike nke ịchụpụ mmadụ n'ike, n'asụsụ Igbo doro anya ma dị ugbu a.
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: ọchịchịrị dị n'èzí
  rationale: Nsụgharị a na-edobe ihe oyiyi nke ọchịchịrị nọ n'èzí, n'enweghị ịkọwa ya dị ka okwu nkà mmụta okpukpe ọzọ nke na-adịghị na Grik.
- source_word: κλαυθμός
  choice: ịkwa ákwá
  rationale: Nke a bụ ụzọ Igbo e ji ekwu akwa na iru uju n'ụzọ eke, n'enweghị ime ka ike okwu ahụ karịa nke isi mmalite.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: ịta ikikere ezé
  rationale: Nke a bụ akpaala okwu Igbo a maara nke ọma maka ịkpọkọta ezé n'ahụhụ, iwe, ma ọ bụ mwute; ọ na-edobe ihe oyiyi Grik.
- source_word: ἐκεῖ
  choice: N'ebe ahụ
  rationale: Idowe ya ná mmalite nkebiokwu nke abụọ na-egosipụta nrụgide ebe okwu Grik nyere ya ma na-ada nke ọma n'Igbo.
theological_decisions:
- issue: Ihe oyiyi nke mwepụ na ikpe
  choice: E debere “ọchịchịrị dị n'èzí,” “ịkwa ákwá,” na “ịta ikikere ezé” dịka ihe oyiyi e nyere n'amaokwu ahụ.
  alternative: Ịsụgharị ya kpọmkwem dịka “hel” ma ọ bụ “ntaramahụhụ ebighị ebi.”
  rationale: Grik na-eji ihe oyiyi siri ike nke mwepụ na ahụhụ, ma o jighị okwu ndị ahụ kpọmkwem. Nsụgharị ahụ anaghị etinye usoro ozizi sara mbara karịa ihe amaokwu ahụ kwuru.
- issue: Akpaala okwu υἱοὶ τῆς βασιλείας
  choice: “ụmụ alaeze ahụ”
  alternative: “ndị nketa alaeze ahụ” ma ọ bụ “ụmụ ndị ikom nke alaeze ahụ”
  rationale: '“Ụmụ alaeze” na-edobe akpaala okwu na ihe mgbagwoju anya ya: ndị a tụrụ anya na ha ga-abụ ndị alaeze ka a na-achụpụ. Ịsị “ndị nketa” ga-akọwa ihe okwu ahụ pụtara karịa ka Grik siri kwuo ya; “ụmụ ndị ikom” agaghị abụ Igbo eke n''ebe a.'
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji “ụmụ alaeze” debe akpaala okwu isi mmalite n'ụzọ Igbo na-ada eke; e zere okwu ụka pụrụ iche na nkọwa ozizi agbakwunyere.
