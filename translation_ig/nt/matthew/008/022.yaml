  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: ig
  text: Ma Jizọs sịrị ya, “Soro m; hapụ ndị nwụrụ anwụ ka ha lie ndị nwụrụ anwụ nke ha.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A na-aghọtakarị “ndị nwụrụ anwụ” nke mbụ n’ụzọ ihe atụ, dịka ndị a na-ewere dị ka ndị nwụrụ anwụ n’ime mmụọ; ha pụrụ ili ndị nwụrụ n’anụ ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi obere mgbagha dị n’etiti arịrịọ nwoke ahụ kwuru na nzaghachi Jizọs, n’enweghị ime ka mgbagha ahụ sie ike karịa nke Grik.
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ historical present na Grik; n’Igbo, oge gara aga “sịrị” bụ ụzọ nkịtị ma doo anya e si akọ akụkọ, ebe “na-asị” n’ebe a nwere ike ịdị arọ ma ọ bụ mee ka ọ dị ka omume na-aga n’ihu.
- source_word: Ἀκολούθει μοι
  choice: Soro m
  rationale: Iwu kpọmkwem nke na-egosi iso Jizọs n'ụzọ nkịtị nakwa ịbụ onye na-eso ụzọ ya.
- source_word: ἄφες
  choice: hapụkwa
  rationale: “Hapụ” na-egosi ịhapụ ibu ọrụ ma ọ bụ nchegbu ahụ; “-kwa” jikọtara iwu nke abụọ na nke mbụ n'ụzọ Igbo dị ụtọ.
- source_word: νεκρούς ... νεκρούς
  choice: ndị nwụrụ anwụ ... ndị nke ha nwụrụ anwụ
  rationale: E debeghachiri otu okwu ahụ ugboro abụọ iji chekwaa egwuregwu okwu na esemokwu echiche dị na Grik, n’etinyeghị “n’ime mmụọ” n’ahịrị bụ isi.
- source_word: θάψαι
  choice: ka ha lie
  rationale: Ihe owuwu “hapụ ... ka ha lie” bụ Igbo nkịtị nke na-ebute echiche infinitive nke Grik nke ọma.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: ndị nke ha nwụrụ anwụ
  rationale: “Nke ha” na-echekwa nkwusi ike nke nnọchiaha reflexive ἑαυτῶν karịa nanị “ndị ha nwụrụ anwụ.”
theological_decisions:
- issue: Ihe “ndị nwụrụ anwụ” nke mbụ pụtara n’okwu Jizọs
  choice: 'Ahịrị bụ isi debere otu okwu ahụ: “ndị nwụrụ anwụ ... ndị nke ha nwụrụ anwụ,” n’akọwaghị nke mbụ dị ka “ndị nwụrụ anwụ n’ime mmụọ.”'
  alternative: A pụrụ ịghọta nke mbụ dịka ndị na-adịghị anabata oku Jizọs n’ime mmụọ, ebe nke abụọ bụ ndị nwụrụ n’anụ ahụ.
  rationale: Grik ji otu okwu ahụ mee ihe ugboro abụọ, nke na-emepụta okwu dị nkọ ma nwee esemokwu echiche. Ịtinye “n’ime mmụọ” n’ahịrị bụ isi ga-ekpebi ihe ederede ahụ hapụrụ ka onye na-agụ ya tụgharịa uche na ya; ya mere e tinyere nkọwa ahụ naanị n’ala ala peeji.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma nwee ugwu. E ji “sịrị” mee ka akụkọ ahụ daa nke ọma n’Igbo, ma debe iwu Jizọs n’ụdị dị nkenke ma sie ike. E tinyere akara ala ala peeji [a] ozugbo e mechara okwu ahụ niile.
