revisions:
- from: Ma Jizọs sịrị ya, “Soro m, hapụkwa ndị nwụrụ anwụ ka ha lie ndị nke ha nwụrụ anwụ.”[a]
  to: Ma Jizọs sịrị ya, “Soro m; hapụ ndị nwụrụ anwụ ka ha lie ndị nwụrụ anwụ nke ha.”[a]
  rationale: The revision changes only the awkward possessive ordering in the second occurrence of “dead” and improves the footnote’s Standard Igbo idiom. It preserves the source’s repeated term, imperative force, possessive emphasis, and intentional ambiguity in the main text.
  reviewer_model: gpt-5.6-terra
