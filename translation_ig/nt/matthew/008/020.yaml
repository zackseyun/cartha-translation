  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: ig
  text: Jizọs wee sị ya, “Nkịta ọhịa nwere ọgba ha, ụmụ nnụnụ nke eluigwe enweekwa akwụ ha, ma Nwa nke Mmadụ enweghị ebe ọ ga-atọgbọ isi ya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: wee sị
  rationale: Igbo narrative naturally uses the consecutive past construction; this conveys the Greek historical present as a vivid narrative event without producing unnatural Igbo.
- source_word: ἀλώπεκες
  choice: nkịta ọhịa
  rationale: This is the standard, readily understood Igbo term for foxes.
- source_word: φωλεούς
  choice: ọgba ha
  rationale: Ọgba naturally denotes the holes or dens in which wild animals shelter; the possessive makes the parallel with the birds’ nests clear.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ụmụ nnụnụ nke eluigwe
  rationale: This closely preserves the Greek genitive image while remaining idiomatic in Standard Igbo.
- source_word: κατασκηνώσεις
  choice: akwụ ha
  rationale: In the context of birds, akwụ is the natural Igbo equivalent for nests or resting places.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: This translates rather than paraphrases Jesus’ self-designation and retains its established scriptural and theological resonance.
- source_word: οὐκ ἔχει ποῦ
  choice: enweghị ebe ọ ga-
  rationale: This is the natural Igbo construction for having nowhere to perform the following action.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: atọgbọ isi ya
  rationale: The phrase preserves the concrete image of lowering or laying down one’s head and is natural, dignified Igbo.
theological_decisions:
- issue: Rendering Jesus’ self-designation ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: Nwa nke Mmadụ preserves the title’s wording, scriptural associations, and interpretive tension. The alternative would paraphrase it and narrow its possible resonance.
translation_notes:
  register: Standard Igbo with a natural narrative flow and dignified biblical register. Familiar concrete terms such as ọgba and akwụ keep the saying accessible. The title Nwa nke Mmadụ is retained rather than interpretively simplified.
