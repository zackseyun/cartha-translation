source:
  edition: SBLGNT
  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: ig
  text: Ma o juru ndị ikom ahụ anya, na-ekwu, sị, “Onye a bụ ụdị mmadụ dị aṅaa[a], nke ọbụna ifufe na oké osimiri na-erubere ya isi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Onye a bụ ụdị onye dị aṅaa?” Okwu Grik ahụ na-ajụ ụdị ma ọ bụ àgwà onye ọ bụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: Ma ndị ikom ahụ
  rationale: ἄνθρωποι ebe a na-ezo aka n’ụmụ nwoke nọ n’ụgbọ mmiri ahụ; ‘ndị ikom ahụ’ na-egosi ndị a kpọtụrụ aha n’akụkọ ahụ, ebe ‘ma’ na-eburu njikọ δέ.
- source_word: ἐθαύμασαν
  choice: tụrụ n’anya
  rationale: Nkebiokwu Igbo a na-egosi oke iju anya na ihe ịtụnanya n’asụsụ dị ugbu a ma dịkwa mfe nghọta.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-edobe njikọ participle ahụ na omume ịtụ n’anya, n’ụzọ akụkọ Igbo na-anabata nke ọma.
- source_word: Ποταπός ἐστιν οὗτος
  choice: Onye a bụ ụdị onye dị aṅaa
  rationale: Nke a na-ajụ ụdị ma ọ bụ àgwà onye ahụ bụ, ma ghara ịgbakwụnye nkwubi okwu gbasara onye Jizọs bụ.
- source_word: ὅτι
  choice: nke na
  rationale: Ọ na-ejikọta ajụjụ ahụ na ihe kpatara iju anya ha, n’enweghị ime ka ọ bụrụ naanị njikọ ihe kpatara ihe ọzọ.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: ọbụna ifufe na oké osimiri
  rationale: '‘Ọbụna’ na-egosipụta ike nkwusi okwu nke καί: ikike onye ahụ ruru ihe ndị a dị ike n’okike.'
- source_word: αὐτῷ ὑπακούουσιν
  choice: na-erubere ya isi
  rationale: ‘Irubere ... isi’ bụ ụzọ Igbo doro anya isi kwuo ὑπακούω, ma na-egosi na ifufe na oké osimiri na-eme ihe o nyere n’iwu.
theological_decisions:
- issue: Ike ajụjụ ahụ nwere banyere onye Kraịst bụ
  choice: E debere ya dịka ajụjụ iju anya banyere ụdị onye Jizọs bụ, n’ihi na ọbụna ike okike na-erubere ya isi.
  alternative: Ime ka nkwubi okwu banyere ọdịdị chi ya pụta ìhè n’amaokwu ahụ n’onwe ya.
  rationale: Ihe odide ahụ na-egosi ikike Jizọs pụrụ iche n’elu okike, ma ndị nọ n’ụgbọ mmiri ka na-ajụ ajụjụ. Nsụgharị ahụ na-echekwa esemokwu na ibu ajụjụ ahụ n’enweghị ịza ya n’aha onye na-agụ ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Tụrụ n’anya’ na ‘na-erubere ya isi’ bụ nkebiokwu nkịtị ma sie ike; a zere okwu ochie na nkọwa ụka agbakwunyere.
