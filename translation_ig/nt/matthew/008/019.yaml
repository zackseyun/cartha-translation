    text: Ma ọ bụ, “ebe ọ bụla ị ga-apụ” ma ọ bụ “ebe ọ bụla ị ga-esi pụọ.” Okwu Grik ahụ pụrụ ịpụta n'ụzọ kpọmkwem ịpụ ma ọ bụ isi n’otu ebe gaa, ma n’ebe a ọ na-arụ ọrụ nke ọma dịka “ịga.”
    reason: lexical_alternative
  revision_rationale: The revision preserves every element of the Greek while changing the final verb clause to a natural Igbo prospective form and replacing the footnote’s unidiomatic alternatives with accurate ones. No doctrinal interpretation has been added.
