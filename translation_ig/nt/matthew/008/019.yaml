- from: Otu odeakwụkwọ bịakwutere ya wee sị ya, “Onye Ozizi, aga m eso gị ebe ọ bụla ị na-aga.[a]”
  to: Otu odeakwụkwọ bịakwutere ya wee sị ya, “Onye Ozizi, aga m eso gị ebe ọ bụla ị ga-aga.[a]”
  rationale: The revision preserves every element of the Greek while changing the final verb clause to a natural Igbo prospective form and replacing the footnote’s unidiomatic alternatives with accurate ones. No doctrinal interpretation has been added.
