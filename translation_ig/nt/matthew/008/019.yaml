  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: ig
  text: Otu odeakwụkwọ bịakwutere ya wee sị ya, “Onye Ozizi, aga m eso gị ebe ọ bụla ị ga-aga.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe ọ bụla ị ga-apụ” ma ọ bụ “ebe ọ bụla ị ga-esi pụọ.” Okwu Grik ahụ pụrụ ịpụta n'ụzọ kpọmkwem ịpụ ma ọ bụ isi n’otu ebe gaa, ma n’ebe a ọ na-arụ ọrụ nke ọma dịka “ịga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: bịakwutere
  rationale: Okwu a na-egosi na onye ahụ bịara nso n’ebe Jizọs nọ tupu ya agwa ya okwu; “bịakwutere” bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: εἷς
  choice: otu
  rationale: A hapụrụ ọnụọgụ ahụ dịka ọ dị n’asụsụ Grik, iji kọwaa na ọ bụ otu onye odeakwụkwọ bịara.
- source_word: γραμματεὺς
  choice: odeakwụkwọ
  rationale: “Odeakwụkwọ” bụ okwu Igbo a na-ejikarị akọwa γραμματεύς n’akụkọ Oziọma, n’ebughị ụzọ tinyekwuo nkọwa banyere ọrụ ya dị ka ọkà mmụta iwu.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Nke a na-asụgharị ihe διδάσκαλος pụtara n’ụzọ doro anya ma na-akwanyere onye a na-agwa okwu ùgwù.
- source_word: ἀκολουθήσω
  choice: aga m eso
  rationale: Nke a na-egosi mkpebi onye ahụ kwupụtara banyere ihe ọ ga-eme, ma na-edobekwa ma echiche iso mmadụ n'ụzọ ma echiche ịbụ onye na-eso ụzọ ya.
- source_word: ὅπου ἐὰν
  choice: ebe ọ bụla
  rationale: Nkebiokwu a na-egosi ebe ọ bụla n’enweghị oke, ya mere “ebe ọ bụla” dabara nke ọma n’Igbo.
- source_word: ἀπέρχῃ
  choice: ị na-aga
  rationale: N’ọnọdụ a, “ị na-aga” bụ okwu Igbo nkịtị ma doo anya maka njem Jizọs gaa ebe ọ bụla, ebe ihe okwu Grik ahụ pụtara kpọmkwem karị nwere ike ịbụ ịpụ ma ọ bụ isi n’otu ebe gaa.
theological_decisions:
- issue: Otú e si asụgharị διδάσκαλος dịka aha nsọpụrụ e ji kpọọ Jizọs
  choice: Onye Ozizi
  alternative: Nna Ukwu; Rabbi
  rationale: “Onye Ozizi” na-egosipụta isi ihe okwu Grik ahụ pụtara n’ebughị ibu echiche okpukpe karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. Nhazi ahịrịokwu ahụ bụ nke nkịtị n’Igbo, ma e chekwara nkọwa ndị bụ isi nke asụsụ Grik.
