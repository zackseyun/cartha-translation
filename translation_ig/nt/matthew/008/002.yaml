id: MAT.8.2
reference: Matthew 8:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: ig
  text: Ma lee[a], otu nwoke nwere ekpenta bịakwutere ya, kpọọ isiala n’ihu ya, sị, “Onyenwe anyị, ọ bụrụ na ị chọrọ, i nwere ike ime ka m dị ọcha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “fee ya ofufe”; ngwaa Grik ahụ pụrụ ịpụta ịkpọ isiala n’ịsọpụrụ mmadụ, inye ya nsọpụrụ, ma ọ bụ ife ya ofufe, dabere n’ọnọdụ okwu ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: Na-echekwa ọrụ mkpụrụokwu a nke ịdọrọ uche onye na-agụ na ihe na-esote, ma bụrụkwa okwu Igbo doro anya ma dị ndụ n’akụkọ.
- source_word: λεπρὸς
  choice: otu nwoke nwere ekpenta
  rationale: Na-egosi onye ọrịa ahụ n'ụzọ mmadụ na-asụ n’oge a, na-ezere ime ka ọrịa ya bụrụ aha njirimara ya, ma na-echekwa aha ọrịa ọdịnala ahụ.
- source_word: προσελθὼν
  choice: bịakwutere ya
  rationale: Na-egosipụta ịbịaru Jizọs nso, nke participle Grik ahụ pụtara, n’Igbo dị mfe ma kwekọọ n’akụkọ.
- source_word: προσεκύνει
  choice: kpọọ isiala n’ihu ya
  rationale: Na-egosipụta mmegharị ahụ nke nkwanye ugwu ma ghara ikpebi ozugbo ma ọ bụ ofufe n’uche zuru ezu; nke a na-echekwa obosara ihe okwu Grik ahụ pụrụ ịpụta.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Na-echekwa aha nkwanye ugwu na ikike e nyere Jizọs, tinyere ohere ọ nwere ibu nghọta Kraịst dị omimi karịa nanị ‘Nna ukwu.’
- source_word: ἐὰν θέλῃς
  choice: ọ bụrụ na ị chọrọ
  rationale: Ọ bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo ọnọdụ dabere n’uche Jizọs, n’enweghị ụda okwu ochie.
- source_word: δύνασαί
  choice: i nwere ike
  rationale: Na-ekwupụta ikike ma ọ bụ ike Jizọs n'ụzọ Igbo e ji eme ihe kwa ụbọchị.
- source_word: καθαρίσαι
  choice: ime ka m dị ọcha
  rationale: Na-echekwa echiche ịdị ọcha nke καθαρίζω, nke metụtara ma ahụ́ ma ọnọdụ ịdị ọcha n’iwu okpukpe, kama ime ya naanị ‘gwọọ m.’
theological_decisions:
- issue: Ihe προσκυνέω pụtara mgbe e mere ya n’ihu Jizọs
  choice: kpọọ isiala n’ihu ya
  alternative: fee ya ofufe
  rationale: Okwu ahụ pụrụ ịpụta ịkpọ isiala n’ịsọpụrụ mmadụ, inye nsọpụrụ pụrụ iche, ma ọ bụ ife ofufe. Ihe a họọrọ na-egosi omume ahụ na nkwanye ugwu dị na ya, ma hapụ ajụjụ gbasara ma ọ bụ ofufe n’echiche zuru ezu ka ederede ghara idozi ihe Grik ahụ hapụrụ ghe oghe.
translation_notes:
  register: Ejiri Igbo ọkọlọtọ nke oge a, dị mfe ma nwee ugwu. ‘Ma lee’ na-enye akụkọ ahụ ike ịdọrọ uche; ‘otu nwoke nwere ekpenta’ na-asọpụrụ onye ahụ; ‘ime ka m dị ọcha’ na-echekwa ma akụkụ ọgwụgwọ ahụ ma echiche ịdị ọcha metụtara iwu okpukpe.
