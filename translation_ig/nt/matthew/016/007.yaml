  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: ig
  text: Ha wee na-ekwurịta n’etiti onwe ha, na-asị, “Anyị ebughị achịcha[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Anyị eweghị achịcha soro anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ha wee
  rationale: δέ bụ njikọ akụkọ dị nro; “wee” na-eme ka akụkọ gaa n’ihu n’ụzọ Igbo na-asụkarị, n’etinyeghị esemokwu siri ike.
- source_word: διελογίζοντο
  choice: na-ekwurịta
  rationale: Oge imperfect na-egosi mkparịta ụka na-aga n’ihu. “Na-ekwurịta” na-egosi na ha na-atụle okwu ahụ ọnụ, n’etinyeghị ihe a na-akpọghị aha n’ihe odide Grik.
- source_word: ἐν ἑαυτοῖς
  choice: n’etiti onwe ha
  rationale: Nke a na-egosi na mkparịta ụka ahụ bụ naanị n’etiti ndị nọ n’ìgwè ahụ.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-ewebata kpọmkwem ihe ha kwuru, ma na-edobe usoro participle nke okwu Grik n’ụzọ Igbo dị ire.
- source_word: Ἄρτους
  choice: achịcha
  rationale: Ọ bụ ezie na okwu Grik dị n’ụdị ọtụtụ, ebe a ọ na-ekwu maka achịcha dịka ihe oriri e ji eje njem; “achịcha” bụ okwu Igbo eke ma nwee ike ibu echiche ahụ n’enweghị ịmanye ọnụọgụ.
- source_word: οὐκ ἐλάβομεν
  choice: Anyị ebughị
  rationale: N’ọnọdụ njem a, λαμβάνω pụtara iwere ma ọ bụ iburu ihe soro mmadụ. “Ebughị” na-egosi nke ọma na ha ebuteghị achịcha, ebe nkọwa ala peeji na-echekwa ntụgharị nke pụtara iwere ya soro ha.
theological_decisions:
- issue: Ma a ga-eme ka ihe ha chere pụta ìhè dịka “Ọ bụ n’ihi na...”
  choice: E tinyeghị “Ọ bụ n’ihi na”
  alternative: “Ọ bụ n’ihi na anyị ebughị achịcha.”
  rationale: ὅτι nwere ike iwebata ihe ha na-ekwu n’enweghị ka e tinye ahịrịokwu nkọwa ahụ. Ịhapụ ya dịka okwu kpọmkwem na-echekwa mkpụmkpụ na nghọtahie dị n’ihe odide Grik, ma zere ịkọwapụta echiche ha karịa ka isi mmalite mere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Na-ekwurịta n’etiti onwe ha” bụ okwu nkịtị maka mkparịta ụka dị n’ime ìgwè ahụ; e zere itinye object dịka “okwu ahụ” n’ihi na ọ dịghị n’ihe odide Grik.
