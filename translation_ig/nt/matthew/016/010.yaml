id: MAT.16.10
reference: Matthew 16:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδὲ τοὺς ἑπτὰ ἄρτους τῶν τετρακισχιλίων καὶ πόσας σπυρίδας ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: ig
  text: Ma ọ bụ achịcha asaa ahụ e ji nye puku mmadụ anọ nri[a], na nkata ukwu ole unu tụtụkọtara?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ma ọbụghịkwa achịcha asaa nke puku mmadụ anọ ahụ, na nkata ukwu ole unu chịkọtara?”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Ma ọ bụ
  rationale: N’usoro ajụjụ Jizọs na-aga n’ihu, okwu a na-ewebata ihe ọzọ o kwesịrị ka ha cheta; “Ma ọ bụ” na-ada nke ọma n’Igbo, ebe “Ma ọbụghịkwa” ga-ekwukwa njikọ ahụ n’ụzọ ọzọ.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: achịcha asaa ahụ
  rationale: ἄρτους na-ezo aka n’ogbe achịcha ndị e ji nye ìgwè mmadụ nri; n’Igbo nkịtị, “achịcha asaa ahụ” na-enye echiche ahụ nke ọma n’enweghị okwu na-adịghị eke.
- source_word: τῶν τετρακισχιλίων
  choice: e ji nye puku mmadụ anọ nri
  rationale: Genitive a na-ejikọta achịcha ahụ na inye puku mmadụ anọ nri. Nsụgharị a na-eme ka njikọ ahụ doo anya n’Igbo ma ghara ịgbanwe ihe akụkọ ahụ pụtara.
- source_word: πόσας
  choice: ole
  rationale: πόσας bụ okwu ajụjụ na-akọwa ọnụ ọgụgụ nkata; “ole” bụ ụzọ Igbo si ajụ ọnụ ọgụgụ n’ụzọ doro anya.
- source_word: σπυρίδας
  choice: nkata ukwu
  rationale: σπυρίς na-egosi ụdị nkata buru ibu, dị iche na κόφινος; “nkata ukwu” na-echekwa ọdịiche okwu a dị n’akụkọ ndị ahụ.
- source_word: ἐλάβετε
  choice: unu tụtụkọtara
  rationale: N’ọnọdụ a, okwu ahụ pụtara ịchịkọta iberibe fọdụrụ mgbe e nyechara ndị mmadụ nri; “tụtụkọtara” bụ okwu Igbo e ji ekwu omume ahụ n’ụzọ eke.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo izugbe nke oge a, dị nsọ ma dị mfe nghọta. A họọrọ usoro ajụjụ nke na-aga n’ihu site n’amaokwu bu ụzọ, ma e debere ụzọ ọzọ e nwere ike isi sụgharịa οὐδὲ na genitive τῶν τετρακισχιλίων n’okpuru ala.
