revisions:
- from: Aga m enye gị mkpịsị ugodi nke alaeze eluigwe[a]. Ihe ọ bụla ị ga-eke agbụ n’ụwa ga-abụ ihe e keburu agbụ n’eluigwe[b][c], ihe ọ bụla ị ga-atọpụ n’ụwa ga-abụkwa ihe e tọpụburu n’eluigwe.
  to: Aga m enye gị mkpịsị ugodi nke alaeze eluigwe[a]; ihe ọ bụla ị ga-ekekọta n’ụwa ga-abụ ihe e kekọtaworị n’eluigwe[b][c], ihe ọ bụla ị ga-atọpụ n’ụwa ga-abụkwa ihe e tọpụworị n’eluigwe.
  rationale: The revision makes the binding terminology idiomatic in Standard Igbo, corrects the erroneous footnote expression, and renders the Greek future-plus-perfect-passive-participle construction as a future state involving something already bound or loosed. It retains the Greek metaphors and their ambiguity, without deciding a disputed ecclesiological implication.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:23Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the plural “keys,” the kingdom-of-heaven metaphor, the earth/heaven contrast, and the two parallel binding/loosing clauses. However, “ị ga-eke agbụ” is not the most natural Standard Igbo expression for δήσῃς, and “e keburu agbụ” is awkward and does not reliably express the perfect passive force. “Ịkekọta” / “e kekọtaworị” preserves the metaphor and communicates the resultant prior state without doctrinal expansion.
  naturalness: “Mkpịsị ugodi” and “alaeze eluigwe” are natural and suitable in a dignified modern biblical register. Replacing “eke agbụ” with “ekekọta” makes both clauses more idiomatic and keeps the bind/loose pairing clear. The revised perfect forms are smoother Standard Igbo.
  terminology: Keep “mkpịsị ugodi,” “alaeze eluigwe,” “eluigwe,” and “ịtọpụ.” Use “ịkekọta” rather than the less idiomatic chain-focused wording. Footnote c must not say “Ike agbụ,” which means something different from the verbal metaphor in the verse.
  issues:
  - severity: medium
    issue: The phrase “ị ga-eke agbụ” / “e keburu agbụ” is awkward for the Greek bind metaphor.
    rationale: δήσῃς and δεδεμένον call for a natural verbal expression of binding. “Ịkekọta” and the passive-perfect “e kekọtaworị” better preserve the metaphor, parallelism, and grammatical sense.
  - severity: medium
    issue: Footnote c refers to “Ike agbụ” although the verse uses a verb meaning ‘bind.’
    rationale: “Ike agbụ” denotes the strength/power of a chain, not the binding action. This is misleading terminology and should be corrected to “Ịkekọta.”
  - severity: low
    issue: The footnote explanation of the Greek aspect can be stated more clearly in Igbo.
    rationale: “E kekọtaworị/e tọpụworị” naturally conveys the state resulting from a prior action while avoiding an imposed theological conclusion.
  revised_text: Aga m enye gị mkpịsị ugodi nke alaeze eluigwe[a]; ihe ọ bụla ị ga-ekekọta n’ụwa ga-abụ ihe e kekọtaworị n’eluigwe[b][c], ihe ọ bụla ị ga-atọpụ n’ụwa ga-abụkwa ihe e tọpụworị n’eluigwe.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara okwu Grik nso karị, “alaeze nke eluigwe.” Matiu na-ejikarị okwu a eme ihe.
    reason: lexical_alternative
  - marker: b
    text: Ọtụtụ nsụgharị ọdịnala na-asị, “a ga-ekekọta … a ga-atọpụ.” Ma enwere ike ịghọta usoro okwu Grik ahụ nke ọma dịka, “ga-abụ ihe e kekọtaworị … ga-abụ ihe e tọpụworị.”
    reason: alternative_reading
  - marker: c
    text: “Ịkekọta” na “ịtọpụ” nwere ike ịpụta ịmachibido na ikwe, ma ọ bụ ịtụ ibu ọrụ na iwepụ ya; ma nsụgharị a hapụrụ ihe atụ Grik ka ọ dị.
    reason: cultural_note
  revision_rationale: The revision makes the binding terminology idiomatic in Standard Igbo, corrects the erroneous footnote expression, and renders the Greek future-plus-perfect-passive-participle construction as a future state involving something already bound or loosed. It retains the Greek metaphors and their ambiguity, without deciding a disputed ecclesiological implication.
