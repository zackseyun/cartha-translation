id: MAT.16.19
reference: Matthew 16:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: ig
  text: Aga m enye gị mkpịsị ugodi nke alaeze eluigwe[a]; ihe ọ bụla ị ga-ekekọta n’ụwa ga-abụ ihe e kekọtaworị n’eluigwe[b][c], ihe ọ bụla ị ga-atọpụ n’ụwa ga-abụkwa ihe e tọpụworị n’eluigwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara okwu Grik nso karị, “alaeze nke eluigwe.” Matiu na-ejikarị okwu a eme ihe.
    reason: lexical_alternative
  - marker: b
    text: Ọtụtụ nsụgharị ọdịnala na-asị, “a ga-ekekọta … a ga-atọpụ.” Ma enwere ike ịghọta usoro okwu Grik ahụ nke ọma dịka, “ga-abụ ihe e kekọtaworị … ga-abụ ihe e tọpụworị.”
    reason: alternative_reading
  - marker: c
    text: “Ịkekọta” na “ịtọpụ” nwere ike ịpụta ịmachibido na ikwe, ma ọ bụ ịtụ ibu ọrụ na iwepụ ya; ma nsụgharị a hapụrụ ihe atụ Grik ka ọ dị.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω σοι
  choice: Aga m enye gị
  rationale: Ọ bụ nkwa dị n’ụdị ọdịnihu; usoro a bụ Igbo nkịtị ma na-egosi onye a na-enye ihe nke ọma.
- source_word: κλεῖδας
  choice: mkpịsị ugodi
  rationale: E debere aha ihe ahụ na ọtụtụ nakwa ihe atụ ya, kama ịkọwa ya ozugbo dị ka ikike.
- source_word: βασιλείας τῶν οὐρανῶν
  choice: alaeze eluigwe
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụ nke a na-ejikarị ekwu okwu Matiu banyere ọchịchị eluigwe; ihe ọzọ dabara usoro Grik nso dị na nkọwa ala peeji.
- source_word: ὃ ἐὰν
  choice: ihe ọ bụla
  rationale: Nke a na-egosipụta usoro nnọchiaha na-enweghị ihe a kapịrị ọnụ n’ụzọ Igbo sitere n’okike.
- source_word: δήσῃς
  choice: ị ga-eke agbụ
  rationale: A hapụrụ ihe atụ nke ike agbụ ka ọ dị, n’akọwaghị ya naanị dị ka ‘igbochi’ ma ọ bụ ‘ịmachibido iwu.’
- source_word: ἐπὶ τῆς γῆς
  choice: n’ụwa
  rationale: Ọ bụ ụzọ Igbo dị mfe ma doo anya nke na-emegide ‘n’eluigwe.’
- source_word: ἔσται δεδεμένον
  choice: ga-abụ ihe e keburu agbụ
  rationale: ‘Keburu’ na-egosipụta ọnọdụ ga-adị mgbe emechara ihe ahụ tupu oge ahụ, nke dabara na ọdịnihu nke εἰμί tinyere participle perfect passive.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: n’eluigwe
  rationale: Nke a bụ okwu Igbo sitere n’okike maka ebe eluigwe n’usoro a, n’agbanyeghị na Grik ji ụdị ọtụtụ.
- source_word: λύσῃς
  choice: ị ga-atọpụ
  rationale: ‘Ịtọpụ’ na-anọgide na-emegide ‘ike agbụ’ nke ọma ma na-echekwa ihe atụ Grik.
- source_word: ἔσται λελυμένον
  choice: ga-abụ ihe e tọpụburu
  rationale: Ụdị a na-echekwa echiche nke ọnọdụ ga-adị n’ihi ihe emechara tupu ya, dịka perfect passive participle Grik si dị.
theological_decisions:
- issue: Ụdị oge na ihe ọ pụrụ ịpụta n’okwu banyere ike agbụ na ịtọpụ
  choice: ga-abụ ihe e keburu agbụ / ga-abụ ihe e tọpụburu
  alternative: a ga-eke agbụ / a ga-atọpụ
  rationale: ἔσται tinyere perfect passive participle na-egosi ọnọdụ ga-adị nke sitere n’ihe emechara. Nsụgharị a na-echekwa ike ụtọasụsụ ahụ ma ọ naghị ekpebi ozizi ụka kpọmkwem banyere ma omume ụwa ọ na-esochi mkpebi eluigwe ma ọ bụ na-akpata ya.
- issue: Ihe ‘mkpịsị ugodi nke alaeze eluigwe’ pụtara
  choice: E debere ihe atụ ‘mkpịsị ugodi’ dịka ọ dị.
  alternative: ikike ịnabata ma ọ bụ ịchụpụ; ikike nlekọta
  rationale: Ihe atụ ahụ nwere ike igosi ikike, ma amaokwu ahụ akọwaghị usoro ikike ahụ n’uju. Idebe ihe atụ ahụ na-ezere itinye ozizi otu ụka n’ime ederede.
- issue: Ihe ‘ike agbụ’ na ‘ịtọpụ’ pụtara
  choice: E debere okwu ihe atụ ahụ n’ahịrị amaokwu.
  alternative: ịmachibido na ikwe; ịtụ na iwepụ ibu ọrụ
  rationale: Okwu ndị ahụ nwere ike ịbụ okwu ikike metụtara ihe a machibidoro ma ọ bụ ihe e kwere, ma ederede ahụ n’onwe ya ji ihe atụ. Nkọwa ala peeji na-egosi ohere ndị ahụ n’ekpebighị naanị otu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘mkpịsị ugodi,’ ‘ike agbụ,’ na ‘ịtọpụ’ iji chekwaa ihe atụ ndị dị na Grik; a gbatịghị ha ka ha bụrụ nkọwa ozizi otu ụka. ‘Keburu’ na ‘tọpụburu’ na-agbalị igosipụta perfect passive n’ụzọ Igbo ga-aghọta.
