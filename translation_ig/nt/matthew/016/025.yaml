review_pass:
  verdict: revise
  source_fidelity: 'The main sense and the ψυχή paradox are represented well: ndụ appropriately renders ψυχή here, and the repeated pronoun preserves the deliberate parallelism. However, “tụfuru” is perfect/past in ordinary Standard Igbo and can imply that the losing has already occurred. The Greek δεύτερη relative condition (ὃς δ’ ἂν ἀπολέσῃ) is indefinite and prospective/general; Igbo subjunctive “tufuo” conveys this more faithfully.'
  naturalness: The register is clear, contemporary Standard Igbo, and the contrast introduced by “ma” reads naturally. Replacing “tụfuru” with “tufuo” also makes the conditional construction more idiomatic and balanced with the consequence “ga-achọta.”
  terminology: “Ndụ” is the best contextual rendering of ψυχή in this saying. “Ịzọpụta,” “ịtụfu,” and “ịchọta” preserve the verbal paradox without doctrinal expansion. The footnote appropriately retains “mkpụrụ obi” and “onwe” as lexical possibilities.
  issues:
  - severity: medium
    issue: The second occurrence of ἀπολέσῃ is rendered “tụfuru.”
    rationale: “Tụfuru” normally marks completed/past action, whereas the Greek aorist subjunctive with ἄν expresses a general prospective condition (“whoever loses”). “Tufuo” is the suitable Standard Igbo subjunctive form.
  revised_text: N’ihi na onye ọ bụla chọrọ ịzọpụta ndụ ya ga-atụfu ya[a]; ma onye ọ bụla tufuo ndụ ya n’ihi m ga-achọta ya.
