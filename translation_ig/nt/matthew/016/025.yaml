source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: ig
  text: N’ihi na onye ọ bụla chọrọ ịzọpụta ndụ ya ga-atụfu ya[a]; ma onye ọ bụla tufuo ndụ ya n’ihi m ga-achọta ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ obi” n’ebe abụọ ahụ; okwu Grik bụ psychē, nke nwere ike ịpụta “ndụ,” “onwe,” ma ọ bụ “mkpụrụ obi,” dabere n’ọnọdụ okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: N’ihi na onye ọ bụla ... ma onye ọ bụla
  rationale: Usoro a na-egosi ọnọdụ metụtara onye ọ bụla. “N’ihi na” jikọtara okwu a na amaokwu bu ya ụzọ, ebe “ma” na-egosi ọdịiche dị n’etiti akụkụ abụọ ahụ.
- source_word: θέλῃ
  choice: chọrọ
  rationale: “Chọrọ” bụ okwu Igbo nkịtị na-egosi ọchịchọ ma ọ bụ mkpebi mmadụ.
- source_word: ψυχὴν
  choice: ndụ
  rationale: N’ọnọdụ a, ψυχή na-ezo aka ná ndụ mmadụ nke a pụrụ ịzọpụta, ịtụfu, ma chọta. “Ndụ” na-eme ka ilu mgbagwoju anya ahụ doo anya n’Igbo, ebe e debere “mkpụrụ obi” dị ka ụzọ ọzọ na nkọwa ala peeji.
- source_word: σῶσαι
  choice: ịzọpụta
  rationale: “Ịzọpụta” na-egosipụta ihe σῴζω pụtara ma na-echekwa mmekọrịta ya na “ịtụfu.”
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: ga-atụfu / tụfuru
  rationale: N’ebe a, ἀπόλλυμι pụtara ịtụfu ndụ, ọ bụghị ikpochapụ ya. “Ga-atụfu” na-egosipụta ọdịnihu nke ngwaa mbụ; “tụfuru” dabara n’usoro ọnọdụ izugbe nke akụkụ nke abụọ.
- source_word: ἕνεκεν ἐμοῦ
  choice: n’ihi m
  rationale: Nkebiokwu a na-egosi ihe kpatara ya—na mmadụ tụfuru ndụ ya n’ihi njikọ ya na Jizọs. Ọ bụ okwu Igbo dị mkpirikpi ma bụrụkwa nke eke.
- source_word: εὑρήσει
  choice: ga-achọta
  rationale: “Ga-achọta” na-asụgharị εὑρίσκω ozugbo ma na-echekwa ọdịiche dị ịtụnanya n’etiti ịtụfu na ịchọta.
- source_word: αὐτοῦ / αὐτήν
  choice: ya
  rationale: Igbo anaghị ekewa nnọchiaha onye nke atọ dịka nwoke ma ọ bụ nwanyị; “ya” na-arụ ọrụ maka onye nnọchiteanya na maka ndụ e kwuru okwu ya.
theological_decisions:
- issue: Otú e si asụgharị ψυχή n’ilu banyere iso Jizọs
  choice: ndụ
  alternative: mkpụrụ obi; onwe
  rationale: Ọnọdụ okwu ahụ metụtara ịzọpụta, ịtụfu, na ịchọta ndụ n’ihi iso Jizọs, ya mere “ndụ” na-echekwa ilu ahụ n’Igbo nke ọma. Ma ψυχή nwekwara ike ịpụta “mkpụrụ obi” ma ọ bụ “onwe,” ya mere e gosiri nke ahụ na nkọwa ala peeji ka a ghara imechi nghọta okwu Grik ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “onye ọ bụla” gosipụta ọnọdụ izugbe ahụ; e jikwa otu okwu “ndụ” n’akụkụ abụọ ahụ chekwaa ndakọrịta na ilu dị n’akwụkwọ mbụ.
