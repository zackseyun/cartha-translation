  yaml_path: translation/nt/matthew/016/015.yaml
  text: He says to them[a], “But who do you say that I am?”
translation:
  language: ig
  text: Ọ sịrị ha, “Ma unu, ònye ka unu na-ekwu na m bụ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Ọ sịrị
  rationale: Ọ bụ historical present n’asụsụ Grik; n’akụkọ Igbo, oge gara aga bụ ụzọ ebumpụta ụwa isi kọọ ihe ahụ n’enweghị mgbanwe n’ihe ọ pụtara.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnochiaha dative plural ahụ na-egosi ndị ọ gwara okwu.
- source_word: Ὑμεῖς
  choice: unu onwe unu
  rationale: Nnochiaha ahụ e kwuru kpọmkwem nwere nkwusi ike ma na-eme ka echiche ndị na-eso ụzọ dị iche na echiche ndị ọzọ e kwuru tupu ya.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ihe ndị ọzọ kwuru na ihe ndị na-eso ụzọ ahụ kwuru.
- source_word: τίνα
  choice: ònye
  rationale: Nke a bụ ajụjụ gbasara onye Jizọs bụ; ‘ònye’ bụ okwu Igbo doro anya ma bụrụ nke ebumpụta ụwa.
- source_word: με
  choice: m
  rationale: Ọ bụ onye a na-ekwu banyere ya n’usoro accusative-and-infinitive; Igbo na-egosipụta ya n'ụzọ ebumpụta ụwa n’ahịrịokwu ‘na m bụ.’
- source_word: λέγετε
  choice: unu na-asị
  rationale: Ọ na-edobe present active nke Grik ma na-enye ajụjụ ahụ n’Igbo dị ugbu a ma bụrụkwa nke nkịtị.
- source_word: εἶναι
  choice: na m bụ
  rationale: Nke a bụ ntụgharị Igbo ebumpụta ụwa nke infinitive εἶναι n’okwu a kọrọ n’ụzọ na-apụtaghị ozugbo.
theological_decisions:
- issue: Nkwusi ike n’ihe ndị na-eso ụzọ n’onwe ha kwuru banyere Jizọs
  choice: “Ma unu onwe unu, ònye ka unu na-asị na m bụ?”
  alternative: “Ma ònye ka unu na-asị na m bụ?”
  rationale: ‘Unu onwe unu’ na-echekwa nkwusi ike nke Ὑμεῖς na ọdịiche δὲ gosiri, ma ọ naghị etinye azịza ma ọ bụ nkwupụta okwukwe nke amaokwu na-esote n’ime amaokwu a.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ajụjụ ‘ònye ka unu na-asị na m bụ?’ dịka ụzọ Igbo ebumpụta ụwa isi kwuo accusative-and-infinitive nke Grik; enweghị mkpa maka nkọwa ala peeji.
