- from: Ọ sịrị ha, “Ma unu onwe unu, ònye ka unu na-asị na m bụ?”
  to: Ọ sịrị ha, “Ma unu, ònye ka unu na-ekwu na m bụ?”
  rationale: The revision removes an unnecessarily intensified reflexive expression and uses a more natural Igbo verb for the disciples’ expressed judgment. It preserves the contrast, question, and theological openness of the Greek text.
