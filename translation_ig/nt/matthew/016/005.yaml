id: MAT.16.5
reference: Matthew 16:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐλθόντες οἱ ⸀μαθηταὶ εἰς τὸ πέραν ἐπελάθοντο ἄρτους λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/005.yaml
  text: And when the disciples came to the other side[a], they had forgotten to take bread.
translation:
  language: ig
  text: Mgbe ndị na-eso ụzọ rutere n'akụkụ nke ọzọ, ha echefuola iwere achịcha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες
  choice: Mgbe ... rutere
  rationale: A kọwara participle aorist ahụ dị ka oge ihe mere—“Mgbe ... rutere”—iji gosi njikọ ya na ngwaa bụ isi n'Igbo dị mfe ma kwekọọ n'isi mmalite.
- source_word: οἱ μαθηταὶ
  choice: ndị na-eso ụzọ ya
  rationale: N'okwu Oziọma a, μαθηταί bụ ndị na-eso Jizọs ụzọ; itinye “ya” na-eme ka okwu Igbo doo anya n'enweghị ịgbanwe onye a na-ekwu banyere ya.
- source_word: εἰς τὸ πέραν
  choice: n'akụkụ nke ọzọ
  rationale: Nke a bụ ụzọ Igbo sitere n'okike isi kwuo iru n'ofe ọzọ nke ọdọ mmiri ahụ, ma na-edobe okwu Grik n'ụzọ ziri ezi.
- source_word: ἐπελάθοντο
  choice: ha echefuola
  rationale: Ụdị a na-egosi na ichefu achịcha ahụ emeela tupu ha erute n'akụkụ nke ọzọ, dịka usoro akụkọ ahụ si dị.
- source_word: ἄρτους
  choice: achịcha
  rationale: Ọ bụ ezie na okwu Grik dị n'ụdị ọtụtụ, “achịcha” bụ aha ihe a na-agụkarịghị ọnụ n'Igbo ma na-ekwupụta ihe ha kwesịrị iburu n'ụzọ ebumpụta ụwa; ya mere nkọwa ala peeji adịghị mkpa.
- source_word: λαβεῖν
  choice: iwere
  rationale: Infinitive a mezuru ihe ha chefuru ime. “Iwere” na-egosipụta λαβεῖν kpọmkwem karịa “iburu,” ọ bụkwa okwu Igbo sitere n'okike n'ọnọdụ a.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe ma nwee ugwu. E jiri “ndị na-eso ụzọ ya” mee ihe maka μαθηταί, ma zere okwu ụka pụrụ iche. Enweghị akara nkọwa ala peeji n'ihi na ọdịiche singular/plural nke “achịcha” anaghị akpata mgbagwoju anya n'Igbo.
