id: MAT.16.21
reference: Matthew 16:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: ig
  text: Site n’oge ahụ gawa, Jizọs malitere igosi ndị na-eso ụzọ ya na ọ ghaghị ịga Jerusalem, taa ọtụtụ ahụhụ[a] n’aka ndị okenye, ndị isi nchụaja na ndị odeakwụkwọ[b], ka e gbuo ya, nakwa ka a kpọlite ya n’ụbọchị nke atọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “taa ahụhụ nke ukwuu.” N’asụsụ Grik, okwu ya kpọmkwem bụ “taa ọtụtụ ihe,” nke nwere ike imesi ụdị ahụhụ dị iche iche ike.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’aka ndị okenye, ndị isi nchụaja na ndị odeakwụkwọ.”
    reason: alternative_reading
  - marker: c
    text: 'Ma ọ bụ, “bilie.” Okwu Grik dị n’ụdị nnara-eme: “ka a kpọlite ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Malite n’oge ahụ
  rationale: Nke a na-egosi mmalite akụkụ ọhụrụ n’akụkọ ahụ ma na-echekwa echiche oge dị na Grik.
- source_word: ἤρξατο δεικνύειν
  choice: malitere igosi
  rationale: Ọ na-echekwa ma echiche mmalite ọhụrụ ahụ ma isi nghọta nke ‘igosi’ ma ọ bụ ime ka a mara.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ndị na-amụ ihe n’aka onye nkuzi ma na-eso ya.
- source_word: δεῖ αὐτὸν
  choice: ọ ghaghị
  rationale: ‘Ọ ghaghị’ na-egosipụta mkpa siri ike dị n’ahịrịokwu Grik, ma ọ naghị akọwapụta ebe mkpa ahụ si bịa karịa ihe ederede kwuru.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: ịga Jerusalem
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo ngagharị ruo ebe a kpọrọ aha.
- source_word: πολλὰ παθεῖν
  choice: taa ọtụtụ ahụhụ
  rationale: Ọ na-egosipụta ọtụtụ ụdị ahụhụ dị na πολλὰ, ọ bụghị naanị ịdị ukwuu nke ahụhụ ahụ.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: site n’aka ndị okenye, ndị isi nchụaja na ndị odeakwụkwọ
  rationale: ‘Site n’aka’ na-egosipụta isi mmalite ma ọ bụ ndị kpatara ahụhụ ahụ. A họọrọ aha ndị otu atọ ahụ n’ụzọ dị nso n’okwu Grik.
- source_word: ἀποκτανθῆναι
  choice: ka e gbuo ya
  rationale: Nke a na-echekwa ọdịdị nnara-eme nke okwu Grik ma bụrụ Igbo doro anya.
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: ka a kpọlite ya n’ụbọchị nke atọ
  rationale: Nke a na-echekwa ọdịdị nnara-eme nke ἐγερθῆναι ma ghara ịgbanwe ya ka ọ bụrụ naanị ‘ibilie.’
theological_decisions:
- issue: Ike na isi mmalite nke δεῖ n’amụma banyere ahụhụ Jizọs
  choice: ọ ghaghị
  alternative: ọ dị mkpa ka ọ
  rationale: Ederede ahụ na-ekwupụta mkpa, ma n’ebe a ọ kọwaghị kpọmkwem ma mkpa ahụ sitere n’iwu Chineke, mmezu Akwụkwọ Nsọ, ma ọ bụ ihe ọzọ. ‘Ọ ghaghị’ na-echekwa ịdị arọ na nghọta a na-edozighị.
- issue: Ụdị nnara-eme nke ἐγερθῆναι
  choice: ka a kpọlite ya
  alternative: ka o bilie
  rationale: Okwu Grik dị n’ụdị nnara-eme. Ịchekwa ya na-ahapụ okwu ahụ ka ọ gosipụta na a kpọlitere Jizọs, n’ebughị ụzọ kọwaa onye mere ya n’ahịrịokwu a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A hapụrụ aha otu ndị ndu Juu n’ụzọ dị nso n’ederede mbụ. ‘Ndị odeakwụkwọ’ bụ nsụgharị nso nke γραμματεῖς, n’agbanyeghị na n’ọnọdụ a ha bụ ndị maara ma na-akụzi Iwu. E chekwara usoro nnara-eme n’okwu gbasara igbu na ịkpọlite Jizọs.
