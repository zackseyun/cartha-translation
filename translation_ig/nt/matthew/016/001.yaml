review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys all major elements of the Greek: the Pharisees and Sadducees approach Jesus, test him, and ask for a sign originating from heaven. However, the finite past action ἐπηρώτησαν needs an explicit past-tense Igbo form, “rịọrọ,” rather than “rịọ.”'
  naturalness: The sequence “ka ha na-anwale ya, rịọ ya” is not fully natural or grammatically well-formed as a narrative clause in Standard Igbo. “Na-anwale ya, wee rịọrọ ya” gives a clear participial/background action followed by the completed request.
  terminology: “Ndị Farisii,” “ndị Sadusii,” “ihe ịrịba ama,” and “sitere n’eluigwe” are suitable Standard Igbo choices. “Na-anwale ya” appropriately preserves the lexical breadth and hostile contextual force of πειράζοντες without making the interpretation overly specific.
  issues:
  - severity: medium
    issue: The main verb is not marked as completed past narrative action.
    rationale: Greek ἐπηρώτησαν is aorist and states that they asked. In this context, Standard Igbo “rịọrọ ya” is required; bare “rịọ ya” does not adequately express the completed action.
  - severity: low
    issue: The connector “ka ha na-anwale ya” is awkward in the verse’s narrative syntax.
    rationale: “Ka” can suggest purpose or introduce a subordinate construction that is less direct than the Greek participle. “Na-anwale ya, wee rịọrọ ya” is natural and retains the testing as accompanying/background action.
  revised_text: Ndị Farisii na ndị Sadusii bịakwutere ya, na-anwale ya, wee rịọrọ ya ka o gosi ha ihe ịrịba ama sitere n’eluigwe.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “na-anwa ya ọnwụnwa,” ma ọ bụ, “na-achọ ijide ya n’okwu.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the narrative verb to “rịọrọ” and replaces the awkward subordinate construction with an idiomatic participial sequence. It retains the source’s ambiguity concerning πειράζοντες and preserves the requested sign’s heavenly origin.
