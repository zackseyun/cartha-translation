id: MAT.16.1
reference: Matthew 16:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: ig
  text: Ndị Farisii na ndị Sadusii bịakwutere ya, na-anwale ya, wee rịọrọ ya ka o gosi ha ihe ịrịba ama sitere n’eluigwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: bịakwutere ya
  rationale: Nke a na-egosi na ha bịara nso n’ebe Jizọs nọ; ọ bụkwa okwu Igbo doro anya ma kwekọọ n’ọrụ participle ahụ.
- source_word: Φαρισαῖοι
  choice: ndị Farisii
  rationale: Ọ bụ nsụgharị-ụda aha otu okpukpe a nke a na-aghọta n’Igbo.
- source_word: Σαδδουκαῖοι
  choice: ndị Sadusii
  rationale: Ọ bụ nsụgharị-ụda aha otu okpukpe a nke a na-aghọta n’Igbo.
- source_word: πειράζοντες
  choice: ka ha na-anwale ya
  rationale: “Na-anwale” na-edobe isi echiche nke πειράζω na ebumnobi mmegide dị n’okwu a, n’etinyeghị nkọwa karịrị ihe Grik kwuru.
- source_word: ἐπηρώτησαν
  choice: rịọ ya
  rationale: N’usoro a, ngwaa ahụ na infinitive ἐπιδεῖξαι pụtara ịrịọ mmadụ ka o mee ihe; “rịọ ya ka” bụ Igbo ebumpụta ụwa.
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: Nke a na-edobe okwu izugbe “ihe ịrịba ama” n’agbakwụnyeghị “ọrụ ebube,” ọ bụ ezie na ọnọdụ ahụ nwere ike ịpụta ya.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: sitere n’eluigwe
  rationale: Nke a na-egosi isi mmalite nke ihe ịrịba ama ahụ n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ nke ọma.
- source_word: ἐπιδεῖξαι
  choice: ka o gosi ha
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa isi kwuo infinitive nke pụtara igosi ma ọ bụ ime ka ha hụ.
theological_decisions:
- issue: Ụdị iro dị n’arịrịọ ndị Farisii na ndị Sadusii
  choice: A sụgharịrị πειράζοντες dịka “ka ha na-anwale ya.”
  alternative: “ka ha na-anwa ya ọnwụnwa” ma ọ bụ “ka ha na-achọ ijide ya n’okwu.”
  rationale: “Na-anwale ya” na-echekwa mgbagwoju anya okwu Grik na ọnọdụ mmegide ya, ma ọ naghị ekpebi kpọmkwem na ha na-anwa ya ọnwụnwa ma ọ bụ na-achọ ọnyà okwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “rịọ ya ka” kama ntụgharị siri ike nke “jụọ ya ka,” n’ihi na ọ dabara n’usoro ngwaa Grik na infinitive ya.
