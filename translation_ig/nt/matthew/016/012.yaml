id: MAT.16.12
reference: Matthew 16:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: ig
  text: Mgbe ahụ, ha ghọtara na ọ gwaghị ha ka ha kpachara anya maka ihe na-eko achịcha[a], kama ka ha kpachara anya maka ozizi ndị Farisii na ndị Sadusii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe na-eko ogbe achịcha ndị ahụ.” N’asụsụ Grik, okwu a sụgharịrị “achịcha” dị n’ụdị ọtụtụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi oge ndị na-eso ụzọ Jizọs mechara ghọta ihe ọ pụtara; nke a bụ okwu Igbo doro anya ma na-aga were were.
- source_word: συνῆκαν
  choice: ha ghọtara
  rationale: Ngwaa a na-egosi na nghọta bịara ha n'oge ahụ; ‘ha ghọtara’ na-enye echiche ahụ n'Igbo nkịtị.
- source_word: οὐκ εἶπεν
  choice: ọ gwaghị ha
  rationale: Ọ bụ ezie na ‘ha’ adịghị ka nnọchiaha kpọmkwem n'okwu Grik, itinye ya na-eme ka Igbo doo anya n'enweghị ịgbanwe onye a na-agwa okwu.
- source_word: προσέχειν ἀπό
  choice: ka ha kpachara anya maka
  rationale: N'ebe a, προσέχω na ἀπό jikọtara ọnụ pụtara ịnọ na nche megide ihe; ‘kpachara anya maka’ bụ ụzọ Igbo sitere n'okike isi kwuo ya.
- source_word: ζύμη
  choice: ihe na-eko achịcha
  rationale: Nke a na-egosipụta ihe a na-etinye n'ime ntụ ọka ka ọ koo, ma na-edebekwa ihe atụ dị n'okwu ahụ kama ịkọwa ya karịa ihe ederede kwuru.
- source_word: τῶν ἄρτων
  choice: achịcha
  rationale: Ọ bụ ezie na aha Grik a dị n'ụdị ọtụtụ, ‘achịcha’ bụ aha a na-ejikarị n'Igbo ekwu ihe a n'ozuzu ya; ihe odide ala peeji na-edebe ụzọ ọzọ si ghọta ụdị ọtụtụ ahụ.
- source_word: ἀλλὰ
  choice: kama
  rationale: ‘Kama’ na-egosi ọdịiche siri ike dị n'etiti ihe na-eko achịcha n'ụzọ nkịtị na ozizi e bu n'obi.
- source_word: διδαχῆς
  choice: ozizi
  rationale: ‘Ozizi’ bụ okwu Igbo a na-aghọta nke ọma maka ihe a na-akụzi, n'enweghị ịgbakwụnye ikpe banyere ọdịdị ozizi ahụ.
- source_word: Φαρισαίων καὶ Σαδδουκαίων
  choice: ndị Farisii na ndị Sadusii
  rationale: A na-ede aha ìgwè abụọ ahụ n'ụdị a na-ejikarị eme ihe n'Igbo, tinyekwa ‘ndị’ iji gosi na ha bụ ìgwè mmadụ.
theological_decisions:
- issue: Ihe atụ nke ihe na-eko achịcha
  choice: E debere ‘ihe na-eko achịcha’ n'ahịrị mbụ, ma mee ka ahịrị nke abụọ kọwaa na ihe e bu n'obi bụ ozizi ndị Farisii na ndị Sadusii.
  alternative: Ịsụgharị ya ozugbo dịka ‘ozizi ọjọọ,’ ‘ihu abụọ,’ ma ọ bụ ‘ozizi na-emebi mmadụ.’
  rationale: Amaokwu a n'onwe ya kọwara ihe atụ ahụ dịka ‘ozizi,’ ma ọ kọwaghị ya ọzọ n'ebe a. Ya mere, nsụgharị ahụ anaghị ebubata nkọwa sitere n'akụkụ ọzọ ma ọ bụ n'echiche otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E kwughachiri ‘ka ha kpachara anya maka’ n'akụkụ nke abụọ ka ọdịiche ahụ doo anya ma ka ahịrịokwu ahụ bụrụ Igbo sitere n'okike.
