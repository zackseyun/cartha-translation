id: MAT.16.6
reference: Matthew 16:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: ig
  text: Ma Jizọs sịrị ha, “Lezienụ anya, zerenụ ihe na-eko achịcha[a] nke ndị Farisii na ndị Sadusii.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “yist.” N’asụsụ Grik, okwu a pụtara ihe na-eme ka ntụ ọka koo, ma e ji ya mee ihe atụ; Jizọs mechara jikọta ya na ozizi ndị Farisii na ndị Sadusii.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’ihe a na-ekwu; “Ma” dabara n’usoro okwu ebe a.
- source_word: εἶπεν αὐτοῖς
  choice: sịrị ha
  rationale: Nke a bụ ụzọ Igbo nkịtị ma doo anya si akọ λέγω ya na ndị a gwara okwu.
- source_word: Ὁρᾶτε
  choice: Lezienụ anya
  rationale: N’ebe a, iwu a abụghị naanị ịhụ ihe anya kama ọ bụ ịdọ aka ná ntị ka ha mụrụ anya.
- source_word: προσέχετε
  choice: kpachapụnụ anya
  rationale: Ọ na-eme ka ịdọ aka ná ntị ahụ sie ike; ijigide iwu abụọ ahụ na-echekwa nkwughachi e ji mesie okwu ike na Grik.
- source_word: ἀπὸ
  choice: maka
  rationale: Ya na ngwaa ịdọ aka ná ntị, “maka” na-eme ka okwu ahụ bụrụ Igbo sitere n’ọnụ ma na-egosi ihe ha ga-akpachara anya banyere ya.
- source_word: ζύμης
  choice: ihe na-eko achịcha
  rationale: Ọ bụ okwu Igbo doro ndị nkịtị anya maka ihe na-eme ka ntụ ọka koo, ma ọ ka na-edobe ya dịka ihe atụ kama ịkọwa ihe ihe atụ ahụ pụtara n’amaokwu a.
- source_word: Φαρισαίων
  choice: ndị Farisii
  rationale: Nke a bụ nsụgharị mkpụrụokwu a na-ejikarị akpọ òtù ahụ n’Igbo.
- source_word: Σαδδουκαίων
  choice: ndị Sadusii
  rationale: Nke a bụ nsụgharị mkpụrụokwu a na-ejikarị akpọ òtù ahụ n’Igbo.
theological_decisions:
- issue: Ihe atụ dị na ζύμης
  choice: Idobe “ihe na-eko achịcha” dịka ihe atụ n’amaokwu bụ isi.
  alternative: Ịsụgharị ya ozugbo dịka “ozizi” ma ọ bụ “mmetụta.”
  rationale: Jizọs kọwara ihe atụ ahụ n’amaokwu ndị na-esote, ma amaokwu a n’onwe ya kwuru ζύμης. Idobe ihe atụ ahụ anaghị ebute nkọwa nke e nyere mgbe e mesịrị n’ihu oge.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. E debere nkwughachi nke iwu abụọ ahụ iji chekwaa ike ịdọ aka ná ntị dị n’asụsụ Grik.
