- from: Ma Jizọs sịrị ha, “Lezienụ anya, kpachapụnụ anya maka ihe na-eko achịcha[a] nke ndị Farisii na ndị Sadusii.”
  to: Ma Jizọs sịrị ha, “Lezienụ anya, zerenụ ihe na-eko achịcha[a] nke ndị Farisii na ndị Sadusii.”
  rationale: The revision uses an idiomatic Standard Igbo warning, “Lezienụ anya, zerenụ,” for the paired imperatives while preserving the metaphorical expression “ihe na-eko achịcha.” The footnote remains lexical and figurative in focus but aligns its explanatory wording with Matthew 16:12.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:15Z'
review_pass:
  verdict: revise
  source_fidelity: The main text preserves the transitional δέ, Jesus' speech to the disciples, the doubled warning, the figurative noun ζύμη, and both group names. However, the construction “kpachapụnụ anya maka” is not the clearest or most idiomatic way to render προσέχετε ἀπό in this warning.
  naturalness: “Lezienụ anya, zerenụ ...” is natural Standard Igbo, retains the twofold imperative warning, and clearly conveys avoidance of the figurative “ihe na-eko achịcha.”
  terminology: “Ihe na-eko achịcha” appropriately retains the metaphor rather than prematurely replacing it with “ozizi.” The footnote should identify “yist” as the lexical alternative and should say that Jesus later relates the image to the Pharisees' and Sadducees' teaching, rather than broadening the explanation to “influence.”
  issues:
  - severity: medium
    issue: The warning construction “kpachapụnụ anya maka” is awkward and weakly represents ἀπὸ.
    rationale: In Standard Igbo, “maka” more naturally introduces a topic or reason (“concerning/because of”) than the object to be avoided. “Zerenụ” naturally expresses the warning to avoid something and makes the force of προσέχετε ἀπό clear.
  - severity: low
    issue: The footnote adds “mmetụta” (“influence”) to Jesus' later explanation.
    rationale: Matthew 16:12 specifically identifies the leaven as the teaching (διδαχή) of the Pharisees and Sadducees. The note should not broaden that stated explanation.
  revised_text: Ma Jizọs sịrị ha, “Lezienụ anya, zerenụ ihe na-eko achịcha[a] nke ndị Farisii na ndị Sadusii.”
