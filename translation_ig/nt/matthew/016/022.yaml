    text: Ma ọ bụ, “O mekwala, Onyenwe anyị,” ma ọ bụ, “Chineke ekwela, Onyenwe anyị.” Okwu Grik ahụ bụ akpaalaokwu dị mkpirikpi nke a hapụrụ akụkụ ụfọdụ ya.
    reason: lexical_alternative
  revision_rationale: The revision restores a distinct rendering for Ἵλεώς σοι and leaves the emphatic denial to οὐ μὴ ἔσται σοι τοῦτο. It preserves the Greek idiom’s ellipsis by using an agent-unspecified passive (‘Ka e meere gị ebere’) and retains the more interpretive traditional alternatives in the anchored footnote.
