source:
  edition: SBLGNT
  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: ig
  text: Pita kpọọrọ ya iche, malite ịbara ya mba, sị, “Ka e meere gị ebere, Onyenwe anyị[a]; ihe a agaghị eme gị ma ọlị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “O mekwala, Onyenwe anyị,” ma ọ bụ, “Chineke ekwela, Onyenwe anyị.” Okwu Grik ahụ bụ akpaalaokwu dị mkpirikpi nke a hapụrụ akụkụ ụfọdụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος
  choice: kpọọrọ ya iche
  rationale: N’ọnọdụ a, okwu Grik ahụ na-egosi na Pita kpọọrọ Jizọs n’akụkụ ka o gwa ya okwu na nzuzo; nsụgharị a na-ewepụta echiche ahụ n’Igbo doro anya.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: malite ịbara ya mba
  rationale: ἤρξατο na infinitive na-egosi mmalite omume ahụ, ebe ἐπιτιμάω pụtara ịba mmadụ mba ma ọ bụ ịkatọ ya ike.
- source_word: Ἵλεώς σοι
  choice: ka ihe dị otu a ghara ime gị
  rationale: Nke a bụ akpaalaokwu Grik dị mkpirikpi nke echiche ya ezughị ezu n’ụdị mkpụrụokwu. Nsụgharị a na-egosipụta arịrịọ Pita ka ihe Jizọs kwuru ghara iru ya, na-etinyeghị aha Chineke nke na-adịghị n’ahịrịokwu Grik ahụ. E debere ụzọ nsụgharị ndị ọzọ n’ala ala peeji.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: Nke a na-echekwa isi ihe κύριος pụtara nakwa nkwanye ùgwù Pita ji akpọ Jizọs.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: Ihe a agaghị eme gị ma ọlị
  rationale: Njikọ οὐ μή na ngwaa ọdịnihu bụ nkwụsi ike siri ike; “ma ọlị” na-egosipụta ike nkwugide ahụ n’Igbo.
theological_decisions:
- issue: Ịsụgharị mkpesa Pita n’etinyeghị nkọwa okpukpe nke okwu Grik ahụ ekwughị hoo haa
  choice: Onyenwe anyị, ka ihe dị otu a ghara ime gị! Ihe a agaghị eme gị ma ọlị.
  alternative: Ka e meere gị ebere, Onyenwe anyị; ma ọ bụ, Chineke ekwela, Onyenwe anyị.
  rationale: Ἵλεώς σοι bụ akpaalaokwu na-adịghị akọwa onye na-eme ebere, ya mere isi nsụgharị ahụ ezere ịgbakwunye “Chineke,” ma na-echekwa ebumnuche Pita nke ịjụ na ahụhụ ahụ agaghị eru Jizọs. Ihe e dere n’ala ala peeji na-echekwa nghọta ndị ọzọ sitere n’usoro okwu Grik ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ịbara ya mba” na-egosipụta nkwuwa okwu Pita, ebe “kpọọrọ ya iche” na-egosi na ọ dọọrọ Jizọs n’akụkụ. Akara [a] dị n’ebe akpaalaokwu Grik ahụ pụtara n’isi ederede.
