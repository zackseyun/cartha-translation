revisions:
- from: Pita kpọọrọ ya iche, malite ịbara ya mba, sị, “Onyenwe anyị, ka ihe dị otu a ghara ime gị[a]! Ihe a agaghị eme gị ma ọlị.”
  to: Pita kpọọrọ ya iche, malite ịbara ya mba, sị, “Ka e meere gị ebere, Onyenwe anyị[a]; ihe a agaghị eme gị ma ọlị.”
  rationale: The revision restores a distinct rendering for Ἵλεώς σοι and leaves the emphatic denial to οὐ μὴ ἔσται σοι τοῦτο. It preserves the Greek idiom’s ellipsis by using an agent-unspecified passive (‘Ka e meere gị ebere’) and retains the more interpretive traditional alternatives in the anchored footnote.
  reviewer_model: gpt-5.6-terra
