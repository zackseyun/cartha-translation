id: MAT.16.11
reference: Matthew 16:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πῶς οὐ νοεῖτε ὅτι οὐ περὶ ⸀ἄρτων εἶπον ὑμῖν; ⸂προσέχετε δὲ⸃ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: ig
  text: Olee otu unu si ghara ịghọta na ọ bụghị banyere achịcha ka m gwara unu okwu? Ma kpacharanụ anya ka unu zere ihe iko achịcha nke ndị Farisii na ndị Sadusii[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ma zerenụ ihe iko achịcha nke ndị Farisii na ndị Sadusii.”
    reason: lexical_alternative
  - marker: b
    text: “Ihe iko achịcha” bụ ihe atụ n’ebe a; n’amaokwu na-esote, a kọwara ya dịka ozizi ndị Farisii na ndị Sadusii.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: Olee otu unu si ghara ịghọta
  rationale: Ajụjụ a bụ ịba mba n’ụzọ dị nro banyere enweghị nghọta ha; nsụgharị a na-edobe ụdị ajụjụ na ike okwu Grik ahụ.
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: na ọ bụghị banyere achịcha ka m gwara unu okwu
  rationale: Ọ bụ ezie na ἄρτων dị n’ụdị ọtụtụ, ‘achịcha’ bụ okwu mkpokọta dị mma n’Igbo n’ebe a. ‘Gwara unu okwu’ na-egosi εἶπον ὑμῖν n’ụzọ doro anya.
- source_word: προσέχετε ... ἀπό
  choice: kpacharanụ anya maka
  rationale: N’ebe a, iwu ahụ bụ ịdọ aka ná ntị ka ha chebe onwe ha pụọ n’ihe ahụ, ọ bụghị naanị ka ha gee ntị.
- source_word: δὲ
  choice: Kama
  rationale: 'δὲ na-egosi ntụgharị nwere obere ọdịiche: okwu Jizọs abụghị banyere achịcha nkịtị, kama ọ bụ ịdọ aka ná ntị.'
- source_word: τῆς ζύμης
  choice: ihe iko achịcha
  rationale: Okwu a na-edobe ihe atụ nke ζύμη, ya bụ ihe a na-etinye n’ụgbọ achịcha ka ọ koo, kama ịkọwa ya ozugbo dịka ‘ozizi.’
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: nke ndị Farisii na ndị Sadusii
  rationale: Aha ndị a bụ ntụgharị-ụda ndị a na-amata n’Igbo maka òtù ndị Juu ahụ; njikọ ‘nke’ na-edobe genitive nke isi mmalite.
theological_decisions:
- issue: Ihe atụ dị n’okwu ζύμη
  choice: Idobe ‘ihe iko achịcha’ n’ahịrịokwu bụ isi n’akọwaghị ya dịka ‘ozizi.’
  alternative: ‘Kpacharanụ anya maka ozizi ndị Farisii na ndị Sadusii.’
  rationale: Amaokwu na-esote na-akọwa ihe atụ ahụ dịka ozizi ha, ma amaokwu a n’onwe ya ji ζύμη mee ihe atụ. Idobe ihe atụ ahụ na-echekwa usoro na esemokwu nke isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Kpacharanụ anya’ nwere ike ịdọ aka ná ntị nke προσέχετε, ebe ‘ihe iko achịcha’ na-eme ka ihe atụ ahụ doo ndị na-agụ Igbo anya.
