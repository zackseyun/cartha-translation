source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· ⸂Ὀψίας γενομένης λέγετε· Εὐδία, πυρράζει γὰρ ὁ οὐρανός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/002.yaml
  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: ig
  text: Ma ọ zara ha sị, “Mgbe mgbede rutere, unu na-asị, ‘Ihu igwe ga-adị mma, n’ihi na mbara igwe[a] na-acha ọbara ọbara.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “eluigwe na-acha ọbara ọbara.” N’ebe a, okwu Grik ahụ pụrụ ịpụta ma “mbara igwe” ma “eluigwe,” ma ilu banyere ihu igwe a na-ekwu na-ezo aka na mbara igwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ọ zara ha sị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke kwesịrị ekwesị isi chekwaa usoro okwu Grik ahụ nke pụtara ‘ọ zara wee sị,’ na-enweghị ime ka okwu ahụ sie ike.
- source_word: Ὀψίας γενομένης
  choice: Mgbe chi jiri
  rationale: Nkebiokwu a na-egosi oge mgbede; ‘mgbe chi jiri’ bụ okwu Igbo nkịtị nke na-enye otu nghọta ahụ.
- source_word: λέγετε
  choice: unu na-asị
  rationale: Oge ugbu a nke ngwaa Grik na-egosi ihe ha na-ekwukarị; ‘unu na-asị’ na-egosipụta omume a na-eme ugboro ugboro.
- source_word: Εὐδία
  choice: Ihu igwe ga-adị mma
  rationale: Okwu ahụ na-ezo aka n’ọnọdụ ihu igwe dị mma ma doo anya. Itinye ‘ga-’ dabara n’ụdị amụma ihu igwe nke ilu a na-ekwu.
- source_word: πυρράζει
  choice: na-acha ọbara ọbara
  rationale: Nke a na-akọwa agba uhie nke mbara igwe n'ụzọ doro anya ma bụrụ nke mmadụ niile ga-aghọta.
- source_word: οὐρανός
  choice: mbara igwe
  rationale: N’ebe a, okwu Grik ahụ pụtara mbara igwe a na-ahụ anya n’ihe gbasara ihu igwe, ọ bụghị eluigwe dị ka ebe ime mmụọ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘mbara igwe’ iji mee ka ọnọdụ ihu igwe doo anya, ma e tinyeghị nkọwa ụka ọ bụla.
