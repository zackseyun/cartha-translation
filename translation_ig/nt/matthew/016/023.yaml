id: MAT.16.23
reference: Matthew 16:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: ig
  text: Ma ọ tụgharịrị gwa Pita, sị, “Laa n’azụ m, Setan! Ị bụụrụ m ihe ịsụ ngọngọ, n’ihi na ị naghị etinye uche gị n’ihe Chineke, kama n’ihe ụmụ mmadụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: ọ tụgharịrị
  rationale: Aorist participle a na-arụ ọrụ n’ụzọ intransitive; ‘ọ tụgharịrị’ na-egosipụta mmegharị ahụ tupu okwu ahụ n’Igbo eke.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Laa n’azụ m
  rationale: ‘Laa’ na-egosipụta iwu ὕπαγε, ebe ‘n’azụ m’ na-echekwa ihe gbasara ọnọdụ dị na ὀπίσω μου nakwa njikọ ya na echiche iso onye n’azụ.
- source_word: Σατανᾶ
  choice: Setan
  rationale: Aha/utu aha a na-akpọ mmadụ kpọmkwem ka e chekwara ya; ọ naghị ekpebi ma a na-akpọ Pita Setan n’onwe ya ka ọ bụ na ọ na-arụ ọrụ onye iro.
- source_word: σκάνδαλον
  choice: ihe ịsụ ngọngọ
  rationale: Nhọrọ a na-echekwa ihe atụ nke ihe na-eme ka mmadụ sụọ ngọngọ, kama ime ka okwu ahụ bụrụ naanị ‘iwe’ ma ọ bụ ‘mmejọ.’
- source_word: ἐμοῦ
  choice: nye m
  rationale: N’usoro Igbo, ‘ihe ịsụ ngọngọ nye m’ na-egosi onye ihe mgbochi ahụ metụtara n’ụzọ doro anya.
- source_word: φρονεῖς
  choice: uche gị adịghị ... ọ dị
  rationale: Okwu a na-egosi nghọta, mmasị, na ntụziaka nke uche, ọ bụghị naanị echiche na-agafe agafe.
- source_word: τὰ τοῦ θεοῦ
  choice: ihe nke Chineke
  rationale: A hapụrụ okwu ahụ nso n’usoro Grik iji chekwaa obosara ya na ọdịiche e mere n’etiti nke Chineke na nke mmadụ.
- source_word: τὰ τῶν ἀνθρώπων
  choice: ihe nke ụmụ mmadụ
  rationale: ‘Ụmụ mmadụ’ bụ okwu Igbo nkịtị nke na-anọchi mmadụ niile ma na-echekwa ọdịiche dị n’etiti ihe nke Chineke na ihe nke mmadụ.
theological_decisions:
- issue: Ike na ihe okwu ‘Setan’ a gwara Pita pụtara
  choice: A kpọrọ Pita ‘Setan’ ozugbo n’okwu ahụ, n’enweghị nkọwa gbakwunyere banyere ụdị njikọ ya na Setan.
  alternative: Ịsụgharị ya ‘onye iro,’ ma ọ bụ ịkọwa na Jizọs na-agwa Setan na-arụ ọrụ site n’aka Pita.
  rationale: Grik ahụ nwere ịba mba siri ike ma hapụkwa ajụjụ banyere kpọmkwem ihe njirimara ahụ pụtara; ntụgharị ahụ kwesịkwara ichekwa esemokwu nkọwa ahụ.
- issue: Ihe φρονεῖς pụtara n’ihe gbasara uche
  choice: ‘uche gị adịghị ... kama ọ dị’
  alternative: ‘ị naghị eche banyere’
  rationale: Nhọrọ a na-egosi ọnọdụ na ntụziaka nke uche Pita, ọ bụghị nanị ihe ọ na-eche n’otu ntabi anya.
- issue: Nnọchite mmadụ niile na ἀνθρώπων
  choice: ‘ụmụ mmadụ’
  alternative: ‘ndị nwoke’
  rationale: N’ebe a, ọtụtụ ἀνθρώπων na-arụ ọrụ n’ụzọ nnọchite mmadụ n’ozuzu ya. ‘Ụmụ mmadụ’ bụ okwu Igbo ziri ezi ma ghara ime ka ndị na-agụ ya chee na naanị ụmụ nwoke ka e kwuru.
translation_notes:
  register: E jiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ịdị nkọ nke ịba mba ahụ, ihe atụ nke ịsụ ngọngọ, na ọdịiche yiri ibe ya n’etiti ‘ihe nke Chineke’ na ‘ihe nke ụmụ mmadụ.’
