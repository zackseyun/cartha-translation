- from: Ma ọ tụgharịrị gwa Pita, sị, “Laa n’azụ m, Setan! Ị bụ ihe ịsụ ngọngọ nye m, n’ihi na uche gị adịghị n’ihe nke Chineke, kama ọ dị n’ihe nke ụmụ mmadụ.”
  to: Ma ọ tụgharịrị gwa Pita, sị, “Laa n’azụ m, Setan! Ị bụụrụ m ihe ịsụ ngọngọ, n’ihi na ị naghị etinye uche gị n’ihe Chineke, kama n’ihe ụmụ mmadụ.”
