review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the turning, direct address to Peter, imperative command, designation “Setan,” stumbling-block metaphor, and the contrast between God’s concerns and human concerns. The phrase “ihe ịsụ ngọngọ nye m” is understandable but does not express the Greek relation as naturally as an Igbo construction with “bụụrụ m.”
  naturalness: A small revision improves idiomatic Standard Igbo. “Ị bụụrụ m ihe ịsụ ngọngọ” is a more natural way to say that Peter is a stumbling block in relation to Jesus. “Ị naghị etinye uche gị n’ihe Chineke ...” clearly expresses φρονεῖς as settled mental orientation and avoids the somewhat stiff repetition of “uche gị adịghị ... kama ọ dị.”
  terminology: “Setan,” “Pita,” “ihe ịsụ ngọngọ,” “Chineke,” and “ụmụ mmadụ” are appropriate Standard Igbo terms. “Ụmụ mmadụ” rightly represents ἀνθρώπων inclusively and does not impose an interpretation of Jesus’ address to Peter.
  issues:
  - severity: low
    issue: The expression “ihe ịsụ ngọngọ nye m” is less idiomatic for the relation expressed by σκάνδαλον ἐμοῦ.
    rationale: Using “Ị bụụrụ m ihe ịsụ ngọngọ” more naturally presents Peter as an obstacle/stumbling block to Jesus while retaining the metaphor.
  - severity: low
    issue: “uche gị adịghị n’ihe ... kama ọ dị n’ihe ...” is grammatically possible but stylistically stiff.
    rationale: “Ị naghị etinye uche gị n’ihe Chineke, kama n’ihe ụmụ mmadụ” naturally conveys the ongoing orientation denoted by φρονεῖς without adding interpretive content.
  revised_text: Ma ọ tụgharịrị gwa Pita, sị, “Laa n’azụ m, Setan! Ị bụụrụ m ihe ịsụ ngọngọ, n’ihi na ị naghị etinye uche gị n’ihe Chineke, kama n’ihe ụmụ mmadụ.”
