  to: Ma Jizọs, ebe ọ matara nke a, sịrị, “Unu ndị okwukwe nta, gịnị mere unu ji na-atụgharị uche n’etiti onwe unu na unu eweghị achịcha?”[a]
  rationale: The revision restores the Greek action expressed by οὐκ ἐλάβετε, brings the vocative rebuke into its source-position prominence, and attaches the note to the precise phrase it explains. It retains the source’s contextual flexibility by placing “ewetaghị” only in the footnote rather than treating it as the sole meaning.
