id: MAT.16.8
reference: Matthew 16:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: ig
  text: Ma Jizọs, ebe ọ matara nke a, sịrị, “Unu ndị okwukwe nta, gịnị mere unu ji na-atụgharị uche n’etiti onwe unu na unu eweghị achịcha?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ kpọmkwem, “na unu eweghị ogbe achịcha.” N’ihe gbara ya gburugburu, a pụkwara ịghọta ya dịka “na unu ewetaghị achịcha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: ebe ọ matara nke a
  rationale: Na-egosipụta na Jizọs matara ihe ha na-ekwu tupu ya azaa; “nke a” sitere n’ihe gbara amaokwu ahụ gburugburu.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi obere mgbanwe ma ọ bụ ntụgharị megide mkparịta ụka ndị na-eso ụzọ.
- source_word: εἶπεν
  choice: sịrị
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke nkịtị e si webata okwu kpọmkwem.
- source_word: Τί
  choice: Gịnị mere
  rationale: N’usoro okwu a, ọ na-ajụ ihe kpatara ntụgharị uche ha, ọ bụghị nanị ihe ha na-ekwu.
- source_word: διαλογίζεσθε
  choice: ji na-atụgharị uche
  rationale: Na-ejide echiche nke ịtụle ma ọ bụ ịkparịta ihe n’etiti onwe ha, na-enweghị ime ka ọ bụrụ esemokwu siri ike.
- source_word: ἐν ἑαυτοῖς
  choice: n’etiti onwe unu
  rationale: Na-echekwa ohere na okwu ahụ na-ezo aka n’ịtụle ihe n’etiti ha; ihe gbara ya gburugburu na-egosi mkparịta ụka ha ọnụ.
- source_word: ὀλιγόπιστοι
  choice: unu ndị okwukwe nta
  rationale: Na-echekwa ịba mba Jizọs banyere ezughị oke nke okwukwe ha, n’enweghị itinye nkọwa ozizi ọzọ.
- source_word: ὅτι
  choice: na
  rationale: 'Na-webata ọdịnaya nke ihe ha na-atụgharị uche banyere ya: na ha enweghị achịcha.'
- source_word: ἄρτους
  choice: achịcha
  rationale: Igbo na-ejikarị “achịcha” dịka aha anaghị achọ igosi ọtụtụ, ma ọ na-ekpuchi echiche nke ogbe achịcha dị na Greek.
- source_word: οὐκ ἐλάβετε
  choice: unu enweghị achịcha
  rationale: Ọ bụ nsụgharị Igbo dị eke nke ọnọdụ sitere n’ịghara iwere ma ọ bụ iweta achịcha; nkọwa kpọmkwem ka e debere n’ala peeji.
theological_decisions:
- issue: Ike ịba mba dị na ὀλιγόπιστοι
  choice: unu ndị okwukwe nta
  alternative: unu ndị okwukwe unu na-ezughị oke
  rationale: Nhọrọ a na-echekwa okwu Matiu ji akọwa okwukwe dị nta ma ghara ịgbasa ya ka ọ bụrụ nkwupụta ozizi sara mbara.
- issue: Mmekọrịta ὅτι na ajụjụ ahụ
  choice: ọ na-webata ihe ha na-atụgharị uche banyere ya
  alternative: ịsụgharị ya dịka “n’ihi na,” nke ga-eme ka enweghị achịcha bụrụ ihe kpatara mkparịta ụka ahụ
  rationale: Usoro Greek nwere ike ịkpalite nghọta abụọ, ma ọdịnaya nke mkparịta ụka dabara nke ọma ebe a; ala okwu na-egosi ụzọ ọzọ n’ụzọ na-adịghị emebi esemokwu dị na isi mmalite.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke ugwu na nke a na-aghọta ngwa ngwa. E debere ụda ịba mba ahụ n’ụzọ dị nsọ ma kwụ ọtọ; a hapụrụ nkọwa nke λαμβάνω n’ala peeji iji chekwaa ihe okwu Greek nwere ike ịpụta.
