  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: ig
  text: Saịmọn Pita zara, sị, “Gị onwe gị bụ Mesaya ahụ,[a] Nwa Chineke dị ndụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst ahụ.” A pụkwara ịsụgharị aha Grik bụ Χριστός ka ọ bụrụ “Kraịst”; n'ebe a, a sụgharịrị ya “Mesaya” iji mee ka ọ pụta ìhè na ọ bụ aha ọkwa, nakwa iji chekwaa ọnọdụ ya n'olileanya ndị Juu banyere Mesaya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: zara, sị
  rationale: Ngwakọta participle ἀποκριθεὶς na finite verb εἶπεν bụ usoro e ji webata nzaghachi. ‘Zara, sị’ bụ ụzọ Igbo doro anya ma dịkwa mma isi chekwaa ma nzaghachi ahụ ma mmalite okwu kpọmkwem.
- source_word: δὲ
  choice: —
  rationale: δέ na-egosi ntakịrị njikọ ma ọ bụ ntụgharị n'akụkọ. Igbo anaghị achọ ka a tụgharịa ya iche n'ebe a, n'ihi na usoro ‘Saịmọn Pita zara’ egosilarị aga n'ihu nke akụkọ ahụ.
- source_word: Σίμων Πέτρος
  choice: Saịmọn Pita
  rationale: A sụgharịghị aha mmadụ; e dere ha n'ụdị mkpụrụokwu dabara n'usoro mkpọpụta Igbo a na-ejikarị eme ihe.
- source_word: Σὺ
  choice: Gị onwe gị
  rationale: Nnọchiaha Σὺ pụtara ìhè n'asụsụ Grik ma nwee ume pụrụ iche. ‘Gị onwe gị’ na-echekwa nrụsi ahụ n'Igbo.
- source_word: ὁ χριστὸς
  choice: Mesaya ahụ
  rationale: Χριστός bụ aha ọkwa n'ebe a, ya bụ Onye E Tere Mmanụ ahụ. ‘Mesaya ahụ’ na-echekwa ọnọdụ ya n'olileanya ndị Juu, ebe ‘ahụ’ na-egosi nkọwa doro anya nke article ὁ.
- source_word: ὁ υἱὸς
  choice: Ọkpara
  rationale: ‘Ọkpara’ bụ okwu Igbo a na-ejikarị akọwa aha ọkwa ‘the Son’ n'okwu Akwụkwọ Nsọ; ọ na-echekwa njirimara pụrụ iche nke article na noun ahụ n'ekwughị ihe karịrị isi mmalite.
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: Chineke dị ndụ
  rationale: Nkebi participle τοῦ ζῶντος na-akọwa Chineke. ‘Chineke dị ndụ’ bụ Igbo eke ma na-echekwa ọdịiche dị n'etiti Chineke dị ndụ na chi na-adịghị ndụ.
theological_decisions:
- issue: Ịsụgharị Χριστός dị ka aha ọkwa ma ọ bụ dị ka aha mmadụ
  choice: Mesaya
  alternative: Kraịst
  rationale: Nkwupụta Pita na-eji Χριστός dị ka aha ọkwa nke onye ahụ e kwere ná nkwa. ‘Mesaya’ na-eme ka nke a pụta ìhè, ebe e debere ‘Kraịst’ n'ala peeji dịka ụzọ ọzọ ziri ezi.
- issue: Ume nke ‘Ọkpara Chineke’
  choice: Ọkpara Chineke dị ndụ
  alternative: Nwa Chineke dị ndụ
  rationale: A na-echekwa okwu nkwupụta na aha ọkwa dị n'asụsụ Grik n'ịgbasaghị ya ka ọ bụrụ nkọwa ozizi e mepụtara mgbe e mesịrị. ‘Ọkpara’ na-egosi Ọkpara ahụ pụrụ iche, ma ọ naghị akọwa karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. Usoro ‘zara, sị’ bụ akpaala okwu akụkọ Igbo; ‘Gị onwe gị’ na-echekwa nrụsi ike nke nnọchiaha Grik. E zere mgbakwunye ozizi na-adịghị n'ederede.
