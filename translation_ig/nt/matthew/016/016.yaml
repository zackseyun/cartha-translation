revisions:
- from: Saịmọn Pita zara, sị, “Gị onwe gị bụ Mesaya ahụ,[a] Ọkpara Chineke dị ndụ.”
  to: Saịmọn Pita zara, sị, “Gị onwe gị bụ Mesaya ahụ,[a] Nwa Chineke dị ndụ.”
  rationale: The revision changes only ‘Ọkpara’ to ‘Nwa’ so that the translation retains the Greek filial title without adding a firstborn sense. The response formula, emphatic pronoun, messianic title, and footnote alternative are otherwise preserved; the footnote is lightly smoothed for idiomatic wording.
