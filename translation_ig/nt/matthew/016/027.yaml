reference: Matthew 16:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: ig
  text: N’ihi na Nwa nke Mmadụ na-achọ ịbịa[a] n’ebube Nna ya, ya na ndị mmụọ ozi ya; mgbe ahụkwa, ọ ga-akwụghachi onye ọ bụla dịka omume ya si dị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ga-abịa” ma ọ bụ “na-aga ịbịa.” Okwu Grik ahụ na-egosi na ọbịbịa ahụ dị nso ma ọ bụ na-achọ ime.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “dị ka ihe o mere si dị.” N’asụsụ Grik, “omume” dị n’otu, ma e ji ya kesaa okwu ahụ nye onye ọ bụla n’otu n’otu iji gosi omume ya niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει
  choice: na-achọ
  rationale: N’usoro ‘na-achọ ịbịa,’ okwu a na-egosi ihe na-eru nso ma ọ bụ ihe a na-atụ anya na ọ ga-eme, kama ime ka ọ bụrụ naanị ọdịnihu nkịtị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na nke bu ya ụzọ dịka ihe kpatara okwu ahụ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a bụ ntụgharị kpọmkwem nke aha ahụ, ma na-edobe njikọ ya na ihe oyiyi dị n’Akwụkwọ Nsọ.
- source_word: ἔρχεσθαι
  choice: ịbịa
  rationale: Ọ bụ infinitive na-esochi μέλλει, ma ‘ịbịa’ bụ okwu Igbo doro anya ma kwekọọ na ya.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: n’ebube Nna ya
  rationale: ‘N’ebube’ na-edobe ἐν ma na-egosi ebube nke a ga-eji hụ ọbịbịa ahụ; ‘Nna ya’ na-edobe njikọ genitive ahụ.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: ya na ndị mmụọ ozi ya
  rationale: Ọ na-egosi iso ya bịa ma na-edobe nnọchiaha nwe ‘ya.’
- source_word: καὶ τότε
  choice: mgbe ahụkwa
  rationale: 'Ọ na-edobe ma njikọ ahụ ma usoro oge: ọbịbịa ahụ buru ụzọ, nkwụghachi esoro ya.'
- source_word: ἀποδώσει
  choice: ọ ga-akwụ ... ụgwọ
  rationale: Akpaalaokwu Igbo a na-egosi inye onye ọ bụla ihe ruru ya, ma na-edobe ụda ikpe na nkwụghachi nke okwu Grik.
- source_word: ἑκάστῳ
  choice: onye ọ bụla
  rationale: Ọ na-edobe nkesa n’otu n’otu nke dative singular ahụ.
- source_word: κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: dị ka omume ya si dị
  rationale: ‘Omume’ nwere ike ịgụnye ihe onye ahụ mere na ụzọ o si ebi ndụ; ọ na-adabara singular distributive nke πρᾶξις n’Igbo karịa ntụgharị siri ike dịka ‘otu ọrụ ya.’
theological_decisions:
- issue: Ike eskatọlọjị nke μέλλει n’ọbịbịa Nwa nke Mmadụ
  choice: E ji ‘na-achọ ịbịa’ chekwaa echiche na ọbịbịa ahụ na-eru nso.
  alternative: ‘ga-abịa’ ma ọ bụ ‘na-aga ịbịa’
  rationale: Grik ji μέλλω tinyere infinitive, nke na-agbakwụnye echiche nke ihe na-abịaru nso. A hapụrụ esemokwu gbasara oge ọbịbịa ahụ ka ọ dị, kama idozi ya n’ụzọ ozizi.
- issue: Ikpe dị ka omume mmadụ si dị
  choice: ‘ọ ga-akwụ onye ọ bụla ụgwọ dị ka omume ya si dị’
  alternative: ‘ọ ga-enye onye ọ bụla ụgwọ ọrụ dịka ihe o mere si dị’
  rationale: ‘Kwụọ ... ụgwọ’ nwere ike ịpụta nkwụghachi ihe kwesịrị ekwesị, ma ọ dị mma ma ọ dị njọ; ya mere ọ naghị eme ka okwu ahụ bụrụ naanị ụgwọ ọrụ ọma. ‘Omume’ na-edobe ikpe onye n’otu n’otu n’enweghị itinye usoro ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị nsọ ma dịkwa mfe nghọta. ‘Nwa nke Mmadụ’ na-edobe aha omenala Akwụkwọ Nsọ; ‘ndị mmụọ ozi’ bụ okwu a na-aghọta nke ọma. E debere ihe nrịbama nkọwa [a] ozugbo n’akụkụ okwu gbasara ọbịbịa, na [b] n’akụkụ ahịrịokwu gbasara omume.
