revisions:
- from: N’ihi na Nwa nke Mmadụ na-achọ ịbịa[a] n’ebube Nna ya, ya na ndị mmụọ ozi ya; mgbe ahụkwa, ọ ga-akwụ onye ọ bụla ụgwọ dị ka omume ya si dị.[b]
  to: N’ihi na Nwa nke Mmadụ na-achọ ịbịa[a] n’ebube Nna ya, ya na ndị mmụọ ozi ya; mgbe ahụkwa, ọ ga-akwụghachi onye ọ bụla dịka omume ya si dị.[b]
  rationale: The revision preserves the Greek syntax and eschatological tension while improving the judicial sense of ἀποδώσει in idiomatic Standard Igbo. Footnote a is adjusted to avoid claiming that a Greek semantic expression is a literal Igbo phrase. Footnote markers remain attached to the respective terms they explain.
