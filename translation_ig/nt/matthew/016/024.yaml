review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the central commands accurately: self-denial, taking up one''s own cross, and following Jesus. However, «Jizọs gwara» can imply ''told,'' whereas εἶπεν is more precisely and naturally rendered here as «Jizọs sịrị». The final «na-esokwa m» does not function cleanly as a coordinated imperative after «ya jụ ... buru»; an explicit imperative construction is needed. The revision also represents the present imperative ἀκολουθείτω with «nọgide na-eso m».'
  naturalness: The proposed revision uses standard, contemporary Igbo and makes the three commands syntactically parallel. «Ka ọ jụ ... buru ... ma nọgide na-eso m» is clear, idiomatic, and retains the ongoing force of the final command.
  terminology: «Ndị na-eso ụzọ», «Jizọs», and «obe» are appropriate established Standard Igbo biblical terms. Igbo third-person forms do not mark grammatical gender, while «onye ọ bụla ... ọ ... onwe ya ... nke ya» preserves the source's singular representative formulation without restricting it to males.
  issues:
  - severity: medium
    issue: The imperative sequence is grammatically uneven.
    rationale: «Ya jụ onwe ya, buru obe nke ya, na-esokwa m» combines a subjunctive-like command, a bare imperative, and a progressive indicative-like form. Greek has three coordinated third-person imperatives; Standard Igbo should mark the sequence consistently, especially the final command.
  - severity: low
    issue: «Gwara» is less exact than the narrative speech verb in the source.
    rationale: εἶπεν simply introduces direct speech ('said'). «Sịrị ndị na-eso ụzọ ya» preserves this without suggesting an added nuance of instruction or telling.
  revised_text: Mgbe ahụ, Jizọs sịrị ndị na-eso ụzọ ya, “Ọ bụrụ na onye ọ bụla chọrọ iso m, ka ọ jụ onwe ya, buru obe nke ya, ma nọgide na-eso m.”
  revised_footnotes: []
  revision_rationale: The revision corrects the command syntax, renders the speech introduction more closely, and makes the ongoing aspect of ἀκολουθείτω explicit with «nọgide na-eso m». It retains «iso m» for ὀπίσω μου ἐλθεῖν, preserving the source's distinction between coming after Jesus and the subsequent command to continue following him.
