revisions:
- from: Mgbe ahụ, Jizọs gwara ndị na-eso ụzọ ya, “Ọ bụrụ na onye ọ bụla chọrọ iso m, ya jụ onwe ya, buru obe nke ya, na-esokwa m.”
  to: Mgbe ahụ, Jizọs sịrị ndị na-eso ụzọ ya, “Ọ bụrụ na onye ọ bụla chọrọ iso m, ka ọ jụ onwe ya, buru obe nke ya, ma nọgide na-eso m.”
  rationale: The revision corrects the command syntax, renders the speech introduction more closely, and makes the ongoing aspect of ἀκολουθείτω explicit with «nọgide na-eso m». It retains «iso m» for ὀπίσω μου ἐλθεῖν, preserving the source's distinction between coming after Jesus and the subsequent command to continue following him.
