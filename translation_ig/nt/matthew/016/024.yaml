reference: Matthew 16:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: ig
  text: Mgbe ahụ, Jizọs sịrị ndị na-eso ụzọ ya, “Ọ bụrụ na onye ọ bụla chọrọ iso m, ka ọ jụ onwe ya, buru obe nke ya, ma nọgide na-eso m.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Na-egosi ihe mere n'usoro akụkọ n'ụzọ doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa μαθηταί, ma na-egosikwa mmekọrịta ha dịka ndị na-amụta ihe n'aka onye nkuzi ma na-eso ya.
- source_word: Εἴ τις θέλει
  choice: Ọ bụrụ na onye ọ bụla chọrọ
  rationale: Na-echekwa ọnọdụ ntụkwasị na ọchịchọ mmadụ, tinyere oke zuru ụwa ọnụ nke τις.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: iso m
  rationale: N'Igbo, 'iso m' bụ ụzọ ebumpụta ụwa isi kwuo ịbịa n'azụ onye dịka onye na-eso ụzọ; ntụgharị nkịtị 'ịbịa n'azụ m' nwere ike ịpụta naanị ọnọdụ ebe mmadụ guzo.
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: ya jụ onwe ya
  rationale: Na-egosipụta iwu ka mmadụ hapụ ọchịchọ na ịchị onwe ya, ma na-echekwa okwu siri ike nke 'ịjụ onwe ya' n'enweghị ịgbakwunye nkọwa.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: buru obe nke ya
  rationale: ‘Buru’ na-egosipụta iweli ihe iji buru ya; ‘obe nke ya’ na-echekwa ihe nnọchiaha nke na-eme ka ọnụ ahịa iso ụzọ bụrụ nke onye ọ bụla n'onwe ya.
- source_word: ἀκολουθείτω μοι
  choice: na-esokwa m
  rationale: Ụdị ngwaa a na-egosipụta omume na-aga n'ihu, kwekọrọ n'imperative dị ugbu a ἀκολουθείτω, ma na-egosikwa ọdịiche dị n'etiti ọchịchọ ịmalite iso ya na ịnọgide na-eso ya.
theological_decisions:
- issue: Ụdị otu onye nke iwu na oke ya gbasara mmadụ niile
  choice: Jiri ‘onye ọ bụla ... ya ... onwe ya ... nke ya’
  alternative: Jiri ụdị ọtụtụ mmadụ ma ọ bụ okwu metụtara nwoke kpọmkwem
  rationale: Grik bụ otu onye ma jiri ụdị ụtọasụsụ nwoke n'ụzọ nnọchiteanya. Igbo adịghị amanye ikewa nwoke na nwanyị n'okwu nnọchiaha nke onye nke atọ; ya mere ụdị a na-echekwa otu onye na oke nke ‘onye ọ bụla’ n'enweghị ime ka okwu ahụ bụrụ naanị maka nwoke.
- issue: Mmetụta akụkụ abụọ nke iso Jizọs
  choice: Tụgharịa ὀπίσω μου ἐλθεῖν dịka ‘iso m,’ ma ἀκολουθείτω μοι dịka ‘na-esokwa m’
  alternative: Tụgharịa nke mbụ dịka ‘bịa n'azụ m’
  rationale: Nke mbụ na-egosi ọchịchọ ịghọ onye na-eso ụzọ ya, nke ikpeazụ na-enye iwu ka a nọgide na-eso ya. Nhọrọ Igbo a na-echekwa mmegharị ahụ n'ụzọ kwere nghọta, n'enweghị ime ‘n'azụ’ ka ọ bụrụ naanị ọnọdụ anụ ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E jiri ‘Jizọs’ na ‘obe’ dịka okwu Akwụkwọ Nsọ ndị mmadụ maara nke ọma. E jighị ihe nrịbama nkọwa ebe ọ bụ na Igbo ‘ya/onwe ya/nke ya’ anaghị ekewa nwoke na nwanyị, ya mere nsogbu dị na ntụgharị Bekee adịghị ebe a.
