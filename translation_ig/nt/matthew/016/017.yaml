    reason: cultural_note
  revision_rationale: 'The revision preserves the direct pronouncement of blessing and restores the source’s deliberate verbal parallel: no human source revealed this, but the Father revealed it. It does not narrow ‘flesh and blood’ to a particular human agent or specify more about divine revelation than the verse itself states.'
