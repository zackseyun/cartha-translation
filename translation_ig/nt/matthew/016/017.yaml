  to: Jizọs zara ya, sị, “A gọziri gị agọzi, Saịmọn Bar-Jona[a], n’ihi na anụ ahụ na ọbara[b] ekpughereghị gị nke a, kama Nna m nke nọ n’eluigwe kpughere gị ya.”
