source:
  edition: SBLGNT
  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: ig
  text: Jizọs zara ya, sị, “A gọziri gị agọzi, Saịmọn Bar-Jona[a], n’ihi na anụ ahụ na ọbara[b] ekpughereghị gị nke a, kama Nna m nke nọ n’eluigwe kpughere gị ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Saịmọn nwa Jona.” “Bar-Jona” bụ aha nna n’ụdị Arameik nke pụtara “nwa Jona,” bụ́ nke Grik chekwara.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “anụ ahụ na ọbara”; ọ bụ akpaalaokwu na-ezo aka n’ụmụ mmadụ ma ọ bụ n’isi mmalite nke bụ naanị nke mmadụ.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: Jizọs zara ya, sị
  rationale: Nke a na-egosipụta usoro Grik ahụ bụ́ ‘zara ... sị’ n’ụzọ dị mma ma bụrụ nke a na-anụkarị n’Igbo.
- source_word: Μακάριος εἶ
  choice: Ngọzi na-adịrị gị
  rationale: ‘Ngọzi’ na-echekwa ịdị arọ nke okwu ahụ n’ihe gbasara Chineke karịa naanị ikwu na obi dị mmadụ ụtọ.
- source_word: Σίμων Βαριωνᾶ
  choice: Saịmọn Bar-Jona[a]
  rationale: A sụgharịrị aha Σίμων n’ụdị Igbo a na-eji ede ya, ma debe Bar-Jona dị ka aha nna n’asụsụ Arameik nke Grik chekwara.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe mere e ji kpọọ Saịmọn onye ngọzi na-adịrị.
- source_word: σὰρξ καὶ αἷμα
  choice: anụ ahụ na ọbara[b]
  rationale: E debere akpaalaokwu ahụ n’ụdị ya ka esemokwu dị n’etiti isi mmalite mmadụ na mkpughe Chineke ghara ifu.
- source_word: οὐκ ἀπεκάλυψέν σοι
  choice: ekpughereghị gị nke a
  rationale: ‘Kpughere’ na-eburu echiche nke ime ka ihe zoro ezo pụta ìhè; ‘nke a’ na-ezo aka n’okwupụta Saịmọn dị n’amaokwu bu ụzọ.
- source_word: ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς
  choice: kama ọ bụ Nna m nke nọ n’eluigwe mere ka ị mata ya
  rationale: Nke a na-echekwa nnukwu ọdịiche dị n’etiti mmadụ na Nna, ma na-eme ka ngwaa e kwuru na nkebi mbụ rute n’ụzọ doro anya n’Igbo; ‘n’eluigwe’ bụ okwu Igbo e ji ekwu plural Grik n’ụzọ eke.
theological_decisions:
- issue: Isi mmalite nke nkwupụta Saịmọn
  choice: Akpaalaokwu ‘anụ ahụ na ọbara’ na-ewepụ isi mmalite mmadụ n’ozuzu ya ma kwuo na Nna bụ onye mere ka Saịmọn mata ya.
  alternative: Ịkọwa ya naanị dị ka echiche ebumpụta ụwa Saịmọn ma ọ bụ naanị dịka ozizi sitere n’aka onye nkụzi mmadụ.
  rationale: Ihe odide ahụ anaghị akọwapụta otu onye mmadụ kpọmkwem; ya mere, nsụgharị ahụ echekwala obosara na esemokwu nke okwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ‘anụ ahụ na ọbara’ iji chekwaa akpaalaokwu na ọdịiche nke isi mmalite mmadụ megide mkpughe sitere n’aka Nna. Ejighị ndetu pụrụ iche maka ‘n’eluigwe’ n’ihi na ụdị otu a bụ okwu Igbo eke maka οὐρανοῖς n’ebe a.
