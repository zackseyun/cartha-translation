id: MAT.16.9
reference: Matthew 16:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: ig
  text: Ọ̀ bụ na unu aghọtabeghị[a], unu anaghịkwa echeta ogbe achịcha ise ahụ e ji nye puku mmadụ ise nri, na nkata ole ka unu chịkọtara[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu ka na-adịghị aghọta.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “unu welitere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: ka na-aghọtaghị
  rationale: 'Ọ na-egosipụta ike oge dị na ajụjụ ịba mba ahụ: ruo ugbu a, ha aghọtabeghị. Nke a bụ ụzọ Igbo sitere n''okike si kwuo ‘still not/not yet’ n''ọnọdụ a.'
- source_word: νοεῖτε
  choice: aghọtaghị
  rationale: N'ebe a, okwu ahụ pụtara ịghọta ihe omume ndị gara aga na ihe ha na-egosi, ọ bụghị naanị ịhụ ma ọ bụ ịchọpụta ihe.
- source_word: οὐδὲ
  choice: unu adịghịkwa
  rationale: Ọ na-ejikọta ngwaa abụọ ahụ n'ajụjụ na-adịghị mma, ma na-ada nke ọma n'Igbo ugbu a.
- source_word: μνημονεύετε
  choice: echeta
  rationale: Ọ na-ekwu kpọmkwem banyere icheta ọrụ ebube nke inye ìgwè mmadụ nri.
- source_word: τοὺς πέντε ἄρτους
  choice: ogbe achịcha ise ahụ
  rationale: ἄρτοι bụ ogbe achịcha n'akụkọ inye ìgwè mmadụ nri; ‘ogbe achịcha’ na-echekwa oyiyi ihe a pụrụ ịgụ ọnụ.
- source_word: τῶν πεντακισχιλίων
  choice: e ji nye puku mmadụ ise nri
  rationale: Genitive ahụ na-ezo aka n'ogbe achịcha ndị e ji nye puku mmadụ ise nri. Ịkọwa njikọ ahụ otu a bụ Igbo sitere n'okike ma kwekọọ n'ihe gbara amaokwu ahụ gburugburu.
- source_word: πόσους κοφίνους
  choice: nkata ole
  rationale: κόφινος bụ nkata; ajụjụ ahụ na-achọ ọnụ ọgụgụ nkata ndị e chịkọtara.
- source_word: ἐλάβετε
  choice: unu chịkọtara
  rationale: Ọ bụ ezie na λαμβάνω nwere ike ịpụta ‘were’ ma ọ bụ ‘nata,’ n'akụkọ a ọ na-ekwu maka ịchịkọta iberibe fọdụrụ n'ime nkata; ‘chịkọtara’ na-eme ka ihe omume ahụ doo anya.
