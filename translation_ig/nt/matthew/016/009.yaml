  to: Ọ̀ bụ na unu aghọtabeghị[a], unu anaghịkwa echeta ogbe achịcha ise ahụ e ji nye puku mmadụ ise nri, na nkata ole ka unu chịkọtara[b]?
  rationale: The revision retains the source’s rhetorical double question and its contextual ellipsis about the baskets, while using more idiomatic Standard Igbo for ‘not yet understand’ and a clearer interrogative construction for ‘how many baskets.’ The footnote at a is adjusted so that it remains a genuine alternative to the revised main wording; footnote b remains a viable contextual alternative for ἐλάβετε.
