  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere ajụjụ ịba mba ahụ na ike oge nke οὔπω, ma kọwaa njikọ genitive ahụ n'ụzọ sitere n'okike n'Igbo.
