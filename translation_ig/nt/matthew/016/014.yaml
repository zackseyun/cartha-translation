  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: ig
  text: Ha wee sị, “Ụfọdụ kwuru na ọ bụ Jọn Onye Na-eme Baptizim; ndị ọzọ kwuru na ọ bụ Ịlaịja; ndị ọzọkwa kwuru na ọ bụ Jeremaịa ma ọ bụ otu n’ime ndị amụma.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Ha wee sị
  rationale: “Wee” na-ejikọta azịza a na ajụjụ bu ya ụzọ n’ụzọ akụkọ Igbo si aga nke ọma, ebe “sị” na-anọchi εἶπαν n’enweghị ime ka δέ bụrụ ezigbo mmegide.
- source_word: Οἱ μὲν
  choice: Ụfọdụ sị
  rationale: μέν na-amalite nkesa echiche dị iche iche; “Ụfọdụ sị” bụ okwu Igbo doro anya ma na-ahapụ ihe a na-ekwu banyere ya ka a ghọta ya site n’ajụjụ bu ụzọ.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Jọn Onye Na-eme Baptizim
  rationale: Aha “Jọn” bụ ụdị a maara n’Igbo, ebe “Onye Na-eme Baptizim” na-egosipụta ọrụ βαπτιστής n'ụzọ doro anya ma dị nsọ.
- source_word: ἄλλοι δὲ
  choice: ndị ọzọ sị
  rationale: Nke a na-aga n’ihu n’usoro nkesa ahụ; itinye “sị” ọzọ na-eme ka ndepụta ahụ bụrụ Igbo eke ma doo anya.
- source_word: Ἠλίαν
  choice: Ịlaịja
  rationale: Nke a bụ ụdị aha onye amụma ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: ἕτεροι δὲ
  choice: ndị ọzọkwa sị
  rationale: “-kwa” na-egosi ìgwè ọzọ n’usoro ahụ n’enweghị ịgbakwunye mmegide na-adịghị ike n’asụsụ isi.
- source_word: Ἰερεμίαν
  choice: Jeremaya
  rationale: Nke a bụ ụdị aha onye amụma ahụ a na-amata nke ọma n’Igbo.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: ma ọ bụ otu n’ime ndị amụma
  rationale: “Ma ọ bụ” na-edobe nhọrọ nke ἤ, “otu n’ime ndị amụma” na-esokwa okwu Grik ahụ n’etinyeghị “ndị amụma ndị ọzọ,” nke na-adịghị n’isiokwu ahụ.
theological_decisions:
- issue: Ihe a na-ekwu na Jizọs bụ n’ime ndepụta ahụ
  choice: A hapụrụ “na ị bụ” ka ọ ghara ịdị n’ahịrịokwu bụ isi, dị ka n’asụsụ Grik.
  alternative: “Ụfọdụ sị na ị bụ Jọn Onye Na-eme Baptizim...”
  rationale: Asụsụ Grik depụtara aha ndị ahụ n’ụzọ e bepụrụ okwu ụfọdụ, ebe ajụjụ bu ụzọ na-eme ka ihe ha pụtara doo anya. Igbo nwekwara ike idobe ụdị mkpirisi a; ihe odide ala peeji na-enye ụdị zuru ezu karịa.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu, dee ya. E debere mkpirisi okwu nke Grik n’ahịrịokwu bụ isi ma kọwaa ya n’ihe odide ala peeji.
