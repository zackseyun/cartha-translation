revisions:
- from: N’ihi na, olee uru ọ ga-abara mmadụ ma ọ bụrụ na o nweta ụwa dum, ma tụfuo ndụ ya? Ma ọ bụ, gịnị ka mmadụ ga-enye n’ọnọdụ ndụ ya?[a]
  to: N’ihi na, olee uru ọ ga-abara mmadụ ma ọ bụrụ na o nweta ụwa dum, ma tụfuo ndụ ya? Ma ọ bụ, gịnị ka mmadụ ga-enye ka o jiri gbanwere ndụ ya?[a]
  rationale: The revision replaces the ambiguous expression n’ọnọdụ ndụ ya with ka o jiri gbanwere ndụ ya, which naturally expresses giving something in exchange for one’s life. It also makes the benefit construction more idiomatic and clarifies that the footnote’s alternative applies to both occurrences, while retaining the draft’s faithful treatment of ψυχή.
