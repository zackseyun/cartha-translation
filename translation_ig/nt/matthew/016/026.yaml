    text: A pụkwara ịsị “mkpụrụ obi ya” n’ebe abụọ e sụgharịrị ya “ndụ ya.” Okwu Grik bụ ψυχή nwere ike ịpụta “ndụ,” “onwe mmadụ,” ma ọ bụ “mkpụrụ obi,” dabere n’ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
  revision_rationale: The revision replaces the ambiguous expression n’ọnọdụ ndụ ya with ka o jiri gbanwere ndụ ya, which naturally expresses giving something in exchange for one’s life. It also makes the benefit construction more idiomatic and clarifies that the footnote’s alternative applies to both occurrences, while retaining the draft’s faithful treatment of ψυχή.
