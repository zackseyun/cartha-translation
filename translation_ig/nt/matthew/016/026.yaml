id: MAT.16.26
reference: Matthew 16:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: ig
  text: N’ihi na, olee uru ọ ga-abara mmadụ ma ọ bụrụ na o nweta ụwa dum, ma tụfuo ndụ ya? Ma ọ bụ, gịnị ka mmadụ ga-enye ka o jiri gbanwere ndụ ya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “mkpụrụ obi ya” n’ebe abụọ e sụgharịrị ya “ndụ ya.” Okwu Grik bụ ψυχή nwere ike ịpụta “ndụ,” “onwe mmadụ,” ma ọ bụ “mkpụrụ obi,” dabere n’ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: N’ihi na, olee uru
  rationale: “N’ihi na” na-egosi njikọ nkọwa nke γάρ na ihe e kwuru tupu ya, ebe “olee uru” na-ebupụta ajụjụ nkwuwa okwu nke τί n’Igbo dị mfe nghọta.
- source_word: ὠφεληθήσεται ἄνθρωπος
  choice: ọ ga-abara mmadụ
  rationale: Nkebiokwu Igbo “uru ọ ga-abara mmadụ” na-egosi uru mmadụ ga-enweta ma na-ada nke ọma karịa ntụgharị nke na-arapara n’usoro passive Grik.
- source_word: ἐὰν τὸν κόσμον ὅλον κερδήσῃ
  choice: ma ọ bụrụ na o nweta ụwa dum
  rationale: “Ma ọ bụrụ na” na-edebe ọnọdụ a na-eche n’echiche; “nweta ụwa dum” na-egosi inweta ihe niile dị n’ụwa n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ
  choice: ma tụfuo ndụ ya
  rationale: “Tụfuo” na-egosi nnukwu mfu nke ζημιόω, ebe “ndụ” na-ebupụta ψυχή dị ka ndụ/onwe mmadụ n’ọnọdụ a. A na-edebe “mkpụrụ obi” dị ka nhọrọ n’okpuru peeji.
- source_word: ἢ τί δώσει ἄνθρωπος
  choice: Ma ọ bụ, gịnị ka mmadụ ga-enye
  rationale: Nke a na-edebe ajụjụ nkwuwa okwu nke abụọ na future nke δώσει n’ụzọ doro anya.
- source_word: ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ
  choice: n’ọnọdụ ndụ ya
  rationale: “N’ọnọdụ” na-egosi ihe e nyere n’ọnọdụ ihe ọzọ, ya bụ echiche mgbanwe nke ἀντάλλαγμα, n’enweghị ime ka okwu ahụ bụrụ okwu mgbapụta kpọmkwem.
theological_decisions:
- issue: Ntụgharị ψυχή n’okwu banyere mfu kasịnụ
  choice: ndụ
  alternative: mkpụrụ obi
  rationale: N’ebe a ψυχή nwere ike ịpụta ndụ mmadụ ma ọ bụ onwe ya dum, ọ bụghị naanị akụkụ ime mmụọ e kewapụrụ n’ahụ. “Ndụ” na-edebe nghọta sara mbara ahụ; “mkpụrụ obi” ka bụ ntụgharị ziri ezi ma dị mkpa, ya mere e debere ya n’okpuru peeji.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ugwu. A họọrọ usoro ajụjụ “olee uru ọ ga-abara mmadụ” maka ịdị mfe na ịdị ndụ n’Igbo, ebe e debere ihe atụ azụmahịa nke uru, mfu, na mgbanwe.
