id: MAT.16.13
reference: Matthew 16:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: ig
  text: Mgbe Jizọs bịarutere n’ógbè Sesaria Filipai, ọ nọ na-ajụ ndị na-eso ụzọ ya, sị, “Ònye ka ndị mmadụ na-ekwu na Nwa nke Mmadụ[a] bụ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “nwa mmadụ.” “Nwa nke Mmadụ” bụ aha Jizọs ji akọwa onwe ya ugboro ugboro.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: Mgbe ... bịarutere
  rationale: Nkebi a na-ebute ọnọdụ ọhụrụ ma na-egosi oge ihe mere. “Mgbe ... bịarutere” bụ Igbo ebumpụta ụwa nke na-echekwa ihe participle aorist ahụ pụtara, na-etinyeghị okwu dịka “ugbu a” nke na-adịghị n’asụsụ mmalite.
- source_word: εἰς τὰ μέρη
  choice: n’ógbè
  rationale: μέρη n’ebe a pụtara mpaghara ma ọ bụ ala gbara obodo ahụ gburugburu, ọ bụghị “akụkụ” n’ụzọ nkịtị.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Sesaria Filip
  rationale: E depụtaghachiri aha ebe ahụ n’ụdị dabara n’usoro mkpọpụta na odide Igbo, na-enweghị ịtụgharị genitive ahụ n’ụzọ ga-eme ka okwu sie ike.
- source_word: ἠρώτα
  choice: ọ nọ na-ajụ
  rationale: Imperfect ahụ na-egosi omume na-aga n’ihu ma ọ bụ nke e bidoro ime; “ọ nọ na-ajụ” na-echekwa akụkụ a karịa naanị “ọ jụrụ.”
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo doro anya ma guzosie ike maka ndị na-amụta ihe n’aka onye nkuzi ma na-eso ya.
- source_word: λέγων
  choice: sị
  rationale: “Sị” bụ ụzọ Igbo dị mkpirikpi ma bụrụkwa nke ebumpụta ụwa isi webata okwu onye kwuru, na-ebufe ọrụ participle λέγων.
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι
  choice: Ònye ka ndị mmadụ na-ekwu
  rationale: ἄνθρωποι na-ezo aka n’ebe mmadụ niile nọ, ọ bụghị naanị ụmụ nwoke; “ndị mmadụ” na-echekwa nghọta ahụ.
- source_word: εἶναι
  choice: bụ
  rationale: “Bụ” na-eme ka ajụjụ indirect discourse ahụ bụrụ Igbo kwesịrị ekwesị ma na-echekwa ihe infinitive εἶναι pụtara.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-echekwa usoro okwu ahụ, njikọ ya na akụkụ Akwụkwọ Nsọ ndị ọzọ, na ibu aha ahụ nwere, n’etinyeghị nkọwa pụrụ iche n’ime ederede.
theological_decisions:
- issue: Nsụgharị ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: nwa mmadụ; Onye ahụ bụ mmadụ
  rationale: “Nwa nke Mmadụ” na-echekwa aha Jizọs ji akọwa onwe ya na njikọ ya na Daniel 7, ma hapụkwa esemokwu dị n’etiti ịbụ akpaalaokwu mmadụ na ịbụ aha nwere ibu pụrụ iche. E tinyere ụzọ ọzọ na nkọwa ala peeji kama idozi nghọta ahụ n’otu ụzọ n’ederede.
translation_notes:
  register: Ejiri Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. “Ọ nọ na-ajụ” na-echekwa imperfect Grik, ebe “sị” na-eme ka ahịrịokwu ahụ daa nke ọma n’Igbo. Akara ukwu dị na “Nwa nke Mmadụ” na-egosi ojiji ya dịka aha a maara ama, ma nkọwa ala peeji na-echekwa nghọta nkịtị na ụzọ ọzọ e nwere ike isi ghọta ya.
