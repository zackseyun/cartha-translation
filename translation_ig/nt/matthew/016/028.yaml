id: MAT.16.28
reference: Matthew 16:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: ig
  text: 'N’ezie, ana m agwa unu: Ụfọdụ n’ime ndị guzo n’ebe a agaghị edetụ ọnwụ ire ma ọlị[a] ruo mgbe ha ga-ahụ Nwa nke Mmadụ ka ọ na-abịa n’alaeze ya.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “agaghị edetụ ọnwụ ire n’ụzọ ọ bụla”; Grik ji ngọnahụ siri ike mesie nke a ike.
    reason: lexical_alternative
  - marker: b
    text: Okwu a nwere ike izo aka na mgbanwe ọdịdị Jizọs, mbilite n’ọnwụ na ibuli ya elu, Pentikọst, ikpe bịakwasịrị Jerusalem, ma ọ bụ ọbịbịa ikpeazụ; ederede ahụ ekwughị kpọmkwem ihe omume ọ bụ.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “n’ọchịchị eze ya” ma ọ bụ “n’ịchị ya dịka eze.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: N’ezie
  rationale: Ọ bụ okwu nkwenye siri ike nke na-ebute okwu nwere ikike; “N’ezie” na-egosipụta ya n’Igbo dị ugbu a n’enweghị idegharị ụda Grik.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a bụ ụzọ Igbo nkịtị ma dị ugwu si egosipụta okwu onye na-agwa ọtụtụ mmadụ kpọmkwem.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: Ụfọdụ n’ime ndị guzo n’ebe a
  rationale: Ọ na-echekwa echiche nke otu akụkụ n’ime ndị nọ ya nso, ma na-ada nke ọma n’Igbo.
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: agaghị edetụ ọnwụ ire ma ọlị
  rationale: “Edetụ ọnwụ ire” na-echekwa ihe atụ doro anya nke Grik, ebe “ma ọlị” na-egosipụta nkwụsi ike nke οὐ μή.
- source_word: ἕως ἂν ἴδωσιν
  choice: ruo mgbe ha ga-ahụ
  rationale: Ọ na-egosipụta oke oge nke na-ele anya n’ihe ga-eme n’ọdịnihu.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: A tụgharịrị aha ahụ n’enweghị ịkọwa ya ọzọ, ka echiche ya banyere mmadụ na nke amụma nọgide dị.
- source_word: ἐρχόμενον
  choice: ka ọ na-abịa
  rationale: Ọ na-egosipụta participle ahụ kpọmkwem n’enweghị ịtinye “n’ike” ma ọ bụ nkọwa ọzọ na-adịghị n’amaokwu a.
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: n’alaeze ya
  rationale: “Alaeze” na-echekwa ma onyonyo nke alaeze ma ohere echiche nke ọchịchị eze, n’enweghị ime ka ọ bụrụ naanị otu n’ime ha.
theological_decisions:
- issue: Ihe “Nwa nke Mmadụ ka ọ na-abịa n’alaeze ya” na-ezo aka na ya
  choice: A hapụrụ okwu ahụ ka ọ dị, n’akọwaghị otu ihe omume kpọmkwem.
  alternative: Mgbanwe ọdịdị Jizọs; mbilite n’ọnwụ na ibuli ya elu; Pentikọst; ikpe bịakwasịrị Jerusalem; ma ọ bụ ọbịbịa ikpeazụ.
  rationale: Grik ahụ ekwughị kpọmkwem ihe omume ọ bụ; nsụgharị ekwesịghị idozi esemokwu nkọwa nke ederede ahụ hapụrụ oghe.
- issue: Ike nke βασιλεία
  choice: alaeze
  alternative: ọchịchị eze; ịchị dịka eze
  rationale: “Alaeze” na-echekwa okwu bụ isi na onyonyo ya, ma ọ naghị egbochi echiche nke ọchịchị eze.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E chekwara ihe atụ “idetụ ọnwụ ire,” aha “Nwa nke Mmadụ,” na mgbagwoju anya dị n’okwu banyere ọbịbịa ya. E debere akara nkọwa ụkwụ n’ebe okwu ha na-akọwa dị.
