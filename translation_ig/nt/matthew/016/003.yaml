id: MAT.16.3
reference: Matthew 16:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: ig
  text: N’ụtụtụ kwa, unu na-asị, ‘Taa, ajọ ihu igwe ga-adị, n’ihi na eluigwe na-acha ọbara ọbara ma gbachie ọchịchịrị.’ Unu maara otú e si amata ọdịdị eluigwe, ma unu enweghị ike ịghọta ihe ịrịba ama nke oge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ihe ịrịba ama nke oge” pụrụ izo aka n’ụzọ pụrụ iche n’ihe oge ahụ pụtara n’ime mmụọ, tinyere ọrụ Jizọs ndị na-egosi na ọ bụ Mesaya.
    reason: alternative_reading
lexical_decisions:
- source_word: πρωΐ
  choice: N’ụtụtụ
  rationale: Ọ bụ nkọwa oge; “n’ụtụtụ” bụ Igbo nkịtị ma debe ọdịiche dị n’okwu amụma ihu igwe.
- source_word: χειμών
  choice: ajọ ihu igwe ga-adị
  rationale: N’ebe a, okwu ahụ na-ekwu maka oke ifufe ma ọ bụ ihu igwe ọjọọ, ọ bụghị oge oyi.
- source_word: πυρράζει
  choice: na-acha ọbara ọbara
  rationale: Nke a na-egosi ụcha ọbara ọbara nke eluigwe n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: στυγνάζων
  choice: gbaa ọchịchịrị
  rationale: Ọ na-akọwa eluigwe nke gbara ọchịchịrị ma yie ihe na-eyi egwu; okwu a dabara n’amụma ihu igwe.
- source_word: πρόσωπον τοῦ οὐρανοῦ
  choice: ihu eluigwe
  rationale: “Ihu eluigwe” na-edebe ihe atụ dị na Grik ma bụrụkwa okwu ndị Igbo pụrụ ịghọta dị ka ọdịdị eluigwe.
- source_word: γινώσκετε διακρίνειν
  choice: maara otú e si amata ihe ... na-egosi
  rationale: Nke a na-egosipụta ma ikike mmadụ mụtara ma ọrụ ịtụle ihe ọhụụ pụtara.
- source_word: σημεῖα
  choice: ihe ịrịba ama
  rationale: Ọ bụ nsụgharị Igbo a na-ejikarị eme ihe, ma na-edebe echiche nke ihe na-egosi ma ọ bụ na-ekpughe ihe ọzọ.
- source_word: καιρῶν
  choice: oge ndị a
  rationale: καιρός ebe a na-ezo aka n’oge ndị nwere ihe pụrụ iche ha pụtara, ọ bụghị nanị oge ihu igwe.
- source_word: οὐ δύνασθε
  choice: unu enweghị ike ịmata
  rationale: Nke a na-edebe nkwupụta doro anya banyere enweghị ike, ma na-eme ka ọdịiche ya na ahịrịokwu bu ụzọ pụta ìhè.
theological_decisions:
- issue: Ihe “ihe ịrịba ama nke oge ndị a” pụtara
  choice: E debere okwu ahụ n’obosara ya dịka ihe ịrịba ama nke oge ndị a.
  alternative: Ihe ịrịba ama Mesaya nke oge a, ma ọ bụ ihe ịrịba ama gbasara ọgwụgwụ oge.
  rationale: Okwu Grik pụrụ ịgụnye ihe ọrụ Jizọs na-egosi banyere oge ahụ nakwa ihe metụtara mmezu atụmatụ Chineke; nsụgharị ahụ ekpebighị naanị otu n’ime ha.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta mee ihe. A hapụrụ ihe atụ “ihu eluigwe” ka ọ debe ọdịdị okwu Grik; a kọwakwara ngwaa διακρίνειν n’ụzọ ebumpụta ụwa dịka ịmata ihe ihe ahụ na-egosi. E tinyere akara ndetu ala [a] n’isiokwu dịka achọrọ.
