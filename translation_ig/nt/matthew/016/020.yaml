  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: ig
  text: Mgbe ahụ, o nyere ndị na-eso ụzọ ya iwu siri ike ka ha ghara ịgwa onye ọ bụla na ọ bụ Mesaya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” χριστός bụ aha ọkwá Grik; n’ebe a, a sụgharịrị ya “Mesaya” dị ka aha ọkwá.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Na-egosi ihe sochiri ihe gara aga n’akụkọ ahụ n'ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: διεστείλατο
  choice: ọ dọrọ ... aka ná ntị siri ike
  rationale: Na-egosipụta iwu siri ike e nyere ha. N'ebe a, nkebiokwu a na-enye ike dị n'okwu Grik ahụ n'enweghị iji okwu ochie ma ọ bụ nke na-adịghị eke ọnụ.
- source_word: τοῖς μαθηταῖς
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ ụzọ ebumpụta ụwa e si akọwa ndị a maara dị ka ndị na-eso Jizọs. Agbakwunyere 'ya' maka nghọta doro anya n'Igbo.
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: ka ha ghara ịgwa onye ọ bụla
  rationale: Na-egosipụta ihe iwu ahụ kwuru nakwa mmachibido ịgwa onye ọbụla.
- source_word: ὅτι αὐτός ἐστιν
  choice: na ya bụ
  rationale: Na-ewebata ọdịnaya nke ihe a machibidoro ha ikwu; 'ya' na-anọchi anya onye ahụ n'ụzọ kwekọrọ n'Igbo.
- source_word: ὁ χριστός
  choice: Mesaya
  rationale: Χριστός bụ aha ọkwá n'ebe a, ya mere a họọrọ 'Mesaya' iji chekwaa echiche nke onye Chineke tere mmanụ kama ime ka ọ dị ka aha mmadụ nkịtị.
theological_decisions:
- issue: Nsụgharị Χριστός dị ka aha ọkwá
  choice: Mesaya
  alternative: Kraịst
  rationale: N'okwu a, Χριστός na-arụ ọrụ dị ka aha ọkwá ahụ a tụrụ anya ya, ọ bụghị naanị dị ka aha onye. 'Mesaya' na-eme ka nzube aha ọkwá ahụ pụta ìhè, ebe e debere 'Kraịst' n'okpuru nkọwa dị ka ụzọ ọzọ a maara.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma dịkwa mfe nghọta. A haziri ahịrịokwu ahụ ka ọ na-aga nke ọma n'Igbo, ma e chekwara ike iwu ahụ na ọrụ 'Mesaya' dị ka aha ọkwá.
