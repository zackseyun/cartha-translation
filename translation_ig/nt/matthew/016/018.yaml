id: MAT.16.18
reference: Matthew 16:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: ig
  text: Mụ onwe m kwa, ana m agwa gị na ị bụ Pita[a], ma n’elu nkume a ka m ga-ewu ọgbakọ m; ọnụ ụzọ ámá Hedis[b] agaghị emeri ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik maka “Pita” na nke maka “nkume” nwere njikọ n’ụda na n’echiche. A pụrụ ịghọta “nkume a” dịka Pita, nkwupụta okwukwe Pita, ma ọ bụ Pita dịka onye kwupụtara okwukwe ahụ na onye nnọchianya ndịozi.
    reason: alternative_reading
  - marker: b
    text: 'Grik: “Hedis,” ya bụ, ala ndị nwụrụ anwụ. N’ọdịnala, a na-asụgharị ya dịka “hel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ
  choice: Mụ onwe m kwa
  rationale: Nke a na-egosipụta nkwusi ike dị na κἀγώ (‘mụ onwe m kwa’) na njikọ dị nro nke δέ, n’etinyeghị esemokwu siri ike na-adịghị na Grik.
- source_word: σοι λέγω
  choice: na-agwa gị
  rationale: Ọ bụ ụzọ Igbo kwụ ọtọ ma dịkwa ebube isi gosipụta okwu a gwara mmadụ kpọmkwem.
- source_word: Πέτρος
  choice: Pita
  rationale: Aha a sụgharịrị dịka omenala Igbo si dị. Nkọwa ala ala peeji na-enyere aka igosi egwuregwu okwu dị n’etiti Πέτρος na πέτρα nke na-apụtachaghị nke ọma n’Igbo.
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: n’elu nkume a
  rationale: Nke a na-echekwa ma echiche ebe nke ἐπί ma ike ngosipụta nke ταύτῃ, n’akọwaghị onye ma ọ bụ ihe ‘nkume a’ bụ.
- source_word: οἰκοδομήσω
  choice: ka m ga-ewu
  rationale: ‘Iwu’ na-echekwa ihe atụ nke ịrụ ụlọ dị na ngwaa Grik ahụ.
- source_word: μου τὴν ἐκκλησίαν
  choice: ọgbakọ m
  rationale: ‘Ọgbakọ’ na-egosi obodo ndị bụ nke Jizọs ma na-ezere ime ka okwu ahụ bụrụ naanị ụlọ ofufe ma ọ bụ otu nzukọ e guzobere dịka ụlọ ọrụ.
- source_word: πύλαι ᾅδου
  choice: ọnụ ụzọ ámá Hedis
  rationale: Nke a na-echekwa ihe atụ nke ọnụ ụzọ ámá ma sụgharịa ᾅδης dịka Hedis, ya bụ ala ndị nwụrụ anwụ, ọ bụghị Gehena ma ọ bụ ntaramahụhụ ikpeazụ.
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: agaghị emeri ya
  rationale: Nke a bụ Igbo doro anya nke na-echekwa echiche nke ịkarị ike ma ọ bụ imeri; ‘ya’ na-arụtụ aka n’ọgbakọ ahụ.
theological_decisions:
- issue: Ihe ‘nkume a’ (πέτρᾳ) na-arụtụ aka na ya
  choice: E debere ya dịka ‘nkume a’ n’akọwaghị ihe ọ bụ.
  alternative: Ọ pụrụ ịrụtụ aka na Pita n’onwe ya, nkwupụta okwukwe Pita, ma ọ bụ Pita dịka onye kwupụtara okwukwe ahụ na onye nnọchianya ndịozi.
  rationale: Grik na-ejikọta Πέτρος na πέτρα site n’egwuregwu okwu, ma ọ naghị edozi esemokwu nkọwa niile. Nsụgharị ekwesịghị ịmanye nkọwa otu ụka.
- issue: Nsụgharị ᾅδης
  choice: Hedis
  alternative: Ala ndị nwụrụ anwụ; ọkụ ala mmụọ.
  rationale: ‘Hedis’ na-adị nso n’okwu Grik ma na-ezere ijikọta ya ozugbo na echiche Gehena ma ọ bụ ebe ntaramahụhụ ikpeazụ.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke dị ugbu a ma dịkwa ebube, dee ya. ‘Ọgbakọ m’ na-eme ka uche dịrị n’obodo ndị Jizọs kpọkọtara, ebe ‘ọnụ ụzọ ámá Hedis’ na-echekwa ihe atụ mbụ na ọdịiche dị n’etiti Hedis na Gehena.
