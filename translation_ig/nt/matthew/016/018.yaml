revisions:
- from: Mụ onwe m kwa na-agwa gị na ị bụ Pita[a], ọ bụkwa n’elu nkume a ka m ga-ewu ọgbakọ m; ọnụ ụzọ ámá Hedis[b] agaghị emeri ya.
  to: Mụ onwe m kwa, ana m agwa gị na ị bụ Pita[a], ma n’elu nkume a ka m ga-ewu ọgbakọ m; ọnụ ụzọ ámá Hedis[b] agaghị emeri ya.
  rationale: The revision retains the draft’s faithful rendering and its deliberate theological restraint concerning “this rock.” It improves the opening’s idiomatic flow and removes the added fiery connotation from the Hades note, while retaining a neutral indication of the traditional rendering.
