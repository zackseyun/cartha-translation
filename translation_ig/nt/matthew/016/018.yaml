    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s faithful rendering and its deliberate theological restraint concerning “this rock.” It improves the opening’s idiomatic flow and removes the added fiery connotation from the Hades note, while retaining a neutral indication of the traditional rendering.
