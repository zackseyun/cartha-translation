id: MAT.16.4
reference: Matthew 16:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: ig
  text: Ọgbọ ọjọọ na nke na-akwa iko[a] na-achọ ihe ịrịba ama, ma a gaghị enye ya ihe ịrịba ama ọ bụla ma e wezụga ihe ịrịba ama Jona.[b] Ọ hapụrụ ha wee pụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọgbọ na-ekwesịghị ntụkwasị obi.” Okwu Grik ahụ pụtara n’ụzọ nkịtị “nke na-akwa iko,” ma o yikarịrị ka ọ na-akpọghachi asụsụ ndị amụma banyere ekwesịghị ntụkwasị obi n’ọgbụgba ndụ.
    reason: lexical_alternative
  - marker: b
    text: A kọwara “ihe ịrịba ama Jona” na Matiu 12:39–40 site n’ụbọchị atọ na abalị atọ Jona nọrọ n’ime nnukwu azụ, nke ghọrọ ụkpụrụ e ji tụnyere ihe ga-eme Nwa nke Mmadụ.
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: ọgbọ
  rationale: “Ọgbọ” na-egosi ìgwè ndị dị ndụ n’otu oge ma na-echekwa otú Matiu si eji γενεά ekwu maka ndị oge ahụ.
- source_word: πονηρὰ
  choice: ọjọọ
  rationale: “Ọjọọ” bụ ntụgharị doro anya nke na-egosi ajọ ọnọdụ omume nke ọgbọ ahụ.
- source_word: μοιχαλὶς
  choice: nke na-akwa iko
  rationale: Nhọrọ a na-echekwa ihe atụ siri ike nke ịkwa iko dị na Grik, kama ịkọwa ya naanị dị ka ekwesịghị ntụkwasị obi.
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: “Ihe ịrịba ama” na-echekwa nghọta sara mbara nke σημεῖον n’etinyeghị okwu “ọrụ ebube,” nke ederede Grik ekwughị kpọmkwem.
- source_word: ἐπιζητεῖ
  choice: na-achọ
  rationale: “Na-achọ” bụ okwu Igbo nkịtị ma kwekọọ n’ọrụ ngwaa ahụ; ọnọdụ okwu ahụ n’onwe ya na-egosi na ọchịchọ ahụ abụghị nke ezi okwukwe.
- source_word: δοθήσεται
  choice: a ga-enye
  rationale: Usoro a na-echekwa ọdịdị ngwaa nke nnara ihe na ọdịnihu dị na Grik.
- source_word: αὐτῇ
  choice: ya
  rationale: “Ya” na-alaghachi n’ọgbọ ahụ dịka otu ìgwè, n’ụzọ dị mfe n’Igbo.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: N’ebe a, εἰ μὴ na-egosi naanị otu ihe e wepụrụ n’iwu ahụ; “ma e wezụga” na-eme ka nke a doo anya.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: ihe ịrịba ama Jona
  rationale: Nhọrọ a na-echekwa njikọ genitiv ahụ na ihe ọ pụrụ ịpụta, n’etinyeghị nkọwa banyere ọnwụ na mbilite n’ọnwụ n’ahịrị isi.
- source_word: καταλιπὼν
  choice: hapụ ha
  rationale: “Hapụ ha” na-egosi na Jizọs siri n’ebe ha nọ pụọ, dị ka participle Grik ahụ si kwuo.
- source_word: ἀπῆλθεν
  choice: pụọ
  rationale: “Pụọ” bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche nke ịpụ ebe ahụ.
theological_decisions:
- issue: Ihe “ọgbọ ... na-akwa iko” pụtara
  choice: E debere ihe atụ nke ịkwa iko n’ahịrị isi.
  alternative: Ịsụgharị ya dịka “ọgbọ na-ekwesịghị ntụkwasị obi.”
  rationale: Okwu ahụ nwere ike ịkpọghachi asụsụ ndị amụma banyere ekwesịghị ntụkwasị obi nye Chineke, ma Grik ji ihe atụ nke ịkwa iko n’onwe ya. Idebe ya na-echekwa ịdị nkọ na nghọta abụọ ahụ.
- issue: Ihe “ihe ịrịba ama Jona” pụtara
  choice: E debere okwu ahụ n’enweghị ịkọwa ya n’ahịrị isi.
  alternative: Ịkọwa ya ozugbo dịka ọnwụ na mbilite n’ọnwụ Jizọs.
  rationale: Matiu 12:39–40 na-enye nkọwa metụtara Jona, ma amaokwu a n’onwe ya hapụrụ okwu ahụ nkenke. Ya mere, ntụgharị ahụ ekwesịghị itinye nkọwa ahụ n’ahịrị isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma dị nsọ, mee ihe. A hapụrụ ihe atụ “na-akwa iko” na okwu “ihe ịrịba ama Jona” ka ederede ghara idozi nghọta ime mmụọ nke Grik hapụrụ ka ọ dị. E tinyere akara nkọwa [a] n’akụkụ okwu ọ na-akọwa, na [b] n’akụkụ “ihe ịrịba ama Jona.”
