id: MAT.11.10
reference: Matthew 11:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: ig
  text: 'Ọ bụ onye a ka e dere okwu banyere ya, sị: “Lee, ana m eziga onye ozi m n’ihu gị[a], onye ga-akwadebe ụzọ gị n’ihu gị.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dị mfe, “tupu gị.” N’ụzọ nkịtị, okwu Grik ahụ pụtara “n’ihu ihu gị,” ma ọ na-arụ ọrụ dịka “n’ihu gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: onye a
  rationale: Nnọchiaha ngosi a na-eme ka a mata onye a na-ekwu maka ya; “onye a” bụ okwu Igbo doro anya ma na-echekwa nkwusi ike nke Grik.
- source_word: περὶ οὗ
  choice: banyere ya
  rationale: περί tinyere genitive pụtara ihe gbasara onye ahụ; “banyere ya” bụ ụzọ Igbo nkịtị si kwuo ya.
- source_word: γέγραπται
  choice: e dere
  rationale: Perfect passive a bụ usoro e ji ewebata ihe e dere n’Akwụkwọ Nsọ; “e dere” na-echekwa passive ahụ ma na-ada nke ọma n’Igbo.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: “Lee” na-akpọ uche onye na-ege ntị n’ihe na-esonụ ma dabara n’olu amụma nke ihe e hotara.
- source_word: ἀποστέλλω
  choice: ana m eziga
  rationale: Present tense nke Grik nwere ike igosi omume a na-eme ma ọ bụ nke dị nso; “ana m eziga” na-echekwa ịdị ndụ nke okwu ahụ.
- source_word: ἄγγελόν
  choice: onye ozi
  rationale: N’ebe a okwu ahụ na-ezo aka n’otu onye e zigara, ya bụ Jọn, ọ bụghị mmụọ ozi nke eluigwe; “onye ozi” na-egosipụta ihe okwu ahụ pụtara n’ọnọdụ a.
- source_word: πρὸ προσώπου σου
  choice: n’ihu gị
  rationale: Okwu a nwere onyonyo nke ihu ma pụtakwa ịnọ ma ọ bụ ịga n’ihu mmadụ. “N’ihu gị” bụ Igbo ebumpụta ụwa nke na-echekwa ma onyonyo ahụ ma echiche ya.
- source_word: κατασκευάσει
  choice: ga-akwadebe
  rationale: Future verb a pụtara ime ka ihe dị njikere; “ga-akwadebe” bụ okwu doro anya ma kwekọọ n’onyonyo nke idozi ụzọ.
- source_word: τὴν ὁδόν σου
  choice: ụzọ gị
  rationale: ὁδός nwere ike ịbụ ụzọ n’ezie ma ọ bụ n’ụzọ atụ; “ụzọ” na-echekwa nghọta abụọ ahụ n’Igbo.
- source_word: ἔμπροσθέν σου
  choice: n’ihu gị
  rationale: Nke a pụtara n’ihu mmadụ. Ikwughachi “n’ihu gị” na-echekwa nhazi na nkwusi ike nke ihe Grik hotara.
theological_decisions:
- issue: Ikwughachi ahịrịokwu abụọ na-egosi ịnọ n’ihu onye ahụ n’ihe e hotara n’Akwụkwọ Nsọ
  choice: E debere “n’ihu gị” ugboro abụọ n’ahịrịokwu ahụ.
  alternative: Ijikọta ha ma ọ bụ ime ka nke mbụ bụrụ “gaa gị n’ihu” ka ahịrịokwu dị ire karịa.
  rationale: Grik nwere ma πρὸ προσώπου σου ma ἔμπροσθέν σου. Idebe ha abụọ na-echekwa usoro, nkwusi ike, na ụda nke ihe e hotara n’emebighị ihe mgbagwoju anya ọ bụla dị na ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Lee” na-edobe ụda amụma, ebe “onye ozi,” “akwadebe,” na “ụzọ” bụ okwu ndị nkịtị ga-aghọta nke ọma. E kpachapụrụ anya debe nkwughachi nke ederede Grik.
