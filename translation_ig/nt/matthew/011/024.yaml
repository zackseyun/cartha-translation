source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: ig
  text: Ma ana m agwa unu na n’ụbọchị ikpe, ọ ga-adị mfe ịnagide maka ala Sọdọm karịa ka ọ ga-adị maka gị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a ga-anagide ya nke ọma karịa maka ala Sọdọm karịa ka ọ ga-adị maka gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ma
  rationale: N’ebe a, okwu ahụ na-egosi ntụgharị siri ike na ihe dị iche n’ihe e kwuru tupu ya; “Ma” bụ ụzọ Igbo dị mfe ma kwekọọ n’usoro okwu ahụ.
- source_word: λέγω ὑμῖν
  choice: ana m agwa gị
  rationale: N’agbanyeghị na ὑμῖν bụ ọtụtụ n’asụsụ Grik, ihe a na-ekwu na-aga n’ihu dị ka okwu a gwara obodo ahụ; “ana m agwa gị” na-eme ka njikọ ahụ na σοί nke bụ otu onye doo anya n’Igbo.
- source_word: γῇ Σοδόμων
  choice: ala Sọdọm
  rationale: Nke a na-echekwa γῇ, “ala/ógbè,” kama ịsụgharị ya naanị dị ka aha obodo Sọdọm.
- source_word: ἀνεκτότερον
  choice: mfe nnagide karịa
  rationale: Nke a na-egosipụta ntụnyere nke ihe ga-adịrị onye ma ọ bụ ala mfe ịnagide, n’asụsụ Igbo a na-aghọta nke ọma.
- source_word: ἔσται
  choice: a ga-adịrị
  rationale: Nke a na-enye ọdịnihu nke ngwaa ahụ n’ụzọ Igbo sitere n’okike.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: n’ụbọchị ikpe
  rationale: Ọ na-echekwa echiche nke ụbọchị e ji ekpe ikpe n’ọdịnihu n’enweghị mgbakwunye nkọwa okpukpe na-adịghị n’ederede.
- source_word: ἢ σοί
  choice: karịa ka ọ ga-adịrị gị
  rationale: “Gị” na-echekwa σοί nke bụ otu onye, ya bụ, obodo ahụ e mere ka ọ dị ka onye a na-agwa okwu.
theological_decisions:
- issue: Onye σοί nke otu onye na-ezo aka na ya
  choice: E chekwara “gị” nke otu onye dịka okwu a gwara obodo ahụ kpọmkwem.
  alternative: “unu ndị bi n’obodo ahụ”
  rationale: Asụsụ Grik ji otu onye kwuo okwu ma na-aga n’ihu n’ụzọ amụma nke na-agwa obodo okwu dịka onye. Ịgbasa ya ka ọ bụrụ ndị mmadụ ga-akọwa ihe ederede ahụ n’ọnọdụ onye na-agụ ya.
- issue: Ihe ἀνεκτότερον na-akọwa
  choice: E tinyere “ikpe a” dịka isiokwu a ghọtara site na “ụbọchị ikpe.”
  alternative: “ọ ga-adịrị ala Sọdọm mfe nnagide” n’enweghị ịkpọ ihe a ga-anagide aha
  rationale: 'N’Igbo, ịkpọ “ikpe a” aha na-eme ka ahịrịokwu ahụ doo anya, ma ọ naghị agbanwe ihe gbara ya gburugburu: ihe a na-atụnyere bụ otú ikpe ụbọchị ahụ ga-adịrị ha.'
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ okwu a gwara obodo ahụ n’ụdị otu onye, ma chekwaa ntụnyere siri ike nke ikpe.
