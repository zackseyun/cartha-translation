id: MAT.11.27
reference: Matthew 11:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: ig
  text: Nna m enyefewo m ihe niile. Ọ dịghịkwa onye maara Ọkpara ahụ ma e wezụga Nna ahụ, ọ dịghịkwa onye maara Nna ahụ ma e wezụga Ọkpara ahụ[a] na onye ọ bụla Ọkpara ahụ chọrọ ikpughere ya Nna ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “maara” n’ebe abụọ a dịka “maara nke ọma” ma ọ bụ “maara n’ezie”; ngwaa Grik ahụ pụrụ igosi ịma onye n’ụzọ zuru ezu ma ọ bụ nke miri emi.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye ọ bụla Ọkpara ahụ họọrọ ikpughere ya Nna ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: ihe niile
  rationale: Nkebiokwu a na-edobe obosara nke ọtụtụ ihe n’ụdị neuter n’asụsụ Grik n’etinyeghị ókè a na-akọwaghị n’amaokwu ahụ.
- source_word: παρεδόθη ὑπὸ τοῦ πατρός μου
  choice: Nna m enyefewo m
  rationale: Ụdị a bụ Igbo dị ndụ ma doo anya; ọ na-egosi na Nna bụ onye nyefere ihe ndị ahụ, nakwa na ihe omume ahụ emezuworo ma nsonaazụ ya ka dị.
- source_word: ἐπιγινώσκει
  choice: maara
  rationale: ‘Maara’ na-eburu echiche nke ịmata onye n’ezie ma ghara ịmanye ihe mgbakwunye ‘nke ọma’ nke ngwaa Grik ahụ anaghị achọ mgbe niile. A na-edebe nhọrọ nke ike okwu ahụ n’ala ala peeji.
- source_word: τὸν υἱὸν / τὸν πατέρα
  choice: Ọkpara ahụ / Nna ahụ
  rationale: Aha ndị a na-arụ ọrụ dị ka utu aha mmekọrịta pụrụ iche n’etiti Ọkpara na Nna; ‘ahụ’ na-enyere njikọ ha na ndị a kpọtụrụ aha aka n’Igbo.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ isi gosipụta mwepu dị n’okwu Grik ahụ.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: onye ọ bụla Ọkpara ahụ họọrọ ikpughere ya Nna ahụ
  rationale: ‘Họọrọ’ na-edobe mkpebi na ọchịchọ Ọkpara, ebe ‘ikpughere’ na-edobe echiche nke ime ka ihe zoro ezo pụta ìhè. ‘Nna ahụ’ bụ ihe a na-ekpughere onye ahụ, dịka njikọ okwu si gosi.
theological_decisions:
- issue: Ike okwu ἐπιγινώσκω n’ihe gbasara Nna na Ọkpara ịma ibe ha
  choice: maara
  alternative: maara nke ọma / maara n’ezie
  rationale: Ngwaa ahụ nwere ike ịpụta ịma nke ọma ma ọ bụ ịma onye n’ụzọ miri emi, ma ike mgbakwunye ahụ abụghị ihe a ga-amanye n’ebe niile. Isi ederede na-edobe okwu sara mbara, ebe ala ala peeji na-egosi nhọrọ ndị ọzọ.
- issue: Ọchịchọ Ọkpara dị na βούληται
  choice: họọrọ
  alternative: chọrọ / kpebiri
  rationale: ‘Họọrọ’ na-egosi na mkpughe ahụ sitere ná mkpebi Ọkpara n’emeghị ka amaokwu ahụ kwado nkọwa otu ụka pụrụ iche.
- issue: Onye a na-ekpughe na njedebe amaokwu ahụ
  choice: Nna ahụ bụ onye Ọkpara na-ekpughere onye ọ họọrọ
  alternative: Ihapụ ihe nnọchiaha naanị ya
  rationale: N’asụsụ Grik, ihe e kpughere adịghị n’ahịrịokwu ahụ kpọmkwem ma ọ na-alaghachi na Nna ahụ. Ikwughachi ‘Nna ahụ’ n’Igbo na-ewepụ mgbagwoju anya nke ihe nnọchiaha n’agbanweghị onye okwu ahụ na-ezo aka na ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ usoro ahịrịokwu abụọ ka ogologo njikọ Grik ahụ ghara ịdị arọ n’Igbo, ma e debere nhata dị n’etiti ịma Ọkpara na ịma Nna.
