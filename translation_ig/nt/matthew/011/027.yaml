revisions:
- from: Nna m enyefewo m ihe niile. Ọ dịghịkwa onye maara Ọkpara ahụ ma e wezụga Nna ahụ, ọ dịghịkwa onye maara Nna ahụ ma e wezụga Ọkpara ahụ[a] na onye ọ bụla Ọkpara ahụ họọrọ ikpughere ya Nna ahụ.[b]
  to: Nna m enyefewo m ihe niile. Ọ dịghịkwa onye maara Ọkpara ahụ ma e wezụga Nna ahụ, ọ dịghịkwa onye maara Nna ahụ ma e wezụga Ọkpara ahụ[a] na onye ọ bụla Ọkpara ahụ chọrọ ikpughere ya Nna ahụ.[b]
  rationale: The revision is limited to rendering βούληται with the present volitional form “chọrọ,” preserving the Greek’s general, ongoing conditional sense. The final object, “Nna ahụ,” is retained explicitly because Greek leaves it implicit but its antecedent is clear and explicit repetition prevents ambiguity in Igbo. Footnote b is adjusted to provide a genuine lexical alternative without implying a completed past decision.
  reviewer_model: gpt-5.6-terra
