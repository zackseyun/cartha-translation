id: MAT.11.11
reference: Matthew 11:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: ig
  text: 'N’ezie, ana m asị unu: n’etiti ndị nwanyị mụrụ,[a] ọ dịbeghị onye bilitere[b] nke karịrị Jọn Onye Na-eme Baptizim; ma onye kacha nta[c] n’alaeze eluigwe ka ya ukwuu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndị nwanyị mụrụ” bụ akpaalaokwu Semitic nke pụtara ụmụ mmadụ.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “e meela ka o bilie.” Ngwaa Grik ahụ nwere ike ịpụta “bilitere” ma ọ bụ “e mere ka o bilie”; n’ebe a, o yikarịrị ka ọ na-ekwu maka mmadụ ịpụta n’akụkọ ihe mere eme, ọ bụghị mbilite n’ọnwụ.
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “onye ka nta.” Okwu Grik ahụ dị n’ụdị ntụnyere, ma n’ebe a ọ pụrụ ịpụta onye nọ n’ọkwa kacha nta n’alaeze eluigwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: N’ezie, ana m agwa unu
  rationale: Nke a na-enye okwu ahụ ụda nkwenye siri ike na nke ikike, ma bụrụkwa Igbo dị ugbu a ma doo anya.
- source_word: οὐκ ἐγήγερται
  choice: ọ dịghị onye ... bilitere
  rationale: “Bilitere” na-echekwa ihe oyiyi nke ngwaa Grik, nke n’ebe a nwere ike ịpụta na mmadụ apụtala n’akụkọ ihe mere eme, n’enweghị ịkọwa ya dịka mbilite n’ọnwụ.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: n’etiti ndị niile ụmụ nwanyị mụrụ
  rationale: Ọ na-echekwa akpaalaokwu Semitic ahụ ma mee ka o doo anya n’Igbo na a na-ekwu banyere ụmụ mmadụ.
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: onye ka Jọn Onye Na-eme Baptizim ukwuu
  rationale: Ntụnyere ahụ doro anya ma na-echekwa nkwupụta banyere ịdị ukwuu Jọn.
- source_word: τοῦ βαπτιστοῦ
  choice: Onye Na-eme Baptizim
  rationale: Aha a na-akọwa ọrụ Jọn n'ụzọ doro anya ma ghara ime ka “Baptist” yie aha ụka.
- source_word: ὁ δὲ μικρότερος
  choice: ma onye dịkarịsịrị nta
  rationale: Ọ bụ ezie na okwu Grik bụ ụdị ntụnyere, ebe a ọ na-arụ ọrụ dịka onye nọ n’ọkwa kacha nta; nsụgharị a bụ nke ebumpụta ụwa n’Igbo.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: n’alaeze eluigwe
  rationale: Nke a bụ okwu Matiu ji eme ihe ugboro ugboro, bụrụkwa ụzọ Igbo kwụ ọtọ ma ghọta ya ngwa ngwa.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: ka ya ukwuu
  rationale: Ọ na-echekwa ntụnyere dị n’amaokwu ahụ n’enweghị ịkọwa ụdị ịdị ukwuu e bu n’obi.
theological_decisions:
- issue: Ụdị ịdị ukwuu Jọn na nke onye kacha nta n’alaeze
  choice: E chekwara ntụnyere ahụ dịka okwu dị omimi n’enweghị nkọwa banyere ihe mere onye kacha nta n’alaeze ji ka Jọn ukwuu.
  alternative: Ịkọwa ya dịka ihe gbasara ọnọdụ n’akụkọ nzọpụta, uru ọgbụgba ndụ ọhụrụ, ma ọ bụ ịdị nsọ onwe onye.
  rationale: Amaokwu ahụ n’onwe ya akọwaghị ụzọ e si ghọta ntụnyere ahụ; ịgbakwunye otu nkọwa ga-edozi esemokwu nkà mmụta okpukpe nke ederede ahụ hapụrụ ghe oghe.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji “Onye Na-eme Baptizim” kọwaa ọrụ Jọn n’enweghị njikọ n’aha otu ụka. E debere akpaalaokwu na esemokwu nkà mmụta okpukpe nke isi mmalite ahụ.
