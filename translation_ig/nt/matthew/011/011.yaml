review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the solemn assertion, the Semitic ‘born of women’ idiom, John’s epithet, and the unresolved paradox concerning the least person in the kingdom of heaven. However, the wording around the comparative and arising verb is awkward enough to obscure the Greek construction. The revision explicitly retains ἐγήγερται as ‘has arisen’ without introducing a resurrection sense.
  naturalness: 'Several expressions are not idiomatic Standard Igbo: ‘ndị niile ụmụ nwanyị mụrụ’ is cumbersome, ‘onye dịkarịsịrị nta’ is not natural usage, and the placement in ‘onye ka Jọn ... ukwuu bilitere’ is difficult to parse. The revised wording is clear, contemporary, and suitably dignified.'
  terminology: ‘Jọn Onye Na-eme Baptizim’ and ‘alaeze eluigwe’ are appropriate established biblical terminology. ‘Onye kacha nta’ naturally communicates the contextual force of μικρότερος while the footnote records its comparative form. No theological interpretation has been added.
  issues:
  - severity: medium
    issue: The comparative/arising clause is awkwardly ordered.
    rationale: ‘Ọ dịghị onye ka Jọn Onye Na-eme Baptizim ukwuu bilitere’ can be parsed with difficulty in Igbo. ‘Ọ dịbeghị onye bilitere nke karịrị Jọn Onye Na-eme Baptizim’ naturally expresses that none greater than John has arisen.
  - severity: medium
    issue: ‘Onye dịkarịsịrị nta’ is unnatural Standard Igbo.
    rationale: The form is not an idiomatic way to designate the person of least rank. ‘Onye kacha nta’ is natural and conveys the contextual superlative sense of the Greek comparative μικρότερος.
  - severity: low
    issue: Footnote b’s alternative wording is unclear and unnecessarily expansive.
    rationale: Its passive alternative has an unclear antecedent (‘ya’) and does not directly explain the lexical alternative. The revision gives a concise, accurate explanation of the possible passive sense.
  revised_text: 'N’ezie, ana m asị unu: n’etiti ndị nwanyị mụrụ,[a] ọ dịbeghị onye bilitere[b] nke karịrị Jọn Onye Na-eme Baptizim; ma onye kacha nta[c] n’alaeze eluigwe ka ya ukwuu.'
