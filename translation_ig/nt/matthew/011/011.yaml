- from: 'N’ezie, ana m agwa unu: n’etiti ndị niile ụmụ nwanyị mụrụ,[a] ọ dịghị onye ka Jọn Onye Na-eme Baptizim ukwuu bilitere;[b] ma onye dịkarịsịrị nta[c] n’alaeze eluigwe ka ya ukwuu.'
  to: 'N’ezie, ana m asị unu: n’etiti ndị nwanyị mụrụ,[a] ọ dịbeghị onye bilitere[b] nke karịrị Jọn Onye Na-eme Baptizim; ma onye kacha nta[c] n’alaeze eluigwe ka ya ukwuu.'
