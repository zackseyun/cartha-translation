id: MAT.11.4
reference: Matthew 11:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: ig
  text: Jizọs wee zaa ha sị, “Gaanụ kọọrọ Jọn ihe unu na-anụ ma na-ahụ:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: wee
  rationale: “Wee” na-ejikọta ihe a na akụkọ gara aga n’ụzọ Igbo si akọ akụkọ, n’enweghị itinye nkọwa oge siri ike karịa njikọ καί.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: zaa ha sị
  rationale: Nke a bụ ụzọ Igbo dị ire ụtọ si egosi na Jizọs zara ha ma webata okwu o kwuru; ọ na-echekwa ọrụ okwu Grik abụọ ahụ n’enweghị nkwughachi na-adịghị eke n’Igbo.
- source_word: Πορευθέντες
  choice: Gaanụ
  rationale: 'Participụl a so iwu na-arụ ọrụ dị ka iwu nke mbụ n’usoro omume: ha ga-aga, mesịa kọọrọ Jọn.'
- source_word: ἀπαγγείλατε
  choice: kọọrọ
  rationale: “Kọọrọ” na-egosi izigara Jọn akụkọ banyere ihe ndị ozi ya nụrụ ma hụ, dịka ἀπαγγέλλω si pụta n’ebe a.
- source_word: Ἰωάννῃ
  choice: Jọn
  rationale: Aha a nọ n’ọnọdụ onye a na-agwa akụkọ; ngwaa “kọọrọ” egosilarị njikọ ahụ n’usoro asụsụ Igbo.
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: ihe unu na-anụ ma na-ahụ
  rationale: “Ihe” na-anọchi neuter plural relative ἃ n’Igbo eke, ebe ngwaa abụọ dị ugbu a na-egosi ihe ha na-anụ ma na-ahụ n’onwe ha.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: E dere aha ahụ n’ụdị Standard Igbo; artikụl Grik e tinyebeghị iche n’ihi na Igbo anaghị achọ ya n’ihu aha mmadụ.
theological_decisions:
- issue: Usoro okwu akụkọ ἀποκριθεὶς ... εἶπεν
  choice: Jizọs wee zaa ha sị
  alternative: Jizọs zara, sị ha
  rationale: Nhọrọ bụ nke usoro asụsụ, ọ bụghị nke ozizi. Isiokwu ahụ na-echekwa ma nzaghachi Jizọs ma mmalite okwu ya, ma na-eji usoro okwu Igbo dị eke.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị mfe ma dị ùgwù. “Gaanụ kọọrọ” na-enye usoro iwu abụọ ahụ n’ụzọ ndị mmadụ na-aghọta ngwa ngwa; ahapụrụ akara kọlọọn n’ọgwụgwụ n’ihi na amaokwu na-esote na-akọwa ihe ha ga-akọrọ Jọn.
