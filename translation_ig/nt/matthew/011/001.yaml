  source_fidelity: The translation accurately represents the narrative temporal transition, completed instruction to the twelve disciples, subsequent departure, purpose of teaching and proclaiming, and the unresolved reference of αὐτῶν in “n’obodo ha.” “Nyechara ... ntụziaka” appropriately conveys ἐτέλεσεν διατάσσων without weakening its authoritative sense.
