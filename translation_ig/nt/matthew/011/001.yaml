  terminology: “Ndị na-eso ụzọ ya iri na abụọ” is a clear, established rendering for the twelve disciples. “Izi ihe” and “ikwusa ozi” preserve the teaching/proclamation distinction. The alternative “inye iwu” in footnote a adequately records the stronger lexical possibility of διατάσσων.
