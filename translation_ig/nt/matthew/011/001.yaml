id: MAT.11.1
reference: Matthew 11:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: ig
  text: Mgbe Jizọs nyechara ndị na-eso ụzọ ya iri na abụọ ntụziaka[a], o si n’ebe ahụ gaa izi ihe na ikwusa ozi n’obodo ha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nyechara ndị na-eso ụzọ ya iri na abụọ iwu.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, okwu a sụgharịrị “obodo ha” akọwaghị kpọmkwem ndị ọ na-ekwu maka ha; o nwere ike ịbụ obodo ndị na-eso ụzọ ahụ ma ọ bụ, n’ozuzu ya, obodo ndị bi n’ógbè ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Mgbe
  rationale: Nke a bụ usoro Matiu ji ejikọta akụkọ ma gosipụta oge ihe ọzọ mere. “Mgbe” na-enye echiche ahụ n’Igbo dị ugbu a n’enweghị ịgbakwụnye okwu na-adịghị eke dịka “o wee ruo na mgbe.”
- source_word: ἐτέλεσεν
  choice: nyechara
  rationale: Ngwaa a na-egosi na Jizọs mezuru inye ntụziaka tupu ọ pụọ. Mgbakwunye “-chara” na-egosipụta usoro oge ahụ nke ọma n’Igbo.
- source_word: διατάσσων
  choice: inye … ntụziaka
  rationale: Okwu Grik a pụtara inye ntụziaka ma ọ bụ iwu n’ụzọ nwere ikike. “Inye ntụziaka” dabara n’okwu Jizọs gwara ndị ozi ya, ebe ndetu na-echekwa “inye iwu” dịka ụzọ ọzọ siri ike karị.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: ndị na-eso ụzọ ya iri na abụọ
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa μαθηταί n’Akụkọọma; e debere ọnụ ọgụgụ iri na abụọ kpọmkwem.
- source_word: μετέβη ἐκεῖθεν
  choice: o si n’ebe ahụ gaa
  rationale: Nkebi a na-egosi na ọ hapụrụ ebe ahụ gaa ebe ọzọ. Nsụgharị a bụ nke eke n’Igbo ma na-edobe mmegharị akụkọ ahụ.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: gaa izi ihe na ikwusa ozi
  rationale: Articular infinitive a na-egosi ebumnuche. “Izi ihe” na “ikwusa ozi” na-edobe ọdịiche dị n’etiti ịkụzi mmadụ na ikwupụta ozi n’ihu ọha.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: n’obodo ha
  rationale: “Obodo” nwere ike ịgụnye obodo ukwu ma ọ bụ obodo nta dịka πόλις si kwe mee. “Ha” na-edobe enweghị ido anya nke αὐτῶν banyere ndị obodo ndị ahụ bụ nke ha.
theological_decisions:
- issue: Onye αὐτῶν na-ezo aka na ya n’okwu ἐν ταῖς πόλεσιν αὐτῶν
  choice: E debere “n’obodo ha” n’enweghị ịkọwa ndị “ha” bụ.
  alternative: “n’obodo ndị na-eso ụzọ ya” ma ọ bụ “n’obodo ndị dị n’ógbè ahụ”
  rationale: Okwu Grik ahụ ekwughị kpọmkwem onye nnọchiaha ahụ na-ezo aka na ya. Ịhapụ “ha” otu ahụ na-echekwa ihe edemede ahụ hapụrụ n’amaghị ama kama idozi ya site na nkọwa onye ntụgharị.
translation_notes:
  register: E jiri Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị na-eso ụzọ” kama okwu ụka pụrụ iche, “obodo” ka ọ nwee ike ịgụnye town na city, ma debeghị ihe αὐτῶν na-ezo aka na ya n’ụzọ ga-emechi nghọta ọzọ.
