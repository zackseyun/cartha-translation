id: MAT.11.8
reference: Matthew 11:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: ig
  text: Ma gịnị ka unu gara ịhụ? Otu nwoke yi uwe dị nro[a]? Lee, ndị na-eyi uwe dị nro nọ n’ụlọ ndị eze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “yi uwe dị oké ọnụ ahịa.” N’asụsụ Grik, okwu ahụ pụtara n’ụzọ nkịtị “ihe dị nro” ma ọ bụ “uwe dị nro,” ma n’ebe a ọ pụrụ izo uwe dị oké ọnụ ahịa.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “n’obí ndị eze.” N’asụsụ Grik, ọ bụ n’ụzọ nkịtị, “n’ụlọ ndị eze.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Na-aga n’ihu n’ụzọ mmegide site n’ajụjụ bu ụzọ, ma na-ada nke ọma n’Igbo.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: gịnị ka unu pụrụ ịhụ
  rationale: Na-echekwa ajụjụ gbasara ihe ha gara ịhụ na nzube nke infinitive ἰδεῖν.
- source_word: ἄνθρωπον
  choice: nwoke
  rationale: Ọ bụ otu nwoke ka okwu a na-ekwu maka ya, ya bụ Jọn, ya mere ‘nwoke’ dabara kpọmkwem.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: yi uwe ndị dị nro
  rationale: Na-echekwa ihe Grik kwuru n’ụzọ nkịtị banyere uwe dị nro, ebe ọnọdụ okwu ahụ na-egosi uwe mara mma ma dị oké ọnụ ahịa.
- source_word: ἰδοὺ
  choice: Lee
  rationale: Okwu Igbo a na-adọta uche ma na-echekwa ike okwu ἰδοὺ n’enweghị asụsụ ochie.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: ndị na-eyi uwe ndị dị nro
  rationale: Na-echekwa nkwughachi nke μαλακά na echiche nke iyi ụdị uwe ahụ dịka ihe a na-emekarị.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: na-anọ n’ụlọ ndị eze
  rationale: Na-esochi ọtụtụ ‘ụlọ’ na ọtụtụ ‘eze’ dị na Grik, ma bụrụkwa Igbo a na-aghọta nke ọma.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo izugbe, nke ugbu a ma dị ùgwù. E jigidere usoro ajụjụ Jizọs na nkwughachi ‘uwe ndị dị nro,’ tinyere ọtụtụ ‘ụlọ ndị eze’; ndetu ala peeji na-akọwa echiche uwe okomoko na nhọrọ ‘obí ndị eze.’
