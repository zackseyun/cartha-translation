    text: A pụkwara ịsụ ya, “yi uwe dị oké ọnụ ahịa.” N’asụsụ Grik, okwu ahụ pụtara n’ụzọ nkịtị “ihe dị nro” ma ọ bụ “uwe dị nro,” ma n’ebe a ọ pụrụ izo uwe dị oké ọnụ ahịa.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “n’obí ndị eze.” N’asụsụ Grik, ọ bụ n’ụzọ nkịtị, “n’ụlọ ndị eze.”
    reason: lexical_alternative
  revision_rationale: The revision restores ἐξήλθατε with ‘gara,’ uses more idiomatic collective clothing language, and narrows the lexical footnote to what the Greek wording and context support. It retains the source’s rhetorical sequence, repetition, and plural expression ‘houses of kings.’
