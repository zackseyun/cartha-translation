  text: The one who has ears[a], let him hear.
translation:
  language: ig
  text: Onye nwere ntị[a], ka ọ nụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Onye ọ bụla nwere ntị, ka ọ nụ.” Okwu Grik ji onye otu kwuo okwu n’ozuzu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Onye nwere
  rationale: Nkebiokwu a, nke nwere edemede na participle, na-arụ ọrụ dị ka aha ma na-ezo aka n'ozuzu nye onye ọ bụla nwere àgwà a. “Onye nwere” bụ ụzọ Igbo dị mfe ma kwekọọ n'echiche ahụ.
- source_word: ὦτα
  choice: ntị
  rationale: Ọ bụ ezie na okwu Grik dị n'ụdị ọtụtụ, “ntị” n'Igbo nwere ike izo aka n'akụkụ ahụ abụọ n'ụzọ ebumpụta ụwa; ọ na-echekwakwa akpaalaokwu nke ịkpọ mmadụ ka ọ ghọta ma ṅaa ntị.
- source_word: ἀκουέτω
  choice: ya nụrụ
  rationale: Nke a na-egosipụta iwu onye nke atọ dị na Grik n'ụzọ Igbo dị nkenke. “Nụrụ” na-echekwa echiche sara mbara nke ịnụ, ige ntị, na ịnabata ihe a na-ekwu, kama imechi ya naanị n'ige ntị.
theological_decisions:
- issue: Okwu onye otu e ji ekwu maka mmadụ niile
  choice: Onye nwere ntị, ya nụrụ.
  alternative: Onye ọ bụla nwere ntị, ya gee ntị.
  rationale: Grik ji onye otu kwuo okwu n'ozuzu. Nsụgharị a na-echekwa onye otu ahụ ma ghara itinye nwoke ma ọ bụ nwanyị ebe ụtọasụsụ Igbo na-adịghị achọ ya; ọ ka na-agụnye onye ọ bụla okwu ahụ metụtara.
translation_notes:
  register: Igbo ọkọlọtọ, dị mfe ma dị ùgwù. E chekwara akpaalaokwu Baịbụl nke “inwe ntị” na “ịnụ,” nke na-akpọ onye na-agụ ya ka ọ ghọta ma nabata ihe a kwuru.
