  text: Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: ig
  text: Ma gịnị ka m ga-eji tụnyere ọgbọ a? Ọ dị ka ụmụaka nọ ọdụ n'ebe ndị mmadụ na-azụ ahịa[a], na-akpọ ndị ọzọ oku[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, ‘n'ámá ahịa.’ Okwu Grik a bụ maka ebe ọha ndị mmadụ na-ezukọ ma na-azụ ahịa.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, ‘na-akpọ ụmụaka ndị ọzọ oku.’ N'asụsụ Grik, ihe e dere bụ ‘ndị ọzọ’; ihe atụ a na-egosi ndị ha bụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι δὲ ὁμοιώσω
  choice: Ma gịnị ka m ga-eji tụnyere
  rationale: Ajụjụ a na-achọ ihe a ga-eji mee ntụnyere. Usoro ‘gịnị ka m ga-eji tụnyere’ bụ Igbo ebumpụta ụwa ma na-echekwa ike ajụjụ ọdịnihu ahụ.
- source_word: τὴν γενεὰν ταύτην
  choice: ọgbọ a
  rationale: ‘Ọgbọ a’ na-ezo n'ụzọ doro anya nye ndị dị ndụ n'otu oge ahụ, dịka γενεά si arụ ọrụ n'okwu a.
- source_word: ὁμοία ἐστὶν παιδίοις
  choice: Ọ dị ka ụmụaka
  rationale: Nke a bụ ntụgharị doro anya nke predicate nke myirịta, n'etinyeghị nkọwa ọzọ na-adịghị na isi mmalite.
- source_word: καθημένοις
  choice: nọ ọdụ
  rationale: Nkebiokwu a na-egosi ọnọdụ ụmụaka ahụ n'ụzọ Igbo a na-asụkarị.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: n'ebe ndị mmadụ na-azụ ahịa
  rationale: ἀγορά bụ ebe ọha na-ezukọ ma na-azụ ahịa; ntụgharị a na-eme ka ebe ahụ doo onye Igbo nke oge a anya n'enweghị ime ya naanị otu ụlọ ahịa.
- source_word: προσφωνοῦντα
  choice: na-akpọ ... oku
  rationale: Nke a na-egosi na ụmụaka ahụ ji olu ha kpọrọ ndị ọzọ n'ebe ọha.
- source_word: τοῖς ἑτέροις
  choice: ndị ọzọ
  rationale: A hapụrụ ya dịka ‘ndị ọzọ’ iji chekwaa enweghị nkọwa zuru ezu dị n'okwu Grik; ihe atụ ahụ na-egosi na o nwere ike ịbụ ụmụaka ndị ọzọ.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. ‘N'ebe ndị mmadụ na-azụ ahịa’ na-ezere nghọtahie nke ‘ahịa’ dịka ihe a na-ere, ebe ndetu ala peeji na-enye ‘ámá ahịa’ dịka ụzọ ọzọ dị nkenke.
