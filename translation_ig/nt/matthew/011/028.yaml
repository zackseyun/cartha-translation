  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: ig
  text: Bịakwutenụ m, unu niile ndị na-adọgbu onwe ha n'ọrụ na ndị e bokwasịrị ibu arọ[a]; m ga-enyekwa unu izu ike[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị e nyerela ibu arọ ka ha buru.” Okwu Grik ahụ na-egosi na e bokwasịla ha ibu, ha ka nọkwa n'ọnọdụ ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ga-enye unu ume ọhụrụ.” Ngwaa Grik ahụ nwere ike ịpụta ime ka mmadụ zuru ike ma ọ bụ mee ka o nweta ume ọhụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε πρός με
  choice: Bịakwutenụ m
  rationale: Nke a bụ òkù doro anya ka ọtụtụ mmadụ bịakwute onye na-ekwu okwu; ọ na-egosipụta mmegharị a na-eme n'ebe mmadụ nọ n'Igbo nkịtị.
- source_word: πάντες
  choice: unu niile
  rationale: Ọ na-edobe oke òkù ahụ nke gụnyere ndị niile a na-akpọ, ma na-egosikwa na onye nnọchiaha Grik bụ ọtụtụ.
- source_word: οἱ κοπιῶντες
  choice: ndị na-adọgbu onwe unu n'ọrụ
  rationale: Ọ na-egosipụta ndọgbu na ike ọgwụgwụ sitere n'ịrụsi ọrụ ike, ma na-edobe ụzọ omume nke participle ahụ.
- source_word: πεφορτισμένοι
  choice: ndị e bokwasịrị ibu arọ
  rationale: 'Ọ na-egosipụta perfect passive: e bokwasịla ha ibu, ha ka nọkwa n''ọnọdụ ibu ahụ na-anyịgbu ha.'
- source_word: κἀγὼ
  choice: mụ onwe m ga-enyekwa
  rationale: “Mụ onwe m” na-edobe ntakịrị nkwusi ike dị na κἀγώ; “-kwa” na-egosipụta njikọ dị na καί n'ụzọ Igbo na-ada nke ọma.
- source_word: ἀναπαύσω ὑμᾶς
  choice: ga-enyekwa unu izu ike
  rationale: Nke a bụ okwu Igbo doro anya maka ime ka mmadụ zuru ike ma ọ bụ nweta ahụ efe, n'emeghị ka nkwa ahụ bụrụ naanị nke mmụọ, nke anụ ahụ, ma ọ bụ nke mmetụta uche.
theological_decisions:
- issue: Ụdị izu ike e kwere ná nkwa n'okwu ἀναπαύσω
  choice: ga-enyekwa unu izu ike
  alternative: ga-enye unu ume ọhụrụ
  rationale: Amaokwu ahụ akọwaghị kpọmkwem ma izu ike a ọ̀ bụ nke mmụọ, nke ikpeazụ n'ọdịnihu, nke mmetụta uche, ma ọ bụ nke anụ ahụ. Nsụgharị sara mbara na-edobe nghọta ndị ahụ n'ebughị ozizi pụrụ iche bata.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ụdị ọtụtụ mmadụ pụtara ìhè na “bịakwutenụ,” “unu niile,” na “unu.” E debere ihe amaokwu ahụ na-ahapụ n'amaghị kpọmkwem banyere ụdị ibu na ụdị izu ike.
