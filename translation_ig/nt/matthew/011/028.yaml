- from: Bịakwutenụ m, unu niile ndị na-adọgbu onwe unu n'ọrụ na ndị e bokwasịrị ibu arọ[a], mụ onwe m ga-enyekwa unu izu ike[b].
  to: Bịakwutenụ m, unu niile ndị na-adọgbu onwe ha n'ọrụ na ndị e bokwasịrị ibu arọ[a]; m ga-enyekwa unu izu ike[b].
  rationale: The revision corrects relative-clause person agreement and removes unwarranted reflexive emphasis, while preserving the source’s inclusive summons, its distinction between those toiling and those burdened, and the deliberately broad promise of rest. The footnote anchors remain attached to the terms they explain.
