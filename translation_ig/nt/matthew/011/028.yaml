review_pass:
  verdict: revise
  source_fidelity: The draft conveys the invitation, its comprehensive plural scope, the active toil of κοπιῶντες, the resultant burdened state of πεφορτισμένοι, and the broad promise of ἀναπαύσω. “Mụ onwe m,” however, gives κἀγώ a stronger reflexive emphasis than the Greek requires.
  naturalness: The phrasing is generally clear Standard Igbo. Replacing “ndị na-adọgbu onwe unu n'ọrụ” with “ndị na-adọgbu onwe ha n'ọrụ” gives proper relative-clause agreement and more natural idiom. “M ga-enyekwa unu izu ike” is natural and maintains the broad sense.
  terminology: “Ibu arọ” and “izu ike” are accurate, dignified, and theologically nonrestrictive. The burden footnote correctly reflects the perfect passive’s continuing resultant state; the rest footnote preserves the lexical alternative without narrowing the promise.
  issues:
  - severity: medium
    issue: Person agreement in the first substantival participial phrase
    rationale: “Ndị na-adọgbu onwe unu n'ọrụ” combines the third-person head noun “ndị” with second-person reflexive “onwe unu.” In Standard Igbo, “ndị na-adọgbu onwe ha n'ọrụ” is the natural relative-clause construction and retains the plural addressees indicated by the preceding “unu niile.”
  - severity: low
    issue: Overtranslation of κἀγώ
    rationale: “Mụ onwe m” can imply emphatic ‘I myself,’ whereas κἀγώ here marks the explicit subject with conjunction and only mild emphasis. “M ga-enyekwa” adequately carries the subject and connective force without adding emphasis.
  revised_text: Bịakwutenụ m, unu niile ndị na-adọgbu onwe ha n'ọrụ na ndị e bokwasịrị ibu arọ[a]; m ga-enyekwa unu izu ike[b].
  revised_footnotes:
