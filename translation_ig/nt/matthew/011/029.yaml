- from: Bunyerenụ onwe unu yoke m, mụtakwanụ ihe n’aka m, n’ihi na adị m nwayọọ, dịkwa umeala n’obi; unu ga-ahụkwa izu ike nye mkpụrụ obi unu.
  to: Buru yok m n’elu unu, mụtakwanụ ihe n’aka m, n’ihi na m dị nwayọọ[a], dịkwa umeala n’obi; unu ga-ahụkwa izu ike maka mkpụrụ obi unu.
  rationale: The revision replaces an unnatural opening and an untranslated English form with a direct Standard Igbo expression that preserves the yoke metaphor. It also smooths the self-description and supplies a restrained lexical-alternative footnote corresponding to the audit trail. The meaning, plural address, imperatives, and promise remain unchanged.
