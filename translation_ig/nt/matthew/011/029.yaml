id: MAT.11.29
reference: Matthew 11:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: ig
  text: Buru yok m n’elu unu, mụtakwanụ ihe n’aka m, n’ihi na m dị nwayọọ[a], dịkwa umeala n’obi; unu ga-ahụkwa izu ike maka mkpụrụ obi unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị nro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: Bunyerenụ onwe unu yoke m
  rationale: Nke a na-edobe ihe atụ nke ibu yoke n’ahụ mmadụ ma na-egosi ịnakwere ọchịchị na nkuzi Jizọs; ụdị iwu ọtụtụ mmadụ dị na -nụ.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: mụtakwanụ ihe n’aka m
  rationale: “Ịmụ ihe n’aka mmadụ” bụ ụzọ Igbo doro anya si ekwu ịnata nkuzi ya; -kwa- jikọtara iwu nke abụọ na nke mbụ.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-eweta ihe mere Jizọs ji bụrụ onye ha kwesịrị ịmụ ihe n’aka ya.
- source_word: πραΰς
  choice: adị m nwayọọ
  rationale: “Ịdị nwayọọ” na-egosi ịdị nro na enweghị aka ike, na-enweghị echiche na onye ahụ adịghị ike.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: dịkwa umeala n’obi
  rationale: Nke a na-edobe ịdị umeala dị ka àgwà ime obi, dịka nkebi Grik si kwuo.
- source_word: εὑρήσετε ἀνάπαυσιν
  choice: unu ga-ahụkwa izu ike
  rationale: Ọ na-edobe ọdịdị nkwa nke ngwaa ọdịnihu na isi echiche nke ἀνάπαυσις.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: nye mkpụrụ obi unu
  rationale: Dative ahụ na-egosi ndị na-enweta izu ike; “mkpụrụ obi” na-edobe ihe gbasara ndụ ime mmadụ n’enweghị ibelata ya ka ọ bụrụ naanị mmetụta.
theological_decisions:
- issue: Nkọwa Jizọs banyere àgwà ya na πραΰς ... καὶ ταπεινὸς τῇ καρδίᾳ
  choice: adị m nwayọọ, dịkwa umeala n’obi
  alternative: adị m nro, dịkwa ala n’obi
  rationale: Nhọrọ a bụ Igbo ugbu a, dị ùgwù ma doo anya; ọ na-edobe ịdị nwayọọ na ịdị umeala dị n’ime obi n’enweghị ịkọwa ya dịka adịghị ike ma ọ bụ tinye ozizi otu ụka.
translation_notes:
  register: Standard Igbo dị ugbu a ma dị ùgwù. E debere “yoke” dịka ihe atụ bụ isi nke amaokwu ahụ; ahịrịokwu ahụ na-agwa ọtụtụ mmadụ okwu site n’iji ụdị iwu na nnọchiaha ọtụtụ mmadụ.
