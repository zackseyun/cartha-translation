id: MAT.11.7
reference: Matthew 11:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: ig
  text: 'Mgbe ndị a na-apụ, Jizọs malitere ịgwa ìgwè mmadụ okwu banyere Jọn, sị: “Gịnị ka unu gara n’ọzara ile anya? Ọ̀ bụ ahịhịa amị nke ifufe na-ebugharị?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ihe oyiyi ahịhịa amị nke ifufe na-ebugharị nwere ike igosi enweghị nkwụsi ike ma ọ bụ onye na-agbanwe agbanwe; ajụjụ Jizọs na-atụ anya azịza “Mba” banyere Jọn.
    reason: cultural_note
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: Mgbe ndị a na-apụ
  rationale: Nkebiokwu genitive absolute a na-egosi ihe na-eme n’otu oge. ‘Ndị a’ na-ezo aka n’ebe ndị na-eso ụzọ Jọn nọ n’amaokwu bu ụzọ, ma ọ naghị etinye nkọwa karịrị ihe Grik kwuru.
- source_word: ἤρξατο ... λέγειν
  choice: malitere ịgwa ... okwu
  rationale: Ọ na-egosipụta mmalite ikwu okwu ma na-ada nke ọma n’Igbo mgbe a kpọrọ ndị a na-agwa okwu.
- source_word: τοῖς ὄχλοις
  choice: ìgwè mmadụ
  rationale: Nke a bụ okwu Igbo dị ndụ ma doo anya maka ọtụtụ mmadụ gbakọrọ ọnụ; asụsụ Igbo anaghị achọkarị ime ka ụdị plural Grik pụta ìhè ebe a.
- source_word: περὶ Ἰωάννου
  choice: banyere Jọn
  rationale: περί ya na genitive na-egosi isiokwu a na-ekwu maka ya; ‘banyere’ bụ nsụgharị Igbo kpọmkwem ma dị mfe nghọta.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: Gịnị ka unu gara n’ọzara ile anya?
  rationale: τί bụ ‘gịnị,’ ọ bụghị ‘n’ihi gịnị.’ ‘Ile anya’ na-eburu echiche θεάομαι nke ịga kirie ma ọ bụ hụ ihe anya.
- source_word: κάλαμον
  choice: ahịhịa amị
  rationale: κάλαμος ebe a bụ reed; ‘ahịhịa amị’ na-eme ka osisi ahụ doo onye Igbo nke oge a anya.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: nke ifufe na-efufegharị
  rationale: Nke a na-edobe onyinyo nke amị ifufe na-eme ka ọ maa jijiji ma kwagharịa, n’asụsụ Igbo na-ada nke ọma.
theological_decisions:
- issue: Onye Τούτων (‘ndị a’) na-ezo aka na ya
  choice: E debere ya dịka ‘ndị a,’ nke ọnọdụ amaokwu gara aga na-egosi na ha bụ ndị na-eso ụzọ Jọn.
  alternative: Ịsị kpọmkwem ‘ndị na-eso ụzọ Jọn’ ma ọ bụ iji naanị ‘ha.’
  rationale: ‘Ndị a’ na-edobe nkwupụta Grik ma na-ahapụ ọnọdụ gbara ya gburugburu ka ọ kọwaa ndị ọ bụ, n’etinyeghị nkọwa ọzọ n’ahịrịokwu.
- issue: Ihe oyiyi nke amị ifufe na-efufegharị
  choice: E debere ya dịka ajụjụ ihe atụ, n’akọwaghị ihe ọ pụtara n’ime amaokwu ahụ.
  alternative: Ịsụgharị ya n’ụzọ ga-akọwa na ọ na-anọchi anya mmadụ na-enweghị nkwụsi ike.
  rationale: Ajụjụ ahụ na-atụ anya azịza mba ma nwee ike ịrụtụ aka na enweghị nkwụsi ike, ma nsụgharị ekwesịghị ime ka nkọwa ahụ bụrụ okwu Jizọs kwuru kpọmkwem.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E jighị okwu ụka pụrụ iche; e debere usoro ajụjụ nkwupụta nke Grik. Akara poznụt [a] dị n’ebe ọ metụtara n’ahịrịokwu.
