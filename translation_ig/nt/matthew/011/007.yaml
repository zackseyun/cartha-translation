  to: 'Mgbe ndị a na-apụ, Jizọs malitere ịgwa ìgwè mmadụ okwu banyere Jọn, sị: “Gịnị ka unu gara n’ọzara ile anya? Ọ̀ bụ ahịhịa amị nke ifufe na-ebugharị?[a]”'
