    issue: “dị mfe” renders ἐλαφρόν imprecisely.
    rationale: In this parallelism, χρηστός may convey kind/good/pleasant, while ἐλαφρόν means light. Replacing “dị mfe” with “dị fechaa” preserves the Greek lexical contrast and the physical-load metaphor.
