  verdict: revise
  source_fidelity: The draft correctly conveys the causal clause, Jesus' possessive reference, ζυγός as “ịnyagba,” and φορτίον as “ibu.” However, ἐλαφρόν specifically denotes being light in weight, whereas “dị mfe” primarily means easy/not difficult. This weakens the deliberate distinction between χρηστός and ἐλαφρόν.
  naturalness: The sentence is concise, idiomatic Standard Igbo, and its register suits the saying. “Dị fechaa” is a natural and more exact predicate for an “ibu.”
  terminology: “Ịnyagba” and “ibu” appropriately retain the agricultural/load-bearing imagery. “Dị mma” is a suitably broad rendering of χρηστός (“kind/good/pleasant”) without prematurely narrowing it to “easy.”
  issues:
