id: MAT.11.30
reference: Matthew 11:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: ig
  text: N’ihi na ịnyagba m dị mma, ibu m dịkwa fechaa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζυγός
  choice: ịnyagba
  rationale: Ọ bụ ihe e ji ejikọ anụmanụ ibu ma ọ bụ dọkpụrụ ihe; n’ebe a, ọ na-arụ ọrụ dị ka ihe atụ nke ido onwe onye n’okpuru nduzi na ọrụ Jizọs.
- source_word: χρηστός
  choice: dị mma
  rationale: Okwu a nwere echiche nke ịdị mma, ịdị obiọma, ma ọ bụ ịbụ ihe na-adịghị akpa onye ahụ ike. ‘Dị mma’ na-edobe obosara echiche ahụ kama ịkọwa ya naanị dị ka ‘dị mfe.’
- source_word: φορτίον
  choice: ibu
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka ihe a na-eburu, ma na-arụkwa ọrụ nke ọma n’ihe atụ.
- source_word: ἐλαφρόν
  choice: dị mfe
  rationale: N’ịkọwa ibu, ọ pụtara na ibu ahụ adịghị arọ; ‘dị mfe’ bụ asụsụ Igbo eke nke na-egosi na ọ naghị esiri onye buru ya ike.
theological_decisions:
- issue: Mmekọrịta dị n’etiti χρηστός na ἐλαφρόν
  choice: A sụgharịrị ha iche dịka ‘dị mma’ na ‘dị mfe.’
  alternative: ‘dị mfe’ na ‘dị fechaa’
  rationale: Nke a na-ezere ime ka okwu abụọ ahụ bụrụ otu ihe, ma na-echekwa echiche nke ịdị mma/obiọma dị na χρηστός yana echiche nke adịghị arọ dị na ἐλαφρόν.
translation_notes:
  register: Asụsụ Standard Igbo dị ugbu a, dị nkenke ma nwee ugwu. E jighị nkọwa ụka pụrụ iche dochie ihe atụ nke ịnyagba na ibu.
