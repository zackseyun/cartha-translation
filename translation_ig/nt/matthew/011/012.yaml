id: MAT.11.12
reference: Matthew 11:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: ig
  text: Ma kemgbe ụbọchị Jọn Onye Na-eme Baptizim ruo ugbu a, a na-emeso alaeze eluigwe ihe ike.[a] Ndị na-eme ihe ike na-ejidekwa ya n’ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “alaeze eluigwe ji ike na-aga n’ihu, ndị ji ike na-ejidekwa ya.” Ngwaa Grik a sụgharịrị “a na-emeso ... ihe ike” nwekwara ike ịghọta n’echiche etiti.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: Ma site
  rationale: “Site” na-egosi mmalite oge, ebe “ma” na-edobe ntụgharị okwu dị nro nke δέ n’ebughị nnukwu mmegide n’ime ya.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: n’ụbọchị Jọn Onye Na-eme Baptizim
  rationale: Nke a na-edobe akpaalaokwu Grik nke pụtara “ụbọchị Jọn,” ma na-eji aha ọrụ ya n’Igbo doro anya ma dị ugwu.
- source_word: ἕως ἄρτι
  choice: ruo ugbu a
  rationale: Ọ bụ ụzọ Igbo nkịtị si egosi oge malitere n’oge Jọn wee na-aga n’ihu ruo oge onye na-ekwu okwu.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: alaeze eluigwe
  rationale: Nke a bụ okwu a maara nke ọma n’Igbo maka ọchịchị ma ọ bụ alaeze sitere n’eluigwe, ma kwekọọ n’ụzọ Matiu si eji okwu ahụ.
- source_word: βιάζεται
  choice: a na-emeso ... ihe ike
  rationale: A họọrọ nghọta passive n’ahịrị bụ isi. Ọ na-egosi na a na-eme alaeze ahụ ihe ike ma na-aga nke ọma na βιασταὶ na-esochi ya, na-enweghị ikwu karịa ihe Grik kwuru.
- source_word: βιασταὶ
  choice: ndị na-eme ihe ike
  rationale: Nke a na-enye echiche ndị ji ike ma ọ bụ ime ihe ike eme ihe. N’Igbo, “ndị” bụ ọtụtụ mmadụ n’enweghị ịmanye okike nwoke ebe asụsụ ahụ anaghị achọ ya.
- source_word: ἁρπάζουσιν αὐτήν
  choice: na-ejidekwa ya n’ike
  rationale: “Ijide n’ike” na-eburu echiche nke ịnapụ ma ọ bụ iweghara ihe n’ike dị na ἁρπάζω, ma bụrụkwa okwu Igbo doro anya.
theological_decisions:
- issue: Ihe βιάζεται pụtara n’ihe gbasara alaeze eluigwe
  choice: 'A gụrụ ya dị ka passive n’ahịrị bụ isi: “a na-emeso alaeze eluigwe ihe ike.”'
  alternative: 'A pụkwara ịgụ ya n’echiche middle/intransitive: “alaeze eluigwe ji ike na-aga n’ihu, ndị ji ike na-ejidekwa ya.”'
  rationale: Ụdị Grik ahụ nwere mgbagwoju anya n’ezie. Nghọta passive dabara na okwu gbasara ndị na-eme ihe ike na-esote, ma nghọta na alaeze ahụ ji ike na-aga n’ihu nwekwara nkwado. Ya mere, e debere nke ọzọ n’ala peeji kama idozi esemokwu ahụ n’ụzọ otu akụkụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E debere akpaalaokwu “n’ụbọchị Jọn” na “alaeze eluigwe,” ma jiri nkọwa ala peeji chekwaa mgbagwoju anya dị na βιάζεται.
