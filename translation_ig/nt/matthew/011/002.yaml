- from: Mgbe Jọn nọ n’ụlọ mkpọrọ nụrụ banyere ọrụ Mesaịa ahụ[a], o sitere n’aka ndị na-eso ụzọ ya ziga ozi.
  to: Mgbe Jọn nọ n’ụlọ mkpọrọ nụrụ banyere ọrụ Mesaịa ahụ[a], o zipụrụ ozi site n’aka ndị na-eso ụzọ ya.
  rationale: The revision preserves the source’s temporal participle, John’s location in prison, the collective sense of “works,” the title “Messiah,” and the disciples’ intermediary role. It only regularizes Igbo word order and makes the agency of the disciples clearer, without supplying the content of the message from the following verse.
