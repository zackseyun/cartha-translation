    text: Ma ọ bụ, “ọrụ Kraịst.”
    reason: alternative_reading
  revision_rationale: The revision preserves the source’s temporal participle, John’s location in prison, the collective sense of “works,” the title “Messiah,” and the disciples’ intermediary role. It only regularizes Igbo word order and makes the agency of the disciples clearer, without supplying the content of the message from the following verse.
