  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: ig
  text: Mgbe Jọn nọ n’ụlọ mkpọrọ nụrụ banyere ọrụ Mesaịa ahụ[a], o zipụrụ ozi site n’aka ndị na-eso ụzọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọrụ Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: E gosipụtaghị ya iche
  rationale: Ọ bụ njikọ na-akwalite akụkọ n’ihu; n’Igbo, ahịrịokwu a na-aga nke ọma n’enweghị ịtinye okwu oge na-adịghị n’isi mmalite Grik.
- source_word: ἀκούσας
  choice: Mgbe Jọn ... nụrụ
  rationale: A tụgharịrị participle aorist ahụ dịka nkebiokwu oge, nke bụ Igbo nkịtị ma na-egosi na ịnụ ahụ butere iziga ozi.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: nọ n’ụlọ mkpọrọ
  rationale: Nke a na-egosipụta ebe Jọn nọ n’ụzọ doro anya ma bụrụkwa okwu Igbo nkịtị.
- source_word: τὰ ἔργα
  choice: ọrụ
  rationale: “Ọrụ” na-edobe obosara ἔργα, nke pụrụ ịgụnye ọrụ ebube na ihe ndị ọzọ Mesaịa mere.
- source_word: τοῦ χριστοῦ
  choice: Mesaịa ahụ
  rationale: Χριστός na-arụ ọrụ dịka utu aha n’ebe a; “Mesaịa” na-edobe echiche nke Onye E Tere Mmanụ.
- source_word: πέμψας
  choice: ziga ozi
  rationale: Ihe e zigara adịghị akọwapụta kpọmkwem n’amaokwu a, ma amaokwu na-esote na-egosi na ọ bụ ozi; ntụgharị a bụ Igbo eke.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: site n’aka ndị na-eso ụzọ ya
  rationale: διά tinyere genitive na-egosi ndị e ji mee ụzọ ma ọ bụ ndị nnọchi anya; okwu a na-egosipụta nke ahụ nke ọma n’Igbo.
theological_decisions:
- issue: Ntughari Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a, okwu ahụ bụ utu aha metụtara ọrụ ndị e tụrụ anya na Mesaịa ga-arụ. E debere “Kraịst” n’okpuru dị ka ụzọ ọdịnala ọzọ, n’emeghị ka ihe okwu Grik ahụ pụtara funahụ.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị na-eso ụzọ” kama okwu ụka pụrụ iche, ma debe “Mesaịa” dịka utu aha.
