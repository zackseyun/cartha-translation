id: MAT.11.26
reference: Matthew 11:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: ig
  text: Ee[a], Nna, n’ihi na nke a bụ ihe dị gị mma n’anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ezie”; a pụkwara ịsụ ngwụcha amaokwu ahụ, “n’ihi na ọ bụ ihe masịrị gị ime.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Ee
  rationale: Ọ bụ nkwenye kpọmkwem n’ekpere a; “Ee” bụ okwu Igbo kachasị mfe ma bụrụkwa nke e ji ekweta ihe.
- source_word: ὁ πατήρ
  choice: Nna
  rationale: Ọ bụ ịkpọ Nna okwu ozugbo. Igbo anaghị achọ itinye okwu ochie yiri “O” ka okwu a wee bụrụ nke ugwu.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a, ọ na-egosi ihe kpatara nkwenye ahụ, ya mere “n’ihi na” na-eme ka njikọ ahụ doo anya.
- source_word: οὕτως
  choice: nke a
  rationale: Ọ na-atụ aka n’ụzọ Chineke si mee ihe nke a kọwara n’amaokwu gara aga; “nke a” bụ ụzọ Igbo dị ndụ si kwuo ya.
- source_word: εὐδοκία
  choice: ihe dị … mma n’anya
  rationale: Nkebiokwu a na-egosi ihe na-atọ onye ụtọ ma ọ bụ nke ọ nabatara, n’etinyeghị echiche siri ike karịa ederede ahụ banyere iwu e kpebiri tupu oge eruo.
- source_word: ἐγένετο
  choice: bụ
  rationale: Ọ bụ ezie na okwu Grik ahụ nwekwara ike ịpụta “ghọrọ” ma ọ bụ “mere,” njikọ a na-adịkarị mma n’Igbo ma e jiri “bụ” kwuo ya.
- source_word: ἔμπροσθέν σου
  choice: dị gị … n’anya
  rationale: N’ụdị okwu a, ihe dị mmadụ mma “n’anya” na-enye echiche nke ihe na-atọ ya ụtọ ma ọ bụ ihe ọ nabatara, kama nsụgharị nkịtị na-adịghị eke ekwu n’Igbo.
theological_decisions:
- issue: Ma a ga-asụgharị εὐδοκία dị ka ihe na-egosi mkpebi/ebumnuche Chineke, ka ọ bụ ihe dị ya mma ma na-atọ ya ụtọ
  choice: ihe dị gị mma n’anya
  alternative: ọ bụ ezi uche gị; ọ bụ ihe masịrị gị ime
  rationale: Nhọrọ a na-egosi nnabata na obi ụtọ Nna n’ụzọ o si mee ihe, ma ọ naghị amanye okwu ahụ ka ọ bụrụ naanị iwu ma ọ bụ atụmatụ e kpebiri tupu oge eruo.
translation_notes:
  register: Igbo izugbe nke oge a, dị mfe ma nwee ugwu. E ji “ihe dị gị mma n’anya” mee ka εὐδοκία ἐγένετο ἔμπροσθέν σου bụrụ okwu Igbo eke, ma debe ohere dị n’etiti ihe na-atọ Nna ụtọ na ihe ọ họọrọ ime.
