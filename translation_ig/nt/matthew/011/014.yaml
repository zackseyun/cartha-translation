    reason: cross_reference
  revision_rationale: The revision improves idiomatic Standard Igbo while preserving all of the Greek text’s conditionality and direct identification. The explanatory footnote is recast so that it does not replace “he is Elijah” with a weaker role-only statement or settle the interpretive question.
