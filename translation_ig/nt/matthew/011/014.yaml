  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: ig
  text: Ọ bụrụ na unu dị njikere ịnabata ya,[a] ọ bụ Ịlaịja ahụ ga-abịa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụrụ na unu dị njikere ịnara ya.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, a na-ekwu na Jọn Onye Na-eme Baptizim bụ Ịlaịja ahụ e kwuru na ọ ga-abịa; tulee Malakaị 4:5 na Matiu 17:10–13.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ εἰ θέλετε δέξασθαι
  choice: Ọ bụrụkwa na unu dị njikere ịnabata ya
  rationale: Ngwakọta θέλετε na infinitive δέξασθαι na-egosi ịdị njikere ịnabata ihe, ọ bụghị naanị ọchịchọ. “Ịnabata ya” bụ okwu Igbo doro anya ma kwekọọ na ihe a na-aghọta dị ka ihe ha ga-anabata.
- source_word: αὐτός
  choice: ọ bụ
  rationale: Nnọchiaha a na-arụtụ aka na Jọn Onye Na-eme Baptizim. Ụdị “ọ bụ” na-eweta nkwupụta njirimara ahụ n'ụzọ nkịtị n'Igbo, na-enweghị ịgbakwunye nkwusi ike na-adịghị mkpa.
- source_word: ἐστιν Ἠλίας
  choice: Ịlaịja
  rationale: A sụgharịrị nkwupụta njirimara ahụ kpọmkwem dịka “ọ bụ Ịlaịja,” kama ịgbanwe ya ka ọ bụrụ naanị onye yiri Ịlaịja ma ọ bụ onye na-arụ ọrụ ya.
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: ahụ nke ga-abịa
  rationale: “Nke ga-abịa” na-echekwa atụmanya ọdịnihu dị na okwu Grik ahụ; “ahụ” na-egosi onye ahụ a tụrụ anya ya n'amụma.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” na-ejikọta amaokwu a na okwu bu ya ụzọ n'ụzọ dị mma n'Igbo, dịka καὶ si eme.
theological_decisions:
- issue: Ịkpọ Jọn Onye Na-eme Baptizim Ịlaịja
  choice: 'E debere ya kpọmkwem: “ọ bụ Ịlaịja ahụ nke ga-abịa.”'
  alternative: “ọ bụ onye na-arụ ọrụ Ịlaịja” ma ọ bụ “ọ dị ka Ịlaịja.”
  rationale: Grik kwuru njirimara ahụ n'ụzọ doro anya, ma tinye ya n'okpuru ọnọdụ nke njikere ndị na-ege ntị ịnabata ya. Nsụgharị ahụ na-echekwa ma ike nkwupụta ahụ ma esemokwu nkọwa ya, n'ekpebighị kpọmkwem otu amụma ahụ si mezuo.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “unu” mee ka onye nke abụọ n'ụbara dị na Grik pụta ìhè; e zere ịkọwa njirimara Jọn na Ịlaịja karịa ihe amaokwu ahụ kwuru.
