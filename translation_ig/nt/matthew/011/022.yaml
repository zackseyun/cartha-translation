- from: 'Ma ana m agwa unu: n’ụbọchị ikpe, ọ ga-adịrị Taịa na Saịdọn mfe idi[a] karịa ka ọ ga-adịrị unu.'
  to: 'Ma ana m agwa unu: n’ụbọchị ikpe, ọ ga-adịrị Taịa na Saịdọn mfe ịnagide karịa ka ọ ga-adịrị unu.[a]'
  rationale: The revision replaces the unnatural “mfe idi” with “mfe ịnagide,” which accurately expresses the comparative sense of what can be endured. The comparative structure, future force, plural address, and broad judicial meaning remain unchanged. The footnote is revised to give a distinct, natural lexical alternative.
  reviewer_model: gpt-5.6-terra
