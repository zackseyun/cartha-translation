    text: Ma ọ bụ, “mfe ịtachi obi.”
    reason: lexical_alternative
  revision_rationale: The revision replaces the unnatural “mfe idi” with “mfe ịnagide,” which accurately expresses the comparative sense of what can be endured. The comparative structure, future force, plural address, and broad judicial meaning remain unchanged. The footnote is revised to give a distinct, natural lexical alternative.
