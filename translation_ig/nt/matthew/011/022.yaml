source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: ig
  text: 'Ma ana m agwa unu: n’ụbọchị ikpe, ọ ga-adịrị Taịa na Saịdọn mfe ịnagide karịa ka ọ ga-adịrị unu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mfe ịtachi obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ma
  rationale: “Ma” na-egosi ntụgharị siri ike megide okwu ikpe ndị bu ụzọ, ma bụrụkwa okwu Igbo dị mfe ma kwekọọ n’asụsụ a na-asụ ugbu a.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a na-echekwa onye na-ekwu okwu, ndị ọ na-agwa n’ọnụọgụ ọtụtụ, na ịdị arọ nke nkwupụta ahụ n’ụzọ Igbo ebumpụta ụwa.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: Taịa na Saịdọn
  rationale: A na-eji aha Igbo ndị a maara ama maka obodo abụọ ahụ; usoro “ọ ga-adịrị …” na-egosipụta ọrụ dative ahụ n’Igbo.
- source_word: ἀνεκτότερον
  choice: mfe idi
  rationale: N’usoro ntụnyere “mfe idi karịa,” okwu a na-egosi na ihe ga-akara ịdị mfe ịtachi obi, n’etinyeghị nkọwa banyere ụdị ntaramahụhụ ahụ.
- source_word: ἔσται
  choice: ọ ga-adịrị
  rationale: Nke a na-egosipụta ọdịnihu nke ἔσται ma kwekọọ n’usoro Igbo eji ekwu ihe ga-adịrị mmadụ ma ọ bụ obodo otú ụfọdụ.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: n’ụbọchị ikpe
  rationale: Nke a na-egosi oge ikpe ahụ n'ụzọ doro anya ma na-anọ nso n’usoro na echiche Grik.
- source_word: κρίσεως
  choice: ikpe
  rationale: “Ikpe” na-echekwa echiche sara mbara nke omume ikpe, kama ịkọwapụta ya ozugbo dị ka ịma mmadụ ikpe ma ọ bụ ntaramahụhụ.
- source_word: ἢ ὑμῖν
  choice: karịa ka ọ ga-adịrị unu
  rationale: Nke a mezuru ntụnyere ahụ nke ọma n’Igbo ma chekwaa “unu” dị ka ọtụtụ.
theological_decisions:
- issue: Ụdị ikpe nke na-abịa
  choice: ụbọchị ikpe
  alternative: otu ụbọchị ikpe
  rationale: N’agbanyeghị na okwu Grik enweghị article, n’ọnọdụ a ọ na-arụtụ aka n’ụbọchị ikpe a maara nke ga-abịa. “Ụbọchị ikpe” na-egosipụta nke a n’Igbo n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị nsọ ma dị mfe nghọta. E ji akara ntụpọ abụọ mee ka nkwupụta Jizọs pụta ìhè, a hapụkwara ntụnyere ahụ ka ọ nọgide na-enwe ịdị arọ na esemokwu nke ihe odide mbụ.
