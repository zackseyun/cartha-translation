id: MAT.11.23
reference: Matthew 11:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: ig
  text: Gị onwe gị kwa, Kapanaum, à ga-ebuli gị elu ruo n’eluigwe? Ị ga-arịda ruo na Hedis.[a] N’ihi na a sị na ọrụ ndị dị ike ndị mere n’ime gị mere na Sọdọm, obodo ahụ gaara adịgide ruo taa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ebe ndị nwụrụ anwụ nọ.” Okwu Grik bụ “Hedis,” ọ bụghị Gehena.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Kapanaum
  rationale: E dere aha obodo ahụ n’ụdị kwekọrọ n’usoro mkpọpụta na odide aha ndị Baịbụl n’Igbo.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: à ga-ebuli gị elu ruo n’eluigwe?
  rationale: A ghọtara μή dị ka ihe na-ebute ajụjụ nkwulu nke na-atụ anya azịza jụrụ ajụ; ụdị omume a na-anata, ‘a ga-ebuli gị,’ na-echekwa olu passive na ihe atụ gbasara ịdị elu.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: Ị ga-arịda ruo na Hedis
  rationale: ‘Ị ga-arịda’ na-egosipụta καταβαίνω n’ụzọ doro anya, ebe ‘Hedis’ na-echekwa okwu Grik ᾅδης ka a ghara ịgwakọta ya na Gehena.
- source_word: δυνάμεις
  choice: ọrụ ndị dị ike
  rationale: Nhọrọ a na-echekwa ma echiche nke ọrụ ndị e mere ma ike pụtara ìhè na ha, n’enweghị ime ka okwu ahụ bụrụ naanị otu ụdị ọrụ ebube.
- source_word: γενόμεναι ἐν σοί
  choice: e mere n’ime gị
  rationale: Ọ na-echekwa ntụaka obodo ahụ dịka onye a na-agwa okwu nakwa echiche nke ọrụ ndị ahụ mere n’ebe ahụ.
- source_word: ἐγενήθησαν
  choice: mere
  rationale: N’usoro ‘a sị na ... mere,’ Igbo na-egosipụta ọnọdụ megidere ihe mere eme n’enweghị mkpa ịmanye usoro oge Bekee n’ime ya.
- source_word: ἔμεινεν ἂν
  choice: obodo ahụ gaara adịgide
  rationale: ‘Gaara adịgide’ na-egosipụta nsonaazụ nke ọnọdụ megidere ihe mere eme; ‘obodo ahụ’ na-eme ka onye otu nke ngwaa ahụ, ya bụ Sọdọm, doo anya.
- source_word: μέχρι τῆς σήμερον
  choice: ruo taa
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke sitere n’okwu ahụ kpọmkwem iji gosipụta oge ahụ.
theological_decisions:
- issue: Nsụgharị ᾅδης
  choice: Hedis
  alternative: ebe ndị nwụrụ anwụ nọ; hel
  rationale: E ji aha sitere n’asụsụ Grik mee ihe ka ọdịiche dị n’etiti ᾅδης na Gehena ghara ifu, nakwa ka a ghara itinye ozizi ndị e mesịrị n’ime okwu ahụ. Ihe odide ala peeji na-enye nkọwa ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ihe. Ajụjụ nke mbụ ka dị ka ajụjụ nkwulu, a hapụkwara ihe atụ nke ịrị elu na ịrịda dịka ọ dị n’isi mmalite.
