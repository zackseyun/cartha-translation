review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the rhetorical negative question, the descent to Hades (distinct from Gehenna), the contrary-to-fact comparison with Sodom, and the result that Sodom would have remained until the present day.
  naturalness: The sequence “ọrụ ndị dị ike e mere n’ime gị mere na Sọdọm” is unnecessarily repetitive and syntactically heavy in Standard Igbo. Recasting the second reference with a pronoun preserves the Greek sense while making the conditional sentence natural.
  terminology: Kapanaum, Hedis, Gehena, and Sọdọm are suitable forms. “ọrụ ndị dị ike” adequately represents δυνάμεις without restricting it to one category of miracle. The footnote appropriately identifies Hedis as distinct from Gehena.
  issues:
  - severity: low
    issue: Repetitive conditional wording
    rationale: The draft repeats “mere” directly in “ọrụ ndị dị ike e mere n’ime gị mere na Sọdọm.” Greek does repeat forms of γίνομαι, but a literal repetition here is awkward in Igbo. “ọrụ ndị dị ike ndị mere n’ime gị, a sị na ha mere na Sọdọm” retains both occurrences and their locative contrast naturally.
  revised_text: Gị onwe gị kwa, Kapanaum, à ga-ebuli gị elu ruo n’eluigwe? Ị ga-arịda ruo na Hedis.[a] N’ihi na a sị na ọrụ ndị dị ike ndị mere n’ime gị mere na Sọdọm, obodo ahụ gaara adịgide ruo taa.
