review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the present-tense introductory speech, flute-playing, and dancing. However, ἐκόψασθε denotes the customary mourning action of beating the breast; rendering it as “unu erughị uju” is less precise, and footnote c's “unu etighị onwe unu aka” does not express the Greek gesture correctly.
  naturalness: “Ha na-asị,” “anyị fụrụ unu ọjà,” and “unu agbaghị egwu” are natural Standard Igbo. “anyị bụrụ abụ ákwá” and “unu akụghị aka n’obi” retain the deliberate parallelism and are clear, idiomatic renderings in this mourning context.
  terminology: “Ọjà” appropriately renders the flute/pipe. “Abụ ákwá” conveys a lament song, while “ịta aka n’obi” accurately names the breast-beating mourning gesture without imposing additional theological interpretation.
  issues:
  - severity: medium
    issue: The final clause is semantically generalized, and its footnote gives an inaccurate literal formulation.
    rationale: ἐκόψασθε is the middle use of κόπτω for beating the breast in mourning. “Erughị uju” merely states that they did not become sorrowful, while “etighị onwe unu aka” is not a natural or accurate way to state the specified gesture in Igbo.
  - severity: low
    issue: Footnote a calls the main-text wording “more literal” while repeating it unchanged.
    rationale: The main text already says “anyị fụrụ unu ọjà.” The note should instead identify “anyị kpọọrọ unu ọjà” as a traditional/alternative phrasing, while explaining that the Greek specifies a flute or pipe.
  revised_text: Ha na-asị, “Anyị fụrụ unu ọjà[a], ma unu agbaghị egwu; anyị bụrụ abụ ákwá[b], ma unu akụghị aka n’obi[c].”
