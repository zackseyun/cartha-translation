  text: ⸀λέγουσιν· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκόψασθε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: ig
  text: Ha na-asị, “Anyị fụrụ unu ọjà[a], ma unu agbaghị egwu; anyị bụrụ abụ ákwá[b], ma unu akụghị aka n’obi[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ikwu, “anyị kpọọrọ unu ọjà.” Ngwaa Grik a na-ekwu kpọmkwem banyere ịkpọ ọjà ma ọ bụ ụdị opi a na-afụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “anyị kwara arịrị” ma ọ bụ “anyị bụrụ abụ olili ozu.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ kpọmkwem, “unu akụghị aka n’obi.” Nke a na-ezo aka n’omume iru uju nke iti aka n’obi.
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: Ha na-asị
  rationale: Oge ugbu a dị n’asụsụ Grik na-eme ka mkpesa ụmụaka ahụ dị ndụ n’ime ihe atụ ahụ; “Ha na-asị” na-egosipụta nke a n’Igbo nkịtị.
- source_word: Ηὐλήσαμεν
  choice: Anyị fụrụ unu ọjà
  rationale: αὐλέω pụtara ịkpọ ọjà ma ọ bụ ụdị opi a na-afụ, ọ bụghị nanị ịkpọ egwu n’ozuzu. “Ịfụ ọjà” bụ ụzọ doro anya ma bụrụkwa nke e ji ekwu ya n’Igbo.
- source_word: ὑμῖν
  choice: unu
  rationale: E tinyere onye a na-akpọrọ egwu n’usoro ngwaa “fụrụ unu ọjà,” nke na-egosi na egwu ahụ bụ maka ha.
- source_word: ὠρχήσασθε
  choice: unu agbaghị egwu
  rationale: Ụdị middle nke ngwaa a anaghị achọ ka e tinye echiche nke imere onwe onye ihe; “ịgba egwu” na-enye ihe ọ pụtara n’ụzọ ebumpụta ụwa.
- source_word: ἐθρηνήσαμεν
  choice: anyị bụrụ abụ iru uju
  rationale: θρηνέω na-ezo aka n’ịkwa arịrị ma ọ bụ n’abụ iru uju, karịsịa nke metụtara ọnwụ. Nsụgharị a na-edobe ọdịdị omume a na-eme n’ihu ndị ọzọ, nke kwekọrọ na ịfụ ọjà.
- source_word: ἐκόψασθε
  choice: unu erughị uju
  rationale: N’ebe a, κόπτω n’ụdị middle na-ezo aka n’omume iru uju, nke nwere ike ịgụnye iti aka n’obi. “Iru uju” na-enye isi echiche ahụ n’Igbo dị mfe, ebe nkọwa ala peeji na-edobe mmegharị ahụ e kwuru kpọmkwem.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu, mee nsụgharị ahụ. E chekwara myiri dị n’etiti ịfụ ọjà na ịbụ abụ iru uju, yana ọdịiche dị n’etiti ịgba egwu na iru uju. Akara ala peeji [a], [b], na [c] niile pụtara n’ederede bụ isi.
