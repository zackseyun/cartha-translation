id: MAT.11.5
reference: Matthew 11:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: ig
  text: Ndị ìsì na-ahụ ụzọ, ndị ngwụrọ na-eje ije, a na-eme ka ndị ọrịa ekpenta dị ọcha, ndị ntị chiri na-anụ ihe, a na-akpọlitekwa ndị nwụrụ anwụ, a na-ekwusara ndị ogbenye ozi ọma.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a na-ezisa ndị ogbenye ozi ọma.” Ụdị ngwaa Grik ahụ na-egosi na ọ bụ ha ka a na-ewetara ozi ọma ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ndepụta a na-eme ka Aịzaya 35:5–6 na 61:1 bata n’uche; ọ na-egosi ihe ịrịba ama ndị e jikọtara na ọrụ Mesaịa.
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: Ndị ìsì na-ahụ ụzọ
  rationale: Nke a na-egosi na ndị na-enweghị ike ịhụ ụzọ enwetala ịhụ ụzọ; ọ dabara n'ọnọdụ ọrụ ịgwọ ọrịa karịa ịsụgharị ya dịka naanị ‘ile anya elu.’
- source_word: χωλοὶ περιπατοῦσιν
  choice: ndị ngwụrọ na-eje ije
  rationale: Ọ bụ ntụgharị dị nkenke ma doo anya nke na-edebe usoro nkwupụta dị mfe nke Grik.
- source_word: λεπροὶ καθαρίζονται
  choice: a na-eme ka ndị ọrịa ekpenta dị ọcha
  rationale: ‘Dị ọcha’ na-edebe ma echiche mgbake anụ ahụ ma echiche ịdị ọcha nke okwu καθαρίζονται nwere; usoro ‘a na-eme ka’ na-egosikwa olu nnara nke Grik.
- source_word: κωφοὶ ἀκούουσιν
  choice: ndị ntị chiri na-anụ ihe
  rationale: N'ihi na ἀκούουσιν pụtara ịnụ ihe, κωφοί ebe a na-ezo aka kpọmkwem n'ebe ndị ntị chiri nọ, ọ bụghị ndị ogbi.
- source_word: νεκροὶ ἐγείρονται
  choice: a na-akpọlite ndị nwụrụ anwụ
  rationale: Nke a na-echekwa olu nnara ahụ ma na-egosi na a na-eme ka ndị nwụrụ anwụ bilie, kama ịkọwa ha dị ka ndị ji aka ha bilie.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: a na-ekwusara ndị ogbenye ozi ọma
  rationale: Nke a na-edebe echiche na ndị ogbenye bụ ndị a na-ewetara ozi ọma, ma na-eji okwu Igbo doro anya karịa okwu ụka pụrụ iche.
theological_decisions:
- issue: Otú e si sụgharịa εὐαγγελίζονται n'ihe gbasara okwu ‘ozi ọma’
  choice: a na-ekwusara ndị ogbenye ozi ọma
  alternative: ndị ogbenye na-anụ ozi ọma
  rationale: Nhọrọ ahụ na-echekwa olu nnara nke ụdị Grik ma ghara ime ka okwu ahụ bụrụ naanị ịnụ ihe; ọ na-egosi na e nwere onye na-ekwusara ha ozi ọma.
- issue: Ndepụta ọrụ ndị a dịka ihe àmà banyere ọrụ Mesaịa
  choice: Idowe nkwupụta ọrụ ndị ahụ n'ahịrịokwu n'enweghị ịgbakwunye okwu mmezu amụma
  alternative: Ịgbakwunye na ihe ndị a bụ mmezu amụma Aịzaya
  rationale: Amaokwu ahụ na-eme ka Aịzaya 35:5–6 na 61:1 bata n'uche, ma ihe odide Grik etinyeghị nkọwa mmezu amụma kpọmkwem; ya mere e debere njikọ ahụ n'okpuru peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, mee ntụgharị ahụ. A hapụrụ usoro ndepụta ahụ ka ọ bụrụ nke dị nkenke ma nwee ụda siri ike dịka Grik; e jikwa usoro ‘a na-’ chekwaa olu nnara ebe ọ dị mkpa.
