  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν αὐτῷ· Σὺ εἶ ὁ ἐρχόμενος ἢ ἕτερον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/003.yaml
  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: ig
  text: sịrị ya, “Ị bụ Onye Na-abịa[a], ka anyị ga-atụ anya onye ọzọ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye ahụ na-abịa” ma ọ bụ “onye ahụ nke ga-abịa.” Okwu Grik a nwere ike ịrụ ọrụ dịka aha Mesaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: sị ya
  rationale: Nke a na-asụgharị ngwaa aorist ‘kwuru’ na nnọchiaha ‘ya’ n’ụzọ dị mkpirikpi ma bụrụkwa Igbo nkịtị. E tinyeghị njikọ okwu na-adịghị n’akụkụ Grik e nyere.
- source_word: Σὺ εἶ
  choice: Ị bụ
  rationale: Ụdị a bụ ajụjụ nkịtị n’Igbo, ebe nnọchiaha ‘Ị’ na-echekwa nkwusi ike nke σύ n’enweghị okwu mgbakwunye na-adịghị mkpa.
- source_word: ὁ ἐρχόμενος
  choice: Onye Na-abịa
  rationale: Nke a na-echekwa participle nwere article dịka aha na-arụ ọrụ dị ka utu aha, ma ghara ịkọwa ya ozugbo dịka ‘Mesaya.’ Mkpụrụedemede ukwu na-egosi ojiji ya dịka utu aha n’ebe a.
- source_word: ἢ
  choice: ka
  rationale: N’usoro ajụjụ Igbo a, ‘ka’ na-ewebata nhọrọ nke abụọ n’ụzọ eke ma na-arụ ọrụ nke njikọ nkewa Grik ἢ.
- source_word: ἕτερον
  choice: onye ọzọ
  rationale: N’ihi na ihe a na-ekwu maka ya bụ mmadụ, ‘onye ọzọ’ bụ ụzọ Igbo doro anya ma kwekọọ na ‘another/different one.’
- source_word: προσδοκῶμεν
  choice: anyị ga-atụ anya
  rationale: N’ime ajụjụ nhọrọ a, okwu a na-egosipụta ihe ha kwesịrị ile anya ma ọ bụ tụọ anya ya; ‘ga-atụ anya’ bụ Igbo eke nke na-adịghị amachi echiche ahụ naanị n’ichere.
theological_decisions:
- issue: Ike ὁ ἐρχόμενος nwere dịka utu aha Mesaya
  choice: Onye Na-abịa
  alternative: onye ahụ na-abịa; onye ahụ nke ga-abịa; Mesaya
  rationale: Article ahụ na ọnọdụ ajụjụ Jọn na-akwado ojiji okwu ahụ dịka utu aha nke onye a na-atụ anya ya. Ma ebe Grik ekwughị ‘Mesaya’ kpọmkwem, nsụgharị ahụ na-echekwa ma ike utu aha ahụ ma ntakịrị oghere nghọta dị na okwu mbụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. A họọrọ usoro ajụjụ eke n’Igbo, ebe e debere ‘Onye Na-abịa’ dịka utu aha n’enweghị itinye nkọwa okpukpe karịrị ihe Grik kwuru.
