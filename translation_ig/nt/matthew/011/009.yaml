  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: ig
  text: Ma gịnị ka unu gara ịhụ? Onye amụma? Ee, ana m agwa unu, onye karịrị onye amụma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ahụ bụ n’ụzọ nkịtị, “karịa onye amụma” ma ọ bụ “ihe karịa onye amụma.” E tinyere “onye” n’Igbo n’ihi na okwu ahụ na-ekwu maka Jọn, mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Na-egosi ntụgharị megide ajụjụ ndị bu ụzọ, n'ụzọ dị mfe ma bụrụkwa Igbo nkịtị.
- source_word: τί ἐξήλθατε
  choice: gịnị ka unu pụrụ
  rationale: Na-edobe τί dịka ‘gịnị,’ ọ bụghị ‘n’ihi gịnị,’ ma na-ajụ ihe ha pụrụ ịhụ.
- source_word: ἰδεῖν
  choice: ịhụ
  rationale: Ọ bụ infinitive nke nzube; ‘ịhụ’ bụ okwu doro anya ma kwekọọ na asụsụ Igbo nke oge a.
- source_word: προφήτην
  choice: onye amụma
  rationale: Na-anọchi aha otu onye na-enweghị article n’ajụjụ rhetorical a n'ụzọ ebumpụta ụwa.
- source_word: ναί
  choice: Ee
  rationale: Azịza nkwenye kwụ ọtọ nye ajụjụ rhetorical ahụ.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Usoro okwu nkịtị nke na-edobe ike nke okwu Jizọs ma na-ada nke ọma n’Igbo.
- source_word: καὶ περισσότερον προφήτου
  choice: ọ bụkwa ihe karịrị onye amụma
  rationale: Na-edobe ntụnyere Greek ahụ n’enweghị ịkọwapụta otú Jọn si karị onye amụma; ‘ihe’ na-enyere okwu ahụ aka ịda nke ọma n’Igbo ma ka na-echekwa ọdịdị okwu ahụ.
theological_decisions:
- issue: Ọnọdụ na njirimara Jọn Onye Na-eme Baptizim n’okwu Jizọs
  choice: ọ bụkwa ihe karịrị onye amụma
  alternative: ọ bụkwa onye ka onye amụma ukwuu
  rationale: Okwu ahụ na-ebuli Jọn elu karịa ụdị ‘onye amụma,’ ma ọ naghị akọwa n’ahịrịokwu a otú o si dị otú ahụ. Nsụgharị a na-echekwa ike na mgbagwoju anya nke okwu ahụ n’enweghị itinye nkọwa okpukpe ọzọ.
translation_notes:
  register: Igbo Standard nke oge a, doro anya ma nwee ugwu. E ji ‘unu’ kwuo ọtụtụ mmadụ, ma debe usoro ajụjụ rhetorical na nkwenye Jizọs.
