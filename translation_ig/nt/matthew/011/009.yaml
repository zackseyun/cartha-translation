revisions:
- from: Ma gịnị ka unu pụrụ ịhụ? Onye amụma? Ee, ana m agwa unu, ọ bụkwa ihe karịrị onye amụma.[a]
  to: Ma gịnị ka unu gara ịhụ? Onye amụma? Ee, ana m agwa unu, onye karịrị onye amụma.[a]
  rationale: The revision restores the explicit past action “went out” in the Greek, preserves the rhetorical questions and affirmative response, and renders the final elliptical comparison with a natural personal noun phrase. It does not explain why John is greater than a prophet.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:33:39Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the rhetorical sequence, “a prophet,” and the affirmation. However, “gịnị ka unu pụrụ ịhụ?” changes ἐξήλθατε (“you went out”) into a modal expression (“could [you] see”), omitting the past act of going out. The final wording also uses “ihe” (“thing”), which is unsuitable for John, a person, and the supplied “ọ bụkwa” adds an awkward copular assertion not required by the Greek ellipsis.
  naturalness: “Gịnị ka unu gara ịhụ?” is idiomatic Standard Igbo and naturally expresses the past movement plus purpose. “Onye karịrị onye amụma” is an idiomatic personal expression and avoids referring to John as “ihe.”
  terminology: “Onye amụma” is appropriate for προφήτης. “Onye karịrị onye amụma” conveys the comparative force of περισσότερον προφήτου without defining the basis on which John surpasses a prophet.
  issues:
  - severity: high
    issue: The phrase “gịnị ka unu pụrụ ịhụ?” does not translate ἐξήλθατε.
    rationale: “Pụrụ” is modal (“can/could”), whereas the Greek aorist means “went out.” The revised wording restores both the past event and the purpose infinitive.
  - severity: medium
    issue: “Ọ bụkwa ihe karịrị onye amụma” uses “ihe” for John and is unnatural in this context.
    rationale: John is a person; “ihe” can sound impersonal. A personal noun phrase is required for clear, natural Igbo.
  - severity: low
    issue: The current footnote alternative is not idiomatic Standard Igbo.
    rationale: “onye ka onye amụma ukwuu” is awkward. The footnote has been recast as a literal-form note while retaining the main text’s natural personal rendering.
  revised_text: Ma gịnị ka unu gara ịhụ? Onye amụma? Ee, ana m agwa unu, onye karịrị onye amụma.[a]
  revised_footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ahụ bụ n’ụzọ nkịtị, “karịa onye amụma” ma ọ bụ “ihe karịa onye amụma.” E tinyere “onye” n’Igbo n’ihi na okwu ahụ na-ekwu maka Jọn, mmadụ.
    reason: lexical_alternative
  revision_rationale: The revision restores the explicit past action “went out” in the Greek, preserves the rhetorical questions and affirmative response, and renders the final elliptical comparison with a natural personal noun phrase. It does not explain why John is greater than a prophet.
