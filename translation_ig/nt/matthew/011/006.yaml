  text: καὶ μακάριός ἐστιν ὃς ⸀ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: ig
  text: Ngọzi na-adịrịkwa onye na-adịghị asụ ngọngọ n’ihi m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-adịghị ewe iwe n’ihi m” ma ọ bụ “onye na-adịghị ajụ m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Ngọzi na-adịrị
  rationale: Nke a bụ ụzọ Igbo dị ugwu ma dịkwa mfe nghọta si ekwupụta ọnọdụ onye Chineke kwadoro; ọ naghị eme ka okwu ahụ bụrụ naanị inwe obi ụtọ.
- source_word: ὃς ἐὰν μὴ
  choice: onye na-adịghị
  rationale: Ọ na-egosi onye ọ bụla nke ọnọdụ a metụtara, n’ụzọ dị nkenke ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: σκανδαλισθῇ
  choice: na-adịghị asụ ngọngọ
  rationale: Ọ na-edobe ihe atụ nke ịsụ ngọngọ dị n’okwu Grik, nke nwere ike ịgụnye ịjụ Jizọs ma ọ bụ ịda n’okwukwe n’ihi ya, kama ime ka ọ bụrụ naanị iwe nke mmetụta obi.
- source_word: ἐν ἐμοί
  choice: n’ihi m
  rationale: N’ebe a, Jizọs bụ ihe kpatara ma ọ bụ ihe metụtara ịsụ ngọngọ ahụ. ‘N’ihi m’ bụ Igbo doro anya ma na-edobe njikọ ahụ n’enweghị ịkọwa ya gabiga ókè.
- source_word: καί
  choice: kwa
  rationale: ‘Kwa’ jikọtara okwu a na ihe Jizọs kwuru tupu ya, dịka καί si eme.
theological_decisions:
- issue: Ichekwa ike na obosara ihe σκανδαλισθῇ pụtara mgbe ọ metụtara Jizọs
  choice: na-adịghị asụ ngọngọ n’ihi m
  alternative: na-adịghị ajụ m n’ihi na ihe banyere m adịghị ya mma
  rationale: Isi okwu na-edobe ihe atụ nke ịsụ ngọngọ, nke nwere ike ịpụta iwe megide Jizọs, ịjụ ya, ma ọ bụ ịda n’okwukwe n’ihi ya. A naghị ekpebi naanị otu n’ime nghọta ndị a n’ime isiokwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. ‘Ịsụ ngọngọ’ na-edobe ihe atụ nke okwu Grik, ebe nkọwa ala peeji na-enye nghọta nke ‘ịjụ’ ma ọ bụ ‘iwe megide’ Jizọs.
