source:
  edition: SBLGNT
  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: ig
  text: Mgbe ahụ, ọ malitere ịbara obodo ndị ahụ mba, ndị ihe ka ọtụtụ n’ime ọrụ ebube ya mere n’ime ha, n’ihi na ha echegharịghị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi oge ma na-ebute nzọụkwụ ọzọ n’akụkọ ahụ n’ụzọ Igbo doro anya.
- source_word: ἤρξατο ὀνειδίζειν
  choice: ọ malitere ịbara ... mba
  rationale: “Ọ malitere” na-edobe echiche mmalite dị na ἤρξατο; “ịbara ... mba” na-egosi nkwutọ na ịta ndị ahụ ụta n’ụzọ Igbo na-adị ire.
- source_word: τὰς πόλεις ἐν αἷς
  choice: obodo ndị ahụ ... bụ́ ebe
  rationale: “Obodo” nwere ike ịpụta obodo ukwu ma ọ bụ obodo nta ndị a na-ekwu maka ha; “bụ́ ebe” na-eme ka njikọ ahịrịokwu ahụ bụrụ nke eke n’Igbo.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: ọ rụrụ ọtụtụ n’ọrụ ebube ya
  rationale: A gbanwere usoro okwu ahụ ka ọ bụrụ nke Igbo na-adị ire, ebe a ka na-edobe onye mere ọrụ ndị ahụ na echiche nke πλεῖσται, ya bụ, ọnụ ọgụgụ kasị ukwuu.
- source_word: δυνάμεις
  choice: ọrụ ebube
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ọrụ Jizọs ndị gosipụtara ike. “Ọrụ ebube” bụ okwu Igbo doro ndị mmadụ anya, ebe nkọwa ala peeji na-edobe ụzọ ntụgharị ndị na-emesi “ike” ike.
- source_word: ὅτι οὐ μετενόησαν
  choice: n’ihi na ha echegharịghị
  rationale: “N’ihi na” na-egosi ihe kpatara ọ baara ha mba; “echegharịghị” na-edobe ịdị arọ nke nzaghachi ime mmụọ na nke omume dị na μετανοέω.
theological_decisions:
- issue: Ịsụgharị δυνάμεις n’ọnọdụ ọrụ ebube
  choice: ọrụ ebube
  alternative: ọrụ dị ike; ọrụ nke ike
  rationale: “Ọrụ ebube” na-ekwupụta ụdị omume a na-ekwu maka ya n’ụzọ ndị na-agụ Igbo ga-aghọta ozugbo. E tinyere ụzọ ndị ọzọ na nkọwa ala peeji ka e wee ghara ikpuchi njikọ okwu Grik ahụ na “ike.”
- issue: Ịsụgharị μετενόησαν
  choice: ha echegharịghị
  alternative: ha agbanweghị obi ha; ha alaghachighị
  rationale: “Ichegharị” bụ okwu Igbo a maara nke ọma maka mgbanwe ime obi na ịlaghachikwute Chineke, ma ọ naghị etinye nkọwa pụrụ iche nke otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso ụzọ okwu Igbo eke kama idegharị usoro Grik n’ụzọ ga-esi sie ike; a hapụrụ nkọwa gbasara δυνάμεις na nkọwa ala peeji.
