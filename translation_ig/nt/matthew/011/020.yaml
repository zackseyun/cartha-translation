  - severity: low
    issue: “bụ́ ebe ọ rụrụ ...” na-atụgharị ἐγένοντο ka ọ bụrụ omume Jizọs kpọmkwem.
    rationale: Grik na-ekwu na ọrụ ike ndị ahụ “mere/took place,” ọ bụ ezie na αὐτοῦ na-ejikọta ha na Jizọs. “ọrụ ebube ya mere n’ime ha” na-edobe usoro ahụ n’enweghị mfu nghọta.
