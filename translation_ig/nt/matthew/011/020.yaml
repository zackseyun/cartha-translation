  source_fidelity: A chọrọ mmezi n’ihi na “ọtụtụ n’ọrụ ebube ya” pụtara “many of his miracles,” ebe αἱ πλεῖσται pụtara “most/the greater number.” E meziekwara nkebi ikwu ka ọ gosipụta n'ụzọ doro anya na ọrụ ndị ahụ mere n’obodo ndị ahụ, dịka ἐν αἷς ἐγένοντο si dị.
  naturalness: Ederede a gbanwere dị n’Igbo Ọkpụkpụ ma na-agụ nke ọma. “Ihe ka ọtụtụ n’ime” bụ ụzọ eke si kwuo “most of” n’ebe a.
  terminology: “Ịbara ... mba” dabara nke ọma maka ὀνειδίζειν; “ọrụ ebube” bụ ntụgharị a na-aghọta nke ọma maka δυνάμεις n’ọnọdụ a, ebe nkọwa ala peeji na-enye ụzọ ọzọ na-emesi echiche ike dị na Grik. “Echegharịghị” na-edobe μετανοέω n’enweghị itinye ozizi otu pụrụ iche.
