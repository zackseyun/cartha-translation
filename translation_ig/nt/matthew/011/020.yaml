- from: Mgbe ahụ, ọ malitere ịbara obodo ndị ahụ mba, bụ́ ebe ọ rụrụ ọtụtụ n’ọrụ ebube ya[a], n’ihi na ha echegharịghị.
  to: Mgbe ahụ, ọ malitere ịbara obodo ndị ahụ mba, ndị ihe ka ọtụtụ n’ime ọrụ ebube ya mere n’ime ha, n’ihi na ha echegharịghị.
  rationale: E dochiela “ọtụtụ” anya site na “ihe ka ọtụtụ” iji sụgharị αἱ πλεῖσται n’ụzọ ziri ezi. E gbanwere “ọ rụrụ” ka ọ bụrụ “ọrụ ebube ya mere n’ime ha” iji soro ἐγένοντο (“mere/took place”) nke ọma. E wepụrụ akara [a] n’ederede n’ihi na ọ nọghị n’azụ “ọrụ ebube” na ederede a gbanwere; nkọwa ala peeji ka e depụtara maka okwu ahụ, ma akara ya kwesịrị itinye ozugbo n’azụ “ọrụ ebube” ma ọ bụrụ na usoro mbipụta chọrọ ka a hụ akara niile n’ahịrịokwu.
