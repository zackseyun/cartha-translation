review_pass:
  verdict: revise
  source_fidelity: The central counterfactual sense is retained, but the ordering of the hypothetical clause is syntactically unclear in Igbo, and “kemgbe” does not as clearly express πάλαι (“long ago”) in this context. The final phrase adds the specific action “nọrọ” (“remained/stayed”) where Greek simply uses the conventional locative expression “in sackcloth and ashes.”
  naturalness: The revision places the hypothetical location before the relative qualification, yielding a clear, natural Standard Igbo sentence. “Ogologo oge gara aga” naturally conveys that the repentance would have occurred well before the present time. “N’ákwà mkpe na ntụ” preserves the established mourning image without unnecessarily specifying an action.
  terminology: “Ahụhụ ga-adịrị gị” suitably carries the prophetic judgment-lament force of οὐαί in an established elevated register. “Ọrụ ebube” is a natural Gospel-context rendering of δυνάμεις; the footnote retains “ọrụ ike” as a closer lexical alternative. Place names and “chegharị” are appropriate.
  issues:
  - severity: medium
    issue: The conditional clause has unclear word order.
    rationale: “a sị na e mere ọrụ ebube ndị e mere n’etiti unu na Taịa na Saịdọn” can momentarily attach “na Taịa na Saịdọn” to the works already done among the addressees. Moving the location before the relative clause makes clear that the same works would hypothetically have occurred in Tyre and Sidon.
  - severity: low
    issue: “kemgbe” is imprecise for πάλαι.
    rationale: πάλαι means “long ago.” “Kemgbe” normally requires a reference point or continuing span; “ogologo oge gara aga” expresses the intended counterfactual past time directly.
  - severity: low
    issue: “ma nọrọ n’ime ntụ” adds an action not explicitly stated.
    rationale: The Greek phrase is “in sackcloth and ashes,” a conventional image. The revision preserves it as a locative expression without specifying that they stayed or sat in ashes.
  revised_text: Ahụhụ ga-adịrị gị, Kọrazin! Ahụhụ ga-adịrị gị, Betsaida! N’ihi na a sị na ọrụ ebube[a] ndị e mere n’etiti unu mere na Taịa na Saịdọn, ha gaara echegharị ogologo oge gara aga n’ákwà mkpe na ntụ.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọrụ ike.” Okwu Grik ahụ bụ δυνάμεις; n’Oziọma, ọ na-ezokarị aka n’ọrụ nke ike Chineke.
    reason: lexical_alternative
  revision_rationale: The revised text clarifies the contrary-to-fact comparison, renders πάλαι more precisely, and retains the sackcloth-and-ashes image without adding a particular physical action. The footnote is tightened to give a genuine lexical alternative while explaining the Gospel-context sense.
