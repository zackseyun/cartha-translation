- from: Ahụhụ ga-adịrị gị, Kọrazin! Ahụhụ ga-adịrị gị, Betsaida! N’ihi na a sị na e mere ọrụ ebube[a] ndị e mere n’etiti unu na Taịa na Saịdọn, ha gaara echegharị kemgbe, yi ákwà mkpe ma nọrọ n’ime ntụ.
  to: Ahụhụ ga-adịrị gị, Kọrazin! Ahụhụ ga-adịrị gị, Betsaida! N’ihi na a sị na ọrụ ebube[a] ndị e mere n’etiti unu mere na Taịa na Saịdọn, ha gaara echegharị ogologo oge gara aga n’ákwà mkpe na ntụ.
