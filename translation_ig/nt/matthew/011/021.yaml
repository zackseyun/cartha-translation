  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: ig
  text: Ahụhụ ga-adịrị gị, Kọrazin! Ahụhụ ga-adịrị gị, Betsaida! N’ihi na a sị na ọrụ ebube[a] ndị e mere n’etiti unu mere na Taịa na Saịdọn, ha gaara echegharị ogologo oge gara aga n’ákwà mkpe na ntụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọrụ ike.” Okwu Grik ahụ bụ δυνάμεις; n’Oziọma, ọ na-ezokarị aka n’ọrụ nke ike Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Ahụhụ ga-adịrị gị
  rationale: Nke a na-egosipụta ma mkpu mwute nke onye amụma ma ọkwa ikpe na-abịanụ; ọ dịkwa mfe nghọta n’Igbo nke oge a.
- source_word: Χοραζίν / Βηθσαϊδά / Τύρῳ / Σιδῶνι
  choice: Kọrazin / Betsaida / Taịa / Saịdọn
  rationale: A sụgharịghị aha obodo ndị a; e dere ha dịka ụda ha si kwekọọ n’usoro odide Igbo.
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe kpatara ọkwa ahụhụ ahụ.
- source_word: εἰ ... ἂν ... μετενόησαν
  choice: a sị na ... ha gaara echegharị
  rationale: Usoro a na-echekwa ọnọdụ a na-ekwu na ọ meghị eme na ihe gaara esochi ya.
- source_word: αἱ δυνάμεις
  choice: ọrụ ebube
  rationale: N’akụkọ Oziọma, okwu a na-ezo aka n’ọrụ ndị gosipụtara ike karịrị nke mmadụ; ‘ọrụ ebube’ bụ okwu Igbo doro anya ma dị ndụ, ebe nkọwa ala peeji na-echekwa echiche bụ isi nke ‘ọrụ ike.’
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: N’ihi na a na-agwa ndị bi n’obodo okwu, nke a pụtara ihe ndị mere n’etiti ha, ọ bụghị ihe mere n’ime obi ha.
- source_word: πάλαι
  choice: kemgbe
  rationale: Ọ na-egosi na nchegharị ahụ gaara eme ogologo oge tupu ugbu a.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: yi ákwà mkpe ma nọrọ n’ime ntụ
  rationale: Nke a na-edobe ihe oyiyi omenala nke iyi ákwà mkpe na ịnọ n’ime ntụ dịka ihe ngosipụta iru újú na nchegharị.
theological_decisions:
- issue: Ụdị ntụnyere Jizọs mere n’etiti Kọrazin na Betsaida na Taịa na Saịdọn
  choice: E debere ya dịka ezi ntụnyere nke na-egosi na ndị hụrụ ọrụ ebube ndị a ma ghara ichegharị nwere ibu ọrụ ka ukwuu.
  alternative: Iwere ya naanị dịka ikwubiga okwu ókè nke na-enweghị ezigbo ntụnyere ikpe.
  rationale: Ahịrịokwu ọnọdụ nke Grik na-eme ka ọdịiche ahụ sie ike, ma ntụgharị a anaghị agbakwụnye nkwubi okwu ozizi karịrị ihe ederede kwuru.
translation_notes:
  register: E jiri Igbo ọkọlọtọ nke dị ùgwù ma dị mfe nghọta. ‘Ahụhụ ga-adịrị gị’ na-echekwa ụda mkpu onye amụma; ‘ákwà mkpe na ntụ’ na-edobe ihe oyiyi oge ochie n’enweghị nkọwa ozizi agbakwunyere.
