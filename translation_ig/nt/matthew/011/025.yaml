revisions:
- from: N’oge ahụ, Jizọs zara, sị, “Ana m eto gị[a], Nna, Onyenwe eluigwe na ụwa, n’ihi na i zonahụrụ ndị maara ihe na ndị nwere nghọta ihe ndị a, ma kpughere ha ụmụntakịrị[b].”
  to: N’oge ahụ, Jizọs zara, sị, “Ana m eto gị[a], Nna, Onyenwe nke eluigwe na ụwa, n’ihi na i zonahụrụ ndị maara ihe na ndị nwere nghọta ihe ndị a, ma kpughere ụmụntakịrị[b] ihe ndị a.”
  rationale: 'The revision restores the source syntax and meaning: the Father hid “these things” from the wise and discerning and revealed those same things to little children. Repeating “ihe ndị a” is clearer and more natural than using a pronoun in this Igbo construction. The adjustment to “Onyenwe nke eluigwe na ụwa” explicitly conveys the Greek genitive title.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:33:59Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the temporal setting, the double narrative formula, Jesus’ praise/thanksgiving, the Father’s direct agency in hiding and revealing, and the contrast between the wise/discerning and little children. However, the final clause reverses the grammatical roles in Igbo: “kpughere ha ụmụntakịrị” reads as revealing ‘them’ to the little children rather than revealing ‘these things’ to little children.'
  naturalness: The revised wording uses natural Standard Igbo syntax by placing the recipients after “kpughere” and retaining “ihe ndị a” as its object. Adding “nke” in “Onyenwe nke eluigwe na ụwa” makes the genitive relationship explicit and idiomatic.
  terminology: “Nna,” “Onyenwe nke eluigwe na ụwa,” “ndị maara ihe,” “ndị nwere nghọta,” and “ụmụntakịrị” are suitable Standard Igbo renderings. “Ụmụntakịrị” preserves the source image without prematurely reducing it to an interpretation such as ‘the humble.’
  issues:
  - severity: high
    issue: The object and indirect object are reversed in the revelation clause.
    rationale: In “ma kpughere ha ụmụntakịrị,” “ha” most naturally refers back to “ihe ndị a,” making little children the recipients of ‘them.’ The Greek has αὐτὰ (‘these things’) as the object and νηπίοις (‘to little children’) as the recipients. Igbo should say “ma kpughere ụmụntakịrị ihe ndị a.”
  - severity: low
    issue: The possessive/genitive relation in the divine title is implicit.
    rationale: “Onyenwe nke eluigwe na ụwa” more clearly and naturally renders κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς (‘Lord of heaven and earth’) than “Onyenwe eluigwe na ụwa.”
  revised_text: N’oge ahụ, Jizọs zara, sị, “Ana m eto gị[a], Nna, Onyenwe nke eluigwe na ụwa, n’ihi na i zonahụrụ ndị maara ihe na ndị nwere nghọta ihe ndị a, ma kpughere ụmụntakịrị[b] ihe ndị a.”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Ana m ekele gị.” Ngwaa Grik ahụ nwere ike ịpụta inye ekele, ito, ma ọ bụ ikwupụta ihe n’ihu ọha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ụmụ ọhụrụ.” N’ebe a, o yikarịrị ka “ụmụntakịrị” bụ ihe atụ maka ndị dị umeala n’obi ma ọ bụ ndị na-anabata ihe dịka ụmụaka.
    reason: lexical_alternative
  revision_rationale: 'The revision restores the source syntax and meaning: the Father hid “these things” from the wise and discerning and revealed those same things to little children. Repeating “ihe ndị a” is clearer and more natural than using a pronoun in this Igbo construction. The adjustment to “Onyenwe nke eluigwe na ụwa” explicitly conveys the Greek genitive title.'
