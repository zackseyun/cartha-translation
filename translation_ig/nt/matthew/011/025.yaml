id: MAT.11.25
reference: Matthew 11:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: ig
  text: N’oge ahụ, Jizọs zara, sị, “Ana m eto gị[a], Nna, Onyenwe nke eluigwe na ụwa, n’ihi na i zonahụrụ ndị maara ihe na ndị nwere nghọta ihe ndị a, ma kpughere ụmụntakịrị[b] ihe ndị a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ana m ekele gị.” Ngwaa Grik ahụ nwere ike ịpụta inye ekele, ito, ma ọ bụ ikwupụta ihe n’ihu ọha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ụmụ ọhụrụ.” N’ebe a, o yikarịrị ka “ụmụntakịrị” bụ ihe atụ maka ndị dị umeala n’obi ma ọ bụ ndị na-anabata ihe dịka ụmụaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: N’oge ahụ
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi oge akụkọ ahụ n’enweghị ịkọwa na ọ bụ kpọmkwem otu ntabi anya.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: zara, sị
  rationale: Ọ na-edobe ngwaa abụọ nke usoro okwu Grik ahụ, ma na-ada ka Igbo akụkọ dị mma ọbụna mgbe a na-ekwughị ajụjụ gara aga.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Ana m eto gị
  rationale: N’ebe a, ngwaa ahụ na-egosi nkwupụta a na-eme n’ihu ọha nke jupụtara n’otuto na ekele. Nhọrọ a na-edobe ụda otuto ahụ ma na-ezere echiche na Jizọs na-ekwupụta mmehie.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Nna, Onyenwe eluigwe na ụwa
  rationale: Ọ na-edobe okwu ịkpọku abụọ ahụ na ọchịchị Nna n’elu eluigwe na ụwa.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara otuto Jizọs n’ụzọ doro anya ma kwekọọ na ọnọdụ okwu a.
- source_word: ἔκρυψας
  choice: i zonahụrụ
  rationale: Ọ bụ ngwaa kpọmkwem nke na-egosi na Nna zoro ihe ndị ahụ n’ebe ụfọdụ ndị nọ; ọ naghị eme ka ọrụ Chineke dị nro.
- source_word: ταῦτα ... αὐτά
  choice: ihe ndị a ... ha
  rationale: Ọ na-edobe ntụaka ahụ ghe oghe dịka Grik si mee, n’enweghị ịkọwapụta ihe ndị ahụ karịa ihe amaokwu ahụ kwuru.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: ndị maara ihe na ndị nwere nghọta
  rationale: 'Ọ na-edobe ụzọ abụọ e si kọwaa ndị ahụ: ndị e weere dị ka ndị maara ihe na ndị nwere ikike nghọta.'
- source_word: ἀπεκάλυψας
  choice: kpughere
  rationale: Nke a bụ okwu Igbo doro anya maka ime ka ihe e zoro ezo pụta ìhè ma ọ bụ bụrụ ihe a maara.
- source_word: νηπίοις
  choice: ụmụntakịrị
  rationale: Ọ na-edobe ihe atụ banyere ụmụaka n’enweghị ịgbanwe ya ka ọ bụrụ nkọwa dịka ‘ndị dị umeala n’obi’; n’ọnọdụ a, ọ pụkwara ịrụ ọrụ n’ụzọ ihe atụ.
theological_decisions:
- issue: Ọrụ Nna n’izobe na ikpughe
  choice: 'Edobere okwu kpọmkwem: “i zonahụrụ ... ma kpughere.”'
  alternative: “i kwere ka ihe ndị a zonahụ ...”
  rationale: Ngwaa Grik abụọ ahụ bụ ngwaa na-arụ ọrụ kpọmkwem, Nna bụkwa onye na-eme ha. Nsụgharị ahụ na-edobe esemokwu nkà mmụta okpukpe dị n’okwu ahụ kama ime ka ọ bụrụ naanị nkwenye Chineke nyere.
- issue: Ihe νηπίοις pụtara
  choice: ụmụntakịrị
  alternative: ụmụ ọhụrụ; ndị dị umeala n’obi
  rationale: “Ụmụntakịrị” na-edobe ihe atụ banyere ịbụ nwata ma ghara ịkọwa ndị a ozugbo dịka otu ụdị ndị nwere àgwà ime mmụọ. Ihe amaokwu ahụ n’onwe ya ka na-ekwe ka a ghọta ya n’ụzọ ihe atụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Zara, sị” na-edobe usoro akụkọ nke asụsụ mmalite; “Onyenwe” na-edobe ụda Akwụkwọ Nsọ n’enweghị itinye nkọwa otu ụka; e jighịkwa okwu ochie dịka “ụmụ aka” ma ọ bụ nkọwa sara mbara dochie ihe atụ dị na νηπίοις.
