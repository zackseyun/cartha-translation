  text: πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: ig
  text: N’ihi na ndị amụma niile na Iwu ahụ buru amụma ruo Jọn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ruo na Jọn” ma ọ bụ “ruo n’oge Jọn.” Okwu a nwere ike igosi na Jọn bụ njedebe nke akaebe amụma, ma ọ bụ na ọ bụ oke na-akara mgbanwe oge ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: niile
  rationale: Ọ na-akọwa ndị amụma dịka otu dum; “niile” bụ okwu Igbo doro anya ma kwekọọ n’ụzọ nkịtị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe ndabere ma ọ bụ nkọwa maka okwu bu ya ụzọ.
- source_word: οἱ προφῆται
  choice: ndị amụma
  rationale: Nke a bụ ntụgharị Igbo a na-ejikarị eme ihe maka ndị na-ekwuchitere Chineke okwu.
- source_word: ὁ νόμος
  choice: Iwu ahụ
  rationale: “Iwu ahụ” na-egosi Iwu Mozis dị ka akụkụ Akwụkwọ Nsọ a maara nke ọma, ọ bụghị iwu n’ozuzu ya.
- source_word: ἕως Ἰωάννου
  choice: ruo Jọn
  rationale: Ọ na-echekwa oke oge dị na Grik ma ghara ikpebi ma Jọn ò so n’oge amụma ahụ dịka mmezu ya, ka ọ̀ bụ akara njedebe ma ọ bụ mgbanwe ya.
- source_word: ἐπροφήτευσαν
  choice: buru amụma
  rationale: Ọ bụ ntụgharị kpọmkwem na nke sitere n’ọnụ ndị Igbo; itinye ya n’ahịrịokwu ebe “ndị amụma” na “Iwu ahụ” bụ ndị mere ihe ahụ na-echekwa ụzọ e si mee Iwu ahụ ka ọ bụrụ onye na-agba akaebe n’amụma.
theological_decisions:
- issue: Ma a ga-ewere ὁ νόμος dịka iwu n’ozuzu ya, ka dịka aha akụkụ Akwụkwọ Nsọ
  choice: Iwu ahụ
  alternative: iwu
  rationale: N’ebe a, okwu ahụ na-ezo aka n’Iwu Mozis dị ka ihe odide nsọ Izrel nke jikọtara ya na ndị amụma.
- issue: Ma ἕως Ἰωάννου ọ̀ gụnyere Jọn n’oge ndị amụma, ka ọ̀ na-egosi naanị ebe oge ahụ kwụsịrị
  choice: ruo Jọn
  alternative: ruo n’oge Jọn
  rationale: Grik ahụ anaghị edozi ajụjụ a kpamkpam. “Ruo Jọn” na-echekwa nghọta abụọ ahụ n’enweghị itinye nkọwa otu ụka ma ọ bụ ozizi pụrụ iche.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, kwụ ọtọ ma nwee ugwu. Ahịrịokwu ahụ na-echekwa njikọ nkọwa nke γὰρ, aha Akwụkwọ Nsọ nke ὁ νόμος, na mgbagwoju anya dị na ἕως Ἰωάννου.
