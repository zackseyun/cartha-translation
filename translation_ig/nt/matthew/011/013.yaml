    text: A pụkwara ịsị, “ruo na Jọn” ma ọ bụ “ruo n’oge Jọn.” Okwu a nwere ike igosi na Jọn bụ njedebe nke akaebe amụma, ma ọ bụ na ọ bụ oke na-akara mgbanwe oge ahụ.
    reason: alternative_reading
  revision_rationale: Only the footnote is revised. The revised wording clearly communicates the two interpretive possibilities acknowledged by ἕως Ἰωάννου while leaving the Greek ambiguity unresolved. The verse text requires no change.
