revisions:
- from: Nwa nke Mmadụ bịara na-eri ihe, na-aṅụkwa ihe ọṅụṅụ, ha na-asịkwa, “Lee, onye oke oriri na onye aṅụrụma, enyi ndị ọnaụtụ na ndị mmehie!” E gosikwara na amamihe ziri ezi[a] site n’ọrụ ya.[b]
  to: Nwa nke Mmadụ bịara na-eri ihe, na-aṅụkwa ihe ọṅụṅụ, ha na-asịkwa, “Lee, onye eribiga nri ókè na onye aṅụrụma, enyi ndị ọnaụtụ na ndị mmehie!” E mere ka o doo anya na amamihe ziri ezi[a] site n’ọrụ ya.[b]
  rationale: The revision replaces the less precise “onye oke oriri” with the idiomatic pejorative “onye eribiga nri ókè.” It also uses “E mere ka o doo anya” to convey the passive vindication/proving-right sense of ἐδικαιώθη naturally, without interpreting “wisdom” beyond the Greek text. Footnote anchors remain attached to the final clause they explain, and the textual-variant note preserves “children” without placing it in the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:34:00Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft follows the SBLGNT wording: it retains the established title “Nwa nke Mmadụ,” represents the accusations as hostile labels, and follows ἔργων (“works”) rather than the variant τέκνων (“children”). The final passive sense of ἐδικαιώθη is retained without resolving the identity of personified wisdom.'
  naturalness: Most of the verse is clear Standard Igbo. However, “onye oke oriri” is less idiomatic and may suggest a person associated with a grand feast rather than the specific pejorative sense of one who eats excessively. “onye eribiga nri ókè” expresses the accusation more naturally and precisely.
  terminology: “Nwa nke Mmadụ,” “ndị ọnaụtụ,” “ndị mmehie,” and “onye aṅụrụma” are appropriate for the register and preserve the traditional and rhetorical force of the passage. The revised wording for the final clause makes the vindication sense more explicit while preserving its ambiguity.
  issues:
  - severity: medium
    issue: The rendering of φάγος as “onye oke oriri” is semantically imprecise.
    rationale: φάγος is an insult meaning a glutton, not simply someone connected with a large meal or feast. “onye eribiga nri ókè” is a natural Standard Igbo expression for the intended accusation.
  revised_text: Nwa nke Mmadụ bịara na-eri ihe, na-aṅụkwa ihe ọṅụṅụ, ha na-asịkwa, “Lee, onye eribiga nri ókè na onye aṅụrụma, enyi ndị ọnaụtụ na ndị mmehie!” E mere ka o doo anya na amamihe ziri ezi[a] site n’ọrụ ya.[b]
