id: MAT.11.19
reference: Matthew 11:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: ig
  text: Nwa nke Mmadụ bịara na-eri ihe, na-aṅụkwa ihe ọṅụṅụ, ha na-asịkwa, “Lee, onye eribiga nri ókè na onye aṅụrụma, enyi ndị ọnaụtụ na ndị mmehie!” E mere ka o doo anya na amamihe ziri ezi[a] site n’ọrụ ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “E kwadoro amamihe site n’omume ya.”
    reason: lexical_alternative
  - marker: b
    text: 'Ụfọdụ ihe odide oge ochie nwere “ụmụ” kama “ọrụ”: “E mere ka o doo anya na amamihe ziri ezi site n’ụmụ ya.”'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a bụ nsụgharị aha a Jizọs ji akọwa onwe ya nke a maara nke ọma n’Igbo; ọ na-edobe ndabere okwu Semitic na mkpa Mesaya ya n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: ἐσθίων καὶ πίνων
  choice: na-eri ihe, na-aṅụkwa ihe ọṅụṅụ
  rationale: Ọ na-akọ omume iri na ịṅụ n’ụzọ kwụ ọtọ ma na-edobe ọdịiche dị n’etiti omume ya na ndụ ịrapara onwe Jọn n’ihe, n’ebughị ụzọ mee ya ‘oriri’ n’akụkụ a.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu Igbo dị ndụ ma kwụ ọtọ nke na-eburu ike mkpu na ebubo ihu ọha dị n’okwu Grik ahụ.
- source_word: φάγος
  choice: onye oke oriri
  rationale: Ọ na-egosipụta okwu mkparị nke na-ebo mmadụ ebubo iri ihe gabiga ókè, ọ bụghị nanị onye na-eri nri.
- source_word: οἰνοπότης
  choice: onye aṅụrụma
  rationale: Okwu ahụ bụ ebubo banyere ịṅụbiga mmanya ókè, ọ bụghị nanị ịṅụ mmanya; ‘onye aṅụrụma’ na-edobe mkparị ahụ.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: enyi ndị ọnaụtụ na ndị mmehie
  rationale: Ọ na-edobe nhazi okwu ahụ na ibu mmekọrịta mmadụ na okpukpe dị n’aha ndị a.
- source_word: ἐδικαιώθη
  choice: E gosikwara na … ziri ezi
  rationale: N’ebe a δικαιόω pụtara na e mere ka o doo anya na ihe ahụ ziri ezi. Nhọrọ a bụ Igbo eke ma na-edobe echiche nke igosi ma ọ bụ ịkwado izi ezi.
- source_word: ἡ σοφία
  choice: amamihe
  rationale: A hapụrụ ya dịka ‘amamihe’ n’enweghị ịkọwa ya dịka Jizọs, atụmatụ Chineke, ma ọ bụ ihe ọzọ kpọmkwem.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: site n’ọrụ ya
  rationale: Ọ na-agbaso ọgụgụ SBLGNT bụ ἔργων ma na-egosi na ọrụ amamihe bụ ihe na-egosi izi ezi ya.
theological_decisions:
- issue: Ihe ‘amamihe’ pụtara n’ahịrị ikpeazụ
  choice: Idobe okwu e nyere amamihe dịka a ga-asị na ọ bụ onye, n’akọwaghị onye ma ọ bụ ihe ọ bụ kpọmkwem
  alternative: Ịkọwa amamihe dịka Jizọs n’onwe ya ma ọ bụ dịka amamihe na atụmatụ nzọpụta Chineke
  rationale: Ihe odide ahụ ekwughị kpọmkwem ihe personification a na-anọchi anya ya; ya mere nsụgharị ahụ na-edobe mgbagwoju anya na esemokwu nkà mmụta okpukpe dị na ya.
- issue: Ọgụgụ ederede nke ahịrị ikpeazụ
  choice: ọrụ (ἔργων) n’ahịrị bụ isi
  alternative: ụmụ (τέκνων), dịka e si gụọ ya n’ụfọdụ ihe odide Matiu na Luk 7:35
  rationale: SBLGNT e nyere nwere ἔργων, ya mere ọ bụ ya dị n’ahịrị bụ isi; e debere ọgụgụ ọzọ a maara nke ọma n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Nwa nke Mmadụ’ na-edobe aha ọdịnala ahụ; ‘onye oke oriri’ na ‘onye aṅụrụma’ na-edobe ụda ebubo siri ike. Njikọ ‘-kwa’ na-edobe καί dịka njikọ nkịtị, n’etinyeghị echiche mmegide dịka ‘ma otu ọ dị.’
