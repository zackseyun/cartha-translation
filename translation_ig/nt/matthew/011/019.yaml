    reason: textual_variant
  revision_rationale: The revision replaces the less precise “onye oke oriri” with the idiomatic pejorative “onye eribiga nri ókè.” It also uses “E mere ka o doo anya” to convey the passive vindication/proving-right sense of ἐδικαιώθη naturally, without interpreting “wisdom” beyond the Greek text. Footnote anchors remain attached to the final clause they explain, and the textual-variant note preserves “children” without placing it in the main text.
