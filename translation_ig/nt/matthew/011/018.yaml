revisions:
- from: N’ihi na Jọn bịara, ọ naghị eri nri, ọ naghịkwa aṅụ ihe ọṅụṅụ; ha wee sị, “Mmụọ ọjọọ bi n’ime ya.”[a]
  to: N’ihi na Jọn bịara na-adịghị eri nri, na-adịghịkwa aṅụ ihe ọṅụṅụ; ha na-ekwu, sị, “O nwere mmụọ ọjọọ.”[a]
  rationale: The revision removes the added sense “lives in him,” preserves the plain Greek accusation Δαιμόνιον ἔχει, and represents λέγουσιν with an Igbo present form. It continues to avoid adding bread, wine, or other details absent from this verse.
