  text: ἦλθεν γὰρ Ἰωάννης μήτε ἐσθίων μήτε πίνων, καὶ λέγουσιν· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: ig
  text: N’ihi na Jọn bịara na-adịghị eri nri, na-adịghịkwa aṅụ ihe ọṅụṅụ; ha na-ekwu, sị, “O nwere mmụọ ọjọọ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mmụọ ọjọọ ji ya.” N’asụsụ Grik, okwu ahụ pụtara kpọmkwem, “O nwere mmụọ ọjọọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: bịara
  rationale: Oge aorist nke ἔρχομαι na-ekwu maka ọbịbịa Jọn n’ihu ọha; “bịara” bụ ntụgharị nkịtị ma doo anya.
- source_word: γὰρ
  choice: N’ihi na
  rationale: γάρ na-enye nkọwa maka okwu bu ụzọ; “N’ihi na” na-egosipụta njikọ nkọwa a nke ọma n’Igbo.
- source_word: Ἰωάννης
  choice: Jọn
  rationale: Nke a bụ aha a na-ejikarị akpọ Ἰωάννης n’Igbo; ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Jọn Onye Na-eme Baptizim.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: ọ naghị eri nri, ọ naghịkwa aṅụ ihe ọṅụṅụ
  rationale: Usoro μήτε...μήτε na-akọwa ndụ Jọn nke ịjụ onwe ya ihe. A naghị etinye achịcha ma ọ bụ mmanya n’ihi na amaokwu Grik a akpọghị ha aha.
- source_word: καὶ λέγουσιν
  choice: ha wee sị
  rationale: Nke a na-edebe onye na-eme ihe ahụ n’enweghị ịkpọpụta ndị ha bụ. “Wee sị” bụ ụzọ Igbo sitere n’okike si aga n’ihu n’akụkọ, ọ bụ ezie na Grik ji oge ugbu a mee ka ebubo ahụ dị ndụ.
- source_word: Δαιμόνιον ἔχει
  choice: Mmụọ ọjọọ bi n’ime ya
  rationale: N’Igbo, nke a bụ ụzọ doro anya ma sitere n’okike isi kwuo ebubo dị n’okwu Grik nkịtị, “o nwere mmụọ ọjọọ,” n’enweghị iji “ekwensu,” nke nwere ike ịpụta ekwensu ahụ kpọmkwem.
theological_decisions:
- issue: Otú e si sụgharịa ebubo metụtara δαιμόνιον
  choice: Mmụọ ọjọọ bi n’ime ya
  alternative: Mmụọ ọjọọ ji ya
  rationale: Amaokwu ahụ na-akọ ebubo ndị mmadụ boro Jọn, ọ bụghị nkwenye onye na-akọ akụkọ. Nhọrọ ahụ na-edebe echiche nke Δαιμόνιον ἔχει ma na-ezere ịgbakwunye nkọwa okpukpe karịrị ihe Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. A gbasapụrụ okwu mkpirikpi banyere iri na ịṅụ ntakịrị ka ọ bụrụ Igbo sitere n’okike, n’agbanyeghị na a naghị etinye achịcha, mmanya, ma ọ bụ nkọwa ọzọ na-adịghị na Grik.
