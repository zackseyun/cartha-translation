    text: Ma ọ bụ, “Mmụọ ọjọọ ji ya.” N’asụsụ Grik, okwu ahụ pụtara kpọmkwem, “O nwere mmụọ ọjọọ.”
    reason: lexical_alternative
  revision_rationale: The revision removes the added sense “lives in him,” preserves the plain Greek accusation Δαιμόνιον ἔχει, and represents λέγουσιν with an Igbo present form. It continues to avoid adding bread, wine, or other details absent from this verse.
