id: MAT.18.25
reference: Matthew 18:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: ig
  text: Ma ebe ọ na-enweghị ihe ọ ga-eji kwụọ ụgwọ ahụ, nna ya ukwu nyere iwu ka e ree ya, ya na nwunye ya na ụmụ ya na ihe niile o nwere,[a] ka e wee kwụọ ụgwọ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, a ga-ere ya, nwunye ya, ụmụ ya, na ihe onwunwe ya niile, ka e jiri ego e nwetara kwụọ ụgwọ ahụ.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: Ma ebe ọ na-enweghị ihe ọ ga-eji kwụọ ụgwọ ahụ
  rationale: 'Nkebiokwu genitive absolute a na-egosi ọnọdụ ma ọ bụ ihe kpatara ya: o nweghị ihe ọ ga-eji kwụghachi ụgwọ ahụ. Nsụgharị a bụ Igbo nkịtị ma ọ naghị agbanwe ya ka ọ bụrụ nanị enweghị ike n’ozuzu.'
- source_word: ἐκέλευσεν
  choice: nyere iwu
  rationale: κελεύω pụtara inye iwu site n’ikike; ‘nyere iwu’ bụ okwu Igbo doro anya ma kwesịkwa ọnọdụ onye nwe ohu.
- source_word: ὁ κύριος
  choice: nna ya ukwu
  rationale: N’akụkọ ilu a, κύριος na-ezo aka n’ebe onye ji ya ụgwọ nọ, ya bụ onye nwe ya ma ọ bụ onyeisi ya, ọ bụghị aha nsọ a na-akpọ Chineke. ‘Nna ya ukwu’ bụ okwu Igbo sitere n’ọnọdụ ahụ.
- source_word: πραθῆναι
  choice: ka e ree ya
  rationale: Aorist passive infinitive nke πιπράσκω pụtara ka e ree onye ahụ; a hapụrụ omume ire mmadụ n’ụdị doro anya dịka Grik siri kwuo ya.
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: ya na nwunye ya na ụmụ ya
  rationale: Mkpọaha nweonwe ndị a sitere n’ọnọdụ ahụ ma mee ka Igbo bụrụ nke e ji asụkarị n’enweghị mgbagwoju anya.
- source_word: πάντα ὅσα ἔχει
  choice: ihe niile o nwere
  rationale: 'Nke a na-edobe oke zuru ezu nke okwu Grik: ihe onwunwe ya niile.'
- source_word: καὶ ἀποδοθῆναι
  choice: ka e wee kwụọ ụgwọ ahụ
  rationale: Passive infinitive a na-egosi nzube ma ọ bụ nsonaazụ iwu ahụ—ka ire ahụ mee ka a kwụọ ụgwọ. ‘Ụgwọ ahụ’ sitere n’ọnọdụ ụgwọ dị n’akụkọ ahụ.
theological_decisions:
- issue: Nsụgharị κύριος n’ime akụkọ ilu
  choice: nna ya ukwu
  alternative: Onyenwe ya
  rationale: Onye a bụ onyeisi mmadụ nọ n’ime akụkọ ahụ. ‘Nna ya ukwu’ na-egosi mmekọrịta onye nwe ohu na ohu n’Igbo nke ọma ma zere ime ka okwu ahụ bụrụ aha nsọ kpọmkwem, ebe ‘Onyenwe ya’ nwekwara ike ịpụta otu ihe ma nwee ụda okpukpe karịa.
- issue: Ihe μὴ ἔχοντος ... ἀποδοῦναι pụtara
  choice: ọ na-enweghị ihe ọ ga-eji kwụọ ụgwọ ahụ
  alternative: ọ pụghị ịkwụ ụgwọ ahụ
  rationale: Nhọrọ e mere na-edobe echiche nkịtị nke ἔχω—enweghị ihe e ji akwụ ụgwọ—ma ghara imechi ohere ahụ n’echiche sara mbara nke enweghị ike ịkwụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Nna ya ukwu’ dabara n’ọnọdụ akụkọ banyere ohu na onye nwe ya. Akara ntụaka [a] dị n’isiokwu ahụ ma kọwaa omenala ire onye ji ụgwọ, ezinụlọ ya, na ihe o nwere iji nweta ego ịkwụ ụgwọ.
