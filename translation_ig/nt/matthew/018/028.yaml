id: MAT.18.28
reference: Matthew 18:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that servant went out[a], he found one of his fellow servants who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: ig
  text: Ma mgbe ohu ahụ pụrụ, ọ hụrụ otu n’ime ndị ohu ibe ya, onye ji ya otu narị denarịọs[a] ụgwọ; o jide ya ma malite ịnyagbu ya, na-asị, “Kwụghachi ụgwọ ọ bụla i ji m!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Denarịọs bụ ego a na-akwụkarị onye ọrụ ma ọ bụ onye agha maka ọrụ otu ụbọchị.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, n’ụzọ soro mkpụrụokwu anya karịa, “Kwụghachi, ma ọ bụrụ na i ji m ụgwọ ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: ohu
  rationale: “Ohu” na-egosi onye nọ n’okpuru ikike nna ukwu ya, ọ bụghị naanị onye ọrụ; ọnọdụ ịbụ ohu na ike mmanye dị mkpa n’ilu a.
- source_word: ἐξελθὼν δὲ
  choice: Ma mgbe ohu ahụ pụrụ
  rationale: Nke a na-egosi ma mgbanwe n’akụkọ ahụ ma oge omume ahụ n’Igbo dị mfe ma kwekọọ n’usoro okwu Grik.
- source_word: συνδούλων
  choice: ndị ohu ibe ya
  rationale: Nke a na-echekwa echiche σύν-, ya bụ, ndị ya na ha bụ ohu, ma kwekọọ na ntụgharị “ohu” maka δοῦλος.
- source_word: ὤφειλεν αὐτῷ
  choice: ji ya ... ụgwọ
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi na mmadụ ji onye ọzọ ụgwọ ego.
- source_word: ἑκατὸν δηνάρια
  choice: otu narị denarịọs
  rationale: E debere aha ego oge ahụ ka ọdịiche dị n’etiti ụgwọ a na nnukwu ụgwọ e kwuru na mbụ ghara ịla n’iyi.
- source_word: κρατήσας αὐτὸν
  choice: jide ya
  rationale: N’ọnọdụ ime ihe ike a, “jide ya” na-egosi ijide mmadụ n’ike n'ụzọ doro anya.
- source_word: ἔπνιγεν
  choice: malite ịnyagbu ya
  rationale: “Malite” na-egosi mmalite omume na-aga n’ihu nke imperfect Grik, ebe “ịnyagbu” na-egosi imechi mmadụ akpịrị ma ọ bụ iku ume.
- source_word: Ἀπόδος
  choice: Kwụghachi
  rationale: Ọ bụ iwu siri ike ka e nyeghachi ụgwọ, nke dabara n’ọnọdụ esemokwu ego.
- source_word: εἴ τι ὀφείλεις
  choice: ụgwọ ọ bụla i ji m
  rationale: Nke a na-enye echiche na-akọwapụtaghị oke—“ihe ọ bụla i ji”—n’Igbo nkịtị; “m” na-eme ka onye a na-akwụghachi doo anya site n’ọnọdụ ahụ.
theological_decisions:
- issue: Ntughari δοῦλος n’ilu a
  choice: ohu / ndị ohu ibe ya
  alternative: ohu na-eje ozi / ndị ọrụ ibe ya
  rationale: Akụkọ a na-ekwu maka ndị nọ n’okpuru nna ukwu na ikike mmanye. “Ohu” na-echekwa ọnọdụ mmekọrịta mmadụ nke okwu Grik ahụ n’emeghị ka ọ dị nro dịka naanị onye ọrụ.
- issue: Iwu εἴ τι ὀφείλεις
  choice: Kwụghachi ụgwọ ọ bụla i ji m!
  alternative: Kwụghachi, ma ọ bụrụ na i ji ihe ọ bụla ụgwọ!
  rationale: Isi ederede na-eji okwu Igbo dị ndụ nke na-echekwa echiche indefinite ahụ. Ihe e dere n’ala peeji na-edebe usoro okwu Grik nke nwere ike ịdị ka ọnọdụ (“ma ọ bụrụ na”).
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Denarịọs” bụ ntụgharị mkpụrụedemede aha ego akụkọ ihe mere eme; nkọwa ya dị n’ala peeji. A họọrọ “ịnyagbu” iji gosipụta ime ihe ike nke okwu Grik, ebe “malite” na-egosi ọdịdị omume na-amalite ma na-aga n’ihu.
