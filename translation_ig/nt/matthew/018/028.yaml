revisions:
- from: Ma mgbe ohu ahụ pụrụ, ọ hụrụ otu n’ime ndị ohu ibe ya ji ya otu narị denarịọs[a] ụgwọ. O wee jide ya, malite ịnyagbu ya, na-asị, “Kwụghachi ụgwọ ọ bụla i ji m!”[b]
  to: Ma mgbe ohu ahụ pụrụ, ọ hụrụ otu n’ime ndị ohu ibe ya, onye ji ya otu narị denarịọs[a] ụgwọ; o jide ya ma malite ịnyagbu ya, na-asị, “Kwụghachi ụgwọ ọ bụla i ji m!”[b]
  rationale: The revision makes the fellow slave’s indebtedness syntactically explicit and replaces the awkward literal-alternative footnote with idiomatic Standard Igbo. It retains the source’s conditional-indefinite nuance, the historical currency, the violent action, and the consistent rendering of δοῦλος as “ohu.”
