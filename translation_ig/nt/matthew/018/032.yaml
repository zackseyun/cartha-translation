id: MAT.18.32
reference: Matthew 18:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked servant[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: ig
  text: Mgbe ahụ, nna ya ukwu kpọrọ ya, sị ya, “Ohu ọjọọ[a], agbaghara m gị[b] ụgwọ ahụ niile n’ihi na ị rịọrọ m arịrịọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Onye na-eje ozi ọjọọ.” Okwu Grik bụ δοῦλος nwere ike ịpụta onye na-eje ozi ma ọ bụ ohu; “ohu” na-egosi na onye a nọ n’okpuru ikike nna ukwu ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ahapụrụ m gị ụgwọ ahụ niile” ma ọ bụ “kagburu m ụgwọ ahụ niile.” Okwu Grik ahụ nwere ike ịpụta ịhapụ ma ọ bụ iwepụ ụgwọ, nakwa ịgbaghara.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ njikọ oge na akụkọ; ‘Mgbe ahụ’ na-egosi ihe sochiri ihe mere tupu ya n’ụzọ doro anya.
- source_word: προσκαλεσάμενος
  choice: kpọrọ ya
  rationale: Okwu a pụtara ịkpọ mmadụ ka ọ bịakwute onye na-akpọ ya; n’ebe a, ọnọdụ nna ukwu ahụ na-eme ka ikike dị n’ọkpụkpọ ahụ pụta ìhè.
- source_word: ὁ κύριος αὐτοῦ
  choice: nna ya ukwu
  rationale: N’ilu a, κύριος bụ nna ukwu nke ohu ahụ, ọ bụghị aha nsọ a na-akpọ Chineke.
- source_word: λέγει αὐτῷ
  choice: sị ya
  rationale: Ọ bụ ezie na Grik ji oge ugbu a nke akụkọ mee ihe, oge gara aga bụ ụzọ e si akọ ya nke ọma n’Igbo.
- source_word: Δοῦλε πονηρέ
  choice: Ohu ọjọọ
  rationale: ‘Ohu’ na-egosi mmekọrịta nke onye nọ n’okpuru nna ukwu ya; ‘ọjọọ’ na-ekwupụta ikpe banyere omume na agwa ya.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: ụgwọ ahụ niile
  rationale: Nke a na-egosi ụgwọ ahụ dum n’enweghị nke fọdụrụ.
- source_word: ἀφῆκά σοι
  choice: agbaghara m gị
  rationale: N’agbanyeghị na ihe a na-ekwu kpọmkwem bụ ịhapụ ụgwọ, ‘agbaghara’ na-edobe njikọ dị n’etiti ịkagbu ụgwọ na mgbaghara, nke dị mkpa n’ilu a.
- source_word: ἐπεὶ
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara nna ukwu ahụ ji mee ihe ahụ.
- source_word: παρεκάλεσάς με
  choice: ị rịọrọ m arịrịọ
  rationale: N’ọnọdụ a, okwu ahụ na-egosi arịrịọ siri ike; nkebi a bụ Igbo kwụ ọtọ ma dị mfe nghọta.
theological_decisions:
- issue: Otu e si sụgharịta δοῦλος n’ilu banyere nna ukwu na onye nọ n’okpuru ya
  choice: ohu
  alternative: onye na-eje ozi
  rationale: Ọnọdụ akụ na ụba na nke iwu nke onye ahụ nọ n’okpuru nna ukwu ya bụ akụkụ dị mkpa nke ilu a. ‘Ohu’ na-egosi mmekọrịta ahụ nke ọma karịa okwu sara mbara bụ ‘onye na-eje ozi.’
- issue: Otu e si sụgharịta ἀφίημι mgbe ihe a na-ekwu bụ ụgwọ
  choice: agbaghara m gị
  alternative: ahapụrụ m gị ụgwọ ahụ / kagburu m ụgwọ ahụ
  rationale: Ihe a na-ekwu ozugbo bụ ịhapụ ma ọ bụ ịkagbu ụgwọ, ma Matiu ji okwu nke nwekwara echiche mgbaghara mee ihe. ‘Agbaghara m gị’ na-edobe njikọ ahụ n’emeghị ka esemokwu ihe okwu ahụ pụtara laa n’iyi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. ‘Nna ya ukwu’ na ‘ohu’ na-edobe ọnọdụ mmekọrịta mmadụ na ibe ya n’ilu ahụ, ebe ‘agbaghara m gị ụgwọ’ na-edobe njikọ Matiu mere n’etiti mgbaghara na ịhapụ ụgwọ.
