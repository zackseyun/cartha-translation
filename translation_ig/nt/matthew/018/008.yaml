revisions:
- from: Ma ọ bụrụ na aka gị ma ọ bụ ụkwụ gị na-eme ka ị sụọ ngọngọ[a], bipụ ya, tụpụkwa ya n'ebe ị nọ. Ọ kaara gị mma ịbanye ná ndụ n'enweghị otu aka ma ọ bụ bụrụ onye ngwọrọ, karịa inwe aka abụọ ma ọ bụ ụkwụ abụọ, e wee tụba gị n'ọkụ ebighị ebi.
  to: Ma ọ bụrụ na aka gị ma ọ bụ ụkwụ gị na-eme ka ị sụọ ngọngọ[a], bipụ ya, tụpụ ya pụọ n’ahụ gị. Ọ kaara gị mma ịbanye ná ndụ dịka onye aka ya e merụrụ emeri ma ọ bụ onye ngwọrọ, karịa ka a tụba gị n’ọkụ ebighị ebi mgbe ị ka nwere aka abụọ ma ọ bụ ụkwụ abụọ.
  rationale: A gbanwere naanị ebe nsụgharị ahụ mere κυλλός ka ọ pụta ‘enweghị otu aka,’ nke bụ nkọwa karịrị ihe isi mmalite kwuru. E meziwokwa okwu banyere ịtụpụ na nhazi nke ntụnyere ikpeazụ ka ha bụrụ Igbo eke, n’enweghị mgbanwe n’echiche, ike, ma ọ bụ ambiguity nke Grik.
