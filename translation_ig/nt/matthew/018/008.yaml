review_pass:
  verdict: revise
  source_fidelity: 'Ederede ahụ na-asụgharị usoro na isi ihe nke Grik nke ọma: σκανδαλίζει ka e chebere dịka ihe atụ ‘ime ka mmadụ sụọ ngọngọ’; iwu abụọ ahụ ka siri ike; ‘ndụ’ anaghị agbakwunye ‘ebighị ebi’; a na-echekwa passive nke βληθῆναι na ‘ọkụ ebighị ebi.’ Otú ọ dị, ‘n''enweghị otu aka’ na-akọwa κυλλόν n’ụzọ dị warara karịa okwu Grik, nke pụtara onye a merụrụ emeri/maimed, ọ bụghị naanị onye otu aka na-adịghị.'
  naturalness: ‘Tụpụkwa ya n'ebe ị nọ’ adịghị ada nke ọma n’Igbo maka ịtụpụ akụkụ ahụ ‘pụọ n’ebe onwe gị nọ.’ Ọzọkwa, ‘karịa inwe aka abụọ ma ọ bụ ụkwụ abụọ, e wee tụba gị’ nwere njikọ na-adịghị nnọọ ire ụtọ. Emezigharịrị ha ka ahịrịokwu ahụ bụrụ Standard Igbo nke oge a ma nọgide n’ike nke isi mmalite.
  terminology: ‘Onye aka ya e merụrụ emeri’ na-enye κυλλόν nke ọma n’ọnọdụ a n’enweghị ịsị na naanị otu aka furu efu. ‘Onye ngwọrọ’ dabara χωλόν. ‘Ọkụ ebighị ebi’ na ‘ịbanye ná ndụ’ kwesịrị ekwesị ma chekwaa okwu ndị bụ isi.
  issues:
  - severity: medium
    issue: ‘n'enweghị otu aka’ maka κυλλόν
    rationale: κυλλός na-ekwu maka ịbụ onye a merụrụ emeri ma ọ bụ onye akụkụ ahụ ya nwere nkwarụ/mutilated; ọ naghị akọwapụta kpọmkwem na onye ahụ enweghị naanị otu aka. Nsụgharị mbụ na-eme ka ihe Grik hapụrụ n’obosara bụrụ nke kpọmkwem.
  - severity: low
    issue: ‘tụpụkwa ya n'ebe ị nọ’
    rationale: Nke a nwere ike ụda ka ịtụpụ ya n’ebe onye ahụ guzo, karịa ‘tufuo ya pụọ n’ahụ/onwe gị,’ nke na-anọchi βάλε ἀπὸ σοῦ n’ụzọ eke karịa.
  - severity: low
    issue: Njikọ nke akụkụ ikpeazụ
    rationale: Iji ‘karịa ka a tụba gị ... mgbe ị ka nwere ...’ na-egosi nke ọma na ‘inwe aka abụọ ma ọ bụ ụkwụ abụọ’ bụ ọnọdụ dị mgbe a na-atụba onye ahụ, dịka participle ἔχοντα si arụ ọrụ.
