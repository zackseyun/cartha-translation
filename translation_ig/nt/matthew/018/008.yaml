id: MAT.18.8
reference: Matthew 18:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: ig
  text: Ma ọ bụrụ na aka gị ma ọ bụ ụkwụ gị na-eme ka ị sụọ ngọngọ[a], bipụ ya, tụpụ ya pụọ n’ahụ gị. Ọ kaara gị mma ịbanye ná ndụ dịka onye aka ya e merụrụ emeri ma ọ bụ onye ngwọrọ, karịa ka a tụba gị n’ọkụ ebighị ebi mgbe ị ka nwere aka abụọ ma ọ bụ ụkwụ abụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-eme ka i mee mmehie.” Okwu Grik ahụ pụtara n'ụzọ nkịtị, “na-eme ka ị sụọ ngọngọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: na-eme ka ị sụọ ngọngọ
  rationale: Nke a na-echekwa ihe atụ Grik nke ime ka mmadụ sụọ ngọngọ, ma ihe gbara ya gburugburu na-egosikwa ihe ize ndụ nke mmehie.
- source_word: ἔκκοψον
  choice: bipụ ya
  rationale: Okwu a bụ iwu siri ike nke pụtara ibipụ akụkụ ahụ; nsụgharị a na-echekwa ike na ịdị kpọmkwem nke okwu ahụ.
- source_word: βάλε ἀπὸ σοῦ
  choice: tụpụkwa ya n'ebe ị nọ
  rationale: Nke a na-egosi ma ịtụpụ ihe ahụ ma iwepụ ya n'ebe onye ahụ nọ.
- source_word: καλόν σοί ἐστιν
  choice: Ọ kaara gị mma
  rationale: N'usoro ntụnyere a, καλόν nwere echiche nke ihe ka mma, ọ bụghị nanị ihe dị mma.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: ịbanye ná ndụ
  rationale: A hapụrụ ‘ndụ’ dịka isi mmalite si kwuo, n'akwụghị ya ‘ndụ ebighị ebi,’ ebe ọdịiche ya na ọkụ ebighị ebi na-enye ya echiche gbasara ndụ nke ụwa na-abịa.
- source_word: κυλλὸν
  choice: n'enweghị otu aka
  rationale: N'ọnọdụ a, okwu ahụ na-ekwu maka onye e bipụrụ aka ma ọ bụ onye akụkụ ahụ ya na-ezughị ezu; nsụgharị a doro anya ma kwekọọ n'ihe atụ aka dị n'ahịrịokwu ahụ.
- source_word: χωλόν
  choice: onye ngwọrọ
  rationale: Nke a bụ okwu Igbo doro anya maka onye ụkwụ ya na-adịghị arụ ọrụ nke ọma, kwekọọ na χωλός n'ọnọdụ a.
- source_word: ἔχοντα
  choice: inwe
  rationale: E gosipụtara participle ahụ n'ụzọ ebumpụta ụwa n'Igbo dịka ‘inwe aka abụọ ma ọ bụ ụkwụ abụọ.’
- source_word: βληθῆναι
  choice: e wee tụba gị
  rationale: Nke a na-echekwa ụdị passive nke Grik ma na-ada nke ọma n'Igbo.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: ọkụ ebighị ebi
  rationale: N'ọnọdụ ikpe a, αἰώνιος pụtara ihe na-adị ebighị ebi; okwu a bụkwa ụzọ Igbo doro anya na nke a na-ahụkarị isi kwuo ya.
theological_decisions:
- issue: Ma a ga-akọwa σκανδαλίζει ozugbo dịka ime ka mmadụ mee mmehie, ka a ga-echekwa ihe atụ nke ịsụ ngọngọ
  choice: na-eme ka ị sụọ ngọngọ
  alternative: na-eme ka i mee mmehie
  rationale: Isi okwu Grik na-echekwa ihe atụ nke ịsụ ngọngọ. Ihe gbara ya gburugburu na-eme ka ihe ọ pụtara n'omume doo anya, ebe nkọwa ala peeji na-enye ihe ọzọ a pụrụ isi kwuo ya.
- issue: Ihe ‘ndụ’ pụtara na εἰς τὴν ζωὴν
  choice: ịbanye ná ndụ
  alternative: ịbanye ná ndụ ebighị ebi
  rationale: Ọ bụ ezie na okwu a na-ezo aka ná ndụ nke ụwa na-abịa, Grik kwuru naanị ‘ndụ.’ Nsụgharị ahụ anaghị etinye okwu ọzọ na-adịghị n'isi mmalite.
- issue: Ma iwu banyere ibipụ aka ma ọ bụ ụkwụ bụ okwu nkịtị ka ọ bụ okwu atụ
  choice: e chekwara iwu ahụ dịka o siri dị n'okwu ahụ
  alternative: ịkọwagharị ya dịka oku ihe atụ ka mmadụ hapụ mmehie kpamkpam
  rationale: Amaokwu ahụ ji iwu na ihe oyiyi siri ike kwuo okwu. Nsụgharị ahụ anaghị eme ka ọ dị nro ma ọ bụ kpebie n'ime ederede ma ọ bụ okwu nkwubiga okwu ókè.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘sụọ ngọngọ’ iji chekwaa ihe atụ dị n'isi mmalite, ebe ‘onye ngwọrọ’ na ‘n'enweghị otu aka’ na-eme ka ọdịiche akụkụ ahụ abụọ ahụ doo anya n'ọnọdụ a.
