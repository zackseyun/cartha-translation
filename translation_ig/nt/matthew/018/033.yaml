source:
  edition: SBLGNT
  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow servant[a], as I also had mercy on you?
translation:
  language: ig
  text: Ì kwesịghịkwa imere ohu ibe gị[a] ebere, dị ka mụ kwa meere gị ebere?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye gị na ya bụ ohu” ma ọ bụ “onye gị na ya na-eje ozi.” Okwu Grik σύνδουλος na-ezo aka n’onye ya na onye ọzọ nwere otu nna ukwu; e ji “ohu ibe gị” mee ihe ebe a iji debe echiche nke ọnọdụ ohu n’ilu a.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: Ì kwesịghịkwa
  rationale: Ụdị ajụjụ a na-egosi ihe e kwesịrị ime n’ụzọ omume ma na-ebukwa olu ịbara onye ahụ mba; “Ì kwesịghịkwa” na-ekwupụta nke a n’Igbo dị ugbu a.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” na-egosi na ohu ahụ kwesịkwara imere ibe ya ihe e mere ya, ma debe njikọ dị n’etiti omume abụọ ahụ.
- source_word: ἐλεῆσαι / ἠλέησα
  choice: imere ... ebere / meere ... ebere
  rationale: E ji otu akpaokwu ahụ sụgharịa ụdị ngwaa abụọ ahụ ka nkwughachi nke ἐλεάω doo anya, ma ka ịdị arọ nke ebere n’omume na n’okwukwe ghara ịla n’iyi.
- source_word: τὸν σύνδουλόν σου
  choice: ohu ibe gị
  rationale: “Ohu ibe gị” bụ Igbo dị nkenke ma doo anya maka onye ya na onye ọzọ nọ n’otu ọnọdụ ohu n’okpuru otu nna ukwu; ọ naghị eme ka ọnọdụ agbụ ahụ dị nro dịka “onye na-ejere ozi ibe gị” ga-eme.
- source_word: ὡς
  choice: dị ka
  rationale: “Dị ka” na-egosi ntụnyere doro anya n’etiti ebere a tụrụ anya ya na ebere e merela ya.
- source_word: κἀγὼ
  choice: mụ onwe m
  rationale: “Mụ onwe m” na-eme ka onye kwuru okwu pụta ìhè n’ime ntụnyere ahụ; echiche mgbakwunye nke καί pụtakwara site na “-kwa” na nhazi ahịrịokwu ahụ.
theological_decisions:
- issue: Nsụgharị okwu sitere n’ezinụlọ δοῦλος n’okwu σύνδουλος
  choice: ohu ibe gị
  alternative: onye na-ejere ozi ibe gị; onye gị na ya bụ ohu
  rationale: N’ilu a, eze/nna ukwu na ndị ji ya ụgwọ nọ n’ọnọdụ ikike na ndabere nke na-eme ka echiche ịbụ ohu dị mkpa. “Ohu ibe gị” na-edebe ọnọdụ ahụ ma na-egosikwa na ha abụọ nọ n’okpuru otu nna ukwu, n’enweghị itinye nkọwa nke otu ụka.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. Ajụjụ ahụ ka bụ ajụjụ ịbara mba, a debekwara nkwughachi nke “ebere” na ntụnyere dị n’akwụkwọ Grik.
