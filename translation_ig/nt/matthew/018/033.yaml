revisions:
- from: Ì kwesịghịkwa imere ohu ibe gị[a] ebere, dị ka mụ onwe m meere gị ebere?
  to: Ì kwesịghịkwa imere ohu ibe gị[a] ebere, dị ka mụ kwa meere gị ebere?
  rationale: The revision changes “mụ onwe m” to “mụ kwa” so that the explicit additive force of κἀγώ is retained without introducing an unwarranted reflexive emphasis. It also improves one alternative rendering in the footnote for clarity and natural Standard Igbo. All other wording is retained because it faithfully conveys the Greek and the parable’s register.
