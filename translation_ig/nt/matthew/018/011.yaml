  source_fidelity: 'The verse accurately renders the Byzantine Greek: γὰρ is represented by “N’ihi na,” the titular expression ὁ υἱὸς τοῦ ἀνθρώπου by “Nwa nke Mmadụ,” σῶσαι by “ịzọpụta,” and the neuter singular substantive participle τὸ ἀπολωλός is retained as a non-personal collective expression rather than changed to “ndị furu efu.”'
  naturalness: “Ihe furu efu” is more idiomatic modern Standard Igbo than “ihe ahụ furu efu” in this generic substantive use, while still conveying the Greek article and neuter-singular form adequately.
