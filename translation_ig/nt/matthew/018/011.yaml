  yaml_path: translation/nt/matthew/018/011.yaml
  text: For the Son[a] of Man came to save the lost.
translation:
  language: ig
  text: N’ihi na Nwa nke Mmadụ[a] bịara ịzọpụta ihe furu efu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a adịghị n’ime ihe odide Grik ndị kacha ochie, gụnyere Codex Sinaiticus na Codex Vaticanus nke narị afọ nke anọ, nakwa n’ime nsụgharị Kọptik oge mbụ. Ma ọ dị na Codex Bezae nke narị afọ nke ise, n’ọtụtụ ihe odide ọdịnala Bizantịn, nakwa na Vulgate Latịn. O nwere ike ịbụ na ndị odeakwụkwọ mechara tinye ya ka o kwekọọ na Luk 19:10.
    reason: textual_critical
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Aha a na-asụgharị okwu Grik ahụ n’ụzọ kwụ ọtọ ma bụrụkwa okwu a maara nke ọma n’Igbo maka aha Jizọs ji akpọ onwe ya.
- source_word: σῶσαι
  choice: ịzọpụta
  rationale: Ọ na-egosi ịnapụta ihe nọ n’ihe ize ndụ ma ọ bụ na-aga n’iyi; ọ dabara n’ọnọdụ nzọpụta nke amaokwu a.
- source_word: τὸ ἀπολωλός
  choice: ihe ahụ furu efu
  rationale: Partisịpụ ahụ bụ neuter singular ma na-arụ ọrụ dị ka aha. Nsụgharị a na-echekwa ọdịdị otu ihe nke Grik na-ahapụghị ya ka ọ bụrụ naanị ‘ndị furu efu,’ nke ga-eme ka ihe a na-ekwu pụta ìhè karịa ka isi mmalite mere.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe kpatara okwu bu ya ụzọ.
theological_decisions:
- issue: Ihe τὸ ἀπολωλός na-ezo aka na ya
  choice: ihe ahụ furu efu
  alternative: ndị furu efu
  rationale: E debere nkwupụta neuter singular nke Grik ka ọ ghara ịkpebi n’ime nsụgharị na ọ bụ naanị ọtụtụ mmadụ ka okwu ahụ na-ezo aka, ọ bụ ezie na ọnọdụ ahụ metụtara mmadụ.
translation_notes:
  register: Ejiri Igbo izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere akara [a] ozugbo n’akụkụ aha okwu ahụ dịka o si dị na oyi akwa ntụnyere Bekee, ebe nkọwa ahụ na-akọ ọnọdụ ihe odide nke amaokwu ahụ dum.
