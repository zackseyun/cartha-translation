  yaml_path: translation/nt/matthew/018/002.yaml
  text: And calling a child to himself, he stood him in their midst.
translation:
  language: ig
  text: Ọ kpọrọ otu nwatakịrị ka ọ bịakwute ya, wee mee ka o guzo n’etiti ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Ọ kpọrọ ... ka ọ bịakwute ya
  rationale: Nke a na-egosipụta omume ịkpọ mmadụ ka ọ bịakwute onye na-akpọ ya, dị ka participle a si pụta n’ebe a.
- source_word: παιδίον
  choice: otu nwatakịrị
  rationale: “Nwatakịrị” bụ okwu Igbo nkịtị ma doo anya maka παιδίον; “otu” na-ewebata onye ahụ n’akụkọ ahụ n’ụzọ dị mma.
- source_word: ἔστησεν αὐτό
  choice: mee ka o guzo
  rationale: 'ἔστησεν bụ aorist causative/transitive n’ebe a: o mere ka nwatakịrị ahụ guzo, ọ bụghị naanị na ọ ‘tọgbọrọ’ ya.'
- source_word: ἐν μέσῳ αὐτῶν
  choice: n’etiti ha
  rationale: Ntụgharị kpọmkwem na nke e ji eme ihe n’Igbo maka ịnọ n’etiti otu mmadụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe nghọta ma dị ugwu. E chekwawo usoro omume abụọ dị na Grik—ịkpọ nwatakịrị ahụ ka ọ bịakwute ya, na ime ka o guzo n’etiti ha—n’enweghị ịgbakwunye nkọwa ozizi.
