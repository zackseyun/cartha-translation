revisions:
- from: N’otu aka ahụ, ọ bụghị uche Nna unu nke nọ n’eluigwe ka otu onye n’ime ụmụntakịrị ndị a laa n’iyi.[a]
  to: N’otu aka ahụ, ọ bụghị uche Nna unu nke nọ n’eluigwe ka ọbụna otu n’ime ndị nta ndị a laa n’iyi.[a]
  rationale: The revision retains the draft’s sound idiomatic handling of the Greek phrase involving ἔμπροσθεν, while making the negated singular explicit in natural Igbo and avoiding an age-exclusive rendering of μικροί. The footnote continues to preserve the legitimate contextual alternative for ἀπόληται.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:37Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the comparative οὕτως, the Father's will, the heavenly designation, and the possible force of ἀπόληται. Rendering ἔμπροσθεν idiomatically as possession ('uche Nna unu') is justified in this Greek construction; a literal 'n’ihu Nna unu' would be unnatural and would obscure the sense. The singular under negation is better represented by 'ọbụna otu,' which naturally conveys that not a single one is in view.
  naturalness: The sentence is clear, modern Standard Igbo, and appropriately reverent. Replacing 'otu onye n’ime ụmụntakịrị ndị a' with 'ọbụna otu n’ime ndị nta ndị a' is more idiomatic in the negative construction and avoids making μικροί refer only to children by age.
  terminology: '''Uche'' appropriately renders θέλημα, ''Nna unu nke nọ n’eluigwe'' is established and natural, and ''laa n’iyi'' preserves the grave sense of ἀπόληται. ''Ndị nta ndị a'' retains the relational/metaphorical breadth of ''these little ones.'' The alternative ''fuo efu'' appropriately preserves the lost-sheep resonance without settling the sense.'
  issues:
  - severity: medium
    issue: The main text omits the minimising emphasis in the negated singular expression.
    rationale: Although ἓν literally means 'one,' οὐκ ... ἵνα ἀπόληται ἓν naturally means 'that not even one ... should perish.' In Igbo, 'ọbụna otu' expresses this force without adding a distinct theological claim.
  - severity: medium
    issue: '''Ụmụntakịrị'' can restrict ''the little ones'' to young children.'
    rationale: In this discipleship context, τῶν μικρῶν τούτων need not refer exclusively to children by age. 'Ndị nta ndị a' preserves the source expression’s broader referential scope.
  revised_text: N’otu aka ahụ, ọ bụghị uche Nna unu nke nọ n’eluigwe ka ọbụna otu n’ime ndị nta ndị a laa n’iyi.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ọbụna otu n’ime ndị nta ndị a fuo efu.” Ngwaa Grik ahụ nwere ike ịpụta “laa n’iyi” ma ọ bụ “fuo efu”; akụkọ banyere atụrụ furu efu nke bu ụzọ kwado nghọta nke abụọ.
    reason: alternative_reading
  revision_rationale: The revision retains the draft’s sound idiomatic handling of the Greek phrase involving ἔμπροσθεν, while making the negated singular explicit in natural Igbo and avoiding an age-exclusive rendering of μικροί. The footnote continues to preserve the legitimate contextual alternative for ἀπόληται.
