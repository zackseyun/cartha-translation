id: MAT.18.14
reference: Matthew 18:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: ig
  text: N’otu aka ahụ, ọ bụghị uche Nna unu nke nọ n’eluigwe ka ọbụna otu n’ime ndị nta ndị a laa n’iyi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ọbụna otu n’ime ndị nta ndị a fuo efu.” Ngwaa Grik ahụ nwere ike ịpụta “laa n’iyi” ma ọ bụ “fuo efu”; akụkọ banyere atụrụ furu efu nke bu ụzọ kwado nghọta nke abụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: N’otu aka ahụ
  rationale: Ọ na-ejikọta okwu a na ihe atụ atụrụ furu efu nke bu ya ụzọ, ma na-egosipụta ntụnyere ahụ n’Igbo dị mfe nghọta.
- source_word: θέλημα
  choice: uche
  rationale: “Uche” bụ ụzọ Igbo kwụ ọtọ na nke a na-ahụkarị isi kọwaa ihe mmadụ chọrọ ma ọ bụ nzube ya n’ọnọdụ a.
- source_word: ἔμπροσθεν
  choice: ọ bụghị uche Nna unu
  rationale: Ọ bụ ezie na ἔμπροσθεν pụtara n'ụzọ nkịtị “n’ihu,” usoro okwu Grik a na-egosi ihe Nna chọrọ; ntụgharị a bụ Igbo eke, ọ naghịkwa agbanwe isi okwu ahụ.
- source_word: πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: Nna unu nke nọ n’eluigwe
  rationale: Nke a na-edobe ma mmekọ “Nna unu” ma nkọwa ebe ahụ, n’Igbo doro anya ma dị ùgwù.
- source_word: ἵνα ἀπόληται
  choice: ka ... laa n’iyi
  rationale: “Laa n’iyi” na-eburu ịdị njọ nke ἀπόληται; ebe ngwaa ahụ pụkwara ịpụta “fuo efu,” a debere nghọta ahụ n’okpuru peeji n’ihi ihe atụ atụrụ furu efu nke dị nso.
- source_word: ἓν τῶν μικρῶν τούτων
  choice: otu onye n’ime ụmụntakịrị ndị a
  rationale: “Otu onye” na-edobe kpọmkwem otu ahụ n’enweghị itinye okwu dịka “ọbụna” nke na-adịghị n’ederede Grik; “ụmụntakịrị” na-ahapụ ka okwu ahụ metụta ndị a na-ewere dị nta, ọ bụghị naanị ụmụaka n’afọ.
theological_decisions:
- issue: Ihe ἀπόληται pụtara n’ihe gbasara akụkọ atụrụ furu efu
  choice: laa n’iyi
  alternative: fuo efu
  rationale: “Laa n’iyi” na-edobe ịdọ aka ná ntị siri ike nke okwu ahụ, ebe “fuo efu” kwekọrọ kpọmkwem n’akụkọ atụrụ ahụ. Ịtụnye nke ọzọ n’okpuru peeji na-echekwa nghọta abụọ ahụ n’enweghị ikpebi esemokwu nkà mmụta okpukpe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma dị ùgwù. A họọrọ “N’otu aka ahụ” iji mee ka njikọ ya na ihe atụ gara aga doo anya; e zere ịkọwa “ụmụntakịrị” dị ka naanị ụmụaka n’afọ.
