id: MAT.18.35
reference: Matthew 18:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: ig
  text: N’otu a kwa, Nna m nke eluigwe ga-eme unu otu a, ma ọ bụrụ na onye ọ bụla n’ime unu agbagharaghị nwanne ya site n’obi ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Nwanne ya” na-asụgharị okwu Grik nwoke, nke dị n’otu ọgụ. N’ebe a, ọ na-arụ ọrụ nnọchianya maka nwanne onye ọ bụla kwesịrị ịgbaghara.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: N’otu a kwa
  rationale: Nke a na-ejikọta ịdọ aka ná ntị ahụ na ihe nna ukwu mere n’ilu gara aga, ma na-echekwa echiche nke ntụnyere na nkwubi okwu.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: Nna m nke eluigwe
  rationale: Ọ bụ okwu Igbo doro anya ma dị ùgwù nke na-echekwa ma ‘Nna m’ ma nkọwa οὐράνιος, ya bụ ‘nke eluigwe.’
- source_word: ποιήσει ὑμῖν
  choice: ga-emekwa unu
  rationale: A hapụrụ ποιέω ka ọ bụrụ okwu sara mbara nke na-atụ aka n’ihe nna ukwu mere n’ilu ahụ, n’agbanyeghị na Igbo na-eji ‘ime mmadụ ihe’ eme ihe n’ụzọ dabara adaba.
- source_word: ἐὰν μὴ
  choice: ma ọ bụrụ na ... esighị
  rationale: Nke a na-echekwa ọnọdụ na-adịghị mma nke okwu Grik ahụ n’ụzọ Igbo na-ada nke ọma.
- source_word: ἀφῆτε
  choice: gbaghara
  rationale: N’ihe gbasara mmejọ mmadụ na ibe ya na ihe atụ nke ụgwọ, ihe okwu ahụ pụtara bụ ịgbaghara.
- source_word: ἕκαστος
  choice: onye ọ bụla n’ime unu
  rationale: Nke a na-egosi na iwu ahụ metụtara onye ọ bụla n’ime ìgwè ndị a na-agwa okwu.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: nwanne ya
  rationale: ‘Nwanne ya’ bụ ntụgharị Igbo ebumpụta ụwa nke singular ahụ; n’Igbo ọ pụkwara ịrụ ọrụ n’enweghị ịkọwapụta nwoke ma ọ bụ nwanyị, ya mere nkọwa ala peeji na-akọwa na ebe a ọ na-anọchi anya onye kwere ekwe ibe ya.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: esighị n’obi ya
  rationale: Igbo na-ejikarị singular ‘obi’ mee ihe mgbe a na-ekesa ihe n’otu n’otu. Njikọ ya na ‘onye ọ bụla’ na-echekwa mkpa nke mgbaghara sitere n’ezi obi.
theological_decisions:
- issue: Ókè na ike nke ịdọ aka ná ntị ahụ
  choice: A sụgharịrị ya dị ka ịdọ aka ná ntị kpọmkwem na Nna nke eluigwe ga-emeso ndị na-adịghị agbaghara dịka nna ukwu ahụ mesoro ohu ahụ.
  alternative: Ịsị naanị ‘ga-emeso unu otu ahụ,’ ma ọ bụ ịgbakwunye nkọwa na ọ bụ ikpe ebighị ebi ma ọ bụ naanị mfu ụgwọ ọrụ.
  rationale: Okwu Grik ahụ siri ike ma na-atụ aka azụ n’ilu ahụ, mana ọ naghị akọwa ụdị ikpe ahụ n’usoro nkà mmụta okpukpe. Ya mere, ntụgharị a anaghị eme ka ịdọ aka ná ntị ahụ dị nro ma ọ bụ kpebie ihe ederede ahụ na-ekwughị.
- issue: Mmekọ nwoke na nwanyị n’okwu ἀδελφῷ
  choice: nwanne ya
  alternative: nwanna nwoke ya; onye kwere ekwe ibe ya
  rationale: Grik ahụ bụ masculine singular, ma ‘nwanne’ n’Igbo bụ okwu nkịtị nke dabara n’ebe a ma nwee ike ịgụnye onye otu okwukwe n’enweghị itinye nkọwa okike nke Igbo na-achọghị. A kọwara ọrụ nnọchianya ya n’ala peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘N’otu a kwa’ iji jikọta amaokwu ahụ n’ilu gara aga. A haziri akụkụ ikpeazụ n’usoro Igbo ebumpụta ụwa—‘onye ọ bụla ... esighị n’obi ya’—ma chekwaa ọnọdụ, nkesa n’otu n’otu, na mkpa mgbaghara sitere n’ezi obi.
