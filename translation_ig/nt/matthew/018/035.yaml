    reason: cultural_note
  revision_rationale: The revision makes the reference of the broad verb ποιήσει natural and explicit in Igbo (“ga-eme unu otu a”), while preserving its allusion to the preceding parable rather than defining the punishment. It also recasts the conditional clause in idiomatic Standard Igbo and refines the gender note to reflect the Greek grammar without imposing an overly narrow interpretation. Footnote a is omitted because “otu a” now carries the necessary contextual reference in the text, and the prior note added an explanatory paraphrase not required by the source.
