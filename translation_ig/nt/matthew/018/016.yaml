revisions:
- from: Ma ọ bụrụ na ọ geghị ntị, kpọrọ otu onye ma ọ bụ mmadụ abụọ ọzọ soro gị, ka e wee jiri ọnụ ndị akaebe abụọ ma ọ bụ atọ mee ka okwu niile guzosie ike.[a][b]
  to: Ma ọ bụrụ na ọ geghị ntị, kpọrọ otu onye ọzọ ma ọ bụ mmadụ abụọ ka ha soro gị, ka okwu ọ bụla guzosie ike site n’ọnụ ndị akaebe abụọ ma ọ bụ atọ.[a][b]
  rationale: The revision retains the source’s conditional and purposive structure, its additional one-or-two-person requirement, and its legal witness idiom. It improves Standard Igbo syntax, represents πᾶν ῥῆμα as “okwu ọ bụla,” and places the alternative-rendering note at the phrase it explains. No disputed textual or doctrinal interpretation has been introduced.
