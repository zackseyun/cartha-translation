    reason: lexical_alternative
  - marker: b
    text: Nke a na-ezo aka na Diuterọnọmi 19:15, ebe okwu na-eguzosi ike site n’akaebe mmadụ abụọ ma ọ bụ atọ.
    reason: cross_reference
  revision_rationale: The revision retains the source’s conditional and purposive structure, its additional one-or-two-person requirement, and its legal witness idiom. It improves Standard Igbo syntax, represents πᾶν ῥῆμα as “okwu ọ bụla,” and places the alternative-rendering note at the phrase it explains. No disputed textual or doctrinal interpretation has been introduced.
