  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: ig
  text: Ma ọ bụrụ na ọ geghị ntị, kpọrọ otu onye ọzọ ma ọ bụ mmadụ abụọ ka ha soro gị, ka okwu ọ bụla guzosie ike site n’ọnụ ndị akaebe abụọ ma ọ bụ atọ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ na-akọwa ihe ọ pụtara, “site n’akaebe mmadụ abụọ ma ọ bụ atọ.”
    reason: lexical_alternative
  - marker: b
    text: Nke a na-ezo aka na Diuterọnọmi 19:15, ebe okwu na-eguzosi ike site n’akaebe mmadụ abụọ ma ọ bụ atọ.
    reason: cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: geghị ntị
  rationale: N’ọnọdụ ịdọ aka ná ntị a, okwu a pụtara ịghara ige ntị ma ọ bụ ịnabata ndụmọdụ, ọ bụghị nanị ịghara ịnụ ụda.
- source_word: παράλαβε μετὰ σοῦ
  choice: kpọrọ ... soro gị
  rationale: Nke a bụ ụzọ Igbo dị ndụ si kwuo ka mmadụ kpọrọ ndị ọzọ gaa ya na ha; ọ na-echekwa iwu na echiche nke iso mmadụ.
- source_word: ἔτι ἕνα ἢ δύο
  choice: otu onye ma ọ bụ mmadụ abụọ ọzọ
  rationale: “Ọzọ” na-egosipụta ἔτι, ya bụ, ndị a bụ ndị a ga-agbakwụnye.
- source_word: ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν
  choice: jiri ọnụ ndị akaebe abụọ ma ọ bụ atọ
  rationale: E chekwara akpaokwu iwu Hibru/Grik ahụ n’ụdị Igbo a pụrụ ịghọta, ebe “ọnụ” na-anọchi ihe ndị akaebe kwuru.
- source_word: σταθῇ
  choice: mee ka ... guzosie ike
  rationale: N’ọnọdụ iwu, ọ pụtara ime ka okwu bụrụ nke e mere ka o doo anya ma bụrụ nke a kwadoro; “guzosie ike” na-echekwakwa onyinyo okwu Grik.
- source_word: πᾶν ῥῆμα
  choice: okwu niile
  rationale: Nke a na-echekwa obosara na obere mgbagwoju anya nke πᾶν ῥῆμα, nke pụrụ ịpụta okwu ọ bụla ma ọ bụ ihe niile metụtara okwu ahụ, n’enweghị ime ka ọ bụrụ naanị ebubo.
theological_decisions:
- issue: Ntụaka n’iwu Ndị Agba Ochie na ọnọdụ ịdọ aka ná ntị n’ọgbakọ
  choice: E chekwara usoro okwu ahụ, “jiri ọnụ ndị akaebe abụọ ma ọ bụ atọ,” ma kọwaa ihe ọ pụtara n’ala ala peeji.
  alternative: “Dabere n’akaebe ndị akaebe abụọ ma ọ bụ atọ”
  rationale: Nhọrọ a na-echekwa nkwughachi Diuterọnọmi 19:15 na ike iwu ya, ma ọ naghị amanye nkọwa okpukpe pụrụ iche n’elu ederede ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma doo ndị mmadụ nkịtị anya. “Kpọrọ ... soro gị” bụ akpaokwu eke; “jiri ọnụ” na-echekwa akpaokwu Akwụkwọ Nsọ na usoro iwu, ebe nkọwa ala ala peeji na-enye nsụgharị doro anya karị.
