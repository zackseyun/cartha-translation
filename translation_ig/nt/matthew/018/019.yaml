id: MAT.18.19
reference: Matthew 18:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: ig
  text: 'Ọzọkwa, n’ezie, ana m asị unu: Ọ bụrụ na mmadụ abụọ n’etiti unu ekwekọrịta[a] n’ụwa banyere ihe ọ bụla ha ga-arịọ[c], a ga-emere ha ya site n’aka Nna m nke nọ n’eluigwe[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọ bụrụ na mmadụ abụọ sitere n’etiti unu adị n’otu uche.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ bụ “n’eluigwe” n’ụdị ọtụtụ; a sụgharịwo ya n’ụzọ Igbo a na-ejikarị eme ihe dịka “n’eluigwe.”
    reason: lexical_alternative
  - marker: c
    text: N’ọnọdụ okwu a, okwu a so ozizi Jizọs banyere ikike na ịdọ aka ná ntị n’ime ọgbakọ (18:15–18), ọ bụ ezie na amaokwu a n’onwe ya na-ekwu n’ụzọ sara mbara banyere arịrịọ ndị ha kwekọrịtara na ya.
    reason: cross_reference
lexical_decisions:
- source_word: Πάλιν
  choice: Ọzọkwa
  rationale: Na-egosi na Jizọs na-agbakwụnye okwu ọzọ siri ike nke jikọrọ ya na ihe ọ ka kwuru; ọ bụkwa okwu Igbo dị mfe ma kwekọọ n’usoro okwu ahụ.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: n’ezie, ana m asị unu
  rationale: Na-ebute ike na nkwenye dị n’usoro okwu solem nke Jizọs n’ụzọ ndị na-agụ Igbo taa ga-aghọta nke ọma.
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: ọ bụrụ na mmadụ abụọ n’etiti unu ekwekọọ
  rationale: “Kwekọọ” na-egosi ịdị n’otu echiche ma ọ bụ nkwekọrịta; “n’etiti unu” na-anọchi ἐξ ὑμῶν n'ụzọ doro anya.
- source_word: ἐπὶ τῆς γῆς
  choice: n’ụwa
  rationale: Na-echekwa ọdịiche dị n’etiti ndị nọ n’ụwa na Nna nọ n’eluigwe.
- source_word: περὶ παντὸς πράγματος
  choice: banyere ihe ọ bụla
  rationale: Na-echekwa obosara nke πρᾶγμα, nke nwere ike ịbụ ihe, okwu, ma ọ bụ ihe metụtara mmadụ.
- source_word: οὗ ἐὰν αἰτήσωνται
  choice: ha rịọrọ
  rationale: “Rịọrọ” dabara n’arịrịọ a na-arịọ onye ọzọ, gụnyere arịrịọ a na-arịọ Chineke, ma ọ naghị etinye nkọwa okpukpe ọzọ na-adịghị n’okwu Grik.
- source_word: γενήσεται αὐτοῖς
  choice: ga-emere ha ya
  rationale: Na-egosi na ihe ahụ ga-eme maka ha ma na-agwakọta nke ọma na onye na-eme ya, bụ́ Nna.
- source_word: παρὰ τοῦ πατρός μου
  choice: Nna m ... ga-emere ha ya
  rationale: Na-egosipụta Nna dịka onye ihe ahụ si n’aka ya pụta na onye na-eme ya, dịka παρά ya na γενήσεται si kwe omume n’ebe a.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: nke bi n’eluigwe
  rationale: Ọ bụ usoro okwu Igbo a na-ejikarị egosipụta Nna nke nọ n’eluigwe; a tụgharịrị ọtụtụ οὐρανοῖς n’ụzọ idiomatic dịka otu “eluigwe.”
theological_decisions:
- issue: Oke nkwa a n’ọnọdụ okwu ya
  choice: A tụgharịrị okwu ahụ dịka o si dị, n’etinyeghị n’ahịrịokwu ahụ mmachi gbasara ekpere, ịdọ aka ná ntị n’ọgbakọ, ma ọ bụ uche Chineke.
  alternative: Ịkọwa ya kpọmkwem naanị dịka mkpebi ịdọ aka ná ntị nke ọgbakọ, ma ọ bụ ime ya nkwa na-enweghị oke banyere arịrịọ ekpere ọ bụla.
  rationale: Ihe gbara amaokwu ahụ gburugburu metụtara idozi mmejọ na ikike ọgbakọ (18:15–18), ebe αἰτέω na-egosi ịrịọ, ikekwe n’ekpere. Ma amaokwu ahụ n’onwe ya etinyeghị mmachi ndị ahụ ma ọ bụ gbasaa nkwa ahụ dịka nkwa na-enweghị oke. Ya mere, nsụgharị ahụ na-echekwa obosara okwu ahụ na esemokwu nkọwa dị n’ọnọdụ ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ụda nkwenye siri ike nke Jizọs, na-enweghị okwu ochie ma ọ bụ nkọwa nke otu ụka pụrụ iche. E tinyere akara ndetu ụkwụ n’ebe okwu nke ọ bụla metụtara dị, kama idobe akara [a] n’akụkụ “Ọzọkwa,” ebe ndetu ahụ na-akọwa nkebi gbasara mmadụ abụọ ikwekọrịta.
