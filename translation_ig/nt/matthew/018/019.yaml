revisions:
- from: 'Ọzọkwa, n’ezie, ana m asị unu: Ọ bụrụ na mmadụ abụọ n’etiti unu ekwekọọ[a] n’ụwa banyere ihe ọ bụla ha rịọrọ[c], Nna m nke bi n’eluigwe[b] ga-emere ha ya.'
  to: 'Ọzọkwa, n’ezie, ana m asị unu: Ọ bụrụ na mmadụ abụọ n’etiti unu ekwekọrịta[a] n’ụwa banyere ihe ọ bụla ha ga-arịọ[c], a ga-emere ha ya site n’aka Nna m nke nọ n’eluigwe[b].'
  rationale: The revision corrects the temporal force of the request clause, uses a more natural verb for mutual agreement, preserves the Greek source/agency ambiguity in the result clause, and corrects the erroneous explanation of the plural Greek word for “heavens.” Footnote anchors remain attached to the words or clauses they explain.
