  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: ig
  text: Nna ya ukwu[a] were iwe, nyefee ya n’aka ndị na-ata mmadụ ahụhụ[b] ruo mgbe ọ ga-akwụghachi ihe niile o ji ụgwọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onyenwe ya.” Okwu Grik bụ kyrios. N’ebe a, ọ na-ezo aka n’ime ilu ahụ nye nna ukwu nke ohu ahụ; ya mere e ji “nna ya ukwu” mee ihe n’isi ederede.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ndị na-emekpa mmadụ ahụ”; n’ụzọ na-esighị ike, “ndị nche ụlọ mkpọrọ.” Okwu Grik ahụ na-ezo aka ná ndị na-ata mmadụ ahụhụ, ọ bụghị naanị ndị nche nkịtị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: were iwe
  rationale: Nke a na-egosipụta participle a n’ụzọ Igbo dị nkenke ma doo anya, na-edobe mmetụta iwe nke dugara n’omume sochirinụ.
- source_word: κύριος
  choice: nna ya ukwu
  rationale: N’ime ilu a, okwu ahụ na-ezo aka n’onyeisi ohu ahụ. “Nna ya ukwu” bụ okwu Igbo nkịtị maka onyeisi ma ọ bụ master, n’ebughị ụzọ mee ya aha nsọ.
- source_word: παρέδωκεν
  choice: nyefee ya n’aka
  rationale: Nke a na-egosipụta inyefe mmadụ n’okpuru ikike ndị ọzọ, dịka ihe odide Grik si kwuo.
- source_word: βασανισταῖς
  choice: ndị na-ata ndị mkpọrọ ahụhụ
  rationale: Okwu Grik ahụ pụtara ndị na-eme ka mmadụ taa ahụhụ, ọ bụghị naanị ndị nche ụlọ mkpọrọ. Nhọrọ a na-edobe ịdị arọ nke okwu ahụ ma na-egosi ọnọdụ njide.
- source_word: ἕως οὗ
  choice: ruo mgbe
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si egosipụta njedebe oge a na-atụ anya ya.
- source_word: ἀποδῷ
  choice: ọ ga-akwụcha
  rationale: “Ga-akwụcha” na-egosipụta omume ịkwụghachi nke a tụrụ anya ka o zuo oke tupu njide ahụ akwụsị.
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: ihe niile o ji
  rationale: Nhọrọ a na-anọ nso n’okwu Grik nke pụtara ihe niile e ji, n’etinyeghị aha “ụgwọ” n’ebe okwu Grik jiri nkọwa sara mbara.
theological_decisions:
- issue: Ma a ga-asụgharị κύριος dị ka aha nsọ “Onyenwe anyị”
  choice: nna ya ukwu
  alternative: Onyenwe ya
  rationale: N’akụkọ ilu a, ọ bụ onyeisi ohu ahụ ka okwu ahụ na-ezo aka ozugbo. Nhọrọ isi ederede na-edobe ọrụ ya n’akụkọ ahụ n’agbanyeghị na ilu ahụ nwere ihe ọ na-akụzi banyere Chineke.
- issue: Ike na ịdị arọ nke βασανισταῖς n’ọnọdụ ntaramahụhụ
  choice: ndị na-ata ndị mkpọrọ ahụhụ
  alternative: ndị nche ụlọ mkpọrọ
  rationale: Okwu Grik ahụ na-egosi ndị na-eweta mmekpa ahụ, ya mere a hapụghị ya ka ọ bụrụ naanị ndị nche. Nke a na-edobe ịdọ aka ná ntị nke ilu ahụ n’akọwaghị karịa ihe amaokwu ahụ kwuru banyere ikpe ikpeazụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe nhazi participle na isi omume n’ụzọ Igbo ebumpụta ụwa, ma na-ahapụ ịdị arọ na esemokwu nkà mmụta okpukpe nke ilu ahụ ka ha dị.
