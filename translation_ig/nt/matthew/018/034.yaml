review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the master's anger, handing the servant over, the temporal endpoint, and the obligation. However, “ndị na-ata ndị mkpọrọ ahụhụ” adds “prisoners,” which βασανισταῖς does not state, and is less direct than the Greek term for those who torment/torture. “Ihe niile o ji” is understandable but is slightly elliptical for the full owed amount.
  naturalness: “Nna ya ukwu” is an established and suitable Standard Igbo expression for a servant’s master in this parabolic setting. “Ndị na-ata mmadụ ahụhụ” is more idiomatic and avoids implying that the referents are specifically prison personnel or that their victims are prisoners. “Ọ ga-akwụghachi ihe niile o ji ụgwọ” is clear, modern, and natural.
  terminology: Retain “nna ya ukwu” for κύριος in this parable, with “Onyenwe ya” as the stated alternative. Render βασανισταῖς with “ndị na-ata mmadụ ahụhụ” to preserve its severe sense without adding a custodial role. “Ihe niile o ji ụgwọ” appropriately expresses πᾶν τὸ ὀφειλόμενον in context.
  issues:
  - severity: medium
    issue: The main text adds “ndị mkpọrọ” (“prisoners”) in rendering βασανισταῖς.
    rationale: The Greek identifies tormentors/torturers, not specifically people who torture prisoners. This added object narrows and slightly reframes the referent.
  - severity: low
    issue: “Ihe niile o ji” is overly elliptical for the complete owed amount.
    rationale: Although intelligible in context, adding “ụgwọ” makes the financial obligation explicit and gives a more natural rendering of what is owed, without imposing additional interpretation.
  revised_text: Nna ya ukwu[a] were iwe, nyefee ya n’aka ndị na-ata mmadụ ahụhụ[b] ruo mgbe ọ ga-akwụghachi ihe niile o ji ụgwọ.
  revised_footnotes:
