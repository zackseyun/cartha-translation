revisions:
- from: Nna ya ukwu[a] were iwe, nyefee ya n’aka ndị na-ata ndị mkpọrọ ahụhụ[b] ruo mgbe ọ ga-akwụcha ihe niile o ji.
  to: Nna ya ukwu[a] were iwe, nyefee ya n’aka ndị na-ata mmadụ ahụhụ[b] ruo mgbe ọ ga-akwụghachi ihe niile o ji ụgwọ.
  rationale: The revision removes the unsupported specification “prisoners,” preserves the punitive severity of βασανισταῖς, and clarifies that the entire debt is to be repaid. It otherwise keeps the draft’s appropriate parabolic register, contextual rendering of κύριος, and prospective force of the temporal clause.
