id: MAT.18.22
reference: Matthew 18:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: ig
  text: Jizọs sịrị ya, “Anaghị m asị gị ruo ugboro asaa, kama ruo ugboro iri asaa na asaa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ugboro iri asaa e jiri ugboro asaa mụbaa.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a n’akụkọ ihe mere eme, iji “sịrị” bụ ụzọ Igbo kacha dị ndụ ma doo anya isi kọọ okwu e kwuru n’oge gara aga.
- source_word: αὐτῷ
  choice: ya
  rationale: E debere nnọchiaha onye nke atọ dị ka ọ dị na Grik, kama iji aha Pita dochie ya.
- source_word: Οὐ λέγω σοι
  choice: Anaghị m asị gị
  rationale: Nke a na-egosipụta nkwupụta Jizọs n’ụzọ doro anya ma na-ejigide ngwaa bụ “ịsị.”
- source_word: ἕως ἑπτάκις
  choice: ruo naanị ugboro asaa
  rationale: “Ruo” na-egosi oke ọnụọgụ ahụ; “naanị” na-eme ka ntụnyere dị n’etiti ugboro asaa na ọnụọgụ ka ukwuu pụta nke ọma n’Igbo.
- source_word: ἀλλὰ
  choice: kama
  rationale: “Kama” na-egosi ngbanwe siri ike n’etiti ọnụọgụ abụọ ahụ.
- source_word: ἑβδομηκοντάκις ἑπτά
  choice: ugboro iri asaa na asaa
  rationale: Nkebiokwu Grik a nwere ike ịpụta ugboro iri asaa na asaa, ma ọ bụ ugboro iri asaa e jiri ugboro asaa mụbaa. E tinyere nghọta nke mbụ n’ahịrịokwu, ma debe nke ọzọ n’okpuru peeji.
theological_decisions:
- issue: Ọnụọgụ na-edochaghị anya n’ozizi Jizọs banyere mgbaghara
  choice: ugboro iri asaa na asaa
  alternative: ugboro iri asaa e jiri ugboro asaa mụbaa
  rationale: Usoro okwu Grik ἑβδομηκοντάκις ἑπτά nwere nghọta abụọ a. A họọrọ “ugboro iri asaa na asaa” dị ka nghọta kwụ ọtọ, ma e debere nke ọzọ n’okpuru peeji ka a ghara ikpuchi mgbagwoju anya dị n’ederede mbụ. E tinyeghị nkọwa na-eme ọnụọgụ ahụ iwu oke ikpeazụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe ma dị ùgwù. “Jizọs sịrị ya” bụ usoro akụkọ a na-anụkarị n’Igbo; ọ na-ezere usoro oge ugbu a nke ga-ada ka ihe na-ekwekọghị n’okwu nkịtị. Akara [a] dị kpọmkwem n’ebe nkebiokwu ọnụọgụ nwere nghọta abụọ nọ.
