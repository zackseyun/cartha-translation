review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the contrast, unwillingness, forceful imprisonment, temporal limit, and the object owed. However, “ọ pụrụ laa” ordinarily means “he may/can go away,” not the completed aorist action “he went away.”
  naturalness: Replacing “ọ pụrụ laa” with “ọ gara” produces clear, natural Standard Igbo and preserves the narrative sequence. “Ọ ga-akwụ ihe o ji” is idiomatic in this debt context.
  terminology: “Ụlọ mkpọrọ,” “tụba,” and “ihe o ji” are suitable modern Standard Igbo renderings. “Tụba” appropriately retains the force of βάλλω without adding an unwarranted detail.
  issues:
  - severity: medium
    issue: The phrase “ọ pụrụ laa” is not a past narration of departure.
    rationale: 'It normally conveys ability or permission (“he may/can go away”), whereas ἀπελθών is an aorist participle describing a completed preceding action: “having gone away/he went away.”'
  revised_text: Ma ọ chọghị[a]; kama, ọ gara tụba ya n’ụlọ mkpọrọ[b] ruo mgbe ọ ga-akwụ ihe o ji[c].
