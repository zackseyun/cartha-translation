  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: ig
  text: Ma ọ chọghị[a]; kama, ọ gara tụba ya n’ụlọ mkpọrọ[b] ruo mgbe ọ ga-akwụ ihe o ji[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ jụrụ”; okwu Grik ahụ pụtara n’ụzọ nkịtị, “ọ chọghị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “tinye ya n’ụlọ mkpọrọ”; ngwaa Grik ahụ siri ike karị, ọ pụtara n’ụzọ nkịtị “tụba ya n’ụlọ mkpọrọ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ego ole o ji” ma ọ bụ “ụgwọ o ji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ma ọ
  rationale: ‘Ma’ na-egosi ọdịiche δέ wetara, ebe ‘ọ’ na-ezo aka n’ohu ahụ e kwuru okwu ya tupu amaokwu a.
- source_word: οὐκ ἤθελεν
  choice: ọ chọghị
  rationale: Nke a na-edobe echiche nke θέλω banyere ọchịchọ ma ọ bụ ịdị njikere, n’etinyeghị ozugbo echiche siri ike nke ‘ọ jụrụ kpamkpam.’
- source_word: ἀλλὰ
  choice: kama
  rationale: ‘Kama’ na-egosi nnukwu ọdịiche dị n’etiti arịrịọ e rịọrọ ya na ihe o mere.
- source_word: ἀπελθὼν
  choice: ọ pụrụ laa
  rationale: A sụgharịrị participle a n’ụdị ngwaa zuru ezu nke na-ada nke ọma n’Igbo ma na-egosi usoro omume ahụ.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: tụba ya n’ụlọ mkpọrọ
  rationale: ‘Tụba’ na-echekwa ike na obi ọjọọ dị na βάλλω karịa okwu dị nro dịka ‘tinye.’
- source_word: ἕως οὗ
  choice: ruo mgbe
  rationale: Nke a na-egosi oke oge mkpọrọ ahụ n’ụzọ doro anya ma bụrụ Igbo ebumpụta ụwa.
- source_word: ἀποδῷ
  choice: ọ ga-akwụghachi
  rationale: ‘Ga-akwụghachi’ na-egosi omume a tụrụ anya na ọ ga-emecha n’ọdịnihu n’okpuru ‘ruo mgbe.’
- source_word: τὸ ὀφειλόμενον
  choice: ihe o ji
  rationale: Nke a na-egosipụta participle ahụ e ji dịka aha—‘ihe e ji’—n’ụzọ dị nkenke ma bụrụ nke a na-aghọta nke ọma n’Igbo.
