- from: N’ihi nke a, e ji alaeze eluigwe tụnyere[a] otu nwoke bụ́ eze, onye chọrọ ka ya na ndị ohu[b] ya dozie ihe ndekọ ego ha.
  to: N’ihi nke a, e ji alaeze eluigwe tụnyere otu nwoke bụ́ eze, onye chọrọ ka ya na ndị ohu ya dozie akaụntụ ha.
  rationale: The revision changes only the accounting idiom, from financial records to accounts being settled, and clarifies the lexical-alternative footnote. It retains the source’s causal connection, passive comparison, royal setting, and the bonded-status sense of δοῦλοι.
  reviewer_model: gpt-5.6-terra
