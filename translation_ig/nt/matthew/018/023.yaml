id: MAT.18.23
reference: Matthew 18:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his servants[a][b].
translation:
  language: ig
  text: N’ihi nke a, e ji alaeze eluigwe tụnyere otu nwoke bụ́ eze, onye chọrọ ka ya na ndị ohu ya dozie akaụntụ ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi njikọ nke ihe kpatara ya na nkuzi Jizọs kwuru tupu ilu a; ọ bụkwa okwu Igbo doro anya ma dị ndụ.
- source_word: ὡμοιώθη
  choice: e ji ... tụnyere
  rationale: Nke a na-edobe olu nnara nke ngwaa Grik ahụ, ‘e mere ka o yie’ ma ọ bụ ‘e jiri ya tụnyere,’ n’Igbo nkịtị.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: alaeze eluigwe
  rationale: Nke a bụ ụzọ Igbo a na-ahụkarị isi kwuo okwu Matiu banyere ọchịchị nke eluigwe, n’enweghị ịgbanwe ya ka ọ bụrụ nkọwa sara mbara.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: otu nwoke bụ́ eze
  rationale: Ọ na-egosipụta ma ἀνθρώπῳ (‘nwoke/mmadụ’) ma βασιλεῖ (‘eze’), ebe nke abụọ na-akọwa onye ahụ nke mbụ kwuru banyere ya.
- source_word: ἠθέλησεν
  choice: chọrọ
  rationale: Ọ na-egosi ọchịchọ ma ọ bụ ebumnuche eze ahụ n’asụsụ Igbo dị mfe ma kwekọọ na akụkọ.
- source_word: συνᾶραι λόγον
  choice: ka ya na ... dozie ihe ndekọ ego ha
  rationale: Akpaokwu Grik a bụ okwu gbasara ịgụkọ na idozi ụgwọ ma ọ bụ akaụntụ; nsụgharị a na-eme ka ọnọdụ akụ na ụba na ịza ajụjụ doo anya.
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: ya na ndị ohu ya
  rationale: ‘Ndị ohu’ na-egosi ndị nọ n’okpuru ikike eze ma kekọta ha n’ọrụ ya; ihe odide ala peeji na-echekwa ‘ndị na-ejere ya ozi’ dịka ụzọ ọzọ.
theological_decisions:
- issue: Nsụgharị δοῦλοι n’ọnọdụ ilu banyere eze na ego
  choice: ndị ohu
  alternative: ndị na-ejere ya ozi
  rationale: Ike eze nwere n’ahụ ha na idozi ụgwọ ha na-eme ka ọnọdụ ha nke ịbụ ndị nọ n’okpuru ya pụta ìhè. Ma ebe δοῦλος nwekwara ike ịpụta onye na-eje ozi n’ụfọdụ ọnọdụ, e debere nke ahụ n’ihe odide ala peeji.
- issue: Olu nnara dị na ὡμοιώθη
  choice: e ji alaeze eluigwe tụnyere
  alternative: alaeze eluigwe dị ka
  rationale: Nhọrọ a na-echekwa echiche Grik nke ‘e jiri ya tụnyere’ kama ime ka ọ bụrụ naanị nkwupụta yiri ihe ọzọ; ọ naghị akọwa onye mere ntụnyere ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta dee ya. E debere usoro ntụnyere nke Grik, ma kọwaa akpaokwu gbasara idozi akaụntụ n’ụzọ onye Igbo nkịtị ga-aghọta.
