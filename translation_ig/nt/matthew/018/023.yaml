review_pass:
  verdict: revise
  source_fidelity: The opening causal connector, the passive comparison, the royal figure, and ‘ndị ohu ya’ accurately represent the Greek. However, ‘dozie ihe ndekọ ego ha’ more naturally means to correct or arrange their financial records; συνᾶραι λόγον is the idiom of settling/reckoning accounts with them.
  naturalness: The verse is otherwise clear Standard Igbo. ‘Dozie akaụntụ ha’ is a more idiomatic modern expression for the financial reckoning intended by the Greek.
  terminology: ‘Alaeze eluigwe’ appropriately preserves Matthew’s expression, and ‘ndị ohu’ accurately conveys δοῦλοι in this royal-economic parable. The passive wording ‘e ji ... tụnyere’ is suitable and does not identify an unstated comparer.
  issues:
  - severity: medium
    issue: ‘ihe ndekọ ego ha’ is not the precise sense of συνᾶραι λόγον.
    rationale: The phrase can denote financial records, whereas the source describes the king’s act of calling for a settlement/reckoning of accounts. Replacing it with ‘akaụntụ ha’ preserves the economic and judicial force without adding detail.
  - severity: low
    issue: Footnote a’s standalone ‘e mere ka o yie’ has an unclear pronoun.
    rationale: The alternative should name ‘alaeze eluigwe’ so that the note is intelligible on its own and accurately reflects the passive comparison.
  revised_text: N’ihi nke a, e ji alaeze eluigwe tụnyere otu nwoke bụ́ eze, onye chọrọ ka ya na ndị ohu ya dozie akaụntụ ha.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “e mere ka alaeze eluigwe yie eze a.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ndị na-ejere ya ozi.” Okwu Grik bụ δοῦλοι, nke nwere ike ịpụta ndị ohu ma ọ bụ ndị na-eje ozi, ma ebe a ọ na-emesi ọnọdụ ha n’okpuru ikike eze ahụ ike.
    reason: alternative_reading
  revision_rationale: The revision changes only the accounting idiom, from financial records to accounts being settled, and clarifies the lexical-alternative footnote. It retains the source’s causal connection, passive comparison, royal setting, and the bonded-status sense of δοῦλοι.
