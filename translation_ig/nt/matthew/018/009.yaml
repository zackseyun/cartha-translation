revisions:
- from: Ọ bụrụkwa na anya gị na-eme ka ị sụọ ngọngọ[a], ghụpụ ya, tụfuo ya pụọ n’ebe ị nọ. Ọ kaara gị mma iji otu anya banye ná ndụ karịa inwe anya abụọ ma a tụba gị na Gehena ọkụ[b].
  to: Ọ bụrụkwa na anya gị na-eme ka ị sụọ ngọngọ[a], ghụpụ ya, tụfuo ya pụọ n’ahụ gị. Ọ kaara gị mma ị bụrụ onye nwere otu anya mgbe ị na-abanye ná ndụ, karịa inwe anya abụọ ma a tụba gị na Gehena nke ọkụ[b].
  rationale: The revision retains the source text’s severe imagery and its ambiguity in σκανδαλίζω, while making the one-eyed condition and the ‘Gehenna of fire’ construction explicit in natural Standard Igbo. It neither adds ‘eternal’ to ndụ nor substitutes the broader term ‘hel’ for Gehena in the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the conditional warning, the stumbling metaphor, the forceful removal command, entry into life, and the passive outcome in Gehenna. The final comparison is clearer and closer to μονόφθαλμον when it explicitly states ‘being one-eyed,’ and τοῦ πυρός is most directly represented by ‘Gehena nke ọkụ.’
  naturalness: The Igbo is generally clear and appropriately formal. Recasting ‘iji otu anya banye’ as ‘ị bụrụ onye nwere otu anya’ avoids suggesting that one enters by means of an eye and expresses the Greek adjectival image naturally. ‘Tụfuo ya pụọ n’ahụ gị’ is a more idiomatic rendering of decisive separation from oneself.
  terminology: ‘Gehena’ appropriately preserves γέεννα, and ‘ndụ’ correctly avoids adding ‘eternal.’ The lexical note for σκανδαλίζω remains suitable. The footnote explains the traditional alternative without replacing the source-specific term in the main text.
  issues:
  - severity: medium
    issue: ‘iji otu anya banye ná ndụ’ can imply entering by using one eye.
    rationale: μονόφθαλμον describes the person's condition (‘one-eyed’), rather than the instrument by which the person enters. An explicit predicate better preserves the image.
  - severity: low
    issue: ‘Gehena ọkụ’ is compressed and can be read less transparently than the genitive construction.
    rationale: ‘Gehena nke ọkụ’ directly conveys γέενναν τοῦ πυρός (‘the Gehenna of fire’) in standard Igbo.
  - severity: low
    issue: ‘tụfuo ya pụọ n’ebe ị nọ’ is somewhat spatially awkward.
    rationale: The Greek means to cast it away from oneself; ‘pụọ n’ahụ gị’ is idiomatic and keeps the sense of severing/removal.
  revised_text: Ọ bụrụkwa na anya gị na-eme ka ị sụọ ngọngọ[a], ghụpụ ya, tụfuo ya pụọ n’ahụ gị. Ọ kaara gị mma ị bụrụ onye nwere otu anya mgbe ị na-abanye ná ndụ, karịa inwe anya abụọ ma a tụba gị na Gehena nke ọkụ[b].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “na-eme ka i mee mmehie.” Ngwaa Grik ahụ nwere ike ịpụta ime ka mmadụ sụọ ngọngọ, daa, ma ọ bụ mee mmehie.
    reason: lexical_alternative
  - marker: b
    text: “Gehena” na-ezo aka n’ebe ikpe ikpeazụ; a na-asụgharịkarị ya “hel.”
    reason: alternative_reading
  revision_rationale: The revision retains the source text’s severe imagery and its ambiguity in σκανδαλίζω, while making the one-eyed condition and the ‘Gehenna of fire’ construction explicit in natural Standard Igbo. It neither adds ‘eternal’ to ndụ nor substitutes the broader term ‘hel’ for Gehena in the main text.
