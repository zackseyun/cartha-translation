id: MAT.18.9
reference: Matthew 18:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: ig
  text: Ọ bụrụkwa na anya gị na-eme ka ị sụọ ngọngọ[a], ghụpụ ya, tụfuo ya pụọ n’ahụ gị. Ọ kaara gị mma ị bụrụ onye nwere otu anya mgbe ị na-abanye ná ndụ, karịa inwe anya abụọ ma a tụba gị na Gehena nke ọkụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-eme ka i mee mmehie.” Ngwaa Grik ahụ nwere ike ịpụta ime ka mmadụ sụọ ngọngọ, daa, ma ọ bụ mee mmehie.
    reason: lexical_alternative
  - marker: b
    text: “Gehena” na-ezo aka n’ebe ikpe ikpeazụ; a na-asụgharịkarị ya “hel.”
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: na-eme ka ị sụọ ngọngọ
  rationale: Nke a na-echekwa ihe atụ Grik nke ime ka mmadụ sụọ ngọngọ ma ọ bụ daa, n’ebughị ụzọ kpachie ihe ọ pụtara nanị n’ime mmehie.
- source_word: ἔξελε
  choice: ghụpụ ya
  rationale: Iwu a siri ike ma na-egosi iwepụ anya ngwa ngwa n’ụzọ na-egbu mgbu; “ghụpụ” na-echekwa ịdị ike nke ihe atụ ahụ karịa “wepụ.”
- source_word: βάλε ἀπὸ σοῦ
  choice: tụfuo ya pụọ n’ebe ị nọ
  rationale: Nkebiokwu a na-egosi ịtụfu ihe ahụ ma kewapụ ya kpamkpam n’ebe onye ahụ nọ.
- source_word: καλόν σοί ἐστιν
  choice: Ọ kaara gị mma
  rationale: N’usoro ntụnyere a, καλόν na-egosi ihe ka mma ma ọ bụ ihe a ga-ahọrọ karịa nke ọzọ.
- source_word: μονόφθαλμον
  choice: iji otu anya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa eke isi kwuo ‘onye nwere otu anya,’ ma na-echekwa onyinyo anụ ahụ dị n’amaokwu ahụ.
- source_word: εἰς τὴν ζωὴν
  choice: banye ná ndụ
  rationale: A hapụrụ ya dị ka “ndụ” n’ihi na Grik etinyeghị okwu pụtara “ebighị ebi,” ọ bụ ezie na ihe gbara ya gburugburu nwere nghọta gbasara ndụ nke oge ikpeazụ.
- source_word: βληθῆναι
  choice: a tụba gị
  rationale: Nke a na-echekwa olu nnara nke ngwaa Grik ma na-ada nke ọma n’Igbo ugbu a.
- source_word: γέενναν
  choice: Gehena
  rationale: Idebe aha pụrụ iche a na-echekwa njikọ akụkọ ihe mere eme na nke ikpe ikpeazụ nke okwu Grik ahụ, kama ime ka ọ bụrụ naanị okwu nkà mmụta okpukpe sara mbara.
- source_word: τοῦ πυρός
  choice: Gehena ọkụ
  rationale: Nhazi aha Igbo a na-echekwa nkọwa Grik bụ ‘Gehena nke ọkụ’ n’ụzọ dị mkpirikpi ma bụrụkwa eke.
theological_decisions:
- issue: Nsụgharị γέεννα
  choice: Gehena
  alternative: hel
  rationale: Ihe odide Grik ji aha a kapịrị ọnụ, ọ bụghị okwu izugbe maka ebe ndị nwụrụ anwụ ma ọ bụ ahụhụ ikpeazụ; ya mere, idebe “Gehena” na-echekwa kpọmkwem okwu isi mmalite ahụ.
- issue: Nsụgharị εἰς τὴν ζωὴν
  choice: banye ná ndụ
  alternative: banye ná ndụ ebighị ebi
  rationale: Ọ bụ ezie na “ndụ” nwere ike na-ezo aka ná ndụ nke oge ikpeazụ, ihe odide Grik ekwughị “ebighị ebi”; ya mere, a naghị etinye nkọwa ahụ n’ahịrị isi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke kwụ ọtọ ma dị ùgwù. A na-echekwa ihe atụ siri ike nke ịghụpụ anya, ọdịiche dị n’etiti ‘ndụ’ na ‘Gehena ọkụ,’ nakwa ihe okwu σκανδαλίζω nwere ike ịpụta, na-enweghị ịgbakwunye nkọwa otu ụka.
