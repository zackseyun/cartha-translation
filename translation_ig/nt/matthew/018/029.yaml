revisions:
- from: Ya mere, ohu ibe ya ahụ[a] dara n’ala, na-arịọ ya arịrịọ, sị, “Nwee ndidi n’ebe m nọ, m ga-akwụghachi gị.”
  to: Ya mere, ohu ibe ya dara n’ala, na-arịọ ya arịrịọ, sị, “Nwee ndidi n’ebe m nọ, m ga-akwụghachi gị.”
  rationale: The revision removes an unsupported demonstrative from the main text and corrects the wording of the alternative-reading footnote. It otherwise preserves the draft’s faithful rendering of the Greek and its natural Standard Igbo register.
