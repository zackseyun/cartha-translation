  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow servant fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: ig
  text: Ya mere, ohu ibe ya dara n’ala, na-arịọ ya arịrịọ, sị, “Nwee ndidi n’ebe m nọ, m ga-akwụghachi gị.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνδουλος
  choice: ohu ibe ya
  rationale: Okwu a pụtara ohu ya na onye ọzọ nwere otu nna ukwu. “Ohu ibe ya” na-egosipụta ma mmekọ ibe ha ma ọnọdụ ha n’okpuru nna ukwu.
- source_word: παρεκάλει
  choice: na-arịọ ya arịrịọ
  rationale: Ọdịdị imperfect na-egosi arịrịọ siri ike nke na-aga n’ihu; ntụgharị a bụ Igbo doro anya ma kwekọọ n’ọnọdụ onye ji ụgwọ na-arịọ ebere.
- source_word: Μακροθύμησον
  choice: Nwee ndidi
  rationale: Nke a na-enye arịrịọ ka onye ahụ tachie obi ma nye ya oge, n’asụsụ Igbo dị ugbu a ma dị mfe nghọta.
- source_word: ἐπ’ ἐμοί
  choice: n’ebe m nọ
  rationale: Nke a bụ ụzọ Igbo si egosipụta onye a na-arịọ ka e nwee ndidi n’ebe ọ nọ.
- source_word: ἀποδώσω
  choice: m ga-akwụghachi gị
  rationale: N’ọnọdụ ụgwọ, “ịkwụghachi” na-egosi nke ọma ịkwụghachi ihe e ji mmadụ.
- source_word: πεσὼν
  choice: dara n’ala
  rationale: Ọ na-echekwa omume ahụ mmadụ mere n’ahụ́ iji gosi iweda onwe ya ala mgbe ọ na-arịọ arịrịọ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta omume a na ihe mere tupu ya, ma na-edobe usoro na nkwubi okwu dị n’akụkọ ahụ.
theological_decisions:
- issue: Otú e si atụgharị asụsụ δοῦλος dị na σύνδουλος
  choice: Jiri “ohu ibe ya” n’ahịrịokwu bụ isi.
  alternative: onye ozi ibe ya; onye ha na ya na-ejere otu nna ukwu ozi
  rationale: Ilu a metụtara eze, ụgwọ, na ndị nọ n’okpuru ikike nna ukwu. “Ohu ibe ya” na-echekwa ọnọdụ njikọ na enweghị nnwere onwe nke okwu Grik ahụ n’enweghị itinye nkọwa otu ụka.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe mmegharị ahụ nke iweda onwe ya ala, ịdị ike na ịdịgide nke arịrịọ ahụ, na nkwa ịkwụghachi ụgwọ, n’enweghị idozi esemokwu ma ọ bụ itinye nkọwa okpukpe ọzọ.
