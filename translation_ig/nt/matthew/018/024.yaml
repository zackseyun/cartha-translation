  to: Mgbe ọ malitere idozi ihe ndekọ ego, a kpọtara otu onye ji ya ụgwọ ruru puku talent iri n’ihu ya[a].
  rationale: The revision preserves every source element while making the passive presentation and the debtor-creditor relationship clearer in natural Standard Igbo. The footnote is narrowed to the culturally relevant scale of the amount and avoids an unsupported claim about whether repayment was possible.
