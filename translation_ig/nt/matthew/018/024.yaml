  text: ἀρξαμένου δὲ αὐτοῦ συναίρειν ⸀προσηνέχθη ⸂αὐτῷ εἷς⸃ ὀφειλέτης μυρίων ταλάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: ig
  text: Mgbe ọ malitere idozi ihe ndekọ ego, a kpọtara otu onye ji ya ụgwọ ruru puku talent iri n’ihu ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talent bụ nnukwu otu ego n’oge ahụ; n’ilu a, “puku talent iri” na-anọchi anya ụgwọ buru oke ibu nke na o siri ike iche n’echiche.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: Mgbe ọ malitere
  rationale: Nke a na-egosi ọnọdụ oge nke malitere ihe omume bụ isi; ‘Mgbe ọ malitere’ bụ Igbo doro anya ma ghara ịkọwa usoro oge karịa ihe Grik kwuru.
- source_word: συναίρειν
  choice: idozi ihe ndekọ ego
  rationale: N'ọnọdụ ego a, okwu ahụ pụtara ịtụle ma dozie ụgwọ ndị dị n'akwụkwọ; nsụgharị a bụ nke oge a ma na-echekwa echiche nke ịza ajụjụ banyere ego.
- source_word: προσηνέχθη
  choice: a kpọtara ya
  rationale: Ngwaa a dị n'ụdị nnara ma na-egosi na ndị ọzọ kpọtara onye ji ụgwọ ahụ bịakwute ya.
- source_word: αὐτῷ
  choice: ya
  rationale: ‘Ya’ na-egosi onye a kpọtaara onye ji ụgwọ ahụ, n'ụzọ dị mkpirikpi ma bụrụkwa Igbo nkịtị.
- source_word: εἷς ὀφειλέτης
  choice: otu onye ji ya
  rationale: ‘Otu’ na-echekwa εἷς nke dị kpọmkwem na Grik, ebe ‘onye ji ya’ na-akọwa onye ji ụgwọ n'Igbo eke.
- source_word: μυρίων ταλάντων
  choice: puku talent iri
  rationale: Nke a na-echekwa ọnụ ọgụgụ puku iri na aha ego/ibu akụkọ ihe mere eme bụ ‘talent,’ kama ịgbanwe ya ka ọ bụrụ ego nke oge a.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. A hapụrụ ‘talent’ dị ka otu ego akụkọ ihe mere eme, tinyekwa nkọwa n'ala peeji.
