review_pass:
  verdict: revise
  source_fidelity: 'The principal sense is retained: causing a believing ‘little one’ to stumble, the donkey-operated millstone, the neck, and submersion in the open sea. However, the final verb in the draft, “mikpuokwa ya,” is an active coordinated form and can leave the agent and construction awkwardly expressed, whereas καταποντισθῇ is passive. Recasting it as “ka e mikpuo ya” more accurately preserves the Greek passive force.'
  naturalness: 'The verse is generally clear Standard Igbo. Moving the millstone note anchor directly after the millstone phrase improves its referential clarity. The revised passive coordination is more idiomatic and structurally balanced: “ka e kegide …, ka e mikpuo ya ….”'
  terminology: “ndị nta ndị a,” “kwere na m,” “sụọ ngọngọ,” “nkume igwe nri nke ịnyịnya ibu na-atụgharị,” and “oké osimiri sara mbara” are suitable, appropriately broad renderings. The wording does not artificially restrict ‘little ones’ to children or narrow stumbling to a single theological outcome.
  issues:
  - severity: medium
    issue: The clause “mikpuokwa ya n’oké osimiri” does not clearly retain the passive form of καταποντισθῇ.
    rationale: The Greek describes the person as being drowned/sunk, coordinated with the millstone being hung. “Ka e mikpuo ya” gives an indefinite-agent passive construction in natural Igbo and avoids an awkward active coordination.
  - severity: low
    issue: Footnote marker [b] is placed after “n’olu ya” rather than at the millstone expression it explains.
    rationale: The cultural note concerns μύλος ὀνικός, not the neck. Relocating the anchor makes the note’s scope unambiguous.
