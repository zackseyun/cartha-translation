id: MAT.18.6
reference: Matthew 18:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: ig
  text: Ma onye ọ bụla nke ga-eme ka otu n’ime ndị nta ndị a kwere na m sụọ ngọngọ[a], ọ ga-akara ya mma ka e kegide nkume igwe nri nke ịnyịnya ibu na-atụgharị[b] n’olu ya, ka e mikpuo ya n’oké osimiri sara mbara[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mee ka otu n’ime ndị nta ndị a kwere na m mehie.” Ngwaa Grik a nwere ike ịpụta ime ka mmadụ sụọ ngọngọ, mehie, ma ọ bụ daa n’okwukwe.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “nkume igwe nri nke ịnyịnya ibu”; ya bụ, nnukwu nkume igwe nri ịnyịnya ibu na-atụgharị.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “n’ime omimi nke osimiri.” Okwu Grik ahụ na-ezo kpọmkwem n’oké mmiri sara mbara dị anya site n’ikpere mmiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ (σκανδαλίζω)
  choice: mee ka ... sụọ ngọngọ
  rationale: Nke a na-echekwa ihe atụ Grik nke ime ka mmadụ sụọ ngọngọ, ma na-ahapụkwa obosara echiche ya nke gụnyere ime ka onye ọzọ mehie, daa n’okwukwe, ma ọ bụ laa n’iyi n’ụzọ ime mmụọ.
- source_word: μικρῶν τούτων
  choice: ndị nta ndị a
  rationale: Nkebi a anaghị amanye ka a ghọta ya naanị dị ka ụmụaka; ọ nwekwara ike izo aka n’ebe ndị dị umeala n’obi ma ọ bụ ndị a na-ele anya dị ka ndị na-enweghị nnukwu ọnọdụ nọ.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: kwere na m
  rationale: Nke a bụ ntụgharị Igbo doro anya ma dị nkenke nke ahịrịokwu na-akọwa ndị nta ahụ dị ka ndị nwere okwukwe na Jizọs.
- source_word: συμφέρει αὐτῷ
  choice: ọ ga-akara ya mma
  rationale: N’ọnọdụ ịdọ aka ná ntị a, okwu a na-egosi na ihe ahụ gaara abụrụ ya ihe ka mma, ọ bụghị na ọ bụ ihe ọma n’onwe ya.
- source_word: μύλος ὀνικός
  choice: nkume igwe nri nke ịnyịnya ibu na-atụgharị
  rationale: Nke a na-akọwa kpọmkwem nnukwu nkume igwe nri anụmanụ na-atụgharị, dị iche na obere igwe aka, ma na-eme ka ihe oyiyi ahụ doo onye na-agụ Igbo anya.
- source_word: εἰς τὸν τράχηλον αὐτοῦ
  choice: n’olu ya
  rationale: Nke a bụ ụzọ Igbo si ekwu n’ụzọ ebumpụta ụwa na e kegidere ihe n’olu mmadụ.
- source_word: καταποντισθῇ
  choice: mikpuokwa ya
  rationale: Ngwaa a na-egosi ime ka mmadụ mikpuo n’ime mmiri wee nwụọ; ntụgharị a na-edobe ihe omume ahụ n’ụdị onye ọzọ mere ya.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: n’oké osimiri sara mbara
  rationale: πέλαγος na-ezo aka n’oké mmiri dị anya site n’ikpere mmiri; ‘oké osimiri sara mbara’ na-echekwa echiche nke open sea n’ụzọ Igbo dị mma.
theological_decisions:
- issue: Ndị okwu ahụ bụ ‘ndị nta ndị a’ na-ezo aka na ha
  choice: E debere ya n’obosara dị ka ‘ndị nta ndị a kwere na m.’
  alternative: ‘ụmụaka nta ndị a kwere na m’
  rationale: Ọ bụ ezie na nwa dị n’ihu ha n’akụkọ a, mgbakwunye ‘kwere na m’ nwere ike ịgụnye ndị na-eso ụzọ a na-ele anya dị ka ndị nta ma ọ bụ ndị na-adịghị ike. Ya mere, ntụgharị ahụ anaghị ekpebi na ọ bụ naanị ụmụaka ka e kwuru maka ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma doo ndị nkịtị anya. A họọrọ ‘sụọ ngọngọ’ iji chekwaa ihe atụ dị n’asụsụ Grik, ebe nkọwa ala peeji na-egosi obosara ihe ọ pụrụ ịpụta. A kọwara ụdị nkume igwe nri ahụ n’ahịrịokwu n’onwe ya ka ihe oyiyi omenala ahụ doo anya.
