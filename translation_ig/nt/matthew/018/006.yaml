  to: Ma onye ọ bụla nke ga-eme ka otu n’ime ndị nta ndị a kwere na m sụọ ngọngọ[a], ọ ga-akara ya mma ka e kegide nkume igwe nri nke ịnyịnya ibu na-atụgharị[b] n’olu ya, ka e mikpuo ya n’oké osimiri sara mbara[c].
  rationale: The revision makes one source-fidelity correction by representing καταποντισθῇ with an Igbo passive/indefinite-agent construction and places the millstone footnote at its proper lexical anchor. All other wording is retained because it is clear, modern Standard Igbo and preserves the source’s lexical and referential breadth.
