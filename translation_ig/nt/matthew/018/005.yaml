  text: καὶ ὃς ⸀ἐὰν δέξηται ⸂ἓν παιδίον τοιοῦτο⸃ ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: ig
  text: Onye ọ bụla na-anabata otu nwatakịrị dị ka nke a n’aha m na-anabata m.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-anabata nke ọma” ma ọ bụ “na-anabata.” Ngwaa Grik a pụrụ ịpụta “ịnabata,” “ịnabata nke ọma,” ma ọ bụ “ịnakwere.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “otu nwatakịrị dị ka nke a”; asụsụ Grik etinyeghị okwu nkọwa “nta” n’amaokwu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: Onye ọ bụla nke
  rationale: Nkebi a na-egosi onye ọ bụla n’enweghị ịkọwa onye kpọmkwem; ntụgharị a bụ Igbo nkịtị ma na-echekwa nghọta izugbe ahụ.
- source_word: δέξηται / δέχεται
  choice: na-anabata / na-anabata
  rationale: '“Ịnabata” nwere ike ịpụta ịkpọbata, ịnabata nke ọma, ma ọ bụ ịnakwere. Ikwughachi otu ngwaa ahụ na-echekwa njikọ doro anya dị n’asụsụ Grik: onye nabatara nwatakịrị ahụ nabatara Jizọs.'
- source_word: ἓν παιδίον τοιοῦτο
  choice: otu nwatakịrị dị otu a
  rationale: Nke a na-ezo aka n’otu nwatakịrị yiri ụdị nwatakịrị ahụ Jizọs kwuru maka ya. E tinyeghị “nta” n’ahịrị bụ isi n’ihi na μικρόν adịghị n’amaokwu a.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: n’aha m
  rationale: Nke a bụ ụzọ Igbo doro anya ma guzosie ike isi gosi na a na-anabata ya n’ihi njikọ ya na aha, ikike, ma ọ bụ nrubeisi nye Jizọs, n’akọwaghị naanị otu n’ime nghọta ndị ahụ.
- source_word: ἐμὲ
  choice: m
  rationale: Nnọchiaha a na-ezo aka na Jizọs n’onwe ya. Ọnọdụ ya na njedebe ahịrịokwu na-eme ka njikọ ahụ pụta ìhè n’ụzọ ebumpụta ụwa n’Igbo.
theological_decisions:
- issue: Njirimara nnọchiteanya dị n’etiti nwatakịrị ahụ na Jizọs
  choice: Amaokwu ahụ na-ekwu na onye nabatara nwatakịrị dị otu a n’aha Jizọs na-anabata Jizọs n’onwe ya.
  alternative: A pụrụ ime ka okwu ahụ dị nro site n’ịsị na onye ahụ na-asọpụrụ Jizọs naanị site n’ịnabata nwatakịrị ahụ.
  rationale: Ikwughachi ngwaa δέχομαι, ebe ihe a na-anabata gbanwere site na “otu nwatakịrị dị otu a” gaa na “m,” na-egosi njikọ nnọchiteanya siri ike. Tụgharị ahụ echekwala nke a n’etinyeghị echiche sakramenti ma ọ bụ nke ụka nke amaokwu ahụ ekwughị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọpụrụ ma dị mfe nghọta. A họọrọ “nwatakịrị” kama okwu nwere ike ịgbakwunye echiche nke ịdị nta, ma chekwaa nkwughachi “na-anabata” dị n’amaokwu Grik.
