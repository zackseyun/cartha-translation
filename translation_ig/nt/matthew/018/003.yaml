id: MAT.18.3
reference: Matthew 18:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: ig
  text: O wee sị, “N’ezie[a], ana m asị unu, ọ bụrụ na unu echigharịghị[b] ma ghọọ dịka ụmụaka[c], unu agaghị aba ma ọlị[d] n’alaeze eluigwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Amen.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọ bụrụ na e meghị ka unu chigharịa.” Ụdị ngwaa Grik ahụ nwere ike igosi ma “chigharịa” ma “ka e mee ka unu chigharịa.”
    reason: alternative_reading
  - marker: c
    text: N’asụsụ Grik, e nwere ike ịsụgharị ya “dị ka ụmụaka ndị ahụ,” nke nwere ike ime ka a cheta nwata Jizọs mere ka o guzo n’etiti ha.
    reason: lexical_alternative
  - marker: d
    text: Asụsụ Grik ji ngọnarị siri ezigbo ike; ya bụ, “unu agaghị aba mgbe ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: N’ezie
  rationale: Nke a na-egosi mmalite okwu siri ike nke nwere ikike. “N’ezie” na-eme ka ihe Ἀμήν pụtara doo onye Igbo nke oge a anya n’asụsụ na-aga were were.
- source_word: στραφῆτε
  choice: unu atụgharịghị
  rationale: Ụdị ngwaa Grik a nwere ike ịpụta “tụgharịa” ma ọ bụ “ka e mee ka unu tụgharịa.” Nsụgharị a na-egosi mgbanwe ụzọ siri ike, ma ọ naghị ewebata okwu nkà mmụta okpukpe nke na-anọghị kpọmkwem n’amaokwu ahụ.
- source_word: γένησθε
  choice: ghọọ
  rationale: “Ghọọ” na-egosi mgbanwe ọnọdụ ma na-esochi “tụgharịa” n’ụzọ dị mfe ma kwekọọ na njikọ ngwaa abụọ ahụ n’asụsụ Grik.
- source_word: ὡς τὰ παιδία
  choice: dị ka ụmụaka
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu maka ụmụaka dịka otu ìgwè. Ọ na-ahapụ àgwà ụmụaka Jizọs bu n’obi n’enweghị ịkọwa ya dịka ịdị ọcha ma ọ bụ ịdị umeala n’obi.
- source_word: οὐ μὴ εἰσέλθητε
  choice: unu agaghị aba ma ọlị
  rationale: Njikọ οὐ μή na-enye ngọnarị siri ezigbo ike. “Agaghị ... ma ọlị” na-ebuga ike ahụ n’Igbo doro anya.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: alaeze eluigwe
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa ụzọ a maara nke ọma isi sụgharịa akpaokwu Matiu ji eme ihe.
theological_decisions:
- issue: Ihe στραφῆτε pụtara n’okwu gbasara mgbanwe ndụ
  choice: tụgharịa
  alternative: ka e mee ka unu tụgharịa; bụrụ ndị a tọghatara
  rationale: “Tụgharịa” na-echekwa oku a kpọrọ ha ka ha gbanwee ụzọ ha kpamkpam, ma ọ naghị ewebata okwu ụka pụrụ iche ma ọ bụ kpebie onye na-akpata ntụgharị ahụ karịa ka Grik siri kwuo.
- issue: Ihe παιδία na-arụtụ aka na ya
  choice: ụmụaka
  alternative: ụmụaka ndị ahụ; ụmụntakịrị
  rationale: Amaokwu ahụ ji ndị na-eso ụzọ tụnyere ụmụaka, ma ọ kọwaghị kpọmkwem àgwà ụmụaka ọ na-ekwu maka ya. Nsụgharị ahụ na-ahapụ ohere nkọwa a, ebe ihe gbara ya gburugburu nwekwara ike ime ka a cheta nwata Jizọs mere ka o guzo n’etiti ha.
- issue: Ike ngọnarị οὐ μή
  choice: agaghị aba ma ọlị
  alternative: agaghị aba; ha agaghị aba mgbe ọ bụla
  rationale: A ga-echekwa ike ịdọ aka ná ntị ahụ n’enweghị ime ka okwu ahụ ghọọ nkwupụta nkà mmụta okpukpe karịrị ihe ahịrịokwu Grik kwuru.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. “Ana m asị unu” na-echekwa usoro okwu nke nkwupụta nwere ikike; “ma ọlị” na-eme ka ngọnarị siri ike pụta ìhè. E zere okwu ụka pụrụ iche dịka “ntọghata,” ka a ghara imechi nghọta dị iche iche nke ngwaa Grik ahụ.
