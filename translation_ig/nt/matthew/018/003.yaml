revisions:
- from: O wee sị, “N’ezie[a], ana m asị unu, ọ bụrụ na unu atụgharịghị[b] ma ghọọ dị ka ụmụaka[c], unu agaghị aba ma ọlị[d] n’alaeze eluigwe.”
  to: O wee sị, “N’ezie[a], ana m asị unu, ọ bụrụ na unu echigharịghị[b] ma ghọọ dịka ụmụaka[c], unu agaghị aba ma ọlị[d] n’alaeze eluigwe.”
  rationale: The revision is limited to the central verb for turning and its corresponding footnote. 'Echigharịghị' is more natural Standard Igbo in this exhortational context and better avoids the competing everyday senses of 'tụgharị.' The conditional-negative construction, the ambiguity regarding agency, the generic comparison with children, and the emphatic denial of entry are retained.
