id: MAT.18.31
reference: Matthew 18:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow servants saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: ig
  text: Ya mere, mgbe ndị ohu ibe ya[a] hụrụ ihe mere, mwute dị ukwuu juru ha obi. Ha wee bịakwute onyenwe ha[b] ma kọọrọ ya ihe niile mere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị odibo ibe ya.” Okwu Grik bụ σύνδουλοι, nke pụtara “ndị ohu ibe” n'ụzọ nkịtị; ọ na-ezo aka n’ndị ohu nọ n’okpuru otu onyenwe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “nna ha ukwu.” Okwu Grik bụ κύριος, nke nwere ike ịpụta “onyenwe” ma ọ bụ “nna ukwu,” dabere n’ọnọdụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi njikọ na ihe mere tupu nke a, ma nwee ike igosi ihe si na ya pụta ma ọ bụ nzọụkwụ na-esote n’akụkọ ahụ.
- source_word: σύνδουλοι
  choice: ndị ohu ibe ya
  rationale: Okwu a na-ezo aka n’ohu ndị ọzọ ha na ya nọ n’okpuru otu onyenwe. ‘Ndị ohu ibe ya’ na-echekwa ọnọdụ ha nke ịbụ ndị e kere agbụ n’ọrụ, nke dị mkpa n’ilu a.
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: ihe mere / ihe niile mere
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu n’ụzọ ebumpụta ụwa; ‘niile’ n’ebe nke abụọ na-echekwa πάντα, nke na-eme ka akụkọ ha zuru ezu.
- source_word: ἐλυπήθησαν σφόδρα
  choice: o wutere ha nke ukwuu
  rationale: Nke a na-egosi mwute ma ọ bụ obi mgbawa siri ike, ebe ‘nke ukwuu’ na-echekwa ike okwu σφόδρα.
- source_word: ἐλθόντες
  choice: Ha wee bịakwute
  rationale: Ọ na-egosi omume bịara tupu isi ngwaa ahụ ma na-aga n’ihu n’usoro akụkọ; ‘wee’ na-eme ka usoro ahụ doo anya n’Igbo.
- source_word: διεσάφησαν
  choice: kọọrọ ya
  rationale: Ngwaa ahụ pụtara ime ka ihe doo anya site n’ịkọ ya nke ọma. N’ebe a, ‘kọọrọ ya’ bụ Igbo dị mfe ma dabara n’ọnọdụ ahụ, ebe ‘ihe niile’ na-egosi na akụkọ ahụ zuru ezu.
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: onyenwe ha
  rationale: N’ilu a, κύριος na-ezo aka n’onye mmadụ ndị a nọ n’okpuru ya. ‘Onyenwe ha’ na-echekwa echiche nke onye nwere ikike n’ebe ha nọ n’enweghị ime ka ọ bụrụ aha Chineke.
theological_decisions:
- issue: Otú e si sụgharịta okwu sitere n’ezinụlọ δοῦλος n’ọnọdụ mmekọrịta mmadụ n’ilu a
  choice: ndị ohu ibe ya
  alternative: ndị odibo ibe ya
  rationale: σύνδουλοι na-egosi na ha niile nọ n’ọnọdụ ohu n’okpuru otu onyenwe. Ịkpọ ha ‘ndị ohu’ na-echekwa isi okwu ahụ nke ọma karịa ‘ndị odibo,’ nke nwere ike ime ka ọnọdụ agbụ ha ghara ịpụta ìhè.
- issue: Otú e si sụgharịta κύριος mgbe ọ na-ezo aka n’onye mmadụ
  choice: onyenwe ha
  alternative: nna ha ukwu
  rationale: ‘Onyenwe ha’ bụ okwu dị ùgwù ma kwekọọ n’onyinye ikike onye ahụ nwere n’ilu a; ọ naghị ekwu na onye ahụ bụ Chineke, ma ọ bụkwa anaghị ewepụ ohere ilu ahụ nwere ịrụtụ aka n’ihe karịrị onye mmadụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù, dee ya. Usoro ‘o wutere ha nke ukwuu’ na ‘Ha wee bịakwute’ bụ nke a na-aghọta ngwa ngwa n’okwu nkịtị, ebe ‘ndị ohu ibe ya’ na ‘onyenwe ha’ na-echekwa ọnọdụ mmekọrịta dị n’ilu ahụ.
