  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: ig
  text: Mgbe ahụ, Pita bịakwutere ya sị, “Onyenwe anyị, ugboro ole ka nwanne m nwoke[a] ga-emehie megide m, ka m ga-agbaghara ya? Ruo ugboro asaa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwanne m nwoke ma ọ bụ nwaanyị”; okwu Grik ahụ kwuru “nwanne m nwoke” (aha nwoke n'otu ọgụgụ), ma n'ọnọdụ a ọ pụrụ izo aka n'ozuzu ya n'onye na-eso ụzọ ibe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ akara oge na usoro akụkọ; nkebi a na-ejikọta ajụjụ Pita na ihe Jizọs kwuru tupu ya.
- source_word: προσελθὼν αὐτῷ ὁ Πέτρος εἶπεν
  choice: Pita bịakwutere ya sị
  rationale: “Bịakwutere” na-egosi na Pita bịara nso Jizọs, ebe “sị” na-enye okwu εἶπεν n’ụzọ Igbo dị nkenke ma bụrụkwa nke e ji akọ akụkọ.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Aha nkwanye ùgwù a na-echekwa ihe κύριος pụtara mgbe a na-akpọ Jizọs okwu, gụnyere ụda okwukwe okwu ahụ nwere ike ibu.
- source_word: ποσάκις
  choice: ugboro ole
  rationale: Nke a na-ajụ kpọmkwem ọnụ ọgụgụ ugboro, dịka “ugboro asaa” so ya na-egosi.
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: ga-emehie megide m
  rationale: “Ga-emehie” na-echekwa ọdịnihu nke ngwaa Grik, “megide m” na-egosikwa onye mmehie ahụ metụtara.
- source_word: ὁ ἀδελφός μου
  choice: nwanne m nwoke
  rationale: Nke a na-echekwa ụdị nwoke, otu onye, nke okwu Grik ahụ; nkọwa ala peeji na-egosi na n’ọnọdụ a ọ pụkwara ịgụnye onye ọzọ na-eso ụzọ.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: m agbagharakwa ya
  rationale: “Gbaghara” dabara na ἀφίημι n’ihe gbasara mmehie; “-kwa” na-ejikọta omume ịgbaghara na mmehie a na-eme ugboro ugboro.
- source_word: ἕως ἑπτάκις
  choice: Ruo ugboro asaa?
  rationale: “Ruo” na-echekwa oke Pita tụrụ aro, ebe “ugboro asaa” na-enye ọnụ ọgụgụ ahụ kpọmkwem.
theological_decisions:
- issue: Oke ihe ἀδελφός na-ezo aka na ya n’ọnọdụ a
  choice: E tinyere “nwanne m nwoke” n’ahịrịokwu bụ isi.
  alternative: “nwanne m nwoke ma ọ bụ nwaanyị” ma ọ bụ “onye ọzọ na-eso ụzọ”
  rationale: Okwu Grik ahụ bụ aha nwoke, otu onye, ma n’ọnọdụ a o nwere ike ịbụ ụzọ e si ekwu maka onye ọzọ na-eso ụzọ n’ozuzu. A hapụrụ ụdị okwu isi mmalite n’ahịrịokwu bụ isi, kọwaakwa nghọta sara mbara n’ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke kwụ ọtọ ma dị ugwu, mee ntụgharị a. Usoro ajụjụ “ugboro ole ka ...?” bụ nke ndị na-asụ Igbo na-aghọta ngwa ngwa; e chekwara ajụjụ Pita banyere oke ịgbaghara n’enweghị ịkọwa esemokwu dị n’okwu ahụ n’ụzọ ga-emechi ihe isi mmalite hapụrụ oghe.
