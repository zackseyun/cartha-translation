id: MAT.18.27
reference: Matthew 18:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that servant[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: ig
  text: Mgbe ahụ, nna ukwu[a] ohu ahụ, ebe ọ nwere ọmịiko n’ebe ohu ahụ nọ, tọhapụrụ ya ma gbaghara ya ụgwọ ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “nna ukwu” bụ κύριος. N’ebe a, ọ na-ezo aka na nna ukwu mmadụ nọ n’akụkọ ilu ahụ, ọ bụghị kpọmkwem na Chineke.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ego mgbazinye ahụ”; okwu Grik ahụ pụtara kpọmkwem ihe e binyere mmadụ ma ọ bụ ego e nyere ya ka ọ kwụghachi.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: mere ebere n’ahụ ya
  rationale: Nke a na-egosipụta ọmịiko miri emi nna ukwu ahụ nwere n’ebe ohu ahụ nọ, n’asụsụ Igbo dị mfe ma dịkwa ugwu.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N’ebe a, δέ na-akwalite akụkọ gaa n’ihe mere ọzọ; “Mgbe ahụ” na-egosipụta usoro akụkọ ahụ nke ọma.
- source_word: κύριος
  choice: nna ukwu
  rationale: N’akụkọ ilu a, okwu ahụ na-ezo aka n’onye nwere ikike n’ebe ohu ahụ nọ, ọ bụghị aha nsọ a na-akpọ Chineke kpọmkwem.
- source_word: δούλου
  choice: ohu
  rationale: “Ohu” na-edobe ọnọdụ onye nọ n’okpuru ikike na inwe nke onye ọzọ, nke dị mkpa n’akụkọ a.
- source_word: ἀπέλυσεν αὐτόν
  choice: ọ hapụrụ ya ka ọ laa
  rationale: Nke a na-egosipụta na nna ukwu ahụ tọhapụrụ ya n’oge ahụ, na-enweghị ịkọwa karịa ihe okwu Grik kwuru.
- source_word: τὸ δάνειον
  choice: ụgwọ ahụ
  rationale: Ọ bụ ezie na δάνειον pụtara kpọmkwem ihe e binyere ma ọ bụ ego mgbazinye, n’ọnọdụ a ọ bụ ụgwọ onye ahụ ji; “ụgwọ ahụ” bụ okwu Igbo kacha doo anya ma bụrụ nke okike.
- source_word: ἀφῆκεν αὐτῷ
  choice: gbagharakwa ya
  rationale: Ngwaa a nwere ike ịpụta ịgbaghara, ịhapụ, ma ọ bụ ịkagbu ihe e ji ụgwọ. “Gbagharakwa ya ụgwọ ahụ” na-edobe ma echiche mgbaghara ma mkpochapụ ụgwọ ahụ.
theological_decisions:
- issue: Ịghọta κύριος dịka aha Chineke ma ọ bụ dịka nna ukwu mmadụ
  choice: A sụgharịrị ya “nna ukwu,” bụ́ onye nwe ohu ahụ n’akụkọ ilu ahụ.
  alternative: Onyenwe; Onyenwe anyị
  rationale: Onye okwu ahụ na-ezo aka ozugbo bụ nna ukwu mmadụ. Nsụgharị a anaghị amanye ka a mata ya ozugbo dịka Chineke, ma ọ naghị egbochi ihe atụ sara mbara nke akụkọ ilu ahụ.
- issue: Igosipụta ọnọdụ δοῦλος n’ụzọ doro anya
  choice: A sụgharịrị ya “ohu.”
  alternative: odibo
  rationale: “Ohu” na-egosipụta mmekọrịta ikike na inwe dị n’ihe odide Grik nke ọma karịa “odibo,” nke nwere ike ịpụta naanị onye na-eje ozi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu, dee ya. “Nna ukwu,” “ohu,” na “ụgwọ” bụ okwu ndị nkịtị ga-aghọta ngwa ngwa, ebe nhazi ahịrịokwu ahụ ka na-edobe usoro na esemokwu dị n’ihe odide Grik.
