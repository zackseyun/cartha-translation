  to: Mgbe ahụ, nna ukwu[a] ohu ahụ, ebe ọ nwere ọmịiko n’ebe ohu ahụ nọ, tọhapụrụ ya ma gbaghara ya ụgwọ ahụ.[b]
  rationale: The revision moves footnote a to its proper lexical anchor and uses more direct, idiomatic wording for the master's compassion and release. It retains “ụgwọ ahụ” for readable Igbo while preserving the specific loan sense in footnote b.
