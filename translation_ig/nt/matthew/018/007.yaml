    reason: cultural_note
  revision_rationale: The revision retains the source’s woe/necessity/adversative structure and the singular–plural contrast in σκάνδαλον. It replaces a restrictive and lexically inaccurate male-specific rendering of ἄνθρωπος with natural Igbo “onye,” while the note preserves the grammatical observation. It also uses the concise metaphor “ihe ịsụ ngọngọ,” preserving the Greek image and improving register.
