id: MAT.18.7
reference: Matthew 18:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: ig
  text: Ahụhụ ga-adịrị ụwa n’ihi ihe ndị ịsụ ngọngọ[a]! N’ihi na ọ dị mkpa ka ihe ndị ịsụ ngọngọ bịa; ma ahụhụ ga-adịrị onye ahụ[b] ihe ịsụ ngọngọ si n’aka ya abịa!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ihe na-akpasu iwe,” “ihe na-eduga mmadụ ná mmehie,” ma ọ bụ “ọnyà.” Okwu Grik σκάνδαλον/σκάνδαλα na-ezo aka n’ihe na-eme ka mmadụ sụọ ngọngọ, ma ọ bụ n’ihi iwe, ịrata mmadụ, ma ọ bụ ohere ime mmehie.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ahụ dị n’ụdị nwoke, otu onye n’usoro asụsụ, ma n’ebe a ọ na-ezo aka n’ụfọdụ onye ọ bụla ihe dị otú a si n’aka ya abịa.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  choice: Ahụhụ dịrị
  rationale: Na-egosipụta mkpu amụma nke ikpe na ọdachi, ma na-echekwa nkwughachi ya n’akụkụ abụọ ahụ.
- source_word: κόσμῳ
  choice: ụwa
  rationale: Na-ezo aka n’ụwa mmadụ n’ozuzu ya, ọ bụghị naanị ihe e kere eke nke anụ ahụ.
- source_word: ἀπὸ
  choice: n’ihi
  rationale: N’ebe a ọ na-egosi ihe kpatara ahụhụ ahụ.
- source_word: σκάνδαλα / σκάνδαλον
  choice: ihe ndị na-eme ka mmadụ daa / ihe na-eme ka mmadụ daa
  rationale: Na-echekwa oyiyi nke ịsụ ngọngọ ma na-agụnyekwa ihe na-adọta mmadụ ime mmehie ma ọ bụ bụrụ ọnyà; e debere ọdịiche dị n’etiti ọtụtụ na otu.
- source_word: ἀνάγκη
  choice: ọ dị mkpa
  rationale: Na-egosipụta mkpa ma ọ bụ ihe a na-apụghị izere ezere n’ekwughị ihe kpatara mkpa ahụ.
- source_word: γάρ
  choice: N’ihi na
  rationale: Na-ejikọta nkọwa ahụ na mkpu ahụ bu ụzọ.
- source_word: ἐλθεῖν ... ἔρχεται
  choice: bịa ... abịa
  rationale: Na-echekwa nkwughachi ngwaa na oyiyi nke ihe na-abịa dị ka n’asụsụ Grik.
- source_word: πλήν
  choice: ma
  rationale: Na-egosi ntụgharị siri ike site n’ịbịa nke ihe ndị a gaa n’ikpe dịịrị onye ha si n’aka ya abịa.
- source_word: ἀνθρώπῳ
  choice: nwoke ahụ
  rationale: Na-echekwa ụdị nwoke otu onye nke asụsụ Grik, ebe nkọwa ala peeji na-akọwa na ọ na-anọchite onye ọ bụla.
- source_word: δι’ οὗ
  choice: onye ... si n’aka ya
  rationale: Ọ bụ ụzọ Igbo dị ndụ isi gosipụta onye ihe ahụ si n’aka ya abịa.
theological_decisions:
- issue: Ụdị mkpa dị na ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα
  choice: E kwuru na ọ dị mkpa ka ha bịa, ma akọwaghị ma mkpa ahụ sitere n’iwu Chineke, n’ọnọdụ ụwa, ma ọ bụ n’ihe ọzọ.
  alternative: A pụrụ ịsụgharị ya dịka “ha aghaghị ịbịa” ma ọ bụ “o doro anya na ha ga-abịa.”
  rationale: Asụsụ Grik na-ekwupụta mkpa ahụ ma ọ naghị akọwa ntọala ya; nsụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe ahụ ka ọ dị.
- issue: Ike nnọchiteanya nke ἀνθρώπῳ
  choice: E debere “nwoke ahụ” n’ahịrị bụ isi, ma kọwaa na ọ na-anọchite onye ọ bụla.
  alternative: “onye ahụ” ma ọ bụ “onye ọ bụla.”
  rationale: Nke a na-echekwa nwoke otu onye nke isi mmalite ahụ n’etinyeghị echiche na ịdọ aka ná ntị ahụ bụ naanị maka ụmụ nwoke.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ahụhụ dịrị” na-enye οὐαί ụda ikpe na ịdọ aka ná ntị; “ihe na-eme ka mmadụ daa” na-echekwa ihe atụ ahụ ma na-ezere ịkọwa σκάνδαλον naanị dịka iwe ma ọ bụ mmehie.
