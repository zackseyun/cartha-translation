id: MAT.18.12
reference: Matthew 18:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: ig
  text: Gịnị ka unu chere? Ọ bụrụ na otu nwoke nwere otu narị atụrụ, otu n’ime ha wee kpafuo[a], ọ̀ gaghị ahapụ iri itoolu na itoolu n’ugwu[b], gaa chọọ nke kpafuru akpafu[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “wee wagharịa pụọ.” Ngwaa Grik ahụ pụrụ ịpụta isi n’ụzọ, ịkpafu, ma ọ bụ, n’ọnọdụ ụfọdụ, ịbụ onye e duhiere.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ugwu nta.” Okwu Grik ahụ pụrụ izo aka n’ugwu ukwu ma ọ bụ n’ugwu nta.
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ mkpụrụokwu si dị, “nke na-akpafu”; a na-asụgharịkwa ya n’ọdịnala dịka “nke ahụ furu efu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Gịnị ka unu chere?
  rationale: Nke a bụ ajụjụ e ji akpọ ndị na-ege ntị ka ha kwuo echiche ha; ọtụtụ unu dị na ὑμῖν ka e debere.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: Ọ bụrụ na otu nwoke nwere
  rationale: Akpaalaokwu Grik a na-egosi inwe ihe n’ọnọdụ a. ‘Otu nwoke’ na-edebe ụdị nwoke otu mkpụrụokwu ἀνθρώπῳ, ma na-ada nke ọma n’Igbo.
- source_word: ἑκατὸν πρόβατα
  choice: otu narị atụrụ
  rationale: Nke a na-ebufe ọnụ ọgụgụ ahụ na aha anụmanụ ahụ kpọmkwem ma n'ụzọ Igbo nkịtị.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: otu n’ime ha wee kpafuo
  rationale: ‘Kpafuo’ na-edebe echiche nke isi n’ụzọ ma ọ bụ ịwagharị, n’ebughị ụzọ kpebie ma ọ̀ bụ anụ ahụ n’onwe ya mere ya ka è duhiere ya.
- source_word: οὐχὶ ἀφήσει
  choice: ọ̀ gaghị ahapụ
  rationale: Ajụjụ a na-atụ anya azịza ee. ‘Gaghị’ na-egosipụta ọdịnihu ἀφήσει, ebe ‘ahapụ’ adịghị ike dịka ‘gbahapụ kpamkpam.’
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: iri itoolu na itoolu ndị nke ọzọ
  rationale: Ọnụ ọgụgụ ahụ ziri ezi; ‘ndị nke ọzọ’ na-eme ka o doo anya na ihe a na-ekwu bụ atụrụ ndị fọdụrụ.
- source_word: ἐπὶ τὰ ὄρη
  choice: n’ugwu
  rationale: Nke a na-edebe onyonyo ala dị na ὄρη n’Igbo ebumpụta ụwa, na-ahapụghị ohere ‘ugwu nta’ kpamkpam.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: gaa chọọ
  rationale: A sụgharịrị participle na ngwaa isi dịka omume abụọ jikọrọ ọnụ n’Igbo; ‘chọọ’ dabara n’ọrụ ζητέω ebe a.
- source_word: τὸ πλανώμενον
  choice: nke ahụ na-akpafu akpafu
  rationale: Ụdị na-aga n’ihu na-ekwughachi echiche πλανάω ma zere ịgbanwe ya ka ọ bụrụ ‘nke furu efu,’ nke ga-etinye okwu ọzọ na-adịghị n’amaokwu Grik.
theological_decisions:
- issue: Ụdị nwoke nke ἀνθρώπῳ e ji anọchi anya mmadụ
  choice: otu nwoke
  alternative: otu onye
  rationale: Isi mmalite ahụ ji ụdị nwoke otu mkpụrụokwu mee ihe, ya mere e debere ya n’enweghị ịgbanwe ya ka ọ bụrụ okwu na-anọpụ iche n’ihe gbasara okike.
- issue: Ihe πλανάω pụtara n’ihe atụ atụrụ a
  choice: kpafuo / na-akpafu akpafu
  alternative: fuo efu; e duhie ya
  rationale: Nhọrọ a na-edebe ma ihe atụ nke atụrụ na echiche ime mmụọ nke isi n’ụzọ, ma ọ naghị ekpebi na e nwere onye duhiere atụrụ ahụ ma ọ bụ na ọ bụ naanị ‘ihe furu efu.’
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Unu’ na-egosipụta ọtụtụ ndị a na-agwa okwu; usoro ajụjụ ahụ na-edebe atụmanya nke azịza ee dị n’asụsụ Grik.
