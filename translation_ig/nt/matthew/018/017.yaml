id: MAT.18.17
reference: Matthew 18:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: ig
  text: Ma ọ bụrụ na ọ jụ ige ha ntị, kpọọrọ ọgbakọ ahụ okwu ahụ[a]. Ọ bụrụkwa na ọ jụ ige ọgbakọ ahụ ntị, ka ọ dịrị gị ka onye mba ọzọ na onye ọnaụtụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ “ụka” ma ọ bụ “nzukọ” maka “ọgbakọ” (Grik: ekklēsia).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: jụ ige ... ntị
  rationale: N'ọnọdụ ịdọ aka ná ntị a, okwu ahụ pụtara ịjụ ịnara ndụmọdụ ma ọ bụ ịṅa ntị, ọ bụghị nanị na mmadụ anụghị ihe e kwuru.
- source_word: εἰπὸν
  choice: gwa ... okwu ahụ
  rationale: Nke a na-egosi iwu ka a kọọrọ nzukọ ahụ ihe ahụ e kwuru n'amaokwu ndị bu ụzọ, n'Igbo doro anya.
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: nzukọ ahụ
  rationale: “Nzukọ” na-egosi ọgbakọ ndị mmadụ kpọkọtara ọnụ ma zere itinye n'okwu ahụ echiche ụlọ ụka ma ọ bụ usoro otu okpukpe e guzobere mgbe e mesịrị.
- source_word: ἔστω σοι
  choice: ka ọ dịrị gị
  rationale: Nke a na-edobe ụdị iwu nke Grik na dative σοι, ma na-ada nke ọma n'Igbo.
- source_word: ὥσπερ
  choice: ka
  rationale: Ọ na-edobe ntụnyere dị n'okwu Grik n'ụzọ dị nkenke ma kwekọọ n'Igbo.
- source_word: ὁ ἐθνικὸς
  choice: onye mba ọzọ
  rationale: N'ọnọdụ ndị Juu, okwu a na-ezo aka n'onye na-abụghị onye Juu, ya bụ onye nọ n'èzí ọgbakọ ọgbụgba ndụ; “onye mba ọzọ” bụ okwu Igbo nkịtị na-adịghị agbakwụnye nkọwa “onye na-ekpere arụsị.”
- source_word: ὁ τελώνης
  choice: onye ọnaụtụ
  rationale: Nke a bụ aha ọrụ onye na-anakọta ụtụ, ma ọ na-edobe ụdị nnọchite anya otu ụdị mmadụ dị na Grik.
theological_decisions:
- issue: Ntụgharị ἐκκλησία n'ọnọdụ ntụziaka Matiu tupu mbilite n'ọnwụ
  choice: nzukọ ahụ
  alternative: ụka ahụ; ọgbakọ ahụ
  rationale: “Nzukọ” na-edobe isi echiche nke obodo ndị kwere ekwe gbakọtara ọnụ, na-enweghị ibubata echiche otu ụka ma ọ bụ usoro ọchịchị ụka pụrụ iche. A na-edebe nhọrọ ndị ọzọ n'ala peeji.
- issue: Ike ntụnyere onye na-achọghị ichegharị na onye nọ n'èzí
  choice: ka ọ dịrị gị ka onye mba ọzọ na onye ọnaụtụ
  alternative: were ya dị ka onye mba ọzọ na onye ọnaụtụ; were ya dị ka onye nọ n'èzí
  rationale: Ntụgharị a na-edobe ntụnyere na iwu dị n'okwu mbụ, kama ịgbanwe ya ka ọ bụrụ usoro nchụpụ zuru ezu nke amaokwu ahụ n'onwe ya na-akọwaghị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “jụ ige ... ntị” iji gosi nnupụisi e bu n'uche, ebe “ka ọ dịrị gị” na-edobe ike iwu na ntụnyere nke ederede Grik.
