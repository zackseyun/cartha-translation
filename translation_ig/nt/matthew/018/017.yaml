revisions:
- from: Ma ọ bụrụ na ọ jụ ige ha ntị, gwa nzukọ ahụ[a] okwu ahụ. Ọ bụrụkwa na ọ jụkwa ige nzukọ ahụ ntị, ka ọ dịrị gị ka onye mba ọzọ na onye ọnaụtụ.
  to: Ma ọ bụrụ na ọ jụ ige ha ntị, kpọọrọ ọgbakọ ahụ okwu ahụ[a]. Ọ bụrụkwa na ọ jụ ige ọgbakọ ahụ ntị, ka ọ dịrị gị ka onye mba ọzọ na onye ọnaụtụ.
  rationale: The revision replaces “nzukọ” with “ọgbakọ” to represent ἐκκλησία as a gathered community rather than merely a meeting, and it uses the natural reporting expression “kpọọrọ ... okwu ahụ.” The final simile and its restrained disciplinary force are retained unchanged.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:36Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the repeated volitional refusal in παρακούσῃ, the reporting of the matter to the community, and the comparative force of ἔστω σοι ὥσπερ. However, “nzukọ” most readily denotes a meeting rather than the gathered community denoted by ἐκκλησία in this context.
  naturalness: “Gwa nzukọ ahụ okwu ahụ” is understandable but less idiomatic than “kọọrọ ọgbakọ ahụ okwu ahụ.” The revised wording is clear, modern Standard Igbo and preserves the implied matter from the preceding context.
  terminology: '“Ọgbakọ” is the more suitable primary equivalent for ἐκκλησία as an assembled community. “Onye mba ọzọ” and “onye ọnaụtụ” may be retained: they communicate the representative categories without adding “pagan” or an explicit excommunication procedure.'
  issues:
  - severity: medium
    issue: Primary rendering of ἐκκλησία as “nzukọ”
    rationale: In Standard Igbo, “nzukọ” commonly refers to a meeting/event. The Greek here refers to the assembled covenant community. “Ọgbakọ” better conveys that referent while retaining the noninstitutional sense intended by “assembly.”
  - severity: low
    issue: “Gwa nzukọ ahụ okwu ahụ” is stiff
    rationale: The imperative εἰπὸν naturally means reporting the matter. “Kọọrọ ọgbakọ ahụ okwu ahụ” is more idiomatic Igbo and does not add content.
  revised_text: Ma ọ bụrụ na ọ jụ ige ha ntị, kpọọrọ ọgbakọ ahụ okwu ahụ[a]. Ọ bụrụkwa na ọ jụ ige ọgbakọ ahụ ntị, ka ọ dịrị gị ka onye mba ọzọ na onye ọnaụtụ.
  revised_footnotes:
  - marker: a
    text: 'Ma ọ bụ “ụka” ma ọ bụ “nzukọ” maka “ọgbakọ” (Grik: ekklēsia).'
    reason: lexical_alternative
  revision_rationale: The revision replaces “nzukọ” with “ọgbakọ” to represent ἐκκλησία as a gathered community rather than merely a meeting, and it uses the natural reporting expression “kpọọrọ ... okwu ahụ.” The final simile and its restrained disciplinary force are retained unchanged.
