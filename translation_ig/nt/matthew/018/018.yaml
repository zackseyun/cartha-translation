revisions:
- from: N’ezie, ana m agwa unu, ihe ọ bụla unu ga-eke agbụ n’ụwa ga-abụ nke e keburula agbụ n’eluigwe; ihe ọ bụla unu ga-atọpụkwa n’ụwa ga-abụ nke a tọpụburula n’eluigwe.[a]
  to: N’ezie, ana m agwa unu, ihe ọ bụla unu ga-ekekọta n’ụwa ga-abụ nke e kekọtaworị n’eluigwe; ihe ọ bụla unu ga-atọpụ n’ụwa ga-abụ nke e tọpụworị n’eluigwe.[a]
  rationale: The revision replaces the unclear “eke agbụ/e keburula agbụ” with the natural Standard Igbo pair “kekọta/tọpụ” and uses “e … worị” to convey the possible prior, completed heavenly state signaled by the Greek future plus perfect passive participle. The footnote retains the traditional alternative and states the grammatical nuance as a possibility, preserving interpretive ambiguity.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly preserves the solemn affirmation, plural address, indefinite scope, earth/heaven contrast, and the debated future-plus-perfect-participle construction. However, its binding wording is less accurate and natural: “eke agbụ” can suggest putting someone in chains, while “kekọta” more directly retains the broad bind/loose metaphor. The perfect-result sense is better conveyed by “e kekọtaworị/e tọpụworị.”'
  naturalness: “Ga-abụ nke e keburula agbụ” is awkward and potentially misleading in Standard Igbo. The revised phrasing is fluent, parallel, and clearly expresses a heavenly state already established without forcing a theological interpretation.
  terminology: “N’ezie,” “ana m agwa unu,” “n’ụwa,” “n’eluigwe,” and “tọpụ” are appropriate. “Kekọta” and “tọpụ” provide a natural, balanced verbal pair and avoid reducing the terms to legal permission/prohibition or a specific ecclesial doctrine.
  issues:
  - severity: medium
    issue: The phrase “e keburula agbụ” is unnatural and semantically unstable in this context.
    rationale: It does not clearly communicate the perfect passive/resultant state of δεδεμένα and may be heard through the more common sense of “kè” (divide). “E kekọtaworị” clearly means ‘has already been bound.’
  - severity: low
    issue: “Eke agbụ” may over-specify binding as chaining.
    rationale: δήσητε retains a broader bind/fasten metaphor. “Kekọta” is more idiomatic and maintains the intended pairing with “tọpụ.”
  revised_text: N’ezie, ana m agwa unu, ihe ọ bụla unu ga-ekekọta n’ụwa ga-abụ nke e kekọtaworị n’eluigwe; ihe ọ bụla unu ga-atọpụ n’ụwa ga-abụ nke e tọpụworị n’eluigwe.[a]
