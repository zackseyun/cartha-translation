id: MAT.18.18
reference: Matthew 18:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: ig
  text: N’ezie, ana m agwa unu, ihe ọ bụla unu ga-ekekọta n’ụwa ga-abụ nke e kekọtaworị n’eluigwe; ihe ọ bụla unu ga-atọpụ n’ụwa ga-abụ nke e tọpụworị n’eluigwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka nsụgharị ọdịnala si kwuo, “a ga-ekekọta n’eluigwe … a ga-atọpụ n’eluigwe.” A pụkwara ịsụgharị ụdị okwu Grik ahụ otú a; ma okwu dị n’amaokwu a na-egosipụta ngwaa ọdịnihu na participle zuru oke, nke nwere ike igosi ọnọdụ e guzobeworị n’eluigwe.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: N’ezie
  rationale: Ọ bụ nkwupụta siri ike e ji amalite okwu nwere ikike; “N’ezie” na-eme ka ọ pụta ìhè n’Igbo nke oge a.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a bụ ụzọ Igbo dị mma ma doo anya isi kwuo okwu a na-agwa ọtụtụ mmadụ ozugbo.
- source_word: ὅσα ἐὰν
  choice: ihe ọ bụla
  rationale: Ọ na-egosipụta ọnọdụ sara mbara nke na-akọwaghị otu ihe kpọmkwem.
- source_word: δήσητε
  choice: unu ga-eke agbụ
  rationale: Ọ na-echekwa ihe atụ bụ “ike agbụ” na-enweghị ịkọwa ya naanị dị ka ‘igbochi’ ma ọ bụ otu ụdị ikike iwu.
- source_word: ἐπὶ τῆς γῆς
  choice: n’ụwa
  rationale: Ọ bụ okwu Igbo nkịtị nke na-egosipụta ọdịiche dị n’etiti ụwa na eluigwe.
- source_word: ἔσται δεδεμένα
  choice: ga-abụ nke e keburula agbụ
  rationale: Ọ na-anọchi anya future + perfect passive participle, ya bụ ọnọdụ ga-adị mgbe ihe ahụ meworị, ma na-echekwa passive ahụ n’Igbo.
- source_word: ἐν οὐρανῷ
  choice: n’eluigwe
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọwa ebe ma ọ bụ ọchịchị nke Chineke.
- source_word: λύσητε
  choice: unu ga-atọpụ
  rationale: “Ịtọpụ” na-echekwa mmegide ihe atụ ya na “ike agbụ” ma ghara imechi ihe ọ pụtara naanị n’echiche ‘ikwe ka e mee ihe.’
- source_word: ἔσται λελυμένα
  choice: ga-abụ nke a tọpụburula
  rationale: Ọ na-egosipụta future + perfect passive participle na ọnọdụ sitere n’ihe e meworị.
theological_decisions:
- issue: Ike oge na nghọta nkà mmụta okpukpe nke okwu banyere ike agbụ na ịtọpụ
  choice: ga-abụ nke e keburula agbụ / ga-abụ nke a tọpụburula n’eluigwe
  alternative: a ga-eke agbụ / a ga-atọpụ n’eluigwe
  rationale: 'Ihe owuwu Grik ἔσται tinyere perfect passive participle nwere ike igosi ọnọdụ ga-adị nke sitere n’ihe e meworị. Nsụgharị a na-echekwa esemokwu dị na ya: ihe a na-eme n’ụwa kwekọrọ n’ihe guzorola n’eluigwe, n’ebughị ụzọ kwado ozizi otu ụka banyere ikike.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E chekwara ihe atụ ‘ike agbụ/ịtọpụ,’ yana mgbagwoju anya nke usoro oge Grik; e tinyeghị nkọwa pụrụ iche nke otu ụka.
