  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: ig
  text: N’ihi na ebe mmadụ abụọ ma ọ bụ atọ gbakọtara n’aha m, ebe ahụ ka m nọ n’etiti ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗ
  choice: ebe
  rationale: Ọ na-ewebata nkebiokwu na-egosi ebe. “Ebe” bụ ntụgharị Igbo doro anya nke na-adịghị agbasa ihe Grik kwuru ruo n’ókè “ebe ọ bụla” ga-eme.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-echekwa ọrụ nkọwa nke γάρ, nke jikọtara okwu a na ihe e kwuru tupu ya.
- source_word: δύο ἢ τρεῖς
  choice: mmadụ abụọ ma ọ bụ atọ
  rationale: A gbakwụnyere “mmadụ” ka okwu ahụ bụrụ Igbo eke ma doo anya, ebe a na-echekwa ọnụ ọgụgụ ndị ahụ kpọmkwem.
- source_word: συνηγμένοι
  choice: gbakọtara
  rationale: Ọ na-egosi ọnọdụ ndị ahụ nọ na ya n’ihi na ha ezukọtala; ọ bụkwa okwu Igbo dị mfe ma bụrụ nke eke.
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: n’aha m
  rationale: Nke a bụ ụzọ Igbo sitere n’aka mmadụ si kwuo nzukọ e mere n’ihe metụtara aha Jizọs, n’okpuru ikike ya, ma ọ bụ n’ikwesị ntụkwasị obi nye ya, n’etinyeghị nkọwa otu chọọchị pụrụ iche.
- source_word: ἐκεῖ
  choice: anọ m
  rationale: N’usoro Igbo, ọdịnaya nke “ebe ahụ” pụtara nke ọma n’usoro “ebe ... anọ m”; ịtinye “ebe ahụ” ọzọ ga-adị arọ. Ọnọdụ ebe ahụ ka echekwara site na “n’etiti ha.”
- source_word: εἰμι
  choice: anọ m
  rationale: “Anọ m” na-egosipụta ọnụnọ n’ụzọ Igbo eke ma na-echekwa nkwupụta kpọmkwem nke εἰμι n’ọnọdụ a.
- source_word: ἐν μέσῳ αὐτῶν
  choice: n’etiti ha
  rationale: Ọ na-echekwa oyiyi nke ịnọ n’etiti ndị ahụ ma bụrụkwa okwu Igbo doro anya na nke eke.
theological_decisions:
- issue: Ihe okwu a na-egosi banyere ọnụnọ Kraịst n’etiti ndị na-ezukọ n’aha ya
  choice: A sụgharịrị ya dịka nkwupụta doro anya na Jizọs nọ n’etiti ndị gbakọtara n’aha ya.
  alternative: Ịkọwa ya dịka “Ana m anọnyere ha,” ma ọ bụ ijikọta ọnụnọ ahụ kpọmkwem na ozizi sacrament ma ọ bụ usoro ụka pụrụ iche.
  rationale: Amaokwu ahụ na-ekwusi ike na Jizọs nọ ya, ma ọ kọwaghị ụzọ ma ọ bụ ọdịdị metaphysical nke ọnụnọ ahụ. Ya mere, ntụgharị ahụ na-echekwa nkwupụta ahụ n’etinyeghị ozizi otu chọọchị pụrụ iche.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro Igbo eke ma na-echekwa njikọ nkọwa, ọnụ ọgụgụ, na oyiyi nke ịnọ n’etiti ndị ahụ.
