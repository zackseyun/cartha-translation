revisions:
- from: N’ihi na ebe mmadụ abụọ ma ọ bụ atọ gbakọtara n’aha m[a], anọ m n’etiti ha.
  to: N’ihi na ebe mmadụ abụọ ma ọ bụ atọ gbakọtara n’aha m, ebe ahụ ka m nọ n’etiti ha.
  rationale: The revision explicitly renders the Greek correlatives οὗ ... ἐκεῖ as “ebe ... ebe ahụ ka,” while retaining the draft’s accurate, natural wording for gathering in Jesus’ name and his presence among them. The unnecessary and potentially misleading alternative footnote has been removed.
  reviewer_model: gpt-5.6-terra
