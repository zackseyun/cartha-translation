id: MAT.18.10
reference: Matthew 18:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: ig
  text: Kpacharanụ anya ka unu ghara ileda otu onye n’ime ndị nta ndị a anya,[a] n’ihi na ana m agwa unu na ndị mmụọ ozi ha[b] nọ n’eluigwe na-ahụ ihu Nna m, onye nọ n’eluigwe, mgbe niile.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka unu ghara ile otu onye n’ime ndị nta ndị a anya dị ka onye na-abaghị uru.”
    reason: lexical_alternative
  - marker: b
    text: “Ndị mmụọ ozi ha” nwere ike ịpụta ndị mmụọ ozi e jikọtara na ndị nta a ma ọ bụ ndị na-anọchite anya ha; amaokwu a naanị ya anaghị ekpebi ozizi zuru ezu banyere mmụọ ozi nche.
    reason: alternative_reading
  - marker: c
    text: N’asụsụ Grik, okwu e sụgharịrị “n’eluigwe” dị n’ụdị ọtụtụ n’ebe abụọ a. N’akpaalaokwu a, “n’eluigwe” bụ ụzọ Igbo eke si sụgharị ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε μὴ καταφρονήσητε
  choice: Lezienụ anya ka unu ghara ileda ... anya
  rationale: Ọ na-egosipụta ịdọ aka ná ntị na mmachibido iwu ahụ n’Igbo eke; ‘ileda ... anya’ na-eburu echiche nke ile onye anya dị ka onye na-abaghị uru.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: otu onye n’ime ndị nta ndị a
  rationale: Nke a echekwala ‘otu onye n’ime’ ma ghara ime ka μικροί bụrụ naanị ụmụaka; ọ pụkwara ịgụnye ndị dị umeala ma ọ bụ ndị a na-ele anya dị ka ndị na-enweghị ọkwa.
- source_word: λέγω γὰρ ὑμῖν
  choice: n’ihi na ana m agwa unu
  rationale: Nsụgharị a bụ Igbo doro anya ma na-echekwa ọrụ γάρ nke inye ihe kpatara ịdọ aka ná ntị ahụ.
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: ndị mmụọ ozi ha
  rationale: E debere njikọ nwe ahụ dịka o si dị, n’enweghị ịkọwa ma ọ bụ kwado ozizi zuru ezu banyere mmụọ ozi nche nke onye ọ bụla.
- source_word: ἐν οὐρανοῖς
  choice: nọ n’eluigwe
  rationale: ‘N’eluigwe’ bụ ụzọ Igbo nkịtị si ekwu echiche ọnọdụ a, ọ bụ ezie na okwu Grik dị n’ụdị ọtụtụ.
- source_word: διὰ παντὸς
  choice: mgbe niile
  rationale: Ọ na-enye echiche nke ihe na-eme mgbe nile ma ọ bụ na-aga n’ihu.
- source_word: βλέπουσι τὸ πρόσωπον
  choice: na-ahụ ihu
  rationale: Nsụgharị kpọmkwem a na-echekwa onyonyo nke ịnọ n’ihu Chineke na inwe ohere ịhụ ya.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: Nna m nke nọ n’eluigwe
  rationale: Ọ na-echekwa okwu Jizọs banyere ‘Nna m’ nakwa nkebi na-akọwa ebe ọ nọ, n’etinyeghị ‘nke eluigwe’ n’ebe ọzọ.
theological_decisions:
- issue: Ihe ‘ndị mmụọ ozi ha’ pụtara
  choice: E debere okwu ahụ dịka ‘ndị mmụọ ozi ha’ n’enweghị ịkọwa ụdị njikọ ha na ndị nta ahụ.
  alternative: Ịsụgharị ya dịka mmụọ ozi nche nke e kenyere onye ọ bụla, ma ọ bụ dịka ndị mmụọ ozi na-anọchite anya ma na-ejere ndị nta ahụ ozi.
  rationale: Amaokwu Grik kwuru ‘ndị mmụọ ozi ha,’ ma naanị ya anaghị akọwapụta usoro njikọ ahụ ma ọ bụ guzobe ozizi zuru ezu banyere mmụọ ozi nche.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E jiri ‘ndị nta’ mee ihe iji ghara imechi ndị a na-ekwu maka ha n’ebe ụmụaka naanị nọ. E tinyere akara nkọwa ụkwụ [a], [b], na [c] n’ahịrị amaokwu ahụ.
