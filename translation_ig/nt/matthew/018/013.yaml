revisions:
- from: Ọ bụrụkwa na o nwee ike ịchọta ya[a], n’ezie, ana m asị unu, ọ na-aṅụrị ya ọṅụ karịa iri itoolu na itoolu ahụ na-akpafughị akpafu.
  to: Ma ọ bụrụ na o mee na ọ chọta ya[a], n’ezie, ana m asị unu, ọ na-aṅụrị ọṅụ n’ihi ya karịa ka ọ na-aṅụrị ọṅụ n’ihi iri itoolu na itoolu ahụ na-akpafubeghị.
  rationale: The revision corrects the modal shift introduced by “nwee ike,” replaces an unnatural phrase for the non-straying ninety-nine, and makes the comparative construction idiomatic. It retains the connective, Jesus’ emphatic formula, the implied reference to sheep, and the direct comparison of joy.
