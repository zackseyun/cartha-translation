review_pass:
  verdict: revise
  source_fidelity: The draft's “o nwee ike ịchọta ya” means ‘if he is able/can find it,’ introducing ability rather than the contingent-occurrence nuance of ἐὰν γένηται εὑρεῖν αὐτό. The final expression “na-akpafughị akpafu” is not an idiomatic or accurate rendering of the perfect participle.
  naturalness: 'The revised wording uses natural Standard Igbo: “o mee na ọ chọta ya” expresses the contingency, “na-aṅụrị ọṅụ n’ihi ya” idiomatically conveys rejoicing over the recovered sheep, and “na-akpafubeghị” naturally expresses ‘have not gone astray.’'
  terminology: “N’ezie, ana m asị unu” appropriately renders the solemn ἀμὴν λέγω ὑμῖν formula. The comparative is retained directly and does not resolve the saying’s theological tension. The pronoun “ya” appropriately refers to the sheep understood from context.
  issues:
  - severity: medium
    issue: “o nwee ike ịchọta ya” renders ability rather than occurrence/contingency.
    rationale: Greek γένηται with the infinitive means ‘if it happens/comes about that he finds it,’ not ‘if he is able to find it.’
  - severity: medium
    issue: “na-akpafughị akpafu” is nonstandard and does not clearly convey the Greek perfect participle.
    rationale: The phrase is awkwardly reduplicated; “na-akpafubeghị” clearly and naturally means ‘have not gone astray.’
  - severity: low
    issue: The comparative is syntactically compressed in a way that can sound incomplete in Igbo.
    rationale: Repeating the rejoicing expression after “karịa ka” makes the comparison natural without changing its force.
  revised_text: Ma ọ bụrụ na o mee na ọ chọta ya[a], n’ezie, ana m asị unu, ọ na-aṅụrị ọṅụ n’ihi ya karịa ka ọ na-aṅụrị ọṅụ n’ihi iri itoolu na itoolu ahụ na-akpafubeghị.
