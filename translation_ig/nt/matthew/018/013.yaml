  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: ig
  text: Ma ọ bụrụ na o mee na ọ chọta ya[a], n’ezie, ana m asị unu, ọ na-aṅụrị ọṅụ n’ihi ya karịa ka ọ na-aṅụrị ọṅụ n’ihi iri itoolu na itoolu ahụ na-akpafubeghị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara nnọọ n’usoro okwu mbụ, “ọ bụrụ na o mee na ọ chọta ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ọ bụrụkwa
  rationale: E ji ‘-kwa’ debe njikọ dị mfe nke καὶ na-aga n’ihu n’ihe atụ Jizọs na-akọ.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: ọ bụrụ na o nwee ike ịchọta ya
  rationale: Nke a na-egosipụta na ịchọta ya abụghị ihe e ji n’aka, ma na-anọgidekwa bụrụ okwu Igbo dị mfe nghọta.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: n’ezie, ana m asị unu
  rationale: Nke a na-edobe nkwusi ike na ịdị nsọ nke usoro okwu Jizọs n’asụsụ Igbo nke oge a.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: ọ na-aṅụrị ya ọṅụ
  rationale: ‘Ịṅụrị ... ọṅụ’ na-egosipụta ọṅụ siri ike nke onye ọzụzụ atụrụ nwere n’ihi atụrụ ahụ.
- source_word: μᾶλλον ἢ
  choice: karịa
  rationale: ‘Karịa’ na-edobe ntụnyere ahụ kpọmkwem, n’enweghị ime ka ọ pụta na ọ naghị aṅụrị ndị ọzọ ọṅụ ma ọlị.
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: iri itoolu na itoolu ahụ
  rationale: A hapụrụ ‘atụrụ’ ka ọ bụrụ ihe a ghọtara site n’amaokwu bu ụzọ, dịka e si mee ya n’asụsụ Grik.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: na-akpafughị akpafu
  rationale: Nke a na-egosi ọnọdụ ndị ahụ na-esiteghị n’ụzọ pụọ, ma dabara n’onyinyo atụrụ.
theological_decisions:
- issue: Ike ntụnyere dị n'ọṅụ onye ọzụzụ atụrụ
  choice: E kwuru na ọ na-aṅụrị otu ahụ a chọtara ọṅụ karịa iri itoolu na itoolu ahụ na-akpafughị akpafu.
  alternative: Ime ka ntụnyere ahụ dị nro ka ọ ghara iyi ka otu atụrụ ahụ ka ndị ọzọ mkpa.
  rationale: μᾶλλον ἢ bụ ntụnyere doro anya. Nsụgharị ahụ na-edobe esemokwu echiche dị n’okwu ahụ, n’agbanyeghị na ọ naghị ekwu na onye ọzụzụ atụrụ ahụ enweghị mmasị n’iri itoolu na itoolu ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘o’ zoo aka n’onye ọzụzụ atụrụ, ‘ya’ ezookwa aka n’atụrụ ahụ. E tinyere naanị ihe odide ntụaka [a], ebe ọ bụ na ntụaka nke abụọ n’English POB yiri ka etinyere ya n’ebe na-adabaghị na nkọwa ya; ihe ọzọ a ga-asụ maka ‘na-akpafughị akpafu’ abanyelarị n’ederede n'ụzọ eke.
