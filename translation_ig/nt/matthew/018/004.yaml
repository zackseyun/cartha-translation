  source_fidelity: The draft accurately represents οὖν (“Ya mere”), the indefinite subject and reflexive action in ὅστις ... ταπεινώσει ἑαυτόν (“onye ọ bụla nke wedara onwe ya ala”), the comparison ὡς τὸ παιδίον τοῦτο (“dị ka nwatakịrị a”), and the emphatic resumptive οὗτός (“onye ahụ”). “onye kachasị ukwuu” appropriately conveys ὁ μείζων in this Matthean kingdom saying, and “n’alaeze eluigwe” is the established natural rendering of ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
