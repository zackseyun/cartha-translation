reference: Matthew 18:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: ig
  text: Ya mere, onye ọ bụla nke wedara onwe ya ala dị ka nwatakịrị a, onye ahụ bụ onye kachasị ukwuu n’alaeze eluigwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινώσει ἑαυτόν
  choice: wedara onwe ya ala
  rationale: Nke a na-egosipụta omume mmadụ ji aka ya mee onwe ya onye dị umeala, ma na-edobe ọdịdị nke ngwaa Grik n’ụzọ Igbo nkịtị.
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: dị ka nwatakịrị a
  rationale: Ọ bụ ntụnyere kpọmkwem, nke na-edobe ntụaka Jizọs nyere banyere nwatakịrị ahụ.
- source_word: ὁ μείζων
  choice: onye kachasị ukwuu
  rationale: Na-egosipụta ogo kachasị elu nke okwu Grik n’ụzọ doro anya.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: alaeze eluigwe
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ahịrịokwu Matiu ji eme ihe ugboro ugboro.
theological_decisions:
- issue: Mmekọrịta ịdị umeala n’obi na ịdị ukwuu n’alaeze
  choice: 'E debere nkwupụta ahụ kpọmkwem: onye ahụ bụ onye kachasị ukwuu.'
  alternative: Ịkọwa ya dị ka naanị ihe atụ nke ịbụ onye ukwu ma ọ bụ ihe ga-eme n’ọdịnihu.
  rationale: Ederede Grik na-ekwu οὗτός ἐστιν ὁ μείζων, ya bụ, “onye ahụ bụ onye kachasị ukwuu”; nsụgharị ahụ anaghị agbakwunye nkọwa ozizi ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji “onye ahụ” mee ka nkwughachi οὗτός pụta ìhè, dịka ọ dị n’isi mmalite.
