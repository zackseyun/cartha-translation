  terminology: “Wedara onwe ya ala” is an idiomatic and accurate expression for self-humbling. “Alaeze eluigwe” is conventional biblical Igbo terminology for Matthew’s “kingdom of heaven(s).” No doctrinal interpretation or unwarranted specificity has been added.
