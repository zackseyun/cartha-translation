  to: Ya mere, ohu ahụ dara n’ala, kpọọ isiala n’ihu ya[a], na-asị, “Were ndidi n’ebe m nọ; m ga-akwụghachi gị ihe niile.”
  rationale: The revision removes an additional nuance not present in the Greek and uses a more idiomatic expression for the slave’s request. It preserves the source’s two related physical actions—falling down and making obeisance—and retains the footnote’s contextual clarification that the act is not necessarily religious worship.
