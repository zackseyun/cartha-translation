  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: ig
  text: Ya mere, ohu ahụ dara n’ala, kpọọ isiala n’ihu ya[a], na-asị, “Were ndidi n’ebe m nọ; m ga-akwụghachi gị ihe niile.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kpọọ ya isiala”; n’ọnọdụ ndị ọzọ, ngwaa Grik a nwere ike ịpụta “fee ofufe,” ma n’ebe a ọ na-ekwu maka ohu ji nkwanye ùgwù daa n’ala n’ihu nna ya ukwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσὼν
  choice: dara n’ala
  rationale: Na-egosi omume anụ ahụ nke ohu ahụ ji wedata onwe ya tupu o kwuo okwu.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi na omume a bụ ihe si n’ihe e kwuru n’amaokwu bu ụzọ pụta.
- source_word: δοῦλος
  choice: ohu
  rationale: “Ohu” na-egosipụta ọnọdụ onye nọ n’okpuru ikike nna ya ukwu, nke dabara n’akụkọ a banyere ụgwọ na ibu ọrụ zuru ezu.
- source_word: προσεκύνει
  choice: kpọọ isiala n’ihu ya
  rationale: N’ebe a, okwu ahụ pụtara ịkpọ isiala n’ihu nna ukwu mmadụ iji gosi nsọpụrụ na arịrịọ, ọ bụghị ofufe okpukpe n’ụzọ doro anya.
- source_word: λέγων
  choice: na-asị
  rationale: Na-ewebata okwu ohu ahụ kwuru; ọdịdị imperfect nke ngwaa bụ isi na-enye echiche na ọ nọ na-arịọsi ike.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Nwee ndidi n’ebe m nọ
  rationale: Na-arịọ ka nna ukwu ahụ tachie obi ma nye ya oge tupu ikpe ma ọ bụ ịkwụ ụgwọ.
- source_word: πάντα
  choice: ihe niile
  rationale: Na-egosi nkwa ịkwụghachi ụgwọ ahụ n’uju.
- source_word: ἀποδώσω σοι
  choice: m ga-akwụghachikwa gị
  rationale: N’ọnọdụ ụgwọ a, ngwaa ahụ pụtara ịkwụghachi onye e ji ụgwọ.
theological_decisions:
- issue: Ihe προσκυνέω pụtara mgbe a na-eme ya n’ihu nna ukwu bụ mmadụ
  choice: kpọọ isiala n’ihu ya
  alternative: fee ya ofufe
  rationale: N’ime ilu a, ihe a na-ekwu bụ iweda onwe ala na igosi nna ukwu mmadụ nsọpụrụ. “Fee ya ofufe” nwere ike itinye echiche okpukpe siri ike karịa ihe ọnọdụ a chọrọ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ugwu ma dị mfe nghọta. A họọrọ “ohu” iji chekwaa ọnọdụ mmekọrịta mmadụ nke δοῦλος, ma jiri nkọwa ala peeji gosi obosara ihe προσκυνέω nwere ike ịpụta.
