review_pass:
  verdict: revise
  source_fidelity: The draft accurately includes the SBLGNT reading “against you,” preserves the conditional force, the private character of the admonition, responsive listening, and the gain/winning metaphor. “Gosi ya mmehie ya” is a sound explicit Igbo rendering of ἔλεγξον in this context. The final clause, however, needs the idiomatic complement “n’uru” to convey κερδαίνω naturally as gaining/winning one’s brother rather than merely obtaining him.
  naturalness: The revision uses idiomatic Standard Igbo. “N’etiti gị na ya naanị” directly and naturally expresses the Greek’s emphasis on a private encounter. “Ị ritela nwanne gị n’uru” is an established, clear expression for having gained/won someone.
  terminology: “Nwanne gị,” “emehie,” “megide gị,” and “gee gị ntị” are appropriate and retain the source’s relational, moral, and reconciliatory register. The gender note is retained but is phrased more naturally in Igbo.
  issues:
  - severity: medium
    issue: The phrase “ị ritela nwanne gị” lacks “n’uru.”
    rationale: Without the complement, the wording is less idiomatic and may suggest simply acquiring one’s brother. “Ị ritela nwanne gị n’uru” naturally conveys the metaphor of κερδαίνω, ‘you have gained/won your brother.’
  - severity: low
    issue: The textual-variant footnote substitutes “gwa ya” for the main-text rendering of ἔλεγξον, and the gender footnote is awkwardly phrased.
    rationale: A textual-variant note should alter only the disputed words, εἰς σέ, not introduce a different rendering of ἔλεγξον. The gender note can state the contextual referent more directly.
