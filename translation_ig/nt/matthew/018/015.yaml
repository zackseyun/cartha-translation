id: MAT.18.15
reference: Matthew 18:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: ig
  text: Ma ọ bụrụ na nwanne gị emehie megide gị[a], gaa gosi ya mmehie ya[b] n’etiti gị na ya naanị. Ọ bụrụ na o gee gị ntị, ị ritela nwanne gị n’uru[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akaọrụ enweghị “megide gị”; ha na-agụ, “Ọ bụrụ na nwanne gị emehie, gaa gosi ya mmehie ya n’etiti gị na ya naanị.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “dọọ ya aka ná ntị,” ma ọ bụ “mee ka ọ mara mmehie ya.”
    reason: lexical_alternative
  - marker: c
    text: Okwu Grik a sụgharịrị “nwanne” bụ aha otu onye nke ụdị nwoke; n’ọnọdụ a, ọ pụkwara izo aka n’otu onye na-eso ụzọ ibe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: emehie
  rationale: “Emehie” na-egosipụta mmehie n’ụzọ doro anya ma na-adabara ahịrịokwu ọnọdụ nke ἐὰν na aorist subjunctive.
- source_word: εἰς σέ
  choice: megide gị
  rationale: Nke a bụ ụzọ Igbo si ekwu na mmehie ahụ metụtara onye a na-agwa okwu kpọmkwem; e debere ya n’ahụ ederede dịka SBLGNT si gụọ.
- source_word: ἀδελφός σου
  choice: nwanne gị
  rationale: “Nwanne gị” na-adị n’Igbo dịka okwu nwere ike ịrụ ọrụ n’ọnọdụ a ma na-anọgide nso n’ụdị otu onye nke Grik.
- source_word: ὕπαγε
  choice: gaa
  rationale: “Gaa” bụ iwu dị mkpirikpi ma bụrụkwa nke ebumpụta ụwa n’Igbo.
- source_word: ἔλεγξον
  choice: gosi ya mmehie ya
  rationale: Nkebi a na-egosipụta ime ka onye ahụ hụ ma mara mmehie ya, n’enweghị ike ike “ịbara mba” nwere ike iweta.
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: mgbe naanị unu abụọ nọ
  rationale: Nke a na-ekwupụta nzuzo na ịbụ naanị mmadụ abụọ n’ụzọ Igbo dị mfe ma doo anya.
- source_word: ἀκούσῃ
  choice: o gee gị ntị
  rationale: “Gee ntị” gụnyere ịnụ ihe na ịnabata okwu ahụ, ma ọ naghị agbakwunye echiche nke nrubeisi zuru ezu.
- source_word: ἐκέρδησας
  choice: ị ritela
  rationale: “Ritela” na-echekwa ihe atụ nke κερδαίνω, ya bụ inweta ma ọ bụ irite mmadụ, n’agbakwụnyeghị echiche “inwetaghachi” nke na-adịghị n’okwu Grik n’onwe ya.
theological_decisions:
- issue: Ma a ga-eme ka ἀδελφός bụrụ okwu na-akpọ nwoke na nwanyị aha kpọmkwem
  choice: nwanne gị
  alternative: onye otu okwukwe gị
  rationale: A họọrọ “nwanne gị” ka e wee debe ọdịdị na ihe atụ mmekọrịta ezinụlọ dị na isi mmalite, ebe nkọwa ala peeji na-egosi na n’ọnọdụ a ọ pụrụ ịgụnye onye na-eso ụzọ ibe ya.
- issue: Ọnọdụ ederede nke εἰς σέ
  choice: gụnye “megide gị” n’ahụ ederede
  alternative: 'hapụ ya: “ọ bụrụ na nwanne gị emehie”'
  rationale: SBLGNT nyere εἰς σέ n’ahụ ederede. Ebe ụfọdụ akaọrụ na-ahapụ ya, e debere ọdịiche a na nkọwa ala peeji ka a ghara izochi ọdịiche nwere ike imetụta ókè ntụziaka ahụ ruru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Mgbe naanị unu abụọ nọ” na-eme ka echiche nzuzo pụta nke ọma; “ị ritela nwanne gị” na-echekwa ihe atụ nke inweta mmadụ dị na Grik.
