  to: Ma ọ bụrụ na nwanne gị emehie megide gị[a], gaa gosi ya mmehie ya[b] n’etiti gị na ya naanị. Ọ bụrụ na o gee gị ntị, ị ritela nwanne gị n’uru[c].
