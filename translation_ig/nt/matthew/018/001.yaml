  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: ig
  text: N’oge ahụ, ndị na-eso ụzọ Jizọs bịakwutere Jizọs, sị, “Ònye kwa ka ukwuu n’alaeze eluigwe?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: N’oge ahụ
  rationale: Ụzọ Igbo dị mfe ma bụrụkwa nke kwesịrị ekwesị isi gosipụta oge ahụ a kpọtụrụ aha.
- source_word: οἱ μαθηταί
  choice: ndị na-eso ụzọ Jizọs
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị μαθηταί; itinye “Jizọs” na-eme ka onye ha na-eso doo anya n’enweghị mgbanwe n’echiche.
- source_word: προσῆλθον ... τῷ Ἰησοῦ
  choice: bịakwutere ya
  rationale: “Bịakwutere” na-egosipụta ịbịaru Jizọs nso; “ya” na-ezere ikwughachi aha ahụ ozugbo.
- source_word: Τίς ἄρα μείζων ἐστίν
  choice: Ònyezi ka ibe ya ukwuu
  rationale: “Ònyezi” na-eburu mmetụta nke ἄρα, ebe “ka ibe ya ukwuu” na-edobe ụdị ntụnyere nke μείζων kama ịgbanwe ya ka ọ bụrụ okwu kachasị elu.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: n’alaeze eluigwe
  rationale: Nke a bụ ntụgharị Igbo a maara nke ọma nke na-edobe okwu Matiu banyere “alaeze eluigwe.”
theological_decisions:
- issue: Ma a ga-asụgharị μείζων dị ka ntụnyere ma ọ bụ dị ka nke kachasị elu
  choice: ka ibe ya ukwuu
  alternative: kachasị ukwuu
  rationale: Ụdị Grik bụ ntụnyere (“greater”), ma ihe ndị gbara ya gburugburu nwere ike ime ka a ghọta ajụjụ ahụ dị ka onye kachasị ukwuu. A hapụrụ ntụnyere ahụ ka ederede ahụ ghara idozi nghọta ahụ n’ụzọ nzuzo.
translation_notes:
  register: Asụsụ Igbo Izugbe, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “jụọ ya, sị” mee ka okwu mmeghe ahụ bụrụ nke a na-asụkarị n’Igbo, ebe a ka na-edobe usoro na ike ajụjụ Grik.
