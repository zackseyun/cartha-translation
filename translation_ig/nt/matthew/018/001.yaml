revisions:
- from: N’oge ahụ, ndị na-eso ụzọ Jizọs bịakwutere ya, jụọ ya, sị, “Ònyezi ka ibe ya ukwuu n’alaeze eluigwe?”
  to: N’oge ahụ, ndị na-eso ụzọ Jizọs bịakwutere Jizọs, sị, “Ònye kwa ka ukwuu n’alaeze eluigwe?”
  rationale: The revision removes the awkward “ibe ya,” retains the source’s comparative wording through “ka ukwuu,” and renders the approach-plus-speech construction more directly. No footnote is needed, since the comparative can be expressed naturally in Igbo without resolving it into a superlative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:28Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the setting, the disciples’ approach, the question, and Matthew’s distinctive expression “kingdom of heaven.” However, “jụọ ya, sị” unnecessarily makes explicit an act of asking in addition to the source’s participle “saying,” and the wording of the comparative question needs adjustment.
  naturalness: “Ònyezi ka ibe ya ukwuu” is not idiomatic Standard Igbo for this question. In particular, “ibe ya” introduces an awkward and unclear comparison. “Ònye kwa ka ukwuu” is natural and retains the Greek comparative sense.
  terminology: “ndị na-eso ụzọ” appropriately renders μαθηταί, “alaeze eluigwe” is an established and suitable rendering of βασιλεία τῶν οὐρανῶν, and “Jizọs” is correctly rendered.
  issues:
  - severity: medium
    issue: The comparative expression is unnatural and semantically unclear.
    rationale: “ka ibe ya ukwuu” is not a natural way to ask who is greater in this context and can leave the comparison obscure. The Greek has a comparative adjective; Igbo “ka ukwuu” preserves this without forcing a superlative.
  - severity: low
    issue: “jụọ ya, sị” is more explicit than the Greek construction.
    rationale: προσελθόντες ... λέγοντες means that the disciples came to Jesus saying. “bịakwutere Jizọs, sị” follows this structure directly and reads naturally.
  revised_text: N’oge ahụ, ndị na-eso ụzọ Jizọs bịakwutere Jizọs, sị, “Ònye kwa ka ukwuu n’alaeze eluigwe?”
  revised_footnotes: []
