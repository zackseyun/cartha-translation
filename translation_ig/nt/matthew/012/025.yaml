id: MAT.12.25
reference: Matthew 12:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: ig
  text: Ma, n’ịmara echiche ha[a], ọ sịrị ha, “Alaeze ọ bụla nke kewara megide onwe ya na-ala n’iyi[b]; obodo ọ bụla ma ọ bụ ụlọ[c] nke kewara megide onwe ya agaghị eguzosi ike.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ntụgharị uche ha” ma ọ bụ “ebumnuche ha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-atọgbọrọ n’efu” ma ọ bụ “na-aghọ mkpọmkpọ ebe.”
    reason: lexical_alternative
  - marker: c
    text: “Ụlọ” nwekwara ike ịpụta “ezinụlọ” ma ọ bụ “ndị otu ụlọ” n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: ebe ọ maara
  rationale: Na-egosipụta ịma ihe dị n’uche n’enweghị ịkọ otú Jizọs si mata ya, ma na-ejikọta participle ahụ na ngwaa bụ isi n’ụzọ Igbo si ada nke ọma.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosipụta obere mgbanwe ma ọ bụ ọdịiche dị n’arụmụka dịka δέ si eme n’ebe a.
- source_word: ἐνθυμήσεις
  choice: echiche
  rationale: “Echiche” bụ okwu Igbo doro anya nke nwere ike ịgụnye echiche dị n’ime, ntụgharị uche, ma ọ bụ ebumnuche; a hapụrụ ụzọ okwu ndị ọzọ n’ala peeji.
- source_word: Πᾶσα βασιλεία
  choice: Alaeze ọ bụla
  rationale: Na-echekwa nkwupụta izugbe na nke gbasara alaeze niile nke πᾶσα na aha otu na-egosi.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: nke kewara megide onwe ya
  rationale: Na-echekwa echiche nke nkewa dị n’ime na imegide onwe ya, ọ bụghị naanị ikewa n’ìgwè.
- source_word: ἐρημοῦται
  choice: ga-aghọ mkpọmkpọ ebe
  rationale: Na-egosipụta nsonaazụ nke ịtọgbọrọ n’efu na mbibi nke ngwaa ahụ, n’asụsụ Igbo doro anya ma dị ike.
- source_word: πόλις ἢ οἰκία
  choice: obodo ọ bụla ma ọ bụ ụlọ
  rationale: “Obodo” dabara πόλις, ebe “ụlọ” na-echekwa ihe oyiyi nkịtị nke οἰκία ma nwee ike ịgụnye ezinụlọ ma ọ bụ ndị bi n’ụlọ dịka ala peeji si kọwaa.
- source_word: οὐ σταθήσεται
  choice: agaghị eguzosi ike
  rationale: Na-enye okwu Igbo ebumpụta ụwa maka ihe na-agaghị anọgide guzosie ike ma ọ bụ dịgide.
theological_decisions:
- issue: Ụdị ụzọ Jizọs si mara echiche ha
  choice: E kwuru naanị na ọ maara echiche ha.
  alternative: Ịkọwa na ọ maara ha site n’ịma ihe niile n’ụzọ karịrị mmadụ, site n’amụma, ma ọ bụ site n’ịghọta omume ha.
  rationale: Amaokwu ahụ na-ekwu na ọ maara ha, ma ọ naghị akọwa ụzọ o si mara; nsụgharị ahụ anaghị etinye nkọwa ozizi na-adịghị n’ederede.
- issue: Ihe οἰκία pụtara n’ebe a
  choice: “Ụlọ,” tinyere ala peeji na ọ pụkwara ịpụta “ezinụlọ” ma ọ bụ “ndị otu ụlọ.”
  alternative: Ịsụgharị ya ozugbo dịka “ezinụlọ.”
  rationale: Nke a na-echekwa ma ihe oyiyi ụlọ nkịtị ma ohere nke ihe gbasara ndị bi n’ụlọ, n’enweghị imechi ambiguity nke Grik.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji usoro ilu doro anya mee ka nkwupụta ahụ bụrụ nke ebumpụta ụwa, ma e chekwara ihe oyiyi na mgbagwoju anya ziri ezi nke ederede Grik.
