review_pass:
  verdict: revise
  source_fidelity: A safe correction is needed because ἐρημοῦται is present indicative (a gnomic present in this proverbial saying), whereas the draft’s “ga-aghọ” is future. The future “agaghị eguzosi ike” correctly renders οὐ σταθήσεται.
  naturalness: The revised wording is natural, modern Standard Igbo and retains the concise proverbial register. “N’ịmara echiche ha” expresses the participial relationship without making Jesus’ knowledge explicitly causal.
  terminology: “Echiche,” “alaeze,” “obodo,” “ụlọ,” and “eguzosi ike” are suitable. The footnote for “ụlọ” appropriately preserves the possible household sense of οἰκία.
  issues:
  - severity: medium
    issue: Tense/aspect of ἐρημοῦται
    rationale: The draft renders the present verb ἐρημοῦται as future (“ga-aghọ mkpọmkpọ ebe”). In contrast to the explicitly future σταθήσεται later in the verse, the Greek first clause states the general result in the present. “Na-ala n’iyi” preserves this gnomic-present force naturally in Igbo.
  - severity: low
    issue: Participial connection of εἰδὼς
    rationale: “Ebe ọ maara” can readily sound causal (“because he knew”). “N’ịmara echiche ha” more closely retains the circumstantial participial connection while leaving unexplained how he knew them.
  revised_text: Ma, n’ịmara echiche ha[a], ọ sịrị ha, “Alaeze ọ bụla nke kewara megide onwe ya na-ala n’iyi[b]; obodo ọ bụla ma ọ bụ ụlọ[c] nke kewara megide onwe ya agaghị eguzosi ike.”
