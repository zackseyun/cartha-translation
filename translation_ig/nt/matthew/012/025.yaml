- from: Ma ebe ọ maara echiche ha[a], ọ sịrị ha, “Alaeze ọ bụla nke kewara megide onwe ya ga-aghọ mkpọmkpọ ebe[b]; obodo ọ bụla ma ọ bụ ụlọ[c] nke kewara megide onwe ya agaghị eguzosi ike.”
  to: Ma, n’ịmara echiche ha[a], ọ sịrị ha, “Alaeze ọ bụla nke kewara megide onwe ya na-ala n’iyi[b]; obodo ọ bụla ma ọ bụ ụlọ[c] nke kewara megide onwe ya agaghị eguzosi ike.”
  rationale: The revision corrects the first predicate from future to the Greek present while retaining the future in the second predicate. It also replaces a potentially causal connective with a natural participial construction. No theological inference is added, and the lexical ambiguity of ἐνθυμήσεις and οἰκία remains available in footnotes.
