revisions:
- from: Ma a sị na unu maara ihe okwu a pụtara,[a] ‘Ọ bụ ebere ka m chọrọ, ọ bụghị àjà,’ unu agaraghị ama ndị ikpe na-amaghị ikpe.
  to: Ma a sị na unu maara ihe okwu a pụtara,[a] ‘Ebere ka m chọrọ, ọ bụghị àjà,’ unu agaraghị ama ndị na-enweghị ikpe ikpe.
  rationale: The final clause is revised to express clearly that those condemned were guiltless. The rest is retained except for the unnecessary copula in the prophetic quotation, yielding a closer and natural rendering of “Mercy I desire, and not sacrifice.”
  reviewer_model: gpt-5.6-terra
