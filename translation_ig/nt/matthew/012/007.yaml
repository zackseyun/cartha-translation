id: MAT.12.7
reference: Matthew 12:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: ig
  text: Ma a sị na unu maara ihe okwu a pụtara,[a] ‘Ebere ka m chọrọ, ọ bụghị àjà,’ unu agaraghị ama ndị na-enweghị ikpe ikpe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jizọs na-ehota Hosea 6:6.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: unu maara
  rationale: N’ahịrịokwu ọnọdụ a na-ekwu banyere ihe na-emeghị eme, ‘unu maara’ na njikọ ya na ‘unu agaraghị’ na-egosi na nghọta ahụ kwesịrị ịdịrị ha na mbụ, n’Igbo na-adịghị arọ.
- source_word: τί ἐστιν
  choice: ihe okwu a pụtara
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọwa nghọta ihe e dere n’Akwụkwọ Nsọ, ọ bụghị naanị ịmata ihe ọ bụ.
- source_word: Ἔλεος
  choice: ebere
  rationale: ‘Ebere’ na-egosi obi ọmịiko na omume amara, ma na-edobe okwu ahụ nkenke dịka n’amaokwu Hosea e hotara.
- source_word: θέλω
  choice: ka m chọrọ
  rationale: ‘Chọrọ’ bụ okwu Igbo doro anya ma dị ùgwù nke na-egosi ihe Chineke na-achọ ma ọ bụ na-enwe mmasị na ya.
- source_word: θυσίαν
  choice: àjà
  rationale: ‘Àjà’ bụ okwu Igbo kpọmkwem na nke a na-ahụkarị maka onyinye e ji efe Chineke n’emume.
- source_word: κατεδικάσατε
  choice: unu agaraghị ama ... ikpe
  rationale: Ụdị a na-edobe ọnọdụ megidere eziokwu ma na-egosikwa mkpebi ikpe megide mmadụ.
- source_word: ἀναιτίους
  choice: ndị na-amaghị ikpe
  rationale: Nke a na-egosi ndị ikpe na-adịghị n’ahụ ha, ma dabara na asụsụ ikpe nke ngwaa ‘ama ... ikpe.’
theological_decisions:
- issue: Ichekwa ntụnyere amụma ahụ n’etiti ebere na àjà n’enweghị ikwu na àjà niile ezighị ezi
  choice: Ọ bụ ebere ka m chọrọ, ọ bụghị àjà
  alternative: Ebere na-atọ m ụtọ karịa àjà
  rationale: Nhọrọ a na-edobe ịdị nkọ nke okwu Grik ‘καὶ οὐ’ na esemokwu amụma ahụ, n’enweghị itinye nkọwa na-ekwu na usoro àjà n’onwe ya abụghị ihe ziri ezi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, doro anya ma dị ùgwù. E tinyere naanị ntụaka Hosea dịka nkọwa ala peeji; ‘ndị na-amaghị ikpe’ na-ekpuchi ma ‘the guiltless’ ma ‘the innocent,’ ya mere nkọwa lexical ọzọ adịghị mkpa.
