    text: Jizọs na-ehota Hosea 6:6.
    reason: cross_reference
  revision_rationale: The final clause is revised to express clearly that those condemned were guiltless. The rest is retained except for the unnecessary copula in the prophetic quotation, yielding a closer and natural rendering of “Mercy I desire, and not sacrifice.”
