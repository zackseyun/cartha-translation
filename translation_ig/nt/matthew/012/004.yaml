review_pass:
  verdict: revise
  source_fidelity: The draft correctly follows the SBLGNT plural ἔφαγον (“ha wee rie”) and retains the singular variant in footnote a. It accurately conveys David’s entry into the house of God, the consecrated bread, the legal/cultic restriction, the accompanying persons, and the exception for priests.
  naturalness: The relative clause “nke iwu na-akwadoghị ka ya onwe ya ma ọ bụ ndị ya na ha nọ rie” is understandable but syntactically compressed and less idiomatic in modern Standard Igbo. Repeating “ka” before the coordinated infinitival clauses makes the restriction clear and natural.
  terminology: “ụlọ Chineke,” “achịcha a na-edobe n’ihu Chineke,” and “ndị nchụàjà” are appropriate Standard Igbo renderings. The explanatory lexical footnote is suitably anchored to the bread expression. “Iwu na-ekweghị” retains the legal force of ἐξόν without adding interpretation.
  issues:
  - severity: low
    issue: The prohibition clause is grammatically cramped.
    rationale: The construction can momentarily suggest that “iwu” directly rejects the people rather than that it forbids their eating. “iwu na-ekweghị ka ya rie, ma ọ bụ ka ndị ya na ha nọ rie” clearly expresses the Greek infinitival construction for both David and his companions.
  revised_text: otú o si banye n’ụlọ Chineke, ha wee rie[a] achịcha a na-edobe n’ihu Chineke[b], nke iwu na-ekweghị ka ya rie, ma ọ bụ ka ndị ya na ha nọ rie, ma e wezụga naanị ndị nchụàjà?
