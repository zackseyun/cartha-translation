  to: otú o si banye n’ụlọ Chineke, ha wee rie[a] achịcha a na-edobe n’ihu Chineke[b], nke iwu na-ekweghị ka ya rie, ma ọ bụ ka ndị ya na ha nọ rie, ma e wezụga naanị ndị nchụàjà?
