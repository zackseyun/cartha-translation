id: MAT.12.4
reference: Matthew 12:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: ig
  text: otú o si banye n’ụlọ Chineke, ha wee rie[a] achịcha a na-edobe n’ihu Chineke[b], nke iwu na-ekweghị ka ya rie, ma ọ bụ ka ndị ya na ha nọ rie, ma e wezụga naanị ndị nchụàjà?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide ma ọ bụ ọgụgụ nwere “o wee rie” kama “ha wee rie.”
    reason: textual_variant
  - marker: b
    text: N’ụzọ ọzọ, “achịcha ngosi,” ya bụ, achịcha nsọ a na-edobe n’ihu Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: otú o si
  rationale: Ọ bụ ụzọ Igbo si ebido nkọwa banyere otú ihe si mee; ọ dabara nke ọma n’ajụjụ Jizọs na-ajụ.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: o si banye n’ụlọ Chineke
  rationale: Nke a na-edobe omume ịbanye na okwu kpọmkwem bụ ‘ụlọ Chineke,’ n’agbanyeghị na ihe a na-ekwu banyere ya n’akụkọ ahụ bụ ebe nsọ.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: achịcha a na-edebe n’ihu Chineke
  rationale: Nke a na-eme ka ndị na-agụ Igbo ghọta na ọ bụ achịcha nsọ a na-edobe n’ihu Chineke, kama iji okwu ochie ma ọ bụ okwu na-edoghị anya.
- source_word: ἔφαγον
  choice: ha wee rie
  rationale: A gbasoro ọgụgụ ọtụtụ nke SBLGNT, nke na-egosi na Devid na ndị ya na ha nọ riri achịcha ahụ. E debere ọgụgụ otu onye n’okpuru peeji.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: nke iwu na-akwadoghị ka ya onwe ya rie
  rationale: ‘Iwu na-akwadoghị’ na-echekwa ịdị arọ nke mmachibido sitere n’iwu banyere ofufe, ọ bụghị naanị na mmadụ ekweghị ya.
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: ma ọ bụ ndị ya na ha nọ
  rationale: Nke a bụ Igbo doro anya maka ndị so Devid, ma ọ naghị agbakwunye nkọwa na-adịghị na Grik.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: ma e wezụga naanị ndị nchụàjà
  rationale: Ọ na-egosipụta ma iwepụ ndị ọzọ ma ikike pụrụ iche nke ndị nchụàjà.
theological_decisions:
- issue: Ike iwu na ofufe dị na ἐξὸν
  choice: iwu na-akwadoghị
  alternative: a naghị ekwe ka
  rationale: Nhọrọ a na-echekwa na mmachibido ahụ metụtara iwu nsọ na ọrụ ndị nchụàjà, ọ bụghị naanị iwu mmadụ nkịtị.
- issue: Onye ma ọ bụ ndị bụ isiokwu nke ἔφαγον
  choice: ha wee rie
  alternative: o wee rie
  rationale: Ederede SBLGNT e nyere nwere ngwaa ọtụtụ. E debere ọgụgụ otu onye n’okpuru peeji ka a ghara izochi ọdịiche ederede ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ usoro ajụjụ ahụ ka ọ na-aga n’ihu site n’amaokwu bu ụzọ. E mere mgbanwe isiokwu site na ‘o’ gaa na ‘ha’ ka ọgụgụ ọtụtụ nke Grik pụta ìhè.
