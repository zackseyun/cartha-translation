revisions:
- from: “Lee, ohu m, onye m họọrọ, onye m hụrụ n’anya, onye mkpụrụ obi m nwere obi ụtọ n’ebe ọ nọ.[b] Aga m etinye Mmụọ m n’ahụ ya, ọ ga-ekwusakwa ikpe ziri ezi[a] nye mba dị iche iche.[c]”
  to: “Lee, ohu m, onye m họọrọ, onye m hụrụ n’anya, onye mkpụrụ obi m nwere ezi obi ụtọ n’ime ya.[b] Aga m etinye Mmụọ m n’elu ya, ọ ga-ekwusa ikpe ziri ezi[a] nye mba dị iche iche.[c]”
  rationale: The revision clarifies that the servant—not a location—is the object of God’s delight, more closely renders the Spirit being placed upon him, and removes an unwarranted additive particle. It retains the source’s formal prophetic tone, its servant terminology, and the lexical alternatives for κρίσις and ἔθνη.
