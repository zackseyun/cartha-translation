id: MAT.12.18
reference: Matthew 12:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: ig
  text: “Lee, ohu m, onye m họọrọ, onye m hụrụ n’anya, onye mkpụrụ obi m nwere ezi obi ụtọ n’ime ya.[b] Aga m etinye Mmụọ m n’elu ya, ọ ga-ekwusa ikpe ziri ezi[a] nye mba dị iche iche.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘ikpe.’
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘onye mkpụrụ obi m nwere afọ ojuju n’ime ya.’
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, ‘nye ndị mba ọzọ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Ọ na-edobe oku amụma ahụ na-akpọ ndị na-ege ntị ka ha ṅaa ntị, ma bụrụkwa okwu Igbo doro anya ma dị ùgwù.
- source_word: παῖς
  choice: ohu
  rationale: N’ebe a, okwu ahụ sitere n’amụma Aịzaya banyere ohu Chineke; ya mere ‘ohu’ ka ‘nwa’ ma ọ bụ ‘nwa nwoke’ dabara n’ihe gbara ya gburugburu.
- source_word: ᾑρέτισα
  choice: onye m họọrọ
  rationale: Ọ na-egosi nhọrọ Chineke mere nke ọma, n’ụzọ Igbo na-ada nke ọma.
- source_word: ἀγαπητός
  choice: onye m hụrụ n’anya
  rationale: Nke a na-egosipụta ịhụnanya na ịdị oké ọnụ ahịa nke okwu Grik ahụ n’Igbo eke.
- source_word: εἰς ὃν
  choice: n’ebe ọ nọ
  rationale: N’usoro okwu ya na εὐδοκέω, nke a na-egosi onye obi ụtọ ahụ metụtara, na-enweghị ịmanye echiche ntụzịaka nkịtị nke εἰς.
- source_word: εὐδόκησεν ἡ ψυχή μου
  choice: onye mkpụrụ obi m nwere obi ụtọ n’ebe ọ nọ
  rationale: Ọ na-edobe ‘mkpụrụ obi m’ nke dị kpọmkwem n’ihe odide Grik ma na-ekwupụta afọ ojuju na obi ụtọ Chineke.
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: Aga m etinye Mmụọ m n’ahụ ya
  rationale: Ọ na-edobe echiche nke itinye Mmụọ Chineke n’ahụ onye ahụ maka ọrụ e nyere ya; e ji mkpụrụedemede ukwu dee ‘Mmụọ’ n’ihi na ọ bụ Mmụọ Chineke.
- source_word: κρίσιν
  choice: ikpe ziri ezi
  rationale: N’amụma a banyere ọrụ ohu ahụ n’etiti mba, okwu a na-elekwasị anya n’usoro ezi omume Chineke nke ọ ga-ekwusa, ọ bụghị nanị n’ikpe ntaramahụhụ.
- source_word: τοῖς ἔθνεσιν
  choice: nye mba dị iche iche
  rationale: Nke a na-edobe obosara nke okwu ahụ, ya bụ mba niile na-abụghị nanị otu ìgwè mmadụ.
- source_word: ἀπαγγελεῖ
  choice: ọ ga-ekwusakwa
  rationale: ‘Ikwusa’ na-egosi nkwupụta ọha na eze nke dabara n’ọrụ amụma ahụ.
theological_decisions:
- issue: Njirimara ohu Mesaya n’okwu παῖς
  choice: A sụgharịrị παῖς dịka ‘ohu’ n’ihi njikọ ya na amụma Aịzaya banyere ohu Chineke.
  alternative: nwa; nwa nwoke
  rationale: ‘Ohu’ na-echekwa njikọ Akwụkwọ Nsọ Ochie dị n’amaokwu a, ma ghara itinye echiche ịbụ Ọkpara n’ime mkpụrụokwu a kpọmkwem, n’agbanyeghị na ebe ndị ọzọ na-akụzi ya.
- issue: Ihe κρίσις pụtara n’ọrụ amụma ahụ
  choice: E tinyere ‘ikpe ziri ezi’ n’ahịrị bụ isi.
  alternative: ikpe
  rationale: N’ebe a, okwu ahụ na-egosi ezi usoro na ikpe ziri ezi nke Chineke a ga-ekwusara mba dị iche iche. A na-edobe ‘ikpe’ n’okpuru peeji n’ihi na okwu Grik ahụ nwekwara ike ịpụta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, sụgharịa ya. A hapụrụ ụda amụma ahụ n’okwu ‘Lee,’ ma zere okwu ụka pụrụ iche nke otu denominashọn.
