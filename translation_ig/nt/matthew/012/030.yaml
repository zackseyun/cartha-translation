review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys opposition in the first clause and the gather/scatter contrast. However, the added object pronoun “ya” in the second clause has no expressed antecedent in the Greek, whose verb σκορπίζει is used absolutely here. It risks supplying a specific object and should be omitted. The revised wording also retains μετ’ ἐμοῦ in both clauses as association with Jesus.
  naturalness: “Onye na-adịghị n’akụkụ m” is natural Standard Igbo for the alignment implied by the saying. “Onye na-adịghị eso m achịkọta” is concise and idiomatic, and the two balanced clauses preserve the force and rhythm of the original.
  terminology: “na-emegide m” appropriately renders κατ’ ἐμοῦ. “achịkọta” and “na-achụsasị” provide the intended antithetical pair without specifying an unstated object, such as people, a flock, or crops.
  issues:
  - severity: medium
    issue: The pronoun “ya” is added after “na-achụsasị.”
    rationale: σκορπίζει (“scatters”) has no stated object in the Greek. In Igbo, “ya” creates an unclear and potentially interpretive antecedent (“it/him/her”), whereas the source leaves the object implicit.
  revised_text: Onye na-adịghị n’akụkụ m na-emegide m, onye na-adịghị eso m achịkọta na-achụsasị.
