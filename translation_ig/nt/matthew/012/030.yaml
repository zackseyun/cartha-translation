id: MAT.12.30
reference: Matthew 12:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: ig
  text: Onye na-adịghị n’akụkụ m na-emegide m, onye na-adịghị eso m achịkọta na-achụsasị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: Onye na-adịghị
  rationale: Nkọwaokwu nwere article na participle na-arụ ọrụ dị ka aha mmadụ n’ozuzu; “Onye na-adịghị” na-egosipụta nke a n’Igbo nkịtị.
- source_word: μετ’ ἐμοῦ
  choice: n’akụkụ m / esoghị m
  rationale: μετά na genitive na-egosi ịnọnyere ma ọ bụ iso mmadụ; n’ahịrịokwu mbụ, “n’akụkụ m” na-eme ka echiche nke ịkwado Jizọs doo anya, ebe “esoghị m” dabara n’omume ịchịkọta.
- source_word: κατ’ ἐμοῦ
  choice: na-emegide m
  rationale: κατά na genitive ebe a pụtara iguzogide mmadụ; “na-emegide m” bụ Igbo doro anya ma dị ndụ.
- source_word: συνάγων
  choice: achịkọta ihe
  rationale: Okwu a pụtara ịchịkọta ma ọ bụ ịkpọkọta; “achịkọta ihe” na-edobe ihe oyiyi ahụ n’ebughị ụzọ kpebie ma ọ bụ owuwe ihe ubi, ìgwè atụrụ, ka ọ bụ mmadụ.
- source_word: σκορπίζει
  choice: na-achụsasị ya
  rationale: “Na-achụsasị” na-edobe mmegide doro anya dị n’etiti ịchịkọta na ịchụsasị; “ya” na-ezo aka n’ihe a na-achịkọta n’enweghị ịkọwa ya karịa isi mmalite.
- source_word: καὶ
  choice: onye ... kwa
  rationale: Akara “-kwa” na Igbo na-ejikọta nkwupụta abụọ yiri ibe ha dịka καὶ si eme, n’ụzọ na-ada nke ọma.
theological_decisions:
- issue: Ike nke nkewa zuru oke Jizọs kwuru
  choice: 'E debere ya dịka nhọrọ abụọ siri ike: ịnọ n’akụkụ Jizọs ma ọ bụ imegide ya, na iso ya achịkọta ma ọ bụ ịchụsasị.'
  alternative: Ịsụgharị ya n’ụzọ ga-eme ka ọdịiche ahụ dị nro ma ọ bụ tinye nkọwa ozizi ọzọ.
  rationale: Grik nwere ahịrịokwu abụọ yiri ibe ha, nke ọ bụla gosiri mmegide kpọmkwem n’enweghị okwu na-eme ka ike ha belata. Nsụgharị ahụ na-edobe esemokwu nkà mmụta okpukpe ahụ n’ebughị ozizi òtù ụka ọ bụla.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “Onye” mee ntụaka mmadụ n’ozuzu n’enweghị asụsụ ochie. Ahịrịokwu ahụ na-edobe nhazi abụọ na mmegide dị n’Grik.
