- from: Onye na-adịghị n’akụkụ m na-emegide m, onye na-esoghịkwa m achịkọta ihe na-achụsasị ya.
  to: Onye na-adịghị n’akụkụ m na-emegide m, onye na-adịghị eso m achịkọta na-achụsasị.
  rationale: Removed the unsupported and unclear object pronoun “ya.” The revision preserves the source’s generic singular persons, repeated association with Jesus, direct opposition, and the unqualified gather/scatter antithesis without importing a particular image or doctrinal interpretation.
