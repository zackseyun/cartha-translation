id: MAT.12.36
reference: Matthew 12:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: ig
  text: Ma ana m agwa unu na, maka okwu ọ bụla e kwuru n’akpachapụghị anya[a], ndị mmadụ ga-aza ajụjụ banyere ya[b] n’ụbọchị ikpe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwu efu.” Okwu Grik a nwekwara ike ịpụta okwu na-adịghị amị mkpụrụ ma ọ bụ okwu na-enweghị uru.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha ga-aza ajụjụ maka ya.”
    reason: previous_rendering
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ma ana m agwa unu
  rationale: “Ana m agwa unu” na-egosipụta okwu Jizọs na-ekwu ugbu a nye ndị na-ege ya ntị. “Ma” na-egosipụta ntụgharị dị nro na ịdọ aka ná ntị nke siri ike karịa ihe bu ya ụzọ.
- source_word: πᾶν ῥῆμα
  choice: okwu ọ bụla
  rationale: “Ọ bụla” na-egosipụta ike nkesa nke πᾶν, ebe “okwu” bụ ụzọ Igbo si ekwu okwu mmadụ kwuru n’ụzọ dị mfe ma doo anya.
- source_word: ἀργὸν
  choice: n’akpachapụghị anya
  rationale: N’ebe a, ἀργός nwere ike ịpụta ihe na-adịghị arụ ọrụ, nke na-abaghị uru, ma ọ bụ nke e kwuru n’enweghị nlezianya. Ịsụgharị ya dị ka ọnọdụ e ji kwuo okwu na-enye Igbo eke ma na-egosipụta ibu ọrụ omume dị n’ịdọ aka ná ntị a.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: ndị mmadụ ga-ekwu
  rationale: “Ndị mmadụ” na-egosipụta na οἱ ἄνθρωποι na-ezo aka n’ụmụ mmadụ niile, ọ bụghị naanị ụmụ nwoke; “ga-ekwu” na-echekwa ọdịdị ọdịnihu nke λαλήσουσιν.
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: maka okwu ọ bụla … ha ga-aza ajụjụ
  rationale: “Ịza ajụjụ” bụ akpaalaokwu Igbo doro anya maka ịkọ ihe mmadụ mere n’ihu onye ikpe. Itinye “maka okwu ọ bụla” n’ihu ahịrịokwu na-egosipụta ihe a ga-ajụ ha banyere ya n’enweghị nkwughachi na-adịghị mkpa.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: n’ụbọchị ikpe
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma guzosie ike isi kwuo ụbọchị a ga-ekpe ụmụ mmadụ ikpe.
theological_decisions:
- issue: Ike omume nke ἀργόν
  choice: n’akpachapụghị anya
  alternative: okwu efu; okwu na-abaghị uru
  rationale: Ihe gbara amaokwu a gburugburu bụ ịza ajụjụ n’ụbọchị ikpe. Ya mere, nsụgharị bụ isi na-egosipụta okwu e kwuru n’enweghị nlezianya, ma ihe odide ala peeji na-echekwa ohere nkọwa ndị ọzọ dị na okwu Grik ahụ.
- issue: Ndị οἱ ἄνθρωποι na-anọchi anya ha
  choice: ndị mmadụ
  alternative: ụmụ mmadụ
  rationale: Okwu Grik ahụ na-ezo aka n’ụmụ mmadụ n’ozuzu ha, ọ bụghị naanị ndị nwoke.
- issue: Ụdị ịza ajụjụ n’ụbọchị ikpe
  choice: ha ga-aza ajụjụ
  alternative: ha ga-aza ajụjụ maka ya
  rationale: Nsụgharị bụ isi na-edebe echiche ikpe na ibu ọrụ n’enweghị ịkọwa ụdị ikpe ahụ karịa ihe Grik kwuru; ihe ọzọ na-eme ka nnọchiaha αὐτοῦ pụta ìhè.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. Akpaalaokwu “ịza ajụjụ” na-enye echiche nke mmadụ ịkọ ihe o mere n’ihu ikpe, ebe nhazi ahịrịokwu ahụ na-ezere nkwughachi na-adịghị eke.
