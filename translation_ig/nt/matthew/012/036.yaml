revisions:
- from: Ma ana m agwa unu na, maka okwu ọ bụla ndị mmadụ ga-ekwu n’akpachapụghị anya[a], ha ga-aza ajụjụ[b] n’ụbọchị ikpe.
  to: Ma ana m agwa unu na, maka okwu ọ bụla e kwuru n’akpachapụghị anya[a], ndị mmadụ ga-aza ajụjụ banyere ya[b] n’ụbọchị ikpe.
  rationale: The revision keeps the draft’s modern, ethically serious rendering of ἀργός but places that quality on the “word,” as in the Greek. It also retains the explicit object of the account with an idiomatic Igbo phrase. The footnote wording has been made natural and lexically relevant.
