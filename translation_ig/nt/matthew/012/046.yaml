id: MAT.12.46
reference: Matthew 12:46
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: ig
  text: Mgbe ọ ka na-agwa ìgwè mmadụ okwu, lee, nne ya na ụmụnne ya ndị ikom[a] guzo n'èzí, na-achọ ịgwa ya okwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ikwu ya,” ma ọ bụrụ na a ghọta ἀδελφοί n'ụzọ sara mbara dịka ndị ikwu chiri anya; okwu Grik ebe a bụ ụdị ọtụtụ nke nwoke, ya mere e dere “ụmụnne ya ndị ikom” n'ederede bụ isi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: Mgbe ọ ka na-agwa ... okwu
  rationale: Nke a na-egosipụta na omume ahụ ka na-aga n'ihu ma na-edobe njikọ oge nke genitive absolute; δέ bụ naanị mgbanwe akụkọ dị nro, ya mere a naghị amanye ‘ma’ n'Igbo.
- source_word: τοῖς ὄχλοις
  choice: ìgwè mmadụ
  rationale: Ọ bụ ezie na Grik ji ọtụtụ, ‘ìgwè mmadụ’ bụ ụzọ Igbo dị ndụ na nke doro anya isi kpọọ ndị mmadụ gbakọtara ọnụ, na-enweghị iji okwu ochie ma ọ bụ nke siri ike.
- source_word: ἰδοὺ
  choice: lee
  rationale: ‘Lee’ na-adọta uche onye na-agụ gaa n'ihe ọhụrụ mere ma na-echekwa ike akụkọ nke ἰδού.
- source_word: ἡ μήτηρ
  choice: nne ya
  rationale: Ihe gbara ya gburugburu na-egosi onye nwe ya; ‘nne ya’ bụ Igbo nkịtị ma doo anya.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ụmụnne ya ndị nwoke
  rationale: ἀδελφοί bụ ụdị ọtụtụ nke nwoke. ‘Ụmụnne ya ndị nwoke’ na-egosipụta nke a kpọmkwem, ebe ‘ụmụnne’ naanị ya nwere ike ịgụnye nwoke na nwanyị n'Igbo.
- source_word: εἱστήκεισαν
  choice: guzo
  rationale: Ụdị ahụ na-egosi ọnọdụ ha nọgidere na ya; ‘guzo’ na-enye nke a n'Igbo n'ụzọ dị mfe ma dị ndụ.
- source_word: ἔξω
  choice: n'èzí
  rationale: Nke a na-asụgharị naanị ihe e kwuru, na-agbakwụnyeghị ‘ụlọ’ nke adịghị n'amaokwu a.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: na-achọ ịgwa ya okwu
  rationale: ‘Na-achọ’ na-echekwa ebumnuche dị na ζητοῦντες, ebe ‘ịgwa ya okwu’ bụ ụzọ Igbo nkịtị isi kwuo αὐτῷ λαλῆσαι.
theological_decisions:
- issue: Mmekọrịta ndị a kpọrọ ἀδελφοί na Jizọs
  choice: ụmụnne ya ndị nwoke
  alternative: ndị ikwu ya; ụmụnne ya
  rationale: Isi okwu Grik bụ ọtụtụ nke nwoke, ya mere ederede bụ isi na-asụgharị ya dịka ụmụnne ndị nwoke. Ihe odide ahụ anaghị ekpebi kpọmkwem ụdị mmekọrịta ezinụlọ ha, ya mere nkọwa ala peeji na-edobe ohere sara mbara nke okwu ahụ n'ọnọdụ ụfọdụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘lee’ iji chekwaa mkpali akụkọ, ma zere ịgbakwụnye ebe kpọmkwem dịka ‘ụlọ’ nke isi mmalite ekwughị.
