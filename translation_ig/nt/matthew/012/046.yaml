- from: Mgbe ọ ka na-agwa ìgwè mmadụ okwu, lee, nne ya na ụmụnne ya ndị nwoke[a] guzo n'èzí, na-achọ ịgwa ya okwu.
  to: Mgbe ọ ka na-agwa ìgwè mmadụ okwu, lee, nne ya na ụmụnne ya ndị ikom[a] guzo n'èzí, na-achọ ịgwa ya okwu.
  rationale: A gbanwere naanị “ụmụnne ya ndị nwoke” ka ọ bụrụ “ụmụnne ya ndị ikom” iji mee ka asụsụ Igbo bụrụ nke eke karịa, ebe a ka na-egosipụta ọtụtụ nwoke nke ἀδελφοί. E debere ihe niile ọzọ n'ihi na ha na-esochi isi Grik nke ọma.
  reviewer_model: gpt-5.6-terra
