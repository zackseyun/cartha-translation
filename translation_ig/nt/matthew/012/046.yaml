review_pass:
  verdict: revise
  source_fidelity: The temporal genitive absolute, the attention marker ἰδού, the continuing posture outside, and the purposeful desire to speak to him are all represented accurately. The translation appropriately does not add an unstated location such as a house.
  naturalness: The verse is clear Standard Igbo. However, “ụmụnne ya ndị nwoke” is understandable but somewhat calqued and less idiomatic than “ụmụnne ya ndị ikom” for explicitly male siblings.
  terminology: “Nne ya,” “n'èzí,” “lee,” and “ịgwa ya okwu” are suitable and dignified. The revised wording retains the Greek masculine-plural presentation of ἀδελφοί without deciding the later question of their precise familial relationship.
  issues:
  - severity: low
    issue: The phrase “ụmụnne ya ndị nwoke” is stylistically awkward in contemporary Standard Igbo.
    rationale: “Ụmụnne ya ndị ikom” more naturally identifies the referents as male siblings while retaining the source text's masculine plural. This is a linguistic refinement, not a theological reinterpretation.
  revised_text: Mgbe ọ ka na-agwa ìgwè mmadụ okwu, lee, nne ya na ụmụnne ya ndị ikom[a] guzo n'èzí, na-achọ ịgwa ya okwu.
