id: MAT.12.23
reference: Matthew 12:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: ig
  text: Ìgwè mmadụ niile wee ju anya, na-asị, “Onye a ọ̀ pụrụ ịbụ Nwa Devid?”[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nwa Devid” bụ aha e ji mara Mesaya, ya bụ, onye nzọpụta na eze e kwere ná nkwa nke ga-esi n’agbụrụ Devid pụta.
    reason: cross_reference
  - marker: b
    text: 'Ma ọ bụ, n’ụzọ na-egosipụta ike ajụjụ ahụ kpọmkwem karị: “N’ezie, onye a abụghị Nwa Devid, ka ọ bụ?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: ju anya
  rationale: Nke a na-egosipụta oke ịtụnanya ìgwè mmadụ ahụ n'ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a; ọdịdị imperfect na-egosi na mmeghachi omume ahụ nọ na-aga n'ihu.
- source_word: πάντες οἱ ὄχλοι
  choice: Ìgwè mmadụ niile
  rationale: Nhọrọ a na-edobe echiche nke mmadụ niile nọ n’ìgwè ndị ahụ, ma na-ada nke ọma n’Igbo karịa ịmanye ọtụtụ nke ὄχλοι n’ụzọ na-adịghị eke.
- source_word: ἔλεγον
  choice: na-asị
  rationale: Ụdị a na-egosipụta okwu na-aga n’ihu ma ọ bụ nke ọtụtụ mmadụ nọ na-ekwughachi, dịka imperfect Grik si dị.
- source_word: Μήτι
  choice: ọ̀ pụrụ ịbụ
  rationale: Ajụjụ a na-egosipụta obi abụọ na ịtụnanya, ma na-ahapụ ike ajụjụ Μήτι—nke nwere ike ịtụ anya azịza na-adịghị mma—ka nkọwa ụkwụ kọwaa ya.
- source_word: ὁ υἱὸς Δαυίδ
  choice: Nwa Devid
  rationale: Aha a na-edobe okwu e ji mara Mesaya n’ụdị ya kpọmkwem, kama ịkọwa ya ozugbo dịka “Mesaya.”
theological_decisions:
- issue: Ike Mesaya dị n’okwu ὁ υἱὸς Δαυίδ
  choice: Nwa Devid
  alternative: Mesaya; onye nketa Devid e kwere ná nkwa
  rationale: E debere aha ahụ dịka isi mmalite si kwuo ya, ka a ghara idozi ihe ọ pụtara n’ụzọ nkọwa n’ime amaokwu ahụ; nkọwa ụkwụ na-akọwa ihe aha ahụ na-egosi.
- issue: Ụdị ajụjụ Μήτι
  choice: Onye a ọ̀ pụrụ ịbụ Nwa Devid?
  alternative: N’ezie, onye a abụghị Nwa Devid, ka ọ bụ?
  rationale: Isi okwu ahụ na-egosipụta ma ịtụnanya ma obi abụọ, ma ọ naghị egosi nkwupụta siri ike. Isi nsụgharị na-ahapụ ajụjụ ahụ ka ọ bụrụ nke mmadụ na-echegharị, ebe nkọwa ụkwụ na-echekwa ụzọ ka kpọmkwem nke nwere atụmanya azịza na-adịghị mma.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ìgwè mmadụ niile” bụ ụzọ eke isi gosi πάντες οἱ ὄχλοι; “na-asị” na-echekwa mmetụta imperfect. E debere akara nkọwa ụkwụ n’usoro [b][a] dịka o si dị na consultation layer.
