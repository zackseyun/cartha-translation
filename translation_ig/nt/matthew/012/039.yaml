id: MAT.12.39
reference: Matthew 12:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: ig
  text: Ma ọ zara ha sị, “Ọgbọ ọjọọ na nke na-akwa iko[a] na-achọ ihe ịrịba ama, ma a gaghị enye ya ihe ịrịba ama ọ bụla ma e wezụga ihe ịrịba ama Jona onye amụma.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nke na-akwa iko” nwere ike ịkpọlite echiche nke ekwesịghị ntụkwasị obi n'ọgbụgba ndụ ya na Chineke, tinyere echiche nkịtị nke mmehie mmekọahụ; tulee otú ndị amụma si eji oyiyi ịkwa iko ekwu maka ekwesịghị ntụkwasị obi ime mmụọ.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsụgharị ya, “ihe ịrịba ama nke onye amụma Jona.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: ọ zara ha sị
  rationale: Nke a na-egosipụta ma ‘ịza’ ma ‘ịsị’ dị n'usoro okwu Grik ahụ, ma na-ada ka Igbo nkịtị.
- source_word: Γενεὰ
  choice: ọgbọ
  rationale: ‘Ọgbọ’ na-egosi otu ndị dịkọrọ ndụ e ji àgwà omume ha mara, dịka aha otu dị n'ọnụọgụ otu na Grik.
- source_word: πονηρὰ
  choice: ọjọọ
  rationale: ‘Ọjọọ’ bụ okwu Igbo doro anya ma dị arọ nke ọma maka ikpe omume dị n'okwu a.
- source_word: μοιχαλὶς
  choice: nke na-akwa iko
  rationale: Nhọrọ a na-edobe oyiyi siri ike nke ịkwa iko, nke nwere ike ịgụnye ma mmehie mmekọahụ ma ekwesịghị ntụkwasị obi nye Chineke, kama ịkọwa ya naanị n'otu ụzọ.
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: Nke a bụ nsụgharị sara mbara ma kwụ ọtọ; etinyeghị ‘ọrụ ebube’ n'ihi na okwu Grik n'onwe ya akọwaghị ya kpọmkwem.
- source_word: ἐπιζητεῖ
  choice: na-achọ
  rationale: ‘Na-achọ’ na-enye isi okwu ahụ n'ụzọ dị mfe ma kwekọọ n'ọnọdụ ahụ, na-agbakwụnyeghị echiche siri ike dịka ‘na-amanye ka e nye ya.’
- source_word: δοθήσεται
  choice: a gaghị enye
  rationale: Usoro a na-egosipụta ọdịnihu nke olu nnara dị na Grik n'Igbo dị ugbu a ma dị mma.
- source_word: αὐτῇ
  choice: ya
  rationale: ‘Ya’ na-alaghachi n'okwu ‘ọgbọ’ dị n'ọnụọgụ otu n'ụzọ Igbo nkịtị.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: N'ime ahịrịokwu njụ a, okwu a na-egosipụta nanị ihe e wepụrụ n'iwu ahụ nke ọma.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: ihe ịrịba ama Jona onye amụma
  rationale: Nhọrọ a na-agbaso usoro okwu Grik nso ma na-ahapụ ụdị na ihe ihe ịrịba ama Jona bụ ka amaokwu ndị na-esote kọwaa ya.
theological_decisions:
- issue: Ihe ‘nke na-akwa iko’ pụtara n'ikpe Jizọs kwuru
  choice: E debere okwu oyiyi nke ịkwa iko n'ahịrịokwu bụ isi.
  alternative: nke na-ekwesịghị ntụkwasị obi
  rationale: Okwu Grik ahụ nwere ike ịkpọlite oyiyi ndị amụma ji ịkwa iko kọwaa ekwesịghị ntụkwasị obi n'ọgbụgba ndụ, ma ọ ka bụkwa ebubo omume. Nsụgharị ahụ ekwesịghị ikpebi naanị otu n'ime nghọta abụọ ahụ.
- issue: Ụdị ‘ihe ịrịba ama Jona’
  choice: A hapụrụ nkebiokwu ahụ n'echiche okwu ya n'enweghị nkọwa agbakwunyere n'ahịrịokwu bụ isi.
  alternative: ihe ịrịba ama yiri ihe mere Jona; Jona n'onwe ya dịka ihe ịrịba ama
  rationale: Amaokwu a anaghị akọwa kpọmkwem ụdị ihe ịrịba ama ahụ; ebe gbara ya gburugburu, karịchaa amaokwu na-esote, ga-eme ka ihe ọ pụtara pụta ìhè.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere usoro ‘ọ zara ha sị’ iji chekwaa ihe abụọ dị n'okwu Grik n'enweghị ime ka Igbo sie ike. E tinyere akara nkọwa n'akụkụ okwu ha na-akọwa; nke a na-edozi enweghị nkwekọrịta dị n'etiti ebe akara [a]/[b] pụtara na consultation layer Bekee na ọdịnaya nkọwa ala peeji ha.
