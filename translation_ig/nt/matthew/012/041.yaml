id: MAT.12.41
reference: Matthew 12:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: ig
  text: Ndị ikom Ninive ga-ebili n’ikpe ahụ ya na ọgbọ a, ha ga-ama ọgbọ a ikpe; n’ihi na ha chegharịrị na nzaghachi nye nkwusa Jona.[a] Ma lee, ihe karịrị Jona nọ n’ebe a.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe a kwusara ha ozi Jona.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye karịrị Jona nọ n’ebe a.” Grik ji okwu neuter mee ihe, nke pụtara n’ụzọ nkịtị “ihe karịrị Jona”; nke a nwere ike imesi eziokwu ka ukwuu dị n’ime Jizọs ike, ọ bụghị naanị ntụnyere mmadụ abụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Ndị ikom Ninive
  rationale: Nke a na-edobe aha nwoke dị na ἄνδρες ma na-egosikwa na ha bụ ndị Ninive, n’Igbo doro anya ma kwụ ọtọ.
- source_word: ἀναστήσονται
  choice: ga-ebili
  rationale: “Ga-ebili” na-edobe ihe oyiyi nke ibili n’oge ikpe, tinyere ohere nke echiche mbilite n’ọnwụ, n’emeghị ka ihe ederede kwuru gafee ókè.
- source_word: ἐν τῇ κρίσει
  choice: n’ikpe ahụ
  rationale: Nke a na-ezo aka n’ikpe ikpeazụ ahụ dị ka ihe omume a maara, ma na-anọgide nso n’usoro Grik.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: ha na ọgbọ a
  rationale: μετά na genitive pụtara “na/ya na”; ike nke mmegide pụtara ìhè n’okwu na-esote banyere ịma ọgbọ ahụ ikpe.
- source_word: κατακρινοῦσιν αὐτήν
  choice: ha ga-amakwa ya ikpe
  rationale: “Ịma ... ikpe” bụ ụzọ Igbo kwụ ọtọ si egosi ikpe ọmụma; “ya” na-alaghachi n’ọgbọ a.
- source_word: μετενόησαν
  choice: ha chegharịrị
  rationale: “Chegharịrị” bụ okwu Igbo sitere n’ọnọdụ a na-egosi nchegharị na ntụgharị n’ihi ozi onye amụma.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: n’ihi nkwusa Jona
  rationale: Nke a na-egosi na nchegharị ha bụ nzaghachi nye ozi Jona. Ihe odide ala peeji na-edobe ụzọ ọzọ si kwuo njikọ ahụ kpọmkwem.
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: “Lee” na-adọta uche onye na-agụ ma na-edobe ike na ịdị nsọ nke okwu ἰδού.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: ihe karịrị Jona nọ n’ebe a
  rationale: “Ihe karịrị Jona” na-edobe ụdị neuter nke πλεῖον na mgbagwoju anya ya, kama ịgbanwe ya ozugbo ka ọ bụrụ naanị “onye ka Jona ukwuu.”
theological_decisions:
- issue: Otu e si akọwa πλεῖον Ἰωνᾶ dịka okwu Jizọs banyere onwe ya
  choice: ihe karịrị Jona nọ n’ebe a
  alternative: onye karịrị Jona nọ n’ebe a
  rationale: Grik jiri okwu neuter πλεῖον, ya mere “ihe karịrị Jona” na-edobe ohere na okwu ahụ na-ezo aka n’eziokwu ka ukwuu dị n’ime Jizọs na ozi ya, ọ bụghị naanị ntụnyere mmadụ abụọ.
- issue: Ichekwa nwoke kpọmkwem n’okwu ἄνδρες
  choice: ndị ikom
  alternative: ndị mmadụ
  rationale: ἄνδρες bụ aha nwoke kpọmkwem; “ndị ikom” na-ezere ime ka ọ bụrụ okwu gbasara mmadụ niile n’enweghị ihe odide kwadoro ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “n’ikpe ahụ” maka ọnọdụ ikpeazụ, “chegharịrị” maka nchegharị, na “ihe karịrị Jona” iji chekwaa ụdị okwu Grik na mgbagwoju anya nkà mmụta okpukpe ya.
