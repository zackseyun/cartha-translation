    reason: alternative_reading
  revision_rationale: The revision makes the association with ‘this generation’ idiomatic, renders repentance as a response to Jonah’s proclamation, and clarifies the object of condemnation. It otherwise preserves the draft’s faithful gender-specific wording, judicial register, and deliberate neuter ambiguity in the final clause.
