  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: ig
  text: Mgbe ahụ, otu onye gwara ya[a], sị, “Lee, nne gị na ụmụnne gị ndị nwoke guzo n’èzí, na-achọ ịgwa gị okwu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ odide aka enweghị amaokwu a.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: Mgbe ahụ, otu onye gwara ya
  rationale: δέ bụ njikọ akụkọ na-adịghị egosi nnukwu mmegide; “Mgbe ahụ” na-eme ka akụkọ na-aga n’ihu n’Igbo eke. τις bụ onye a na-akọwaghị, ya mere “otu onye” dabara adaba.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: “Lee” bụ okwu Igbo a na-eji adọta uche mmadụ, ma ọ ka bụ okwu dị ugbu a ma dịkwa ùgwù.
- source_word: ἡ μήτηρ σου
  choice: nne gị
  rationale: Nke a na-egosipụta kpọmkwem ihe okwu Grik ahụ pụtara.
- source_word: οἱ ἀδελφοί σου
  choice: ụmụnne gị ndị nwoke
  rationale: ἀδελφοί n’ebe a na-ezo aka n’ụmụnne nwoke Jizọs; ịgbakwunye “ndị nwoke” na-ewepụ mgbagwoju anya nke “ụmụnne” n’Igbo, nke pụrụ ịgụnye nwoke na nwaanyị.
- source_word: ἔξω ἑστήκασιν
  choice: guzo n’èzí
  rationale: “Guzo” na-egosi ọnọdụ ha nọ na ya ugbu a, ebe “n’èzí” na-echekwa ἔξω n’ụzọ doro anya.
- source_word: ζητοῦντές
  choice: na-achọ
  rationale: “Na-achọ” na-echekwa echiche nke ζητέω na ụdị nkebiokwu na-aga n’ihu, n’enweghị ịkọwa ebumnuche ha karịa ihe isi mmalite kwuru.
- source_word: σοι λαλῆσαι
  choice: ịgwa gị okwu
  rationale: Nke a bụ ụzọ Igbo eke na nke doro anya isi kwuo “ịgwa gị okwu,” ma na-echekwa onye a na-agwa okwu ahụ.
theological_decisions:
- issue: Ọnọdụ ederede nke Matiu 12:47
  choice: Itinye amaokwu ahụ n’ederede bụ isi dịka SBLGNT e nyere si dị, ma tinye nkọwa ala peeji banyere ndị odide aka na-enweghị ya.
  alternative: Ịhapụ amaokwu ahụ n’ihi na ọ dịghị n’ụfọdụ ndị odide aka.
  rationale: Ebe isi mmalite SBLGNT e nyere nwere amaokwu ahụ, a tụgharịrị ya dịka e nyere ya. Nkọwa ala peeji na-eme ka ọdịiche dị n’etiti ndị odide aka pụta ìhè kama izochi ya ma ọ bụ kpebie okwu ahụ n’enweghị ihe akaebe.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke doro anya ma dị ùgwù. “Ụmụnne gị ndị nwoke” na-akọwapụta okike ndị a kpọrọ aha n’isi mmalite, ebe “Lee” na-echekwa ike okwu ịdọta uche n’enweghị iji asụsụ ochie.
