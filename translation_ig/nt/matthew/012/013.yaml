    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “dị mma dịka nke ọzọ”; “nke ọzọ” na-ezo aka n’aka nke ọzọ nke nwoke ahụ.
    reason: lexical_alternative
  revision_rationale: The revision substitutes the more idiomatic “gbatịa” for the command and response, and it combines restoration with the resulting healthy comparison in a form that follows the Greek syntax and sense without overinterpreting the healing.
