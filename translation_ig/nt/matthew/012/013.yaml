  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: ig
  text: Mgbe ahụ, ọ gwara nwoke ahụ, “Gbatịa aka gị.” Ọ gbatịrị ya, e weghachirikwa aka ahụ n’ọnọdụ dị mma[a] dịka aka nke ọzọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a gwọrọ ya.” Okwu Grik ahụ na-emesi iweghachi ihe n’ọnọdụ kwesịrị ekwesị ike.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “dị mma dịka nke ọzọ”; “nke ọzọ” na-ezo aka n’aka nke ọzọ nke nwoke ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi usoro ihe ndị mere n’akụkọ ahụ n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: λέγει
  choice: ọ gwara
  rationale: Ọ bụ ezie na Grik ji oge ugbu a mee ka akụkọ dị ndụ, oge gara aga bụ ụzọ Igbo si akọ akụkọ a n'ụzọ kachasị eke.
- source_word: τῷ ἀνθρώπῳ
  choice: nwoke ahụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’otu nwoke a kpọtụrụ aha n’ihe gbara amaokwu ahụ gburugburu.
- source_word: Ἔκτεινόν
  choice: Setịa
  rationale: Ọ bụ iwu kpọmkwem ka nwoke ahụ gbatịa aka ya; “setịa” bụ okwu Igbo doro anya maka mmegharị ahụ.
- source_word: σου τὴν χεῖρα
  choice: aka gị
  rationale: χείρ pụtara “aka” n’ebe a, nke kwekọrọ n’ọnọdụ ọgwụgwọ ahụ.
- source_word: ἐξέτεινεν
  choice: O setịkwara ya
  rationale: Nhọrọ a na-edobe mmegharị okwu dị n’etiti iwu ahụ na nrubeisi nwoke ahụ, ma “ya” na-eme ka ihe a setịrị doo anya.
- source_word: ἀπεκατεστάθη
  choice: e weghachikwara aka ahụ n’ọnọdụ ọma
  rationale: Okwu a na-emesi iweghachi ihe n’ọnọdụ kwesịrị ekwesị ike, ọ bụghị naanị ikwu n’ozuzu na a gwọrọ ya.
- source_word: ὑγιὴς
  choice: dị mma
  rationale: N’ihe gbasara akụkụ ahụ, “dị mma” bụ Igbo eke nke na-egosi na aka ahụ gbasiri ike ma ghara inwe nkwarụ.
- source_word: ὡς ἡ ἄλλη
  choice: dịka aka nke ọzọ
  rationale: Ọdịdị nwanyị nke okwu Grik ahụ na-ezo aka n’aka nke ọzọ; ịkpọ “aka” aha na-eme ka ntụaka ahụ doo anya n’Igbo.
theological_decisions:
- issue: Ụdị nkọwa e nyere maka ọgwụgwọ ahụ
  choice: A kọwara na e weghachiri aka nwoke ahụ n’ọnọdụ ọma, ọ dịkwa mma dịka aka nke ọzọ.
  alternative: A gwọrọ aka ahụ; ma ọ bụ, e mere ka aka ahụ zuo oke.
  rationale: Nhọrọ a na-edobe isi echiche ἀπεκατεστάθη banyere iweghachi ihe n’ọnọdụ kwesịrị ekwesị, na-agbakwụghị nkọwa ozizi ọzọ na-adịghị n’amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ usoro akụkọ eke n’Igbo ma debe nkwughachi nke iwu ahụ na ihe nwoke ahụ mere.
