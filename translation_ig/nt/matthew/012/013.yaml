review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the command, the man's response, restoration, health, and comparison with the other hand. The passive restoration and the health/comparison result are better expressed as one integrated result, matching the Greek clause more closely.
  naturalness: “Gbatịa” is the more ordinary Standard Igbo imperative for extending a hand in this context. “E weghachiri aka ahụ n’ọnọdụ dị mma dịka aka nke ọzọ” is smoother and avoids the somewhat repetitive sequence “e weghachikwara ... o wee dị mma.”
  terminology: “Aka,” “weghachiri,” and “n’ọnọdụ dị mma” appropriately convey χείρ, ἀποκαθίστημι, and ὑγιής without adding doctrinal interpretation. The explicit “aka” in the comparison rightly clarifies the implied feminine referent.
  issues:
  - severity: low
    issue: The command and response use the less idiomatic verb “setịa.”
    rationale: Although understandable, “gbatịa” is more natural Standard Igbo for stretching or extending one's hand and preserves the verbal correspondence between Jesus’ command and the man’s action.
  - severity: low
    issue: The restoration and healthy-as-the-other result are rendered as two somewhat redundant clauses.
    rationale: The Greek presents the hand as restored, healthy as the other. Integrating these elements yields a closer and more natural Igbo rendering.
  revised_text: Mgbe ahụ, ọ gwara nwoke ahụ, “Gbatịa aka gị.” Ọ gbatịrị ya, e weghachirikwa aka ahụ n’ọnọdụ dị mma[a] dịka aka nke ọzọ[b].
  revised_footnotes:
