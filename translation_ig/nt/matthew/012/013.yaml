revisions:
- from: Mgbe ahụ, ọ gwara nwoke ahụ, “Setịa aka gị.” O setịkwara ya; e weghachikwara aka ahụ n’ọnọdụ ọma[a], o wee dị mma dịka aka nke ọzọ[b].
  to: Mgbe ahụ, ọ gwara nwoke ahụ, “Gbatịa aka gị.” Ọ gbatịrị ya, e weghachirikwa aka ahụ n’ọnọdụ dị mma[a] dịka aka nke ọzọ[b].
  rationale: The revision substitutes the more idiomatic “gbatịa” for the command and response, and it combines restoration with the resulting healthy comparison in a form that follows the Greek syntax and sense without overinterpreting the healing.
  reviewer_model: gpt-5.6-terra
