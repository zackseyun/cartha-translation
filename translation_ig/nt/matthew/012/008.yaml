  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: ig
  text: N’ihi na Nwa nke Mmadụ bụ Onyenwe ụbọchị izu ike[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nwa nke Mmadụ bụ onye na-achị ụbọchị izu ike.”
    reason: lexical_alternative
  - marker: b
    text: “Nwa nke Mmadụ” bụ aha Jizọs ji akpọ onwe ya ugboro ugboro n’Oziọma. A pụkwara ịsụgharị ya n’ụzọ izugbe dịka “onye ahụ bụ mmadụ,” ma nke ahụ ga-eme ka ụda aha pụrụ iche o yiri ka o nwere daa mbà.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: N’ihi na
  rationale: Na-egosipụta na okwu a bụ nkọwa ma ọ bụ ihe kpatara arụmụka dị n’amaokwu ndị bu ya ụzọ.
- source_word: κύριος
  choice: Onyenwe
  rationale: Na-echekwa echiche nke onye nwere ikike na ịdị arọ nke aha a n’ebe Kraịst nọ; ọ karịrị nanị ịsị ‘onyeisi.’
- source_word: τοῦ σαββάτου
  choice: Ụbọchị Izu Ike
  rationale: Ọ bụ ụzọ doro anya ma bụrụkwa nke ndị Igbo na-aghọta maka ụbọchị nsọ ndị Juu a na-akpọ Sabbath; njikọ ya na ‘Onyenwe’ na-echekwa usoro genitiv nke Grik.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Na-echekwa aha Jizọs ji akpọ onwe ya n’Oziọma ndị ahụ na njikọ ya nwere ike inwe na Daniel 7, kama ime ya ka ọ bụrụ naanị okwu gbasara mmadụ n’ozuzu.
- source_word: ἐστιν
  choice: bụ
  rationale: Ọ bụ ngwaa njikọ dị mfe n’oge ugbu a; ọ dịghị mkpa ịgbatị ya.
theological_decisions:
- issue: Ike dị n’okwu κύριος ... τοῦ σαββάτου gbasara onye Kraịst bụ
  choice: Nwa nke Mmadụ bụ Onyenwe Ụbọchị Izu Ike.
  alternative: Nwa nke Mmadụ bụ onye na-achị Ụbọchị Izu Ike.
  rationale: ‘Onyenwe’ na-echekwa nkwupụta siri ike banyere ikike Jizọs n’ebe Sabbath nọ, n’etinyeghị nkọwa karịrị ihe ederede kwuru.
- issue: Nsụgharị ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 'Were ya dị ka aha pụrụ iche: ‘Nwa nke Mmadụ.’'
  alternative: onye ahụ bụ mmadụ
  rationale: Aha a bụ ụzọ Jizọs si akọwa onwe ya n’Oziọma ma nwee ụda amụma; nsụgharị nkịtị ga-eme ka ụda ahụ na esemokwu nkà mmụta okpukpe dị na ya daa mbà.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu, dee ya. E debere ‘Nwa nke Mmadụ’ na ‘Ụbọchị Izu Ike’ dị ka okwu ndị a maara n’asụsụ Baịbụl, ebe ‘Onyenwe’ na-echekwa ịdị arọ nke κύριος.
