  terminology: “Ise okwu,” “iti mkpu,” “olu ya,” and “n’okporo ámá” are suitable equivalents. The footnote offers legitimate alternatives for both the contentious verb and πλατεῖαι; its anchor is correctly placed after “tie mkpu.”
