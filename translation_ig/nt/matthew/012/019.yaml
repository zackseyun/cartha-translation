id: MAT.12.19
reference: Matthew 12:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: ig
  text: Ọ gaghị ese okwu ma ọ bụ tie mkpu[a], ọ dịghịkwa onye ga-anụ olu ya n’okporo ámá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ gaghị alụrịta ọgụ n’okwu ma ọ bụ tie mkpu, ọ dịghịkwa onye ga-anụ olu ya n’ámá ọha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρίσει
  choice: ga-ese okwu
  rationale: “Ise okwu” bụ ụzọ Igbo nkịtị si akọwa ịbanye n’esemokwu ma ọ bụ ịrụrịta ụka n’ụzọ na-akpata ọgba aghara; ọ dabara n’otú amaokwu a si egosi odibo ahụ dịka onye na-adịghị achọ ọgụ okwu.
- source_word: κραυγάσει
  choice: ga-eti mkpu
  rationale: “Iti mkpu” na-egosi iti olu ike n’ihu ọha, nke kwekọrọ na κραυγάζω ma na-echekwa ọdịiche ya na “ise okwu.”
- source_word: ἀκούσει τις
  choice: ọ dịghịkwa onye ga-anụ
  rationale: Nke a na-enye negetivu Grik ahụ n’ụzọ doro anya ma bụrụkwa Igbo e ji eme ihe kwa ụbọchị.
- source_word: ἐν ταῖς πλατείαις
  choice: n’okporo ámá
  rationale: πλατεῖαι na-ezo aka n’okporo ụzọ sara mbara ma ọ bụ ebe ọha na-agafe; “n’okporo ámá” bụ ntụgharị Igbo dị mfe ma kwekọọ n’ọnọdụ ọha ahụ.
- source_word: φωνὴν αὐτοῦ
  choice: olu ya
  rationale: “Olu ya” bụ ntụgharị kpọmkwem na nke ebumpụta ụwa nke φωνὴν αὐτοῦ n’ebe a.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: Ọ gaghị…ma ọ bụ…ọ dịghịkwa…
  rationale: Nhazi a na-echekwa usoro nkwusioru atọ nke Grik, ma na-ada nke ọma n’Igbo nke oge a.
theological_decisions:
- issue: Mmekọrịta ya na okwu e hotara banyere odibo Aịzaya na agwa Mesaya
  choice: A sụgharịrị amaokwu ahụ dịka nkọwa nke Mesaya onye na-adịghị ese okwu ma ọ bụ achọ igosipụta onwe ya site n’iti mkpu n’ihu ọha.
  alternative: A pụrụ iji okwu ndị ọzọ dị ka “ịrụrịta ụka” na “iti mkpu,” ma ọ bụ kọwaa πλατεῖαι dịka “ámá ọha.”
  rationale: Grik ahụ na-akọwa ịdị nwayọọ na enweghị ọchịchọ ime mkpọtụ nke odibo ahụ. Nsụgharị a anaghị eme ka ọ pụta na ọ dịghị mgbe ọ ga-ekwu okwu n’ihu ọha ma ọ bụ na ọ naghị eme ihe ọ bụla.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. “Ise okwu” na “iti mkpu” bụ okwu ndị nkịtị ga-aghọta, ebe “n’okporo ámá” na-egosi ebe ọha na-enweghị ịmanye ka πλατεῖαι bụrụ naanị ámá obodo.
