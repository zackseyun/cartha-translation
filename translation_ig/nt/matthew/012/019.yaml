  source_fidelity: 'The translation accurately conveys the three coordinated future negations: he will not engage in quarrelling, will not cry out, and no person will hear his voice in public thoroughfares. “Ise okwu” appropriately renders ἐρίζω in this context without expanding the statement into a claim of total silence.'
