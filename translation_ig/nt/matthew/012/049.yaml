  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: ig
  text: O wee setịpụ aka ya n’ebe ndị na-eso ụzọ ya nọ, sị, “Lee[a], nne m na ụmụnne m[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “Lekwa” ma ọ bụ “Hụ.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “ụmụnne” a dị n’ụdị nwoke ọtụtụ; e ji “ụmụnne” sụgharịa ya n’Igbo, n’ihi na okwu ahụ nwere ike ịgụnye nwoke na nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτείνας
  choice: wee setịpụ
  rationale: 'A sụgharịrị aorist participle ahụ dị ka omume sochiri ibe ya n’ụzọ Igbo si ada nke ọma: ọ setịpụrụ aka ya wee kwuo okwu.'
- source_word: χεῖρα
  choice: aka
  rationale: “Aka” bụ okwu Igbo nkịtị na nke ziri ezi maka χείρ n’ebe a, ebe a na-ekwu banyere mmegharị ahụ Jizọs mere.
- source_word: ἐπὶ
  choice: n’ebe … nọ
  rationale: N’ọnọdụ a, ἐπί na accusative na-egosi ebe mmegharị aka ahụ chere ihu; ahịrịokwu a na-egosipụta ntụziaka ahụ n’Igbo nkịtị.
- source_word: μαθητὰς
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị na-amụta ihe n’aka onye nkụzi ma na-eso ya, ya mere ọ na-echekwa mmekọrịta onye nkụzi na ndị na-eso ụzọ ya.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: “Lee” bụ okwu mkpọku uche dị nkenke ma sie ike, nke na-egosipụta ọrụ ἰδού n’ụzọ doro anya nye ndị na-agụ Igbo ugbu a.
- source_word: μήτηρ
  choice: nne
  rationale: Nke a bụ okwu ezinụlọ nkịtị kwekọrọ kpọmkwem na μήτηρ.
- source_word: ἀδελφοί
  choice: ụmụnne … ndị nwoke
  rationale: Ọ bụ ezie na “ụmụnne” n’Igbo nwere ike ịgụnye nwoke na nwanyị, mgbakwunye “ndị nwoke” na-echekwa ụdị nwoke ọtụtụ nke okwu Grik ahụ ma ghara ịgbasa ya ka ọ bụrụ ụmụnne nwoke na ụmụnne nwanyị.
theological_decisions:
- issue: Okwu ezinụlọ Jizọs ji kọwaa mmekọrịta ya na ndị na-eso ụzọ ya
  choice: 'E debere okwu ezinụlọ ndị a kpọmkwem: “nne m” na “ụmụnne m ndị nwoke.”'
  alternative: Ịsụgharị ya n’ozuzu dịka “ezinụlọ m” ma ọ bụ “ụmụnne m” na-enweghị igosi ụdị nwoke.
  rationale: Okwu ahụ ji aha ndị ezinaụlọ kpọmkwem mee ka njikọ dị n’etiti ndị na-eso ụzọ Jizọs na ezi na ụlọ ya pụta ìhè. Ịgbanwe ya ka ọ bụrụ naanị “ezinụlọ” ga-ebelata ike ihe atụ ahụ, ebe ịhapụ “ndị nwoke” nwere ike zoo nkọwa nwoke ọtụtụ dị n’ἀδελφοί.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “O wee setịpụ … sị” na-eme ka omume ahụ na okwu so ya na-aga were were; “ndị na-eso ụzọ” bụ okwu Baịbụl a maara nke ọma ma ka na-edo anya nye ndị nkịtị.
