    text: N’asụsụ Grik, “ụmụnne” a dị n’ụdị nwoke ọtụtụ; e ji “ụmụnne” sụgharịa ya n’Igbo, n’ihi na okwu ahụ nwere ike ịgụnye nwoke na nwanyị.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported explicit restriction “ndị nwoke” while retaining the concrete familial language and the Greek form’s grammatical information in a footnote. The rest of the draft is retained because it is faithful to the Greek and natural in Standard Igbo.
