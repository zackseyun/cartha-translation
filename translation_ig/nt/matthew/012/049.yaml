revisions:
- from: O wee setịpụ aka ya n’ebe ndị na-eso ụzọ ya nọ, sị, “Lee[a], nne m na ụmụnne m ndị nwoke[b].”
  to: O wee setịpụ aka ya n’ebe ndị na-eso ụzọ ya nọ, sị, “Lee[a], nne m na ụmụnne m[b].”
  rationale: The revision removes the unsupported explicit restriction “ndị nwoke” while retaining the concrete familial language and the Greek form’s grammatical information in a footnote. The rest of the draft is retained because it is faithful to the Greek and natural in Standard Igbo.
  reviewer_model: gpt-5.6-terra
