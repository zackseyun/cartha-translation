review_pass:
  verdict: revise
  source_fidelity: The gesture, its direction toward the disciples, the attention-getter, and the concrete kinship terms are represented faithfully. However, adding “ndị nwoke” to ụmụnne improperly turns the Greek grammatically masculine plural into an explicit claim that only male siblings are meant. The Greek form need not carry that restriction in this context.
  naturalness: “O wee setịpụ aka ya n’ebe ndị na-eso ụzọ ya nọ, sị” is natural Standard Igbo for the attendant gesture and ensuing speech. “Lee” is concise and suitably emphatic. By contrast, “ụmụnne m ndị nwoke” is less idiomatic in this saying and unnecessarily restrictive.
  terminology: “Ndị na-eso ụzọ” appropriately renders μαθητάς, and “nne” appropriately renders μήτηρ. Use the ordinary Igbo generic kinship term “ụmụnne m” for ἀδελφοί; its accompanying note can preserve the Greek grammatical detail without importing an exclusion absent from the source.
  issues:
  - severity: medium
    issue: The text renders ἀδελφοί as “ụmụnne m ndị nwoke.”
    rationale: The Greek masculine plural ἀδελφοί is grammatically masculine, but it is not the expression “male brothers” and can encompass a mixed group. Adding “ndị nwoke” narrows the reference beyond what the Greek requires. Igbo “ụmụnne” is the natural generic equivalent and preserves the source ambiguity.
  - severity: low
    issue: Footnote b describes the Greek form as though it lexically says “ụmụnne ndị nwoke.”
    rationale: The note should distinguish grammatical masculine form from an explicit lexical restriction to males, so that it accurately explains the source and matches the revised Igbo wording.
  revised_text: O wee setịpụ aka ya n’ebe ndị na-eso ụzọ ya nọ, sị, “Lee[a], nne m na ụmụnne m[b].”
  revised_footnotes:
