  text: ⸀ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: ig
  text: 'ka ihe e kwuru site na Aịzaya onye amụma wee mezuo[a], sị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe Aịzaya onye amụma kwuru.” N’asụsụ Grik, okwu e ji mee ihe pụtara n’ụzọ nkịtị “site na,” na-egosi na Aịzaya bụ onye e si na ya ziga ozi amụma ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka ... wee
  rationale: Ụdị a na-ewebata ebumnuche ma ọ bụ ihe si na ya pụta n’Igbo nke ọma, n’emeghị ka otu n’ime nghọta abụọ ahụ bụrụ naanị ya.
- source_word: πληρωθῇ
  choice: mezuo
  rationale: “Mezuo” bụ okwu Igbo doro anya maka usoro mmezu amụma Matiu ji eme ihe; njikọ “ka ... wee” na-egosipụta ọnọdụ nke subjunctive ahụ.
- source_word: τὸ ῥηθὲν
  choice: ihe e kwuru
  rationale: Nke a na-egosipụta participle ahụ dịka aha ma na-edokwa olu nnara nke okwu Grik ahụ.
- source_word: διὰ
  choice: site n’ọnụ
  rationale: N’Igbo, “site n’ọnụ” na-egosi nke ọma na Aịzaya bụ onye e si n’aka ya kwuo ozi ahụ, ma hapụkwa ohere ịghọta Chineke dịka onye bụ isi kwuru ya.
- source_word: Ἠσαΐου
  choice: Aịzaya
  rationale: Nke a bụ ụdị aha onye amụma ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: τοῦ προφήτου
  choice: onye amụma
  rationale: E debere nkọwa Aịzaya dịka onye amụma, dịka ọ dị n’akwụkwọ Grik.
- source_word: λέγοντος
  choice: sị
  rationale: “Sị” bụ ụzọ Igbo dị nkenke ma bụrụkwa eke isi webata okwu a ga-ehota n’amaokwu na-esote.
theological_decisions:
- issue: Ọrụ onye amụma n’iweta okwu ahụ
  choice: site n’ọnụ Aịzaya onye amụma
  alternative: nke Aịzaya onye amụma kwuru
  rationale: Nhọrọ a na-edobe echiche διά na genitive, ya bụ na ozi ahụ bịara site n’aka onye amụma, kama ime ka Aịzaya yie onye bụ isi mmalite ya.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ka ... wee” iji chekwaa ohere nke ebumnuche ma ọ bụ ihe si na ya pụta, họrọkwa “site n’ọnụ” iji mee ka echiche nke prophetic mediation daa nke ọma n’Igbo.
