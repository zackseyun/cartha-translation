id: MAT.12.35
reference: Matthew 12:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: ig
  text: Ezi mmadụ na-esite n’ezi akụ ya wepụta ezi ihe[b][a], onye ọjọọ na-esikwa n’ajọ akụ ya wepụta ihe ọjọọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “mmadụ” dị n’ụdị otu onye nwoke n’usoro ụtọasụsụ, ma n’ebe a otu onye ahụ na-anọchi anya mmadụ n’ozuzu ya.
    reason: lexical_alternative
  - marker: b
    text: Ihe ndị gbara amaokwu a gburugburu na-ekwu banyere okwu ọnụ; ya mere, “ezi ihe” na “ihe ọjọọ” nwere ike ịrụtụ aka karịsịa n’okwu mmadụ na-ekwu.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς
  choice: ezi
  rationale: “Ezi” bụ okwu Igbo doro anya maka ịdị mma n’omume; a jikwa ya mee ka nkwughachi nke ἀγαθός na ἀγαθά pụta ìhè.
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: “Mmadụ” dabara n’ἄνθρωπος nke e ji otu onye nọchite anya mmadụ n’ozuzu ya; ọ naghị etinye nkọwa nwoke naanị nke okwu Grik anaghị achọ n’ebe a.
- source_word: θησαυροῦ
  choice: akụ
  rationale: “Akụ” na-echekwa ihe atụ nke ihe bara uru a kwakọbara, nke e si na ya ewepụta ihe; “ụlọ nkwakọba ihe” ga-eme ka ihe atụ ahụ bụrụ ihe a na-ahụ anya gabiga ókè.
- source_word: ἐκβάλλει
  choice: wepụta
  rationale: “Wepụta” na-egosi mmegharị isi n’ime ihe pụta, ma na-ada nke ọma n’Igbo karịa ntụgharị siri ike dịka “tụpụ.”
- source_word: ἀγαθά
  choice: ezi ihe
  rationale: Adjective a bụ neuter plural e ji dịka noun; “ezi ihe” na-eme ka ihe e zoro ezo pụta ìhè ma na-ahapụ ya ka ọ gbasaa karịa naanị okwu ọnụ.
- source_word: πονηρὸς
  choice: ọjọọ
  rationale: “Ọjọọ” na-egosi ọdịiche omume siri ike megide “ezi,” ma na-adaba n’usoro ilu a haziri n’ahịrị abụọ.
- source_word: πονηρά
  choice: ihe ọjọọ
  rationale: Nke a na-anọchi substantival neuter plural ma na-echekwa nhata ya na “ezi ihe.”
- source_word: ἐκ
  choice: na-esite n’
  rationale: “Na-esite n’” na-egosi ebe ihe ahụ si apụta, ebe “wepụta” na-ebukwa echiche nke ịpụta n’èzí.
theological_decisions:
- issue: Ọdịiche omume mmadụ na ihe na-esi n’ime ya apụta n’ụdị ilu
  choice: E debere “ezi ihe” na “ihe ọjọọ” n’ụzọ sara mbara, dịka Grik si mee, ebe ihe atụ ahụ na-egosi na ihe mmadụ na-ewepụta na-esite n’akụ dị n’ime ya.
  alternative: Ịsụgharị ha kpọmkwem dịka “ezi okwu” na “okwu ọjọọ,” n’ihi na amaokwu ndị gbara ya gburugburu na-ekwu banyere okwu ọnụ.
  rationale: Ọ bụ ezie na ọnọdụ ozugbo na-elekwasị anya n’okwu ọnụ, Grik etinyeghị noun pụtara “okwu.” Ya mere, ederede bụ isi anaghị emechi ihe okwu ahụ pụtara naanị n’okwu ọnụ; ihe odide ala peeji na-egosi njikọ ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu abụọ ahụ nwere usoro yiri ibe ha iji chekwaa nhata na ọdịiche dị na Grik; a hapụrụ “ezi ihe/ihe ọjọọ” ka ọ bụrụ okwu sara mbara kama ịkọwa ya naanị dịka okwu ọnụ.
