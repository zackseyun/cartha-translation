  source_fidelity: 'Isi ederede na-atụgharị akụkụ niile nke Grik n’ụzọ ziri ezi: «Mgbe ahụ» maka Τότε, «ụfọdụ» maka τινες, «zara ya» maka ἀπεκρίθησαν αὐτῷ, na «ihe ịrịba ama» maka σημεῖον. «Sitere n’aka gị» na-ekwupụta nke ọma na a chọrọ ihe ịrịba ama nke si n’aka Jizọs bịa, n’agbanyeghị na ọ na-akọwa ntakịrị karịa naanị «site n’aka gị».'
  naturalness: Ahịrịokwu ahụ bụ Standard Igbo doro anya, dịkwa n’usoro akụkọ kwesịrị ekwesị. «Onye Ozizi» bụ ụzọ nkwanye ùgwù na nke a na-ahụkarị n’ụdị Akwụkwọ Nsọ.
  terminology: «Ndị odeakwụkwọ», «ndị Farisii», na «ihe ịrịba ama» dabara n’usoro okwu Akwụkwọ Nsọ Igbo. Ma n’ala ala okwu, «dị ebube» na-apụta ihe ‘glorious/splendid,’ ọ bụghị kpọmkwem ‘miraculous’; ya mere ọ naghị enye nhọrọ lexical nke bekee «miraculous sign» nke ọma.
  issues:
