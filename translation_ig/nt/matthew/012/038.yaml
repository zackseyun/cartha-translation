  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: ig
  text: Mgbe ahụ ụfọdụ ndị odeakwụkwọ na ndị Farisii zara ya, sị, “Onye Ozizi, anyị chọrọ ịhụ ihe ịrịba ama[a] sitere n’aka gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ịrịba ama ọrụ ebube.” Okwu Grik ahụ nwere ike ịpụta ihe ịrịba ama nke metụtara ọrụ ebube, ma isi ederede hapụrụ okwu ahụ n’ụdị sara mbara, “ihe ịrịba ama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe mere na-esote n’usoro akụkọ n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: zara ya
  rationale: Nke a na-echekwa echiche nke ịza ma ọ bụ imeghachi okwu, tinyere onye a na-agwa.
- source_word: τινες τῶν γραμματέων
  choice: ụfọdụ ndị odeakwụkwọ
  rationale: “Ụfọdụ” na-egosi na ọ bụghị ha niile; “ndị odeakwụkwọ” bụ aha a na-ejikarị akọwa ndị maara ma na-akụzi Iwu n’akụkọ Oziọma.
- source_word: καὶ Φαρισαίων
  choice: na ndị Farisii
  rationale: Aha otu ndị Juu a ka e dere n’ụdị a nabatara n’Igbo.
- source_word: λέγοντες
  choice: sị
  rationale: Ọ bụ ụzọ Igbo dị nkenke ma dịkwa ebumpụta ụwa isi webata okwu e kwuru kpọmkwem.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Ọ na-enye isi echiche nke onye na-akụzi n’etinyeghị echiche siri ike karịa nke okwu Grik ahụ.
- source_word: θέλομεν
  choice: anyị chọrọ
  rationale: Ọ na-egosipụta ọchịchọ ha n’Igbo nke oge a, n'ụzọ kwụ ọtọ.
- source_word: ἀπὸ σοῦ
  choice: sitere n’aka gị
  rationale: Ọ na-egosi na ihe ịrịba ama ahụ ga-esi n’aka Jizọs pụta ma ọ bụ bụrụ nke o mere.
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: Nke a na-echekwa obosara okwu Grik ahụ n’emeghị ka isi ederede kwuo kpọmkwem na ọ bụ ọrụ ebube.
- source_word: ἰδεῖν
  choice: ịhụ
  rationale: Ọ bụ ntụgharị kwụ ọtọ na nke ebumpụta ụwa nke ngwaa Grik ahụ.
theological_decisions:
- issue: Ụdị ihe σημεῖον na-ezo aka na ya
  choice: ihe ịrịba ama
  alternative: ihe ịrịba ama dị ebube / ọrụ ebube dịka ihe ịrịba ama
  rationale: N’ebe a, ihe a rịọrọ nwere ike ịbụ ọrụ ebube ga-egosi onye Jizọs bụ. Ma σημεῖον n’onwe ya pụtara “ihe ịrịba ama,” ya mere isi ederede na-ahapụ obosara na mgbagwoju okwu ahụ dịka Grik si mee.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ bụ nke Igbo ebumpụta ụwa, ebe a na-echekwa nkọwa bụ isi na ogo mgbagwoju dị n’asụsụ Grik.
