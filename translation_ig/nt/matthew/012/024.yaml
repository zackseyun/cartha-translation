  to: Ma mgbe ndị Farisii nụrụ ya, ha sịrị, “Nwoke a anaghị achụpụ ndị mmụọ ọjọọ ma ọ bụghị site n’aka Beelzebul[a], onye na-achị ndị mmụọ ọjọọ.”
  rationale: This limited revision improves Standard Igbo aspectual idiom while retaining the draft’s faithful rendering of the Greek accusation and its ambiguity concerning the precise mode of Beelzebul’s alleged agency.
