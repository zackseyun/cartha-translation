id: MAT.12.24
reference: Matthew 12:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: ig
  text: Ma mgbe ndị Farisii nụrụ ya, ha sịrị, “Nwoke a anaghị achụpụ ndị mmụọ ọjọọ ma ọ bụghị site n’aka Beelzebul[a], onye na-achị ndị mmụọ ọjọọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A na-akpọkarị Beelzebul “Beelzebub” n’ọdịnala.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti okwu ndị Farisii na mmeghachi omume dị mma e kwuru n’amaokwu bu ụzọ.
- source_word: ἀκούσαντες
  choice: mgbe ndị Farisii nụrụ ya
  rationale: A tụgharịrị participle a dị ka ihe mere n’oge ahụ; “ya” na-anọchi ihe ha nụrụ dịka ihe gbara amaokwu ahụ gburugburu si gosi.
- source_word: Οὗτος
  choice: Nwoke a
  rationale: Ọ na-edobe ụda nlelị dị n’okwu ndị Farisii karịa ịsị naanị “ọ.”
- source_word: ἐκβάλλει
  choice: achụpụ
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwu maka ịchụpụ ndị mmụọ ọjọọ.
- source_word: δαιμόνια
  choice: ndị mmụọ ọjọọ
  rationale: Ọ bụ okwu nkịtị ndị na-agụ Igbo taa na-aghọta nke ọma maka δαιμόνια n’ebe a.
- source_word: εἰ μὴ
  choice: ma ọ bụghị
  rationale: Ọ na-egosi na ndị Farisii kwuru na nke a bụ naanị ụzọ o si eme ya.
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: site n’aka Beelzebul
  rationale: ἐν na-egosi onye e kwuru na ọ bụ site n’aka ya ka omume ahụ si mee; ntụgharị a na-egosi agency n’Igbo n’etinyeghị nkọwa karịrị isiokwu Grik.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: E debere ọdịdị aha ahụ dị na SBLGNT; e tinyere ọdịdị ọdịnala “Beelzebub” n’okpuru peeji.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: onye na-achị ndị mmụọ ọjọọ
  rationale: Ọ na-egosi ikike onye ọchịchị ahụ nwere n’ụzọ doro anya ma dị mfe nghọta n’Igbo ugbu a.
theological_decisions:
- issue: Ụda nlelị dị na Οὗτος
  choice: Nwoke a
  alternative: Onye a; Ọ
  rationale: “Nwoke a” na-echekwa ụda mmegide na nlelị nke ndị Farisii n’etinyeghị nkọwa ozizi ọzọ.
- issue: Ọdịdị aha Βεελζεβούλ
  choice: Beelzebul
  alternative: Beelzebub
  rationale: Isi ederede na-agbaso kpọmkwem ọdịdị aha dị n’ihe odide Grik, ebe a na-edebe ọdịdị aha a maara n’ọdịnala n’okpuru peeji.
- issue: Ụzọ e si ghọta ἐν n’accusation ahụ
  choice: site n’aka Beelzebul
  alternative: site n’ike Beelzebul
  rationale: Nke a na-echekwa echiche nke agency ma ghara ịgbakwunye okwu “ike,” nke na-adịghị pụta ìhè n’ederede Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Nwoke a” na-edobe ụda mmegide ahụ, ebe “site n’aka” na-egosi onye e boro ebubo na ọ bụ ya nyere aka n’enweghị ịkọwa ihe karịrị ederede mbụ.
