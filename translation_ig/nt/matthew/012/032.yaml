id: MAT.12.32
reference: Matthew 12:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: ig
  text: Onye ọ bụla kwuo okwu megide Nwa nke Mmadụ[a], a ga-agbaghara ya; ma onye ọ bụla kwuo okwu megide Mmụọ Nsọ, a gaghị agbaghara ya—ọ bụghị n’oge a, ọ bụghịkwa n’oge na-abịa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kwuo otu okwu.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, nkebi ikpeazụ pụtara n’ụzọ nkịtị, “ọ bụghịkwa n’ime nke na-abịa,” ebe a ghọtara “oge” site na nkebi bu ya ụzọ. A pụkwara ịsụgharị ya, “ọ bụghịkwa n’oge nke ga-abịa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: onye ọ bụla nke ... ma onye ọ bụla nke
  rationale: Nke a na-egosipụta ọnọdụ zuru ụwa ọnụ nke na-emetụta onye ọ bụla, ma na-edobe ntụnyere dị n’etiti akụkụ abụọ ahụ.
- source_word: εἴπῃ λόγον
  choice: kwuru otu okwu
  rationale: Ọ na-edobe ma ngwaa ‘ikwu’ ma aha ‘okwu’ dị n’asụsụ Grik, n’ụzọ Igbo na-ada nke ọma.
- source_word: κατὰ
  choice: megide
  rationale: N’ebe a, κατά na-egosi okwu iro a na-ekwu megide mmadụ, ya mere ‘megide’ bụ okwu Igbo doro anya ma kwekọọ n’akụkụ abụọ ahụ.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: A hapụrụ aha nsọpụrụ a n’ụdị ya a maara nke ọma, ka ihe ọ pụtara n’ihe gbasara Mezaịa na ọhụụ banyere ọgwụgwụ oge ghara ịla n’iyi.
- source_word: ἀφεθήσεται αὐτῷ / οὐκ ἀφεθήσεται αὐτῷ
  choice: a ga-agbaghara ya / a gaghị agbaghara ya
  rationale: Usoro a na-edobe olu nnara nke Grik ma na-ada nke ọma n’Igbo, na-enweghị ịkọwapụta onye na-agbaghara n’ebe ederede ekwughị ya kpọmkwem.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha a na-ejikarị eme ihe n’Igbo nke oge a, ma ọ na-edobe aha nsọpụrụ dị na Grik.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι οὔτε ἐν τῷ μέλλοντι
  choice: ma n’oge a ma n’oge na-abịa
  rationale: ‘Oge’ na-egosipụta ọdịdị nke αἰών dịka oge ma ọ bụ ọgbọ, ọ bụghị ụwa dịka ebe. E mere ihe e zoro ezo na nkebi nke abụọ ka ọ pụta ìhè n’Igbo maka nghọta dị mfe.
theological_decisions:
- issue: Ntụnyere oge dị ugbu a na oge na-abịa
  choice: ma n’oge a ma n’oge na-abịa
  alternative: ma n’ụwa a ma n’ụwa na-abịa
  rationale: Grik na-atụnyere oge abụọ, ọ bụghị ụwa abụọ dịka ebe. Nsụgharị a na-edobe echiche banyere oge ikpeazụ n’emeghị ka ọ dabere n’usoro ozizi pụrụ iche.
- issue: Ụdị mmehie a na-agaghị agbaghara
  choice: Idobe ịdọ aka ná ntị banyere ikwu okwu megide Mmụọ Nsọ n’enweghị nkọwa ozizi agbakwunyere
  alternative: Ịkọwa ya dịka otu omume mere naanị n’oge ozi Jizọs, ma ọ bụ dịka enweghị nchegharị ruo ọnwụ
  rationale: Amaokwu a n’onwe ya ekwughị kpọmkwem ókè na ọdịdị mmehie ahụ niile. Ya mere, nsụgharị ahụ anaghị etinye nkọwa ozizi e mesịrị n’ime ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘otu okwu’ iji gosipụta λόγον, ‘oge’ iji chekwaa ọdịiche nke αἰών, ma jiri usoro ‘a ga-agbaghara ya’ dobe olu nnara nke Grik.
