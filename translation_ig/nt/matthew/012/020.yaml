revisions:
- from: Ọ gaghị agbaji amị e merụrụ emerụ, ọ gaghịkwa emenyụ ogho oriọna nke na-anwụrụ ọkụ[a], ruo mgbe o mere ka ikpe ziri ezi merie.[b]
  to: Ọ gaghị agbaji amị a chifọrọ achịfo, ọ gaghịkwa emenyụ ogho oriọna[a] na-ese anwụrụ, ruo mgbe ọ ga-eme ka ikpe ziri ezi merie.[b]
  rationale: The revision replaces an injury-oriented expression with one that reflects the Greek image of a crushed or bruised reed, makes the smoking-wick description more direct, clarifies the future endpoint of the clause, and moves footnote [a] to the term it actually explains. No doctrinal interpretation has been added.
