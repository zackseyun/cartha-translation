review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the twofold negation, the lamp-wick image, and the final outcome of justice's victory. However, “e merụrụ emerụ” means wounded/injured rather than the crushed or bruised condition denoted by συντετριμμένον. “A chifọrọ achịfo” more closely conveys the damaged, crushed-yet-not-snapped image.
  naturalness: The wording is generally clear Standard Igbo. “Ogho oriọna na-ese anwụrụ” is a more direct and natural expression for a smoking/smoldering lamp wick than “ogho oriọna nke na-anwụrụ ọkụ.” Adding “ga-” after “ruo mgbe” clearly marks the prospective culmination intended by ἕως ἂν with the subjunctive.
  terminology: '“Amị,” “ogho oriọna,” “emenyụ,” and “ikpe ziri ezi” are suitable. “Ikpe ziri ezi” appropriately renders κρίσις here as justice, while the footnote preserves “ikpe” as a viable alternative. The revised footnote corrects the attachment of the lexical alternative: it belongs with the wick phrase, not the reed phrase.'
  issues:
  - severity: medium
    issue: “e merụrụ emerụ” does not adequately render συντετριμμένον.
    rationale: It primarily describes injury or wounding. The Greek participle describes a reed that has been crushed/bruised; “a chifọrọ achịfo” better retains this physical metaphor without implying that it has already been fully broken.
  - severity: medium
    issue: Footnote [a] is attached to “na-anwụrụ ọkụ” but its content presents an alternative for λίνον/“wick.”
    rationale: The note should be anchored to “ogho oriọna,” the term for which it supplies “flax” as the lexical alternative. This restores a clear footnote anchor and matches the audit trail.
  - severity: low
    issue: The temporal clause can more explicitly express the future culmination.
    rationale: “Ruo mgbe ọ ga-eme ka … merie” naturally represents the prospective force of ἕως ἂν ἐκβάλῃ.
  revised_text: Ọ gaghị agbaji amị a chifọrọ achịfo, ọ gaghịkwa emenyụ ogho oriọna[a] na-ese anwụrụ, ruo mgbe ọ ga-eme ka ikpe ziri ezi merie.[b]
