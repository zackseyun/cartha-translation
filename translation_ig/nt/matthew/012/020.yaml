id: MAT.12.20
reference: Matthew 12:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: ig
  text: Ọ gaghị agbaji amị a chifọrọ achịfo, ọ gaghịkwa emenyụ ogho oriọna[a] na-ese anwụrụ, ruo mgbe ọ ga-eme ka ikpe ziri ezi merie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “flax na-ese anwụrụ, ka ọ gaghị emenyụ.” Okwu Grik ahụ na-ekwu maka flax e ji eme ogho oriọna.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ruo mgbe o mere ka ikpe nwee mmeri.”
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον
  choice: amị
  rationale: “Amị” bụ aha Igbo doro anya maka reed n’ihe atụ amụma a.
- source_word: συντετριμμένον
  choice: e merụrụ emerụ
  rationale: Nke a na-egosi na amị ahụ emebiela nke ukwuu ma ọ kaghị agbajisị kpamkpam; ya mere, ọ na-edobe ọdịiche dị n’etiti ọnọdụ ya na omume κατεάξει nke na-esochi.
- source_word: κατεάξει
  choice: ọ gaghị agbaji
  rationale: “Agbaji” na-egosi ime ka amị ahụ gbajie ma kwekọọ n’ụzọ nkịtị na ihe atụ ahụ.
- source_word: λίνον
  choice: ogho oriọna
  rationale: N’agbanyeghị na okwu Grik pụtara flax ma ọ bụ linen n’onwe ya, ebe a ọ na-ekwu maka ogho flax e ji eme ogho oriọna; nsụgharị a na-eme ka ihe a na-ekwu doo onye na-agụ oge a anya.
- source_word: τυφόμενον
  choice: nke na-anwụrụ ọkụ
  rationale: 'Nke a na-edobe ihe okwu Grik na-egosi kpọmkwem: ogho oriọna nke ọkụ ya na-esighị ike, nke na-enye anwụrụ ọkụ ma na-achọ ịnyụ.'
- source_word: σβέσει
  choice: ọ gaghịkwa emenyụ
  rationale: “Menyụ” bụ okwu Igbo nkịtị maka imenyụ ọkụ ma na-egosi ịdị nwayọọ nke Ohu ahụ.
- source_word: ἕως ἂν
  choice: ruo mgbe
  rationale: Nkebiokwu a na-egosi oge ihe ga-aga n’ihu ruo mgbe ihe a tụrụ anya ya mezuru.
- source_word: ἐκβάλῃ
  choice: o mere ka
  rationale: N’ebe a ἐκβάλλω abụghị ịtụpụ ihe n’ụzọ nkịtị, kama ọ bụ ime ka ikpe ziri ezi ruo ná nsonaazụ a chọrọ.
- source_word: εἰς νῖκος
  choice: merie
  rationale: Ụdị ngwaa a bụ okwu Igbo dị ndụ nke na-egosi na ikpe ziri ezi rutere ná mmeri.
- source_word: τὴν κρίσιν
  choice: ikpe ziri ezi
  rationale: κρίσις nwere ike ịbụ “ikpe” ma ọ bụ “ikpe ziri ezi.” N’okwu amụma banyere Ohu a, “ikpe ziri ezi” na-egosi ime ka usoro ziri ezi guzosie ike, ma a hapụrụ “ikpe” dị ka ntụgharị ọzọ.
theological_decisions:
- issue: Ihe κρίσις pụtara n’okwu amụma banyere Ohu ahụ
  choice: ikpe ziri ezi
  alternative: ikpe
  rationale: “Ikpe ziri ezi” na-enye echiche sara mbara banyere ime ka ihe Chineke chọrọ nke ziri ezi guzosie ike; “ikpe” ka nwekwara ike ịbụ ihe okwu Grik ahụ pụtara, ya mere e debere ya n’okpuru peeji.
- issue: Ogo nkọwa e nyere ihe atụ λίνον
  choice: ogho oriọna ... emenyụ
  alternative: flax ... emenyụ
  rationale: Isi okwu na-akọwa ihe a na-eji flax eme n’oriọna ka onye na-agụ ya ghọta ihe atụ ahụ ozugbo, ebe ndetu na-echekwa ihe okwu Grik pụtara n’ụzọ nkịtị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ “ogho oriọna” iji mee ka ihe atụ oriọna doo anya, ma “ikpe ziri ezi” na-echekwa echiche amụma ahụ n’enweghị itinye nkọwa otu ụka.
