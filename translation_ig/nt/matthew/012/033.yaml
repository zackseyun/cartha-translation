review_pass:
  verdict: revise
  source_fidelity: The draft preserves the Greek’s repeated plural aorist imperatives, the good/rotten antithesis, and the explanatory conclusion that a tree is known from its fruit. However, the final phrase “mkpụrụ osisi” can naturally mean “seeds” in Standard Igbo and does not clearly maintain καρπός as the fruit belonging to the tree. “Mkpụrụ ya” preserves the referential link and metaphor more accurately.
  naturalness: The main text is clear and appropriately formal in modern Standard Igbo. Replacing “site ná mkpụrụ osisi” with “site na mkpụrụ ya” is more idiomatic in this context and avoids a seed/fruit ambiguity. The alternative-reading footnote is also adjusted for complete, natural Igbo phrasing.
  terminology: “osisi,” “mkpụrụ,” “dị mma,” “rere ure,” and “a na-amata” are suitable renderings of δένδρον, καρπός, καλός, σαπρός, and γινώσκεται. “Rere ure” retains the concrete spoiled/corrupt image without reducing σαπρός to merely moral badness.
  issues:
  - severity: medium
    issue: “mkpụrụ osisi” in the concluding clause is ambiguous.
    rationale: In Standard Igbo, “mkpụrụ osisi” may readily be understood as seeds rather than the tree’s fruit. The Greek τοῦ καρποῦ αὐτοῦ refers back to the tree’s fruit; “mkpụrụ ya” makes that relationship explicit and preserves the metaphor.
  - severity: low
    issue: The wording of footnote b is incomplete/awkward in its proposed alternatives.
    rationale: “werenụ dịka” lacks a clear object and complement, and “gosinụ na ọ bụ” is left syntactically unfinished. Revising the note improves readability without changing its textual observation about the rhetorical force of ποιήσατε.
  revised_text: “Meenụ ka osisi ahụ dị mma, ka mkpụrụ ya dịkwa mma; ma ọ bụ meenụ ka osisi ahụ rere ure, ka mkpụrụ ya reekwa ure[a]; n’ihi na ọ bụ site na mkpụrụ ya ka a na-amata osisi ahụ.[b]”
