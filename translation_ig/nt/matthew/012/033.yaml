id: MAT.12.33
reference: Matthew 12:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: ig
  text: “Meenụ ka osisi ahụ dị mma, ka mkpụrụ ya dịkwa mma; ma ọ bụ meenụ ka osisi ahụ rere ure, ka mkpụrụ ya reekwa ure[a]; n’ihi na ọ bụ site na mkpụrụ ya ka a na-amata osisi ahụ.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị okwu Grik σαπρός dịka “dị njọ” ma ọ bụ “mebiri emebi”; ọ pụrụ ịpụta ihe rere ure, rụrụ arụ, ma ọ bụ nke na-abaghị uru.
    reason: lexical_alternative
  - marker: b
    text: Okwu “meenụ” e kwughachiri nwere ike ịbụ okwu ịma aka, n’echiche nke “werenụ osisi ahụ dị ka nke...” ma ọ bụ “gosinụ na osisi ahụ bụ...”; ma ụdị okwu Grik ahụ bụ iwu.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: meenụ ka ... dị / meenụ ka ... ree
  rationale: E debere ya dị ka iwu nye ọtụtụ mmadụ, dịka aorist imperative plural Grik si dị. Nhazi ‘meenụ ka’ na-edobe ike okwu ahụ n’agbanyeghị na n’ebe a ọ pụrụ ịbụ okwu ịma aka pụtara ‘werenụ ya dịka’ ma ọ bụ ‘gosinụ na ọ bụ.’
- source_word: δένδρον
  choice: osisi
  rationale: Nke a bụ okwu Igbo nkịtị maka tree, ọ na-edobekwa ihe atụ ahụ nke ọma.
- source_word: καλός
  choice: dị mma
  rationale: ‘Dị mma’ na-ekpuchi ịdị mma n’ọnọdụ na n’omume, n’ebughị ụzọ kpachie ya naanị n’ahụ ike.
- source_word: καρπός
  choice: mkpụrụ
  rationale: ‘Mkpụrụ’ bụ okwu ebumpụta ụwa n’Igbo maka fruit ma na-arụkwa ọrụ nke ọma dịka ihe atụ.
- source_word: σαπρός
  choice: rere ure
  rationale: ‘Rere ure’ na-egosipụta nke ọma ihe mebiri emebi ma ọ bụ rere ure; ọ na-edobe ịdị ndụ nke ihe oyiyi Grik karịa naanị ‘dị njọ.’
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: n’ihi na ọ bụ site ná mkpụrụ ... ka
  rationale: ‘N’ihi na’ na-egosi nkọwa γάρ, ebe usoro ‘site ná ... ka’ na-egosipụta ἐκ n’ụzọ Igbo doro anya.
- source_word: γινώσκεται
  choice: a na-amata
  rationale: 'Usoro a na-egosipụta present passive n’Igbo ebumpụta ụwa: a na-amata ma ọ bụ achọpụta ụdị osisi ahụ site ná mkpụrụ ya.'
- source_word: αὐτοῦ
  choice: ya
  rationale: ‘Ya’ bụ nnọchiaha Igbo kwesịrị ekwesị maka ihe na-abụghị mmadụ ma na-ezo aka n’osisi ahụ.
theological_decisions:
- issue: Ike iwu abụọ dị n’ihe atụ Jizọs
  choice: 'E debere ha dịka iwu kpọmkwem: ‘Meenụ ka...’'
  alternative: ‘Werenụ osisi ahụ dịka...’ ma ọ bụ ‘Gosinụ na osisi ahụ...’
  rationale: Grik ji aorist imperatives ugboro abụọ. Ọ bụ ezie na ha nwere ike ịbụ okwu ịma aka gbasara otú a ga-esi were ma ọ bụ gosipụta osisi ahụ, idebe ụdị iwu ahụ na-echekwa ịdị nkọ na mgbagwoju okwu nke mbụ.
- issue: Mmetụta σαπρός
  choice: ‘rere ure’
  alternative: ‘dị njọ’ ma ọ bụ ‘abaghị uru’
  rationale: Nhọrọ a na-echekwa ihe oyiyi osisi na mkpụrụ nke mebiri emebi, ma ọ naghị ewepụ ohere na okwu ahụ nwekwara echiche nke nrụrụ ma ọ bụ abaghị uru.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma doo ndị nkịtị anya. E ji usoro ntụnyere ‘ọ bụ ... ka’ mee ka ahịrị ikpeazụ bụrụ Igbo ebumpụta ụwa, ebe e debere ndakọrịta na ike iwu nke ahịrịokwu Grik.
