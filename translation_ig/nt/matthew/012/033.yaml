revisions:
- from: “Meenụ ka osisi ahụ dị mma, ka mkpụrụ ya dịkwa mma; ma ọ bụ meenụ ka osisi ahụ rere ure, ka mkpụrụ ya reekwa ure[a]; n’ihi na ọ bụ site ná mkpụrụ osisi ka a na-amata osisi ahụ.[b]”
  to: “Meenụ ka osisi ahụ dị mma, ka mkpụrụ ya dịkwa mma; ma ọ bụ meenụ ka osisi ahụ rere ure, ka mkpụrụ ya reekwa ure[a]; n’ihi na ọ bụ site na mkpụrụ ya ka a na-amata osisi ahụ.[b]”
  rationale: The revision changes only the final fruit expression, replacing the potentially seed-oriented “mkpụrụ osisi” with “mkpụrụ ya,” which directly reflects the Greek possessive reference and sustains the tree-and-fruit metaphor. Footnote b is recast into complete Standard Igbo while retaining the imperative/rhetorical ambiguity documented in the English audit trail.
