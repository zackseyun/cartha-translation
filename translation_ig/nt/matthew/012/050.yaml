id: MAT.12.50
reference: Matthew 12:50
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: ig
  text: N’ihi na onye ọ bụla nke na-eme uche Nna m nke nọ n’eluigwe[a], onye ahụ bụ nwanne m nwoke, nwanne m nwanyị, na nne m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “onye ọbụla na-eme uche Nna m nke nọ n’eluigwe, onye ahụ bụ nwanne m nwoke, nwanne m nwanyị, na nne m.” N’asụsụ Grik, e ji ụdị ụtọasụsụ nke otu onye nwoke mee okwu a n’ụzọ metụtara onye ọbụla.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: onye ọ bụla nke
  rationale: Na-egosipụta onye ọbụla n’enweghị oke, dị ka ahịrịokwu Grik nke na-enye ọnọdụ zuru ụwa ọnụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-echekwa njikọ nkọwa amaokwu a na okwu ndị bu ya ụzọ.
- source_word: ποιήσῃ
  choice: na-eme
  rationale: ‘Ime uche’ bụ ntụgharị ebumpụta ụwa nke ποιέω na θέλημα; ọ naghị eme ka echiche ahụ dị warara dịka ‘irube isi’ nwere ike ime.
- source_word: τὸ θέλημα
  choice: uche
  rationale: ‘Uche’ na-echekwa echiche nke ihe Nna chọrọ ma na-adịkwa mma n’asụsụ Igbo nke Akwụkwọ Nsọ.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: Nna m nke nọ n’eluigwe
  rationale: Na-esochi nhazi Grik nke ọma ma doo anya n’Igbo.
- source_word: αὐτός
  choice: onye ahụ
  rationale: Na-egosipụta nkwusi ike nke nnọchiaha Grik ma na-arụ ọrụ n’Igbo maka nwoke ma ọ bụ nwanyị n’enweghị imebi mkpokọta onye ọbụla.
- source_word: ἀδελφὸς
  choice: nwanne m nwoke
  rationale: Na-egosipụta n'ụzọ doro anya na ọ bụ nwanne nwoke, dị iche na ἀδελφή.
- source_word: ἀδελφὴ
  choice: nwanne m nwanyị
  rationale: Na-echekwa aha ezinụlọ nwanyị nke Grik depụtara kpọmkwem.
- source_word: μήτηρ
  choice: nne m
  rationale: Ọ bụ ntụgharị kpọmkwem na nke ebumpụta ụwa nke μήτηρ.
- source_word: ἐστίν
  choice: bụ
  rationale: Na-echekwa ngwaa njikọ nke oge ugbu a.
theological_decisions:
- issue: Ụdị nwoke n’asụsụ Grik e ji mee okwu metụtara onye ọbụla
  choice: onye ọ bụla ... onye ahụ
  alternative: onye ọ bụla ... ya onwe ya bụ nwanne m nwoke, nwanne m nwanyị, na nne m
  rationale: Grik ji ụdị otu onye nwoke mee okwu metụtara onye ọbụla. Igbo anaghị achọ ka nnọchiaha kewaa nwoke na nwanyị; ‘onye ahụ’ na-echekwa otu onye ahụ na nkwusi ike nke αὐτός, ebe ndepụta ‘nwanne nwoke, nwanne nwanyị, na nne’ na-eme ka obosara okwu ahụ pụta ìhè.
translation_notes:
  register: Standard Igbo dị ugbu a, nke ugwu na nkwanye ùgwù dị na ya ma dị mfe nghọta. E ji ‘onye ahụ’ zere itinye okike nwoke n’ebe usoro nnọchiaha Igbo na-adịghị eme otú ahụ, ma e chekwara aha ezinụlọ atọ ahụ n’otu n’otu.
