revisions:
- from: Ya mere, lee ka mmadụ si baa uru karịa atụrụ! N’ihi ya, iwu kwadoro ime ihe ọma n’ụbọchị izu ike.[a]
  to: Ya mere, lee ka mmadụ si baa uru karịa atụrụ! N’ihi ya, o ziri ezi n’iwu ime ihe ọma n’ụbọchị izu ike.[a]
  rationale: The revision retains the draft’s accurate comparison and rhetorical emphasis, while rendering ἔξεστιν with an idiomatic Igbo expression that directly conveys lawfulness. The footnote is revised to explain the Greek plural as an idiom rather than as separate Sabbath days.
