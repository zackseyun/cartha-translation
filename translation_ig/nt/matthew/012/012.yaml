id: MAT.12.12
reference: Matthew 12:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: ig
  text: Ya mere, lee ka mmadụ si baa uru karịa atụrụ! N’ihi ya, o ziri ezi n’iwu ime ihe ọma n’ụbọchị izu ike.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, “ụbọchị izu ike” dị n’ụdị ọtụtụ (“n’ụbọchị izu ike”). A na-ejikarị ụdị ọtụtụ a ekwu maka ụbọchị izu ike ma ọ bụ idebe ya n’ozuzu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ οὖν διαφέρει
  choice: Ya mere, lee ka … si baa uru karịa
  rationale: 'Nke a na-egosipụta ajụjụ nkwupụta na arụmụka sitere n’ihe dị nta ruo n’ihe ka ukwuu: mmadụ bara uru nke ukwuu karịa atụrụ. ‘Lee ka … si’ bụ ụzọ Igbo dị ndụ ma doo anya isi gosipụta πόσῳ na ike okwu ahụ.'
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: Ἄνθρωπος ebe a pụtara mmadụ n’ozuzu ya, otu onye e ji anọchi anya ụmụ mmadụ, n’iji ya tụnyere atụrụ. ‘Mmadụ’ bụ okwu Igbo ziri ezi ma bụrụkwa nke eke.
- source_word: προβάτου
  choice: atụrụ
  rationale: Genitive ahụ na-egosi ihe e ji atụnyere mmadụ; ‘karịa atụrụ’ na-ebupụta ntụnyere ahụ nke ọma.
- source_word: ὥστε ἔξεστιν
  choice: N’ihi ya, iwu kwadoro
  rationale: Ὥστε na-ewebata nkwubi okwu, ebe ἔξεστιν nwere nghọta gbasara ihe iwu nyere ohere n’arụmụka banyere ụbọchị izu ike. ‘Iwu kwadoro’ na-echekwa nghọta iwu ahụ.
- source_word: τοῖς σάββασιν
  choice: n’ụbọchị izu ike
  rationale: Ọ bụ ezie na Grik ji ụdị ọtụtụ, ọ bụ akpaala okwu a na-eji ekwu banyere idebe ụbọchị izu ike. Ụdị Igbo a bụ nke eke, ebe nkọwa ala peeji na-eme ka ụdị Grik pụta ìhè.
- source_word: καλῶς ποιεῖν
  choice: ime ihe ọma
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụ nke a na-ejikarị akọwa ime omume ọma ma ọ bụ imere mmadụ ihe bara uru.
theological_decisions:
- issue: Ihe ἄνθρωπος na-ezo aka na ya
  choice: mmadụ
  alternative: nwoke
  rationale: N’ebe a, okwu Grik ahụ na-anọchi anya mmadụ n’ozuzu ya, ọ bụghị nwoke n’ụzọ pụrụ iche. ‘Mmadụ’ na-echekwa obosara okwu ahụ n’enweghị itinye echiche gbasara okike mmadụ nke amaokwu ahụ na-ekwughị.
- issue: Ụdị ọtụtụ nke okwu ụbọchị izu ike
  choice: n’ụbọchị izu ike
  alternative: n’ụbọchị izu ike dị iche iche
  rationale: Ụdị ọtụtụ σάββασιν nwere ike ịbụ akpaala okwu maka oge ma ọ bụ idebe ụbọchị izu ike n’ozuzu ya. Igbo eke anaghị achọ ka e mee ya ọtụtụ n’ụzọ siri ike; nkọwa ala peeji na-echekwa ozi banyere ụdị Grik ahụ.
- issue: Ike iwu dị na ἔξεστιν
  choice: iwu kwadoro
  alternative: e nyere ohere
  rationale: Arụmụka gbara amaokwu a gburugburu bụ ma omume ahụ ò kwekọrọ n’iwu ụbọchị izu ike. ‘Iwu kwadoro’ na-egosipụta nke a n’enweghị ịkọwa iwu ahụ karịa ihe ederede kwuru.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. ‘Lee ka … si’ na-echekwa ike ajụjụ nkwupụta Grik, ebe ‘iwu kwadoro’ na-edobe ọnọdụ arụmụka gbasara iwu.
