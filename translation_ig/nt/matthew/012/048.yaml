source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: ig
  text: Ma ọ zara onye ahụ na-agwa ya[a], sị, “Ònye bụ nne m, olee ndị bụ ụmụnne m ndị nwoke?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-esochikwu usoro okwu Grik, “Ma ọ zara ma sị onye ahụ na-agwa ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Ma ọ zara … sị
  rationale: Nke a na-egosipụta ntụgharị okwu δέ (“Ma”) ma na-asụgharị akpaala okwu Grik ἀποκριθεὶς εἶπεν n’Igbo dị eke, na-enweghị ikwughachi ‘zara ma kwuo’ n’ụzọ siri ike.
- source_word: τῷ λέγοντι αὐτῷ
  choice: onye ahụ na-agwa ya
  rationale: Ọ na-edobe λέγοντι dị ka omume na-aga n’ihu ma na-egosi onye Jizọs na-aza.
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: Ònye bụ nne m
  rationale: Ajụjụ a na-achọ ịmata onye ahụ bụ; nsụgharị a dị kpọmkwem ma dịkwa eke n’Igbo.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: oleekwa ndị bụ ụmụnne m ndị nwoke
  rationale: “Oleekwa ndị” na-egosipụta ụdị ọtụtụ nke τίνες, ebe “ụmụnne m ndị nwoke” na-edobe kpọmkwem ụdị nwoke nke ἀδελφοί kama ịgbasa ya ka ọ bụrụ ụmụnne nwoke na nwanyị niile.
theological_decisions:
- issue: Ajụjụ Jizọs banyere ndị bụ ezi ezinụlọ ya nwere ike ịdị mfe ịkọwa tupu amaokwu na-esote
  choice: Edobere ajụjụ abụọ ahụ dịka ha dị, na-enweghị nkọwa agbakwunyere
  alternative: Ònye ka a ga-ewere dị ka nne m, oleekwa ndị ka a ga-ewere dị ka ụmụnne m ndị nwoke?
  rationale: Amaokwu na-esote ga-akọwa nzube ajụjụ ahụ; itinye nkọwa ahụ ebe a ga-emechi nghọta na esemokwu akụkọ ahụ tupu oge ya.
- issue: Ụdị okike nke ἀδελφοί
  choice: ụmụnne m ndị nwoke
  alternative: ụmụnne m; ụmụnne m ndị nwoke na ndị nwanyị
  rationale: N’ọnọdụ akụkọ a, okwu Grik ahụ bụ aha ikwu nwoke n'ụdị ọtụtụ. Nsụgharị ahụ anaghị agbanwe ya ka ọ bụrụ okwu gụnyere nwoke na nwanyị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ụmụnne m ndị nwoke” doro anya karịa “ụmụnna m,” nke nwere ike ịpụta ndị ikwu n’akụkụ nna n’ụfọdụ ojiji. Akara ajụjụ ụda olu dị na “Ònye” na-enyere ọgụgụ ziri ezi.
