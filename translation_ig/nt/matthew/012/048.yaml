revisions:
- from: Ma ọ zara onye ahụ na-agwa ya[a], sị, “Ònye bụ nne m, oleekwa ndị bụ ụmụnne m ndị nwoke?”
  to: Ma ọ zara onye ahụ na-agwa ya[a], sị, “Ònye bụ nne m, olee ndị bụ ụmụnne m ndị nwoke?”
  rationale: The revision changes only the plural interrogative from a quantity question to an identity question, preserving the Greek τίνες. The footnote is also recast so that its formal representation of ἀποκριθεὶς εἶπεν is grammatical Igbo and does not alter the relation of the speaker to Jesus.
