id: MAT.12.22
reference: Matthew 12:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: ig
  text: Mgbe ahụ, e wetara ya otu nwoke mmụọ ọjọọ ji, onye kpuru ìsì na onye na-apụghị ikwu okwu[a]. Ọ gwọrọ ya, nke mere na nwoke ahụ na-apụghị ikwu okwu kwuru okwu ma hụ ụzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “onye ntị chiri.” Okwu Grik a nwere ike ịpụta onye ntị chiri ma ọ bụ onye na-apụghị ikwu okwu. N’ebe a, nsonaazụ a kọwara kwadoro “onye na-apụghị ikwu okwu,” n’ihi na mgbe a gwọrọ ya, o kwuru okwu ma hụ ụzọ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji egosi na ihe a mere sochiri ihe bu ya ụzọ.
- source_word: προσηνέχθη αὐτῷ
  choice: e kutere ya
  rationale: E ji usoro nnara mee ka onye mere ya ghara ịpụta, dịka ọ dị n’asụsụ Grik.
- source_word: δαιμονιζόμενος
  choice: mmụọ ọjọọ ji
  rationale: Nke a bụ okwu Igbo dị ndụ nke na-egosi n’enweghị ime ka ọ dị nro na nwoke ahụ nọ n’okpuru ike mmụọ ọjọọ.
- source_word: τυφλὸς
  choice: kpuru ìsì
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị ekwu na mmadụ adịghị ahụ ụzọ.
- source_word: κωφός
  choice: na-apụghị ikwu okwu
  rationale: Ọ bụ ezie na okwu Grik a nwekwara ike ịpụta onye ntị chiri, nkebi nsonaazụ na-ekwu kpọmkwem na nwoke ahụ kwuru okwu; ya mere nke a dabara n’ọnọdụ a, ebe e debere ihe ọzọ ọ pụrụ ịpụta n’okpuru peeji.
- source_word: ἐθεράπευσεν αὐτόν
  choice: Ọ gwọrọ ya
  rationale: ‘Ịgwọ’ bụ okwu Igbo nkịtị ma doo anya maka ọgwụgwọ dị n’akụkọ ọrụ ebube a.
- source_word: ὥστε
  choice: nke mere na
  rationale: Nke a na-egosi nsonaazụ ọgwụgwọ ahụ n’ụzọ Igbo sitere n’okike.
- source_word: λαλεῖν καὶ βλέπειν
  choice: kwuru okwu ma hụ ụzọ
  rationale: Nke a na-egosipụta nsonaazụ abụọ ahụ nkenke, n’etinyeghị echiche nke ‘malitere’ nke na-adịghị n’ederede Grik.
theological_decisions:
- issue: Otu e si kọwaa nsogbu sitere n’aka mmụọ ọjọọ
  choice: E debere okwu doro anya ‘mmụọ ọjọọ ji.’
  alternative: onye ọrịa uche; onye e merụrụ ahụ
  rationale: Ederede Grik kwuru hoo haa na nsogbu ahụ metụtara mmụọ ọjọọ; ịgbanwe ya ka ọ bụrụ naanị ọrịa ma ọ bụ nsogbu a na-akọwaghị ga-ewepụ ihe ederede kwuru.
- issue: Ihe κωφός pụtara n’ebe a
  choice: onye na-apụghị ikwu okwu
  alternative: onye ntị chiri
  rationale: κωφός nwere ike ịpụta onye ntị chiri ma ọ bụ onye na-apụghị ikwu okwu. Nsonaazụ a kpọrọ aha bụ na ọ kwuru okwu, ya mere isi ederede jiri nghọta ahụ, ma ihe ọzọ ọ pụrụ ịpụta dị n’okpuru peeji iji chekwaa obosara okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ugwu ma dị mfe nghọta. ‘Mmụọ ọjọọ ji’ bụ okwu sitere n’okike nke na-edebe ihe ederede kwuru banyere ike mmụọ ọjọọ n’enweghị ịgbakwụnye nkọwa banyere otú mmụọ ahụ si arụ ọrụ. E tinyere akara [a] kpọmkwem n’ebe okwu nwere nghọta abụọ dị.
