  rationale: 'The revision corrects the Igbo comparative syntax from “ka ... ukwuu” to “dị ukwuu karịa.” It makes no interpretive change: the main text still renders the Greek neuter comparative impersonally as “ihe,” while footnote a preserves possible personal understandings.'
