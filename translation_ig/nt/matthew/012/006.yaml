  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: ig
  text: Ma ana m agwa unu na ihe dị ukwuu karịa ụlọ nsọ dị n’ebe a.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye dị ukwuu karịa ụlọ nsọ nọ n’ebe a,” ma ọ bụ, “otu onye dị ukwuu karịa ụlọ nsọ nọ n’ebe a.” Okwu Grik a sụgharịrị “ihe dị ukwuu” dị n’ụdị neuter, ya mere o megheghị hoo haa ma onye ka ọ bụ ihe ka ọ na-ezo aka na ya.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ebe a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ma ana m agwa unu
  rationale: “Ana m agwa unu” bụ ụzọ Igbo si ekwu okwu a na-agwa ndị mmadụ ozugbo. “Ma” na-egosi obere ntụgharị ma ọ bụ ọdịiche dị n’etiti okwu a na ihe e kwuru tupu ya.
- source_word: ὅτι
  choice: na
  rationale: “Na” na-ewebata ihe Jizọs na-agwa ha, dị ka njikọ okwu a na-ejikarị eme nke a n’Igbo.
- source_word: τοῦ ἱεροῦ
  choice: ụlọ nsọ
  rationale: ἱερόν na-ezo aka n’ụlọ nsọ na ogige ya n’ozuzu, ọ bụghị nanị ebe nsọ dị n’ime ya; “ụlọ nsọ” bụ okwu Igbo doro anya ma bụrụkwa nke a na-aghọta nke ọma.
- source_word: μεῖζόν
  choice: ihe ka ... ukwuu
  rationale: Ụdị okwu Grik a bụ neuter singular ma a kpọghị kpọmkwem onye ma ọ bụ ihe ọ na-ezo aka na ya. “Ihe ka ụlọ nsọ ukwuu” na-edebe ntụnyere ahụ ma ghara ịkpọ Jizọs aha ozugbo n’ebe Grik na-emeghị otú ahụ.
- source_word: ἐστιν
  choice: dị
  rationale: “Dị” na-enye copula dị mfe nke dabara n’okwu Grik, na-enweghị ịgbatị ihe ọ pụtara.
- source_word: ὧδε
  choice: n’ebe a
  rationale: “N’ebe a” bụ ụzọ Igbo nkịtị si kwuo ọnọdụ ὧδε; a pụkwara ime ka ọ dị mkpụmkpụ dịka “ebe a.”
theological_decisions:
- issue: Onye ma ọ bụ ihe μεῖζόν, nke e kwuru n’ụdị neuter, na-ezo aka na ya
  choice: E tinyere “ihe ka ụlọ nsọ ukwuu” n’ahịrịokwu bụ isi, na-akpọghị onye ahụ aha kpọmkwem.
  alternative: “onye ka ụlọ nsọ ukwuu nọ n’ebe a” ma ọ bụ “otu onye ka ụlọ nsọ ukwuu nọ n’ebe a”
  rationale: Ọ bụ ezie na gburugburu okwu ahụ na-atụ aka n’ebe Jizọs na ikike ya dị, Grik ji ụdị neuter mee ihe ma hapụ ihe ọ na-ezo aka na ya n’ekwughị ya hoo haa. Nsụgharị ahụ na-edebe mgbagwoju anya a na ike nkà mmụta okpukpe ya kama idozi ya n’ụzọ a na-apụghị ịhụ kpọmkwem n’ụdị Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Nhazi “ihe ka ụlọ nsọ ukwuu” na-edebe ntụnyere na enweghị nkọwa zuru ezu dị na Grik; ihe odide ala ala na-egosi ụzọ e nwere ike isi ghọta ya dịka onye.
