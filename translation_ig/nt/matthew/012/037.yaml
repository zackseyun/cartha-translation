  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: ig
  text: N’ihi na ọ bụ site n’okwu gị ka a ga-ekwupụta na ikpe amaghị gị[a], ọ bụkwa site n’okwu gị ka a ga-ama gị ikpe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a ga-agụ gị dịka onye ezi omume,” ma ọ bụ, “a ga-egosi na ikpe amaghị gị.” Ngwaa Grik ahụ pụrụ inwe echiche ikpe n’ụlọikpe, ya bụ, ikwupụta na mmadụ nọ n’aka nri n’ikpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: site n’... ka a ga-esi
  rationale: N’ebe a, ἐκ na-egosi ihe a ga-adabere na ya mee mkpebi. Usoro a bụ Igbo e ji eme ihe nke na-egosi na okwu mmadụ bụ ihe akaebe a ga-eji kpee ya ikpe.
- source_word: γάρ
  choice: N’ihi na
  rationale: γάρ na-enye ihe kpatara ịdọ aka ná ntị dị n’amaokwu bu ụzọ; “N’ihi na” na-ejikọta echiche ahụ n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: λόγων σου
  choice: okwu gị
  rationale: λόγων na-ezo aka n’ihe mmadụ kwuru, ebe σου na-egosi na okwu ndị ahụ bụ nke onye a na-agwa. “Okwu gị” na-echekwa nkwughachi na nhazi yiri ibe ya dị na Grik.
- source_word: δικαιωθήσῃ
  choice: a ga-agụọrọ gị onye ezi omume
  rationale: Ngwaa a bụ ọdịnihu n’olu nnara ma nwee echiche ikpe n’ụlọikpe n’ebe a. Nhọrọ a na-egosi nkwupụta na mmadụ nọ n’ụzọ ziri ezi, na-enweghị ikwu na okwu ya na-eme ka ọ bụrụ onye ezi omume.
- source_word: καταδικασθήσῃ
  choice: a ga-ama gị ikpe
  rationale: Ngwaa a bụ okwu ikpe ma guzoro dị ka ihe megidere δικαιωθήσῃ. “A ga-ama gị ikpe” bụ okwu Igbo doro anya nke na-echekwa ọdịnihu na olu nnara.
theological_decisions:
- issue: Echiche ikpe nke δικαιόω n’ihe gbasara okwu mmadụ na ikpe
  choice: a ga-agụọrọ gị onye ezi omume
  alternative: a ga-ekwupụta na i mere ihe ziri ezi; a ga-ahapụ gị n’ikpe
  rationale: Njikọ ya na “a ga-ama gị ikpe” na-egosi ọnọdụ ikpe. Nsụgharị a na-echekwa echiche nke ịkpọ ma ọ bụ ịgụ mmadụ onye nọ n’ụzọ ziri ezi, ma ọ naghị ebubata nkọwa ozizi zuru ezu nke amaokwu a n’onwe ya na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere nhazi yiri ibe ya nke ahịrịokwu Grik site n’ikwughachi “site n’okwu gị,” ma jiri okwu ikpe ndị ndị nkịtị ga-aghọta.
