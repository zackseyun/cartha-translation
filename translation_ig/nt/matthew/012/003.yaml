review_pass:
  verdict: revise
  source_fidelity: Ihe e dere ugbu a na-achọ idobe nhazi Grik ahụ, ma rikoma mgbe “ya” gachara na-eme ka “ya na ndị ya na ha nọ” ghara ịrụ ọrụ nke ọma dịka ndị agụụ metụtara. Iwepụ rikoma ahụ na-eme ka e nwee nghọta nkịtị na agụụ gụrụ Devid na ndị ya na ha nọ, nke kwekọrọ na ellipsis dị n’asụsụ Grik na ụzọ ntụgharị Bekee si nyochaa ya. Nkọwa ala peeji ga-edobe eziokwu ahụ na ngwaa Grik dị n’otu onye ma na-ezo aka na Devid kpọmkwem.
  naturalness: “Ọ̀ bụ na unu agụbeghị” bụ Standard Igbo dị ndụ ma dị mma maka ajụjụ nkwupụta. “Agụụ gụrụ ya na ndị ya na ha nọ” bụkwa usoro nkịtị; rikoma dị na draft na-akpaghasị njikọ a.
  terminology: “Devid,” “agụụ gụrụ,” na “ndị ya na ha nọ” dabara na Standard Igbo ma debe aha na ihe okwu Grik pụtara. Ọ dịghị okwu nkà mmụta okpukpe chọrọ mgbanwe.
  issues:
  - severity: medium
    issue: Rikoma dị n’etiti “ya” na “na ndị ya na ha nọ”
    rationale: Rikoma ahụ kewara okwu ndị jikọtara ọnụ nke “agụụ gụrụ” ma na-eme ka ahịrịokwu ahụ bụrụ nke na-adịghị eke. N’enweghị rikoma, a ghọtara n’ụzọ doro anya na agụụ gụrụ Devid na ndị ya na ha nọ.
  - severity: low
