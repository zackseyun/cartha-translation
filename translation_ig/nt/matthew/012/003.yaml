  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐκ ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε ⸀ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: ig
  text: Ma ọ sịrị ha, “Ọ̀ bụ na unu agụbeghị ihe Devid mere mgbe agụụ gụrụ ya na ndị ya na ha nọ[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ngwaa ahụ e ji kọwaa agụụ (ἐπείνασεν) dị n’ụdị otu onye ma na-ezo aka na Devid kpọmkwem. Ma a pụkwara ịghọta “ndị ya na ha nọ” dịka ndị agụụ ahụ metụtakwara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ma ọ
  rationale: ‘Ma’ na-egosi nzaghachi Jizọs nye ebubo ndị Farisii n'ụzọ kwekọrọ na δέ, nke bụ njikọ dị nro.
- source_word: εἶπεν αὐτοῖς
  choice: sịrị ha
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke nkịtị isi kwuo na ọ gwara ha okwu.
- source_word: Οὐκ ἀνέγνωτε
  choice: Ọ̀ bụ na unu agụbeghị
  rationale: Ajụjụ a na-atụ anya azịza doro anya ma na-echetara ha ihe ha kwesịrị ịma n’Akwụkwọ Nsọ; ụdị a na-egosipụta ike ajụjụ Grik nke ọma.
- source_word: τί ἐποίησεν
  choice: ihe ... mere
  rationale: Nke a na-enye ποιέω n’ụzọ kpọmkwem na nke sitere n’okwu Igbo.
- source_word: Δαυὶδ
  choice: Devid
  rationale: Nke a bụ nsụgharị aha ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: ὅτε ἐπείνασεν
  choice: mgbe agụụ gụrụ ya
  rationale: Nke a bụ ụzọ Igbo nkịtị isi kwuo πεινάω; ngwaa Grik bụ otu onye ma na-ezo aka n’ebe Devid nọ.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: ya na ndị ya na ha nọ
  rationale: Nke a na-eme ka njikọ ahụ bụrụ nke sitere n’okwu Igbo ma na-edebe ndị ha na Devid nọ n’echiche ahụ, n’agbanyeghị na Grik ekwughachighị ngwaa ahụ.
theological_decisions:
- issue: Ma agụụ ahụ metụtara naanị Devid n'ụdị ụtọasụsụ ka ọ metụtara ndị ya na ha nọkwa
  choice: E debere ngwaa agụụ ahụ n’otu onye, dịka Grik si kwuo ya, ma jikọta ‘ndị ya na ha nọ’ n’ahịrịokwu ahụ.
  alternative: “mgbe agụụ gụrụ ya na ndị ya na ha nọ”
  rationale: ἐπείνασεν bụ ngwaa otu onye nke na-ezo aka n’ebe Devid nọ kpọmkwem, ma usoro okwu ahụ nwere ike ime ka a ghọta na ndị ya na ha nọ sokwa nwee agụụ. Ihe odide na nkọwa ala peeji na-edebe mgbagwoju anya a kama idozi ya n’otu ụzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. Ajụjụ “Ọ̀ bụ na unu agụbeghị” na-ada nke ọma n’okwu arụmụka ma na-edebe ụdị ajụjụ nkwupụta nke Grik.
