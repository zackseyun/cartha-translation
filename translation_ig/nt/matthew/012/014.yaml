  verdict: revise
  source_fidelity: 'The core renderings are faithful: “ndị Farisii,” “gbaa izu megide ya,” “otú ha ga-esi,” and “laa ya n’iyi” appropriately represent the Greek, including the broader force of ἀπολέσωσιν.'
  naturalness: The sequence “pụrụ gaa gbaa izu” is less clear and can be awkward in Standard Igbo; without tonal marking, “pụrụ gaa” may momentarily be read as ‘were able to go.’ Removing “gaa” yields a clear, idiomatic sequential construction while retaining the temporal force of ἐξελθόντες.
  terminology: “Ndị Farisii” is an appropriate established form. “Gbaa izu megide ya” naturally conveys hostile deliberation without adding doctrinal or historical detail. “Laa ya n’iyi” preserves the source verb’s breadth.
  issues:
