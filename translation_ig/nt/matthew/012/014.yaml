  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: ig
  text: Ma ndị Farisii pụrụ, gbaa izu megide ya banyere otú ha ga-esi laa ya n’iyi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “gbuo ya” ma ọ bụ “mee ka e gbuo ya.” N’asụsụ Grik, e ji okwu pụtara “laa ya n’iyi” mee ihe; n’ọnọdụ a, ọ pụrụ ịgụnye ebumnobi igbu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: pụrụ gaa
  rationale: Nke a na-egosi na ha si ebe ahụ pụọ tupu ha amalite izu ahụ, n’Igbo nkịtị nke na-edobe usoro omume ahụ.
- source_word: δὲ
  choice: Ma
  rationale: 'Ọ na-egosi mgbanwe nwere ntakịrị mmegide: site n’omume Jizọs gaa ná nzaghachi ọjọọ ndị Farisii.'
- source_word: οἱ Φαρισαῖοι
  choice: ndị Farisii
  rationale: A sụgharịghị aha òtù ahụ kama a dere ya dịka a na-akpọ ya n’Igbo ọkọlọtọ.
- source_word: συμβούλιον ἔλαβον
  choice: gbaa izu
  rationale: Akpaokwu Grik ahụ pụtara ịgbakọta uche ma mee atụmatụ; n’ọnọdụ mmegide a, ‘gbaa izu’ bụ Igbo ebumpụta ụwa nke na-egosi atụmatụ nzuzo megide mmadụ.
- source_word: κατ’ αὐτοῦ
  choice: megide ya
  rationale: κατά na genitive nwere nghọta mmegide n’ebe a.
- source_word: ὅπως
  choice: banyere otú ha ga-esi
  rationale: Ọ na-ewebata ihe ha na-atụpụta na nzube atụmatụ ahụ, ma na-edobe echiche ‘otú ha ga-esi’ nke dị n’ahịrịokwu ahụ.
- source_word: ἀπολέσωσιν
  choice: laa ya n’iyi
  rationale: Akpaokwu a na-edobe obosara nke ἀπόλλυμι—ime ka mmadụ laa n’iyi—n’agbanyeghị na ọnọdụ a nwere ike ịpụta igbu ya.
theological_decisions:
- issue: Ókè nkọwa a ga-enye ἀπολέσωσιν
  choice: laa ya n’iyi
  alternative: gbuo ya / mee ka e gbuo ya
  rationale: Ọnọdụ ahụ na-egosi ebumnobi ọjọọ nke nwere ike ịbụ ọnwụ, ma ngwaa Grik ahụ sara mbara karịa ngwaa pụtara naanị ‘igbu.’ Ya mere, isi ederede na-edobe obosara ahụ, ebe ndetu na-egosi nghọta doro anya karị.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. ‘Gbaa izu megide’ bụ akpaokwu ebumpụta ụwa; ‘laa ya n’iyi’ na-edobe obosara na esemokwu dị na okwu Grik.
