revisions:
- from: Eze nwaanyị nke Ndịda[a] ga-ebili n’oge ikpe ahụ ya na ọgbọ a, maa ya ikpe, n’ihi na o si na nsọtụ ụwa bịa ịnụ amamihe Solomọn. Ma lee, ihe karịrị Solomọn nọ n’ebe a.[b]
  to: Eze nwaanyị nke Ndịda[a] ga-ebili n’oge ikpe ahụ ya na ọgbọ a, ga-amakwa ya ikpe, n’ihi na o si na nsọtụ ụwa bịa ịnụ amamihe Solomọn. Lee, ihe karịrị Solomọn nọ n’ebe a.[b]
  rationale: The revision strengthens the explicit condemnatory sense of κατακρινεῖ, renders καὶ ἰδού without an added adversative implication, and makes the grammatical explanation in the alternative-reading footnote precise. The existing footnote anchors are retained and remain attached to the material each note explains.
