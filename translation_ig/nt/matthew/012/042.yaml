id: MAT.12.42
reference: Matthew 12:42
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: ig
  text: Eze nwaanyị nke Ndịda[a] ga-ebili n’oge ikpe ahụ ya na ọgbọ a, ga-amakwa ya ikpe, n’ihi na o si na nsọtụ ụwa bịa ịnụ amamihe Solomọn. Lee, ihe karịrị Solomọn nọ n’ebe a.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Eze nwaanyị nke Ndịda” na-ezo aka n’eze nwaanyị Sheba (1 Ndị Eze 10:1–13; 2 Ihe E Mere 9:1–12), ọ bụ ezie na ihe odide Grik akpọghị Sheba aha kpọmkwem.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsụgharị ya, “onye ka Solomọn ukwuu nọ n’ebe a.” Grik ji ụdị neuter mee ihe, nke nsụgharị “ihe karịrị” na-anọchi anya ya; nke a nwere ike imesi ịdị ukwuu dị na Jizọs na ozi ya, nke karịrị Solomọn, ike.
    reason: alternative_reading
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: Eze nwaanyị nke Ndịda
  rationale: Nke a na-edobe njikọ okwu Grik nke pụtara ‘eze nwaanyị nke Ndịda,’ n’akpọghị ya eze nwaanyị Sheba n’ahịrị bụ isi, ebe ọ bụ na Grik akpọghị Sheba aha kpọmkwem.
- source_word: ἐγερθήσεται
  choice: ga-ebili
  rationale: Ọ na-edobe ma echiche nke ibili n’ọnwụ ma nke ibili dị ka onye akaebe n’oge ikpe, n’enweghị ịkọwa nke ọ bụ naanị ya.
- source_word: ἐν τῇ κρίσει
  choice: n’oge ikpe ahụ
  rationale: Ọ na-egosi ikpe a kapịrị ọnụ a na-atụ anya ya, ma bụrụkwa okwu Igbo doro anya ma na-aga were were.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: ya na ọgbọ a
  rationale: μετά ya na genitive pụtara ‘ya na’; ike mmegide ahụ sitere n’okwu na-esote banyere ịma ikpe, ọ bụghị na preposition ahụ n’onwe ya.
- source_word: κατακρινεῖ αὐτήν
  choice: maa ya ikpe
  rationale: Nkebi a na-egosi ikpe ọmụma ma ọ bụ ịkatọ, ebe ‘ya’ na-alaghachi n’ọgbọ a.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: si na nsọtụ ụwa
  rationale: Nke a bụ ụzọ okwu a maara nke na-egosi ebe dị anya nke ukwuu.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: ịnụ amamihe Solomọn
  rationale: Infinitive ahụ na-egosi nzube ọ ji bịa; nsụgharị a dị nkenke ma na-edobe ihe Grik kwuru.
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: Ọ na-adọta uche n’ihe dị mkpa Jizọs na-ekwu, ma na-edobe ụda dị nsọ na nke siri ike.
- source_word: πλεῖον Σολομῶνος
  choice: ihe karịrị Solomọn
  rationale: ‘Ihe’ na-edobe ụdị neuter nke πλεῖον, kama ịgbanwe ya ozugbo ka ọ bụrụ onye nwoke; ‘karịrị’ na-egosi ịdị ukwuu gafere nke Solomọn.
- source_word: ὧδε
  choice: nọ n’ebe a
  rationale: Ọ bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo na ihe ahụ dị ‘ebe a.’
theological_decisions:
- issue: Otu e si sụgharịa comparative neuter πλεῖον n’ihe metụtara Jizọs
  choice: ihe karịrị Solomọn
  alternative: onye ka Solomọn ukwuu
  rationale: 'Ụdị Grik bụ neuter, ya mere ‘ihe karịrị’ na-echekwa mgbagwoju anya na obosara nke okwu ahụ: ịdị ukwuu dị na Jizọs na ozi ya karịrị Solomọn. ‘Onye ka Solomọn ukwuu’ ga-eme ka ọ bụrụ naanị ntụaka kpọmkwem nye otu onye.'
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ ‘eze nwaanyị’ kama okwu e si n’asụsụ ọzọ were, ma debe ‘ọgbọ a,’ ‘ikpe ahụ,’ na ‘ihe karịrị Solomọn’ iji chekwaa usoro echiche na esemokwu dị n’ederede Grik.
