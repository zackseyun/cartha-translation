review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the returning spirit’s possessive “my house,” the exit-from image, and the threefold condition of the house. However, “ọ dịghị onye bi n’ime ụlọ ahụ” specifies that no one lives there, whereas σχολάζοντα means vacant, unoccupied, or free/available and does not specifically refer to residents. The revision restores that broader image. It also makes the final two perfect passive participles clearly parallel in Igbo.
  naturalness: The revised wording is natural Standard Igbo while retaining the Greek’s vivid present narration in “ọ na-ekwu” and “ọ na-ahụ.” “Ọ tọgbọ n’efu” is an idiomatic way to describe a house as vacant/empty.
  terminology: “ụlọ,” “alaghachi,” “zachapụrụ,” and “dozikwara ... nke ọma” suitably convey the source images and completed states. The alternative sense of κεκοσμημένον as adorned/decorated is retained in the footnote.
  issues:
  - severity: medium
    issue: The rendering of σχολάζοντα is overly specific.
    rationale: “Ọ dịghị onye bi n’ime ụlọ ahụ” means that nobody resides in the house. The Greek describes it as vacant/unoccupied, without stating whether anyone lives there.
  - severity: low
    issue: The coordination of the final passive descriptions is not fully explicit.
    rationale: “a zachapụrụ ya, doziekwa ya nke ọma” leaves the second clause without an explicit passive/impersonal marker. Repeating “a” clearly represents the two coordinated perfect passive participles.
  revised_text: Mgbe ahụ, ọ na-ekwu, sị, “Aga m alaghachi n’ụlọ m, nke m siri pụta.” Mgbe ọ bịara, ọ na-ahụ ụlọ ahụ ka ọ tọgbọ n’efu[a], a zachapụrụ ya, a dozikwara ya nke ọma[b].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ tọgbọ chakoo.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a chọkwara ya mma.”
    reason: lexical_alternative
  revision_rationale: The revision avoids narrowing “unoccupied” to the claim that no one lives in the house, maintains the house metaphor without interpretation, and marks both “swept” and “put in order” as completed passive conditions. Footnote anchors remain attached to the corresponding terms.
