id: MAT.12.44
reference: Matthew 12:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: ig
  text: Mgbe ahụ, ọ na-ekwu, sị, “Aga m alaghachi n’ụlọ m, nke m siri pụta.” Mgbe ọ bịara, ọ na-ahụ ụlọ ahụ ka ọ tọgbọ n’efu[a], a zachapụrụ ya, a dozikwara ya nke ọma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ tọgbọ chakoo.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a chọkwara ya mma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ okwu oge na-egosi ihe na-esote n’akụkọ; “Mgbe ahụ” bụ ụzọ Igbo nkịtị si kwuo ya.
- source_word: λέγει
  choice: ọ na-asị
  rationale: E jidere oge ugbu a nke Grik, nke na-eme ka akụkọ dị ka ihe na-eme n’ihu onye na-agụ ya. Onye na-ekwu okwu bụ mmụọ na-adịghị ọcha a kpọtụrụ aha n’amaokwu bu ụzọ.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: Aga m alaghachi n’ụlọ m
  rationale: “Laghachi” na-egosi ịga azụ ebe mmadụ si bịa, ebe “ụlọ m” na-echekwa nkwupụta onye mmụọ ahụ na-ekwu na ụlọ ahụ bụ nke ya.
- source_word: ὅθεν ἐξῆλθον
  choice: ebe m si pụta
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa nke na-echekwa echiche doro anya nke isi n’ebe ahụ pụta.
- source_word: ἐλθὸν
  choice: Mgbe ọ bịarutere
  rationale: A sụgharịrị participle a dị ka nkebiokwu oge iji gosi na ọ bịarutere tupu ọ hụ ọnọdụ ụlọ ahụ.
- source_word: εὑρίσκει
  choice: ọ na-ahụ
  rationale: “Ọ na-ahụ” na-echekwa oge ugbu a e ji kọ akụkọ n’ụzọ dị ndụ.
- source_word: σχολάζοντα
  choice: ọ dịghị onye bi n’ime ụlọ ahụ
  rationale: N’ebe a, okwu ahụ na-egosi na ụlọ ahụ enweghị onye bi n’ime ya ma dị njikere ka e biri na ya. Nke a na-enye echiche ahụ n’Igbo doro anya, ma debe “tọgbọrọ n’efu” dị ka ụzọ ọzọ n’ala ala peeji.
- source_word: σεσαρωμένον
  choice: a zachapụrụ ya
  rationale: 'Okwu a na-egosi ọnọdụ sitere n’omume e mechara eme: e zachara ụlọ ahụ, ọ nọkwa n’ọnọdụ ahụ.'
- source_word: κεκοσμημένον
  choice: doziekwa ya nke ọma
  rationale: κοσμέω nwere ike ịpụta ịhazi ihe nke ọma ma ọ bụ ịchọ ya mma. N’ebe a, “doziekwa ya nke ọma” na-enye echiche nke ịdị n’usoro n’etinyeghị echiche ịchọ mma n’ike; e debere “chọọkwa ya mma” n’ala ala peeji.
theological_decisions:
- issue: Ihe “ụlọ” na-anọchi anya n’ilu banyere mmụọ na-adịghị ọcha nke na-alaghachi
  choice: E debere “ụlọ” dịka ihe oyiyi amaokwu ahụ ji mee ihe, n’akọwaghị ya n’isiokwu bụ isi dịka “onye ahụ” ma ọ bụ “ndụ ya.”
  alternative: “Aga m alaghachi n’onye ahụ m si n’ime ya pụta.”
  rationale: Ọ bụ ezie na amaokwu ndị gbara ya gburugburu na-enyere onye na-agụ aka ịghọta ihe oyiyi ahụ, ihe odide Grik kwuru “ụlọ.” Idebe ya na-echekwa ihe oyiyi na ike okwu Jizọs n’enweghị nkọwa agbakwunyere.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. A hapụrụ okwu mmụọ ahụ n’ụdị okwu kpọmkwem ma debeekwa oge ugbu a nke akụkọ Grik ebe ọ na-ada nke ọma n’Igbo.
