revisions:
- from: Mgbe ahụ, ọ na-asị, “Aga m alaghachi n’ụlọ m, ebe m si pụta.” Mgbe ọ bịarutere, ọ na-ahụ na ọ dịghị onye bi n’ime ụlọ ahụ[a], na a zachapụrụ ya, doziekwa ya nke ọma[b].
  to: Mgbe ahụ, ọ na-ekwu, sị, “Aga m alaghachi n’ụlọ m, nke m siri pụta.” Mgbe ọ bịara, ọ na-ahụ ụlọ ahụ ka ọ tọgbọ n’efu[a], a zachapụrụ ya, a dozikwara ya nke ọma[b].
  rationale: The revision avoids narrowing “unoccupied” to the claim that no one lives in the house, maintains the house metaphor without interpretation, and marks both “swept” and “put in order” as completed passive conditions. Footnote anchors remain attached to the corresponding terms.
