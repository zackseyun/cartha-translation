  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: ig
  text: Lee, e nwere otu nwoke aka ya kpọnwụrụ akpọnwụ. Ha jụrụ ya sị, “Ọ̀ bụ ihe iwu kwere ka a gwọọ mmadụ n’ụbọchị izu ike[a]?” ka ha wee boo ya ebubo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Okwu Grik ahụ dị n’ụdị ọtụtụ: “n’ụbọchị izu ike dị iche iche.” Nke a bụ ụzọ a na-ejikarị ekwu maka ụbọchị izu ike.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lee
  rationale: Ọ na-adọta uche onye na-agụ ya gaa n'ihe ọhụrụ pụtara n'akụkọ ahụ, ma bụrụkwa okwu Igbo dị ndụ ma kwanyere ugwu.
- source_word: ἄνθρωπος
  choice: otu nwoke
  rationale: Aha nwoke nke otu onye ka okwu Grik a na-egosi n'ebe a; “otu nwoke” na-eme ka nke ahụ doo anya.
- source_word: χεῖρα ἔχων ξηράν
  choice: onye otu aka ya kpọnwụrụ akpọnwụ
  rationale: Nke a na-egosi na ọ bụ otu aka nwoke ahụ dara arụ ma ghara ịdị ike, n'ebughị ụzọ kpebie kpọmkwem ụdị ọrịa ahụ.
- source_word: ἐπηρώτησαν αὐτὸν λέγοντες
  choice: Ha jụrụ ya sị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n'echiche nke ngwaa na participle Grik ahụ.
- source_word: ἔξεστι
  choice: Iwu ò kwere
  rationale: Ajụjụ ahụ metụtara ihe iwu okpukpe kwere ime, ọ bụghị naanị ihe ndị mmadụ na-anabata.
- source_word: τοῖς σάββασιν
  choice: n'ụbọchị izu ike niile
  rationale: Okwu Grik dị n'ụdị ọtụtụ; “ụbọchị izu ike niile” na-edebe echiche banyere ụbọchị izu ike ndị ahụ n'ozuzu ya, ma na-ada nke ọma n'Igbo.
- source_word: θεραπεύειν
  choice: ka a gwọọ mmadụ
  rationale: “Ịgwọ” bụ okwu Igbo a na-ejikarị akọwa ime ka onye ọrịa dịrị mma; itinye “mmadụ” na-eme ka ahịrịokwu ahụ zuo oke n'ụzọ ebumpụta ụwa n'Igbo n'ebughị onye ọrịa ọ bụla n'uche.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: ka ha wee boo ya ebubo
  rationale: Ọ na-edebe nzube ọjọọ e gosiri site na ἵνα nakwa echiche iwu dị na “ibo ebubo.”
theological_decisions:
- issue: Ụdị ọtụtụ nke okwu banyere ụbọchị izu ike n'arụmụka gbasara iwu
  choice: n'ụbọchị izu ike niile
  alternative: n'ụbọchị izu ike
  rationale: Ihe odide Grik ji ụdị ọtụtụ, ya mere isi ederede na-egosi ụbọchị izu ike ndị ahụ n'ozuzu ha. A na-edebe ụdị otu, nke na-ada mfe n'Igbo, n'okpuru peeji kama ịgbanwe ọnụọgụ ahụ n'enweghị nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. “Lee” na-edebe ike okwu akụkọ ahụ; “kpọnwụrụ akpọnwụ” na-akọ ọnọdụ aka ahụ n'ebughị nkọwa ọgwụ na-adịghị n'ihe odide mbụ.
