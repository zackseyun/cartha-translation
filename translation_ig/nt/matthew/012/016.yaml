  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μὴ φανερὸν αὐτὸν ποιήσωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/016.yaml
  text: And he warned them not to make him known,[a]
translation:
  language: ig
  text: O wee dọọ ha aka ná ntị ka ha ghara ime ka a mara ya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “O nyere ha iwu siri ike” ma ọ bụ “O baara ha mba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: O wee
  rationale: Na-ejikọta ihe a na akụkọ bu ya ụzọ n’Igbo nkịtị ma na-egosighị nkọwa ọzọ na-adịghị na Grik.
- source_word: ἐπετίμησεν
  choice: dọọ ha aka ná ntị
  rationale: Okwu a nwere ike ịpụta ịba mba, inye iwu siri ike, ma ọ bụ ịdọ aka ná ntị. N’ebe a, nkebi na-esochi ya na-egosi ntụziaka siri ike ka ha ghara ikwusa ya; ‘dọọ ... aka ná ntị’ bụ Igbo doro anya nke na-adịghị ekwu na ha emehiela.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha dativ ọtụtụ nke na-arụtụ aka n’ebe ndị a kpọtụrụ aha n’akụkọ gbara amaokwu a gburugburu nọ.
- source_word: ἵνα μὴ
  choice: ka ha ghara
  rationale: Na-egosipụta ọdịnaya ma ọ bụ ebumnuche nke ịdọ aka ná ntị ahụ n’ụzọ Igbo sitere n’okike.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: ime ka a mara onye ọ bụ
  rationale: Na-egosipụta akpaalaokwu Grik nke pụtara ime ka mmadụ pụta ìhè ma ọ bụ ka ọha mara ya. Nkebi ‘onye ọ bụ’ na-echekwa na αὐτόν bụ onye a na-eme ka a mara, ma na-ada nke ọma n’Igbo.
theological_decisions:
- issue: Ụdị ntụziaka Jizọs nyere banyere ime ka a mara ya
  choice: Ịdọ aka ná ntị siri ike ka ha ghara ime ka a mara onye ọ bụ
  alternative: Ịba ha mba ma ọ bụ inye ha iwu siri ike
  rationale: ἐπιτιμάω nwere ike ibu nke ọ bụla n’ime echiche ndị a. Ọdịnaya nke ntụziaka ahụ doro anya, ma amaokwu ahụ ekwughị ihe kpatara ya; ya mere nsụgharị ahụ anaghị etinye nkọwa nkà mmụta okpukpe ọzọ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ike nke ἐπετίμησεν n’ahịrị bụ isi, ebe ndetu ala na-egosi ụzọ ndị ọzọ okwu Grik ahụ nwere ike isi pụta.
