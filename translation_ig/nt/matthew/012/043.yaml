id: MAT.12.43
reference: Matthew 12:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: ig
  text: Mgbe mmụọ na-adịghị ọcha si n’ime onye ahụ pụta, ọ na-agafe n’ebe mmiri na-adịghị[a], na-achọ izu ike, ma ọ naghị achọta ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ebe kpọrọ nkụ.” N’asụsụ Grik, okwu ahụ pụtara kpọmkwem “ebe mmiri na-adịghị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Mgbe
  rationale: “Mgbe” na-egosi ọnọdụ oge a na-ekwu n’ozuzu ya. A hapụrụ δέ ka njikọ dị nro nke ihe gbara amaokwu a gburugburu gosi, kama ịsụgharị ya dịka “ma,” nke nwere ike ime ka okwu ahụ yie ihe na-emegide ihe bu ya ụzọ.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: mmụọ na-adịghị ọcha
  rationale: Nke a na-edobe okwu Grik ahụ kpọmkwem na echiche ya banyere adịghị ọcha, na-enweghị iji okwu “mmụọ ọjọọ” dochie okwu isi mmalite ahụ.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: si n’ime onye ahụ pụta
  rationale: Nke a bụ ụzọ Igbo si ekwu mmegharị nke mmụọ na-apụ n’ahụ mmadụ n’ụzọ doro anya; “onye ahụ” na-egosipụta onye a kpọtụrụ n’ilu ihe atụ ahụ.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: ọ na-agafe n’ebe mmiri na-adịghị
  rationale: “Ebe mmiri na-adịghị” na-echekwa ihe oyiyi nkịtị nke ἀνύδρων, ya bụ ebe na-enweghị mmiri, karịa ịkọwa ya naanị dịka ebe kpọrọ nkụ.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: na-achọ izu ike
  rationale: Nke a na-egosi ọchịchọ izuike n’ụzọ Igbo dị mfe ma ghara ịgbakwunye echiche nke otu ebe izuike kpọmkwem.
- source_word: καὶ οὐχ εὑρίσκει
  choice: ma ọ naghị achọta ya
  rationale: “Ya” na-ezo aka n’izuike a na-achọ. “Ma” na-egosi n’ụzọ eke na ọchịchọ ahụ arụpụtaghị ihe, ebe καί jikọtara nkebiokwu abụọ ahụ.
theological_decisions:
- issue: Nsụgharị πνεῦμα n’okwu gbasara ịchụpụ mmụọ
  choice: mmụọ
  alternative: mmụọ ọjọọ
  rationale: Ọ bụ ezie na ihe a na-ekwu bụ mmụọ ọjọọ nke nwere onwe ya, ihe odide Grik kwuru “mmụọ na-adịghị ọcha,” ọ bụghị “mmụọ ọjọọ” ma ọ bụ “mmụọ ọjọọ nta.” Ya mere, “mmụọ” na-edobe okwu isi mmalite ahụ na esemokwu nkà mmụta okpukpe dị n’okwu ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ “onye ahụ” kama “nwoke ahụ” n’ihi na ἄνθρωπος ebe a na-ezo aka n’otu mmadụ n’ilu ihe atụ, ọ bụghị n’ihi mkpa ịkọwa okike ya. E tinyere akara nkọwa [a] ozugbo n’ebe okwu ἀνύδρων τόπων dị.
