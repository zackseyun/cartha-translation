id: MAT.12.31
reference: Matthew 12:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: ig
  text: 'N’ihi nke a, ana m agwa unu: A ga-agbaghara ndị mmadụ mmehie ọ bụla na nkwulu ọ bụla[b], ma a gaghị agbaghara nkwulu e kwuru megide Mmụọ[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Mmụọ Nsọ.” Ihe ndị gbara amaokwu a gburugburu na-egosi na “Mmụọ” bụ Mmụọ Nsọ, ọ bụ ezie na amaokwu a n’asụsụ Grik kwuru naanị “Mmụọ.”
    reason: alternative_reading
  - marker: b
    text: 'A pụkwara ịhazi okwu a otú a: “a ga-agbaghara ndị mmadụ maka mmehie ọ bụla na nkwulu ọ bụla.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe Jizọs kwuru tupu nke a; ọ bụkwa okwu Igbo doro anya ma dị ugbu a.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Ọ na-echekwa okwu Jizọs kwuru ozugbo nye ndị na-ege ya ntị, n’ụzọ Igbo na-ada nke ọma.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: mmehie ọ bụla na nkwulu ọ bụla
  rationale: Ikwughachi ‘ọ bụla’ na-egosipụta ike nkesa nke πᾶσα n’ụzọ doro anya, ma na-echekwa ụdị aha ndị dị n’otu n’otu na Grik.
- source_word: ἀφεθήσεται
  choice: a ga-agbaghara
  rationale: Ụdị a na-echekwa ọdịnihu na olu nnara nke ngwaa Grik, ma bụrụkwa ụzọ e si ekwu mgbaghara n’Igbo nkịtị.
- source_word: τοῖς ἀνθρώποις
  choice: ndị mmadụ
  rationale: Ọ na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke, ma na-egosipụta ndị a na-enye mgbaghara.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: ma ... nkwulu e kwuru megide Mmụọ
  rationale: A ghọtara genitive ahụ dị ka onye a na-ekwulu, ya bụ, nkwulu megide Mmụọ. ‘E kwuru’ na-eme ka okwu ahụ bụrụ Igbo eke n’enweghị ịgbakwunye ‘Nsọ,’ nke na-adịghị na amaokwu Grik a.
theological_decisions:
- issue: Ma a ga-asụgharị πνεύματος dị ka ‘Mmụọ’ ka ọ bụ ‘Mmụọ Nsọ’
  choice: Mmụọ
  alternative: Mmụọ Nsọ
  rationale: Amaokwu Grik a kwuru naanị ‘Mmụọ,’ ọ bụ ezie na ihe gbara ya gburugburu na-eme ka o doo anya na ọ bụ Mmụọ Nsọ. Isi ederede na-echekwa okwu amaokwu ahụ n’onwe ya, ebe nkọwa ala peeji na-akọwa onye ọ na-ezo aka na ya.
- issue: Ihe genitive τοῦ πνεύματος pụtara
  choice: megide Mmụọ
  alternative: nkwulu nke Mmụọ
  rationale: N’ọnọdụ a, Mmụọ bụ onye a na-ekwulu, ọ bụghị onye na-ekwu nkwulu. Nsụgharị ‘megide Mmụọ’ na-egosipụta nke a nke ọma n’enweghị ịgbanwe esemokwu nke amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ ‘nkwulu’ maka okwu mmegide dị nsọ, ma debe usoro olu nnara nke Grik ebe ọ ka na-ada nke ọma n’Igbo.
