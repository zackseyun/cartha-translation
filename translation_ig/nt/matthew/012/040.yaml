revisions:
- from: N’ihi na dịka Jona nọ n’afọ nnukwu anụ mmiri[a] ụbọchị atọ na abalị atọ[b], otu ahụ ka Nwa nke Mmadụ ga-anọ n’obi ala[c] ụbọchị atọ na abalị atọ.
  to: N’ihi na, dịka Jona nọ n’afọ nnukwu anụ mmiri[a] ụbọchị atọ na abalị atọ[b], otu a ka Nwa nke Mmadụ ga-adị n’ime obi ụwa[c] ụbọchị atọ na abalị atọ.
  rationale: 'The revision makes two limited, source-oriented improvements: it renders “in the heart of the earth” as “n’ime obi ụwa,” preserving both the metaphor and its ambiguity, and changes “ga-anọ” to “ga-adị” to avoid introducing an unnecessary nuance of remaining. It also regularizes punctuation in the comparative construction. Footnote anchors and their corresponding subjects remain intact.'
