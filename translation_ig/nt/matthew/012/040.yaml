id: MAT.12.40
reference: Matthew 12:40
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: ig
  text: N’ihi na, dịka Jona nọ n’afọ nnukwu anụ mmiri[a] ụbọchị atọ na abalị atọ[b], otu a ka Nwa nke Mmadụ ga-adị n’ime obi ụwa[c] ụbọchị atọ na abalị atọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “nnukwu azụ.” Okwu Grik ahụ pụtara nnukwu anụ bi na mmiri, ọ bụghị otu ụdị anụ kpọmkwem.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ na-aghọta “ụbọchị atọ na abalị atọ” dịka akpaalaokwu nke nwere ike ịgụnye akụkụ ụbọchị atọ; ndị ọzọ na-aghọta ya dịka oge ahụ kpọmkwem.
    reason: alternative_reading
  - marker: c
    text: “N’ime obi ụwa” nwere ike ịpụta ili, olili, omimi ala, ma ọ bụ ebe ndị nwụrụ anwụ nọ; isi ederede debere ihe atụ Grik ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: N’ihi na dịka
  rationale: Ọ na-egosipụta ma njikọ nkọwa nke γάρ ma ntụnyere nke ὥσπερ n’ụzọ Igbo doro anya.
- source_word: Ἰωνᾶς
  choice: Jona
  rationale: Ọ bụ ụdị aha onye amụma a a na-ejikarị n’Igbo.
- source_word: ἐν τῇ κοιλίᾳ
  choice: n’afọ
  rationale: “Afọ” bụ okwu Igbo nkịtị ma dabara adaba maka κοιλία n’ebe a.
- source_word: τοῦ κήτους
  choice: nnukwu anụ mmiri
  rationale: κῆτος na-egosi nnukwu ihe e kere eke bi na mmiri; nsụgharị a anaghị eme ka ọ bụrụ otu ụdị azụ kpọmkwem.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: ụbọchị atọ na abalị atọ
  rationale: Ọ na-edobe okwu oge ahụ kpọmkwem dịka isi mmalite si kwuo ya.
- source_word: οὕτως
  choice: otu ahụ ka
  rationale: Ọ na-ejikọta akụkụ nke abụọ nke ntụnyere ahụ n’Igbo sitere n’okike.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Ọ na-edobe aha nsọpụrụ ahụ na ụda Akwụkwọ Nsọ ya n’enweghị ịkọwa ya karịa ihe odide ahụ.
- source_word: ἔσται
  choice: ga-anọ
  rationale: Ọ na-egosipụta ọdịnihu nke εἰμί n'ụzọ dabara na ọnọdụ ebe a, n’etinyeghị echiche ọzọ nke ịdịgide.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: n’obi ala
  rationale: Ọ na-edobe ihe atụ nke καρδία (“obi”) ma zere ikpebi ma ọ pụtara ili, ebe ndị nwụrụ anwụ, ma ọ bụ omimi ala.
theological_decisions:
- issue: Ihe “n’obi ala” pụtara
  choice: E debere okwu ihe atụ ahụ dịka “n’obi ala.”
  alternative: n’ili; n’omimi ala; n’ebe ndị nwụrụ anwụ nọ
  rationale: Grik ahụ anaghị amanye otu nkọwa naanị; idobe ihe atụ ahụ na-echekwa nghọtahie na esemokwu nkọwa dị n’ime okwu ahụ.
- issue: Ike okwu “ụbọchị atọ na abalị atọ”
  choice: E debere okwu oge ahụ n’ụdị ya kpọmkwem.
  alternative: Akpaalaokwu na-agụnye akụkụ ụbọchị atọ; awa iri asaa na abụọ zuru ezu
  rationale: Amaokwu ahụ kwuru okwu ahụ kpọmkwem, ya mere nsụgharị ahụ ekwesịghị ikpebi esemokwu gbasara usoro oge n’ime isi ederede.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwụ ọtọ ma nwee ugwu. E ji “nnukwu anụ mmiri” zere ime κῆτος ka ọ bụrụ azụ kpọmkwem, ma e debere “n’obi ala” dịka ihe atụ. Ihe nrịbama nkọwa ala peeji niile pụtara n’isi ederede.
