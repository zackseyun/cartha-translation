id: MAT.12.21
reference: Matthew 12:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τῷ ὀνόματι αὐτοῦ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/021.yaml
  text: and in his name the nations will hope[a].
translation:
  language: ig
  text: Mba dị iche iche ga-atụkwasịkwa olileanya n’aha ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndị mba ọzọ ga-atụkwasị olileanya n’aha ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: -kwa
  rationale: E ji mgbakwunye “-kwa” jikọta ahịrịokwu a na okwu e kwuru tupu ya, dịka njikọ καὶ si arụ ọrụ n’ebe a.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: n’aha ya
  rationale: Nke a na-edobe echiche nke ịtụkwasị olileanya n’aha ya, ya bụ, n’onye ọ bụ na ikike aha ya na-anọchi anya ya, n’agbanyeghị na a kọwaghị ya karịa ka Grik mere.
- source_word: ἔθνη
  choice: mba niile
  rationale: ἔθνη nwere ike ịpụta mba dị iche iche ma ọ bụ ndị mba ọzọ. “Mba niile” na-egosipụta mbara echiche nke amụma Aịzaya ma na-agụnyekwa ndị na-abụghị ndị Izrel.
- source_word: ἐλπιοῦσιν
  choice: ga-atụkwasị olileanya ha
  rationale: Ụdị a na-egosipụta ọdịnihu nke ngwaa ahụ ma na-ada nke ọma n’Igbo; ọ na-edobekwa echiche bụ ‘inwe olileanya’ kama ime ya naanị ‘ịtụkwasị obi.’
theological_decisions:
- issue: Otú e si sụgharịa ἔθνη n’amụma banyere Mesaya
  choice: mba niile
  alternative: ndị mba ọzọ
  rationale: “Mba niile” na-edobe mbara amụma ahụ banyere ndị dị iche iche, ebe “ndị mba ọzọ” na-akọwapụta ndị na-abụghị ndị Izrel. E tinyere nke abụọ n’ala ala peeji iji chekwaa nghọta abụọ ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “ịtụkwasị olileanya” mee ka okwu ahụ bụrụ nke ebumpụta ụwa n’Igbo, ma debe njikọ ya na “n’aha ya.”
