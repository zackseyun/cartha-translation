    issue: '"Mba niile" adds "all."'
    rationale: ἔθνη is plural, "nations," but has no equivalent of πάντες/"all." The added quantifier makes the statement more explicit than the Greek text.
  revised_text: Mba dị iche iche ga-atụkwasịkwa olileanya n’aha ya.[a]
