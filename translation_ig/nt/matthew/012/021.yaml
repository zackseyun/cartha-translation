review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the future sense of ἐλπιοῦσιν and the phrase "n’aha ya" faithfully preserves τῷ ὀνόματι αὐτοῦ. However, "mba niile" means "all nations" and adds a universal quantifier not present in ἔθνη. "Mba dị iche iche" better conveys the unquantified plural and the broad Isaianic scope.
  naturalness: '"Ga-atụkwasị olileanya n’aha ya" is natural, clear Standard Igbo. Omitting "ha" avoids adding a possessive that is not expressed in Greek and makes the line more concise. The enclitic "-kwa" naturally carries the connective force of καὶ in this continuation of the preceding quotation.'
  terminology: '"Mba dị iche iche" preserves the primary "nations/peoples" sense without prematurely narrowing ἔθνη to "ndị mba ọzọ" (Gentiles). The footnote appropriately records that narrower contextual alternative.'
  issues:
