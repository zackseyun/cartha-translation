id: MAT.12.27
reference: Matthew 12:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: ig
  text: Ọ bụrụkwa na m ji Beelzebul[a] achụpụ ndị mmụọ ọjọọ, ònye ka ụmụ unu ji achụpụ ha? N’ihi ya, ha ga-abụ ndị ikpe unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grik: “Beelzebul”; ọtụtụ nsụgharị na-eji “Beelzebub.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: ji Beelzebul
  rationale: N'ebe a, ἐν na-egosi onye ma ọ bụ ike e ji eme ihe. “Ji Beelzebul” bụ ụzọ Igbo si ekwu nke a nke ọma ma na-edebe aha ahụ dịka ọ dị n'edemede Grik.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: achụpụ ndị mmụọ ọjọọ
  rationale: “Ịchụpụ” na-egosi iwepụ ha n'ike; “ndị mmụọ ọjọọ” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa δαιμόνια.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: ụmụ unu
  rationale: Nke a na-edebe okwu ikwu-nwanne nke Grik na-enweghị ịkọwa ya n'ụzọ ga-emechi ihe ọ pụrụ ịpụta n'okwu a, dịka ndị otu ha ma ọ bụ ndị na-eso ụzọ ha.
- source_word: ἐν τίνι
  choice: ọ̀ bụ onye ka ... ji
  rationale: Ajụjụ a na-achọ onye ma ọ bụ ike ha ji achụpụ ndị mmụọ ọjọọ. Usoro a bụ Igbo ebumpụta ụwa ma na-edebe echiche instrumental/agentive nke ἐν.
- source_word: διὰ τοῦτο
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu sitere n'ajụjụ ahụ ma bụrụ okwu Igbo dị mfe ma kpọmkwem.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: ha ga-abụ ndị ikpe unu
  rationale: Nke a na-edebe aha κριταί na ọdịdị ọdịnihu nke ahịrịokwu ahụ, kama ịgbanwe ya naanị ka ọ bụrụ ngwaa “ha ga-ekpe unu ikpe.”
theological_decisions:
- issue: Ụdị na njirimara aha Βεελζεβούλ
  choice: Beelzebul
  alternative: Beelzebub
  rationale: A gbasoro ụdị aha ahụ dị na SBLGNT, Βεελζεβούλ, ma dee ya dịka aha nke mmadụ/ike mmụọ; e debere ụdị ọdịnala a maara nke ọma na nkọwa ala peeji.
- issue: Ihe “ụmụ unu” na-ezo aka na ya
  choice: Idobe “ụmụ unu” n'enweghị nkọwa ọzọ n'ahịrịokwu
  alternative: ndị unu / ndị na-eso ụzọ unu
  rationale: Grik kwuru οἱ υἱοὶ ὑμῶν n'ụzọ nkịtị. Ọ bụ ezie na ọ pụrụ izo aka n'òtù ndị na-ege ntị ma ọ bụ ndị na-eso ụzọ ha, idobe okwu ahụ na-echekwa mgbagwoju anya na ike arụmụka Jizọs.
translation_notes:
  register: E jiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Ji ... achụpụ” na-eme ka echiche nke agency/means pụta n'ụzọ ebumpụta ụwa; e debere “ụmụ unu” na “ndị ikpe unu” iji soro ọdịdị Grik nso n'enweghị ịgbagọ echiche ya.
