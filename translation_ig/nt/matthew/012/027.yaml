  terminology: “Beelzebul,” “ndị mmụọ ọjọọ,” “ụmụ unu,” and “ndị ikpe unu” are suitable Standard Igbo choices. The footnote correctly identifies the Greek form and preserves the familiar alternative spelling without treating it as the source reading.
