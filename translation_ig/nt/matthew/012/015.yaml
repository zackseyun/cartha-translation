id: MAT.12.15
reference: Matthew 12:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: ig
  text: Ma Jizọs, ebe ọ matara nke a[a], si n’ebe ahụ wezuga onwe ya. Ọtụtụ mmadụ sooro ya, o wee gwọọ ha niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ma Jizọs, ebe ọ matara ya, si n’ebe ahụ wezuga onwe ya.” N’asụsụ Grik, ekwughị ihe ọ matara kpọmkwem; ihe gbara amaokwu bu ụzọ gburugburu na-egosi ya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: matara nke a
  rationale: Ngwaa a na-egosi na Jizọs buru ụzọ mata ihe a tupu o wezuga onwe ya. ‘Nke a’ na-ezo aka n’atụmatụ ndị Farisii dị n’amaokwu bu ụzọ, ma ọ naghị akọwa ya karịa otú ihe gbara amaokwu ahụ gburugburu si gosi.
- source_word: ἀνεχώρησεν
  choice: esi n’ebe ahụ wezuga onwe ya
  rationale: Nke a na-echekwa echiche nke iji nzube si n’ebe mmegide dị pụọ, ọ bụghị naanị ịpụ n’ebe ahụ; ọ naghịkwa egosi na Jizọs mere ya n’ihi ụjọ.
- source_word: ἐκεῖθεν
  choice: n’ebe ahụ
  rationale: Ọ bụ ụzọ Igbo dị mkpụmkpụ ma bụrụkwa nke nkịtị isi gosipụta ebe mmadụ si pụọ.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: Ọtụtụ mmadụ sokwaara ya
  rationale: πολλοί pụtara ‘ọtụtụ’; ederede Grik ekwughị kpọmkwem na ha bụ ìgwè mmadụ buru ibu.
- source_word: ἐθεράπευσεν
  choice: gwọọ
  rationale: N’akụkọ Oziọma banyere iweghachi ahụ ike, ‘ịgwọ’ bụ okwu Igbo doro anya ma kwekọọ n’ihe θεραπεύω pụtara.
- source_word: αὐτοὺς πάντας
  choice: ha niile
  rationale: 'Nke a na-echekwa ihe πάντας pụtara: Jizọs gwọrọ ndị ahụ niile.'
theological_decisions:
- issue: Ihe γνοὺς na-ezo aka na ya ekwughị ya kpọmkwem
  choice: matara nke a
  alternative: matara ya; bịara mata ihe ahụ
  rationale: Asụsụ Grik hapụrụ ihe a matara n’ekwughị ya aha. ‘Nke a’ na-ejikọta amaokwu ahụ na atụmatụ ọjọọ ndị Farisii n’amaokwu bu ụzọ, n’etinyeghị nkọwa ozizi ọzọ.
- issue: Ụdị ọpụpụ Jizọs
  choice: wezuga onwe ya
  alternative: pụọ; lawa
  rationale: Nhọrọ a na-echekwa echiche nke ọpụpụ nwere nzube n’ihi mmegide, ma ọ naghị ekwu na ọ bụ ụjọ mere Jizọs ji pụọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Wezuga onwe ya’ na-enye echiche nke purposeful withdrawal, ebe ‘ọtụtụ mmadụ’ na-ezere ịgbanwe πολλοί ka ọ bụrụ ‘nnukwu ìgwè mmadụ.’
