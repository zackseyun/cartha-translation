- from: N'oge ahụ, Jizọs gara n'etiti ubi ọka n'ụbọchị izu ike[a]. Agụụ wee gụ ndị na-eso ụzọ ya, ha amalite ịghọrọ isi ọka ma na-eri ha.
  to: N'oge ahụ, Jizọs sitere n'ubi ọka gafee n'ụbọchị izu ike[a]. Agụụ gụrụ ndị na-eso ụzọ ya, ha malitere ịghọrọ isi ọka na iri ya.
  rationale: The revision corrects the past-tense verbal form required by the narrative and makes Jesus’ movement ‘through the grainfields’ more explicit. It retains the source sequence and ambiguity-free idiomatic understanding of the Greek plural for Sabbath, with the existing footnote preserved.
