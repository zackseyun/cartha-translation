id: MAT.12.1
reference: Matthew 12:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: ig
  text: N'oge ahụ, Jizọs sitere n'ubi ọka gafee n'ụbọchị izu ike[a]. Agụụ gụrụ ndị na-eso ụzọ ya, ha malitere ịghọrọ isi ọka na iri ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “n'ụbọchị izu ike” dị n'ụdị ọtụtụ; n'ebe a, ọ bụ akpaala okwu pụtara “n'ụbọchị izu ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: N'oge ahụ
  rationale: Nke a na-egosi oge ma ọ bụ ọnọdụ ihe a mere, ọ bụghị kpọmkwem oge elekere; ọ bụkwa ụzọ Igbo si ekwu ya nke ọma.
- source_word: ἐπορεύθη
  choice: gara
  rationale: Ngwaa a pụtara ịga ma ọ bụ ime njem; “gara” zuru ezu ma kwekọọ n'usoro akụkọ a.
- source_word: τοῖς σάββασιν
  choice: n'ụbọchị izu ike
  rationale: Ọ bụ ezie na okwu Grik dị n'ụdị ọtụtụ, nke a bụ akpaala okwu na-ezo aka n'ụbọchị izu ike. E tinyere nkọwa ala peeji iji mee ka ọdịdị Grik doo anya.
- source_word: διὰ τῶν σπορίμων
  choice: n'etiti ubi ọka
  rationale: σπόριμος na-ezo aka n'ubi a kụrụ ihe, karịchaa ubi ọka; “n'etiti ubi ọka” na-egosi na Jizọs si n'ime ha gafee.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: δέ bụ njikọ akụkọ dị nro n'ebe a; usoro ahịrịokwu Igbo achọghị ka a sụgharịa ya dịka okwu na-egosi nnukwu mmegide.
- source_word: ἐπείνασαν
  choice: Agụụ wee gụ
  rationale: Nke a na-egosi na agụụ malitere ịgụ ha, dabara n'ọrụ aorist nke ngwaa Grik.
- source_word: ἤρξαντο
  choice: amalite
  rationale: Ọ na-egosi mmalite omume ndị sochirinụ.
- source_word: τίλλειν
  choice: ịghọrọ
  rationale: τίλλω pụtara iji aka dọpụ ma ọ bụ ghọrọ ihe n'osisi; “ịghọrọ” dabara n'ịwepụ isi ọka.
- source_word: στάχυας
  choice: isi ọka
  rationale: στάχυς bụ isi ma ọ bụ ntị ọka; “isi ọka” bụ okwu doro ndị Igbo nke oge a anya.
- source_word: καὶ ἐσθίειν
  choice: ma na-eri ha
  rationale: Nke a na-edebe iri ọka dịka omume nke abụọ a malitere, ma na-eme ka onye ihe nnọchi anya “ha” na-ezo aka na isi ọka doo anya n'Igbo.
theological_decisions:
- issue: Nsụgharị nke σάββασιν
  choice: n'ụbọchị izu ike
  alternative: n'ụbọchị izu ike dị iche iche
  rationale: Ụdị okwu Grik bụ ọtụtụ, ma n'okwu a ọ bụ akpaala okwu na-ezo aka n'otu ụbọchị izu ike. Nsụgharị otu ụbọchị na-egbochi echiche na ihe ahụ mere n'ụbọchị izu ike karịrị otu, ebe nkọwa ala peeji na-echekwa ọdịdị okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ụbọchị izu ike” na-akọwa Sabbath n'enweghị itinye nkọwa otu ụka, ebe “ndị na-eso ụzọ” bụ okwu Igbo a na-aghọta nke ọma maka μαθηταί.
