review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the sequence: the spirit goes, takes seven additional spirits worse than itself, they enter and reside there, the man’s final condition is worse, and the saying is applied to the evil generation. The plural rendering of the neuter-plural spirits with singular κατοικεῖ is appropriate in Igbo.'
  naturalness: The opening serial construction “ọ na-aga kpọrọ” is not idiomatic modern Standard Igbo for a present/narrative action. “ọ na-aga ịkpọrọ” is grammatical and clearly expresses that it goes to take the other spirits along. The remaining clauses are natural and suitably formal.
  terminology: “mmụọ,” “ndị ka ya njọ,” “ọnọdụ ikpeazụ,” and “ọgbọ ọjọọ a” are accurate, clear, and do not add doctrinal interpretation. “Nwoke ahụ” appropriately reflects the representative masculine singular in the source.
  issues:
  - severity: medium
    issue: Ungrammatical verbal construction in the first clause
    rationale: “Ọ na-aga kpọrọ” combines the progressive construction with a completed-form verb in a way that is not natural Standard Igbo. Replacing it with “ọ na-aga ịkpọrọ” preserves the narrative sequence and the sense of taking the spirits along.
  revised_text: Mgbe ahụ, ọ na-aga ịkpọrọ mmụọ asaa ọzọ, ndị ka ya njọ, ka ha soro ya[a]. Ha wee banye biri n’ebe ahụ. Ọnọdụ ikpeazụ nke nwoke ahụ wee dị njọ karịa nke mbụ[b]. Otú ahụ ka ọ ga-adịkwara ọgbọ ọjọọ a.
