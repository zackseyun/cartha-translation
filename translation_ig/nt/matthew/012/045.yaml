id: MAT.12.45
reference: Matthew 12:45
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: ig
  text: Mgbe ahụ, ọ na-aga ịkpọrọ mmụọ asaa ọzọ, ndị ka ya njọ, ka ha soro ya[a]. Ha wee banye biri n’ebe ahụ. Ọnọdụ ikpeazụ nke nwoke ahụ wee dị njọ karịa nke mbụ[b]. Otú ahụ ka ọ ga-adịkwara ọgbọ ọjọọ a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “mmụọ asaa dị iche, ndị ka ya njọ.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “ihe ikpeazụ nke nwoke ahụ na-aka ihe mbụ njọ”; nke a bụ akpaalaokwu pụtara na ọnọdụ ya n’ikpeazụ dị njọ karịa ọnọdụ ya na mbụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi nzọụkwụ na-esote n’usoro akụkọ ahụ n’asụsụ Igbo doro anya.
- source_word: πορεύεται
  choice: ọ na-aga
  rationale: Ọ na-echekwa present tense e ji mee ka akụkọ ahụ dị ndụ, ma na-ekwupụta omume mmụọ ahụ n'ụzọ nkịtị.
- source_word: παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: kpọrọ ... ka ha soro ya
  rationale: Nke a na-egosi ma ịkpọrọ ndị ọzọ ma iso onye ahụ gaa, n’usoro okwu Igbo sitere n’okike.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: mmụọ asaa ọzọ
  rationale: ἕτερα n’ebe a na-egosi mmụọ ndị ọzọ a gbakwụnyere na nke mbụ; ‘mmụọ’ na-edebe okwu Grik n’enweghị ịgbanwe ya ka ọ bụrụ ‘ndị mmụọ ọjọọ.’
- source_word: πονηρότερα ἑαυτοῦ
  choice: ndị ka ya njọ
  rationale: 'Ọ na-echekwa ntụnyere ahụ: mmụọ ndị a dị njọ karịa mmụọ mbụ ahụ.'
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: Ha wee banye biri n’ebe ahụ
  rationale: Ọ na-egosi usoro omume abụọ ahụ—ịbanye na ibiri—n’ụzọ Igbo dị ire, ma na-ewere mmụọ niile dị ka ndị bịara biri n’ebe ahụ dịka ihe gbara ya gburugburu na-egosi.
- source_word: τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: Ọnọdụ ikpeazụ nke nwoke ahụ
  rationale: Akpaalaokwu Grik ahụ na-ekwu maka ọnọdụ nwoke ahụ n’ikpeazụ; ‘ọnọdụ ikpeazụ’ na-eme ka ihe ọ pụtara doo anya n’Igbo.
- source_word: χείρονα τῶν πρώτων
  choice: dị njọ karịa nke mbụ
  rationale: Ọ na-echekwa ntụnyere dị n’etiti ọnọdụ ikpeazụ na ọnọdụ mbụ.
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: Otú ahụ ka ọ ga-adịkwara ọgbọ ọjọọ a
  rationale: Ọ na-etinye ihe atụ ahụ n’ọrụ nye ọgbọ a ma na-echekwa nkọwa Grik banyere ya dịka ọgbọ ọjọọ.
theological_decisions:
- issue: Nkọwa πνεύματα n’okwu gbasara mmụọ ọjọọ
  choice: mmụọ
  alternative: ndị mmụọ ọjọọ
  rationale: Grik kwuru ‘mmụọ,’ ebe ihe ndị gbara amaokwu a gburugburu egosilarị na ha bụ mmụọ na-adịghị ọcha. Idebe ‘mmụọ’ na-ezere itinye okwu akọwapụtara karịa nke isi mmalite ji.
- issue: Ụdị nwoke na nwanyị nke ἀνθρώπου
  choice: nwoke ahụ
  alternative: onye ahụ
  rationale: Ihe atụ ahụ dị n’otu onye, okwu Grik ahụ dịkwa n’ụdị nwoke. ‘Nwoke ahụ’ na-echekwa nkọwa ahụ n’enweghị ime ka ọ bụrụ okwu na-anọghị n’ụdị nwoke ma ọ bụ nwanyị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ndị ahụ na-agbaso usoro akụkọ ahụ, ebe ‘ọnọdụ ikpeazụ’ na-akọwa akpaalaokwu Grik n’enweghị iwepụ nkọwa ya na ntụnyere ahụ.
