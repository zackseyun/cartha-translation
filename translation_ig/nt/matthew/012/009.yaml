id: MAT.12.9
reference: Matthew 12:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ἦλθεν εἰς τὴν συναγωγὴν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: ig
  text: O si n’ebe ahụ pụọ wee banye n’ụlọ nzukọ ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: wee
  rationale: “Wee” bụ njikọ akụkọ dị mma n’Igbo nke na-ejikọta ihe a na ihe bu ya ụzọ, n’etinyeghị nkọwa oge ọzọ na-adịghị na Grik.
- source_word: μεταβὰς
  choice: si ... pụọ
  rationale: Nkebiokwu a na-egosi na ọ hapụrụ ebe ọ nọ wee gawa ebe ọzọ; e tinyere ya n’usoro ngwaa na-aga n’ihu nke na-ada nke ọma n’Igbo.
- source_word: ἐκεῖθεν
  choice: n’ebe ahụ
  rationale: Nke a na-ezo aka n’ebe a kpọtụrụ aha n’akụkọ bu ụzọ ma kwekọọ kpọmkwem na echiche ‘site n’ebe ahụ.’
- source_word: ἦλθεν
  choice: banye
  rationale: N’ihi na εἰς na-egosi ngagharị banye n’ime ebe ahụ, “banye” na-enye ngagharị ahụ n’Igbo n’ụzọ doro anya ma dịkwa eke.
- source_word: εἰς τὴν συναγωγὴν
  choice: n’ụlọ nzukọ
  rationale: “Banye n’ụlọ nzukọ” na-echekwa echiche ngagharị banye n’ime ebe nzukọ ahụ, ọ bụghị naanị iru ya nso.
- source_word: συναγωγὴν
  choice: ụlọ nzukọ
  rationale: “Ụlọ nzukọ” bụ okwu Igbo doro anya maka ebe ndị Juu na-ezukọ maka ofufe na nkuzi n’ọnọdụ a.
- source_word: αὐτῶν
  choice: ha
  rationale: “Ha” na-echekwa nnọchiaha nke mmadụ ọtụtụ n’enweghị ịkọwapụta ndị ọ na-ezo aka na ha karịa ka Grik mere.
theological_decisions:
- issue: Ndị okwu ahụ bụ “ụlọ nzukọ ha” na-ezo aka na ha
  choice: E dere ya n’enweghị mgbakwunye dịka “ụlọ nzukọ ha.”
  alternative: ụlọ nzukọ nke ndị Juu nọ n’ebe ahụ
  rationale: Grik ji naanị αὐτῶν mee ihe, ọ kọwaghị kpọmkwem otu ndị ahụ ma ọ bụ nye okwu ahụ ụda iro; nsụgharị ahụ na-echekwa enweghị nkọwa zuru ezu a.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. Usoro “wee ... pụọ, banye” na-eme ka ngagharị abụọ ahụ doo anya ma na-agụkwa nke ọma n’akụkọ.
