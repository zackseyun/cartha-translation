id: MAT.12.11
reference: Matthew 12:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: ig
  text: Ma ọ sịrị ha, “Kedu nwoke n’ime unu ga-enwe otu atụrụ, ma ọ bụrụ na atụrụ ahụ adaba n’olulu n’ụbọchị Sabat, ọ gaghị ejide ya ma bulie ya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: Ònye n’ime unu bụ nwoke
  rationale: Ọ na-enye ajụjụ nkwupụta nke Grik n’ụzọ Igbo dị ndụ, ma na-edobe nwoke otu onye e ji maa atụ.
- source_word: πρόβατον ἕν
  choice: otu atụrụ
  rationale: Ọ na-edobe ọnụọgụ ‘otu’ nke na-eme ka ihe atụ ahụ doo anya.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: ọ bụrụ na ọ daba
  rationale: Nke a na-egosipụta ọnọdụ a tụrụ anya ya n’Igbo nkịtị; nnọchiaha ahụ na-ezo aka n’atụrụ ahụ.
- source_word: τοῖς σάββασιν
  choice: n’ụbọchị izu ike
  rationale: Ọ bụ ụzọ Igbo doro anya isi kwuo ụbọchị Sabbath; ọtụtụ nke Grik bụ ojiji akpaalaokwu ebe a.
- source_word: εἰς βόθυνον
  choice: n’olulu
  rationale: ‘Olulu’ bụ okwu sara mbara ma kwekọọ na βόθυνος, n’enweghị ịkọwa ụdị olulu a na-ekwughị.
- source_word: οὐχὶ κρατήσει αὐτὸ
  choice: na-agaghị ejide ya
  rationale: Ajụjụ ahụ na-atụ anya azịza ee; ‘ejide’ na-egosipụta ijidesi anụmanụ ahụ ike.
- source_word: καὶ ἐγερεῖ
  choice: ma bulite ya
  rationale: Ọ na-edobe echiche bụ isi nke ibuli atụrụ ahụ, na-ahapụghị ihe Grik na-ekwughị n’ụzọ kpọmkwem ka ọ bụrụ okwu doro anya agbakwunyere.
theological_decisions:
- issue: Asụsụ nnọchiteanya nwere njirimara nwoke
  choice: nwoke
  alternative: mmadụ
  rationale: ἄνθρωπος dị n’ụdị nwoke otu onye n’ihe atụ a; ‘nwoke’ na-edobe ọdịdị na usoro okwu nke isi mmalite.
- issue: Ntụgharị σάββασιν
  choice: n’ụbọchị izu ike
  alternative: n’ụbọchị izu ike ọ bụla; n’ụbọchị izu ike dị iche iche
  rationale: Ọtụtụ nke Grik bụ akpaalaokwu nke na-ezo aka n’otu ụbọchị Sabbath n’ọnọdụ esemokwu banyere iwu Sabbath.
- issue: Ihe ἐγερεῖ pụtara n’ọnọdụ a
  choice: bulite ya
  alternative: wepụta ya n’olulu
  rationale: ‘Bulite ya’ na-edobe okwu Grik n’obosara ya, ebe ọnọdụ olulu ahụ na-eme ka ebumnuche ahụ pụta ìhè n’enweghị ịgbakwunye ‘pụta’ n’ahịrị isi.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ụbọchị izu ike’ mee Sabbath n’ụzọ onye Igbo nkịtị ga-aghọta; e debere ajụjụ nkwupụta nke na-atụ anya azịza ee.
