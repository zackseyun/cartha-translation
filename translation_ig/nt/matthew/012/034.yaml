revisions:
- from: Ụmụ ajụala, olee otú unu pụrụ isi kwuo ihe ọma ebe unu bụ ndị ajọ omume? N’ihi na ọnụ na-ekwu ihe juputara n’obi.[a]
  to: Ụmụ ajụala, olee otú unu pụrụ isi kwuo ihe ọma ebe unu bụ ndị ajọ omume? N’ihi na ọnụ na-ekwu okwu site n’ihe obi jupụtara na ya.[a]
  rationale: The revision only clarifies the final causal statement so that the mouth’s speech is explicitly said to come from the heart’s fullness, as in the Greek. The footnote supplies the closer formal alternative using ‘ụba’ (‘abundance’).
  reviewer_model: gpt-5.6-terra
