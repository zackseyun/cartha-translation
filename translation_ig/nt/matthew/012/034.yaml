id: MAT.12.34
reference: Matthew 12:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: ig
  text: Ụmụ ajụala, olee otú unu pụrụ isi kwuo ihe ọma ebe unu bụ ndị ajọ omume? N’ihi na ọnụ na-ekwu okwu site n’ihe obi jupụtara na ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi na site n’ụba nke obi ka ọnụ na-ekwu okwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: Ụmụ ajụala
  rationale: Nke a na-edobe ihe atụ siri ike banyere ndị ajụala mụrụ ma na-egosi myirịta n’agwa; ọ bụkwa okwu Igbo doro anya ma dị ndụ.
- source_word: πῶς δύνασθε
  choice: olee otú unu pụrụ isi
  rationale: Ọ na-egosipụta ajụjụ ịma aka nke na-akọwa enweghị ike ime nke ahụ n’ọnọdụ e kwuru.
- source_word: ἀγαθὰ λαλεῖν
  choice: kwuo ihe ọma
  rationale: Ọ na-edobe ἀγαθά dị ka ihe ndị a na-ekwu, n’ụzọ Igbo dị mfe ma kwekọọ n’isi mmalite.
- source_word: πονηροὶ ὄντες
  choice: ebe unu bụ ndị ajọ omume
  rationale: ‘Ebe’ na-egosi ọnọdụ ma ọ bụ ihe kpatara ajụjụ ahụ, ‘ndị ajọ omume’ na-echekwa ịdị arọ nke ikpe omume dị na πονηροί.
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: N’ihi na ... ihe juputara n’obi
  rationale: Nhazi Igbo a na-egosi na okwu ọnụ si n’uju dị n’ime obi pụta, ma na-echekwa obi dịka ebe echiche, ọchịchọ, na omume mmadụ si malite.
- source_word: τὸ στόμα λαλεῖ
  choice: ọnụ na-ekwu
  rationale: Ọ bụ ntụgharị kpọmkwem ma bụrụkwa okwu Igbo e ji eme ihe n’ụzọ nkịtị.
theological_decisions:
- issue: Ihe ‘obi’ pụtara dịka ihe atụ
  choice: Edebere ‘obi’ dịka okwu Akwụkwọ Nsọ maka ime mmadụ.
  alternative: ime mmadụ; uche
  rationale: καρδία nwere ike ịgụnye echiche, ọchịchọ, na ọnọdụ ime mmụọ mmadụ; ịsụgharị ya naanị dịka ‘uche’ ga-eme ka ihe ọ pụtara dị warara.
- issue: Ike nke πονηροὶ ὄντες n’ihe banyere omume
  choice: ndị ajọ omume
  alternative: ndị ọjọọ; ebe unu dị njọ
  rationale: Nke a na-edobe ikpe gbasara omume ọma na ajọ omume n’enweghị ime ka okwu ahụ dị nro ma ọ bụ tinye ihe karịrị isi mmalite.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ajụjụ ịma aka ahụ, ihe atụ banyere ajụala, na ‘obi’ dịka etiti nke ime mmadụ. Akara nkọwa ala [a] dị n’ederede isi.
