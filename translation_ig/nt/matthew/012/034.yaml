review_pass:
  verdict: revise
  source_fidelity: The rebuke, rhetorical question, moral force of πονηροὶ, and the metaphor of vipers are retained. The final clause in the draft, however, can mean that the mouth speaks 'things that are full in the heart,' rather than explicitly expressing that speech proceeds from the heart's fullness (ἐκ τοῦ περισσεύματος).
  naturalness: ‘Ụmụ ajụala,’ ‘olee otú unu pụrụ isi,’ and ‘ebe unu bụ ndị ajọ omume’ are natural, appropriately forceful Standard Igbo in this context. Recasting the final clause with ‘site n’ihe obi jupụtara na ya’ is idiomatic and makes the source relationship clear.
  terminology: ‘Ajụala’ suitably renders the viper image, and ‘obi’ appropriately retains καρδία as the biblical term for the inward person. ‘Ndị ajọ omume’ preserves the ethical sense of πονηροί without adding doctrinal interpretation.
  issues:
  - severity: medium
    issue: The expression ‘ọnụ na-ekwu ihe juputara n’obi’ does not clearly express ‘out of/from the abundance of the heart.’
    rationale: Greek ἐκ marks the source of the speech, and περισσεύματος denotes what fills or overflows. ‘ọnụ na-ekwu okwu site n’ihe obi jupụtara na ya’ explicitly preserves this connection in natural Igbo.
  revised_text: Ụmụ ajụala, olee otú unu pụrụ isi kwuo ihe ọma ebe unu bụ ndị ajọ omume? N’ihi na ọnụ na-ekwu okwu site n’ihe obi jupụtara na ya.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi na site n’ụba nke obi ka ọnụ na-ekwu okwu.”
    reason: lexical_alternative
  revision_rationale: The revision only clarifies the final causal statement so that the mouth’s speech is explicitly said to come from the heart’s fullness, as in the Greek. The footnote supplies the closer formal alternative using ‘ụba’ (‘abundance’).
