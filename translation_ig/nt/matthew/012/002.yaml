  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: ig
  text: Ma mgbe ndị Farisii hụrụ nke ahụ, ha sịrị ya, “Lee, ndị na-eso ụzọ gị na-eme ihe a na-ekweghị ka e mee[a] n’ụbọchị izu ike.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe iwu na-adịghị ekwe ka e mee.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị na mmegide dị n’etiti ihe ndị na-eso ụzọ Jizọs mere na mmeghachi omume ndị Farisii.
- source_word: ἰδόντες
  choice: mgbe ... hụrụ nke ahụ
  rationale: A tụgharịrị participle aorist ahụ dị ka nkebiokwu oge n’Igbo. “Nke ahụ” na-ezo aka n’ihe ndị na-eso ụzọ mere n’ama ọka dị n’amaokwu bu ụzọ.
- source_word: εἶπαν αὐτῷ
  choice: ha sịrị ya
  rationale: Nke a bụ ụzọ dị mfe ma bụrụkwa nke a na-ejikarị akọwa okwu mmadụ gwara onye ọzọ n’Igbo.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu ịdọrọ uche onye a na-agwa n’ihe a na-ebo ebubo.
- source_word: μαθηταί
  choice: ndị na-eso ụzọ
  rationale: Ọ na-egosi ndị na-amụta ihe n’aka onye nkụzi ma na-eso ya; nke a bụkwa okwu a maara nke ọma n’akụkọ Oziọma.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: na-eme ... ime
  rationale: E chekwara nkwughachi nke ποιέω iji gosipụta otú ebubo ahụ siri kwuo ya.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ihe iwu na-akwadoghị
  rationale: Ọ na-egosi ihe a na-ekweghị ma ọ bụ ihe na-enweghị ikike ime, ma ọ naghị ekpebi ma ebubo ahụ sitere kpọmkwem n’Iwu Chineke ka ọ bụ n’omenala nkọwa ndị Farisii.
- source_word: ἐν σαββάτῳ
  choice: n’ụbọchị izu ike
  rationale: Nke a bụ okwu Igbo doro anya maka ụbọchị Sabbath n’ọnọdụ a.
theological_decisions:
- issue: Ụdị iwu ndị Farisii kwuru na e mebiri
  choice: ihe iwu na-akwadoghị
  alternative: ihe a na-ekweghị ka e mee
  rationale: Nsụgharị ahụ na-edobe ebubo ahụ n’ụdị iwu na ikike, ma ọ naghị agbakwụnye ma ihe ahụ megidere Iwu Akwụkwọ Nsọ ka ọ bụ nkọwa ọdịnala ndị Farisii.
translation_notes:
  register: E ji asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù mee ihe. “Lee” na-edobe ike okwu ebubo ahụ, ebe “ụbọchị izu ike” na-eme ka Sabbath doo onye Igbo nkịtị anya.
