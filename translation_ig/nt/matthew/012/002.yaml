  to: Ma mgbe ndị Farisii hụrụ nke ahụ, ha sịrị ya, “Lee, ndị na-eso ụzọ gị na-eme ihe a na-ekweghị ka e mee[a] n’ụbọchị izu ike.”
  rationale: The revision renders οὐκ ἔξεστιν with an Igbo permission expression rather than a potentially broader notion of legal approval. It retains the source’s unadjudicated accusation and relocates the lexical-alternative footnote marker to its proper phrase.
