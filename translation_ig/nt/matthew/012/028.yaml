id: MAT.12.28
reference: Matthew 12:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: ig
  text: Ma ọ bụrụ na m ji Mmụọ Chineke[a] achụpụ ndị mmụọ ọjọọ, mgbe ahụ, alaeze Chineke abịakwasịla unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “n'ime Mmụọ Chineke.” Nkebiokwu Grik ahụ nwere ike igosi ọnọdụ e mere ihe ahụ n'ime ya, ma ọ bụ ụzọ ma ọ bụ onye e si n'aka ya mee ya; n'ebe a, a sụgharịrị ya dịka ihe e ji eme ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “erutela unu,” ma ọ bụ, “abịarutela unu.” Ngwaa Grik ahụ na-ekwusi ike na alaeze Chineke eruola ha site n'ọrụ Jizọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: Nke a na-egosipụta ma ọnọdụ ahụ ma obere ntụgharị arụmụka nke δέ n'Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: ἐν πνεύματι θεοῦ
  choice: ji Mmụọ Chineke
  rationale: “Ji” na-egosipụta ụzọ ma ọ bụ onye e sitere n'aka ya mee ihe ahụ, dịka ἐν na dative nwere ike isi pụta ebe a. E debere “Mmụọ Chineke” ka ọ na-ezo aka n'ụzọ doro anya na Mmụọ ahụ, n'etinyeghị okwu ọzọ dịka “ike” nke na-adịghị n'ahịrịokwu Grik.
- source_word: ἐγὼ
  choice: m
  rationale: Nnochiaha onye mbụ dị n'ime ụdị ngwaa Igbo a, ma ahịrịokwu ahụ ka na-edebe Jizọs dị ka onye na-achụpụ ndị mmụọ ọjọọ n'ụzọ doro anya. Ịtinye “mụ onwe m” ga-eme ka nkwusi ike ahụ sie ike karịa ka o kwesịrị.
- source_word: ἐκβάλλω
  choice: achụpụ
  rationale: “Ịchụpụ” bụ okwu Igbo doro anya ma dị ike maka ime ka ndị mmụọ ọjọọ pụọ, ọ dabara n'ọnọdụ ịchụ mmụọ ọjọọ.
- source_word: τὰ δαιμόνια
  choice: ndị mmụọ ọjọọ
  rationale: Nke a bụ ụzọ ndị mmadụ na-aghọta ngwa ngwa maka ndị bụ mmụọ ọjọọ, na-edebekwa ha dị ka ndị ihe ahụ metụtara, ọ bụghị naanị ike ọjọọ na-enweghị onye.
- source_word: ἄρα
  choice: mgbe ahụ
  rationale: Ọ na-egosi nkwubi okwu sitere n'ọnọdụ e kwuru ná mmalite, dịka ἄρα si arụ ọrụ.
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: abịakwasịla unu
  rationale: Nke a na-egosipụta na alaeze ahụ eruola ndị a na-agwa okwu ugbu a, ma na-edebekwa ihe oyiyi nke ἐπί—ọ bịarutere ha ma bịakwasị ha—karịa nanị ikwu na ọ dị nso.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ nsụgharị Igbo guzobere nke na-edebe ma ọchịchị eze Chineke ma echiche nke alaeze ya, n'emeghị ka okwu ahụ bụrụ naanị “ọchịchị” n'ụzọ nkọwa.
theological_decisions:
- issue: Ihe ọbịbịa alaeze Chineke pụtara n'ihe gbasara ịchụpụ ndị mmụọ ọjọọ
  choice: E kwuru na alaeze Chineke abịakwasịla ndị na-ege ntị n'ezie ugbu a, ihe àmà ya bụ ọrụ Jizọs ji Mmụọ Chineke na-arụ.
  alternative: Alaeze ahụ abịala nso naanị, ma ọ bịabeghị; ma ọ bụ okwu a na-ekwu naanị banyere mmezu ya n'ọdịnihu.
  rationale: ἔφθασεν na-egosi iru ma ọ bụ ọbịbịa, arụmụka ahụ dabere na ịchụpụ ndị mmụọ ọjọọ ịbụ ihe àmà dị ugbu a nke ọchịchị Chineke. Nsụgharị ahụ anaghị ekwu na mmezu niile nke alaeze ahụ agwụla, ya mere ọ na-ahapụ esemokwu dị n'etiti ọbịbịa ya ugbu a na mmezu ya n'ọdịnihu.
- issue: Onye “Mmụọ Chineke” na-ezo aka na ya
  choice: A na-edebe ya dịka Mmụọ Chineke, onye Jizọs ji arụ ọrụ ahụ.
  alternative: Iwere ya naanị dịka ike Chineke na-abụghị onye.
  rationale: πνεύματι θεοῦ n'ọnọdụ a na-ezo aka na Mmụọ dịka onye sitere n'aka ya ka Jizọs ji achụpụ ndị mmụọ ọjọọ. Nsụgharị ahụ etinyeghị “ike” nke nwere ike imechi nghọta ahụ n'otu ụzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ji Mmụọ Chineke” bụ usoro Igbo ebumpụta ụwa maka agency/means, ebe “abịakwasịla unu” na-edebe ịdị ike nke ọbịbịa alaeze ahụ. E ji “unu” gosipụta na ὑμᾶς bụ ọtụtụ mmadụ.
