    issue: Footnote a has unclear and grammatically awkward explanatory wording.
    rationale: The phrase “isi okwu ahụ sụgharịrị ya” is not natural in this context and obscures the intended explanation of ἐν πνεύματι θεοῦ. The note should clearly distinguish the alternative spatial/sphere rendering from the adopted means/agency rendering.
