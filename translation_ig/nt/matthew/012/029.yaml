review_pass:
  verdict: revise
  source_fidelity: The rhetorical question, sequence, and contrast between ἁρπάσαι ('seize/take') and διαρπάσει ('plunder') are substantially represented. However, the final object in Greek is explicitly 'his house' (τὴν οἰκίαν αὐτοῦ), not merely 'the things in his house.' The source’s concrete house-plundering image should remain in the text.
  naturalness: The draft is generally clear Standard Igbo. 'kee ... agbụ' is understandable, but 'kee ... agbụ' may sound somewhat redundant; 'kee ... agbụ' remains natural enough in this context. Rendering the final clause as 'ga-akwakọrọ ụlọ ya' is idiomatic in a robbery context and preserves the Greek object without implying demolition.
  terminology: ‘nwoke dị ike’ appropriately retains the concrete masculine metaphor. ‘ihe ya’ is a valid broad rendering of σκεύη in context, with the supplied lexical footnote properly preserving ‘ngwongwo’ and literal ‘arịa.’ ‘napụ ya ... n’ike’ suitably differentiates ἁρπάσαι from the stronger διαρπάσει.
  issues:
  - severity: medium
    issue: The final clause changes the direct object from ‘his house’ to ‘the things in his house.’
    rationale: Greek reads καὶ τότε τὴν οἰκίαν αὐτοῦ διαρπάσει, literally, ‘and then he will plunder his house.’ Though the intended sense includes its contents, replacing ‘house’ with its contents narrows and alters the explicit image.
  revised_text: Ma ọ bụ, olee otú mmadụ pụrụ isi banye n’ụlọ nwoke dị ike ma napụ ya ihe ya[a] n’ike, ma ọ bụrụ na o bughị ụzọ kee nwoke ahụ dị ike agbụ[b]? Mgbe ahụ ka ọ ga-akwakọrọ ụlọ ya.
