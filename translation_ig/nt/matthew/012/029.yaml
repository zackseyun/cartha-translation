id: MAT.12.29
reference: Matthew 12:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: ig
  text: Ma ọ bụ, olee otú mmadụ pụrụ isi banye n’ụlọ nwoke dị ike ma napụ ya ihe ya[a] n’ike, ma ọ bụrụ na o bughị ụzọ kee nwoke ahụ dị ike agbụ[b]? Mgbe ahụ ka ọ ga-akwakọrọ ụlọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ngwongwo ya” ma ọ bụ “arịa ya.” Okwu Grik ahụ nwere ike ịpụta arịa kpọmkwem ma ọ bụ ihe mmadụ nwere n’ozuzu ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “kee nwoke ahụ dị ike eriri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ma ọ bụ
  rationale: Ọ na-ewebata ihe atụ ọzọ na-akọwa arụmụka bu ya ụzọ; nke a bụ ụzọ Igbo nkịtị si egosipụta njikọ ahụ.
- source_word: πῶς δύναταί τις
  choice: olee otú mmadụ pụrụ isi
  rationale: Ọ na-edobe ajụjụ nzaghachi ahụ na echiche nke ikike ma na-eji ‘mmadụ’ maka onye ọ bụla a na-akọwaghị kpọmkwem.
- source_word: εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ
  choice: banye n’ụlọ nwoke dị ike
  rationale: Ọ na-edobe onyinyo ụlọ ahụ na onye nwe ya bụ nwoke dị ike n'ụzọ doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: τὰ σκεύη αὐτοῦ
  choice: ihe ya
  rationale: N’agbanyeghị na σκεύη nwere ike ịpụta arịa kpọmkwem, n’ọnọdụ a ọ gbasara ngwongwo ma ọ bụ ihe onye ahụ nwere n’ụlọ; ‘ihe ya’ bụ okwu sara mbara nke na-adịghị amanye otu nkọwa.
- source_word: ἁρπάσαι
  choice: napụ ya ... n’ike
  rationale: Ọ na-egosi ịnara ihe n’ike, ma hapụkwa ọdịiche dị n’etiti ngwaa a na διαρπάσει, nke siri ike karị.
- source_word: ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν
  choice: ma ọ bụrụ na o bughị ụzọ kee nwoke ahụ dị ike agbụ
  rationale: ‘Bughị ụzọ’ na-edobe πρῶτον, ebe ‘kee ... agbụ’ na-enye echiche nke igbochi onye ahụ site n’ịke ya agbụ.
- source_word: καὶ τότε
  choice: Mgbe ahụ ka
  rationale: Usoro a na-egosi na ihe nke abụọ ga-eme naanị mgbe nke mbụ gasịrị, n’ụzọ dabara n’usoro okwu Igbo.
- source_word: διαρπάσει
  choice: ga-akwakọrọ ihe
  rationale: ‘Kwakọrọ’ na-egosi izuru ma ọ bụ iburu ọtụtụ ihe n’ike, ya mere ọ na-egosipụta ike ngwaa ngwakọta a karịa ἁρπάσαι.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: ihe dị n’ụlọ ya
  rationale: N’Igbo, ‘kwakọrọ ụlọ’ pụrụ ịdị ka ibibi ụlọ ahụ; ‘kwakọrọ ihe dị n’ụlọ ya’ na-egosipụta nke ọma na ihe a na-apụnara bụ ihe ndị dị n’ụlọ, ebe ọ ka na-edobe onyinyo ụlọ ahụ.
theological_decisions:
- issue: Asụsụ nwoke e ji mee ihe atụ
  choice: nwoke dị ike / mmadụ
  alternative: onye dị ike / onye ọ bụla
  rationale: Grik ji ụdị nwoke mee onye dị ike n’ihe atụ ahụ. Nsụgharị ahụ na-edobe ‘nwoke dị ike,’ ma jiri ‘mmadụ’ mee onye a na-akọwaghị kpọmkwem n’Igbo nkịtị.
- issue: Ókè ihe onyinyo nke ‘ụlọ’ na ‘ihe ya’ pụtara
  choice: Idowe ihe atụ nke ịbanye n’ụlọ na ịnapụ ihe n’ike
  alternative: Ịkọwa ụlọ dịka ọchịchị ma ọ bụ ihe ya dịka ndị nọ n’okpuru ike mmụọ
  rationale: Ọnọdụ amaokwu a metụtara ike Jizọs nwere n’ebe ndị mmụọ ọjọọ nọ, ma okwu amaokwu ahụ n’onwe ya bụ ihe atụ. Nsụgharị ahụ anaghị etinye nkọwa mmụta okpukpe sara mbara n’ime ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ okwu ndị na-edobe ajụjụ nzaghachi na ihe atụ nke izu ohi n’ụlọ, ma zere itinye nkọwa okpukpe n’ime ederede.
