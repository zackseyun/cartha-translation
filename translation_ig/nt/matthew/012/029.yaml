  to: Ma ọ bụ, olee otú mmadụ pụrụ isi banye n’ụlọ nwoke dị ike ma napụ ya ihe ya[a] n’ike, ma ọ bụrụ na o bughị ụzọ kee nwoke ahụ dị ike agbụ[b]? Mgbe ahụ ka ọ ga-akwakọrọ ụlọ ya.
