id: MAT.12.26
reference: Matthew 12:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: ig
  text: Ma ọ bụrụ na Setan na-achụpụ Setan[a], e kewala ya megide onwe ya[b]. Oleezi otu alaeze ya ga-esi guzo[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-achụ Setan pụọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “e kewara ya megide onwe ya.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “Oleezi otu alaeze ya pụrụ isi guzo?”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: Ma ọ bụrụ na
  rationale: Na-ejigide njikọ echiche nke καί na ọnọdụ nke εἰ; n'Igbo, “Ma ọ bụrụ na” na-eme ka arụmụka a si n'okwu bu ya ụzọ gaa n'ihu nke ọma.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: Setan
  rationale: Ọ bụ ntụgharị aha a na-ejikarị eme ihe n'Igbo, kama ịtụgharị ya dịka “Onye Mmegide.”
- source_word: ἐκβάλλει
  choice: na-achụpụ
  rationale: “Ịchụpụ” na-enye ike okwu ἐκβάλλω nke ọma n'ọnọdụ ịchụ mmụọ ọjọọ, ma bụrụkwa okwu ndị mmadụ na-aghọta ngwa ngwa.
- source_word: ἐφ’ ἑαυτὸν
  choice: megide onwe ya
  rationale: Na-egosipụta esemokwu dị n'ime otu onye ahụ, dịka akpaalaokwu Grik a si pụta.
- source_word: ἐμερίσθη
  choice: e kewala ya
  rationale: Na-echekwa ọdịdị aorist passive nke Grik ma na-egosi ọnọdụ nkewa nke si n'omume ahụ pụta; ọ naghị ekpebi n'ụzọ na-enweghị isi ma a ga-asụ ya naanị dịka ọnọdụ ugbu a.
- source_word: πῶς οὖν
  choice: Oleezi otu
  rationale: “Olee otu” na-egosipụta πῶς, ebe “-zi” na-eburu echiche nkwubi okwu nke οὖν n'Igbo dị ndụ.
- source_word: σταθήσεται
  choice: ga-esi guzo
  rationale: Na-echekwa ihe atụ nke “iguzo,” nke ebe a pụtara ịnọgide ma ọ bụ ịdịgide.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: alaeze ya
  rationale: “Alaeze ya” dabara n'onyinyo nke ọchịchị e kewara ekewa ma bụrụ ntụgharị doro anya nke βασιλεία αὐτοῦ.
theological_decisions:
- issue: Ihe nkewa Setan megide onwe ya pụtara n'arụmụka ahụ
  choice: 'E gosipụtara ya dịka arụmụka na-egosi ihe na-agaghị ekwe omume: ọ bụrụ na Setan na-achụpụ Setan, ọchịchị ya ekewala megide onwe ya, ọ gaghịkwa eguzosi ike.'
  alternative: A pụrụ ịgbasa ya site n'itinye onyinyo “ụlọ e kewara ekewa” nke dị n'okwu gbara ya gburugburu.
  rationale: Amaokwu Grik n'onwe ya kwuru banyere nkewa na alaeze Setan; ya mere, ntụgharị ahụ anaghị etinye nkọwa ọzọ na-adịghị n'amaokwu a.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu dị na ya ma dị mfe nghọta. E ji “na-achụpụ,” “megide onwe ya,” na “alaeze ya” mee ka usoro arụmụka ahụ doo anya, ma chekwaa ihe atụ nke alaeze “iguzo.”
