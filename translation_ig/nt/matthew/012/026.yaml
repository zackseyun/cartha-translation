    rationale: The Greek ἐμερίσθη is passive (“he was/has been divided”), as is the main text’s “e kewala ya.” The footnote wording “ọ kewara megide onwe ya” is active (“he divided himself”) and therefore is not a valid lexical alternative. It should retain passive voice.
