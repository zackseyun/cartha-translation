id: MAT.12.5
reference: Matthew 12:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: ig
  text: Ma ọ bụ na unu agụbeghị n’Iwu ahụ na n’ụbọchị Izuike, ndị nchụàjà nọ n’ụlọ nsọ na-emebi ịdị nsọ nke ụbọchị Izuike, ma ha enweghị ụta?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-emebi ụbọchị Izuike” ma ọ bụ “na-agbaji ụbọchị Izuike.” Ngwaa Greek ahụ pụtara ime ihe dị nsọ ka ọ bụrụ ihe nkịtị ma ọ bụ ihe na-adịghị nsọ.
    reason: lexical_alternative
  - marker: b
    text: Greek jiri “ụbọchị Izuike” n’ụdị ọtụtụ; o yikarịrị ka ọ na-ekwu maka ụbọchị Izuike ndị na-eme ugboro ugboro, ọ bụghị naanị otu oge.
    reason: lexical_alternative
  - marker: c
    text: “Iwu ahụ” n’ebe a bụ Iwu Mosis dị n’Akwụkwọ Nsọ; o yikarịrị ka ọ gụnyere iwu banyere ọrụ ndị nchụàjà n’ụbọchị Izuike. Lee Ọnụọgụgụ 28:9–10.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Ma ọ bụ
  rationale: Ọ na-ewebata ihe akaebe ọzọ sitere n’Akwụkwọ Nsọ n’arụmụka Jizọs, ma na-edobe njikọ ajụjụ ahụ n’ụzọ Igbo doro anya.
- source_word: οὐκ ἀνέγνωτε
  choice: unu agụbeghị
  rationale: Nke a na-edobe ajụjụ nkwutọ Greek nke na-atụ anya na ndị na-ege ntị maara ihe e dere.
- source_word: ἐν τῷ νόμῳ
  choice: n’Iwu ahụ
  rationale: Ọ na-ezo aka n’Iwu Mosis dị ka akụkụ Akwụkwọ Nsọ, ọ bụghị iwu n’ozuzu ya.
- source_word: τοῖς σάββασιν
  choice: n’ụbọchị Izuike dị iche iche
  rationale: Ọ na-eme ka ọtụtụ dị na Greek pụta, na-egosi ihe na-eme ugboro ugboro n’ụbọchị Izuike.
- source_word: οἱ ἱερεῖς
  choice: ndị nchụàjà
  rationale: Ọ bụ okwu Igbo a na-ejikarị eme ihe maka ndị ụkọchukwu na-eje ozi n’ụlọ nsọ n’ọnọdụ a.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ụlọ nsọ
  rationale: Ọ na-enye echiche nke ụlọ nsọ/ogige ụlọ nsọ n’asụsụ Igbo dị mfe ma dị ùgwù.
- source_word: βεβηλοῦσιν
  choice: na-emebi ịdị nsọ
  rationale: Ọ na-egosipụta echiche nke ime ihe dị nsọ ka ọ bụrụ ihe nkịtị ma ọ bụ imebi nsọpụrụ ya, na-enweghị ime ka esemokwu okwu ahụ dị nro.
- source_word: ἀναίτιοί εἰσιν
  choice: ikpe amaghị ha
  rationale: Ọ na-egosipụta na ha enweghị ụta ma ọ bụ ikpe n’ụzọ iwu, ma na-edobe ọdịiche siri ike megide ‘na-emebi ịdị nsọ.’
theological_decisions:
- issue: Ma a ga-eme ka okwu banyere ndị nchụàjà ‘imebi’ ụbọchị Izuike dị nro iji zere echiche na ha mebiri iwu n’ezie
  choice: Idobe okwu siri ike ‘na-emebi ịdị nsọ nke ụbọchị Izuike,’ tinyere ‘ikpe amaghị ha’
  alternative: ‘na-emebi iwu ụbọchị Izuike, ma ha enweghị ụta’
  rationale: 'Greek na-edobe esemokwu okwu n’amaghị ama: ọrụ ndị nchụàjà na-arụ n’ụlọ nsọ n’ụbọchị Izuike nwere ike ịpụta dị ka imebi ịdị nsọ ya, ma ikpe adịghị ha. Nsụgharị ahụ ekwesịghị idozi esemokwu a n’aha onye na-agụ ya.'
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ụbọchị Izuike’ na-eme ka echiche Sabbath doo onye nkịtị anya; ‘ụlọ nsọ’ na ‘ndị nchụàjà’ dabara n’okwu gbasara ofufe Israel oge ahụ. E debere ajụjụ nkwutọ na esemokwu dị n’etiti imebi ịdị nsọ na enweghị ikpe.
