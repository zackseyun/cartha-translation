revisions:
- from: Ma ọ bụ, unu agụbeghị n’Iwu ahụ na n’ụbọchị Izuike dị iche iche, ndị nchụàjà nọ n’ụlọ nsọ na-emebi ịdị nsọ nke ụbọchị Izuike, ma ikpe amaghị ha?[a][b][c]
  to: Ma ọ bụ na unu agụbeghị n’Iwu ahụ na n’ụbọchị Izuike, ndị nchụàjà nọ n’ụlọ nsọ na-emebi ịdị nsọ nke ụbọchị Izuike, ma ha enweghị ụta?[a][b][c]
  rationale: The revision removes the unsupported nuance ‘different’ while retaining the recurring-plural sense in footnote b. It also smooths the rhetorical opening and makes the priests’ guiltlessness explicit. The strong contrast between profaning the Sabbath and being without guilt remains intact.
