id: MAT.22.37
reference: Matthew 22:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: ig
  text: Ọ sịrị ya, “Ị ga-eji obi gị dum, na mkpụrụ obi gị dum,[a] na uche gị dum[b] hụ Onyenwe anyị Chineke gị n’anya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “mkpụrụ obi” nwekwara ike ịpụta “ndụ” ma ọ bụ “onwe mmadụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “uche” dịka “nghọta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ọ
  rationale: N'ọnọdụ a δέ bụ njikọ dị nro nke na-aga n'ihu n'akụkọ; n'Igbo, ịmalite ozugbo na nnọchiaha na-adị mma ma zere njikọ na-adịghị mkpa.
- source_word: ἔφη αὐτῷ
  choice: sịrị ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ kpọmkwem n'ịkpọbata okwu mmadụ kwuru; ọ naghị atụkwasị echiche nke 'zara' nke ngwaa ahụ ekwughị kpọmkwem.
- source_word: Ἀγαπήσεις
  choice: Ị ga-… hụ … n’anya
  rationale: Ụdị ọdịnihu Grik na-arụ ọrụ dị ka iwu n'okwu e hotara; 'Ị ga-' na-echekwa ọdịdị ahụ na ike iwu ya n'Igbo.
- source_word: κύριον τὸν θεόν σου
  choice: Onyenwe anyị Chineke gị
  rationale: '''Onyenwe anyị'' bụ nsụgharị Igbo a na-ahụkarị maka κύριος n''aha Chineke, ebe ''Chineke gị'' na-echekwa mmekọrịta nke σου.'
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: jiri obi gị dum
  rationale: Ọ bụ ezie na ἐν pụtara 'n'ime' n'ụzọ nkịtị, 'iji obi ... hụ n'anya' bụ usoro Igbo eke nke na-egosi ihe mmadụ ji mee omume ahụ; 'dum' na-egosi izu oke.
- source_word: ψυχῇ
  choice: mkpụrụ obi
  rationale: '''Mkpụrụ obi'' na-echekwa okwu dị iche n''obi na uche, ma na-anọgide na-emeghe nghọta ψυχή dịka ndụ ma ọ bụ onwe mmadụ dum.'
- source_word: διανοίᾳ
  choice: uche
  rationale: '''Uche'' bụ okwu Igbo eke maka ikike iche echiche na ịghọta; ọ na-echekwa akụkụ ọgụgụ isi nke διάνοια.'
theological_decisions:
- issue: Ichekwa akụkụ atọ dị n'iwu ahụ
  choice: obi … mkpụrụ obi … uche
  alternative: ịkpọkọta ha dịka ‘ndụ gị dum’
  rationale: Isi mmalite ahụ depụtara καρδία, ψυχή, na διάνοια iche iche. Idebe ha iche na-echekwa ọdịdị okwu Jizọs n'ehihie ahụ ma ghara ịkọwa mmekọrịta ha karịa ihe Grik kwuru.
- issue: Ike iwu dị na Ἀγαπήσεις
  choice: Ị ga-ahụ … n’anya
  alternative: Hụ … n’anya / Ị ghaghị ịhụ … n’anya
  rationale: Ụdị a na-echekwa ọdịnihu e ji nye iwu n'okwu e hotara, n'ebughị ibu iwu ọzọ nke ‘ị ghaghị’ nwere ike itinye.
translation_notes:
  register: Asụsụ Igbo izugbe, nke ugwu na nke a na-aghọta ngwa ngwa. A họọrọ usoro eke ‘jiri … hụ … n’anya,’ ma debegharịa ‘dum’ n'akụkụ akụkụ atọ ahụ iji gosipụta nkwughachi na izu oke dị n'isi mmalite.
