  source_fidelity: 'The translation accurately conveys the Greek: Jesus speaks to the interlocutor, and the imperatival future Ἀγαπήσεις is appropriately rendered by “Ị ga-… hụ … n’anya.” It preserves the three distinct, repeatedly total spheres of devotion—heart, soul, and mind—and renders the idiomatic force of ἐν naturally through “jiri.”'
  naturalness: “Ị ga-eji obi gị dum, na mkpụrụ obi gị dum, na uche gị dum hụ … n’anya” is fluent, clear Standard Igbo and has an appropriate elevated scriptural register. The placement and repetition of “dum” effectively reflect the Greek repetition without becoming unnatural.
  terminology: “Onyenwe anyị Chineke gị” is an established biblical Igbo rendering for “the Lord your God.” “Obi,” “mkpụrụ obi,” and “uche” suitably retain the lexical distinctions of καρδία, ψυχή, and διάνοια. The footnotes accurately give restrained lexical alternatives for ψυχή and διάνοια.
