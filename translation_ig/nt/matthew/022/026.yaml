  text: Likewise also the second and the third[a], up to the seven.
translation:
  language: ig
  text: Otu a kwa, nke abụọ na nke atọ mekwara otu ahụ, ruo na ha asaa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ dị mfe karị: “ruo mgbe ha asaa niile mere otu ahụ.”'
