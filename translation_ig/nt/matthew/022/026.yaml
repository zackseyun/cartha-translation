lexical_decisions:
- source_word: ὁμοίως
  choice: N’otu aka ahụ
  rationale: Ọ na-egosi na ihe mere onye nke mbụ mekwara ndị sochirinụ; okwu a bụ Igbo dị ugbu a ma na-ejikọta amaokwu a na nke bu ya ụzọ.
- source_word: καὶ ὁ δεύτερος καὶ ὁ τρίτος
  choice: nke abụọ na nke atọ mekwara otu ahụ
  rationale: A hapụrụ ‘nwanne’ nke a ghọtara site n’okwu ndị gbara ya gburugburu, dịka Grik si hapụ ya; ‘mekwara’ na-anọchi anya καὶ nke mbụ ma mee ka ahịrịokwu Igbo zuo oke.
- source_word: ἕως τῶν ἑπτά
  choice: ruo n’ime ha asaa
  rationale: Nke a na-egosi na otu ihe ahụ gara n’ihu ruo mgbe o metụtara ndị ahụ asaa niile, n’enweghị itinye echiche ọzọ na-adịghị na Grik.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E debere nhapụ nke okwu ‘nwanne’ dị na Grik, ma tinye ngwaa a ghọtara site n’amaokwu bu ụzọ ka ahịrịokwu ahụ bụrụ Igbo eke.
