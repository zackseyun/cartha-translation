  text: καὶ ἀκούσαντες ἐθαύμασαν, καὶ ἀφέντες αὐτὸν ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/022.yaml
  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: ig
  text: Mgbe ha nụrụ nke a[a], o juru ha anya; ha hapụrụ ya wee pụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ha nụrụ ya, o juru ha anya; ha hapụrụ ya wee pụọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Mgbe ha nụrụ nke a
  rationale: Aorist participle ahụ na-egosi ihe mere tupu isi ngwaa ahụ; nkebiokwu oge a bụ Igbo ebumpụta ụwa. “Nke a” na-anọchi ihe ha nụrụ, nke ihe gbara amaokwu ahụ gburugburu na-egosi.
- source_word: ἐθαύμασαν
  choice: o juru ha anya
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-asụ taa iji kwupụta ihe ijuanya ma ọ bụ ịdị n'ọnụ mmiri n'ihi azịza Jizọs.
- source_word: ἀφέντες αὐτὸν
  choice: ha hapụrụ ya
  rationale: Ọ na-egosi na ha si n'ebe ọ nọ pụọ; etinyeghị “naanị ya” n'ihi na nke ahụ adịghị kpọmkwem n'asụsụ Grik.
- source_word: ἀπῆλθαν
  choice: lawa
  rationale: “Lawa” na-egosi ịpụ ma ọ bụ ịga ebe ọzọ n'ụzọ dị mkpụmkpụ ma bụrụ Igbo ebumpụta ụwa.
- source_word: καὶ ... καὶ
  choice: ; ...
  rationale: Asụsụ Grik ji njikọ ugboro ugboro kee usoro omume. N'Igbo, akara semikolon na usoro ngwaa ndị so ibe ha na-eme ka akụkọ ahụ gaa were were n'enweghị njikọ ndị ga-ada arọ.
theological_decisions: []
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu Igbo ebumpụta ụwa ma chekwaa usoro ihe omume dị n'asụsụ Grik.
