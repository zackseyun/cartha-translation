source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: ig
  text: N’ihi na ná mbilite n’ọnwụ, ha anaghị alụ di ma ọ bụ nwunye, a naghị enyekwa ha n’alụmdi na nwunye; kama ha dị ka ndị mmụọ ozi nke Chineke n’eluigwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe mbilite n’ọnwụ ga-adị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: ná mbilite n’ọnwụ
  rationale: Nkebiokwu a na-egosi ọnọdụ ma ọ bụ oge ndụ mgbe mbilite n’ọnwụ gasịrị. Usoro a bụ nke Igbo na-aghọta nke ọma ma na-edobe njikọ ya na mbilite n’ọnwụ.
- source_word: γαμοῦσιν
  choice: ha adịghị alụ di ma ọ bụ nwunye
  rationale: N’Igbo, ‘ịlụ’ nwere ike ịdabere n’ nwoke ma ọ bụ nwaanyị; ịgbakwunye ‘di ma ọ bụ nwunye’ mere ka okwu ahụ bụrụ nke metụtara mmadụ niile n’enweghị ịkọwapụta ihe Grik na-ekwughị kpọmkwem.
- source_word: γαμίζονται
  choice: a dịghịkwa enye ha n’alụmdi na nwunye
  rationale: A na-edobe ọdịiche dị n’etiti ime ihe nke γαμοῦσιν na ụdị nnabata nke γαμίζονται, nke na-ezo aka n’inye mmadụ ka ọ lụọ.
- source_word: ὡς
  choice: dị ka
  rationale: ‘Dị ka’ na-egosi ntụnyere, ọ bụghị na ndị a kpọlitere n’ọnwụ na-aghọ ndị mmụọ ozi.
- source_word: ἄγγελοι θεοῦ
  choice: ndị mmụọ ozi nke Chineke
  rationale: Nke a na-anọchi anya θεοῦ nke ọma ma jiri okwu Baịbụl Igbo a maara nke ọma.
- source_word: ἐν τῷ οὐρανῷ
  choice: n’eluigwe
  rationale: N’ebe a, οὐρανός bụ ebe obibi ndị mmụọ ozi, ọ bụghị naanị mbara elu anụ ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe kpatara okwu bu ya ụzọ.
theological_decisions:
- issue: Ụdị ntụnyere e ji ndị mmụọ ozi mee
  choice: Ndị a kpọlitere n’ọnwụ dị ka ndị mmụọ ozi n’ihe gbasara alụmdi na nwunye; a sịghị na ha na-aghọ ndị mmụọ ozi.
  alternative: Ịghọta ntụnyere ahụ dị ka ihe na-akọwa ụzọ ndụ ndị mmụọ ozi n’ozuzu ya.
  rationale: ὡς bụ akara ntụnyere, ebe okwu gbara ya gburugburu na-ekwu kpọmkwem banyere enweghị ịlụ di ma ọ bụ nwunye. Nsụgharị ahụ na-edobe ntụnyere ahụ n’enweghị ime ka ọ bụrụ njirimara zuru ezu.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ọdịiche dị n’etiti ‘ịlụ’ na ‘inye n’alụmdi na nwunye,’ ma zere okwu ga-egosi na mmadụ na-aghọ mmụọ ozi.
