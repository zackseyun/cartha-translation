revisions:
- from: N’ihi na ná mbilite n’ọnwụ, ha adịghị alụ di ma ọ bụ nwunye, a dịghịkwa enye ha n’alụmdi na nwunye; kama, ha dị ka ndị mmụọ ozi nke Chineke n’eluigwe.
  to: N’ihi na ná mbilite n’ọnwụ, ha anaghị alụ di ma ọ bụ nwunye, a naghị enyekwa ha n’alụmdi na nwunye; kama ha dị ka ndị mmụọ ozi nke Chineke n’eluigwe.[a]
  rationale: The revision changes only the negative verbal aspect to natural habitual Standard Igbo. It preserves the Greek contrast between γαμοῦσιν (“marry”) and γαμίζονται (“are given in marriage”), and “dị ka” maintains comparison rather than identity. The footnote preserves the viable temporal alternative for ἐν τῇ ἀναστάσει without displacing the preferred sense of life in the resurrection.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:56Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the explanatory γάρ, the resurrection setting, the contrast between marrying and being given in marriage, the comparative force of ὡς, and the explicit reference to God's angels in heaven. The present-tense verbal forms are better expressed with Igbo habitual negatives.
  naturalness: “Ha anaghị alụ …” and “a naghị enyekwa ha …” are more natural Standard Igbo for the ongoing/general statement than “ha adịghị alụ …” and “a dịghịkwa enye ….”
  terminology: “Mbilite n’ọnwụ,” “alụmdi na nwunye,” “ndị mmụọ ozi nke Chineke,” and “eluigwe” are appropriate established biblical terms. The wording retains the distinction between marrying and being given in marriage without implying that resurrected people become angels.
  issues:
  - severity: low
    issue: Present habitual negation
    rationale: The Greek present forms γαμοῦσιν and γαμίζονται describe the general condition in the resurrection. Standard Igbo more idiomatically uses anaghị/naghị in this context.
  revised_text: N’ihi na ná mbilite n’ọnwụ, ha anaghị alụ di ma ọ bụ nwunye, a naghị enyekwa ha n’alụmdi na nwunye; kama ha dị ka ndị mmụọ ozi nke Chineke n’eluigwe.[a]
