  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: ig
  text: 'Ma banyere mbilite n’ọnwụ nke ndị nwụrụ anwụ, ọ̀ bụ na unu agụbeghị ihe Chineke gwara unu[a], sị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe e kwuru nye unu site n’aka Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ
  choice: Banyerekwa
  rationale: “Banyere” na-ewebata isiokwu a na-ekwu maka ya, ebe “-kwa” na-egosi ntụgharị gaa n’isiokwu a n’enweghị ime ka δέ bụrụ nnukwu mmegide.
- source_word: ἀναστάσεως τῶν νεκρῶν
  choice: mbilite n’ọnwụ nke ndị nwụrụ anwụ
  rationale: “Mbilite n’ọnwụ” bụ okwu Igbo doro anya maka ἀνάστασις n’ebe a; “nke ndị nwụrụ anwụ” na-edebe usoro genitive nke Grik ma na-egosi na ndị nwụrụ anwụ bụ ndị a ga-akpọlite.
- source_word: οὐκ ἀνέγνωτε
  choice: ọ̀ bụ na unu agụbeghị
  rationale: Ajụjụ a bụ nke ịma aka, ọ bụghị nanị ịjụ maka otu oge gara aga; ụdị a bụ Igbo eke ma na-egosi na ha kwesịrị ịma ihe Akwụkwọ Nsọ kwuru.
- source_word: τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ
  choice: ihe Chineke gwara unu
  rationale: Nsụgharị a bụ nke Igbo dị mfe ma doo anya, na-edebe Chineke dịka onye kwuru okwu ahụ nakwa “unu” dịka ndị okwu ahụ na-agwa.
- source_word: λέγοντος
  choice: 'sị:'
  rationale: “Sị” na-ewebata okwu a ga-ehota n’amaokwu na-esote n’ụzọ Igbo si ekwu ya nke ọma.
theological_decisions:
- issue: Chineke dịka onye kwuru Akwụkwọ Nsọ, na okwu ahụ dịka nke a gwara ndị na-ege ntị
  choice: ihe Chineke gwara unu
  alternative: ihe e si n’aka Chineke gwa unu
  rationale: Grik na-egosi ma na Chineke bụ onye okwu ahụ si n’aka ya pụta ma na e kwuru ya nye ndị a na-agwa okwu. Nsụgharị bụ isi na-eme ka nke a doo anya n’Igbo n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta, dee ya. “Banyerekwa” na-eme ka ntụgharị isiokwu pụta ìhè n’enweghị ịgbakwunye okwu oge dịka “ugbu a.”
