  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: ig
  text: Mgbe ahụ, ọ sịrị ndị na-ejere ya ozi, “Oriri agbamakwụkwọ adịla njikere, ma ndị a kpọrọ òkù[a] erughị eru.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị a kpọrọ.” Enwere ike ịsụgharị participle Grik ahụ n’ụzọ nkịtị karịa otu a, ma n’ọnọdụ oriri a, ọ na-ezo aka ná ndị a kpọrọ òkù ịbịa oriri agbamakwụkwọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi usoro ihe na-eme n’akụkọ ahụ n'ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: λέγει
  choice: ọ sịrị
  rationale: Ọ bụ ezie na Grik ji ngwaa oge ugbu a kọọ ihe gara aga, ụdị akụkọ Igbo kacha maa mma n’ebe a bụ ‘ọ sịrị’; ọ na-edobe usoro akụkọ ahụ n’enweghị okwu na-adịghị eke.
- source_word: δούλοις
  choice: ndị na-ejere ya ozi
  rationale: N’ọnọdụ akụkọ eze a, okwu a na-arụ ọrụ dịka ‘ndị na-eje ozi’; ntụgharị a bụ nke eke ma ọ naghị eme ka ọnọdụ ịbụ ohu pụta ìhè karịa ka amaokwu a chọrọ.
- source_word: Ὁ μὲν γάμος
  choice: Oriri agbamakwụkwọ
  rationale: N’akụkọ a, γάμος na-ezo aka n’emume oriri agbamakwụkwọ a kwadebere, ọ bụghị nanị n’alụmdi na nwunye. A na-egosipụta njikọ μὲν…δὲ site n’usoro ‘…ma…’.
- source_word: ἕτοιμός ἐστιν
  choice: adịla njikere
  rationale: Nke a na-egosi na oriri ahụ eruola ọnọdụ ịdị njikere, n’Igbo doro anya ma dịkwa eke.
- source_word: οἱ δὲ κεκλημένοι
  choice: ma ndị a kpọrọ òkù
  rationale: N’ọnọdụ oriri a, καλέω pụtara ịkpọ mmadụ òkù. ‘Ndị a kpọrọ òkù’ na-eme ka ihe e bu n’obi doo anya, ebe nkọwa ala peeji na-edobe ntụgharị nkịtị karịa.
- source_word: οὐκ ἦσαν ἄξιοι
  choice: erughị eru
  rationale: Nkebi a na-edobe echiche nke ịbụ ndị na-erughị eru ma ọ bụ ndị na-ekwesịghị ekwesị, n’enweghị ịkọwa ihe mere e ji tụọ ha otu a.
theological_decisions:
- issue: Ihe κεκλημένοι (‘ndị a kpọrọ’) nwere ike ịpụta n’ozizi gbasara ọkpụkpọ Chineke
  choice: ndị a kpọrọ òkù
  alternative: ndị a kpọrọ
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ekwu kpọmkwem banyere ndị e kpọrọ ka ha bịa oriri agbamakwụkwọ. Ya mere, ‘kpọrọ òkù’ bụ isi ihe okwu ahụ pụtara n’ebe a; nkọwa ala peeji na-echekwa ụdị ntụgharị nwere ike ịdị nkịtị karịa ma ghara ikpochapụ nghọta ọzọ ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. ‘Oriri agbamakwụkwọ’ na-akọwa γάμος n’ọnọdụ emume oriri, ebe ‘erughị eru’ na-echekwa ike ikpe dị na ἄξιοι n’enweghị ịgbakwunye ihe kpatara ikpe ahụ.
