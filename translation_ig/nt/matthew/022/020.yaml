  text: And he said to them[a], “Whose image is this, and whose inscription?”
translation:
  language: ig
  text: Ọ sịrị ha, “Oyiyi a na ihe odide a bụ nke onye?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Ọ sịrị
  rationale: Oge ugbu a n’asụsụ Grik bụ historical present n’akụkọ a; oge gara aga bụ ụzọ Igbo si akọ ya nke ọma.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnochiaha a na-egosi ndị ọ gwara okwu; ‘ha’ dabara n’ụzọ e si eji ngwaa ‘sị’ n’Igbo.
- source_word: Τίνος
  choice: Onye nwe
  rationale: Ajụjụ genitive a na-ajụ onye ihe ndị a bụ nke ya ma ọ bụ onye ha na-anọchi anya; ‘Onye nwe’ na-eme ka ajụjụ ahụ doo anya n’Igbo.
- source_word: εἰκών
  choice: onyinyo
  rationale: ‘Onyinyo’ bụ okwu Igbo kwesịrị ekwesị maka ihe oyiyi ma ọ bụ ọdịdị mmadụ e tinyere n’elu mkpụrụ ego.
- source_word: αὕτη
  choice: a
  rationale: ‘A’ bụ ngosi dị nso nke na-akọwa onyinyo ahụ.
- source_word: ἐπιγραφή
  choice: ihe e dere n’elu ya
  rationale: Nkebiokwu a na-egosi ihe odide e tinyere n’elu mkpụrụ ego n’asụsụ Igbo dị mfe ma doo anya.
- source_word: καὶ
  choice: na
  rationale: ‘Na’ jikọtara ihe abụọ ahụ a na-ajụ banyere ha.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. ‘Ihe e dere n’elu ya’ bụ okwu ndị mmadụ na-aghọta ngwa ngwa karịa okwu nka pụrụ iche maka inscription; ihe odide na onyinyo abụọ ahụ ka ajụjụ ‘Onye nwe’ metụtara.
