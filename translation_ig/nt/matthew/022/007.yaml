id: MAT.22.7
reference: Matthew 22:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: ig
  text: Ma eze ahụ were iwe; o zipụrụ ndị agha ya, bibie ndị ogbu mmadụ ahụ, kpọọkwa obodo ha ọkụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: were iwe
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ekwu na iwe were mmadụ.
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: ndị agha ya
  rationale: Ọ na-egosi usuu agha ndị nọ n'okpuru eze ahụ n'ụzọ dị mfe ma kwekọọ n'okwu Grik.
- source_word: ἀπώλεσεν
  choice: ha gbuo
  rationale: N'ọnọdụ a, mbibi nke ndị ogbu mmadụ pụtara igbu ha; e tinyere ‘ha’ iji mee ka onye na-eme ihe doo anya n'Igbo.
- source_word: τοὺς φονεῖς ἐκείνους
  choice: ndị ogbu mmadụ ahụ
  rationale: Ọ na-echekwa nkọwa siri ike nke φονεῖς na ihe ngosi ἐκείνους.
- source_word: τὴν πόλιν αὐτῶν ἐνέπρησεν
  choice: kpọọkwa obodo ha ọkụ
  rationale: Akpaalaokwu Igbo a na-egosi n'ụzọ ebumpụta ụwa na e mere ka obodo ahụ gbaa ọkụ.
theological_decisions:
- issue: Ma a ga-akọwa ihe ndị dị n'ilu ahụ dị ka amụma kpọmkwem
  choice: E debere okwu ahụ dịka akụkọ ilu n'enweghị nkọwa agbakwunyere.
  alternative: Ịgbakwunye okwu ga-akọwapụta eze, ndị ogbu mmadụ, ma ọ bụ obodo ahụ dịka ndị ma ọ bụ ihe ndị pụrụ iche.
  rationale: Amaokwu Grik n'onwe ya anaghị enye nkọwa ndị ahụ; ntụgharị ekwesịghị ịmanye otu nkọwa okpukpe.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-eme ka omume ndị eze nyere iwu ka ndị agha mee doo anya, n'agbanyeghị na Grik ji ngwaa otu onye n'ihi na eze bụ onye kpatara omume ndị ahụ.
