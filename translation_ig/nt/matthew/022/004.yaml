id: MAT.22.4
reference: Matthew 22:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other servants[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: ig
  text: 'Ọ zigakwara ndị ohu ọzọ[a], sị ha, “Gwanụ ndị a kpọrọ òkù: ‘Lee, akwadebela m nri m; egbuola oke ehi m na anụ ụlọ m ndị a gbara abụba, ihe niile adịkwala njikere. Bịanụ n’oriri agbamakwụkwọ[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-ejere ya ozi ọzọ.” Okwu Grik ahụ bụ doulous; ọ nwere ike ịpụta ndị ohu ma ọ bụ ndị na-ejere mmadụ ozi, dịka ọnọdụ okwu si dị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’agbamakwụkwọ” ma ọ bụ “n’emume agbamakwụkwọ.” Ụdị ọtụtụ nke okwu Grik ahụ nwere ike ịpụta emume agbamakwụkwọ niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: Ọ ... ọzọ
  rationale: Usoro a na-egosi na o mere otu ihe ahụ ọzọ; ọ bụkwa ụzọ Igbo dị ndụ si akọ omume e megharịrị.
- source_word: ἄλλους δούλους
  choice: ndị ohu ọzọ
  rationale: N’ụlọ eze nke ilu a, δοῦλοι bụ ndị nọ n’okpuru ikike nna ha ukwu, ọ bụghị nanị ndị ọrụ e goro ego. “Ndị ohu” na-egosipụta ọnọdụ ahụ nke ọma; nkọwa ala peeji na-edobe nhọrọ “ndị na-ejere ya ozi.”
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: Gwanụ ndị a kpọrọ òkù
  rationale: Na-edobe echiche nke ndị a kpọrọla òkù tupu oge a, nke ka dị mkpa ugbu a.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Okwu Igbo a na-adọrọ uche n’ihe na-esote n’ụzọ dị nkenke ma dị ebube.
- source_word: τὸ ἄριστόν μου ἡτοίμακα
  choice: akwadebela m nri m
  rationale: “Nri” anaghị amanye oge kpọmkwem nke ụbọchị nke ἄριστον nwere ike izo aka na ya, ebe ngwaa zuru ezu “akwadebela” na-egosi nkwadebe e mechara nke nsonaazụ ya ka dị.
- source_word: οἱ ταῦροί μου καὶ τὰ σιτιστὰ
  choice: oke ehi m na anụ ụlọ m ndị a gbara abụba
  rationale: “Oke ehi” na-anọchi ταῦροι, ebe “anụ ụlọ ... ndị a gbara abụba” na-edobe τὰ σιτιστά n’enweghị ịgbakwụnye na ha bụ ụmụ ehi.
- source_word: τεθυμένα
  choice: egbuola
  rationale: N’ọnọdụ oriri a, okwu ahụ pụtara igbu anụ maka nri; nsụgharị a anaghị eme ka ọ bụrụ àjà okpukpe.
- source_word: καὶ πάντα ἕτοιμα
  choice: ihe niile adịkwala njikere
  rationale: Na-edobe oke zuru ezu nke πάντα ma na-egosi ọnọdụ dị ugbu a.
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: Bịanụ n’oriri agbamakwụkwọ
  rationale: Ụdị ọtụtụ nke γάμοι nwere ike ịpụta emume agbamakwụkwọ niile; n’ọnọdụ nri a, “oriri agbamakwụkwọ” bụ Igbo doro anya ma dị ndụ.
theological_decisions:
- issue: Nsụgharị δοῦλος n’ụlọ eze nke ilu ahụ
  choice: ndị ohu
  alternative: ndị na-ejere ya ozi
  rationale: “Ndị ohu” na-edobe eziokwu mmekọrịta mmadụ na ibe ya nke ndị nọ n’okpuru nna ha ukwu n’ụlọ eze, n’enweghị itinye nkọwa ụka pụrụ iche.
- issue: Ihe γάμοι pụtara n’ụdị ọtụtụ
  choice: oriri agbamakwụkwọ
  alternative: agbamakwụkwọ / emume agbamakwụkwọ
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ nri a kwadebere, ya mere “oriri agbamakwụkwọ” dabara nke ọma, ma a na-edobe obosara nke okwu Grik na nkọwa ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ebube ma dị mfe nghọta. E ji “ndị ohu” mee ka ọnọdụ ụlọ eze pụta ìhè, ma tinye nhọrọ ọzọ na nkọwa ala peeji. E zeere ịkọwa τὰ σιτιστά dịka ụmụ ehi ebe Grik ekwughị afọ anụmanụ ndị ahụ kpọmkwem.
