  text: Δευτέρα ⸀δὲ ὁμοία ⸀αὐτῇ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: ig
  text: 'Nke abụọ dịkwa ka ya: ‘Ị ga-ahụ onye agbata obi gị n’anya dịka i si hụ onwe gị n’anya.’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Nke abụọ yiri ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δευτέρα
  choice: Nke abụọ
  rationale: Adjective a na-ejighị article mee ihe dị ka aha; n’ọnọdụ a ọ na-ezo aka n’iwu nke abụọ. Igbo ‘Nke abụọ’ bụ ụzọ doro anya ma dịkwa eke isi chekwaa ordinal ahụ, ma ọ pụkwara ịpụta ‘a second’ ma ọ bụ ‘the second’ dịka ọnọdụ okwu si dị.
- source_word: δὲ
  choice: dịkwa
  rationale: δέ bụ njikọ dị nro nke na-aga n’ihu n’okwu ahụ, ọ bụghị nnukwu mmegide. Mgbakwunye ‘-kwa’ na-enye njikọ eke n’Igbo.
- source_word: ὁμοία αὐτῇ
  choice: dị ka ya
  rationale: Ọ na-egosi na iwu nke abụọ yiri nke mbụ e kwuru okwu ya, na-enweghị ịgwakọta iwu abụọ ahụ ka ha bụrụ otu.
- source_word: Ἀγαπήσεις
  choice: Ị ga-ahụ ... n’anya
  rationale: Future indicative a sitere n’akwụkwọ iwu na-arụ ọrụ dị ka iwu. ‘Ị ga-ahụ ... n’anya’ na-echekwa ọdịdị future/imperatival nke okwu Grik ahụ karịa imperative nkịtị.
- source_word: τὸν πλησίον σου
  choice: onye agbata obi gị
  rationale: Nkebiokwu a pụtara onye ibe mmadụ ma ọ bụ ‘neighbor,’ ọ bụghị naanị onye nọ ya nso n’ebe.
- source_word: ὡς σεαυτόν
  choice: dịka i si hụ onwe gị n’anya
  rationale: Igbo chọrọ ka e kwughachi ngwaa ahụ ka ntụnyere ahụ wee bụrụ nke eke ma doo anya; ọ na-echekwa onwe onye reflexive na ụkpụrụ ntụnyere nke ὡς.
theological_decisions:
- issue: Mmekọrịta dị n’etiti iwu nke abụọ na nke mbụ
  choice: Nke abụọ dịkwa ka ya
  alternative: E nwekwara iwu nke abụọ yiri ya
  rationale: Nhọrọ a na-echekwa ordinal na ntụnyere Grik ahụ, na-egosi na iwu ahụ yiri nke mbụ n’ụdị ma ọ bụ mkpa, n’agwakọtaghị ha ka ha bụrụ otu. N’Igbo, enweghị article pụtara na otu ahịrịokwu a nwere ike ibu echiche ‘nke abụọ’ na-enweghị ikpebi n'ụzọ siri ike n’etiti English ‘a second’ na ‘the second.’
translation_notes:
  register: Asụsụ Igbo Standard nke oge a, dị ugwu ma dị mfe nghọta. E ji usoro okwu ‘ịhụ mmadụ n’anya’ mee ἀγαπάω n’ụzọ Igbo si ekwu ya; e kwughachiri ya n’akụkụ ntụnyere iji mee ka ahịrịokwu ahụ bụrụ nke eke.
