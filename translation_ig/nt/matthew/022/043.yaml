  text: λέγει αὐτοῖς· Πῶς οὖν Δαυὶδ ἐν πνεύματι ⸂καλεῖ αὐτὸν κύριον⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: ig
  text: Ọ sịrị ha, “Oleezi otu Devid n’ime Mmụọ si kpọọ ya Onyenwe ya, mgbe ọ na-ekwu sị,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ọ sịrị ha
  rationale: Okwu Grik a dị n’ụdị ugbu a dịka historical present, ma n’akụkọ Igbo, oge gara aga bụ ụzọ ebumpụta ụwa isi kwuo ya.
- source_word: Πῶς οὖν
  choice: Oleezi otu
  rationale: “Olee otu” na-edebe ajụjụ πῶς, ebe “-zi” na-egosi njikọ na nkwubi okwu nke οὖν n'ụzọ Igbo dị ire.
- source_word: Δαυὶδ
  choice: Devid
  rationale: E ji ụdị aha a nke a maara nke ọma n’Igbo dee aha onye ahụ.
- source_word: ἐν πνεύματι
  choice: n’ime Mmụọ Nsọ
  rationale: Nke a na-agbaso echiche nke ịdị ‘n’ime Mmụọ’ ma mee ka o doo anya na ọ ga-abụ Mmụọ Nsọ; ihe odide ahụ nwekwara ike igosi na Mmụọ bụ onye nyere ya ike ikwu okwu.
- source_word: καλεῖ αὐτὸν κύριον
  choice: si akpọ ya Onyenwe anyị
  rationale: “Onyenwe anyị” na-edebe κύριος dịka utu aha dị mkpa n’arụmụka sitere n’Abụ Ọma, kama ime ka ọ bụrụ naanị ‘nna ukwu.’
- source_word: λέγων
  choice: na-asị
  rationale: Nke a na-ejikọta ajụjụ ahụ ozugbo na okwu Devid nke ga-esote, dịka participle Grik si eme.
theological_decisions:
- issue: Onye ἐν πνεύματι na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ Devid n’onwe ya, ma ọ bụ ọnọdụ ime mmụọ ya
  rationale: N’ọnọdụ a, Jizọs na-ekwu maka okwu Devid dị n’Akwụkwọ Nsọ; ya mere, o yikarịrị ka ọ bụ Mmụọ Nsọ ka e bu n’obi. Ihe odide ukwu ka na-edebe ‘n’ime,’ ebe nkọwa ala peeji na-egosi ụzọ ọzọ e nwere ike isi ghọta ọrụ preposition ahụ.
- issue: Nsụgharị κύριος
  choice: Onyenwe anyị
  alternative: nna ukwu
  rationale: N’ebe a κύριος bụ utu aha dị n’okwu Mesaịa nke sitere n’Abụ Ọma 110. “Onyenwe anyị” na-echekwa ịdị arọ nke utu aha ahụ na njikọ ya na Akwụkwọ Nsọ, n’enweghị ịkọwa arụmụka Jizọs tupu oge ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. “Oleezi otu” na-eme ka ajụjụ ahụ bụrụ nke ebumpụta ụwa n’Igbo, ebe “n’ime Mmụọ Nsọ” na “Onyenwe anyị” na-echekwa okwu na nrụgide nke Grik.
