  rationale: The revision removes the untranslated-source addition ‘Nsọ,’ while retaining capitalization and a footnote to acknowledge the likely Spirit reference and the agency alternative. It also replaces ‘Onyenwe anyị’ with ‘Onyenwe ya,’ avoiding an added communal possessive and accurately presenting David’s designation of the referent as his Lord. The syntax remains close to the Greek and idiomatic in Standard Igbo.
