  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: ig
  text: N’ihi na ọtụtụ mmadụ ka a kpọrọ[a], ma mmadụ ole na ole ka a họọrọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị a kpọrọ òkù”; n’akụkọ a banyere oriri agbamakwụkwọ, okwu ahụ nwekwara ike ịpụta ịkpọ mmadụ òkù.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị ahọpụtara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: ọtụtụ mmadụ
  rationale: Aha-ọnọdụ a na-arụ ọrụ dịka aha n’ụdị ọtụtụ; “ọtụtụ mmadụ” doro anya n’Igbo ma debe ọdịiche ya na ὀλίγοι.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-enye ihe kpatara ma ọ bụ nkọwa maka okwu bu ya ụzọ; “N’ihi na” na-egosipụta njikọ ahụ nke ọma.
- source_word: εἰσιν
  choice: ka …
  rationale: N’ahịrịokwu Igbo a, usoro “ka a kpọrọ” na “ka a họọrọ” na-eburu ọrụ njikọ nke εἰσιν n’ụzọ e ji ekwu Igbo nke ọma, kama ịsụgharị ya iche dịka “bụ.”
- source_word: κλητοὶ
  choice: ndị a kpọrọ
  rationale: “A kpọrọ” na-edebe isi echiche nke ịkpọ mmadụ, tinyere nghọta sara mbara nke okwu Grik ahụ. N’ihi akụkọ oriri agbamakwụkwọ gbara ya gburugburu, “ndị a kpọrọ òkù” bụkwa ntụgharị kwesịrị ekwesị, ya mere e debere ya n’okpuru peeji.
- source_word: ὀλίγοι
  choice: mmadụ ole na ole
  rationale: Ọ bụ okwu na-emegide πολλοί kpọmkwem; “mmadụ ole na ole” bụ Igbo doro anya ma na-aga nke ọma na “ọtụtụ mmadụ.”
- source_word: δὲ
  choice: ma
  rationale: N’ebe a δέ na-egosi ọdịiche dị n’etiti ìgwè abụọ ahụ; “ma” na-egosipụta ọdịiche ahụ n’ụzọ dị nkenke.
- source_word: ἐκλεκτοί
  choice: ndị a họọrọ
  rationale: “A họọrọ” na-enye isi nghọta nke okwu Grik ahụ n’Igbo nke oge a n’etinyeghị nkọwa okwukwe nke otu ụka n’ime isi ederede.
theological_decisions:
- issue: Otú e si sụgharị ἐκλεκτοί n’amaokwu a na-ejikarị atụle ịhọpụta na ịkpọ mmadụ
  choice: ndị a họọrọ
  alternative: ndị a họpụtara ahọpụta
  rationale: “Ndị a họọrọ” na-egosipụta isi nghọta okwu Grik ahụ n’ụzọ doro anya ma ghara ikpebi arụmụka ozizi. E nyere ntụgharị nke na-akọwapụta echiche nke ndị ahọpụtara n’okpuru peeji.
- issue: Otú e si sụgharị κλητοί n’akụkọ oriri agbamakwụkwọ a
  choice: ndị a kpọrọ
  alternative: ndị a kpọrọ òkù
  rationale: “Ndị a kpọrọ òkù” dabara kpọmkwem n’ihe banyere oriri ahụ, ma “ndị a kpọrọ” na-edebe ma ihe gbara amaokwu ahụ gburugburu ma nghọta sara mbara nke okwu ahụ. Ihe ọzọ ahụ dị n’okpuru peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. Ahịrịokwu ahụ debere nkenke na ọdịiche ilu dị n’etiti “ọtụtụ” na “ole na ole,” nakwa n’etiti “a kpọrọ” na “a họọrọ.”
