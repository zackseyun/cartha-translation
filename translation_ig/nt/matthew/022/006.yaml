    issue: Redundant expression for οἱ λοιποί
    rationale: “Ndị ọzọ fọdụrụ” combines “others” and “remaining,” whereas “ndị fọdụrụ” alone naturally expresses “the rest” in Standard Igbo and avoids an unnecessary duplication.
