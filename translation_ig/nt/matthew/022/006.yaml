id: MAT.22.6
reference: Matthew 22:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his servants, mistreated them and killed them.
translation:
  language: ig
  text: Ma ndị fọdụrụ jidere ndị ohu ya[a], mesoo ha ihe n’ụzọ jọgburu onwe ya, ma gbuo ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-ejere ya ozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Ma ndị ọzọ fọdụrụ
  rationale: “Ndị ọzọ fọdụrụ” na-egosi ndị fọdụrụ n’etiti ndị a kpọrọ òkù; “Ma” na-egosikwa obere ntụgharị dị na δέ.
- source_word: κρατήσαντες
  choice: jidere
  rationale: Ngwaa a na-egosi ijide mmadụ aka ma ọ bụ ịchịkwa ya. Usoro ngwaa ndị Igbo na-eme ka o doo anya na njide ahụ butere mmegbu na igbu ha.
- source_word: τοὺς δούλους αὐτοῦ
  choice: ndị ohu ya
  rationale: δοῦλος nwere ike ịbụ ohu ma ọ bụ onye na-eje ozi. N’akụkọ a, “ndị ohu ya” na-edobe ọnọdụ mmekọrịta ha na eze n’ụzọ doro anya, ebe e debere ụzọ ọzọ na nkọwa ala peeji.
- source_word: ὕβρισαν
  choice: mesoo ha ihe n'ụzọ jọgburu onwe ya
  rationale: ὑβρίζω karịrị ịkọcha mmadụ ọnụ; ọ gụnyere imenye ya ihere na imegbu ya. Nkebi a na-ebupụta obosara ihe okwu Grik ahụ pụtara n’Igbo a na-aghọta nke ọma.
- source_word: ἀπέκτειναν
  choice: gbuo ha
  rationale: Nke a bụ ntụgharị kwụ ọtọ ma dị mfe nke ἀποκτείνω, na-etinyeghị echiche iwu ọzọ nke ngwaa ahụ ekwughị kpọmkwem.
theological_decisions:
- issue: Otu e si tụgharị δοῦλος n’ilu a
  choice: ndị ohu ya
  alternative: ndị na-ejere ya ozi
  rationale: “Ndị ohu” na-edobe ọnọdụ ndị ozi eze ahụ n’ụwa akụkọ ahụ n’emeghị ka ọ bụrụ ozizi pụrụ iche; “ndị na-ejere ya ozi” ka bụ ntụgharị kwesịrị ekwesị ma dị nro karị, ya mere e tinyere ya na nkọwa ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma doo ndị nkịtị anya. A họọrọ “mesoo ha ihe n'ụzọ jọgburu onwe ya” iji gosi na mmejọ ahụ abụghị naanị ịkọcha ha ọnụ.
