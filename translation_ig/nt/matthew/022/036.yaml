  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διδάσκαλε, ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: ig
  text: Onye Nkụzi, olee iwu kacha ukwuu n’Iwu ahụ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Ọ bụ okwu ịkpọ mmadụ aha n’ihu, nke a na-agwa Jizọs; “Onye Ozizi” bụ okwu Igbo doro anya nke na-egosi onye na-akụzi, na-etinyeghị echiche ọchịchị dị n’okwu dịka “Nna Ukwu.”
- source_word: ποία
  choice: olee
  rationale: Ọ na-ajụ ka a họpụta otu iwu n’etiti iwu ndị dị n’Iwu ahụ; “olee” bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi jụọ nke bụ nke a na-ekwu maka ya.
- source_word: ἐντολὴ
  choice: iwu
  rationale: N’ebe a ọ pụtara ihe e nyere n’iwu n’ime Iwu Mozis; “iwu” bụ okwu Igbo nkịtị ma dabara nke ọma n’ọnọdụ Akwụkwọ Nsọ a.
- source_word: μεγάλη
  choice: kacha ukwuu
  rationale: Ọ bụ ezie na Grik ji adjective positive, ajụjụ a n’ọnọdụ ya na-achọ ịmata iwu nọ n’ọkwa kachasị elu; Igbo na-egosipụta echiche a n'ụzọ ebumpụta ụwa site n’ịsị “kacha ukwuu.”
- source_word: ἐν τῷ νόμῳ
  choice: n’Iwu ahụ
  rationale: Ọ na-ezo aka kpọmkwem n’Iwu ndị Juu, ya bụ Torah; mkpụrụedemede ukwu na “ahụ” na-eme ka o doo anya na ọ bụghị iwu n’ozuzu kama ọ bụ Iwu ahụ a maara.
theological_decisions:
- issue: Ma a ga-asụgharị μεγάλη dịka adjective positive ma ọ bụ dịka superlative sitere n’ọnọdụ okwu ahụ
  choice: kacha ukwuu
  alternative: dị ukwuu
  rationale: Ọ bụ eziokwu na ọdịdị okwu Grik bụ positive, ma ajụjụ ποία ... μεγάλη na ọnọdụ a nwere echiche ịhọpụta iwu kachasị mkpa n’etiti iwu niile. “Kacha ukwuu” na-enye Igbo dị mma ma na-edebe ike ntụnyere nke ajụjụ ahụ n’ọnọdụ ya.
translation_notes:
  register: Asụsụ Igbo Standard nke oge a, dị mfe, kwanyere ùgwù, ma dịkwa mma maka ịgụpụta n’ihu ọha. E jighị okwu ụka pụrụ iche; “Onye Ozizi” na “Iwu ahụ” doro ndị nkịtị anya.
