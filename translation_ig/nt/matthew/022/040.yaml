  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: ig
  text: N’iwu abụọ ndị a ka Iwu ahụ dum na Ndị Amụma kwụgidere.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “N’ime iwu abụọ ndị a.” Okwu Grik bụ ἐν (“n’ime”); ma e ji “n’… ka … kwụgidere” mee ka ihe atụ dị n’okwu ahụ pụta ìhè n’Igbo.
    reason: lexical_alternative
  - marker: b
    text: “Iwu ahụ na Ndị Amụma” bụ aha a na-ejikarị ezo aka n’akwụkwọ nsọ ndị Juu. Amaokwu a na-ekwu na ha dum kwụgidere n’iwu abụọ ndị a.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: dabere n’iwu abụọ a
  rationale: Ọ bụ ezie na ἐν pụtarakarị ‘n’ime,’ mgbe e jikọtara ya na κρέμαται, okwu Igbo nkịtị nke na-egosi ihe e ji ihe ọzọ kwado bụ ‘dabere na.’ Nke a na-echekwa echiche nke ihe na-adabere n’ihe ọzọ n’enweghị Igbo na-adịghị eke ekwe.
- source_word: ὅλος ὁ νόμος
  choice: Iwu ahụ niile
  rationale: ὅλος na-emesi izu oke nke νόμος ike. ‘Iwu ahụ niile’ na-egosi Iwu Mozis dum, ọ bụghị iwu n’ozuzu ya.
- source_word: κρέμαται
  choice: dabere
  rationale: κρέμαται pụtara n'ụzọ nkịtị ‘kwụgidere,’ ma n’ebe a ọ na-enye echiche nke ịdabere n’ihe. ‘Dabere’ bụ okwu Igbo doro anya ma kwekọọ n’ihe atụ ahụ n’ụzọ eke.
- source_word: καὶ οἱ προφῆται
  choice: na Ihe Ndị Amụma dere
  rationale: N’usoro okwu a, οἱ προφῆται na-ezo aka n’akụkụ Akwụkwọ Nsọ a na-akpọ Ndị Amụma, ọ bụghị naanị ndị amụma n’onwe ha. ‘Ihe Ndị Amụma dere’ na-eme ka nke a doo onye Igbo nke oge a anya ma na-echekwa njikọ ya na Akwụkwọ Nsọ.
theological_decisions:
- issue: Ihe usoro okwu ‘Iwu ahụ na Ihe Ndị Amụma dere’ pụtara
  choice: Ọ na-ezo aka n’ebe akaebe Akwụkwọ Nsọ dum nọ, nke iwu abụọ banyere ịhụnanya chịkọtara ma bụrụ ntọala nghọta ya.
  alternative: Ọ na-ezo nanị aka n’ozizi omume ọma ndị dị n’Iwu na n’akwụkwọ ndị amụma.
  rationale: N’Oziọma Matiu, usoro okwu a bụ ụzọ a maara ama e si ezo aka n’Akwụkwọ Nsọ nwere ikike. Nsụgharị ahụ anaghị eji ‘Akwụkwọ Nsọ dum’ dochie ya, ka ụda na njikọ nke okwu mbụ ahụ ghara ịla n’iyi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, sụgharịa ya. A họọrọ ‘dabere na’ kama ‘kwụgidere n’elu’ n’ihi na ọ bụ ụzọ Igbo kacha eke ekwe isi gosipụta ihe atụ nke ịdabere n’ihe ọzọ. E debere usoro aha ‘Iwu ahụ na Ihe Ndị Amụma dere’ ka njikọ ya na nkebi Akwụkwọ Nsọ pụta ìhè.
