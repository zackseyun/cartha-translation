revisions:
- from: Iwu ahụ niile na Ihe Ndị Amụma dere dabere n’iwu abụọ a.[a][b]
  to: N’iwu abụọ ndị a ka Iwu ahụ dum na Ndị Amụma kwụgidere.[a][b]
  rationale: The revision keeps the totalizing force of ὅλος, preserves κρέμαται as ‘kwụgidere,’ and uses the conventional paired designation ‘Iwu ahụ … na Ndị Amụma.’ The footnotes clarify the formal alternative for ἐν and the scriptural formula without narrowing its scope or adding doctrinal claims.
  reviewer_model: gpt-5.6-terra
