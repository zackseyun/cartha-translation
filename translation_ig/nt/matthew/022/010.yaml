    text: N’asụsụ Grik, okwu ahụ pụtara ndị ‘dina n’akụkụ tebụl’; nke a bụ otu ndị mmadụ si eri nri n’oriri ukwu n’oge ahụ.
    reason: cultural_note
  revision_rationale: The revision restores the wedding feast/hall as what is filled and renders ἀνακειμένων directly as people reclining at table for the meal. It removes the added implication that the gathered people “came to eat,” while retaining a concise cultural footnote.
