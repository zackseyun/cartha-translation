review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the servants/slaves, the roads, the comprehensive gathering, and the moral pairing. However, “ndị bịara rie oriri” adds the idea that they came specifically to eat and does not adequately represent ἀνακειμένων, which identifies those reclining for the meal. The Greek makes the wedding feast/hall the entity filled, not the diners as the grammatical subject.
  naturalness: The proposed revision is clear Standard Igbo and keeps the formal narrative register. “ndị dina n’akụkụ tebụl na-eri nri” is intelligible while the footnote explains that this describes the customary banquet posture.
  terminology: “Ndị ohu,” “ụzọ dị iche iche,” “ndị ajọ omume ... ndị ezi omume,” and “ebe a na-eme oriri agbamakwụkwọ” appropriately retain the source sense. The revised wording explicitly retains the meal-reclining image.
  issues:
  - severity: medium
    issue: The final clause changes the source’s syntax and weakens the reclining participle.
    rationale: “Ndị bịara rie oriri wee jupụta...” introduces “came to eat” and makes the diners the explicit subject that fill the venue. The Greek says that the wedding feast/hall was filled “with those reclining.”
  revised_text: Ndị ohu ahụ wee pụọ gaa n’ụzọ dị iche iche, kpọkọta ndị niile ha hụrụ, ma ndị ajọ omume ma ndị ezi omume; ebe a na-eme oriri agbamakwụkwọ ahụ wee jupụta n’ndị dina n’akụkụ tebụl na-eri nri.[a]
  revised_footnotes:
