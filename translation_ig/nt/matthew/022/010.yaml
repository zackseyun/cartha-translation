id: MAT.22.10
reference: Matthew 22:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those servants went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: ig
  text: Ndị ohu ahụ wee pụọ gaa n’ụzọ dị iche iche, kpọkọta ndị niile ha hụrụ, ma ndị ajọ omume ma ndị ezi omume; ebe a na-eme oriri agbamakwụkwọ ahụ wee jupụta n’ndị dina n’akụkụ tebụl na-eri nri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ahụ pụtara ndị ‘dina n’akụkụ tebụl’; nke a bụ otu ndị mmadụ si eri nri n’oriri ukwu n’oge ahụ.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: ndị ohu
  rationale: Nke a na-egosi ndị nọ n’okpuru ikike eze ma na-ejere ya ozi, n’enweghị ime ka ọnọdụ ha dị nro dịka nanị ‘ndị na-eje ozi.’
- source_word: ὁδοὺς
  choice: ụzọ dị iche iche
  rationale: Ọtụtụ ὁδοὺς na-ezo aka n’ụzọ ọha ebe a pụrụ ịhụ ndị mmadụ; okwu a bụ Igbo doro anya ma dị mfe.
- source_word: συνήγαγον
  choice: kpọkọtakwa
  rationale: Ọ na-enye echiche nke ịkpọkọta ma mee ka ndị ahụ zukọta n’otu ebe.
- source_word: πάντας οὓς εὗρον
  choice: ndị niile ha hụrụ
  rationale: Nke a na-edobe oke zuru ezu nke πάντας na nkebiokwu njikọ ya n’Igbo nkịtị.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: ma ndị ajọ omume ma ndị ezi omume
  rationale: Ọ na-edobe ọdịiche omume siri ike dị n’etiti πονηρούς na ἀγαθούς, n’enweghị ịkọwa ihe ilu ahụ karịa ihe ederede kwuru.
- source_word: γάμος
  choice: ebe a na-eme oriri agbamakwụkwọ
  rationale: N’ebe a, γάμος bụ ihe a sịrị na ndị na-eri nri jupụtara na ya; ya mere ntụgharị a na-egosi ebe ma ọ bụ ọnọdụ oriri agbamakwụkwọ, ọ bụghị nanị emume agbamakwụkwọ n’ozuzu.
- source_word: ἐπλήσθη
  choice: jupụta
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si kwuo na ebe ahụ ghọrọ nke ndị mmadụ juputara na ya.
- source_word: ἀνακειμένων
  choice: ndị bịara rie oriri
  rationale: Okwu Grik ahụ pụtara ndị dina n’akụkụ tebụl iri nri dịka omenala oge ahụ; Igbo a na-enye isi ọrụ ha n’ebe ahụ n’ụzọ doro anya, ebe nkọwa ụkwụ na-edobe nkọwa omenala ahụ.
theological_decisions:
- issue: Ụdị omume nke ndị a kpọkọtara
  choice: ma ndị ajọ omume ma ndị ezi omume
  alternative: ma ndị ọjọọ ma ndị ọma
  rationale: Nhọrọ a na-edobe ike nke ọdịiche omume ahụ na oke òkù ahụ ruru mmadụ niile, ma ọ naghị edozi esemokwu dị n’ilu ahụ banyere ịbịa na nzaghachi kwesịrị ekwesị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ntụgharị ahụ. A hapụrụ ịdị nkọ nke ‘ohu’ na ọdịiche dị n’etiti ndị ajọ omume na ndị ezi omume; e mere ka γάμος doo anya dịka ebe oriri agbamakwụkwọ n’ihi na ndị na-eri nri jupụtara na ya.
