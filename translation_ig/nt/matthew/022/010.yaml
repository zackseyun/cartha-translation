revisions:
- from: Ndị ohu ahụ wee pụọ gaa n’ụzọ dị iche iche, kpọkọtakwa ndị niile ha hụrụ, ma ndị ajọ omume ma ndị ezi omume; ndị bịara rie oriri wee jupụta n’ebe a na-eme oriri agbamakwụkwọ.[a]
  to: Ndị ohu ahụ wee pụọ gaa n’ụzọ dị iche iche, kpọkọta ndị niile ha hụrụ, ma ndị ajọ omume ma ndị ezi omume; ebe a na-eme oriri agbamakwụkwọ ahụ wee jupụta n’ndị dina n’akụkụ tebụl na-eri nri.[a]
  rationale: The revision restores the wedding feast/hall as what is filled and renders ἀνακειμένων directly as people reclining at table for the meal. It removes the added implication that the gathered people “came to eat,” while retaining a concise cultural footnote.
