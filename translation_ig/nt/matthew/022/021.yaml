id: MAT.22.21
reference: Matthew 22:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγουσιν ⸀αὐτῷ· Καίσαρος. τότε λέγει αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: ig
  text: Ha sịrị ya, “Ọ bụ nke Siza.” Mgbe ahụ, ọ sịrị ha, “Ya mere, nyeghachinụ[a] Siza ihe ndị bụ nke Siza, nyeghachikwara Chineke ihe ndị bụ nke Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kwụọnụ Siza … kwụkwaanụ Chineke …” Okwu Grik ahụ pụrụ ịpụta “inyeghachi,” “ịkwụ,” ma ọ bụ “inye ihe ruuru onye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν / λέγει
  choice: Ha sịrị / ọ sịrị
  rationale: A sụgharịrị historical present Grik dị ka oge gara aga, nke bụ ụzọ Igbo si akọ akụkọ n'ụzọ ebumpụta ụwa.
- source_word: Καίσαρος
  choice: Ọ bụ nke Siza
  rationale: Genitive ahụ na-aza ajụjụ a na-eche n'uche banyere onye nwe onyinyo na ihe e dere n'elu mkpụrụ ego; okwu a bụ nke Igbo doro anya ma dịkwa mfe.
- source_word: Ἀπόδοτε
  choice: nyeghachinụ
  rationale: Okwu a nwere echiche nke inyeghachi ma ọ bụ ịkwụ ihe mmadụ ji; “nyeghachinụ” na-edobe echiche nke inye onye nwe ihe ihe ruuru ya.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu Jizọs wepụtara site n'azịza ha.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: Siza ihe ndị bụ nke Siza
  rationale: Nhazi a na-edobe ma ihe e nyere Siza ma okwu gbasara ihe bụ nke ya, n'ejighị nkọwa ndọrọ ndọrọ ọchịchị tinye na ya.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: Chineke ihe ndị bụ nke Chineke
  rationale: Ọ na-edobe nhazi na ntụnyere nke okwu Grik ahụ, jiri aha Igbo a na-ahụkarị maka Chineke.
theological_decisions:
- issue: Ike iwu Jizọs gbasara ọrụ e ji ọchịchị na ọrụ e ji Chineke
  choice: E debere iwu abụọ ahụ n'usoro yiri ibe ha, na-enweghị ịkọwa kpọmkwem oke ihe bụ nke Siza ma ọ bụ nke Chineke.
  alternative: Ịkọwa ya naanị dịka iwu ịkwụ ụtụ isi, ma ọ bụ dịka nkwado ọchịchị obodo na-enweghị oke.
  rationale: Okwu Grik ahụ na-amata ihe e ji Siza na ihe e ji Chineke, ma ọ naghị akọwapụta usoro ndọrọ ndọrọ ọchịchị zuru ezu. Nsụgharị ahụ na-ahapụ esemokwu na ịdị omimi ahụ ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Nyeghachinụ” bụ iwu e nyere ọtụtụ mmadụ, ma ntụgharị ahịrịokwu abụọ ahụ na-edobe nhazi na ụda nke okwu mbụ.
