  source_fidelity: The translation accurately reflects the historical-present verbs as past narrative, the elliptical answer Καίσαρος as “Ọ bụ nke Siza,” the inferential οὖν as “Ya mere,” and the parallel imperative Ἀπόδοτε … καὶ … as two coordinated commands. “Nyeghachinụ” appropriately conveys giving what is due without narrowing the saying to taxation or implying unrestricted state authority.
