  terminology: “Siza” and “Chineke” are standard, recognizable forms. The phrasing “ihe ndị bụ nke Siza/Chineke” clearly expresses the substantival genitives and retains the rhetorical parallelism. The footnote’s alternatives accurately represent the semantic range of ἀποδίδωμι.
