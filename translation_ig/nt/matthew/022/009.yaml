revisions:
- from: Ya mere, gaanụ n’ebe okporo ụzọ dị iche iche na-ezukọ[a], kpọọkwa ndị niile unu hụrụ ka ha bịa n’oriri agbamakwụkwọ[b].
  to: Ya mere, gaanụ n’ebe ụzọ si n’okporo ụzọ apụta[a], kpọọnụ ndị niile unu hụrụ òkù ka ha bịa n’oriri agbamakwụkwọ[b].
  rationale: The revision preserves the ambiguity of διεξόδους by using an outlet-oriented expression in the main text and retaining intersection/branching alternatives in the footnote. It also corrects the explanatory handling of the Greek plural γάμοι, while preserving its idiomatic singular wedding-feast meaning.
  reviewer_model: gpt-5.6-terra
