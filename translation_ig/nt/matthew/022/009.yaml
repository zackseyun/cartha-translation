source:
  edition: SBLGNT
  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: ig
  text: Ya mere, gaanụ n’ebe ụzọ si n’okporo ụzọ apụta[a], kpọọnụ ndị niile unu hụrụ òkù ka ha bịa n’oriri agbamakwụkwọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “n’ebe ụzọ dị iche iche na-agafe ibe ha” ma ọ bụ “n’ebe okporo ụzọ na-ekewa”; okwu Grik a na-ezo aka n’ebe ụzọ si apụ, na-ekewa, ma ọ bụ na-ezukọ.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, okwu a dị n’ụdị ọtụtụ, “agbamakwụkwọ”; nke a bụ akpaalaokwu pụtara emume ma ọ bụ oriri agbamakwụkwọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: gaanụ
  rationale: Ngwaa iwu a na-agwa ọtụtụ mmadụ ka ha gaa; “gaanụ” bụ okwu Igbo doro anya ma na-adịkwa mma n’asụsụ a na-asụ ugbu a.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi ihe e kwesịrị ime n’ihi ihe e kwuru tupu ya, ma chekwaa njikọ echiche dị n’amaokwu ahụ.
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: n’ebe okporo ụzọ dị iche iche na-ezukọ
  rationale: διέξοδοι nwere ike izo aka n’ebe ụzọ na-apụ, na-ekewa, ma ọ bụ na-ezukọ. Nhọrọ a na-enye onye Igbo nke oge a echiche doro anya banyere ebe ọha mmadụ na-agafe, n’enweghị ịkọwa ọdịdị ebe ahụ karịa ihe Grik kwuru.
- source_word: ὅσους ἐὰν εὕρητε
  choice: ndị niile unu hụrụ
  rationale: Nkebiokwu a na-egosi obosara na enweghị mmachi—ndị ọ bụla ha ga-ahụ, ha kpọọ ha niile.
- source_word: καλέσατε
  choice: kpọọkwa ... ka ha bịa
  rationale: N’ọnọdụ oriri a, καλέω pụtara ịkpọ mmadụ òkù. Usoro Igbo a na-egosi nke ọma na a na-akpọ ha ka ha bịa oriri, ọ bụghị nanị ịkpọ ha aha ma ọ bụ iti ha mkpu.
- source_word: εἰς τοὺς γάμους
  choice: n’oriri agbamakwụkwọ
  rationale: Ọtụtụ γάμοι bụ akpaalaokwu na-ezo aka n’emume ma ọ bụ oriri agbamakwụkwọ, ọ bụghị ọtụtụ agbamakwụkwọ dị iche iche.
