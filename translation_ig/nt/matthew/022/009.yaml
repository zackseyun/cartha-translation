translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, mee nsụgharị ahụ. A họọrọ “okporo ụzọ” maka ụzọ ọha sara mbara, ma e debere obosara okwu Grik ahụ na nkọwa ala peeji.
