review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the imperatives, the inferential force of οὖν, the inclusive scope of ὅσους ἐὰν εὕρητε, and the banquet sense of γάμοι. However, its main rendering of διεξόδους as places where roads meet narrows a term that more basically denotes road outlets/exits; the accompanying note recognizes the broader range but the text should retain it more cautiously.
  naturalness: The revised wording is natural, clear Standard Igbo and retains a dignified narrative register. “Kpọọnụ ... òkù” is an unambiguous and idiomatic invitation expression in this context.
  terminology: “Oriri agbamakwụkwọ” appropriately communicates the wedding-banquet sense. The revised footnote avoids suggesting that the Greek plural means several distinct weddings.
  issues:
  - severity: medium
    issue: The main text renders διεξόδους τῶν ὁδῶν exclusively as road intersections.
    rationale: Although intersections/crossroads are a possible contextual interpretation, διεξόδους primarily allows outlets or points where roads lead out/branch. A main-text rendering focused on places where roads lead out preserves the source’s lexical breadth, with alternatives in the note.
  - severity: medium
    issue: Footnote b glosses the Greek as “n’agbamakwụkwọ dị iche iche.”
    rationale: This can be read as multiple separate weddings. The plural γάμοι is idiomatic for a single wedding celebration or feast, so the note should identify the grammatical plural without introducing that misleading implication.
  revised_text: Ya mere, gaanụ n’ebe ụzọ si n’okporo ụzọ apụta[a], kpọọnụ ndị niile unu hụrụ òkù ka ha bịa n’oriri agbamakwụkwọ[b].
  revised_footnotes:
