  rationale: The revision uses “zara” for the Greek narrative participle ἀποκριθεὶς and retains a footnote that notes its idiomatic use when no immediate question is present. It also recasts the remainder in straightforward Standard Igbo while preserving “again,” the audience, the parabolic manner of speech, and the speech-introducing “sị.”
