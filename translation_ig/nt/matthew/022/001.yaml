  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς πάλιν εἶπεν ⸂ἐν παραβολαῖς αὐτοῖς⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/001.yaml
  text: 'And Jesus answered and again spoke to them in parables[a], saying:'
translation:
  language: ig
  text: 'Jizọs zara[a], gwakwa ha okwu ọzọ n’ilu, sị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “zaghachiri.” N’akụkọ Grik, a na-ejikarị okwu ahụ a sụgharịrị “zara” mee njikọ n’okwu, ọbụna mgbe e kwughị ajụjụ kpọmkwem ozugbo tupu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: —
  rationale: E tinyere njikọ a n’usoro okwu Igbo n’enweghị ‘Ma’ ma ọ bụ ‘Mgbe ahụ,’ ka a ghara ịgbakwunye echiche nke abụghị nke doro anya na Grik; mkpọtụta okwu ahụ ka na-aga n’ihu site n’akụkọ bu ya ụzọ.
- source_word: ἀποκριθεὶς
  choice: zaghachiri
  rationale: Nke a na-echekwa okwu Grik nke pụtara ‘zara’ ma ọ bụ ‘zaghachiri,’ ọ bụ ezie na ajụjụ kpọmkwem adịghị n’ihu ya ozugbo.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: Aha onye ahụ ka e dere n’ụdị Standard Igbo; Igbo anaghị achọ ịsụgharị article Grik dị n’ihu aha mmadụ.
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosi na Jizọs kwukwara okwu ọzọ n’usoro mkparịta ụka ahụ.
- source_word: εἶπεν
  choice: gwa ha okwu
  rationale: Ụdị a bụ Igbo dị mfe ma gbochie ikwughachi ‘sị ... sị’ n’ihi participle λέγων na-esote.
- source_word: ἐν παραβολαῖς
  choice: jiri ilu
  rationale: ἐν na-egosi ụzọ e si kwuo okwu; ‘jiri ilu’ bụ okwu Igbo e ji egosi na ihe atụ ma ọ bụ akụkọ atụ bụ ụzọ o si zie ha ihe.
- source_word: αὐτοῖς
  choice: ha
  rationale: Ọ bụ nnọchiaha dative na-egosi ndị Jizọs gwara okwu.
- source_word: λέγων
  choice: sị
  rationale: Ọ na-ebute okwu ga-esochi, ‘sị’ bụkwa ụzọ Igbo si eme nke a n’ụzọ eke.
theological_decisions:
- issue: Iji okwu pụtara ‘zaghachiri’ mgbe a na-ekwughị ajụjụ kpọmkwem ozugbo tupu ya
  choice: E debere ‘zaghachiri.’
  alternative: ‘malitekwara ịgwa ha okwu’ ma ọ bụ ịhapụ echiche nke ịza azịza
  rationale: Nke a bụ akpaala okwu nkọ akụkọ a na-ahụkarị na Grik, ọ bụghị nkwupụta ozizi. Idebe ya na-echekwa usoro na nghọta ederede ahụ n’ebughị nkọwa ọzọ bata.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ilu’ sụgharịa παραβολή n’ebe a dịka ụzọ e si akụzi ihe site n’ihe atụ; nhazi okwu ahụ zere ikwughachi ‘sị ... sị’ n’ụzọ na-adịghị eke n’Igbo.
