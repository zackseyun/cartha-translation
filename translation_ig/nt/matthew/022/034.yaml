  text: Οἱ δὲ Φαρισαῖοι ἀκούσαντες ὅτι ἐφίμωσεν τοὺς Σαδδουκαίους συνήχθησαν ἐπὶ τὸ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/034.yaml
  text: But when the Pharisees heard that he had silenced the Sadducees[a], they gathered together.
translation:
  language: ig
  text: Ma mgbe ndị Farisii nụrụ na o mechiri ndị Sadusii ọnụ[a], ha gbakọtara ọnụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “o kpuchiri ha ọnụ.” Okwu Grik ahụ pụrụ ịpụta itinye ihe mkpuchi n’ọnụ anụmanụ; n’ebe a, e ji ya atụpụta ime ka ndị Sadusii kwụsị ikwu okwu n’arụmụka.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi ntakịrị mgbanwe na ọdịiche n’akụkọ ahụ, dịka njikọ ya na mkparịta ụka gara aga.
- source_word: Φαρισαῖοι
  choice: ndị Farisii
  rationale: Nsụgharị aha otu okpukpe ndị Juu n’ụdị a na-ejikarị eme ihe n’Igbo.
- source_word: ἀκούσαντες
  choice: mgbe ... nụrụ
  rationale: Na-enye participle aorist ahụ nghọta oge n’Igbo dị mfe ma doo anya.
- source_word: ἐφίμωσεν
  choice: o mere ka ... mechie ọnụ
  rationale: Na-egosipụta ịkwụsị ha ikwu okwu n’arụmụka, ma na-edebekwa ntakịrị onyonyo nke okwu Grik ahụ karịa naanị ‘o mere ka ha gbachi nkịtị.’
- source_word: Σαδδουκαίους
  choice: ndị Sadusii
  rationale: Nsụgharị aha otu ndị Juu ahụ n’ụdị dabara n’usoro mkpọpụta na ide Igbo.
- source_word: συνήχθησαν
  choice: ha gbakọtara
  rationale: Na-enye echiche na ha zukọrọ dịka otu, n’asụsụ Igbo nkịtị.
- source_word: ἐπὶ τὸ αὐτό
  choice: ọnụ
  rationale: N’ebe a ọ pụtara na ha bịakọrọ n’otu ebe ma ọ bụ dịka otu; ‘ọnụ’ na-eme ka ahịrịokwu ahụ bụrụ nke eke n’Igbo n’etinyeghị ebe ma ọ bụ ebumnuche a na-akọwaghị.
