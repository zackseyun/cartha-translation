  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: ig
  text: “Onyenwe sịrị Onyenwe m[a], ‘Nọdụ ala n’aka nri m ruo mgbe m ga-edowe ndị iro gị n’okpuru ụkwụ gị’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka akpaalaokwu Hibru dị n’Abụ Ọma 110:1 si dị, “mee ka ndị iro gị bụrụ ihe mgbakwasị ụkwụ gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: gwara … sị
  rationale: Ụdị a bụ ụzọ Igbo si ekwu okwu n’ụzọ eke mgbe e gosiri onye a gwara; ọ na-anọchi aorist λέγω nke pụtara ‘kwuru/gwara.’
- source_word: κύριος
  choice: Onyenwe
  rationale: ‘Onyenwe’ bụ aha nsọpụrụ dabara adaba maka κύριος. E ji otu okwu ahụ mee ihe n’ebe abụọ dịka Grik siri mee, ebe ‘anyị’ na ‘m’ na-egosi ọdịiche dị n’etiti ndị a na-ekwu maka ha.
- source_word: τῷ κυρίῳ μου
  choice: Onyenwe m
  rationale: Ọ na-echekwa aha nsọpụrụ κύριος na njikọ nke ‘m,’ ma ghara ibelata ya ka ọ bụrụ naanị ‘nna ukwu m.’
- source_word: Κάθου
  choice: Nọdụ ala
  rationale: Iwu a bụ okwu Igbo doro anya ma dị eke maka ịnọdụ n’ọnọdụ nsọpụrụ na ọchịchị.
- source_word: ἐκ δεξιῶν μου
  choice: n’aka nri m
  rationale: Nke a bụ akpaalaokwu Igbo kwekọrọ n’ọnọdụ dị n’aka nri, ebe nsọpụrụ na ikike dị.
- source_word: ἕως ἂν θῶ
  choice: ruo mgbe m ga-edowe
  rationale: ‘Ruo mgbe’ na ọdịnihu ‘ga-edowe’ na-egosipụta oge a na-atụ anya omume ahụ ga-eme, dịka ἕως ἂν tinyere subjunctive si kwuo.
- source_word: τοὺς ἐχθρούς σου
  choice: ndị iro gị
  rationale: Nke a bụ ntụgharị Igbo nkịtị, doro anya maka ndị na-emegide onye ahụ.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: n’okpuru ụkwụ gị
  rationale: Ọ na-esochi okwu Grik kpọmkwem ma na-echekwa ihe oyiyi nke imeri na ido ndị iro n’okpuru ọchịchị.
theological_decisions:
- issue: Otu esi atụgharị κύριος ugboro abụọ n’okwu e hotara n’Abụ Ọma 110:1
  choice: Onyenwe anyị gwara Onyenwe m
  alternative: Onyenwe Chineke gwara Nna ukwu m
  rationale: Grik ji κύριος mee ihe n’ebe abụọ, ya mere ntụgharị ahụ jikwa otu aha nsọpụrụ mee ihe. ‘Anyị’ na ‘m’ na-eme ka ndị a na-ekwu maka ha dị iche n’enweghị ịtinye aha Chineke nke na-adịghị n’ederede Grik ma ọ bụ ime ka κύριος nke abụọ ghọọ okwu dị ala.
- issue: Ihe oyiyi nke idowe ndị iro n’okpuru ụkwụ
  choice: n’okpuru ụkwụ gị
  alternative: ka ha bụrụ ihe mgbakwasị ụkwụ gị
  rationale: Ederede Grik Matiu nwere ‘n’okpuru ụkwụ gị’ kpọmkwem. Ihe mgbakwasị ụkwụ bụ ụzọ e si aghọta akpaalaokwu Hibru nke Abụ Ọma 110:1, ya mere e debere ya n’ala peeji kama dochie okwu Grik.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma nwee ugwu. E ji ‘Onyenwe’ mee ihe ugboro abụọ iji chekwaa nhazi Grik na esemokwu nkà mmụta okpukpe dị n’ajụjụ Jizọs; e zere ịkọwa ya karịa ihe ederede kwuru.
