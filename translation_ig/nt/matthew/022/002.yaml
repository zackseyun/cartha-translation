review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the aorist passive comparison formula, Matthew’s distinct expression “kingdom of heaven,” the royal figure, the wedding-feast sense of γάμους, and the beneficiary sense of “for his son.” In this construction, however, ἀνθρώπῳ βασιλεῖ functions naturally as “a king”; forcing mmadụ into the target text is not required for fidelity and produces an unnatural distinction absent from the intended comparison.
  naturalness: “Otu eze bụ́ mmadụ” is not natural Standard Igbo in this context, since eze already denotes a human ruler and the added mmadụ sounds needlessly contrastive or tautological. “Otu eze” is clear, idiomatic, and retains the sense of the Greek phrase in context. The remaining wording is natural and appropriately dignified.
  terminology: “Alaeze eluigwe” appropriately retains Matthew’s wording without substituting “Chineke.” “Oriri agbamakwụkwọ” accurately conveys the festive/banquet sense of plural γάμοι. The footnotes remain relevant and their anchors are correctly placed.
  issues:
  - severity: medium
    issue: Unnatural rendering of ἀνθρώπῳ βασιλεῖ
    rationale: “Otu eze bụ́ mmadụ” is awkward and semantically redundant in Standard Igbo. In the Greek idiom, the phrase is naturally represented by “otu eze”; retaining mmadụ here does not add a meaningful contrast and harms readability.
  revised_text: E ji alaeze eluigwe tụnyere otu eze, onye mere oriri agbamakwụkwọ maka nwa ya nwoke[a][b].
