  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: ig
  text: E ji alaeze eluigwe tụnyere otu eze, onye mere oriri agbamakwụkwọ maka nwa ya nwoke[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “A pụrụ iji alaeze eluigwe tụnyere.” Ngwaa Grik ahụ pụkwara ịpụta n'ụdị akpaalaokwu ilu a, ọ bụ ezie na ọdịdị ya ebe a pụtara n'ụzọ nkịtị, “e ji ... tụnyere” ma ọ bụ “e mere ka ... yie.”
    reason: lexical_alternative
  - marker: b
    text: N'asụsụ Grik, ọ bụ “agbamakwụkwọ” n'ụdị ọtụtụ; nke a bụ akpaalaokwu na-ezo aka n'emume ma ọ bụ oriri agbamakwụkwọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: E ji ... tụnyere
  rationale: Nke a na-egosipụta aorist passive ahụ n'ụzọ Igbo na-asụ nke ọma, n'etinyeghị echiche modal nke ‘a pụrụ iji ... tụnyere’ nke na-apụtaghị kpọmkwem n'ụdị Grik.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: alaeze eluigwe
  rationale: Nke a bụ okwu Matiu ji eme ihe mgbe niile; ọ na-edobe ‘eluigwe’ kama ịgbanwe ya ka ọ bụrụ ‘Chineke,’ ma nwee ike ịgụnye ma ọchịchị ma ógbè alaeze.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: otu eze bụ́ mmadụ
  rationale: Nke a na-edobe ma ἄνθρωπος ma βασιλεύς dị n'okwu Grik ahụ, ma na-ada nke ọma n'Igbo karịa ịtụgharị ha dịka aha abụọ kewara ekewa.
- source_word: ὅστις
  choice: onye
  rationale: ‘Onye’ na-ewebata ihe eze ahụ mere n'ụzọ dị mfe, na-enweghị ịgbakwụnye nkwusi ike na-adịghị mkpa.
- source_word: ἐποίησεν
  choice: mere
  rationale: Mgbe ọ na γάμους nọ, ποιέω pụtara ịhazi ma ọ bụ ime emume agbamakwụkwọ; ‘mere oriri’ bụ okwu Igbo doro anya ma dị mma.
- source_word: γάμους
  choice: oriri agbamakwụkwọ
  rationale: Ọtụtụ γάμους bụ akpaalaokwu maka emume ma ọ bụ oriri agbamakwụkwọ, ọ bụghị naanị njikọ alụmdi na nwunye.
- source_word: τῷ υἱῷ αὐτοῦ
  choice: maka nwa ya nwoke
  rationale: 'Nke a na-edobe dative nke uru/ọdịmma: e mere emume ahụ maka nwa eze ahụ, ebe γάμους egosilarị na ọ bụ agbamakwụkwọ.'
theological_decisions:
- issue: Ụdị okwu ‘alaeze eluigwe’
  choice: Alaeze eluigwe
  alternative: Alaeze Chineke; ọchịchị eluigwe
  rationale: A na-edobe okwu pụrụ iche Matiu ji mee ihe, n'agbanweghị ya ka ọ bụrụ nkọwa okpukpe nke ga-emechi nghọta nwere ike ịbụ ọchịchị ma ọ bụ ógbè alaeze.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Otu eze bụ́ mmadụ’ na-edobe nkọwa Grik ἀνθρώπῳ βασιλεῖ; akara ụda dị na ‘bụ́’ na-enyere aka igosi na ọ bụ njikọ nkọwa.
