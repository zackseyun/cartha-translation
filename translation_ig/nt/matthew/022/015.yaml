  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: ig
  text: Mgbe ahụ, ndị Farisii gara gbaa izu banyere otú ha ga-esi jiri okwu ya maa ya n’ọnyà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha kpara nkata otú ha ga-esi jiri ihe ọ ga-ekwu maa ya n’ọnyà.”
    reason: 'Nhọrọ ọzọ: “kpara nkata” na-egosi συμβούλιον ἔλαβον n’ụzọ nwere iro karịa, ebe “ihe ọ ga-ekwu” na-akọwa ἐν λόγῳ.'
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi usoro oge n’akụkọ ahụ n’ụzọ doro anya ma kwekọọ n’Igbo nkịtị.
- source_word: πορευθέντες
  choice: gara
  rationale: Ọ bụ participle aorist nke na-ebute ngwaa bụ isi; ‘gara’ na-egosipụta mmegharị ahụ n’enweghị ntụgharị siri ike na-ekwekọghị n’usoro Igbo.
- source_word: οἱ Φαρισαῖοι
  choice: ndị Farisii
  rationale: Nke a bụ aha a na-ejikarị akpọ otu okpukpe ahụ n’Igbo.
- source_word: συμβούλιον ἔλαβον
  choice: gbaa izu
  rationale: Akpaalaokwu Igbo a na-egosi na ha gbakọrọ ọnụ tụlee ma hazie ihe ha ga-eme; ebumnuche ọjọọ ha pụtara ìhè n’ahịrịokwu na-esochi ya.
- source_word: ὅπως
  choice: otu ha ga-esi
  rationale: N’ebe a, ọ na-ewebata ihe ha chọrọ ịhazi na ụzọ ha ga-esi mee ya, ma na-echekwa echiche nke ebumnuche.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs dịka onye a chọrọ imata n’ọnyà.
- source_word: παγιδεύσωσιν
  choice: maa ya n’ọnyà
  rationale: Ọ na-echekwa ihe atụ nke ijide mmadụ n’ọnyà ma na-egosipụta ebumnuche iro ahụ n’Igbo doro anya.
- source_word: ἐν λόγῳ
  choice: jiri okwu ọnụ ya
  rationale: λόγος n’ebe a bụ okwu mmadụ kwuru; ntụgharị a na-egosi na ha chọrọ iji okwu si n’ọnụ ya jide ya, ebe ihe e ji ‘ya’ mee ka o doo anya sitere n’ọnọdụ okwu ahụ.
theological_decisions:
- issue: Ogo iro e kwesịrị itinye na συμβούλιον ἔλαβον
  choice: A sụgharịrị ya dịka ‘gbaa izu,’ okwu nke na-elekwasị anya n’ịtụkọ uche na ịhazi ihe; ahịrịokwu ebumnuche ahụ gosipụtara nzube ọjọọ ha.
  alternative: A pụrụ ịsị ‘kpara nkata,’ nke na-etinye iro ahụ kpọmkwem n’akpaalaokwu mbụ.
  rationale: Ederede Grik na-eme ka ebumnuche iro doo anya site na παγιδεύσωσιν. Ya mere, ọ ka mma ịghara itinye ike iro niile n’ime συμβούλιον ἔλαβον n’onwe ya, ma ka ahịrịokwu dum kwuo ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. ‘Gbaa izu’ na ‘maa ya n’ọnyà’ bụ akpaalaokwu ndị na-ada n’ụzọ ebumpụta ụwa ma na-echekwa echiche nke ndụmọdụ na ọnyà dị n’ederede Grik.
