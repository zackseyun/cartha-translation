  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: ig
  text: na-ekwu, sị, “Gịnị ka unu chere banyere Mesaịa ahụ[a]? Ọ bụ nwa onye?” Ha sịrị ya, “Nwa Devid.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” Okwu Grik bụ Χριστός (Christos), nke e ji mee aha ọkwá Mesaịa n'ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: Ọ sịrị ha
  rationale: Partisịpụ a na-ebute okwu Jizọs. N'Igbo, ahịrịokwu nwere ngwaa zuru ezu bụ ụzọ dị mfe ma bụrụkwa nke sitere n'okike; ‘ha’ sitere n'ọnọdụ okwu ahụ.
- source_word: Τί ὑμῖν δοκεῖ
  choice: Gịnị ka unu chere
  rationale: Nke a bụ ajụjụ banyere echiche ma ọ bụ mkpebi ndị a na-agwa okwu; nsụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: περὶ τοῦ χριστοῦ
  choice: banyere Mesaịa
  rationale: Χριστός nọ ebe a dị ka aha ọkwá nke onye ahụ ndị Juu na-atụ anya ya, ya mere ‘Mesaịa’ na-egosipụta ọrụ ya karịa iji ‘Kraịst’ dị ka aha.
- source_word: τίνος υἱός ἐστιν
  choice: Ọ bụ nwa onye?
  rationale: Nke a na-edobe ajụjụ gbasara agbụrụ ma ọ bụ usoro ọmụmụ, n'ụdị Igbo sitere n'okike.
- source_word: λέγουσιν αὐτῷ
  choice: Ha sịrị ya
  rationale: A sụgharịrị present akụkọ Grik dị ka oge gara aga, nke kwekọrọ n'usoro akụkọ Igbo.
- source_word: Τοῦ Δαυίδ
  choice: Nwa Devid
  rationale: Azịza Grik bụ genitive dị mkpirikpi nke hapụrụ ‘nwa’ n'ihi na a kpọtụrụ ya n'ajụjụ ahụ. Igbo chọrọ iweghachi ‘nwa’ ka azịza ahụ doo anya ma bụrụ nke sitere n'okike.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N'ebe a, okwu ahụ bụ aha ọkwá n'ime mkparịta ụka gbasara onye e kwere ná nkwa, ọ bụghị aha onwe onye. Ihe odide ala peeji na-echekwa nsụgharị ọzọ.
- issue: Ihe ‘nwa Devid’ pụtara
  choice: E debere ya dị ka azịza gbasara usoro ọmụmụ
  alternative: Ịkọwa ya ozugbo dị ka eze ga-anọchi Devid
  rationale: Ihe odide ahụ n'onwe ya na-ekwu naanị banyere ịbụ nwa Devid; ịgbakwunye nkọwa gbasara ọchịchị ga-edozi ihe ọ pụtara karịa ka isi mmalite mere.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘unu’ n'ihi na Jizọs na-agwa ọtụtụ mmadụ okwu. Akara [a] dị ozugbo n'akụkụ ‘Mesaịa’ dịka achọrọ.
