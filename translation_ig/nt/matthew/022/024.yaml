id: MAT.22.24
reference: Matthew 22:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς εἶπεν· Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα, ἐπιγαμβρεύσει ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα αὐτοῦ καὶ ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: ig
  text: na-asị, “Onye Ozizi, Mosis kwuru, ‘Ọ bụrụ na nwoke anwụọ n’enweghị ụmụ, nwanne ya nwoke ga-alụ nwunye ya[a], kpọlitere nwanne ya mkpụrụ.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ zuru ezu karị, “nwanne ya nwoke ga-arụ ọrụ nwanne di site n’ịlụ nwanyị ahụ di ya nwụrụ.” Okwu Grik a na-ekwu kpọmkwem banyere alụmdi na nwunye nwanne di; “kpọlitere nwanne ya mkpụrụ” pụtara ịmụ ụmụ a ga-agụ nye nwanne nwoke ahụ nwụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Ọ bụ okwu a kpọrọ Jizọs ozugbo dị ka onye na-ezi ihe; nke a bụ Igbo doro anya ma dị ugwu.
- source_word: Ἐάν τις ἀποθάνῃ
  choice: Ọ bụrụ na nwoke anwụọ
  rationale: Ọnọdụ iwu a na-ekwu maka nwoke, dị ka usoro okwu na ọrụ nwanne nwoke so gosi.
- source_word: μὴ ἔχων τέκνα
  choice: n’enweghị ụmụ
  rationale: τέκνα pụtara ụmụ n’ozuzu, ọ bụghị naanị ụmụ nwoke; okwu a dị nkenke ma bụrụ Igbo e ji eme ihe ugbu a.
- source_word: ἐπιγαμβρεύσει
  choice: ga-alụ nwunye ya
  rationale: Ngwaa ahụ na-ekwu kpọmkwem banyere ịlụ nwanyị di ya nwụrụ n’usoro alụmdi na nwunye nke nwanne di; isi ederede na-enye ihe ọ pụtara n'ụzọ eke, ebe nkọwa ala peeji na-akọwa ya nke ọma.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: nwunye ya
  rationale: Nnọchiaha ahụ na-ezo aka n’ebe nwunye nwoke ahụ nwụrụ nọ; a hapụrụ usoro kpọmkwem nke Grik.
- source_word: ἀναστήσει σπέρμα
  choice: mụtakwa ụmụ a ga-agụ dị ka ụmụ
  rationale: Nkebiokwu a pụtara ịmụ ụmụ ndị a ga-ewere dịka ụmụ ma ọ bụ ụmụ ọmụmụ nke nwoke ahụ nwụrụ; nsụgharị a na-eme ka akparamàgwà iwu ahụ doo onye Igbo anya.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: nwanne ya ahụ
  rationale: Dative ahụ na-egosi na a na-agụ ụmụ ahụ nye nwanne nwoke ahụ nwụrụ; ‘dị ka ụmụ nwanne ya ahụ’ na-egosipụta mmekọrịta a n'ụzọ doro anya.
theological_decisions:
- issue: Ichekwa ụdị nwoke e ji kọwaa iwu ahụ
  choice: Jiri ‘nwoke’ na ‘nwanne ya nwoke’
  alternative: Jiri okwu na-akọwaghị nwoke ma ọ bụ nwanyị
  rationale: Iwu alụmdi na nwunye nwanne di a na-akọwa ọrụ ezinụlọ nwoke kpọmkwem; ya mere, nsụgharị ahụ echekwaghị ya ka ọ ghọọ okwu na-enweghị oke nwoke na nwanyị.
- issue: Ihe ‘ịkpọlite mkpụrụ nye nwanne ya’ pụtara
  choice: Kọwaa ya dị ka ịmụ ụmụ a ga-agụ dịka ụmụ nwanne ahụ nwụrụ
  alternative: Sụgharịa ya n'ụzọ nkịtị dịka ‘kpọlitere ya mkpụrụ’
  rationale: Nkebiokwu Grik bụ akpaala okwu iwu gbasara ụmụ ọmụmụ a ga-agụ nye nwoke ahụ nwụrụ. Nhọrọ a na-ebufe ihe ọ pụtara n’Igbo doro anya n’enweghị ịgbakwunye ozizi otu ụka.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. A sụgharịrị okwu iwu pụrụ iche n'ụzọ ga-eme ka isi ya doo anya, tinyekwa nkọwa ala peeji iji chekwaa nkọwa teknụzụ nke ἐπιγαμβρεύσει.
