  to: na-asị, “Onye Ozizi, Mosis kwuru, ‘Ọ bụrụ na nwoke anwụọ n’enweghị ụmụ, nwanne ya nwoke ga-alụ nwunye ya[a], kpọlitere nwanne ya mkpụrụ.’”
  rationale: A dochiri nkọwa dị n’isi ederede nke nwere ike ịpụta “ụmụ nwanne ya” anya—ya bụ, ụmụnne/siblings’ children—site n’akpaala okwu iwu Igbo “kpọlitere nwanne ya mkpụrụ.” Nke a na-echekwa asụsụ idiomatik nke Grik ma footnote na-akọwa n’ụzọ doro anya na ụmụ ahụ bụ ndị a ga-agụ nye nwanne nwoke ahụ nwụrụ.
