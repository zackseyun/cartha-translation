review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the legal scenario, but “mụtakwa ụmụ a ga-agụ dị ka ụmụ nwanne ya ahụ” is misleading: in ordinary Igbo, “ụmụ nwanne ya” denotes his sibling’s children, rather than offspring raised on behalf of the deceased brother. The Greek ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ is better retained with the established legal idiom “kpọlitere ... mkpụrụ,” with a note explaining it.'
  naturalness: The revised wording is clear, dignified Standard Igbo, and retains the concise legal/register character of the citation. “Nwunye ya” naturally refers back to the man who died in the immediate context.
  terminology: “Onye Ozizi,” “Mosis,” “nwanne ya nwoke,” and “kpọlitere ... mkpụrụ” are appropriate. The footnote accurately identifies the levirate-marriage sense and explains the legal idiom without imposing theological interpretation.
  issues:
  - severity: high
    issue: The phrase “ụmụ a ga-agụ dị ka ụmụ nwanne ya ahụ” is relationally ambiguous and can mean the brother’s children.
    rationale: It does not naturally express that offspring are raised/credited for the deceased brother, and it risks changing the legal sense of ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ.
  - severity: low
    issue: The footnote’s paraphrase can be made more idiomatic.
    rationale: “ọrụ dịịrị nwanne di” is understandable, but “ọrụ nwanne di” is cleaner Standard Igbo in this compact explanatory note.
