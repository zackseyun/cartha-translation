  text: ὕστερον δὲ πάντων ἀπέθανεν ⸀ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/027.yaml
  text: Last of all[a], the woman died.
translation:
  language: ig
  text: N’ikpeazụ, mgbe ha niile nwụsịrị[a], nwaanyị ahụ nwụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsị, “N’ikpeazụ, nwaanyị ahụ nwụrụ.” N’asụsụ Grik: “Mgbe e mesịrị/n’ikpeazụ, mgbe ha niile nwụsịrị, nwaanyị ahụ nwụrụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: N’ikpeazụ
  rationale: N’usoro okwu a ya na πάντων, ọ na-egosi ihe mere n’ikpeazụ n’usoro ihe ndị a kọrọ.
- source_word: δὲ
  choice: (etinyere njikọ ya n’usoro ahịrịokwu)
  rationale: δέ bụ njikọ dị nro; n’Igbo, a na-egosipụta ọrụ ya nke ọma site n’ịga n’ihu n’ahịrịokwu ahụ n’enweghị itinye ‘ma’ ma ọ bụ ‘mgbe ahụ’ n’ụzọ ga-eme ka ihe ọ pụtara sie ike karịa Grik.
- source_word: πάντων
  choice: n’ime ha niile
  rationale: Ọ na-ezo aka n’ụmụnne ndị a kpọtụrụ aha tupu ebe a ma soro ὕστερον mepụta echiche nke ‘n’ikpeazụ n’ime ha niile.’
- source_word: ἀπέθανεν
  choice: nwụrụ
  rationale: Ọ bụ okwu doro anya, kwụ ọtọ maka ọnwụ ahụ, n’enweghị okwu mgbagharị.
- source_word: ἡ γυνή
  choice: nwaanyị ahụ
  rationale: γυνή nwere ike ịpụta nwaanyị ma ọ bụ nwunye; ‘nwaanyị ahụ’ na-edobe okwu Grik ma ghara ime ka a hụ ya naanị dị ka nwunye otu nwoke n’akụkọ metụtara ọtụtụ di.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù mee ihe. ‘N’ikpeazụ n’ime ha niile’ na-echekwa usoro na njikọ nke ὕστερον πάντων; akara [a] dị n’ederede isi.
