  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: ig
  text: O wee ziga ndị ohu ya ka ha kpọọ ndị a kpọrọ òkù ịbịa n’oriri agbamakwụkwọ[c][b][a], ma ha achọghị ịbịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-ejere ya ozi.” Okwu Grik a nwere ike ịpụta ndị ohu ma ọ bụ ndị na-eje ozi.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ndị a kpọrọ.” N’ebe a, ọ pụtara ndị a kpọrọ òkù tupu mgbe ahụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “emume agbamakwụkwọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: wee ziga
  rationale: Aorist ἀποστέλλω pụtara iziga; “wee ziga” na-ejikọta omume a nke ọma na akụkọ na-aga n’ihu.
- source_word: δούλους
  choice: ndị ohu
  rationale: δοῦλος nwere ike ịpụta ohu ma ọ bụ onye na-eje ozi. “Ndị ohu” bụ okwu Igbo doro anya nke na-echekwa ọnọdụ ha n’okpuru onye nwe ha; ọrụ ha dị ka ndị ozi pụtakwara ìhè site n’omume iziga ha.
- source_word: καλέσαι
  choice: ka ha gaa kpọọ
  rationale: Infinitive a na-egosi ebumnuche iziga ha. “Kpọọ” na-echekwa njikọ okwu ya na κεκλημένους, ebe “gaa” na-eme ka okwu Igbo bụrụ nke eke.
- source_word: κεκλημένους
  choice: ndị a kpọrọ òkù
  rationale: Perfect passive participle na-ezo aka n’ebe ndị a kpọrọ òkù tupu mgbe ahụ nọ. Okwu a doro anya n’ọnọdụ oriri ma na-echekwa nkwughachi mgbọrọgwụ καλέω site na “kpọọ/a kpọrọ.”
- source_word: εἰς τοὺς γάμους
  choice: ịbịa n’oriri agbamakwụkwọ
  rationale: N’ebe a γάμοι na-ezo aka n’emume ma ọ bụ oriri agbamakwụkwọ, ọ bụghị naanị alụmdi na nwunye ahụ. “Oriri agbamakwụkwọ” na-enye ọnọdụ ahụ n’Igbo nkịtị.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: ha achọghị ịbịa
  rationale: ἤθελον na infinitive na-egosi ọchịchọ ma ọ bụ mkpebi mmadụ. “Ha achọghị ịbịa” na-echekwa nke a n’enweghị ime ka ọ sie ike dịka “ha jụrụ ịbịa.”
theological_decisions:
- issue: Nsụgharị δοῦλος n’ilu eze a
  choice: ndị ohu
  alternative: ndị na-ejere ya ozi
  rationale: Ọ bụ ezie na akụkọ ahụ lekwasịrị anya n’ọrụ ha dị ka ndị e zigara, δοῦλος nwekwara echiche nke ịbụ onye nọ n’okpuru onye nwe ya. “Ndị ohu” na-echekwa echiche ahụ n’Igbo, ebe nkọwa ala peeji na-egosi ụzọ ọzọ dị nro.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E chekwara nkwughachi mgbọrọgwụ καλέω site na “kpọọ” na “a kpọrọ,” ma e jiri “ha achọghị ịbịa” chekwaa isi ihe banyere ọchịchọ ha n’enweghị ịgbakwunye ike nke okwu “jụrụ.”
