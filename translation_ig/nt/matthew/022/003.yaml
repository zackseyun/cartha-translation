review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the king's sending, the previously invited guests, the wedding feast, and their unwillingness to come. However, “ka ha gaa kpọọ” adds the motion ‘go,’ which is not expressed by καλέσαι. The purpose infinitive is adequately rendered by “ka ha kpọọ.”
  naturalness: The revised wording is natural Standard Igbo and retains the narrative register. “Ndị a kpọrọ òkù” and “oriri agbamakwụkwọ” are clear and idiomatic in this context.
  terminology: “Ndị ohu” is a defensible rendering of δούλους, with a suitable alternative in the footnote. The repeated call-word family is retained in “kpọọ” / “a kpọrọ òkù.” “Ha achọghị ịbịa” appropriately represents unwillingness without strengthening it to an explicit refusal.
  issues:
  - severity: low
    issue: The phrase “gaa” adds an unexpressed action.
    rationale: καὶ ἀπέστειλεν ... καλέσαι means that he sent his servants ‘to call’; it does not separately state that they went. Removing “gaa” preserves the source wording more closely without making the Igbo unnatural.
  revised_text: O wee ziga ndị ohu ya ka ha kpọọ ndị a kpọrọ òkù ịbịa n’oriri agbamakwụkwọ[c][b][a], ma ha achọghị ịbịa.
