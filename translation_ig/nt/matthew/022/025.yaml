id: MAT.22.25
reference: Matthew 22:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: ig
  text: E nwere ụmụnne nwoke asaa n’etiti anyị. Onye mbụ lụrụ nwanyị wee nwụọ; ebe ọ na-enweghị nwa[a], ọ hapụrụ nwunye ya nye nwanne ya nwoke[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “n’enweghị mkpụrụ.” N’ebe a, “mkpụrụ” pụtara nwa ma ọ bụ ụmụ ga-anọchi mmadụ.
    reason: lexical_alternative
  - marker: b
    text: Nke a na-ezo aka n’omenala nke nwanne nwoke onye nwụrụ anwụ ịlụ nwanyị di ya nwụrụ, ka e wee mụta nwa n’aha onye ahụ nwụrụ anwụ; lee Diuterọnọmi 25:5.
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: n’etiti anyị
  rationale: Nke a na-egosi na ụmụnne ndị ahụ nọ n’etiti ma ọ bụ n’ime obodo ndị na-ekwu okwu; “n’etiti anyị” bụ Igbo doro anya ma dịkwa n’usoro okwu ahụ.
- source_word: ἑπτὰ ἀδελφοί
  choice: ụmụnne nwoke asaa
  rationale: N’ọnọdụ alụmdi na nwunye onye ikwu a, ἀδελφοί pụtara ụmụ nwoke si n’otu nne na nna, ya mere a kọwara okike ha hoo haa.
- source_word: ὁ πρῶτος
  choice: onye mbụ
  rationale: πρῶτος na-egosi onye mbụ n’usoro ihe mere, ọ bụghị na ọ bụ ya kacha okenye.
- source_word: γήμας
  choice: lụrụ nwanyị
  rationale: Nke a na-egosi na nwoke ahụ batara n’alụmdi na nwunye tupu ọ nwụọ; okwu Igbo a bụ nke nkịtị ma doo anya.
- source_word: ἐτελεύτησεν
  choice: nwụọkwa
  rationale: τελευτάω pụtara ịnwụ; a họọrọ okwu kwụ ọtọ nke na-adịghị eji okwu mgbagwoju anya dochie ọnwụ.
- source_word: μὴ ἔχων σπέρμα
  choice: n’enweghị nwa
  rationale: σπέρμα bụ “mkpụrụ” n’ụzọ nkịtị, ma n’ọnọdụ ezinụlọ na iwu a ọ pụtara nwa ma ọ bụ ụmụ ga-anọchi mmadụ. “N’enweghị nwa” bụ Igbo dị mfe ma na-edebe isi echiche ahụ.
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: hapụ nwunye ya
  rationale: N’ebe a ἀφίημι pụtara na nwunye ya nọgidere ndụ mgbe ọ nwụrụ, ọ bụghị na ọ gbara ya alụkwaghịm ma ọ bụ gbahapụ ya.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: nye nwanne ya nwoke
  rationale: Dative ahụ na-egosi nwanne nwoke onye nwụrụ anwụ dịka onye a hapụrụ nwanyị ahụ nye; ntụgharị a edebeghị mgbakwunye “ka ọ lụọ ya” n’ahịrị bụ isi.
theological_decisions:
- issue: Ma a ga-akọwa omenala alụmdi na nwunye onye ikwu ahụ hoo haa n’ahịrị bụ isi
  choice: 'E debere ya n’ụzọ Greek si kwuo ya: “hapụ nwunye ya nye nwanne ya nwoke.”'
  alternative: “hapụ nwunye ya ka nwanne ya nwoke lụọ ya”
  rationale: Diuterọnọmi 25:5 na-akọwa omenala iwu a, ma Greek nke amaokwu a ekwughị “ka ọ lụọ ya” hoo haa. Ya mere, e debere ihe ahụ a na-aghọta n’okpuru okwu ahụ n’ihe odide ụkwụ kama ịgbakwunye ya n’ahịrị bụ isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrị ahụ anaghị etinye okwu oge dịka “ugbu a,” n’ihi na Greek enweghị okwu oge dị otú ahụ. A doziri akara ihe odide ụkwụ ka [a] soro “n’enweghị nwa,” ebe nkọwa mkpụrụ kwesịrị ịdị, ka [b] soro “nwanne ya nwoke,” ebe nkọwa omenala alụmdi na nwunye onye ikwu kwesịrị ịdị.
