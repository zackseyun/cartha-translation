revisions:
- from: E nwere ụmụnne nwoke asaa n’etiti anyị. Onye mbụ lụrụ nwanyị, nwụọkwa n’enweghị nwa[a], hapụ nwunye ya nye nwanne ya nwoke[b].
  to: E nwere ụmụnne nwoke asaa n’etiti anyị. Onye mbụ lụrụ nwanyị wee nwụọ; ebe ọ na-enweghị nwa[a], ọ hapụrụ nwunye ya nye nwanne ya nwoke[b].
  rationale: The revision smooths the event sequence in modern Standard Igbo without changing the source’s concise wording. It retains the implicit levirate arrangement in the main text and corrects the explanatory footnote so that it accurately describes offspring being raised for the deceased rather than implying that the surviving brother bears the child.
  reviewer_model: gpt-5.6-terra
