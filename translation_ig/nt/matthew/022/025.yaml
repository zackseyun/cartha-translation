    text: Nke a na-ezo aka n’omenala nke nwanne nwoke onye nwụrụ anwụ ịlụ nwanyị di ya nwụrụ, ka e wee mụta nwa n’aha onye ahụ nwụrụ anwụ; lee Diuterọnọmi 25:5.
    reason: cultural_note
  revision_rationale: The revision smooths the event sequence in modern Standard Igbo without changing the source’s concise wording. It retains the implicit levirate arrangement in the main text and corrects the explanatory footnote so that it accurately describes offspring being raised for the deceased rather than implying that the surviving brother bears the child.
