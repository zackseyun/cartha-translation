revisions:
- from: Ha wee zigara ya ndị na-eso ụzọ ha na ndị òtù Herọd. Ha sịrị ya, “Onye Ozizi, anyị maara na ị bụ onye eziokwu, na ị na-akụzikwa ụzọ Chineke n’eziokwu. Ị naghị eche banyere onye ọ bụla[a], n’ihi na ị naghị ele mmadụ anya n’ihu[b].”
  to: Ha wee zigara ya ndị na-eso ụzọ ha na ndị Herọd. Ha sịrị ya, “Onye Ozizi, anyị maara na ị bụ onye eziokwu, na ị na-akụzikwa ụzọ Chineke n’eziokwu. Ị naghị echegbu onwe gị banyere onye ọ bụla[a], n’ihi na ị naghị ele mmadụ anya n’ihu[b].”
  rationale: The revision retains the source’s structure, narrative past, and deliberate pairing of the two expressions about impartiality. It replaces a potentially over-specific group description and a potentially misleading expression of indifference with standard, natural Igbo while preserving the source meaning and keeping explanatory footnotes anchored to the relevant phrases.
