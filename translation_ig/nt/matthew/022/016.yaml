id: MAT.22.16
reference: Matthew 22:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: ig
  text: Ha wee zigara ya ndị na-eso ụzọ ha na ndị Herọd. Ha sịrị ya, “Onye Ozizi, anyị maara na ị bụ onye eziokwu, na ị na-akụzikwa ụzọ Chineke n’eziokwu. Ị naghị echegbu onwe gị banyere onye ọ bụla[a], n’ihi na ị naghị ele mmadụ anya n’ihu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ebe a, ihe ọ pụtara bụ na ọkwa mmadụ ma ọ bụ ihe mmadụ chere adịghị eme ka ọ gbanwee eziokwu; ọ pụtaghị na ọ naghị ahụ mmadụ n’anya.
    reason: clarification_of_idiom
  - marker: b
    text: Ya bụ, ị naghị ele mmadụ anya iche ma ọ bụ kpee ikpe site n’ọkwa na ọdịdị ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: Ha wee zigara
  rationale: E ji oge gara aga nke akụkọ Igbo tụgharịa present tense akụkọ Grik, ebe ‘wee’ na-egosi nzọụkwụ na-aga n’ihu n’akụkọ ahụ.
- source_word: τοὺς μαθητὰς αὐτῶν
  choice: ndị na-eso ụzọ ha
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị na-amụta ihe n’aka onye ma na-eso ya.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: na ndị òtù Herọd
  rationale: Ọ na-egosi ndị e jikọtara na Herọd n’enweghị ịkọwapụta kpọmkwem ụdị njikọ ndọrọ ndọrọ ọchịchị ha karịa ihe okwu Grik kwuru.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Ọ bụ okwu nkwanye ùgwù, nke doro anya, maka onye na-akụzi ihe.
- source_word: ἀληθὴς εἶ
  choice: ị bụ onye eziokwu
  rationale: Ọ na-akọwa agwa Jizọs dị ka onye eziokwu, ọ bụghị nanị na otu okwu o kwuru bụ eziokwu.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: ụzọ Chineke
  rationale: E debere ihe oyiyi nke ‘ụzọ’ nke nwere ike ịpụta uche Chineke na ụzọ ndụ ọ chọrọ.
- source_word: ἐν ἀληθείᾳ
  choice: n’eziokwu
  rationale: Ọ na-edobe nkwughachi na nkwusi ike nke okwu Grik banyere eziokwu.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: Ị naghị eche banyere onye ọ bụla
  rationale: Nke a nọ nso n’usoro okwu Grik; ihe e bu n’obi n’ọnọdụ a bụ na ọkwa mmadụ ma ọ bụ echiche ya adịghị eme ka onye ozizi gbanwee okwu ya, ọ bụghị na ọ naghị ahụ mmadụ n’anya. A kọwara nke ahụ n’ala peeji.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: n’ihi na ị naghị ele mmadụ anya n’ihu
  rationale: 'Akpaalaokwu Igbo a na-ekwupụta nke ọma echiche akpaalaokwu Grik: ịghara ile mmadụ anya iche ma ọ bụ kwado ya n’ihi ọkwa ya.'
theological_decisions:
- issue: Ma okwu banyere ‘ịghara iche banyere onye ọ bụla’ ọ pụtara enweghị ịhụnanya ma ọ bụ enweghị ele mmadụ anya iche
  choice: E debere okwu dị nso na Grik n’isi amaokwu, ma kọwaa na ọ pụtara na mmadụ apụghị ime ka Jizọs gbanwee eziokwu n’ihi ọkwa ya ma ọ bụ echiche ya.
  alternative: Ị naghị ekwe ka echiche onye ọ bụla metụta gị.
  rationale: Nhọrọ ahụ doro anya karịa, ma ọ na-etinye ‘echiche’ n’ime isi amaokwu ebe okwu Grik ekwughị ya kpọmkwem. Ihe odide na ala peeji na-echekwa ma usoro okwu ahụ ma ihe ọ pụtara n’ọnọdụ a.
- issue: Akpaalaokwu banyere ile mmadụ anya n’ihu
  choice: ị naghị ele mmadụ anya n’ihu
  alternative: ị naghị ele mmadụ anya iche; ị naghị ekpe ikpe site n’ọdịdị mmadụ
  rationale: Akpaalaokwu Igbo a dị ndụ ma kwekọọ n’echiche Grik nke enweghị ịkpa ókè n’ihi ọkwa ma ọ bụ ọdịdị mmadụ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. ‘Ha wee zigara’ na-eme ka akụkọ ahụ na-aga n’ihu n’ụzọ e ji akọ akụkọ n’Igbo; e kewara okwu mmeghe ahụ ụzọ abụọ ka ọ na-ada nke ọma mgbe a na-agụ ya n’olu.
