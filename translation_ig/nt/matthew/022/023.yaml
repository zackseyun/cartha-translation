    issue: The footnote repeats the wording already used in the main text and therefore does not provide a genuine lexical alternative.
    rationale: The main text already has “ndị na-ekwu na mbilite n’ọnwụ adịghị,” while the note gives virtually the same construction. Recast the main text with the participial form and retain the appositional form as the alternative, corresponding to the English audit trail.
  revised_text: N’ụbọchị ahụ, ndị Sadusii bịakwutere ya, na-ekwu na mbilite n’ọnwụ adịghị, wee jụọ ya ajụjụ.[a]
