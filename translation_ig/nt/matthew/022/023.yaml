review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal setting, the Sadducees' approach to Jesus, their denial of resurrection, and their questioning of him. The appositional wording rightly presents the denial as identifying information about the Sadducees rather than as an endorsed claim.
  naturalness: The verse is clear and idiomatic Standard Igbo. The em dashes are understandable, but comma-delimited apposition is more conventional and reads more smoothly in a Bible-text register.
  terminology: “ndị Sadusii” and “mbilite n’ọnwụ” are appropriate standard renderings. “jụọ ya ajụjụ” naturally represents the verb of questioning without overstating its force.
  issues:
