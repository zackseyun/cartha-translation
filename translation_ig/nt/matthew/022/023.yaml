  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: ig
  text: N’ụbọchị ahụ, ndị Sadusii bịakwutere ya, na-ekwu na mbilite n’ọnwụ adịghị, wee jụọ ya ajụjụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ndị Sadusii, bụ́ ndị na-ekwu na mbilite n’ọnwụ adịghị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: N’ụbọchị ahụ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji ekwu oge, na-edobe ntụaka okwu Grik ahụ n’ụbọchị ahụ kpọmkwem.
- source_word: προσῆλθον αὐτῷ
  choice: bịakwutere ya
  rationale: “Bịakwutere ya” na-egosi na ha bịara nso n’ebe Jizọs nọ, ma na-ada nke ọma n’akụkọ Igbo.
- source_word: Σαδδουκαῖοι
  choice: ndị Sadusii
  rationale: A tụgharịrị aha òtù ndị Juu a n’ụdị a na-amata nke ọma n’Igbo, na-enweghị ịgbakwụnye nkọwa nke òtù ahụ na-adịghị n’amaokwu.
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: ndị na-ekwu na mbilite n’ọnwụ adịghị
  rationale: Nkebi okwu a na-egosi nkwenkwe e ji mara ndị Sadusii. Nhazi a doro anya n’Igbo ma na-edobe njikọ participle Grik na aha òtù ahụ.
- source_word: ἀνάστασιν
  choice: mbilite n’ọnwụ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ἀνάστασις, ya bụ isi n’ọnwụ bilie ọzọ.
- source_word: ἐπηρώτησαν αὐτόν
  choice: wee jụọ ya ajụjụ
  rationale: Nke a na-egosi na ha jụrụ Jizọs ajụjụ; “wee” na-ejikọta omume ahụ na ọbịbịa ha n’ụzọ akụkọ Igbo na-aga nke ọma.
theological_decisions:
- issue: Otú e si kọwaa nkwenye ndị Sadusii banyere mbilite n’ọnwụ
  choice: ndị na-ekwu na mbilite n’ọnwụ adịghị
  alternative: na-ekwu na mbilite n’ọnwụ adịghị
  rationale: Nhọrọ a na-ewere λέγοντες dị ka nkebi okwu na-akọwa ndị Sadusii, dị ka nhazi Grik nwere ike isi pụta. Ọ na-akọ naanị nkwenye ha, ọ naghị akwado ya ma ọ bụ tinye nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugwu ma dị mfe nghọta dee ya. Akara ogologo ahịrị na-ekewa nkọwa gbasara nkwenye ndị Sadusii ka isi ahịrịokwu ahụ doo anya; akara ntụaka [a] dị n’ebe okwu ọzọ ọ na-akọwa nọ.
