  rationale: 'The main-text revision corrects the semantic error caused by atụ (‘measure’) and expresses the function of the coin naturally: it is the coin used to pay the tax. The footnote is lightly recast for idiomatic Standard Igbo and continues to mark ‘poll tax’ and ‘census tax’ as alternatives rather than settling a disputed degree of specificity in the main text.'
