  text: ἐπιδείξατέ μοι τὸ νόμισμα τοῦ κήνσου. οἱ δὲ προσήνεγκαν αὐτῷ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/019.yaml
  text: Show me the coin for the tax[a]. And they brought him a denarius.
translation:
  language: ig
  text: “Gosinụ m mkpụrụ ego a na-eji akwụ ụtụ isi[a].” Ha wee wetara ya otu dinarịọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụtụ isi onye ọ bụla” ma ọ bụ “ụtụ ndekọ ọnụ ọgụgụ”; κῆνσος bụ ụtụ ọchịchị Rom na-anakọta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: Gosịnụ m
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ, nke pụtara ka ha gosi ya ihe ahụ ka o lee ya; nsụgharị a na-echekwa echiche ịhụ ihe dị na ngwaa ahụ.
- source_word: νόμισμα
  choice: mkpụrụ ego
  rationale: Ọ na-ezo aka n'otu mkpụrụ ego a na-eji eme azụmahịa, ọ bụghị ego n'ozuzu ya.
- source_word: τοῦ κήνσου
  choice: e ji atụ ụtụ isi
  rationale: Ọ na-egosi mkpụrụ ego e ji akwụ ụtụ ndị Rom a na-ekwu maka ya. ‘Ụtụ isi’ bụ okwu Igbo doro anya, ebe nkọwa ala peeji na-echekwa nkọwa ndị kapịrị ọnụ karịa.
- source_word: προσήνεγκαν
  choice: wetara
  rationale: N'ọnọdụ akụkọ a, okwu a na-egosi na ha butere mkpụrụ ego ahụ bịara nye ya; ‘wetara’ bụ okwu Igbo dị mfe ma kwekọọ n'omume ahụ.
- source_word: δηνάριον
  choice: otu dinarịọs
  rationale: A hapụrụ aha mkpụrụ ego Rom ahụ dịka aha akụkọ ihe mere eme kama iji aha ego Igbo nke oge a dochie ya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị nsọpụrụ. Akara nkọwa [a] dị n'isiokwu ahụ, aha mkpụrụ ego Rom ka edekwara n'ụdị a na-akpọ ya n'Igbo.
