  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: ig
  text: Ọ dịghịkwa onye nwere ike ịza ya okwu; malite n’ụbọchị ahụ gaa n’ihu, ọ dịghịkwa onye ọ bụla nwere obi ike ịjụ ya ajụjụ ọzọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịza ya otu mkpụrụ okwu.” N’ụzọ nkịtị, Grik kwuru, “ịza ya okwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: ọ dịghị onye
  rationale: Nke a na-egosi na e nweghị onye ọ bụla pụrụ ịza Jizọs; ọ bụkwa ụzọ Igbo nkịtị si kwuo nkwụsi ike zuru ezu.
- source_word: ἐδύνατο
  choice: pụrụ
  rationale: Ọ na-egosi enweghị ike n’oge gara aga, n’enweghị ịgbakwụnye nkọwa ọzọ.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: ịza ya otu mkpụrụ okwu
  rationale: Nke a na-edobe λόγον (‘okwu’) ma na-eme ka akpaalaokwu Grik doo anya n’Igbo dị ugbu a; ‘otu mkpụrụ okwu’ na-egosi na ha enweghị ọbụna ihe nta ha ga-aza.
- source_word: οὐδὲ
  choice: sitekwa ... ọ dịghị
  rationale: Usoro a na-ejikọta nkebiokwu ọjọọ nke abụọ na nke mbụ n’Igbo n'ụzọ na-aga were were.
- source_word: ἐτόλμησέν τις
  choice: ọ dịghị onye ọzọ nwara anwa
  rationale: ‘Nwara anwa’ na-egosipụta echiche nke ịkata obi ma ọ bụ ịnwa ime ihe siri ike nke dị na τολμάω.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: site n’ụbọchị ahụ gaa n’ihu
  rationale: Ọ na-egosi ụbọchị ahụ dịka mmalite nke ọnọdụ gara n’ihu.
- source_word: ἐπερωτῆσαι
  choice: ịjụ ya ajụjụ
  rationale: N’ọnọdụ a, ọ na-ezo aka n’ịtụ Jizọs ajụjụ n’arụmụka, ma ntụgharị ahụ adịghị etinye ebumnuche ọjọọ n’ime okwu ahụ n’onwe ya.
- source_word: οὐκέτι
  choice: ọzọ
  rationale: ‘Ọzọ’ na-egosi na omume ịjụ ya ajụjụ kwụsịrị site n’oge ahụ gaa n’ihu.
theological_decisions:
- issue: Ike akụkọ banyere ịgbachi nkịtị nke ndị na-emegide Jizọs
  choice: E kwuru naanị na ha enweghị ike ịza ya nakwa na site n’ụbọchị ahụ ha anwaghị anwa ịjụ ya ajụjụ ọzọ.
  alternative: Ịgbakwụnye okwu na-akọwa na amamihe ma ọ bụ ikike Jizọs meriri ha.
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi mmeri Jizọs n’arụmụka, ma amaokwu ahụ n’onwe ya ekwughị nkọwa nkà mmụta okpukpe ahụ ozugbo; ya mere ntụgharị ahụ anaghị etinye ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘otu mkpụrụ okwu’ iji debe λόγον na ike nke akpaalaokwu ahụ, ebe ndetu ala peeji na-echekwa ụzọ ọzọ a pụrụ isi ghọta ya.
