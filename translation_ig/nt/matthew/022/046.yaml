revisions:
- from: Ọ dịghịkwa onye pụrụ ịza ya otu mkpụrụ okwu[a], sitekwa n’ụbọchị ahụ gaa n’ihu, ọ dịghị onye ọzọ nwara anwa ịjụ ya ajụjụ.
  to: Ọ dịghịkwa onye nwere ike ịza ya okwu; malite n’ụbọchị ahụ gaa n’ihu, ọ dịghịkwa onye ọ bụla nwere obi ike ịjụ ya ajụjụ ọzọ.[a]
  rationale: 'The revision removes an unwarranted “single” from the main line, renders the Greek idiom naturally as «ịza ya okwu», and replaces the awkward repeated verb with an idiomatic expression for daring. It preserves the source’s twofold point: no one could answer him, and from that day onward no one dared question him further.'
