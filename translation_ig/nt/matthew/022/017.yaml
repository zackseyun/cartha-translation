source:
  edition: SBLGNT
  text: εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: ig
  text: 'Ya mere, gwa anyị ihe i chere: Ò ziri ezi n’iwu inye Siza ụtụ isi, ka ọ bụ na o zighị ezi?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: ihe i chere
  rationale: Ọ bụ ụzọ Igbo dị mfe ma kwekọọ n’ajụjụ banyere echiche onye a na-agwa.
- source_word: ἔξεστιν
  choice: Ò ziri ezi n’iwu
  rationale: Na-egosipụta ajụjụ ma iwu ò kwere omume ahụ, n’enweghị ịkọwa ya dị ka iwu okpukpe ma ọ bụ nke Rom naanị.
- source_word: δοῦναι
  choice: inye
  rationale: Na-edobe ngwaa Grik pụtara ‘inye,’ kama iji ‘ịkwụ’ dochie ya n’agbanyeghị na ụtụ isi ka a na-ekwu maka ya.
- source_word: κῆνσον
  choice: ụtụ isi
  rationale: Na-enye nkọwa doro ndị na-agụ Igbo anya banyere ụtụ a na-atụ mmadụ, na-enweghị itinye nkọwa ogologo n’amaokwu.
- source_word: Καίσαρι
  choice: Siza
  rationale: Aha ọchịchị eze ukwu Rom nke a maara n’asụsụ Igbo.
theological_decisions:
- issue: Ma ἔξεστιν na-ezo kpọmkwem n’iwu Mozis, iwu Rom, ma ọ bụ ihe ziri ezi n’ozuzu ya
  choice: Ò ziri ezi n’iwu
  alternative: Iwu ò kwere
  rationale: Nhọrọ a na-echekwa obosara na esemokwu dị n’ajụjụ ahụ, kama ikpebi otu ụdị iwu e bu n’uche.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, kwanyere ùgwù, ma dị mfe nghọta. E ji ‘Ya mere’ gosipụta οὖν, e jikwa usoro ajụjụ eke n’Igbo mee ka amaokwu ahụ na-aga nke ọma.
