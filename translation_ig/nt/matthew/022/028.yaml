id: MAT.22.28
reference: Matthew 22:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν τῇ ⸂ἀναστάσει οὖν⸃ τίνος τῶν ἑπτὰ ἔσται γυνή; πάντες γὰρ ἔσχον αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: ig
  text: Ya mere, ná mbilite n’ọnwụ, ọ ga-abụ nwunye onye n’ime mmadụ asaa ahụ? N’ihi na ha niile lụrụ ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị, “ha niile nwere ya.” Okwu Grik ahụ ji “nwere ya” mee ihe n’ebe a n’echiche ịlụ nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάσει
  choice: ná mbilite n’ọnwụ
  rationale: Akpaokwu a na-ezo aka kpọmkwem ná mbilite ndị nwụrụ anwụ n’ọdịnihu; ọ na-edobekwa ụdị ọnọdụ/oge nke ἐν na dative.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu ndị Sadusii na-adọpụta n’akụkọ ha, ma bụrụkwa Igbo doro anya n’ajụjụ a.
- source_word: τίνος τῶν ἑπτὰ
  choice: onye n’ime mmadụ asaa ahụ
  rationale: Nke a na-ajụ onye kpọmkwem n’etiti mmadụ asaa ahụ ga-abụ di ya, n’ụzọ na-ada nke ọma n’Igbo.
- source_word: ἔσται γυνή
  choice: ọ ga-abụ nwunye
  rationale: γυνή pụtara ‘nwunye’ n’ebe a n’ihi ọnọdụ alụmdi na nwunye; ἔσται na-egosi ihe ga-eme n’ọdịnihu.
- source_word: πάντες γὰρ
  choice: N’ihi na ha niile
  rationale: γάρ na-enye ihe kpatara ajụjụ ahụ, ebe πάντες na-ezo aka n’ebe mmadụ asaa ahụ niile nọ.
- source_word: ἔσχον αὐτήν
  choice: lụrụ ya
  rationale: Ọ bụ ezie na okwu Grik ahụ bụ n’ụzọ nkịtị ‘nwere ya,’ n’ọnọdụ a ọ bụ akpaokwu na-ezo aka n’ịlụ nwanyị; ‘lụrụ ya’ bụ Igbo ebumpụta ụwa ma doo anya.
theological_decisions:
- issue: Ihe ἀνάστασις pụtara n’ajụjụ ndị Sadusii
  choice: Mbilite ndị nwụrụ anwụ n’ọdịnihu
  alternative: Ndụ mgbe mmadụ nwụsịrị n’ozuzu ya
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi na esemokwu ahụ bụ kpọmkwem banyere mbilite n’ọnwụ. ‘Mbilite n’ọnwụ’ na-echekwa isi okwu ahụ n’agbasaghị ya.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ ‘ná mbilite n’ọnwụ’ iji debe okwu nkà mmụta okpukpe a maara nke ọma, ebe ‘onye n’ime mmadụ asaa ahụ’ na-eme ka njikọ genitive nke Grik doo anya n’Igbo.
