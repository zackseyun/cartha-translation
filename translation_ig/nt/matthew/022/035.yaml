id: MAT.22.35
reference: Matthew 22:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν εἷς ἐξ αὐτῶν νομικὸς πειράζων ⸀αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/035.yaml
  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: ig
  text: Otu n’ime ha, onye ọkà n’Iwu[a], jụrụ ya ajụjụ iji nwalee ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, onye maara Iwu ndị Juu nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Otu n’ime ha
  rationale: N’Igbo, ịmalite ebe a n’enweghị njikọ ‘Na’ na-eme ka akụkọ ahụ gaa nke ọma; njikọ Grik καί bụ njikọ akụkọ dị mfe, a naghị etinye ya n’ike ebe ọ ga-ada ka ihe a sụgharịrị asụgharị.
- source_word: ἐπηρώτησεν
  choice: jụrụ ya ajụjụ
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji eme ihe maka ịjụ mmadụ ihe; ọ na-egosipụta ike ajụjụ nke ngwaa ahụ n’enweghị echiche nke ịgba mmadụ ajụjụ ọnụ n’ike.
- source_word: εἷς ἐξ αὐτῶν
  choice: Otu n’ime ha
  rationale: Nke a bụ okwu Igbo nkịtị nke na-echekwa echiche na onye ahụ so n’ìgwè a kpọtụrụ aha.
- source_word: νομικὸς
  choice: onye ọkà n’Iwu
  rationale: N’ọnọdụ ndị Juu, okwu ahụ na-ezo aka n’onye maara Iwu Mosis nke ọma, ọ bụghị ọkàiwu ụlọikpe n’echiche oge a. E dere ‘Iwu’ n’ukwu iji gosi Iwu ndị Juu a kapịrị ọnụ.
- source_word: πειράζων
  choice: iji nwalee ya
  rationale: Akụkụ-ngwaa ahụ na-egosi ebumnuche ajụjụ ahụ. ‘Iji nwalee ya’ na-echekwa echiche nke nnwale ma ọ bụ nyocha aghụghọ n’enweghị ime ka ọ bụrụ naanị ịnwa ịdaba ya ná mmehie.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs, dị ka ihe a jụrụ na onye a na-anwale.
theological_decisions:
- issue: Ihe πειράζων pụtara n’ihe metụtara Jizọs
  choice: iji nwalee ya
  alternative: iji nwaa ya ọnwụnwa
  rationale: Okwu Grik ahụ nwere ike ịpụta ịnwa, inyocha, ma ọ bụ ịnwale mmadụ ọnwụnwa. N’ebe a, ajụjụ ahụ bụ ule e ji achọ ịmata ma ọ bụ ijide Jizọs n’okwu; nsụgharị a na-echekwa ebumnuche mmegide ahụ ma ghara ịkọwa ya naanị dị ka ịrata ya ime mmehie.
- issue: Ihe νομικός na-ezo aka na ya
  choice: onye ọkà n’Iwu
  alternative: ọkàiwu
  rationale: ‘Ọkàiwu’ nwere ike ime ka onye na-agụ ya chee banyere ọkàiwu ụlọikpe nke oge a. ‘Onye ọkà n’Iwu’ na-egosi n’ụzọ ziri ezi na ọ bụ ọkachamara n’Iwu ndị Juu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma dịkwa nsọpụrụ. E jiri ‘onye ọkà n’Iwu’ zere nghọtahie nke ‘ọkàiwu’ dị ka onye na-arụ ọrụ n’ụlọikpe oge a. Akara nkọwa [a] pụtara ozugbo n’isiokwu.
