  to: Ọ sịrị ya, “Enyi m, olee otu i siri bata ebe a n’enweghị uwe agbamakwụkwọ?” Ma ọ nweghị ike ikwu okwu.[a]
  rationale: The revision replaces an unnatural, overly physical idiom with a natural Standard Igbo expression for the guest’s inability to answer. It preserves the Greek verb’s passive/literal silencing background in the footnote and corrects the footnote’s wording.
