source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: ig
  text: Ọ sịrị ya, “Enyi m, olee otu i siri bata ebe a n’enweghị uwe agbamakwụkwọ?” Ma ọ nweghị ike ikwu okwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “e mere ka ọ gbachie nkịtị.” N’ụzọ kpọmkwem, ngwaa Grik a nwekwara ike ịpụta “ikpu mmadụ ọnụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Enyi m
  rationale: Nke a bụ ụzọ ebumpụta ụwa e si akpọ mmadụ ‘enyi’ n’Igbo. Ọ na-edobe nkwanye ùgwù dị n’okwu ahụ nakwa ụda ịdọ aka ná ntị ya n’etinyeghị iwe ma ọ bụ ịhụnanya karịrị ihe Grik kwuru.
- source_word: πῶς
  choice: olee otu
  rationale: Ọ na-ajụ ụzọ ma ọ bụ ọnọdụ o si bata, ọ bụghị ihe mere o ji bata; ya mere ‘olee otu’ dabara na Grik karịa ‘gịnị mere.’
- source_word: εἰσῆλθες ὧδε
  choice: i siri bata ebe a
  rationale: ‘Bata ebe a’ bụ Igbo dị ugbu a ma doo anya nke na-egosi omume ịbanye n’ebe ahụ nke merela eme.
- source_word: μὴ ἔχων
  choice: n’enweghị
  rationale: Ọ na-egosi na uwe ahụ adịghị ya mgbe ọ batara, ma na-asụ ya n’ụzọ dị mfe ma dị ebumpụta ụwa n’Igbo.
- source_word: ἔνδυμα γάμου
  choice: uwe agbamakwụkwọ
  rationale: Ọ na-edobe otu uwe e jikọtara ya na agbamakwụkwọ n’akọwaghị kpọmkwem ụdị uwe ahụ karịa ihe isi mmalite kwuru.
- source_word: ἐφιμώθη
  choice: ọnụ akpọchie ya
  rationale: Nkebi okwu a na-egosi na ọ nweghị ike ịza ma na-edobekwa ọdịdị nnara nke ngwaa Grik. Ihe ngwaa ahụ pụtara n’ụzọ nkịtị ka akọwara n’ala peeji.
theological_decisions:
- issue: Ụda okwu onye nwe oriri ji kpọọ onye ọbịa ahụ
  choice: Enyi m—okwu nkwanye ùgwù nke nwekwara ịba mba n’ime ya
  alternative: Nwoke ibe m; Onye ibe m
  rationale: Nsụgharị a na-edobe esemokwu dị n’akụkọ ahụ n’emeghị ka okwu ahụ bụrụ nke ịhụnanya miri emi ma ọ bụ nke nlelị karịa Grik.
- issue: Otú e si sụgharịa ἐφιμώθη
  choice: ọnụ akpọchie ya
  alternative: ọ dara ogbi; o kwughị ihe ọ bụla; e mere ka ọ gbachie nkịtị
  rationale: Nhọrọ a na-egosi nsonaazụ ya—ọ pụghị ịza—ma na-edobekwa ike nke ụdị nnara dị na Grik. Ihe atụ nkịtị nke ‘ikpu ọnụ’ ka edobere na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Enyi m’ bụ ụzọ nkịtị e si kpọọ mmadụ, ebe ‘uwe agbamakwụkwọ’ na-ahapụ ụdị uwe ahụ n’ozuzu dịka Grik si mee. E tinyere akara nkọwa [a] ozugbo n’akụkụ nkebi okwu ọ na-akọwa.
