  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: ig
  text: Ma Jizọs, ebe ọ maara ajọ nzube ha, sịrị, “Gịnị mere unu ji anwa m[b], unu ndị ihu abụọ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: A pụkwara ịsụgharị ya, “Gịnị mere unu ji nwalee m?” Okwu Grik a nwere ike ịpụta “ịnwa” ma ọ bụ “nwalee”; n’ọnọdụ ụfọdụ, ọ na-ezokwa aka n’itinye mmadụ n’ọnwụnwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: matara
  rationale: Okwu a bụ aorist participle nke γινώσκω; “matara” na-egosi na Jizọs ghọtara nzube ha tupu o kwuo okwu.
- source_word: δὲ
  choice: Ma
  rationale: δέ na-egosi obere mgbagha n’etiti aghụghọ ha na nzaghachi Jizọs.
- source_word: πονηρίαν
  choice: ajọ nzube
  rationale: N’ọnọdụ a, πονηρία na-ezo aka n’ajọ ebumnobi ha, ọ bụghị naanị ajọ omume n’ozuzu.
- source_word: εἶπεν
  choice: ọ sịrị
  rationale: Nke a bụ ụzọ Igbo dị mma na nke nkịtị isi kọwaa okwu akụkọ a.
- source_word: Τί
  choice: Gịnị mere
  rationale: N’ajụjụ a, τί pụtara “n’ihi gịnị,” ya mere “Gịnị mere” bụ okwu Igbo ebumpụta ụwa.
- source_word: πειράζετε
  choice: ji anwa m ọnwụnwa
  rationale: πειράζω nwere ike ịpụta ịnwa, ile ule, ma ọ bụ ịnwa ọnwụnwa. N’ebe a, ndị iro Jizọs chọrọ iji ajụjụ nwalee ya ma jide ya n’okwu; okwu a na-edobe obosara ahụ.
- source_word: ὑποκριταί
  choice: unu ndị ihu abụọ
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị na-eme ka ha bụ ihe ha na-abụghị ma zoo ajọ nzube ha.
theological_decisions:
- issue: Otú e si kọwaa na Jizọs maara ebumnobi dị n’ime ndị na-ajụ ya ajụjụ
  choice: Jizọs matara ajọ nzube ha.
  alternative: Jizọs ghọtara ajọ omume ha; Jizọs matara obi ọjọọ ha.
  rationale: Amaokwu ahụ kwuru na Jizọs ghọtara ajọ ọdịdị nke ihe ha bu n’obi. Nsụgharị a na-edobe nkwupụta ahụ n’enweghị ịgbasawanye ya ka ọ bụrụ ozizi karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “ajọ nzube” iji gosipụta ebumnobi ọjọọ dị n’okwu gbara amaokwu ahụ gburugburu. E tinyere akara [b] n’ederede maka nkọwa okwu πειράζετε; enweghị [a] n’ihi na ederede Igbo achọghị ihe odide ala peeji iche maka πονηρία.
