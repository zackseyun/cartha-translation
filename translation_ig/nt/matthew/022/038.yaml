  yaml_path: translation/nt/matthew/022/038.yaml
  text: This is the great and first commandment[a].
translation:
  language: ig
  text: Nke a bụ iwu ahụ dị ukwu ma bụrụkwa nke mbụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya, “Nke a bụ iwu kacha mkpa.” N''ụzọ ka dị nso n''okwu Grik, e nwere nkọwa abụọ: “dị ukwu” na “nke mbụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Nke a
  rationale: Ọ na-arụtụ aka n'iwu ahụ e hotara na amaokwu nke 37; “Nke a” bụ ụzọ Igbo dị mfe ma doo anya isi gosipụta ntụaka ahụ.
- source_word: ἐστὶν
  choice: bụ
  rationale: Nke a bụ ngwaa njikọ n'oge ugbu a, ya mere “bụ” na-asụgharị ya kpọmkwem.
- source_word: μεγάλη
  choice: ukwu
  rationale: N'ebe a, ọ pụtara ịdị ukwuu n'ihe gbasara mkpa ma ọ bụ ọkwa, ọ bụghị ịdị ukwuu n'ahụ; “ukwu” na-echekwa ụdị nkọwa nkịtị nke okwu Grik ahụ n'enweghị ime ya ka ọ bụrụ nke kacha ukwuu.
- source_word: πρώτη
  choice: nke mbụ
  rationale: Ọ na-egosi ịbụ nke mbụ n'usoro ma ọ bụ n'ọkwa; “nke mbụ” na-echekwa ihe okwu Grik ahụ kwuru ozugbo.
- source_word: ἐντολή
  choice: iwu
  rationale: “Iwu” bụ okwu Igbo dị ugbu a ma kwụ ọtọ maka iwu e nyere, ma dabara n'ọnọdụ mkparịta ụka gbasara Iwu Chineke.
theological_decisions:
- issue: Mmekọrịta dị n'etiti μεγάλη na πρώτη n'ịkọwa iwu ahụ
  choice: 'E gosipụtara nkọwa abụọ ahụ iche: “iwu ukwu ahụ, bụrụkwa nke mbụ.”'
  alternative: “Nke a bụ iwu kachasị mkpa.”
  rationale: Grik jikọtara nkọwa abụọ dị n'ụdị nkịtị—“ukwu” na “mbụ.” Nsụgharị a na-echekwa ha abụọ ma ghara ịgbanwe μεγάλη ka ọ bụrụ okwu kachasị elu ma ọ bụ jikọta echiche abụọ ahụ ka ha bụrụ naanị “kachasị mkpa.”
translation_notes:
  register: Asụsụ Igbo kwụ ọtọ, dị ùgwù, ma dị mfe nghọta. E ji “iwu” mee ka okwu ahụ bụrụ ihe ndị na-agụ Igbo nke oge a ga-aghọta ngwa ngwa; ahịrịokwu ahụ ka na-echekwa nkọwa abụọ dị na Grik.
