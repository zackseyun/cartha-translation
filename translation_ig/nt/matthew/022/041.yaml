  text: Συνηγμένων δὲ τῶν Φαρισαίων ἐπηρώτησεν αὐτοὺς ὁ Ἰησοῦς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/041.yaml
  text: While the Pharisees were gathered together, Jesus asked them,
translation:
  language: ig
  text: Mgbe ndị Farisii zukọtara, Jizọs jụrụ ha,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: Mgbe ... zukọtara
  rationale: 'Ngwaa a dị n’usoro genitive absolute ma na-enye ọnọdụ ihe na-eme: mgbe ndị Farisii nọkọtara n’otu ebe. “Zukọtara” bụ ụzọ Igbo dị nkenke ma bụrụkwa nke e ji eme ihe n’oge a.'
- source_word: δὲ
  choice: (egosighị ya iche)
  rationale: δὲ bụ njikọ dị nro na-aga n’ihu n’akụkọ ahụ, ọ bụghị okwu na-egosi nnukwu esemokwu. N’Igbo ebe a, “mgbe” na nhazi ahịrịokwu ahụ ezuola igosi njikọ ahụ; ịgbakwunye “ma” ma ọ bụ “ugbu a” ga-eme ka ihe ọ pụtara sie ike karịa isi mmalite.
- source_word: τῶν Φαρισαίων
  choice: ndị Farisii
  rationale: Nke a bụ aha otu okpukpe ahụ n’ụdị Igbo a na-ahụkarị; ọ bụkwa isiokwu nke usoro genitive absolute.
- source_word: ἐπηρώτησεν
  choice: jụrụ
  rationale: N’ebe a, ngwaa ahụ na-ewebata ajụjụ Jizọs jụrụ ha. “Jụrụ” bụ okwu Igbo nkịtị na nke ziri ezi, na-enweghị itinye echiche nke ịgba ha ajụjụ n’ụzọ ike.
- source_word: αὐτοὺς
  choice: ha
  rationale: Nnọchiaha a na-arụtụ aka n’ebe ndị Farisii a kpọtụrụ aha nọ.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: Aha nke onye mere ihe ahụ; akara aha Greek adịghị mkpa ka a sụgharịa ya iche n’Igbo.
theological_decisions: []
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị mfe ma nwee ugwu. E debere usoro ọnọdụ nke participle Greek site n’iji “Mgbe ... zukọtara,” ma zere itinye okwu njikọ na-adịghị mkpa.
