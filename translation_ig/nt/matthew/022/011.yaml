    reason: cultural_note
  revision_rationale: The revision removes the added evaluative sense in “uwe kwesịrị ekwesị,” retains the culturally specific banquet posture with its anchored note, and improves idiomatic Standard Igbo syntax. It does not assign doctrinal significance to the wedding garment.
