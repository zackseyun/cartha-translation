id: MAT.22.11
reference: Matthew 22:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: ig
  text: Ma mgbe eze ahụ batara ile ndị ọbịa ahụ na-adabere n'akụkụ tebụl[b] anya, ọ hụrụ otu nwoke nọ n'ebe ahụ, onye na-eyighị uwe agbamakwụkwọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu nwoke nke na-eyighị uwe agbamakwụkwọ.”
    reason: lexical_alternative
  - marker: b
    text: N'asụsụ Grik, ihe e dere bụ “ndị dabere.” N'oge ahụ, ndị ọbịa na-adịkarị na-adabere n'akụkụ tebụl mgbe ha na-eri nri n'oriri pụrụ iche.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθὼν
  choice: mgbe ... batara
  rationale: Aorist participle ahụ na-egosi omume eze mere tupu isi ngwaa; “batara” bụ okwu Igbo doro anya nke na-egosi na ọ banyere n'ebe oriri ahụ dị.
- source_word: δὲ
  choice: Ma
  rationale: δέ na-ebute mgbanwe n'akụkọ ahụ ma nwee obere echiche nke ọdịiche; “Ma” na-egosi ntụgharị ahụ nke na-amalite esemokwu ọhụrụ.
- source_word: ὁ βασιλεὺς
  choice: eze ahụ
  rationale: Nke a bụ ntụgharị nkịtị nke βασιλεύς n'ilu gbasara eze, ebe akara nkọwa ahụ na-ezo aka n'eze a kpọtụrụla aha.
- source_word: θεάσασθαι
  choice: ka o lee
  rationale: Infinitive a na-egosi nzube eze ji bata. “Ka o lee” bụ Igbo e ji eme ihe kwa ụbọchị, ma ọ naghị amanye echiche nke nyocha iwu siri ike.
- source_word: τοὺς ἀνακειμένους
  choice: ndị ọbịa ahụ nọ na-eri nri ka ha dabere n'akụkụ tebụl
  rationale: ἀνάκειμαι na ọnọdụ oriri na-ezo aka n'ịdabere n'akụkụ tebụl mgbe a na-eri nri. A gbakwụnyere “ndị ọbịa” iji mee ka ndị a na-ekwu maka ha doo anya, ma e debere omenala nke ịdabere n'akụkụ tebụl.
- source_word: εἶδεν
  choice: ọ hụrụ
  rationale: Nke a na-enye isi ihe ὁράω pụtara n'ụzọ dị mfe ma kwekọọ n'usoro akụkọ.
- source_word: ἐκεῖ
  choice: n'ebe ahụ
  rationale: Ọ bụ ntụgharị Igbo nkịtị nke adverb ebe a.
- source_word: ἄνθρωπον
  choice: otu nwoke
  rationale: N'ebe a, ἄνθρωπον bụ otu onye nwoke kpọmkwem n'ilu ahụ, ọ bụghị mmadụ n'ozuzu.
- source_word: οὐκ ἐνδεδυμένον
  choice: nke na-eyighị
  rationale: Perfect participle ahụ na-akọ ọnọdụ nwoke ahụ nọ na ya n'oge eze hụrụ ya; “na-eyighị” na-enye ọnọdụ ahụ n'ụzọ ebumpụta ụwa n'Igbo.
- source_word: ἔνδυμα γάμου
  choice: uwe kwesịrị ekwesị maka agbamakwụkwọ
  rationale: Nke a na-akọwa uwe e kwesịrị iyi n'oriri agbamakwụkwọ n'Igbo dị ugbu a. E debere ụdị nke na-esochi otu mkpụrụokwu Grik nke ọma karịa na nkọwa ala peeji.
theological_decisions:
- issue: Ọnọdụ ndị na-eri nri n'oriri oge ochie
  choice: E debere echiche nke ịdabere n'akụkụ tebụl, ma kọwaa na ha bụ ndị ọbịa nọ na-eri nri.
  alternative: Ịsụgharị naanị “ndị ọbịa” ma ọ bụ “ndị dabere.”
  rationale: Nke a na-echekwa nkọwa omenala dị n'okwu Grik, ma na-enyekwa onye na-agụ Igbo ihe ga-enyere ya ịghọta ọnọdụ oriri ahụ.
- issue: Ụdị nwoke nke ἄνθρωπον na-egosi
  choice: otu nwoke
  alternative: otu onye; mmadụ
  rationale: Akụkụ a na-ekwu banyere otu nwoke kpọmkwem n'ilu ahụ; ya mere, a naghị eme ka okwu ahụ ghọọ nke na-anọpụ iche n'ihe gbasara nwoke na nwaanyị.
- issue: Ihe ἔνδυμα γάμου na-anọchi anya n'ilu ahụ
  choice: A sụgharịrị naanị ihe oyiyi ahụ dị ka uwe kwesịrị ekwesị maka agbamakwụkwọ, n'enweghị ịkọwa ihe ọ na-anọchi anya n'ụzọ ozizi.
  alternative: Ịtinye nkọwa ozizi kpọmkwem banyere ihe uwe ahụ na-anọchi anya ya.
  rationale: Amaokwu ahụ n'onwe ya akọwaghị ihe uwe ahụ na-anọchi anya ya; ịhapụ esemokwu ahụ na-echekwa ohere nkọwa dị n'ilu ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A zere okwu ụka nke otu nzukọ pụrụ iche, ma debe usoro akụkọ na nkọwa omenala nke isi mmalite Grik.
