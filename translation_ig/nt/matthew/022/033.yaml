  yaml_path: translation/nt/matthew/022/033.yaml
  text: And when the crowds heard it[a], they were astonished at his teaching.
translation:
  language: ig
  text: Mgbe ìgwè mmadụ ahụ nụrụ nke a[a], ozizi ya tụrụ ha n’anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe ha nụsịrị nke a,” ma ọ bụ n’ụzọ kpọmkwem karị, “ebe ha nụchara nke a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Mgbe
  rationale: N’Igbo, ịmalite ahịrịokwu a na nkebi oge na-eme ka njikọ ya na ihe bu ụzọ doo anya n’enweghị ịmanye ‘Na’; a na-egosipụta njikọ καί site n’usoro akụkọ ahụ.
- source_word: ἀκούσαντες
  choice: nụrụ nke a
  rationale: Partisipụl aorist a na-arụ ọrụ dị ka nkebi oge. ‘Nke a’ na-egosi ihe a hapụrụ n’ụdị Grik—azịza Jizọs kwuru tupu nke a—ma na-eme ka Igbo bụrụ nke eke.
- source_word: οἱ ὄχλοι
  choice: ìgwè mmadụ ahụ
  rationale: Nke a bụ okwu Igbo dị ugbu a ma dị mfe nghọta maka ìgwè ndị nọ ebe ahụ. Ọ bụ ezie na Grik ji ọtụtụ, Igbo na-ejikarị ‘ìgwè mmadụ’ dị ka aha mkpokọta n’ọnọdụ a.
- source_word: ἐξεπλήσσοντο
  choice: tụrụ ha n’anya nke ukwuu
  rationale: Nkebiokwu a na-enye ike nke ἐκπλήσσω n’Igbo eke, na-egosi na ozizi ahụ juru ha anya nke ukwuu.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: ozizi ya
  rationale: A jikọtara ya na ‘tụrụ ha n’anya,’ nke n’usoro Igbo na-egosi ihe kpatara mmeghachi omume ahụ. ‘Ozizi’ bụ okwu doro anya, dị ùgwù, ma ghara ịdị oke teknịkal.
theological_decisions: []
