    reason: lexical_alternative
  revision_rationale: The revision removes an unsupported intensifier while retaining the natural Igbo construction in which Jesus’ teaching is the grammatical subject of “tụrụ ha n’anya.” The footnote is corrected so that both alternatives convey the temporal force of the Greek participle.
