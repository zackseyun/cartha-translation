revisions:
- from: Ya mere, ọ bụrụ na Devid na-akpọ ya “Onyenwe anyị,” olee otú o si bụrụ nwa ya?[a]
  to: Ya mere, ọ bụrụ na Devid na-akpọ ya “Onyenwe,” olee otú ọ si bụrụ nwa ya?[a]
  rationale: The revision removes only the unsupported plural possessive from the rendering of κύριον. It preserves the source’s conditional and inferential force, the contextual pronoun reference, and the unresolved rhetorical tension between Davidic sonship and lordship. The footnote is revised in parallel and continues to identify the contextual referent without placing “Mesaya” in the main text.
