  text: εἰ οὖν Δαυὶδ καλεῖ αὐτὸν κύριον, πῶς υἱὸς αὐτοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/045.yaml
  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: ig
  text: Ya mere, ọ bụrụ na Devid na-akpọ ya “Onyenwe,” olee otú ọ si bụrụ nwa ya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n''ụzọ doro anya karị site n''amaokwu ndị gbara ya gburugburu: “Ya mere, ọ bụrụ na Devid na-akpọ Mesaya ‘Onyenwe,’ olee otú ọ si bụrụ nwa ya?”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ οὖν
  choice: Ya mere, ọ bụrụ na
  rationale: Nke a na-echekwa ma ọnọdụ nke εἰ (‘ọ bụrụ na’) ma nkwubi okwu arụmụka nke οὖν (‘ya mere’), n'usoro okwu Igbo doro anya.
- source_word: Δαυὶδ
  choice: Devid
  rationale: Ụdị aha a na-ejikarị eme ihe n'Igbo maka David.
- source_word: καλεῖ
  choice: na-akpọ
  rationale: Ọ na-egosipụta kpọmkwem echiche nke ịkpọ mmadụ aha ma ọ bụ utu aha; ọ bụghị naanị ‘ikwu’.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n'onye e kwuru banyere ya n'amaokwu ndị bu ụzọ, n'ebughị ụzọ tinye ‘Mesaya’ n'ahịrị bụ isi.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a maara nke ọma maka κύριος n'ọnọdụ nsọpụrụ na nke Kraịst, ma na-echekwa njikọ ya na Abụ Ọma 110:1.
- source_word: πῶς
  choice: olee otú
  rationale: Ọ na-ebute ajụjụ gbasara mmekọrịta ezi uche dị na ya n'ụzọ nkịtị n'Igbo.
- source_word: υἱὸς αὐτοῦ
  choice: nwa ya
  rationale: Ọ na-echekwa okwu ezinụlọ na eze nke Grik na esemokwu e bu n'uche, kama ịkọwa ya naanị dịka ‘mkpụrụ ya’.
- source_word: ἐστιν
  choice: o si bụrụ
  rationale: N'ime ajụjụ Igbo ‘olee otú,’ ụdị a na-egosi copula dị ugbu a n'ụzọ dị mma ma bụrụ nke eke.
theological_decisions:
- issue: Ike Mesaya na nke Kraịst dị n'ịkpọ onye ahụ ‘Onyenwe anyị’ ma n'otu oge ahụ ‘nwa’ Devid
  choice: E debere ‘Onyenwe anyị’ na ‘nwa ya’ n'ahịrị bụ isi n'enweghị nkọwa ga-edozi esemokwu ahụ.
  alternative: ‘Ọ bụrụ na Devid na-akpọ Mesaya “Onyenwe anyị,” olee otú Mesaya si bụrụ nwa Devid?’
  rationale: Grik ji nnọchiaha αὐτόν mee ihe, ebe ihe ọ na-ezo aka na ya sitere n'ọnọdụ gbara amaokwu ahụ gburugburu. Ịtinye ‘Mesaya’ n'ahịrị bụ isi ga-eme ka o doo anya, ma ọ ga-agbakwunye okwu na-adịghị n'amaokwu a. Nsụgharị ahụ na-ahapụ ma ịbụ nwa Devid ma ịbụ Onyenwe ya ka ha guzo ọnụ n'enweghị itinye nkọwa otu ụka.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘Ya mere, ọ bụrụ na’ mee ka arụmụka ahụ daa nke ọma n'Igbo, ma e debere nnọchiaha na esemokwu nkà mmụta okpukpe nke ederede mbụ.
