  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: ig
  text: Ma Jizọs zara ha, sị, “Unu na-ehie ụzọ[a], n’ihi na unu amaghị ma Akwụkwọ Nsọ ma ike Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “A na-eduhie unu” ma ọ bụ “Unu nọ ná njehie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ma Jizọs zara ha, sị
  rationale: Nkebiokwu a bụ usoro Grik a na-ejikarị egosi nzaghachi. ‘Ma’ na-egosipụta mgbanwe okwu nke δέ, ebe ‘zara ha, sị’ na-enye Igbo dị n’usoro ma na-edobe ma echiche nzaghachi ma nke ikwu okwu.
- source_word: Πλανᾶσθε
  choice: Unu na-ehie ụzọ
  rationale: Nke a na-egosi na ha nọ n’amaghị ama ma ọ bụ na ha esiwo n’ezi ụzọ echiche pụọ, n’ebughị ụzọ kpebie na onye ọzọ bụ naanị onye duhiere ha.
- source_word: μὴ εἰδότες
  choice: n’ihi na unu amaghị
  rationale: Participle a na-enye ihe kpatara njehie ha; ‘n’ihi na’ na-eme ka mmekọrịta ihe kpatara ya doo anya n’Igbo.
- source_word: τὰς γραφὰς
  choice: Akwụkwọ Nsọ
  rationale: N’ọnọdụ ndị Juu na nke Ndị Kraịst mbụ, ọtụtụ γραφαί na-ezo aka n’ihe odide dị nsọ; ‘Akwụkwọ Nsọ’ bụ okwu Igbo a maara nke ọma ma kwesị ekwesị.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: ma ọ bụ ike Chineke
  rationale: 'Mgbe ahịrịokwu mbụ dị n’ụdị njụ, ‘ma ọ bụ’ na-ejikọta ihe abụọ a na-amaghị n’ụzọ Igbo si adị: ha amaghị Akwụkwọ Nsọ, ha amaghịkwa ike Chineke.'
theological_decisions:
- issue: Ihe kpatara njehie ndị Sadusii
  choice: Jizọs kwuru na ha na-ehie ụzọ n’ihi na ha amaghị ma Akwụkwọ Nsọ ma ike Chineke.
  alternative: Ịsụgharị ya dịka nanị ebubo izugbe na a duhiere ha, na-emeghị ka ihe kpatara ya pụta ìhè.
  rationale: μὴ εἰδότες na-akọwa ihe kpatara Πλανᾶσθε, ebe μηδέ na-ejikọta ihe abụọ ha na-amaghị. Nsụgharị ahụ na-edobe mmekọrịta a n’enweghị ịgbakwụnye nkọwa ozizi.
translation_notes:
  register: E ji Igbo izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. ‘Na-ehie ụzọ’ bụ okwu nkịtị ma ziri ezi maka Πλανᾶσθε; e tinyere akara [a] ozugbo n’ebe okwu ahụ dị.
