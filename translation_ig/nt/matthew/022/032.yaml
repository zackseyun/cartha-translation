  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: ig
  text: ‘Abụ m Chineke nke Ebreham, na Chineke nke Aịzik, na Chineke nke Jekọb.’ Chineke abụghị Chineke nke ndị nwụrụ anwụ, kama ọ bụ Chineke nke ndị dị ndụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Abụ m
  rationale: Nke a na-edobe nkwupụta onwe onye n'oge dị ugbu a n'ụzọ Igbo si ekwu ya nke ọma, ma na-echekwa ike arụmụka dị n'okwu e hotara.
- source_word: ὁ θεὸς Ἀβραὰμ ... ὁ θεὸς Ἰσαὰκ ... ὁ θεὸς Ἰακώβ
  choice: Chineke nke Ebreham, na Chineke nke Aịzik, na Chineke nke Jekọb
  rationale: E jigidere nkwughachi nke ‘Chineke’ dị na Grik iji chekwaa ịdị arọ na usoro okwu ahụ, kama ijikọta aha atọ ahụ n'otu nkebi.
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: Ọ bụghị Chineke
  rationale: N'adịghị ka Bekee, Igbo nwere ike ikwughachi aha ahụ n'ụzọ doro anya ma dịkwa n'okike; nke a na-esokwa Grik nke kwughachiri θεός.
- source_word: νεκρῶν
  choice: ndị nwụrụ anwụ
  rationale: Adjective plural ahụ na-arụ ọrụ dị ka aha; ‘ndị nwụrụ anwụ’ bụ ntụgharị Igbo doro anya ma dị n'okike.
- source_word: ζώντων
  choice: ndị dị ndụ
  rationale: Present participle ahụ na-arụ ọrụ dị ka aha ma na-emegide ‘ndị nwụrụ anwụ’; ‘ndị dị ndụ’ na-echekwa ọdịiche ahụ nkenke.
theological_decisions:
- issue: Ihe okwu a na-egosi banyere ndị nna ochie ka ha dị ndụ n'ihu Chineke n'arụmụka Jizọs gbasara mbilite n'ọnwụ
  choice: A sụgharịrị nkwupụta ahụ kpọmkwem n'enweghị nkọwa agbakwunyere banyere mbilite n'ọnwụ ma ọ bụ ọnọdụ ndị nwụrụ anwụ.
  alternative: Ọ bụghị Chineke nke ndị nwụrụ anwụ, kama ọ bụ Chineke nke ndị ka dị ndụ n'ihu ya.
  rationale: Okwu ahụ na-akwado arụmụka Jizọs, ma nsụgharị ekwesịghị ịgbakwunye nkọwa ozizi karịrị ihe Grik kwuru; ya mere e chekwara esemokwu na ike okwu ahụ.
translation_notes:
  register: 'Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E jigidere nkwughachi ‘Chineke’ n''ihi na ọ bụ atụmatụ pụtara ìhè n''okwu Grik. A họọrọ ụdị aha ndị mmadụ a na-ahụkarị n''Igbo: Ebreham, Aịzik, Jekọb.'
