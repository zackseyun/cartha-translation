source:
  edition: SBLGNT
  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: ig
  text: Ma ha egeghị ya ntị wee pụọ[a], otu onye gara n’ubi nke ya, onye ọzọ garakwa azụmahịa ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “egeghị ya ntị” dịka “leghaara ya anya” ma ọ bụ “ha achọghị ịma banyere ya.” “Ya” na-ezo n’oku eze kpọrọ ha, dịka ihe gbara amaokwu a gburugburu na-egosi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: egeghị ya ntị
  rationale: Nke a na-egosi na ha leghaara ihe ahụ anya ma ọ bụ na ha enyeghị ya mkpa. ‘Ya’ na-ezo n’oku eze kpọrọ ha, dịka ihe gbara amaokwu ahụ gburugburu si gosi.
- source_word: ἀπῆλθον
  choice: wee pụọ
  rationale: Nke a na-egosi n'ụzọ doro anya na ha hapụrụ oku ahụ gaa ebe ọzọ, n'asụsụ Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: otu onye ... onye ọzọ
  rationale: 'Usoro a na-echekwa nkewa na ntụnyere dị n’okwu Grik: otu onye gara otu ebe, onye ọzọ gaa ebe ọzọ.'
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: n’ubi nke ya
  rationale: ‘Ubi’ bụ okwu Igbo kwesịrị ekwesị maka ἀγρός n’ebe a, ‘nke ya’ na-echekwa echiche ἴδιον banyere ihe nke onye ahụ onwe ya.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: n’azụmahịa ya
  rationale: ‘Azụmahịa’ na-anọchi anya ọrụ ịzụ ahịa ma ọ bụ azụmahịa nke ἐμπορία na-egosi, n'ụzọ ndị na-agụ Igbo ugbu a ga-aghọta nke ọma.
theological_decisions:
- issue: Ihe ἀμελήσαντες na-ezo aka na ya
  choice: E tinyere ‘ya’ ka ọ na-ezo n’oku eze kpọrọ ha, n’agbanyeghị na Grik ekwughị ihe ahụ aha kpọmkwem.
  alternative: ‘Ha leghaara ihe ahụ anya’ ma ọ bụ ‘ha elezighị ya anya.’
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ihe ha na-egeghị ntị bụ oku eze kpọrọ ha. Nsụgharị ahụ na-eme ka Igbo bụrụ nke okike n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro akụkọ okike n’Igbo ma na-echekwa ihe okwu Grik pụtara n’enweghị ịgbakwunye nkọwa otu ụka.
