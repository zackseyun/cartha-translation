id: MAT.22.13
reference: Matthew 22:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: ig
  text: Mgbe ahụ, eze ahụ gwara ndị na-ejere ya ozi[a] sị, “Keenụ ụkwụ ya na aka ya agbụ, tụpụkwanụ ya n’ọchịchịrị dị n’èzí. N’ebe ahụ ka ịkwa ákwá na ịta ikikere eze ga-adị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ohu ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe sochiri ozugbo n’akụkọ ahụ n’asụsụ Igbo doro anya.
- source_word: ὁ βασιλεὺς
  choice: eze ahụ
  rationale: Ọ na-edobe onyinyo eze dị n’ilu ahụ, ebe “ahụ” na-ezo aka n’eze a kpọtụrụla aha.
- source_word: τοῖς διακόνοις
  choice: ndị na-ejere ya ozi
  rationale: N’ọnọdụ oriri a, ọ pụtara ndị na-enyere eze aka ma ọ bụ na-ejere ya ozi; nsụgharị a ezere ịmanye nkọwa ọkwa ụka n’ime okwu ahụ.
- source_word: Δήσαντες
  choice: Keenụ ... agbụ
  rationale: Nkebi aorist a na-ebute iwu bụ isi; okwu Igbo a na-enye iwu siri ike ma doo anya ka e kee ya agbụ.
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: ụkwụ ya na aka ya
  rationale: E debere usoro okwu Grik, nke bu ụzọ kwuo ụkwụ tupu aka.
- source_word: ἐκβάλετε αὐτὸν
  choice: tụpụkwanụ ya
  rationale: Ọ na-egosi nchụpụ siri ike ma bụrụ okwu Igbo nke oge a na-aghọta ngwa ngwa.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: n’ọchịchịrị dị n’èzí
  rationale: Ọ na-edobe ọdịiche dị n’etiti ebe oriri na ọchịchịrị dị n’èzí n’enweghị ịkọwa ihe oyiyi ahụ karịa ihe Grik kwuru.
- source_word: ἐκεῖ
  choice: N’ebe ahụ
  rationale: Ọ na-edobe nrụtụ aka doro anya n’ebe a tụpụụrụ nwoke ahụ.
- source_word: ὁ κλαυθμὸς
  choice: ịkwa ákwá
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si egosi akwa na iru újú.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: ịta ikikere eze
  rationale: Ọ bụ akpaala okwu Igbo a na-aghọta nke na-egosi ịkpa ma ọ bụ ịta eze n’ihi nhụjuanya ma ọ bụ iwe, n’enweghị ịhọrọ naanị otu mmetụta.
theological_decisions:
- issue: Ụdị nchụpụ e sere n’ilu ahụ
  choice: 'E debere okwu ihe oyiyi ahụ kpọmkwem: ịtụpụ ya n’ọchịchịrị dị n’èzí.'
  alternative: Ịkọwa ya ozugbo dị ka ọkụ ala mmụọ, ikpe ikpeazụ, ma ọ bụ naanị ịchụpụ mmadụ n’oriri.
  rationale: Grik na-eji ihe oyiyi ikpe siri ike n’ilu, ma ọ kọwaghị ya n’amaokwu a n’otu n’ime ụzọ ndị ahụ kpọmkwem; ya mere nsụgharị ahụ na-edobe nghọtahie na esemokwu nkà mmụta okpukpe dị na ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ndị na-ejere ya ozi” zere ụda pụrụ iche nke ọkwa ụka, ebe ihe odide ala peeji na-edobe nhọrọ “ndị ohu ya.”
