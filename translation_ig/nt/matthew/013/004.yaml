id: MAT.13.4
reference: Matthew 13:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: ig
  text: Mgbe ọ nọ na-agha mkpụrụ[a], ụfọdụ mkpụrụ dara n'akụkụ ụzọ; ụmụ nnụnụ bịara richapụ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'okwu Grik, ọ pụtara n'ụzọ nkịtị, “ụfọdụ ihe dara n'akụkụ ụzọ”; e tinyere “mkpụrụ” n'ihi na ihe a na-ekwu bụ ihe onye na-agha mkpụrụ nọ na-agha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: Mgbe ọ nọ na-agha mkpụrụ
  rationale: Nkebiokwu ἐν tinyere infinitive nwere article na-egosi ihe na-eme n'otu oge; ntụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: ἃ μὲν
  choice: ụfọdụ mkpụrụ
  rationale: N'okwu Grik, ọ pụtara n'ụzọ nkịtị ‘ụfọdụ ihe,’ ma ihe ndị ahụ bụ mkpụrụ onye na-agha mkpụrụ nọ na-agha; e tinyere ‘mkpụrụ’ ka ihe a na-ekwu doo anya.
- source_word: ἔπεσεν
  choice: dara
  rationale: Aorist indicative a na-akọ otu ihe mere n'oge gara aga, ya mere ‘dara’ dabara n'akụkọ a.
- source_word: παρὰ τὴν ὁδόν
  choice: n'akụkụ ụzọ
  rationale: παρά na accusative ebe a na-egosi ebe dị n'akụkụ ụzọ; okwu a na-echekwa echiche ahụ n'Igbo dị mfe.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: ụmụ nnụnụ bịara
  rationale: A tụgharịrị participle ἐλθόντα dịka ngwaa na-esochi n'usoro ihe mere. πετεινά pụtara nnụnụ ma ọ bụ ihe ndị na-efe efe; ‘ụmụ nnụnụ’ bụ ntụgharị kacha doo anya.
- source_word: κατέφαγεν
  choice: richapụ
  rationale: κατεσθίω na-egosi iri ihe kpamkpam; ‘richapụ’ na-egosipụta ike okwu ahụ karịa naanị ‘rie.’
- source_word: αὐτά
  choice: ha
  rationale: Nnọchiaha a na-ezo aka ná mkpụrụ ndị dara, ya mere ‘ha’ zuru oke ma bụrụ Igbo nkịtị.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. ‘Ọ nọ na-agha’ na-egosi omume na-aga n'ihu, ebe ‘richapụ’ na-echekwa ike nke κατέφαγεν.
