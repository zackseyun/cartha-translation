review_pass:
  verdict: revise
  source_fidelity: The draft retains the temporal setting, scorching, causal lack of root, and drying/wilting. However, “anyanwụ wara” can foreground the sun’s shining rather than its rising, and the causal clause is more directly represented with “n’ihi na.”
  naturalness: “Okpomọkụ ya chagburu ya” has avoidable pronoun ambiguity, since both pronouns can be read as referring to the sun or the plant. Naming the sun’s heat directly is clearer. The proposed footnote wording “ọ taa” is not a clear, natural lexical alternative here.
  terminology: “Mgbọrọgwụ” is appropriate for ῥίζαν and may naturally function as the plant’s root/root system in Igbo. “Kpọnwụọ” suitably conveys the plant’s withering/drying. No theological terminology is involved.
  issues:
  - severity: medium
    issue: The wording for the sun’s action is ambiguous.
    rationale: In “okpomọkụ ya chagburu ya,” the repeated pronouns obscure the referents. “Okpomọkụ anyanwụ chagburu ya” clearly identifies the scorching heat and the affected seedling.
  - severity: low
    issue: The footnote alternative is unclear.
    rationale: “Ọ taa” is not an adequately clear Standard Igbo alternative for ἐξηράνθη in this plant context. “Ọ kpọrọ nkụ” gives the lexical alternative ‘it dried up.’
  - severity: low
    issue: The temporal verb can be made more explicit.
    rationale: “Mgbe anyanwụ bilitere” directly conveys the Greek reference to the sun’s rising, without changing the meaning.
  revised_text: Ma mgbe anyanwụ bilitere, okpomọkụ anyanwụ chagburu ya; n’ihi na o nweghị mgbọrọgwụ, ọ kpọnwụọ.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ kpọrọ nkụ.”
    reason: lexical_alternative
  revision_rationale: The revision makes the rising of the sun explicit, removes pronoun ambiguity in the scorching clause, expresses the causal relation directly, and supplies a clear lexical alternative for the final verb. It preserves the agricultural imagery and the Greek singular “root” without adding interpretation.
