  text: ἡλίου δὲ ἀνατείλαντος ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: ig
  text: Ma mgbe anyanwụ bilitere, okpomọkụ anyanwụ chagburu ya; n’ihi na o nweghị mgbọrọgwụ, ọ kpọnwụọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ kpọrọ nkụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: Ma mgbe anyanwụ wara
  rationale: Nkebiokwu genitive absolute a na-egosi oge; “mgbe anyanwụ wara” bụ Igbo nkịtị, ebe “Ma” na-echekwa obere ntụgharị echiche nke δέ.
- source_word: ἐκαυματίσθη
  choice: okpomọkụ ya chagburu ya
  rationale: Okwu a na-egosi na okpomọkụ anyanwụ gbara ihe ọkụkụ ahụ ọkụ ma mebie ya; ntụgharị a dabara n’onyonyo ihe ọkụkụ n’Igbo nke oge a.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: ebe ọ na-enweghị
  rationale: διά tinyere infinitive nwere article na-egosi ihe kpatara ya; “ebe ọ na-enweghị” na-ekwupụta ihe kpatara ya n’ụzọ Igbo dị ụtọ.
- source_word: ῥίζαν
  choice: mgbọrọgwụ
  rationale: E chekwara otu mkpụrụ okwu dị na Grik; “mgbọrọgwụ” na-arụkwa ọrụ n’Igbo ma ọ bụ otu ma ọ bụ n’echiche mkpokọta.
- source_word: ἐξηράνθη
  choice: ọ kpọnwụọ
  rationale: N’ọnọdụ ihe ọkụkụ, ξηραίνω nwere ike ịpụta ịkpọnwụ ma ọ bụ ịta; “ọ kpọnwụọ” na-egosi nsonaazụ ahụ nke ọma ma na-echekwa onyonyo ubi.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji okwu ubi ndị nkịtị mara, na-enweghị ịgbakwunye nkọwa okpukpe na-adịghị n’amaokwu ahụ.
