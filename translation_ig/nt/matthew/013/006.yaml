revisions:
- from: Ma mgbe anyanwụ wara, okpomọkụ ya chagburu ya; ebe ọ na-enweghị mgbọrọgwụ, ọ kpọnwụọ.[a]
  to: Ma mgbe anyanwụ bilitere, okpomọkụ anyanwụ chagburu ya; n’ihi na o nweghị mgbọrọgwụ, ọ kpọnwụọ.[a]
  rationale: The revision makes the rising of the sun explicit, removes pronoun ambiguity in the scorching clause, expresses the causal relation directly, and supplies a clear lexical alternative for the final verb. It preserves the agricultural imagery and the Greek singular “root” without adding interpretation.
  reviewer_model: gpt-5.6-terra
