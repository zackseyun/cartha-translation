id: MAT.13.33
reference: Matthew 13:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: ig
  text: 'Ọ gwakwara ha ilu ọzọ, sị: “Alaeze eluigwe dị ka ihe na-eko achịcha[a], nke otu nwanyị weere zoo[c] n’ime ọ̀tụ̀tụ̀ ntụ ọka atọ[b], ruo mgbe ntụ ọka ahụ dum koro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “yist.” Okwu Grik ahụ pụtara ihe a na-etinye na ntụ ọka iji mee ka ọ koo.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “seah atọ nke ntụ ọka.” Nke a bụ ọ̀tụ̀tụ̀ buru ibu nke ntụ ọka.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsị “gwakọta n’ime” ma ọ bụ “tinye n’ime”; ma okwu Grik ahụ pụtara n’ụzọ nkịtị, “zoo n’ime.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: Ọ tụkwara ha ilu ọzọ
  rationale: ‘Ịtụ ilu’ bụ ụzọ Igbo si ekwu ịkọ ilu; ‘ọzọ’ na ‘-kwara’ na-egosi na nke a bụ ilu ọzọ a gbakwụnyere.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Alaeze eluigwe
  rationale: Nke a bụ ntụgharị Igbo doro anya nke okwu Matiu ji eme ihe; ọ naghị eme ka ọtụtụ-form nke οὐρανῶν bụrụ ihe siri ike n’Igbo.
- source_word: ζύμῃ
  choice: ihe na-eko achịcha
  rationale: Okwu a na-akọwa ihe e ji eme ka ntụ ọka koo n’asụsụ Igbo a na-aghọta taa, ma ọ naghị ewebata echiche na ihe atụ ahụ dị mma ma ọ bụ dị njọ.
- source_word: ἣν λαβοῦσα γυνὴ
  choice: nke otu nwanyị weere
  rationale: Ọ na-edobe usoro omume nke participle λαβοῦσα n’Igbo nkịtị ma doo anya.
- source_word: ἐνέκρυψεν εἰς
  choice: zoo n’ime
  rationale: Ọ na-echekwa isi ihe okwu Grik pụtara n'ụzọ nkịtị—‘zoo n’ime’—kama ịkọwa ya naanị dị ka ịgwakọta.
- source_word: ἀλεύρου σάτα τρία
  choice: ọ̀tụ̀tụ̀ ntụ ọka atọ
  rationale: ‘Ọ̀tụ̀tụ̀’ na-eme ka ndị na-agụ ya ghọta na a na-ekwu maka ọtụtụ ntụ ọka a tụrụ, ebe a kọwara aha na ibu nke ọ̀tụ̀tụ̀ Grik n’okpuru peeji.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: ruo mgbe ntụ ọka ahụ dum koro
  rationale: Ọ na-egosi na ihe ahụ dum bịara kọọ, na-edobe ὅλον, ma ọ naghị agbakwunye okwu dị ka ‘ngwakọta’ nke na-adịghị kpọmkwem n’ihe odide ahụ.
theological_decisions:
- issue: Ma ζύμη ò nwere ihe ọjọọ ma ọ bụ ihe ọma ọ na-anọchi anya n’ilu a
  choice: Ihe na-eko achịcha
  alternative: Yist, ma ọ bụ ntụgharị ga-akọwa ya dị ka ihe ọjọọ
  rationale: Ihe odide a na-atụnyere alaeze eluigwe n’ọrụ ihe na-eko achịcha n’enweghị ịkpọ ya ihe ọma ma ọ bụ ihe ọjọọ. Ya mere, ntụgharị ahụ na-ahapụ ike na mgbagwoju anya nke ihe atụ ahụ ka ọ dị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ịtụ ilu’ bụ akpaalaokwu Igbo kwesịrị ekwesị; e debere ‘zoo n’ime’ iji chekwaa ihe oyiyi pụrụ iche dị n’okwu Grik, ebe nkọwa ndị ọzọ dị n’okpuru peeji.
