id: MAT.13.52
reference: Matthew 13:52
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: ig
  text: Ọ sịrị ha, “N’ihi nke a, onye odeakwụkwọ ọ bụla a zụrụ[a] maka alaeze eluigwe dị ka onyeisi ezinaụlọ[b], onye na-ewepụta n’akụ ya[c] ihe ọhụrụ na ihe ochie.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye e mere ka ọ bụrụ onye na-eso ụzọ alaeze eluigwe.” Okwu Grik ahụ pụrụ ịpụta ma ịbụ onye e mere onye na-eso ụzọ ma ịbụ onye a kụziiri ma ọ bụ a zụrụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “onye nwe ụlọ” ma ọ bụ “onyeisi ụlọ.”
    reason: lexical_alternative
  - marker: c
    text: “Akụ” pụkwara ịpụta ebe nchekwa ihe bara uru, ụlọ akụ, ma ọ bụ ụlọ nkwakọba akụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe Jizọs kwuru tupu nke a, n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: πᾶς γραμματεὺς
  choice: onye odeakwụkwọ ọ bụla
  rationale: Nke a na-edobe isi echiche nke γραμματεύς dịka onye maara akwụkwọ na Iwu; a zere ịkọwa ya naanị dịka onye nkụzi Iwu, nke ga-eme ka ihe okwu Grik pụtara dị warara.
- source_word: μαθητευθεὶς
  choice: a zụrụ
  rationale: Ụdị ngwaa a na-egosi na e mere onye ahụ onye na-eso ụzọ ma ọ bụ na a kụziiri ya. ‘A zụrụ’ na-egosi ọzụzụ na nhazi mmadụ n’enweghị imechi ụzọ nke ịbụ onye na-eso ụzọ.
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: maka alaeze eluigwe
  rationale: ‘Maka’ na-egosi na ọzụzụ ahụ metụtara ma na-akwadebe onye ahụ maka alaeze eluigwe, ebe ọ na-edobekwa ntakịrị mgbagwoju anya dị na dative Grik.
- source_word: ὅμοιός ἐστιν
  choice: dị ka
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi webata ntụnyere.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: onye nwe ụlọ
  rationale: Ọ na-egosi onye nwere ikike na-elekọta ụlọ na ezinụlọ ya, n’enweghị iji okwu ochie ma ọ bụ nke siri ike nghọta.
- source_word: ἐκβάλλει
  choice: wepụta
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara iweta ihe si n’ebe e debere ya, ọ bụghị ịchụpụ ya n’ike.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: na-esite n’ebe ọ na-edebe akụ ya
  rationale: Nke a na-echekwa ma echiche nke ihe bara uru ma echiche nke ebe a na-echekwa ya, bụ́ ụzọ abụọ θησαυρός pụrụ isi pụta.
- source_word: καινὰ καὶ παλαιά
  choice: ihe ọhụrụ na ihe ochie
  rationale: Ọ na-eme ka aha ihe a na-aghọtaghị kpọmkwem dị n’adjective neuter plural doo anya, ma na-edobe usoro ‘ọhụrụ’ tupu ‘ochie’.
theological_decisions:
- issue: Ihe μαθητευθεὶς pụtara n’ihe gbasara odeakwụkwọ na alaeze
  choice: Onye odeakwụkwọ a zụrụ maka alaeze eluigwe
  alternative: Onye odeakwụkwọ ghọrọ onye na-eso ụzọ alaeze eluigwe
  rationale: Nsụgharị a na-edobe echiche nke nkuzi na ịzụ mmadụ dịka onye na-eso ụzọ, n’emeghị ka okwu ahụ bụrụ naanị mgbanwe okwukwe ma ọ bụ naanị agụmakwụkwọ.
- issue: Ihe οἰκοδεσπότης pụtara n’ihe atụ a
  choice: onye nwe ụlọ
  alternative: onyeisi ezinụlọ
  rationale: ‘Onye nwe ụlọ’ na-egosi ọrụ onye na-achị ma na-elekọta ihe dị n’ụlọ, ma ọ dịghị etinye ozizi pụrụ iche banyere usoro ezinụlọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ụdị ntụnyere Jizọs ji kwuo okwu, usoro ‘ihe ọhụrụ na ihe ochie,’ na mgbagwoju anya dị n’okwu ndị metụtara ịbụ onye na-eso ụzọ na θησαυρός.
