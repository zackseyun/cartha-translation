revisions:
- from: O wee sị ha, “N’ihi nke a, onye odeakwụkwọ ọ bụla a zụrụ[a] maka alaeze eluigwe dị ka onye nwe ụlọ[b], onye na-esite n’ebe ọ na-edebe akụ ya[c] wepụta ihe ọhụrụ na ihe ochie.”
  to: Ọ sịrị ha, “N’ihi nke a, onye odeakwụkwọ ọ bụla a zụrụ[a] maka alaeze eluigwe dị ka onyeisi ezinaụlọ[b], onye na-ewepụta n’akụ ya[c] ihe ọhụrụ na ihe ochie.”
  rationale: The revision preserves the source’s lexical flexibility for θησαυρός in the main text and uses a more contextually precise designation for οἰκοδεσπότης. It also changes the mild connective from “O wee sị” to “Ọ sịrị ha,” avoiding an unnecessarily strong temporal inference while leaving “N’ihi nke a” to express Διὰ τοῦτο.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:35:25Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential connection, the passive formative sense of μαθητευθείς, the comparison, and the contrast of new and old. However, rendering ἐκ τοῦ θησαυροῦ αὐτοῦ as “n’ebe ọ na-edebe akụ ya” selects the storage-place sense in the main text, whereas θησαυρός can also mean the treasure/store itself. “n’akụ ya” better retains the Greek expression’s primary value/store ambiguity. “Onye nwe ụlọ” can mean a property owner; “onyeisi ezinaụlọ” more adequately represents οἰκοδεσπότης as the person responsible for and possessing authority in the household.
  naturalness: The revised wording is idiomatic Standard Igbo and retains a dignified, readable biblical register. “Onyeisi ezinaụlọ” is clearer in this context than the potentially property-focused “onye nwe ụlọ.”
  terminology: “Onye odeakwụkwọ” is retained for γραμματεύς, with its contextual sense clarified by the kingdom-related training. “A zụrụ” appropriately represents the passive formative force of μαθητευθείς without excluding the disciple-making sense, which is preserved in the footnote. “Alaeze eluigwe” is Matthew’s established kingdom expression.
  issues:
  - severity: medium
    issue: The main text fixes θησαυρός as a storage location.
    rationale: “N’ebe ọ na-edebe akụ ya” means ‘from the place where he keeps his wealth,’ while the Greek may refer to treasure, a treasury, or a store. The main translation should preserve this lexical breadth; the footnote can state the storage-place alternative.
  - severity: low
    issue: “Onye nwe ụlọ” can underrepresent οἰκοδεσπότης.
    rationale: The expression can primarily suggest ownership of a building. The Greek denotes the master or head of a household; “onyeisi ezinaụlọ” communicates the household-role nuance more directly.
  revised_text: Ọ sịrị ha, “N’ihi nke a, onye odeakwụkwọ ọ bụla a zụrụ[a] maka alaeze eluigwe dị ka onyeisi ezinaụlọ[b], onye na-ewepụta n’akụ ya[c] ihe ọhụrụ na ihe ochie.”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye e mere ka ọ bụrụ onye na-eso ụzọ alaeze eluigwe.” Okwu Grik ahụ pụrụ ịpụta ma ịbụ onye e mere onye na-eso ụzọ ma ịbụ onye a kụziiri ma ọ bụ a zụrụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “onye nwe ụlọ” ma ọ bụ “onyeisi ụlọ.”
    reason: lexical_alternative
  - marker: c
    text: “Akụ” pụkwara ịpụta ebe nchekwa ihe bara uru, ụlọ akụ, ma ọ bụ ụlọ nkwakọba akụ.
    reason: lexical_alternative
  revision_rationale: The revision preserves the source’s lexical flexibility for θησαυρός in the main text and uses a more contextually precise designation for οἰκοδεσπότης. It also changes the mild connective from “O wee sị” to “Ọ sịrị ha,” avoiding an unnecessarily strong temporal inference while leaving “N’ihi nke a” to express Διὰ τοῦτο.
