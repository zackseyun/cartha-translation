- from: Nwa nke Mmadụ ga-ezipụ ndị mmụọ ozi ya, ha ga-esikwa n’alaeze ya chịkọtaa ihe niile na-eduba ndị mmadụ ná mmehie[a], na ndị na-eme ihe megidere iwu[b].
  to: Nwa nke Mmadụ ga-ezipụ ndị mmụọ ozi ya, ha ga-achịtakwa site n’alaeze ya ihe niile na-eduba ná mmehie[a], na ndị na-eme mmebi iwu[b].
  rationale: The revision makes the removal-from-the-kingdom sense explicit in idiomatic Igbo and uses “mmebi iwu” for lawlessness. It retains the title, eschatological register, scope of σκάνδαλα, future tense, and both correctly placed footnote anchors.
