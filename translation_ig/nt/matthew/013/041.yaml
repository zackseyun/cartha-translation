id: MAT.13.41
reference: Matthew 13:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: ig
  text: Nwa nke Mmadụ ga-ezipụ ndị mmụọ ozi ya, ha ga-achịtakwa site n’alaeze ya ihe niile na-eduba ná mmehie[a], na ndị na-eme mmebi iwu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe ịsụ ngọngọ niile.” Okwu Grik ahụ nwere ike izo aka n’ihe ma ọ bụ ndị na-eme ka mmadụ mehie ma ọ bụ dapụ n’okwukwe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ndị na-eme ihe megidere iwu.” Okwu ahụ na-elekwasị anya n’omume nnupụisi megide iwu Chineke nke ghọrọ ụzọ mmadụ si ebi ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: ga-ezipụ
  rationale: Okwu a bụ ngwaa ọdịnihu nke pụtara iziga ndị ọrụ ka ha gaa rụọ ọrụ e nyere ha; “ga-ezipụ” bụ Igbo doro anya nke na-egosipụta iziga ha pụọ maka ọrụ ahụ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-echekwa aha pụrụ iche Jizọs ji akọwa onwe ya, tinyere njikọ ya na ihe oyiyi dị n’akwụkwọ Daniel, n’enweghị ịkọwa ya n’ụzọ ga-eme ka ihe ọ pụtara dị warara.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: ndị mmụọ ozi ya
  rationale: N’ọnọdụ ikpeazụ na ikpe a, ἄγγελοι bụ ndị mmụọ ozi nke eluigwe, ọ bụghị ndị ozi mmadụ.
- source_word: συλλέξουσιν
  choice: ha ga-achịkọtaa
  rationale: “Ịchịkọta” dabara n’ihe atụ owuwe ihe ubi gbara amaokwu a gburugburu ma na-egosi ịkpọkọta ihe n’otu ebe.
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: n’alaeze ya
  rationale: Njikọ “ga-esikwa n’alaeze ya chịkọtaa” na-egosi na a na-ewepụ ihe ndị ahụ site n’ime mpaghara alaeze ya.
- source_word: πάντα τὰ σκάνδαλα
  choice: ihe niile na-eduba ndị mmadụ ná mmehie
  rationale: σκάνδαλα na-ezo aka n’ihe ndị na-eme ka mmadụ mehie ma ọ bụ dapụ n’okwukwe. Nsụgharị a na-eme ka echiche ahụ doo onye Igbo nke oge a anya, ma ọ naghị eme ka ọ bụrụ naanị iwe mmadụ were.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: ndị na-eme ihe megidere iwu
  rationale: Nkebi okwu a na-egosi omume a na-eme dị ka ụzọ ndụ. “Ihe megidere iwu” na-echekwa echiche ἀνομία dị ka nnupụisi ma ọ bụ ileghara iwu Chineke anya.
theological_decisions:
- issue: Otú e si sụgharịa aha ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: “Nwa nke Mmadụ” na-echekwa aha a maara nke ọma na ụda amụma ya, karịsịa njikọ ya na Daniel 7, kama ịkọwa aha ahụ n’ụzọ pụrụ imebi njikọ ahụ.
- issue: Oke ihe πάντα τὰ σκάνδαλα na-agụnye n’ọnọdụ ikpe a
  choice: ihe niile na-eduba ndị mmadụ ná mmehie
  alternative: ihe ịsụ ngọngọ niile
  rationale: Okwu Grik ahụ nwere ike ịgụnye ihe, mmetụta, ma ọ bụ ndị na-akpata mmehie. Nsụgharị bụ isi na-echekwa echiche sara mbara nke ihe na-eduba mmadụ ná mmehie, ebe ndetu na-enye ihe atụ okwu nso karị.
- issue: Ụdị omume dị na τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: ndị na-eme ihe megidere iwu
  alternative: ndị na-eme mmebi iwu
  rationale: Present participle ahụ nwere ike igosi omume a na-ahụkarị n’ụzọ ndụ mmadụ. E zere ịgbakwunye okwu dịka “na-anọgide” n’amaokwu n’onwe ya, ka a ghara ime ka ike ụtọasụsụ ahụ sie ike karịa ka o kwesịrị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Nwa nke Mmadụ,” “ndị mmụọ ozi,” na “alaeze” na-echekwa okwu Baịbụl ndị a maara nke ọma; ebe “ihe niile na-eduba ndị mmadụ ná mmehie” na-eme ka okwu ihe atụ Grik doo anya n’enweghị imechi oke ihe ọ pụrụ ịgụnye. E tinyere akara ndetu [a] n’ebe σκάνδαλα dị, ọ bụghị n’ebe “ndị mmụọ ozi” dị, n’ihi na ọ bụ okwu ahụ ka ndetu ahụ na-akọwa.
