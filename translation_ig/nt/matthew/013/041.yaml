review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the Son of Man, his angels, the future gathering, and the two classes gathered. However, “ha ga-esikwa n’alaeze ya chịkọtaa” is syntactically strained and makes the removal sense of ἐκ less clear than a direct “site n’alaeze ya.” The final phrase is better rendered with the established legal/moral sense of ἀνομία as “mmebi iwu.”
  naturalness: Most wording is clear Standard Igbo, but the combined construction “ga-esikwa n’alaeze ya chịkọtaa” is not idiomatic. Recasting the clause produces a smoother and clearer sentence.
  terminology: “Nwa nke Mmadụ,” “ndị mmụọ ozi,” and “alaeze” are appropriate biblical-register terms. “Ihe niile na-eduba ná mmehie” preserves the active force of σκάνδαλα without restricting it to personal offense. “Ndị na-eme mmebi iwu” better represents ἀνομία than the broader “ndị na-eme ihe megidere iwu.”
  issues:
  - severity: medium
    issue: The phrase expressing ἐκ τῆς βασιλείας αὐτοῦ is awkward and insufficiently direct.
    rationale: “Ha ga-esikwa n’alaeze ya chịkọtaa” can be parsed awkwardly. “Ha ga-achịkọta site n’alaeze ya” clearly expresses gathering/removal from his kingdom.
  - severity: low
    issue: The rendering of ἀνομία is somewhat broad.
    rationale: “Ihe megidere iwu” can describe any unlawful act, while “mmebi iwu” more directly retains the noun’s sense of lawlessness/law-breaking.
  revised_text: Nwa nke Mmadụ ga-ezipụ ndị mmụọ ozi ya, ha ga-achịtakwa site n’alaeze ya ihe niile na-eduba ná mmehie[a], na ndị na-eme mmebi iwu[b].
