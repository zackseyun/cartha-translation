  verdict: revise
  source_fidelity: The draft accurately represents the future statement, the angels, and the separation of wicked people from righteous people. However, “oge a” adds the demonstrative sense “this age,” which is not explicit in τοῦ αἰῶνος, and “n’etiti” alone does not clearly render ἐκ μέσου (“from among/out of the midst of”).
  naturalness: 'The proposed revision uses idiomatic Standard Igbo: “n’ọgwụgwụ oge ahụ” naturally conveys the temporal phrase, and “site n’etiti” clearly marks removal from within a group.'
  terminology: “Ndị mmụọ ozi,” “ndị ajọ omume,” and “ndị ezi omume” are suitable, recognizable Standard Igbo terms and preserve the judgment-register contrast without imposing an interpretive doctrine.
  issues:
  - severity: medium
    issue: “oge a” adds “this” to the Greek phrase.
    rationale: The source has “of the age,” without a demonstrative pronoun. “Oge ahụ” can express the definite referent naturally in Igbo without specifying “this age.”
  - severity: medium
    issue: The separation phrase lacks an explicit equivalent for ἐκ (“from/out of”).
    rationale: “Kewapụ ndị ajọ omume n’etiti ndị ezi omume” can sound incomplete or ambiguous. “Kewapụ ... site n’etiti ...” clearly preserves separation out from among the righteous.
