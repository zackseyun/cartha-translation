  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: ig
  text: 'Otú a ka ọ ga-adị n’ọgwụgwụ oge ahụ: ndị mmụọ ozi ga-apụ, kewapụ ndị ajọ omume site n’etiti ndị ezi omume.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’oge mmezu nke oge ahụ.” Ụfọdụ ntụgharị ọdịnala na-ekwu, “n’ọgwụgwụ ụwa,” ma okwu Grik bụ αἰών, nke pụtara “oge,” ọ bụghị “ụwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Otú ahụ
  rationale: Ọ na-ejikọta nkọwa a na ihe atụ gara aga ma na-egosi, n'Igbo dị mfe, ‘n'ụzọ dị otu a.’
- source_word: ἔσται
  choice: ka ọ ga-adị
  rationale: Nke a na-egosipụta ọdịnihu nke εἰμί n'ụzọ doro anya ma bụrụkwa okwu Igbo e ji eme ihe ugbu a.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: ná ngwụcha oge a
  rationale: ‘Ngwụcha’ na-egosi mmezu ma ọ bụ njedebe; ‘oge a’ na-egosipụta αἰών dị ka oge ma ọ bụ usoro dị ugbu a, ọ bụghị ụwa nkịtị.
- source_word: ἐξελεύσονται
  choice: ga-apụ
  rationale: Ọ bụ ntụgharị kwụ ọtọ na nke sitere n'okike maka mmegharị ịpụ.
- source_word: οἱ ἄγγελοι
  choice: ndị mmụọ ozi
  rationale: N'ọnọdụ ikpe ikpeazụ a, okwu ahụ na-ezo aka na ndị mmụọ ozi nke eluigwe, ọ bụghị ndị ozi mmadụ.
- source_word: ἀφοριοῦσιν
  choice: kewapụ
  rationale: Ọ na-egosipụta ikewapụ otu ndị mmadụ n'ime ìgwè ọzọ nke ha na ya nọkọrọ.
- source_word: τοὺς πονηροὺς
  choice: ndị ajọ omume
  rationale: Adjective ahụ ghọrọ aha ìgwè mmadụ; okwu a na-egosi ndị na-eme ihe ọjọọ n'ụzọ doro anya na nkwanye ùgwù.
- source_word: ἐκ μέσου
  choice: n’etiti
  rationale: N'usoro ‘kewapụ ... n’etiti,’ ọ na-egosi na a na-ewepụ ha n'ime ìgwè agwakọtara.
- source_word: τῶν δικαίων
  choice: ndị ezi omume
  rationale: Ọ bụ okwu Igbo doro anya maka ndị a na-akpọ ndị ziri ezi n'ọnọdụ ikpe a.
theological_decisions:
- issue: Ihe αἰών pụtara n'okwu gbasara ọgwụgwụ
  choice: oge a
  alternative: ụwa
  rationale: αἰών na-ezo aka n'oge ma ọ bụ usoro dị ugbu a. Ya mere, a zere ‘ụwa,’ nke nwere ike ime ka a ghọta na amaokwu ahụ na-ekwu kpọmkwem banyere mbibi ụwa nkịtị.
- issue: Ndị οἱ ἄγγελοι bụ
  choice: ndị mmụọ ozi nke eluigwe
  alternative: ndị ozi mmadụ
  rationale: Nkọwa Jizọs banyere ikpe ikpeazụ na-egosi na ndị a bụ ndị mmụọ ozi nke eluigwe; nke a bụ mkpebi sitere n'ọnọdụ okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma dị ùgwù, dee ya. ‘Ná ngwụcha oge a’ na-edobe ọdịiche dị n’etiti αἰών (‘oge/usoro oge’) na ‘ụwa,’ ebe ‘ndị ezi omume’ na ‘ndị ajọ omume’ na-eme ka ọdịiche ikpe ahụ doo anya.
