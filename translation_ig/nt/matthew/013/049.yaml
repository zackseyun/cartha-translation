  to: 'Otú a ka ọ ga-adị n’ọgwụgwụ oge ahụ: ndị mmụọ ozi ga-apụ, kewapụ ndị ajọ omume site n’etiti ndị ezi omume.[a]'
  rationale: The revision removes the unsupported demonstrative “a” (“this”) while retaining a natural definite expression for τοῦ αἰῶνος. It also supplies “site na,” which accurately conveys ἐκ μέσου, “from among.” The footnote remains anchored at the age phrase and preserves the lexical alternative without making claims beyond the Greek wording.
