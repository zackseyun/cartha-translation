  terminology: ‘Alaeze’ and ‘Onye Ọjọọ’ are suitable established biblical terms in Standard Igbo. ‘Ahịhịa ọjọọ’ is an accessible rendering for ζιζάνια; the lexical note may retain the more specific identification, darnel.
