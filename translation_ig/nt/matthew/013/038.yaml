id: MAT.13.38
reference: Matthew 13:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: ig
  text: Ubi ahụ bụ ụwa; ezi mkpụrụ ahụ bụ ụmụ nke alaeze ahụ.[a] Ma ahịhịa ọjọọ ahụ[b] bụ ụmụ nke Onye Ọjọọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụmụ nke alaeze ahụ” pụtara ndị bụ nke alaeze ahụ.
    reason: cultural_note
  - marker: b
    text: “Ahịhịa ọjọọ” nwere ike ịpụta kpọmkwem ụdị ahịhịa yiri ọka wit mgbe ọ ka na-eto, nke a na-akpọ darnel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρός
  choice: ubi
  rationale: “Ubi” bụ okwu Igbo nkịtị na nke doro anya maka ala a kụrụ ihe, ma na-edobe ihe atụ ọrụ ugbo ahụ.
- source_word: κόσμος
  choice: ụwa
  rationale: N'ebe a, “ụwa” na-egosi ebe sara mbara ihe a kọwara n'ilu ahụ na-eme.
- source_word: καλὸν σπέρμα
  choice: ezi mkpụrụ
  rationale: Nke a na-edobe ihe atụ mkpụrụ a kụrụ ma gosipụta ọdịiche ya na ahịhịa ọjọọ.
- source_word: οὗτοί εἰσιν
  choice: bụ ụmụ
  rationale: Okwu Grik ahụ si n'aha mkpụrụ nke na-anọchi ọtụtụ mmadụ gafee n'ebe ndị mkpụrụ ahụ nọchiri anya nọ; Igbo na-egosipụta nke a n'ụzọ ebumpụta ụwa site n'ịsị “bụ ụmụ.”
- source_word: υἱοὶ τῆς βασιλείας
  choice: ụmụ nke alaeze ahụ
  rationale: “Ụmụ nke” bụ okwu mmekọrịta ebumpụta ụwa n'Igbo nke nwere ike ịgụnye ndị niile e ji okwu ahụ mara, ma “alaeze” na-edobe asụsụ alaeze dị na Matiu.
- source_word: ζιζάνια
  choice: ahịhịa ọjọọ
  rationale: Ọ bụ okwu ndị na-agụ Igbo ugbu a ga-aghọta ngwa ngwa maka ahịhịa na-adịghị mma nke toro n'etiti ihe a kụrụ; aha ụdị ahịhịa ahụ kpọmkwem adịghị mkpa n'ahịrị a.
- source_word: τοῦ πονηροῦ
  choice: nke Onye Ọjọọ
  rationale: Nkọwa Grik nwere artikụl na ụdị nwoke otu, n'ọnọdụ a, na-akwado onye a na-ekwu maka ya, ọ bụghị naanị ihe ọjọọ dị ka echiche.
theological_decisions:
- issue: Ma τοῦ πονηροῦ ọ̀ na-ekwu banyere onye ma ọ bụ banyere ihe ọjọọ n'ozuzu
  choice: Onye Ọjọọ
  alternative: ihe ọjọọ
  rationale: Ụdị okwu Grik ahụ na usoro nkọwa ilu a na-akwado ịghọta ya dị ka onye; ntụgharị ahụ akpọghị ya Setan ma ọ bụ ekwensu, ka ọ ghara ịgbakwunye ihe aha Grik ekwughị kpọmkwem.
- issue: Otu e si tụgharịa υἱοὶ n'okwu mmekọrịta a
  choice: ụmụ
  alternative: ụmụ nwoke
  rationale: N'Igbo, “ụmụ nke alaeze” bụ okwu nnọchiteanya mmekọrịta nke na-akọwa ndị bụ nke alaeze ahụ; “ụmụ nwoke” ga-eme ka uche gaa n'akụkụ nwoke naanị, nke na-abụghị isi okwu okwu a n'ebe a.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro nkọwa atọ nke Grik site n'iji semicolon na ahịrịokwu nke abụọ, ma zere ntụgharị okwu n'okwu nke ga-ada arọ n'Igbo.
