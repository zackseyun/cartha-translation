revisions:
- from: Ya mere, dị nnọọ ka a na-achịkọta ahịhịa ọjọọ[a] were ọkụ agba ha, otu ahụ ka ọ ga-adị na njedebe nke oge a[b].
  to: Ya mere, dịka a na-achịkọta ahịhịa ọjọọ[a] ma kpọọ ha n’ọkụ, otu ahụ ka ọ ga-adị n’ọgwụgwụ nke oge[b].
  rationale: The revision replaces an unnatural and potentially misleading expression for burning with an idiomatic Igbo construction, removes the unsupported addition “a” (“this”) from the rendering of αἰών, and sharpens the footnote so that it reflects the relevant textual alternative without overextending the lexical range in this context.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:34:52Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the comparison, future reference, and temporal sense of τοῦ αἰῶνος. However, “were ọkụ agba ha” does not naturally mean “burn them” in Standard Igbo and can suggest striking or shooting them with fire. The revised wording explicitly conveys burning in fire. “Oge a” adds “this,” which is not expressed in the Greek.
  naturalness: “A na-achịkọta … ma kpọọ ha n’ọkụ” is clear, idiomatic Standard Igbo for gathering weeds and burning them. “N’ọgwụgwụ nke oge” naturally expresses the eschatological culmination without requiring an added demonstrative.
  terminology: “Ahịhịa ọjọọ” is an appropriate accessible rendering of ζιζάνια. The footnote retains the cautious identification with darnel. “Oge” appropriately renders αἰών here; the alternative “ụwa” is correctly confined to a footnote as a traditional rendering.
  issues:
  - severity: high
    issue: The phrase “were ọkụ agba ha” is not a natural or reliable rendering of πυρὶ καίεται.
    rationale: In Standard Igbo, agba can carry senses such as strike, shoot, or apply, rather than the intended “burn.” “Ma kpọọ ha n’ọkụ” clearly renders the action of being burned and retains the explicit fire imagery.
  - severity: medium
    issue: “Oge a” adds a demonstrative not present in τοῦ αἰῶνος.
    rationale: Although “this age” may be inferred from context, the Greek says “the age,” not explicitly “this age.” “Oge” preserves the source’s wording and ambiguity.
  - severity: low
    issue: Footnote b presents “ọgbọ” as though it were an equally relevant alternative in this context.
    rationale: While αἰών may have various lexical senses, the eschatological phrase συντέλεια τοῦ αἰῶνος is best represented here as “end of the age.” The footnote should state the traditional “world” alternative without introducing a less fitting contextual gloss.
  revised_text: Ya mere, dịka a na-achịkọta ahịhịa ọjọọ[a] ma kpọọ ha n’ọkụ, otu ahụ ka ọ ga-adị n’ọgwụgwụ nke oge[b].
  revised_footnotes:
  - marker: a
    text: Okwu Grik a na-ezo aka n’ahịhịa na-emerụ ihe ọkụkụ, ikekwe ụdị a na-akpọ darnel.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ nsụgharị ọdịnala sịrị, “nke ụwa”; okwu Grik ahụ bụ “nke oge.”
    reason: alternative_reading
  revision_rationale: The revision replaces an unnatural and potentially misleading expression for burning with an idiomatic Igbo construction, removes the unsupported addition “a” (“this”) from the rendering of αἰών, and sharpens the footnote so that it reflects the relevant textual alternative without overextending the lexical range in this context.
