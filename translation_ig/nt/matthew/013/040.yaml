  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: ig
  text: Ya mere, dịka a na-achịkọta ahịhịa ọjọọ[a] ma kpọọ ha n’ọkụ, otu ahụ ka ọ ga-adị n’ọgwụgwụ nke oge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a na-ezo aka n’ahịhịa na-emerụ ihe ọkụkụ, ikekwe ụdị a na-akpọ darnel.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ nsụgharị ọdịnala sịrị, “nke ụwa”; okwu Grik ahụ bụ “nke oge.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: Ya mere, dị nnọọ ka
  rationale: “Ya mere” na-egosi nkwubi okwu ma ọ bụ njikọ ya na nkọwa bu ụzọ, ebe “dị nnọọ ka” na-ebute ntụnyere ahụ.
- source_word: συλλέγεται
  choice: a na-achịkọta
  rationale: Ọ bụ ngwaa nke na-egosi na ihe ndị ahụ na-anata omume; “a na-achịkọta” bụ Igbo doro anya ma kwekọọ n’ọrụ ubi a na-ekwu maka ya.
- source_word: τὰ ζιζάνια
  choice: ahịhịa ọjọọ
  rationale: Okwu Grik a na-ezo aka n’ahịhịa na-emerụ ihe ọkụkụ, ikekwe darnel. “Ahịhịa ọjọọ” bụ okwu ndị Igbo nke oge a ga-aghọta ngwa ngwa, n’emeghị ka ụdị ahịhịa ahụ bụrụ nke a kpọmkwem karịa ihe ederede kwuru.
- source_word: πυρὶ καίεται
  choice: were ọkụ agba ha
  rationale: Nke a na-edobe ọkụ dịka ụzọ e si agba ahịhịa ahụ, ma na-ada nke ọma n’Igbo nkịtị.
- source_word: οὕτως ἔσται
  choice: otu ahụ ka ọ ga-adị
  rationale: Ọ na-edobe njikọ ntụnyere ahụ na ihe ga-eme n’ọdịnihu.
- source_word: ἐν τῇ συντελείᾳ
  choice: na njedebe
  rationale: “Na njedebe” bụ okwu doro anya nke na-egosi oge ihe ahụ ga-eru na mmezu ya, n’ejighị okwu siri ike nghọta.
- source_word: τοῦ αἰῶνος
  choice: nke oge a
  rationale: αἰών nwere isi echiche gbasara oge ma ọ bụ ọgbọ, ọ bụghị ụwa dịka mbara ihe e kere eke. “Oge a” na-enye nghọta ebumpụta ụwa n’Igbo, ebe nkọwa ala peeji na-egosi na “a” adịghị n’ederede Grik kpọmkwem.
theological_decisions:
- issue: Nkebiokwu gbasara ọgwụgwụ, τοῦ αἰῶνος
  choice: nke oge a
  alternative: nke ụwa
  rationale: Nhọrọ a na-echekwa echiche αἰών dịka oge ma ọ bụ ọgbọ, ma zere ime ka okwu ahụ bụrụ mbibi nke ụwa nkịtị. E tinyere nkọwa iji gosi na Grik kwuru naanị “nke oge,” n’ihi ya a naghị ezobe ntakịrị nkọwa ntụgharị dị na “oge a.”
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ntụnyere ahụ n’usoro doro anya, ma jiri nkọwa ala peeji kọwaa ụdị ahịhịa ahụ na nghọta αἰών n’enweghị itinye ozizi otu ụka.
