id: MAT.13.58
reference: Matthew 13:58
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐποίησεν ἐκεῖ δυνάμεις πολλὰς διὰ τὴν ἀπιστίαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: ig
  text: O meghịkwa ọtụtụ ọrụ dị ike n’ebe ahụ n’ihi ekweghị ekwe ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, ‘ọtụtụ ọrụ ebube’ ma ọ bụ ‘ọtụtụ ọrụ nke ike.’ Okwu Grik ahụ na-ekwu maka ọrụ ndị na-egosipụta ike, ma n’ebe a ọ na-ezo aka n’ọrụ ebube.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: O meghịkwa
  rationale: Nke a na-edobe καί dị ka njikọ akụkọ na οὐκ ἐποίησεν dị ka ihe o meghị, n’enweghị ịgbakwunye echiche na ọ pụghị ime ya.
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi ebe ahụ a kpọtụrụ aha n’akụkọ banyere obodo ya.
- source_word: δυνάμεις πολλὰς
  choice: ọtụtụ ọrụ dị ike
  rationale: ‘Ọrụ dị ike’ na-edobe njikọ δύναμις na ike, ma n’ọnọdụ a ọ na-ezo aka n’ọrụ ebube; πολλὰς bụ ‘ọtụtụ.’
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: n’ihi ekweghị ekwe ha
  rationale: διά ya na accusative na-egosi ihe kpatara ya, ebe ἀπιστία pụtara ekweghị ekwe ma ọ bụ enweghị okwukwe; ‘ekweghị ekwe’ na-edobe ike okwu ahụ n’ọnọdụ a.
theological_decisions:
- issue: Ma amaokwu a ọ na-ekwu na Jizọs enweghị ike ime ọrụ ndị ahụ, ka ọ̀ bụ naanị na o meghị ha n’ihi ekweghị ekwe ha
  choice: ‘O meghịkwa ọtụtụ ọrụ dị ike’
  alternative: ‘Ọ pụghị ime ọtụtụ ọrụ ebube’
  rationale: Grik kwuru οὐκ ἐποίησεν, ya bụ ‘o meghị,’ ọ bụghị okwu na-egosi enweghị ike. Nsụgharị ahụ anaghị edozi esemokwu nkà mmụta okpukpe karịa ihe Matiu kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe dị mfe, dị ùgwù, ma kwekọọ n’ụzọ ndị mmadụ si ekwu taa. E ji ‘ọrụ dị ike’ chekwaa echiche banyere ike dị na okwu Grik, ebe nkọwa ala peeji na-eme ka ihe ọ pụtara n’ọnọdụ a doo anya.
