  terminology: “Ọrụ dị ike” preserves the lexical connection with δύναμις (power/mighty deed), while “ekweghị ekwe” appropriately renders ἀπιστία without weakening it to mere uncertainty or importing doctrinal interpretation. The footnote alternatives are accurate and properly anchored.
