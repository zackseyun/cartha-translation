  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: ig
  text: Onye iro ahụ nke kụrụ ha bụ ekwensu; owuwe ihe ubi ahụ bụ ọgwụgwụ oge ahụ[a], ndị na-ewe ihe ubi bụkwa ndị mmụọ ozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mmezu zuru oke nke oge ahụ”; dịka ntụgharị ọdịnala si kwuo, “ọgwụgwụ ụwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: onye iro
  rationale: Nke a bụ okwu Igbo doro anya maka onye na-emegide onye ọzọ, ma na-echekwa na onye ahụ bụ onye kpọmkwem n’akụkọ ilu a.
- source_word: ὁ σπείρας
  choice: nke kụrụ
  rationale: “Kụrụ” na-egosipụta omume ịgha mkpụrụ nke e mezuru, ma kwekọọ n’ihe atụ ọrụ ugbo dị n’akụkọ ilu ahụ.
- source_word: αὐτά
  choice: ha
  rationale: Ọ na-arụtụ aka n’ahịhịa ọjọọ ndị onye iro kụrụ, ma bụrụ ụzọ nkịtị e si atụgharị nnọchiaha a n’Igbo.
- source_word: διάβολος
  choice: ekwensu
  rationale: N’ebe a, okwu Grik a bụ aha a maara nke ọma maka onye iro ahụ, ọ bụghị naanị nkọwa nke onye na-ekwutọ mmadụ.
- source_word: θερισμὸς
  choice: owuwe ihe ubi
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa maka harvest, ma na-echekwa ihe atụ ọrụ ugbo ahụ.
- source_word: συντέλεια αἰῶνός
  choice: ọgwụgwụ nke oge a
  rationale: “Oge a” na-echekwa echiche αἰών dị ka oge ma ọ bụ ọgbọ nke ụwa dị ugbu a, kama ime ka ọ pụta ozugbo dịka mbibi nke ụwa e kere eke. “Ọgwụgwụ” na-ekwupụta njedebe ya, ebe nkọwa ala peeji na-echekwa echiche nke iru n’uju.
- source_word: θερισταὶ
  choice: ndị na-ewe ihe ubi
  rationale: Nkebiokwu a doro ndị na-agụ Igbo anya ozugbo ma na-echekwa ihe atụ nke ndị ọrụ owuwe ihe ubi.
- source_word: ἄγγελοί
  choice: ndị mmụọ ozi
  rationale: Ọnọdụ ikpeazụ nke oge a na-egosi na ndị e kwuru bụ ndị ozi eluigwe, ya mere okwu Igbo a dabara karịa naanị “ndị ozi.”
- source_word: δὲ
  choice: nhazi ahịrịokwu na “bụkwa”
  rationale: δὲ ndị a na-akwalite nkọwa ahụ site n’otu akụkụ gaa n’ọzọ; akara edemede na “bụkwa” na-eme ka nke a daa nke ọma n’Igbo n’enweghị ikwughachi njikọ na-adịghị mkpa.
theological_decisions:
- issue: Ntughari αἰών n’okwu gbasara njedebe, συντέλεια αἰῶνός
  choice: ọgwụgwụ nke oge a
  alternative: ọgwụgwụ ụwa; mmezu zuru oke nke oge a
  rationale: Nhọrọ a na-echekwa nghọta αἰών dị ka oge dị ugbu a, ma zere ịmanye echiche na ihe e kere eke ga-ala n’iyi kpamkpam. Nkọwa ala peeji na-egosi na συντέλεια nwekwara echiche nke iru n’uju ma ọ bụ mmezu zuru oke.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. “Oge a” na-eme ka ntụaka ahụ bụrụ oge ụwa dị ugbu a, ebe “ndị mmụọ ozi” na-eme ka ụdị ndị ozi ahụ doo anya.
