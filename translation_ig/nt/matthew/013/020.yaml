  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: ig
  text: Ma onye ahụ a kụrụ n’ala nkume juru[a] bụ onye na-anụ okwu ahụ ma na-eji ọṅụ anabata ya ozugbo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karịa, “onye ahụ a kụrụ n’ebe nkume juru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: Ma onye ahụ a kụrụ n’ala nkume juru
  rationale: Nkebi okwu a na-arụ ọrụ dị ka aha ma na-ezo azụ n’ihe atụ nke ịkụ mkpụrụ na ụdị ala. “Ma” na-egosi mgbanwe dị nro nke δέ, ebe “onye ahụ a kụrụ” na-edobe mkpakọ ihe atụ dị na Grik n’etinyeghị “mkpụrụ” n’amaokwu ahụ.
- source_word: πετρώδη
  choice: ala nkume juru
  rationale: Nke a bụ okwu Igbo doro anya ma dị ndụ maka ala nwere ọtụtụ nkume, ma na-edobe onyinyo ọrụ ugbo nke ilu ahụ.
- source_word: σπαρείς
  choice: a kụrụ
  rationale: Nke a na-edobe olu nnara nke participle aorist Grik ma na-adaba n’okwu a na-eji maka ịkụ mkpụrụ n’Igbo.
- source_word: οὗτός ἐστιν
  choice: bụ onye
  rationale: Nke a na-enye njirimara kpọmkwem dị na Grik n’enweghị ịgbasa ya ka ọ bụrụ “na-anọchi anya onye.”
- source_word: ὁ τὸν λόγον ἀκούων
  choice: onye na-anụ okwu ahụ
  rationale: Relative clause a bụ Igbo ebumpụta ụwa maka participle Grik. “Okwu ahụ” na-edobe okwu isiokwu λόγος kama ịkọwa ya dịka “ozi.”
- source_word: εὐθὺς
  choice: ozugbo
  rationale: “Ozugbo” na-egosi ngwa ngwa nke nzaghachi ahụ n’ụzọ doro anya ma bụrụkwa okwu Igbo a na-ejikarị eme ihe.
- source_word: μετὰ χαρᾶς
  choice: ji ọṅụ
  rationale: Usoro a bụ ụzọ Igbo ebumpụta ụwa isi kwuo na e ji ọṅụ mee ihe, ma na-edobe aha χαρά.
- source_word: λαμβάνων αὐτόν
  choice: nabata ya
  rationale: N’ebe a λαμβάνω pụtara ịnata ma ọ bụ ịnabata. “Ya” na-ezo azụ n’“okwu ahụ” n’ụzọ doro anya.
theological_decisions:
- issue: Ihe “onye ahụ a kụrụ” na-ezo aka na ya n’ọkpụkpọ ilu ahụ
  choice: E debere ya dịka “onye ahụ a kụrụ n’ala nkume juru,” ka nkebi na-esochi ya kọwaa na ọ bụ onye na-anụ okwu ahụ.
  alternative: Ịsụgharị ya n’ụzọ nkọwa karịa dịka “mkpụrụ a kụrụ n’ala nkume juru na-anọchi anya onye...”
  rationale: Grik jikọtara onyinyo mkpụrụ a kụrụ na onye na-anụ okwu ahụ n’ụzọ mkpirikpi. Nsụgharị a na-edobe mgbagwoju anya ahụ n’enweghị idozi ya site n’ịgbakwunye nkọwa na-adịghị n’ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ala nkume juru” maka okwu ugbo ebumpụta ụwa, ebe e debere usoro ihe atụ “onye ahụ a kụrụ” iji ghara ikpochapụ ụma njikọta dị n’etiti mkpụrụ na onye na-anụ okwu ahụ.
