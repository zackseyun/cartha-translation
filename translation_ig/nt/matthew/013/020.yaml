    rationale: The Greek coordinates present participles, describing the kind of person in view. A present/habitual Igbo construction gives a smoother reading while preserving the immediacy and joy.
  - severity: low
    issue: The footnote wording is unnecessarily cumbersome.
    rationale: A shorter Standard Igbo note can state the lexical alternative clearly without altering its function or the source ambiguity.
