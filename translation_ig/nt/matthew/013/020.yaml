  source_fidelity: The draft accurately retains the compressed metaphor of the substantival passive participle (“onye ahụ a kụrụ”), the rocky terrain, hearing “the word,” and the immediate joyful reception. “A kụrụ” is an appropriate Igbo passive rendering in the agricultural image. The revision retains all of these features.
