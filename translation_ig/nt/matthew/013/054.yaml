id: MAT.13.54
reference: Matthew 13:54
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: ig
  text: Mgbe ọ bịarutere n’obodo ya, ọ nọ na-akụziri ha ihe n’ụlọ nzukọ ha; n’ihi ya, o juru ha anya nke ukwuu, ha wee sị, “Olee ebe nwoke a si nweta amamihe a na ike ndị a[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọrụ ebube”; ya bụ, omume ndị na-egosipụta ike pụrụ iche.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: obodo ya
  rationale: N’ọnọdụ akụkọ a, okwu ahụ na-ezo aka n’obodo ebe a maara Jizọs dị ka onye obodo ahụ, ọ bụghị mba dum. “Obodo ya” bụ okwu Igbo doro anya ma dịkwa mfe nghọta.
- source_word: ἐδίδασκεν
  choice: ọ nọ na-akụziri ha ihe
  rationale: Ụdị imperfect Grik na-egosi omume nọ na-aga n’ihu n’oge gara aga; “ọ nọ na-akụziri” na-echekwa akụkụ ahụ.
- source_word: συναγωγῇ
  choice: ụlọ nzukọ
  rationale: N’ọnọdụ ndị Juu a, okwu ahụ na-ezo aka n’ebe ha na-ezukọ maka ofufe na nkuzi. “Ụlọ nzukọ” bụ nsụgharị Igbo a na-aghọta nke ọma.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: Ihe a juru ha anya nke ukwuu, ha wee sị
  rationale: ὥστε na-egosi ihe nkuzi ya rụpụtara. Nkebi ahịrịokwu Igbo a na-egosipụta nsonaazụ ahụ n’ụzọ eke, ebe “nke ukwuu” na-echekwa ịdị ike nke ἐκπλήσσομαι.
- source_word: Πόθεν
  choice: Olee ebe ... si nweta
  rationale: Πόθεν na-ajụ ebe ihe si malite. Usoro a bụ Igbo nkịtị ma na-egosi na ha na-ajụ isi mmalite amamihe na ọrụ ike ya.
- source_word: τούτῳ
  choice: nwoke a
  rationale: Demonstrative ahụ nwere ike igosi ntakịrị ịdọpụ onwe ha n’ebe Jizọs nọ. “Nwoke a” na-ebute ụda ahụ n’Igbo n’enweghị mgbakwunye nkọwa.
- source_word: σοφία
  choice: amamihe
  rationale: Nke a bụ nsụgharị kpọmkwem na nke a na-ejikarị eme σοφία.
- source_word: δυνάμεις
  choice: ọrụ ike
  rationale: N’ebe a, ọtụtụ δυνάμεις na-ezo aka n’omume ndị gosipụtara ike. “Ọrụ ike” na-ada nke ọma n’Igbo ma na-echekwa njikọ okwu ahụ na ike, na-enweghị imechi ya ozugbo ka ọ bụrụ naanị “ọrụ ebube.”
theological_decisions:
- issue: Otú e si asụgharị δυνάμεις gbasara omume pụrụ iche Jizọs
  choice: ọrụ ike
  alternative: ọrụ ebube
  rationale: “Ọrụ ike” na-echekwa echiche bụ isi nke δύναμις—ike nke na-apụta ìhè n’omume—ma ghara ịkọwa okwu ahụ karịa ka Grik si mee. “Ọrụ ebube” bụkwa nghọta ziri ezi n’ọnọdụ a, ya mere e tinyere ya n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ogologo Grik ahụ ụzọ abụọ ka ọ daa nke ọma n’Igbo, ma e chekwara njikọ nke ihe kpatara ịtụnanya ha na okwu ha kwuru.
