- from: Mgbe ọ bịarutere n’obodo ya, ọ nọ na-akụziri ha ihe n’ụlọ nzukọ ha. Ihe a juru ha anya nke ukwuu, ha wee sị, “Olee ebe nwoke a si nweta amamihe a na ọrụ ike ndị a[a]?”
  to: Mgbe ọ bịarutere n’obodo ya, ọ nọ na-akụziri ha ihe n’ụlọ nzukọ ha; n’ihi ya, o juru ha anya nke ukwuu, ha wee sị, “Olee ebe nwoke a si nweta amamihe a na ike ndị a[a]?”
  rationale: The revision replaces the potentially misleading expression “ọrụ ike” with “ike,” which directly reflects δυνάμεις and leaves its precise reference appropriately open. The retained footnote supplies the contextual alternative “ọrụ ebube.” The result relation of ὥστε is also expressed more clearly without altering the verse’s meaning.
