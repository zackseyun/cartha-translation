  text: καὶ ἐλάλησεν αὐτοῖς πολλὰ ἐν παραβολαῖς λέγων· Ἰδοὺ ἐξῆλθεν ὁ σπείρων τοῦ σπείρειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/003.yaml
  text: 'And he spoke many things to them in parables, saying: “Look, the sower went out to sow.”'
translation:
  language: ig
  text: 'O wee gwa ha ọtụtụ ihe n’ilu, sị: “Lee, onye na-agha mkpụrụ pụrụ ịgha mkpụrụ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραβολαῖς
  choice: n’ilu
  rationale: “Ilu” bụ okwu Igbo a na-aghọta nke ọma maka akụkọ ntụnyere e ji akụzi eziokwu; “n’ilu” na-egosipụtakwa ụdị ụzọ o si gwa ha okwu.
- source_word: Ἰδού
  choice: Lee
  rationale: “Lee” bụ oku e ji adọta uche onye na-ege ntị, kwekọrọ n’ọrụ Ἰδού ebe a.
- source_word: ὁ σπείρων
  choice: onye na-agha mkpụrụ
  rationale: Na-egosipụta onye ọrụ ya bụ ịgha mkpụrụ n’enweghị ịgbakwunye ụdị mkpụrụ ma ọ bụ nkọwa ọzọ.
- source_word: ἐξῆλθεν
  choice: pụrụ ịga
  rationale: Ngwakọta okwu a na-egosi na onye ahụ siri ebe ọ nọ pụọ gaa rụọ ọrụ ahụ, ma na-ada n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: τοῦ σπείρειν
  choice: ịgha mkpụrụ
  rationale: Na-edobe ebumnuche ọpụpụ ahụ dịka infinitive ebumnuche nke Grik si dị.
