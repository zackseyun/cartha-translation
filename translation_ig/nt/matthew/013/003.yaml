translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro akụkọ ahụ na oku “Lee” n’enweghị ịgbakwunye nkọwa ozizi.
