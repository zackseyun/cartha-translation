id: MAT.13.13
reference: Matthew 13:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: ig
  text: Ọ bụ n’ihi nke a ka m ji ilu agwa ha okwu, n’ihi na ha na-ahụ ma ha anaghị ahụ, ha na-anụ ma ha anaghị anụ, ha anaghịkwa aghọta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Ọ bụ n’ihi nke a
  rationale: Ọ na-egosi ihe kpatara Jizọs ji agwa ha okwu n’ilu, ma ọ naghị eme ka okwu ahụ bụrụ nanị nkwubi okwu.
- source_word: ἐν παραβολαῖς
  choice: ji ilu
  rationale: N’Igbo, ‘ji ilu agwa mmadụ okwu’ bụ ụzọ ebumpụta ụwa isi kọwaa usoro e ji ekwu okwu; ọ na-edobe echiche nke παραβολαί dịka ihe atụ ma ọ bụ akụkọ ntụnyere.
- source_word: αὐτοῖς λαλῶ
  choice: ka m ji ... agwa ha okwu
  rationale: Nke a na-egosipụta onye na-ekwu okwu, ndị a na-agwa okwu, na present λαλῶ n’ụzọ Igbo doro anya.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Njikọ a na-enye ihe kpatara ụzọ Jizọs si agwa ha okwu.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: mgbe ha na-ele anya, ha adịghị ahụ ụzọ
  rationale: ‘Mgbe’ na-edobe participle ahụ n’enweghị ịmanye ya ka ọ bụrụ concessive ‘ọ bụ ezie na’; ‘ịhụ ụzọ’ ebe a na-egosipụta ọdịiche dị n’etiti ile anya na ịhụ ihe n’ezie.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: mgbe ha na-anụkwa, ha adịghị anụ
  rationale: 'Ọ na-edobe nkwughachi na paradox nke Grik: ha na-anụ n’otu echiche, ma ha adịghị anụ n’echiche zuru ezu.'
- source_word: οὐδὲ συνίουσιν
  choice: ha adịghịkwa aghọta
  rationale: ‘Aghọta’ bụ okwu Igbo nkịtị ma ziri ezi maka ijide ihe okwu ahụ pụtara, ebe ‘-kwa’ na-aga n’ihu n’usoro ihe ndị a jụrụ.
theological_decisions:
- issue: Ike participles βλέποντες na ἀκούοντες
  choice: E ji ‘mgbe ha na-ele anya’ na ‘mgbe ha na-anụ’ mee ha n’enweghị itinye okwu concessive kpọmkwem.
  alternative: ‘Ọ bụ ezie na ha na-ele anya ... ọ bụ ezie na ha na-anụ ...’
  rationale: Participles Grik nwere ike ibu echiche concessive n’ọnọdụ a, ma ọ bụghị conjunction doro anya. Nsụgharị a na-edobe paradox ahụ ma hapụ mmekọrịta ahụ ka ọ nwee ambiguity nke isi mmalite.
- issue: Ihe συνίουσιν pụtara
  choice: ‘aghọta,’ ya bụ ijide ihe okwu ahụ pụtara
  alternative: ‘ghọta ihe ime mmụọ’ ma ọ bụ ‘mata’
  rationale: ‘Aghọta’ na-ekwupụta enweghị nghọta n’enweghị ịgbakwunye nkọwa doctrinal gbasara ihe kpatara ya ma ọ bụ ụdị nghọta ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri usoro okwu Igbo ebumpụta ụwa mee causal structure ahụ, ma debe nkwughachi na theological tension nke ịhụ/anụghị/aghọtaghị.
