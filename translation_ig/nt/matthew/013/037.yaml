id: MAT.13.37
reference: Matthew 13:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Ὁ σπείρων τὸ καλὸν σπέρμα ἐστὶν ὁ υἱὸς τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/037.yaml
  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: ig
  text: Ọ zara, sị, “Onye na-agha mkpụrụ ọma ahụ bụ Nwa nke Mmadụ.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta aha a dịka “Onye ahụ bụ Mmadụ.” Okwu Grik ahụ, “Nwa nke Mmadụ,” na-eme ka Daniel 7 bata n'uche; e debere ya ebe a n'ihi na ọ bụ aha a maara nke ọma n'Oziọma ma nwee nnukwu mkpa n'ihe gbasara Kraịst.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ọ zara, sị
  rationale: Okwu abụọ a jikọtara ọnụ na Grik pụtara n'ụzọ ebumpụta ụwa na ọ zara wee kwuo. “Ọ zara, sị” na-edobe ma nzaghachi ahụ ma mmalite okwu ya n'Igbo doro anya, na-enweghị ịmegharị okwu n'ụzọ siri ike.
- source_word: Ὁ σπείρων
  choice: Onye na-agha
  rationale: Nkebi participle a na-akọwa onye ahụ site n'ihe ọ na-eme. “Onye na-agha” bụ okwu Igbo dị mfe ma na-edobe echiche nke ọrụ ahụ.
- source_word: τὸ καλὸν σπέρμα
  choice: mkpụrụ ọma ahụ
  rationale: καλός n'ebe a pụtara ihe dị mma ma kwesị ekwesị; “mkpụrụ ọma” na-egosipụta nke ahụ. “Ahụ” na-ezo aka ná mkpụrụ a kpọtụrụ aha n'ilu ahụ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-edobe aha Jizọs ji akpọ onwe ya na Oziọma ndị ahụ, tinyere njikọ ya na Daniel 7, kama ịtụgharị ya ka ọ bụrụ naanị mmadụ nkịtị.
theological_decisions:
- issue: Otú e si sụgharịa aha Kraịst υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ Mmadụ
  rationale: “Nwa nke Mmadụ” na-edobe ọdịdị aha ahụ, njikọ ya na Daniel 7, na ibu echiche ya n'Oziọma. Nhọrọ ọzọ nwere ike ime ka a ghọta ya naanị dịka mmadụ nkịtị ma belata ụda aha pụrụ iche ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro okwu “Ọ zara, sị” n'ihi na ọ bụ ụzọ ebumpụta ụwa e si webata nzaghachi kpọmkwem n'Igbo; e debekwara aha “Nwa nke Mmadụ” ka njikọ Akwụkwọ Nsọ ya ghara ifu.
