  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: ig
  text: Ma mgbe ihe ọkụkụ ahụ puru ma mịa mkpụrụ, mgbe ahụ ka ahịhịa ọjọọ ahụ[a] pụtakwara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ahịhịa ata”; ikekwe ọ bụ ụdị ahịhịa ọjọọ a na-akpọ darnel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ma mgbe
  rationale: ὅτε na-egosi oge ihe mere, ebe δέ bụ njikọ dị nro nke na-akwalite akụkọ ma na-egosikwa ntakịrị mgbanwe; “Ma mgbe” na-egosipụta ha abụọ n’Igbo nkịtị.
- source_word: ἐβλάστησεν
  choice: puru
  rationale: Ngwaa a pụtara ipupụta ma ọ bụ ịmalite ito. “Puru” bụ okwu ugbo dị nkenke ma doo anya n’Igbo.
- source_word: ὁ χόρτος
  choice: ihe ọkụkụ ahụ
  rationale: N’ọnọdụ ubi a, χόρτος na-ezo aka n’ihe a kụrụ nke na-eto, ọ bụghị naanị ahịhịa nkịtị. “Ihe ọkụkụ ahụ” adịghị ekpebi ụdị osisi ahụ karịa ka ederede a si mee.
- source_word: καρπὸν ἐποίησεν
  choice: mịa mkpụrụ
  rationale: Nkebiokwu ahụ pụtara ịmịpụta ihe ubi. “Mịa mkpụrụ” bụ okwu Igbo ebumpụta ụwa nke dabara n’ihe ọkụkụ na-amị mkpụrụ.
- source_word: τότε
  choice: mgbe ahụ
  rationale: Ọ na-egosi oge ihe sochirinụ pụtara n’usoro akụkọ ahụ.
- source_word: ἐφάνη
  choice: pụtara ìhè
  rationale: Ebe a, φαίνω pụtara na ihe ahụ bịara bụrụ nke a pụrụ ịhụ ma ọ bụ mata. “Pụtara ìhè” na-egosipụta nke a nke ọma.
- source_word: καὶ τὰ ζιζάνια
  choice: ahịhịa ọjọọ ahụ pụtakwara
  rationale: ζιζάνια bụ ahịhịa na-adịghị mma nke toro n’ubi ahụ; καί nwere nghọta nke “kwa.” Nhazi a bụ Igbo dị mfe ma na-edebe ihe mgbakwunye ahụ.
theological_decisions:
- issue: Ụdị ahịhịa ζιζάνια bụ kpọmkwem
  choice: E ji okwu sara mbara “ahịhịa ọjọọ” mee ihe n’ahịrị bụ isi.
  alternative: “Ahịhịa ata” ma ọ bụ ụdị ahịhịa a na-akpọ darnel.
  rationale: Amaokwu ahụ anaghị achọ ka a kpebie kpọmkwem ụdị osisi ahụ. Okwu sara mbara na-eme ka ntụgharị ahụ doo ndị mmadụ anya, ebe nkọwa ala peeji na-echekwa ohere na ọ bụ darnel, ahịhịa yiri ọka wit mgbe ọ ka na-eto.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ okwu ugbo ndị a na-anụkarị—“puru” na “mịa mkpụrụ”—ma zere ịkpọ ihe ọkụkụ ahụ ọka wit n’amaokwu a ebe okwu Grik n’onwe ya ekwughị ya kpọmkwem.
