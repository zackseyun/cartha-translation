id: MAT.13.31
reference: Matthew 13:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: ig
  text: Ọ tụrụ ha ilu ọzọ, sị, “Alaeze eluigwe dị ka mkpụrụ mọstad nke otu nwoke weere ghaa n’ubi ya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: tụkwara ha
  rationale: N’ọnọdụ a, okwu ahụ pụtara iweta ma ọ bụ ịkọwa ihe n’ihu ndị na-ege ntị. “Tụkwara ha ilu” bụ ụzọ Igbo dị mma isi kwuo na o wetara ilu ọzọ ka ha nụ, ma na-ejigide echiche nke itinye ihe n’ihu ha.
- source_word: παραβολὴν
  choice: ilu
  rationale: “Ilu” bụ okwu Igbo a na-ejikarị akọwa παραβολή n’ozizi Jizọs; ọ na-egosi akụkọ ntụnyere nke nwere ihe ọ na-akụzi.
- source_word: Ὁμοία ἐστὶν
  choice: dị ka
  rationale: “Dị ka” na-egosipụta ntụnyere ahụ n’ụzọ Igbo doro anya ma bụrụkwa nke mmadụ na-ekwu kwa ụbọchị.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Alaeze eluigwe
  rationale: Nke a na-edobe okwu Matiu pụrụ iche ma na-ahapụ “alaeze” ka ọ gụnye ma ọchịchị ma mpaghara ọchịchị, dịka ọnọdụ ya si kwe.
- source_word: κόκκῳ σινάπεως
  choice: mkpụrụ mọstad
  rationale: “Mkpụrụ mọstad” bụ aha doro anya na nke a na-aghọta maka obere mkpụrụ osisi mọstad e ji mee ntụnyere a.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: nke otu nwoke weere
  rationale: Nke a na-edobe onye nwoke nọ n’akụkọ ahụ nakwa omume nke iwere mkpụrụ ahụ, n’usoro Igbo dị mfe.
- source_word: ἔσπειρεν
  choice: kụọ
  rationale: N’ihe gbasara otu mkpụrụ a tinyere n’ubi, “kụọ” bụ okwu Igbo nkịtị maka ịkụ mkpụrụ, ọ bụ ezie na isi okwu Grik n’onwe ya pụtara ịgha mkpụrụ.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: n’ubi ya
  rationale: “Ubi” dabara na ọnọdụ ọrụ ugbo nke ἀγρός, ebe “ya” na-edobe na ubi ahụ bụ nke nwoke ahụ.
theological_decisions:
- issue: Nsụgharị βασιλεία τῶν οὐρανῶν
  choice: Alaeze eluigwe
  alternative: Ọchịchị eluigwe
  rationale: “Alaeze eluigwe” na-edobe okwu Matiu a maara nke ọma ma ghara ime ka ihe ọ pụtara bụrụ naanị omume ịchị achị; ọ na-ahapụ ịdị obosara nke echiche ahụ dịka Grik si mee.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agụ nke ọma n’ọnụ, na-ejigide usoro ntụnyere na ihe omume ndị dị n’asụsụ Grik n’enweghị ịgbakwunye nkọwa okpukpe.
