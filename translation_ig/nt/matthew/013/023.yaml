id: MAT.13.23
reference: Matthew 13:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: ig
  text: 'Ma nke a kụrụ n’ala ọma[a] bụ onye na-anụ okwu ahụ ma na-aghọta ya; onye ahụ n’ezie na-amị mkpụrụ ma na-ewepụta ihe ubi: n’otu ebe, otu narị; n’ebe ọzọ, iri isii; n’ebe ọzọkwa, iri atọ.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ala na-eme nri.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “otu otu narị, otu iri isii, otu iri atọ”; ya bụ, ihe ubi dịgasị iche. Ọnọdụ ọrụ ugbo a na-egosi otu narị okpukpu, iri isii okpukpu, na iri atọ okpukpu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: n’ala ọma
  rationale: N’ọnọdụ ilu ọrụ ugbo a, “ala ọma” na-egosi ala kwesịrị ekwesị nke na-anabata mkpụrụ ma na-eme ka ọ too; “ọma” ebe a na-akọwa ịdị mma ala ahụ maka ịmị mkpụrụ, ọ bụghị àgwà omume.
- source_word: σπαρείς
  choice: nke a ghara
  rationale: Nhọrọ a na-echekwa olu nnara nke participle Grik ahụ nakwa ihe atụ nke ịgha mkpụrụ, ma na-ada nke ọma n’Igbo.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: onye na-anụ okwu ahụ
  rationale: Ọ na-egosi omume e ji amata onye ahụ. “Okwu ahụ” na-echekwa okwu e ji mara ozi Chineke n’akụkụ Akwụkwọ Nsọ a n’etinyeghị nkọwa ọzọ n’ime ya.
- source_word: συνιείς
  choice: ma na-aghọta ya
  rationale: Ọ na-egosi ịmata ihe okwu a nụrụ pụtara; “ya” na-ezo aka n’“okwu ahụ” n’ụzọ doro anya ma dịrị Igbo mfe.
- source_word: δὴ
  choice: n’ezie
  rationale: “N’ezie” na-egosipụta ntakịrị nkwusi ike nke particle δή na-enweghị ime ka ahịrịokwu ahụ sie ike ịgụ.
- source_word: καρποφορεῖ
  choice: na-amị mkpụrụ
  rationale: Nke a bụ okwu Igbo nkịtị maka osisi na-amị mkpụrụ, ma ọ na-echekwakwa ihe atụ nke ndụ onye na-anabata okwu ahụ.
- source_word: ποιεῖ
  choice: na-ewepụta ihe ubi
  rationale: N’ebe a ποιεῖ na-ekwu maka ihe ala kụtara wepụtara. A hapụrụ ya dị ka ngwaa nke abụọ ka ọdịiche dị n’etiti “na-amị mkpụrụ” na “na-ewepụta” ghara ịla n’iyi.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: ụfọdụ otu narị, ụfọdụ iri isii, ụfọdụkwa iri atọ
  rationale: Nke a na-egosi n’Igbo dị mfe na ihe ubi ahụ dịgasị iche. E tinyeghị “okpukpu” n’ahụ isi n’ihi na okwu ahụ adịghị kpọmkwem na Grik, ọ bụ ezie na ọnọdụ ọrụ ugbo na-egosi oke ihe ubi.
theological_decisions:
- issue: Ụdị nzaghachi onye ahụ nyere okwu ahụ
  choice: A kọwara onye ahụ dịka onye na-anụ okwu ahụ, na-aghọta ya, ma na-amị mkpụrụ n’ogo dịgasị iche.
  alternative: A pụrụ ịkọwa ya n'ụzọ ga-akpọpụta nnọgidesi ike ma ọ bụ ezi nchegharị n’aha kpọmkwem.
  rationale: Grik ahụ n’onwe ya kwusiri ike n’ịnụ ihe, ịghọta ya, na ịmị mkpụrụ; ọ kpọpụtaghị ozizi ndị ọzọ n’aha. Ya mere, nsụgharị ahụ na-edobe nkọwa nke amaokwu ahụ n’etinyeghị echiche otu ụka pụrụ iche.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ okwu ọrụ ugbo ndị mmadụ na-amakarị—“ịgha,” “ala ọma,” “ịmị mkpụrụ,” na “ihe ubi”—iji chekwaa ihe atụ ahụ. Usoro “Ma nke a ghara…” na-edobe ntakịrị mkpakọrịta dị na Grik n’etinyeghị “na-anọchi anya” nke na-adịghị kpọmkwem n’amaokwu ahụ.
