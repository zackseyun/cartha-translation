revisions:
- from: 'Ma nke a ghara n’ala ọma[a] bụ onye na-anụ okwu ahụ ma na-aghọta ya. Ọ bụ ya n’ezie na-amị mkpụrụ ma na-ewepụta ihe ubi: ụfọdụ otu narị, ụfọdụ iri isii, ụfọdụkwa iri atọ.[b]'
  to: 'Ma nke a kụrụ n’ala ọma[a] bụ onye na-anụ okwu ahụ ma na-aghọta ya; onye ahụ n’ezie na-amị mkpụrụ ma na-ewepụta ihe ubi: n’otu ebe, otu narị; n’ebe ọzọ, iri isii; n’ebe ọzọkwa, iri atọ.[b]'
  rationale: The revision corrects the opening passive participle to idiomatic Standard Igbo while retaining the parable’s representative construction. It preserves both καρποφορεῖ and ποιεῖ, retains δή as “n’ezie,” and renders the Greek distributive yield sequence clearly without placing “okpukpu” in the main text. Footnote wording is revised for natural Igbo and continues to identify the contextual, rather than explicit, sense of the yield amounts.
  reviewer_model: gpt-5.6-terra
