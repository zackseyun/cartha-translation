review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the good-soil image, hearing and understanding the word, the emphatic force of δή, fruit-bearing/producing, and the three differing yields. However, “nke a ghara” is not an appropriate Standard Igbo rendering of the passive participle σπαρείς in this agricultural context; “nke a kụrụ” clearly and idiomatically conveys ‘the one/that which was sown.’
  naturalness: Most wording is clear and suitably formal. Revising the opening and expressing the distributed yields as ‘n’otu ebe ... n’ebe ọzọ’ makes the sentence more idiomatic and avoids an unclear shift from the singular hearer to “ụfọdụ.”
  terminology: “Ala ọma,” “okwu ahụ,” “na-aghọta,” and “na-amị mkpụrụ” are appropriate Standard Igbo biblical and agricultural terms. “Na-ewepụta ihe ubi” acceptably preserves the second Greek verb. The yield footnote should use the natural expression “N'ụzọ nkịtị,” rather than “N’ụzọ mkpụrụ okwu.”
  issues:
  - severity: high
    issue: “nke a ghara” for σπαρείς
    rationale: This is not a safe or natural Standard Igbo passive agricultural expression here and can obscure the seed-sowing metaphor. “Nke a kụrụ n’ala ọma” is the normal, intelligible rendering.
  - severity: medium
    issue: Yield distribution wording and footnote idiom
    rationale: “Ụfọdụ otu narị...” is less clear after a singular referent. “N’otu ebe ... n’ebe ọzọ” clearly renders the distributive construction. The footnote’s “N’ụzọ mkpụrụ okwu” is unnatural for ‘literally.’
  revised_text: 'Ma nke a kụrụ n’ala ọma[a] bụ onye na-anụ okwu ahụ ma na-aghọta ya; onye ahụ n’ezie na-amị mkpụrụ ma na-ewepụta ihe ubi: n’otu ebe, otu narị; n’ebe ọzọ, iri isii; n’ebe ọzọkwa, iri atọ.[b]'
  revised_footnotes:
