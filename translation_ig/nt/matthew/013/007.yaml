  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ ⸀ἔπνιξαν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: ig
  text: Mkpụrụ ndị ọzọ dara n’etiti ogwu[a], ogwu ndị ahụ wee pụta kpagbuo ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ya kpọmkwem bụ “dara n’elu ogwu”; a sụgharịrị ya “n’etiti ogwu” ka ọ daa n’Igbo eke n’ọnọdụ ọrụ ubi a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: Mkpụrụ ndị ọzọ
  rationale: Ọ bụ adjective neuter plural e ji dochie aha, na-ezo aka na mkpụrụ a kpọtụrụ aha n'akụkọ ahụ; itinye “mkpụrụ” na-eme ka Igbo doo anya ma ghara ịgbakwunye echiche ọhụrụ.
- source_word: δὲ
  choice: wee
  rationale: N'ebe a δέ bụ njikọ dị nro nke na-aga n'ihu n'usoro akụkọ ahụ; “wee” bụ ụzọ Igbo si ejikọta ihe omume ndị na-esochi ibe ha n'ụzọ eke.
- source_word: ἔπεσεν
  choice: dara
  rationale: Nke a na-echekwa ihe πίπτω pụtara kpọmkwem, ya bụ “ịda,” kama ịtụgharị ya ka ọ bụrụ “a kụrụ,” bụ́ nke ga-abụ nkọwa karịa okwu Grik.
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: n’etiti ogwu
  rationale: Ọ bụ ezie na ἐπί na accusative nwere ike ịbụ “n'elu,” ọnọdụ ọrụ ubi ebe a na-egosi mkpụrụ dara n'ebe ogwu nọ; “n’etiti ogwu” bụ Igbo eke ma kwekọọ na onyinyo ahụ.
- source_word: ἀκάνθας / ἄκανθαι
  choice: ogwu
  rationale: “Ogwu” bụ okwu Igbo sara mbara ma dị mfe nghọta maka ahịhịa ma ọ bụ osisi ogwu ndị e kwuru n'ilu ahụ.
- source_word: ἀνέβησαν
  choice: puo
  rationale: “Puo” na-egosi osisi si n'ala pụta too, ma na-eburu onyinyo ịrị elu dị na ἀναβαίνω n'Igbo eke.
- source_word: ἔπνιξαν
  choice: kpagbuo
  rationale: πνίγω na-egosi ịkpagbu ma ọ bụ igbochi ndụ. “Kpagbuo” na-echekwa ihe atụ siri ike nke ogwu gbochiri mkpụrụ ahụ ito.
- source_word: αὐτά
  choice: ha
  rationale: Nnọchiaha plural “ha” na-ezo aka na mkpụrụ ndị ahụ dịka αὐτά si eme, n'enweghị ikwughachi aha ahụ n'ụzọ Grik na-emeghị.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe ma nwee ugwu. E ji “mkpụrụ” mee ka ihe ἄλλα na-ezo aka na ya doo anya; e chekwara usoro na ihe atụ ọrụ ubi nke Grik.
