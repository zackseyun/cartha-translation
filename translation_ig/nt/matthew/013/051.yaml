  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: ig
  text: “Unu aghọtala ihe ndị a niile?” Ha sịrị ya, “Ee.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνήκατε
  choice: Ùnu aghọtala
  rationale: Aorist indicative nke onye nke abụọ n’ọnụọgụ ọtụtụ, n’ụdị ajụjụ, na-elekwasị anya n’ịghọta ihe ruo n’oge ahụ; “aghọtala” na-egosipụta nke a n’Igbo dị mma.
- source_word: ταῦτα πάντα
  choice: ihe ndị a niile
  rationale: Nke a na-edobe demonstrative na echiche nke πᾶς n’ọnụọgụ ọtụtụ n’ụzọ doro anya, na-ezo aka n’ozizi na ilu ndị e kwuru.
- source_word: λέγουσιν αὐτῷ
  choice: Ha sịrị ya
  rationale: Ọ bụ historical present n’asụsụ Grik, ma oge gara aga bụ ụzọ nkịtị e si akọ akụkọ n’Igbo; “ya” na-edobekwa αὐτῷ.
- source_word: Ναί
  choice: Ee
  rationale: Nke a bụ nkwenye dị mfe kwekọrọ na ναί; agbakwụnyeghị aha nsọpụrụ ọ bụla na-adịghị na isi mmalite.
theological_decisions:
- issue: Ma a ga-agbakwunye aha nsọpụrụ na nzaghachi ndị na-eso ụzọ
  choice: “Ee.” naanị
  alternative: “Ee, Onyenwe anyị.”
  rationale: Ihe odide Grik nwere naanị ναί. Ịgbakwunye “Onyenwe anyị” ga-etinye echiche ofufe ma ọ bụ ọdịnala nke isi mmalite ekwughị.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E debere ajụjụ ahụ n’ụdị plural “Ùnu,” ma zere okwu mgbakwunye na nzaghachi ahụ.
