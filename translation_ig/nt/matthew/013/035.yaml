id: MAT.13.35
reference: Matthew 13:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: ig
  text: 'ka ihe e kwuru site n’ọnụ onye amụma wee mezuo[a], sị: “Aga m eji ilu meghee ọnụ m; aga m ekwupụta ihe ndị e zoro ezo kemgbe ntọala.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ, “kemgbe ntọala ụwa.”
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως
  choice: ka ... wee
  rationale: Ụdị a na-egosi ebumnuche ma ọ bụ ihe si na ya pụta n’Igbo dị ugbu a, ma na-ejigide njikọ dị n’etiti iji ilu na mmezu amụma ahụ.
- source_word: πληρωθῇ
  choice: wee mezuo
  rationale: Na-egosi mmezu nke ihe e kwuru na mbụ n’enweghị ịgbakwunye nkọwa oge na-adịghị na Grik.
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: ihe e kwuru site n’ọnụ onye amụma
  rationale: “Site n’ọnụ” bụ ụzọ Igbo si egosi na onye amụma bụ onye Chineke ji kwuo okwu ahụ, ma ọ naghị agbanwe ya ka ọ bụrụ onye malitere okwu ahụ n’onwe ya.
- source_word: ἐν παραβολαῖς
  choice: eji ilu
  rationale: “Ilu” bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị akọwa παραβολή; “eji” na-eme ka ahịrịokwu ahụ bụrụ nke okike n’Igbo.
- source_word: Ἀνοίξω ... τὸ στόμα μου
  choice: Aga m ... meghee ọnụ m
  rationale: Na-edobe ihe oyiyi uri nke imeghe ọnụ iji malite ikwu okwu.
- source_word: ἐρεύξομαι
  choice: aga m ekwupụta
  rationale: Na-egosi ikwuputa ma ọ bụ ịwụpụta okwu n’ụzọ doro anya, n’enweghị ụda ochie ma ọ bụ nke siri ike nghọta.
- source_word: κεκρυμμένα
  choice: ihe ndị e zoro ezo
  rationale: Na-echekwa ọdịdị nnara-eme na echiche nke ihe nọgidere na nzuzo, kama ịkọwa ya ozugbo dịka “ihe omimi.”
- source_word: ἀπὸ καταβολῆς
  choice: kemgbe ntọala ụwa
  rationale: Ọ bụ ezie na ederede SBLGNT enweghị κόσμου, n’ọnọdụ a “ntọala ụwa” na-eme ka akpaalaokwu ahụ zuo oke ma doo anya n’Igbo; a na-edebe ọdịiche ederede n’ihe odide ala peeji.
theological_decisions:
- issue: Onye e ji kwuo amụma ahụ
  choice: site n’ọnụ onye amụma
  alternative: site n’ọnụ Asaf onye amụma
  rationale: Ederede Grik enyere kwuru naanị “onye amụma,” ya mere etinyeghị aha na-adịghị na isi ederede.
- issue: Oke nkebiokwu ἀπὸ καταβολῆς
  choice: kemgbe ntọala ụwa
  alternative: kemgbe ntọala
  rationale: A họọrọ ụdị zuru oke nke akpaalaokwu ahụ maka nghọta Igbo na ọnọdụ Abụ Ọma 78:2, ma e gosiri na ụfọdụ ihe odide nwere ụdị okwu dị iche.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E debere ụdị uri nke okwu amụma ahụ, ma jiri “ilu” maka παραβολαί. Akara [a] dị n’isi ederede dịka achọrọ.
