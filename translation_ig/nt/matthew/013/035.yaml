review_pass:
  verdict: revise
  source_fidelity: Ederede SBLGNT na-agụ naanị ἀπὸ καταβολῆς (“site na/kemgbe ntọala”), ọ bụghị “ntọala ụwa.” Ya mere, “ụwa” ekwesịghị ịdị n’isi ederede. A ghaghị idowe agụmagụ sara mbara ahụ n’ala peeji dịka ọdịiche ihe odide.
  naturalness: “Ka ihe e kwuru site n’ọnụ onye amụma wee mezuo” na “Aga m eji ilu meghee ọnụ m” bụ Igbo ọkọlọtọ doro anya ma na-edobe ụda okwu amụma ahụ. “Kemgbe ntọala” na-arụ ọrụ nke ọma n’Igbo n’ebe a, n’enweghị itinye “ụwa” na-adịghị na isi Grik.
  terminology: “Onye amụma,” “ilu,” “ihe ndị e zoro ezo,” na “mezuo” dabara n’ọrụ ha. “Site n’ọnụ onye amụma” na-egosi nke ọma na okwu ahụ sitere n’aka onye amụma dị ka onye na-ekwupụta ya, ọ bụ ezie na Grik kwuru naanị “site n’aka/onye amụma.”
  issues:
  - severity: high
    issue: Isi ederede gbakwụnyere “ụwa” n’akpaalaokwu “kemgbe ntọala ụwa.”
    rationale: SBLGNT nwere ἀπὸ καταβολῆς naanị; κόσμου (“ụwa”) adịghị na ya. Ntụgharị kwesịrị ịgbaso isi ederede, ebe a na-etinye agụmagụ “ntọala ụwa” n’ala peeji dịka ọdịiche ihe odide.
  - severity: medium
    issue: Ihe odide ala peeji ugbu a anaghị akọwa ọdịiche ederede n’ụzọ kwekọrọ n’isi ederede.
    rationale: Ebe isi ederede ugbu a nweelarị “kemgbe ntọala ụwa,” ala peeji nke sịrị na ụfọdụ ihe odide na-agụ otu ihe ahụ anaghị arụ ọrụ. Mgbe e wepụrụ “ụwa” n’isi ederede, ala peeji kwesịrị igosi agụmagụ sara mbara ahụ.
