revisions:
- from: Ya mere, unu onwe unu, geenụ ilu banyere onye ahụ kụrụ mkpụrụ.[a]
  to: Ya mere, unu, nụnụ ilu nke onye kụrụ mkpụrụ.
  rationale: The revision retains the inferential “Ya mere,” the explicit and marked plural addressee “unu,” and the plural imperative “nụnụ.” It replaces the interpretive preposition “banyere” with “nke,” which more closely reflects the Greek genitive, and removes the unnecessary reflexive intensifier and consequent footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:35:05Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the imperative, the explicit second-person plural subject, παραβολή as “ilu,” and the aorist participle as “onye kụrụ mkpụrụ.” However, “banyere” makes the genitive construction more interpretive than the Greek requires; the straightforward Igbo possessive/linking construction preserves it better.
  naturalness: “Unu onwe unu” is heavier than the Greek’s explicit emphatic pronoun and can suggest reflexive emphasis. “Unu, nụnụ” is natural Standard Igbo and retains the marked explicit address. “Nụnụ ilu” is a direct, idiomatic imperative.
  terminology: “Ilu” is the established natural Igbo term for παραβολή in this teaching context. “Onye kụrụ mkpụrụ” appropriately represents the substantival aorist participle without recasting it as a permanent title or role.
  issues:
  - severity: medium
    issue: The phrase “banyere onye ahụ kụrụ mkpụrụ” expands the Greek genitive.
    rationale: τοῦ σπείραντος is most directly represented by “nke onye kụrụ mkpụrụ” (or an equivalent linking construction), not necessarily “about the one who sowed.”
  - severity: low
    issue: “Unu onwe unu” overstates the force of the explicit pronoun.
    rationale: Ὑμεῖς is emphatic by being expressed, but it is not reflexive. “Unu” in fronted/direct address position preserves the emphasis without adding “yourselves.”
  - severity: low
    issue: The footnote presents the more source-close wording as an alternative while the main text uses the less direct wording.
    rationale: Once the main text is revised to use the direct genitive relationship, no lexical-alternative footnote is needed.
  revised_text: Ya mere, unu, nụnụ ilu nke onye kụrụ mkpụrụ.
