  text: Ὑμεῖς οὖν ἀκούσατε τὴν παραβολὴν τοῦ ⸀σπείραντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/018.yaml
  text: You[a], then, hear the parable of the one who sowed.
translation:
  language: ig
  text: Ya mere, unu, nụnụ ilu nke onye kụrụ mkpụrụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: unu onwe unu
  rationale: Nnọchiaha ahụ pụtara ìhè na Grik ma nwee nkwusi ike. “Unu onwe unu” na-egosipụta nkwusi ike ahụ n’Igbo n’ụzọ doro anya.
- source_word: οὖν
  choice: ya mere
  rationale: Ọ na-egosi njikọ nke nkwubi okwu ma ọ bụ ntụgharị sitere n’ihe e kwuru tupu ya.
- source_word: ἀκούσατε
  choice: geenụ
  rationale: Nke a bụ iwu e nyere ọtụtụ mmadụ. “Geenụ” na-echekwa echiche ịnụ ma ọ bụ ịṅa ntị, na-etinyeghị echiche “ghọta” nke ngwaa Grik ahụ ekwughị kpọmkwem.
- source_word: παραβολὴν
  choice: ilu
  rationale: “Ilu” bụ okwu Igbo a na-aghọta nke ọma maka akụkọ ntụnyere e ji akụzi eziokwu, ma dabara n’ọrụ παραβολή n’ebe a.
- source_word: τοῦ σπείραντος
  choice: banyere onye ahụ kụrụ mkpụrụ
  rationale: 'Nkebi a bụ aha sitere na participle gara aga: “onye ahụ kụrụ mkpụrụ.” “Banyere” na-eme ka njikọ genitive ahụ doo anya n’Igbo, na-enweghị ime “onye na-agha mkpụrụ” ka ọ bụrụ aha e ji mara ya mgbe niile.'
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma dị nsọ. E ji “unu onwe unu” chekwaa nkwusi ike dị na nnọchiaha Grik, ma e jiri “geenụ” chekwaa ike nke iwu ahụ.
