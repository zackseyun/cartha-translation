revisions:
- from: Mgbe onye ọ bụla nụrụ okwu banyere alaeze ahụ ma ọ ghọtaghị ya, onye ọjọọ ahụ na-abịa napụ ihe a kụrụ n’ime obi ya. Onye a bụ mkpụrụ ahụ a kụrụ n’akụkụ ụzọ.[a]
  to: Mgbe onye ọ bụla nụrụ okwu nke alaeze ahụ ma ọ ghọtaghị ya, onye ọjọọ ahụ na-abịa, na-apụnara ya ihe a kụrụ n’obi ya. Ọ bụ onye a ka a kụrụ n’akụkụ ụzọ.[a]
  rationale: The revision removes the added “mkpụrụ” from the final clause and preserves the Greek’s intentionally compressed identification of the hearer in the parable imagery. It also uses a closer kingdom-genitive expression and a more idiomatic, forceful rendering of the evil one’s act of snatching away what was sown.
  reviewer_model: gpt-5.6-terra
