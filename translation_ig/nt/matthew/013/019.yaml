id: MAT.13.19
reference: Matthew 13:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: ig
  text: Mgbe onye ọ bụla nụrụ okwu nke alaeze ahụ ma ọ ghọtaghị ya, onye ọjọọ ahụ na-abịa, na-apụnara ya ihe a kụrụ n’obi ya. Ọ bụ onye a ka a kụrụ n’akụkụ ụzọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị: “onye ahụ a kụrụ n’akụkụ ụzọ.” Ederede Grik na-eji ụdị okwu ihe atụ a akọwa onye nụrụ okwu ahụ, na-ejikọta ya na mkpụrụ a kụrụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: Mgbe onye ọ bụla nụrụ
  rationale: Nke a na-egosipụta onye ọ bụla nke ọnọdụ a metụtara, ma na-eme ka nkebiokwu participle Grik ahụ bụrụ Igbo dị mfe ma kwekọọ n’okwu a na-ekwu maka ihe na-eme mgbe mmadụ nụrụ.
- source_word: λόγον τῆς βασιλείας
  choice: okwu banyere alaeze ahụ
  rationale: λόγος pụtara okwu ma ọ bụ ozi; “okwu banyere alaeze ahụ” na-eme ka njikọ genitive ahụ doo anya n’Igbo, ma ka na-edobe ihe atụ nke okwu ahụ dịka mkpụrụ.
- source_word: μὴ συνιέντος
  choice: ma ọ ghọtaghị ya
  rationale: Ngwaa a na-egosi na onye ahụ aghọtaghị ihe okwu ahụ pụtara; “ya” na-ezo aka n’okwu banyere alaeze ahụ.
- source_word: ὁ πονηρὸς
  choice: onye ọjọọ ahụ
  rationale: Article ahụ na ọnọdụ okwu a na-akwado ịghọta okwu ahụ dịka onye nwere omume ọjọọ, ọ bụghị naanị ajọ ihe dị ka echiche nkịtị.
- source_word: ἁρπάζει
  choice: na-abịa napụ
  rationale: “Napụ” na-egosi iwepụ ihe n’ike ma ọ bụ ngwa ngwa, nke kwekọrọ n’ike dị na ἁρπάζω.
- source_word: τὸ ἐσπαρμένον
  choice: ihe a kụrụ
  rationale: Nke a na-edobe participle passive ahụ dịka ihe e tinyere n’ala site n’ịkụ mkpụrụ, ma ọ bụ okwu ahụ e tinyere n’obi.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: n’ime obi ya
  rationale: “Obi” na-edobe okwu ihe gbasara mmadụ nke ederede ahụ ji mee ihe, ebe “ya” na-anọchi onye ahụ n’otu n’otu dịka Grik si dị.
- source_word: οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: Onye a bụ mkpụrụ ahụ a kụrụ n’akụkụ ụzọ
  rationale: Grik na-ekwu n'ụzọ mkpirikpi banyere “onye ahụ a kụrụ,” na-ejikọta onye na mkpụrụ/ala n’ihe atụ ahụ. Ịtinye “mkpụrụ” na Igbo na-eme ka ahịrịokwu ahụ bụrụ ihe a na-aghọta nke ọma, ma ghara iwepụ njirimara ahụ; ntụaka ala na-akọwa nsụgharị nkịtị.
theological_decisions:
- issue: Njirimara ὁ πονηρὸς
  choice: onye ọjọọ ahụ
  alternative: ajọ ihe ahụ
  rationale: Ọnọdụ okwu ahụ gosiri onye na-abịa napụ okwu a kụrụ; nsụgharị a na-edobe onye ahụ dịka onye nwere onwe ya, ma ọ naghị akpọ ya aha karịa ihe ederede a kwuru.
- issue: Nnọchiaha nwoke n’αὐτοῦ
  choice: obi ya
  alternative: obi onye ahụ
  rationale: “Ya” na-edobe onye ahụ n’otu n’otu dịka isi mmalite si dị. N’Igbo, nnọchiaha a anaghị akọ nwoke ma ọ bụ nwanyị, ya mere ọ bụkwa ụzọ ebumpụta ụwa isi kwuo ya.
- issue: Njikọ onye na ihe a kụrụ n’ahịrị ikpeazụ
  choice: Onye a bụ mkpụrụ ahụ a kụrụ n’akụkụ ụzọ
  alternative: Onye a bụ onye ahụ a kụrụ n’akụkụ ụzọ
  rationale: Ederede Grik na-eji metonymy kpọọ onye ahụ “onye a kụrụ.” Nsụgharị bụ isi na-eme ka mkpụrụ ahụ pụta ìhè ka Igbo ghara ịdị mgbagwoju anya, ebe ntụaka ala na-echekwa ụdị okwu Grik kpọmkwem.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. “Alaeze ahụ” na-echekwa ịdị mkpirikpi nke βασιλεία n’enweghị ịgbakwunye “nke Chineke” ma ọ bụ “nke eluigwe,” ebe amaokwu a n’onwe ya ekwughị ya. Ihe nrịbama ntụaka ala [a] dị n’isi ederede.
