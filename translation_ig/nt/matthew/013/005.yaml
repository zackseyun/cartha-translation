- from: Mkpụrụ ndị ọzọ dakwasịrị n’ebe nkume dị[a], ebe ala na-adịghị ukwuu; ha pulitere ozugbo n’ihi na ala ahụ emighị emi.
  to: Mkpụrụ ndị ọzọ dara n’ebe okwute dị[a], ebe ala dị ntakịrị; ha pulitere ozugbo n’ihi na ala ahụ emighị emi.
  rationale: The revision clarifies that there was little soil rather than merely a small area of land, and it refines the rendering and note for “rocky places.” It retains the Greek’s agricultural imagery, immediacy, and stated cause.
