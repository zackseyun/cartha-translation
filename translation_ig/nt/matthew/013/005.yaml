id: MAT.13.5
reference: Matthew 13:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: ig
  text: Mkpụrụ ndị ọzọ dara n’ebe okwute dị[a], ebe ala dị ntakịrị; ha pulitere ozugbo n’ihi na ala ahụ emighị emi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “n’ebe okwute dị”; okwu a na-ekwu banyere ala dị gịrịgịrị nke dị n’elu nkume siri ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: Mkpụrụ ndị ọzọ
  rationale: Ụdị nnọchiaha a dị n’ọnụọgụ ọtụtụ na-ezo aka ná mkpụrụ e kwuru okwu ha n’amaokwu bu ụzọ; itinye ‘mkpụrụ’ na-eme ka Igbo doo anya ma chekwaa ọdịiche ahụ.
- source_word: ἔπεσεν
  choice: dakwasịrị
  rationale: Okwu Grik pụtara nanị na ha dara n’elu ebe ahụ; ‘dakwasịrị’ na-egosipụta ihe osise ilu ahụ n’enweghị ịgbakwụnye na a kụrụ ha.
- source_word: ἐπὶ τὰ πετρώδη
  choice: n’ebe nkume dị
  rationale: Nke a na-egosi ebe ala dị gịrịgịrị nke nkume siri ike dị n’okpuru ya, ọ bụghị naanị ala jupụtara ná obere okwute.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: ebe ala na-adịghị ukwuu
  rationale: Nkebi a na-edobe echiche bụ́ na ala dị n’ebe ahụ pere mpe, n’asụsụ Igbo doro anya ma kwekọọ n’ọrụ ugbo.
- source_word: καὶ εὐθέως
  choice: ha pulitere ozugbo
  rationale: ‘Ozugbo’ na-echekwa echiche nke ihe mere n’egbughị oge.
- source_word: ἐξανέτειλεν
  choice: pulitere
  rationale: N’ọnọdụ ọrụ ugbo, okwu a na-ekwu maka mkpụrụ malitere ito ma si n’ala pụta.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: n’ihi na ala ahụ emighị emi
  rationale: 'Nke a na-echekwa ihe kpatara o ji pulite ngwa ngwa: oyi akwa ala ahụ dị gịrịgịrị, nkume dịkwa n’okpuru ya.'
