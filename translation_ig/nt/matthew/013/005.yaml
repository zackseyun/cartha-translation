translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. E ji ‘ala emighị emi’ kọwaa ala dị gịrịgịrị n’elu nkume n’enweghị ịkọwa ilu ahụ n’ụzọ nkà mmụta okpukpe.
