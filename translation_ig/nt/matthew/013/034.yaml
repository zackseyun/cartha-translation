  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ speaking to the crowds by means of parables and retains the imperfect nuance in the second clause. However, “ma ọ bụrụ na o jighị ilu” is an ‘unless/if not’ conditional construction, whereas χωρὶς παραβολῆς directly means ‘without/apart from a parable.’
  naturalness: “Ọ dịghịkwa ihe ọ na-agwa ha na-enweghị ilu” is more direct and idiomatic Standard Igbo than the conditional wording, while preserving the ongoing/customary force potentially carried by ἐλάλει.
  terminology: “ilu” is an established, clear rendering for παραβολή. “Jizọs,” “ìgwè mmadụ ahụ,” and “ihe ndị a niile” are suitable in register and meaning.
  issues:
  - severity: medium
    issue: The phrase “ma ọ bụrụ na o jighị ilu” introduces a conditional formulation.
    rationale: The Greek phrase χωρὶς παραβολῆς is not conditional; it states the absence of a parable as the circumstance or manner. “na-enweghị ilu” renders this directly without materially altering the imperfect nuance.
