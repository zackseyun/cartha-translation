id: MAT.13.34
reference: Matthew 13:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: ig
  text: Jizọs ji ilu gwa ìgwè mmadụ ahụ ihe ndị a niile; ọ dịghịkwa ihe ọ na-agwa ha na-enweghị ilu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ dịghịkwa ihe ọ gwara ha na-enweghị ilu.” Ngwaa Grik e ji mee ihe n’ebe a nwere ike igosi omume a na-emekarị ma ọ bụ naanị ihe mere n’oge gara aga.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: ihe ndị a niile
  rationale: Nke a na-edobe ma nrụtụ aka dị na Ταῦτα ma echiche nke ‘niile’ dị na πάντα n’Igbo doro anya.
- source_word: ἐλάλησεν
  choice: gwa
  rationale: N’ebe a, ‘gwa’ bụ ụzọ Igbo nkịtị si egosi na Jizọs gwara ìgwè mmadụ okwu, ma kwekọọ n’aorist nke chịkọtara okwu ya.
- source_word: ἐν παραβολαῖς
  choice: ji ilu
  rationale: ‘Ji ilu’ na-egosi ụzọ ma ọ bụ ihe e ji kwuo okwu, nke bụ ọrụ ἐν na dative n’ebe a; ‘ilu’ bụ okwu Igbo kwụ chịm maka παραβολή n’ọnọdụ a.
- source_word: τοῖς ὄχλοις
  choice: ìgwè mmadụ ahụ
  rationale: Ọ bụ okwu Igbo dị ndụ ma doo anya maka ndị mmadụ gbakọrọ; ‘ahụ’ na-egosi ìgwè ndị a kpọtụrụ aha n’akụkọ ahụ.
- source_word: χωρὶς παραβολῆς
  choice: ma ọ bụrụ na o jighị ilu
  rationale: Nke a na-ebute echiche ‘na-enweghị ilu’ n’Igbo na-asụ asụ nke ọma, ma na-ezere ime ka singular παραβολῆς bụrụ ọtụtụ n'ụzọ doro anya.
- source_word: οὐδὲν ἐλάλει
  choice: ọ dịghịkwa ihe ọ na-agwa ha
  rationale: Ụdị ‘na-agwa’ na-egosi omume na-aga n’ihu ma ọ bụ nke a na-emekarị, nke imperfect ἐλάλει nwere ike ibu n’akụkọ a.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha a na-alaghachi n’ìgwè mmadụ ahụ n’enweghị ikwughachi okwu ahụ n’ụzọ na-adịghị mkpa.
theological_decisions:
- issue: Mmesi ike nke imperfect ἐλάλει n’ahịrịokwu nke abụọ
  choice: ‘ọ na-agwa ha’ na-egosi na nke a bụ ụzọ Jizọs si agwa ìgwè mmadụ okwu n’ọnọdụ a
  alternative: ‘ọ gwara ha’ nwere ike igosi ya naanị dị ka ihe mere otu mgbe n’oge gara aga
  rationale: Ụdị a na-edobe ohere nke imperfect ịbụ omume a na-emekarị ma ọ bụ nke na-aga n’ihu, n’ebughị n’ime amaokwu ahụ nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Nhazi ‘ji ilu gwa’ na ‘ọ na-agwa ha’ na-ada ka Igbo nkịtị ma na-echekwa ụzọ e si kwuo okwu na ọdịdị imperfect nke Grik.
