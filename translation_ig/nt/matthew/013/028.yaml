id: MAT.13.28
reference: Matthew 13:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: ig
  text: Ọ sịrị ha, “Ọ bụ onye iro mere nke a.” Ndị ohu ya[a] wee sị ya, “Ì chọrọ ka anyị gaa chịkọta ha?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-ejere ya ozi.” Okwu Grik ahụ nwere ike ịpụta “ndị ohu” ma ọ bụ “ndị na-eje ozi,” dabere n’ọnọdụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: Ọ sịrị
  rationale: Nke a bụ ụzọ Igbo si akọ okwu mmadụ kwuru n’ụzọ doro anya ma kwekọọ n’akụkọ.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: onye iro
  rationale: Ọ bụ ezie na okwu Grik ahụ pụtara n'ụzọ nkịtị ‘mmadụ bụ́ onye iro,’ ‘onye iro’ na-enye otu echiche ahụ n’Igbo n’enweghị ikwughachi okwu na-adịghị mkpa.
- source_word: τοῦτο ἐποίησεν
  choice: mere nke a
  rationale: Ọ na-egosi omume e mere n’oge gara aga, ma na-edobe ntụaka nke τοῦτο, ‘nke a.’
- source_word: δοῦλοι
  choice: ndị ohu
  rationale: N’ọnọdụ ezinụlọ na ọrụ ugbo nke ilu a, okwu a na-egosi ndị nọ n’okpuru nna ha ukwu; ‘ndị ohu’ na-edobe ọnọdụ mmekọrịta ahụ nke ọma. E tinyere ‘ndị na-ejere ya ozi’ dị ka nhọrọ ọzọ n’okpuru amaokwu.
- source_word: Θέλεις
  choice: Ì chọrọ
  rationale: Nke a bụ ajụjụ Igbo dị ugbu a ma bụrụkwa nke nkịtị maka ọchịchọ ma ọ bụ uche mmadụ.
- source_word: οὖν
  choice: wee
  rationale: N’ebe a, okwu ahụ na-akwalite mkparịta ụka gaa n’ihe sochirinụ; ‘wee’ na-eme ka usoro akụkọ ahụ gaa were were.
- source_word: ἀπελθόντες
  choice: ka anyị gaa
  rationale: 'Ọ na-edobe mmegharị ahụ na usoro omume: ha ga-ebu ụzọ gaa, mesịa chịkọta ahịhịa ahụ.'
- source_word: συλλέξωμεν
  choice: chịkọta
  rationale: Okwu a dabara n’ịchịkọta ihe ndị toro n’ubi ma ghara itinye echiche ọzọ dịka ‘ịghọrọ’ nke na-apụtaghị kpọmkwem n’okwu Grik.
- source_word: αὐτά
  choice: ha
  rationale: Nnọchiaha a na-ezo aka n’ahịhịa ọjọọ ndị a kpọtụrụ aha n’amaokwu ndị bu ụzọ; ‘ha’ na-edobe ntụaka ahụ n’Igbo.
theological_decisions:
- issue: Nsụgharị δοῦλοι n’ilu a
  choice: ndị ohu
  alternative: ndị na-ejere ya ozi
  rationale: ‘Ndị ohu’ na-egosipụta n’ụzọ doro anya na ndị a nọ n’okpuru ikike onye nwe ubi. E debeghị ọdịiche ahụ ka ọ bụrụ ozizi pụrụ iche; e nyere okwu dị nro, ‘ndị na-ejere ya ozi,’ n’ala peeji n’ihi na δοῦλοι nwere ike ịpụta otu n’ime ha dabere n’ọnọdụ.
translation_notes:
  register: E ji Standard Igbo dị mfe, nke oge a ma dịkwa ùgwù. Ahịrịokwu ahụ na-edobe usoro mkparịta ụka Grik, ebe ‘wee’ na-eme ka ọ bụrụ Igbo sitere n’ọnụ mmadụ ma na-agụ were were.
