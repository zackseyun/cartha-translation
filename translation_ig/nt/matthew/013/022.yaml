id: MAT.13.22
reference: Matthew 13:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: ig
  text: Ma onye a kụrụ n’etiti ogwu bụ onye na-anụ okwu ahụ[a]; nchegbu nke oge a na aghụghọ nke akụnụba[b] na-akpagbu okwu ahụ, ọ ghọọ onye na-adịghị amị mkpụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nchegbu nke ụwa a.” N'ụzọ nkịtị, Grik sịrị, “nchegbu nke oge a.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsị, “aghụghọ nke akụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: Ma nke a ghara n’etiti ogwu
  rationale: Nke a na-edobe ihe atụ nke ịgha mkpụrụ, ma ọ naghị eme ka Igbo sie ike site n’ịkpọ mmadụ kpọmkwem ‘onye a ghara.’ Nkebi na-esochi ya kọwara na ihe a na-ekwu banyere ya bụ onye na-anụ okwu ahụ.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: onye na-anụ okwu ahụ
  rationale: Nkebi okwu a na-asụ Igbo nke ọma ma na-edobe omume dị ugbu a nke participle ἀκούων. ‘Okwu ahụ’ na-ezo aka n’ozi a na-ekwusa n’ihe atụ ahụ.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: nchegbu nke oge a
  rationale: ‘Nchegbu’ na-egosi echiche nke ịdị na-echegbu onwe ma ọ bụ ibu ihe n’obi; ‘oge a’ na-edobe ihe αἰών pụtara n’ụzọ ziri ezi karịa ịsụgharị ya ozugbo dị ka ụwa.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: aghụghọ nke akụ na ụba
  rationale: Nke a na-egosi na akụ na ụba nwere ike iduhie mmadụ, ma jiri okwu Igbo nke oge a nke ọtụtụ ndị na-aghọta.
- source_word: συμπνίγει
  choice: na-akpagbu
  rationale: ‘Na-akpagbu’ na-ebute echiche nke ogwu na-amachibido ihe a kụrụ, na-egbochi ya ito ma mịa mkpụrụ; ọ na-edobekwa ike nke ihe atụ ahụ n’Igbo eke.
- source_word: ἄκαρπος γίνεται
  choice: onye ahụ wee ghara ịmị mkpụrụ
  rationale: Ịkpọghachi ‘onye ahụ’ na-eme ka o doo anya na onye na-anụ okwu ahụ bụ onye na-adịghị amị mkpụrụ, ọ bụghị na okwu ahụ enweghị ike n’onwe ya.
theological_decisions:
- issue: Nsụgharị αἰών
  choice: oge a
  alternative: ụwa a
  rationale: αἰών bụ isi na-egosi oge ma ọ bụ ọgbọ, ọ bụghị ụwa a hụrụ anya n’onwe ya. ‘Oge a’ na-edobe ọdịiche nke oge na omume dị n’Agba Ọhụrụ, ebe e debere ‘ụwa a’ n’ala ala peeji dịka nsụgharị ọzọ kwe omume.
- issue: Onye ma ọ bụ ihe na-aghọ onye na-adịghị amị mkpụrụ
  choice: onye ahụ wee ghara ịmị mkpụrụ
  alternative: ọ wee ghara ịmị mkpụrụ
  rationale: Nkọwa Jizọs kwuru kpọmkwem banyere ‘onye na-anụ okwu ahụ.’ Ịkpọghachi ‘onye ahụ’ na-egbochi nghọta na okwu Chineke n’onwe ya bụ ihe na-enweghị mkpụrụ, ma na-edobe ntụgharị ahụ site n’ihe a kụrụ gaa n’onye ihe ahụ nọchiri anya ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. A hapụrụ ihe atụ nke ịgha mkpụrụ na ịmị mkpụrụ ka njikọ ya na ilu ahụ ghara ịla n’iyi. E ji ‘onye ahụ’ na nkebi ikpeazụ mee ka onye a na-ekwu banyere ya doo anya n’enweghị itinye nkọwa ụka pụrụ iche.
