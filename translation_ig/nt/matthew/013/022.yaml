revisions:
- from: Ma nke a ghara n’etiti ogwu bụ onye na-anụ okwu ahụ; ma nchegbu nke oge a[a] na aghụghọ nke akụ na ụba[b] na-akpagbu okwu ahụ, onye ahụ wee ghara ịmị mkpụrụ.
  to: Ma onye a kụrụ n’etiti ogwu bụ onye na-anụ okwu ahụ[a]; nchegbu nke oge a na aghụghọ nke akụnụba[b] na-akpagbu okwu ahụ, ọ ghọọ onye na-adịghị amị mkpụrụ.
  rationale: The revision corrects the incomplete and impersonal opening construction, preserves the Greek’s personal participial referent, and gives a closer natural rendering of “becomes unfruitful.” It keeps the source’s ambiguity-free grammatical sense without adding theological interpretation. Footnotes retain their anchors and provide meaningful alternatives.
