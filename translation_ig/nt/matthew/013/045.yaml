  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: ig
  text: Ọzọkwa[a], alaeze eluigwe yiri onye ahịa na-achọ pel ndị dị mma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ kpọmkwem karịa: “Ọzọkwa, alaeze eluigwe yiri mmadụ, onye ahịa, na-achọ pel ndị dị mma.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Ọzọkwa
  rationale: Ọ na-ewebata ntụnyere ọzọ n’usoro ilu banyere alaeze ahụ ma na-eme ka okwu gara aga na nke a jikọọ nke ọma.
- source_word: ὁμοία ἐστὶν
  choice: yiri
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ntụnyere n’ilu.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: alaeze eluigwe
  rationale: Ọ bụ okwu Matiu ji eme ihe pụrụ iche; nsụgharị a bụ nke doro anya ma guzosie ike n’Igbo.
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: onye ahịa
  rationale: ἔμπορος na-akọwa onye ahụ nke ọma, ya mere ikwughachi ‘nwoke’ n’ahịrị bụ isi adịghị mkpa n’Igbo; e debere ụdị okwu ahụ zuru ezu n’ala ala peeji.
- source_word: ζητοῦντι
  choice: na-achọ
  rationale: Ọ na-egosi ọrụ onye ahịa ahụ na-aga n’ihu, dịka participle nke Greek si dị.
- source_word: καλοὺς μαργαρίτας
  choice: nkume pel ndị mara mma
  rationale: καλός n’ebe a na-egosi ịdị mma ma ọ bụ ịdị oke ọnụ ahịa; ‘ndị mara mma’ na-edobe okwu ahụ n’enweghị ịkọwapụta ya naanị dị ka ọnụ ahịa.
theological_decisions:
- issue: Ihe e ji alaeze eluigwe tụnyere ozugbo
  choice: E ji alaeze eluigwe tụnyere onye ahịa ahụ ozugbo.
  alternative: A pụrụ ịghọta ntụnyere ahụ dịka ọnọdụ niile metụtara onye ahịa na-achọ nkume pel ndị mara mma.
  rationale: Nhazi Greek ὁμοία ἐστὶν ... ἀνθρώπῳ ἐμπόρῳ na-eme ka onye ahịa bụrụ ihe e ji tụnyere alaeze ahụ ozugbo. A hapụrụ nkọwa sara mbara nke ilu ahụ ka amaokwu na-esote gosipụta ya, kama idozi esemokwu nkọwa ahụ n’amaokwu a.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. ‘Nkume pel’ bụ okwu a na-aghọta nke ọma maka pearl, ebe ‘onye ahịa’ na-ada ka okwu ndị mmadụ na-eji ugbu a karịa ụdị okwu ochie.
