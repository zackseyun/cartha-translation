- from: Ọzọkwa[a], alaeze eluigwe yiri onye ahịa na-achọ nkume pel ndị mara mma.
  to: Ọzọkwa[a], alaeze eluigwe yiri onye ahịa na-achọ pel ndị dị mma.
  rationale: The revision removes the unnecessary ‘nkume’ and renders the quality nuance of καλοὺς as ‘ndị dị mma.’ It also corrects the footnote’s generic reference to the merchant while preserving the alternative’s more explicit Greek phrasing.
