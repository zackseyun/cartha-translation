id: MAT.13.44
reference: Matthew 13:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: ig
  text: Alaeze eluigwe dị ka akụ e zoro n’ubi[a], nke otu nwoke chọtara ma zoo; n’ihi ọṅụ ya, ọ gara ree ihe niile o nwere ma zụta ubi ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Alaeze eluigwe dị ka akụ e zoro n’otu ubi.”'
    reason: N’Igbo, “n’ubi” nwere ike ịdị ka ntụaka zuru ụwa ọnụ ma ọ bụ nke a kapịrị ọnụ n’ọnọdụ a; “n’otu ubi” na-eme ka echiche “n’ime otu ubi” pụta ìhè.
  - marker: b
    text: Ma ọ bụ, “Site n’ọṅụ ya, ọ gara ree ihe niile o nwere ma zụta ubi ahụ.”
    reason: Nkebiokwu Grik ἀπὸ τῆς χαρᾶς αὐτοῦ na-egosi na ọṅụ ya bụ ihe kpaliri omume ndị sochirinụ; a pụrụ iji “n’ihi” ma ọ bụ “site n’” gosipụta nke a n’Igbo.
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: dị ka
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi gosipụta ntụnyere dị n’ilu ahụ.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Alaeze eluigwe
  rationale: Ọ na-edobe okwu Matiu a maara nke ọma, ma hapụkwa βασιλεία ka ọ nwee echiche nke alaeze na ọchịchị.
- source_word: θησαυρῷ
  choice: akụ
  rationale: “Akụ” bụ okwu Igbo sara mbara ma kwekọọ n’ihe bara nnukwu uru e zoro ezo; “otu” dị n’ahịrị na-eme ka ntụnyere na-abụghị nke a kapịrị ọnụ pụta ìhè.
- source_word: κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: e zoro n’otu ubi
  rationale: Ọ na-egosi ọnọdụ nke ihe ahụ ka zoro ezo, ma jiri “otu ubi” mee ka anarthrous comparative sense bụrụ nke ebumpụta ụwa n’Igbo.
- source_word: ὃν εὑρὼν ἄνθρωπος
  choice: Otu nwoke chọtara ya
  rationale: Ọ na-edobe onye nwoke n’akụkọ ahụ ma hazie participle ahụ n’usoro Igbo dị mfe nghọta.
- source_word: ἔκρυψεν
  choice: zoo ya ọzọ
  rationale: Ihe nnọchi anya “ya” na-eme ka ihe e zoro doo anya; “ọzọ” na-egosi na nwoke ahụ zoro akụ ahụ mgbe ọ chọtara ya, nke ọnọdụ akụkọ ahụ na-egosi.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: n’ihi ọṅụ ya
  rationale: Ọ na-egosipụta ihe kpatara omume nwoke ahụ n’enweghị iwepụ mmetụta ọṅụ ya.
- source_word: ὑπάγει
  choice: ọ gaa
  rationale: Ọ bụ okwu Igbo dị mfe nke na-edobe mmegharị na usoro omume dị n’akụkọ ahụ.
- source_word: πωλεῖ πάντα ὅσα ἔχει
  choice: ree ihe niile o nwere
  rationale: Ọ na-edobe oke zuru ezu nke πάντα ὅσα ma bụrụ okwu azụmahịa Igbo a na-aghọta ngwa ngwa.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: zụta ubi ahụ
  rationale: “Ubi ahụ” na-egosipụta demonstrative ἐκεῖνον ma mesie otu ubi ahụ nwere akụ ike.
theological_decisions:
- issue: Nsụgharị βασιλεία
  choice: Alaeze
  alternative: Ọchịchị
  rationale: “Alaeze” bụ okwu a maara nke ọma ma na-ahapụ ohere maka ma ókèala ma ọchịchị Chineke, kama ikpebi naanị otu akụkụ.
- issue: Nsụgharị ἄνθρωπος
  choice: otu nwoke
  alternative: otu onye
  rationale: Onye e sere n’ilu ahụ bụ nwoke n’usoro asụsụ Grik; nsụgharị ahụ na-edobe nkọwa ahụ n’enweghị ime ka ọ bụrụ ozizi gbasara naanị ụmụ nwoke.
- issue: Njikọ ἀπὸ τῆς χαρᾶς αὐτοῦ na usoro ahịrịokwu
  choice: jikọta ya na ire ihe niile dịka ihe kpatara omume ya
  alternative: jikọta ya na izochi akụ ahụ
  rationale: Usoro okwu Grik na nghọta kachasị ebumpụta ụwa na-eme ka ọṅụ ahụ bụrụ ihe na-akpali ịga, ire ihe niile, na ịzụ ubi; e tinyere ihe ọzọ n’ala peeji iji gosi ụdị nhazi okwu ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Alaeze eluigwe” na-edobe ụdị okwu Matiu; ahịrịokwu ndị dị mkpirikpi na-eme ka ilu ahụ na-aga were were. Akara ala peeji [a] na [b] pụtara n’ederede isi.
