revisions:
- from: Alaeze eluigwe dị ka akụ e zoro n’otu ubi[a]. Otu nwoke chọtara ya, zoo ya ọzọ; n’ihi ọṅụ ya[b], ọ gaa ree ihe niile o nwere, zụta ubi ahụ.
  to: Alaeze eluigwe dị ka akụ e zoro n’ubi[a], nke otu nwoke chọtara ma zoo; n’ihi ọṅụ ya, ọ gara ree ihe niile o nwere ma zụta ubi ahụ[b].
  rationale: 'E wepụrụ “ọzọ” n’ihi na ọ na-agbakwunye echiche “ọzọ/again” nke na-adịghị na Grik. E dozikwara usoro ngwaa ka omume nwoke ahụ bụrụ nke doro anya na nke na-aga nke ọma n’Standard Igbo: ọ chọtara akụ ahụ ma zoo ya, wee gaa ree ihe niile o nwere ma zụta ubi ahụ. A degharịala ala peeji b ka ọ bụrụ ezigbo nhọrọ ntụgharị maka mmekọrịta kpatara omume nke “n’ihi ọṅụ ya.”'
