source:
  edition: SBLGNT
  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: ig
  text: Ụmụnne nwanyị ya niile, ọ̀ bụghị n’etiti anyị ka ha nọ? Oleezi ebe nwoke a si nweta ihe ndị a niile?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ikwu nwanyị ya.” Okwu Grik a na-apụtakarị “ụmụnne nwanyị” n’ebe a, ma ụfọdụ na-aghọta ya n’ụzọ sara mbara n’ihi arụmụka ozizi ndị bilitere mgbe e mesịrị.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: ụmụnne ya ndị inyom
  rationale: N’ebe a, okwu Grik a na-egosikarị ụmụnne nwanyị. Nsụgharị a na-eme ka mmekọrịta ezinụlọ na okike ha doo anya n’Igbo, n’ebughị ụzọ tinye nkọwa ozizi ọzọ.
- source_word: οὐχὶ πᾶσαι
  choice: niile, ọ̀ bụghị ... ka ha nọ?
  rationale: Ụdị ajụjụ a na-atụ anya azịza nkwenye. Ọ na-echekwa ma ajụjụ nkwupụta ahụ ma nkwusi ike dị n’okwu ‘niile.’
- source_word: πρὸς ἡμᾶς
  choice: n’etiti anyị
  rationale: N’ụdị okwu a, ọ na-egosi na ha nọ n’obodo ahụ ma ndị na-ekwu okwu maara ha. ‘N’etiti anyị’ bụ Igbo dị mfe ma kwekọọ n’echiche ahụ.
- source_word: πόθεν οὖν
  choice: Oleezi ebe ... si
  rationale: πόθεν na-ajụ ebe ihe siri bịa, ebe οὖν na-egosi nkwubi okwu ndị obodo ahụ na-eru. ‘Oleezi ebe’ na-enye ha abụọ n’Igbo ebumpụta ụwa.
- source_word: τούτῳ
  choice: nwoke a
  rationale: Nnọchiaha ngosi ahụ na-arụtụ aka n’ebe Jizọs nọ ma nwee ike inwe ụda nke ileda ya anya ntakịrị. ‘Nwoke a’ na-echekwa ụdị ntụaka ahụ.
- source_word: ταῦτα πάντα
  choice: ihe ndị a niile
  rationale: Nke a na-arụtụ aka n’ụzọ sara mbara n’amamihe na ọrụ ebube ndị a kpọtụrụ aha n’okwu gbara ya gburugburu, ma na-echekwa ọtụtụ ihe dị n’asụsụ Grik.
theological_decisions:
- issue: Ụdị mmekọrịta ndị inyom ahụ na Jizọs
  choice: A sụgharịrị ἀδελφαὶ n’echiche ya a na-ejikarị eme ihe, ‘ụmụnne ... ndị inyom.’
  alternative: ‘ndị ikwu ya ndị inyom’
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ekwu banyere ezinụlọ Jizọs, ya mere ‘ụmụnne ya ndị inyom’ bụ nghọta kachasị nso na nke nkịtị. Ihe odide ahụ n’onwe ya anaghị edozi arụmụka ozizi ndị mechara pụta; ya mere, e debere ohere nghọta sara mbara naanị n’ala ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, mee ihe. Akara ụda dị na ‘ọ̀ bụghị’ na-enyere aka igosi ajụjụ nkwupụta nke na-atụ anya azịza nkwenye; ‘Oleezi’ na-egosipụta ntụgharị echiche nke οὖν n’enweghị asụsụ siri ike.
