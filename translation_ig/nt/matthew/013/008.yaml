  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὴν γῆν τὴν καλὴν καὶ ἐδίδου καρπόν, ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: ig
  text: 'Ma mkpụrụ ndị ọzọ dara n’ala ọma ahụ, wee na-amị mkpụrụ: ụfọdụ[a] otu narị okpukpu, ụfọdụ iri isii okpukpu, ụfọdụkwa iri atọ okpukpu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịtụgharị ya, “wee mịa mkpụrụ: nke otu otu narị okpukpu, nke ọzọ iri isii okpukpu, nke ọzọkwa iri atọ okpukpu.” Okwu Grik ahụ na-ekesa ihe dị iche iche; a pụkwara igosipụta ya dịka “ụfọdụ… ụfọdụ… ụfọdụ” ma ọ bụ “nke otu… nke ọzọ… nke ọzọ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: mkpụrụ ndị ọzọ
  rationale: Ọ bụ adjective neuter plural e ji dị ka aha, na-ezo aka ná mkpụrụ a kụrụ n’amaokwu ndị bu ụzọ; e tinyere “mkpụrụ” ka ihe ọ na-ezo aka doo anya.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ihe mere mkpụrụ ndị a na ihe mere ndị dara n’ụdị ala ndị ọzọ.
- source_word: ἔπεσεν
  choice: dara
  rationale: Nke a na-edobe ihe ngwaa Grik ahụ kwuru kpọmkwem banyere mkpụrụ dara, kama ịgbanwe ya ka ọ bụrụ “a kụrụ.”
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: n’ala ọma ahụ
  rationale: N’ọnọdụ ọrụ ugbo a, “ala ọma” pụtara ala dị mma maka ịmị mkpụrụ, ma ọ bụ ala na-eme nri.
- source_word: ἐδίδου καρπόν
  choice: wee na-amị mkpụrụ
  rationale: “Na-amị” na-egosipụta omume na-aga n’ihu nke imperfect Grik, ma na-edobekwa oyiyi ọrụ ugbo nke καρπός.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: ụfọdụ otu narị okpukpu, ụfọdụ iri isii, ụfọdụkwa iri atọ
  rationale: “Ụfọdụ… ụfọdụ… ụfọdụkwa” na-anọchi anya nkesa mkpụrụ dị iche iche n’ụzọ ebumpụta ụwa n’Igbo; “okpukpu” e kwuru na nke mbụ ka a ghọta ya na ọnụọgụ abụọ ndị ọzọ.
