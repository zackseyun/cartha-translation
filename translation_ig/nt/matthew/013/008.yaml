  naturalness: The verse is generally clear and in an appropriate contemporary Standard Igbo register. Repeating “okpukpu” produces a clearer, more balanced yield series. The footnote’s alternative wording, however, contains awkward/unidiomatic phrasing (“A pụkwara ịsụ ya” and “nke otu otu narị okpukpu”) and needs correction. The note marker should be placed on the distributive expression it explains.
