  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro ihe atụ ọrụ ugbo na omume na-aga n’ihu nke ngwaa Grik; akara nkọwa [a] pụtara n’isiokwu dịka achọrọ.
