  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: ig
  text: Ma anya unu gọziri agọzi, n’ihi na ha na-ahụ; ntị unu gọzikwara agọzi, n’ihi na ha na-anụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi ha na-ahụ ... n’ihi ha na-anụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ndị na-adịghị ahụ ma ọ bụ anụ n’amaokwu ndị bu ụzọ na ndị na-eso ụzọ Jizọs.
- source_word: μακάριοι
  choice: ndị a gọziri agọzi
  rationale: Nke a na-egosi ọnọdụ ihu ọma na ngọzi, ọ bụghị naanị inwe obi ụtọ.
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: anya unu
  rationale: Nke a bụ ụzọ Igbo si ekwu ya n’ụzọ nkịtị ma doo anya, na-edobekwa nnọchiaha nke onye nke abụọ n’ọtụtụ.
- source_word: ὅτι βλέπουσιν
  choice: n’ihi na ha na-ahụ ụzọ
  rationale: A ghọtara ὅτι dị ka ihe na-enye ihe kpatara ngọzi ahụ; ‘ịhụ ụzọ’ bụ okwu Igbo nkịtị maka ikike ịhụ ihe.
- source_word: τὰ ὦτα ὑμῶν
  choice: ntị unu
  rationale: Ọ bụ ntụgharị Igbo dị mfe ma bụrụkwa nke ya na ‘anya unu’ kwekọrọ.
- source_word: ὅτι ἀκούουσιν
  choice: n’ihi na ha na-anụ ihe
  rationale: Ọ na-enye ihe kpatara e ji kpọọ ntị ahụ ndị a gọziri agọzi ma na-edobe ngwaa anụ ahụ nke isi mmalite.
- source_word: βλέπουσιν / ἀκούουσιν
  choice: na-ahụ ụzọ / na-anụ ihe
  rationale: A hapụrụ asụsụ nke ịhụ na ịnụ dịka o si dị, n’etinyeghị ‘ịghọta,’ ka ihe gbara amaokwu ahụ gburugburu kọwaa echiche ime mmụọ ya.
theological_decisions:
- issue: Ma a ga-eme ka ịhụ na ịnụ bụrụ ihe ime mmụọ n’ụzọ doro anya
  choice: Idowe okwu anụ ahụ ‘na-ahụ ụzọ’ na ‘na-anụ ihe’ n’etinyeghị ‘na-aghọta.’
  alternative: ‘anya unu ... na-aghọta ihe ha na-ahụ; ntị unu ... na-aghọta ihe ha na-anụ’
  rationale: Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-ekwu banyere nghọta, amaokwu a n’onwe ya na-ekwu naanị ịhụ na ịnụ. Nke a na-edobe nghọta sara mbara nke okwu Jizọs n’enweghị ịkọwa ya karịa ihe e dere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ihe. E debere nhazi yiri ibe ya nke ‘anya unu’ na ‘ntị unu,’ tinyere asụsụ nkịtị nke ịhụ na ịnụ.
