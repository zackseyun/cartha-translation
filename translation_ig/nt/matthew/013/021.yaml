id: MAT.13.21
reference: Matthew 13:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: ig
  text: Ma o nweghị mgbọrọgwụ n’ime ya; ọ na-adị naanị nwa oge. Mgbe nsogbu ma ọ bụ mkpagbu bilitere n’ihi okwu ahụ, ọ na-adapụ ozugbo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọ na-asụ ngọngọ” ma ọ bụ “ọ na-ewe iwe.” Okwu Grik ahụ nwere ike ịpụta na ọ na-asụ ngọngọ, na e mere ka ọ sụọ ngọngọ, ma ọ bụ na ọ na-ewe iwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν
  choice: mgbọrọgwụ
  rationale: Ọ na-edobe ihe atụ nke mgbọrọgwụ dị n’ilu ahụ n’ụzọ doro anya ma bụrụkwa okwu Igbo a na-eji eme ihe.
- source_word: ἐν ἑαυτῷ
  choice: n’ime ya
  rationale: Nke a na-egosipụta echiche nke ihe dị n’ime onye ahụ n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: πρόσκαιρός
  choice: ọ na-adịgide naanị nwa oge
  rationale: Ọ na-egosi na onye ahụ anaghị anọgide ogologo oge, ma ọ bụkwa okwu Igbo dị mfe nghọta karịa ntụgharị siri ike nke ga-asị na onye ahụ bụ ‘nwa oge.’
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: mgbe nsogbu ma ọ bụ mkpagbu bịara
  rationale: A sụgharịrị genitive absolute dị ka nkebiokwu oge; ‘nsogbu’ na-egosi nrụgide ma ọ bụ ahụhụ, ebe ‘mkpagbu’ na-egosi mmegide a na-emegide mmadụ.
- source_word: διὰ τὸν λόγον
  choice: n’ihi okwu ahụ
  rationale: Ọ na-edobe njikọ okwu λόγος na ozi a kụrụ dịka mkpụrụ n’ilu ahụ, ma na-eme ka o doo anya na ọ bụ okwu ahụ e kwuru okwu ya.
- source_word: εὐθὺς
  choice: ozugbo
  rationale: Ọ na-egosipụta ngwa ngwa e mesiri ike n’amaokwu ahụ.
- source_word: σκανδαλίζεται
  choice: ọ na-adapụ
  rationale: N’ebe a, ọ na-egosi na onye natara okwu ahụ anaghị anọgide mgbe nsogbu bịara. Ihe ndị ọzọ okwu Grik ahụ nwere ike ịpụta ka edepụtara n’ala peeji.
- source_word: δὲ ... ἀλλά
  choice: Ma ...;
  rationale: ‘Ma’ na-egosi ọdịiche n’ihe e kwuru n’amaokwu gara aga, ebe semicolon na-ejikọta enweghị mgbọrọgwụ na ịdịgide naanị nwa oge n’ụzọ Igbo na-aga were were.
theological_decisions:
- issue: Otu e si sụgharịa σκανδαλίζεται n’ihe gbasara ịnọgide n’okwukwe
  choice: ọ na-adapụ
  alternative: ọ na-asụ ngọngọ; ọ na-ewe iwe ma jụ okwu ahụ
  rationale: ‘Ọ na-adapụ’ na-egosi ọdịda onye ahụ mgbe mkpagbu bịara, ma ọ naghị ekpebi ozizi niile gbasara ma onye ahụ furu nzọpụta. Ihe okwu Grik ahụ nwekwara ike ịpụta dị n’ala peeji iji chekwaa obosara ya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ nke mgbọrọgwụ na nke ‘okwu ahụ,’ ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa ozizi agbakwunyere.
