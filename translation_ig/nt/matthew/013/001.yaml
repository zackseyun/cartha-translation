id: MAT.13.1
reference: Matthew 13:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐξελθὼν ὁ Ἰησοῦς ⸀τῆς οἰκίας ἐκάθητο παρὰ τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: ig
  text: N’ụbọchị ahụ, Jizọs si n’ụlọ ahụ pụta, nọdụkwa n’akụkụ oké osimiri[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “N’otu ụbọchị ahụ,” ma ọ bụrụ na a ghọta nkebiokwu a dị ka ihe na-emesi njikọ ya na ihe ndị bu ya ụzọ ike, ọ bụghị naanị igosi oge.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “nso n’oké osimiri.” Okwu Grik ahụ na-egosi ebe dị nso n’oké osimiri, ma ọ naghị akọwa kpọmkwem otú ebe ahụ si dị anya site n’ụsọ mmiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: N’ụbọchị ahụ
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi oge a kpọtụrụ aha; ọ naghị etinye echiche ‘otu ụbọchị ahụ kpọmkwem’ nke okwu Grik ekwughị hoo haa.
- source_word: ἐξελθὼν ... τῆς οἰκίας
  choice: si n’ụlọ ahụ pụta
  rationale: Ọ na-ejikọta participle ahụ na ebe Jizọs si pụta n’ụzọ doro anya ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: A sụgharịghị aha mmadụ; e dere ya dịka usoro nsupe Igbo a na-ejikarị.
- source_word: ἐκάθητο
  choice: nọdụkwa
  rationale: Ọ na-akọ omume sochiri ọpụpụ ahụ n’ụzọ Igbo dị ire. Ọ naghị agbakwunye echiche pụrụ iche dịka ‘were oche ya,’ nke ụdị ngwaa Grik ahụ anaghị achọ.
- source_word: παρὰ τὴν θάλασσαν
  choice: n’akụkụ oké osimiri
  rationale: Ọ na-egosi ọnọdụ dị nso n’oké osimiri n’ebughị ụzọ kwuo kpọmkwem ebe dị anya site n’ụsọ mmiri.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. Njikọ ‘nọdụkwa’ na-eme ka usoro omume abụọ ahụ bụrụ nke ebumpụta ụwa n’Igbo, ebe ‘oké osimiri’ na-ezere ịkọwapụta ya dịka ụsọ mmiri kpọmkwem.
