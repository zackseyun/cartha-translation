id: MAT.13.11
reference: Matthew 13:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: ig
  text: Ọ zara ha, sị, “E nyela unu ịmata ihe omimi[a] nke alaeze eluigwe, ma e nyeghị ha ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe nzuzo nke alaeze eluigwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ọ zara ha, sị
  rationale: N'Igbo, usoro a na-egosi nke ọma na ọ zara ha wee kwuo okwu sochirinụ, n'enweghị ntụgharị siri ike nke na-emeghachi otu echiche n'ụzọ na-adịghị eke.
- source_word: ὑμῖν δέδοται
  choice: E nyela unu
  rationale: Nke a na-edobe perfect passive ahụ dịka ọnọdụ dị ugbu a sitere n'ihe e nyere na mbụ, ma hapụ onye nyere ya n'ekwughị aha dịka Grik si mee.
- source_word: γνῶναι
  choice: ịmata
  rationale: “Ịmata” bụ ntụgharị kpọmkwem na nke eke maka γινώσκω; ọ naghị eme ka ihe ahụ bụrụ naanị nghọta nke uche.
- source_word: τὰ μυστήρια
  choice: ihe omimi
  rationale: “Ihe omimi” na-egosi eziokwu Chineke zoro ezo ma kpughee, ma ọ bụghị naanị ilu ma ọ bụ ozi nzuzo nkịtị.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: nke alaeze eluigwe
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka akpaokwu Matiu a, ma na-edobe njikọ nke ihe omimi ahụ na alaeze eluigwe.
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: ma e nyeghị ha ya
  rationale: “Ha” na-edobe ọdịiche dị n'etiti ndị na-eso ụzọ na ndị ọzọ n'ụzọ eke; “ya” na-ezo aka n'ikike ịmata ihe omimi ahụ ma na-eme ka Igbo zuo oke.
theological_decisions:
- issue: Onye nyere ihe ọmụma ahụ n'ahịrịokwu passive
  choice: E nyela unu ... ma e nyeghị ha ya
  alternative: Chineke enyela unu ... ma o nyeghị ha ya
  rationale: Grik ekwughị onye nyere ya. Ịhapụ ya n'ụdị passive na-edobe usoro okwu ahụ na nrụgide nkà mmụta okpukpe kama ịkpọ Chineke aha n'ụzọ nkọwa.
- issue: Ihe μυστήρια pụtara n'ihe gbasara alaeze
  choice: ihe omimi
  alternative: ihe nzuzo
  rationale: “Ihe omimi” na-edobe echiche nke eziokwu Chineke nke e zoro ezo ma na-ekpughe ugbu a; “ihe nzuzo” nwekwara ike ịpụta ya, ma ọ nwere ike ịdị ka ozi mmadụ na-ezo naanị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E debere usoro passive nke Grik n'enweghị ịkpọ onye nyere ya aha. Akara nkọwa ala peeji [a] dị n'akụkụ “alaeze eluigwe” dịka usoro ederede enyere si dị, ma nkọwa ahụ metụtara “ihe omimi.”
