revisions:
- from: Ma ọ sịrị, “Mba, ka unu ghara, mgbe unu na-achịkọta ahịhịa ọjọọ[a] ahụ, ihopu ọka wit ahụ na mgbọrọgwụ ya, ya na ha.”
  to: Ma ọ sịrị, “Mba; ka, mgbe unu na-achịkọta ahịhịa ọjọọ[a] ahụ, unu ghara ịdọpụta ọka wit ahụ na mgbọrọgwụ ya, ya na ahịhịa ọjọọ ahụ.”
  rationale: The revision replaces the defective verb with a clear Standard Igbo expression meaning ‘pull up by the roots,’ retains the preventive force of μήποτε, and clarifies that the wheat could be uprooted together with the weeds. The footnote retains both the traditional and more specific lexical alternatives without overstating the botanical identification.
  reviewer_model: gpt-5.6-terra
