    reason: lexical_alternative
  revision_rationale: The revision replaces the defective verb with a clear Standard Igbo expression meaning ‘pull up by the roots,’ retains the preventive force of μήποτε, and clarifies that the wheat could be uprooted together with the weeds. The footnote retains both the traditional and more specific lexical alternatives without overstating the botanical identification.
