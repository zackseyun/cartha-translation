review_pass:
  verdict: revise
  source_fidelity: The draft preserves the dialogue, negation, warning, contemporaneous gathering, weeds, wheat, and association with the weeds. However, “ihopu” is not an acceptable Standard Igbo form here and does not clearly convey ἐκριζώσητε, ‘uproot/pull up by the roots.’
  naturalness: The sentence is understandable, but “ihopu ọka wit ahụ na mgbọrọgwụ ya” is malformed and the final “ya na ha” is awkwardly attached. A direct finite warning with “ịdọpụta ... na mgbọrọgwụ ya” is clear and natural in contemporary Standard Igbo.
  terminology: “Ahịhịa ọjọọ” and “ọka wit” are suitable. The footnote should not use the English phrase “ahịhịa tares”; “atares” is a more natural Igbo borrowing when preserving the traditional term. “Darnel” may remain a cited botanical alternative, with its uncertainty retained.
  issues:
  - severity: high
    issue: Malformed rendering of ἐκριζώσητε
    rationale: “ihopu” is not a safe Standard Igbo rendering, and the construction fails to express clearly the act of uprooting. “ịdọpụta ... na mgbọrọgwụ ya” explicitly conveys pulling up by the roots.
  - severity: medium
    issue: Awkward placement and referent of “ya na ha”
    rationale: Placed after “na mgbọrọgwụ ya,” the phrase is syntactically cumbersome. Moving the full referent into the warning clause makes clear that the wheat could be uprooted together with the weeds.
  - severity: low
    issue: Footnote uses an unnatural English-noun phrase
    rationale: “ahịhịa tares” mixes Igbo and English unnecessarily. “atares” preserves the traditional alternative more naturally in Igbo.
  revised_text: Ma ọ sịrị, “Mba; ka, mgbe unu na-achịkọta ahịhịa ọjọọ[a] ahụ, unu ghara ịdọpụta ọka wit ahụ na mgbọrọgwụ ya, ya na ahịhịa ọjọọ ahụ.”
  revised_footnotes:
