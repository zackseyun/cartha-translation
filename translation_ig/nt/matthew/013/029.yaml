  text: ὁ δέ ⸀φησιν· Οὔ, μήποτε συλλέγοντες τὰ ζιζάνια ἐκριζώσητε ἅμα αὐτοῖς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: ig
  text: Ma ọ sịrị, “Mba; ka, mgbe unu na-achịkọta ahịhịa ọjọọ[a] ahụ, unu ghara ịdọpụta ọka wit ahụ na mgbọrọgwụ ya, ya na ahịhịa ọjọọ ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “atares”; n’ụzọ kapịrị ọnụ karị, o nwere ike ịbụ “darnel,” ụdị ahịhịa ọjọọ pụrụ ịdị ka ọka wit mgbe ha ka na-eto eto.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: ọ sịrị
  rationale: Ọ bụ ezie na Grik ji historical present, oge gara aga dị eke n’akụkọ Igbo ma na-echekwa ihe ọ pụtara.
- source_word: Οὔ
  choice: Mba
  rationale: Nke a na-enye azịza jụrụ ajụ ozugbo n’ụzọ doro anya ma dị eke n’Igbo.
- source_word: μήποτε
  choice: ka unu ghara
  rationale: Ọ na-egosi ịdọ aka ná ntị banyere ihe ọjọọ nwere ike ime, ma na-echekwa echiche mgbochi dị n’okwu Grik.
- source_word: συλλέγοντες
  choice: mgbe unu na-achịkọta
  rationale: Ọ na-egosi na nchịkọta ahịhịa ahụ na ihopu ọka nwere ike ime n’otu oge, ma na-agwa ndị ohu ahụ okwu ozugbo.
- source_word: ζιζάνια
  choice: ahịhịa ọjọọ
  rationale: Nke a bụ okwu Igbo nke ndị nkịtị ga-aghọta maka ahịhịa na-adịghị mma n’ubi; nkọwa ala peeji na-echekwa ohere na ọ bụ ụdị darnel nke yiri wit mgbe ọ ka na-eto eto.
- source_word: ἐκριζώσητε
  choice: ihopu ... na mgbọrọgwụ ya
  rationale: Nkebiokwu a na-egosi kpọmkwem iwepụ ihe site na mgbọrọgwụ, nke bụ isi echiche ngwaa Grik.
- source_word: ἅμα αὐτοῖς
  choice: ya na ha
  rationale: Ọ na-egosi na a ga-ewepụ ọka wit ahụ tinyere ahịhịa ọjọọ ahụ.
- source_word: σῖτον
  choice: ọka wit
  rationale: N’ọnọdụ ọrụ ugbo a, okwu ahụ na-ezo aka n’wit karịa ọka n’ozuzu, karịsịa n’ihi ọdịiche ya na ahịhịa ọjọọ.
theological_decisions:
- issue: Nsụgharị ζιζάνια n’ilu a ma ama
  choice: ahịhịa ọjọọ
  alternative: ahịhịa tares; darnel
  rationale: Amaokwu ahụ adabereghị n’ozizi pụrụ iche gbasara ụdị ahịhịa ahụ. Isi ederede ji okwu Igbo doro anya, ebe nkọwa ala peeji na-echekwa aha ọdịnala na nkọwa botani nwere ike ịbụ eziokwu n’enweghị ime ka nke a bụrụ ihe e ji n’aka.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ọka wit” mee ka ụdị ihe ọkụkụ ahụ doo anya; usoro okwu ahụ na-echekwa ịdọ aka ná ntị na njikọ dị n’etiti ihopu ahịhịa na ihopu wit.
