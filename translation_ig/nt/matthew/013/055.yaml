review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the two rhetorical questions, the familial terms, and all four names. However, the second question''s Igbo word order (''Ọ bụghị Meri ka a na-akpọ nne ya'') can be read as identifying Mary as the person called ''his mother,'' rather than saying that his mother is called Mary. Reordering it makes the Greek sense clear. The footnote anchors are also attached to the wrong words: [a] concerns ''brothers'' but follows Meri, while [b] concerns Joseph but follows Josef only incidentally after the misplaced [a].'
  naturalness: '''Nwoke a, ọ bụghị nwa onye ọkà n’ịrụ osisi?'' and ''Ọ bụghị nne ya ka a na-akpọ Meri?'' are natural, clear Standard Igbo rhetorical questions. ''Ụmụnne ya ndị nwoke'' explicitly conveys the masculine ''brothers'' in this context without deciding the debated precise family relationship.'
  terminology: Meri, Jemis, Josef, Saịmọn, and Judas are retained. 'Onye ọkà n’ịrụ osisi' follows the English audit trail's contextual rendering 'carpenter'; it should not be taken to exclude the wider possible sense of τέκτων. The lexical footnote continues to preserve the noncommittal broader familial interpretation.
  issues:
  - severity: medium
    issue: The main-text wording of the second question is syntactically unclear.
    rationale: The Greek says that Jesus' mother is called Mary (οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριάμ). In Igbo, placing 'Meri' before 'nne ya' risks reversing the relationship. 'Ọ bụghị nne ya ka a na-akpọ Meri?' clearly renders the source.
  - severity: medium
    issue: Footnote anchors are misplaced.
    rationale: Footnote [a] explains ἀδελφοὶ ('brothers') but is attached to 'Meri'; it must follow the Igbo rendering of brothers. Footnote [b] should remain directly after 'Josef,' the name to which its textual variant pertains.
