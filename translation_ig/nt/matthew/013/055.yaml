id: MAT.13.55
reference: Matthew 13:55
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: ig
  text: Nwoke a, ọ bụghị nwa onye ọkà n’ịrụ osisi? Ọ bụghị nne ya ka a na-akpọ Meri, ụmụnne ya ndị nwoke[a] bụ Jemis, Josef[b], Saịmọn na Judas?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị ikwu ya.” Okwu Grik a na-apụtakarị “ụmụnne,” ma ụfọdụ na-aghọta ya n’ụzọ sara mbara n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ ihe odide oge ochie nwere “Joses” kama “Josef.”
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: onye ọkà n’ịrụ osisi
  rationale: Okwu Grik a na-ezo aka n’ọkà ọrụ aka, karịsịa onye na-eji osisi arụ ọrụ ma ọ bụ onye na-arụ ihe owuwu. Nhọrọ a bụ okwu Igbo doro ndị mmadụ anya ma kwekọọ na nsụgharị ọdịnala nke ‘carpenter,’ n’agbanyeghị na okwu Grik ahụ nwere ike ịgụnye ọrụ owuwu ndị ọzọ.
- source_word: υἱός
  choice: nwa
  rationale: N’ọnọdụ ezinụlọ a, ọ pụtara nwa nwoke kpọmkwem; ‘nwa’ bụkwa ụzọ Igbo kachasị eke isi kwuo ya.
- source_word: λέγεται
  choice: ka a na-akpọ
  rationale: Nke a na-edobe ọdịdị passive nke okwu Grik ma na-ada nke ọma n’Igbo ugbu a.
- source_word: Μαριὰμ
  choice: Meri
  rationale: ‘Meri’ bụ ụdị aha a ndị na-agụ Baịbụl Igbo maara nke ọma.
- source_word: ἀδελφοὶ
  choice: ụmụnne
  rationale: ‘Ụmụnne’ na-ebute isi okwu Grik nke na-apụtakarị ụmụnne nwoke, ma ọ naghị ekpebi n’onwe ya ụdị njikọ ọmụmụ ha na Jizọs. Ihe odide ala peeji na-edobe nghọta sara mbara nke ‘ndị ikwu.’
- source_word: Ἰάκωβος
  choice: Jemis
  rationale: ‘Jemis’ bụ ụdị aha a a na-ejikarị eme ihe n’Agba Ọhụrụ Igbo maka onye a na-akpọ James n’asụsụ Bekee.
- source_word: Ἰωσὴφ
  choice: Josef
  rationale: Nke a na-anọchi anya ọgụgụ SBLGNT Ἰωσήφ; e debere ọgụgụ ọzọ ‘Joses’ n’ihe odide ala peeji.
- source_word: Σίμων
  choice: Saịmọn
  rationale: Nke a bụ ndegharị aha Grik ahụ n’ụdị Igbo dị mfe ịgụ.
- source_word: Ἰούδας
  choice: Judas
  rationale: Nke a na-esochi aha Grik ahụ nke ọma ma kwekọọ n’ụdị aha a ndị na-agụ Agba Ọhụrụ maara.
- source_word: οὐχ ... ;
  choice: Ọ bụghị ...? Ọ bụghị ...?
  rationale: Ajụjụ ndị a bụ ajụjụ nkwupụta na-atụ anya ka ndị na-ege ntị kweta; usoro Igbo a na-edobe ụda na nhazi ahụ.
theological_decisions:
- issue: Ihe ἀδελφοὶ αὐτοῦ pụtara gbasara mmekọrịta ezinụlọ Jizọs
  choice: ụmụnne ya
  alternative: ndị ikwu ya
  rationale: ‘Ụmụnne’ na-edobe ihe okwu Grik na-apụtakarị n’elu ederede, ma ọ naghị ewebata mkpebi okpukpe banyere ma ndị a hà bụ ụmụ Meri kpọmkwem. Ihe odide ala peeji na-egosi na ụfọdụ na-aghọta okwu ahụ n’ụzọ sara mbara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ajụjụ nkwupụta abụọ nke Grik n’ụdị ajụjụ, ma hazie ahịrịokwu nke abụọ ka ọ daa nke ọma n’Igbo. A zere ikpebi esemokwu okpukpe banyere kpọmkwem ụdị mmekọrịta ‘ụmụnne’ ndị a na Jizọs.
