  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τὰς παραβολὰς ταύτας, μετῆρεν ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/053.yaml
  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: ig
  text: Mgbe Jizọs mechara ilu ndị a, o si n'ebe ahụ pụọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n''ụzọ kwekọrọ karịa n''usoro okwu Grik: “O wee ruo, mgbe Jizọs mechara ilu ndị a, o si n''ebe ahụ pụọ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: Mgbe
  rationale: Akpaokwu Grik a na-arụ ọrụ dị ka njikọ akụkọ na-egosi oge. “Mgbe” na-egosipụta njikọ oge ahụ n’Igbo eke n’etinyeghị akpaokwu siri ike dịka “o wee ruo na mgbe.”
- source_word: ἐτέλεσεν
  choice: kwusịrị
  rationale: τελέω pụtara imecha ma ọ bụ weta ihe n’ọgwụgwụ. N’ebe a, “kwusịrị” na-egosi na Jizọs mechara ikwu ilu ndị ahụ, ma na-ada nke ọma n’Igbo.
- source_word: παραβολὰς
  choice: ilu
  rationale: N’ọnọdụ nkuzi ndị Oziọma, παραβολή bụ akụkọ atụ e ji ezi ihe. “Ilu” bụ okwu Igbo a maara nke ọma maka ụdị nkuzi a.
- source_word: ταύτας
  choice: ndị a
  rationale: Ngosipụta a na-arụtụ aka n’ilu ndị e kwuru ozugbo tupu amaokwu a.
- source_word: μετῆρεν
  choice: pụọ
  rationale: μεταίρω ebe a pụtara isi n’otu ebe gaa ebe ọzọ. “Pụọ” na-egosi ịhapụ ebe ahụ n’enweghị ịgbakwụnye ụzọ ma ọ bụ ebe ọ gara.
- source_word: ἐκεῖθεν
  choice: si n'ebe ahụ
  rationale: Nke a na-egosipụta isi n’ebe ahụ pụọ n’ụzọ doro anya ma bụrụ Igbo eke.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu bụ isi na-ebute ntụgharị akụkọ n'ụzọ eke; ihe e dere n'okpuru na-echekwa usoro akpaokwu Grik καὶ ἐγένετο n'ụzọ pụtara ìhè karịa.
