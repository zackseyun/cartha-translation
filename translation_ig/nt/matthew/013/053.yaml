  rationale: The revision replaces a slightly interpretive verb (“finished saying”) with the direct completion verb required by ἐτέλεσεν (“finished/completed”). It also regularizes the alternative footnote's formal narrative idiom without altering its purpose of reflecting καὶ ἐγένετο more visibly.
