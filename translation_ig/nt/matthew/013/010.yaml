id: MAT.13.10
reference: Matthew 13:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ μαθηταὶ εἶπαν αὐτῷ· Διὰ τί ἐν παραβολαῖς λαλεῖς αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: ig
  text: Mgbe ahụ, ndị na-eso ụzọ ya bịakwutere ya[a] sị ya, “Gịnị mere i ji eji ilu agwa ha okwu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “bịaruru ya nso”; participle Grik ahụ na-emesi ike na ndị na-eso ụzọ ahụ buru ụzọ bịaruo Jizọs nso tupu ha agwa ya okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Mgbe ahụ
  rationale: N'ebe a, καί na-akwalite akụkọ gaa n'ihe sochirinụ; “Mgbe ahụ” na-eme ka usoro akụkọ doo anya n'Igbo n'etinyeghị echiche ọhụrụ.
- source_word: προσελθόντες
  choice: bịakwutere ya
  rationale: Aorist participle a na-egosi na ha buru ụzọ bịaruo Jizọs nso tupu ha agwa ya okwu. “Bịakwutere ya” bụ Igbo eke nke na-echekwa mmegharị ahụ gaa n'ebe ọ nọ.
- source_word: οἱ μαθηταὶ
  choice: ndị na-eso ụzọ ya
  rationale: Ọ bụ ìgwè ndị na-eso ụzọ a maralarị ka a na-ekwu maka ha. Igbo na-achọkarị “ya” ebe a iji mee ka onye ha na-eso doo anya, ọ bụ ezie na nnọchiaha ahụ adịghị iche n'okwu Grik.
- source_word: εἶπαν αὐτῷ
  choice: sị ya
  rationale: Nke a na-esochi okwu ajụjụ kpọmkwem. “Sị ya” na-anọ nso n'okwu Grik nke pụtara ‘kwuru ya,’ ma bụrụkwa ụzọ Igbo si ewebata okwu kpọmkwem n'ụzọ eke.
- source_word: Διὰ τί
  choice: Gịnị mere
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi jụọ ihe kpatara ihe ji mee.
- source_word: ἐν παραβολαῖς
  choice: iji ilu
  rationale: ἐν na-egosi ụzọ ma ọ bụ ihe e ji ekwu okwu. “Iji ilu” na-egosipụta na Jizọs ji παραβολαί mee ụzọ nkuzi; n'Igbo Baịbụl na okwu nkịtị, “ilu” bụ okwu a maara nke ọma maka ụdị akụkọ ntụnyere a.
- source_word: λαλεῖς
  choice: agwa ... okwu
  rationale: Okwu a nọ n'oge ugbu a ma na-egosi ikwu okwu. Nhazi “i ji ... agwa ha okwu” bụ ajụjụ Igbo eke ma chekwaa omume ikwu okwu ahụ.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha dative a na-egosi ndị Jizọs na-agwa okwu; “agwa ha okwu” na-enye mmekọrịta ahụ n'ụzọ Igbo kwesịrị ekwesị.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ajụjụ ahụ dịka okwu kpọmkwem ma na-eji “ilu” n'echiche nke akụkọ ntụnyere e ji akụzi ihe.
