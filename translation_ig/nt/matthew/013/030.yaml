id: MAT.13.30
reference: Matthew 13:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: ig
  text: Kwe ka ha abụọ too ọnụ ruo oge owuwe ihe ubi. Mgbe oge owuwe ihe ubi ruru, aga m agwa ndị na-ewe ihe ubi, ‘Buru ụzọ chịkọtanụ ahịhịa ọjọọ ahụ[a], keenụ ha n’ùkwù n’ùkwù ka unu kpọọ ha ọkụ; ma chịkọtanụ ọka wit ahụ n’ọba m.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ahịhịa darnel,” ahịhịa ọjọọ nke yiri ọka wit mgbe ọ ka na-eto; n’ụfọdụ nsụgharị ọdịnala, “tares.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε
  choice: Kwe ka
  rationale: Ọ bụ iwu na-enye ohere; ‘Kwe ka’ na-egosipụta nke a n’Igbo nkịtị ma doo anya.
- source_word: συναυξάνεσθαι ἀμφότερα
  choice: ha abụọ too ọnụ
  rationale: Nke a na-echekwa ma echiche nke ihe abụọ ahụ ma echiche nke ito ọnụ.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: ruo oge owuwe ihe ubi
  rationale: Ọ na-egosi ihe ubi ahụ dị ka oge a kapịrị ọnụ n’ilu ahụ.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: Mgbe oge owuwe ihe ubi ruru
  rationale: Ntụgharị a bụ Igbo sitere n’ọnụ ma na-echekwa echiche nke oge kwesịrị ekwesị nke owuwe ihe ubi.
- source_word: θερισταῖς
  choice: ndị na-ewe ihe ubi
  rationale: Nke a bụ okwu Igbo doro onye nkịtị anya maka ndị ọrụ na-ewe ihe ubi.
- source_word: Συλλέξατε πρῶτον
  choice: Buru ụzọ chịkọta
  rationale: 'Ọ na-echekwa usoro omume ahụ: a ga-ebu ụzọ mee nke a.'
- source_word: τὰ ζιζάνια
  choice: ahịhịa ọjọọ ahụ
  rationale: Okwu a na-agụnye ahịhịa na-adịghị mma, karịchaa darnel; okwu sara mbara dị n’ahụ amaokwu, ebe nkọwa ụkwụ na-enye nkọwa kpọmkwem.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: kee ha n’ùkwù n’ùkwù
  rationale: Ọ na-egosipụta ijikọ ahịhịa ahụ ka ọ ghọọ ùkwù dị iche iche.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: ka a kpọọ ha ọkụ
  rationale: Ọ na-echekwa ebumnuche nke ikekọta ha, na-enweghị ịgbakwunye nkọwa gbasara ikpe ikpeazụ.
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: ma chịkọtaa ọka wit ahụ n’ọba m
  rationale: ‘Ma’ na-egosi ọdịiche dị n’etiti ihe a ga-eme ahịhịa ọjọọ na ihe a ga-eme ọka wit; ‘ọba’ bụ ebe a na-echekwa ihe ubi.
theological_decisions:
- issue: Ihe oyiyi ilu banyere ikewapụ ihe abụọ n’ikpeazụ
  choice: E debere ihe oyiyi ọrụ ugbo ahụ dịka Jizọs kwuru ya.
  alternative: Ịkọwa ya ozugbo dịka mbibi ma ọ bụ ikpe ikpeazụ.
  rationale: Nkọwa ilu ahụ na-abịa n’amaokwu ndị sochirinụ; amaokwu a ekwesịghị itinye nkọwa ahụ n’ime okwu ilu n’onwe ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke nwere ugwu ma dị mfe nghọta. ‘Ọka wit’ na ‘ọba’ na-eme ka ihe oyiyi ọrụ ugbo doo anya. E tinyere akara [a] ozugbo n’akụkụ okwu ọ na-akọwa.
