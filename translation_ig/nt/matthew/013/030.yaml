review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the permissive command, the concurrent growth of both crops, the temporal distinction between the harvest and its appointed time, the sequence of collecting/binding/burning the weeds, and the contrastive gathering of wheat into the owner''s storehouse. A small grammatical revision is warranted: the Greek commands in the quoted speech are plural, addressed to the reapers.'
  naturalness: The wording is clear, modern Standard Igbo, and maintains the agricultural imagery naturally. Explicit plural imperative forms make the direct address to the reapers more idiomatic and precise.
  terminology: ‘Ahịhịa ọjọọ’ suitably renders the general sense of ζιζάνια, while the footnote retains darnel/tares as alternatives. ‘Ọka wit’ and ‘ọba m’ are appropriate and readily understood. The wording does not import the parable’s later interpretation.
  issues:
  - severity: low
    issue: Plural addressees are not overtly marked in the reapers’ commands.
    rationale: Συλλέξατε, δήσατε, and συναγάγετε are plural imperatives. Adding -nụ to the Igbo imperative forms clarifies that the landowner is addressing the reapers collectively, without changing the meaning.
  revised_text: Kwe ka ha abụọ too ọnụ ruo oge owuwe ihe ubi. Mgbe oge owuwe ihe ubi ruru, aga m agwa ndị na-ewe ihe ubi, ‘Buru ụzọ chịkọtanụ ahịhịa ọjọọ ahụ[a], keenụ ha n’ùkwù n’ùkwù ka unu kpọọ ha ọkụ; ma chịkọtanụ ọka wit ahụ n’ọba m.’
