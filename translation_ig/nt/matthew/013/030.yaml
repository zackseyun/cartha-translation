revisions:
- from: Kwe ka ha abụọ too ọnụ ruo oge owuwe ihe ubi. Mgbe oge owuwe ihe ubi ruru, aga m agwa ndị na-ewe ihe ubi, ‘Buru ụzọ chịkọta ahịhịa ọjọọ ahụ[a], kee ha n’ùkwù n’ùkwù ka a kpọọ ha ọkụ; ma chịkọtaa ọka wit ahụ n’ọba m.’
  to: Kwe ka ha abụọ too ọnụ ruo oge owuwe ihe ubi. Mgbe oge owuwe ihe ubi ruru, aga m agwa ndị na-ewe ihe ubi, ‘Buru ụzọ chịkọtanụ ahịhịa ọjọọ ahụ[a], keenụ ha n’ùkwù n’ùkwù ka unu kpọọ ha ọkụ; ma chịkọtanụ ọka wit ahụ n’ọba m.’
  rationale: The revision only marks the quoted imperatives as plural (chịkọtanụ, keenụ) and makes the purpose clause’s implied plural agents explicit (ka unu kpọọ ha ọkụ). This more closely reflects the Greek plural commands to the reapers while retaining the draft’s meaning, register, and lexical footnote.
