- from: 'N’ihi na n’ezie, ana m asị unu: Ọtụtụ ndị amụma na ndị ezi omume[a] chọsiri ike ịhụ ihe unu na-ahụ, ma ha ahụghị ya; ha chọkwara ịnụ ihe unu na-anụ, ma ha anụghị ya.'
  to: N’ihi na ana m asị unu n’ezie na ọtụtụ ndị amụma na ndị ezi omume[a] chọsiri ike ịhụ ihe unu na-ahụ, ma ha ahụghị ya; ha chọsikwara ike ịnụ ihe unu na-anụ, ma ha anụghị ya.
