id: MAT.13.17
reference: Matthew 13:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: ig
  text: N’ihi na ana m asị unu n’ezie na ọtụtụ ndị amụma na ndị ezi omume[a] chọsiri ike ịhụ ihe unu na-ahụ, ma ha ahụghị ya; ha chọsikwara ike ịnụ ihe unu na-anụ, ma ha anụghị ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, “ezi omume” bụ okwu nkọwa e ji dị ka aha na-ekwu maka ndị mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: n’ezie
  rationale: N’usoro okwu ἀμὴν λέγω ὑμῖν, “n’ezie” na-egosipụta nkwenye siri ike Jizọs ji amalite okwu ya, ma na-ada ka Igbo nkịtị na nke dị nsọ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Okwu a na-ejikọta amaokwu a na ihe e kwuru tupu ya dịka nkọwa ma ọ bụ ihe na-akwado ya.
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Nke a na-echekwa usoro okwu Grik ma bụrụkwa okwu Igbo doro anya ma dị ndụ.
- source_word: πολλοὶ προφῆται
  choice: Ọtụtụ ndị amụma
  rationale: Ntụgharị a na-enye kpọmkwem echiche ọnụọgụgụ na aha ndị amụma.
- source_word: δίκαιοι
  choice: ndị ezi omume
  rationale: Adjective Grik a na-arụ ọrụ dịka aha mmadụ n’ebe a; “ndị ezi omume” na-egosi ìgwè mmadụ ahụ n’Igbo doro anya.
- source_word: ἐπεθύμησαν
  choice: chọsiri ike
  rationale: Ngwaa ahụ na-egosi ọchịchọ miri emi; “chọsiri ike” na-ebupụta ike ọchịchọ ahụ n’enweghị ịgbakwunye echiche ọjọọ.
- source_word: ἰδεῖν ἃ βλέπετε
  choice: ịhụ ihe unu na-ahụ
  rationale: Nke a na-echekwa njikọ dị n’etiti infinitive na relative clause, tinyere present tense nke βλέπετε.
- source_word: οὐκ εἶδαν
  choice: ma ha ahụghị ya
  rationale: Nke a na-ekwu eziokwu mere n’oge gara aga ma jiri “ya” laghachi n’ihe ha chọrọ ịhụ.
- source_word: ἀκοῦσαι ἃ ἀκούετε
  choice: ịnụ ihe unu na-anụ
  rationale: Nke a na-echekwa nhazi yiri nke akụkụ gbasara ịhụ ihe, ma na-ada ka Igbo nkịtị.
- source_word: οὐκ ἤκουσαν
  choice: ma ha anụghị ya
  rationale: Nke a na-echekwa negation na akụkọ gara aga, ma jikọta “ya” na ihe a na-anụ.
theological_decisions:
- issue: Oke echiche δίκαιοι
  choice: A sụgharịrị ya “ndị ezi omume” dịka ìgwè sara mbara e tinyere n’akụkụ ndị amụma.
  alternative: “ndị ahụ bụ ezi omume”
  rationale: Grik ji adjective plural mee aha mmadụ. Ntụgharị ahụ anaghị agwakọta ndị ezi omume na ndị amụma naanị, ma ọ bụ kọwaa n’ụzọ pụrụ iche ihe mere e ji kpọọ ha ndị ezi omume.
- issue: Ihe a hụrụ na ihe a nụrụ
  choice: E debere ha dịka “ihe unu na-ahụ” na “ihe unu na-anụ.”
  alternative: Ịkọwapụta ha dịka Jizọs, Mesaịa ahụ, ma ọ bụ ihe nzuzo nke alaeze eluigwe
  rationale: Ọnọdụ amaokwu ahụ na-enye nghọta banyere ozi Jizọs na alaeze, ma amaokwu ahụ n’onwe ya anaghị akpọ ihe ndị ahụ aha kpọmkwem. Ntụgharị ahụ na-echekwa nghọta a na-emegheghị emeghe.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta. A nọgidere na nhazi yiri ibe ya nke “ịhụ… ma ha ahụghị” na “ịnụ… ma ha anụghị,” ebe e mere obere mmegharị okwu iji mee ka ọ na-aga nke ọma n’Igbo.
