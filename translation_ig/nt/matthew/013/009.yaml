  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/009.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: ig
  text: Onye nwere ntị, ka ọ nụrụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Onye nwere
  rationale: Nkebiokwu a, nke nwere isiokwu na participle, na-arụ ọrụ dị ka aha ma na-ezo aka n’ozuzu nye onye ọ bụla nwere àgwà ahụ. “Onye nwere” bụ Igbo ebumpụta ụwa nke na-edobe otu onye na ihe ọ pụtara n’ozuzu.
- source_word: ὦτα
  choice: ntị
  rationale: Ọ bụ ezie na okwu Grik a dị n’ụdị ọtụtụ, “ntị” bụ aha akụkụ ahụ nke ọnụ ọgụgụ ya anaghị apụta ìhè n’ụdị okwu n’Igbo; n’ebe a ọ na-egosi ntị mmadụ ji anụ ihe, ma na-adabara akpaalaokwu ahụ.
- source_word: ἀκουέτω
  choice: ya nụrụ
  rationale: Nke a na-egosipụta iwu ma ọ bụ ịgba ume nke onye nke atọ n’ụzọ Igbo dị nkenke. “Nụrụ” na-edobe njikọ kpọmkwem na ịnụ ihe, ma n’okwu a ọ na-akpọkwa mmadụ ka ọ gee ntị ma nabata ihe a na-ekwu.
theological_decisions:
- issue: Okwu na-ezo aka n’otu onye ma na-emetụta mmadụ niile
  choice: Onye nwere ntị, ya nụrụ.
  alternative: Onye ọ bụla nwere ntị, ya nụrụ.
  rationale: Grik ji otu onye mee ihe n’ụzọ na-emetụta onye ọ bụla. “Onye nwere” na-edobe nhazi ahụ n’enweghị itinye nkọwa nwoke ma ọ bụ nwaanyị, ebe “onye ọ bụla” ga-eme ka echiche nke onye ọ bụla pụta ìhè karịa ka e dere ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị nkenke ma dị ùgwù. E ji “ya nụrụ” gosipụta iwu nke onye nke atọ n’ụzọ a na-aghọta ngwa ngwa; ahapụghị akara nkọwa ụkwụ n’ihi na nsogbu gbasara generic masculine n’asụsụ Bekee anaghị ebute otu nsogbu ahụ n’Igbo.
