  verdict: revise
  source_fidelity: The substantival generic subject is conveyed accurately by “Onye nwere.” The Greek has plural “ears”; Igbo may idiomatically use the unmarked body-part noun “ntị” in this saying, so plural marking need not be forced. The third-person present imperative is better represented explicitly with “ka ọ nụrụ” than by the less clearly imperative “ya nụrụ.”
  naturalness: “Onye nwere ntị, ka ọ nụrụ” is concise, idiomatic Standard Igbo with the elevated proverbial/register appropriate to Jesus’ saying.
  terminology: “Onye,” “ntị,” and “nụrụ” are suitable and retain the hearing motif. No gender-related English footnote is needed in Igbo, since “onye” is inherently non-gendered.
  issues:
  - severity: medium
    issue: Imperative force is not explicit in “ya nụrụ.”
    rationale: ἀκουέτω is a third-person present imperative (“let him/her hear”). In Standard Igbo, “ka ọ nụrụ” clearly expresses this exhortation, whereas “ya nụrụ” can be read less distinctly as an assertion or compressed traditional phrasing.
  revised_text: Onye nwere ntị, ka ọ nụrụ.
