id: MAT.13.12
reference: Matthew 13:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: ig
  text: N’ihi na onye ọ bụla nwere, a ga-enyekwu ya, ọ ga-enwekwa ụba; ma onye na-enweghị, ọbụna ihe o nwere ka a ga-anapụ ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις
  choice: onye ọ bụla
  rationale: Nnọchiaha njikọ na-akọwaghị otu onye kpọmkwem, nke na-egosi ụkpụrụ metụtara onye ọ bụla.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-egosi na okwu a bụ nkọwa ma ọ bụ ihe kpatara okwu bu ya ụzọ.
- source_word: ἔχει
  choice: nwere
  rationale: Na-edobe ihe onye ahụ nwere n’ekwughị ya kpọmkwem, dịka Grik si mee.
- source_word: δοθήσεται αὐτῷ
  choice: a ga-enyekwu ya
  rationale: Ụdị nnara nke ọdịnihu pụtara na a ga-enye ya ihe; ‘-kwu’ na-eme ka mmụba nke ọnọdụ a doo anya n’Igbo.
- source_word: περισσευθήσεται
  choice: o wee nwee n’ụba
  rationale: Na-egosi ihe si n’inyekwu ya pụta—ịba ụba—n’asụsụ Igbo dị mfe ma dị ugwu.
- source_word: δὲ
  choice: ma
  rationale: Na-egosi ọdịiche siri ike n’etiti akụkụ abụọ ahụ.
- source_word: οὐκ ἔχει
  choice: na-enweghị
  rationale: Ụzọ Igbo nkịtị si ekwu enweghị ihe, ebe a hapụrụ ihe ahụ n’ekwughị ya.
- source_word: καὶ ὃ ἔχει
  choice: ọbụna ihe o nwere
  rationale: ‘Ọbụna’ na-egosipụta ike mgbakwunye nke καί na ihe ijuanya dị n’okwu ahụ.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: a ga-anapụ ya
  rationale: Na-enye echiche nke iwepụ ma ọ bụ ịnara ihe n’aka onye ahụ n'ụzọ doro anya.
theological_decisions:
- issue: Ihe ‘nwere’ na ihe ‘a ga-enye’ na-ezo aka na ya
  choice: A hapụrụ ihe ahụ n’ekwughị ya kpọmkwem.
  alternative: Ịkọwa ya dị ka nghọta, nnabata okwu, ma ọ bụ ihe ọmụma banyere alaeze eluigwe.
  rationale: Ọnọdụ okwu ahụ na-emetụta nnabata ozizi Jizọs na ihe omimi nke alaeze, ma Grik akpọghị ihe ahụ aha; nsụgharị ahụ na-echekwa obosara na mgbagwoju anya a.
- issue: Nnọchiaha nwoke otu onye nke e ji anọchi anya mmadụ n’ozuzu
  choice: E ji ‘onye ọ bụla ... ya ... o’ mee ka ọ bụrụ otu onye nnọchiteanya, dịka usoro Igbo si dị.
  alternative: Iji ọtụtụ mmadụ ma ọ bụ ikwughachi ‘onye ahụ.’
  rationale: Igbo anaghị egosi okike n’ụdị nnọchiaha ndị a; otu onye ka na-echekwa usoro na ike nkọwa nke Grik n’enweghị itinye okike nke asụsụ Igbo anaghị ama.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. E chekwara ụdị ilu ahụ na ihe a na-ekwu na mmadụ ‘nwere’ n’ekwughị ya kpọmkwem.
