revisions:
- from: N’ihi na onye ọ bụla nwere, a ga-enyekwu ya, o wee nwee n’ụba; ma onye na-enweghị, a ga-anapụ ya ọbụna ihe o nwere.
  to: N’ihi na onye ọ bụla nwere, a ga-enyekwu ya, ọ ga-enwekwa ụba; ma onye na-enweghị, ọbụna ihe o nwere ka a ga-anapụ ya.
  rationale: The revision retains the source’s deliberately implicit object and its generic singular formulation, while rendering both outcomes as clear future statements in idiomatic modern Standard Igbo. It also makes the emphatic ‘even what he has’ explicitly the item taken, without adding an interpretive object such as knowledge or understanding.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:36:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the general, unstated object of ‘has,’ the contrast, the ascensive force of καί (‘ọbụna’), and the future passive sense of giving/taking. However, ‘o wee nwee n’ụba’ uses a consequential/sequential construction that is less direct than the Greek coordinated future (‘and will abound’).
  naturalness: The wording is generally clear Standard Igbo. Recasting the second future as ‘ọ ga-enwekwa ụba’ gives a more natural, parallel future statement. Moving ‘ọbụna ihe o nwere’ before ‘ka a ga-anapụ ya’ makes its syntactic relation to the taking clearer.
  terminology: ‘N’ihi na,’ ‘onye ọ bụla,’ ‘a ga-enyekwu ya,’ and ‘a ga-anapụ ya’ are appropriate and retain the proverb-like register. No gender-related note is needed in Igbo, since the pronouns used do not mark masculine gender.
  issues:
  - severity: low
    issue: The expression ‘o wee nwee n’ụba’ does not most directly represent the second future assertion.
    rationale: 'Greek περισσευθήσεται is coordinated with δοθήσεται as a future result: ‘and he will abound/have abundance.’ ‘Ọ ga-enwekwa ụba’ is clearer and preserves that parallel future force.'
  - severity: low
    issue: The placement of ‘ọbụna ihe o nwere’ after ‘a ga-anapụ ya’ is potentially less immediately transparent.
    rationale: Fronting it as the object of the passive taking, with ka, clearly conveys ‘even what he has will be taken from him.’
  revised_text: N’ihi na onye ọ bụla nwere, a ga-enyekwu ya, ọ ga-enwekwa ụba; ma onye na-enweghị, ọbụna ihe o nwere ka a ga-anapụ ya.
  revised_footnotes: []
  revision_rationale: The revision retains the source’s deliberately implicit object and its generic singular formulation, while rendering both outcomes as clear future statements in idiomatic modern Standard Igbo. It also makes the emphatic ‘even what he has’ explicitly the item taken, without adding an interpretive object such as knowledge or understanding.
