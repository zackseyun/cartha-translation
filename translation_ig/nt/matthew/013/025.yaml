id: MAT.13.25
reference: Matthew 13:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: ig
  text: Ma mgbe ndị mmadụ na-ehi ụra, onye iro ya bịara kụọ ata n’etiti ọka wit ahụ, wee laa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: ndị ikom ahụ
  rationale: N’ọnọdụ ilu a, okwu a na-ezo aka n’ụmụ nwoke/ndị ọrụ ubi ahụ; nsụgharị a na-edobe nkọwa nwoke dị na ihe akaebe na English POB.
- source_word: ἐπέσπειρεν
  choice: kụọ
  rationale: Ọ bụ okwu metụtara ịgha mkpụrụ; n’Igbo, ‘ịkụ mkpụrụ/ịkụ ihe’ bụ ụzọ sitere n’okike e si ekwu ya, ebe ihe a na-akụ doro anya n’ahịrịokwu ahụ.
- source_word: ζιζάνια
  choice: ata
  rationale: Ọ na-ezo aka n’ahịhịa ọjọọ yiri ọka n’oge mbụ ọ na-eto; ‘ata’ bụ okwu Igbo nkịtị maka ahịhịa na-adịghị mma n’ubi, n’enweghị ịkpọ ụdị osisi a aha kpọmkwem.
- source_word: σῖτος
  choice: ọka wit
  rationale: A họọrọ ‘ọka wit’ iji kọwaa ụdị ọka ahụ nke ọma nye ndị na-agụ Igbo taa.
- source_word: ἀπῆλθεν
  choice: wee laa
  rationale: 'Na-enye usoro omume ahụ n’Igbo dị larịị: ọ bịara, kụọ, wee pụọ.'
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro na esemokwu dị n’ilu ahụ n’enweghị ịgbakwunye nkọwa banyere onye iro, ata, ma ọ bụ ndị na-ehi ụra.
