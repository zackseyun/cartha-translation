  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί, ὥστε αὐτὸν ⸀εἰς πλοῖον ἐμβάντα καθῆσθαι, καὶ πᾶς ὁ ὄχλος ἐπὶ τὸν αἰγιαλὸν εἱστήκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: ig
  text: Ọtụtụ ìgwè mmadụ zukọrọ bịakwute ya, nke mere na ọ banyere n'ụgbọ mmiri[a] wee nọdụ ala; ìgwè mmadụ ahụ niile guzoro n'ikpere mmiri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ rigoro n'ụgbọ mmiri.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n'ụsọ mmiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτόν
  choice: gbakọtara bịakwute ya
  rationale: “Gbakọtara” na-egosi na ndị mmadụ zukọtara, “bịakwute ya” echekwakwa ntụgharị πρός nke na-egosi ịgakwuru mmadụ.
- source_word: ὄχλοι πολλοί
  choice: ọtụtụ ìgwè mmadụ
  rationale: Nke a na-echekwa ọtụtụ nke ὄχλοι na ọtụtụ/n'ọnụọgụ buru ibu nke πολλοί, ma ka bụrụ Igbo a na-aghọta nke ọma.
- source_word: ὥστε
  choice: nke mere na
  rationale: Nkebiokwu a na-egosi ihe si n'ọnọdụ ahụ pụta, dịka ὥστε si eme n'ahịrịokwu Grik.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: ọ banyere n'ụgbọ mmiri
  rationale: “Banyere n'ụgbọ mmiri” bụ ụzọ Igbo kwụ ọtọ ma dị ndụ isi kwuo na ọ banyere ma ọ bụ rigoro n'ụgbọ ahụ.
- source_word: καθῆσθαι
  choice: nọdụ ala
  rationale: Nke a na-enye omume ịnọdụ ala n'ụzọ doro anya ma dị mfe n'Igbo.
- source_word: πᾶς ὁ ὄχλος
  choice: ìgwè mmadụ ahụ niile
  rationale: Nke a na-echekwa mgbanwe Grik site n'ọtụtụ ìgwè gaa n'ịkpọ ha otu ìgwè n'ozuzu.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: n'ikpere mmiri
  rationale: “N'ikpere mmiri” bụ okwu Igbo zuru ezu maka ebe ala na mmiri na-ezute, n'ebughị ụzọ kpebie ma ọ bụ osimiri ukwu, ọdọ, ma ọ bụ mmiri ọzọ.
- source_word: εἱστήκει
  choice: guzoro
  rationale: Oge gara aga dị mfe na Igbo na-akọwa ọnọdụ ìgwè mmadụ ahụ n'ụzọ ebumpụta ụwa, ebe ihe ndị gbara ya gburugburu na-egosi na ha nọgidere guzo.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta mee ntụgharị a. E chekwara ọtụtụ nke “ìgwè mmadụ” na mmalite na otu mkpokọta ya n'ikpeazụ; njikọ “nke mere na” na-egosikwa nsonaazụ nke ọnụ ọgụgụ ndị ahụ.
