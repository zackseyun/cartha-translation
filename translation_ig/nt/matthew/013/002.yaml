- from: Ọtụtụ ìgwè mmadụ gbakọtara bịakwute ya, nke mere na ọ banyere n'ụgbọ mmiri[a] nọdụ ala, ìgwè mmadụ ahụ niile wee guzoro n'ikpere mmiri[b].
  to: Ọtụtụ ìgwè mmadụ zukọrọ bịakwute ya, nke mere na ọ banyere n'ụgbọ mmiri[a] wee nọdụ ala; ìgwè mmadụ ahụ niile guzoro n'ikpere mmiri[b].
  rationale: The revision improves Standard Igbo idiom and makes the action sequence explicit without altering the source meaning, its collective shift from crowds to crowd, or the lexical ambiguity of the shore term.
