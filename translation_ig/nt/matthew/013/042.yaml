id: MAT.13.42
reference: Matthew 13:42
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ig
  text: Ha ga-atụbakwa ha n'ime ekwú ọkụ ahụ.[a] N'ebe ahụ ka ịkwa ákwá na ịta ikikere ezé ga-adị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N''ụzọ nkịtị: “ekwú nke ọkụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσιν
  choice: ha ga-atụbakwa
  rationale: Ụdị ngwaa ọdịnihu a pụtara ịtụba ma ọ bụ ịtụnye n'ike; “tụba” bụ okwu Igbo doro anya ma na-edobe ike omume ahụ. “-kwa” na-ejigide καὶ nke jikọtara amaokwu a na nke bu ya ụzọ.
- source_word: αὐτοὺς
  choice: ha
  rationale: Nnọchiaha ọtụtụ a na-ezo aka n'ìgwè ahụ a kpọtụrụ aha na mbụ; ọ dịghị mkpa ikwughachi aha ha.
- source_word: κάμινον τοῦ πυρός
  choice: ekwú ọkụ ahụ
  rationale: “Ekwú ọkụ” na-enye onyinyo ebe ọkụ siri ike na-ere n'ụzọ dị mfe nghọta n'Igbo, ma ọ naghị atụgharị ya gaa n'okwu nkà mmụta okpukpe dịka ọkụ ala mmụọ.
- source_word: ἐκεῖ
  choice: N'ebe ahụ
  rationale: Nke a na-edobe kpọmkwem ọnọdụ ebe okwu Grik ahụ na-arụtụ aka—ekwú ọkụ ahụ a ka kpọtụrụ aha.
- source_word: κλαυθμός
  choice: ịkwa ákwá
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke dị ùgwù si akọ akwa na nhụjuanya, n'enweghị ime ka ike okwu ahụ karịa ka isi mmalite kwuru.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: ịta ikikere ezé
  rationale: Nke a bụ akpaalaokwu Igbo doro anya maka ịta ezé n'ike; ọ na-edobe onyinyo ahụ n'enweghị ikpebi ma ihe kpatara ya bụ naanị mwute, iwe, ma ọ bụ ihe abụọ ahụ.
theological_decisions:
- issue: Onyinyo ikpe dị na κάμινον τοῦ πυρός
  choice: Ekwú ọkụ ahụ
  alternative: Ọkụ ala mmụọ
  rationale: A hapụrụ onyinyo ekwú ọkụ ahụ ka ọ dị, n'etinyeghị aha ozizi nke isi okwu Grik ekwughị kpọmkwem.
- issue: Ihe ịkwa ákwá na ịta ikikere ezé pụtara
  choice: E debere akpaalaokwu abụọ ahụ n'ụzọ nkịtị
  alternative: Ịkọwa ya dị ka naanị mwute ma ọ bụ naanị iwe
  rationale: Okwu ahụ nwere ike igosi oke ahụhụ nke gụnyere mwute, iwe, ma ọ bụ ha abụọ; ntụgharị ahụ anaghị emechi nghọta ahụ n'otu akụkụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. Ahịrịokwu nke abụọ ji “N'ebe ahụ ka...” mee ka ebe ahụ pụta ìhè dịka ἐκεῖ si eme, ma na-ada nke ọma n'Igbo.
