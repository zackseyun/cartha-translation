id: MAT.13.32
reference: Matthew 13:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: ig
  text: N’ezie, ọ dị nta karịa mkpụrụ niile; ma mgbe o toro, ọ dị ukwuu karịa ihe ọkụkụ ndị dị n’ubi, ọ ghọkwa osisi, nke mere na nnụnụ nke mbara igwe[a] na-abịa kwuo akwụ n’alaka ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nnụnụ nke ikuku,” nke bụ ụzọ ọdịnala e si asụgharị τὰ πετεινὰ τοῦ οὐρανοῦ.
    reason: lexical_alternative
  - marker: b
    text: Ihe oyiyi nnụnụ na-akwụ akwụ n’alaka osisi nwere ike ikwughachi ihe oyiyi Agba Ochie banyere osisi ukwu na alaeze (dịka ọmụmaatụ, Ezikiel 17:23; Daniel 4:12), ma amaokwu a ekwughị kpọmkwem ihe oyiyi ahụ pụtara.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον
  choice: dị ... nta karịa
  rationale: Nke a na-edobe ụdị ntụnyere dị n’asụsụ Grik (‘nta karịa’) kama ime ya ozugbo ka ọ bụrụ okwu kachasị elu (‘nke kacha nta’).
- source_word: πάντων τῶν σπερμάτων
  choice: karịa mkpụrụ niile
  rationale: A sụgharịrị genitive nke na-eso okwu ntụnyere dịka ntụnyere doro anya, ma hapụ ‘mkpụrụ’ ka ọ bụrụ okwu sara mbara.
- source_word: μέν ... δέ
  choice: n’ezie ... ma
  rationale: Okwu abụọ a na-egosi ọdịiche dị n’etiti obere mmalite mkpụrụ ahụ na nnukwu ihe ọ na-aghọ.
- source_word: ὅταν ... αὐξηθῇ
  choice: mgbe o toro
  rationale: Nke a na-egosi uto ahụ dịka ihe mezuru tupu e kwuo ihe na-esote, ma bụrụkwa Igbo dị mfe ma kwekọọ n’ọnọdụ ahụ.
- source_word: μεῖζον
  choice: na-adị ukwuu karịa
  rationale: Ọ na-edobe ntụnyere ya na ‘dị nta karịa’ ma daa nke ọma n’Igbo mgbe a na-atụnyere osisi.
- source_word: τῶν λαχάνων
  choice: ihe ọkụkụ ndị dị n’ubi
  rationale: λάχανα na-ezo aka n’ihe ndị a na-akụ n’ubi; okwu a sara mbara karịa ‘akwụkwọ nri’ ma ọ bụ ‘ahịhịa ọgwụ.’
- source_word: γίνεται δένδρον
  choice: ghọọkwa osisi
  rationale: A hapụrụ ihe oyiyi doro anya nke Grik—na ọ na-aghọ osisi—n’enweghị ime ka ọ bụrụ naanị ‘ihe yiri osisi.’
- source_word: ὥστε ἐλθεῖν
  choice: nke mere na ... na-abịa
  rationale: Nke a na-egosipụta nsonaazụ uto ahụ n’ụzọ dị mma n’Igbo.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: nnụnụ nke mbara igwe
  rationale: ‘Mbara igwe’ na-enye echiche οὐρανός nke ebe nnụnụ na-efe, ma zere ịghọta ya dịka ebe ime mmụọ.
- source_word: κατασκηνοῦν
  choice: akwụ akwụ́
  rationale: N’ọnọdụ nnụnụ na alaka osisi, okwu a na-egosi ibi ma ọ bụ ime akwụ n’ebe ahụ; ‘akwụ akwụ́’ dị nkenke ma doo anya.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: n’alaka ya
  rationale: Nke a bụ ntụgharị ebe okwu ahụ na-ekwu kpọmkwem, ‘ya’ na-ezo aka n’osisi ahụ.
theological_decisions:
- issue: Ihe oyiyi nnụnụ na-ebi n’alaka nnukwu osisi nwere ike ịdị ka ihe oyiyi alaeze dị n’Agba Ochie.
  choice: E debere ihe oyiyi ahụ kpọmkwem n’ahịrịokwu ahụ n’enweghị ịkọwa ihe nnụnụ ahụ nọchiri anya ya.
  alternative: Ịkọwa nnụnụ ahụ dịka mba ma ọ bụ ndị mmadụ na-achọta ebe mgbaba n’alaeze Chineke.
  rationale: O nwere ike ịdị ka ihe e dere na Ezikiel 17:23 na Daniel 4:12, ma amaokwu Grik ahụ akọwaghị akara ahụ n’onwe ya; ya mere ntụgharị ahụ na-ahapụ ohere nghọta ahụ n’emebighị mgbagwoju anya ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘ihe ọkụkụ ndị dị n’ubi’ iji zere okwu dị warara, ma ‘mbara igwe’ kewapụ echiche ebe nnụnụ na-efe na echiche nke eluigwe ime mmụọ. E debere ụdị ntụnyere nke Grik na ọdịiche μέν ... δέ n’ụzọ na-ada nke ọma n’Igbo.
