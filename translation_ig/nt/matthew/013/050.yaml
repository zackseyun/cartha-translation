  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: ig
  text: Ha ga-atụba ha n’ime ọkụ e ji agbaze ihe. N’ebe ahụ ka ịkwa ákwá na ịta ikikere eze ga-adị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαλοῦσιν
  choice: ha ga-atụbakwa
  rationale: Ụdị ọdịnihu nke βάλλω na-egosi ịtụba n’ike; “ga-atụba” bụ Igbo dị ugbu a, ebe “-kwa” na-egosipụta njikọ καί na ihe bu ụzọ.
- source_word: αὐτοὺς
  choice: ha
  rationale: Nnochiaha a bụ ihe omume ahụ metụtara, na-arụtụ aka n ndị ajọ omume e kwuru banyere ha n’amaokwu bu ụzọ.
- source_word: κάμινον τοῦ πυρός
  choice: ọkụ e ji agbaze ihe
  rationale: κάμινος bụ nnukwu ọkụ ma ọ bụ ebe a na-amụnye ọkụ dị ukwuu maka ịgbaze ma ọ bụ ịkpọ ihe ọkụ. Nkebi a na-ejigide oyiyi ọkụ ahụ n’Igbo nghọta, ebe nkọwa ala peeji na-egosi usoro okwu Grik kpọmkwem.
- source_word: ἐκεῖ
  choice: N’ebe ahụ
  rationale: Nke a na-edobe ike okwu ahụ nke na-arụtụ aka n’otu ebe kpọmkwem.
- source_word: ἔσται
  choice: ga-adị
  rationale: Ọ bụ ụzọ Igbo si ekwu ịdị adị n’ọdịnihu n’ụzọ eke.
- source_word: ὁ κλαυθμὸς
  choice: ịkwa ákwá
  rationale: Nke a na-egosi akwa nke iru uju n’enweghị ịgbatị ihe okwu Grik kwuru.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: ịta iké eze
  rationale: Nke a bụ akpaala okwu Igbo a na-aghọta nke ọma maka ịchịkọta eze n’ọnọdụ ihe mgbu, iwe, ma ọ bụ ahụhụ, ma ọ naghị akọwapụta nke ọ bụ naanị ya.
theological_decisions:
- issue: Oyiyi ikpe n’oge ikpeazụ
  choice: E debere oyiyi ọkụ, ịkwa ákwá, na ịta iké eze n’enweghị ime ka ọ dị nro ma ọ bụ ịgbakwunye nkọwa.
  alternative: Ịsụgharị ya n’ụzọ nkọwa dịka “ebe ha ga-ata ahụhụ nke ukwuu.”
  rationale: Ihe odide ahụ ji oyiyi siri ike kọwaa ikpe. Nsụgharị kwesịrị idobe ike na mgbagwoju anya ya, ọ bụghị ikpebi kpọmkwem ụdị ahụhụ ma ọ bụ mmetụta ịta iké eze na-anọchi anya ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. E jiri akara ụda naanị n’ebe ọ na-enyere aka izere mgbagwoju anya, dịka “ákwá” na “iké.”
