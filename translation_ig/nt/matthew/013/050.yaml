    text: 'N’asụsụ Grik, kpọmkwem: “ọkụ e ji agbaze ihe nke ọkụ.” A pụkwara ịsụgharị ya: “n’ime nnukwu ọkụ.”'
    reason: lexical_alternative
  revision_rationale: The correction removes an unnecessary additive nuance, clarifies that the persons are thrown into the furnace, and uses the established Standard Igbo idiom “ịta ikikere eze.” The judgment imagery and its theological openness are retained without softening or interpretation. The note is retained as a lexical alternative, but its wording is made natural and source-focused.
