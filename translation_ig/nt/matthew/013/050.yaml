- from: ha ga-atụbakwa ha n’ọkụ e ji agbaze ihe[a]. N’ebe ahụ, ịkwa ákwá na ịta iké eze ga-adị.
  to: Ha ga-atụba ha n’ime ọkụ e ji agbaze ihe. N’ebe ahụ ka ịkwa ákwá na ịta ikikere eze ga-adị.
  rationale: The correction removes an unnecessary additive nuance, clarifies that the persons are thrown into the furnace, and uses the established Standard Igbo idiom “ịta ikikere eze.” The judgment imagery and its theological openness are retained without softening or interpretation. The note is retained as a lexical alternative, but its wording is made natural and source-focused.
