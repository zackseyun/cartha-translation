id: MAT.13.15
reference: Matthew 13:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: ig
  text: N’ihi na obi ndị mmadụ a adịla nkụ n’ịghọta ihe[a]; ha ji ntị ha nụrụ ihe n’ụzọ siri ike, ha emechikwala anya ha, ka ha ghara iji anya ha hụ, jiri ntị ha nụ, jiri obi ha ghọta, laghachi[b], m ga-agwọ ha.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “obi ndị mmadụ a abaala ụba” ma ọ bụ “adịla oké”; ihe ọ pụtara n’ebe a bụ na obi ha aghọọla nke na-adịghị aghọta ma ọ bụ anabata ihe nke ọma.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “tụgharịa” ma ọ bụ “lọghachi.”
    reason: lexical_alternative
  - marker: c
    text: E hotara okwu ndị a n’Aịzaya 6:9–10.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: adịla nkụ n’ịghọta ihe
  rationale: N’ụzọ nkịtị okwu ahụ pụtara ‘ịba ụba/ịdị oké,’ ma mgbe e ji ya kọwaa obi, ọ na-egosi obi nke na-adịghịzi aghọta ma ọ bụ anabata ihe nke ọma. Nsụgharị a na-eme ka akpaalaokwu ahụ doo onye Igbo nke oge a anya n’enweghị itinye ozizi ọzọ n’ime ya.
- source_word: καρδία
  choice: obi
  rationale: ‘Obi’ bụ okwu Igbo kwekọrọ na echiche banyere ime mmadụ, nghọta ya, na uche ya; amaokwu a jikọkwara obi na ịghọta.
- source_word: λαοῦ τούτου
  choice: ndị a
  rationale: N’ahịrịokwu ‘obi ndị a,’ okwu a na-echekwa nrụtụ aka dị na ‘this people’ n’ụzọ Igbo dị mfe ma dị ndụ.
- source_word: βαρέως ἤκουσαν
  choice: ha ji ntị ha anụ ihe n’ụzọ siri ike
  rationale: Nke a na-echekwa oyiyi nke ‘ịnụ n’ụzọ dị arọ’ ma na-egosi na ịnụ ihe na-esiri ha ike, kama ịgbanwe ya kpamkpam ka ọ bụrụ enweghị mmasị.
- source_word: ἐκάμμυσαν
  choice: ha emechikwala anya ha
  rationale: Ọ na-echekwa omume ha ji aka ha mechie anya, ya na nsonaazụ omume ahụ ka dị ugbu a.
- source_word: μήποτε
  choice: ka ha ghara
  rationale: Ọ na-echekwa ike nkebiokwu nzube/nsonaazụ na-adịghị mma, na-ahapụghị esemokwu dị n’etiti ikpe Chineke na ibu ọrụ mmadụ.
- source_word: ἴδωσιν … ἀκούσωσιν … συνῶσιν
  choice: hụ ụzọ … nụ ihe … ghọta
  rationale: 'Okwu ndị a na-echekwa usoro omume atọ ahụ n’asụsụ Igbo doro anya: ịhụ, ịnụ, na ịghọta.'
- source_word: ἐπιστρέψωσιν
  choice: laghachi
  rationale: ‘Laghachi’ na-echekwa echiche ịtụgharị azụ ma ọ bụ ịlọghachi, n’etinyeghị okwu ụka pụrụ iche dịka ‘ịgbanwe okwukwe.’
- source_word: ἰάσομαι
  choice: m wee gwọọ ha
  rationale: Nke a na-egosi ọgwụgwọ Chineke nke ga-esochi nlọghachi ha, ma na-asụ ya n’ụzọ Igbo na-aga were were.
theological_decisions:
- issue: Otu e si akọwa nkebiokwu μήποτε n’etiti ikpe Chineke na ibu ọrụ mmadụ
  choice: ka ha ghara … laghachi, m wee gwọọ ha
  alternative: ma ọ bụghị ya, ha gaara … laghachi, m ga-agwọkwa ha
  rationale: Nhọrọ a na-echekwa ụdị okwu Grik ahụ na esemokwu nkà mmụta okpukpe dị na ya. Ọ naghị eme ka o doo anya karịa isi mmalite ma nke a bụ nzube, nsonaazụ, ma ọ bụ nkọwa ikpe; ọ na-echekwakwa na ndị ahụ n’onwe ha mechiri anya ha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. E debere usoro ịhụ—ịnụ—ịghọta—ịlaghachi—ịgwọ, nakwa omume ndị mmadụ ji aka ha mechie anya. E zere okwu ụka pụrụ iche na nkọwa ga-edozi esemokwu dị n’amaokwu ahụ.
