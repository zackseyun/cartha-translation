revisions:
- from: N’ihi na obi ndị a adịla nkụ n’ịghọta ihe[a]; ha ji ntị ha anụ ihe n’ụzọ siri ike, ha emechikwala anya ha, ka ha ghara iji anya ha hụ ụzọ, jiri ntị ha nụ ihe, jiri obi ha ghọta, laghachi[b], m wee gwọọ ha.[c]
  to: N’ihi na obi ndị mmadụ a adịla nkụ n’ịghọta ihe[a]; ha ji ntị ha nụrụ ihe n’ụzọ siri ike, ha emechikwala anya ha, ka ha ghara iji anya ha hụ, jiri ntị ha nụ, jiri obi ha ghọta, laghachi[b], m ga-agwọ ha.[c]
  rationale: Removed the unsupported object “ụzọ,” clarified that the heart belongs to “this people,” and rendered the final future explicitly. The revision preserves the source order, the people’s agency in closing their eyes, and the unresolved judicial-purpose tension of μήποτε.
