source:
  edition: SBLGNT
  text: ⸂εὑρὼν δὲ⸃ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: ig
  text: Mgbe ọ chọtara otu pel bara oké uru[a], ọ gara ree ihe niile o nwere, zụta ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu pel dị oké ọnụ ahịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: Mgbe ọ chọtakwara
  rationale: A tụgharịrị participle a dị ka nkebi oge iji gosi na ịchọta pel ahụ buru ụzọ mee tupu ire na ịzụ; “-kwara” na-ejigide njikọ dị nro nke δέ n’usoro akụkọ ahụ.
- source_word: ἕνα
  choice: otu
  rationale: Ọnụọgụ ahụ pụtara ìhè n’asụsụ Grik, ọ na-emekwa ka a mata na ọ bụ naanị otu pel ahụ pụrụ iche.
- source_word: πολύτιμον
  choice: bara oké uru
  rationale: Nke a bụ okwu Igbo doro anya ma dị ugbu a nke na-egosi uru pụrụ iche nke pel ahụ.
- source_word: μαργαρίτην
  choice: pel
  rationale: “Pel” bụ aha a na-ejikarị eme ihe n’Igbo maka nkume ọma a.
- source_word: ἀπελθὼν
  choice: ọ gara
  rationale: E ji ngwaa zuru ezu mee participle ahụ ka usoro omume ahụ bụrụ nke sitere n’ọnụ onye Igbo n'ụzọ eke.
- source_word: πέπρακεν
  choice: ree
  rationale: Ọ bụ ezie na ụdị ngwaa Grik bụ perfect, n’usoro akụkọ a, “ree” na-egosi omume e mechara nke ọma n’Igbo.
- source_word: πάντα ὅσα εἶχεν
  choice: ihe niile o nwere
  rationale: Nke a na-echekwa echiche nke ihe onwunwe ya niile n’asụsụ Igbo doro anya.
- source_word: ἠγόρασεν
  choice: zụta
  rationale: “Zụta” bụ okwu Igbo nkịtị na nke ziri ezi maka ịkwụ ụgwọ nweta ihe.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na pel ahụ; “ya” bụ ụzọ Igbo kwesịrị ekwesị isi zoro aka na ya.
theological_decisions: []
translation_notes:
  register: 'Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro omume ahụ n''ụzọ eke: ịchọta, ịga ree ihe niile, wee zụta pel ahụ.'
