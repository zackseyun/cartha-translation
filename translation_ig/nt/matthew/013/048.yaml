source:
  edition: SBLGNT
  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: ig
  text: Mgbe ụgbụ ahụ jupụtara, ha dọkpụrụ ya kpọpụta n'ikpere mmiri, ha nọdụ ala, chịkọta azụ ndị dị mma n'ime arịa[a], ma tụpụ azụ ndị rere ure n'èzí.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ime ihe e ji etinye ihe.” Okwu Grik ahụ bụ okwu izugbe maka arịa; ọ pụtaghị kpọmkwem nkata.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị na-adịghị mma.” Okwu Grik ahụ nwere ike ịpụta ndị rere ure, ndị mebiri emebi, ma ọ bụ, n'ụzọ sara mbara, ndị na-abaghị uru.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: ya
  rationale: Ọ na-ezo aka n'ụgbụ a kpọrọ aha n'amaokwu bu ụzọ; nnọchiaha a bụ ụzọ Igbo si ekwu ya n'ụzọ ebumpụta ụwa.
- source_word: ἐπληρώθη
  choice: o juputara
  rationale: Na-egosipụta na ụgbụ ahụ jupụtara n'azụ, ma na-edobe echiche nke aorist passive n'ụzọ Igbo na-asụkarị.
- source_word: ἀναβιβάσαντες
  choice: ha dọkpụrụ ya rigoro
  rationale: Na-egosipụta ịdọli ụgbụ ahụ site na mmiri ruo n'elu ikpere mmiri.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: n'ikpere mmiri
  rationale: αἰγιαλός bụ akụkụ ala dị n'akụkụ mmiri; okwu a ezughị oke ikwu kpọmkwem na ọ bụ aja.
- source_word: καθίσαντες
  choice: nọdụ ala
  rationale: Na-edobe usoro omume ahụ n'Igbo dị mfe ma bụrụ nke ebumpụta ụwa.
- source_word: συνέλεξαν
  choice: chịkọtaa
  rationale: Na-egosi ịchịkọta azụ ndị a họpụtara mgbe a na-ekewa ha.
- source_word: τὰ καλὰ
  choice: azụ ndị dị mma
  rationale: Ọ bụ ezie na okwu 'azụ' adịghị kpọmkwem na nkebi Grik a, ihe gbasara ịkụ azụ na-eme ka onye okwu ahụ na-ezo aka na ya doo anya.
- source_word: εἰς ἄγγη
  choice: n'ime ihe e ji adọba ihe
  rationale: ἄγγη bụ okwu sara mbara maka arịa ma ọ bụ ihe e ji etinye ihe; nsụgharị a anaghị eme ya nkata kpọmkwem.
- source_word: τὰ δὲ σαπρά
  choice: ndị rere ure
  rationale: σαπρά nwere ike ịpụta ihe rere ure, mebiri emebi, ma ọ bụ na-abaghị uru; 'rere ure' na-edobe ihe oyiyi ahụ siri ike.
- source_word: ἔξω ἔβαλον
  choice: tụpụ ... n'èzí
  rationale: Na-egosipụta ma ike omume ịtụpụ ahụ ma ọnọdụ ya n'èzí.
theological_decisions:
- issue: Nkọwa nke ikewa azụ n'ilu ahụ
  choice: A kọwara amaokwu ahụ dịka ihe ndị ọkụ azụ mere, n'etinyeghị nkọwa banyere ikpeazụ ikpe n'ime amaokwu a.
  alternative: Iji okwu ndị na-akọwa ya ozugbo dịka ihe oyiyi nke ikpe ikpeazụ.
  rationale: Amaokwu a ka na-akọ ihe oyiyi ilu ahụ; nkọwa ya na-abịa n'amaokwu ndị na-esote. Nke a na-echekwa usoro na esemokwu nke ederede ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe oyiyi ịkụ azụ ahụ n'ụzọ doro anya, na-enweghị itinye nkọwa nkà mmụta okpukpe nke amaokwu ndị na-esote.
