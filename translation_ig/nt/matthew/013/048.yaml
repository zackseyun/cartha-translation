revisions:
- from: Mgbe o juputara, ha dọkpụrụ ya rigoro n'ikpere mmiri, nọdụ ala, chịkọtaa azụ ndị dị mma n'ime ihe e ji adọba ihe[a], ma tụpụ ndị rere ure n'èzí.[b]
  to: Mgbe ụgbụ ahụ jupụtara, ha dọkpụrụ ya kpọpụta n'ikpere mmiri, ha nọdụ ala, chịkọta azụ ndị dị mma n'ime arịa[a], ma tụpụ azụ ndị rere ure n'èzí.[b]
  rationale: The revision corrects the hauling expression, replaces an unnatural rendering of “containers” with the broad and idiomatic “arịa,” and makes the two classes of fish explicit for clarity. It does not import the parable’s later interpretation or narrow any lexical ambiguity beyond what the immediate fishing context warrants.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:35:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly retains the concrete fishing image and the sequence of filling, hauling the net ashore, sitting, sorting, and discarding. However, “ha dọkpụrụ ya rigoro” is grammatically and semantically unsuitable: it can suggest that the net itself went up. The revision makes the fishermen pull the net out onto the shore. It also supplies “azụ” on both sides of the sorting contrast for clear, natural Igbo while retaining the source’s intended referent.'
  naturalness: “Ihe e ji adọba ihe” is not a natural general equivalent for containers in this context. “Arịa” is concise, ordinary, and suitably broad. Explicit subjects in the successive actions and the phrasing “dọkpụrụ ya kpọpụta n'ikpere mmiri” improve readability in Standard Igbo.
  terminology: “Ụgbụ,” “ikpere mmiri,” “arịa,” and “azụ ndị rere ure” are appropriate. “Arịa” does not over-specify the Greek ἄγγη as baskets. “Ndị rere ure” is retained in the note as a possible elliptical form, while the main text’s “azụ ndị rere ure” clearly carries the concrete image of σαπρά.
  issues:
  - severity: medium
    issue: “ha dọkpụrụ ya rigoro”
    rationale: The construction improperly attaches “rigoro” (‘went up’) to the object/pronoun and does not naturally express ἀναβιβάσαντες, the action of hauling the net up from the water onto shore.
  - severity: medium
    issue: “ihe e ji adọba ihe” for ἄγγη
    rationale: This expression is awkward and may evoke equipment used for storing or placing things rather than the receptacles into which the fish were collected. “Arịa” is a natural generic term for vessels/containers.
  - severity: low
    issue: Asymmetrical specification of the fish
    rationale: The draft says “azụ ndị dị mma” but then only “ndị rere ure.” Although ellipsis is possible, repeating “azụ” in the second member is clearer and more balanced in modern Igbo.
  revised_text: Mgbe ụgbụ ahụ jupụtara, ha dọkpụrụ ya kpọpụta n'ikpere mmiri, ha nọdụ ala, chịkọta azụ ndị dị mma n'ime arịa[a], ma tụpụ azụ ndị rere ure n'èzí.[b]
  revised_footnotes:
