review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the sequence, Jesus’ departure from the crowds, entry into the house, the disciples’ approach, and their request for an explanation. The lexical rendering of ζιζάνια as “ahịhịa ọjọọ” is suitably general, with the possible specific referent preserved in a footnote.
  naturalness: The coordination in “ọ hapụrụ ìgwè mmadụ ahụ banye n’ụlọ” is not natural Standard Igbo because it can make “ìgwè mmadụ ahụ” seem like the object of “banye.” An explicit sequential construction is needed.
  terminology: “Ndị na-eso ụzọ,” “ilu,” “ahịhịa ọjọọ,” and “ubi” are appropriate, clear Standard Igbo terms. The footnote appropriately retains “ata” and identifies darnel without asserting that identification as certain.
  issues:
  - severity: medium
    issue: Ambiguous/unnatural verb sequencing in the first clause
    rationale: The Greek aorist participle ἀφεὶς marks an action completed before ἦλθεν. In Igbo, “ọ hapụrụ ìgwè mmadụ ahụ banye n’ụlọ” lacks a connector or sequential marker and is syntactically awkward. “Mgbe ọ hapụsịrị …, ọ banyere …” naturally and clearly conveys the temporal relationship.
  revised_text: Mgbe ahụ, mgbe ọ hapụsịrị ìgwè mmadụ ahụ, ọ banyere n’ụlọ. Ndị na-eso ụzọ ya bịakwutere ya sị, “Kọwaara anyị ilu banyere ahịhịa ọjọọ[a] dị n’ubi ahụ.”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “ata dị n’ubi ahụ.” Okwu Grik a nwere ike ịpụta kpọmkwem darnel, ụdị ahịhịa ọjọọ yiri ọka wit.
    reason: lexical_alternative
  revision_rationale: The revision changes only the first clause’s syntax, explicitly expressing that Jesus entered the house after leaving the crowds. It preserves the source sequence, meaning, register, lexical choices, and footnote anchor.
