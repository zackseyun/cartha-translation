revisions:
- from: Mgbe ahụ, ọ hapụrụ ìgwè mmadụ ahụ banye n’ụlọ. Ndị na-eso ụzọ ya bịakwutere ya sị, “Kọwaara anyị ilu banyere ahịhịa ọjọọ[a] dị n’ubi ahụ.”
  to: Mgbe ahụ, mgbe ọ hapụsịrị ìgwè mmadụ ahụ, ọ banyere n’ụlọ. Ndị na-eso ụzọ ya bịakwutere ya sị, “Kọwaara anyị ilu banyere ahịhịa ọjọọ[a] dị n’ubi ahụ.”
  rationale: The revision changes only the first clause’s syntax, explicitly expressing that Jesus entered the house after leaving the crowds. It preserves the source sequence, meaning, register, lexical choices, and footnote anchor.
