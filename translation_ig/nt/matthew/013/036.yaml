id: MAT.13.36
reference: Matthew 13:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: ig
  text: Mgbe ahụ, mgbe ọ hapụsịrị ìgwè mmadụ ahụ, ọ banyere n’ụlọ. Ndị na-eso ụzọ ya bịakwutere ya sị, “Kọwaara anyị ilu banyere ahịhịa ọjọọ[a] dị n’ubi ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ata dị n’ubi ahụ.” Okwu Grik a nwere ike ịpụta kpọmkwem darnel, ụdị ahịhịa ọjọọ yiri ọka wit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi na ihe a mere sochiri ihe ndị e kwuru tupu ya, ma bụrụkwa okwu Igbo doro anya.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: ọ hapụrụ ìgwè mmadụ ahụ
  rationale: A sụgharịrị aorist participle ahụ n’ụzọ na-egosi ihe o mere tupu ọ banye n’ụlọ; “ìgwè mmadụ” na-anọchi plural Greek n’ụzọ Igbo si ekwu ya.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: banye n’ụlọ
  rationale: N’akụkọ a, okwu a na-egosi isi n’èzí banye n’ime ụlọ ahụ; Igbo anaghị achọ ikwughachi nnọchiaha mgbe ngwaa abụọ nwere otu onye na-eme ha.
- source_word: προσῆλθον αὐτῷ
  choice: bịakwutere ya
  rationale: Nke a na-egosi na ndị na-eso ụzọ bịaruru ya nso ka ha gwa ya okwu.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị na-amụta ihe n’aka onye nkụzi ma na-eso ya.
- source_word: λέγοντες
  choice: sị
  rationale: “Sị” na-ejikọta ịbịakwute ya na okwu ha kwuru n’ụzọ Igbo dị mfe ma kwekọọ n’ọrụ participle ahụ.
- source_word: Διασάφησον ἡμῖν
  choice: Kọwaara anyị
  rationale: Ọ na-ebute arịrịọ ka e mee ka ihe ilu ahụ pụtara doo ha anya, na-edobe imperative na onye okwu ahụ ga-abara uru.
- source_word: τὴν παραβολὴν
  choice: ilu
  rationale: “Ilu” bụ okwu Igbo a na-eji maka akụkọ ntụnyere na-akụzi eziokwu, ma kwekọọ n’ụdị okwu Jizọs kwuru ebe a.
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: banyere ahịhịa ọjọọ dị n’ubi ahụ
  rationale: “Ahịhịa ọjọọ” bụ okwu ndị mmadụ na-aghọta maka weeds; nhazi “dị n’ubi ahụ” na-eme ka njikọ genitive Greek ahụ pụta n’Igbo ekeghị eke, ebe nkọwa ala peeji na-echekwa ụdị osisi a pụrụ ịpụta kpọmkwem.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu na-aga were were n’Igbo, ma e chekwara usoro ihe mere na nkọwa dị n’asụsụ Grik.
