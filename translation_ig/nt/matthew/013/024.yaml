id: MAT.13.24
reference: Matthew 13:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: ig
  text: O kọọrọ ha ilu ọzọ, sị, “Alaeze eluigwe dị ka otu nwoke kụrụ ezi mkpụrụ n’ubi ya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “A pụrụ iji alaeze eluigwe tụnyere otu nwoke kụrụ ezi mkpụrụ n’ubi ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: ilu ọzọ
  rationale: Nke a na-egosi na Jizọs gbakwụnyere ilu ọzọ n’usoro ilu ndị ọ na-akọ; ọ bụkwa okwu Igbo dị mfe ma doo anya.
- source_word: παρέθηκεν αὐτοῖς
  choice: O kọọrọ ha
  rationale: παρατίθημι pụtara iweta ma ọ bụ ịtụpụta ihe n’ihu ndị ọzọ. N’Igbo, “kọọrọ ha” na-egosi nke ọma na o wetara ilu ahụ ka ha nụ, n’enweghị akpaalaokwu siri ike nghọta.
- source_word: λέγων
  choice: sị
  rationale: “Sị” bụ ụzọ Igbo nkịtị si ejikọta okwu mmeghe na ihe onye ahụ kwuru.
- source_word: Ὡμοιώθη
  choice: dị ka
  rationale: N’usoro mmalite ilu ndị Matiu, aorist passive a na-ewebata ntụnyere. “Dị ka” bụ nsụgharị Igbo ebumpụta ụwa nke na-adịghị eme ka okwu ahụ kwuo na alaeze ahụ gbanwere ọnọdụ ya.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: Alaeze eluigwe
  rationale: Nke a bụ okwu Igbo a maara nke ọma maka ahịrịokwu pụrụ iche Matiu ji akọ ọchịchị eluigwe, ma ọ na-edobe ịdị arọ nke okwu ahụ.
- source_word: ἀνθρώπῳ
  choice: otu nwoke
  rationale: N’ime ilu a, aha ahụ na-ezo aka n’otu nwoke; “otu nwoke” na-egosi onye ahụ nke ọma.
- source_word: σπείραντι
  choice: kụrụ
  rationale: Okwu a na-egosi ịkụ mkpụrụ dịka ihe e mere; “kụrụ” bụ ụzọ Igbo doro anya si kwuo ya.
- source_word: καλὸν σπέρμα
  choice: ezi mkpụrụ
  rationale: καλός ebe a na-egosi mkpụrụ dị mma, nke na-akwadebe ọdịiche ya na ahịhịa ọjọọ n’amaokwu ndị na-esote.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: n’ubi ya
  rationale: “Ubi” dabara na ἀγρός n’ọnọdụ ọrụ ugbo a, “ya” na-egosikwa na ubi ahụ bụ nke nwoke ahụ.
theological_decisions:
- issue: Nsụgharị ahịrịokwu Matiu gbasara alaeze
  choice: Alaeze eluigwe
  alternative: Alaeze eluigwe dị iche iche
  rationale: Ọ bụ ezie na οὐρανῶν dị n’ụdị ọtụtụ na Grik, “eluigwe” bụ okwu Igbo a na-eji n’ụzọ ebumpụta ụwa ebe a ma na-echekwa echiche ọchịchị nke eluigwe n’enweghị ịgbakwunye nkọwa ozizi.
- issue: Ike okwu Ὡμοιώθη na mmalite ilu
  choice: dị ka
  alternative: a pụrụ iji ya tụnyere
  rationale: “Dị ka” na-enye ntụnyere ilu ahụ n’Igbo dị mfe. Nhọrọ ọzọ na-egosipụta olu passive nke Grik karịa, ya mere e debere ya na nkọwa ala peeji kama ikpebi na ngwaa ahụ pụtara mgbanwe n’ọnọdụ alaeze ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “O kọọrọ ha ilu ọzọ” na-asụgharị ọrụ παρέθηκεν n’ụzọ ebumpụta ụwa; “Alaeze eluigwe dị ka” na-echekwa usoro ntụnyere ilu ahụ n’enweghị ịmanye echiche na alaeze ahụ ‘aghọọla’ ihe ọzọ.
