  to: Ndị ohu nke onye nwe ụlọ ahụ bịakwutere ya wee sị ya, “Nna ukwu, ọ̀ bụghị ezi mkpụrụ ka ị kụrụ n’ubi gị? Oleezi ebe ata[a] si bịa?”
