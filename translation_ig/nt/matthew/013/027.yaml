id: MAT.13.27
reference: Matthew 13:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: ig
  text: Ndị ohu nke onye nwe ụlọ ahụ bịakwutere ya wee sị ya, “Nna ukwu, ọ̀ bụghị ezi mkpụrụ ka ị kụrụ n’ubi gị? Oleezi ebe ata[a] si bịa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ata a na-akpọ darnel”; okwu Grik ahụ yikarịrị ka ọ na-ekwu maka ụdị ata na-adị ka ọka wit mgbe ha ka na-eto ọhụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: bịakwutere ya
  rationale: Ọ na-egosi na ha bịara nso n’ebe ọ nọ tupu ha agwa ya okwu; nsụgharị a bụ nke e ji asụ Igbo nke ọma.
- source_word: δοῦλοι
  choice: ndị ohu
  rationale: Nke a na-echekwa ọnọdụ ha dị ka ndị nọ n’okpuru onye nwe ha, kama ime ka okwu ahụ bụrụ naanị ndị ọrụ a na-akwụ ụgwọ.
- source_word: οἰκοδεσπότου
  choice: onye nwe ụlọ ahụ
  rationale: Ọ na-egosi onye bụ isi ma na-achị ezinụlọ ma ọ bụ ụlọ ahụ, dị ka okwu Grik si pụta.
- source_word: Κύριε
  choice: Nna anyị ukwu
  rationale: N’ọnọdụ ilu a, ọ bụ okwu nkwanye ùgwù ndị ohu ji akpọ onye nwe ha; ọ bụ nsụgharị Igbo dị ndụ ma dị ugwu.
- source_word: οὐχὶ καλὸν σπέρμα ἔσπειρας
  choice: ọ̀ bụghị ezi mkpụrụ ka ị kụrụ
  rationale: Ajụjụ a na-atụ anya azịza ee, ma na-echekwa ‘ezi mkpụrụ’ na omume ịkụ mkpụrụ.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: n’ubi gị
  rationale: Ọ na-egosi n'ụzọ doro anya na ubi ahụ bụ nke onye a na-agwa okwu.
- source_word: πόθεν οὖν ἔχει ζιζάνια
  choice: Oleezi ebe ata ndị a si bịa?
  rationale: Ọ na-echekwa ajụjụ gbasara ebe ata ahụ siri pụta na njikọ echiche nke οὖν, ma na-ada ka Igbo a na-asụ ugbu a.
- source_word: ζιζάνια
  choice: ata
  rationale: ‘Ata’ bụ okwu Igbo ndị mmadụ na-aghọta ngwa ngwa maka ahịhịa ọjọọ na-eto n’etiti ihe a kụrụ; nkọwa banyere ụdị ata ahụ dị n’ala peeji.
theological_decisions:
- issue: Nsụgharị δοῦλοι n’ọnọdụ ụlọ na ubi
  choice: ndị ohu
  alternative: ndị na-ejere ya ozi
  rationale: ‘Ndị ohu’ na-egosipụta mmekọrịta nke ịnọ n’okpuru onye nwe ha nke dị n’okwu Grik; okwu nke ọzọ nwere ike ime ka ọnọdụ ahụ dị nro karịa isi mmalite.
- issue: Nsụgharị κύριε n’okwu ndị ohu gwara onye nwe ụlọ
  choice: Nna anyị ukwu
  alternative: Onyenwe anyị
  rationale: N’ebe a, okwu ahụ bụ aha nkwanye ùgwù a na-akpọ onye nwe ụlọ n’ime ilu, ọ bụghị nkwupụta doro anya banyere aha Chineke. ‘Nna anyị ukwu’ na-echekwa ọnọdụ mmekọrịta ahụ n’Igbo eke, ebe ‘Onyenwe anyị’ ka bụ nhọrọ pụrụ ịdị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. Ajụjụ abụọ ahụ na-ada ka okwu ndị mmadụ ga-ekwu n’ezie, ma a hapụghị ọdịiche dị n’etiti mkpụrụ ọma na ata.
