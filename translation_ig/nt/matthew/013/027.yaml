    reason: lexical_alternative
  revision_rationale: The revision removes the unexpressed possessive from the address to the householder, removes an unnecessary demonstrative from the final question, and clarifies the lexical footnote. It otherwise retains the draft’s accurate, natural rendering and its distinction between household slaves, good seed, and weeds.
