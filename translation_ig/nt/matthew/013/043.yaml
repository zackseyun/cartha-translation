  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: ig
  text: Mgbe ahụ, ndị ezi omume ga-enwu[a] dị ka anyanwụ n’alaeze Nna ha. Onye nwere ntị, ka ọ nụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ga-enwupụta ìhè.”
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik, okwu a dị n’ụdị otu onye: “Onye nwere ntị, ka ọ nụ”—ọ bụ oku e ji otu onye anọchi anya mmadụ ọ bụla, ka ha lebara okwu a anya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Na-egosi oge na usoro ihe ga-eme dịka nkọwa dị n’amaokwu ndị bu ụzọ si dị; ọ bụkwa okwu Igbo doro anya ma kwekọọ na ‘mgbe ahụ.’
- source_word: οἱ δίκαιοι
  choice: ndị ezi omume
  rationale: Na-ezo aka n’ụ ndị a na-ewere dị ka ndị ezi omume; okwu a na-edobe ma akụkụ omume ọma ma akụkụ mmekọrịta ha na Chineke n’enweghị ịkọwa karịa ihe odide ahụ kwuru.
- source_word: ἐκλάμψουσιν
  choice: ga-enwu
  rationale: Na-egosi omume ga-eme n’ọdịnihu, ya bụ ịcha ma ọ bụ inwupụta ìhè; ‘ga-enwu’ bụ Igbo nkịtị ma ihe atụ anyanwụ na-egosikwa ịdị ukwuu nke ìhè ahụ.
- source_word: ὡς ὁ ἥλιος
  choice: dị ka anyanwụ
  rationale: Na-edobe ntụnyere ahụ n’ụzọ Igbo dị mfe ma bụrụ nke e ji eme ihe ugbu a.
- source_word: ἐν τῇ βασιλείᾳ
  choice: n’alaeze
  rationale: N’ebe a, ahịrịokwu ahụ na-egosi ebe ndị ezi omume ga-enwu; ‘alaeze’ na-edobe echiche nke mpaghara ọchịchị n’agbanyeghị na βασιλεία nwekwara ike ịpụta ọchịchị eze.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: Nna ha
  rationale: Na-agbasochi okwu Grik anya n’enweghị itinye ‘nke eluigwe,’ nke na-adịghị n’amaokwu a.
- source_word: ὁ ἔχων ὦτα
  choice: Onye nwere ntị
  rationale: Na-edobe onye otu ahụ e ji anọchi anya mmadụ ọ bụla; n’Igbo, ‘onye’ bụ usoro ebumpụta ụwa nke na-adịghị achọ ịtinye okike mmadụ na-adịghị n’ụdị asụsụ Igbo.
- source_word: ἀκουέτω
  choice: ya nụrụ
  rationale: Na-ebuga iwu onye nke atọ nke na-akpọ mmadụ ka ọ nụ ma ghọta ma lebara okwu ahụ anya; usoro a dị nkenke, dị nsọpụrụ, ma na-edobe ụdị otu onye.
theological_decisions:
- issue: Ụdị otu onye na oku ikpeazụ
  choice: Onye nwere ntị, ya nụrụ
  alternative: Onye nwere ntị, ya gee ntị
  rationale: A na-edobe otu onye nke Grik na oku nnọchianya ya. ‘Nụrụ’ na-echekwa njikọ okwu na ἀκούω ma na-ahapụ ike ya nke ịnụ, ịghọta, na ịṅa ntị ka ihe gbara ya gburugburu gosi ya.
- issue: Ihe βασιλεία pụtara n’ebe a
  choice: alaeze
  alternative: ọchịchị
  rationale: Njikọ ‘n’alaeze Nna ha’ na-arụ ọrụ dịka ebe ma na-egosi ọnọdụ nke oge ikpeazụ; ‘alaeze’ kacha daba n’usoro ahụ n’enweghị ịgọnahụ echiche ọchịchị Chineke.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu, mee nsụgharị a. E debere ahịrịokwu abụọ ahụ n’usoro dị nso na Grik, ma jiri akpaalaokwu Igbo ebumpụta ụwa. A na-ede ‘Nna’ na mkpụrụedemede ukwu n’ihi na ọ bụ aha e ji kpọọ Chineke n’ebe a.
