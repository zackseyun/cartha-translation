revisions:
- from: Ha wee were ya iwe[a]. Ma Jizọs sịrị ha, “Ọ dịghị onye amụma a na-adịghị asọpụrụ ma e wezụga n’obodo ya[b] na n’ezinụlọ nke ya[c].”
  to: Ha wee were ya iwe[a]. Ma Jizọs sịrị ha, “A na-asọpụrụ onye amụma n’ebe niile, ma e wezụga n’obodo ya[b] na n’ezinụlọ ya[c].”
  rationale: 'The revision makes Jesus’ proverbial saying idiomatic and unambiguous in Standard Igbo: a prophet is honored everywhere except in the native locality and domestic circle. It maintains the source’s honor terminology and exception structure, retains the original sense of offense in the first clause, and improves footnote a so that it accurately describes the Greek idiom. Footnote markers remain attached to their respective terms.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:35:25Z'
review_pass:
  verdict: revise
  source_fidelity: The opening correctly conveys the contextual sense of ἐσκανδαλίζοντο ἐν αὐτῷ as taking offense. The names, contrast, and the two social spheres (πατρίς and οἰκία) are retained. However, “Ọ dịghị onye amụma a na-adịghị asọpụrụ” is a marked and potentially confusing double-negative formulation for οὐκ ἔστιν προφήτης ἄτιμος; a more idiomatic proverbial form is needed while retaining the exception.
  naturalness: “Ha wee were ya iwe” and “Ma Jizọs sịrị ha” are natural Standard Igbo. The revised proverb reads more smoothly and clearly in contemporary Standard Igbo. “n’ezinụlọ ya” is sufficient; adding “nke ya” is unnecessary because “ya” already marks possession.
  terminology: “onye amụma,” “a na-asọpụrụ,” “obodo,” and “ezinụlọ” are suitable, dignified Standard Igbo terms. The footnote for a should not call the Greek imperfect expression “n’ụzọ nkịtị” with the overly literal and unnatural wording “ha nọ na-asụ ngọngọ n’ime ya”; it should identify it as an idiomatic Greek expression and provide a closer alternative without suggesting physical stumbling.
  issues:
  - severity: medium
    issue: The proverb’s double-negative syntax is unnatural and may obscure its meaning.
    rationale: “Ọ dịghị onye amụma a na-adịghị asọpụrụ” can be processed as a claim that no such prophet exists rather than as the proverb that a prophet is honored except in the stated locations. Recasting it positively with the same exception makes the Greek sense clear.
  - severity: low
    issue: Footnote a labels an awkward gloss as literal.
    rationale: ἐσκανδαλίζοντο is imperfect passive and the phrase is idiomatic. “ha nọ na-asụ ngọngọ n’ime ya” is not a useful literal Standard Igbo representation and may imply actual physical stumbling.
  revised_text: Ha wee were ya iwe[a]. Ma Jizọs sịrị ha, “A na-asọpụrụ onye amụma n’ebe niile, ma e wezụga n’obodo ya[b] na n’ezinụlọ ya[c].”
