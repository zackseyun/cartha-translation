  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: ig
  text: Ha wee were ya iwe[a]. Ma Jizọs sịrị ha, “A na-asọpụrụ onye amụma n’ebe niile, ma e wezụga n’obodo ya[b] na n’ezinụlọ ya[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ha kpasuru iwe n’ihi ya” ma ọ bụ “ihe banyere ya wee bụrụ ha ihe ịsụ ngọngọ.” Okwu Grik ahụ bụ akpaalaokwu nke na-ekwu maka iwe ma ọ bụ ịjụ mmadụ, ọ bụghị ịsụ ngọngọ n’ụzọ nkịtị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “n’ala nna ya” ma ọ bụ “n’ebe o si.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “n’ụlọ ya.” Okwu Grik ahụ nwere ike izo aka n’ụlọ n’onwe ya ma ọ bụ n’ezinụlọ na ndị ụlọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: Ha wee were ya iwe
  rationale: N’ọnọdụ a, akpaalaokwu Grik ahụ na-egosi na ihe banyere Jizọs kpasuru ha iwe ma mee ka ha jụ ya; nsụgharị a bụ Igbo doro anya ma ghara ịkọwa ya dị ka ịsụ ngọngọ n’ụzọ nkịtị.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ma Jizọs sịrị ha
  rationale: “Ma” na-egosi obere ntụgharị na mmegide dị n’etiti iwe ha na ihe Jizọs zara.
- source_word: προφήτης
  choice: onye amụma
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa onye amụma, ma ọ na-edobe ọdịdị ilu nke okwu Jizọs.
- source_word: ἄτιμος
  choice: a na-adịghị asọpụrụ
  rationale: Nhọrọ a na-echekwa echiche banyere nsọpụrụ na enweghị nsọpụrụ, kama ịtụgharị ya naanị ka ọ bụrụ mmechuihu.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: Nke a na-egosi nkewapụ ma ọ bụ ebe naanị okwu ahụ metụtara, dịka usoro Grik si dị.
- source_word: πατρίδι
  choice: n’obodo ya
  rationale: N’akụkọ a, okwu ahụ na-ezo aka n’obodo onye si, ya bụ obodo Jizọs, ọ bụghị mba dum.
- source_word: οἰκίᾳ αὐτοῦ
  choice: n’ezinụlọ nke ya
  rationale: οἰκία nwere ike ịpụta ụlọ ma ọ bụ ndị ụlọ; n’ilu a, “ezinụlọ” na-egosi ndị nọ n’ụlọ na mmekọrịta ezinụlọ, ebe nkọwa ala peeji na-edobe ohere nke “ụlọ.”
theological_decisions:
- issue: Ókè okwu ilu Jizọs banyere ịjụ onye amụma ruru
  choice: E debere ya dị ka ilu zuru ezu banyere enweghị nsọpụrụ onye amụma n’obodo na n’ezinụlọ ya.
  alternative: Ịkọwa ya kpọmkwem dị ka nkwenkweghị nke ndị ezinụlọ Jizọs.
  rationale: Grik na-enye ilu Jizọs tinyere n’ọnọdụ a, ma ọ naghị akọwapụta ozizi sara mbara banyere ụdị nile nke ịjụ Jizọs; ya mere nsụgharị ahụ anaghị etinye nkọwa okpukpe ọzọ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E chekwara usoro ilu na echiche nsọpụrụ/ihere nke ederede Grik, ma tinye ụzọ nsụgharị ndị ọzọ n’ala peeji ebe okwu Grik nwere nghọta karịrị otu.
