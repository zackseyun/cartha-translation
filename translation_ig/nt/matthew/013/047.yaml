source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: ig
  text: “Ọzọkwa, alaeze eluigwe dị ka ụgbụ ukwu[a] a tụbara n’ime oké osimiri, nke chịkọtara site n’ụdị niile.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “ụgbụ”; okwu Grik ahụ na-ezo kpọmkwem n’ụgbụ buru ibu a na-adọkpụ n’ime mmiri.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ nkịtị: “nke chịkọtara site n’ụdị niile.” Asụsụ Grik ahụ ekwughị ihe ụgbụ ahụ chịkọtara kpọmkwem; ihe atụ ịkụ azụ na-egosi ihe a na-ekwu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Ọzọkwa
  rationale: Na-egosi na Jizọs na-atụ ilu ọzọ n’usoro; okwu a dị nkenke ma bụrụ Igbo a na-asụ ugbu a.
- source_word: ὁμοία ἐστὶν
  choice: dị ka
  rationale: Na-echekwa usoro ntụnyere nke ilu ahụ n’ụzọ doro anya ma bụrụkwa nke e ji asụ Igbo nke ọma.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: alaeze eluigwe
  rationale: Na-echekwa okwu pụrụ iche Matiu ji mee ihe, n’etinyeghị nkọwa ọzọ dị ka ‘alaeze Chineke.’
- source_word: σαγήνῃ
  choice: ụgbụ ukwu
  rationale: Okwu Grik ahụ na-ekwu maka ụgbụ buru ibu a na-adọkpụ n’ime mmiri; ‘ụgbụ ukwu’ bụ okwu dị mfe nghọta, ebe nkọwa ala peeji na-egosi ụdị ụgbụ ahụ kpọmkwem.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: a tụbara n’ime oké osimiri
  rationale: Na-echekwa omume ịtụ ụgbụ na ntụaka Grik kpọmkwem maka ‘oké osimiri.’
- source_word: ἐκ παντὸς γένους συναγαγούσῃ
  choice: nke chịkọtara azụ sitere n’ụdị niile
  rationale: ‘Sitere n’ụdị niile’ na-echekwa ἐκ παντὸς γένους; etinyere ‘azụ’ maka nghọta Igbo n’ihi na ihe atụ ịkụ azụ na-eme ka ihe ahụ a na-achịkọta pụta ìhè, ọ bụ ezie na aha ahụ adịghị n’edere Grik.
theological_decisions:
- issue: Ihe ‘alaeze eluigwe’ pụtara
  choice: E debere okwu Matiu bụ ‘alaeze eluigwe.’
  alternative: alaeze Chineke; ọchịchị eluigwe
  rationale: Nke a na-echekwa okwu dị n’isi mmalite n’ebugharịghị ya gaa n’okwu ọzọ ma ọ bụ kpebie nkọwa nkà mmụta okpukpe n’aha onye na-agụ ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ilu na ntụnyere nke ederede Grik, ma jiri nkọwa ala peeji kọwaa ụdị ụgbụ ahụ na okwu ‘azụ’ e tinyere maka nghọta.
