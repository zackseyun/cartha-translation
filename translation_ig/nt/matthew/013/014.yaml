source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: ig
  text: 'Amụma Aịzaya na-emezu n’ime ha[a], nke na-ekwu, sị: “Unu ga-anụ n’ezie, ma unu agaghị aghọta ma ọlị; unu ga-ele anya n’ezie, ma unu agaghị ahụta ma ọlị.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị: “Site n’ịnụ unu ga-anụ ... sitekwa n’ile anya unu ga-ele anya.” Nke a bụ ụzọ Hibru si emesi okwu ike, nke e hotara site n’asụsụ Grik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: na-emezukwa
  rationale: Okwu a dị n’ụdị present passive; ‘na-emezukwa’ na-egosi na amụma ahụ na-enweta mmezu n’ahụ ndị a, ma ghara ịgbakwunye echiche na e mezuru ya n’ụzọ zuru oke karịa ihe ederede kwuru.
- source_word: αὐτοῖς
  choice: n’ime ha
  rationale: Dative a na-egosi na amụma ahụ na-emezu n’ihe gbasara ndị ahụ; ‘n’ime ha’ na-edobe ihe oyiyi nke Greek ma bụrụkwa Igbo a na-aghọta.
- source_word: προφητεία Ἠσαΐου
  choice: Amụma Aịzaya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma dị ebube isi kwuo genitive ahụ, ya bụ amụma nke Aịzaya kwuru.
- source_word: ἡ λέγουσα
  choice: nke na-ekwu, sị
  rationale: Ọ na-ewebata okwu e hotara n’ụzọ doro anya ma kwekọọ na attributive participle nke Greek.
- source_word: Ἀκοῇ ἀκούσετε
  choice: N’ezie, unu ga-anụ
  rationale: Nke a na-ebute ike nke usoro Semitic emphatic ahụ n’Igbo nkịtị, ebe nkọwa ala peeji na-echekwa ọdịdị ya nke dị nso n’okwu mbụ.
- source_word: οὐ μὴ συνῆτε
  choice: ma unu agaghị aghọta ma ọlị
  rationale: ‘Ma ọlị’ na-egosi ike nke οὐ μή, ebe ‘ma’ na-eme ka ọdịiche dị n’etiti ịnụ na ịghọta pụta ìhè.
- source_word: βλέποντες βλέψετε
  choice: unu ga na-elekwa anya
  rationale: Ọ na-egosi omume nke ịhụ anya na-aga n’ihu ma na-edobe njikọ ya na ahịrịokwu mbụ; nkọwa ala peeji na-egosi nkwughachi okwu dị na Greek.
- source_word: οὐ μὴ ἴδητε
  choice: ma unu agaghị ahụta ma ọlị
  rationale: ‘Ịhụta’ ebe a na-egosi ịghọta ma ọ bụ ịmata ihe a na-ele anya, ọ bụghị naanị ịhụ ya n’anya; ‘ma ọlị’ na-echekwa emphatic negation.
theological_decisions:
- issue: Ụdị mmezu amụma a na-ekwu maka ya
  choice: Amụma Aịzaya na-emezu n’ime ndị ahụ.
  alternative: Amụma ahụ bụ naanị ihe atụ nke ọnọdụ ha, ma ọ bụ na ọ na-emezu kpamkpam n’ụzọ siri ike karị.
  rationale: Nsụgharị ahụ na-edobe asụsụ mmezu nke Greek, ma ọ naghị ekpebi ma ọ bụ tinye nkọwa gbasara ịkpọchi obi, akara aka, ma ọ bụ usoro mmezu amụma nke ederede ahụ na-akọwaghị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. E ji ‘unu’ n’ihi na ngwaa Greek ndị dị na nkwupụta ahụ bụ plural. A hapụrụ nkwughachi Semitic n’ụdị a na-agụ nke ọma, ma kọwaa ọdịdị ya kpọmkwem n’ala peeji.
