- from: 'Amụma Aịzaya na-emezukwa n’ime ha[a], nke na-ekwu, sị: “N’ezie, unu ga-anụ, ma unu agaghị aghọta ma ọlị; unu ga na-elekwa anya, ma unu agaghị ahụta ma ọlị.”'
  to: 'Amụma Aịzaya na-emezu n’ime ha[a], nke na-ekwu, sị: “Unu ga-anụ n’ezie, ma unu agaghị aghọta ma ọlị; unu ga-ele anya n’ezie, ma unu agaghị ahụta ma ọlị.”'
  rationale: The revision removes unwarranted additive and progressive nuances, while preserving the present sense of prophetic fulfillment, the plural address, the emphatic negatives, and the source text’s parallelism. It also maintains the distinction between looking and truly seeing/perceiving without resolving its wider theological implications.
