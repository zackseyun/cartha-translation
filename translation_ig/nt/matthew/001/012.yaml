id: MAT.1.12
reference: Matthew 1:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: ig
  text: Mgbe a dọọrọ ndị mmadụ n’agha gaa Babilọn[a], Jekonaya mụrụ Shealtiel, Shealtiel mụrụkwa Zerubabel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe a chụgara ndị mmadụ n’ala Babilọn.” Okwu Grik a na-ezo aka n’ịkwapụ ndị mmadụ n’ike, kpọga ha biri n’ala Babilọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: Mgbe
  rationale: μετά na accusative na-egosi oge na-esochi ihe ọzọ. δέ bụ njikọ dị nro; n’Igbo dị ire ụtọ, a na-etinye echiche ya n’usoro ahịrịokwu ahụ n’enweghị okwu njikọ pụrụ iche.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: a dọọrọ ndị mmadụ n’agha laa Babilọn
  rationale: μετοικεσία na-ezo aka n’ịkwapụ ndị mmadụ n’ike gaa biri n’ala ọzọ. Akpaokwu a na-egosi na ọ bụghị njem afọ ofufo, ma na-edokwa Babilọn dịka ebe a kpọgara ha.
- source_word: Ἰεχονίας
  choice: Jekonaya
  rationale: Ụdị a na-edepụta aha Grik Ἰεχονίας n’usoro mkpọpụta na odide Igbo nke na-eme ka aha ahụ dị mfe ọgụgụ.
- source_word: ἐγέννησεν
  choice: mụrụ
  rationale: N’usoro ọmụmụ, ‘mụrụ’ bụ okwu Igbo dị nkenke ma bụrụkwa nke nkịtị maka igosi usoro nna na ụmụ ya; ọ dịghị amanye ka onye a kpọrọ aha bụrụ nwa ozugbo n’enweghị ọgbọ fọdụrụ n’etiti.
- source_word: Σαλαθιήλ
  choice: Shealtiel
  rationale: A na-eji ụdị aha Hibru a maara nke ọma, nke e dere n’ụzọ ga-ekwe ọgụgụ n’Igbo.
- source_word: δὲ
  choice: -kwa
  rationale: N’ahịrị nke abụọ, δέ na-ejikọta usoro ọmụmụ na-aga n’ihu; mgbakwunye ‘-kwa’ na ngwaa na-eme nke a n’ụzọ Igbo dị mma.
- source_word: Ζοροβαβέλ
  choice: Zerubabel
  rationale: Ụdị a na-agbaso aha Hibru a na-amakarị ma kwekọọ n’usoro odide na mkpọpụta Igbo.
theological_decisions:
- issue: Ntụgharị γεννάω n’usoro ọmụmụ
  choice: Jiri ‘mụrụ’ gosipụta usoro ọmụmụ site n’akụkụ nna, ma ghara ikwu na ọ ga-abụrịrị nwa ya ozugbo.
  alternative: mụpụtara; ghọrọ nna nke
  rationale: Usoro ọmụmụ nwere ike iji asụsụ nna na nwa maka usoro agbụrụ nke nwere ike ịgụnye ọgbọ ndị a na-akpọghị aha. ‘Mụrụ’ na-edobe usoro ahụ n’ụzọ nkịtị n’Igbo n’enweghị itinye nkọwa siri ike karịa ihe ederede kwuru.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji akpaokwu ‘dọọrọ ndị mmadụ n’agha laa’ mee ka mmanye dị na μετοικεσία pụta ìhè, ebe nkọwa ala ala peeji na-echekwa ntụgharị ọzọ.
