id: MAT.1.9
reference: Matthew 1:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: ig
  text: Ọzaya bụ nna Jotam; Jotam bụkwa nna Ehaz; Ehaz bụkwa nna Hezekaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὀζίας
  choice: Ụzaya
  rationale: E ji ụdị aha a maara nke ọma n’Igbo mee ka aha Grik a kwekọọ n’aha eze ahụ dị n’Agba Ochie, kama idegharị ya kpọmkwem dị ka Ọzias.
- source_word: δὲ
  choice: -kwara
  rationale: N’usoro ọmụmụ a, δέ bụ njikọ dị nro nke na-aga n’ihu n’ndepụta ahụ. Mgbakwunye -kwara na-eme ka njikọ na usoro mmegharị ahịrịokwu ahụ pụta n’Igbo n'ụzọ ebumpụta ụwa.
- source_word: ἐγέννησεν
  choice: mụrụ
  rationale: N’usoro ọmụmụ, okwu a na-egosi na nwoke ahụ ghọrọ nna onye a kpọrọ aha. “Mụrụ” bụ okwu Igbo dị nkenke, nke a na-aghọta nke ọma, ma na-echekwa usoro a na-emegharị emegharị.
- source_word: Ἰωαθάμ
  choice: Jotam
  rationale: A họọrọ ụdị aha a na-ejikarị eme ihe n’Igbo maka eze Juda ahụ a maara n’Agba Ochie.
- source_word: Ἀχάζ
  choice: Ehaz
  rationale: A họọrọ ụdị aha eze Juda ahụ a na-ahụkarị n’ọdịnala aha Akwụkwọ Nsọ Igbo, kama ịgbaso mkpụrụedemede Grik n’ụzọ siri ike.
- source_word: Ἑζεκίαν
  choice: Hezekaya
  rationale: A họọrọ ụdị aha a maara nke ọma n’Igbo maka eze Juda ahụ dị n’Agba Ochie.
theological_decisions:
- issue: Ihe γεννάω pụtara n’usoro ọmụmụ
  choice: A sụgharịrị ya “mụrụ,” dịka usoro nna na nwa nke amaokwu ahụ kwuru.
  alternative: bụ nna; ghọrọ nna; bụ nna nna ochie
  rationale: Usoro ọmụmụ Matiu ji ahịrịokwu a na-emegharị emegharị. “Mụrụ” na-echekwa ike okwu ahụ na ụda usoro ya, n’etinyeghị nkọwa sara mbara dịka “bụ nna nna ochie,” ọ bụ ezie na usoro ọmụmụ Akwụkwọ Nsọ nwere ike ịhapụ ụfọdụ ọgbọ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro ahịrịokwu ahụ dị nkenke ma na-emegharị emegharị dịka nke Grik; -kwara na-egosipụta njikọ δέ n'ụzọ Igbo ebumpụta ụwa.
