revisions:
- from: Ụzaya mụrụ[a] Jotam, Jotam mụkwara Ehaz, Ehaz mụkwara Hezekaya.
  to: Ọzaya bụ nna Jotam; Jotam bụkwa nna Ehaz; Ehaz bụkwa nna Hezekaya.
  rationale: The revision replaces the potentially gender-neutral “mụrụ” with the explicit, natural genealogical expression “bụ nna.” It preserves the source’s repeated paternal succession, its restrained connective progression through “bụkwa,” and the conventional Igbo forms of the royal names.
  reviewer_model: gpt-5.6-terra
