id: MAT.1.11
reference: Matthew 1:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: ig
  text: Josaya mụrụ Jekonia na ụmụnne ya ndị nwoke n’oge e dọọrọ mmadụ n’agha gaa Babilọn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’oge a kpọgara mmadụ n’ala ọzọ gaa Babilọn.” Okwu Grik ahụ nwere ike ịpụta mbugharị e manyere mmadụ ma ọ bụ ibi n’ala ọzọ n’ihi ndọrọ n’agha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: mụrụ
  rationale: N’usoro ọmụmụ a, okwu a na-egosi na Josaịa bụ nna n’usoro agbụrụ. “Mụrụ” bụ ụzọ Igbo dị mkpirikpi ma bụrụkwa nke a na-aghọta nke ọma; ọ naghị ekpebi n’ike ma njikọ ahụ ọ bụ nna mụrụ nwa ozugbo ma ọ bụ nna nna n’usoro agbụrụ.
- source_word: Ἰεχονίαν
  choice: Jekonaịa
  rationale: E dere aha Grik ahụ n’ụdị dabara n’usoro mkpọpụta na odide Igbo.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: ụmụnne ya ndị nwoke
  rationale: ἀδελφούς bụ ọtụtụ nke nwoke; “ụmụnne ya ndị nwoke” na-eme ka okike nwoke ahụ pụta ìhè ma nọgide bụrụ Igbo a na-aghọta ngwa ngwa.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: n’oge a dọọrọ ndị Izrel n’agha gaa Babilọn
  rationale: μετοικεσία na-egosi mbugharị a manyere mmadụ amanye, ya bụ ịdọrọ ha n’agha; “n’oge” na-egosipụta ọrụ oge nke ἐπί na genitive, ebe “gaa Babilọn” na-egosi ebe a kpọgara ha.
- source_word: δὲ
  choice: '[a sụgharịghị ya iche]'
  rationale: δέ bụ njikọ dị nro n’usoro ọmụmụ a. Igbo anaghị achọ ka e nye ya okwu pụrụ iche ebe a, ma iwepụ ya adịghị ewepụ ihe ọ pụtara.
theological_decisions:
- issue: Mkpokọta ọgbọ n’usoro ọmụmụ Matiu
  choice: A sụgharịrị usoro ahụ dịka Grik si kwuo ya, jiri “mụrụ” hapụkwa ụdị njikọ ọgbọ ahụ oghe.
  alternative: Ịkọwa ἐγέννησεν kpọmkwem dịka ịbụ nna mụrụ nwa ozugbo, ma ọ bụ ịgbasa ya dịka nna nna n’usoro agbụrụ.
  rationale: Usoro ọmụmụ Matiu nwere ike ịhapụ ọgbọ ụfọdụ. Nsụgharị ekwesịghị idozi ajụjụ akụkọ ihe mere eme ahụ n’ime amaokwu, kama ọ ga-echekwa okwu na ohere nghọta dị na isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Dọọrọ ndị Izrel n’agha gaa Babilọn” na-eme ka mmanye dị na ihe ahụ pụta ìhè; e tinyere “ndị Izrel” iji mee ka onye a dọọrọ doo anya n’Igbo, ebe ọnọdụ akụkọ ahụ na-enye ya. Akara nkọwa [a] dị n’isiokwu ahụ.
