revisions:
- from: Josaịa mụrụ Jekonaịa na ụmụnne ya ndị nwoke n’oge a dọọrọ ndị Izrel n’agha gaa Babilọn.[a]
  to: Josaya mụrụ Jekonia na ụmụnne ya ndị nwoke n’oge e dọọrọ mmadụ n’agha gaa Babilọn.[a]
  rationale: The revision removes the unsupported reference to “the Israelites” and retains the source’s broad event label through the impersonal expression “e dọọrọ mmadụ n’agha.” It preserves the temporal force of ἐπί, the coercive nuance of μετοικεσία, and the explicitly male reference to Jeconiah’s brothers. The footnote supplies the lexical alternative without introducing an unanchored claim.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:29:31Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the genealogy formula, Jeconiah’s male brothers, and the temporal reference to the deportation/exile. However, “ndị Izrel” is not present in the Greek and narrows/expands the stated reference; the historical context concerns the Babylonian removal, but the verse itself does not name its victims.
  naturalness: “Mụrụ” is an established and intelligible genealogical expression in Standard Igbo. The revised wording removes the unnecessarily explicit and source-unsupported object while retaining a natural impersonal expression for the forced removal.
  terminology: “Ndọrọ n’agha” suitably conveys μετοικεσία in this context. “Ụmụnne ya ndị nwoke” accurately retains the masculine plural of ἀδελφούς. The spelling “Josaya” and “Jekonia” follows more customary Standard Igbo biblical name forms.
  issues:
  - severity: medium
    issue: The main text adds “ndị Izrel.”
    rationale: The Greek says only “at/during the deportation of/to Babylon.” Adding “the Israelites” supplies information absent from the verse and is historically imprecise in this setting, where Judah/Judeans are more specifically in view.
  - severity: low
    issue: The personal-name spellings are nonstandard-looking for contemporary Igbo biblical usage.
    rationale: “Josaya” and “Jekonia” are clearer customary Igbo forms than “Josaịa” and “Jekonaịa,” while preserving the Greek referents.
  revised_text: Josaya mụrụ Jekonia na ụmụnne ya ndị nwoke n’oge e dọọrọ mmadụ n’agha gaa Babilọn.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’oge a kpọgara mmadụ n’ala ọzọ gaa Babilọn.” Okwu Grik ahụ nwere ike ịpụta mbugharị e manyere mmadụ ma ọ bụ ibi n’ala ọzọ n’ihi ndọrọ n’agha.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported reference to “the Israelites” and retains the source’s broad event label through the impersonal expression “e dọọrọ mmadụ n’agha.” It preserves the temporal force of ἐπί, the coercive nuance of μετοικεσία, and the explicitly male reference to Jeconiah’s brothers. The footnote supplies the lexical alternative without introducing an unanchored claim.
