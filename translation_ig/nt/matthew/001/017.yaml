id: MAT.1.17
reference: Matthew 1:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: ig
  text: Ya mere, ọgbọ niile site n’Ebraham ruo Devid bụ ọgbọ iri na anọ; site na Devid ruo nchụga gaa Babilọn, ọgbọ iri na anọ; site na nchụga gaa Babilọn ruo Mesaịa[a], ọgbọ iri na anọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” Okwu Grik bụ χριστός bụ aha ọkwá pụtara “onye e tere mmanụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: Ya mere, ọgbọ niile
  rationale: “Ya mere” na-egosipụta nchịkọta ma ọ bụ nkwubi okwu nke οὖν, ebe “ọgbọ niile” na-edobe Πᾶσαι αἱ γενεαὶ n'ụzọ doro anya ma dị mfe nghọta n’Igbo.
- source_word: ἀπὸ ... ἕως
  choice: malite na/n’… ruo
  rationale: Usoro a na-egosipụta oge malitere na ebe ọ kwụsịrị n’usoro ọmụmụ, ma na-ada nke ọma n’Igbo.
- source_word: γενεαὶ δεκατέσσαρες
  choice: ọgbọ iri na anọ
  rationale: Nke a na-edobe ọnụọgụ na okwu e ji akọwa usoro ọmụmụ ahụ, ma na-eme ka nhazi akụkụ atọ nke amaokwu ahụ pụta ìhè.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: mgbe/oge ahụ a chụgara ndị mmadụ biri na Babilọn
  rationale: μετοικεσία na-ezo aka n’ịchụpụ ma ọ bụ ịkwaga ndị mmadụ gaa biri n’ala ọzọ. Nsụgharị a na-egosipụta ma nchụga ahụ ma ebe e bugara ha n’enweghị itinye echiche ọzọ na-adịghị na isi mmalite.
- source_word: τοῦ χριστοῦ
  choice: Mesaịa
  rationale: N’ebe a χριστός bụ aha ọkwá ahụ onye usoro ọmụmụ a na-erute n’ebe ọ nọ; “Mesaịa” na-ebute ihe aha ọkwá ahụ pụtara kama ime ya naanị aha mmadụ.
- source_word: Ἀβραὰμ / Δαυὶδ / Βαβυλῶνος
  choice: Ebraham / Devid / Babilọn
  rationale: E ji ụdị aha ndị a a na-ahụkarị n’Igbo dee aha mmadụ na ebe ndị ahụ.
theological_decisions:
- issue: Nsụgharị χριστός dịka aha ọkwá
  choice: Mesaịa
  alternative: Kraịst
  rationale: Akụkụ a bụ njedebe nke usoro ọmụmụ ahụ ma jiri mkpụrụokwu ahụ dịka aha ọkwá. “Mesaịa” na-echekwa ọrụ ya dịka onye e tere mmanụ, ebe e tinyere “Kraịst” n’ala ala peeji dịka nsụgharị ọdịnala ọzọ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere nhazi akụkụ atọ na nkwughachi “ọgbọ iri na anọ” nke isi mmalite, ma zere okwu ụka pụrụ iche.
