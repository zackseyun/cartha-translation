revisions:
- from: Ya mere, ọgbọ niile malite n’Ebraham ruo Devid dị iri na anọ; malite na Devid ruo mgbe a chụgara ndị mmadụ biri na Babilọn, ọgbọ iri na anọ; malitekwa n’oge ahụ a chụgara ndị mmadụ biri na Babilọn ruo Mesaịa[a], ọgbọ iri na anọ.
  to: Ya mere, ọgbọ niile site n’Ebraham ruo Devid bụ ọgbọ iri na anọ; site na Devid ruo nchụga gaa Babilọn, ọgbọ iri na anọ; site na nchụga gaa Babilọn ruo Mesaịa[a], ọgbọ iri na anọ.
  rationale: The revision preserves the source’s explicit “all the generations,” its three matched segments, and each occurrence of “fourteen generations.” It replaces a cumbersome paraphrase of the Babylonian deportation with a concise Standard Igbo expression and retains “Mesaịa” for the Greek title χριστός without foreclosing the traditional alternative in the footnote.
