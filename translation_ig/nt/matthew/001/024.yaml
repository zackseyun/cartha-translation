  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: ig
  text: Josef tetara n’ụra, o wee mee dị ka mmụọ ozi nke Onyenwe anyị nyere ya n’iwu, wee kpọrọ nwunye ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “wee nabata nwunye ya,” ma ọ bụ “wee kpọrọ nwunye ya banye n’ụlọ ya.” Ngwaa Grik a nwere ike ịpụta ịkpọrọ ma ọ bụ ịnabata mmadụ n’ụlọ mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς … ἀπὸ τοῦ ὕπνου
  choice: mgbe o tetara n’ụra
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ ebumpụta ụwa na mmadụ sitere n'ụra teta, ma na-edobe usoro omume nke participle ahụ.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N'ebe a δέ na-eme ka akụkọ gaa n'ihu, ọ bụghị igosi nnukwu esemokwu; ‘Mgbe ahụ’ na-egosipụta njikọ ahụ nke ọma.
- source_word: ἐποίησεν ὡς
  choice: mere dị ka
  rationale: Ọ na-egosi na Josef mere ihe kwekọrọ kpọmkwem n'iwu e nyere ya.
- source_word: προσέταξεν
  choice: nyere ya n’iwu
  rationale: Nke a na-egosipụta iwu nwere ikike, nke bụ ike okwu προστάσσω n'ebe a.
- source_word: ὁ ἄγγελος κυρίου
  choice: mmụọ ozi nke Onyenwe anyị
  rationale: Nke a bụ nsụgharị doro anya ma kwụsie ike nke ahịrịokwu Grik ahụ, na-ejigide κύριος dịka ‘Onyenwe anyị.’
- source_word: παρέλαβεν
  choice: kpọrọ … ka ọ nọnyere ya
  rationale: παραλαμβάνω nwere ike ịpụta ịkpọrọ ma ọ bụ ịnabata mmadụ ka ọ bụrụ nke gị ma ọ bụ bata n'ụlọ gị. Nhọrọ a bụ Igbo ebumpụta ụwa ma na-ahapụ nkọwa gbasara ịnabata ya na ezinụlọ ka ihe gbara amaokwu ahụ gburugburu kọwaa ya.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: nwunye ya
  rationale: N'agbanyeghị na γυνή nwekwara ike ịpụta ‘nwaanyị,’ ọnọdụ alụmdi na nwunye nke akụkọ a na-akwado ‘nwunye ya.’
theological_decisions:
- issue: Ịsụgharị γυνή tupu e nwee mmekọrịta di na nwunye
  choice: nwunye ya
  alternative: nwaanyị ahụ
  rationale: Matiu na-ekwu maka Meri n'ime ọnọdụ alụmdi na nwunye nke iwu na omenala, ọ bụ ezie na amaokwu na-esote na-ekwu na mmekọrịta di na nwunye amalitebeghị. ‘Nwunye ya’ anaghị agbakwunye na mmekọrịta ahụ amalitela.
- issue: Ịsụgharị κύριος n'ahịrịokwu ἄγγελος κυρίου
  choice: mmụọ ozi nke Onyenwe anyị
  alternative: mmụọ ozi nke Yahweh
  rationale: ‘Onyenwe anyị’ na-edobe okwu κύριος dị na Grik ma na-agbaso ụzọ a maara nke ọma e si ekwu ahịrịokwu ahụ n'Igbo.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘tetara n’ụra’ mee ka okwu ahụ bụrụ nke ebumpụta ụwa; e debere akara nkọwa [a] ozugbo n’ebe nhọrọ okwu παρέλαβεν metụtara.
