source:
  edition: SBLGNT
  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: ig
  text: Solomọn mụrụ Rehoboam, Rehoboam mụrụ Abịja, Abịja mụrụ Asaf[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ “Asa,” nke kwekọrọ n’aha eze Juda a kpọrọ na 1 Ndị Eze 15 na 2 Ihe E Mere 14–16; ma ederede Grik a na-agụ “Asaf.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: mụrụ
  rationale: N’usoro ọmụmụ, okwu a na-egosi na nwoke ghọrọ nna onye na-esote ya. “Mụrụ” bụ okwu Igbo dị nkenke ma kwekọọ n’usoro a; a na-aghọta ya ebe a dị ka ịmụ nwa n’akụkụ nna.
- source_word: δὲ
  choice: njikọ site n’usoro ahịrịokwu na akara rikoma
  rationale: N’ebe a δέ abụghị okwu mmegide; ọ bụ njikọ dị nro na-aga n’ihu n’usoro ọmụmụ. Igbo na-egosipụta nke a nke ọma site n’ịga n’ihu n’usoro ahịrịokwu, na-enweghị ịsụgharị ya ugboro ọ bụla.
- source_word: Σολομών
  choice: Solomọn
  rationale: Ụdị aha a na-ejikarị eme ihe n’Igbo.
- source_word: Ῥοβοάμ
  choice: Rehoboam
  rationale: Nsụgharị mkpụrụokwu aha ahụ n’ụdị a pụrụ ịmata nke ọma n’Igbo.
- source_word: Ἀβιά
  choice: Abịja
  rationale: Ụdị aha eze ahụ nke na-eme ka njikọ ya na Agba Ochie doo anya nye ndị na-agụ Igbo.
- source_word: Ἀσάφ
  choice: Asaf
  rationale: Ederede Grik e nyere nwere Ἀσάφ; ya mere, a debere Asaf n’ahịrị isi kama ime ka ọ kwekọọ nwayọọ nwayọọ na Asa.
theological_decisions:
- issue: Ma a ga-eme ka aha dị n’usoro ọmụmụ Matiu kwekọọ na aha eze Juda dị n’Agba Ochie site n’ịsụgharị Ἀσάφ dịka “Asa”
  choice: Debe “Asaf” n’ahịrị isi
  alternative: “Asa”
  rationale: SBLGNT e nyere na-agụ Ἀσάφ. Ịkwanyere isi mmalite Grik ugwu chọrọ ka a ghara ịgbanwe ya n’enweghị nkọwa; ọdịiche “Asa” dị n’ụfọdụ ihe odide ka e gosiri n’ala peeji.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. A họọrọ “mụrụ” maka usoro ọmụmụ n’ihi na ọ bụ okwu nkịtị ma dị nkenke; ihe gbara ya gburugburu na-egosi na nna bụ isiokwu. Akara ala peeji [a] dị ozugbo n’azụ “Asaf,” aha ọdịiche ahụ metụtara.
