id: MAT.1.18
reference: Matthew 1:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: ig
  text: 'Ọmụmụ Jizọs, onye bụ Mesaịa, siri otu a mee: Mgbe e kwere Meri, nne ya, na Josef nkwa ịlụ di na nwunye[b], tupu ha ebikọ ọnụ[c], a chọpụtara na ọ dị ime site na Mmụọ Nsọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Nkwa ịlụ di na nwunye” n’ebe a bụ nkwekọrịta alụmdi na nwunye iwu na omenala kwadoro; ọ siri ike karịa ihe a na-akpọ nkwa ọlụlụ n’oge a.
    reason: cultural_note
  - marker: c
    text: “Tupu ha ebikọ ọnụ” nwere ike ịpụta tupu ha amalite ibikọ dị ka di na nwunye, ma n’ọnọdụ a ọ nwekwara ike ịgụnye tupu ha emezue alụmdi na nwunye ha site na mmekọahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: ọmụmụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ọmụmụ Jizọs na akụkọ otu o siri mee; “ọmụmụ” bụ okwu Igbo doro anya ma kwekọọ n’ihe akụkọ na-esochi na-akọ.
- source_word: Ἰησοῦ χριστοῦ
  choice: Jizọs, bụ́ Mesaịa
  rationale: Χριστός na-arụ ọrụ dị ka aha ọkwá pụtara onye Chineke tere mmanụ, ọ bụghị naanị dị ka aha nke abụọ; “bụ́ Mesaịa” na-eme ka nke a doo anya n’Igbo.
- source_word: οὕτως ἦν
  choice: siri otu a mee
  rationale: Nkebiokwu Igbo a na-ewebata ụzọ ihe ahụ si mee n’asụsụ dị ugbu a ma na-asọ asọ.
- source_word: μνηστευθείσης
  choice: e kwere ... nkwa ịlụ di na nwunye
  rationale: Nke a na-egosi nkwekọrịta alụmdi na nwunye e mere n’ụzọ iwu na omenala kwadoro, ma zere ime ka ọ dị ka nkwa ndị enyi na-ekwe n’oge a.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: tupu ha abịakọta ọnụ
  rationale: A hapụrụ okwu ahụ n’ụdị nkwanye ùgwù nke nwere ike ịgụnye ibikọ dị ka di na nwunye na imezu alụmdi na nwunye, na-enweghị ịkọwa ya karịa Grik.
- source_word: εὑρέθη
  choice: a chọpụtara
  rationale: Nke a na-edobe echiche passive nke Grik n’ụdị Igbo a na-asụkarị, n’etinyeghị onye mere nchọpụta ahụ.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: ọ dị ime
  rationale: Nke a bụ ụzọ Igbo eke na nke ugbu a si ekwu na nwanyị bu ime.
- source_word: ἐκ πνεύματος ἁγίου
  choice: site na Mmụọ Nsọ
  rationale: “Site na” na-egosi isi mmalite dịka ἐκ si eme; “Mmụọ Nsọ” na-ezo aka n’Mmụọ Chineke n’akụkọ a.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a Χριστός bụ aha ọkwá. “Mesaịa” na-echekwa ihe ọ pụtara dị ka onye e tere mmanụ, ebe “Kraịst” nwekwara ike ịdị ka aha nkịtị n’uche onye na-agụ ya.
- issue: Onye πνεύματος ἁγίου na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ dị nsọ
  rationale: N’ime akụkọ ọmụmụ Matiu, nkebiokwu a na-ezo aka n’Mmụọ Chineke; enweghị article na Grik anaghị eme ka ọ bụrụ mmụọ ọ bụla a na-amaghị.
- issue: Ihe συνελθεῖν pụtara n’ebe a
  choice: abịakọta ọnụ
  alternative: malite ibikọ ọnụ / nwee mmekọahụ dị ka di na nwunye
  rationale: Okwu Grik ahụ nwere nkwanye ùgwù ma nwee ike ịgụnye njikọ alụmdi na nwunye na mmezu ya. Nsụgharị ahụ na ihe odide ala peeji na-echekwa obosara a kama idozi ya n’otu nkọwa naanị.
translation_notes:
  register: E ji Standard Igbo nke dị ùgwù ma dị mfe nghọta mee ihe. “Siri otu a mee” na “ọ dị ime” bụ okwu ndị mmadụ na-asụ ugbu a; e debere “abịakọta ọnụ” dị ka okwu nkwanye ùgwù iji ghara ịkọwa συνελθεῖν karịa ka isi mmalite si kwuo. Akara [a], [b], na [c] niile pụtara n’ederede n’ebe ha kwesịrị ịdị.
