revisions:
- from: 'Ọmụmụ Jizọs, bụ́ Mesaịa[a], siri otu a mee: Mgbe e kwere Meri nne ya na Josef nkwa ịlụ di na nwunye[b], tupu ha abịakọta ọnụ[c], a chọpụtara na ọ dị ime site na Mmụọ Nsọ.'
  to: 'Ọmụmụ Jizọs, onye bụ Mesaịa, siri otu a mee: Mgbe e kwere Meri, nne ya, na Josef nkwa ịlụ di na nwunye[b], tupu ha ebikọ ọnụ[c], a chọpụtara na ọ dị ime site na Mmụọ Nsọ.'
  rationale: The revision replaces a non-idiomatic expression for marital union with the natural, modest “ebikọ ọnụ,” clarifies Mary’s apposition, and uses a fuller title construction for Jesus the Messiah. The revised text must omit marker [a], since its alternative-title footnote has no specific anchor in the verse; the remaining [b] and [c] anchors correspond directly to the expressions they explain. The [a] footnote is retained in the footnote set for title-rendering documentation, but it should be anchored to “Mesaịa” if the publishing system requires every footnote marker to appear in the text.
