  source_fidelity: 'The translation retains all three instances of ἐγέννησεν, keeps Salmon/Boaz/Obed as the successive male subjects, and explicitly preserves the two maternal qualifications marked by ἐκ: Rahab and Rut. The sequential force of δέ is naturally represented by “wee” in the continuing clauses. The textual variation indicated by the SBLGNT brackets concerns placement/repetition around Boaz and does not require a different Igbo rendering.'
  naturalness: “Mụrụ” is a natural, concise genealogical verb in Standard Igbo, and “site na” clearly retains the maternal connection without making the mothers co-subjects of the begetting verb. The semicolon-separated genealogy reads smoothly in a dignified modern register.
  terminology: The names Boaz, Obed, Rut, and Jesi appropriately maintain recognizable Old Testament continuity. “Salmon” and “Rahab” also conform to the translation’s established naming choices. No theological terminology is added or imposed.
