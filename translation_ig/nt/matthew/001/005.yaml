id: MAT.1.5
reference: Matthew 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: ig
  text: Salmon mụrụ Boaz site na Rahab[a]; Boaz wee mụọ Obed site na Rut; Obed wee mụọ Jesi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “si na Rahab,” nakwa “si na Rut.” Asụsụ Grik ji ἐκ mee ihe n’aha nne nke ọ bụla.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: mụrụ
  rationale: N’usoro ọmụmụ Igbo, “mụrụ” bụ ụzọ dị nkenke ma dịkwa eke isi kwuo na nwoke bụ nna onye a kpọrọ aha; ọ na-echekwa usoro ndị nna n’ezinụlọ n’enweghị okwu ochie ma ọ bụ nke siri ike.
- source_word: ἐκ
  choice: site na
  rationale: “Site na” na-egosi na Rahab na Rut bụ ndị nne ụmụ ahụ si n’aka ha pụta, dịka ἐκ + genitive si mee n’asụsụ Grik, ma ghara iwepụ aha ndị inyom ahụ n’usoro ọmụmụ.
- source_word: δὲ
  choice: wee
  rationale: N’ebe a δέ abụghị okwu mmegide; ọ na-ejikọta nzọụkwụ ndị na-esochi ibe ha n’usoro ọmụmụ. “Wee” na-eme ka usoro ahụ gaa were were n’Igbo.
- source_word: Σαλμὼν
  choice: Salmon
  rationale: E dere aha ahụ n’ụdị a na-amata n’ọdịnala aha Bible Igbo.
- source_word: Βόες
  choice: Boaz
  rationale: “Boaz” na-eme ka onye a bụrụ otu onye ahụ a maara n’Agba Ochie, kama iji ntụgharị mkpụrụokwu Grik nke nwere ike ime ka njikọ ahụ ghara ịpụta ìhè.
- source_word: Ῥαχάβ
  choice: Rahab
  rationale: Ụdị aha a na-echekwa njikọ ya na Rahab nke Agba Ochie.
- source_word: Ἰωβὴδ
  choice: Obed
  rationale: A họọrọ ụdị aha Agba Ochie a maara nke ọma iji chekwaa njikọ dị n’etiti Agba Ochie na Agba Ọhụrụ.
- source_word: Ῥούθ
  choice: Rut
  rationale: “Rut” bụ ntụgharị aha dị mfe ma kwekọọ n’usoro ụda na mkpope Igbo.
- source_word: Ἰεσσαί
  choice: Jesi
  rationale: “Jesi” bụ ụdị aha a na-amata n’Igbo ma na-ejikọta onye a na nna Devid n’Agba Ochie.
theological_decisions:
- issue: Usoro ọmụmụ na ịkpọ ndị nne aha
  choice: E debere usoro nna site n’iji “mụrụ,” ma kpọọ Rahab na Rut aha n’ụzọ doro anya site n’iji “site na.”
  alternative: A pụrụ ikwu, “Salmon na Rahab mụrụ Boaz,” na “Boaz na Rut mụrụ Obed,” ma nke ahụ ga-eme ka nna na nne bụrụ otu isiokwu ma gbanwee usoro ahịrịokwu Grik.
  rationale: Ihe odide Grik na-eme ka nwoke nọgide bụrụ isiokwu nke ἐγέννησεν, ma ọ na-etinyekwa nne ọ bụla n’ụzọ pụrụ iche site na ἐκ. Nsụgharị ahụ na-echekwa akụkụ abụọ ahụ n’enweghị ịgbakwunye nkọwa okpukpe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. Akara semicolon na-ekewa nzọụkwụ atọ nke usoro ọmụmụ nke ọma, ebe “wee” na-egosi njikọ dị nro nke δέ.
