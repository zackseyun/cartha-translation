review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the attention call, the virginal sense of παρθένος, the future birth of a son, the indefinite plural “they will call,” the name Immanuel, and its supplied interpretation. However, “ga-atụrụ ime” improperly combines the future marker with a completed/perfect verb form; “ga-atụ ime” is the normal future form and more accurately conveys “will conceive.”
  naturalness: The register is clear, modern Standard Igbo with an appropriately elevated scriptural tone. “Lee,” “ha ga-akpọ aha ya,” and “Chineke nọnyeere anyị” are natural. Correcting the verbal form improves idiomatic grammar without changing the sense.
  terminology: “nwa agbọghọ na-amaghị nwoke” appropriately renders παρθένος in Matthew’s immediate context while the footnote preserves “nwa agbọghọ” as the lexical alternative. “Immanuel” and the explanatory rendering “Chineke nọnyeere anyị” are suitable and do not add doctrinal interpretation.
  issues:
  - severity: medium
    issue: Future construction in “ga-atụrụ ime”
    rationale: Atụrụ ime is a completed/perfect form (“has conceived/is pregnant” in an appropriate context). With the future auxiliary ga-, the expected Standard Igbo form is “ga-atụ ime” (“will conceive”). The existing combination is grammatically unnatural.
  revised_text: “Lee, nwa agbọghọ na-amaghị nwoke[a] ga-atụ ime, mụọ nwa nwoke; ha[b] ga-akpọ aha ya Immanuel[c]”—nke a sụgharịrị bụ, “Chineke nọnyeere anyị.”
