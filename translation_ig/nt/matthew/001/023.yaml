id: MAT.1.23
reference: Matthew 1:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: ig
  text: “Lee, nwa agbọghọ na-amaghị nwoke[a] ga-atụ ime, mụọ nwa nwoke; ha[b] ga-akpọ aha ya Immanuel[c]”—nke a sụgharịrị bụ, “Chineke nọnyeere anyị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “nwa agbọghọ.” Ma n’ọnọdụ Matiu ebe a, okwu Grik παρθένος na akụkọ ọmụmụ gbara ya gburugburu na-akwado “nwa agbọghọ na-amaghị nwoke.”
    reason: lexical_alternative
  - marker: b
    text: Grik kwuru kpọmkwem “ha ga-akpọ”; ọ bụ okwu ọtụtụ nke a na-akọwaghị ndị ọ na-ekwu banyere ha.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ide aha a “Emmanuel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu e ji adọta uche onye na-agụ ihe, ma dabara n’ụdị okwu amụma dị elu n’enweghị ime ka asụsụ sie ike.
- source_word: ἡ παρθένος
  choice: nwa agbọghọ na-amaghị nwoke
  rationale: N’okwu Grik Matiu na n’akụkọ ọmụmụ gbara amaokwu a gburugburu, παρθένος na-egosi nwa agbọghọ na-enwebeghị mmekọahụ; nsụgharị a na-eme ka ihe ahụ doo anya n’Igbo.
- source_word: ἐν γαστρὶ ἕξει
  choice: ga-atụrụ ime
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu Grik ahụ pụtara n'ụzọ nkịtị, ‘ga-enwe n’akpa nwa,’ ma ọ na-edobe ọdịnihu nke ngwaa ahụ.
- source_word: τέξεται υἱόν
  choice: mụọkwa nwa nwoke
  rationale: Ọ bụ okwu Igbo doro anya ma bụrụkwa nke e ji ekwu ịmụ nwa nwoke.
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: ha ga-akpọ aha ya
  rationale: E debeere ngwaa ahụ n’ụdị onye nke atọ n’ọnụọgụ ọtụtụ dịka Grik si dị, n’agbanyeghị na a kpọghị kpọmkwem ndị ‘ha’ bụ.
- source_word: Ἐμμανουήλ
  choice: Immanuel
  rationale: Nke a bụ idegharị aha Grik ahụ n’ụdị mkpụrụedemede Igbo; nkọwa aha ahụ nke sochiri ya na-eme ka ihe ọ pụtara doo anya.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: nke a sụgharịrị bụ
  rationale: Ọ na-egosipụta n'ụzọ dị mfe na nke dị ugbu a na Matiu na-enye nkọwa aha ahụ mgbe a sụgharịrị ya.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: Chineke nọnyeere anyị
  rationale: Ọ bụ Igbo ebumpụta ụwa nke na-edobe ihe aha ahụ pụtara n’enweghị itinye nkọwa nkà mmụta okpukpe ọzọ.
theological_decisions:
- issue: Ihe παρθένος pụtara n’akụkọ banyere ịtụrụ ime Jizọs
  choice: nwa agbọghọ na-amaghị nwoke
  alternative: nwa agbọghọ
  rationale: N’ọnọdụ Matiu 1, okwu Grik ahụ na akụkọ gbara ya gburugburu na-egosi n’ụzọ siri ike na nwa agbọghọ ahụ enwebeghị mmekọahụ. E tinyere okwu ọzọ kwe omume n’ala peeji iji ghara izochi mkparịta ụka gbasara okwu ahụ n’Aịzaya 7:14.
- issue: Ike nkọwa aha Immanuel
  choice: Chineke nọnyeere anyị
  alternative: Chineke dịnyere anyị
  rationale: A hapụrụ nkọwa aha ahụ n’ụdị dị mkpirikpi dịka amaokwu ahụ si nye ya, n’etinyeghị nkọwa sara mbara banyere mmadụ-ịghọ-anụahụ nke amaokwu ahụ ekwughị kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke nwere ugwu ma dị mfe nghọta. “Lee” na-edobe ụda amụma nke nhota ahụ; “nwa agbọghọ na-amaghị nwoke” na-eme ka παρθένος doo anya nye onye Igbo nkịtị. E debeere ahịrịokwu Grik nke na-ekwu “ha ga-akpọ” kama ịgbanwe ya ka ọ bụrụ okwu nnara.
