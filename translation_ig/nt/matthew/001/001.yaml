id: MAT.1.1
reference: Matthew 1:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Βίβλος γενέσεως Ἰησοῦ χριστοῦ υἱοῦ Δαυὶδ υἱοῦ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/001.yaml
  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: ig
  text: Akwụkwọ usoro ọmụmụ Jizọs, bụ́ Mesaya[a], nwa Devid[b], nwa Ebreham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Akwụkwọ mmalite” ma ọ bụ “Akwụkwọ ọmụmụ.” Okwu Grik ahụ nwere ike ịgụnye nghọta sara mbara nke “mmalite,” ọ bụ ezie na “usoro ọmụmụ” kacha daba na ndepụta agbụrụ na-esochi.
    reason: alternative_reading
  - marker: b
    text: N’ebe a, “nwa” pụtara onye sitere n’agbụrụ Devid; otú ahụkwa ka “nwa Ebreham” dị.
    reason: clarification
lexical_decisions:
- source_word: Βίβλος
  choice: Akwụkwọ
  rationale: Βίβλος pụtara akwụkwọ ma ọ bụ ihe e dere ede; n’ebe a ọ na-arụ ọrụ dị ka isiokwu mmeghe.
- source_word: γενέσεως
  choice: usoro ọmụmụ
  rationale: γένεσις nwere ike ịpụta mmalite, ọmụmụ, ma ọ bụ usoro ọmụmụ; ebe ọ bụ na ndepụta ndị nna ochie na-esochi, “usoro ọmụmụ” kacha daba n’ebe a, ebe a na-edebe nghọta ndị ọzọ na nkọwa ala peeji.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: E ji ụdị aha a nabatara n’Igbo dee aha Grik ahụ.
- source_word: χριστοῦ
  choice: bụ́ Mesaya
  rationale: Χριστός bụ aha ọkwa nke pụtara Onye E Tere Mmanụ; “bụ́ Mesaya” na-egosi na ọ bụ aha ọkwa, ọ bụghị aha ezinụlọ.
- source_word: υἱοῦ Δαυὶδ
  choice: nwa Devid
  rationale: “Nwa” na-edobe akpaalaokwu usoro ọmụmụ na ike nke aha eze na Mesaya ahụ, ọ bụ ezie na n’ebe a ọ pụtara onye sitere n’agbụrụ Devid.
- source_word: υἱοῦ Ἀβραάμ
  choice: nwa Ebraham
  rationale: “Nwa” na-edobe okwu isi mmalite ahụ na njikọ ọgbụgba ndụ ya, ebe ihe ọ pụtara n’ọnọdụ a bụ onye sitere n’agbụrụ Ebraham.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: N’amaokwu a, okwu ahụ bụ aha ọkwa nke na-akọwa Jizọs dị ka Onye E Tere Mmanụ ahụ; “Mesaya” na-eme ka ọnọdụ ndị Juu na atụmanya eze ahụ doo anya.
- issue: Ihe γενέσεως pụtara n’isiokwu a
  choice: usoro ọmụmụ
  alternative: mmalite ma ọ bụ ọmụmụ
  rationale: Ndepụta agbụrụ na-esochi na-akwado “usoro ọmụmụ,” ma okwu Grik ahụ nwekwara nghọta sara mbara banyere mmalite ma ọ bụ ọmụmụ; e debere nghọta ahụ na nkọwa ala peeji.
translation_notes:
  register: Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E debere akpaalaokwu Akwụkwọ Nsọ “nwa Devid” na “nwa Ebraham,” ebe “bụ́ Mesaya” na-egosi n’ụzọ ebumpụta ụwa na Mesaya bụ aha ọkwa.
