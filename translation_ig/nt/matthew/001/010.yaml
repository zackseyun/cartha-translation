id: MAT.1.10
reference: Matthew 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: ig
  text: Hezekaịa mụrụ Manase[a], Manase mụrụ Emọs, Emọs mụrụ Josaịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ nsụgharị na-agụ “Emon” n’ebe a, na-eme ka aha ahụ kwekọọ n’aha eze Juda dị na 2 Ndị Eze 21; ma ihe odide Grik nke Matiu na-agụ “Emọs.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: mụrụ
  rationale: N’usoro ọmụmụ, okwu a na-egosi na nwoke bụ nna onye a kpọrọ aha. “Mụrụ” bụ ụzọ dị mkpirikpi, nke e ji asụ Igbo ugbu a, isi kwuo mmekọrịta nna na nwa n’usoro a.
- source_word: Ἑζεκίας
  choice: Hezekaịa
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị dabara n’olu na mkpopụta Igbo ma na-egosipụta aha Grik ahụ.
- source_word: Μανασσῆς
  choice: Manase
  rationale: E dere aha mmadụ a n’ụdị a na-agụ nke ọma n’Igbo.
- source_word: Ἀμώς
  choice: Emọs
  rationale: Ihe odide SBLGNT gụrụ Ἀμώς, ya mere isiokwu soro aha ahụ kpọmkwem kama ime ka ọ daba n’aha Emon nke dị n’akwụkwọ Ndị Eze.
- source_word: Ἰωσίας
  choice: Josaịa
  rationale: E dere aha mmadụ a n’ụdị dabara n’olu Igbo ma na-anọgide nso n’ụdị Grik.
- source_word: δέ
  choice: akara rikoma; “amụọ” n’ahịrị ikpeazụ
  rationale: N’usoro ọmụmụ a, δέ bụ njikọ na-aga n’ihu. Rikoma na njikọ ụdaolu dị n’“amụọ” na-eme ka Igbo na-aga were were n’enweghị ikwughachi “ma” ugboro niile.
theological_decisions:
- issue: Ọdịiche dị n’etiti aha dị n’ihe odide Grik Matiu na aha eze Juda dị n’Agba Ochie
  choice: Ide “Emọs” n’isiokwu dịka Ἀμώς dị n’ihe odide Grik
  alternative: Ide “Emon” iji mee ka aha ahụ kwekọọ na eze a kpọrọ aha na 2 Ndị Eze 21
  rationale: A na-ebute ihe odide asụsụ mbụ ụzọ, ya mere e kwesịghị ịgbanwe Ἀμώς nwayọọ ka ọ bụrụ Emon. Ihe ọzọ a na-agụ ka edobere n’okpuru peeji ka esemokwu dị n’ihe odide ghara izo ezo.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji usoro dị mkpirikpi nke ndepụta ọmụmụ mee ihe; e zere okwu ochie ma ọ bụ okwu ụka pụrụ iche.
