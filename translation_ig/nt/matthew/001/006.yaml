  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: ig
  text: Jesi bụ nna Devid, bú eze. Devid bụ nna Solomọn site na nwunye Uraya[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ihe e dere n’ụzọ nkịtị bụ, “site na [nwanyị] Uraya.” Ọ bụ okwu a hapụrụ akụkụ ya, nke pụtara “site na nwunye Uraya.” Matiu akpọghị Bat-Sheba aha n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰεσσαὶ
  choice: Jesi
  rationale: Ọ bụ nsụgharị aha Ἰεσσαί n’ụdị a na-amakarị n’Igbo.
- source_word: ἐγέννησεν
  choice: mụrụ
  rationale: N’usoro ọmụmụ, okwu a na-egosi na nwoke ahụ ghọrọ nna nwa ahụ; “mụrụ” bụ ụzọ dị mkpirikpi ma bụrụkwa nke a na-aghọta nke ọma n’Igbo.
- source_word: Δαυὶδ τὸν βασιλέα
  choice: Devid, bú eze
  rationale: “Bú eze” na-edobe nkọwa a kapịrị ọnụ nke na-akọwapụta Devid dị ka eze ahụ.
- source_word: Σολομῶνα
  choice: Solomọn
  rationale: Ọ bụ nsụgharị aha Σολομών n’ụdị Igbo a na-amakarị.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: site n’aka nwunye Uraya
  rationale: Ọ na-eme ka okwu Grik ahụ e tinyere okwu ya n’ime ya doo anya n’Igbo, ma ọ naghị etinye aha Bat-Sheba nke Matiu na-ekwughị.
- source_word: δὲ
  choice: —
  rationale: Ọ bụ njikọ dị nro n’usoro ọmụmụ; ikewapụ ahịrịokwu abụọ ahụ na-eme ka usoro ahụ doo anya n’Igbo na-enweghị ịsụgharị ya kpọmkwem.
theological_decisions:
- issue: Matiu kpọrọ Bat-Sheba aha n’ụzọ na-apụtachaghị ìhè
  choice: nwunye Uraya
  alternative: Bat-Sheba; nwanyị ahụ bụbu nwunye Uraya
  rationale: E debere ụzọ Grik si jikọta nwanyị ahụ na Uraya, n’ihi na nke a na-echekwa ụda akụkọ na nke omume sitere n’ihe mere n’Akwụkwọ Samuel nke Abụọ, kama iji aha Bat-Sheba dochie ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro ọmụmụ ahụ nkenke, a hapụkwara ụzọ Matiu si zoo aha Bat-Sheba ka ọ dị na isi mmalite.
