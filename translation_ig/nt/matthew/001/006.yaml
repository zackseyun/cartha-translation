- from: Jesi mụrụ Devid, bú eze. Devid mụrụ Solomọn site n’aka nwunye Uraya[a],
  to: Jesi bụ nna Devid, bú eze. Devid bụ nna Solomọn site na nwunye Uraya[a],
  rationale: The revision replaces a maternally marked verb with the unambiguous genealogical expression “bụ nna” and corrects the relational phrase for ἐκ. It retains the source’s concise genealogy, David’s royal designation, and its indirect reference to Uriah’s wife without supplying Bathsheba’s name.
  reviewer_model: gpt-5.6-terra
