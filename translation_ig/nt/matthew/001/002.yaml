id: MAT.1.2
reference: Matthew 1:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: ig
  text: Abraham mụrụ Aịzik[a]; Aịzik mụrụ Jekọb; Jekọb mụrụ Juda na ụmụnne ya ndị nwoke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Abraham ghọrọ nna Aịzik.” N’usoro ọmụmụ, okwu Grik a na-ekwu banyere ịbụ nna.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: mụrụ
  rationale: N'usoro ọmụmụ, γεννάω na-ekwu na nwoke mụtara onye nọchiri ya n'agbụrụ. “Mụrụ” bụ okwu Igbo doro anya ma kwekọọ n'usoro a; ọ naghị ekpebi ma njikọ agbụrụ ahụ ọ̀ bụ nke nna na nwa ozugbo ma ọ bụ nke gafere ọgbọ ụfọdụ.
- source_word: δὲ
  choice: ; … amụọ
  rationale: N'ebe a δέ bụ njikọ dị nro nke na-aga n'ihu n'usoro ahụ, ọ bụghị okwu na-egosi nnukwu mmegide. Nkebi ahịrị na semikolon na usoro ngwaa na-eme ka Igbo na-aga nke ọma n'enweghị ịtinye “ma” nke nwere ike ịdị ka mmegide.
- source_word: Ἰούδαν
  choice: Juda
  rationale: Ọ bụ Juda nna ochie, nwa Jekọb; “Juda” bụ aha a na-ejikarị amata ya n'Igbo.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: ụmụnne ya ndị nwoke
  rationale: ἀδελφοί ebe a na-ezo aka kpọmkwem n'ụmụ nwoke ndị ọzọ Jekọb mụrụ. “Ụmụnne ya ndị nwoke” na-ewepụ mgbagwoju anya nke “ụmụnne” naanị nwere ike ịgụnye nwoke na nwaanyị.
- source_word: Ἀβραάμ / Ἰσαάκ / Ἰακώβ
  choice: Abraham / Aịzik / Jekọb
  rationale: E ji ụdị aha ndị a a maara nke ọma n'Igbo mee ihe, kama ịsụgharị ihe aha ndị ahụ pụtara.
theological_decisions:
- issue: Nsụgharị ngwaa e ji akọ usoro ọmụmụ
  choice: Jiri “mụrụ” n'usoro ọmụmụ a
  alternative: Jiri nkọwa sara mbara dịka “ghọrọ nna nke” ma ọ bụ “bụ nna nna nke”
  rationale: “Mụrụ” na-echekwa ike okwu nke usoro ọmụmụ sitere n'akụkụ nna ma bụrụ Igbo nkịtị, dị ùgwù. Ọ naghị agbakwụnye nkwupụta banyere ma usoro ahụ ọ̀ gụnyere naanị nna na nwa ozugbo ma ọ bụ ma ọ gafere ọgbọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù, dee ya. E ji semikolon kee usoro aha ndị ahụ ka mmegharị ugboro ugboro ghara ịdị arọ. “Amụọ” bụ mgbanwe ụda nke “mụrụ” mgbe ọ na-esochi aha n'usoro ahịrịokwu, ma ihe ọ pụtara ka bụ otu.
