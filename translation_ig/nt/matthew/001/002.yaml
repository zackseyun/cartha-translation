  source_fidelity: The names, the paternal genealogical verb, and the reference to Judah's male brothers are conveyed accurately. However, the aorist ἐγέννησεν occurs in all three clauses, whereas “amụọ” is not the appropriate completed-past form in this sequence and can suggest a non-past/subjunctive sense.
