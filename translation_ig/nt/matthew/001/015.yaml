  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: ig
  text: Eliud mụrụ Eleaza, Eleaza mụrụ Matan, Matan mụkwara Jekọb.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: Eliud
  rationale: E depụtaghachiri aha Grik ahụ n’ụdị dabara n’usoro mkpọpụta na ide aha n’Igbo.
- source_word: δὲ
  choice: (nke abụọ anaghị atụgharị iche; nke ikpeazụ bụ “-kwara”)
  rationale: N’usoro ọmụmụ a, δέ bụ njikọ dị nro nke na-aga n’ihu ndepụta ahụ. Ịhapụ ya n’ahịrị abụọ mbụ ma jiri “-kwara” na nke ikpeazụ na-eme ka Igbo bụrụ nke eke ma ka na-egosi njikọ nke usoro ahụ.
- source_word: ἐγέννησεν
  choice: mụrụ
  rationale: N’usoro ọmụmụ, “mụrụ” bụ okwu Igbo dị nkenke ma doo anya nke na-egosi na nwoke ahụ ghọrọ nna onye a kpọrọ aha, n’enweghị asụsụ ochie ma ọ bụ nkọwa agbakwunyere.
- source_word: τὸν
  choice: (atụgharịghị ya iche)
  rationale: Ọ bụ akara grama Grik n’ihu aha onye e mere ihe n’ahịrịokwu; Igbo anaghị achọ mkpụrụokwu ọzọ n’ebe a.
- source_word: Ἐλεάζαρ
  choice: Elieza
  rationale: A họọrọ ụdị aha a nke na-agbaso mkpọpụta Grik ma dị mfe ịgụ n’Igbo.
- source_word: Ματθάν
  choice: Matan
  rationale: A depụtaghachiri aha ahụ dịka “Matan,” nke na-egosipụta ụda Grik Ματθάν n’usoro ide Igbo.
- source_word: Ἰακώβ
  choice: Jekọb
  rationale: “Jekọb” bụ ụdị aha a maara nke ọma n’Igbo ma na-anọchi anya aha Grik Ἰακώβ.
theological_decisions:
- issue: Ma ἐγέννησεν ga-egosi naanị ịbụ nna ozugbo ka ọ bụ usoro nna nna sara mbara
  choice: Jiri “mụrụ” n’enweghị nkọwa ọzọ.
  alternative: “bụ nna nna nke” ma ọ bụ “sitere n’usoro ọmụmụ ya mụta”
  rationale: Okwu ahụ n’usoro ọmụmụ nwere ike ịrụ ọrụ n’usoro nna nna, ma amaokwu a n’onwe ya anaghị akọwapụta ma ọgbọ ọ bụla bụ nke ozugbo. “Mụrụ” na-edobe usoro okwu ahụ nkenke ma ghara idozi ihe ederede na-akọwaghị.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E debere ụdị ndepụta aha atọ nke isi mmalite ahụ, jiri “mụkwara” mechie ya n’ụzọ na-ada eke n’Igbo.
