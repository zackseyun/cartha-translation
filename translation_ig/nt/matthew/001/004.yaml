id: MAT.1.4
reference: Matthew 1:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: ig
  text: Aram mụrụ Aminadab[a], Aminadab mụrụ Nahshọn, Nahshọn mụrụ Salmon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ram.” Ihe odide Grik kwuru Aram (Ἀράμ), ebe ụdị aha Hibru a na-ahụ n'usoro ọmụmụ bụ “Ram.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρὰμ
  choice: Aram
  rationale: E depụtara aha ahụ dịka ọ dị n'ụdị Grik Ἀράμ; a debere ụdị aha Hibru a na-ahụkarị, bụ ‘Ram,’ n'okpuru peeji.
- source_word: δὲ
  choice: (ejighị okwu pụrụ iche sụgharịa ya)
  rationale: N'usoro ọmụmụ a, δέ na-aga n'ihu na njikọ nke aha ndị ahụ, ọ bụghị igosi ọdịiche siri ike. Njikọ na nkwughachi e ji hazie ahịrịokwu Igbo na-eme ka usoro ahụ doo anya n'ụzọ ebumpụta ụwa.
- source_word: ἐγέννησεν
  choice: mụrụ
  rationale: N'usoro ọmụmụ, γεννάω na-egosi na nwoke ghọrọ nna ma ọ bụ nna nna onye ọzọ. ‘Mụrụ’ bụ okwu Igbo dị nkenke ma doo anya, ma ọ naghị amanye mkpebi na ọ bụ naanị nna kpọmkwem n'ọgbọ na-esote.
- source_word: Ἀμιναδάβ
  choice: Aminadab
  rationale: Ndepụta mkpụrụokwu Igbo na-anọchi anya ụda aha Grik nke ọma, n'enweghị mm abụọ na-adịghị mkpa n'usoro odide Igbo.
- source_word: Ναασσών
  choice: Nahshọn
  rationale: A họọrọ ụdị aha a maara n'usoro Akwụkwọ Nsọ, ma jiri ‘ọ’ gosi ụda kwesịrị ekwesị n'Igbo.
- source_word: Σαλμών
  choice: Salmon
  rationale: A sụgharịghị aha mmadụ; e degharịrị ya n'ụdị dị mfe ma bụrụ nke a pụrụ ịmata.
theological_decisions:
- issue: Ma ἐγέννησεν ọ na-egosi naanị nna kpọmkwem ma ọ bụ nwekwara ike igosi nna nna
  choice: Jiri ‘mụrụ,’ nke dabara n'usoro ọmụmụ ma ghara ịgbakwunye nkọwa ọzọ.
  alternative: ‘bụ nna nke’ ma ọ bụ ‘mụpụtara’
  rationale: Okwu Grik nwere ike ịrụ ọrụ n'usoro ọmụmụ ebe ụfọdụ ọgbọ anaghị apụta. Nsụgharị ekwesịghị imechi ohere ahụ ma ọ bụ tinye echiche na-adịghị n'amaokwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jigidere usoro nkwughachi nke amaokwu Grik, ma belata njikọ ndị ga-ada arọ n'Igbo. Akara [a] dị n'akụkụ aha ọ na-akọwa.
