  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: ig
  text: 'Ihe a niile mere ka ihe Onyenwe anyị kwuru site n’ọnụ onye amụma wee mezuo[a]. Onye amụma ahụ kwuru, sị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị mmalite ahịrịokwu a, “Ihe a dum mere.” Okwu Grik ahụ na-emesi ihe niile a kọwara n’elu ike dịka otu ihe zuru ezu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Ihe a niile
  rationale: “Ihe a” na-ezo aka n’ihe ndị a kọwara n’ihu ya dị ka otu ihe zuru ezu, ebe “niile” na-emesi izu oke nke ihe ahụ ike. A naghị atụkwasị okwu pụtara “ugbu a” n’ihi na δέ bụ njikọ akụkọ n’ebe a, ọ bụghị okwu oge.
- source_word: γέγονεν
  choice: mere
  rationale: Okwu a na-egosi na ihe ahụ emezuola n’akụkọ ahụ; “mere” bụ ụzọ Igbo dị mfe ma bụrụkwa nke eke isi kwuo ya.
- source_word: ἵνα πληρωθῇ
  choice: ka ... wee mezuo
  rationale: Usoro “ka ... wee” na-echekwa echiche nke nzube ma ọ bụ nsonaazụ dị n’ἵνα, ebe “mezuo” na-egosipụta mmezu nke okwu e buru n’amụma.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου
  choice: ihe Onyenwe anyị kwuru
  rationale: N’agbanyeghị na Grik ji usoro nnara mee ya (“ihe e kwuru site n’aka Onyenwe anyị”), usoro a bụ Igbo eke ma na-edobe Onyenwe anyị dịka onye okwu ahụ si n’aka ya pụta.
- source_word: διὰ τοῦ προφήτου
  choice: site n’ọnụ onye amụma
  rationale: “Site n’ọnụ” na-egosi na onye amụma bụ onye e ji zie okwu ahụ, ma ọ bụghị isi mmalite ikpeazụ ya.
- source_word: λέγοντος
  choice: 'Onye amụma ahụ kwuru, sị:'
  rationale: A gbanwere participle ahụ ka ọ bụrụ ahịrịokwu Igbo doro anya nke na-ewebata okwu a ga-ehota n’amaokwu na-esote, na-emekwa ka o doo anya na onye amụma bụ onye kwuru ya.
theological_decisions:
- issue: Onye bụ isi mmalite okwu amụma na onye bụ ụzọ e si zie ya
  choice: “ihe Onyenwe anyị kwuru site n’ọnụ onye amụma”
  alternative: “ihe onye amụma kwuru site n’aka Onyenwe anyị”
  rationale: Grik kewapụtara Onyenwe anyị dịka onye okwu ahụ si n’aka ya pụta (ὑπό) na onye amụma dịka onye e si n’aka ya zie ya (διά). Nsụgharị ahụ na-echekwa ọdịiche a n’etinyeghị nkọwa ozizi ọzọ.
- issue: Nzube ma ọ bụ nsonaazụ dị n’usoro mmezu ahụ
  choice: “ka ... wee mezuo”
  alternative: “nke mere ka ... mezuo”
  rationale: ἵνα na subjunctive nwere ike ibu echiche nzube, nsonaazụ, ma ọ bụ ha abụọ. “Ka ... wee mezuo” na-ahapụ esemokwu ahụ ka ọ dị, kama ikpebi ya n’otu ụzọ naanị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Onyenwe anyị” bụ okwu a na-ejikarị asụgharị κύριος n’ọnọdụ a. E kewara okwu ikpeazụ dịka ahịrịokwu dị mkpirikpi iji mee ka onye na-ekwu okwu doo anya ma webata nhota nke amaokwu na-esote n’ụzọ Igbo eke.
