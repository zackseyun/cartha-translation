id: MAT.1.21
reference: Matthew 1:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: ig
  text: Ọ ga-amụ nwa nwoke, ị ga-akpọkwa aha ya Jizọs[a], n’ihi na ọ bụ ya ga-azọpụta ndị ya ná mmehie ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aha Jizọs bụ ụdị Grik nke aha Hibru/Arameik bụ Yeshua; aha a nwere njikọ na aha Joshua, ọ pụtakwara echiche bụ “Yahweh na-azọpụta.” Nkọwa Matiu, “n’ihi na ọ bụ ya ga-azọpụta,” na-egosipụta egwuregwu okwu dị n’aha ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται
  choice: ọ ga-amụ
  rationale: Ngwaa a na-ekwu maka ịmụ nwa n’ọdịnihu; “ọ ga-amụ” bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji ekwu okwu a n’ụzọ nkịtị.
- source_word: δὲ
  choice: —
  rationale: δέ bụ njikọ okwu dị nro. N’Igbo, ahịrịokwu a na-aga nke ọma n’etinyeghị okwu njikọ pụrụ iche, ya mere a hapụrụ ya ka nsụgharị ghara ịdị arọ.
- source_word: υἱὸν
  choice: nwa nwoke
  rationale: Nke a na-egosi hoo haa na nwa ahụ bụ nwoke, dịka υἱός si kwuo.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: ị ga-akpọkwa aha ya
  rationale: Nke a na-edobe usoro okwu ịkpọ aha dị n’asụsụ mmalite, ma bụrụkwa Igbo doro anya. “-kwa” na-ejikọta ihe omume nke abụọ na nke mbụ.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: “Jizọs” bụ odide aha a a na-ejikarị eme ihe n’Igbo maka onye a kpọrọ Ἰησοῦς n’Agba Ọhụrụ.
- source_word: αὐτὸς
  choice: ọ bụ ya
  rationale: 'Usoro Igbo a na-egosipụta nkwusi ike nke αὐτός: nwa ahụ n’onwe ya bụ onye ga-azọpụta.'
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-ebute ihe mere a ga-eji kpọọ ya aha ahụ; “n’ihi na” na-egosipụta nkọwa ihe kpatara ya nke ọma.
- source_word: σώσει
  choice: ga-azọpụta
  rationale: “Ịzọpụta” na-eburu echiche nke ịnapụta ma zọpụta, ma dabara n’okwu banyere mmehie.
- source_word: τὸν λαὸν αὐτοῦ
  choice: ndị ya
  rationale: Nke a bụ Igbo dị nkenke ma dịkwa eke maka “ndị nke ya,” na-edobekwara ókè ndị ahụ n’enweghị ịkọwa ha karịa ihe amaokwu ahụ kwuru.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: ná mmehie ha
  rationale: N’usoro Igbo, “ịzọpụta mmadụ ná...” na-egosi ikewapụ ma ọ bụ ịnapụta ya n’ihe ahụ; ọtụtụ nke “mmehie” ka dị n’echiche okwu ahụ.
theological_decisions:
- issue: Nkwusi ike nke αὐτὸς n’ọrụ nzọpụta Jizọs
  choice: ọ bụ ya ga-azọpụta
  alternative: ọ ga-azọpụta
  rationale: “Ọ bụ ya” na-echekwa nkwusi ike dị na Grik na Jizọs n’onwe ya bụ onye na-arụ ọrụ nzọpụta, n’etinyeghị nkọwa ozizi ọzọ.
- issue: Ókè ndị okwu “ndị ya” na-ezo aka na ha
  choice: ndị ya
  alternative: ndị Izrel ya; mmadụ niile bụ ndị nke ya
  rationale: Amaokwu ahụ akọwaghị ókè ahụ kpọmkwem. Nsụgharị a anaghị eme ka ọ bụrụ naanị Izrel, ọ naghịkwa agbasapụ ya gaa n’ụwa mmadụ niile, kama ọ na-ahapụ okwu ahụ dịka isi mmalite si hapụ ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A na-edobe usoro ịkpọ aha na nkwusi ike nke isi mmalite, ma a zere okwu ụka otu denominashọn pụrụ iche.
