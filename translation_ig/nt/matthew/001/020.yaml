id: MAT.1.20
reference: Matthew 1:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: ig
  text: Ma mgbe ọ nọ na-atụgharị uche banyere ihe ndị a, lee, otu mmụọ ozi nke Onyenwe anyị pụtara ya ná nrọ, sị, “Josef, nwa Devid, atụla egwu ịkpọrọ Meri nwunye gị,[a] n’ihi na ihe a tụụrụ ime n’ime ya sitere na Mmụọ Nsọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịkpọrọ Meri dịka nwunye gị.” Okwu Grik ahụ na-ekwu maka ịnabata ya n’ụlọ gị ka unu biri n’alụmdi na nwunye.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: mgbe ọ nọ na-atụgharị ihe ndị a n’uche ya
  rationale: Nke a na-egosi na Josef ka nọ na-echebara okwu ndị ahụ echiche nke ọma, ọ bụghị na o meela mkpebi ikpeazụ.
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” bụ akara okwu Igbo doro anya nke na-adọta uche ma na-echekwa ịdị ndụ nke nkwụsị akụkọ ahụ.
- source_word: ἄγγελος κυρίου
  choice: otu mmụọ ozi nke Onyenwe anyị
  rationale: “Otu” na-egosipụta na ἄγγελος enweghị artikụl, ma zere ịkọwa ya dị ka mmụọ ozi pụrụ iche a maara ama; κύριος bụ “Onyenwe anyị.”
- source_word: κατ’ ὄναρ ἐφάνη αὐτῷ
  choice: pụtara n’ihu ya ná nrọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ na ngosipụta sitere n’aka Chineke nke mere ná nrọ.
- source_word: υἱὸς Δαυίδ
  choice: nwa Devid
  rationale: Ọ na-echekwa njikọ Josef na agbụrụ Devid na ụda okwu metụtara nkwa e nyere Devid.
- source_word: μὴ φοβηθῇς
  choice: atụla egwu
  rationale: Nke a bụ iwu mgbochi dị nkenke na nke sitere n’okike n’Igbo.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: ịkpọrọ Meri, nwunye gị, laa n’ụlọ gị
  rationale: N’ọnọdụ a παραλαμβάνω na-ekwu maka ịnabata Meri n’ụlọ Josef ka ha biri dị ka di na nwunye; “nwunye gị” na-echekwa nkọwa kpọmkwem nke τὴν γυναῖκά σου n’enweghị ịsị na ọ bụ mgbe ahụ ka ọ ghọrọ nwunye ya.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: ihe a tụụrụ ime n’ime ya
  rationale: Nke a na-echekwa ụdị neuter ahụ bụ “ihe” ma na-enye nghọta doro anya banyere ịtụrụ ime n’afọ.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: sitere na Mmụọ Nsọ
  rationale: “Sitere na” na-egosipụta isi mmalite nke ἐκ, ebe “Mmụọ Nsọ” bụ aha a na-amata nke ọma maka Mmụọ Chineke.
theological_decisions:
- issue: Ihe κύριος na-ezo aka na ya n’okwu ἄγγελος κυρίου
  choice: Onyenwe anyị
  alternative: Yahweh / CHINEKE
  rationale: “Onyenwe anyị” na-asụgharị κύριος n’enweghị ịmanye echiche na mmụọ ozi a bụ ngosipụta pụrụ iche nke Chineke n’onwe ya.
- issue: Ihe πνεύματός ... ἁγίου na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: ike Mmụọ Nsọ; otu mmụọ dị nsọ
  rationale: N’akụkọ mmalite Matiu, okwu a na-ezo aka na Mmụọ Chineke dị nsọ dị ka isi mmalite nke ime ahụ, ọ bụghị naanị ike na-enweghị onye nwe ya ma ọ bụ otu mmụọ a na-akọwaghị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ịtụgharị ihe n’uche” na-egosi ntụgharị uche; “ịkpọrọ ... laa n’ụlọ” na-eme ka ọnọdụ alụmdi na nwunye doo anya n’enweghị ikwu na ọnọdụ Meri gbanwere n’oge ahụ.
