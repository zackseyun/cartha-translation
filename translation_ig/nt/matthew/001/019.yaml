    reason: lexical_alternative
  revision_rationale: The revision removes the added connective “ya mere,” retaining the Greek’s presentation of Joseph’s righteousness and unwillingness to shame Mary as background to his intention. It also clarifies the public-exposure expression while preserving the original legal and ethical ambiguity.
