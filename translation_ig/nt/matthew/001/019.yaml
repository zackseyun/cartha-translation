revisions:
- from: Ma Josef, di ya[a], ebe ọ bụ onye ezi omume, ọ chọghị ikpughe ya ka ihere mee ya n'ihu ọha[b]; ya mere, o kpebiri ịgba ya alụkwaghịm na nzuzo[c].
  to: Ma Josef, di ya[a], ebe ọ bụ onye ezi omume na onye na-achọghị ikpughe ya n'ihu ọha ka ihere mee ya[b], kpebiri ịgba ya alụkwaghịm na nzuzo[c].
  rationale: The revision removes the added connective “ya mere,” retaining the Greek’s presentation of Joseph’s righteousness and unwillingness to shame Mary as background to his intention. It also clarifies the public-exposure expression while preserving the original legal and ethical ambiguity.
