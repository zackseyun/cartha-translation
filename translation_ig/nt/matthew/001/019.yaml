id: MAT.1.19
reference: Matthew 1:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: ig
  text: Ma Josef, di ya[a], ebe ọ bụ onye ezi omume na onye na-achọghị ikpughe ya n'ihu ọha ka ihere mee ya[b], kpebiri ịgba ya alụkwaghịm na nzuzo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye e kwere ya nkwa ịlụ.” Grik kwuru “nwoke ya/di ya,” nke na-egosi na nkwa ọlụlụ ndị Juu nwere ike iwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ime ya ihe atụ” ma ọ bụ “ime ya ihere n'ihu ọha.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ịchụpụ ya na nzuzo.” N'ọnọdụ a, ihe a na-ekwu bụ ịkwụsị nkwa ọlụlụ ahụ n'ụzọ iwu kwadoro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: di ya
  rationale: N'ọnọdụ a, okwu ahụ na-egosi mmekọrịta alụmdi na nwunye nke iwu kwadoro, ọ bụ ezie na ha ka nọ n'oge nkwa ọlụlụ. “Di ya” bụ okwu Igbo doro anya ma kwekọọkwa na ἀπολῦσαι.
- source_word: δίκαιος
  choice: onye ezi omume
  rationale: Nke a na-egosi àgwà Josef ziri ezi n'ihu Chineke na n'omume ya, na-akọwaghị ya naanị dị ka onye na-edebe iwu ma ọ bụ naanị dị ka onye ebere.
- source_word: δειγματίσαι
  choice: ikpughe ya ka ihere mee ya n'ihu ọha
  rationale: Nsụgharị a na-egosipụta echiche nke ime ka mmadụ pụta ìhè n'ihu ọha n'ụzọ ga-ewetara ya ihere.
- source_word: ἐβουλήθη
  choice: o kpebiri
  rationale: Okwu Grik ahụ na-egosi ebumnuche e chebara echiche ma ọ bụ mkpebi siri ike; “o kpebiri” bụ okwu Igbo dị ugbu a ma doo anya.
- source_word: λάθρᾳ
  choice: na nzuzo
  rationale: Nke a na-egosi ime ihe na-enweghị ime ka ọ bụrụ ihe ọha na eze maara, ma dabara na ọchịchọ Josef ịghara ime Meri ihere n'ihu ọha.
- source_word: ἀπολῦσαι
  choice: ịgba ya alụkwaghịm
  rationale: N'ọnọdụ nkwa ọlụlụ ndị Juu nke iwu na-ekekọta, okwu a pụtara ịkwụsị mmekọrịta ahụ n'ụzọ iwu kwadoro, ọ bụghị naanị ịchụpụ ya.
- source_word: δὲ
  choice: Ma
  rationale: δὲ bụ njikọ dị nro na-aga n'ihu n'akụkọ ahụ; “Ma” na-egosipụta ntụgharị site n'ọnọdụ Meri gaa n'omume Josef.
- source_word: ὢν καὶ μὴ θέλων
  choice: ebe ọ bụ ... ọ chọghị
  rationale: Usoro a na-enye ihe ndabere maka mkpebi Josef ma na-ada nke ọma n'Igbo nkịtị.
theological_decisions:
- issue: Nkọwa Josef dịka δίκαιος
  choice: “onye ezi omume,” n'akọwaghị ma ọ bụ idebe iwu, obi ebere, ma ọ bụ ha abụọ ka e bu n'uche
  alternative: “onye ikpe ziri ezi” ma ọ bụ nkọwapụta na-emesi naanị ebere ike
  rationale: Grik ahụ jikọtara ezi omume Josef na ọchịchọ ya ịghara ime Meri ihere. Nsụgharị ahụ na-echekwa mgbagwoju a kama ikpebi otu nkọwa okpukpe ma ọ bụ omume naanị.
- issue: Ọnọdụ iwu nke Josef na Meri
  choice: “di ya” na “ịgba ya alụkwaghịm”
  alternative: “onye e kwere ya nkwa ịlụ” na “ịkwụsị nkwa ọlụlụ,” ma ọ bụ “nwoke ya” na “ịchụpụ ya”
  rationale: Okwu Grik na omenala nkwa ọlụlụ ndị Juu n'oge ahụ na-egosi mmekọrịta iwu kwadoro nke chọrọ nkwụsị alụmdi na nwunye. Okwu ndị dị n'ahịrị bụ ndị onye Igbo nke oge a ga-aghọta nke ọma; nkọwa ndị ọzọ dị n'okpuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara ụda akụkọ ahụ na njikọ dị n'etiti ezi omume Josef na ọmịiko ya, na-enweghị itinye nkọwa otu ụka.
