  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: ig
  text: Ọ maghịkwa ya[a] ruo mgbe[b] ọ mụrụ nwa nwoke; ọ kpọrọkwa ya aha Jizọs.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ doro anya karị, “ya na ya enwekọghị mmekọahụ dị ka di na nwunye.” Asụsụ Grik kwuru na ọ “maghị ya,” na-eji “ịma” dịka okwu mkpuchi.
    reason: lexical_alternative
  - marker: b
    text: “Ruo mgbe” na-egosi ihe bụ eziokwu ruo n’oge a mụrụ Jizọs; okwu ahụ n’onwe ya ekpebighị ihe mere mgbe nke ahụ gasịrị.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, n’ụzọ Igbo dị mfe karị, “ọ gụrụ ya aha Jizọs.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: maghị ya
  rationale: Nke a na-edobe okwu Grik bụ́ ‘ịma/ịmata’ nke e ji n’ebe a mee okwu mkpuchi maka mmekọahụ di na nwunye. Ihe odide ala peeji na-akọwa ya nke ọma n’enweghị itinye nkọwa sara mbara n’ahịrị bụ isi.
- source_word: ἕως οὗ
  choice: ruo mgbe
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi ókè oge ahụ ruru, ma okwu ahụ n’onwe ya ekpebighị ihe mere mgbe ọmụmụ ahụ gasịrị.
- source_word: ἔτεκεν
  choice: ọ mụrụ
  rationale: ‘Ịmụ nwa’ bụ okwu Igbo doro anya ma bụrụ nke a na-eji eme ihe ugbu a maka ịmụpụta nwa.
- source_word: υἱόν
  choice: nwa nwoke
  rationale: Aha a enweghị article n’asụsụ Grik; ‘nwa nwoke’ na-edobe ya n’enweghị ịgbakwụnye nkwusi ike na-adịghị n’ihe odide ahụ.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: ọ kpọkwara aha ya Jizọs
  rationale: Nke a na-esochi usoro okwu Semitic-Grik nke ọma, ma ọ ka bụkwa Igbo a na-aghọta nke ọma.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: ‘Jizọs’ bụ ụdị aha a na-ejikarị eme ihe n’Igbo maka aha Agba Ọhụrụ a.
theological_decisions:
- issue: Ma ‘ruo mgbe’ ọ̀ na-egosi na Meri na Josef malitere inwe mmekọahụ di na nwunye mgbe e mesịrị
  choice: A sụgharịrị ἕως οὗ naanị dịka ‘ruo mgbe,’ n’enweghị ikwu na mmekọahụ di na nwunye mere ma ọ bụ na o meghị mgbe ọmụmụ Jizọs gasịrị.
  alternative: Ụfọdụ na-ewere okwu ahụ dịka ihe na-egosi na mmekọrịta di na nwunye malitere mgbe e mesịrị; ndị ọzọ na-ekwu na ọ naghị egosi mgbanwe ọ bụla mgbe oge ahụ gasịrị.
  rationale: Okwu oge Grik ahụ na-akọwa ihe bụ eziokwu ruo n’oge ọmụmụ nwa ahụ, ma ya onwe ya anaghị edozi ajụjụ banyere ihe mere mgbe e mesịrị. Nsụgharị ahụ na-edobe esemokwu nkọwa a kama idozi ya dịka ozizi otu ụka.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ okwu mkpuchi ‘maghị ya’ n’ahịrị bụ isi iji mee ka usoro echiche nke Grik pụta ìhè, ebe nkọwa doro anya dị n’ala peeji. Njikọ ‘-kwa’ na-egosipụta καί nke dị na mmalite na n’ahịrị nke abụọ n’ụzọ Igbo na-asọ were were.
