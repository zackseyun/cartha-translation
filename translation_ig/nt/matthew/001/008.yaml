  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: ig
  text: Asaf mụrụ Jehoshafat[a], Jehoshafat mụrụ Joram, Joram mụrụ Uzaịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide ochie nwere “Asa” kama “Asaf”; “Asa” kwekọkwara n’aha eze Juda ahụ e kwuru n’usoro ọmụmụ Agba Ochie.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: Asaf
  rationale: E dere aha Grik Ἀσὰφ n’ụdị mkpụrụedemede Igbo dị ka “Asaf,” kama ime ka ọ bụrụ “Asa” n’amaokwu ahụ. Nke a na-edobe ihe dị n’ihe odide Grik a họọrọ, ebe nkọwa ala peeji na-egosi ọdịiche dị n’ihe odide na njikọ ya na usoro ọmụmụ Agba Ochie.
- source_word: δὲ
  choice: njikọ e gosipụtara site n’usoro ahịrịokwu na “Joram amụọ”
  rationale: N’ebe a δέ bụ njikọ dị nro n’usoro ọmụmụ, ọ bụghị okwu na-egosi mmegide. Igbo na-aga were were ma e tinyeghị “ma” ugboro ugboro; mgbanwe “amụọ” n’ahịrịokwu ikpeazụ na-ejikọ usoro ahụ nke ọma.
- source_word: ἐγέννησεν
  choice: mụrụ
  rationale: “Mụrụ” bụ okwu Igbo dị mkpirikpi, nke a na-aghọta nke ọma n’usoro ọmụmụ dịka ịghọ nna mmadụ. Ọ na-edobe usoro nna na nwa n’enweghị okwu ochie ma ọ bụ nkọwa toro ogologo.
- source_word: Ἰωσαφάτ
  choice: Jehoshafat
  rationale: Nke a bụ idegharị aha ahụ n’ụdị a maara nke ọma n’Igbo ma na-egosikwa aha eze ahụ n’Agba Ochie.
- source_word: Ἰωράμ
  choice: Joram
  rationale: Nke a na-esochi ụdị aha Grik Ἰωράμ ma bụrụkwa ụdị dị mfe ịgụ n’Igbo.
- source_word: Ὀζίαν
  choice: Uzaịa
  rationale: “Uzaịa” bụ ụdị aha eze Juda a maara n’asụsụ Igbo, ma dịkwa mfe ịkpọ karịa idegharị Grik ahụ kpọmkwem dịka “Ozias.”
theological_decisions:
- issue: Otu e si akọwa δὲ na ἐγέννησεν ugboro ugboro n’usoro ọmụmụ
  choice: E debere njikọ nna na nwa nke ọ bụla, ma mee ka ahịrịokwu ahụ na-aga were were n’Igbo n’etinyeghị okwu njikọ ugboro ugboro.
  alternative: Asaf mụrụ Jehoshafat, Jehoshafat wee mụọ Joram, Joram wee mụọ Uzaịa.
  rationale: Nke a bụ mkpebi gbasara ụzọ e si ede ya, ọ bụghị mkpebi ozizi. Ọ na-eme ka Igbo bụrụ nke okike ma na-edobe usoro ọmụmụ ahụ niile.
- issue: Ma a ga-agbanwe Ἀσὰφ ka ọ bụrụ Asa iji kwekọọ n’usoro ọmụmụ Agba Ochie
  choice: E debere “Asaf” n’amaokwu ahụ, tinye “Asa” na nkọwa ala peeji.
  alternative: Iji “Asa” n’amaokwu ahụ dịka aha eze Juda a na-atụ anya ya.
  rationale: Isi ihe odide Grik enyere nwere Ἀσὰφ, ya mere a naghị edozi ya n’amaokwu ahụ n’enweghị ngosipụta. Nkọwa ala peeji na-eme ka ndị na-agụ ya mara ọdịiche dị n’ihe odide na ihe usoro ọmụmụ Agba Ochie na-egosi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “mụrụ” dịka okwu a na-ejikarị akọ usoro ọmụmụ; n’ebe a ihe gbara ya gburugburu na-egosi mmekọrịta nna na nwa. E dere aha ndị ahụ n’ụdị ndị na-agụ Akwụkwọ Nsọ n’Igbo ga-amata, ma e debere ọdịiche Ἀσὰφ/Asa n’ụzọ doro anya.
