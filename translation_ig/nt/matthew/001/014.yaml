id: MAT.1.14
reference: Matthew 1:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: ig
  text: Azọ mụrụ Zadọk, Zadọk mụrụ Akim, Akim mụrụ Eliud.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: Azọ
  rationale: E degharịrị aha Grik a n’ụdị dabara n’usoro mkpọpụta na odide Igbo.
- source_word: δέ
  choice: (a hapụrụ ya ka usoro ahịrịokwu gosipụta njikọ ya)
  rationale: N’usoro ọmụmụ a, δέ bụ njikọ dị mfe. Ikwughachi nhazi ahịrịokwu na njikọ ụda ‘amụọ’ n’akụkụ ikpeazụ na-eme ka Igbo dị ire n’enweghị ịtinye ‘na’ ugboro ugboro.
- source_word: ἐγέννησεν
  choice: mụrụ
  rationale: N’usoro ọmụmụ, ‘mụrụ’ bụ okwu Igbo dị mfe ma kwekọọ n’echiche nke ịghọ nna ma ọ bụ ịbụ nna nna n’usoro agbụrụ; ọ naghị amanye na onye ọ bụla bụ nwa kpọmkwem ma ọ bụrụ na usoro aha ahụ hapụrụ ọgbọ ụfọdụ.
- source_word: τὸν
  choice: (a sụgharịghị ya iche)
  rationale: Ọ bụ akara kpọmkwem ihe omume n’asụsụ Grik; aha mmadụ n’Igbo anaghị achọ isiokwu kwekọrọ na ya n’ebe a.
- source_word: Σαδώκ
  choice: Zadọk
  rationale: E degharịrị aha ahụ n’ụdị Igbo, na-edobe ụda z nke ọdịnala aha ahụ.
- source_word: Ἀχίμ
  choice: Akim
  rationale: E degharịrị aha Grik ahụ n’ụdị mkpọpụta Igbo; χ dị n’aha a ka e gosipụtara site na k, nke dị mfe ma doo anya nye ndị na-agụ Igbo.
- source_word: Ἐλιούδ
  choice: Elịud
  rationale: E degharịrị aha ahụ n’ụdị Igbo nke na-agbaso nkebi ụda Grik ma bụrụkwa nke a pụrụ ịgụ nke ọma.
theological_decisions:
- issue: Ma ἐγέννησεν ọ̀ pụtara naanị nna mụrụ nwa ozugbo ka ọ bụkwa nna nna n’usoro agbụrụ
  choice: mụrụ
  alternative: ghọrọ nna nke
  rationale: ‘Mụrụ’ bụ okwu ọdịnala na nke doro anya n’usoro ọmụmụ Igbo. A naghị agbakwunye ‘ozugbo,’ ya mere ekweghị ka nsụgharị mechie ohere nke usoro agbụrụ nwere ike ịhapụ ụfọdụ ọgbọ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mkpirikpi ma dị ugwu. E jiri usoro nkwughachi mee ka ọdịdị usoro ọmụmụ Grik pụta ìhè, ma gbanwee ngwaa ikpeazụ ka ọ bụrụ ‘amụọ’ iji mee ka ahịrịokwu ahụ na-asọ nke ọma.
