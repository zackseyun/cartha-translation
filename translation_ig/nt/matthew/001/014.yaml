- from: Azọ mụrụ Zadọk, Zadọk mụrụ Akim, Akim amụọ Elịud.
  to: Azọ mụrụ Zadọk, Zadọk mụrụ Akim, Akim mụrụ Eliud.
  rationale: The revision restores consistent completed-past genealogical wording in the final clause and adjusts Eliud’s vowel to reflect the Greek name more closely. It retains the draft’s concise, dignified genealogical register and does not add interpretive material.
