id: MAT.1.3
reference: Matthew 1:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: ig
  text: Juda bụ nna Perez na Zera, ndị o si na Tema nweta; Perez bụ nna Hezron; Hezron bụ nna Aram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ nsụgharị nwere “Ram” n’ebe a, n’ihi ọdịnala ma ọ bụ ụdị aha ọzọ; ma ederede Grik dị n’ebe a gụrụ “Aram.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: Juda
  rationale: N’usoro ọmụmụ a, aha ahụ na-ezo aka n’Juda nna ochie nke ebo ahụ; “Juda” bụ ụdị aha a maara nke ọma n’Igbo, ọ na-egbochikwa mgbagwoju anya ya na Judas ndị Agba Ọhụrụ.
- source_word: δὲ
  choice: akara nkewa na njikọ ahịrịokwu
  rationale: N’ebe a δέ bụ njikọ dị nro n’usoro ọmụmụ, ọ bụghị ihe na-egosi nnukwu mmegide. Akara semikolon na njikọ ahịrịokwu na-eme ka Igbo na-aga nke ọma n’enweghị ịgbakwụnye okwu na-adịghị mkpa.
- source_word: ἐγέννησεν
  choice: mụtara / amụta
  rationale: N’usoro ọmụmụ, okwu a na-egosi ịbụ nna ma ọ bụ ịmụpụta onye sochirinụ. “Mụtara” bụ okwu Igbo dị mkpirikpi, dị ugbu a, nke dabara n’usoro aha ndị a.
- source_word: Φαρὲς
  choice: Perez
  rationale: A họọrọ ụdị aha kwekọrọ na פֶּרֶץ iji debe njikọ ya na aha Agba Ochie.
- source_word: Ζάρα
  choice: Zera
  rationale: A họọrọ ụdị aha kwekọrọ na זֶרַח ma kwekọọ n’ụda na odide Igbo.
- source_word: ἐκ τῆς Θαμάρ
  choice: site na Tema
  rationale: ἐκ na aha nne na-egosi na ụmụ ndị a sitere n’aka Tema. “Site na Tema” na-edebe echiche ahụ n’enweghị ịkọwa karịa ihe Grik kwuru.
- source_word: Θαμάρ
  choice: Tema
  rationale: Ụdị aha a dabara n’odide na mkpọpụta aha ahụ n’Igbo.
- source_word: Ἑσρώμ
  choice: Hezron
  rationale: Ụdị a kwekọrọ na aha Hibru חֶצְרוֹן ma na-edebe njikọ ya na Agba Ochie.
- source_word: Ἀράμ
  choice: Aram
  rationale: Ederede Grik e nyere gụrụ Ἀράμ, ya mere e soro ya kpọmkwem kama ime ka ọ bụrụ “Ram” n’ihi ọdịnala nsụgharị ọzọ.
theological_decisions:
- issue: Ma a ga-eme ka aha ikpeazụ kwekọọ n’ụdị a na-ahụkarị n’usoro ọmụmụ Agba Ochie
  choice: Aram
  alternative: Ram
  rationale: Ederede Grik bụ isi gụrụ Ἀράμ. Ya mere isi ederede ji “Aram,” ebe ndetu ala na-echekwa “Ram” dị ka ụdị ndị na-agụ akwụkwọ nwere ike ịhụ n’ọdịnala ọzọ.
translation_notes:
  register: E ji Igbo Izugbe dị mfe ma dị ugwu dee ya. A hapụrụ usoro ọmụmụ ahụ ka ọ dị mkpirikpi, ma jiri “site na Tema” chekwaa kpọmkwem na e kpọrọ nne ahụ aha. Akara [a] dị n’isi ederede ma kwekọọ na ndetu ala.
