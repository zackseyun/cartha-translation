id: MAT.1.13
reference: Matthew 1:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: ig
  text: Zerubabel mụrụ Abịud[a], Abịud mụrụ Eliakim, Eliakim wee mụọ Azọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘bụ nna nke.’ N’usoro ọmụmụ ndị dị na Baịbụl, ngwaa a a na-eme ugboro ugboro pụrụ ịkọ usoro agbụrụ n’ụzọ dị mkpirikpi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: Zerubabel
  rationale: E dere aha onye a n'ụdị a na-ahụkarị n'Igbo, n'ịgbaso ụda aha Grik na onye ahụ a maara n'akụkọ Baịbụl.
- source_word: δέ
  choice: — / wee
  rationale: N'usoro ọmụmụ a, δέ bụ njikọ dị nro na-aga n'ihu n'usoro ahụ, ọ bụghị okwu na-egosi nnukwu ọdịiche. A hapụrụ ya na nkebiokwu abụọ mbụ, jiri ‘wee’ jikọta nke ikpeazụ ka Igbo wee na-aga were were.
- source_word: ἐγέννησεν
  choice: mụrụ
  rationale: N'usoro ọmụmụ, ‘mụrụ’ bụ okwu Igbo dị nkenke ma bụrụkwa nke mmadụ niile na-aghọta maka ịkọ usoro nna na ụmụ ya; ọ na-echekwa usoro okwu Grik a na-eme ugboro ugboro.
- source_word: Ἀβιούδ
  choice: Abịud
  rationale: Ntugharị aha Grik n'ụdị mkpọpụta dabara n'usoro ide Igbo.
- source_word: Ἐλιακίμ
  choice: Eliakim
  rationale: Ntugharị aha ahụ n'ụdị a maara nke ọma, nke na-anọgide nso n'ụdị Grik.
- source_word: Ἀζώρ
  choice: Azọ
  rationale: Ntugharị aha Grik n'ụdị dị mfe ọgụgụ n'Igbo; ‘ọ’ na-anọchi ụda omega dị n'aha ahụ.
theological_decisions:
- issue: Otú e si sụgharị γεννάω n'usoro ọmụmụ nke nwere ike ịhapụ ụfọdụ ọgbọ
  choice: mụrụ
  alternative: bụ nna nna nke / ghọrọ nna nke
  rationale: ‘Mụrụ’ na-echekwa akpaalaokwu usoro ọmụmụ nke Matiu n'enweghị ịkọwa n'ike na njikọ ọ bụla bụ nke nna na nwa ozugbo. Ihe e dere n'okpuru peeji na-eme ka o doo anya na usoro ọmụmụ Baịbụl nwere ike ịchịkọta ọgbọ ụfọdụ.
translation_notes:
  register: Igbo ọkọlọtọ, nke ugbu a ma dị ugwu. E jiri ‘mụrụ’ mee ka usoro ahụ dị mfe ma dị ndụ, ma zere okwu ochie ma ọ bụ nkọwa nke ga-ekpebi ma njikọ ọ bụla bụ nke nna na nwa ozugbo.
