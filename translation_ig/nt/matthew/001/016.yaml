  to: Jekọb mụrụ Josef, di Meri. Site na Meri ka a mụrụ Jizọs, onye a na-akpọ Mesaya.[a]
  rationale: The revision preserves the Greek contrast between Jacob’s begetting of Joseph and Jesus’ birth from Mary, without adding emphasis beyond the light connective δέ. It also retains the titular rendering Mesaya and repairs the explanatory footnote.
