    text: A pụkwara ịsụgharị ya, “onye a na-akpọ Kraịst.” Okwu Grik ahụ, Christos, bụ utu aha; n’ebe a, a sụgharịrị ya “Mesaya.”
    reason: alternative_rendering
  revision_rationale: The revision preserves the Greek contrast between Jacob’s begetting of Joseph and Jesus’ birth from Mary, without adding emphasis beyond the light connective δέ. It also retains the titular rendering Mesaya and repairs the explanatory footnote.
