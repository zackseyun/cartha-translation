id: MAT.1.16
reference: Matthew 1:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: ig
  text: Jekọb mụrụ Josef, di Meri. Site na Meri ka a mụrụ Jizọs, onye a na-akpọ Mesaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye a na-akpọ Kraịst.” Okwu Grik ahụ, Christos, bụ utu aha; n’ebe a, a sụgharịrị ya “Mesaya.”
    reason: alternative_rendering
lexical_decisions:
- source_word: δὲ
  choice: —kwa
  rationale: N’ebe a, δέ na-eme ka usoro ọmụmụ ahụ gaa n’ihu n’enweghị nkwusi ike na mmegide; “kwa” na-enye njikọ dị nro n’Igbo.
- source_word: ἐγέννησεν
  choice: mụrụ
  rationale: N’usoro ọmụmụ, “mụrụ” bụ okwu Igbo dị mkpirikpi ma bụrụkwa nke a na-aghọta nke ọma maka ịbụ nna ma ọ bụ ịmụpụta nwa; ọ dabara na usoro ahịrịokwu ndị bu ya ụzọ.
- source_word: τὸν ἄνδρα Μαρίας
  choice: di Meri
  rationale: N’ihi na ἀνήρ sochiri aha Meri n’ụdị a, ihe ọ pụtara bụ “di,” ọ bụghị naanị “nwoke.”
- source_word: ἐξ ἧς
  choice: site na Meri
  rationale: Nnọchiaha Grik a bụ nke nwanyị ma na-ezo kpọmkwem aka na Meri. E kwughachiri “Meri” n’Igbo ka onye a na-ekwu maka ya doo anya, ebe Igbo anaghị egosi okike n’nnọchiaha dịka Grik.
- source_word: ἐγεννήθη
  choice: a mụrụ
  rationale: 'Ụdị nnara a na-agbanwe usoro okwu ahụ: e kwuru na Jekọb mụrụ Josef, ma e kwughị na Josef mụrụ Jizọs. “A mụrụ” na-echekwa mgbanwe ahụ.'
- source_word: ὁ λεγόμενος
  choice: onye a na-akpọ
  rationale: Nke a na-enye okwu Grik ahụ n’ụzọ kwụ ọtọ ma bụrụkwa Igbo a na-asụ nke ọma.
- source_word: χριστός
  choice: Mesaya
  rationale: N’ebe a, χριστός bụ utu aha e ji amata Jizọs, ya mere “Mesaya” na-egosipụta ihe utu aha ahụ pụtara kama ime ya ka ọ bụrụ akụkụ aha nkịtị.
theological_decisions:
- issue: Otu e si sụgharị χριστός n’okwu e ji amata Jizọs
  choice: Mesaya
  alternative: Kraịst
  rationale: ὁ λεγόμενος χριστός na-eji χριστός dịka utu aha. “Mesaya” na-echekwa nghọta nke onye e tere mmanụ, ebe “Kraịst” nwere ike ịdị ka aha ọzọ n’Igbo.
- issue: Mgbanwe site n’ikwu na Jekọb mụrụ Josef ruo n’ikwu banyere ọmụmụ Jizọs
  choice: “Jekọb mụrụ Josef” ma “site na Meri ka a mụrụ Jizọs”
  alternative: “Josef mụrụ Jizọs”
  rationale: Grik gbanwere site n’ụdị na-arụ ọrụ ἐγέννησεν gaa n’ụdị nnara ἐγεννήθη, tinyekwa ἐξ ἧς nke na-ezo aka na Meri. Nsụgharị ahụ na-echekwa mgbanwe a n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E kwughachiri aha “Meri” iji chekwaa ntụaka nwanyị doro anya nke dị na Grik; e jikwara “a mụrụ” chekwaa ụdị nnara na ọdịiche dị n’etiti ọmụmụ Josef na ọmụmụ Jizọs.
