- from: Ma ọ sịrị[a], “Ọ̀ bụ na unu onwe unu kwa ka na-enweghị nghọta?”
  to: Ma ọ sịrị, “Unu onwe unu kwa, ọ̀ ka na-enweghị nghọta?”
  rationale: The revision keeps every source element while using a direct Standard Igbo question. It retains persistence (“ka na-”), emphasis/inclusion (“unu onwe unu kwa”), and the measured rebuking sense of ἀσύνετοι (“na-enweghị nghọta”). The footnote has been removed because it neither records a necessary ambiguity nor offers an equally source-close lexical alternative.
