  yaml_path: translation/nt/matthew/015/016.yaml
  text: But he said[a], “Are you also still without understanding?”
translation:
  language: ig
  text: Ma ọ sịrị, “Unu onwe unu kwa, ọ̀ ka na-enweghị nghọta?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche n’etiti ajụjụ ndị na-eso ụzọ jụrụ na nzaghachi Jizọs.
- source_word: ὁ εἶπεν
  choice: ọ sịrị
  rationale: Akụkụ aha ahụ ὁ na-anọchi anya Jizọs n’ebe a; ‘ọ sịrị’ bụ ụzọ Igbo si akọ okwu a n’ụzọ ebumpụta ụwa.
- source_word: Ἀκμὴν
  choice: ka
  rationale: N’usoro ‘ka na-enweghị,’ ọ na-egosi na ọnọdụ ahụ ka dị ruo oge a, nke kwekọrọ na ‘still/even now.’
- source_word: καὶ ὑμεῖς
  choice: unu onwe unu kwa
  rationale: ‘Kwa’ na ‘onwe unu’ jikọtara ọnụ na-echekwa nkwusi ike na ndị na-eso ụzọ sokwa ná ndị a na-abara mba.
- source_word: ἀσύνετοί ἐστε
  choice: na-enweghị nghọta
  rationale: Nke a na-egosi enweghị nghọta ma ghara ime ka okwu ahụ sie ike karịa ka Grik si kwuo, dịka ịkpọ ha ndị nzuzu.
theological_decisions:
- issue: Ụda mba Jizọs baara ndị na-eso ụzọ ya
  choice: Ajụjụ siri ike banyere nghọta ha nke ka na-adịghị
  alternative: “Unu onwe unu kwa ka bụ ndị nzuzu?”
  rationale: ἀσύνετοι na-ekwu maka enweghị nghọta n’ọnọdụ a; nsụgharị a na-echekwa mba ahụ ma ghara ịgbanwe ya ka ọ bụrụ ikpe siri ike banyere agwa ha.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma doo anya. Ajụjụ ‘Ọ̀ bụ na…?’ na-eme ka ụda ajụjụ mba ahụ pụta nke ọma; ‘ka na-enweghị nghọta’ na-echekwa echiche nke ọnọdụ ahụ ịdịgide ruo ugbu a.
