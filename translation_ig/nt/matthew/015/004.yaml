  to: N’ihi na Chineke kwuru, “Sọpụrụ nna gị na nne gị,” nakwa, “Onye ọ bụla na-akọcha nna ya ma ọ bụ nne ya ga-anwụrịrị.”[a]
  rationale: The revision replaces only the less idiomatic main-text expression for κακολογῶν with “na-akọcha,” a natural Standard Igbo term for reviling or cursing. The footnote preserves the broader “speaks evil against” alternative and the possible explicit-agent rendering of the penalty formula. No doctrinal interpretation is added.
