  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: ig
  text: N’ihi na Chineke kwuru, “Sọpụrụ nna gị na nne gị,” nakwa, “Onye ọ bụla na-akọcha nna ya ma ọ bụ nne ya ga-anwụrịrị.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye ọ bụla na-ekwu okwu ọjọọ megide nna ya ma ọ bụ nne ya, a ga-egburịrị ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: N’ihi na Chineke
  rationale: “N’ihi na” na-egosipụta ọrụ nkọwa na ihe kpatara okwu γάρ, ebe “Chineke” na-asụgharị θεός n’ụzọ doro anya.
- source_word: εἶπεν
  choice: kwuru
  rationale: Okwu a na-ewebata ihe e dere n’Akwụkwọ Nsọ; “kwuru” na-edobe ihe λέγω pụtara n’ebughị ụzọ mee ka ọ bụrụ iwu karịa ka Grik si kwuo ya.
- source_word: Τίμα
  choice: Sọpụrụ
  rationale: “Sọpụrụ” na-egosipụta inye nne na nna nsọpụrụ kwesịịrị ha, ọ bụghị naanị ịkwanyere ha ùgwù n’echiche dị mfe.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: nna gị na nne gị
  rationale: Mgbakwunye “gị” dabara n’asụsụ Igbo ma na-eme ka iwu ahụ bụrụ nke eke, dịka okwu e hotara n’iwu ahụ si dị.
- source_word: Ὁ κακολογῶν
  choice: Onye ọ bụla na-ekwu okwu ọjọọ megide
  rationale: Nhọrọ a na-edobe obosara nke κακολογέω, nke nwere ike ịpụta ikwu okwu ọjọọ megide mmadụ, ịkọcha ya, ma ọ bụ ikwulu ya.
- source_word: πατέρα ἢ μητέρα
  choice: nna ya ma ọ bụ nne ya
  rationale: “Ya” na-eme ka onye nne na nna ahụ bụ nke ya doo anya n’Igbo, ebe “ma ọ bụ” na-edobe nhọrọ ἢ.
- source_word: θανάτῳ τελευτάτω
  choice: ga-anwụrịrị
  rationale: “Ga-anwụrịrị” na-edobe ike na ịdị egwu nke usoro ntaramahụhụ ọnwụ ahụ, ma ọ naghị ekwu hoo haa onye ga-egbu ya ebe Grik na-ekwughị onye ga-eme ya.
theological_decisions:
- issue: Otú e si asụgharị usoro iwu gbasara ntaramahụhụ ọnwụ
  choice: ga-anwụrịrị
  alternative: a ga-egburịrị ya
  rationale: Nhọrọ bụ isi na-edobe ịdị ike nke iwu ahụ na enweghị onye ọrụ e kpọrọ aha na θανάτῳ τελευτάτω. Nhọrọ ọzọ na-eme ka igbu onye ahụ site n’aka ndị ọzọ pụta ìhè karịa.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Nakwa” na-ejikọta amaokwu abụọ Chineke kwuru, ebe “ga-anwụrịrị” na-echekwa ụda iwu siri ike nke ederede ahụ.
