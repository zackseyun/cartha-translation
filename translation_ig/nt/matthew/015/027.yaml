revisions:
- from: Ma nwanyị ahụ sịrị, “Ee, Onyenwe anyị[b], n’ihi na ọbụna nkịta nta[a] na-eri iberibe nri ndị si na tebụl ndị nwe ha daa.”
  to: Ma ọ sịrị, “Ee, Onyenwe m[b], n’ihi na ọbụna nkịta nta[a] na-eri iberibe nri ndị na-ada site na tebụl ndị nwe ha.”
  rationale: The revision removes the unsupported plural possessive in the address to Jesus and improves the representation of the participial description of the crumbs. It otherwise preserves the draft’s accurate lexical choices, register, ambiguity concerning κύριε, and correctly placed footnote anchors.
  reviewer_model: gpt-5.6-terra
