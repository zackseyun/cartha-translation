id: MAT.15.27
reference: Matthew 15:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: ig
  text: Ma ọ sịrị, “Ee, Onyenwe m[b], n’ihi na ọbụna nkịta nta[a] na-eri iberibe nri ndị na-ada site na tebụl ndị nwe ha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “nkịta,” “nkịta ụlọ,” ma ọ bụ “ụmụ nkịta”; okwu Grik bụ ụdị mbelata nke nwere ike ịpụta obere nkịta a na-azụ n’ụlọ.
    reason: lexical_alternative
  - marker: b
    text: N’ebe a, “Onyenwe m” nwekwara ike ịbụ okwu nkwanye ùgwù pụtara “nna m ukwu”; ma ntụgharị dị n’ahụ amaokwu ahụ na-echekwa ụzọ a na-ejikarị atụgharị κύριος n’Oziọma.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναί
  choice: Ee
  rationale: Ọ bụ nkwenye doro anya ma kwekọọ n’okwu nwanyị ahụ ji nabata ihe Jizọs kwuru.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ ntụgharị a na-ejikarị akọwa κύριος mgbe a na-akpọ Jizọs; ọ ka na-ahapụ ohere ka a ghọta ya dị ka nkwanye ùgwù ma ọ bụ nkwupụta ikike ya.
- source_word: καὶ γὰρ
  choice: n’ihi na ọbụna
  rationale: “N’ihi na” na-egosi na ihe na-esochi bụ ihe kpatara okwu ya, ebe “ọbụna” na-echekwa ike mgbakwunye dị na καί.
- source_word: κυνάρια
  choice: nkịta nta
  rationale: Ụdị mbelata okwu Grik na-atụ aro nkịta nta, ikekwe nkịta a na-azụ n’ụlọ; “nkịta nta” na-echekwa echiche ahụ n’enweghị ime ka ọ bụrụ naanị ụmụ nkịta amụrụ ọhụrụ.
- source_word: ἐσθίει
  choice: na-eri
  rationale: Ọ na-enye ihe omume a na-emekarị n’ihe atụ ahụ; Igbo na-eji ngwaa dabara na isiokwu ọtụtụ.
- source_word: ψιχίων
  choice: iberibe nri
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọwa obere nri si n’elu tebụl daa; ọ sara mbara nke ọma iji kpuchie crumbs ma ọ bụ scraps.
- source_word: τῶν πιπτόντων
  choice: ndị ... daa
  rationale: Nkebiokwu njikọ a bụ Igbo eke ma na-echekwa ihe participle Grik na-akọ banyere iberibe nri.
- source_word: τραπέζης
  choice: tebụl
  rationale: Ọ bụ okwu Igbo a na-aghọta nke ọma maka tebụl iri nri, bụkwa ebe ihe atụ a gbadoro ụkwụ.
- source_word: τῶν κυρίων αὐτῶν
  choice: ndị nwe ha
  rationale: N’ime ihe atụ banyere nkịta, okwu a na-ezo aka n’ebe ndị nwe nkịta nọ, ọ bụghị aha nsọ; ntụgharị a bụ nke eke ma na-echekwa mmekọrịta nke nwe na anụ ụlọ.
theological_decisions:
- issue: Otu e si tụgharịa κύριε mgbe nwanyị ahụ na-agwa Jizọs okwu
  choice: Onyenwe anyị
  alternative: Nna m ukwu
  rationale: “Onyenwe anyị” na-echekwa ntụgharị Oziọma a na-ejikarị eme na ikike nwere ike ịdị n’okwu ahụ; ihe odide ahụ anaghị amanye anyị ikpebi ma ọ bụ naanị nkwanye ùgwù ka nwanyị ahụ bu n’obi.
- issue: Ichekwa ụdị mbelata dị na κυνάρια
  choice: nkịta nta
  alternative: nkịta; nkịta ụlọ; ụmụ nkịta
  rationale: Nhọrọ a na-egosi obere nkịta ma ọ bụ nkịta ụlọ n’enweghị ime ka ihe atụ ahụ sie ike karịa Grik ma ọ bụ mee ka ọ dị nro karịa ya.
translation_notes:
  register: Ejiri Igbo Ọdịnala nke oge a, dị ugwu ma dị mfe nghọta. “Iberibe nri” ka “mpekere achịcha” sara mbara n’ihi na ψιχία anaghị akọwa naanị achịcha. E debere akara nkọwa [a] n’akụkụ “nkịta nta,” ebe okwu nkọwa ahụ metụtara, na [b] n’akụkụ “Onyenwe anyị.”
