    reason: lexical_alternative
  revision_rationale: The revision corrects the Igbo verb coordination so that both actions remain infinitival in sense and the pronoun “ya” unambiguously refers to the bread. It otherwise preserves the source’s direct metaphor, its unresolved contextual tension, and the existing lexical footnote.
