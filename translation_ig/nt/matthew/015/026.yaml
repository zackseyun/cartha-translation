- from: Ma ọ zara sị, “O zighị ezi iwere achịcha ụmụaka tụbara ya ụmụ nkịta.[a]”
  to: Ma ọ zara sị, “Ọ bụghị ihe ziri ezi iwere achịcha ụmụaka ma tụba ya ụmụ nkịta.[a]”
  rationale: The revision corrects the Igbo verb coordination so that both actions remain infinitival in sense and the pronoun “ya” unambiguously refers to the bread. It otherwise preserves the source’s direct metaphor, its unresolved contextual tension, and the existing lexical footnote.
  reviewer_model: gpt-5.6-terra
