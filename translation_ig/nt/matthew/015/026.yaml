source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: ig
  text: Ma ọ zara sị, “Ọ bụghị ihe ziri ezi iwere achịcha ụmụaka ma tụba ya ụmụ nkịta.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “nkịta ụlọ” ma ọ bụ “ụmụ nkịta”; okwu Grik e ji mee ihe bụ ụdị okwu nta, nke nwere ike na-ezo aka na nkịta nta ma ọ bụ nkịta a na-azụ n'ụlọ karịa nkịta na-awagharị n'okporo ámá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ọ zara sị
  rationale: Ngwakọta participle na ngwaa a bụ ụzọ Grik e si ekwu okwu nke a na-asụ n’Igbo n'ụzọ ebumpụta ụwa dịka ‘ọ zara sị,’ ma ọ ka na-egosi na okwu ahụ bụ nzaghachi.
- source_word: καλὸν
  choice: zighị ezi
  rationale: N'ebe a, καλόν na-ekwu banyere ihe kwesịrị ekwesị ma ọ bụ ihe ziri ezi ime; ‘o zighị ezi’ na-enye nghọta ahụ n'Igbo nkịtị.
- source_word: λαβεῖν
  choice: iwere
  rationale: ‘Iwere’ bụ ntụgharị kpọmkwem na nke doro anya maka omume iwere ihe.
- source_word: ἄρτον
  choice: achịcha
  rationale: ‘Achịcha’ na-edobe ihe atụ nke achịcha dị n'okwu Grik kama ịgbasa ya ka ọ bụrụ nri n'ozuzu.
- source_word: τέκνων
  choice: ụmụaka
  rationale: τέκνα pụtara ụmụ n'enweghị ịkọwa nwoke ma ọ bụ nwanyị; ‘ụmụaka’ na-edobe obosara ahụ.
- source_word: βαλεῖν
  choice: tụbara
  rationale: ‘Ịtụbara’ na-edobe ike na ihe oyiyi nke βάλλω karịa okwu dị nro dịka ‘inye.’
- source_word: κυναρίοις
  choice: ụmụ nkịta
  rationale: κυνάρια bụ ụdị okwu nta nke κύων; ‘ụmụ nkịta’ na-egosi nkịta nta, ma nwee ike ime ka a ghọta nkịta a na-azụ n'ụlọ, n'agbanyeghị na okwu Grik ahụ anaghị ekpebi kpọmkwem ma ha bụ ụmụ nkịta ma ọ bụ nkịta ụlọ.
theological_decisions:
- issue: Otu e si edobe ihe atụ banyere ụmụaka na nkịta n'enweghị ịkọwa ndị ihe atụ ahụ na-anọchi anya ma ọ bụ olu e ji kwuo ya.
  choice: E debere ihe atụ ahụ ozugbo dịka ‘achịcha ụmụaka’ na ‘ụmụ nkịta.’
  alternative: Ịkọwa ya n'ahịrịokwu dịka nri e nyere otu ndị tupu ndị ọzọ, ma ọ bụ ịsụgharị κυνάρια naanị dịka nkịta ụlọ.
  rationale: Amaokwu ahụ n'onwe ya akọwaghị kpọmkwem ndị ihe atụ ahụ na-anọchi anya. Ịhapụ ihe oyiyi ahụ dịka ọ dị na-edobe mgbagwoju anya na esemokwu nkà mmụta okpukpe nke gburugburu amaokwu ga-enyere onye na-agụ aka ịghọta.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị mfe ma dị ugwu. A họọrọ usoro ‘ọ zara sị’ na ‘o zighị ezi’ ka okwu ahụ daa n'ụzọ ebumpụta ụwa, ebe a ka debere ihe atụ mbụ n'enweghị nkọwa agbakwunyere.
