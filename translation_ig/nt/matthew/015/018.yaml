revisions:
- from: Ma ihe ndị na-esi n’ọnụ apụta na-esite n’obi apụta, ọ bụkwa ihe ndị ahụ na-emerụ mmadụ.[a]
  to: Ma ihe ndị na-esi n’ọnụ apụta, ọ bụ n’obi ka ha si apụta; ihe ndị ahụ na-emerụ mmadụ.[a]
  rationale: The revision removes an awkward repetition while preserving the source’s mouth/heart imagery, the plural reference to the things spoken, and the purity sense of κοινόω. The footnote retains the lexical alternative and gives a more accurate explanation of the Greek representative singular.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the source’s central contrast accurately: what comes out through the mouth has its origin in the heart and defiles a human being. However, the repeated apụta construction blurs the distinct Greek relations—emergence from the mouth and origin in the heart—and the second clause is more naturally stated independently in Igbo.'
  naturalness: “na-esi n’ọnụ apụta na-esite n’obi apụta” is understandable but unnecessarily repetitive and awkward. “Ọ bụ n’obi ka ha si apụta” clearly expresses the heart as the source, while “ihe ndị ahụ na-emerụ mmadụ” is direct and idiomatic.
  terminology: “Obi” appropriately retains the biblical sense of the inner moral self. “Na-emerụ mmadụ” is an established concise rendering in this purity context; the footnote properly supplies “ime ka mmadụ ghara ịdị ọcha.” The note about the generic singular should state precisely that Greek uses a singular form with representative meaning.
  issues:
  - severity: medium
    issue: The two occurrences of “apụta” are joined in a way that is repetitive and weakens the distinction between emergence from the mouth and origin in the heart.
    rationale: The Greek first identifies the things as coming out of the mouth, then says they come out of the heart. Recasting the latter as “ọ bụ n’obi ka ha si apụta” preserves this relation naturally.
  - severity: low
    issue: The footnote’s explanation of the generic singular is imprecise.
    rationale: It should explain that the Greek word is singular but represents humankind generally, rather than saying merely that a single person is used to represent all people.
  revised_text: Ma ihe ndị na-esi n’ọnụ apụta, ọ bụ n’obi ka ha si apụta; ihe ndị ahụ na-emerụ mmadụ.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “na-eme ka mmadụ ghara ịdị ọcha.” N’asụsụ Grik, “mmadụ” dị n’otu ma ọ na-anọchite anya mmadụ n’ozuzu.
    reason: lexical_alternative
  revision_rationale: The revision removes an awkward repetition while preserving the source’s mouth/heart imagery, the plural reference to the things spoken, and the purity sense of κοινόω. The footnote retains the lexical alternative and gives a more accurate explanation of the Greek representative singular.
