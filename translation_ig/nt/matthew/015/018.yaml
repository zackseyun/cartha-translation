  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: ig
  text: Ma ihe ndị na-esi n’ọnụ apụta, ọ bụ n’obi ka ha si apụta; ihe ndị ahụ na-emerụ mmadụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-eme ka mmadụ ghara ịdị ọcha.” N’asụsụ Grik, “mmadụ” dị n’otu ma ọ na-anọchite anya mmadụ n’ozuzu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: ihe ndị na-esi ... apụta
  rationale: Akụkụ okwu a dị n’ụdị ọtụtụ ma na-arụ ọrụ dị ka aha. Nsụgharị a chekwara ụdị ọtụtụ ahụ na onyinyo nke ihe na-apụta.
- source_word: στόματος
  choice: ọnụ
  rationale: Nke a bụ okwu Igbo doro anya ma kwekọọ n’onyinyo akụkụ ahụ e ji kọwaa okwu mmadụ na-ekwu.
- source_word: καρδίας
  choice: obi
  rationale: “Obi” bụ okwu Baịbụl na Igbo ji egosi ime mmadụ, gụnyere echiche, ọchịchọ, na ebumnobi ya; ọ na-echekwa obosara echiche okwu Grik ahụ.
- source_word: ἐξέρχεται
  choice: na-esite ... apụta
  rationale: Ọ na-egosi isi iyi ihe ndị ahụ, ma na-ejikọkwa nke ọma na onyinyo nke ha isi n’ọnụ pụta.
- source_word: κἀκεῖνα
  choice: ọ bụkwa ihe ndị ahụ
  rationale: Nke a na-ezo aka n’ụzọ doro anya n’ihe ndị si n’ọnụ apụta ma na-echekwa njikọ “na ndị ahụ” dị na Grik.
- source_word: κοινοῖ
  choice: na-emerụ
  rationale: N’ọnọdụ a gbasara ịdị ọcha, okwu a pụtara imerụ mmadụ ma ọ bụ ime ka ọ ghara ịdị ọcha. “Na-emerụ” dị nkenke ma bụrụ okwu Igbo kwụ ọtọ, ebe e debere nkọwa ọzọ n’ala ala peeji.
- source_word: τὸν ἄνθρωπον
  choice: mmadụ
  rationale: Otu onye a kpọrọ aha na Grik na-anọchite anya mmadụ n’ozuzu ya. “Mmadụ” na-enye echiche ahụ n’Igbo n’enweghị ịgbakwunye na ọ bụ nwoke kpọmkwem.
theological_decisions:
- issue: Isi mmalite nke ihe na-emerụ mmadụ n’ụzọ omume
  choice: E chekwara “obi” dị ka ebe ihe ndị si n’ọnụ apụta malitere.
  alternative: Ịkọwa amaokwu ahụ nanị dị ka okwu banyere adịghị ọcha n’emume okpukpe.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi ọdịiche dị n’etiti ihe si n’èzí abanye mmadụ na ihe si n’ime ya apụta. Nsụgharị ahụ echekwaghị naanị echiche gbasara emume, ọ naghịkwa agbasawanye ihe amaokwu ahụ kwuru.
- issue: Otu onye nọchiri anya mmadụ niile na τὸν ἄνθρωπον
  choice: A sụgharịrị ya “mmadụ,” nke na-arụ ọrụ dị ka otu onye nọchiri anya mmadụ niile n’Igbo.
  alternative: “nwoke ahụ” ma ọ bụ “onye ahụ”
  rationale: Ọ bụ ezie na ἄνθρωπος bụ aha Grik nke ọdịdị ya bụ oke, ebe a ọ na-ezo aka n’ụdị mmadụ n’ozuzu, ọ bụghị nanị nwoke. “Mmadụ” na-echekwa echiche a n’ụzọ kacha mma n’asụsụ Igbo.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A chekwara nkwughachi onyinyo “isi n’ọnụ apụta” na “isite n’obi apụta,” yana mgbagwoju echiche nke κοινόω dị n’etiti imerụ mmadụ na ime ka ọ ghara ịdị ọcha.
