id: MAT.15.9
reference: Matthew 15:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: ig
  text: Ma ha na-efe m n’efu, na-akụzi iwu ndị mmadụ dịka ozizi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “na-akụzi ihe ndị mmadụ nyere n’iwu dịka ozizi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μάτην
  choice: n’efu
  rationale: Ọ na-egosi na ofufe ahụ enweghị uru ma ọ bụ ihe ọ na-arụpụta; “n’efu” bụ okwu Igbo doro anya ma na-edobe ụda amụma nke ikpe.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị ntụgharị ma ọ bụ mmegide n’ihe gbara amaokwu ahụ gburugburu.
- source_word: σέβονταί
  choice: ha na-efe
  rationale: N’ebe Chineke nọ, ngwaa a pụtara ịsọpụrụ ya n’ụzọ ofufe; “na-efe” bụ ụzọ Igbo nkịtị si kwuo ya.
- source_word: με
  choice: m
  rationale: Ọ bụ nnọchiaha onye mbụ nke bụ ihe a na-eme ihe n’ahịrịokwu ahụ, na-ezo aka n’ebe Chineke nọ n’okwu e hotara n’Aịzaya.
- source_word: διδάσκοντες
  choice: na-akụzi
  rationale: Ọ na-edobe ọdịdị participle ahụ ma jikọta ihe ha na-akụzi na ofufe ha n’ebughị ụzọ kpebie ma ọ bụ naanị oge, ụzọ, ma ọ bụ ihe kpatara ya.
- source_word: διδασκαλίας
  choice: dịka ozizi
  rationale: '“Dịka ozizi” na-eme ka njikọ okwu Grik dị mkpụmkpụ doo anya: a na-enye iwu mmadụ ọnọdụ nke ozizi nwere ikike.'
- source_word: ἐντάλματα
  choice: iwu
  rationale: Ọ na-ezo aka n’ihe e nyere mmadụ iwu ka o mee; “iwu” dabara n’asụsụ Igbo okpukpe ma ghara ịdị arọ karịa isi mmalite.
- source_word: ἀνθρώπων
  choice: ndị mmadụ
  rationale: ἄνθρωπος bụ okwu izugbe maka ụmụ mmadụ ebe a, ọ bụghị naanị ụmụ nwoke; “ndị mmadụ” na-edobe ọdịiche dị n’etiti ihe sitere n’aka mmadụ na ihe sitere n’aka Chineke.
theological_decisions:
- issue: Nkọwa nke διδασκαλίας ἐντάλματα ἀνθρώπων
  choice: na-akụzi iwu ndị mmadụ dịka ozizi
  alternative: na-akụzi dịka ozizi ihe ndị mmadụ nyere n’iwu
  rationale: Nkebi Grik ahụ dị mkpụmkpụ ma nwee ike ịhazi ya n’ụzọ karịrị otu. Nhọrọ a na-egosi na a na-akụzi iwu sitere n’aka mmadụ dịka ozizi nwere ikike, ma ihe ọzọ e dere n’ala peeji na-echekwa ụzọ ọzọ e nwere ike isi kwuo njikọ ahụ.
- issue: Ike izugbe nke ἀνθρώπων
  choice: ndị mmadụ
  alternative: ụmụ mmadụ
  rationale: Okwu Grik ahụ na-ekwu maka mmadụ n’ozuzu, na-emegide ihe sitere n’aka Chineke; ọ naghị akọwapụta nwoke naanị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “ofufe n’efu” mee ka μάτην metụta ofufe ahụ nke ọma; e zere okwu na-egosi ozizi otu ụka kpọmkwem.
