revisions:
- from: Ma ha na-efe m ofufe n’efu, na-akụzi iwu ndị mmadụ dịka ozizi.[a]
  to: Ma ha na-efe m n’efu, na-akụzi iwu ndị mmadụ dịka ozizi.[a]
  rationale: The revision removes an unneeded repetition in the worship clause while retaining every semantic element of the source. The footnote preserves a natural alternative that expresses ἐντάλματα as commands issued by people, without claiming a textual variant or adding theological interpretation.
  reviewer_model: gpt-5.6-terra
