id: MAT.15.3
reference: Matthew 15:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: ig
  text: Ma ọ zara ha, sị, “Gịnị mere unu kwa ji emebi iwu Chineke n’ihi ọdịnala unu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ọ zara ha, sị
  rationale: Nke a na-edobe ma echiche nke ‘ịza’ ma nke ‘ikwu,’ ma na-eji usoro okwu Igbo dị n’ụzọ ebumpụta ụwa.
- source_word: Διὰ τί
  choice: Gịnị mere
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị ajụ ihe kpatara omume.
- source_word: καὶ ὑμεῖς
  choice: unu onwe unu kwa
  rationale: '‘Kwa’ na-egosi ‘also,’ ebe ‘onwe unu’ na-enye nrụgide dị n’okwu ahụ: ndị na-ebo ndị ọzọ ebubo na-emekwa mmebi.'
- source_word: παραβαίνετε
  choice: ji emebi
  rationale: ‘Imebi iwu’ na-egosi ịgabiga ma ọ bụ imegide ihe e nyere n’iwu, ma bụrụ okwu doro ndị na-agụ Igbo nke oge a anya.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: iwu Chineke
  rationale: Nke a na-edobe isi echiche nke iwu sitere n’aka Chineke, ma bụrụkwa okwu Igbo dị nkenke ma doo anya.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: n’ihi ọdịnala unu
  rationale: διά na accusative ebe a na-egosi ihe kpatara ya ma ọ bụ ihe a na-adabere na ya. ‘Ọdịnala unu’ na-edobe ọdịiche dị n’etiti iwu Chineke na ihe ha natara ma nyefee.
theological_decisions:
- issue: Ọdịiche dị n’etiti ikike Chineke na ọdịnala mmadụ
  choice: iwu Chineke ... n’ihi ọdịnala unu
  alternative: iwu Chineke ... maka ọdịnala unu
  rationale: Nsụgharị a na-eme ka esemokwu dị n’etiti iwu Chineke na ọdịnala ndị a kpọrọ okwu pụta ìhè, n’ebughị ụzọ kwuo na ọdịnala niile dị njọ. ‘N’ihi’ na-ahapụkwa echiche nke ihe kpatara ya, ebe ndetu ala na-egosi nghọta ọzọ nwere ike ịdị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ‘ọ zara ha, sị’ na-egosipụta ọdịdị okwu Grik n’enweghị ịmanye Igbo; ‘unu onwe unu kwa’ na-edobe nrụgide nke καὶ ὑμεῖς.
