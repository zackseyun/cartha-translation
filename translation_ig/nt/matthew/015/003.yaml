review_pass:
  verdict: revise
  source_fidelity: 'The main rendering accurately conveys the Greek: Jesus answers them, asks the reason, retains the corresponding force of καὶ ὑμεῖς (‘you also’), and contrasts God’s command with their tradition. ‘N’ihi ọdịnala unu’ suitably renders διὰ τὴν παράδοσιν ὑμῶν as cause/reason.'
  naturalness: ‘Ọ zara ha, sị’ and ‘imebi iwu Chineke’ are natural Standard Igbo. Reordering ‘unu onwe unu kwa’ to ‘unu kwa’ is more idiomatic and preserves the source emphasis without adding the stronger reflexive emphasis ‘yourselves.’
  terminology: ‘Iwu Chineke’ is an established and clear rendering for God’s command in this context, and ‘ọdịnala unu’ properly renders παράδοσις without implying that all tradition is condemned.
  issues:
  - severity: medium
    issue: The footnote’s alternative, ‘iji kwado ọdịnala unu,’ changes the relation expressed by διά.
    rationale: It means ‘in order to support/uphold your tradition,’ introducing an explicit purpose that is not stated in Matthew 15:3. The Greek here directly presents their tradition as the reason/occasion for their transgression. The footnote should therefore be removed rather than preserve a misleading lexical alternative.
  - severity: low
    issue: ‘unu onwe unu kwa’ is unnecessarily emphatic.
    rationale: καὶ ὑμεῖς means ‘you also.’ ‘Unu kwa’ carries this correspondence naturally; ‘onwe unu’ adds a reflexive emphasis not required by the Greek.
  revised_text: Ma ọ zara ha, sị, “Gịnị mere unu kwa ji emebi iwu Chineke n’ihi ọdịnala unu?”
