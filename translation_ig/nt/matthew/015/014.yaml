  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: ig
  text: Hapụnụ ha ka ha dị; ha bụ ndị ndu kpuru ìsì na-edu ndị ìsì.[a] Ma ọ bụrụ na onye ìsì eduo onye ìsì,[b] ha abụọ ga-adaba n’olulu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “ndị ndu kpuru ìsì nke ndị ìsì.”
    reason: lexical_alternative
  - marker: b
    text: Otu “onye ìsì” e kwuru n’ilu a na-anọchite anya mmadụ n’ozuzu, ọ bụghị naanị nwoke.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “n’ọwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: Hapụnụ ha
  rationale: Ọ bụ iwu ka a hapụ ha, ma ọ pụtaghị ‘gbaghara ha.’ Nke a na-egosipụta nkenke na ike nke okwu Grik.
- source_word: τυφλοί
  choice: ndị ... kpuru ìsì
  rationale: A hapụrụ ihe atụ nke ikpu ìsì dịka isi mmalite si kwuo, n’akọwaghị ya n’ime amaokwu ahụ.
- source_word: ὁδηγοὶ τυφλῶν
  choice: ndị ndu kpuru ìsì na-edu ndị ìsì
  rationale: Nke a na-echekwa ihe oyiyi nke ndị na-edu ndị ọzọ ụzọ ma na-eme ka njikọ ya na nkebi sochirinụ doo anya n’Igbo.
- source_word: τυφλὸς ... τυφλὸν
  choice: onye ìsì ... onye ìsì ibe ya
  rationale: ‘Onye’ dabara n’ilu Igbo ma na-egosipụta onye ọbụla n’ozuzu, dịka otu onye e ji maa atụ n’asụsụ Grik.
- source_word: ἐὰν ὁδηγῇ
  choice: ọ bụrụ na ... eduo
  rationale: Nke a na-egosipụta ọnọdụ izugbe nke ἐὰν tinyere ngwaa subjunctive.
- source_word: ἀμφότεροι
  choice: ha abụọ
  rationale: Ọ na-egosipụta nke ọma na onye ndu na onye ọ na-edu ga-enweta otu ihe ahụ.
- source_word: εἰς βόθυνον πεσοῦνται
  choice: ga-adaba n’olulu
  rationale: ‘Olulu’ bụ okwu sara mbara ma doo anya maka βόθυνος, nke nwere ike ịbụ olulu ma ọ bụ ọwa miri emi.
theological_decisions:
- issue: Ihe atụ nke ikpu ìsì
  choice: E debere ‘kpuru ìsì/ndị ìsì’ dịka ihe atụ n’enweghị nkọwa agbakwunyere.
  alternative: ndị kpuru ìsì n’ime mmụọ; ndị ndu na-enweghị nghọta
  rationale: Isi mmalite ahụ n’onwe ya anaghị akọwa ihe atụ ahụ; ịkọwa ya n’ime ederede ga-emechi nghọta ya karịa ka Grik mere.
- issue: Ụdị onye e ji maa atụ n’ilu
  choice: Jiri ‘onye ìsì ... onye ìsì ibe ya.’
  alternative: nwoke kpuru ìsì ... nwoke kpuru ìsì ibe ya
  rationale: Ọ bụ ezie na Grik ji ụdị ụtọasụsụ nwoke otu, okwu Igbo ‘onye’ anaghị egosi okike ma ọ bụ nwoke ma ọ bụ nwaanyị; ọ na-echekwa ọrụ nke otu onye e ji nọchite anya mmadụ n’ozuzu n’ilu ahụ.
translation_notes:
  register: 'Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji ‘kpuru ìsì’ mee nkọwa prediket maka ndị ndu, ma jiri ‘onye ìsì/ndị ìsì’ dị ka aha mmadụ. E doziri akara nkọwa ndị Bekee nke yiri ka ha dabara n’ebe na-ezighị ezi: ọdịiche ederede dị na nkebi ‘ndị ndu kpuru ìsì na-edu ndị ìsì,’ ebe βόθυνος bụ ihe kpatara nkọwa ‘ọwa miri emi.’'
