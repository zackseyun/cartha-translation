review_pass:
  verdict: revise
  source_fidelity: 'The main sense is retained: the command to leave them, the blind-guide metaphor, the general conditional, and the shared fall into a pit. However, the draft''s footnote a incorrectly presents a textual variant and does not accurately support the wording in the SBLGNT text. “Ibe ya” adds a possessive/reciprocal nuance not expressed by the Greek.'
  naturalness: The register is clear Standard Igbo. “Hapụnụ ha ka ha dị” more clearly conveys ‘leave them alone/let them be’ than the bare “Hapụnụ ha.” Removing “ibe ya” makes the proverb more direct and idiomatic.
  terminology: “Ndị ndu kpuru ìsì,” “onye ìsì,” and “olulu” preserve the Greek imagery well. The alternative for βόθυνος should be “ọwa,” not “ọwa miri emi,” since ‘deep’ is not specified.
  issues:
  - severity: medium
    issue: Footnote a is an unsupported textual-variant note.
    rationale: The supplied SBLGNT text reads ‘blind guides of the blind’; the draft note claims that some ancient manuscripts read only ‘they are blind guides,’ without documenting a source or accurately presenting a relevant variant. It should instead give the legitimate lexical/formal alternative indicated by the audit trail.
  - severity: low
    issue: “Ibe ya” adds meaning in the conditional proverb.
    rationale: The Greek says simply ‘if a blind person guides a blind person.’ ‘Ibe ya’ (‘his/her fellow’) is not needed and may introduce a relationship nuance absent from the source.
  - severity: low
    issue: Footnote c adds ‘deep.’
    rationale: βόθυνος may mean a pit or ditch, but the Greek does not specify that it is deep.
  revised_text: Hapụnụ ha ka ha dị; ha bụ ndị ndu kpuru ìsì na-edu ndị ìsì.[a] Ma ọ bụrụ na onye ìsì eduo onye ìsì,[b] ha abụọ ga-adaba n’olulu.[c]
