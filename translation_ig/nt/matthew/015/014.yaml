- from: Hapụnụ ha; ha bụ ndị ndu kpuru ìsì na-edu ndị ìsì.[a] Ma ọ bụrụ na onye ìsì eduo onye ìsì ibe ya,[b] ha abụọ ga-adaba n’olulu.[c]
  to: Hapụnụ ha ka ha dị; ha bụ ndị ndu kpuru ìsì na-edu ndị ìsì.[a] Ma ọ bụrụ na onye ìsì eduo onye ìsì,[b] ha abụọ ga-adaba n’olulu.[c]
  rationale: The revision preserves the source’s metaphor and general-proverb form while clarifying the initial imperative. It replaces an unsupported textual note with a formal lexical alternative, removes an added reciprocal nuance, and gives a source-faithful alternative for βόθυνος.
  reviewer_model: gpt-5.6-terra
