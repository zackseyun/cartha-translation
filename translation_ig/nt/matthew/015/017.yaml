  - severity: low
    issue: Nkọwa ala peeji «ebe nsị na-asọba» adịghị eke nke ọma dịka ụzọ ọzọ maka ἀφεδρών.
    rationale: «Ebe a na-atụfu nsị» na-ekwu ebe mwepụ nsị na-eme n’ụzọ doro anya ma na-edobe nhọrọ «latrine/privy» n’enweghị ịgbatị ihe ederede kwuru.
