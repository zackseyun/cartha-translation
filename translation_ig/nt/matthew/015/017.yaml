review_pass:
  verdict: revise
  source_fidelity: Nkọwa ahụ na-edobe nke ọma ajụjụ mba, ihe ọ bụla na-abanye n’ọnụ, ịgafe n’afọ, na mwepụ ya n’ebe nsị. Otú ọ dị, «a chụpụ ya» na-ada ka omume emechara ma ọ bụ nke a ga-eme, ebe ngwaa Grik ἐκβάλλεται bụ ugbu a ma na-ekwu eziokwu a na-eme n’ozuzu. «A na-achụpụ ya» na-edobe akụkụ a nke ọma.
  naturalness: «Ọ̀ bụ na unu aghọtaghị» na «ihe niile na-abanye n’ọnụ na-aga n’afọ» bụ Standard Igbo eke ma doo anya. Idochite «e mesịa a chụpụ ya» anya na «mesịa a na-achụpụ ya» na-eme ka usoro mgbari nri a bụrụ nkọwa izugbe nke na-ada n’Igbo ugbu a.
  terminology: «Afọ» dabara adaba maka κοιλία n’ebe a; «ụlọ mposi» bụ okwu ugbu a, kwụ ọtọ, maka ἀφεδρών. Nkọwa ala peeji a gbanwere ka ụzọ ọzọ ahụ bụrụ Igbo eke ma nọgide na-egosi echiche «ebe nsị/latrine», na-enweghị ịgbakwunye nkọwa okpukpe.
  issues:
  - severity: low
    issue: Oge/aspect nke «a chụpụ ya» anaghị egosi nke ọma ugbu a izugbe nke ἐκβάλλεται.
