  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: ig
  text: Ọ̀ bụ na unu aghọtaghị na ihe niile na-abanye n’ọnụ na-aga n’afọ, mesịa a na-achụpụ ya n’ụlọ mposi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ọ bụla na-abanye n’ọnụ ... a na-achụpụ ya n’ebe a na-atụfu nsị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νοεῖτε
  choice: aghọtaghị
  rationale: Ngwaa a na-ekwu maka ịghọta ihe Jizọs na-akụzi, ọ bụghị naanị ịhụ ma ọ bụ ịmata ihe; ụdị ajụjụ a na-egosikwa mba dị nro.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: ihe niile na-abanye
  rationale: Nkebi a na-ezo aka n’ozuzu ihe ọ bụla mmadụ na-eri nke na-abanye n’ọnụ.
- source_word: εἰς τὸ στόμα
  choice: n’ọnụ
  rationale: N’Igbo nkịtị, “na-abanye n’ọnụ” na-egosi mmegharị banye n’ime ọnụ n'ụzọ doro anya.
- source_word: κοιλίαν
  choice: afọ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’akụkụ ahụ ebe nri na-aga; “afọ” bụ okwu Igbo nkịtị, doro anya, ma kwesịkwa ekwesị.
- source_word: χωρεῖ
  choice: na-aga
  rationale: N’ọnọdụ mgbari nri a, ọ na-akọwa ụzọ nri si agafe banye n’afọ; “na-aga n’afọ” bụ Igbo eke.
- source_word: ἀφεδρῶνα
  choice: ụlọ mposi
  rationale: Okwu Grik a pụtara ebe a na-anyụ nsị. “Ụlọ mposi” bụ okwu ugbu a, kwanyere ugwu, nke ndị mmadụ na-aghọta ngwa ngwa.
- source_word: ἐκβάλλεται
  choice: a chụpụ ya
  rationale: Ụdị a na-edobe olu nnara nke Grik ma na-egosi na a na-ewepụ ihe ahụ n’ahụ n’enweghị okwu rụrụ arụ.
theological_decisions:
- issue: Mmekọrịta okwu Jizọs a na iwu gbasara ịdị ọcha n’emume okpukpe
  choice: A sụgharịrị nkọwa gbasara ụzọ nri si aga n’ahụ n’ụzọ kwụ ọtọ, n’etinyeghị okwu ọzọ na-ekwu na e meela nri niile ka ha dị ọcha.
  alternative: Ịgbakwunye nkọwa na Jizọs si otú a kwupụta na nri niile dị ọcha.
  rationale: Amaokwu a n’onwe ya na-akọwa mgbari na mwepụ nri, dịka akụkụ arụmụka Jizọs banyere ihe na-emerụ mmadụ; ọ naghị ekwu kpọmkwem nkọwa dị na Mak 7:19. Ya mere, nsụgharị ahụ na-edobe esemokwu nkà mmụta okpukpe dị n’ederede kama idozi ya site n’ịgbakwụnye nkọwa.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma kwanyere ugwu. “Ụlọ mposi” na-enye ihe ἀφεδρών pụtara n’ụzọ ndị na-agụ akwụkwọ taa ga-aghọta; nkọwa ala peeji na-edobe ụzọ ọzọ e nwere isi ghọta ebe a na-ewepụ nsị.
