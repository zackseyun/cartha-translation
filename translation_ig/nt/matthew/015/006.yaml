  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: ig
  text: Ọ dịghị mkpa ma ọlị ka ọ sọpụrụ nna ya[b]. Unu ejirila ọdịnala unu mee ka okwu Chineke ghara ịdị ire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ odide nwere “iwu Chineke” n’ọnọdụ “okwu Chineke.”
    reason: textual_variant
  - marker: b
    text: N’ebe a, “sọpụrụ” nwere ike ịgụnye ọrụ ilekọta nna ma ọ bụ nne mmadụ, ọ bụghị naanị igosi ha nsọpụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: ọ dịghị mkpa ma ọlị
  rationale: N’ọnọdụ a, nkw否 siri ike a na-egosi na ọdịnala ahụ mere ka a were ọrụ ahụ dị ka ihe a na-agaghịzi achọ; ‘ma ọlị’ na-echekwa ike οὐ μή.
- source_word: τιμήσει
  choice: sọpụrụ
  rationale: ‘Sọpụrụ’ bụ ụzọ nkịtị e si sụgharịa τιμάω, ma ọ na-ahapụkwa ihe gbara okwu a gburugburu—ilekọta nne na nna n’ụzọ bara uru—ka ọ pụta ìhè n’enweghị ime ka ihe okwu Grik pụtara dị warara.
- source_word: πατέρα αὐτοῦ
  choice: nna ya
  rationale: Ederede Grik e nyere kpọrọ naanị nna n’otu onye; a gbasaghị ya ka ọ bụrụ ‘nna ya na nne ya.’
- source_word: ἠκυρώσατε
  choice: mee ka ... ghara ịdị ire
  rationale: Nkebi okwu Igbo a na-egosipụta ἀκυρόω dị ka ime ka ihe ghara inwe ikike ma ọ bụ mmetụta, n’asụsụ doro anya nke ndị mmadụ na-asụ ugbu a.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: okwu Chineke
  rationale: A gbasoro λόγον nke SBLGNT kpọmkwem; a debeghị ụdị ọgụgụ ‘iwu Chineke’ n’ahịrị bụ isi.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: n’ọdịnala unu
  rationale: N’ebe a, διά na accusative na-egosi ihe kpatara ya ma ọ bụ ụzọ ihe ahụ si mee; ‘n’ọdịnala unu’ bụ Igbo ebumpụta ụwa nke na-ejigide njikọ ahụ n’enweghị ịgbakwunye nkọwa.
theological_decisions:
- issue: Ma a ga-akọwa ‘sọpụrụ’ kpọmkwem dị ka inye nne na nna nkwado ihe onwunwe
  choice: E debere ‘sọpụrụ’ n’ahịrị bụ isi, tinye nkọwa ya n’ala peeji.
  alternative: ‘lekọta’ ma ọ bụ ‘na-enye nna ya ihe o ji ebi ndụ’
  rationale: Esemokwu a metụtara ọrụ bara uru e kwesịrị ịrụ nne na nna, ma τιμάω pụtara n’ụzọ sara mbara ‘sọpụrụ.’ Nhọrọ a na-echekwa njikọ ya na iwu ahụ ma ghara ime ka okwu ahụ dị warara karịa Grik.
- issue: Ma a ga-eme ka ederede kwekọọ na amaokwu ndị gbara ya gburugburu ma ọ bụ ụdị ọgụgụ ọzọ
  choice: A sụgharịrị ‘nna ya’ na ‘okwu Chineke’ dịka SBLGNT si dị.
  alternative: ‘nna ya ma ọ bụ nne ya’ na ‘iwu Chineke’
  rationale: A gbasoro ederede Grik e nyere, kama ịgbasa ‘nna’ site n’amaokwu ndị gbara ya gburugburu ma ọ bụ ibubata ụdị ọgụgụ ọzọ n’ahịrị bụ isi.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. A họọrọ ‘ọ dịghị mkpa ma ọlị’ iji gosi nkw否 siri ike ahụ n’ụzọ dabara n’okwu banyere ịhapụ ọrụ; a họọrọ ‘mee ka ... ghara ịdị ire’ maka okwu siri ike ma doo anya banyere imebi ikike okwu Chineke.
