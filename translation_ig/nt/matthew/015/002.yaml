id: MAT.15.2
reference: Matthew 15:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: ig
  text: “Gịnị mere ndị na-eso ụzọ gị ji emebi ọdịnala ndị okenye? N’ihi na ha anaghị asa aka ha mgbe ha na-eri achịcha[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, usoro ịsa aka nke ọdịnala ndị okenye chọrọ, ọ bụghị naanị ịsa aka nkịtị iji mee ka aka dị ọcha.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “mgbe ha na-eri nri”; okwu Grik a sụgharịrị “achịcha” nwere ike mgbe ụfọdụ ịpụta nri n’ozuzu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: Gịnị mere
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ajụ ihe kpatara otu omume.
- source_word: οἱ μαθηταί σου
  choice: ndị na-eso ụzọ gị
  rationale: Ọ na-egosi ndị na-amụta ihe n’aka onye nkụzi ma na-eso ya; nkebiokwu a bụ nke a na-aghọta nke ọma n’Igbo.
- source_word: παραβαίνουσιν
  choice: na-emebi
  rationale: Ọ pụtara ịgafe oke ma ọ bụ imegide iwu ma ọ bụ ọdịnala; ‘imebi’ na-enye echiche ahụ n’Igbo n’enweghị asụsụ iwu siri ike.
- source_word: τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: ọdịnala ndị okenye
  rationale: ‘Ọdịnala’ na-echekwa echiche nke ihe e nyefere site n’aka ndị bu ụzọ, ebe ‘ndị okenye’ na-egosi ndị isi na ndị gara aga nwere ikike, ọ bụghị naanị ndị mere agadi.
- source_word: νίπτονται τὰς χεῖρας αὐτῶν
  choice: ha anaghị asa aka ha
  rationale: νίπτω na-ekwu maka ịsa akụkụ ahụ, karịsịa aka ma ọ bụ ụkwụ; nke a bụkwa usoro okwu Igbo eke.
- source_word: ὅταν
  choice: mgbe
  rationale: Ya na ngwaa dị n’ọnọdụ subjunctive, ọ na-egosi ihe a na-emekarị; ‘mgbe’ na-eburu echiche ahụ nke ọma n’ọnọdụ a.
- source_word: ἄρτον
  choice: achịcha
  rationale: Nke a na-echekwa okwu nkịtị nke Grik, ọ bụ ezie na ‘achịcha’ nwekwara ike ịnọchite anya nri ma ọ bụ iri nri n’ozuzu.
- source_word: ἐσθίωσιν
  choice: na-eri
  rationale: Ọ na-egosi omume a na-emekarị mgbe ὅταν gasịrị; ụdị ugbu a nke Igbo dabara nke ọma.
theological_decisions:
- issue: Ụdị ịsa aka a na-ekwu maka ya
  choice: E debere ya dịka esemokwu banyere ọdịnala ndị okenye, n’etinyeghị nkọwa ‘emume nsacha’ ma ọ bụ ‘ịdị ọcha nkịtị’ n’ahịrị isi.
  alternative: Ịsụgharị ya kpọmkwem dịka ịsa aka maka ịdị ọcha n’emume, ma ọ bụ dịka ịsa aka nkịtị maka idebe ahụ ọcha.
  rationale: Amaokwu ahụ n’onwe ya jikọtara ịsa aka ahụ na ọdịnala ndị okenye, ma ọ kọwaghị kpọmkwem ụdị ma ọ bụ nzube ya. Ihe odide bụ isi kwesịrị ịhapụ obosara ahụ, ebe nkọwa ala peeji na-enye ihe gbasara ọnọdụ omenala.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘ndị na-eso ụzọ’ maka μαθηταί na ‘ọdịnala ndị okenye’ iji chekwaa ikike nke παράδοσις n’ọnọdụ a. E tinyere akara ala peeji [a] na [b] kpọmkwem n’ahịrị isi.
