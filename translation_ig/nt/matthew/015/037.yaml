id: MAT.15.37
reference: Matthew 15:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ⸂τὸ περισσεῦον τῶν κλασμάτων ἦραν⸃ ἑπτὰ σπυρίδας πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/037.yaml
  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: ig
  text: Ha niile riri nri, afọ jukwara ha; ha chịkọtara iberibe nri ndị fọdụrụ—nkata[a] asaa jupụtara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “nkata” (spyridas) nwere ike izo aka n’ụdị nkata buru ibu karịa nke a kpọrọ aha n’akụkọ ụfọdụ ndị ọzọ banyere inye ìgwè mmadụ nri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: riri nri
  rationale: N'Igbo, “riri nri” na-ekwupụta omume iri ihe n'ụzọ doro anya ma bụrụkwa okwu nkịtị, ọ bụ ezie na Grik ekwughị kpọmkwem ihe e riri.
- source_word: πάντες
  choice: Ha niile
  rationale: Nke a na-echekwa mkpokọta mmadụ niile n'ìgwè ahụ ma na-ada nke ọma n'Igbo.
- source_word: ἐχορτάσθησαν
  choice: rijukwa afọ
  rationale: Ọ na-egosi na ha riri ruo mgbe afọ juru ha, ọ bụghị nanị na ha detụrụ nri.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: iberibe nri ndị fọdụrụ
  rationale: Nke a na-ejikọta echiche nke iberibe e tipịara na ihe fọdụrụ n'ụzọ doro anya ma dị mfe nghọta.
- source_word: ἦραν
  choice: chịkọtara
  rationale: N'ọnọdụ a, αἴρω pụtara ịtụtụkọta ihe ndị fọdụrụ; “chịkọtara” bụ okwu Igbo kwesịrị ekwesị maka omume ahụ.
- source_word: ἑπτὰ
  choice: asaa
  rationale: Ntụgharị kpọmkwem nke ọnụ ọgụgụ ahụ.
- source_word: σπυρίδας
  choice: nkata ukwu
  rationale: σπυρίς nwere ike izo aka n'ụdị nkata buru ibu; itinye “ukwu” n'amaokwu na-echekwa ọdịiche okwu Grik ahụ.
- source_word: πλήρεις
  choice: ha ejuo
  rationale: Nke a na-egosi na nkata asaa ahụ jupụtara na iberibe ndị fọdụrụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “nkata ukwu” chekwaa nkọwa pụrụ iche nke σπυρίς; akara ntụaka [a] dị n'amaokwu ma kwekọọ na nkọwa ala peeji.
