  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: ig
  text: Ọ kpọrọ ìgwè mmadụ ahụ ka ha bịakwute ya, wee sị ha, “Geenụ ntị, ghọtaanụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Ọ ... -kwara
  rationale: Ihe mgbakwunye -kwara na-aga n’ihu n’akụkọ ahụ n’ụzọ Igbo nkịtị, na-enweghị ịgbakwunye nkọwa ọhụrụ.
- source_word: προσκαλεσάμενος
  choice: kpọkwara ... ka ha bịakwute ya
  rationale: Nke a na-egosi na ọ kpọrọ ìgwè mmadụ ahụ ka ha bịaruo ya nso; usoro ahịrịokwu Igbo na-eme ka omume a buru ụzọ pụta tupu ‘sị ha.’
- source_word: τὸν ὄχλον
  choice: ìgwè mmadụ ahụ
  rationale: Nke a bụ okwu Igbo doro anya maka ìgwè ndị gbakọtara, ma njirimara ‘ahụ’ na-ezo aka n’ìgwè ahụ a maara n’akụkọ ahụ.
- source_word: εἶπεν αὐτοῖς
  choice: sị ha
  rationale: ‘Sị ha’ bụ ụzọ Igbo dị mkpirikpi ma bụrụkwa nke e ji asụkarị εἶπεν αὐτοῖς.
- source_word: Ἀκούετε
  choice: Geenụ ntị
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha lebara ihe a ga-ekwu anya, ọ bụghị naanị ka ụda ruo ha ntị.
- source_word: συνίετε
  choice: ghọtakwanu
  rationale: Nke a na-akpọ ha ka ha ghọta ihe okwu ahụ pụtara; ụdị ọtụtụ mmadụ nke iwu ahụ ka e chekwara.
theological_decisions: []
translation_notes:
  register: 'Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere iwu abụọ ahụ n’ụdị ọtụtụ mmadụ: ‘Geenụ ... ghọtakwanu.’ Enweghị ihe mgbakwunye nke otu ụka ma ọ bụ nkọwa nkà mmụta okpukpe etinyere.'
