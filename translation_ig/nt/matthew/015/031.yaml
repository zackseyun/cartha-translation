  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: ig
  text: Nke a mere ka ìgwè mmadụ ahụ juo anya mgbe ha hụrụ ndị ogbi[a] ka ha na-ekwu okwu, ndị nwere aka ma ọ bụ ụkwụ nkwarụ ka ahụ dị ha mma[b], ndị ngwọrọ ka ha na-eje ije, na ndị ìsì ka ha na-ahụ ụzọ. Ha wee nye Chineke nke Izrel otuto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ntị chiri.” Okwu Grik ahụ nwere ike ịpụta ndị ntị chiri ma ọ bụ ndị ogbi; a họọrọ “ndị ogbi” n’ebe a n’ihi na ihe e mesiri ike ozugbo bụ na ha na-ekwu okwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị akụkụ ahụ ha merụrụ arụ ka e mere ka ha zuo oke.” Okwu Grik ahụ na-akọwa ndị aka ha ma ọ bụ ụkwụ ha nwere nkwarụ ma ọ bụ merụrụ arụ, bụ́ ndị a gwọrọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: N’ihi ya
  rationale: Na-egosi ihe si n’ọgwụgwọ ndị e kwuru n’ihu pụta n’ụzọ Igbo dị mma.
- source_word: τὸν ὄχλον
  choice: ìgwè mmadụ ahụ
  rationale: Ọ bụ okwu Igbo doro anya maka ìgwè ndị nọ n’ebe ahụ.
- source_word: θαυμάσαι
  choice: juru anya
  rationale: Na-egosipụta oke ihe ijuanya nke ìgwè mmadụ ahụ nwere.
- source_word: βλέποντας
  choice: mgbe ha hụrụ
  rationale: Na-akọwa ihe mere ìgwè mmadụ ahụ ji ju anya, ma na-eme ka ahịrịokwu ahụ gaa nke ọma n’Igbo.
- source_word: κωφοὺς
  choice: ndị ogbi
  rationale: Ọ bụ ezie na okwu Grik ahụ nwere ike ịpụta ndị ntị chiri ma ọ bụ ndị ogbi, λαλοῦντας, ‘na-ekwu okwu,’ na-akwado ‘ndị ogbi’ n’ebe a.
- source_word: λαλοῦντας
  choice: ka ha na-ekwu okwu
  rationale: Na-egosipụta ikike ikwu okwu e weghachiri ha n’ụzọ doro anya.
- source_word: κυλλοὺς
  choice: ndị aka ha ma ọ bụ ụkwụ ha nwere nkwarụ
  rationale: Na-egosipụta kpọmkwem ndị akụkụ aka ma ọ bụ ụkwụ ha nwere nkwarụ ma ọ bụ merụrụ arụ, ma zere okwu Igbo nwere ike ịgwakọta ha na χωλοί.
- source_word: ὑγιεῖς
  choice: ka ahụ ha dịzi mma
  rationale: Na-edobe ya dị ka nkọwa ọnọdụ ahụike ha ugbu a, dịka adjective Grik ahụ si dị, ma bụrụkwa okwu Igbo eke.
- source_word: χωλοὺς
  choice: ndị ngwọrọ
  rationale: Okwu Igbo a na-ejikarị akọwa ndị na-enweghị ike ịga ije nke ọma.
- source_word: περιπατοῦντας
  choice: ka ha na-eje ije
  rationale: Na-enye ihe okwu ahụ pụtara kpọmkwem n’usoro ọrụ ebube a.
- source_word: τυφλοὺς
  choice: ndị ìsì
  rationale: Ọ bụ okwu Igbo kwụ ọtọ ma bụrụ nke a na-aghọta nke ọma.
- source_word: βλέποντας
  choice: ka ha na-ahụ ụzọ
  rationale: N’ebe a, ọ na-egosi na ndị ìsì enwetaghachila ịhụ ụzọ.
- source_word: ἐδόξασαν
  choice: nye ... otuto
  rationale: Na-edobe echiche nke inye Chineke ebube ma ọ bụ otuto n’ihi ọrụ ebube ya.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: Chineke nke Izrel
  rationale: Na-edobe njikọ aha ahụ n’ụzọ kwekọrọ na Grik ma doo anya n’Igbo.
theological_decisions:
- issue: Ihe κωφοὺς pụtara na κωφοὺς λαλοῦντας
  choice: ndị ogbi ka ha na-ekwu okwu
  alternative: ndị ntị chiri ka ha na-ekwu okwu
  rationale: κωφός nwere ike ịpụta onye ntị chiri ma ọ bụ onye ogbi; mana okwu na-esote ya, ‘na-ekwu okwu,’ na-eme ka ‘ndị ogbi’ bụrụ nghọta kacha dabara n’ebe a. Ihe ọzọ e nwere ka edebere n’okpuru amaokwu.
- issue: Otu e si asụgharị δοξάζω mgbe ihe a na-ekwu banyere ya bụ Chineke
  choice: Ha wee nye Chineke nke Izrel otuto
  alternative: Ha wee too Chineke nke Izrel; Ha wee nye Chineke nke Izrel ebube
  rationale: ‘Nye ... otuto’ bụ Igbo eke nke na-egosi na ha kwanyere Chineke ùgwù n’ihi ọrụ ebube ndị ahụ, na-enweghị ibubata nkọwa ụka pụrụ iche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. A kewara ahịrịokwu ahụ ụzọ abụọ maka ịdị mfe n’ịgụ. E tinyere akara [a] na [b] kpọmkwem n’ebe okwu ndị nwere ụzọ ọzọ e si ghọta ha dị.
