id: MAT.15.11
reference: Matthew 15:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: ig
  text: Ọ bụghị ihe na-abanye n’ọnụ na-eme mmadụ ka ọ ghara ịdị ọcha[a][b], kama ihe na-esi n’ọnụ apụta—ọ bụ nke a na-eme mmadụ ka ọ ghara ịdị ọcha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị κοινοῖ dị ka, “na-emerụ mmadụ.” Okwu Grik ahụ nwere ike ịpụta ime ka mmadụ ghara ịdị ọcha n’echiche metụtara iwu ịdị ọcha.
    reason: lexical_alternative
  - marker: b
    text: “Mmadụ” dị ebe a n’otu, ma ọ na-anọchite anya mmadụ ọ bụla.
    reason: cultural_note
lexical_decisions:
- source_word: κοινοῖ
  choice: na-emerụ
  rationale: N’ebe a, okwu Grik a pụtara ime ka mmadụ ghara ịdị ọcha n’echiche metụtara ịdị ọcha n’ihu Chineke. “Na-emerụ” bụ okwu Igbo dị mfe ma dịkwa obosara, nke na-echekwa ma echiche adịghị ọcha nke usoro ofufe ma echiche mmebi ime mmụọ.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: ihe na-abanye n’ọnụ
  rationale: Nke a na-asụgharị participle e ji mee aha n’ụzọ Igbo sitere n’okike, ma na-echekwa echiche doro anya nke ihe na-abanye n’ọnụ.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: ihe na-esi n’ọnụ apụta
  rationale: Nkebiokwu a na-egosipụta ma isi mmalite ahụ, “n’ọnụ,” ma mmegharị ịpụta, n’Igbo doro anya ma na-aga were were.
- source_word: ἄνθρωπον
  choice: mmadụ
  rationale: “Mmadụ” bụ otu mkpụrụokwu Igbo kwesịrị ekwesị maka mmadụ n’otu n’otu, ma nwee ike ịrụ ọrụ nnọchianya maka onye ọ bụla dịka okwu Grik ahụ si dị n’ebe a.
- source_word: τοῦτο
  choice: ọ bụ nke a
  rationale: 'E kwuru okwu ngosi ahụ hoo haa iji chekwaa nkwusike nke Grik: ọ bụ nke a, ya bụ ihe na-esi n’ọnụ apụta, na-emerụ mmadụ.'
- source_word: οὐ ... ἀλλὰ
  choice: Ọ bụghị ... kama
  rationale: Usoro a na-echekwa ọdịiche siri ike dị n’etiti ihe na-abanye n’ọnụ na ihe na-esi na ya apụta, ma bụrụkwa Igbo sitere n’okike.
theological_decisions:
- issue: Asụsụ ịdị ọcha dị na κοινοῖ
  choice: Jiri “na-emerụ” n’ahịrịokwu bụ isi.
  alternative: “na-eme ka mmadụ ghara ịdị ọcha”
  rationale: “Na-emerụ” anaghị emechi okwu ahụ naanị n’adịghị ọcha nke emume, ma ọ bụ naanị na mmetọ nkịtị; ọ na-ahapụ obosara echiche nke okwu Jizọs n’arụmụka banyere ịdị ọcha.
- issue: Ọrụ nnọchianya nke ἄνθρωπον
  choice: Jiri “mmadụ” maka otu onye nke na-anọchite anya mmadụ ọ bụla.
  alternative: “otu nwoke”
  rationale: Ọ bụ ezie na okwu Grik ahụ dị n’otu, ihe a na-ekwu gbasara mmadụ n’ozuzu ya. “Mmadụ” na-echekwa otu onye ahụ n’enweghị ime ka ndị na-agụ ya chee na ọ bụ naanị nwoke ka a na-ekwu maka ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwusike nke τοῦτο site n’ikwu “ọ bụ nke a,” ma zere asụsụ ga-eme ka okwu banyere ịdị ọcha bụrụ naanị ihe emume ma ọ bụ naanị ihe gbasara unyi nkịtị.
