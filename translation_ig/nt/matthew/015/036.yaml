revisions:
- from: O weere ogbe achịcha asaa ahụ na azụ ndị ahụ, kelee ekele, nyawaa achịcha ndị ahụ, na-enye ha ndị na-eso ụzọ ya; ndị na-eso ụzọ ya nyekwa ha ìgwè mmadụ ahụ.
  to: O weere ogbe achịcha asaa ahụ na azụ ndị ahụ; mgbe o kelere ekele, o nyawaa achịcha ndị ahụ, wee na-enye ndị na-eso ụzọ ya ha; ndị na-eso ụzọ ya na-enyekwa ìgwè mmadụ ndị ahụ.
  rationale: The revision keeps the narrative sequence and the ongoing force of ἐδίδου through “na-enye” / “na-enyekwa,” while making the recipients explicit in natural Igbo. It retains the Greek plural “crowds,” does not add an explicit object to the thanksgiving, and avoids sacramental interpretation.
