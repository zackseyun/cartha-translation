id: MAT.15.36
reference: Matthew 15:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: ig
  text: O weere ogbe achịcha asaa ahụ na azụ ndị ahụ; mgbe o kelere ekele, o nyawaa achịcha ndị ahụ, wee na-enye ndị na-eso ụzọ ya ha; ndị na-eso ụzọ ya na-enyekwa ìgwè mmadụ ndị ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: O weere
  rationale: N'usoro akụkọ a, λαμβάνω na-egosi na Jizọs were nri ahụ tupu o kelee ekele ma kesa ya.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: ogbe achịcha asaa ahụ
  rationale: ἄρτος ebe a na-ezo aka n'ogbe achịcha ndị a pụrụ ịgụ ọnụ, ọ bụghị naanị achịcha n'ozuzu.
- source_word: τοὺς ἰχθύας
  choice: azụ ndị ahụ
  rationale: N'Igbo, azụ anaghị agbanwe ọdịdị ya n'ihi ọtụtụ; “ndị ahụ” na-egosi na ọ bụ azụ ndị a kpọtụrụla aha.
- source_word: εὐχαριστήσας
  choice: kelee ekele
  rationale: Nke a na-egosipụta omume ekele n'ụzọ nkịtị, na-agbakwụnyeghị onye a kelere ebe Grik ekwughị ya kpọmkwem.
- source_word: ἔκλασεν
  choice: nyawaa achịcha ndị ahụ
  rationale: κλάω n'akụkọ a bụ ịnyawa ogbe achịcha maka ikesa; ikwupụta “achịcha ndị ahụ” na-eme ka ihe a nyawara doo anya n'Igbo.
- source_word: ἐδίδου
  choice: na-enye ha
  rationale: Ụdị imperfect Grik na-egosi omume na-aga n'ihu ma ọ bụ nke a na-eme ugboro ugboro mgbe a na-ekesa nri.
- source_word: τοῖς μαθηταῖς
  choice: ndị na-eso ụzọ ya
  rationale: Dative ahụ na-egosi ndị natara nri ahụ. “Ya” bụ ihe Igbo nkịtị chọrọ ka njikọ ahụ doo anya, ọ bụ ezie na Grik etinyeghị nnọchiaha ahụ.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: ndị na-eso ụzọ ya nyekwa ha ìgwè mmadụ ahụ
  rationale: Grik hapụrụ ngwaa nke nkebi nke abụọ, ma Igbo na-etinye “nyekwa” ka omume nkesa ahụ doo anya; ὄχλοι na-ezo aka n'ìgwè mmadụ.
theological_decisions:
- issue: Mmetụta Oriri Nsọ nwere ike ịdị n'okwu εὐχαριστήσας
  choice: Kelee ekele
  alternative: Iji okwu emume okpukpe nke ga-eme ka Oriri Nsọ pụta ìhè
  rationale: Amaokwu a na-akọ na Jizọs kelere ekele maka nri. Nsụgharị ahụ ekwesịghị itinye nkọwa sacrament nke okwu Grik n'onwe ya ekwughị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. E chekwara usoro omume ahụ na ike imperfect nke ἐδίδου site n'okwu “na-enye ha,” ebe e mere nkebi ikpeazụ doro anya n'Igbo.
