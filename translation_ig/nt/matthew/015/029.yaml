  to: Mgbe Jizọs si n’ebe ahụ pụọ, ọ bịara n’akụkụ Oké Osimiri Galili[a]. Mgbe ọ rịgoro n’ugwu ahụ, ọ nọ ọdụ n’ebe ahụ.
  rationale: The revision avoids implying ascent specifically to the top of the mountain and replaces an imprecise footnote with one that accurately states the lexical ambiguity of παρά with the accusative after a motion verb. No doctrinal or interpretive change is made.
