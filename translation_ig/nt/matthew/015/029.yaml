    text: Okwu Grik a sụgharịịrị “n’akụkụ” nwere ike igosi ngagharị n’akụkụ Oké Osimiri Galili ma ọ bụ ọnọdụ n’akụkụ ya.
    reason: lexical_alternative
  revision_rationale: The revision avoids implying ascent specifically to the top of the mountain and replaces an imprecise footnote with one that accurately states the lexical ambiguity of παρά with the accusative after a motion verb. No doctrinal or interpretive change is made.
