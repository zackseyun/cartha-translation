source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: ig
  text: Mgbe Jizọs si n’ebe ahụ pụọ, ọ bịara n’akụkụ Oké Osimiri Galili[a]. Mgbe ọ rịgoro n’ugwu ahụ, ọ nọ ọdụ n’ebe ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịịrị “n’akụkụ” nwere ike igosi ngagharị n’akụkụ Oké Osimiri Galili ma ọ bụ ọnọdụ n’akụkụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: Mgbe Jizọs si n’ebe ahụ pụọ
  rationale: Aorist participle na-egosi ihe mere tupu ngwaa bụ isi; usoro ‘mgbe ... pụọ’ na-egosi usoro oge ahụ n’Igbo dị mfe ma bụrụkwa nke e ji ugwu dee.
- source_word: ἦλθεν
  choice: ọ bịara
  rationale: Nke a bụ ntụgharị nkịtị nke ngwaa ngagharị ἔρχομαι n’akụkọ, na-enweghị ịgbakwụnye nkọwa adịghị n’isi mmalite.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: n’akụkụ Oké Osimiri Galili
  rationale: παρά tinyere accusative mgbe ngwaa ngagharị dị na ya nwere ike ịpụta ịga n’akụkụ ma ọ bụ iru ebe dị n’akụkụ mmiri; ‘n’akụkụ’ na-edobe ohere nghọta abụọ ahụ.
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: Mgbe ọ rịgoro n’elu ugwu ahụ
  rationale: Aorist participle na-egosi na ịrịgo ahụ buru ịnọdụ ụzọ; ‘n’elu ugwu ahụ’ bụ Igbo eke maka ngagharị ịrịgo gaa n’ugwu.
- source_word: ἐκάθητο
  choice: ọ nọ ọdụ
  rationale: Imperfect ἐκάθητο na-egosi ọnọdụ na-aga n’ihu n’oge gara aga; ‘ọ nọ ọdụ’ na-echekwa akụkụ ahụ karịa ‘ọ nọdụrụ ala.’
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: Ọ bụ ntụgharị doro anya nke adverb na-egosi ebe.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: A sụgharịrị aha ahụ dịka mkpọpụta e ji eme ihe n’Igbo Standard.
theological_decisions: []
translation_notes:
  register: E ji Igbo Standard nke oge a, dị mfe ma dị ugwu. Ahịrịokwu ahụ na-edobe usoro omume participle abụọ ahụ na imperfective nke ἐκάθητο, ma ghara idozi n’ike ma παρά na-egosi ngagharị n’akụkụ mmiri ma ọ bụ iru ebe dị n’akụkụ ya.
