- from: Ma ọ zara sị, “Ihe ọ bụla a kụrụ nke Nna m nke eluigwe na-akụghị ka a ga-ehopu na mgbọrọgwụ.”
  to: Ma ọ zara sị, “Osisi ọ bụla[a] Nna m nke eluigwe na-akụghị, a ga-efopụ ya.”
  rationale: E dochiri okwu na-adịghị edo anya banyere iwepụ na mgbọrọgwụ anya n’ụlọ okwu Igbo doro anya, “a ga-efopụ ya.” A họpụtara “osisi ọ bụla” maka ihe atụ φυτεία n’ụzọ kwekọrọ na “plant,” ma tinye footnote iji chekwaa nhọrọ “ihe ọ bụla a kụrụ.” E wepụtaghị nkọwa ọ bụla banyere onye ma ọ bụ ihe osisi ahụ na-anọchi anya ya.
