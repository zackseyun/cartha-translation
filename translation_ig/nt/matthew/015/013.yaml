  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: ig
  text: Ma ọ zara sị, “Osisi ọ bụla[a] Nna m nke eluigwe na-akụghị, a ga-efopụ ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ọ bụla a kụrụ.”
    reason: φυτεία nwere ike ịpụta osisi ma ọ bụ ihe a kụrụ/ihe ọkụkụ; nhọrọ a na-echekwa ohere okwu ahụ nwere n’enweghị ịkọwa ihe atụ ahụ karịa ka Grik si kwuo.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ọ zara sị
  rationale: Nke a na-edobe ngwaa abụọ dị n'okwu Grik n'ụzọ na-ada nke ọma n'Igbo, dịka usoro akụkọ a na-ejikarị eme ihe.
- source_word: Πᾶσα φυτεία
  choice: Ihe ọ bụla a kụrụ
  rationale: Πᾶσα nwere nghọta nkesa, ebe φυτεία nwere ike ịpụta ihe a kụrụ ma ọ bụ ihe ọkụkụ. Nhọrọ a bụ nke sitere n'okike n'Igbo ma na-ahapụ ihe atụ ahụ ka ọ ghara ịkọwa kpọmkwem ma ọ bụ ozizi, omenala, ma ọ bụ mmadụ.
- source_word: ἐφύτευσεν
  choice: na-akụghị
  rationale: A hapụrụ ihe atụ ọrụ ugbo ahụ kpọmkwem, ma jikọta ya na 'ihe a kụrụ' ka oyiyi okwu ahụ dịrị n'otu.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: Nna m nke eluigwe
  rationale: Nke a na-echekwa ma 'Nna m' ma nkọwa οὐράνιος n'Igbo doro anya ma dị ùgwù.
- source_word: ἐκριζωθήσεται
  choice: a ga-ehopu na mgbọrọgwụ
  rationale: Nkebiokwu a na-egosipụta ọdịnihu na olu nnabata nke Grik, ma mee ka oyiyi iwepụ ihe site ná mgbọrọgwụ pụta ìhè.
theological_decisions:
- issue: Ihe 'Πᾶσα φυτεία' na-anọchi anya ya n'ihe atụ ahụ
  choice: Ihe ọ bụla a kụrụ
  alternative: Ozizi ọ bụla; omenala ọ bụla; onye ọ bụla Nna na-akụghị
  rationale: Grik ekwughị kpọmkwem ihe ihe a kụrụ na-anọchi anya ya. A hapụrụ ihe atụ ahụ ghe oghe iji zere itinye nkọwa okpukpe nke ederede ahụ n'onwe ya na-ekwughị.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. E ji 'Ma ọ zara sị' mee ka usoro akụkọ Grik pụta n'ụzọ Igbo na-ada nke ọma; e jikwa 'ehopu na mgbọrọgwụ' chekwaa ike nke ihe atụ ikpe ahụ.
