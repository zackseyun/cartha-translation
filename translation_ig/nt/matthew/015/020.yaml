  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπον, τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: ig
  text: Ihe ndị a bụ ihe na-emerụ mmadụ[a][b]; ma iji aka a na-asaghị eri ihe adịghị emerụ mmadụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-eme ka mmadụ ghara ịdị ọcha.” Okwu Grik ahụ pụrụ ịpụta ime ka mmadụ ghara ịdị ọcha n'ihe gbasara ịdị ọcha emume; n'ebe a, “imerụ” na-echekwakwa echiche sara mbara nke mmebi dị n'ime nkuzi Jizọs.
    reason: lexical_alternative
  - marker: b
    text: “Mmadụ” dị n'ụdị otu onye ebe a, ma ọ na-anọchite anya mmadụ ọ bụla.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῦντα / κοινοῖ
  choice: na-emerụ / adịghị emerụ
  rationale: N'okwu a gbasara ịdị ọcha, “imerụ” na-egosi ime ka mmadụ ghara ịdị ọcha, ma ọ pụkwara ibu echiche sara mbara nke imebi mmadụ n'ime. O si otú a chekwaa ma ndabere nke iwu ịdị ọcha ma ịdị arọ nke nkuzi Jizọs.
- source_word: ἄνθρωπον
  choice: mmadụ
  rationale: “Mmadụ” bụ otu onye n'ụdị okwu, ma ọ na-anọchite anya mmadụ ọ bụla; ọ na-egosipụta eziokwu izugbe nke okwu Grik ahụ n'ụzọ Igbo sitere n'okike.
- source_word: ἀνίπτοις χερσὶν
  choice: iji aka a na-asaghị
  rationale: Nke a bụ ụzọ Igbo doro anya na nke sitere n'okike isi kwuo iri ihe site n'aka ndị a na-asaghị, dịka esemokwu gbasara ịsa aka si dị n'ọnọdụ a.
- source_word: φαγεῖν
  choice: eri ihe
  rationale: Nkebiokwu “iji ... eri ihe” na-anọchite anya infinitive Grik ahụ nke ọma n'usoro okwu Igbo.
- source_word: ταῦτά ἐστιν τὰ
  choice: Ihe ndị a bụ ihe
  rationale: Nhọrọ a na-echekwa nrụgide dị na “ihe ndị a” na usoro nke na-akọwa ihe ndị na-emerụ mmadụ.
- source_word: δέ
  choice: ma
  rationale: “Ma” na-egosipụta ọdịiche dị n'etiti ihe ndị na-emerụ mmadụ n'ezie na iri ihe site n'aka a na-asaghị.
theological_decisions:
- issue: Ihe κοινόω pụtara n'esemokwu gbasara ịdị ọcha
  choice: A sụgharịrị ya “imerụ” iji chekwaa ma echiche nke ime ka mmadụ ghara ịdị ọcha ma echiche sara mbara nke mmebi ime mmụọ.
  alternative: ime ka mmadụ ghara ịdị ọcha
  rationale: Ọnọdụ ozugbo metụtara iwu na omenala ịdị ọcha, ma nkuzi Jizọs na-atụkwa aka n'ihe na-emebi mmadụ n'ime. “Imerụ” anaghị ekpebi naanị otu n'ime echiche abụọ ahụ.
- issue: Otu onye ἄνθρωπον nke na-anọchite anya mmadụ niile
  choice: A sụgharịrị ya “mmadụ,” otu onye nke na-egosipụta mmadụ ọ bụla.
  alternative: nwoke; ndị mmadụ
  rationale: N'ebe a ἄνθρωπος pụtara mmadụ n'ozuzu, ọ bụghị kpọmkwem nwoke. “Mmadụ” na-echekwa otu onye ahụ na eziokwu izugbe ya, na-enweghị ịgbanwe ya gaa n'ọtụtụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu mee ihe. E debere ahịrịokwu ahụ n'ụdị dị nkenke, ma chekwaa ọdịiche dị n'etiti ihe na-emerụ mmadụ n'ezie na iri ihe site n'aka a na-asaghị.
