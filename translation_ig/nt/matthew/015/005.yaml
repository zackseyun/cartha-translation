revisions:
- from: Ma unu na-ekwu[a], ‘Onye ọ bụla nke sịrị nna ya ma ọ bụ nne ya, “Ihe ọ bụla ị gaara eji n’aka m nweta enyemaka bụ onyinye,”’
  to: Ma unu na-ekwu[a], ‘Onye ọ bụla sịrị nna ya ma ọ bụ nne ya, “Ihe ọ bụla gaara abara gị uru site n’aka m bụ onyinye,”’
  rationale: The revision corrects the benefit clause so that it says that something from the speaker would have benefited the parent, matching the passive sense of ὠφεληθῇς and the source relation of ἐξ ἐμοῦ. It also makes the indefinite relative expression more natural in Standard Igbo. The verse remains syntactically open, as in the Greek, for completion in the following verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:35:38Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the contrast, the generalizing force of “whoever,” the parental addressees, and δῶρον as “onyinye.” However, “ị gaara eji n’aka m nweta enyemaka” introduces the idea of using something to obtain help, rather than directly expressing that the parent would benefit from something supplied by the speaker. “Ihe ọ bụla gaara abara gị uru site n’aka m” more directly represents ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς.
  naturalness: The proposed revision is idiomatic, clear Standard Igbo. Removing “nke” after “Onye ọ bụla” is also slightly more natural in this general expression, while retaining the same meaning.
  terminology: “Onyinye” is the appropriate nontechnical rendering of δῶρον. The footnote appropriately gives “àjà” as an alternative and identifies the dedication-to-God sense from the context without importing “Kọban” into Matthew’s main text.
  issues:
  - severity: medium
    issue: The benefit clause is phrased as obtaining help by using something.
    rationale: “ị gaara eji n’aka m nweta enyemaka” can mean “you would have used [something] to get help from me.” The Greek instead describes whatever the parent might have benefited from the speaker. The revision retains the indirect/potential benefit without adding an instrumental action.
  revised_text: Ma unu na-ekwu[a], ‘Onye ọ bụla sịrị nna ya ma ọ bụ nne ya, “Ihe ọ bụla gaara abara gị uru site n’aka m bụ onyinye,”’
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “onyinye” ebe a dịka “àjà.” Ihe ọ pụtara bụ na onye ahụ ekwuola na ihe ọ gaara eji nyere nne na nna ya aka bụzi ihe e doro nye Chineke; tụlee Mak 7:11, ebe e ji okwu ahụ bụ “Kọban.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the benefit clause so that it says that something from the speaker would have benefited the parent, matching the passive sense of ὠφεληθῇς and the source relation of ἐξ ἐμοῦ. It also makes the indefinite relative expression more natural in Standard Igbo. The verse remains syntactically open, as in the Greek, for completion in the following verse.
