  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: ig
  text: Ma unu na-ekwu[a], ‘Onye ọ bụla sịrị nna ya ma ọ bụ nne ya, “Ihe ọ bụla gaara abara gị uru site n’aka m bụ onyinye,”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “onyinye” ebe a dịka “àjà.” Ihe ọ pụtara bụ na onye ahụ ekwuola na ihe ọ gaara eji nyere nne na nna ya aka bụzi ihe e doro nye Chineke; tụlee Mak 7:11, ebe e ji okwu ahụ bụ “Kọban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Ma unu na-ekwu
  rationale: ‘Ma’ na-egosipụta ọdịiche dị n’etiti ihe Jizọs kwuru na mbụ na okwu ha; ‘unu’ na-edobe nnọchiaha nke ọtụtụ mmadụ nke e mesiri ike.
- source_word: Ὃς ἂν εἴπῃ
  choice: Onye ọ bụla nke sịrị
  rationale: Nke a na-egosipụta ọnọdụ izugbe nke nnọchiaha mmekọrịta ya na ἄν na aorist subjunctive.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: nna ya ma ọ bụ nne ya
  rationale: Dative ahụ na-egosi ndị a gwara okwu; ‘ya’ bụ ụzọ Igbo si egosipụta njikọ ezinụlọ n’ụzọ doro anya ma dịkwa eke.
- source_word: Δῶρον
  choice: onyinye
  rationale: ‘Onyinye’ bụ isi ihe δῶρον pụtara ma ghara itinye okwu teknụzụ ‘Kọban’ nke Matiu na-ejighị.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: Ihe ọ bụla ị gaara eji n’aka m nweta enyemaka
  rationale: Nke a na-edobe echiche nke uru ma ọ bụ enyemaka nne ma ọ bụ nna gaara enweta n’aka onye ahụ, tinyere ọnọdụ nke uru a na-enwetaghị.
theological_decisions:
- issue: Ma a ga-etinye okwu teknụzụ ‘Kọban’ n’ihe Matiu dere
  choice: Idowe ‘onyinye’ n’ahịrịokwu bụ isi
  alternative: ‘àjà’ ma ọ bụ ‘Kọban’
  rationale: Matiu ji δῶρον, ọ bụghị κορβᾶν nke dị na Mak 7:11. Ya mere, nsụgharị ahụ na-edobe okwu Matiu, ebe nkọwa ala peeji na-akọwa na e doro onyinye ahụ nye Chineke.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke kwụ ọtọ ma dị ùgwù. A hapụrụ ahịrịokwu ahụ ka ọ na-aga n’ihu n’amaokwu na-esote, dịka usoro okwu Grik si dị.
