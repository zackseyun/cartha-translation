reference: Matthew 15:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἐνέβη εἰς τὸ πλοῖον, καὶ ἦλθεν εἰς τὰ ὅρια ⸀Μαγαδάν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: ig
  text: Mgbe ọ zilachara ìgwè mmadụ ahụ ka ha laa, ọ banyere n’ụgbọ mmiri ahụ, wee ruo n’ógbè Magadan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ odide nwere “Magdala” kama “Magadan.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: Mgbe ọ hapụsịrị ... ka ha laa
  rationale: Aorist participle na-egosi ihe mere tupu ngwaa bụ isi; okwu a na-akọwa n’ụzọ Igbo dị mma na Jizọs kwụsịrị nnọkọ ahụ ma hapụ ndị mmadụ ka ha laa.
- source_word: τοὺς ὄχλους
  choice: ìgwè mmadụ ahụ
  rationale: Nke a na-enye ọtụtụ mmadụ Greek ahụ n’Igbo nkịtị ma doo anya na ọ bụ ndị a kpọtụrụ aha n’akụkọ ahụ.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: ọ banyere n’ụgbọ mmiri
  rationale: Nke a na-egosipụta omume ịbanye n’ụgbọ mmiri n’ụzọ doro anya ma bụrụkwa okwu Igbo e ji eme ihe.
- source_word: ἦλθεν
  choice: wee ruo
  rationale: N’akụkọ njem, ‘ruo’ na-egosi na ọ bịarutere ebe ahụ n’ụzọ Igbo na-aga were were, n’agbanyeghị na isi ngwaa Greek bụ ‘ịbịa.’
- source_word: τὰ ὅρια
  choice: n’ógbè
  rationale: Ọtụtụ ‘oke’ n’asụsụ Greek na-arụ ọrụ dị ka aha mpaghara; ‘ógbè’ na-enye ihe ọ pụtara kama ime ka a ghọta nanị ahịrị ókèala.
- source_word: Μαγαδάν
  choice: Magadan
  rationale: E degharịrị aha ebe ahụ dịka ọ dị n’edemede SBLGNT, n’ebughị ụzọ dochie ya na ọdịiche a maara nke ọma.
theological_decisions:
- issue: Ụdị aha ebe dị na ngwụcha amaokwu ahụ
  choice: Magadan
  alternative: Magdala
  rationale: Nke a bụ ọdịiche ederede na aha ebe, ọ bụghị mkpebi ozizi. Isi ederede gbasoro Μαγαδάν nke SBLGNT, ebe e debere ‘Magdala’ n’okpuru peeji iji gosi ọdịiche ahụ n’ezoghị ya ezo.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere akara nkọwa [a] ozugbo n’aha Magadan, ebe ọdịiche ederede ahụ metụtara.
