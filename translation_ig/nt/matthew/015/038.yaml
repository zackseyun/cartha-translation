  terminology: “Ndị ikom” appropriately renders ἄνδρες as adult men, preserving the source’s distinction from “ụmụ nwanyị na ụmụaka.” The terms for women and children are natural and suitably broad. The footnote offers “e wezụga,” a valid lexical alternative for χωρὶς.
