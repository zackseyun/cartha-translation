id: MAT.15.38
reference: Matthew 15:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν τετρακισχίλιοι ἄνδρες χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: ig
  text: Ndị riri nri ahụ bụ ndị ikom puku anọ, ma a gụnyeghị ụmụ nwanyị na ụmụaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “e wezụga ụmụ nwanyị na ụmụaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ndị
  rationale: A sụgharịrị nkebiokwu ahụ dị ka aha ìgwè mmadụ, “Ndị”; δέ bụ njikọ dị nro nke na-adịghị achọ ka e tinye okwu na-egosi mmegide n’amaokwu a.
- source_word: ἐσθίοντες
  choice: riri nri ahụ
  rationale: Ọ bụ ezie na okwu Grik a bụ participle nke present, ọnọdụ akụkọ ahụ na-ekwu banyere iri nri a ka mechara; “riri nri ahụ” na-egosi nke a n’Igbo nkịtị.
- source_word: ἦσαν
  choice: bụ
  rationale: “Bụ” bụ copula doro anya nke na-ejikọta ndị riri nri na ọnụ ọgụgụ ha.
- source_word: τετρακισχίλιοι
  choice: puku anọ
  rationale: Nke a na-enye ọnụ ọgụgụ Grik ahụ kpọmkwem.
- source_word: ἄνδρες
  choice: ndị ikom
  rationale: Okwu Grik ahụ na-ezo aka kpọmkwem n’ụmụ nwoke toro eto, ọ bụghị mmadụ niile; “ndị ikom” na-echekwa ọdịiche ahụ.
- source_word: χωρὶς
  choice: ma a gụnyeghị
  rationale: N’ebe a, χωρίς na-egosi na ụmụ nwanyị na ụmụaka esoghị n’ọnụ ọgụgụ puku anọ ahụ. Nkebiokwu a bụ Igbo doro anya ma dịkwa mfe nghọta.
- source_word: γυναικῶν
  choice: ụmụ nwanyị
  rationale: “Ụmụ nwanyị” na-enye nghọta izugbe nke okwu ahụ n’etinyeghị echiche na ha niile bụ ndị lụrụ di.
- source_word: καὶ παιδίων
  choice: na ụmụaka
  rationale: “Ụmụaka” bụ nsụgharị zuru oke ma doo anya, na-enweghị ịkpa ókè afọ nke ihe odide ahụ na-akọwaghị.
theological_decisions:
- issue: Usoro ịgụ ọnụ nke kewara ndị ikom na ụmụ nwanyị na ụmụaka
  choice: E debere “ndị ikom” n’amaokwu ahụ, ma kọwaa na a gụnyeghị ụmụ nwanyị na ụmụaka n’ọnụ ọgụgụ puku anọ ahụ.
  alternative: Ịsụgharị ἄνδρες dị ka “ndị mmadụ” ma ọ bụ “mmadụ.”
  rationale: Ihe odide Grik kpọrọ ndị ikom aha kpọmkwem, ma mesịa kpọọ ụmụ nwanyị na ụmụaka iche. Iji “ndị mmadụ” ga-ehichapụ ọdịiche dị n’ihe odide mbụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Nhazi “ndị ikom puku anọ” bụ nke nkịtị n’Igbo, ebe “ma a gụnyeghị” na-eme ka o doo anya na ụmụ nwanyị na ụmụaka esoghị n’ọnụ ọgụgụ ahụ.
