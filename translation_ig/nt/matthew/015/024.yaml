revisions:
- from: Ma ọ zara[a] sị, “Ọ bụ naanị n’ebe atụrụ furu efu nke ụlọ Izrel nọ ka e zigara m.”
  to: Ma ọ zara sị, “E zigara m naanị ka m gakwuru atụrụ ndị furu efu nke ụlọ Izrel.”
  rationale: The revision retains the straightforward restriction of Jesus’ stated mission while rendering the Greek destination toward the sheep in idiomatic Standard Igbo. The footnote now closely reflects the Greek negative-except construction and removes an added locational expression.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:09Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the response formula, the passive sense of being sent, the restrictive force of οὐκ ... εἰ μὴ, and the sheep metaphor. However, “n’ebe atụrụ ... nọ” recasts the Greek destination as a physical location (“where the sheep are”) rather than expressing the mission as directed to the sheep. The footnote likewise adds “n’ebe ọ bụla” (“anywhere”), which is not present in the Greek.
  naturalness: “Ọ bụ naanị n’ebe atụrụ furu efu nke ụlọ Izrel nọ ka e zigara m” is understandable, but it is less direct and less idiomatic for a mission addressed to persons. “E zigara m naanị ka m gakwuru ...” is natural Standard Igbo and retains the intended limitation.
  terminology: “atụrụ,” “furu efu,” and “ụlọ Izrel” appropriately preserve the biblical imagery and established theological-national idiom without interpretive expansion.
  issues:
  - severity: medium
    issue: Destination rendered as a place rather than as the lost sheep themselves
    rationale: The Greek εἰς τὰ πρόβατα directs the sending toward “the sheep.” The phrase “n’ebe ... nọ” shifts this to the place where they are. Using “ka m gakwuru atụrụ ...” expresses the mission naturally in Igbo without losing the restrictive sense.
  - severity: low
    issue: Footnote introduces “n’ebe ọ bụla”
    rationale: The phrase “anywhere” is an unnecessary addition. A more literal alternative should reflect the negative-except construction without adding this locational element.
  revised_text: Ma ọ zara sị, “E zigara m naanị ka m gakwuru atụrụ ndị furu efu nke ụlọ Izrel.”
  revised_footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ kpọmkwem: “E zigaghị m ma e wezụga ka m gakwuru atụrụ ndị furu efu nke ụlọ Izrel.”'
    reason: lexical_alternative
  revision_rationale: The revision retains the straightforward restriction of Jesus’ stated mission while rendering the Greek destination toward the sheep in idiomatic Standard Igbo. The footnote now closely reflects the Greek negative-except construction and removes an added locational expression.
