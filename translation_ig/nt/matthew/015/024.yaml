  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: ig
  text: Ma ọ zara sị, “E zigara m naanị ka m gakwuru atụrụ ndị furu efu nke ụlọ Izrel.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: ọ zara
  rationale: Nkebi-ngwaa a na-ewebata nzaghachi Jizọs; ‘ọ zara sị’ bụ ụzọ Igbo dị mfe ma bụrụkwa nke ziri ezi isi kwuo njikọ participle na ngwaa ahụ.
- source_word: Οὐκ ἀπεστάλην
  choice: e zigara m
  rationale: Aorist passive a na-egosi na e nyere ya ozi ma ziga ya. Usoro Igbo a na-echekwa olu nnara ahụ n’ụzọ eke.
- source_word: εἰ μὴ
  choice: ọ bụ naanị ... ka
  rationale: Usoro nkwusiokwu a na-egosipụta oke doro anya nke Οὐκ ... εἰ μὴ, ma na-ada nke ọma n’Igbo.
- source_word: πρόβατα
  choice: atụrụ
  rationale: A hapụrụ ihe atụ nke atụrụ dịka ọ dị n’asụsụ Grik, kama ịkọwa ya naanị dị ka ndị mmadụ.
- source_word: ἀπολωλότα
  choice: furu efu
  rationale: N’ebe a, okwu a na-akọwa atụrụ ndị kpafuru ma ọ bụ ndị na-anọghịzi n’ebe ha kwesịrị ịnọ; ‘furu efu’ anaghị eme ka o yie ọnwụ ikpeazụ.
- source_word: οἴκου Ἰσραήλ
  choice: ụlọ Izrel
  rationale: Nke a na-echekwa akpaalaokwu Akwụkwọ Nsọ nke na-ezo aka n’Izrel dịka otu ndị ma ọ bụ mba.
- source_word: δὲ
  choice: Ma
  rationale: ‘Ma’ na-egosi ntakịrị mgbanwe ma ọ bụ mmegide dị na nzaghachi ahụ n’ime akụkọ ahụ.
theological_decisions:
- issue: Oke ozi Jizọs kwuru na o nwere n’okwu a
  choice: E gosipụtara okwu ahụ dịka oke doro anya—ọ bụ naanị n’ebe atụrụ furu efu nke ụlọ Izrel nọ ka e zigara ya.
  alternative: Ịsụgharị ya dịka na Izrel bụ naanị ndị e buru ụzọ nye ohere, ma ọ bụghị oke ozi ahụ.
  rationale: Οὐκ ... εἰ μὴ bụ usoro Grik siri ike nke na-egosi mwepu na oke. Nsụgharị ahụ ekwesịghị ime ka esemokwu dị n’akụkọ ahụ dị nro ma ọ bụ tinye ozi e nyere mba niile mgbe e mesịrị n’ime okwu a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta mee ihe. Usoro ‘ọ bụ naanị ... ka’ na-eme ka nkwusiokwu ahụ bụrụ nke eke n’Igbo, ebe ‘ụlọ Izrel’ na-echekwa ụda na akpaalaokwu Akwụkwọ Nsọ.
