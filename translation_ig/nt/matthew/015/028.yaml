- from: Mgbe ahụ, Jizọs zara ya sị, “Nwanyị, okwukwe gị[a] dị ukwuu! Ka e meere gị dị ka ị chọrọ.” A gwọrọkwa nwa ya nwanyị site n’awa ahụ[b].
  to: Mgbe ahụ, Jizọs zara ya sị, “Nwanyị, okwukwe gị[a] dị ukwuu! Ka e mee gị dịka ịchọrọ.” A gwọrọ nwa ya nwanyị site n’awa ahụ[b].
  rationale: The revision removes an unsupported additive nuance, corrects the imperative construction that renders Jesus’ pronouncement, and refines the lexical footnote without altering the meaning or theological scope of the verse. Footnote markers remain correctly anchored to “okwukwe” and “awa ahụ.”
