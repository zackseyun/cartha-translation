id: MAT.15.28
reference: Matthew 15:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: ig
  text: Mgbe ahụ, Jizọs zara ya sị, “Nwanyị, okwukwe gị[a] dị ukwuu! Ka e mee gị dịka ịchọrọ.” A gwọrọ nwa ya nwanyị site n’awa ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ntụkwasị obi gị dị ukwuu.” Okwu Grik πίστις nwekwara ike ịpụta ntụkwasị obi ma ọ bụ iguzosi ike n’ihe, ọ bụ ezie na “okwukwe” bụ ntụgharị bụ isi n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “site n’oge ahụ.” N’asụsụ Grik, ọ sịrị kpọmkwem, “site n’awa ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-ejikọta nzaghachi Jizọs na mkparịta ụka bu ya ụzọ, ma bụrụkwa ụzọ Igbo doro anya si egosi oge n’akụkọ.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: zara ya sị
  rationale: Nke a na-egosipụta okwu Grik abụọ ahụ n’ụzọ Igbo sitere n’okike, na-edobekwa αὐτῇ, ‘ya.’
- source_word: Ὦ γύναι
  choice: Nwanyị
  rationale: ‘Nwanyị’ bụ okwu ịkpọ onye ahụ ihu n’ihu nke kwekọrọ na γύναι. A hapụrụ Ὦ ka ụda ịkpọ oku pụta site n’usoro okwu Igbo n’enweghị itinye okwu na-adịghị eke.
- source_word: μεγάλη σου ἡ πίστις
  choice: okwukwe gị dị ukwuu
  rationale: Ọ bụ usoro Igbo doro anya ma dị ùgwù, na-edobe nkwusi ike Jizọs banyere ịdị ukwuu nke okwukwe ya.
- source_word: πίστις
  choice: okwukwe
  rationale: N’ọnọdụ a, okwu ahụ na-ekwu banyere ntụkwasị obi nwanyị ahụ nwere n’ebe Jizọs nọ; ‘okwukwe’ bụ ntụgharị bụ isi nke na-edobekwa ibu okwu okpukpe ahụ.
- source_word: γενηθήτω σοι
  choice: Ka e meere gị
  rationale: Usoro a na-edobe ọdịdị nnara nke okwu Grik ahụ na ike nke nkwupụta Jizọs, kama ịkọwa kpọmkwem onye ga-eme ya.
- source_word: ὡς θέλεις
  choice: dị ka ị chọrọ
  rationale: ‘Dị ka ị chọrọ’ bụ Igbo dị mfe ma kwụ ọtọ maka ọchịchọ nwanyị ahụ.
- source_word: ἰάθη
  choice: a gwọrọ
  rationale: Nke a na-edobe ọdịdị nnara nke ngwaa ahụ ma na-egosi ọgwụgwọ n’ụzọ Igbo a na-aghọta ngwa ngwa.
- source_word: ἡ θυγάτηρ αὐτῆς
  choice: nwa ya nwanyị
  rationale: Nke a bụ ntụgharị Igbo doro anya nke na-egosi na ọ bụ nwa nwanyị nke nwanyị ahụ.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: site n’awa ahụ
  rationale: Nke a na-edobe okwu Grik ahụ n’ụzọ dị nso; ihe ọ pụtara n’ebe a bụ na ọgwụgwọ ahụ malitere ozugbo n’oge ahụ.
theological_decisions:
- issue: Otú e si tụgharịa πίστις n’otuto Jizọs toro nwanyị ahụ
  choice: okwukwe
  alternative: ntụkwasị obi
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi ntụkwasị obi nwanyị ahụ n’ebe Jizọs nọ. ‘Okwukwe’ na-edobe okwu okpukpe sara mbara nke πίστις, ebe nkọwa ala peeji na-eme ka nghọta ‘ntụkwasị obi’ pụta ìhè n’enweghị ịmanye naanị otu nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Zara ya sị’ na ‘Ka e meere gị’ bụ usoro okwu sitere n’okike nke na-edobe ọdịdị na ike nke Grik. E tinyere akara nkọwa [a] n’akụkụ ‘okwukwe’ na [b] n’akụkụ ‘awa ahụ’ ka ha kwekọọ na ọdịnaya nkọwa ala peeji.
