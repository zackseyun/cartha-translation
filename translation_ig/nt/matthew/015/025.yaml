  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: ig
  text: Ma ọ bịara gbuo ikpere n’ala n’ihu ya[a], sị, “Onyenweanyị, nyere m aka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “fee ya ofufe.” Ngwaa Grik ahụ pụrụ ịpụta igbu ikpere n’ala ma ọ bụ isiala n’ụzọ nkwanye ùgwù, ịsọpụrụ mmadụ, ma ọ bụ ife ofufe, dabere n’ọnọdụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: 'Ọ na-egosi obere ntụgharị megidere ihe mere tupu ya: nwanyị ahụ anọgideghị n’azụ n’agbanyeghị nzaghachi ọ natara.'
- source_word: ἐλθοῦσα
  choice: ọ bịara
  rationale: A sụgharịrị participle a dị ka ngwaa zuru ezu ka okwu ahụ bụrụ Igbo nkịtị ma debe mmegharị nwanyị ahụ bịakwutere Jizọs.
- source_word: προσεκύνει αὐτῷ
  choice: gbuo ikpere n’ala n’ihu ya
  rationale: Nhọrọ a na-egosi omume ahụ nke nkwanye ùgwù n’anaghị ekpebi kpamkpam ma ọ bụ ofufe n’echiche okpukpe; e debere ‘fee ya ofufe’ dị ka nhọrọ n’ala ala peeji.
- source_word: λέγουσα
  choice: sị
  rationale: ‘Sị’ bụ ụzọ Igbo dị nkenke ma dịkwa eke isi webata okwu nwanyị ahụ kwuru kpọmkwem.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ aha nkwanye ùgwù dị arọ e ji kpọ Jizọs, ma ọ na-edebe isi ihe κύριος pụtara karịa ‘Nna m ukwu’ ma ọ bụ ‘Nwoke ọma.’
- source_word: βοήθει μοι
  choice: nyere m aka
  rationale: Ọ na-edebe arịrịọ ahụ dị mkpirikpi, kpọmkwem, ma jupụta n’ọsọ enyemaka.
theological_decisions:
- issue: Nsụgharị προσκυνέω mgbe a na-eme ya n’ihu Jizọs
  choice: gbuo ikpere n’ala n’ihu ya
  alternative: fee ya ofufe
  rationale: Ngwaa Grik ahụ pụrụ ịpụta isiala ma ọ bụ igbu ikpere n’ala n’ụzọ nkwanye ùgwù, ịsọpụrụ mmadụ, ma ọ bụ ife ofufe dabere n’ọnọdụ. Isiokwu ahụ na-ahọrọ omume ahụ a pụrụ ịhụ anya, ebe ihe e dere n’ala ala peeji na-edebe ‘fee ya ofufe’ dị ka nsụgharị kwe omume, ka a ghara idozi esemokwu nkà mmụta okpukpe ahụ n’enweghị ihe akaebe zuru ezu.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. E ji ‘gbuo ikpere n’ala n’ihu ya’ mee ka omume ahụ doo anya, ma e zere ime ka ihe okwu Grik ahụ pụtara bụrụ naanị ofufe.
