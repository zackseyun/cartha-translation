    reason: lexical_alternative
  revision_rationale: The revision supplies the natural Igbo narrative connector “wee” and changes the awkward phrase “wezuga onwe ya gaa” to “wezugara onwe ya gaa.” It continues to distinguish Jesus’ departure from the preceding place from his withdrawal to the Tyre-and-Sidon region, while neither stating nor implying a reason for the movement. The footnote now accurately presents the neutral alternative without conflating the two Greek movement expressions.
