source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐκεῖθεν ὁ Ἰησοῦς ἀνεχώρησεν εἰς τὰ μέρη Τύρου καὶ Σιδῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: ig
  text: Jizọs si n’ebe ahụ pụọ wee wezugara onwe ya gaa n’ógbè Taịa na Saịdọn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Jizọs si n’ebe ahụ pụọ gaa n’ógbè Taịa na Saịdọn.” “Wezugara onwe ya” na-egosipụta nghọta dị na ngwaa Grik ahụ nke Matiu na-eji ugboro ugboro; a pụkwara ịsụgharị ya n’ụzọ dị nnọọ nkịtị dịka “hapụrụ ebe ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: wee
  rationale: E ji “wee” jikọta ihe a mere na akụkọ bu ya ụzọ n’ụzọ Igbo na-asụkarị, n’etinyeghị nkwusi ike ọhụrụ.
- source_word: ἐξελθὼν
  choice: si n’ebe ahụ pụọ
  rationale: Nke a na-egosi omume nke buru ngwaa ukwu ụzọ ma na-echekwa echiche doro anya nke isi ebe ahụ pụọ.
- source_word: ἐκεῖθεν
  choice: n’ebe ahụ
  rationale: Ọ na-ezo aka n’ebe akụkọ gara aga kwuru maka ya, dị ka “from there” si dị n’asụsụ mmalite.
- source_word: ἀνεχώρησεν
  choice: wezuga onwe ya gaa
  rationale: Nhọrọ a na-echekwa nghọta nke ịpụ ma ọ bụ ịla n’akụkụ ọzọ, nke Matiu na-ejikarị ngwaa a egosi, ma ọ naghị ekwu ihe kpatara ya.
- source_word: εἰς τὰ μέρη
  choice: gaa n’ógbè
  rationale: “Ógbè” na-egosi mpaghara sara mbara metụtara obodo ndị ahụ, n’ebughị ụzọ kwuo na ọ banyere kpọmkwem n’ime obodo abụọ ahụ.
- source_word: Τύρου καὶ Σιδῶνος
  choice: Taịa na Saịdọn
  rationale: A sụgharịrị aha obodo ndị Finishia n’ụdị a maara nke ọma ma kwekọọ na ụda Igbo.
theological_decisions:
- issue: Ụdị njem Jizọs gara n’ógbè metụtara ndị mba ọzọ
  choice: “wezuga onwe ya gaa” n’ekwughị ihe mere o ji gaa
  alternative: “hapụrụ ebe ahụ gaa” ma ọ bụ “laghachiri azụ gaa”
  rationale: Okwu Grik nwere ike igosi ịla n’akụkụ ma ọ bụ iwepụ onwe, ma amaokwu ahụ ekwughị ebumnobi Jizọs. Nsụgharị a na-echekwa ntakịrị nghọta ahụ n’etinyeghị nkọwa gbasara echiche ma ọ bụ ozizi.
translation_notes:
  register: Igbo a bụ nke ọkọlọtọ, dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. A họọrọ “wezuga onwe ya gaa” iji chekwaa nghọta dị n’okwu Grik n’enweghị ime ka ọ bụrụ na Jizọs gbara ọsọ ma ọ bụ laghachiri azụ n’egwu.
