  text: And after instructing the crowd to recline on the ground,[a]
translation:
  language: ig
  text: Mgbe o nyesịrị igwe mmadụ ahụ iwu ka ha nọdụ ala n’ala,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ka ha dina ala.” Ngwaa Grik ahụ nwere ike ịpụta iwere ọnọdụ iri nri, ma ọ bụ ịnọdụ ala ma ọ bụ ịdina ala; ọtụtụ mgbe ọ na-enwe echiche ịdina ala.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Mgbe
  rationale: N’Igbo, ijikọ nkebi a na ihe omume na-esote site n’usoro oge (‘Mgbe ...’) na-egosi nke ọma na participle ahụ bu ụzọ mee, ma na-eme ka ahịrịokwu a daa nke ọma n’asụsụ nkịtị.
- source_word: παραγγείλας
  choice: o nyesịrị ... iwu
  rationale: Nke a na-echekwa ike ntụziaka dị na ngwaa Grik ahụ, ma ọ naghị ada ka okwu ike gabigara ókè.
- source_word: τῷ ὄχλῳ
  choice: igwe mmadụ ahụ
  rationale: Ọ bụ ntụgharị Igbo doro anya ma bụrụkwa nke a na-eji eme ihe maka ìgwè mmadụ gbakọrọ ọnụ.
- source_word: ἀναπεσεῖν
  choice: ka ha nọdụ ala
  rationale: N’ọnọdụ Igbo nke oge a, nke a bụ ụzọ kacha eke nghọta isi kwuo na ha were ọnọdụ iri nri; nkọwa ala na-edebe echiche Grik nke ịnọdụ ma ọ bụ ịdabere n’ala.
- source_word: ἐπὶ τὴν γῆν
  choice: n’elu ala
  rationale: N’ebe a, γῆ pụtara elu ala ebe ndị mmadụ ga-anọ, ọ bụghị ụwa dum ma ọ bụ ógbè.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. A họọrọ ‘nọdụ ala’ maka nghọta nkịtị, ebe nkọwa ala na-echekwa echiche omenala nke ịdabere mgbe a na-eri nri.
