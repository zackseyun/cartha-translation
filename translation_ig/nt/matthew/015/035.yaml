review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the directive to the crowd and the antecedent action of the aorist participle. However, “n’elu ala” is less idiomatic for the physical location intended by ἐπὶ τὴν γῆν; “n’ala” is the normal Igbo expression. The footnote’s “dabere n’ala” does not naturally express a meal posture of reclining.
  naturalness: “Mgbe o nyesịrị igwe mmadụ ahụ iwu ka ha nọdụ ala n’ala” is clear, standard modern Igbo and appropriately remains syntactically connected to the action in the following verse.
  terminology: “inye ... iwu” adequately represents παραγγέλλω without overstating its force, and “igwe mmadụ ahụ” is a suitable rendering of τῷ ὄχλῳ. The note should use “dina ala,” rather than “dabere n’ala,” for the reclining alternative.
  issues:
  - severity: low
    issue: Location phrase is slightly non-idiomatic.
    rationale: For people taking their places on the ground, Igbo normally says “n’ala,” rather than “n’elu ala.”
  - severity: medium
    issue: Footnote alternative uses an inaccurate/nonnatural posture verb.
    rationale: “Dabere n’ala” suggests leaning on or depending on the ground, not reclining for a meal. “Dina ala” is the clearer alternative, with the note preserving the meal-context nuance.
