  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: ig
  text: 'Ndị ihu abụọ! Aịzaya buru amụma banyere unu n''ụzọ ziri ezi[a], sị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Aịzaya buru amụma nke ọma banyere unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριταί
  choice: Ndị ihu abụọ!
  rationale: Ọ bụ aha ọtụtụ n'ụdị ịkpọ mmadụ okwu ozugbo. “Ndị ihu abụọ” bụ okwu Igbo doro anya ma sie ike nke na-egosi ndị omume ha na ihe ha na-egosi n'èzí adịghị otu.
- source_word: καλῶς
  choice: n'ụzọ ziri ezi
  rationale: 'Okwu a na-akọwa otú Aịzaya si buru amụma: amụma ahụ dabara adaba ma bụrụ eziokwu banyere ndị a. Nsụgharị a bụ nke a na-aghọta ngwa ngwa n''Igbo.'
- source_word: ἐπροφήτευσεν
  choice: buru amụma
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị akọwa ikwu okwu amụma, ma ọ na-edobe njikọ Aịzaya na ọrụ onye amụma.
- source_word: περὶ ὑμῶν
  choice: banyere unu
  rationale: “Banyere unu” na-enye kpọmkwem echiche nke περί tinyere genitive, ma dabara n'asụsụ Igbo nke oge a.
- source_word: Ἠσαΐας
  choice: Aịzaya
  rationale: Nke a bụ ụdị aha onye amụma ahụ a na-ejikarị eme ihe n'Igbo.
- source_word: λέγων
  choice: 'sị:'
  rationale: Ọ na-ewebata okwu e hotara nke na-esote n'ụzọ dị nkenke ma bụrụkwa nke e ji ekwu okwu n'Igbo.
theological_decisions:
- issue: Ike nke okwu Jizọs kpọrọ ndị na-emegide ya
  choice: Ndị ihu abụọ!
  alternative: Ndị na-eme ka hà bụ ihe ha na-abụghị
  rationale: ὑποκριταί bụ ịkatọ omume na ọnọdụ ime mmụọ ha n'ụzọ siri ike. “Ndị ihu abụọ” na-edobe ike ahụ n'enweghị ime ka okwu ahụ dị nro.
- issue: Ihe καλῶς na-egosi banyere amụma Aịzaya
  choice: buru amụma ... n'ụzọ ziri ezi
  alternative: buru amụma nke ọma
  rationale: “N'ụzọ ziri ezi” na-eme ka o doo anya na amụma ahụ bụ eziokwu ma dabara ndị a, ebe “nke ọma” nwekwara ike ịpụta nanị na o mere ya nke ọma.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Akara mkpu na-edobe ịdị nkọ nke ụdị ịkpọ mmadụ okwu ozugbo; “sị:” na-ewebata amaokwu Aịzaya nke na-esote.
