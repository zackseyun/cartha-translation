  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: ig
  text: Mgbe ahụ, Jisọs kpọrọ ndị na-eso ụzọ ya ka ha bịakwute ya, sị, “Ana m emere ìgwè mmadụ a ebere,[a] n’ihi na ha na m anọọla ụbọchị atọ ugbu a,[b] ha enweghịkwa ihe ha ga-eri. Achọghị m iziga ha laa n’enweghị nri,[c] ka ike ghara ịgwụ ha n’ụzọ.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ebere ìgwè mmadụ a na-emetụ m n’obi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha na m nọrọla ụbọchị atọ ugbu a.”
    reason: lexical_alternative
  - marker: c
    text: Okwu Grik a n’ụzọ nkịtị pụtara “na-ebu ọnụ” ma ọ bụ “n’enweghị nri.” N’ebe a, ọ pụtara na ha eribeghị nri, ọ bụghị na ha ji aka ha na-ebu ọnụ n’ihi ofufe.
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “ka ha ghara ịda n’ụzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: kpọrọ ... ka ha bịakwute ya
  rationale: Nke a na-egosi na Jizọs kpọrọ ndị na-eso ụzọ ya ka ha bịaruo ya nso, ma na-ada ka Igbo nkịtị.
- source_word: Σπλαγχνίζομαι
  choice: Ebere ... na-emetụ m n’obi
  rationale: Ọ na-egosipụta ọmịiko miri emi nke okwu Grik ahụ nwere n’asụsụ Igbo doro anya ma dị ndụ.
- source_word: ὄχλον
  choice: ìgwè mmadụ
  rationale: Nke a bụ okwu Igbo kwesịrị ekwesị maka ọtụtụ mmadụ gbakọrọ n’otu ebe.
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: ha na m anọọla ụbọchị atọ ugbu a
  rationale: Ọ na-echekwa echiche nke ịnọgide na Jizọs ruo ụbọchị atọ, n’usoro okwu Igbo dị mma.
- source_word: τί φάγωσιν
  choice: ha enweghị ihe ha ga-eri
  rationale: Nke a bụ ụzọ Igbo doro anya e si kwuo na nri adịghị ha.
- source_word: ἀπολῦσαι
  choice: izilaga ha
  rationale: N’ọnọdụ a, ọ pụtara ikwe ka ìgwè ahụ laa ma ọ bụ iziga ha ka ha pụọ.
- source_word: νήστεις
  choice: n’agụghị nri
  rationale: Ọ na-egosi na ha eribeghị nri, na-enweghị ime ka a ghọta ya dịka ibu ọnụ okpukpe.
- source_word: μήποτε ἐκλυθῶσιν
  choice: ka ike ghara ịgwụ ha
  rationale: Ọ na-echekwa echiche nke ihe Jizọs na-atụ ụjọ na ọ pụrụ ime—na ike pụrụ ịgwụ ha ma ọ bụ na ha pụrụ ịda mba n’ụzọ.
- source_word: ἐν τῇ ὁδῷ
  choice: n’ụzọ
  rationale: Nke a bụ okwu Igbo dị nkenke ma kwekọọ na njem ha ga-eme mgbe ha na-ala.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere akara ndetu ala peeji niile n’ebe okwu ha na-akọwa dị, ma e zere okwu nwere ike ime ka agụụ a bụrụ ibu ọnụ okpukpe.
