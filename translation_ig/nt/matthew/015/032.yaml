review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ calling the disciples, his compassion, the crowd’s three-day continued presence, their lack of food, and the feared outcome on the journey. However, “n’agụghị nri” means literally ‘without reading food’ and does not express νήστεις (‘without food/hungry’).
  naturalness: The revised wording uses idiomatic Standard Igbo. “Ana m emere … ebere” naturally expresses compassion, and “n’enweghị nri” clearly denotes being unfed. The feared-result clause is retained in a natural form.
  terminology: Use “Jisọs,” the customary Standard Igbo biblical form. “Ìgwè mmadụ” is appropriate for ὄχλος; “ebere” suitably conveys the compassion term without importing doctrinal interpretation.
  issues:
  - severity: high
    issue: “n’agụghị nri” is semantically and grammatically unsuitable.
    rationale: The expression derives from ‘to read’ (gụ) and cannot mean ‘hungry’ or ‘without food.’ It materially obscures νήστεις.
  - severity: medium
    issue: Footnote anchor [b] is attached to “ihe ha ga-eri,” though its note concerns the preceding three-day stay.
    rationale: The anchor should immediately follow the clause it explains.
  - severity: low
    issue: The footnote alternative “ka ha ghara ịda mba” can mean becoming discouraged rather than fainting or collapsing.
    rationale: Replace it with an alternative that retains physical exhaustion or collapse.
  revised_text: Mgbe ahụ, Jisọs kpọrọ ndị na-eso ụzọ ya ka ha bịakwute ya, sị, “Ana m emere ìgwè mmadụ a ebere,[a] n’ihi na ha na m anọọla ụbọchị atọ ugbu a,[b] ha enweghịkwa ihe ha ga-eri. Achọghị m iziga ha laa n’enweghị nri,[c] ka ike ghara ịgwụ ha n’ụzọ.”[d]
