revisions:
- from: Mgbe ahụ, Jizọs kpọrọ ndị na-eso ụzọ ya ka ha bịakwute ya wee sị, “Ebere ìgwè mmadụ a na-emetụ m n’obi,[a] n’ihi na ha na m anọọla ụbọchị atọ ugbu a, ma ha enweghị ihe ha ga-eri.[b] Achọghị m izilaga ha n’agụghị nri,[c] ka ike ghara ịgwụ ha n’ụzọ.”[d]
  to: Mgbe ahụ, Jisọs kpọrọ ndị na-eso ụzọ ya ka ha bịakwute ya, sị, “Ana m emere ìgwè mmadụ a ebere,[a] n’ihi na ha na m anọọla ụbọchị atọ ugbu a,[b] ha enweghịkwa ihe ha ga-eri. Achọghị m iziga ha laa n’enweghị nri,[c] ka ike ghara ịgwụ ha n’ụzọ.”[d]
  rationale: The revision corrects the mistranslation of ‘hungry/unfed,’ relocates the misplaced [b] anchor, and removes an alternative that can imply discouragement rather than physical collapse. It also regularizes the conventional Standard Igbo form “Jisọs,” while preserving the Greek syntax and sense without adding interpretation.
