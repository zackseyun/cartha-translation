id: MAT.15.19
reference: Matthew 15:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: ig
  text: N’ihi na ọ bụ n’obi ka echiche ọjọọ, igbu ọchụ, ịkwa iko, omume rụrụ arụ nke mmekọahụ, izu ohi, ịgba akaebe ụgha, na okwu nkwutọ[a] si apụta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwu nkwulu.” Okwu Greek a nwere ike ịpụta okwu nkwutọ megide mmadụ ma ọ bụ okwu nkwulu megide Chineke, dabere n’ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας
  choice: N’ihi na ọ bụ n’obi ka ... si apụta
  rationale: “N’ihi na” na-egosipụta ọrụ nkọwa nke γάρ, ebe “n’obi ... si” na-echekwa echiche ἐκ banyere isi mmalite. Usoro a bụkwa Igbo dị mma ma na-edobe ihe atụ nke obi dịka ime mmadụ.
- source_word: ἐξέρχονται
  choice: si apụta
  rationale: Nke a na-egosipụta ihe ndị ahụ dịka ihe na-esi n’obi pụta, kwekọọ na ngwaa Greek na echiche banyere mmalite.
- source_word: διαλογισμοὶ πονηροί
  choice: echiche ọjọọ
  rationale: διαλογισμοί nwere ike ịbụ echiche, ntụgharị uche, ma ọ bụ atụmatụ; “echiche ọjọọ” bụ okwu sara mbara nke na-adịghị amanye naanị echiche nke izube ihe ọjọọ.
- source_word: φόνοι
  choice: igbu ọchụ
  rationale: Ọ na-egosi igbu mmadụ n’ụzọ mmehie, ọ bụghị ụdị igbu niile n’enweghị ọdịiche. Igbo na-ejikarị aha omume otu n’otu n’usoro ndepụta dị otú a.
- source_word: μοιχεῖαι
  choice: ịkwa iko
  rationale: Ọ bụ okwu Igbo a na-ahụkarị maka mmebi alụmdi na nwunye site n’inwe mmekọahụ n’èzí ya.
- source_word: πορνεῖαι
  choice: omume rụrụ arụ nke mmekọahụ
  rationale: Nke a na-echekwa obosara πορνεῖαι dịka ụdị omume mmekọahụ iwu na-akwadoghị, kama ime ka ọ bụrụ naanị otu ụdị mmehie mmekọahụ.
- source_word: κλοπαί
  choice: izu ohi
  rationale: Ọ bụ okwu Igbo kpọmkwem ma doo anya maka izuru ihe.
- source_word: ψευδομαρτυρίαι
  choice: ịgba akaebe ụgha
  rationale: Nke a na-echekwa echiche nke ịgba akaebe, gụnyere ọnọdụ ikpe ma ọ bụ nkwupụta e mere megide onye ọzọ.
- source_word: βλασφημίαι
  choice: okwu nkwutọ
  rationale: N’usoro mmehie a, okwu a nwere ike ịpụta okwu na-emebi aha mmadụ; “okwu nkwutọ” na-egosipụta nke ahụ n’Igbo n’enweghị imechi ohere nke nkwulu megide Chineke, nke e debere na ndetu.
theological_decisions:
- issue: Onye ma ọ bụ ihe βλασφημίαι na-emegide
  choice: okwu nkwutọ
  alternative: okwu nkwulu megide Chineke
  rationale: Greek nwere ike ịpụta ikwu okwu na-emebi aha mmadụ ma ọ bụ ikwulu Chineke, dabere n’ọnọdụ. Ebe amaokwu a bụ ndepụta izugbe nke ihe ọjọọ, ederede bụ isi ji okwu sara mbara gbasara nkwutọ, ebe ndetu na-echekwa nkọwa nke nkwulu megide Chineke.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A haziri ahịrịokwu ahụ n’usoro Igbo eke—“ọ bụ n’obi ka ... si apụta”—ma debe ndepụta mmehie ndị dị na Greek. E tinyere akara ndetu [a] n’ebe βλασφημίαι dị, n’ihi na ọ bụ okwu ndetu ahụ na-akọwa.
