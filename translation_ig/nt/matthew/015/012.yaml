id: MAT.15.12
reference: Matthew 15:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: ig
  text: Mgbe ahụ, ndị na-eso ụzọ ya bịakwutere ya sị, “Ị̀ ma na okwu a kpasuru ndị Farisii iwe mgbe ha nụrụ ya?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị Farisii were ya dị ka ihe mkpasu iwe”; n’ụzọ nkịtị karị, “okwu a mere ka ha sụọ ngọngọ.”
    reason: lexical_alternative
  - marker: b
    text: “Okwu a” na-ezo aka n’ihe Jizọs kwuru tupu nke a.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe sochiri ihe gara aga n’usoro akụkọ n’asụsụ Igbo dị mfe ma dịkwa ebube.
- source_word: προσελθόντες
  choice: bịakwutere ya
  rationale: Ọ na-egosipụta ịbịaru Jizọs nso; e jikọtara participle ahụ na ngwaa isi n’ụzọ Igbo nkịtị.
- source_word: οἱ μαθηταὶ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị na-eso ụzọ; e tinyere “ya” iji mee ka onye ha na-eso doo anya n’asụsụ Igbo, ọ bụ ezie na Greek nwere naanị article.
- source_word: λέγουσιν αὐτῷ
  choice: sị
  rationale: Historical present ka a sụgharịrị dịka ihe gara aga kwekọrọ n’usoro akụkọ Igbo; “sị” na-ebute okwu kpọmkwem n'ụzọ eke.
- source_word: Οἶδας
  choice: Ị̀ ma
  rationale: Ọ bụ ajụjụ kpọmkwem nke na-edobe isi echiche nke οἶδα n’enweghị nkọwa agbakwunyere.
- source_word: οἱ Φαρισαῖοι
  choice: ndị Farisii
  rationale: Nke a bụ transliteration a na-eji n’Igbo maka aha òtù ahụ.
- source_word: ἀκούσαντες τὸν λόγον
  choice: mgbe ha nụrụ ya
  rationale: Ọ na-egosipụta participle nke oge n’Igbo eke; “ya” na-ezo aka n’“okwu a” e kwuru tupu ya.
- source_word: ἐσκανδαλίσθησαν
  choice: okwu a kpasuru ... iwe
  rationale: Nke a na-egosi mmeghachi omume ọjọọ nke ndị Farisii n'ụzọ Igbo a na-aghọta, ma footnote na-echekwa echiche ndị ọzọ nke okwu Greek ahụ.
theological_decisions:
- issue: Nkọwa σκανδαλίζω n’ebe a
  choice: okwu a kpasuru ndị Farisii iwe
  alternative: ndị Farisii were ya dị ka ihe mkpasu iwe; okwu a mere ka ha sụọ ngọngọ
  rationale: N’ọnọdụ a, okwu ahụ na-akọ mmeghachi omume ọjọọ ha n’ozizi Jizọs. Nsụgharị bụ isi na-ada n’Igbo eke, ebe ndetu na-echekwa ihe atụ nkịtị nke ‘ịsụ ngọngọ’ n’enweghị itinye nkọwa ozizi karịrị ihe ederede kwuru.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị mfe nghọta ma dịkwa ùgwù. E debere usoro akụkọ n’ụzọ eke, ma jiri ndetu chekwaa obosara echiche nke okwu Greek.
