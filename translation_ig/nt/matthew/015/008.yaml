  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: ig
  text: Ndị mmadụ a na-eji egbugbere ọnụ ha asọpụrụ m, ma obi ha[a] dị anya n'ebe m nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'asụsụ Grik, “obi” dị n'otu. Nke a pụrụ ịdị na-ekwu maka otu ọnọdụ ime nke ndị mmadụ a n'ozuzu, ma ọ bụ maka obi onye ọ bụla n'ime ha.
    reason: grammatical_note
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: Ndị a
  rationale: Nke a na-egosipụta otu ìgwè mmadụ a kpọtụrụ aka ma na-edobe ike ngosi nke οὗτος n'Igbo dị mfe ma bụrụkwa eke.
- source_word: τοῖς χείλεσίν
  choice: ji egbugbere ọnụ ha
  rationale: “Ji” na-egosipụta dative nke ngwá ọrụ, ebe “egbugbere ọnụ” na-edobe ihe atụ ahụ kpọmkwem kama ịgbanwe ya ka ọ bụrụ okwu ma ọ bụ ikwu okwu.
- source_word: με
  choice: m
  rationale: Ọ bụ ihe nnara kpọmkwem nke τιμᾷ.
- source_word: τιμᾷ
  choice: asọpụrụ
  rationale: “Ịsọpụrụ” na-egosipụta inye nsọpụrụ nke ọma n'Igbo ugbu a, na-enweghị ime ka ọ pụta ihe karịrị ihe τιμάω kwuru.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: ma obi ha
  rationale: “Ma” na-egosipụta ntụgharị δέ; “obi” ka dị n'otu dịka καρδία Grik, ebe “ha” na-egosi na ọ bụ obi nke ndị ahụ n'ozuzu ha.
- source_word: πόρρω
  choice: n'ebe dị anya
  rationale: Nkebiokwu a na-egosipụta ịdị anya nke πόρρω n'ụzọ doro anya ma bụrụkwa eke n'Igbo.
- source_word: ἀπέχει ἀπ’ ἐμοῦ
  choice: nọ m n'ebe dị anya
  rationale: Nke a na-egosipụta ọnọdụ nke ịnọpụ n'ebe onye ọzọ nọ, ma na-edobe ma ihe oyiyi nke anya ma echiche mmekọrịta dị n'okwu ahụ.
theological_decisions:
- issue: Obi dị n'otu nke na-anọchi anya ìgwè mmadụ, ma ọ bụ obi dị n'ọtụtụ
  choice: 'Edebere otu: “obi ha”'
  alternative: “obi ndị ahụ” ma ọ bụ ntụgharị ga-eme ka obi bụrụ ọtụtụ
  rationale: καρδία dị n'otu na Grik ma eleghị anya na-anọchi anya ọnọdụ ime mmụọ nke ndị ahụ dịka otu ìgwè. Igbo “obi ha” bụkwa ụzọ eke isi jikọta otu aha “obi” na ọtụtụ ndị nwe ya, ya mere ọ na-echekwa esemokwu na ike okwu ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Edebere ihe oyiyi “egbugbere ọnụ” na “obi,” tinyere otu ụdị “obi” nke ederede Grik.
