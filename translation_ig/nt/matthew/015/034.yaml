id: MAT.15.34
reference: Matthew 15:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πόσους ἄρτους ἔχετε; οἱ δὲ εἶπαν· Ἑπτά, καὶ ὀλίγα ἰχθύδια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: ig
  text: Jizọs wee sị ha, “Ogbe achịcha ole ka unu nwere?” Ha sịrị, “Asaa, na azụ nta ole na ole[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ naanị, “azụ”; okwu Grik ahụ ji ụdị mbelata okwu, nke na-egosi azụ dị nta.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: wee sị
  rationale: Okwu Grik dị n'ụdị historical present, ma n'akụkọ Igbo, “wee sị” na-egosi nke ọma na ihe a mere na-aga n'ihu n'usoro akụkọ.
- source_word: Πόσους ἄρτους
  choice: Ogbe achịcha ole
  rationale: ἄρτους bụ achịcha ndị a pụrụ ịgụ ọnụ; “ogbe achịcha” bụ ụzọ Igbo doro anya isi gosi achịcha n'otu n'otu.
- source_word: ἔχετε
  choice: ka unu nwere
  rationale: Nke a na-edobe ajụjụ oge ugbu a n'Igbo nkịtị ma doo anya.
- source_word: οἱ δὲ εἶπαν
  choice: Ha sịrị
  rationale: δέ ebe a na-aga n'ihu n'akụkọ, ọ bụghị mmegide siri ike; ya mere, a hapụrụ njikọ ọzọ nke nwere ike ime ka okwu sie ike karịa isi Grik.
- source_word: Ἑπτά
  choice: Asaa
  rationale: Ntụgharị kpọmkwem nke ọnụọgụ ahụ.
- source_word: ὀλίγα
  choice: ole na ole
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa maka ọnụ ọgụgụ dị nta a na-akọwaghị kpọmkwem.
- source_word: ἰχθύδια
  choice: azụ nta
  rationale: Ụdị okwu Grik a bụ diminutive, ya mere “azụ nta” na-echekwa echiche nke azụ ndị dị obere.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo izugbe, nke dị ugbu a ma nwee ugwu; e ji usoro akụkọ “wee sị” mee ka akụkọ na-aga nke ọma. E tinyeghị nkọwa ụka ma ọ bụ echiche onye ntụgharị n'ime amaokwu ahụ.
