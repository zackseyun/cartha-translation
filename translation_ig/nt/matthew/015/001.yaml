  text: Τότε προσέρχονται τῷ ⸀Ἰησοῦ ἀπὸ Ἱεροσολύμων ⸂Φαρισαῖοι καὶ γραμματεῖς⸃ λέγοντες
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: ig
  text: 'Mgbe ahụ, ndị Farisii na ndị odeakwụkwọ[b] si Jeruselem bịakwutere Jizọs[a], sị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “bịaruo Jizọs nso.”
    reason: lexical_alternative
  - marker: b
    text: N’ọnọdụ a, “ndị odeakwụkwọ” nwekwara ike ịpụta “ndị ọkachamara n’Iwu” ma ọ bụ “ndị nkuzi Iwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ akara oge na-ewebata ihe omume na-esonụ; “Mgbe ahụ” bụ Igbo doro anya nke na-echekwa usoro akụkọ ahụ.
- source_word: προσέρχονται
  choice: bịakwutere
  rationale: Okwu a na-egosi ịbịaru mmadụ nso ma ọ bụ ịbịakwute ya. Oge gara aga dị eke karị n’akụkọ Igbo, ebe ndetu ala na-echekwa nhọrọ “bịaruru nso”.
- source_word: τῷ Ἰησοῦ
  choice: Jizọs
  rationale: Onye a bịakwutere bụ Jizọs; ngwaa Igbo “bịakwutere” ejighị okwu ọzọ kwekọrọ na “to” n’ebe a.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: si Jeruselem
  rationale: “Si” na-egosi ebe ha siri bịa, n’enweghị ịgbakwunye echiche na e zigara ha n’ọrụ gọọmenti ma ọ bụ nke okpukpe.
- source_word: Φαρισαῖοι
  choice: ndị Farisii
  rationale: Aha a maara nke òtù ndị Juu ahụ ka e dere n’ụdị dabara n’Igbo.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nhọrọ a na-echekwa ọdịdị okwu Grik ahụ; n’ọnọdụ a, ọ pụrụ ịpụta ndị ọkachamara ma ọ bụ ndị nkuzi Iwu, nke ndetu ala kọwara.
- source_word: καὶ
  choice: na
  rationale: Njikọ Igbo dị mfe nke jikọtara òtù abụọ ahụ.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-ewebata okwu ha ga-ekwu n’amaokwu na-esonụ ma na-echekwa njikọ participle nke Grik.
theological_decisions:
- issue: Oge ngwaa n’akụkọ
  choice: Jiri oge gara aga “bịakwutere” n’Igbo
  alternative: 'Jide oge ugbu a nke Grik: “na-abịakwute”'
  rationale: Grik ji historical present mee ka akụkọ dị ndụ. Ma n’Igbo, oge gara aga bụ ụzọ nkịtị na nke doro anya isi kọọ ihe mere; nke a anaghị agbanwe ihe omume ahụ ma ọ bụ ihe mmụta okpukpe dị na ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ndị odeakwụkwọ” chekwaa njikọ lexical na γραμματεῖς, ebe ndetu ala na-eme ka ọrụ iwu na nkuzi ha doo anya. Akara ndetu [a] na [b] pụtara n’ederede isi.
