  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: ig
  text: Ma ọ zaghị ya otu okwu. Ndị na-eso ụzọ ya bịakwutere ya, na-arịọ ya ugboro ugboro, sị, “Zipụ ya ka ọ laa[a], n’ihi na ọ na-eti mkpu n’azụ anyị[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu ndị na-eso ụzọ ahụ ekwughị kpọmkwem ma ihe ha bu n’obi bụ, “Meere ya ihe ọ na-arịọ, zipụzie ya ka ọ laa,” ka ọ bụ naanị, “Chụpụ ya n’ebe anyị nọ.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “na-eso anyị.” Okwu Grik ahụ nwere ike ịpụta ịnọ n’azụ mmadụ ma ọ bụ ịgbaso mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῇ λόγον
  choice: ọ zaghị ya otu okwu
  rationale: 'Nke a na-echekwa nkwusi ike dị n’akpaokwu Grik ahụ: Jizọs azaghị ya ihe ọ bụla.'
- source_word: προσελθόντες
  choice: bịakwutere ya
  rationale: Ọ na-egosi na ndị na-eso ụzọ ahụ bịara nso Jizọs; okwu a bụ nke nkịtị ma doo anya n’Igbo ugbu a.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ ụzọ doro anya, nke a na-aghọta nke ọma, isi kwuo μαθηταί n’ọnọdụ a.
- source_word: ἠρώτουν
  choice: nọgide na-arịọ ya
  rationale: Ụdị imperfect dị na Grik na-egosi arịrịọ gara n’ihu ma ọ bụ e mere ugboro ugboro; ‘nọgide na-arịọ’ na-egosipụta nke ahụ n’enweghị ime ka okwu ahụ sie ike karịa ka ọ dị.
- source_word: Ἀπόλυσον αὐτήν
  choice: Zipụ ya ka ọ laa
  rationale: ἀπολύω pụtara izipụ mmadụ ka ọ laa ma ọ bụ ịhapụ ya; nsụgharị a dị mfe ma ghara ikpebi ma ndị na-eso ụzọ chọrọ ka e buru ụzọ meere ya ihe ọ rịọrọ.
- source_word: κράζει
  choice: ọ na-eti mkpu
  rationale: κράζω na-egosi ịkpọku ma ọ bụ iti mkpu n’olu dara ụda; usoro ‘na-’ na-egosikwa omume ahụ na-aga n’ihu.
- source_word: ὄπισθεν ἡμῶν
  choice: n’azụ anyị
  rationale: Nke a na-echekwa ihe okwu ahụ pụtara n’ụzọ nkịtị, ebe nkọwa ala peeji na-egosikwa na ọ pụrụ ịpụta iso mmadụ n’azụ.
theological_decisions:
- issue: Ihe ndị na-eso ụzọ bu n’obi mgbe ha kwuru Ἀπόλυσον αὐτήν
  choice: E dere ya n’ụzọ na-anọpụ iche dịka ‘Zipụ ya ka ọ laa,’ n’akọwaghị ma ha chọrọ ka Jizọs meere ya ihe ọ rịọrọ tupu o zipụ ya.
  alternative: ‘Meere ya ihe ọ na-arịọ, zipụzie ya ka ọ laa,’ ma ọ bụ ‘Chụpụ ya n’ebe anyị nọ.’
  rationale: Iwu Grik ahụ ekwughị kpọmkwem otú a ga-esi mee ka nwanyị ahụ laa. Nkebiokwu so ya na-egosi na mkpu ya na-enye ha nsogbu, ma ọ naghị edozi ihe ha chọrọ ka Jizọs mee; ya mere, a hapụrụ mgbagwoju anya ahụ ka ọ dị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ ‘ndị na-eso ụzọ’ kama okwu ụka pụrụ iche, ma debe usoro akụkọ ahụ nkenke. A kpara akara ala peeji na nkebiokwu ndị ha na-akọwa n’ezie.
