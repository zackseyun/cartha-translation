  verdict: revise
  source_fidelity: The main rendering closely follows the Greek. “Ọ zaghị ya otu okwu” accurately conveys οὐκ ἀπεκρίθη αὐτῇ λόγον, “bịakwutere ya” reflects προσελθόντες, and “na-arịọ ya ugboro ugboro” appropriately represents the imperfect ἠρώτουν. “Zipụ ya ka ọ laa” preserves the deliberate ambiguity of Ἀπόλυσον αὐτήν. “n’azụ anyị” retains the primary spatial sense of ὄπισθεν ἡμῶν.
  naturalness: The verse is clear and idiomatic in Standard Igbo. Replacing “nọgide na-arịọ ya” with “na-arịọ ya ugboro ugboro” more naturally and explicitly conveys the repeated/continuing force in this narrative context. The alternate wording in footnote b is streamlined to avoid the redundant expression “na-eso anyị n’azụ.”
  terminology: “Ndị na-eso ụzọ ya” is an appropriate modern Standard Igbo rendering of μαθηταὶ αὐτοῦ. The wording for loud calling, “na-eti mkpu,” is suitable for κράζει and maintains the narrative register. No doctrinal interpretation is introduced.
  issues:
  - severity: low
    issue: The expression “nọgide na-arịọ ya” is somewhat less natural here than an explicitly iterative construction.
    rationale: The imperfect ἠρώτουν indicates continued or repeated asking. “Na-arịọ ya ugboro ugboro” communicates this naturally without strengthening the verb to pleading.
  - severity: low
    issue: Footnote b’s alternative “na-eso anyị n’azụ” is stylistically redundant.
    rationale: For the pursuit sense of ὄπισθεν ἡμῶν, “na-eso anyị” is sufficient and more idiomatic; the note can explain the spatial-versus-pursuit distinction directly.
  revised_text: Ma ọ zaghị ya otu okwu. Ndị na-eso ụzọ ya bịakwutere ya, na-arịọ ya ugboro ugboro, sị, “Zipụ ya ka ọ laa[a], n’ihi na ọ na-eti mkpu n’azụ anyị[b].”
