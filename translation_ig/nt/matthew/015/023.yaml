  to: Ma ọ zaghị ya otu okwu. Ndị na-eso ụzọ ya bịakwutere ya, na-arịọ ya ugboro ugboro, sị, “Zipụ ya ka ọ laa[a], n’ihi na ọ na-eti mkpu n’azụ anyị[b].”
