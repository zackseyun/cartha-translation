  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: ig
  text: Ndị na-eso ụzọ ya wee sị ya, “Olee ebe anyị ga-esi nweta achịcha ga-ezuru, n’ebe a mmadụ na-ebighị[a], ka afọ juo igwe mmadụ buru ibu dị otu a?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ọzara” ma ọ bụ “n’ebe tọgbọrọ n’efu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: wee sị
  rationale: Oge ugbu a e ji akọ akụkọ n’asụsụ Grik ka e gosipụtara n’ụzọ akụkọ Igbo na-aga were were, nke na-adabara ọnọdụ gara aga.
- source_word: οἱ μαθηταί
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ otu ndị a marala n’akụkọ ahụ; ‘ya’ na-eme ka onye ha na-eso doo anya n’Igbo, ọ bụ ezie na isiokwu Grik n’onwe ya kwuru naanị ‘ndị na-eso ụzọ ahụ.’
- source_word: Πόθεν ἡμῖν
  choice: Olee ebe anyị ga-esi nweta
  rationale: Nke a na-egosipụta ajụjụ gbasara ebe ihe ga-esi bịa n’ụzọ Igbo dị ndụ ma doo anya.
- source_word: ἐν ἐρημίᾳ
  choice: n’ebe a mmadụ na-ebighị
  rationale: Ọ na-egosi mpaghara tọgbọrọ n’enweghị ndị bi na ya, na-etinyeghị echiche na ọ ga-abụrịrị ọzara aja.
- source_word: ἄρτοι τοσοῦτοι
  choice: achịcha ga-ezuru
  rationale: Ọ bụ ezie na Grik pụtara n’ụzọ nkịtị ‘ogbe achịcha dị ọtụtụ otu a,’ okwu a na-egosi achịcha zuru oke maka mkpa a kpọrọ aha.
- source_word: χορτάσαι
  choice: inye ... afọ
  rationale: Akpaokwu Igbo a na-egosi inye mmadụ nri ruo mgbe afọ juru ya, ọ bụghị naanị ikesa nri.
- source_word: ὄχλον τοσοῦτον
  choice: igwe mmadụ buru ibu dị otu a
  rationale: Nke a na-echekwa ma echiche igwe mmadụ ma nkwusi ike nke τοσοῦτον.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ajụjụ ndị na-eso ụzọ na echiche nke ebe mmadụ na-ebighị, achịcha zuru oke, na inye igwe mmadụ afọ.
