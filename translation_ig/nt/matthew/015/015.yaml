id: MAT.15.15
reference: Matthew 15:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Φράσον ἡμῖν τὴν παραβολὴν ⸀ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/015.yaml
  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: ig
  text: Ma Pita zara ya, sị, “Kọwaara anyị ilu a.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Kọrọ anyị ilu a,” ma ọ bụ, “Mee ka ilu a doo anyị anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς
  choice: zara
  rationale: Okwu a bụ participle nke ἀποκρίνομαι, ma n’akụkọ ọ na-arụ ọrụ dị ka ‘ịza.’ ‘Zara’ bụ ụzọ Igbo dị mfe ma doo anya isi gosi nzaghachi Pita.
- source_word: δὲ
  choice: Ma
  rationale: δέ na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n’ihe a na-akọ; ‘Ma’ na-egosipụta nke a nke ọma n’ebe a.
- source_word: εἶπεν
  choice: sị
  rationale: λέγω bụ okwu nkịtị maka ikwu. Njikọ ‘zara ya, sị’ na-edobe usoro echiche Grik Ἀποκριθεὶς... εἶπεν ma na-ada nke ọma n’Igbo.
- source_word: αὐτῷ
  choice: ya
  rationale: Dative pronoun a na-egosi onye Pita gwara okwu; ‘ya’ bụ ntụgharị Igbo dabara adaba, ebe onye a na-ekwu maka ya doro anya site n’ọnọdụ okwu.
- source_word: Φράσον
  choice: Kọwaara
  rationale: Imperative nke φράζω pụtara ime ka ihe doo anya, ịkọwa, ma ọ bụ ime ka a mara ya. ‘Kọwaara’ dabara n’arịrịọ ka e mee ka okwu ihe atụ Jizọs doo anya.
- source_word: ἡμῖν
  choice: anyị
  rationale: Dative pronoun a bụ ndị a na-akọwaara ihe; suffix ‘-ara’ dị na ‘kọwaara’ na-eme ka ‘anyị’ pụta dị ka ndị a na-emere nkọwa ahụ.
- source_word: παραβολὴν
  choice: ilu
  rationale: N’Igbo Akwụkwọ Nsọ, ‘ilu’ bụ okwu a na-ahụkarị maka παραβολή, ma nwee ike ịpụta okwu ma ọ bụ akụkọ ihe atụ. Ọ na-edobe obosara okwu Grik n’ebe a.
- source_word: ταύτην
  choice: a
  rationale: Demonstrative a na-atụ aka n’okwu e kwuru ozugbo tupu nke a; ‘a’ bụ ụzọ Igbo nkịtị isi kwuo ‘this.’
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu mee ntụgharị ahụ. E debere usoro ‘zara ya, sị’ iji gosipụta usoro akụkọ Grik n’enweghị ime ka Igbo sie ike. ‘Ilu’ na-edobe ohere na παραβολή nwere ike ịbụ ilu, okwu ihe atụ, ma ọ bụ ihe atụ e kwesịrị ịkọwa.
