revisions:
- from: Ma lee, otu nwanyị Kenan si n’ógbè ndị ahụ pụta, nọ na-eti mkpu, sị, “Meere m ebere, Onyenwe anyị, Nwa Devid! Mmụọ ọjọọ na-emekpa nwa m nwanyị ahụ nke ukwuu[a].”
  to: Ma lee, otu nwanyị Kenan si n’ógbè ndị ahụ pụta, nọ na-eti mkpu, na-ekwu, “Meere m ebere, Onyenwe anyị, Nwa Devid! Nwa m nwanyị na-ata ahụhụ nke ukwuu n’aka mmụọ ọjọọ[a].”
  rationale: The revision removes an unsupported demonstrative and supplies a natural equivalent for the participial “saying.” It retains the draft’s appropriately cautious rendering of δαιμονίζεται and its lexical-alternative footnote.
