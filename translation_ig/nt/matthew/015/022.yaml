    text: Ma ọ bụ, “Mmụọ ọjọọ ji nwa m nwanyị nke ukwuu,” ma ọ bụ, “Nwa m nwanyị nọ n’okpuru ike mmụọ ọjọọ, na-atakwa ezigbo ahụhụ.”
