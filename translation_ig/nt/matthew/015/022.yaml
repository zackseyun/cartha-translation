id: MAT.15.22
reference: Matthew 15:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: ig
  text: Ma lee, otu nwanyị Kenan si n’ógbè ndị ahụ pụta, nọ na-eti mkpu, na-ekwu, “Meere m ebere, Onyenwe anyị, Nwa Devid! Nwa m nwanyị na-ata ahụhụ nke ukwuu n’aka mmụọ ọjọọ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mmụọ ọjọọ ji nwa m nwanyị nke ukwuu,” ma ọ bụ, “Nwa m nwanyị nọ n’okpuru ike mmụọ ọjọọ, na-atakwa ezigbo ahụhụ.”
    reason: Ụdị ngwaa Grik δαιμονίζεται na-egosi na mmụọ ọjọọ metụtara ọnọdụ nwa nwanyị ahụ, ma ọ naghị akọwa kpọmkwem ụdị ọchịchị ma ọ bụ nhụjuanya ahụ.
lexical_decisions:
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” bụ akara okwu e ji adọta uche onye na-agụ ihe ma na-eme ka akụkọ ahụ dị ndụ; ọ ka mma karịa ịhapụ ya kpamkpam.
- source_word: Χαναναία
  choice: nwanyị Kenan
  rationale: Matiu kpọrọ ya onye Kenan kpọmkwem. Nke a na-echekwa njikọ okwu ahụ na akụkọ Izrel kama iji “onye Siro-Fonishịa” dị na akụkọ Mak.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: si n’ógbè ndị ahụ
  rationale: N’ebe a, ὅρια na-ezo aka n’ókèala ma ọ bụ ógbè. Nsụgharị a bụ Igbo dị mfe ma na-echekwa echiche nke ọtụtụ ógbè ahụ.
- source_word: ἐξελθοῦσα
  choice: pụta
  rationale: 'E ji ngwaa dị mfe tinye participle a n’usoro akụkọ Igbo: nwanyị ahụ si n’ógbè ndị ahụ pụta.'
- source_word: ἔκραζεν
  choice: nọ na-eti mkpu
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro; “nọ na-eti mkpu” na-echekwa nke ahụ.
- source_word: Ἐλέησόν με
  choice: Meere m ebere
  rationale: Nke a bụ ụzọ Igbo doro anya na nke a na-ejikarị ekwupụta arịrịọ ebere siri ike.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: Aha a na-echekwa ugwu dị na κύριε. Ebe e jikọtara ya na “Nwa Devid,” ọ pụrụ ịbụ ihe karịrị nanị ịkpọ mmadụ “nna anyị ukwu.”
- source_word: υἱὸς Δαυίδ
  choice: Nwa Devid
  rationale: Nsụgharị nkịtị a na-echekwa aha metụtara Mesaịa na ọchịchị eze sitere n’agbụrụ Devid.
- source_word: κακῶς
  choice: nke ukwuu
  rationale: Okwu a na-egosi na ọnọdụ nwa ahụ siri ike; “nke ukwuu” na-asụgharị ike nke ọnọdụ ahụ n’Igbo nkịtị.
- source_word: δαιμονίζεται
  choice: Mmụọ ọjọọ na-emekpa ... ahụ
  rationale: Nke a na-egosi n'ụzọ doro anya na mmụọ ọjọọ bụ ihe kpatara nhụjuanya nwa ahụ, ma ọ naghị ekpebi karịa ihe ngwaa Grik ahụ kwuru banyere kpọmkwem otú mmụọ ahụ si achị ya.
theological_decisions:
- issue: Otu e si asụgharị κύριε mgbe nwanyị ahụ kpọkwara Jizọs “Nwa Devid”
  choice: Onyenwe anyị
  alternative: nna anyị ukwu; onye nwe m
  rationale: Njikọ ya na “Nwa Devid” na-enye okwu ahụ ugwu na ihe nwere ike ịbụ nghọta gbasara Mesaịa. “Onyenwe anyị” na-echekwa nke a ma ọ naghị ekwu na nwanyị ahụ egosila nkwupụta okwukwe zuru ezu.
- issue: Otu e si asụgharị δαιμονίζεται
  choice: Mmụọ ọjọọ na-emekpa nwa m nwanyị ahụ
  alternative: Mmụọ ọjọọ ji nwa m nwanyị ahụ; nwa m nwanyị nọ n’okpuru ike mmụọ ọjọọ
  rationale: Grik ahụ na-ekwu hoo haa na ọnọdụ nwa ahụ sitere n’aka mmụọ ọjọọ, ma o doghị anya ma a ga-akọwa ya kpọmkwem dị ka mmụọ ibi n’ime ya, ijide ya, ma ọ bụ imekpa ya ahụ. Isiokwu na nkọwa ala peeji na-echekwa ohere ndị a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Ma lee” na-echekwa ike akara akụkọ ἰδοὺ; “nọ na-eti mkpu” na-echekwa omume na-aga n’ihu. E zere okwu nwere ike ikwu hoo haa na mmụọ ahụ bi n’ime nwa ahụ, ebe Grik n’onwe ya anaghị akọwa otú ọnọdụ ahụ dị kpọmkwem.
