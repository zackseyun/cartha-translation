translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. E debere usoro ndepụta na mmechi dị mkpirikpi nke isi mmalite Grik, ma zere okwu nkwarụ nwere ike ịdị mkparị mgbe enwere ụzọ doro anya karị isi kwuo ya.
