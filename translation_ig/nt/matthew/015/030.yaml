  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: ig
  text: Ọtụtụ ìgwè mmadụ bịakwutere ya, kpọtaara ya ndị ogbi[a], ndị ìsì, ndị ngwụrọ, ndị aka ma ọ bụ ụkwụ ha nwere nkwarụ[b], na ọtụtụ ndị ọzọ. Ha tọgbọrọ ha n’akụkụ ụkwụ ya, o wee gwọọ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ntị chiri.” Okwu Grik κωφούς nwere ike ịpụta ndị ntị chiri, ndị ogbi, ma ọ bụ ndị nwere nsogbu abụọ ahụ, dabere n’ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị akụkụ ahụ ha mebiri emebi.” Okwu Grik κυλλούς na-ezo n’ụzọ sara mbara n’ebe ndị aka ma ọ bụ ụkwụ ha nwere nkwarụ, gbagọrọ agbagọ, ma ọ bụ mebiri emebi nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: bịakwutere
  rationale: Ọ na-egosi ịbịakwute mmadụ; okwu a bụ nke Igbo nkịtị ma dabara n’usoro akụkọ.
- source_word: ὄχλοι πολλοὶ
  choice: Ìgwè mmadụ buru ibu
  rationale: Nke a na-egosi ọtụtụ mmadụ gbakọtara n’ìgwè n’ụzọ dị mfe ma bụrụ Igbo e ji eme ihe ugbu a.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: kpọtaara ya
  rationale: Ọ bụ ezie na okwu Grik pụtara n'ụzọ nkịtị ‘nwere ha na ha,’ n’ọnọdụ a ọ na-egosi na ìgwè mmadụ ahụ kpọtara ndị ahụ bịakwute Jizọs.
- source_word: κωφούς
  choice: ndị ogbi[a]
  rationale: κωφός nwere ike ịpụta ndị na-adịghị ekwu okwu, ndị ntị chiri, ma ọ bụ ndị nwere nsogbu abụọ ahụ. ‘Ndị ogbi’ dabara na ndepụta ọgwụgwọ a, ebe nkọwa ala peeji na-echekwa nghọta ọzọ.
- source_word: τυφλούς
  choice: ndị ìsì
  rationale: Nke a bụ ntụgharị Igbo doro anya na nke a na-ejikarị eme ihe maka τυφλούς.
- source_word: χωλούς
  choice: ndị ngwụrọ
  rationale: Ọ na-ezo aka n’ebe ndị ije ha nwere nsogbu nọ; ‘ndị ngwụrọ’ bụ okwu Igbo dị mkpirikpi ma doo anya.
- source_word: κυλλούς
  choice: ndị aka ma ọ bụ ụkwụ ha nwere nkwarụ[b]
  rationale: Okwu Grik a na-ezo n’ụzọ sara mbara aka ma ọ bụ ụkwụ nwere nkwarụ, mebiri emebi, ma ọ bụ na-adịghị arụ ọrụ nke ọma. Nkebiokwu a zere okwu nwere ike ịdị mkparị ma debe nghọta isi.
- source_word: ἑτέρους πολλούς
  choice: ọtụtụ ndị ọzọ
  rationale: Nke a na-egosi ndị ọzọ nwere nsogbu dị iche iche a na-akọwaghị aha ha.
- source_word: ἔρριψαν
  choice: tọgbọrọ
  rationale: Ọ bụ ezie na ῥίπτω nwere ike ịpụta ‘tụbara,’ ọnọdụ a na-akwado omume ịtọgbọ ma ọ bụ idowe ndị ahụ n’ụkwụ Jizọs, n’enweghị itinye echiche obi ọjọọ na-adịghị mkpa.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: n’ụkwụ ya
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụ nke e ji eme ihe iji gosipụta na e debere ha nso n’ụkwụ ya.
- source_word: ἐθεράπευσεν
  choice: o wee gwọọ ha
  rationale: ‘Gwọọ’ bụ okwu Igbo a na-ejikarị eme ihe maka ịgwọ ọrịa ma ọ bụ nkwarụ, ebe ‘wee’ na-ejikọta omume ahụ n’usoro akụkọ.
