- from: N’ihi na ndị mba ọzọ[a] na-achọsi ihe ndị a niile ike[b]; n’ihi na Nna unu nke eluigwe maara na ihe ndị a niile dị unu mkpa.
  to: N’ihi na ndị mba ọzọ[a] na-achọsi ihe ndị a niile ike[b]; n’ihi na Nna unu nke bi n’eluigwe maara na ihe ndị a niile dị unu mkpa.
  rationale: 'The revision makes one needed idiomatic and semantic clarification: the Father is identified as the one who is in heaven, rather than using a construction that can imply possession of heaven. It also smooths the contextual wording of footnote a. The wording otherwise retains the draft’s faithful rendering of the Greek syntax, repetition, and lexical force.'
