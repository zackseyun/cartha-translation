  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: ig
  text: N’ihi na ndị mba ọzọ[a] na-achọsi ihe ndị a niile ike[b]; n’ihi na Nna unu nke bi n’eluigwe maara na ihe ndị a niile dị unu mkpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “mba niile” ma ọ bụ “ndị na-ekpere arụsị.” Okwu Grik ahụ nwere ike ịpụta mba dị iche iche n’ozuzu, ma n’ebe a o yikarịrị ka ọ na-ezo aka n’ndị nọ n’èzí ọgbụgba ndụ ahụ.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya “na-achọ” ma ọ bụ “na-achụso.” Okwu ahụ na-egosi ịchọ ihe nke ukwuu ma ọ bụ ịnọgide na-achọ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: ndị mba ọzọ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ụmụ mba ndị na-abụghị ndị Juu, dị iche n’ụmụazụ Jizọs. “Ndị mba ọzọ” bụ okwu Igbo doro anya nke na-echekwa ọdịiche ahụ n’etinyeghị nkọwa nlelị.
- source_word: ἐπιζητοῦσιν
  choice: na-achọsi ... ike
  rationale: Ụdị okwu a na-egosi ịchọ ihe nke ukwuu ma ọ bụ ịnọgide na-achụso ya. “Na-achọsi ... ike” na-ebute ike dị n’okwu Grik ahụ n’Igbo dị ndụ.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Nna unu nke eluigwe
  rationale: Nhọrọ a na-echekwa ma njikọ nke Nna ahụ na ndị a na-agwa okwu ma nkọwa ya dị ka onye eluigwe, n’ụzọ Igbo dị ugwu ma doo anya.
- source_word: οἶδεν
  choice: maara
  rationale: Ọ bụ ezie na ọdịdị okwu Grik ahụ bụ nke perfect, ọ nwere nghọta nke ihe dị ugbu a ebe a; “maara” na-enye nghọta ahụ kpọmkwem.
- source_word: χρῄζετε
  choice: dị unu mkpa
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo na ha chọrọ ihe ndị ahụ n’ihi mkpa.
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: ihe ndị a niile ... ihe ndị a niile
  rationale: E debere nkwughachi dị n’asụsụ Grik iji chekwaa nkwusi ike nke amaokwu ahụ.
- source_word: γὰρ ... γὰρ
  choice: N’ihi na ... n’ihi na
  rationale: E debere njikọ nkọwa ugboro abụọ dị ka ọ dị n’asụsụ Grik, ka usoro echiche nke amaokwu ahụ ghara ifu.
theological_decisions:
- issue: Ihe τὰ ἔθνη na-ezo aka na ya n’ozizi Jizọs
  choice: ndị mba ọzọ
  alternative: mba niile; ndị na-ekpere arụsị
  rationale: N’ebe a, okwu ahụ yiri ka ọ na-egosi ndị nọ n’èzí ndị ọgbụgba ndụ, n’ọdịiche na ụmụazụ Jizọs. “Ndị mba ọzọ” na-echekwa ọdịiche akụkọ ihe mere eme ahụ n’ebughị ụzọ maa ndị niile na-abụghị ndị Juu ikpe n’omume ma ọ bụ n’okwukwe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “Nna unu nke eluigwe” kama okwu mgbagwoju anya, ma e debere nkwughachi na njikọ nkọwa abụọ nke ederede Grik.
