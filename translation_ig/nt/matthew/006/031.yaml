id: MAT.6.31
reference: Matthew 6:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: ig
  text: Ya mere, unu enwekwala nchegbu[a] na-asị, ‘Gịnị ka anyị ga-eri?’ ma ọ bụ, ‘Gịnị ka anyị ga-aṅụ?’ ma ọ bụ, ‘Gịnị ka anyị ga-eyi?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu echegbula onwe unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: Ya mere, unu echegbula onwe unu
  rationale: ‘Ya mere’ na-egosipụta nkwubi okwu nke οὖν sitere n’ihe e kwuru tupu ya. ‘Unu echegbula onwe unu’ bụ Igbo nkịtị ma doo anya maka mmachibido nchegbu banyere mkpa anụ ahụ; ọ naghị agbanwe ya ka ọ bụrụ mmachibido ime atụmatụ kwesịrị ekwesị.
- source_word: λέγοντες
  choice: na-asị
  rationale: Nke a na-egosipụta okwu ndị na-eso nchegbu ahụ, ma na-edebe njikọ participle ahụ n’ụzọ Igbo si ada nke ọma.
- source_word: Τί
  choice: Gịnị
  rationale: ‘Gịnị’ bụ ụzọ nkịtị e si ebido ajụjụ ndị a banyere ihe ndị dị mkpa.
- source_word: φάγωμεν
  choice: ka anyị ga-eri
  rationale: N’ime ajụjụ deliberative a, okwu a na-elekwasị anya n’ihe a ga-eri n’ọdịnihu; ‘ka anyị ga-eri’ na-egosipụta nke ahụ n’Igbo dị mfe.
- source_word: πίωμεν
  choice: ka anyị ga-aṅụ
  rationale: A tụgharịrị ya n’otu usoro ahụ dị ka φάγωμεν, dịka ajụjụ nchegbu banyere ihe ọṅụṅụ a ga-enweta.
- source_word: περιβαλώμεθα
  choice: ka anyị ga-eyi
  rationale: N’ebe a περιβάλλω pụtara iyikwasị uwe. ‘Ga-eyi’ bụ okwu Igbo kacha dị mfe ma kwekọọ n’ọnọdụ ahụ.
- source_word: ἤ ... ἤ ... ἤ
  choice: ma ọ bụ ... ma ọ bụ ... ma ọ bụ
  rationale: E debere nkewa atọ ahụ iji chekwaa usoro ajụjụ atọ dị n’asụsụ Gris.
theological_decisions:
- issue: Ụdị mmachibido Jizọs nyere banyere mkpa anụ ahụ
  choice: A tụgharịrị μεριμνήσητε dị ka mmachibido nchegbu na-enye mmadụ nsogbu, ọ bụghị dị ka mmachibido atụmatụ ezi uche niile.
  alternative: Unu echela banyere ya ma ọlị.
  rationale: Ihe ndị gbara amaokwu ahụ gburugburu na-ekwu maka nchegbu banyere nri, ihe ọṅụṅụ, na uwe. Nsụgharị a anaghị etinye echiche na amaokwu ahụ nke ga-eme ka atụmatụ kwesịrị ekwesị bụrụ ihe a machibidoro.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘unu’ chekwaa plural nke ngwaa Gris, a kwughachikwara usoro ajụjụ atọ ahụ.
