id: MAT.6.25
reference: Matthew 6:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: ig
  text: 'N’ihi nke a, ana m agwa unu: Unu echegbula onwe unu banyere ndụ unu[a]—ihe unu ga-eri—ma ọ bụ banyere ahụ unu—ihe unu ga-eyi. Ndụ ọ̀ bụghị ihe karịrị nri, ahụ ọ̀ bụghịkwa ihe karịrị uwe?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị okwu a “mkpụrụ obi”; ma n’ebe a, okwu banyere iri nri na iyi uwe na-egosi na “ndụ” ka e bu n’uche.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi na okwu a bụ ihe e si n’ozizi bu ya ụzọ kwubie; nkebi a na-edobe njikọ ahụ n’Igbo doro anya.
- source_word: μεριμνᾶτε
  choice: echegbula onwe unu
  rationale: Ngwaa a na-ekwu maka nchegbu nke na-achị mmadụ n’obi; okwu a bụ Igbo nkịtị ma na-enye iwu ahụ n’ụzọ doro anya.
- source_word: ψυχῇ
  choice: ndụ
  rationale: N’ebe a, okwu banyere ihe a ga-eri na-egosi na ψυχή pụtara ndụ mmadụ, ọ bụghị kpọmkwem akụkụ ime mmụọ ya.
- source_word: τί φάγητε
  choice: ihe unu ga-eri
  rationale: Ọ na-egosi ihe a na-echegbu onwe banyere ya n’ọdịnihu; ntụgharị a na-ada nke ọma n’Igbo.
- source_word: σώματι
  choice: ahụ
  rationale: Ọ na-ezo aka n’ahụ mmadụ nke a na-eyikwasị uwe.
- source_word: τί ἐνδύσησθε
  choice: ihe unu ga-eyi
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo iyi uwe.
- source_word: οὐχὶ
  choice: ọ̀ bụghị
  rationale: Ọ na-ebute ajụjụ a na-atụ anya ka a zaa ee, ma na-edobe ọdịdị ajụjụ nke Grik.
- source_word: πλεῖόν
  choice: ihe karịrị
  rationale: Ọ na-egosi na ndụ na ahụ dị mkpa karịa ihe na-akwado ma ọ bụ na-ekpuchi ha, na-enweghị ịgbakwụnye nkọwa na-adịghị na ederede.
- source_word: τροφῆς
  choice: nri
  rationale: Ọ bụ okwu Igbo doro anya maka ihe mmadụ na-eri iji kwado ndụ.
- source_word: ἐνδύματος
  choice: uwe
  rationale: Ọ bụ okwu Igbo nkịtị na nke zuru ezu maka ihe mmadụ na-eyi.
theological_decisions:
- issue: Ihe ψυχή pụtara n’ozizi a Jizọs ziri
  choice: A sụgharịrị ya “ndụ.”
  alternative: “mkpụrụ obi”
  rationale: Ebe okwu gbara ya gburugburu na-ekwu banyere iri nri, ahụ, na iyi uwe, ψυχή na-ezo aka ná ndụ mmadụ. Nhọrọ a na-ezere itinye n’amaokwu a echiche pụrụ iche banyere nkewa nke ahụ na mkpụrụ obi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A hapụrụ ajụjụ abụọ nke ikpeazụ dị ka ajụjụ nkwupụta, dịka ha dị na Grik, ma jiri nhazi yiri ibe ya mee ka njikọ dị n’etiti ndụ na nri, nakwa ahụ na uwe, pụta ìhè.
