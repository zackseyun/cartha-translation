review_pass:
  verdict: approve
  source_fidelity: The Igbo faithfully conveys the iterative temporal clause ('mgbe ọ bụla'), the prohibition against adopting a deliberately gloomy appearance, the hypocrites’ purpose of being recognized by people as fasting, and the emphatic statement that their reward has already been received in full. 'Ndị mmadụ' correctly represents the generic sense of τοῖς ἀνθρώποις.
  naturalness: The rendering is clear, modern Standard Igbo, and maintains an appropriately serious instructional register. 'Na-agbarụ ihu' and 'na-eme ka ihu ha jọọ njọ' communicate the linked imagery of a gloomy and deliberately altered facial appearance naturally enough without unnecessary expansion.
  terminology: '''Ibu ọnụ'' is the standard term for fasting; ''ndị ihu abụọ'' appropriately renders ὑποκριταί in this ethical context; and ''ụgwọ ọrụ ha n’uju'' adequately conveys the commercial idiom ἀπέχουσιν τὸν μισθὸν αὐτῶν, including its completed/full-receipt force.'
