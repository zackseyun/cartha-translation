id: MAT.6.16
reference: Matthew 6:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: ig
  text: Ma mgbe ọ bụla unu na-ebu ọnụ, unu adịla na-agbarụ ihu dị ka ndị ihu abụọ; n’ihi na ha na-eme ka ihu ha jọọ njọ, ka ndị mmadụ wee hụ na ha na-ebu ọnụ. N’ezie, ana m asị unu, ha anatala ụgwọ ọrụ ha n’uju.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Ma mgbe ọ bụla
  rationale: “Mgbe ọ bụla” na-egosipụta omume a na-eme ugboro ugboro; “ma” na-ejikọta ntụziaka a na okwu ndị bu ya ụzọ n’enweghị ime ka ọdịiche ahụ sie ike karịa ka Grik si kwuo.
- source_word: νηστεύητε
  choice: unu na-ebu ọnụ
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ekwu omume ibu ọnụ.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: unu adịla na-agbarụ ihu
  rationale: Nke a na-egosipụta ihu mwute ma ọ bụ ihu juru njọ mmadụ kpachaara anya mee, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ὡς οἱ ὑποκριταί
  choice: dị ka ndị ihu abụọ
  rationale: “Ndị ihu abụọ” bụ okwu Igbo a na-aghọta nke ọma maka ndị na-egosi ezi omume n’elu ma obi ha adịghị otú ahụ.
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: ha na-eme ka ihu ha jọọ njọ
  rationale: Nhọrọ a na-edobe ihe oyiyi nke ihu a gbanwere ma ọ bụ a hapụrụ ka ọ dị njọ iji gosi na a na-ebu ọnụ.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: ka ndị mmadụ wee hụ na ha na-ebu ọnụ
  rationale: 'Ọ na-egosipụta ebumnuche ahụ n’Igbo eke: ime ka ibu ọnụ ha pụta ìhè n’anya ndị mmadụ. “Ndị mmadụ” na-eburu echiche izugbe nke ἀνθρώποις.'
- source_word: ἀμὴν λέγω ὑμῖν
  choice: N’ezie, ana m asị unu
  rationale: Nke a na-edobe ịdị arọ na ikike dị n’usoro okwu Jizọs.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: ha anatala ụgwọ ọrụ ha n’uju
  rationale: “N’uju” na-egosipụta ilu azụmahịa Grik nke pụtara na a kwụọla ha ụgwọ ha niile, ya mere ọ dịghị ụgwọ ọzọ fọdụrụ.
theological_decisions:
- issue: Ihe τοῖς ἀνθρώποις na-ezo aka na ya
  choice: ndị mmadụ
  alternative: ndị nwoke
  rationale: N’ebe a, okwu Grik ahụ na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke; “ndị mmadụ” na-egosipụta nke ahụ nke ọma n’Igbo.
- issue: Ike okwu ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: ha anatala ụgwọ ọrụ ha n’uju
  alternative: ha nwere ụgwọ ọrụ ha
  rationale: Nhọrọ a na-edobe echiche na ha enwetala ụgwọ ahụ niile site n’otuto ndị mmadụ, n’enweghị ịgbakwunye nkọwa ozizi na-adịghị n’amaokwu ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “na-agbarụ ihu” na “ime ka ihu jọọ njọ” chekwaa ihe oyiyi ihu dị n’ederede Grik, ebe “ụgwọ ọrụ ... n’uju” na-ebute ike ilu ahụ n'ụzọ doro anya.
