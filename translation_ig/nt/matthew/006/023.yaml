  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: ig
  text: Ma ọ bụrụ na anya gị dị njọ[a], ahụ gị dum ga-adị n’ọchịchịrị. Ya mere, ọ bụrụ na ìhè dị n’ime gị bụ ọchịchịrị, lee ka ọchịchịrị ahụ si dị ukwuu!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “anya ọjọọ,” “anya na-adịghị ahụ ike,” ma ọ bụ, ikekwe, “anya na-adịghị emesapụ aka,” n’ihi akpaalaokwu gbasara “anya” na ihe ndị gbara amaokwu a gburugburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  choice: dị njọ
  rationale: “Dị njọ” na-edobe obosara ihe okwu Grik ahụ nwere ike ịpụta—ihe ọjọọ, anya na-adịghị ahụ nke ọma, ma ọ bụ anya na-adịghị emesapụ aka—n’ebughị ụzọ kpebie naanị otu n’ime ha.
- source_word: σκοτεινὸν
  choice: ga-adị n’ọchịchịrị
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa mma isi kwuo na ahụ dum ga-abụ nke ọchịchịrị jupụtara, n’agbakwụnyeghị nkọwa ọzọ na-adịghị na isi mmalite.
- source_word: φῶς
  choice: ìhè
  rationale: Ọ na-edobe ihe atụ nke ìhè kpọmkwem, kama ịkọwa ya ozugbo dị ka nghọta ime mmụọ ma ọ bụ omume ọma.
- source_word: σκότος
  choice: ọchịchịrị
  rationale: Ọ na-edobe mmegide dị n’etiti ìhè na ọchịchịrị nakwa nkwughachi siri ike dị na njedebe amaokwu ahụ.
- source_word: πόσον
  choice: lee ka … si dị ukwuu
  rationale: Nke a na-egosipụta ike nke ahịrịokwu mkpu ahụ n’Igbo dị ugbu a ma na-ebute echiche nke ogo ma ọ bụ ịdị ukwuu.
- source_word: ὀφθαλμός
  choice: anya
  rationale: A hapụrụ “anya” dịka akụkụ ahụ nkịtị n’ihi na okwu Jizọs dabere n’ihe atụ ahụ maka ụzọ mmadụ si ahụ ihe na ọnọdụ obi ya.
- source_word: ὅλον τὸ σῶμά σου
  choice: ahụ gị dum
  rationale: Nke a bụ nsụgharị kwụ ọtọ ma na-edobe nkwusi ike nke ὅλον, ya bụ, ahụ ahụ niile.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: ìhè dị n’ime gị
  rationale: Ọ dị nso n’usoro Grik ma zere ịkọwa okwu ahụ karịa ihe e kwuru, dịka ịkpọ ya “ìhè ime mmụọ gị.”
theological_decisions:
- issue: Ihe ihe atụ “anya dị njọ” pụtara
  choice: E debere ihe atụ sara mbara ahụ site n’iji “dị njọ” n’isi amaokwu.
  alternative: A pụrụ ịghọta ya dịka anya ọjọọ, anya na-adịghị mma, ma ọ bụ anya na-adịghị emesapụ aka.
  rationale: 'Ihe gbara amaokwu a gburugburu na-enye ohere maka echiche ndị nwere ike ijikọ ọnụ: mmebi omume, ụzọ ịhụ ihe gbagọrọ agbagọ, na ikekwe akpaalaokwu ndị Hibru/Sem gbasara anya na-adịghị emesapụ aka. Nsụgharị ahụ anaghị ekpebi naanị otu n’ime ha.'
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ ìhè na ọchịchịrị ka ọ dị, ma e tinyere akara nkọwa ala ala [a] ozugbo n’akụkụ okwu ọ na-akọwa.
