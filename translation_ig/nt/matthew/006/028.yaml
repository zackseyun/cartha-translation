id: MAT.6.28
reference: Matthew 6:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: ig
  text: 'Gịnịkwa mere unu ji echegbu onwe unu banyere uwe?[a] Lezienụ okooko lili ndị dị n''ọhịa anya,[b] hụ otú ha si eto: ha adịghị adọgbu onwe ha n''ọrụ, ha adịghịkwa akpa ogho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Gịnịkwa mere unu ji anọ ná nchegbu banyere uwe?”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ na-aghọta “okooko lili ndị dị n'ọhịa” n'ụzọ sara mbara dịka “okooko ọhịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: banyere uwe
  rationale: ἔνδυμα nọ n'ụdị otu, ma n'ọnọdụ a ọ na-ekwu maka uwe dịka ihe mmadụ ji ekpuchi ahụ n'ozuzu ya, ọ bụghị otu uwe kpọmkwem.
- source_word: τί μεριμνᾶτε
  choice: Gịnị mere unu ji echegbu onwe unu
  rationale: μεριμνάω n'okwu a pụtara ịnọ ná nchegbu banyere mkpa anụ ahụ. Nhọrọ a na-edobe ajụjụ τί ma na-ada ka Igbo a na-asụ taa.
- source_word: καταμάθετε
  choice: Lezienụ ... anya
  rationale: Iwu a na-akpọ ndị na-ege ntị ka ha leruo ihe anya nke ọma ma ghọta ihe ọ na-akụzi; 'Lezienụ ... anya' na-egosipụta nlebara anya ahụ n'Igbo dị mfe.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: okooko lili ndị dị n'ọhịa
  rationale: κρίνα na-ezo kpọmkwem n'okooko lili, ebe τοῦ ἀγροῦ na-egosi na ha na-eto n'ọhịa. A hapụrụ nkọwa sara mbara 'okooko ọhịa' n'okpuru peeji.
- source_word: πῶς αὐξάνουσιν
  choice: otú ha si eto
  rationale: αὐξάνω ebe a na-ekwu maka uto ebumpụta ụwa; 'eto' bụ okwu Igbo doro anya ma kwekọọ n'ọnọdụ a.
- source_word: οὐ κοπιῶσιν
  choice: ha adịghị adọgbu onwe ha n'ọrụ
  rationale: κοπιάω na-egosi ịrụ ọrụ siri ike ma ọ bụ ịdọgbu onwe mmadụ n'ọrụ; nsụgharị a na-edobe ike okwu ahụ karịa naanị 'ịrụ ọrụ.'
- source_word: οὐδὲ νήθουσιν
  choice: ha adịghịkwa akpa ogho
  rationale: νήθω pụtara ịkpa eriri ma ọ bụ ogho e ji eme ákwà. Okwu Igbo a na-eme ka njikọ ya na uwe doo anya ma na-edobe ahịrịokwu ahụ nkenke.
theological_decisions:
- issue: Ihe μεριμνάω pụtara n'ozizi Jizọs banyere mkpa ndụ
  choice: ichegbu onwe unu
  alternative: ịnọ ná nchegbu / ịtụ ụjọ banyere ya
  rationale: Ebe a, Jizọs na-ekwu maka nchegbu ime mmụọ na nke uche gbasara ihe a ga-eji bie ndụ, ọ bụghị nanị iche echiche ma ọ bụ ilekọta ihe. Nhọrọ a anaghị eme ka okwu ahụ bụrụ mmachibido atụmatụ ma ọ bụ ọrụ nkịtị.
- issue: Ma κρίνα ọ̀ bụ naanị lili ka ọ bụ aha sara mbara maka okooko ọhịa
  choice: okooko lili
  alternative: okooko ọhịa
  rationale: Ihe okwu Grik ahụ na-egosikarị bụ lili, ya mere isi ederede jiri nke ahụ; ma ebe ụdị okooko a kpọmkwem nwere ike ghara ịdị n'aka, e debere nghọta sara mbara n'okpuru peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. A họọrọ ụdị ọtụtụ mmadụ “unu” dịka ihe ngwaa Grik na-egosi. Ahịrịokwu ahụ na-edobe ajụjụ, iwu ilebara okooko anya, na ntụnyere ọrụ mmadụ na uto okooko dịka ha dị n'isi mmalite.
