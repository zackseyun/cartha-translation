id: MAT.6.9
reference: Matthew 6:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: ig
  text: 'Ya mere, unu kpee ekpere otu a: “Nna anyị nke nọ n’eluigwe[a], ka e doo aha gị nsọ[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grik kwuru ‘n’eluigwe’ n’ụdị ọtụtụ; n’Igbo, ‘eluigwe’ n’onwe ya anaghị egosikarị ma ọ bụ otu ka ọ bụ ọtụtụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘ka e were aha gị dị ka ihe dị nsọ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: otu a
  rationale: Ọ na-egosi ụzọ ma ọ bụ ụkpụrụ e kwesịrị isi kpee ekpere; ‘otu a’ bụ Igbo nkịtị ma doo anya.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ntụziaka a na ihe Jizọs kwuru tupu ya ma na-egosi ihe si na ya pụta.
- source_word: προσεύχεσθε ὑμεῖς
  choice: unu kpee ekpere
  rationale: ‘Unu’ na-echekwa nnọchiaha ọtụtụ nke e kwusiri ike, ebe ‘kpee ekpere’ na-enye iwu ahụ n’Igbo dị mfe ma kwụ ọtọ.
- source_word: Πάτερ ἡμῶν
  choice: Nna anyị
  rationale: Nke a na-echekwa ịkpọku Chineke ozugbo na nnọchiaha nke ọgbakọ, ‘anyị.’
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: nke nọ n’eluigwe
  rationale: Nke a bụ ụzọ Igbo si ekwu ya nke ọma. Aha ‘eluigwe’ anaghị egosikarị ọdịiche otu na ọtụtụ n’ụdị okwu ya, ya mere ihe odide ahụ anaghị amanye nkọwa karịrị nke Grik.
- source_word: ἁγιασθήτω
  choice: ka e doo ... nsọ
  rationale: 'Ọ na-echekwa arịrịọ nke ngwaa iwu n’ụdị nnabata: ka a mata ma kwanyere aha Chineke ùgwù dị ka ihe nsọ.'
- source_word: τὸ ὄνομά σου
  choice: aha gị
  rationale: Nke a bụ ntụgharị kpọmkwem ma na-ahapụ obosara ihe ‘aha’ pụtara n’Akwụkwọ Nsọ n’enweghị ịkọwa ya karịa ederede.
theological_decisions:
- issue: Ụzọ e si gosipụta Chineke dịka Nna nke nọ n’eluigwe
  choice: Nna anyị nke nọ n’eluigwe
  alternative: Nna anyị nke eluigwe
  rationale: Nhọrọ a na-echekwa ma mmekọrịta dị nso nke ‘Nna anyị’ ma ịdị elu ya nke ‘n’eluigwe,’ n’etinyeghị nkọwa ọzọ na-anọghị n’ederede.
- issue: Ụzọ e si tụgharị ἁγιασθήτω
  choice: ka e doo aha gị nsọ
  alternative: ka e were aha gị dị ka ihe dị nsọ
  rationale: ‘Ka e doo ... nsọ’ dị mkpirikpi, dị ùgwù, ma na-echekwa ụdị arịrịọ nnabata nke Grik. Ihe e bu n’obi abụghị na aha Chineke adịghị nsọ ugbu a, kama ka e mata ya ma mesoo ya dịka ihe nsọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. ‘Unu’ na-eme ka ndị a na-agwa okwu pụta ìhè, ebe usoro ‘ka e...’ na-enye arịrịọ ahụ ụda ekpere kwesịrị ekwesị.
