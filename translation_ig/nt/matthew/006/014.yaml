id: MAT.6.14
reference: Matthew 6:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na unu agbaghara ndị mmadụ mmehie ha[a], Nna unu nke eluigwe ga-agbagharakwa unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mmejọ ha,” “njehie ha,” ma ọ bụ “omume ọjọọ ha.” Okwu Grik ahụ na-ezo aka n’ọdịda n’omume ma ọ bụ nzọụkwụ na-ezighị ezi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: γάρ na-ejikọ amaokwu a na ekpere bu ya ụzọ site n’inye ihe kpatara ya; ἐάν na-etinye ọnọdụ, ya mere a sụgharịrị ya ‘ọ bụrụ na.’
- source_word: ἀφῆτε ... ἀφήσει
  choice: unu agbaghara ... ga-agbagharakwa
  rationale: A na-eji otu mgbọrọgwụ Igbo mee ihe n’ebe abụọ ahụ iji chekwaa njikọ okwu ἀφίημι dị n’asụsụ Grik; ‘-kwa’ na-egosipụta καί, ya bụ ‘ọzọkwa.’
- source_word: τοῖς ἀνθρώποις
  choice: ndị mmadụ
  rationale: Ọ na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: mmehie ha
  rationale: N’ebe a παράπτωμα pụtara ọdịda ma ọ bụ mmejọ nke omume megide onye ọzọ. ‘Mmehie’ bụ okwu doro ndị Igbo anya ma kwekọọ n’ụdị omume ọjọọ a na-ekwu maka ya; ihe odide ala peeji na-echekwa obosara okwu Grik ahụ.
- source_word: ὑμῖν
  choice: unu
  rationale: Ụdị ọtụtụ mmadụ nke onye nke abụọ n’asụsụ Grik ka e chekwara n’Igbo.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Nna unu nke eluigwe
  rationale: Nke a na-egosipụta usoro okwu Grik nke ọma n’Igbo dị ugbu a ma na-edobe nsọpụrụ aha ahụ.
theological_decisions:
- issue: Mmekọrịta ọnọdụ dị n’etiti mgbaghara mmadụ na mgbaghara Chineke
  choice: 'E debere ya dịka ọnọdụ n’ezie: ‘ọ bụrụ na ... ga-agbagharakwa.’'
  alternative: Ịkọwa na mgbaghara mmadụ na-akpatara ya mgbaghara Chineke dịka ụgwọ ọrụ, ma ọ bụ na ọ bụ naanị ihe àmà nke mgbaghara Chineke e nyeburu.
  rationale: Ihe odide Grik na-ekwu ọnọdụ ahụ n’ụzọ kwụ ọtọ ma ọ naghị akọwa usoro nkà mmụta okpukpe dị n’azụ ya; ntụgharị ahụ na-echekwa esemokwu ahụ kama idozi ya n’ụzọ otu ozizi.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Nna unu nke eluigwe’ iji zere okwu na-adịghị eke, ma chekwaa echiche nke ὁ οὐράνιος. Akara [a] dị n’akụkụ okwu ọ na-akọwa.
