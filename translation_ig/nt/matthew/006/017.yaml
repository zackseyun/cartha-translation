id: MAT.6.17
reference: Matthew 6:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: ig
  text: Ma gị onwe gị, mgbe ị na-ebu ọnụ, tee mmanụ n’isi gị[a], sachakwa ihu gị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “tee isi gị mmanụ.” Ngwaa Grik a nwere ike ịpụta itinye mmanụ dịka akụkụ nke ilekọta onwe mmadụ kwa ụbọchị.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, nọgide n’ọdịdị gị nkịtị kama ime ka ndị ọzọ mata na ị na-ebu ọnụ.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: Ma gị onwe gị
  rationale: Nnọchiaha ahụ e mesiri ike na δέ na-egosi ọdịiche dị n’etiti onye Jizọs na-agwa okwu na ndị ihu abụọ a kpọtụrụ aha n’amaokwu bu ụzọ.
- source_word: νηστεύων
  choice: mgbe ị na-ebu ọnụ
  rationale: A sụgharịrị participle a dịka nkebiokwu oge, nke bụ ụzọ Igbo nkịtị si akọwa ọnọdụ a.
- source_word: ἄλειψαί
  choice: tee mmanụ n’isi gị
  rationale: N’ọnọdụ a, ngwaa ahụ na-ezo aka n’itinye mmanụ dịka akụkụ nke ilekọta onwe mmadụ; okwu a doro ndị na-agụ Igbo nke oge a anya ma ghara ime ka omume ahụ yie emume okpukpe.
- source_word: τὴν κεφαλήν
  choice: n’isi gị
  rationale: Nke a na-esochi κεφαλή kpọmkwem, ebe ọ ka na-enye ohere ka a ghọta ilekọta isi ma ọ bụ ntutu isi.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” jikọtara iwu nke abụọ na nke mbụ n’ụzọ Igbo na-ada nke ọma.
- source_word: τὸ πρόσωπόν σου
  choice: ihu gị
  rationale: Nke a bụ okwu Igbo nkịtị na nke ziri ezi maka πρόσωπον n’ebe a.
- source_word: νίψαι
  choice: sachaa
  rationale: Ngwaa a na-egosi ịsa akụkụ ahụ; “sachaa” bụ iwu doro anya ma na-ada nke ọma n’Igbo.
theological_decisions:
- issue: Ụdị ntụziaka banyere ọdịdị mmadụ mgbe ọ na-ebu ọnụ
  choice: E depụtara omume ilekọta onwe mmadụ dịka ọ na-adị kwa ụbọchị, n’enweghị ime ka ibu ọnụ pụta ìhè n’ihu ndị ọzọ.
  alternative: Ịte mmanụ dịka emume pụrụ iche, ma ọ bụ igbochi ibu ọnụ n’ihu ọha kpamkpam.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-eme ka ọdịiche dị n’etiti imebi ihu ka ndị mmadụ hụ ibu ọnụ na ịnọgide n’ọdịdị nkịtị. Nsụgharị ahụ anaghị akọwa ịte mmanụ dịka emume, ọ naghịkwa ekwu na a machibidoro ụdị ibu ọnụ niile a pụrụ ịhụ n’ihu ọha.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ma gị onwe gị” na-echekwa nkwusi ike na ọdịiche dị na σὺ δέ; “tee mmanụ” na-ezere okwu ochie ma ọ bụ nke pụrụ ime ka omume nkịtị yie emume okpukpe.
