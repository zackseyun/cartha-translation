  verdict: approve
  source_fidelity: The translation accurately represents the emphatic contrast (σὺ δέ), the temporal participle (“mgbe ị na-ebu ọnụ”), and both imperatives. “Tee mmanụ n’isi gị” faithfully conveys ἄλειψαί σου τὴν κεφαλήν as applying oil to one’s head, without wrongly turning it into a ritual act. “Sachakwa ihu gị” clearly and naturally renders καὶ τὸ πρόσωπόν σου νίψαι.
  naturalness: The wording is fluent, contemporary Standard Igbo and retains an appropriate dignified instructional register. “Ma gị onwe gị” naturally carries the Greek contrastive emphasis, and the coordinated imperative with “-kwa” is idiomatic.
  terminology: “Ibu ọnụ,” “tee mmanụ,” “isi,” “ihu,” and “sachaa/sachakwa” are suitable Standard Igbo terms. The notes accurately explain the ordinary-grooming sense and do not impose a theological interpretation beyond the immediate context.
