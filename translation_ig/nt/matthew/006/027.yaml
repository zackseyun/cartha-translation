  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: ig
  text: Ònye kwa n’ime unu pụrụ, site n’ichegbu onwe ya, ịgbakwunye otu kubit n’ogologo ndụ ya[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ịgbakwunye otu kubit n’ịdị ogologo ya.” Okwu Grik ahụ nwere ike ịpụta ogologo ndụ/afọ ndụ ma ọ bụ ịdị ogologo.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: Ma ònye n’ime unu
  rationale: Ajụjụ a pụtara ‘onye n’etiti unu?’ δέ bụ njikọ dị nro; ‘Ma’ na-ejikọta okwu a na ihe Jizọs kwuru tupu ya n’enweghị ime ka mmegide ahụ sie ike.
- source_word: μεριμνῶν
  choice: site n’ichegbu onwe ya
  rationale: 'Okwu a na-egosi nchegbu ma nwee nghọta nke ụzọ e si eme ihe: ‘site n’ichegbu onwe ya.’'
- source_word: δύναται
  choice: pụrụ
  rationale: Ọ na-egosi ikike ime ihe; ‘pụrụ’ bụ okwu Igbo doro anya ma dịkwa mma n’ajụjụ a.
- source_word: προσθεῖναι
  choice: ịgbakwunye
  rationale: Ọ na-echekwa ihe oyiyi nke itinye ihe ọzọ n’ihe dị adị.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: n’ogologo ndụ ya
  rationale: ἡλικία nwere ike ịpụta afọ/ogologo ndụ ma ọ bụ ogologo ahụ. N’ebe a, ‘ogologo ndụ’ dabara n’okwu gbasara nchegbu na ndụ, ebe e debere ‘ogologo ahụ’ n’okpuru peeji ka a ghara ihichapụ nghọta ọzọ ahụ.
- source_word: πῆχυν ἕνα
  choice: otu kubit
  rationale: πῆχυς bụ kubit, ihe e ji atụ ogologo. Idebe ‘kubit’ na-echekwa ihe oyiyi siri ike nke Grik, ọbụna mgbe a ghọtara ya dị ka ihe atụ gbasara ogologo ndụ.
- source_word: αὐτοῦ
  choice: ya
  rationale: ‘Ya’ na-anọchi onye ahụ a na-ekwu maka ya n’ụzọ ebumpụta ụwa n’Igbo; Igbo anaghị egosi okike nwoke ma ọ bụ nwaanyị n’aha nnọchi a.
theological_decisions:
- issue: Ihe ἡλικία pụtara n’okwu a
  choice: ogologo ndụ
  alternative: ogologo ahụ
  rationale: ‘Ogologo ndụ’ kwekọrọ n’isiokwu banyere nchegbu na nlekọta Chineke maka ndụ, ma ἡλικία nwekwara ike ịpụta ogologo ahụ. E debere nghọta nke abụọ ahụ n’okpuru peeji iji chekwaa mgbagwoju anya dị n’asụsụ Grik.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị mfe nghọta ma nwee ugwu. ‘Ichegbu onwe ya’ na-ada nke ọma n’okwu nkịtị, ebe ‘otu kubit’ na-echekwa ihe atụ na usoro nha nke ederede mbụ.
