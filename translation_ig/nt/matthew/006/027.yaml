  to: Ònye kwa n’ime unu pụrụ, site n’ichegbu onwe ya, ịgbakwunye otu kubit n’ogologo ndụ ya[a]?
  rationale: A gbanwere “Ma” ka ọ bụrụ “kwa” iji mee ka njikọ δέ bụrụ nke eke n’Igbo, ma gbanwee nkọwa ọzọ nke ‘stature’ ka ọ bụrụ “ịdị ogologo ya” iji mee ka ọ doo anya. Ihe ndị ọzọ ka edobere, gụnyere ‘ogologo ndụ’ dịka nghọta a họpụtara na ‘otu kubit’ dịka ihe oyiyi nha dị na Grik.
