review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the contrast, the metaphor of treasure in heaven, the broad sense of βρῶσις, and the image of thieves digging through a wall. However, “kpakọbaara” is not an appropriate plural present imperative here; the Greek θησαυρίζετε directly addresses a plural audience with a continuing command.
  naturalness: The wording is generally clear Standard Igbo. Replacing “kpakọbaara” with the idiomatic plural imperative “kpakọtanụ” makes the command grammatical and natural. “Nla na ire ure” under negation naturally conveys the paired “neither ... nor” sense without the potentially disjunctive “ma ọ bụ.”
  terminology: “Akụ n’eluigwe,” “nla,” “ire ure,” “ndị ohi,” and “zue ohi” are suitable. The cultural note correctly explains “egwupụ mgbidi.”
  issues:
  - severity: medium
    issue: The imperative form “kpakọbaara” is unsuitable in this direct plural command.
    rationale: θησαυρίζετε is a present active imperative, second-person plural. “Kpakọtanụ” provides a clear plural imperative in modern Standard Igbo.
  - severity: low
    issue: “nla ma ọ bụ ire ure” can sound like an alternative (“moth or decay”) rather than the Greek paired negative construction.
    rationale: “Nla na ire ure anaghị emebi” is natural Igbo under negation and better represents “neither moth nor decay destroys.”}],
  - severity: low
    issue: The draft footnote texts are sound, but their wording can be made slightly more concise and precise.
    rationale: The revised notes retain the lexical uncertainty of βρῶσις and the literal/cultural force of διορύσσω without adding interpretive claims.
  revised_text: Kama, kpakọtanụ onwe unu akụ n’eluigwe, ebe nla na ire ure[a] anaghị ebibi, nakwa ebe ndị ohi anaghị egwupụ mgbidi banye[b] ma ọ bụ zuo ohi.
