revisions:
- from: Kama, kpakọbaara onwe unu akụ n’eluigwe, ebe nla ma ọ bụ ire ure[a] na-adịghị ebibi, na ebe ndị ohi na-adịghị egwupụ mgbidi banye[b] ma zuo ohi.
  to: Kama, kpakọtanụ onwe unu akụ n’eluigwe, ebe nla na ire ure[a] anaghị ebibi, nakwa ebe ndị ohi anaghị egwupụ mgbidi banye[b] ma ọ bụ zuo ohi.
  rationale: The revision corrects the command to a plural imperative, improves the paired negative construction, and retains the source’s metaphors, lexical breadth, and ancient-house-wall image. No theological interpretation has been added.
