id: MAT.6.20
reference: Matthew 6:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: ig
  text: Kama, kpakọtanụ onwe unu akụ n’eluigwe, ebe nla na ire ure[a] anaghị ebibi, nakwa ebe ndị ohi anaghị egwupụ mgbidi banye[b] ma ọ bụ zuo ohi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “nchara.” Okwu Grik ahụ nwere ike ịpụta n’ụzọ sara mbara ihe na-eri ma ọ bụ na-emebi ihe, gụnyere ire ure ma ọ bụ nchara.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “egwupụ.” O yikarịrị ka ọ na-ekwu maka ndị ohi na-egwupụ ma ọ bụ na-adọwa mgbidi ụlọ iji banye.
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: kpakọbaara
  rationale: Okwu iwu a na-egosi omume a ga na-eme; “kpakọbaara” na-enye echiche nke ịchịkọta ma debe akụ, ma gosikwa na ọ bụ maka uru nke ndị a na-agwa okwu.
- source_word: δὲ
  choice: Kama
  rationale: 'Ọ na-egosi ọdịiche doro anya n’ihe e kwuru n’amaokwu gara aga: unu akpakọbaala akụ n’ụwa, kama unu kpakọbaara onwe unu akụ n’eluigwe.'
- source_word: ὑμῖν
  choice: onwe unu
  rationale: Nke a na-echekwa echiche dative nke uru—ịkpakọba akụ maka onwe ha.
- source_word: θησαυρούς
  choice: akụ
  rationale: “Akụ” bụ okwu Igbo e ji ekwu ihe bara nnukwu uru ma ọ bụ akụ a chịkọbara; ọ na-arụkwa ọrụ dịka aha mkpokọta n’Igbo n’agbanyeghị na Grik ji ọtụtụ.
- source_word: ἐν οὐρανῷ
  choice: n’eluigwe
  rationale: Nke a bụ ntụgharị nkịtị na nke doro anya nke ọnọdụ a kpọrọ aha.
- source_word: σής
  choice: nla
  rationale: Ọ na-ezo aka na ahụhụ na-eri ma na-emebi uwe na ihe ndị ọzọ e debere.
- source_word: βρῶσις
  choice: ire ure
  rationale: Okwu Grik a nwere ike ịpụta mbibi sitere n’ihe na-eri ihe, ire ure, ma ọ bụ nchara; “ire ure” na-echekwa echiche mbibi sara mbara karịa naanị nchara.
- source_word: ἀφανίζει
  choice: na-adịghị ebibi
  rationale: Ọ na-egosi ime ka ihe laa n’iyi ma ọ bụ mebie kpamkpam; “ebibi” dabara ma nla ma ire ure.
- source_word: κλέπται
  choice: ndị ohi
  rationale: Nke a bụ okwu Igbo ziri ezi ma doo anya maka aha ọtụtụ ahụ.
- source_word: διορύσσουσιν
  choice: na-adịghị egwupụ mgbidi banye
  rationale: Ọ na-echekwa onyinyo Grik nke ndị ohi na-egwupụ ma ọ bụ na-adọwa mgbidi ụlọ tupu ha abanye.
- source_word: κλέπτουσιν
  choice: zuo ohi
  rationale: Nke a bụ ụzọ Igbo si ekwu omume izu ihe n’ụzọ doro anya.
theological_decisions:
- issue: Ihe “akụ n’eluigwe” pụtara
  choice: E debere ihe atụ ahụ dịka “akụ n’eluigwe” n’enweghị nkọwa agbakwunyere.
  alternative: Ụgwọ ọrụ n’eluigwe; akụ ime mmụọ.
  rationale: Ihe odide ahụ akọwaghị kpọmkwem ụdị akụ ahụ. Idebe ihe atụ ahụ na-echekwa nghọta dị iche iche o nwere ike ibu ma zere itinye ozizi ụgwọ ọrụ nke amaokwu ahụ na-ekwughị kpọmkwem.
- issue: Oke ihe βρῶσις pụtara
  choice: ire ure
  alternative: nchara; mbibi nke ihe na-eri ihe
  rationale: “Ire ure” na-enye echiche mbibi na-aga n’ihu ma ghara ime ka okwu ahụ bụrụ naanị nchara nke igwe, ebe Grik nwere nghọta sara mbara.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji “Kama” mee ka ọdịiche ya na amaokwu gara aga pụta ìhè. E debere ihe atụ “akụ n’eluigwe” n’enweghị nkọwa okpukpe agbakwunyere, ma debeekwa onyinyo nke ndị ohi na-egwupụ mgbidi.
