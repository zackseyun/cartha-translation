source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: ig
  text: ka onyinye ị na-enye ndị ogbenye dịrị na nzuzo; Nna gị, onye na-ahụ ihe e zoro ezo, ga-enye gị ụgwọ ọrụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ga-akwụghachi gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως ᾖ
  choice: ka ... wee bụrụ
  rationale: Usoro a na-egosipụta nzube nke ntụziaka dị n'amaokwu bu ụzọ, ma bụrụkwa Igbo nkịtị na nke doro anya.
- source_word: ἡ ἐλεημοσύνη σου
  choice: inye ndị ogbenye gị
  rationale: ἐλεημοσύνη n'ebe a bụ onyinye a na-enye ndị ogbenye kpọmkwem, ọ bụghị naanị ebere ma ọ bụ ọrụ ọma n'ozuzu.
- source_word: ἐν τῷ κρυπτῷ
  choice: na nzuzo
  rationale: Nke a na-egosi ihe e zoro n'anya ọha; otu nsụgharị ahụ ka e ji mee ihe n'ahịrịokwu abụọ iji chekwaa nkwughachi okwu Grik.
- source_word: ὁ πατήρ σου
  choice: Nna gị
  rationale: Ihe odide Grik kwuru naanị ‘Nna gị’; etinyeghị ‘nke eluigwe’ site n'amaokwu ndị ọzọ.
- source_word: ὁ βλέπων
  choice: onye na-ahụ ihe
  rationale: A sụgharịrị participle ahụ dịka nkebiokwu njikọ dị mfe ma kwekọọ n'Igbo ugbu a.
- source_word: ἀποδώσει σοι
  choice: ga-akwụghachi gị
  rationale: ἀποδίδω pụtara inyeghachi ma ọ bụ ịkwụghachi. ‘Ga-akwụghachi gị’ na-echekwa echiche nke nzaghachi Chineke n'ebughị ụzọ kọwaa ụdị ụgwọ ahụ.
theological_decisions:
- issue: Ụdị nkwụghachi Chineke n'okwu ἀποδώσει
  choice: ga-akwụghachi gị
  alternative: ga-enye gị ụgwọ ọrụ
  rationale: ‘Ga-akwụghachi gị’ na-echekwa obosara nke okwu Grik ma ghara ikpebi ma nkwụghachi ahụ ọ bụ nke ndụ a, nke ebighị ebi, nke ihe onwunwe, ma ọ bụ nke mmụọ.
translation_notes:
  register: Igbo a bụ Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E chekwara nkwughachi ‘na nzuzo’ n'akụkụ abụọ ahụ. Akara ntụaka [a] dị n'isiokwu ma na-enye ụzọ ọzọ isi ghọta ἀποδώσει.
