  rationale: The revision resolves the possessive ambiguity around almsgiving, renders the Father's seeing of hidden acts naturally, and uses a positive yet non-specific expression for divine recompense. The footnote preserves the more reciprocal lexical alternative without imposing a view of the reward's form or timing.
