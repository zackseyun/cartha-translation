  to: Ma kpacharanụ anya ka unu ghara ime ezi omume unu n'ihu ndị mmadụ ka ha wee hụ unu[a]; ma ọ bụghị ya, unu enweghị ụgwọ ọrụ n'aka Nna unu nke nọ n'eluigwe.[b]
  rationale: 'A gbanwere naanị ihe abụọ dị mkpa maka ikwesị ntụkwasị obi: e dochiri ọdịnihu “agaghị enweta” anya na ugbu a “enweghị,” dabere na ἔχετε; e meziekwara nkọwa ala peeji banyere plural τοῖς οὐρανοῖς ka ọ ghara ịgbakwunye “niile.” E debere okwu ndị ọzọ n’ihi na ha na-enye nghọta ziri ezi ma bụrụ Igbo nkịtị.'
