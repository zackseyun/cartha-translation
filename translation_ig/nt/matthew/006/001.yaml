id: MAT.6.1
reference: Matthew 6:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: ig
  text: Ma kpacharanụ anya ka unu ghara ime ezi omume unu n'ihu ndị mmadụ ka ha wee hụ unu[a]; ma ọ bụghị ya, unu enweghị ụgwọ ọrụ n'aka Nna unu nke nọ n'eluigwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọrụ ezi omume unu.” Ụfọdụ ihe odide ochie nwere, “onyinye unu na-enye ndị ogbenye.”
    reason: textual_variant
  - marker: b
    text: 'N''ụzọ nkịtị, okwu Grik ahụ dị n''ụdị ọtụtụ: “n''eluigwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  choice: kpacharanụ anya
  rationale: Ọ bụ iwu dị n'ụdị na-egosi ịga n'ihu n'ịmụ anya; okwu a bụ Igbo nkịtị ma na-edobe ike ịdọ aka ná ntị.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị ma ọ bụ ọdịiche n'ihe e kwuru tupu ya.
- source_word: δικαιοσύνην
  choice: ezi omume
  rationale: N'ebe a, okwu ahụ na-ezo aka n'omume ziri ezi mmadụ na-eme, ọ bụghị nanị inye ndị ogbenye ihe. 'Ezi omume' bụ okwu doro ndị na-agụ Igbo anya ma na-edobe obosara nke echiche ahụ.
- source_word: μὴ ποιεῖν
  choice: ka unu ghara ime
  rationale: Ọ na-egosi ihe a na-adọ ndị na-ege ntị aka ná ntị ka ha zere ime.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: n'ihu ndị mmadụ
  rationale: Ọ na-ezo aka n'ihu mmadụ niile n'ozuzu, ọ bụghị naanị ụmụ nwoke.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: ka ha wee hụ unu
  rationale: 'Nke a na-edobe nzube e gosiri n''okwu Grik: ime omume ahụ kpọmkwem ka ndị ọzọ hụ onye na-eme ya.'
- source_word: εἰ δὲ μή γε
  choice: ma ọ bụghị ya
  rationale: Nke a bụ ụzọ Igbo sitere n'okike isi kwuo ihe ga-esi na emeghị ịdọ aka ná ntị ahụ pụta.
- source_word: μισθὸν
  choice: ụgwọ ọrụ
  rationale: N'ebe a ọ pụtara ihe nkwụghachi sitere n'aka Chineke, ọ bụghị naanị ụgwọ onye ọrụ.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: n'aka Nna unu
  rationale: Ọ na-egosi Nna ahụ dị ka onye ihe nkwụghachi ahụ si n'aka ya abịa.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: nke nọ n'eluigwe
  rationale: Igbo na-ejikarị 'eluigwe' dị ka aha mkpokọta na-ada nke ọma, ebe ihe odide Grik ji ụdị ọtụtụ.
theological_decisions:
- issue: Ókè echiche δικαιοσύνην n'amaokwu a
  choice: ezi omume n'echiche sara mbara
  alternative: ọrụ ezi omume; inye ndị ogbenye onyinye
  rationale: Ihe odide SBLGNT nwere δικαιοσύνην, nke sara mbara karịa inye onyinye. Ya mere, isi ederede anaghị amachibido ya n'inye ndị ogbenye ihe; e debere ọdịiche ahụ n'okpuru amaokwu.
- issue: Ndị ἀνθρώπων na-ezo aka na ha
  choice: ndị mmadụ
  alternative: ụmụ nwoke
  rationale: N'ebe a, okwu ahụ na-ezo aka n'ụmụ mmadụ n'ozuzu ha, ọ bụghị naanị ndị nwoke.
- issue: Ụdị ọtụtụ τοῖς οὐρανοῖς
  choice: eluigwe n'isi ederede, tinyere nkọwa na ihe odide Grik ji ụdị ọtụtụ
  alternative: eluigwe niile / n'eluigwe dị iche iche
  rationale: Ịsụgharị ya 'n'eluigwe' bụ Igbo dị ugbu a na nke sitere n'okike; nkọwa ala peeji na-echekwa ọdịdị ọtụtụ nke Grik n'enweghị ịmanye nkọwa gbasara ọtụtụ eluigwe.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, kwanyere ùgwù ma dị mfe nghọta. E ji ụdị ọtụtụ 'unu' kwekọọ n'okwu Grik. A họọrọ 'ezi omume' kama okwu nkà mmụta okpukpe siri ike iji mee ka omume ziri ezi a na-ekwu maka ya doo anya, ma e chekwara ọdịiche ederede na nkọwa ala peeji.
