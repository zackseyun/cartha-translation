id: MAT.6.3
reference: Matthew 6:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σοῦ δὲ ποιοῦντος ἐλεημοσύνην μὴ γνώτω ἡ ἀριστερά σου τί ποιεῖ ἡ δεξιά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/003.yaml
  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: ig
  text: Ma mgbe ị na-enye ndị nọ ná mkpa[a] ihe, ekwela ka aka ekpe gị mara ihe aka nri gị na-eme,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ị na-eme ebere site n’inye onyinye”; okwu Grik ahụ na-ezo aka n’inye ndị ogbenye onyinye ebere.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: Ma mgbe ị na-enye
  rationale: Nkebi okwu genitive absolute a na δέ na-egosi ọdịiche n’ihe e kwuru tupu ya; “Ma mgbe ị na-enye” bụ Igbo dị mfe ma kwekọọ n’ọnọdụ a, ebe ποιέω na ἐλεημοσύνην jikọrọ aka na-ezo aka n’inye onyinye ebere.
- source_word: ἐλεημοσύνην
  choice: ndị nọ ná mkpa ihe
  rationale: Okwu Grik a na-apụtakarị inye ndị ogbenye ma ọ bụ ndị nọ ná mkpa onyinye ebere. Nhọrọ a bụ asụsụ Igbo nke oge a, ma nkọwa ala peeji na-echekwa ụzọ ọzọ e nwere isi sụgharịa ya.
- source_word: μὴ γνώτω
  choice: ekwela ka ... mara
  rationale: Nke a na-egosipụta iwu mgbochi nke onye nke atọ n’ụzọ Igbo sitere n’okike, ma na-edobe ime ka aka dị ka mmadụ n’okwu Grik ahụ.
- source_word: ἡ ἀριστερά σου
  choice: aka ekpe gị
  rationale: Nsụgharị kwụ ọtọ a na-edobe ihe atụ doro anya nke okwu ahụ.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: ihe aka nri gị na-eme
  rationale: Nhọrọ a na-egosipụta ποιεῖ dị ka omume na-aga n’ihu, ma na-ada nke ọma n’Igbo.
theological_decisions:
- issue: Ihe okwu banyere aka ekpe na aka nri pụtara
  choice: E debere ihe atụ ahụ dịka ọ dị, ka ọ mesie izochi onyinye na izere igosi onwe mmadụ ike.
  alternative: Ịkọwa ya ozugbo dị ka naanị ịdị umeala n’obi, ma ọ bụ dị ka mmachibido inye onyinye n’ihu ọha n’ọnọdụ niile.
  rationale: Okwu ahụ ji ime ka aka dị ka mmadụ na ikwubiga okwu ókè mee ihe. Idebe ihe oyiyi ahụ na-echekwa ike okwu Jizọs ma ghara itinye nkọwa ozizi siri ike karịa ihe ederede kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere ihe atụ aka ekpe na aka nri, tinyere ọdịiche nke “Ma,” n’enweghị ịkọwa ihe atụ ahụ karịa ka isi mmalite kwuru.
