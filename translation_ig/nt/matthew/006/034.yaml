id: MAT.6.34
reference: Matthew 6:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: ig
  text: Ya mere, unu echegbula onwe unu banyere echi, n’ihi na echi ga-echegbu onwe ya. Nsogbu[a] nke ụbọchị ọ bụla ga-ezuru ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ihe ọjọọ nke ụbọchị ọ bụla ga-ezuru ya.” Okwu Grik a nwere ike ịpụta “ihe ọjọọ,” ma n’ebe a o yikarịrị ka ọ na-ezo aka ná nsogbu ma ọ bụ ihe isi ike nke ụbọchị ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε (μεριμνάω)
  choice: unu echegbula onwe unu
  rationale: N’ọnọdụ a, ngwaa ahụ na-ekwu maka nchegbu na-enye mmadụ nsogbu, ọ bụghị ilekọta ihe n’ụzọ kwesịrị ekwesị. Nke a bụ okwu Igbo doro anya nke na-adaba n’isiokwu Matiu 6:25–34.
- source_word: εἰς τὴν αὔριον
  choice: banyere echi
  rationale: Ọ bụ nchegbu a na-atụkwasị n’ihe ga-eme n’echi; ‘banyere echi’ na-egosipụta nke a n’Igbo e ji eme ihe ugbu a.
- source_word: ἡ αὔριον
  choice: echi
  rationale: E mere echi ka ọ dị ka onye nwere ike ime ihe. ‘Echi’ na-echekwa ụdị okwu ahụ n’enweghị nkọwa agbakwunyere.
- source_word: μεριμνήσει αὑτῆς
  choice: ga-echegbu onwe ya
  rationale: Nke a na-emegharị otu ngwaa ahụ dị na mmalite amaokwu ahụ ma na-echekwa ihe atụ nke na-eme ‘echi’ ka ọ bụrụ onye na-echegbu onwe ya.
- source_word: ἀρκετὸν
  choice: ga-ezuru ya
  rationale: Okwu ahụ pụtara ‘zuru ezu.’ Usoro a na-eme ka ahịrịokwu ahụ bụrụ Igbo ebumpụta ụwa ma na-egosi na ụbọchị ọ bụla nwere ibu nke zuru ya.
- source_word: τῇ ἡμέρᾳ
  choice: Ụbọchị ọ bụla
  rationale: Ọ bụ ezie na okwu Grik ahụ bụ dative singular, ilu a na-ekesa echiche ahụ n’ụbọchị n’ụbọchị; ‘ụbọchị ọ bụla’ na-eme ka nke a doo anya.
- source_word: κακία
  choice: nsogbu
  rationale: κακία nwere ike ịpụta ‘ihe ọjọọ,’ ma n’ebe a ọ na-ezo aka ná nsogbu, nhụjuanya, ma ọ bụ ihe isi ike nke ụbọchị na-eweta. ‘Nsogbu’ dabara n’okwu gbara ya gburugburu banyere nchegbu.
- source_word: αὐτῆς
  choice: nke ya
  rationale: Okwu nnọchiaha a laghachiri n’‘ụbọchị’ ma na-egosi na nsogbu ahụ bụ nke ụbọchị ahụ kpọmkwem.
theological_decisions:
- issue: Ihe κακία pụtara n’ilu a banyere nchegbu
  choice: nsogbu
  alternative: ihe ọjọọ
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ nchegbu banyere ihe isi ike nke ndụ kwa ụbọchị. ‘Nsogbu’ na-echekwa isi okwu ahụ n’Igbo ebumpụta ụwa, ebe nkọwa ala ala ‘ihe ọjọọ’ ka e debere n’okpuru peeji iji ghara izochi obosara okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ụdị ọtụtụ mmadụ ‘unu’ dịka okwu Jizọs nye ndị na-ege ya ntị. E debere ime ‘echi’ ka ọ bụrụ onye na-eme ihe, tinyekwa akara nkọwa n’akụkụ ‘nsogbu,’ bụ okwu nkọwa ahụ metụtara kpọmkwem.
