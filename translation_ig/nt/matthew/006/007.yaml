id: MAT.6.7
reference: Matthew 6:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: ig
  text: Mgbe unu na-ekpe ekpere, unu ekwukwala ọtụtụ okwu efu[a] dị ka ndị mba ọzọ[b], n’ihi na ha na-eche na a ga-anụ ekpere ha n’ihi ọtụtụ okwu ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “unu ekwukwala okwu aghara aghara,” ma ọ bụ, “unu ekwughachila okwu na-enweghị isi.” Ngwaa Grik a anaghị adịkarị; o yiri ka ọ na-ezo aka n’okwu efu, okwu a na-ekwu dịka emume nkịtị, ma ọ bụ ọtụtụ okwu na-enweghị isi, ọ bụghị ikwughachi ekpere sitere n’obi.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị na-ekpere arụsị.” N’ụzọ nkịtị, okwu Grik ahụ na-ezo aka ná ndị mba dị iche na ndị so ná ndị ọgbụgba ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι
  choice: Mgbe unu na-ekpe ekpere
  rationale: Nkebi ngwaa a na-egosi ọnọdụ ma ọ bụ oge iwu ahụ metụtara. Nsụgharị a bụ Igbo doro anya ma kwekọọ n’ụzọ Jizọs si enye ntụziaka.
- source_word: δὲ
  choice: (ejikọghị ya na okwu pụrụ iche)
  rationale: N’ebe a, δέ na-aga n’ihu n’otu usoro nkuzi ahụ, ọ naghị egosi nnukwu mmegide. Igbo anaghị achọkarị okwu njikọ pụrụ iche n’ọnọdụ dị otú a.
- source_word: μὴ βατταλογήσητε
  choice: unu ekwukwala ọtụtụ okwu efu
  rationale: βατταλογέω bụ ngwaa Grik a na-adịghị ahụkarị; o yiri ka ọ na-ezo aka n’okwu efu, ogologo okwu na-enweghị isi, ma ọ bụ okwu a na-ekwu dịka emume nkịtị. Nhọrọ a anaghị eme ka ọ dị ka a machibidoro ikwughachi ekpere sitere n’obi niile.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: dị ka ndị mba ọzọ
  rationale: N’ọnọdụ ndị Juu nke amaokwu a, οἱ ἐθνικοί na-ezo aka ná ndị mba dị iche na ndị ọgbụgba ndụ. ‘Ndị mba ọzọ’ na-edebe echiche a, ebe ‘ndị na-ekpere arụsị’ ga-akọwa ya karịa ka okwu Grik ahụ n’onwe ya siri kwuo.
- source_word: δοκοῦσιν
  choice: ha na-eche
  rationale: Okwu a na-egosi echiche ma ọ bụ nkwenye ha nwere banyere ihe ga-eme ka a nụ ekpere ha.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: n’ihi ọtụtụ okwu ha
  rationale: πολυλογία pụtara ikwu ọtụtụ okwu ma ọ bụ ịdị ogologo n’okwu. ‘N’ihi’ na-egosi na ha weere ọtụtụ okwu ha dịka ihe ga-eme ka a nụ ha.
- source_word: εἰσακουσθήσονται
  choice: a ga-anụ ekpere ha
  rationale: Ngwaa a pụtara na a ga-anụ ha nke ọma ma ọ bụ gee arịrịọ ha ntị. Ịkpọ ‘ekpere ha’ aha na-eme ka Igbo doo anya n’ọnọdụ a, ma ọ naghị agbakwụnye echiche siri ike na a ga-enye ha ihe niile ha rịọrọ.
theological_decisions:
- issue: Ma Jizọs ọ na-amachibido ikwughachi okwu niile n’ekpere, ka ọ na-amachibido okwu efu na ọtụtụ okwu e ji achọ ime ka Chineke gee ntị
  choice: unu ekwukwala ọtụtụ okwu efu
  alternative: unu ekwughachila okwu na-enweghị isi; unu ekwukwala okwu aghara aghara
  rationale: Nhọrọ a na-edebe obosara ihe ngwaa Grik ahụ a na-adịghị ahụkarị nwere ike ịpụta. Ọ na-egosi na ihe a na-akatọ bụ okwu efu na ogologo okwu a na-ewere dịka ụzọ isi mee ka Chineke gee ntị, ọ bụghị ikwughachi ekpere sitere n’obi n’onwe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, doro anya ma dị ùgwù mee nsụgharị ahụ. A họọrọ ‘unu’ maka ọtụtụ ndị a na-agwa okwu. Ahịrịokwu ahụ na-aga nke ọma n’Igbo nkịtị ma na-edebe ma amaghị kpọmkwem ihe ngwaa βατταλογέω pụtara na ọdịiche dị n’etiti okwu efu na ekpere e ji ezi obi kwughachi.
