id: MAT.6.13
reference: Matthew 6:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: ig
  text: Edukala anyị n’ọnwụnwa[a], kama napụta anyị n’aka ajọ onye ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ule” ma ọ bụ “ọnọdụ siri ike na-anwale mmadụ.” Okwu Grik ahụ nwere ike ịpụta ọnwụnwa ime mmehie ma ọ bụ ahụmahụ nke na-anwale mmadụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “napụta anyị n’ihe ọjọọ.” Okwu Grik ahụ nwere ike izo aka n’ajọ onye ahụ ma ọ bụ n’ihe ọjọọ.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: Edukala
  rationale: Ngwaa a na arịrịọ ahụ pụtara ‘edubala’ ma ọ bụ ‘webatala.’ ‘Edukala anyị’ na-edobe arịrịọ ahụ ka ọ bụrụ nke doro anya, n’etinyeghị nkọwa ọzọ dị ka ‘ekwela ka a duba anyị.’
- source_word: πειρασμόν
  choice: ọnwụnwa
  rationale: ‘Ọnwụnwa’ bụ okwu Igbo a na-aghọta nke ọma maka ọnwụnwa ime mmehie, ma okwu Grik ahụ nwekwara ike ịpụta ule ma ọ bụ ọnọdụ siri ike nke na-anwale mmadụ; e debere nke ahụ n’ala ala peeji.
- source_word: ῥῦσαι
  choice: napụta
  rationale: ‘Napụta’ na-egosi arịrịọ ka Chineke zọpụta ma wepụ ndị na-arịọ n’ihe ize ndụ; ọ dabara n’asụsụ ekpere dị ugwu ma bụrụkwa nke ndị mmadụ na-aghọta.
- source_word: τοῦ πονηροῦ
  choice: ajọ onye ahụ
  rationale: Ụdị okwu Grik a nwere ike izo aka n’otu onye ọjọọ ma ọ bụ n’ihe ọjọọ n’ozuzu. Isi akụkụ ahụ na-eji nghọta nke onye, ebe e debere nghọta nke ihe ọjọọ n’ala ala peeji.
theological_decisions:
- issue: Ihe τοῦ πονηροῦ pụtara
  choice: ajọ onye ahụ
  alternative: ihe ọjọọ
  rationale: N’ụtọasụsụ Grik, okwu ahụ nwere ike ịbụ nke nwoke, ‘ajọ onye ahụ,’ ma ọ bụ nke na-anọchi ihe, ‘ihe ọjọọ.’ Ọnọdụ okwu banyere ọnwụnwa nwere ike ịkwado onye iro nke na-eme ihe ọjọọ, ma n’ihi na nghọta abụọ ahụ bụ ezi ohere, e debere nke ọzọ n’ala ala peeji.
translation_notes:
  register: Asụsụ Igbo izugbe, nke dị ugbu a ma dịkwa ugwu. Ahịrịokwu ahụ na-edobe ụdị arịrịọ kpọmkwem nke Grik, ma na-eji nkọwa ala ala peeji chekwaa nghọta abụọ dị n’okwu πειρασμός na τοῦ πονηροῦ.
