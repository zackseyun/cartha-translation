  source_fidelity: 'The text closely represents both petitions: “Edukala anyị n’ọnwụnwa” directly retains the request not to lead/bring us into πειρασμόν, and “napụta anyị n’aka ajọ onye ahụ” naturally expresses the request for rescue from τοῦ πονηροῦ. The personal main-text reading is legitimate, while the footnote preserves the impersonal reading.'
