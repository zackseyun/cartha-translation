  terminology: “Ọnwụnwa” is the established term for temptation and the note appropriately retains the testing/trial sense. “Ajọ onye ahụ” appropriately conveys the personal reading, and the alternative “ihe ọjọọ” preserves the Greek grammatical and interpretive ambiguity without imposing it on the main text.
