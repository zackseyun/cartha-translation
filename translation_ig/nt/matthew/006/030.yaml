id: MAT.6.30
reference: Matthew 6:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: ig
  text: Ma ọ bụrụ na Chineke si otu a eyikwasị ahịhịa nke ubi uwe—nke dị taa, ma echi a tụba ya n’ime ekwú achịcha[a]—ọ̀ gaghị eyikwasị unu uwe karị, unu ndị nwere okwukwe nta?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ekwú achịcha” bụ oven e ji eme achịcha; a pụrụ iji ahịhịa na ihe ọkụkụ ọhịa akpọnwụwo mee nkụ ya.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “unu ndị okwukwe unu dị nta.” Okwu Grik ὀλιγόπιστοι bụ ịkpọ ndị a na-agwa okwu kpọmkwem ma baara ha mba n’ihi na ntụkwasị obi ha ezughị oke.
    reason: lexical_alternative
lexical_decisions:
- source_word: χόρτον τοῦ ἀγροῦ
  choice: ahịhịa dị n’ọhịa
  rationale: “Ahịhịa dị n’ọhịa” na-egosi ahịhịa ma ọ bụ ihe ọkụkụ nta na-eto n’ọhịa, n’agbakwụnyeghị echiche nke okooko osisi nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: σήμερον ὄντα
  choice: nke dị taa
  rationale: Nke a na-asụgharị echiche ịdị adị ugbu a n’ụzọ Igbo dị mfe, n’etinyeghị “dị ndụ,” nke ga-agbakwụnye nkọwa na-adịghị na participle ὄντα.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: ma echi a tụba ya n’ime ekwú achịcha
  rationale: “Ekwú achịcha” na-egosi oven e ji eme achịcha karịa furnace e ji agbaze ọla; “a tụba ya” na-echekwa ụdị nnara-eme nke βαλλόμενον.
- source_word: οὕτως ἀμφιέννυσιν
  choice: si otu a eyikwasị ... uwe
  rationale: Nkebi a na-echekwa ihe atụ nke Chineke iyi ahịhịa uwe, ma na-ada n’ụzọ doro anya na Igbo ugbu a.
- source_word: οὐ πολλῷ μᾶλλον
  choice: ọ̀ gaghị ... karịa nke ahụ
  rationale: Ajụjụ a na-echekwa arụmụka site n’ihe nta gaa n’ihe ka ukwuu n’ụzọ Igbo na-asụkarị, na-egosikwa na Chineke ga-elekọta ndị na-eso ụzọ ya karịa ahịhịa.
- source_word: ὑμᾶς
  choice: unu
  rationale: “Unu” na-egosi na okwu a bụ nye ọtụtụ mmadụ ma bụrụkwa ihe nnara nke ngwaa “eyikwasị.”
- source_word: ὀλιγόπιστοι
  choice: unu ndị okwukwe nta
  rationale: Nke a na-echekwa kpọmkwem ịkpọ ndị a na-agwa okwu na mba ha maka ntụkwasị obi na-ezughị oke, n’ejighị asụsụ ochie.
- source_word: εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: “Ma” na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche na ihe atụ gara aga, ebe “ọ bụrụ na” na-echekwa usoro ọnọdụ nke Grik.
theological_decisions:
- issue: Arụmụka banyere nlekọta Chineke site n’ihe nta ruo n’ihe ka ukwuu
  choice: 'E debere ya dị ka ajụjụ na-atụgharị uche: Chineke, onye na-eyikwasị ahịhịa uwe, ga-eyikwasị ndị na-eso ụzọ ya uwe karịa nke ahụ.'
  alternative: Ịsụgharị ya dị ka nkwupụta nkịtị kama ajụjụ.
  rationale: Usoro okwu Grik na vocative ikpeazụ na-akwado ajụjụ na-atụgharị uche nke na-eme ka ịdọ aka ná ntị Jizọs banyere nchegbu sie ike, n’agbakwụnyeghị ozizi ọzọ.
translation_notes:
  register: 'Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ nke iyi ahịhịa uwe na ajụjụ na-atụgharị uche. A haziri akara nkọwa ụkwụ n’ebe ihe ha na-akọwa dị: [a] n’akụkụ ekwú achịcha, [b] n’akụkụ “unu ndị okwukwe nta.”'
