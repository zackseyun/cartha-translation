    issue: Footnote a uses “A pụkwara ịsụ ya,” which is less idiomatic for identifying an alternative translation.
    rationale: “A pụkwara ịtụgharị ya” directly and naturally refers to an alternative rendering.
  - severity: medium
    issue: Footnote c’s phrase “ịnata ụgwọ niile e ji mmadụ” is awkward and can suggest merely receiving wages owed, rather than the idiomatic sense of being paid/receiving payment in full.
    rationale: The note should explain the commercial idiom accurately while retaining its qualified force (“nwere ike ịpụta”).
