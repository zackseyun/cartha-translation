id: MAT.6.5
reference: Matthew 6:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: ig
  text: Mgbe ọ bụla unu na-ekpe ekpere, unu adịkwala ka ndị ihu abụọ, n’ihi na ha na-enwe mmasị iguzo na-ekpe ekpere n’ụlọ nzukọ ndị Juu nakwa na nkuku okporo ámá ndị sara mbara[a], ka ndị mmadụ wee hụ ha[b]. N’ezie, ana m asị unu, ha anatala ụgwọ ọrụ ha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịtụgharị ya: “na nkuku ụzọ.” N’okwu nkịtị, Grik sịrị, “na nkuku okporo ámá ndị sara mbara.”'
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a sụgharịrị “ndị mmadụ” na-ezo aka n’ụmụ mmadụ n’ozuzu ha, ọ bụghị naanị ụmụ nwoke.
    reason: lexical_alternative
  - marker: c
    text: 'A pụkwara ịtụgharị ya: “ha enwetala ụgwọ ọrụ ha n’uju.” N’iji okwu azụmahịa eme ihe, ngwaa Grik a nwere ike ịpụta na mmadụ anatala ihe a kwụrụ ya n’uju.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: Mgbe ọ bụla unu na-ekpe ekpere
  rationale: “Mgbe ọ bụla” na-egosipụta oge na-eme ugboro ugboro, dị ka njikọ ὅταν na present subjunctive si dị.
- source_word: οὐκ ἔσεσθε ὡς
  choice: unu adịkwala ka
  rationale: Nke a na-enye future indicative ahụ ike nke iwu ma ọ bụ ịdọ aka ná ntị n’Igbo dị ugbu a.
- source_word: ὑποκριταί
  choice: ndị ihu abụọ
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị na-egosi ezi omume n’ihu ọha ma ebumnuche ha abụghị eziokwu.
- source_word: φιλοῦσιν
  choice: ha na-enwe mmasị
  rationale: Ọ na-echekwa echiche nke ịhụ omume a n’anya ma ọ bụ ịnụ ụtọ ime ya, n’enweghị ikwubiga okwu ókè.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: nʼụlọ nzukọ ndị Juu
  rationale: Ọ na-echekwa ọnọdụ akụkọ ihe mere eme nke συναγωγή ma na-eme ka ụlọ ahụ doo ndị na-agụ Igbo anya.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: na nkuku okporo ámá ndị sara mbara
  rationale: Nsụgharị a na-echekwa ma “nkuku” ma echiche nke okporo ụzọ sara mbara dị n’okwu Grik.
- source_word: ἑστῶτες προσεύχεσθαι
  choice: iguzo na-ekpe ekpere
  rationale: Ọ na-edobe iguzo na ikpe ekpere ọnụ n’usoro dị mfe ma dịkwa eke n’Igbo.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: ka ndị mmadụ wee hụ ha
  rationale: Ọ na-egosipụta ebumnuche ahụ nke ọma; “ndị mmadụ” bụ okwu zuru mmadụ niile dịka ἀνθρώποις si arụ ọrụ ebe a.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Nʼezie, ana m asị unu
  rationale: Ọ na-echekwa nkwupụta siri ike na nke dị nsọ nke Jizọs n’asụsụ Igbo dị ugbu a.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: ha anatala ụgwọ ọrụ ha
  rationale: “Anatala” na-egosipụta na ụgwọ ahụ erutela ha; ihe gbasara ịnata ya n’uju ka edobere na nkọwa ala peeji n’ihi na ọ bụ nghọta idiom ahụ nwere ike ibu.
theological_decisions:
- issue: Ndị ἀνθρώποις na-ezo aka na ha
  choice: ndị mmadụ
  alternative: ndị nwoke
  rationale: N’ebe a okwu Grik ahụ na-ezo aka n’ụmụ mmadụ n’ozuzu ha, ọ bụghị naanị ụmụ nwoke.
- issue: Ike okwu ἀπέχουσι banyere ụgwọ ọrụ
  choice: ha anatala ụgwọ ọrụ ha
  alternative: ha anatala ụgwọ ọrụ ha n’uju
  rationale: Isi ederede na-echekwa okwu ahụ n’enweghị ịgbakwunye “n’uju” n’ụzọ ga-emechi nghọta ya; nkọwa ala peeji na-egosi ike azụmahịa okwu Grik ahụ nwere ike inwe.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Ndị ihu abụọ” bụ okwu a maara nke ọma; “ụlọ nzukọ ndị Juu” na-eme ka ọnọdụ Juu nke narị afọ mbụ doo anya. E zere okwu ụka pụrụ iche na nkọwa okpukpe agbakwunyere.
