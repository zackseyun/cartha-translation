  verdict: revise
  source_fidelity: The main text accurately conveys the general-temporal force of ὅταν, the prohibitive force of οὐκ ἔσεσθε ὡς, the purpose clause, and the commercial-completion nuance available in ἀπέχουσι without forcing “in full” into the text. “Ụlọ nzukọ ndị Juu” responsibly identifies συναγωγαί in its first-century Jewish setting.
  naturalness: The verse is clear, idiomatic Standard Igbo, and maintains an appropriately dignified instructional register. The wording of footnotes a and c benefits from idiomatic correction, especially the commercial explanation in c.
  terminology: “Ndị ihu abụọ,” “ekpe ekpere,” “ndị mmadụ,” and “ụgwọ ọrụ” are suitable, comprehensible equivalents. “N’ezie, ana m asị unu” suitably renders the solemn affirmation without importing doctrinal interpretation.
