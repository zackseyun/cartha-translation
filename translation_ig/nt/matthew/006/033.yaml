id: MAT.6.33
reference: Matthew 6:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: ig
  text: Ma burunụ ụzọ chọọ alaeze ya na ezi omume ya[a], a ga-atụkwasịkwara unu ihe ndị a niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi ya.” Okwu Grik ahụ nwere ike ịpụta ezi omume ma ọ bụ ikpe ziri ezi; ebe a, “ezi omume” ka e ji mee ihe n’ihi na ihe a na-ekwu gụnyere ma ọnọdụ ziri ezi n’ihu Chineke ma omume kwekọrọ n’uche ya, ọ bụghị naanị ikpe ziri ezi n’etiti mmadụ na ibe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: chọọ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ, nke ọnọdụ okwu ahụ na-egosi na ọ bụ ịchụso ihe a mgbe niile; “chọọ” bụ okwu Igbo doro anya ma dịkwa ike n’ọnọdụ a.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi mgbanwe nke na-emegide nchegbu na ịchụso mkpa anụ ahụ ndị a kpọrọ aha n’amaokwu ndị bu ụzọ.
- source_word: πρῶτον
  choice: burunụ ụzọ
  rationale: Nke a na-echekwa echiche nke ibute ihe ụzọ na ime ya ihe kacha mkpa, n’asụsụ Igbo na-aga were were.
- source_word: βασιλείαν
  choice: alaeze
  rationale: “Alaeze” bụ nsụgharị a maara nke ọma ma nwee ike ịgụnye ma ọchịchị eze ma mpaghara ọchịchị ya, n’ebughị ụzọ mechie nghọta okwu Grik ahụ n’otu akụkụ naanị.
- source_word: δικαιοσύνην
  choice: ezi omume
  rationale: N’Igbo, “ezi omume” na-ekwupụta ibi ndụ ziri ezi kwekọrọ n’uche Chineke. E tinyere “ikpe ziri ezi” n’ala ala peeji ka obosara okwu Grik ahụ ghara ifu.
- source_word: αὐτοῦ
  choice: ya
  rationale: A hapụrụ ya dịka nnọchiaha dịka ọ dị na Grik; ihe ndị gbara ya gburugburu na-egosi na ọ na-ezo aka n’ebe Chineke nọ.
- source_word: ταῦτα πάντα
  choice: ihe ndị a niile
  rationale: Ọ na-ezo azụ n’ihe ndị dị mkpa n’ahụ́—nri, ihe ọṅụṅụ, na uwe—ndị a tụlere n’amaokwu ndị bu ụzọ.
- source_word: προστεθήσεται
  choice: a ga-atụkwasịkwara
  rationale: Nke a na-echekwa ọdịdị ọdịnihu na nke nnara omume dị na Grik, tinyere echiche nke inye ihe ndị ahụ n’elu ihe a na-achọ ụzọ.
- source_word: ὑμῖν
  choice: unu
  rationale: “Unu” na-egosi n'ụzọ doro anya na iwu ahụ na nkwa ahụ bụ maka ọtụtụ ndị.
theological_decisions:
- issue: Nsụgharị δικαιοσύνη
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N’ọnọdụ Matiu a, okwu ahụ gụnyere ịbụ onye ziri ezi n’ihu Chineke na ibi ndụ kwekọrọ n’uche ya; “ikpe ziri ezi” naanị nwere ike ime ka nghọta ya dị warara. Ma e debere ya dịka nhọrọ ọzọ n’ala ala peeji.
- issue: Onye αὐτοῦ na-ezo aka na ya
  choice: ya
  alternative: nke Chineke
  rationale: E chekwara nnọchiaha nke Grik iji ghara itinye nkọwa na-adịghị mkpa n’ahịrịokwu ahụ, ọ bụ ezie na ọnọdụ okwu ahụ na-egosi na ọ na-ezo aka n’ebe Chineke/Nna nọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Burunụ ụzọ chọọ” na-enye iwu ahụ ụda ebumpụta ụwa, ebe “a ga-atụkwasịkwara unu” na-echekwa echiche nke mgbakwunye dị na ngwaa Grik.
