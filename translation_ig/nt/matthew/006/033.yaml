  terminology: '"Alaeze" is the established Igbo rendering for βασιλεία and appropriately retains its breadth. "Ezi omume" is a sound rendering of δικαιοσύνη in this context; the footnote responsibly preserves "ikpe ziri ezi" as a lexical alternative without narrowing the main-text sense. The pronoun "ya" preserves the source wording and its contextual reference.'
