id: MAT.6.8
reference: Matthew 6:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: ig
  text: Ya mere, unu adịla ka ha[a], n’ihi na Nna unu maara ihe dị unu mkpa tupu unu arịọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ nkịtị karị, “unu ekwela ka e mee unu ka ha,” ma ọ bụ, “unu eyila ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὖν
  choice: Ya mere, unu adịla
  rationale: “Ya mere” na-egosi njikọ nkwubi okwu οὖν nwere n’ihe e kwuru tupu ya, ebe “unu adịla” na-enye iwu mgbochi μή n’ụzọ Igbo doro anya.
- source_word: ὁμοιωθῆτε
  choice: dịla ka
  rationale: Ọ bụ aorist passive subjunctive e ji nye iwu mgbochi. “Unu adịla ka ha” bụ Igbo eke nke na-egosi ka mmadụ ghara iyiri ma ọ bụ soro ụkpụrụ ha, na-enweghị ime ka ahịrịokwu ahụ sie ike.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha a na-ezo aka n’ụdị ndị na-ekpe ekpere a kọwara n’amaokwu bu ụzọ; “ha” zuru oke ma bụrụkwa nke eke.
- source_word: οἶδεν
  choice: maara
  rationale: 'Ọ bụ ezie na οἶδα nwere ọdịdị perfect, ihe ọ pụtara ebe a bụ ihe dị ugbu a: Nna unu maara.'
- source_word: ὁ πατὴρ ὑμῶν
  choice: Nna unu
  rationale: Grik ahụ kwuru naanị “Nna unu”; etinyeghị okwu “nke eluigwe,” ya mere nsụgharị ahụ etinyeghị ya.
- source_word: ὧν χρείαν ἔχετε
  choice: ihe dị unu mkpa
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo ihe ndị ha chọrọ ma ọ bụ dị ha mkpa.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: tupu unu arịọ ya
  rationale: “Tupu” na-egosipụta oge bu ụzọ nke πρὸ τοῦ, ebe “unu arịọ ya” na-enye αἰτῆσαι αὐτόν n’Igbo nkịtị.
theological_decisions:
- issue: Ọmụma Nna nwere tupu mmadụ ekpee ekpere
  choice: E kwuru ya ozugbo na Nna maara mkpa ndị na-eso ụzọ ya tupu ha arịọ ya.
  alternative: Ịgbakwụnye nkọwa na ekpere bụ maka mmekọrịta, ọ bụghị iji mee ka Chineke mata ihe; ma ọ bụ iji okwu ndị na-akọwa ozizi ọmụma Chineke n’ụzọ sara mbara.
  rationale: Amaokwu ahụ na-ekwu na Nna maara mkpa ha tupu ha arịọ ya, ma ọ kọwaghị ihe mere ha ji ka na-ekpe ekpere. Nsụgharị ahụ hapụrụ esemokwu nkà mmụta okpukpe a dịka ederede si hapụ ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. “Nna unu” na-edobe okwu nna dịka aha mmekọrịta pụrụ iche n’ebe Chineke nọ, na-enweghị ịgbakwunye “nke eluigwe,” nke na-adịghị n’ederede Grik ebe a.
