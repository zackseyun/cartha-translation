id: MAT.6.29
reference: Matthew 6:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: ig
  text: Ma ana m agwa unu na ọbụna Solomọn, n’ebube ya niile, eyighị uwe dịka otu n’ime okooko osisi ndị a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ịma mma ya niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ma ana m agwa unu
  rationale: “Ana m agwa unu” na-egosipụta okwu Jizọs n’ụzọ Igbo dị ndụ; “Ma” na-edobe obere ntụnyere dị n’okwu δέ.
- source_word: οὐδὲ
  choice: ọbụna ... eyighị
  rationale: 'Nhazi a na-egosipụta nkwusi ike nke οὐδέ: ọbụna Solomọn erughị n’ogo ntụnyere ahụ.'
- source_word: Σολομὼν
  choice: Solomọn
  rationale: E dere aha ahụ dịka ụkpụrụ nsụgharị aha ndị dị na Baịbụl n’Igbo si dị.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: n’ebube ya niile
  rationale: N’ebe a, δόξα pụtara ebube na ịma mma eze nwere, ọ bụghị ebube Chineke; “ebube” na-edobe ịdị arọ na ụda okwu ahụ.
- source_word: περιεβάλετο
  choice: eyighị uwe
  rationale: Okwu a pụtara iyi uwe ma ọ bụ ịbụ onye e yi uwe; nhazi Igbo a bụ nke nkịtị ma na-edobe ihe atụ gbasara uwe.
- source_word: ὡς ἓν τούτων
  choice: dịka otu n’ime okooko osisi ndị a
  rationale: A kpọpụtara “okooko osisi” nke okwu “ndị a” na-ezo aka na ya site n’amaokwu gbara ya gburugburu, ka ntụnyere ahụ doo onye na-agụ Igbo anya, ebe “otu” na-edobe ἓν.
theological_decisions:
- issue: Ihe δόξα pụtara mgbe e kwuru banyere Solomọn
  choice: ebube, n’echiche nke ịma mma na ịdị ukwuu nke eze
  alternative: ịma mma ya niile
  rationale: Ihe a na-ekwu bụ ebube Solomọn dịka eze ma e jiri ya tụnyere otú Chineke si chọọ okooko osisi mma; nsụgharị ahụ anaghị eme ka ọ bụrụ ebube Chineke.
translation_notes:
  register: Asụsụ Igbo izugbe nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ “dịka” maka ntụnyere doro anya, a kpọpụtakwara “okooko osisi” iji gbochie mgbagwoju anya nke nnọchiaha naanị ya.
