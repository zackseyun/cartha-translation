id: MAT.6.2
reference: Matthew 6:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: ig
  text: Ya mere, mgbe ọ bụla ị na-enye ndị nọ ná mkpa onyinye ebere[a], afụla opi n'ihu gị[b], dị ka ndị ihu abụọ na-eme n'ụlọ nzukọ ndị Juu nakwa n'okporo ámá, ka ndị mmadụ wee too ha[c]. N'ezie, ana m asị unu, ha anatala ụgwọ ọrụ ha n'uju[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe ị na-enye ndị ogbenye ihe,” ma ọ bụ “mgbe ị na-eme omume ebere.” Nkebiokwu Grik a na-ezo aka n'ọrụ ebere, karịchaa inye ndị nọ ná mkpa ihe.
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “afụla opi n'ihu gị.” O nwere ike ịbụ nkwubiga okwu ókè ma ọ bụ ihe atụ nke ịkpọsa onyinye mmadụ n'ihu ọha.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “ka ndị mmadụ wee nye ha otuto,” ma ọ bụ “sọpụrụ ha.”
    reason: lexical_alternative
  - marker: d
    text: '“Ha anatala ụgwọ ọrụ ha n''uju” na-egosipụta okwu azụmahịa: ha anatala ụgwọ ọrụ ha niile, ọ dịghịkwa nke ọzọ fọdụrụ ha inweta.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Ya mere, mgbe ọ bụla
  rationale: “Mgbe ọ bụla” na-egosipụta ọnọdụ a na-eme ugboro ugboro nke ὅταν na subjunctive na-egosi, ebe “Ya mere” na-ejigide njikọ οὖν na ihe e kwuru tupu ya.
- source_word: ποιῇς ἐλεημοσύνην
  choice: ị na-enye ndị nọ ná mkpa onyinye ebere
  rationale: Nkebiokwu Grik a na-ezo aka n'inye ndị ogbenye ma ọ bụ ndị nọ ná mkpa ihe dịka omume ebere; ntụgharị a doro ndị na-agụ Igbo nke oge a anya.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: afụla opi n'ihu gị
  rationale: E debere ihe oyiyi doro anya nke ịfụ opi na okwu bụ́ “n'ihu gị,” n'agbanyeghị ma okwu ahụ bụ nkwubiga okwu ókè ma ọ bụ ihe atụ.
- source_word: οἱ ὑποκριταὶ
  choice: ndị ihu abụọ
  rationale: Nke a bụ okwu Igbo e ji akọwa ndị na-eme ka à ga-asị na ha bụ ihe ha na-abụghị, karịchaa ndị na-egosi nsọpụrụ Chineke ka ndị ọzọ hụ.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: n'ụlọ nzukọ ndị Juu
  rationale: Nkọwa a na-eme ka ebe nzukọ ndị Juu pụta ìhè n'ụzọ ndị Igbo nke oge a ga-aghọta, na-enweghị ịhapụ njirimara akụkọ ihe mere eme ya.
- source_word: ἐν ταῖς ῥύμαις
  choice: n'okporo ámá
  rationale: “Okporo ámá” bụ okwu Igbo nkịtị maka ebe ọha ndị mmadụ ga-ahụ omume ngosi ahụ.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: ka ndị mmadụ wee too ha
  rationale: N'ebe a δοξάζω na-egosi otuto ma ọ bụ nsọpụrụ ndị mmadụ na-enye; “too” bụ okwu Igbo eke nke na-ebute ebumnuche ngosi ahụ nke ọma.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: N'ezie, ana m asị unu
  rationale: Nke a na-echekwa ịdị arọ na nkwenye nke usoro okwu Jizọs ma na-ada nke ọma n'Igbo.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: ha anatachaala ụgwọ ọrụ ha
  rationale: '“Anatachaala” na-egosipụta ilu azụmahịa nke ἀπέχω: ha anatala ihe niile ha ga-enweta, ọ dịghị nke fọdụrụ.'
theological_decisions:
- issue: Ihe ἀνθρώπων pụtara n'ebe a
  choice: ndị mmadụ
  alternative: ndị nwoke
  rationale: Okwu Grik ahụ gụnyere mmadụ niile n'ozuzu, ọ bụghị naanị ụmụ nwoke; “ndị mmadụ” na-echekwa oke ntụaka ya.
- issue: Ike okwu δοξασθῶσιν
  choice: ka ndị mmadụ wee too ha
  alternative: ka ndị mmadụ wee nye ha otuto
  rationale: Ọ bụ ezie na δοξάζω nwere ike ịbụ “inye otuto,” n'ọnọdụ a ọ na-ekwu maka ịchọ ka ọha too ha. Nhọrọ ahụ anaghị agbanwe ọdịiche dị n'etiti otuto mmadụ na ụgwọ ọrụ Chineke nke gbara amaokwu a gburugburu.
- issue: Ụdị ụgwọ ọrụ dị na ἀπέχουσιν
  choice: ha anatachaala ụgwọ ọrụ ha
  alternative: ha nwere ụgwọ ọrụ ha
  rationale: Nhọrọ a na-echekwa echiche bụ́ na otuto mmadụ bụ ụgwọ ọrụ ha zuru ezu, na-enweghị ịgbakwunye nkwubi okwu okwukwe na-adịghị na ahịrịokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ndị ihu abụọ” bụ okwu a maara nke ọma; “ụlọ nzukọ ndị Juu” na-akọwa synagogue n'enweghị mgbagwoju anya. E debere ihe oyiyi opi na ịdị arọ nke okwu mmechi, ebe nkọwa ala peeji na-echekwa ụzọ ntụgharị ndị ọzọ na ilu azụmahịa dị na Grik.
