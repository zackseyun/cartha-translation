review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the logical connection, charitable giving, the trumpet image, hypocrites, public settings, purpose of human acclaim, and the concluding reward statement. “Ha anatachaala ụgwọ ọrụ ha” broadly communicates ἀπέχουσιν, but it does not as clearly express the commercial idiom’s sense that the reward has already been received in full.
  naturalness: The Standard Igbo is generally clear, modern, and suitably dignified. “Ha anatala ụgwọ ọrụ ha n’uju” is more explicit and idiomatic for the full force of the final clause. In the cultural note, “okwu azụmahịa” is more accurate than calling the commercial idiom an “ilu.”
  terminology: 'Key terms are well rendered: “onyinye ebere” reflects almsgiving, “ndị ihu abụọ” is established for hypocrites, and “ụlọ nzukọ ndị Juu” intelligibly identifies synagogues. “Ndị mmadụ” correctly preserves the generic reference of ἀνθρώπων. No doctrinally loaded interpretation has been introduced.'
  issues:
  - severity: low
    issue: The rendering of ἀπέχουσιν does not explicitly communicate ‘in full.’
    rationale: The verb is a commercial idiom meaning that they have received their reward in full. Adding “n’uju” preserves this force directly in the verse.
  - severity: low
    issue: Footnote d labels the commercial idiom an “ilu” (proverb).
    rationale: The expression is better described as an “okwu azụmahịa” (commercial expression/idiom), not a proverb.
