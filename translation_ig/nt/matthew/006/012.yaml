reference: Matthew 6:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ⸀ἀφήκαμεν τοῖς ὀφειλέταις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: ig
  text: Gbagharakwa anyị ụgwọ anyị[a], dị ka anyị onwe anyị gbagharakwara ndị ji anyị ụgwọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘mmehie anyị’ ma ọ bụ ‘mmejọ anyị.’ N’ụzọ nkịtị, okwu Grik ahụ bụ ‘ụgwọ,’ ma o yikarịrị ka ọ na-ekwu maka mmehie ma ọ bụ mmejọ megide Chineke.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘dị ka anyị onwe anyị agbagharawokwa ndị ji anyị ụgwọ.’ Okwu Grik ahụ na-egosi omume e mere dịka ihe zuru ezu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: gbaghara
  rationale: N’ọnọdụ ekpere a, ἀφίημι pụtara ịgbaghara. Okwu a bụkwa nke ndị Igbo taa na-aghọta nke ọma mgbe a na-ekwu maka mmehie ma ọ bụ mmejọ.
- source_word: τὰ ὀφειλήματα
  choice: ụgwọ
  rationale: Ụgwọ na-echekwa ihe atụ Grik nke ihe mmadụ ji onye ọzọ, kama ịgbanwe ya ozugbo ka ọ bụrụ ‘mmehie’ ma ọ bụ ‘mmejọ.’
- source_word: ὡς
  choice: dị ka
  rationale: ‘Dị ka’ na-egosi ntụnyere dị n’etiti mgbaghara a na-arịọ Chineke na mgbaghara anyị nyere ndị ọzọ, n’enweghị ịkọwakwu ụdị njikọ ahụ karịa ihe Grik kwuru.
- source_word: καὶ ἡμεῖς
  choice: anyị onwe anyị ... kwa
  rationale: 'Njikọ ‘anyị onwe anyị ... kwa’ na-egosipụta nkwusi ike dị na καὶ ἡμεῖς: anyị onwe anyị sokwa mee otu ihe ahụ.'
- source_word: ἀφήκαμεν
  choice: gbagharakwara
  rationale: Ụdị omume gara aga na-egosi na e meela mgbaghara ahụ. N’Igbo, ‘gbagharakwara’ na-ada nke ọma n’ekpere a ma ghara ịmanye nkọwa oge karịrị nke aorist ahụ.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: ndị ji anyị ụgwọ
  rationale: Nkebi a bụ Igbo ebumpụta ụwa maka ‘ndị ji anyị ụgwọ,’ ma na-echekwa njikọ okwu ya na ‘ụgwọ anyị.’
theological_decisions:
- issue: Ihe atụ nke ụgwọ maka mmehie ma ọ bụ mmejọ
  choice: Debe ‘ụgwọ’ n’ahịrị bụ isi.
  alternative: ‘mmehie’ ma ọ bụ ‘mmejọ’
  rationale: Grik ji okwu ụgwọ mee ihe ugboro abụọ. Idebe ya na-echekwa otu ihe atụ ahụ na njikọ dị n’etiti ihe anyị ji Chineke na ihe ndị ọzọ ji anyị, ebe nkọwa ala peeji na-eme ka nzube omume ya doo anya.
- issue: Oge na ọdịdị omume nke ἀφήκαμεν
  choice: ‘gbagharakwara’
  alternative: ‘anyị agbagharawokwa’
  rationale: Aorist ahụ nwere ike igosi omume e mere dịka ihe zuru ezu, ma ọ naghị ekpebi n’onwe ya ọdịiche niile dị n’etiti mfe gara aga na perfect. Ahịrị bụ isi na-eji Igbo dị mfe; nkọwa ala peeji na-edebe ụzọ ọzọ.
- issue: Njikọ dị n’etiti mgbaghara Chineke na mgbaghara mmadụ
  choice: Debe ‘dị ka’ n’enweghị ịkọwa ya ọzọ.
  alternative: Ịkọwa ya dị ka ihe mere Chineke ji gbaghara ma ọ bụ naanị dịka ihe nlereanya
  rationale: ὡς na-egosi ntụnyere, ma amaokwu a naanị ya akọwaghị njikọ ahụ n’ụzọ zuru ezu. Nsụgharị ahụ ekwesịghị idozi esemokwu nkà mmụta okpukpe ahụ n’ime ahịrị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘anyị onwe anyị ... kwa’ chekwaa nkwusi ike nke καὶ ἡμεῖς; e jikwa ‘ụgwọ’ n’akụkụ abụọ chekwaa otu ihe atụ na njikọ okwu nke Grik.
