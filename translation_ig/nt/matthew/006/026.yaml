  to: 'Leenụ nnụnụ nke eluigwe[a]: ha adịghị agha mkpụrụ, ha adịghị ewe ihe ubi, ha adịghịkwa achịkọta ihe n’ọba; ma Nna unu nke eluigwe na-enye ha nri. Unu ọ̀ abaghị uru karịa ha nke ukwuu?[b]'
