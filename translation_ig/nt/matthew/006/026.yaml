  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: ig
  text: 'Leenụ nnụnụ nke eluigwe[a]: ha adịghị agha mkpụrụ, ha adịghị ewe ihe ubi, ha adịghịkwa achịkọta ihe n’ọba; ma Nna unu nke eluigwe na-enye ha nri. Unu ọ̀ abaghị uru karịa ha nke ukwuu?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nnụnụ ndị dị na mbara eluigwe” ma ọ bụ “nnụnụ ndị na-efe n’ikuku.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Unu ọ̀ abaghị uru karịa ha?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: Leenụ
  rationale: Ọ bụ iwu na-akpọ ndị na-ege ntị ka ha tụkwasị nnụnụ anya; “Leenụ” bụ okwu Igbo dị mfe ma kwụ ọtọ.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: nnụnụ ndị dị na mbara eluigwe
  rationale: “Nnụnụ” na-anọchi πετεινά n'ụzọ nkịtị, ebe “mbara eluigwe” na-egosi elu a na-ahụ anya n’ọnọdụ a n’enweghị ịtụgharị ya ka ọ bụrụ ebe obibi Chineke.
- source_word: ὅτι
  choice: ':'
  rationale: Akara kọlọ́n na Igbo na-ewebata ihe ndị a ga-elebara anya banyere nnụnụ n’ụzọ eke, ma na-echekwa ohere ὅτι nwere nke ịkọwa ihe a hụrụ kama ịmanye naanị معنى ‘n’ihi na’.
- source_word: σπείρουσιν ... θερίζουσιν ... συνάγουσιν
  choice: agha mkpụrụ ... ewe ihe ubi ... achịkọba ihe
  rationale: Nhọrọ ndị a na-echekwa usoro ọrụ ugbo atọ na myirịta nke ahịrịokwu Grik.
- source_word: εἰς ἀποθήκας
  choice: n’ọba
  rationale: “Ọba” bụ okwu Igbo a na-aghọta nke ọma maka ebe a na-echekwa ihe ubi.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Nna unu nke eluigwe
  rationale: Ọ na-echekwa ma mmekọrịta nke “Nna unu” ma nkọwa οὐράνιος n’asụsụ Igbo dị ugwu ma doo anya.
- source_word: τρέφει
  choice: na-enye ha nri
  rationale: Nke a bụ ụzọ Igbo eke si kwuo na Chineke na-enye nnụnụ ihe ha ga-eri.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: Ọ̀ bụ na unu abaghị uru nke ukwuu karịa ha?
  rationale: Ajụjụ a na-atụ anya azịza ee; “bara uru ... karịa” na-egosipụta ntụnyere uru dị na διαφέρετε na ike mgbakwunye nke μᾶλλον.
theological_decisions:
- issue: Uru mmadụ karịa nnụnụ n’arụmụka Jizọs
  choice: E gosipụtara na ndị Jizọs na-agwa okwu bara uru nke ukwuu karịa nnụnụ, n’enweghị ịkọwa ihe ozizi kpatara ya.
  alternative: Ịkọwapụta na ihe kpatara ya bụ na mmadụ bụ onyinyo Chineke, ma ọ bụ naanị n’ihi mmekọrịta ọgbụgba ndụ.
  rationale: Amaokwu ahụ na-ekwu ntụnyere uru ahụ n'ụzọ doro anya, ma ọ naghị ekwu kpọmkwem ihe kpatara ya; ya mere ntụgharị ahụ etinyeghị nkọwa ozizi na-adịghị n’ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dị ugwu. E ji ụdị ọtụtụ mmadụ “unu” mee ihe dịka ederede Grik si dị. E jighị nkọwa ụka pụrụ iche ma ọ bụ okwu ochie na-adịghị mfe nghọta.
