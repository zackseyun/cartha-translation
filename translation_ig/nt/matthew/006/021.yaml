id: MAT.6.21
reference: Matthew 6:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: ig
  text: N’ihi na ebe akụ gị dị, n’ebe ahụ ka obi gị ga-adịkwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi na ebe akụ gị dị, n’ebe ahụ ka obi gị dịkwa.” Ụfọdụ nsụgharị na-eji oge ugbu a dị ka okwu na-ekwu eziokwu oge niile, ma ngwaa Grik dị n’oge ọdịnihu (“ga-adị”).
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: ebe
  rationale: Ọ na-ewebata nkebiokwu na-egosi ebe; “ebe” bụ okwu Igbo doro anya ma kwekọọ na njikọ “ebe ahụ” nke na-esote.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a na-akọwa ihe kpatara nkuzi bu ya ụzọ banyere ịkpakọba akụ; “N’ihi na” na-echekwa njikọ nkọwa ahụ n’Igbo nkịtị.
- source_word: θησαυρός
  choice: akụ
  rationale: “Akụ” bụ okwu Igbo dị nkenke ma dị ebube maka ihe bara uru e chekwara, ma na-ahapụkwa ike okwu ahụ nwere ịbụ akụ nkịtị ma ọ bụ ihe mmadụ ji kpọrọ ihe.
- source_word: σου
  choice: gị
  rationale: Ọ na-egosi onye nwe ma “akụ” ma “obi”; “gị” na-asụgharị nke a kpọmkwem.
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: 'Ọ na-aza “ebe” nke mbụ ma na-echekwa nhazi yiri ibe ya nke okwu Grik: “ebe … n’ebe ahụ.”'
- source_word: ἔσται
  choice: ga-adị
  rationale: Nke a bụ ngwaa ọdịnihu; “ga-adị” na-echekwa oge ọdịnihu ahụ kama ime ya ka ọ bụrụ naanị eziokwu na-adịgide adịgide n’oge niile.
- source_word: καρδία
  choice: obi
  rationale: “Obi” bụ okwu Igbo ebumpụta ụwa nke nwere ike ịgụnye ọchịchọ, ịhụnanya, mkpebi, na ebe uche mmadụ gbadoro, n’emeghị ka ihe ọ pụtara dị warara.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” dị n’“ga-adịkwa” na-egosi echiche “ọzọkwa/also” n’ụzọ Igbo na-asụkarị, na-ejikọta ebe obi dị na ebe akụ dị.
theological_decisions:
- issue: Ike oge ọdịnihu nke ἔσται n’okwu amamihe a
  choice: 'Iji ọdịnihu doro anya: “ga-adị”'
  alternative: 'Iji oge ugbu a: “dị” iji gosi ụkpụrụ na-adịgide adịgide'
  rationale: Ihe odide Grik ji ngwaa ọdịnihu. Ide “ga-adị” na-echekwa ụdị ahụ ma hapụ okwu ahụ ka ọ gosipụta ma njikọ dị n’etiti akụ na obi ma ụzọ obi mmadụ si eso ebe o tinyere akụ ya, n’emeghị ka esemokwu dị n’ụdị okwu ahụ pụọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị mfe ma nwee ugwu. Nhazi “ebe … n’ebe ahụ” na-echekwa ntụnyere dị nkenke nke Grik, ebe “ga-adịkwa” na-edobe ma ọdịnihu ma echiche mgbakwunye nke καὶ.
