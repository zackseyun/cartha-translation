reference: Matthew 6:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: ig
  text: ka ị ghara ịpụta n’ihu ndị mmadụ dịka onye na-ebu ọnụ, kama n’ihu Nna gị, onye nọ n'ebe nzuzo; Nna gị, onye na-ahụ n'ebe nzuzo, ga-akwụ gị ụgwọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ ihe odide Grik oge ikpeazụ gbakwụnyere “n’ihu ọha” n’ebe a: “ga-akwụ gị ụgwọ n’ihu ọha.” Ihe odide Grik ndị kacha ochie enweghị okwu ndị ahụ.'
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως
  choice: ka
  rationale: “Ka” na-egosi ebumnuche nke okwu a n’ụzọ doro anya ma bụrụkwa usoro Igbo nkịtị.
- source_word: μὴ φανῇς τοῖς ἀνθρώποις νηστεύων
  choice: ka ndị mmadụ ghara ịhụ na ị na-ebu ọnụ
  rationale: Nke a na-egosipụta echiche nke ịghara ịpụta n’ihu ndị mmadụ dịka onye na-ebu ọnụ. “Ndị mmadụ” bụ okwu Igbo na-agụnye mmadụ niile, ọ bụghị naanị ụmụ nwoke.
- source_word: ἀλλὰ τῷ πατρί σου
  choice: kama ka Nna gị ... hụ ya
  rationale: E tinyere ngwaa “hụ” nke a na-aghọta site n’ahịrịokwu bu ya ụzọ, ka ntụnyere dị n’etiti ndị mmadụ na Nna pụta nke ọma n’Igbo.
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: onye nọ n'ebe nzuzo
  rationale: “N'ebe nzuzo” na-echekwa echiche nke κρυφαῖον dịka ebe zoro ezo ma ọ bụ ọnọdụ a na-adịghị ahụ anya, n’ebughị ụzọ kọwaa ya karịa ihe Grik kwuru.
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: onye na-ahụ ihe a na-eme na nzuzo
  rationale: Igbo chọrọ ihe ngwaa “ịhụ” na-ezo aka na ya ka okwu ahụ daa nke ọma; “ihe a na-eme” bụ ihe a ghọtara n’ọnọdụ a, ya bụ ibu ọnụ a na-eme na nzuzo.
- source_word: ἀποδώσει σοι
  choice: ga-akwụghachi gị ụgwọ
  rationale: N’ọnọdụ a, ἀποδίδωμι pụtara inye mmadụ ihe kwesịrị ya dịka ụgwọ ọrụ; “kwụghachi ... ụgwọ” na-edobe echiche nke nkwụghachi dị na ngwaa ahụ.
theological_decisions:
- issue: Ndị ἀνθρώποις na-ezo aka na ha
  choice: ndị mmadụ
  alternative: ndị ọzọ
  rationale: ἄνθρωποι ebe a bụ ndị na-ekiri omume ahụ n’ozuzu, ọ bụghị ụmụ nwoke naanị. “Ndị mmadụ” na-egosipụta nke a n’Igbo n’enweghị mgbagwoju anya.
- issue: Ihe κρυφαίῳ pụtara n’ebe abụọ ahụ
  choice: “n'ebe nzuzo” maka ebe Nna nọ, na “na nzuzo” maka ihe ọ na-ahụ
  alternative: iji “n'ebe nzuzo” mee ihe n’ebe abụọ ahụ kpọmkwem
  rationale: Ụdị ndị a na-edobe njikọ nke okwu Grik ahụ a kwughachiri, ma na-emekwa ka nke ọ bụla daa nke ọma n’Igbo. Nke mbụ na-akọwa Nna dịka onye a na-adịghị ahụ anya; nke abụọ na-ekwu banyere omume e mere na nzuzo.
- issue: Ụdị nkwụghachi nke Nna
  choice: ga-akwụghachi gị ụgwọ
  alternative: ga-enye gị ụgwọ ọrụ
  rationale: Nke a na-echekwa nkwa nke nzaghachi Chineke n’enweghị ịkọwa ụdị ụgwọ ahụ ma ọ bụ mgbe a ga-enye ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu na nke a na-aghọta ngwa ngwa. A họọrọ “ị na-ebu ọnụ” dịka okwu Ndị Kraịst na ndị Igbo maara nke ọma maka νηστεύω. A haziri ntụnyere μὴ ... ἀλλά ka ọ bụrụ okwu Igbo doro anya, ma e chekwaghị nkọwa ụka ọ bụla a na-apụghị ịgụ kpọmkwem n’isi mmalite.
