revisions:
- from: ka ndị mmadụ ghara ịhụ na ị na-ebu ọnụ, kama ka Nna gị, onye nọ n'ebe nzuzo, hụ ya; Nna gị, onye na-ahụ ihe a na-eme na nzuzo, ga-akwụghachi gị ụgwọ.[a]
  to: ka ị ghara ịpụta n’ihu ndị mmadụ dịka onye na-ebu ọnụ, kama n’ihu Nna gị, onye nọ n'ebe nzuzo; Nna gị, onye na-ahụ n'ebe nzuzo, ga-akwụ gị ụgwọ.[a]
  rationale: 'The revision restores the Greek construction ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου: the person fasting is not to appear before people, but before the Father. It avoids making God’s seeing a commanded or contrasting action, retains the repeated “in secret” language, and leaves the nature of the promised reward unspecified. The textual-variant footnote remains appropriate and is adjusted only to match the revised wording.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:31:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft’s first clause reverses the syntax and agency of the contrast: it says that the Father should see the fasting (“ka ... Nna gị ... hụ ya”), whereas the Greek contrasts not appearing before people with appearing before one’s Father. The revised wording preserves this contrast without adding an object to the Father’s seeing. The second clause is also kept as “one who sees in secret,” without supplying “what is done.”'
  naturalness: The revised Igbo is standard, clear, and suitably reverent. “Ịpụta n’ihu ... dịka onye na-ebu ọnụ” naturally conveys public appearance as someone fasting, while “n’ihu Nna gị” carries the corresponding divine audience.
  terminology: “Nna gị,” “na-ebu ọnụ,” “n'ebe nzuzo,” and “ga-akwụ gị ụgwọ” are appropriate modern Standard Igbo biblical terms. “Ndị mmadụ” correctly renders the generic ανθρώποις. The repeated hidden/secret expression is retained in both clauses.
  issues:
  - severity: high
    issue: The draft makes the Father the subject who is asked to see the fasting.
    rationale: '“kama ka Nna gị, onye nọ n''ebe nzuzo, hụ ya” means “but let your Father ... see it.” In Greek, τῷ πατρί σου is the contrasting dative complement to φανῇς: the faster is to appear before the Father, not ask the Father to see the act.'
  - severity: medium
    issue: The draft adds an explicit object to the Father’s seeing.
    rationale: “onye na-ahụ ihe a na-eme na nzuzo” adds “the things that are done.” Although contextually plausible, the Greek simply says “the one seeing in secret”; the addition is unnecessary and narrows the concise expression.
  - severity: low
    issue: “Ga-akwụghachi gị ụgwọ” can suggest repayment.
    rationale: ἀποδώσει has recompense force, but “ga-akwụ gị ụgwọ” is the more direct Igbo expression for reward/payment here and does not imply that God is returning something previously received.
  revised_text: ka ị ghara ịpụta n’ihu ndị mmadụ dịka onye na-ebu ọnụ, kama n’ihu Nna gị, onye nọ n'ebe nzuzo; Nna gị, onye na-ahụ n'ebe nzuzo, ga-akwụ gị ụgwọ.[a]
  revised_footnotes:
  - marker: a
    text: 'Ụfọdụ ihe odide Grik oge ikpeazụ gbakwụnyere “n’ihu ọha” n’ebe a: “ga-akwụ gị ụgwọ n’ihu ọha.” Ihe odide Grik ndị kacha ochie enweghị okwu ndị ahụ.'
