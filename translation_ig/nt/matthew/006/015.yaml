  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: ig
  text: Ma ọ bụrụ na unu agbagharaghị ndị mmadụ, Nna unu agaghịkwa agbaghara mmehie unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “mmehie” dịka “mmebi iwu,” “nkwụsị iwu,” ma ọ bụ “ihe unu mejọrọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: Ma ọ bụrụ na ... -ghị
  rationale: “Ọ bụrụ na” na-egosi ọnọdụ, “ma” na-egosikwa ọdịiche dị n’amaokwu bu ụzọ; njedebe njụ “-ghị” na-ebuga μή n’Igbo eke.
- source_word: ἀφῆτε / ἀφήσει
  choice: agbagharaghị / agaghịkwa agbaghara
  rationale: N’ebe a, ἀφίημι pụtara ịgbaghara mmejọ. Iji otu ngwaa “gbaghara” n’akụkụ abụọ ahụ na-echekwa nkwughachi na nhazi yiri ibe ha dị n’asụsụ Grik.
- source_word: τοῖς ἀνθρώποις
  choice: ndị mmadụ
  rationale: ἄνθρωποι na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke; “ndị mmadụ” bụ okwu Igbo doro anya ma kwekọọ na nke ahụ.
- source_word: οὐδὲ
  choice: agaghịkwa
  rationale: Mgbakwunye “-kwa” n’ahịrịokwu njụ na-egosi “neither/also not,” na-ejikọta nsonaazụ ahụ n’ụzọ siri ike na ọnọdụ e kwuru ná mmalite.
- source_word: ὁ πατὴρ ὑμῶν
  choice: Nna unu
  rationale: Ihe odide Grik kwuru naanị “Nna unu”; agbakwụnyeghị “nke eluigwe” ebe ọ na-adịghị n’amaokwu a.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: mmejọ unu
  rationale: παραπτώματα na-ezo aka n’ihe mmadụ mejọrọ, mmebi iwu, ma ọ bụ omume na-akpasu iwe. “Mmejọ unu” bụ okwu Igbo dị mfe nghọta nke ka na-eburu ibu omume dị n’okwu ahụ.
theological_decisions:
- issue: Mmekọrịta nwere ọnọdụ n’etiti mmadụ ịgbaghara ibe ya na Nna ịgbaghara mmadụ
  choice: 'E debere okwu ọnọdụ ahụ kpọmkwem: ọ bụrụ na unu agbagharaghị, Nna unu agaghịkwa agbaghara.'
  alternative: Ịkọwa ya naanị dị ka ihe àmà nke mgbaghara e nyeburu, ma ọ bụ dị ka naanị mmebi mmekọrịta, ọ bụghị mgbaghara n’onwe ya.
  rationale: Asụsụ Grik kwuru ọnọdụ na nsonaazụ ya ozugbo. Nsụgharị ahụ ekwesịghị ime ka okwu ahụ dị nro ma ọ bụ jiri nkọwa otu ozizi dozie esemokwu nkà mmụta okpukpe dị na ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “unu” n’ihi na ὑμῶν bụ ọtụtụ. E tinyere akara nkọwa [a] n’akụkụ “mmejọ unu,” okwu nkọwa ahụ metụtara.
