    issue: “mmejọ” is semantically broader than παραπτώματα.
    rationale: While “mmejọ” can refer to wrongdoing in context, it commonly also means a mistake or error. “Mmehie” more directly conveys sins/offenses and better preserves the ethical-religious weight of παραπτώματα without imposing a doctrinal interpretation.
  - severity: low
    issue: The footnote lists “njehie” as an alternative.
    rationale: “Njehie” chiefly denotes an error or mistake and is not a suitable close alternative for παραπτώματα in this context. The alternatives should retain the senses offense, transgression, or wrongdoing.
