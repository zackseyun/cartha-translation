id: MAT.6.22
reference: Matthew 6:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: ig
  text: Anya bụ oriọna nke ahụ. Ya mere, ọ bụrụ na anya gị dị mma[a], ahụ gị dum ga-ejupụta n’ìhè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “otu,” “doro anya,” ma ọ bụ “ahụ ike”; okwu Grik ahụ nwekwara ike ịpụta ịdị n’enweghị nkewa, ma n’ọnọdụ ụfọdụ, imesapụ aka.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: oriọna
  rationale: Ọ bụ ihe a na-amụnye ọkụ, ọ bụghị naanị ìhè n’onwe ya; nke a na-echekwa ihe atụ ahụ nke na-akpọ anya oriọna nke ahụ.
- source_word: σῶμα
  choice: ahụ
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka ahụ mmadụ.
- source_word: ὀφθαλμός
  choice: anya
  rationale: Nsụgharị nkịtị a dabara ma ihe gbasara ịhụ ụzọ ma ihe atụ nke omume dị n’amaokwu ahụ.
- source_word: ἐὰν οὖν
  choice: Ya mere, ọ bụrụ na
  rationale: “Ya mere” na-egosi nkwubi okwu οὖν na-ejikọta na nkwupụta bu ya ụzọ, ebe “ọ bụrụ na” na-echekwa ọnọdụ ἐὰν.
- source_word: ἁπλοῦς
  choice: dị mma
  rationale: N’ihe atụ banyere anya na ìhè, “dị mma” na-egosi anya na-arụ ọrụ nke ọma n’Igbo dị mfe nghọta, n’agbanyeghị na okwu Grik ahụ nwekwara ike ịpụta ihe na-adịghị ekewa, ihe doro anya, ihe zuru oke, ma ọ bụ, n’ọnọdụ ụfọdụ, mmesapụ aka.
- source_word: ὅλον
  choice: dum
  rationale: “Dum” na-echekwa echiche nke ahụ niile n’enweghị akụkụ fọdụrụ.
- source_word: φωτεινὸν
  choice: ga-ejupụta n’ìhè
  rationale: Nkebiokwu a bụ Igbo e ji eme ihe nke ọma ma na-egosipụta na ìhè ga-emetụta ahụ dum.
- source_word: ἔσται
  choice: ga-ejupụta
  rationale: Akara “ga-” na-echekwa oge ọdịnihu nke ngwaa Grik ahụ.
theological_decisions:
- issue: Ihe ἁπλοῦς pụtara n’ihe atụ banyere anya
  choice: E dere ya “dị mma” n’ahịrịokwu bụ isi.
  alternative: “otu,” “doro anya,” “zuru oke,” ma ọ bụ, n’ọnọdụ ụfọdụ, “na-emesapụ aka”
  rationale: Ihe gbara ya gburugburu na-ekwu maka anya dịka oriọna nke ahụ ma na-esote ya na anya ọjọọ n’amaokwu na-abịa. “Dị mma” na-eme ka ọrụ ịhụ ụzọ nke ihe atụ ahụ doo onye Igbo nke oge a anya, ebe nkọwa ala peeji na-echekwa obosara na mgbagwoju anya nke okwu Grik ahụ n’enweghị itinye otu nkọwa nkà mmụta okpukpe n’ahịrịokwu bụ isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Oriọna” na-echekwa ihe atụ a na-ahụ anya, “Ya mere” na-egosi njikọ echiche, ebe “ga-ejupụta n’ìhè” na-enye φωτεινόν n’ụzọ Igbo nkịtị. E tinyere akara nkọwa [a] ozugbo n’akụkụ “dị mma,” bụ okwu nkọwa ahụ metụtara.
