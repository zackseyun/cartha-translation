review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the imperative, the recipients ('us'), 'today,' and the concrete image of bread. However, 'achịcha anyị na-achọ kwa ụbọchị' means 'our bread that we seek every day' and does not translate ἐπιούσιον ('daily' or a related debated sense).
  naturalness: 'The main clause is otherwise clear, but the relative construction ''na-achọ kwa ụbọchị'' is unnatural for the intended meaning. The footnote alternatives are structurally incomplete: ''anyị achịcha'' lacks the required possessive construction.'
  terminology: '''Nye,'' ''anyị,'' ''taa,'' and ''achịcha'' are appropriate Standard Igbo prayer vocabulary. ''Achịcha anyị kwa ụbọchị'' is a natural conventional rendering of ''our daily bread,'' while the note preserves the lexical uncertainty of ἐπιούσιον without deciding it doctrinally.'
  issues:
  - severity: high
    issue: The rendering of ἐπιούσιον as 'na-achọ kwa ụbọchị' is inaccurate.
    rationale: This wording modifies 'bread' as something 'we seek daily,' rather than expressing bread's daily/needed/coming-day quality. It changes the sense of the petition.
  - severity: medium
    issue: Footnote alternatives use the ungrammatical phrase 'anyị achịcha.'
    rationale: Standard Igbo requires 'achịcha anyị' for 'our bread.' The alternatives must retain the possessive relation present in the Greek.
  revised_text: Nye anyị taa achịcha anyị kwa ụbọchị.[a]
