id: MAT.6.11
reference: Matthew 6:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/011.yaml
  text: Give us today our daily bread[a].
translation:
  language: ig
  text: Nye anyị taa achịcha anyị kwa ụbọchị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “achịcha anyị maka taa,” “achịcha anyị maka ụbọchị na-abịa,” ma ọ bụ “achịcha dị anyị mkpa.” Okwu Grik ἐπιούσιον dị ụkọ, ihe ọ pụtara kpọmkwem ka a na-arụrịta ụka.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄρτον
  choice: anyị achịcha
  rationale: ἄρτος pụtara achịcha n'ụzọ kpọmkwem. Ọ bụ ezie na ọ pụkwara ịnọchite anya nri ma ọ bụ ihe e ji ebi ndụ n'ozuzu, nsụgharị ahụ debere ihe atụ doro anya nke achịcha.
- source_word: ἡμῶν
  choice: anyị
  rationale: Ọ bụ nnọchiaha nke na-egosi na achịcha ahụ bụ nke anyị; n'usoro Igbo eke, a na-etinye ya n'azụ ‘anyị achịcha’.
- source_word: τὸν ἐπιούσιον
  choice: na-achọ kwa ụbọchị
  rationale: ἐπιούσιος bụ okwu Grik dị ụkọ nke ihe ọ pụtara kpọmkwem ka a ka na-arụrịta ụka. Nkebi a na-enye echiche a maara nke ọma nke ihe a na-achọ kwa ụbọchị, ma ihe ndị ọzọ okwu ahụ pụrụ ịpụta ka edebere n'okpuru amaokwu.
- source_word: δὸς
  choice: Nye
  rationale: Iwu a sitere na δίδωμι pụtara ịnye; ‘Nye’ bụ okwu Igbo dị mfe, kpọmkwem, ma kwesịkwa ekwesị n'ekpere.
- source_word: ἡμῖν
  choice: anyị
  rationale: Nnọchiaha a bụ onye a na-enye ihe; ‘anyị’ na-egosipụta ya n'ụzọ eke.
- source_word: σήμερον
  choice: taa
  rationale: σήμερον pụtara taa, nke na-echekwa oge e kwuru n'amaokwu ahụ n'Igbo ugbu a.
theological_decisions:
- issue: Ihe ἐπιούσιον pụtara n'Ekpere Onyenwe anyị
  choice: na-achọ kwa ụbọchị
  alternative: nke taa; nke ụbọchị na-abịa; nke dị anyị mkpa iji dị ndụ
  rationale: Okwu ahụ nwere ike ịkọwa achịcha maka ụbọchị a, ụbọchị na-abịa, ma ọ bụ achịcha dị mkpa maka ndụ. Nsụgharị bụ isi na-ekwupụta ịdabere n'ebe Chineke nọ maka mkpa kwa ụbọchị n'Igbo doro anya, ma ihe odide ala ala na-echekwa nghọta ndị ọzọ n'ihi na ihe okwu Grik ahụ pụtara kpọmkwem ejighị n'aka.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma nwee nsọpụrụ. Ahịrịokwu ahụ na-anọgide n'ụdị arịrịọ dị mkpirikpi ma kpọmkwem, ebe ihe odide ala ala na-echekwa ejighị n'aka nke okwu Grik ahụ.
