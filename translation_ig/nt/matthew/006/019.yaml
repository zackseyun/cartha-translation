id: MAT.6.19
reference: Matthew 6:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: ig
  text: Unu akpakọbalaara onwe unu akụ n’ụwa, ebe nla na ire ure[a] na-emebi ya, na ebe ndị ohi na-agbawa mgbidi banye[b] wee zuo ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “nchara.” Okwu Grik ahụ nwekwara ike ịpụta mmebi ma ọ bụ ihe na-eri ihe n’ozuzu ya, ọ bụghị naanị nchara na-eri ígwè.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “na-egwuputa gafee.” O nwere ike ịbụ banyere ndị ohi na-egwu mgbidi e ji aja ma ọ bụ ụrọ kpụọ ka ha banye.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: Unu akpakọbaara
  rationale: Ụdị a na-enye iwu mgbochi n’Igbo n’ụzọ doro anya ma na-edobe echiche nke ịchịkọta ma chekwaa ihe bara uru.
- source_word: ὑμῖν
  choice: onwe unu
  rationale: Ọ na-egosi na ha na-akpakọba akụ ahụ maka onwe ha na uru nke aka ha.
- source_word: θησαυροὺς
  choice: akụ
  rationale: “Akụ” bụ okwu Igbo sara mbara maka ihe bara uru ma ọ bụ akụnụba; ọ naghị amachi ihe ahụ n’ego naanị.
- source_word: ἐπὶ τῆς γῆς
  choice: n’ụwa
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa nke na-edobe ọdịiche dị n’etiti ụwa na eluigwe n’amaokwu na-esote.
- source_word: σὴς
  choice: nla
  rationale: “Nla” bụ aha ahụhụ na-eri ma na-emebi uwe na ihe ndị e chekwara.
- source_word: βρῶσις
  choice: ire ure
  rationale: Okwu Grik ahụ nwere echiche sara mbara banyere ihe na-eri ma ọ bụ mmebi na-aga n’ihu; “ire ure” anaghị amachi ya na nchara ígwè.
- source_word: ἀφανίζει
  choice: na-emebi
  rationale: Ọ na-egosi ime ka akụ ghara ịdị mma ma ọ bụ laa n’iyi, ma dabara ma nla ma ire ure.
- source_word: κλέπται
  choice: ndị ohi
  rationale: Nke a bụ ezigbo okwu Igbo kwekọrọ n’aha ndị na-ezu ohi.
- source_word: διορύσσουσιν
  choice: na-agbawa ụlọ banye
  rationale: Nke a na-eme ka onye Igbo nke oge a ghọta na ndị ohi na-amanye ụzọ banye; nkọwa ala peeji na-edobe ihe okwu ahụ pụtara kpọmkwem, bụ́ igwu ụzọ gafee mgbidi.
- source_word: κλέπτουσιν
  choice: wee zuo
  rationale: Ọ na-egosi n’ụzọ doro anya ihe ndị ohi na-eme mgbe ha banyere.
theological_decisions:
- issue: Ókè echiche nke γῆ
  choice: n’ụwa
  alternative: n’elu ụwa
  rationale: “N’ụwa” bụ Igbo dị mfe ma na-edobe ụwa dịka ebe megidere eluigwe, n’ebughị nkọwa ozizi ọzọ bata.
- issue: Nsụgharị βρῶσις
  choice: ire ure
  alternative: nchara
  rationale: “Ire ure” na-edobe echiche sara mbara nke ihe na-eri ma na-emebi akụ; “nchara” ga-eme ka echiche ya bụrụ naanị mmebi ígwè. A na-edobe nhọrọ ahụ na nkọwa ala peeji.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-agwa ìgwè mmadụ okwu site na “unu,” ma na-eji “akụ” dịka aha mkpokọta, ya mere nnọchiaha “ya” dabara. E debere akara nkọwa [a] n’akụkụ “ire ure” na [b] n’akụkụ ịgbawa ụlọ banye ka nke ọ bụla jikọọ kpọmkwem n’okwu ọ na-akọwa.
