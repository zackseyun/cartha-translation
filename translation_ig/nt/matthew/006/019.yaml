review_pass:
  verdict: revise
  source_fidelity: 'The draft fails to express the Greek prohibition adequately: “Unu akpakọbaara” lacks the required negative prohibitive force of Μή + present imperative. The revision supplies Igbo negative imperative “Unu akpakọbalaara.” The rendering of βρῶσις as “ire ure” appropriately retains the broad consuming/decaying sense, with “nchara” retained as an alternative. “Na-agbawa mgbidi banye” conveys διορύσσουσιν more closely than breaking an entire house.'
  naturalness: The revised wording is natural, contemporary Standard Igbo. “Akpakọbalaara onwe unu akụ” clearly means accumulating wealth for one’s own benefit. “Mgbidi” is more precise and idiomatic than “ụlọ” in this burglary image.
  terminology: “Akụ,” “nla,” “ire ure,” and “ndị ohi” are suitable Standard Igbo terms. The register remains direct and dignified, fitting Jesus’ instruction. No doctrinal interpretation has been added.
  issues:
  - severity: high
    issue: The main verb is not marked as a prohibition.
    rationale: Μὴ θησαυρίζετε means “Do not store up.” “Unu akpakọbaara” does not contain Igbo negative-imperative marking and can be read as an affirmative directive. “Unu akpakọbalaara” restores the source’s prohibitive force.
  - severity: medium
    issue: “Na-agbawa ụlọ banye” is less precise for διορύσσουσιν.
    rationale: The Greek literally denotes digging/breaking through, especially a wall. Saying thieves break a whole house is unnecessarily broad. “Na-agbawa mgbidi banye” preserves the entry-through-a-wall image, while the footnote gives the literal/cultural detail.
  revised_text: Unu akpakọbalaara onwe unu akụ n’ụwa, ebe nla na ire ure[a] na-emebi ya, na ebe ndị ohi na-agbawa mgbidi banye[b] wee zuo ya.
