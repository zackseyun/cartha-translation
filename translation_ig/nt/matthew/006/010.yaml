id: MAT.6.10
reference: Matthew 6:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: ig
  text: Ka alaeze gị bịa; ka e mee uche gị[a], dịka n’eluigwe, otu ahụkwa n’ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, ikekwe: “Ka alaeze gị bịa; ka e mee uche gị, dịka n’eluigwe, otu ahụkwa n’ụwa,” ebe a ghọtara na “dịka n’eluigwe, otu ahụkwa n’ụwa” na-emetụta arịrịọ abụọ ahụ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθέτω
  choice: Ka ... bịa
  rationale: Ụdị iwu onye nke atọ a na-arụ ọrụ dị ka arịrịọ e chere n’ebe Chineke nọ. “Ka ... bịa” bụ ụzọ Igbo si ekwu arịrịọ a n’ekpere n’ụzọ dị nro ma kwesị ekwesị.
- source_word: βασιλεία
  choice: alaeze
  rationale: “Alaeze” bụ okwu Igbo a maara nke ọma maka βασιλεία, ọ pụkwara ibu echiche banyere ọchịchị eze nakwa mpaghara ọchịchị ya n’enweghị ịkọwa nke ahụ karịa ihe Grik kwuru.
- source_word: γενηθήτω
  choice: ka e mee
  rationale: Mgbe okwu a na θέλημα nọkọrọ, ọ na-egosi arịrịọ ka ihe Chineke chọrọ mezuo. “Ka e mee” bụ okwu Igbo doro anya, nke na-echekwakwa ụdị nnara Grik.
- source_word: θέλημα
  choice: uche
  rationale: “Uche” n’okwu “uche gị” na-egosi ihe mmadụ chọrọ ma ọ bụ kpebie, ma na-ahapụkwa ibu echiche okwu Grik nwere n’enweghị itinye nkọwa otu ụka pụrụ iche.
- source_word: ὡς
  choice: dịka
  rationale: “Dịka” na-ewebata ntụnyere ahụ n’ụzọ dị nkenke ma bụrụkwa nke e ji eme ihe n’Igbo ugbu a.
- source_word: ἐν οὐρανῷ
  choice: n’eluigwe
  rationale: “N’eluigwe” bụ nsụgharị Igbo kwekọrọ n’ebe a maka mpaghara eluigwe nke e ji tụnyere ụwa.
- source_word: ἐπὶ γῆς
  choice: n’ụwa
  rationale: “N’ụwa” bụ okwu Igbo nkịtị na nke kwesịrị ekwesị maka ntụnyere dị n’etiti eluigwe na ụwa.
- source_word: καὶ
  choice: otu ahụkwa
  rationale: N’usoro ntụnyere a, “otu ahụkwa” na-eme ka njikọ “dịka ... otu ahụkwa ...” doo anya n’Igbo, n’etinyeghị echiche ọzọ na Grik.
theological_decisions:
- issue: Ihe nkebi ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς na-akọwa
  choice: 'E tinyere nkebi ahụ n’akụkụ arịrịọ nke abụọ: “ka e mee uche gị ... dịka n’eluigwe, otu ahụkwa n’ụwa.”'
  alternative: A pụkwara ịghọta na “dịka n’eluigwe, otu ahụkwa n’ụwa” na-emetụta ma “Ka alaeze gị bịa” ma “ka e mee uche gị.”
  rationale: N’usoro okwu Grik, nkebi ntụnyere ahụ kacha nso n’arịrịọ nke abụọ, nke mere nke a ji bụrụ ọgụgụ bụ isi. Ma akara edemede nke mbipụta Grik nke oge a bụ nke ndị editọ tinyere, ya mere e debere ohere ọgụgụ sara mbara n’ihe e dere n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù maka ekpere. E chekwara usoro arịrịọ abụọ nke Grik na ntụnyere eluigwe na ụwa, ma zere okwu ochie ma ọ bụ nkọwa nke otu ụka pụrụ iche.
