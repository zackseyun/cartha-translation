review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the verse’s central contrast: no person can render slave-like service to two masters; the two parallel outcomes (hate/love; hold to/despise) are retained; and God and Mammon remain the mutually exclusive objects of service. “Ndị nna ukwu abụọ,” “ijere … ozi,” “kpọọ … asị,” “hụ … n’anya,” and “leda … anya” are sound contextual renderings. The Mammon footnote appropriately retains the loanword while supplying ‘wealth’ and ‘money’ as alternatives.'
  naturalness: 'The main text is clear, dignified Standard Igbo and maintains the balanced proverbial cadence. A minor revision improves the footnote’s idiom: “okwu Grik ahụ bụ okwu mbinye” is somewhat repetitive, and “na-azọ ọchịchị megide Chineke” is less natural and over-specifies the image. The revision states the rival-master personification directly and idiomatically.'
  terminology: “Chineke” and “Mamọn” are appropriate. “Ndị nna ukwu” correctly conveys κυρίοις in its social, non-divine sense. Retaining “Mamọn” is preferable to reducing μαμωνᾷ to merely ‘ego’ or ‘akụ na ụba’ in the text; the explanatory alternatives belong in the note.
  issues:
  - severity: low
    issue: The Mammon footnote is stylistically awkward and slightly interpretive in its final clause.
    rationale: “Okwu Grik ahụ bụ okwu mbinye” redundantly calls the Greek term a loanword, while “nna ukwu na-azọ ọchịchị megide Chineke” introduces a more specific notion of contesting rulership. The Greek rhetorical force is adequately and more naturally conveyed by describing riches as a rival master.
  revised_text: Ọ dịghị onye pụrụ ijere ndị nna ukwu abụọ ozi; n’ihi na ọ ga-akpọ otu onye asị ma hụ onye nke ọzọ n’anya, ma ọ bụ ọ ga-arapara n’otu onye ma leda onye nke ọzọ anya. Unu apụghị ijere Chineke na Mamọn[a] ozi.
