id: MAT.6.24
reference: Matthew 6:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: ig
  text: Ọ dịghị onye pụrụ ijere ndị nna ukwu abụọ ozi; n’ihi na ọ ga-akpọ otu onye asị ma hụ onye nke ọzọ n’anya, ma ọ bụ ọ ga-arapara n’otu onye ma leda onye nke ọzọ anya. Unu apụghị ijere Chineke na Mamọn[a] ozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “akụ na ụba” ma ọ bụ “ego.” Okwu Grik ahụ ji okwu mbinye “Mamọn,” nke pụrụ igosi akụ na ụba dịka nna ukwu na-asọrịta mpi na Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Ọ dịghị onye
  rationale: This is the natural Standard Igbo universal negative, corresponding directly to “no one.”
- source_word: δύναται / δύνασθε
  choice: pụrụ / apụghị
  rationale: These forms clearly express ability and inability while preserving the repeated emphasis of the Greek.
- source_word: δυσὶ κυρίοις
  choice: ndị nna ukwu abụọ
  rationale: In the context of δουλεύειν, the phrase refers to masters who command service, not to the divine title “Lord.”
- source_word: δουλεύειν
  choice: ijere … ozi
  rationale: This is the idiomatic Igbo expression for serving someone and works naturally with “ndị nna ukwu,” while retaining the master-servant relationship.
- source_word: μισήσει
  choice: ga-akpọ … asị
  rationale: This preserves the strong plain sense “will hate” rather than weakening it to comparative preference.
- source_word: ἀγαπήσει
  choice: ga-ahụ … n’anya
  rationale: The standard natural Igbo expression for loving someone preserves the direct contrast with hatred.
- source_word: ἑνὸς ἀνθέξεται
  choice: ga-arapara n’otu onye
  rationale: “Ar cringing?” No; “ịrapara n’ahụ́/ịrapara n’otu” conveys holding firmly to or adhering loyally to one party, preserving the relational force of ἀντέχομαι.
- source_word: καταφρονήσει
  choice: ga-eleda … anya
  rationale: This idiomatic Igbo wording conveys despising or treating the other as beneath regard.
- source_word: θεῷ
  choice: Chineke
  rationale: This is the standard Igbo designation for God.
- source_word: μαμωνᾷ
  choice: Mamọn
  rationale: The loanword is retained to preserve the rhetorical presentation of riches as a rival master; its meaning is clarified in a footnote.
theological_decisions:
- issue: Rendering κύριος in a non-divine social context
  choice: ndị nna ukwu
  alternative: ndị nwe
  rationale: The plural form and the language of bonded service require a social master-servant sense, avoiding confusion with a divine title.
- issue: Rendering μαμωνᾶς
  choice: Mamọn
  alternative: akụ na ụba; ego
  rationale: Keeping the loanword preserves the personified, rival-master force of the saying, while the footnote supplies its ordinary lexical meaning without collapsing the metaphor.
- issue: Force of μισήσει
  choice: ga-akpọ … asị
  alternative: ga-ahụ … n’anya karịa
  rationale: The main text retains the strong hate/love antithesis of the Greek rather than silently interpreting “hate” as merely “love less.”
translation_notes:
  register: Current, dignified Standard Igbo. The balanced clauses preserve the saying’s proverbial rhythm. “Ijere … ozi” is broadly understandable, while “ndị nna ukwu” sustains the social imagery of service under masters. The Mammon footnote marker is placed directly after the term it explains.
