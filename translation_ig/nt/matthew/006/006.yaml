- from: Ma gị onwe gị, mgbe ị na-ekpe ekpere, banye n’ọnụ ụlọ ime gị[a], mechie ụzọ gị, kpekuo Nna gị onye nọ n’ebe nzuzo ekpere; Nna gị onye na-ahụ n’ebe nzuzo ga-akwụghachi gị[b].
  to: Ma gị onwe gị, mgbe ị na-ekpe ekpere, banye n’ọnụ ụlọ ime gị[a]. Mgbe i mechisịrị ụzọ gị, kpee Nna gị, onye nọ na nzuzo, ekpere; Nna gị, onye na-ahụ na nzuzo, ga-akwụ gị ụgwọ ọrụ[b].
  rationale: The revision uses idiomatic Standard Igbo for praying to the Father, makes the completed shutting of the door explicit before the command to pray, and renders the final verb in its positive contextual sense. It retains the source’s repetition and ambiguity in ‘na nzuzo,’ does not add theological interpretation, and keeps both required footnote anchors.
  reviewer_model: gpt-5.6-terra
