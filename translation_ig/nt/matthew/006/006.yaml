id: MAT.6.6
reference: Matthew 6:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: ig
  text: Ma gị onwe gị, mgbe ị na-ekpe ekpere, banye n’ọnụ ụlọ ime gị[a]. Mgbe i mechisịrị ụzọ gị, kpee Nna gị, onye nọ na nzuzo, ekpere; Nna gị, onye na-ahụ na nzuzo, ga-akwụ gị ụgwọ ọrụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị ‘ọnụ ụlọ nzuzo,’ ‘ọnụ ụlọ nke mmadụ nọ naanị ya,’ ma ọ bụ ‘ụlọ nkwakọba ihe.’ Okwu Grik na-ezo aka n’ọnụ ụlọ dị n’ime ụlọ, nke e ji anọ naanị mmadụ ma ọ bụ echekwa ihe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị ‘ga-akwụghachi gị.’ Okwu Grik nwere ike ịpụta ‘inyeghachi,’ ‘ịkwụghachi,’ ma ọ bụ ‘inye ụgwọ ọrụ,’ dịka ihe gbara ya gburugburu si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Ma gị onwe gị
  rationale: ‘Gị onwe gị’ na-egosipụta nkwusi ike dị n’aha nnọchiaha Grik ma na-edobe ọdịiche dị n’etiti onye Jizọs na-agwa okwu na ndị ihu abụọ e kwuru okwu ha n’amaokwu gara aga.
- source_word: ὅταν προσεύχῃ
  choice: mgbe ị na-ekpe ekpere
  rationale: Nke a na-egosi oge omume a na-emekarị ma ọ bụ mgbe ọ bụla o mere, n’ụzọ dị mfe ma bụrụ Igbo nkịtị.
- source_word: εἴσελθε
  choice: banye
  rationale: ‘Banye’ bụ iwu doro anya nke na-egosi ịga n’ime ebe ahụ.
- source_word: ταμεῖόν
  choice: ọnụ ụlọ ime
  rationale: Ọ na-ezo aka n’ọnụ ụlọ dị n’ime ụlọ nke a pụrụ iji maka ịnọ naanị mmadụ ma ọ bụ idobe ihe; ‘ọnụ ụlọ ime’ na-ezere nghọta ọgbara ọhụrụ na-eduhie eduhie nke ‘closet.’
- source_word: κλείσας τὴν θύραν σου
  choice: mechie ụzọ gị
  rationale: Usoro okwu Igbo a dị mma ma na-egosi na e mechiri ụzọ tupu ekpere nzuzo ahụ.
- source_word: πρόσευξαι τῷ πατρί σου
  choice: kpekuo Nna gị ... ekpere
  rationale: Nke a na-edobe omume ikpe ekpere na onye a na-ekpegara ya, bụ ‘Nna gị,’ n’enweghị ịgbakwunye ‘nke eluigwe,’ nke na-adịghị n’amaokwu a.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: onye nọ n’ebe nzuzo
  rationale: Nke a na-edobe echiche nke izo ezo na ohere nke ịghọta okwu ahụ dị ka ebe, n’ebughị ụzọ kọwaa ya karịa ihe Grik kwuru.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: onye na-ahụ n’ebe nzuzo
  rationale: 'E dekwara ‘n’ebe nzuzo’ ọzọ iji chekwaa nkwughachi okwu Grik na mgbagwoju anya ya: ọ pụrụ ịpụta ịhụ n’ebe nzuzo ma ọ bụ ịhụ ihe zoro ezo.'
- source_word: ἀποδώσει σοι
  choice: ga-akwụghachi gị
  rationale: ‘Kwụghachi’ nwere ike ibu echiche inyeghachi, ịkwụghachi, ma ọ bụ inye ụgwọ kwesịrị ekwesị; ya mere ọ na-edobe obosara ihe okwu Grik nwere ike ịpụta.
theological_decisions:
- issue: Ihe nkwughachi ἐν τῷ κρυπτῷ pụtara
  choice: A sụgharịrị ya ugboro abụọ dịka ‘n’ebe nzuzo.’
  alternative: ‘na nzuzo’ ma ọ bụ ‘ihe a na-eme na nzuzo’
  rationale: Nhọrọ a na-echekwa nkwughachi okwu na ọdịiche dị n’etiti ekpere nzuzo na ngosipụta n’ihu ọha, ma ọ naghị ekpebi kpamkpam ma okwu ahụ ọ na-egosi ebe ma ọ bụ ụzọ e si eme ihe.
- issue: Aha πατήρ e ji kpọọ Chineke
  choice: Nna
  alternative: Nna nke eluigwe
  rationale: Ihe odide ahụ kwuru naanị ‘Nna gị.’ Ịhapụ ya otú ahụ na-echekwa okwu mmekọrịta Jizọs jiri mee ihe n’enweghị mgbakwunye nkọwa sitere n’amaokwu ndị ọzọ.
- issue: Ihe ἀποδώσει pụtara n’ọrụ Chineke
  choice: ga-akwụghachi gị
  alternative: ga-enye gị ụgwọ ọrụ
  rationale: Nhọrọ ahụ na-ahapụ ohere nghọta nke inyeghachi, ịkwụghachi, ma ọ bụ inye ụgwọ ọrụ, kama ịkọwapụta ụdị ma ọ bụ ọdịdị ihe Chineke ga-enye.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. A họọrọ ‘Ma gị onwe gị’ iji gosipụta ọdịiche siri ike; e chekwara nkwughachi ‘n’ebe nzuzo’ iji ghara ihichapụ mgbagwoju anya nke ihe odide Grik.
