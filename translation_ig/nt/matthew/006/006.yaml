review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the contrastive address, the inward/private room, prayer to the Father, the repeated hiddenness phrase, and the future divine response. The aorist participle κλείσας is better represented explicitly as action completed before prayer. Rendering ἀποδώσει as a positive reward is appropriate in this context, while a note can retain the lexical range of repayment/requital.
  naturalness: ‘Kpekuo Nna gị ... ekpere’ is less idiomatic than the normal Standard Igbo construction ‘kpee Nna gị ... ekpere.’ Explicitly marking ‘after you have shut your door’ also improves the flow and reflects the Greek sequence. Commas around the descriptive clauses make the sentence easier to read without changing its sense.
  terminology: ‘Ọnụ ụlọ ime’ is a suitable rendering of ταμεῖον. ‘Nna gị’ correctly avoids adding ‘nke eluigwe.’ ‘Na nzuzo’ preserves the repeated Greek phrase without deciding whether it is strictly locative or adverbial. ‘Ga-akwụ gị ụgwọ ọrụ’ conveys the contextually positive sense of ἀποδώσει; the footnote preserves ‘ga-akwụghachi gị’ as an alternative.
  issues:
  - severity: medium
    issue: The verbal phrase ‘kpekuo Nna gị ... ekpere’ is nonstandard/less natural in this context.
    rationale: For prayer addressed to God, Standard Igbo naturally uses ‘kpee [onye] ekpere.’ This preserves πρόσευξαι τῷ πατρί σου directly and clearly.
  - severity: low
    issue: The antecedent action of κλείσας is only implied by the comma sequence ‘mechie ụzọ gị, kpekuo ...’.
    rationale: '‘Mgbe i mechisịrị ụzọ gị’ explicitly and naturally reflects the aorist participle: shut the door before praying.'
  - severity: low
    issue: ‘Ga-akwụghachi gị’ can sound primarily like repayment or requital, including a negative sense.
    rationale: The immediate context concerns the Father's favorable response to hidden prayer. ‘Ga-akwụ gị ụgwọ ọrụ’ communicates that sense while the note retains the wider lexical alternative.
  revised_text: Ma gị onwe gị, mgbe ị na-ekpe ekpere, banye n’ọnụ ụlọ ime gị[a]. Mgbe i mechisịrị ụzọ gị, kpee Nna gị, onye nọ na nzuzo, ekpere; Nna gị, onye na-ahụ na nzuzo, ga-akwụ gị ụgwọ ọrụ[b].
