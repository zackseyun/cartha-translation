id: MAT.19.23
reference: Matthew 19:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: ig
  text: Mgbe ahụ, Jizọs sịrị ndị na-eso ụzọ ya, “N’ezie, ana m asị unu[a], ọ ga-esiri nwoke bara ọgaranya ike ịbanye n’alaeze eluigwe[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Amen, ana m asị unu.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “nwoke bara ọgaranya ga-eji ihe isi ike banye n’alaeze eluigwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: Na-egosi ngafe na-aga n’ihu n’akụkọ ahụ n’Igbo dị mfe ma doo anya.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Ọ bụ nsụgharị aha a na-ejikarị eme ihe n’Igbo ọkọlọtọ.
- source_word: εἶπεν τοῖς μαθηταῖς αὐτοῦ
  choice: sịrị ndị na-eso ụzọ ya
  rationale: “Sịrị” bụ ụzọ ebumpụta ụwa e si webata okwu mmadụ kwuru; “ndị na-eso ụzọ ya” na-edowe αὐτοῦ nke pụtara “ya.”
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: N’ezie, ana m asị unu
  rationale: Na-ebuga ịdị arọ na nkwenye siri ike nke usoro okwu Jizọs n’Igbo doro anya, ebe “unu” na-edowe ọtụtụ mmadụ nke ὑμῖν.
- source_word: πλούσιος
  choice: nwoke bara ọgaranya
  rationale: Okwu Grik a bụ adjective e ji dị ka aha, otu onye, nwoke; nsụgharị a na-edowe ntụaka ahụ ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: δυσκόλως εἰσελεύσεται
  choice: ọ ga-esiri ... ike ịbanye
  rationale: Usoro a bụ Igbo ebumpụta ụwa nke na-egosipụta na ịbanye ga-abụ ihe siri ike, na-agbakwụnyeghị na ọ gaghị ekwe omume.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: alaeze eluigwe
  rationale: Nke a bụ okwu Igbo a maara nke ọma maka usoro okwu Matiu; ọ na-edowe echiche ọchịchị/alaeze ma na-asụ “eluigwe” n’ụzọ Igbo kwesịrị ekwesị.
theological_decisions:
- issue: πλούσιος dị ka adjective e ji mee aha nke dị n’ụdị nwoke
  choice: nwoke bara ọgaranya
  alternative: ọgaranya
  rationale: Ụdị Grik ahụ bụ otu onye nwoke, ya mere e mere ka ntụaka nwoke ahụ pụta ìhè kama ime ka ọ ghara igosi okike; n’agbanyeghị nke ahụ, “ọgaranya” naanị ya ga-abụkwa Igbo ebumpụta ụwa.
- issue: Ike nke Ἀμὴν n’usoro okwu Jizọs
  choice: N’ezie
  alternative: Amen
  rationale: “N’ezie” na-eme ka nkwenye siri ike na ikike dị n’okwu ahụ doo onye Igbo nke oge a anya, ebe “Amen” ga-edowe ụda okwu Semitik ahụ kpọmkwem.
- issue: Ogo ihe isi ike dị na δυσκόλως
  choice: ọ ga-esiri ... ike
  alternative: ọ fọrọ nke nta ka ... ghara ịbanye
  rationale: A họọrọ okwu na-egosi ihe isi ike n’emeghị ka amaokwu a n’onwe ya kwuo na ọ fọrọ nke nta ka ọ ghara ikwe omume; amaokwu na-esote na-eme ka esemokwu ahụ sie ike karịa.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. Usoro “ọ ga-esiri ... ike ịbanye” bụ nke ebumpụta ụwa karịa ịtụgharị adverb Grik ahụ n’usoro siri ike, ma ọ ka na-edowe ihe okwu ahụ pụtara.
