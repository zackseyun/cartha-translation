  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοί, καὶ ἐθεράπευσεν αὐτοὺς ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/002.yaml
  text: And large crowds followed him, and he healed them there.
translation:
  language: ig
  text: Ọtụtụ ìgwè mmadụ sokwara ya, ọ gwọkwara ha n’ebe ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: sokwara
  rationale: Ngwaa “iso” na-egosi iso mmadụ n’ụzọ nkịtị n’akụkọ a; “-kwara” na-ejigide njikọ nke καί na ihe ndị bu ụzọ mee.
- source_word: αὐτῷ
  choice: ya
  rationale: “Ya” bụ nnọchiaha Igbo nkịtị maka onye a na-eso, ya bụ Jizọs n’akụkụ akụkọ a.
- source_word: ὄχλοι πολλοί
  choice: ìgwè mmadụ buru ibu
  rationale: Nke a na-egosi ìgwè ndị mmadụ dị ọtụtụ n’Igbo dị mfe ma kwekọọ na echiche nke ὄχλοι πολλοί.
- source_word: ἐθεράπευσεν
  choice: ọ gwọkwara
  rationale: “Ịgwọ” bụ okwu Igbo doro anya maka ime ka ndị ọrịa dịrị mma; “-kwara” na-echekwa njikọ paratactic nke καί nke abụọ.
- source_word: αὐτούς
  choice: ha
  rationale: “Ha” na-alaghachi n’ebe ìgwè mmadụ ahụ nọ n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: Ọ na-echekwa ihe adverb ebe ἐκεῖ pụtara n’asụsụ Igbo nkịtị.
- source_word: καὶ ... καὶ
  choice: -kwara ... -kwara
  rationale: Mgbakwunye “-kwa/-kwara” n’Igbo na-ejikọta omume abụọ ahụ n’usoro akụkọ n’enweghị ịkọwa mmekọrịta ha karịa ihe Grik kwuru.
