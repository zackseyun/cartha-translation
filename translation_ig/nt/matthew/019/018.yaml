    issue: Awkward rendering of Ποίας
    rationale: “Olee ndị nke ahụ?” is structurally awkward and obscures the elliptical reference to the commandments mentioned in the preceding verse. “Olee iwu ndị?” is idiomatic Standard Igbo and preserves the plural sense.
