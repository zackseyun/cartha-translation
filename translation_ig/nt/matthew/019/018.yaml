  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: ig
  text: 'Ọ sịrị ya, “Olee iwu ndị?” Jizọs wee sị, “Ndị a: Egbula mmadụ, akwala iko, ezula ohi, agbala akaebe ụgha,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: Olee ndị nke ahụ?
  rationale: Ajụjụ a na-ezo aka n’iwu ndị a kpọtụrụ aha na amaokwu gara aga; ‘ndị’ kwekọrọ n’ụdị ọtụtụ nke okwu Grik.
- source_word: Τὸ
  choice: 'Ndị a:'
  rationale: Akụkụ a na-ebute ndepụta iwu ndị Jizọs kpọrọ aha. A sụgharịrị ya n’ụzọ Igbo na-agụ nke ọma kama idowe ‘The:’ nke Bekee n’ụdị na-adịghị eke.
- source_word: Οὐ φονεύσεις
  choice: Egbula mmadụ
  rationale: φονεύω pụtara igbu mmadụ n’ụzọ iwu megidere, ọ bụghị ụdị igbu ihe niile.
- source_word: Οὐ μοιχεύσεις
  choice: akwala iko
  rationale: Nke a bụ ụzọ Igbo a na-ahụkarị ma doo anya maka ịkwa iko.
- source_word: Οὐ κλέψεις
  choice: ezula ohi
  rationale: Ụdị iwu mmachibido iwu nke na-egosipụta izu ohi kpọmkwem.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: agbala akaebe ụgha
  rationale: Na-echekwa echiche nke ịgba akaebe na-abụghị eziokwu, karịchaa n’ọnọdụ ikpe ma ọ bụ nkwupụta.
theological_decisions:
- issue: Ụdị na ọrụ nke Τὸ tupu ndepụta ahụ
  choice: 'Ndị a:'
  alternative: 'Nke a:'
  rationale: Τὸ dị otu n’ọnụọgụ n’asụsụ Grik ma na-arụ ọrụ dị ka ihe na-ebute okwu e hotara. N’Igbo, ‘Ndị a’ na-ejikọta ajụjụ ‘Olee ndị?’ na ndepụta iwu ahụ n’ụzọ doro anya, na-enweghị ịgbakwunye nkọwa ozizi.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E ji ụdị mmachibido iwu dị nkenke mee ka usoro Iwu Iri ahụ guzosie ike.
