  verdict: revise
  source_fidelity: The four prohibitions accurately render the Greek commandments. The plural question Ποίας asks which commandments, and the introductory Τὸ functions idiomatically to introduce the specified items.
  naturalness: “Olee ndị nke ahụ?” is not natural Standard Igbo for the elliptical question “Which ones?” “Olee iwu ndị?” states the understood noun and is clear in context. The concise imperative forms are natural and suitably match the register of the commandments.
  terminology: “Egbula mmadụ” appropriately distinguishes murder from killing generally; “akwala iko,” “ezula ohi,” and “agbala akaebe ụgha” are established, comprehensible renderings. “Ndị a:” naturally introduces the list without reproducing the English audit trail’s unnatural “The:”.
  issues:
