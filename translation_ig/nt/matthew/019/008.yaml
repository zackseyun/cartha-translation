  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: ig
  text: Ọ sịrị ha, “N’ihi obi unu siri ike ka Mosis kwere ka unu gbaa ndị nwunye unu alụkwaghịm[b]. Ma site ná mmalite, ọ dịbeghị otú ahụ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, nkwenye a abụghị otú ihe si dị site ná mmalite nke okike.
    reason: cross_reference
  - marker: b
    text: N’ụzọ nkịtị, “chụpụ ndị nwunye unu”; n’ebe a, ihe ọ pụtara bụ ịgba alụkwaghịm.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ọ sịrị ha
  rationale: A sụgharịrị historical present λέγει n’oge gara aga dịka akụkọ Igbo si aga n’ụzọ eke; αὐτοῖς pụtara ‘ha.’
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: Ọ bụ n’ihi isiike obi unu
  rationale: Nke a na-egosipụta ihe kpatara nkwenye ahụ ma na-edobe ihe atụ Baịbụl banyere obi siri ike, n’enweghị ịkọwa ya gabiga ókè.
- source_word: ἐπέτρεψεν ὑμῖν
  choice: ka Mosis ji kwe ka unu
  rationale: ‘Kwe ka’ na-egosi ikwe ikike ma ọ bụ nnabata, ọ bụghị inye iwu; ‘ji’ na-ejikọta ya n’ụzọ Igbo na ihe kpatara ya.
- source_word: ἀπολῦσαι τὰς γυναῖκας ὑμῶν
  choice: gbaa ndị nwunye unu alụkwaghịm
  rationale: N’ọnọdụ alụmdi na nwunye a, ἀπολῦσαι pụtara ịgba alụkwaghịm, ebe γυναῖκας pụtara ndị nwunye.
- source_word: ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως
  choice: Ma site ná mmalite, ọ bụghị otú ahụ ka ọ dị
  rationale: Nke a na-edobe ntụaka dị mkpirikpi banyere mmalite na ọnọdụ nke perfect γέγονεν, n’enweghị ịgbakwunye nkọwa ozizi n’ahịrịokwu ahụ.
theological_decisions:
- issue: Ma ihe Mosis mere bụ iwu ka ọ bụ nkwenye e nyere
  choice: Mosis kwe ka unu
  alternative: Mosis nyere unu iwu
  rationale: ἐπέτρεψεν pụtara ikwe ka e mee ihe, ọ bụghị inye iwu ma ọ bụ ikwado ya dịka ihe kachasị mma.
- issue: Ma a ga-eme ka ntụaka Jizọs banyere okike pụta ìhè karịa okwu Grik
  choice: Ma site ná mmalite, ọ bụghị otú ahụ ka ọ dị
  alternative: Ma nke a abụghị atụmatụ Chineke site ná mmalite
  rationale: Nhọrọ ahụ na-edobe okwu na mgbagwoju anya nke isi mmalite; a naghị etinye ‘atụmatụ Chineke’ n’ahịrịokwu ebe Grik ekwughị ya kpọmkwem.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a ma dị ugwu. A họọrọ ‘isiike obi’ iji chekwaa ihe atụ nke okwu Grik, ‘kwe ka’ iji zere ime nkwenye ka ọ bụrụ iwu, na ‘gbaa ... alụkwaghịm’ maka nghọta doro anya n’okwu alụmdi na nwunye.
