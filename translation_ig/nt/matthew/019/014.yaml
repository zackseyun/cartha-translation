source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: ig
  text: Ma Jizọs sịrị, “Kwe ka ụmụaka ahụ bịakwute m, unu egbochikwala ha ịbịakwute m; n’ihi na alaeze eluigwe bụ nke ndị dị ka ndị a.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndị dị ka ndị a” nwere ike izo ọ bụghị naanị ụmụaka ndị nọ ebe ahụ, kamakwa ndị ọzọ dị ụdị ha. Okwu ahụ akọwaghị kpọmkwem àgwà ma ọ bụ ọnọdụ e ji atụnyere ha.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: Ἄφετε
  choice: Kwe ka
  rationale: N’ebe a, ἀφίημι bụ iwu nke pụtara inye ohere, ọ bụghị ịhapụ mmadụ ka ọ pụọ.
- source_word: τὰ παιδία
  choice: ụmụaka ahụ
  rationale: Nke a na-egosi ụmụaka ndị nọ n’ebe ahụ n’enweghị ịgbakwụnye na ha dị nnọọ nta karịa ihe okwu Grik kwuru.
- source_word: μὴ κωλύετε
  choice: unu egbochikwala
  rationale: Nke a na-eburu echiche nke igbochi ma ọ bụ ime ka mmadụ ghara ime ihe, ma ọ naghị akọwapụta karịa isi mmalite ma igbochi ahụ amalitelarị.
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: ha bịakwute m
  rationale: Mgbe e jikọtara ya na ‘unu egbochikwala,’ nke a bụ ụzọ Igbo si ekwu nke ọma na a gaghị egbochi ha ịbịakwute Jizọs.
- source_word: τῶν γὰρ τοιούτων
  choice: ndị dị otu a
  rationale: Nhọrọ a na-ezo aka n’ụmụaka nọ ebe ahụ ma na-emekwa ka o kwe omume na ọ na-agụnye ndị ọzọ yiri ha n’ụdị a na-akọwaghị kpọmkwem.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: alaeze eluigwe
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa ụzọ e si asụpụta ahịrịokwu Matiu ji eme ihe ugboro ugboro.
- source_word: ἐστὶν
  choice: bụ nke
  rationale: ‘Bụ nke’ na-eme ka njikọ genitive ahụ doo anya n’Igbo dị ugbu a, n’enweghị ịgbakwụnye nkọwa gbasara otú ndị ahụ si bata n’alaeze ahụ.
theological_decisions:
- issue: Ma okwu Jizọs ọ na-ezo naanị n’ụmụaka nkịtị ka ọ na-agụnyekwa ndị nwere ụdị ọnọdụ ma ọ bụ àgwà ha
  choice: ndị dị otu a
  alternative: ụmụaka ndị a; ndị yiri ụmụaka
  rationale: Okwu Grik τοιούτων na-agafe naanị ụmụaka ndị nọ n’ebe ahụ, ma ọ kọwaghị kpọmkwem ihe e ji atụnyere ndị ọzọ na ha. ‘Ndị dị otu a’ na-edobe nghọta abụọ ahụ n’emebighị esemokwu nkà mmụta okpukpe dị n’okwu ahụ.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị mfe nghọta ma nwee ugwu. E ji ‘unu’ gosipụta na iwu ahụ bụ maka ọtụtụ mmadụ. E debeghị akara ntụaka Bekee ndị e kenyere n’ebe na-ekwekọghị na ọdịnaya ha; otu ntụaka [a] ka ejiri mee ka nsụgharị literal na ambiguity nke τοιούτων pụta ìhè.
