revisions:
- from: Ma Jizọs sịrị, “Kwe ka ụmụaka ahụ bịakwute m; unu egbochikwala ha, n’ihi na alaeze eluigwe bụ nke ndị dị otu a.”[a]
  to: Ma Jizọs sịrị, “Kwe ka ụmụaka ahụ bịakwute m, unu egbochikwala ha ịbịakwute m; n’ihi na alaeze eluigwe bụ nke ndị dị ka ndị a.”[a]
  rationale: The revision restores the explicit “coming to me” governed by the prohibition, improves the naturalness of the expression corresponding to τοιούτων, and replaces the redundant footnote with one that directly explains the preserved ambiguity. It does not define the quality represented by the children or introduce an interpretive theological conclusion.
