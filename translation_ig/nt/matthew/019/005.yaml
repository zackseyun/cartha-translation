id: MAT.19.5
reference: Matthew 19:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: ig
  text: wee sị, “N’ihi nke a, nwoke ga-ahapụ nna ya na nne ya, a ga-ejikọta ya na nwunye ya[a], ha abụọ ga-aghọ otu anụ ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a ga-eme ka ya na nwunye ya dị n’otu,” ma ọ bụ “ọ ga-arapara n’ahụ nwunye ya.” Ngwaa Grik a na-egosi njikọ chiri anya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: N’ihi nke a
  rationale: Ọ bụ okwu Igbo doro anya nke na-egosi ihe kpatara ihe a na-ekwu, ma na-echekwa ike okwu Grik ahụ.
- source_word: καταλείψει
  choice: ga-ahapụ
  rationale: Ọ na-egosi ọdịnihu dị n’okwu Grik ahụ n’Igbo nke oge a na-aghọta ngwa ngwa.
- source_word: ἄνθρωπος
  choice: nwoke
  rationale: N’ebe a, okwu ahụ na-ekwu kpọmkwem banyere nwoke nke a kpọrọ nwunye ya aha, ọ bụghị mmadụ n’ozuzu.
- source_word: κολληθήσεται
  choice: e jikọtakwa ya na
  rationale: Nhọrọ a na-egosi njikọ chiri anya ma na-echekwa ụdị nnara-eme nke ngwaa Grik ahụ, n’enweghị ịgbakwunye naanị mmetụta uche.
- source_word: γυναικὶ αὐτοῦ
  choice: nwunye ya
  rationale: N’ọnọdụ alụmdi na nwunye a, γυνή pụtara nwunye, ọ bụghị naanị nwanyị.
- source_word: οἱ δύο
  choice: ha abụọ
  rationale: Ọ na-edowe okwu Grik ahụ nke kpọrọ mmadụ abụọ ahụ aha n’ụzọ doro anya.
- source_word: εἰς σάρκα μίαν
  choice: aghọọ otu anụ ahụ
  rationale: Ọ na-egosi nsonaazụ nke ịbụ otu ma na-echekwa ihe oyiyi anụ ahụ nke okwu sitere na Jenesis.
theological_decisions:
- issue: Okwu metụtara nwoke na nwanyị n’okwu e hotara banyere alụmdi na nwunye
  choice: nwoke ... nwunye ya
  alternative: mmadụ ... di ma ọ bụ nwunye ya
  rationale: Ihe e hotara na Jenesis na-ekwu kpọmkwem banyere nwoke na nwunye ya; idebe nke a na-esochi ihe isi mmalite kwuru n’ebughị ozizi ọzọ bata.
- issue: Okwu ihe atụ banyere njikọ alụmdi na nwunye
  choice: ha abụọ aghọọ otu anụ ahụ
  alternative: ha abụọ ga-abụ otu anụ ahụ
  rationale: “Aghọọ” na-egosi mmegharị gaa na nsonaazụ ọhụrụ nke ἔσονται ... εἰς, ma na-echekwa ịdị arọ nke okwu ahụ n’enweghị nkọwa gbakwunyere.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro okwu ahụ ka ọ bụrụ nke na-aga were were n’Igbo, ma chekwaa nkwughachi sitere na Jenesis na ihe okwu Grik ahụ pụtara.
