review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the causal formula, the male-specific marriage citation, leaving father and mother, and the becoming-one-flesh result. However, “e jikọtakwa ya na” adds an unsupported additive sense through -kwa and is less natural for the Greek future passive.
  naturalness: The proposed revision uses fluent Standard Igbo. “A ga-ejikọta ya na nwunye ya” naturally expresses the future passive sense, and “ha abụọ ga-aghọ” makes the future/result force explicit.
  terminology: “Nwoke … nwunye ya” correctly retains the sexed terms of the Genesis citation. “Otu anụ ahụ” suitably preserves the established marital-union idiom without doctrinal expansion.
  issues:
  - severity: medium
    issue: The verbal form “e jikọtakwa ya na” contains the additive particle -kwa.
    rationale: κολληθήσεται means “will be joined/attached”; it does not contain an “also” element. Removing -kwa avoids adding meaning and improves idiomatic flow.
  - severity: low
    issue: The final clause lacks an explicit future marker.
    rationale: Although context can imply futurity, “ha abụọ ga-aghọ” clearly represents ἔσονται εἰς (“will become”) in modern Standard Igbo.
  - severity: low
    issue: The footnote's first alternative is somewhat interpretive and its second needs a future form consistent with the verse.
    rationale: Recasting the alternatives retains their lexical purpose while making the Igbo idiomatic and aligned with the future verbal construction.
