id: MAT.19.26
reference: Matthew 19:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: ig
  text: Ma Jizọs lere ha anya wee sị ha, “N’ebe ụmụ mmadụ nọ, nke a agaghị ekwe omume; ma n’ebe Chineke nọ, ihe niile kwere omume.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: lere ha anya
  rationale: Nke a na-egosi na Jizọs tụgharịrị lee ha kpọmkwem, n’asụsụ Igbo dị mfe ma bụrụkwa nke eke.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche dị n’etiti nchegbu ndị na-eso ụzọ na azịza Jizọs.
- source_word: εἶπεν αὐτοῖς
  choice: wee sị ha
  rationale: A hapụghị αὐτοῖς; ‘ha’ na-egosi kpọmkwem ndị ọ gwara okwu.
- source_word: παρὰ ἀνθρώποις
  choice: N’ebe ụmụ mmadụ nọ
  rationale: παρά tinyere dative na-egosi ọnọdụ ma ọ bụ ihe dị n’aka otu onye; ‘ụmụ mmadụ’ na-egosi mmadụ niile n’enweghị ịkpọ naanị ndị nwoke.
- source_word: τοῦτο
  choice: nke a
  rationale: Ọ na-arụtụ aka n’ihe a ka na-ekwu maka ya n’akụkọ ahụ.
- source_word: ἀδύνατόν ἐστιν
  choice: agaghị ekwe omume
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụ nke eke isi kwuo na ihe apụghị ime.
- source_word: παρὰ δὲ θεῷ
  choice: ma n’ebe Chineke nọ
  rationale: A na-emegharị usoro παρά + dative iji chekwaa ntụnyere dị n’etiti mmadụ na Chineke.
- source_word: πάντα δυνατά
  choice: ihe niile ga-ekwe omume
  rationale: Ọ na-echekwa echiche plural πάντα ma na-enye nkwupụta ahụ n’ụzọ Igbo kwụ ọtọ.
theological_decisions:
- issue: Ihe ἀνθρώποις pụtara n’okwu metụtara mmadụ niile
  choice: ụmụ mmadụ
  alternative: ndị mmadụ; mmadụ
  rationale: Ọ bụ ezie na okwu Grik ahụ dị n’ụdị masculine plural, ebe a ọ pụtara mmadụ niile. ‘Ụmụ mmadụ’ na-egosipụta nke ahụ nke ọma n’Igbo ma ghara ime ka a ghọta ya dị ka naanị ndị nwoke.
- issue: Oke nkwupụta πάντα δυνατά
  choice: ihe niile ga-ekwe omume
  alternative: ihe ọ bụla ga-ekwe omume
  rationale: A hapụrụ nkwupụta ahụ n’obosara ya dịka Grik si dị, n’enweghị ịgbakwunye nkọwa ga-amachi ya ma ọ bụ mee ka esemokwu nkà mmụta okpukpe dị n’okwu ahụ laa n’iyi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro ‘N’ebe … nọ’ chekwaa ntụnyere na ụda okwu Grik ahụ.
