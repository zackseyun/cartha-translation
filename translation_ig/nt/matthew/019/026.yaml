- from: Ma Jizọs lere ha anya wee sị ha, “N’ebe ụmụ mmadụ nọ, nke a agaghị ekwe omume; ma n’ebe Chineke nọ, ihe niile ga-ekwe omume.”
  to: Ma Jizọs lere ha anya wee sị ha, “N’ebe ụmụ mmadụ nọ, nke a agaghị ekwe omume; ma n’ebe Chineke nọ, ihe niile kwere omume.”
  rationale: The revision changes only the final verbal form, removing an unwarranted future nuance while preserving the draft’s faithful, natural parallel structure and its inclusive rendering of ἀνθρώποις.
