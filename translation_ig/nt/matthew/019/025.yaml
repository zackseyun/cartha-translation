review_pass:
  verdict: revise
  source_fidelity: Mkparịta ụka oge mbụ, oke iju anya, na ajụjụ nkwubi okwu ahụ dabara n'ederede Grik. Ma «Ònyezi pụrụ ịzọpụta?» na-eji ịzọpụta n'ụdị ngwaa na-arụ ọrụ n'ebe a, nke na-adị ka «onye pụrụ ịzọpụta mmadụ?»; σωθῆναι bụ infinitive passive, «ka a zọpụta / inweta nzọpụta».
  naturalness: «Mgbe ndị na-eso ụzọ nụrụ nke a, o juru ha anya nke ukwuu, ha wee sị» bụ Standard Igbo dị nro ma doo anya. «Ònyezi pụrụ inweta nzọpụta?» na-ekwu nke ọma n'Igbo ugbu a, ma na-ezere echiche na onye a na-ajụ bụ onye na-azọpụta ndị ọzọ.
  terminology: E debeela «ndị na-eso ụzọ» maka μαθηταί na «nzọpụta» maka σωθῆναι n'ọnọdụ gbasara ịbanye n'alaeze. «Inweta nzọpụta» na-egosi na nzọpụta bụ ihe a na-enweta, ọ bụghị ọrụ onye ahụ na-arụ n'ahụ onye ọzọ; ọ naghị akọwa ụzọ e si enweta ya.
  issues:
  - severity: high
    issue: «Ònyezi pụrụ ịzọpụta?» anaghị echekwa olu passive nke σωθῆναι.
    rationale: N'Igbo, ịzọpụta na-adịkarị ka ngwaa transitive nke pụtara ịzọpụta mmadụ ọzọ. Ajụjụ Grik na-ajụ onye pụrụ ịbụ onye a zọpụta, ọ bụghị onye pụrụ ịzọpụta.
  - severity: low
    issue: «ya» n'«ndị na-eso ụzọ ya» bụ mgbakwunye na-adịghị na amaokwu Grik.
    rationale: Ihe gbara ya gburugburu na-egosi na ha bụ ndị na-eso ụzọ Jizọs, ma iwepu «ya» na-eme ka ntụgharị ahụ soro ederede isi nso karịa n'enweghị mfu nghọta.
  revised_text: Mgbe ndị na-eso ụzọ nụrụ nke a, o juru ha anya nke ukwuu, ha wee sị, “Ònyezi pụrụ inweta nzọpụta?”
