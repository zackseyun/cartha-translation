  rationale: 'A gbanwere naanị akụkụ ajụjụ ahụ iji chekwaa ihe passive σωθῆναι pụtara n''asụsụ Igbo ebumpụta ụwa: «inweta nzọpụta». E wepụrụkwa «ya», nke na-adịghị n''ederede Grik, ebe ihe gbara amaokwu ahụ gburugburu ka na-eme ka ndị a na-ekwu maka ha doo anya.'
