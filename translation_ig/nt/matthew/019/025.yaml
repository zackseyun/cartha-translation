base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: ig
  text: Mgbe ndị na-eso ụzọ nụrụ nke a, o juru ha anya nke ukwuu, ha wee sị, “Ònyezi pụrụ inweta nzọpụta?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Mgbe ... nụrụ nke a
  rationale: Aorist participle ahụ na-egosi ihe mere tupu mmeghachi omume ha; nkebiokwu oge a bụ Igbo ebumpụta ụwa. E tinyere ‘nke a’ site n'ihe gbara amaokwu ahụ gburugburu, ya bụ okwu Jizọs kwuru tupu ya.
- source_word: δὲ
  choice: '[njikọ pụtara ìhè site na usoro ahịrịokwu]'
  rationale: δέ na-egosi ịga n'ihu ma ọ bụ obere ọdịiche; n'Igbo, ‘Mgbe...’ na-ebufe mgbanwe ahụ nke ọma na-enweghị ịgbakwunye njikọ ọzọ.
- source_word: οἱ μαθηταὶ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị na-amụ ihe n'aka Jizọs ma na-eso ya. ‘Ya’ na-eme ka onye ha na-eso doo anya site n'ihe gbara okwu ahụ gburugburu.
- source_word: ἐξεπλήσσοντο
  choice: o juru ha anya
  rationale: Nke a na-egosipụta mmeghachi omume siri ike nke ihe ha nụrụ kpatara; ọ bụkwa ụzọ Igbo ebumpụta ụwa si kwuo ịbụ onye ihe tụrụ n'anya.
- source_word: σφόδρα
  choice: nke ukwuu
  rationale: Ọ na-echekwa ike nke okwu Grik nke na-eme ka iju anya ha sie nnọọ ike.
- source_word: λέγοντες
  choice: ha wee sị
  rationale: Participial speech ahụ ghọrọ ngwaa zuru ezu n'Igbo maka akụkọ na-aga were were, na-enweghị ịgbanwe ihe ọ pụtara.
- source_word: Τίς ἄρα
  choice: Ònyezi
  rationale: '‘Ònye’ na-ajụ maka mmadụ, ebe ‘-zi’ na-ebufe nkwubi okwu na ihe ijuanya dị na ἄρα: ‘ònyekwanụ, n''ihi ihe a?’'
- source_word: δύναται
  choice: pụrụ
  rationale: Ọ na-egosi ikike ma kwekọọ n'okwu Igbo dị mfe ma dị ugbu a.
- source_word: σωθῆναι
  choice: ịzọpụta
  rationale: 'N''usoro ajụjụ ‘Ònye pụrụ ịzọpụta?’, infinitive a na-arụ ọrụ n''ụzọ passive n''ihe ọ pụtara: ònye pụrụ inweta nzọpụta. Okwu a na-echekwa ibu mmụta okpukpe nke nzọpụta n''ihe gbasara ịbanye n''alaeze, n''agbanyeghị na ọdịdị ngwaa Igbo anaghị egosipụta passive ahụ kpọmkwem.'
theological_decisions:
- issue: Ihe σωθῆναι pụtara n'ebe a
  choice: ịzọpụta
  alternative: ịnapụta
  rationale: Ihe ndị gbara ya gburugburu bụ ịbanye n'alaeze na ihe isi ike onye ọgaranya nwere; ya mere ajụjụ ahụ gbasara nzọpụta n'uju, ọ bụghị nanị nzọpụta pụọ n'ihe ize ndụ nke oge a. A hapụrụ ụzọ nzọpụta ahụ akọwaghị, dị ka ederede Grik si mee.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘ndị na-eso ụzọ ya’ mee ka μαθηταί bụrụ okwu ndị nkịtị ga-aghọta ozugbo; ‘Ònyezi’ na-ebufe ma nkwubi okwu ma ihe ijuanya dị na ἄρα. Enweghị akara nkọwa ala peeji n'ihi na ọ dịghị nke achọrọ n'amaokwu a.
