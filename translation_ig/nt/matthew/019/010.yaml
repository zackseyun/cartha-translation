revisions:
- from: Ndị na-eso ụzọ ya sịrị ya[a], “Ọ bụrụ na ọnọdụ nwoke na nwunye ya dị otu a, ịlụ nwanyị abaghị uru.”
  to: Ndị na-eso ụzọ ya sịrị ya, “Ọ bụrụ na otu a ka ọnọdụ[a] dị n’etiti nwoke na nwunye ya, ịlụ nwanyị abaghị uru.”
  rationale: The revision improves the clarity and idiomatic flow of the marital-situation phrase and moves the footnote marker to “ọnọdụ,” the word whose lexical range the note explains. It retains the source’s generic masculine marital framing and the non-absolute, pragmatic force of οὐ συμφέρει.
  reviewer_model: gpt-5.6-terra
