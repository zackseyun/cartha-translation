id: MAT.19.10
reference: Matthew 19:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: ig
  text: Ndị na-eso ụzọ ya sịrị ya, “Ọ bụrụ na otu a ka ọnọdụ[a] dị n’etiti nwoke na nwunye ya, ịlụ nwanyị abaghị uru.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ bụrụ na otu a ka okwu dị n’etiti nwoke na nwunye ya.” Nkebiokwu Grik ahụ dị mkpirikpi; okwu a sụgharịrị “ọnọdụ” nwekwara ike ịpụta “okwu” ma ọ bụ “ihe a na-atụle.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: sịrị ya
  rationale: Oge ugbu a Grik a bụ oge ugbu a e ji akọ akụkọ; oge gara aga bụ ụzọ Igbo si akọ ya nke ọma.
- source_word: μαθηταί
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị na-amụ ihe n’aka Jizọs ma na-eso ya.
- source_word: Εἰ οὕτως ἐστὶν ἡ αἰτία
  choice: Ọ bụrụ na ọnọdụ ... dị otu a
  rationale: Nke a na-egosipụta ọnọdụ ma ọ bụ okwu a na-atụle, ọ bụghị naanị ihe kpatara ya; ọ na-echekwakwa mkpirisi okwu Grik ahụ.
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: nwoke na nwunye ya
  rationale: Ihe a na-ekwu n’ebe a bụ nwoke n’ihe metụtara nwunye ya; ‘nwunye’ dabara n’ọnọdụ alụmdi na nwunye karịa ‘anyị nwaanyị.’
- source_word: οὐ συμφέρει
  choice: abaghị uru
  rationale: Nkebiokwu Igbo a na-egosi na ihe ahụ adịghị aba uru ma ọ bụ enye onye ahụ ọganihu, dị ka συμφέρει si pụta n’ebe a.
- source_word: γαμῆσαι
  choice: ịlụ nwanyị
  rationale: N’ihi na okwu ahụ na-ele ọnọdụ ahụ anya site n’akụkụ nwoke na nwunye ya, ‘ịlụ nwanyị’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
theological_decisions:
- issue: Asụsụ metụtara nwoke na nwaanyị n’okwu ἀνθρώπου ... γυναικός
  choice: nwoke na nwunye ya
  alternative: mmadụ na di ma ọ bụ nwunye ya
  rationale: Isiokwu gbara amaokwu ahụ gburugburu bụ alụmdi na nwunye nwoke na nwaanyị, Grik ahụ kpọkwara nwoke na nwunye aha. Ya mere, a hapụghị ọdịiche nwoke na nwaanyị dị n’isi mmalite.
- issue: Ihe ἡ αἰτία pụtara n’ebe a
  choice: ọnọdụ
  alternative: okwu
  rationale: ‘Ọnọdụ’ na-egosi ọnọdụ alụmdi na nwunye ndị na-eso ụzọ ahụ na-ekwu maka ya, ma ihe Grik ahụ pụtara nwekwara ike ịbụ ‘okwu’ ma ọ bụ ‘ihe a na-atụle’; e debere nke a n’okpuru peeji kama idozi ihe ahụ n’otu ụzọ naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Ndị na-eso ụzọ ya’ bụ okwu Baịbụl a maara nke ọma; ‘abaghị uru’ na-ezere okwu ochie ma na-edobe ike okwu συμφέρει.
