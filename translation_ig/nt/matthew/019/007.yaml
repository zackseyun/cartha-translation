id: MAT.19.7
reference: Matthew 19:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: ig
  text: Ha sịrị ya, “Gịnị mere Mosis ji nye iwu ka e nye ya akwụkwọ ịgba alụkwaghịm, ma chụpụkwa ya[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ma gbaa ya alụkwaghịm.” Ngwaa Grik ahụ nwere ike ịpụta “ịchụpụ,” ma n'ebe a ọ bụ okwu e ji akọwa ịgba alụkwaghịm.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Ha sịrị ya
  rationale: E ji oge gara aga sụgharịa present akụkọ Grik ka akụkọ ahụ daa nke ọma n'Igbo.
- source_word: Τί οὖν
  choice: Gịnị mere ... ji
  rationale: N'ebe a ajụjụ ahụ bụ ihe mgbagha sitere n'okwu Jizọs kwuru tupu ya; usoro a na-egosipụta ‘Why then’ n'Igbo nkịtị.
- source_word: Μωϋσῆς ἐνετείλατο
  choice: Mosis ji nye iwu
  rationale: ἐντέλλομαι pụtara inye iwu; a hapụrụ ike okwu ndị na-ajụ ajụjụ ahụ kama itinye ‘kwere’ nke ga-ebute nkọwa amaokwu na-esote n'oge.
- source_word: δοῦναι βιβλίον ἀποστασίου
  choice: ka e nye ya akwụkwọ ịgba alụkwaghịm
  rationale: Nkebi a na-ezo aka n'akwụkwọ iwu e ji kwado ịgba alụkwaghịm; ‘akwụkwọ ịgba alụkwaghịm’ doro onye Igbo nke oge a anya.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: ma chụpụkwa ya
  rationale: ἀπολύω nwere echiche izipụ ma ọ bụ ịchụpụ nwunye, nke n'ọnọdụ a bụ ịgba ya alụkwaghịm; okwu a na-echekwa onyonyo okwu Grik.
theological_decisions:
- issue: Ma a ga-asụgharị ἐνετείλατο dị ka iwu ka okwu ahụ kwekọọ ozugbo na mgbazi Jizọs n'amaokwu na-esote
  choice: nye iwu
  alternative: kwere ka e mee
  rationale: Grik kwuru kpọmkwem ‘nyere iwu.’ Amaokwu a kwesịrị idobe otú ndị jụrụ ajụjụ si kọwaa okwu Mosis, n'etinyeghị mgbazi Jizọs nke amaokwu na-esote n'ime ya.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E jighị okwu ụka pụrụ iche. ‘Akwụkwọ ịgba alụkwaghịm’ na-egosipụta akwụkwọ iwu ahụ, ebe ‘chụpụkwa ya’ na-echekwa ọdịiche na mgbagwoju okwu dị na ἀπολύω.
