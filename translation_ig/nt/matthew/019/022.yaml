  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: ig
  text: Ma mgbe nwa okorobịa ahụ nụrụ okwu a[a], o ji mwute[b] pụọ, n’ihi na o nwere ọtụtụ ihe onwunwe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘ihe a o kwuru.’ N’ebe a, okwu Grik ahụ na-ezo aka n’ihe Jizọs kwuru tupu nke a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘n’ọnọdụ mwute.’ Okwu Grik ahụ na-egosi na ọ nọ na mwute mgbe ọ na-apụ.
    reason: lexical_alternative
  - marker: c
    text: 'Nsụgharị ọdịnala ụfọdụ na-ekwu ‘nnukwu ihe onwunwe.’ Ma n’ụzọ nkịtị, okwu Grik ahụ na-emesi ọnụọgụ ike: ‘ọtụtụ ihe onwunwe.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: mgbe ... nụrụ
  rationale: A sụgharịrị participle aorist ahụ dị ka nkebiokwu oge n’Igbo, iji gosi na ọpụpụ ya sochiri ịnụ okwu ahụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche n’akụkọ ahụ, ka nzaghachi ọjọọ nwa okorobịa ahụ pụta ìhè.
- source_word: νεανίσκος
  choice: nwa okorobịa
  rationale: Okwu Grik a pụtara nwa okorobịa; etinyeghị ‘onye ọchịchị,’ n’ihi na nke ahụ adịghị n’okwu Matiu n’amaokwu a.
- source_word: τὸν λόγον
  choice: okwu a
  rationale: N’ebe a λόγος na-ezo aka n’ihe Jizọs kwuru n’amaokwu bu ụzọ; ‘okwu a’ dị mfe ma nọgide nso n’usoro Grik.
- source_word: ἀπῆλθεν
  choice: pụọ
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke ebumpụta ụwa isi kwuo na ọ hapụrụ ebe ahụ.
- source_word: λυπούμενος
  choice: ji mwute
  rationale: Participle dị ugbu a na-akọ ọnọdụ ya mgbe ọ na-apụ; ‘ji mwute’ na-egosi na mwute so ya n’ọpụpụ ahụ.
- source_word: ἦν γὰρ ἔχων
  choice: n’ihi na o nwere
  rationale: Periphrastic imperfect ahụ na-egosi ọnọdụ na-aga n’ihu nke inwe ihe; Igbo na-egosipụta nke a nke ọma site na ‘o nwere.’
- source_word: κτήματα πολλά
  choice: ọtụtụ ihe onwunwe
  rationale: κτήματα bụ ihe mmadụ nwere ma ọ bụ akụnụba ya, πολλά na-emesi ọnụọgụ ike; ya mere ‘ọtụtụ ihe onwunwe’ ziri ezi karịa okwu ga-egosi naanị ịdị ukwuu.
theological_decisions:
- issue: Ma a ga-akpọ nwa okorobịa ahụ ‘onye ọchịchị’ dịka akụkọ yiri nke a n’akwụkwọ Luk si kwuo
  choice: nwa okorobịa
  alternative: nwa okorobịa onye ọchịchị
  rationale: Amaokwu Grik nke Matiu kpọrọ ya naanị νεανίσκος. Ịgbakwunye ‘onye ọchịchị’ ga-abụ ijikọta akụkọ Matiu na nke Luk kama ịsụgharị amaokwu a kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro akụkọ ebumpụta ụwa n’Igbo, ma chekwaa ihe dị iche n’etiti ‘ọtụtụ’ na ‘nnukwu,’ nakwa ọnọdụ mwute nke so ọpụpụ nwa okorobịa ahụ.
