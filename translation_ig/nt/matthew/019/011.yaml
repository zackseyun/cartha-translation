    issue: The expression “Okwu nnara ahụ” in footnote b is not natural Standard Igbo grammatical terminology.
    rationale: “Nkebiokwu nnara a” more naturally identifies the passive phrase being discussed and avoids suggesting that “okwu nnara” is a standard label.
  - severity: low
