  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: ig
  text: Ma ọ sịrị ha, “Ọ bụghị mmadụ niile nwere ike ịnabata okwu a[a], kama ọ bụ naanị ndị e nyere ya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya dịka “okwu a e kwuru” ma ọ bụ “nkuzi a.”
    reason: lexical_alternative
  - marker: b
    text: Nkebiokwu nnara a, “e nyere ya,” nwere ike ịpụta na ọ bụ Chineke nyere ya, ma Grik ahụ ekwughị kpọmkwem onye nyere ya.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: ọ sịrị
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke dabara n’akụkọ si asụ aorist nke λέγω; ọ naghị etinye echiche ‘zara’ nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: Οὐ πάντες
  choice: Ọ bụghị mmadụ niile
  rationale: Ọ na-egosi n'ụzọ doro anya na ihe a anaghị emetụta mmadụ niile, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: χωροῦσι
  choice: nwere ike ịnabata
  rationale: N’ọnọdụ a, χωρέω pụtara inwe ohere n’ime onwe mmadụ ịnata ma ọ bụ ịnabata okwu ahụ; ntụgharị a na-enye nghọta ahụ n’Igbo eke na-enweghị ịsụ ya n’ụzọ siri ike dịka ‘imeere ohere.’
- source_word: τὸν λόγον τοῦτον
  choice: okwu a
  rationale: λόγος ebe a na-ezo aka n’okwu ma ọ bụ nkuzi e kwuru ozugbo tupu ya; ‘okwu a’ na-echekwa njikọ okwu ahụ ma bụrụkwa Igbo doro anya.
- source_word: ἀλλ’ οἷς
  choice: kama ọ bụ naanị ndị
  rationale: ‘Naanị’ na-eme ka mmachi dị na ntụnyere ahụ pụta ìhè n’Igbo, dịka ἀλλά na nkebi okwu mmekọrịta a si arụ ọrụ.
- source_word: δέδοται
  choice: e nyere ya
  rationale: Nke a na-echekwa olu nnara nke perfect passive δίδωμι na nsonaazụ onyinye ahụ ka dị ugbu a, n’agbanyeghị na onye nyere ya ekwughị.
theological_decisions:
- issue: Onye a na-eche na ọ bụ ya nyere ihe ahụ n’okwu nnara ‘e nyere ya’
  choice: E debere okwu ahụ n’olu nnara n’akpọghị Chineke aha dịka onye nyere ya.
  alternative: kama ọ bụ naanị ndị Chineke nyere ya
  rationale: Ọtụtụ ndị nwere ike ịghọta nke a dịka olu nnara na-ezo aka n’omume Chineke, ma Grik ahụ akpọghị onye mere omume ahụ aha. Ịhapụ ya n’olu nnara na-echekwa nghọta na esemokwu dị n’ederede ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro okwu Igbo eke, na-echekwa olu nnara na nghọta na onye nyere ihe ahụ ekwughị kpọmkwem.
