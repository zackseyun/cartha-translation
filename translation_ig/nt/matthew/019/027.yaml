review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders Peter’s response, the attention-getting ἰδού (“Lee”), the comprehensive πάντα (“ihe niile”), and the future-oriented question. However, the coordination of the two completed actions is missing: as written, “anyị ahapụla ihe niile soro gị” can be read as though “soro gị” modifies “ihe niile,” rather than stating that the disciples both left everything and followed Jesus.'
  naturalness: 'Adding “ma” produces clear, natural Standard Igbo coordination: “anyị ahapụla ihe niile ma soro gị.” The remaining phrasing is concise and appropriately respectful for direct speech.'
  terminology: “Pita,” “Lee,” “ahapụla ihe niile,” and “Gịnịkwa ka anyị ga-enweta?” are suitable Standard Igbo choices. “Ga-enweta” naturally conveys the open-ended sense of τί ἄρα ἔσται ἡμῖν without specifying the nature of what is anticipated.
  issues:
  - severity: medium
    issue: Missing coordinator between “ahapụla ihe niile” and “soro gị.”
    rationale: Greek has two coordinated verbs, ἀφήκαμεν ... καὶ ἠκολουθήσαμέν. Without an Igbo coordinator, the draft is structurally ambiguous and does not clearly state the second action, following Jesus.
  revised_text: Mgbe ahụ, Pita zara ya, sị, “Lee, anyị ahapụla ihe niile ma soro gị. Gịnịkwa ka anyị ga-enweta?”
  revised_footnotes: []
  revision_rationale: The revision adds only the necessary coordinating conjunction “ma” and punctuation after the introductory phrase, preserving the source’s meaning, ambiguity concerning what will come to the disciples, and the draft’s modern Standard Igbo register.
