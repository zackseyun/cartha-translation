  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: ig
  text: Mgbe ahụ, Pita zara ya, sị, “Lee, anyị ahapụla ihe niile ma soro gị. Gịnịkwa ka anyị ga-enweta?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu e ji adọta uche onye na-ege ntị; “Lee” bụ okwu Igbo doro anya ma kwekọọ n’ụdị okwu Pita.
- source_word: ἀφήκαμεν πάντα
  choice: anyị ahapụla ihe niile
  rationale: Na-egosipụta omume mere eme nke ọnọdụ ya ka dị ugbu a, ma na-edobe oke okwu πάντα, “ihe niile.”
- source_word: ἠκολουθήσαμέν σοι
  choice: soro gị
  rationale: A sụgharịrị ya n’ụzọ Igbo na-aga were were; onye mere omume ahụ ka bụ “anyị” sitere n’akụkụ okwu gara aga.
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: Gịnịkwa ka anyị ga-enweta?
  rationale: N’ebe a, εἶναι + dative na-ajụ ihe ga-abụ nke ha ma ọ bụ ihe ga-adịrị ha; “anyị ga-enweta” na-ekwupụta echiche ahụ n’Igbo nkịtị n’enweghị ịkọwa kpọmkwem ihe ahụ.
theological_decisions:
- issue: Ihe Pita tụrụ anya ya n’ihi iso Jizọs
  choice: Gịnịkwa ka anyị ga-enweta?
  alternative: Gịnịzi ga-adịrị anyị?
  rationale: Nhọrọ a na-edobe ajụjụ Pita gbasara ihe ga-abịara ha, ma ọ naghị akọwa ya dị ka ụgwọ ọrụ, nzọpụta, ma ọ bụ uru ihe onwunwe.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere usoro mkparịta ụka ahụ nkenke, dịka isi mmalite Grik si dị.
