- from: Mgbe ahụ Pita zara ya, sị, “Lee, anyị ahapụla ihe niile soro gị. Gịnịkwa ka anyị ga-enweta?”
  to: Mgbe ahụ, Pita zara ya, sị, “Lee, anyị ahapụla ihe niile ma soro gị. Gịnịkwa ka anyị ga-enweta?”
  rationale: The revision adds only the necessary coordinating conjunction “ma” and punctuation after the introductory phrase, preserving the source’s meaning, ambiguity concerning what will come to the disciples, and the draft’s modern Standard Igbo register.
