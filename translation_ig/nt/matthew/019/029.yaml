review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the complete Greek list, the motive phrase “for the sake of my name,” the hundredfold recompense, and inheriting eternal life. The bare Igbo nouns naturally cover the Greek plural forms where applicable.
  naturalness: The pronoun in “ga-anata ya okpukpu narị” has no clear antecedent and makes the recompense clause less idiomatic. Omitting “ya” produces a clear, natural expression.
  terminology: Key family terms, “aha m,” “okpukpu narị,” and “ndụ ebighị ebi” are suitable Standard Igbo renderings. “Ketakwa” appropriately preserves the inheritance imagery of κληρονομήσει.
  issues:
  - severity: medium
    issue: Unanchored pronoun “ya” in the recompense clause
    rationale: The Greek says simply that such a person “will receive a hundredfold”; it contains no pronoun corresponding to Igbo “ya.” Here “ya” lacks an explicit antecedent and can be read as “receive it a hundredfold.” Removing it restores both source fidelity and idiomatic clarity.
  revised_text: Onye ọ bụla hapụrụ ụlọ, ụmụnne nwoke, ụmụnne nwanyị, nna, nne, nwunye, ụmụ, ma ọ bụ ubi n’ihi aha m, ga-anata okpukpu narị, ketakwa ndụ ebighị ebi.
