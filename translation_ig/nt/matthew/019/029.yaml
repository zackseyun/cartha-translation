id: MAT.19.29
reference: Matthew 19:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: ig
  text: Onye ọ bụla hapụrụ ụlọ, ụmụnne nwoke, ụmụnne nwanyị, nna, nne, nwunye, ụmụ, ma ọ bụ ubi n’ihi aha m, ga-anata okpukpu narị, ketakwa ndụ ebighị ebi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: onye ọ bụla
  rationale: Nke a na-egosi onye ọ bụla n’otu n’otu nke ọnọdụ a metụtara, ma bụrụkwa okwu Igbo doro anya ma kwekọọ n’asụsụ nkịtị.
- source_word: ἀφῆκεν
  choice: hapụrụ
  rationale: Ọ na-egosi ịhapụ ihe ma ọ bụ ndị e depụtara n’ihi iso Jizọs; okwu a anaghị ebubata echiche siri ike dị ka ịgbahapụ ha kpamkpam.
- source_word: οἰκίας
  choice: ụlọ
  rationale: Ọ na-echekwa echiche nke ụlọ dịka ihe onwunwe na ebe obibi n’enweghị ịkọwakarị ihe ederede ahụ ekwughị.
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: ụmụnne nwoke / ụmụnne nwanyị
  rationale: A kpọrọ nwoke na nwanyị iche n’asụsụ Gris, ya mere e debere ọdịiche ahụ n’Igbo.
- source_word: πατέρα / μητέρα
  choice: nna / nne
  rationale: Ndị a bụ okwu mmekọrịta ezinụlọ kpọmkwem dịka ha dị n’isi mmalite.
- source_word: γυναῖκα
  choice: nwunye
  rationale: N’usoro a nke ndị ezinụlọ, ihe okwu a pụtara bụ nwunye, ọ bụghị nwanyị n’ozuzu.
- source_word: τέκνα
  choice: ụmụ
  rationale: Ọ bụ okwu Igbo dị mfe ma zuru oke maka ụmụ mmadụ mụrụ.
- source_word: ἀγρούς
  choice: ubi
  rationale: Ọ na-anọchi anya ala ọrụ ugbo ma na-echekwa akụkụ nke ihe onwunwe na akụnụba dị n’okwu ahụ.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: n’ihi aha m
  rationale: Nke a na-echekwa okwu ihe atụ banyere ‘aha’ nke na-egosi onye Jizọs bụ, ikike ya, na nrubeisi nye ya, kama ịgbanwe ya naanị ka ọ bụrụ ‘n’ihi m.’
- source_word: ἑκατονταπλασίονα
  choice: okpukpu narị
  rationale: Ọ bụ ụzọ Igbo doro anya e si kwuo ‘otu narị okpukpu,’ ma na-echekwa ike ọnụọgụ okwu Gris ahụ.
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: ketakwa ndụ ebighị ebi
  rationale: ‘Iketa’ na-echekwa ihe atụ nke κληρονομέω, ebe ‘ndụ ebighị ebi’ bụ ntụgharị doro anya nke okwu ahụ.
theological_decisions:
- issue: Ihe γυνή pụtara n’usoro ịhapụ ezinụlọ
  choice: nwunye
  alternative: nwanyị
  rationale: Ọnọdụ okwu ahụ depụtara mmekọrịta ezinụlọ, ya mere ‘nwunye’ na-egosi ihe e bu n’obi n’enweghị echiche na a ga-ahapụ ụmụ nwanyị n’ozuzu.
- issue: Ịtụgharị ἕνεκεν τοῦ ὀνόματός μου
  choice: n’ihi aha m
  alternative: n’ihi m
  rationale: Idobe ‘aha m’ na-echekwa ihe okwu Gris ahụ pụtara banyere onye Jizọs bụ, ikike ya, na nkwupụta nrubeisi nye ya.
- issue: Ike nke ἑκατονταπλασίονα
  choice: okpukpu narị
  alternative: otu narị ugboro karịa
  rationale: ‘Okpukpu narị’ na-echekwa nkọwa ọnụọgụ ahụ n’ụzọ dị nkenke ma ghara ịkọwa ụdị ma ọ bụ oge ụgwọ ọrụ ahụ karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro ndepụta ahụ nke ọma, ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa ga-eme ka nkwa ahụ bụrụ naanị ihe anụ ahụ.
