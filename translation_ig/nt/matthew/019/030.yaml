  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/030.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: ig
  text: Ma ọtụtụ ndị mbụ ga-abụ ndị ikpeazụ, ndị ikpeazụ ga-abụkwa ndị mbụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ kpọmkwem karịa: “Ma ọtụtụ ndị mbụ ga-abụ ndị ikpeazụ, ndị ikpeazụ abụrụkwa ndị mbụ.” Okwu Grik ahụ dị mkpụmkpụ nke ukwuu, dịkwa ka ilu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: ọtụtụ ndị
  rationale: Adjective a na-arụ ọrụ dị ka aha ma na-ezo aka n’ìgwè buru ibu a na-akọwaghị kpọmkwem; “ọtụtụ ndị” bụ ụzọ Igbo doro anya ma bụrụ nke e kere eke.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’ihe Jizọs kwuru tupu nke a; “Ma” na-edobe njikọ ahụ.
- source_word: ἔσονται
  choice: ga-abụ
  rationale: Nke a na-egosipụta ọdịnihu nke εἰμί n’Igbo ugbu a n’ụzọ dị mfe.
- source_word: πρῶτοι
  choice: ndị mbụ
  rationale: Ọ na-egosi ọnọdụ ma ọ bụ ọkwa, ọ bụghị nanị usoro oge; “ndị mbụ” na-edobe nkọrịta ilu ahụ.
- source_word: ἔσχατοι
  choice: ndị ikpeazụ
  rationale: Ọ na-emegide “ndị mbụ” n’ọnọdụ ma ọ bụ n’usoro, na-enweghị ịkọwa ya dịka ndị kasị nta.
- source_word: πρῶτοι ἔσχατοι
  choice: ndị bụ ndị mbụ ga-abụ ndị ikpeazụ
  rationale: E tinyere “ndị bụ” ka ahịrịokwu bụrụ Igbo eke ma doo anya, ebe a ka na-edobe amụma mgbanwe ọnọdụ dị n’asụsụ Grik.
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: ndị ikpeazụ abụrụkwa ndị mbụ
  rationale: Ngwaa dị na nkebi mbụ ka a na-aghọta na nke abụọ; “abụrụkwa” na-eme ka Igbo gaa were were ma na-edobe nhata ilu ahụ.
theological_decisions:
- issue: Ụdị mgbanwe ọnọdụ okwu a na-ekwu maka ya
  choice: E debere ya dịka okwu sara mbara banyere mgbanwe ọnọdụ ma ọ bụ ọkwa, n’akọwaghị kpọmkwem ihe mpaghara mgbanwe ahụ bụ.
  alternative: Ịkọwa ya kpọmkwem dịka ịbanye n’alaeze, ụgwọ ọrụ ndị na-eso ụzọ, ma ọ bụ mgbanwe ọnọdụ mmadụ n’obodo.
  rationale: Amaokwu ahụ n’onwe ya anaghị ekpebi kpọmkwem ma ọ bụ nzọpụta, ụgwọ ọrụ, ọnọdụ ọha, ma ọ bụ ọkwa n’ọdịnihu ka ọ na-ekwu maka ya; ntụgharị ahụ ekwesịghị idozi esemokwu nkà mmụta okpukpe ahụ n’ụzọ ederede ahụ na-emeghị.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E chekwara ọdịdị ilu na nkọrịta dị n’etiti “ndị mbụ” na “ndị ikpeazụ.”
