  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: ig
  text: O wee mee na mgbe Jizọs mechara ikwu okwu ndị a, ọ hapụrụ Galili wee bịa n’ókèala Judia n’ofe Osimiri Jọdan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gafee Osimiri Jọdan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: O wee ruo na
  rationale: Nke a na-egosi ntụgharị akụkọ a na-ahụkarị na Matiu, ma zere asụsụ ochie ma ọ bụ nke na-adịghị aga were were n’Igbo.
- source_word: ὅτε ἐτέλεσεν
  choice: mgbe ... kwusịrị
  rationale: Ụdị ngwaa a na-egosi na Jizọs buru ụzọ mechaa okwu ya tupu ọ pụọ; “kwusịrị” na-egosi mmecha ahụ nke ọma n’Igbo.
- source_word: τοὺς λόγους τούτους
  choice: okwu ndị a
  rationale: Ọ na-arụtụ aka n’ozizi Jizọs kwuru ozugbo tupu nke a; “okwu ndị a” bụ okwu Igbo doro anya ma dị ùgwù.
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: o si na Galili pụọ
  rationale: Nke a na-egosi ịhapụ ebe mmadụ nọ na ntụziaka njem, n’ụzọ e si ekwu ya nke ọma n’Igbo.
- source_word: ἦλθεν εἰς
  choice: bịa n’
  rationale: “Bịa n’” na-echekwa echiche nke ịbata n’ebe ọhụrụ dị na Grik.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: ókèala Judia
  rationale: ὅρια n’ebe a na-ezo aka n’ala ma ọ bụ mpaghara Judia, ọ bụghị nanị ahịrị ókè ya.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: n’ofe Osimiri Jọdan
  rationale: Nke a na-egosi ebe dị n’akụkụ nke ọzọ nke Jọdan, ma na-ahapụ nghọta ọnọdụ ala ahụ dịka Grik si kwuo ya.
