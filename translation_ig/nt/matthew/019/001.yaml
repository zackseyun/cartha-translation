translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù, dee ya. E debere usoro akụkọ ahụ na njikọ oge ya, ma tinye akara nkọwa ụkwụ n’ebe ọ metụtara ahịrịokwu πέραν τοῦ Ἰορδάνου.
