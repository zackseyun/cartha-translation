  to: O wee mee na mgbe Jizọs mechara ikwu okwu ndị a, ọ hapụrụ Galili wee bịa n’ókèala Judia n’ofe Osimiri Jọdan.[a]
  rationale: The revision replaces an unnatural narrative-transition expression, makes the completion of Jesus’ speech explicit, and retains the source’s two successive movements. It also keeps the geographical wording appropriately broad and supplies a direct lexical alternative for πέραν.
