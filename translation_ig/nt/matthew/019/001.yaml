    text: Ma ọ bụ, “gafee Osimiri Jọdan.”
    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural narrative-transition expression, makes the completion of Jesus’ speech explicit, and retains the source’s two successive movements. It also keeps the geographical wording appropriately broad and supplies a direct lexical alternative for πέραν.
