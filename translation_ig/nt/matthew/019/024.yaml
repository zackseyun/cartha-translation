id: MAT.19.24
reference: Matthew 19:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: ig
  text: 'Ọzọkwa, ana m asị unu: Ọ dịịrị kamel[b] mfe ịgafe n’anya agịga[a] karịa ka ọ dịịrị nwoke bara ọgaranya ịbanye n’alaeze Chineke.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’oghere agịga.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ atụwo aro “eriri” kama “kamel,” ma ihe odide Grik n’ebe a na-agụ “kamel.”
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: Ana m agwakwa unu ọzọ sị
  rationale: Nke a na-egosipụta nkwughachi dị na πάλιν, ma na-eweta λέγω ὑμῖν n’ụzọ Igbo dị ugbu a ma dịkwa ebube; δέ bụ njikọ dị nro nke a na-achọghị ịsụgharị iche.
- source_word: εὐκοπώτερόν ἐστιν
  choice: Ọ dịrị … mfe … karịa
  rationale: Usoro a na-egosipụta ntụnyere ahụ nke ọma n’Igbo ma jikọta infinitive abụọ ahụ n'ụzọ eke.
- source_word: κάμηλον
  choice: kamel
  rationale: Ihe odide Grik a na-agụ κάμηλον, nke pụtara anụmanụ kamel, ọ bụghị eriri.
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: n’anya agịga
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka oghere dị n’agịga, ma na-echekwa ihe atụ doro anya nke Grik.
- source_word: εἰσελθεῖν
  choice: ịgabiga
  rationale: N’ihe atụ nke kamel na oghere agịga, ‘ịgabiga’ na-egosipụta ngagharị site n’oghere ahụ n'ụzọ eke.
- source_word: ἢ πλούσιον
  choice: karịa ka ọ dịrị nwoke bara ọgaranya
  rationale: Nke a na-echekwa ntụnyere ahụ, ma ‘nwoke bara ọgaranya’ na-anọchi masculine singular πλούσιον n'ụzọ doro anya.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ịbanye n’alaeze Chineke
  rationale: ‘Alaeze Chineke’ bụ ntụgharị kwụ ọtọ nke βασιλεία τοῦ θεοῦ, ‘ịbanye n’…’ na-egosipụtakwa εἰς n’Igbo eke.
theological_decisions:
- issue: Nkọwa nke ihe atụ kamel na anya agịga
  choice: E debere ya dị ka ntụnyere siri ike nke na-egosi na ihe ahụ agaghị ekwe omume n’ike mmadụ, n’enweghị ịkọwa ya dị ka ọnụ ụzọ pụrụ iche.
  alternative: Ịsị na ‘anya agịga’ bụ aha otu ọnụ ụzọ dị na Jerusalem, ma ọ bụ ịgbanwe ‘kamel’ ka ọ bụrụ ‘eriri.’
  rationale: Ihe odide Grik na-enye ihe atụ doro anya ma kpachapụrụ anya mee ka ọdịiche ahụ sie ike. Ọ dịghị ihe n’amaokwu a na-akwado ọnụ ụzọ pụrụ iche ma ọ bụ mgbanwe gaa na ‘eriri.’
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. A họọrọ ‘anya agịga’ dịka okwu a na-ejikarị eme ihe, ebe nkọwa ala peeji na-edebe ntụgharị kwụ ọtọ ‘oghere agịga.’
