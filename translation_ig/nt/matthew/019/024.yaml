- from: 'Ana m agwakwa unu ọzọ sị: Ọ dịrị kamel[b] mfe ịgabiga n’anya agịga[a] karịa ka ọ dịrị nwoke bara ọgaranya ịbanye n’alaeze Chineke.'
  to: 'Ọzọkwa, ana m asị unu: Ọ dịịrị kamel[b] mfe ịgafe n’anya agịga[a] karịa ka ọ dịịrị nwoke bara ọgaranya ịbanye n’alaeze Chineke.'
  rationale: The revision retains every element of the source and the draft’s intended sense while improving idiomatic Standard Igbo. It keeps the stark camel-and-needle image, does not introduce the unsupported ‘needle gate’ interpretation, and preserves the footnote distinction between a later proposal and the Greek wording.
