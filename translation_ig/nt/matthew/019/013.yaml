id: MAT.19.13
reference: Matthew 19:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: ig
  text: Mgbe ahụ, a kpọtaara ya ụmụaka ka o bikwasị ha aka ya abụọ ma kpee ekpere; ma ndị na-eso ụzọ ya baara ha mba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Ha’ nke ikpeazụ nwere ike izo aka ma n’ụmụaka ahụ ma n’ndị kpọtara ha.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi usoro oge n’akụkọ ahụ n’ụzọ dị nkenke ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: προσηνέχθησαν αὐτῷ
  choice: a kpọtaara ya
  rationale: Ụdị ngwaa a bụ nke nnara; okwu a na-egosi na e nwere ndị kpọtaara ụmụaka ahụ bịakwute ya, n’agbanyeghị na akpọghị ndị ahụ aha.
- source_word: παιδία
  choice: ụmụaka
  rationale: Ọ na-anọchi anya ụmụaka n’enweghị ịgbakwụnye nkọwa afọ ndụ nke okwu Grik ahụ na-ekwughị kpọmkwem.
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ na-egosipụta ebumnuche nke ịkpọtara ya ụmụaka ahụ n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: o bikwasị ha aka ya abụọ
  rationale: Nke a na-edobe ihe oyiyi nke ibikwasị mmadụ aka, ma ‘aka ya abụọ’ na-egosipụta n'ụzọ doro anya na χεῖρας dị n'ụbara.
- source_word: προσεύξηται
  choice: kpee ekpere
  rationale: Okwu Grik ahụ ekwughị kpọmkwem ‘kpee ekpere maka ha’; ya mere, a hapụrụ ihe a ga-agbakwụnye n’echiche.
- source_word: οἱ δὲ μαθηταὶ
  choice: ma ndị na-eso ụzọ ya
  rationale: ‘Ma’ na-egosipụta ọdịiche dị n’etiti ebumnuche ndị kpọtara ụmụaka ahụ na mmeghachi omume ndị na-eso ụzọ.
- source_word: ἐπετίμησαν αὐτοῖς
  choice: baara ha mba
  rationale: ‘Ịbara mba’ na-egosipụta ịkatọ mmadụ ike; nnọchiaha ‘ha’ na-echekwa nghọta abụọ nke αὐτοῖς n’asụsụ Grik.
theological_decisions:
- issue: Onye nnọchiaha ikpeazụ αὐτοῖς na-ezo aka na ya
  choice: ha
  alternative: ụmụaka ahụ; ma ọ bụ ndị kpọtara ụmụaka ahụ
  rationale: Nnọchiaha Grik ahụ nwere ike izo aka n’otu n’ime ìgwè abụọ ahụ. ‘Ha’ na-edobe nghọta abụọ a kama ikpebi nke ederede ahụ na-ekwughị hoo haa.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ugwu ma dị mfe nghọta. A na-edobe usoro akụkọ, ebumnuche, na nghọta abụọ dị na nnọchiaha ikpeazụ n’enweghị ịgbakwụnye nkọwa okwukwe nke ederede ahụ na-ekwughị.
