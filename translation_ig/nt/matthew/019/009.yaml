id: MAT.19.9
reference: Matthew 19:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: ig
  text: Ma ana m agwa unu na onye ọ bụla gbara nwunye ya alụkwaghịm, ma ọ bụghị n’ihi omume mmekọahụ rụrụ arụ[a], wee lụọ nwanyị ọzọ, na-akwa iko; onye lụrụkwa nwanyị a gbara alụkwaghịm na-akwa iko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘ma ọ bụghị n’ala nke omume mmekọahụ rụrụ arụ.’ Okwu Grik ahụ pụkwara ịpụta n’ụzọ dị warara dịka ‘ịkwa iko tupu alụmdi na nwunye,’ ebe ụfọdụ na-aghọta ya dịka ‘ekwesịghị ntụkwasị obi n’ihe gbasara mmekọahụ.’
    reason: lexical_alternative
  - marker: b
    text: 'Ụfọdụ manuskripti enweghị okwu ndị a: ‘onye lụrụkwa nwanyị a gbara alụkwaghịm na-akwa iko.’'
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ma ana m agwa unu
  rationale: Nke a na-egosipụta δέ dị ka njikọ nwere obere ọdịiche n’ihe Jizọs kwuru tupu ya, ma na-asụgharị λέγω...ὑμῖν n’ụzọ Igbo nkịtị ma doo anya.
- source_word: ὃς ἂν
  choice: onye ọ bụla
  rationale: Nkebi a na-egosi onye ọ bụla dabara n’ọnọdụ ahụ; ‘onye ọ bụla’ na-echekwa ike izugbe ya.
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: gbara nwunye ya alụkwaghịm
  rationale: N’ọnọdụ alụmdi na nwunye a, ἀπολύω pụtara ịgba alụkwaghịm, ọ bụghị naanị ịchụpụ mmadụ.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: ma ọ bụghị n’ihi omume rụrụ arụ n’ihe gbasara mmekọahụ
  rationale: Nke a na-echekwa ya dị ka nkebi ewepu. Okwu πορνεία sara mbara karịa ịkwa iko naanị, ya mere e jighị okwu dị warara dochie ya.
- source_word: καὶ γαμήσῃ ἄλλην
  choice: wee lụọ nwanyị ọzọ
  rationale: ἄλλην bụ nke nwanyị; itinye ‘nwanyị’ na-eme ka Igbo doo anya ma ghara ịgbakwunye echiche ọhụrụ.
- source_word: μοιχᾶται
  choice: na-akwa iko
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ime mmehie ịkwa iko.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: onye lụrụkwa nwanyị a gbara alụkwaghịm na-akwa iko
  rationale: A sụgharịrị participle ahụ dị ka nwanyị e gbara alụkwaghịm, ebe ‘onye’ na-echekwa ọdịdị izugbe nke ahịrịokwu ahụ.
theological_decisions:
- issue: Ihe πορνεία pụtara n’ahịrị nke na-ewepu otu ọnọdụ
  choice: omume rụrụ arụ n’ihe gbasara mmekọahụ
  alternative: ịkwa iko; ịkwa iko tupu alụmdi na nwunye; ekwesịghị ntụkwasị obi n’ihe gbasara mmekọahụ
  rationale: πορνεία nwere nghọta sara mbara karịa μοιχεία. Nhọrọ a na-echekwa obosara okwu Grik ahụ ma ghara ikpebi n’amaghị ama otu nkọwa ụka banyere ọnọdụ e wepụrụ.
- issue: Ịgụnye nkebi ikpeazụ καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: gụnye ya n’ederede isi ma tinye nkọwa banyere ọdịiche manuskripti
  alternative: hapụ ya n’ederede isi
  rationale: SBLGNT e nyere gụnyere nkebi ahụ ma jiri akara gosi na e nwere ọdịiche n’ihe akaebe manuskripti. Ya mere, e sụgharịrị ya ma kọwaa ọdịiche ahụ n’okpuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ usoro nwoke na nwunye nke ihe atụ Grik ahụ, ma e jighị okwu okpukpe pụrụ iche nke otu ụka dochie mgbagwoju anya dị na πορνεία.
