id: MAT.19.28
reference: Matthew 19:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: ig
  text: 'Jizọs wee sị ha, “N’ezie, asị m unu: unu ndị sooro m ga-anọkwasịkwa n’ocheeze iri na abụọ n’oge mmegharị ọhụrụ ahụ,[a] mgbe Nwa nke Mmadụ ga-anọkwasị n’ocheeze ebube ya, na-ekpe ebo iri na abụọ nke Izrel ikpe.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ịmụgharị ahụ,” “n’ụwa ọhụrụ ahụ,” ma ọ bụ “n’oge e mere ihe ọhụrụ.” N’ebe a, okwu ahụ na-arụtụ aka ná mmegharị ọhụrụ nke ọdịnihu jikọtara na ọchịchị Nwa nke Mmadụ, ọ bụghị n’ịmụ mmadụ n’ime mmụọ.
    reason: lexical_alternative
  - marker: b
    text: “Ikpe ikpe” nwekwara ike ịgụnye echiche nke ịchị ma ọ bụ ịchịkwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: N’ezie
  rationale: Ọ na-egosi mmalite okwu siri ike nke nwere ikike; ‘N’ezie’ bụ Igbo doro anya ma na-edobe ịdị arọ nke okwu ahụ.
- source_word: ἀκολουθήσαντές μοι
  choice: unu ndị sooro m
  rationale: Ọ na-akọwapụta ndị a na-agwa okwu dịka ndị sorola Jizọs, ma na-edobe ‘m’ nke dị n’asụsụ Grik.
- source_word: παλιγγενεσίᾳ
  choice: n’oge mmegharị ọhụrụ ahụ
  rationale: N’ebe a okwu ahụ na-arụtụ aka n’oge ọdịnihu nke a ga-eme ka ihe dị ọhụrụ, nke jikọtara na ọchịchị Nwa nke Mmadụ; ọ bụghị isi okwu banyere ịmụ mmadụ ọzọ n’ime mmụọ.
- source_word: ὅταν καθίσῃ
  choice: mgbe ... ga-anọkwasị
  rationale: Nkebiokwu ahụ na-arụtụ aka n’ihe ga-eme n’ọdịnihu; usoro a bụ nke e ji ekwu ya n’Igbo nke ọma.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-edobe aha-utu ahụ na njikọ ya na ihe atụ Mesaya na Daniel.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: n’ocheeze ebube ya
  rationale: Nsụgharị a dị nso na usoro Grik ma bụrụkwa Igbo dị ugwu ma dị mfe nghọta.
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: unu onwe unu ga-anọkwasịkwa
  rationale: ‘Onwe unu’ na-egosipụta nkwusi ike nke ὑμεῖς, ebe ‘-kwa’ na-edobe καί.
- source_word: ἐπὶ δώδεκα θρόνους
  choice: n’ocheeze iri na abụọ
  rationale: Ọ bụ nsụgharị kpọmkwem ma dị mfe nghọta nke ọnọdụ ịnọ n’ocheeze iri na abụọ.
- source_word: κρίνοντες
  choice: na-ekpe ... ikpe
  rationale: Nke a na-edobe isi ihe okwu Grik pụtara, n’agbanyeghị na n’ọnọdụ a ọ pụkwara ịgụnye ịchị ma ọ bụ ịchịkwa.
- source_word: φυλὰς τοῦ Ἰσραήλ
  choice: ebo iri na abụọ nke Izrel
  rationale: Ọ bụ ụzọ Igbo doro anya e si akọwa nkewa ebo iri na abụọ nke Izrel.
theological_decisions:
- issue: Ihe παλιγγενεσία pụtara n’ebe a
  choice: oge mmegharị ọhụrụ nke ọdịnihu jikọtara na ịnọkwasị Nwa nke Mmadụ n’ocheeze
  alternative: ịmụ mmadụ ọzọ n’ime mmụọ; ụwa ọhụrụ; oge ọhụrụ
  rationale: Ọnọdụ okwu a bụ ịnọkwasị n’ocheeze na ikpe nke ọdịnihu, ọ bụghị mgbanwe ime mmụọ nke otu onye. Nsụgharị ahụ anaghị akọwapụta usoro ọchịchị otu ụka ma ọ bụ otu echiche kpọmkwem.
- issue: Oke ihe κρίνοντες pụtara
  choice: ikpe ikpe
  alternative: ịchị; ịchịkwa
  rationale: ‘Ikpe ikpe’ bụ isi ihe ngwaa Grik ahụ pụtara. Ihe ọ pụtara nwere ike ịgụnye ọrụ ọchịchị, ya mere e debere nke ahụ na nkọwa ala peeji kama ịgbasa ya n’ahịrịokwu bụ isi.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro nkwa na oge ọdịnihu nke Grik, tinyere nkwusi ike dị na ‘unu onwe unu ... kwa.’ E zere okwu ụka pụrụ iche na nkọwa nke ga-emechi nghọta ọdịnihu ahụ n’otu usoro nkà mmụta okpukpe.
