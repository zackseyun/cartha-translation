revisions:
- from: 'Jizọs wee sị ha, “N’ezie, ana m asị unu: unu ndị sooro m, n’oge mmegharị ọhụrụ ahụ,[a] mgbe Nwa nke Mmadụ ga-anọkwasị n’ocheeze ebube ya, unu onwe unu ga-anọkwasịkwa n’ocheeze iri na abụọ, na-ekpe ebo iri na abụọ nke Izrel ikpe.[b]”'
  to: 'Jizọs wee sị ha, “N’ezie, asị m unu: unu ndị sooro m ga-anọkwasịkwa n’ocheeze iri na abụọ n’oge mmegharị ọhụrụ ahụ,[a] mgbe Nwa nke Mmadụ ga-anọkwasị n’ocheeze ebube ya, na-ekpe ebo iri na abụọ nke Izrel ikpe.[b]”'
  rationale: The revised order makes the renewal the setting of the disciples’ future enthronement rather than a possible modifier of their past following of Jesus. It also uses a more natural and suitably solemn Igbo rendering of the authoritative saying formula. No doctrinal scheme is introduced, and the footnotes retain the lexical breadth of παλιγγενεσία and κρίνοντες.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:59Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains all major Greek elements, including the future enthronement, twelve thrones, and judging the twelve tribes. However, the placement of “n’oge mmegharị ọhụrụ ahụ” directly after “unu ndị sooro m” can naturally modify the act of following Jesus rather than the promised future sitting. The revision places it with the future promise, as required by the Greek construction and context.
  naturalness: “Ana m asị unu” is understandable, but “asị m unu” is the more concise, solemn, and idiomatic form for this saying formula. Reordering the sentence also makes the temporal relationships clear in modern Standard Igbo.
  terminology: “Nwa nke Mmadụ,” “ocheeze,” “ebo iri na abụọ nke Izrel,” and “na-ekpe ... ikpe” are retained. “Oge mmegharị ọhụrụ” is retained as a cautious contextual rendering of παλιγγενεσία; the footnote preserves alternatives without forcing individual spiritual rebirth as the meaning.
  issues:
  - severity: medium
    issue: Ambiguous attachment of the renewal phrase
    rationale: In “unu ndị sooro m, n’oge mmegharị ọhụrụ ahụ,” the phrase “n’oge ...” may be read as specifying when the disciples followed Jesus. In Greek, ἐν τῇ παλιγγενεσίᾳ belongs with the future promise that they will sit on thrones.
  - severity: low
    issue: Saying formula is less idiomatic than necessary
    rationale: “Ana m asị unu” is grammatical, but “N’ezie, asị m unu” better reflects the compact, solemn present-tense formula λέγω ὑμῖν and reads more naturally in elevated Standard Igbo.
  revised_text: 'Jizọs wee sị ha, “N’ezie, asị m unu: unu ndị sooro m ga-anọkwasịkwa n’ocheeze iri na abụọ n’oge mmegharị ọhụrụ ahụ,[a] mgbe Nwa nke Mmadụ ga-anọkwasị n’ocheeze ebube ya, na-ekpe ebo iri na abụọ nke Izrel ikpe.[b]”'
  revised_footnotes:
