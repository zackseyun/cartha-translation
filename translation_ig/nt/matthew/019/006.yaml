id: MAT.19.6
reference: Matthew 19:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: ig
  text: N’ihi ya, ha abụghịzi mmadụ abụọ, kama ha bụ otu anụ ahụ. Ya mere, ihe Chineke jikọtara ọnụ, mmadụ[a] ekewala ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mmadụ” n’ebe a pụtara mmadụ ọ bụla; ya bụ, ọ dịghị onye kwesịrị ikewa ihe Chineke jikọtara ọnụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: N’ihi ya
  rationale: 'Na-egosi ihe si n’okwu bu ụzọ pụta: ndị abụọ ahụ aghọwo otu anụ ahụ.'
- source_word: οὐκέτι εἰσὶν δύο
  choice: ha abụkwaghị mmadụ abụọ
  rationale: “Abụkwaghị” na-egosi na ọnọdụ ha agbanweela; itinye “mmadụ” na-eme ka okwu ahụ doo anya ma bụrụ Igbo dị ndụ.
- source_word: ἀλλὰ σὰρξ μία
  choice: kama ha bụ otu anụ ahụ
  rationale: “Otu anụ ahụ” na-echekwa okwu alụmdi na nwunye sitere na Jenesis na njikọ ya na akụkụ Akwụkwọ Nsọ ahụ.
- source_word: ὃ οὖν
  choice: Ya mere, ihe
  rationale: “Ihe” na-ezo aka n’ịdị n’otu ma ọ bụ njikọ ahụ Chineke mere, ebe “Ya mere” na-echekwa ike nkwubi okwu οὖν.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ nsụgharị kpọmkwem na nke kwesịrị ekwesị n’Igbo.
- source_word: συνέζευξεν
  choice: jikọtara ọnụ
  rationale: Na-egosi ime ka mmadụ abụọ bụrụ ndị e jikọtara ọnụ; ọ bụ okwu Igbo dị mfe ma kwekọọ n’ọnọdụ alụmdi na nwunye.
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: “Mmadụ” bụ okwu Igbo nkịtị nke nwere ike ịpụta mmadụ ọ bụla, ya mere ọ na-echekwa nghọta izugbe nke okwu Grik.
- source_word: μὴ χωριζέτω
  choice: ekewala ya
  rationale: Ụdị a na-enye iwu machibidoro mmadụ ikewa njikọ ahụ; “ya” na-ezo aka n’ihe Chineke jikọtara ọnụ.
theological_decisions:
- issue: Ike izugbe nke ἄνθρωπος n’iwu gbasara alụmdi na nwunye
  choice: mmadụ[a]
  alternative: onye ọ bụla
  rationale: “Mmadụ” na-asụgharị otu okwu Grik ahụ n’ụzọ ebumpụta ụwa ma na-agụnye mmadụ ọ bụla. Ihe odide ala peeji na-eme ka nghọta izugbe ahụ pụta ìhè n’enweghị ịgbanwe okwu isi.
- issue: Okwu njikọ alụmdi na nwunye sitere na Jenesis, σὰρξ μία
  choice: otu anụ ahụ
  alternative: otu ahụ
  rationale: “Otu anụ ahụ” na-echekwa oyiyi okwu mbụ na njikọ ya na Jenesis, n’enweghị itinye nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “otu anụ ahụ” iji chekwaa okwu Akwụkwọ Nsọ sitere na Jenesis, ebe “mmadụ ekewala ya” na-enye mmachibido iwu ahụ n’ụzọ Igbo ebumpụta ụwa.
