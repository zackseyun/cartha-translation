  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: ig
  text: Ọ zara, sị, “Ọ̀ bụ na unu agụbeghị[a] na onye kere ha[b] site ná mmalite mere ha nwoke na nwanyị?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Unu agụghị na…?”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “onye kere”; a pụkwara ịsụgharị ya, “Onye Okike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ọ zara ha, sị
  rationale: Nke a na-egosi ma nzaghachi ahụ ma okwu e kwuru n’Igbo dị n’ụzọ eke; ‘ha’ na-eme ka ndị a zara doo anya site n’ọnọdụ okwu.
- source_word: Οὐκ ἀνέγνωτε
  choice: Ọ̀ bụ na unu agụbeghị
  rationale: Ajụjụ a na-ama ndị na-ege ntị aka n’ihe e dere n’Akwụkwọ Nsọ; ụdị perfect ‘agụbeghị’ na-egosi na ihe ahụ ka dị ha nso ịgụ.
- source_word: ὅτι
  choice: na
  rationale: ‘Na’ na-ewebata ọdịnaya nke ihe ha kwesịrị ịgụ n’ụzọ Igbo nkịtị.
- source_word: ὁ κτίσας
  choice: onye ahụ kere ha
  rationale: Nke a na-edobe ụdị articular participle Grik kama ime ya ozugbo aha nsọpụrụ ‘Onye Okike’; ‘ha’ bụ αὐτούς nke ihe odide ahụ na-etinye n’azụ ἐποίησεν.
- source_word: ἀπ’ ἀρχῆς
  choice: site ná mmalite
  rationale: Ọ na-echekwa echiche ‘from the beginning’ ma na-eme ka njikọ ya na ọrụ okike pụta ìhè, dị ka nkwughachi akụkọ Jenesis.
- source_word: ἄρσεν καὶ θῆλυ
  choice: nwoke na nwaanyị
  rationale: N’Igbo nkịtị, ụzọ a na-egosi ụzọ abụọ nke okike, nwoke na nwanyị, n’enweghị nkọwa ozizi agbakwunyere.
- source_word: ἐποίησεν αὐτούς
  choice: mere ha
  rationale: ‘Mere ha’ na-edobe ọdịiche dị n’etiti κτίζω (‘kee’) na ποιέω (‘mee’) ma zere ikwughachi ‘kee’ ugboro abụọ.
theological_decisions:
- issue: Igosipụta okwu okike ahụ n’ihe metụtara Jenesis 1:27
  choice: Edobere ụzọ abụọ ahụ dị ka ‘nwoke na nwaanyị’ n’ahịrị isi.
  alternative: ‘kere ha ka ha bụrụ nwoke na nwaanyị’
  rationale: Jizọs na-arịọ akaebe akụkọ okike. Nsụgharị a na-esochi okwu Grik ma na-echekwa echiche okike ya n’etinyeghị nkwubi okwu ozizi ọzọ n’amaokwu ahụ.
- issue: Njikọ ‘site ná mmalite’
  choice: E tinyere ya n’akụkụ ‘kere ha’ ka o nwee ike ịkọwa ọrụ okike.
  alternative: Iwebata ọdịnaya dum site n’okwu ‘site ná mmalite’
  rationale: Usoro okwu Grik na-enye ohere nghọta, ma ọnọdụ ya na ὁ κτίσας na-akwado njikọ ya na okike; a naghị agbasa ihe amaokwu ahụ kwuru karịa nke ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke kwesịrị ekwesị ma dị mfe nghọta. E ji akara ụda mee naanị ebe ọ na-enyere aka ịmata ajụjụ ahụ; e zere okwu ụka pụrụ iche na nkọwa ozizi agbakwunyere.
