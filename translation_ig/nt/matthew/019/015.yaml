    reason: lexical_alternative
  revision_rationale: The revision resolves the awkward wording for the hand-laying idiom while preserving the Greek’s concrete action, the antecedent temporal relationship of the aorist participle, and the departure “from there.” The footnote offers the finite-clause alternative without changing meaning.
