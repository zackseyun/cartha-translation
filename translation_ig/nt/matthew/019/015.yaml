  text: καὶ ἐπιθεὶς ⸂τὰς χεῖρας αὐτοῖς⸃ ἐπορεύθη ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/015.yaml
  text: And after laying his hands on them[a], he went on from there.
translation:
  language: ig
  text: Mgbe o bikwasịrị aka ya n’ahụ ha[a], o si n’ebe ahụ pụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “O bikwasịrị aka ya n’ahụ ha, wee si n’ebe ahụ pụọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθεὶς
  choice: Mgbe o bikwasịrị
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi; usoro ‘Mgbe ...’ bụ Igbo dị n’ụzọ eke ma na-echekwa usoro omume ahụ.
- source_word: τὰς χεῖρας αὐτοῖς
  choice: ha aka ya
  rationale: N’Igbo, ‘bikwasị mmadụ aka’ na-egosipụta kpọmkwem omume ahụ; ‘ya’ na-eme ka o doo anya na aka ndị ahụ bụ nke Jizọs, dịka ihe gbara amaokwu ahụ gburugburu si gosi.
- source_word: ἐπορεύθη
  choice: o ... pụọ
  rationale: N’ọnọdụ akụkọ a, ‘pụọ’ na-egosi na ọ hapụrụ ebe ahụ, n’enweghị ịgbakwunye echiche pụrụ iche banyere ụzọ njem ya.
- source_word: ἐκεῖθεν
  choice: si n’ebe ahụ
  rationale: Nke a bụ nsụgharị Igbo doro anya na nke eke maka adverb nke na-egosi isi ebe mmadụ si pụọ.
- source_word: καὶ
  choice: Mgbe
  rationale: Njikọ καὶ na participle a na-ejikọta omume abụọ n’usoro. N’Igbo, mmalite ‘Mgbe’ na-ebupụta njikọ na usoro oge ahụ n’ụzọ eke, ọbụna ma a naghị atụgharị καὶ iche dịka ‘na’.
theological_decisions:
- issue: Ụdị omume Jizọs mgbe o bikwasịrị ha aka
  choice: E debere omume anụ ahụ nke ibikwasị ha aka n’ime ederede.
  alternative: Ịsụgharị ya dịka ‘ọ gọziri ha.’
  rationale: Grik kwuru kpọmkwem na o bikwasịrị ha aka. Ọ bụ ezie na ọnọdụ amaokwu ndị gbara ya gburugburu na-egosi ngọzi, iji ‘gọzie’ dochie omume ahụ ga-abụ ịkọwa ihe e bu n’obi karịa ịsụgharị ihe e dere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Bikwasị ... aka’ na-echekwa omume doro anya dị na Grik, ebe ‘si n’ebe ahụ pụọ’ na-enye mmegharị akụkọ ahụ n’ụzọ eke.
