revisions:
- from: Ọ sịrị ya[a], “Gịnị mere i ji ajụ m banyere ihe dị mma? Ọ bụ otu onye ka ọ dị mma[b]. Ma ọ bụrụ na ị chọrọ ịbanye ná ndụ, debe iwu ndị ahụ.”
  to: Ọ sịrị ya[a], “Gịnị mere i ji ajụ m banyere ihe dị mma? E nwere otu onye dị mma[b]. Ma ọ bụrụ na ị chọrọ ịbanye ná ndụ, debe iwu ndị ahụ.”
  rationale: The revision corrects the central Igbo clause so that it is grammatical and idiomatic while retaining Matthew’s distinct wording and leaving the referent unnamed. It does not harmonize the verse with Mark and Luke, add ‘eternal’ to life, or impose a doctrinal interpretation. The variant note is made more precise and natural; its anchor remains on the clause it explains.
