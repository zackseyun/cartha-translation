  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: ig
  text: Ọ sịrị ya[a], “Gịnị mere i ji ajụ m banyere ihe dị mma? E nwere otu onye dị mma[b]. Ma ọ bụrụ na ị chọrọ ịbanye ná ndụ, debe iwu ndị ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide aka ochie na akụkọ ndị kwekọrọ na ya dị na Mak na Luk gụrụ, “Gịnị mere i ji akpọ m onye ọma? Ọ dịghị onye dị mma ma e wezụga otu onye—Chineke.” Ma ederede Matiu dị na SBLGNT gụrụ, “Gịnị mere i ji ajụ m banyere ihe dị mma? E nwere otu onye dị mma.”
    reason: textual_variant
  - marker: b
    text: 'Ma ọ bụ, n’ụzọ ọzọ: “Ọ bụ naanị otu onye dị mma.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: Gịnị mere i ji ajụ m banyere ihe dị mma?
  rationale: “Ihe dị mma” na-egosipụta ụdị okwu neuter τοῦ ἀγαθοῦ dị ka ihe ma ọ bụ omume dị mma, kama ime ya onye kpọmkwem ma ọ bụ kwekọọ ya n’ike na Mak na Luk.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: Ọ bụ otu onye ka ọ dị mma
  rationale: Usoro a na-edobe nkwupụta Grik nke na-ekwu na otu onye bụ onye dị mma, ma ghara ịkpọ onye ahụ aha ma ọ bụ tinye “naanị” n’ahịrịokwu ahụ. Ọ ka na-ebu ntakịrị ọdịdị pụrụ iche nke okwu Grik.
- source_word: εἰ δὲ θέλεις
  choice: Ma ọ bụrụ na ị chọrọ
  rationale: “Ị chọrọ” bụ okwu Igbo dị ugbu a ma doo anya maka θέλεις; “Ma” na-egosipụta δέ n’ụzọ dị mfe.
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: ịbanye ná ndụ
  rationale: Nke a na-edobe echiche nke ịbanye na ndụ n’ozuzu ya, n’etinyeghị “ndụ ebighị ebi,” nke na-adịghị n’ahịrịokwu Grik a.
- source_word: τήρησον τὰς ἐντολάς
  choice: debe iwu ndị ahụ
  rationale: “Debe” bụ okwu Igbo kwesịrị ekwesị maka ime ihe iwu Chineke kwuru; “iwu ndị ahụ” na-egosipụta article na plural nke Grik n’ụzọ doro anya.
theological_decisions:
- issue: Mmekọrịta okwu Jizọs na ịdị mma Chineke na onye Kraịst bụ
  choice: A sụgharịrị okwu Matiu dị ka ajụjụ banyere “ihe dị mma,” soro ya bụrụ nkwupụta na otu onye dị mma, n’akpọghị onye ahụ aha.
  alternative: 'Ime ka ọ kwekọọ na Mak na Luk: “Gịnị mere i ji akpọ m onye ọma? Ọ dịghị onye dị mma ma e wezụga otu onye—Chineke.”'
  rationale: SBLGNT nke Matiu nwere okwu dị iche na akụkọ ndị yiri ya na Mak na Luk. Nsụgharị ahụ anaghị agọnarị ịdị mma ma ọ bụ chi nke Jizọs, ma ọ naghịkwa amanye nkwupụta banyere ya n’ime okwu Grik a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ọ bụ otu onye ka ọ dị mma” kpachapụrụ anya debe ọdịdị okwu Grik na njikọ ya na “ihe dị mma”; nkọwa ala peeji [b] na-enye ụzọ Igbo ka dị were were. E debere akara nkọwa [b] n’akụkụ okwu ọ na-akọwa, kama n’akụkụ “ndụ,” n’ihi na ọdịnaya nkọwa ahụ metụtara εἷς ἐστιν ὁ ἀγαθός.
