id: MAT.19.3
reference: Matthew 19:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: ig
  text: Ndị Farisii bịakwutere ya, na-anwale ya, sị, “Iwu ò kwere ka nwoke gbaa nwunye ya alụkwaghịm n’ihi ihe kpatara ọ bụla?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ihi ihe ndabere ọ bụla” ma ọ bụ “n’ihi ihe kpatara ya niile.” Akpaokwu Grik ahụ bụ ajụjụ iwu sara mbara banyere ihe ndị iwu kwere ka ha bụrụ ihe ndabere maka ịgba alụkwaghịm.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: bịakwutere
  rationale: Ọ na-egosi na ha bịaruru ya nso; okwu a bụ Igbo nkịtị ma na-echekwa echiche nke ịbịakwute mmadụ.
- source_word: πειράζοντες
  choice: na-anwale
  rationale: Ọ na-echekwa obosara ihe πειράζω pụtara—ịnwa ma ọ bụ ile ule—ebe ọnọdụ akụkọ ahụ na-egosi na ebumnuche ha adịghị mma, n’etinyeghị nkọwa ‘iji jide ya n’ọnyà’ ozugbo n’ederede.
- source_word: ἔξεστιν
  choice: Iwu ò kwere
  rationale: Nke a na-egosipụta ajụjụ banyere ihe iwu kwadoro n’ọnọdụ arụmụka gbasara iwu, n’ụzọ doro ndị na-agụ Igbo anya.
- source_word: ἀνθρώπῳ
  choice: nwoke
  rationale: Ọ bụ ezie na okwu Grik ahụ nwere ike ịpụta mmadụ, okwu so ya banyere ‘nwunye ya’ na-egosi kpọmkwem di, ya mere ‘nwoke’ dabara n’ebe a.
- source_word: ἀπολῦσαι
  choice: gbaa ... alụkwaghịm
  rationale: N’ọnọdụ alụmdi na nwunye a, ἀπολύω pụtara ịgba alụkwaghịm, ọ bụghị nanị izipụ mmadụ.
- source_word: γυναῖκα αὐτοῦ
  choice: nwunye ya
  rationale: γυνή nwere ike ịbụ nwanyị ma ọ bụ nwunye, ma ihe gbasara ịgba alụkwaghịm na nnọchiaha nwe ya chọrọ ‘nwunye ya.’
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: n’ihi ihe ọ bụla
  rationale: Ọ na-echekwa obosara ajụjụ ahụ banyere ma ihe ọ bụla pụrụ ịbụ ihe ndabere maka ịgba alụkwaghịm.
theological_decisions:
- issue: Ichekwa ajụjụ iwu gbasara ihe ndị pụrụ ịbụ ihe ndabere maka ịgba alụkwaghịm n’enweghị itinye mkpebi otu ụka
  choice: Iwu ò kwere ka nwoke gbaa nwunye ya alụkwaghịm n’ihi ihe ọ bụla?
  alternative: Iwu ò kwere ka di gbaa nwunye ya alụkwaghịm n’ihi ihe ọ bụla?
  rationale: Amaokwu a na-eweta ajụjụ ule, ọ naghị enye azịza ozizi ahụ n’onwe ya. Nsụgharị ahụ hapụrụ obosara na esemokwu nke ajụjụ ahụ ka ọ dị.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dịkwa mfe nghọta. ‘Bịakwutere,’ ‘na-anwale,’ na ‘Iwu ò kwere’ na-eme ka ahịrịokwu ahụ bụrụ nke e ji ọnụ ekwu n’enweghị iwepụ ụda ajụjụ iwu dị na Grik.
