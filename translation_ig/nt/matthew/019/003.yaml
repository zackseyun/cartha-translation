revisions:
- from: Ndị Farisii bịakwutere ya, na-anwale ya, sị, “Iwu ò kwere ka nwoke gbaa nwunye ya alụkwaghịm n’ihi ihe ọ bụla?[a]”
  to: Ndị Farisii bịakwutere ya, na-anwale ya, sị, “Iwu ò kwere ka nwoke gbaa nwunye ya alụkwaghịm n’ihi ihe kpatara ọ bụla?[a]”
  rationale: The revision retains the draft’s accurate legal framing and ambiguity while explicitly expressing the source term αἰτία as a reason or ground. It makes no doctrinal judgment about divorce.
  reviewer_model: gpt-5.6-terra
