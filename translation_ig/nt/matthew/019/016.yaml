id: MAT.19.16
reference: Matthew 19:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: ig
  text: Ma lee, otu onye bịakwutere ya wee sị ya, “Onye Ozizi, olee ezigbo ihe[a] m ga-eme ka m wee nwee ndụ ebighị ebi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “olee ezi omume m ga-eme ...?” Okwu Grik τί ἀγαθὸν pụrụ izo aka n’“ezigbo ihe” ma ọ bụ, n’ihi ngwaa “ime” so ya, dị ka “ezi omume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Ma lee
  rationale: “Ma” na-ejikọta akụkọ a na ihe bu ya ụzọ, ebe “lee” na-edobe ọrụ ἰδού nke ịkpọ uche onye na-agụ ka ọ hụ ihe na-eme.
- source_word: εἷς
  choice: otu onye
  rationale: Nke a na-edobe okwu Grik ahụ bụ́ “otu,” n’agbakwụnyeghị na ọ bụ nwoke ma ọ bụ nwa okorobịa tupu amaokwu ndị ọzọ akọwaa ya.
- source_word: προσελθὼν
  choice: bịakwutere ya
  rationale: Ọ na-egosi na onye ahụ buru ụzọ bịakwute Jizọs tupu ya agwa ya okwu; ntụgharị a dịkwa mfe ma bụrụ Igbo nkịtị.
- source_word: αὐτῷ εἶπεν
  choice: wee sị ya
  rationale: Nke a na-egosi onye a gwara okwu ma jikọta omume nke ịbịakwute ya na nke ikwu okwu n’usoro doro anya.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Ọ bụ aha a na-akpọ onye na-akụzi ihe; ọ naghị ebubata echiche ndị ọzọ okwu dị ka “Nna Ukwu” nwere ike iweta.
- source_word: τί ἀγαθὸν
  choice: olee ezigbo ihe
  rationale: Nke a na-edobe obosara okwu ahụ, nke pụrụ ịpụta ihe ọma n’ozuzu ya ma ọ bụ otu ezi omume a ga-eme.
- source_word: ποιήσω
  choice: m ga-eme
  rationale: N’ajụjụ a, “m ga-eme” na-egosipụta ajụjụ onye ahụ na-atụle banyere ihe ọ kwesịrị ime, n’enweghị ịgbakwụnye nkọwa ozizi.
- source_word: ἵνα σχῶ
  choice: ka m wee nwee
  rationale: “Ka” na-egosi ebumnuche ma ọ bụ ihe onye ahụ chọrọ ka omume ahụ rụpụta, ebe “nwee” bụ isi nghọta nke ἔχω.
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ okwu Igbo doro anya ma guzosie ike maka ndụ na-adịgide adịgide nke okwu Grik ahụ na-ezo aka na ya.
theological_decisions:
- issue: Ma a ga-akọwa onye bịara ahụ dị ka nwoke ma ọ bụ nwa okorobịa bara ọgaranya
  choice: otu onye
  alternative: otu nwoke; otu nwa okorobịa bara ọgaranya
  rationale: Amaokwu a n’onwe ya kwuru naanị εἷς, “otu.” Nkọwa ndị ọzọ dị n’akụkụ akụkọ ahụ ekwesịghị ibute ụzọ n’ebe a.
- issue: Otú a ga-esi chekwaa ajụjụ ahụ banyere ime ihe ọma na inwe ndụ ebighị ebi
  choice: olee ezigbo ihe m ga-eme ka m wee nwee ndụ ebighị ebi?
  alternative: olee ezi ọrụ m ga-arụ iji nweta ndụ ebighị ebi?
  rationale: Nhọrọ ahụ na-edobe ajụjụ onye ahụ nke lekwasịrị anya n’omume, ma ọ naghị ekpebi n’ime ntụgharị okwu ahụ ma ọrụ mmadụ ọ̀ na-eweta nzọpụta ma ọ bụ na ọ naghị eweta ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Ma lee” na-edobe ịdị ndụ nke akụkọ ahụ; “Onye Ozizi” bụ aha nkwanye ùgwù doro anya. E tinyere akara nkọwa ala peeji [a] kpọmkwem n’akụkụ okwu o metụtara.
