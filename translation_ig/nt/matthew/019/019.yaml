translation:
  language: ig
  text: “Sọpụrụ nna gị na nne gị,[a] hụkwa onye agbata obi gị n’anya dịka onwe gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ na-esochi usoro Grik nke ọma karị: “Sọpụrụ nna gị na nne gị, ị ga-ahụkwa onye agbata obi gị n’anya dịka onwe gị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίμα
  choice: Sọpụrụ
  rationale: “Sọpụrụ” na-egosi inye nne na nna nsọpụrụ ruuru ha, ọ bụghị naanị ịkwanyere ha ùgwù n’obi; ọ dabakwara n’ụdị iwu ahụ.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: nna gị na nne gị
  rationale: Ọ bụ ezie na Grik ji mkpụrụokwu njirimara mee ihe kama itinye nnọchiaha nke onye nwe ihe, iwu ahụ na-ekwu kpọmkwem banyere nna na nne onye a na-agwa okwu; Igbo chọrọ “gị” iji mee ka nke a doo anya ma bụrụkwa okwu ebumpụta ụwa.
- source_word: Ἀγαπήσεις
  choice: hụkwa … n’anya
  rationale: Ọ bụ ọdịdị ngwaa nke ọdịnihu n’asụsụ Grik, ma n’okwu iwu e hotara n’Iwu Mozis ọ na-arụ ọrụ dịka iwu. Ịsụ ya dịka iwu n’Igbo na-eme ka ike okwu ahụ na usoro ndepụta iwu ahụ pụta ìhè.
- source_word: τὸν πλησίον σου
  choice: onye agbata obi gị
  rationale: N’ọnọdụ iwu omume a, okwu ahụ pụtara mmadụ ibe onye nọ n’akụkụ mmekọrịta ya. “Onye agbata obi gị” bụ ntụgharị a maara nke ọma ma dabara n’ebe a.
- source_word: ὡς σεαυτόν
  choice: dịka ị hụrụ onwe gị
  rationale: Igbo ebumpụta ụwa na-achọ ka e kwughachi echiche ngwaa ahụ n’ahịrị ntụnyere a. Nke a na-edobe ihe Grik pụtara n’etinyeghị nkọwa ozizi ọzọ.
theological_decisions:
- issue: Ụdị iwu dị n’okwu e hotara n’iwu ndị ahụ
  choice: E ji ụdị iwu mee ma “Sọpụrụ” ma “hụkwa … n’anya” n’ahịrị bụ isi.
  alternative: “Sọpụrụ nna gị na nne gị, ị ga-ahụkwa onye agbata obi gị n’anya dịka ị hụrụ onwe gị.”
  rationale: Grik jikọtara ngwaa iwu Τίμα na ngwaa ọdịnihu Ἀγαπήσεις n’ihi na a na-ehota asụsụ iwu nke Tora. Iji ụdị iwu sụgharịa ha abụọ na-enye Igbo doro anya ma na-edobe ike ha dịka iwu; e debere ọdịdị Grik nke abụọ n’okpuru peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. “Sọpụrụ” na-echekwa ịdị arọ nke iwu ahụ; “hụ … n’anya” bụ ụzọ Igbo ebumpụta ụwa si ekwu ịhụnanya. Akara ntụaka [a] dị n’ahịrị bụ isi dịka achọrọ.
