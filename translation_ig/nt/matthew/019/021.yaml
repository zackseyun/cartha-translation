id: MAT.19.21
reference: Matthew 19:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: ig
  text: Jizọs sịrị ya, “Ọ bụrụ na ị chọrọ ịbụ onye zuru oke[a], gaa ree ihe ndị i nwere, nye ndị ogbenye, ị ga-enwekwa akụ n’eluigwe; mgbe ahụ bịa soro m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “onye tozuru etozu.” Okwu Grik a nwere ike ịpụta “onye zuru oke,” “onye tozuru etozu,” ma ọ bụ “onye mezuru emezu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: sịrị
  rationale: Ọ bụ okwu nkịtị e ji akọ na mmadụ kwuru ihe; ọ naghị atụkwasị ụzọ o si kwuo ya ihe ọzọ.
- source_word: τέλειος
  choice: onye zuru oke
  rationale: Nke a na-egosi izu oke ma ọ bụ ịbụ onye ihe na-adịghị akọ n’ịrara onwe ya nye, n’ebughị ụzọ kpebie na ọ pụtara enweghị mmehie kpamkpam.
- source_word: ὕπαγε
  choice: gaa
  rationale: Ọ bụ iwu ka ọ pụọ gaa mee ihe; “gaa” bụ ụzọ Igbo dị mfe ma kwekọọ na ya.
- source_word: πώλησόν
  choice: ree
  rationale: Ọ bụ iwu doro anya ka e ree ihe.
- source_word: τὰ ὑπάρχοντα
  choice: ihe ndị i nwere
  rationale: Nkebiokwu a na-ezo aka n’ihe mmadụ nwere ma ọ bụ akụ ya; ntụgharị a bụ nke mmadụ nkịtị ga-aghọta ngwa ngwa.
- source_word: δὸς πτωχοῖς
  choice: nye ndị ogbenye
  rationale: A hapụrụ ihe a ga-enye n’enweghị aha kpọmkwem dịka Grik si mee, kama ịgbakwunye “ego ya” nke ederede ahụ ekwughị kpọmkwem.
- source_word: ἕξεις
  choice: ị ga-enwekwa
  rationale: Nke a na-asụgharị ọdịnihu nke ἔχω n’ụzọ Igbo e ji ekwu okwu ugbu a; “-kwa” na-ejikọta nkwa ahụ na iwu ndị bu ya ụzọ.
- source_word: θησαυρὸν ἐν οὐρανοῖς
  choice: akụ n’eluigwe
  rationale: “Akụ” na-enye echiche nke ihe dị oke ọnụ ahịa echekwara; “n’eluigwe” bụ usoro Igbo dị mma maka ọtụtụ ọnụọgụ Grik οὐρανοῖς n’ebe a.
- source_word: δεῦρο
  choice: mgbe ahụ bịa
  rationale: “Bịa” na-egosipụta ọkpụkpọ ahụ, “mgbe ahụ” na-emekwa ka usoro iwu ndị ahụ doo anya n’Igbo.
- source_word: ἀκολούθει μοι
  choice: soro m
  rationale: Nke a bụ okwu Igbo doro anya maka iso mmadụ, ma na-echekwa ihe ọ pụtara n’ihe gbasara ịbụ onye na-eso ụzọ Jizọs.
theological_decisions:
- issue: Ihe τέλειος pụtara n’ihe gbasara iso ụzọ Jizọs
  choice: onye zuru oke
  alternative: onye tozuru etozu
  rationale: “Onye zuru oke” na-echekwa ike nke ihe Jizọs chọrọ na echiche nke ndụ na-erughị ihe ọ bụla n’ịrara onwe onye nye. Ihe odide nta na-echekwa echiche ọzọ nwere ike ịbụ nke ntozu, n’emeghị ka amaokwu ahụ kwuo ozizi pụrụ iche banyere enweghị mmehie.
translation_notes:
  register: 'E ji Standard Igbo nke dị ugbu a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro iwu Grik: gaa, ree, nye, bịa, soro. E tinyere akara ihe odide nta [a] ozugbo n’akụkụ okwu τέλειος ọ na-akọwa.'
