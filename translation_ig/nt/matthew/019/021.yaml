    issue: The footnote gloss “onye ihe na-adịghị akọ” is not idiomatic Standard Igbo and is not a suitable lexical alternative for τέλειος.
    rationale: τέλειος may denote being perfect, complete, or mature. The stated phrase is unclear in Igbo and introduces an unsupported, potentially misleading sense. The note should retain only clear alternatives such as “zuru oke” and “tozuru etozu.”
