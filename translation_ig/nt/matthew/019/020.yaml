  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ νεανίσκος· ⸂Πάντα ταῦτα⸃ ⸀ἐφύλαξα· τί ἔτι ὑστερῶ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: ig
  text: Nwa okorobịa ahụ sịrị ya, “Edebela m ihe ndị a niile. Gịnị ka m ka na-enweghị?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji historical present, ụdị akụkọ Igbo na-eji oge gara aga ‘sịrị’ mee ka okwu ahụ bụrụ nke eke ma doo anya.
- source_word: αὐτῷ
  choice: ya
  rationale: ‘Sịrị ya’ bụ ụzọ Igbo si ekwu nke ọma ma na-egosipụta onye a gwara okwu.
- source_word: ὁ νεανίσκος
  choice: nwa okorobịa ahụ
  rationale: νεανίσκος pụtara nwa okorobịa; nke a anaghị etinye echiche ‘onye ọchịchị’ nke na-adịghị n'amaokwu a.
- source_word: Πάντα ταῦτα
  choice: ihe ndị a niile
  rationale: Nke a na-ezo aka n'iwu niile a kpọtụrụ aha tupu okwu a, ma bụrụkwa okwu Igbo doro anya.
- source_word: ἐφύλαξα
  choice: Edebela m
  rationale: N'ọnọdụ a φυλάσσω pụtara idebe iwu. Ụdị ‘edebela m’ na-egosi omume gara aga nke ka metụtara ọnọdụ ugbu a.
- source_word: τί
  choice: Gịnị
  rationale: ‘Gịnị’ na-ebute ajụjụ ahụ n'ụzọ Igbo dị mfe ma kwekọọ na τί.
- source_word: ἔτι
  choice: ka
  rationale: N'usoro ‘ka na-enweghị,’ ‘ka’ na-egosipụta ihe fọdụrụ ma ọ bụ ọnọdụ ka dị.
- source_word: ὑστερῶ
  choice: na-enweghị
  rationale: ὑστερέω nwere ike ịpụta enweghị ihe ma ọ bụ iru ihe erughị eru; ‘na-enweghị’ na-echekwa echiche nke ihe ka dị ụkọ n'enweghị nkọwa agbakwunyere.
theological_decisions:
- issue: Ntụle nwa okorobịa ahụ banyere nrubeisi ya
  choice: A sụgharịrị nkwupụta ya ozugbo dị ka nkwupụta na o debela iwu ndị ahụ.
  alternative: Igosipụta ya dị ka onye mejọrọ onwe ya ma ọ bụ onye na-ekwubiga okwu ókè.
  rationale: Grik ekwughị ma nkwupụta ahụ ò ziri ezi, ò bụkwa ihe ijuanya. Nsụgharị ahụ ekwesịghị ikpebi esemokwu nkà mmụta okpukpe nke akụkọ gbara ya gburugburu hapụrụ oghe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Nwa okorobịa’ bụ okwu nkịtị maka young man; ‘Edebela m’ na ‘Gịnị ka m ka na-enweghị?’ na-eme ka mkparịta ụka ahụ daa nke ọma n'Igbo.
