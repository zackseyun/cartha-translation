  naturalness: The verse is clear and suitably formal in Standard Igbo. “Ndị ọnaozi” is an established biblical rendering for εὐνοῦχοι, and the repeated construction reads naturally. A small anchor relocation makes the note’s referent unambiguous.
  terminology: '“Ndị ọnaozi,” “afọ nne ha,” “alaeze eluigwe,” and “ịnabata” preserve the source wording and biblical register without forcing a doctrinal interpretation. The alternative-reading footnote needs idiomatic, precise Igbo: “ndị pịrị onwe ha amụ” is not a safe natural expression for ‘castrated themselves.’'
  issues:
