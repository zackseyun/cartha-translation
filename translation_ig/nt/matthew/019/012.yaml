    issue: Footnote [a] contains the unnatural expression “ndị pịrị onwe ha amụ.”
    rationale: The note is intended to preserve the lexical alternative ‘castrated themselves.’ “Pịrị ... amụ” does not naturally or clearly express castration in Standard Igbo. “ndị wepụrụ amụ nke onwe ha” is explicit and intelligible, while remaining confined to the explanatory note.
  - severity: low
    issue: Footnote [a] is anchored after “alaeze eluigwe,” rather than directly with the third occurrence of “ndị ... onwe ha ndị ọnaozi.”
    rationale: Its content concerns εὐνούχισαν ἑαυτούς (‘made themselves eunuchs’), not the phrase about the kingdom. Moving the anchor clarifies its scope without changing meaning.
