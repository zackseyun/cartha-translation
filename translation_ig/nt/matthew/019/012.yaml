id: MAT.19.12
reference: Matthew 19:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: ig
  text: N’ihi na e nwere ndị ọnaozi a mụrụ otu ahụ site n’afọ nne ha; e nwekwara ndị ọnaozi ndị mmadụ mere ka ha bụrụ ndị ọnaozi; e nwekwara ndị mere onwe ha ndị ọnaozi[a] n’ihi alaeze eluigwe. Onye nwere ike ịnabata nke a, ya nabata ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị wepụrụ amụ nke onwe ha.” Ọtụtụ ndị na-akọwa okwu a na-aghọta ya dịka ihe atụ nke ịhọrọ ịghara ịlụ di ma ọ bụ nwunye n’ihi alaeze Chineke.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsị, “Onye nwere ike ịnata nke a, ya nata ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: ndị ọnaozi
  rationale: Okwu Igbo a na-akpọ ndị ọnaozi na-echekwa otu aha ahụ ugboro atọ dịka Grik si mee, kama ịkọwa ya ozugbo dị ka ndị họọrọ ịnọ n’alụghị di ma ọ bụ nwunye.
- source_word: ἐκ κοιλίας μητρὸς
  choice: site n’afọ nne ha
  rationale: Nke a na-echekwa ihe atụ doro anya nke Grik banyere ọnọdụ ha malitere na ya kemgbe ha nọ n’afọ nne ha.
- source_word: ἐγεννήθησαν οὕτως
  choice: a mụrụ otu ahụ
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke okike isi kwuo na ha dị otu ahụ site n’ọmụmụ.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: ndị mmadụ mere ka ha bụrụ ndị ọnaozi
  rationale: Nke a na-echekwa njikọ okwu dị n’etiti aha εὐνοῦχοι na ngwaa εὐνουχίσθησαν, ma ghara ime ka ihe gbasara ahụ pụta karịa ka isi okwu ahụ chọrọ.
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: ndị mere onwe ha ndị ọnaozi
  rationale: Nsụgharị a na-edobe okwu Grik ahụ siri ike n’enweghị mkpebi n’ime ederede ma ọ bụ ihe nkịtị, ikwubiga okwu ókè, ma ọ bụ ihe atụ banyere ịhọrọ ịghara ịlụ di ma ọ bụ nwunye.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: n’ihi alaeze eluigwe
  rationale: Nke a na-egosi ebumnuche ma ọ bụ ihe kpaliri omume ahụ n’ihi ọchịchị Chineke, dịka διά tinyere accusative si arụ ọrụ n’ebe a.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: Onye nwere ike ịnabata nke a, ya nabata ya
  rationale: “Ịnabata” na-egosi echiche idiom χωρέω nke ime ohere maka ma ọ bụ ịnakwere nkuzi siri ike, ebe “ya nabata ya” na-echekwa ike iwu nke imperative.
theological_decisions:
- issue: Ma εὐνούχισαν ἑαυτοὺς ọ̀ bụ okwu nkịtị ka ọ bụ ihe atụ
  choice: E debere ya dịka “ndị mere onwe ha ndị ọnaozi” n’ederede bụ isi.
  alternative: “ndị pịrị onwe ha amụ,” ma ọ bụ “ndị họọrọ ịghara ịlụ di ma ọ bụ nwunye.”
  rationale: Amaokwu ahụ akọwaghị kpọmkwem ma okwu a ọ bụ ihe nkịtị, ikwubiga okwu ókè, ma ọ bụ ihe atụ. Nsụgharị ahụ na-echekwa esemokwu a; nkọwa ala peeji na-egosi ụzọ ndị ọzọ e si aghọta ya.
- issue: Ihe χωρεῖν pụtara n’okwu mmechi
  choice: “ịnabata nke a”
  alternative: “ịnata nke a” ma ọ bụ “ime ohere maka nke a.”
  rationale: “Ịnabata” bụ okwu Igbo nke oge a na-egosi ịghọta na ikwere ịgbaso nkuzi siri ike, n’enweghị ibelata ike agbamume ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta mee ihe. A họọrọ “ndị ọnaozi” dịka okwu aha na-echekwa nkwughachi Grik na mgbagwoju anya nke amaokwu ahụ. E tinyere akara [a] n’akụkụ okwu ọ na-akọwa banyere ime onwe onye ọnaozi, tinyekwa [b] n’akụkụ agbamume mmechi.
