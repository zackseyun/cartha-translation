  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: ig
  text: N’ihi na ọ bụghị unu bụ ndị na-ekwu okwu, kama ọ bụ Mmụọ nke Nna unu na-ekwu okwu n’ime unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ọnụ unu.” N’asụsụ Grik, okwu ahụ bụ “n’ime unu,” ma n’ebe a ọ pụkwara ịpụta na Mmụọ ahụ na-ekwu okwu site n’ọnụ ndị na-eso ụzọ.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: N’ihi na ọ bụghị
  rationale: “N’ihi na” na-egosi na okwu a na-akọwa nkwa e kwuru n’amaokwu bu ya ụzọ, ebe “ọ bụghị” na-edobe nkwugide ahụ.
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: unu bụ ndị na-ekwu okwu
  rationale: Usoro a na-edobe nkwusi ike dị n’aha nnọchiaha ὑμεῖς nakwa echiche nke ndị bụ ndị na-ekwu okwu n’ezie.
- source_word: ἀλλὰ
  choice: kama ọ bụ
  rationale: Nke a na-egosi ọdịiche siri ike n’etiti ndị na-eso ụzọ na onye na-ekwu okwu n’ezie.
- source_word: τὸ πνεῦμα
  choice: Mmụọ
  rationale: N’ebe a, okwu ahụ na-ezo aka na Mmụọ Chineke; mkpụrụedemede ukwu na-eme ka onye a na-ekwu maka ya doo anya n’Igbo.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: Nna unu
  rationale: Nke a na-edobe njikọ ahụ kpọmkwem dịka Grik si kwuo, na-agbakwụnyeghị “nke eluigwe,” nke na-adịghị n’amaokwu a.
- source_word: τὸ λαλοῦν
  choice: na-ekwu okwu
  rationale: Oge omume na-aga n’ihu dị na participle Grik ahụ ka e debere, ọ na-ezokwa aka na Mmụọ, ọ bụghị Nna.
- source_word: ἐν ὑμῖν
  choice: n’ime unu
  rationale: Nke a bụ nkọwa kacha nso nke ἐν, ma ọ naghị ekpebi kpamkpam ma ihe a na-emesi ike bụ ịnọ n’ime ha ka ọ bụ ikwu okwu site n’ọnụ ha.
theological_decisions:
- issue: Ma ἐν ὑμῖν pụtara na Mmụọ ahụ nọ “n’ime unu” ka ọ bụ na ọ na-ekwu okwu “site n’ọnụ unu”
  choice: n’ime unu
  alternative: site n’ọnụ unu
  rationale: Ihe Grik kwuru kpọmkwem bụ ἐν, nke pụtarakarị “n’ime.” Ebe ihe gbara ya gburugburu na-ekwu maka okwu Mmụọ nyere ndị na-eso ụzọ, “site n’ọnụ unu” ga-ekwe omume; ma itinye ya n’amaokwu n’onwe ya ga-ekpebi ihe Grik hapụrụ ka o nwee akụkụ abụọ.
translation_notes:
  register: E ji Standard Igbo nke dị mfe, kwụ ọtọ, ma nwee ugwu dee ya. “Unu bụ ndị na-ekwu okwu” na-edobe nkwusi ike dị n’usoro Grik, ebe “Mmụọ Nna unu” na-ada nke ọma n’Igbo ma ghara ịgbakwunye echiche na-adịghị na isi mmalite.
