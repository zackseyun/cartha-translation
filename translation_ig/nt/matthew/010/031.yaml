id: MAT.10.31
reference: Matthew 10:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: ig
  text: Ya mere, unu atụla egwu; unu bara uru karịa ọtụtụ nza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν φοβεῖσθε
  choice: Ya mere, unu atụla egwu
  rationale: “Ya mere” na-egosi nkwubi okwu sitere n’ihe Jizọs kwuru tupu nke a banyere nlekọta Nna; “unu atụla egwu” bụ iwu mgbochi doro anya ma bụrụkwa Igbo nkịtị.
- source_word: πολλῶν στρουθίων
  choice: ọtụtụ nza
  rationale: στρουθίον n’ọnọdụ a na-ezo aka na nza, dịka amaokwu 29 si gosi; ọtụtụ na-echekwa ọtụtụ nke okwu Grik ahụ.
- source_word: διαφέρετε
  choice: dị oké ọnụ ahịa karịa
  rationale: N’ebe a διαφέρω pụtara ịkarị n’uru ma ọ bụ n’ịdị mkpa, ọ bụghị nanị ịdị iche; okwu a na-egosipụta ntụnyere ahụ n’Igbo eke.
- source_word: ὑμεῖς
  choice: unu
  rationale: Nnọchiaha ahụ e kwuru hoo haa na Grik na-emesi ndị na-ege Jizọs ntị ike; “unu” na-echekwa nkwusi ike ahụ ma kwekọọ na ọtụtụ mmadụ a na-agwa okwu.
theological_decisions:
- issue: Uru ndị na-eso ụzọ Jizọs bara ma e jiri ha tụnyere nza
  choice: unu dị oké ọnụ ahịa karịa ọtụtụ nza
  alternative: unu bara uru karịa ọtụtụ nza
  rationale: Nhọrọ a na-echekwa ntụnyere nke διαφέρετε n’ihe gbasara uru na mkpa, ma ọ naghị agọnahụ na Chineke na-elekọta anụmanụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe nghọta ma dịkwa nsọpụrụ. “Ya mere” na-ejikọta amaokwu ahụ na arụmụka gara aga, ebe “dị oké ọnụ ahịa karịa” na-enye echiche nke uru n’ụzọ eke.
