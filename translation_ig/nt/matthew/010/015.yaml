id: MAT.10.15
reference: Matthew 10:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: ig
  text: 'N’ezie, ana m agwa unu: n’ụbọchị ikpe, ọ ga-adị mfe karị maka ala Sọdọm na Gọmọra[b] ịnagide[a] karịa maka obodo ahụ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ga-adị mfe ịnagide karịa.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Sọdọm na Gọmọra.” N’asụsụ Grik, e kwuru ya kpọmkwem dịka “ala Sọdọm na Gọmọra.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “obodo ukwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: N’ezie
  rationale: N’okwu mmeghe a Jizọs ji emesi ihe ọ na-ekwu ike, “N’ezie” na-egosipụta nkwenye siri ike nke ἀμήν n’Igbo doro anya ma dịkwa ebube.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu okwu ahụ kpọmkwem, ma na-echekwa onye na-ekwu na ndị ọ na-agwa.
- source_word: ἀνεκτότερον
  choice: ihe ga-adịrị … mfe ịnagide karịa
  rationale: 'Usoro a na-egosipụta ntụnyere ahụ nke ọma n’Igbo: ikpe ahụ ga-adị mfe karịa ka a ga-esi nagide ya, n’enweghị ịkọwa ụdị ntaramahụhụ karịrị ihe ederede kwuru.'
- source_word: γῇ
  choice: ala
  rationale: γῇ ebe a na-ezo aka n’ala ma ọ bụ mpaghara nke Sọdọm na Gọmọra, ọ bụghị ụwa dum; “ala” na-echekwa oyiyi ala ahụ nke Grik.
- source_word: Σοδόμων καὶ Γομόρρων
  choice: Sọdọm na Gọmọra
  rationale: A sụgharịrị aha ebe ndị a n’ụdị a maara nke ọma n’Igbo.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: n’ụbọchị ikpe
  rationale: Nke a na-echekwa echiche banyere ụbọchị ikpe Chineke n’ọdịnihu n’enweghị itinye usoro ozizi zuru ezu nke ederede ahụ na-ekwughị.
- source_word: πόλει
  choice: obodo
  rationale: “Obodo” bụ okwu Igbo sara mbara nke nwere ike ịpụta town ma ọ bụ city, ya mere ọ dabara na πόλις ma na-ahapụ obosara ihe okwu Grik nwere ike ịpụta.
- source_word: ἐκείνῃ
  choice: ahụ
  rationale: “Ahụ” na-arụ ọrụ ngosipụta nke ἐκείνῃ, na-ezo aka n’obodo a kpọtụrụ aha na mbụ.
theological_decisions:
- issue: Ụdị “ụbọchị ikpe” bụ
  choice: A sụgharịrị ya dịka ụbọchị ikpe Chineke, ma akọwaghị nkọwa ozizi ya karịa ihe ederede kwuru.
  alternative: Ịghọta ya dịka oge ikpe n’ozuzu ya.
  rationale: Akụkụ okwu Grik na-egosi ụbọchị ikpe pụrụ iche, ma nsụgharị ahụ ekwesịghị ịgbakwunye usoro ihe ga-eme n’ụbọchị ahụ nke amaokwu a na-ekwughị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma dịkwa nsọpụrụ. A haziri ahịrịokwu ahụ ka ntụnyere ya doo anya n’Igbo, ebe a ka na-echekwa okwu “ala” na ịdị obosara nke “obodo.”
