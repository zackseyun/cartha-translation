review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys receiving the messengers, listening to their words, leaving a specified house or town, and shaking dust from the feet. However, “Onye ọ bụla na-anabataghị” reads primarily as a habitual descriptive relative clause. The Greek ὃς ἂν μὴ with subjunctives has an explicitly indefinite conditional sense, more clearly represented in Standard Igbo by “Ọ bụrụ na onye ọ bụla ... anabataghị ... ma ọ bụ ... egeghị ... ntị.”
  naturalness: The revised conditional construction is natural modern Standard Igbo and makes the relationship between the condition and the imperative clear. “Tichapụ ájá dị n’ụkwụ unu” is retained as a clear, suitably formal imperative that preserves the concrete image.
  terminology: “Ịnabata,” “ige ... ntị,” “ụlọ,” “obodo,” and “ájá” are appropriate and clear. The cultural footnote is adjusted to identify the agents of dissociation and to state judgment as being against the rejecters, without importing wording from parallel passages.
  issues:
  - severity: medium
    issue: Conditional force is not explicit in the main clause.
    rationale: The source uses an indefinite relative conditional construction (ὃς ἂν μὴ ... δέξηται ... ἀκούσῃ). The draft’s present-negative wording can sound habitual rather than conditional. Recasting with “Ọ bụrụ na” and perfective negatives preserves the source relation more directly.
  - severity: low
    issue: Cultural note leaves the subject of “kewapụrụ onwe ha” unclear.
    rationale: The note should specify that the messengers are the ones performing the symbolic dissociation, while retaining the modest explanatory scope of the English audit trail.
  revised_text: Ọ bụrụ na onye ọ bụla anabataghị unu ma ọ bụ egeghị okwu unu ntị[a], mgbe unu na-apụ n’ụlọ ahụ ma ọ bụ n’obodo ahụ[c], tichapụ ájá dị n’ụkwụ unu[b].
