id: MAT.10.14
reference: Matthew 10:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: ig
  text: Ọ bụrụ na onye ọ bụla anabataghị unu ma ọ bụ egeghị okwu unu ntị[a], mgbe unu na-apụ n’ụlọ ahụ ma ọ bụ n’obodo ahụ[c], tichapụ ájá dị n’ụkwụ unu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anụghị okwu unu.”
    reason: lexical_alternative
  - marker: b
    text: “Ịtichapụ ájá dị n’ụkwụ unu” bụ omume ihe ịrịba ama nke ndị ozi ahụ ji egosi na ha kewapụrụ onwe ha n’ebe ndị jụrụ ozi ahụ nọ, nakwa nke ikpe megide ndị ahụ.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “n’ụlọ ahụ ma ọ bụ n’obodo ukwu ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: Onye ọ bụla na-anabataghị
  rationale: Nkebiokwu a nwere echiche gbasara onye ọ bụla nke ọnọdụ a metụtara. “Onye ọ bụla” na-egosipụta nke a n’Igbo dị ugbu a, ebe ụdị ngwaa na-adịghị egosi ọnọdụ a kpọtụrụ aha.
- source_word: δέξηται ὑμᾶς
  choice: anabataghị unu
  rationale: “Ịnabata” nwere ike ịgụnye ma ile ndị ozi ọbịa nke ọma ma ịnabata ọrụ ha; ọ naghị eme ka otu akụkụ n’ime ha bụrụ naanị ihe okwu ahụ pụtara.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: ma ọ bụ na-egeghị okwu unu ntị
  rationale: “Ige ... ntị” na-egosi ịnụrụ ozi ahụ nke ọma ma ghara ịgbakwụnye echiche doro anya nke irube isi, nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: ἐξερχόμενοι ἔξω
  choice: mgbe unu na-apụ
  rationale: Nke a na-egosipụta omume ịpụ n’ebe ahụ nke na-aga n’ihu tupu iwu bụ isi ahụ, n’ụzọ Igbo sitere n’okike.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: n’ụlọ ahụ ma ọ bụ n’obodo ahụ
  rationale: “Ahụ” na-echekwa ntụaka ahụ kpọmkwem; “obodo” nwere ike ịpụta obodo nta ma ọ bụ obodo ukwu, dịka πόλις si dị n’ebe a.
- source_word: ἐκτινάξατε
  choice: tichapụ
  rationale: “Ịtichapụ” na-egosipụta mmegharị siri ike nke iwepụ ihe site n’ịtụ ya, ma na-adabara ájá dị n’ụkwụ.
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: ájá dị n’ụkwụ unu
  rationale: Nke a na-echekwa ihe oyiyi doro anya nke ájá a na-ewepụ n’ụkwụ ndị ozi.
theological_decisions:
- issue: Omume ihe ịrịba ama nke ikpe megide ndị jụrụ ndị na-eso ụzọ na ozi ha
  choice: 'E debere iwu ahụ n’ụdị ihe a na-ahụ anya: “tichapụ ájá dị n’ụkwụ unu.”'
  alternative: Ịgbakwunye “ka ọ bụrụ ihe akaebe megide ha” ma ọ bụ ịsụgharị ya ozugbo dịka ịhapụ ha n’okpuru ikpe.
  rationale: Amaokwu a n’onwe ya nyere omume ahụ, ma ọ kọwaghị ihe ọ pụtara n’okwu ndị ahụ. Ịhapụ ihe oyiyi ahụ n’ahịrịokwu bụ isi na-ezere ibubata nkọwa sitere n’amaokwu ndị yiri ya.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke nwere ugwu ma dị mfe nghọta. “Onye ọ bụla,” “ige ... ntị,” na “mgbe unu na-apụ” na-eme ka ahịrịokwu ahụ bụrụ nke sitere n’okike n’Igbo, ebe “tichapụ ájá” na-echekwa ihe oyiyi siri ike nke ederede Grik.
