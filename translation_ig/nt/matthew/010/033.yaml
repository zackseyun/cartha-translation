source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: ig
  text: Ma onye ọ bụla ga-agọnahụ m n'ihu ndị mmadụ, mụ kwa ga-agọnahụ ya n'ihu Nna m nke nọ n'eluigwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N''ụzọ nkịtị, okwu Grik a sụgharịrị “eluigwe” dị n''ụdị ọtụtụ: “n''eluigwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: Ma onye ọ bụla
  rationale: “Ma” na-egosi ọdịiche dị n’etiti amaokwu a na nke bu ya ụzọ; “onye ọ bụla” na-egosikwa na okwu a metụtara onye ọbụla dabara n’ọnọdụ ahụ.
- source_word: ἀρνήσηταί με
  choice: ga-agọnahụ m
  rationale: “Ịgọnahụ” na-egosi ịjụ ma ọ bụ ịnapụ mmadụ nkwenye n’ihu ọha, ma na-edobekwa okwu ahụ n’enweghị nkọwa agbakwunyere.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: n'ihu ndị mmadụ
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji eme ihe maka ịnọ ma ọ bụ ime ihe n’ihu ndị ọzọ; “ndị mmadụ” na-eburu echiche izugbe nke okwu Grik ahụ.
- source_word: ἀρνήσομαι κἀγὼ αὐτὸν
  choice: mụ onwe m ga-agọnahụkwa ya
  rationale: “Mụ onwe m” na “-kwa” na-echekwa nkwusi ike na nzaghachi kwekọrọ ekwekọ dị na κἀγώ; otu ngwaa ahụ na-echekwa myirịta okwu nke amaokwu ahụ.
- source_word: τοῦ πατρός μου
  choice: Nna m
  rationale: Nke a na-echekwa aha mmekọrịta Jizọs ji kpọọ Nna ya, n’enweghị mgbasawanye.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: onye nọ n'eluigwe
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka ebe obibi nke eluigwe; a na-edebe ọdịdị ọtụtụ nke okwu Grik na nkọwa ala peeji.
theological_decisions:
- issue: Nzaghachi kwekọrọ ekwekọ n’ịgọnahụ
  choice: ga-agọnahụ m … mụ onwe m ga-agọnahụkwa ya
  alternative: ga-ajụ m … mụ onwe m ga-ajụkwa ya
  rationale: Iji otu ngwaa mee ihe ugboro abụọ na-echekwa njikọ siri ike na ịdị oké mkpa nke okwu Jizọs, n’etinyeghị nkọwa okpukpe ọzọ na-adịghị n’ihe odide ahụ.
- issue: Ndị ἀνθρώπων na αὐτόν na-anọchi anya ha
  choice: ndị mmadụ … ya
  alternative: ụmụ nwoke … nwoke ahụ
  rationale: N’ebe a, ἀνθρώπων na-ezo aka n’ụmụ mmadụ n’izugbe, ọ bụghị naanị ụmụ nwoke. Igbo “ndị mmadụ” na nnọchiaha “ya” na-echekwa echiche ahụ n'ụzọ ebumpụta ụwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ usoro okwu na-echekwa ọdịiche “Ma,” nkwusi ike dị na “mụ onwe m … -kwa,” na myirịta nke ngwaa abụọ ahụ.
