revisions:
- from: Gwọọnụ ndị ọrịa, kpọlite ndị nwụrụ anwụ, mee ka ndị ekpenta[a] dị ọcha, chụpụkwa ndị mmụọ ọjọọ. Unu natara n’efu; nyekwa n’efu.
  to: Gwọọnụ ndị ọrịa, kpọlitenụ ndị nwụrụ anwụ[b], meenụ ka ndị ekpenta[a] dị ọcha, chụpụnụ mmụọ ọjọọ. Unu natara n’efu; nyenụ n’efu.
  rationale: The revised text maintains the Greek imperatives, their order, and the repeated δωρεάν (“n’efu”), while using clear Standard Igbo plural commands. It retains the physical-and-ritual breadth of καθαρίζετε through 'mee ka ... dị ọcha,' removes additions absent from the source, and supplies a textual footnote for the clause bracketed in SBLGNT.
