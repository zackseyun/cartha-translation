id: MAT.10.8
reference: Matthew 10:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: ig
  text: Gwọọnụ ndị ọrịa, kpọlitenụ ndị nwụrụ anwụ[b], meenụ ka ndị ekpenta[a] dị ọcha, chụpụnụ mmụọ ọjọọ. Unu natara n’efu; nyenụ n’efu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nwere ọrịa akpụkpọ anụ.” Okwu a na-asụgharịkarị “ndị ekpenta” nwere ike ịgụnye ọrịa akpụkpọ anụ ndị ọzọ siri ike n’oge Baịbụl, ọ bụghị naanị ekpenta a maara n’oge a.
    reason: cultural_note
  - marker: b
    text: Ụfọdụ ihe odide mbụ anaghị agụnye, “kpọlitenụ ndị nwụrụ anwụ.”
    reason: textual_note
lexical_decisions:
- source_word: ἀσθενοῦντας
  choice: ndị ọrịa
  rationale: N’ọnọdụ a, okwu a na-ezo aka n’ebe ndị na-arịa ọrịa nọ; “ndị ọrịa” bụ Igbo doro anya ma dị nkenke.
- source_word: θεραπεύετε
  choice: Gwọọnụ
  rationale: Okwu iwu a pụtara ịgwọ ọrịa; “Gwọọnụ” dabara n’ọrụ ọgwụgwọ ọrụ ebube a na-enye ndị na-eso ụzọ.
- source_word: νεκροὺς ἐγείρετε
  choice: kpọlite ndị nwụrụ anwụ
  rationale: Nkebi a pụtara ime ka ndị nwụrụ anwụ bilie, ọ bụghị nanị ịkpọte ndị na-ehi ụra.
- source_word: λεπροὺς
  choice: ndị ekpenta
  rationale: “Ndị ekpenta” bụ okwu ọdịnala a na-aghọta nke ọma, ebe nkọwa ala peeji na-egosi na okwu Grik ahụ nwere ike ịgụnye ọrịa akpụkpọ ndị ọzọ siri ike.
- source_word: καθαρίζετε
  choice: mee ka ... dị ọcha
  rationale: Nke a na-echekwa ma echiche mgbake anụ ahụ ma nke ịdị ọcha n’usoro okpukpe, kama ikwu naanị “gwọọ.”
- source_word: δαιμόνια ἐκβάλλετε
  choice: chụpụkwa ndị mmụọ ọjọọ
  rationale: “Chụpụ” na-egosipụta ike nke iwepụ ha, “ndị mmụọ ọjọọ” bụkwa okwu Igbo nkịtị maka δαιμόνια.
- source_word: δωρεὰν ἐλάβετε, δωρεὰν δότε
  choice: Unu natara n’efu; nyekwa n’efu
  rationale: “N’efu” na-egosi na e nweghị ụgwọ a kwụrụ ma na-echekwa nhazi na nkwughachi okwu dị n’ahịrị Grik.
theological_decisions:
- issue: Oke iwu ndị metụtara ọrụ ebube
  choice: A sụgharịrị ha dịka iwu kpọmkwem e nyere ndị ozi n’ọrụ ha.
  alternative: Ịghọta ụfọdụ n’ime ha dịka ihe atụ ma ọ bụ naanị dịka omume chọọchị nke oge mechara.
  rationale: Grik ji ọtụtụ ngwaa iwu kpọmkwem depụta ọrụ ndị a. Nsụgharị ahụ anaghị eme ka ha bụrụ ihe atụ, ọ naghịkwa ekpebi ma iwu ndị a ga-adịgide ruo oge na-adịghị agwụ agwụ.
- issue: Ihe καθαρίζετε pụtara n’ebe ndị ekpenta nọ
  choice: “mee ka ... dị ọcha”
  alternative: “gwọọ”
  rationale: Nhọrọ a na-echekwa esemokwu dị n’etiti ọgwụgwọ anụ ahụ na ịdị ọcha n’usoro okpukpe nke okwu Grik ahụ nwere ike ibu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A nọgidere na-eji ụdị iwu ọtụtụ mmadụ (-nụ), mee ka usoro ahịrị ahụ dị nkenke ma nwee ụda siri ike dịka Grik.
