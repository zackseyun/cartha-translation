id: MAT.10.27
reference: Matthew 10:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: ig
  text: Ihe m na-agwa unu n’ọchịchịrị[a], kwuonụ ya n’ìhè; ihe unu na-anụkwa ná ntị[b], kwusaanụ ya n’elu ụlọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na nzuzo ... n’ihu ọha”; okwu Grik ahụ na-edobe ihe oyiyi “n’ọchịchịrị ... n’ìhè.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ihe unu nụrụ na nzuzo ka unu kwupụta n’ihu ọha. Ụlọ ọtụtụ ndị n’oge ahụ nwere elu dị larịị, nke a pụrụ isi na ya mee ka ọkwa ruo ọtụtụ mmadụ.
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: Ihe m na-agwa unu
  rationale: 'Ọ bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche nke okwu Grik ahụ: ihe Jizọs na-agwa ndị na-eso ụzọ ya.'
- source_word: ἐν τῇ σκοτίᾳ
  choice: n’ọchịchịrị
  rationale: Nke a na-edobe onyinyo okwu Grik ma na-emegide ya nke ọma na ‘n’ìhè’; ọ pụkwara ịpụta na nzuzo.
- source_word: εἴπατε
  choice: kwuonụ ya
  rationale: Ụdị iwu a na-agwa ọtụtụ mmadụ ka ha kwuo ihe ahụ; ‘ya’ na-eme ka ahịrịokwu Igbo doo anya ma na-ezo aka n’ihe a gwara ha.
- source_word: ἐν τῷ φωτί
  choice: n’ìhè
  rationale: Ọ na-echekwa ntụnyere doro anya dị n’etiti ọchịchịrị na ìhè, kama ịtụgharị ya naanị dịka ‘n’ihu ọha.’
- source_word: ὃ εἰς τὸ οὖς ἀκούετε
  choice: ihe unu na-anụkwa ná ntị
  rationale: Nke a na-edobe ihe oyiyi Grik banyere ịnụ ihe ná ntị, ya bụ, ozi e nyere mmadụ na nzuzo.
- source_word: κηρύξατε
  choice: kwusaanụ ya
  rationale: ‘Kwasaanụ’ na-egosi ikwupụta ozi n’ihu ọha dịka onye nkwusa, n’enweghị ime ka ọ bụrụ naanị okwuchukwu okpukpe.
- source_word: ἐπὶ τῶν δωμάτων
  choice: n’elu ụlọ
  rationale: Nke a bụ ụzọ Igbo eke si kọwaa ịnọ n’elu ụlọ, ma na-echekwa ọnọdụ ụlọ ndị oge ochie nwere elu dị larịị maka nkwupụta n’ihu ọha.
theological_decisions:
- issue: Ma a ga-edobe ihe oyiyi ọchịchịrị/ìhè na ntị/elu ụlọ, ka a kọwaa ya ozugbo dịka nzuzo/ihu ọha
  choice: E debere ihe oyiyi ndị ahụ n’ahịrịokwu bụ isi.
  alternative: ‘Ihe m na-agwa unu na nzuzo, kwuonụ ya n’ihu ọha; ihe a takwunyere unu, kwusaanụ ya n’ihu mmadụ niile.’
  rationale: Okwu Grik ji ihe oyiyi ndị a mee ka ọdịiche dị n’etiti ozi nzuzo na nkwupụta ọha pụta ìhè. Idebe ha na-echekwa ike na nghọta sara mbara nke okwu Jizọs n’etinyeghị nkọwa otu òtù okpukpe.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ụdị iwu ọtụtụ mmadụ ‘kwuonụ’ na ‘kwusaanụ,’ ma debe ihe oyiyi na ọdịiche okwu Grik ahụ.
