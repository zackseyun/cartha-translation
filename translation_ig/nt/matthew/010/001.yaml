revisions:
- from: Mgbe ọ kpọrọ ndị na-eso ụzọ ya iri na abụọ ka ha bịakwute ya[a], o nyere ha ikike ịchịkwa mmụọ ndị na-adịghị ọcha[b], ka ha wee chụpụ ha ma gwọọ ọrịa niile na adịghị ike niile.[c]
  to: Mgbe ọ kpọrọ ndị na-eso ụzọ ya iri na abụọ ka ha bịakwute ya[a], o nyere ha ikike n’ebe mmụọ ndị na-adịghị ọcha nọ[b], ka ha wee chụpụ ha ma gwọọ ọrịa niile na adịghị ike niile[c].
  rationale: The revision replaces “ịchịkwa” with an expression for authority over, thereby retaining the delegated-authority sense of ἐξουσία without adding a notion of governing or controlling spirits. It also corrects the placement of footnote [c] and adjusts footnote [a] so its alternative does not introduce an imperfect/progressive sense absent from the aorist participle.
