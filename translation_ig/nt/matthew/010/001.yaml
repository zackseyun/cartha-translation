id: MAT.10.1
reference: Matthew 10:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: ig
  text: Mgbe ọ kpọrọ ndị na-eso ụzọ ya iri na abụọ ka ha bịakwute ya[a], o nyere ha ikike n’ebe mmụọ ndị na-adịghị ọcha nọ[b], ka ha wee chụpụ ha ma gwọọ ọrịa niile na adịghị ike niile[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ka ọ kpọrọ ndị na-eso ụzọ ya iri na abụọ ka ha bịakwute ya.”'
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “ikike” ebe a dịka “ike.” Okwu Grik bụ exousia na-egosikarị ikike e nyere mmadụ ime ihe.
    reason: lexical_alternative
  - marker: c
    text: Okwu abụọ a, “ọrịa niile na adịghị ike niile,” na-anọchi anya okwu Grik abụọ yiri onwe ha (nosos na malakia). A pụkwara ịsụgharị nke abụọ dịka “ahụ́ erughị ala niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Mgbe ọ kpọrọ ... ka ha bịakwute ya
  rationale: Nkebi a na-egosi na ọ kpọrọ ha bịakwute ya. “Mgbe” na-eme ka njikọ ya na ngwaa bụ́ isi doo anya n’Igbo, ebe ihe e dere n’okpuru [a] na-edebe ohere nke ịsụgharị participle ahụ n’enweghị ime ka oge ya sie ike.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: ndị na-eso ụzọ ya iri na abụọ
  rationale: “Ndị na-eso ụzọ” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa μαθηταί; “ya” na-edebe αὐτοῦ.
- source_word: ἔδωκεν
  choice: o nyere ha
  rationale: Nke a na-enye δίδωμι n’ụzọ kwụ ọtọ ma dịkwa eke n’Igbo.
- source_word: ἐξουσίαν
  choice: ikike
  rationale: “Ikike” nwere ike ịpụta ikike e nyere mmadụ ime ihe, ọ bụghị naanị ume ma ọ bụ ike nkịtị.
- source_word: πνευμάτων ἀκαθάρτων
  choice: ịchịkwa mmụọ ndị na-adịghị ọcha
  rationale: “Ịchịkwa” na-egosi na ikike ahụ dị n’ebe mmụọ ndị ahụ nọ; “mmụọ ndị na-adịghị ọcha” na-edebe okwu Grik ahụ n’ụzọ doro anya.
- source_word: ὥστε ἐκβάλλειν αὐτά
  choice: ka ha wee chụpụ ha
  rationale: “Ka ... wee” na-edebe njikọ nzube/ihe si na ya pụta nke ὥστε na infinitive n’enweghị ikpebi naanị otu n’ime ha; “ha” na-alaghachi n’ebe mmụọ nọ.
- source_word: θεραπεύειν
  choice: gwọọ
  rationale: “Ịgwọ” bụ okwu Igbo nkịtị maka ime ka onye ọrịa gbakee.
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: ọrịa niile na adịghị ike niile
  rationale: 'A hapụrụ okwu abụọ ahụ iche: νόσος dịka “ọrịa,” μαλακία dịka “adịghị ike,” kama ijikọ ha ka ha bụrụ naanị otu echiche.'
theological_decisions:
- issue: Ụdị ikike e nyere ndị na-eso ụzọ ahụ
  choice: Jizọs nyere ha ikike ịchịkwa mmụọ ndị na-adịghị ọcha
  alternative: Jizọs nyere ha ike megide mmụọ ndị na-adịghị ọcha
  rationale: ἐξουσία na-elekwasị anya n’ikike e nyere ha ime ihe. “Ikike” na-edebe nke a n’ebughị ụzọ gbanwee ya ka ọ bụrụ naanị ike nkịtị; ihe e dere n’okpuru [b] na-egosi nsụgharị ọzọ kwere omume.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “ndị na-eso ụzọ” kama okwu mbinye, “mmụọ ndị na-adịghị ọcha” maka okwu Oziọma ahụ, na “ka ha wee” iji chekwaa nghọta nke nwere ike ịbụ nzube ma ọ bụ ihe si na ya pụta.
