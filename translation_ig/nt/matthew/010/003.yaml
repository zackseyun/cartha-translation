  text: Φίλιππος καὶ Βαρθολομαῖος, Θωμᾶς καὶ Μαθθαῖος ὁ τελώνης, Ἰάκωβος ὁ τοῦ Ἁλφαίου καὶ ⸀Θαδδαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/003.yaml
  text: Philip and Bartholomew[a], Thomas and Matthew the tax collector, James the son of Alphaeus and Thaddaeus,
translation:
  language: ig
  text: Filip na Batolomiu[a], Tọmọs na Matiu, onye na-anakọta ụtụ isi, Jemis nwa Alfiọs, na Tadiọs,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ ihe odide ochie nwere ọgụgụ a: “Lebios” (ma ọ bụ “Lebios, onye a na-akpọ Tadiọs”); n’ebe kwekọrọ na nke a, ndepụta ndịozi dị na Luk kpọrọ “Judas nwa Jemis.”'
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππος
  choice: Filip
  rationale: E dere aha Grik a n’ụdị a na-akpọkarị ya n’Igbo, kama ịtụgharị ihe aha ahụ pụtara.
- source_word: Βαρθολομαῖος
  choice: Batolomiu
  rationale: Nsụgharị ụda aha onye ahụ n’ụdị dabara n’usoro mkpọpụta na odide Igbo.
- source_word: Θωμᾶς
  choice: Tọmọs
  rationale: Nsụgharị ụda aha onye ahụ n’ụdị Igbo a na-aghọta nke ọma.
- source_word: Μαθθαῖος
  choice: Matiu
  rationale: Ụdị aha a bụ nke ndị na-agụ Bible Igbo maara nke ọma, ọ na-esokwa mkpọpụta aha ahụ.
- source_word: ὁ τελώνης
  choice: onye ọna ụtụ isi
  rationale: τελώνης bụ onye na-anakọta ụtụ ma ọ bụ ụgwọ ndị ọchịchị; okwu a doro onye Igbo nke oge a anya ma zere okwu ochie.
- source_word: Ἰάκωβος
  choice: Jemis
  rationale: E ji ụdị aha a a maara n’ọdịnala Agba Ọhụrụ mee ka onyeozi a dị mfe ịmata, kama iji Jekọb.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: nwa Alfiọs
  rationale: Nkebi genitive a na-egosi nna Jemis; ‘nwa Alfiọs’ na-egosipụta mmekọrịta ahụ nke ọma n’Igbo.
- source_word: Ἁλφαίου
  choice: Alfiọs
  rationale: Nsụgharị ụda aha Ἁλφαῖος n’ụdị dabara n’Igbo.
- source_word: Θαδδαῖος
  choice: Tadiọs
  rationale: E soro ọgụgụ SBLGNT Θαδδαῖος n’ahịrị isi; e debere aha ndị ọzọ dị n’akaebe ederede na ndepụta Luk n’ala peeji.
- source_word: καὶ
  choice: na
  rationale: ‘Na’ bụ njikọ Igbo nkịtị nke na-echekwa usoro ndepụta dị mfe nke Grik.
theological_decisions:
- issue: Onye bụ onyeozi ikpeazụ a kpọrọ aha n’akụkụ amaokwu a
  choice: Tadiọs
  alternative: Lebios; ma ọ bụ Judas nwa Jemis dịka ndepụta Luk si kwuo
  rationale: Ederede SBLGNT nyere gụrụ Θαδδαῖος, ya mere ahịrị isi soro ya. A naghị emekọrịta ọdịiche dị n’ihe odide na ndepụta ndị ọzọ n’ime ahịrị isi; e gosiri ha n’ala peeji ka ihe akaebe dị iche iche wee doo anya.
translation_notes:
  register: Igbo izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro ndepụta nke Grik, jiri ụdị aha ndị a maara n’Igbo, ma kọwaa mmekọrịta nna na nwa n’ụzọ ebumpụta ụwa.
