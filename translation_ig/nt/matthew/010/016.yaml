    issue: The rendering of ἀκέραιοι is somewhat narrowed.
    rationale: «ndị na-adịghị aghụghọ» focuses on not practicing deception, whereas ἀκέραιοι characterizes the disciples as innocent/pure/harmless. «ndị dị ọcha» preserves the broader ethical sense and the contrast with prudent conduct.
