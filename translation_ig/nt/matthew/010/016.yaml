id: MAT.10.16
reference: Matthew 10:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: ig
  text: “Lee, ana m ezipụ unu dịka atụrụ n’etiti anụ ọhịa wolf. Ya mere, bụrụnụ ndị nwere uche dịka agwọ, bụrụkwa ndị dị ọcha dịka nduru.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu ndọrọ uche kwekọrọ na ‘lee’; ọ na-edobe ike okwu Jizọs n’enweghị mgbakwunye nkọwa.
- source_word: ἀποστέλλω
  choice: ana m ezipụ
  rationale: Na-egosi iziga ndị mmadụ ka ha gaa rụọ ọrụ, ma na-edobekwa omume ahụ dị ugbu a n’okwu a.
- source_word: πρόβατα
  choice: atụrụ
  rationale: Ọ bụ aha Igbo nkịtị maka sheep ma na-edobe ihe atụ ahụ.
- source_word: λύκων
  choice: anụ ọhịa wolf
  rationale: ‘Wolf’ enweghị aha Standard Igbo a na-ejikarị eme ihe n’enweghị mgbagwoju anya; ‘anụ ọhịa wolf’ na-eme ka ụdị anụ ahụ doo anya ma ghara dochie ya n’anụ ọzọ.
- source_word: φρόνιμοι
  choice: ndị nwere uche
  rationale: Na-ebute echiche nke ịkpachapụ anya na ezi nghọta bara uru, ọ bụghị naanị ịma ihe.
- source_word: ὄφεις
  choice: agwọ
  rationale: Aha Igbo doro anya maka snakes/serpents; plural pụtara site n’usoro ntụnyere ahụ n’enweghị mkpa imegharị aha ahụ.
- source_word: ἀκέραιοι
  choice: ndị na-adịghị aghụghọ
  rationale: N’ọnọdụ a, okwu ahụ na-egosi ịdị ọcha n’ebumnobi, enweghị ngwakọta ọjọọ ma ọ bụ aghụghọ; nsụgharị a bụ nke ndị mmadụ ga-aghọta ngwa ngwa.
- source_word: περιστεραί
  choice: nduru
  rationale: Aha Standard Igbo a na-ahụkarị maka dove/pigeon, nke na-edobe ihe atụ ahụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti φρόνιμοι na ἀκέραιοι
  choice: ndị nwere uche … ndị na-adịghị aghụghọ
  alternative: ndị maara ihe … ndị aka ha dị ọcha
  rationale: 'A hapụrụ esemokwu okwu ahụ ka ọ dị: ndị na-eso ụzọ ga-enwe nghọta na ịkpachapụ anya, ma ha agaghị eji aghụghọ eme ihe. A naghị eme ka otu àgwà kagbuo nke ọzọ.'
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘dịka’ mee ntụnyere abụọ ahụ n’ụzọ yiri ibe ha. E tinyere ‘anụ ọhịa’ n’ihu ‘wolf’ iji nyere onye na-agụ Igbo aka ịmata na ọ bụ ụdị anụ, ebe a hapụrụ aha ụdị ahụ dị ka mbinye okwu.
