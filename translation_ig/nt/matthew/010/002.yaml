id: MAT.10.2
reference: Matthew 10:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: ig
  text: 'Aha ndị ozi iri na abụọ ahụ bụ ndị a: onye mbụ[a] bụ Saịmọn, onye a na-akpọ Pita, na Andru, nwanne ya nwoke; Jemis, nwa Zebedi, na Jọn, nwanne ya nwoke.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye mbụ” nwere ike igosi na Saịmọn bụ onye pụtara ìhè n’etiti ndị iri na abụọ ahụ, ọ bụghị naanị onye mbụ n’usoro.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: ahụ
  rationale: δέ na-egosi ntakịrị mgbanwe n’okwu. N’Igbo, usoro ahịrịokwu na ntụaka ‘ndị ozi iri na abụọ ahụ’ na-eme ka mgbanwe ahụ doo anya n’enweghị ịgbakwunye okwu oge dịka ‘ugbu a.’
- source_word: δώδεκα ἀποστόλων
  choice: ndị ozi iri na abụọ
  rationale: ‘Ndị ozi’ bụ okwu Igbo doro anya maka ndị e zigara ozi ma bụrụkwa aha a na-amakarị maka ìgwè ndị Jizọs họpụtara.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: Aha ... bụ ndị a
  rationale: Nke a na-edobe ngosipụta nke Grik ma na-ada ka Igbo nkịtị.
- source_word: πρῶτος
  choice: onye mbụ
  rationale: Ọ na-egosi Saịmọn dị ka onye mbụ e depụtara, ma ọ naghị ekpebi n’ahịrị bụ isi ma okwu ahụ ọ na-egosikwa ịbụ onye kachasị pụta ìhè.
- source_word: ὁ λεγόμενος
  choice: onye a na-akpọ
  rationale: Nke a na-egosipụta nke ọma na Pita bụ aha e ji akpọ Saịmọn.
- source_word: Πέτρος
  choice: Pita
  rationale: E ji ụdị aha a maara nke ọma n’Igbo dee aha ahụ.
- source_word: Ἀνδρέας
  choice: Andru
  rationale: E ji ụdị aha a maara nke ọma n’Igbo dee aha ahụ.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: nwanne ya nwoke
  rationale: N’ebe abụọ ahụ, okwu a na-ekwu maka nwanne nwoke n’ezinụlọ; nke mbụ bụ nwanne Saịmọn, nke abụọ abụrụ nwanne Jemis.
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: nwa Zebedi
  rationale: Ọdịdị genitiv Grik a na-egosi na Jemis bụ nwa Zebedi; ụdị Igbo a dị nkenke ma doo anya.
theological_decisions:
- issue: Ihe πρῶτος pụtara mgbe e kwuru Saịmọn/Pita
  choice: onye mbụ
  alternative: onye kacha pụta ìhè n’etiti ndị iri na abụọ ahụ
  rationale: πρῶτος nwere ike ịpụta onye mbụ n’usoro, ma o nwekwara ike inwe echiche nke ịbụ onye pụtara ìhè. Ahịrị bụ isi na-edobe okwu nkịtị ahụ; nkọwa ala peeji na-echekwa ohere nke echiche nke abụọ n’ebughị ozizi otu ụka banye na ntụgharị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ndepụta ahụ n’usoro doro anya, jiri semicolon kewaa ụmụnne abụọ ahụ n’otu n’otu. Akara nkọwa [a] dị ozugbo n’azụ ‘onye mbụ.’
