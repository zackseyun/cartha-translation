  to: Ọ bụrụ na ụlọ ahụ[a] ruru eru, ka udo unu bịakwasị ya; ma ọ bụrụ na ọ rụghị eru[b], ka udo unu laghachikwute unu.[c]
  rationale: The revision replaces an unclear calque-like construction with idiomatic Standard Igbo while preserving the source’s deliberately broad evaluative term. It keeps the direct reference to the house, the conditional opposition, and the unelaborated imagery of 'your peace.'
