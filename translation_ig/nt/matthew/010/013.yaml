review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the conditional contrast, the imperative force ('ka ...'), 'peace,' and the image of peace coming upon the house or returning to the disciples. However, 'kwesịrị ya' does not naturally express ἀξία in this construction and can sound as though the house 'deserves it,' with an unclear referent for 'ya.'
  naturalness: Revise 'kwesịrị ya / kwesịghị ya' to 'ruru eru / rụghị eru.' This is natural Standard Igbo for being qualified, fitting, or worthy, and works idiomatically with both 'ụlọ ahụ' and the resumed pronoun.
  terminology: '''ụlọ,'' ''udo,'' ''bịakwasị,'' and ''laghachikwute'' are suitable and retain the source imagery without adding doctrinal interpretation. The footnote should use the same revised expression as the text.'
  issues:
  - severity: medium
    issue: The expression 'ụlọ ahụ kwesịrị ya' is semantically and idiomatically unclear.
    rationale: The Greek ἀξία means that the house is worthy/fit in the stated circumstance. In Igbo, 'kwesịrị ya' normally calls for a clearer object or referent and may be heard as 'deserves it.' 'Ruru eru' directly expresses the required evaluative sense.
  revised_text: Ọ bụrụ na ụlọ ahụ[a] ruru eru, ka udo unu bịakwasị ya; ma ọ bụrụ na ọ rụghị eru[b], ka udo unu laghachikwute unu.[c]
