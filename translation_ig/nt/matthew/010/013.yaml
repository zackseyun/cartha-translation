id: MAT.10.13
reference: Matthew 10:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: ig
  text: Ọ bụrụ na ụlọ ahụ[a] ruru eru, ka udo unu bịakwasị ya; ma ọ bụrụ na ọ rụghị eru[b], ka udo unu laghachikwute unu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ezinụlọ” ma ọ bụ “ebe obibi”; okwu Grik a sụgharịrị “ụlọ” nwekwara ike izo aka n’ebe obibi ahụ na ndị bi n’ime ya.
    reason: lexical_alternative
  - marker: b
    text: “Ruru eru” n’ebe a pụtara na ụlọ ahụ ma ọ bụ ndị nọ na ya dabara adaba ịnabata ndị ozi ahụ na udo ha; ọ pụtaghị na ha enweghị mmehie.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “ka udo unu tụgharịa laghachikwute unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: ụlọ
  rationale: “Ụlọ” bụ okwu Igbo kacha nso n’ụzọ kwụ ọtọ; n’ebe a, ọ pụkwara ịgụnye ndị bi n’ụlọ ahụ, ya mere e nyere nkọwa n’ala peeji.
- source_word: ἀξία
  choice: kwesịrị ya / kwesịghị ya
  rationale: Nke a na-echekwa echiche nke ịbụ onye ma ọ bụ ebe kwesịrị ekwesị ịnabata ndị ozi na udo ha, n’ebughị ụzọ mee ya naanị ‘ịdị njikere ịnara ozi.’
- source_word: ἐλθάτω
  choice: ka ... bịakwasị
  rationale: “Ka ... bịakwasị” na-egosipụta iwu onye nke atọ ma na-ejikọta nke ọma na ihe oyiyi nke udo na-abịakwasị ụlọ.
- source_word: εἰρήνη
  choice: udo
  rationale: “Udo” bụ nhata nkịtị, ma ọ ka na-ahapụ nghọta sara mbara nke ọdịmma na ngọzi dị n’okwu ahụ.
- source_word: ἐπ’ αὐτήν
  choice: bịakwasị ya
  rationale: Nhọrọ a na-echekwa ntụziaka na ihe oyiyi dị na ἐπί, ebe “ya” na-ezo aka n’ụlọ ahụ.
- source_word: πρὸς ὑμᾶς
  choice: kwute unu
  rationale: N’ime “laghachikwute unu,” okwu a na-egosipụta ntụziaka nke udo ahụ ịlaghachi n’ebe ndị na-eso ụzọ nọ.
- source_word: ἐπιστραφήτω
  choice: ka ... laghachikwute
  rationale: Nke a bụ Igbo ebumpụta ụwa nke na-echekwa iwu ahụ na echiche nke udo ahụ ịlaghachi.
- source_word: μὲν ... δὲ
  choice: ọ bụrụ na ...; ma ọ bụrụ na ...
  rationale: Usoro a na-egosipụta ọdịiche dị n’etiti ọnọdụ abụọ ahụ n’Igbo doro anya ma dị mfe.
theological_decisions:
- issue: Ụdị ‘udo unu’ bụ
  choice: E debere ‘udo unu’ dịka udo ndị na-eso ụzọ na-ekwupụta, nke pụrụ ịbịakwasị ụlọ ma ọ bụ laghachikwute ha.
  alternative: ‘ekele udo unu,’ ‘udo unu kwupụtara,’ ma ọ bụ ‘ngọzi udo nke ozi alaeze.’
  rationale: Amaokwu ahụ na-ekwu maka udo dịka ihe nwere ike ịbịakwasị ụlọ ma laghachi, ma ọ kọwaghị kpọmkwem otú nke a si eme. Nsụgharị ahụ na-echekwa ihe oyiyi na mgbagwoju anya nkà mmụta okpukpe ahụ kama ime ka ọ bụrụ naanị ekele ma ọ bụ kọwaa ya dịka ike na-arụ ọrụ n’onwe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ụlọ” ka ederede isi nọgide nso n’okwu Grik, ebe nkọwa ala peeji na-egosi na ọ pụrụ ịgụnye ezinụlọ. Usoro “ka ... bịakwasị” na “ka ... laghachikwute” na-echekwa ihe oyiyi na ike iwu dị n’asụsụ Grik.
