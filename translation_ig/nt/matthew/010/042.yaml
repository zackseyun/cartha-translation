id: MAT.10.42
reference: Matthew 10:42
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: ig
  text: Onye ọ bụla nke nyere otu n’ime ndị nta ndị a, ọ bụrụgodị naanị otu iko mmiri oyi ka ọ ṅụọ, n’ihi na ọ bụ onye na-eso ụzọ[b]—n’ezie, ana m agwa unu—ọ gaghị efunahụ ụgwọ ọrụ ya ma ọlị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'N’ụzọ dị nso n’ụdị okwu Grik: “n’aha onye na-eso ụzọ.” Okwu ahụ na-egosi na e mere ihe a n’ihi njirimara onye natara ya dịka onye na-eso ụzọ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν
  choice: Onye ọ bụla nke
  rationale: Njikọ nnọchiaha na ἄν na-enye echiche gbasara onye ọ bụla n’enweghị ịkpa oke; okwu Igbo a na-egosipụta nke ahụ n’ụzọ eke.
- source_word: ποτίσῃ
  choice: nyere ... otu iko mmiri
  rationale: Ọ bụ ezie na ngwaa ahụ pụtara inye mmadụ ihe ọṅụṅụ, usoro a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo inye mmadụ mmiri ka ọ ṅụọ.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: otu n’ime ndị a dị nta
  rationale: Nke a na-edobe ihe oyiyi nke ‘ndị nta’ ma ghara ikpebi na ọ bụ naanị ụmụaka; n’ọnọdụ a, ọ pụkwara ịpụta ndị e ledara anya ma ọ bụ ndị na-enweghị nnukwu ọnọdụ.
- source_word: ποτήριον ψυχροῦ
  choice: otu iko mmiri jụrụ oyi
  rationale: A ghọtara ‘mmiri’ n’ahịrị Grik n’agbanyeghị na etinyeghị aha ahụ kpọmkwem; ntụgharị a bụ okwu Igbo doro anya ma na-egosipụta onyinye dị mfe.
- source_word: μόνον
  choice: ọ bụladị naanị
  rationale: Njikọ a na-egosipụta na ọbụna onyinye pere nnọọ mpe—naanị otu iko mmiri—dị mkpa.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: n’ihi na onye ahụ bụ onye na-eso ụzọ
  rationale: Nke a na-egosipụta na ihe kpatara e ji nyere onye ahụ aka bụ njirimara ya dị ka onye na-eso ụzọ, ebe e debere ntụgharị nke na-esochi ụdị okwu Grik karịa na nkọwa ala peeji.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: n’ezie, ana m agwa unu
  rationale: Nke a na-edobe ịdị arọ na nkwenye siri ike nke okwu mmeghe Jizọs n’Igbo dị ugbu a.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: ọ gaghị efunahụ ... ma ọlị
  rationale: ‘Ma ọlị’ na-ebupụta nkwusioru siri ike nke njikọ οὐ μή.
- source_word: μισθὸν αὐτοῦ
  choice: ụgwọ ọrụ ya
  rationale: ‘Ụgwọ ọrụ’ nwere ike ịpụta ụgwọ ma ọ bụ ihe nkwụghachi e nyere mmadụ, ma dabara n’echiche nke μισθός n’ebe a.
theological_decisions:
- issue: Onye okwu ‘ndị a dị nta’ na-ezo aka na ya
  choice: E debere okwu ahụ sara mbara dịka ‘ndị a dị nta,’ n’enweghị ịkọwa ya dị ka naanị ụmụaka.
  alternative: ‘ụmụntakịrị ndị a’ ma ọ bụ naanị ndị kwere ekwe ọhụrụ/ndị okwukwe ha na-esighị ike
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ekwu maka ịnabata ndị na-eso ụzọ; ụdị okwu a na-echekwa ma echiche nke ịdị nta ma nke ịbụ onye a na-elelị, n’enweghị imechi ihe okwu ahụ pụrụ ịpụta.
- issue: Ihe εἰς ὄνομα μαθητοῦ pụtara
  choice: A sụgharịrị ya n’ụzọ nkọwa dịka ‘n’ihi na onye ahụ bụ onye na-eso ụzọ.’
  alternative: ‘n’aha onye na-eso ụzọ’
  rationale: N’ebe a, okwu ahụ na-egosi na a na-eme ihe ahụ n’ihi njirimara onye nnata dịka onye na-eso ụzọ. Nkọwa ala peeji na-echekwa ụdị okwu nke dị nso na Grik, ka a ghara izochi ọdịiche ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere nkwupụta siri ike nke Jizọs na ọdịiche dị n’etiti ‘ndị dị nta’ na ụmụaka, ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa otu òtù.
