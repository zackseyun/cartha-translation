revisions:
- from: Onye ọ bụla nke nyere otu n’ime ndị a dị nta[a] ọ bụladị naanị otu iko mmiri jụrụ oyi, n’ihi na onye ahụ bụ onye na-eso ụzọ[b]—n’ezie, ana m agwa unu—ọ gaghị efunahụ ụgwọ ọrụ ya ma ọlị.
  to: Onye ọ bụla nke nyere otu n’ime ndị nta ndị a, ọ bụrụgodị naanị otu iko mmiri oyi ka ọ ṅụọ, n’ihi na ọ bụ onye na-eso ụzọ[b]—n’ezie, ana m agwa unu—ọ gaghị efunahụ ụgwọ ọrụ ya ma ọlị.
  rationale: The revised text uses idiomatic Standard Igbo while retaining the source’s open-ended condition, the smallness of the gift, the recipient’s identity as a disciple, and the emphatic promise. Footnote a remains necessary and is anchored to ‘ndị nta ndị a’; it is therefore retained with the corrected wording. Footnote b retains the formal alternative without forcing a formulaic interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:34:13Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the indefinite subject, the lowly ‘little ones,’ the minimal gift, the motive connected with discipleship, the solemn assurance, and the emphatic negation. A small revision more clearly expresses ποτίσῃ (‘give ... to drink’) and places μόνον naturally with the cup of cold water.
  naturalness: ‘Ndị nta ndị a’ is the more natural Standard Igbo order than ‘ndị a dị nta.’ ‘Mmiri oyi’ is idiomatic for cold water, and ‘ọ bụrụgodị naanị’ naturally conveys the concessive/minimizing force expressed by the Greek wording.
  terminology: ‘Onye na-eso ụzọ’ appropriately renders μαθητής without narrowing its referent. ‘Ụgwọ ọrụ’ is a suitable rendering of μισθός in this context. The notes preserve the broader referent of ‘little ones’ and the more formal alternative for εἰς ὄνομα μαθητοῦ.
  issues:
  - severity: medium
    issue: The wording ‘otu n’ime ndị a dị nta ... otu iko mmiri jụrụ oyi’ is less idiomatic and does not explicitly express giving the water to the person to drink.
    rationale: Standard Igbo more naturally says ‘ndị nta ndị a’ and ‘mmiri oyi’; adding ‘ka ọ ṅụọ’ makes explicit the semantic force of ποτίσῃ without adding interpretation.
  - severity: low
    issue: ‘Ọ bụladị naanị otu’ is somewhat redundant and awkward in this position.
    rationale: ‘Ọ bụrụgodị naanị otu’ gives a natural concessive expression for the deliberately minimal gift marked by μόνον.
  revised_text: Onye ọ bụla nke nyere otu n’ime ndị nta ndị a, ọ bụrụgodị naanị otu iko mmiri oyi ka ọ ṅụọ, n’ihi na ọ bụ onye na-eso ụzọ[b]—n’ezie, ana m agwa unu—ọ gaghị efunahụ ụgwọ ọrụ ya ma ọlị.
  revised_footnotes:
  - marker: a
    text: Okwu bụ “ndị nta ndị a” nwere ike izo aka n’ebe ndị na-eso Jizọs nọ bụ́ ndị a na-ele anya dị ka ndị dị ala ma ọ bụ ndị na-enweghị nnukwu ọnọdụ; ọ bụghị iwu na ọ bụ naanị ụmụaka.
    reason: cross_reference
  - marker: b
    text: 'N’ụzọ dị nso n’ụdị okwu Grik: “n’aha onye na-eso ụzọ.” Okwu ahụ na-egosi na e mere ihe a n’ihi njirimara onye natara ya dịka onye na-eso ụzọ.'
    reason: alternative_reading
  revision_rationale: The revised text uses idiomatic Standard Igbo while retaining the source’s open-ended condition, the smallness of the gift, the recipient’s identity as a disciple, and the emphatic promise. Footnote a remains necessary and is anchored to ‘ndị nta ndị a’; it is therefore retained with the corrected wording. Footnote b retains the formal alternative without forcing a formulaic interpretation.
