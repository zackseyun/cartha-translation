review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the attendant action ('as you go'), the plural imperative to proclaim, the quoted content, Matthew’s 'kingdom of heaven,' and the perfect force of ἤγγικεν. However, 'ozi a' means 'this message' and adds both a noun and demonstrative not expressed by κηρύσσετε.
  naturalness: With the added words removed, 'Ka unu na-aga, kwusaanụ, sị,' is clear, formal-natural Standard Igbo and retains the content-specifying participle λέγοντες.
  terminology: '''Alaeze eluigwe'' appropriately preserves Matthew’s distinctive expression and should not be harmonized to ''Alaeze Chineke.'' ''Abịaruola nso'' suitably represents the arrived-and-continuing nearness expressed by the Greek perfect.'
  issues:
  - severity: low
    issue: The phrase 'ozi a' is not represented in the Greek source.
    rationale: κηρύσσετε commands proclamation but does not explicitly say 'this message.' Removing it avoids adding a demonstrative referent while retaining the sense of public proclamation.
  - severity: low
    issue: Footnote a’s explanation of the perfect is somewhat opaque in its final clause.
    rationale: A direct explanation that the kingdom has come near and remains near is clearer and more idiomatic Standard Igbo, without making a theological inference beyond verbal aspect.
  revised_text: Ka unu na-aga, kwusaanụ, sị, “Alaeze eluigwe abịaruola nso.”[a][b]
