id: MAT.10.7
reference: Matthew 10:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: ig
  text: Ka unu na-aga, kwusaanụ, sị, “Alaeze eluigwe abịaruola nso.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “abịala nso” ma ọ bụ “dị nso.” Ngwaa Grik ahụ dị n’ụdị perfect; ọ na-egosi na alaeze ahụ abịaruola nso ma ka dị nso.
    reason: lexical_alternative
  - marker: b
    text: Matiu na-ejikarị okwu “Alaeze eluigwe” eme ihe, ebe akwụkwọ Oziọma ndị ọzọ na-ejikarị “Alaeze Chineke.”
    reason: cross_reference
lexical_decisions:
- source_word: πορευόμενοι
  choice: Ka unu na-aga
  rationale: Ọ bụ participle nke na-egosi ihe na-aga n’otu oge na iwu ahụ; nsụgharị a bụ Igbo eke ma na-echekwa echiche ‘mgbe unu na-aga.’
- source_word: δὲ
  choice: (egosighị ya iche)
  rationale: Ọ bụ njikọ dị nro. N’Igbo, mmalite ‘Ka unu na-aga’ na-ejikọta okwu ahụ nke ọma n’enweghị itinye njikọ nke ga-eme ka esemokwu ma ọ bụ usoro oge sie ike karịa Grik.
- source_word: κηρύσσετε
  choice: kwusaanụ ozi a
  rationale: Na-egosi iwu ikwupụta ozi n’ihu ọha dịka onye mgbasa ozi; ‘kwusaanụ’ na-echekwa ike iwu ahụ n’asụsụ Igbo dị ugbu a.
- source_word: λέγοντες
  choice: sị
  rationale: Na-akọwa ihe a ga-ekwusa ma na-ewebata okwu ahụ kpọmkwem n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: ὅτι
  choice: (okwu a kpọmkwem ewebatara site na ‘sị’)
  rationale: ὅτι na-ewebata ọdịnaya nke nkwusa ahụ; n’Igbo, ‘sị’ na akara okwu kpọmkwem na-enye otu ọrụ ahụ n’enweghị ‘na’ ọzọ.
- source_word: Ἤγγικεν
  choice: abịaruola nso
  rationale: Ụdị perfect ahụ na-egosi na ịbịaru nso emeela, ọnọdụ ya ka dịkwa; ‘abịaruola nso’ na-echekwa ma mmezu ahụ ma ịdị nso ya ugbu a.
- source_word: ἡ βασιλεία
  choice: Alaeze
  rationale: ‘Alaeze’ bụ okwu Igbo a na-ahụkarị nke nwere ike ịgụnye ma ọchịchị eze ma ógbè ọchịchị ya, ya mere ọ naghị emechi nghọta ahụ n’otu akụkụ.
- source_word: τῶν οὐρανῶν
  choice: eluigwe
  rationale: Na-echekwa okwu pụrụ iche Matiu ji eme ihe kama ịgbanwe ya ka ọ bụrụ ‘nke Chineke’; ‘eluigwe’ bụ ụzọ Igbo eke si kwuo ya.
theological_decisions:
- issue: Ihe ‘alaeze eluigwe’ pụtara
  choice: E debere ya dịka ‘Alaeze eluigwe.’
  alternative: Ọchịchị eluigwe; Alaeze Chineke
  rationale: Nke a na-echekwa okwu Matiu pụrụ iche ma na-ahapụ ‘alaeze’ ka ọ buru nghọta sara mbara nke ọchịchị na ógbè, n’enweghị ime ka ya na akwụkwọ ozi ọma ndị ọzọ bụrụ otu.
- issue: Akụkụ oge na ọnọdụ nke Ἤγγικεν
  choice: ‘abịaruola nso’
  alternative: dị nso; abịala nso
  rationale: Nsụgharị a na-egosi ịbịaru nso nke rurula ma ka na-emetụta ọnọdụ ugbu a, n’enweghị idozi ozizi sara mbara banyere alaeze karịa ihe ngwaa ahụ kwuru.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma doo ndị nkịtị anya. E ji ụdị ọtụtụ mmadụ ‘unu’ mee ihe dịka Grik si dị. ‘Sị’ na-echekwa λέγοντες n’enweghị nkwugharị na-adịghị eke n’Igbo.
