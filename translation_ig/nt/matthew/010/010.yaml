id: MAT.10.10
reference: Matthew 10:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: ig
  text: Unu ewerela akpa njem maka njem, ma ọ bụ uwe abụọ, ma ọ bụ akpụkpọ ụkwụ, ma ọ bụ mkpara[a]; n’ihi na onye ọrụ kwesịrị nri ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ na-aghọta ‘ma ọ bụ mkpara’ dị ka mmachibido iburu mkpara ọzọ, karịchaa n’ihi na Mak 6:8 kwere ka e buru mkpara.
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: akpa ndị njem
  rationale: Ọ na-egosi akpa a na-ebu mgbe a na-eme njem, karịchaa maka ibu ihe oriri na ihe ndị ọzọ dị mkpa; okwu a doro ndị na-agụ Igbo anya ma na-edobe ọnọdụ njem ahụ.
- source_word: εἰς ὁδὸν
  choice: maka njem ahụ
  rationale: Nke a na-egosipụta ebumnuche nke ihe a ga-eburu mgbe a na-aga njem, n’ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: δύο χιτῶνας
  choice: uwe ime ahụ́ abụọ
  rationale: χιτών bụ uwe bụ isi a na-eyi n’ahụ́ n’okpuru uwe elu; ‘uwe ime ahụ́’ na-ezere ịkpọ ya uwe elu nke oge a ma na-enye nkọwa akụkọ ihe mere eme zuru oke.
- source_word: ὑποδήματα
  choice: akpụkpọ ụkwụ
  rationale: N’Igbo nke oge a, ‘akpụkpọ ụkwụ’ bụ okwu nkịtị maka ihe a na-eyi n’ụkwụ, gụnyere ụdị akpụkpọ ụkwụ e ji eriri kee nke oge ahụ.
- source_word: ῥάβδον
  choice: mkpara
  rationale: ‘Mkpara’ dabara n’ihe onye njem ji aga ije ma na-edobe okwu Matiu n’enweghị ime ka ya na Mak 6:8 kwekọọ n’ụzọ a manyere amanye.
- source_word: ἄξιος
  choice: kwesịrị inweta
  rationale: Nkebiokwu a na-egosipụta na onye ọrụ ruru eru ma kwesị ịnata ihe e kwuru, n’Igbo nkịtị na nke doro anya.
- source_word: ὁ ἐργάτης
  choice: onye ọrụ
  rationale: Ọ bụ okwu sara mbara ma doo anya maka onye na-arụ ọrụ, n’etinyeghị aha ọrụ ụka pụrụ iche.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: nri ya
  rationale: τροφή pụtara nri ma ọ bụ ihe na-azụ ahụ́; ‘nri ya’ na-edobe ihe okwu Grik kwuru kpọmkwem kama ịgbasa ya ka ọ bụrụ nkwado niile.
theological_decisions:
- issue: Ọdịiche dị n’etiti Matiu na Mak banyere mkpara onye njem
  choice: Edobere iwu Matiu, ‘ma ọ bụ mkpara,’ n’ahịrịokwu bụ isi.
  alternative: A pụrụ ịghọta ya dị ka mmachibido iburu mkpara ọzọ, karịchaa n’ihi Mak 6:8.
  rationale: Ihe odide Grik Matiu depụtara ῥάβδον n’etiti ihe ndị a na-agaghị eburu. Ya mere, nsụgharị ahụ anaghị eme ka akụkọ abụọ ahụ kwekọọ n’ike, kama ọ na-edobe esemokwu ahụ ma kọwaa echiche ọzọ n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ùgwù mee ihe. A họọrọ ‘ewerela’ maka iwu mmachibido, ‘akpa ndị njem’ maka akpa a na-ebu n’ụzọ, na ‘kwesịrị inweta nri ya’ ka echiche nke iru eru na ihe oriri kpọmkwem dịrị n’otu.
