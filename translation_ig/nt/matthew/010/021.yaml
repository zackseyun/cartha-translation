  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: ig
  text: Otu nwanne nwoke ga-enyefe nwanne nwoke ibe ya ka e gbuo ya[a], nna ga-enyefekwa nwa ya ka e gbuo ya. Ụmụ ga-ebili megide nne na nna ha, meekwa ka e gbuo ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ga-enye n’aka” ma ọ bụ “ga-arara ... nye”; ngwaa a nwekwara ike ịpụta ịrara mmadụ nye mgbe e ji aghụghọ ma ọ bụ ekwesịghị ntụkwasị obi mee ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: ga-enyefe
  rationale: Okwu a pụtara inyefe mmadụ n’aka ndị iro ma ọ bụ ndị ọchịchị ka ha mee ya ihe; “ga-enyefe” na-edobe echiche ahụ n’ebughị ụzọ kpebie na ọ bụ naanị nrara nye.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: Nwanna ... nwanna ya
  rationale: “Nwanna” bụ okwu Igbo ebumpụta ụwa maka onye otu nne ma ọ bụ nna; “ya” na-eme ka njikọ ezinụlọ ahụ doo anya n’Igbo.
- source_word: εἰς θάνατον
  choice: ka e gbuo ya
  rationale: 'Nkebiokwu a na-egosi ebumnuche ma ọ bụ nsonaazụ nke inyefe ahụ: ọnwụ. Nsụgharị a na-ada nke ọma n’Igbo ma doo anya.'
- source_word: πατὴρ τέκνον
  choice: nna ... nwa ya
  rationale: “Nna” na-edobe πατήρ, ebe “nwa” na-anọchi τέκνον n’ụzọ na-adịghị ekwu ma nwa ahụ ọ̀ bụ nwoke ma ọ bụ nwanyị.
- source_word: ἐπαναστήσονται
  choice: ga-ebili megide
  rationale: Nke a na-edobe ihe oyiyi dị n’okwu Grik nke ibili imegide mmadụ, kama ime ka ọ bụrụ nanị esemokwu nkịtị.
- source_word: τέκνα
  choice: Ụmụ
  rationale: “Ụmụ” na-agụnye ụmụ nwoke na ụmụ nwanyị, dịka τέκνα si eme.
- source_word: ἐπὶ γονεῖς
  choice: megide nne na nna ha
  rationale: “Megide” na-egosipụta ọnọdụ iro nke ἐπί n’ebe a; “nne na nna” bụ ụzọ Igbo doro anya si kwuo ndị mụrụ mmadụ.
- source_word: θανατώσουσιν αὐτούς
  choice: meekwa ka e gbuo ha
  rationale: θανατόω bụ ime ka mmadụ nwụọ, mgbe ụfọdụ site n’ikpe ma ọ bụ n’aka ndị ọzọ. “Mee ka e gbuo ha” na-edobe mmetụta causative ahụ na-enweghị ịgbakwunye nkọwa na-adịghị na Grik.
theological_decisions:
- issue: Mmekọrịta ezinụlọ na okike nke okwu ndị ahụ
  choice: Jiri “nwanna,” “nwa/ụmụ,” na “nne na nna” dịka oke okwu Grik si dị
  alternative: Ịkọwa ἀδελφός kpọmkwem dịka “nwanne nwoke”
  rationale: Igbo “nwanna” anaghị akọwa okike dịka ἀδελφός pụrụ ime, ma ọ bụ okwu ezinụlọ kachasị ebumpụta ụwa n’Igbo; ịsị “nwanne nwoke” nwere ike ịda ka nkọwa agbakwunyere. “Nwa/ụmụ” na “nne na nna” na-edobe oke sara mbara nke τέκνον/τέκνα na γονεῖς.
translation_notes:
  register: Asụsụ Igbo izugbe, dị ùgwù ma dị mfe nghọta. E ji usoro ahịrịokwu abụọ mee ka ogologo okwu ahụ doo anya, ma njikọ na ịrị elu nke ihe ike dị n’amaokwu ahụ ka dị.
