  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: ig
  text: “Onye na-eso ụzọ adịghị elu karịa onye nkụzi ya; ohu[a] adịghịkwa elu karịa nna ya ukwu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “onye na-eje ozi”; okwu Grik δοῦλος nwere ike ịpụta ohu ma ọ bụ onye na-eje ozi, dabere n’ọnọdụ okwu.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya “Onyenwe ya”; ma n’ebe a, κύριος na-ezo aka n’onyenwe mmadụ, ya bụ, onye nwere ikike n’ebe ohu nọ, n’ụzọ atụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: onye na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa onye na-amụta ihe site n’iso onye nkụzi ya, ọ bụghị naanị nwa akwụkwọ nọ n’ụlọ akwụkwọ.
- source_word: ὑπέρ
  choice: elu karịa
  rationale: N’ebe a, ὑπέρ na-egosi ịdị elu n’ọkwa ma ọ bụ ịdị ukwuu karịa onye ọzọ; “elu karịa” na-edobe ntụnyere ahụ nke ọma.
- source_word: διδάσκαλος
  choice: onye nkụzi
  rationale: Ọ bụ ntụgharị doro anya ma bụrụ nke ndị Igbo nke oge a na-aghọta nke ọma.
- source_word: δοῦλος
  choice: ohu
  rationale: N’ụzọ atụ a, okwu ahụ na-egosi onye nọ n’okpuru ikike nna ya ukwu; “ohu” na-edobe ike mmekọrịta ọkwa ahụ karịa “onye na-eje ozi.”
- source_word: κύριος
  choice: nna ya ukwu
  rationale: N’ụzọ atụ gbasara ohu na onye nwe ya, okwu a na-ezo aka n’onye mmadụ nọ n’okpuru ikike ya, ọ bụghị aha nsọ e ji akpọ Chineke.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnọchiaha a na-egosi mmekọrịta dị n’etiti onye na-eso ụzọ na onye nkụzi ya, nakwa ohu na nna ya ukwu; Igbo na-eji “ya” eme ihe n’enweghị ịkọwapụta okike.
- source_word: οὐδέ
  choice: adịghịkwa
  rationale: “Adịghịkwa” jikọtara ntụnyere nke abụọ na nkwupụta njụ nke mbụ n’ụzọ Igbo sitere n’okike.
theological_decisions:
- issue: Nsụgharị δοῦλος n’ụzọ atụ gbasara ọkwa mmadụ
  choice: ohu
  alternative: onye na-eje ozi
  rationale: “Ohu” na-egosi nke ọma ọnọdụ onye nọ n’okpuru ikike nna ya ukwu. E debere okwu ọzọ nwere ike ịbụ ya n’ala peeji.
- issue: Nsụgharị κύριος n’ebe ọ na-ezo aka n’onye mmadụ nọ n’okpuru ya
  choice: nna ya ukwu
  alternative: Onyenwe ya
  rationale: Ọnọdụ okwu a bụ ntụnyere mmekọrịta mmadụ, ọ bụghị aha nsọ nke Chineke. “Nna ya ukwu” na-eme ka nke ahụ doo anya ma na-edobe echiche nke onye nwere ikike.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji “onye na-eso ụzọ” chekwaa echiche nke onye na-amụta site n’iso onye nkụzi ya; e jikwa “nna ya ukwu” gosipụta onye isi mmadụ n’enweghị ime ka okwu ahụ bụrụ aha nsọ.
