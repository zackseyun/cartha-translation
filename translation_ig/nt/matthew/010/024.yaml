  source_fidelity: 'The main translation faithfully represents both paired comparisons: μαθητής/διδάσκαλος as “onye na-eso ụzọ/onye nkụzi,” and δοῦλος/κύριος as “ohu/nna ya ukwu.” “Adịghị elu karịa” adequately conveys ὑπὲρ in its comparative sense, and “ya” correctly attaches to “nna ya ukwu,” as αὐτοῦ does in Greek.'
  naturalness: The wording is clear Standard Igbo and maintains the concise, proverbial register of the saying. Moving footnote b directly after “nna ya ukwu” makes its anchor unambiguous.
  terminology: “Ohu” and “nna ya ukwu” appropriately preserve the social-status contrast in the Greek without treating κύριος as a divine title. The current b footnote, however, reverses the relationship by saying κύριος refers to someone under another’s authority; it denotes the human superior/master in the analogy.
