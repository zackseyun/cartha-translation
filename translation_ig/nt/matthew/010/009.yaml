  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: ig
  text: Unu enwetala ọlaedo, ọlaọcha, ma ọ bụ ọla kọpa[a] maka itinye n'eriri úkwù unu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ọla brọnz.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ego a na-etinye n'eriri e ji eke úkwù ma ọ bụ n'akpa ego a na-eyi n'úkwù.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: Unu enwetakwala
  rationale: Ngwaa κτάομαι pụtara inweta ma ọ bụ ị nweta ihe nye onwe; ntụgharị a na-egosi na iwu ahụ abụghị naanị ka ha ghara ibu ego, kama ka ha ghara inweta ma ọ bụ ịkwakọba ya maka njem ahụ.
- source_word: χρυσὸν
  choice: ọlaedo
  rationale: Nke a bụ aha ihe ahụ kpọmkwem; n'ọnọdụ a, ọ na-ezo aka n'ego e ji ọlaedo mee.
- source_word: ἄργυρον
  choice: ọlaọcha
  rationale: Nke a bụ aha ihe ahụ kpọmkwem; n'ọnọdụ a, ọ na-ezo aka n'ego e ji ọlaọcha mee.
- source_word: χαλκὸν
  choice: ọla kọpa
  rationale: χαλκός nwere ike ịpụta kọpa ma ọ bụ bronz. N'usoro ọlaedo, ọlaọcha na χαλκός, “ọla kọpa” na-ekwupụta nke ọma ego mkpụrụ nta dị ọnụ ala.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: itinye n'ákwà ukwu unu
  rationale: ζώνη bụ ihe e ji eke ukwu ma nwee ike ịbụ ebe e si ebu ego. “Itinye n'ákwà ukwu unu” na-eme ka ebumnuche εἰς doo anya n'Igbo, ma ọ naghị etinye “akpa ego” n'ahịrị isi dịka a ga-asị na ọ dị kpọmkwem n'okwu Grik.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe ma nwee ugwu. Usoro “ma ọ bụ” na-echekwa nkwughachi μηδὲ nke amaokwu ahụ. E debere nkọwa omenala banyere otú e si ebu ego n'okpuru ala kama itinye ya niile n'ahịrị isi.
