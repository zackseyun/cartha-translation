id: MAT.10.40
reference: Matthew 10:40
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: ig
  text: Onye na-anabata unu na-anabata m[a], ma onye na-anabata m na-anabata onye zitere m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-anabata nke ọma” ma ọ bụ “na-anabata dị ka ọbịa”; ngwaa Grik ahụ pụrụ ịpụta ịnabata, ikweta ịnabata, ma ọ bụ ịnabata onye ozi nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: Onye na-anabata
  rationale: Nkebi a bụ participle nwere article nke na-arụ ọrụ dị ka aha; “Onye na-anabata” na-egosipụta onye ọ bụla n’ozuzu ya n’Igbo dị ugbu a.
- source_word: δέχομαι / δέχεται
  choice: na-anabata
  rationale: “Na-anabata” nwere ike ịpụta ịnabata mmadụ nke ọma, ịkweta ya, ma ọ bụ ịnabata ya dị ka onye ozi. Ikwughachi otu okwu a ugboro atọ na-echekwa njikọ e ji ụma kee n’amaokwu Grik ahụ.
- source_word: ὑμᾶς
  choice: unu
  rationale: “Unu” na-egosipụta nke ọma na nnọchiaha a bụ onye nke abụọ n’ụbara ma na-ezo aka n’ebe ndị na-eso ụzọ Jizọs nọ.
- source_word: ἐμέ
  choice: m
  rationale: Nnọchiaha onye mbụ n’otu nke na-ezo aka na Jizọs; “m” bụ ntụgharị Igbo kwesịrị ekwesị dịka ihe omume metụtara.
- source_word: τὸν ἀποστείλαντά με
  choice: onye zitere m
  rationale: Participle aorist nwere article na-arụ ọrụ dị ka aha. “Onye zitere m” bụ okwu Igbo doro anya ma ghara ịgbakwunye njirimara onye ahụ nke ederede Grik ekwughị kpọmkwem.
theological_decisions:
- issue: Onye bụ onye zitere Jizọs
  choice: onye zitere m
  alternative: Nna m, onye zitere m
  rationale: Ọnọdụ okwu na nkà mmụta okpukpe Matiu na-egosi n’ụzọ siri ike na ọ bụ Nna, ma ederede Grik kwuru naanị “onye zitere m.” Ntụgharị ahụ na-edobe ihe ederede kwuru n’ebughị nkọwa ahụ banye n’ahịrị bụ isi.
translation_notes:
  register: E ji Standard Igbo dị mfe, nke oge a ma dịkwa nsọpụrụ. “Unu” na-echekwa ụbara nke ὑμᾶς, ebe “na-anabata” e kwughachiri ya iji chekwaa usoro njikọ dị n’ederede mbụ.
