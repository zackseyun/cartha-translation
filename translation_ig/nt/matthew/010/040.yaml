revisions:
- from: Onye na-anabata unu na-anabata m[a], onye na-anabatakwa m na-anabata onye zitere m.
  to: Onye na-anabata unu na-anabata m[a], ma onye na-anabata m na-anabata onye zitere m.
  rationale: The revision explicitly renders the coordination between the two parallel clauses while retaining the Greek verb repetition and leaving the sender unnamed, as in the source. The footnote has been adjusted to give idiomatic Igbo lexical alternatives without introducing a misleading expression for visiting someone.
  reviewer_model: gpt-5.6-terra
