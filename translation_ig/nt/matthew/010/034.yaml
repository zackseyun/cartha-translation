id: MAT.10.34
reference: Matthew 10:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: ig
  text: Unu echela na m bịara iweta udo n’ụwa[a]. Abịaghị m iweta udo, kama ọ bụ mma agha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na m bịawo.”
    reason: lexical_alternative
  - marker: b
    text: Grik kwuru “mma agha”; n’okwu ndị gbara amaokwu a gburugburu, ihe oyiyi a na-arụtụ aka na nkewa, ọ bụghị n’ịkwado ime ihe ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Unu echela
  rationale: 'Nke a na-enye iwu mgbochi ahụ n’Igbo dị mfe ma kwụ ọtọ: ‘Unu echela.’'
- source_word: ἦλθον
  choice: m bịara / Abịaghị m
  rationale: Oge gara aga dị mfe dabara n’okwu banyere nzube ọbịbịa Jizọs; Igbo na-egosipụta ya nke ọma site na ‘bịara.’
- source_word: βαλεῖν
  choice: iweta
  rationale: Ọ bụ ezie na okwu Grik ahụ nwere isi echiche nke ịtụ ma ọ bụ ịtụba, ‘iweta’ na-ekwupụta ebumnobi ya n’ụzọ doro anya ma dị ndụ n’Igbo.
- source_word: εἰρήνην
  choice: udo
  rationale: ‘Udo’ bụ okwu Igbo a na-ejikarị eme ihe maka εἰρήνη, ma ọ naghị etinye nkọwa ọzọ n’ime ederede.
- source_word: ἐπὶ τὴν γῆν
  choice: n’ụwa
  rationale: N’ebe a γῆ na-ezo aka n’ụwa n’ozuzu ya; ‘n’ụwa’ bụ ụzọ Igbo sitere n’obi ma doo anya.
- source_word: ἀλλὰ
  choice: kama ọ bụ
  rationale: Nke a na-eme ka ọdịiche siri ike dị n’etiti ‘udo’ na ‘mma agha’ pụta ìhè n’Igbo.
- source_word: μάχαιραν
  choice: mma agha
  rationale: A hapụrụ ihe oyiyi doro anya nke μάχαιρα kama ịtụgharị ya ozugbo ka ọ bụrụ ‘nkewa’; ‘mma agha’ bụ okwu Igbo a maara nke ọma maka sword.
theological_decisions:
- issue: Ma a ga-eme ka ‘mma agha’ dị nro site n’ịsụgharị ya ‘nkewa’ n’ederede bụ isi
  choice: Debe ‘mma agha’ n’ederede bụ isi
  alternative: nkewa
  rationale: Grik kwuru μάχαιραν kpọmkwem. Amaokwu ndị na-esochi na-egosi mmetụta nkewa nke ihe oyiyi ahụ, ma nsụgharị ekwesịghị iwepụ ihe oyiyi ahụ ma ọ bụ dozie esemokwu ya n’ederede bụ isi.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji ọtụtụ mmadụ ‘unu’ kwuo okwu dịka ụdị Grik ahụ si dị. A chekwara nkwughachi nke ‘iweta udo’ na ihe oyiyi siri ike nke ‘mma agha.’
