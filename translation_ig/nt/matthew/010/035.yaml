id: MAT.10.35
reference: Matthew 10:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: ig
  text: N’ihi na abịara m ime ka nwoke guzogide nna ya[a], ka nwa nwanyị guzogide nne ya, ka nwunye nwa guzogide nne di ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ikewa.” Okwu Grik ahụ pụtara ịkpata nkewa, ma okwu ndị a na-ekwughachi, “guzogide,” na-eme ka mmegide dị n’etiti ndị ezinụlọ pụta ìhè.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik νύμφη pụrụ ịpụta “nwanyị a na-alụ ọhụrụ” n’ebe ụfọdụ; ebe a, ọ pụtara “nwunye nwa” n’ihi na e jikọtara ya na “nne di.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: abịara m
  rationale: Oge aorist nke ἔρχομαι na-ekwu maka ọbịbịa na ozi Jizọs; “abịara m” bụ ntụgharị Igbo doro anya ma kwekọọ n’usoro okwu ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na nke bu ya ụzọ dịka nkọwa ma ọ bụ ihe kpatara okwu ahụ.
- source_word: διχάσαι
  choice: ime ka ... guzogide
  rationale: Okwu ahụ pụtara ikewa ma ọ bụ ịkpata nkewa; κατά na-esochi ya ugboro ugboro na-egosi mmegide dị n’etiti ndị ezinụlọ, ya mere “ime ka ... guzogide” na-eme ka mmekọrịta mmegide ahụ pụta ìhè.
- source_word: ἄνθρωπον
  choice: nwoke
  rationale: Ọ bụ ezie na ἄνθρωπος pụrụ ịpụta mmadụ n’ozuzu, ebe a ọ nọ n’usoro ezinụlọ ya na nwaanyị na nwunye nwa, ya mere “nwoke” na-echekwa ọdịdị nwoke nke okwu ahụ.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: guzogide nna ya
  rationale: κατά na genitive na-egosi mmegide; “guzogide nna ya” bụ Igbo dị mfe ma doo anya.
- source_word: θυγατέρα
  choice: nwaanyị
  rationale: N’Igbo nkịtị, “nwaanyị” nwere ike ịpụta nwa nwanyị n’usoro mmekọrịta ya na nne ya; okwu gbara ya gburugburu na-eme ka njikọ nne na nwa doo anya.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: guzogide nne ya
  rationale: Ọ na-echekwa otu usoro mmegide ahụ e ji κατά + genitive kwuo.
- source_word: νύμφην
  choice: nwunye nwa
  rationale: νύμφη pụrụ ịpụta nwanyị a na-alụ ọhụrụ, ma njikọ ya na πενθερά ebe a na-egosi na ọ bụ nwunye nwa.
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: guzogide nne di ya
  rationale: N’ihe gbasara nwunye nwa, “nne di ya” bụ okwu mmekọrịta ezinụlọ dabara na πενθερά ma na-ada ka Igbo nkịtị.
theological_decisions:
- issue: Ụdị nkewa Jizọs kwuru na ọbịbịa ya ga-eweta
  choice: E gosiri ya dịka mmegide ga-apụta n’etiti ndị ezinụlọ n’ihi ọbịbịa ya, n’enweghị ịkọwa ya n’ime amaokwu ahụ dịka ihe ọ na-enwe mmasị na ya n’onwe ya.
  alternative: Ịsụgharị ya nanị dịka “ikewa,” ma ọ bụ ịgbakwunye nkọwa na ọ bụ mkpagbu n’ihi nrubeisi nye Jizọs.
  rationale: Grik ahụ kwuru okwu ahụ n’ụzọ siri ike ma jiri κατά gosipụta mmegide. Ntụgharị ahụ kwesịrị ichekwa esemokwu nkà mmụta okpukpe dị n’okwu ahụ n’etinyeghị nkọwa sara mbara na-adịghị n’amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E chekwara usoro atọ nke esemokwu ezinụlọ na nkwughachi “guzogide,” ebe akara nkọwa [a] na [b] dị kpọmkwem n’ederede.
