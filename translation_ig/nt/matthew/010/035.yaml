review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents ἦλθον γάρ, διχάσαι, and the threefold κατά + genitive pattern as Jesus' coming to cause family opposition. However, θυγατέρα means “daughter,” whereas “nwaanyị” normally means “woman/wife” and does not explicitly retain the daughter relationship required by the Greek.
  naturalness: “Abịara m ime ka ... guzogide ...” is clear, idiomatic Standard Igbo, and the repeated construction effectively reflects the source's parallelism. “Nwa nwanyị” is both natural and more precise than “nwaanyị” here.
  terminology: “Nwoke,” “nwa nwanyị,” “nwunye nwa,” and “nne di ya” appropriately preserve the household roles. The lexical footnotes are appropriate and retain the intended alternatives without adding theological interpretation.
  issues:
  - severity: medium
    issue: “nwaanyị” is used for θυγατέρα.
    rationale: The Greek specifies a daughter, not merely an adult woman. In contemporary Standard Igbo, “nwaanyị” ordinarily means “woman” (and can also mean “wife” depending on context); “nwa nwanyị” explicitly and naturally means “daughter.”
  revised_text: N’ihi na abịara m ime ka nwoke guzogide nna ya[a], ka nwa nwanyị guzogide nne ya, ka nwunye nwa guzogide nne di ya[b].
