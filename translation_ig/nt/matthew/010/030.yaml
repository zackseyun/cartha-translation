reference: Matthew 10:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑμῶν δὲ καὶ αἱ τρίχες τῆς κεφαλῆς πᾶσαι ἠριθμημέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/030.yaml
  text: But even the hairs of your head are all numbered[a].
translation:
  language: ig
  text: Ma ọbụna ntutu niile dị n’isi unu ka a gụworo ọnụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a gụọla ha ọnụ.” Ụdị ngwaa Grik a pụrụ imesi ihe e mecharala ike, nke nsonaazụ ya ka dị ugbu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῶν
  choice: unu
  rationale: Ọ bụ nnọchiaha onye nke abụọ n’ọnụọgụ ọtụtụ; n’Igbo, “unu” na-egosi ndị niile Jizọs na-agwa okwu.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi obere mgbanwe ma ọ bụ ọdịiche n’ihe a na-ekwu, dịka δὲ si arụ ọrụ n’ebe a.
- source_word: καὶ
  choice: ọbụna
  rationale: 'N’usoro okwu a, καὶ na-emesi ihe dị ntakịrị ike: ọbụna ntutu n’isi ha.'
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: ntutu ... dị n’isi unu
  rationale: Nke a bụ ụzọ Igbo dị ndụ si kọwaa ntutu isi, ma ọ na-edobe ihe oyiyi nke ntutu dị iche iche a na-agụ ọnụ.
- source_word: πᾶσαι
  choice: niile
  rationale: '“Niile” na-edobe echiche nke izu oke: ọ dịghị otu ntutu a hapụrụ.'
- source_word: ἠριθμημέναι εἰσίν
  choice: ka a gụworo ọnụ
  rationale: Ụdị a na-edobe olu nnabata nke Grik ma na-egosi ihe e mecharala nke ọnọdụ ya ka dị ugbu a, n’ebughị onye mere ya n’ime ederede.
theological_decisions:
- issue: Oke ihe ọmụma na nlekọta Chineke nke okwu a na-egosi
  choice: E debere ihe oyiyi ahụ kpọmkwem—ntutu niile dị n’isi ha ka a gụworo ọnụ—n’enweghị ịgbakwunye nkọwa ozizi banyere nlekọta ma ọ bụ ọchịchị Chineke.
  alternative: Ịsụgharị ya n’ụzọ nkọwa dịka “Chineke maara ntutu niile dị n’isi unu.”
  rationale: Aha Chineke na ngwaa “ịma” adịghị n’ahịrị Grik a. Olu nnabata na-ahapụ onye mere ihe ahụ ka a ghọta ya site n’okirikiri, ya mere nsụgharị ekwesịghị ime ka ihe e zoro ezo pụta ìhè karịa isi mmalite.
translation_notes:
  register: Ejiri Igbo izugbe, nke ugbu a ma dị ùgwù. “Ntutu niile dị n’isi unu” na-ada nke ọma nye ndị na-agụ Igbo taa, ebe “ka a gụworo ọnụ” na-edobe nkwusi ike na olu nnabata nke isi mmalite.
