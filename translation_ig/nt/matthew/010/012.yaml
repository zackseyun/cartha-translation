id: MAT.10.12
reference: Matthew 10:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰσερχόμενοι δὲ εἰς τὴν οἰκίαν ἀσπάσασθε αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/012.yaml
  text: As you enter the house[a], greet it.
translation:
  language: ig
  text: Mgbe unu na-abanye n’ụlọ ahụ[a], keleenụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘Mgbe unu na-abanye, keleenụ ezinaụlọ ahụ.’ Grik kwuru ‘keleenụ ya,’ na-ezo aka n’ụlọ ahụ; ma o yikarịrị ka ‘ụlọ’ nọchiri anya ndị bi n’ime ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: Mgbe unu na-abanye
  rationale: Nkebi okwu a na-eme ka participle nke dị ugbu a, nke na-akọwa iwu ahụ n’ụzọ oge, pụta n’Igbo dị mfe ma na-egosi na ekele ahụ na-eme mgbe ha na-abanye.
- source_word: δὲ
  choice: E tinyere ọrụ njikọ ya n’usoro ahịrịokwu ahụ
  rationale: δὲ bụ njikọ dị nro; n’Igbo, usoro ‘Mgbe unu na-abanye’ na-eburu njikọ ahụ nke ọma n’enweghị itinye okwu mmegide na-adịghị n’isi ebe a.
- source_word: οἰκίαν
  choice: ụlọ ahụ
  rationale: οἰκία nwere ike ịpụta ụlọ ahụ n’onwe ya ma ọ bụ ndị bi na ya. Ebe a na-ekwu maka ịbanye, ‘ụlọ ahụ’ na-edobe ihe oyiyi doro anya nke isi mmalite ma hapụkwa ojiji nnọchi anya ndị bi n’ime ya.
- source_word: ἀσπάσασθε
  choice: keleenụ
  rationale: Nke a bụ iwu aorist nye ọtụtụ mmadụ. ‘Keleenụ’ bụ okwu Igbo nkịtị, doro anya, ma dị ùgwù maka inye ekele.
- source_word: αὐτήν
  choice: ya
  rationale: Nnọchiaha nwanyị otu a na-ezo aka na οἰκίαν. ‘Ya’ na-edobe ntụaka kpọmkwem n’ụlọ ahụ, kama ịgbanwe ya n’ime isi ederede ka ọ bụrụ ndị bi n’ụlọ.
theological_decisions:
- issue: Ịkele ụlọ ahụ n’ụzọ nnọchi anya ma ọ bụ ikwu ndị bi n’ime ya hoo haa
  choice: E debere ‘keleenụ ya’ n’isi ederede.
  alternative: ‘keleenụ ezinaụlọ ahụ’ ma ọ bụ ‘keleenụ ndị bi n’ime ya’
  rationale: Grik kwuru kpọmkwem ‘keleenụ ya,’ ebe αὐτήν na-ezo aka na οἰκίαν. Idebe nke a na-asọpụrụ ọdịdị okwu mbụ ma ghara itinye nkọwa n’isi ederede; nkọwa ala peeji na-egosi na o yikarịrị ka ụlọ ahụ nọchiri anya ndị bi n’ime ya.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị mfe nghọta, ma dị ùgwù. E ji ‘unu’ na ‘keleenụ’ gosipụta na a na-agwa ọtụtụ mmadụ okwu. Akara ala peeji [a] dị n’isi ederede.
