id: MAT.10.17
reference: Matthew 10:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: ig
  text: Ma kpacharanụ anya n’ebe ndị mmadụ[a] nọ, n’ihi na ha ga-enyefe unu n’aka kansụl dị iche iche, ha ga-apịakwa unu ụtarị n’ụlọ nzukọ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị nwoke”; okwu Grik ahụ dị n’ụdị ọtụtụ nke nwoke, ma n’ebe a ọ na-ezo aka n’ụzọ izugbe n’ebe ndị mmadụ nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχετε
  choice: kpacharanụ anya
  rationale: Ụdị iwu a na-adọ ọtụtụ ndị aka ná ntị ka ha mụrụ anya maka ihe ize ndụ; okwu a bụ Igbo nkịtị ma doo anya.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị mgbanwe ma ọ bụ ntụgharị gaa n’ịdọ aka ná ntị, dịka njikọ Grik ahụ si arụ ọrụ n’ebe a.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: maka ndị mmadụ
  rationale: Mgbe προσέχω sochiri ἀπό, ọ na-egosi isi iyi nke ihe ize ndụ. “Ndị mmadụ” na-egosipụta ojiji izugbe nke ἄνθρωποι n’enweghị ime ka ọ bụrụ naanị ndị nwoke.
- source_word: παραδώσουσιν
  choice: ga-enyefe unu n’aka
  rationale: Ọ na-egosi inyefe mmadụ n’aka ndị ọchịchị ma ọ bụ ndị ikpe, ọ bụghị ịkọwa kpọmkwem na ọ bụ nrara nye sitere n’aka onye ha na ya dị ná mma.
- source_word: συνέδρια
  choice: ndị kansụl
  rationale: Ọtụtụ aha a na-ezo aka n’òtù ndị ọchịchị ma ọ bụ ndị ikpe nke obodo dị iche iche, ọ bụghị naanị Sanhedrin dị na Jerusalem.
- source_word: συναγωγαῖς
  choice: ụlọ nzukọ ndị Juu
  rationale: Nke a bụ okwu Igbo doro anya maka ebe ndị Juu na-ezukọ maka ofufe na ihe gbasara obodo.
- source_word: αὐτῶν
  choice: ha
  rationale: 'Ọ na-ejikọta ụlọ nzukọ ndị ahụ na ndị ga-emegide ndị na-eso ụzọ: “ụlọ nzukọ ndị Juu ha.”'
- source_word: μαστιγώσουσιν
  choice: ga-apịa unu ụtarị
  rationale: Ọ na-egosipụta ntaramahụhụ anụ ahụ site n’ịpịa ụtarị n’asụsụ Igbo doro anya ma dị nkwanye ùgwù.
theological_decisions:
- issue: Otú e si tụgharị ἀνθρώπων gbasara okike nwoke na nwaanyị
  choice: ndị mmadụ
  alternative: ndị nwoke
  rationale: Ọ bụ ezie na okwu Grik ahụ dị n'ụdị ọtụtụ nke nwoke n'usoro ụtọasụsụ, ihe ọ pụtara n'ebe a bụ ndị mmadụ n'ozuzu ha dịka ndị mmegide; “ndị nwoke” ga-eme ka ihe ahụ pụta warara karịa isi mmalite.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu. “Kansụl” na-egosi òtù ikpe ma ọ bụ ọchịchị obodo n’enweghị ịkpọ ha Sanhedrin; “ụlọ nzukọ ndị Juu” na-eme ka ọnọdụ ndị Juu doo onye na-agụ Igbo anya.
