  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: ig
  text: Ọ̀ bụghị otu asarịọn[b] ka a na-ere nza abụọ? Ma ọbụna otu n’ime ha agaghị ada n’ala na-enweghị Nna unu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “e wezụga Nna unu.” Okwu ahụ nwere ike igosi na ọ bụghị n’enweghị ihe ọmụma ya, nlekọta ya, ma ọ bụ uche ya; ma Grik akọwaghị nke ọ bụ kpọmkwem.
    reason: alternative_reading
  - marker: b
    text: Asarịọn bụ obere mkpụrụ ego ọla kọpa ndị Rom nke ọnụ ahịa ya pere nnọọ mpe.
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: ụmụ nnụnụ nta
  rationale: Okwu Grik a na-ezokarị aka n’ụmụ nnụnụ nta, karịsịa sparrow. Nhọrọ a bụ Igbo nkịtị ma ghara ịmanye aha ụdị nnụnụ ebe ọ na-adịghị adị mfe n’Igbo.
- source_word: ἀσσαρίου
  choice: otu asarịọn
  rationale: E debere aha mkpụrụ ego Rom ahụ iji chekwaa nkọwa akụkọ ihe mere eme; ihe odide ala peeji kọwara ntakịrị uru ya.
- source_word: πωλεῖται
  choice: a naghị ere
  rationale: Nke a na-egosipụta ugbu a nke passive n’ụzọ ajụjụ ọnụ na-ada nke ọma n’Igbo.
- source_word: ἓν ἐξ αὐτῶν
  choice: otu n’ime ha
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke nkịtị isi kwuo akụkụ sitere n’etiti ha.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: ga-ada n’ala
  rationale: Ọ na-enye ọdịnihu nke ngwaa ahụ na ebe ọ dara n’Igbo eke.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: ma Nna unu anọghị na ya
  rationale: Nhọrọ a na-edobe echiche ‘ọ bụghị n’enweghị Nna unu’ n’agbakwụnyeghị kpọmkwem ma ọ bụ ihe ọmụma ya, uche ya, ma ọ bụ nlekọta ya ka e bu n’obi.
- source_word: οὐχὶ ... ;
  choice: Ọ̀ bụ na a naghị ...?
  rationale: Ụdị ajụjụ Igbo a na-atụ anya azịza nkwenye, dịka οὐχί si arụ ọrụ.
- source_word: καὶ
  choice: Ma
  rationale: N’ebe a, ọ na-egosi ntụgharị dị n’etiti ọnụ ahịa ha dị ala na nlekọta Nna; ‘Ma’ na-eme ka njikọ ahụ doo anya n’Igbo.
theological_decisions:
- issue: Ihe ‘ma Nna unu anọghị na ya’ pụtara gbasara nlekọta Chineke
  choice: E chekwara okwu sara mbara nke na-ekwughị kpọmkwem ụdị mmekọrịta Nna ahụ.
  alternative: n’amaghị Nna unu; ma ọ bụ na-abụghị uche Nna unu
  rationale: Grik na-egosi na ọdịda nnụnụ ahụ adịghị iche n’ebe Nna nọ, ma ọ kọwaghị kpọmkwem ma ihe ọmụma, uche, nkwenye, ọnụnọ, ma ọ bụ nlekọta ya ka a na-ekwu. Ya mere, a zere ịkpa ókè nkuzi nke ederede n’onwe ya na-akọwaghị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘ụmụ nnụnụ nta’ zere aha ụdị nnụnụ a na-amaghịkarị n’Igbo, ma e debere ‘asarịọn’ maka izi ezi akụkọ ihe mere eme. E tinyere akara ihe odide ala peeji abụọ n’ahịrị bụ isi.
