revisions:
- from: Ọ̀ bụ na a naghị ere ụmụ nnụnụ nta abụọ otu asarịọn? Ma ọ dịghị otu n’ime ha ga-ada n’ala ma Nna unu anọghị na ya[a]. [b]
  to: Ọ̀ bụghị otu asarịọn[b] ka a na-ere nza abụọ? Ma ọbụna otu n’ime ha agaghị ada n’ala na-enweghị Nna unu[a].
  rationale: The revision replaces an interpretive expression of the Father’s presence with “na-enweghị Nna unu,” which directly represents ἄνευ while leaving the nature of the Father’s relation to the event unspecified. It also renders στρουθία as “nza,” uses a more natural Igbo price-question construction, and places each footnote marker at its relevant word or phrase.
