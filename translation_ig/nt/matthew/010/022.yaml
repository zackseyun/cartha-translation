reference: Matthew 10:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: ig
  text: Mmadụ niile ga-akpọ unu asị n’ihi aha m[a]. Ma onye tachiri obi[b] ruo ọgwụgwụ ka a ga-azọpụta[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi m.” N’ebe a, “aha” na-anọchi anya onye Jizọs bụ na njikọ mmadụ na ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye nọgidere guzosie ike.”
    reason: lexical_alternative
  - marker: c
    text: “A ga-azọpụta” nwekwara ike ịpụta “a ga-anapụta” ma ọ bụ “a ga-agbapụta,” dabere n’otú a ghọtara ihe gbara amaokwu a gburugburu.
    reason: alternative_reading
  - marker: d
    text: 'N’ụzọ na-egosipụta nkwusi okwu Grik nke ọma karị: “Ma onye tachiri obi ruo ọgwụgwụ, onye ahụ ka a ga-azọpụta.”'
    reason: source_emphasis
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: Mmadụ niile ga-akpọ unu asị
  rationale: Nke a bụ ụzọ Igbo si ekwu ya nke ọma ma doo anya, ọ na-egosikwa na mmadụ niile bụ ndị na-akpọ ha asị, dị ka passive na ὑπό dị n’asụsụ Grik si kwuo.
- source_word: διὰ τὸ ὄνομά μου
  choice: n’ihi aha m
  rationale: διά na accusative na-egosi ihe kpatara ya. ‘Aha m’ na-edobe okwu ihe atụ nke na-anọchi anya onye Jizọs bụ, ikike ya, na njikọ mmadụ na ya.
- source_word: ὁ δὲ ὑπομείνας
  choice: onye tachiri obi
  rationale: ‘Ịtachi obi’ bụ okwu Igbo nkịtị na nke kwesịrị nsọpụrụ maka ịnọgide n’ọnọdụ siri ike n’agbanyeghị mkpagbu, n’etinyeghị nkọwa ozizi ọzọ n’ime amaokwu ahụ.
- source_word: εἰς τέλος
  choice: ruo ọgwụgwụ
  rationale: Nke a na-egosi ịnọgide na-atachi obi ruo n’ókè ikpeazụ, ma ọ naghị ekpebi kpọmkwem ihe ‘ọgwụgwụ’ ahụ bụ.
- source_word: οὗτος
  choice: ka
  rationale: Usoro nkwusi okwu ‘onye ... ka’ bụ ụzọ Igbo dị mma isi gosipụta ike e nyere οὗτος n’enweghị ikwughachi ‘onye ahụ’ n’ụzọ ga-adị arọ.
- source_word: σωθήσεται
  choice: a ga-azọpụta
  rationale: ‘Ịzọpụta’ na-edobe obosara ihe σῴζω nwere ike ịpụta—nzọpụta, mgbapụta, ma ọ bụ ịnapụta mmadụ—n’ebughị ụzọ kpebie ụdị nzọpụta a na-ekwu maka ya.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ịtachi obi ruo ọgwụgwụ na nzọpụta
  choice: E debere okwu sara mbara, ‘a ga-azọpụta,’ n’emeghị ka amaokwu ahụ kụziere otu usoro ozizi pụrụ iche.
  alternative: Ịkọwa ya kpọmkwem dị ka ịnapụta mmadụ n’ahụhụ anụ ahụ, nzọpụta ikpeazụ, ma ọ bụ nkwenye otu ụka banyere ịnọgide n’okwukwe.
  rationale: Amaokwu ahụ jikọtara ịtachi obi n’oge mkpagbu na nzọpụta, ma ihe odide ahụ akọwaghị ebe a kpọmkwem ụdị nzọpụta ahụ ma ọ bụ usoro ozizi zuru ezu banyere njikọ ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. Usoro ‘onye ... ka’ na-eme ka okwu ahụ bụrụ ihe ndị Igbo na-ekwu n’ụzọ ebumpụta ụwa ma na-edobekwa nkwusi okwu nke Grik. E zere okwu ụka pụrụ iche na nkọwa nke ga-ekpebi esemokwu ozizi.
