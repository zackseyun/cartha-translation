id: MAT.10.11
reference: Matthew 10:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: ig
  text: Obodo ukwu ma ọ bụ obodo nta ọ bụla unu banyere, chọpụtanụ[a] onye nọ n’ebe ahụ kwesịrị ekwesị[b]; nọgidekwanụ n’ebe ahụ ruo mgbe unu ga-apụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “jụtanụ ase” ma ọ bụ “nyochaanụ.”
    reason: lexical_alternative
  - marker: b
    text: N’ebe a, “kwesịrị ekwesị” yikarịrị ka ọ na-ekwu maka onye dabara adaba ma ọ bụ onye dị njikere ịnabata ndị ozi ahụ, karịa ikwu maka onye ji ọrụ ya nweta ihu ọma Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε
  choice: Obodo ukwu ma ọ bụ obodo nta ọ bụla unu banyere
  rationale: Nhazi a na-egosi ebe ọ bụla ndị na-eso ụzọ nwere ike ịbanye, ma na-edobekwa ọdịiche dị n’etiti πόλις na κώμη dị ka obodo ukwu na obodo nta.
- source_word: ἐξετάσατε
  choice: chọpụtanụ
  rationale: Okwu a bụ iwu ka ha jiri nlezianya jụọ ajụjụ ma chọpụta onye kwesịrị ekwesị. “Chọpụtanụ” bụ Igbo doro anya ma dị ugbu a; ihe odide ala peeji na-egosi na ọ gụnyere ịjụ ase ma ọ bụ nyocha.
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: onye nọ n’ebe ahụ kwesịrị ekwesị
  rationale: Nke a na-ejikọta onye ahụ na obodo a kpọrọ aha ma na-edobe echiche nyocha dị na ἄξιος, n’ebughị ụzọ kpebie kpamkpam ma ọ bụ naanị ịdị njikere ịnabata ndị ozi ka okwu ahụ pụtara.
- source_word: κἀκεῖ μείνατε
  choice: nọgidekwanụ n’ebe ahụ
  rationale: “Nọgidekwanụ” na-egosi iwu nke ịnọgide, ebe “n’ebe ahụ” na-edobe ntụaka ἐκεῖ n’enweghị itinye “n’ụlọ ya,” nke adịghị kpọmkwem n’amaokwu Grik.
- source_word: ἕως ἂν ἐξέλθητε
  choice: ruo mgbe unu ga-apụ
  rationale: Nke a na-egosi njedebe ọdịnihu nke oge ha ga-anọ n’ebe ahụ, dị ka ἕως ἂν na subjunctive si eme.
theological_decisions:
- issue: Ihe ἄξιος (“kwesịrị ekwesị”) pụtara n’iwu iziga ndị ozi
  choice: E debere “kwesịrị ekwesị” n’ahịrị bụ isi, ma kọwaa na o nwere ike ịpụta onye dabara adaba ma ọ bụ dị njikere ịnabata ndị ozi.
  alternative: Ịsụgharị ya ozugbo dị ka “onye dị njikere ịnabata unu.”
  rationale: Ọnọdụ okwu ahụ na-atụ aka n’onye ga-anabata ndị ozi, ma ἄξιος ka nwere echiche sara mbara banyere onye kwesịrị ekwesị. Ya mere, e kwesịghị ime ka ntụgharị ahụ kwuo na onye ahụ nwetara ihu ọma Chineke site n’ọrụ ya, ma e kwesịghịkwa ihichapụ kpamkpam nyocha dị n’okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E tinyere akara [a] ozugbo n’azụ okwu ἐξετάσατε metụtara, ma tinye [b] n’azụ “kwesịrị ekwesị.” A hapụrụ “n’ebe ahụ” ka ọ ghara ịgbakwunye “n’ụlọ ya” n’ihi na nke ahụ adịghị kpọmkwem n’ederede Grik.
