  naturalness: The Igbo is clear, modern Standard Igbo, and suitably instructional in register. “Chọpụtanụ” and “onye ... kwesịrị ekwesị” are natural in context.
  terminology: “Obodo ukwu ... obodo nta” preserves the settlement contrast, while “kwesịrị ekwesị” retains the evaluative breadth of ἄξιος without prematurely narrowing it to hospitality. Footnote b should not state categorically that the term does not concern earned divine favor, since the contextual explanation is interpretive; it should be framed as the likely contextual sense.
