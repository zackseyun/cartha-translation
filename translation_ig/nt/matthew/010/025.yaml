revisions:
- from: O zuuru onye na-eso ụzọ ka ọ dị ka onye nkụzi ya, o zukwara ohu ka ọ dị ka nna ya ukwu. Ọ bụrụ na ha kpọrọ onye nwe ụlọ Beelzebul[a], lee ka ha ga-esi kpọọ ndị ezinụlọ ya aha ọjọọ karịa!
  to: O zuuru onye na-eso ụzọ ịdị ka onye nkụzi ya, zukwara ohu ịdị ka nna ya ukwu. Ọ bụrụ na ha kpọrọ onye nwe ụlọ Beelzebul[a], lee ka ọ ga-aka ndị ezinaụlọ ya njọ!
  rationale: The revision removes the unsupported addition “aha ọjọọ” while expressing the Greek a fortiori ellipsis naturally in Igbo (“lee ka ọ ga-aka ... njọ”). It also improves the first two clauses’ idiom and preserves the broader household sense in “ndị ezinaụlọ ya.” The footnote now accurately characterizes Beelzebub as the familiar English traditional variant.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:33:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the disciple–teacher and slave–master comparisons and retains Beelzebul. However, the final clause adds the specific idea of calling the household members “bad names” ("aha ọjọọ"), which is not stated in the Greek. The Greek leaves the repeated verb implicit after “they called,” and the Igbo should likewise avoid specifying more than the source does.
  naturalness: Most wording is understandable Standard Igbo. “O zuuru onye na-eso ụzọ ka ọ dị ka ...” is less idiomatic and weakens γένηται (“become”); using “ịdị ka” after “O zuuru ...” is smoother. “ndị ezinaụlọ ya” naturally conveys the household group more broadly than a narrowly biological family.
  terminology: “onye na-eso ụzọ,” “onye nkụzi,” “ohu,” and “nna ya ukwu” appropriately preserve the social and instructional pairings. “Onye nwe ụlọ” is an acceptable rendering of οἰκοδεσπότης in this context. The footnote should identify Beelzebub as a familiar traditional English variant, not merely a generic familiar form.
  issues:
  - severity: medium
    issue: The final clause adds “aha ọjọọ.”
    rationale: πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ contains an ellipsis of the preceding verb and does not explicitly say “bad names.” Adding this specifies the nature of the designation beyond the source.
  - severity: low
    issue: “ka ọ dị ka” does not clearly convey γένηται.
    rationale: The aorist subjunctive γένηται refers to becoming like the teacher/master. “ịdị ka” is more natural after “O zuuru ...” while retaining the intended result.
  - severity: low
    issue: The footnote omits the English-tradition qualification.
    rationale: The audit trail describes “Beelzebub” as a familiar variant in English tradition; the Igbo note should state this accurately.
  revised_text: O zuuru onye na-eso ụzọ ịdị ka onye nkụzi ya, zukwara ohu ịdị ka nna ya ukwu. Ọ bụrụ na ha kpọrọ onye nwe ụlọ Beelzebul[a], lee ka ọ ga-aka ndị ezinaụlọ ya njọ!
  revised_footnotes:
  - marker: a
    text: A pụkwara ịkpọ ya “Beelzebub,” bụ ụdị aha ọzọ a maara nke ọma n’ọdịnala Bekee.
    reason: alternative_reading
  revision_rationale: The revision removes the unsupported addition “aha ọjọọ” while expressing the Greek a fortiori ellipsis naturally in Igbo (“lee ka ọ ga-aka ... njọ”). It also improves the first two clauses’ idiom and preserves the broader household sense in “ndị ezinaụlọ ya.” The footnote now accurately characterizes Beelzebub as the familiar English traditional variant.
