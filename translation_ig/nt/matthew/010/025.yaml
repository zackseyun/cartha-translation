id: MAT.10.25
reference: Matthew 10:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: ig
  text: O zuuru onye na-eso ụzọ ịdị ka onye nkụzi ya, zukwara ohu ịdị ka nna ya ukwu. Ọ bụrụ na ha kpọrọ onye nwe ụlọ Beelzebul[a], lee ka ọ ga-aka ndị ezinaụlọ ya njọ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịkpọ ya “Beelzebub,” bụ ụdị aha ọzọ a maara nke ọma n’ọdịnala Bekee.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρκετὸν
  choice: O zuuru
  rationale: Nke a na-egosipụta izu oke ma bụrụ ụzọ e si ekwu ya n’Igbo nkịtị n’enweghị ịgbatị ihe okwu Grik pụtara.
- source_word: μαθητῇ
  choice: onye na-eso ụzọ
  rationale: Ọ na-egosipụta onye na-amụta ihe site n’iso onye nkụzi ya, ọ bụghị naanị nwa akwụkwọ nọ n’ụlọ akwụkwọ.
- source_word: ἵνα γένηται ὡς
  choice: ka ọ dị ka
  rationale: N’ọnọdụ a, okwu ahụ na-ekwu maka iru n’ogo nke ịdị ka onye ọzọ; nsụgharị a bụ nke eke n’Igbo ma na-edobe echiche nke ihe a na-atụ anya ya.
- source_word: διδάσκαλος
  choice: onye nkụzi
  rationale: Nke a dabara na njikọ dị n’etiti μαθητής na διδάσκαλος, ma na-ekewapụ okwu a na κύριος nke na-esote.
- source_word: δοῦλος
  choice: ohu
  rationale: N’ebe a, ọdịiche ọkwa dị n’etiti δοῦλος na κύριος pụtara onye nọ n’okpuru ikike nna ya ukwu; ‘ohu’ na-edobe ịdị arọ nke mmekọrịta ahụ.
- source_word: κύριος
  choice: nna ya ukwu
  rationale: Ọ bụ okwu ụlọ na ọchịchị n’ebe a, ya mere ‘nna ya ukwu’ dabara karịa aha nsọ ‘Onyenweanyị’.
- source_word: οἰκοδεσπότην
  choice: onye nwe ụlọ
  rationale: Ọ na-egosi onye isi na-achị ezinụlọ ma na-ejikọta nke ọma na ‘ndị ezinụlọ ya’ n’ikpeazụ.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: A gbasoro kpọmkwem ụdị aha dị n’ihe odide Grik SBLGNT.
- source_word: ἐπεκάλεσαν
  choice: ha kpọrọ
  rationale: N’ebe a, ngwaa ahụ pụtara ịkpọ mmadụ otu aha ma ọ bụ ịkpọ ya ihe.
- source_word: πόσῳ μᾶλλον
  choice: lee ka ... karịa
  rationale: Nke a na-ebute arụmụka nke na-esi n’ihe nta aga n’ihe ka ukwuu n’ụzọ doro anya ma dịkwa eke n’Igbo.
- source_word: οἰκιακοὺς
  choice: ndị ezinụlọ ya
  rationale: Okwu ahụ gbasara ndị niile so n’ezinụlọ ahụ, ọ bụghị naanị ndị ohu.
theological_decisions:
- issue: Nsụgharị κύριος n’ihe atụ gbasara ohu na onye na-achị ya
  choice: nna ya ukwu
  alternative: Onyenweanyị
  rationale: N’ahịrịokwu a, κύριος na-egosi onye nwe ohu n’usoro mmekọrịta mmadụ, ọ bụghị aha e ji ekwupụta Kraịst kpọmkwem. Nhọrọ a na-edobe ihe atụ ahụ n’enweghị itinye echiche okpukpe nke okwu ahụ anaghị ekwupụta n’onwe ya.
- issue: Nsụgharị δοῦλος
  choice: ohu
  alternative: odibo
  rationale: Ọdịiche dị n’etiti δοῦλος na κύριος na-akọwa onye nọ n’okpuru ikike nna ya ukwu. ‘Ohu’ na-edobe ọnọdụ ahụ nke ọma karịa ‘odibo,’ nke nwere ike ime ka njikọ ahụ dị nro.
- issue: Mmezu e zoro ezo na πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ
  choice: lee ka ha ga-esi kpọọ ndị ezinụlọ ya aha ọjọọ karịa
  alternative: ọ̀ bụkwaghị ndị ezinụlọ ya karịa?
  rationale: 'Grik hapụrụ ngwaa nke nkebi ikpeazụ n’ihi na a ghọtara ya site na ‘ha kpọrọ’ nke bu ụzọ. E tinyere ‘aha ọjọọ’ n’Igbo iji mee ka ntụnyere ahụ bụrụ nke a na-aghọta nke ọma, n’enweghị ịgbanwe isi arụmụka: ọ bụrụ na e kwutọrọ onye isi ụlọ, a ga-akatọ ndị nke ya karịa.'
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta, sụgharịa amaokwu ahụ. ‘Onye na-eso ụzọ,’ ‘onye nkụzi,’ ‘ohu,’ na ‘nna ya ukwu’ na-edobe njikọ abụọ nke ihe odide Grik. E tinyere akara nkọwa ala ala [a] ozugbo n’aha Beelzebul, ebe nkọwa ahụ metụtara.
