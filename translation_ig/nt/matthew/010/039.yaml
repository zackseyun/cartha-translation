id: MAT.10.39
reference: Matthew 10:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: ig
  text: Onye chọtara ndụ ya ga-atụfu ya[a], ma onye tụfuru ndụ ya n’ihi m ga-achọta ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ obi,” n’ebe abụọ ahụ; okwu Grik bụ ψυχή, nke nwere ike ịpụta “ndụ” ma ọ bụ “mkpụrụ obi,” ma “ndụ” dabara nke ọma n’ọnọdụ a nke ịtụfu na ịchọta ndụ mmadụ n’ịgbaso Jizọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: Onye chọtara
  rationale: Nkebiokwu a na-arụ ọrụ dị ka aha ma na-ezo aka n’onye ọ bụla n’ụzọ nnọchianya. “Onye chọtara” bụ Igbo dị mfe ma na-edobe ụdị otu onye nke Grik.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ndụ ya
  rationale: N’ọnọdụ a, ψυχή pụtara ndụ mmadụ nke ọ na-achọ ichekwa ma ọ bụ nke ọ na-etinye n’ihe ize ndụ n’ihi iso Jizọs, ọ bụghị naanị mkpụrụobi dị iche n’ahụ.
- source_word: ἀπολέσει αὐτήν
  choice: ga-atụfu ya
  rationale: “Ga-atụfu” na-egosi mfu, ma na-edobe ntụgharị okwu dị n’etiti ịchọta na ịtụfu.
- source_word: ὁ ἀπολέσας
  choice: onye tụfuru
  rationale: Oge gara aga nke ngwaa a na Grik dabara n’usoro ilu a; “onye tụfuru” na Igbo na-ejikọta omume ahụ nke ọma na ihe ga-eso ya.
- source_word: ἕνεκεν ἐμοῦ
  choice: n’ihi m
  rationale: Nke a na-egosi ihe kpatara ya—ịtụfu ndụ n’ihi njikọ na nrubeisi nye Jizọs—n’Igbo nkịtị ma doo anya.
- source_word: εὑρήσει αὐτήν
  choice: ga-achọta ya
  rationale: “Ga-achọta” na-edobe otu ngwaa ahụ e ji malite amaokwu ahụ, ya mere o chekwara nhazi okwu mgbagwoju anya nke ịchọta, ịtụfu, na ịchọtaghachi.
theological_decisions:
- issue: Nsụgharị ψυχή n’okwu mgbagwoju anya banyere iso ụzọ Jizọs
  choice: ndụ
  alternative: mkpụrụobi
  rationale: Amaokwu ahụ na-ekwu banyere mmadụ ijidesi ndụ ya ike ma ọ bụ ịhapụ ya n’ihi Jizọs. “Ndụ” dabara n’ọnọdụ ahụ nke ọma, ebe “mkpụrụobi” ka bụ ihe ψυχή nwekwara ike ịpụta, ya mere e debere ya n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E chekwara ụdị ilu ahụ na ntụgharị okwu ya—ịchọta/ịtụfu na ịtụfu/ịchọta—n’enweghị ịkọwa ihe omimi ya karịa ka isi mmalite si kwuo.
