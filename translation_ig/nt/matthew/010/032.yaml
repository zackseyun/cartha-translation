  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: ig
  text: Ya mere, onye ọ bụla nke ga-ekwupụta m n'ihu ndị mmadụ,[a] mụ onwe m ga-ekwupụtakwa ya n'ihu Nna m nke nọ n'eluigwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grik kwuru n'ụzọ nkịtị karị, “n'ime m.” N'ebe a, okwu ahụ na-ekwu maka ikwupụta ma ọ bụ ikweta Jizọs n'ihu ọha.
    reason: lexical_alternative
  - marker: b
    text: Grik kwuru n'ụzọ nkịtị karị, “n'ime ya” ma ọ bụ “banyere ya.” E ji “ya” mee nsụgharị Igbo dị mfe ma debe mmegharị okwu ahụ na nkebi mbụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Ya mere, onye ọ bụla nke
  rationale: Nke a na-edobe njikọ nkwubi okwu nke οὖν ma na-egosipụta okwu ahụ gbasara onye ọ bụla n'ụzọ Igbo dị mma.
- source_word: ὁμολογήσει ἐν ἐμοὶ
  choice: ga-ekwupụta ... na ọ bụ nke m
  rationale: ὁμολογέω n'ebe a bụ ikweta ma ọ bụ ikwupụta Jizọs n'ihu ọha. Okwu 'na ọ bụ nke m' na-enye Igbo doro anya nke mmekọrịta na nkwado a, kama nsụgharị nkịtị na-adịghị eke nke ἐν.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: n'ihu ndị mmadụ
  rationale: ἀνθρώπων na-ezo aka n'ozuzu mmadụ niile; 'ndị mmadụ' bụ okwu Igbo ebumpụta ụwa ma zere ime ka okwu Grik nke ụdị nwoke bụrụ naanị ụmụ nwoke.
- source_word: ὁμολογήσω κἀγὼ ἐν αὐτῷ
  choice: mụ onwe m ga-ekwupụtakwa ... na onye ahụ bụ nke m
  rationale: A na-edobe mmeghachi okwu ὁμολογέω na nkwusi ike κἀγώ. Usoro a na-egosipụta nnabata onye ahụ n'ụzọ Igbo doro anya, ebe ndetu ala peeji na-echekwa ọdịdị ἐν αὐτῷ.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: Nna m nke nọ n'eluigwe
  rationale: Nke a bụ okwu Igbo dị ugbu a ma dị ùgwù maka ahịrịokwu Matiu a; 'eluigwe' na-ebupụta οὐρανοῖς n'ụzọ a na-anụkarị n'Igbo.
theological_decisions:
- issue: Nkwupụta Jizọs n'ihu ọha na nkwupụta mmeghachi omume nke Jizọs
  choice: E gosipụtara nkwa mmeghachi omume ahụ ozugbo, n'enweghị ịkọwapụta oge ma ọ bụ usoro ikpe ahụ.
  alternative: Ịkọwa ya kpọmkwem dị ka nkwupụta n'ikpe ikpeazụ, ma ọ bụ naanị dị ka okwu gbasara ịbụ onye na-eso ụzọ ugbu a.
  rationale: Amaokwu ahụ kwuru na Jizọs ga-ekwupụta onye ahụ n'ihu Nna ya, ma ọ naghị akọwa n'amaokwu a mgbe nke ahụ ga-eme ma ọ bụ usoro nkà mmụta okpukpe ya.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị mmadụ” maka ntụaka mmadụ niile. E tinyere “mụ onwe m” iji gosipụta nkwusi ike nke κἀγώ, ma debe otu ngwaa “kwupụta” n'akụkụ abụọ iji chekwaa nhazi mmeghachi okwu nke Grik.
