revisions:
- from: Onye ọ bụla nke na-adịghị eburu obe nke ya[a] ma na-eso m n’azụ[b] ekwesịghị m.
  to: Onye ọ bụla na-adịghị eburu obe nke ya[a] ma na-eso m n’azụ[b] erughị eru ịbụ onye nke m.
  rationale: The revision replaces the unclear final predicate with “erughị eru ịbụ onye nke m,” which naturally conveys the Greek judgment that such a person is not worthy of Jesus while preserving its relational force. It also streamlines the generic opening and corrects the grammatical detail in footnote a. The cross image and the explicit ‘behind me’ nuance remain intact.
