  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: ig
  text: Onye ọ bụla na-adịghị eburu obe nke ya[a] ma na-eso m n’azụ[b] erughị eru ịbụ onye nke m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, “obe ya” ji nnọchiaha nwoke nke otu onye; ma ejiri ya n’ozuzu, ya bụ, onye ọ bụla na-eso ụzọ ga-eburu obe nke ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya naanị dịka, “na-eso m.” Ma Grik kwuru ya n’ụzọ doro anya karị dịka, “na-eso m n’azụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Onye ọ bụla nke
  rationale: Nke a na-egosipụta onye ọbụla n’ozuzu ya ma na-edobe ike nke okwu ahụ dịka ọnọdụ e nyere onye na-eso ụzọ.
- source_word: λαμβάνει
  choice: na-adịghị eburu
  rationale: N’ọnọdụ a, iburu obe pụtara iwere ya n’ubu ma nabata ihe ọ ga-efu mmadụ; ‘iburu’ bụ okwu Igbo doro anya ma kwekọọ n’onyonyo obe.
- source_word: σταυρὸν
  choice: obe
  rationale: ‘Obe’ bụ okwu Igbo a na-aghọta nke ọma maka ngwa ndị Rom ji egbu mmadụ, ma ọ na-edobekwa ịdị arọ nke onyonyo ahụ n’ozizi banyere iso Jizọs.
- source_word: αὐτοῦ
  choice: nke ya
  rationale: ‘Nke ya’ na-egosi na onye ọ bụla ga-ebu obe nke ya. N’Igbo, ụdị a anaghị ekewa nwoke na nwanyị, ma ọ na-edobe onye ahụ dịka otu onye.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: na-eso m n’azụ
  rationale: Nke a na-edobe ma echiche nke iso Jizọs ma okwu ὀπίσω, nke na-akọwa ịnọ n’azụ ya.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: ekwesịghị m
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma dị ebube isi kwuo na onye ahụ erughị ịbụ onye kwesịrị Jizọs, na-enweghị ịgbasa ihe Grik kwuru.
theological_decisions:
- issue: Okwu banyere onye na-eso ụzọ iburu obe ya
  choice: E debere onyonyo ahụ kpọmkwem dịka ‘iburu obe nke ya.’
  alternative: Ịkọwa ya dịka ‘ịnabata ahụhụ’ ma ọ bụ ‘ịjụ onwe ya.’
  rationale: Okwu Grik ji obe n’onwe ya mee onyonyo nke nrubeisi ga-efu ihe, ihere, ahụhụ, na ọbụna ọnwụ. Ịgbanwe ya ka ọ bụrụ naanị nkọwa ga-ebelata obosara na ịdị arọ ya.
- issue: αὐτοῦ dịka nnọchiaha otu onye nke e ji anọchi anya mmadụ niile
  choice: A sụgharịrị ya ‘nke ya,’ nke na-arụ ọrụ maka onye ọ bụla n’Igbo.
  alternative: Ịkpọpụta nwoke kpọmkwem dịka ‘obe nke nwoke ahụ’ ma ọ bụ iji ọtụtụ mmadụ kwuo ya.
  rationale: Grik jiri ụdị otu onye nke bụ nke nwoke n’ụtọasụsụ, ma ihe ọ na-ekwu metụtara onye ọ bụla. ‘Nke ya’ na-edobe otu onye ahụ na ihe nke aka ya n’enweghị ịtinye oke nwoke na-adịghị n’uche okwu ahụ.
- issue: μου ἄξιος na mmekọrịta onye na-eso ụzọ na Jizọs
  choice: A sụgharịrị ya nkenke dịka ‘ekwesịghị m.’
  alternative: ‘Erughị eru ịbụ onye nke m’ ma ọ bụ ‘erughị eru iso m.’
  rationale: ‘Ekwesịghị m’ na-edobe okwu ikpe Jizọs siri ike ma ghara ikpebi karịa ihe genitive Grik ahụ pụtara—ma ọ bụ ịdị ya kwesịrị Jizọs, ịbụ nke ya, ma ọ bụ ịbụ onye kwesịrị iso ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma dịkwa nsọpụrụ. E debere usoro ahịrịokwu ahụ nso na Grik, ma jiri mmegharị ‘na-adịghị eburu … ma na-eso’ mee ka omume abụọ ahụ kwekọọ. Akara [a] na [b] dị n’ederede isi ma kwekọọ na nkọwa ala peeji.
