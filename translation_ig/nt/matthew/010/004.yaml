base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: ig
  text: Saimọn onye a kpọrọ Kananai[a], na Judas Iskarịọt[b], onye raakwara ya nye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Saimọn onye na-anụ ọkụ n’obi.” Okwu Grik ebe a bụ “Kananai,” ma o yikarịrị ka ọ na-egosipụta aha sitere n’asụsụ Arameik ma ọ bụ Hibru, nke a na-aghọtakarị dị ka “onye na-anụ ọkụ n’obi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye nyekwara ya n’aka.” Ngwaa Grik ahụ nwere ike ịpụta “inyefe mmadụ n’aka,” ma n’ihe gbasara Judas, “rara ya nye” dabara n’akụkọ a.
    reason: alternative_reading
lexical_decisions:
- source_word: Σίμων
  choice: Saimọn
  rationale: E degharịrị aha Grik ahụ n’ụdị aha a na-aghọta nke ọma n’Igbo.
- source_word: Καναναῖος
  choice: onye Kenan
  rationale: A họọrọ nsụgharị na-esochi aha e ji kpọọ ya n’asụsụ mmalite kama ịkọwa ya ozugbo dị ka ‘onye na-anụ ọkụ n’obi’; nkọwa ọzọ dị n’ala peeji.
- source_word: Ἰσκαριώτης
  choice: Iskarịọt
  rationale: A degharịrị aha njirimara a n’Igbo dịka aha mmadụ, kama ịsụgharị ya.
- source_word: παραδοὺς
  choice: rara ... nye
  rationale: N’ihe gbasara Judas, akpaokwu Igbo a na-egosi inyefe mmadụ n’aka ndị iro n’ụzọ aghụghọ, nke dabara n’ọrụ ya n’akụkọ Matiu; a debere ‘nyefere’ dị ka nsụgharị sara mbara n’ala peeji.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: onye mechakwara rara ya nye
  rationale: Nkebi ahịrịokwu a na-akọwapụta Judas site n’ihe o mere. ‘Mechakwara’ na-egosipụta καί ma mee ka okwu ahụ bụrụ Igbo dị mma.
theological_decisions:
- issue: Ma a ga-asụgharị παραδοὺς dịka ‘rara ya nye’ ma ọ bụ ‘nyefere ya.’
  choice: rara ya nye
  alternative: nyefere ya
  rationale: N’akụkọ Judas, ‘rara ya nye’ na-egosipụta omume aghụghọ nke inyefe Jizọs n’aka ndị iro. Ma ebe ngwaa Grik ahụ nwekwara nghọta sara mbara nke ‘inyefe,’ e debere nke ahụ n’ala peeji iji ghara izochi nghọta okwu mmalite ahụ nwere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. A degharịrị aha ndị mmadụ n’ụdị Igbo a na-amata, ma debe ọdịiche dị n’etiti nkọwa aha ‘onye Kenan/Zealot’ na nghọta abụọ nke παραδίδωμι n’ala peeji.
