revisions:
- from: Saimọn onye Kenan[a], na Judas Iskarịọt[b], onye mechakwara rara ya nye.
  to: Saimọn onye a kpọrọ Kananai[a], na Judas Iskarịọt[b], onye raakwara ya nye.
  rationale: The revision replaces the misleading ethnic expression “onye Kenan” with a transparent transliteration of the Greek designation and retains its customary interpretive sense only in the footnote. It also replaces the temporally colored “mechakwara” with “raakwara,” preserving the Greek additive καί while maintaining natural Standard Igbo. The rendering of Judas’s action and the alternative footnote retain the contextual and lexical range of παραδίδωμι.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:32:54Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the names Simon and Judas Iscariot and appropriately renders παραδούς as betrayal in context. However, “onye Kenan” means “a Canaanite/person from Canaan” in Igbo and therefore does not faithfully represent Καναναῖος, which is a distinct Greek form reflecting a Semitic designation traditionally understood as “Zealot.”
  naturalness: The clause “onye mechakwara rara ya nye” is understandable, but mechakwara can suggest temporal completion (“eventually/afterward”) rather than simply retaining the attributive καί (“also”). “onye raakwara ya nye” is more direct and natural in this list.
  terminology: Use a transliterated designation, “Kananai,” rather than “Kenan,” to avoid conflating Καναναῖος with a Canaanite identity. Retain “rara ya nye” for Judas’s treacherous handing over, with the broader alternative in the footnote.
  issues:
  - severity: high
    issue: “onye Kenan” misidentifies Simon as a Canaanite.
    rationale: Καναναῖος is not the Greek ethnic term for “Canaanite” (e.g., Χαναναῖος). It is traditionally connected with a Semitic term meaning “zealot.” Translating it as “onye Kenan” introduces a historically and lexically different designation.
  - severity: medium
    issue: “mechakwara” over-specifies the force of καί.
    rationale: The Greek καί means “also” in the identifying participial phrase; it does not clearly convey a temporal sense of having subsequently completed the act. “raakwara” retains the additive sense without that implication.
  revised_text: Saimọn onye a kpọrọ Kananai[a], na Judas Iskarịọt[b], onye raakwara ya nye.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Saimọn onye na-anụ ọkụ n’obi.” Okwu Grik ebe a bụ “Kananai,” ma o yikarịrị ka ọ na-egosipụta aha sitere n’asụsụ Arameik ma ọ bụ Hibru, nke a na-aghọtakarị dị ka “onye na-anụ ọkụ n’obi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye nyekwara ya n’aka.” Ngwaa Grik ahụ nwere ike ịpụta “inyefe mmadụ n’aka,” ma n’ihe gbasara Judas, “rara ya nye” dabara n’akụkọ a.
    reason: alternative_reading
  revision_rationale: The revision replaces the misleading ethnic expression “onye Kenan” with a transparent transliteration of the Greek designation and retains its customary interpretive sense only in the footnote. It also replaces the temporally colored “mechakwara” with “raakwara,” preserving the Greek additive καί while maintaining natural Standard Igbo. The rendering of Judas’s action and the alternative footnote retain the contextual and lexical range of παραδίδωμι.
