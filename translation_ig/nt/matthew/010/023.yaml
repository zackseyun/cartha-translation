id: MAT.10.23
reference: Matthew 10:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: ig
  text: Ma mgbe ọ bụla ha na-akpagbu unu n’obodo a, gbaga n’obodo ọzọ.[a] N’ihi na n’ezie, ana m agwa unu, unu agaghị emecha ịgafe obodo Izrel[b] tupu Nwa nke Mmadụ abịa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gbaga n’obodo na-esote.” N’asụsụ Grik, ihe e dere kpọmkwem bụ “gbaga n’ọzọ,” ebe a ghọtara “obodo” site n’okwu gara aga.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, e nwekwara ike ịsụ ya, “unu agaghị emecha obodo Izrel.” “Emecha ịgafe” na-eme ka njem izisa ozi nke a ghọtara n’ọnọdụ a pụta ìhè.
    reason: lexical_alternative
  - marker: c
    text: A hapụrụ “tupu Nwa nke Mmadụ abịa” ka ọ dị n’emeghe. Ndị na-akọwa Akwụkwọ Nsọ anaghị ekwekọ ma ọ̀ na-ezo aka na ngosipụta mmeri Jizọs, ọbịbịa ya n’ikpe, ka ọ̀ bụ nlọghachi ikpeazụ ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: mgbe ọ bụla
  rationale: Na-egosi oge a na-akọwaghị kpọmkwem nke nwere ike ime ugboro ugboro ma ọ bụ mgbe ọnọdụ ahụ bilitere.
- source_word: διώκωσιν
  choice: ha na-akpagbu
  rationale: N’ọnọdụ ozi a, okwu ahụ pụtara mkpagbu iro, ọ bụghị naanị ịchụ mmadụ ọsọ.
- source_word: πόλει ταύτῃ
  choice: n’obodo a
  rationale: Na-edobe ngosipụta dị nso nke okwu Grik ma na-eme ka ntụziaka Jizọs doo anya.
- source_word: φεύγετε
  choice: gbaga
  rationale: Iwu a na-egosi ịhapụ ebe ahụ ngwa ngwa n’ihi mkpagbu; ‘gbaga’ bụ okwu Igbo doro anya ma dị ike.
- source_word: εἰς τὴν ἑτέραν
  choice: n’obodo ọzọ
  rationale: E wepụrụ aha ‘obodo’ na Grik n’ihi na a ghọtara ya site n’ahịrịokwu gara aga; itinye ya n’Igbo na-eme ka okwu ahụ bụrụ ihe e ji ọnụ ekwu n’enweghị ịgbanwe isi ya.
- source_word: ἀμὴν
  choice: n’ezie
  rationale: Na-ebupụta okwu nkwenye siri ike nke onye nwere ikike; ‘n’ezie’ bụ asụsụ Igbo dị ugbu a ma dị ùgwù.
- source_word: οὐ μὴ τελέσητε
  choice: unu agaghị agafecha
  rationale: ‘Agaghị’ na-eburu ngọnarị siri ike, ebe ‘agafecha’ na-egosi imezu ịgagharị obodo ndị ahụ dịka ọnọdụ izisa ozi si gosi.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: obodo niile nke Izrel
  rationale: Na-ezo aka n’obodo ndị dị n’Izrel ma ọ bụ nke ndị Izrel; ‘niile’ na-eme ka ihe a ga-emezu n’obodo ndị ahụ pụta ìhè n’Igbo.
- source_word: ἕως ἂν ἔλθῃ
  choice: tupu ... abịa
  rationale: N’ahịrịokwu nwere ngọnarị, ‘tupu’ na-enye otu oke oge ọdịnihu ahụ n’Igbo n’ụzọ eke, n’agbanyeghị na a pụkwara ịsụ ya ‘ruo mgbe ... ga-abịa.’
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Na-edobe aha ahụ dịka ọ dị n’ụdị okwu mbụ nakwa njikọ ya na ihe ndị amụma na nkà mmụta okpukpe pụtara.
theological_decisions:
- issue: Ihe ‘tupu Nwa nke Mmadụ abịa’ pụtara n’ebe a
  choice: E debere okwu ahụ n’enweghị ịkọwa ụdị ọbịbịa ọ bụ.
  alternative: Ịkọwa ya dịka mbilite n’ọnwụ na ngosipụta mmeri Jizọs, ọbịbịa ikpe n’elu Jerusalem, ma ọ bụ nlọghachi ikpeazụ ya.
  rationale: Okwu Grik ahụ anaghị ekpebi n’onwe ya nke n’ime nghọta ndị a ziri ezi n’ebe a; ntụgharị ahụ kwesịrị idobe nghọta dị iche iche ahụ n’emeghe.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘na-akpagbu’ na ‘gbaga’ maka ntụziaka doro anya; e zere okwu ụka pụrụ iche. Ihe nrịbama ndetu ala ala [a], [b], na [c] niile dị n’ederede bụ isi.
