id: MAT.10.26
reference: Matthew 10:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: ig
  text: Ya mere, unu atụla ha egwu, n’ihi na ọ dịghị ihe e kpuchiri ekpuchi nke a na-agaghị ekpughe, ọ dịghịkwa ihe zoro ezo nke a na-agaghị eme ka a mara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: Ya mere, unu atụla ha egwu
  rationale: “Ya mere” na-egosipụta njikọ nkwubi okwu nke οὖν; “unu atụla ha egwu” na-edobe iwu ahụ nye ọtụtụ ndị na αὐτούς, ‘ha.’
- source_word: κεκαλυμμένον
  choice: ihe e kpuchiri ekpuchi
  rationale: Nhọrọ a na-edobe ihe oyiyi nkịtị nke ‘ikpuchi’ dị na participle perfect passive, ma na-ada nke ọma n’Igbo.
- source_word: ἀποκαλυφθήσεται
  choice: a na-agaghị ekpughe
  rationale: “Ikpughe” na-ebuga echiche nke iwepụ ihe mkpuchi ma mee ka ihe pụta ìhè; usoro ‘nke a na-agaghị…’ kwekọrọ n’ahịrịokwu njikọ nke Grik.
- source_word: κρυπτὸν
  choice: ihe zoro ezo
  rationale: Nke a bụ okwu Igbo doro anya maka ihe e debere na nzuzo ma ọ bụ ihe a na-adịghị ahụ anya.
- source_word: γνωσθήσεται
  choice: a na-agaghị eme ka a mara
  rationale: Ụdị passive a na-egosipụta na ihe ahụ ga-abụ nke a maara, na-enweghị ịkọ onye ga-eme ka a mara ya.
theological_decisions:
- issue: Onye na-eme mkpughe na ime ka a mara
  choice: E jiri passive na-enweghị ịkpọ onye na-eme ya
  alternative: Ịsị kpọmkwem na Chineke ga-ekpughe ma mee ka a mara
  rationale: Ihe odide Grik akpọghị onye na-eme omume ndị a; nsụgharị ahụ na-echekwa nghọta ahụ mepere emepe ma ghara itinye nkọwa okpukpe na-adịghị n’amaokwu ahụ.
- issue: Mmekọrịta dị n’etiti ‘kpuchiri’ na ‘zoro ezo’
  choice: E debere ha dịka okwu abụọ yiri ibe ha ma dị iche
  alternative: Ijikọta ha n’otu okwu dịka ‘ihe nzuzo’
  rationale: Grik ji κεκαλυμμένον na κρυπτόν mee ahịrị abụọ yiri ibe ha; idebe ha abụọ na-echekwa usoro na ike okwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. E jiri ‘unu’ gosi na okwu ahụ bụ nye ọtụtụ ndị. Enweghị akara nkọwa ala peeji n’ihi na ọ dịghị mkpa maka amaokwu a.
