  verdict: approve
  source_fidelity: 'Nsụgharị ahụ na-anọchi anya akụkụ niile dị mkpa nke Grik: οὖν dịka “Ya mere”; iwu ọtụtụ mmadụ μὴ ... φοβηθῆτε αὐτούς dịka “unu atụla ha egwu”; yana usoro ahịrị abụọ yiri ibe ha banyere ihe e kpuchiri na ihe zoro ezo. Usoro “ọ dịghị ihe ... nke a na-agaghị ...” na-ebuga nke ọma nkwupụta Grik na-adịghị mma, ya bụ, na ihe ọ bụla e zoro ga-emecha pụta ìhè ma ọ bụ bụrụ nke a maara.'
  naturalness: Igbo ahụ bụ Standard Igbo doro anya ma na-ada n’ụzọ nkịtị. “E kpuchiri ekpuchi” na “zoro ezo” na-arụ ọrụ nke ọma dịka okwu abụọ na-adị nso n’echiche ma na-adịghị akagbu ibe ha. “A na-agaghị eme ka a mara” na-adị ntakịrị ogologo, ma ọ bụ usoro ziri ezi, nke doro anya, ma na-echekwa passive nke Grik.
  terminology: “Ekpughe” dabara nke ọma na ἀποκαλυφθήσεται, ebe “eme ka a mara” na-ebuga γνωσθήσεται n’enweghị ịkpọ Chineke ma ọ bụ onye ọzọ dịka onye na-eme ihe ahụ. Nke a na-echekwa ambiguity nke ederede mbụ. Enweghị okwu nkà mmụta okpukpe ma ọ bụ aha chọrọ mgbanwe.
