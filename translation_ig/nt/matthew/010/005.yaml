  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: ig
  text: Jizọs zipụrụ ndị a iri na abụọ, mgbe o nyere ha iwu, sị, “Unu agala n’ụzọ ndị mba ọzọ[a], unu abanyekwala n’obodo ndị Sameria[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ụzọ na-eduga n’ebe ndị mba ọzọ nọ.” Okwu Grik ahụ na-ekwu kpọmkwem banyere ụzọ; o nwere ike izo aka n’ụzọ ndị mba ọzọ ma ọ bụ n’ịga n’akụkụ ókèala ha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’obodo Sameria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: ndị a iri na abụọ
  rationale: Ọ na-egosi kpọmkwem mmadụ iri na abụọ a kpọtụrụ aha n’amaokwu ndị bu ụzọ, n’etinyeghị ‘ndị na-eso ụzọ’ nke na-adịghị n’okwu Grik.
- source_word: ἀπέστειλεν
  choice: zipụrụ
  rationale: ‘Zipụrụ’ bụ okwu Igbo dị mfe nke na-egosi iziga ha ka ha gaa rụọ ọrụ e nyere ha.
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: nye ha iwu sị
  rationale: Nke a na-ejigide ike ntụziaka dị na παραγγέλλω ma na-asụkwa ya n’ụzọ Igbo dị ire; ‘sị’ na-ewebata okwu e kwuru kpọmkwem.
- source_word: Εἰς ὁδὸν ἐθνῶν
  choice: n’ụzọ na-eduga n’ebe ndị mba ọzọ nọ
  rationale: Ọ na-edobe ihe atụ nke ụzọ dị na Grik ma na-eme ka nghọta nke ịga n’akụkụ ókèala ndị na-abụghị ndị Juu doo anya, n’agbanyeghị na nhazi okwu Grik nwere ike ịghọta n’ụzọ ọzọ.
- source_word: ἐθνῶν
  choice: ndị mba ọzọ
  rationale: N’ọnọdụ ozi ndị Juu a, okwu ahụ na-ezo aka na ndị na-abụghị ndị Juu; ‘ndị mba ọzọ’ bụ okwu Igbo a na-aghọta nke ọma.
- source_word: μὴ ἀπέλθητε
  choice: Unu agala
  rationale: Ọ na-egosipụta mmachibido iwu ahụ kpọmkwem ma n’ụzọ Igbo nkịtị.
- source_word: εἰς πόλιν Σαμαριτῶν
  choice: n’obodo ndị Sameria
  rationale: ‘Obodo’ nwere ike ikpuchi town/city n’enweghị ikwubiga nha ya ókè, ebe ‘ndị Sameria’ na-edobe genitive nke ndị bi n’obodo ahụ.
- source_word: μὴ εἰσέλθητε
  choice: unu abanyekwala
  rationale: Ọ na-egosipụta mmachibido nke abụọ n’ụzọ doro anya ma jikọta ya nke ọma na nke mbụ.
theological_decisions:
- issue: Oke na oge ntụziaka Jizọs nyere banyere ndị mba ọzọ na ndị Sameria
  choice: A sụgharịrị ya dị ka iwu siri ike e nyere ndị iri na abụọ n’oge ozi a kpọmkwem.
  alternative: Ịsụgharị ya n’ụzọ ga-egosi na ọ bụ mmachibido na-adịgide adịgide megide izigara ndị mba ọzọ na ndị Sameria ozi.
  rationale: Amaokwu ahụ n’onwe ya na-enye iwu maka iziga ndị a iri na abụọ; nsụgharị ahụ ekwesịghị itinye echiche na mmachibido a bụ nke mgbe niile, ma o kwesịghịkwa ibelata ike iwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Nye ha iwu sị’ na-egosipụta ike παραγγείλας n’enweghị okwu arọ; e debere akara nkọwa [a] na [b] n’ebe okwu ndị ha na-akọwa dị.
