revisions:
- from: Jizọs zipụrụ ndị a iri na abụọ, nye ha iwu sị, “Unu agala n’ụzọ na-eduga n’ebe ndị mba ọzọ nọ[a], unu abanyekwala n’obodo ndị Sameria[b].”
  to: Jizọs zipụrụ ndị a iri na abụọ, mgbe o nyere ha iwu, sị, “Unu agala n’ụzọ ndị mba ọzọ[a], unu abanyekwala n’obodo ndị Sameria[b].”
  rationale: The revision removes an interpretive directional expansion from the main text while retaining it as a footnoted alternative. It also repairs the Igbo syntax linking Jesus’ instruction to his sending of the twelve. No theological conclusion beyond the immediate mission instruction is added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:32:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the twelve, Jesus' sending, and the two prohibitions. However, “n’ụzọ na-eduga n’ebe ndị mba ọzọ nọ” makes a destination sense explicit that is plausible but not stated unambiguously by εἰς ὁδὸν ἐθνῶν. The main text should retain the Greek road/way expression without this added directional interpretation.
  naturalness: “Nye ha iwu sị” does not connect smoothly as written after “zipụrụ.” Recasting it as “mgbe o nyere ha iwu, sị” is natural Standard Igbo and preserves the participial relationship. “Unu agala n’ụzọ ndị mba ọzọ” is concise and idiomatic enough in context.
  terminology: “Ndị mba ọzọ” appropriately conveys ἐθνῶν in this Jewish mission context without importing a permanent theological exclusion. “Ndị Sameria” and “obodo” are suitable renderings of Σαμαριτῶν and πόλις. The footnote should describe the destination-oriented understanding as an interpretive alternative, not as the sole likely meaning.
  issues:
  - severity: medium
    issue: The phrase “n’ụzọ na-eduga n’ebe ndị mba ọzọ nọ” over-specifies the force of εἰς ὁδὸν ἐθνῶν.
    rationale: The Greek uses road/way language and may refer to a route associated with Gentiles or to setting out toward Gentile territory. Adding “na-eduga n’ebe ... nọ” resolves this ambiguity in the main text.
  - severity: medium
    issue: “Jizọs zipụrụ ndị a iri na abụọ, nye ha iwu sị” is syntactically awkward.
    rationale: The participial instruction needs a clearer verbal connection in natural Igbo. “Mgbe o nyere ha iwu, sị” preserves that Jesus instructed them in connection with sending them.
  revised_text: Jizọs zipụrụ ndị a iri na abụọ, mgbe o nyere ha iwu, sị, “Unu agala n’ụzọ ndị mba ọzọ[a], unu abanyekwala n’obodo ndị Sameria[b].”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ụzọ na-eduga n’ebe ndị mba ọzọ nọ.” Okwu Grik ahụ na-ekwu kpọmkwem banyere ụzọ; o nwere ike izo aka n’ụzọ ndị mba ọzọ ma ọ bụ n’ịga n’akụkụ ókèala ha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’obodo Sameria.”
    reason: lexical_alternative
  revision_rationale: The revision removes an interpretive directional expansion from the main text while retaining it as a footnoted alternative. It also repairs the Igbo syntax linking Jesus’ instruction to his sending of the twelve. No theological conclusion beyond the immediate mission instruction is added.
