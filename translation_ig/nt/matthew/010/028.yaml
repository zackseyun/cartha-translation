revisions:
- from: Unu atụla egwu ndị na-egbu ahụ ma ha enweghị ike igbu mkpụrụ obi. Kama, tụkwasịnụ onye ahụ nwere ike ibibi ma mkpụrụ obi ma ahụ na Gehena[a] egwu.
  to: Unu atụla egwu ndị na-egbu ahụ ma ha enweghị ike igbu mkpụrụ obi. Kama, ka unu tụọ onye nwere ike ibibi ma mkpụrụ obi ma ahụ na Gehena[a] egwu.
  rationale: The revision replaces an unclear positive imperative with an idiomatic Standard Igbo exhortation, while retaining the source’s plural address, contrastive force, unspecified referent, body/soul pairing, and the transliterated term “Gehena.” The footnote continues to supply the familiar interpretive alternative without replacing the source-specific term in the text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:33:25Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the plural prohibitions/commands, the body–soul contrast, the unnamed referent of τὸν δυνάμενον, the paired scope of “soul and body,” and “Gehenna.” The main needed adjustment is idiomatic Igbo expression of the second imperative.
  naturalness: “Tụkwasịnụ onye ahụ ... egwu” is not a natural or clear Standard Igbo way to express φοβεῖσθε here and can suggest placing fear upon someone rather than fearing that person. “Kama, ka unu tụọ onye ... egwu” is clear and preserves the contrast. Omitting “ahụ” after “onye” also better reflects the Greek’s open substantival expression.
  terminology: “Mkpụrụ obi,” “ahụ,” “ibibi,” and “Gehena” are appropriate. The footnote’s conventional alternative “ala mmụọ” may be retained as an alternative, while the text properly keeps “Gehena.”
  issues:
  - severity: medium
    issue: The phrase “tụkwasịnụ onye ahụ ... egwu” is semantically and idiomatically unsuitable in this context.
    rationale: It does not naturally convey “fear the one who is able” in Standard Igbo and risks a different sense. A construction with “ka unu tụọ ... egwu” gives the required exhortation clearly.
  - severity: low
    issue: “Onye ahụ” is more demonstrative than necessary.
    rationale: The Greek substantival participle does not contain a demonstrative. “Onye” retains the unspecified referent more directly.
  revised_text: Unu atụla egwu ndị na-egbu ahụ ma ha enweghị ike igbu mkpụrụ obi. Kama, ka unu tụọ onye nwere ike ibibi ma mkpụrụ obi ma ahụ na Gehena[a] egwu.
  revised_footnotes:
