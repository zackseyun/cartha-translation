id: MAT.10.28
reference: Matthew 10:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: ig
  text: Unu atụla egwu ndị na-egbu ahụ ma ha enweghị ike igbu mkpụrụ obi. Kama, ka unu tụọ onye nwere ike ibibi ma mkpụrụ obi ma ahụ na Gehena[a] egwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “n’ala mmụọ.” Okwu Grik bụ “Gehena,” aha sitere na Ndagwurugwu Hinom, nke e ji akọwa ebe ikpe ikpeazụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: tụla egwu / tụkwasịnụ ... egwu
  rationale: E jigidere otu echiche bụ ‘ịtụ egwu’ n'akụkụ abụọ nke ntụnyere ahụ. Nhazi okwu dị iche ntakịrị iji mee ka Igbo bụrụ nke e kere eke ma doo anya.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: ndị na-egbu
  rationale: Nke a na-egosi ìgwè ndị a na-ekwu maka ha n'ozuzu, dịka participle nwere article si arụ ọrụ n'asụsụ Grik.
- source_word: σῶμα
  choice: ahụ
  rationale: Ọ bụ okwu Igbo kwụ ọtọ ma bụrụkwa nke a na-ejikarị akọwa ahụ mmadụ.
- source_word: ψυχήν
  choice: mkpụrụ obi
  rationale: N'ihi na e tinyere ya n'akụkụ ‘ahụ’ dịka ihe dị iche, ‘mkpụrụ obi’ na-echekwa ọdịiche ahụ nke ọma karịa ‘ndụ.’
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: ha enweghị ike igbu
  rationale: Nke a na-echekwa nkwusi ike Grik na enweghị ikike ma ọ bụ ike ime ya.
- source_word: μᾶλλον
  choice: kama
  rationale: '‘Kama’ na-egosi ntụgharị na mmezi doro anya: ọ bụghị ịtụ ndị ahụ egwu, kama ịtụ onye ọzọ egwu.'
- source_word: τὸν δυνάμενον
  choice: onye ahụ nwere ike
  rationale: Ọ na-echekwa ntụaka ahụ n'ekwughị kpọmkwem onye ọ bụ, dịka Grik na-akpọghị aha onye ahụ.
- source_word: ἀπολέσαι
  choice: ibibi
  rationale: ‘Ibibi’ na-enye ịdị arọ nke ikpe na mbibi ikpeazụ n'ebughị ụzọ kọwaa kpọmkwem ọdịdị metaphysical nke mbibi ahụ.
- source_word: ἐν γεέννῃ
  choice: na Gehena
  rationale: A translitere aha Grik ahụ iji chekwaa echiche na ndabere akụkọ ya, kama iji okwu nwere nkọwa ọdịnala ndị ọzọ dochie ya ozugbo.
theological_decisions:
- issue: Onye ‘nwere ike ibibi ma mkpụrụ obi ma ahụ na Gehena’ bụ
  choice: E dere ya dịka ‘onye ahụ’ n'ebughị ụzọ kpọọ onye ọ bụ.
  alternative: Chineke; Setan
  rationale: Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-akachasị atụ aka n'ebe Chineke nọ dịka onye nwere ikike ikpe ikpeazụ, okwu Grik ahụ akpọghị ya aha. Nsụgharị a hapụrụ ntụaka ahụ dịka isi mmalite si hapụ ya.
- issue: Nsụgharị γέεννα
  choice: Gehena
  alternative: ala mmụọ
  rationale: ‘Gehena’ na-agbaso okwu isi mmalite ma na-echekwa ndabere ya n'Ndagwurugwu Hinom na echiche banyere ebe ikpe ikpeazụ; e nyere okwu a maara nke ọma dịka nkọwa n'okpuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ụdị iwu ọtụtụ mmadụ ‘unu’ mee ka ntụgharị ahụ kwekọọ na φοβεῖσθε nke bụ plural. A hapụrụ ‘onye ahụ’ n'enweghị njirimara kpọmkwem iji chekwaa nghọta sara mbara nke okwu Grik.
