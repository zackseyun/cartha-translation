id: MAT.10.41
reference: Matthew 10:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: ig
  text: Onye na-anabata onye amụma n’aha onye amụma[a] ga-anata ụgwọ ọrụ onye amụma; onye na-anabatakwa onye ezi omume n’aha onye ezi omume[b] ga-anata ụgwọ ọrụ onye ezi omume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi na ọ bụ onye amụma,” ma ọ bụ, “dị ka onye amụma.” N’asụsụ Grik, ọ bụ “n’aha onye amụma.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihi na ọ bụ onye ezi omume,” ma ọ bụ, “dị ka onye ezi omume.” N’asụsụ Grik, ọ bụ “n’aha onye ezi omume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: Onye na-anabata
  rationale: Nkebi a na-arụ ọrụ dị ka aha ma na-ekwu banyere onye ọ bụla e ji omume ịnabata mara. Oge omume dị ugbu a na-egosikwa omume n’ozuzu ya.
- source_word: προφήτην
  choice: onye amụma
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa onye na-ekwupụta ozi Chineke, ma ọ naghị etinye nkọwa ọzọ na-adịghị na Grik.
- source_word: εἰς ὄνομα προφήτου
  choice: n’aha onye amụma
  rationale: A hapụrụ usoro okwu Grik ka oyiyi okwu ahụ na nghọta okpukpe dị n’ime ya ghara ịla n’iyi; e nyere ihe ọ pụrụ ịpụta n’okpuru peeji.
- source_word: μισθὸν προφήτου
  choice: ụgwọ ọrụ onye amụma
  rationale: 'Nke a na-echekwa ihe genitive ahụ nwere ike ịpụta: ụgwọ ọrụ a na-enye onye amụma, ma ọ bụ ụgwọ ọrụ kwesịrị onye nabatara onye amụma.'
- source_word: λήμψεται
  choice: ga-anata
  rationale: Nke a na-egosipụta future ahụ n’ụzọ doro anya ma dabara nke ọma na ngwaa ‘ịnabata’ e ji malite nkebi ahịrịokwu ahụ.
- source_word: δίκαιον
  choice: onye ezi omume
  rationale: Adjective ahụ na-arụ ọrụ dị ka aha. ‘Onye ezi omume’ bụ okwu Igbo ebumpụta ụwa nke na-egosipụta onye na-eme ihe ziri ezi n’anya Chineke, na-enweghị ịmanye nwoke ma ọ bụ nwaanyị ebe usoro aha Igbo anaghị achọ ya.
- source_word: εἰς ὄνομα δικαίου
  choice: n’aha onye ezi omume
  rationale: E chekwara otu usoro ahụ dị na nkebi mbụ, ebe ihe ọ pụtara n’ụzọ nkọwa bụ ịnabata ya n’ihi njirimara ya ma ọ bụ dịka onye ezi omume.
- source_word: μισθὸν δικαίου
  choice: ụgwọ ọrụ onye ezi omume
  rationale: Nke a na-echekwa myirịta ya na ‘ụgwọ ọrụ onye amụma’ nakwa nghọta abụọ genitive ahụ nwere ike ibu.
theological_decisions:
- issue: Ihe εἰς ὄνομα tinyere genitive pụtara
  choice: E ji ‘n’aha onye amụma / onye ezi omume’ mee ihe n’ahịrị bụ isi.
  alternative: ‘n’ihi na ọ bụ onye amụma / onye ezi omume’ ma ọ bụ ‘dị ka onye amụma / onye ezi omume’
  rationale: Akpaalaokwu ahụ na-ekwu maka ịnabata mmadụ n’ihi njirimara ma ọ bụ ọnọdụ a maara na o nwere. Ide ya dịka o si dị na Grik na-echekwa nkwughachi ahụ na njikọ ya na okwu ndị ọzọ gbasara ‘aha,’ ebe nkọwa ala peeji na-eme ka uche ya doo anya.
- issue: Okwu nwoke dị na δίκαιον / δικαίου
  choice: onye ezi omume
  alternative: nwoke ezi omume
  rationale: Ọ bụ ezie na Grik ji ụdị masculine singular, ‘onye’ n’Igbo bụ aha mmadụ ebumpụta ụwa nke na-adịghị egosi nwoke ma ọ bụ nwaanyị. Ịgbakwunye ‘nwoke’ ga-eme ka ụdị asụsụ Grik ghọọ nkwupụta gbasara okike nke okwu Igbo anaghị achọ, ma nwee ike ime ka nghọta nnọchite anya ahụ sie ike karịa isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta mee ihe. E chekwara nkwughachi na myirịta nkebi abụọ ahụ. ‘Ịnabata’ dabara n’echiche nke ịnabata ma ọ bụ ile ọbịa nke ọma, ebe ‘ụgwọ ọrụ’ na-enye μισθός n’ụzọ doro anya. Akara ala peeji [a] na [b] dị n’ahịrị bụ isi n’ebe nkebi ha na-akọwa nọ.
