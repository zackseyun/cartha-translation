revisions:
- from: Onye hụrụ nna ya ma ọ bụ nne ya n’anya karịa m erughị m eru[a]; onye hụkwara nwa ya nwoke ma ọ bụ nwa ya nwaanyị n’anya karịa m erughị m eru.
  to: Onye hụrụ nna ya ma ọ bụ nne ya n’anya karịa m ekwesịghị m[a]; onye hụrụ nwa ya nwoke ma ọ bụ nwa ya nwaanyị n’anya karịa m ekwesịghị m.
  rationale: The revision replaces an opaque predicate with the natural Standard Igbo expression ekwesịghị m, while retaining the Greek’s direct first-person wording and repeated parallel structure. The note is narrowed to a lexical alternative for the comparative phrase.
