id: MAT.10.37
reference: Matthew 10:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: ig
  text: Onye hụrụ nna ya ma ọ bụ nne ya n’anya karịa m ekwesịghị m[a]; onye hụrụ nwa ya nwoke ma ọ bụ nwa ya nwaanyị n’anya karịa m ekwesịghị m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “karịa m.” Nkebiokwu Grik ὑπὲρ ἐμέ n’ebe a na-ekwu maka ịhụ onye ọzọ n’anya karịa Jizọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: Onye hụrụ … n’anya
  rationale: Nkebiokwu a na-egosi onye a na-amata site n’ịhụ mmadụ n’anya; nsụgharị a bụ Igbo nkịtị ma na-edobe echiche onye ọ bụla dabara n’ọnọdụ ahụ.
- source_word: πατέρα ἢ μητέρα
  choice: nna ya ma ọ bụ nne ya
  rationale: Ọ bụ ezie na Grik etinyeghị nnọchiaha nke onye nwe ihe, ‘ya’ dị mkpa n’Igbo eke iji mee ka mmekọrịta ezinụlọ doo anya n’enweghị ịgbanwe isi okwu ahụ.
- source_word: ὑπὲρ ἐμέ
  choice: karịa m
  rationale: N’ebe a ὑπέρ na-egosi ịhụ onye ọzọ n’anya karịa Jizọs, ya bụ, ibute onye ahụ ụzọ karịa ya.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: erughị m eru
  rationale: Akpaalaokwu Igbo a na-edobe okwu ikpe banyere ịbụ onye kwesịrị Jizọs, n’etinyeghị nkọwa ọzọ dịka ‘iso ụzọ’ ma ọ bụ ‘ịbụ nke m’ nke na-adịghị kpọmkwem n’ihe odide Grik.
- source_word: καὶ
  choice: onye hụkwara
  rationale: Mgbakwunye ‘-kwa’ jikọtara ahịrịokwu abụọ ahụ n’ụzọ Igbo sitere n’okike ma chekwaa nhazi yiri ibe ya.
- source_word: υἱὸν ἢ θυγατέρα
  choice: nwa ya nwoke ma ọ bụ nwa ya nwaanyị
  rationale: Nke a bụ ụzọ doro anya, nke oge a, e si ekwu ‘son or daughter’ n’Igbo ma na-egosi mmekọrịta ahụ n’enweghị mgbagwoju anya.
theological_decisions:
- issue: Ihe okwu Jizọs chọrọ pụtara n’ihe gbasara ịhụ ndị ezinụlọ n’anya
  choice: E debere ihe a chọrọ dịka ibute Jizọs ụzọ karịa ọbụna ndị ezinụlọ kacha nso.
  alternative: Ịsụ ya n’ụzọ dị nro dịka ‘onye na-ahụghị m n’anya otu o kwesịrị,’ ma ọ bụ ịgbakwunye na onye ahụ ga-akpọ ndị ezinụlọ ya asị.
  rationale: Grik na-atụnyere ịhụnanya ma na-ekwu na nke e nyere Jizọs aghaghị ịdị elu. Nsụgharị ahụ anaghị eme ka okwu ahụ dị nro, ọ naghịkwa ebubata echiche ịkpọ ezinụlọ asị.
- issue: Ihe οὐκ ἔστιν μου ἄξιος na-ezo aka na ya
  choice: erughị m eru
  alternative: ekwesịghị ịbụ onye na-eso ụzọ m
  rationale: Nhọrọ a chekwara okwu Grik banyere ‘ịru eru’ n’etinyeghị ‘onye na-eso ụzọ,’ nke bụ nkọwa ezi uche dị na ya mana adịghị n’ahịrịokwu ahụ kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Erughị m eru’ na-echekwa ike na mkpụmkpụ nke okwu ikpe Grik, ebe ‘nwa ya nwoke/nwa ya nwaanyị’ na-ezere ụdị okwu ochie.
