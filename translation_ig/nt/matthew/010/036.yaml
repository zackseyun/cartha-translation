  text: καὶ ἐχθροὶ τοῦ ἀνθρώπου οἱ οἰκιακοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/036.yaml
  text: And a man's enemies will be those of his own household[a].
translation:
  language: ig
  text: Ndị iro mmadụ ga-abụkwa ndị nke ụlọ ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ndị ezinụlọ ya.” Okwu Grik ahụ na-ekwu maka ndị so n’ụlọ mmadụ, ọ bụghị ụlọ ahụ dịka ihe owuwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” jikọtara okwu a na ihe bu ya ụzọ ma chekwaa ọrụ njikọ dị mfe nke καὶ n’ụzọ Igbo nkịtị.
- source_word: ἐχθροὶ
  choice: ndị iro
  rationale: “Ndị iro” bụ okwu Igbo doro anya maka ndị na-emegide mmadụ ma ọ bụ ndị na-ebuso ya iro.
- source_word: τοῦ ἀνθρώπου
  choice: mmadụ
  rationale: N’ebe a, ἄνθρωπος bụ otu onye e ji anọchi anya mmadụ n’ozuzu. “Mmadụ” na Igbo na-echekwa otu onye ahụ ma ọ naghị akpọpụta nwoke ma ọ bụ nwanyị n’ihi na okwu Igbo ahụ enweghị akara okike.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: ndị ezinụlọ ya
  rationale: οἰκιακοί na-ezo aka n’ebe ndị nọ n’ezinụlọ ma ọ bụ n’ụlọ onye ahụ nọ, ọ bụghị ụlọ ahụ dịka ihe owuwu. “Ndị ezinụlọ ya” bụ ntụgharị eke, doro anya nye ndị Igbo taa.
theological_decisions:
- issue: Asụsụ nnọchianya n’okwu ἀνθρώπου
  choice: mmadụ
  alternative: nwoke
  rationale: Ọ bụ ezie na ἀνθρώπου bụ otu aha nwere ụdị ụtọasụsụ nwoke na Grik, ọ na-anọchite anya mmadụ n’ozuzu n’ilu a. Igbo “mmadụ” bụ okwu otu onye na-enweghị akara okike, ya mere ọ na-echekwa ntụaka sara mbara nke isi mmalite n’enweghị itinye nkọwa ụka.
- issue: Ókè okwu οἰκιακοί pụtara
  choice: ndị ezinụlọ ya
  alternative: ndị ụlọ ya
  rationale: “Ndị ezinụlọ ya” na-akọwa ndị nke ụlọ onye ahụ n’ụzọ ndị na-agụ Igbo ga-aghọta ngwa ngwa. “Ndị ụlọ ya” nwere ike ịgụnye ndị niile bi n’ụlọ ahụ n’ụzọ sara mbara karị, nke bụkwa ihe okwu Grik nwere ike ịpụta.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mkpirikpi ma dị ùgwù. Nhazi ahịrịokwu ahụ na-etinye “ndị iro mmadụ” n’ihu iji chekwaa nkwusi ike nke okwu Grik.
