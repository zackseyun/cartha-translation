  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: ig
  text: Ma mgbe ha nyefere unu, unu echegbula onwe unu banyere otú ma ọ bụ ihe unu ga-ekwu; n’ihi na a ga-enye unu n’oge ahụ ihe unu ga-ekwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụdị ngwaa bụ “a ga-enye” akpọghị onye na-enye ya aha n’amaokwu a; amaokwu na-esote na-ekwu na ọ bụ Mmụọ Nna unu na-ekwu okwu n’ime unu.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ma mgbe
  rationale: “Mgbe” na-egosi ihe ga-eme n’ọdịnihu n’enweghị ịkọ kpọmkwem mgbe ọ ga-eme; “Ma” na-egosi ntụgharị dị nro site n’ịdọ aka ná ntị gara aga.
- source_word: παραδῶσιν ὑμᾶς
  choice: ha nyefere unu n’aka ndị ọchịchị
  rationale: “Nyefee ... n’aka” bụ ụzọ Igbo si akọwa inyefe mmadụ n’aka ndị nwere ike ikpe ya. “Ndị ọchịchị” sitere n’okirikiri okwu ahụ iji mee ka ọnọdụ ikpe ahụ doo anya, na-enweghị ịtụgharị okwu ahụ ka ọ bụrụ ‘rara unu nye.’
- source_word: μὴ μεριμνήσητε
  choice: unu echegbula onwe unu
  rationale: Nke a na-ekwupụta iwu ka ha ghara inwe nchegbu banyere ihe ha ga-ekwu mgbe a na-ekpe ha ikpe.
- source_word: πῶς ἢ τί λαλήσητε
  choice: banyere otú ma ọ bụ ihe unu ga-ekwu
  rationale: E debere ọdịiche dị n’etiti ụzọ ha ga-esi kwuo okwu na ihe ha ga-ekwu, tinyere njikọ “ma ọ bụ” nke kwekọrọ na ἤ.
- source_word: δοθήσεται γὰρ ὑμῖν
  choice: n’ihi na a ga-enye unu
  rationale: E debere ụdị ngwaa nnara nke Grik, nke na-akpọghị onye na-enye ya aha.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: n’oge awa ahụ
  rationale: Nsụgharị a na-edebe onyonyo nke ‘awa ahụ’ ma na-ada nke ọma n’Igbo.
- source_word: τί λαλήσητε
  choice: ihe unu ga-ekwu
  rationale: “Ihe unu ga-ekwu” bụ okwu Igbo nkịtị ma doo anya, ma na-ekwughachi isi okwu λαλέω dị na nkebi mbụ.
theological_decisions:
- issue: Onye na-enye ihe a ga-ekwu adịghị kpọmkwem na δοθήσεται
  choice: E debere “a ga-enye unu” n’ụdị nnara, n’akpọghị Chineke ma ọ bụ Mmụọ Nsọ aha.
  alternative: “Chineke ga-enye unu” ma ọ bụ “Mmụọ Nsọ ga-enye unu.”
  rationale: Amaokwu Grik a akpọghị onye na-enye ya aha; amaokwu na-esote kọwara ọrụ Mmụọ Nna ha. Ya mere, a naghị ebubata nkọwa ahụ n’amaokwu a.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji “unu” mee ka ọtụtụ mmadụ a na-agwa pụta ìhè. A zere okwu ụka pụrụ iche na nkọwa na-akpọ onye na-enye ihe a ga-ekwu aha tupu amaokwu na-esote emee ya.
