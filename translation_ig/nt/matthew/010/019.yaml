  to: Ma mgbe ha nyefere unu, unu echegbula onwe unu banyere otú ma ọ bụ ihe unu ga-ekwu; n’ihi na a ga-enye unu n’oge ahụ ihe unu ga-ekwu.[a]
  rationale: E wepụrụ nkọwa “ndị ọchịchị” iji debe ihe Grik kwuru kpọmkwem, ma dochie “n’oge awa ahụ” anya na “n’oge ahụ” maka Igbo eke. A hapụrụ iwu megide nchegbu, ọdịiche “otú ma ọ bụ ihe,” na ụdị nnara “a ga-enye” ka ha nọgide na-egosipụta ederede isi na enweghị aha onye na-enye ya.
