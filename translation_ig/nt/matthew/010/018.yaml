  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: ig
  text: A ga-edugakwa unu n’ihu ndị gọvanọ na ndị eze n’ihi m, ka ọ bụrụ ihe akaebe nye ha[b] na nye ndị mba ọzọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mba dị iche iche.”
    reason: lexical_alternative
  - marker: b
    text: N’ọnọdụ a, a pụkwara ịghọta “nye ha” dị ka “megide ha,” ọ bụ ezie na dative Grik ahụ ekwughị nke a hoo haa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: n’ihu ndị ọchịchị na ndị eze
  rationale: Mgbe ἐπί na-esochi ngwaa nke ịkpọta ma ọ bụ iduga mmadụ, ọ na-egosi ịpụta n’ihu ndị nwere ikike. “Ndị ọchịchị” na “ndị eze” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ikpe a.
- source_word: ἀχθήσεσθε
  choice: A ga-akpọtakwa unu
  rationale: Ọ bụ ọdịnihu n’ụdị nnara nke ἄγω. “A ga-akpọta unu” bụ Igbo ebumpụta ụwa nke na-egosi na ndị ọzọ ga-eme ka ha pụta n’ihu ndị ọchịchị, n’etinyeghị echiche ike ma ọ bụ ịdọkpụ nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: ἕνεκεν ἐμοῦ
  choice: n’ihi m
  rationale: ἕνεκεν tinyere genitive na-egosi ihe kpatara ya. “N’ihi m” dị nkenke, bụrụkwa okwu Igbo a na-aghọta ngwa ngwa, ma debe ntụaka Jizọs nyere onwe ya.
- source_word: εἰς μαρτύριον
  choice: ka ọ bụrụ ihe akaebe
  rationale: Nkebiokwu ahụ nwere ike igosi nzube ma ọ bụ ihe ga-esi na ya pụta. “Ka ọ bụrụ ihe akaebe” na-edebe aha ahụ ma na-ada nke ọma n’Igbo.
- source_word: αὐτοῖς
  choice: nye ha
  rationale: Dative pronoun a na-alaghachi n’ebe ndị ọchịchị na ndị eze nọ. “Nye ha” na-edebe ya n’ụzọ na-anọpụ iche, ebe ihe akaebe ahụ nwere ike ịbụ nke a na-enye ha ma ọ bụ, dabere n’ọnọdụ, nke na-agba akaebe megide ha.
- source_word: τοῖς ἔθνεσιν
  choice: ndị mba ọzọ
  rationale: N’akwụkwọ Matiu, ἔθνη na-ezokarị aka ná ndị na-abụghị ndị Izrel. “Ndị mba ọzọ” na-egosipụta nke a n’Igbo nkịtị; “mba dị iche iche” ka bụkwa ntụgharị okwu kwere omume.
theological_decisions:
- issue: Ike okwu μαρτύριον αὐτοῖς
  choice: ihe akaebe nye ha
  alternative: ihe akaebe megide ha
  rationale: 'Dative αὐτοῖς n’onwe ya ekwughị hoo haa na ihe akaebe ahụ bụ ikpe megide ha. Ntugharị na-anọpụ iche na-edebe esemokwu dị n’ihe odide ahụ: ihe akaebe ahụ nwere ike ịbụ ozi e nyere ha ma ọ bụ bụrụ ihe megide ha ma ọ bụrụ na ha ajụ ya.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ikpe nke amaokwu ahụ, ma zere okwu ga-eme ka ike e ji kpọta ndị na-eso ụzọ ma ọ bụ ụdị ihe akaebe ahụ doo anya karịa ka Grik si kwuo.
