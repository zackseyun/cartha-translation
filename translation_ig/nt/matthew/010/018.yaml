revisions:
- from: A ga-akpọtakwa unu n’ihu ndị ọchịchị na ndị eze n’ihi m, ka ọ bụrụ ihe akaebe nye ha[b] na nye ndị mba ọzọ.[a]
  to: A ga-edugakwa unu n’ihu ndị gọvanọ na ndị eze n’ihi m, ka ọ bụrụ ihe akaebe nye ha[b] na nye ndị mba ọzọ.[a]
  rationale: The revision replaces 'called/summoned' with 'led' to reflect the future passive of ἄγω, and replaces the general term for authorities with the specific term 'governors.' It retains the neutral dative rendering and the lexical alternative for ἔθνη, preserving the source text's ambiguity.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:33:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the future passive, the judicial setting before rulers and kings, the cause ('because of me'), and the neutral force of the testimony 'to them and to the Gentiles.' However, 'A ga-akpọtakwa unu' means that they will be summoned/called out, whereas ἀχθήσεσθε is specifically 'you will be led/brought.' Also, 'ndị ọchịchị' is broader than ἡγεμόνας ('governors').
  naturalness: The sentence is generally clear Standard Igbo. 'A ga-edugakwa unu n’ihu...' is a natural and more accurate expression for being brought before authorities. 'Ndị gọvanọ' is a current, readily understood term and supplies the narrower office intended by the Greek.
  terminology: Use 'ndị gọvanọ' for ἡγεμόνες and retain 'ndị eze' for βασιλεῖς. 'Ihe akaebe' appropriately renders μαρτύριον, while 'nye ha' correctly avoids deciding whether the testimony is favorable or adverse. 'Ndị mba ọzọ' is suitable here for τοῖς ἔθνεσιν; the alternative 'mba dị iche iche' should remain footnoted.
  issues:
  - severity: medium
    issue: The verb 'A ga-akpọtakwa unu' does not fully represent ἀχθήσεσθε.
    rationale: Ἄγω in the future passive denotes being led or brought. Being 'called/summoned' can occur before a hearing but does not express the movement or custody implied by the Greek verb.
  - severity: low
    issue: '''Ndị ọchịchị'' is less specific than the Greek term ἡγεμόνες.'
    rationale: The Greek identifies governors, not authorities generally. 'Ndị gọvanọ' preserves the office without harming readability.
  revised_text: A ga-edugakwa unu n’ihu ndị gọvanọ na ndị eze n’ihi m, ka ọ bụrụ ihe akaebe nye ha[b] na nye ndị mba ọzọ.[a]
  revised_footnotes:
