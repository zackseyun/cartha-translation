    text: Ma ọ bụ, “mba dị iche iche.”
    reason: lexical_alternative
  - marker: b
    text: N’ọnọdụ a, a pụkwara ịghọta “nye ha” dị ka “megide ha,” ọ bụ ezie na dative Grik ahụ ekwughị nke a hoo haa.
    reason: alternative_reading
  revision_rationale: The revision replaces 'called/summoned' with 'led' to reflect the future passive of ἄγω, and replaces the general term for authorities with the specific term 'governors.' It retains the neutral dative rendering and the lexical alternative for ἔθνη, preserving the source text's ambiguity.
