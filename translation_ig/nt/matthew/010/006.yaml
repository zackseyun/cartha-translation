revisions:
- from: Kama nke ahụ, gaanụ n'ebe atụrụ furu efu nke ụlọ Izrel nọ[a].
  to: Kama, gakwuurunụ atụrụ ndị furu efu nke ụlọ Izrel.
  rationale: The revision directly renders the command to go to the sheep, retains the contrast with the preceding instruction through «Kama», and preserves the explicit metaphor and covenantal expression «ụlọ Izrel». The unnecessary and potentially misleading alternative footnote is omitted.
