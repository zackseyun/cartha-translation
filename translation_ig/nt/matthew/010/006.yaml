id: MAT.10.6
reference: Matthew 10:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πορεύεσθε δὲ μᾶλλον πρὸς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/006.yaml
  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: ig
  text: Kama, gakwuurunụ atụrụ ndị furu efu nke ụlọ Izrel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορεύεσθε
  choice: gaanụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ; “gaanụ” bụ ụzọ Igbo nkịtị na nke doro anya isi nye iwu a.
- source_word: δὲ μᾶλλον
  choice: Kama nke ahụ
  rationale: Ngwakọta okwu a na-egosi ntụgharị site n'ebe a machibidoro ha ịga n'amaokwu bu ụzọ gaa n'ebe e nyere ha iwu ịga.
- source_word: πρὸς
  choice: n'ebe ... nọ
  rationale: N'okwu Igbo, usoro a na-egosi ebe ndị a na-aga n'ụzọ dị ndụ ma doo anya.
- source_word: τὰ πρόβατα
  choice: atụrụ
  rationale: E debere ihe atụ atụrụ ahụ kama ịkọwa ya dịka naanị ndị mmadụ, ka njikọ ya na ihe oyiyi Akwụkwọ Nsọ ghara ifu.
- source_word: τὰ ἀπολωλότα
  choice: furu efu
  rationale: N'ime ihe atụ onye ọzụzụ atụrụ, okwu a na-egosi atụrụ ndị kpafuru ma ọ bụ ndị a na-apụghị ịhụ; “furu efu” bụ okwu Igbo kwesịrị ekwesị.
- source_word: οἴκου Ἰσραήλ
  choice: nke ụlọ Izrel
  rationale: Nke a na-edobe usoro na ụda Akwụkwọ Nsọ nke “ụlọ Izrel,” nke na-anọchi anya ndị Izrel dịka otu obodo.
theological_decisions:
- issue: Ihe atụ e ji kọwaa Izrel
  choice: E debere “atụrụ furu efu nke ụlọ Izrel” dịka ihe atụ.
  alternative: ndị Izrel kpafuru akpafu
  rationale: Asụsụ Grik kwuru kpọmkwem banyere atụrụ; idebe ihe atụ ahụ na-echekwa njikọ amụma na ihe oyiyi Akwụkwọ Nsọ n'enweghị itinye nkọwa ọzọ.
- issue: Mmekọrịta genitive n'okwu “τὰ ἀπολωλότα οἴκου Ἰσραήλ”
  choice: Isi ederede na-agụ ya dịka atụrụ furu efu ndị bụ nke ụlọ Izrel.
  alternative: atụrụ ndị furu efu site n'ụlọ Izrel
  rationale: Usoro Grik nwere ike ikwe ka a ghọta njikọ ahụ n'ụzọ abụọ. Isi ederede na-ewere nghọta kachasị mfe, ebe nkọwa ala peeji na-edobe ụzọ ọzọ n'enweghị idozi mgbagwoju anya ahụ n'ike.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ọtụtụ mmadụ n'iwu “gaanụ,” ma debe ihe atụ Akwụkwọ Nsọ na aha “ụlọ Izrel.”
