review_pass:
  verdict: revise
  source_fidelity: The draft preserves the imperative, the redirection expressed by δὲ μᾶλλον, and the metaphor of the lost sheep belonging to the house of Israel. However, «n'ebe ... nọ» recasts the destination as a location where the sheep are, whereas πρὸς directly governs the sheep as the intended recipients/destination. «Gakwurunụ» renders this more directly and naturally.
  naturalness: «Gaanụ n'ebe atụrụ furu efu nke ụlọ Izrel nọ» is understandable but stylistically cumbersome in Standard Igbo. «Gakwurunụ atụrụ ndị furu efu nke ụlọ Izrel» is idiomatic and maintains the biblical register.
  terminology: «atụrụ», «furu efu», «ụlọ Izrel», and the plural imperative are appropriate. The supplied footnote’s «site n'ụlọ Izrel» can imply that the sheep were lost away from/out of the house, an implication not required by the Greek genitive; it should be removed rather than preserve a misleading alternative.
  issues:
  - severity: medium
    issue: The destination phrase uses «n'ebe ... nọ».
    rationale: This makes the command mean ‘go to the place where the sheep are’ rather than directly ‘go to the sheep.’ A verb formed with kpọkọta/kwuru—«gakwurunụ»—more closely represents πορεύεσθε πρὸς while sounding natural in Standard Igbo.
  - severity: low
    issue: The footnote introduces «site n'ụlọ Izrel».
    rationale: The Greek οἴκου Ἰσραήλ is most naturally a possessive/corporate genitive modifying ‘sheep’; ‘from the house of Israel’ may suggest separation from it. The source does not require that additional nuance.
  revised_text: Kama, gakwuurunụ atụrụ ndị furu efu nke ụlọ Izrel.
  revised_footnotes: []
  revision_rationale: The revision directly renders the command to go to the sheep, retains the contrast with the preceding instruction through «Kama», and preserves the explicit metaphor and covenantal expression «ụlọ Izrel». The unnecessary and potentially misleading alternative footnote is omitted.
