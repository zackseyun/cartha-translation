  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ⸀ἐλθόντων πρὸς τὸν ὄχλον προσῆλθεν αὐτῷ ἄνθρωπος γονυπετῶν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/014.yaml
  text: And when they came to the crowd[a], a man came up to him, kneeling before him[b],
translation:
  language: ig
  text: Mgbe ha rutere n’ebe ìgwè mmadụ ahụ nọ, otu nwoke bịakwutere ya[a], na-egbu ikpere n’ala n’ihu ya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “bịarutere ya nso.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “dara n’ikpere n’ala n’ihu ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Mgbe
  rationale: N’Igbo, njikọ Καὶ na nkebi oge nke ἐλθόντων na-aga nke ọma dịka mmalite ahịrịokwu ‘Mgbe’; nke a na-ejikọta akụkọ ahụ n’enweghị itinye nkọwa ọhụrụ.
- source_word: ἐλθόντων
  choice: ha rutere
  rationale: 'Aorist participle a na genitive plural, ya na isiokwu plural a ghọtara site n’akụkọ gbara ya gburugburu, na-egosi oge: ‘mgbe ha rutere.’'
- source_word: πρὸς τὸν ὄχλον
  choice: n’ebe ìgwè mmadụ ahụ nọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa eke isi kwuo na ha bịarutere n’ebe ìgwè mmadụ ahụ nọ.
- source_word: προσῆλθεν αὐτῷ
  choice: bịakwutere ya
  rationale: ‘Bịakwutere ya’ na-egosipụta ịbịaru onye ahụ nso kpọmkwem dịka προσέρχομαι na dative αὐτῷ si dị.
- source_word: ἄνθρωπος
  choice: otu nwoke
  rationale: N’ebe a, aha singular masculine a na-ezo aka n’otu nwoke kpọmkwem; ‘otu nwoke’ bụ Igbo doro anya ma dịkwa eke.
- source_word: γονυπετῶν αὐτόν
  choice: gbuo ikpere n’ala n’ihu ya
  rationale: Nkebi a na-akọwa ihe nwoke ahụ mere n’ihu Jizọs; ‘gbuo ikpere n’ala n’ihu ya’ na-egosipụta ọnọdụ ahụ na nsọpụrụ dị na ya n’enweghị ịkọwapụta ihe karịrị isi mmalite.
theological_decisions:
- issue: Ntụgharị ἄνθρωπος dịka onye nwoke kpọmkwem n’akụkọ a
  choice: otu nwoke
  alternative: otu onye
  rationale: Ụdị okwu Grik ahụ bụ masculine singular, ọnọdụ akụkọ ahụ na-ezokwa aka n’otu nwoke kpọmkwem. Ya mere, ‘otu nwoke’ na-edobe nkọwa isi mmalite n’enweghị ịgbasa ya ka ọ bụrụ mmadụ n’ozuzu.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ìgwè mmadụ’ bụ okwu nkịtị maka ὄχλος, ebe ‘gbuo ikpere n’ala n’ihu ya’ na-egosipụta omume ahụ n'ụzọ eke n’Igbo.
