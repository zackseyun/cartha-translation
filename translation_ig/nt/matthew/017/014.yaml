  naturalness: The wording is generally clear Standard Igbo. Using “na-egbu ikpere n’ala” naturally marks the continuing/concurrent action conveyed by the Greek present participle.
  terminology: “Ìgwè mmadụ,” “otu nwoke,” and “bịakwutere ya” are suitable and source-sensitive. The retained alternative in note b appropriately reflects the more explicit image of falling to one’s knees.
