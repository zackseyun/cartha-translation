id: MAT.17.10
reference: Matthew 17:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: ig
  text: Ndị na-eso ụzọ ahụ jụrụ ya, sị, “Gịnị mere, mgbe ahụ, ndị odeakwụkwọ ji sị na Ịlaịja aghaghị ibu ụzọ bịa?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: jụrụ
  rationale: Ngwaa aorist a na-ewebata ajụjụ kpọmkwem; “jụrụ” bụ okwu Igbo dị mfe ma zie ezi.
- source_word: μαθηταὶ
  choice: ndị na-eso ụzọ ya
  rationale: Ọ bụ otu ndị a maralarị n'okwu gbara ya gburugburu. Ọ bụ ezie na “ya” adịghị n'okwu Grik a, ọ na-eme ka okwu Igbo doo anya n'ụzọ ebumpụta ụwa n'enweghị ịgbanwe onye a na-ekwu maka ya.
- source_word: λέγοντες
  choice: sị
  rationale: “Sị” na-ewebata ihe ha kwuru ma na-anọchi participle Grik ahụ n'Igbo ebumpụta ụwa.
- source_word: Τί οὖν
  choice: Gịnị mere ... ji
  rationale: N'agbanyeghị na τί pụtara “gịnị” n'ụdị ya, n'usoro okwu a ọ na-ajụ ihe kpatara nkwupụta ndị odeakwụkwọ; usoro “Gịnị mere ... ji” na-enye nghọta ahụ nke ọma.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nke a bụ nsụgharị kpọmkwem nke ndị maara ide na ịkọwa Iwu n'ọnọdụ Oziọma; ọ naghị etinye nkọwa sara mbara n'ime amaokwu ahụ.
- source_word: λέγουσιν ὅτι
  choice: ji ekwu na
  rationale: Ọ na-edebe okwu ugbu a na nkebiokwu nke “na” na-ewebata.
- source_word: Ἠλίαν
  choice: Ịlaịja
  rationale: A sụgharịrị aha ahụ dịka ọdịnala mkpọpụta na odide Igbo si dị.
- source_word: δεῖ ἐλθεῖν
  choice: aghaghị ... bịa
  rationale: “Aghaghị” na-edebe ike nke mkpa ma ọ bụ iwu dị na δεῖ.
- source_word: πρῶτον
  choice: ibu ụzọ
  rationale: “Ibu ụzọ bịa” bụ usoro Igbo ebumpụta ụwa nke na-egosi na ọ ga-abịa tupu ihe ọzọ emee.
theological_decisions:
- issue: Ihe ajụjụ ndị na-eso ụzọ ahụ gbasara ọbịbịa Ịlaịja pụtara
  choice: E debere ya dịka ajụjụ maka ihe mere ndị odeakwụkwọ ji akụzi nke a, n'enweghị ikpebi ma ha kwadoro, jụrụ, ma ọ bụ chọrọ ka e mezie ozizi ahụ.
  alternative: A pụrụ ịsụgharị ya n'ụzọ na-egosi na ha na-enyo ndị odeakwụkwọ enyo, ma ọ bụ tinye nkọwa sitere na Malakaị na amaokwu a.
  rationale: Amaokwu ahụ n'onwe ya na-akọ naanị ajụjụ ha. Azịza dị n'amaokwu ndị na-esote ka a hapụrụ ịkọwa mmekọrịta ozizi ahụ na Ịlaịja, ka esemokwu nkà mmụta okpukpe dị n'okwu ahụ ghara idozi tupu oge ya.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji usoro ajụjụ “Gịnị mere ... ji” mee ka idiom Grik pụta n'ụzọ Igbo ebumpụta ụwa; enweghị akara nkọwa ala peeji achọrọ.
