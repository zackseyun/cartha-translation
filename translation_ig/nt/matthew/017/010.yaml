- from: Ndị na-eso ụzọ ya jụrụ ya sị, “Gịnị mere ndị odeakwụkwọ ji ekwu na Ịlaịja aghaghị ibu ụzọ bịa?”
  to: Ndị na-eso ụzọ ahụ jụrụ ya, sị, “Gịnị mere, mgbe ahụ, ndị odeakwụkwọ ji sị na Ịlaịja aghaghị ibu ụzọ bịa?”
  rationale: The revision removes an unsupported possessive, restores the inferential nuance of οὖν, and lightly smooths the reporting verb while preserving the question’s unresolved theological tension. No footnote is required.
