    text: A pụkwara ịsụgharị ya, “ga-abịa.” Ngwaa Grik a sụgharịrị “na-abịa” dị n’ụdị ugbu a, ma n’ebe a ọ na-ezo aka n’ọdịnihu.
    reason: lexical_alternative
  revision_rationale: The revision removes the added specification “n’ọnọdụ ha,” retaining the broad and theologically unresolved scope of “all things.” It uses the present-form “na-abịa” to reflect ἔρχεται while preserving a concise note about its future-oriented meaning, and it relocates the footnote marker to its actual referent.
