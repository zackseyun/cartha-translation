revisions:
- from: Ọ zara[a] sị, “Ịlaịja ga-abịa n’ezie, ọ ga-eweghachikwa ihe niile n’ọnọdụ ha.”
  to: Ọ zara sị, “Ịlaịja na-abịa[a] n’ezie, ọ ga-eweghachi ihe niile.”
  rationale: The revision removes the added specification “n’ọnọdụ ha,” retaining the broad and theologically unresolved scope of “all things.” It uses the present-form “na-abịa” to reflect ἔρχεται while preserving a concise note about its future-oriented meaning, and it relocates the footnote marker to its actual referent.
  reviewer_model: gpt-5.6-terra
