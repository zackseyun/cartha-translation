  text: ὁ ⸀δὲ ἀποκριθεὶς ⸀εἶπεν· Ἠλίας μὲν ⸀ἔρχεται καὶ ἀποκαταστήσει πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/011.yaml
  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: ig
  text: Ọ zara sị, “Ịlaịja na-abịa[a] n’ezie, ọ ga-eweghachi ihe niile.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ga-abịa.” Ngwaa Grik a sụgharịrị “na-abịa” dị n’ụdị ugbu a, ma n’ebe a ọ na-ezo aka n’ọdịnihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ọ zara sị
  rationale: Nke a na-egosi na okwu ahụ bụ nzaghachi, ma na-asụkwa Igbo n'ụzọ ebumpụta ụwa; ‘sị’ na-ewebata okwu e kwuru kpọmkwem.
- source_word: Ἠλίας
  choice: Ịlaịja
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị a na-ejikarị ede aha Elijah n’Igbo.
- source_word: μέν
  choice: n’ezie
  rationale: Ọ na-egosi nkwenye siri ike ma na-akwadebe ọdịiche nke na-esote n’amaokwu na-abịa, n’enweghị ime ka ahịrịokwu ahụ sie ike nghọta.
- source_word: ἔρχεται
  choice: ga-abịa
  rationale: Ọ bụ ezie na ngwaa Grik dị n’ụdị ugbu a, ihe ọ pụtara n’ebe a na-ele anya n’ọdịnihu; ‘ga-abịa’ na-eme ka nke ahụ doo anya n’Igbo.
- source_word: ἀποκαταστήσει
  choice: ọ ga-eweghachikwa ... n’ọnọdụ ha
  rationale: Nke a na-egosi ime ka ihe laghachi n’ọnọdụ kwesịrị ekwesị ma na-edobe omume ahụ n’ọdịnihu, n’etinyeghị nkọwa pụrụ iche banyere ụdị mweghachi ahụ.
- source_word: πάντα
  choice: ihe niile
  rationale: Ọ na-edobe obosara na mkpokọta nke okwu Grik ahụ n’akọwaghị kpọmkwem ihe ndị a na-ekwu maka ha.
theological_decisions:
- issue: Ụdị na oke ọrụ mweghachi Ịlaịja
  choice: “ọ ga-eweghachikwa ihe niile n’ọnọdụ ha”
  alternative: “ọ ga-edozi ihe niile” ma ọ bụ “ọ ga-eme ka ihe niile laghachi n’ọnọdụ kwesịrị ekwesị”
  rationale: Amaokwu Grik ahụ kwuru okwu a n’obosara, ma ọ kọwaghị kpọmkwem ụdị ma ọ bụ oke mweghachi ahụ. Nsụgharị a na-edobe obosara na esemokwu nkà mmụta okpukpe ahụ n’etinyeghị nkọwa nke otu ụka ma ọ bụ otu echiche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-asụ Igbo n'ụzọ ebumpụta ụwa, ma ọ na-edobe nkwenye nke μέν, ntụaka ọdịnihu nke ἔρχεται, na obosara a na-akọwaghị nke πάντα.
