  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: ig
  text: Ewetara m ya ndị na-eso ụzọ gị, ma ha enweghị ike ịgwọ ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκα
  choice: kpọta ya bịakwute
  rationale: N’ebe a, προσφέρω pụtara ịkpọta mmadụ bịakwute ndị ọzọ. Nkebi a na-egosi ma mmegharị ahụ ma ndị a kpọtaara ya n’ụzọ Igbo si ada nke ọma.
- source_word: μαθηταῖς σου
  choice: ndị na-eso ụzọ gị
  rationale: N’Oziọma, μαθητής na-ezo aka ná ndị na-amụ ihe n’aka onye nkụzi ma na-eso ya; ‘ndị na-eso ụzọ gị’ bụ okwu doro anya ma bụrụkwa nke a na-ejikarị eme ihe n’Igbo.
- source_word: οὐκ ἠδυνήθησαν
  choice: ha enweghị ike
  rationale: δύναμαι na-egosi ikike ma ọ bụ ike ime ihe; ‘enweghị ike’ na-ebute echiche ahụ kpọmkwem ma na-ada nke ọma n’Igbo.
- source_word: θεραπεῦσαι
  choice: ịgwọ ya
  rationale: N’ọnọdụ a, θεραπεύω pụtara ime ka nwata ahụ gbakee n’ọrịa ya; ‘ịgwọ’ bụ okwu Igbo nkịtị ma doo anya.
- source_word: καὶ ... καὶ
  choice: M wee ... ma
  rationale: καί nke mbụ na-aga n’ihu n’akụkọ nna ahụ, ebe nke abụọ jikọtara ya na ihe na-emegide ihe a tụrụ anya ya. ‘M wee ... ma’ na-eme ka njikọ ahụ bụrụ Igbo ebumpụta ụwa n’etinyeghị nkọwa ọzọ n’ihe mere ha ji daa.
- source_word: αὐτόν
  choice: ya
  rationale: Aha nnọchi a na-ezo aka n’ebe nwa nwoke ahụ nọ; ‘ya’ bụ ntụgharị Igbo kpọmkwem.
theological_decisions:
- issue: Ụdị ọdịda ndị na-eso ụzọ ahụ
  choice: E kwuru naanị na ha enweghị ike ịgwọ ya.
  alternative: Ịkọwa kpọmkwem na ha enweghị ike ịchụpụ mmụọ ọjọọ, ma ọ bụ na enweghị okwukwe kpatara ya.
  rationale: Amaokwu a n’onwe ya kwuru naanị na ha enweghị ike ịgwọ nwa ahụ. E kwesịghị ibubata nkọwa sitere n’amaokwu ndị gbara ya gburugburu n’ime amaokwu a.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ndị na-eso ụzọ’ mee ihe kama okwu mbinye, ma debe nkwupụta ahụ nkenke dịka isi mmalite Grik si dị.
