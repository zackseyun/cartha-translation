id: MAT.17.22
reference: Matthew 17:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: ig
  text: Mgbe ha na-ezukọta na Galili[a], Jizọs sịrị ha, “A na-aga inyefe Nwa nke Mmadụ n’aka ndị mmadụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ha nọkọtara ọnụ na Galili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: mgbe ha na-ezukọta
  rationale: Nkebiokwu a na-egosi na ha nọ na-abịakọta ma ọ bụ na-ezukọta ọnụ. Nsụgharị a na-edobe echiche nke ịdị n’otu n’etinyeghị nkọwa banyere njem ha.
- source_word: δὲ
  choice: mgbe
  rationale: N’ebe a, δέ na genitive absolute jikọtara ọnọdụ ha na Galili na okwu Jizọs kwuru. “Mgbe” na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: na Galili
  rationale: Nke a bụ nkebiokwu na-egosi ebe ihe mere, ya mere “na Galili” bụ nsụgharị kwụ ọtọ ma bụrụkwa nke e ji eme ihe n’Igbo.
- source_word: εἶπεν αὐτοῖς
  choice: Jizọs sịrị ha
  rationale: “Sịrị ha” bụ ụzọ ebumpụta ụwa e si asụ λέγω tinyere onye a gwara okwu n’Igbo.
- source_word: Μέλλει
  choice: a na-aga
  rationale: Ụdị a na-egosi na ihe ahụ na-eru nso ime, n’enweghị itinye echiche siri ike na e kpebirila ya dịka akara aka.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-edobe aha Jizọs ji akpọ onwe ya na njikọ ya na asụsụ Akwụkwọ Nsọ, kama ịkọwa ya n’ụzọ ga-eme ka nghọta ya dị warara.
- source_word: παραδίδοσθαι
  choice: inyefe
  rationale: “Inyefe” na-edobe echiche nke ịtụnye mmadụ n’aka ndị ọzọ n’emeghị ka ọ bụrụ naanị nrara nye nke Judas ma ọ bụ naanị nnyefe n’usoro ikpe. Impersonal “a” na-edobe onye na-eme ihe ahụ n’ọnọdụ a na-akọwaghị, dịka passive Grik si eme.
- source_word: εἰς χεῖρας
  choice: n’aka
  rationale: Nke a na-edobe ihe atụ okwu Grik nke pụtara ịdaba n’ike ma ọ bụ n’okpuru nchịkwa mmadụ, ma ọ bụkwa okwu doro anya n’Igbo.
- source_word: ἀνθρώπων
  choice: ndị mmadụ
  rationale: Okwu Grik a bụ ọtụtụ nke ἄνθρωπος, ma n’ebe a ọ na-ezo aka n’ụmụ mmadụ dịka ndị ga-anata ya. “Ndị mmadụ” bụ okwu okike n’Igbo ma na-edobe ọdịiche dị n’etiti Nwa nke Mmadụ na ndị mmadụ.
theological_decisions:
- issue: Nsụgharị ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye Bụ Mmadụ
  rationale: “Nwa nke Mmadụ” na-edobe okwu Grik ahụ, aha Jizọs ji akpọ onwe ya, na ụda ya sitere n’Akwụkwọ Nsọ. Nhọrọ ọzọ ga-abụ nkọwa karịa nsụgharị ma nwee ike ibelata ihe okwu ahụ na-echetara onye na-agụ ya.
- issue: Ihe παραδίδοσθαι pụtara n’amụma ahụhụ Jizọs
  choice: inyefe
  alternative: ịrara nye
  rationale: “Inyefe” na-ahapụ ka okwu ahụ nwee ma echiche nke nrara nye ma nke itinye Jizọs n’aka ndị ọzọ. “Ịrara nye” ga-eme ka ihe ọ pụtara bụrụ naanị betrayal, karịa ka okwu Grik n’onwe ya siri kpachapụ anya kwuo.
- issue: Onye ga-enyefe Nwa nke Mmadụ
  choice: impersonal “a”
  alternative: ịkpọ Judas, ndị ọchịchị, ma ọ bụ Chineke aha
  rationale: Passive Grik ekwughị onye na-eme nnyefe ahụ. Impersonal “a” n’Igbo na-echekwa oghere ahụ ma ghara idozi mgbagwoju anya banyere ndị ọrụ mmadụ na nzube Chineke.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, mee ihe. “A na-aga inyefe” na-egosi ihe na-eru nso ime ma jiri impersonal “a” chekwaa passive na onye ọrụ a na-akọwaghị. E jighị “ndị ikom” sụgharịa ἀνθρώπων, n’ihi na “ndị mmadụ” bụ okwu Igbo ziri ezi maka ụmụ mmadụ n’ozuzu ma na-edobekwa nkwughachi dị n’etiti “Nwa nke Mmadụ” na “ndị mmadụ.”
