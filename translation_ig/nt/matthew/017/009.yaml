review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the contemporaneous descent, Jesus’ authoritative command, the prohibition, ‘the vision,’ the temporal limit, the title ‘Son of Man,’ and the passive resurrection expression. The main rendering of ἐκ νεκρῶν as ‘site n’etiti ndị nwụrụ anwụ’ is defensible but is needlessly heavy in the running text.
  naturalness: ‘Site n’etiti ndị nwụrụ anwụ’ is less idiomatic than the standard Igbo resurrection expression ‘site n’ọnwụ.’ More importantly, footnote b duplicates the draft’s main wording while presenting it as a more literal alternative, so it does not function as a genuine alternative note.
  terminology: ‘Jizọs,’ ‘ọhụụ ahụ,’ ‘Nwa nke Mmadụ,’ and the passive ‘a ga-akpọlite’ are appropriate Standard Igbo choices. The revision retains the passive voice without specifying an agent.
  issues:
  - severity: medium
    issue: Footnote b repeats the main-text wording.
    rationale: The text already reads ‘site n’etiti ndị nwụrụ anwụ,’ while footnote b labels exactly the same phrase as a more literal rendering. The main text and note must be differentiated.
  - severity: low
    issue: The main expression for resurrection is somewhat cumbersome.
    rationale: ‘Site n’ọnwụ’ is the more natural modern Igbo idiom in the running text; the fuller sense of ἐκ νεκρῶν can be retained in a footnote.
