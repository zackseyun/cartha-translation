id: MAT.17.9
reference: Matthew 17:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: ig
  text: Mgbe ha na-arịdata n’ugwu ahụ, Jizọs nyere ha iwu, sị, “Unu akọla onye ọ bụla banyere ọhụụ ahụ[a] ruo mgbe a ga-akpọlite Nwa nke Mmadụ site n’ọnwụ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe unu hụrụ.” Grik kwuru “ọhụụ ahụ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị karị, “site n’etiti ndị nwụrụ anwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: Mgbe ha na-arịdata n’ugwu ahụ
  rationale: “Mgbe ... na-” na-egosi na omume ịrịdata ahụ ka na-aga n’ihu n’otu oge ahụ; “n’ugwu ahụ” na-ejigide ugwu a kpọtụrụla aha n’akụkọ ahụ.
- source_word: ἐνετείλατο αὐτοῖς
  choice: nyere ha iwu
  rationale: Nke a na-egosipụta ike nke iwu Jizọs nyere, ọ bụghị naanị ndụmọdụ.
- source_word: λέγων
  choice: sị
  rationale: “Sị” bụ ụzọ Igbo dị mkpụmkpụ ma dịkwa n’okike isi webata okwu onye kwuru, ma na-anọchi participle Grik ahụ nke ọma.
- source_word: Μηδενὶ εἴπητε
  choice: Unu akọla onye ọ bụla banyere
  rationale: Nke a bụ iwu machibidoro ha ịgwa onye ọ bụla ihe ahụ; nhazi a bụ Igbo doro anya ma na-ejigide nkwusiri ike nke μηδενί.
- source_word: τὸ ὅραμα
  choice: ọhụụ ahụ
  rationale: “Ọhụụ” na-ejigide echiche nke ihe e gosiri mmadụ n’ụzọ pụrụ iche, kama ịkọwa ya naanị dị ka ihe anya hụrụ.
- source_word: ἕως οὗ
  choice: ruo mgbe
  rationale: Ọ na-egosi kpọmkwem oge mmachibido ahụ ga-akwụsị.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: A tụgharịrị aha Jizọs ji akpọ onwe ya n’enweghị ịkọwa ma ọ bụ ime ka ihe ọ pụtara dị warara; nke a na-echekwa njikọ Akwụkwọ Nsọ na mkpa nkà mmụta okpukpe ya.
- source_word: ἐκ νεκρῶν
  choice: site n’etiti ndị nwụrụ anwụ
  rationale: Nke a na-egosipụta echiche nke isi n’etiti ndị nwụrụ anwụ pụta, nke preposition ἐκ na plural νεκρῶν na-enye.
- source_word: ἐγερθῇ
  choice: a ga-akpọlite
  rationale: Nhazi a na-echekwa olu nnara nke ngwaa Grik ahụ ma ghara ịkpọ onye mere omume ịkpọlite ahụ aha karịa ka amaokwu ahụ si mee.
theological_decisions:
- issue: Olu e ji kwuo mbilite n’ọnwụ
  choice: a ga-akpọlite Nwa nke Mmadụ
  alternative: Nwa nke Mmadụ ga-esi n’ọnwụ bilie
  rationale: Grik ji olu nnara kwuo ya. “A ga-akpọlite” na-echekwa olu ahụ na nghọta omume Chineke nwere ike ịdị n’azụ ya, ma ọ naghị etinye onye mere ya n’amaokwu ahụ n’ụzọ doro anya karịa isi mmalite.
- issue: Nkọwa ἐκ νεκρῶν
  choice: site n’etiti ndị nwụrụ anwụ
  alternative: site n’ọnwụ
  rationale: Nhọrọ bụ isi na-echekwa ihe oyiyi nke isi n’etiti ndị nwụrụ anwụ pụta. Nhọrọ ọzọ bụ Igbo dị mfe karị, ma ọ naghị egosipụta plural νεκρῶν nke ọma otú ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke doro anya ma dị ùgwù, dee ya. E tinyere akara nkọwa ụkwụ [a] n’akụkụ “ọhụụ ahụ” na [b] n’akụkụ okwu banyere ndị nwụrụ anwụ ka akara nke ọ bụla kwekọọ n’ezie na nkọwa ya.
