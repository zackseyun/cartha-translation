revisions:
- from: A gbanwere ọdịdị ya n’ihu ha[a]; ihu ya wee na-enwu dị ka anyanwụ, uwe ya wee na-acha ọcha dị ka ìhè.
  to: A gbanwere ya n’ihu ha[a]; ihu ya wee nwupụta dị ka anyanwụ, uwe ya wee ghọọ ọcha dị ka ìhè.
  rationale: The revision preserves the passive and the visible-transformation sense of μετεμορφώθη while avoiding an added specification in the main text. It uses eventive Igbo expressions for the face’s shining and the clothes’ becoming white, preserving the aorist narrative force and the change-of-state expressed by ἐγένετο. No doctrinal interpretation is added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:21Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the sequence, the presence expression n’ihu ha, both similes, and the contrast between Jesus’ radiant face and his clothing. However, the progressive forms na-enwu and na-acha ọcha do not represent the aorist event as well as completed/eventive forms. In particular, na-acha ọcha can describe clothing that is white rather than clothing that became white.
  naturalness: The wording is generally clear Standard Igbo, but eventive verbs make this compact narrative sentence more natural and precise.
  terminology: A gbanwere ọdịdị ya is understandable, but it shifts the passive transformation of Jesus to a statement about his appearance. A gbanwere ya retains the Greek passive directly without requiring a specialized church term. The footnote supplies the appearance-focused alternative.
  issues:
  - severity: medium
    issue: Aspect of the shining and whitening verbs
    rationale: Wee na-enwu and wee na-acha ọcha are progressive/habitual in form, while ἔλαμψεν and ἐγένετο describe events. Use eventive wording, especially ghọrọ ọcha for ἐγένετο λευκά.
  - severity: low
    issue: Focus of the transformation clause
    rationale: The Greek says that he was transformed/transfigured, not explicitly that his appearance was changed. A gbanwere ya is closer; the former wording may be retained as a lexical alternative in the footnote.
  revised_text: A gbanwere ya n’ihu ha[a]; ihu ya wee nwupụta dị ka anyanwụ, uwe ya wee ghọọ ọcha dị ka ìhè.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọdịdị ya gbanwere.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the passive and the visible-transformation sense of μετεμορφώθη while avoiding an added specification in the main text. It uses eventive Igbo expressions for the face’s shining and the clothes’ becoming white, preserving the aorist narrative force and the change-of-state expressed by ἐγένετο. No doctrinal interpretation is added.
