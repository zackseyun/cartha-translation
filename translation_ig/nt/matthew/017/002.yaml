id: MAT.17.2
reference: Matthew 17:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: ig
  text: A gbanwere ya n’ihu ha[a]; ihu ya wee nwupụta dị ka anyanwụ, uwe ya wee ghọọ ọcha dị ka ìhè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọdịdị ya gbanwere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεμορφώθη
  choice: A gbanwere ọdịdị ya
  rationale: Ngwaa a dị n’ụdị nnara-eme ma na-egosi mgbanwe pụtara ìhè. Nsụgharị a na-edobe na e mere mgbanwe ahụ n’ahụ ya, ma ‘ọdịdị’ na-eme ka okwu ahụ bụrụ Igbo doro anya n’ọnọdụ a.
- source_word: ἔμπροσθεν αὐτῶν
  choice: n’ihu ha
  rationale: Nke a bụ okwu Igbo nkịtị nke na-egosi na ihe ahụ mere ebe ha nọ, ha na-ahụkwa ya.
- source_word: ἔλαμψεν
  choice: wee na-enwu
  rationale: ‘Na-enwu’ na-egosi inye ìhè ma dabara nke ọma n’ihu e ji anyanwụ tụnyere.
- source_word: πρόσωπον
  choice: ihu
  rationale: N’ebe a, okwu Grik ahụ pụtara ihu anụ ahụ Jizọs.
- source_word: ὡς ὁ ἥλιος
  choice: dị ka anyanwụ
  rationale: ‘Dị ka’ na-edobe ntụnyere ahụ n’ụzọ doro anya ma bụrụkwa Igbo eke.
- source_word: ἱμάτια
  choice: uwe
  rationale: ‘Uwe’ bụ okwu Igbo sara mbara ma dị mfe nghọta maka ihe mmadụ yi.
- source_word: ἐγένετο λευκὰ
  choice: wee na-acha ọcha
  rationale: Nke a na-egosi na uwe ahụ bịara n’ọnọdụ nke ịdị ọcha, n’etinyeghị ike ọzọ na-adịghị n’okwu Grik.
- source_word: ὡς τὸ φῶς
  choice: dị ka ìhè
  rationale: Nsụgharị a na-edobe ntụnyere kpọmkwem nke ederede Grik kama ịgbanwe ya ka ọ bụrụ naanị ‘na-egbuke egbuke.’
theological_decisions:
- issue: Otu e si akọwa mgbanwe ahụ mere Jizọs
  choice: A gbanwere ọdịdị ya
  alternative: A gbanwere ya
  rationale: Nhọrọ a na-egosi mgbanwe a hụrụ anya nke kwekọrọ n’ihu ya na uwe ya na-enwu, ma ọ naghị etinye nkọwa ozizi ọzọ n’elu ederede ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘A gbanwere ọdịdị ya’ kama okwu ụka a gbazitere, ka ihe ederede Grik pụtara doo onye Igbo nkịtị anya; e debere ụzọ nsụgharị sara mbara karị n’ala peeji.
