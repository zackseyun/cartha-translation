revisions:
- from: Mgbe ụbọchị isii gachara, Jisọs kpọọrọ Pita, Jemis na nwanne ya nwoke Jọn, duru ha rịgoro n’elu otu ugwu dị elu, ebe naanị ha nọ.[a]
  to: Mgbe ụbọchị isii gachara, Jisọs kpọọrọ Pita, Jemis, na Jọn, nwanne ya nwoke, duuru ha rigoro otu ugwu dị elu n’iche.[a]
  rationale: The revision renders κατ’ ἰδίαν adverbially as “n’iche,” preserves the narrative’s sense that Jesus led the three up a high mountain, and retains the appositional wording for John as James’s brother without supplying a named antecedent. The footnote now gives one precise lexical alternative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:22Z'
review_pass:
  verdict: revise
  source_fidelity: The temporal phrase and the selection of Peter, James, and John are conveyed accurately. However, “ebe naanị ha nọ” recasts κατ’ ἰδίαν as a relative location (“where only they were”) rather than the adverbial sense “apart/private.” “Duru ha rịgoro” is understandable but less direct than an idiomatic expression for Jesus’ leading them up the mountain.
  naturalness: The sentence is broadly comprehensible Standard Igbo, but “duru ha rigoro ... n’iche” is smoother and more idiomatic for the upward movement and separation from others.
  terminology: The established Igbo biblical forms Jisọs, Pita, Jemis, and Jọn are appropriate. “Jọn, nwanne ya nwoke” retains the Greek’s appositional phrasing and avoids adding an explicit antecedent not stated in the clause.
  issues:
  - severity: medium
    issue: The rendering of κατ’ ἰδίαν is overly locative.
    rationale: “ebe naanị ha nọ” means “where only they were,” while the Greek modifies the act of leading them and means “apart,” “privately,” or “by themselves.”
  - severity: low
    issue: The upward-leading phrase is slightly awkward.
    rationale: “Duru ha rịgoro” can suggest that he led them to climb; “duuru ha rigoro” naturally expresses that he led them up.
  - severity: low
    issue: The footnote combines alternatives imprecisely.
    rationale: “naanị ha” and “n’ebe nzuzo” are distinct renderings of κατ’ ἰδίαν. A single clear alternative better serves the lexical note.
  revised_text: Mgbe ụbọchị isii gachara, Jisọs kpọọrọ Pita, Jemis, na Jọn, nwanne ya nwoke, duuru ha rigoro otu ugwu dị elu n’iche.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ebe nzuzo.”
    reason: lexical_alternative
  revision_rationale: The revision renders κατ’ ἰδίαν adverbially as “n’iche,” preserves the narrative’s sense that Jesus led the three up a high mountain, and retains the appositional wording for John as James’s brother without supplying a named antecedent. The footnote now gives one precise lexical alternative.
