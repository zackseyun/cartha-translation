id: MAT.17.1
reference: Matthew 17:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: ig
  text: Mgbe ụbọchị isii gachara, Jisọs kpọọrọ Pita, Jemis, na Jọn, nwanne ya nwoke, duuru ha rigoro otu ugwu dị elu n’iche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ebe nzuzo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: Mgbe ụbọchị isii gachara
  rationale: Nke a na-egosipụta usoro oge nke μετά na accusative n’ụzọ doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: παραλαμβάνει
  choice: kpọọrọ
  rationale: Ngwaa a pụtara ịkpọrọ mmadụ soro onwe ya; “kpọọrọ” na-enye echiche nke ‘takes along/with him’ n’ụzọ eke n’Igbo.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Pita, Jemis na Jọn
  rationale: E ji ụdị aha ndị a a maara nke ọma n’Igbo dee aha ndị ahụ.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: nwanne ya nwoke Jọn
  rationale: N’usoro okwu Grik, nkebi a kọwara Jọn dị ka nwanne nwoke Jemis; ntụgharị a na-eme ka njikọ ahụ doo anya n’Igbo n’enweghị ịgbakwunye ihe ọzọ.
- source_word: ἀναφέρει
  choice: duru ha rịgoro
  rationale: Nke a na-egosipụta ma idu ha ma ngagharị ịrịgo ugwu, ma zere ikwughachi “kpọọrọ.”
- source_word: εἰς ὄρος ὑψηλὸν
  choice: n’elu otu ugwu dị elu
  rationale: Nke a na-egosipụta ebe njem ahụ na-aga na ịrịgo n’elu ugwu n’ụzọ Igbo dị mfe nghọta.
- source_word: κατ’ ἰδίαν
  choice: ebe naanị ha nọ
  rationale: Nkebi a na-egosi na Jisọs na ndị na-eso ụzọ atọ ahụ nọ iche site n’ebe ndị ọzọ nọ.
theological_decisions:
- issue: Ngwaa ndị e ji oge ugbu a kọọ akụkọ n’Oziọma
  choice: 'E ji oge gara aga kọọ ya: “kpọọrọ ... duru”'
  alternative: 'Idowe ọdịdị oge ugbu a: “na-akpọrọ ... na-eduru”'
  rationale: Ọ bụ ezie na Grik ji historical present mee ka akụkọ dị ndụ, oge gara aga bụ ụzọ Igbo nkịtị si akọ ihe mere eme, ma ọ naghị agbanwe ihe omume ma ọ bụ ihe mmụta dị na ya.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji “kpọọrọ” gosipụta παραλαμβάνει nke ọma, ebe usoro ahịrịokwu ahụ nọgidere bụrụ nke eke n’Igbo.
