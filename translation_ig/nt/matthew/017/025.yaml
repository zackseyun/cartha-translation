id: MAT.17.25
reference: Matthew 17:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: ig
  text: Ọ sịrị, “Ee.” Mgbe ọ banyere n’ụlọ, Jizọs bu ụzọ gwa ya okwu, sị, “Gịnị ka i chere, Saịmọn? N’aka ndị ole ka ndị eze ụwa na-anakọta ụtụ kọstọm[a] ma ọ bụ ụtụ isi n’isi—ọ bụ n’aka ụmụ nwoke ha ka ọ bụ n’aka ndị ọzọ[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ụtụ ahịa” ma ọ bụ “ụtụ ngafe.” Okwu Greek τέλη pụtara ụtụ dị ka ụtụ kọstọm ma ọ bụ ụtụ a na-akwụ n’ụzọ, ọ dịkwa iche na κῆνσον, bụ́ ụtụ isi n’isi.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ndị na-abụghị ndị ezinụlọ ha.” Okwu Greek ἀλλοτρίων na-ekwu maka ndị na-abụghị nke ha, ya bụ, ndị nọ n’èzí ezinụlọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: Ee
  rationale: Ọ bụ azịza nkwenye dị mfe ma bụrụkwa okwu Igbo nkịtị kwekọrọ na Greek.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: Mgbe ọ banyere n’ụlọ
  rationale: A gbanwere participle ahụ ka ọ bụrụ nkebiokwu oge doro anya; onye ọ na-ekwu maka ya bụ Pita.
- source_word: προέφθασεν αὐτὸν
  choice: Jizọs buru ya ụzọ kwuo okwu
  rationale: Nke a na-egosi na Jizọs malitere okwu tupu Pita ekwuo ihe, n’enweghị ịsụgharị akpaalaokwu Greek ahụ n’ụzọ siri ike.
- source_word: Τί σοι δοκεῖ
  choice: Gịnị ka i chere
  rationale: Ọ bụ ụzọ Igbo dị ndụ e si arịọ mmadụ ka o kwuo echiche ma ọ bụ mkpebi ya.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: ndị eze ụwa
  rationale: Ọ na-edobe echiche sara mbara nke γῆ ma ghara ime ya naanị otu ala kpọmkwem.
- source_word: τέλη
  choice: ụtụ kọstọm
  rationale: Ọ na-egosi ụdị ụtụ a na-atụ n’ahịa, n’ụzọ ma ọ bụ n’ihe a na-ebubata na mbupụ, ma na-eme ka ọ dị iche na κῆνσον.
- source_word: κῆνσον
  choice: ụtụ isi n’isi
  rationale: Nke a na-akọwa ụtụ a na-atụ mmadụ n’otu n’otu ma na-edobe ọdịiche ya na τέλη.
- source_word: υἱῶν αὐτῶν
  choice: ụmụ ha ndị nwoke
  rationale: A hapụrụ ihe Greek kwuru kpọmkwem, ‘ụmụ ndị nwoke,’ nakwa mmekọrịta ezinụlọ nke ntụnyere ahụ.
- source_word: ἀλλοτρίων
  choice: ndị ọzọ
  rationale: Ọ bụ okwu Igbo dị nkenke nke na-egosi ndị na-abụghị ụmụ eze ahụ; nkọwa ala peeji na-eme ka echiche nke ndị na-abụghị ndị ezinụlọ doo anya.
theological_decisions:
- issue: Ihe a pụrụ ịghọta n’ozizi banyere okwu ‘ụmụ ha ndị nwoke’ n’ihe atụ Jizọs
  choice: A hapụrụ okwu ezinụlọ ahụ kpọmkwem dị ka ‘ụmụ ha ndị nwoke,’ n’akọwaghị ihe ọ pụtara banyere Kraịst n’amaokwu a.
  alternative: ụmụ ha; ndị ha na-achị
  rationale: Isi ihe ozugbo bụ na ndị ezinụlọ eze anaghị akwụ ya ụtụ; nke a na-akwadebe ihe amaokwu na-esote ga-egosi. Nsụgharị ahụ na-edobe esemokwu na ihe ọ na-atụ aka na ya n’enweghị ịkọwa ya gabiga ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ọdịiche dị n’etiti ụdị ụtụ abụọ ahụ, okwu ‘ụmụ ha ndị nwoke,’ na nghọta sara mbara nke ‘ndị ọzọ.’
