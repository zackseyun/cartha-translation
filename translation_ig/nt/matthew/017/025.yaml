  verdict: revise
  source_fidelity: 'A chọrọ mmezi n’ajụjụ mbụ: “N’aka ndị ka” ezughị ezu n’Igbo maka ἀπὸ τίνων (“n’aka ndị ole?/n’aka ndị mmadụ ole?”). “N’aka ndị ole ka” na-eweghachi ajụjụ Greek ahụ n’ụzọ doro anya. A sụgharịla προέφθασεν n’ụzọ dabara adaba dịka Jizọs bu ụzọ gwa Pita okwu, ma dị iche n’echiche nke naanị ịmalite ikwu okwu.'
  naturalness: “N’aka ndị ole ka” bụ Igbo Standard doro anya ma bụrụ nke a na-ekwu n’ụzọ nkịtị. “Jizọs bu ụzọ gwa ya okwu” dị mma ma dị ire karịa “Jizọs buru ya ụzọ kwuo okwu.” “Ụmụ nwoke ha” na-edobe υἱῶν ma na-ada n’ụzọ nkịtị karịa “ụmụ ha ndị nwoke.”
  terminology: “Ụtụ kọstọm” na “ụtụ isi n’isi” na-echekwa ọdịiche dị n’etiti τέλη na κῆνσος. “Ụmụ nwoke ha” na-edobe okwu Greek kpọmkwem maka sons, ebe “ndị ọzọ” na-edobe ἀλλοτρίων n’enweghị ịmanye echiche “ndị mba ọzọ.”
  issues:
  - severity: high
    issue: Ajụjụ “N’aka ndị ka” ezughị ezu.
    rationale: Ọ naghị akọwa interrogative plural τίς/τίνων nke ọma n’Igbo. “N’aka ndị ole ka” na-enye “from whom?” n’ụzọ zuru oke.
  - severity: low
    issue: “Jizọs buru ya ụzọ kwuo okwu” adịghị ire nke ọma dịka okwu Igbo.
    rationale: “Jizọs bu ụzọ gwa ya okwu” bụ okwu eke nke na-edobe echiche na Jizọs butere ụzọ ịgwa Pita okwu.
  - severity: low
    issue: “Ụmụ ha ndị nwoke” nwere ike ịda ntakịrị arọ.
    rationale: “Ụmụ nwoke ha” na-enye otu nkọwa ahụ—sons, ọ bụghị ụmụaka n’ozuzu—n’ụzọ Igbo nkịtị.
