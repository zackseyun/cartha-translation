  to: Ọ sịrị, “Ee.” Mgbe ọ banyere n’ụlọ, Jizọs bu ụzọ gwa ya okwu, sị, “Gịnị ka i chere, Saịmọn? N’aka ndị ole ka ndị eze ụwa na-anakọta ụtụ kọstọm[a] ma ọ bụ ụtụ isi n’isi—ọ bụ n’aka ụmụ nwoke ha ka ọ bụ n’aka ndị ọzọ[b]?”
  rationale: Mmezi ndị a na-edozi ajụjụ onye a na-anakọta ụtụ n’aka ya, na-eme ka usoro okwu Igbo bụrụ nke eke, ma na-edobe kpọmkwem ọdịiche ụtụ abụọ ahụ, ntụnyere ụmụ nwoke nke eze, na nkọwa na-enweghị mgbakwunye ozizi.
