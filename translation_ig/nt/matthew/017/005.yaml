id: MAT.17.5
reference: Matthew 17:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: ig
  text: Mgbe ọ ka nọ na-ekwu okwu, lee, igwe ojii na-egbuke egbuke kpuchiri ha[c]. Lee[b], olu sitere n’igwe ojii ahụ sị, “Onye a bụ Nwa m nwoke m hụrụ n’anya, onye obi dị m ụtọ na ya. Geenụ ya ntị[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Nụrụnụ ya.” Iwu Grik a nwere ike ịpụta ịnụ okwu ya ma ṅaa ya ntị.
    reason: lexical_alternative
  - marker: b
    text: Okwu “lee” pụtara ugboro abụọ n’amaokwu Grik a; ọ na-adọta uche ma na-eme ka ihe ahụ merenụ pụta ìhè nke ukwuu.
    reason: lexical_alternative
  - marker: c
    text: Okwu a sụgharịrị “kpuchiri” nwere ike ikwughachi asụsụ Akwụkwọ Nsọ banyere ngosipụta ọnụnọ Chineke.
    reason: cross_reference
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Mgbe ọ ka nọ na-ekwu okwu
  rationale: Nkebiokwu a na-egosi na ihe abụọ ahụ mere n’otu oge, ma ‘ka nọ’ na-echekwa echiche ἔτι, ya bụ na olu ahụ batara mgbe ọ ka na-ekwu okwu.
- source_word: ἰδοὺ
  choice: lee
  rationale: ‘Lee’ bụ okwu Igbo doro anya nke na-adọta uche onye na-agụ ma na-echekwa ịdị egwu nke ἰδού, nke pụtara ugboro abụọ n’amaokwu ahụ.
- source_word: νεφέλη φωτεινὴ
  choice: igwe ojii na-enwu gbaa
  rationale: Nke a na-enye nkọwa φωτεινή n'ụzọ doro anya, n’etinyeghị nkọwa mmụọ ọzọ n’ime isi okwu.
- source_word: ἐπεσκίασεν
  choice: kpuchiri
  rationale: ‘Kpuchiri’ na-enye echiche na igwe ojii ahụ bịakwasịrị ha ma gbaa ha gburugburu; ihe e nwere ike ịnụ banyere ngosipụta ọnụnọ Chineke ka edobere n’ihe odide ala peeji.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: otu olu sikwa n’igwe ojii ahụ kwuo
  rationale: A gbanwere participle ahụ ka ọ bụrụ ngwaa zuru ezu n’Igbo nkịtị, ebe ‘si n’igwe ojii’ na-echekwa ἐκ τῆς νεφέλης.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Nwa m nwoke m hụrụ n’anya
  rationale: ‘Nwa m nwoke’ na-egosipụta υἱός n’enweghị itinye echiche ‘ọkpara’ ma ọ bụ nwa mbụ, nke adịghị na okwu Grik; ‘m hụrụ n’anya’ na-echekwa ἀγαπητός n’Igbo dị ndụ.
- source_word: ἐν ᾧ εὐδόκησα
  choice: onye obi dị m ụtọ na ya
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi kwuo na onye ahụ na-atọ onye na-ekwu okwu ụtọ, ma ọ naghị amanye aorist Grik ka ọ bụrụ naanị oge gara aga.
- source_word: ἀκούετε αὐτοῦ
  choice: Geenụ ya ntị
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ. ‘Geenụ ya ntị’ gụnyere ịnụ ihe ọ na-ekwu na ịṅa ya ntị, ma ọ naghị akọwa ya ozugbo dị ka ‘ruberenụ ya isi.’
theological_decisions:
- issue: Nkwupụta olu ahụ banyere onye Jizọs bụ
  choice: Onye a bụ Nwa m nwoke m hụrụ n’anya, onye obi dị m ụtọ na ya
  alternative: Onye a bụ Ọkpara m, Onye M Hụrụ n’Anya, onye ihe ya dị m mma
  rationale: Nhọrọ a na-echekwa njirimara Jizọs dịka Nwa Chineke na ịhụnanya na ihu ọma e kwupụtara banyere ya, ma ọ naghị ebubata echiche ịbụ nwa mbụ nke okwu Grik υἱός n’onwe ya na-ekwughị.
- issue: Ike iwu ἀκούετε αὐτοῦ
  choice: Geenụ ya ntị
  alternative: Nụrụnụ olu ya
  rationale: Okwu ahụ chọrọ ihe karịrị ịnụ ụda nkịtị; ọ na-akpọ ndị na-ege ntị ka ha ṅaa ya ntị. Ma a hapụrụ mmekọrịta dị n’etiti ige ntị na nrubeisi ka ọ dị, kama ịsụgharị ya ozugbo dịka ‘ruberenụ ya isi.’
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa nsọpụrụ. E debere ‘lee’ ugboro abụọ dịka n’asụsụ Grik. E zere ‘Ọkpara’ n’ihi na n’Igbo ọ pụrụ ịpụta nwa mbụ, ebe isi okwu a bụ υἱός, ọ bụghị πρωτότοκος.
