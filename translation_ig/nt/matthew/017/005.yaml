revisions:
- from: Mgbe ọ ka nọ na-ekwu okwu, lee, igwe ojii na-enwu gbaa kpuchiri ha[c]. Lee[b], otu olu sikwa n’igwe ojii ahụ kwuo, “Onye a bụ Nwa m nwoke m hụrụ n’anya, onye obi dị m ụtọ na ya. Geenụ ya ntị[a].”
  to: Mgbe ọ ka nọ na-ekwu okwu, lee, igwe ojii na-egbuke egbuke kpuchiri ha[c]. Lee[b], olu sitere n’igwe ojii ahụ sị, “Onye a bụ Nwa m nwoke m hụrụ n’anya, onye obi dị m ụtọ na ya. Geenụ ya ntị[a].”
  rationale: The revision makes the cloud description and speech introduction more natural in Standard Igbo while retaining every source element and the existing footnote anchors. It also narrows the theophany footnote so that it signals a possible textual resonance without imposing an interpretation.
