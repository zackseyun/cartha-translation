review_pass:
  verdict: revise
  source_fidelity: 'The future active ‘Ha ga-egbu ya’ accurately renders ἀποκτενοῦσιν αὐτόν. ‘A ga-akpọlite ya’ appropriately retains the future passive of ἐγερθήσεται without supplying an agent. The temporal phrase must be separated from the additive particle: ‘n’ụbọchị nke atọkwa’ can suggest ‘on the third day also,’ rather than simply ‘on the third day.’ The final clause should also retain the explicit connective and convey σφόδρα clearly.'
  naturalness: The revised wording is idiomatic Standard Igbo, with a clear temporal phrase and a natural expression for intense grief.
  terminology: ‘Igbu,’ ‘ịkpọlite,’ and ‘oke mwute’ are suitable, dignified modern Igbo terms. The note correctly identifies the Greek passive and gives ‘ọ ga-ebili’ as a viable alternative rendering.
  issues:
  - severity: medium
    issue: The additive particle in ‘n’ụbọchị nke atọkwa’ is attached to the time phrase.
    rationale: This can mean ‘on the third day too/also’ and thus introduces an emphasis not expressed by τῇ τρίτῃ ἡμέρᾳ. Removing it preserves the unmarked temporal expression.
  - severity: low
    issue: The final sentence lacks an overt equivalent for the final καί.
    rationale: Although Igbo may omit a connective naturally, ‘Ha wee nwee oke mwute’ preserves the narrative continuation while remaining idiomatic.
  revised_text: Ha ga-egbu ya, n’ụbọchị nke atọ a ga-akpọlite ya[a]. Ha wee nwee oke mwute.
  revised_footnotes:
