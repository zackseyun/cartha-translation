  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀποκτενοῦσιν αὐτόν, καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθήσεται. καὶ ἐλυπήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: ig
  text: Ha ga-egbu ya, n’ụbọchị nke atọ a ga-akpọlite ya[a]. Ha wee nwee oke mwute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “ọ ga-ebili.” Ngwaa Grik ahụ dị n’olu nnara: “a ga-akpọlite ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: ha ga-egbu ya
  rationale: Nke a na-enye ihe ọdịnihu na onye nnara ya n’ụzọ kwụ ọtọ ma dịkwa eke n’Igbo. ‘Igbu’ anaghị etinye echiche ọzọ nke ‘igbu ọchụ’ nke ngwaa Grik ahụ n’onwe ya na-ekwughị.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: n’ụbọchị nke atọ
  rationale: Nke a na-egosi oge ihe ahụ ga-eme ma na-edobe kpọmkwem okwu Grik ahụ n’enweghị mgbakwunye na-adịghị mkpa.
- source_word: ἐγερθήσεται
  choice: a ga-akpọlite ya
  rationale: 'Ụdị a na-edobe olu nnara nke ngwaa Grik: onye ahụ bụ onye a na-akpọlite, ma a kpọghị onye mere ya aha. Ọ dabara nke ọma n’okwu gbasara ịkpọlite onye nwụrụ anwụ.'
- source_word: ἐλυπήθησαν σφόδρα
  choice: O wutere ha nke ukwuu
  rationale: Nke a bụ ụzọ Igbo dị ugbu a na nke eke si egosi na mwute juru ha obi nke ukwuu; ọ na-edobe ike nke σφόδρα.
- source_word: καὶ ... καὶ ... καὶ
  choice: ha ga-… n’ụbọchị nke atọkwa… O wutere ha…
  rationale: Njikọ ‘-kwa’ na usoro ahịrịokwu ndị a na-edobe njikọ na-aga n’ihu nke καί ugboro ugboro, ma ghara ime ka Igbo sie ike ma ọ bụ bụrụ nke a sụgharịrị okwu n’otu n’otu.
theological_decisions:
- issue: Ma a ga-eji olu nnara ma ọ bụ olu ome mee amụma mbilite n’ọnwụ ahụ
  choice: a ga-akpọlite ya
  alternative: ọ ga-ebili
  rationale: ἐγερθήσεται bụ ọdịnihu n’olu nnara. Ide ‘a ga-akpọlite ya’ na-edobe ọdịdị ahụ na ohere nke onye na-eme omume ahụ bụ Chineke, ma ọ naghị agbakwunye aha onye mere ya ebe ederede Grik na-akpọghị ya aha.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta mee ihe. ‘O wutere ha nke ukwuu’ bụ okwu Igbo eke karịa ịgbaso nhazi Grik n’ụzọ siri ike. E tinyere akara nkọwa ala peeji [a] ozugbo n’akụkụ okwu mbilite n’ọnwụ ọ na-akọwa.
