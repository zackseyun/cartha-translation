    text: 'Ma ọ bụ, “ọ ga-ebili.” Ngwaa Grik ahụ dị n’olu nnara: “a ga-akpọlite ya.”'
    reason: lexical_alternative
  revision_rationale: The revision removes the potentially misleading additive sense of -kwa from the third-day phrase and makes the final connective explicit. It retains the source’s future passive for the resurrection prediction and the intensity of the disciples’ grief.
