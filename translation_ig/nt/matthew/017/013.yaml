  text: τότε συνῆκαν οἱ μαθηταὶ ὅτι περὶ Ἰωάννου τοῦ βαπτιστοῦ εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/013.yaml
  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: ig
  text: Mgbe ahụ, ndị na-eso ụzọ ahụ ghọtara na ọ gwara ha okwu banyere Jọn Onye Na-eme Baptizim[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jọn Onye Na-emikpu mmadụ n’ime mmiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Na-egosi oge ndị na-eso ụzọ ji ghọta ihe ahụ; ọ bụ njikọ akụkọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: συνῆκαν
  choice: ghọtara
  rationale: Na-egosi na ha bịara mata ihe okwu ahụ pụtara, n'etinyeghị nkọwa karịrị ihe Grik kwuru.
- source_word: οἱ μαθηταὶ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka ndị na-amụ ihe n'okpuru Jizọs ma na-eso ya; 'ya' na-eme ka onye ha na-eso doo anya n'Igbo.
- source_word: ὅτι
  choice: na ọ bụ ... ka
  rationale: Usoro a na-ewebata ihe ha ghọtara n'ụzọ Igbo ebumpụta ụwa, ọ bụghị ihe kpatara ya.
- source_word: περὶ Ἰωάννου τοῦ βαπτιστοῦ
  choice: Jọn Onye Na-eme Baptizim ... maka ya
  rationale: Na-echekwa Jọn dị ka isiokwu okwu Jizọs; aha ọrụ ahụ na-akọwa onye na-eme baptizim n'ụzọ kwụ ọtọ.
- source_word: εἶπεν αὐτοῖς
  choice: ka ọ na-ekwu maka ya nye ha
  rationale: Na-egosi na Jizọs kwuru okwu ahụ nye ha. Usoro Igbo a na-eme ka ihe ọ na-ekwu maka ya pụta ìhè n'enweghị ịgbakwụnye nkọwa ọzọ.
theological_decisions:
- issue: Ịmata onye Ịlaịja nke a na-ekwu banyere ya nọchiri anya n'okwu ndị gbara amaokwu a gburugburu
  choice: Amaokwu ahụ na-ekwu hoo haa na ndị na-eso ụzọ ghọtara na Jizọs na-ekwu maka Jọn Onye Na-eme Baptizim.
  alternative: Ịhapụ onye okwu ahụ na-ezo aka n'ebe edoghị anya.
  rationale: Akụkọ ahụ n'onwe ya mere onye a na-ekwu maka ya ka ọ doo anya; nsụgharị ahụ ekwesịghị ime ka o doo anya karịa ma ọ bụ ghara ido anya karịa ihe odide ahụ.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “Onye Na-eme Baptizim” n'ihi na ọ bụ okwu ndị na-agụ Baịbụl n'Igbo maara; ihe e dere n'ala ala peeji na-egosi ihe aha Grik βαπτιστής pụtara n'ụzọ kwụ ọtọ.
