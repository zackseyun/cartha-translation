id: MAT.17.8
reference: Matthew 17:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: ig
  text: Mgbe ha weliri anya ha elu, ha ahụghị onye ọ bụla ma e wezụga Jizọs naanị ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ma e wezụga naanị Jizọs.” N’asụsụ Grik, nnọchiaha e ji emesi ike dị n’ihu aha Jizọs, tinyekwara okwu “naanị,” iji mesie ike na ọ dịghị onye ọzọ ha hụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάραντες
  choice: Mgbe ha weliri ... elu
  rationale: Aorist participle a na-egosi ihe ha mere tupu ngwaa bụ isi; ‘Mgbe ha weliri’ na-egosipụta usoro ahụ n’Igbo dị eke.
- source_word: δὲ
  choice: (ekwughị ya iche)
  rationale: δὲ bụ njikọ akụkọ dị nro; usoro ahịrịokwu Igbo na-aga nke ọma n’enweghị ịgbakwunye ‘ma’ nke nwere ike ime ka ọ bụrụ mmegide siri ike.
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: anya ha
  rationale: Nke a na-edobe okwu ahụ dịka akụkụ ahụ, kama ịgbanwe ya ka ọ bụrụ echiche dịka ‘nlele ha.’
- source_word: οὐδένα
  choice: onye ọ bụla ...ghị
  rationale: Usoro njụ Igbo ‘ahụghị onye ọ bụla’ na-enye ihe οὐδένα pụtara n'ụzọ doro anya ma dị eke.
- source_word: εἶδον
  choice: ha ahụghị
  rationale: A na-asụgharị aorist nke ὁράω dịka ịhụ anya nkịtị; njụ ahụ jikọtara na ngwaa dịka ụtọasụsụ Igbo si dị.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: Mgbe ọ na-esochi njụ, okwu a pụtara ‘except’; ‘ma e wezụga’ bụ Igbo doro anya maka nke ahụ.
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: naanị Jizọs
  rationale: ‘Naanị Jizọs’ na-edobe nkwusi ike nke exclusivity n’Igbo dị eke, ebe ịgbakwunye nnọchiaha ọzọ ga-ada arọ ma ọ bụ bụrụ ihe na-adịghị edo anya.
theological_decisions:
- issue: Nkwusi ike na Jizọs bụ naanị onye fọdụrụ ka ha hụ
  choice: ma e wezụga naanị Jizọs
  alternative: ma e wezụga Jizọs naanị ya
  rationale: Asụsụ Grik jikọtara εἰ μὴ, αὐτόν, na μόνον iji mesie na ọ bụ naanị Jizọs ka ha hụrụ. Nsụgharị ahụ na-edobe nkwusi ike a n’enweghị ịgbakwunye nkọwa banyere Mozis na Ịlaịja ma ọ bụ nkwenkwe ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere akpaalaokwu banyere iweli anya elu, ma hazie njụ ahụ dịka ụtọasụsụ Igbo si dị.
