  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: ig
  text: Ma[a] ụdị a anaghị apụ ma ọ bụghị site n'ekpere na ibu ọnụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a adịghị n'ihe odide Grik ndị kacha ochie, gụnyere Sinaiticus na Vaticanus nke narị afọ nke anọ, nakwa na nsụgharị Syriak na Kọptik ndị mbụ. Otú ọ dị, ọ dị n'ọtụtụ ihe odide ọdịnala Bizantịn, n'ọdịnala Latịn, nakwa n'ọtụtụ ndịàmà Syriak. O yikarịrị ka ndị odeakwụkwọ mechara tinye ya iji mee ka ebe a kwekọọ na Mak 9:29.
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: ụdị
  rationale: N'ọnọdụ a, okwu ahụ na-ezo aka n'otu ụdị ma ọ bụ otu òtù ndị mmụọ ọjọọ, ya mere “ụdị” bụ okwu Igbo doro anya ma dịkwa eke.
- source_word: ἐκπορεύεται
  choice: apụ
  rationale: Ọ na-egosi mmụọ ọjọọ isi n'ahụ onye ahụ pụọ; “apụ” na-enye echiche ahụ n'ụzọ dị nkenke ma kwekọọ n'Igbo.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: N'ebe a ọ bụ ahịrịokwu na-egosi na ọ bụ naanị ụzọ a kpọrọ aha ka ihe ahụ si ekwe omume; “ma e wezụga” na-echekwa ike nke nkwupụta ahụ.
- source_word: προσευχῇ
  choice: ekpere
  rationale: “Ekpere” bụ okwu Igbo a na-ejikarị akọwa ịrịọ ma ọ bụ ịgwa Chineke okwu.
- source_word: νηστείᾳ
  choice: ibu ọnụ
  rationale: “Ibu ọnụ” bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo ịghara iri nri maka nzube okpukpe.
theological_decisions:
- issue: Ihe “ụdị a” na-ezo aka na ya
  choice: E debere ya dịka “ụdị a” n'emeghị ka ihe ọ na-ezo aka na ya pụta ìhè karịa ihe Grik kwuru.
  alternative: “Ụdị mmụọ ọjọọ a”
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi mmụọ ọjọọ, ma ederede Grik n'onwe ya kwuru naanị “ụdị a.” Nsụgharị ahụ na-echekwa ntakịrị mgbagwoju anya ahụ kama ịgbakwunye aha n'ime isi ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbasochi usoro na echiche Grik anya, ma ọ ka na-ada ka Igbo e ji eme ihe kwa ụbọchị.
