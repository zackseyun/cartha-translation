id: MAT.17.20
reference: Matthew 17:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: ig
  text: Ma ọ sịrị ha, “Ọ bụ n’ihi ntakịrị okwukwe unu.[a] N’ezie, ana m asị unu, ọ bụrụ na unu nwere okwukwe dị ka mkpụrụ mọstad,[b] unu ga-asị ugwu a, ‘Si ebe a kwaga ebe ahụ,’ ọ ga-akwagakwa; ọ dịghịkwa ihe ga-ekwe unu omume.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ihi okwukwe unu na-ezughị oke.” Okwu Grik ahụ na-egosi okwukwe pere mpe ma ọ bụ nke na-ezughị oke karịa enweghị okwukwe kpamkpam.
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik: “okwukwe dị ka mkpụrụ mọstad.” Ntụnyere ahụ na-arụtụ aka n’ihe dị nnọọ nta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: ọ sịrị
  rationale: Ọ bụ historical present n’asụsụ Grik; oge gara aga bụ ụzọ ebumpụta ụwa e si akọ akụkọ n’Igbo, ma ọ ka na-edobe okwu Jizọs dị ka azịza kpọmkwem.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: Ọ bụ n’ihi ntakịrị okwukwe unu
  rationale: ὀλιγοπιστία na-egosi okwukwe pere mpe ma ọ bụ na-ezughị oke, ọ bụghị enweghị okwukwe kpamkpam.
- source_word: ἀμὴν
  choice: N’ezie
  rationale: Nke a bụ okwu nkwusi ike nke na-ebute nkwupụta dị mkpa; “N’ezie” bụ Igbo doro anya ma kwesị ekwesị.
- source_word: πίστιν
  choice: okwukwe
  rationale: N’ebe a, okwu ahụ na-ezo aka na ntụkwasị obi n’ike Chineke; “okwukwe” na-edobe okwu okpukpe a maara nke ọma n’enweghị ịgbakwunye nkọwa otu ụka.
- source_word: ὡς κόκκον σινάπεως
  choice: dị ka mkpụrụ mọstad
  rationale: Ntụnyere a na-eji mkpụrụ mọstad, ihe dị nnọọ nta, kọwaa okwukwe.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: Si ebe a kwaga ebe ahụ
  rationale: “Kwaga” dabara n’iwu a na-enye ugwu ka ọ gbanwee ebe ọ nọ.
- source_word: μεταβήσεται
  choice: ọ ga-akwagakwa
  rationale: 'Future middle a nwere nghọta intransitive: ugwu ahụ ga-esi n’ebe ọ nọ kwaga.'
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: ọ dịghịkwa ihe ga-ekwe unu omume
  rationale: Nke a bụ ụzọ Igbo e si kwuo n'ụzọ doro anya na ọ dịghị ihe ga-abụ ihe ha na-apụghị ime.
theological_decisions:
- issue: Ihe πίστις pụtara n’ọnọdụ ọrụ ebube a
  choice: okwukwe
  alternative: ntụkwasị obi
  rationale: Ọnọdụ a metụtara ntụkwasị obi ndị na-eso ụzọ nwere n’ike Chineke, ọ bụghị nkwupụta kpọmkwem banyere okwukwe nzọpụta ma ọ bụ ikwesị ntụkwasị obi. “Okwukwe” na-edobe okwu isi mmalite ahụ n’enweghị itinye ozizi otu ụka.
- issue: Oke nkwupụta “ọ dịghị ihe ga-ekwe unu omume”
  choice: E debere nkwupụta ahụ n’ụdị sara mbara dịka Grik si kwuo ya
  alternative: Ịkọwa ya kpọmkwem dịka naanị ọrụ ebube ma ọ bụ ihe kwekọrọ n’uche Chineke
  rationale: Amaokwu ahụ n’onwe ya ekwughị oke ahụ n'ụzọ doro anya; ya mere nsụgharị ekwesịghị ịgbakwunye nkọwa ozizi nke ga-emechi esemokwu dị na okwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ma” na-anọchi δέ dị ka njikọ dị nro; a zere ime ka ọ bụrụ mmegide siri ike. Akara ndetu [a] na [b] dị n’ederede isi, n’ebe okwu ha metụtara dị.
