source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: ig
  text: 'Pita wee zaa Jizọs sị, “Onyenwe anyị, ọ dị mma ka anyị nọrọ n’ebe a. Ọ bụrụ na ọ masịrị gị, aga m arụ ụlọikwuu atọ[a] n’ebe a: otu maka gị, otu maka Mozis, na otu maka Ịlaịja.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a, skēnas, pụkwara ịsụgharị ya “ụlọ ntu” ma ọ bụ “ụlọ ndò.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: wee zaa, sị
  rationale: Nke a na-egosipụta usoro okwu Grik nke pụtara ‘zara wee sị,’ ma jiri usoro akụkọ dị n’Igbo nke na-aga were were.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Aha a na-asụpụrụ Jizọs ma na-edobekwa ibu okwu κύριος nwere, kama ime ka ọ bụrụ naanị okwu nkwanye ùgwù.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: ọ dị mma ka anyị nọrọ n’ebe a
  rationale: Ọ bụ okwu Igbo doro anya nke na-esochi echiche nke ahịrịokwu Grik n’enweghị mgbakwunye.
- source_word: εἰ θέλεις
  choice: Ọ bụrụ na ọ masịrị gị
  rationale: Nke a na-egosi ọchịchọ ma ọ bụ nkwenye onye a na-agwa okwu, ma dabara n’okwu nkwanye ùgwù Pita gwara Jizọs.
- source_word: ποιήσω
  choice: aga m arụ
  rationale: Ọ na-edobe onye mbụ otu na oge ọdịnihu nke ngwaa Grik ma bụrụkwa ngwaa Igbo kwesịrị ekwesị maka ịrụ ebe obibi nwa oge.
- source_word: σκηνάς
  choice: ụlọ ndò
  rationale: ‘Ụlọ ndò’ bụ okwu a na-aghọta nke ọma maka ebe obibi nwa oge; ọ naghị ekpebi na amaokwu a na-ekwu kpọmkwem banyere Ememme Ụlọikwuu.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: otu maka gị, otu maka Mozis, na otu maka Ịlaịja
  rationale: Ikwughachi ‘otu’ ugboro atọ na-edobe nkesa na nkwusi ike dị n’ihe odide Grik.
- source_word: ὧδε
  choice: n’ebe a
  rationale: E debere ugboro abụọ okwu a pụtara n’ihe odide Grik.
theological_decisions:
- issue: Nsụgharị κύριος mgbe Pita na-agwa Jizọs okwu
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: ‘Onyenwe anyị’ na-edobe ma nkwanye ùgwù ma ohere ibu nkà mmụta okpukpe dị n’aha a; ‘Nna anyị ukwu’ nwere ike ime ka ọ bụrụ naanị aha onyeisi ma ọ bụ onye nkuzi.
- issue: Ihe σκηνάς pụtara n’akụkọ mgbanwe ọdịdị Jizọs
  choice: ụlọ ndò
  alternative: ụlọikwuu, ụlọ ntu
  rationale: Ihe odide ahụ ekwughị hoo haa na ụlọ ndị a metụtara Ememme Ụlọikwuu. Ya mere, isi ihe odide ji okwu na-anọpụ iche, ebe nkọwa ala peeji na-echekwa okwu ndị ọzọ nwere ike ibute njikọ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, doro anya ma dị nsọ n’ụzọ kwesịrị ekwesị. E debere usoro okwu Pita dị mfe, a hapụkwara ihe nwere ike ijikọ ụlọ ndị ahụ na Ememme Ụlọikwuu ka ọ bụrụ ihe na-emeghe, kama idozi ya n’isi ihe odide.
