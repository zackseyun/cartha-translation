revisions:
- from: 'Pita wee zaa, sị Jizọs, “Onyenwe anyị, ọ dị mma ka anyị nọrọ n’ebe a. Ọ bụrụ na ọ masịrị gị, aga m arụ ụlọ ndò atọ[a] n’ebe a: otu maka gị, otu maka Mozis, na otu maka Ịlaịja.”'
  to: 'Pita wee zaa Jizọs sị, “Onyenwe anyị, ọ dị mma ka anyị nọrọ n’ebe a. Ọ bụrụ na ọ masịrị gị, aga m arụ ụlọikwuu atọ[a] n’ebe a: otu maka gị, otu maka Mozis, na otu maka Ịlaịja.”'
  rationale: The revision replaces the less precise 'ụlọ ndò' with 'ụlọikwuu,' a natural and well-established Igbo equivalent for temporary tents or booths. The footnote preserves lexical breadth without deciding whether a specific festival association is intended. Minor word-order adjustment improves idiomatic Standard Igbo while preserving the source's 'answered and said' formula.
  reviewer_model: gpt-5.6-terra
