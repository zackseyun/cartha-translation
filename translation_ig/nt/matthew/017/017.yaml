- from: Ma Jizọs zara sị, “Unu ọgbọ na-ekweghị ekwe[a] na nke gbagọrọ agbagọ[b]![c] Ruo ole mgbe ka m ga-anọnyere unu? Ruo ole mgbe ka m ga-anagide unu? Kpọtaranụ ya bịakwute m n’ebe a.”
  to: Ma Jizọs zara sị, “E, ọgbọ na-ekweghị ekwe[a] na nke gbagọrọ agbagọ[b]![c] Ruo ole mgbe ka m ga-anọnyere unu? Ruo ole mgbe ka m ga-anagide unu? Kpọtaranụ m ya n’ebe a.”
