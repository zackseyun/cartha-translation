base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: ig
  text: Ma Jizọs zara sị, “E, ọgbọ na-ekweghị ekwe[a] na nke gbagọrọ agbagọ[b]![c] Ruo ole mgbe ka m ga-anọnyere unu? Ruo ole mgbe ka m ga-anagide unu? Kpọtaranụ m ya n’ebe a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-enweghị ntụkwasị obi.” Okwu Grik ahụ pụrụ ịpụta ndị na-ekweghị ekwe ma ọ bụ ndị na-enweghị ntụkwasị obi.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nke e mebiri emebi” ma ọ bụ “nke rụrụ arụ.”
    reason: lexical_alternative
  - marker: c
    text: 'Okwu ịkpọku a nwekwara ike igosipụta mwute siri ike: “Ewoo, ọgbọ...”'
    reason: discourse_nuance
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Ma Jizọs zara sị
  rationale: Ụdị okwu Grik a bụ akpaalaokwu pụtara ‘zara wee sị’; ‘zara sị’ bụ Igbo ebumpụta ụwa, ebe ‘Ma’ na-egosi ntụgharị gaa n’ịba mba.
- source_word: Ὦ γενεὰ
  choice: Unu ọgbọ
  rationale: ‘Ọgbọ’ na-echekwa echiche γενεά banyere ndị otu oge; ‘Unu’ na-eme ka okwu ịkpọku ahụ doo anya n’Igbo n’enweghị itinye okwu ọzọ na-anọghị na isi mmalite.
- source_word: ἄπιστος
  choice: na-ekweghị ekwe
  rationale: N’ọnọdụ a, okwu ahụ na-elekwasị anya n’enweghị okwukwe; nsụgharị a ka na-ahapụkwa ntụgharị ‘ndị na-enweghị ntụkwasị obi’ na nkọwa ala peeji.
- source_word: διεστραμμένη
  choice: nke gbagọrọ agbagọ
  rationale: Na-egosipụta ọnọdụ e mebiri ma ọ bụ e tụgharịrị n’ụzọ na-ezighị ezi, ma na-echekwa ịdị arọ nke ịba mba ahụ.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: Ruo ole mgbe ka m ga-anọnyere unu?
  rationale: Nsụgharị kpọmkwem ma bụrụkwa ajụjụ Igbo dị mma maka okwu oge na ọdịnihu ahụ.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: Ruo ole mgbe ka m ga-anagide unu?
  rationale: ‘Ịnagide’ na-egosi idi ma ọ bụ iburu omume ndị ọzọ, ma na-echekwa ụda okwu siri ike karịa ‘inwe ndidi n’ebe unu nọ.’
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: Kpọtaranụ ya bịakwute m n’ebe a
  rationale: ‘Kpọtara’ dabara n’ịkpọta onye ahụ, ebe ‘bịakwute m n’ebe a’ na-egosipụta ma μοι ma ὧδε n’Igbo doro anya.
theological_decisions:
- issue: Ihe ἄπιστος pụtara n’ịba mba Jizọs
  choice: na-ekweghị ekwe
  alternative: ndị na-enweghị ntụkwasị obi
  rationale: Ihe gbara amaokwu ahụ gburugburu metụtara enweghị okwukwe. Nhọrọ a na-echekwa isi okwu ahụ n’enweghị ikwu kpọmkwem na ọ bụ ekwesịghị ntụkwasị obi n’ọgbụgba ndụ.
- issue: Nkọwa διεστραμμένη
  choice: nke gbagọrọ agbagọ
  alternative: nke rụrụ arụ
  rationale: ‘Gbagọrọ agbagọ’ na-echekwa ihe oyiyi nke ihe e tụgharịrị ma ọ bụ mebie, n’enweghị imechi ihe okwu ahụ pụtara nanị n’omume rụrụ arụ.
- issue: Ndị Jizọs na-agwa okwu
  choice: unu ọgbọ
  alternative: ọgbọ a
  rationale: Ụdị onye nke abụọ n’ajụjụ ndị na-esote na-egosi na ọ na-agwa ndị nọ ya n’ihu okwu; a hapụrụ ókè kpọmkwem nke ndị ahụ ka ọnọdụ akụkọ kpebie.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma kwụ ọtọ. ‘Unu ọgbọ’ na ‘Ruo ole mgbe’ na-echekwa ụda amụma na ịba mba nke isi Grik ahụ; ‘ga-anagide’ bụ okwu nkịtị ma ka dị n’ogo kwesịrị ekwesị maka Akwụkwọ Nsọ.
