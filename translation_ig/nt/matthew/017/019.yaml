revisions:
- from: Mgbe ahụ, ndị na-eso ụzọ Jizọs bịakwutere ya na nzuzo wee sị, “Gịnị mere anyị enweghị ike ịchụpụ ya[a]?”
  to: Mgbe ahụ, ndị na-eso ụzọ Jizọs bịakwutere Jizọs na nzuzo wee sị, “Gịnị mere na anyị enweghị ike ịchụpụ ya[a]?”
  rationale: The revision corrects the footnote’s erroneous expression for the boy while preserving the source’s disputed pronoun reference. Minor wording adjustments improve Igbo flow and retain the explicit reference to Jesus in the approach clause.
  reviewer_model: gpt-5.6-terra
