id: MAT.17.19
reference: Matthew 17:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: ig
  text: Mgbe ahụ, ndị na-eso ụzọ Jizọs bịakwutere Jizọs na nzuzo wee sị, “Gịnị mere na anyị enweghị ike ịchụpụ ya[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nnọchiaha a nwere ike izo aka na mmụọ ọjọọ ahụ, ma ọ bụ na nwata ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ akara oge na-egosi ihe sochiri n'usoro akụkọ; okwu a bụ nke dị mfe ma bụrụkwa Igbo nkịtị.
- source_word: προσελθόντες
  choice: bịakwutere
  rationale: Ọ na-egosi na ndị na-eso ụzọ bịarutere Jizọs nso; e mere participle ahụ ka ọ bụrụ ngwaa zuru ezu n'Igbo.
- source_word: οἱ μαθηταὶ
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị na-amụta ihe n'aka Jizọs ma na-eso ya.
- source_word: τῷ Ἰησοῦ
  choice: Jizọs
  rationale: A gbasoro usoro ide aha Jizọs nke a maara nke ọma n'Igbo; njikọ ya na 'bịakwutere' na-egosi onye ha bịakwutere.
- source_word: κατ’ ἰδίαν
  choice: na nzuzo
  rationale: Ọ na-egosi na mkparịta ụka ahụ abụghị n'ihu ọha, kama ọ bụ naanị ha na Jizọs.
- source_word: εἶπον
  choice: wee sị
  rationale: Nke a na-asụgharị ngwaa nkịtị pụtara 'kwuo'; ajụjụ sochirinụ na-eme ka o doo anya na ha jụrụ ajụjụ.
- source_word: Διὰ τί
  choice: Gịnị mere
  rationale: Nke a bụ ụzọ Igbo dị ndụ na nke nkịtị e si ajụ ihe kpatara otu ihe.
- source_word: ἡμεῖς
  choice: anyị
  rationale: Ọ na-edobe nnọchiaha a kpọpụtara ìhè n'asụsụ Gris, n'enweghị itinye nkwusi ike karịrị nke isi mmalite.
- source_word: οὐκ ἠδυνήθημεν
  choice: enweghị ike
  rationale: Ọ na-egosi enweghị ikike ime ihe ahụ n'oge ahụ, n'ụzọ doro anya ma dịkwa mfe nghọta.
- source_word: ἐκβαλεῖν
  choice: ịchụpụ
  rationale: Ọ bụ okwu Igbo kwesịrị ekwesị maka ịchụ mmụọ ọjọọ ka ọ pụọ, ma na-edobe echiche nke iwepụ ya n'ike.
- source_word: αὐτό
  choice: ya
  rationale: Nnọchiaha Igbo 'ya' anaghị ekewa nwoke, nwanyị, ma ọ bụ ihe; ya mere ọ na-edobe ohere na αὐτό nwere ike izo aka n'ahụ mmụọ ọjọọ ma ọ bụ nwata ahụ.
theological_decisions:
- issue: Ihe αὐτό na-ezo aka na ya n'akụkọ ịchụ mmụọ ọjọọ
  choice: E jiri 'ya' nke nwere ike izo aka n'ahụ mmụọ ọjọọ.
  alternative: Ọ pụkwara izo aka n'ahụ nwata ahụ.
  rationale: Ọnọdụ akụkọ ahụ na-akwado mmụọ ọjọọ dị ka ihe a chọrọ ịchụpụ, ma nnọchiaha Igbo 'ya' na-echekwa mgbagwoju anya dị n'ihe nnọchiaha ahụ nwere ike izo aka na ya kama idozi ya n'amaghị ama.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-asụ ụtọ n'Igbo, ma na-edobe usoro akụkọ, ọnọdụ nzuzo, na mgbagwoju anya nke nnọchiaha Gris.
