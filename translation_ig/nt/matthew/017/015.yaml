  to: na-asị, “Onyenwe anyị, meere nwa m nwoke ebere, n’ihi na ọ na-enwe ọdịdọ[a] ma na-ata ahụhụ nke ukwuu; n’ihi na ọ na-adaba ọtụtụ mgbe n’ọkụ, na ọtụtụ mgbe n’ime mmiri.”
  rationale: The revision replaces a pain-based expression with a clear phenomenological rendering of the seizure-like condition denoted by σεληνιάζεται. It also corrects the expression for severe suffering while preserving the Greek syntax, repetition, register, and the footnote’s lexical alternatives without endorsing an ancient lunar explanation.
