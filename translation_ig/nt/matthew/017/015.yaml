  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: ig
  text: na-asị, “Onyenwe anyị, meere nwa m nwoke ebere, n’ihi na ọ na-enwe ọdịdọ[a] ma na-ata ahụhụ nke ukwuu; n’ihi na ọ na-adaba ọtụtụ mgbe n’ọkụ, na ọtụtụ mgbe n’ime mmiri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ na-arịa akwụkwụ”; n’ụzọ nkịtị, “ọnwa na-emetụta ya.” Okwu Grik a bụ akpaala okwu oge ochie maka ọnọdụ yiri ihe ọdịdọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ okwu a na-eji akpọ Jizọs n'ụzọ nkwanye ùgwù; ‘Onyenwe anyị’ bụ nsụgharị Igbo a maara nke ọma maka κύριος n’ebe a.
- source_word: ἐλέησόν μου τὸν υἱόν
  choice: meere nwa m nwoke ebere
  rationale: Ọ na-echekwa arịrịọ siri ike maka ọmịiko na enyemaka, ma υἱός bụ kpọmkwem ‘nwa nwoke.’
- source_word: σεληνιάζεται
  choice: ahụ ụfụ na-ejide ya
  rationale: Nke a na-akọ ihe a na-ahụ anya mgbe ọrịa ahụ wakporo ya, n’etinyeghị nchọpụta ọgwụ nke oge a ma ọ bụ echiche na ọnwa bụ ihe kpatara ya.
- source_word: κακῶς πάσχει
  choice: ọ na-atakwa ahụ nke ukwuu
  rationale: Ọ na-egosi ịdị njọ nke ahụhụ ahụ n’Igbo dị mfe ma dị ebube.
- source_word: πολλάκις
  choice: ọtụtụ mgbe
  rationale: Ọ na-egosi na ihe ahụ na-eme ugboro ugboro.
- source_word: πίπτει εἰς τὸ πῦρ ... εἰς τὸ ὕδωρ
  choice: ọ na-adaba n’ọkụ ... n’ime mmiri
  rationale: Ọ na-echekwa mmegharị a kọwara na nhazi okwu abụọ yiri ibe ha.
- source_word: καὶ λέγων
  choice: na-asị
  rationale: Ọ na-echekwa njikọ participle ahụ na akụkọ dị n’amaokwu bu ụzọ n’ụzọ dabara n’Igbo.
theological_decisions:
- issue: Nkọwa nke σεληνιάζεται n’ọnọdụ ọgwụgwọ na ịchụ mmụọ ọjọọ
  choice: ahụ ụfụ na-ejide ya
  alternative: ọ na-arịa akwụkwụ; ọnwa na-egbu ya
  rationale: Nhọrọ a na-akọ mgbaàmà ahụ n’enweghị ịkpọ ya ọrịa ọgwụ nke oge a ma ọ bụ kwado echiche oge ochie na ọnwa kpatara ya. Ihe okwu Grik pụtara n’ụzọ nkịtị ka edebere n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. ‘Ahụ ụfụ na-ejide ya’ bụ okwu nkọwa nke na-ezere nchọpụta ọgwụ karịrị ihe ederede kwuru; akara ala ala peeji [a] dị n’ahịrị bụ isi.
