  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: ig
  text: Jizọs bịakwutere ha[a], metụ ha aka, sị ha, “Bilienụ[b], unu atụla egwu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “bịaruru ha nso.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Kwụọnụ ọtọ.” Iwu a na-ekwu ka ha si n'ọnọdụ ha dara n'ala bilie.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “unu atụkwala egwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθεν
  choice: bịakwutere ha
  rationale: Ngwaa a na-egosi na Jizọs bịaruru ndị na-eso ụzọ ya nso. “Bịakwutere ha” bụ Igbo nkịtị nke na-echekwa mmegharị ahụ gaa n'ebe ha nọ.
- source_word: ἁψάμενος αὐτῶν
  choice: metụ ha aka
  rationale: Nkebi a pụtara imetụ mmadụ aka. E jikọtara ya na ngwaa ndị ọzọ n'usoro ahịrịokwu ka Igbo wee daa nke ọma, na-agbakwụnyeghị na o tinyere aka ya n'ahụ ha n'ụzọ pụrụ iche.
- source_word: εἶπεν
  choice: sị ha
  rationale: N'Igbo, “sị ha” bụ ụzọ ebumpụta ụwa e si akọ na mmadụ gwara ndị ọzọ okwu; “ha” na-eme ka ndị a gwara okwu doo anya n'enweghị mgbanwe ihe okwu Grik pụtara.
- source_word: Ἐγέρθητε
  choice: Bilienụ
  rationale: Iwu a na-akpọ ha ka ha bilie n'ọnọdụ ha dara n'ala. “Bilienụ” bụ iwu e nyere ọtụtụ mmadụ, ma ọ naghị ekpebi kpọmkwem ma ha ga-eguzo ọtọ.
- source_word: μὴ φοβεῖσθε
  choice: unu atụkwala egwu
  rationale: Nke a bụ ụzọ Igbo doro anya na nke nkịtị isi kwuo ka ọtụtụ mmadụ ghara ịtụ egwu. Ọ naghị amanye nkọwa ahụ bụ “kwụsịnụ ịtụ egwu.”
- source_word: καὶ
  choice: usoro ngwaa ndị e tinyere rikọm n'etiti ha
  rationale: Igbo anaghị achọ ka e jiri “na” meegharị ugboro niile ebe Grik ji καί. Usoro “bịakwutere…, metụ…, sị…” na-echekwa njikọ na usoro omume ahụ n'ụzọ ebumpụta ụwa.
theological_decisions:
- issue: Ịsụgharị iwu nkasi obi Jizọs n'etinyeghị nkọwa okpukpe ọzọ
  choice: Bilienụ, unu atụkwala egwu.
  alternative: Bilienụ, unu atụla egwu.
  rationale: Nsụgharị a na-echekwa iwu abụọ ahụ—ịbilie na ịghara ịtụ egwu—n'ụzọ kwụ ọtọ, n'etinyeghị nkọwa banyere ihe mere ha ji kwesị inwe obi ike.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. E ji ụdị ọtụtụ mmadụ n'iwu (“Bilienụ,” “unu atụkwala”) n'ihi na Jizọs na-agwa ndị na-eso ụzọ ya okwu. A haziri njikọ καί dị ka usoro ngwaa Igbo ka ahịrịokwu ghara ịdị arọ.
