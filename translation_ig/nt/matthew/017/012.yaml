revisions:
- from: Ma ana m agwa unu na Ịlaịja abịalarị, ma ha amataghị onye ọ bụ,[a] kama ha mere ya ihe niile ha chọrọ.[b] N’otu aka ahụ kwa, Nwa nke Mmadụ na-aga ịta ahụhụ n’aka ha.[c]
  to: Ma ana m agwa unu na Ịlaịja abịalarị, ma ha amataghị onye ọ bụ,[a] kama ha mesoro ya otú ọ bụla ha chọrọ.[b] N’otu aka ahụ kwa, Nwa nke Mmadụ na-aga ịta ahụhụ n’aka ha.[c]
  rationale: The revision improves idiomatic Standard Igbo and corrects footnote alternatives that could misstate the Greek, while preserving the source text's ambiguity and its theological restraint. Footnote markers remain attached to the clauses they explain.
