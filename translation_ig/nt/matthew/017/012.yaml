id: MAT.17.12
reference: Matthew 17:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: ig
  text: Ma ana m agwa unu na Ịlaịja abịalarị, ma ha amataghị onye ọ bụ,[a] kama ha mesoro ya otú ọ bụla ha chọrọ.[b] N’otu aka ahụ kwa, Nwa nke Mmadụ na-aga ịta ahụhụ n’aka ha.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha amataghị ya” ma ọ bụ “ha aghọtaghị onye ọ bụ.” Okwu Grik ahụ nwere ike ịpụta na ha aghọtaghị ma ọ bụ mata njirimara ya nke ọma.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ha mere ya ihe ọ bụla masịrị ha.” Okwu Grik ahụ bụ akpaalaokwu na-egosi na ha mesoro ya otú ọ bụla ha chọrọ.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “ga-ata ahụhụ.” Okwu Grik ahụ na-egosi na ahụhụ ahụ na-abịanụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ma ana m agwa unu
  rationale: Ọ bụ ụzọ Igbo si ewebata okwu ozugbo n'ụzọ dị ndụ; “Ma” na-egosi ọdịiche dị n'etiti okwu a na atụmanya e kwuru tupu ya.
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: Ịlaịja abịalarị
  rationale: “Abịalarị” na-egosi na ọbịbịa ahụ emeela tupu oge okwu a, ma na ihe ọ pụtara ka dị mkpa ugbu a.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: ha amataghị onye ọ bụ
  rationale: N'ọnọdụ a, okwu Grik ahụ pụtara na ha aghọtaghị ma ọ bụ mata njirimara na ọrụ ya nke ọma, ọ bụghị naanị na ha amaghị ya dịka mmadụ.
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: ha mere ya ihe niile ha chọrọ
  rationale: Nke a bụ ntụgharị Igbo eke nke akpaalaokwu ahụ, na-egosi na ha mesoro ya dịka uche ha siri dị.
- source_word: οὕτως καὶ
  choice: N’otu aka ahụ kwa
  rationale: Ọ na-eme ka ntụnyere dị n'etiti ihe mere Ịlaịja na ihe ga-eme Nwa nke Mmadụ pụta ìhè.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: A hapụrụ aha-utu ahụ n'ụdị a maara nke ọma, ka njikọ ya na okwu Akwụkwọ Nsọ ndị ọzọ ghara ịla n'iyi.
- source_word: μέλλει πάσχειν
  choice: na-aga ịta ahụhụ
  rationale: Nke a na-egosi ahụhụ na-abịa nso ma ọ bụ nke na-echere ya, na-etinyeghị echiche siri ike karịa nke okwu Grik kwuru.
- source_word: ὑπ’ αὐτῶν
  choice: n’aka ha
  rationale: Akpaalaokwu Igbo a na-egosi nke ọma na ọ bụ ha ga-akpatara ya ahụhụ ahụ.
theological_decisions:
- issue: Onye ọbịbịa Ịlaịja na-ezo aka na ya
  choice: E debere aha “Ịlaịja” dịka amaokwu Grik si kwuo ya, n’etinyeghị Jọn Onye Na-eme Baptizim n’ime amaokwu ahụ.
  alternative: A pụrụ ịkọwa ya ozugbo dịka Jọn Onye Na-eme Baptizim.
  rationale: Amaokwu ndị gbara ya gburugburu na-eme ka onye a na-ezo aka na ya doo anya, ma amaokwu a n'onwe ya kpọrọ naanị Ịlaịja; ya mere, ntụgharị ahụ ekwesịghị itinye nkọwa ahụ n'ime isi okwu.
- issue: Ike okwu μέλλει gbasara ahụhụ Nwa nke Mmadụ
  choice: na-aga ịta ahụhụ
  alternative: ga-ata ahụhụ n’ihi na e kpebiela ya
  rationale: Okwu Grik ahụ na-egosi ihe na-abịanụ, ma n'ahịrịokwu a ọ naghị ekwu kpọmkwem na ọ bụ iwu ma ọ bụ mkpebi Chineke; a zere itinye ozizi karịrị okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro echiche nke Grik, ma e ji akpaalaokwu Igbo eke mee ka ọ ghara ịdị ka ntụgharị mkpụrụokwu n’otu n’otu. A haziri akara nkọwa ụkwụ [a], [b], [c] n'akụkụ okwu ha na-akọwa.
