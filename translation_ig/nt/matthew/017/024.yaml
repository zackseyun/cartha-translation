id: MAT.17.24
reference: Matthew 17:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: ig
  text: Mgbe ha rutere Kapanọm, ndị na-anakọta ụtụ drakma abụọ[b] bịakwutere Pita wee sị ya, “Onye ozizi unu ọ naghị akwụ ụtụ drakma abụọ[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, “drakma abụọ”; ya bụ, ụtụ ụlọ nsọ nke ruru drakma abụọ.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “ndị na-anakọta ụtụ didrakma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: Mgbe ha rutere
  rationale: Nkebiokwu genitive absolute a na-egosi oge. “Mgbe ha rutere” bụ Igbo dị mfe ma na-edobe ihe temporal ahụ; a naghị asụgharị δέ iche n’ihi na mgbanwe nkebiokwu ahụ egosila ya nke ọma.
- source_word: Καφαρναοὺμ
  choice: Kapanọm
  rationale: A họọrọ ụdị aha obodo a a na-ejikarị na nsụgharị Baịbụl Igbo.
- source_word: προσῆλθον
  choice: bịakwutere
  rationale: Okwu a pụtara ịbịaru mmadụ nso ma ọ bụ ịbịakwute ya; “bịakwutere” bụ okwu Igbo doro anya ma kwekọọ n’ebe a.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: ndị na-anakọta ụtụ drakma abụọ
  rationale: Nkebiokwu participle ahụ na-akọwa ndị ahụ site n’ọrụ ha. “Na-anakọta” na-egosipụta λαμβάνοντες n’ọnọdụ ịnakọta ụtụ, ebe “ụtụ drakma abụọ” na-eme ka ihe a na-akwụ doo onye na-agụ anya.
- source_word: δίδραχμα
  choice: ụtụ drakma abụọ
  rationale: δίδραχμα bụ ụgwọ ruru drakma abụọ n’ọnọdụ a. Ịkpọ ya “ụtụ” na-eme ka ọrụ ego ahụ pụta ìhè, ma “drakma abụọ” na-edobe ọnụ ahịa Grik ahụ.
- source_word: τῷ Πέτρῳ
  choice: Pita
  rationale: A na-asụgharị aha Πέτρος n’ụdị Igbo a maara nke ọma, “Pita”; ngwaa “bịakwutere” na-egosi mmekọrịta dative ahụ n’enweghị preposition ọzọ.
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: Onye ozizi unu
  rationale: διδάσκαλος pụtara onye na-akụzi ihe. “Onye ozizi” bụ okwu Igbo kwụ ọtọ ma na-edobe aha ọrụ ahụ karịa okwu nwere ike ịpụta nna ukwu.
- source_word: οὐ τελεῖ
  choice: ọ naghị akwụ
  rationale: N’ọnọdụ ụtụ, τελέω pụtara ịkwụ ụgwọ a chọrọ. A hapụrụ ajụjụ ahụ n’ụdị na-adịghị mma dịka Grik si dị, n’agbanyeghị na ọ pụrụ ịdị ka ọ na-atụ anya azịza nkwenye.
theological_decisions:
- issue: Ịkọwa δίδραχμα dịka ụtụ kama naanị mkpụrụ ego
  choice: ụtụ drakma abụọ
  alternative: mkpụrụ ego drakma abụọ; didrakma
  rationale: Ihe a na-ajụ bụ ma Jizọs ọ na-akwụ ụgwọ a chọrọ, ọ bụghị nanị ma ọ na-enye ma ọ bụ na-eji mkpụrụ ego. “Ụtụ” na-eme ka nghọta okwu ahụ n’ọnọdụ a doo anya n’enweghị itinye nkọwa ụka pụrụ iche.
- issue: Ụdị ajụjụ οὐ τελεῖ
  choice: Onye ozizi unu ọ naghị akwụ…?
  alternative: Onye ozizi unu ọ na-akwụ…?
  rationale: Ajụjụ Grik nwere οὐ ma eleghị anya na-atụ anya azịza ee. A na-edobe ụdị ajụjụ na-adịghị mma ka ihe okwu mbụ na-egosi ghara ịla n’iyi ma ọ bụ ka e kpebie ike pragmatic ya karịa ihe ederede kwuru.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke oge a ma dị nsọ n’ụda ya. Ahịrịokwu ahụ dị mfe nghọta nye ndị nkịtị, ebe e debere ụdị ajụjụ na-adịghị mma na nkọwa ego nke asụsụ Grik. E tinyere akara nkọwa ala peeji [a] na [b] n’ebe okwu ha na-akọwa dị.
