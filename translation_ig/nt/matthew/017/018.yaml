id: MAT.17.18
reference: Matthew 17:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: ig
  text: Jizọs wee baara ya mba, mmụọ ọjọọ ahụ wee si n’ime ya pụta; a gwọkwara nwata ahụ site n’oge ahụ gaa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a gwọkwara nwata ahụ malite n’oge ahụ.”
    reason: Nkebiokwu Grik a pụtara “site n’oge ahụ” ma ọ bụ “malite n’oge ahụ”; ọ naghị ekwupụta n’onwe ya na ọgwụgwọ ahụ mere n’otu ntabi anya.
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: baara ... mba
  rationale: Nkebi okwu a bụ ụzọ Igbo nkịtị ma dịkwa ugwu si ekwupụta ịbara mmadụ ma ọ bụ mmụọ mba n’ike; ọ na-echekwa echiche nke okwu ikike Jizọs kwuru n’etinyeghị kpọmkwem okwu iwu na-adịghị n’amaokwu ahụ.
- source_word: αὐτῷ
  choice: ya
  rationale: “Ya” na-echekwa nnọchiaha dị n’asụsụ Grik ma ghara ịkọwa ya karịa ihe ederede kwuru. Ihe na-esote na-egosi n’ụzọ siri ike na onye Jizọs baara mba bụ mmụọ ọjọọ ahụ, ma ụdị Igbo a ka na-ahapụ usoro nnọchiaha nke isi mmalite ka ọ dị.
- source_word: τὸ δαιμόνιον
  choice: mmụọ ọjọọ ahụ
  rationale: N’Igbo nke oge a, “mmụọ ọjọọ” bụ okwu doro anya ma bụrụ nke ndị mmadụ na-aghọta maka δαιμόνιον; “ahụ” na-egosipụta aha a kapịrị ọnụ dị n’asụsụ Grik.
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: si n’ime ya pụta
  rationale: Nke a na-egosipụta mmegharị nke isi n’ime nwata ahụ pụta n’ụzọ doro anya ma kwekọọ n’okwu ịchụ mmụọ ọjọọ.
- source_word: ἐθεραπεύθη
  choice: a gwọkwara
  rationale: Ụdị a na-echekwa olu nnara nke ngwaa Grik ma na-ekwupụta ọgwụgwọ ahụ n’Igbo dị mfe ma bụrụ eke.
- source_word: ὁ παῖς
  choice: nwata ahụ
  rationale: N’agbanyeghị na παῖς nwere ike ịpụta nwata ma ọ bụ ohu, gburugburu akụkọ a na-ekwu maka nwa nwoke nke nna ya kpọtara; “nwata ahụ” bụ okwu eke nke na-ezere nghọta na-ekwesịghị ekwesị nke “ohu.”
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: site n’oge ahụ gaa
  rationale: Nke a na-echekwa echiche nke ọgwụgwọ malitere n’oge ahụ ma nọgidekwa, ebe ọ ka bụ Igbo a na-asụ nke ọma. Ihe odide ala ala na-enye ntụgharị nke na-ewere ὥρα dị ka otu ntabi anya.
theological_decisions:
- issue: Onye αὐτῷ na-ezo aka mgbe Jizọs baara ya mba
  choice: E ji “ya” chekwaa nnọchiaha ahụ, ebe okwu na-esote na-eme ka mmụọ ọjọọ bụrụ onye a na-aghọta na a baara mba.
  alternative: Ịkọwa ya hoo haa dị ka “mmụọ ọjọọ ahụ,” ma ọ bụ ịghọta ya dị ka nwata ahụ.
  rationale: Okwu na-esote, nke kwuru na mmụọ ọjọọ ahụ siri n’ime nwata ahụ pụta, na-akwado nke ukwuu na ọ bụ mmụọ ọjọọ ka a baara mba. Ma “ya” na-echekwa ọdịdị na ntakịrị nghọta abụọ nke asụsụ Grik n’etinyeghị nkọwa agbakwunyere n’ahịrị isi.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị mfe ma dị ugwu. Usoro “wee ... wee” na-eme ka njikọ akụkọ nke καὶ ... καὶ doo anya n’ụzọ Igbo dị eke. Akara [a] dị n’ahịrị isi n’ebe okwu oge ahụ metụtara, ọ bụghị n’ebe nnọchiaha mbụ dị.
