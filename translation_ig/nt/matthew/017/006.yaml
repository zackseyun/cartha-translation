  verdict: revise
  source_fidelity: The draft accurately conveys the temporal hearing, the disciples’ prostration, and their intense fear. However, “ndị na-eso ụzọ ya” adds an explicit possessive absent from the Greek, and “egwu wee jide ha” is a legitimate idiom but slightly less direct than the source’s statement that they feared. The revision retains the contextual object “ya” (‘it,’ the voice) as in the English audit trail while avoiding the added possessive.
  naturalness: “Dara kpue ihu n’ala” is a natural, clear Standard Igbo expression for falling face down. “Ha wee tụọ egwu nke ukwuu” is idiomatic modern Igbo and directly expresses the intensified fear.
  terminology: “Ndị na-eso ụzọ” is the established Gospel rendering for μαθηταί. The wording does not label the posture as worship or assign a theological interpretation.
  issues:
  - severity: low
    issue: The possessive “ya” in “ndị na-eso ụzọ ya” is not explicit in the Greek.
    rationale: The context identifies these as Jesus’ disciples, but the Greek simply says “the disciples.” Omitting the possessive better preserves the source wording.
  - severity: medium
    issue: Footnote a gives “ebe ha nụrụ” as a formal alternative for the participle.
    rationale: “Ebe” normally denotes place in Standard Igbo and is not an appropriate rendering here. “Mgbe ha nụchara” naturally represents a more completed/antecedent participial sense.
  - severity: low
    issue: The draft’s fear clause is more idiomatic than literal.
    rationale: “Egwu jidere ha” is acceptable, but “ha tụrụ egwu nke ukwuu” more directly reflects ἐφοβήθησαν σφόδρα without changing the nuance.
  revised_text: Mgbe ndị na-eso ụzọ ahụ nụrụ ya[a], ha dara kpue ihu n’ala[b], ha wee tụọ egwu nke ukwuu[c].
