  text: καὶ ἀκούσαντες οἱ μαθηταὶ ἔπεσαν ἐπὶ πρόσωπον αὐτῶν καὶ ἐφοβήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/006.yaml
  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
translation:
  language: ig
  text: Mgbe ndị na-eso ụzọ ahụ nụrụ ya[a], ha dara kpue ihu n’ala[b], ha wee tụọ egwu nke ukwuu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Mgbe ha nụchara.” Grik ji participle aorist mee ihe; a pụrụ ịsụgharị ya dịka nkebiokwu oge, “mgbe ha nụrụ,” ma ọ bụ n’ụzọ na-egosi ihe e mechara, “mgbe ha nụchara.” “Ya” na-ezo aka n’olu ahụ dị n’amaokwu bu ụzọ.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ mkpụrụokwu si dị, ha “dara n’ihu ha.” Nke a bụ akpaalaokwu na-egosi na ha dara n’ala ihu ha chere ala.
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, ha tụrụ oke egwu; “nke ukwuu” sụgharịrị adverb Grik σφόδρα.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Mgbe ... nụrụ nke a
  rationale: Aorist participle a gbanwere ka ọ bụrụ nkebiokwu oge, nke na-ada nke ọma n’Igbo. “Nke a” na-ezo aka n’olu ha nụrụ n’amaokwu bu ụzọ, ma ọ naghị agbakwụnye nkọwa ọzọ.
- source_word: οἱ μαθηταὶ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa μαθηταί n’Oziọma; “ya” na-eme ka o doo anya na ha bụ ndị na-eso ụzọ Jizọs dịka ihe gbara amaokwu ahụ gburugburu si dị.
- source_word: ἔπεσαν ἐπὶ πρόσωπον αὐτῶν
  choice: ha dara n’ala kpuo ihu
  rationale: Nkebiokwu a na-egosi na ha dara n’ala, ihu ha chere ala. Ọ bụ ụzọ Igbo dị ndụ isi kọwaa ọnọdụ ahụ n’enweghị ịgbakwụnye na ha kpachaara anya fee ofufe.
- source_word: ἐφοβήθησαν
  choice: egwu wee jide ha
  rationale: Nke a bụ ụzọ Igbo nkịtị ma dịkwa ugwu isi kwuo na ha tụrụ egwu, na-enweghị ịkọwa ụdị egwu ahụ n’ụzọ karịrị ihe Grik kwuru.
- source_word: σφόδρα
  choice: nke ukwuu
  rationale: Ọ na-egosi ike dị ukwuu nke egwu ahụ ma kwekọọ na ọrụ adverb σφόδρα.
theological_decisions:
- issue: Ụdị mmeghachi omume ndị na-eso ụzọ gosiri mgbe ha nụrụ olu Chineke
  choice: E gosiri na ha dara n’ala kpuo ihu, egwu wee jide ha nke ukwuu, n’enweghị ịkpọ omume ahụ ofufe ma ọ bụ ụjọ nkịtị naanị.
  alternative: A pụrụ ịkọwa ya dịka ofufe jupụtara n’egwu nsọ, ma ọ bụ dịka oke ụjọ n’ihu ngosipụta Chineke.
  rationale: Grik kwuru ọnọdụ ahụ ha tinyere ahụ ha na oke egwu ha, ma ọ kọwaghị kpọmkwem ma ọ bụ ofufe, ụjọ, ma ọ bụ egwu nsọ. Nsụgharị ahụ hapụrụ esemokwu nkọwa a ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. “Dara n’ala kpuo ihu” na-enye ọnọdụ ahụ n’ụzọ Igbo nkịtị; a zere okwu ga-ekpebi na mmeghachi omume ahụ bụ ofufe ma ọ bụ ụjọ nkịtị naanị.
