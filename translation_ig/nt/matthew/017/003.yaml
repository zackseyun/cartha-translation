id: MAT.17.3
reference: Matthew 17:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας ⸂συλλαλοῦντες μετ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: ig
  text: Ma lee, Mosis na Ịlaịja pụtara ìhè n’ihu ha[a], ha na ya na-ekwurịta okwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha hụrụ Mosis na Ịlaịja.” Ngwaa Grik ahụ dị n’ụdị passive.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: Na-adọta uche onye na-agụ ma na-egosi na ihe a mere na mberede, n’ụzọ doro anya ma dịkwa mfe nghọta n’Igbo nke oge a.
- source_word: ὤφθη
  choice: pụtara ìhè
  rationale: Na-enye echiche nke mmadụ ịpụta ka a hụ ya; ọ bụ nsụgharị Igbo ebumpụta ụwa nke passive a, na-enweghị ịkọwa otú mpụta ahụ siri mee.
- source_word: αὐτοῖς
  choice: n’ihu ha
  rationale: Na-egosi na ndị ahụ bụ ndị hụrụ mpụta ahụ; ọ na-arụ ọrụ ebumpụta ụwa n’Igbo, ebe ‘ha hụrụ ha’ ga-agbanwe usoro okwu ahụ.
- source_word: Μωϋσῆς
  choice: Mosis
  rationale: Aha a na-ejikarị eme ihe n’Igbo maka Mosis.
- source_word: Ἠλίας
  choice: Ịlaịja
  rationale: Nsụgharị aha nke dabara n’ụda Igbo ma bụrụkwa nke a na-aghọta nke ọma.
- source_word: συλλαλοῦντες
  choice: na-ekwurịta okwu
  rationale: Na-echekwa echiche nke mmadụ na ibe ya na-ekwu okwu, ọ bụghị naanị otu onye na-ekwu.
- source_word: μετ’ αὐτοῦ
  choice: ha na ya
  rationale: Na-egosi mkpakọrịta dị na μετά na genitive; nnọchiaha ‘ya’ na-echekwa usoro Grik, ebe ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Jizọs.
theological_decisions:
- issue: Onye αὐτοῦ na-ezo aka na ya
  choice: E debere ya dịka nnọchiaha ‘ya,’ nke na-ezo aka na Jizọs n’ihe gbara amaokwu ahụ gburugburu.
  alternative: Itinye aha ‘Jizọs’ kpọmkwem.
  rationale: Nke a na-echekwa nnọchiaha dị na Grik, ma ihe gbara amaokwu ahụ gburugburu na-eme ka onye a na-ekwu maka ya doo anya.
- issue: Ụdị mpụta Mosis na Ịlaịja
  choice: ‘pụtara ìhè n’ihu ha’
  alternative: ‘ha hụrụ Mosis na Ịlaịja’
  rationale: Nsụgharị ahụ na-ekwupụta na ha pụtara ka a hụ ha, ma ọ naghị etinye nkọwa ozizi banyere ụdị ma ọ bụ ụzọ ọnụnọ ha.
translation_notes:
  register: Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. ‘Ma lee’ na-echekwa ọrụ ἰδοὺ nke ịdọta uche; ‘na-ekwurịta okwu’ na-egosi mkparịta ụka nke mmadụ na ibe ya.
