    text: Ma ọ bụ, “mee ka ha sụọ ngọngọ” ma ọ bụ “nye ha ihe mgbakasị.”
    reason: lexical_alternative
  - marker: b
    text: Steta bụ mkpụrụ ego nke ọnụ ahịa ya ruru drakma anọ, nke zuru ịkwụ ụtụ ụlọ nsọ maka mmadụ abụọ.
    reason: cultural_note
