- from: Ma ka anyị ghara ime ka ha were iwe[a], gaa nʼosimiri, tụnye nko, jide azụ mbụ nke ga-arịgo. Mgbe ị meghere ọnụ ya, ị ga-ahụ otu mkpụrụ ego steta[b]. Were ya nye ha maka mụ na gị.
  to: Ma ka anyị ghara ịkpasu ha iwe[a], gaa n’oke osimiri, tụnye nko, wepụta azụ mbụ ga-apụta. Mgbe ị meghere ọnụ ya, ị ga-ahụ otu mkpụrụ ego steta[b]. Were ya nye ha maka mụ na gị.
  rationale: The revision corrects the body-of-water term to “oké osimiri,” makes the fish-taking command more faithful to ἆρον, and regularizes the temple-tax wording in the explanatory note. It retains the source’s ambiguity and pragmatic sense regarding σκανδαλίσωμεν, preserves “steta,” and keeps the existing footnote anchors aligned with their respective terms.
