id: MAT.17.27
reference: Matthew 17:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: ig
  text: Ma ka anyị ghara ịkpasu ha iwe[a], gaa n’oke osimiri, tụnye nko, wepụta azụ mbụ ga-apụta. Mgbe ị meghere ọnụ ya, ị ga-ahụ otu mkpụrụ ego steta[b]. Were ya nye ha maka mụ na gị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mee ka ha sụọ ngọngọ” ma ọ bụ “nye ha ihe mgbakasị.”
    reason: lexical_alternative
  - marker: b
    text: Steta bụ mkpụrụ ego nke ọnụ ahịa ya ruru drakma anọ, nke zuru ịkwụ ụtụ ụlọ nsọ maka mmadụ abụọ.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: ime ka ha were iwe
  rationale: Nʼọnọdụ a, okwu ahụ pụtara izere ime ihe ga-akpasu ndị na-anakọta ụtụ iwe ma ọ bụ nye ha ihe mgbakasị; ọ bụghị isi nʼụzọ omume mee ka ha daba ná mmehie.
- source_word: θάλασσαν
  choice: osimiri
  rationale: NʼIgbo a na-ejikarị “osimiri” akọwa nnukwu mmiri, gụnyere Oké Osimiri Galili; nke a na-edobe echiche okwu Grik ahụ nʼasụsụ nkịtị.
- source_word: ἄγκιστρον
  choice: nko
  rationale: “Nko” bụ okwu Igbo doro anya maka ihe e ji akụ azụ, ọnọdụ ahụ na-emekwa ka ihe ọ pụtara pụta ìhè.
- source_word: ἀναβάντα πρῶτον ἰχθὺν
  choice: azụ mbụ nke ga-arịgo
  rationale: Nke a na-edobe usoro na ihe omume dị nʼokwu Grik nʼụzọ Igbo dị mfe nghọta.
- source_word: ἆρον
  choice: jide
  rationale: Nʼusoro iwu ndị a, “jide” na-egosi iwere azụ ahụ e ji nko gbutere nʼụzọ nkịtị.
- source_word: στατῆρα
  choice: otu mkpụrụ ego steta
  rationale: A hapụrụ aha mkpụrụ ego ahụ dị ka ọ dị nʼasụsụ mbụ, tinyekwa nkọwa uru ya nʼala peeji.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: maka mụ na gị
  rationale: Nke a na-egosi na mkpụrụ ego ahụ ga-akwụ ụtụ nke mmadụ abụọ ahụ, nʼagbanyeghị na ἀντί nwekwara echiche ịnọchi anya.
- source_word: πορευθεὶς
  choice: gaa
  rationale: Ọ bụ ụzọ Igbo dị nkenke na nke nkịtị isi nye iwu nke omume ndị ọzọ ga-esochi.
- source_word: δὸς αὐτοῖς
  choice: nye ha
  rationale: Ihe a ga-enye bụ mkpụrụ ego ahụ a kpọtụrụ aha ozugbo tupu ya; ọnọdụ ahụ na-egosi na ọ bụ ịkwụ ụtụ.
theological_decisions:
- issue: Ihe σκανδαλίζω pụtara gbasara ịkwụ ụtụ ụlọnsọ ukwu
  choice: Jizọs nyere iwu ka a kwụọ ụtụ ahụ iji zere ịkpasu ndị na-anakọta ya iwe nʼenweghị mkpa.
  alternative: Jizọs kwụrụ ya nʼihi na iwu ji ya nʼụzọ zuru oke.
  rationale: Amaokwu ndị bu ụzọ kwuru na ụmụ nweere onwe ha, ebe amaokwu a na-egosi nkwekọrịta e mere iji ghara ịkpasu iwe. Nsụgharị ahụ na-edobe esemokwu echiche a kama idozi ya nʼụzọ ozizi otu ụka.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere aha mkpụrụ ego “steta” ma kọwaa ya nʼala peeji; a zere okwu ụka pụrụ iche. E doziri ntụgharị akara ala peeji ndị dị na English consultation layer ka akara [a] soro σκανδαλίζω, [b] soro steta, dịka ọdịnaya ha si dị.
