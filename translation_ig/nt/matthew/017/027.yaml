review_pass:
  verdict: revise
  source_fidelity: The draft follows the Greek sequence and all principal elements well. However, “osimiri” ordinarily means “river” in Standard Igbo, whereas θάλασσαν is explicitly “sea”; “oké osimiri” preserves the source wording. The imperative ἆρον is better represented by “wepụta” than “jide,” since the fish is to be taken up after it comes up.
  naturalness: The revision uses natural contemporary Standard Igbo. “Ka anyị ghara ịkpasu ha iwe” communicates the contextual pragmatic sense of σκανδαλίσωμεν without suggesting that the collectors necessarily commit moral sin. “azụ mbụ ga-apụta” and “wepụta” give a smoother imperative sequence.
  terminology: “Steta” appropriately retains the named ancient coin, with a cultural footnote. “Ụtụ ụlọ nsọ” is the normal transparent term; “ụlọ nsọ ukwu” is unnecessary and potentially shifts the reference toward a particular institutional description.
  issues:
  - severity: medium
    issue: “osimiri” is used for θάλασσαν.
    rationale: In Standard Igbo, “osimiri” normally denotes a river. The Greek says “sea,” even though the referent is the Sea of Galilee; “oké osimiri” preserves this lexical distinction.
  - severity: low
    issue: “jide” for ἆρον.
    rationale: “Jide” primarily means catch/hold, while ἆρον directs Peter to take up the first fish once it has come up. “Wepụta” better retains the action and sequence.
  - severity: low
    issue: Footnote b says “ụlọnsọ ukwu.”
    rationale: “Ụtụ ụlọ nsọ” is clearer and more idiomatic, and avoids adding “ukwu,” which is not present in the verse or needed for the note.
  revised_text: Ma ka anyị ghara ịkpasu ha iwe[a], gaa n’oke osimiri, tụnye nko, wepụta azụ mbụ ga-apụta. Mgbe ị meghere ọnụ ya, ị ga-ahụ otu mkpụrụ ego steta[b]. Were ya nye ha maka mụ na gị.
  revised_footnotes:
