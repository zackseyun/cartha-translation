- from: Mgbe ọ zara[a], “Ọ bụ n’aka ndị na-abụghị ndị ezinụlọ ha,” Jizọs sịrị ya, “Ya mere, a naghị atụ ndị ikom bụ ụmụ eze ụtụ[b][c].”
  to: Mgbe ọ sịrị[a], “Site n'aka ndị ọzọ,” Jizọs sịrị ya, “Ya mere, ụmụ nwoke nwere onwe ha[b][c].”
  rationale: 'The source-level wording is restored: the response is introduced simply as speech, the outsiders are rendered without an unnecessary ethnic sense, and Jesus'' conclusion remains “the sons are free.” The tax implication and household contrast are retained in footnotes rather than substituted for or expanded beyond the verse''s wording.'
