review_pass:
  verdict: revise
  source_fidelity: The draft correctly recognizes the tax-context implication of ἐλεύθεροι, but its main text replaces the source expression “the sons are free” with the narrower passive statement that they are not taxed. It also expands οἱ υἱοί (“the sons”) into “the male sons of kings,” adding “kings” to this verse's wording. The revision retains the source's direct conclusion and lets the context explain the implication.
  naturalness: The revised wording is standard, clear Igbo. “Mgbe ọ sịrị” naturally renders the temporal genitive absolute without asserting more than the Greek says, and “Site n'aka ndị ọzọ” is a concise idiomatic rendering in the tax-collection setting.
  terminology: “Ndị ọzọ” is supported by a footnote explaining that ἀλλοτρίων denotes those outside the ruler's household, not necessarily ethnic foreigners. “Ụmụ nwoke” preserves the masculine “sons” without adding “kings”; the footnote records the less gender-specific alternative “ụmụ.” “Nwere onwe ha” maintains the lexical breadth of ἐλεύθεροι, while its tax-exemption sense is explained in the note.
  issues:
  - severity: medium
    issue: The main text narrows ἐλεύθεροι to tax exemption.
    rationale: “A naghị atụ ... ụtụ” states the contextual consequence but does not translate the Greek predicate “are free.” The source wording should be retained in the main text, with exemption explained in a note.
  - severity: medium
    issue: The main text adds “eze” (kings) to οἱ υἱοί.
    rationale: The preceding context supplies the analogy of kings, but this verse itself says only “the sons.” Rendering it as “ụmụ nwoke” preserves the stated masculine plural without importing an additional noun.
  - severity: low
    issue: “Mgbe ọ zara” is more specific than εἰπόντος.
    rationale: Peter's words are indeed an answer in the narrative, but the Greek participle says “when he said.” The revised wording preserves that wording while the note may identify the contextual response.
  revised_text: Mgbe ọ sịrị[a], “Site n'aka ndị ọzọ,” Jizọs sịrị ya, “Ya mere, ụmụ nwoke nwere onwe ha[b][c].”
