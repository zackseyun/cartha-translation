id: MAT.17.26
reference: Matthew 17:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: ig
  text: Mgbe ọ sịrị[a], “Site n'aka ndị ọzọ,” Jizọs sịrị ya, “Ya mere, ụmụ nwoke nwere onwe ha[b][c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Mgbe ọ zara.” N’ọnọdụ a, okwu ahụ bụ azịza Pita nyere.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ihe e kwuru n’ụzọ nkịtị bụ, “nwere onwe ha”; n’ọnọdụ a, ọ pụtara na a gụpụụrụ ha n’ụtụ.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “ụmụ.” Ma okwu Grik ahụ kpọmkwem bụ “ụmụ nwoke,” ya bụ, ụmụ ndị ikom.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: Mgbe ọ zara
  rationale: N’ọnọdụ mkparịta ụka a, participle ahụ na-ezo aka n’azịza Pita nyere ajụjụ Jizọs; ‘mgbe ọ zara’ bụ Igbo nkịtị ma na-edobe echiche oge dị na genitive absolute.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: Ọ bụ n’aka ndị na-abụghị ndị ezinụlọ ha
  rationale: ἀλλότριοι bụ ndị na-abụghị ndị ụlọ eze, n’adịghị ka ụmụ eze. Nsụgharị a na-egosipụta ọdịiche nke mmekọrịta ahụ n’enweghị ime ka okwu ahụ bụrụ gbasara agbụrụ ma ọ bụ mba ọzọ.
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jizọs sịrị ya
  rationale: Nke a bụ ụzọ dị mfe, nke e ji akọọ akụkọ n’Igbo, maka φημί na onye a gwara okwu.
- source_word: Ἄρα γε
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu Jizọs wepụtara n’azịza Pita.
- source_word: ἐλεύθεροί
  choice: a naghị atụ ... ụtụ
  rationale: N’ebe a, ‘ndị nweere onwe ha’ pụtara kpọmkwem na ụtụ ahụ anaghị adịkwasị ha. Ikwupụta ya otú a bụ Igbo doro anya, ebe ihe odide ala peeji na-echekwa nsụgharị nkịtị ‘nwere onwe ha.’
- source_word: οἱ υἱοί
  choice: ndị ikom bụ ụmụ eze
  rationale: υἱοί pụtara ụmụ nwoke, ihe atụ a na-ekwukwa banyere ụmụ eze n’ezinụlọ onye ọchịchị. ‘Ndị ikom bụ ụmụ eze’ na-ezere mgbagwoju anya nke okwu Igbo ‘ụmụ’ naanị ya ma na-edobe kpọmkwem okike okwu Grik.
theological_decisions:
- issue: Otu e si asụgharị οἱ υἱοί n’ihe atụ banyere ndị nke ụlọ eze
  choice: ndị ikom bụ ụmụ eze
  alternative: ụmụ / ụmụaka
  rationale: Ihe odide Grik kwuru kpọmkwem ụmụ nwoke, ihe atụ ahụ bụkwa nke eze na ụmụ ya ndị ikom. A naghị eme ya ka ọ bụrụ okwu na-anọpụ iche n’ihe gbasara okike, ma a naghịkwa agbasa ya karịa ihe odide ahụ.
- issue: Ichekwa obosara nke ἐλεύθεροί n’agbanyeghị ọnọdụ ụtụ
  choice: Isi okwu na-eme ka nhapụ n’ụtụ doo anya, ebe ihe odide ala peeji na-enye ‘nwere onwe ha’
  alternative: Ya mere, ndị ikom bụ ụmụ eze nwere onwe ha
  rationale: ‘Nwere onwe ha’ bụ nsụgharị ka nkịtị ma nwee ike ibu echiche sara mbara; ma n’Igbo, ọ nwere ike ghara ime ka njikọ ya na ụtụ doo anya. Ihe odide ala peeji na-echekwa okwu nkịtị na nghọta sara mbara ya.
translation_notes:
  register: Standard Igbo, n’ụdị asụsụ dị ugwu ma dị mfe nghọta. E jiri ‘ndị na-abụghị ndị ezinụlọ ha’ gosipụta ọdịiche dị n’etiti ndị nọ n’èzí ụlọ eze na ụmụ eze, kama iji okwu nwere ike ịpụta ndị mba ọzọ. E tinyere akara ihe odide ala peeji niile n’ahịrịokwu isi.
