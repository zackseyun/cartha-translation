    issue: Predicative expression for ξένον
    rationale: “Ka ị bụ onye ọbịa” is understandable but may imply that the person was a guest. “Dịka onye ọbịa” more directly and naturally renders “as a stranger.”
  - severity: medium
    issue: Footnote a contains an unnatural/unclear description
    rationale: “Onye si n'èzí otu mmadụ” is not idiomatic Standard Igbo and does not clearly communicate “outside one’s circle.” It should be recast without changing the lexical point.
