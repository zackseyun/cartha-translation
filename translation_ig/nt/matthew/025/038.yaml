  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: ig
  text: Oleekwa mgbe anyị hụrụ gị dịka onye ọbịa[a], anyị wee nabata gị n'ụlọ[b], ma ọ bụ mgbe ị gba ọtọ[c], anyị wee yiwe gị uwe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye mba ọzọ.” Okwu Grik ahụ nwere ike izo aka n'onye a na-amaghị ma ọ bụ onye na-anọghị n'òtù mmadụ; n'ebe a, ọ na-ekwu maka onye chọrọ nnabata ọbịa.
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “kpọbata” ma ọ bụ “chịkọta n'ime”; n'ebe a ọ pụtara ịnabata mmadụ ma nye ya ebe obibi.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “enweghị uwe zuru ezu.” Okwu Grik ahụ nwere ike ịpụta ịgba ọtọ kpamkpam ma ọ bụ enweghị uwe kwesịrị ekwesị.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: oleekwa mgbe
  rationale: Ajụjụ a na-achọ oge ihe ahụ mere; ‘oleekwa mgbe’ na-ejikọkwa ya nke ọma na ajụjụ ndị bu ya ụzọ.
- source_word: δέ
  choice: -kwa
  rationale: N'ebe a δέ bụ njikọ dị nro n'usoro ajụjụ; mgbakwunye ‘-kwa’ na Igbo na-egosi njikọ ahụ n'ụzọ ebumpụta ụwa.
- source_word: ξένον
  choice: onye ọbịa
  rationale: N'ọnọdụ a, okwu ahụ na-ezo aka n'onye na-abụghị onye a maara nke chọrọ nnabata na ebe obibi; ‘onye ọbịa’ bụ okwu Igbo doro anya ma ghara ịgbakwunye echiche agbụrụ ma ọ bụ mba.
- source_word: συνηγάγομεν
  choice: anyị wee nabata gị n'ụlọ
  rationale: Ọ bụ ezie na ihe okwu ahụ pụtara n'ụzọ nkịtị bụ ịchịkọta ma ọ bụ ịkpọbata, n'ọnọdụ a ọ pụtara ile ọbịa nke ọma site n'ịnabata onye ahụ n'ụlọ.
- source_word: γυμνὸν
  choice: ị gba ọtọ
  rationale: Okwu Grik ahụ nwere ike ịpụta ịgba ọtọ kpamkpam ma ọ bụ enweghị uwe zuru ezu; ederede bụ isi na-edowe ihe ọ pụtara n'ụzọ kwụ ọtọ, ebe nkọwa ala peeji na-egosi ohere nke abụọ.
- source_word: περιεβάλομεν
  choice: anyị wee yiwe gị uwe
  rationale: N'ebe a okwu ahụ pụtara iyikwasị mmadụ uwe; nkọwa Igbo a bụ nke doro anya ma bụrụkwa nke ndị mmadụ na-asụ ugbu a.
theological_decisions:
- issue: Ihe ξένος pụtara n'ilu banyere ikpe na ọrụ ebere
  choice: onye ọbịa
  alternative: onye mba ọzọ
  rationale: ‘Onye ọbịa’ na-edowe isi echiche nke onye a na-amaghị ma ọ bụ onye chọrọ ka a nabata ya, n'etinyeghị echiche agbụrụ ma ọ bụ mba nke ihe odide Grik na-akọwaghị kpọmkwem.
- issue: Oke ihe γυμνός pụtara
  choice: ị gba ọtọ
  alternative: enweghị uwe zuru ezu
  rationale: A hapụrụ nkọwa bụ isi nke okwu ahụ n'ederede, ma e debere ohere o nwere ịpụta enweghị uwe zuru ezu na nkọwa ala peeji ka a ghara idozi nghọta ahụ n'otu ụzọ naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. A họọrọ ‘nabata gị n'ụlọ’ iji mee ka echiche ile ọbịa pụta ìhè, ebe e jiri nkọwa ala peeji chekwaa nkọwa nkịtị na nghọta ndị ọzọ okwu Grik nwere ike inwe.
