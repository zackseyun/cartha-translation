  verdict: revise
  source_fidelity: The draft accurately conveys the two coordinated questions and the hospitality and clothing actions. However, “anyị hụrụ gị ka ị bụ onye ọbịa” can suggest seeing someone in the role of a guest; “dịka onye ọbịa” more directly expresses the predicative “as a stranger.” The rendering of γυμνός and περιεβάλομεν is sound.
  naturalness: The revision uses idiomatic, modern Standard Igbo. “Hụrụ gị dịka onye ọbịa” is smoother and more precise in this construction. Retaining “mgbe ị gba ọtọ” is a natural way to express the condition in the second question.
  terminology: “Onye ọbịa” appropriately conveys ξένος here without unnecessarily restricting it to nationality. “Nabata gị n'ụlọ” appropriately communicates hospitable reception. The footnote on ξένος is adjusted to avoid the unnatural phrase “onye si n'èzí otu mmadụ” and to distinguish the lexical range from the contextual sense.
  issues:
