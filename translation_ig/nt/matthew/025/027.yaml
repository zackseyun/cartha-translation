  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: ig
  text: N’ihi ya, i kwesịrị itinye ego m n’aka ndị na-ahụ maka ego; mgbe m lọtara, m gaara enwetaghachi ego nke m na ọmụrụ nwa ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “itinye ọlaọcha m n’aka ndị na-ahụ maka ego.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: i kwesịrị
  rationale: Oge gara aga nke ngwaa a na-egosi ihe e kwesịrị ime n’oge ahụ; n’usoro ahịrịokwu Igbo a, ọnọdụ megidere ihe mere eme nke dị na ‘m gaara’ na-eme ka nkọcha ahụ doo anya.
- source_word: οὖν
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’ebubo e kwuru tupu ya, n’Igbo dị mfe ma kwanyere ugwu.
- source_word: βαλεῖν
  choice: itinye ... n’aka
  rationale: Ọ bụ ezie na isi ihe okwu ahụ pụtara bụ ‘itinye,’ ọnọdụ azụmahịa ya na-egosi inyefe ego ka e debe ma jiri ya rụọ ọrụ.
- source_word: τὰ ἀργύριά μου
  choice: ego m
  rationale: ἀργύριον nwere ike ịpụta ọlaọcha ma ọ bụ ego; ‘ego’ na-enye nghọta ọrụ okwu ahụ nwere n’ilu a n’Igbo nke oge a.
- source_word: τραπεζίταις
  choice: ndị na-edebe ego n’ụlọ akụ
  rationale: Ọ na-ezo aka n’aka ndị na-arụ ọrụ ego ma ọ bụ mgbanwe ego; ebe a, ọmụrụ nwa na-egosi ọrụ yiri nke ụlọ akụ karịa nanị mgbanwe ego.
- source_word: ἐλθὼν ἐγὼ
  choice: mgbe m lọtara
  rationale: 'Aorist participle ahụ na-egosi oge: ọ ga-enwetaghachi ego ahụ mgbe ọ lọtara. ‘Lọtara’ dabara n’ọnọdụ nna ukwu nke si njem pụta.'
- source_word: ἐκομισάμην ἂν
  choice: m gaara enwetaghachi
  rationale: Middle voice na ἄν na-egosi ihe onye nwe ya gaara anata azụ n’ọnọdụ megidere ihe mere eme.
- source_word: τὸ ἐμὸν
  choice: ihe nke m
  rationale: 'Na-echekwa nkwusi ike nke possessive substantivized ahụ: ihe ahụ bụ nke nna ukwu ahụ.'
- source_word: σὺν τόκῳ
  choice: tinyere ọmụrụ nwa
  rationale: τόκος ebe a bụ ego a na-agbakwụnye n’ihi iji ego; ‘ọmụrụ nwa’ bụ okwu Igbo doro anya ma ghara ibubata echiche nke ọmụrụ nwa gabigara ókè.
theological_decisions:
- issue: Asụsụ gbasara ego n’ilu ahụ na ohere nke ịgụ ya dịka iwu omume banyere ọmụrụ nwa
  choice: A sụgharịrị okwu azụmahịa ahụ n’ụzọ kwụ ọtọ dịka ihe atụ dị n’ilu, n’enweghị ikwu na amaokwu ahụ kwadoro ma ọ bụ katọọ ụdị ọmụrụ nwa niile.
  alternative: Iji okwu na-egosi ọmụrụ nwa gabigara ókè ma ọ bụ mmegbu
  rationale: Amaokwu ahụ ji asụsụ akụ na ụba mee ihe n’ilu; ọ naghị ekpe ikpe n’onwe ya banyere usoro mgbazinye ego niile.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ụlọ akụ’ kọwaa ọrụ τραπεζίταις n’ụzọ ndị na-agụ akwụkwọ taa ga-aghọta, ebe nkọwa ala peeji na-echekwa nhọrọ nkịtị ‘ọlaọcha’ na obosara pụtara nke ndị na-arụ ọrụ ego.
