reference: Matthew 25:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ· Πονηρὲ δοῦλε καὶ ὀκνηρέ, ᾔδεις ὅτι θερίζω ὅπου οὐκ ἔσπειρα καὶ συνάγω ὅθεν οὐ διεσκόρπισα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: ig
  text: Ma nna ukwu ya zara ya, sị, “Ohu[a] ọjọọ na onye umengwụ, ị maara na m na-ewe ihe ubi n’ebe m na-akụghị mkpụrụ, na-achịkọtakwa n’ebe m na-agbasaghị ihe?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “odibo ọjọọ na onye umengwụ.” Okwu Grik bụ doulos, nke nwere ike ịpụta “ohu” ma ọ bụ “odibo,” dịka ọnọdụ okwu si dị.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịgụ okwu Grik a dịka nkwupụta: “Ị maara na m na-ewe ihe ubi n’ebe m na-akụghị mkpụrụ, na-achịkọtakwa n’ebe m na-agbasaghị ihe.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Ma ... zara ya, sị
  rationale: Nke a na-egosipụta usoro akụkọ ahụ na ntakịrị mgbanwe echiche nke δέ n’Igbo dị larịị.
- source_word: ὁ κύριος αὐτοῦ
  choice: nna ya ukwu
  rationale: N’ilu a, κύριος na-ezo aka n’onye nwe ohu ahụ, ọ bụghị aha nsọ ‘Onyenweanyị’; ‘nna ya ukwu’ dabara n’ọnọdụ mmekọrịta ahụ.
- source_word: Πονηρὲ
  choice: ọjọọ
  rationale: ‘Ọjọọ’ na-eburu ikpe omume dị na πονηρός, ọ bụghị naanị ịdịghị mma.
- source_word: δοῦλε
  choice: ohu
  rationale: δοῦλος n’ọnọdụ a na-egosi onye nọ n’okpuru ikike nna ukwu ya; ‘ohu’ na-edobe ike mmekọrịta ahụ karịa ‘odibo,’ ebe a na-akọwa nhọrọ nke ọzọ n’ala ala peeji.
- source_word: ὀκνηρέ
  choice: onye umengwụ
  rationale: Nke a bụ okwu Igbo doro anya ma dị ugbu a maka onye na-achọghị ịrụ ọrụ.
- source_word: ᾔδεις ὅτι
  choice: ị maara na
  rationale: Ọ na-edobe okwu ahụ dịka ọdịnaya nke ihe ohu ahụ maara, ma na-ahapụ akara ajụjụ ka o gosipụta ụda ajụjụ nkwugharị.
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: m na-ewe ihe ubi n’ebe m na-akụghị mkpụrụ
  rationale: 'Ọ na-edobe ihe atụ ọrụ ugbo: θερίζω bụ iwe ihe ubi, ἔσπειρα bụ ịkụ mkpụrụ.'
- source_word: συνάγω ὅθεν οὐ διεσκόρπισα
  choice: na-achịkọtakwa n’ebe m na-agbasaghị ihe
  rationale: ‘Na-achịkọta’ na-egosipụta συνάγω; ‘ihe’ na-eme ka okwu Igbo zuo oke n’agbanyeghị na Grik ekwughị ihe a gbasara kpọmkwem, ma ọ naghị akọwa ya hoo haa dịka ‘mkpụrụ.’
theological_decisions:
- issue: Ụdị okwu ikpeazụ na akara edemede ya
  choice: 'Ajụjụ nkwugharị: ‘ị maara na ...?’'
  alternative: 'Okwu nkwupụta: ‘Ị maara na ... .’'
  rationale: Grik enweghị akara edemede mbụ nke ga-ekpebi nke a kpamkpam. Ajụjụ nkwugharị dabara n’otú nna ukwu ahụ si eji okwu ohu ahụ tụgharịa ya megide ya, ma e debere ọgụgụ nkwupụta n’ala ala peeji.
- issue: Ike mmekọrịta dị na δοῦλος
  choice: ohu
  alternative: odibo
  rationale: ‘Ohu’ na-egosipụta ọnọdụ onye nọ n’okpuru nwe ya nke ọma; ‘odibo’ dịkwa ka ntụgharị kwekọrọ n’ọnọdụ ụfọdụ, ya mere e debere ya dịka nhọrọ ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘nna ya ukwu’ mee ka ọnọdụ ilu ahụ doo anya, ma zere ime κύριος ka ọ bụrụ aha nsọ kpọmkwem. Akara ala ala peeji [a] na [b] dị n’ahịrị isi.
