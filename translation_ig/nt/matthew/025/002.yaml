  text: πέντε δὲ ⸂ἐξ αὐτῶν ἦσαν⸃ ⸂μωραὶ καὶ πέντε φρόνιμοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: ig
  text: Ise n’ime ha bụ ndị nzuzu, ise bụ ndị maara ihe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: ise
  rationale: Ọnụọgụ a pụtara kpọmkwem ‘ise’; ikwughachi ya na-echekwa nhazi na ọdịiche dị n’ahịrị Grik.
- source_word: δὲ
  choice: —
  rationale: N’ebe a, δέ bụ njikọ akụkọ dị nro. N’Igbo, ahịrịokwu ahụ na-aga nke ọma n’enweghị okwu njikọ a kapịrị ọnụ, ya mere a hapụrụ ya ka asụsụ ghara ịdị arọ.
- source_word: ἐξ αὐτῶν
  choice: n’ime ha
  rationale: Nke a na-egosi na ise ahụ so n’otu ndị e kwuru okwu ha na mbụ; ‘n’ime ha’ bụ ụzọ Igbo dị mfe ma doo anya isi kwuo ya.
- source_word: ἦσαν
  choice: bụ ... abụrụ
  rationale: ἦσαν bụ ngwaa njikọ na-akọ ọnọdụ ha. ‘Bụ’ na ‘abụrụ’ na-enye nkọwa ahụ n’Igbo eke, ebe ‘abụrụ’ n’akụkụ nke abụọ na-eme ka ọdịiche ahụ doo anya.
- source_word: μωραὶ
  choice: ndị nzuzu
  rationale: μωραί na-akọ ndị na-enweghị ezi uche. ‘Ndị nzuzu’ bụ okwu Igbo a na-aghọta ngwa ngwa ma kwekọọ n’aha ụmụ agbọghọ ahụ.
- source_word: καὶ πέντε φρόνιμοι
  choice: ise ndị ọzọ abụrụ ndị nwere uche
  rationale: φρόνιμοι pụtara ndị nwere ezi uche, ndị maara ihe, ma ọ bụ ndị nwere akọ. ‘Ndị nwere uche’ na-egosipụta ọdịiche ya na ‘ndị nzuzu’ n’asụsụ Igbo dị ugbu a; ‘ndị ọzọ’ na-eme ka nkewa ise na ise doo anya.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ùgwù. E ji ‘ndị nwere uche’ mee φρόνιμοι ka e ghara itinye nkọwa okpukpe pụrụ iche n’ime okwu ahụ; ahịrị ahụ na-echekwa ọdịiche ise na ise nke Grik.
