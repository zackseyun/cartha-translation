  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: ig
  text: Mgbe ahụ ọ ga-aza ha sị, “N’ezie, ana m asị unu, n’ókè unu emeghị ya nye otu onye n’ime ndị a kasị nta[a], unu emereghịkwa m ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndị a kasị nta” pụrụ ịbụ ndị na-eso ụzọ Jizọs kpọmkwem, ma ọ bụ ndị e wedara ala na ndị nọ ná mkpa n’ozuzu ha; nsụgharị ahụ hapụrụ okwu ahụ otú ọ dị n’ihe odide ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Na-egosi usoro oge n’ihe gbasara ikpe ahụ; ọ bụ okwu Igbo doro anya ma kwekọọ n’ụdị akụkọ ahụ.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: ọ ga-aza ha sị
  rationale: Na-edobe echiche nke ịza ha na ikwu okwu, ma jiri usoro okwu Igbo nkịtị kama ịsụgharị participle ahụ n’ụzọ ga-ada arọ.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: N’ezie, ana m asị unu
  rationale: Na-echekwa nkwusi ike na ịdị nsọ nke usoro okwu Jizọs, ma doo ndị na-agụ Igbo nke oge a anya. A na-enye ‘Amen’ dị ka nhọrọ nkịtị karịa n’okpuru peeji.
- source_word: ἐφ’ ὅσον
  choice: ebe ọ bụ na
  rationale: N’ọnọdụ a, okwu ahụ na-ejikọta emeghị ihe ahụ nye onye kasị nta na emeghị ya nye Jizọs; nhọrọ a bụ Igbo dị ndụ ma ghara ịgbakwunye ihe onye mere emeghị.
- source_word: οὐκ ἐποιήσατε
  choice: unu emeghị ya
  rationale: ‘Ya’ na-anọchi anya omume ndị e kwuru n’amaokwu ndị bu ụzọ ma mee ka Igbo zuo oke.
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: nye otu onye n’ime ndị a kasị nta
  rationale: Na-echekwa dative ‘nye otu onye,’ otu onye nnọchiteanya n’ime ìgwè ahụ, na superlative ‘ndị kasị nta.’
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: unu emereghịkwa m ya
  rationale: Na-echekwa njikọ nkwubi okwu na-adịghị mma na nkwughachi nke ngwaa ahụ, n’usoro Igbo doro anya.
theological_decisions:
- issue: Ndị okwu ahụ bụ ‘ndị a kasị nta’ na-ezo aka na ha
  choice: E debere okwu ahụ n’enweghị ịkọwa kpọmkwem ndị ọ gụnyere.
  alternative: Ọ pụrụ izo aka kpọmkwem n’ebe ndị na-eso ụzọ Jizọs nọ, ma ọ bụ n’ebe ndị e wedara ala na ndị nọ ná mkpa n’ozuzu ha nọ.
  rationale: Amaokwu ahụ na-eme ka omume e mere ma ọ bụ emeghị otu n’ime ha bụrụ nke e mere ma ọ bụ emeghị Jizọs, ma ọ naghị edozi n’onwe ya esemokwu gbasara kpọmkwem ndị otu ahụ bụ.
translation_notes:
  register: Standard Igbo dị ugbu a, kwanyere ugwu ma dị mfe nghọta. A họọrọ ‘ọ ga-aza ha sị’ maka ịdị n’usoro Igbo, ma debekwa nkwughachi na ike nke okwu ikpe ahụ.
