    text: “Ndị a kasị nta” pụrụ ịbụ ndị na-eso ụzọ Jizọs kpọmkwem, ma ọ bụ ndị e wedara ala na ndị nọ ná mkpa n’ozuzu ha; nsụgharị ahụ hapụrụ okwu ahụ otú ọ dị n’ihe odide ahụ.
    reason: alternative_reading
  revision_rationale: The revision changes only the connective for ἐφ’ ὅσον, preserving its extent-related force. All other wording is retained because it is faithful to the Greek, idiomatic in Standard Igbo, and does not settle the debated referent of 'ndị a kasị nta.'
