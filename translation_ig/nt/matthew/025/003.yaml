  - severity: medium
    issue: The footnote's alternative “ọwa” is unclear as a standalone rendering of “torches.”
    rationale: “Ọkụ ọwa” clearly communicates a torch in modern Standard Igbo and better supports the stated lexical alternative for Greek λαμπάδας.
