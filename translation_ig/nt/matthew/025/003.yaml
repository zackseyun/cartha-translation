  text: ⸂αἱ γὰρ⸃ μωραὶ λαβοῦσαι τὰς λαμπάδας αὐτῶν οὐκ ἔλαβον μεθ’ ἑαυτῶν ἔλαιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: ig
  text: N’ihi na mgbe ndị nzuzu ahụ were oriọna[a] ha, ha eweghị mmanụ soro ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “ọkụ ọwa” kama “oriọna” (Grik: λαμπάδας).'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata nkọwa nke ihe e kwuru n’amaokwu bu ụzọ ma na-echekwa njikọ echiche dị na Grik.
- source_word: μωραὶ
  choice: ndị nzuzu ahụ
  rationale: Adjective a bụ feminine plural ma na-ezo aka n’ụmụ agbọghọ ndị a kpọtụrụ aha na mbụ; ‘ndị nzuzu ahụ’ na-egosipụta njirimara ahụ n’ụzọ doro anya n’Igbo n’ebughị ụzọ kwughachi ‘ụmụ agbọghọ’.
- source_word: λαβοῦσαι
  choice: mgbe ... were
  rationale: Aorist participle a nwere echiche oge n’ebe a; nsụgharị a na-eme ka usoro omume ahụ doo anya ma na-ada nke ọma n’Igbo.
- source_word: λαμπάδας
  choice: oriọna
  rationale: ‘Oriọna’ bụ okwu a na-aghọta ngwa ngwa, ọ dabara n’ebe a n’ihi mmanụ a kpọtụrụ aha; ma ‘ọwa’ ka bụkwa nhọrọ nwere ike ịbụ ihe okwu Grik ahụ pụtara.
- source_word: οὐκ ἔλαβον
  choice: ha ewereghị
  rationale: Nke a na-echekwa nkwughachi dị n’etiti λαβοῦσαι na ἔλαβον—‘were’ na ‘ewereghị’—dị ka ọ dị n’isi mmalite Grik.
- source_word: μεθ’ ἑαυτῶν
  choice: soro ha
  rationale: Nke a bụ ụzọ ebumpụta ụwa e si ekwu na Igbo na ha ebuteghị mmanụ ka ọ bụrụ ihe ha ji aga.
- source_word: ἔλαιον
  choice: mmanụ
  rationale: Ọ bụ nsụgharị kwụ ọtọ nke okwu ahụ; n’akụkọ a, ọ bụ mmanụ e ji eme ka oriọna na-enwu.
