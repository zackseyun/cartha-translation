id: MAT.25.39
reference: Matthew 25:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πότε δέ σε εἴδομεν ⸀ἀσθενοῦντα ἢ ἐν φυλακῇ καὶ ἤλθομεν πρός σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/039.yaml
  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: ig
  text: Olee mgbe anyị hụrụ gị ka ị na-arịa ọrịa ma ọ bụ ka ị nọ n’ụlọ mkpọrọ, wee bịakwute gị?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “wee leta gị.” N’ụzọ ka nso na mkpụrụokwu Grik: “wee bịakwute gị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: Olee mgbe
  rationale: Ọ bụ ajụjụ banyere oge; “Olee mgbe” bụ ụzọ Igbo nkịtị si jụọ ya n’okwu a na-ekwu kpọmkwem.
- source_word: δέ
  choice: —
  rationale: N'ebe a δέ bụ njikọ dị nro n’usoro ajụjụ. Igbo anaghị achọ ka a sụgharịa ya iche ebe a; ịhapụ ya na-eme ka ajụjụ ahụ daa nke ọma n’enweghị itinye mmegide na-adịghị na Grik.
- source_word: εἴδομεν
  choice: anyị hụrụ
  rationale: Aorist a na-ezo aka n’ihe gara aga; “anyị hụrụ” na-enye ajụjụ ahụ n’Igbo n'ụzọ doro anya ma dị ndụ.
- source_word: ἀσθενοῦντα
  choice: ka ị na-arịa ọrịa
  rationale: N’ọnọdụ okwu a, participle ahụ na-akọwa ọrịa anụ ahụ, ọ bụghị naanị adịghị ike n’ozuzu ya.
- source_word: ἐν φυλακῇ
  choice: ka ị nọ n’ụlọ mkpọrọ
  rationale: φυλακή ebe a bụ ebe e ji mmadụ kpọchie; “ụlọ mkpọrọ” bụ okwu Igbo doro anya ma kwesịkwa ekwesị.
- source_word: ἤλθομεν πρός σε
  choice: wee bịakwute gị
  rationale: Nke a na-edobe echiche nkịtị nke ịbịa n’ebe mmadụ nọ, kama ịkọwa ya ozugbo dị ka ileta ya.
theological_decisions:
- issue: Ma a ga-asụgharị ἤλθομεν πρός σε dị ka “anyị letara gị” ka ọ bụ n'ụzọ ka nso na mkpụrụokwu, “anyị bịakwutere gị.”
  choice: wee bịakwute gị
  alternative: wee leta gị
  rationale: Okwu Grik ahụ pụtara n'ụzọ nkịtị ịbịakwute mmadụ; ọ naghị eji ngwaa pụrụ iche pụtara “ileta.” Nhọrọ a na-ezere itinye nkọwa karịrị ihe isi mmalite kwuru, ebe e debere “leta gị” n’ala peeji dịka nhọrọ okwu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ka ị na-arịa ọrịa” na “ka ị nọ n’ụlọ mkpọrọ” mee ka participle na prepositional phrase kwekọọ n’ụzọ Igbo si ekwu okwu; e chekwara ọdịiche dị n’etiti “ịbịakwute” na “ileta” site n’ala peeji.
