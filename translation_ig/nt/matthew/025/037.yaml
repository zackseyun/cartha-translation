  source_fidelity: The translation accurately represents the temporal sequence, future response, direct address, and the two parallel retrospective questions. “Ka agụụ na-agụ gị ... nye gị nri” and “ka akpịrị na-akpọ gị nkụ ... nye gị ihe ọṅụṅụ” naturally convey the Greek participial conditions and the corresponding acts of feeding and giving drink without specifying a particular beverage.
  naturalness: The wording is fluent, dignified Standard Igbo. The paired construction is clear and idiomatic, and the direct-speech punctuation and use of “sị” read naturally.
  terminology: “Ndị ezi omume” is an appropriate rendering of οἱ δίκαιοι, and “Onyenwe anyị” is an established respectful Christian rendering for the vocative Κύριε in this register. “Ihe ọṅụṅụ” appropriately remains general, matching ἐποτίσαμεν.
