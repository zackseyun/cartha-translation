id: MAT.25.37
reference: Matthew 25:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: ig
  text: Mgbe ahụ, ndị ezi omume ga-aza ya, sị, “Onyenwe anyị, olee mgbe anyị hụrụ gị ka agụụ na-agụ gị wee nye gị nri, ma ọ bụ ka akpịrị na-akpọ gị nkụ wee nye gị ihe ọṅụṅụ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Na-egosi ihe ga-esochi ihe e kwuru tupu ya; nke a bụ ụzọ Igbo doro anya ma dịkwa nkenke si ekwu ya.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: ga-aza ya
  rationale: Ụdị ngwaa a nwere nghọta nke onye na-eme ihe n'agbanyeghị ọdịdị ya n'asụsụ Grik; ‘ga-aza ya’ bụ Igbo ebumpụta ụwa ma chekwaa onye a na-aza.
- source_word: οἱ δίκαιοι
  choice: ndị ezi omume
  rationale: Adjective a ghọrọ aha ndị mmadụ n'amaokwu a; ‘ndị ezi omume’ na-egosi ndị ahụ n'enweghị ịgbakwunye nkọwa banyere otú e si gụọ ha dị ka ndị ezi omume.
- source_word: λέγοντες
  choice: sị
  rationale: E jikọtara participle ahụ n'usoro okwu Igbo ebumpụta ụwa iji webata okwu ha kwuru ozugbo.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ okwu nkwanye ùgwù a na-eji akpọ κύριος n'Igbo, ma ọ na-echekwa ịdị arọ aha ahụ nwere n'okwu a a gwara Jizọs.
- source_word: πότε σε εἴδομεν
  choice: olee mgbe anyị hụrụ gị
  rationale: Na-echekwa ajụjụ oge ahụ na onye ha hụrụ n'usoro Igbo doro anya.
- source_word: πεινῶντα
  choice: ka agụụ na-agụ gị
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si akọ ọnọdụ mmadụ nọ na ya mgbe agụụ na-agụ ya.
- source_word: ἐθρέψαμεν
  choice: wee nye gị nri
  rationale: τρέφω n'ebe a na-ekwu maka ime ka onye agụụ na-agụ rie; ‘nye gị nri’ bụ okwu Igbo nkịtị ma kpọmkwem.
- source_word: διψῶντα
  choice: ka akpịrị na-akpọ gị nkụ
  rationale: Ọ bụ akpaala okwu Igbo nkịtị maka ịnọ n'ọnọdụ akpịrị ịkpọ nkụ.
- source_word: ἐποτίσαμεν
  choice: wee nye gị ihe ọṅụṅụ
  rationale: Na-egosi na e nyere ya ihe ọ ga-aṅụ n'ebughị ụzọ kpebie na ọ bụ naanị mmiri, ebe ngwaa Grik ahụ n'onwe ya ekwughị ụdị ihe ọṅụṅụ ahụ.
theological_decisions:
- issue: Otú e si sụgharị κύριος mgbe a na-akpọ Jizọs okwu ozugbo
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa ma nkwanye ùgwù ahụ ma ihe aha a nwere ike ịpụta banyere onye Jizọs bụ, n'emeghị ka ihe ahụ pụta ihe karịa ka ederede si kwuo.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ahịrị abụọ yiri ibe ha—agụụ/nri na akpịrị ịkpọ nkụ/ihe ọṅụṅụ—ma jikọta λέγοντες dịka ‘sị’ ka okwu ahụ daa nke ọma n'Igbo. Enweghị nkọwa ala peeji dị mkpa, n'ihi na ‘nye gị ihe ọṅụṅụ’ na-enye nghọta ἐποτίσαμεν nke ọma n'ime ederede.
