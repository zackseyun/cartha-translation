  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: ig
  text: Onye natara talent abụọ ahụ bịakwutekwara sị, “Onyenwe m,[a] i nyefere m talent abụọ. Lee, enwetara m talent abụọ ọzọ.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Nna ukwu.” Okwu Grik bụ kyrios, nke a na-asụgharịkarị “Onyenwe”; n’akụkọ ilu a, ọ pụkwara ịbụ okwu nkwanye ùgwù a na-akpọ nna ukwu.
    reason: alternative_reading
  - marker: b
    text: Talent bụ nnukwu nha ego n’oge ahụ; ọ bụghị nkà ma ọ bụ ikike ebumpụta ụwa.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν δὲ καὶ
  choice: Onye ahụ ... bịakwutere ya
  rationale: ‘Bịakwutere ya’ na-egosipụta ịbịaru onye nwe ya nso, ebe usoro ahịrịokwu ahụ na-egosikwa na nke a bụ onye ọzọ sochiri onye gara aga.
- source_word: ὁ τὰ δύο τάλαντα
  choice: Onye ahụ natakwara talent abụọ
  rationale: E tinyere ‘natakwara’ dịka ihe gbara ama n'akụkọ ilu ahụ, iji mee ka onye a na-ekwu maka ya doo anya n'Igbo; ‘-kwara’ na-egosipụta mgbakwunye na ndokwa akụkọ.
- source_word: Κύριε
  choice: Onyenwe m
  rationale: N'okwu a a na-akpọ onye nwe ohu ahụ okwu n'ụzọ nkwanye ùgwù. ‘Onyenwe m’ na-echekwa echiche nke κύριος ma dabara n'ọnọdụ mmekọrịta dị n'akụkọ ilu ahụ.
- source_word: παρέδωκας
  choice: i nyefere m
  rationale: ‘Nyefere’ na-echekwa isi echiche nke inyefe ihe n'aka onye ọzọ, na-enweghị ime ka nkọwa ahụ bụrụ naanị ‘inye’ ma ọ bụ ịkọwa ya gabiga ókè dịka ‘ịtụkwasị n'aka.’
- source_word: ἴδε
  choice: Lee
  rationale: ‘Lee’ bụ okwu Igbo nkịtị ma dị ùgwù nke na-adọrọ uche onye a na-agwa n'ihe a rụpụtara.
- source_word: ἄλλα δύο τάλαντα ἐκέρδησα
  choice: enwetakwuola m talent abụọ ọzọ
  rationale: ‘Enwetakwuola’ na-egosipụta uru agbakwunyere, ebe ‘abụọ ọzọ’ na-echekwa ọnụ ọgụgụ na echiche nke ihe mgbakwunye.
- source_word: τάλαντα
  choice: talent
  rationale: E debere aha omenala a iji chekwaa okwu pụrụ iche dị n'akụkọ ilu ahụ; ihe odide ala peeji na-akọwa na ọ bụ nnukwu ọnụ ego, ọ bụghị ikike mmadụ mụrụ.
theological_decisions:
- issue: Ntụgharị κύριος dịka okwu a na-akpọ onye nwe ohu n'akụkọ ilu
  choice: Onyenwe m
  alternative: Nna m ukwu
  rationale: ‘Onyenwe m’ na-anọ nso na κύριος ma na-arụkwa ọrụ dịka okwu nkwanye ùgwù a na-akpọ onye nwe mmadụ. Ihe odide ala peeji na-echekwa nhọrọ ‘Nna m ukwu’ nke ọnọdụ mmekọrịta ahụ nwere ike ịkwado, n'ebughị ụzọ kpebie na okwu ahụ nwere naanị otu nghọta.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. Ahịrịokwu ahụ na-echekwa usoro akụkọ, okwu nkwanye ùgwù, na nkọwa ego nke ‘talent.’ Akara [a] na [b] dị n'ederede isi.
