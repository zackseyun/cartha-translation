  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ φοβηθεὶς ἀπελθὼν ἔκρυψα τὸ τάλαντόν σου ἐν τῇ γῇ· ἴδε ἔχεις τὸ σόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: ig
  text: Ụjọ tụrụ m, m wee gaa zoo talentị gị[a] n’ime ala. Lee, i nwere ihe nke gị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nnukwu ego.” Talentị bụ otu nnukwu ụdị ego bara ezigbo uru; n’ebe a, ọ pụtaghị nkà e bu mmadụ pụta ụwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: Ụjọ tụrụ m
  rationale: Nke a na-egosi na ụjọ bụ ihe kpaliri ohu ahụ ime ihe o mere, n’ebughị echiche nke ‘egwu nsọ’ bata na ya.
- source_word: ἀπελθὼν
  choice: m wee gaa
  rationale: 'Ọ na-edobe usoro omume ahụ: ụjọ tụrụ ya, ọ gaa, mesịa zoo ego ahụ.'
- source_word: ἔκρυψα
  choice: zoo
  rationale: ‘Zoo’ bụ ihe κρύπτω pụtara kpọmkwem; okwu na-esochi ya, ‘n’ime ala,’ na-egosi otú o si zoo ya.
- source_word: τὸ τάλαντόν σου
  choice: talentị gị[a]
  rationale: ‘Talentị’ na-edobe aha otu nnukwu ego e ji eme ihe n’oge ahụ. Ihe e dere n’ala ala peeji na-eme ka o doo anya na ọ bụghị nkà mmadụ bu pụta ụwa.
- source_word: ἐν τῇ γῇ
  choice: n’ime ala
  rationale: Nke a na-egosi ala dị ka ebe e zoro talentị ahụ, n’ụzọ Igbo na-ada nke ọma.
- source_word: ἴδε
  choice: Lee
  rationale: ‘Lee’ bụ okwu dị ndụ ma dị mfe e ji adọta uche mmadụ n’ihe a na-egosi ya.
- source_word: ἔχεις τὸ σόν
  choice: i nwere ihe nke gị
  rationale: Nke a na-edobe nkwusi ike dị n’okwu Grik ahụ na ihe ahụ bụ nke nna ukwu ahụ, ọ bụ ezie na ahịrịokwu Grik ahụ dị nkenke.
theological_decisions:
- issue: Ihe τάλαντον pụtara n’ilu a
  choice: Idobe ‘talentị’ dị ka aha otu nnukwu ego n’oge ahụ, ma kọwaa ya n’ala ala peeji.
  alternative: ‘nnukwu ego’
  rationale: Okwu Grik ahụ na-ekwu maka ego ma ọ bụ ihe e ji atụ ibu bara nnukwu uru, ọ bụghị maka nkà mmadụ bu pụta ụwa. Idobe aha akụkọ ihe mere eme ahụ na nkọwa na-egbochi nghọtahie n’ebughị nkọwa pụrụ iche bata n’ahịrịokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. A gbanwere participle ndị Grik ka ha bụrụ usoro ngwaa Igbo na-aga were were, ma e debe ihe kpatara omume ahụ na usoro o si mee.
