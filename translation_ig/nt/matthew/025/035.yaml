id: MAT.25.35
reference: Matthew 25:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: ig
  text: N’ihi na agụụ gụrụ m, unu nyere m ihe m ga-eri; akpịrị kpọrọ m nkụ, unu nyere m ihe m ga-aṅụ; abụ m onye ọbịa, unu nabatara m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “unu kpọbata m.” Okwu Grik ahụ pụtara n’ụzọ nkịtị “ịchịkọta” ma ọ bụ “ịkpọkọta,” ma n’ebe a ọ na-ekwu maka ịnabata onye ọbịa nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: agụụ gụrụ m
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọ ọnọdụ agụụ n’oge gara aga, ma na-ebuga ihe aorist ahụ pụtara n’enweghị ntụgharị okwu n’otu n’otu.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-akọwa ihe e kwuru tupu ya; “N’ihi na” bụ njikọ doro anya ma bụrụ nke e ji eme ihe n’Igbo ugbu a.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: unu enye m ihe m ga-eri
  rationale: 'Ọ na-egosipụta usoro δίδωμι + dative + infinitive n’Igbo sitere n’okike: inye mmadụ ihe ọ ga-eri.'
- source_word: ἐδίψησα
  choice: akpịrị kpọrọ m nkụ
  rationale: Nke a bụ akpaalaokwu Igbo a na-ejikarị egosi na mmadụ nwere akpịrị ịkpọ nkụ.
- source_word: ἐποτίσατέ με
  choice: unu enye m ihe m ga-aṅụ
  rationale: Ọ na-ebuga echiche nke inye onye akpịrị kpọrọ nkụ ihe ọ ga-aṅụ, ma debe myirịta ya na nkebi banyere nri.
- source_word: ξένος
  choice: onye ọbịa
  rationale: N’Igbo, “onye ọbịa” nwere ike ịpụta onye na-abụghị onye a maara ma ọ bụ onye na-enweghị ebe obibi n’etiti ha; ọ dabara n’ọnọdụ nnabata e gosiri ebe a karịa okwu ga-elekwasị anya naanị n’agbụrụ ma ọ bụ obodo onye si.
- source_word: συνηγάγετέ με
  choice: unu anabata m
  rationale: Ọ bụ ezie na συνάγω pụtara n'ụzọ nkịtị ịchịkọta ma ọ bụ ịkpọkọta, njikọ ya na ξένος ebe a na-egosi ịnabata onye ọbịa ma lekọta ya.
theological_decisions:
- issue: Asụsụ nnabata dị na ξένος ... συνηγάγετέ με
  choice: abụ m onye ọbịa, unu anabata m
  alternative: abụ m onye ọbịa, unu kpọbata m
  rationale: Nhọrọ a na-echekwa isi echiche nke imere onye na-enweghị nkwado ebere site n’ịnabata ya, n’etinyeghị echiche ndọrọ ndọrọ ọchịchị nke oge a banyere mba ma ọ bụ ọnọdụ iwu. Ihe odide ahụ akọwaghị kpọmkwem ma nnabata ahụ bụ n’ụlọ ma ọ bụ n’obodo.
translation_notes:
  register: E ji Standard Igbo dị mfe, dị ùgwù, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. E debere ahịrịokwu ndị ahụ n’usoro yiri ibe ha dịka n’asụsụ Grik, ma jiri akpaalaokwu Igbo sitere n’okike mee ihe.
