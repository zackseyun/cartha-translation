  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: ig
  text: 'Ma n’etiti abalị, mkpu dara: “Lee, nwoke na-alụ nwanyị! Pụtanụ izute ya.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: Ma n'etiti abalị
  rationale: Nkebiokwu Grik a bụ ụzọ e si akọ oge, ya bụ ‘n'etiti abalị.’ ‘Ma’ na-egosipụta δέ dịka mgbanwe dị nro n'akụkọ ahụ.
- source_word: κραυγὴ γέγονεν
  choice: mkpu dara
  rationale: Nke a na-egosi na mkpu bilitere na mberede; ‘mkpu dara’ bụ okwu Igbo dị ndụ ma bụrụkwa nke a na-aghọta ngwa ngwa.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: ‘Lee’ bụ okwu a na-eji dọta uche onye na-ege ntị, ma na-echekwa ike nke ἰδού n'Igbo nke ugbu a.
- source_word: ὁ νυμφίος
  choice: nwoke na-alụ nwaanyị
  rationale: Nke a na-akọwapụta νυμφίος dịka nwoke nọ n'emume alụmdi na nwunye, n'ụzọ doro ndị Igbo nke oge a anya.
- source_word: ἐξέρχεσθε
  choice: Pụọnụ gaa
  rationale: Iwu a na-agwa ọtụtụ mmadụ ka ha si ebe ha nọ pụta; ‘gaa’ dabara n'echiche ịpụ iji zute onye na-abịa.
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: izute ya
  rationale: Nke a bụ nsụgharị Igbo dị nkenke ma kwekọọ na akpaalaokwu Grik nke pụtara ịga izute mmadụ.
theological_decisions:
- issue: Ihe nwoke na-alụ nwaanyị nọchiri anya ya n'ilu ahụ
  choice: A sụgharịrị ya naanị dịka ‘nwoke na-alụ nwaanyị,’ n'etinyeghị aha nsọpụrụ ma ọ bụ kọwaa ya dịka Kraịst n'amaokwu ahụ.
  alternative: Ide ya n'ụzọ ga-eme ka o doo anya ozugbo na ọ bụ Kraịst.
  rationale: Ọ bụ ezie na gburugburu ilu ahụ na-enye ohere ịhụ ya dịka onye nọchiri anya Jizọs, amaokwu a n'onwe ya ka na-akọ akụkọ ilu; nsụgharị ahụ anaghị etinye nkọwa okpukpe n'ime ederede.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘mkpu dara’ mee ka mberede nke ọkwa ahụ pụta ìhè; e zere okwu ochie ma ọ bụ nkọwa nke otu ụka.
