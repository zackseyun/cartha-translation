review_pass:
  verdict: revise
  source_fidelity: The added predicate “abịala” (‘has arrived’) is not expressed in the Greek. Although an arrival is contextually implied by the summons, the source announces only “Look, the bridegroom!” and then commands the hearers to go out to meet him.
  naturalness: “Mkpu dara” and “Pụtanụ izute ya” are clear, natural Standard Igbo. Removing “abịala” also makes the announcement more direct and idiomatic.
  terminology: “Nwoke na-alụ nwanyị” adequately conveys νυμφίος in the parable without capitalizing it or importing a Christological interpretation. “Lee” appropriately renders the attention-getting ἰδού.
  issues:
  - severity: medium
    issue: The translation adds “abịala” (‘has arrived’) to the bridegroom announcement.
    rationale: Neither ὁ νυμφίος nor the surrounding clause contains an explicit verb of arrival. The command to go out to meet him may imply that he is approaching, but the translation should not state this as explicit information.
  - severity: low
    issue: The existing footnote is tied to an alternative that chiefly removes the added wording rather than presenting a source-based lexical alternative.
    rationale: Once the unsupported “abịala” is removed, no footnote is needed for this brief verse; omitting it avoids a misleading alternative.
