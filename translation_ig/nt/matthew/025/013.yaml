  to: Ya mere, na-echenụ nche[a], n’ihi na unu amaghị ụbọchị ahụ ma ọ bụ awa ahụ.
  rationale: Replaced only ‘oge awa ahụ’ with the more direct and idiomatic ‘awa ahụ.’ This preserves the Greek definite object and the deliberate lack of further specification, while removing an unnecessary expansion. The wording and footnote otherwise faithfully preserve the ongoing imperative of vigilance.
