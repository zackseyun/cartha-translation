id: MAT.25.13
reference: Matthew 25:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε τὴν ἡμέραν οὐδὲ τὴν ⸀ὥραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: ig
  text: Ya mere, na-echenụ nche[a], n’ihi na unu amaghị ụbọchị ahụ ma ọ bụ awa ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-amụrụnụ anya” ma ọ bụ “na-adịnụ njikere.” Iwu Greek a na-egosi ịnọgide na-eche nche.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: na-echenụ nche
  rationale: Iwu dị n’ụdị ugbu a ma bụrụ nke ọtụtụ mmadụ na-egosi ịga n’ihu na-amụ anya ma na-adị njikere. ‘Na-echenụ nche’ bụ Igbo nkịtị nke na-echekwa ihe atụ nke ịnọ na nche n’akụkọ ilu a.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu e si n’akụkọ ilu gara aga nweta.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Na-ewebata ihe kpatara iwu ahụ n’ụzọ doro anya ma bụrụkwa Igbo e ji eme ihe taa.
- source_word: οὐκ οἴδατε
  choice: unu amaghị
  rationale: Na-edobe ngwaa ịma nke a jụrụ ajụ n’onye nke abụọ ọtụtụ, n’etinyeghị nkọwa ọzọ.
- source_word: τὴν ἡμέραν
  choice: ụbọchị ahụ
  rationale: Na-edobe akara nrụtụ aka nke Greek ma ghara ịkọwapụta ihe ụbọchị ahụ bụ karịa ka amaokwu ahụ kwuru.
- source_word: οὐδὲ τὴν ὥραν
  choice: ma ọ bụ oge awa ahụ
  rationale: Na-ejikọta ihe nke abụọ a na-amaghị n’ụzọ dị mma n’Igbo, ma na-edobe ‘oge awa’ nke ederede ahụ kpọmkwem.
theological_decisions:
- issue: Ihe atụ dị n’iwu banyere ịmụrụ anya
  choice: na-echenụ nche
  alternative: mụọnụ anya; na-adịnụ njikere
  rationale: Nhọrọ a na-echekwa ihe atụ nke ịnọ na nche na mkpa ịdị njikere mgbe a na-amaghị oge ahụ, n’etinyeghị usoro nkọwa pụrụ iche banyere ihe ndị ga-eme n’ọgwụgwụ.
- issue: Ihe ‘ụbọchị ahụ ma ọ bụ oge awa ahụ’ na-ezo aka na ya
  choice: hapụ okwu ahụ dịka ọ dị, n’enweghị mgbakwunye nkọwa
  alternative: ụbọchị ma ọ bụ oge awa nke Ọkpara Mmadụ ga-abịa; oge a kara aka
  rationale: Ọ bụ ezie na gburugburu okwu ahụ metụtara ọbịbịa na ikpe, amaokwu a n’onwe ya ekwughị ihe ọzọ karịa ‘ụbọchị’ na ‘oge awa.’ Ya mere, a naghị etinye nkọwa nkà mmụta okpukpe na-adịghị na Greek.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ụdị ọtụtụ mmadụ ‘unu’ na iwu ọtụtụ ‘na-echenụ’ mee ka ụtọasụsụ Greek pụta ìhè; a zere okwu ụka pụrụ iche.
