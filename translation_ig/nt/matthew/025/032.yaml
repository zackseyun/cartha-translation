id: MAT.25.32
reference: Matthew 25:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: ig
  text: A ga-achịkọta mba niile n’ihu ya[a], ọ ga-ekewapụkwa ha iche n’iche, dị ka onye na-azụ atụrụ si ekewapụ atụrụ n’ebe ewu nọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị mmadụ niile”; okwu Grik ahụ bụ “mba niile” (πάντα τὰ ἔθνη).
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ἐρίφων nwekwara ike ịpụta kpọmkwem “ụmụ ewu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: A ga-akpọkọta
  rationale: Nke a na-edobe ọdịdị nnara nke ngwaa ọdịnihu ahụ n’Igbo, n’etinyeghị onye kpọkọtara ha n’amaokwu ahụ.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: n’ihu ya
  rationale: Nke a bụ ụzọ Igbo doro anya ma kwesịkwa ekwesị isi kwuo na ha ga-anọ n’ihu ya n’ọnọdụ ikpe a.
- source_word: πάντα τὰ ἔθνη
  choice: mba niile
  rationale: “Mba niile” na-edobe obosara nkịtị nke ἔθνη, n’emeghị ka ọ bụrụ naanị ndị mba ọzọ ma ọ bụ kpebie kpọmkwem ụdị ndị a na-ekwu maka ha.
- source_word: ἀφορίσει
  choice: ọ ga-ekewapụ
  rationale: “Ikewapụ” na-egosi nkewa otu ìgwè n’ebe ìgwè ọzọ nọ n’ụzọ doro anya.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: ha n’ebe ibe ha nọ
  rationale: Nke a na-egosi na a ga-ekewa ndị ahụ e kpọkọtara ka otu akụkụ dị iche n’akụkụ nke ọzọ.
- source_word: ὥσπερ
  choice: dị ka ... si
  rationale: Usoro a bụ ntụnyere Igbo ebumpụta ụwa nke na-egosi nke ọma ihe oyiyi dị n’amaokwu ahụ.
- source_word: ὁ ποιμὴν
  choice: onye na-azụ atụrụ
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka onye na-elekọta ma na-azụ atụrụ.
- source_word: τὰ πρόβατα
  choice: atụrụ
  rationale: A na-edobe anụmanụ a kpọrọ aha kpọmkwem kama iji okwu izugbe dịka ìgwè anụ ụlọ.
- source_word: τῶν ἐρίφων
  choice: ewu
  rationale: “Ewu” na-eme ka ntụnyere atụrụ na ewu doo anya n’Igbo; ndetu ala na-echekwa nkọwa nwere ike ịbụ ụmụ ewu.
theological_decisions:
- issue: Oke ndị πάντα τὰ ἔθνη na-agụnye
  choice: mba niile
  alternative: ndị niile; ndị mba ọzọ niile
  rationale: A hapụrụ okwu ahụ n’obosara ya dịka Grik si dị, ka a ghara imechi ya naanị n’ebe ndị mba ọzọ nọ ma ọ bụ tinye otu atụmatụ nkọwa banyere ndị a ga-ekpe ikpe.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “A ga-akpọkọta” chekwaa nnara dị na Grik, ma jiri usoro ntụnyere Igbo “dị ka ... si ...” mee ka ahịrịokwu ahụ na-aga nke ọma.
