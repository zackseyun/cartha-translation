  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: ig
  text: Abụ m onye ọbịa, ma unu anabataghị m[a]; agba m ọtọ, ma unu eyighị m uwe; m na-arịa ọrịa, nọkwa m n’ụlọ mkpọrọ, ma unu abịaghị ileta m[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “unu akpọbataghị m n’ụlọ” ma ọ bụ “unu anabataghị m.” N’agbanyeghị na ngwaa Grik ahụ pụtara n’ụzọ nkịtị “ịchịkọta,” n’ebe a ọ na-ekwu maka ịnabata onye ọbịa n’ụzọ ọbịa.
    reason: lexical_alternative
  - marker: b
    text: “Ileta m” nwekwara echiche nke “ilekọta m” ma ọ bụ “ilezi m anya”; ọ bụghị nanị ịbịa hụ m.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: onye ọbịa
  rationale: N’ebe a, okwu ahụ na-ezo aka n’onye na-abụghị onye ezinụlọ ma ọ bụ obodo ha, onye chọrọ ka a nabata ya. “Onye ọbịa” bụ okwu Igbo nkịtị maka onye bịara ọhụrụ ma ọ bụ onye a na-amaghị, n’agbanyeghị na n’ọnọdụ ụfọdụ ọ pụkwara ịpụta onye a kpọrọ òkù.
- source_word: συνηγάγετέ
  choice: anabataghị
  rationale: Ọ bụ ezie na ngwaa Grik a pụtara n’ụzọ nkịtị ‘ịchịkọta,’ ya na ξένος nọ ebe a ọ pụtara ịnabata mmadụ n’ụlọ na ile ya ọbịa.
- source_word: γυμνός
  choice: agba m ọtọ
  rationale: Nke a na-echekwa ike okwu Grik ahụ, nke nwere ike ịpụta enweghị uwe kpamkpam ma ọ bụ enweghị uwe zuru ezu.
- source_word: περιεβάλετέ
  choice: eyighị m uwe
  rationale: Okwu a pụtara itinye uwe n’ahụ mmadụ; nkebiokwu Igbo a doro anya ma dịkwa n’okike.
- source_word: ἀσθενής
  choice: arịara m ọrịa
  rationale: Ọ bụ ezie na ἀσθενής nwekwara ike ịpụta adịghị ike, n’usoro omume ebere a, ọrịa anụ ahụ bụ nghọta kacha kwekọọ n’ọnọdụ ahụ.
- source_word: ἐν φυλακῇ
  choice: n’ụlọ mkpọrọ
  rationale: N’ebe a φυλακή na-ezo aka n’ọnọdụ ịbụ onye a tụrụ mkpọrọ, ọ bụghị nanị ebe ndị nche nọ.
- source_word: ἐπεσκέψασθέ
  choice: abịaghị ileta m
  rationale: “Ileta” na-echekwa omume a kpọrọ aha n’ụzọ doro anya, ebe footnote na-akọwa na ọ gụnyere ilekọta onye ahụ, ọ bụghị nanị ịbịa hụ ya.
theological_decisions:
- issue: Ihe omume ebere dị n’okwu ἐπεσκέψασθέ με
  choice: abịaghị ileta m
  alternative: unu elekọtaghị m
  rationale: Nhọrọ a na-echekwa omume kpọmkwem e kwuru n’asụsụ Grik ma hapụkwara footnote ka ọ kọwaa na nleta ahụ nwere echiche nke nlekọta na ọmịiko.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ahịrịokwu Grik ahụ, ma jiri nkebiokwu ndị Igbo na-asụkarị mee ka ọ bụrụ ihe dị n’okike. E tinyere akara footnote [b] n’akụkụ “ileta m,” ebe nkọwa ya metụtara ἐπεσκέψασθέ, ọ bụghị “iyikwasị uwe.”
