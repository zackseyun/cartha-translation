- from: Abụ m onye ọbịa, ma unu anabataghị m[a]; agba m ọtọ, ma unu eyighị m uwe; arịara m ọrịa, nọrọkwa m n’ụlọ mkpọrọ, ma unu abịaghị ileta m[b].
