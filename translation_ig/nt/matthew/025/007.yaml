  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. A họọrọ ‘dozie’ iji chekwaa obosara ihe κοσμέω pụtara kama ịkọwapụta kpọmkwem ihe e mere n’oriọna karịa ihe amaokwu ahụ kwuru.
