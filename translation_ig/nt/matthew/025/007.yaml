  verdict: revise
  source_fidelity: The draft accurately conveys the sequence, rising, preparing the light sources, and possession. However, ‘ụmụ agbọghọ’ means young women/girls and omits the explicit sense of παρθένοι, ‘virgins.’ The Greek wording should retain that descriptor.
  naturalness: ‘Mgbe ahụ … biliri, dozie oriọna ha’ is clear, idiomatic Standard Igbo. ‘Ụmụ agbọghọ ndị ahụ niile na-amaghị nwoke’ is a natural enough modern formulation that retains the source meaning without archaic diction.
  terminology: ‘Oriọna’ is an appropriate main rendering for λαμπάδας in this context. The lexical-alternative note should use a clearer description of ‘ọwa’ as a handheld torch/light and should not make the oil context seem decisive between the alternatives.
  issues:
