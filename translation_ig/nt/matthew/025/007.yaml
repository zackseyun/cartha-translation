  text: τότε ἠγέρθησαν πᾶσαι αἱ παρθένοι ἐκεῖναι καὶ ἐκόσμησαν τὰς λαμπάδας ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/007.yaml
  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: ig
  text: Mgbe ahụ, ụmụ agbọghọ ndị ahụ niile na-amaghị nwoke biliri, dozie oriọna ha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya ‘ọwa’ kama ‘oriọna’ (Grik: λαμπάδας); okwu ahụ nwere ike ịpụta ọkụ e ji aka ebu, ebe okwu ndị gbara mmanụ na nkwadebe ha gburugburu na-akwado nsụgharị abụọ ahụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe sochiri n’usoro akụkọ, ma bụrụkwa okwu Igbo doro anya na nke e ji eme ihe ugbu a.
- source_word: ἠγέρθησαν
  choice: biliri
  rationale: N’ebe a, ọ pụtara na ha si n’ụra ma ọ bụ n’ọnọdụ izu ike bilie; ‘biliri’ na-ekwupụta ya n’ụzọ dị mfe n’enweghị ịmanye echiche ahụ na onye ọzọ kpọtere ha.
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: ụmụ agbọghọ ahụ niile
  rationale: N’Igbo nkịtị, ‘ụmụ agbọghọ’ bụ ụzọ ebumpụta ụwa e si akọwa ụmụ nwaanyị na-alụbeghị di nọ n’ọnọdụ agbamakwụkwọ a; ọ naghị eji okwu ochie ma ọ bụ nke siri ike.
- source_word: ἐκόσμησαν
  choice: dozie
  rationale: κοσμέω pụtara ịhazi ma ọ bụ ime ka ihe dị njikere. ‘Dozie’ na-ekwe ka ihe omume ahụ gụnye idozi oriọna na ogho ya n’ebughị nkọwa karịa ihe Grik kwuru.
- source_word: λαμπάδας
  choice: oriọna
  rationale: λαμπάς nwere ike ịbụ oriọna ma ọ bụ ọwa; n’ihi mmanụ na nkwadebe e kwuru n’akụkọ a, ‘oriọna’ dabara nke ọma, ebe a na-edebe nhọrọ ‘ọwa’ na nkọwa ala peeji.
- source_word: ἑαυτῶν
  choice: ha
  rationale: Ọ bụ nnọchiaha ntụgharị onwe nke na-egosi na oriọna ndị ahụ bụ nke ụmụ agbọghọ ahụ; n’Igbo, ‘ha’ na-egosi nke a nke ọma n’enweghị nkwusi ike na-adịghị mkpa.
