    issue: The translation omits ‘na-amaghị nwoke’ (‘virgins’).
    rationale: παρθένοι is explicitly present in the Greek. Rendering only ‘ụmụ agbọghọ’ broadens the referent to young women and loses a stated feature of the parable’s characters.
  - severity: low
    issue: The footnote’s wording about the alternative ‘ọwa’ is imprecise and its singular ‘idozi ya’ has an unclear referent.
    rationale: A clearer plural formulation better reflects the lamps/torches and the contextual mention of oil and preparation.
