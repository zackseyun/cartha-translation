id: MAT.25.24
reference: Matthew 25:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: ig
  text: Mgbe ahụ, onye natara otu talent ahụ bịakwara kwuo, “Onyenwe m, amaara m na ị bụ nwoke siri ike[a], onye na-ewe ihe ubi n’ebe ị na-aghaghị mkpụrụ, na-achịkọtakwa ihe n’ebe ị na-agbasaghị[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwoke obi tara mmiri” ma ọ bụ “nwoke na-eme ihe aka ike.” Okwu Grik ahụ, σκληρός, nwere ike ịpụta siri ike, obi tara mmiri, ma ọ bụ aka ike.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “na-achịkọta site n’ebe ị na-agbasaghị.” Okwu Grik ekwughị ihe a gbasara; n’ihe oyiyi ọrụ ugbo a, a pụrụ ịghọta ya dịka mkpụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: bịara
  rationale: Ọ na-egosi na ohu ahụ bịara n’ihu tupu o kwuo okwu; ‘bịara’ bụ okwu akụkọ dị mfe ma bụrụkwa nke e ji eme ihe n’Igbo ugbu a.
- source_word: δὲ καὶ
  choice: Mgbe ahụ ... natakwara
  rationale: ‘Mgbe ahụ’ na-egosi ọganihu n’usoro akụkọ, ebe ‘-kwara’ dị na ‘natakwara’ na-egosi na onye a sokwa ná ndị bịara n’ihu.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: onye ahụ natakwara otu talent
  rationale: Nke a na-akọwa onye ahụ site n’ihe ọ natara. ‘Onye ahụ’ na ‘natakwara’ na-eme ka ntụaka ahụ doo anya ma na-egosikwa na ọ sokwa ná ndị ọzọ natara ihe.
- source_word: τάλαντον
  choice: talent
  rationale: E debere aha ihe atụ ego ahụ dịka okwu sitere na gburugburu ụwa oge ahụ, kama ịkọwapụta uru ya n’ụzọ ga-etinye ihe na-adịghị n’amaokwu ahụ.
- source_word: Κύριε
  choice: Onyenwe m
  rationale: N’ọnọdụ ilu a, nke a bụ okwu nsọpụrụ ohu ji akpọ onye nwe ya; ‘Onyenwe m’ bụ ntụgharị Igbo ebumpụta ụwa nke na-edebekwa ịdị arọ nke κύριος.
- source_word: ἔγνων σε ὅτι
  choice: amaara m na
  rationale: N’Igbo, ‘amaara m na’ na-ebute nkwupụta banyere agwa onye ahụ n'ụzọ doro anya ma dị mma, n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: σκληρὸς ἄνθρωπος
  choice: nwoke obi tara mmiri
  rationale: Akpaalaokwu a na-egosi onye siri ike ma ọ bụ onye na-adịghị eme ebere, ma na-ahapụ okwu ahụ dịka ebubo ohu ahụ kwuru, ọ bụghị nkwenye onye na-akọ akụkọ.
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: onye na-ewe ihe ubi n’ebe ị na-agharụghị mkpụrụ
  rationale: ‘Iwe ihe ubi’ na ‘ịghara mkpụrụ’ na-edebe ihe oyiyi ọrụ ugbo na ntụnyere dị n’asụsụ Grik.
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: na-achịkọtakwa ihe n’ebe ị na-agbasaghị
  rationale: ‘Na-achịkọta’ na-edebe echiche izukọta ihe, ebe ‘n’ebe ị na-agbasaghị’ na-agbaso okwu Grik nke na-ekwughị kpọmkwem ihe a gbasara; ‘ihe’ na-abụ naanị ihe nnọchi dị mkpa n’usoro Igbo.
theological_decisions:
- issue: Nsụgharị κύριος n’okwu a gwara onye nwe ohu n’ilu
  choice: Onyenwe m
  alternative: Nna m ukwu
  rationale: ‘Onyenwe m’ na-edebe isi echiche κύριος na nsọpụrụ dị n’okwu ohu ahụ, ma ihe gbara ya gburugburu ka na-egosi na ọ na-agwa onye nwe ya okwu.
- issue: Otú e si kọwaa agwa onye nwe ya n’okwu ohu ahụ
  choice: 'E debere ya dịka ebubo ohu ahụ: ‘nwoke obi tara mmiri.’'
  alternative: ‘nwoke siri ike’
  rationale: σκληρός nwere ike ịpụta onye siri ike, onye obi tara mmiri, ma ọ bụ onye na-eme ihe n’ụzọ aka ike. N’ọnọdụ a, ‘obi tara mmiri’ na-egosi ịdị njọ nke ebubo ahụ, ma ntụgharị ahụ anaghị ekpebi ma ebubo ohu ahụ ọ bụ eziokwu.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta mee ihe. E debere usoro ilu na ihe oyiyi ọrụ ugbo ahụ, ma zere ịkọwa ebubo ohu ahụ dịka eziokwu onye na-akọ akụkọ kwadoro. Akara nkọwa ala peeji [a] na [b] pụtara n’ederede isi.
