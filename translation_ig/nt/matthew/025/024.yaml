revisions:
- from: Mgbe ahụ, onye ahụ natakwara otu talent bịara kwuo, “Onyenwe m, amaara m na ị bụ nwoke obi tara mmiri[a], onye na-ewe ihe ubi n’ebe ị na-agharụghị mkpụrụ, na-achịkọtakwa ihe n’ebe ị na-agbasaghị[b].”
  to: Mgbe ahụ, onye natara otu talent ahụ bịakwara kwuo, “Onyenwe m, amaara m na ị bụ nwoke siri ike[a], onye na-ewe ihe ubi n’ebe ị na-aghaghị mkpụrụ, na-achịkọtakwa ihe n’ebe ị na-agbasaghị[b].”
  rationale: E megharịrị usoro mbụ ka «-kwa» metụta ọbịbịa onye ohu ahụ, dị ka δὲ καὶ si arụ ọrụ n’ebe a. E dochiri nkọwa σκληρός nke siri ike nke ukwuu («obi tara mmiri») na «siri ike» iji chekwaa obosara na nghọtahie dị n’okwu ahụ. E dozikwara okwu ịsụ mkpụrụ ka ọ bụrụ «ịgha mkpụrụ». A debere «ihe» n’ahịrịokwu nke abụọ n’ihi na Igbo chọrọ ihe a na-achịkọta, ebe akara ala peeji na-eme ka o doo anya na ederede Grik ekwughị «mkpụrụ».
  reviewer_model: gpt-5.6-terra
