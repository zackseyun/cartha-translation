id: MAT.25.18
reference: Matthew 25:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: ig
  text: Ma onye ahụ natara otu talent pụrụ, gwuo ala, zoo ego nna ukwu ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ sọrọ okwu Grik nso karị, “zoo ọlaọcha nna ukwu ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ma onye ahụ
  rationale: “Ma” na-egosi ọdịiche dị n’etiti ohu a na ndị ohu ndị e kwuru okwu ha tupu ya; “onye ahụ” na-anọchi onye e ji ihe ọ natara mara.
- source_word: τὸ ἓν
  choice: otu talent
  rationale: N’asụsụ Grik, “otu” na-ezo aka na talent e kwuru na Matiu 25:15. Ịkpọ “talent” aha na-eme ka ihe a na-ekwu doo anya n’Igbo.
- source_word: λαβὼν
  choice: natara
  rationale: Ohu ahụ bụ onye nna ya ukwu nyere ego ka o debe ma jiri ya rụọ ọrụ; “natara” na-egosi nke a n'ụzọ doro anya.
- source_word: ἀπελθὼν
  choice: pụrụ
  rationale: “Pụrụ” na-egosi na ọ hapụrụ ebe ahụ tupu ya agwuo ala ma zoo ego ahụ.
- source_word: ὤρυξεν γῆν
  choice: gwuo ala
  rationale: Nke a na-edobe okwu Grik nke pụtara igwu n’ala, n’etinyeghị “olulu” nke a na-aghọta n’omume ahụ ma a kpọghị ya aha kpọmkwem.
- source_word: ἔκρυψεν
  choice: zoo
  rationale: “Zoo” bụ okwu Igbo dị mfe ma bụrụkwa kpọmkwem maka izochi ihe.
- source_word: τὸ ἀργύριον
  choice: ego
  rationale: ἀργύριον nwere ike ịpụta ọlaọcha ma ọ bụ ego. N’akụkọ a banyere ihe nna ukwu nyere ohu ya, “ego” bụ okwu ndị na-agụ akwụkwọ taa ga-aghọta ngwa ngwa; ndetu ala peeji na-echekwa echiche nke “ọlaọcha.”
- source_word: τοῦ κυρίου αὐτοῦ
  choice: nna ya ukwu
  rationale: N’ebe a κύριος na-ezo aka n’onye nwe ohu ahụ n’ime akụkọ, ọ bụghị aha e ji akpọ Chineke. “Nna ya ukwu” na-egosi mmekọrịta ọchịchị ahụ n’Igbo nkịtị.
theological_decisions:
- issue: Nsụgharị κύριος mgbe ọ na-ezo aka n’onye nwe ohu n’ilu
  choice: nna ya ukwu
  alternative: Onyenwe ya
  rationale: Ihe a na-ekwu ozugbo bụ onye nwe ohu ahụ n’ime akụkọ. “Nna ya ukwu” na-egosi nke ahụ n’enweghị itinye aha nsọ Chineke n’ebe ederede Grik na-adịghị eme ya kpọmkwem.
translation_notes:
  register: 'Ejiri Igbo Izugbe nke dị ugbu a, dị mfe ma nwee ugwu. Ahịrịokwu ahụ na-edobe usoro omume dị na Grik: ọ natara, pụọ, gwuo ala, wee zoo ego ahụ. “Talent” ka edobere dị ka aha otu ibu ego oge ahụ, ka a ghara ime ka ọ bụrụ ego nke oge a.'
