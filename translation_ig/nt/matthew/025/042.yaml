    text: Ma ọ bụ, n’ụzọ dị nso n’okwu Grik, ‘unu enyeghị m ihe ka m rie … unu enyeghị m ihe ka m ṅụọ.’
    reason: lexical_alternative
  revision_rationale: The revision removes the unintended adversative force of “ma” while retaining the natural Igbo expressions for hunger and thirst. The footnote is adjusted so that its closer rendering still denotes giving something for the speaker to eat or drink, rather than merely allowing the speaker to do so.
