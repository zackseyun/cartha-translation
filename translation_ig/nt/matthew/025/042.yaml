  to: N’ihi na agụụ gụrụ m, unu enyeghị m ihe m ga-eri[a]; akpịrị kpọrọ m nkụ, unu enyeghị m ihe m ga-aṅụ.
  rationale: The revision removes the unintended adversative force of “ma” while retaining the natural Igbo expressions for hunger and thirst. The footnote is adjusted so that its closer rendering still denotes giving something for the speaker to eat or drink, rather than merely allowing the speaker to do so.
