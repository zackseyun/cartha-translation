  yaml_path: translation/nt/matthew/025/042.yaml
  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: ig
  text: N’ihi na agụụ gụrụ m, unu enyeghị m ihe m ga-eri[a]; akpịrị kpọrọ m nkụ, unu enyeghị m ihe m ga-aṅụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dị nso n’okwu Grik, ‘unu enyeghị m ihe ka m rie … unu enyeghị m ihe ka m ṅụọ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: agụụ gụrụ m
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ekwu na mmadụ nọ n’ọnọdụ agụụ; ọ na-egosikwa ọnọdụ gara aga dị n’aorist ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosipụta ihe kpatara ikpe ahụ e kwuru n’okwu gbara amaokwu a gburugburu.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: unu enyeghị m ihe m ga-eri
  rationale: Nke a na-asụ Igbo nke ọma, na-edobe onye a jụrụ inye ihe (m) nakwa echiche nke ihe a ga-eri, n’emeghị ka ahịrịokwu ahụ sie ike n’ụzọ na-abụghị Igbo nkịtị.
- source_word: μοι
  choice: m
  rationale: A tinyere onye nnọchi a n’ime ngwaa ‘enyeghị m,’ nke bụ usoro nkịtị e si egosipụta onye a na-enye ihe n’Igbo.
- source_word: φαγεῖν
  choice: ihe m ga-eri
  rationale: Ọ na-edobe echiche ngwaa nke infinitive ‘iri,’ kama ịgbanwe ya naanị ka ọ bụrụ aha ‘nri.’
- source_word: ἐδίψησα
  choice: akpịrị kpọrọ m nkụ
  rationale: Nke a bụ akpaalaokwu Igbo doro anya maka ịnọ n’ọnọdụ akpịrị ịkpọ nkụ, ma na-edobe myirịta ya na ‘agụụ gụrụ m.’
- source_word: ἐποτίσατέ με
  choice: unu enyeghị m ihe m ga-aṅụ
  rationale: N’ọnọdụ a, ποτίζω pụtara inye mmadụ ihe ọ ga-aṅụ. Nsụgharị a na-edobe echiche nke ileghara mkpa onye ahụ anya ma kwekọọ na akụkụ banyere ihe oriri.
- source_word: με
  choice: m
  rationale: E debere onye nnọchi ahụ nke ọma iji gosipụta na ọ bụ onye na-ekwu okwu ka a jụrụ inye ihe ọṅụṅụ.
theological_decisions:
- issue: Ogo ido anya n’ịsụgharị ahịrịokwu abụọ na-ekwu na e nyeghị onye ahụ ihe
  choice: unu enyeghị m ihe m ga-eri / ihe m ga-aṅụ
  alternative: unu enyeghị m ka m rie / unu emeghị ka m ṅụọ
  rationale: Nhọrọ ahụ bụ Igbo eke ma doo anya, na-edobekwa isi okwu banyere ileghara mkpa onye na-ekwu okwu anya. Ọ naghị etinye nkọwa ụka ma ọ bụ ozizi pụrụ iche n’ime amaokwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere myirịta dị n’etiti agụụ na akpịrị ịkpọ nkụ, tinyekwa njikọ nkọwa ‘N’ihi na.’
