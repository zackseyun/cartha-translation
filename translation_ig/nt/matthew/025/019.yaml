  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those servants comes and settles accounts with them.
translation:
  language: ig
  text: Mgbe ogologo oge gasịrị, nna ukwu ndị ohu ahụ bịara wee soro ha gbakọọ akaụntụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Mgbe ogologo oge gasịrị, onyenwe ndị na-eje ozi ahụ bịara wee soro ha gbakọọ akaụntụ.” Okwu Grik κύριος nwere ike ịpụta “onyenwe” ma ọ bụ “nna ukwu,” ebe δοῦλοι nwekwara ike ịpụta “ndị na-eje ozi” ma ọ bụ “ndị ohu.” N’ebe a, isi ederede họọrọ okwu ndị na-egosi nke ọma mmekọrịta nna ukwu na ndị ohu n’ilu ahụ.'
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: Mgbe ogologo oge gasịrị
  rationale: Nke a na-egosipụta usoro oge μετά na accusative; δέ bụ njikọ akụkọ dị nro nke Igbo ekwesịghị ịgbakwunye okwu ọzọ iji gosipụta ya.
- source_word: ἔρχεται
  choice: bịara
  rationale: Ọ bụ historical present n'asụsụ Grik. N'Igbo, oge gara aga dabara adaba n'akụkọ a ma na-ada nke ọma karịa iji oge ugbu a n'ebe a.
- source_word: ὁ κύριος
  choice: nna ukwu
  rationale: N'ọnọdụ ilu a, κύριος na-egosi onye nwe ma na-achị ndị ohu ya, ọ bụghị aha nsọ e ji akpọ Kraịst kpọmkwem n'ahịrịokwu a.
- source_word: τῶν δούλων ἐκείνων
  choice: ndị ohu ahụ
  rationale: “Ndị ohu” na-echekwa ọnọdụ mmadụ ndị nọ n'okpuru nna ukwu karịa okwu dị nro dịka “ndị na-eje ozi.”
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: ha na ya agbakọọkwa ihe ndekọ ego ha
  rationale: 'Nke a na-ebute n''Igbo nghọta nke idiom Grik ahụ: ịtụle ma dozie ihe e nyere na ihe a ga-aza ajụjụ banyere ya.'
theological_decisions:
- issue: Nsụgharị κύριος n'ime ilu
  choice: nna ukwu
  alternative: Onyenwe
  rationale: “Nna ukwu” na-egosi ọrụ onye ahụ n'ime akụkọ ahụ n'enweghị ịmanye aha Kraịst n'ahịrịokwu ahụ; ihe ilu ahụ nwere ike ịpụta n'ụzọ sara mbara ka ọnọdụ ya na-egosi.
- issue: Nsụgharị δοῦλος
  choice: ndị ohu
  alternative: ndị na-eje ozi
  rationale: Mmekọrịta nke ịbụ ndị nọ n'okpuru onye nwe ha pụtara ìhè n'ọnọdụ akụ na ụba nke ilu a, ya mere “ndị ohu” na-anọ source nso.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ugwu ma doo ndị nkịtị anya. E ji “nna ukwu” na “ndị ohu” chekwaa ọnọdụ mmekọrịta akụ na ụba nke ilu ahụ; e tinyere nhọrọ ndị ọzọ n'ala ala peeji n'ihi obosara ihe okwu Grik ndị ahụ pụtara.
