review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the temporal phrase, the parabolic sense of κύριος as “nna ukwu,” and δοῦλοι as “ndị ohu.” However, “ha na ya agbakọọkwa ihe ndekọ ego ha” reverses the clause’s subject structure: the master is the one who settles accounts with them. The added possessive “ha” is also less precise than the Greek idiom, which concerns accounting/reckoning with the slaves rather than specifically “their records.”'
  naturalness: “Mgbe ogologo oge gasịrị” is natural Standard Igbo. The revised wording “wee soro ha gbakọọ akaụntụ” is more idiomatic and clearly assigns the action to the master. The footnote is recast in natural, complete Igbo and gives a genuine alternative without awkwardly changing the clause’s structure.
  terminology: “Nna ukwu” is appropriate here for κύριος in its household-parable sense, without treating it as a direct divine title. “Ndị ohu” appropriately retains the bonded-status sense of δοῦλοι. “Gbakọọ akaụntụ” communicates the commercial idiom συναίρει λόγον without imposing a theological interpretation.
  issues:
  - severity: medium
    issue: The main clause makes the slaves appear to be the primary actors in settling the accounts.
    rationale: Greek has ὁ κύριος as the subject of both ἔρχεται and συναίρει. The Igbo wording “ha na ya agbakọọkwa” foregrounds “ha” (the slaves), obscuring that the master initiates and conducts the reckoning.
  - severity: low
    issue: The footnote’s proposed alternative is incomplete and changes the wording in a way that does not clearly correspond to the complete verse.
    rationale: A translation alternative should retain the temporal opening and should offer the relevant lexical alternatives for κύριος and δοῦλοι while preserving the source clause’s roles.
  revised_text: Mgbe ogologo oge gasịrị, nna ukwu ndị ohu ahụ bịara wee soro ha gbakọọ akaụntụ.[a]
