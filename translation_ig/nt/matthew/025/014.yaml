review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the comparison, the traveling man, the calling of his own slaves, and the entrusting of his property. “Ndị ohu” is an appropriate rendering of δούλους in this household-and-property context. The wording should, however, make the participial phrase modify the man more smoothly and retain the emphasis of ἰδίους (“his own”).
  naturalness: The comma-separated construction “otu nwoke, mgbe ọ na-aga njem, kpọrọ” is understandable but stilted in Standard Igbo. Recasting it as “mgbe otu nwoke na-aga njem kpọrọ ...” gives a natural comparative-event construction without changing the sense.
  terminology: “Ndị ohu” appropriately preserves the socially dependent status denoted by δούλους; “ndị na-ejere ya ozi” is suitably retained as a footnoted alternative. “Ihe onwunwe ya” accurately renders τὰ ὑπάρχοντα αὐτοῦ.
  issues:
  - severity: low
    issue: Awkward attachment of the travel phrase
    rationale: 'In the draft, “mgbe ọ na-aga njem” is set between commas after “otu nwoke,” which is less idiomatic than framing the comparison as an event: “mgbe otu nwoke na-aga njem kpọrọ …”.'
  - severity: low
    issue: The emphasis of ἰδίους is understated
    rationale: “Ndị ohu ya” can mean “his slaves,” but “ndị ohu nke ya” more clearly expresses “his own slaves” while remaining natural.
