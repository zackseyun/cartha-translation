- from: N’ihi na ọ dị ka otu nwoke, mgbe ọ na-aga njem, kpọrọ ndị ohu ya[a] ma nyefee ha ihe onwunwe ya.
  to: N’ihi na ọ dị ka mgbe otu nwoke na-aga njem kpọrọ ndị ohu nke ya[a] ma nyefee ha ihe onwunwe ya.
  rationale: The revision smooths the Standard Igbo syntax by expressing the Greek comparison as “ọ dị ka mgbe …,” retains the temporal force of ἀποδημῶν, and uses “ndị ohu nke ya” to represent the emphasis of τοὺς ἰδίους δούλους. The footnote is adjusted only for clarity and keeps the alternative and rationale aligned with the translation.
