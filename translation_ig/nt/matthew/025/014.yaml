id: MAT.25.14
reference: Matthew 25:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own servants and entrusted his possessions to them.
translation:
  language: ig
  text: N’ihi na ọ dị ka mgbe otu nwoke na-aga njem kpọrọ ndị ohu nke ya[a] ma nyefee ha ihe onwunwe ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị na-ejere ya ozi.” Okwu Grik bụ doulos, nke nwere ike ịpụta ohu ma ọ bụ onye na-eje ozi, dabere n’ọnọdụ e ji ya mee ihe. N’ebe a, a họọrọ “ndị ohu” n’ihi na ikike onye nwe ha n’ebe ha na ihe onwunwe ya nọ pụtara ìhè.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: N’ihi na ọ dị ka
  rationale: Ọ na-ewebata ntụnyere na-akọwa okwu bu ya ụzọ; e tinyere “ọ dị” iji mee ka ahịrịokwu ahụ zuo oke ma daa nke ọma n’Igbo.
- source_word: ἄνθρωπος
  choice: otu nwoke
  rationale: N’ime ilu a, aha nwoke dị n’otu na-ezo aka n’otu nwoke kpọmkwem, ọ bụghị mmadụ niile n’ozuzu.
- source_word: ἀποδημῶν
  choice: mgbe ọ na-aga njem
  rationale: Nke a na-egosi na nwoke ahụ na-apụ aga ebe ọzọ; “na-aga njem” bụ okwu Igbo doro anya nke na-adịghị akọwapụta ebe ọ na-aga karịa ihe Grik kwuru.
- source_word: ἐκάλεσεν
  choice: kpọrọ
  rationale: Nke a bụ okwu Igbo nkịtị ma kwụ ọtọ maka ịkpọ ndị nọ n’okpuru ya ka ha bịakwute ya.
- source_word: τοὺς ἰδίους δούλους
  choice: ndị ohu ya
  rationale: “Ndị ohu” na-echekwa ọnọdụ mmekọrịta nke δοῦλος, ebe onye nwe ụlọ nwere ikike n’ebe ha nọ; “ya” na-egosipụta ἰδίους n’ụzọ Igbo si ekwu ya n’enweghị ikwubiga ihe ókè.
- source_word: παρέδωκεν
  choice: nyefee
  rationale: N’ọnọdụ a, okwu ahụ pụtara inyefe ihe n’aka ha ka ha lekọta ya ma buru ibu ọrụ banyere ya.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: ihe onwunwe ya
  rationale: Nkebiokwu a na-ezo aka n’ihe nwoke ahụ nwere; “ihe onwunwe ya” doro anya ma dabara n’ọnọdụ akụ na ụba nke ilu ahụ.
theological_decisions:
- issue: Otú e si sụgharịta δοῦλος n’ezinụlọ nke ilu a
  choice: ndị ohu
  alternative: ndị na-ejere ya ozi
  rationale: A họọrọ “ndị ohu” ka a ghara ime ka ọnọdụ ha na ikike nna ha ukwu n’ebe ha nọ dị nro karịa ihe okwu Grik na-egosi. Ihe odide ahụ n’onwe ya anaghị ekwu na ha bụ naanị ndị ọrụ e goro ego.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi “mgbe ọ na-aga njem” na-eme ka participle Grik daa nke ọma n’Igbo, ebe “nyefee” na-egosi inyefe ihe tinyere ibu ọrụ ilekọta ya.
