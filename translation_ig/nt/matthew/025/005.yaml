  yaml_path: translation/nt/matthew/025/005.yaml
  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: ig
  text: Ma mgbe nwoke ahụ na-alụ nwanyị nọ na-egbu oge[a], ụra malitere ịtụ ha niile, ha wee daa n’ụra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe nwoke ahụ na-alụ nwanyị nọ na-ewe ogologo oge ịbịa.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ụra malitere ịtụ ha niile, ha nọkwa n’ụra.” Asụsụ Grik na-ekewapụta ịmalite ịda ụra (ἐνύσταξαν) na ịnọ n’ụra, ya bụ, ịdị na-ehi ụra (ἐκάθευδον).
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: nọ na-egbu oge
  rationale: Nke a na-egosi na ọ na-ewe ogologo oge karịa ka a tụrụ anya ya, ma na-edobe ọrụ participle ahụ n’ụdị okwu Igbo dị mfe.
- source_word: δὲ
  choice: Ma
  rationale: '“Ma” na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n’akụkọ ahụ: a tụrụ anya ọbịbịa nwoke ahụ, ma ọ nọ na-egbu oge.'
- source_word: νυμφίου
  choice: nwoke ahụ na-alụ nwaanyị
  rationale: Nke a na-akọwapụta νυμφίος n’Igbo nkịtị dịka nwoke bụ onye a na-alụ n’emume agbamakwụkwọ, na-etinyeghị nkọwa Kraịst n’ime amaokwu ahụ.
- source_word: ἐνύσταξαν
  choice: ụra malitere ịtụ ha
  rationale: Nkebiokwu a na-edobe echiche ingressive nke ịmalite ịda ụra tupu ha arahụ ụra n’ezie.
- source_word: πᾶσαι
  choice: ha niile
  rationale: Ọ na-ezo aka n’ụmụ agbọghọ iri ahụ niile, ma na-edobe nkwupụta zuru ezu nke πᾶσαι.
- source_word: ἐκάθευδον
  choice: ha wee rahụ ụra
  rationale: Nke a na-egosi nzọụkwụ sitere n’ụra ịtụ ha ruo n’ịrahụ ụra. Ebe imperfect Grik nwekwara ike ịpụta ọnọdụ na-aga n’ihu, e debere nhọrọ ahụ n’akwụkwọ ntụaka.
theological_decisions:
- issue: Ihe atụ nke νυμφίος n’ilu ahụ
  choice: Idowe ya dịka “nwoke ahụ na-alụ nwaanyị” n’akụkọ ahụ, n’enweghị ịkpọ ya Kraịst kpọmkwem.
  alternative: Ịsụgharị ya n’ụzọ ga-akọwa ya ozugbo dịka ihe atụ nke Kraịst.
  rationale: Amaokwu ahụ na-enye ihe oyiyi agbamakwụkwọ n’ilu. Ọ bụ ezie na ihe oyiyi a nwere mkpa nkà mmụta okpukpe n’ọdịnaya Matiu, nsụgharị ekwesịghị itinye nkọwa ahụ n’ime amaokwu n’onwe ya.
translation_notes:
  register: 'Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. A họọrọ “nwoke ahụ na-alụ nwaanyị” kama okwu a gbazitere ma ọ bụ okwu chọọchị pụrụ iche, ka ihe oyiyi agbamakwụkwọ doo onye na-agụ anya. E debere usoro abụọ nke ụra: ụra malitere ịtụ ha, ha wee rahụ ụra.'
