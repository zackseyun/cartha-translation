revisions:
- from: Ma mgbe nwoke ahụ na-alụ nwaanyị nọ na-egbu oge[a], ụra malitere ịtụ ha niile, ha wee rahụ ụra[b].
  to: Ma mgbe nwoke ahụ na-alụ nwanyị nọ na-egbu oge[a], ụra malitere ịtụ ha niile, ha wee daa n’ụra[b].
  rationale: The revision preserves the source’s temporal genitive absolute and the contrast between becoming drowsy and sleeping. It improves Standard Igbo orthography and replaces an awkward footnote alternative with wording that more accurately reflects the ongoing force of the Greek imperfect, without requiring that nuance in the main idiomatic rendering.
  reviewer_model: gpt-5.6-terra
