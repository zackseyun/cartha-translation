translation:
  language: ig
  text: Ma ndị nwere uche were mmanụ n’arịa ha soro oriọna ha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “tọọchị” kama “oriọna” (Grik: lampadas); okwu a nwere ike ịpụta tọọchị ma ọ bụ oriọna, dabere n’ọnọdụ ya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: ndị nwere uche
  rationale: Nke a na-egosi amamihe bara uru na ezi mkpebi, ma na-edowe ọdịiche dị n’etiti ha na ndị nzuzu n’akụkọ a, n’akọwaghị okwu ahụ nanị dị ka ‘ndị jikere.’
- source_word: ἔλαβον
  choice: were
  rationale: N’akụkọ a, okwu ahụ pụtara na ha were ihe ahụ soro onwe ha, ọ bụghị na ha natara ya n’aka onye ọzọ.
- source_word: ἔλαιον
  choice: mmanụ
  rationale: Okwu Grik ahụ pụtara mmanụ, nke na-abụkarị mmanụ oliv, ma amaokwu a achọghị ka a kọwaa ụdị mmanụ ahụ kpọmkwem.
- source_word: ἀγγείοις
  choice: arịa
  rationale: ‘Arịa’ bụ okwu sara mbara nke na-adịghị ekwu kpọmkwem ọdịdị ma ọ bụ ihe e ji mee ihe e tinyere mmanụ n’ime ya.
- source_word: λαμπάδων
  choice: oriọna
  rationale: Okwu Grik a nwere ike ịpụta oriọna ma ọ bụ ọwa; ‘oriọna’ dabara nke ọma na mmanụ e kwuru maka ya, ebe e debere nhọrọ ọzọ n’okpuru peeji.
- source_word: ἑαυτῶν
  choice: ha
  rationale: Nnochiaha a na-egosi na oriọna ndị ahụ bụ nke ha; Igbo na-egosipụta nke a n’ụzọ ebumpụta ụwa site n’ịsị ‘oriọna ha.’
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: ya na oriọna ha
  rationale: Nke a na-egosi na ha were mmanụ ahụ soro oriọna ha, ma na-anọgide nkenke ma dị mfe nghọta.
