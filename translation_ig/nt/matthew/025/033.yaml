id: MAT.25.33
reference: Matthew 25:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/033.yaml
  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: ig
  text: Ọ ga-edobe atụrụ nʼaka nri ya[b], ma debe ụmụ ewu nʼaka ekpe ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ewu nta.” Okwu Grik bụ ἐρίφια.
    reason: lexical_alternative
  - marker: b
    text: Nʼụzọ nkịtị, Grik sịrị “site nʼaka nri ... site nʼaka ekpe”; nke a bụ akpaala okwu pụtara idowe nʼakụkụ aka nri na nʼakụkụ aka ekpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσει
  choice: ga-edobe
  rationale: Ngwaa a bụ ọdịnihu nke ἵστημι ma nʼebe a ọ pụtara ime ka ihe guzoro nʼọnọdụ, ya bụ idowe ya. “Ga-edobe” bụ Igbo doro anya ma dabara nʼọnọdụ onye ọzụzụ atụrụ na-ekewa anụmanụ.
- source_word: πρόβατα
  choice: atụrụ
  rationale: πρόβατα bụ okwu nkịtị maka atụrụ; ebe a ọ na-ezo aka nʼìgwè ahụ e kwuburu okwu ya.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: nʼaka nri ya
  rationale: Nkebiokwu Grik a na-egosi ọnọdụ nʼakụkụ aka nri ya. Okwu Igbo “nʼaka nri ya” na-egosi ọnọdụ ahụ nʼụzọ ebumpụta ụwa ma ghara ịgbakwunye nkọwa ihe atụ.
- source_word: ἐρίφια
  choice: ụmụ ewu
  rationale: ἐρίφια na-ezo kpọmkwem nʼewu nta ma ọ bụ ụmụ ewu. “Ụmụ ewu” na-echekwa nkọwa afọ dị na okwu Grik ma bụrụkwa okwu Igbo a na-aghọta ngwa ngwa.
- source_word: ἐξ εὐωνύμων
  choice: nʼaka ekpe ya
  rationale: Nkebiokwu a pụtara nʼakụkụ aka ekpe. Ọ bụ ezie na αὐτοῦ adịghị emegharị nʼakụkụ nke abụọ nʼasụsụ Grik, itinye “ya” nʼIgbo na-eme ka ntụnyere aka nri na aka ekpe doo anya.
- source_word: μὲν ... δὲ
  choice: ma
  rationale: Ụdị μὲν ... δὲ na-egosi ọdịiche dị nʼetiti ìgwè abụọ ahụ. “Ma” na-egosipụta ọdịiche ahụ nʼIgbo nʼụzọ dị mfe ma kwesị ekwesị.
theological_decisions:
- issue: Ma a ga-akọwa ihe atụ nke aka nri na aka ekpe nʼime ntụgharị ahụ
  choice: 'Igosipụta naanị ọnọdụ: “nʼaka nri ya ... nʼaka ekpe ya”'
  alternative: Ịgbasa ya ka ọ bụrụ “nʼọnọdụ ihuọma ... nʼọnọdụ enweghị ihuọma”
  rationale: Amaokwu ahụ nʼonwe ya kwuru banyere idowe ìgwè abụọ ahụ nʼakụkụ abụọ nʼoge ikpe. Ọ bụ ezie na ọnọdụ ndị a nwere ihe ha na-anọchi anya nʼakụkọ ahụ, ịkọwa ha dị ka ihuọma na enweghị ihuọma nʼime ederede ga-agbakwunye nkọwa na-adịghị nʼokwu Grik.
translation_notes:
  register: Ejiri Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ntụnyere doro anya nʼetiti atụrụ na ụmụ ewu, yana aka nri na aka ekpe, nʼetinyeghị nkọwa ozizi ọzọ.
