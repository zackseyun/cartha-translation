  verdict: revise
  source_fidelity: 'The core rendering preserves the Greek well: δέ is represented by “Ma,” the solemn formula Ἀμὴν λέγω ὑμῖν by “N’ezie, ana m agwa unu,” and οὐκ οἶδα ὑμᾶς by “amaghị m unu.” However, the explicit object “ha” after “zara” is not expressed in the Greek text. Though inferable from context, it is unnecessary in this compact saying and prompted an imprecise explanatory footnote.'
  naturalness: “Ma ọ zara sị” is natural Standard Igbo narrative style before direct speech. “N’ezie, ana m agwa unu, amaghị m unu” is clear, idiomatic, and retains the grave register appropriate to the saying.
  terminology: “N’ezie” suitably conveys the emphatic introductory Ἀμήν without importing interpretation. “Amaghị m unu” is the appropriately direct equivalent of “I do not know you”; it should not be expanded in the main text to relational or doctrinal language. “Unu” correctly maintains the Greek plural.
  issues:
  - severity: low
    issue: The draft adds “ha” (‘them’) to the narrative introduction and attaches a footnote defending that addition.
    rationale: The Greek has no expressed object with ἀποκριθεὶς εἶπεν. Context supplies the addressees, but Standard Igbo does not require “ha” here. Removing it more closely follows the source and eliminates a footnote whose wording about Greek grammar is not sufficiently precise.
