  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: ig
  text: Ma ọ zara sị, “N’ezie, ana m agwa unu, amaghị m unu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Ma ọ zara ha sị
  rationale: Usoro participle na ngwaa a bụ ụzọ akụkọ si ekwu na ọ zara. Igbo nkịtị na-eji “ọ zara ha sị” egosipụta azịza na okwu so ya; “Ma” na-egosi ọdịiche dị n’etiti arịrịọ ha na azịza ya.
- source_word: Ἀμὴν
  choice: N’ezie
  rationale: N’usoro okwu a Jizọs ji emesi ihe ọ na-ekwu ike, “N’ezie” doro ndị na-agụ Igbo anya ma debe ịdị arọ nke okwu ahụ.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a bụ ntụgharị Igbo dị ndụ nke na-edebe onye na-ekwu okwu, ndị ọ na-agwa, na ịdị nsọpụrụ nke nkwupụta ahụ.
- source_word: οὐκ οἶδα
  choice: amaghị m
  rationale: Nke a na-edebe ihe οἶδα pụtara n’ụzọ kwụ ọtọ. N’ọnọdụ a, ọ pụkwara ịpụta na ọ naghị amata ma ọ bụ anabata ha dịka ndị ya, ma isi ederede anaghị akọwa ya karịa otú ahụ.
- source_word: ὑμᾶς
  choice: unu
  rationale: “Unu” na-egosi nke ọma na nnọchiaha Grik a bụ ọtụtụ mmadụ.
theological_decisions:
- issue: Ihe “amaghị m unu” pụtara n’ilu a
  choice: E debere okwu dị mfe ma dị arọ, “amaghị m unu,” n’isi ederede.
  alternative: “Anaghị m amata unu” ma ọ bụ “ọ dịghị mmekọrịta dị n’etiti mụ na unu.”
  rationale: Okwu ahụ na-egosi ịjụ ha na enweghị nnabata n’ọnọdụ akụkọ a, ma ịgbasa ya gaa n’okwu ozizi zuru ezu ga-etinye ihe Grik na-ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. E debere “unu” iji gosi plural nke Grik, ma e zere ịgbasa okwu ahụ ka ọ bụrụ nkọwa ozizi.
