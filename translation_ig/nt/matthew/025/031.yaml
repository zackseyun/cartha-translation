id: MAT.25.31
reference: Matthew 25:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: ig
  text: Ma mgbe Nwa nke Mmadụ ga-abịa n’ebube ya, ndị mmụọ ozi niile ga-eso ya, mgbe ahụ ọ ga-anọdụ ala n’ocheeze ya dị ebube.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka okwu Grik si dị kpọmkwem, “ocheeze nke ebube ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Ma mgbe
  rationale: “Mgbe” na-egosi otu ihe ga-eme n’ọdịnihu, ebe “Ma” na-egosi mgbanwe dị nro n’ihe Jizọs na-akọ.
- source_word: ἔλθῃ
  choice: ga-abịa
  rationale: Ọ bụ ihe ga-eme n’ọdịnihu; usoro a doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: A hapụrụ ya dịka aha pụrụ iche Jizọs ji akpọ onwe ya, ka njikọ ya na Daniel 7 na ibu Kraịst dị n’okwu ahụ ghara ịla n’iyi.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: n’ebube ya
  rationale: “Ebube” na-egosi ịdị ukwuu, nsọpụrụ na ọmarịcha ọchịchị pụtara ìhè.
- source_word: πάντες οἱ ἄγγελοι μετ’ αὐτοῦ
  choice: ndị mmụọ ozi niile esoro ya
  rationale: Nke a na-edebe “ndị mmụọ ozi niile” n’enweghị itinye “nke ya,” nke na-adịghị n’ihe odide Grik, ma na-egosikwa na ha so ya.
- source_word: τότε καθίσει
  choice: mgbe ahụ ka ọ ga-anọkwasị
  rationale: “Mgbe ahụ” na-egosi usoro ihe ndị a, “ga-anọkwasị” na-egosikwa omume ịnọ n’ocheeze n’ụzọ dị ebube ma doo anya.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: n’ocheeze ya dị ebube
  rationale: Nke a bụ Igbo dị mfe ma dị ugbu a maka usoro genitive Grik ahụ, ma na-edebe echiche nke ocheeze e ji ebube ya mara.
theological_decisions:
- issue: Aha Kraịst ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: Aha ọdịnala a na-echekwa njikọ ya na Daniel 7 na ọrụ Mesaịa na Onyeikpe, kama ịkọwa ya n’ụzọ ga-eme ka ihe okwu ahụ pụtara dị warara.
- issue: Nkọwa θρόνου δόξης αὐτοῦ
  choice: ocheeze ya dị ebube
  alternative: ocheeze nke ebube ya
  rationale: Nhọrọ mbụ bụ Igbo dị ndụ ma doo anya; e debere ụdị nke na-eso usoro okwu Grik nso karịa n’ala ala peeji ka nghọta na nyocha ghara ifu.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta mee ya. A hapụrụ aha “Nwa nke Mmadụ” na okwu “ebube” n’ihi ụda na njikọ Akwụkwọ Nsọ ha; e zere ịgbakwunye “ndị mmụọ ozi ya,” ebe “ya” adịghị n’akụkụ okwu ahụ n’ihe odide Grik.
