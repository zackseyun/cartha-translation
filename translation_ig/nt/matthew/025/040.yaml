id: MAT.25.40
reference: Matthew 25:40
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: ig
  text: Eze ahụ ga-aza ha sị, “N’ezie, ana m agwa unu[a], ruo n’ókè unu mere ya nye otu n’ime ụmụnne m ndị a, ndị kasị nta[b], unu mere ya nye m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara nnọọ n’okwu mbụ, “Amen, ana m agwa unu.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a sụgharịrị “ụmụnne” dị n’ụdị ọtụtụ nke nwoke. “Ụmụnne m ndị a, ndị kasị nta” nwere ike izo aka kpọmkwem na ndị na-eso ụzọ Jizọs, n’ebe ndị kwere ekwe nọ n’ozuzu, ma ọ bụ n’ụzọ sara mbara karị na ndị na-adịghị ike ma ọ bụ ndị nọ ná mkpa. Nsụgharị ahụ edobela okwu ahụ n’ekpebighị ajụjụ nkọwa a.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἐρεῖ
  choice: ga-aza ha sị
  rationale: Ngwakọta participle ἀποκριθείς na future ἐρεῖ pụtara ịza ma kwuo; “ga-aza ha sị” bụ ụzọ Igbo si ekwu ya nke ọma ma na-edobe ma nzaghachi ma okwu na-esochi.
- source_word: ὁ βασιλεὺς
  choice: Eze ahụ
  rationale: “Eze” na-edobe aha ọchịchị dị na Grik; “ahụ” na-egosi onye a kpọtụrụla aha n’akụkọ ahụ.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: N’ezie, ana m agwa unu
  rationale: Nke a na-ebute ike nke usoro okwu nkwenye ahụ n’Igbo doro anya ma dị ùgwù; e debere “Amen” dịka nhọrọ n’okpuru ala peeji.
- source_word: ἐφ’ ὅσον
  choice: ihe unu mere
  rationale: N’ebe a, usoro okwu a na-ezo aka n’omume ndị ahụ e mere n’ókè ọ bụla nye otu onye n’ime ìgwè ahụ. “Ihe unu mere” bụ Igbo sitere n’okike ma na-ezere okwu siri ike “ruo n’ókè” nke nwere ike ime ka ahịrịokwu ghara ịdị mfe.
- source_word: ἐποιήσατε
  choice: unu mere … unu mere ya
  rationale: Nkwughachi a na-edobe nhata dị n’etiti ihe e mere nye onye ahụ na ihe e mere nye Eze; “ya” na nke abụọ na-eme ka Igbo doo anya.
- source_word: ἑνὶ τούτων
  choice: nye otu onye n’ime … ndị a
  rationale: “Otu onye” na-edobe ike nke ἑνί, ebe “n’ime … ndị a” na-egosi na onye ahụ so n’ìgwè a kapịrị ọnụ.
- source_word: τῶν ἀδελφῶν μου
  choice: ụmụnne m ndị a
  rationale: “Ụmụnne” bụ okwu Igbo nkịtị maka ndị otu ezinụlọ ma ọ bụ ndị nwere njikọ ime mmụọ. Okwu Igbo a anaghị ekewa nwoke na nwanyị n’ụdị plural, ya mere ọ naghị ekwe omume idobe ụdị nwoke plural nke Grik n’enweghị ịgbakwunye nkọwa na-adịghị n’okwu ahụ.
- source_word: τῶν ἐλαχίστων
  choice: ndị kasị nta n’etiti
  rationale: Nke a na-edobe superlative ahụ na-enweghị ikpebi ma ‘nta’ ọ̀ bụ n’ọnọdụ mmadụ, n’ọha, ma ọ bụ n’ụzọ ọzọ.
- source_word: ἐμοὶ
  choice: nye m
  rationale: “Nye m” na-anọchi dative ahụ ozugbo ma na-edobe njirimara siri ike n’etiti omume e mere nye ụmụnne ahụ na nke e mere nye Eze.
theological_decisions:
- issue: Ndị okwu “ụmụnne m ndị a” na-ezo aka na ha
  choice: E debere okwu ahụ dịka “ụmụnne m ndị a” n’ebughị ụzọ kọwaa ndị ọ bụ kpọmkwem.
  alternative: Ịkọwa ha dịka ndị na-eso ụzọ Jizọs, ndị kwere ekwe n’ozuzu, ma ọ bụ ndị nọ ná mkpa na ndị na-enweghị onye enyemaka.
  rationale: Amaokwu ahụ n’onwe ya ekpebighị esemokwu nkọwa a. Idebe okwu isi mmalite ahụ na-ahapụ nghọta dị iche iche o nwere n’emeghe.
- issue: Ụdị nwoke plural nke ἀδελφῶν
  choice: ụmụnne
  alternative: ụmụnne nwoke
  rationale: N’Igbo, “ụmụnne” bụ okwu plural sitere n’okike nke na-asụgharị ἀδελφοί n’ọnọdụ mmekọrịta ma ọ bụ okwukwe; “ụmụnne nwoke” ga-etinye nkwusi ike n’ụdị nwoke nke okwu Grik ebe okwu Igbo nkịtị anaghị achọ ya, ma nwee ike ime ka nkọwa a na-arụrịta ụka bụrụ nke e kpebiri tupu oge eruo.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ga-aza ha sị” na “N’ezie, ana m agwa unu” bụ usoro okwu nkịtị n’Igbo; e zere ntụgharị siri ike nke ga-eme ka ahịrịokwu ahụ ghara ịdị n’okike. Akara ala peeji [a] dị n’usoro nkwenye ọ na-akọwa, ebe [b] dị n’akụkụ “ụmụnne m ndị a.”
