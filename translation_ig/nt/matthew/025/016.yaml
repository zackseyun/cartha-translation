  verdict: revise
  source_fidelity: The draft accurately represents the participial sequence ('gara'), the servant identified by the five talents received, the active use of the talents, and the additional five gained. It appropriately does not add 'at once,' which is not stated in the Greek. The verb 'rite' is less suitable here because it can suggest receiving or inheriting rather than gaining/profiting; 'nweta' is clearer for ἐκέρδησεν in this context.
  naturalness: The sentence is clear Standard Igbo. Replacing 'rite talent ise ọzọ' with 'nweta talent ise ọzọ' produces more natural and immediately comprehensible wording in this commercial context.
  terminology: ‘Talent’ is correctly retained as a historical monetary unit, with a useful cultural footnote that distinguishes it from an innate ability. ‘Jiri ha rụọ ọrụ’ preserves the source's broader expression without unnecessarily limiting it to trading.
  issues:
  - severity: low
    issue: ‘rite talent ise ọzọ’ may be understood as receiving or inheriting rather than gaining a profit.
    rationale: κέρδος-language in this verse concerns gain/profit resulting from the servant's use of the money. ‘Nweta’ is the more direct and natural Igbo expression here.
  revised_text: Onye ahụ natara talent ise ahụ[b] gara jiri ha rụọ ọrụ[a], wee nweta talent ise ọzọ.
