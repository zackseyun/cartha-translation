id: MAT.25.16
reference: Matthew 25:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: ig
  text: Onye ahụ natara talent ise ahụ[b] gara jiri ha rụọ ọrụ[a], wee nweta talent ise ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “gara were ha zụọ ahịa”; okwu Grik na-egosi na o ji ego ahụ rụọ ọrụ iji nweta uru.
    reason: lexical_alternative
  - marker: b
    text: Talent bụ nnukwu ihe e ji atụ ego n’oge ahụ; ọ bụghị nkà ebumpụta ụwa mmadụ nwere.
    reason: cultural_note
lexical_decisions:
- source_word: πορευθεὶς
  choice: gara
  rationale: Ụdị participle a na-egosi na ọ gara mee ihe sochirinụ. “Gara” bụ okwu Igbo dị mfe ma kwesị ntụkwasị obi; etinyeghị “ozugbo,” n’ihi na okwu Grik ekwughị ya kpọmkwem.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: Onye ahụ natara talent ise ahụ
  rationale: Nke a na-akọwa ohu ahụ site n’ihe ọ natara, dịka articular participle nke Grik si eme, n’ebughị ụzọ tinye nkọwa nwoke ọzọ na-adịghị mkpa.
- source_word: τάλαντα
  choice: talent
  rationale: E debere aha otu nnukwu ego oge ahụ, kama ịgbanwe ya ka ọ bụrụ nkà mmadụ. Ihe odide ala ala kọwara ihe ọ pụtara n’ebe a.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: jiri ha rụọ ọrụ
  rationale: Nke a na-anọ nso n’ụzọ Grik si kwuo ya ma na-egosi na o jiri ego ahụ mee ihe. Ihe odide ala ala na-eme ka ebumnuche inweta uru doo anya n’enweghị ịmanye nkọwa kpọmkwem dịka naanị ịzụ ahịa.
- source_word: ἐκέρδησεν
  choice: rite
  rationale: “Rite” na-egosi inweta ihe ọzọ dịka uru ma kwekọọ na κερδαίνω n’ọnọdụ azụmahịa a.
- source_word: ἄλλα πέντε
  choice: talent ise ọzọ
  rationale: E kwughachiri “talent” maka nghọta doro anya n’Igbo, ebe “ise ọzọ” n’asụsụ Grik na-ezo aka na talent ise ọzọ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu. Ahịrịokwu ahụ na-edebe usoro omume dị na Grik, na-enweghị ịgbakwunye echiche “ozugbo” nke na-adịghị n’okwu ahụ kpọmkwem.
