  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄρατε οὖν ἀπ’ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/028.yaml
  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: ig
  text: Ya mere, napụnụ talent ahụ n'aka ya[a], nyenụ onye nwere talent iri ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “wepụnụ talent ahụ n'aka ya.” Ngwaa Grik ahụ nwere ike ịpụta ịnara ihe ma ọ bụ iwepụ ya n'aka onye ahụ.
    reason: lexical_alternative
  - marker: b
    text: “Talent” bụ nnukwu otu ibu e ji atụ ihe; n'oge ochie, a na-ejikwa ya egosi ego bara nnukwu uru.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: napụnụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ, nke pụtara iwepụ ihe n’aka mmadụ. “Napụnụ” bụ okwu Igbo dị nkenke ma doo anya maka iwepụ ihe o nwere.
- source_word: οὖν
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu sitere n’ikpe e kwuru tupu nke a.
- source_word: ἀπ’ αὐτοῦ
  choice: ya
  rationale: N’ime ngwaa “napụnụ ya,” nnọchiaha a na-egosi onye a ga-ewepụ talent ahụ n’aka ya n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: τὸ τάλαντον
  choice: talent ahụ
  rationale: E debere aha ihe atụ ọnụahịa oge ochie ahụ kama ịkọwa ya naanị dị ka ego; “ahụ” na-egosi talent ahụ a kpọtụrụla aha.
- source_word: δότε
  choice: nyekwa
  rationale: Ọ na-edebe ike iwu nke δότε, ebe njikọ “-kwa” na-ejikọta iwu nke abụọ na nke mbụ n’ụzọ e ji asụ Igbo nke ọma.
- source_word: τῷ ἔχοντι
  choice: onye nwere
  rationale: Nke a na-egosipụta participle e ji mee aha mmadụ n’ụzọ dị mfe ma bụrụ Igbo nke oge a.
- source_word: τὰ δέκα τάλαντα
  choice: talent iri ahụ
  rationale: “Ahụ” na-edebe nkọwa article Grik nke na-atụ aka n’ego iri ahụ a kpọtụrụla aha.
theological_decisions:
- issue: Ihe τάλαντον pụtara n’ilu a
  choice: E ji “talent” mee aha otu ibu na ego buru ibu e ji eme ihe n’oge ochie.
  alternative: ego; nnukwu ego
  rationale: Nke a na-edebe ihe akụkọ ihe mere eme ahụ pụtara ma ghara ịkọwa ya dị ka onyinye ebumpụta ụwa. Ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ ihe bara uru dị ka ego.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro iwu abụọ ahụ na njikọ nkwubi okwu nke Grik. A haziri nnọchiaha ikpeazụ “ya” ka o doo anya na a ga-enye onye ahụ talent e napụrụ onye mbụ.
