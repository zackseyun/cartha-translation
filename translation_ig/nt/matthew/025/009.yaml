id: MAT.25.9
reference: Matthew 25:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: ig
  text: Ma ndị nwere uche zara sị, “Mba; o nwere ike ọ gaghị ezuru anyị na unu. Kama, gakwuurunụ ndị na-ere ya, zụrụnụ ya maka onwe unu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: zara
  rationale: Ngwaa a bụ okwu nkịtị e ji akọ na mmadụ nyere nzaghachi n'okwu a gwara ya.
- source_word: αἱ φρόνιμοι
  choice: ndị nwere uche
  rationale: Ọ na-egosi ụmụ agbọghọ ahụ gosipụtara amamihe na ezi ịtụle ihe; ntụgharị a dị mfe ma ghara ịtinye aha ọzọ n'ebe Grik ji nkọwa dị ka aha.
- source_word: λέγουσαι
  choice: sị
  rationale: N'Igbo, “zara sị” bụ ụzọ ebumpụta ụwa isi jikọta nzaghachi na okwu e kwuru.
- source_word: Μήποτε οὐ μὴ ἀρκέσῃ
  choice: Mba, ka ọ ghara ịbụ na ... agaghị ezuru
  rationale: “Mba” na-eme ka ọjụjụ dị n'okwu ahụ pụta ìhè, ebe usoro “ka ọ ghara ịbụ na ... agaghị ezuru” na-echekwa nchegbu siri ike nke μήποτε tinyere nkwuwa okwu οὐ μή.
- source_word: ἀρκέσῃ
  choice: agaghị ezuru
  rationale: “Izuru” bụ okwu Igbo doro anya maka ihe ịbụ nke ga-ezu ndị chọrọ ya.
- source_word: ἡμῖν καὶ ὑμῖν
  choice: anyị na unu
  rationale: Ọ na-echekwa ndị otu abụọ mmanụ ahụ ga-ezuru ma ọ bụ ghara izuru.
- source_word: πορεύεσθε
  choice: gaanụ
  rationale: Iwu a bụ nke ọtụtụ mmadụ, ya mere “gaanụ” dabara adaba.
- source_word: μᾶλλον
  choice: Kama
  rationale: Ọ na-egosi ihe ọzọ ka mma ha kwesịrị ime n'ọnọdụ ịkekọrịta mmanụ.
- source_word: πρὸς τοὺς πωλοῦντας
  choice: na nke ndị na-ere ya
  rationale: Nke a bụ usoro Igbo nkịtị maka ịga n'ebe ndị na-ere ihe nọ; “ya” na-ezo aka n'ụzọ doro anya n'ebe mmanụ ahụ nọ na mkparịta ụka.
- source_word: ἀγοράσατε
  choice: zụtara
  rationale: Ọ bụ iwu nye ọtụtụ mmadụ ka ha zụọ ihe.
- source_word: ἑαυταῖς
  choice: onwe unu
  rationale: Ọ na-echekwa ike nnọchiaha nlaghachi nke pụtara na ha ga-azụta ya maka mkpa nke ha.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ndị nwere uche” na-aga n'ihu n'ụzọ ebumpụta ụwa dịka aha nkọwa maka ndị e kwuru okwu ha na amaokwu ndị bu ụzọ. E tinyere “mmanụ ahụ” na “ya” dịka ihe doro anya site n'ọnọdụ ilu ahụ, ọ bụghị dịka nkọwa ozizi.
