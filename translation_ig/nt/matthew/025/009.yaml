    text: 'Ụfọdụ ihe odide Grik nwere nkwughachi nkwụsị ike, nke na-eme ka nchegbu ahụ sikwuo ike: “ka ọ ghara ịbụ na ọ gaghị ezuru anyị na unu.”'
    reason: textual_variant
