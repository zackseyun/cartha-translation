revisions:
- from: Ma ndị nwere uche zara sị, “Mba, ka ọ ghara ịbụ na mmanụ ahụ agaghị ezuru anyị na unu. Kama, gaanụ na nke ndị na-ere ya, zụtara onwe unu.”
  to: Ma ndị nwere uche zara sị, “Mba; o nwere ike ọ gaghị ezuru anyị na unu. Kama, gakwuurunụ ndị na-ere ya, zụrụnụ ya maka onwe unu.”
  rationale: The revision corrects the movement expression and the plural imperative, retains the contextual reference to oil, and expresses the concern about insufficiency in natural modern Standard Igbo. A textual-variant footnote preserves the uncertainty signaled by the brackets around οὐ μή in the SBLGNT without forcing a disputed degree of emphasis into the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:15Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the wise women, their refusal, the concern that the oil will be insufficient for both groups, and the two plural commands. However, “na nke ndị na-ere ya” is not idiomatic for movement toward sellers, and “zụtara” is not the plural imperative required by ἀγοράσατε. The textual uncertainty marked by brackets around οὐ μή should not be represented as an unqualified emphatic construction without a note.
  naturalness: “Ndị nwere uche zara sị” is natural Standard Igbo. “Gakwurunụ ndị na-ere ya” is the natural expression for going to sellers, and “zụrụnụ ya maka onwe unu” supplies the understood oil naturally while preserving the reflexive sense.
  terminology: “Ndị nwere uche” is a suitable contextual rendering of αἱ φρόνιμοι. “Mmanụ ahụ,” “ezuru,” and “maka onwe unu” are clear and appropriate. The revision uses correct imperative plural forms.
  issues:
  - severity: high
    issue: The phrase “na nke ndị na-ere ya” is structurally and idiomatically unsuitable after the command “gaanụ.”
    rationale: πρὸς τοὺς πωλοῦντας directs the women to the sellers. Standard Igbo naturally expresses this as “gakwurunụ ndị na-ere ya,” not “gaa na nke ndị na-ere ya.”
  - severity: high
    issue: “Zụtara” does not render the imperative plural ἀγοράσατε.
    rationale: “Zụtara” is a completed-action form, whereas the Greek is a direct plural command. “Zụrụnụ” correctly gives the imperative plural.
  - severity: medium
    issue: The draft gives no indication that the emphatic negation οὐ μή is bracketed in the cited Greek edition.
    rationale: Because the source marks these words as textually uncertain, a footnote should report the variant rather than treating the stronger wording as wholly undisputed.
  revised_text: Ma ndị nwere uche zara sị, “Mba; o nwere ike ọ gaghị ezuru anyị na unu. Kama, gakwuurunụ ndị na-ere ya, zụrụnụ ya maka onwe unu.”
  revised_footnotes:
