  verdict: revise
  source_fidelity: The draft correctly renders the comparative force of ὡσαύτως, the contextual reference to the servant associated with two talents, the gain expressed by ἐκέρδησεν, and the additional quantity in ἄλλα δύο. Rendering the elliptical subject with ‘natara talent abụọ’ is justified by the immediate context and corresponds to the English audit alternative.
  naturalness: ‘N’otu aka ahụ’ and ‘ritere talent abụọ ọzọ’ are natural Standard Igbo. The draft’s ‘onye nke ahụ e nyere talent abụọ’ is unnecessarily cumbersome, and the footnote’s ‘onye nke ahụ ji talent abụọ’ is not idiomatic grammatical phrasing.
  terminology: ‘talent’ should be retained as the conventional term for the monetary unit in this parable. ‘Ritere’ suitably conveys gain in the financial context without introducing a particular method of profit.
