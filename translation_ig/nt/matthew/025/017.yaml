  text: Likewise[a], the one with the two gained two more.
translation:
  language: ig
  text: N’otu aka ahụ[a], onye ahụ natara talent abụọ ritere talent abụọ ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’otu ụzọ ahụ, onye ahụ natara talent abụọ ritere talent abụọ ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: N’otu aka ahụ
  rationale: Ọ na-ejikọta ihe ohu a mere na nke ohu bu ya ụzọ mere n’amaokwu nke 16, ma na-edobe echiche nke ime otu ihe ahụ.
- source_word: ὁ τὰ δύο
  choice: onye nke ahụ e nyere talent abụọ
  rationale: Nkebi Grik ahụ dị nkenke ma na-ezo aka n’ohu ahụ e nyere talent abụọ n’amaokwu ndị bu ụzọ; ịkọwa ya otu a na-eme ka Igbo doo anya n’enweghị itinye echiche ọhụrụ.
- source_word: ἐκέρδησεν
  choice: ritere
  rationale: N’ọnọdụ azụmahịa a, okwu ahụ pụtara inweta ihe ọzọ site n’iji ego ahụ rụọ ọrụ; “ritere” bụ okwu Igbo doro anya nke na-adịghị egosi na ọ bụ ụgwọ ọrụ.
- source_word: ἄλλα δύο
  choice: talent abụọ ọzọ
  rationale: Ọ pụtara talent abụọ ọzọ nke otu ụdị ahụ; ikwughachi “talent” na-eme ka ihe a na-agụ ọnụ doo anya n’Igbo.
