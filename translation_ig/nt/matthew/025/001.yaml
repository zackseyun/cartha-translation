id: MAT.25.1
reference: Matthew 25:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: ig
  text: Mgbe ahụ, alaeze eluigwe ga-adị ka ụmụ agbọghọ iri na-amaghị nwoke[a]. Ha were oriọna ha[b] pụọ izute nwoke na-alụ nwanyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsị, “a ga-eji alaeze eluigwe tụnyere ụmụ agbọghọ iri na-amaghị nwoke.” Ngwaa Grik ahụ dị n''ụdị nnara: “a ga-atụnyere” ma ọ bụ “a ga-eme ka o yie.”'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọwa ọkụ ha.” Okwu Grik ahụ nwere ike izo aka n'oriọna ma ọ bụ n'ọwa ọkụ a na-eji n'aka n'oge ngagharị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ akara oge na-ejikọta ilu a na ihe ndị bu ya ụzọ; okwu a doro anya ma bụrụ Igbo a na-asụ ugbu a.
- source_word: ὁμοιωθήσεται
  choice: ga-adị ka
  rationale: Ọ bụ ụzọ Igbo sitere n'okike si kwuo ntụnyere a n'ilu. Ọ bụ ezie na ngwaa Grik dị n'ụdị nnara, isi echiche ya bụ na a ga-eji otu ihe tụnyere ihe ọzọ; e debere ụdị nnara ahụ na nkọwa ala peeji.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: alaeze eluigwe
  rationale: Nke a bụ okwu a maara nke ọma n'Igbo maka akpaokwu Matiu, ma na-echekwa echiche ọchịchị na isi iyi ya dị n'eluigwe.
- source_word: δέκα παρθένοις
  choice: ụmụ agbọghọ iri na-amaghị nwoke
  rationale: παρθένος n'ọnọdụ agbamakwụkwọ a na-ezo aka n'ụmụ agbọghọ na-alụbeghị nwoke, na-emekwa ka amaghị nwoke pụta ìhè. Nhọrọ a na-echekwa ike okwu Grik karịa naanị ‘ụmụ agbọghọ na-alụbeghị di.’
- source_word: αἵτινες
  choice: Ha
  rationale: Ikewa ahịrịokwu ahụ ụzọ abụọ ma jiri ‘Ha’ malite nke abụọ na-eme ka Igbo dị mfe ma doo anya, na-enweghị ịgbanwe ndị nnọchiaha ahụ na-akọwa.
- source_word: λαβοῦσαι
  choice: buuru
  rationale: Nsonye aorist ahụ na-egosi ihe ha mere tupu ma ọ bụ mgbe ha na-apụ; ‘buuru’ na-egosi na ha were ìhè ha soro onwe ha.
- source_word: τὰς λαμπάδας ἑαυτῶν
  choice: oriọna ha
  rationale: λαμπάς nwere ike ịbụ oriọna ma ọ bụ ọwa ọkụ. ‘Oriọna’ bụ okwu doro anya ma bụrụkwa nke a maara nke ọma n'ilu a; e debere ‘ọwa ọkụ’ dị ka nhọrọ ọzọ na nkọwa ala peeji.
- source_word: ἐξῆλθον
  choice: pụọ
  rationale: Ọ na-echekwa echiche ịpụ aga ebe ọzọ n'ụzọ dị mkpirikpi ma bụrụ Igbo sitere n'okike.
- source_word: εἰς ὑπάντησιν
  choice: izute
  rationale: Akpaokwu ahụ pụtara ịpụ maka izute ma ọ bụ ịnabata onye na-abịa; ‘izute’ na-enye nzube ngagharị ahụ n'ụzọ doro anya.
- source_word: τοῦ νυμφίου
  choice: nwoke na-alụ nwaanyị ọhụrụ
  rationale: νυμφίος bụ nwoke ahụ na-alụ nwaanyị n'ọnọdụ agbamakwụkwọ. Akpaokwu a na-edobe onyinyo agbamakwụkwọ ahụ ma na-ezere okwu nwere ike ghara ido ndị na-agụ akwụkwọ niile anya.
theological_decisions:
- issue: Usoro ntụnyere nke ilu ahụ
  choice: alaeze eluigwe ga-adị ka ụmụ agbọghọ iri
  alternative: a ga-eji alaeze eluigwe tụnyere ụmụ agbọghọ iri
  rationale: Isi ederede jiri ụzọ Igbo dị mfe kwuo ntụnyere ahụ, ebe nkọwa ala peeji na-echekwa na ngwaa Grik bụ future passive. Nke a anaghị ekpebi ihe ntụnyere ahụ niile na-anọchi anya ya.
- issue: Nkọwa παρθένοις
  choice: ụmụ agbọghọ iri na-amaghị nwoke
  alternative: ụmụ agbọghọ iri na-alụbeghị di
  rationale: Nhọrọ ahụ na-echekwa nkọwa kpọmkwem nke okwu Grik n'ọnọdụ agbamakwụkwọ, na-enweghị itinye nkọwa ụka ma ọ bụ ozizi ọzọ na ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu Grik ahụ ụzọ abụọ iji zere nhazi ga-ada arọ n'Igbo. E ji ‘nwaanyị’ mee ihe dịka mkpọpụta ọkọlọtọ a na-anụkarị ugbu a; okwu ndị gbasara agbamakwụkwọ ka e dere n'ụzọ ndị nkịtị ga-aghọta.
