revisions:
- from: Mgbe ahụ, alaeze eluigwe ga-adị ka ụmụ agbọghọ iri na-amaghị nwoke[a]. Ha buuru oriọna ha[b] pụọ izute nwoke na-alụ nwaanyị ọhụrụ.
  to: Mgbe ahụ, alaeze eluigwe ga-adị ka ụmụ agbọghọ iri na-amaghị nwoke[a]. Ha were oriọna ha[b] pụọ izute nwoke na-alụ nwanyị.
  rationale: The revision corrects the bridegroom expression by removing the unsupported and misleading “ọhụrụ” and uses a more straightforward Igbo rendering for “having taken.” It preserves the source’s comparison formula, its virgins terminology, its lamp/torch ambiguity through the footnote, and the existing footnote anchors.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:05Z'
review_pass:
  verdict: revise
  source_fidelity: The main comparison, the ten virgins, their lamps, and their going out to meet the bridegroom are retained. However, “nwoke na-alụ nwaanyị ọhụrụ” means a man marrying a new woman and does not accurately designate the bridegroom; “ọhụrụ” is not present in the Greek and introduces an inappropriate meaning.
  naturalness: The sentence division and “ga-adị ka” are natural Standard Igbo. “Ha were oriọna ha pụọ” is more idiomatic and direct for the participial action followed by going out than “Ha buuru oriọna ha pụọ.”
  terminology: “Alaeze eluigwe,” “ụmụ agbọghọ iri na-amaghị nwoke,” and “oriọna” are suitable. “Nwoke na-alụ nwanyị” accurately and naturally conveys νυμφίος in this context.
  issues:
  - severity: high
    issue: The rendering of τοῦ νυμφίου adds “ọhụrụ” (‘new’) to the woman.
    rationale: The Greek means “the bridegroom,” not a man marrying a new woman. This changes the referent and introduces information absent from the source.
  - severity: low
    issue: “Buuru” is less direct here than “were.”
    rationale: The aorist participle λαβοῦσαι simply states that they took their lamps. “Were oriọna ha pụọ” is a natural Igbo sequence and avoids any possible overtone of carrying in a particular manner.
  revised_text: Mgbe ahụ, alaeze eluigwe ga-adị ka ụmụ agbọghọ iri na-amaghị nwoke[a]. Ha were oriọna ha[b] pụọ izute nwoke na-alụ nwanyị.
  revised_footnotes:
