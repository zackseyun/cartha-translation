    text: 'A pụkwara ịsị, “a ga-eji alaeze eluigwe tụnyere ụmụ agbọghọ iri na-amaghị nwoke.” Ngwaa Grik ahụ dị n''ụdị nnara: “a ga-atụnyere” ma ọ bụ “a ga-eme ka o yie.”'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọwa ọkụ ha.” Okwu Grik ahụ nwere ike izo aka n'oriọna ma ọ bụ n'ọwa ọkụ a na-eji n'aka n'oge ngagharị.
    reason: lexical_alternative
  revision_rationale: The revision corrects the bridegroom expression by removing the unsupported and misleading “ọhụrụ” and uses a more straightforward Igbo rendering for “having taken.” It preserves the source’s comparison formula, its virgins terminology, its lamp/torch ambiguity through the footnote, and the existing footnote anchors.
