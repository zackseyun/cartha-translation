revisions:
- from: Nna ya ukwu sịrị ya, “I mere nke ọma, ezi odibo[a] nke kwesịrị ntụkwasị obi! I kwesịrị ntụkwasị obi n’ilekọta ihe ole na ole; aga m eme gị onye na-elekọta ọtụtụ ihe. Banye n’ọṅụ nke nna gị ukwu.”
  to: Nna ukwu ya sịrị ya, “I mere nke ọma, ezi odibo[a] nke kwesịrị ntụkwasị obi! I kwesịrị ntụkwasị obi n’ihe ole na ole; aga m eme gị onye na-elekọta ọtụtụ ihe. Banye n’ọṅụ nke nna ukwu gị.”
  rationale: The revision corrects the possessive constructions so that κύριος consistently means the servant’s master, not the master’s father. It also removes the added specification “n’ilekọta” to retain the source text’s broader reference to faithfulness in a few entrusted matters. No theological interpretation has been added or altered.
