id: MAT.25.23
reference: Matthew 25:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: ig
  text: Nna ukwu ya sịrị ya, “I mere nke ọma, ezi odibo[a] nke kwesịrị ntụkwasị obi! I kwesịrị ntụkwasị obi n’ihe ole na ole; aga m eme gị onye na-elekọta ọtụtụ ihe. Banye n’ọṅụ nke nna ukwu gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ohu.” Okwu Grik bụ δοῦλος; ọ pụrụ ịpụta odibo ma ọ bụ ohu, dịka ọnọdụ okwu si dị.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: sịrị
  rationale: Ọ bụ ụzọ Igbo nkịtị, doro anya e si webata okwu mmadụ kwuru kpọmkwem.
- source_word: κύριος
  choice: nna ukwu
  rationale: N’ime ilu a, okwu ahụ na-ezo aka n’onyenwe odibo, ọ bụghị iji aha nsọ “Onyenwe anyị” kpọọ Chineke ma ọ bụ Kraịst.
- source_word: δοῦλε
  choice: odibo
  rationale: “Odibo” na-egosi onye nọ n’okpuru nna ukwu ma na-ejere ya ozi. E debere “ohu,” nke na-eme ka ọnọdụ ịgba ohu pụta ìhè karịa, n’ala ala peeji.
- source_word: Εὖ
  choice: I mere nke ọma
  rationale: Nke a bụ otuto e ji asụsụ Igbo dị ndụ ekwupụta nkwado nna ukwu nyere odibo ya.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: ezi odibo nke kwesịrị ntụkwasị obi
  rationale: Ọ na-egosipụta ma ịdị mma ma ịbụ onye a pụrụ ịtụkwasị obi, ma na-edobekwa njikọ ya na πιστός nke na-esote.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: I kwesịrị ntụkwasị obi n’ilekọta ihe ole na ole
  rationale: “N’ilekọta” na-eme ka echiche nke ibu ọrụ e nyere ya doo anya n’Igbo, dịka ἐπί si arụ ọrụ n’ebe a.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: aga m eme gị onye na-elekọta ọtụtụ ihe
  rationale: Ọ na-egosipụta nhọpụta ya ka ọ bụrụ onye ga-ahụ maka ibu ọrụ ka ukwuu, ma na-edobe ọdịiche dị n’etiti ihe ole na ole na ọtụtụ ihe.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Banye n’ọṅụ
  rationale: Ọ na-edobe ihe atụ Grik nke ịbanye n’ọṅụ kama ịgbanwe ya nanị ka ọ bụrụ iketa oke.
- source_word: τοῦ κυρίου σου
  choice: nke nna gị ukwu
  rationale: Ọ na-edobe otu ntụgharị κύριος n’ime ọnọdụ ilu a ma gosipụta mmekọrịta odibo na nna ukwu ya.
theological_decisions:
- issue: Otú e si tụgharịa κύριος n’ilu ebe ọ na-ezo aka n’onyeisi mmadụ
  choice: nna ukwu
  alternative: Onyenwe
  rationale: Onye okwu ahụ na-ezo aka n’ime akụkọ ilu bụ nna ukwu odibo ahụ. Nhọrọ a na-egbochi itinye aha nsọ ozugbo n’ebe Grik ahụ na-ekwu maka mmekọrịta dị n’ime ilu, ma ọ naghị ewepụ ihe ilu ahụ pụrụ ịpụta n’ihe gbasara Chineke.
- issue: Otú e si tụgharịa δοῦλος n’ebe a
  choice: odibo
  alternative: ohu
  rationale: Isi ihe amaokwu a na-elekwasị anya na ya bụ ntụkwasị obi n’ọrụ e nyere onye nọ n’okpuru nna ukwu. “Odibo” bụ okwu Igbo dị mfe ma kwesị ekwesị n’ọnọdụ ahụ; e tinyere “ohu” n’ala ala peeji iji chekwaa oke nghọta okwu Grik ahụ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “nna ukwu” maka onyeisi mmadụ n’ime ilu ahụ, “odibo” maka onye na-eje ozi n’okpuru ya, ma debe “ohu” n’ala ala peeji. A kpachapụrụ anya debe ihe atụ nke “ịbanye n’ọṅụ” na njikọ dị n’etiti “kwesịrị ntụkwasị obi” ugboro abụọ.
