source:
  edition: SBLGNT
  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: ig
  text: Anọ m ọtọ, unu yikwasịrị m uwe; m rịara ọrịa, unu letara m[a]; anọ m n’ụlọ mkpọrọ, unu bịakwutere m[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “unu lekọtara m”; ngwaa Grik ahụ nwere ike ịpụta ileta mmadụ n’ụzọ nke gụnyere nlekọta ma ọ bụ nchebara echiche.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “unu bịara n’ebe m nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: Agba m ọtọ
  rationale: Nke a na-egosipụta kpọmkwem ọnọdụ onye na-enweghị uwe. Ọ bụ okwu Igbo doro anya ma kwekọọ n’omume na-esochi ya, bụ́ iyikwasị uwe.
- source_word: περιεβάλετέ
  choice: unu eyikwasị m uwe
  rationale: περιβάλλω n’ebe a pụtara iyikwasị mmadụ uwe; nsụgharị a bụ nke e ji eme ihe n’Igbo ma na-egosipụta omume ahụ nke ọma.
- source_word: ἠσθένησα
  choice: arịara m ọrịa
  rationale: Ọ bụ ezie na ngwaa Grik a nwekwara ike ịpụta ịdị ike gwụrụ, n’ọnọdụ a ọ na-ezo aka n’ọrịa; okwu a bụkwa Igbo nkịtị ma doo anya.
- source_word: ἐπεσκέψασθέ
  choice: unu letara m
  rationale: ἐπισκέπτομαι pụtara ịga leta mmadụ, ọ na-enwekwa ike ịgụnye nlekọta na nchebara echiche. ‘Letara m’ na-edobe okwu ahụ n’enweghị ịgbasa ihe ọ pụtara karịa ihe e dere.
- source_word: φυλακῇ
  choice: n’ụlọ mkpọrọ
  rationale: φυλακή n’ebe a bụ ebe a na-ejide mmadụ; ‘ụlọ mkpọrọ’ bụ okwu Igbo zuru oke ma bụrụ nke a na-aghọta n’ozuzu.
- source_word: ἤλθατε πρός με
  choice: unu bịakwutere m
  rationale: Nke a na-edobe mfe okwu Grik ahụ, ‘unu bịara n’ebe m nọ,’ ma ghara ịtinye echiche ‘ileta’ ọzọ n’ahịrịokwu ikpeazụ.
theological_decisions:
- issue: Ókè a ga-eru n’ịkọwa omume ebere ndị a
  choice: E debere omume ndị ahụ dịka iyikwasị uwe, ileta, na ịbịakwute, n’enweghị nkọwa agbakwunyere.
  alternative: Ịsụgharị ἐπεσκέψασθέ dịka ‘unu lekọtara m,’ ma ọ bụ ἤλθατε πρός με dịka ‘unu bịara leta m.’
  rationale: Okwu Grik ahụ na-akọ omume ebere ndị a n’ụzọ dị mfe ma pụta ìhè. Ịhapụ ha otu a na-echekwa ọdịiche dị n’etiti ‘ileta’ na ‘ịbịakwute,’ ma ghara ịtinye nkọwa ozizi ma ọ bụ nke ụkọchukwu na-adịghị n’ihe e dere.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘Agba m ọtọ’ maka ịdị nkenke na ikwekọ n’usoro ahịrịokwu; ‘unu bịakwutere m’ na-echekwa ọdịiche dị n’etiti nkebi nke abụọ na nke atọ.
