id: MAT.25.21
reference: Matthew 25:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: ig
  text: Nna ukwu ya[b] sịrị ya, “I mere nke ọma, ezigbo ohu[a] kwesịrị ntụkwasị obi! I ji ntụkwasị obi lekọta ihe ole na ole; aga m eme gị onye na-elekọta ọtụtụ ihe. Bata n’ọṅụ nna ukwu gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “onye na-eje ozi.” Okwu Grik bụ doulos, nke nwere ike ịpụta ohu ma ọ bụ onye na-eje ozi, dabere n’ọnọdụ.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị okwu Grik kyrios n’ebe a “Onyenwe”; ma “nna ukwu” kacha daba na mmekọrịta dị n’etiti ohu na onye nwe ya n’ilu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: sịrị
  rationale: Ọ bụ ụzọ Igbo nkịtị na nke doro anya si ewebata okwu mmadụ kwuru n’akụkọ.
- source_word: κύριος
  choice: nna ukwu
  rationale: N’ime ilu a, okwu ahụ na-egosi onye nwe ohu ma ọ bụ onyeisi ya; “nna ukwu” na-egosipụta mmekọrịta ahụ nke ọma n’Igbo.
- source_word: δοῦλε
  choice: ohu
  rationale: “Ohu” na-echekwa ọnọdụ onye nọ n’okpuru nna ukwu nke δοῦλος na-egosi. Ihe e dere n’ala peeji kọwara na a pụkwara ikwu ya dị ka onye na-eje ozi.
- source_word: Εὖ
  choice: I mere nke ọma
  rationale: Nke a bụ otuto e ji asụsụ Igbo dị ndụ ekwupụta nkwado nna ukwu nyere ya.
- source_word: ἀγαθὲ
  choice: ezigbo
  rationale: “Ezigbo” bụ nkọwa ebumpụta ụwa maka àgwà ọma onye ahụ ma dabara n’aha a na-akpọ ya.
- source_word: πιστέ / πιστός
  choice: kwesịrị ntụkwasị obi
  rationale: E ji otu okwu ahụ mee ihe ugboro abụọ iji chekwaa njikọ dị n’etiti otuto ahụ na otú o si rụọ ọrụ e nyere ya.
- source_word: ἐπὶ ὀλίγα
  choice: n’ihe ole na ole
  rationale: Nke a na-egosi obere ihe e nyere ya ka ọ na-ahụ maka ya n’ụzọ Igbo na-ada nke ọma.
- source_word: καταστήσω
  choice: aga m eme gị onye na-elekọta
  rationale: N’ebe a καθίστημι pụtara inye mmadụ ọkwa na ibu ọrụ, ọ bụghị naanị idobe ya n’otu ebe.
- source_word: ἐπὶ πολλῶν
  choice: ọtụtụ ihe
  rationale: Ọ na-echekwa ọdịiche dị n’etiti ihe ole na ole na ọtụtụ ihe, ebe ahịrịokwu ahụ gosikwara na a ga-enye ya ọrụ ilekọta ha.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Bata n’ọṅụ
  rationale: “Bata” na-echekwa ihe atụ nke ịbanye n’ime ọṅụ, kama ịkọwa ya naanị dị ka iketa òkè.
theological_decisions:
- issue: Otu a ga-esi sụgharịa κύριος n’ilu nke onye ahụ nwere ike ịnọchite anya Chineke ma ọ bụ Kraịst
  choice: nna ukwu
  alternative: Onyenwe
  rationale: Ihe a na-ekwu kpọmkwem n’ilu ahụ bụ mmekọrịta dị n’etiti ohu na nna ya ukwu. “Nna ukwu” na-echekwa ọkwa akụkọ ahụ n’etinyeghị aha nsọ nke Kraịst kpọmkwem n’okwu ahụ, ma ọ naghị egbochi nghọta ime mmụọ nke ilu ahụ.
- issue: Otu a ga-esi sụgharịa δοῦλος n’ebe a
  choice: ohu
  alternative: onye na-eje ozi
  rationale: “Ohu” na-egosipụta n’ụzọ doro anya na onye ahụ nọ n’okpuru ikike nna ukwu. E debere okwu ọzọ na nkọwa ala peeji n’ihi na δοῦλος nwekwara ike ilekwasị anya n’ozi onye ahụ na-eje, dabere n’ọnọdụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “I mere nke ọma” na “onye na-elekọta” na-eme ka okwu ahụ bụrụ nke ebumpụta ụwa, ebe “ohu,” “nna ukwu,” na “bata n’ọṅụ” na-echekwa onyonyo na ike okwu Grik.
