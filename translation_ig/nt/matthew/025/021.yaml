- from: Nna ya ukwu[b] sịrị ya, “I mere nke ọma, ezigbo ohu[a] kwesịrị ntụkwasị obi! I kwesịrị ntụkwasị obi n’ihe ole na ole; aga m eme gị onye na-elekọta ọtụtụ ihe. Bata n’ọṅụ nna gị ukwu.”
  to: Nna ukwu ya[b] sịrị ya, “I mere nke ọma, ezigbo ohu[a] kwesịrị ntụkwasị obi! I ji ntụkwasị obi lekọta ihe ole na ole; aga m eme gị onye na-elekọta ọtụtụ ihe. Bata n’ọṅụ nna ukwu gị.”
  rationale: The revision corrects the possessive syntax for “master” in both occurrences and expresses the servant’s prior faithful management in clear, natural Standard Igbo. It retains the draft’s source-sensitive choices for δοῦλος, κύριος, the future appointment, and the metaphor of entering the master’s joy. Footnote markers remain attached to the relevant terms and the footnotes are unchanged in meaning.
