  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: ig
  text: Ma ka ha na-apụ ịga ịzụ ihe, nwoke ahụ na-alụ nwanyị bịara. Ndị ahụ dị njikere so ya banye n’oriri agbamakwụkwọ[a], e mechiri ọnụ ụzọ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’emume agbamakwụkwọ,” ma ọ bụ naanị, “n’agbamakwụkwọ.” Okwu Grik ahụ dị n’ụdị ọtụtụ, ma ọ pụrụ ịpụta emume agbamakwụkwọ ahụ dum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων ... αὐτῶν
  choice: ka ha na-apụ
  rationale: Nke a na-egosi na omume abụọ ahụ na-eme n’otu oge, ma na-edobekwa echiche nke ịpụ pụọ dị na ἀπέρχομαι.
- source_word: ἀγοράσαι
  choice: ịga ịzụ ihe
  rationale: Infinitive a na-egosi ebumnuche. N’Igbo, “ịzụ ihe” bụ ụzọ nkịtị isi kwuo ịga azụta ihe n’agbanyeghị na amaokwu a akpọghị mmanụ ahụ aha.
- source_word: ὁ νυμφίος
  choice: nwoke ahụ na-alụ nwaanyị
  rationale: Nke a bụ okwu Igbo doro anya maka nwoke a na-agba alụmdi na nwunye, ma na-edobe ihe atụ agbamakwụkwọ ahụ n’enweghị itinye nkọwa okpukpe n’ime ederede.
- source_word: αἱ ἕτοιμοι
  choice: ndị ahụ dị njikere
  rationale: Adjective a na-anọchi ndị inyom ahụ dị njikere. Igbo anaghị achọ ka e gosipụta ụdị nwanyị n’okwu a, ebe ihe ndị gbara ya gburugburu na-eme ka ndị a na-ekwu maka ha doo anya.
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: sokwa ya banye
  rationale: Nke a na-egosi nke ọma na ha banyere n’ime ebe ahụ ya na ya, n’asụsụ Igbo dị mfe ma dị ndụ.
- source_word: εἰς τοὺς γάμους
  choice: n’oriri agbamakwụkwọ
  rationale: Ọ bụ ezie na γάμοι dị n’ụdị ọtụtụ, n’ebe a ọ na-ezo aka n’emume agbamakwụkwọ, karịchaa oriri ya.
- source_word: ἐκλείσθη ἡ θύρα
  choice: e mechikwara ọnụ ụzọ ahụ
  rationale: Ụdị a na-edobe passive nke Grik na njedebe siri ike nke ihe ahụ merenụ; “ọnụ ụzọ ahụ” na-egosikwa article doro anya dị n’isi mmalite.
theological_decisions:
- issue: Otu e si akọwa ihe oyiyi agbamakwụkwọ n’ilu a
  choice: Edobere nwoke na-alụ nwaanyị na oriri agbamakwụkwọ dịka ihe dị n’akụkọ ahụ, n’enweghị ịkpọ onye ahụ Kraịst kpọmkwem.
  alternative: Ịgbakwunye nkọwa n’ederede na nwoke ahụ na-anọchi anya Kraịst.
  rationale: Ihe amaokwu ahụ pụtara n’ụzọ okpukpe kwesịrị isi n’ilu ahụ na ihe gbara ya gburugburu pụta; nsụgharị ekwesịghị itinye nkọwa ahụ n’ọnụ ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E tinyere akara [a] n’akụkụ “oriri agbamakwụkwọ,” ebe ọ bụ okwu γάμοι ka nkọwa ala peeji ahụ metụtara, ọ bụghị ἀγοράσαι (“ịzụ”).
