id: MAT.25.44
reference: Matthew 25:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: ig
  text: Mgbe ahụ, ha kwa ga-aza, sị, ‘Onyenwe anyị, olee mgbe anyị hụrụ gị ka agụụ na-agụ gị, ma ọ bụ ka akpịrị na-akpọ gị nkụ, ma ọ bụ ka ị bụ onye ọbịa, ma ọ bụ ka ị nọ ọtọ, ma ọ bụ ka ị na-arịa ọrịa, ma ọ bụ ka ị nọ n’ụlọ mkpọrọ, ma anyị ejereghị gị ozi[a]?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “anyị elekọtaghị gị” ma ọ bụ “anyị enyereghị gị aka,” maka okwu Grik διακονέω.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Na-egosi ihe sochiri ihe ọzọ n’usoro ihe ikpe ahụ; ọ bụ okwu Igbo doro anya ma kwekọọ n’isi mmalite.
- source_word: ἀποκριθήσονται καὶ αὐτοὶ
  choice: ha onwe ha ga-azakwa
  rationale: ‘Ga-azakwa’ na-egosipụta ma nzaghachi ahụ ma echiche καί na otu a, dịka ndị ahụ gara aga, ga-azakwa.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Aha a bụ ụzọ Igbo a na-ejikarị nkwanye ùgwù akpọ κύριος, ma na-echekwa ụda aha e ji akpọ Jizọs.
- source_word: ξένον
  choice: dịka onye ọbịa
  rationale: Na-egosi onye na-abụghị onye ezinụlọ ma ọ bụ obodo ahụ nke chọrọ nnabata, n’ebughị ụzọ kọwaa ya dịka onye mba ọzọ naanị.
- source_word: γυμνὸν
  choice: ka ị gba ọtọ
  rationale: Na-echekwa ike okwu Grik ahụ kpọmkwem; n’ọnọdụ a ọ pụkwara ịgụnye onye uwe na-ezughị ezu.
- source_word: ἀσθενῆ
  choice: ka ị na-arịa ọrịa
  rationale: N’usoro mkpa anụ ahụ na nke ọha a, okwu ahụ na-egosi ọrịa karịa adịghị ike n’ozuzu.
- source_word: ἐν φυλακῇ
  choice: ka ị nọ n’ụlọ mkpọrọ
  rationale: Ọ bụ ntụgharị Igbo nkịtị na nke doro anya maka ịnọ n’ụlọ mkpọrọ.
- source_word: οὐ διηκονήσαμέν σοι
  choice: ma anyị ejereghị gị ozi
  rationale: ‘Ijere mmadụ ozi’ na-echekwa echiche sara mbara nke διακονέω—inyere mmadụ aka site n’omume ma ọ bụ ilekọta mkpa ya—n’emeghị ka ọ bụrụ naanị ọrụ ụka.
theological_decisions:
- issue: Otu e si tụgharị κύριος dịka aha e ji akpọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa ma nkwanye ùgwù ma ụda Kraịst dị n’aha ahụ, n’etinyeghị nkọwa karịrị ihe ederede kwuru.
- issue: Ike okwu διακονέω n’ahịrị ikpeazụ
  choice: jere gị ozi
  alternative: lekọta gị / nyere gị aka
  rationale: Nhọrọ a na-echekwa echiche sara mbara nke ọrụ enyemaka e mere nye Eze site n’inyere ndị nọ ná mkpa aka; nkọwa ala peeji na-egosi ụzọ ndị ọzọ okwu ahụ pụrụ isi pụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ajụjụ Grik na ndepụta mkpa dị iche iche, ebe e mere ka ahịrịokwu ahụ na-aga nke ọma n’Igbo.
