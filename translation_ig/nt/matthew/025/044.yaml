review_pass:
  verdict: revise
  source_fidelity: The draft preserves the future response, the direct address ‘Lord,’ the sixfold list of need, and the broad practical sense of διηκονήσαμεν. However, ‘ha onwe ha’ chiefly means ‘they themselves’ and does not clearly convey καὶ αὐτοί (‘they too/also’). ‘dịka onye ọbịa’ can mean ‘as/as if a visitor,’ rather than identifying the person as a stranger. ‘ka ị nọ ọtọ’ more directly expresses the stative predication γυμνόν (‘naked’).
  naturalness: The revised wording is idiomatic Standard Igbo and maintains the solemn but accessible register of the judgment-scene dialogue. ‘Ha kwa ga-aza, sị’ is a natural way to express the Greek response formula with its inclusive emphasis.
  terminology: ‘Onyenwe anyị’ is retained for Κύριε, and ‘ijere gị ozi’ appropriately retains the broad, non-ecclesiastically restricted range of διακονέω. The existing footnote gives viable contextual alternatives without replacing the main rendering.
  issues:
  - severity: medium
    issue: The emphasis καὶ αὐτοί is rendered ‘ha onwe ha.’
    rationale: ‘Ha onwe ha’ emphasizes reflexively ‘they themselves,’ whereas the Greek marks that this group also answers. ‘Ha kwa’ expresses the intended inclusion more naturally.
  - severity: medium
    issue: ξένον is rendered ‘dịka onye ọbịa.’
    rationale: '‘Dịka’ may introduce comparison (‘as/as if’). The source predicates the status directly: they saw him as a stranger. ‘Ka ị bụ onye ọbịa’ makes this direct and preserves the social sense.'
  - severity: low
    issue: γυμνόν is rendered ‘ka ị gba ọtọ.’
    rationale: Although understandable, ‘ka ị nọ ọtọ’ more plainly denotes the state of being naked that the Greek predicate conveys and aligns with the other condition clauses.
  revised_text: Mgbe ahụ, ha kwa ga-aza, sị, ‘Onyenwe anyị, olee mgbe anyị hụrụ gị ka agụụ na-agụ gị, ma ọ bụ ka akpịrị na-akpọ gị nkụ, ma ọ bụ ka ị bụ onye ọbịa, ma ọ bụ ka ị nọ ọtọ, ma ọ bụ ka ị na-arịa ọrịa, ma ọ bụ ka ị nọ n’ụlọ mkpọrọ, ma anyị ejereghị gị ozi[a]?’
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “anyị elekọtaghị gị” ma ọ bụ “anyị enyereghị gị aka,” maka okwu Grik διακονέω.
    reason: lexical_alternative
  revision_rationale: The revision corrects the inclusive emphasis of καὶ αὐτοί, removes an unintended comparative sense from the stranger clause, and makes the nakedness clause clearly stative. It retains the source sequence, interrogative force, formal register, theological title, and deliberately broad rendering of διακονέω.
