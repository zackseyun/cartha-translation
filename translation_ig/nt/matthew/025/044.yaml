revisions:
- from: Mgbe ahụ, ha onwe ha ga-azakwa sị, ‘Onyenwe anyị, olee mgbe anyị hụrụ gị ka agụụ na-agụ gị, ma ọ bụ ka akpịrị na-akpọ gị nkụ, ma ọ bụ dịka onye ọbịa, ma ọ bụ ka ị gba ọtọ, ma ọ bụ ka ị na-arịa ọrịa, ma ọ bụ ka ị nọ n’ụlọ mkpọrọ, ma anyị ejereghị gị ozi[a]?’
  to: Mgbe ahụ, ha kwa ga-aza, sị, ‘Onyenwe anyị, olee mgbe anyị hụrụ gị ka agụụ na-agụ gị, ma ọ bụ ka akpịrị na-akpọ gị nkụ, ma ọ bụ ka ị bụ onye ọbịa, ma ọ bụ ka ị nọ ọtọ, ma ọ bụ ka ị na-arịa ọrịa, ma ọ bụ ka ị nọ n’ụlọ mkpọrọ, ma anyị ejereghị gị ozi[a]?’
