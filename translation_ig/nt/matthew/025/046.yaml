base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: ig
  text: Ndị a ga-apụ gaa n’ahụhụ ebighị ebi[a], ma ndị ezi omume ga-aga ná ndụ ebighị ebi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ahụhụ nke oge” … “ndụ nke oge.” Ndị ọkà mmụta ka na-arụ ụka banyere ihe okwu Grik αἰώνιος pụtara n’ọnọdụ ụfọdụ. Ma ebe a, otu okwu ahụ na-akọwa ma “ahụhụ” ma “ndụ”; ya mere, ntụgharị a ji “ebighị ebi” n’ebe abụọ ahụ iji chekwaa myirịta ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: ga-apụ gaa
  rationale: Okwu a bụ ọdịnihu nke ἀπέρχομαι, na-egosi ịpụ ma ọ bụ ịga. “Ga-apụ gaa” bụ Igbo doro anya nke na-echekwa echiche ngagharị ahụ n’etinyeghị nkọwa ọzọ.
- source_word: οὗτοι
  choice: ndị a
  rationale: Nnochiaha ngosi a na-ezo aka n’ìgwè a kọwara tupu amaokwu a. “Ndị a” bụ ụzọ Igbo nkịtị si akọwa ndị ahụ ma mee ka ọdịiche dị n’etiti ha na ndị ezi omume pụta ìhè.
- source_word: κόλασιν
  choice: ahụhụ
  rationale: N’ọnọdụ ikpe a, κόλασις pụtara ntaramahụhụ ma ọ bụ ihe mgbu sitere n’ikpe, ọ bụghị naanị ịdọ aka ná ntị iji dozie mmadụ. “Ahụhụ” bụ okwu Igbo dị mfe ma kwesịkwa ọnọdụ a.
- source_word: αἰώνιον
  choice: ebighị ebi
  rationale: Otu okwu ahụ na-akọwa ma ahụhụ ma ndụ. “Ebighị ebi” bụ ntụgharị Igbo a na-ejikarị eme ihe n’ọnọdụ a, ma ọ na-echekwa nhata dị n’ahịrịokwu Grik ahụ. E debere ihe ọzọ okwu ahụ pụrụ ịpụta n’okpuru amaokwu.
- source_word: δίκαιοι
  choice: ndị ezi omume
  rationale: Adjective a ji ọnọdụ aha na-ezo aka ná ndị e ji ezi omume mara ma ọ bụ ndị a gụrụ dị ka ndị ezi omume. “Ndị ezi omume” bụ okwu Igbo doro anya ma kwanyere echiche omume na mmekọrịta ọgbụgba ndụ ùgwù.
- source_word: ζωὴν
  choice: ndụ
  rationale: Nke a bụ ntụgharị nkịtị na nke ziri ezi nke ζωή; ọnọdụ a achọghị ka a gbasaa ya karịa “ndụ.”
- source_word: δὲ
  choice: ma
  rationale: Okwu a na-egosi ọdịiche dị n’etiti ìgwè abụọ ahụ na ihe ga-adịrị ha. “Ma” na-egosipụta ọdịiche ahụ n’Igbo eke.
theological_decisions:
- issue: Otú e si atụgharị αἰώνιον n’okwu abụọ ahụ, κόλασιν αἰώνιον na ζωὴν αἰώνιον
  choice: Ịtụgharị αἰώνιον dịka “ebighị ebi” n’ebe abụọ ahụ
  alternative: nke ga-adị otu ọgbọ/oge ụwa dum
  rationale: Otu adjective ahụ na-akọwa ma “ahụhụ” ma “ndụ,” ya mere ntụgharị ahụ kwesịrị ichekwa myirịta ahụ kama ime ka ogologo oge ma ọ bụ ụdị nke otu dị iche na nke ọzọ. “Ebighị ebi” bụ okwu Igbo kachasị eke n’ọnọdụ a. N’ihi na a ka na-arụ ụka banyere ma αἰώνιος pụrụ ịpụta ihe metụtara otu ọgbọ ma ọ bụ oge ụwa n’ọnọdụ ụfọdụ, e tinyere nhọrọ ahụ n’okpuru amaokwu kama iji ya dochie okwu dị n’ahịrịokwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa nhazi na ọdịiche dị na Grik, ma zere okwu ụka pụrụ iche. E tinyere akara [a] ozugbo n’isiokwu amaokwu ahụ dịka achọrọ.
