  terminology: “Ahụhụ,” “ndị ezi omume,” “ndụ,” na “ebighị ebi” bụ okwu ziri ezi ma bụrụkwa okwu Akwụkwọ Nsọ Igbo a na-ahụkarị. E jiri “ebighị ebi” mee αἰώνιον n’ebe abụọ ahụ, nke na-echekwa myirịta nke Grik. N’okpuru amaokwu, “nke oge” na-enye nhọrọ lexical n’enweghị ikwu n’amaghị ama na ọ pụtara “otu ọgbọ” ma ọ bụ “oge ụwa dum.”
