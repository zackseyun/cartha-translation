id: MAT.25.20
reference: Matthew 25:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: ig
  text: Onye ahụ natara talent ise bịara nso, wetakwa talent ise ọzọ, sị, “Onyenwe m[a], i nyefere m talent ise; lee, enwetala m talent ise ọzọ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya, “Nna m ukwu.” N’asụsụ Grik: Kyrios.'
    reason: alternative_reading
  - marker: b
    text: Talent bụ nnukwu nkeji e ji atụ ego n’oge ochie.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: bịara nso
  rationale: Nke a na-egosi na o ji onwe ya bịaruo onye nwe ya nso ka o gosi ya ihe o wetara; ọ bụkwa okwu Igbo doro anya n’ọnọdụ a.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: Onye ahụ natara talent ise
  rationale: Usoro a na-akọwa ohu ahụ site n’ihe ọ natara na mbụ, n’etinyeghị okwu dị ka ‘nwoke’ nke adịghị n’asụsụ Grik.
- source_word: τάλαντα
  choice: talent
  rationale: E debere aha otu ihe e ji atụ nnukwu ego n’oge ahụ, kama ịkọwa ya dị ka ọlaedo ma ọ bụ ụdị ego pụrụ iche nke okwu Grik n’onwe ya na-ekwughị. Ihe odide ala peeji kọwara ya.
- source_word: προσήνεγκεν
  choice: wetakwa
  rationale: Ọ na-egosi na o butere ego ọzọ ahụ n’ihu onye nwe ya; ‘-kwa’ na-egosikwa na nke a bụ ego agbakwunyere.
- source_word: ἄλλα πέντε τάλαντα
  choice: talent ise ọzọ
  rationale: Nke a na-egosi ego ọzọ hà ka ego ise mbụ ma na-edobe nkwughachi dị n’asụsụ Grik.
- source_word: Κύριε
  choice: Onyenwe m
  rationale: N’akụkọ ilu a, ọ bụ okwu ohu ji akpọ onye nwe ya. ‘Onyenwe m’ bụ Igbo ebumpụta ụwa nke na-edobe ma mmekọ ha n’akụkọ ahụ ma ụda okwu κύριος.
- source_word: παρέδωκας
  choice: i nyefere m
  rationale: ‘Nyefere’ na-edobe echiche bụ isi nke inyefe ihe n’aka onye ọzọ, n’akọwaghị ya ozugbo dị ka ntụkwasị obi n’agbanyeghị na ọnọdụ ahụ gụnyere ya.
- source_word: ἴδε
  choice: lee
  rationale: ‘Lee’ bụ okwu Igbo dị ndụ e ji adọta uche mmadụ n’ihe a na-egosi ya.
- source_word: ἐκέρδησα
  choice: enwetala m
  rationale: Ọ na-egosi uru onye ahụ rụpụtara nke dị ugbu a n’ihu onye nwe ya, n’etinyeghị echiche ụgwọ ọrụ nke okwu ahụ na-abụghị kpọmkwem.
theological_decisions:
- issue: Nsụgharị κύριος dị ka okwu ohu ji akpọ onye nwe ya n’akụkọ ilu
  choice: Onyenwe m
  alternative: Nna m ukwu
  rationale: ‘Onyenwe m’ dabara n’ọnọdụ onye nwe ohu ma na-edobekwa ohere ụda okpukpe nke κύριος nwere n’akụkọ Matiu, n’emeghị ka amaokwu a kwuo kpọmkwem na onye ahụ bụ Kraịst.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. A hapụrụ ‘talent’ dị ka aha otu ego oge ochie ma kọwaa ya n’ihe odide ala peeji; e zere ime ya ‘akpa ọlaedo’ n’ihi na nke ahụ ga-eme ka ihe okwu Grik pụtara dị warara.
