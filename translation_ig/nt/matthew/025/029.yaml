id: MAT.25.29
reference: Matthew 25:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: ig
  text: N’ihi na onye ọ bụla nwere, a ga-enyekwu ya, ọ ga-enwekwa ihe n’ụba[a]; ma onye na-enweghị, a ga-anapụ ya ọbụna ihe o nwere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ ga-abakwa ụba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντὶ
  choice: N’ihi na onye ọ bụla nwere
  rationale: γάρ na-enye ihe kpatara okwu bu ụzọ; articular participle ahụ na παντί na-egosi onye ọ bụla n’otu n’otu. Ụdị a bụ Igbo doro anya ma na-edobe ike nke okwu ahụ gbasara onye ọ bụla.
- source_word: δοθήσεται
  choice: a ga-enyekwu ya
  rationale: Ọ bụ future passive nke δίδωμι. N’ọnọdụ ilu a, ‘-kwu’ na-egosi na a ga-agbakwunye n’ihe onye ahụ nwere, ebe ahịrịokwu ka na-edobe onye na-eme ihe n’amaghị aha.
- source_word: καὶ περισσευθήσεται
  choice: ọ ga-enwekwa ihe n’ụba
  rationale: περισσεύω ebe a na-egosi ọnọdụ nke inwe ihe karịrị ihe a chọrọ ma ọ bụ ihe n’ụba. Nsụgharị a bụ Igbo eke ma na-edobe echiche nke ụba; e tinyere ụzọ ọzọ dị nso n’ụdị ngwaa na nkọwa ala peeji.
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: ma onye na-enweghị
  rationale: Articular participle genitive ahụ na-egosi onye e si n’aka ya wepụ ihe, δέ na-etinyekwa ọdịiche megide nkebi nke mbụ. Igbo a na-edobe onye nnọchianya n’otu.
- source_word: καὶ ὃ ἔχει
  choice: ọbụna ihe o nwere
  rationale: 'καί bụ ascensive n’ebe a: ‘ọbụna.’ Ọ na-eme ka ihe ahụ na-atụghị anya ya pụta ìhè—onye a sịrị na o nweghị ka a ga-anapụkwa ihe o nwere.'
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: a ga-anapụ ya
  rationale: Future passive nke αἴρω tinyere ἀπό na-egosi iwepụ ihe n’aka onye ahụ. ‘A ga-anapụ ya’ bụ okwu Igbo dị ndụ nke na-edobe passive na echiche nkewapụ.
theological_decisions:
- issue: Onye nnọchianya e ji otu onye kwuo okwu n’usoro participle
  choice: Jiri ‘onye ọ bụla ... ya/ọ’ na ‘onye ... ya/o’
  alternative: 'Jiri ọtụtụ mmadụ: ‘ndị nwere ... ha’'
  rationale: Grik ji participle nwoke otu mee okwu izugbe. Igbo anaghị achọ ka e gosi okike n’ebe a, ma ụdị onye otu na nnọchiaha ya na-edobe usoro na ike nnọchianya nke okwu Grik n’enweghị itinye okike na-adịghị mkpa.
- issue: Ihe ‘inwe’ na-ezo aka na ya
  choice: Hapụ ihe e nwere n’ekwughị kpọmkwem, dịka Grik si mee
  alternative: Kọwaa ya dị ka talent, onyinye, okwukwe, ma ọ bụ nghọta
  rationale: Amaokwu ahụ anaghị akpọ ihe e nwere aha n’ahịrịokwu a. Ịkpọ ya otu ihe kpọmkwem ga-edozi ihe odide ahụ n’ụzọ ọ na-emeghị ma nwee ike ibubata nkọwa okpukpe pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘N’ụba’ na ‘anapụ’ dabara n’ụdị okwu amamihe nke amaokwu ahụ, ebe ahịrịokwu ahụ ka na-agụ nke ọma nye onye Igbo nkịtị.
