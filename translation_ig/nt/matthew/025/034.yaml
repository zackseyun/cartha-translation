id: MAT.25.34
reference: Matthew 25:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: ig
  text: Mgbe ahụ, Eze ahụ ga-agwa ndị nọ n’akụkụ aka nri ya, sị, “Bịanụ, unu ndị Nna m gọziri[a]; ketanụ alaeze ahụ a kwadebeere unu site na ntọala nke ụwa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị karịa, “unu ndị a gọziri agọzi nke Nna m.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “malite mgbe a tọrọ ntọala ụwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe ga-esochi n’usoro ihe omume ikpe ahụ; nke a bụ Igbo doro anya ma dịkwa ebube.
- source_word: ἐρεῖ
  choice: ga-agwa ... sị
  rationale: Usoro a bụ ụzọ Igbo si ewebata okwu a ga-ekwu kpọmkwem n’ụzọ ebumpụta ụwa.
- source_word: ὁ βασιλεὺς
  choice: Eze ahụ
  rationale: Mkpọaha a kapịrị ọnụ na-ekwu banyere Eze ahụ a kpọtụrụ aha n’ọnọdụ a, ya bụ onye ikpe n’ọgwụgwụ oge.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: ndị nọ n’aka nri ya
  rationale: Ọ na-edobe ọnọdụ ha n’akụkụ aka nri Eze ahụ, tinyere ùgwù ọnọdụ ahụ na-egosi n’akụkọ a.
- source_word: Δεῦτε
  choice: Bịanụ
  rationale: Ọ bụ iwu a na-enye ọtụtụ mmadụ, ya mere akara ọtụtụ mmadụ -nụ dabara adaba.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: unu ndị Nna m gọziri
  rationale: Igbo na-egosikarị ihe Grik kwuru n’ụdị nnara omume site n’ịkpọ onye mere ya aha dịka onye na-eme ihe. Nke a na-edobe Nna dịka isi iyi na onye nyere ngọzi ahụ.
- source_word: κληρονομήσατε
  choice: ketanụ
  rationale: Ọ na-edobe echiche nke inweta ihe dịka ihe nketa, ọ bụghị naanị ịnata ya n’ụzọ nkịtị.
- source_word: τὴν ... βασιλείαν
  choice: alaeze ahụ
  rationale: N’ebe a, ihe a na-eketa ma kwadebe bụ alaeze; okwu a na-edobekwa echiche ọchịchị eze n’enweghị ịkọwa ya karịa ihe amaokwu kwuru.
- source_word: ἡτοιμασμένην ὑμῖν
  choice: a kwadebeere unu
  rationale: Ọ na-egosi na e mechaala nkwadebe ahụ ma na ihe ahụ ka dị njikere maka ha.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: site na ntọala ụwa
  rationale: Nke a na-edobe ihe atụ Grik banyere ịtọ ntọala ụwa na njikọ nkebiokwu ahụ na alaeze a kwadebere.
theological_decisions:
- issue: Onye nyere ngọzi na οἱ εὐλογημένοι τοῦ πατρός μου
  choice: “unu ndị Nna m gọziri”
  alternative: “unu ndị ngọzi Nna m dịkwasịrị” ma ọ bụ nsụgharị nkịtị nke “ndị a gọziri agọzi nke Nna m”
  rationale: Nhọrọ a na-eme ka Nna bụrụ onye na-enye ngọzi dịka genitive Grik si egosi, ma ọ naghị atụkwasị nkọwa ozizi ọzọ.
- issue: Ihe βασιλεία pụtara n’ebe a
  choice: “alaeze”
  alternative: “ọchịchị eze”
  rationale: N’ihi na a na-ekwu na a kwadebere ya nakwa na ndị ahụ ga-eketa ya, “alaeze” dabara nke ọma ma ghara iwepụ echiche nke ọchịchị Eze.
- issue: Njikọ na oge nke ἀπὸ καταβολῆς κόσμου
  choice: E jikọtara ya na “a kwadebeere unu” ma sụgharịa ya “site na ntọala ụwa.”
  alternative: “malite mgbe a tọrọ ntọala ụwa” ma ọ bụ ijikọ nkebiokwu ahụ n’ụzọ sara mbara na ọkpụkpọ òkù niile
  rationale: Ọ bụ ihe dị ya nso n’usoro ahịrịokwu Grik ka nkebiokwu ahụ na-akọwa. “Site na” na-edobe ohere nghọta nke ‘from’ na ‘since’ n’enweghị idozi esemokwu ahụ n’ụzọ ozizi.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta. “Bịanụ” na “ketanụ” na-egosi na a na-agwa ọtụtụ mmadụ okwu. E debere ihe atụ “ntọala ụwa” kama iji “mgbe e kere ụwa” dochie ya, ka ihe oyiyi dị n’asụsụ Grik ghara ịla n’iyi.
