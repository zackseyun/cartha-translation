    text: N’ụzọ nkịtị karịa, “unu ndị a gọziri agọzi nke Nna m.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “malite mgbe a tọrọ ntọala ụwa.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek wording and its theological restraint while improving Standard Igbo clarity. It clarifies the group’s location at the King’s right side, uses the idiomatic possessive construction for “the foundation of the world,” and replaces an unnatural footnote with a transparent, more literal alternative. The temporal phrase remains attached to the kingdom’s preparation, as in the Greek.
