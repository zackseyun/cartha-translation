review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the full Greek sense: the temporal sequence, the address to the group at the left, separation from the speaker, the passive designation of the cursed, entry into eternal fire, and its preparation for the devil and his angels. The contextual “ya” (“his”) with “aka ekpe” is acceptable in this scene. The passive wording does not supply an unstated curser.'
  naturalness: The clause is generally clear and appropriately solemn in Standard Igbo. However, the two Greek imperatives are plural. Using the overt plural imperative forms “Sitenụ” and “banyenụ” makes the direct address smoother and grammatically explicit in modern Standard Igbo.
  terminology: “ọkụ ebighị ebi,” “ekwensu,” and “ndị mmụọ ozi ya” are accurate, established, and suitable terms. “Unu ndị a bụrụ ọnụ” preserves the passive force and leaves the agent unspecified, as in Greek.
  issues:
  - severity: low
    issue: Plural imperatives are not overtly marked in “Sinụ ... banye.”
    rationale: The addressees are plural and Πορεύεσθε and the implied command to enter are plural. “Sitenụ ... banyenụ” is the clearer Standard Igbo imperative wording, while preserving the meaning.
