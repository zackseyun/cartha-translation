id: MAT.25.41
reference: Matthew 25:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: ig
  text: Mgbe ahụ, ọ ga-agwakwa ndị nọ n’aka ekpe ya, sị, “Sitenụ n’ebe m nọ pụọ, unu ndị a bụrụ ọnụ[a], banyenụ n’ọkụ ebighị ebi ahụ nke a kwadebeere ekwensu na ndị mmụọ ozi ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu ndị nọ n’okpuru ọbụbụ ọnụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe ga-esochi n’usoro ikpe ahụ, ma bụrụkwa ụzọ Igbo nkịtị si kwuo “then.”
- source_word: ἐρεῖ
  choice: ọ ga-agwakwa ... sị
  rationale: Ọdịnihu nke λέγω ka e gosiri n’enweghị ịgbakwụnye ike okwu na-adịghị na Grik; “-kwa” na-echekwa καί, ya bụ, na ọ ga-agwakwa ìgwè nke ọzọ okwu.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: ndị nọ n’aka ekpe ya
  rationale: Nke a na-egosi ìgwè ndị e debere n’aka ekpe Eze n’ihe gbara amaokwu a gburugburu; okwu a doro onye Igbo nke oge a anya.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: Sinụ n’ebe m nọ pụọ
  rationale: Ọ na-echekwa iwu ka ha hapụ onye na-ekwu okwu ma kewapụ onwe ha n’ebe ọ nọ.
- source_word: οἱ κατηραμένοι
  choice: unu ndị a bụrụ ọnụ
  rationale: Ọ na-egosipụta participle zuru oke nke e ji kpọọ ha okwu, ma ghara ikwu kpọmkwem onye bụrụ ha ọnụ ebe Grik ekwughị ya.
- source_word: εἰς τὸ πῦρ
  choice: banye n’ọkụ
  rationale: “Banye” na-echekwa echiche εἰς nke ịgagharị banye n’ebe a na-aga, ọ bụghị naanị ịga nso ya.
- source_word: τὸ αἰώνιον
  choice: ebighị ebi
  rationale: Nke a bụ okwu Igbo doro anya maka ihe na-adị ruo mgbe ebighị ebi, dabara n’ọnọdụ ikpe ikpeazụ a.
- source_word: τὸ ἡτοιμασμένον
  choice: nke a kwadebeere
  rationale: Ọ na-egosi na e meela ọkụ ahụ ka ọ dị njikere, nakwa na a kwadebere ya maka ndị a kpọrọ aha.
- source_word: τῷ διαβόλῳ
  choice: ekwensu
  rationale: N’ọnọdụ a διάβολος bụ aha a maara nke onye iro ahụ, ọ bụghị naanị nkọwa nke onye nkwutọ.
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: ndị mmụọ ozi ya
  rationale: N’ọnọdụ ikpe a, ἄγγελοι bụ ndị mmụọ nọnyere ekwensu, ọ bụghị ndị ozi mmadụ.
theological_decisions:
- issue: Ihe αἰώνιον pụtara n’ọnọdụ ikpe a
  choice: ebighị ebi
  alternative: nke ga-adị ogologo oge / nke ọgbọ na-abịa
  rationale: “Ebighị ebi” bụ nsụgharị kacha kwekọọ n’iji okwu a mee ihe n’ọnọdụ ikpe ikpeazụ, ma ọ naghị etinye nkọwa otu ụka pụrụ iche n’ime amaokwu ahụ.
- issue: Ndị διάβολος na ἄγγελοι na-ezo aka na ha
  choice: ekwensu na ndị mmụọ ozi ya
  alternative: onye nkwutọ na ndị ozi ya
  rationale: Ọnọdụ ikpe nke ọgwụgwụ na-egosi na ndị a bụ ekwensu na ndị mmụọ so ya; ịsụgharị ha dịka ndị nkịtị ga-eme ka ihe Grik na-ezo aka na ya ghara ịpụta nke ọma.
- issue: Ụdị passive dị na οἱ κατηραμένοι
  choice: unu ndị a bụrụ ọnụ
  alternative: unu ndị nọ n’okpuru ọbụbụ ọnụ
  rationale: A hapụrụ onye mere ọbụbụ ọnụ ahụ n’amaghị ama dịka Grik si mee, nke na-echekwa ma ike okwu ahụ ma ntakịrị oghere nkọwa ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ike nke okwu ikpe ahụ, na-enweghị okwu ochie gabiga ókè ma ọ bụ nkọwa ụka pụrụ iche.
