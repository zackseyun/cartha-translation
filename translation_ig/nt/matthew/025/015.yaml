id: MAT.25.15
reference: Matthew 25:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: ig
  text: O nyere otu onye talent ise[a], nye onye ọzọ abụọ, nyekwa onye ọzọ otu, onye ọ bụla dịka ike ya siri dị[b]; o wee gawa njem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talent bụ otu nnukwu ego n’oge ahụ; n’ebe a, ọ pụtaghị nkà ma ọ bụ onyinye e bu mmadụ pụta ụwa.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dịka ikike onye ọ bụla siri dị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τάλαντα
  choice: talent
  rationale: E debere aha otu ego ochie ahụ dịka “talent” iji ghara ịtụgharị ya ka ọ bụrụ otu ego nke oge a ma ọ bụ mee ka ọ pụta ihe dịka nkà mmadụ. Ihe odide ala peeji kọwara na ọ bụ nnukwu ọnụego ego.
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: otu onye ... onye ọzọ ... onye ọzọ
  rationale: Usoro a na-egosi na e nyere ndị ohu atọ ihe dị iche iche; ntụgharị a bụ Igbo dị mfe ma na-edobe ọdịiche ahụ.
- source_word: ἕν
  choice: otu
  rationale: A naghị ekwughachi “talent” n’asụsụ Grik; “otu” na-edobe nkwusioru ahụ n’ụzọ doro anya n’Igbo.
- source_word: ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν
  choice: dịka ike onye ọ bụla nwere si dị
  rationale: δύναμις ebe a bụ ikike ma ọ bụ ike mmadụ nwere ime ihe, ọ bụghị ike ọrụ ebube. Nkebiokwu Igbo a na-edobe echiche nkesa nke ἑκάστῳ na nke onye ọ bụla n’onwe ya.
- source_word: ἀπεδήμησεν
  choice: ọ wee gawa njem
  rationale: Ngwaa ahụ pụtara ịpụ gaa ebe ọzọ, ọtụtụ mgbe maka njem. “Gawa njem” bụ okwu Igbo sitere n’okike nke na-adịghị agbakwụnye na ọ gara otu mba kpọmkwem.
- source_word: εὐθέως
  choice: ozugbo
  rationale: “Ozugbo” na-enye isi echiche nke ngwa ngwa. N’ihi na njikọ ya na nkebiokwu bu ya ụzọ ma ọ bụ nke na-esote nwere ike ịdị iche, e tinyere ihe odide ala peeji.
- source_word: καὶ
  choice: O ...; o wee
  rationale: A gbanwere njikọ ahụ dịka usoro ahịrịokwu Igbo si dị, ma e debere njikọ akụkọ ya na amaokwu bu ụzọ.
theological_decisions:
- issue: Ihe τάλαντα pụtara n’ilu ahụ
  choice: Talent dịka nnukwu ọnụego ego e nyefere ndị ohu
  alternative: Nkà ma ọ bụ onyinye mmadụ bu pụta ụwa
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ ihe onwunwe nna ukwu nyefere ndị ohu ya. Ya mere, okwu ahụ abụghị “talent” n’echiche nkà mmadụ nwere n’asụsụ nke oge a.
- issue: Onye εὐθέως (“ozugbo”) na-akọwa
  choice: E jikọtara ya na ọpụpụ nna ukwu ahụ n’ahịrịokwu bụ isi
  alternative: Ọ nwere ike ịmalite ihe onye natara talent ise mere n’amaokwu na-esote
  rationale: Usoro okwu Grik na nkewa ahịrịokwu ndị editọ mere na-enye ohere maka njikọ nke abụọ ahụ. E debere isi ọgụgụ nke akwụkwọ ntụnyere Bekee, ma ihe odide ala peeji na-echekwa ezigbo mgbagwoju anya dị na Grik.
- issue: Nkwupụta gbasara onye ọ bụla n’otu n’otu
  choice: dịka ike onye ọ bụla nwere si dị
  alternative: dịka ike nke aka onye ọ bụla si dị
  rationale: Igbo anaghị achọ ka a họrọ nnọchiaha nwoke ma ọ bụ nke ọtụtụ ebe a. Nhazi a na-edobe onye ọ bụla n’otu n’otu n’ebughị echiche gbasara okike nwoke ma ọ bụ nwanyị n’ime ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dịkwa mfe nghọta. E debere “talent” dịka aha otu ego akụkọ ihe mere eme, ma kọwaa ya n’ala peeji ka ndị na-agụ ya ghara ịghọta ya dịka nkà mmadụ. Usoro ahịrịokwu ahụ na-agụ nke ọma n’Igbo ma na-edobe nkesa na ọdịiche dị n’asụsụ Grik.
