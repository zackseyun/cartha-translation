    text: Talent bụ otu nnukwu ego n’oge ahụ; n’ebe a, ọ pụtaghị nkà ma ọ bụ onyinye e bu mmadụ pụta ụwa.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dịka ikike onye ọ bụla siri dị.”
    reason: lexical_alternative
  revision_rationale: The revision removes “ozugbo” and its associated footnote because εὐθέως belongs syntactically with the opening action in Matthew 25:16 in the supplied Greek text. It also improves the monetary-unit explanation and slightly smooths the distributive capacity clause, without changing the sense.
