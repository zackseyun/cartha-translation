  rationale: The revision removes “ozugbo” and its associated footnote because εὐθέως belongs syntactically with the opening action in Matthew 25:16 in the supplied Greek text. It also improves the monetary-unit explanation and slightly smooths the distributive capacity clause, without changing the sense.
