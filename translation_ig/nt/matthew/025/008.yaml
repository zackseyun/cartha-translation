id: MAT.25.8
reference: Matthew 25:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αἱ δὲ μωραὶ ταῖς φρονίμοις εἶπαν· Δότε ἡμῖν ἐκ τοῦ ἐλαίου ὑμῶν, ὅτι αἱ λαμπάδες ἡμῶν σβέννυνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/008.yaml
  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: ig
  text: Ma ndị na-enweghị uche gwara ndị nwere uche, sị, “Nyenụ anyị ụfọdụ n’ime mmanụ unu, n’ihi na oriọna anyị[a] na-achọ ịnyụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ọwa.” Okwu Grik bụ λαμπάδες, nke nwere ike ịpụta ihe ọkụ a na-ejide n’aka, dịka oriọna ma ọ bụ ọwa, dabere n’otú e si ghọta ọnọdụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωραὶ
  choice: ndị na-enweghị uche
  rationale: Ọ bụ adjective e ji mee aha maka ìgwè ụmụ agbọghọ ahụ; nsụgharị a na-egosi enweghị ezi uche na enweghị nkwadebe, ma na-ezere okwu mkparị siri ike.
- source_word: φρονίμοις
  choice: ndị nwere uche
  rationale: Ọ na-egosi amamihe a na-etinye n’omume na ịdị njikere; ọ bụkwa ihe na-emegide ‘ndị na-enweghị uche’ n’ụzọ doro anya ma dịrị Igbo nkịtị.
- source_word: Δότε
  choice: Nyọnụ
  rationale: Aorist imperative plural a bụ arịrịọ e nyere ọtụtụ mmadụ; ‘Nyọnụ’ na-egosipụta iwu/arịrịọ ahụ n’ụzọ kpọmkwem.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: ụfọdụ n’ime mmanụ unu
  rationale: ἐκ na genitive nwere echiche nke iwere otu akụkụ n’ihe ha nwere; ‘ụfọdụ n’ime’ na-egosipụta partitive sense ahụ n’Igbo eke.
- source_word: λαμπάδες
  choice: oriọna
  rationale: Okwu Grik a nwere ike ịpụta oriọna ma ọ bụ ọwa; ebe a, mmanụ na ihe e ji ebu ya na-eme ka ‘oriọna’ bụrụ nhọrọ doro anya nye ọtụtụ ndị na-agụ Igbo, ebe e debere nhọrọ ọzọ na nkọwa ala peeji.
- source_word: σβέννυνται
  choice: na-anyụ anyụ
  rationale: Present tense na-egosi ọkụ ahụ nọ n’usoro ịnyụ; nkwughachi ‘na-anyụ anyụ’ na-enye nghọta nke ihe na-aga n’ihu n’Igbo eke.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara arịrịọ ahụ n’ụzọ doro anya na nke a na-asụkarị n’Igbo.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara ọdịiche dị n’etiti ndị na-enweghị uche na ndị nwere uche, nakwa mgbagwoju anya dị n’okwu λαμπάδες, n’enweghị itinye nkọwa okpukpe pụrụ iche.
