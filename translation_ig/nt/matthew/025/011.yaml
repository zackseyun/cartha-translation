  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὕστερον δὲ ἔρχονται καὶ αἱ λοιπαὶ παρθένοι λέγουσαι· Κύριε κύριε, ἄνοιξον ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: ig
  text: Mgbe e mesịrị, ụmụ agbọghọ na-amaghị nwoke ndị fọdụrụ bịakwara, sị, “Onyenwe anyị, Onyenwe anyị,[a] megheere anyị.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya, “Nna ukwu, nna ukwu.” Grik: Kyrios, kyrios.'
    reason: alternative_reading
  - marker: b
    text: Grik kwuru naanị “megheere anyị”; a ghọtara “ọnụ ụzọ” site n'ihe ndị gbara okwu a gburugburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Mgbe e mesịrị
  rationale: Na-egosi na ihe a mere n'oge sochirinụ; okwu a bụ Igbo nkịtị ma doo anya.
- source_word: δὲ
  choice: —
  rationale: Ọ bụ njikọ dị nro; usoro ahịrịokwu Igbo na “Mgbe e mesịrị” ezuola igosi ntụgharị akụkọ ahụ n'enweghị ịgbakwụnye njikọ ọzọ.
- source_word: ἔρχονται
  choice: bịakwara
  rationale: Oge ugbu a nke akụkọ Grik na-eme ka ihe ahụ dị ndụ; n'Igbo, oge gara aga dabara n'akụkọ a, ebe “-kwara” na-ejikọkwa ike mgbakwunye nke καί.
- source_word: καὶ
  choice: -kwara
  rationale: Mgbakwunye dị na καί pụtara n'ọnụnọ mgbakwunye “-kwara” n'okwu “bịakwara.”
- source_word: αἱ λοιπαὶ παρθένοι
  choice: ụmụ agbọghọ na-amaghị nwoke ndị ọzọ
  rationale: “Ndị ọzọ” na-eburu echiche λοιπαί, ebe nkọwa “na-amaghị nwoke” na-echekwa ihe παρθένοι pụtara n'ụzọ ndị na-agụ Igbo ga-aghọta.
- source_word: λέγουσαι
  choice: na-asị
  rationale: Na-ewebata okwu ha kwuru ozugbo, dịka participle Grik ahụ si eme.
- source_word: Κύριε κύριε
  choice: Onyenwe anyị, Onyenwe anyị
  rationale: Na-echekwa nkwughachi maka arịrịọ siri ike, ma na-ahapụ ma nkwanye ùgwù nke okwu ahụ ma ụda nkà mmụta okpukpe Matiu nwere.
- source_word: ἄνοιξον ἡμῖν
  choice: megheere anyị
  rationale: Na-eburu iwu nke ἄνοιξον na uru/nnweta nke dative ἡμῖν, n'etinyeghị “ọnụ ụzọ,” nke a ghọtara site n'ọnọdụ akụkọ ma adịghị n'okwu Grik.
theological_decisions:
- issue: Nsụgharị κύριος mgbe a na-akpọ mmadụ ozugbo
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: '“Onyenwe anyị” na-echekwa ịdị abụọ nke okwu ahụ: ọ pụrụ ịbụ aha nkwanye ùgwù n''ilu ahụ ma nwekwaa ibu nkà mmụta okpukpe n''Oziọma Matiu; “Nna ukwu” nwere ike ime ka ọ bụrụ naanị aha mmadụ na-asọpụrụ.'
translation_notes:
  register: Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E chekwara nkwughachi nke arịrịọ ahụ na enweghị okwu “ọnụ ụzọ” n'ahịrị bụ isi. E tinyere akara nkọwa ala ala niile n'ahịrị bụ isi.
