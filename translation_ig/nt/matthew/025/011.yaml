review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal sequence, the additive arrival of the λοιπαὶ παρθένοι, the repeated vocative, and the imperative request. “Onyenwe anyị” is an established Standard Igbo rendering for κύριε and appropriately retains the title’s possible theological resonance. However, “ndị ọzọ” can mean simply ‘other’ rather than specifically those remaining; “ndị fọdụrụ” more directly reflects λοιπαί in this context.
  naturalness: The sentence is generally clear and appropriately formal. Replacing the progressive participial construction “na-asị” with the narrative speech introducer “sị” is more idiomatic after the completed narrative verb “bịakwara.”
  terminology: “Ụmụ agbọghọ na-amaghị nwoke” retains παρθένοι without importing a narrower interpretive label. “Onyenwe anyị” is suitable for κύριε here. The footnote correctly notes “Nna ukwu” as an alternative, while the main text retains the broader resonance of “Onyenwe anyị.”
  issues:
  - severity: low
    issue: “ndị ọzọ” is less specific than λοιπαί.
    rationale: In this parable λοιπαί identifies the virgins who remained—the other group. “Ndị fọdụrụ” expresses this more precisely in Standard Igbo.
  - severity: low
    issue: “na-asị” is less natural in this completed narrative sequence.
    rationale: After “bịakwara,” the speech-introducing form “sị” is the more natural Igbo narrative equivalent of λέγουσαι.
  revised_text: Mgbe e mesịrị, ụmụ agbọghọ na-amaghị nwoke ndị fọdụrụ bịakwara, sị, “Onyenwe anyị, Onyenwe anyị,[a] megheere anyị.”[b]
