revisions:
- from: Tụpụkwanụ ohu ahụ na-abaghị uru n'ọchịchịrị dị n'èzí.[a] N'ebe ahụ ka ịkwa ákwá na ịta ikikere ezé ga-adị.
  to: Tụpụnụ ohu ahụ na-abaghị uru n'ọchịchịrị dị n'èzí.[a] N'ebe ahụ ka a ga-enwe ịkwa ákwá na ịta ikikere ezé.
  rationale: The revision removes an unneeded additive nuance while preserving the plural imperative, improves the idiomatic expression of the final clause, and replaces the self-duplicating footnote alternative with a real contextual alternative. It does not interpret the outer darkness or the suffering imagery beyond the wording of the verse.
