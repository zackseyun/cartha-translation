review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the principal source elements: the forceful plural command, the worthless slave, expulsion into the outer darkness, and the Matthean image of weeping and gnashing of teeth. However, “Tụpụkwanụ” contains the additive particle “kwa” (‘also’), which is not needed for the Greek conjunction and can sound like an added emphasis; “Tụpụnụ” directly and naturally represents the plural imperative ἐκβάλετε.'
  naturalness: “N'ebe ahụ ka ịkwa ákwá na ịta ikikere ezé ga-adị” is intelligible, but “ebe ahụ ka a ga-enwe ...” is more idiomatic Standard Igbo for the occurrence of weeping and gnashing. “ịta ikikere ezé” is retained as a natural established rendering of the image.
  terminology: “Ohu” appropriately renders δοῦλος in this parabolic master–slave context. The existing footnote is structurally unhelpful because its stated alternative, “ohu ahụ,” is the same wording as the main text. It should instead identify “onye na-eje ozi” as the alternative rendering and retain the source-language term only as explanatory information.
  issues:
  - severity: low
    issue: Unnecessary additive particle in “Tụpụkwanụ.”
    rationale: The “kwa” can mean ‘also’ and is not required to translate καὶ here. “Tụpụnụ” preserves the plural force of the imperative without adding that nuance.
  - severity: medium
    issue: Footnote alternative duplicates the main rendering.
    rationale: The main text already reads “ohu ahụ,” so the footnote does not provide a genuine alternative reading. “Onye na-eje ozi” is the relevant contextual alternative for δοῦλος.
  - severity: low
    issue: Less idiomatic existential wording in the final clause.
    rationale: Using “a ga-enwe” gives a more natural Standard Igbo expression for ‘there will be’ while preserving the source’s imagery and leaving its theological referent unspecified.
  revised_text: Tụpụnụ ohu ahụ na-abaghị uru n'ọchịchịrị dị n'èzí.[a] N'ebe ahụ ka a ga-enwe ịkwa ákwá na ịta ikikere ezé.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-eje ozi.” Okwu Grik ahụ bụ doulos, nke nwere ike ịpụta “ohu” ma ọ bụ “onye na-eje ozi”; n'ebe a, “ohu” dabara n'ọnọdụ ilu ahụ nke nna ukwu na ndị nọ n'okpuru ya.
    reason: alternative_reading
  revision_rationale: The revision removes an unneeded additive nuance while preserving the plural imperative, improves the idiomatic expression of the final clause, and replaces the self-duplicating footnote alternative with a real contextual alternative. It does not interpret the outer darkness or the suffering imagery beyond the wording of the verse.
