  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless servant into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: ig
  text: Tụpụnụ ohu ahụ na-abaghị uru n'ọchịchịrị dị n'èzí.[a] N'ebe ahụ ka a ga-enwe ịkwa ákwá na ịta ikikere ezé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-eje ozi.” Okwu Grik ahụ bụ doulos, nke nwere ike ịpụta “ohu” ma ọ bụ “onye na-eje ozi”; n'ebe a, “ohu” dabara n'ọnọdụ ilu ahụ nke nna ukwu na ndị nọ n'okpuru ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: na-abaghị uru
  rationale: Nkebiokwu a na-egosi onye nna ya ukwu lere anya dị ka onye na-enweghị uru n'ọrụ e nyere ya; ọ bụ asụsụ Igbo dị ugbu a nke na-edobe ịdị arọ nke ikpe ahụ.
- source_word: δοῦλον
  choice: ohu
  rationale: “Ohu” na-egosipụta ọnọdụ onye nọ n'okpuru nna ukwu n'ụzọ dabara n'usoro ilu a, ma ọ pụkwara ịpụta onye na-eje ozi dabere n'ọnọdụ okwu.
- source_word: ἐκβάλετε
  choice: Tụpụkwanụ
  rationale: Ngwaa iwu a siri ike ma na-egosipụta ịchụpụ onye ahụ ozugbo; “tụpụ” bụ okwu Igbo doro anya ma dị ike.
- source_word: σκότος τὸ ἐξώτερον
  choice: ọchịchịrị dị n'èzí
  rationale: Nke a na-edobe echiche kpọmkwem nke ọchịchịrị nke dị n'èzí, ya bụ ọnọdụ nke ịbụ onye a chụpụrụ n'ebe ahụ.
- source_word: ἐκεῖ
  choice: N'ebe ahụ
  rationale: Ọ na-arụtụ aka kpọmkwem n'ọchịchịrị dị n'èzí a kpọrọ aha n'ahịrịokwu bu ụzọ.
- source_word: κλαυθμὸς
  choice: ịkwa ákwá
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke dị ùgwù si akọwa akwa sitere ná mwute, na-agbakwụnyeghị nkọwa na-adịghị n'okwu Grik.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: ịta ikikere ezé
  rationale: Nkebiokwu Igbo a na-eburu ihe oyiyi nke ịta ma ọ bụ ịghịkọta ezé n'ihi nhụjuanya ma ọ bụ iwe, n'emeghị ka otu mmetụta naanị bụrụ ihe a chọrọ ikwu.
theological_decisions:
- issue: Ụdị ikpe ihe oyiyi ilu a na-egosi
  choice: E debere ihe oyiyi nke ịchụpụ mmadụ n'ọchịchịrị na nhụjuanya ya n'enweghị ịkpọ ya ọkụ ala mmụọ ma ọ bụ ịkọwa ụdị ntaramahụhụ ahụ kpọmkwem.
  alternative: Ịkọwa ya hoo haa dị ka ọkụ ala mmụọ, ma ọ bụ dị ka naanị ịchụpụ nwa oge ma ọ bụ ihe atụ nkịtị.
  rationale: Okwu ahụ ji asụsụ ikpe a na-ahụkarị na Matiu, ma ọ naghị akọwa n'amaokwu a ihe karịrị ịchụpụ mmadụ n'ọchịchịrị, ịkwa ákwá, na ịta ikikere ezé. Nsụgharị ahụ na-edobe mgbagwoju anya na ike nke ihe oyiyi ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, doro anya ma dị ùgwù. E ji usoro iwu siri ike “Tụpụkwanụ” debe ike nke Grik, ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa okpukpe gafere ihe amaokwu ahụ kwuru.
