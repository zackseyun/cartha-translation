  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/013.yaml
  text: But the one who endures to the end will be saved[a][b].
translation:
  language: ig
  text: Ma onye tachiri obi ruo ọgwụgwụ[a], onye ahụ ka a ga-azọpụta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ruo na njedebe.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a ga-anapụta.” Okwu Grik ahụ nwere ike ịpụta nnapụta n’ihe ize ndụ ma ọ bụ nzọpụta; e debere okwu sara mbara n’amaokwu ahụ n’ihi na ihe ndị gbara ya gburugburu anaghị amanye ka a họrọ naanị otu nghọta.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... ὑπομείνας
  choice: onye tachiri obi
  rationale: Njikọ aha-nkọwa a na-ezo aka n’onye nọgidere na-eguzosi ike n’ọnwụ n’agbanyeghị mkpagbu. “Onye tachiri obi” bụ Igbo dị mfe ma doo anya, ọ naghịkwa akọwapụta nwoke ma ọ bụ nwanyị.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi obere ntụgharị ma ọ bụ ọdịiche dị n’etiti ịdọ aka ná ntị ndị bu ụzọ na nkwa dị n’amaokwu a.
- source_word: ὑπομείνας
  choice: tachiri obi
  rationale: Okwu a pụtara ịnọgide n’okpuru ọnwụnwa ma ọ bụ mkpagbu n’esighị ike; “tachiri obi” na-enye nghọta ahụ n’Igbo nkịtị.
- source_word: εἰς τέλος
  choice: ruo ọgwụgwụ
  rationale: Nkebiokwu a na-egosi ịnọgide ruo ebe ikpeazụ. “Ruo ọgwụgwụ” dị nkenke ma bụrụ okwu Igbo ebumpụta ụwa; a na-edebe ụzọ ọzọ n’ala peeji.
- source_word: οὗτος
  choice: onye ahụ ka
  rationale: “Onye ahụ ka” na-echekwa nkwusi ike nke οὗτος ma na-ejikọ ya n’ụzọ kwesịrị ekwesị na “onye tachiri obi.”
- source_word: σωθήσεται
  choice: a ga-azọpụta
  rationale: Ụdị ọdịnihu a na-eme n’ahụ onye ahụ nwere ike ịpụta nzọpụta ma ọ bụ nnapụta. “A ga-azọpụta” na-edebe nghọta sara mbara nke okwu Grik ahụ ma ghara imechi ihe ọ pụtara n’otu ụzọ naanị.
theological_decisions:
- issue: Ihe “a ga-azọpụta” pụtara n’ọnọdụ ikwusi ike ruo ọgwụgwụ
  choice: E debere okwu sara mbara “a ga-azọpụta,” n’akọwaghị ma ọ bụ nzọpụta ikpeazụ, nnapụta site ná mkpagbu, ma ọ bụ ha abụọ.
  alternative: “A ga-anapụta,” nke nwere ike ilekwasị anya karị ná nnapụta n’ihe ize ndụ.
  rationale: Amaokwu ahụ n’onwe ya anaghị ekpebi oke nghọta nke σωθήσεται. Nsụgharị ahụ na-echekwa mgbagwoju na esemokwu nkà mmụta okpukpe dị na ya kama ịmanye nkọwa otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Nkebiokwu “onye ahụ ka” na-echekwa nkwusi ike nke Grik n’enweghị asụsụ siri ike ma ọ bụ nke ochie.
