    issue: Footnote a is awkwardly phrased.
    rationale: “ruo mgbe ọgwụgwụ ga-eru” is a cumbersome paraphrase that can suggest the arrival of a distinct event rather than simply continuance until the endpoint. “ruo na njedebe” is a clear, idiomatic lexical alternative.
