id: MAT.24.29
reference: Matthew 24:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: ig
  text: Ma ozugbo, mgbe mkpagbu nke ụbọchị ndị ahụ gasịrị, anyanwụ ga-agba ọchịchịrị, ọnwa agaghị enye ìhè ya, kpakpando ga-esi n’eluigwe daa[a], ike ndị dị n’eluigwe ga-ama jijiji[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “eluigwe” ebe a dị ka “mbara igwe.”
    reason: lexical_alternative
  - marker: b
    text: “Ike ndị dị n’eluigwe” nwere ike izo aka n’ike ndị dị na mbara igwe, n’ihe ndị dị na mbara igwe, ma ọ bụ n’ike ndị dị n’eluigwe; okwu Grik ahụ kpachaara anya dị sara mbara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: Ma ozugbo
  rationale: “Ozugbo” na-echekwa ike okwu oge ahụ, ebe “Ma” na-egosi ntụgharị okwu nta nke δὲ.
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: mkpagbu nke ụbọchị ndị ahụ gasịrị
  rationale: “Mkpagbu” na-egosipụta nhụjuanya siri ike nke θλῖψις, ma usoro a na-ejigide njikọ ya na “ụbọchị ndị ahụ” n’Igbo dị n’ụzọ kwekọrọ n’okwu nkịtị.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: anyanwụ ga-agba ọchịchịrị
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa ebube isi kwuo na anyanwụ ga-aghọ ọchịchịrị, n’agbanyeghị na Grik ji ọdịdị ngwaa nnara mee ya.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: ọnwa agaghịkwa enye ìhè ya
  rationale: Nsụgharị a na-echekwa ihe oyiyi Grik nke ọnwa na-agaghị enye ìhè ya.
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: kpakpando ga-esi n’eluigwe daa
  rationale: “Ga-esi … daa” na-egosipụta ọdịda site n’ebe a kpọrọ οὐρανός, nke nwere ike ịbụ eluigwe ma ọ bụ mbara igwe.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: ike nke eluigwe
  rationale: A hapụrụ “ike” na “eluigwe” n’ụzọ sara mbara ka a ghara ikpebi ma okwu ahụ ọ na-ekwu banyere ike ndị dị n’eluigwe, ihe ndị dị na mbara igwe, ma ọ bụ ike nke ụwa eluigwe.
- source_word: σαλευθήσονται
  choice: ga-amakwa jijiji
  rationale: “Ịma jijiji” bụ okwu Igbo eke nke na-egosi ịmagharị ma ọ bụ ịma jijiji siri ike nke σαλεύω.
theological_decisions:
- issue: Ụdị ihe ịrịba ama ndị a na-ahụ na mbara igwe n’okwu amụma banyere ọgwụgwụ
  choice: E debere ihe oyiyi ndị ahụ otú ha dị, n’akọwaghị ma ha bụ ihe ga-eme n’ụzọ nkịtị, asụsụ ihe atụ nke amụma, ma ọ bụ ha abụọ.
  alternative: Ịkọwa ha naanị dị ka mbibi nke ihe ndị dị na mbara igwe, ma ọ bụ naanị dị ka ihe atụ nke mgbanwe ọchịchị na ikpe.
  rationale: Okwu Grik ji ihe oyiyi amụma na nke mkpughe mee ihe ma ọ naghị ekpebi otu n’ime nkọwa ndị a; ya mere nsụgharị ahụ echekwala esemokwu ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E tinyere akara nkọwa [a] n’ebe okwu οὐρανός pụtara, ma tinye [b] n’akụkụ ahịrịokwu na-edochaghị anya αἱ δυνάμεις τῶν οὐρανῶν; nke a na-eme ka akara ndị ahụ kwekọọ n’ezi ọdịnaya nke nkọwa ala peeji.
