revisions:
- from: Ma ozugbo mkpagbu nke ụbọchị ndị ahụ gasịrị, anyanwụ ga-agba ọchịchịrị, ọnwa agaghịkwa enye ìhè ya, kpakpando ga-esi n’eluigwe daa[a], ike nke eluigwe ga-amakwa jijiji[b].
  to: Ma ozugbo, mgbe mkpagbu nke ụbọchị ndị ahụ gasịrị, anyanwụ ga-agba ọchịchịrị, ọnwa agaghị enye ìhè ya, kpakpando ga-esi n’eluigwe daa[a], ike ndị dị n’eluigwe ga-ama jijiji[b].
  rationale: The revision makes the emphatic temporal relation explicit, represents the plural “powers” in the source, and removes an unsupported interpretation from the explanatory note. It leaves the apocalyptic imagery and the referential ambiguity of “the powers of the heavens” unresolved.
