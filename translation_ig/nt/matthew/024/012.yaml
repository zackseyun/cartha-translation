source:
  edition: SBLGNT
  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: ig
  text: N’ihi na mmebi iwu ga-aba ụba[a], ịhụnanya nke ọtụtụ mmadụ[b] ga-ajụ oyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi mmụba nke mmebi iwu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịhụnanya nke ọtụtụ ndị ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: N’ihi na ... ga-aba ụba
  rationale: διά tinyere infinitive nwere article na-egosi ihe kpatara ihe; ‘ga-aba ụba’ na-edobe ike nke ngwaa na ntụaka ya n’ihe ga-eme, ma bụrụkwa Igbo dị mfe ma kwụ ọtọ.
- source_word: ἀνομίαν
  choice: mmebi iwu
  rationale: ἀνομία na-ezo aka n’ileghara iwu anya ma ọ bụ imegide ya, karịsịa iwu Chineke. ‘Mmebi iwu’ doro ndị na-agụ Igbo anya ma kpọmkwem karịa okwu sara mbara dịka ‘ajọ omume.’
- source_word: ψυγήσεται
  choice: ga-ajụ oyi
  rationale: Nke a na-edobe ihe atụ Greek nke ịhụnanya na-ajụ oyi, ma bụrụkwa ụzọ ebumpụta ụwa e si ekwu ya n’Igbo.
- source_word: ἀγάπη
  choice: ịhụnanya
  rationale: ‘Ịhụnanya’ bụ okwu Igbo kwesịrị ekwesị ma bụrụ nke a na-aghọta nke ọma maka ἀγάπη.
- source_word: τῶν πολλῶν
  choice: nke ọtụtụ mmadụ
  rationale: Nhọrọ a na-edobe ókè okwu Greek ahụ na-akọwaghị kpọmkwem òtù ndị a na-ekwu maka ha; ọ naghị agbanwe ya ka ọ bụrụ ‘ọtụtụ n’ime mmadụ niile’ ma ọ bụ ‘ndị kwere ekwe.’
theological_decisions:
- issue: Ònye ka ‘ịhụnanya nke ọtụtụ mmadụ’ na-ezo aka na ya?
  choice: E kwughị kpọmkwem ma ha bụ mmadụ n’ozuzu, ndị na-eso ụzọ, ma ọ bụ òtù agwakọtara ọnụ.
  alternative: ịhụnanya dị n’etiti ndị kwere ekwe ga-ajụ oyi; ịhụnanya mmadụ n’obodo ga-ajụ oyi
  rationale: τῶν πολλῶν akọwaghị òtù ahụ kpọmkwem. Nsụgharị ahụ na-ahapụ nghọtahie a ka ọ dị, kama itinye nkọwa okpukpe nke ederede ahụ n’onwe ya na-ekwughị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ ‘ga-ajụ oyi,’ ma zere okwu ụka pụrụ iche ma ọ bụ ịkọwa kpọmkwem ndị ‘ọtụtụ mmadụ’ bụ.
