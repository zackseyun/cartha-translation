  text: ἀμὴν λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: ig
  text: N’ezie, ana m asị unu na ọ ga-ahọpụta ya ka ọ bụrụ onye nlekọta ihe niile o nwere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’elu ihe niile bụ nke ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: N’ezie
  rationale: Ọ na-ewebata nkwupụta siri ike nke nwere ikike; “N’ezie” bụ Igbo dị ugbu a ma na-eburu ịdị arọ nke okwu ahụ n’enweghị idegharị “Amen.”
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Nke a na-edobe okwu Jizọs kpọmkwem ma na-ada nke ọma n’Igbo.
- source_word: ὅτι
  choice: na
  rationale: “Na” na-ewebata ihe e kwuru n’ụzọ doro anya ma kwekọọ n’usoro okwu Igbo.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: ka ọ na-elekọta ihe niile o nwere
  rationale: ἐπί ya na καθίστημι na-egosi inyefe mmadụ ọrụ na ikike n’elu ihe niile nke nna ukwu ahụ; “ihe niile o nwere” na-egosipụta τοῖς ὑπάρχουσιν αὐτοῦ n’ụzọ eke ma doo anya.
- source_word: καταστήσει
  choice: ọ ga-ahọpụta ... ka ọ na-elekọta
  rationale: N’ebe a, ngwaa ahụ pụtara ịhọpụta ma ọ bụ itinye mmadụ n’ọrụ nlekọta, ọ bụghị naanị idowe ya n’otu ebe.
- source_word: αὐτόν
  choice: ya
  rationale: Ọ na-ezo aka n’ohu/odibo nwoke ahụ kwesịrị ntụkwasị obi nke amaokwu ndị bu ụzọ kwuru banyere ya; nnọchiaha Igbo “ya” anaghị egosi okike n’onwe ya, ma ihe ọ na-ezo aka na ya ka dị otu.
theological_decisions:
- issue: Ụdị ụgwọ ọrụ ma ọ bụ ọrụ sara mbara nna ukwu ahụ nyere
  choice: E gosipụtara ya dịka ịhọpụta odibo ahụ ka ọ na-elekọta ihe niile nna ukwu ahụ nwere.
  alternative: Ịkọwa ya kpọmkwem dịka ikike n’ọgbakọ ma ọ bụ dịka ụgwọ ọrụ eluigwe n’oge ikpeazụ.
  rationale: Amaokwu ahụ n’onwe ya na-ekwu maka ibuli onye ahụ n’ọrụ nlekọta sara mbara n’ime ilu ahụ; ntụgharị ekwesịghị itinye nkọwa ụka ma ọ bụ usoro ihe ga-eme n’oge ikpeazụ nke ederede ahụ ekwughị kpọmkwem.
translation_notes:
  register: Igbo Izugbe dị ugbu a, kwụ ọtọ ma nwee ugwu. E ji “N’ezie” chekwaa ịdị nsọ na ịdị arọ nke usoro okwu ahụ; e jikwa “ihe niile o nwere” mee ka okwu banyere ihe nna ukwu nwere bụrụ nke onye nkịtị ga-aghọta ngwa ngwa.
