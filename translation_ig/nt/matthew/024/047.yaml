    reason: lexical_alternative
  revision_rationale: The revision preserves the verse’s meaning while using a more natural Igbo expression for appointment to oversight. The footnote now offers the legitimate lexical alternative ‘over all that is his’ and avoids introducing the additional concept of leadership.
