revisions:
- from: Jizọs si n’ụlọ nsọ ahụ pụta, na-ala, ndị na-eso ụzọ ya abịakwutekwa ya igosi ya ụlọ dị iche iche nke ụlọ nsọ ahụ.[a]
  to: Jizọs si n’ụlọ nsọ[a] pụta na-aga; ndị na-eso ụzọ ya bịakwutere ya igosi ya ihe owuwu ụlọ nsọ ahụ.
  rationale: The revision removes the additive nuance not present in προσῆλθον, renders οἰκοδομάς as “ihe owuwu,” and improves sentence structure. It retains the imperfective departure through “na-aga,” preserves the purpose infinitive with “igosi,” and keeps the ἱερόν precinct nuance in a footnote anchored at its first occurrence.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:40Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the sequence of Jesus leaving the temple precincts and the disciples’ purpose in approaching him. However, “ụlọ dị iche iche” can mean buildings that differ from one another, rather than the temple buildings/structures, and “abịakwutekwa” introduces an unwarranted additive sense (“also”).
  naturalness: The present string is a comma splice and is less fluent than a sentence that separates the disciples’ action with a semicolon. “Si n’ụlọ nsọ pụta na-aga” is a natural concise way to retain the preceding exit and ongoing departure.
  terminology: “ụlọ nsọ” is the normal Standard Igbo rendering and the footnote appropriately distinguishes Greek ἱερόν as the precinct/complex rather than only the inner sanctuary. “Ihe owuwu” more accurately conveys οἰκοδομαί than “ụlọ dị iche iche.”
  issues:
  - severity: medium
    issue: “abịakwutekwa ya” adds “also/again.”
    rationale: προσῆλθον is simply “came/approached”; καί links the clauses but does not require the additive nuance carried by -kwa.
  - severity: medium
    issue: “ụlọ dị iche iche” is semantically imprecise for οἰκοδομάς.
    rationale: It can mean “different/various houses,” whereas the Greek denotes the constructed buildings or structures of the temple complex.
  - severity: low
    issue: The clause sequence is joined only by commas.
    rationale: A semicolon makes the two coordinated narrative actions clear and produces more natural modern written Igbo.
  revised_text: Jizọs si n’ụlọ nsọ[a] pụta na-aga; ndị na-eso ụzọ ya bịakwutere ya igosi ya ihe owuwu ụlọ nsọ ahụ.
  revised_footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụlọ nsọ” na-ezo aka n’ogige ụlọ nsọ na ihe owuwu dị na ya, ọ bụghị naanị ebe nsọ dị n’ime ya.
    reason: lexical_alternative
  revision_rationale: The revision removes the additive nuance not present in προσῆλθον, renders οἰκοδομάς as “ihe owuwu,” and improves sentence structure. It retains the imperfective departure through “na-aga,” preserves the purpose infinitive with “igosi,” and keeps the ἱερόν precinct nuance in a footnote anchored at its first occurrence.
