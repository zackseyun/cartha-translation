id: MAT.24.1
reference: Matthew 24:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: ig
  text: Jizọs si n’ụlọ nsọ[a] pụta na-aga; ndị na-eso ụzọ ya bịakwutere ya igosi ya ihe owuwu ụlọ nsọ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụlọ nsọ” na-ezo aka n’ogige ụlọ nsọ na ihe owuwu dị na ya, ọ bụghị naanị ebe nsọ dị n’ime ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: si n’ụlọ nsọ ahụ pụta
  rationale: 'Ọ bụ aorist participle nke na-egosi ihe mere tupu ngwaa bụ isi: Jizọs buru ụzọ pụta n’ebe ahụ. Nhọrọ a debere echiche nke isi n’ime pụta n’enweghị ịgbakwụnye nkọwa ọzọ.'
- source_word: ἱεροῦ
  choice: ụlọ nsọ ahụ
  rationale: ἱερόν na-ezo aka n’ogige na ụlọ niile nke ebe nsọ ahụ, ọ bụghị naanị ime ụlọ nsọ kachasị nsọ. “Ụlọ nsọ” bụ okwu Igbo a na-aghọta ngwa ngwa; nkọwa ala peeji na-eme ka obosara ihe okwu Grik ahụ pụtara doo anya.
- source_word: ἐπορεύετο
  choice: na-ala
  rationale: Ụdị imperfect a na-egosi njem na-aga n’ihu mgbe ọ pụtasịrị. “Na-ala” na-egosipụta nke a n’Igbo dị mfe ma dị ndụ.
- source_word: προσῆλθον
  choice: abịakwutekwa ya
  rationale: Okwu a pụtara ịbịakwute ma ọ bụ ịbịaru mmadụ nso. “Abịakwutekwa ya” dabara n’usoro akụkọ ahụ ma debe njikọ καί.
- source_word: ἐπιδεῖξαι
  choice: igosi ya
  rationale: 'Infinitive a na-egosi ebumnuche ndị na-eso ụzọ ji bịakwute ya: ka ha gosi ya ihe.'
- source_word: οἰκοδομὰς
  choice: ụlọ dị iche iche
  rationale: N’ebe a, οἰκοδομαί bụ ọtụtụ ụlọ ma ọ bụ ihe owuwu mejupụtara ebe ụlọ nsọ ahụ. “Ụlọ dị iche iche” na-eme ka plural ahụ doo anya n’Igbo nkịtị.
- source_word: τοῦ ἱεροῦ
  choice: nke ụlọ nsọ ahụ
  rationale: Genitive a na-akọwa na ụlọ ndị ahụ bụ akụkụ nke ogige na ihe owuwu ụlọ nsọ ahụ; ikwughachi “ụlọ nsọ ahụ” na-edebe nkwughachi na nkwusi ike nke Grik.
theological_decisions:
- issue: Ọdịiche dị n’etiti ἱερόν na ναός
  choice: ụlọ nsọ ahụ, tinyere nkọwa ala peeji
  alternative: ogige na ụlọ niile nke ụlọ nsọ ahụ
  rationale: Isi amaokwu ji okwu a na-ahụkarị, “ụlọ nsọ,” mee ka ọgụgụ dị mfe, ma nkọwa [a] na-echekwa kpọmkwem na ἱερόν gụnyere mpaghara na ihe owuwu niile, ọ bụghị naanị ebe nsọ dị n’ime. Nke a anaghị etinye nkọwa okpukpe karịrị ihe ederede kwuru.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma nwee ugwu. E debere usoro omume abụọ—ịpụta na ịga n’ihu n’ụzọ—ma jiri “ụlọ dị iche iche” mee ka ọtụtụ ihe owuwu ahụ doo anya.
