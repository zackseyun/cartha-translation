id: MAT.24.43
reference: Matthew 24:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: ig
  text: 'Ma maranụ nke a: a sị na onye nwe ụlọ maara n’oge nche abalị ole ka onye ohi ga-abịa[a], ọ gaara anọ na nche, ọ gaghịkwa ekwe ka a kpọpuo mgbidi ụlọ ya banye[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, n’otu n’ime oge e kewara abalị maka nche.
    reason: cultural_note
  - marker: b
    text: N'ụzọ nkịtị, “ka e gwupuo ụlọ ya.” N’oge ahụ, onye ohi pụrụ ịkpọpu mgbidi ụlọ wee si na ya banye.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: Ma maranụ nke a
  rationale: Ọ na-egosi mgbanwe n'okwu ahụ site na δέ ma na-edobe ntụziaka a gwara ndị na-ege ntị ozugbo.
- source_word: οἰκοδεσπότης
  choice: onye nwe ụlọ
  rationale: Nke a bụ okwu Igbo doro anya maka onye na-achị ma na-elekọta ụlọ; ọ dabara n'ihe atụ a n'enweghị itinye aha ọkwá okpukpe.
- source_word: ποίᾳ φυλακῇ
  choice: oge nche abalị nke
  rationale: φυλακή n'ebe a bụ otu n'ime oge e kewara abalị maka nche. Nsụgharị a na-edobe ọdịnala ahụ, ebe nkọwa ala peeji na-eme ka ọ doo anya.
- source_word: ὁ κλέπτης ἔρχεται
  choice: onye ohi ga-eji bịa
  rationale: Ọ bụ ezie na ἔρχεται dị n'ụdị ugbu a, ihe a na-ekwu bụ oge ọbịbịa onye ohi n'ọnọdụ atụghị eme; ụdị ọdịnihu a na-ada nke ọma n'Igbo n'ime ahịrịokwu ahụ.
- source_word: ἐγρηγόρησεν ἂν
  choice: ọ gaara amụ anya
  rationale: Ọ na-egosipụta ịnọ na nche na ịghara ihi ụra, ma na-edobe ụdị ọnọdụ megidere ihe mere n'eziokwu.
- source_word: οὐκ ἂν εἴασεν
  choice: ọ gaghịkwa ekwe
  rationale: Nke a bụ ụzọ Igbo dị mfe ma ziri ezi isi kwuo na ọ gaghị enye ohere ka ihe ahụ mee.
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: ka a kpọwaa ụlọ ya banye
  rationale: διορύσσω pụtara n'ụzọ nkịtị igwu ma ọ bụ kpọpu akụkụ ụlọ iji banye. Okwu a na-enye onye na-agụ Igbo echiche nke ịgbaji ụlọ wee banye, ebe nkọwa ala peeji na-edobe ihe oyiyi mbụ ahụ.
theological_decisions:
- issue: Ihe oyiyi nke οἰκοδεσπότης
  choice: onye nwe ụlọ
  alternative: onyeisi ụlọ
  rationale: Amaokwu a bụ ihe atụ, ọ bụghị aha e ji akọwa Chineke ma ọ bụ Kraịst kpọmkwem. Nhọrọ a bụ nke a na-aghọta ngwa ngwa ma ọ naghị etinye nkọwa ụka pụrụ iche.
- issue: Ihe oyiyi ọdịnala dị na διορύσσω
  choice: ka a kpọwaa ụlọ ya banye
  alternative: ka e gwupuo ụlọ ya
  rationale: Isi amaokwu ahụ na-enye ihe ọ pụtara n'Igbo a na-asụ ugbu a, ebe nkọwa [b] na-echekwa ihe oyiyi nkịtị nke ụlọ oge ochie a pụrụ igwu mgbidi ya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “A sị na ... ọ gaara ...” na-egosipụta ọnọdụ megidere ihe mere n'eziokwu; e debekwara ihe oyiyi nke nche abalị na ịkpọpu ụlọ n'enweghị ime ka nkọwa okpukpe ọ bụla bụrụ nke a manyere n'amaokwu ahụ.
