source:
  edition: SBLGNT
  text: ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω ἆραι τὰ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/017.yaml
  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: ig
  text: Ka onye nọ n’elu ụlọ[a] ghara ịgbadata iji wepụta ihe ndị dị n’ụlọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a na-ezo aka n’elu ụlọ dị larịị, nke ndị mmadụ pụrụ ịnọ n’elu ya ma jiri ya mee ihe.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: onye nọ n’elu ụlọ
  rationale: Nkebiokwu Grik a na-arụ ọrụ dị ka aha, ya bụ, ‘onye nọ n’elu ụlọ.’ ‘Onye’ na-egosipụta otu onye a na-eji anọchi anya onye ọ bụla, n’etinyeghị nwoke n’ebe ihe odide ahụ na-adịghị achọ ịkọwapụta ya.
- source_word: δώματος
  choice: elu ụlọ
  rationale: δώμα bụ elu ma ọ bụ ụlọ elu nke ụlọ, nke na-adịkarị larịị ma bụrụ ebe a pụrụ ịnọ na ya n’oge ahụ. ‘Elu ụlọ’ bụ ụzọ Igbo doro anya ma dị nkenke isi kwuo ya; nkọwa ala peeji na-enye ihe gbasara omenala owuwu ụlọ ahụ.
- source_word: μὴ καταβάτω
  choice: ka ... ghara ịgbadata
  rationale: Nke a na-egosipụta iwu mgbochi nke onye nke atọ n’ụzọ Igbo dị mma ma na-edobe ịdị ngwa nke ntụziaka ahụ. ‘Ịgbadata’ na-egosipụta isi n’elu ụlọ rịdata.
- source_word: ἆραι
  choice: iwere
  rationale: 'Infinitive a na-egosi ebumnuche nke ịgbadata: ịga were ma ọ bụ wepụ ihe. ‘Iwere’ bụ okwu nkịtị, doro anya n’ọnọdụ a.'
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: ihe ndị dị n’ụlọ ya
  rationale: τὰ bụ okwu e hapụrụ aha ya nke na-ezo aka n’ihe ma ọ bụ ngwongwo ndị dị n’ụlọ ahụ. Nsụgharị a na-eme ka ihe e kwuru doo anya n’Igbo n’enweghị ịkọwa ha kpọmkwem dị ka ngwongwo.
- source_word: οἰκίας
  choice: ụlọ
  rationale: N’ebe a, οἰκία na-ezo aka n’ụlọ a na-ahụ anya, ebe onye ahụ ga-esi n’elu ya gbadata; ‘ụlọ’ na-edobe echiche ahụ.
- source_word: αὐτοῦ
  choice: ya
  rationale: ‘Ya’ bụ nnọchiaha onye nke atọ otu n’Igbo. Ọ na-edobe otu onye ahụ nke Grik na-ekwu maka ya, ọ bụ ezie na Igbo anaghị egosi okike nwoke ma ọ bụ nwanyị na nnọchiaha a.
theological_decisions:
- issue: Ntụaka nwoke nke na-anọchi anya mmadụ n’ozuzu
  choice: Jiri ‘onye’ na ‘ya,’ bụ́ ụdị otu onye na-anọchi anya onye ọ bụla n’Igbo
  alternative: Jiri ‘nwoke’ mee ka okike nwoke pụta ìhè
  rationale: Ọ bụ ezie na Grik ji ụdị okwu nwoke, okwu ahụ na-anọchi anya onye ọ bụla nọ n’elu ụlọ, ọ bụghị naanị nwoke. Igbo anaghị egosi okike na ‘onye’ ma ọ bụ ‘ya’; itinye ‘nwoke’ ga-eme ka ihe odide ahụ dị warara karịa isi ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ‘Ka ... ghara’ na-enye iwu mgbochi n’ụzọ nkịtị, ebe ‘elu ụlọ’ na-edobe ọnọdụ ụlọ nke narị afọ mbụ.
