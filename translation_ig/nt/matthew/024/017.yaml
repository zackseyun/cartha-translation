    text: Okwu Grik a na-ezo aka n’elu ụlọ dị larịị, nke ndị mmadụ pụrụ ịnọ n’elu ya ma jiri ya mee ihe.
    reason: cultural_note
  revision_rationale: Replaced “iwere” with “wepụta” so that the translation explicitly communicates taking items out of/from the house, as indicated by ἐκ, while retaining the draft’s natural wording, register, and footnote anchor.
