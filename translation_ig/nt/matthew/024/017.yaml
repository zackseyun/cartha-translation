review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the subject on the roof and the prohibition against descending. However, “iwere ihe ndị dị n’ụlọ ya” means “to take the things that are in his house” and does not adequately express ἐκ (“out of/from”) in τὰ ἐκ τῆς οἰκίας αὐτοῦ. Using “wepụta” preserves the intended retrieval/removal from the house.
  naturalness: “Ka onye nọ n’elu ụlọ ... ghara ịgbadata iji wepụta ihe ndị dị n’ụlọ ya” is natural, clear Standard Igbo and retains the urgent prohibitive register.
  terminology: “Elu ụlọ” appropriately renders δῶμα, and the cultural footnote correctly explains the first-century flat, usable roof. “Ụlọ” is appropriate for οἰκία. Igbo’s gender-neutral “onye/ya” is idiomatic and does not introduce a meaning contrary to the representative singular in Greek.
  issues:
  - severity: medium
    issue: The phrase “iwere ihe ndị dị n’ụlọ ya” does not represent the directional/source force of ἐκ τῆς οἰκίας αὐτοῦ.
    rationale: It can mean simply taking items located in the house, whereas the Greek specifies taking items out of/from the house. “Iji wepụta ...” supplies this omitted sense without adding interpretive detail.
  revised_text: Ka onye nọ n’elu ụlọ[a] ghara ịgbadata iji wepụta ihe ndị dị n’ụlọ ya.
  revised_footnotes:
