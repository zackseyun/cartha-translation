- from: Ka onye nọ n’elu ụlọ[a] ghara ịgbadata iwere ihe ndị dị n’ụlọ ya.
  to: Ka onye nọ n’elu ụlọ[a] ghara ịgbadata iji wepụta ihe ndị dị n’ụlọ ya.
  rationale: Replaced “iwere” with “wepụta” so that the translation explicitly communicates taking items out of/from the house, as indicated by ἐκ, while retaining the draft’s natural wording, register, and footnote anchor.
