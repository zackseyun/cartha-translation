reference: Matthew 24:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: ig
  text: Ma ahụhụ ga-adịrị ndị dị ime na ndị na-enye ụmụ ọhụrụ ara n’ụbọchị ndị ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụ nwanyị dị ime na ụmụ nwanyị na-enye ụmụ ọhụrụ ara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: ahụhụ ga-adịrị
  rationale: Nke a na-egosipụta mkpu amụma banyere oke nhụjuanya na-abịanụ; ọ siri ike ma doo anya karịa naanị mkpu mwute.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ngafe dị nro site n’ịdọ aka ná ntị bu ụzọ, n’enweghị ime ka ọdịiche ahụ sie ike gabiga ókè.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: ndị dị ime
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu a n’ụzọ ebumpụta ụwa ma zie ezi, kama ịsụgharị akpaala okwu Grik ahụ mkpụrụokwu n’ụzọ mkpụrụokwu.
- source_word: ταῖς θηλαζούσαις
  choice: ndị na-enye ụmụ ọhụrụ ara
  rationale: Ọ na-egosipụta omume inye nwa ara n’ụzọ doro anya; 'ụmụ ọhụrụ' na-eme ka ihe a na-enye ara, nke a hapụrụ n’amaghị aha na Grik, pụta ìhè n’Igbo.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: n’ụbọchị ndị ahụ
  rationale: Ọ bụ nkebiokwu oge dị mfe, kwụ ọtọ, ma bụrụkwa Igbo a na-asụ n’ụzọ ebumpụta ụwa.
theological_decisions:
- issue: Ndị ụdị nwanyị a na-ezo aka na ha n’ụdị participle na dative Grik
  choice: ndị dị ime na ndị na-enye ụmụ ọhụrụ ara
  alternative: ụmụ nwanyị dị ime na ụmụ nwanyị na-enye ụmụ ọhụrụ ara
  rationale: Ụdị Grik ahụ bụ nke nwanyị ma na-ezo aka n’ụmụ nwanyị n’enweghị mgbagha, ma Igbo nwere ike igosipụta ọnọdụ ndị ahụ n’ụzọ ziri ezi n’etinyeghị 'ụmụ nwanyị,' nke na-adịghị dịka aha kpọmkwem n’ahịrịokwu ahụ. Ihe ọ pụtara banyere mmekọahụ ka doro anya site n’ịdị ime na inye nwa ara.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị nsọ ma dị mfe nghọta. Nsụgharị ahụ na-echekwa ike nke οὐαί dị ka ọkwa banyere nhụjuanya, ma ghara itinye nkọwa ụka ma ọ bụ ozizi pụrụ iche.
