id: MAT.24.32
reference: Matthew 24:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: ig
  text: 'Ma, mụtanụ ilu[a] site n’osisi fig: mgbe alaka ya dịla nro, akwụkwọ ya epupụta[b], unu maara na ọkọchị[c] dị nso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “nkuzi” ma ọ bụ “ihe atụ” n’ọnọdụ “ilu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “akwụkwọ ya epulite.”
    reason: lexical_alternative
  - marker: c
    text: Okwu Grik θέρος pụrụ ịpụta “ọkọchị,” n’ebe ụfọdụ kwa, oge owuwe ihe ubi; n’ebe a, oge ọkọchị kacha daba n’ihe atụ nke osisi fig.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: Ma ... site n’osisi fig
  rationale: “Site n’osisi fig” na-egosi isi iyi a na-amụta ihe n’aka ya dịka ἀπό na genitive si mee; “Ma” na-eburu obere njikọ δέ n’enweghị itinye “ugbu a,” nke na-adịghị na okwu Grik.
- source_word: μάθετε
  choice: mụtanụ
  rationale: Nke a bụ iwu e nyere ọtụtụ mmadụ; “mụtanụ” na-echekwa kpọmkwem omume ịmụ ihe kama ịgbanwe ya ka ọ bụrụ naanị ịghọta.
- source_word: τὴν παραβολήν
  choice: ilu
  rationale: “Ilu” bụ okwu Igbo dị nkenke ma kwanyere ugwu maka okwu atụ e ji akụzi ihe; ndetu ala peeji na-egosi nhọrọ ndị na-eme ka echiche nke nkuzi ma ọ bụ ihe atụ pụta ìhè.
- source_word: ὅταν ἤδη
  choice: ozugbo ... malitere
  rationale: “Ozugbo” na “malitere” jikọtara ọnụ na-egosi ọnọdụ oge na mmalite nke ihe a na-ahụ anya, nke ὅταν na ἤδη na-ebute.
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: alaka ya malitere ịdị nro
  rationale: 'Nke a na-egosi mgbanwe ọnọdụ nke alaka ọhụrụ: ọ na-amalite ịdị nro, dịka γένηται ἁπαλός si kwuo.'
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: ma pupụta akwụkwọ
  rationale: “Pupụta akwụkwọ” bụ ụzọ Igbo si akọwa akwụkwọ osisi na-epulite ma pụta; ọ na-echekwa ihe oyiyi uto osisi.
- source_word: γινώσκετε
  choice: unu na-amara
  rationale: Ụdị ugbu a nke ngwaa ahụ bụ nkwupụta gbasara ihe ndị na-ege ntị na-amara mgbe ha hụrụ akara ahụ, ọ bụghị iwu ọzọ.
- source_word: ἐγγὺς τὸ θέρος
  choice: ọkọchị dị nso
  rationale: N’ihe atụ banyere osisi fig na oge ya, θέρος na-ezo aka n’oge ọkọchị; “dị nso” na-egosi ἐγγύς n’ụzọ Igbo nkịtị.
theological_decisions:
- issue: Ihe osisi fig na-anọchi anya ya
  choice: A sụgharịrị ya dịka ihe atụ sitere n’oge uto osisi, n’akọwaghị n’ime amaokwu ahụ na osisi fig bụ akara mba Izrel.
  alternative: Ịkọwa osisi fig kpọmkwem dịka mba Izrel, ma ọ bụ ikwu hoo haa na ọ bụ naanị osisi nkịtị na-enweghị nghọta ọzọ.
  rationale: Amaokwu Grik ahụ na-elekwasị anya n’ịmata na ihe dị nso site n’ihe ịrịba ama a na-ahụ anya. Nsụgharị ahụ na-ahapụ arụmụka gbasara ihe oyiyi ahụ n’emeghe, kama idozi ya site n’itinye nkọwa na-adịghị kpọmkwem n’amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị nsọ, mee ihe. E ji akara ụda olu naanị ebe ọ bara uru, ma jiri apostrophe Igbo ziri ezi. “Osisi fig” ka e debere dịka aha osisi a maara n’Akwụkwọ Nsọ; ahịrịokwu ahụ na-asọ n’ụzọ okwu Igbo nkịtị ma na-echekwa usoro ihe atụ na nkwupụta nke ihe a maara.
