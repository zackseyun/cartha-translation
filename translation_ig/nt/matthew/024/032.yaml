revisions:
- from: 'Ma mụtanụ ilu[a] site n’osisi fig: ozugbo alaka ya malitere ịdị nro ma pupụta akwụkwọ[b], unu na-amara na ọkọchị[c] dị nso.'
  to: 'Ma, mụtanụ ilu[a] site n’osisi fig: mgbe alaka ya dịla nro, akwụkwọ ya epupụta[b], unu maara na ọkọchị[c] dị nso.'
  rationale: The revision preserves the Greek sequence and its open-ended seasonal illustration while improving Standard Igbo idiom. It renders the already-observable tenderness of the branch without adding an explicit ‘beginning’ event, makes leaf emergence clear, and uses a natural general-present expression for recognition. No symbolic interpretation of the fig tree is introduced.
