    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek sequence and its open-ended seasonal illustration while improving Standard Igbo idiom. It renders the already-observable tenderness of the branch without adding an explicit ‘beginning’ event, makes leaf emergence clear, and uses a natural general-present expression for recognition. No symbolic interpretation of the fig tree is introduced.
