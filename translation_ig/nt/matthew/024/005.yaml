  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: ig
  text: N’ihi na ọtụtụ mmadụ ga-abịa n’aha m, na-asị, “Abụ m Mesaịa ahụ,” ha ga-eduhiekwa ọtụtụ mmadụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: ọtụtụ mmadụ
  rationale: Ọ na-egosi ọnụ ọgụgụ buru ibu; ịtinye “mmadụ” mere ka Igbo doo anya ma dịrị mfe nghọta.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ịdọ aka ná ntị bu ya ụzọ ma na-egosi na nke a bụ ihe kpatara ya.
- source_word: ἐλεύσονται
  choice: ga-abịa
  rationale: Nke a bụ ntụgharị nkịtị na nke sitere n’okike maka ngwaa ọdịnihu ἔρχομαι.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: n’aha m
  rationale: Akpaokwu Igbo a na-echekwa echiche nke iji aha, ikike, ma ọ bụ njirimara Jizọs bịa, na-enweghị ịkọwapụta otu nghọta naanị.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-ewebata okwu ndị ahụ na-ekwu n’ụzọ kwụ ọtọ, na-enweghị ịgbakwunye nkọwa ọzọ.
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: Abụ m Mesaịa ahụ
  rationale: “Mesaịa” na-egosi na χριστός bụ utu aha nke onye e tere mmanụ, ọ bụghị aha nkịtị; “ahụ” na-egosipụtakwa isiokwu akọwapụtara nke dị na Grik.
- source_word: πλανήσουσιν
  choice: ga-eduhie
  rationale: “Iduhie” na-eburu echiche nke ime ka mmadụ kwere ụgha ma si n’ụzọ ziri ezi pụọ.
- source_word: πολλοὺς
  choice: ọtụtụ mmadụ
  rationale: Ọ bụ ndị mmadụ ka ngwaa ahụ metụtara; “ọtụtụ mmadụ” doro anya ma bụrụ Igbo sitere n’okike.
theological_decisions:
- issue: Otú e si atụgharị χριστός n’okwu onye na-azọrọ ịbụ onye nzọpụta ahụ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a, χριστός bụ utu aha nke onye a tụrụ anya ya, ya mere “Mesaịa” na-eme ka azọrọ ndị ụgha ahụ doo anya. E debere “Kraịst” n’ala peeji dịka ntụgharị ọzọ a na-ejikarị eme ihe.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa njikọ nkọwa nke γὰρ na ihe oyiyi nke iduhie mmadụ.
