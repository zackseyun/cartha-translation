    issue: Ambiguous antecedent in "mgbe ọ bịara"
    rationale: The pronoun "ọ" may grammatically be understood to refer to either the servant or his master. The Greek participle ἐλθὼν modifies "his lord," so the Igbo should identify the master explicitly.
  revised_text: Ngọzi na-adịrị ohu ahụ onye onyenwe ya ga-ahụ ka ọ na-eme otu a mgbe onyenwe ya bịara.
