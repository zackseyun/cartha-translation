review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders μακάριος, δοῦλος, κύριος, and the continuing action in οὕτως ποιοῦντα. However, the final temporal clause, "mgbe ọ bịara," has an unclear Igbo antecedent: it can be read as referring to the servant rather than to his master. In Greek, ἐλθὼν explicitly refers to "his lord."'
  naturalness: The sentence is generally clear and uses an appropriate dignified modern Standard Igbo register. Repeating "onyenwe ya" in the temporal clause removes an avoidable ambiguity and makes the sentence flow more securely.
  terminology: '"Ohu" accurately retains the social status expressed by δοῦλος, without weakening it to merely an employee. "Onyenwe ya" is suitable here for κύριος in the servant-and-master illustration. "Ngọzi na-adịrị" is a natural expression for μακάριος.'
  issues:
