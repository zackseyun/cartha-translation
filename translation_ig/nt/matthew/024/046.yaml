  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: ig
  text: Ngọzi na-adịrị ohu ahụ onye onyenwe ya ga-ahụ ka ọ na-eme otu a mgbe onyenwe ya bịara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Ngọzi na-adịrị
  rationale: Na-egosipụta ọnọdụ onye Chineke kwadoro ma gọzie, n'okwu Igbo doro anya ma dị ugwu.
- source_word: δοῦλος
  choice: ohu
  rationale: Nke a na-anọchi okwu Grik nke na-ezo aka n'onye nọ n'okpuru ikike onyenwe ya; ọ siri ike karịa naanị 'onye ọrụ'.
- source_word: κύριος
  choice: onyenwe
  rationale: Ọ dabara na mmekọrịta dị n'etiti ohu na onye nwere ikike n'ebe ọ nọ, ma na-edobekwa ohere okwu ahụ nwere ịpụta 'Onyenwe' n'ọnọdụ ọzọ.
- source_word: οὕτως ποιοῦντα
  choice: ka ọ na-eme otu a
  rationale: Na-echekwa ntụaka ahụ laghachiri n'omume a kọwara n'amaokwu ndị bu ụzọ.
- source_word: ἐλθών ... εὑρήσει
  choice: ga-ahụ ... mgbe ọ bịara
  rationale: Na-egosipụta nke ọma na ọ bụ mgbe onyenwe ahụ bịara ka ọ ga-ahụ ohu ahụ ka ọ nọ n'omume ahụ.
theological_decisions:
- issue: Ihe κύριος pụtara n'ilu a
  choice: onyenwe ya
  alternative: nna ya ukwu
  rationale: '''Onyenwe ya'' na-egosi onye nwere ikike n''ebe ohu ahụ nọ, ma ọ naghị emechi ụda sara mbara nke κύριος n''okwu Jizọs.'
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. Ahịrịokwu ahụ na-edobe ihe atụ onyenwe na ohu, na-enweghị itinye nkọwa ụka na-adịghị n'amaokwu ahụ.
