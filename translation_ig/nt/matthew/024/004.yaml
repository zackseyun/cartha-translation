  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: ig
  text: Jizọs zara ha sị, “Kpacharanụ anya ka onye ọ bụla ghara iduhie unu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ghọgbuo unu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: Jizọs zara ha sị
  rationale: Nkebiokwu Grik a bụ ụzọ akụkọ si ekwu na Jizọs zara ha ma malite ikwu okwu. ‘Zara ha sị’ bụ Igbo ebumpụta ụwa nke na-echekwa ma nzaghachi ahụ ma okwu so ya.
- source_word: Βλέπετε
  choice: Kpacharanụ anya
  rationale: N’ebe a, iwu a pụtara ịnọ na nche ma ọ bụ ịkpachara anya, ọ bụghị naanị iji anya hụ ihe. Ọdịdị ọtụtụ mmadụ dị n’‘-nụ’ kwekọrọ na ndị a na-agwa okwu.
- source_word: μή τις
  choice: ka onye ọ bụla ghara
  rationale: 'Nke a na-egosi ihe a ga-egbochi: ha aghaghị ịkpachara anya ka mmadụ ghara ime ha ihe a kpọrọ aha.'
- source_word: πλανήσῃ
  choice: iduhie unu
  rationale: ‘Iduhie’ nwere ike ịgụnye aghụghọ na ime ka mmadụ si n’ụzọ ziri ezi pụọ; ya mere, ọ naghị eme ka ịdọ aka ná ntị ahụ bụrụ naanị nkwenkwe ụgha n’uche.
theological_decisions:
- issue: Ụdị ịdọ aka ná ntị dị na πλανήσῃ
  choice: iduhie unu
  alternative: ịghọgbu unu
  rationale: ‘Iduhie’ na-echekwa echiche sara mbara nke ime ka ndị na-eso ụzọ mehie ụzọ ma ọ bụ si n’ụzọ ziri ezi pụọ. ‘Ịghọgbu’ na-ekwusi aghụghọ ike karị, ma ọ nwere ike ime ka ihe okwu ahụ pụtara dị warara.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. E ji ‘unu’ na ụdị iwu ‘Kpacharanụ’ gosi na Jizọs na-agwa ọtụtụ mmadụ okwu.
