  source_fidelity: The translation accurately renders the response formula καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς as “Jizọs zara ha sị.” “Kpacharanụ anya” appropriately conveys the imperative Βλέπετε in its warning sense, and “ka onye ọ bụla ghara iduhie unu” faithfully expresses the preventive μή-clause and πλανήσῃ without narrowing its sense to mere intellectual error.
  naturalness: The wording is natural, modern Standard Igbo and retains an appropriately dignified biblical register. The plural imperative “Kpacharanụ” and pronoun “unu” correctly address the group.
  terminology: “Iduhie” is a suitable broad rendering of πλανήσῃ, encompassing deception and being led off course. The alternative “ghọgbuo unu” is a valid lexical alternative, though somewhat more focused on trickery. “Jizọs” is the standard form of the name.
