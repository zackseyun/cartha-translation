  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/050.yaml
  text: the master of that servant will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: ig
  text: Nna ukwu[a] nke ohu ahụ[b] ga-abịa n’ụbọchị nke ohu ahụ na-atụghị anya ya, nakwa n’awa ọ na-amaghị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye nwe ohu ahụ.” Okwu Grik bụ kyrios, nke pụrụ ịpụta “onyenwe” ma ọ bụ “nna ukwu”; n’ebe a, ọ na-ekwu banyere onyeisi ohu ahụ n’ilu a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “onye na-eje ozi” ma ọ bụ “ohu e kegidere n’ọrụ.” Okwu Grik bụ doulos, nke na-ekwu banyere onye nọ n’okpuru onye ọzọ n’ọrụ e kegidere ya; “ohu” na-egosi ọnọdụ ahụ nke ọma n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: ga-abịa
  rationale: Future ἥκω expresses the master's coming or arrival; “ga-abịa” is the natural Standard Igbo equivalent.
- source_word: κύριος
  choice: nna ukwu
  rationale: In this household parable the word denotes the human master or superior, not directly a divine title. “Nna ukwu” naturally conveys that relationship.
- source_word: δούλου
  choice: ohu
  rationale: The context presents a bonded master-slave relationship, so “ohu” preserves the social force of δοῦλος more clearly than the broader “onye na-eje ozi.”
- source_word: ἐκείνου
  choice: ahụ
  rationale: The postposed Igbo demonstrative points back naturally to the particular slave already under discussion.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: n’ụbọchị ohu ahụ na-atụghị anya ya
  rationale: This keeps the indefinite day and identifies the slave as the subject of the expectation clause, avoiding misleading Igbo pronoun reference.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: n’awa ọ na-amaghị
  rationale: This preserves the Greek day/hour parallel and the plain sense that the slave does not know the hour.
theological_decisions:
- issue: Sense of κύριος in the parabolic household setting
  choice: nna ukwu
  alternative: Onyenwe
  rationale: “Nna ukwu” presents the human master within the story. “Onyenwe” could too readily sound like a direct divine title, although the parable carries broader eschatological significance.
- issue: Rendering of δοῦλος
  choice: ohu
  alternative: onye na-eje ozi
  rationale: The explicit authority relationship between κύριος and δοῦλος makes bonded status salient; “ohu” preserves that force rather than softening it to a general servant.
translation_notes:
  register: Standard Igbo; natural, dignified, and accessible. The repeated “ohu ahụ” in the first temporal clause clarifies the Greek subject, while the following pronoun remains naturally linked to the same slave. The day/hour parallel is retained.
