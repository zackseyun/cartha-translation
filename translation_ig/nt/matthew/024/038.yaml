    text: A pụkwara ịsụgharị okwu Grik nke abụọ dịka, “a na-enye mmadụ n’alụmdi na nwunye.” Okwu Grik ahụ pụrụ ịpụta inye mmadụ n’alụmdi na nwunye ma ọ bụ ịbụ onye e nyere n’alụmdi na nwunye.
    reason: lexical_alternative
