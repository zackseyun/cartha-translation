id: MAT.24.38
reference: Matthew 24:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: ig
  text: N’ihi na, dịka ọ dị n’ụbọchị ndị tupu iju mmiri ahụ, ndị mmadụ na-eri ma na-aṅụ, na-alụ di na nwunye, na-enyekwa mmadụ n’alụmdi na nwunye[a], ruo ụbọchị Noa banyere n’ụgbọ mmiri ahụ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị okwu Grik nke abụọ dịka, “a na-enye mmadụ n’alụmdi na nwunye.” Okwu Grik ahụ pụrụ ịpụta inye mmadụ n’alụmdi na nwunye ma ọ bụ ịbụ onye e nyere n’alụmdi na nwunye.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: N’ihi na, dị ka
  rationale: Nke a na-egosipụta ma ike nkọwa nke γάρ ma ntụnyere nke ὡς, n’ụzọ Igbo nke na-ejikọta amaokwu a na nke bu ya ụzọ.
- source_word: ἦσαν ... τρώγοντες καὶ πίνοντες
  choice: ndị mmadụ nọ na-eme ... na-eri ihe, na-aṅụ ihe ọṅụṅụ
  rationale: Ụdị imperfect ya na participles na-egosi omume ndị na-aga n’ihu. E tinyere ‘ndị mmadụ’ ka ahịrịokwu ahụ bụrụ Igbo doro anya, n’agbanyeghị na isiokwu ahụ dị n’ime ngwaa Grik.
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: n’ụbọchị ndị ahụ tupu iju mmiri ahụ
  rationale: Nke a na-edobe oge a kpọrọ aha, ebe ‘iju mmiri’ bụ okwu Igbo doro anya maka κατακλυσμός n’akụkọ Noa.
- source_word: τρώγοντες καὶ πίνοντες
  choice: na-eri ihe, na-aṅụ ihe ọṅụṅụ
  rationale: A sụgharịrị ya n’enweghị okwu na-egosi ịṅụbiga mmanya ókè ma ọ bụ ajọ omume, n’ihi na Grik kpọrọ naanị ihe ndị mmadụ na-eme kwa ụbọchị.
- source_word: γαμοῦντες καὶ γαμίζοντες
  choice: na-alụ di na nwunye, na-enyekwa ndị ọzọ n’alụmdi na nwunye
  rationale: Nke a na-edobe ọdịiche dị n’etiti ịlụ di ma ọ bụ nwunye na inye onye ọzọ n’alụmdi na nwunye, ma na-ahapụkwa mgbagwoju anya nke γαμίζοντες n’ihe odide ala ala peeji.
- source_word: ἄχρι ἧς ἡμέρας
  choice: ruo n’ụbọchị
  rationale: Ọ na-egosi njedebe nke omume ndị ahụ na-aga n’ihu n’ụzọ dị mfe ma bụrụ Igbo nkịtị.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Noa banyere n’ụgbọ ahụ
  rationale: ‘Banyere’ na-egosipụta omume mkpebi ahụ nke ọma. N’akụkọ Noa, ‘ụgbọ ahụ’ bụ okwu Igbo dị mfe ma na-ezo aka n’ụgbọ pụrụ iche a marala site n’okwu gbara ya gburugburu.
theological_decisions:
- issue: Ma a ga-egosi iri ihe, ịṅụ ihe ọṅụṅụ, na ịlụ di na nwunye dị ka mmehie ma ọ bụ dị ka ndụ nkịtị na-aga n’ihu tupu ikpe abịa
  choice: A sụgharịrị omume ndị ahụ n’ụzọ na-anọpụ iche dịka ihe ndị mmadụ na-eme kwa ụbọchị.
  alternative: Iji okwu ndị ga-egosi ịṅụbiga ihe ókè, mmehie, ma ọ bụ enweghị nchebara echiche.
  rationale: Participles Grik anaghị etinye nkọwa omume ọma ma ọ bụ ajọ omume. N’ọnọdụ okwu a, isi ihe bụ na ndụ nkịtị gara n’ihu ruo mgbe ihe mberede ahụ bịara; ya mere, e tinyeghị ikpe omume na-adịghị n’ihe odide ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-aga n’ihu dịka nke Grik, ebe ọ bụ na amaokwu a anaghị akwụsị echiche ahụ kpamkpam. E ji ‘alụ di na nwunye’ mee ka okwu ahụ metụta nwoke na nwanyị n’enweghị ịmanye otu akụkụ nke mgbagwoju anya Grik.
