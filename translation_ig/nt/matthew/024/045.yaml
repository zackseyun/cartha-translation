id: MAT.24.45
reference: Matthew 24:45
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise servant[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: ig
  text: “Ònye kwa bụ ohu ahụ kwesịrị ntụkwasị obi na onye nwere uche, onye nna ya ukwu[a] họpụtara ka ọ lekọta ndị ohu nọ n’ụlọ ya, ka o nye ha nri n’oge kwesịrị ekwesị?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onyenwe anyị.” N’onyonyo ụlọ a, okwu Grik a pụtara onye nwe ohu ma ọ bụ nna ya ukwu; a pụkwara ịsụgharị ya “Onyenwe anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄρα
  choice: Ònyezi
  rationale: Ngwakọta ‘Ònye’ na ‘-zi’ na-ebute ajụjụ nkwubi okwu n’Igbo n’ụzọ dị nkenke ma dịkwa eke, na-ejikọta ya na ihe e kwuru tupu ya.
- source_word: πιστὸς
  choice: kwesịrị ntụkwasị obi
  rationale: Nke a na-egosi onye a pụrụ ịdabere na ya n’imezu ọrụ e nyere ya, ma na-edokwa echiche omume ọma dị na πιστός.
- source_word: δοῦλος
  choice: ohu
  rationale: N’onyonyo ụlọ a, δοῦλος bụ onye nọ n’okpuru ikike nna ya ukwu; ‘ohu’ na-edobe ike mmekọrịta ahụ karịa okwu dị nro dịka ‘onye na-eje ozi.’
- source_word: φρόνιμος
  choice: nke nwekwara uche
  rationale: Ọ na-egosi amamihe bara uru na ezi mkpebi n’ọrụ; okwu a bụ Igbo eke nke ndị nkịtị na-aghọta.
- source_word: κατέστησεν
  choice: họpụtara ilekọta
  rationale: Nke a na-egosi ma nhọpụta ahụ ma inyefe onye ahụ ọrụ na ikike ilekọta ndị ụlọ.
- source_word: κύριος
  choice: nna ya ukwu
  rationale: N’ọnọdụ akụkọ gbasara ụlọ na ndị ohu, ‘nna ya ukwu’ na-egosi onye nwe ohu ma ọ bụ onye nwere ikike n’ebe ọ nọ, n’etinyeghị aha nsọ ‘Onyenwe anyị’ ozugbo.
- source_word: οἰκετείας
  choice: ndị ezinụlọ ya
  rationale: οἰκετεία na-ezo aka n’òtù ndị nọ n’ụlọ ahụ; ‘ndị ezinụlọ ya’ na-eme ka nnọchiaha ọtụtụ αὐτοῖς doo anya, n’agbanyeghị na ọ pụrụ ịgụnye ndị ọrụ ụlọ.
- source_word: τοῦ δοῦναι
  choice: ka o nye
  rationale: ‘Ka o nye’ na-egosipụta ebumnuche nhọpụta ahụ n’Igbo dị mfe ma dị eke.
- source_word: τροφὴν
  choice: nri ha
  rationale: Nke a na-ebufe echiche nri ma ọ bụ ihe oriri a na-enye ndị ụlọ, n’etinyeghị nkọwa karịrị isi mmalite.
- source_word: ἐν καιρῷ
  choice: n’oge kwesịrị ekwesị
  rationale: Nke a na-egosi oge kwesịrị ya, ọ bụghị naanị otu oge dị n’elekere.
theological_decisions:
- issue: Nsụgharị κύριος n’onyonyo ezinụlọ
  choice: nna ya ukwu
  alternative: Onyenwe anyị
  rationale: Ihe e kwuru ozugbo bụ mmekọrịta dị n’etiti ohu na onye nwe ya n’ụlọ. ‘Nna ya ukwu’ na-edobe onyonyo ahụ, ebe ndetu ala peeji na-echekwa nsụgharị ‘Onyenwe anyị,’ nke nwere ike ime ka njikọ ahụ na Kraịst pụta ìhè karịa.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ụdị ajụjụ nke Grik. ‘Ohu’ na-echekwa ọnọdụ onye nọ kpamkpam n’okpuru ikike nna ya ukwu; ‘ndị ezinụlọ’ bụ okwu eke, ma n’ebe a ọ na-agụnyekwa ndị niile nọ n’okpuru nlekọta onye ahụ.
