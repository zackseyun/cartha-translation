revisions:
- from: “Ònyezi bụ ohu ahụ kwesịrị ntụkwasị obi, nke nwekwara uche, onye nna ya ukwu[a] họpụtara ilekọta ndị ezinụlọ ya, ka o nye ha nri ha n’oge kwesịrị ekwesị?”
  to: “Ònye kwa bụ ohu ahụ kwesịrị ntụkwasị obi na onye nwere uche, onye nna ya ukwu[a] họpụtara ka ọ lekọta ndị ohu nọ n’ụlọ ya, ka o nye ha nri n’oge kwesịrị ekwesị?”
  rationale: The revision improves Standard Igbo idiom and clarifies the household-staff sense of οἰκετεία while preserving the source’s parabolic register, rhetorical force, and ambiguity concerning κύριος.
