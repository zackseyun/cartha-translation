    text: Ma ọ bụ, “Onyenwe anyị.” N’onyonyo ụlọ a, okwu Grik a pụtara onye nwe ohu ma ọ bụ nna ya ukwu; a pụkwara ịsụgharị ya “Onyenwe anyị.”
    reason: lexical_alternative
  revision_rationale: The revision improves Standard Igbo idiom and clarifies the household-staff sense of οἰκετεία while preserving the source’s parabolic register, rhetorical force, and ambiguity concerning κύριος.
