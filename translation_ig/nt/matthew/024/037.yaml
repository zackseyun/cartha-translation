source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ αἱ ἡμέραι τοῦ Νῶε, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: ig
  text: N’ihi na, dị nnọọ ka ụbọchị Noa dị, otu ahụ ka ọbịbịa Nwa nke Mmadụ ga-adị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ
  choice: dị nnọọ ka
  rationale: Ọ na-ebute ntụnyere siri ike ma na-arụkọ ọrụ nke ọma na “otu ahụ ka” maka usoro ὥσπερ ... οὕτως.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-edobe njikọ nkọwa nke amaokwu a na okwu ndị bu ya ụzọ.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: ụbọchị Noa dị
  rationale: Asụsụ Grik hapụrụ ngwaa n’ahịrị nke mbụ; itinye “dị” bụ mmeju kacha nta nke na-eme ka Igbo doo anya ma debe ntụnyere ahụ.
- source_word: Νῶε
  choice: Noa
  rationale: Nke a bụ ụdị aha ahụ a na-ejikarị n’Igbo.
- source_word: οὕτως
  choice: otu ahụ ka
  rationale: Ọ na-emeju “dị nnọọ ka” ma na-egosipụta ntụnyere ahụ n’ụzọ doro anya na nke okike n’Igbo.
- source_word: ἔσται
  choice: ga-adị
  rationale: Ọ bụ ọdịnihu nke εἰμί; “ga-adị” na-edobe ọdịdị ngwaa ahụ n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: παρουσία
  choice: ọbịbịa
  rationale: N’ebe a ọ na-ezo aka n’ọbịbịa Nwa nke Mmadụ n’ọdịnihu. “Ọbịbịa” bụ okwu Igbo doro anya, ebe “ọnụnọ” ka bụ ụzọ ọzọ okwu Grik ahụ pụrụ isi pụta.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Ọ na-edobe aha pụrụ iche Jizọs ji akpọ onwe ya na njikọ ya na ihe odide Daniel, n’enweghị ịkọwa ya karịa ihe isi mmalite kwuru.
theological_decisions:
- issue: Nsụgharị παρουσία n’okwu gbasara ihe ga-eme n’ọdịnihu
  choice: ọbịbịa
  alternative: ọnụnọ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ọbịbịa Nwa nke Mmadụ n’ọdịnihu. “Ọbịbịa” na-egosipụta omume nke ịbịa nke ọma, ma ihe odide ala peeji na-echekwa “ọnụnọ” dị ka ihe okwu Grik ahụ nwekwara ike ịpụta.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro ntụnyere “dị nnọọ ka ... otu ahụ ka,” tinyekwa naanị ngwaa dị mkpa iji mee ka ahịrịokwu ahụ zuo oke n’Igbo.
