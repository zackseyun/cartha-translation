id: MAT.24.31
reference: Matthew 24:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: ig
  text: Ọ ga-ezipụ ndị mmụọ ozi ya na nnukwu ụda opi[a], ha ga-achịkọta ndị ọ họọrọ[b] site n’ifufe anọ[c], site n’otu nsọtụ eluigwe ruo na nsọtụ ya nke ọzọ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ya na nnukwu opi,” ma ọ bụ “mgbe nnukwu opi dara.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “ndị a họpụtara ahọpụta.”'
    reason: lexical_alternative
  - marker: c
    text: Okwu ahụ bụ “ifufe anọ” bụ akpaalaokwu na-egosi ebe niile, ruo n’ebe ndị kasị anya n’akụkụ ọ bụla.
    reason: cultural_note
  - marker: d
    text: 'N’asụsụ Grik: “site na nsọtụ eluigwe ruo na nsọtụ ha”; ọ bụ akpaalaokwu pụtara site n’otu nsọtụ ruo na nke ọzọ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: Ọ ga-ezipụ
  rationale: Okwu a dị n’ọdịnihu ma na-egosi iziga ndị e nyere ọrụ; “ga-ezipụ” bụ Igbo doro anya ma kwesị ekwesị.
- source_word: ἀγγέλους
  choice: ndị mmụọ ozi
  rationale: N’ọnọdụ a gbasara ọgwụgwụ oge, okwu ahụ na-ezo aka n’ụmụ mmụọ nke Chineke, ọ bụghị naanị ndị ozi mmadụ.
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: na nnukwu ụda opi
  rationale: Nke a na-eme ka a ghọta ihe a na-anụ mgbe a fụrụ opi, ma na-edebe ma ịdị ukwuu ma ike ụda nke μεγάλη nwere ike ịpụta.
- source_word: ἐπισυνάξουσιν
  choice: ha ga-achịkọta
  rationale: Ngwaa ahụ pụtara ịkpọkọta ndị gbasasịrị n’otu ebe; “chịkọta” na-egosipụta nke a n’Igbo nkịtị.
- source_word: ἐκλεκτούς
  choice: ndị ọ họọrọ
  rationale: Nhọrọ a na-edebe isi echiche nke ịbụ ndị a họọrọ n’enweghị itinye nkọwa ozizi pụrụ iche nke amaokwu ahụ ekwughị.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: site n’ifufe anọ
  rationale: A hapụrụ ihe oyiyi Akwụkwọ Nsọ ahụ kama ịgbanwe ya ozugbo ka ọ bụrụ “akụkụ anọ,” ebe nkọwa ala na-akọwa akpaalaokwu ahụ.
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: site n’otu nsọtụ eluigwe ruo na nsọtụ ya nke ọzọ
  rationale: Nke a na-enye akpaalaokwu Grik ahụ n’Igbo dị mma ma na-egosi ogologo zuru ezu site n’otu nsọtụ ruo n’ọzọ.
theological_decisions:
- issue: Otú e si sụgharịa ἐκλεκτούς n’ọnọdụ gbasara ọgwụgwụ oge
  choice: ndị ọ họọrọ
  alternative: ndị a họpụtara ahọpụta
  rationale: “Ndị ọ họọrọ” na-egosi ihe okwu Grik pụtara n’ụzọ doro anya, ma ọ naghị ekpebi usoro ozizi gbasara nhọrọ nke amaokwu ahụ n’onwe ya na-akọwaghị.
- issue: Ókè ihe oyiyi nchịkọta ahụ gbasara
  choice: site n’ifufe anọ, site n’otu nsọtụ eluigwe ruo na nsọtụ ya nke ọzọ
  alternative: site n’akụkụ anọ niile nke ụwa
  rationale: A na-edebe ihe oyiyi sara mbara nke ederede ahụ kama ime ka ọ bụrụ naanị nkọwa ala ma ọ bụ ụzọ anọ.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe oyiyi “ifufe anọ” na “nsọtụ eluigwe,” ebe e tinyere nkọwa iji nyere onye na-agụ aka ịghọta akpaalaokwu ndị ahụ.
