  to: Ma, nọgidenụ na-ekpe ekpere ka unu ghara ịgbapụ n'oge oyi ma ọ bụ n'ụbọchị Sabat[a].
  rationale: The revision replaces an awkward nominal expression with an idiomatic verbal clause while retaining the prayer that the hearers’ flight not occur under either circumstance. It also uses the conventional Igbo biblical designation “Sabat” for the Jewish Sabbath. The footnote continues to represent the possible definite English-style construal without forcing it into the main text.
