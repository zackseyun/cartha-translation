  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: ig
  text: Ma, nọgidenụ na-ekpe ekpere ka unu ghara ịgbapụ n'oge oyi ma ọ bụ n'ụbọchị Sabat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n'ụbọchị Sabat ahụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: na-ekpe ekpere
  rationale: Okwu iwu dị n'ụdị present, onye nke abụọ plural; usoro a na-egosi ekpere a ga na-ekpe, ma na-ada nke ọma n'Igbo.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche n'ihe e kwuru tupu ya.
- source_word: ἵνα μὴ γένηται
  choice: ka ... ghara ime
  rationale: Ọ na-egosi ihe ekpere ahụ na-arịọ, ebe γίνομαι nwere echiche nke ihe ime ma ọ bụ ihe ahụ dapụta.
- source_word: ἡ φυγὴ ὑμῶν
  choice: ịgbapụ unu
  rationale: Ọ na-echekwa echiche nke ọsọ mgbapụ n'ihe egwu, n'ekwughị na mgbapụ ahụ ga-abụrịrị nke ọma.
- source_word: χειμῶνος
  choice: n'oge oyi
  rationale: Genitive a na-egosi oge; nke a bụ ụzọ Igbo doro anya si kwuo oge oyi.
- source_word: μηδὲ σαββάτῳ
  choice: ma ọ bụ n'ụbọchị izu ike
  rationale: Ọ na-agbakwunye ọnọdụ nke abụọ a na-achọ ka ọ ghara ime; σαββάτῳ na-ezo aka n'ụbọchị izu ike ndị Juu.
theological_decisions:
- issue: Ma a ga-akọwa σαββάτῳ dịka otu ụbọchị izu ike ma ọ bụ ụbọchị izu ike ahụ a maara
  choice: n'ụbọchị izu ike
  alternative: n'ụbọchị izu ike ahụ
  rationale: Grik enweghị article, Igbo kwa anaghị eji article dịka Grik ma ọ bụ Bekee. Ya mere isi ederede na-ahapụ definiteness ahụ n'ụzọ nkịtị, ebe ndetu na-echekwa nkọwa ọzọ.
translation_notes:
  register: Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. A họọrọ “ụbọchị izu ike” iji mee ka ihe Sabbath pụtara doo onye na-agụ ya anya, na-enweghị itinye nkọwa otu ụka.
