  rationale: Ọ bụ okwu e ji adọta uche ndị na-ege ntị; “Lee” bụ ụzọ dị mkpirikpi ma dịkwa ugwu n'Igbo.
- source_word: προείρηκα
  choice: agwala m unu ihe ndị a tupu ha emee
  rationale: Perfect tense na-egosi na Jizọs agwala ha ya tupu oge ahụ, ịdọ aka ná ntị ahụ ka dịkwa mkpa ugbu a. Ịgbakwunye “ihe ndị a” na “tupu ha emee” na-eme ka ihe prefix προ- pụtara doo anya n'Igbo n'enweghị ịgbanwe echiche ya.
- source_word: ὑμῖν
  choice: unu
  rationale: Ụdị nnọchiaha nke ọtụtụ mmadụ kwekọrọ na ndị Jizọs na-agwa okwu.
