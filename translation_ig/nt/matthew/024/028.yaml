id: MAT.24.28
reference: Matthew 24:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: ig
  text: Ebe ọ bụla ozu dị, n’ebe ahụ ka udele ga-ezukọta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ugo.” Okwu Grik ahụ nwere ike ịpụta ugo, ma “udele” ka dabara n’onyonyo nnụnụ na-ezukọta n’ebe ozu dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: Ebe ọ bụla ... dị
  rationale: Nkebiokwu a na-egosi ebe a na-akọwaghị kpọmkwem; “Ebe ọ bụla” na-ebute echiche ahụ n’Igbo nkịtị ma doo anya.
- source_word: πτῶμα
  choice: ozu
  rationale: “Ozu” bụ okwu Igbo ziri ezi ma dị mfe maka ahụ nwụrụ anwụ, n’enweghị ịkọwapụta ma ọ bụ nke mmadụ ma ọ bụ nke anụmanụ karịa ihe Grik kwuru.
- source_word: συναχθήσονται
  choice: ga-ezukọta
  rationale: Ọ bụ ezie na ụdị ngwaa Grik bụ passive, ihe ọ pụtara n’ebe a bụ na nnụnụ ndị ahụ ga-agbakọta n’otu ebe; “ga-ezukọta” bụ okwu Igbo sitere n’okike ma na-echekwa ihe ahụ pụtara.
- source_word: ἀετοί
  choice: udele
  rationale: N’ọnọdụ a, ebe nnụnụ na-ezukọta gburugburu ozu, “udele” kacha daba n’onyonyo ahụ. Ma okwu Grik ahụ nwekwara ike ịpụta ugo, ya mere e debere nke ahụ n’ala ala peeji.
theological_decisions:
- issue: Ihe ilu a na-anọchi anya ya
  choice: A sụgharịrị onyonyo ilu ahụ kpọmkwem n’enweghị ịkọwa ihe ozu ma ọ bụ nnụnụ ndị ahụ na-anọchi anya ya.
  alternative: Ịkọwa ya dị ka ikpe a na-apụghị izere ezere, ngosipụta ọbịbịa Nwa nke Mmadụ, mbibi Jerusalem, ma ọ bụ ọkọlọtọ ndị Rom.
  rationale: Amaokwu Grik ahụ anaghị ekwu kpọmkwem ihe ozu ma ọ bụ nnụnụ ndị ahụ na-anọchi anya ya; nsụgharị kwesịrị ịhapụ nghọta dị iche iche ahụ ka ha dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi “n’ebe ahụ ka” na-echekwa nkwusi ike dị na ἐκεῖ, ebe “ga-ezukọta” na-asụgharị passive Grik n’ụzọ sitere n’okike n’Igbo.
