  terminology: “Mba” appropriately renders ἔθνος in its political/collective sense, while “alaeze” preserves the political-domain sense of βασιλεία. The rendering does not introduce a divine-causation reading for the passive/middle verb. Footnote a supplies a defensible idiomatic alternative, and footnote b gives a permissible alternative for the distributive location phrase.
