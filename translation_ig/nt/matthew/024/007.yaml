id: MAT.24.7
reference: Matthew 24:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: ig
  text: N’ihi na mba ga-ebili imegide mba[a], alaeze ga-ebilikwa imegide alaeze; ụnwụ nri na ala ọma jijiji ga-adịkwa n’ebe dị iche iche.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ga-ebuso mba ọzọ iro.” Akpaalaokwu Grik a na-egosi na mmegide ga-amalite n’etiti mba dị iche iche.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’otu ebe ruo ebe ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: ga-ebili
  rationale: Ọdịdị ngwaa a n’okwu a na-egosi ibili imegide onye ọzọ, ya bụ mmalite esemokwu; ọ naghị ekwu hoo haa na ọ bụ onye ọzọ mere ka mba ahụ bilie.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru tupu ya dịka nkọwa ma ọ bụ ihe kpatara ya.
- source_word: ἔθνος ἐπὶ ἔθνος
  choice: mba ga-ebili imegide mba
  rationale: ἔθνος ebe a na-ezo aka n’ìgwè mmadụ ma ọ bụ mba, ebe ἐπί na-egosi mmegide. Nhọrọ a na-edobe oyiyi nke mba dị iche iche na-ebuso ibe ha iro.
- source_word: βασιλεία ἐπὶ βασιλείαν
  choice: alaeze ga-ebilikwa imegide alaeze
  rationale: βασιλεία ebe a bụ alaeze dịka ọchịchị ma ọ bụ ógbè ndọrọ ndọrọ ọchịchị, nke kwekọrọ na ‘mba’ dị n’ahịrị nke mbụ.
- source_word: ἔσονται
  choice: ga-adịkwa
  rationale: Nke a bụ ojiji εἰμί nke na-egosi na ihe ndị ahụ ga-apụta ma ọ bụ ga-eme.
- source_word: λιμοὶ
  choice: ụnwụ nri
  rationale: Okwu a pụtara oke ụkọ nri na-akpata agụụ n’ebe sara mbara; ‘ụnwụ nri’ bụ ụzọ doro anya ma bụrụkwa nke a na-aghọta nke ọma n’Igbo.
- source_word: σεισμοὶ
  choice: ala ọma jijiji
  rationale: N’okwu a, σεισμοί pụtara mkpatụ ala, ya bụ ala ọma jijiji.
- source_word: κατὰ τόπους
  choice: n’ebe dị iche iche
  rationale: Nkebiokwu a na-egosi na ihe ndị ahụ ga-eme n’ọtụtụ ebe, ọ bụghị naanị n’otu ebe.
theological_decisions:
- issue: Oke ihe ἔθνος pụtara n’okwu banyere esemokwu ndị ga-eme
  choice: mba
  alternative: ndị mmadụ
  rationale: Ọ dabara na ‘alaeze megide alaeze’ nke so ya, ma ọ naghị amanye okwu ahụ ka ọ bụrụ naanị ndị mba ọzọ ma ọ bụ naanị otu agbụrụ.
- issue: Ihe ọdịdị ngwaa ἐγερθήσεται na-egosi
  choice: ga-ebili imegide
  alternative: a ga-eme ka o bilie imegide
  rationale: Nke a na-egosi mmalite mmegide n’etinyeghị echiche na Chineke ma ọ bụ onye ọzọ bụ onye mere ka ọ bilie, ebe ihe odide ahụ ekwughị nke ahụ hoo haa.
translation_notes:
  register: Ejiri Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere njikọ nkọwa γάρ dịka “N’ihi na,” ma jiri usoro ahịrị abụọ yiri ibe ha mee ka myirịta dị n’etiti mba na alaeze pụta ìhè.
