id: MAT.24.27
reference: Matthew 24:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: ig
  text: N’ihi na, dịka àmụ̀mà si n’ọwụwa anyanwụ apụta ma a na-ahụ ya ruo n’ọdịda anyanwụ, otu a ka ọbịbịa[a] Nwa nke Mmadụ ga-adị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọnụnọ.” Okwu Grik παρουσία nwere ike ịpụta “ọnụnọ” ma ọ bụ “mbata”; ma n’ebe a, ihe gbara ya gburugburu na-ezo aka n’ọbịbịa Nwa nke Mmadụ n’ọdịnihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: N’ihi na, dị nnọọ ka
  rationale: Nke a na-egosipụta ma njikọ nkọwa γάρ ma ntụnyere siri ike nke ὥσπερ n’Igbo e ji eme ihe nke ọma.
- source_word: ἀστραπή
  choice: àmụ̀mà
  rationale: Okwu a pụtara àmụ̀mà n’onwe ya, nke dabara n’ihe atụ a.
- source_word: ἐξέρχεται
  choice: apụta
  rationale: N’ebe a ọ na-egosi na àmụ̀mà si otu ebe pụta; “apụta” bụ okwu Igbo doro anya ma kwekọọ n’echiche isi mmalite.
- source_word: ἀπὸ ἀνατολῶν
  choice: si n’ọwụwa anyanwụ
  rationale: N’ihi na a na-atụnyere ya na ọdịda anyanwụ, okwu a na-egosi akụkụ ọwụwa anyanwụ.
- source_word: φαίνεται
  choice: a hụkwa ya
  rationale: Nke a na-echekwa ụdị passive na echiche nke ihe a na-ahụ anya n’ihu ọha, n’etinyeghị echiche ọzọ dị ka “na-enwu.”
- source_word: ἕως δυσμῶν
  choice: ruo n’ọdịda anyanwụ
  rationale: “Ruo” na-egosi oke ebe a na-ahụ ya, site n’ọwụwa anyanwụ ruo n’ọdịda anyanwụ.
- source_word: οὕτως ἔσται
  choice: otu ahụ ka ... ga-adị
  rationale: Nke a na-echekwa usoro ntụnyere ahụ na ike ọdịnihu nke ngwaa ahụ.
- source_word: παρουσία
  choice: ọbịbịa
  rationale: N’okwu gbasara ihe ga-eme n’ọdịnihu a, “ọbịbịa” na-egosi ihe omume nke ịbịa nke ọma; e debere echiche ọzọ nke “ọnụnọ” n’okpuru peeji.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-echekwa aha ahụ dị ka aha pụrụ iche ma na-eme ka njikọ ya na ọdịnala Akwụkwọ Nsọ, karịsịa Daniel 7, pụta ìhè.
theological_decisions:
- issue: Otú e si sụgharị παρουσία n’okwu banyere ihe ga-eme n’ọdịnihu
  choice: ọbịbịa
  alternative: ọnụnọ; mbata
  rationale: Ihe atụ nke àmụ̀mà a na-ahụ n’ebe niile na-egosi ngosi Ọkpara mmadụ nke ga-eme n’ọdịnihu. “Ọbịbịa” na-ebute echiche ihe omume a n’ụzọ doro anya n’etinyeghị usoro ozizi pụrụ iche; ebe okwu Grik ahụ nwekwara ike ịpụta “ọnụnọ,” e debere nke ahụ n’okpuru peeji.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “Nwa nke Mmadụ” iji chekwaa ọdịdị aha ahụ n’asụsụ isi mmalite na njikọ Akwụkwọ Nsọ ya.
