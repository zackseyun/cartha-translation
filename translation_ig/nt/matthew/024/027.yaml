    issue: The particle -kwa in “a hụkwa ya” is unnecessarily additive/emphatic.
    rationale: The source merely coordinates the clauses with καί (“and”) and uses φαίνεται in a present form. Replacing this with “ma a na-ahụ ya” retains the coordination and better represents the ongoing/general passive sense without adding emphasis.
