  to: N’ihi na, dịka àmụ̀mà si n’ọwụwa anyanwụ apụta ma a na-ahụ ya ruo n’ọdịda anyanwụ, otu a ka ọbịbịa[a] Nwa nke Mmadụ ga-adị.
