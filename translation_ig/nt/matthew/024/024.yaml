review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the future appearance of false messianic claimants and prophets, their performance of great signs and wonders, and the qualified possibility of deceiving even the elect. The phrase for the elect, however, redundantly renders the same idea twice ('họpụtara ahọpụta').
  naturalness: Most of the verse is clear Standard Igbo. Replacing the redundant expression with the idiomatic 'ndị ahọpụtara' improves fluency. Placing 'ọbụna ndị ahọpụtara' directly with 'duhie' also makes the scope of the infinitive clearer.
  terminology: '''Mezaya'' appropriately represents the titular sense of ψευδόχριστοι, and ''ndị amụma ụgha,'' ''ihe ịrịba ama na ihe ebube,'' and ''ndị ahọpụtara'' are suitable biblical-register terms. The alternative footnote should not call ''ndị ahọpụtara'' merely a literal alternative when it is the revised main rendering; it should instead explain the semantic alternative ''ndị a họpụtara.'''
  issues:
  - severity: medium
    issue: Redundant rendering of τοὺς ἐκλεκτούς
    rationale: '''ndị a họpụtara ahọpụta'' duplicates the notion of choosing/election and is unnatural. Greek has one adjective, ἐκλεκτούς; ''ndị ahọpụtara'' renders it adequately and idiomatically.'
  - severity: low
    issue: Footnote b no longer appropriately describes the term
    rationale: A footnote saying 'N’ụzọ nkịtị, “ndị ahọpụtara”' is not useful when that wording is the main text. It should offer the legitimate alternative 'ndị a họpụtara' and identify it as a lexical alternative.
  revised_text: N’ihi na ndị na-azọrọ n’ụgha na ha bụ Mezaya[a] na ndị amụma ụgha ga-apụta, ha ga-emekwa nnukwu ihe ịrịba ama na ihe ebube, iji duhie, ma ọ bụrụ na ọ ga-ekwe omume[c], ọbụna ndị ahọpụtara[b].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Kraịst ụgha.” N’asụsụ Grik, e ji aha ọkwa Christos mee ihe; ebe a, a sụgharịrị ya “Mezaya” n’ihi na ọ bụ aha ọkwa, ọ bụghị aha mmadụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ndị a họpụtara.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ọ bụrụ na nke ahụ ga-ekwe omume.” Asụsụ Grik kwuru naanị “ọ bụrụ na ọ ga-ekwe omume,” n’akọwaghị ihe nke ahụ pụtara n’ụzọ nkà mmụta okpukpe.
    reason: alternative_reading
