id: MAT.24.24
reference: Matthew 24:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: ig
  text: N’ihi na ndị na-azọrọ n’ụgha na ha bụ Mezaya[a] na ndị amụma ụgha ga-apụta, ha ga-emekwa nnukwu ihe ịrịba ama na ihe ebube, iji duhie, ma ọ bụrụ na ọ ga-ekwe omume[c], ọbụna ndị ahọpụtara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Kraịst ụgha.” N’asụsụ Grik, e ji aha ọkwa Christos mee ihe; ebe a, a sụgharịrị ya “Mezaya” n’ihi na ọ bụ aha ọkwa, ọ bụghị aha mmadụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ndị a họpụtara.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ọ bụrụ na nke ahụ ga-ekwe omume.” Asụsụ Grik kwuru naanị “ọ bụrụ na ọ ga-ekwe omume,” n’akọwaghị ihe nke ahụ pụtara n’ụzọ nkà mmụta okpukpe.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: ga-apụta
  rationale: N’ebe a, ọdịdị passive nke ἐγείρω bụ akpaalaokwu na-egosi ndị mmadụ ịpụta n’ihu ọha ma ọ bụ ibili n’etiti ndị ọzọ; “ga-apụta” zere echiche mbilite n’ọnwụ.
- source_word: ψευδόχριστοι
  choice: ndị na-azọrọ ụgha na ha bụ Mezaya
  rationale: Nkọwa a na-egosi ma ψευδο- (‘ụgha’) ma ọrụ Χριστός dị ka aha ọkwa. Ọ bụkwa Igbo doro anya karịa ịsị naanị ‘Ndị Mezaya ụgha,’ nke nwere ike ịdị arọ ma ọ bụ bụrụ ihe mgbagwoju anya.
- source_word: ψευδοπροφῆται
  choice: ndị amụma ụgha
  rationale: Nke a bụ nsụgharị kpọmkwem, nke a na-aghọta nke ọma maka aha ngwakọta ahụ.
- source_word: δώσουσιν
  choice: ha ga-emekwa
  rationale: Mgbe δίδωμι jikọtara ya na ‘ihe ịrịba ama na ihe ebube,’ ọ pụtara ime ma ọ bụ igosipụta ha, ọ bụghị nanị ‘inye’ ha.
- source_word: σημεῖα μεγάλα
  choice: nnukwu ihe ịrịba ama
  rationale: ‘Ihe ịrịba ama’ na-edobe ọrụ σημεῖα dị ka ihe na-egosi ma ọ bụ na-akwado ihe, kama ime ka ọ bụrụ naanị ọrụ ebube.
- source_word: τέρατα
  choice: ihe ebube
  rationale: Nke a na-egosipụta ihe na-akpata ịtụnanya ma kwekọọ n’akpaokwu Akwụkwọ Nsọ ‘ihe ịrịba ama na ihe ebube.’
- source_word: ὥστε πλανῆσαι
  choice: iji duhie
  rationale: ‘Iji’ na-enye ohere ka usoro infinitive ahụ gosi ebumnuche ma ọ bụ ihe omume ahụ na-eduga na ya, n’enweghị ịkpa oke karịa asụsụ Grik.
- source_word: πλανῆσαι
  choice: duhie
  rationale: ‘Duhie’ na-egosi ime ka mmadụ si n’ụzọ ziri ezi pụọ; ihe odide ala peeji na-enye ‘ghọgbuo’ dị ka ụzọ ọzọ.
- source_word: εἰ δυνατὸν
  choice: ma ọ bụrụ na ọ ga-ekwe omume
  rationale: Nke a na-edobe ọnọdụ ahụ dị mfe dịka Grik si kwuo, na-enweghị ime ya ka ọ bụrụ ọnọdụ megidere eziokwu.
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: ọbụna ndị a họpụtara ahọpụta
  rationale: ‘Ọbụna’ na-egosipụta ike ascensive nke καί, ebe ‘ndị a họpụtara ahọpụta’ bụ Igbo doro anya maka ἐκλεκτούς.
theological_decisions:
- issue: Ọrụ ψευδόχριστοι na ọnọdụ Χριστός dịka aha ọkwa
  choice: ndị na-azọrọ ụgha na ha bụ Mezaya
  alternative: Ndị Kraịst ụgha; Ndị Mezaya ụgha
  rationale: ‘Mezaya’ na-edobe ọnọdụ ndị Juu na ọrụ aha ọkwa ahụ. Nkọwa ‘ndị na-azọrọ ụgha’ na-eme ka echiche nke ndị na-eme onwe ha onye ahụ doo anya n’Igbo.
- issue: Ike εἰ δυνατὸν gbasara ndị a họpụtara ahọpụta
  choice: ma ọ bụrụ na ọ ga-ekwe omume
  alternative: ọ bụrụgodị na nke ahụ ga-ekwe omume
  rationale: Nsụgharị a anaghị ekpebi ma ọnọdụ ahụ ọ̀ bụ ihe na-agaghị ekwe omume; ọ na-edobe esemokwu nkà mmụta okpukpe nke okwu Grik hapụrụ n’emeghị mkpebi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A kọwara ψευδόχριστοι n’ụzọ okwu ọnụ ka ‘ndị na-azọrọ ụgha na ha bụ Mezaya’ iji zere akpaokwu siri ike ma debe echiche aha ọkwa ahụ. Akara ihe odide ala peeji niile dị n’ahịrịokwu isi.
