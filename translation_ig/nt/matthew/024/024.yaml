revisions:
- from: N’ihi na ndị na-azọrọ ụgha na ha bụ Mezaya[a] na ndị amụma ụgha ga-apụta, ha ga-emekwa nnukwu ihe ịrịba ama na ihe ebube, iji duhie, ma ọ bụrụ na ọ ga-ekwe omume[c], ọbụna ndị a họpụtara ahọpụta[b].
  to: N’ihi na ndị na-azọrọ n’ụgha na ha bụ Mezaya[a] na ndị amụma ụgha ga-apụta, ha ga-emekwa nnukwu ihe ịrịba ama na ihe ebube, iji duhie, ma ọ bụrụ na ọ ga-ekwe omume[c], ọbụna ndị ahọpụtara[b].
  rationale: The revision retains the source text’s conditional ambiguity and all semantic components while correcting the duplicated wording for ἐκλεκτούς and making its footnote a genuine alternative. No doctrinal conclusion is added concerning whether the elect can be deceived.
  reviewer_model: gpt-5.6-terra
