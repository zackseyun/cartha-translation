id: MAT.24.39
reference: Matthew 24:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: ig
  text: Ha amataghị ruo mgbe iju mmiri ahụ bịara buru ha niile pụọ; otú ahụkwa ka ọbịbịa Nwa nke Mmadụ ga-adị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: ha amataghị
  rationale: Nke a na-egosipụta na ha amaghị ma ọ bụ na ha aghọtaghị ihe na-abịa, na-agbakwụnyeghị ihe na-adịghị n'okwu Grik.
- source_word: ὁ κατακλυσμός
  choice: iju mmiri ahụ
  rationale: Ọ bụ okwu Igbo doro anya maka nnukwu idei mmiri a kpọtụrụ aha n'akụkọ Noa; njirimara “ahụ” na-anọchi mkpụrụokwu njirimara Grik.
- source_word: ἦρεν ἅπαντας
  choice: buru ha niile pụọ
  rationale: “Buru ... pụọ” na-edobe echiche bụ isi nke ἦρεν n'ọnọdụ iju mmiri, ma “ha niile” na-anọchi ἅπαντας.
- source_word: ἡ παρουσία
  choice: ọbịbịa
  rationale: N'ọnọdụ a παρουσία na-ezo aka n'ọbịbịa Nwa nke Mmadụ; “ọbịbịa” bụ okwu Igbo nkịtị, doro anya, nke na-adịghị etinye nkọwa ụka pụrụ iche.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-edobe aha ahụ n'ụdị a maara nke ọma n'Igbo ma soro usoro okwu Grik nso.
theological_decisions:
- issue: Ihe παρουσία pụtara n'amaokwu a
  choice: ọbịbịa
  alternative: ọnụnọ
  rationale: Ọ bụ ezie na παρουσία nwere ike ịpụta “ọnụnọ,” ntụnyere na ihe omume mberede nke iju mmiri na amaokwu a na-akwado “ọbịbịa,” n'ebughị amụma banyere nkọwa ndị ọzọ.
- issue: Ike nke ἦρεν
  choice: buru ha niile pụọ
  alternative: kpochapụ ha niile
  rationale: Nhọrọ a na-edobe ihe oyiyi iju mmiri na-eburu mmadụ pụọ, ma zere ime ka ngwaa ahụ kwuo kpọmkwem “gbuo” ma ọ bụ “bibie,” nke ederede Grik ekwughị kpọmkwem.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro ntụnyere nke amaokwu ahụ, tinyere “otú ahụkwa,” n'ụzọ eke n'Igbo.
