source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: ig
  text: Ma ọ bụrụ na ajọ ohu ahụ[a] asị n’obi ya, “Nna m ukwu[b] na-egbu oge,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ajọ onye na-eje ozi ahụ.” Okwu Grik bụ doulos, nke nwere ike ịpụta “ohu” ma ọ bụ “onye na-eje ozi,” dabere n’ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Onyenwe m na-egbu oge.” N’ebe a, “Nna m ukwu” na-egosipụta mmekọrịta dị n’ụlọ n’akụkọ ihe atụ ahụ; okwu Grik bụ kyrios.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Ma ọ bụrụ na
  rationale: Nke a na-egosipụta ọnọdụ e chere na ọ pụrụ ime, ebe δέ na-eweta ntakịrị ntụgharị n’ihe a na-ekwu.
- source_word: εἴπῃ
  choice: asị
  rationale: Ụdị a dabara nke ọma n’usoro ọnọdụ Igbo, ‘ọ bụrụ na ... asị,’ ma na-echekwa echiche nke ihe pụrụ ime.
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: ajọ ohu ahụ
  rationale: ‘Ajọ’ na-egosipụta njọ omume nke κακός; ‘ohu’ na-echekwa ike okwu δοῦλος nke nwere ike ịpụta ohu ma ọ bụ onye na-eje ozi, ebe ‘ahụ’ na-anọchi ἐκεῖνος.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: n’obi ya
  rationale: Nke a na-echekwa ihe atụ Grik banyere echiche mmadụ zoro ezo, ma bụrụkwa okwu Igbo doro anya ma dị ebube.
- source_word: Χρονίζει
  choice: na-egbu oge
  rationale: Ọ na-egosipụta omume na-aga n’ihu ma ọ bụ oge onye ahụ chere na ọ na-adịte aka.
- source_word: μου ὁ κύριος
  choice: Nna m ukwu
  rationale: N’ọnọdụ akụkọ ezinụlọ a, κύριος bụ onye nwe ohu ahụ ma ọ bụ onyeisi ya; ‘Nna m ukwu’ bụ okwu Igbo e ji nkwanye ùgwù kpọọ onye dị otu a.
theological_decisions:
- issue: Otu e si tụgharịa κύριος n’akụkọ ihe atụ a
  choice: Nna m ukwu
  alternative: Onyenwe m; Onyenweanyị m
  rationale: N’elu akụkọ ahụ kpọmkwem, okwu a na-ezo aka n’onye nwe ụlọ na onyeisi ohu, ya mere ‘Nna m ukwu’ na-egosipụta mmekọrịta ahụ n’etinyeghị aha nsọ nke Onyenweanyị n’ọnụ ohu ahụ. Ma ihe akụkọ ahụ na-anọchi anya ya n’ozuzu ya ka dịịrị onye na-agụ ya ịhụ.
- issue: Otu e si tụgharịa δοῦλος
  choice: ohu
  alternative: onye na-eje ozi
  rationale: ‘Ohu’ na-anọ nso n’ike okwu Grik ma na-egosipụta na onye ahụ nọ n’okpuru ikike nna ya ukwu. E tinyere nhọrọ dị nro karị n’akụkụ nkọwa iji mee ka obosara okwu ahụ pụta ìhè.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dị ebube. ‘N’obi ya’ na-echekwa ụdị okwu Baịbụl n’enweghị isi ike; ‘na-egbu oge’ bụ okwu nkịtị maka χρονίζει. E debere akara nkọwa ụkwụ [a] na [b] n’ahịrịokwu bụ isi.
