revisions:
- from: Mgbe ọ nọ ọdụ n’Ugwu Oliv, ndị na-eso ụzọ ya bịakwutere ya na nzuzo, sị, “Gwa anyị, olee mgbe ihe ndị a ga-eme, gịnịkwa ga-abụ ihe ịrịba ama nke ọbịbịa gị[a] na nke njedebe nke oge[b]?”
  to: Mgbe ọ nọ ọdụ n’Ugwu Oliv, ndị na-eso ụzọ ya bịakwutere ya naanị ha, sị, “Gwa anyị, olee mgbe ihe ndị a ga-eme, gịnịkwa ga-abụ ihe ịrịba ama nke ọbịbịa gị[a] na nke ọgwụgwụ nke ọgbọ a[b]?”
  rationale: 'The revision preserves the source’s ambiguity and eschatological register while making two targeted changes: it renders κατ’ ἰδίαν as ‘naanị ha,’ rather than suggesting secrecy, and it renders αἰών as ‘ọgbọ a,’ rather than ‘oge,’ which may suggest time in general. Footnote anchors remain attached to the expressions they explain.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:50:47Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal setting, the disciples’ approach, the two questions, παρουσία as a future-oriented ‘coming,’ and the distinction between ‘age’ and ‘world.’ However, ‘njedebe nke oge’ can naturally be heard as the end of time itself, whereas τοῦ αἰῶνος refers to the close/consummation of the age. ‘Na nzuzo’ can imply secrecy rather than the Greek sense of being apart from others.
  naturalness: The wording is generally clear Standard Igbo. Replacing ‘na nzuzo’ with ‘naanị ha’ gives a more idiomatic and contextually precise expression for a private conversation. ‘Ọgwụgwụ nke ọgbọ a’ more naturally distinguishes an age/era from time in general.
  terminology: ‘Ugwu Oliv,’ ‘ihe ịrịba ama,’ and ‘ọbịbịa gị’ are suitable. The alternative ‘ọnụnọ gị’ appropriately preserves the lexical range of παρουσία. The main text and footnote are revised to represent συντέλεια τοῦ αἰῶνος as the completion/end of this age, without importing physical-world destruction.
  issues:
  - severity: medium
    issue: ‘na nzuzo’ may imply secret action.
    rationale: κατ’ ἰδίαν means privately/apart from others. ‘Naanị ha’ directly conveys that the disciples approached Jesus by themselves and does not add an implication of concealment.
  - severity: medium
    issue: ‘njedebe nke oge’ may mean ‘the end of time.’
    rationale: αἰών here denotes an age/era, not time in the abstract. ‘Ọgwụgwụ nke ọgbọ a’ retains the age-specific sense and avoids an unintended cosmological or temporal-finality claim.
  revised_text: Mgbe ọ nọ ọdụ n’Ugwu Oliv, ndị na-eso ụzọ ya bịakwutere ya naanị ha, sị, “Gwa anyị, olee mgbe ihe ndị a ga-eme, gịnịkwa ga-abụ ihe ịrịba ama nke ọbịbịa gị[a] na nke ọgwụgwụ nke ọgbọ a[b]?”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ “ọnụnọ gị” ma ọ bụ “ịbịarute gị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “mmezu zuru ezu nke ọgbọ a”; dịka nsụgharị ọdịnala si kwuo, “njedebe nke ụwa.”
    reason: alternative_reading
  revision_rationale: 'The revision preserves the source’s ambiguity and eschatological register while making two targeted changes: it renders κατ’ ἰδίαν as ‘naanị ha,’ rather than suggesting secrecy, and it renders αἰών as ‘ọgbọ a,’ rather than ‘oge,’ which may suggest time in general. Footnote anchors remain attached to the expressions they explain.'
