id: MAT.24.3
reference: Matthew 24:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: ig
  text: Mgbe ọ nọ ọdụ n’Ugwu Oliv, ndị na-eso ụzọ ya bịakwutere ya naanị ha, sị, “Gwa anyị, olee mgbe ihe ndị a ga-eme, gịnịkwa ga-abụ ihe ịrịba ama nke ọbịbịa gị[a] na nke ọgwụgwụ nke ọgbọ a[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ọnụnọ gị” ma ọ bụ “ịbịarute gị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “mmezu zuru ezu nke ọgbọ a”; dịka nsụgharị ọdịnala si kwuo, “njedebe nke ụwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Mgbe ọ nọ ọdụ
  rationale: Nkebiokwu a na-egosi ọnọdụ na-aga n’ihu n’oge ihe ọzọ mere; nsụgharị a bụ Igbo nkịtị ma na-echekwa ihe genitive absolute ahụ pụtara.
- source_word: Ὄρους τῶν Ἐλαιῶν
  choice: Ugwu Oliv
  rationale: Nke a bụ aha ebe a maara nke ọma n’Igbo, kama ịsụgharị ya n’ụzọ siri ike dị ka ‘ugwu osisi oliv.’
- source_word: προσῆλθον αὐτῷ
  choice: bịakwutere ya
  rationale: Ọ na-egosi na ndị ahụ bịara nso n’ebe ọ nọ; ‘bịakwutere ya’ bụ okwu Igbo doro anya ma kwekọọ n’akụkọ.
- source_word: οἱ μαθηταί
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị akọwa ndị na-amụ ihe n’aka onye nkụzi ma na-eso ya.
- source_word: κατ’ ἰδίαν
  choice: na nzuzo
  rationale: Ọ pụtara na ha bịakwutere ya iche n’ebe ndị ọzọ nọ, ka okwu ahụ ghara ịbụ nke ọha.
- source_word: Εἰπὸν ἡμῖν
  choice: Gwa anyị
  rationale: Nke a na-enye arịrịọ iwu ahụ n’Igbo dị ndụ ma dị nkenke.
- source_word: πότε ταῦτα ἔσται
  choice: olee mgbe ihe ndị a ga-eme
  rationale: ‘Ga-eme’ na-egosi na ajụjụ ahụ bụ banyere mgbe ihe ndị Jizọs kwuru ga-abịa imezu, n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: Nke a bụ okwu Igbo doro anya maka ihe na-egosi ma ọ bụ na-eme ka a mata ihe ọzọ.
- source_word: παρουσίας
  choice: ọbịbịa
  rationale: N’ebe a, okwu ahụ na-elekwasị anya n’ihe ga-eme n’ọdịnihu. ‘Ọbịbịa’ na-ekwupụta nke ahụ nke ọma, ebe a na-edebe ‘ọnụnọ’ na ‘ịbịarute’ dịka nhọrọ n’okpuru peeji.
- source_word: συντελείας τοῦ αἰῶνος
  choice: njedebe nke oge
  rationale: Nke a na-echekwa echiche nke mmechi ma ọ bụ mmezu nke otu oge, n’agbanweghị αἰών ka ọ bụrụ ụwa a na-ahụ anya.
theological_decisions:
- issue: Ihe παρουσία pụtara n’ajụjụ banyere ihe ndị ga-eme n’ọdịnihu
  choice: ọbịbịa gị
  alternative: ọnụnọ gị; ịbịarute gị
  rationale: ‘Ọbịbịa’ dabara n’ajụjụ a na-ajụ banyere ihe ga-eme n’ọdịnihu, ma okwu Grik ahụ nwekwara ike ịpụta ọnụnọ ma ọ bụ ịbịarute. Ihe odide ala peeji na-echekwa ohere ndị ahụ n’akọwaghị usoro ma ọ bụ oge ihe ahụ ga-eme.
- issue: Ihe συντελείας τοῦ αἰῶνος pụtara
  choice: njedebe nke oge
  alternative: mmezu zuru ezu nke oge; njedebe nke ụwa
  rationale: Okwu Grik ahụ na-ekwu maka mmechi ma ọ bụ mmezu nke oge, ọ bụghị kpọmkwem mbibi nke ụwa a na-ahụ anya. Ya mere, a hapụrụ nsụgharị ọdịnala ‘njedebe nke ụwa’ n’okpuru peeji kama itinye ya n’ahịrị bụ isi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere akara ala peeji [a] n’akụkụ ‘ọbịbịa’ na [b] n’akụkụ ‘njedebe nke oge,’ n’ihi na ebe ndị ahụ ka nhọrọ okwu ndị dị na ndetu metụtara.
