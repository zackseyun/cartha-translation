review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the imperative to vigilance, the inferential οὖν, the reason clause, the plural possessive in “Onyenwe unu,” and the Greek present-form verb “na-abịa.” However, “ụbọchị nke Onyenwe unu na-abịa” does not adequately represent ποίᾳ ἡμέρᾳ (“on what/which day”); it can be read simply as “the day that your Lord is coming.” The interrogative element must be explicit.
  naturalness: “Nọnụ na nche” is a natural, direct Standard Igbo exhortation. “Ụbọchị ole Onyenwe unu na-abịa” idiomatically expresses the embedded question and clearly retains the unknown specific day.
  terminology: “Onyenwe” is an appropriate established rendering of κύριος here. “Na-abịa” appropriately retains the Greek present form without forcing a precise eschatological timetable.
  issues:
  - severity: medium
    issue: The phrase “ụbọchị nke” omits the interrogative force of ποίᾳ.
    rationale: ποίᾳ asks “what/which”; “ụbọchị nke Onyenwe unu na-abịa” may instead identify a definite day associated with the Lord’s coming. “Ụbọchị ole” explicitly expresses the required embedded question.
