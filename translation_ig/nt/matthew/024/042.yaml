  to: N’ihi ya, nọnụ na nche[a], n’ihi na unu amaghị ụbọchị ole Onyenwe unu na-abịa[b].
  rationale: The revision replaces the non-interrogative-sounding “ụbọchị nke” with “ụbọchị ole,” preserving the explicit interrogative specificity of ποίᾳ ἡμέρᾳ. It also uses the more concise imperative “nọnụ na nche,” while retaining the ongoing vigilance sense and the present-form rendering “na-abịa.”
