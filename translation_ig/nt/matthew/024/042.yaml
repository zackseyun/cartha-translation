  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε ποίᾳ ⸀ἡμέρᾳ ὁ κύριος ὑμῶν ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: ig
  text: N’ihi ya, nọnụ na nche[a], n’ihi na unu amaghị ụbọchị ole Onyenwe unu na-abịa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-amụ anya” ma ọ bụ “na-eche nche.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ga-abịa.” Grik ji ụdị ngwaa nke oge ugbu a mee ihe.
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: na-anọgidenụ na nche
  rationale: Ngwaa iwu nke nọ n’ụdị ugbu a ma bụrụ ọtụtụ mmadụ na-akpọ ha ka ha nọgide na-amụ anya. ‘Na-anọgidenụ na nche’ bụ Igbo nkịtị nke na-echekwa echiche ịnọ na nche na ịmụrụ anya, n’enweghị ịkọwa ya nanị dị ka ịdị njikere.
- source_word: οὖν
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Na-ebute ihe kpatara iwu ahụ, ma bụrụkwa okwu doro anya n’Igbo nke oge a.
- source_word: οὐκ οἴδατε
  choice: unu amaghị
  rationale: Na-asụgharị n'ụzọ kwụ ọtọ nkwupụta na ndị a na-agwa okwu amaghị, n’etinyeghị echiche ọzọ na-adịghị na Grik.
- source_word: ποίᾳ ἡμέρᾳ
  choice: ụbọchị nke
  rationale: Na-enye ajụjụ gbasara kpọmkwem ụbọchị a na-amaghị n’ụzọ na-aga nke ọma n’Igbo.
- source_word: ὁ κύριος ὑμῶν
  choice: Onyenwe unu
  rationale: ‘Onyenwe’ na-echekwa echiche nke ikike na aha a na-ejikarị akpọ κύριος n’Agba Ọhụrụ; ‘unu’ na-egosipụta nnọchiaha nwe nke ọtụtụ mmadụ.
- source_word: ἔρχεται
  choice: na-abịa
  rationale: Na-echekwa ọdịdị oge ugbu a nke Grik na ịdị ndụ nke atụmanya ahụ, n’amanyeghị nkọwa kpọmkwem banyere oge ọ ga-eme.
theological_decisions:
- issue: Ike gbasara ihe ga-eme n’ọdịnihu nke ụdị oge ugbu a ἔρχεται
  choice: na-abịa
  alternative: ga-abịa
  rationale: ‘Na-abịa’ na-echekwa ụdị oge ugbu a na ịdị ngwa nke okwu Grik, ma ọ naghị ekpebi kpọmkwem otú nso ọbịbịa ahụ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E ji ụdị ọtụtụ mmadụ ‘unu’ mee ihe dịka ederede Grik si dị. A họọrọ ‘na-anọgidenụ na nche’ ka ọ bụrụ okwu sitere n’okike n’Igbo ma chekwaa oku maka nche nke na-aga n’ihu.
