source:
  edition: SBLGNT
  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: ig
  text: Mgbe ahụ kwa, ọtụtụ mmadụ ga-adaghachi azụ[a]; ha ga-arara ibe ha nye[b], kpọọkwa ibe ha asị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a ga-eme ka ha sụọ ngọngọ,” ma ọ bụ, “ha ga-ewe iwe.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha ga-enyefe ibe ha n’aka ndị ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: mgbe ahụ
  rationale: Ọ na-egosi oge na usoro ihe ndị Jizọs na-ekwu; “mgbe ahụ” bụ okwu Igbo doro anya ma dịkwa n’usoro nkịtị.
- source_word: σκανδαλισθήσονται
  choice: ga-adaghachi azụ
  rationale: N’ọnọdụ mkpagbu a, ngwaa a na-egosi na ọtụtụ ga-ada ma kwụsị iguzosi ike, ọ bụghị naanị na ihe ga-ewe ha iwe. Okwu a na-egosi ndapụ ahụ n’enweghị ịkọwa ya dịka ozizi pụrụ iche.
- source_word: πολλοὶ
  choice: ọtụtụ mmadụ
  rationale: Adjective ahụ nọchiri aha mmadụ; ịgbakwunye “mmadụ” na-eme ka Igbo doo anya ma dịrị ndị na-agụ ya mfe.
- source_word: ἀλλήλους
  choice: ibe ha
  rationale: “Ibe ha” na-egosi omume ha na-emere onwe ha n’etiti ha, dịka reciprocal pronoun Grik ahụ si dị.
- source_word: παραδώσουσιν
  choice: ga-arara ibe ha nye
  rationale: N’ọnọdụ iro na mkpagbu a, akpaalaokwu Igbo a na-egosi nrara nye nke ọma, ma ọ ka na-ejigide echiche nke inyefe mmadụ n’aka ndị ọzọ.
- source_word: μισήσουσιν
  choice: kpọọkwa ibe ha asị
  rationale: Nke a bụ ụzọ Igbo nkịtị ma sie ike isi kwuo μισέω, ya bụ inwe ịkpọasị na iro megide ibe ha.
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: Mgbe ahụkwa ...; ha ga-... , kpọọkwa ...
  rationale: Mkpụrụokwu “-kwa” na nhazi ahịrịokwu ahụ na-ejigide njikọ na uto nke καί ugboro ugboro, ma na-eme ka amaokwu ahụ na-ada ka Igbo sitere n’ọnụ mmadụ.
theological_decisions:
- issue: Ihe σκανδαλισθήσονται pụtara n’ọnọdụ mkpagbu nke oge ikpeazụ
  choice: ga-adaghachi azụ
  alternative: a ga-eme ka ha sụọ ngọngọ; ihe ga-ewe ha iwe
  rationale: Usoro amaokwu ahụ si n’ịda azụ gaa na nrara nye na ịkpọasị na-egosi ndapụ siri ike. “Ga-adaghachi azụ” na-egosipụta ịdị arọ ya n’enweghị ikwu kpọmkwem usoro ozizi banyere ndapụ n’okwukwe.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ga-adaghachi azụ” na “ga-arara ibe ha nye” bụ akpaalaokwu ndị mmadụ na-aghọta, ebe nkọwa ala peeji na-echekwa nghọta ndị ọzọ dị na okwu Grik.
