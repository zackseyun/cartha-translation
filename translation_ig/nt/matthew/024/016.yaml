translation:
  language: ig
  text: Mgbe ahụ, ndị nọ na Judia aghaghị ịgbaga n’ugwu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ka ha gbaga n’ugwu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: mgbe ahụ
  rationale: Ọ na-egosi oge na usoro ihe ndị Jizọs na-ekwu; “mgbe ahụ” bụ okwu Igbo doro anya ma kwekọọ n’ike nke adverb a.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: ndị nọ na Judia
  rationale: Artịkụl ya na nkebiokwu prepositional na-anọchi anya ndị mmadụ bi ma ọ bụ nọ n’ógbè ahụ, n’etinyeghị nkọwa ọzọ na-adịghị na isiokwu Grik.
- source_word: Ἰουδαίᾳ
  choice: Judia
  rationale: “Judia” bụ aha mpaghara ahụ n’ụdị a na-aghọta nke ọma n’Igbo.
- source_word: φευγέτωσαν
  choice: aghaghị ịgbaga
  rationale: Ọ bụ iwu nke onye nke atọ, plural, nke na-enye ntụziaka ngwa ngwa; “aghaghị ịgbaga” na-egosipụta ike na ịdị ngwa nke iwu ahụ n’Igbo oge a.
- source_word: ἐπὶ τὰ ὄρη
  choice: n’ugwu
  rationale: N’eso ngwaa ngagharị, nkebiokwu a na-egosi ebe ha ga-agbaga; “n’ugwu” bụ okwu Igbo sitere n’okike ma na-edobe ugwu dịka ebe a na-aga.
theological_decisions:
- issue: Ike iwu ahụ n’ịdọ aka ná ntị banyere ihe ndị ga-eme
  choice: 'E gosipụtara ya dịka iwu siri ike na ngwa ngwa: “aghaghị ịgbaga.”'
  alternative: “ka ha gbaga”
  rationale: Amaokwu ahụ na-enye ntụziaka bara uru, ọ bụghị nkọwa ga-ekpebi usoro ihe gbasara ọgwụgwụ oge. Nsụgharị a na-edobe ịdị ngwa nke ịdọ aka ná ntị Jizọs n’etinyeghị ozizi ọzọ.
translation_notes:
  register: Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù, ma dị mfe nghọta. E jiri “aghaghị ịgbaga” mee ka ike iwu Grik pụta ìhè, ebe e debere ụdị iwu a kapịrị ọnụ karịa n’ala ala peeji.
