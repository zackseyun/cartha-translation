id: MAT.24.21
reference: Matthew 24:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: ig
  text: N’ihi na n’oge ahụ, a ga-enwe oke mkpagbu[a], nke na-emebeghị kemgbe mmalite ụwa ruo ugbu a, nke na-agaghị eme ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “oke nhụjuanya” ma ọ bụ “oke ahụhụ.” Okwu Grik ahụ nwere ike ịpụta nnukwu nsogbu, nrụgide, ma ọ bụ mmegbu.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: N’ihi na mgbe ahụ
  rationale: “N’ihi na” na-egosi njikọ nkọwa nke γάρ na amaokwu bu ụzọ, ebe “mgbe ahụ” na-asụgharị τότε n’ụzọ Igbo dị mfe.
- source_word: ἔσται
  choice: ga-adị
  rationale: Nke a na-egosi ihe ga-adị n’ọdịnihu, kwekọọkwa na θλῖψις dị ka isiokwu ahịrịokwu ahụ.
- source_word: θλῖψις μεγάλη
  choice: oke mkpagbu
  rationale: “Mkpagbu” nwere ike ịpụta nnukwu ahụhụ, nrụgide, ma ọ bụ mmegbu; “oke” na-egosi ịdị ukwuu nke μεγάλη ma na-edobe ịdị arọ nke okwu ahụ n’ọnọdụ amụma banyere ihe ga-abịa.
- source_word: οἵα
  choice: ụdị nke
  rationale: Nke a na-edobe ntụnyere gbasara ụdị na ịdị njọ pụrụ iche nke ihe ahụ.
- source_word: οὐ γέγονεν
  choice: na-enwetụbeghị
  rationale: Ụdị a na-egosi na ụdị ihe ahụ emebeghị ma ọ bụ adịbeghị ruo oge a, ma na-ada nke ọma n’Igbo mgbe a na-ekwu banyere mkpagbu.
- source_word: ἀπ’ ἀρχῆς κόσμου
  choice: site ná mmalite ụwa
  rationale: “Ụwa” na-asụgharị κόσμος n’enweghị ịgbasa ya gaa n’“okike,” nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: ἕως τοῦ νῦν
  choice: ruo ugbu a
  rationale: Nke a bụ ntụgharị Igbo doro anya nke akpaokwu oge ahụ.
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: nke na-agaghịkwa adị ọzọ
  rationale: “Agaghị” na-egosi nkwuwa okwu siri ike nke οὐ μή; “ọzọ” na-eme ka ntụnyere ahụ na oge ga-abịa doo anya n’Igbo n’enweghị ịkọwa ozizi karịrị ihe ederede kwuru.
theological_decisions:
- issue: Otú e si asụgharị θλῖψις nke nwere nnukwu ibu n’okwu banyere ọgwụgwụ oge
  choice: oke mkpagbu
  alternative: oke nhụjuanya; oke ahụhụ
  rationale: “Oke mkpagbu” na-edobe ịdị njọ na ụda nke okwu ahụ, ma ọ naghị etinye nkọwa okpukpe pụrụ iche banyere kpọmkwem ụdị ihe omume ahụ.
- issue: Ike nke nkwuwa okwu n’ọdịnihu na οὐ μή
  choice: na-agaghịkwa adị ọzọ
  alternative: ọ gaghị adịkwa ma ọlị
  rationale: Nhọrọ a na-egosipụta ngọnarị ọdịnihu siri ike ma na-edobe njikọ ntụnyere dị n’etiti oge gara aga, ugbu a, na ọdịnihu.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị nsọ ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe njikọ ya na amaokwu bu ụzọ, ịdị njọ pụrụ iche nke mkpagbu ahụ, na ngọnarị ọdịnihu siri ike.
