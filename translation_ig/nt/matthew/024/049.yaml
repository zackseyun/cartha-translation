  register: Standard Igbo dị ugbu a, kwụ ọtọ ma dị nsọpụrụ. E debere nkebi ahịrịokwu ahụ ka ọ jikọọ na amaokwu ndị gbara ya gburugburu; akara [a] na [b] nọ kpọmkwem n'edemede.
