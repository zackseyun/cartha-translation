  text: wee malite iti ndị ohu ibe ya[a][c] ihe, ma soro ndị na-aṅụbiga mmanya ókè rie ma ṅụọ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị na-ejere otu nna ukwu ozi dị ka ya.” N'okwu Grik, ọ bụ kpọmkwem “ndị ohu ibe ya,” nke na-emesi ike na ha niile nọ n'okpuru otu nna ukwu.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya “ndị aṅụrụma.” Okwu Grik ahụ na-ekwu banyere ndị ịṅụbiga mmanya ókè ji mara dịka omume ha.
    reason: lexical_alternative
  - marker: c
    text: Ụfọdụ akwụkwọ ochie anaghị etinye “ya” (“his”).
    reason: textual_variant
lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: malite iti ... ihe
  rationale: Ngwakọta ngwaa a na-egosi mmalite omume; “malite iti ... ihe” bụ Igbo doro anya ma na-egosikwa ime ihe ike na-aga n'ihu.
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: ndị ohu ibe ya
  rationale: '“Ndị ohu ibe ya” na-echekwa echiche σύνδουλος: ha niile bụ ndị ohu nọ n''okpuru otu nna ukwu.'
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: na ... rie ma ṅụọ
  rationale: Nke a na-edobe ngwaa abụọ ahụ n'ụzọ Igbo dị ire, n'enweghị itinye echiche oriri pụrụ iche na-adịghị n'okwu Grik.
- source_word: μετὰ τῶν μεθυόντων
  choice: iso ndị na-aṅụbiga mmanya ókè
  rationale: Ọnụnọ participle na-egosi ndị omume ịṅụbiga mmanya ókè ji mara; okwu a dị eke ma ghara ịkpọ ha aha mkparị.
- source_word: δὲ
  choice: na
  rationale: N'ebe a δέ bụ njikọ dị nro, ọ bụghị mmegide siri ike; “na” na-eme ka usoro omume ahụ gaa nke ọma n'Igbo.
theological_decisions:
- issue: Nsụgharị okwu ezinụlọ δοῦλος dị na συνδούλους
  choice: ndị ohu ibe ya
  alternative: ndị na-ejere nna ukwu ibe ya ozi
  rationale: “Ndị ohu ibe ya” na-echekwa ọnọdụ ha niile nọ n'okpuru otu nna ukwu, bụ́ isi ike mmekọrịta dị n'ilu ahụ, n'enweghị ime ka ọ bụrụ naanị ọrụ a na-akwụ ụgwọ.
