id: MAT.24.34
reference: Matthew 24:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: ig
  text: N’ezie, ana m agwa unu na ọgbọ a agaghị agabiga ma ọlị ruo mgbe ihe ndị a niile ga-eme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị mmadụ a” ma ọ bụ “agbụrụ a.” Okwu Grik ahụ nwere ike inwe nghọta sara mbara karị, ma “ọgbọ” bụ nsụgharị kacha kwụ ọtọ n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: N’ezie
  rationale: N’usoro okwu siri ike ἀμὴν λέγω ὑμῖν, “N’ezie” na-egosipụta nkwenye na ịdị arọ nke okwu ahụ n’Igbo dị ugbu a, kama idegharị ya dịka “Amen.”
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si kwuo okwu a, ma na-echekwa onye na-ekwu okwu na ndị a na-agwa n’ụdị ọtụtụ.
- source_word: οὐ μὴ παρέλθῃ
  choice: agaghị agabiga ma ọlị
  rationale: “Agaghị ... ma ọlị” na-echekwa nkwusioru ike dị n’ọjụjụ Greek οὐ μή; “agabiga” na-anọchi παρέρχομαι n’ụzọ kwụ ọtọ ma ghara ịkọwa ihe arụmụka ahụ n’otu ụzọ.
- source_word: ἡ γενεὰ αὕτη
  choice: ọgbọ a
  rationale: “Ọgbọ a” bụ nsụgharị kacha kwụ ọtọ na nke a na-ahụkarị maka γενεὰ αὕτη, ma na-ahapụ esemokwu gbasara kpọmkwem ndị ọ na-ezo aka na ha ka ọ dị.
- source_word: ἕως ἂν
  choice: ruo mgbe
  rationale: “Ruo mgbe” na-egosipụta oke oge na ihe a na-atụ anya ime n’ọdịnihu dịka ἕως ἂν si eme.
- source_word: πάντα ταῦτα
  choice: ihe ndị a niile
  rationale: Nke a na-echekwa ọtụtụ nke neuter plural Greek ma na-ada nke ọma n’Igbo.
- source_word: γένηται
  choice: ga-eme
  rationale: N’ebe a γίνομαι na-ekwu maka ihe omume ndị ga-eme; “ga-eme” bụ okwu Igbo doro anya ma dị mfe.
theological_decisions:
- issue: Ihe “ọgbọ a” (ἡ γενεὰ αὕτη) pụtara n’okwu gbasara ihe ndị ikpeazụ
  choice: A sụgharịrị ya n’ụzọ lexical dịka “ọgbọ a,” na-enweghị mgbakwunye nkọwa.
  alternative: “ndị a,” “agbụrụ a,” ma ọ bụ ọgbọ ndị ha na Jizọs dịkọrọ ndụ
  rationale: “Ọgbọ a” bụ nsụgharị kacha nso n’echiche nkịtị nke Greek. Ọ na-echekwa mgbagwoju anya na esemokwu nkọwa dị n’amaokwu ahụ, kama ịmanye otu usoro nkọwa banyere ihe ndị ikpeazụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “N’ezie, ana m agwa unu” na-edobe ịdị arọ nke usoro okwu Jizọs; “ma ọlị” na-egosipụta ọjụjụ siri ike nke Greek. Akara nkọwa ala ala [a] dị n’ederede isi.
