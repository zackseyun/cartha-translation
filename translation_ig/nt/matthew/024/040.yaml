  text: τότε ⸂δύο ἔσονται⸃ ἐν τῷ ἀγρῷ, ⸀εἷς παραλαμβάνεται καὶ ⸁εἷς ἀφίεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: ig
  text: Mgbe ahụ, ndị ikom abụọ ga-anọ n’ubi; a ga-akpọrọ otu[a], a hapụkwa nke ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a ga-akpọrọ otu gaa.” Ngwaa Grik a n’onwe ya anaghị ekpebi ma ịkpọrọ onye ahụ ọ bụ maka ịnapụta ya ka ọ bụ maka ikpe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-ejikọta ihe a na-ekwu na ihe ndị bu ya ụzọ ma na-egosi oge ihe ahụ ga-eme.
- source_word: δύο ἔσονται
  choice: ndị ikom abụọ ga-anọ
  rationale: Ọ bụ ezie na ‘ndị abụọ’ ka mkpụrụokwu ahụ pụtara kpọmkwem, εἷς ... εἷς dị n’ụdị nwoke, amaokwu na-esochikwa ya na-enye ihe atụ kwekọrọ na nke ụmụ nwanyị; ya mere, e mere ka ndị a bụrụ ndị ikom n’Igbo.
- source_word: ἐν τῷ ἀγρῷ
  choice: n’ubi
  rationale: Nke a bụ nsụgharị doro anya ma bụrụkwa ụzọ ndị Igbo si ekwu na mmadụ nọ n’ebe a na-akọ ihe.
- source_word: παραλαμβάνεται
  choice: a ga-akpọrọ otu
  rationale: ‘Kpọrọ’ na-egosi na a na-ewe mmadụ ka o soro ma ọ bụ na-akpọrọ ya pụọ, ma ọ naghị ekpebi n’onwe ya ma nke ahụ ọ bụ maka nzọpụta ka ọ bụ maka ikpe.
- source_word: ἀφίεται
  choice: a hapụkwa nke ọzọ
  rationale: ‘Hapụ’ na-egosipụta ọdịiche dị n’etiti onye a kpọrọ na onye fọdụrụ, n’etinyeghị echiche siri ike dịka ịgbahapụ onye ahụ kpamkpam.
theological_decisions:
- issue: Ma παραλαμβάνεται ọ na-egosi na a kpọrọ mmadụ maka nzọpụta ka ọ bụ maka ikpe
  choice: E ji okwu na-anọpụ iche, ‘a ga-akpọrọ otu,’ mee ihe n’ahịrịokwu bụ isi.
  alternative: Ịsụgharị ya ka ọ pụta ìhè na a napụtara onye ahụ, ma ọ bụ na a kpọrọ ya gaa n’ikpe.
  rationale: Ihe gbara amaokwu a gburugburu na-enye ohere maka nghọta abụọ ahụ; nsụgharị ekwesịghị iji otu usoro nkà mmụta banyere ihe ikpeazụ ga-eme kpebie ihe ngwaa ahụ n’onwe ya na-ekpebighị.
- issue: Ma a ga-eme ka o doo anya na mmadụ abụọ ahụ bụ ndị ikom
  choice: ndị ikom abụọ
  alternative: ndị abụọ
  rationale: Ụdị nwoke nke εἷς ... εἷς na ihe atụ ụmụ nwanyị nke na-esochi ya na-akwado ime ka ọdịiche nwoke na nwanyị dị n’ebe a pụta ìhè.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù mee ihe. Nhazi ‘a ga-akpọrọ ... a hapụkwa ...’ na-eme ka ọdịiche dị n’ahịrị Grik pụta nke ọma ma na-edebe onye na-eme omume ahụ n’amaghị ama dịka ihe odide mbụ si dị.
