  rationale: The revision preserves the verse's two future actions and its open-ended warning about deception, while using smoother Standard Igbo coordination. It also relocates each footnote marker to its corresponding lexical decision. The passive alternative for ἐγερθήσονται remains explicitly available without asserting who would cause the false prophets to arise.
