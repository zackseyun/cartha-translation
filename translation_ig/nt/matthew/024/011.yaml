    rationale: The two Greek καί conjunctions simply coordinate the clauses. Repeating -kwa on both future verbs introduces an unnecessary emphatic/additive nuance and makes the sentence less idiomatic.
  - severity: low
    issue: Footnote anchors occur only at the end of the sentence
    rationale: Footnote a concerns “ga-eduhie,” while footnote b concerns “ga-ebili.” Placing each marker directly after its relevant expression makes the audit trail and lexical alternatives unambiguous.
