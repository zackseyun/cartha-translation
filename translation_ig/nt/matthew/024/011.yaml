  source_fidelity: The main rendering accurately conveys πολλοὶ ψευδοπροφῆται ('many false prophets'), ἐγερθήσονται in its contextual sense ('will arise'), and πλανήσουσιν πολλούς ('will mislead/deceive many'). The passive morphology of ἐγερθήσονται is appropriately retained as an alternative rather than made an explicit claim about an unnamed agent.
  naturalness: The draft is understandable Standard Igbo, but the paired enclitic -kwa forms in “ga-ebilikwa, ha ga-eduhiekwa” are somewhat heavy and do not naturally represent the Greek's simple coordination. A direct coordinated clause is smoother. Footnote markers should be placed immediately after the words to which their alternatives apply.
  terminology: “Ndị amụma ụgha” is the established, clear term for ψευδοπροφῆται. “Ga-eduhie ọtụtụ mmadụ” naturally communicates the broad sense of πλανήσουσιν without narrowing the type of deception.
  issues:
