  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: ig
  text: Ọtụtụ ndị amụma ụgha ga-ebili[b], ha ga-eduhie ọtụtụ mmadụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ga-aghọgbu ọtụtụ mmadụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a ga-eme ka ọtụtụ ndị amụma ụgha bilie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: ọtụtụ
  rationale: Ọ bụ okwu Igbo nkịtị na-egosi ọnụ ọgụgụ buru ibu, kwekọrọ kpọmkwem na πολλοὶ.
- source_word: ψευδοπροφῆται
  choice: ndị amụma ụgha
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke a maara nke ọma n'Igbo isi kọwaa ndị na-azọrọ ịbụ ndị amụma ma ha abụghị ezi ndị amụma.
- source_word: ἐγερθήσονται
  choice: ga-ebili
  rationale: N'ọnọdụ a, okwu ahụ pụtara na ndị dị otu a ga-apụta ma malite ịrụ ọrụ; “ga-ebili” na-echekwa ọdịdị okwu Grik ahụ n'ebughị echiche mbilite n'ọnwụ bata.
- source_word: πλανήσουσιν
  choice: ga-eduhie
  rationale: “Iduhie” na-egosi ime ka mmadụ hapụ ụzọ ziri ezi, ma na-ahapụkwa okwu ahụ ka ọ gbasaa ruo n'ụdị aghụghọ nke ozizi, omume, ma ọ bụ nke mmụọ.
- source_word: πολλούς
  choice: ọtụtụ mmadụ
  rationale: Ịtinye “mmadụ” na-eme ka ihe nnọchiaha ahụ doo anya ma bụrụ Igbo e ji eme ihe kwa ụbọchị, n'agbanyeghị na Grik kwuru naanị “ọtụtụ.”
- source_word: καὶ ... καὶ
  choice: -kwa ... -kwa
  rationale: Mgbakwunye “-kwa” n'okwu abụọ ahụ na-egosipụta njikọ ugboro abụọ nke καὶ ... καὶ n'ụzọ dabara n'usoro Igbo.
theological_decisions:
- issue: Ụdị iduhie e kwuru na πλανήσουσιν
  choice: Amaokwu ahụ na-adọ aka ná ntị na ndị amụma ụgha ga-eduhie ọtụtụ mmadụ, n'ekwughị kpọmkwem ụzọ ha ga-esi mee ya ma ọ bụ ókè iduhie ahụ ga-eru.
  alternative: A pụrụ ịghọta ya dị ka iduhie n'ozizi, n'omume, ma ọ bụ n'ihe metụtara oge ikpeazụ.
  rationale: πλανάω nwere nghọta sara mbara; nsụgharị ahụ anaghị eme ka ọ bụrụ naanị otu ụdị iduhie.
- issue: Ume-ngwaa nke ἐγερθήσονται
  choice: “Ga-ebili” ka e ji sụgharịa ya n'ahịrị bụ isi.
  alternative: “A ga-eme ka ha bilie.”
  rationale: Ụdị Grik bụ nke nnara-eme, ma n'ọnọdụ a ọ pụkwara ịbụ okwu e ji akọ na ndị ahụ ga-apụta. Ihe odide ahụ ekwughị onye ga-eme ka ha bilie, ya mere e tinyere ọdịiche ahụ n'ala peeji kama ikpebi ya n'ụzọ nkọwa okpukpe.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrị ahụ na-agbaso usoro Grik nke omume abụọ jikọrọ ọnụ, ebe nkọwa ala peeji na-echekwa nhọrọ okwu ndị bụ́ eziokwu n'asụsụ mmalite.
