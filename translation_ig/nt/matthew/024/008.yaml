translation:
  language: ig
  text: Ma ihe ndị a niile bụ mmalite nke ihe mgbu ịmụ nwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya “mgbu ọmụmụ nwa” ma ọ bụ “ihe mgbu nwaanyị na-enwe mgbe ọ na-amụ nwa.” Okwu Grik ji ihe mgbu ịmụ nwa mee ihe atụ nke ogbo mbụ nke ahụhụ na-abịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: niile
  rationale: Ya na “ihe ndị a” jikọtara ọnụ, ọ na-egosi ihe niile e kwuru n’amaokwu ndị bu ụzọ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche site n’ihe ndị e depụtara gaa na nkọwa Jizọs banyere ha.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Ọ na-ezo aka n’ihe ndị a kpọtụrụ aha tupu amaokwu a, ma bụrụkwa okwu doro anya ma bụrụ ihe e ji eme ihe n’Igbo ugbu a.
- source_word: ἀρχὴ
  choice: mmalite
  rationale: Ọ na-egosi ogbo mbụ nke usoro ga-aga n’ihu, ọ bụghị njedebe ya.
- source_word: ὠδίνων
  choice: ihe mgbu ịmụ nwa
  rationale: Nke a na-edowe ihe atụ Grik nke ihe mgbu nwaanyị na-enwe mgbe ọ na-amụ nwa, n’asụsụ Igbo doro anya ma dịkwa mma.
theological_decisions:
- issue: Ike ihe atụ dị na ὠδίνων
  choice: E debere ihe atụ ịmụ nwa dịka “ihe mgbu ịmụ nwa.”
  alternative: “ahụhụ” ma ọ bụ “nsogbu”
  rationale: Isi mmalite ahụ na-egosi na ọgba aghara ndị a bụ mmalite nke usoro ka ukwuu, ọ bụghị njedebe n’onwe ya. Idebe ihe atụ ịmụ nwa na-echekwa esemokwu gbasara ihe ndị ga-abịa n’etinyeghị usoro nkuzi okpukpe kpọmkwem nke amaokwu ahụ na-ekwughị.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, doro anya ma nwee ugwu. E debere usoro dị mkpirikpi nke isi mmalite Grik na ihe atụ ịmụ nwa.
