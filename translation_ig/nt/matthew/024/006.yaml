id: MAT.24.6
reference: Matthew 24:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: ig
  text: Unu ga-anụkwa banyere agha na akụkọ banyere agha[a]. Lezienụ anya ka ụjọ ghara ịtụ unu, n’ihi na ọ ghaghị ime, ma ọgwụgwụ erubeghị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “asịrị banyere agha.” Okwu Grik ahụ nwere ike ịpụta akụkọ, ozi, ma ọ bụ asịrị.
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε
  choice: Unu ga-
  rationale: Ụdị ọdịnihu a na-egosi ihe a na-atụ anya na ọ ga-eme; “unu ga-anụ” bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo ya.
- source_word: ἀκούειν
  choice: anụ banyere
  rationale: N’ebe a, okwu ahụ pụtara ịnụ ozi gbasara ihe, ọ bụghị naanị ịnụ ụda kpọmkwem.
- source_word: πολέμους
  choice: agha
  rationale: πόλεμος na-ezo aka n’agha, ọ bụghị naanị otu ọgụ.
- source_word: ἀκοὰς πολέμων
  choice: akụkọ banyere agha
  rationale: ἀκοή nwere ike ịpụta akụkọ, ozi, ma ọ bụ asịrị. “Akụkọ banyere agha” sara mbara, gharakwa ikwu na ozi ahụ bụ ụgha.
- source_word: ὁρᾶτε, μὴ θροεῖσθε
  choice: Lezienụ anya ka ụjọ ghara ịtụ unu
  rationale: Nkebi a bụ ịdọ aka ná ntị ka ndị na-ege ntị ghara ịma jijiji ma ọ bụ daba n’ụjọ.
- source_word: δεῖ γὰρ γενέσθαι
  choice: n’ihi na ọ ga-emerịrị
  rationale: δεῖ na-egosi mkpa ma ọ bụ ihe a na-apụghị izere ezere; “ọ ga-emerịrị” na-edobe nnọchiaha na-enweghị ịgbakwụnye “ihe ndị a” n’ahịrị Grik.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: ma ọgwụgwụ erubeghị
  rationale: Nke a bụ Igbo dị nkenke ma dị mma nke na-edobe echiche na ọgwụgwụ ahụ abịabeghị.
theological_decisions:
- issue: Ihe τὸ τέλος (“ọgwụgwụ”) na-ezo aka na ya
  choice: ọgwụgwụ
  alternative: mmezu ikpeazụ
  rationale: A hapụrụ okwu ahụ ka ọ saa mbara dịka ọ dị n’asụsụ Grik, n’ejikọghị ya na usoro nkọwa pụrụ iche banyere ihe ndị ga-eme n’oge ikpeazụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, kwanyere ùgwù ma dị mfe nghọta. E ji “unu” mee ihe n’ihi na ngwaa Grik dị n’ọnụọgụ ọtụtụ.
