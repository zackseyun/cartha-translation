    text: Ma ọ bụ, “asịrị banyere agha.” Okwu Grik ahụ nwere ike ịpụta akụkọ, ozi, ma ọ bụ asịrị.
    reason: lexical_alternative
  revision_rationale: Replaced “ọ ga-emerịrị” with “ọ ghaghị ime” to express the present necessity of δεῖ without supplying an explicit subject. Moved the sole footnote to “akụkọ banyere agha” and revised it to preserve the audited lexical alternative for ἀκοὰς πολέμων. No interpretive expansion of “ọgwụgwụ” has been introduced.
