revisions:
- from: Unu ga-anụkwa banyere agha na akụkọ banyere agha. Lezienụ anya ka ụjọ ghara ịtụ unu[a], n’ihi na ọ ga-emerịrị, ma ọgwụgwụ erubeghị.
  to: Unu ga-anụkwa banyere agha na akụkọ banyere agha[a]. Lezienụ anya ka ụjọ ghara ịtụ unu, n’ihi na ọ ghaghị ime, ma ọgwụgwụ erubeghị.
  rationale: Replaced “ọ ga-emerịrị” with “ọ ghaghị ime” to express the present necessity of δεῖ without supplying an explicit subject. Moved the sole footnote to “akụkọ banyere agha” and revised it to preserve the audited lexical alternative for ἀκοὰς πολέμων. No interpretive expansion of “ọgwụgwụ” has been introduced.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:42Z'
review_pass:
  verdict: revise
  source_fidelity: The rendering of wars, reports of wars, the warning against alarm, necessity, and the not-yet end is substantially faithful. However, «ọ ga-emerịrị» casts δεῖ as a future obligation ('it will have to happen') rather than the present statement of necessity, 'it must happen.' The audit-trail lexical alternative for ἀκοὰς πολέμων should also be anchored to the phrase translated 'akụkọ banyere agha,' not to the warning against alarm.
  naturalness: The revised wording is natural Standard Igbo. “Lezienụ anya ka ụjọ ghara ịtụ unu” is an understandable, appropriately direct plural warning. “Ọ ghaghị ime” idiomatically conveys that the event is necessary to occur.
  terminology: “Agha,” “akụkọ banyere agha,” and “ọgwụgwụ” are suitable and preserve the breadth of the Greek, including its eschatological restraint. “Asịrị banyere agha” is an appropriate footnoted alternative for 'rumors of wars.'
  issues:
  - severity: medium
    issue: Tense/aspect of δεῖ γὰρ γενέσθαι
    rationale: '“Ọ ga-emerịrị” naturally suggests future necessity. The Greek δεῖ is present (''it is necessary/must'') with an aorist infinitive: ''it must happen.'' “Ọ ghaghị ime” more closely preserves this force.'
  - severity: medium
    issue: Footnote anchor and content do not correspond to the audited lexical alternative
    rationale: The supplied English audit footnote concerns ἀκοὰς πολέμων ('reports/rumors of wars'), whereas the draft places [a] after the rendering of μὴ θροεῖσθε and gives a different alternative. The marker should follow “akụkọ banyere agha” and note “asịrị banyere agha.”
  revised_text: Unu ga-anụkwa banyere agha na akụkọ banyere agha[a]. Lezienụ anya ka ụjọ ghara ịtụ unu, n’ihi na ọ ghaghị ime, ma ọgwụgwụ erubeghị.
  revised_footnotes:
