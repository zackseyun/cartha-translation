  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: ig
  text: Ma banyere ụbọchị ahụ na awa ahụ, ọ dịghị onye maara—ọbụnadị ndị mmụọ ozi nke eluigwe, ma ọ bụ Ọkpara ahụ—naanị Nna maara ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ ihe odide oge ochie enweghị okwu ndị a: “ma ọ bụ Ọkpara ahụ.” Isi ederede a na-agbaso ọgụgụ SBLGNT.'
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Ma banyere
  rationale: “Banyere” na-ewebata isiokwu a na-ekwu maka ya, ebe “Ma” na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n’ihe e kwuru tupu ya.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: ụbọchị ahụ na oge awa ahụ
  rationale: Nke a na-egosi kpọmkwem ụbọchị na oge a na-ekwu maka ha. Ikwughachi “ahụ” na-eme ka okwu ahụ doo anya ma bụrụkwa nke e ji asụ Igbo n'ụzọ dị mma.
- source_word: οὐδεὶς οἶδεν
  choice: ọ dịghị onye maara ya
  rationale: Nke a na-egosipụta ngọnarị zuru ezu nke οὐδείς, ebe “maara” na-enye echiche nke οἶδα dị ka ịma ihe.
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: ọbụna ndị mmụọ ozi nke eluigwe amaghị ya
  rationale: “Ọbụna” na-ebute ike nkwusi okwu dị na οὐδέ, ebe “ndị mmụọ ozi nke eluigwe” na-egosipụta τῶν οὐρανῶν n’Igbo doro anya.
- source_word: οὐδὲ ὁ υἱός
  choice: Ọkpara ahụ amaghịkwa ya
  rationale: “Ọkpara ahụ” na-edebe aha nsọpụrụ a kpọmkwem, “-kwa” na-ejikọkwa ya na ndị ọzọ a sịrị na ha amaghị. E belataghị ma ọ bụ kọwaa esemokwu nkà mmụta okpukpe dị n’okwu a.
- source_word: εἰ μὴ ὁ πατὴρ μόνος
  choice: naanị Nna maara ya
  rationale: N’usoro ngọnarị a, εἰ μή pụtara iwepụ onye ọzọ niile; “naanị Nna” na-egosipụta kpọmkwem na ọ bụ naanị Nna maara.
theological_decisions:
- issue: Ihe okwu “Ọkpara ahụ amaghịkwa ya” pụtara banyere Kraịst
  choice: E debere okwu ahụ n’isi ederede n’enweghị ime ka ọ dị nro ma ọ bụ tinye nkọwa n’ime amaokwu ahụ.
  alternative: Ịhapụ okwu ahụ n’ihi ọdịiche dị n’ihe odide ụfọdụ, ma ọ bụ ịkọgharị ya ka esemokwu banyere ịbụ Chineke nke Ọkpara ghara ịpụta.
  rationale: SBLGNT nwere οὐδὲ ὁ υἱός. Nsụgharị kwesịrị idobe ihe isi mmalite kwuru ma hapụ esemokwu nkà mmụta okpukpe ahụ ka ọ dị, kama idozi ya site n’ịhapụ okwu ma ọ bụ n’ịkọgharị ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke kwụ ọtọ ma dị ùgwù. Ikwughachi “amaghị ya” na-eme ka usoro ndị a kpọrọ aha doo ndị na-agụ akwụkwọ anya ma na-edebe nkwusi okwu nke Grik.
