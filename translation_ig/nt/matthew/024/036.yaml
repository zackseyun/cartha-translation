review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal sense, including the SBLGNT reading that the Son does not know. However, its textual-variant note inaccurately identifies the variant as the longer Igbo clause rather than the Greek phrase ‘nor the Son.’ The revision corrects this and presents the negative coordination more directly.
  naturalness: The repeated ‘amaghị ya’ is understandable but unnecessarily heavy. ‘Ụbọchị ahụ na awa ahụ’ is more idiomatic and precise than ‘ụbọchị ahụ na oge awa ahụ.’ The revised sentence is fluent Standard Igbo while retaining the source’s emphatic sequence.
  terminology: ‘Ọkpara ahụ’ is retained as the established reverential rendering of the titular ‘the Son’; ‘Nna’ is appropriately capitalized as a divine title. No doctrinal interpretation has been added.
  issues:
  - severity: medium
    issue: The textual-variant footnote quotes an expanded clause rather than the words actually omitted in the variant.
    rationale: The SBLGNT variant concerns οὐδὲ ὁ υἱός (‘nor the Son’), not the supplied Igbo repetition ‘Ọkpara ahụ amaghịkwa ya.’ A textual note should identify the variant faithfully.
  - severity: low
    issue: ‘oge awa’ is redundant and less natural in this context.
    rationale: ‘Awa’ alone normally conveys ‘hour’; ‘ụbọchị ahụ na awa ahụ’ is clear and idiomatic.
  - severity: low
    issue: The repetitive negative clauses make the sentence more cumbersome than necessary.
    rationale: Igbo can preserve the Greek list and its emphasis without repeating ‘amaghị ya’ after each item.
  revised_text: Ma banyere ụbọchị ahụ na awa ahụ, ọ dịghị onye maara—ọbụnadị ndị mmụọ ozi nke eluigwe, ma ọ bụ Ọkpara ahụ—naanị Nna maara ya.[a]
