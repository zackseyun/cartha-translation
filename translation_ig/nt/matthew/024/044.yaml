- from: N’ihi nke a, unu onwe unu kwesịkwara ịdị njikere, n’ihi na Nwa nke Mmadụ ga-abịa n’oge awa unu na-atụghị anya ya.[a]
  to: Ya mere, unu kwa, nọnụ njikere, n’ihi na Nwa nke Mmadụ ga-abịa n’awa unu na-atụghị anya ya.[a]
  rationale: The revision removes the non-idiomatic duplication in the temporal phrase and uses a natural Igbo imperative. It preserves the Greek causal relationship, the inclusive force of καὶ ὑμεῖς, the warning’s ongoing readiness sense, the unexpected-hour ambiguity, and the traditional christological title. The footnote is revised for clear, natural Igbo while retaining the lexical alternative.
