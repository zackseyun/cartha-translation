review_pass:
  verdict: revise
  source_fidelity: The draft conveys the causal inference, inclusive emphasis, readiness command, unexpected hour, established title «Nwa nke Mmadụ», and future-oriented coming accurately. However, «n’oge awa» redundantly combines two temporal nouns and is not idiomatic Standard Igbo.
  naturalness: Replace «n’oge awa» with «n’awa». Also, «unu onwe unu kwesịkwara ịdị njikere» is heavier and less direct than a natural plural imperative; «unu kwa, nọnụ njikere» preserves the inclusion/emphasis and expresses the command smoothly.
  terminology: «Nwa nke Mmadụ» is retained as the conventional literal rendering of ὁ υἱὸς τοῦ ἀνθρώπου. «ga-abịa» appropriately communicates the futuristic force of ἔρχεται in idiomatic Igbo.
  issues:
  - severity: medium
    issue: Redundant temporal expression
    rationale: «n’oge awa» is an unnatural duplication (‘at the time hour’). The Greek ὥρᾳ is adequately and naturally rendered «n’awa».
  - severity: low
    issue: Awkward imperative phrasing
    rationale: «unu onwe unu kwesịkwara ịdị njikere» is understandable but cumbersome. «unu kwa, nọnụ njikere» is a more natural direct plural command while retaining καὶ ὑμεῖς.
  - severity: low
    issue: Footnote’s Igbo lexical alternatives are awkward
    rationale: «ịtụgharị uche na ọ dị otú ahụ» is not a suitable concise lexical explanation of δοκεῖτε. The note should give clear Igbo alternatives and make the implied object explicit in the alternative rendering.
  revised_text: Ya mere, unu kwa, nọnụ njikere, n’ihi na Nwa nke Mmadụ ga-abịa n’awa unu na-atụghị anya ya.[a]
  revised_footnotes:
