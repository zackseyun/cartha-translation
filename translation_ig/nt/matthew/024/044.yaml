  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: ig
  text: Ya mere, unu kwa, nọnụ njikere, n’ihi na Nwa nke Mmadụ ga-abịa n’awa unu na-atụghị anya ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’awa unu na-adịghị eche na ọ ga-abịa.” Ngwaa Grik ahụ pụrụ ịpụta “iche,” “ichepụta,” ma ọ bụ, dịka ọnọdụ okwu a si dị, “ịtụ anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Nkebi okwu a na-ezo aka n’ịdọ aka ná ntị gara aga ma na-egosi ihe kpatara iwu a; ọ bụkwa okwu Igbo doro anya ma kwekọọ n’echiche inferential-causal nke Grik.
- source_word: καὶ ὑμεῖς
  choice: unu onwe unu kwesịkwara
  rationale: “Unu onwe unu” na-echekwa nkwusi ike nke nnọchiaha pụtara ìhè, ebe “-kwa” na-egosi echiche nke καί, ya bụ, ‘unu kwa.’
- source_word: γίνεσθε ἕτοιμοι
  choice: kwesịkwara ịdị njikere
  rationale: “Ịdị njikere” bụ ụzọ Igbo e si egosipụta ọnọdụ a na-achọ ka ọ na-aga n’ihu; “kwesịrị” na-ebupụta ike iwu ahụ n’asụsụ Igbo dị mma karịa nsụgharị nkịtị dịka ‘ghọọ ndị dị njikere.’
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a ὅτι na-enye ihe kpatara iwu ahụ, ya mere “n’ihi na” na-egosipụta njikọ causal ahụ nke ọma.
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: n’oge awa unu na-atụghị anya ya
  rationale: Nkebi a bụ okwu oge pụtara ‘n’awa nke unu na-echeghị/na-atụghị anya ya.’ “Na-atụghị anya” bụ okwu Igbo ebumpụta ụwa n’ọnọdụ ịdọ aka ná ntị a, ebe e debere ihe ọzọ okwu Grik ahụ nwere ike ịpụta n’ala peeji.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a bụ nsụgharị kpọmkwem nke aha ahụ, na-echekwa ọdịdị okwu ya na njikọ ya na Daniel, n’ebughị ụzọ kọwaa ihe omimi Kraịst dị n’ime ya.
- source_word: ἔρχεται
  choice: ga-abịa
  rationale: Ọ bụ ezie na Grik ji present mee ihe n’ụzọ na-ele ọdịnihu anya, “ga-abịa” bụ ụzọ Igbo kacha doo anya ma dị mma isi gosipụta ọbịbịa a ka ga-eme, na-enweghị ịgbanwe isi ihe okwu ahụ pụtara.
theological_decisions:
- issue: Nsụgharị aha Kraịst ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: “Nwa nke Mmadụ” na-echekwa okwu aha ahụ n'ụzọ nkịtị, ụda Daniel dị n’azụ ya, na ojiji ya siri ike n’Oziọma ndị ahụ. Nhọrọ ọzọ ga-akọwakarị ya nke ukwuu ma mee ka omimi nkà mmụta okpukpe ya dị larịị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “n’oge awa” iji chekwaa ὥρᾳ n’enweghị okwu siri ike, ma e ji “unu onwe unu” chekwaa nkwusi ike dị na καὶ ὑμεῖς.
