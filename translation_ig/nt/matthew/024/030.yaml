id: MAT.24.30
reference: Matthew 24:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: ig
  text: Mgbe ahụ, ihe ịrịba ama nke Nwa nke Mmadụ ga-apụta n'eluigwe[a]. Mgbe ahụ, ebo niile nke ụwa ga-eru uju[b], ha ga-ahụkwa Nwa nke Mmadụ ka ọ na-abịa n'elu igwe ojii nke eluigwe[c], n'ike na n'ebube dị ukwuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “na mbara igwe.” Okwu Gris οὐρανός nwere ike ịpụta “eluigwe” ma ọ bụ “mbara igwe,” dịka ọnọdụ okwu si dị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “ebo niile nke ala ahụ.” Okwu Gris γῆ nwere ike ịpụta “ụwa” ma ọ bụ “ala.”
    reason: alternative_reading
  - marker: c
    text: Okwu ahụ bụ́ “na-abịa n'elu igwe ojii nke eluigwe” na-eme ka a cheta Daniel 7:13.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: ga-apụta
  rationale: Ọ na-egosi na ihe ahụ ga-apụta ìhè ma bụrụ nke a pụrụ ịhụ; ‘ga-apụta’ bụ okwu Igbo doro anya ma kwekọọ n'ọrụ ngwaa a ebe a.
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: Nke a bụ ntụgharị Igbo kachasị nghọta maka ‘akara’ ma ọ bụ ‘ihe na-egosi’ ihe, n'ebughị ụzọ kọwaa kpọmkwem ụdị ihe ịrịba ama ahụ.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: nke Nwa nke Mmadụ
  rationale: E debere njikọ genitive ahụ ka o wee ghara ikpebi ma ọ bụ ihe ịrịba ama metụtara ya ka a na-ekwu, ma ọ bụ ya onwe ya bụ ihe ịrịba ama ahụ.
- source_word: ἐν τῷ οὐρανῷ
  choice: n'eluigwe
  rationale: οὐρανός nwere ike ịpụta eluigwe ma ọ bụ mbara igwe. ‘N'eluigwe’ na-echekwa ụda okwu ọhụụ ikpeazụ dị n'amaokwu ahụ; ihe odide ala peeji na-egosi nhọrọ ọzọ.
- source_word: κόψονται
  choice: ga-eru uju
  rationale: N'okwu a, ngwaa ahụ na-ezo aka n'iru uju ma ọ bụ ịkwa arịrị, ọ bụghị nanị iti mmadụ ihe. ‘Ga-eru uju’ bụ Igbo eke ma doro anya.
- source_word: φυλαὶ
  choice: ebo
  rationale: φυλή pụtara ebo ma ọ bụ agbụrụ. ‘Ebo’ na-anọgide nso n'okwu Gris ma na-echekwa ụda amaokwu amụma ndị e zoro aka na ha.
- source_word: τῆς γῆς
  choice: nke ụwa
  rationale: N'ihi ọnọdụ sara mbara nke ihe ndị dị n'eluigwe na ụwa ebe a, ‘ụwa’ bụ nhọrọ bụ isi; ma ‘ala ahụ’ ka bụ nhọrọ nwere ike ịdị, ya mere e tinyere ya n'ihe odide ala peeji.
- source_word: ὄψονται
  choice: ha ga-ahụkwa
  rationale: Nke a na-asụgharị ọdịnihu nke ὁράω n'ụzọ dị mfe ma bụrụ Igbo a na-asụ ugbu a.
- source_word: ἐρχόμενον
  choice: ka ọ na-abịa
  rationale: Ụdị a na-echekwa echiche nke Nwa nke Mmadụ nọ n'omume ịbịa.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: n'elu igwe ojii nke eluigwe
  rationale: Nke a na-echekwa ihe onyonyo nke ịbịa n'elu igwe ojii nakwa njikọ ya na Daniel 7:13.
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: n'ike na n'ebube dị ukwuu
  rationale: Nke a na-edebe ‘dị ukwuu’ ka ọ kọwaa ebube kpọmkwem, dịka nhazi okwu Gris si dị, ma bụrụkwa Igbo dị mma.
theological_decisions:
- issue: Ihe ‘ihe ịrịba ama nke Nwa nke Mmadụ’ pụtara
  choice: E debere ya dịka ‘ihe ịrịba ama nke Nwa nke Mmadụ.’
  alternative: ‘Ihe ịrịba ama nke bụ nke Nwa nke Mmadụ’ ma ọ bụ ‘ihe ịrịba ama ahụ, ya bụ Nwa nke Mmadụ n'onwe ya.’
  rationale: Okwu Gris anaghị amanye otu nkọwa naanị; ntụgharị ahụ echekwala mgbagwoju anya a kama ikpebi nkọwa eskatọlọjị a na-arụ ụka banyere ya.
- issue: Oke γῆ n'okwu ‘ebo niile nke ụwa’
  choice: A sụgharịrị γῆ dịka ‘ụwa’ n'ahịrị bụ isi.
  alternative: ‘Ala ahụ.’
  rationale: Ọnọdụ amaokwu ahụ gbasara ihe eluigwe na ụwa ma na-akwado nghọta zuru ụwa ọnụ, ma ntụaka nwere ike ịdị n'ala Izrel ka e debere n'ihe odide ala peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. A họọrọ ‘Nwa nke Mmadụ’ dịka aha nsọ a maara nke ọma; e zere okwu ụka pụrụ iche na nkọwa na-ekpebi ihe Gris hapụrụ ka ọ bụrụ ihe nwere nkọwa karịa otu.
