    text: Ma ọ bụ, “n’ụlọ nkwakọba ihe” ma ọ bụ “n’ime ụlọ nzuzo.” Okwu Grik ahụ nwere ike ịpụta ụlọ dị n’ime, ụlọ nzuzo, ma ọ bụ ụlọ nkwakọba ihe.
    reason: lexical_alternative
  revision_rationale: The revision removes an unstated directional nuance from the first prohibition and replaces a repetitive expression for the inner rooms with natural Standard Igbo. It retains the source’s parallel clauses, its unspecified implied subject, and the lexical breadth of ταμεῖα through the footnote.
