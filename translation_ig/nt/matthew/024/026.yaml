id: MAT.24.26
reference: Matthew 24:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: ig
  text: N’ihi ya, ọ bụrụ na ha asị unu, ‘Lee, ọ nọ n’ọzara,’ unu apụla; ‘Lee, ọ nọ n’ụlọ ndị dị n’ime,’ unu ekwela ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ụlọ nkwakọba ihe” ma ọ bụ “n’ime ụlọ nzuzo.” Okwu Grik ahụ nwere ike ịpụta ụlọ dị n’ime, ụlọ nzuzo, ma ọ bụ ụlọ nkwakọba ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: N’ihi ya, ọ bụrụ na
  rationale: “N’ihi ya” na-egosi njikọ nkwubi okwu nke οὖν na ịdọ aka ná ntị gara aga, ebe “ọ bụrụ na” na-edobe ọnọdụ nke ἐὰν.
- source_word: εἴπωσιν ὑμῖν
  choice: ha asị unu
  rationale: E ji “ha” hapụ onye na-ekwu okwu ka ọ bụrụ ndị a na-akọwaghị kpọmkwem, dịka ngwaa Grik nke onye nke atọ n’ọnụọgụ ọtụtụ.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: “Lee” bụ okwu Igbo dị ugbu a nke na-adọta uche ozugbo n’enweghị ụda ochie gabiga ókè.
- source_word: ἐν τῇ ἐρήμῳ
  choice: n’ọzara
  rationale: “Ọzara” nwere ike ịpụta ala tọgbọrọ chakoo ma ọ bụ ebe mmadụ na-ebighị, ya mere ọ dabara na obosara ihe ἔρημος pụtara.
- source_word: ἐστίν
  choice: ọ nọ
  rationale: Igbo chọrọ isiokwu doro anya; “ọ” na-ezo aka n’onye a na-ekwu na ọ bịara, ma etinyeghị aha dịka Kraịst nke Grik ekwughị n’ahịrịokwu a.
- source_word: μὴ ἐξέλθητε
  choice: unu apụla gaa
  rationale: Nke a na-egosi iwu ka ha ghara ịpụ gaa ebe ahụ, ma na-edobe echiche mmegharị dị na ἐξέρχομαι.
- source_word: ἐν τοῖς ταμείοις
  choice: n’ime ụlọ ndị dị n’ime ime
  rationale: Nhọrọ a na-egosi ụlọ dị n’ime ma ọ bụ nke nzuzo n’etinyeghị naanị echiche ụlọ nkwakọba ihe.
- source_word: μὴ πιστεύσητε
  choice: unu ekwela ya
  rationale: “Ya” na-ezo aka n’ozi ahụ a kọrọ, ọ bụghị na ndị kwuru ya; nke a bụ ụzọ Igbo si ekwu ya nke ọma.
theological_decisions:
- issue: Onye ἐστίν na-ezo aka na ya
  choice: E dere “ọ nọ” n’etinyeghị aha ma ọ bụ ọkwa onye ahụ.
  alternative: “Kraịst nọ” ma ọ bụ “ọ nọ ebe ahụ”
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi onye a na-azọrọ na ọ bịara, ma Grik hapụrụ isiokwu ahụ n’amaghị aha; ntụgharị ahụ na-echekwa nke a ma ghara ịkọwa ya karịa isi mmalite.
- issue: Njikọ nke ihe atụ abụọ ahụ
  choice: E debere ha dị ka okwu abụọ yiri ibe ha n’okpuru otu ọnọdụ, jiri semicolon kewaa ha.
  alternative: Itinye “ma ọ bụ” tupu “Lee” nke abụọ
  rationale: Grik kwughachiri Ἰδοὺ n’enweghị okwu pụtara “ma ọ bụ”; semicolon na-echekwa nhazi yiri ibe ya n’etinyeghị njikọ na-adịghị na isi mmalite.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E ji “unu” mee ka okwu ahụ e kwuru nye ọtụtụ mmadụ doo anya. A họọrọ “ọzara” dịka okwu sara mbara; e debere nkọwa ndị ọzọ nke ταμεῖον n’ala peeji kama ịmanye otu nghọta n’ahịrịokwu.
