revisions:
- from: N’ihi ya, ọ bụrụ na ha asị unu, ‘Lee, ọ nọ n’ọzara,’ unu apụla gaa; ‘Lee, ọ nọ n’ime ụlọ ndị dị n’ime ime,’ unu ekwela ya.[a]
  to: N’ihi ya, ọ bụrụ na ha asị unu, ‘Lee, ọ nọ n’ọzara,’ unu apụla; ‘Lee, ọ nọ n’ụlọ ndị dị n’ime,’ unu ekwela ya.[a]
  rationale: The revision removes an unstated directional nuance from the first prohibition and replaces a repetitive expression for the inner rooms with natural Standard Igbo. It retains the source’s parallel clauses, its unspecified implied subject, and the lexical breadth of ταμεῖα through the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:43:12Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the inferential conditional, the indefinite plural speakers, the two parallel reported locations, and the prohibitions. The implicit subject is appropriately represented by “ọ,” without adding a christological title. A minor wording revision better reflects ἐξέλθητε without the added directional nuance of “gaa.”
  naturalness: “Unu apụla gaa” is somewhat redundant and adds “go [there],” which is not stated. “Unu apụla” is more direct. “N’ime ụlọ ndị dị n’ime ime” is repetitive and unnatural in modern Standard Igbo; “n’ụlọ ndị dị n’ime” is clearer and idiomatic.
  terminology: “Ọzara” is a valid broad rendering of ἐρήμῳ. “Ụlọ ndị dị n’ime” preserves the noncommittal sense of ταμεῖα better than making “secret rooms” the main-text reading. The footnote appropriately records the principal lexical alternatives.
  issues:
  - severity: medium
    issue: Added directional verb in “unu apụla gaa”
    rationale: The Greek prohibition μὴ ἐξέλθητε means “do not go out.” Adding “gaa” can imply going to the alleged location and is unnecessary in Igbo.
  - severity: medium
    issue: Repetitive wording for ταμείοις
    rationale: “N’ime ụlọ ndị dị n’ime ime” repeats the idea of interiority and is awkward. “N’ụlọ ndị dị n’ime” naturally conveys inner rooms while retaining the source ambiguity.
  revised_text: N’ihi ya, ọ bụrụ na ha asị unu, ‘Lee, ọ nọ n’ọzara,’ unu apụla; ‘Lee, ọ nọ n’ụlọ ndị dị n’ime,’ unu ekwela ya.[a]
  revised_footnotes:
