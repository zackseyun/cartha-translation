  edition: SBLGNT
  text: δύο ἀλήθουσαι ἐν τῷ ⸀μύλῳ, μία παραλαμβάνεται καὶ μία ἀφίεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/041.yaml
  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: ig
  text: Ụmụ nwanyị abụọ[a] ga na-egwe ihe n'igwe e ji egwe ihe[b]; a ga-akpọrọ otu, a ga-ahapụkwa otu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘Abụọ ga na-egwe ihe n'igwe e ji egwe ihe.’ Ma ụdị okwu Grik a sụgharịrị ‘ga na-egwe ihe’ bụ nke nwanyị ọtụtụ, ya mere ndị ahụ bụ ụmụ nwanyị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘na nkume igwe’ ma ọ bụ ‘n'igwe aka.’ Okwu Grik ahụ nwere ike ịpụta igwe ahụ dum ma ọ bụ nkume e ji egwe ihe.
    reason: lexical_alternative
  - marker: c
    text: Grik kwuru naanị, ‘a na-akpọrọ otu, a na-ahapụkwa otu.’ N'ebe a, o kwughị kpọmkwem ma ịkpọrọ onye ahụ ọ bụ maka nzọpụta ka ọ bụ maka ikpe.
    reason: alternative_reading
lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: Ụmụ nwanyị abụọ ga na-egwe ihe
  rationale: Okwu ἀλήθουσαι bụ participle nke dị n'ụdị ọtụtụ nke nwanyị, ya mere e kwuru hoo haa na ha bụ ụmụ nwanyị. ‘Ga na-egwe ihe’ na-egosi ọrụ ha ga na-arụ n'oge ihe a kọwara ga-eme, n'ụzọ kwekọrọ na ọnọdụ amaokwu ndị gbara ya gburugburu.
- source_word: ἐν τῷ μύλῳ
  choice: n'igwe e ji egwe ihe
  rationale: μύλος nwere ike ịpụta igwe e ji egwe ihe ma ọ bụ nkume igwe. Nsụgharị a na-egosi ngwa e ji arụ ọrụ ahụ n'emeghị ka ọ bụrụ kpọmkwem karịa ihe Grik kwuru.
- source_word: μία παραλαμβάνεται
  choice: a ga-akpọrọ otu
  rationale: Ụdị okwu na-enweghị onye kpọmkwem na-eme ya na-anọchi passive Grik nke ọma. ‘Akpọrọ’ na-edebe echiche nke iwere onye ahụ, ma ọ naghị ekpebi ma iwere ya ọ bụ maka nzọpụta ka ọ bụ maka ikpe.
- source_word: καὶ μία ἀφίεται
  choice: a ga-ahapụkwa otu
  rationale: ‘-kwa’ na-egosipụta njikọ καὶ, ebe ‘ahapụ’ bụ nsụgharị kwụ ọtọ nke ἀφίεται na-enweghị itinye echiche siri ike dịka ịgbahapụ onye kpamkpam.
theological_decisions:
- issue: Ma a ga-ekwupụta na ndị na-egwe ihe bụ ụmụ nwanyị
  choice: E kwuru ‘Ụmụ nwanyị abụọ’
  alternative: ‘Mmadụ abụọ’ ma ọ bụ ‘abụọ’
  rationale: Ọ bụ ezie na Grik enweghị aha nwanyị n'onwe ya, ụdị nwanyị ọtụtụ nke ἀλήθουσαι na-egosi kpọmkwem na ndị ahụ bụ ụmụ nwanyị.
- issue: Ma ịkpọrọ otu na ịhapụ otu na-egosi nzọpụta ma ọ bụ ikpe
  choice: E debere okwu ndị ahụ n'enweghị nkọwa nke onye a zọpụtara ma ọ bụ onye a mara ikpe
  alternative: Ịsị na a kpọrọ otu gaa na nzọpụta, ma ọ bụ na a kpọrọ otu gaa n'ikpe
  rationale: Amaokwu a n'onwe ya akọwaghị ihe ịkpọrọ onye ahụ na ịhapụ onye nke ọzọ pụtara n'ihe gbasara nzọpụta na ikpe. Ya mere, nsụgharị ahụ na-edebe nghọtahie na esemokwu nkọwa ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe ma dị ugwu. ‘Igwe e ji egwe ihe’ na-enyere onye na-agụ akwụkwọ aka ịghọta ngwa ọrụ ahụ n'enweghị okwu mpaghara pụrụ iche. E tinyere akara nkọwa ala ala [a], [b], na [c] niile n'ahịrị amaokwu ahụ.
