  text: τότε ἐάν τις ὑμῖν εἴπῃ· Ἰδοὺ ὧδε ὁ χριστός, ἤ· Ὧδε, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: ig
  text: Mgbe ahụ, ọ bụrụ na onye ọ bụla asị unu, “Lee, Mesaịa ahụ nọ ebe a!” ma ọ bụ, “Ọ nọ ebe a!” unu ekwela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Na-egosi oge ma jikọta ịdọ aka ná ntị a na okwu ndị bu ya ụzọ.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: ọ bụrụ na onye ọ bụla asị unu
  rationale: Na-echekwa ọnọdụ nwere ike ime na onye a na-akọwaghị kpọmkwem; ọ bụkwa Igbo nkịtị ma doo anya.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Okwu a na-adọta uche onye na-ege ntị; “Lee” bụ okwu Igbo dị mkpirikpi ma dị ndụ.
- source_word: ὧδε
  choice: ebe a
  rationale: Na-egosipụta ebe dị nso n'ụzọ doro anya. N'okwu nke abụọ, a sụgharịrị ya “ebe ahụ” n'ime akpaokwu Igbo “Lee ya ebe ahụ” ka ọdịiche nke nkwupụta ahụ doo anya n'asụsụ Igbo, ọ bụ ezie na Grik ji otu okwu ebe mee ihe ugboro abụọ.
- source_word: ὁ χριστός
  choice: Mesaịa ahụ
  rationale: N'ebe a Χριστός bụ utu aha nke onye e tere mmanụ a na-atụ anya ya, ọ bụghị naanị aha onwe; “ahụ” na-egosipụta article Grik na onye ahụ a maara n'atụmanya.
- source_word: ἤ· Ὧδε
  choice: ma ọ bụ, “Lee ya ebe ahụ!”
  rationale: Grik hapụrụ isiokwu na ngwaa n'ihi na a ghọtara ha. Igbo na-emeju “ya” n'ụzọ eke, ebe “Lee” na-eburu ike nkwupụta kpọmkwem ahụ.
- source_word: μὴ πιστεύσητε
  choice: unu ekwela
  rationale: Iwu machibidoro ndị a na-agwa ikwere nkwupụta ahụ; Igbo nwere ike ịhapụ ihe a ga-ekwere n'ihi na okwu gbara ya gburugburu mere ya ka ọ doo anya.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: Ọ bụ utu aha nke onye nzọpụta e tere mmanụ a na-atụ anya ya n'ọnọdụ a. “Mesaịa” na-eme ka ọrụ ya dị ka utu aha pụta ìhè n'ebughị nkọwa otu ụka pụrụ iche bata.
- issue: Ihe a machibidoro ikwere
  choice: unu ekwela
  alternative: unu ekwela ya
  rationale: Grik ekwughị ihe nnọchiaha dịka “ya”; Igbo na-enweghị object na-ezo n'ụzọ eke aka na nkwupụta ahụ dum ma na-ezere ime ka ọ bụrụ naanị ịghara ikwere otu onye.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Mesaịa” mee ihe dịka utu aha, e jighị okwu ụka pụrụ iche. A haziri nkwupụta nke abụọ ka ọ daa nke ọma n'Igbo, ebe a ka na-echekwa ọdịdị ya dị mkpirikpi na ịdọ aka ná ntị siri ike.
