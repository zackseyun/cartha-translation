id: MAT.24.15
reference: Matthew 24:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: ig
  text: Ya mere, mgbe unu hụrụ ihe arụ nke mbibi[b], nke e kwuru site n’aka Daniel onye amụma, guzo n’ebe dị nsọ[a]—ka onye na-agụ ghọta—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ omenala, “n’ebe nsọ ahụ.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị “ihe arụ nke mbibi” dịka “ihe arụ na-ebute mbibi” ma ọ bụ “ihe arụ nke na-akpata mbibi.” Okwu a na-ekwughachi okwu dị n’akwụkwọ Daniel.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Ya mere, mgbe
  rationale: “Ya mere” na-ejigide njikọ οὖν na okwu ndị bu ụzọ, ebe “mgbe” na-egosipụta ihe ga-eme n’ọdịnihu dịka ὅταν si arụ ọrụ n’ahịrịokwu a.
- source_word: ἴδητε
  choice: unu hụrụ
  rationale: Nke a bụ ntụgharị kwụ ọtọ na nke sitere n’okwu nkịtị maka ụdị ngwaa ὁράω a; “unu” na-egosipụta onye nke abụọ n’ụbara.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: ihe arụ nke ịtọgbọrọ n’efu
  rationale: “Ihe arụ” na-egosipụta ihe a na-asọ oyi n’ebe Chineke nọ, ebe usoro “nke ịtọgbọrọ n’efu” na-echekwa njikọ genitive nke Grik na mgbagwoju anya nke okwu ahụ sitere n’akwụkwọ Daniel.
- source_word: τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου
  choice: nke e kwuru site n’ọnụ Daniel onye amụma
  rationale: “Site n’ọnụ” bụ ụzọ Igbo dị ndụ isi gosipụta Daniel dịka onye e si n’aka ya kwuo amụma ahụ, ma ọ naghị ekwu na ọ bụ ya bụ isi mmalite nke ozi ahụ.
- source_word: ἑστὸς
  choice: ka ọ na-eguzo
  rationale: Nke a na-egosipụta participle nke ἵστημι n’enweghị ịgbakwunye nkọwa dịka ‘e guzobere ya,’ nke gaara akọwa okwu ahụ karịa ihe Grik kwuru.
- source_word: ἐν τόπῳ ἁγίῳ
  choice: n’ebe dị nsọ
  rationale: Okwu a na-adị mma n’Igbo ma na-echekwa na Grik ekwughị kpọmkwem ‘ebe nsọ ahụ’; ọ naghị amanye nghọta na ọ bụ naanị otu akụkụ ụlọ nsọ.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: onye na-agụ ya ghọta nke ọma
  rationale: Nke a na-echekwa ndụmọdụ/ntụziaka dị n’imperative νοείτω ma na-ada ka Igbo nkịtị, doro anya.
theological_decisions:
- issue: Ma ἐν τόπῳ ἁγίῳ ọ na-ekwu kpọmkwem banyere otu ‘ebe nsọ ahụ’ n’ụlọ nsọ
  choice: n’ebe dị nsọ
  alternative: n’ebe nsọ ahụ
  rationale: Ebe ahụ nwere ike ịkpọlite echiche banyere ụlọ nsọ, ma τόπῳ enweghị article na Grik. Ya mere, isi ederede anaghị eme ka ebe ahụ bụrụ kpọmkwem karịa ka isi mmalite si mee; a debere ntụgharị omenala nke kapịrị ọnụ na nkọwa ala peeji.
- issue: Ihe τὸ βδέλυγμα τῆς ἐρημώσεως pụtara kpọmkwem
  choice: ihe arụ nke ịtọgbọrọ n’efu
  alternative: ihe arụ na-akpata ịtọgbọrọ n’efu; ihe arụ nke na-eme ka ebe tọgbọrọ n’efu
  rationale: Usoro a na-echekwa njikọ okwu dị na Grik na ụda sitere na Daniel, kama ikpebi ma genitive ahụ na-akọwa ihe ahụ, ihe ọ na-akpata, ma ọ bụ ihe metụtara ya. Nkọwa ndị ọzọ dị na nkọwa ala peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ okwu amụma ahụ ka o nwee mgbagwoju anya dị n’isi Grik na njikọ ya na Daniel. Etinyere akara [a] n’akụkụ ‘ebe dị nsọ,’ ebe [b] dị n’isi ngwụcha ahịrịokwu iji kwado nkọwa gbasara okwu Daniel ahụ n’enweghị ịkwụsị mmegharị nke isi ederede.
