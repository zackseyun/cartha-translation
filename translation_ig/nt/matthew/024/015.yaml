- from: Ya mere, mgbe unu hụrụ “ihe arụ nke ịtọgbọrọ n’efu,” nke e kwuru site n’ọnụ Daniel onye amụma, ka ọ na-eguzo n’ebe dị nsọ[a]—onye na-agụ ya ghọta nke ọma—[b]
  to: Ya mere, mgbe unu hụrụ ihe arụ nke mbibi[b], nke e kwuru site n’aka Daniel onye amụma, guzo n’ebe dị nsọ[a]—ka onye na-agụ ghọta—
  rationale: Ndozigharị a na-eji “mbibi” mee ka ἐρήμωσις pụta n’Igbo nke oge a n’ụzọ doro anya, n’enweghị ikpebi ma ihe arụ ahụ bụ ihe na-ebibi ma ọ bụ ihe na-akpata mbibi. “Guzo” na-atụgharị participle ἑστὸς n’enweghị itinye onye ma ọ bụ nkọwa ọzọ. E wepụrụ mgbakwunye ndị na-adịghị n’isi Grik n’okwu nne na nna, ma tinye akara b n’akụkụ kpọmkwem okwu ọ na-akọwa.
