  terminology: “Aha m” properly retains the source’s significant name-language without doctrinal paraphrase. “Mba niile” suitably represents πάντων τῶν ἐθνῶν in this context; the footnote responsibly records “ndị mba ọzọ” as a less likely contextual alternative. Footnote markers are correctly placed and the explanatory notes are relevant.
