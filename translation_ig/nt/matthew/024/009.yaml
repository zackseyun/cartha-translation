id: MAT.24.9
reference: Matthew 24:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: ig
  text: Mgbe ahụ, ha ga-enyefe unu ka unu taa ahụhụ[a], ha ga-egbukwa unu; mba niile[b] ga-akpọkwa unu asị n’ihi aha m[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka a kpagbuo unu” ma ọ bụ “ka unu banye ná mkpagbu.” Okwu Grik ahụ nwere ike ịpụta ahụhụ, mmegbu, nsogbu siri ike, ma ọ bụ mkpagbu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “mba niile dị iche iche,” ma ọ bụ, n’agbanyeghị na nke ahụ adịchaghị ka ihe a na-ekwu n’ebe a, “ndị mba ọzọ niile.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “n’ihi aha m”; ya bụ, n’ihi na ha na-eguzosi ike n’akụkụ Jizọs na ihe aha ya nọchiri anya ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi usoro oge n’okwu amụma Jizọs ma na-ada nke ọma n’Igbo.
- source_word: παραδώσουσιν ὑμᾶς
  choice: ha ga-enyefe unu
  rationale: “Nyefee” na-egosi inyefe mmadụ n’aka ma ọ bụ n’ike ndị ọzọ, n’ebughị ụzọ kọwaa ya dị ka ịrara mmadụ nye.
- source_word: εἰς θλῖψιν
  choice: ka unu taa ahụhụ
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụ nke e ji eme ihe maka ahụhụ, mkpagbu, ma ọ bụ nsogbu siri ike; ihe odide ala peeji na-echekwa oke nghọta okwu Grik ahụ.
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: ha ga-egbukwa unu
  rationale: Ọ na-enye ihe ngwaa Grik ahụ pụtara kpọmkwem n’etinyeghị echiche ọzọ dị ka ikpe ọnwụ.
- source_word: ἔσεσθε μισούμενοι
  choice: ga-akpọkwa unu asị
  rationale: Nke a bụ usoro okwu Igbo ebumpụta ụwa nke na-enye echiche nke ịbụ ndị a kpọrọ asị.
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: mba niile
  rationale: Ọ na-echekwa obosara zuru ụwa ọnụ nke πάντων τῶν ἐθνῶν; ọ naghị amanye nghọta dị warara nke “ndị mba ọzọ.”
- source_word: διὰ τὸ ὄνομά μου
  choice: n’ihi aha m
  rationale: Ọ na-echekwa okwu “aha” na ihe kpatara ịkpọ ha asị, n’akọwaghị ihe nnọchianya aha ahụ n’ime amaokwu ahụ.
theological_decisions:
- issue: Oke nghọta θλῖψις n’okwu banyere ihe ndị ga-eme n’ọdịnihu
  choice: ka unu taa ahụhụ
  alternative: ka a kpagbuo unu; banye ná mkpagbu
  rationale: Nhọrọ a na-ada nke ọma n’Igbo ma na-ahapụ θλῖψις ka ọ gụnye nhụjuanya, mmegbu, na mkpagbu siri ike, n’emeghị ya okwu teknụzụ nke otu usoro nkọwa banyere ọgwụgwụ ụwa.
- issue: Ihe ἔθνη pụtara n’ebe a
  choice: mba niile
  alternative: ndị mba ọzọ niile
  rationale: N’ọnọdụ a, okwu ahụ na-egosi mmegide sitere n’ụwa niile karịa nkewa kpọmkwem n’etiti ndị Juu na ndị mba ọzọ.
- issue: Ihe “n’ihi aha m” na-egosi
  choice: E debere okwu ahụ n’ụdị ya kpọmkwem
  alternative: n’ihi na unu bụ ndị nke m
  rationale: Nke a na-echekwa omimi nke echiche Akwụkwọ Nsọ banyere aha Jizọs, ebe ihe odide ala peeji na-akọwa na ọ gụnyere iguzosi ike n’akụkụ ya na ihe aha ya nọchiri anya ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta mee ya. “Unu” na-echekwa onye nke abụọ n’ọnụọgụ ọtụtụ. E kewara ahịrịokwu ahụ site na semicolon ka njikọ dị n’etiti inyefe ha, igbu ha, na ịkpọ ha asị doo anya n’enweghị ahịrịokwu gbagọrọ agbagọ.
