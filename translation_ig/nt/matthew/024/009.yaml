  source_fidelity: 'Igbo text accurately follows the Greek sequence and sense: temporal τότε, handing the plural audience over into θλῖψις, killing them, and their being hated by all nations because of Jesus’ name. “Ha ga-enyefe unu ka unu taa ahụhụ” is an idiomatic rendering of the handing-over-to-affliction construction, while the note appropriately preserves more concrete alternatives such as persecution and tribulation.'
