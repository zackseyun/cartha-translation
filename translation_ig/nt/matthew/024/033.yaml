source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: ig
  text: Otú ahụ ka unu kwa, mgbe unu hụrụ ihe ndị a niile, maranụ na ọ dị nso nʼọnụ ụzọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ nọ nso.” Grik ekwughị onye ma ọ bụ ihe bụ isiokwu ahịrịokwu a kpọmkwem.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Nʼotu aka ahụkwa, unu onwe unu
  rationale: “Nʼotu aka ahụkwa” na-ejikọta okwu a na ihe atụ osisi fig gara aga, ebe “unu onwe unu” na-egosipụta nkwusi ike dị na καὶ ὑμεῖς.
- source_word: ὅταν ἴδητε
  choice: mgbe unu hụrụ
  rationale: Nke a na-egosipụta ọnọdụ oge a na-atụ anya ya nʼọdịnihu, nʼenweghị echiche mmegharị ugboro ugboro.
- source_word: πάντα ταῦτα
  choice: ihe ndị a niile
  rationale: Ọ na-edobe ọtụtụ ihe nke neuter plural Grik nʼụzọ doro anya ma dịkwa eke nʼIgbo.
- source_word: γινώσκετε
  choice: maranụ
  rationale: Ụdị iwu ọtụtụ mmadụ na-echekwa ike nke ntụziaka ahụ karịa okwu ga-akọwa ya dịka naanị ịghọta ma ọ bụ ịmata ihe mgbe ọ pụtara.
- source_word: ἐγγύς
  choice: dị nso
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwụ ọtọ isi gosipụta ịdị nso.
- source_word: ἐπὶ θύραις
  choice: nʼọnụ ụzọ
  rationale: Akpaalaokwu Igbo “nʼọnụ ụzọ” na-egosipụta na ihe ahụ erutela nnọọ nso; iji ọtụtụ “ọnụ ụzọ” nʼebe a agaghị abụ asụsụ Igbo eke, ọ bụ ezie na θύραις bụ ọtụtụ na Grik.
- source_word: ἐγγύς ἐστιν
  choice: ọ dị nso
  rationale: Nnọchiaha Igbo “ọ” anaghị amanye onye ma ọ bụ ihe kpọmkwem dịka isiokwu, ya mere ọ na-echekwa enweghị isiokwu ekwuputara nʼGrik nke ọma.
theological_decisions:
- issue: Isiokwu ezoro ezo nke ἐγγύς ἐστιν
  choice: “ọ dị nso” nʼụzọ na-ahapụghị onye ma ọ bụ ihe ọ na-ezo aka na ya doo anya
  alternative: “ọ nọ nso” ma a ghọta ya dịka “ya onwe ya/nwa nke mmadụ nọ nso”
  rationale: Grik ekwughị isiokwu ahụ kpọmkwem. “Ọ dị nso” na-ahapụ ohere ka okwu ahụ na-ezo aka nʼihe omume ma ọ bụ mmezu dị nso; ihe e dere nʼala peeji na-egosikwa na ọ pụkwara izo aka nʼonye ahụ nʼonwe ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. A họọrọ “maranụ” maka iwu e nyere ọtụtụ mmadụ, “nʼọnụ ụzọ” dịka akpaalaokwu Igbo eke, ma debe mgbagwoju anya nke isiokwu Grik site na “ọ dị nso” na nkọwa ala peeji.
