revisions:
- from: Onye nọkwa n’ọhịa ekwesịghị ịlaghachi azụ ka ọ gaa were uwe mwụda ya[a].
  to: Ka onye nọ n’ọhịa kwa ghara ịlaghachi azụ iwere uwe elu ya[a].
  rationale: The revision corrects the garment term to “uwe elu,” preserves the generic singular subject and urgent prohibition, and renders the purpose relationship of ἆραι naturally as “iwere.” The footnote retains the broader sense of ἱμάτιον without implying that the main rendering is uncertain.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:59Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the generic singular referent and the prohibition against returning for a garment. However, “uwe mwụda” normally denotes a gown, skirt, or flowing dress rather than an outer garment/cloak, and “ka ọ gaa were” unnecessarily introduces a separate ‘go’ action. The revision renders ἱμάτιον as “uwe elu” and expresses the purpose infinitive directly.
  naturalness: “Ka onye nọ n’ọhịa kwa ghara ịlaghachi azụ iwere ...” is idiomatic, clear Standard Igbo. It retains the connective force of καὶ with “kwa,” while avoiding the less precise placement “nọkwa.”
  terminology: “Uwe elu” is the appropriate general Standard Igbo equivalent for an outer garment/cloak in this context. The note preserves the broader lexical alternative, “uwe ya.”
  issues:
  - severity: medium
    issue: “uwe mwụda” is not an accurate equivalent of ἱμάτιον.
    rationale: In current Standard Igbo, it commonly evokes a gown, skirt, or flowing dress, whereas the Greek denotes an outer garment, cloak, or garment generally.
  - severity: low
    issue: “ka ọ gaa were” adds an explicit ‘go’ action.
    rationale: The Greek infinitive ἆραι expresses the purpose of turning back; direct Igbo “iwere” conveys this without adding a separate movement verb.
  - severity: low
    issue: The placement of “kwa” in “nọkwa n’ọhịa” is less natural for the connective function of καὶ.
    rationale: Placing “kwa” after the subject more naturally links this warning with the preceding one.
  revised_text: Ka onye nọ n’ọhịa kwa ghara ịlaghachi azụ iwere uwe elu ya[a].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “uwe ya.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the garment term to “uwe elu,” preserves the generic singular subject and urgent prohibition, and renders the purpose relationship of ἆραι naturally as “iwere.” The footnote retains the broader sense of ἱμάτιον without implying that the main rendering is uncertain.
