  text: καὶ ὁ ἐν τῷ ἀγρῷ μὴ ἐπιστρεψάτω ὀπίσω ἆραι ⸂τὸ ἱμάτιον⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: ig
  text: Ka onye nọ n’ọhịa kwa ghara ịlaghachi azụ iwere uwe elu ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “uwe ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: onye nọ n’ọhịa
  rationale: Nkebiokwu a na-arụ ọrụ dị ka aha onye, na-ezo aka n’otu onye nọ n’ọhịa. “Onye nọ n’ọhịa” bụ Igbo ebumpụta ụwa, ọ naghịkwa eme ka okwu ahụ bụrụ naanị maka nwoke.
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: ekwesịghị ịlaghachi azụ
  rationale: Nke a na-egosipụta iwu mgbochi siri ike n’Igbo dị ugbu a; “ịlaghachi azụ” na-ebute echiche nke ịtụgharị gaa ebe onye si bịa.
- source_word: ἆραι
  choice: ka ọ gaa were
  rationale: Infinitive a na-egosi ebumnuche nke ịlaghachi. “Ka ọ gaa were” na-eme ka mmekọrịta ebumnuche ahụ doo anya n’Igbo n’enweghị ịgbakwunye ihe ọhụrụ.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: uwe mwụda ya
  rationale: Ἱμάτιον na-ezokarị aka n’uwe a na-eyi n’elu uwe ndị ọzọ. “Uwe mwụda” na-enye echiche ahụ n’Igbo, ebe nkọwa ala peeji na-edobe nhọrọ sara mbara nke “uwe.”
theological_decisions:
- issue: Mmekọahụ nwoke/nwanyị n’ahịrịokwu aha nke ji article nwoke
  choice: onye nọ n’ọhịa
  alternative: nwoke nọ n’ọhịa
  rationale: Ọdịdị Grik bụ nke nwoke n’ụtọasụsụ, ma n’ebe a ọ na-anọchi anya onye ọ bụla nọ n’ọnọdụ ahụ. “Onye” na-edobe otu onye ahụ n’enweghị imechi okwu ahụ naanị n’ebe ụmụ nwoke nọ.
translation_notes:
  register: E ji Standard Igbo dị mfe, dị ùgwù, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. E debere ngwa ngwa na ike nke iwu mgbochi ahụ, tinyekwa akara ala peeji [a] n’ahịrị isi.
