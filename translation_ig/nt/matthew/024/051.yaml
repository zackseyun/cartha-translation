  to: Ọ ga-egbutu ya ụzọ abụọ[a], nyekwa ya òkè ya n’etiti ndị ihu abụọ[b]. N’ebe ahụ ka ịkwa ákwá na ịta ikikere ezé ga-adị.
  rationale: A complete revised text is supplied solely to correct eze to ezé in the phrase ‘ịta ikikere ezé.’ This preserves the intended meaning of βρυγμὸς τῶν ὀδόντων and removes ambiguity with eze (‘king’). No change to the translation’s interpretation or source sense is made.
