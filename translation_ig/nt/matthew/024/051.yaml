id: MAT.24.51
reference: Matthew 24:51
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: ig
  text: Ọ ga-egbutu ya ụzọ abụọ[a], nyekwa ya òkè ya n’etiti ndị ihu abụọ[b]. N’ebe ahụ ka ịkwa ákwá na ịta ikikere ezé ga-adị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta ya n’ụzọ akpaalaokwu dịka, “ga-ata ya ahụhụ nke ukwuu.” Ma okwu Grik pụtara n’ụzọ nkịtị, “ga-egbutu ya ụzọ abụọ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “òkè ya n’etiti ndị ihu abụọ”; nke a nwekwara ike ịpụta ebe ma ọ bụ ọnọdụ e kenyere ya n’etiti ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: ga-egbutu ya ụzọ abụọ
  rationale: Nke a na-edobe ihe okwu Grik pụtara kpọmkwem—igbutu mmadụ ụzọ abụọ—na ike ịdọ aka ná ntị dị n’amaokwu ahụ, kama ime ka ọ bụrụ naanị ‘ịta ya ahụhụ nke ukwuu.’
- source_word: μέρος
  choice: òkè ya
  rationale: ‘Òkè’ na-anọgide nso n’echiche bụ isi nke μέρος, ma nwee ike ịpụta ihe ma ọ bụ ọnọdụ e kenyere mmadụ, n’etinyeghị nkọwa karịrị nke isi mmalite kwuru.
- source_word: ὑποκριτῶν
  choice: ndị ihu abụọ
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị na-egosi ezi omume n’èzí ma ezi ọnọdụ ha adịghị otú ahụ; ọ na-echekwa isiokwu Matiu na-ekwukarị.
- source_word: ἐκεῖ
  choice: N’ebe ahụ
  rationale: Ọ na-arụtụ aka n’ebe ma ọ bụ ọnọdụ ikpe ahụ e kwuru okwu ya n’ahịrịokwu gara aga.
- source_word: κλαυθμὸς
  choice: ịkwa ákwá
  rationale: Ọ bụ okwu Igbo doro anya maka ịkwa ákwá, ma dabara n’usoro okwu ikpe a na-emegharị ugboro ugboro na Matiu.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: ịta ikikere eze
  rationale: Nke a bụ akpaalaokwu Igbo na-enye otu ihe oyiyi doro anya nke ịta ma ọ bụ ịkụkọ ezé.
theological_decisions:
- issue: Ma a ga-eme ka διχοτομήσει dị nro ka ọ bụrụ naanị ntaramahụhụ siri ike
  choice: 'Edebere ihe oyiyi ahụ kpọmkwem: ‘ga-egbutu ya ụzọ abụọ.’'
  alternative: ‘ga-ata ya ahụhụ nke ukwuu’
  rationale: Okwu Grik n’onwe ya na-egosi igbutu ụzọ abụọ. Idebe ya na-ezere ịkọwa ya n’ụzọ ga-ewepụ ihe oyiyi siri ike Jizọs ji dọọ aka ná ntị, ma ọ naghị ekpebi kpọmkwem ụdị ikpe ikpeazụ ọ na-anọchi anya ya.
- issue: Otu a ga-esi kọwaa τὸ μέρος αὐτοῦ ... θήσει
  choice: ‘nyekwa ya òkè ya n’etiti ndị ihu abụọ’
  alternative: ‘kenye ya ebe ya n’etiti ndị ihu abụọ’
  rationale: ‘Òkè ya’ na-echekwa echiche nke ihe ma ọ bụ ọnọdụ e kenyere ya, na-akọwaghị ya n’ụzọ dị warara dịka naanị ebe, ihe nketa, ma ọ bụ akara aka.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ndị ihu abụọ’ na ‘ịta ikikere eze’ bụ okwu ndị a na-amata nke ọma, ebe ‘òkè ya’ na-echekwa nghọta sara mbara nke okwu Grik.
