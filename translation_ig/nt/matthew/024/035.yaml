  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ig
  text: Eluigwe na ụwa ga-agabiga, ma okwu m agaghị agabiga ma ọlị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “agaghị agabiga mgbe ọ bụla.” N'asụsụ Grik, e ji ngọnarị e mesiri ike (οὐ μή).
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: Eluigwe
  rationale: N'okwu ejikọtara ya na γῆ, ọ na-ezo aka n'eluigwe dịka akụkụ nke ihe e kere eke, ọ bụghị naanị mbara igwe a na-ahụ anya.
- source_word: ἡ γῆ
  choice: ụwa
  rationale: N'usoro okwu ‘eluigwe na ụwa,’ γῆ pụtara ụwa dum, ọ bụghị otu ala ma ọ bụ obodo.
- source_word: παρελεύσεται
  choice: ga-agabiga
  rationale: Ọ na-egosi na usoro ihe e kere eke dị ugbu a ga-agafe ma ọ bụ kwụsị ịdị; ‘ga-agabiga’ na-edobe ihe oyiyi na ịdị nsọ nke okwu Grik ahụ n'ụzọ Igbo doro anya.
- source_word: δὲ
  choice: ma
  rationale: Ọ na-egosi ọdịiche dị n'etiti ihe eluigwe na ụwa ga-eme na ihe okwu Jizọs na-agaghị eme.
- source_word: οἱ λόγοι μου
  choice: okwu m
  rationale: Ọ na-ezo aka n'ihe Jizọs kwuru na nkuzi ya; ‘okwu m’ bụ ntụgharị kpọmkwem ma dịkwa mma n'Igbo.
- source_word: οὐ μὴ παρέλθωσιν
  choice: agaghị agabiga ma ọlị
  rationale: οὐ μή tinyere aorist subjunctive bụ ngọnarị e mesiri ike; ‘ma ọlị’ na-eme ka nkwenye siri ike ahụ pụta ìhè n'Igbo ugbu a.
theological_decisions:
- issue: Ike nke nkwupụta Jizọs banyere ịdịgide nke okwu ya
  choice: E gosipụtara ya dịka ọdịiche siri ike n'etiti eluigwe na ụwa nke ga-agabiga na okwu Jizọs nke na-agaghị agabiga ma ọlị.
  alternative: Ịgbakwụnye nkọwa ozizi banyere ikike Chineke dị n'okwu Jizọs.
  rationale: Amaokwu ahụ n'onwe ya na-ekwusi ike na okwu Jizọs ga-adịgide; ntụgharị ahụ na-edobe ibu okwu a n'enweghị ịgbakwụnye ozizi a na-ekwughị kpọmkwem.
translation_notes:
  register: Asụsụ Igbo izugbe, dị ugbu a ma nwee ugwu. E jiri ‘agabiga’ mee ka otu ngwaa Grik ahụ pụta n'akụkụ abụọ nke amaokwu ahụ, ebe ‘ma ọlị’ na-egosipụta ngọnarị siri ike.
