  verdict: revise
  source_fidelity: The draft accurately conveys the reply, rhetorical question, solemn assurance, location, and comprehensive prediction of demolition. However, “a na-agaghị akwatu” is not the appropriate simple future passive for καταλυθήσεται in this clause; it can suggest an ongoing/habitual passive rather than “will not be demolished.”
  naturalness: The wording is generally clear Standard Igbo. Replacing “a na-agaghị akwatu” with “a gaghị akwatu” produces the natural future construction and preserves the force of the Greek prediction.
  terminology: “Akwatu” is an appropriate rendering for καταλυθήσεται in the context of buildings/stones. The footnote’s quoted alternative should be a complete verbal clause, rather than the bare form “ebibi.”
  issues:
  - severity: medium
    issue: Future passive construction in the final relative clause
    rationale: The source has a future passive, καταλυθήσεται (“will be demolished/thrown down”). Igbo “a na-agaghị akwatu” is not the straightforward negative future passive here. “a gaghị akwatu” correctly expresses “will not be demolished.”
  - severity: low
    issue: Footnote alternative is not presented as a complete alternative rendering
    rationale: “Ma ọ bụ, ‘ebibi’” is a bare form and does not naturally function as the alternative translation of the clause. “a ga-ebibi ya” clearly supplies the verbal alternative without changing meaning.
  revised_text: Ma ọ zara ha sị, “Ọ̀ bụ na unu adịghị ahụ ihe ndị a niile? N’ezie, ana m agwa unu, ọ dịghị otu nkume dị n’ebe a a ga-ahapụ n’elu nkume ọzọ nke a gaghị akwatu[a].”
