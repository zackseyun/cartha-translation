  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Οὐ βλέπετε ⸂ταῦτα πάντα⸃; ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: ig
  text: Ma ọ zara ha sị, “Ọ̀ bụ na unu adịghị ahụ ihe ndị a niile? N’ezie, ana m agwa unu, ọ dịghị otu nkume dị n’ebe a a ga-ahapụ n’elu nkume ọzọ nke a gaghị akwatu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a ga-ebibi ya.” Ngwaa Grik a nwere ike ịpụta ịkwasasị ma ọ bụ ịkwatu ihe owuwu; “akwatu” na-edobe ihe oyiyi nke iwepụ nkume ndị ahụ n’ebe ha dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ọ zara ha sị
  rationale: Nke a na-egosipụta ma nzaghachi ahụ ma okwu o kwuru n’ụzọ Igbo dị ire, n’ebughị usoro Grik ahụ n’ụzọ kpọrọ nkụ.
- source_word: Οὐ βλέπετε
  choice: Ọ̀ bụ na unu adịghị ahụ
  rationale: Ajụjụ a na-atụ anya ka ndị na-ege ntị kweta; usoro a na-edobe ụdị ajụjụ ahụ ma na-ada nke ọma n’Igbo.
- source_word: ταῦτα πάντα
  choice: ihe ndị a niile
  rationale: Ọ na-ezo aka n’ihe owuwu ụlọ nsọ ndị a kpọtụrụ aha n’akụkụ okwu a, ma na-edobe ọtụtụ ihe dị na Grik.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: N’ezie, ana m agwa unu
  rationale: Nke a na-ebupụta ịdị nsọ na nkwenye siri ike nke usoro okwu Jizọs n’Igbo nke oge a.
- source_word: οὐ μὴ ἀφεθῇ
  choice: ọ dịghị otu ... a ga-ahapụ
  rationale: Njikọ a na-egosipụta nkwuwa okwu siri ike nke οὐ μή, karịchaa site n’itinye “ọ dịghị otu nkume.”
- source_word: ὧδε
  choice: dị n’ebe a
  rationale: Ọ bụ ntụaka doro anya banyere ebe ụlọ nsọ ahụ dị n’ọnọdụ okwu a.
- source_word: λίθος ἐπὶ λίθον
  choice: otu nkume ... n’elu nkume ọzọ
  rationale: Nke a bụ ụzọ Igbo doro anya si egosipụta nkume fọdụrụ n’elu ibe ya, ma na-egosi mbibi zuru ezu.
- source_word: καταλυθήσεται
  choice: a na-agaghị akwatu
  rationale: “Akwatu” na-egosi ịkwatu ihe owuwu ma na-edobe ihe oyiyi doro anya nke nkume ndị a na-ewepụ n’ebe ha dị.
theological_decisions:
- issue: Oke na ike nke amụma Jizọs banyere ụlọ nsọ
  choice: E gosipụtara ya dị ka amụma pụtara ìhè banyere ịkwatu ihe owuwu ahụ kpamkpam.
  alternative: Ịghọta ya naanị dị ka ihe nnọchianya nke ikpe, ma ọ bụ ijikọ ya kpọmkwem na otu usoro nkọwa banyere ọgwụgwụ oge.
  rationale: Okwu banyere nkume na-agaghị afọdụ n’elu nkume ọzọ bụ okwu gbasara ihe owuwu n’ezie. Nsụgharị ahụ anaghị etinye nkọwa okpukpe ma ọ bụ usoro banyere ọgwụgwụ oge nke amaokwu ahụ n’onwe ya ekwughị.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ajụjụ nkwenye, nkwuwa okwu nke amụma ahụ, na ihe oyiyi doro anya nke ịkwatu ụlọ ahụ.
