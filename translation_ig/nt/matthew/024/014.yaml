revisions:
- from: A ga-ekwusa ozi ọma nke a nke alaeze ahụ[a] n’ụwa niile[b], ka ọ bụrụ ihe akaebe nye mba niile[c]; mgbe ahụkwa, ọgwụgwụ ga-abịa.
  to: A ga-ekwusa ozi ọma a nke alaeze ahụ[a] n’ụwa niile[b], ka ọ bụrụ ihe akaebe nye mba niile[c]; mgbe ahụ, ọgwụgwụ ga-abịa.
  rationale: The revision makes the opening noun phrase idiomatic in Standard Igbo and clarifies the footnote for οἰκουμένη. It retains the draft’s faithful rendering of all source-language elements, its broad scope for the nations, and its deliberate avoidance of specifying whether the testimony is for or against them.
