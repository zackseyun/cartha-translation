  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: ig
  text: A ga-ekwusa ozi ọma a nke alaeze ahụ[a] n’ụwa niile[b], ka ọ bụrụ ihe akaebe nye mba niile[c]; mgbe ahụ, ọgwụgwụ ga-abịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ozi ọma banyere alaeze ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ụwa mmadụ bi na ya.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “nye agbụrụ niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: A ga-ekwusa
  rationale: Nke a na-echekwa ọdịdị ọdịnihu na nke nnara nke ngwaa Grik ahụ, ma na-egosikwa nkwusa a na-ekwusa n’ihu ọha n’ụzọ doro anya n’Igbo.
- source_word: τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας
  choice: ozi ọma nke a nke alaeze ahụ
  rationale: “Ozi ọma” na-enye isi echiche εὐαγγέλιον n’asụsụ Igbo nke oge a; nhazi “nke a nke alaeze ahụ” na-echekwa ma ihe ngosipụta τοῦτο ma njikọ genitive τῆς βασιλείας, n’agbanyeghị na nkwughachi “nke” bụ ihe asụsụ Igbo chọrọ ebe a.
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: n’ụwa niile
  rationale: Nke a bụ okwu Igbo dị mfe ma bụrụkwa nke sitere n’ọnụ mmadụ, nke na-egosi obosara ụwa dum; nkọwa ala peeji na-echekwa echiche kpọmkwem banyere ụwa mmadụ bi na ya.
- source_word: εἰς μαρτύριον
  choice: ka ọ bụrụ ihe akaebe
  rationale: Nke a na-echekwa ohere nke ebumnuche ma ọ bụ ihe ga-esi na nkwusa ahụ pụta, na-ekpebighị ma akaebe ahụ ọ̀ bụ maka ndị na-anụ ya ka ọ̀ bụ megide ha.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: nye mba niile
  rationale: “Mba niile” na-echekwa okwu ἔθνη na obosara ya, ma ghara ime ka ọ bụrụ naanị ndị mba ọzọ n’ụzọ megidere ndị Juu.
- source_word: ἥξει τὸ τέλος
  choice: ọgwụgwụ ga-abịa
  rationale: Nke a bụ nsụgharị Igbo nkịtị ma dị arọ nke na-echekwa ma ngwaa “ga-abịa” ma aha “ọgwụgwụ,” na-etinyeghị usoro nkọwa banyere oge ikpeazụ n’ime amaokwu ahụ.
theological_decisions:
- issue: Obosara οἰκουμένη na ἔθνη n’okwu banyere ọgwụgwụ
  choice: Jiri “n’ụwa niile” na “nye mba niile” mee ka obosara zuru ụwa ọnụ nke okwu ahụ pụta ìhè.
  alternative: “n’ụwa mmadụ niile bi na ya” na “nye agbụrụ niile”
  rationale: Amaokwu ahụ na-ekwu maka nkwusa sara mbara tupu ọgwụgwụ abịa. Nsụgharị ahụ anaghị akpa ya ókè n’Alaeze Ukwu Rom, ma ọ bụ kpebie kpọmkwem otú na mgbe amụma ahụ ga-esi mezuo.
- issue: Ike nke εἰς μαρτύριον
  choice: “ka ọ bụrụ ihe akaebe”
  alternative: “dị ka akaebe megide ha”
  rationale: Grik ahụ ekwughị hoo haa na akaebe ahụ bụ megide mba ndị ahụ. Ya mere, nsụgharị ahụ na-echekwa esemokwu na enweghị nkọwa zuru ezu kama itinye echiche ikpe ọmụma n’ime ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Ikwusa” na “ihe akaebe” bụ okwu a na-aghọta nke ọma ma na-echekwa ụda nkwupụta ọha na nke ịgba akaebe dị na Grik. E zere okwu pụrụ iche nke otu ụka ma ọ bụ usoro nkọwa banyere ọgwụgwụ.
