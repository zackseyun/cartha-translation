  terminology: “Ndị ahọpụtara” preserves the lexical designation “the elect/chosen” without defining the group doctrinally. “A gaara azọpụta” retains the semantic openness of σῴζω, while the footnote appropriately explains the idiom behind πᾶσα σάρξ.
