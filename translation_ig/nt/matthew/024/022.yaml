  - severity: low
    issue: The form for ἐκλεκτοί can be made more idiomatic as a fixed designation.
    rationale: “Ndị a họpụtara” is understandable, but “ndị ahọpụtara” is a smoother Standard Igbo rendering of a substantivized passive participle, while retaining no denominational interpretation.
