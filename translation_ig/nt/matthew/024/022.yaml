id: MAT.24.22
reference: Matthew 24:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: ig
  text: Ọ bụrụkwa na e belataghị ụbọchị ndị ahụ[a], ọ dịghị onye ọ bụla[b] a gaara azọpụta; ma n’ihi ndị ahọpụtara, a ga-ebelata ụbọchị ndị ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “e meghị ka ụbọchị ndị ahụ dị mkpụmkpụ ... a ga-eme ka ụbọchị ndị ahụ dị mkpụmkpụ.” Okwu Grik ahụ pụrụ ịpụta ibelata ogologo oge ihe ma ọ bụ ime ka ọ dị mkpụmkpụ.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, e dere ya n’ụzọ nkịtị dịka “anụ ahụ niile”; nke a bụ akpaalaokwu Akwụkwọ Nsọ nke pụtara mmadụ niile ma ọ bụ onye ọ bụla dị ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: e meghị ka ... dị mkpụmkpụ / a ga-eme ka ... dị mkpụmkpụ
  rationale: Okwu Grik κολοβόω pụtara ime ka ihe dị mkpụmkpụ ma ọ bụ ibelata ya. Nkebi okwu a bụ Igbo doro anya nke na-egosi na a belatara ogologo oge ụbọchị ndị ahụ, ma na-echekwa ọdịiche dị n’etiti ihe a na-emeghị n’ahịrịokwu mbụ na ihe a ga-eme n’ahịrịokwu ikpeazụ.
- source_word: οὐκ ἂν ἐσώθη
  choice: ọ dịghị ... a gaara azọpụta
  rationale: Ụdị a na-egosi ihe gaara eme ma a sị na ọnọdụ ahụ adịghị iche. “A gaara azọpụta” na-echekwa obosara ihe σῴζω pụtara—ịzọpụta ma ọ bụ ichekwa ndụ—n’ebughị ụzọ kpebie na ọ bụ naanị nlanarị anụ ahụ ma ọ bụ nzọpụta ime mmụọ.
- source_word: πᾶσα σάρξ
  choice: ọ dịghị onye ọ bụla
  rationale: N’okwu a, πᾶσα σάρξ bụ akpaalaokwu pụtara mmadụ niile; mgbe e tinyere ya n’ahịrịokwu na-ajụ, echiche ya bụ na ọ dịghị mmadụ ọbụla. Ịsụ ya kpọmkwem dịka “anụ ahụ” n’Igbo nwere ike ime ka ndị na-agụ ya chee anụ ma ọ bụ ahụ nkịtị, ya mere e nyere echiche akpaalaokwu ahụ n'ụzọ doro anya.
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: ma n’ihi ndị a họọrọ
  rationale: “N’ihi” na-egosi ihe kpatara ya ma ọ bụ ihe e mere maka uru ha, ebe “ndị a họọrọ” na-asụgharị ἐκλεκτοί n’enweghị nkọwa agbakwunyere banyere kpọmkwem ndị ha bụ.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: ụbọchị ndị ahụ
  rationale: Nke a bụ ntụgharị Igbo nkịtị ma doo anya nke na-echekwa ike okwu nrụtụ aka ἐκεῖναι.
- source_word: καὶ εἰ μὴ
  choice: Ọ bụrụkwa na ... emeghị
  rationale: “Ọ bụrụkwa na” na-echekwa njikọ καί na usoro ọnọdụ εἰ μή, ma na-ada nke ọma n’Igbo ugbu a.
theological_decisions:
- issue: Ndị ἐκλεκτοί bụ ndị ole n’okwu banyere ọgwụgwụ oge
  choice: ndị a họọrọ
  alternative: ndị Chineke họọrọ; ndị kwere ekwe; ndị fọdụrụ kwesịrị ntụkwasị obi
  rationale: Amaokwu ahụ kpọrọ otu ìgwè “ndị a họọrọ” ma ọ kọwaghị n’ebe a ma ha bụ Izrel, ụka, ma ọ bụ ìgwè ọzọ. Ya mere, ntụgharị ahụ ahapụghị nghọta okpukpe pụrụ iche n’ime ederede.
- issue: Ihe σῴζω pụtara n’ọnọdụ a
  choice: a gaara azọpụta
  alternative: a gaara alanarị; a gaara echekwa ndụ ya
  rationale: Ọnọdụ ahụ na-egosi ichekwa ndụ n’oge mkpagbu, ma “azọpụta” na-echekwa obosara okwu Grik ahụ kama imechi ya naanị n’ihe gbasara ndụ anụ ahụ ma ọ bụ naanị nzọpụta ime mmụọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ndị a họọrọ” kama okwu nkà mmụta okpukpe siri ike, iji chekwaa ihe ederede kwuru n’enweghị ịkọwapụta ndị otu ahụ karịa ka amaokwu ahụ mere. E tinyere akara [a] na [b] kpọmkwem n’ebe nkọwa ala peeji ha metụtara.
