translation:
  language: ig
  text: na-asị, “Chegharịanụ[a], n’ihi na alaeze eluigwe[b] abịaruola nso.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Gbanweenụ echiche unu.” Okwu Grik a na-akpọ mmadụ ka ọ gbanwee uche na nghọta ya n’ụzọ ga-atụgharịkwa ụzọ ndụ ya; ọ bụghị naanị inwe mwute.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ dabara kpọmkwem n’ụdị Grik: “alaeze nke eluigwe.” N’Igbo, “alaeze eluigwe” bụ ụzọ e si ekwu ya n’ụzọ ebumpụta ụwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: na-asị
  rationale: Akụkụ a na-aga n’ihu n’ahịrịokwu nke malitere n’amaokwu bu ya ụzọ. “Na-asị” na-egosipụta participle λέγων n’ụzọ Igbo dị mfe, ebe a hapụrụ καὶ ka njikọ ya pụta site n’usoro ahịrịokwu ahụ.
- source_word: Μετανοεῖτε
  choice: Chegharịanụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha gbanwee uche na ụzọ ndụ ha n’ụzọ miri emi. “Chegharịanụ” bụ okwu Igbo dị ndụ nke na-agụnye mgbanwe echiche na ntụgharị ụzọ, n’enweghị ime ka ọ bụrụ naanị mwute ma ọ bụ ịrịọ mgbaghara.
- source_word: ἤγγικεν
  choice: abịaruola nso
  rationale: Perfect indicative a na-egosi na alaeze ahụ abịaruwo nso ma nọkwa nso ugbu a. “Abịaruola nso” na-echekwa ihe omume ahụ na ọnọdụ si na ya pụta.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-enye ihe mere e ji nye iwu ahụ; “n’ihi na” bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji ekwu ihe kpatara ihe.
- source_word: ἡ βασιλεία
  choice: alaeze
  rationale: “Alaeze” bụ ntụgharị Igbo a na-aghọta nke ọma, ma ọ ka na-enye ohere ka βασιλεία gụnye ọchịchị eze nakwa ógbè ọchịchị ya.
- source_word: τῶν οὐρανῶν
  choice: eluigwe
  rationale: Ọ bụ ezie na Grik ji ụdị ọtụtụ, okwu Igbo “eluigwe” bụ ụzọ ebumpụta ụwa isi kwuo okwu Matiu a ma ama n’emebighị ihe ọ pụtara.
theological_decisions:
- issue: Ihe “alaeze eluigwe” pụtara
  choice: E debere okwu Matiu n’onwe ya dịka “alaeze eluigwe.”
  alternative: ọchịchị Chineke; ọchịchị eluigwe
  rationale: Nke a na-echekwa ụdị okwu Matiu na esemokwu bara uru dị n’etiti echiche nke ọchịchị eze na nke ógbè alaeze, kama ịkọwa ya n’otu ụzọ naanị.
- issue: Ike nke Μετανοεῖτε
  choice: Chegharịanụ
  alternative: Gbanweenụ echiche unu; chegharịanụ na mmehie unu
  rationale: Okwu ahụ kpọrọ ndị na-ege ntị ka ha gbanwee nghọta na ụzọ ha n’ụzọ zuru ezu. E tinyeghị “na mmehie unu” n’amaokwu ahụ n’ihi na okwu ndị ahụ adịghị kpọmkwem na Grik, ọ bụ ezie na nchegharị n’ọnọdụ a metụtara ndụ mmadụ n’ihu Chineke.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Ụdị mkpọsa ahụ dị nkenke ma sie ike; a zere okwu ụka pụrụ iche na nkọwa ga-emechi ọtụtụ ihe okwu Grik nwere ike ịpụta.
