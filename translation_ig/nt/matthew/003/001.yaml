id: MAT.3.1
reference: Matthew 3:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ἐκείναις παραγίνεται Ἰωάννης ὁ βαπτιστὴς κηρύσσων ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/001.yaml
  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: ig
  text: N’ụbọchị ndị ahụ, Jọn Onye Na-eme Baptizim[a] bịara[b], na-ekwusa ozi n’ala ịkpa Judia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jọn Onye Na-eme Ndị Mmadụ Baptizim.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “pụtara.” N’asụsụ Grik, ngwaa a dị n’ụdị ugbu a e ji akọ ihe gara aga.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: N’ụbọchị ndị ahụ
  rationale: Nkebiokwu a na-egosi oge. A hapụrụ δέ ka njikọ dị nro nke usoro akụkọ, n’ihi na itinye “ma” ma ọ bụ “ugbu a” n’ebe a agaghị ada ka Igbo nkịtị.
- source_word: παραγίνεται
  choice: bịara
  rationale: Ọ bụ ngwaa dị n’ụdị ugbu a e ji akọ akụkọ gara aga. “Bịara” na-eme ka akụkọ ahụ doo anya ma gosipụta Jọn mgbe ọ malitere ịpụta n’akụkọ a.
- source_word: Ἰωάννης
  choice: Jọn
  rationale: E dere aha onye ahụ n’ụdị a na-ejikarị ede ya n’Igbo.
- source_word: ὁ βαπτιστὴς
  choice: Onye Na-eme Baptizim
  rationale: Nke a na-egosi ọrụ Jọn dịka onye na-eme baptizim, ma ghara ime ka aha ọrụ ahụ bụrụ aha otu ụka.
- source_word: κηρύσσων
  choice: na-ekwusa ozi
  rationale: Nkebiokwu a na-egosi ihe Jọn nọ na-eme n’otu oge ahụ ọ bịara; “na-ekwusa ozi” bụ Igbo doro anya maka ikwupụta ozi n’ihu ọha.
- source_word: ἐν τῇ ἐρήμῳ
  choice: n’ala ịkpa
  rationale: “Ala ịkpa” na-egosi ebe mmadụ na-ebighị nke ọma ma ọ bụ ebe tọgbọrọ n’efu, na-enweghị ime ka a ghọta ya naanị dịka ọzara aja.
- source_word: τῆς Ἰουδαίας
  choice: Judia
  rationale: Nke a bụ aha mpaghara Judia n’oge ahụ, ọ bụghị aha ebo Juda.
theological_decisions:
- issue: Otú e si sụgharị aha ọrụ βαπτιστής nke Jọn
  choice: Onye Na-eme Baptizim
  alternative: Onye Na-eme Ndị Mmadụ Baptizim
  rationale: Nhọrọ bụ isi dị mkpirikpi ma na-arụ ọrụ dịka aha e ji amata Jọn. Nhọrọ nke ọzọ na-eme ka ọrụ ahụ pụta ihe nke ọma, ma ha abụọ anaghị ekpebi usoro e si eme baptizim.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ala ịkpa” na-ezere echiche na ebe ahụ ga-abụrịrị ọzara aja, ebe “Onye Na-eme Baptizim” na-akọwa aha ọrụ Jọn n’enweghị itinye ozizi otu ụka.
