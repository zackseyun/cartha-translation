id: MAT.3.3
reference: Matthew 3:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: ig
  text: 'N’ihi na ọ bụ onye a ka e kwuru okwu banyere ya site n’aka Aịzaya onye amụma, onye sịrị:


    “Olu onye na-eti mkpu n’ọzara[a]:


    ‘Dozienụ ụzọ Onyenwe anyị[b];


    meenụ ka ụzọ ya kwụ ọtọ.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Olu onye na-eti mkpu sị, ‘N’ọzara, dozienụ ụzọ Onyenwe anyị.’”'
    reason: Usoro okwu Grik nwere ike ikwe ka “n’ọzara” kọwaa ebe a ga-edozi ụzọ ahụ kama ebe onye ahụ nọ na-eti mkpu.
  - marker: b
    text: Ma ọ bụ “ONYENWE ANYỊ.” Okwu a sitere n’Aịzaya 40:3; n’ebe ahụ, ederede Hibru nwere aha Chineke YHWH.
    reason: Ndetu a na-echekwa ndabere aha Chineke dị n’Aịzaya, ebe isi ederede na-atụgharị κύριος nke Grik.
lexical_decisions:
- source_word: οὗτος γάρ ἐστιν ὁ ῥηθεὶς
  choice: N’ihi na ọ bụ onye a ka e kwuru okwu banyere ya
  rationale: Nke a na-edobe njikọ nkọwa nke γάρ, ike nrụtụ aka nke οὗτος, na ọdịdị passive nke ὁ ῥηθεὶς n’Igbo dị ndụ.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου λέγοντος
  choice: site n’ọnụ Aịzaya onye amụma, mgbe ọ sịrị
  rationale: “Site n’ọnụ” na-egosi na Aịzaya bụ onye Chineke si n’aka ya kwuo okwu, ebe “mgbe ọ sịrị” na-ewebata okwu e hotara n’ụzọ doro anya.
- source_word: Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ
  choice: Ọ bụ olu onye na-eti mkpu n’ọzara
  rationale: Nke a na-echekwa “olu onye” nke genitive participle βοῶντος ma jiri okwu Igbo nkịtị “na-eti mkpu” kọwaa mkpọsa siri ike; “ọzara” dabara na mpaghara tọgbọrọ n’efu nke akụkọ a.
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: Dozienụ ụzọ Onyenwe anyị
  rationale: Imperative plural pụtara ìhè na “Dozienụ”; “ụzọ” na-echekwa ma ihe oyiyi okporo ụzọ ma ihe ọ pụtara n’ụzọ ime mmụọ. “Onyenwe anyị” bụ ntụgharị nkịtị nke κύριος.
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: meenụ ka ụzọ ya kwụ ọtọ
  rationale: Nke a bụ Igbo eke nke na-echekwa iwu ahụ, ihe oyiyi ime ụzọ ka ọ kwụ ọtọ, na nnọchiaha αὐτοῦ.
theological_decisions:
- issue: κύριος n’okwu e hotara n’Aịzaya 40:3, ebe Hibru nwere aha Chineke YHWH
  choice: Onyenwe anyị
  alternative: ONYENWE ANYỊ
  rationale: Isi ederede na-agbaso okwu Grik κύριος n’ụzọ Igbo nkịtị; ndetu ala peeji na-eme ka onye na-agụ mara na Hibru nke Aịzaya ji aha Chineke YHWH mee ihe, na-enweghị ịmanye mkpebi nkà mmụta okpukpe n’ime isi ederede.
- issue: Ihe ἐν τῇ ἐρήμῳ (“n’ọzara”) na-ejikọta na ya
  choice: ọ na-akọwa ebe onye ahụ na-eti mkpu
  alternative: ọ na-akọwa ebe a ga-edozi ụzọ ahụ
  rationale: Akara edemede SBLGNT na ọnọdụ Matiu na-akwado ijikọ ya na onye na-eti mkpu, ma usoro okwu ahụ na ndabere Aịzaya na-enye ohere ka e jikọta ya na iwu “dozienụ”; e debere nke ahụ na ndetu ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrị uri na-ekewa mkpọsa amụma ahụ nke ọma; e zere okwu ụka pụrụ iche ma chekwaa nghọtahie ziri ezi banyere “n’ọzara.”
