    issue: Loose coordination of the clothing and belt phrases
    rationale: The Greek explicitly has both a camel-hair garment and a leather belt. Revising the phrase to state that John fastened the leather belt around his waist makes this relation natural and unambiguous in Igbo.
  - severity: low
    issue: Cross-reference footnote wording is slightly unnatural
    rationale: “Na-eme ka a cheta” is a more natural Igbo way to express that John’s clothing recalls Elijah’s description.
