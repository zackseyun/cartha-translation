id: MAT.3.4
reference: Matthew 3:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: ig
  text: Jọn n’onwe ya na-eyi uwe e ji ajị kamel mee, na-ekekọta eriri akpụkpọ anụ n’úkwù ya[c][b][a]; nri ya bụ igurube na mmanụ aṅụ ọhịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Uwe Jọn na-eme ka a cheta nkọwa e nyere banyere Ịlaịja onye amụma na 2 Ndị Eze 1:8; nke a dị mkpa n’otú Matiu si egosi Jọn.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “uwe ya bụ nke ajị kamel.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “nwere uwe e ji ajị kamel mee.”
    reason: previous_rendering
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: Jọn n’onwe ya
  rationale: αὐτός na-emesi onye ahụ ike; “n’onwe ya” na-echekwa nkwusiri ike ahụ. δέ bụ njikọ dị nro nke a na-adịghị mkpa ịsụgharị iche n’Igbo ebe usoro ahịrịokwu ahụ zuru ezu.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: na-eyi uwe
  rationale: Ọ bụ ezie na εἶχεν pụtara n'ụzọ nkịtị ‘nwere,’ n’ebe a ọ na-akọ ihe Jọn na-eyikarị. “Na-eyi uwe” bụ Igbo eke ma zere echiche na o nyere iwu ka e meere ya uwe ahụ.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: e ji ajị kamel mee
  rationale: ἀπό na-egosi ihe e ji mee uwe ahụ. “Ajị kamel” na-akọwa ntutu anụmanụ ahụ n'ụzọ ndị na-agụ Igbo ga-aghọta.
- source_word: ζώνην δερματίνην
  choice: eriri akpụkpọ anụ
  rationale: ζώνη bụ eriri e kere n’úkwù, δερματίνη na-egosikwa na e ji akpụkpọ anụ mee ya.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: n’úkwù ya
  rationale: ὀσφύς bụ úkwù; okwu a bụ nke nkịtị ma kwekọọ n’Igbo ugbu a.
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: nri ya bụ
  rationale: τροφή bụ nri ma ọ bụ ihe oriri. Nhazi a dị mkpụmkpụ ma bụrụ Igbo eke.
- source_word: ἀκρίδες
  choice: igurube
  rationale: Ihe okwu Grik a na-apụtakarị bụ ahụhụ a na-akpọ locust; “igurube” na-echekwa ihe ọ pụtara n’enweghị nkọwa ọzọ.
- source_word: μέλι ἄγριον
  choice: mmanụ aṅụ ọhịa
  rationale: ἄγριον na-akọwa mmanụ aṅụ a hụrụ n’ọhịa, ọ bụghị nke a zụlitere n’ụlọ.
theological_decisions:
- issue: Nkọwa Jọn nke na-echetara onye amụma Ịlaịja
  choice: Ịsụgharị uwe na nri ya kpọmkwem n’ahịrịokwu bụ isi
  alternative: Itinye n’ahịrịokwu bụ isi okwu na-akpọ Ịlaịja aha ma ọ bụ na-eme ka njikọ ahụ pụta ìhè karịa
  rationale: Grik na-akọwa ọdịdị na nri Jọn n’enweghị ịkpọ Ịlaịja aha. Ya mere, njikọ ya na 2 Ndị Eze 1:8 kwesịrị ịdị na nkọwa ala peeji kama ịbụ nkọwa etinyere n’ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta, dee ya. “Na-eyi” na-egosi omume ma ọ bụ ọnọdụ na-aga n’ihu nke imperfect εἶχεν; “eriri akpụkpọ anụ” na “n’úkwù” bụ okwu ndị nkịtị karịa ụdị ochie ma ọ bụ nke siri ike.
