id: MAT.3.12
reference: Matthew 3:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: ig
  text: Ngwá e ji afụcha ọka dị ya n’aka[a]. Ọ ga-ekpochapụ ebe ịzọcha ọka ya nke ọma, chịkọtakwa ọka wit ya n’ụlọ nkwakọba ihe[b]. Ma ọ ga-eji ọkụ a na-apụghị imenyụ gbaa igbogbo ọka ahụ ọkụ kpamkpam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “shọvel e ji afụcha ọka.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọba” ma ọ bụ “ọba ọka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: ngwá e ji afụcha ọka
  rationale: Nke a na-akọwa n’ụzọ doro ndị na-agụ Igbo anya ngwá ọrụ e ji atụba ọka n’ikuku ka mkpụrụ ọka na igbogbo ya kewapụ, n’ebughị ụdị ngwá ahụ ụzọ kpebie karịa ihe okwu Grik kwuru.
- source_word: διακαθαριεῖ
  choice: ọ ga-ekpochapụ ... nke ọma
  rationale: ‘Ekpochapụ’ na ‘nke ọma’ jikọtara ọnụ na-egosi na ọ ga-asachapụ ma kpochaa ebe ahụ kpamkpam, dịka ike dị n’okwu Grik a siri dị.
- source_word: ἅλωνα
  choice: ebe ịzọcha ọka
  rationale: Ọ bụ okwu Igbo doro anya maka ebe a na-azọcha ma na-afụcha ọka.
- source_word: σῖτον
  choice: ọka wit
  rationale: N’agbanyeghị na σῖτος nwere ike ịpụta mkpụrụ ọka n’ozuzu, ‘ọka wit’ dabara nke ọma n’ihe atụ gbasara ịzọcha na ịfụcha ọka, ma doo anya n’Igbo ugbu a.
- source_word: ἀποθήκην
  choice: ụlọ nkwakọba ihe
  rationale: Nke a na-edobe echiche sara mbara nke ebe a na-edowe ihe, n’emeghị ka ọ bụrụ naanị otu ụdị ọba.
- source_word: ἄχυρον
  choice: igbogbo ọka
  rationale: Nke a bụ ihe na-abaghị uru nke a na-ekewapụ n’ọka mgbe a na-afụcha ya, ya mere o kwekọrọ n’ihe atụ ahụ.
- source_word: κατακαύσει
  choice: ọ ga-eji ... gbaa ... ọkụ kpamkpam
  rationale: ‘Kpamkpam’ na-echekwa ike nke ngwaa Grik, nke na-egosi irechapụ ihe, ọ bụghị naanị imetụ ya ọkụ.
- source_word: πυρὶ ἀσβέστῳ
  choice: ọkụ a na-apụghị imenyụ emenyụ
  rationale: Nke a na-egosi ọkụ na-agaghị ekwe ka e menyụọ ya, ma na-edobe ọkụ ahụ dịka ihe e ji agba igbogbo ọka ọkụ.
- source_word: οὗ
  choice: dị ya n’aka
  rationale: ‘Ya’ na-ezo n’ụzọ ebumpụta ụwa n’Onye ahụ na-abịa nke amaokwu bu ụzọ kwuru banyere ya, ma na-echekwa echiche nnwe nke nnọchiaha Grik.
theological_decisions:
- issue: Ihe atụ ikpe nke ikewapụ ọka wit na igbogbo ọka
  choice: E debere ihe atụ ọrụ ugbo ahụ na okwu ọdịnihu banyere ikpe n’ụzọ doro anya, n’enweghị ime ka ọ dị nro.
  alternative: Ịkọwa kpọmkwem n’ahịrịokwu bụ ndị ọka wit na igbogbo ọka nọchiri anya ha.
  rationale: Amaokwu ahụ n’onwe ya na-enye ihe atụ ahụ na njedebe ya dị egwu, ma ọ naghị akọwa kpọmkwem ndị akụkụ abụọ ahụ nọchiri anya ha. Ya mere, nsụgharị ahụ ekwesịghị itinye nkọwa okpukpe n’ime isi okwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ugwu. Okwu ọrụ ugbo ndị a bụ nkọwa ebumpụta ụwa kama iji okwu Igbo ochie nwere ike ghara ido ọtụtụ ndị anya. E tinyere akara [a] na [b] n’isi ederede dịka ndetu ala peeji si dị.
