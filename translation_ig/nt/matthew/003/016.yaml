id: MAT.3.16
reference: Matthew 3:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: ig
  text: Mgbe e baptiziri Jizọs, o si na mmiri ahụ rigoo ozugbo. Lee, e meghere eluigwe, ọ hụrụ Mmụọ Chineke ka ọ na-arịdata dị ka nduru, na-abịakwasị ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαπτισθεὶς
  choice: Mgbe e mechara Jizọs baptizim
  rationale: Na-egosi participle aorist passive na usoro oge ya n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: δὲ
  choice: Mgbe
  rationale: A jikọtara njikọ akụkọ ahụ na nkebi oge n'ụzọ Igbo si ekwu ya; ọ dịghị mkpa itinye okwu na-egosi esemokwu.
- source_word: εὐθὺς
  choice: ozugbo
  rationale: Na-echekwa echiche nke ihe mere ngwa ngwa.
- source_word: ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: o si na mmiri ahụ rigopụta
  rationale: ‘Si na’ na-anọchi ἀπό nke ọma, ebe ‘rigopụta’ na-enye mmegharị elu n'Igbo n'enweghị ịkọwapụta karịa ihe Grik kwuru.
- source_word: ἰδοὺ
  choice: Lee
  rationale: Okwu Igbo doro anya nke na-akpọ uche onye na-agụ gaa n'ihe dị ịtụnanya na-esote.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: e meghere eluigwe
  rationale: Na-echekwa olu nnara nke Grik; ‘eluigwe’ bụ okwu Igbo a na-ejikarị eme ihe maka plural Grik n'ọnọdụ a.
- source_word: εἶδεν
  choice: ọ hụkwara
  rationale: Nsụgharị kpọmkwem na nke sitere n'okike maka ngwaa ịhụ.
- source_word: πνεῦμα θεοῦ
  choice: Mmụọ Chineke
  rationale: Na-echekwa genitive ahụ na okwu Akwụkwọ Nsọ a maara nke ọma, n'enweghị ịgbanwe ya ka ọ bụrụ aha nkọwa ọzọ.
- source_word: καταβαῖνον
  choice: ka ọ na-arịdata
  rationale: Na-egosi mmegharị na-aga n'ihu nke participle present.
- source_word: ὡσεὶ περιστερὰν
  choice: dị ka nduru
  rationale: Na-echekwa ntụnyere ahụ, ghara ikwu na Mmụọ ahụ bụ nduru n'ụzọ nkịtị.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: na-abịakwasị ya
  rationale: Na-egosi ịbịa n'ebe Jizọs nọ na n'elu ya, ma ghara itinye echiche pụrụ iche nke ‘ịdakwasị’ nke ngwaa Grik ekwughị kpọmkwem.
theological_decisions:
- issue: Ma πνεῦμα θεοῦ bụ mmụọ n'ozuzu ya ka ọ bụ Mmụọ Chineke a maara nke ọma
  choice: Mmụọ Chineke
  alternative: mmụọ sitere n'aka Chineke
  rationale: Ọnọdụ baptizim a na-akwado na ọ bụ Mmụọ Nsọ ka a na-ekwu maka ya, ma nsụgharị ahụ na-edobe kpọmkwem okwu Grik ‘Mmụọ Chineke.’
- issue: Ma ὡσεὶ περιστερὰν na-ekwu na Mmụọ ahụ bụ nduru ma ọ bụ na ọ dị ka nduru n'otú o si rịdata
  choice: dị ka nduru
  alternative: n'ụdị nduru
  rationale: ὡσεὶ bụ okwu ntụnyere; ya mere, nsụgharị ahụ anaghị eme ka ntụnyere ghọọ njirimara nkịtị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Jizọs,’ ‘Mmụọ Chineke,’ na ‘eluigwe’ dịka okwu Akwụkwọ Nsọ ndị ndị Igbo maara. Enweghị akara ntụaka ụkwụ n'ihi na nsụgharị Igbo a achọghị ntụaka ọzọ iji chekwaa isi nghọta na ambiguiti Grik.
