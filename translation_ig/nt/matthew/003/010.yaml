id: MAT.3.10
reference: Matthew 3:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: ig
  text: Ma anyụike ahụ adịlarị n'akụkụ mgbọrọgwụ osisi ndị ahụ. Ya mere, a na-egbutu osisi ọ bụla na-adịghị amị ezi mkpụrụ, ma na-atụba ya n'ọkụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη
  choice: ugbua ... e doworị
  rationale: “E doworị” na-egosi na ihe ahụ adịlarị otú ahụ, na-emekwa ka ịdị ngwa nke ikpe na-abịa pụta ìhè n'Igbo nkịtị.
- source_word: δὲ
  choice: kwa
  rationale: N'ebe a δέ na-ejikọta okwu a na ịdọ aka ná ntị bu ya ụzọ, kama igosi nnukwu mmegide. “Kwa” na-eme njikọ ahụ n'ụzọ dị nro.
- source_word: ἀξίνη
  choice: anyụike
  rationale: Nke a bụ aha Igbo a na-ejikarị maka ngwá ọrụ e ji egbutu osisi, ma ọ dabara n'ihe atụ nke ikpe dị n'amaokwu a.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: e doworị anyụike n'akụkụ mgbọrọgwụ osisi ndị ahụ
  rationale: “E doworị” na-egosi na anyụike ahụ adịla n'ọnọdụ eji ya arụ ọrụ; “n'akụkụ mgbọrọgwụ” na-echekwa echiche nke ịdị nso ma ọ bụ iche ya ihu n'okwu πρὸς.
- source_word: πᾶν οὖν δένδρον
  choice: Ya mere, ... osisi ọ bụla
  rationale: “Ya mere” na-egosi nkwubi okwu οὖν, ebe “osisi ọ bụla” na-enye πᾶν ... δένδρον n'ụzọ doro anya.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: na-adịghị amị ezi mkpụrụ
  rationale: N'Igbo, a na-asị na osisi “na-amị mkpụrụ.” “Ezi mkpụrụ” na-echekwa ma ihe osisi na-amị pụtara kpọmkwem ma ihe atụ omume ọma dị na ya.
- source_word: ἐκκόπτεται
  choice: a na-egbutu
  rationale: Nke a na-echekwa olu nnara na oge ugbu a nke Grik, ma na-enye ihe a na-eme osisi n'ụzọ Igbo na-aghọta nke ọma.
- source_word: εἰς πῦρ βάλλεται
  choice: na-atụba ya n'ọkụ
  rationale: Nke a na-enye omume ịtụba osisi ahụ n'ime ọkụ n'ụzọ doro anya, na-enweghị ịkọwa ụdị ọkụ ahụ karịa ihe ederede kwuru.
theological_decisions:
- issue: Ihe ọkụ ahụ nọchiri anya ya
  choice: E debere ya dịka “ọkụ” n'enweghị nkọwa agbakwunyere.
  alternative: Ịkọwa ya kpọmkwem dịka ikpe ikpeazụ, ikpe nke oge a, ma ọ bụ ọkụ ala mmụọ.
  rationale: Amaokwu ahụ ji ọkụ mee ihe atụ nke ikpe, ma ọ kọwaghị ụdị ikpe ahụ kpọmkwem. Ịhapụ ya dịka “ọkụ” na-echekwa nghọta sara mbara na esemokwu nkà mmụta okpukpe dị n'okwu mbụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. “E doworị” na “a na-egbutu ... na-atụba” na-echekwa onyonyo dị ndụ na olu nnara nke Grik; a zere okwu ụka pụrụ iche ma ọ bụ nkọwa ozizi agbakwunyere.
