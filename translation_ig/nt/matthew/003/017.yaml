id: MAT.3.17
reference: Matthew 3:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: ig
  text: Ma, lee, olu sitere n’eluigwe kwuru, sị, “Onye a bụ Nwa m nwoke m hụrụ n’anya, onye m nwere obi ụtọ n’ebe ọ nọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Ma lee
  rationale: “Lee” na-adọta uche onye na-agụ n’ihe dị mkpa na-eme, ebe “Ma” na-ejikọta okwu a na ihe bu ya ụzọ ma na-edobe ụda dị nsọ nke nkwupụta ahụ.
- source_word: φωνὴ
  choice: otu olu
  rationale: N’ebe a, φωνή bụ olu na-ekwu okwu a pụrụ ịghọta, ọ bụghị naanị ụda, n’ihi na okwu e kwuru na-esochi ya.
- source_word: ἐκ τῶν οὐρανῶν
  choice: si n’eluigwe
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si egosi ebe olu ahụ si bịa. Akwụkwọ Grik ji ụdị ọtụtụ, ma “eluigwe” n’Igbo anaghị achọ igosi otu ma ọ bụ ọtụtụ n’ụdị okwu ya; e debere nkọwa ahụ n’ala peeji.
- source_word: λέγουσα
  choice: kwuo, sị
  rationale: Ọ bụ ezie na Grik ji participle nke pụtara “na-ekwu,” “kwuo, sị” bụ usoro Igbo dị ndụ nke na-ewebata okwu e kwuru kpọmkwem.
- source_word: Οὗτός ἐστιν
  choice: Onye a bụ
  rationale: Nke a na-edobe ike okwu ngosipụta ahụ nke na-akọwapụta onye a na-ekwu maka ya kpọmkwem.
- source_word: ὁ υἱός μου
  choice: Ọkpara m
  rationale: “Ọkpara” na-egosipụta mmekọrịta Nna na Ọkpara n’ụzọ e ji okwu a eme ihe gbasara Jizọs, na-enweghị ịgbakwunye nkọwa ozizi na-adịghị n’ahịrịokwu ahụ.
- source_word: ὁ ἀγαπητός
  choice: onye m hụrụ n’anya
  rationale: Nke a bụ Igbo nkịtị, dị ùgwù, nke na-egosipụta na Ọkpara ahụ bụ onye Nna hụrụ n’anya nke ukwuu.
- source_word: ἐν ᾧ
  choice: ihe ya
  rationale: N’usoro “ihe ya masịrị m,” nke a na-enye echiche idiom ahụ n’Igbo n’enweghị okwu siri ike ma ọ bụ nke na-ada ka ntụgharị mkpụrụokwu kpọmkwem. A na-edebe ọdịdị okwu Grik nke nwere ike ịbụ “n’ime onye ahụ” na nkọwa ala peeji.
- source_word: εὐδόκησα
  choice: masịrị m
  rationale: “Ihe ya masịrị m” na-ekwupụta nnabata na obi ụtọ Nna nwere n’ebe Ọkpara ahụ nọ. Ọ na-enye ihe aorist ahụ dị ka nkwupụta ọnọdụ dị ugbu a, dịka usoro okwu ahụ chọrọ.
theological_decisions:
- issue: Otu e si sụgharịa nkwupụta Chineke banyere ịbụ Ọkpara nke Jizọs
  choice: Ọkpara m, onye m hụrụ n’anya
  alternative: Ọkpara m m hụrụ n’anya nke ukwuu
  rationale: Nhọrọ ahụ na-edobe okwu ịbụ Ọkpara na ịhụnanya dị na Grik kpọmkwem, na-enweghị ime ka ọ bụrụ naanị ọkwa ọrụ ma ọ bụ ịgbakwunye nkọwa banyere mgbe mmekọrịta ahụ malitere.
- issue: Ụdị ọtụtụ dị na οὐρανῶν
  choice: n’eluigwe
  alternative: site n’eluigwe
  rationale: Grik ji ụdị ọtụtụ, ma Igbo “eluigwe” anaghị egosi ọnụọgụ n’ụdị okwu a. N’ihi ya, ntụgharị isi na-ada nke ọma n’Igbo, ebe nkọwa ala peeji na-eme ka ọdịdị Grik pụta ìhè.
- issue: Mmekọrịta dị n’etiti ἐν ᾧ na εὐδόκησα
  choice: ihe ya masịrị m
  alternative: onye m nwere ezi mmasị n’ime ya
  rationale: Nhọrọ isi na-ekwupụta nnabata Chineke n’ụzọ Igbo na-ada nke ọma. Nhọrọ dị nso n’usoro mkpụrụokwu Grik dị na nkọwa ala peeji ka a ghara ikpochapụ ọdịdị na mgbagwoju anya dị ntakịrị n’idiom mbụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, doro anya ma dị ùgwù. “Ma lee” na-edobe ụda nkwupụta dị mkpa; “kwuo, sị” bụ usoro Igbo nkịtị maka iwebata okwu kpọmkwem. E zere okwu ụka pụrụ iche na nkọwa ozizi agbakwunyere.
