    issue: Ambiguous agent in “ka o mee ya baptizim.”
    rationale: The Greek explicitly says that Jesus is to be baptized by John. In Igbo, the pronoun “o” can be unclear in this sequence, and the current footnote supplies essential disambiguation that is better represented directly in the text.
  - severity: low
    issue: The clarification footnote duplicates information that should be explicit in the main clause.
    rationale: Once Jọn is named as the agent in the text, the footnote adds no textual or translational alternative and should be removed.
