  rationale: The revision retains the Greek narrative sequence and purpose while explicitly identifying Jọn as the agent of Jesus’ baptism. This resolves a real Igbo pronoun-reference ambiguity without adding information beyond ὑπ’ αὐτοῦ. The redundant clarification footnote is consequently removed.
