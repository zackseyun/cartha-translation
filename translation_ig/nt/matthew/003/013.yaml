id: MAT.3.13
reference: Matthew 3:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: ig
  text: Mgbe ahụ, Jizọs si na Galili bịa n’osimiri Jọdan, bịakwute Jọn, ka Jọn baptizim ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi oge ma na-ejikọta ihe omume a na akụkọ bu ya ụzọ n'ụzọ doro anya.
- source_word: παραγίνεται
  choice: bịa
  rationale: Ngwaa Grik dị n’oge ugbu a bụ historical present, ma n’Igbo nkịtị, ‘bịa’ na-enye akụkọ ahụ usoro doro anya ma na-ada nke ọma.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: si na Galili
  rationale: ἀπό na-egosi ebe njem ahụ siri malite; ‘si na Galili’ bụ ụzọ Igbo e si ekwu ya nke ọma.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: n’osimiri Jọdan
  rationale: ἐπί tinyere accusative na-egosi ebe a na-aga. Ịkpọ ya ‘osimiri Jọdan’ na-eme ka ụdị ebe ahụ doo onye na-agụ Igbo anya.
- source_word: πρὸς τὸν Ἰωάννην
  choice: bịakwute Jọn
  rationale: πρός na-egosi ịgakwuru mmadụ; ‘bịakwute Jọn’ na-egosipụta mmegharị ahụ n’Igbo eke.
- source_word: τοῦ βαπτισθῆναι
  choice: ka o mee ya baptizim
  rationale: Articular infinitive a na-egosi ebumnuche. N’Igbo, ahịrịokwu ‘ka o mee ya baptizim’ na-egosi ebumnuche ahụ nke ọma ma na-edobe passive sense site n’ime Jọn onye na-eme ihe ahụ.
- source_word: ὑπ’ αὐτοῦ
  choice: o mee ya
  rationale: ὑπό tinyere genitive na-egosi onye mere ihe ahụ. N’usoro Igbo a, ‘o’ na-ezo aka na Jọn, ebe ‘ya’ na-ezo aka na Jizọs.
theological_decisions:
- issue: Oge historical present nke παραγίνεται
  choice: E ji ‘bịa’ mee ka akụkọ ahụ bụrụ Igbo eke
  alternative: ‘na-abịa’ iji jigide present tense n’ụdị kpọmkwem
  rationale: Igbo anaghị eji historical present n’akụkọ n’otu ụzọ Grik si eji ya. ‘Bịa’ na-echekwa usoro na ịdị ndụ nke akụkọ ahụ n’enweghị ahịrịokwu na-adịghị eke.
- issue: Aha ma ọ bụ utu aha Jọn
  choice: Jọn naanị
  alternative: Jọn Onye Na-eme Baptizim
  rationale: Amaokwu Grik a kpọrọ ya naanị Ἰωάννην; ịgbakwunye utu aha ga-etinye okwu na-adịghị n’amaokwu a.
- issue: Onye nnọchiaha dị na ὑπ’ αὐτοῦ
  choice: ‘o’ na-ezo aka na Jọn, ‘ya’ na-ezo aka na Jizọs
  alternative: 'ịkpọ Jọn aha ọzọ: ‘ka Jọn mee ya baptizim’'
  rationale: N’agbanyeghị na Igbo nwere ike inwe obere mgbagwoju anya n’usoro nnọchiaha, usoro a na-edobe nnọchiaha nke isi mmalite; ndetu ala peeji na-eme onye e zoro aka na ya ka o doo anya.
translation_notes:
  register: Asụsụ Igbo Standard nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘Jizọs,’ ‘Galili,’ ‘Jọdan,’ na ‘Jọn’ mee nsụgharị aha ndị a; e jighị utu aha na-adịghị n’amaokwu Grik.
