review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the plural aorist imperative, the inferential οὖν, and the metaphorical collective singular καρπός. However, "mkpụrụ kwesịrị nchegharị" is less idiomatic and can be read as fruit that requires or merits repentance, rather than fruit corresponding to repentance.
  naturalness: '"Ya mere, mịpụtanụ mkpụrụ kwekọrọ na nchegharị" is clear, modern Standard Igbo and naturally expresses conduct that accords with repentance. The plural imperative suffix is retained.'
  terminology: '"Nchegharị" is the established Standard Igbo Christian term for μετάνοια and is appropriate here. "Kwekọrọ na" accurately conveys ἄξιον with the genitive in its sense of fittingness/correspondence, without implying that deeds earn repentance.'
  issues:
  - severity: medium
    issue: Ambiguity in "mkpụrụ kwesịrị nchegharị"
    rationale: Although modeled on "worthy of repentance," kwesịrị can suggest that the fruit needs, deserves, or is entitled to repentance. The Greek phrase requires fruit fitting or corresponding to repentance, not fruit that merits it.
