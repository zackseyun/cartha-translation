  text: ποιήσατε οὖν καρπὸν ἄξιον τῆς μετανοίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: ig
  text: Ya mere, mịpụtanụ mkpụrụ kwekọrọ na nchegharị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ kwesịrị nchegharị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: mịpụtanụ
  rationale: Ngwaa a bụ iwu e nyere ọtụtụ mmadụ ka ha mee ihe n'ụzọ doro anya. “Mịpụtanụ” na “mkpụrụ” na-agakọ nke ọma n'Igbo, ma na-egosikwa ihe omume a na-ahụ anya.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi ihe e kwesịrị ime n'ihi ịdọ aka ná ntị na oku dị n'okwu ndị bu ụzọ.
- source_word: καρπὸν
  choice: mkpụrụ
  rationale: “Mkpụrụ” bụ okwu nkịtị maka καρπός, ebe a ọ bụ ihe atụ nke omume ma ọ bụ ihe si ná ndụ mmadụ pụta. E debere ya n'ọnụọgụ otu dịka ọ dị n'asụsụ Grik.
- source_word: ἄξιον
  choice: kwesịrị
  rationale: Ọ na-egosi na mkpụrụ ahụ ga-adabara ma kwekọọ na nchegharị ahụ; ọ pụtaghị na mmadụ ji ọrụ ya zụta nchegharị.
- source_word: μετανοίας
  choice: nchegharị
  rationale: “Nchegharị” bụ okwu Igbo doro anya ma guzosie ike maka mgbanwe nke uche na ụzọ ndụ n'ịlaghachikwute Chineke.
theological_decisions:
- issue: Ihe okwu καρπὸν ἄξιον τῆς μετανοίας pụtara
  choice: Iwu ka omume a na-ahụ anya kwekọọ na ezi nchegharị
  alternative: Mkpụrụ nke na-akpata nchegharị ma ọ bụ nke mmadụ ji enweta ya
  rationale: Njikọ ἄξιον na genitive na-egosi ịdị mma, ndabara, ma ọ bụ nkwekọrịta; ọ naghị ekwu na ọrụ mmadụ na-azụta ma ọ bụ na-akpata nchegharị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Mgbakwunye “-nụ” na-egosi na iwu ahụ bụ nke e nyere ọtụtụ mmadụ; okwu “mkpụrụ” ka nọ n'ọnụọgụ otu dịka ihe nchịkọta.
