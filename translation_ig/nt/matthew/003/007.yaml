id: MAT.3.7
reference: Matthew 3:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: ig
  text: Ma mgbe ọ hụrụ ọtụtụ n’ime ndị Farisii na ndị Sadusii ka ha na-abịa maka baptizim ọ na-eme, ọ sịrị ha, “Ụmụ ajụala[a], onye dọrọ unu aka ná ntị ka unu gbapụ n’iwe nke na-abịa[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ìgwè ụmụ ajụala.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “iwe ahụ nke gaje ịbịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Ma mgbe ọ hụrụ
  rationale: A tụgharịrị aorist participle ahụ dị ka nkebiokwu oge n’Igbo, ebe “Ma” na-edobe ntakịrị ntụgharị dị na δέ ma na-eme ka akụkọ ahụ gaa nke ọma.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: ọtụtụ ndị Farisii na ndị Sadusii
  rationale: “Ọtụtụ ndị” na-egosi na okwu ahụ gbasara ọtụtụ ndị si n’òtù abụọ ahụ, ọ bụghị na ọ ghaghị ịgụnye onye ọ bụla nọ n’òtù ndị ahụ.
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: ka ha na-abịa maka baptizim ọ na-eme
  rationale: Nke a na-egosi na ha na-abịa n’ebe ọrụ baptizim Jọn dị, ma ọ naghị ekwu hoo haa na e meela ha baptizim n’amaokwu a. “Baptizim ọ na-eme” na-ewepụ mgbagwoju anya nke “baptizim ya,” nke nwere ike ịdị ka baptizim e mere Jọn n’onwe ya.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Ụmụ ajụala
  rationale: Nke a bụ okwu Igbo doro anya ma sie ike nke na-edobe ihe oyiyi nke ndị ajụala mụrụ, kwekọọkwa na ịba mba amụma dị n’isiokwu ahụ.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: onye dọrọ unu aka ná ntị
  rationale: N’ọnọdụ a, ὑποδείκνυμι pụtara ịgwa mmadụ ihe ize ndụ na-abịa; “dọrọ unu aka ná ntị” na-egosipụta echiche ịdọ aka ná ntị karịa nanị “onye gosiri unu.”
- source_word: φυγεῖν ἀπὸ
  choice: ka unu gbapụ
  rationale: “Gbapụ” na-edobe ihe oyiyi nke ịgba ọsọ pụọ n’ihe ize ndụ dị na φυγεῖν, kama ime ka ọ bụrụ naanị izere ihe.
- source_word: τῆς μελλούσης ὀργῆς
  choice: n’iwe nke na-abịa
  rationale: “Iwe” na-edobe ịdị arọ nke ὀργή, ebe “nke na-abịa” na-egosipụta ihe a na-atụ anya na ọ ga-abịa n’ọdịnihu.
theological_decisions:
- issue: Ndị Jọn na-agwa okwu
  choice: Ọ na-agwa ọtụtụ ndị nọ n’etiti ndị Farisii na ndị Sadusii bịara n’ebe baptizim ya dị.
  alternative: Ịghọta okwu ahụ dị ka ikpe e kpere onye Farisii na onye Sadusii ọ bụla.
  rationale: Usoro partitive nke Grik na-egosi ọtụtụ ndị si n’òtù ndị ahụ, ma ọ naghị ekwu na onye ọ bụla nọ n’òtù abụọ ahụ bịara ma ọ bụ na a na-akọwa ha niile n’otu ụzọ.
- issue: Ike okwu ὀργή gbasara ihe ga-abịa
  choice: iwe
  alternative: ikpe ma ọ bụ ntaramahụhụ
  rationale: “Iwe” na-edobe okwu ozizi dị arọ na echiche ikpe Chineke nke ὀργή nwere ike ibu n’ebe a, n’agbanyeghị na ihe ọ ga-eme pụta nwere ike ịgụnye ikpe na ntaramahụhụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. E debere aha òtù ndị Juu dị ka “ndị Farisii” na “ndị Sadusii,” jiri “baptizim” dịka okwu a maara nke ọma n’Igbo Ndị Kraịst, ma zere ịgbakwunye na ndị bịara natara baptizim n’ezie.
