revisions:
- from: Ma mgbe ọ hụrụ ọtụtụ ndị Farisii na ndị Sadusii ka ha na-abịa maka baptizim ọ na-eme, ọ sịrị ha, “Ụmụ ajụala[a], onye dọrọ unu aka ná ntị ka unu gbapụ n’iwe nke na-abịa[b]?”
  to: Ma mgbe ọ hụrụ ọtụtụ n’ime ndị Farisii na ndị Sadusii ka ha na-abịa maka baptizim ọ na-eme, ọ sịrị ha, “Ụmụ ajụala[a], onye dọrọ unu aka ná ntị ka unu gbapụ n’iwe nke na-abịa[b]?”
  rationale: The sole revision makes the Greek partitive construction explicit in natural Standard Igbo. The remaining wording faithfully preserves the source’s ambiguity about whether those approaching would actually receive baptism, while retaining the rebuke’s imagery and the eschatological force of ‘wrath.’
