id: MAT.3.14
reference: Matthew 3:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: ig
  text: Ma Jọn nọgidere na-agbalị igbochi ya[a], na-asị, “Ọ dị m mkpa ka i mee m baptizim, ma gị onwe gị na-abịakwute m?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jọn gbalịrị igbochi ya.” Ngwaa Grik e ji mee ihe nwere ike igosi omume e mere ugboro ugboro ma ọ bụ nke gara n’ihu ruo oge ụfọdụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: nọgidere na-agbalị igbochi
  rationale: Oge ngwaa imperfect na-egosi omume na-aga n’ihu ma ọ bụ mgbalị a na-eme ugboro ugboro; okwu a na-egosipụta nke ahụ n’Igbo nkịtị.
- source_word: λέγων
  choice: na-asị
  rationale: Nke a na-edobe participle ahụ ma jikọta okwu Jọn kwuru na mgbalị ọ na-eme igbochi Jizọs.
- source_word: χρείαν ἔχω
  choice: Ọ dị m mkpa
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke e ji asụ Igbo ugbu a iji kwuo na mmadụ nwere mkpa.
- source_word: ὑπὸ σοῦ βαπτισθῆναι
  choice: ka i mee m baptizim
  rationale: Usoro a na-egosi na Jọn bụ onye a ga-eme baptizim, ebe onye ọ na-agwa okwu bụ onye ga-eme ya; ọ dịkwa mfe nghọta n’Igbo.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: ma gị onwe gị na-abịakwute m?
  rationale: “Gị onwe gị” na-egosipụta nkwusi ike dị na σὺ, ebe ajụjụ ahụ na-echekwa ihe ijuanya na ọdịiche dị n’okwu Grik.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ọbịbịa Jizọs na mmeghachi omume Jọn.
theological_decisions:
- issue: Ihe mere Jọn ji jụ ime Jizọs baptizim
  choice: E gosipụtara okwu Jọn n’ụzọ kwụ ọtọ dị ka nkweta na ọ bụ ya kwesịrị ịnata baptizim n’aka Jizọs.
  alternative: Ịkọwa ya kpọmkwem dị ka okwu banyere enweghị mmehie Jizọs ma ọ bụ naanị banyere ọkwa na ikike.
  rationale: Amaokwu ahụ na-egosi na Jọn ghọtara ịdị elu Jizọs na mkpa nke ya, ma ọ kọwaghị ihe ndabere nkà mmụta okpukpe ya n’uju; ya mere, nsụgharị ahụ anaghị edozi esemokwu ahụ karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ihe. “Mee m baptizim” bụ okwu a maara nke ọma, ọ naghịkwa akọwapụta otu e si eme baptizim karịa ihe ederede kwuru.
