source:
  edition: SBLGNT
  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: ig
  text: 'Mgbe ahụ, ndị mmadụ sitere na Jerusalem, Judia niile, na mpaghara niile gbara Jọdan gburugburu nọ na-apụ na-agakwuru ya.[a][b][c]


    [a] A pụkwara ịsụgharị ya, “nọgidere na-apụ na-agakwuru ya.” Ụdị ngwaa Grik e ji mee ihe na-egosi omume gara n’ihu ma ọ bụ nke mere ugboro ugboro.


    [b] Okwu ndị a bụ “Judia niile” na “mpaghara niile gbara Jọdan gburugburu” bụ ụzọ sara mbara e si akọwa na ndị mmadụ si n’ebe ndị a gbakụta Jọn. Ọ pụtaghị na onye ọ bụla bi n’ebe ndị ahụ bịara.


    [c] Ma ọ bụ, “mpaghara gbara Jọdan gburugburu niile.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nọgidere na-apụ na-agakwuru ya.” Ụdị ngwaa Grik e ji mee ihe na-egosi omume gara n’ihu ma ọ bụ nke mere ugboro ugboro.
    reason: lexical_alternative
  - marker: b
    text: Okwu ndị a bụ “Judia niile” na “mpaghara niile gbara Jọdan gburugburu” bụ ụzọ sara mbara e si akọwa na ndị mmadụ si n’ebe ndị a gbakụta Jọn. Ọ pụtaghị na onye ọ bụla bi n’ebe ndị ahụ bịara.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “mpaghara gbara Jọdan gburugburu niile.”
    reason: previous_rendering
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ akara oge na-ejikọta nzaghachi ndị mmadụ na ozi Jọn a kọwara n’amaokwu ndị bu ụzọ.
- source_word: ἐξεπορεύετο
  choice: nọ na-apụ bịakwute
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro n’oge gara aga; “nọ na-apụ” na-echekwa akụkụ a n’Igbo dị mfe.
- source_word: πρὸς αὐτόν
  choice: bịakwute ya
  rationale: N’ebe ngwaa ngagharị dị, πρός na-egosi ịgakwuru mmadụ; “bịakwute ya” bụ ụzọ e si ekwu ya nke ọma n’Igbo.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Aha obodo a bụ ụdị a na-amakarị n’Igbo. E tinyere “ndị mmadụ si” iji mee ka metonymy nke obodo na-anọchi ndị bi na ya doo anya.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: Judia niile
  rationale: Nke a na-echekwa nkọwa sara mbara nke mpaghara ahụ n’ozuzu ya n’ebughị n’uche na onye ọ bụla bịara.
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: mpaghara niile gbara Jọdan gburugburu
  rationale: “Mpaghara” na-enye echiche περίχωρος, ebe “gbara Jọdan gburugburu” na-echekwa njikọ ala ahụ na Jọdan n’Igbo dị eke.
- source_word: καὶ ... καὶ
  choice: usoro ndepụta e ji kọma na “na” ikpeazụ jikọta
  rationale: N’Igbo, usoro a na-ejikọta ebe atọ ahụ n’ụzọ dị larịị ma na-echekwa mmetụta nchịkọta nke καί ugboro ugboro.
theological_decisions:
- issue: Oke ndị ìgwè mmadụ okwu mpaghara ndị a na-ekwu maka ha
  choice: E debere asụsụ sara mbara nke gụnyere mpaghara ndị ahụ n’ozuzu, ma e tinyere “ndị mmadụ si” ka o doo anya na ọ bụ ndị si ebe ndị ahụ na-abịa.
  alternative: Ịsụgharị ya n’ụzọ nkịtị dịka, “Jerusalem, Judia niile, na mpaghara Jọdan niile ... na-apụ.”
  rationale: Asụsụ Grik na-eji aha mpaghara anọchi ndị bi na ha ma na-akọwa nzaghachi juru ebe niile. Nsụgharị a adịghị ekwu na mmadụ niile n’enweghị onye fọdụrụ bịara, ma ọ naghịkwa ebelata ịdị ukwuu nke nzaghachi ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ndị mmadụ si” na-eme ka ojiji aha obodo na mpaghara maka ndị bi na ha doo anya; “nọ na-apụ bịakwute” na-egosipụta omume gara n’ihu nke imperfect.
