  to: 'Mgbe ahụ, ndị mmadụ sitere na Jerusalem, Judia niile, na mpaghara niile gbara Jọdan gburugburu nọ na-apụ na-agakwuru ya.[a][b][c]


    [a] A pụkwara ịsụgharị ya, “nọgidere na-apụ na-agakwuru ya.” Ụdị ngwaa Grik e ji mee ihe na-egosi omume gara n’ihu ma ọ bụ nke mere ugboro ugboro.


