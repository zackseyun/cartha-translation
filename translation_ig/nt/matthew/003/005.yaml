  rationale: The revision retains the source’s temporal marker, imperfect aspect, movement toward John, and cumulative geographical scope. It improves Standard Igbo flow by using a single, clear source construction for the three regions and a natural coordinated movement phrase. Footnotes are retained, with c clarified so its spatial sense is not reversed.
  reviewer_model: gpt-5.6-terra
