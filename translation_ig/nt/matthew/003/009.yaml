- from: Unu echekwala na unu pụrụ ịsị n’etiti onwe unu[a], ‘Ebreham bụ nna anyị.’ N’ihi na ana m agwa unu na Chineke nwere ike isi na nkume ndị a bilitere Ebreham ụmụ.
  to: Unu echekwala na unu pụrụ ịsị n’etiti onwe unu[a], ‘Ebreham bụ nna anyị.’ N’ihi na ana m agwa unu na Chineke nwere ike isi na nkume ndị a welite ụmụ nye Ebreham.
  rationale: The revision replaces only the defective final verbal phrase. “Chineke nwere ike isi na nkume ndị a welite ụmụ nye Ebreham” accurately presents God as the subject able to raise up children from the stones for Abraham. The existing wording and footnote for the disputed scope of ἐν ἑαυτοῖς are retained.
