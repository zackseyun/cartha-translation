id: MAT.3.9
reference: Matthew 3:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: ig
  text: Unu echekwala na unu pụrụ ịsị n’etiti onwe unu[a], ‘Ebreham bụ nna anyị.’ N’ihi na ana m agwa unu na Chineke nwere ike isi na nkume ndị a welite ụmụ nye Ebreham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime onwe unu.” Nkebiokwu Grik a nwere ike ịpụta okwu mmadụ na-ekwu n’obi ya, ma ọ bụ ihe ha na-ekwu n’etiti onwe ha dịka otu ìgwè.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: Unu echekwala na unu pụrụ
  rationale: Nke a na-adọ ha aka ná ntị ka ha ghara ibido ịdabere n’echiche ụgha nke obi siri ha ike na ya; ọ dị eke n’Igbo ma na-eburu ike nke mmachibido ahụ.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: ịsị n’etiti onwe unu
  rationale: Ọ na-egosipụta okwu a na-ekwu n’etiti ìgwè ahụ, ma ihe odide ala peeji na-echekwa ohere na ọ bụ okwu mmadụ na-agwa onwe ya n’obi.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Ebreham bụ nna anyị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo nkwupụta ha banyere agbụrụ na ihe ùgwù nna nna.
- source_word: λέγω γὰρ ὑμῖν
  choice: N’ihi na ana m agwa unu
  rationale: Ọ na-echekwa γάρ dị ka njikọ na-enye ihe kpatara ịdọ aka ná ntị ahụ, ma na-asụ Igbo nke oge a n’ụzọ eke.
- source_word: δύναται
  choice: nwere ike
  rationale: Ọ na-egosipụta ikike na ike Chineke ime ihe ahụ.
- source_word: ἐκ τῶν λίθων τούτων
  choice: isi na nkume ndị a
  rationale: Ọ na-echekwa ihe oyiyi doro anya nke isi n’ihe ndị a kpọrọ nkume nweta ụmụ.
- source_word: ἐγεῖραι
  choice: bilitere
  rationale: N’ebe a okwu ahụ pụtara ime ka ụmụ ma ọ bụ ụmụ ọmụmụ pụta maka Ebreham; ‘bilitere’ na-echekwa ike na ụda nke ngwaa Grik ahụ n’enweghị ikwu na ọ bụ mbilite n’ọnwụ.
- source_word: τέκνα
  choice: ụmụ
  rationale: ‘Ụmụ’ bụ okwu Igbo na-agụnye nwoke na nwanyị ma kwekọọ na ụmụ ma ọ bụ ụmụ ọmụmụ.
- source_word: τῷ Ἀβραάμ
  choice: Ebreham ụmụ
  rationale: Nhazi a na-asụ Igbo n’ụzọ eke ma na-egosi ụmụ ndị a ga-ewere dị ka ụmụ Ebreham.
theological_decisions:
- issue: Ihe ịdabere n’ịbụ ụmụ ọmụmụ Ebreham pụtara n’ịdọ aka ná ntị Jọn
  choice: Amaokwu ahụ na-ajụ ịdabere n’ịbụ ụmụ ọmụmụ Ebreham dị ka ihe zuru ezu n’ihu Chineke, ma ọ naghị agọnahụ na Ebreham bụ nna nna Izrel n’akụkọ ihe mere eme.
  alternative: Ịghọta ya nanị dị ka ikwubiga okwu ókè, ma ọ bụ dị ka nkwupụta na e dochiela Izrel agbụrụ n’onwe ya.
  rationale: Okwu ahụ na-emegide ntụkwasị obi e tinyere n’agbụrụ, ma ọ naghị ekwu usoro nkà mmụta okpukpe banyere iji otu ndị ọzọ dochie Izrel; ntụgharị ahụ hapụrụ esemokwu a ka ọ dị.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Ebreham’ dịka ụdị aha a na-ahụkarị n’Igbo; ahịrịokwu ahụ na-ezere okwu ụka pụrụ iche ma na-echekwa mgbagwoju anya nke ἐν ἑαυτοῖς site n’ihe odide ala peeji.
