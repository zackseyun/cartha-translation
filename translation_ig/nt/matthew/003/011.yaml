id: MAT.3.11
reference: Matthew 3:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: ig
  text: “Mụ onwe m na-eji mmiri eme unu baptizim maka nchegharị[a]; ma onye na-abịa n’azụ m dị ike karịa m, onye m na-adịghị eru iburu akpụkpọ ụkwụ ya. Ya onwe ya ga-eji Mmụọ Nsọ na ọkụ mee unu baptizim[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta “maka nchegharị” dịka “na-eduga ná nchegharị.” Okwu Grik na-egosi ntụzịaka ma ọ bụ ebumnuche, ma ọ naghị akọwa kpọmkwem ma nchegharị ọ̀ na-ebute baptizim ụzọ, ka baptizim ọ̀ na-egosi nchegharị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “na-eji mmiri” na “na-eji Mmụọ Nsọ na ọkụ” dịka “n'ime mmiri” na “n'ime Mmụọ Nsọ na ọkụ.” Ọkụ ahụ nwekwara ike ịbụ ihe oyiyi nke nsacha ma ọ bụ nke ikpe; okwu Grik hapụrụ ihe oyiyi ahụ ghe oghe n'ebe a.
    reason: lexical_and_interpretive_alternative
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: eme … baptizim
  rationale: Ọ bụ okwu a maara nke ọma n'Igbo maka baptizim; ọ naghị ekpebi kpọmkwem usoro e si eme ya, dịka imikpu n'ime mmiri.
- source_word: ἐν ὕδατι
  choice: na-eji mmiri
  rationale: N'Igbo nkịtị, nke a na-egosi mmiri e ji eme baptizim n'ụzọ doro anya. ἐν nwekwara ike igosi ịnọ ‘n'ime mmiri,’ ya mere e debere nke ahụ na nkọwa ala peeji.
- source_word: εἰς μετάνοιαν
  choice: maka nchegharị
  rationale: ‘Maka nchegharị’ na-edobe njikọ na ntụzịaka εἰς n'ụzọ dị nkenke, n'emeghị mkpebi ma nchegharị ọ̀ na-ebute baptizim ụzọ, ka baptizim ọ̀ na-egosi ya.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: onye ahụ nke na-abịa n’azụ m
  rationale: Ọ na-edobe echiche nke onye na-abịa n'usoro mgbe Jọn gasịrị, ma na-ada nke ọma n'Igbo.
- source_word: ἰσχυρότερός μού
  choice: dị ike karịa m
  rationale: Nke a bụ nsụgharị doro anya, nke oge a, maka ntụnyere ike dị n'okwu Grik.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: Erughị m eru
  rationale: Nkebi okwu Igbo a na-egosi na Jọn ahụghị onwe ya dịka onye kwesịrị ekwesị maka ọrụ dị ala ahụ.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: ibu akpụkpọ ụkwụ ya
  rationale: βαστάσαι pụtara ibu ma ọ bụ buru, ọ bụghị iyipụ. ‘Akpụkpọ ụkwụ’ bụ okwu Igbo a na-aghọta nke ọma maka ụdị akpụkpọ ụkwụ a na-ekwu maka ya.
- source_word: αὐτὸς
  choice: Ya onwe ya
  rationale: Ọ na-edobe nkwusi ike na ọdịiche dị n'etiti ihe Jọn na-eme na ihe onye na-abịa ga-eme.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: na-eji Mmụọ Nsọ
  rationale: Ọ bụ ụzọ ebumpụta ụwa e si egosi onye ma ọ bụ ihe e ji eme ihe n'Igbo. ‘Mmụọ Nsọ’ na-egosi onye a na-ekwu maka ya n'ọnọdụ a, n'ebughị nkọwa ozizi ọzọ bata.
- source_word: καὶ πυρί
  choice: na ọkụ
  rationale: Ọ na-edobe njikọ nkịtị nke Mmụọ Nsọ na ọkụ ma hapụ ihe ọkụ ahụ pụtara ka ọnọdụ okwu kọwaa ya.
theological_decisions:
- issue: Ihe ‘Mmụọ Nsọ na ọkụ’ pụtara
  choice: E debere okwu ahụ dịka ‘Mmụọ Nsọ na ọkụ’ n'enweghị mgbakwunye nkọwa n'ahịrịokwu ahụ.
  alternative: Mmụọ Nsọ na ọkụ nke na-asachapụ; ma ọ bụ Mmụọ Nsọ na ọkụ ikpe.
  rationale: Okwu Grik anaghị ekpebi n'onwe ya ma ọkụ ahụ ọ̀ bụ ihe oyiyi nke nsacha ka ọ̀ bụ nke ikpe. Ọnọdụ gbara amaokwu ahụ gburugburu nwere ike ime ka a tụlee ha abụọ, ya mere nsụgharị ahụ ekwesịghị idozi esemokwu ahụ n'ụzọ nzuzo.
- issue: Onye πνεύματι ἁγίῳ na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ dị nsọ; ma ọ bụ ike sitere na Mmụọ Nsọ
  rationale: N'ọnọdụ Matiu a, okwu ahụ kacha mma dịka ntụaka nye Mmụọ Nsọ, ọ bụghị naanị ike na-enweghị onye nwe ya; e tinyeghị nkọwa ozizi gafere ihe odide ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘Mụ onwe m’ na ‘Ya onwe ya’ chekwaa nkwusi ike na ọdịiche dị n'okwu Grik. A họọrọ ‘na-eji’ ka ahịrịokwu ahụ daa nke ọma n'Igbo, ebe nkọwa ala peeji na-echekwa ụzọ ọzọ ‘n'ime.’
