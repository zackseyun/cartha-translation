source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: ig
  text: Ma Jizọs zara ya, sị, “Kwe ka ọ dị otu a ugbu a, n’ihi na ọ bụ otú a ka o kwesịịrị anyị imezu ezi omume[a] niile.” Mgbe ahụ, Jọn kwere ime Jizọs baptizim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ikpe ziri ezi.” Okwu Grik ahụ nwere ike ịpụta ezi omume ma ọ bụ ikpe ziri ezi; n’ebe a, “ezi omume” dabara nke ọma n’ihi na Matiu na-ekwu maka ime ihe kwekọrọ n’uche Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Ma Jizọs zara ya, sị
  rationale: Nke a na-asụgharị akpaalaokwu Grik ahụ n’ụzọ Igbo dị ndụ; “Ma” na-egosi mgbagha megide ihe Jọn kwuru n’amaokwu bu ụzọ.
- source_word: Ἄφες ἄρτι
  choice: Kwere ka o mee otu a ugbu a
  rationale: N’ebe a ἀφίημι pụtara ikwe ka ihe ahụ—ya bụ baptizim ahụ—mee, ọ bụghị ịgbaghara mmehie; “ugbu a” na-echekwa echiche nke ihe kwesịrị ime n’oge ahụ.
- source_word: οὕτως γὰρ
  choice: n’ihi na ọ bụ otú a
  rationale: Ọ na-arụtụ aka n’ụzọ ahụ a ka na-ekwu banyere ya, ya bụ na Jọn ga-eme Jizọs baptizim.
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: ka o si kwesị anyị
  rationale: “Kwesị” na-egosipụta ihe ziri ezi ma dabara adaba n’ọnọdụ ahụ, n’enweghị ịgbakwunye nkọwa ozizi.
- source_word: πληρῶσαι
  choice: imezu
  rationale: “Imezu” na-echekwa ụda Matiu ji okwu πληρόω ekwu maka ime ka nzube Chineke ruo n’uju.
- source_word: πᾶσαν δικαιοσύνην
  choice: ezi omume niile
  rationale: “Ezi omume” bụ okwu Igbo a na-aghọta nke ọma maka δικαιοσύνη n’ebe a, ma ọ ka na-enye ohere maka echiche sara mbara nke ime ihe kwekọrọ n’uche ziri ezi nke Chineke.
- source_word: τότε ἀφίησιν αὐτόν
  choice: Mgbe ahụ, Jọn kwere ya
  rationale: A kọwara onye “ọ” na-anọchi anya ya dị ka Jọn iji gbochie mgbagwoju anya n’Igbo. Okwu ahụ pụtara na Jọn kwetara ime ihe Jizọs rịọrọ, ọ bụghị na ọ hapụrụ ya pụọ.
theological_decisions:
- issue: Ihe “ezi omume niile” pụtara
  choice: Imezu ihe niile kwekọrọ n’uche ziri ezi nke Chineke n’oge a, karịchaa site n’ikwe ka Jọn mee Jizọs baptizim.
  alternative: Imezu iwu niile n’ụzọ dị warara, ma ọ bụ ilekwasị okwu ahụ anya naanị n’ikpe ziri ezi.
  rationale: Ihe gbara amaokwu ahụ gburugburu na ojiji Matiu na-akwado nghọta sara mbara banyere nrubeisi nye nzube Chineke; a naghị eme ka ọ bụrụ naanị idebe iwu ma ọ bụ tinye usoro ozizi na-adịghị n’amaokwu ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “Kwere ka o mee otu a” kama nsụgharị nkịtị nke nwere ike ịdị mgbagwoju anya; e kpọrọ Jọn aha na nkebi ikpeazụ iji mee ka onye mere ihe doo anya.
