revisions:
- from: A nọkwa na-eme ha baptizim n’aka ya n’Osimiri Jọdan[a], ka ha na-ekwupụta mmehie ha.
  to: Ọ nọkwa na-eme ha baptizim[a] n’Osimiri Jọdan, mgbe ha na-ekwupụta mmehie ha.
  rationale: The revision uses an idiomatic Standard Igbo active construction (‘Ọ nọ ... na-eme ha baptizim’) to convey the Greek imperfect passive and its stated agent while retaining the pronoun rather than supplying John’s name. It renders the concurrent participle with ‘mgbe,’ keeps the ritual term ‘baptizim,’ and relocates the footnote anchor to the relevant word.
