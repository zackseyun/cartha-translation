  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: ig
  text: Ọ nọkwa na-eme ha baptizim[a] n’Osimiri Jọdan, mgbe ha na-ekwupụta mmehie ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsị, “E mere ha baptizim”; imperfect Grik nwere ike imesi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro ike: “Ọ nọ na-eme ha baptizim.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: A nọkwa na-eme ha baptizim
  rationale: Ụdị imperfect passive na-egosi omume gara n’ihu ma ọ bụ nke a na-eme ugboro ugboro; ntụgharị a na-egosipụta nke ahụ ma na-edebe “baptizim” dịka okwu emume a maara nke ọma, n’egosighị kpọmkwem otú e si mee ya.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: n’Osimiri Jọdan
  rationale: ἐν na dative bụ ebe omume ahụ mere, ποταμῷ na-akọwakwa Jọdan dịka osimiri.
- source_word: ὑπ’ αὐτοῦ
  choice: n’aka ya
  rationale: ὑπό na genitive na-egosi onye mere omume ahụ; nnọchiaha “ya” na-edebe usoro okwu Grik n’etinyeghị aha Jọn n’amaokwu a.
- source_word: ἐξομολογούμενοι
  choice: ka ha na-ekwupụta
  rationale: Participle a na-egosi ihe ha nọ na-eme n’otu oge ahụ—ikwuputa ma kweta mmehie ha n’ihu ọha.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: mmehie ha
  rationale: Nke a na-edebe ihe okwu ahụ pụtara na plural, ya bụ mmehie nke ha na-ekwupụta.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” jikọtara amaokwu a na akụkọ bu ya ụzọ n’ụzọ dị mma n’Igbo.
theological_decisions:
- issue: Ụdị okwu e ji kọwaa baptizim
  choice: E debere okwu “baptizim” n’akọwaghị usoro e si mee ya.
  alternative: imikpu n’ime mmiri; ịsa ahụ
  rationale: Amaokwu ahụ kwuru na e mere ha baptizim n’Osimiri Jọdan, ma ọ kọwaghị usoro ya n’ụzọ ga-eme ka a họrọ otu echiche ụka pụrụ iche.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E ji “A nọkwa na-eme ha baptizim” gosipụta imperfect passive n’ụzọ nkịtị; “n’aka ya” na-egosi onye mere ya n’enweghị ịkpọ Jọn aha ebe Grik ji nnọchiaha.
