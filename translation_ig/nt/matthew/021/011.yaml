  to: Ìgwè mmadụ ndị ahụ nọ na-ekwu[a], sị, “Onye a bụ Jizọs, onye amụma ahụ, onye si Nazaret dị na Galili.”
  rationale: 'The revision keeps the ongoing sense of ἔλεγον, renders the crowds as a plural group, and makes explicit the Greek apposition: Jesus is identified as ‘the prophet,’ with a separate relative clause identifying him as from Nazareth in Galilee. The footnote preserves the possible indefinite English-like construal without obscuring the Greek definite article or overinterpreting its significance.'
