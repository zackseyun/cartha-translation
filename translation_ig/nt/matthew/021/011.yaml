id: MAT.21.11
reference: Matthew 21:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: ig
  text: Ìgwè mmadụ ndị ahụ nọ na-ekwu[a], sị, “Onye a bụ Jizọs, onye amụma ahụ, onye si Nazaret dị na Galili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ‘onye amụma ahụ’ dịka ‘onye amụma.’ Grik nwere ‘onye amụma ahụ,’ nke nwere ike igosi na ìgwè mmadụ ahụ hụrụ Jizọs dịka onye amụma a maara.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Ìgwè mmadụ ahụ
  rationale: A na-eji ‘ìgwè mmadụ’ sụgharịa ọtụtụ ndị gbakọrọ ọnụ n’Igbo nkịtị. δέ bụ njikọ dị mfe n’akụkọ a; usoro Igbo na-eme ka njikọ ahụ doo anya n’enweghị ịgbakwunye okwu na-adịghị mkpa.
- source_word: ἔλεγον
  choice: nọ na-asị
  rationale: Ụdị imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwu ugboro ugboro; ‘nọ na-asị’ na-echekwa akụkụ ahụ n’Igbo dị mfe nghọta.
- source_word: Οὗτός ἐστιν
  choice: Onye a bụ
  rationale: Nke a bụ ụzọ Igbo sitere n’okike si akọwa onye a na-atụ aka ma mata onye ọ bụ.
- source_word: ὁ προφήτης
  choice: onye amụma ahụ
  rationale: ‘Onye amụma ahụ’ na-echekwa article Grik ahụ na ohere na ìgwè mmadụ ahụ na-akọwa Jizọs dị ka onye amụma a maara ma ọ bụ a na-atụ anya ya, kama ime ka ọ bụrụ naanị otu onye amụma n’etiti ndị ọzọ.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị a na-ejikarị eme ihe n’Igbo.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: si Nazaret nke dị na Galili
  rationale: Nkebiokwu a na-akọwa ebe Jizọs si. ‘Nazaret nke dị na Galili’ bụ Igbo doro anya ma dị n’okike, na-egosikwa njikọ Nazaret na Galili n’enweghị mgbagwoju anya.
theological_decisions:
- issue: Ma a ga-asụgharị ὁ προφήτης dị ka onye amụma a kapịrị ọnụ ka ọ bụ otu onye amụma
  choice: onye amụma ahụ
  alternative: otu onye amụma
  rationale: Grik nwere article ahụ. Nsụgharị bụ ‘onye amụma ahụ’ na-echekwa ohere na okwu ìgwè mmadụ ahụ na-ezo aka n’onye amụma a maara ma ọ bụ a na-atụ anya ya, ma ọ naghị akọwa n’ụzọ karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘nọ na-asị’ iji gosipụta omume gara n’ihu, ma debeghị okwu ndị ga-eme ka ihe ìgwè mmadụ kwetara banyere Jizọs doo anya karịa ihe Grik n’onwe ya kwuru.
