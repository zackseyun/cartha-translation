revisions:
- from: Ha wee jide ya, tụpụ ya n’ubi vaịn ahụ, gbuokwa ya.
  to: Ha jidere ya, tụpụ ya pụọ n’ubi vaịn ahụ, gbuo ya.
  rationale: The revision changes only the locative/directional construction needed to represent “out of the vineyard.” It preserves Matthew’s explicit order—take, cast out, kill—without harmonizing it with the parallel accounts. No footnote is needed in Igbo, since the wording is unambiguous and the English lexical-alternative note does not identify a textual uncertainty requiring transfer.
