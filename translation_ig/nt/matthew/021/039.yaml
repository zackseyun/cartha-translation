  text: καὶ λαβόντες αὐτὸν ἐξέβαλον ἔξω τοῦ ἀμπελῶνος καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: ig
  text: Ha jidere ya, tụpụ ya pụọ n’ubi vaịn ahụ, gbuo ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: Ha wee jide ya
  rationale: Aorist participle a na-egosi ihe mere tupu omume ndị sochirinụ. “Jide” bụ okwu Igbo doro anya nke na-adịghị agbakwụnye ike karịrị ihe okwu Grik kwuru.
- source_word: ἐξέβαλον
  choice: tụpụ ya
  rationale: ἐκβάλλω n’ebe a pụtara ịchụpụ ma ọ bụ ịtụpụ mmadụ n’ebe ọ nọ. “Tụpụ” na-egosi mmegharị ahụ n'ụzọ eke n’Igbo.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: n’ubi vaịn ahụ
  rationale: Mgbe e jikọtara ya na “tụpụ,” nkebiokwu a na-egosi na e si n’ubi vaịn ahụ tụpụ ya. Nhazi Igbo a na-ezere ikwughachi okwu na-enweghị isi ma na-echekwa ntụziaka mmegharị ahụ.
- source_word: ἀμπελῶνος
  choice: ubi vaịn
  rationale: ἀμπελών bụ ubi a na-akụ vaịn; “ubi vaịn” bụ ntụgharị doro anya nye ndị na-agụ Igbo ugbu a.
- source_word: ἀπέκτειναν
  choice: gbuo ya
  rationale: ἀποκτείνω pụtara igbu mmadụ. “Gbuo ya” bụ ntụgharị kpọmkwem, nke na-adịghị agbakwụnye nkọwa dịka ‘gburu ya n’ụzọ mpụ.’
theological_decisions:
- issue: Usoro ịchụpụ nwa ahụ na igbu ya ma e jiri ya tụnyere akụkọ ndị yiri ya
  choice: E buru ụzọ tụpụ ya n’ubi vaịn ahụ, e mesịa gbuo ya.
  alternative: Ime ka usoro ahụ kwekọọ na Mak na Luk site n’ime ka o yie na e buru ụzọ gbuo ya tupu a tụpụ ya.
  rationale: 'Usoro okwu Grik nke Matiu doro anya: λαβόντες … ἐξέβαλον … καὶ ἀπέκτειναν. Ya mere, ntụgharị ahụ na-edebe usoro Matiu kama ijikọta ya na akụkọ ndị ọzọ.'
translation_notes:
  register: Asụsụ Igbo Izugbe, nke oge a, dị mfe ma dị ùgwù. E ji “wee” gosipụta usoro akụkọ n’ụzọ eke; e tinyebeghị akara ntụaka ụkwụ n’ihi na ihe enyere dịka footnote n’asụsụ Bekee anaghị enye ezi nhọrọ dị iche n’ebe λαβόντες nọ, ma enweghị nghọtahie dị mkpa a ga-akọwa n’Igbo.
