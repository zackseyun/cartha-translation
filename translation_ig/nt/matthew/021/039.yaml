review_pass:
  verdict: revise
  source_fidelity: The draft preserves the sequence of taking, expelling, and killing. However, “tụpụ ya n’ubi vaịn ahụ” normally means “throw him into the vineyard,” not “throw him out of the vineyard,” and therefore reverses the directional sense of ἐξέβαλον ἔξω τοῦ ἀμπελῶνος.
  naturalness: “Ha jidere ya, tụpụ ya pụọ n’ubi vaịn ahụ, gbuo ya” is clear, idiomatic Standard Igbo narrative prose. It retains the direct, solemn register appropriate to the parable.
  terminology: “ubi vaịn” is an understandable modern Igbo rendering of ἀμπελών. “Jidere” appropriately renders λαβόντες without unnecessarily implying violent seizure; “tụpụ ... pụọ” accurately expresses physical expulsion; and “gbuo” directly renders ἀπέκτειναν.
  issues:
  - severity: high
    issue: The directional phrase is mistranslated.
    rationale: The draft’s “tụpụ ya n’ubi vaịn ahụ” indicates movement into the vineyard. The Greek explicitly says they cast him outside/out of the vineyard (ἐξέβαλον ἔξω τοῦ ἀμπελῶνος). Adding “pụọ” restores the required outward movement.
  revised_text: Ha jidere ya, tụpụ ya pụọ n’ubi vaịn ahụ, gbuo ya.
