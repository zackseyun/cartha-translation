id: MAT.21.43
reference: Matthew 21:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: ig
  text: N’ihi ya, ana m agwa unu na a ga-anapụ unu alaeze Chineke ma nye mba[a] nke na-amị mkpụrụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu ndị.” Okwu Grik ἔθνει nwere ike ịpụta mba ma ọ bụ otu ndị; n’ebe a, e ji ịmị mkpụrụ mara otu ahụ, ma ekwughị kpọmkwem ndị ha bụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu sitere n’ilu na ihe e hotara tupu amaokwu a; okwu a bụ Igbo dị mfe nke na-echekwa njikọ echiche ahụ.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a bụ ụzọ ebumpụta ụwa n’Igbo ugbu a isi kwuo okwu kpọmkwem nye ọtụtụ mmadụ, ma na-echekwa onye na-ekwu okwu na ndị ọ na-agwa.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: a ga-anapụ unu
  rationale: Ọ na-echekwa ọdịdị okwu nnara na echiche nke iwepụ ihe n’aka ndị nwere ya ugbu a; “ịnapụ” na-egosi mfu ahụ nke ọma n’Igbo.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ nsụgharị doro anya ma bụrụkwa nke a maara nke ọma; ọ hapụrụ βασιλεία ka ọ nwee ma echiche ọchịchị ma echiche ógbè alaeze, kama imechi ya naanị n’otu echiche.
- source_word: δοθήσεται
  choice: nye ya
  rationale: E tinyere “ya” iji mee ka Igbo doo anya na ihe a ga-enye bụ alaeze Chineke, ebe “a ga-” nke dị na ngwaa mbụ ka na-achịkwa usoro nnara nke ngwaa abụọ ahụ.
- source_word: ἔθνει
  choice: mba
  rationale: ἔθνος nwere ike ịpụta mba ma ọ bụ otu ndị. “Mba” bụ okwu kwekọrọ kpọmkwem ma ghara ịkọwa ndị a dị ka Ndị Jentaịl, ụka, ma ọ bụ otu ọzọ n’enweghị ihe odide kwuru ya kpọmkwem.
- source_word: ποιοῦντι τοὺς καρποὺς αὐτῆς
  choice: nke na-amị mkpụrụ ya
  rationale: “Ịmị mkpụrụ” bụ okwu Igbo ebumpụta ụwa maka ihe atụ a ma na-egosi omume na-aga n’ihu. “Ya” na-ezo n’alaeze ahụ, dịka αὐτῆς si eme n’ụzọ kacha kwe omume.
theological_decisions:
- issue: Onye ma ọ bụ ndị “mba” (ἔθνει) na-ezo aka na ha
  choice: E debere ya dịka “mba,” otu ndị e ji ịmị mkpụrụ mara, n’akọwaghị ya karịa.
  alternative: Ụka; Ndị Jentaịl kpọmkwem; ma ọ bụ ndị Chineke e mere ka ha dị ọhụrụ, gụnyere ndị na-eso ụzọ Jizọs.
  rationale: Okwu Grik ahụ na-egosi otu ndị, ma ọ naghị amanye nsụgharị ịkpọ ha otu aha nkà mmụta okpukpe. Nke a na-echekwa nghọta sara mbara na esemokwu dị n’amaokwu ahụ n’etinyeghị ozizi otu ụka.
- issue: Ihe “alaeze Chineke” pụtara n’okwu ikpe a
  choice: E jidere okwu ahụ dịka “alaeze Chineke.”
  alternative: Ọchịchị Chineke; uru dị n’iso ndị Chineke; ma ọ bụ ihe ùgwù nke alaeze ahụ.
  rationale: Ịhapụ okwu ahụ n’ụdị ya na-echekwa obosara echiche βασιλεία ma zere ịkọwa ụdị ihe a na-anapụ ndị a karịa ka Grik si kwuo.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ịmị mkpụrụ” chekwaa ihe atụ nke mkpụrụ, ma e zere okwu pụrụ iche nke otu ụka ma ọ bụ nkọwa nke ga-eme ka “mba” bụrụ naanị Ndị Jentaịl ma ọ bụ ụka.
