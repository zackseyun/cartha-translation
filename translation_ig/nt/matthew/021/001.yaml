id: MAT.21.1
reference: Matthew 21:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: ig
  text: Mgbe ha bịaruru Jerusalem nso ma rute Betfage[a], n’Ugwu Olive, mgbe ahụ Jizọs zigara ndị na-eso ụzọ abụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ha bịaruru Jerusalem nso ma rute Betfage, ruo Ugwu Olive.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν
  choice: bịaruru ... nso
  rationale: Nkebi a na-egosi na ha rutere nso n’ebe ahụ; ọ bụkwa okwu Igbo dị mfe nke na-echekwa echiche ngagharị ịbịaru Jeruselem nso.
- source_word: Ἱεροσόλυμα
  choice: Jeruselem
  rationale: Ụdị aha obodo a a na-ejikarị eme ihe n’Igbo.
- source_word: ἦλθον
  choice: rute
  rationale: N’usoro ebe a, ‘rute’ na-egosi na ha bịara Betfage, ma na-ekewapụkwa ya n’okwu bu ya ụzọ nke pụtara ịbịaru nso.
- source_word: Βηθφαγὴ
  choice: Betfage
  rationale: Nsụgharị ụda aha ebe ahụ n’ụdị dabara n’ọmụmụ na mkpọpụta Igbo.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: n’Ugwu Oliv
  rationale: N’usoro ọdịdị ala nke ahịrịokwu a, nkebi a na-akọwa ebe Betfage dị n’akụkụ Ugwu Oliv; ‘n’Ugwu Oliv’ bụ Igbo eke ma ọ naghị ekwu na ha banyere n’ime ugwu ahụ.
- source_word: τότε
  choice: mgbe ahụ
  rationale: Na-egosi mgbanwe nke akụkọ n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ἀπέστειλεν
  choice: zigara
  rationale: Na-egosi na Jizọs zipụrụ ha ịga mee ihe, nke bụ ihe okwu Grik ahụ pụtara n’akụkọ a.
- source_word: δύο μαθητὰς
  choice: ndị na-eso ụzọ ya abụọ
  rationale: ‘Ndị na-eso ụzọ’ bụ okwu Igbo doro ndị nkịtị anya maka μαθηταί; ‘ya’ na-eme ka njikọ ha na Jizọs doo anya n’Igbo, n’agbanyeghị na nnọchiaha ahụ adịghị iche na Grik.
theological_decisions:
- issue: Onye bụ isiokwu nke ngwaa ọtụtụ tupu a kpọọ Jizọs aha
  choice: E jiri ‘ha’ sụgharịa omume ndị ahụ, e wee kpọọ Jizọs aha n’ebe Grik kpọrọ ya.
  alternative: Ikwupụta ya dịka ‘Jizọs na ndị na-eso ụzọ ya bịaruru...’
  rationale: Grik nwere isiokwu ọtụtụ e zoro ezo, ma ọ kpọghị ‘Jizọs na ndị na-eso ụzọ ya’ aha n’ebe a. Nsụgharị ahụ na-echekwa nkenke na nhazi akụkọ nke isi mmalite.
- issue: Mmekọrịta Betfage na Ugwu Oliv
  choice: ‘Betfage, n’Ugwu Oliv’ ka e ji gosipụta ebe Betfage dị.
  alternative: ‘Betfage, ruo Ugwu Oliv’ ma ọ bụ ‘Betfage, n’akụkụ Ugwu Oliv.’
  rationale: εἰς pụtarakarị ‘gaa/ruo,’ ma n’usoro a nkebi ahụ nwere ike ịkọwa ọnọdụ Betfage n’ihe metụtara Ugwu Oliv. A naghị agbakwunye nkọwa karịrị nke ederede kwuru.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro akụkọ nke Grik, ma zere ịgbakwunye ‘Jizọs na ndị na-eso ụzọ ya’ tupu isi mmalite akpọọ Jizọs aha.
