  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: ig
  text: Ha kpọtara ịnyịnya ibu nwanyị ahụ na nwa ịnyịnya ibu ahụ, wee tọkwasị uwe elu ha n’elu ha; Jizọs wee nọdụ n’elu ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: Ha kpọtara
  rationale: Okwu a pụrụ ịpụta ‘duuru’ ma ọ bụ ‘kpọtara’; ‘kpọtara’ dabara n’akụkọ a ma bụrụkwa Igbo nkịtị.
- source_word: τὴν ὄνον
  choice: nne ịnyịnya ibu ahụ
  rationale: ὄνος bụ ịnyịnya ibu, ebe article nke nwanyị na ọnọdụ amaokwu a na-egosi na ọ bụ nne nke nwa ahụ; ime ka nke a doo anya na-egbochi nghọtahie.
- source_word: τὸν πῶλον
  choice: nwa ya
  rationale: πῶλος bụ nwa anụmanụ; n’ebe a, ọ bụ nwa ịnyịnya ibu ahụ. ‘Nwa ya’ na-egosi njikọ ha n’ụzọ dị mfe ma kwekọọ n’ọnọdụ ahụ.
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: tụkwasị uwe mwụda ha n’elu ha
  rationale: ἱμάτια na-ezo aka n’uwe ndị a na-eyi n’elu uwe ọzọ; ‘uwe mwụda’ bụ okwu Igbo doro anya. ‘Ha’ nke mbụ sitere n’ọnọdụ ahụ, ya bụ uwe ndị na-eso ụzọ.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: Jizọs wee nọdụ n’elu ha
  rationale: E debere nnọchiaha ọtụtụ nke Grik ka a ghara ikpebi n’ederede isi ma ọ na-ezo aka n’anụmanụ abụọ ahụ ma ọ bụ n’uwe ndị ahụ. E jiri ‘Jizọs’ mee ka onye na-eme ihe doo anya n’Igbo.
theological_decisions:
- issue: Ihe nnọchiaha ọtụtụ αὐτῶν ikpeazụ na-ezo aka na ya
  choice: nọdụ n’elu ha
  alternative: nọdụ n’elu uwe ndị ahụ e tụkwasịrị n’anụmanụ abụọ ahụ
  rationale: Grik nwere nnọchiaha ọtụtụ nke nwere ike izo aka n’anụmanụ abụọ ahụ ma ọ bụ n’uwe ndị e tinyere n’elu ha. E chekwara mgbagwoju anya ahụ n’ederede isi, ebe nkọwa ala peeji na-enye nghọta ọzọ a na-ahụkarị.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a ma dị nsọ; ahịrịokwu ahụ bụ nke nkịtị nye ndị na-agụ akwụkwọ. E chekwara ọtụtụ nnọchiaha nke Grik na mgbagwoju anya ya, ma kọwaa okike na njikọ anụmanụ abụọ ahụ n'ụzọ eke n’Igbo.
