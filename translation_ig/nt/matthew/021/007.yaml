review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys that the disciples brought two animals, placed outer garments on them, and that Jesus then sat 'on them.' However, “nne ịnyịnya ibu ahụ na nwa ya” makes the colt explicitly the female donkey’s own offspring. The Greek identifies a female donkey and a colt but does not expressly state that the colt was hers. The supplied possessive should therefore be removed. The final plural reference is appropriately retained as ambiguous, with a suitable footnote.
  naturalness: The revised wording uses clear, contemporary Standard Igbo. “Ịnyịnya ibu nwanyị” explicitly represents the feminine Greek form without asserting motherhood, and “nwa ịnyịnya ibu” communicates πῶλος naturally in this context. “Uwe elu” is a more fitting idiomatic expression for outer garments/cloaks than “uwe mwụda.”
  terminology: Use “ịnyịnya ibu nwanyị” for the female donkey, not “nne ịnyịnya ibu,” since the latter can suggest a maternal relationship. Use “nwa ịnyịnya ibu” for the colt. “Uwe elu” appropriately renders ἱμάτια as outer garments. The final “ha” is retained to preserve the Greek ambiguity between the animals and the garments.
  issues:
  - severity: medium
    issue: “nwa ya” adds an explicit maternal/possessive relationship.
    rationale: Although the narrative pairing may suggest a mother and offspring, τὴν ὄνον καὶ τὸν πῶλον does not explicitly say “her colt.” A translation should not make that relationship explicit in the main text.
  - severity: low
    issue: “nne ịnyịnya ibu” is potentially misleading for the feminine donkey.
    rationale: It can be understood as “mother donkey,” whereas the Greek feminine form only identifies the donkey as female. “Ịnyịnya ibu nwanyị” is more precise.
  - severity: low
    issue: “uwe mwụda” is less precise for ἱμάτια.
    rationale: The Greek denotes outer garments/cloaks; “uwe elu” better conveys this clothing category in Standard Igbo.
  revised_text: Ha kpọtara ịnyịnya ibu nwanyị ahụ na nwa ịnyịnya ibu ahụ, wee tọkwasị uwe elu ha n’elu ha; Jizọs wee nọdụ n’elu ha.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kapịrị ọnụ, “ọ nọdụrụ n’elu uwe ndị ahụ” e tọkwasịrị n’elu anụmanụ abụọ ahụ.
    reason: alternative_reading
  revision_rationale: The revision removes the unsupported assertion that the colt was the female donkey’s own offspring, while retaining both animals and their contextual identification. It also uses more precise Standard Igbo terms for a female donkey, a colt, and outer garments. The final plural pronoun remains deliberately unresolved in the main text, and the footnote preserves the common alternative that Jesus sat on the garments placed on the animals.
