revisions:
- from: Ha kpọtara nne ịnyịnya ibu ahụ na nwa ya[a], tụkwasị uwe mwụda ha n’elu ha, Jizọs wee nọdụ n’elu ha.
  to: Ha kpọtara ịnyịnya ibu nwanyị ahụ na nwa ịnyịnya ibu ahụ, wee tọkwasị uwe elu ha n’elu ha; Jizọs wee nọdụ n’elu ha.
  rationale: The revision removes the unsupported assertion that the colt was the female donkey’s own offspring, while retaining both animals and their contextual identification. It also uses more precise Standard Igbo terms for a female donkey, a colt, and outer garments. The final plural pronoun remains deliberately unresolved in the main text, and the footnote preserves the common alternative that Jesus sat on the garments placed on the animals.
  reviewer_model: gpt-5.6-terra
