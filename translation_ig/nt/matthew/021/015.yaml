id: MAT.21.15
reference: Matthew 21:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: ig
  text: Ma mgbe ndị isi nchụàjà na ndị odeakwụkwọ hụrụ ihe ndị dị ịtụnanya o mere, hụkwa ụmụaka ka ha na-eti mkpu n’ụlọ nsọ[a] na-asị, “Hosanna nye Nwa Devid!”[b] iwe were ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ ἱερόν na-ezo aka n’ogige ụlọ nsọ ahụ dum, ọ bụghị kpọmkwem n’ime ime ebe nsọ ahụ.
    reason: cultural_note
  - marker: b
    text: “Hosanna” sitere n’okwu Hibru nke pụtara ihe dịka “Biko, zọpụta” ma ọ bụ “Zọpụta ugbu a”; ma n’oge a, a na-ejikwa ya dị ka mkpu otuto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: mgbe ... hụrụ
  rationale: Aorist participle a na-egosi ọnọdụ oge metụtara ngwaa bụ isi; ntụgharị a bụ Igbo dị ire ma na-echekwa echiche nke ‘mgbe ha hụrụ.’
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere mgbanwe ma ọ bụ ntụnyere megide ihe mere tupu nke a.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Ọ bụ ọtụtụ ndị ndú n’etiti ndị nchụàjà, ọ bụghị naanị otu nnukwu onye nchụàjà.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nke a bụ okwu Baịbụl a maara nke na-ezo aka n’òtù ndị maara ma na-akọwa Iwu; ọ naghị etinye nkọwa karịrị okwu Grik ahụ n’ahịrị bụ isi.
- source_word: τὰ θαυμάσια
  choice: ihe ndị dị ịtụnanya
  rationale: Ọ na-ezo n’ozuzu ya aka n’omume ndị pụrụ iche ma dị ebube, na-akọwaghị ha naanị dị ka ọrụ ebube.
- source_word: ἐποίησεν
  choice: o mere
  rationale: Ọ na-asụgharị aorist ahụ n’ụzọ dị mfe ma kwekọọ na ‘ihe ndị dị ịtụnanya.’
- source_word: παῖδας
  choice: ụmụaka
  rationale: N’ọnọdụ a, ọ pụtara ụmụaka; ‘ndị ohu’ adabaghị n’ihe a na-akọ, ebe ‘ụmụ nwoke’ ga-eme ka ihe okwu ahụ pụtara dị warara.
- source_word: κράζοντας
  choice: ka ha na-eti mkpu
  rationale: Ọ na-egosi mkpu ọha dara ụda n’enweghị itinye echiche na mkpu ahụ bụ nke iwe ma ọ bụ ọgụ.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ụlọ nsọ
  rationale: Nke a bụ okwu Igbo doro anya maka ebe ụlọ nsọ ahụ, ebe nkọwa ala peeji na-eme ka o doo anya na ἱερόν bụ ogige ụlọ nsọ dum.
- source_word: λέγοντας
  choice: na-asị
  rationale: Ọ na-ejikọta nke ọma na omume ụmụaka nke iti mkpu.
- source_word: Ὡσαννὰ
  choice: Hosanna
  rationale: A hapụrụ ya dị ka mkpu ofufe a nakweere, n’ihi na ọ na-ejikọta arịrịọ maka nzọpụta na iti mkpu otuto; nkọwa ala peeji na-enye ihe ọ pụtara.
- source_word: τῷ υἱῷ Δαυίδ
  choice: nye Nwa Devid
  rationale: ‘Nye’ na-egosi dative nke acclamation ahụ n’ụzọ dị ire n’Igbo, ebe ‘Nwa Devid’ na-echekwa aha Mesaya ahụ n’ụzọ nkịtị.
- source_word: ἠγανάκτησαν
  choice: iwe were ha
  rationale: Ọ bụ okwu Igbo nkịtị ma sie ike nke ọma iji gosi na ihe ahụ kpasuru ha iwe.
theological_decisions:
- issue: Ihe aha ‘Nwa Devid’ pụtara banyere Mesaya
  choice: E debere aha ahụ kpọmkwem dị ka ‘Nwa Devid.’
  alternative: onye nketa Devid; nwa Devid
  rationale: N’akwụkwọ Matiu, okwu ahụ bụ aha a maara nke na-ezo aka na Mesaya; ịkọwa ya n’ụzọ sara mbara ga-ebelata mkpa ya n’akụkọ na n’okwukwe.
- issue: Otú e si sụgharịa Ὡσαννά
  choice: E dere ya ‘Hosanna’ n’ahịrị bụ isi.
  alternative: Biko, zọpụta; Zọpụta ugbu a
  rationale: N’ebe a, okwu ahụ ka nwere mgbọrọgwụ nke arịrịọ maka nzọpụta ma na-arụkwa ọrụ dị ka mkpu otuto. Idegharị ya dịka ‘Hosanna’ na-echekwa akụkụ abụọ ahụ, ebe nkọwa ala peeji na-akọwa ihe ọ pụtara.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E tinyere [a] n’akụkụ ‘ụlọ nsọ,’ bụ ebe nkọwa ya metụtara, tinyekwa [b] n’akụkụ ‘Hosanna.’ A hapụrụ ‘Nwa Devid’ na ‘Hosanna’ ka ha chekwaa ịdị arọ nke aha Mesaya na mgbagwoju pụtara dị n’okwu mbụ.
