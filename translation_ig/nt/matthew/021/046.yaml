source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: ig
  text: Ọ bụ ezie na ha na-achọ ijide ya, ha tụrụ ìgwè mmadụ ahụ egwu, n’ihi na ìgwè mmadụ ahụ weere ya dị ka onye amụma[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ìgwè mmadụ ahụ chere na ọ bụ onye amụma” ma ọ bụ “ìgwè mmadụ ahụ were ya ịbụ onye amụma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: Ọ bụ ezie na ha na-achọ
  rationale: 'Nkesị-okwu dị ugbu a na-egosi ọchịchọ na-aga n’ihu; a sụgharịrị njikọ ya n’ọnọdụ a dị ka nkwenye megidere ihe sochirinụ: ha chọrọ ijide ya, ma egwu gbochiri ha.'
- source_word: κρατῆσαι
  choice: ijide ya
  rationale: N’ọnọdụ iro a, okwu ahụ pụtara ijide mmadụ n’ike ma ọ bụ kpọchie ya. “Ijide ya” bụ okwu Igbo doro anya ma kwekọọ n’echiche ahụ.
- source_word: ἐφοβήθησαν
  choice: ha tụrụ ... egwu
  rationale: Nke a na-enye oge gara aga nke ọma ma debe ìgwè mmadụ dịka ndị ha tụrụ egwu.
- source_word: τοὺς ὄχλους
  choice: ìgwè mmadụ ahụ
  rationale: Ọ bụ ntụgharị Igbo ebumpụta ụwa maka ọtụtụ ndị gbakọrọ ọnụ; n’Igbo, otu mkpụrụokwu a nwere ike ịnọchite anya ọtụtụ ìgwè mmadụ e kwuru n’asụsụ Grik.
- source_word: ἐπεὶ εἰς
  choice: n’ihi na
  rationale: Nkebiokwu a na-ewebata ihe kpatara ha ji tụọ ìgwè mmadụ egwu.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: ndị mmadụ weere ya dị ka onye amụma
  rationale: Nke a na-egosipụta akpaalaokwu ahụ, ya bụ, ile mmadụ anya ma ọ bụ were ya dịka onye nọ n’otu ọnọdụ. E tinyere “ndị mmadụ” ka onye na-eme ihe doo anya n’Igbo, ebe ọ bụ ìgwè mmadụ ahụ ka okwu ahụ na-ezo aka.
- source_word: προφήτην
  choice: onye amụma
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka onye na-ekwuchitere Chineke, ma ọ naghị ekpebi ihe karịrị echiche ìgwè mmadụ banyere Jizọs.
theological_decisions:
- issue: Otu a ga-esi kọwaa echiche ìgwè mmadụ banyere Jizọs dịka προφήτην n’etinyeghị ma ọ bụ n’agọnarịghị ihe amaokwu ahụ na-ekwughị banyere onye ọ bụ
  choice: ndị mmadụ weere ya dị ka onye amụma
  alternative: ndị mmadụ chere na ọ bụ onye amụma
  rationale: Amaokwu ahụ na-akọ echiche ìgwè mmadụ, ọ bụghị nkọwa zuru ezu banyere onye Jizọs bụ. Ya mere, ntụgharị a na-edebe echiche ndị nọ n’akụkọ ahụ ma ọ naghị ekwu na Jizọs bụ naanị onye amụma.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, kwụ ọtọ ma nwee ugwu. Ahịrịokwu ahụ na-edebe esemokwu dị n’etiti ọchịchọ ha ijide Jizọs na egwu ha tụrụ ìgwè mmadụ. Enweghị akara nkọwa ala peeji n’ederede n’ihi na nkọwa ala peeji Bekee e nyere yiri ka ọ kọwara εἰς προφήτην αὐτὸν εἶχον, ọ bụghị “arrest him,” ma ihe ọzọ ọ na-enye bụ naanị ụzọ okwu ndị na-apụtaghị ọdịiche dị mkpa n’Igbo.
