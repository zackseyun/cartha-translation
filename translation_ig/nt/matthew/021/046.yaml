  to: Ọ bụ ezie na ha na-achọ ijide ya, ha tụrụ ìgwè mmadụ ahụ egwu, n’ihi na ìgwè mmadụ ahụ weere ya dị ka onye amụma[a].
  rationale: The revision retains the draft’s faithful and natural treatment of the hostile attempt to seize Jesus and the leaders’ fear, while explicitly retaining the crowds as the subject of their assessment. It also supplies the audit-trail lexical-alternative note with its marker attached to the relevant expression.
