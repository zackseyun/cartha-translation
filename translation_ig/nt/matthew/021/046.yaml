    text: Ma ọ bụ, “ìgwè mmadụ ahụ chere na ọ bụ onye amụma” ma ọ bụ “ìgwè mmadụ ahụ were ya ịbụ onye amụma.”
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s faithful and natural treatment of the hostile attempt to seize Jesus and the leaders’ fear, while explicitly retaining the crowds as the subject of their assessment. It also supplies the audit-trail lexical-alternative note with its marker attached to the relevant expression.
