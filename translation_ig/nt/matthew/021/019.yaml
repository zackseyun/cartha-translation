revisions:
- from: Mgbe ọ hụrụ otu osisi fiig n’akụkụ ụzọ, ọ gakwuuru ya, ma ọ hụghị ihe ọ bụla n’elu ya ma e wezụga naanị akwụkwọ. Ọ sịrị ya, “Ka mkpụrụ ghara isi n’ahụ gị pụta ọzọ ruo mgbe ebighị ebi.”[a] Ozugbo ahụ, osisi fiig ahụ kpọnwụrụ.
  to: Mgbe ọ hụrụ otu osisi fig n’akụkụ ụzọ, ọ gakwuuru ya, ma ọ hụghị ihe ọ bụla n’elu ya ma e wezụga naanị akwụkwọ. Ọ sịrị ya, “Ka mkpụrụ ghara isi n’ime gị pụta ọzọ ruo mgbe ebighị ebi.”[a] Ozugbo ahụ, osisi fig ahụ kpọnwụrụ.
  rationale: 'The revision makes two limited linguistic corrections: it standardizes “fig” and replaces the less natural body-based expression for a tree with an idiomatic expression that still reflects ἐκ σοῦ καρπὸς γένηται (‘may fruit come from you’). The footnote remains a legitimate idiomatic alternative and its anchor is correctly placed after the pronouncement.'
  reviewer_model: gpt-5.6-terra
