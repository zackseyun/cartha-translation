id: MAT.21.19
reference: Matthew 21:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: ig
  text: Mgbe ọ hụrụ otu osisi fig n’akụkụ ụzọ, ọ gakwuuru ya, ma ọ hụghị ihe ọ bụla n’elu ya ma e wezụga naanị akwụkwọ. Ọ sịrị ya, “Ka mkpụrụ ghara isi n’ime gị pụta ọzọ ruo mgbe ebighị ebi.”[a] Ozugbo ahụ, osisi fig ahụ kpọnwụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’okwu Igbo dị mfe karị, “Ka ị ghara ịmị mkpụrụ ọzọ ma ọlị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συκῆν μίαν
  choice: otu osisi fiig
  rationale: “Otu” na-egosipụta μίαν n'ụzọ doro anya ma na-abụkwa okwu Igbo nkịtị mgbe a na-ewebata otu ihe n’akụkọ.
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: n’akụkụ ụzọ
  rationale: Nke a na-egosipụta ọnọdụ osisi ahụ n’ebe ụzọ dị, n’enweghị echiche na osisi ahụ toro kpọmkwem n’etiti ụzọ.
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: ọ gakwuuru ya
  rationale: “Gakwuuru” na-egosipụta mmegharị mmadụ na-abịaru osisi ahụ nso.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ
  choice: ọ hụghị ihe ọ bụla n’elu ya
  rationale: Maka ihe dị n’osisi, “n’elu ya” bụ okwu Igbo dị mma karịa nsụgharị nkịtị nke ἐν.
- source_word: εἰ μὴ φύλλα μόνον
  choice: ma e wezụga naanị akwụkwọ
  rationale: '“Naanị” na-echekwa nkwusi ike nke μόνον: akwụkwọ bụ naanị ihe ọ hụrụ.'
- source_word: λέγει αὐτῇ
  choice: ọ sịrị ya
  rationale: A gbanwere historical present ka ọ bụrụ oge gara aga dịka usoro akụkọ Igbo si adị, n’enweghị mgbanwe n’ihe ọ pụtara.
- source_word: ἐκ σοῦ καρπὸς γένηται
  choice: mkpụrụ ... isi n’ahụ gị pụta
  rationale: Nke a na-echekwa oyiyi nke mkpụrụ na-esi n’osisi ahụ apụta kama ịgbanwe ya ozugbo ka ọ bụrụ naanị “ịmị mkpụrụ.”
- source_word: Μηκέτι ... εἰς τὸν αἰῶνα
  choice: ghara ... ọzọ ruo mgbe ebighị ebi
  rationale: “Ọzọ” na-ebute echiche nke μηκέτι, ebe “ruo mgbe ebighị ebi” na-egosipụta ịdịgide nke εἰς τὸν αἰῶνα.
- source_word: ἐξηράνθη παραχρῆμα
  choice: Ozugbo ahụ ... kpọnwụrụ
  rationale: “Ozugbo ahụ” na-egosipụta ịdị ngwa nke παραχρῆμα, “kpọnwụrụ” bụkwa okwu Igbo kwesịrị ekwesị maka osisi dara ndụ n’ihi nkụ.
theological_decisions:
- issue: Ike na ụdị okwu Jizọs gwara osisi fiig ahụ
  choice: Ka mkpụrụ ghara isi n’ahụ gị pụta ọzọ ruo mgbe ebighị ebi.
  alternative: Ị gaghị amị mkpụrụ ọzọ ruo mgbe ebighị ebi.
  rationale: A họọrọ ụdị okwu ọchịchọ/iwu (“Ka ... ghara”) iji chekwaa subjunctive γένηται na nkwupụta siri ike ahụ, kama ịkọwa ya naanị dịka amụma. E tinyekghị nkọwa ihe atụ nke osisi ahụ n’amaokwu ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A kpọrọ osisi ahụ “osisi fiig” iji doo ụdị osisi ahụ anya. E debere nkwusi ike nke “naanị akwụkwọ” na ịdị ngwa nke osisi ahụ kpọnwụrụ.
