review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the approach to a single fig tree, the finding of nothing except leaves, the imprecatory force and enduring scope of Jesus’ pronouncement, and the tree’s immediate withering. The wording “n’ahụ gị” is understandable but is less idiomatic for fruit issuing from a tree.
  naturalness: The narrative is clear and appropriately formal in Standard Igbo. Correcting the loanword spelling to “fig” and recasting the fruit expression as “site n’ime gị” makes the wording more natural while retaining the source’s ‘fruit come from you’ imagery.
  terminology: “Osisi fig,” “mkpụrụ,” and “kpọnwụrụ” are suitable. “Akwụkwọ” naturally means leaves in this tree context. The jussive “Ka ... ghara” properly conveys the Greek imprecatory subjunctive without imposing an interpretation.
  issues:
  - severity: low
    issue: The tree name is spelled “fiig.”
    rationale: “Fig” is the conventional spelling of this loanword in Standard Igbo Bible-style usage.
  - severity: low
    issue: “Mkpụrụ ghara isi n’ahụ gị pụta” is somewhat marked for a tree.
    rationale: “Site n’ime gị pụta” is a more idiomatic way to preserve the Greek image of fruit coming from the tree, without changing the force or ambiguity of the saying.
  revised_text: Mgbe ọ hụrụ otu osisi fig n’akụkụ ụzọ, ọ gakwuuru ya, ma ọ hụghị ihe ọ bụla n’elu ya ma e wezụga naanị akwụkwọ. Ọ sịrị ya, “Ka mkpụrụ ghara isi n’ime gị pụta ọzọ ruo mgbe ebighị ebi.”[a] Ozugbo ahụ, osisi fig ahụ kpọnwụrụ.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, n’okwu Igbo dị mfe karị, “Ka ị ghara ịmị mkpụrụ ọzọ ma ọlị.”
    reason: lexical_alternative
  revision_rationale: 'The revision makes two limited linguistic corrections: it standardizes “fig” and replaces the less natural body-based expression for a tree with an idiomatic expression that still reflects ἐκ σοῦ καρπὸς γένηται (‘may fruit come from you’). The footnote remains a legitimate idiomatic alternative and its anchor is correctly placed after the pronouncement.'
