- from: 'Geenụ ilu ọzọ a: O nwere otu nwoke nwe ala nke kụrụ ubi vaịn, gbaa ya ogige gburugburu[b], gwuo ebe a na-azọcha mkpụrụ vaịn n''ime ya, ma wuo ụlọ elu[a]. O nyefere ya n''aka ndị ọrụ ubi ka ha gbazie ya[c], wee gaa njem.'
  to: 'Geenụ ilu ọzọ a: Otu nwoke nwe ala kụrụ ubi vaịn, gbaa ya ogige gburugburu[b], gwuo ebe a na-azọcha mkpụrụ vaịn n''ime ya, ma wuo ụlọ elu[a]. Ọ gbazitere ndị ọrụ ubi ubi ahụ[c], wee gaa njem.'
  rationale: The revision corrects the central economic action from an erroneous sense of repairing/correcting to leasing. It also makes the introductory narrative idiomatic without omitting the source’s reference to a male estate owner. The wording retains the Greek sequence, the broad ambiguity of φραγμός, the concrete winepress and tower imagery, and the non-specific destination implied by ἀπεδήμησεν.
