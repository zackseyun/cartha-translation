id: MAT.21.33
reference: Matthew 21:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: ig
  text: 'Geenụ ilu ọzọ a: Otu nwoke nwe ala kụrụ ubi vaịn, gbaa ya ogige gburugburu[b], gwuo ebe a na-azọcha mkpụrụ vaịn n''ime ya, ma wuo ụlọ elu[a]. Ọ gbazitere ndị ọrụ ubi ubi ahụ[c], wee gaa njem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ihe oyiyi nke ịkụ ubi vaịn, ịgba ya ogige gburugburu, igwu ebe a na-azọcha mkpụrụ vaịn, na iwu ụlọ elu na-echetara Aịzaya 5:1–2.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “gbaa ya ngere gburugburu,” ma ọ bụ “kụọ oke osisi gburugburu ya.” Okwu Grik ahụ nwere ike ịpụta ụdị ihe mgbochi dị iche iche e ji mechie ubi.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “gbazinye ndị ọrụ ubi ubi ahụ.” Nke a pụtara na o nyere ndị na-akọ ubi ahụ ubi ahụ ka ha rụọ ya dịka ndị mgbazinye.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: Geenụ ilu ọzọ a
  rationale: Ụdị iwu ọtụtụ mmadụ nke ἀκούσατε pụtara ka ha gee ntị; “ilu” bụ okwu Igbo dị mfe ma kwesị ekwesị maka παραβολή n'ozizi Jizọs.
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: O nwere otu nwoke nwe ala
  rationale: N'ọnọdụ ubi vaịn a, οἰκοδεσπότης bụ onye nwe ala ma ọ bụ ihe onwunwe; ahịrịokwu a na-ada ka Igbo nkịtị ma na-edobe na ọ bụ nwoke.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: kụrụ ubi vaịn
  rationale: Nke a na-edobe ihe oyiyi doro anya nke ịkụ ubi vaịn, dịkwa nso na okwu Grik.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: gbaa ya ogige gburugburu
  rationale: “Ogige” na-egosi ihe e ji mechie ma chebe ubi ahụ n'ebughị ụzọ kpebie na ọ bụ mgbidi, ngere, ma ọ bụ oke osisi.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: gwuo ebe a na-azọcha mkpụrụ vaịn n'ime ya
  rationale: Nkọwa ọrụ a na-eme ka ληνός doo onye Igbo nke oge a anya ma na-edobe omume igwu ebe a na-apịpụta mmanya vaịn.
- source_word: ᾠκοδόμησεν πύργον
  choice: wuo ụlọ elu
  rationale: “Ụlọ elu” na-asụgharị πύργος n'enweghị ịgbakwunye ọrụ nche nke ederede Grik ekwughị kpọmkwem.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: nyefere ya n'aka ndị ọrụ ubi ka ha gbazie ya
  rationale: Nke a na-egosi na ndị ọrụ ubi ahụ natara ubi ahụ n'usoro mgbazinye iji rụọ ya, ọ bụghị na ha bụ naanị ndị ọrụ ụbọchị.
- source_word: ἀπεδήμησεν
  choice: wee gaa njem
  rationale: Ọ na-egosi ịhapụ ebe obibi gaa ebe ọzọ n'ebughị ụzọ tinye ebe ọ gara, nke Grik ekwughị.
theological_decisions:
- issue: Ihe oyiyi ubi vaịn nke na-echetara Aịzaya 5:1–2
  choice: Idobe ihe niile gbasara ubi n'ụzọ doro anya, ma kọwaa njikọ ahụ n'okpuru peeji.
  alternative: Iji okwu ọdịnala karị ma ọ bụ ikwu Aịzaya kpọmkwem n'ime ahịrịokwu.
  rationale: Ederede ahụ na-echetara Aịzaya nke ukwuu, ma ịkpọpụta nkọwa ahụ n'ime isi ederede ga-etinye nkọwa karịrị ihe Matiu kwuru kpọmkwem.
- issue: Ụdị ihe e ji gbaa ubi ahụ gburugburu
  choice: ogige
  alternative: ngere, oke osisi, ma ọ bụ mgbidi
  rationale: φραγμός anaghị ekpebi kpọmkwem ihe e ji mee ihe mgbochi ahụ; “ogige” na-echekwa obosara ihe okwu ahụ nwere.
- issue: Ọnọdụ ndị γεωργοί n'ọrụ ubi
  choice: ndị ọrụ ubi natara ya ka ha gbazie ya
  alternative: ndị ọrụ ubi nkịtị ma ọ bụ ndị mgbazinye ubi
  rationale: ἐξέδετο na-egosi usoro mgbazinye, ma isi ederede kwesịrị ịdị mfe ma ghara ịkọwa usoro akụ na ụba ahụ karịa ka Grik mere.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. E ji “ubi vaịn” na nkọwa “ebe a na-azọcha mkpụrụ vaịn” zere okwu mgbazinye Bekee na-enweghị isi doo anya. E debere akara nkọwa niile [a], [b], na [c] n'isi ederede.
