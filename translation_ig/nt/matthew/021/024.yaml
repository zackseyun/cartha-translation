  to: Ma Jizọs zara ha, sị, “Mụ kwa ga-ajụ unu otu ajụjụ[a]. Ọ bụrụ na unu aza m ya, mụ kwa ga-agwa unu ikike dị aṅaa ka m ji eme ihe ndị a.”
  rationale: The revision restores the explicit interrogative sense of ἐν ποίᾳ ἐξουσίᾳ, moderates the rendering of κἀγώ to its reciprocal force, and supplies an anchored lexical note for λόγον ἕνα. No doctrinal interpretation has been added.
