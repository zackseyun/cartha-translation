    text: Ma ọ bụ “otu okwu” ma ọ bụ “otu ihe a na-ekwu.” N'ụzọ nkịtị, Grik λόγον ἕνα pụtara “otu okwu,” ma n'ọnọdụ a ọ pụrụ izo aka n'ajụjụ ma ọ bụ ihe a na-atụle.
    reason: lexical_alternative
