  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: ig
  text: Ma Jizọs zara ha, sị, “Mụ kwa ga-ajụ unu otu ajụjụ[a]. Ọ bụrụ na unu aza m ya, mụ kwa ga-agwa unu ikike dị aṅaa ka m ji eme ihe ndị a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “otu okwu” ma ọ bụ “otu ihe a na-ekwu.” N'ụzọ nkịtị, Grik λόγον ἕνα pụtara “otu okwu,” ma n'ọnọdụ a ọ pụrụ izo aka n'ajụjụ ma ọ bụ ihe a na-atụle.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ma Jizọs zara ha, sị
  rationale: A tụgharịrị njikọ participle na ngwaa okwu ahụ dịka okwu Igbo sitere n'okike; “Ma” na-egosi ntakịrị mgbagha dị na δέ, ebe “zara ha, sị” na-echekwa ma nzaghachi ahụ ma mmalite okwu kpọmkwem.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: Mụ onwe m ga-ajụkwa unu
  rationale: “Ga-ajụ” na-egosi ọdịnihu nke Ἐρωτήσω; “-kwa” na “mụ onwe m” na-eme ka nzaghachi ibe ya dị na κἀγώ pụta ìhè.
- source_word: λόγον ἕνα
  choice: otu ajụjụ
  rationale: Ọ bụ ezie na λόγος nwere ike ịpụta “okwu” ma ọ bụ “ihe a na-ekwu,” ọnọdụ mkparịta ụka a na-egosi ajụjụ Jizọs ga-ajụ; “otu ajụjụ” bụ Igbo doro anya ma kwesị ntụkwasị obi n'ọnọdụ a.
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: Ọ bụrụ na unu aza m ya
  rationale: N'ọnọdụ ajụjụ, εἴπητέ μοι pụtara inye Jizọs azịza. Igbo “aza m ya” na-enye echiche ahụ n'ụzọ sitere n'okike ma na-echekwa ọnọdụ “ọ bụrụ na.”
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: mụ onwe m ga-agwakwa unu
  rationale: “Ga-agwa” na-anọchi ἐρῶ, ebe “-kwa” na “mụ onwe m” na-echekwa ntụnyere na nkwekọrịta nzaghachi dị na κἀγώ.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ikike m ji
  rationale: N'Igbo, usoro “ikike m ji eme” na-egosi ikike ma ọ bụ ikike nyere mmadụ nke ọ na-adabere na ya ime ihe; ọ bụ ntụgharị sitere n'okike nke ‘site n'ikike dị aṅaa.’
- source_word: ταῦτα ποιῶ
  choice: eme ihe ndị a
  rationale: “Ihe ndị a” na-echekwa ọtụtụ ihe dị na ταῦτα, ebe “eme” na-egosi omume Jizọs ndị a na-ajụ maka ha.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “otu ajụjụ” kama ntụgharị nkịtị “otu okwu” n'ihi ọrụ λόγον ἕνα na-arụ n'ọnọdụ a; enweghị nkọwa ụka pụrụ iche etinyere.
