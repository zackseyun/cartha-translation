  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: ig
  text: Ha wee sị ya, “Ị na-anụ ihe ndị a na-ekwu?” Ma Jizọs sịrị ha, “Ee. Ọ̀ dịtụbeghị mgbe unu gụrụ, ‘Site n’ọnụ ụmụntakịrị na ụmụ ọhụrụ na-aṅụ ara ka i kwadebere otuto’?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jizọs na-ehota Abụ Ọma 8:2 dịka ọdịnala Akwụkwọ Nsọ Grik si dị. A na-asụgharịkarị ihe odide Hibru, “Site n’ọnụ ụmụntakịrị na ụmụ ọhụrụ na-aṅụ ara ka i hiwere ike.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: Ị na-anụ
  rationale: Ọ bụ ajụjụ dị n’oge ugbu a; ‘Ị na-anụ’ bụ Igbo nkịtị nke na-echekwa aka mgba dị n’ajụjụ ahụ.
- source_word: τί οὗτοι λέγουσιν
  choice: ihe ndị a na-ekwu
  rationale: Nke a na-echekwa omume na-aga n’ihu nke λέγουσιν na ntakịrị ụda nlelị dị na οὗτοι, n’etinyeghị aha ọzọ na-adịghị na Grik.
- source_word: λέγει
  choice: Jizọs sịrị
  rationale: Ọ bụ ezie na Grik ji historical present, Igbo akụkọ nkịtị na-eji ‘sịrị’; nke a na-eme ka okwu ahụ doo anya ma ghara ịdị ka ihe na-eme ugbu a.
- source_word: Ναί
  choice: Ee
  rationale: Ọ bụ nzaghachi nkwenye dị mfe ma kwụ ọtọ.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: Ọ̀ dịtụbeghị mgbe unu gụrụ
  rationale: Nke a bụ ajụjụ nkwugide sitere n’ịmata Akwụkwọ Nsọ, ma na-echekwa ụda ịbara ha mba.
- source_word: Ἐκ στόματος
  choice: Site n’ọnụ
  rationale: Ọ na-egosipụta isi mmalite otuto ahụ n’ụzọ Igbo dị mma ma na-agbaso nkebiokwu Grik.
- source_word: νηπίων
  choice: ụmụntakịrị
  rationale: Okwu a na-ezo aka n’ụmụaka dị obere; ‘ụmụntakịrị’ na-ekewapụ ha n’ụmụ ọhụrụ na-aṅụ ara a kpọrọ n’usoro sochirinụ.
- source_word: θηλαζόντων
  choice: ụmụ ọhụrụ na-aṅụ ara
  rationale: Nke a na-echekwa ihe oyiyi nke ụmụ na-enye ara n’asụsụ Igbo nke oge a ma doo anya.
- source_word: κατηρτίσω
  choice: i si kwadebe
  rationale: ‘Kwadebe’ na-egosipụta ime ka ihe dị njikere ma ọ bụ iweta ya n’usoro, dịka okwu Grik dị n’ihe Matiu hotara.
- source_word: αἶνον
  choice: otuto
  rationale: ‘Otuto’ bụ aha nkịtị doro anya maka praise n’Igbo.
theological_decisions:
- issue: Ụdị okwu e hotara n’Abụ Ọma 8:2 n’arụmụka Jizọs
  choice: 'E debere okwu Grik Matiu ji: ‘i si kwadebe otuto’ n’isi ederede.'
  alternative: 'Ụdị dabere n’ihe odide Hibru: ‘i hiwere ike.’'
  rationale: A ghaghị ịsụgharị okwu ahụ dịka Matiu si nye ya, n’emeghị ka ọ kwekọọ n’ike na ihe odide Hibru; e debere ọdịiche ahụ n’ala peeji maka ndị maara ụdị ọzọ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E ji ‘sịrị’ maka historical present ka usoro akụkọ wee bụrụ nke ebumpụta ụwa n’Igbo. Akara ala peeji [a] dị n’isi ederede mgbe ngụpụta ahụ gasịrị.
