revisions:
- from: Ha wee sị ya, “Ị na-anụ ihe ndị a na-ekwu?” Ma Jizọs sịrị ha, “Ee. Ọ̀ dịtụbeghị mgbe unu gụrụ, ‘Site n’ọnụ ụmụntakịrị na ụmụ ọhụrụ na-aṅụ ara ka i si kwadebe otuto’?”[a]
  to: Ha wee sị ya, “Ị na-anụ ihe ndị a na-ekwu?” Ma Jizọs sịrị ha, “Ee. Ọ̀ dịtụbeghị mgbe unu gụrụ, ‘Site n’ọnụ ụmụntakịrị na ụmụ ọhụrụ na-aṅụ ara ka i kwadebere otuto’?”[a]
  rationale: The sole revision removes “si,” which can imply manner and is not represented in the Greek, and uses the direct past form “kwadebere” for κατηρτίσω. The Psalm-textual difference remains clearly and neutrally documented in the footnote.
  reviewer_model: gpt-5.6-terra
