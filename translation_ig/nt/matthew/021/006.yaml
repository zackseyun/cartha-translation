base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/006.yaml
  text: So the disciples went and did just as Jesus had instructed them[a].
translation:
  language: ig
  text: Ndị na-eso ụzọ ahụ wee gaa mee dịka Jizọs nyere ha ntụziaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nyere ha iwu.” Ngwaa Grik ahụ nwere ike ịpụta inye iwu ma ọ bụ inye ntụziaka; n’ebe a, ọnọdụ okwu ahụ kwadoro “nyere ha ntụziaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: gara
  rationale: Aorist participle a na-egosi omume mbụ tupu ime ihe ahụ; n’akụkọ Igbo, “gara” na-enye usoro ahụ n'ụzọ eke.
- source_word: δὲ
  choice: Ya mere
  rationale: δὲ na-aga n’ihu n’akụkọ ma jikọta omume ndị na-eso ụzọ ahụ na ntụziaka Jizọs nyere ha tupu nke a.
- source_word: οἱ μαθηταὶ
  choice: ndị na-eso ụzọ ahụ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa μαθηταί, ya bụ ndị na-amụta ihe n’aka Jizọs ma na-eso ya.
- source_word: ποιήσαντες
  choice: mee
  rationale: “Mee” na-egosipụta omume ahụ nkenke ma na-agakọ nke ọma na nkebiokwu na-esochi ya.
- source_word: καθὼς
  choice: kpọmkwem ihe
  rationale: N’usoro “mee kpọmkwem ihe...,” okwu a na-egosi na ha mere ihe kwekọrọ n’ihe Jizọs nyere n’iwu, n’etinyeghị ihe ọzọ.
- source_word: συνέταξεν
  choice: nyere ha ntụziaka ka ha mee
  rationale: συντάσσω nwere ike ịpụta inye iwu ma ọ bụ ntụziaka. N’ebe a, okwu a na-ezo aka na ntụziaka zuru ezu Jizọs nyere n’amaokwu ndị bu ụzọ.
- source_word: αὐτοῖς
  choice: ha
  rationale: “Ha” bụ nnọchiaha dabara adaba maka ndị na-eso ụzọ ahụ dịka ndị natara ntụziaka ahụ.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: A sụgharịrị aha ahụ n’ụdị a na-ejikarị eme ihe n’Igbo Standard.
