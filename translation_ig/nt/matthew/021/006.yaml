revisions:
- from: Ya mere, ndị na-eso ụzọ ahụ gara mee kpọmkwem ihe Jizọs nyere ha ntụziaka ka ha mee.[a]
  to: Ndị na-eso ụzọ ahụ wee gaa mee dịka Jizọs nyere ha ntụziaka.[a]
  rationale: The revision replaces the overly causal transition with the natural narrative connective “wee” and streamlines the obedience clause. It retains the source’s sequence—disciples went and acted in conformity with Jesus’ directions—and preserves the lexical alternative for συνέταξεν in the footnote.
  reviewer_model: gpt-5.6-terra
