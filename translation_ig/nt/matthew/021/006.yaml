translation_notes:
  register: Asụsụ Igbo Standard dị ugbu a, dị ugwu ma doo ndị mmadụ nkịtị anya. E debere usoro akụkọ ahụ n’ụzọ eke, ma chekwaa ohere nghọta abụọ dị na συνέταξεν site n’ihe odide ala peeji.
