  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his servants; one they beat[a], another they killed, and another they stoned.
translation:
  language: ig
  text: Ndị ọrụ ubi vaịn ahụ wee jide ndị ohu ya[a]; ha tiri otu onye ihe, gbuo onye ọzọ, ma tụọ onye ọzọ nkume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ndị na-ejere ya ozi.” Okwu Grik ahụ bụ δούλοι; ọ pụrụ ịpụta “ndị ohu” ma ọ bụ “ndị na-eje ozi,” dị ka ọnọdụ okwu si dị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: ndị ọrụ ubi vaịn ahụ
  rationale: N'ọnọdụ ilu a, okwu ahụ na-ezo aka ná ndị na-arụ ma na-elekọta ubi vaịn nke onye nwe ya. Nhọrọ a na-egosi ọrụ ugbo ha ma na-adabara okwu Igbo nkịtị.
- source_word: λαβόντες
  choice: wee jide
  rationale: Ọ bụ omume mere tupu ihe ndị sochiri ya; “wee jide” na-egosi usoro ahụ n'ụzọ doro anya ma na-eburu ike nke ijide mmadụ.
- source_word: δούλους
  choice: ndị ohu ya
  rationale: “Ohu” na-egosi na ndị a nọ n'okpuru ikike onye nwe ubi ma bụrụ ndị ozi ya. Ihe odide Grik nwekwara ike ịpụta ndị na-eje ozi dabere n'ọnọdụ, ya mere e tinyere nkọwa ala peeji.
- source_word: ἔδειραν
  choice: tiri otu onye ihe
  rationale: Nke a bụ ụzọ Igbo sitere n'okike isi kwuo na a kụrụ mmadụ ihe, na-akọwaghị ụdị iti ahụ karịa ka okwu Grik kwuru.
- source_word: ἀπέκτειναν
  choice: gbuo onye ọzọ
  rationale: Ọ na-enye ihe okwu Grik pụtara kpọmkwem n'ụzọ dị mfe ma ghara ịgbakwunye echiche ikpe iwu dị ka ‘igbu ọchụ.’
- source_word: ἐλιθοβόλησαν
  choice: tụkwaa onye ọzọ nkume
  rationale: Nhọrọ a na-egosi iji nkume wakpo onye ahụ, ma ọ naghị ekwu n'onwe ya na onye ahụ nwụrụ, ebe okwu Grik lekwasịrị anya n'omume ịtụ nkume.
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: otu onye ... onye ọzọ ... onye ọzọ
  rationale: Usoro a na-egosi nke ọma na e mesoro ndị ohu dị iche iche ihe dị iche iche.
theological_decisions:
- issue: Otú e si sụgharị δοῦλος n'ilu a
  choice: ndị ohu
  alternative: ndị na-ejere ya ozi
  rationale: Ndị a bụ ndị nọ n'okpuru ikike onye nwe ubi, ndị o zigara dị ka ndị nnọchiteanya ya. “Ndị ohu” na-echekwa ọnọdụ ahụ nke ọma, ebe nkọwa ala peeji na-egosi ohere okwu ahụ nwere ịpụta ndị na-eje ozi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. A haziri ahịrịokwu ahụ ka usoro omume atọ ahụ doo anya, ma e zere ikwu na onye e tụrụ nkume nwụrụ mgbe okwu Grik n'onwe ya ekwughị nsonaazụ ahụ kpọmkwem.
