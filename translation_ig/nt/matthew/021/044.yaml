  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: ig
  text: Onye ọ bụla dara n’elu nkume a, a ga-agbaji ya agbaji; ma ọ bụrụ na nkume a adakwasị onye ọ bụla[b], ọ ga-egwepịa ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-eme ka ihe oyiyi ahụ pụta ìhè karị, “ọ ga-egwe ya ka ọ ghọọ ntụ” ma ọ bụ “ọ ga-achụsasị ya dịka igbogbo ọka.”
    reason: lexical_alternative
  - marker: b
    text: Amaokwu a adịghị n’ụfọdụ ihe odide aka ochie nke Matiu, ọ bụ ezie na e nwere okwu yiri ya na Luk 20:18.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: Onye ahụ nke dakwasịrị
  rationale: Nkebi participle a nwere article na-arụ ọrụ dị ka aha ma na-ezo aka n’otu onye n’ụzọ izugbe; nsụgharị a na-edobe otu onye ahụ na ike ilu okwu ahụ.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: nkume a
  rationale: A họọrọ “nkume” iji kwekọọ kpọmkwem na λίθος ma chekwaa njikọ ya na ihe atụ nkume dị n’okwu gbara amaokwu a gburugburu.
- source_word: συνθλασθήσεται
  choice: ga-etipịa
  rationale: Ụdị future passive ahụ na-egosi na a ga-agbaji onye ahụ nke ukwuu; “ga-etipịa” na-ekwupụta nke a n’Igbo nkịtị ma ghara ime ka ngwaa abụọ ahụ bụrụ otu ihe.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: ma onye ọ bụla nkume ahụ dakwasịrị
  rationale: 'Nke a na-agbanwe onye na-ada: ugbu a nkume ahụ bụ ihe na-adakwasị mmadụ. “Onye ọ bụla” na-edobe echiche indefinite relative nke ἄν.'
- source_word: λικμήσει
  choice: ọ ga-egwepịa ya
  rationale: Ngwaa ahụ nwere ike ịpụta ịkụpịa kpamkpam, ọbụna ime ka ihe ghọọ ntụ ma ọ bụ gbasaa dịka igbogbo ọka; “egwepịa” bụ okwu doro anya ma sie ike n’Igbo.
- source_word: αὐτόν
  choice: ya
  rationale: Nnochiaha Igbo “ya” na-ezo aka n’otu onye ahụ n’enweghị ịgbanwe ya ka ọ bụrụ ọtụtụ mmadụ.
theological_decisions:
- issue: Ihe atụ nkume na ikpe
  choice: E debere “nkume” n’ụzọ pụtara ihe, tinyere omume abụọ nke mbibi, n’enweghị nkọwa mgbakwunye.
  alternative: Ịkpọ nkume ahụ Mesaya ma ọ bụ Jizọs kpọmkwem n’ahịrị amaokwu ahụ, ma ọ bụ ime ka ngwaa abụọ ahụ bụrụ nanị otu echiche mbibi.
  rationale: Ọnọdụ gbara amaokwu a gburugburu na-akọwa nkume ahụ, ma amaokwu a n’onwe ya na-ekwu dịka ilu. Nsụgharị ahụ na-echekwa ihe atụ ahụ na ịdị njọ nke ikpe n’etinyeghị nkọwa nkà mmụta okpukpe n’ime ederede.
- issue: Ntụaka otu onye n’ụzọ izugbe
  choice: E ji “onye” na “ya” debe ntụaka otu onye.
  alternative: Ịgbanwe ya ka ọ bụrụ ọtụtụ mmadụ ma ọ bụ okwu na-enweghị onye kpọmkwem.
  rationale: Grik ji otu onye nwoke n’usoro izugbe; Igbo “onye…ya” na-echekwa otu onye ahụ n’ụzọ eke, ebe “ya” anaghị amanye okike nwoke ma ọ bụ nwaanyị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro ihe atụ nkume ahụ na ọdịiche dị n’etiti “itipịa” na “igwepịa.” Akara [b] so nkebi nwere ọdịiche ederede; akara [a] so ngwaa λικμήσει nke nkọwa okwu ọzọ metụtara.
