    text: Ma ọ bụ, n’ụzọ na-eme ka ihe oyiyi ahụ pụta ìhè karị, “ọ ga-egwe ya ka ọ ghọọ ntụ” ma ọ bụ “ọ ga-achụsasị ya dịka igbogbo ọka.”
    reason: lexical_alternative
