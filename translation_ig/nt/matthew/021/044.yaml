revisions:
- from: Onye ahụ nke dakwasịrị nkume a ga-etipịa; ma onye ọ bụla nkume ahụ dakwasịrị[b], ọ ga-egwepịa ya[a].
  to: Onye ọ bụla dara n’elu nkume a, a ga-agbaji ya agbaji; ma ọ bụrụ na nkume a adakwasị onye ọ bụla[b], ọ ga-egwepịa ya[a].
  rationale: The revision makes the first verb explicitly passive and preserves its sense of being broken to pieces. It also uses more idiomatic Standard Igbo while maintaining the source’s generic singular reference, the contrast between falling on the stone and the stone falling on someone, and the stronger second verb. Footnote anchors continue to identify the lexical alternative for λικμήσει and the textual-variant note for the verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:37Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the two-direction stone image and distinguishes the severe outcomes. However, “ga-etipịa” is active/transitive in ordinary Igbo and does not adequately express the Greek future passive συνθλασθήσεται. The first clause should explicitly convey that the person will be broken to pieces.
  naturalness: “Onye ahụ nke dakwasịrị” is understandable but unnecessarily heavy and can be less clear than a straightforward relative construction. “Onye ọ bụla dara n’elu nkume a” and “ọ bụrụ na nkume a adakwasị onye ọ bụla” are natural Standard Igbo and clearly reverse the direction of impact.
  terminology: “Nkume” appropriately renders λίθος. “A ga-agbaji ya agbaji” reflects being broken to pieces, while “ọ ga-egwepịa ya” retains the stronger pulverizing sense of λικμήσει. The wording remains metaphorical and adds no doctrinal interpretation.
  issues:
  - severity: medium
    issue: The rendering “ga-etipịa” does not clearly express the passive force of συνθλασθήσεται.
    rationale: The Greek says that the person falling on the stone will undergo the breaking. In Igbo, “ga-etipịa” readily reads as an active verb (‘will crush/break something’) rather than ‘will be broken to pieces.’
  - severity: low
    issue: The first relative clause is overly literal and the reversal in the second clause can be stated more transparently.
    rationale: Using “onye ọ bụla dara n’elu nkume a” and then making “nkume a” the explicit subject of “adakwasị” clearly preserves the contrast in the Greek without altering its open-ended sense.
  revised_text: Onye ọ bụla dara n’elu nkume a, a ga-agbaji ya agbaji; ma ọ bụrụ na nkume a adakwasị onye ọ bụla[b], ọ ga-egwepịa ya[a].
  revised_footnotes:
