revisions:
- from: Gwanụ ada Zaịọn, sị ya, “Lee, eze gị na-abịakwute gị; ọ dị nwayọọ[a], ọ nọkwasị n’elu ịnyịnya ibu, n’elu nwa ịnyịnya ibu[b], bụ́ nwa anụ e ji ebu ibu.”
  to: Sịnụ ada Zaịọn, “Lee, eze gị na-abịakwute gị, dị nwayọọ ma nọkwasịrị n’elu ịnyịnya ibu na n’elu nwa ịnyịnya ibu, bụ nwa anụ e ji ebu ibu.”
  rationale: The revision retains every substantive element of the Greek and the draft’s register, while making the quotation introduction smoother, restoring the explicit linkage of the two animal phrases, and correcting the form describing the king as mounted. Footnote anchors remain attached to “dị nwayọọ” and “nwa ịnyịnya ibu,” respectively.
