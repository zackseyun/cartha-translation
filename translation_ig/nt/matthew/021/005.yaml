id: MAT.21.5
reference: Matthew 21:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: ig
  text: Sịnụ ada Zaịọn, “Lee, eze gị na-abịakwute gị, dị nwayọọ ma nọkwasịrị n’elu ịnyịnya ibu na n’elu nwa ịnyịnya ibu, bụ nwa anụ e ji ebu ibu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴπατε
  choice: Gwanụ ... sị ya
  rationale: Na-egosi iwu e nyere ọtụtụ mmadụ ma na-eme ka okwu ahụ bụrụ Igbo dị ndụ na nke doro anya.
- source_word: τῇ θυγατρὶ Σιών
  choice: ada Zaịọn
  rationale: Na-edobe etu amụma ahụ si mee Zaịọn ka ọ bụrụ mmadụ, kama ịgbanwe ya gaa n’ụmụ amaala Jerusalem.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Okwu Igbo dị nkenke nke na-adọta uche n’ihe na-abịa.
- source_word: ὁ βασιλεύς σου
  choice: eze gị
  rationale: Na-edobe nnọchiaha onye nke abụọ na mkpa ọchịchị eze dị n’amaokwu ahụ.
- source_word: ἔρχεταί σοι
  choice: na-abịakwute gị
  rationale: Na-egosi na ọ na-abịa kpọmkwem n’ebe ada Zaịọn nọ, ma na-edobe ịdị ugbu a nke ngwaa Grik.
- source_word: πραῢς
  choice: ọ dị nwayọọ
  rationale: Na-egosi ịdị umeala na ịdị nro nke eze ahụ n’Igbo nkịtị; ihe okwu ahụ nwekwara ike ịpụta ka akọwara n’ala ala peeji.
- source_word: ἐπιβεβηκὼς
  choice: ọ nọkwasị
  rationale: Na-egosi ọnọdụ onye ahụ nọ mgbe ọ rịgoro n’anụmanụ ahụ, n’asụsụ Igbo na-aga were were.
- source_word: ἐπὶ ὄνον
  choice: n’elu ịnyịnya ibu
  rationale: “Ịnyịnya ibu” bụ aha Igbo a na-aghọta nke ọma maka ὄνος.
- source_word: πῶλον
  choice: nwa ịnyịnya ibu
  rationale: Ọnọdụ okwu ndị so ya na-egosi na nwa anụmanụ a bụ nwa ịnyịnya ibu; nsụgharị a doro ndị na-agụ ya anya karịa okwu sara mbara maka nwa anụmanụ.
- source_word: υἱὸν ὑποζυγίου
  choice: bụ́ nwa anụ e ji ebu ibu
  rationale: Na-edobe ụzọ okwu Semitik nke na-akọwa nwa anụmanụ ahụ dị ka nwa anụ a na-eji ebu ibu, n’enweghị iji “nwa nwoke” n’ụzọ siri ike.
theological_decisions:
- issue: Amaokwu a bụ ihe e hotara n’amụma Zekaraya 9:9; ajụjụ bụ ma a ga-eme ka okwu Matiu kwekọọ n’ụdị Agba Ochie ma ọ bụ belata okwu anụmanụ abụọ ahụ.
  choice: 'Edobere okwu Matiu n’ụdị ya: “ọ dị nwayọọ ... n’elu ịnyịnya ibu, n’elu nwa ịnyịnya ibu, bụ́ nwa anụ e ji ebu ibu.”'
  alternative: A pụrụ ịsụgharị πραῢς ka “onye dị umeala n’obi,” ma ọ bụ were okwu anụmanụ abụọ ahụ dị ka naanị otu nkọwa ma ghara igosipụta njikọ “na/n’elu” nke Matiu.
  rationale: Nsụgharị ahụ kwesịrị iso ihe odide Grik nke Matiu n’onwe ya, ghara ime ka ọ kwekọọ n’amaghị ama na nsụgharị Zekaraya. A hapụrụ njikọ nke okwu anụmanụ abụọ ahụ ka esemokwu na nkọwa dị n’ihe odide ahụ ghara ịla n’iyi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ada Zaịọn” na-edobe ihe atụ amụma ahụ; “Lee” na-enye oku a na-akpọ uche n’enweghị ụda okwu ochie gabiga ókè. E tinyere akara [a] na [b] kpọmkwem n’ebe ha metụtara.
