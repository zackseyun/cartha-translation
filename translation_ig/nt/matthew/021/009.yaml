id: MAT.21.9
reference: Matthew 21:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: ig
  text: Ìgwè mmadụ ndị na-aga n'ihu ya na ndị na-eso ya nọ na-eti mkpu, na-asị, “Hosanna[a] nye Nwa Devid![b] Ngọzi dịrị onye na-abịa n'aha Onyenwe anyị![c] Hosanna n'ebe kachasị elu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hosanna” bụ mkpu sitere n'okwu Hibru nke pụtara ihe dịka “biko, zọpụta” ma ọ bụ “zọpụta ugbu a”; ma n'ebe a, a na-eji ya dịka mkpu otuto.
    reason: lexical_alternative
  - marker: b
    text: “Nwa Devid” bụ aha eze a na-eji akpọ Mesaịa ahụ.
    reason: cultural_note
  - marker: c
    text: Okwu a na-ekwughachi Abụ Ọma 118:26; n'ederede Hibru nke Abụ Ọma ahụ, “Onyenwe anyị” nọchiri anya aha Chineke, YHWH.
    reason: cross_reference
lexical_decisions:
- source_word: ὄχλοι
  choice: ìgwè mmadụ
  rationale: Nke a bụ okwu Igbo doro anya maka ọtụtụ mmadụ gbakọtara ọnụ, ma ọ naghị ada ka okwu ochie.
- source_word: προάγοντες αὐτόν
  choice: ndị na-aga n'ihu ya
  rationale: Ọ na-egosi ndị nọ n'ihu Jizọs n'usoro njem ahụ, n'ebughị echiche na ha bụ ndị ndu ya.
- source_word: ἀκολουθοῦντες
  choice: ndị na-eso ya
  rationale: Ọ bụ nsụgharị dị mfe nke na-adabara ndị na-aga n'ihu ya ma na-echekwa ọnọdụ usoro njem ahụ.
- source_word: ἔκραζον λέγοντες
  choice: nọ na-eti mkpu, na-asị
  rationale: “Nọ na-eti mkpu” na-egosipụta omume na-aga n'ihu nke imperfect ἔκραζον; “na-asị” na-echekwa λέγοντες n'Igbo dị mfe.
- source_word: Ὡσαννά
  choice: Hosanna
  rationale: E debere mkpu ofufe a dịka aha a na-akpọ ya, ebe nkọwa ala peeji na-akọwa arịrịọ Hibru dị n'okpuru ya.
- source_word: τῷ υἱῷ Δαυίδ
  choice: nye Nwa Devid
  rationale: “Nye” na-egosipụta dative ahụ n'ụzọ dabara n'Igbo, ebe “Nwa Devid” na-echekwa aha eze na Mesaịa ahụ n'emeghị ya nkọwa ọzọ.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Onye a gọziri agọzi ka ọ bụ, bụ onye na-abịa
  rationale: Nke a na-echekwa onye otu mkpụrụokwu Grik na echiche nke onye ahụ na-abịa, ma na-adịkwa nsọpụrụ n'Igbo.
- source_word: ἐν ὀνόματι κυρίου
  choice: n'aha Onyenwe anyị
  rationale: Ọ na-echekwa okwu “n'aha” na ịdị arọ nke ikike Chineke, tinyere njikọ ya na Abụ Ọma 118:26.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị eme κύριος mgbe ọ na-ezo aka n'ebe Chineke nọ; nkọwa ala peeji na-echekwa ndabere aha YHWH n'Abụ Ọma.
- source_word: ἐν τοῖς ὑψίστοις
  choice: n'ebe kachasị elu
  rationale: Ọ na-echekwa ịdị mkpụmkpụ na ebube nke okwu Grik ahụ n'ekwughị kpọmkwem karịa ederede ma ọ bụ eluigwe kasị elu.
theological_decisions:
- issue: Aha eze na Mesaịa dị na τῷ υἱῷ Δαυίδ
  choice: E debere “Nwa Devid” dịka aha e nyere ya.
  alternative: “nye Mesaịa”
  rationale: Ederede Grik kwuru kpọmkwem “Nwa Devid.” Idebe ya na-echekwa akụkọ ihe mere eme na echiche banyere eze sitere n'agbụrụ Devid n'etinyeghị nkọwa n'ime ahịrị ederede.
- issue: Nsụgharị Ὡσαννά
  choice: E debere “Hosanna” n'ahịrị ederede, kọwaa ihe ọ pụtara na nkọwa ala peeji.
  alternative: “Biko, zọpụta anyị” ma ọ bụ “Zọpụta ugbu a”
  rationale: N'ọnọdụ a, ọ bụ mkpu ofufe na otuto, ọ bụghị naanị arịrịọ doro anya maka nzọpụta. Idebe ụdị okwu ahụ na-echekwa ụda ofufe na njikọ Akwụkwọ Nsọ ya.
- issue: Ihe κυρίου na-ezo aka na ntụaka Abụ Ọma
  choice: A sụgharịrị ya “Onyenwe anyị,” ebe nkọwa ala peeji kwuru maka YHWH.
  alternative: Idepụta aha Chineke YHWH kpọmkwem n'ahịrị ederede
  rationale: Ederede Grik nwere κυρίου. Nsụgharị “Onyenwe anyị” na-eso ederede Agba Ọhụrụ, ebe nkọwa ala peeji na-echekwa ndabere Hibru nke Abụ Ọma 118:26.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. E chekwara usoro njem ahụ, omume mkpu na-aga n'ihu, aha Mesaịa “Nwa Devid,” na ịdị omimi nke mkpu “Hosanna.”
