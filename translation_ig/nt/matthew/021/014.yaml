- from: Ndị ìsì na ndị ngwọrọ bịakwutere ya n’ogige ụlọnsọ ukwu[a], ọ gwọkwara ha.
  to: Ndị ìsì na ndị ngwọrọ bịakwutere ya n’ụlọ nsọ[a], ọ gwọkwara ha.
  rationale: The revision keeps the Greek’s broad reference to the temple complex in the main text, using natural Standard Igbo, while the footnote preserves the distinction that ἱερόν does not specifically mean the inner sanctuary.
