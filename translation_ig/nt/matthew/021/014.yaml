  text: Καὶ προσῆλθον αὐτῷ ⸂τυφλοὶ καὶ χωλοὶ⸃ ἐν τῷ ἱερῷ, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: ig
  text: Ndị ìsì na ndị ngwọrọ bịakwutere ya n’ụlọ nsọ[a], ọ gwọkwara ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ἱερόν na-ezo aka n’ogige na akụkụ ndị ọzọ nke ụlọ nsọ ahụ, ọ bụghị kpọmkwem n’ebe nsọ dị n’ime ụlọ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: bịakwutere ya
  rationale: Nkebi okwu a na-egosi na ha bịara nso n’ebe Jizọs nọ. “Bịakwutere ya” bụ Igbo doro anya ma dịkwa eke.
- source_word: τυφλοὶ
  choice: ndị ìsì
  rationale: Adjective a nọchiri anya ọtụtụ ndị mmadụ na-adịghị ahụ ụzọ; “ndị ìsì” na-ebupụta ya nkenke ma doo anya.
- source_word: χωλοὶ
  choice: ndị ngwọrọ
  rationale: Okwu a na-ekwu maka ndị na-enweghị ike ịga ije nke ọma; “ndị ngwọrọ” bụ okwu Igbo a na-aghọta nke ọma.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ogige ụlọnsọ ukwu
  rationale: ἱερόν na-ezo aka n’ebe niile dị n’ime ogige ụlọnsọ ukwu, ọ bụghị kpọmkwem ebe nsọ dị n’ime ya. Nsụgharị a na-eme ka ọdịiche ahụ pụta ìhè n’Igbo.
- source_word: ἐθεράπευσεν αὐτούς
  choice: ọ gwọkwara ha
  rationale: θεραπεύω n’akụkọ ọrụ ebube ndị Oziọma pụtara ịgwọ ọrịa. “Ọ gwọkwara ha” bụ okwu Igbo dị mfe ma kwesịrị ekwesị.
theological_decisions:
- issue: Ebe ọgwụgwọ ahụ mere dịka ἱερόν si kwuo
  choice: Jizọs gwọrọ ha n’ogige ụlọnsọ ukwu.
  alternative: Jizọs gwọrọ ha n’ụlọnsọ ukwu.
  rationale: ἱερόν na-egosikarị ogige na akụkụ niile nke ụlọ nsọ ahụ, ọ bụghị naanị ebe nsọ dị n’ime. Ya mere, “ogige ụlọnsọ ukwu” na-ezere echiche na ha banyere n’ebe nsọ ahụ kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ụlọnsọ ukwu” na-egosi ụlọ nsọ dị na Jerusalem, ebe “ogige” na-echekwa nkọwa sara mbara nke ἱερόν.
