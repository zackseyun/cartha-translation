id: MAT.21.21
reference: Matthew 21:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: ig
  text: Ma Jizọs zara ha sị, “N’ezie, ana m asị unu, ọ bụrụ na unu enwee okwukwe ma ghara inwe obi abụọ[a], ọ bụghị naanị ihe e mere osisi fig ahụ ka unu ga-eme, kama ọ bụrụgodị na unu asị ugwu a, ‘Ka e bulie gị, ka a tụbakwa gị n’ime oké osimiri,’ ọ ga-eme.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ma ghara ịma jijiji” ma ọ bụ “ma ghara ikewa obi unu abụọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Ma Jizọs zara ha sị
  rationale: “Zara ha sị” na-egosi na okwu Jizọs bụ nzaghachi, ebe “Ma” na-ebute ntughari dị nro nke δέ n’akụkọ ahụ.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: N’ezie, ana m asị unu
  rationale: Nke a na-edobe ịdị arọ na nkwenye pụrụ iche nke usoro okwu Jizọs, ma bụrụkwa Igbo doro anya nke oge a.
- source_word: ἐὰν ἔχητε πίστιν
  choice: ọ bụrụ na unu enwee okwukwe
  rationale: “Okwukwe” na-egosi ntụkwasị obi n’ebe Chineke nọ n’ọnọdụ a, ọ bụghị nanị omume nke ikwesị ntụkwasị obi.
- source_word: μὴ διακριθῆτε
  choice: ghara inwe obi abụọ
  rationale: N’ọnọdụ a, ngwaa ahụ na-egosi obi ịla azụ ma ọ bụ inwe obi abụọ. A na-edobe nghọta ndị ọzọ kwe omume n’okpuru amaokwu.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: ọ bụghị naanị ihe e mere osisi fig ka unu ga-eme
  rationale: Okwu Grik ahụ hapụrụ ụfọdụ okwu n’amaghị ama ma na-ezo aka n’ihe mere osisi fig n’akụkọ dị n’ihu. Nsụgharị a na-eme ka ntụaka ahụ doo anya n’enweghị ịgbasa ya gabiga ihe e dere.
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: kama ọ bụrụgodị na unu asị ugwu a
  rationale: “Ọ bụrụgodị” na-egosi mgbasawanye siri ike site n’osisi fig ruo n’ihe atụ ka ukwuu, ebe “ugwu a” na-edobe mkpụrụokwu ngosi ahụ.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: Ka e bulie gị tụba gị n’ime oké osimiri
  rationale: Usoro a na-edobe olu nnara nke iwu abụọ ahụ na onyinyo anụ ahụ nke ibuli ugwu ma tụba ya n’oké osimiri.
- source_word: γενήσεται
  choice: ọ ga-eme
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma kwekọọ n’echiche na ihe e kwuru ga-emezu.
theological_decisions:
- issue: Nkọwa πίστις n’okwu gbasara omume dị ebube
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N’ebe a okwu ahụ na-elekwasị anya na ntụkwasị obi siri ike, ọ bụghị àgwà nke ikwesị ntụkwasị obi n’onwe ya.
- issue: Ụdị okwu Jizọs banyere ịkwaga ugwu
  choice: Idowe okwu ahụ dịka onyinyo siri ike n’enweghị ikpebi ma ọ bụ naanị ihe nkịtị ma ọ bụ naanị ihe atụ
  alternative: Nkwa a ga-ewere naanị dịka ọrụ ebube nkịtị; ma ọ bụ naanị dịka ihe atụ nke imeri nsogbu
  rationale: Ihe odide ahụ ji onyinyo doro anya ma sie ike kwuo okwu. Nsụgharị ahụ anaghị ebelata ya ma ọ bụ kpebie esemokwu nkọwa ahụ n’ụzọ nke otu ozizi.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ onyinyo ugwu na oké osimiri n’ụdị siri ike nke isi mmalite ahụ, a zerekwa okwu ochie ma ọ bụ nkọwa nke otu ụka.
