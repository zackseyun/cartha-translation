  to: Ma Jizọs zara ha sị, “N’ezie, ana m asị unu, ọ bụrụ na unu enwee okwukwe ma ghara inwe obi abụọ[a], ọ bụghị naanị ihe e mere osisi fig ahụ ka unu ga-eme, kama ọ bụrụgodị na unu asị ugwu a, ‘Ka e bulie gị, ka a tụbakwa gị n’ime oké osimiri,’ ọ ga-eme.”
  rationale: E megharịrị naanị okwu e kwuru nye ugwu ahụ ka iwu nnara abụọ dị na Grik pụta ìhè ma Igbo ya bụrụ nke okike. E tinyekwara “ahụ” n’osisi fig iji mee ka ntụaka elliptical ahụ doo anya. A gbanwere ihe edeturu n’ala peeji ka nhọrọ ndị ọzọ maka διακριθῆτε bụrụ Igbo doro anya ma na-edobe echiche nke ịma jijiji ma ọ bụ obi ekewara ekewa.
