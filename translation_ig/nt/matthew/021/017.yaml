  text: καὶ καταλιπὼν αὐτοὺς ἐξῆλθεν ἔξω τῆς πόλεως εἰς Βηθανίαν, καὶ ηὐλίσθη ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: ig
  text: Ọ hapụrụ ha, si n’obodo ahụ pụọ gaa Betani, nọrọ ebe ahụ n’abalị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “rahụrụ n'ebe ahụ” ma ọ bụ “nọrọ n'ebe ahụ ruo chi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλιπὼν αὐτοὺς
  choice: Ọ hapụrụ ha
  rationale: Aorist participle ahụ na-egosi ihe mere tupu isi ngwaa; usoro a bụ Igbo nkịtị ma debe nnọchiaha ahụ n’enweghị nkọwa agbakwunyere.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: si n’obodo ahụ pụọ
  rationale: Nke a na-egosipụta mmegharị isi n’ime obodo pụọ n’asụsụ Igbo doro anya, na-enweghị ikwughachi okwu n’ụzọ na-adịghị eke.
- source_word: εἰς Βηθανίαν
  choice: gaa Betani
  rationale: ‘Gaa’ na-egosipụta ntụziaka ebe a na-aga, ebe ‘Betani’ bụ nsụgharị aha ebe ahụ n’ụdị Igbo.
- source_word: ηὐλίσθη ἐκεῖ
  choice: nọọkwa ebe ahụ n’abalị
  rationale: Ngwaa ahụ pụtara ịnọ ma ọ bụ ịrahụ n’otu ebe n’abalị; nhọrọ a bụ asụsụ Igbo dị mfe ma na-eburu nkọwa oge ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ugwu. E ji usoro ahịrịokwu dị mfe mee ka ọ bụrụ ihe ndị nkịtị ga-aghọta, ebe a ka debere usoro omume na nghọta sara mbara nke ηὐλίσθη.
