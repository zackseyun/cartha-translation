review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the comprehensive object, prayer, belief, and future reception. However, «na-ekwere» is a somewhat awkward free-standing participial phrase in this sentence. Rendering πιστεύοντες as «n’okwukwe» preserves its contemporaneous, faith-related sense without turning it into an explicit conditional clause. «ga-arịọ» more clearly carries the indefinite prospective force of ἂν with the aorist subjunctive than a past-oriented reading of «rịọrọ» may do in modern Igbo.
  naturalness: «Ihe ọ bụla unu ga-arịọ n’ekpere n’okwukwe, unu ga-anata ya» is fluent, modern Standard Igbo and retains the elevated but accessible biblical register. It avoids a dangling participial construction while maintaining the close relation between asking and believing.
  terminology: «Ekpere», «okwukwe», and «ịnara» are established and natural Standard Igbo biblical terms. The note uses «partisipi» as the appropriate Igbo grammatical technical term.
  issues:
  - severity: medium
    issue: The phrase «na-ekwere» is syntactically awkward after the comma.
    rationale: Although it reflects the Greek participle formally, it does not connect idiomatically in this Igbo clause. «n’okwukwe» expresses the same accompanying manner without making faith an explicit if-condition.
  - severity: low
    issue: «unu rịọrọ» can be read as past-oriented in modern Igbo.
    rationale: The Greek indefinite relative construction concerns whatever the hearers may ask. «unu ga-arịọ» naturally communicates this prospective open-ended scope.
  revised_text: Ihe ọ bụla[a] unu ga-arịọ n’ekpere n’okwukwe[b], unu ga-anata ya.
  revised_footnotes:
