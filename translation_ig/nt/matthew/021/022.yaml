  text: καὶ πάντα ὅσα ⸀ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: ig
  text: Ihe ọ bụla[a] unu ga-arịọ n’ekpere n’okwukwe[b], unu ga-anata ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe niile unu ga-arịọ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “na-ekwere”; partisipi Grik ahụ na-egosi na okwukwe na-esonyere arịrịọ ahụ mgbe a na-ekpe ekpere.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: Ihe ọ bụla
  rationale: 'Ngwakọta okwu a bụ ụzọ Grik si ekwu ihe zuru ezu ma na-emegheghị oke: ‘ihe ọ bụla’ ma ọ bụ ‘ihe niile.’ ‘Ihe ọ bụla’ bụ okwu Igbo dị mfe ma na-edobe obosara ihe okwu ahụ pụtara.'
- source_word: ἂν αἰτήσητε
  choice: unu rịọrọ
  rationale: ἄν tinyere aorist subjunctive na-egosi arịrịọ ọ bụla nke a pụrụ ịrịọ n’ahịrịokwu na-akọwaghị otu ihe kpọmkwem. ‘Unu rịọrọ’ na-ada nke ọma n’Igbo n’usoro ‘ihe ọ bụla unu rịọrọ,’ n’enweghị ịgbakwunye echiche modal siri ike.
- source_word: ἐν τῇ προσευχῇ
  choice: n’ekpere
  rationale: Nke a bụ ntụgharị Igbo doro anya ma bụrụ nke a na-ejikarị eme ihe maka ikpe ekpere; ọ naghị eme ka article Grik bụrụ ihe e kwesịrị ịsụgharị dị ka otu ekpere a kapịrị ọnụ.
- source_word: πιστεύοντες
  choice: na-ekwere
  rationale: Present participle ahụ na-egosi nkwere na-aga n’otu oge ahụ ha na-arịọ. ‘Na-ekwere’ na-edobe ọdịdị participle ahụ kama ịgbanwe ya ka ọ bụrụ ọnọdụ doro anya dịka ‘ọ bụrụ na unu ekwere.’
- source_word: λήμψεσθε
  choice: unu ga-anata ya
  rationale: Future nke λαμβάνω pụtara na ha ga-anata ihe ahụ ha rịọrọ. ‘Ịnata’ dabara n’ọkwa asụsụ dị ùgwù karịa okwu ndị nkịtị dịka ‘ịnweta.’ Mkpọaha ‘ya’ na-ezo aka n’otu okwu mkpokọta ‘ihe ọ bụla.’
theological_decisions:
- issue: Mmekọrịta dị n’etiti okwukwe na ịza ekpere
  choice: na-ekwere
  alternative: ọ bụrụ na unu ekwere
  rationale: Grik ji participle jikọta okwukwe na ịrịọ arịrịọ; o jighị ahịrịokwu ọnọdụ doro anya. Ntụgharị a na-edobe njikọ ahụ na esemokwu nkà mmụta okpukpe dị na ya n’enweghị ịkọwa usoro ma ọ bụ oke nke ịza ekpere karịa ihe ederede kwuru.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị mfe ma dị ùgwù. E debere participle ‘na-ekwere’ iji mee ka usoro Grik na njikọ okwukwe na ekpere ghara ịghọ ọnọdụ e kwuru hoo haa.
