reference: Matthew 21:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: ig
  text: Ma mgbe ndị gbazitere ubi vaịn ahụ hụrụ nwa nwoke ahụ, ha gwara ibe ha, sị, “Onye a bụ onye nketa ahụ. Ngwanụ, ka anyị gbuo ya, wegharakwa ihe nketa ya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara nnọọ n’okwu Grik, “ka anyị nweta ihe nketa ya”; n’ọnọdụ a, ihe ọ pụtara bụ iwere ya n’ike ka ọ bụrụ nke ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: ndị gbazitere ubi vaịn ahụ
  rationale: N’ọnọdụ ilu a, okwu a na-ezo aka ná ndị natara ubi vaịn ahụ n’usoro mgbazinye ka ha rụọ ya, ọ bụghị naanị ndị ọrụ ugbo nkịtị. Nhọrọ a na-eme ka ọrụ ha na onye nwe ubi doo anya n’Igbo.
- source_word: ἰδόντες
  choice: mgbe ... hụrụ
  rationale: E ji ahịrịokwu oge sụgharịa participle aorist ahụ n’Igbo dị ire, ka usoro ihe omume ahụ pụta ìhè.
- source_word: τὸν υἱόν
  choice: nwa nwoke ahụ
  rationale: Nke a na-asụgharị ‘the son’ n’enweghị itinye nnọchiaha nwe nke na-adịghị n’okwu Grik; ihe ndị gbara ya gburugburu na-eme ka mmekọrịta ya na onye nwe ubi doo anya.
- source_word: ἐν ἑαυτοῖς
  choice: ha gwara ibe ha
  rationale: N’ebe a, okwu ahụ pụtara na ha kwurịtara ihe ahụ n’etiti onwe ha; nke a bụ ụzọ Igbo dị ndụ si egosipụta echiche ahụ.
- source_word: κληρονόμος
  choice: onye nketa
  rationale: ‘Onye nketa’ bụ okwu Igbo doro anya maka onye iwu kwadoro ịnata ihe nketa.
- source_word: δεῦτε
  choice: Ngwanụ
  rationale: N’ebe a δεῦτε bụ okwu agbamume na-akpọ ndị otu ahụ ime ihe ọnụ; ‘Ngwanụ’ na-arụ ọrụ ahụ nke ọma n’Igbo karịa iwu ka ha bịa n’ụzọ nkịtị.
- source_word: ἀποκτείνωμεν
  choice: ka anyị gbuo
  rationale: Nke a na-edobe ụdị agbamume nke subjunctive ahụ ma na-asụgharị ngwaa ahụ n’enweghị ịgbakwunye echiche ikpe iwu nke okwu Grik ekwughị kpọmkwem.
- source_word: σχῶμεν
  choice: wegharakwa
  rationale: Ọ bụ ezie na ngwaa ahụ sitere n’echiche ‘inwe,’ ọnọdụ a na-egosi iburu ihe ahụ n’ike mgbe e gbuchara onye nketa. ‘Weghara’ na-egosipụta nke ahụ n’Igbo dị ire.
- source_word: κληρονομίαν αὐτοῦ
  choice: ihe nketa ya
  rationale: ‘Ihe nketa’ na-ejikọta nke ọma na ‘onye nketa,’ ebe ‘ya’ na-egosipụta αὐτοῦ kpọmkwem.
theological_decisions:
- issue: Ihe nwa nwoke ahụ nọchiri anya ya n’ilu
  choice: A sụgharịrị υἱός naanị dịka “nwa nwoke ahụ,” n’emeghị ka ntụaka Kraịst pụta ìhè n’ime amaokwu ahụ.
  alternative: Ịsụgharị ya n’ụzọ nkọwa nke ga-ekwupụta na nwa nwoke ahụ na-anọchite anya Jizọs.
  rationale: N’agbanyeghị na akụkọ Matiu na-eduga onye na-agụ ya ịhụ Jizọs n’ilu a, amaokwu ahụ n’onwe ya ka na-ekwu n’ogo akụkọ ilu. Nsụgharị ahụ na-edobe okwu ilu ahụ na esemokwu nkà mmụta okpukpe ya n’enweghị itinye nkọwa n’ime ederede.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. “Ndị gbazitere ubi vaịn ahụ” na-akọwa ọnọdụ ndị ahụ dịka ndị tenant n’enweghị okwu teknụzụ siri ike; “Ngwanụ” na-eweta agbamume ọnụ nke δεῦτε n’ụzọ Igbo ebumpụta ụwa.
