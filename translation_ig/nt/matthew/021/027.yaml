  to: Ha wee zaa Jizọs sị, “anyị amaghị.” Ya onwe ya wee sịkwa ha, “Mụ onwe m agaghịkwa agwa unu ikike dị aṅaa ka m ji eme ihe ndị a.”
  rationale: The revision adds “dị aṅaa ka” to represent ποίᾳ (“what/which”) explicitly. All other elements are retained because they adequately convey the reply, the reciprocal force of Jesus’ response, and the plural “these things.”
