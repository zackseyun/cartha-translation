id: MAT.21.27
reference: Matthew 21:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: ig
  text: Ha wee zaa Jizọs sị, “anyị amaghị.” Ya onwe ya wee sịkwa ha, “Mụ onwe m agaghịkwa agwa unu ikike dị aṅaa ka m ji eme ihe ndị a.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: Ha wee zaa
  rationale: Ọ na-egosi nzaghachi ha; usoro a bụ Igbo nkịtị ma na-edobe ọrụ participle ahụ n’usoro akụkọ.
- source_word: Οὐκ οἴδαμεν
  choice: Anyị amaghị
  rationale: Nke a na-asụgharị nkwupụta agọnahụ ihe ọmụma ahụ ozugbo, n’ụzọ dị nkenke ma doo anya.
- source_word: ἔφη
  choice: wee sị
  rationale: Ọ bụ ngwaa ikwu okwu nkịtị; “sị” anaghị etinye nkọwa ọzọ na-adịghị n’isi mmalite.
- source_word: καὶ αὐτός
  choice: Ya onwe ya wee sịkwa
  rationale: “Onwe ya” na “-kwa” na-egosipụta na Jizọs zaghachikwara ha n’otu aka ahụ.
- source_word: Οὐδὲ ἐγὼ
  choice: Mụ onwe m agaghịkwa
  rationale: Nke a na-edobe nkwusi ike dị na ἐγώ na nzaghachi nke οὐδέ, ma na-egosipụta ọjụjụ Jizọs n’Igbo ebumpụta ụwa.
- source_word: λέγω ὑμῖν
  choice: agwa unu
  rationale: N’ebe a, λέγω pụtara ikpughere ha ozi; “agwa unu” bụ ụzọ Igbo doro anya isi kwuo ya.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ikike m ji
  rationale: Usoro “ikike m ji” na-egosipụta ikike ma ọ bụ ntọala ziri ezi o ji eme omume ndị ahụ, ma ọ bụghị nanị ike ime ihe.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Ọ na-edobe demonstrative plural ahụ ma na-ezo aka n’omume Jizọs ndị a na-ajụ ajụjụ banyere ha.
- source_word: ποιῶ
  choice: eme
  rationale: Present tense dị mfe na Igbo dabara n’omume Jizọs na-eme n’ọnọdụ a na n’ozuzu ya.
theological_decisions:
- issue: Ihe ἐξουσία pụtara n’azịza Jizọs
  choice: ikike
  alternative: ike; ikike ziri ezi
  rationale: “Ikike” na-edobe echiche banyere ikike ma ọ bụ ikike e nyere mmadụ ime ihe. Ọ naghị ebelata okwu ahụ ka ọ bụrụ naanị ume ma ọ bụ ikike anụahụ, ọ naghịkwa ekpebi kpọmkwem ebe ikike ahụ si.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “wee” mee ka usoro akụkọ ahụ gaa nke ọma, ebe “onwe ya” na “-kwa” na-ebupụta nzaghachi Jizọs n’ụzọ kwekọrọ na Greek.
