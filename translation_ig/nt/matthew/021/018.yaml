  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Πρωῒ δὲ ⸀ἐπανάγων εἰς τὴν πόλιν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: ig
  text: N'isi ụtụtụ, mgbe ọ na-alaghachi n'obodo ahụ, agụụ gụrụ ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: N'isi ụtụtụ
  rationale: Nkebi okwu a na-egosi oge mbụ nke ụtụtụ; ọ bụ ụzọ Igbo dị n'okike isi chekwaa nkwusiri ike banyere oge ahụ.
- source_word: δὲ
  choice: e sighị ya n'okwu dị iche
  rationale: N'ebe a, δέ bụ njikọ akụkọ dị nro, ọ bụghị ihe na-egosi nnukwu ọdịiche. Usoro ahịrịokwu Igbo na ọnọdụ gbara ya gburugburu na-eburu njikọ ahụ nke ọma n'etinyeghị “ma” ma ọ bụ “ugbu a” nke nwere ike ịgbakwunye ihe na-adịghị na ya.
- source_word: ἐπανάγων
  choice: mgbe ọ na-alaghachi
  rationale: Ngwaa-ọnọdụ nke oge ugbu a na-egosi omume na-aga n'otu oge na isi ngwaa; “mgbe ọ na-alaghachi” na-egosipụta nke a n'Igbo dị mfe ma dị n'okike.
- source_word: εἰς τὴν πόλιν
  choice: n'obodo ahụ
  rationale: εἰς na-egosi ngagharị gaa n'obodo ahụ. N'Igbo, “ịlaghachi n'obodo ahụ” na-egosipụta ebe ọ na-aga nke ọma, n'ekwughị na ọ rutelarị.
- source_word: ἐπείνασεν
  choice: agụụ gụrụ ya
  rationale: Nke a bụ ụzọ Igbo nkịtị ma doo anya isi kwuo na agụụ bịara ya; ọ na-echekwa ike omume nke aorist karịa okwu na-akọ naanị ọnọdụ na-adịgide.
theological_decisions:
- issue: Ihe agụụ Jizọs pụtara banyere onye ọ bụ
  choice: Kọwaa ya ozugbo dịka ezigbo ahụmahụ agụụ.
  alternative: Ịkọwa ya n'ụzọ ga-eme ka agụụ ahụ bụrụ naanị ihe atụ ma ọ bụ belata ezi mmadụ ya.
  rationale: Akụkọ ahụ na-ekwu n'ụzọ doro anya na agụụ gụrụ ya. Nsụgharị a na-echekwa ihe odide ahụ kwuru banyere ezi ahụmahụ mmadụ ya n'etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “N'isi ụtụtụ” na “agụụ gụrụ ya” bụ okwu ndị nkịtị na nke doro anya; ahịrịokwu ahụ na-edobe usoro akụkọ dị larịị.
