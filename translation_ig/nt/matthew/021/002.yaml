  to: ọ sịrị ha, “Gaanụ n’obodo nta nke chere unu ihu; ozugbo unu ga-ahụ ịnyịnya ibu e kekọtara na nwa ịnyịnya ibu nọnyere ya.[a] Tọpụnụ ha, kpọtaaranụ m ha.”
