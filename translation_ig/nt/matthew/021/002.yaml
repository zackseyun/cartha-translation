  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· ⸀Πορεύεσθε εἰς τὴν κώμην τὴν ⸀κατέναντι ὑμῶν, καὶ ⸀εὐθέως εὑρήσετε ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς· λύσαντες ⸀ἀγάγετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: ig
  text: ọ sịrị ha, “Gaanụ n’obodo nta nke chere unu ihu; ozugbo unu ga-ahụ ịnyịnya ibu e kekọtara na nwa ịnyịnya ibu nọnyere ya.[a] Tọpụnụ ha, kpọtaaranụ m ha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “nke chere unu ihu” dịka “nke dị n’ofe unu” ma ọ bụ “nke dị n’ihu unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: ọ sịrị ha
  rationale: Nke a na-eweta okwu Jizọs n’ụzọ Igbo dị mfe ma kwekọọ n’ọrụ participle ahụ n’akụkọ.
- source_word: Πορεύεσθε
  choice: Gaanụ
  rationale: Iwu plural a bụ ụzọ Igbo kachasị eke isi nye ndị ahụ iwu ka ha gaa.
- source_word: κώμην
  choice: obodo nta
  rationale: Ọ na-egosi obodo na-abụghị nnukwu obodo; “obodo nta” doro ndị na-agụ Igbo anya.
- source_word: κατέναντι ὑμῶν
  choice: dị n’ihu unu
  rationale: Ọ na-echekwa echiche ebe ahụ dị n’ihu ma ọ bụ chere ha ihu, n’enweghị ime ka ọ bụrụ na ha ga-agafe ụzọ kpọmkwem.
- source_word: εὐθέως
  choice: ozugbo ahụ
  rationale: Ọ na-egosipụta ngwa ngwa nke εὐθέως n’asụsụ Igbo eke.
- source_word: ὄνον δεδεμένην
  choice: nne ịnyịnya ibu e kere eke
  rationale: Feminine singular na μετ’ αὐτῆς na-egosi anụ nne; “e kere eke” na-egosipụta ọnọdụ sitere n’ọrụ perfect passive.
- source_word: πῶλον μετ’ αὐτῆς
  choice: nwa ya nọnyere ya
  rationale: N’ọnọdụ a πῶλος bụ nwa ịnyịnya ibu; “nwa ya” na-eme ka ụdị anụmanụ ahụ na mmekọrịta ya na nne ya doo anya n’Igbo.
- source_word: λύσαντες ἀγάγετέ μοι
  choice: Tọpụnụ ha, kpọtaara m ha
  rationale: A sụgharịrị participle na imperative ahụ dị ka iwu abụọ na-eso ibe ha, nke bụ usoro Igbo eke ma na-echekwa ọtụtụ anụmanụ ahụ.
theological_decisions: []
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “nne ịnyịnya ibu” na “nwa ya” mee ka feminine singular na ụdị πῶλος pụta ìhè n’ụzọ Igbo eke; e tinyere akara ndetu [a] n’ebe okwu ọnọdụ obodo ahụ dị.
