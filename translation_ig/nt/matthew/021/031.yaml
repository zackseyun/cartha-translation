revisions:
- from: “Ònye n’ime mmadụ abụọ ahụ mere ihe nna ahụ chọrọ?” Ha zara, “Nke mbụ.” Jizọs sịrị ha, “N’ezie, ana m asị unu, ndị ọna ụtụ na ndị akwụna na-eburu unu ụzọ abanye n’alaeze Chineke.[a]”
  to: “Ònye n’ime mmadụ abụọ ahụ mere ihe nna ahụ chọrọ?” Ha zara, “Nke mbụ.” Jizọs sịrị ha, “N’ezie, ana m asị unu, ndị ọna ụtụ na ndị akwụna na-aga n’ihu unu n’ịbanye n’alaeze Chineke.[a]”
  rationale: The final clause is revised solely to prevent the Igbo idiom from suggesting that the named groups lead the addressees into the kingdom. The revision preserves the Greek image of going ahead and its deliberate lack of an explicit statement of final exclusion.
  reviewer_model: gpt-5.6-terra
