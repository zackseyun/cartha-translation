id: MAT.21.31
reference: Matthew 21:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: ig
  text: “Ònye n’ime mmadụ abụọ ahụ mere ihe nna ahụ chọrọ?” Ha zara, “Nke mbụ.” Jizọs sịrị ha, “N’ezie, ana m asị unu, ndị ọna ụtụ na ndị akwụna na-aga n’ihu unu n’ịbanye n’alaeze Chineke.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-abanye n’alaeze Chineke tupu unu.” Okwu Grik ahụ pụtara na ha na-aga n’ihu unu; ọ na-emesi ike na ha bu unu ụzọ, ma ọ pụtaghị kpọmkwem na a ga-ajụ unu ịbanye kpamkpam.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: Ònye n’ime mmadụ abụọ ahụ
  rationale: Nke a bụ ajụjụ Igbo doro anya nke na-echekwa echiche nkewa dị na ἐκ τῶν δύο, ya bụ, otu onye n’ime mmadụ abụọ ahụ.
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  choice: mere ihe nna ahụ chọrọ
  rationale: Nke a na-ekwupụta echiche Grik n’Igbo nkịtị ma doo anya karịa nsụgharị nkịtị dị ka ‘mere uche nna ahụ.’ ‘Nna ahụ’ na-ezo aka ná nna dị n’ilu ahụ, ọ bụghị ozugbo na Chineke.
- source_word: Ὁ πρῶτος
  choice: Nke mbụ
  rationale: Azịza dị mkpirikpi ma bụrụ nke e ji eme ihe n’Igbo, dịka azịza Grik ahụ.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: N’ezie, ana m asị unu
  rationale: Ọ na-echekwa ịdị arọ na nkwenye dị n’okwu mmalite Jizọs ma bụrụkwa Igbo nke ndị mmadụ taa na-aghọta.
- source_word: τελῶναι
  choice: ndị ọna ụtụ
  rationale: Ọ bụ okwu Igbo doro anya maka ndị na-anakọta ụtụ isi, bụ́ ndị ọha na-elelị n’ọnọdụ a.
- source_word: πόρναι
  choice: ndị akwụna
  rationale: Ọ bụ okwu Igbo a na-aghọta nke ọma ma kwekọọ kpọmkwem na ụmụ nwanyị ndị πόρναι na-ezo aka na ha.
- source_word: προάγουσιν ὑμᾶς
  choice: na-eburu unu ụzọ
  rationale: Nkebi a na-echekwa onyinyo nke iburu mmadụ ụzọ ma ọ bụ ịga n’ihu ya, n’ebughị ụzọ kpebie na a ga-ajụ ndị a na-agwa okwu kpamkpam.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: banye n’alaeze Chineke
  rationale: ‘Banye’ na-egosipụta ntụziaka dị na εἰς, ebe ‘alaeze Chineke’ bụ okwu Igbo doro anya ma kwesị ekwesị maka βασιλεία τοῦ θεοῦ.
theological_decisions:
- issue: Ihe προάγουσιν ὑμᾶς pụtara gbasara ịbanye n’alaeze Chineke
  choice: na-eburu unu ụzọ abanye n’alaeze Chineke
  alternative: na-abanye n’alaeze Chineke tupu unu
  rationale: Nhọrọ a na-echekwa ihe atụ nke ndị ọna ụtụ na ndị akwụna na-ebu ndị isi ahụ ụzọ. Ọ naghị etinye n’amaokwu ahụ nkwubi okwu siri ike karịa Grik, nke ga-asị na a gaghị ekwe ka ndị isi ahụ banye ma ọlị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. ‘Mere ihe nna ahụ chọrọ’ na-enye echiche ahụ n’ụzọ nkịtị; ‘na-eburu unu ụzọ’ na-echekwa ma onyinyo okwu Grik ma esemokwu nkà mmụta okpukpe dị na ya.
