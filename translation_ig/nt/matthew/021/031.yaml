review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the question, the elliptical answer, Jesus’ solemn affirmation, and the groups named. However, “na-eburu unu ụzọ abanye” can naturally be understood as ‘lead you to enter,’ which risks making the tax collectors and prostitutes guides who bring the addressees into the kingdom, rather than people who precede them. The Greek προάγουσιν ὑμᾶς expresses precedence.
  naturalness: The register is clear, modern Standard Igbo. “Mere ihe nna ahụ chọrọ,” “N’ezie, ana m asị unu,” “ndị ọna ụtụ,” and “ndị akwụna” are natural and suitably dignified. Recasting the final clause removes the potentially misleading idiomatic sense.
  terminology: “Alaeze Chineke” properly renders βασιλεία τοῦ θεοῦ. “Ndị ọna ụtụ” and “ndị akwụna” are appropriate terms for τελῶναι and πόρναι. No doctrinal conclusion about final exclusion is added.
  issues:
  - severity: medium
    issue: The expression “na-eburu unu ụzọ abanye” is semantically ambiguous in Igbo.
    rationale: It may mean that these persons lead ‘you’ into the kingdom, whereas the Greek says that they go before the addressees. “Na-aga n’ihu unu n’ịbanye” makes the intended precedence explicit while retaining the text’s non-exclusionary ambiguity.
  revised_text: “Ònye n’ime mmadụ abụọ ahụ mere ihe nna ahụ chọrọ?” Ha zara, “Nke mbụ.” Jizọs sịrị ha, “N’ezie, ana m asị unu, ndị ọna ụtụ na ndị akwụna na-aga n’ihu unu n’ịbanye n’alaeze Chineke.[a]”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-abanye n’alaeze Chineke tupu unu.” Okwu Grik ahụ pụtara na ha na-aga n’ihu unu; ọ na-emesi ike na ha bu unu ụzọ, ma ọ pụtaghị kpọmkwem na a ga-ajụ unu ịbanye kpamkpam.
    reason: alternative_reading
  revision_rationale: The final clause is revised solely to prevent the Igbo idiom from suggesting that the named groups lead the addressees into the kingdom. The revision preserves the Greek image of going ahead and its deliberate lack of an explicit statement of final exclusion.
