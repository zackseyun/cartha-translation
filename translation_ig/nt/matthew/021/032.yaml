id: MAT.21.32
reference: Matthew 21:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: ig
  text: N’ihi na Jọn bịakwutere unu n’ụzọ ezi omume[a], ma unu ekweghị ya; ma ndị na-anakọta ụtụ isi na ndị akwụna kwere ya. Ma unu, ọbụna mgbe unu hụrụ nke a, agbanweghị uche unu ma e mesịa[c] ka unu wee kwere ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ụzọ ziri ezi” ma ọ bụ “n’ụzọ nke ezi omume.” Okwu Grik a nwere ike ịkọwa ụzọ Jọn si bie ndụ ma jee ozi, ma ọ bụ ụzọ ezi omume o kwusara.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “tụkwasị ya obi.” Ngwaa Grik a nwere ike ịpụta ikwere onye ahụ ma ọ bụ ịtụkwasị ya obi.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “unu echegharịghị ma e mesịa ka unu wee kwere ya.” Ngwaa e ji mee ihe n’ebe a abụghị μετανοέω, nke a na-ejikarị akọwa nchegharị, kama ọ bụ μεταμέλομαι, nke na-elekwasị anya karị n’ịgbanwe uche ma ọ bụ n’ịkwa ụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ
  choice: N’ihi na ... bịakwutere
  rationale: “N’ihi na” na-egosi na okwu a na-akọwa mba a baara ha n’amaokwu bu ya ụzọ; “bịakwutere” na-egosikwa ọbịbịa Jọn bịara n’ebe ndị na-ege ntị nọ.
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: n’ụzọ ezi omume
  rationale: Nke a na-edobe ihe atụ nke ὁδός, ‘ụzọ,’ ma na-enye δικαιοσύνη n’Igbo doro anya dị ka ibi na ime ihe ziri ezi n’anya Chineke. Ọ ka na-ahapụ ohere na okwu ahụ metụtara ụzọ Jọn si bie ndụ na jee ozi, ma ọ bụ ụzọ ezi omume o kwusara.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: unu ekweghị ya / kwere ya
  rationale: πιστεύω ya na onye nnọchiaha nọ na dative pụtara ikwere ihe onye ahụ kwuru ma ọ bụ ịtụkwasị ya obi. “Kwere ya” bụ ụzọ Igbo dị mfe ma kwekọọ n’ebe abụọ ahụ.
- source_word: τελῶναι
  choice: ndị ọna ụtụ
  rationale: Nke a bụ aha Igbo doro anya maka ndị na-anakọta ụtụ isi n’oge ahụ.
- source_word: πόρναι
  choice: ndị akwụna
  rationale: Ọ bụ ntụgharị kpọmkwem, nke ndị na-agụ Igbo taa ga-aghọta, ma na-edobe ọnọdụ ọha na omume okwu Grik ahụ na-egosi.
- source_word: ἰδόντες
  choice: mgbe unu hụrụ nke a
  rationale: E nyere participle a n’ụzọ na-egosi oge. “Nke a” na-ezo aka n’otú ndị ọna ụtụ na ndị akwụna si kwere Jọn.
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: unu agbanweghị uche unu ma e mesịa
  rationale: Nke a na-egosi mgbanwe uche ma ọ bụ ịkwa ụta nke μεταμέλομαι, na-ejighị okwu nwere ike ime ka ọ yie μετανοέω kpamkpam.
theological_decisions:
- issue: Ihe δικαιοσύνη pụtara n’okwu ‘ụzọ ezi omume’
  choice: ụzọ ezi omume
  alternative: ụzọ ziri ezi; ibi ndụ ezi omume
  rationale: “Ụzọ ezi omume” na-edobe ihe atụ nke ụzọ ma ghara ikpebi naanị ma ọ bụ ụzọ Jọn si bie ndụ, ozi ya, ma ọ bụ ụzọ o kwusara.
- issue: Ihe πιστεύω ya na αὐτῷ pụtara
  choice: kwere ya
  alternative: tụkwasị ya obi; kwere na ya
  rationale: Okwu a na-ekwu banyere ịnabata Jọn na ozi ya. “Kwere ya” na-edobe nke ahụ n’enweghị ịgbakwunye echiche okwukwe ọzọ nke okwu Grik ahụ na-ekwughị kpọmkwem.
- issue: Ihe μεταμέλομαι pụtara
  choice: gbanwee uche unu
  alternative: chegharịa; kwaa ụta
  rationale: “Gbanwee uche” na-edobe ọdịiche dị n’etiti μεταμέλομαι na μετανοέω, ma ka na-egosi mgbanwe omume nke ọnọdụ a chọrọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu ndị mmadụ na-eji eme ihe kwa ụbọchị, ma e debere usoro arụmụka, mmegide dị n’etiti ndị isi na ndị a na-elelị anya, na nghọta abụọ nwere ike ịdị n’okwu Grik ndị bụ isi.
