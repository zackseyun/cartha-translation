revisions:
- from: N’ihi na Jọn bịakwutere unu n’ụzọ ezi omume[a], ma unu ekweghị ya; ma ndị ọna ụtụ na ndị akwụna kwere ya. Ma ọbụna mgbe unu hụrụ nke a, unu agbanweghị uche unu ma e mesịa[c] ka unu wee kwere ya[b].
  to: N’ihi na Jọn bịakwutere unu n’ụzọ ezi omume[a], ma unu ekweghị ya; ma ndị na-anakọta ụtụ isi na ndị akwụna kwere ya. Ma unu, ọbụna mgbe unu hụrụ nke a, agbanweghị uche unu ma e mesịa[c] ka unu wee kwere ya[b].
  rationale: 'The revision preserves the source''s ambiguity in ''way of righteousness'' and in πιστεύω with a dative person, while improving natural Standard Igbo for tax collectors. It also foregrounds the Greek contrast: despite seeing the response of the tax collectors and prostitutes, the audience did not later change their minds so as to believe John. Footnote anchors are sequenced in their order of occurrence.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:26Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft faithfully represents the Greek clause structure and principal contrasts: John''s coming, ''the way of righteousness,'' disbelief by the addressed group, belief by tax collectors and prostitutes, and their later failure to change their minds in order to believe him. However, the final temporal/causal relation is more clearly represented by explicitly retaining ''even after seeing'' before the refusal to change their minds.'
  naturalness: The Igbo is generally clear and appropriate in register. 'Ndị ọna ụtụ' is understandable but less natural than the widely used 'ndị na-anakọta ụtụ isi.' The final sentence is smoother if 'ọbụna mgbe unu hụrụ nke a' directly modifies their failure to change their minds.
  terminology: '''Ụzọ ezi omume,'' ''ndị akwụna,'' and ''kwere ya'' are suitable. ''Gbanwee uche'' appropriately avoids collapsing μεταμέλομαι into the more technical term for repentance. The alternative footnote for πιστεύω should retain the person-focused wording without suggesting a different object.'
  issues:
  - severity: medium
    issue: The placement of 'ọbụna mgbe unu hụrụ nke a' can momentarily read as merely a general time setting rather than stressing that what they saw did not lead to a later change of mind.
    rationale: Greek ὑμεῖς δὲ ἰδόντες οὐδὲ μετεμελήθητε ὕστερον places the seeing in direct contrast with their failure even afterward to change their minds. Recasting the final clause makes this relation explicit without adding interpretation.
  - severity: low
    issue: '''ndị ọna ụtụ'' is less idiomatic in contemporary Standard Igbo than ''ndị na-anakọta ụtụ isi.'''
    rationale: The latter is transparent modern usage and accurately conveys τελῶναι, without importing details about the Roman tax system.
  - severity: low
    issue: Footnote anchors are out of English audit-trail sequence in the running text ([c] before [b]).
    rationale: 'The anchors should follow the occurrence of the terms they annotate: [c] at ''gbanweghị uche'' and [b] at ''kwere ya.'''
