  text: ὅτε δὲ ἤγγισεν ὁ καιρὸς τῶν καρπῶν, ἀπέστειλεν τοὺς δούλους αὐτοῦ πρὸς τοὺς γεωργοὺς λαβεῖν τοὺς καρποὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: ig
  text: Ma mgbe oge mkpụrụ ubi ruru nso, o zigara ndị na-ejere ya ozi[a] n’ebe ndị ọrụ ugbo ahụ[b] nọ ka ha nata mkpụrụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya “ndị ohu ya.” Okwu Grik doulous nwere ike ịpụta ndị na-eje ozi ma ọ bụ ndị ohu; ebe a, a họọrọ “ndị na-ejere ya ozi” n’ihi na ilu ahụ na-emesi ọrụ ha ike dị ka ndị ozi onye nwe ubi.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya “ndị ọrụ ubi,” “ndị gbazitere ubi ahụ,” ma ọ bụ “ndị na-akọ ubi vaịn.” Okwu Grik geōrgous na-ezo aka ná ndị na-akọ ala; n’ilu a, ha bụ ndị na-arụ ubi vaịn nke onye ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ma mgbe
  rationale: “Mgbe” na-ewebata nkebi oge, ebe “ma” na-egosipụta njikọ na ntakịrị mgbanwe dị na δέ n’ụzọ Igbo na-ada nke ọma.
- source_word: ἤγγισεν
  choice: bịaruru nso
  rationale: Nke a na-egosipụta na oge ahụ abịala nso, kwekọọ na aorist nke ἐγγίζω, n’enweghị ịgbakwunye na owuwe ihe ubi amalitela.
- source_word: ὁ καιρὸς τῶν καρπῶν
  choice: oge mkpụrụ ubi
  rationale: καιρός bụ oge kwesịrị ekwesị ma ọ bụ oge a kara aka; n’ọnọdụ ọrụ ubi a, “oge mkpụrụ ubi” na-egosipụta oge mkpụrụ na-amị ma na-edobe καρπῶν karịa ịgbanwe ya kpamkpam ka ọ bụrụ “owuwe ihe ubi.”
- source_word: ἀπέστειλεν
  choice: o zigara
  rationale: Ọ bụ okwu Igbo nkịtị na nke doro anya maka iziga mmadụ n’ozi.
- source_word: τοὺς δούλους αὐτοῦ
  choice: ndị na-ejere ya ozi
  rationale: δοῦλος nwere ike ịpụta ohu ma ọ bụ onye na-eje ozi. N’ilu a, ọrụ ha dị ka ndị nnọchiteanya onye nwe ubi ka e mere ka ọ pụta ìhè; ihe ọzọ e nwere ka edere n’ala ala peeji.
- source_word: πρὸς τοὺς γεωργοὺς
  choice: ka ha gakwuru ndị ọrụ ubi ahụ
  rationale: γεωργός bụ onye na-akọ ma na-elekọta ubi. “Ndị ọrụ ubi ahụ” bụ Igbo dị mfe ma kwekọọ n’ọrụ ha; na gburugburu ilu ahụ, ha na-arụ ubi vaịn nke onye ọzọ.
- source_word: λαβεῖν
  choice: nata
  rationale: λαμβάνω pụtara ịnara ma ọ bụ ịnata. “Nata” na-egosipụta ebumnuche njem ahụ n’enweghị ịgbakwunye echiche nke ụgwọ n’ụzọ karịrị ihe Grik kwuru.
- source_word: τοὺς καρποὺς αὐτοῦ
  choice: mkpụrụ nke ya
  rationale: “Mkpụrụ” na-edobe ihe oyiyi καρπός, ebe “nke ya” na-eme ka αὐτοῦ pụta ìhè ma na-ezo aka n’ihe ruuru onye nwe ubi.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ okwu “mkpụrụ” ka ihe oyiyi ubi vaịn dị na Grik ghara ịla n’iyi, a zerekwa ịkọwa ilu ahụ n’ụzọ okpukpe pụrụ iche.
