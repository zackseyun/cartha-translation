  naturalness: 'The revised sentence uses a more natural Igbo destination-and-purpose construction: sending the servants to where the farmers were, in order to receive the fruit. It also removes the somewhat stiff possessive construction “nke ya.”'
  terminology: “Ndị na-ejere ya ozi” is a suitable contextual rendering of δούλους, with “ndị ohu ya” retained as a lexical alternative. “Ndị ọrụ ugbo” appropriately renders γεωργούς without forcing the tenancy detail into the main text. “Oge mkpụrụ ubi” suitably communicates the agricultural season without replacing fruit with a harvest term.
