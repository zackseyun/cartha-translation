  to: Ma mgbe oge mkpụrụ ubi ruru nso, o zigara ndị na-ejere ya ozi[a] n’ebe ndị ọrụ ugbo ahụ[b] nọ ka ha nata mkpụrụ ya.
  rationale: 'The revision makes two safe lexical and stylistic improvements: it changes “ndị ọrụ ubi” to the more standard “ndị ọrụ ugbo,” and changes “mkpụrụ nke ya” to the natural possessive “mkpụrụ ya.” The sentence structure is smoothed while retaining the source’s purpose clause and leaving the Greek’s contextual ambiguity intact.'
