id: MAT.21.26
reference: Matthew 21:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: ig
  text: Ma ọ bụrụ na anyị asị, ‘Ọ sitere n'aka ụmụ mmadụ,’[a] anyị na-atụ ìgwè mmadụ ahụ ụjọ, n'ihi na ha niile na-ewere Jọn dị ka onye amụma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ si n'aka mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Ma ọ bụrụ na anyị asị
  rationale: Nke a na-egosipụta ọnọdụ ha na-atụle dị ka ihe nwere ike ime, n’Igbo dị mfe ma dịkwa ugbu a.
- source_word: Ἐξ ἀνθρώπων
  choice: O si n’aka mmadụ
  rationale: Nke a na-echekwa ọdịiche dị n’etiti isi n’eluigwe na isi n’aka mmadụ. “Mmadụ” ebe a na-anọchite mmadụ n’ozuzu, ọ bụghị naanị nwoke.
- source_word: φοβούμεθα τὸν ὄχλον
  choice: anyị na-atụ ìgwè mmadụ ahụ egwu
  rationale: Ọ bụ okwu Igbo doro anya nke na-egosi na ha na-atụ ndị gbakọrọ ahụ egwu.
- source_word: πάντες
  choice: ha niile
  rationale: Ọ na-eme ka o doo anya na okwu ahụ metụtara ìgwè mmadụ ahụ niile.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: na-ewere Jọn dị ka onye amụma
  rationale: Nke a na-enye echiche nke ile mmadụ anya ma ọ bụ ịghọta ya dị ka ihe e kwuru, n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: Ἰωάννην
  choice: Jọn
  rationale: A na-ede aha John n’ụdị Igbo a na-ejikarị eme ihe.
theological_decisions:
- issue: Ọdịiche dị n’etiti isi n’eluigwe na isi n’aka mmadụ
  choice: O si n’aka mmadụ
  alternative: O sitere n’ebe mmadụ nọ
  rationale: Nhọrọ a na-echekwa ọdịiche dị mkpirikpi nke amaokwu gbara ya gburugburu n’etinye n’etiti mmalite sitere n’aka Chineke na nke sitere n’aka mmadụ, n’enweghị ime ka “mmadụ” bụrụ naanị ụmụ nwoke.
- issue: Otú ìgwè mmadụ si ele Jọn anya
  choice: ha niile na-ewere Jọn dị ka onye amụma
  alternative: ha niile kwenyere na Jọn bụ onye amụma
  rationale: “Na-ewere ... dị ka” na-akọ echiche ìgwè mmadụ ahụ dịka ederede si kwuo, ma ọ naghị eme ka okwu ahụ bụrụ nkwupụta nkà mmụta okpukpe karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. E debere usoro arụmụka ahụ na ọdịiche dị n’etiti eluigwe na mmadụ, ma zere okwu pụrụ iche nke otu ụka.
