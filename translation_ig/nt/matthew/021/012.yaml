id: MAT.21.12
reference: Matthew 21:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: ig
  text: Jizọs wee banye n’ogige ụlọ nsọ, wee chụpụ ndị niile na-ere ma na-azụ ihe n’ogige ụlọ nsọ ahụ[a]; ọ kwaturu tebụl ndị na-agbanwe ego na oche ndị na-ere nduru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụlọ nsọ” ma ọ bụ “mpaghara ụlọ nsọ.” Okwu Grik a na-ezo aka n’ụlọ nsọ na mpaghara ya dum, ọ bụghị kpọmkwem n’ime ebe nsọ n’onwe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: ogige ụlọ nsọ
  rationale: Okwu Grik a na-ezo aka n’ebe niile gbara ụlọ nsọ gburugburu, ọ bụghị kpọmkwem ime ebe nsọ ahụ; ‘ogige ụlọ nsọ’ na-egosi ebe azụmahịa a mere.
- source_word: ἐξέβαλεν
  choice: chụpụkwa
  rationale: Nke a na-egosi nchụpụ siri ike ma bụrụkwa okwu Igbo doro anya na nke e ji eme ihe taa.
- source_word: πάντας
  choice: ndị niile
  rationale: A hapụrụ oke okwu Grik ahụ ka o doo anya na ọ metụtara ndị niile na-eme azụmahịa ahụ.
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: ndị ... nọ na-ere ma na-azụ ihe
  rationale: Nhọrọ a na-egosipụta omume ndị ahụ na-aga n’ihu ma na-ada ka Igbo ebumpụta ụwa.
- source_word: τράπεζας
  choice: tebụl
  rationale: Ọ bụ okwu Igbo a na-aghọta nke ọma maka tebụl ndị e ji agbanwe ego.
- source_word: κολλυβιστῶν
  choice: ndị na-agbanwe ego
  rationale: Ọ na-akọwa ndị na-agbanwe ụdị mkpụrụ ego n'ụzọ doro anya n’Igbo.
- source_word: κατέστρεψεν
  choice: kwaturu
  rationale: N’ọnọdụ a, okwu ahụ pụtara ịtụgharị ma ọ bụ ịkwatu tebụl, ọ bụghị ibibi ya kpamkpam.
- source_word: καθέδρας
  choice: oche
  rationale: ‘Oche’ bụ okwu Igbo nkịtị ma kwekọọ na ihe okwu Grik ahụ pụtara.
- source_word: περιστεράς
  choice: nduru
  rationale: ‘Nduru’ bụ okwu Igbo a na-ejikarị akọwa dove/pigeon, gụnyere anụmanụ e ji achụ àjà.
theological_decisions:
- issue: Oke ebe ἱερόν na-ezo aka n’omume Jizọs
  choice: Jizọs banyere n’ogige ụlọ nsọ, ọ bụghị kpọmkwem n’ime ebe nsọ ahụ.
  alternative: Ịsụgharị ya naanị dị ka ‘ụlọ nsọ’ n’enweghị ịkọwa akụkụ ụlọ nsọ a na-ekwu maka ya.
  rationale: Ọdịiche dị n’etiti ἱερόν na ναός dị mkpa n’akụkọ ihe mere eme na n’ọnọdụ ebe ahụ. ‘Ogige ụlọ nsọ’ na-egbochi nghọta na Jizọs banyere n’ime ebe nsọ ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji usoro ahịrịokwu na okwu ndị nkịtị mee ka akụkọ ahụ gaa were were, ebe e debere nkọwa gbasara mpaghara ụlọ nsọ n’ala ala peeji.
