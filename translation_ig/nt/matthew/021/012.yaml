  to: Jizọs wee banye n’ogige ụlọ nsọ, wee chụpụ ndị niile na-ere ma na-azụ ihe n’ogige ụlọ nsọ ahụ[a]; ọ kwaturu tebụl ndị na-agbanwe ego na oche ndị na-ere nduru.
