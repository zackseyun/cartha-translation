    text: Ma ọ bụ, “ụlọ nsọ” ma ọ bụ “mpaghara ụlọ nsọ.” Okwu Grik a na-ezo aka n’ụlọ nsọ na mpaghara ya dum, ọ bụghị kpọmkwem n’ime ebe nsọ n’onwe ya.
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s faithful rendering while making the narrative connective more idiomatic and sharpening the lexical footnote’s distinction between the temple precincts and the inner sanctuary.
