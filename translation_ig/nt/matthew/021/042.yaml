revisions:
- from: 'Jizọs sịrị ha, “Ọ̀ bụ na unu agụtụbeghị n’Akwụkwọ Nsọ, sị:


    ‘Nkume ahụ ndị na-ewu ụlọ jụrụ ajụ

    aghọọla nkume isi nkuku[a].

    Nke a sitere n’aka Onyenwe anyị[b],

    ọ dịkwa ịtụnanya n’anya anyị’?”'
  to: 'Jizọs sịrị ha, “Ọ̀ dịtụbeghị mgbe unu gụrụ ihe a n’Akwụkwọ Nsọ:


    ‘Nkume ahụ ndị na-ewu ụlọ jụrụ ajụ

    aghọọla isi nkuku[a].


    Nke a sitere n’aka Onyenwe anyị[b],

    ọ dịkwa ịtụnanya n’anya anyị’?”'
  rationale: The revision explicitly conveys ‘never,’ makes the scriptural-introduction idiom smoother in contemporary Standard Igbo, and clarifies the Hebrew divine-name note. It does not settle the debated architectural sense beyond retaining the main rendering and a footnoted alternative, nor does it add a messianic interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:22Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains Jesus’ question, the appeal to the Scriptures, the rejected-stone image, its becoming the head/corner stone, divine source, and its being wonderful in ‘our eyes.’ However, «Ọ̀ bụ na unu agụtụbeghị» primarily asks whether they have not yet read, and does not clearly carry Οὐδέποτε (‘never’).
  naturalness: Most of the Igbo is clear and suitably elevated. «Ọ̀ dịtụbeghị mgbe unu gụrụ…» is a more natural and explicit equivalent of the rhetorical ‘Have you never read…?’ «isi nkuku» is smoother than the more cumbersome «nkume isi nkuku» because the subject ‘Nkume ahụ’ is retained across the line break.
  terminology: «Akwụkwọ Nsọ», «Onyenwe anyị», and the stone/building metaphor fit Standard Igbo and preserve the register. The Hebrew-source note should identify YHWH directly rather than represent it as the nonstandard all-capitalized «ONYEWANYỊ». The alternative ‘capstone’ is retained cautiously as a lexical possibility.
  issues:
  - severity: medium
    issue: The force of Οὐδέποτε is not explicit.
    rationale: «Ọ̀ bụ na unu agụtụbeghị» can mean ‘Have you not read yet?’ It does not necessarily state ‘never.’ «Ọ̀ dịtụbeghị mgbe unu gụrụ…» clearly preserves the Greek adverb’s force.
  - severity: low
    issue: Footnote b renders the Hebrew divine name as «ONYEWANYỊ».
    rationale: This spelling is not a clear or standard representation of the Hebrew YHWH and obscures the stated textual fact. Identifying the form as YHWH is both accurate and transparent.
  revised_text: 'Jizọs sịrị ha, “Ọ̀ dịtụbeghị mgbe unu gụrụ ihe a n’Akwụkwọ Nsọ:


    ‘Nkume ahụ ndị na-ewu ụlọ jụrụ ajụ

    aghọọla isi nkuku[a].


    Nke a sitere n’aka Onyenwe anyị[b],

    ọ dịkwa ịtụnanya n’anya anyị’?”'
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘nkume kachasị elu’; n’ụzọ nkịtị, ‘isi nkuku.’
    reason: lexical_alternative
  - marker: b
    text: 'Grik: ‘sitere n’aka Onyenwe anyị’; n’akwụkwọ Hibru e si hota okwu a, e ji aha YHWH mee ihe.'
    reason: alternative_reading
  revision_rationale: The revision explicitly conveys ‘never,’ makes the scriptural-introduction idiom smoother in contemporary Standard Igbo, and clarifies the Hebrew divine-name note. It does not settle the debated architectural sense beyond retaining the main rendering and a footnoted alternative, nor does it add a messianic interpretation.
