id: MAT.21.42
reference: Matthew 21:42
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: ig
  text: 'Jizọs sịrị ha, “Ọ̀ dịtụbeghị mgbe unu gụrụ ihe a n’Akwụkwọ Nsọ:


    ‘Nkume ahụ ndị na-ewu ụlọ jụrụ ajụ

    aghọọla isi nkuku[a].


    Nke a sitere n’aka Onyenwe anyị[b],

    ọ dịkwa ịtụnanya n’anya anyị’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘nkume kachasị elu’; n’ụzọ nkịtị, ‘isi nkuku.’
    reason: lexical_alternative
  - marker: b
    text: 'Grik: ‘sitere n’aka Onyenwe anyị’; n’akwụkwọ Hibru e si hota okwu a, e ji aha YHWH mee ihe.'
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji historical present, oge gara aga ‘sịrị’ bụ ụzọ Igbo si akọ akụkọ n’ụzọ eke.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: Ọ̀ bụ na unu agụtụbeghị
  rationale: Ụdị ajụjụ a na-edobe ike nke ‘ọ dịghị mgbe’ ma na-ada nke ọma n’Igbo nke oge a.
- source_word: ἐν ταῖς γραφαῖς
  choice: n’Akwụkwọ Nsọ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ihe odide nsọ nke Izrel; ‘Akwụkwọ Nsọ’ bụ okwu doro anya ma bụrụkwa nke ndị Igbo maara.
- source_word: Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες
  choice: Nkume ahụ ndị na-ewu ụlọ jụrụ ajụ
  rationale: Nke a na-edobe ihe atụ ụlọ ahụ; ‘jụrụ ajụ’ na-egosi nkwusi ike nke ịjụ nkume ahụ dịka nke na-ekwesịghị ekwesị.
- source_word: οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
  choice: aghọọla nkume isi nkuku
  rationale: ‘Aghọọla’ na-egosi mgbanwe e mezuru nke ka dị mkpa ugbu a. ‘Nkume isi nkuku’ bụ nsụgharị doro anya nke ihe atụ ahụ, ebe a na-edobe nsụgharị ọzọ n’okpuru amaokwu.
- source_word: παρὰ κυρίου
  choice: sitere n’aka Onyenwe anyị
  rationale: παρά tinyere genitive na-egosi isi mmalite; okwu Igbo a na-egosi na ihe ahụ sitere n’aka Onyenwe anyị n’enweghị ịkọwa otú o si mee ya.
- source_word: θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν
  choice: ọ dịkwa ịtụnanya n’anya anyị
  rationale: Nke a na-edobe okwu anya dị n’asụsụ mbụ ma na-enye θαυμαστή ụda dị elu, nke sitere n’okwu Abụ Ọma ahụ.
theological_decisions:
- issue: Nsụgharị κύριος n’okwu e hotara n’Abụ Ọma
  choice: Onyenwe anyị
  alternative: ONYEWANYỊ
  rationale: Ederede Grik nwere κυρίου, ya mere e ji aha nsọpụrụ ‘Onyenwe anyị’ mee ihe n’ahịrị bụ isi. Ma ebe Hibru nke e si hota ya nwere aha Chineke YHWH; e gosiri nke a n’okpuru amaokwu ka ọdịiche nke isi mmalite ghara izo ezo.
- issue: Itinye ihe oyiyi nkume ahụ n’ọrụ n’ebe Mesaịa nọ
  choice: Idobe ihe atụ ahụ n’enweghị nkọwa agbakwunyere
  alternative: Ikwupụta kpọmkwem n’ahịrị bụ isi na nkume ahụ bụ Mesaịa
  rationale: Ihe gbara amaokwu a gburugburu na-egosi na Jizọs na-etinye okwu ahụ n’ọrụ n’ebe onwe ya nọ, ma okwu e hotara n’amaokwu a akọwaghị nkume ahụ kpọmkwem dịka Mesaịa. Nsụgharị ahụ anaghị agbakwunye nkọwa ozizi n’ime amaokwu.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro uri nke okwu e hotara, tinyere ihe atụ nkume na nkuku, n’enweghị ịgbakwunye nkọwa okpukpe na-adịghị n’ederede.
