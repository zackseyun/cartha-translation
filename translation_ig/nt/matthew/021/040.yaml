id: MAT.21.40
reference: Matthew 21:40
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: ig
  text: Ya mere, mgbe onye nwe ubi vaịn[a] ahụ bịara, gịnị ka ọ ga-eme ndị na-akọ ubi[b] ahụ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nna ukwu ubi vaịn ahụ.” Okwu Grik bụ kyrios, nke a na-asụgharịkarị “Onyenweanyị,” ma n’ebe a ọ na-ezo aka n’onye nwe ubi vaịn ahụ n’ime ilu ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ndị ọrụ ugbo na-agbazite ubi.” Akụkọ ilu ahụ n’ozuzu ya na-egosi na ndị a na-akọ ubi ahụ bụ ndị gbazitere ubi vaịn ahụ, ma okwu Grik n’onwe ya pụtara n’ụzọ sara mbara “ndị na-akọ ubi” ma ọ bụ “ndị na-akọ ihe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: mgbe
  rationale: Ọ na-ewebata nkebiokwu oge nke na-ekwu banyere oge a na-atụ anya ya n’akụkọ a; “mgbe” bụ okwu Igbo dị mfe ma kwekọọ na “when.”
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu ma ọ bụ ajụjụ sitere n’ihe e kwuru tupu ya, ọ bụghị naanị ihe na-esote n’usoro oge.
- source_word: ἔλθῃ
  choice: ga-abịa
  rationale: N’agbanyeghị na Grik jiri aorist subjunctive mgbe ὅταν gasịrị, ihe a na-ekwu bụ ọbịbịa a na-atụ anya ya; ọdịnihu Igbo na-eme ka nke a doo anya ma bụrụkwa okwu e ji eme ihe ugbu a.
- source_word: κύριος
  choice: onye nwe
  rationale: N’ime ilu a, okwu ahụ na-ezo aka n’onye nwe ubi vaịn ahụ, ọ bụghị iji “Onyenweanyị” mee aha nsọ. “Onye nwe” na-egosipụta ọrụ ya dị ka onye nwe ihe ahụ n'ụzọ doro anya.
- source_word: ἀμπελῶνος
  choice: ubi vaịn
  rationale: Nke a bụ ụzọ doro anya na nke a na-aghọta ugbu a isi kwuo ubi a na-akọ vaịn.
- source_word: τί ποιήσει
  choice: gịnị ka ọ ga-eme
  rationale: Ọ na-edobe ajụjụ ọdịnihu nke Grik ma kwe ka ndị e mere ihe ahụ soro ya dịka mmeju okwu.
- source_word: γεωργοῖς
  choice: ndị ọrụ ubi
  rationale: Okwu Grik pụtara ndị na-akọ ma ọ bụ na-elekọta ala n’ozuzu; “ndị ọrụ ubi” na-edobe obosara ihe okwu ahụ pụtara, ebe nkọwa ala peeji na-egosi na n’ilu a ha bụ ndị gbazitere ubi ahụ.
- source_word: ἐκείνοις
  choice: ahụ
  rationale: “Ahụ” e tinyere n’azụ “ndị ọrụ ubi” na-edobe nrụtụ aka pụrụ iche na ntakịrị ndọpụ uche dị n’okwu ngosi Grik ahụ.
theological_decisions:
- issue: Otu e si sụgharị κύριος n’ime ilu a
  choice: onye nwe
  alternative: nna ukwu
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na κύριος bụ onye nwe ubi vaịn n’ime akụkọ ahụ. “Onye nwe” na-ezere itinye aha nsọ ma ọ bụ nkọwa banyere Kraịst n’ebe amaokwu ahụ n’onwe ya na-ekwughị ya kpọmkwem, ma ọ ka na-edobe ikike onye ahụ nwere n’ubi ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. “Ubi vaịn” bụ okwu doro anya nye ndị na-agụ akwụkwọ ugbu a; ahịrịokwu ahụ na-edobe ụdị ajụjụ ilu ahụ na ike nkwubi okwu nke “Ya mere.”
