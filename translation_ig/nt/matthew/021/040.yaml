review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inferential οὖν, the anticipated arrival introduced by ὅταν, the vineyard owner, and the future question directed at the γεωργοί. The revised wording retains the demonstrative force of ἐκείνοις.
  naturalness: “Ndị na-akọ ubi” is more precise and idiomatic here than “ndị ọrụ ubi,” which can readily suggest hired agricultural laborers rather than the cultivators addressed in the parable. “Mgbe ... bịara” is a natural Igbo temporal construction for the anticipated event.
  terminology: “Onye nwe ubi vaịn” appropriately renders κύριος in this parabolic setting without importing the divine-title sense. “Ubi vaịn” is understandable modern Standard Igbo usage. The footnote's tenant wording is adjusted so that it describes tenancy without implying that γεωργοί itself lexically means ‘people who rented the vineyard.’
  issues:
  - severity: low
    issue: “Ndị ọrụ ubi” is somewhat broader and may imply hired workers.
    rationale: γεωργοί denotes cultivators/farmers; in this context they are tenants, but the Greek word itself does not specifically mean hired laborers. “Ndị na-akọ ubi” preserves the basic lexical sense more closely.
  - severity: low
    issue: The tenant-farmer footnote phrases tenancy as though it were part of the alternative expression itself.
    rationale: The wider parable establishes the tenancy. The footnote should distinguish that contextual fact from the broader meaning of γεωργοί.
