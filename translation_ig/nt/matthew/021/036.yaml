  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: ig
  text: Ọzọkwa, o zigara ndị ohu ndị ọzọ, ndị karịrị ndị mbụ n’ọnụ ọgụgụ; ha mesokwara ha otu aka ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: Ọzọkwa
  rationale: Na-egosi na e megharịrị ihe ahụ ọzọ, ma dabara nke ọma n’usoro akụkọ.
- source_word: ἀπέστειλεν
  choice: o zigara
  rationale: Oge gara aga nke ἀποστέλλω; ‘zigara’ bụ okwu Igbo doro anya maka iziga mmadụ n’ọrụ.
- source_word: ἄλλους δούλους
  choice: ndị ohu ndị ọzọ
  rationale: N’Igbo, ‘ndị ohu’ na-egosipụta ọnọdụ δοῦλοι nke ọma, ma n’akụkọ ilu a ha bụkwa ndị nna ha ukwu zigara.
- source_word: πλείονας τῶν πρώτων
  choice: ndị dị ọtụtụ karịa ndị mbụ
  rationale: 'Na-eme ka ntụnyere ọnụ ọgụgụ ahụ doo anya: ìgwè nke abụọ karịrị ìgwè mbụ n’ọnụ ọgụgụ.'
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: ha mekwara ha otu ihe ahụ
  rationale: Na-edobe ụzọ okwu Grik si zoo aka n’otu mmeso ahụ e mesoro ndị mbụ n’amaokwu bu ụzọ.
theological_decisions:
- issue: Nsụgharị δοῦλος n’akụkọ ilu a
  choice: ndị ohu
  alternative: ndị na-eje ozi
  rationale: ‘Ndị ohu’ na-egosipụta nke ọma na ndị a nọ n’okpuru nna ha ukwu. E tinyere ‘ndị na-eje ozi’ n’ala ala peeji dịka ụzọ ọzọ kwe omume, n’ihi na δοῦλος nwere ike ịpụta ohu ma ọ bụ onye na-eje ozi dịka ọnọdụ okwu si dị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E debere ntụnyere ọnụ ọgụgụ na njikọ ya na amaokwu bu ụzọ n'ụzọ doro anya, n’enweghị ịkọwapụta mmeso ahụ ọzọ.
