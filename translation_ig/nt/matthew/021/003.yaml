  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: ig
  text: Ọ bụrụkwa na onye ọ bụla agwa unu ihe ọ bụla, unu ga-asị, “Onyenwe anyị[a] chọrọ ha,” ọ[b] ga-eziga ha ozugbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye nwe ha,” n’ọnọdụ a.
    reason: alternative_reading
  - marker: b
    text: Onye “ọ” na-ezo aka na ya yikarịrị ka ọ bụ onye ahụ gwara ndị na-eso ụzọ okwu; ya bụ, ọ ga-eziga anụmanụ ndị ahụ ozugbo.
    reason: referent_ambiguity
lexical_decisions:
- source_word: ἐάν τις
  choice: ọ bụrụ na onye ọ bụla
  rationale: Nke a na-egosi ọnọdụ nwere ike ime ma na-ahapụ onye ahụ n’amaghị onye ọ bụ, dị ka okwu Grik si dị.
- source_word: ὑμῖν
  choice: agwa unu
  rationale: “Unu” na-egosi nke ọma na a na-agwa ọtụtụ ndị, ya bụ ndị na-eso ụzọ ahụ.
- source_word: εἴπῃ τι
  choice: agwa unu ihe ọ bụla
  rationale: Nke a na-edebe obosara nke λέγω na τι; ọ naghị eme ka okwu ahụ bụrụ naanị ajụjụ.
- source_word: ἐρεῖτε
  choice: unu ga-asị
  rationale: Ọdịdị ọdịnihu nke ngwaa ahụ na-arụ ọrụ dịka ntụziaka; “unu ga-asị” na-edebe ma ọdịdị ahụ ma ike iwu ya.
- source_word: Ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ ntụgharị Igbo a na-ejikarị akọwa κύριος dịka “Onyenwe anyị,” ma na-edebe ịdị arọ nke aha ahụ n’ọnọdụ a.
- source_word: αὐτῶν χρείαν ἔχει
  choice: chọrọ ha
  rationale: Akpaalaokwu Igbo a bụ ihe doro anya ma bụrụkwa nke nkịtị maka “o nwere mkpa ha”; “ha” na-ezo aka n’anụmanụ abụọ ahụ.
- source_word: εὐθὺς
  choice: ozugbo
  rationale: “Ozugbo” na-egosi ime ihe n’egbughị oge, dịka εὐθύς si pụta.
- source_word: ἀποστελεῖ αὐτούς
  choice: ọ ga-eziga ha
  rationale: Nke a na-edebe ngwaa ahụ dịka “iziga” n’etinyeghị echiche nke “izighachi” ma ọ bụ “ịtọhapụ,” nke Grik ekwughị hoo haa.
theological_decisions:
- issue: Ihe Ὁ κύριος na-ezo aka na ya na ike aha ahụ nwere
  choice: Onyenwe anyị
  alternative: nna ha ukwu / onye nwe ha
  rationale: “Onyenwe anyị” na-edebe ma ikike Jizọs na ịdị arọ nke aha κύριος. Ma ebe “onye nwe ha” ga-ekwe omume n’echiche nkịtị, e tinyere ya n’ala peeji ka a ghara ikpochapụ nghọta ahụ ọzọ.
- issue: Onye bụ isiokwu nke ἀποστελεῖ
  choice: ọ ga-eziga ha
  alternative: Onyenwe anyị ga-eziga ha
  rationale: Grik nwere naanị ngwaa onye nke atọ n’enweghị aha isiokwu. Ịhapụ ya dịka “ọ” na-edebe nhịahụ ahụ; n’usoro okwu a, onye kwuru okwu ahụ bụ onye o yikarịrị ka ọ ga-eziga anụmanụ ndị ahụ.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, nke dị ùgwù ma dị mfe nghọta mee ihe. “Unu” na-egosi ọtụtụ ndị a na-agwa okwu. E debere okwu dị nkenke ma ghara itinye “izighachi,” n’ihi na echiche nlọghachi adịghị n’ụdị Grik ahụ.
