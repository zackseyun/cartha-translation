id: MAT.21.23
reference: Matthew 21:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: ig
  text: Mgbe ọ batara n’ogige ụlọ nsọ[a], ndị isi nchụaja na ndị okenye nke ndị mmadụ bịakwutere ya mgbe ọ na-ezi ihe, sị ya, “Ọ bụ ikike dị aṅaa ka i ji eme ihe ndị a? Ònye kwa nyere gị ikike a?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ ἱερόν na-ezo aka n’ogige ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n’ime ya.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Mgbe ọ batara
  rationale: Nkebi okwu genitive absolute a na-egosi oge ihe mere; ‘Mgbe ọ batara’ bụ Igbo e ji eme ihe nke ọma ma na-egosi usoro akụkọ ahụ n’enweghị ịkọwa ihe karịrị ihe Grik kwuru.
- source_word: ἱερὸν
  choice: ogige ụlọnsọ ukwu
  rationale: ἱερόν na-ezo aka n’ogige na akụkụ nile nke temple complex, ọ bụghị kpọmkwem ebe nsọ dị n’ime (ναός). ‘Ogige ụlọnsọ ukwu’ na-eme ka ọdịiche a doo anya n’Igbo.
- source_word: προσῆλθον αὐτῷ
  choice: bịakwutere ya
  rationale: Nke a na-egosi na ha bịara nso n’ebe ọ nọ; ‘bịakwutere ya’ bụ okwu Igbo doro anya ma kwekọọ n’omume ahụ.
- source_word: διδάσκοντι
  choice: mgbe ọ na-ezi ihe
  rationale: Present participle ahụ na-egosi na ịkụzi ihe na ọbịbịa ha mere n’otu oge; nkebi a na-echekwa mmekọrịta oge ahụ.
- source_word: οἱ ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Plural a na-ezo aka n’otu ndị ndú nchụaja, ọ bụghị ọtụtụ ndị ji ọkwa otu nnukwu onye nchụaja; ‘ndị isi nchụaja’ na-echekwa ihe ahụ pụtara.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: ndị okenye nke ndị mmadụ
  rationale: Nke a na-ezo aka n’ụmụ nwoke ndị a ma ama dị ka ndị ndú ndị mmadụ; nsụgharị ahụ dị nso n’usoro Grik ma ghọta ya n’Igbo.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Ọ bụ ikike dị aṅaa ka i ji
  rationale: ἐξουσία ebe a bụ ikike ma ọ bụ ikike e nyere mmadụ ime ihe. Usoro Igbo a na-egosipụta ajụjụ banyere ntọala ikike Jizọs.
- source_word: ταῦτα ποιεῖς
  choice: eme ihe ndị a
  rationale: Nke a na-echekwa plural demonstrative na omume ndị a na-agbagha n’oge ahụ n’enweghị ịgbakwunye nkọwa.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: Ònyekwa nyere gị ikike a?
  rationale: Simple past ‘nyere’ kwekọrọ n’aorist ἔδωκεν ma na-ada ka ajụjụ nkịtị n’Igbo; ‘-kwa’ na-echekwa njikọ καὶ nke ajụjụ nke abụọ.
theological_decisions:
- issue: Ihe ἐξουσία pụtara n’ajụjụ ndị ndú ahụ
  choice: ikike
  alternative: ike; ikike ime ihe
  rationale: Ihe a na-ajụ bụ onye nyere Jizọs ikike ziri ezi ime na izi ihe ndị a, ọ bụghị naanị ike ọ nwere. ‘Ikike’ na-echekwa ma echiche nkwado ọchịchị ma ịdị arọ nke okwu ahụ n’ihe gbasara Chineke, n’enweghị itinye ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ụlọnsọ ukwu’ bụ otu okwu n’orthography a, ebe ‘ogige’ na nkọwa ala ala peeji na-eme ka o doo anya na ebe a bụ temple precincts. E chekwaghị esemokwu banyere ebe ikike Jizọs si bịa site n’ịgbakwunye azịza n’amaokwu a.
