  to: Mgbe ọ batara n’ogige ụlọ nsọ[a], ndị isi nchụaja na ndị okenye nke ndị mmadụ bịakwutere ya mgbe ọ na-ezi ihe, sị ya, “Ọ bụ ikike dị aṅaa ka i ji eme ihe ndị a? Ònye kwa nyere gị ikike a?”
