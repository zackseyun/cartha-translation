id: MAT.21.25
reference: Matthew 21:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: ig
  text: “Baptizim Jọn, o si ebee? O si n’eluigwe[a] ka o si n’aka ụmụ mmadụ[b]?” Ha nọ na-atụle okwu ahụ n’etiti onwe ha, na-asị, “Ọ bụrụ na anyị asị, ‘O si n’eluigwe,’ ọ ga-asị anyị, ‘Gịnịzi mere unu ekweghị ya?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’aka Chineke”; “n’eluigwe” bụ ụzọ nkwanye ùgwù e si ekwu na ihe sitere n’aka Chineke ma ọ bụ na Chineke nyere ya ikike.
    reason: lexical_alternative
  - marker: b
    text: “N’aka ụmụ mmadụ” pụtara na o sitere n’aka mmadụ, n’adịghị ka ihe sitere n’eluigwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: Baptizim
  rationale: Ọ na-ezo aka n’emume na ozi baptizim Jọn, ọ bụghị nanị n’omume ịmikpu mmadụ n’ime mmiri n’otu oge.
- source_word: τὸ Ἰωάννου
  choice: Jọn
  rationale: Nhazi ‘Baptizim Jọn’ na-egosi n’Igbo nke ọma na baptizim ahụ bụ nke metụtara Jọn.
- source_word: πόθεν ἦν
  choice: ò sitere n’ebe?
  rationale: Ajụjụ a bụ maka ebe ikike ma ọ bụ mmalite ya si bịa; okwu a bụ Igbo dị mfe ma na-edobe ajụjụ banyere isi mmalite.
- source_word: ἐξ οὐρανοῦ
  choice: o sitere n’eluigwe
  rationale: A hapụrụ ‘eluigwe’ dịka okwu Grik si dị, nke nwekwara ike ịbụ ụzọ nkwanye ùgwù e si ekwu na ihe sitere n’aka Chineke.
- source_word: ἐξ ἀνθρώπων
  choice: o sitere n’aka mmadụ
  rationale: ‘Mmadụ’ ebe a bụ mmadụ n’ozuzu, ọ bụghị naanị nwoke; ọ na-egosi ọdịiche dị n’etiti mmalite mmadụ na mmalite eluigwe.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: Ha wee na-atụgharị uche n’etiti onwe ha
  rationale: Ọ na-egosi mkparịta ụka na ntụgharị uche ha na-aga n’ihu n’etiti onwe ha.
- source_word: Ἐὰν εἴπωμεν
  choice: Ọ bụrụ na anyị asị
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọ ọnọdụ ha chere na ọ pụrụ ime.
- source_word: ἐρεῖ ἡμῖν
  choice: ọ ga-ajụ anyị
  rationale: Ọ bụ ezie na Grik pụtara n'ụzọ sara mbara ‘ọ ga-asị anyị,’ ihe na-esochi ya bụ ajụjụ kpọmkwem; ‘ọ ga-ajụ anyị’ bụ Igbo eke nke na-edobe ọrụ okwu ahụ.
- source_word: Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ
  choice: Gịnịzi mere unu ekweghị ya?
  rationale: ‘Gịnịzi mere’ na-edobe ike nkwubi okwu οὖν, ebe ‘ekweghị ya’ na-egosi na ha anabataghị okwu na ikike Jọn.
theological_decisions:
- issue: Ihe ‘sitere n’eluigwe’ pụtara
  choice: Debe ‘sitere n’eluigwe’ n’ahịrịokwu bụ isi.
  alternative: sitere n’aka Chineke
  rationale: Nke a na-edobe okwu Grik na ụzọ nkwanye ùgwù e si akọ mmalite ma ọ bụ ikike Chineke, n’enweghị ịgbanwe okwu ahụ ka ọ bụrụ nkọwa kpọmkwem.
- issue: Ihe ἀνθρώπων pụtara n’ọdịiche ya na eluigwe
  choice: sitere n’aka mmadụ
  alternative: sitere n’aka ndị mmadụ
  rationale: Ọ na-ezo aka na mmalite mmadụ n’ozuzu, ọ bụghị na nwoke kpọmkwem; ụdị otu ‘mmadụ’ na-arụ ọrụ dị otú a nke ọma n’Igbo.
- issue: Ihe πιστεύω αὐτῷ pụtara
  choice: unu ekweghị ya
  alternative: unu atụkwasịghị ya obi
  rationale: N’ebe a, okwu ahụ metụtara ikwere ozi Jọn na ịnakwere ikike ya; ‘ikwe ya’ na-ahapụ akụkụ abụọ ahụ ka ha dị n’enweghị imechi nkọwa ahụ naanị n’ịtụkwasị obi.
translation_notes:
  register: E ji Igbo Ọha dị ugbu a, dị ugwu ma dị mfe nghọta. ‘Baptizim’ bụ okwu ụka a maara nke ọma; ajụjụ ndị ahụ na mkparịta ụka ahụ nọ n’usoro okwu Igbo eke. E tinyere akara ndetu ala peeji [a] na [b] kpọmkwem n’ebe okwu ha na-akọwa dị.
