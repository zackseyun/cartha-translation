  to: “Baptizim Jọn, o si ebee? O si n’eluigwe[a] ka o si n’aka ụmụ mmadụ[b]?” Ha nọ na-atụle okwu ahụ n’etiti onwe ha, na-asị, “Ọ bụrụ na anyị asị, ‘O si n’eluigwe,’ ọ ga-asị anyị, ‘Gịnịzi mere unu ekweghị ya?’”
