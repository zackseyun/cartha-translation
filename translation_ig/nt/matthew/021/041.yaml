- from: Ha sịrị ya, “Ọ ga-ebibi ndị ajọ mmadụ ahụ n’ụzọ jọgburu onwe ya[a], ọ ga-agbazinyekwa ubi vaịn ahụ nye ndị ọrụ ubi ọzọ[b], ndị ga-enye ya mkpụrụ ya n’oge ha kwesịrị ekwesị[c].”
  to: Ha sịrị ya, “Ọ ga-ebibi ndị ajọ mmadụ ahụ n’ụzọ jọgburu onwe ya[a], ọ ga-agbazinyekwa ubi vaịn ahụ nye ndị ọrụ ugbo ọzọ[b], ndị ga-enye ya mkpụrụ ubi ahụ n’oge a kara aka[c].”
  rationale: The revision retains the Greek judgment wordplay’s force without overdefining its mode, uses the standard term for farmers, clarifies that the fruits are the vineyard’s produce, and renders the appointed-time expression idiomatically. Footnote b is revised to avoid adding a particular tenancy model not stated in the source.
