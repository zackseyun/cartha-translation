  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Κακοὺς κακῶς ἀπολέσει αὐτούς, καὶ τὸν ἀμπελῶνα ἐκδώσεται ἄλλοις γεωργοῖς, οἵτινες ἀποδώσουσιν αὐτῷ τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: ig
  text: Ha sịrị ya, “Ọ ga-ebibi ndị ajọ mmadụ ahụ n’ụzọ jọgburu onwe ya[a], ọ ga-agbazinyekwa ubi vaịn ahụ nye ndị ọrụ ugbo ọzọ[b], ndị ga-enye ya mkpụrụ ubi ahụ n’oge a kara aka[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ọ ga-eji ajọ mbibi bibie ndị ajọ mmadụ ahụ.” N’asụsụ Grik, e ji okwu abụọ sitere n’otu mgbọrọgwụ mee egwuregwu okwu iji mesie ịdị arọ nke ikpe ahụ ike.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ ga-agbazite ubi vaịn ahụ nye ndị ọrụ ugbo ọzọ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ndị ga-enye ya ihe ubi ahụ n’oge kwesịrị ekwesị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Ha sịrị ya
  rationale: Okwu Grik a dị n’oge ugbu a dịka usoro akụkọ ihe mere eme; iji oge gara aga n’Igbo na-eme ka akụkọ ahụ gaa nke ọma.
- source_word: Κακοὺς κακῶς ἀπολέσει αὐτούς
  choice: Ọ ga-ebibi ndị ajọ mmadụ ahụ n’ụzọ jọgburu onwe ya
  rationale: Nke a na-egosi ma ajọ omume ndị ahụ ma ịdị arọ nke mbibi ha, n’agbanyeghị na enweghị ike iweghachi egwuregwu okwu Grik ahụ kpọmkwem n’Igbo n’enweghị asụsụ siri ike.
- source_word: τὸν ἀμπελῶνα
  choice: ubi vaịn ahụ
  rationale: Nke a bụ okwu Igbo doro anya maka ubi a na-akụ vaịn, ma na-edobe onyinyo ubi vaịn dị n’ilu ahụ.
- source_word: ἐκδώσεται ἄλλοις γεωργοῖς
  choice: ọ ga-agbazinyekwa ... nye ndị ọrụ ubi ọzọ
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara inye ndị ọzọ ala ka ha rụọ ọrụ n’ime ya dịka ndị bi ụgwọ; “ịgbazinye” na-egosi nhazi ahụ nke ọma.
- source_word: ἀποδώσουσιν αὐτῷ τοὺς καρποὺς
  choice: ndị ga-enye ya mkpụrụ ya
  rationale: Ngwaa ahụ na-egosi inye onye nwe ubi ihe ruuru ya; “mkpụrụ” na-edobe ma ihe ubi pụtara n’elu ma nghọta ihe atụ ya.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: n’oge ha kwesịrị ekwesị
  rationale: καιροί na-ezo aka n’oge a kara aka ma ọ bụ oge kwesịrị ekwesị; nsụgharị a bụ nke e ji eme ihe n’Igbo ma na-adabara owuwe ihe ubi.
theological_decisions:
- issue: Ịdị arọ na ụdị ikpe dị n’azịza ndị ahụ
  choice: Ọ ga-ebibi ndị ajọ mmadụ ahụ n’ụzọ jọgburu onwe ya
  alternative: Ọ ga-eji ajọ mbibi bibie ndị ajọ mmadụ ahụ
  rationale: Akwụkwọ Grik ji egwuregwu okwu siri ike kwupụta ikpe ahụ, ọ bụghị okwu nkà mmụta okpukpe nke na-akọwa kpọmkwem ụdị ntaramahụhụ ahụ. Nsụgharị a na-edobe ịdị arọ ya n’etinyeghị nkọwa ọzọ n’ime ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, mee ihe. “Ubi vaịn,” “ndị ọrụ ubi,” na “mkpụrụ” na-edobe ihe oyiyi ọrụ ugbo nke ilu ahụ; ihe odide ala ala peeji na-egosi ụzọ ọzọ e nwere isi sụgharịa okwu Grik ndị nwere nghọta sara mbara.
