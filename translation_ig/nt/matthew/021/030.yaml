  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: ig
  text: Mgbe ahụ, ọ gakwuru nke abụọ, gwa ya otu ihe ahụ. Ọ zara, sị, “Aga m aga,[a] nna ukwu,”[b] ma ọ garaghị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ọ sịrị naanị, “Mụ”; ọ bụ azịza e hapụrụ akụkụ ụfọdụ n’ime ya, nke pụtara “Aga m aga.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik κύριε nwekwara ike ịpụta “onyenwe m” ma ọ bụ “nna ukwu.” N’ebe a, ọ bụ okwu nkwanye ùgwù nwa ji agwa nna ya.
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν δὲ
  choice: Mgbe ahụ, ọ gakwuuru
  rationale: A sụgharịrị njikọ akụkọ δέ na participle προσελθών n’ụzọ Igbo si akọ ihe na-aga n’ihu. “Gakwuuru” na-egosi na nna ahụ bịakwutere nwa nke ọzọ.
- source_word: τῷ δευτέρῳ
  choice: nke abụọ
  rationale: E debere mkpụmkpụ okwu Grik ahụ; “nwa” adịghị n’amaokwu a n’onwe ya, ma ihe gbara ya gburugburu mere ka onye a na-ekwu banyere ya doo anya.
- source_word: ὡσαύτως
  choice: otu ihe ahụ
  rationale: Nke a na-ezo aka n’otu iwu ahụ nna ahụ nyere nwa mbụ, ọ bụkwa okwu Igbo doro anya ma dị nkenke.
- source_word: ἀποκριθεὶς εἶπεν
  choice: Onye ahụ zara, sị
  rationale: Nke a na-enye okwu Grik ahụ n’ụzọ akụkọ Igbo na-aga were were, na-enweghị ikwughachi “zara” na “kwuru” n’ụzọ siri ike.
- source_word: Ἐγώ
  choice: Aga m aga
  rationale: Ἐγώ bụ naanị nnọchiaha e mesiri ike, ma ọ bụ azịza e biri ebi nke pụtara na ọ ga-aga. E tinyere ngwaa a na-aghọta n’okwu ahụ ka ọ bụrụ Igbo ebumpụta ụwa, ebe ihe e dere kpọmkwem nọ n’ala ala peeji.
- source_word: κύριε
  choice: nna ukwu
  rationale: N’ebe a κύριε bụ okwu nkwanye ùgwù nwa ji akpọ nna ya, ọ bụghị aha nsọ nye Chineke ma ọ bụ Kraịst. “Nna ukwu” na-egosi nkwanye ùgwù ahụ n’Igbo.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: ma ọ garaghị
  rationale: “Ma” na-eme ka ọdịiche dị n’etiti nkwa ya na omume ya pụta ìhè; “ọ garaghị” na-egosi ihe mechara mee n’oge gara aga.
theological_decisions:
- issue: Otu a ga-esi sụgharịa κύριε mgbe nwa na-agwa nna ya okwu
  choice: nna ukwu
  alternative: Onyenwe m
  rationale: Ihe gbara okwu ahụ gburugburu na-egosi na ọ bụ nkwanye ùgwù a na-enye nna mmadụ. “Onyenwe m” nwere ike ime ka ndị na-agụ ya chee na ọ bụ aha Chineke ma ọ bụ Kraịst, nke amaokwu a anaghị achọ.
- issue: Okwu e biri ebi Ἐγώ
  choice: Aga m aga
  alternative: Mụ onwe m
  rationale: A naghị ekpebi ihe nkà mmụta okpukpe ọzọ site n’okwu e biri ebi a. A na-eme ka ngwaa nke ihe gbara ya gburugburu na-egosi pụta ìhè n’isiokwu, ma na-edebe ụdị Grik kpọmkwem n’ala ala peeji.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị mfe nghọta ma kwesịkwa ekwesị maka akụkọ Ilu Jizọs. A họọrọ “nna ukwu” iji gosi nkwanye ùgwù n’etinyeghị ụda aha nsọ na-adịghị mkpa n’ebe a.
