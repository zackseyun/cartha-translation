id: MAT.21.10
reference: Matthew 21:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: ig
  text: Mgbe ọ banyere na Jerusalem, obodo ahụ dum kpaliri akpali, na-ekwu, “Onye bụ onye a?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: Mgbe ọ banyere
  rationale: A sụgharịrị genitive absolute ahụ dị ka nkebiokwu oge n’Igbo nkịtị; ọ na-egosi na mmeghachi omume obodo ahụ mere mgbe ọ banyere.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: E ji ụdị aha ebe a na-ejikarị ede n’Igbo mee ihe.
- source_word: ἐσείσθη
  choice: ọgba aghara jupụtara
  rationale: Okwu Grik ahụ pụtara n'ụzọ nkịtị ‘ịma jijiji,’ ma n’ebe a ọ na-akọwa mkpali na ọgba aghara dakwasịrị ndị obodo n’ihi mbata Jizọs. Nsụgharị a na-enye ezi nghọta ahụ n’Igbo nke oge a.
- source_word: πᾶσα ἡ πόλις
  choice: n’obodo ahụ dum
  rationale: Nke a bụ ụzọ Igbo doro anya si egosi obodo ahụ niile, ya bụ ndị bi na ya n’ozuzu.
- source_word: λέγουσα
  choice: ndị mmadụ na-asị
  rationale: Ọ bụ ezie na ụtọasụsụ Grik na-ekwu na ‘obodo’ na-asị, Igbo na-aghọta ya nke ọma site n’ịkpọ ndị mmadụ bi n’obodo ahụ aha, n’ebughị ihe ọhụrụ bara uru n’ime ihe e kwuru.
- source_word: Τίς ἐστιν οὗτος;
  choice: Onye bụ onye a?
  rationale: Nke a bụ ajụjụ kpọmkwem ma bụrụkwa Igbo nkịtị; etinyeghị ‘nwoke’ n’ihi na ọ dịghị n’ihe odide Grik.
theological_decisions:
- issue: Ma mmeghachi omume obodo ahụ ọ bụ ịma jijiji n’anụ ahụ ka ọ bụ ọgba aghara n’etiti ọha
  choice: A sụgharịrị ἐσείσθη n’ụzọ ihe atụ dị ka ‘ọgba aghara jupụtara n’obodo ahụ.’
  alternative: ‘obodo ahụ dum mara jijiji’
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi mmeghachi omume ndị mmadụ n’ihi mbata Jizọs, ọ bụghị ala ọma jijiji. Ihe odide ala peeji na-echekwa nsụgharị nkịtị na ihe atụ dị n’okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Ọgba aghara jupụtara’ na-ekwupụta mmeghachi omume ọha n’ụzọ nkịtị, ebe ihe odide ala peeji na-echekwa ihe atụ nke ‘ịma jijiji.’
