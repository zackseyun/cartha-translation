  text: ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Οὐ θέλω· ὕστερον δὲ μεταμεληθεὶς⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: ig
  text: Ma ọ zara sị, “Achọghị m.” Ma mgbe e mesịrị, ọ gbanwere obi ya[a] wee gaa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọ kwaara ụta” ma ọ bụ “ọ gbanwere echiche ya.” Okwu Grik ahụ nwere ike ịgụnye ịkwa ụta nke na-eduga n’ịgbanwe ihe mmadụ kpebiri ime.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: ọ zara sị
  rationale: Nke a bụ ụzọ Igbo si akọ okwu onye zara n'ụzọ doro anya ma kwekọọ n'usoro akụkọ Grik.
- source_word: Οὐ θέλω
  choice: Achọghị m
  rationale: θέλω na-egosi ọchịchọ ma ọ bụ ịdị njikere. “Achọghị m” bụ okwu nkịtị, kpọmkwem, nke na-egosi na nwa ahụ jụrụ ime ihe a gwara ya.
- source_word: ὕστερον
  choice: emechaa
  rationale: Ọ na-egosi na mgbanwe ahụ mere mgbe oge ụfọdụ gasịrị.
- source_word: μεταμεληθεὶς
  choice: ọ gbanwere obi ya
  rationale: Nkebiokwu a na-egosi mgbanwe n'ebumnuche nke dugara ya n'ime ihe a gwara ya, ma ọ naghị amanye nkọwa okpukpe siri ike karịa okwu Grik ahụ.
- source_word: ἀπῆλθεν
  choice: wee gaa
  rationale: N'ọnọdụ a, ọ pụtara na ọ gara ime ihe nna ya gwara ya; “wee gaa” bụ okwu Igbo dị mfe ma kwekọọ n'usoro omume ahụ.
theological_decisions:
- issue: Ntụgharị μεταμεληθεὶς n'ilu a
  choice: ọ gbanwere obi ya
  alternative: ọ kwaara ụta; o chegharịrị
  rationale: Akụkụ a na-elekwasị anya na mgbanwe site n'ịjụ gaa n'irube isi. “Ọ gbanwere obi ya” na-echekwa mgbanwe omume ahụ, na-ahapụkwa ohere maka echiche nke ịkwa ụta, n'ejighị okwu nwere nkọwa okpukpe siri ike karịa ihe okwu Grik ahụ n'onwe ya kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ntụgharị ahụ. E debere nkwugharị “Ma” nke dị na Grik iji gosipụta ọdịiche dị n'etiti ọjụjụ mbụ na omume e mesịrị.
