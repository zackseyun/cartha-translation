  text: ὁ δὲ πλεῖστος ὄχλος ἔστρωσαν ἑαυτῶν τὰ ἱμάτια ἐν τῇ ὁδῷ, ἄλλοι δὲ ἔκοπτον κλάδους ἀπὸ τῶν δένδρων καὶ ἐστρώννυον ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: ig
  text: Ihe ka ọtụtụ n’ime ìgwè mmadụ ahụ[a] tọgbọrọ uwe ha[b] n’okporo ụzọ, ndị ọzọ nọkwa na-egbutu alaka sitere n’osisi ma na-atọgbọrọ ha n’okporo ụzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “akụkụ ka ukwuu nke ìgwè mmadụ ahụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “uwe” dị ka “uwe elu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: Ihe ka ọtụtụ n’ime ìgwè mmadụ ahụ
  rationale: Nke a na-egosi na ọ bụ akụkụ ka ukwuu nke ìgwè mmadụ ahụ, ọ bụghị naanị ìgwè mmadụ buru ibu. A naghị atụgharị δέ iche n’ebe a, n’ihi na usoro ahịrịokwu Igbo na-egosipụta ọganihu akụkọ ahụ nke ọma.
- source_word: ἔστρωσαν
  choice: gbasara
  rationale: Ngwaa a na-egosi ịgbasa ma ọ bụ ịtọsa ihe n’elu ebe a na-aga ije; ‘gbasara’ bụ okwu Igbo doro anya ma kwekọọ n’omume ahụ.
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: uwe ha
  rationale: ‘Uwe ha’ na-egosipụta na uwe ndị ahụ bụ nke ndị mmadụ ahụ n’onwe ha, ma na-edobe ἱμάτια n’ụzọ sara mbara n’etinyeghị ụdị uwe pụrụ iche n’amaokwu ahụ.
- source_word: ἐν τῇ ὁδῷ
  choice: n’okporo ụzọ
  rationale: N’ebe a, ὁδός bụ ụzọ a na-aga n’ezie, ọ bụghị ‘ụzọ’ n’echiche ihe atụ. ‘N’okporo ụzọ’ bụ ntụgharị Igbo e ji eme ihe mgbe a tọsara ihe n’elu ụzọ.
- source_word: ἄλλοι δὲ
  choice: ndị ọzọ nọkwa
  rationale: Nke a na-ewebata otu ndị ọzọ n’ime ìgwè mmadụ ahụ. Mgbakwunye ‘-kwa’ na-egosipụta njikọ δέ n’ụzọ dị nro, na-enweghị ime ka o yie nnukwu mmegide.
- source_word: ἔκοπτον
  choice: na-egbutu
  rationale: Ụdị imperfect Grik na-egosi omume na-aga n’ihu n’oge ahụ; ‘na-egbutu’ na-echekwa echiche ahụ.
- source_word: κλάδους ἀπὸ τῶν δένδρων
  choice: alaka n’osisi
  rationale: Nke a bụ okwu Igbo dị mfe ma kwekọọ kpọmkwem n’alaka ndị e si n’osisi gbutuo.
- source_word: καὶ ἐστρώννυον
  choice: ma na-agbasa ha
  rationale: ‘Na-agbasa’ na-echekwa omume na-aga n’ihu nke imperfect, ebe ‘ha’ na-ezo aka n’alaka ndị ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta, dee amaokwu ahụ. E debere ọdịiche aspect dị n’etiti ἔστρωσαν na ngwaa imperfect ndị na-esote ya site n’iji ‘gbasara’ na ‘na-egbutu… na-agbasa.’
