revisions:
- from: Ihe ka ọtụtụ n’ime ìgwè mmadụ ahụ[a] gbasara uwe ha[b] n’okporo ụzọ, ndị ọzọ nọkwa na-egbutu alaka n’osisi ma na-agbasa ha n’okporo ụzọ.
  to: Ihe ka ọtụtụ n’ime ìgwè mmadụ ahụ[a] tọgbọrọ uwe ha[b] n’okporo ụzọ, ndị ọzọ nọkwa na-egbutu alaka sitere n’osisi ma na-atọgbọrọ ha n’okporo ụzọ.
  rationale: The revision makes the source’s “from the trees” explicit and uses more idiomatic Igbo wording for spreading or laying garments and branches on a road. It retains the majority sense, the narrative grouping, the ongoing aspect of the latter actions, and both footnote anchors.
