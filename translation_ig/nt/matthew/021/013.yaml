id: MAT.21.13
reference: Matthew 21:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: ig
  text: Ọ na-agwa ha, sị, “E dere ya n’Akwụkwọ Nsọ[a], ‘A ga-akpọ ụlọ m ụlọ ekpere,’ ma unu na-eme ya ọgba ndị ohi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ebe a, Jizọs jikọtara Aịzaya 56:7 na Jeremaịa 7:11.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “ọgba ndị na-apụnara mmadụ ihe n’ike.” Okwu Grik ahụ nwere ike ịpụta ndị ohi ma ọ bụ ndị na-eji ime ihe ike apụnara mmadụ ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ọ na-agwa ha, sị
  rationale: E ji usoro oge ugbu a kọwaa ihe mere eme, dịka Grik si mee, iji debe ịdị ndụ nke akụkọ Matiu ma mee ka ọ bụrụ Igbo dị ebumpụta ụwa.
- source_word: Γέγραπται
  choice: E dere ya n’Akwụkwọ Nsọ
  rationale: Nke a bụ ụzọ Igbo doro anya si egosi usoro okwu Grik nke na-ewebata ihe e dere n’Akwụkwọ Nsọ ma na-egosi na ihe ahụ e dere ka dị irè.
- source_word: οἶκός μου
  choice: ụlọ m
  rationale: A hapụrụ ‘ụlọ’ dịka isi okwu Grik si dị, kama ịkọwara ya ozugbo dịka ‘ụlọnsọ,’ ka aha Akwụkwọ Nsọ nyere ụlọ Chineke ghara ịdị warara.
- source_word: οἶκος προσευχῆς
  choice: ụlọ ekpere
  rationale: Nke a bụ okwu Igbo dị mfe ma bụrụkwa nke na-edobe ihe owuwu na ụda nke Aịzaya 56:7.
- source_word: κληθήσεται
  choice: A ga-akpọ
  rationale: Ọ na-egosipụta ọdịnihu na olu nnara nke ngwaa Grik n’ụzọ Igbo nkịtị.
- source_word: ποιεῖτε
  choice: unu na-eme ya
  rationale: Ụdị a na-egosi omume na-aga n’ihu ma na-anọ nso n’echiche nkịtị nke ποιεῖτε, na-enweghị itinye nkọwa ọzọ.
- source_word: σπήλαιον
  choice: ọgba
  rationale: ‘Ọgba’ na-edobe ihe oyiyi nkịtị nke ebe ndị ohi na-ezo ma kwekọọ na ntụaka Jeremaịa 7:11.
- source_word: λῃστῶν
  choice: ndị ohi
  rationale: Nke a bụ okwu Igbo a na-aghọta ngwa ngwa; ihe odide ala peeji na-edobe ohere na okwu Grik ahụ nwekwara ike ịpụta ndị na-apụnara mmadụ ihe n’ike.
theological_decisions:
- issue: Nkwupụta na ntụaka Akwụkwọ Nsọ Agba Ochie
  choice: E debere ‘ụlọ m,’ ‘ụlọ ekpere,’ na ‘ọgba ndị ohi’ ka njikọ ya na Aịzaya 56:7 na Jeremaịa 7:11 pụta ìhè.
  alternative: Iji okwu Igbo tọpụụrụ atọpụ nke ga-eme ka njikọ ya na amaokwu ndị ahụ ghara ịpụta ìhè.
  rationale: Okwu Jizọs jikọtara amụma abụọ; idebe ihe oyiyi na isi okwu ha na-eme ka onye na-agụ ya nwee ike ịhụ ihe ndabere Akwụkwọ Nsọ ahụ n’enweghị ịmanye nkọwa okpukpe otu.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Akwụkwọ Nsọ’ mee ka usoro nkwupụta Γέγραπται doo onye Igbo anya; e debere akụkọ ahụ n’oge ugbu a dịka Grik si dị. Akara ihe odide ala peeji [a] na [b] abụọ pụtara n’ederede.
