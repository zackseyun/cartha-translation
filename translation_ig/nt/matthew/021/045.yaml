  naturalness: “Ilu ya ndị ahụ” is less idiomatic and is unnecessary in Standard Igbo; “ilu ya” naturally carries the intended plural sense in context. In the footnote, “na-ezo aka n’ebe ha nọ” can suggest their physical location rather than that the parables concerned them.
  terminology: “Ndị isi nchụaja,” “ndị Farisii,” and “ilu” are suitable established Standard Igbo biblical terminology. “Banyere ha” is the appropriate non-adversative rendering of περί αὐτῶν.
