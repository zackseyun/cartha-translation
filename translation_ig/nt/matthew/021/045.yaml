  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: ig
  text: Mgbe ndị isi nchụaja na ndị Farisii nụrụ ilu ya, ha ghọtara na ọ na-ekwu banyere ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “gbasara ha.” Ha ghọtara na ilu ndị ahụ bụ banyere ha. Ụfọdụ nsụgharị na-akọwa ya karịa ka, “megide ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Mgbe ... nụrụ
  rationale: Aorist participle a na-egosi oge metụtara ngwaa bụ isi; nkebiokwu oge a bụ Igbo nkịtị ma na-echekwa usoro ihe omume ahụ.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Nke a na-ezo aka n’ọchịchị ndị nchụaja nọ n’ọkwa dị elu, ọ bụghị ọtụtụ ndị ji otu ọkwa Onyeisi Nchụaja n’otu oge.
- source_word: Φαρισαῖοι
  choice: ndị Farisii
  rationale: A na-edegharị aha òtù ndị Juu a n’ụda Igbo kama ịsụgharị ihe aha ahụ pụtara.
- source_word: παραβολὰς
  choice: ilu
  rationale: “Ilu” bụ okwu Igbo a na-aghọta nke ọma maka akụkọ ma ọ bụ okwu ihe atụ Jizọs ji akụzi ihe; ọtụtụ dị na Grik, ya mere e tinyere “ndị ahụ.”
- source_word: ἔγνωσαν
  choice: ha ghọtara
  rationale: N’ebe a, γινώσκω pụtara ịmata ma ọ bụ ịghọta ihe e kwuru; “ghọtara” na-egosi na ha matara na ilu ndị ahụ na-ezo aka n’ebe ha nọ.
- source_word: περὶ αὐτῶν
  choice: banyere ha
  rationale: περί ya na genitive pụtara “banyere/gbasara”; a naghị eme ka ọ bụrụ “megide ha,” n’agbanyeghị na okwu gbara ya gburugburu na-egosi nkatọ.
- source_word: λέγει
  choice: ọ na-ekwu
  rationale: Present tense ahụ na indirect discourse dabara nke ọma na Igbo dịka “ọ na-ekwu,” ma na-echekwa ọdịdị okwu Grik n’enweghị asụsụ na-adịghị eke.
theological_decisions:
- issue: Ma a ga-eme ka o doo anya n’ederede bụ isi na ilu Jizọs bụ okwu ikpe megide ndị ndu ahụ
  choice: ọ na-ekwu banyere ha
  alternative: ọ na-ekwu megide ha
  rationale: Grik kwuru περὶ αὐτῶν, ya bụ “banyere ha.” Ọnọdụ akụkọ ahụ na-egosi nkatọ, ma nsụgharị ekwesịghị itinye “megide” n’ederede bụ isi mgbe preposition ahụ ekwughị ya kpọmkwem.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Ndị isi nchụaja” na “ndị Farisii” bụ okwu Akwụkwọ Nsọ ndị mmadụ maara; “ilu” na-eme ka ahịrịokwu ahụ bụrụ nke eke n’Igbo. E debere akara nkọwa ala peeji [a] ozugbo n’ebe okwu ọ na-akọwa dị.
