    rationale: The note concerns περὶ αὐτῶν, rendered “banyere ha,” so its anchor should immediately follow that phrase.
  - severity: medium
    issue: The footnote’s explanation “na-ezo aka n’ebe ha nọ” is semantically imprecise.
    rationale: “N’ebe ha nọ” commonly refers to where people are located. The explanation should say directly that the parables concerned them.
  - severity: low
    issue: “Ilu ya ndị ahụ” is marked and redundant in this context.
    rationale: “Ilu ya” is natural Igbo and adequately renders “his parables”; the removed demonstrative adds no source-based meaning.
