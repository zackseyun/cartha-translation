id: MAT.21.4
reference: Matthew 21:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τοῦτο ⸀δὲ γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: ig
  text: 'Ihe a mere ka ihe e kwuru site n’aka onye amụma wee mezuo, sị:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῦτο
  choice: Ihe a
  rationale: Nnọchiaha ngosi a dị n’otu ma na-ezo aka n’ihe niile mere ozugbo tupu amaokwu a.
- source_word: δὲ
  choice: —
  rationale: Ọ bụ njikọ dị nro n’ebe a; usoro okwu Igbo na-egosi njikọ ahụ nke ọma n’enweghị ịgbakwunye ‘ma’ ma ọ bụ okwu ọzọ ga-eme ka ọdịiche sie ike karịa nke Grik.
- source_word: γέγονεν
  choice: mere
  rationale: Oge perfect nke γίνομαι dị n’usoro okwu mmezu amụma; ‘mere’ bụ Igbo nkịtị ma doo anya n’akụkọ a.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a na-egosi ebumnuche ma ọ bụ nsonaazụ dịka ἵνα si eme, n’Igbo dị mfe ma bụrụkwa nke e ji asụ ugbu a.
- source_word: πληρωθῇ
  choice: mezuo
  rationale: Na-echekwa echiche nke ime ka okwu amụma ruo n’uju; usoro ‘wee mezuo’ dabara na subjunctive nke na-eso ἵνα.
- source_word: τὸ ῥηθὲν
  choice: ihe e kwuru
  rationale: Na-echekwa participle passive ahụ dịka ihe e kwuru, n’etinyeghị onye kwuru ya n’ahịrịokwu ahụ.
- source_word: διὰ τοῦ προφήτου
  choice: site n’ọnụ onye amụma
  rationale: Ọ bụ ụzọ Igbo sitere n’okike isi gosi na okwu ahụ bịara site n’aka onye amụma dịka onye ogbugbo, ma na-echekwa διά ya na genitive.
- source_word: λέγοντος
  choice: sị
  rationale: Ọ bụ ụzọ Igbo dị nkenke ma bụrụkwa nke okike isi webata okwu a ga-ehota n’amaokwu na-esote.
theological_decisions:
- issue: Mmezu amụma na ọrụ onye amụma dịka onye ogbugbo
  choice: ihe e kwuru site n’ọnụ onye amụma wee mezuo
  alternative: ihe onye amụma kwuru wee mezuo
  rationale: Nhọrọ ahụ na-echekwa passive ‘ihe e kwuru’ na διά, nke na-egosi okwu e sitere n’aka Chineke kwuo site n’ọnụ onye amụma, kama ime ya naanị ihe onye amụma kwuru n’onwe ya.
- issue: Ebumnuche ma ọ bụ nsonaazụ nke ἵνα
  choice: ka ... wee mezuo
  alternative: nke mere na ... mezuru
  rationale: ‘Ka ... wee’ na-echekwa ike telic nke ἵνα ma ghara ikpebi kpamkpam ma ihe a na-elekwasị anya bụ naanị ebumnuche ka ọ bụ nsonaazụ.
translation_notes:
  register: Standard Igbo; okwu ndị a bụ nke ugbu a, dị ùgwù, ma dị mfe nghọta. Ejiri ‘site n’ọnụ onye amụma’ chekwaa echiche nke prophetic mediation n’ụzọ Igbo sitere n’okike. Enweghị akara nkọwa ala peeji n’ihi na ọdịiche ‘through/by’ abanyela nke ọma n’ihe a sụgharịrị.
