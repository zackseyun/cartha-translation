id: MAT.21.20
reference: Matthew 21:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: ig
  text: Mgbe ndị na-eso ụzọ ya hụrụ ya, o juru ha anya, ha wee sị, “Olee otú osisi fig ahụ siri kpọnwụọ ozugbo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: Mgbe ... hụrụ nke a
  rationale: A tụgharịrị aorist participle ahụ dị ka nkebiokwu oge n’Igbo. “Nke a” na-ezo aka n’ihe mere osisi fig ahụ nke a kọwara n’amaokwu bu ụzọ.
- source_word: οἱ μαθηταί
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa μαθηταί; “ya” na-eme ka mmekọrịta ha na Jizọs doo anya site n’okwu gbara ya gburugburu.
- source_word: ἐθαύμασαν
  choice: o juru ha anya
  rationale: Nkebiokwu Igbo a na-egosi ịdị n’ọnụ n’ihi ihe a hụrụ, kwekọrọ na θαυμάζω n’ebe a.
- source_word: λέγοντες
  choice: ha wee sị
  rationale: A tụgharịrị participle nke okwu ahụ n’ụzọ Igbo dị ire, dị ka omume sochiri ihe ijuanya ha.
- source_word: Πῶς
  choice: Olee otú ... siri
  rationale: Nke a bụ usoro ajụjụ Igbo nkịtị maka ụzọ ihe si mee.
- source_word: παραχρῆμα
  choice: ozugbo
  rationale: “Ozugbo” na-egosipụta kpọmkwem echiche nke ime ihe n’otu ntabi anya ma ọ bụ n’egbughị oge.
- source_word: ἐξηράνθη
  choice: kpọnwụọ
  rationale: “Kpọnwụọ” bụ ngwaa Igbo kwesịrị ekwesị maka osisi nke akwụkwọ na ndụ ya kpọrọ nkụ ma nwụọ; ọ na-eburu echiche passive ahụ n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: ἡ συκῆ
  choice: osisi fig ahụ
  rationale: A hapụrụ “fig” dị ka aha mkpụrụ osisi a maara, tinyekwa “osisi” iji gosi n'ụzọ doro anya na συκῆ bụ osisi fig ahụ a kpọtụrụ aha.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. A họọrọ usoro ahịrịokwu ebumpụta ụwa n’Igbo ma debe ike nke παραχρῆμα site n’okwu “ozugbo.”
