  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τί δὲ ὑμῖν δοκεῖ; ἄνθρωπος εἶχεν τέκνα δύο. ⸀προσελθὼν τῷ πρώτῳ εἶπεν· Τέκνον, ὕπαγε σήμερον ἐργάζου ἐν τῷ ⸀ἀμπελῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: ig
  text: Ma gịnị ka unu chere? Otu nwoke nwere ụmụ abụọ.[a] Ọ gakwuuru nke mbụ, sị ya, “Nwa, gaa rụọ ọrụ taa n’ubi vaịn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụ nwoke abụọ.” Ọtụtụ nsụgharị na-eji “ụmụ nwoke,” ma okwu Grik e ji mee ihe n’ebe a (τέκνα) pụtara “ụmụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: Ma gịnị ka unu chere?
  rationale: “Gịnị ka unu chere?” na-egosi ajụjụ a na-ajụ ndị na-ege ntị ka ha kwuo echiche ha; “Ma” na-echekwa njikọ dị nro nke δὲ.
- source_word: ἄνθρωπος
  choice: Otu nwoke
  rationale: N’akụkọ a, okwu ahụ na-ezo aka n’otu nwoke bụ́ nna nwe ụlọ; “otu nwoke” bụ ụzọ Igbo si ewebata onye dị otú a n’akụkọ.
- source_word: τέκνα δύο
  choice: ụmụ abụọ
  rationale: τέκνα pụtara ụmụ n’ozuzu ya, ọ bụghị kpọmkwem ụmụ nwoke; “ụmụ abụọ” na-echekwa obosara okwu Grik ahụ.
- source_word: προσελθὼν τῷ πρώτῳ
  choice: Ọ gakwuuru nke mbụ
  rationale: Nke a na-egosi na nwoke ahụ bịakwutere otu n’ime ụmụ ya, bụ́ nke mbụ a kpọrọ aha, tupu o kwuo okwu.
- source_word: Τέκνον
  choice: Nwa m
  rationale: τέκνον bụ okwu nna ji akpọ nwa ya. “Nwa m” bụ okwu Igbo ebumpụta ụwa nke na-echekwa mmekọrịta ahụ, na-enweghị ime ka ọ bụrụ kpọmkwem nwa nwoke.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: gaa rụọ ọrụ taa
  rationale: 'Nke a na-enye iwu atọ ahụ n’usoro Igbo dị mfe ma doo anya: ịga, ịrụ ọrụ, na ime ya taa.'
- source_word: ἐν τῷ ἀμπελῶνι
  choice: n’ubi vaịn
  rationale: “Ubi vaịn” na-egosi ebe a na-akụ vaịn, ma na-echekwa ihe atụ ọrụ ugbo dị n’akụkọ ahụ.
theological_decisions:
- issue: Ma a ga-asụgharị τέκνα/τέκνον dịka “ụmụ nwoke/nwa nwoke” n’ihi ọdịnala ntụgharị ụfọdụ
  choice: ụmụ / Nwa m
  alternative: ụmụ nwoke / Nwa nwoke m
  rationale: Amaokwu a ji τέκνα na τέκνον, bụ́ okwu sara mbara karịa “ụmụ nwoke” na “nwa nwoke.” Ya mere, ntụgharị ahụ ekwesịghị ime ka ihe Grik kwuru bụrụ ihe dị warara karịa ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Nwa m” bụ ụdị okwu a na-ejikarị agwa nwa okwu n’Igbo; ọ dị nro ma kwekọọ n’ọnọdụ nna na nwa. E ji “ubi vaịn” mee ka ihe ubi a kpọrọ aha doo onye na-agụ taa anya.
