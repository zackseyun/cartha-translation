  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: ig
  text: Ma mgbe e mesịrị, o zigara ha nwa ya nwoke, na-asị, “Ha ga-asọpụrụ nwa m.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ha ga-akwanyere nwa m ùgwù.” Ngwaa Grik ahụ nwere ike ịpụta igosi mmadụ nsọpụrụ ma ọ bụ nkwanye ùgwù; n’ọnọdụ ndị ọzọ, ọ pụkwara ịpụta “inwe ihere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: mgbe e mesịrị
  rationale: Ọ bụ nkebiokwu oge pụtara ‘mgbe nke ahụ gasịrị’ ma ọ bụ ‘emesịa.’ Ọ na-egosi usoro ihe mere n’etinyeghị echiche siri ike nke na nke a bụ omume ikpeazụ kpamkpam.
- source_word: δὲ
  choice: Ma
  rationale: 'Ọ na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche: mgbe o zigachara ndị ohu, onye nwe ubi ahụ zigaziri nwa ya nwoke.'
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: o zigara ha
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji ekwu na e zipụrụ mmadụ ka ọ gaa n’ebe ndị ọzọ nọ; ọ naghị ewebata echiche pụrụ iche gbasara ịbụ onyeozi.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: nwa ya nwoke
  rationale: ‘Nwa ya nwoke’ na-eme ka ụdị nwoke nke υἱός doo anya ma na-anọgide n’ụdị akụkọ ilu ahụ, n’etinyeghị okwu dịka ‘ọ hụrụ n’anya’ nke na-adịghị n’amaokwu Grik.
- source_word: λέγων
  choice: na-asị
  rationale: Ọ na-ewebata kpọmkwem ihe onye nwe ubi ahụ kwuru n’ụzọ Igbo dị mfe ma kwekọọ na participle Grik.
- source_word: Ἐντραπήσονται
  choice: Ha ga-asọpụrụ
  rationale: Ebe ngwaa ahụ nwere ‘nwa m’ dịka ihe a na-eme ihe n’ebe ọ nọ, ọ pụtara igosi nkwanye ùgwù ma ọ bụ nsọpụrụ. ‘Ga-asọpụrụ’ bụ okwu Igbo nke oge a, doro anya, ma ọ naghị eme ka nsọpụrụ ahụ bụrụ ofufe.
- source_word: τὸν υἱόν μου
  choice: nwa m
  rationale: Ọ na-echekwa mmekọrịta onwe onye na mmetụta dị n’okwu onye nwe ubi ahụ n’ụzọ Igbo nkịtị.
theological_decisions:
- issue: Otu e si akọwa nwa nwoke ahụ n’ilu ahụ n’etinyeghị nkọwa Kraịst karịa ihe amaokwu ahụ kwuru
  choice: nwa ya nwoke / nwa m
  alternative: Nwa ya ọ hụrụ n’anya / Ọkpara ahụ
  rationale: Ilụ ahụ na-arụtụ aka n’ebe Jizọs nọ, ma amaokwu Grik a ji naanị υἱός, ọ dịghịkwa ἀγαπητός (‘onye a hụrụ n’anya’) n’ime ya. Nsụgharị a na-ahapụ ka ihe ọ pụtara banyere Kraịst pụta site n’ọnọdụ akụkọ ahụ kama ịtinye ya n’amaokwu ahụ.
- issue: Uche onye nwe ubi ahụ gosiri site n’ọdịnihu Ἐντραπήσονται
  choice: Ha ga-asọpụrụ nwa m
  alternative: Ikekwe ha ga-asọpụrụ nwa m
  rationale: Ụdị Grik bụ nkwupụta ọdịnihu, ọ bụghị okwu na-egosi nanị ohere. Ya mere, nsụgharị ahụ na-echekwa nkwenye ma ọ bụ atụmanya onye ahụ kwuru n’etinyeghị ‘ikekwe.’
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. ‘Mgbe e mesịrị’ na-echekwa usoro oge; ‘nwa ya nwoke’ na-eme ka onye a kpọrọ υἱός doo anya; ‘ịsọpụrụ’ na-egosi nkwanye ùgwù n’ebughị echiche nke ofufe bata.
