  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς πάντας τοὺς λόγους τούτους, εἶπεν τοῖς μαθηταῖς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/001.yaml
  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: ig
  text: Mgbe Jizọs kwuchara okwu ndị a niile,[a] ọ gwara ndị na-eso ụzọ ya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya n''ụzọ na-esochikwu usoro okwu mbụ: “O wee ruo na mgbe Jizọs kwuchara okwu ndị a niile, ọ gwara ndị na-eso ụzọ ya,”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Mgbe
  rationale: Usoro akụkọ a na-ewebata oge ihe mere. N'Igbo ugbu a, “Mgbe” na-egosi njikọ oge na mgbanwe akụkọ nke ọma, n'etinyeghị ahịrịokwu siri ike dị ka “O wee ruo na mgbe.”
- source_word: ἐτέλεσεν
  choice: kwuchara
  rationale: N'ebe a, ngwaa ahụ na-egosi na Jizọs mechara okwu ya tupu ya agwa ndị na-eso ụzọ ya. “Kwuchara” bụ ụzọ Igbo dị ndụ isi gosipụta mmecha ikwu okwu.
- source_word: πάντας τοὺς λόγους τούτους
  choice: okwu ndị a niile
  rationale: “Okwu” na-anọgide nso n'λόγους ma dabara n'usoro Matiu ji emechi ogologo nkuzi; “ndị a niile” na-edebe πάντας na τούτους.
- source_word: εἶπεν
  choice: ọ gwara
  rationale: N'Igbo, “ọ gwara” bụ ụzọ nkịtị e si sụgharịa mmadụ ịgwa ndị ọzọ okwu, ọkachasị mgbe ndị a na-agwa ya sochiri ya; ọ naghị etinye ihe ọzọ n'ihe Grik kwuru.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo doro anya na nke a na-ejikarị eme ihe maka μαθηταί; “ya” na-edebe nnọchiaha nwe αὐτοῦ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu bụ mmalite nke na-aga n'ihu n'amaokwu na-esote, ya mere e ji rikoma mechie ya.
