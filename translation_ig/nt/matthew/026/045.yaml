id: MAT.26.45
reference: Matthew 26:45
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: ig
  text: Mgbe ahụ, ọ bịakwutere ndị na-eso ụzọ ya, sị ha, “Rahụnụ ụra ugbu a, zuonụ ike.[a] Lee, oge ahụ abịaruola nso,[b] a na-enyefe Nwa nke Mmadụ n’aka ndị mmehie.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu ka na-arahụ ụra ma na-ezu ike?” A pụrụ ịghọta okwu Grik a dịka ajụjụ nkwuwa-okwu; ahịrị bụ isi na-edobe mgbagwoju anya ahụ na ụda ịkwa emo ọ pụrụ inwe.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “oge ahụ eruola,” ma ọ bụ, “oge ahụ dị nso.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “a na-arara Nwa nke Mmadụ nye.” Okwu Grik ahụ pụtara n’ụzọ sara mbara “inyefe” ma ọ bụ “inyefe n’aka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ njikọ oge na-egosi ihe mere na-esote n’usoro akụkọ.
- source_word: ἔρχεται πρὸς τοὺς μαθητάς
  choice: ọ bịakwutere ndị na-eso ụzọ ya
  rationale: A sụgharịrị historical present nke Grik n’oge gara aga ka akụkọ ahụ daa nke ọma n’Igbo; ‘bịakwutere’ na-egosi ịgakwuru ha.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Na-arahụnụ ụra ugbu a, zuruọnụ ike
  rationale: Nke a na-edebe ọdịdị iwu dị n’okwu Grik na ihe ọchị ilu ma ọ bụ nkwenye dị n’ọnọdụ ahụ, na-enweghị ime ka ọ bụrụ ajụjụ n’ahịrị bụ isi.
- source_word: ἰδοὺ
  choice: Lee
  rationale: ‘Lee’ bụ okwu Igbo doro anya nke na-akpọ ndị na-ege ntị ka ha ṅaa ntị n’ihe dị mkpa.
- source_word: ἤγγικεν ἡ ὥρα
  choice: oge ahụ abịaruola nso
  rationale: 'Nke a na-egosipụta perfect nke ἐγγίζω: oge ahụ erutela ọnọdụ ịdị nso ugbu a, ma ọ naghị amanye nkọwa na ọ bịarutela kpamkpam.'
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: E debere aha pụrụ iche Jizọs ji akọwa onwe ya kama ịkọwagharị ya.
- source_word: παραδίδοται
  choice: a na-enyefekwa
  rationale: Usoro a na-edebe passive na nghọta sara mbara nke ‘inyefe,’ kama imechi ya naanị n’echiche nke ịrara mmadụ nye.
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: n’aka ndị mmehie
  rationale: Akpaalaokwu a doro anya n’Igbo ma na-edebe ihe atụ doro anya nke okwu Grik.
theological_decisions:
- issue: Ike okwu Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: 'E dere ya dịka iwu nwere ike ịbụ okwu ilu ma ọ bụ nkwenye: “Na-arahụnụ ụra ugbu a, zuruọnụ ike.”'
  alternative: “Unu ka na-arahụ ụra ma na-ezu ike?”
  rationale: Ọdịdị na ọnọdụ okwu Grik na-enye ohere ịghọta ya dịka iwu nwere ihe ọchị ilu ma ọ bụ dịka ajụjụ nkwutọ. Ahịrị bụ isi na-edebe ọdịdị okwu ahụ, ebe nkọwa ala peeji na-egosi ụzọ ọzọ.
- issue: Ihe παραδίδοται pụtara n’akụkọ ahụhụ Jizọs
  choice: a na-enyefekwa
  alternative: a na-ararakwa nye
  rationale: ‘Inyefe’ na-edebe obosara okwu Grik, nke nwere ike ịgụnye nrara Judas, njide Jizọs, na inyefe ya n’aka ndị ọzọ, n’ebughị ụzọ mechie nghọta ahụ n’otu naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E họọrọ usoro akụkọ gara aga ka ọ bụrụ Igbo ebumpụta ụwa, ebe e debere esemokwu dị n’iwu banyere ihi ụra, ịdị nso nke oge ahụ, na obosara nke okwu ‘inyefe.’
