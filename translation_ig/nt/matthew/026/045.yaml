revisions:
- from: Mgbe ahụ, ọ bịakwutere ndị na-eso ụzọ ya, sị ha, “Na-arahụnụ ụra ugbu a, zuruọnụ ike.[a] Lee, oge ahụ abịaruola nso,[b] a na-enyefekwa Nwa nke Mmadụ n’aka ndị mmehie.[c]”
  to: Mgbe ahụ, ọ bịakwutere ndị na-eso ụzọ ya, sị ha, “Rahụnụ ụra ugbu a, zuonụ ike.[a] Lee, oge ahụ abịaruola nso,[b] a na-enyefe Nwa nke Mmadụ n’aka ndị mmehie.[c]”
  rationale: The revision removes the semantically added -kwa, improves the imperative idiom, and clarifies both footnotes while retaining the source text’s grammatical and contextual ambiguity. No theological interpretation has been imposed.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:21Z'
review_pass:
  verdict: revise
  source_fidelity: The principal rendering accurately communicates the sequence, approach to the disciples, the deliberately unresolved force of Καθεύδετε ... ἀναπαύεσθε, the nearness of the hour, the title “Nwa nke Mmadụ,” and the passive, broad sense of παραδίδοται. However, -kwa in “a na-enyefekwa” adds an unsupported sense of “also/too”; the Greek καί simply coordinates the clauses.
  naturalness: “Rahụnụ ụra ugbu a, zuonụ ike” is more idiomatic and direct Standard Igbo than the progressive-form imperative “Na-arahụnụ ụra ugbu a.” The revised notes also avoid several unnatural or imprecise explanatory expressions.
  terminology: “Nwa nke Mmadụ,” “ndị na-eso ụzọ,” “ndị mmehie,” and “inyefe” are suitable established terms. “Inyefe” rightly avoids narrowing παραδίδοται to Judas’s betrayal.
  issues:
  - severity: medium
    issue: Unsupported additive particle in “a na-enyefekwa.”
    rationale: The enclitic -kwa means “also/too” and is not represented by παραδίδοται or required by the coordinating καί. Removing it preserves the passive meaning without adding emphasis.
  - severity: low
    issue: Main-text sleep imperative is awkwardly expressed.
    rationale: “Na-arahụnụ ụra” is less natural as an imperative than “Rahụnụ ụra.” The revision retains the source’s ambiguity/ironic possibility without turning it into an explicit question.
  - severity: low
    issue: Footnote a’s explanatory wording is imprecise and unnatural.
    rationale: “Ajụjụ nkwutọ” and “ihe ọchị ilu” do not clearly convey a rhetorical question and possible irony in contemporary Standard Igbo. The revised wording states these points more naturally.
  - severity: low
    issue: Footnote c repeats the unsupported additive -kwa and gives a less clear alternative.
    rationale: The alternative should be “a na-arara ... nye,” while the explanation should foreground the broader senses “inyefe” and “inyefe n’aka.”
  revised_text: Mgbe ahụ, ọ bịakwutere ndị na-eso ụzọ ya, sị ha, “Rahụnụ ụra ugbu a, zuonụ ike.[a] Lee, oge ahụ abịaruola nso,[b] a na-enyefe Nwa nke Mmadụ n’aka ndị mmehie.[c]”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu ka na-arahụ ụra ma na-ezu ike?” A pụrụ ịghọta okwu Grik a dịka ajụjụ nkwuwa-okwu; ahịrị bụ isi na-edobe mgbagwoju anya ahụ na ụda ịkwa emo ọ pụrụ inwe.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “oge ahụ eruola,” ma ọ bụ, “oge ahụ dị nso.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “a na-arara Nwa nke Mmadụ nye.” Okwu Grik ahụ pụtara n’ụzọ sara mbara “inyefe” ma ọ bụ “inyefe n’aka.”
    reason: lexical_alternative
  revision_rationale: The revision removes the semantically added -kwa, improves the imperative idiom, and clarifies both footnotes while retaining the source text’s grammatical and contextual ambiguity. No theological interpretation has been imposed.
