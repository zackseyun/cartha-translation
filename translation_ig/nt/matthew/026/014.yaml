  text: Τότε πορευθεὶς εἷς τῶν δώδεκα, ὁ λεγόμενος Ἰούδας Ἰσκαριώτης, πρὸς τοὺς ἀρχιερεῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: ig
  text: Mgbe ahụ, otu n’ime mmadụ iri na abụọ ahụ[a], onye a na-akpọ Judas Iskarịọt, gakwuuru ndị isi nchụaja,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu n’ime Iri na Abụọ ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ akara oge na-ewebata ihe sochirinụ n’akụkọ; “Mgbe ahụ” bụ Igbo nkịtị ma na-echekwa usoro akụkọ ahụ.
- source_word: πορευθεὶς
  choice: gakwuuru
  rationale: Participụl a na-egosi ije Judas gara n’ebe ndịisi nchụaja nọ. “Gakwuuru” na-ejikọta mmegharị ahụ na πρὸς nke ọma n’Igbo, kama ịsụgharị ya n’ụzọ siri ike dịka “mgbe ọ gara.”
- source_word: εἷς τῶν δώδεκα
  choice: otu onye n’ime ndị ozi iri na abụọ
  rationale: Ọ na-echekwa echiche nke otu onye sitere n’ìgwè mmadụ iri na abụọ ahụ; itinye “ndị ozi” na-eme ka okwu ahụ doo onye Igbo anya n’enweghị ịgbanwe ndị a na-ekwu maka ha.
- source_word: ὁ λεγόμενος
  choice: onye a na-akpọ
  rationale: Ọ na-echekwa usoro nkọwa apposition nke Grik ma bụrụkwa okwu Igbo dị mfe ma kwụ ọtọ.
- source_word: Ἰούδας Ἰσκαριώτης
  choice: Judas Iskarịọt
  rationale: A sụgharịghị aha mmadụ na aha njirimara ya; e dere ha n’ụdị dabara n’usoro mkpụrụokwu Igbo.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: gakwuuru ndịisi nchụaja
  rationale: πρός na accusative na-egosi ịgakwuru ebe ma ọ bụ mmadụ. “Ndịisi nchụaja” na-ezo aka n’ọchịchị ndị nchụaja kachasị elu, ọ bụghị naanị otu nnukwu onye nchụaja.
theological_decisions:
- issue: Otu e si akọwa τῶν δώδεκα dịka aha ìgwè
  choice: ndị ozi iri na abụọ
  alternative: Iri na Abụọ ahụ
  rationale: Nhọrọ bụ isi na-eme ka ihe e zoro aka na ya doo ndị na-agụ Igbo anya. Ihe ọzọ na-echekwa ya dịka aha pụrụ iche nke ìgwè ahụ; ọdịiche a bụ nke okwu na ụdị edemede karịa nke ozizi.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ndị ozi iri na abụọ” mee ka aha ìgwè ahụ doo anya, ebe ihe e dere n’ala peeji na-echekwa nhọrọ nke ịghọta ya dịka aha pụrụ iche, “Iri na Abụọ ahụ.”
