- from: Mgbe ahụ, otu onye n’ime ndị ozi iri na abụọ[a], onye a na-akpọ Judas Iskarịọt, gakwuuru ndịisi nchụaja,
  to: Mgbe ahụ, otu n’ime mmadụ iri na abụọ ahụ[a], onye a na-akpọ Judas Iskarịọt, gakwuuru ndị isi nchụaja,
  rationale: The revision removes the added title “ndị ozi” so that the translation matches the source’s unexpanded expression, “one of the twelve.” It retains a footnote for the viable capitalization/group-designation alternative and standardizes the spacing in “ndị isi nchụaja.”
