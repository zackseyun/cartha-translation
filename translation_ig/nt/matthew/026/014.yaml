review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal transition, Judas’s movement toward the chief priests, and his identifying name. However, “ndị ozi” adds the designation “apostles,” which is not present in εἷς τῶν δώδεκα. The source uses the group designation “the twelve,” so the Igbo should retain that wording without adding a title.
  naturalness: “Mgbe ahụ ... gakwuuru ndị isi nchụaja” is natural, clear Standard Igbo. Writing “ndị isi nchụaja” as separate words is the standard and more readable form.
  terminology: “Ndị isi nchụaja” appropriately renders ἀρχιερεῖς as the senior priestly authorities. “Judas Iskarịọt” is an appropriate Igbo-form transliteration. The capitalization alternative for “Iri na Abụọ ahụ” suitably reflects its possible use as a group designation without making it the required interpretation.
  issues:
  - severity: medium
    issue: “ndị ozi” has been added to the rendering of εἷς τῶν δώδεκα.
    rationale: The Greek says only “one of the twelve.” Although the referents are Jesus’s apostles in context, adding “apostles” imports information not expressed in this verse and weakens formal source fidelity.
  - severity: low
    issue: “ndịisi nchụaja” should be spaced as “ndị isi nchụaja.”
    rationale: The spaced form is clearer and accords with normal Standard Igbo word division.
  revised_text: Mgbe ahụ, otu n’ime mmadụ iri na abụọ ahụ[a], onye a na-akpọ Judas Iskarịọt, gakwuuru ndị isi nchụaja,
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “otu n’ime Iri na Abụọ ahụ.”
    reason: lexical_alternative
  revision_rationale: The revision removes the added title “ndị ozi” so that the translation matches the source’s unexpanded expression, “one of the twelve.” It retains a footnote for the viable capitalization/group-designation alternative and standardizes the spacing in “ndị isi nchụaja.”
