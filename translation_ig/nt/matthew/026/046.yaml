  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ἤγγικεν ὁ παραδιδούς με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/046.yaml
  text: Get up, let us go. Look, my betrayer[a] is near.
translation:
  language: ig
  text: Bilienụ, ka anyị gawa. Lee, onye na-arara m nye[a] eruola nso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị karị, “onye na-enyefe m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Bilienụ
  rationale: Ọ bụ iwu e nyere ọtụtụ ndị; “Bilienụ” bụ okwu Igbo doro anya ma kwekọọ n'ọnọdụ ndị na-eso ụzọ nọ na-ehi ụra.
- source_word: ἄγωμεν
  choice: ka anyị gawa
  rationale: Ụdị subjunctive nke onye mbụ n'ọtụtụ bụ agbamume ka ha mee ihe ọnụ; “ka anyị gawa” na-egosipụta nke a n'Igbo nkịtị.
- source_word: ἰδού
  choice: Lee
  rationale: “Lee” na-adọta uche n'ihe dị ngwa nke na-eme ugbu a, n'enweghị olu ochie.
- source_word: ἤγγικεν
  choice: eruola nso
  rationale: Perfect ahụ na-egosi na ọ bịarutewo nso ma ọnọdụ ahụ ka dị ugbu a; “eruola nso” na-echekwa ma mbịaru ahụ ma nsonaazụ ya.
- source_word: ὁ παραδιδούς με
  choice: onye na-arara m nye
  rationale: N'ọnọdụ a, παραδίδωμι na-ezo aka n'ịrara Jizọs nye n'aka ndị ga-ejide ya. Nkebiokwu a bụ ihe e ji amata onye ahụ, ma ihe odide ala peeji na-echekwa echiche nkịtị nke inyefe mmadụ.
theological_decisions:
- issue: Otú e si sụgharị παραδιδούς n'akụkọ ahụhụ Jizọs
  choice: onye na-arara m nye
  alternative: onye na-enyefe m n'aka ndị ọzọ
  rationale: Ọrụ ahụ bụ inyefe Jizọs n'aka ndị iro ya, nke n'ọnọdụ a bụ ịrara ya nye. Isi ederede ji okwu Igbo e ji ekwu nke a n'ụzọ ebumpụta ụwa, ebe ihe odide ala peeji na-echekwa nkọwa kpọmkwem nke ngwaa Grik.
translation_notes:
  register: Asụsụ Igbo Izugbe, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ụdị iwu maka ọtụtụ mmadụ na ụdị agbamume nke gụnyere onye na-ekwu okwu mee ka ngwa ngwa dị n'okwu Jizọs pụta ìhè.
