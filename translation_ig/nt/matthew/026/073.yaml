source:
  edition: SBLGNT
  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: ig
  text: Mgbe obere oge gasịrị, ndị guzo n'ebe ahụ bịakwutere Pita sị ya, “N’ezie, gị onwe gị sokwa ná ndị ahụ, n’ihi na otú i si ekwu okwu[a] na-ekpughe onye ị bụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụda olu gị na-eme ka a mata gị.” Okwu Grik λαλιά nwere ike ịpụta okwu mmadụ, otú o si ekwu okwu, ma ọ bụ ụda olu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: Mgbe obere oge gasịrị
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ihe n’akụkọ iji gosi na obere oge gafere.
- source_word: δὲ
  choice: —
  rationale: N’ebe a, ọ bụ njikọ dị nro na-akwalite akụkọ n’ihu; nhazi ahịrịokwu Igbo na-egosipụta ya nke ọma n’enweghị okwu pụrụ iche.
- source_word: προσελθόντες
  choice: bịakwutere
  rationale: Ọ na-egosi na ha bịaruru Pita nso; ‘bịakwutere’ bụ okwu Igbo nkịtị ma doo anya.
- source_word: οἱ ἑστῶτες
  choice: ndị guzo n'ebe ahụ
  rationale: Nke a na-edobe echiche participle ahụ, bụ́ ndị nọ n’ebe ahụ guzo, n’enweghị ịkọwa ha karịa ihe isi mmalite kwuru.
- source_word: εἶπον τῷ Πέτρῳ
  choice: sị ya
  rationale: E kwuburu Pita ozugbo tupu ya; ‘sị ya’ bụ usoro mkparịta ụka Igbo dị ndụ ma doo anya na ọ bụ Pita ka a gwara.
- source_word: Ἀληθῶς
  choice: N’ezie
  rationale: Ọ na-egosipụta nkwenye siri ike nke ndị na-ebo Pita ebubo.
- source_word: καὶ σὺ
  choice: gị onwe gị sokwa
  rationale: ‘Gị onwe gị’ na-enye nkwusi ike, ‘sokwa’ na-egosikwa na a na-etinye Pita n’otu ndị ahụ.
- source_word: ἐξ αὐτῶν
  choice: ná ndị ahụ
  rationale: N’usoro ‘sokwa ná ndị ahụ,’ nke a na-egosipụta ịbụ otu n’ime ha n’Igbo eke.
- source_word: καὶ γὰρ
  choice: n’ihi na
  rationale: γάρ na-enye ihe mere ha ji kwuo ihe ahụ. N’Igbo, nkwusi ike nke καί apụtalarị nke ọma site n’usoro ahịrịokwu na nkwenye gbara ya gburugburu; itinye ‘ọbụna’ ga-ada ka ihe ọzọ a na-atụnyere ya.
- source_word: ἡ λαλιά σου
  choice: otú i si ekwu okwu
  rationale: λαλιά nwere ike ịpụta okwu, ụzọ e si ekwu okwu, ma ọ bụ olumba/ụda olu. Nhọrọ a na-edobe obosara okwu Grik ahụ ma na-ada nke ọma n’Igbo.
- source_word: δῆλόν σε ποιεῖ
  choice: na-ekpughe onye ị bụ
  rationale: Nke a na-enye echiche bụ isi nke ‘ime ka a mata gị nke ọma’ n’Igbo dị mfe; ọ naghị akọwapụta ihe a matara karịa ọnọdụ ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù, nke ndị nkịtị ga-aghọta. E ji ‘otú i si ekwu okwu’ chekwaa obosara λαλιά, ebe nkọwa ala peeji na-egosi nhọrọ ‘ụda olu.’
