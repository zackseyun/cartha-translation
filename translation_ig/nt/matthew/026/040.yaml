revisions:
- from: Ọ bịakwutere ndị na-eso ụzọ ya, hụ ha ka ha na-ehi ụra, wee sị Pita, “Ya bụ, unu enweghị ike ịmụrụ anya[a] soro m otu awa?”
  to: Ọ bịara n’ebe ndị na-eso ụzọ ya nọ, wee hụ ha ka ha na-ehi ụra. Ọ sịrị Pita, “Ọ bụ otu a ka unu enweghị ike iso m mụrụ anya otu awa[a]?”
  rationale: The revision replaces the explanatory-sounding «Ya bụ» with a rhetorical Igbo question that reflects the rebuking surprise of Οὕτως, makes the narrative sequence fully natural, and places «iso m» with «mụrụ anya» to preserve the intended accompaniment. It retains Pita as the named addressee and «unu» as the plural audience, without resolving the Greek tension.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:15Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the address to Pita together with the plural «unu», preserving the Greek number shift. It conveys the disciples' sleeping and Jesus' question accurately. However, «Ya bụ» normally means “that is,” rather than functioning naturally as the surprised/reproachful «Οὕτως» here; and «ịmụrụ anya soro m» places the accompaniment less clearly than the Greek sense of staying awake with Jesus.
  naturalness: «Ọ bịara n’ebe ndị na-eso ụzọ ya nọ ... wee hụ ha...» is more idiomatic and syntactically complete Standard Igbo narrative than the compressed sequence «Ọ bịakwutere ... hụ ha». «iso m mụrụ anya» naturally expresses “stay awake with me.”
  terminology: «ndị na-eso ụzọ», «Pita», «ihi ụra», and «ịmụrụ anya» are suitable Standard Igbo biblical terminology. The alternative “keep watch” should be supplied as a complete, usable replacement phrase in the footnote.
  issues:
  - severity: medium
    issue: «Ya bụ» is an unsuitable rendering of Οὕτως in this question.
    rationale: In Standard Igbo, «Ya bụ» ordinarily introduces an explanation (“that is”), whereas Οὕτως here introduces a surprised or reproachful question. «Ọ bụ otu a ka ...?» preserves this rhetorical force without adding an interpretation.
  - severity: low
    issue: The word order in «ịmụrụ anya soro m» is less natural and can blur the relation of «with me».
    rationale: «iso m mụrụ anya» directly communicates remaining awake together with Jesus.
  - severity: low
    issue: The footnote alternative is only an infinitive phrase and does not provide a full alternative for the verse wording.
    rationale: A complete alternative phrase lets readers see how «γρηγορῆσαι μετ’ ἐμοῦ μίαν ὥραν» may be rendered as keeping watch with Jesus for an hour.
  revised_text: Ọ bịara n’ebe ndị na-eso ụzọ ya nọ, wee hụ ha ka ha na-ehi ụra. Ọ sịrị Pita, “Ọ bụ otu a ka unu enweghị ike iso m mụrụ anya otu awa[a]?”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “iso m nọrọ na nche otu awa.”
    reason: lexical_alternative
  revision_rationale: The revision replaces the explanatory-sounding «Ya bụ» with a rhetorical Igbo question that reflects the rebuking surprise of Οὕτως, makes the narrative sequence fully natural, and places «iso m» with «mụrụ anya» to preserve the intended accompaniment. It retains Pita as the named addressee and «unu» as the plural audience, without resolving the Greek tension.
