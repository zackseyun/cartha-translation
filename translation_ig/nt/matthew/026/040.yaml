  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: ig
  text: Ọ bịara n’ebe ndị na-eso ụzọ ya nọ, wee hụ ha ka ha na-ehi ụra. Ọ sịrị Pita, “Ọ bụ otu a ka unu enweghị ike iso m mụrụ anya otu awa[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “iso m nọrọ na nche otu awa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: Ọ bịakwutere
  rationale: A họọrọ ụdị ngwaa akụkọ Igbo nke na-aga nke ọma n’ọnụgụ, kama ịmanye historical present Grik n’ụzọ ga-ada ka ihe na-eme ugboro ugboro n’Igbo.
- source_word: πρὸς τοὺς μαθητὰς
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ndị μαθηταί Jizọs; ‘ya’ na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: hụ ha ka ha na-ehi ụra
  rationale: Ọ na-echekwa ọdịdị ngwaa nke participle ahụ ma na-ada n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: λέγει τῷ Πέτρῳ
  choice: wee sị Pita
  rationale: ‘Wee sị’ na-ejikọta usoro ihe ndị mere n’akụkọ n’Igbo nke ọma, ebe ‘Pita’ bụ ụdị aha a na-ejikarị na Standard Igbo.
- source_word: Οὕτως
  choice: Ya bụ
  rationale: N’ebe a, okwu ahụ na-ebute ajụjụ nke ịtụnanya na mba dị nro; ‘Ya bụ’ na-egosipụta ụda ahụ n’Igbo ugbu a.
- source_word: οὐκ ἰσχύσατε
  choice: unu enweghị ike
  rationale: Nke a na-egosi enweghị ike ma na-echekwa onye nke abụọ n’ọnụọgụ (unu), ọ bụ ezie na a gwara Pita okwu.
- source_word: μίαν ὥραν
  choice: otu awa
  rationale: Accusative ahụ na-egosi ogologo oge; ‘otu awa’ zuru oke ma bụrụ okwu Igbo ebumpụta ụwa n’ọnọdụ a.
- source_word: γρηγορῆσαι
  choice: ịmụrụ anya
  rationale: N’ihi na amaokwu ahụ kpọtụrụ ihi ụra kpọmkwem, ‘ịmụrụ anya’ na-egosi isi echiche nke ịnọghị n’ụra, ma a hapụrụ echiche nke ịnọ na nche n’ala ala peeji.
- source_word: μετ’ ἐμοῦ
  choice: soro m
  rationale: Nke a bụ ụzọ Igbo dị mkpirikpi ma dị ebumpụta ụwa isi gosi iso mmadụ nọrọ ma ọ bụ mee ihe.
theological_decisions:
- issue: A gwara Pita okwu, ma ngwaa ἰσχύσατε bụ nke ọtụtụ mmadụ
  choice: E debere ‘Pita’ dị ka onye a gwara okwu na ‘unu’ dị ka ndị a baara mba.
  alternative: Iji ‘ị’ mee ka ajụjụ ahụ bụrụ naanị nke Pita, ma ọ bụ ịgbakwụnye na Pita nọchitere anya ndị ọzọ.
  rationale: Grik kpọrọ Pita aha kpọmkwem ma jiri ngwaa nke ọtụtụ mmadụ. Nsụgharị ahụ na-ahapụ mgbanwe ọnụọgụ a ka ọ dị, kama ịkọwa ya karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Usoro ‘wee sị’ na-eme ka akụkọ ahụ na-aga nke ọma; ‘unu’ na-echekwa ọdịiche dị n’etiti Pita onye a kpọrọ aha na ìgwè ndị a gwara okwu.
