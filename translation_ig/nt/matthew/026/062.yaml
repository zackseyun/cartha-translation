- from: Onyeisi nchụaja ahụ biliri ọtọ sị ya, “Ị naghị aza ihe ọ bụla? Gịnị ka ndị a na-agba akaebe megide gị?”
  to: Onyeisi nchụàjà ahụ biliri sị ya, “Ị naghị aza ihe ọ bụla? Gịnị ka ndị a na-agba akaebe megide gị?”
  rationale: Removed ọtọ to render the high priest’s physical rising without adding the unrelated sense of nakedness. The remaining wording is retained because it faithfully and naturally conveys the Greek questions and their courtroom setting.
