id: MAT.26.62
reference: Matthew 26:62
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: ig
  text: Onyeisi nchụàjà ahụ biliri sị ya, “Ị naghị aza ihe ọ bụla? Gịnị ka ndị a na-agba akaebe megide gị?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: biliri ọtọ
  rationale: Nke a na-egosi na onyeisi nchụaja ahụ si n’ọnọdụ ọ nọ bilie tupu o kwuo okwu; okwu a bụkwa nke Igbo nkịtị ma doo anya.
- source_word: ὁ ἀρχιερεὺς
  choice: Onyeisi nchụaja ahụ
  rationale: Nke a bụ aha ọrụ onyeisi ndị nchụaja n’ọnọdụ a; ‘ahụ’ na-egosi onye a kpọtụrụla aha n’akụkọ ahụ.
- source_word: εἶπεν αὐτῷ
  choice: sị ya
  rationale: Nke a na-edobe nnọchiaha Grik ‘ya’ ma na-eji usoro okwu Igbo dị nkenke ma bụrụ ihe e ji eme ihe kwa ụbọchị.
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: Ị naghị aza ihe ọ bụla?
  rationale: Nke a na-egosipụta ajụjụ nke na-achọ ka ọ zaghachi, ma na-edobe ‘ihe ọ bụla’ nke οὐδέν n’Igbo dị ndụ.
- source_word: τί
  choice: Gịnị
  rationale: Ajụjụ a na-ajụ ihe ndị akaebe ahụ na-ekwu megide ya, n’enweghị mgbakwunye nkọwa na-adịghị na Grik.
- source_word: οὗτοί
  choice: ndị a
  rationale: Nnọchiaha ngosi a na-ezo aka n’ụmụ nwoke nọ ebe ahụ na-agba akaebe; Igbo ‘ndị a’ na-egosipụta nke ahụ n’enweghị ịgbakwunye aha ọzọ.
- source_word: σου καταμαρτυροῦσιν
  choice: na-agba akaebe megide gị
  rationale: Okwu a na-edobe echiche ikpe nke ịgba akaebe megide onye e boro ebubo, tinyere omume na-aga n’ihu nke ngwaa ahụ.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ajụjụ abụọ ahụ na-edobe ike na ọnọdụ ikpe dị n’amaokwu Grik ahụ, n’enweghị idozi ma ọ bụ ịgbakwunye echiche nkà mmụta okpukpe.
