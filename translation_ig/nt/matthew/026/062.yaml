review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the high priest''s action, the address to Jesus by pronoun, the two interrogatives, and the forensic sense of καταμαρτυροῦσιν (“testify/bear witness against”). However, “biliri ọtọ” is not an appropriate rendering of ἀναστάς here: ọtọ commonly denotes nakedness and introduces an unintended meaning. The Greek simply states that he rose/stood up.'
  naturalness: Apart from “ọtọ,” the wording is clear and suitably formal in Standard Igbo. “Gịnị ka ndị a na-agba akaebe megide gị?” is a natural direct rendering of the second question.
  terminology: “Onyeisi nchụàjà ahụ” appropriately renders “the high priest.” “na-agba akaebe megide gị” retains the legal/testimonial force without reducing it to a mere accusation.
  issues:
  - severity: high
    issue: “biliri ọtọ” adds an unintended meaning.
    rationale: Ọtọ ordinarily means “naked” in Standard Igbo. It does not belong in this context and is not represented by ἀναστάς, which means “having risen/stood up.”
  revised_text: Onyeisi nchụàjà ahụ biliri sị ya, “Ị naghị aza ihe ọ bụla? Gịnị ka ndị a na-agba akaebe megide gị?”
