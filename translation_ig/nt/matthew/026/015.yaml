source:
  edition: SBLGNT
  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: ig
  text: Ọ sịrị, “Gịnị ka unu dị njikere inye m? Mụ onwe m ga-enyefekwa ya n’aka unu[a].” Ha wee tụọ ya mkpụrụ ego ọlaọcha iri atọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “rara ya nye unu.” Okwu Grik a nwere ike ịpụta “inyefe,” “inyefe n’aka ndị ọzọ,” ma ọ bụ, n’ọnọdụ a, “ịrara mmadụ nye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: Gịnị ka unu dị njikere inye m
  rationale: Okwu θέλω nwere echiche nke ọchịchọ ma ọ bụ ịdị njikere. N’ọnọdụ nkwekọrịta a, “dị njikere inye m” na-egosipụta echiche ahụ n’Igbo doro anya.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: ka mụ onwe m wee nyefee ya n’aka unu
  rationale: “Nyefee ya n’aka unu” na-echekwa obosara ihe παραδίδωμι pụtara—inyefe ma ọ bụ itinye mmadụ n’aka ndị ọzọ—n’enweghị itinye nkọwa omume ọjọọ ahụ kpọmkwem n’isi okwu.
- source_word: οἱ δὲ
  choice: Ha wee
  rationale: δέ bụ njikọ akụkọ dị nro; “wee” na-eme ka akụkọ ahụ na-aga n’ihu n’Igbo eke, n’emeghị ka ọdịiche pụta karịa ka Grik si kwuo ya.
- source_word: ἔστησαν αὐτῷ
  choice: tụọrọ ya
  rationale: N’ọnọdụ ego a, okwu ahụ na-egosi ịhazi ma ọ bụ ịtụpụta ego a ga-enye ya. “Tụọrọ ya” na-echekwa agba azụmahịa nke okwu ahụ ma ghara ime ka ọ bụrụ naanị okwu sara mbara dịka “nyere ya.”
- source_word: τριάκοντα ἀργύρια
  choice: mkpụrụ ego ọlaọcha iri atọ
  rationale: ἀργύρια bụ ego ma ọ bụ iberibe ọlaọcha. “Mkpụrụ ego ọlaọcha” bụ Igbo doro anya nke na-egosi ego a na-ekwu maka ya n’ebughị aha ụdị ma ọ bụ ọnụego mkpụrụ ego nke Grik na-ekwughị.
theological_decisions:
- issue: Otú e si sụgharị παραδώσω n’ihe Judas kwuru
  choice: nyefee ya n’aka unu
  alternative: rara ya nye unu
  rationale: Nhọrọ a na-echekwa obosara okwu Grik, nke nwere ike ịpụta inyefe ma ọ bụ ịnapụta mmadụ n’aka ndị ọzọ. N’ọnọdụ a, omume ahụ bụ ịrara Jizọs nye, ma isi okwu Grik n’onwe ya sara mbara; ya mere e debere nkọwa ahụ n’ala peeji kama itinye ya n’ahịrị bụ isi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro mkparịta ụka na azụmahịa dị na Grik, ma na-ahapụ obosara ihe παραδίδωμι pụtara ka ọ ghara ịkpa ókè n’otu nkọwa okpukpe.
