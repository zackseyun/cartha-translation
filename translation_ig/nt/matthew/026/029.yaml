revisions:
- from: Ma ana m agwa unu, malite ugbu a, agaghị m aṅụkwa mkpụrụ vaịn a ma ọlị ruo ụbọchị ahụ mgbe mụ na unu ga-aṅụ ya dịka ihe ọhụrụ[a] n’alaeze Nna m.
  to: Ma ana m agwa unu, malite ugbu a, agaghị m aṅụ site na mkpụrụ osisi vaịn a ọzọ ma ọlị ruo ụbọchị ahụ mgbe mụ na unu ga-aṅụ ya ọhụụ[a] n’alaeze Nna m.
  rationale: Removed the additive “kwa” while retaining emphatic negation with “ọzọ ma ọlị,” and replaced the comparative “dịka ihe ọhụrụ” with predicative “ọhụụ,” which better reflects καινόν without deciding between ‘new,’ ‘anew,’ and ‘in a new way.’ Expanded the vine-fruit phrase slightly to make the source idiom clearer in Igbo without introducing ‘wine.’
