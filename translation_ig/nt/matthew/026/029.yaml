id: MAT.26.29
reference: Matthew 26:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: ig
  text: Ma ana m agwa unu, malite ugbu a, agaghị m aṅụ site na mkpụrụ osisi vaịn a ọzọ ma ọlị ruo ụbọchị ahụ mgbe mụ na unu ga-aṅụ ya ọhụụ[a] n’alaeze Nna m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọzọ” ma ọ bụ “n’ụzọ ọhụrụ.” Okwu Grik ahụ pụrụ ịpụta ihe ọhụrụ n’ụdị ma ọ bụ n’ịdị mma; nkebiokwu a nwekwara ike igosi ịṅụ ya ọzọ, n’ụzọ ọhụrụ, n’alaeze ahụ ga-abịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Ma ana m agwa unu
  rationale: “Ma” na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche dị n’okwu, ebe “ana m agwa unu” bụ Igbo doro anya ma dị ugbu a.
- source_word: οὐ μὴ πίω ἀπ’ ἄρτι
  choice: malite ugbu a, agaghị m aṅụkwa ... ma ọlị
  rationale: “Malite ugbu a” na-egosi oge mmalite ahụ; “agaghị m ... ma ọlị” na-echekwa nkwusi ike nke οὐ μή n’ụzọ Igbo nkịtị.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: mkpụrụ vaịn a
  rationale: Nke a na-echekwa okwu gbasara ihe osisi vaịn na-amị kama ịtụgharị ya ozugbo ka ọ bụrụ “mmanya,” ma na-ada nke ọma n’Igbo.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: ruo ụbọchị ahụ
  rationale: Ọ na-echekwa nrụtụ aka ahụ n’otu ụbọchị dị mkpa n’ọdịnihu.
- source_word: ὅταν αὐτὸ πίνω μεθ’ ὑμῶν
  choice: mgbe mụ na unu ga-aṅụ ya
  rationale: Nke a na-egosi ihe ga-eme n’ọdịnihu ma na-echekwa echiche nke iso ndị na-eso ụzọ ya ṅụọ.
- source_word: καινὸν
  choice: dịka ihe ọhụrụ
  rationale: Ụdị a na-ejikọta adjective ahụ na ihe a na-aṅụ, na-enweghị ikpebi ma ọ pụtara ihe ọhụrụ n’ụdị, n’ịdị mma, ma ọ bụ ịṅụ ya ọzọ n’ụzọ ọhụrụ.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: n’alaeze Nna m
  rationale: Nke a bụ okwu Igbo dị nkenke, dị ùgwù, ma na-echekwa mmekọrịta pụrụ iche dị n’okwu “Nna m.”
theological_decisions:
- issue: Ma a ga-akpọ ihe dị n’iko ahụ “mmanya” kpọmkwem
  choice: E ji “mkpụrụ vaịn” mee ihe n’ederede bụ isi.
  alternative: mmanya
  rationale: Asụsụ Grik kwuru ihe osisi vaịn na-amị, ọ bụghị okwu οἶνος kpọmkwem. Nke a na-echekwa ihe ederede kwuru ma ghara itinye nkọwa sacrament karịrị ya.
- issue: Ihe καινὸν pụtara n’oriri nke alaeze ga-abịa
  choice: dịka ihe ọhụrụ
  alternative: ọzọ; n’ụzọ ọhụrụ
  rationale: Okwu ahụ nwere ike izo aka n’ịdị ọhụrụ n’ụdị ma ọ bụ n’ịdị mma, ma ọ bụ n’ịṅụ ya ọzọ n’ọnọdụ ọhụrụ. Ederede bụ isi anaghị ekpebi nke ọ bụ; ihe odide ala peeji na-echekwa ụzọ ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E zere ịkpọ ihe ahụ “mmanya” kpọmkwem iji chekwaa atụmatụ okwu Grik na nghọtahie ya nwere ike ịnwe.
