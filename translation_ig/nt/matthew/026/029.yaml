review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the emphatic future negation, the temporal starting point, the definite future day, shared drinking, and the Father’s kingdom. However, “aṅụkwa” adds an unwarranted additive sense (“also”), and “dịka ihe ọhụrụ” changes καινόν into a comparison (“as a new thing”) rather than qualifying the drink/event as in the Greek.
  naturalness: The proposed revision is idiomatic Standard Igbo and maintains a solemn but current register. “ga-aṅụ ya ọhụụ” is more natural and closer in function to the Greek predicative adjective than “ga-aṅụ ya dịka ihe ọhụrụ.”
  terminology: “Mkpụrụ osisi vaịn” retains the source expression ‘fruit/product of the vine’ without prematurely replacing it with “mmanya” (wine). “Ọhụụ” retains the open sense of καινόν; the footnote appropriately records ‘ọzọ’ and ‘n’ụzọ ọhụrụ’ as possible contextual renderings.
  issues:
  - severity: medium
    issue: Unwarranted additive particle in “agaghị m aṅụkwa ... ma ọlị.”
    rationale: The Greek οὐ μὴ πίω is emphatic negation but contains no equivalent of “kwa” (‘also’). “Agaghị m aṅụ ... ma ọlị” fully expresses the force without adding meaning.
  - severity: medium
    issue: “dịka ihe ọhụrụ” misrepresents the syntactic role of καινόν.
    rationale: The phrase means ‘as a new thing,’ whereas Greek καινόν qualifies αὐτό (‘it’) in the future drinking. “Ga-aṅụ ya ọhụụ” is closer and leaves the intended nuance open.
  - severity: low
    issue: “Mkpụrụ vaịn” may be heard primarily as grapes rather than the idiomatic ‘fruit/product of the vine.’
    rationale: “Mkpụrụ osisi vaịn” more explicitly preserves the vine-fruit expression while still not specifying ‘wine’ in the main text.
  revised_text: Ma ana m agwa unu, malite ugbu a, agaghị m aṅụ site na mkpụrụ osisi vaịn a ọzọ ma ọlị ruo ụbọchị ahụ mgbe mụ na unu ga-aṅụ ya ọhụụ[a] n’alaeze Nna m.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ọzọ” ma ọ bụ “n’ụzọ ọhụrụ.” Okwu Grik ahụ pụrụ ịpụta ihe ọhụrụ n’ụdị ma ọ bụ n’ịdị mma; nkebiokwu a nwekwara ike igosi ịṅụ ya ọzọ, n’ụzọ ọhụrụ, n’alaeze ahụ ga-abịa.
    reason: lexical_alternative
  revision_rationale: Removed the additive “kwa” while retaining emphatic negation with “ọzọ ma ọlị,” and replaced the comparative “dịka ihe ọhụrụ” with predicative “ọhụụ,” which better reflects καινόν without deciding between ‘new,’ ‘anew,’ and ‘in a new way.’ Expanded the vine-fruit phrase slightly to make the source idiom clearer in Igbo without introducing ‘wine.’
