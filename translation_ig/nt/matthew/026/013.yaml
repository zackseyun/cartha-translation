  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: ig
  text: N’ezie, ana m asị unu, n’ebe ọ bụla a ga-ekwusa ozi ọma a[a] n’ụwa dum, a ga-ekwukwa banyere ihe nwanyị a mere dị ka ihe ncheta ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oziọma a.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a ga-akọkwa ihe nwanyị a mere,” ma ọ bụ, “a ga-ekwukwa banyere ihe nwanyị a mere ka ọ bụrụ ihe ncheta ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: N’ezie
  rationale: Nke a na-egosipụta nkwenye siri ike Jizọs ji ebido okwu ya; ọ bụkwa Igbo doro anya ma dị ùgwù.
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Ọ na-echekwa okwu onye mbụ na adres onye karịrị otu ọnụ n’ụzọ dị mfe ma kwekọọ n’Igbo.
- source_word: ὅπου ἐὰν
  choice: n’ebe ọ bụla
  rationale: Ọ na-egosipụta ebe ọ bụla na-enweghị ịkọ otu ebe kpọmkwem.
- source_word: κηρυχθῇ
  choice: a ga-ekwusa
  rationale: “Ikwusa” na-echekwa echiche nke ịkpọsa ozi n’ihu ọha, ma na-adaba n’ụdị mmeju passive nke Grik.
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: ozi ọma a
  rationale: “Ozi ọma” na-enye isi echiche εὐαγγέλιον n’Igbo nkịtị ma doo anya; “oziọma a” ka bụkwa ụzọ ọdịnala e nwere ike isi dee ya.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: n’ụwa dum
  rationale: Ọ bụ ntụgharị Igbo dị nkenke na nke ebumpụta ụwa maka oke zuru ụwa ọnụ nke ahịrịokwu ahụ.
- source_word: λαληθήσεται
  choice: a ga-ekwukwa banyere
  rationale: Ọ na-egosipụta ọdịnihu na passive, ma “banyere” na-eme ka o doo anya na ihe a na-ekwu bụ omume nwanyị ahụ.
- source_word: ὃ ἐποίησεν αὕτη
  choice: ihe nwanyị a mere
  rationale: “Ihe” na-anọchi omume ahụ, ebe “nwanyị a” na-eme ka ntụaka αὕτη pụta ìhè site n’ihe gbara amaokwu ahụ gburugburu.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: iji cheta ya
  rationale: Ọ na-echekwa ebumnuche ncheta n’asụsụ Igbo dị ndụ, n’enweghị ịgbakwunye nkọwa okpukpe na-adịghị na Grik.
theological_decisions:
- issue: Ntughari εὐαγγέλιον
  choice: ozi ọma
  alternative: oziọma
  rationale: “Ozi ọma” na-ebute nghọta bụ isi nke okwu Grik ahụ n’Igbo doro anya; ihe odide ala peeji na-edobe ụdị ọdịnala “oziọma” n’emeghị ka otu nghọta bụrụ iwu.
- issue: Mmekọrịta εἰς μνημόσυνον αὐτῆς na omume ahụ
  choice: iji cheta ya
  alternative: dị ka ihe ncheta ya
  rationale: Nhọrọ bụ isi na-egosipụta na ịkọ ihe o mere ga-eme ka a na-echeta nwanyị ahụ; nhọrọ ọzọ na-edobe ọdịdị aha “ihe ncheta” nke μνημόσυνον.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “N’ụwa dum” na “n’ebe ọ bụla” bụ usoro okwu ebumpụta ụwa; e zere okwu ụka pụrụ iche ma chekwaa ụzọ ọzọ e nwere ike isi ghọta okwu Grik n’ihe odide ala peeji.
