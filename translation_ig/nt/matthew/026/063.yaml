id: MAT.26.63
reference: Matthew 26:63
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: ig
  text: 'Ma Jizọs nọgidere gbachi nkịtị.[a] Onyeisi nchụaja wee sị ya, “Ana m eji Chineke dị ndụ etinye gị n’okpuru iyi: gwa anyị ma ọ bụrụ na ị bụ Mesaịa[b], Ọkpara Chineke.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gbachiri nkịtị” ma ọ bụ “nọrọ jụụ.” Ngwaa Grik ahụ na-egosi na ọ nọgidere na-agbachi nkịtị.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Kraịst.” Okwu Grik bụ Christos; n’ebe a ọ bụ utu aha, ya bụ, Onye E Tere Mmanụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπα
  choice: nọgidere gbachi nkịtị
  rationale: Oge imperfect na-egosi na Jizọs gara n’ihu ịgbachi nkịtị; okwu a na-egosipụta omume ahụ na-aga n’ihu n’Igbo dị mfe.
- source_word: ἀρχιερεὺς
  choice: onyeisi nchụaja
  rationale: Nke a bụ aha doro anya ma bụrụ nke a na-ejikarị akọwa onye nọ n’ọkwa nchụaja kachasị elu n’ọnọdụ ikpe a.
- source_word: Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: Ana m ewere Chineke dị ndụ mee ka ị ṅụọ iyi
  rationale: N’ebe a, ngwaa ahụ abụghị maka ịchụ mmụọ; ọ bụ usoro siri ike nke itinye mmadụ n’okpuru iyi site n’ịkpọku Chineke dị ndụ.
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: gwa anyị
  rationale: Nke a na-enye ihe onyeisi nchụaja chọrọ ka Jizọs kwuo n'ụzọ Igbo dị nkenke ma kwekọọ n’isi mmalite.
- source_word: ὁ χριστὸς
  choice: Kraịst
  rationale: Kraịst bụ aha-ọrụ a maara nke ọma n’Igbo maka Onye E Tere Mmanụ; n’ebe a ọ na-arụ ọrụ dị ka utu aha, ọ bụghị naanị aha mmadụ.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: Nke a na-echekwa utu aha Kraịst ahụ ozugbo, n’enweghị ime ka ihe ọ pụtara dị ntakịrị ma ọ bụ ịgbakwunye nkọwa na-adịghị na ederede.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Ma Jizọs
  rationale: “Ma” na-egosipụta obere ntụgharị ma ọ bụ ọdịiche dị n’etiti ebubo ndị gara aga na ịgbachi nkịtị Jizọs.
theological_decisions:
- issue: Otú e si asụgharị Χριστός n’ajụjụ gbasara onye Jizọs bụ
  choice: Kraịst
  alternative: Mesaịa / Onye E Tere Mmanụ
  rationale: Ederede Grik ji ya dị ka utu aha. “Kraịst” bụ ụdị a maara nke ọma n’Igbo, ebe ihe odide ala peeji na-akọwa ihe utu aha ahụ pụtara ka a ghara ime ya ka ọ bụrụ naanị aha mmadụ.
- issue: Ike dị n’okwu Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: usoro siri ike nke ime ka mmadụ ṅụọ iyi n’aha Chineke dị ndụ
  alternative: iwu nkịtị ka ọ zaa
  rationale: Ịkpọku Chineke dị ndụ na ọnọdụ ikpe a na-egosi iyi dị nsọ, ọ bụghị naanị iwu nkịtị.
- issue: Mmekọrịta dị n’etiti “Kraịst” na “Ọkpara Chineke”
  choice: edobere utu aha abụọ ahụ n’usoro dịka isi mmalite si dị
  alternative: ịkọwa ha dịka otu utu aha jikọrọ ọnụ
  rationale: Akara nkebiokwu Grik nwere ike ime ka a tụlee mmekọrịta utu aha abụọ ahụ, ya mere nsụgharị ahụ anaghị agbakwunye nkọwa ga-ekpebi ihe ederede na-ekwughị hoo haa.
translation_notes:
  register: Ejiri Igbo Izugbe nke dị ugwu ma dị mfe nghọta. “Nọgidere gbachi nkịtị” na-egosipụta omume na-aga n’ihu; “onyeisi nchụaja” na-akọwa ọkwa ahụ nke ọma; usoro iyi ahụ ka e dere n’asụsụ nkịtị n’enweghị iji okwu metụtara ịchụ mmụọ. E debere akara ihe odide ala peeji [a] na [b] n’isi ederede.
