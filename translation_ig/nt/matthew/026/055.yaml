- from: N’oge ahụ, Jizọs gwara ìgwè mmadụ ahụ, sị, “Ùnu ejirila mma agha na osisi pụta ijide m, dị ka a ga-asị na m bụ onye ohi na-apụnara mmadụ ihe[a]? Kwa ụbọchị, anọ m ọdụ n’ụlọnsọ ukwu na-ezi ihe, ma unu ejideghị m.”
  to: N’oge ahụ, Jizọs gwara ìgwè mmadụ ahụ, sị, “Ùnu ejirila mma agha na mkpisi osisi pụta ijide m, dị ka a ga-asị na m bụ onye ohi na-apụnara mmadụ ihe[a]? Kwa ụbọchị, m na-anọdụ ala n’ụlọnsọ ukwu na-ezi ihe, ma unu ejideghị m.”
  rationale: The revision corrects the past habitual force of the Greek imperfect without adding interpretation, and clarifies that the ξύλα are wooden staves or clubs. The lexical footnote remains appropriately anchored to λῃστής and preserves its contextual range.
