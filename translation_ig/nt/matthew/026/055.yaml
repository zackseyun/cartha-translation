id: MAT.26.55
reference: Matthew 26:55
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: ig
  text: N’oge ahụ, Jizọs gwara ìgwè mmadụ ahụ, sị, “Ùnu ejirila mma agha na mkpisi osisi pụta ijide m, dị ka a ga-asị na m bụ onye ohi na-apụnara mmadụ ihe[a]? Kwa ụbọchị, m na-anọdụ ala n’ụlọnsọ ukwu na-ezi ihe, ma unu ejideghị m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye na-apụnara mmadụ ihe” ma ọ bụ “onye nnupụisi ji ọgụ eme ihe.” Okwu Grik bụ λῃστής nwere ike ịpụta onye omekome na-eji ike apụnara mmadụ ihe, ma n’ọnọdụ ụfọdụ ọ pụkwara izo aka n’onye nnupụisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: N’oge ahụ
  rationale: Nke a bụ ụzọ Igbo si ekwu ya nke ọma, ma ọ ka na-egosi oge ahụ kpọmkwem n’akụkọ ahụ.
- source_word: τοῖς ὄχλοις
  choice: ìgwè mmadụ ahụ
  rationale: Ọ bụ ezie na Grik ji ọtụtụ, n’Igbo, ‘ìgwè mmadụ’ bụ mkpokọta aha sitere n’okike nke na-egosi ọtụtụ ndị nọ ebe ahụ.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: dị ka a ga-asị na m bụ onye ohi na-apụnara mmadụ ihe[a]
  rationale: Nkebiokwu a na-eme ka ajụjụ Jizọs doo anya n’Igbo, ma ‘onye ohi na-apụnara mmadụ ihe’ na-egosi onye omekome na-eji ike eme ihe karịa onye na-ezu ohi na nzuzo.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: jiri mma agha na osisi
  rationale: ‘Mma agha’ na-egosi μάχαιραι; ‘osisi’ bụ okwu nkịtị maka ξύλα ndị e ji dị ka ngwa ọgụ, n’enweghị ịgbakwunye nkọwa na-adịghị na isi mmalite.
- source_word: συλλαβεῖν με
  choice: ijide m
  rationale: N’ọnọdụ a, ‘ijide’ na-ekwupụta ijide onye dị ka onye e boro ebubo, ma ọ bụ okwu Igbo dị mfe ma doo anya.
- source_word: καθ’ ἡμέραν
  choice: Kwa ụbọchị
  rationale: Nke a na-echekwa nghọta nkesa nke okwu Grik ahụ ma bụrụkwa okwu Igbo sitere n’okike.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ụlọnsọ ukwu
  rationale: ἱερόν na-ezo aka n’ụlọ nsọ na mpaghara ya n’ozuzu; ‘ụlọnsọ ukwu’ bụ aha Igbo a na-aghọta nke ọma maka ụlọ nsọ ahụ.
- source_word: ἐκαθεζόμην διδάσκων
  choice: anọ m ọdụ ... na-ezi ihe
  rationale: Nke a na-egosi omume na-aga n’ihu ma na-emekarị, dị ka imperfect na participle Grik si kwuo.
- source_word: οὐκ ἐκρατήσατέ με
  choice: unu ejideghị m
  rationale: ‘Ejideghị m’ na-egosi na ha emeghị ihe ahụ n’oge ọ na-akụzi n’ihu ọha; ikwughachi ‘ijide’ bụ ihe sitere n’okike n’Igbo ma zere ọdịiche e kere eke nke isi mmalite anaghị achọ ka e mee ka ọ sie ike.
theological_decisions:
- issue: Oke nghọta nke λῃστής n’ajụjụ Jizọs
  choice: onye ohi na-apụnara mmadụ ihe
  alternative: onye na-apụnara mmadụ ihe; onye nnupụisi ji ọgụ eme ihe
  rationale: λῃστής nwere ike ịpụta onye na-apụnara mmadụ ihe n’ike ma ọ bụ, n’ọnọdụ ụfọdụ, onye nnupụisi na-eji ọgụ eme ihe. Isi ihe n’amaokwu a bụ na ha mesoro Jizọs dị ka onye omekome dị ize ndụ; ederede bụ isi anaghị amanye nghọta ndọrọ ndọrọ ọchịchị kpọmkwem, ya mere e debere ohere ahụ n’okpuru ala.
translation_notes:
  register: Standard Igbo; okwu dị ugwu ma dị mfe nghọta nye ndị na-agụ Igbo taa. E ji ajụjụ akara ụda olu ‘Ùnu’ mee ka ajụjụ ahụ doo anya, ma zere okwu chọọchị pụrụ iche nke otu ụka.
