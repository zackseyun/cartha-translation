review_pass:
  verdict: revise
  source_fidelity: The draft conveys the sequence, Jesus’ intense inward sorrow, the extremity expressed by ἕως θανάτου, and the two plural commands. However, “mụ na unu wee na-eche nche” is not an idiomatic rendering of γρηγορεῖτε μετ’ ἐμοῦ and can be read as a coordinated statement (‘I and you...’) rather than an imperative to keep watch with Jesus.
  naturalness: “Mkpụrụ obi m” and “Nọrọnụ n'ebe a” are natural Standard Igbo in this solemn context. Recasting the final command as “sorokwa m na-eche nche” makes the imperative and accompaniment clear and idiomatic. “ruo n'ókè ọnwụ” clarifies that the phrase denotes extremity rather than duration until death.
  terminology: “Mkpụrụ obi” appropriately retains ψυχή without imposing a technical doctrinal sense. “Na-eche nche” is a suitable broad rendering of γρηγορεῖτε; the footnote preserves the literal wakefulness aspect. No doctrinal alteration is introduced.
  issues:
  - severity: medium
    issue: The wording “mụ na unu wee na-eche nche” is grammatically and idiomatically unsuitable for the final imperative.
    rationale: μετ’ ἐμοῦ means ‘with me,’ modifying the disciples’ command to keep watch. In Igbo, “mụ na unu” naturally functions as ‘I and you,’ obscuring the imperative relationship. “Sorokwa m na-eche nche” directly expresses ‘keep watch with me.’
  - severity: low
    issue: “ruo ọnwụ” can be understood temporally as ‘until death.’
    rationale: Although it can communicate the source phrase, “ruo n'ókè ọnwụ” more clearly expresses ἕως θανάτου as sorrow reaching the point of death, while retaining the source’s intensity.
  revised_text: Mgbe ahụ, ọ sịrị ha, “Mkpụrụ obi m jupụtara n'oké mwute ruo n'ókè ọnwụ. Nọrọnụ n'ebe a, sorokwa m na-eche nche.”
