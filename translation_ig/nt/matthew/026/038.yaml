  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: ig
  text: Mgbe ahụ, ọ sịrị ha, “Mkpụrụ obi m jupụtara n'oké mwute ruo n'ókè ọnwụ. Nọrọnụ n'ebe a, sorokwa m na-eche nche.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ njikọ oge na-egosi ihe sochiri n'akụkọ ahụ; ‘Mgbe ahụ’ bụ Igbo doro anya ma na-aga were were.
- source_word: λέγει αὐτοῖς
  choice: ọ sịrị ha
  rationale: Ọ bụ ezie na Grik ji ngwaa ugbu a nke akụkọ, oge gara aga ka na-ada nke ọma n'Igbo ma na-echekwa usoro akụkọ ahụ.
- source_word: Περίλυπός ἐστιν ἡ ψυχή μου
  choice: Mkpụrụ obi m jupụtara n'oké mwute
  rationale: Nke a na-echekwa aha ψυχή (‘mkpụrụ obi’) ma na-egosipụta oke mwute nke περίλυπος n'Igbo dị ndụ ma dị nsọpụrụ.
- source_word: ἕως θανάτου
  choice: ruo ọnwụ
  rationale: Ọ na-echekwa nkenke na ike nke okwu Grik, tinyere nghọta na mwute ahụ ruru n'ókè ọnwụ.
- source_word: μείνατε ὧδε
  choice: Nọrọnụ n'ebe a
  rationale: Iwu a na-arịọ ndị na-eso ụzọ ka ha ghara ịpụ n'ebe ahụ; ụdị ọtụtụ ‘Nọrọnụ’ dabara ndị a na-agwa okwu.
- source_word: γρηγορεῖτε μετ’ ἐμοῦ
  choice: mụ na unu wee na-eche nche
  rationale: ‘Na-eche nche’ na-eburu echiche nke ịmụ anya na ịmụrụ anya nke ọma; nhazi Igbo a na-egosikwa na ha ga-eme ya na Jizọs.
theological_decisions:
- issue: Nsụgharị ψυχή n'okwu Jizọs
  choice: Mkpụrụ obi m
  alternative: Enwere m oké mwute
  rationale: Ide ‘mkpụrụ obi m’ na-echekwa aha doro anya dị na Grik na eziokwu nke oke ihe mgbu Jizọs n'ime ya, n'emeghị ka okwu ahụ bụrụ nkọwa ozizi pụrụ iche banyere ọdịdị mmadụ.
- issue: Ike okwu γρηγορεῖτε n'ọnọdụ a
  choice: na-eche nche
  alternative: mụọnụ anya
  rationale: Okwu Grik nwere ike ịpụta ịnọgide na-amụ anya ma ọ bụ ịdị na nche nke ọma. Isi ederede na-eji okwu sara mbara, ebe nkọwa ala na-echekwa echiche nke ịghara ihi ụra.
translation_notes:
  register: Standard Igbo dị ugbu a, kwụ ọtọ ma dị nsọpụrụ. E ji ‘mkpụrụ obi’ chekwaa okwu isi mmalite, e jikwa usoro okwu Igbo ebumpụta ụwa mee ka iwu ikpeazụ ghara ịda ka ntụgharị mkpụrụokwu n'usoro Grik.
