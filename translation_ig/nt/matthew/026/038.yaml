revisions:
- from: Mgbe ahụ, ọ sịrị ha, “Mkpụrụ obi m jupụtara n'oké mwute ruo ọnwụ.[a] Nọrọnụ n'ebe a, mụ na unu wee na-eche nche.[b]”
  to: Mgbe ahụ, ọ sịrị ha, “Mkpụrụ obi m jupụtara n'oké mwute ruo n'ókè ọnwụ. Nọrọnụ n'ebe a, sorokwa m na-eche nche.”
  rationale: The final command has been recast to preserve both its plural imperative force and the phrase ‘with me’ in natural Standard Igbo. The expression for the sorrow’s extremity has been clarified as ‘to the point of death.’ Footnote anchors are omitted because neither alternative is needed to understand the revised main text; the supplied footnotes are retained as the complete available footnote set for insertion if the publication format uses lexical notes.
