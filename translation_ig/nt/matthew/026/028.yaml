  to: N’ihi na nke a bụ ọbara m nke ọgbụgba ndụ, nke a na-awụpụ maka ọtụtụ mmadụ[b] maka mgbaghara mmehie.[a]
  rationale: Emezigharịrị naanị okwu ebumnobi mgbaghara iji soro usoro Grik kpọmkwem, na ndetu lexical iji gosi uru/abamuru nke περὶ πολλῶν n’enweghị ịmanye echiche nnọchi kpọmkwem. Akara ndetu ka dị n’ebe okwu ọ bụla ọ na-akọwa.
