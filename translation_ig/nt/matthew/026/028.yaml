  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: ig
  text: N’ihi na nke a bụ ọbara m nke ọgbụgba ndụ, nke a na-awụpụ maka ọtụtụ mmadụ[b] maka mgbaghara mmehie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ, “ọbara m nke ọgbụgba ndụ ọhụrụ.”
    reason: textual_variant
  - marker: b
    text: A pụkwara ịsụgharị ya, “maka ọdịmma ọtụtụ mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: nke a
  rationale: Ọ bụ nnọchiaha nrụtụaka nke na-ezo aka n’ihe Jizọs na-enye n’oriri ahụ; okwu Grik ekwughị ‘iko a,’ ya mere etinyeghị ‘iko.’
- source_word: γάρ
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara ma na-akọwa iwu Jizọs nyere tupu nke a ka ha ṅụọ.
- source_word: τὸ αἷμά μου
  choice: ọbara m
  rationale: Nsụgharị kwụ ọtọ nke na-edobe echiche àjà na ọgbụgba ndụ dị n’okwu ahụ.
- source_word: τῆς διαθήκης
  choice: nke ọgbụgba ndụ
  rationale: SBLGNT nwere naanị ‘ọgbụgba ndụ’; ọ nweghị καινῆς, ya bụ ‘ọhụrụ,’ n’ahịrị bụ isi.
- source_word: περὶ πολλῶν
  choice: maka ọtụtụ mmadụ
  rationale: N’ọnọdụ àjà a, περί tinyere genitive nwere echiche uru ma ọ bụ ịnọchite anya ndị ọzọ. ‘Maka ọtụtụ mmadụ’ bụ Igbo doro anya ma na-edobe πολλῶν n’ebugharịghị ya gaa ‘mmadụ niile.’
- source_word: ἐκχυννόμενον
  choice: nke a na-awụpụ
  rationale: Ọ na-asụgharị present passive participle ma na-edobe ihe atụ nke ọbara a na-awụpụ n’àjà.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: ka e wee gbaghara mmehie
  rationale: Ọ bụ Igbo eke na nghọta nke na-egosi ebumnobi ma ọ bụ nsonaazụ okwu Grik ahụ, na-enweghị iji okwu ochie na-esiri ndị mmadụ ike.
theological_decisions:
- issue: Ma a ga-etinye ‘ọhụrụ’ n’akụkụ ‘ọgbụgba ndụ’
  choice: nke ọgbụgba ndụ
  alternative: nke ọgbụgba ndụ ọhụrụ
  rationale: Ederede Grik e nyere enweghị καινῆς (‘ọhụrụ’). Ya mere, ahịrị bụ isi na-agbaso ederede ahụ, ebe ndetu na-egosi ọgụgụ dị n’ụfọdụ ihe odide.
- issue: Ihe ‘maka ọtụtụ mmadụ’ pụtara n’ihe gbasara mkpuchi mmehie
  choice: maka ọtụtụ mmadụ
  alternative: maka mmadụ niile
  rationale: Okwu Grik bụ πολλῶν, ‘ọtụtụ.’ Nsụgharị ahụ na-edobe okwu a ma ghara ikpebi esemokwu nkà mmụta okpukpe gbasara ókè mkpuchi mmehie si ruo.
- issue: Nuance nke περί tinyere genitive
  choice: maka ọtụtụ mmadụ
  alternative: n’ọnọdụ ọtụtụ mmadụ
  rationale: ‘Maka’ bụ ụzọ Igbo kachasị eke isi gosi uru ma ọ bụ nnọchite anya n’ọnọdụ a; ndetu na-echekwa nuance nke ‘n’ọnọdụ.’
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ ‘ọbara’ na ‘ọgbụgba ndụ’ dịka okwu ndị bụ isi n’echiche àjà na ọgbụgba ndụ. E debere akara ndetu [a] na [b] n’ahịrị bụ isi; a tụgharịrị usoro ha ka akara nke ọ bụla soro okwu ọ na-akọwa.
