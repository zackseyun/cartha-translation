  source_fidelity: 'Ahịrị bụ isi na-esochi SBLGNT nke ọma: a sụgharịrị τοῦτο dịka “nke a,” a hapụrụ “ọhụrụ” n’ahịrị bụ isi, ma debe πολλῶν dịka “ọtụtụ mmadụ.” “Nke a na-awụpụ” na-egosi participle passive ἐκχυννόμενον n’ụzọ kwesịrị ekwesị.'
