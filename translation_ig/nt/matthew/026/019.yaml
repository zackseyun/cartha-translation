reference: Matthew 26:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: ig
  text: Ndị na-eso ụzọ ahụ mere dị ka Jizọs nyere ha iwu, ha wee kwadebe Emume Ngabiga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nri Emume Ngabiga”; πάσχα nwere ike ịpụta emume Ngabiga n’ozuzu ya, tinyere nri a na-akwadebe maka ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: mere
  rationale: Ngwaa Igbo a na-ejikarị eme ihe kwekọrọ na ‘mere’; ya na ‘dị ka ... nyere ha iwu’ na-egosi na ha mezuru ihe a gwara ha.
- source_word: οἱ μαθηταὶ
  choice: Ndị na-eso ụzọ ahụ
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a maara nke ọma isi kpọọ ndị na-amụta n’aka Jizọs ma na-eso ya.
- source_word: ὡς
  choice: dị ka
  rationale: Ọ na-egosi na ihe ha mere kwekọrọ n’ihe Jizọs gwara ha.
- source_word: συνέταξεν
  choice: nyere ha iwu
  rationale: συντάσσω pụtara inye ntụziaka ma ọ bụ iwu; okwu a na-echekwa ikike Jizọs n’enweghị ịgbakwunye echiche nke aka ike.
- source_word: ἡτοίμασαν
  choice: kwadebe
  rationale: Ọ bụ okwu Igbo nkịtị na nke ziri ezi maka ime ka ihe dị njikere.
- source_word: τὸ πάσχα
  choice: Emume Ngabiga
  rationale: πάσχα nwere ike ịpụta emume Ngabiga n’ozuzu ya, nri ya, ma ọ bụ ihe ndị ọzọ metụtara ya. ‘Emume Ngabiga’ na-echekwa obosara okwu Grik ahụ, ebe nkọwa ala peeji na-egosi ihe nri ahụ pụtara n’ọnọdụ a.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Ụdị aha a bụ nke a na-ejikarị na Standard Igbo.
theological_decisions:
- issue: Oke ihe τὸ πάσχα pụtara
  choice: Emume Ngabiga
  alternative: nri Emume Ngabiga; nwa atụrụ Ngabiga
  rationale: N’ọnọdụ a, ndị na-eso ụzọ ahụ na-akwadebe maka nri ha na Jizọs ga-eri, ma okwu Grik ahụ akọwaghị kpọmkwem na ọ bụ naanị nri ahụ ma ọ bụ nwa atụrụ ahụ. Isiokwu ahụ mere ka ihe okwu ahụ pụtara saa mbara, ebe nkọwa ala peeji kọwara ihe ọzọ o nwere ike ịpụta.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere ugwu ma dịkwa mfe nghọta. E ji ‘ha wee’ mee ka usoro omume abụọ ahụ doo anya ma bụrụ nke e ji akọ akụkọ n’Igbo.
