id: MAT.26.17
reference: Matthew 26:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: ig
  text: N’ụbọchị mbụ nke Emume Achịcha Na-ekoghị Eko[a], ndị na-eso ụzọ bịakwutere Jizọs, sị, “Olee ebe ị chọrọ ka anyị kwadebeere gị ka i rie nri Ngabiga[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nke a sụgharịrị okwu Grik kpọmkwem, “ụbọchị mbụ nke Achịcha Na-ekoghị Eko.” Nsụgharị a ekwesịghị n’onwe ya ikpebi mkparịta ụka banyere usoro oge Ngabiga.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “ka i rie Ngabiga.” N’ebe a, “Ngabiga” na-ezo aka na nri Ngabiga.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: N’ụbọchị mbụ nke Emume Achịcha Na-ekoghị Eko
  rationale: Nkebi a bụ okwu oge, ‘n’ụbọchị mbụ’; δέ bụ njikọ dị nro nke na-adịghị mkpa ka e jiri okwu pụrụ iche buo ụzọ n’Igbo. τῶν ἀζύμων na-ezo aka n’emume ndị Juu nke achịcha na-ekoghị eko.
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: ndị na-eso ụzọ bịakwutere Jizọs
  rationale: προσέρχομαι pụtara ịbịakwute ma ọ bụ ịgakwuru mmadụ; ‘bịakwutere’ na-egosi ntụziaka ahụ nke ọma. E tinyeghị ‘ya’ n’aha ndị na-eso ụzọ n’ihi na Grik kwuru naanị ‘ndị na-eso ụzọ.’
- source_word: λέγοντες
  choice: sị
  rationale: Ọ bụ ezie na Grik ji participle nke pụtara ‘na-asị,’ ‘sị’ bụ ụzọ Igbo dị ndụ ma dị mfe isi jikọta ọbịbịa ha na okwu ha, n’agbanweghị ihe okwu ahụ pụtara.
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: Olee ebe ị chọrọ ka anyị kwadebeere gị
  rationale: θέλεις na-egosi ọchịchọ; subjunctive ἑτοιμάσωμεν na ajụjụ a dabara na ‘ka anyị kwadebe,’ ebe σοι pụtara na a na-akwadebe ya maka Jizọs.
- source_word: φαγεῖν τὸ πάσχα
  choice: ka i rie nri Ngabiga
  rationale: N’ebe a, πάσχα bụ ihe a ga-eri, ya mere ‘nri Ngabiga’ na-eme ka ihe okwu ahụ na-ezo aka na ya doo onye Igbo anya, ebe φαγεῖν ka bụ ‘ka i rie.’
theological_decisions:
- issue: Okwu oge ‘ụbọchị mbụ nke Achịcha Na-ekoghị Eko’ na usoro oge nri Ngabiga
  choice: E debere ya dịka ‘N’ụbọchị mbụ nke Emume Achịcha Na-ekoghị Eko’ n’enweghị ime ka o kwekọọ n’ụzọ nkọwa ọzọ.
  alternative: ‘N’ụbọchị tupu Emume Achịcha Na-ekoghị Eko’ ma ọ bụ ‘n’ụbọchị mbụ nke Ngabiga.’
  rationale: Grik kwuru kpọmkwem ‘ụbọchị mbụ nke [Achịcha] Na-ekoghị Eko.’ Nsụgharị ekwesịghị ikpebi arụmụka gbasara usoro oge dị n’Oziọma site n’ịgbanwe okwu ahụ.
- issue: Ihe πάσχα pụtara n’ebe a
  choice: nri Ngabiga
  alternative: Ngabiga
  rationale: πάσχα nwere ike ịpụta emume ma ọ bụ nri ya. N’ihi na ngwaa ahụ bụ ‘irie,’ nri ahụ bụ ihe a na-ekwu kpọmkwem ebe a; a na-edebe aha emume ahụ n’okwu ‘Ngabiga.’
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Emume Achịcha Na-ekoghị Eko’ na-akọwa aha emume ndị Juu n’enweghị itinye echiche otu ụka; ‘nri Ngabiga’ na-eme ka ihe a na-akwadebe ka e rie doo anya. Akara nkọwa ala ala [a] na [b] dị n’ederede isi.
