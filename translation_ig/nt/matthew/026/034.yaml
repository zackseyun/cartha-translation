source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι ἐν ταύτῃ τῇ νυκτὶ πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: ig
  text: Jizọs sịrị ya, “N’ezie, ana m agwa gị, n’abalị a kpọmkwem,[a] tupu oke ọkụkọ akwaa,[b] ị ga-agọnahụ m ugboro atọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’abalị taa.” N’asụsụ Grik, ọ bụ “n’abalị a,” ebe okwu “a” na-emesi abalị ahụ ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “tupu oke ọkụkọ ahụ akwaa.” Asụsụ Grik ebe a anaghị amanye ka e jiri okwu na-egosi otu oke ọkụkọ a kapịrị ọnụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jizọs sịrị ya
  rationale: Nke a bụ ụzọ nkịtị na nke doro anya e si akọ okwu n’Igbo, ma ọ na-edobe onye kwuru na onye a gwara okwu.
- source_word: Ἀμὴν λέγω σοι
  choice: N’ezie, ana m agwa gị
  rationale: “N’ezie” na-ebute nkwupụta siri ike ma dị nsọ n’ụzọ ndị Igbo nke oge a ga-aghọta; “ana m agwa gị” na-edobe okwu Jizọs kwuru kpọmkwem nye Pita.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: n’abalị a kpọmkwem
  rationale: Nhọrọ a na-edobe nrụgide dị na ταύτῃ, ya bụ abalị a n’onwe ya, ma na-ada ka Igbo ebumpụta ụwa.
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: tupu okeọkụkọ abụọ
  rationale: Okwu Grik ahụ enweghị mkpụrụokwu na-amanye ka ọ bụrụ otu okeọkụkọ a maara; “okeọkụkọ abụọ” bụ ụzọ Igbo nkịtị si ekwu mkpu okeọkụkọ.
- source_word: τρὶς
  choice: ugboro atọ
  rationale: Nke a bụ nsụgharị kpọmkwem, nke doro anya, ma bụrụkwa okwu Igbo nke oge a.
- source_word: ἀπαρνήσῃ με
  choice: ị ga-agọnahụ m
  rationale: “Ị ga-agọnahụ m” na-egosi na Pita ga-ekwu ma ọ bụ mee ka a ga-asị na ọ maghị Jizọs, na-enweghị ịgbakwunye nkọwa karịrị isi okwu Grik.
theological_decisions:
- issue: Usoro mmalite Ἀμὴν λέγω σοι nke Jizọs ji kwuo okwu
  choice: N’ezie, ana m agwa gị
  alternative: Amen, ana m asị gị; Ana m emesi gị obi ike
  rationale: Nhọrọ a na-edobe ịdị arọ na ikike nke nkwupụta Jizọs, ma ọ naghị ebubata nghọta ụka pụrụ iche ma ọ bụ hapụ okwu ahụ ka ọ bụrụ naanị mkpụrụokwu Hibru a sụgharịghị.
- issue: Ihe ἀπαρνήσῃ με pụtara n’amụma Jizọs
  choice: ị ga-agọnahụ m
  alternative: ị ga-ajụ na ị maara m; ị ga-ajụ m
  rationale: '“Agọnahụ m” na-edobe obosara okwu Grik: ọ nwere ike ịgụnye ịjụ mmekọrịta ma ọ bụ ịjụ na onye ahụ maara Jizọs, n’enweghị idozi esemokwu ahụ n’ime isiokwu.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “N’abalị a kpọmkwem” na-edobe mmesi ike nke okwu Grik, ebe “okeọkụkọ abụọ” bụ akpaokwu Igbo ebumpụta ụwa.
