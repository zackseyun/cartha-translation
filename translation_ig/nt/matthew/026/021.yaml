id: MAT.26.21
reference: Matthew 26:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐσθιόντων αὐτῶν εἶπεν· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: ig
  text: Mgbe ha na-eri nri, ọ sịrị, “N’ezie, ana m asị unu, otu onye n’ime unu ga-arara m nye[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “ga-enyefe m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: Mgbe ha na-eri nri
  rationale: Nkebiokwu a na-egosi na ihe abụọ ahụ mere n’otu oge. Nsụgharị a bụ Igbo nkịtị ma dokwaa echiche nke ‘mgbe ha nọ na-eri nri.’
- source_word: Ἀμὴν
  choice: N’ezie
  rationale: N’okwu Jizọs, okwu a bụ nkwupụta siri ike nke na-ebute ihe dị mkpa ọ na-achọ ikwu. ‘N’ezie’ na-egosipụta ọrụ ahụ n’Igbo doro anya.
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Nke a bụ ụzọ okwu nkịtị e si agwa ndị nọ n’ihu mmadụ okwu ozugbo; ọ na-edokwa onye na-ekwu okwu na ndị ọ na-agwa okwu anya.
- source_word: εἷς ἐξ ὑμῶν
  choice: otu onye n’ime unu
  rationale: Nke a na-egosipụta kpọmkwem na onye ahụ bụ otu n’ime ndị Jizọs na-agwa okwu.
- source_word: παραδώσει
  choice: ga-arara m nye
  rationale: Ngwaa Grik a pụtara inyefe mmadụ n’aka ndị ọzọ, ma n’ọnọdụ akụkọ a inyefe ahụ bụ omume aghụghọ nke onye nọ Jizọs nso. ‘Ga-arara m nye’ na-egosipụta ihe ahụ n’Igbo eke, ebe nkọwa ala peeji na-edokwa echiche sara mbara nke ‘inyefe.’
- source_word: με
  choice: m
  rationale: Nnọchiaha a bụ onye a na-eme ihe n’ahịrịokwu ahụ, ya bụ Jizọs; ‘m’ na-enye ya kpọmkwem.
theological_decisions:
- issue: Otú e si sụgharịa παραδώσει n’akụkọ ahụhụ Jizọs
  choice: ga-arara m nye
  alternative: ga-enyefe m
  rationale: Ngwaa Grik ahụ sara mbara karịa ‘ịrara nye,’ ma ọnọdụ a na-ekwu maka otu n’ime ndị na-eso Jizọs nke ga-eji aghụghọ nyefee ya. Isiokwu na-eji okwu Igbo nke na-egosipụta aghụghọ ahụ, ebe nkọwa ala peeji na-echekwa ihe ngwaa ahụ pụtara n’ụzọ nkịtị karị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa nsọpụrụ. A họọrọ ‘N’ezie’ maka nkwupụta siri ike Ἀμὴν, ma tinye akara nkọwa [a] ozugbo n’ebe okwu παραδώσει dị ka isiokwu nkọwa ahụ si chọọ.
