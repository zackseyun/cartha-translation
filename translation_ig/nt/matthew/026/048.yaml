id: MAT.26.48
reference: Matthew 26:48
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: ig
  text: Onye ahụ na-arara ya nye[a] enyelarị ha akara[b], sị, “Onye ọ bụla m ga-esusu ọnụ bụ ya; jidenụ ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ahụ na-enyefe ya.” Ngwaa Grik ahụ nwere ike ịpụta “inyefe,” ma n’ebe a ọ na-ekwu banyere nrara Judas.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe ịrịba ama.” N’ebe a, akara ahụ bụ ihe e kwekọrịtara iji mata onye a ga-ejide.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: onye ahụ na-arara ya nye
  rationale: N’akụkọ a banyere Judas, ngwaa ahụ pụtara inyefe mmadụ n’ụzọ aghụghọ, ya mere ‘na-arara ya nye’ na-egosipụta ibu omume dị na ya, ọ bụghị naanị inyefe ya n’aka ndị ọzọ.
- source_word: σημεῖον
  choice: akara
  rationale: N’ebe a, ‘akara’ bụ ihe e kwekọrịtara iji mata Jizọs; ọ na-asụgharị echiche nke ihe ịrịba ama ma na-ada nke ọma n’Igbo.
- source_word: Ὃν ἂν φιλήσω
  choice: Onye m ga-esusu ọnụ
  rationale: Nke a na-echekwa ahịrịokwu njikọ na-akọwapụtaghị onye ahụ tupu oge eruo, ma na-ekwu ya n’Igbo dị mfe ma doo anya.
- source_word: φιλήσω
  choice: m ga-esusu ọnụ
  rationale: Ọ na-egosi omume isusu ọnụ kpọmkwem, na-agbakwụnyeghị na ọ bụ ekele, n’ihi na Grik akọwaghị nke ahụ.
- source_word: αὐτός ἐστιν
  choice: bụ ya
  rationale: 'Nke a na-echekwa nkwupụta dị nkenke e ji mata onye ahụ: ‘ọ bụ ya.’'
- source_word: κρατήσατε
  choice: jidenụ ya
  rationale: ‘Jidenụ’ na-egosi ijide mmadụ n’ike ma dabara n’ọnọdụ njide a, n’etinyeghị echiche iwu sara mbara karịa ngwaa Grik.
theological_decisions:
- issue: Ibu omume nke παραδιδοὺς mgbe ọ na-ekwu banyere Judas
  choice: onye ahụ na-arara ya nye
  alternative: onye ahụ na-enyefe ya
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na inyefe Jizọs bụ nrara Judas. Nsụgharị a na-egosipụta nke ahụ n’enweghị ịgbakwụnye nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. ‘Nyelarị’ na-egosi na Judas nyere ndị ahụ akara tupu oge njide ahụ; ‘jidenụ’ na-echekwa iwu e nyere ọtụtụ mmadụ na ike dị na κρατήσατε.
