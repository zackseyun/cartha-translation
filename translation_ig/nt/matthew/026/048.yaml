    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe ịrịba ama.” N’ebe a, akara ahụ bụ ihe e kwekọrịtara iji mata onye a ga-ejide.
    reason: lexical_alternative
