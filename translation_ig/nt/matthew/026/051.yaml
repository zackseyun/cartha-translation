id: MAT.26.51
reference: Matthew 26:51
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s servant, and cut off his ear.
translation:
  language: ig
  text: Ma lee, otu onye n’ime ndị nọnyere Jizọs setịpụrụ aka ya, dọpụtara mma agha ya, wee tie ohu[a] onyeisi nchụàjà ahụ, ma bipụrụ ntị ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-eje ozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: lee
  rationale: Na-edobe ike na mberede nke okwu a ji dọta uche n’akụkọ ahụ, ma bụrụkwa okwu Igbo doro anya.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: otu onye n’ime ndị ha na Jizọs nọ
  rationale: Na-egosipụta nkewa ahụ dị na Grik n’enweghị ịkọ onye ahụ bụ ma ọ bụ ịgbakwụnye nkọwa na-adịghị na isi mmalite.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: setịrị aka ya
  rationale: Na-edobe mmegharị ahụ nke mere tupu ọ mịpụta ngwa agha ahụ, n’ụzọ Igbo dị mfe ma kwekọọ n’usoro ihe omume.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: mịpụta mma agha ya
  rationale: Na-egosi na ọ dọpụtara ngwa agha ahụ; okwu a bụ nke okike n’Igbo ma ghara ịkọwa kpọmkwem ụdị ebe o si dọpụta ya.
- source_word: μάχαιραν
  choice: mma agha
  rationale: Ọ bụ aha Igbo a na-aghọta nke ọma maka ngwa agha a; ịsị mma agha dị mkpụmkpụ ma ọ bụ mma ukwu ga-akọwa karịa ihe ederede kwuru.
- source_word: πατάξας
  choice: were ya tie
  rationale: Na-egosipụta iti ihe ike nke mma agha ahụ ma mee ka onye na-agụ ya ghọta na e ji ngwa agha ahụ tie ohu ahụ.
- source_word: δοῦλον
  choice: ohu
  rationale: Na-edobe ọnọdụ mmekọrịta mmadụ nke δοῦλος n’akụkọ a kama ime ka ọ dị nro dịka naanị onye na-eje ozi.
- source_word: ἀρχιερέως
  choice: onyeisi nchụàjà
  rationale: Nke a bụ nsụgharị Igbo a na-ahụkarị ma doo anya maka nnukwu onye nchụàjà ahụ n’otu onye.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: bipụ ntị ya
  rationale: Na-egosipụta n'ụzọ okike n’Igbo nsonaazụ nke iti mma agha ahụ, ma na-edobe ya dịka omume ọzọ zuru ezu dị na ngwaa Grik.
- source_word: ὠτίον
  choice: ntị
  rationale: Ụdị okwu Grik ahụ pere mpe, ma ‘ntị’ bụ okwu Igbo kwesịrị ekwesị; ‘ọnụ ntị’ ga-adị kpọmkwem karịa ihe ederede kwuru.
theological_decisions:
- issue: Nsụgharị δοῦλος n’akụkọ na-egosi ọnọdụ mmadụ n’obodo
  choice: ohu
  alternative: onye na-eje ozi
  rationale: N’ebe a, okwu ahụ na-egosi onye nọ n’okpuru onyeisi nchụàjà dịka ohu. ‘Ohu’ na-edobe ọnọdụ mmekọrịta ahụ, ebe ‘onye na-eje ozi’ nwere ike ime ka ọ dị nro; agbanyeghị, e debere nke ikpeazụ dịka nhọrọ n’ala ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. ‘Ma lee’ na-edobe ịdị ndụ na mberede nke akụkọ Matiu; usoro ngwaa ndị ahụ na-edobe ọsọ nke ihe omume ahụ.
