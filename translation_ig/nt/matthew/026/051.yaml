revisions:
- from: Ma lee, otu onye n’ime ndị ha na Jizọs nọ setịrị aka ya, mịpụta mma agha ya, were ya tie ohu[a] onyeisi nchụàjà ahụ, bipụ ntị ya.
  to: Ma lee, otu onye n’ime ndị nọnyere Jizọs setịpụrụ aka ya, dọpụtara mma agha ya, wee tie ohu[a] onyeisi nchụàjà ahụ, ma bipụrụ ntị ya.
  rationale: The revision resolves the unclear pronoun and uses unambiguously completed narrative verb forms. It retains the source’s ambiguity concerning the person’s identity, the concrete rendering “ohu” for δοῦλος, and the separate actions of drawing the sword, striking the high priest’s slave, and cutting off his ear.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:19Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the full sequence and does not identify the unnamed disciple. It correctly renders δοῦλος as “ohu” and retains the two distinct actions of striking and removing the ear. However, several verb forms as written can read as non-past/imperatival rather than as Matthew’s narrated past actions.
  naturalness: “ndị ha na Jizọs nọ” is referentially awkward because “ha” lacks a clear antecedent in the clause. “ndị nọnyere Jizọs” is more natural Standard Igbo. Past/perfective forms also make the rapid narrative sequence clearer.
  terminology: “Jizọs,” “mma agha,” “ohu,” “onyeisi nchụàjà,” and “ntị” are appropriate. The footnote supplies a legitimate softer lexical alternative without displacing the socially concrete primary rendering “ohu.”
  issues:
  - severity: medium
    issue: The forms “setịrị,” “mịpụta,” and “bapụ” are not consistently marked as completed narrative actions.
    rationale: The Greek aorists narrate completed actions. Using clear perfective forms (setịpụrụ, dọpụtara, bipụrụ) improves both grammatical clarity and source fidelity in Standard Igbo.
  - severity: medium
    issue: “ndị ha na Jizọs nọ” is awkward and its pronoun “ha” is unclear.
    rationale: The Greek simply means “those with Jesus,” without an additional pronoun. “ndị nọnyere Jizọs” expresses this naturally and keeps the person unidentified.
  revised_text: Ma lee, otu onye n’ime ndị nọnyere Jizọs setịpụrụ aka ya, dọpụtara mma agha ya, wee tie ohu[a] onyeisi nchụàjà ahụ, ma bipụrụ ntị ya.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-eje ozi.”
    reason: lexical_alternative
  revision_rationale: The revision resolves the unclear pronoun and uses unambiguously completed narrative verb forms. It retains the source’s ambiguity concerning the person’s identity, the concrete rendering “ohu” for δοῦλος, and the separate actions of drawing the sword, striking the high priest’s slave, and cutting off his ear.
