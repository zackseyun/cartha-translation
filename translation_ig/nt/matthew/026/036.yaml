id: MAT.26.36
reference: Matthew 26:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: ig
  text: Mgbe ahụ, Jizọs na ha bịarutere n’otu ebe a na-akpọ Getsemeni, ọ sịkwa ndị na-eso ụzọ ya, “Nọdụnụ ebe a ka m gaa ebe ahụ kpee ekpere.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe sochiri ihe mere tupu ya ma na-eme ka akụkọ na-aga n’ihu n’ụzọ doro anya.
- source_word: ἔρχεται
  choice: bịarutere
  rationale: Ọ bụ historical present n’asụsụ Grik; oge gara aga bụ ụzọ okike e si akọ akụkọ a n’Igbo, ebe ‘bịarutere’ na-egosikwa iru ebe ahụ nke ọma.
- source_word: μετ’ αὐτῶν
  choice: na ha
  rationale: Ọ na-egosi na Jizọs so ndị ahụ gaa ebe ahụ.
- source_word: χωρίον
  choice: otu ebe
  rationale: Okwu ahụ nwere ike ịpụta ebe ma ọ bụ ala e nwere; ‘otu ebe’ na-edobe ya n’obosara n’etinyeghị nkọwa ‘ubi’ nke Matiu ekwughị.
- source_word: λεγόμενον Γεθσημανί
  choice: a na-akpọ Getsemeni
  rationale: Nke a bụ usoro Igbo dị mfe ma dị ugbu a maka ịkpọ aha ebe; a sụgharịrị aha ahụ dịka ụda ya si daba n’Igbo.
- source_word: λέγει τοῖς μαθηταῖς
  choice: ọ sịkwa ndị na-eso ụzọ ya
  rationale: ‘Sị’ bụ ụzọ Igbo kachasị eke isi webata okwu mmadụ kwuru; ‘ndị na-eso ụzọ ya’ na-enye μαθηταί n’ụzọ ndị mmadụ na-aghọta.
- source_word: Καθίσατε αὐτοῦ
  choice: Nọdụnụ ebe a
  rationale: Ọ na-enye iwu ahụ n’ụzọ dị nkenke ma na-edobe ọdịiche dị n’etiti ‘ebe a’ na ‘ebe ahụ.’
- source_word: ἕως οὗ
  choice: ka
  rationale: N’ahịrịokwu Igbo a, ‘ka m gaa...’ na-egosi na ha ga-anọ ebe ahụ n’oge ọ na-aga ikpe ekpere, n’enweghị mkpọtụ nke nsụgharị nkịtị ‘ruo mgbe.’
- source_word: ἀπελθὼν ἐκεῖ προσεύξωμαι
  choice: m gaa ebe ahụ kpee ekpere
  rationale: Ọ na-edobe usoro omume—ịga ebe ahụ, mesịa ikpe ekpere—n’Igbo dị larịị ma bụrụkwa nke eke.
theological_decisions:
- issue: Ụdị ebe Getsemeni bụ
  choice: otu ebe
  alternative: ubi
  rationale: Matiu ji χωρίον, nke pụtara ebe ma ọ bụ ala, ọ bụghị okwu kpọmkwem maka ubi. Ya mere, a naghị ebubata nkọwa sitere n’akụkọ Jọn.
- issue: Mmekọrịta oge dị na ἕως οὗ
  choice: ka m gaa ebe ahụ kpee ekpere
  alternative: ruo mgbe m gara ebe ahụ kpee ekpere
  rationale: Nhọrọ a na-egosi na ndị na-eso ụzọ ga-anọ ọdụ n’oge Jizọs na-aga ikpe ekpere, ma ọ naghị agbanwe isi ihe iwu ahụ pụtara.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji oge gara aga kọọ historical present ndị Grik n’ihi na nke ahụ ka dị eke n’akụkọ Igbo. E tinyeghị ‘ubi’ ma ọ bụ nkọwa sitere n’ebe ọzọ.
