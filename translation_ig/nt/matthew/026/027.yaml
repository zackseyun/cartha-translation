id: MAT.26.27
reference: Matthew 26:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: ig
  text: O weere otu iko[a], nye ekele[b], ma nye ha ya, sị, “Ṅụọnụ n’ime ya, unu niile[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “iko ahụ.” N’asụsụ Grik, okwu “iko” enweghị edemede mkpụrụokwu nke na-egosi ihe a kapịrị ọnụ, ọ bụ ezie na ọnọdụ nri ahụ pụrụ ime ka ọ na-ezo aka n’iko a maara.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị mmalite ahịrịokwu a, “Mgbe o weere otu iko ma nye ekele, o nyere ha ya.” Grik ji participle abụọ kọwaa omume ndị mere tupu o nye ha iko ahụ.
    reason: previous_rendering
  - marker: c
    text: “Unu niile” pụtara na iwu a metụtara ndị niile nọ n’ìgwè ahụ; ọ pụtaghị na ha ga-aṅụcha ihe niile dị n’iko ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: mgbe o wesịrị
  rationale: Aorist participle a na-egosi omume mere tupu ngwaa bụ isi. “Mgbe o wesịrị” na-eme ka usoro oge ahụ doo anya n’Igbo dị ugbu a.
- source_word: ποτήριον
  choice: otu iko
  rationale: Aha Grik a enweghị article; “otu iko” na-egosipụta na e kwughị ya kpọmkwem dị ka “iko ahụ,” ma ọ naghị etinye ụdị iko ma ọ bụ ihe dị n’ime ya.
- source_word: εὐχαριστήσας
  choice: nye ekele
  rationale: Nke a na-edobe isi okwu εὐχαριστέω, ya bụ inye ekele, n’etinyeghị okwu emume okpukpe ma ọ bụ echiche na ọ gọziri iko ahụ.
- source_word: ἔδωκεν αὐτοῖς
  choice: o nyere ha ya
  rationale: “Ha” na-anọchi anya ndị na-eso ụzọ ahụ, ebe “ya” na-anọchi anya iko ahụ, dị ka ọnọdụ okwu si mee ka o doo anya.
- source_word: λέγων
  choice: sị
  rationale: “Sị” bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji ebute okwu mmadụ kwuru kpọmkwem.
- source_word: Πίετε
  choice: Ṅụọnụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ; mgbakwunye “-nụ” na-egosi nke ahụ n’Igbo.
- source_word: ἐξ αὐτοῦ
  choice: n’ime ya
  rationale: N’ọnọdụ ịṅụ ihe dị n’iko, nke a bụ ụzọ Igbo si ekwu n’ụzọ ebumpụta ụwa ihe Grik pụtara, ya bụ ịṅụ site n’iko ahụ.
- source_word: πάντες
  choice: unu niile
  rationale: Ọ na-akọwa ndị niile a na-enye iwu ka ha ṅụọ, ọ bụghị oke ihe ha ga-aṅụ.
theological_decisions:
- issue: Ihe εὐχαριστήσας pụtara n’akụkọ Nri Anyasị Ikpeazụ
  choice: nye ekele
  alternative: gọzie ya; kwuo ekpere ekele
  rationale: Grik pụtara inye ekele. Nsụgharị a anaghị etinye echiche na Jizọs gọziri iko ahụ, ọ naghịkwa ewebata okwu emume okpukpe nke akụkụ Akwụkwọ Nsọ a ekwughị kpọmkwem.
- issue: Ihe πάντες na-emetụta n’iwu ahụ
  choice: unu niile
  alternative: niile; ṅụchaa ya niile
  rationale: N’usoro okwu Grik, πάντες na-ezo aka n’ìgwè mmadụ niile a na-agwa okwu. Ọ naghị ekwu na ha ga-aṅụcha ihe niile dị n’iko ahụ, nsụgharị ahụ anaghịkwa eme nkwupụta ụka karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta mee ihe. “Mgbe o wesịrị… ma nye…” na-echekwa usoro omume ndị dị na Grik n’enweghị ahịrịokwu tara akpụ; “Ṅụọnụ… unu niile” na-egosi nke ọma na iwu ahụ bụ maka ọtụtụ mmadụ.
