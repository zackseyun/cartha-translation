  naturalness: The command “Ṅụọnụ n’ime ya, unu niile” is clear and natural enough in Standard Igbo. Revising the narrative opening to finite serial actions produces a smoother, idiomatic biblical-narrative sentence without changing the sequence.
  terminology: “otu iko,” “nye ekele,” and “unu niile” are appropriate and avoid sacramental over-interpretation. The footnotes should avoid the untranslated English grammatical term “article,” and the alternative wording in note b should be grammatical and correspond to the revised text.
