  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: ig
  text: Ma ọ gọnahụrụ ya n’ihu ha niile, sị, “Amaghị m ihe ị na-ekwu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: ọ gọnahụrụ ya
  rationale: Ngwaa a na-egosi na Pita jụrụ ebubo ahụ e boro ya n’okwu bu ụzọ; ‘ya’ na-anọchi anya ebubo ahụ n’enweghị ịkọwa karịa ihe ederede kwuru.
- source_word: ἔμπροσθεν πάντων
  choice: n’ihu ha niile
  rationale: Nke a na-egosi na ọ gọnahụrụ ya n’ihu ndị niile nọ ebe ahụ, ma na-echekwa ọdịdị ọha nke ihe ahụ.
- source_word: λέγων
  choice: sị
  rationale: ‘Sị’ bụ ụzọ Igbo dị nkenke ma bụrụkwa nke e ji akọ akụkọ n’ụzọ ebumpụta ụwa iji webata okwu ọnụ.
- source_word: Οὐκ οἶδα
  choice: Amaghị m
  rationale: Nke a bụ nsụgharị Igbo kwụ ọtọ ma bụrụ nke mmadụ na-asụkarị maka nkwupụta na onye ahụ amaghị.
- source_word: τί λέγεις
  choice: ihe ị na-ekwu
  rationale: Nke a na-esochi okwu Grik ahụ nke ọma ma na-anọgidekwa bụrụ Igbo doro anya na nke ebumpụta ụwa.
theological_decisions:
- issue: Ụdị ngọnahụ Pita
  choice: Pita gọnahụrụ ebubo a ka kwupụtara n’ihu ọha, n’enweghị ịgbakwụnye nkọwa ọzọ.
  alternative: Ịsị kpọmkwem na Pita gọnahụrụ Jizọs, ma ọ bụ na ọ gọnahụrụ na ya maara nwaanyị odibo ahụ.
  rationale: Ederede Grik kwuru naanị na ọ ‘gọnahụrụ’; ihe e gọnahụrụ na-apụta site n’ebubo dị n’okwu bu ụzọ. Nsụgharị ahụ jiri ‘ya’ mee ka Igbo zuo oke, ma ọ kọwaghị ihe karịrị ihe gbara amaokwu ahụ gburugburu.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘n’ihu ha niile’ iji chekwaa nkwupụta ahụ n’ihu ọha, na ‘ihe ị na-ekwu’ iji soro τί λέγεις nso n’enweghị asụsụ siri ike.
