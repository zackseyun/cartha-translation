  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς ⸀καὶ τὸ συνέδριον ὅλον ἐζήτουν ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ ὅπως ⸂αὐτὸν θανατώσωσιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: ig
  text: Ndị isi nchụaja na kansụl ahụ dum nọ na-achọ akaebe ụgha megide Jizọs ka ha wee gbuo ya[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “àmà ụgha.” Okwu Grik ahụ na-ezo aka n’akaebe ụgha e nyere n’okwu ikpe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Sanhedrin ahụ dum.” Okwu Grik ahụ na-ezo aka na kansụl ọchịchị ndị Juu.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Njikọ a na-egosi ntụgharị dị nro n’akụkọ ahụ; “Ma” dabara n’Igbo n’enweghị itinye okwu oge na-adịghị na Grik.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Nke a na-ezo aka n’òtù ndị ndu nchụaja, ọ bụghị ọtụtụ ndị ji ọkwa onyeisi nchụaja n’otu oge.
- source_word: συνέδριον ὅλον
  choice: ndị kansụl ahụ niile
  rationale: “Kansụl” bụ okwu a na-aghọta nke ọma maka òtù na-achị achị, “niile” na-egosikwa ὅλον.
- source_word: ἐζήτουν
  choice: nọ na-achọ
  rationale: Ụdị imperfect na-egosi na ọchịchọ ahụ gara n’ihu, ọ bụghị naanị otu omume e mere n’otu ntabi anya.
- source_word: ψευδομαρτυρίαν
  choice: akaebe ụgha
  rationale: Ọ na-egosi ihe akaebe a na-agba n’ụlọikpe; okwu Grik ahụ nwekwara ike ịpụta onye akaebe ụgha.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: megide Jizọs
  rationale: Nke a na-egosipụta mmegide e duziri n’ebe Jizọs nọ n’okwu ikpe.
- source_word: ὅπως
  choice: ka ha wee
  rationale: Ọ na-egosi nzube nke ịchọ akaebe ụgha ahụ.
- source_word: θανατώσωσιν
  choice: gbuo ya
  rationale: Nke a na-ekwupụta ime ka mmadụ nwụọ n'ụzọ doro anya, na-etinyeghị nkọwa karịrị okwu Grik ahụ.
theological_decisions:
- issue: Ụdị atụmatụ ikpe nke ndị ndu ahụ
  choice: E gosiri na ha nọgidere na-achọ akaebe ụgha n’ebumnuche igbu Jizọs.
  alternative: A pụrụ ikwu ya nkenke dịka, “ha chọrọ onye akaebe ụgha ka ha gbuo Jizọs.”
  rationale: Imperfect ἐζήτουν na nkebi nzube ὅπως…θανατώσωσιν na-egosi mbọ a kpachapụrụ anya nke gara n’ihu; nsụgharị ahụ anaghị atụkwasị nkọwa ozizi.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. “Ndị isi nchụaja” na “kansụl” na-edobe ọnọdụ okpukpe na nke ikpe; a hapụrụ mgbagwoju anya dị na ψευδομαρτυρίαν n’ala peeji.
