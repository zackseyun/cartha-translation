  text: τί ὑμῖν δοκεῖ; οἱ δὲ ἀποκριθέντες εἶπαν· Ἔνοχος θανάτου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/066.yaml
  text: What do you think? They answered[a], “He is deserving of death.”
translation:
  language: ig
  text: “Gịnị ka unu chere?” Ha zara sị, “Ọ kwesịrị ọnwụ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ikpe ọnwụ mara ya.” Okwu Grik a bụ okwu e ji ekpe ikpe n’ụlọikpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Gịnị ka unu chere?
  rationale: Ajụjụ a na-arịọ echiche ma ọ bụ ikpe ha; ntụgharị a bụ Igbo nkịtị, doo anya, ma chekwaa ike ajụjụ ahụ.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: Ha zara sị
  rationale: Usoro participle na ngwaa a bụ ụzọ akụkọ si ekwu na ha zara; ‘Ha zara sị’ bụ usoro ebumpụta ụwa n’Igbo. δέ bụ njikọ dị nro, nke na-adịghị mkpa ka e jiri okwu mmegide pụta ìhè ebe a.
- source_word: Ἔνοχος
  choice: O kwesịrị
  rationale: N’ọnọdụ ikpe a, ἔνοχος na-egosi na a mara ya dịka onye kwesịrị ma ọ bụ onye iwu jidere n’ihe a kpọrọ aha; ‘kwesịrị’ na-eme ka mkpebi ikpe ahụ doo ndị na-agụ Igbo anya.
- source_word: θανάτου
  choice: ọnwụ
  rationale: Genitive a na-egosi ihe ikpe ahụ ruru—ọnwụ. ‘O kwesịrị ọnwụ’ bụ okwu Igbo dị mkpirikpi ma dịkwa ebumpụta ụwa maka mkpebi ọnwụ.
- source_word: ἐστίν
  choice: O
  rationale: Igbo anaghị achọ ka e kewaa copula a dịka Bekee si eme; ‘O kwesịrị’ na-enye isiokwu ahụ na nkwupụta zuru ezu.
theological_decisions:
- issue: Ike mkpebi ikpe nke ndị kansụl
  choice: O kwesịrị ọnwụ
  alternative: Ikpe ọnwụ mara ya / O bụ onye ikpe ọnwụ ji
  rationale: Nke a na-edekọ mkpebi ndị kansụl banyere Jizọs n’asụsụ ikpe, ọ bụghị nkwupụta onye ntụgharị banyere ikpe ọmụma ya n’ihu Chineke. Nhọrọ a na-echekwa ọdịiche ahụ ma na-ada ka Igbo ugbu a.
translation_notes:
  register: Standard Igbo; okwu ndị dị ugbu a, dị ùgwù, dịkwa mfe nghọta. E ji ‘unu’ chekwaa plural nke ὑμῖν. Akara nkọwa [a] dị n’ederede isi ozugbo n’azụ ‘zara’ dịka n’usoro enyere.
