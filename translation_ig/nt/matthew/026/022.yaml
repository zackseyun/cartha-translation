    issue: Placement of “n’otu n’otu” and the vocative
    rationale: In the draft, “n’otu n’otu” immediately follows “ya,” and “Onyenwe anyị” interrupts the negative question. Reordering them more naturally clarifies that each disciple spoke in turn and that the address is vocative, while preserving the Greek sense.
