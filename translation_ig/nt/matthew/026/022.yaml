  verdict: revise
  source_fidelity: The draft conveys the disciples’ intense grief, the ingressive sense of “began to say,” the distributive response, and the negative-answer expectation of μήτι. The indirect object “ya” and the address “Onyenwe anyị” appropriately represent αὐτῷ and κύριε.
  naturalness: The wording is generally clear Standard Igbo. Moving the distributive phrase next to the responding disciples and placing the vocative at the end makes the question and sequence more idiomatic and immediately clear.
  terminology: “Onyenwe anyị” is an appropriate established rendering of κύριε when addressing Jesus. “Obi wutere ha nke ukwuu” is natural for λυπούμενοι σφόδρα. The question should retain its negative expectation without implying a different speaker or adding interpretive content.
  issues:
