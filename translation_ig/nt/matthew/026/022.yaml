  text: καὶ λυπούμενοι σφόδρα ἤρξαντο λέγειν αὐτῷ ⸂εἷς ἕκαστος⸃· Μήτι ἐγώ εἰμι, κύριε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/022.yaml
  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: ig
  text: Obi wutere ha nke ukwuu, ha wee malite ịsị ya, onye ọ bụla n’ime ha[a], “Ọ bụghị m ka ọ bụ, Onyenwe anyị?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’otu n’otu” / “otu onye soro ibe ya.”
    reason: lexical_alternative
  - marker: b
    text: 'Ajụjụ Grik jiri μήτι, bụ okwu na-atụ anya azịza na-adịghị mma: “Ọ bụghị m ka ọ bụ, Onyenwe anyị?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: Obi wutere ha nke ukwuu
  rationale: Nkebi okwu a na-egosi mwute dị ukwuu nke nọgidere na-emetụta ha; okwu Igbo a bụ nke a na-aghọta ngwa ngwa ma na-edowe ike σφόδρα.
- source_word: ἤρξαντο λέγειν αὐτῷ
  choice: ha wee malite ịsị ya
  rationale: “Malite ịsị” na-edowe echiche mmalite dị na ἤρξαντο λέγειν, ebe “ya” na-anọchi dative αὐτῷ n'ụzọ Igbo si ekwu ya.
- source_word: εἷς ἕκαστος
  choice: n’otu n’otu
  rationale: Nke a na-egosi na onye ọ bụla zara n’usoro, ma na-ada ka Igbo nkịtị.
- source_word: Μήτι ἐγώ εἰμι
  choice: Ọ bụghị m ... ka ọ bụ?
  rationale: Ajụjụ Igbo a na-atụ anya azịza na-adịghị mma, dị ka μήτι si eme na Grik, ma na-edowe nkwusi ike dị n’ἐγώ.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: Aha a na-edowe ibu okwu κύριε mgbe a na-akpọ Jizọs, kama ime ka ọ bụrụ naanị okwu nkwanye ùgwù.
theological_decisions:
- issue: Nsụgharị κύριε mgbe ndị na-eso ụzọ na-akpọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” na-edowe ma ọnọdụ Jizọs dị ka onye nwe ha ma ibu nkà mmụta okpukpe nke okwu ahụ nwere n’akụkọ Matiu, n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ajụjụ ahụ n’ụdị Igbo na-atụ anya na azịza ya ga-abụ mba; e tinyekwara akara nkọwa [a] n’ebe εἷς ἕκαστος dị, n’ihi na ọ bụ okwu nkọwa ahụ metụtara.
