  text: Οἱ δὲ κρατήσαντες τὸν Ἰησοῦν ἀπήγαγον πρὸς Καϊάφαν τὸν ἀρχιερέα, ὅπου οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι συνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: ig
  text: Ndị jidere Jizọs duuru ya gakwuru Kaịfas, onyeisi nchụàjà, ebe ndị odeakwụkwọ na ndị okenye gbakọtarala[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a kpọkọtara ha.” N’ebe a, ngwaa Grik ahụ nwere ike ịpụta na ha onwe ha agbakọtala, ma ọ bụ na a kpọkọtara ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Ndị
  rationale: Aha njirimara ahụ na participle na-arụkọ ọrụ dị ka ‘ndị ahụ’; a hapụrụ δέ ka usoro akụkọ n’Igbo wee na-aga nke ọma n’etinyeghị okwu na-egosi mmegide siri ike.
- source_word: κρατήσαντες
  choice: jidere
  rationale: Ọ na-egosi na ha buru ụzọ jide Jizọs tupu ha eduru ya pụọ; ‘jidere’ na-echekwa echiche nke ijide mmadụ n’aka n’etinyeghị nkọwa iwu karịrị nke Grik.
- source_word: ἀπήγαγον
  choice: duuru ya gaa
  rationale: Nke a na-egosi iduru onye a na-ejide pụọ gaa n’ebe ọzọ n’asụsụ Igbo doro anya.
- source_word: πρὸς Καϊάφαν
  choice: gaa n’ebe Kaịfas ... nọ
  rationale: πρός na-egosi ije n’ebe mmadụ nọ. Nhazi a bụ Igbo e ji ekwu okwu nke ọma, ma ọ naghị atụkwasị ‘ụlọ Kaịfas’ nke isi mmalite na-ekwughị.
- source_word: τὸν ἀρχιερέα
  choice: onyeisi nchụàjà
  rationale: Nke a bụ aha ọkwa doro anya maka nnukwu onye nchụàjà n’ọnọdụ a.
- source_word: ὅπου
  choice: ebe
  rationale: Ọ na-echekwa njikọ ebe dị mfe nke okwu Grik.
- source_word: οἱ γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nke a na-echekwa aha otu ndị ọkachamara n’iwu na okpukpe ahụ n’ụzọ ọdịnala, kama ịgbanwe ya ka ọ bụrụ nkọwa ọrụ naanị.
- source_word: οἱ πρεσβύτεροι
  choice: ndị okenye
  rationale: Nke a bụ okwu Igbo ziri ezi maka ndị isi a ma ama n’etiti ndị Juu.
- source_word: συνήχθησαν
  choice: gbakọtarala
  rationale: Ụdị a na-egosi na ha agbakọtala tupu e duru Jizọs ruo ebe ahụ. Ọ na-enye echiche intransitive nke sitere n’ụdị passive Grik, ebe a ka na-edebe ụzọ ọzọ na nkọwa ala peeji.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere aha ndị ọrụ okpukpe dịka ‘onyeisi nchụàjà,’ ‘ndị odeakwụkwọ,’ na ‘ndị okenye,’ ma zere ịgbakwunye na a kpọgara Jizọs n’ụlọ Kaịfas ebe Grik kwuru naanị na a kpọgara ya n’ebe Kaịfas nọ.
