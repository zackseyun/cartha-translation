  text: For this could have been sold for a great deal and given to the poor[a].
translation:
  language: ig
  text: N’ihi na a gaara ere nke a n’ọnụ ahịa dị ukwuu ma nye ndị ogbenye[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ‘n’ọnụ ahịa dị ukwuu’ dịka ‘maka nnukwu ego’ ma ọ bụ ‘n’ọtụtụ ego.’ Okwu Grik ahụ na-egosi ọnụ ahịa e ji ere ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: a gaara
  rationale: Ọ na-egosi ihe e nwere ike ime n’oge gara aga ma a naghị eme ya; usoro a bụ ụzọ Igbo si ekwu ọnọdụ dị otú ahụ n'ụzọ ebumpụta ụwa.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejigide ọrụ okwu a dị ka nkọwa nke mkpesa e kwuru tupu ya.
- source_word: τοῦτο
  choice: nke a
  rationale: Ọ na-ejigide okwu ntụaka ahụ n’etinyeghị aha ihe ahụ n’amaokwu a.
- source_word: πραθῆναι
  choice: ere
  rationale: Ọ na-egosi ire ihe ahụ; njikọ ya na ‘a gaara’ na-enye echiche nke ihe a pụrụ ime ma a naghị eme ya.
- source_word: πολλοῦ
  choice: n’ọnụ ahịa dị ukwuu
  rationale: Ọ na-egosipụta genitive nke ọnụ ahịa, ya bụ na a pụrụ ire ya maka nnukwu ego, n’asụsụ Igbo doro anya.
- source_word: δοθῆναι
  choice: nyekwa ndị ogbenye ego ya
  rationale: N’Igbo, ịsị na e nyere ndị ogbenye ‘ego ya’ na-eme ka usoro omume ahụ—ire ihe ahụ ma nye ego e nwetara—doo anya n’enweghị mgbanwe n’isi ihe okwu Grik pụtara.
- source_word: πτωχοῖς
  choice: ndị ogbenye
  rationale: Ọ bụ aha mkpokọta ebumpụta ụwa n’Igbo maka ndị dara ogbenye.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘N’ọnụ ahịa dị ukwuu’ na-egosipụta πολλοῦ nke bụ genitive nke ọnụ ahịa; e tinyere ‘ego ya’ n’ahịrị isi iji mee ka Igbo bụrụ nke ebumpụta ụwa, ebe nkọwa ala peeji na-echekwa usoro dị nkenke nke Grik.
