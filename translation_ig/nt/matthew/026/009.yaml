  to: N’ihi na a gaara ere nke a n’ọnụ ahịa dị ukwuu ma nye ndị ogbenye[a].
  rationale: 'The revision removes the unstated ‘ego ya’ so that the Igbo preserves the Greek’s ellipsis after ‘given,’ while retaining a natural coordinated construction. The footnote is revised to address the actual lexical issue: πολλοῦ as the price for which the item could have been sold.'
