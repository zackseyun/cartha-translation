id: MAT.26.64
reference: Matthew 26:64
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: ig
  text: Jizọs sịrị ya, “Ị kwuru ya.[a] Ma ana m agwa unu,[b] malite ugbu a, unu ga-ahụ Nwa nke Mmadụ ka ọ nọ ọdụ n’aka nri nke Ike, na-abịakwa n’elu igwe ojii nke eluigwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ bụ gị kwuru ya.” Okwu Grik a bụ ụzọ e si aza n’ụzọ nkwenye.
    reason: lexical_alternative
  - marker: b
    text: Nke a na-ezo aka na Daniel 7:13 na Abụ Ọma 110:1. “Ike” bụ ụzọ nkwanye ùgwù e si ezo aka na Chineke.
    reason: cross_reference_and_cultural_note
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: Ọ bụ gị kwuru ya
  rationale: Nke a na-edowe usoro okwu Grik ahụ ma na-arụkwa ọrụ dịka nkwenye n'ụzọ na-abụghị ‘Ee’ nkịtị; ọ naghị eme ka azịza ahụ bụrụ nke na-agbanahụ ajụjụ.
- source_word: πλὴν
  choice: Ma
  rationale: Ọ na-egosi ntụgharị okwu siri ike gaa ná nkwupụta dị nsọ nke na-esote, ma bụrụkwa okwu Igbo dị mfe ma kwekọọ n’ụzọ ebumpụta okwu ahụ.
- source_word: ἀπ’ ἄρτι
  choice: malite ugbu a
  rationale: Ọ na-egosi na ọnọdụ ọhụrụ ahụ na-amalite site n’oge a gaa n’ihu, n’enweghị ịmanye ya ka ọ bụrụ naanị ihe ga-eme ozugbo n’otu ntabi anya.
- source_word: ὄψεσθε
  choice: unu ga-ahụ
  rationale: Ọ bụ ntụgharị kwụ ọtọ ma dị ndụ nke ọdịnihu nke ὁράω; ọtụtụ ‘unu’ dakọtara na ụdị mmadụ nke abụọ ọtụtụ dị na Grik.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Ọ na-edobe aha a maara nke ọma na njikọ ya na Daniel 7, kama ịgbanwe ya ka ọ bụrụ naanị okwu izugbe banyere mmadụ.
- source_word: καθήμενον
  choice: ka ọ nọ ọdụ
  rationale: Ọ na-akọwa ọnọdụ ịnọ n’oche n’ụzọ Igbo ebumpụta ụwa ma ka na-enye ohere ka ihe oyiyi nke ịbụ e buliri elu na ịchị achị pụta ìhè site n’ọnọdụ okwu ahụ.
- source_word: ἐκ δεξιῶν
  choice: n’aka nri nke
  rationale: Nke a bụ akpaala okwu Akwụkwọ Nsọ a na-aghọta n’Igbo maka ọnọdụ nsọpụrụ, ikike, na ịdị nso.
- source_word: τῆς δυνάμεως
  choice: Ike
  rationale: Iji mkpụrụedemede ukwu edobe ya dịka aha nkwanye ùgwù e ji zere ịkpọ Chineke kpọmkwem, n’agbanyeghị na ‘ike’ n’onwe ya bụ aha nkịtị n’Igbo.
- source_word: ἐρχόμενον
  choice: na-abịakwa
  rationale: Ọ na-edobe participle nke abụọ na njikọ ya na ịnọ ọdụ, yana nkwughachi Daniel 7; ‘-kwa’ na-egosi na ihe oyiyi abụọ ahụ jikọrọ ọnụ.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: n’elu igwe ojii nke eluigwe
  rationale: Ọ na-edobe ihe oyiyi nke ịbịa n’elu igwe ojii na njikọ okwu ya na Daniel 7:13, n’ụzọ Igbo doro anya.
theological_decisions:
- issue: Ike azịza Jizọs bụ Σὺ εἶπας
  choice: Ọ bụ gị kwuru ya—azịza na-ekwenye, ma na-edobe kpọmkwem ụdị okwu Jizọs ji zaa.
  alternative: Ịsụgharị ya naanị dịka “Ee,” ma ọ bụ were ya dịka azịza na-agbanahụ ajụjụ.
  rationale: Akpaala okwu Grik ahụ bụ nkwenye, ma ‘Ee’ ga-ehichapụ ụdị okwu pụrụ iche ahụ; ile ya anya dịka ịgbanahụ ajụjụ ga-eme ka nkwenye dị n’ọnọdụ ahụ daa mbà.
- issue: Onye ‘Ike’ (τῆς δυνάμεως) na-anọchi anya ya
  choice: Edobere ‘Ike’ dịka ụzọ nkwanye ùgwù e si ezo aka na Chineke.
  alternative: Ịsụgharị ya kpọmkwem dịka “Chineke” ma ọ bụ “Onye Pụrụ Ime Ihe Niile.”
  rationale: Ihe odide ahụ yiri ka ọ na-eji aha nkwanye ùgwù dochie ịkpọ Chineke kpọmkwem. ‘Ike’ na-edobe njide onwe nke isi mmalite ahụ, ebe nkọwa ala peeji na-eme ka ihe ọ pụtara doo anya.
- issue: Oge na oke nke ‘unu ga-ahụ’
  choice: E jikọtara ịnọ ọdụ n’aka nri nke Ike na ịbịa n’elu igwe ojii, n’enweghị ịhọpụta otu usoro oge naanị.
  alternative: Ime ka ihe niile bụrụ naanị mmezu dị nso, ma ọ bụ naanị ọbịbịa nke abụọ n’ọdịnihu dị anya.
  rationale: Grik ahụ na-etinye participle abụọ ahụ ọnụ dịka ihe ha ga-ahụ. Nsụgharị ahụ kwesịrị idebe esemokwu na ụba nke nkwughachi Daniel 7 na Abụ Ọma 110:1 kama idozi arụmụka banyere oge.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. E ji ‘unu’ gosipụta ọtụtụ mmadụ nke ὑμῖν/ὄψεσθε. E jikọtara nkọwa nkwughachi Akwụkwọ Nsọ na nkọwa ‘Ike’ n’otu akara [b] ka akara niile dị n’ahụ ederede kwekọọ kpọmkwem na nkọwa ala peeji.
