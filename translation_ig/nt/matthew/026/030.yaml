  yaml_path: translation/nt/matthew/026/030.yaml
  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: ig
  text: Mgbe ha bụsịrị abụ[a], ha pụrụ gaa n’Ugwu Oliv.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ha bụsịrị abụ otuto.” Ngwaa Grik a pụrụ ịpụta ịbụ abụ otuto n’ozuzu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσαντες
  choice: Mgbe ha bụsịrị abụ otuto nye Chineke
  rationale: Nke a na-egosipụta participle aorist dị ka ihe ha mezuru tupu ha apụ, ma na-ebupụkwa echiche ὑμνέω nke ịbụ abụ otuto. Ịsị ‘nye Chineke’ na-eme ka Igbo doo anya n’ụzọ kwekọrọ n’echiche ngwaa ahụ.
- source_word: ἐξῆλθον
  choice: ha pụrụ gaa
  rationale: ‘Ha pụrụ’ na-egosipụta ịpụ, ebe ‘gaa’ na-ejikọta ya n’ụzọ Igbo nkịtị na ebe ha na-aga.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: n’Ugwu Oliv
  rationale: Nke a na-eji aha ebe a maara nke ọma n’Igbo, ma na-echekwa ὄρος dị ka ‘Ugwu’ na ἐλαιῶν dị ka ‘Oliv.’
- source_word: καὶ
  choice: Mgbe … gasịrị
  rationale: Ọ bụ ezie na καί bụ njikọ dị mfe, usoro participle na ngwaa ukwu na-egosi na ịbụ abụ ahụ buru ụzọ mee; nhazi ‘Mgbe … gasịrị’ bụ Igbo eke nke na-echekwa usoro omume ahụ.
