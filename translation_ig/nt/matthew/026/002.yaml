- from: Unu maara na mgbe ụbọchị abụọ gasịrị, a ga-eme Emume Ngabiga, a ga-enyefekwa Nwa nke Mmadụ ka a kpọgide ya n’obe.[a]
  to: Unu maara na mgbe ụbọchị abụọ gasịrị, a ga-eme Ememme Ngabiga, a ga-enyefe Nwa nke Mmadụ ka a kpọgide ya n’obe.[a]
  rationale: The revision removes an unsupported additive nuance and adopts the more customary festival term, while preserving the source’s temporal wording, the broad ambiguity of παραδίδοται, and the purpose expression for crucifixion.
