review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the plural address, the temporal phrase, Passover, the Son of Man title, and crucifixion. However, the enclitic -kwọ in “a ga-enyefekwa” adds ‘also/as well,’ whereas καί simply coordinates the clauses; removing it more closely reflects the source without adding emphasis.
  naturalness: “Mgbe ụbọchị abụọ gasịrị” and “ka a kpọgide ya n’obe” are clear Standard Igbo. “Ememme Ngabiga” is the more customary natural designation for the Passover festival in this register.
  terminology: “Nwa nke Mmadụ” appropriately preserves the established biblical title. “A ga-enyefe” retains the broader sense of παραδίδοται; the footnote properly records ‘betrayed’ as an alternative.
  issues:
  - severity: low
    issue: The translation uses “a ga-enyefekwa.”
    rationale: The suffix -kwa adds an ‘also/as well’ nuance not present in the Greek conjunction καί. A plain coordinated clause avoids this small addition.
  - severity: low
    issue: “Emume Ngabiga” is less idiomatic than “Ememme Ngabiga” for the festival.
    rationale: “Ememme Ngabiga” is a more customary Standard Igbo expression for Passover and retains the same meaning.
  revised_text: Unu maara na mgbe ụbọchị abụọ gasịrị, a ga-eme Ememme Ngabiga, a ga-enyefe Nwa nke Mmadụ ka a kpọgide ya n’obe.[a]
  revised_footnotes:
