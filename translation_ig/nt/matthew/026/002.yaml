  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: ig
  text: Unu maara na mgbe ụbọchị abụọ gasịrị, a ga-eme Ememme Ngabiga, a ga-enyefe Nwa nke Mmadụ ka a kpọgide ya n’obe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a ga-arara ya nye.” Ngwaa Grik ahụ nwere ike ịpụta ịrara mmadụ nye, ma n'ụzọ sara mbara ọ pụtara inyefe mmadụ n'aka ndị ọzọ.
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: Unu maara
  rationale: Ngwaa a dị n'ụdị onye nke abụọ, ọtụtụ, ma nwee nghọta nke oge ugbu a; ‘Unu maara’ bụ ụzọ Igbo doro anya ma kwekọọ na isi mmalite.
- source_word: μετὰ δύο ἡμέρας
  choice: mgbe ụbọchị abụọ gasịrị
  rationale: μετά na accusative na-egosi oge, ya bụ ‘mgbe ụbọchị abụọ gasịrị’; nke a na-edobe nhazi okwu Grik n'Igbo dị mfe nghọta.
- source_word: τὸ πάσχα
  choice: Emume Ngabiga
  rationale: πάσχα na-ezo aka na Ngabiga; ‘Emume Ngabiga’ na-eme ka ihe a na-ekwu doo onye Igbo nke oge a anya n'enweghị ịgbakwunye nkọwa ozizi.
- source_word: γίνεται
  choice: a ga-eme
  rationale: N'ọnọdụ a γίνομαι na-ekwu maka emume nke ga-ewere ọnọdụ n'oge na-adịghị anya; ‘a ga-eme’ bụ Igbo ebumpụta ụwa ma na-egosipụta ihe na-abịa.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-edobe aha Jizọs ji akọwa onwe ya na ụda Akwụkwọ Nsọ ya, n'emeghị ya nkọwa ọzọ.
- source_word: παραδίδοται
  choice: a ga-enyefekwa
  rationale: Ọ bụ passive nke na-egosi ihe na-eru nso. ‘A ga-enyefe’ na-edobe nghọta sara mbara nke inyefe mmadụ n'aka ndị ọzọ, kama imechi ya naanị n'ịrara mmadụ nye.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: ka a kpọgide ya n’obe
  rationale: εἰς tinyere infinitive a na-egosi nzube ma ọ bụ ihe ga-esi na ya pụta; okwu Igbo a na-egosipụta ya n'ụzọ doro anya.
theological_decisions:
- issue: Otú e si sụgharị παραδίδοται n'amụma ahụhụ Jizọs
  choice: a ga-enyefe
  alternative: a ga-arara nye
  rationale: Ọnọdụ ahụ gụnyere nrara Judas, ma ngwaa Grik ahụ sara mbara karịa nrara nye naanị. ‘A ga-enyefe’ na-ahapụ esemokwu na omimi dị n'etiti omume mmadụ na inyefe ahụ n'usoro ihe ga-eme, n'emeghị ka otu nkọwa merie ibe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Unu’ na-egosi na Jizọs na-agwa ọtụtụ ndị okwu. Ahịrịokwu ahụ na-edobe amụma ọdịnihu nke ọnọdụ ahụ, ebe ‘-kwá’ na-ejikọta akụkụ abụọ ahụ dịka καί si eme.
