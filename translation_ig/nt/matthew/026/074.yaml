    text: Ma ọ bụ, n’ụzọ ka nso n’okwu Grik, “ọ malitere ịkpọ ọbụbụ ọnụ na ịṅụ iyi.” O yikarịrị ka ọ na-akpọ ọbụbụ ọnụ ka ọ dakwasị onwe ya ma ọ bụrụ na ihe ọ na-ekwu abụghị eziokwu, iji mee ka ịgọnahụ ahụ sie ike.
    reason: lexical_alternative
