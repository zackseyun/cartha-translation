revisions:
- from: Mgbe ahụ, ọ malitere ịkpọpụta ọbụbụ ọnụ na ịṅụ iyi[a] sị, “Amaghị m nwoke ahụ.” Ozugbo ahụkwa, oke ọkụkọ bere akwa.
  to: 'Mgbe ahụ, ọ malitere ịkpọ ọbụbụ ọnụ na ịṅụ iyi[a], sị: “Amaghị m nwoke ahụ.” Ozugbo ahụkwa, oke ọkụkọ kwara akwa.'
  rationale: The revisions improve idiomatic Standard Igbo while retaining the source text’s wording and ambiguity. The main text says only that Peter invoked curses and swore; the footnote appropriately presents self-imprecation as likely in this oath context rather than as an explicit assertion of the Greek text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:33Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the sequence, Peter’s escalation ('began'), the paired acts of invoking curses and swearing, the denial, and the immediate rooster-crow. The principal adjustment is to replace "ịkpọpụta ọbụbụ ọnụ," whose verb can suggest bringing/putting something forth, with the more direct and idiomatic "ịkpọ ọbụbụ ọnụ." This retains the Greek ambiguity about the object of the curses; the footnote may identify self-imprecation as the likely contextual sense without presenting it as explicit in the text.
  naturalness: '"Mgbe ahụ" and "Ozugbo ahụkwa" are natural Standard Igbo narrative connectors. "Oke ọkụkọ kwara akwa" is the idiomatic expression for a rooster’s crow and is preferable to "bere akwa," which is less apt here. A colon after "sị" makes the direct quotation read smoothly.'
  terminology: '"Ịṅụ iyi" accurately conveys oath-taking. "Nwoke ahụ" suitably reflects τὸν ἄνθρωπον in this context. "Ịkpọ ọbụbụ ọnụ" conveys καταθεματίζειν without implying profanity or stating in the main text that Peter cursed Jesus or necessarily himself.'
  issues:
  - severity: medium
    issue: '"ịkpọpụta ọbụbụ ọnụ" is not the clearest idiomatic rendering.'
    rationale: '"kpọpụta" commonly carries the sense of bring out, produce, or call forth. "ịkpọ ọbụbụ ọnụ" directly expresses invoking/uttering curses and better preserves the source’s ambiguity concerning their target.'
  - severity: medium
    issue: '"oke ọkụkọ bere akwa" is less idiomatic for a rooster’s call.'
    rationale: In Standard Igbo, a rooster conventionally "kwara akwa." This precisely conveys ἐφώνησεν in the animal-specific context.
  - severity: low
    issue: The footnote’s final pronoun in "ịgọnahụ ya" may be referentially unclear.
    rationale: '"ịgọnahụ ahụ" clearly refers to the denial itself and does not alter the stated interpretive possibility.'
  revised_text: 'Mgbe ahụ, ọ malitere ịkpọ ọbụbụ ọnụ na ịṅụ iyi[a], sị: “Amaghị m nwoke ahụ.” Ozugbo ahụkwa, oke ọkụkọ kwara akwa.'
  revised_footnotes:
