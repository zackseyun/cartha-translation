  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: ig
  text: 'Mgbe ahụ, ọ malitere ịkpọ ọbụbụ ọnụ na ịṅụ iyi[a], sị: “Amaghị m nwoke ahụ.” Ozugbo ahụkwa, oke ọkụkọ kwara akwa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ka nso n’okwu Grik, “ọ malitere ịkpọ ọbụbụ ọnụ na ịṅụ iyi.” O yikarịrị ka ọ na-akpọ ọbụbụ ọnụ ka ọ dakwasị onwe ya ma ọ bụrụ na ihe ọ na-ekwu abụghị eziokwu, iji mee ka ịgọnahụ ahụ sie ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Na-egosi ihe mere n’usoro ozugbo ihe bu ya ụzọ gasịrị, n’Igbo dị mfe ma kwụ ọtọ.
- source_word: ἤρξατο
  choice: ọ malitere
  rationale: Na-echekwa mmalite na ịrị elu nke omume Pita.
- source_word: καταθεματίζειν
  choice: ịkpọpụta ọbụbụ ọnụ
  rationale: Na-egosi ịkpọ ọbụbụ ọnụ n’ụzọ siri ike, ọ bụghị nanị ikwu okwu rụrụ arụ; a hapụrụ onye ọbụbụ ọnụ ahụ ga-adakwasị n’amaghị ama dịka Grik si dị.
- source_word: ὀμνύειν
  choice: ịṅụ iyi
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa iyi iyi iji mee ka nkwupụta sie ike.
- source_word: ὅτι
  choice: sị
  rationale: Na-ewebata okwu Pita kwuru kpọmkwem n’ụzọ Igbo si ekwu ya.
- source_word: Οὐκ οἶδα
  choice: Amaghị m
  rationale: Nsụgharị kwụ ọtọ nke nkwupụta na ọ maghị ma ọ bụ na ọ naghị amata onye ahụ.
- source_word: τὸν ἄνθρωπον
  choice: nwoke ahụ
  rationale: Na-echekwa ntụaka kpọmkwem nye Jizọs dịka ‘nwoke ahụ,’ na-etinyeghị ‘nwoke a.’
- source_word: καὶ εὐθέως
  choice: Ozugbo ahụkwa
  rationale: Na-egosi na mkpu oke ọkụkọ sochiri ozugbo, ma na-echekwa njikọ καί.
- source_word: ἀλέκτωρ
  choice: oke ọkụkọ
  rationale: Okwu Igbo nkịtị maka rooster.
- source_word: ἐφώνησεν
  choice: bere akwa
  rationale: Nke a bụ ụzọ Igbo si akọ ụda anụmanụ, gụnyere mkpu oke ọkụkọ, n’ụzọ ebumpụta ụwa.
theological_decisions:
- issue: Ihe καταθεματίζειν pụtara n’ịgọnahụ Pita
  choice: ịkpọpụta ọbụbụ ọnụ
  alternative: ịkpọ ọbụbụ ọnụ ka ọ dakwasị onwe ya; ma ọ bụ ịkọcha mmadụ
  rationale: N’ihi na okwu a jikọtara ya na ịṅụ iyi, o nwere ike ịbụ ọbụbụ ọnụ e ji akwado iyi ahụ, ma Grik ekwughị hoo haa onye ọ ga-adakwasị. Ya mere, isi ederede echekwala nghọtahie a; nkọwa ala peeji na-akọwa ihe a na-ele anya na ọ pụtara n’ọnọdụ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Ịkpọpụta ọbụbụ ọnụ’ na-echekwa ịdị arọ nke okwu ahụ n’enweghị ịkọwa ya dịka okwu rụrụ arụ ma ọ bụ ikwu na Pita kọchara Jizọs. Ihe nrịbama [a] dị n’isi ederede ma kwekọọ na nkọwa ala peeji.
