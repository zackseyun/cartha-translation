  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: ig
  text: Pita sịrị ya, “Ọ bụrụgodị na aghaghị m iso gị nwụọ, agaghị m agọnahụ gị ma ọlị.”[a] N'otu aka ahụ, ndị na-eso ụzọ niile kwukwara otu ihe ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Agaghị m agọnahụ gị mgbe ọ bụla.” Grik ji nkwụsi ike siri ike (οὐ μή).
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a nke akụkọ, oge gara aga bụ ụzọ Igbo nkịtị si akọ ihe mere n’akụkọ.
- source_word: Κἂν
  choice: Ọ bụrụgodị na
  rationale: 'Nke a na-egosipụta ọnọdụ nnabata siri ike: ọbụna ma ọnọdụ ahụ emee.'
- source_word: δέῃ με σὺν σοὶ ἀποθανεῖν
  choice: mụ na gị aghaghị ịnwụ
  rationale: “Aghaghị” na-ebupụta echiche nke ịdị mkpa, ebe “mụ na gị” na-egosipụta iso Jizọs nwụọ.
- source_word: οὐ μή ... ἀπαρνήσομαι
  choice: agaghị m agọnahụ gị ma ọlị
  rationale: “Ma ọlị” na-eme ka nkwughachi ahụ sie ike dịka οὐ μή si eme, n’enweghị ịgbanwe ya ka ọ bụrụ nkọwa ozizi.
- source_word: ὁμοίως καὶ
  choice: kwukwara otu ihe ahụ
  rationale: Nke a na-egosipụta ma “n’otu aka ahụ” ma echiche mgbakwunye dị na καί n’Igbo dị ire ụtọ.
- source_word: πάντες οἱ μαθηταὶ
  choice: ndị na-eso ụzọ ya niile
  rationale: “Ndị na-eso ụzọ” bụ okwu Igbo doro anya maka μαθηταί; “ya” na-eme ka ntụaka ahụ doo anya n’Igbo, ọ bụ ezie na ọnọdụ okwu Grik na-eme ka onye ha na-eso pụta ìhè.
theological_decisions:
- issue: Ike nkwupụta Pita na οὐ μή
  choice: “agaghị m agọnahụ gị ma ọlị”
  alternative: “agaghị m agọnahụ gị mgbe ọ bụla”
  rationale: Nhọrọ a na-echekwa nkwusi ike nke nkwugharị Grik ma na-ahapụ esemokwu dị n’etiti obi ike Pita na ihe ga-eme n’akụkọ ahụ, n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Asụsụ Igbo Standard dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. E ji “Ọ bụrụgodị,” “aghaghị,” na “ma ọlị” chekwaa nkwusi ike nke okwu Pita n’enweghị asụsụ siri ike nghọta.
