revisions:
- from: Pita sịrị ya, “Ọ bụrụgodị na mụ na gị aghaghị ịnwụ, agaghị m agọnahụ gị ma ọlị.”[a] Ndị na-eso ụzọ ya niile kwukwara otu ihe ahụ.
  to: Pita sịrị ya, “Ọ bụrụgodị na aghaghị m iso gị nwụọ, agaghị m agọnahụ gị ma ọlị.”[a] N'otu aka ahụ, ndị na-eso ụzọ niile kwukwara otu ihe ahụ.
  rationale: The revision makes Peter, rather than Peter and Jesus together, the person who may need to die, while retaining the accompaniment expressed by σὺν σοὶ. It also states the force of ὁμοίως explicitly and removes an unexpressed possessive. The emphatic future denial and its footnote alternative are retained without adding theological interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:04Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter's emphatic conditional declaration and the disciples' corresponding statement. However, “mụ na gị aghaghị ịnwụ” makes both persons the grammatical subject of “must die,” whereas the Greek specifically says that Peter may need to die in Jesus' company. The possessive “ya” with “ndị na-eso ụzọ” is contextually understandable but is not expressed in the Greek.
  naturalness: The language is generally natural Standard Igbo. “Ọ bụrụgodị na aghaghị m iso gị nwụọ” is both more idiomatic and more precise for the Greek construction. Explicitly rendering ὁμοίως with “N'otu aka ahụ” avoids leaving its comparative force only implicit.
  terminology: “Agọnahụ” appropriately renders ἀπαρνήσομαι in this narrative context, and “ma ọlị” naturally preserves the force of οὐ μή. “Ndị na-eso ụzọ” is an established and clear rendering of μαθηταί.
  issues:
  - severity: medium
    issue: The conditional clause does not precisely represent Peter as the one who may have to die with Jesus.
    rationale: δέῃ με ... ἀποθανεῖν has “me” as the subject of the infinitive, while σὺν σοὶ means “with you.” “Mụ na gị aghaghị ịnwụ” can instead read as “you and I must die.”
  - severity: low
    issue: The comparative adverb ὁμοίως is not explicit, and the possessive “ya” is added.
    rationale: “Kwukwara otu ihe ahụ” communicates the content, but “N'otu aka ahụ” directly represents ὁμοίως. The Greek has “all the disciples,” without an explicit possessive; omitting “ya” maintains closer equivalence.
  revised_text: Pita sịrị ya, “Ọ bụrụgodị na aghaghị m iso gị nwụọ, agaghị m agọnahụ gị ma ọlị.”[a] N'otu aka ahụ, ndị na-eso ụzọ niile kwukwara otu ihe ahụ.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “Agaghị m agọnahụ gị mgbe ọ bụla.” Grik ji nkwụsi ike siri ike (οὐ μή).
    reason: lexical_alternative
  revision_rationale: The revision makes Peter, rather than Peter and Jesus together, the person who may need to die, while retaining the accompaniment expressed by σὺν σοὶ. It also states the force of ὁμοίως explicitly and removes an unexpressed possessive. The emphatic future denial and its footnote alternative are retained without adding theological interpretation.
