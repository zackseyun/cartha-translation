  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: ig
  text: Ọ zara sị, “Onye mụ na ya tinyere aka n’efere nri, ọ bụ ya ga-arara m nye[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ga-enyefe m n'aka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ọ zara, sị
  rationale: Nke a na-egosipụta usoro okwu Grik nke pụtara ịza ma kwuo okwu, n’Igbo dị mma ma dị mfe nghọta.
- source_word: ἐμβάψας
  choice: tinyere
  rationale: N’ọnọdụ iri nri a, ọ na-egosi itinye aka n’efere; nhọrọ a bụ okwu Igbo nkịtị ma na-echekwa omume e ji amata onye ahụ.
- source_word: μετ’ ἐμοῦ
  choice: n’otu oge m tinyere nke m
  rationale: Nke a na-egosipụta ime ihe ahụ ọnụ na Jizọs n'ụzọ doro anya n’Igbo, ma zere echiche na ha ji otu aka.
- source_word: τὴν χεῖρα
  choice: aka ya
  rationale: Igbo na-eji nnọchiaha nwe ihe eme ka o doo anya na ọ bụ aka onye ahụ.
- source_word: ἐν τῷ τρυβλίῳ
  choice: n’efere nri
  rationale: τρύβλιον bụ efere ma ọ bụ nnukwu efere e ji etinye nri; “efere nri” bụ okwu sara mbara, doro anya n’Igbo.
- source_word: οὗτός
  choice: ọ bụ ya
  rationale: Nke a na-echekwa nkwusi ike nke nnọchiaha ngosi Grik ma na-ada nke ọma n’okwu Igbo.
- source_word: παραδώσει
  choice: ga-arara m nye
  rationale: N’ọnọdụ Judas na akụkọ ahụ, okwu a na-egosi inyefe Jizọs n’ụzọ aghụghọ; “arara m nye” na-ebute ihe ọnọdụ ahụ pụtara.
theological_decisions:
- issue: Nsụgharị παραδίδωμι n’ọnọdụ Judas
  choice: ga-arara m nye
  alternative: ga-enyefe m
  rationale: Ngwaa ahụ nwere ike ịpụta “inyefe,” ma ọnọdụ mmekọrịta na aghụghọ nke akụkọ a na-eme ka “ịrara nye” bụrụ ihe ọ pụtara ebe a. Ihe ọzọ dị nso n’ụdị okwu mbụ ka edobere n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A kọwara imekọ ihe ọnụ dị na μετ’ ἐμοῦ n’ụzọ eke n’Igbo, ebe a hapụrụ ike ngosi nke οὗτός na “ọ bụ ya.”
