revisions:
- from: Ọ zara, sị, “Onye ahụ nke tinyere aka ya n’efere nri n’otu oge m tinyere nke m—ọ bụ ya ga-arara m nye[a].”
  to: Ọ zara sị, “Onye mụ na ya tinyere aka n’efere nri, ọ bụ ya ga-arara m nye[a].”
  rationale: The revision replaces the temporal expression with an idiomatic reciprocal construction that accurately represents μετ’ ἐμοῦ. It retains the modern, dignified register, the emphatic “ọ bụ ya,” and the contextual rendering “ga-arara m nye.” The footnote preserves the less interpretive ‘hand over’ alternative clearly.
  reviewer_model: gpt-5.6-terra
