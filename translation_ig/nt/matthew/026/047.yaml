id: MAT.26.47
reference: Matthew 26:47
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: ig
  text: Mgbe ọ ka na-ekwu okwu, lee, Judas, otu n’ime mmadụ iri na abụọ ahụ, bịara; nnukwu ìgwè mmadụ ndị ji mma agha na mkpara[b] sokwa ya, nke sitere n’aka ndị isi nchụaja na ndị okenye nke ndị mmadụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị isi nchụaja na ndị okenye nke ndị mmadụ zitere ìgwè ahụ.” N’ụzọ nkịtị, Grik sịrị, “site n’aka ndị isi nchụaja na ndị okenye nke ndị mmadụ.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “osisi.” Okwu Grik ahụ pụtara iberibe osisi; n’ebe a, o yikarịrị ka ọ bụ mkpara e ji alụ ọgụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Mgbe ọ ka na-ekwu okwu
  rationale: Nkebiokwu a na-egosi na ọbịbịa ahụ mere n’otu oge ahụ Jizọs ka nọ na-ekwu okwu; “ka” na-egosipụta ἔτι n’Igbo nkịtị.
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” bụ akara okwu na-adọta uche onye na-agụ ma na-eme ka akụkọ ahụ dị ndụ, n’ebughị echiche ọzọ dị ka “na mberede” banye na ya.
- source_word: Ἰούδας
  choice: Judas
  rationale: Nke a bụ nsụgharị aha ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: εἷς τῶν δώδεκα
  choice: otu n’ime mmadụ iri na abụọ ahụ
  rationale: Ọ na-edobe okwu nkewa ahụ nke ọma ma mee ka o doo anya na a na-ekwu maka otu onye n’etiti mmadụ iri na abụọ a maara.
- source_word: ἦλθεν
  choice: bịara
  rationale: Nke a bụ ụzọ dị mfe ma kwụ ọtọ isi sụgharị ngwaa ọbịbịa ahụ.
- source_word: ὄχλος πολὺς
  choice: nnukwu ìgwè mmadụ
  rationale: Ọ na-egosi ọnụ ọgụgụ buru ibu n’ebughị okwu na-akọwa ìgwè ahụ dị ka ndị ọgba aghara, nke okwu Grik ahụ n’onwe ya ekwughị kpọmkwem.
- source_word: μετὰ μαχαιρῶν
  choice: bu mma agha
  rationale: “Mma agha” bụ okwu sara mbara ma doo anya maka ngwá agha μάχαιρα; “bu” na-egosi na ìgwè ahụ ji ha abịa.
- source_word: καὶ ξύλων
  choice: na mkpara
  rationale: N’ọnọdụ a, ξύλα bụ iberibe osisi e ji dị ka ngwá ọgụ; “mkpara” na-enye nghọta ahụ n’Igbo karịa ịsị naanị “osisi.”
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: si n’aka ndị isi nchụaja na ndị okenye nke ndị mmadụ bịa
  rationale: “Si n’aka” na-edobe echiche isi mmalite dị na ἀπό ma ghara itinye ngwaa doro anya nke iziga nke na-adịghị n’ederede Grik.
theological_decisions:
- issue: Ma a ga-ekwu hoo haa na ndị ndú ahụ zigara ìgwè mmadụ ahụ
  choice: si n’aka ndị isi nchụaja na ndị okenye nke ndị mmadụ bịa
  alternative: ndị isi nchụaja na ndị okenye nke ndị mmadụ zitere ha
  rationale: Ọnọdụ akụkọ ahụ na-egosi ikike ma ọ bụ ọrụ e nyere ìgwè ahụ, ma ἀπό pụtara isi mmalite, ọ bụghị ngwaa “zitere.” Ya mere, isi ederede na-ahapụ obere oghere nghọta ahụ dịka Grik si mee.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu abụọ na-eme ka usoro akụkọ ahụ doo anya n’Igbo, ebe “lee” ka na-edobe ike na ịdị ngwa nke akụkọ Grik. E tinyere akara nkọwa [a] n’ebe okwu banyere isi mmalite ìgwè ahụ dị, kama n’ebe okwu banyere ikwu okwu dị, ka akara ahụ kwekọọ n’ezi ọdịnaya nkọwa ya.
