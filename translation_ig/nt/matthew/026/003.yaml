id: MAT.26.3
reference: Matthew 26:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε συνήχθησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως τοῦ λεγομένου Καϊάφα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/003.yaml
  text: Then the chief priests and the elders of the people were gathered in the courtyard of the high priest[a], who was called Caiaphas[b],
translation:
  language: ig
  text: Mgbe ahụ, ndị isi nchụaja na ndị okenye nke ndị mmadụ zukọtara[a] n’ogige ụlọ[b] nke nnukwu onye nchụaja ahụ, onye a na-akpọ Kayafas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a kpọkọtara ha.” Ngwaa Grik ahụ dị n’ụdị passive.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a sụgharịrị “ogige ụlọ” nwekwara ike ịpụta ogige dị n’ime nnukwu ụlọ ma ọ bụ obí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ akara oge na-ejikọta ihe omume a na nke bu ya ụzọ; okwu a bụ nke okike ma doo anya n’Igbo.
- source_word: συνήχθησαν
  choice: zukọtara
  rationale: Ọ na-egosi na ndị ahụ gbakọtara n’otu ebe. Ọ bụ ezie na ngwaa Grik ahụ dị n’ụdị passive, Igbo nkịtị na-egosipụta echiche ahụ nke ọma site n’ụdị a.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Nke a na-ezo aka n’ọtụtụ ndị ndu nchụaja, ọ bụghị n’ọtụtụ ndị ji otu ọkwa pụrụ iche nke nnukwu onye nchụaja.
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: ndị okenye nke ndị mmadụ
  rationale: Ntụgharị a na-echekwa njikọ genitive dị n’asụsụ Grik ma na-ezo aka ná ndị ndu obodo a ma ama.
- source_word: εἰς τὴν αὐλὴν
  choice: n’ogige ụlọ
  rationale: N’ebe a, αὐλή bụ ogige dị n’ime ma ọ bụ n’akụkụ nnukwu ụlọ; n’Igbo, ‘ogige ụlọ’ na-enye nkọwa ahụ n’ụzọ doro anya na-enweghị ịkọwa ya dị ka obí eze.
- source_word: τοῦ ἀρχιερέως
  choice: nnukwu onye nchụaja ahụ
  rationale: Ọ bụ otu onye ji ọkwa kachasị elu n’etiti ndị nchụaja; ‘nnukwu onye nchụaja’ na-ekewa ya nke ọma na ‘ndị isi nchụaja.’
- source_word: τοῦ λεγομένου Καϊάφα
  choice: onye a na-akpọ Kayafas
  rationale: Nke a na-esochi participle Grik nke na-akọwa aha e ji mara nnukwu onye nchụaja ahụ; aha ahụ bụ ntụgharị mkpụrụokwu kwekọrọ n’usoro Igbo.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘nnukwu onye nchụaja’ maka otu onye ji ọkwa ahụ, ebe ‘ndị isi nchụaja’ na-anọchi ọtụtụ ndị ọchịchị nchụaja. Akara ntụaka ụkwụ abụọ dị n’ahịrịokwu n’ebe ha metụtara.
