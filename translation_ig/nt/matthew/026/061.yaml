id: MAT.26.61
reference: Matthew 26:61
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: ig
  text: Ha sịrị, “Nwoke a kwuru[b], ‘Enwere m ike ịkwatu ụlọ nsọ Chineke ma wulite ya n’ụbọchị atọ[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime ụbọchị atọ.” Nkebiokwu Grik ahụ nwere ike igosi na a ga-emecha ihe ahụ n’ime oge ụbọchị atọ ahụ.
    reason: lexical_alternative
  - marker: b
    text: Jọn 2:19–21 kọwara na okwu Jizọs kwuru banyere ụlọ nsọ ahụ na-ezo aka n’ahụ ya.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: Ha sịrị
  rationale: Oge aorist na-akọ okwu ndị akaebe ahụ dị ka ihe mere n’oge gara aga; ‘Ha sịrị’ bụ ụzọ Igbo dị mkpirikpi ma dịkwa eke isi webata ebubo ha.
- source_word: Οὗτος
  choice: Nwoke a
  rationale: N’ọnọdụ ikpe a, okwu a na-atụ aka n’ebe Jizọs nọ ma nwee ụda ebubo; ‘Nwoke a’ na-egosipụta nke ahụ n’Igbo nke ọma.
- source_word: ἔφη
  choice: kwuru
  rationale: Okwu a na-akọ nanị ihe e kwuru na Jizọs kwuru; ‘kwuru’ adịghị etinye ike ọzọ dị ka ‘kwusiri ike’ ma ọ bụ ‘zọọrọ.’
- source_word: Δύναμαι
  choice: Enwere m ike
  rationale: Nke a na-egosipụta ikike ime ihe, ma bụrụkwa okwu Igbo nkịtị kwekọrọ na ihe okwu Grik pụtara.
- source_word: καταλῦσαι
  choice: ịkwatu
  rationale: Mgbe a na-ekwu banyere ụlọ, okwu Grik a nwere ike ịpụta ịkwatu ma ọ bụ ibibi; ‘ịkwatu’ dabara nke ọma na ụlọ nsọ ma na-echekwa ihe oyiyi nke ụlọ a ga-ewulite ọzọ.
- source_word: ναὸν
  choice: ụlọ nsọ
  rationale: N’ebe a, ναός na-ezo aka n’ụlọ nsọ; ‘ụlọ nsọ’ bụ okwu Igbo doro anya ma ghara ime ka ọ bụrụ naanị otu akụkụ teknụzụ nke ụlọ ahụ.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: ‘Ụlọ nsọ Chineke’ na-egosipụta njikọ genitive ahụ n’ụzọ Igbo dị eke ma na-echekwa ụda ebubo ahụ.
- source_word: διὰ τριῶν ἡμερῶν
  choice: n’ụbọchị atọ
  rationale: Nkebiokwu a na-egosi oge ụbọchị atọ metụtara imecha ihe ahụ. ‘N’ụbọchị atọ’ na-echekwa okwu ahụ n’ụzọ dị mkpirikpi, ebe nkọwa ala peeji na-egosi nghọta nke imecha ya n’ime oge ahụ.
- source_word: οἰκοδομῆσαι
  choice: wulite ya
  rationale: ‘Wulite’ na-anọ nso na ‘ịrụ/wulite’ nke Grik karịa ‘wughachi,’ nke ga-akọwapụta echiche nke imegharị ihe e kwaturu. ‘Ya’ na-ezo azụ n’ụlọ nsọ ahụ n’ụzọ Igbo chọrọ.
theological_decisions:
- issue: Ihe ‘ụlọ nsọ Chineke’ na-ezo aka na ya n’ebubo ahụ
  choice: A sụgharịrị ebubo ahụ dịka ndị akaebe si kwuo ya, ya bụ, dị ka okwu banyere ụlọ nsọ a na-ahụ anya.
  alternative: Ime ka isiokwu ahụ pụta ozugbo n’ahịrịokwu bụ ahụ Jizọs na mbilite n’ọnwụ ya.
  rationale: Matiu 26:61 na-akọ ebubo ndị akaebe, ọ bụghị nkọwa onye dere Oziọma Jọn nyere. Ya mere, isi ederede ekwesịghị itinye nkọwa Jọn 2:19–21 n’ọnụ ndị akaebe; e debere njikọ ahụ n’ala peeji.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘ụlọ nsọ’ na ‘ịkwatu’ ka ebubo ahụ doo anya nye ndị na-agụ akwụkwọ nkịtị, ma a hapụrụ esemokwu dị n’etiti ebubo ndị akaebe na nkọwa Jọn ka ọ dị, kama idozi ya n’ime isi ederede.
