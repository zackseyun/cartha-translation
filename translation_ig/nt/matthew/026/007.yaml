  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: ig
  text: Otu nwanyị ji karama alabasta nke mmanụ na-esi ísì dị oke ọnụ ahịa[a] bịakwutere ya. Ọ na-awụsa mmanụ ahụ n’isi ya mgbe Jisọs nọ na-adina n’akụkụ tebụl[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “karama alabasta nke ude na-esi ísì dị oke ọnụ ahịa.” Okwu Grik bụ μύρον nwere ike ịpụta mmanụ na-esi ísì ma ọ bụ ude e ji ete ahụ, ọ bụghị nanị senti mmiri nke oge a.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, Jisọs nọ n’ọnọdụ ndị mmadụ na-anọkarị mgbe ha na-eri nri n’oge ahụ—ịdina ma ọ bụ ịdabere n’akụkụ tebụl.
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν αὐτῷ
  choice: bịakwutere ya
  rationale: Nke a na-egosi na nwanyị ahụ bịara nso n’ebe ọ nọ; okwu Igbo a bụ nke e ji ekwu okwu kwa ụbọchị ma chekwaa ntụziaka mmegharị ahụ.
- source_word: γυνή
  choice: otu nwanyị
  rationale: Aha ahụ enweghị nkọwa ọzọ ma ọ bụ onye e kwuru aha ya, ya mere ‘otu nwanyị’ dabara na ụdị aha na-enweghị njirimara doro anya.
- source_word: ἔχουσα
  choice: ji
  rationale: ‘Ji’ na-egosi na o bu ma ọ bụ jide karama ahụ, n’ụzọ dị mkpirikpi ma bụrụkwa nke sitere n’okwu Igbo eke.
- source_word: ἀλάβαστρον μύρου
  choice: karama alabasta nke mmanụ na-esi ísì
  rationale: ‘Karama alabasta’ na-anọchi anya akpa ahụ, ebe ‘mmanụ na-esi ísì’ na-egosipụta μύρον dịka mmanụ e ji ihe na-esi ísì ụtọ mee, n’emeghị ka ọ bụrụ naanị ụdị senti mmiri nke oge a.
- source_word: βαρυτίμου
  choice: dị oke ọnụ ahịa
  rationale: 'Nhọrọ a na-egosipụta ike okwu ahụ: ihe ahụ abụghị naanị ihe dị ọnụ, kama ọ bara nnukwu uru.'
- source_word: κατέχεεν
  choice: wụsara
  rationale: Ngwaa a na-egosi ịwụsa ihe n’elu mmadụ; ihe na-esote ya kọwara ebe ọ wụsara ya.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: n’isi ya
  rationale: Nke a na-enye ebe mmanụ ahụ rutere n'ụzọ doro anya na nke eke n’Igbo.
- source_word: ἀνακειμένου
  choice: mgbe ọ na-eri nri, dina n’akụkụ tebụl
  rationale: Okwu a na-ezo aka n’ọnọdụ ndina ma ọ bụ ịdabere n’akụkụ tebụl n’oge nri. Nsụgharị ahụ na-eme ka ọnọdụ omenala ahụ doo onye na-agụ taa anya.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Alabasta’ ka edobere dịka aha ụdị nkume ma ọ bụ akpa ahụ, ebe nkọwa ala peeji na-echekwa obosara ihe μύρον nwere ike ịpụta. E kewara ahịrịokwu ahụ ụzọ abụọ ka ọ bụrụ nke a na-agụ nke ọma n’Igbo.
