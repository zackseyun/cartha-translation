- from: Otu nwanyị ji karama alabasta nke mmanụ na-esi ísì dị oke ọnụ ahịa[a] bịakwutere ya. Ọ wụsara mmanụ ahụ n’isi ya mgbe ọ na-eri nri, dina n’akụkụ tebụl[b].
  to: Otu nwanyị ji karama alabasta nke mmanụ na-esi ísì dị oke ọnụ ahịa[a] bịakwutere ya. Ọ na-awụsa mmanụ ahụ n’isi ya mgbe Jisọs nọ na-adina n’akụkụ tebụl[b].
  rationale: The revision retains all of the draft’s sound lexical choices while rendering the source imperfect more closely and repairing the final clause’s grammar and referential clarity. Naming Jisọs in the temporal clause merely makes explicit the referent supplied by the immediate context; it does not add to the event described.
