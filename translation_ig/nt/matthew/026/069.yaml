  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: ig
  text: Pita nọ ọdụ n’èzí n’ogige ahụ, otu nwa agbọghọ na-eje ozi[a] bịakwutere ya, sị, “Gị kwa na Jizọs onye Galili ahụ nọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “otu odibo nwanyị” ma ọ bụ “otu nwa agbọghọ ohu.” Okwu Grik bụ παιδίσκη, nke nwere ike ịpụta nwa agbọghọ na-eje ozi, mgbe ụfọdụkwa nwa agbọghọ nọ n’ọnọdụ ohu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: —
  rationale: A hapụrụ ya n’enweghị okwu mmalite pụrụ iche; ebe a δέ bụ naanị njikọ akụkọ dị nro, ọ bụghị okwu na-egosi oge ma ọ bụ nnukwu mmegide.
- source_word: ἐκάθητο ἔξω
  choice: nọ ọdụ n’èzí
  rationale: Ọ na-egosi ọnọdụ Pita nọ na ya ruo oge ụfọdụ n’oge gara aga, ma na-edobekwa ἔξω dị ka ‘n’èzí.’
- source_word: ἐν τῇ αὐλῇ
  choice: n’ogige ahụ
  rationale: N’ebe a αὐλή bụ ogige dị n’etiti ụlọ ma ọ bụ n’ime gburugburu ụlọ onyeisi nchụaja; ‘ogige ahụ’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
- source_word: προσῆλθεν αὐτῷ
  choice: bịakwutere ya
  rationale: Ọ na-egosi na nwa agbọghọ ahụ bịara nso n’ebe Pita nọ.
- source_word: μία παιδίσκη
  choice: otu nwa agbọghọ na-eje ozi[a]
  rationale: ‘Otu’ na-egosipụta μία, ebe ‘nwa agbọghọ na-eje ozi’ na-egosi ma afọ/okike ya ma ọrụ ya, n’etinyeghị ozugbo na ọ bụ ohu mgbe ọnọdụ ahụ ekwughị nke ahụ hoo haa.
- source_word: λέγουσα
  choice: sị
  rationale: N’Igbo, ‘sị’ na-ejikọta ịbịakwute ya na okwu o kwuru n’ụzọ dị mfe ma kwekọọ n’ọrụ participle ahụ.
- source_word: Καὶ σὺ
  choice: Gị onwe gị … kwa
  rationale: '‘Gị onwe gị’ na ‘kwa’ na-edobe nkwusi ike ahụ: Pita bụkwa otu n’ime ndị ha na Jizọs nọ.'
- source_word: ἦσθα μετὰ
  choice: na … nọkwa
  rationale: Nke a na-edobe echiche nkịtị nke ịnọnyere mmadụ, na-enweghị ịgbasa ya ka ọ bụrụ nkwupụta doro anya banyere ịbụ onye na-eso ụzọ.
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: Jizọs onye Galili ahụ
  rationale: A sụgharịrị aha njirimara Γαλιλαῖος dị ka ‘onye Galili,’ ma ‘ahụ’ na-eme ka njirimara onye ahụ doo anya n’okwu nwa agbọghọ ahụ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ụda ebubo dị n’okwu nwa agbọghọ ahụ, tinyere nkwusi ike nke ‘gị onwe gị … kwa,’ n’ebughị ụzọ kọwaa na Pita bụ onye na-eso ụzọ karịa ihe ederede Grik kwuru.
