- from: Pita nọ ọdụ n’èzí n’ogige ahụ, otu nwa agbọghọ na-eje ozi[a] bịakwutere ya, sị, “Gị onwe gị na Jizọs onye Galili ahụ nọkwa.”
  to: Pita nọ ọdụ n’èzí n’ogige ahụ, otu nwa agbọghọ na-eje ozi[a] bịakwutere ya, sị, “Gị kwa na Jizọs onye Galili ahụ nọ.”
  rationale: The only change is to recast the emphatic additive phrase in the direct speech as “Gị kwa,” a natural Standard Igbo equivalent of Καὶ σὺ. The meaning, social-status ambiguity, and footnote anchor are preserved.
