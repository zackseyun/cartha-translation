id: MAT.26.41
reference: Matthew 26:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: ig
  text: Nọgidenụ na-amụ anya, kpeekwanụ ekpere[a], ka unu ghara ịbanye n’ọnwụnwa. N’ezie, mmụọ dị njikere, ma anụ ahụ adịghị ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ule” ma ọ bụ “ọnwụnwa ime mmehie.” Okwu Grik ahụ (πειρασμόν) nwere ike ịpụta ọnwụnwa ime mmehie ma ọ bụ ule siri ike mmadụ na-agabiga.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Na-anọrịtanụ na nche
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha nọgide na-amụ anya ma na-eche nche. N'ọnọdụ Getsemeni, ọ metụtara ịghara ihi ụra, ma ọ ka na-eburu echiche nke ịmụrụ anya n'ụzọ ime mmụọ.
- source_word: προσεύχεσθε
  choice: na-ekpekwa ekpere
  rationale: Ụdị a na-egosi omume a ga na-eme mgbe niile ma jikọta ya n'ụzọ okike na iwu mbụ.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: ka unu ghara ịbanye
  rationale: Nke a na-echekwa ebumnuche mgbochi na ihe atụ nke mmadụ 'ịbanye' n'ọnọdụ ọnwụnwa, kama ịkọwa ya dị ka ịdaba.
- source_word: πειρασμόν
  choice: ọnwụnwa
  rationale: N'ebe a, okwu a na-adọ aka ná ntị banyere nrụgide nke pụrụ iduga mmadụ n'ime mmehie. Ma ebe okwu Grik ahụ nwekwara ike ịpụta ule ma ọ bụ ahụhụ nnwale, e debere nke ahụ n'ala peeji.
- source_word: τὸ μὲν πνεῦμα
  choice: N'ezie, mmụọ
  rationale: N'ezie na-ebute ọdịiche μέν...δέ n'ụzọ Igbo dị mma. 'Mmụọ' ebe a na-ezo aka n'ime mmadụ ma ọ bụ ọchịchọ ya, ọ bụghị n'ụzọ doro anya Mmụọ Nsọ.
- source_word: πρόθυμον
  choice: dị njikere
  rationale: Nke a na-egosi ịdị njikere na ọchịchọ ime ihe, na-enweghị ime ka okwu ahụ pụta nanị dịka mmetụta ịnụ ọkụ n'obi.
- source_word: ἡ δὲ σὰρξ
  choice: ma anụ ahụ
  rationale: Nke a na-echekwa ọdịiche dị n'etiti mmụọ na anụ ahụ, ma na-ezere ntụgharị na-akọwahie ya dịka 'ọdịdị mmehie.' N'ọnọdụ a, anụ ahụ na-egosi adịghị ike mmadụ.
- source_word: ἀσθενής
  choice: adịghị ike
  rationale: Nke a bụ ntụgharị Igbo kwụ ọtọ ma dị n'okike maka adịghị ike mmadụ a na-ekwu maka ya.
theological_decisions:
- issue: Ihe πνεῦμα na-ezo aka na ya
  choice: mmụọ mmadụ ma ọ bụ ọchịchọ dị n'ime ya
  alternative: Mmụọ Nsọ
  rationale: Ọdịiche ya na 'anụ ahụ,' tinyere ọnọdụ ndị na-eso ụzọ chọrọ ime ihe ziri ezi ma mechaa daa, na-akwado mmụọ mmadụ. E jighị mkpụrụedemede ukwu mee ya ka a ghara itinye nkwupụta gbasara Mmụọ Nsọ nke amaokwu ahụ na-ekwughị n'ụzọ doro anya.
- issue: Ntụgharị σάρξ
  choice: anụ ahụ
  alternative: ọdịdị mmehie; ahụ
  rationale: N'ebe a, okwu ahụ na-egosi adịghị ike mmadụ n'anụ ahụ, ọ bụghị echiche Pọl kọwara nke ọma banyere 'ọdịdị mmehie.' 'Anụ ahụ' na-echekwa ihe atụ ahụ na esemokwu dị n'etiti ya na mmụọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma doo ndị nkịtị anya. Ụdị iwu ọtụtụ mmadụ (-nụ) na-egosipụta plural Grik. E debere ihe atụ nke 'ịbanye n'ọnwụnwa' na ọdịiche dị n'etiti 'mmụọ' na 'anụ ahụ' ka a ghara ịkọwa ihe karịrị ihe isi mmalite kwuru.
