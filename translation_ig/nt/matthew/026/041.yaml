  - severity: low
    issue: «na-ekpekwa ekpere» n’usoro iwu
    rationale: Ọ bụ ezie na a pụrụ ịghọta ya, «kpeekwanụ ekpere» bụ usoro iwu ọtụtụ mmadụ na-adaba nke ọma na γρηγορεῖτε καὶ προσεύχεσθε.
  - severity: low
    issue: «ahụhụ nnwale» n’ala peeji
    rationale: Nkebiokwu a abụghị ụzọ Standard Igbo kacha eke iji kọwaa ‘trial/testing’ n’ebe a. «Ule» na «ọnwụnwa ime mmehie» na-akọwa nhọrọ ndị ahụ nke ọma n’enweghị ịgbakwunye echiche nke ahụhụ.
