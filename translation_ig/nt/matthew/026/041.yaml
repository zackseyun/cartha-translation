review_pass:
  verdict: revise
  source_fidelity: 'Ntụgharị ahụ na-ebuga nke ọma iwu ọtụtụ mmadụ abụọ ahụ, ebumnuche mgbochi nke «ka unu ghara ịbanye», na ọdịiche dị n’etiti mmụọ na anụ ahụ. Otú ọ dị, «Na-anọrịtanụ na nche» adịghị akọwa γρηγορεῖτε n’ụzọ kwụ ọtọ na nke nkịtị: -rịta- nwere ike ịgbakwunye echiche nke imekọrịta ọnụ nke na-adịghị n’asụsụ Grik. Emeziwo ya ka ọ bụrụ iwu doro anya nke ịmụrụ anya.'
  naturalness: «Nọgidenụ na-amụ anya, kpeekwanụ ekpere» bụ Standard Igbo nke dị ndụ ma kwekọọ na ọnọdụ ndị na-eso ụzọ na-ehi ụra. «Kpeekwanụ ekpere» na-enye iwu nke abụọ n’ụzọ kwekọrọ na nke mbụ karịa «na-ekpekwa ekpere».
  terminology: «Ọnwụnwa», «mmụọ», na «anụ ahụ» kwesịrị ekwesị. A hapụrụ «mmụọ» n’ụdị mkpụrụedemede nta, ka ọ ghara ikpebi na ọ bụ Mmụọ Nsọ. Emeziri nkọwa ala peeji iji dochie «ahụhụ nnwale», nke na-adịghị eke ebe a, ma chekwaa ohere okwu πειρασμόν nwere nke ‘ule’ ma ọ bụ ‘ọnwụnwa’.
