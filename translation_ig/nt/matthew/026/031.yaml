id: MAT.26.31
reference: Matthew 26:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: ig
  text: 'Mgbe ahụ, Jizọs sịrị ha, “N’abalị a[b], unu niile ga-asụ ngọngọ n’ihi m[a], n’ihi na e dere, sị: ‘M ga-eti onye ọzụzụ atụrụ ihe, a ga-achụsasịkwa atụrụ nke ìgwè atụrụ ahụ.’”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu niile ga-agbahapụ m,” “a ga-eme ka unu niile sụọ ngọngọ n’ihi m,” ma ọ bụ “unu niile ga-ewe iwe n’ihi m.” Okwu Grik ahụ nwere ike ịpụta ịsụ ngọngọ, ịdapụ n’ihi mmadụ, ma ọ bụ iwe iwe n’ihi mmadụ; n’ebe a, ihe gbara ya gburugburu na-atụ aka n’ịgbahapụ Jizọs.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “taa n’abalị.”
    reason: lexical_alternative
  - marker: c
    text: Ihe e hotara sitere na Zekaraya 13:7.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Mgbe ahụ, Jizọs sịrị ha
  rationale: ‘Mgbe ahụ’ na-egosi usoro ihe omume; ‘sịrị’ bụ ụzọ Igbo si akọ akụkọ n'ụzọ ebumpụta ụwa, ọ bụ ezie na Grik ji historical present λέγει.
- source_word: Πάντες ὑμεῖς
  choice: unu niile
  rationale: Nke a na-echekwa nkwusi ike dị na njikọ πάντες na ὑμεῖς.
- source_word: σκανδαλισθήσεσθε ἐν ἐμοὶ
  choice: ga-agbahapụ m
  rationale: N’ọnọdụ a, okwu ahụ na-ekwu banyere ndị na-eso ụzọ ịhapụ Jizọs n’abalị ahụ. Nhọrọ a na-egosipụta ihe ga-eme n’akụkọ ahụ n’ebughị ụzọ kwuo na ọ bụ ịjụ okwukwe kpamkpam.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: N’abalị a
  rationale: Ọ bụ ntụgharị Igbo doro anya ma bụrụkwa nke dị nso n’okwu Grik ‘n’abalị a.’
- source_word: γέγραπται γάρ
  choice: n’ihi na e dere, sị
  rationale: Nke a bụ usoro Igbo kwesịrị ekwesị maka usoro e ji webata ihe e dere n’Akwụkwọ Nsọ.
- source_word: Πατάξω τὸν ποιμένα
  choice: M ga-eti onye ọzụzụ atụrụ ihe
  rationale: Ọ na-echekwa ngwaa ‘iti’ na ihe atụ ‘onye ọzụzụ atụrụ’ n’etinyeghị nsonaazụ dịka igbu ya.
- source_word: διασκορπισθήσονται
  choice: a ga-achụsasịkwa
  rationale: Ụdị a na-echekwa ọdịdị nnara-eme nke ngwaa Grik na echiche nke ịgbasa n’ebe dị iche iche.
- source_word: τὰ πρόβατα τῆς ποίμνης
  choice: atụrụ nke ìgwè atụrụ ahụ
  rationale: A hapụrụ ma ‘atụrụ’ ma ‘ìgwè atụrụ’ dịka ha abụọ dị n’asụsụ Grik, n’agbanyeghị ntakịrị nkwughachi dị na ya.
theological_decisions:
- issue: Ihe σκανδαλισθήσεσθε ἐν ἐμοὶ pụtara n’ebe a
  choice: Ndị na-eso ụzọ ga-agbahapụ Jizọs n’ihi ihe ga-eme ya.
  alternative: Ha ga-asụ ngọngọ, a ga-eme ka ha sụọ ngọngọ, ma ọ bụ ha ga-ewe iwe n’ihi ya.
  rationale: Ihe gbara amaokwu ahụ gburugburu na amụma banyere onye ọzụzụ atụrụ na atụrụ na-atụ aka n’ịgbasa na ịhapụ Jizọs. A naghị eji okwu ahụ kpebie na nke a bụ ịjụ okwukwe ikpeazụ.
- issue: Historical present λέγει
  choice: sịrị
  alternative: na-asị
  rationale: Igbo na-ejikarị oge gara aga akọ ihe mere n’usoro akụkọ; nke a na-eme ka ahịrịokwu ahụ bụrụ nke ebumpụta ụwa n’Igbo n’agbanweghi ihe okwu ahụ pụtara.
- issue: Onye na-eme ihe n’okwu ‘M ga-eti’
  choice: E chekwara onye mbụ ‘M’ dịka e dere ya.
  alternative: Ịkọwa ‘M’ ozugbo dịka Chineke Nna ma ọ bụ onye ọzọ.
  rationale: Ntụgharị ahụ na-echekwa nkwupụta amụma ahụ n’enweghị ịgbakwunye nkọwa nkà mmụta okpukpe nke amaokwu ahụ ekwughị kpọmkwem.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. ‘Jizọs’ bụ nsụgharị aha a na-ahụkarị n’Igbo. E tinyere akara nkọwa ala ala [a], [b], na [c] n’ebe ha metụtara n’ahịrịokwu.
