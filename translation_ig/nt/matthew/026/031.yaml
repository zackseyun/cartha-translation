  to: 'Mgbe ahụ, Jizọs sịrị ha, “N’abalị a[b], unu niile ga-asụ ngọngọ n’ihi m[a], n’ihi na e dere, sị: ‘M ga-eti onye ọzụzụ atụrụ ihe, a ga-achụsasịkwa atụrụ nke ìgwè atụrụ ahụ.’”[c]'
  rationale: 'The revision preserves the Greek ambiguity of σκανδαλισθήσεσθε while retaining a natural Standard Igbo biblical register. It also corrects the footnote anchors and contents: the temporal alternative is now attached to “N’abalị a,” and the citation note remains attached to the quotation. No theological identification of the speaker in the quotation is added.'
