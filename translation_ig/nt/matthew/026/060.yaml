translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ihe ngwaa ‘ahụghị’ na-ezo aka na ya ka ọ ghara ịka nkọ karịa okwu Grik, ma kọwaa ya n'ala ala peeji.
