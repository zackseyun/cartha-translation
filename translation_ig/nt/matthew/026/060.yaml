  text: and they did not find any[a], though many false witnesses had come forward. But later two came forward
translation:
  language: ig
  text: Ma ha ahụghị[a], n’agbanyeghị na ọtụtụ ndị akaebe ụgha bịara n’ihu. Ma emesịa, mmadụ abụọ bịara n’ihu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha ahụghị ihe ọ bụla”; n’asụsụ Grik, ekwughị kpọmkwem ihe ha ahụghị, nke nwere ike ịbụ ihe àmà ma ọ bụ ebubo ha na-achọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὗρον
  choice: ha ahụghị nke ọ bụla
  rationale: Ihe e ji ngwaa a mee ihe anaghị apụta ìhè n'okwu Grik; ihe gbara ya gburugburu na-ezo aka n'ama ma ọ bụ ebubo ha na-achọ megide Jizọs. ‘Nke ọ bụla’ na-egosi na ha ahụghị ama ma ọ bụ ebubo ọ bụla kwesịrị ekwesị, ma ọ naghị akpọchi ihe ahụ e zoro aka na ya.
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: ọ bụ ezie na ọtụtụ ndị akaebe ụgha bịara n'ihu
  rationale: 'Nkebiokwu genitive absolute a na-egosi ihe megidere ihe a tụrụ anya ya: n''agbanyeghị na ọtụtụ ndị akaebe ụgha pụtara, ha ahụghị ihe ha na-achọ. ‘Ndị akaebe ụgha’ dabara n''ọnọdụ ikpe ahụ karịa ịsị naanị ndị ụgha.'
- source_word: ὕστερον δὲ
  choice: Ma emesịa
  rationale: ‘Emesịa’ na-egosi oge sochiri n'ime usoro ikpe ahụ, ebe ‘Ma’ na-echekwa ntakịrị ntụgharị dị na δέ.
- source_word: προσελθόντες δύο
  choice: mmadụ abụọ bịara n'ihu
  rationale: N'ọnọdụ ikpe a, ‘bịara n'ihu’ bụ ụzọ Igbo dị ndụ isi kwuo na ha pụtara ịgba akaebe; itinye ‘mmadụ’ na-eme ka ọnụọgụ ahụ doo anya ma bụrụkwa okwu Igbo nkịtị.
