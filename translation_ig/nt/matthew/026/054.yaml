  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πῶς οὖν πληρωθῶσιν αἱ γραφαὶ ὅτι οὕτως δεῖ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: ig
  text: Ya mere, olee otú ihe e dere n’Akwụkwọ Nsọ ga-esi mezuo[a], na ọ ga-abụrịrị otu a?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ya mere, olee otú Akwụkwọ Nsọ ga-esi mezuo, na ọ ga-abụrịrị otu a?”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: olee otú ... ga-esi
  rationale: Ọ bụ ajụjụ na-egosi na ọ gaghị ekwe omume ka Akwụkwọ Nsọ mezuo ma ọ bụrụ na e mee ihe n’ụzọ ọzọ; usoro a bụ nke e ji ajụ ajụjụ dị otú a n’Igbo nkịtị.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ajụjụ a na ihe Jizọs kwuru tupu ya ma na-egosi nkwubi okwu sitere na ya.
- source_word: πληρωθῶσιν
  choice: ga-esi mezuo
  rationale: 'Ụdị a na-ebupụta ike nke passive subjunctive n’ajụjụ rhetorical: kedu ka ihe e dere ga-esi ruo n’ mmezu ya ma ọ bụrụ na ihe agaghị otu a?'
- source_word: αἱ γραφαὶ
  choice: ihe e dere n’Akwụkwọ Nsọ
  rationale: N’ebe a, ọtụtụ γραφαί na-ezo aka n’ihe ndị dị n’Akwụkwọ Nsọ dị nsọ, ọ bụghị naanị ihe odide nkịtị.
- source_word: ὅτι
  choice: na
  rationale: Ọ na-ewebata ọdịnaya nke ihe Akwụkwọ Nsọ na-ekwu, ya bụ na ihe ndị a ga-abụrịrị otu a.
- source_word: οὕτως
  choice: otu a
  rationale: Ọ na-ezo aka n’ụzọ ihe gbasara njide na ahụhụ Jizọs si aga ugbu a.
- source_word: δεῖ
  choice: ọ ga-abụrịrị
  rationale: Nke a na-edobe ike nke mkpa ma ọ bụ iwu dị na δεῖ n’akwụghị kpọmkwem onye kpebiri mkpa ahụ.
- source_word: γενέσθαι
  choice: ọ ga-abụ
  rationale: N’ọnọdụ a, γίνομαι na-ezo aka n’ihe omume ndị ga-eme; ‘ọ ga-abụ’ bụ okwu Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa.
theological_decisions:
- issue: Ụdị mkpa δεῖ na-egosi
  choice: ọ ga-abụrịrị otu a
  alternative: ọ ga-emerịrị otu a dịka atụmatụ Chineke si dị
  rationale: Njikọ nke mmezu Akwụkwọ Nsọ na δεῖ na-egosi mkpa metụtara uche Chineke, ma Grik akọwaghị ya n’ụzọ zuru ezu. Nsụgharị ahụ anaghị atụkwasị nkọwa ozizi na-adịghị n’ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma doo ndị nkịtị anya. E ji ‘ihe e dere n’Akwụkwọ Nsọ’ mee ka ọtụtụ αἱ γραφαί pụta ìhè, ebe ndetu ala na-enye nsụgharị dị nkenke ‘Akwụkwọ Nsọ.’
