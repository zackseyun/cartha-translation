  source_fidelity: Nsụgharị ahụ na-edobe usoro ajụjụ retọrikal πῶς οὖν, mmezu nke αἱ γραφαί, na ọdịnaya ὅτι ... δεῖ γενέσθαι. “Olee otú ... ga-esi mezuo” na-egosi nke ọma ajụjụ nwere echiche na, ma a gbanwee omume ahụ, mmezu ahụ agaghị ekwe omume. “Ọ ga-abụrịrị otu a” na-edobe mkpa δεῖ na-enweghị itinye onye ma ọ bụ atụmatụ a na-akọwaghị n’ederede.
  naturalness: Igbo ahụ bụ Standard Igbo doro anya ma dabara na ndekọ Akwụkwọ Nsọ nke oge a. “Ihe e dere n’Akwụkwọ Nsọ” bụ ụzọ eke e si akọwa ọtụtụ “Scriptures,” ebe “otu a” na-ezo n’ụzọ ihe omume ahụ si eme.
  terminology: “Akwụkwọ Nsọ” na “ihe e dere n’Akwụkwọ Nsọ” dabara nke ọma maka αἱ γραφαί n’ọnọdụ a. Okwu “mezuo” dabara maka πληρωθῶσιν, ma “ọ ga-abụrịrị” na-echekwa ike δεῖ n’enweghị mgbakwunye ozizi.
