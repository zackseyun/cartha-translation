source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: ig
  text: Mgbe ahụ Jizọs sịrị ya, “Tinyeghachi mma agha gị n’ebe o kwesịrị ịdị, n’ihi na ndị niile na-ewere mma agha[a] ga-eji mma agha laa n’iyi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-ejide mma agha”; okwu a yiri ka ọ pụtara ịdabere n’ime ihe ike, ọ bụghị naanị ijide ngwa agha.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe sochiri ozugbo n’usoro akụkọ, n’Igbo doro anya ma dịkwa mfe.
- source_word: λέγει αὐτῷ
  choice: Jizọs sịrị ya
  rationale: Ọ bụ ezie na Grik ji oge ugbu a n’ụzọ akụkọ ihe mere eme, oge gara aga bụ ụzọ Igbo si akọ akụkọ a nke ọma.
- source_word: Ἀπόστρεψον
  choice: Tinyeghachi
  rationale: Iwu a chọrọ ka o weghachite ngwa agha ahụ ozugbo; okwu a na-egosi iweghachi ihe n’ebe o kwesịrị ịdị.
- source_word: τὴν μάχαιράν σου
  choice: mma agha gị
  rationale: μάχαιρα nwere ike ịbụ mma buru ibu ma ọ bụ mma agha dị mkpụmkpụ, ma “mma agha” bụ okwu Igbo kacha doo anya n’ọnọdụ a ma na-echekwa nkwughachi ilu ahụ.
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: n’ọnọdụ ya
  rationale: Nke a na-echekwa echiche nke iweghachi ngwa agha ahụ n’ebe o kwesịrị ịdị n’etinyeghị “ọbọ” nke Grik ekwughị kpọmkwem.
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: n’ihi na ndị niile na-ewere mma agha
  rationale: Nkebi ahịrịokwu Grik bụ ụkpụrụ metụtara mmadụ niile na-eme omume a. “Na-ewere mma agha” na-echekwa ma ihe e kwuru kpọmkwem ma echiche nke iji ime ihe ike mee ihe.
- source_word: ἐν μαχαίρῃ
  choice: ga-eji mma agha
  rationale: Dative a na-egosi ụzọ ma ọ bụ ngwa e ji mee ihe; “iji mma agha” bụ usoro Igbo nkịtị ma na-echekwa myirịta dị n’okwu ahụ.
- source_word: ἀπολοῦνται
  choice: laa n’iyi
  rationale: Ọ na-egosi ọnwụ ma ọ bụ mbibi na-abịa, ma ọ naghị akọwa karịa ihe okwu Grik kwuru.
theological_decisions:
- issue: Oke okwu Jizọs banyere mma agha ruru
  choice: E depụtara ya dịka ụkpụrụ zuru ezu gbasara “ndị niile na-ewere mma agha.”
  alternative: Ịkọwa ya dịka iwu na-ajụ ụdị ike ọ bụla kpamkpam, ma ọ bụ dịka amụma metụtara naanị onye ahụ n’oge ahụ.
  rationale: Ụdị nkebi ahịrịokwu Grik na-eme ka okwu ahụ bụrụ ụkpụrụ sara mbara. Nsụgharị ahụ echekwala obosara ya n’etinyeghị echiche otu ụka gbasara ime ihe ike.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “mma agha” maka nkwụsi ike n’ahịrịokwu ahụ, ma e zere itinye “ọbọ” n’ihi na isi mmalite Grik ekwughị ya kpọmkwem.
