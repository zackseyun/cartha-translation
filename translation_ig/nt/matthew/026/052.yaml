review_pass:
  verdict: revise
  source_fidelity: The rendering accurately preserves the narrative sequence, Jesus' command, the generalizing force of πάντες οἱ λαβόντες, and the instrumental sense of ἐν μαχαίρῃ. However, “n’ọnọdụ ya” ordinarily means “in its condition/position,” rather than the weapon’s proper place (εἰς τὸν τόπον αὐτῆς).
  naturalness: The verse is clear and appropriately formal Standard Igbo. Replacing “n’ọnọdụ ya” with “n’ebe o kwesịrị ịdị” gives the command its natural intended sense without specifying a sheath, which the Greek does not mention.
  terminology: “Mma agha” consistently renders μάχαιρα suitably in this context. “Laa n’iyi” is a fitting, non-over-specified rendering of ἀπολοῦνται. The footnote’s alternative, “ndị na-ejide mma agha,” is lexically possible but should not be allowed to obscure that the expression can refer to resorting to armed violence; its present explanation properly supplies that clarification.
  issues:
  - severity: medium
    issue: “n’ọnọdụ ya” does not naturally express “into its place.”
    rationale: The Greek εἰς τὸν τόπον αὐτῆς refers to the sword’s place. In Standard Igbo, ọnọdụ commonly denotes a state, situation, or position, so it may imply restoring the sword to a condition rather than returning it where it belongs.
  revised_text: Mgbe ahụ Jizọs sịrị ya, “Tinyeghachi mma agha gị n’ebe o kwesịrị ịdị, n’ihi na ndị niile na-ewere mma agha[a] ga-eji mma agha laa n’iyi.”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-ejide mma agha”; okwu a yiri ka ọ pụtara ịdabere n’ime ihe ike, ọ bụghị naanị ijide ngwa agha.
    reason: lexical_alternative
  revision_rationale: Only the phrase rendering εἰς τὸν τόπον αὐτῆς has been adjusted. “N’ebe o kwesịrị ịdị” clearly conveys return to the sword’s proper place while avoiding the unsupported addition of “ọbọ” (sheath). All other wording, including the proverb’s broad scope and its ambiguity concerning application, is retained.
