- from: Mgbe ahụ Jizọs sịrị ya, “Tinyeghachi mma agha gị n’ọnọdụ ya, n’ihi na ndị niile na-ewere mma agha[a] ga-eji mma agha laa n’iyi.”
  to: Mgbe ahụ Jizọs sịrị ya, “Tinyeghachi mma agha gị n’ebe o kwesịrị ịdị, n’ihi na ndị niile na-ewere mma agha[a] ga-eji mma agha laa n’iyi.”
  rationale: Only the phrase rendering εἰς τὸν τόπον αὐτῆς has been adjusted. “N’ebe o kwesịrị ịdị” clearly conveys return to the sword’s proper place while avoiding the unsupported addition of “ọbọ” (sheath). All other wording, including the proverb’s broad scope and its ambiguity concerning application, is retained.
  reviewer_model: gpt-5.6-terra
