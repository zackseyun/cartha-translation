  source_fidelity: The passive resurrection expression in “mgbe e bilitesịrị m” faithfully represents ἐγερθῆναί με and appropriately leaves the agent unstated. The previous rendering “aga m eburu unu ụzọ” can imply leading the disciples, whereas προάξω more directly says that Jesus will go ahead of them. The revision expresses this spatial sense without adding a leadership nuance.
  naturalness: “M ga-aga n’ihu unu ruo Galili” is clear, idiomatic Standard Igbo. It avoids the less natural future construction “aga m eburu” and directly communicates going ahead.
  terminology: “Bilitesịrị” is suitable resurrection language, and “Galili” is the established Igbo form of the place name. The footnote retains the passive-versus-intransitive distinction without doctrinal elaboration.
