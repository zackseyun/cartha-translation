  text: μετὰ δὲ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/032.yaml
  text: But after I am raised up[a], I will go ahead of you into Galilee.
translation:
  language: ig
  text: Ma mgbe e bilitesịrị m[a], m ga-aga n’ihu unu ruo Galili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “mgbe m bilitesịrị.” N’okwu Grik, e ji ụdị nnara-eme kwuo ya: “mgbe e bilitesịrị m.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Ma mgbe
  rationale: “Mgbe” na-egosi usoro oge nke μετά tinyere infinitive nwere article; “ma” na-edobe obere ntụgharị δέ n’ihe Jizọs kwuru mgbe amụma banyere ịsụ ngọngọ gasịrị.
- source_word: τὸ ἐγερθῆναί με
  choice: e bilitesịrị m
  rationale: 'Nke a na-edobe ụdị nnara-eme nke aorist passive infinitive: ihe a na-eme Jizọs, n’agbanyeghị na ekwughị onye mere ya. “-sịrị” na-enyere aka igosi na nke a ga-ebu ụzọ mee tupu ihe na-esote.'
- source_word: προάξω
  choice: aga m eburu … ụzọ
  rationale: Nkebiokwu Igbo a na-egosi ịga n’ihu ma ọ bụ ibu ụzọ gaa, na-enweghị ịmanye echiche na ọ pụtara idu ndị ọzọ n’usoro ọchịchị.
- source_word: ὑμᾶς
  choice: unu
  rationale: “Unu” na-egosi nke ọma na nnọchiaha onye nke abụọ bụ ọtụtụ mmadụ.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: gaa Galili
  rationale: N’Igbo nkịtị, “gaa Galili” na-egosi mmegharị ruo n’ebe ahụ n'ụzọ doro anya ma dịkwa ụtọ karịa nsụgharị nke ga-amanye “banye” n’aha ógbè ahụ.
theological_decisions:
- issue: Okwu mbilite n’ọnwụ dị na ἐγερθῆναί
  choice: 'E debere ya n’ụdị nnara-eme: “e bilitesịrị m.”'
  alternative: “mgbe m bilitesịrị”
  rationale: Ụdị nnara-eme ahụ na-agbaso Grik ma na-ahapụ onye kpọlitere ya n’ekwughị okwu, kama ịgbanwe ya ka ọ bụrụ naanị na Jizọs biliri n’onwe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Eburu unu ụzọ” bụ okwu nkịtị maka ịga n’ihu ndị ọzọ; ahịrịokwu ahụ adịghị etinye nkọwa okpukpe ọzọ na-abụghị nke isi mmalite.
