id: MAT.26.75
reference: Matthew 26:75
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: ig
  text: Pita wee cheta okwu Jizọs kwuru, sị, “Tupu oke ọkụkọ akwaa, ị ga-agọnahụ m ugboro atọ.” O wee pụọ n’èzí kwaa ákwá n’obi ilu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθη
  choice: wee cheta
  rationale: “Cheta” na-egosi na okwu ahụ lọghachiri Pita n’uche n’oge ahụ; “wee” na-ejikọta ihe omume ahụ nke ọma n’akụkọ Igbo.
- source_word: ῥήματος
  choice: okwu
  rationale: N’ebe a, ῥῆμα bụ okwu ma ọ bụ ihe e kwuru; “okwu” bụ nsụgharị Igbo doro anya ma dị nkenke.
- source_word: εἰρηκότος
  choice: kwuru
  rationale: Ọ na-ezo aka n’ihe Jizọs kwuru tupu mgbe ahụ. Usoro ahịrịokwu Igbo na-eme ka oge gara aga ahụ doo anya n’enweghị ịgbakwunye okwu ọzọ.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Tupu oke ọkụkọ akwaa
  rationale: Nke a bụ ụzọ Igbo si ekwu ọnọdụ oge ahụ n’ụzọ ebumpụta ụwa. “Oke ọkụkọ” na-anọchi ἀλέκτωρ, ebe “akwaa” na-anọchi mkpu ya.
- source_word: τρὶς
  choice: ugboro atọ
  rationale: Nke a bụ okwu Igbo a na-eji eme ihe taa ma na-egosi ọnụ ọgụgụ ahụ kpọmkwem.
- source_word: ἀπαρνήσῃ
  choice: ị ga-agọnahụ m
  rationale: “Gọnahụ” na-egosi ịjụ na mmadụ amataghị ma ọ bụ na ya na onye ahụ enweghị mmekọrịta, nke dabara n’ihe Pita mere.
- source_word: ἐξελθὼν ἔξω
  choice: O wee pụọ n’èzí
  rationale: Nke a na-echekwa mmegharị Pita site n’ebe ahụ gaa n’èzí, ma na-ezere ikwughachi okwu n’ụzọ na-adịghị mma n’Igbo.
- source_word: ἔκλαυσεν πικρῶς
  choice: kwaa ákwá n’obi ilu
  rationale: Akpaokwu a na-egosi akwa sitere na mwute na ihe mgbu miri emi, na-enweghị ịgbakwunye nkọwa banyere ihe kpatara ya.
theological_decisions:
- issue: Aha Jizọs n’enweghị utu aha ọzọ
  choice: Jizọs
  alternative: Onyenwe anyị Jizọs
  rationale: Ihe odide Grik kwuru naanị Ἰησοῦ; ya mere, etinyeghị utu aha Kraịst nke na-adịghị na isi mmalite.
- issue: Ihe ilu dị n’okwu ἔκλαυσεν πικρῶς
  choice: kwaa ákwá n’obi ilu
  alternative: kwaa ákwá nke ukwuu
  rationale: Nhọrọ a na-echekwa ịdị ilu na mwute miri emi nke okwu Grik ahụ n’ebughị ụzọ kwuo kpọmkwem na ọ bụ nchegharị, nke isi mmalite ekwughị n’amaokwu a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E tinyeghị ihe nrịbama nkọwa ụkwụ maka enweghị article n’ihu ἀλέκτορα, n’ihi na Igbo enweghị article kwekọrọ kpọmkwem na “a/the”; “oke ọkụkọ” na-anọgideghị akọwapụta otu nnụnụ pụrụ iche.
