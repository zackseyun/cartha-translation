- from: Site n’oge ahụ gaa n’ihu, ọ nọ na-achọ ohere ọ ga-eji nyefee ya n’aka ndị ọzọ[a].
  to: Site n’oge ahụ gawa, ọ nọ na-achọ ohere ọ ga-eji nyefee ya[a].
  rationale: The revision retains the imperfect’s ongoing sense (“ọ nọ na-achọ”), the favorable occasion (“ohere”), and the purpose construction (“ọ ga-eji”). It removes the added “ndị ọzọ” so that the translation and note retain the source verb’s broad sense, while the footnote preserves “rara ya nye” as a contextually fitting alternative.
