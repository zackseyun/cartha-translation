    reason: lexical_alternative
  revision_rationale: The revision retains the imperfect’s ongoing sense (“ọ nọ na-achọ”), the favorable occasion (“ohere”), and the purpose construction (“ọ ga-eji”). It removes the added “ndị ọzọ” so that the translation and note retain the source verb’s broad sense, while the footnote preserves “rara ya nye” as a contextually fitting alternative.
