  yaml_path: translation/nt/matthew/026/016.yaml
  text: And from then on he was seeking an opportunity to hand him over[a].
translation:
  language: ig
  text: Site n’oge ahụ gawa, ọ nọ na-achọ ohere ọ ga-eji nyefee ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “rara ya nye.” N’ụzọ nkịtị karị, ngwaa Grik ahụ pụtara “inyefe ya” ma ọ bụ “nye ya n’aka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τότε
  choice: Site n’oge ahụ gaa n’ihu
  rationale: Na-egosi oge omume ahụ malitere nakwa na ọ gara n’ihu.
- source_word: ἐζήτει
  choice: ọ nọ na-achọ
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro; okwu Igbo a na-egosipụta nke ahụ n'ụzọ doro anya.
- source_word: εὐκαιρίαν
  choice: ohere
  rationale: Na-enye echiche nke oge ma ọ bụ ọnọdụ dabara adaba maka ime ihe ahụ, n’asụsụ Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: ἵνα
  choice: ọ ga-eji
  rationale: Na-egosi nzube Judas ji achọ ohere ahụ n'ụzọ Igbo si ekwu ya nke ọma.
- source_word: παραδῷ
  choice: nyefee ya n’aka ndị ọzọ
  rationale: Na-echekwa isi echiche nke παραδίδωμι, ya bụ inyefe mmadụ n’aka ndị ọzọ, kama ịkọwapụta ya ozugbo naanị dị ka ịrara mmadụ nye.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs dịka amaokwu ndị gbara ya gburugburu si gosi.
theological_decisions:
- issue: Otú e si sụgharị παραδῷ n’ihe gbasara Judas
  choice: nyefee ya n’aka ndị ọzọ
  alternative: rara ya nye
  rationale: N’agbanyeghị na omume Judas bụ nrara nye, ngwaa Grik ahụ pụtara n’ụzọ sara mbara ‘inyefe’ ma ọ bụ ‘inye n’aka.’ Isi ederede na-echekwa obosara okwu ahụ, ebe nkọwa ala peeji na-egosi nsụgharị dabara n’ihe a na-ekwu banyere Judas.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ọ nọ na-achọ” gosipụta omume na-aga n’ihu; e tinyere “n’aka ndị ọzọ” iji mee ka “nyefee ya” doo anya n’Igbo n’enweghị ịkpọchi ihe okwu Grik pụtara naanị na ‘nrara nye.’
