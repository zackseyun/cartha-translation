  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: ig
  text: O wee kpọọrọ Pita na ụmụ nwoke abụọ nke Zebedi ka ha soro ya; ọ malitere inwe mwute na oké mgbakasị obi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ malitere inwe iru újú na ịnọ ná nsogbu n’obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν
  choice: kpọrọ ... ka ha soro ya
  rationale: Nkebi okwu a na-egosi na Jizọs kpọọrọ ndị enyi a họọrọ ka ha soro ya; nsụgharị a bụ Igbo eke ma na-edobe echiche nke ịkpọrọ mmadụ soro onwe ya.
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: ụmụ Zebedi abụọ
  rationale: Aha Grik ahụ kwuru kpọmkwem ụmụ Zebedi abụọ, ọ kpọghị ha Jemis na Jọn n'amaokwu a; ya mere, a hapụrụ njirimara ahụ otú isi mmalite si kwuo ya.
- source_word: ἤρξατο
  choice: ọ malitere
  rationale: Okwu a na-egosi mmalite ọnọdụ ahụ n'ụzọ doro anya.
- source_word: λυπεῖσθαι
  choice: inwe mwute
  rationale: Nke a na-egosi ezi iru újú ma ọ bụ mwute, n'okwu Igbo dị mfe ma dịkwa nsọpụrụ.
- source_word: ἀδημονεῖν
  choice: ịnọ n'oké nchekasị
  rationale: Okwu a na-egosi nnukwu nhụjuanya na mgbakasị obi, nke karịrị naanị mwute; 'oké nchekasị' na-ebupụta ịdị arọ ya n'Igbo nke oge a.
- source_word: καὶ ... καὶ
  choice: na ... na
  rationale: Njikọ ndị a na-achịkọta ndị so ya na ọnọdụ mmetụta abụọ ahụ, dịka usoro Grik si eme.
theological_decisions:
- issue: Nkọwa banyere mmetụta Jizọs n'ihe gbasara onye ọ bụ
  choice: A sụgharịrị okwu abụọ ahụ n'ụzọ kwụ ọtọ dịka ezigbo mwute na oké nchekasị mmadụ
  alternative: Ime ka okwu ahụ dị nro iji zere igosi nnukwu adịghị ike mmetụta uche, ma ọ bụ ime ka ọ sie ike ruo n'ịpụta ụjọ ma ọ bụ enweghị olileanya
  rationale: Isi mmalite na-egosi n'ezie iru újú na nhụjuanya dị ukwuu nke Jizọs. Nsụgharị ahụ ekwesịghị ibelata ezi mmadụ ya, ma ọ bụ tinyekwuo echiche nke enweghị olileanya nke okwu Grik na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. A hapụrụ aha 'ụmụ Zebedi abụọ' kama ịgbakwunye Jemis na Jọn. Enweghị akara nkọwa ala peeji n'ihi na ederede Igbo anaghị achọ ihe ọzọ iji doo isi okwu ahụ anya.
