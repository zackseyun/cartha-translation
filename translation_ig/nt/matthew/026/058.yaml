reference: Matthew 26:58
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: ig
  text: Ma Pita nọ na-eso ya site n'ebe dị anya, ruo n'ogige ụlọ nke nnukwu onye nchụàjà. Mgbe ọ banyere n'ime, ọ nọ ọdụ ya na ndị na-eje ozi[a], ka ọ hụ ihe ga-esi na ya pụta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị odibo,” “ndị na-enyere aka,” ma ọ bụ “ndị nche.” Okwu Grik ὑπηρέται nwere ike ịpụta ndị ọrụ nọ n'okpuru ndị isi ma ọ bụ ndị na-enyere ha aka; ọnọdụ akụkọ ahụ ga-enyere aka ịmata ihe ọ pụtara kpọmkwem.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ka ọ hụ njedebe ya.” Okwu Grik τὸ τέλος pụtara “njedebe” n'ụzọ nkịtị, ma n'ebe a o yikarịrị ka ọ na-ezo aka n'ihe ga-esi n'ihe a na-eme Jizọs pụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: nọ na-eso
  rationale: Ụdị imperfect na-egosi omume nọ na-aga n'ihu n'azụ akụkọ ahụ; “nọ na-eso” na-egosipụta nke a n'Igbo eke.
- source_word: ἀπὸ μακρόθεν
  choice: site n'ebe dị anya
  rationale: Nke a na-egosipụta anya dị n'etiti Pita na Jizọs n'ụzọ doro anya ma bụrụkwa okwu Igbo a na-aghọta ngwa ngwa.
- source_word: ἕως τῆς αὐλῆς
  choice: ruo n'ogige ụlọ
  rationale: “Ruo” na-echekwa echiche oke ebe ἕως, ebe “ogige ụlọ” na-egosi ogige mechiri emechi nke αὐλή pụtara n'ebe a.
- source_word: ἀρχιερέως
  choice: nnukwu onye nchụàjà
  rationale: Nke a bụ okwu Igbo doro anya maka onyeisi nchụàjà n'akụkọ ahụ, na-enweghị ịgbakwunye nkọwa ụka pụrụ iche.
- source_word: εἰσελθὼν ἔσω
  choice: Mgbe ọ banyere n'ime
  rationale: 'Nke a na-echekwa usoro omume ahụ: Pita buru ụzọ banye n''ime tupu a kọwaa na ọ nọ ọdụ.'
- source_word: ἐκάθητο
  choice: ọ nọ ọdụ
  rationale: Imperfect a na-akọwa ọnọdụ gara n'ihu; “ọ nọ ọdụ” na-egosipụta ọnọdụ ahụ karịa naanị omume ịnọdụ ala n'otu ntabi anya.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: n'etiti ndị na-eje ozi
  rationale: ὑπηρέται nwere ike ịpụta ndị nọ n'okpuru ndị isi na-arụ ọrụ ma ọ bụ na-enyere ha aka. Nhọrọ a na-echekwa obosara okwu ahụ n'emeghị ka ha bụrụ naanị ndị nche ma ọ bụ ndị ohu ụlọ.
- source_word: ἰδεῖν
  choice: ka ọ hụ
  rationale: Infinitive a na-egosi ebumnuche Pita; “ka ọ hụ” bụ ntụgharị kpọmkwem ma dịkwa eke n'Igbo.
- source_word: τὸ τέλος
  choice: ihe ga-esi na ya pụta
  rationale: N'ọnọdụ a τέλος nwere ike izo aka na njedebe ma ọ bụ nsonaazụ ihe a na-eme Jizọs; okwu a na-enye echiche nke outcome n'Igbo nke oge a.
theological_decisions:
- issue: Ihe τὸ τέλος na-ezo aka na ya
  choice: ihe ga-esi na ya pụta
  alternative: njedebe ya
  rationale: Ihe odide ahụ anaghị akọwapụta kpọmkwem ma Pita chọrọ ịhụ njedebe usoro ahụ ma ọ bụ ihe ga-eme Jizọs. A họọrọ okwu sara mbara nke na-adịghị etinye nkọwa ozizi ọzọ, ebe e debere ntụgharị nkịtị na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro akụkọ Grik na ọdịiche aspect dị n'etiti omume Pita nọ na-eme na ọnọdụ ịnọ ọdụ. E tinyere akara nkọwa [a] na okwu ὑπηρέται, tinyekwa [b] na τὸ τέλος, ka akara nke ọ bụla kwekọọ n'ihe nkọwa ya na-akọwa.
