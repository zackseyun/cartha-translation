    reason: lexical_alternative
  revision_rationale: The revision corrects the relational force of μετὰ from “among” to “with” and improves the natural Standard Igbo expression for the high priest’s courtyard. It retains the draft’s aspect-sensitive “nọ na-eso” and “nọ ọdụ,” as well as its suitably noncommittal rendering of τὸ τέλος and both correctly anchored lexical notes.
