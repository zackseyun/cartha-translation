- from: Ma mgbe ndị na-eso ụzọ ya hụrụ ihe ahụ, iwe were ha, ha sị, “Gịnị mere e ji laa ihe a n’iyi?”
  to: Ma mgbe ndị na-eso ụzọ hụrụ ihe ahụ, ha were iwe, sị, “Gịnị kpatara mmefusị a?”
  rationale: The revision removes the unexpressed possessive, retains the contextually supplied object of “hụrụ,” and renders the Greek rhetorical noun phrase “this waste” directly as “mmefusị a.” The footnote preserves the purposive nuance of Εἰς τί without changing the main text’s natural Igbo wording.
