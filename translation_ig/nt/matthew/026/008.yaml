  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ ἠγανάκτησαν λέγοντες· Εἰς τί ἡ ἀπώλεια αὕτη;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/008.yaml
  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: ig
  text: Ma mgbe ndị na-eso ụzọ hụrụ ihe ahụ, ha were iwe, sị, “Gịnị kpatara mmefusị a?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: mgbe ... hụrụ ihe ahụ
  rationale: A sụgharịrị aorist participle ahụ dị ka nkebiokwu na-egosi oge n’Igbo nkịtị. E tinyere “ihe ahụ” dịka ihe a hụrụ, n’ihi na Grik hapụrụ ya ka a ghọta ya site n’omume nwanyị ahụ.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi ntakịrị mgbanwe na mmegide dị n’etiti omume nwanyị ahụ na mmeghachi omume ndị na-eso ụzọ.
- source_word: οἱ μαθηταὶ
  choice: ndị na-eso ụzọ ya
  rationale: “Ndị na-eso ụzọ” bụ okwu Igbo doro anya maka μαθηταί. E tinyere “ya” maka ịdị mfe nghọta n’Igbo, ebe ihe gbara amaokwu ahụ gburugburu na-egosi na ha bụ ndị na-eso ụzọ Jizọs.
- source_word: ἠγανάκτησαν
  choice: iwe were ha
  rationale: Nkebiokwu a bụ ụzọ Igbo dị ndụ ma dị ebube isi kwuo oke iwe ma ọ bụ nnukwu enweghị afọ ojuju nke ἀγανακτέω na-egosi.
- source_word: λέγοντες
  choice: ha sị
  rationale: A gbanwere participle ahụ ka ọ bụrụ ngwaa na-esochi ya n’ụzọ Igbo na-asụkarị, n’enweghị ịgbanwe njikọ ya na iwe ha.
- source_word: Εἰς τί
  choice: Gịnị mere
  rationale: N’ebe a, okwu ahụ na-ajụ ihe mere e ji mee omume a, nke bụ ụzọ Igbo ebumpụta ụwa isi gosi “for what purpose?”
- source_word: ἡ ἀπώλεια αὕτη
  choice: e ji laa ihe a n’iyi
  rationale: “Ịla ihe n’iyi” na-egosi imefusị ihe bara uru, ma dabara n’ọnọdụ mmanụ otite ahụ a wụsara; ọ naghị amanye isi “mbibi” nke okwu ahụ nwere n’ọnọdụ ndị ọzọ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E jiri ahịrịokwu ọnụ ndị mmadụ na-asụ, “iwe were ha” na “laa ihe n’iyi,” mee ka mmeghachi omume na ajụjụ ahụ daa nke ọma n’Igbo.
