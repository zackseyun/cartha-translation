id: MAT.26.26
reference: Matthew 26:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: ig
  text: Mgbe ha na-eri nri[a], Jizọs weere achịcha, wee gọzie ya, nyawaa ya, wee nye ndị na-eso ụzọ, sị, “Werenụ, rienụ[c]; nke a bụ ahụ m[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ka ha na-eri nri.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “Werenụ ma rienụ.”
    reason: lexical_alternative
  - marker: d
    text: N’asụsụ Grik, ọ bụ kpọmkwem, “nke a bụ ahụ m.” Ụfọdụ na-akọwa ya dịka “nke a pụtara ahụ m” ma ọ bụ “nke a na-anọchi anya ahụ m,” ma nsụgharị a na-echekwa okwu isi mmalite.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: Mgbe ha nọ na-eri nri
  rationale: Nkebiokwu a na-egosi ihe ha nọ na-eme n’oge ahụ. Nsụgharị a bụ Igbo nkịtị ma na-echekwa echiche nke omume na-aga n’ihu; δέ ebe a bụ njikọ dị nro.
- source_word: λαβὼν
  choice: were
  rationale: A sụgharịrị participle a dị ka ngwaa nke na-aga n’usoro akụkọ, nke bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: ἄρτον
  choice: achịcha
  rationale: ἄρτος pụtara achịcha; ọ pụrụ izo aka n’otu ogbe achịcha n’ọnọdụ a, ma ‘achịcha’ bụ okwu sara mbara ma zie ezi.
- source_word: εὐλογήσας
  choice: gọzie ya
  rationale: Nke a na-echekwa echiche nke ịgọzi achịcha ahụ ma ghara ime ka okwu ahụ bụrụ kpọmkwem ‘inye ekele,’ ọ bụ ezie na echiche abụọ ahụ nwere ike ịdị nso n’ọnọdụ nri.
- source_word: ἔκλασεν
  choice: nyawaa ya
  rationale: Ngwaa ahụ pụtara ịnyawa ma ọ bụ ịgbaji achịcha. ‘Ya’ na-ezoghachi n’achịcha ahụ n’Igbo doro anya.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: nye ya ndị na-eso ụzọ ya
  rationale: A tụgharịrị participle ahụ ka ọ bụrụ ngwaa ọzọ n’usoro omume. ‘Ndị na-eso ụzọ ya’ na-eme ka ndị a maara okwu banyere ha doo anya n’Igbo.
- source_word: Λάβετε φάγετε
  choice: Werenụ, rienụ
  rationale: E debere iwu abụọ ahụ n’usoro ha si dị n’asụsụ Grik, n’enweghị ịtinye njikọ n’etiti ha.
- source_word: τοῦτό ἐστιν
  choice: nke a bụ
  rationale: ἐστιν bụ copula nkịtị, ya mere ‘bụ’ na-echekwa okwu isi mmalite ma ghara ịkọwa ya dịka ‘pụtara’ ma ọ bụ ‘na-anọchi anya.’
- source_word: τὸ σῶμά μου
  choice: ahụ m
  rationale: σῶμα bụ okwu nkịtị maka ‘ahụ,’ e dekwara nkwupụta nwe ya ozugbo dịka ‘m.’
theological_decisions:
- issue: Okwu Jizọs banyere achịcha na ahụ ya
  choice: nke a bụ ahụ m
  alternative: nke a pụtara ahụ m; nke a na-anọchi anya ahụ m
  rationale: Asụsụ Grik ji copula nkịtị ἐστιν. Nsụgharị ahụ na-echekwa okwu ya na esemokwu nkọwa okpukpe dị n’ime ya, kama idozi ya dịka otu echiche banyere Oriri Nsọ si chọọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ngwaa dị mkpirikpi—‘were, gọzie, nyawaa, nye’—iji mee ka akụkọ ahụ na-aga nke ọma, ma debe iwu abụọ ahụ ‘Werenụ, rienụ’ iche dịka ha dị n’asụsụ Grik.
