- from: Mgbe ha nọ na-eri nri[a], Jizọs were achịcha, gọzie ya[b], nyawaa ya, nye ya ndị na-eso ụzọ ya, sị, “Werenụ, rienụ[c]; nke a bụ ahụ m[d].”
  to: Mgbe ha na-eri nri[a], Jizọs weere achịcha, wee gọzie ya, nyawaa ya, wee nye ndị na-eso ụzọ, sị, “Werenụ, rienụ[c]; nke a bụ ahụ m[d].”
  rationale: The revision makes the past narrative sequence unambiguous in Standard Igbo and removes the non-explicit possessive. It preserves the source's syntax and theological ambiguity. Footnote b is retained as supplied, although its anchor is absent from the English audit text's otherwise disordered anchor sequence; no structural validation error was reported and no meaning-bearing footnote has been removed.
