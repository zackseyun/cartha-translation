source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: ig
  text: Ma ihe a niile emeela ka ihe e dere n’Akwụkwọ Nsọ nke ndị amụma wee mezuo. Mgbe ahụ, ndị na-eso ụzọ niile hapụrụ ya[a] wee gbapụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gbahapụrụ ya”; n’ọnọdụ a, okwu Grik ἀφέντες nwekwara ike ịpụta ịhapụ mmadụ kpamkpam.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Ma ihe a niile
  rationale: Nke a na-ezo aka n’ihe niile na-eme n’ọnọdụ ahụ; “Ma” na-egosipụta njikọ δέ n’ụzọ dị nro ma bụrụkwa Igbo nkịtị.
- source_word: γέγονεν
  choice: emeela
  rationale: Ụdị perfect a na-egosi ihe merela nke ihe ọ rụpụtara ka dị mkpa n’oge ahụ; “emeela” na-echekwa echiche ahụ n’Igbo.
- source_word: ἵνα πληρωθῶσιν
  choice: ka ... wee mezuo
  rationale: Nke a na-egosipụta ebumnuche ma ọ bụ nsonaazụ nke ἵνα tinyere subjunctive, na-enweghị ikpebi nke ha abụọ naanị.
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: ihe e dere n’Akwụkwọ Nsọ nke ndị amụma
  rationale: Nke a na-eme ka o doo anya na γραφαί bụ ihe odide dị nsọ, ma na-ahapụ genitive “nke ndị amụma” n’enweghị ịgbakwụnye na ha kwuru ya ma ọ bụ dere ya kpọmkwem.
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe sochiri ozugbo n’usoro akụkọ.
- source_word: οἱ μαθηταὶ πάντες
  choice: ndị na-eso ụzọ niile
  rationale: “Niile” na-echekwa nkwusi ike nke πάντες, na-enweghị ịgbakwụnye okwu nwe mmadụ nke na-adịghị na Grik.
- source_word: ἀφέντες αὐτὸν
  choice: hapụrụ ya
  rationale: “Hapụrụ ya” bụ okwu Igbo doro anya ma dị mfe; n’ọnọdụ a, ἀφέντες nwekwara ike ibu echiche siri ike nke ịgbahapụ mmadụ, nke e debere n’ala peeji.
- source_word: ἔφυγον
  choice: gbapụ
  rationale: “Gbapụ” na-egosipụta omume ịrịpụ ọsọ n’ihi egwu ma ọ bụ ihe ize ndụ, nke kwekọrọ na ἔφυγον.
theological_decisions:
- issue: Mmezu nke Akwụkwọ Nsọ ndị amụma
  choice: ka ihe e dere n’Akwụkwọ Nsọ nke ndị amụma wee mezuo
  alternative: ka ihe ndị amụma dere wee bụrụ eziokwu
  rationale: Nhọrọ a na-echekwa okwu mmezu nke Matiu na mkpa Akwụkwọ Nsọ na amụma nwere, kama ịtụgharị ya bụrụ naanị na ihe ahụ “ghọrọ eziokwu.” Ọ naghịkwa akọwa genitive ahụ karịa ihe Grik kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere usoro ahịrịokwu ahụ n’ụzọ na-asọ asọ n’Igbo, ma chekwaa njikọ “Ma,” okwu mmezu, ịdị n’otu nke ndị na-eso ụzọ niile, na ike nke omume ịgbapụ.
