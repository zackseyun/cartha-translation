  to: Ma ihe a niile emeela ka ihe e dere n’Akwụkwọ Nsọ nke ndị amụma wee mezuo. Mgbe ahụ, ndị na-eso ụzọ niile hapụrụ ya[a] wee gbapụ.
  rationale: 'Only a necessary grammatical correction has been made: "wee" now links "hapụrụ ya" with "gbapụ." The translation otherwise faithfully retains the source’s fulfillment language, the plural prophetic reference, and the disciples’ collective desertion and flight.'
