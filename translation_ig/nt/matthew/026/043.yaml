  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ⸂πάλιν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ βεβαρημένοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: ig
  text: Ọ bịakwara ọzọ, ọ hụrụ ha ka ha na-ehi ụra, n’ihi na anya ha dị arọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anya ha adịla arọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν πάλιν
  choice: Mgbe ọ lọghachiri ọzọ
  rationale: Nkebi a na-egosi na ọ bịara n’ebe ha nọ ọzọ. ‘Lọghachiri ọzọ’ na-eme ka nkwughachi nke πάλιν pụta ìhè n’Igbo nkịtị.
- source_word: εὗρεν αὐτοὺς
  choice: ọ hụrụ ha
  rationale: N’akụkọ a, εὗρεν pụtara na ọ bịara hụ ha n’ọnọdụ ahụ; ‘ọ hụrụ ha’ bụ ụzọ Igbo doro anya ma dị mfe.
- source_word: καθεύδοντας
  choice: ka ha na-ehi ụra
  rationale: Ọ bụ participle dị ugbu a nke na-akọwa ọnọdụ na-aga n’ihu mgbe ọ hụrụ ha; ‘ka ha na-ehi ụra’ na-echekwa echiche ahụ.
- source_word: ἦσαν γὰρ
  choice: n’ihi na ... dị
  rationale: γάρ na-enye ihe kpatara ọnọdụ ahụ. ‘N’ihi na’ na-egosipụta njikọ nkọwa a nke ọma n’Igbo.
- source_word: αὐτῶν οἱ ὀφθαλμοὶ
  choice: anya ha
  rationale: Nke a bụ usoro Igbo ebumpụta ụwa maka ‘their eyes.’
- source_word: βεβαρημένοι
  choice: dị arọ
  rationale: Perfect passive participle na-egosi ọnọdụ si na ịdị arọ pụta. N’Igbo, ‘anya ha dị arọ’ bụ akpaala okwu doro anya maka oke ụra, ma na-echekwa ihe oyiyi nke okwu Grik.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Mgbe ọ lọghachiri ọzọ’ iji mee ka usoro participle na πάλιν bụrụ Igbo ebumpụta ụwa; e debere ihe oyiyi nke anya dị arọ n’ahịrị bụ isi.
