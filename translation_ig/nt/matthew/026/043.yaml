review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the repeated coming, finding the disciples asleep, and the explanatory statement that their eyes were heavy. The proposed wording preserves the Greek participial flow without adding temporal precision beyond the source.
  naturalness: “Ọ bịakwara ọzọ” is a more direct and natural Standard Igbo equivalent for ἐλθὼν πάλιν than “Mgbe ọ lọghachiri ọzọ,” while retaining the narrative sense. “Ka ha na-ehi ụra” and “anya ha dị arọ” are idiomatic.
  terminology: No theological terminology occurs. The existing footnote’s “nke ukwuu” introduces an unsupported intensification; βεβαρημένοι denotes heaviness/being weighed down, not necessarily ‘very’ heavy. The revised note supplies a legitimate aspectual alternative.
  issues:
  - severity: medium
    issue: The footnote adds “nke ukwuu” (‘very’/‘excessively’).
    rationale: The Greek has no intensifier. A lexical alternative should not strengthen the meaning beyond βεβαρημένοι.
  - severity: low
    issue: “Mgbe ọ lọghachiri ọzọ” unnecessarily recasts the participial opening as a temporal clause and is less direct than needed.
    rationale: “Ọ bịakwara ọzọ” naturally represents ‘and, coming again,’ while maintaining the source’s narrative progression.
