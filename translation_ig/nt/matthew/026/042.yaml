    text: 'A pụkwara ịsụ ya: ‘ọ bụrụ na ọ gaghị ekwe omume ka nke a gafee ọ gwụla ma m aṅụọ ya.’'
    reason: lexical_alternative
  revision_rationale: The revision corrects the verbal tense and meaning, makes the opening idiomatic without collapsing either Greek repetition marker, and repairs the inaccurate cross-reference in footnote a. It retains the Greek ambiguity concerning the referent of 'this'/'it' and preserves the established prayer language.
