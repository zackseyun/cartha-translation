  to: Ọzọ, o si n'ebe ahụ pụọ gaa kpee ekpere nke ugboro abụọ, sị, “Nna m, ọ bụrụ na nke a[a] apụghị ịgafe ọ gwụla ma m aṅụ ya[b], ka e mee uche gị.”
  rationale: The revision corrects the verbal tense and meaning, makes the opening idiomatic without collapsing either Greek repetition marker, and repairs the inaccurate cross-reference in footnote a. It retains the Greek ambiguity concerning the referent of 'this'/'it' and preserves the established prayer language.
