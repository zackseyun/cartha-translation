  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάλιν ἐκ δευτέρου ἀπελθὼν προσηύξατο λέγων· Πάτερ μου, εἰ οὐ δύναται ⸀τοῦτο ⸀παρελθεῖν ἐὰν μὴ αὐτὸ πίω, γενηθήτω τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: ig
  text: Ọzọ, o si n'ebe ahụ pụọ gaa kpee ekpere nke ugboro abụọ, sị, “Nna m, ọ bụrụ na nke a[a] apụghị ịgafe ọ gwụla ma m aṅụ ya[b], ka e mee uche gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, iko ahụ e kwuru maka ya na Matiu 26:39; n’ebe a, okwu Grik kwuru naanị ‘nke a’ na ‘ya.’
    reason: cross_reference
  - marker: b
    text: 'A pụkwara ịsụ ya: ‘ọ bụrụ na ọ gaghị ekwe omume ka nke a gafee ọ gwụla ma m aṅụọ ya.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: Ọzọkwa, nke ugboro abụọ
  rationale: E debere ma echiche nke imeghachi ihe dị na πάλιν ma nke ‘ugboro abụọ’ dị na ἐκ δευτέρου, n’agbanyeghị ntakịrị nkwughachi ha nwere n’asụsụ Grik.
- source_word: ἀπελθὼν προσηύξατο
  choice: ọ pụrụ gaa kpee ekpere
  rationale: Nke a na-egosi na ọ hapụrụ ebe ahụ tupu o kpee ekpere, ma na-asụ ya n’usoro dị mfe ma bụrụkwa Igbo nkịtị.
- source_word: Πάτερ μου
  choice: Nna m
  rationale: Ọ bụ nsụgharị kpọmkwem na nke ebumpụta ụwa nke okwu nwa ji akpọ nna ya.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: ọ bụrụ na nke a apụghị ịgafe
  rationale: E debere ‘nke a’ dịka ihe odide Grik si kwuo, na-agbakwụnyeghị ‘iko’ n’ahịrịokwu ahụ; ‘apụghị ịgafe’ na-egosikwa enweghị ike ma ọ bụ enweghị ụzọ ọzọ.
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: ọ gwụla ma m aṅụ ya
  rationale: ‘Ọ gwụla ma’ na-egosipụta ọnọdụ ewezuga ihe ọzọ nke ἐὰν μή, ebe ‘ya’ na-alaghachi n’ihe a kpọrọ ‘nke a.’
- source_word: γενηθήτω τὸ θέλημά σου
  choice: ka e mee uche gị
  rationale: Nke a na-echekwa ike nke arịrịọ ahụ na nrubeisi Jizọs, ma kwekọọ n’okwu ekpere yiri ya na Matiu 6:10.
theological_decisions:
- issue: Ma a ga-akpọ ihe ahụ ‘iko’ n’ahịrịokwu bụ isi
  choice: E debere ‘nke a’ na ‘ya.’
  alternative: ‘iko a’ na ‘ya’
  rationale: Ọ bụ ezie na Matiu 26:39 mere ka o doo anya na ihe a bụ iko ahụhụ, amaokwu a n’onwe ya ekwughị ποτήριον (‘iko’). Ya mere, e debere enweghị nkọwa zuru ezu nke Grik, ma kọwaa ihe okwu ahụ na-ezo aka na ya n’okpuru peeji.
- issue: Ụdị okwu ekpere nke nrubeisi
  choice: ka e mee uche gị
  alternative: ka uche gị mezuo
  rationale: Nhọrọ a na-echekwa arịrịọ e nyere n’ụdị iwu ma na-ejikọ okwu a na Matiu 6:10 n’enweghị itinye nkọwa okwukwe ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E zere itinye ‘iko’ n’ahịrịokwu bụ isi n’ihi na aha ahụ adịghị n’amaokwu Grik a, ma e nyere nkọwa ya n’okpuru peeji.
