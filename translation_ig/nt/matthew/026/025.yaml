id: MAT.26.25
reference: Matthew 26:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: ig
  text: Mgbe ahụ, Judas, onye na-arara ya nye, zara sị, “Ọ bụghị m, Rabaị, ka ọ bụ?” Jizọs sịrị ya, “Ọ bụ gị kwuru ya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: onye na-arara ya nye
  rationale: Na-egosipụta onye ahụ nọ n’ọrụ ịrara Jizọs nye, dịka participle nke Greek si mee.
- source_word: Μήτι ἐγώ εἰμι
  choice: Ọ bụghị m ... ka ọ bụ?
  rationale: Μήτι na-egosi ajụjụ onye na-atụ anya azịza na-adịghị mma; usoro a bụ Igbo ebumpụta ụwa nke na-echekwa atụmanya ahụ.
- source_word: ῥαββί
  choice: Rabaị
  rationale: E debere aha nsọpụrụ Juu ahụ n’ụdị a na-asụgharị ụda ya, kama ịgbakwunye nkọwa pụrụ iche n’ime amaokwu ahụ.
- source_word: Σὺ εἶπας
  choice: Ọ bụ gị kwuru ya
  rationale: Na-echekwa azịza dị nkenke na nke a na-ekwu n’ụzọ na-apụtaghị nkwenye kpọmkwem karịa ihe Greek kwuru.
theological_decisions:
- issue: Ike azịza Jizọs, Σὺ εἶπας
  choice: Ọ bụ gị kwuru ya
  alternative: Ee, ọ bụ gị
  rationale: A họọrọ okwu nke na-esochi Greek nso ma na-echekwa mgbagwoju anya na nrụgide dị n’azịza ahụ, kama ime ya ka ọ bụrụ nkwenye doro anya karịa isi mmalite.
translation_notes:
  register: Igbo ọkọlọtọ, nke ugwu na nke ndị mmadụ taa na-aghọta. E jiri “Jizọs” mee ka onye kwuru azịza ahụ doo anya n’Igbo, ebe ọnọdụ mkparịta ụka Greek na-egosi na ọ bụ ya.
