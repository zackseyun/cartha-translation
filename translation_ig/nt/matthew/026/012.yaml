id: MAT.26.12
reference: Matthew 26:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: βαλοῦσα γὰρ αὕτη τὸ μύρον τοῦτο ἐπὶ τοῦ σώματός μου πρὸς τὸ ἐνταφιάσαι με ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: ig
  text: N’ihi na, mgbe nwanyị a wụsara mmanụ na-esi ísì ụtọ a n’ahụ m, o mere nke a iji kwadebe m maka olili m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “maka olili m.” Ngwaa Grik ahụ gụnyere echiche nke ịkwadebe ahụ mmadụ maka olili.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: mgbe ... wụsara
  rationale: N’ebe a, participle aorist nke βάλλω pụtara ịwụsa ma ọ bụ ite mmanụ ahụ, ọ bụghị ịtụ ya. Usoro a na-egosi ihe nwanyị ahụ mere n’Igbo doro anya.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata nkọwa Jizọs nyere banyere ihe nwanyị ahụ mere.
- source_word: αὕτη
  choice: nwanyị a
  rationale: Demonstrative ahụ na-arụtụ aka kpọmkwem n’ebe nwanyị ahụ nọ; “nwanyị a” na-echekwa ike ntụaka ahụ n’ụzọ eke.
- source_word: μύρον
  choice: mmanụ ọma
  rationale: μύρον bụ mmanụ na-esi ísì ụtọ e ji ete mmadụ. “Mmanụ ọma” bụ okwu Igbo a na-aghọta nke ọma ma kwekọọ n’ọnọdụ a.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: n’ahụ m
  rationale: ἐπί ya na genitive ebe a na-egosi ihe etinyere n’elu ma ọ bụ n’ahụ mmadụ.
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: iji kwadebe m maka olili m
  rationale: πρός tinyere infinitive nwere article na-egosi ebumnobi; ἐνταφιάζω gụnyere ịkwadebe ozu maka olili, ọ bụghị naanị ili ya.
- source_word: ἐποίησεν
  choice: o mere ya
  rationale: ποιέω na-ezo aka n’omume ịwụsa mmanụ ahụ; “o mere ya” na-ejikọta isi ngwaa ahụ na clause participle n’ụzọ Igbo dị mfe.
theological_decisions:
- issue: Ihe ἐνταφιάζω pụtara gbasara ọnwụ Jizọs
  choice: Omume nwanyị ahụ bụ nkwadebe maka olili Jizọs.
  alternative: Omume ahụ bụ naanị “maka olili m,” n’ebughị echiche nkwadebe pụta ìhè.
  rationale: Ngwaa Grik ahụ gụnyere echiche nke ịkwadebe ahụ mmadụ maka olili. Nsụgharị a na-echekwa ihe Jizọs kwuru tupu ọnwụ ya n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Mmanụ ọma” na-egosi mmanụ na-esi ísì ụtọ, ebe “kwadebe m maka olili m” na-eme ka ebumnobi nke usoro Grik pụta ìhè.
