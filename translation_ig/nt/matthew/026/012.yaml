  to: N’ihi na, mgbe nwanyị a wụsara mmanụ na-esi ísì ụtọ a n’ahụ m, o mere nke a iji kwadebe m maka olili m.[a]
  rationale: This limited revision improves lexical precision for μύρον and clarifies the resumptive main verb, while preserving the source’s explanatory, temporal-participial, and purposive relationships. The footnote retains the legitimate more compact alternative without overstating the lexical nuance.
