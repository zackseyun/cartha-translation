  yaml_path: translation/nt/matthew/026/005.yaml
  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: ig
  text: Ma ha nọ na-ekwu sị, “Ọ bụghị n’oge emume ahụ[a], ka ọgbaaghara[b] ghara ibilite n’etiti ndị mmadụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’oge mmemme ahụ.” Okwu Grik bụ ἑορτή, nke nwere ike ịpụta “emume” ma ọ bụ “mmemme” n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “mkpọtụ,” “nsogbu,” ma ọ bụ “ọgba aghara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: ha nọ na-ekwu
  rationale: Ụdị imperfect na-egosi okwu ha nọgidere na-ekwu mgbe ha na-atụle ihe ahụ; nke a na-echekwa echiche nke omume na-aga n’ihu karịa naanị ‘ha kwuru.’
- source_word: δέ
  choice: Ma
  rationale: Ọ na-egosi obere mgbanwe ma ọ bụ ntụgharị megide ihe dị n’amaokwu bu ụzọ.
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: Ọ bụghị n’oge emume ahụ
  rationale: Nkebi a bụ okwu mkpebi e kwuru n’enweghị ngwaa zuru ezu. ‘N’oge’ na-egosi oge ihe ga-eme, ebe ‘emume ahụ’ na-enye ἑορτή n’ụzọ Igbo dị mma n’ọnọdụ Emume Ngabiga.
- source_word: ἵνα μὴ
  choice: ka ... ghara
  rationale: Usoro Igbo a na-egosi ebumnuche nke izere ihe, n’enweghị iwepụ nghọta purposive nke Grik.
- source_word: θόρυβος
  choice: ọgbaaghara
  rationale: Okwu a pụtara mkpọtụ na ọgba aghara n’ihu ọha; ‘ọgbaaghara’ egosighị na ọ ga-abụrịrị nnupụisi zuru ezu.
- source_word: γένηται
  choice: ibilite
  rationale: N’ebe a γίνομαι pụtara na ihe malitere ma ọ bụ dapụta; ‘ibilite’ bụ okwu Igbo ebumpụta ụwa na nkebi a.
- source_word: ἐν τῷ λαῷ
  choice: n’etiti ndị mmadụ
  rationale: Ọ na-egosi na ọgbaaghara ahụ ga-adị n’etiti ọha mmadụ gbakọtara, ọ bụghị naanị n’ime otu onye.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị nsọ ma doo ndị nkịtị anya. ‘Ha nọ na-ekwu’ na-echekwa omume na-aga n’ihu nke imperfect; ‘ka ... ghara’ na-echekwa ebumnuche nke izere ọgbaaghara. E debere akara nkọwa [a] n’ebe ‘emume’ dị na [b] n’ebe echiche ọgbaaghara n’etiti ndị mmadụ dị, ka ha kwekọọ na ọdịnaya nke nkọwa ala peeji.
