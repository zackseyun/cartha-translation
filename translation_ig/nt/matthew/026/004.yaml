  text: καὶ συνεβουλεύσαντο ἵνα τὸν Ἰησοῦν δόλῳ κρατήσωσιν καὶ ἀποκτείνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/004.yaml
  text: and they conspired so that they might seize Jesus by stealth and kill him.
translation:
  language: ig
  text: Ha gbara izu ka ha jiri aghụghọ jide Jizọs ma gbuo ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: Ha gbara izu
  rationale: Nke a na-egosi na ha zukọrọ kpebie atụmatụ ha ga-eji mee ihe ahụ, n'Igbo dị mfe ma bụrụkwa nke e ji akọ nkata ọjọọ.
- source_word: δόλῳ
  choice: jiri aghụghọ
  rationale: Ọ na-edobe echiche nke ime ihe n'ụzọ aghụghọ ma ọ bụ nke nzuzo iji ghọgbuo onye ọzọ.
- source_word: κρατήσωσιν
  choice: jide
  rationale: N'ọnọdụ a, okwu ahụ pụtara ijide mmadụ n'ike ma tinye ya n'okpuru ọchịchị ha.
- source_word: ἀποκτείνωσιν
  choice: gbuo ya
  rationale: Nke a bụ nsụgharị doro anya na nke nkịtị maka ime ka mmadụ nwụọ.
theological_decisions:
- issue: Mmekọrịta ἵνα na ngwaa ndị na-esochi ya
  choice: ka ha jiri aghụghọ jide Jizọs gbuo ya
  alternative: ka ha wee jiri aghụghọ jide Jizọs ma gbuo ya
  rationale: A na-edobe ebumnuche nke izu ahụ n'ahịrịokwu ebumnuche ‘ka ha...’; njikọ ngwaa abụọ ahụ na-egosi na ijide na igbu bụ akụkụ nke otu atụmatụ ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dịkwa ùgwù. Ahịrịokwu ahụ dị nkenke dịka nke Grik, ma na-edobe echiche nke izu ọjọọ, aghụghọ, ijide, na igbu.
