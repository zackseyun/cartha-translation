  text: λέγοντες· Προφήτευσον ἡμῖν, χριστέ, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/068.yaml
  text: 'saying[a], “Prophesy to us, Messiah: who is it that struck you?”'
translation:
  language: ig
  text: 'na-asị, “Buoro anyị amụma, Onye e tere mmanụ: ònye kụrụ gị ihe?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: na-asị
  rationale: Okwu a bụ participle na-ewebata ihe ndị na-akwa Jizọs emo kwuru; ‘na-asị’ na-edobe njikọ ya na amaokwu bu ya ụzọ n’enweghị itinye njikọ okwu na-adịghị na Grik.
- source_word: Προφήτευσον
  choice: Buoro anyị amụma
  rationale: Imperative a na-enye iwu ka o kwuo ihe site n’ike amụma; n’ebe a, a na-eji ya akwa ya emo ma chọọ ka ọ mata onye kụrụ ya.
- source_word: ἡμῖν
  choice: anyị
  rationale: Dative a na-egosi ndị a ga-agwa amụma ahụ; e jikọtara ya n’usoro okwu Igbo eke, ‘buoro anyị amụma.’
- source_word: χριστέ
  choice: gị Onye e tere mmanụ
  rationale: Vocative χριστέ bụ aha ọkwá pụtara onye e tere mmanụ. Nsụgharị a na-eme ka ihe aha ọkwá ahụ pụtara doo onye Igbo anya ma na-edobe ụda ịkwa emo dị n’okwu ahụ.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: ònye kụrụ gị ihe?
  rationale: Ajụjụ a chọrọ ka a mata kpọmkwem onye tụrụ Jizọs ihe. ‘Kụrụ gị ihe’ bụ okwu Igbo doro anya ma kwekọọ na παίω n’enweghị ịkọwa ụdị ihe e ji tie ya, nke isi mmalite ekwughị.
theological_decisions:
- issue: Nsụgharị χριστέ dị ka aha ọkwá
  choice: Onye e tere mmanụ
  alternative: Kraịst; Mesaịa
  rationale: N’ebe a χριστέ bụ vocative e ji kpọọ Jizọs aha ọkwá n’ụzọ ịkwa emo, ọ bụghị naanị aha onwe onye. ‘Onye e tere mmanụ’ na-egosipụta ihe aha ọkwá ahụ pụtara ozugbo; ihe odide ala peeji na-enye ‘Kraịst’ dị ka nsụgharị ọzọ a na-ejikarị eme ihe.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro ‘gị Onye e tere mmanụ’ na-egosi na a na-akpọ onye ahụ okwu ozugbo, ebe colon na-edobe ike nke ajụjụ ịkwa emo sochiri ya.
