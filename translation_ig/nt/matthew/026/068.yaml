  verdict: revise
  source_fidelity: The draft accurately conveys the participial continuation, the mocking imperative to prophesy, the addressees (“anyị”), the titular vocative χριστέ, and the question identifying the person who struck Jesus. “Onye e tere mmanụ” is a sound semantic rendering of χριστέ and retains its title-like force.
  naturalness: '“Buoro anyị amụma” and “ònye kụrụ gị ihe?” are natural, clear Standard Igbo in this context. However, “gị Onye e tere mmanụ” is an awkward vocative construction: the independent pronoun “gị” is not needed before a direct title and can sound appositional rather than like the mockers’ address.'
  terminology: “Onye e tere mmanụ” appropriately translates the title rather than simply borrowing it. The note’s alternative “Kraịst” is useful, though it should identify it plainly as an alternative conventional rendering rather than imply that the Greek word itself is only an office-name.
