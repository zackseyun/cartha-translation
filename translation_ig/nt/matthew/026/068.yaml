    issue: Awkward vocative phrase “gị Onye e tere mmanụ”
    rationale: Greek χριστέ is a direct vocative title. In idiomatic Igbo, “Onye e tere mmanụ” alone, set off by commas, directly addresses the person more naturally. Removing “gị” does not change meaning.
