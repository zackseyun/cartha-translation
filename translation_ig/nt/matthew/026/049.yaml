id: MAT.26.49
reference: Matthew 26:49
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εὐθέως προσελθὼν τῷ Ἰησοῦ εἶπεν· Χαῖρε, ῥαββί· καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: ig
  text: Ozugbo ahụ, ọ bịakwutere Jizọs sị ya, “Ndeewo[a], Rabaị,” wee susuo ya ọnụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ekele dịrị gị.”
    reason: lexical_alternative
  - marker: b
    text: 'Ngwaa Grik a nwere ike igosi nsusu ọnụ e mesiri ike ma ọ bụ nke e mere ugboro ugboro: “susuo ya ọnụ nke ukwuu” ma ọ bụ “susuo ya ọnụ ugboro ugboro.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Ozugbo ahụ
  rationale: Nke a na-egosi na ihe ahụ mere n’egbughị oge, ma na-adakwa nke ọma n’Igbo nke oge a.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: ọ bịakwutere Jizọs
  rationale: “Bịakwutere” na-egosi ịbịaru mmadụ nso ma ọ bụ ịgakwuru ya, nke kwekọrọ n’omume ahụ dị n’asụsụ Grik.
- source_word: εἶπεν
  choice: sị ya
  rationale: Ọ bụ ụzọ Igbo si ekwu okwu mmadụ gwara onye ọzọ; “ya” na-eme ka okwu ahụ doo anya n’enweghị ịgbatị echiche ya.
- source_word: Χαῖρε
  choice: Ndeewo
  rationale: N’ebe a, okwu ahụ bụ ekele a na-ekele mmadụ, ọ bụghị iwu ka onye ahụ ṅụrịa ọṅụ. “Ndeewo” bụ ekele dị ugbu a, kwanye ùgwù, ma bụrụkwa nke ndị nkịtị na-aghọta.
- source_word: ῥαββί
  choice: Rabaị
  rationale: E debere aha nsọpụrụ Semitik ahụ n’ụdị a na-asụgharị ụda ya, kama ịgbanwe ya ozugbo ka ọ bụrụ “Onye Ozizi.”
- source_word: κατεφίλησεν αὐτόν
  choice: susuo ya ọnụ
  rationale: Nke a bụ ụzọ Igbo doro anya si ekwu na ọ makụrụ ya ọnụ; ọdịdị ngwaa Grik nwere ike igosi nsusu ọnụ siri ike ma ọ bụ nke e mere ugboro ugboro, ya mere e tinyere nkọwa ahụ n’ala peeji.
theological_decisions:
- issue: Ihe Χαῖρε pụtara n’ekele Judas
  choice: Ndeewo
  alternative: Ekele diri gị; Ṅụrịa ọṅụ
  rationale: Ọ bụ usoro ekele mmadụ n’ọnọdụ a, ọ bụghị nkwupụta okwukwe ma ọ bụ iwu nke mmụọ. Nsụgharị ahụ na-ahapụ aghụghọ dị n’omume Judas ka akụkọ ahụ n’onwe ya gosipụta ya.
- issue: Ike ma ọ bụ ugboro dị na κατεφίλησεν
  choice: susuo ya ọnụ
  alternative: susuo ya ọnụ nke ukwuu; susuo ya ọnụ ugboro ugboro
  rationale: Ngwaa Grik nwere ike ịbụ nke e mesiri ike ma ọ bụ nke na-egosi ime ya ugboro ugboro, ma ọ bụghị ihe doro anya nke na a ga-ahọrọ naanị otu n’ime ha n’ahịrịokwu bụ isi. Ya mere, e debere okwu nkịtị n’ahịrịokwu ma chekwaa nghọtahie ndị ahụ n’ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe ma dị ùgwù. “Ndeewo” na-enye ekele nkịtị, ebe “Rabaị” na-echekwa aha nsọpụrụ dị na isi mmalite. Akara nkọwa [a] na [b] dị n’ebe okwu ha na-akọwa pụtara kpọmkwem.
