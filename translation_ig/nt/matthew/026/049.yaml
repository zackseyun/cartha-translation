  source_fidelity: 'The rendering preserves the sequence and force of the Greek: εὐθέως is conveyed by “Ozugbo ahụ”; προσελθὼν τῷ Ἰησοῦ by “ọ bịakwutere Jizọs”; Judas’s conventional greeting Χαῖρε is appropriately rendered “Ndeewo”; and κατεφίλησεν is rendered with the ordinary term for kissing while its possible intensive or iterative force is retained in a note. No unwarranted theological interpretation is introduced.'
