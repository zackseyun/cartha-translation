  yaml_path: translation/nt/matthew/026/020.yaml
  text: When evening came[a], he reclined at the table with the twelve disciples.
translation:
  language: ig
  text: Mgbe chi jiri, Jizọs so ndị na-eso ụzọ iri na abụọ dabere n’oche iri nri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ odide na-ekwu naanị, “ya na ndị iri na abụọ,” kama ịsị, “ya na ndị na-eso ụzọ iri na abụọ.”
    reason: textual_variant
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Mgbe chi jiri
  rationale: Nkebiokwu a na-egosi oge ihe ahụ mere. Nke a bụ ụzọ Igbo nkịtị si ekwu ya n'ụzọ doro anya ma dịkwa n'okike.
- source_word: ἀνέκειτο
  choice: nọdụrụ ala iri nri
  rationale: Okwu Grik a na-ekwu maka ịdabere ma ọ bụ ịnọdụ n'ọnọdụ e ji eri nri n'oge ahụ. Nsụgharị a na-eme ka ebumnuche iri nri doo onye Igbo anya n'enweghị ịkọwa ya dị ka naanị idina ala.
- source_word: μετὰ
  choice: na
  rationale: N'ebe a, μετά na genitive pụtara iso ndị ọzọ nọ; njikọ 'na' bụ ụzọ Igbo dị mfe ma kwekọọ n'echiche ahụ.
- source_word: τῶν δώδεκα μαθητῶν
  choice: ndị na-eso ụzọ ya iri na abụọ
  rationale: μαθητής bụ onye na-amụta ihe n'aka onye nkụzi ma na-eso ya; 'ndị na-eso ụzọ ya' bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị eme ihe. A sụgharịrị μαθητῶν dị na ederede SBLGNT kama ịhapụ ya.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ 'nọdụrụ ala iri nri' ka ọ kọwaa omenala iri nri e zoro aka na ya n'okwu Grik n'ụzọ onye Igbo nkịtị ga-aghọta.
