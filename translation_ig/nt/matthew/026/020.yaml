    reason: textual_variant
  revision_rationale: The revision replaces the general expression for sitting down to eat with wording that communicates reclining at a meal, the sense of ἀνέκειτο. It also makes the manuscript footnote more idiomatic while preserving its anchor, scope, and textual-critical meaning.
