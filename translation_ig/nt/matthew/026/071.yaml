  text: ἐξελθόντα ⸀δὲ εἰς τὸν πυλῶνα εἶδεν αὐτὸν ἄλλη καὶ λέγει ⸀τοῖς ἐκεῖ· ⸀Οὗτος ἦν μετὰ Ἰησοῦ τοῦ Ναζωραίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: ig
  text: Ma mgbe ọ pụtachara gaa n’ọnụ ụzọ ámá, nwanyị ọzọ hụrụ ya, sị ndị nọ ebe ahụ, “Nwoke a so Jizọs onye Nazaret nọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλῶνα
  choice: ọnụ ụzọ ámá
  rationale: Ọ na-ezo aka n'akụkụ ụzọ mbata ma ọ bụ ọnụ ụzọ ámá nke ogige ahụ; okwu a bụ nke doro ndị Igbo anya n'ọnọdụ a.
- source_word: λέγει
  choice: wee sị
  rationale: Ọ bụ ugbu a akụkọ ihe mere eme n'asụsụ Grik; n'Igbo, ụdị gara aga na-eme ka akụkọ ahụ na-aga nke ọma n'ụzọ ebumpụta ụwa, n'agbanyeghị na isi mmalite ji ugbu a.
- source_word: τοῦ Ναζωραίου
  choice: onye Nazaret
  rationale: Na-echekwa njirimara Jizọs site n'obodo Nazaret n'ụzọ Igbo dị mfe ma doo anya.
- source_word: ἦν μετά
  choice: na ... nọkọrọ
  rationale: Na-egosi na nwoke ahụ so Jizọs nọ, na-enweghị ịgbakwunye nkọwa banyere ụdị mmekọrịta ha.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere usoro akụkọ ahụ nke ọma, ebe a tụgharịrị ugbu a akụkọ ihe mere eme λέγει n'ụdị gara aga nke Igbo maka ịdị ebumpụta ụwa.
