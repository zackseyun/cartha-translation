id: MAT.26.65
reference: Matthew 26:65
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: ig
  text: Mgbe ahụ, onyeisi nchụàjà dọwara uwe ya[a], sị, “O kwulu Chineke! Olee mkpa ọzọ anyị nwere maka ndị akaebe?[b] Lee, ugbu a unu anụla nkwulu ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ịdọwa uwe n’ihu ọha bụ ihe mmadụ na-eme iji gosi oke ịtụ n’anya, iru újú, ma ọ bụ iwe.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “Gịnị mere anyị ka ji chọọ ndị akaebe ọzọ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ njikọ oge na-egosi ihe mere ozugbo n’usoro akụkọ ahụ.
- source_word: ὁ ἀρχιερεὺς
  choice: onyeisi nchụàjà
  rationale: Nke a bụ aha ọrụ onye nọ n’ọkwa kachasị elu n’etiti ndị nchụàjà, ọ bụghị naanị otu n’ime ndị nchụàjà ukwu.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: dọwara uwe ya
  rationale: “Dọwara” na-egosi omume ịdọka uwe; “uwe ya” bụ ụzọ Igbo si ekwu maka uwe mmadụ n’ozuzu ya, n’agbanyeghị na okwu Grik dị n’ụbara.
- source_word: λέγων
  choice: sị
  rationale: Nke a na-ejikọta okwu onyeisi nchụàjà kwuru na omume ịdọwa uwe ya n’ụzọ Igbo sitere n’okike.
- source_word: Ἐβλασφήμησεν
  choice: O kwulu Chineke
  rationale: “Ikwulu Chineke” bụ okwu Igbo doro anya maka ebubo ikwu okwu megide nsọpụrụ Chineke; ọ na-egosipụta ebubo onyeisi nchụàjà n’enweghị ikwu na onye na-akọ akụkọ kwadoro ya.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: Olee mkpa ọzọ anyị nwere maka ndị akaebe?
  rationale: Nke a na-edobe ụdị ajụjụ Grik na echiche nke ‘mkpa ọzọ,’ ma bụrụkwa okwu Igbo dị ùgwù ma doo anya.
- source_word: ἴδε νῦν
  choice: Lee, ugbu a
  rationale: “Lee” na-akpọ ndị na-ege ntị ka ha tụlee ihe ahụ; “ugbu a” na-edobe nkwusi ike banyere oge dị na Grik.
- source_word: ἠκούσατε τὴν βλασφημίαν
  choice: unu anụla nkwulu ahụ
  rationale: “Unu anụla” na-egosi na ndị a ka nụrụ ya ma na a na-eji ihe ha nụrụ eme ihe akaebe ugbu a; “nkwulu ahụ” na-edobe aha ebubo ahụ.
theological_decisions:
- issue: Otu e si sụgharịa βλασφημέω na βλασφημία
  choice: O kwulu Chineke / nkwulu ahụ
  alternative: O kwuru okwu nkwulu / okwu nkwulu ahụ
  rationale: Nhọrọ a na-edobe ịdị arọ nke ebubo okpukpe na nke ikpe onyeisi nchụàjà kwuru. Ọ bụ okwu onyeisi nchụàjà ka amaokwu ahụ na-akọ, ọ bụghị nkwenye onye na-akọ akụkọ na Jizọs mere nkwulu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. E deziri akara ala ala peeji ka akara nke nkọwa omenala soro ‘uwe ya,’ ebe akara nke nsụgharị ọzọ soro ajụjụ banyere ndị akaebe.
