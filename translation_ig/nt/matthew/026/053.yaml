  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: ig
  text: Ma ị chere na enweghị m ike ịrịọ Nna m[a], na ọ ga-enye m ozugbo ihe karịrị legịọn iri na abụọ[b] nke ndị mmụọ ozi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ịkpọku Nna m” ma ọ bụ “ịrịọ Nna m ka o nyere m aka.”
    reason: lexical_alternative
  - marker: b
    text: Legịọn bụ nnukwu ngalaba ndị agha Rom. Okwu a na-emesi ike n’ọnụ ọgụgụ buru ibu nke ndị agha eluigwe.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: Ka
  rationale: N'ime ajụjụ a na-ajụ iji maa onye ahụ aka, “Ka” na-ejikọta okwu a nke ọma na ịdọ aka ná ntị bu ya ụzọ ma na-eweta nhọrọ ọzọ.
- source_word: δοκεῖς
  choice: ì chere
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kpọmkwem isi kwuo echiche dị n'ajụjụ okwu ọnụ.
- source_word: οὐ δύναμαι
  choice: enweghị m ike
  rationale: Ọ na-egosi ikike, ọ bụghị ikike e nyere mmadụ ma ọ bụ njikere ime ihe.
- source_word: παρακαλέσαι
  choice: ịrịọ
  rationale: N'ebe a, ọ pụtara ịkpọku ma ọ bụ ịrịọ Nna ka o nye enyemaka; “ịrịọ” bụ okwu Igbo doro anya ma dịkwa mma n'okwu a.
- source_word: τὸν πατέρα μου
  choice: Nna m
  rationale: Ọ na-echekwa mmekọrịta Jizọs na Nna ya n'ụzọ dị nkenke na nke ebumpụta ụwa n'Igbo.
- source_word: παραστήσει μοι
  choice: ya ewepụtaara m
  rationale: Ọ na-egosi na Nna ga-eme ka ndị mmụọ ozi ahụ dị njikere inyere ya aka, na-enweghị ịgbakwunye echiche na ọ ga-eziga ha nke okwu Grik ekwughị kpọmkwem.
- source_word: ἄρτι
  choice: ozugbo
  rationale: Ọ na-egosi ngwa ngwa na nnweta enyemaka ahụ ugbu a.
- source_word: πλείω δώδεκα
  choice: ihe karịrị ... iri na abụọ
  rationale: Ọ na-echekwa nkọwa ọnụ ọgụgụ nke karịrị iri na abụọ.
- source_word: λεγιῶνας
  choice: legịọn
  rationale: E debere aha ngalaba agha Rom ahụ iji chekwaa ihe atụ agha dị n'okwu mbụ.
- source_word: ἀγγέλων
  choice: ndị mmụọ ozi
  rationale: N'ọnọdụ a, ọ bụ ndị ozi si n'eluigwe ka okwu ahụ na-ezo aka, ọ bụghị ndị ozi mmadụ.
theological_decisions:
- issue: Ma okwu Jizọs ọ na-ekwu maka enweghị ikike, enweghị ohere, ka ọ bụ enweghị njikere ịkpọku enyemaka Chineke
  choice: “enweghị m ike ịrịọ Nna m” — e debere ya dịka ajụjụ banyere ikike
  alternative: Ịsụgharị ya dịka na Jizọs achọghị ịrịọ, ma ọ bụ na e kweghị ya ịrịọ
  rationale: 'δύναμαι na-ekwu maka ike ma ọ bụ ikike ime ihe. Nsụgharị ahụ na-echekwa esemokwu dị n''okwu ahụ: Jizọs nwere ike ịkpọku enyemaka dị ukwuu, ma njide ya abụghị n''ihi enweghị ike.'
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta. Ajụjụ ahụ ka bụ ajụjụ ịma aka. E debere “legịọn” iji chekwaa ihe atụ ndị agha Rom, ma kọwaa ya n'ala ala peeji.
