revisions:
- from: Ka ì chere na enweghị m ike ịrịọ Nna m[a], ya ewepụtaara m ozugbo ihe karịrị ndị mmụọ ozi legịọn iri na abụọ[b]?
  to: Ma ị chere na enweghị m ike ịrịọ Nna m[a], na ọ ga-enye m ozugbo ihe karịrị legịọn iri na abụọ[b] nke ndị mmụọ ozi?
  rationale: The revision preserves the source’s rhetorical challenge and its emphasis on Jesus’ ability to appeal to his Father. It clarifies the future provision of aid and corrects the Igbo noun order so that “more than twelve” unambiguously modifies “legions,” while retaining the established military image and both footnote anchors.
