id: MAT.26.11
reference: Matthew 26:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: ig
  text: N’ihi na ndị ogbenye na-anọnyere unu mgbe niile[a], ma ọ bụghị mgbe niile ka mụ na unu nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị mmadụ ogbenye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Nkebiokwu a na-egosi ịdịgide ma ọ bụ ịdị adị n’oge niile, ma na-echekwa nkwughachi ya n’ahịrịokwu abụọ ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta okwu a na nke bu ya ụzọ dị ka ihe kpatara ya ma ọ bụ nkọwa ya.
- source_word: τοὺς πτωχοὺς
  choice: ndị ogbenye
  rationale: Ọ na-ezo aka n’ìgwè ndị mmadụ dara ogbenye; nke a bụ ụzọ doro anya ma bụrụkwa nke e ji asụ Igbo ugbu a.
- source_word: ἔχετε
  choice: nọnyere unu / agaghị anọnyere unu
  rationale: N’ebe a, ngwaa ahụ na-egosi ịnọ nso na ịdị onye ahụ n’etiti ha, ọ bụghị inwe ya dịka ihe onwunwe. Ịsụ ya dịka ‘ịnọnyere’ bụ Igbo eke ma na-echekwa echiche nke ahịrịokwu abụọ ahụ.
- source_word: μεθ’ ἑαυτῶν
  choice: nọnyere unu
  rationale: Ọ na-egosi na ndị ogbenye nọ n’etiti ha ma ọ bụ ha na ha nọ; ‘nọnyere unu’ bụ okwu Igbo dị mfe ma kwekọọ na ọnọdụ ahụ.
- source_word: ἐμὲ
  choice: mụ onwe m
  rationale: Nnọchiaha a na-ezo aka n’ebe Jizọs nọ ma nwee nkwusi ike; ‘mụ onwe m’ na-egosipụta nkwusi ike ahụ n’ụzọ eke.
- source_word: δὲ
  choice: ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ịdị ndị ogbenye mgbe niile na obere oge Jizọs ga-anọnyere ha n’anụ ahụ.
- source_word: οὐ πάντοτε
  choice: agaghị ... mgbe niile
  rationale: Ụdị a na-egosipụta na ọnọdụ ahụ agaghị adịgide mgbe niile ma na-echekwa ọdịiche ya na πάντοτε nke mbụ.
theological_decisions:
- issue: Ihe okwu a na-egosi banyere ịnọnyere ha nke Jizọs
  choice: Okwu ahụ na-egosi ọdịiche dị n’etiti ịdị ndị ogbenye n’etiti ndị na-eso ụzọ mgbe niile na obere oge Jizọs ga-anọnyere ha n’anụ ahụ.
  alternative: Ịghọta okwu ahụ dịka ileda ilekọta ndị ogbenye anya.
  rationale: Asụsụ Grik na-eme ọdịiche nke oge; ọ naghị ekwu na ndị ogbenye adịghị mkpa. Nsụgharị ahụ na-ahapụ ịdị arọ nke oge pụrụ iche nke ọnwụ Jizọs na-eru nso n’etinyeghị ozizi ọzọ n’ime ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Nọnyere unu’ na-ebute echiche nke παρουσία/availability nke ἔχετε n’ọnọdụ a karịa nsụgharị nkịtị nke ga-adị ka inwe mmadụ dịka ihe onwunwe.
