revisions:
- from: N’ihi na ndị ogbenye nọnyere unu mgbe niile[a], ma mụ onwe m agaghị anọnyere unu mgbe niile.
  to: N’ihi na ndị ogbenye na-anọnyere unu mgbe niile[a], ma ọ bụghị mgbe niile ka mụ na unu nọ.
  rationale: The revised text preserves the explanatory “N’ihi na,” the repeated “mgbe niile,” and the contrast between the poor being continually with the disciples and Jesus not being with them at all times. It represents the Greek present-tense construction naturally in Standard Igbo and does not add a future-tense claim. The footnote now provides a real lexical alternative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders γάρ, the collective reference to the poor, and the contrast marked by δέ. However, “agaghị anọnyere unu” changes the present-tense οὐ πάντοτε ἔχετε (“you do not always have”) into a future assertion (“will not be with you”). The revision retains the source’s present temporal contrast without denying its immediate narrative implication.
  naturalness: “Ọ bụghị mgbe niile ka mụ na unu nọ” is natural Standard Igbo and clearly contrasts with the continuing presence of the poor. It avoids an unnecessarily emphatic “mụ onwe m” and the future auxiliary in the draft.
  terminology: “Ndị ogbenye” is an appropriate modern Standard Igbo collective term for τοὺς πτωχούς. “Nọnyere unu” appropriately conveys presence/availability here rather than possession. The footnote is revised to give a genuine lexical alternative for “ndị ogbenye.”
  issues:
  - severity: medium
    issue: The wording “mụ onwe m agaghị anọnyere unu mgbe niile” uses future negation.
    rationale: οὐ πάντοτε ἔχετε is present tense and means that Jesus is not continually available to them. Although the context anticipates his departure, a future-only rendering narrows and alters the Greek grammatical expression.
  - severity: low
    issue: The existing footnote does not supply the stated lexical alternative.
    rationale: “Unu na ndị ogbenye nọ mgbe niile” rearranges and weakens the clause rather than offering an alternative rendering of τοὺς πτωχούς. “Ndị mmadụ ogbenye” is a valid explicit alternative.
  revised_text: N’ihi na ndị ogbenye na-anọnyere unu mgbe niile[a], ma ọ bụghị mgbe niile ka mụ na unu nọ.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị mmadụ ogbenye.”
    reason: lexical_alternative
  revision_rationale: The revised text preserves the explanatory “N’ihi na,” the repeated “mgbe niile,” and the contrast between the poor being continually with the disciples and Jesus not being with them at all times. It represents the Greek present-tense construction naturally in Standard Igbo and does not add a future-tense claim. The footnote now provides a real lexical alternative.
