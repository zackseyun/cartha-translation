source:
  edition: SBLGNT
  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: ig
  text: Ọ hapụrụ ha ọzọ[a], wee pụọ gaa kpee ekpere nke ugboro atọ, na-ekwu otu okwu ahụ ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ hapụrụ ha, wee pụọ ọzọ gaa.” N'usoro okwu Grik, “ọzọ” nwere ike ịkọwa ma “hapụrụ ha” ma ọ bụ “pụọ gaa.”
    reason: textual_syntax
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: Ọ hapụrụ ha
  rationale: Nkebi a na-egosi na Jizọs hapụrụ ndị na-eso ụzọ ya n'ebe ahụ; ntụgharị a bụ nke doro anya ma na-edobe usoro omume ahụ.
- source_word: πάλιν
  choice: ọzọ
  rationale: Okwu a na-egosi mmeghachi omume; e debere ya n'ebe abụọ ọ pụtara n'ihe odide Grik.
- source_word: ἀπελθὼν
  choice: pụọ gaa
  rationale: Nke a na-egosi na ọ siri n'ebe ha nọ pụọ gaa ebe ọzọ, n'asụsụ Igbo dị mfe ma kwekọọ n'akụkọ ahụ.
- source_word: προσηύξατο
  choice: kpee ekpere
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke kwesịrị ekwesị isi kwuo omume ikpe ekpere.
- source_word: ἐκ τρίτου
  choice: nke ugboro atọ
  rationale: Ọ na-egosi na nke a bụ oge nke atọ o mere omume ahụ.
- source_word: τὸν αὐτὸν λόγον
  choice: otu okwu ahụ
  rationale: A họọrọ ụdị otu-ọgụgụ iji debe λόγον nke dị n'otu-ọgụgụ, ma ‘okwu’ nwekwara ike ịpụta ihe e kwuru ma ọ bụ ọdịnaya okwu ahụ.
- source_word: εἰπὼν
  choice: na-ekwu
  rationale: Ọ na-ejikọta ihe o kwuru na ekpere o kpere n'ụzọ na-aga were were n'Igbo.
theological_decisions:
- issue: Nkwughachi ekpere
  choice: E debere na ọ gara ọzọ, kpee ekpere nke ugboro atọ, ma kwuo otu okwu ahụ ọzọ.
  alternative: A pụrụ iwepụ ‘ọzọ’ nke ikpeazụ iji mee ka ahịrịokwu dị nro.
  rationale: Ihe odide Grik nwere πάλιν ugboro abụọ; idebe ha abụọ na-egosipụta nkwughachi ahụ n'enweghị ịgbakwunye nkọwa ozizi.
- issue: Ihe λόγον pụtara n'okwu a
  choice: otu okwu ahụ
  alternative: otu ihe ahụ; otu okwu ndị ahụ
  rationale: ‘Otu okwu ahụ’ na-edobe ụdị otu-ọgụgụ nke Grik ma hapụkwa ohere ka ọ pụta ihe e kwuru ma ọ bụ ọdịnaya ekpere ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. E debere nkwughachi ‘ọzọ’ abụọ nke ihe odide Grik, ma jiri nkọwa ala peeji gosi na ọnọdụ ‘ọzọ’ nke mbụ nwere ike ịdị iche n'usoro ahịrịokwu.
