  rationale: The revision improves the Igbo narrative flow with “wee” and replaces an overly definite syntactic footnote with one that accurately preserves the ambiguity of the first πάλιν. Both Greek occurrences of πάλιν remain represented, as do the third prayer and the repeated same saying.
