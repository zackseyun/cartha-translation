id: MAT.26.18
reference: Matthew 26:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: ig
  text: Ọ sịrị, “Gaanụ n’obodo ahụ, jekwurunụ otu nwoke, sị ya, ‘Onye Ozizi sịrị, “Oge m dị nso. Aga m eme ememme Ngabiga n’ebe ị nọ, mụ na ndị na-eso ụzọ m.”’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Gaanụ
  rationale: Ọ bụ iwu ka ọtụtụ mmadụ gaa; ‘Gaanụ’ bụ Igbo doro anya ma kwekọọ n’ihe a na-eziga ha ime.
- source_word: πρὸς τὸν δεῖνα
  choice: jekwuru otu nwoke
  rationale: ‘Otu nwoke’ na-egosi onye a kapịrị ọnụ ma a kpọghị aha ya; ọ naghị ada ka okwu mkparị ma ọ bụ okwu nkịtị gabiga ókè.
- source_word: Ὁ διδάσκαλος
  choice: Onye Ozizi
  rationale: Nke a na-echekwa aha ọrụ διδάσκαλος dị ka onye na-akụzi, n’enweghị ịgbanwe ya ka ọ bụrụ ‘Onyenweanyị.’
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: Oge m dị nso
  rationale: Ọ na-echekwa okwu ahụ n’obosara ya, ghara ịkọwa ma ọ bụ ọnwụ Jizọs, nri Ngabiga, ma ọ bụ mmezu ozi ya ka a na-ekwu kpọmkwem.
- source_word: πρὸς σὲ
  choice: m ga-anọnyere gị
  rationale: Nke a na-ejigide echiche bụ́ ‘n’ebe gị/nyere gị’ n’enweghị itinye ‘ụlọ gị,’ nke adịghị kpọmkwem n’asụsụ Grik.
- source_word: ποιῶ τὸ πάσχα
  choice: mee ememme Ngabiga
  rationale: ποιέω na πάσχα bụ akpaalaokwu pụtara idebe ma ọ bụ ime ememme Ngabiga; Igbo a bụ nke ebumpụta ụwa ma na-egosi emume ahụ.
- source_word: τὸ πάσχα
  choice: ememme Ngabiga
  rationale: ‘Ngabiga’ bụ aha Igbo a na-aghọta maka ememme ndị Juu a; ‘ememme’ na-eme ka ọrụ ya n’akpaalaokwu doo anya.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: mụ na ndị na-eso ụzọ m
  rationale: ‘Ndị na-eso ụzọ’ bụ okwu Igbo a nabatara nke ọma maka μαθηταί, ma na-echekwa mmekọrịta ha na Jizọs.
theological_decisions:
- issue: Ihe ‘oge m’ (καιρός μου) pụtara
  choice: Oge m dị nso
  alternative: Oge a kara aka nye m dị nso; Elekere m eruola nso
  rationale: Amaokwu ahụ na-egosi na oge ahụ na-eru nso, ma ọ naghị akọwa kpọmkwem ma ọ bụ ọnwụ ya, nri Ngabiga, ma ọ bụ njedebe sara mbara nke ozi ya. Nsụgharị a na-echekwa oghere ahụ.
- issue: Ebe a ga-eme Ngabiga n’okwu πρὸς σὲ
  choice: m ga-anọnyere gị mee ememme Ngabiga
  alternative: m ga-eme ememme Ngabiga n’ụlọ gị
  rationale: Ihe gbara ya gburugburu nwere ike ịpụta n’ụlọ onye ahụ, ma Grik kwuru n’ụzọ sara mbara ‘nyere gị/n’ebe gị.’ A naghị etinye ‘ụlọ’ n’ahịrị isi ka e wee ghara imechi ihe ederede hapụrụ n’ụzọ sara mbara.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji usoro okwu ebumpụta ụwa mee ka njikọ abụọ nke ‘with’ ghara ịdị arọ, ma e chekwara ọdịiche dị n’etiti ‘Onye Ozizi,’ ‘oge,’ na ememme Ngabiga.
