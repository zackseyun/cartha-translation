revisions:
- from: Ọ sịrị, “Gaanụ n’obodo ahụ, jekwuru otu nwoke, sị ya, ‘Onye Ozizi kwuru, “Oge m dị nso. Mụ na ndị na-eso ụzọ m ga-anọnyere gị mee ememme Ngabiga.”’”
  to: Ọ sịrị, “Gaanụ n’obodo ahụ, jekwurunụ otu nwoke, sị ya, ‘Onye Ozizi sịrị, “Oge m dị nso. Aga m eme ememme Ngabiga n’ebe ị nọ, mụ na ndị na-eso ụzọ m.”’”
  rationale: The revision corrects the tense of λέγει, consistently marks the plural imperatives, and uses idiomatic Standard Igbo for the contextual force of πρὸς σέ while preserving its lack of an explicit reference to a house. It retains the source ambiguity of ‘my time’ and the established rendering of Passover and disciples.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:54Z'
review_pass:
  verdict: revise
  source_fidelity: A few targeted corrections are needed. λέγει is present tense (‘says’), not the past ‘kwuru’; and the plural command following ‘Gaanụ’ should be explicitly plural. The rendering of πρὸς σέ should retain its contextual locative/hospitality sense without adding ‘house.’
  naturalness: The draft is generally clear Standard Igbo. ‘M ga-anọnyere gị mee ememme Ngabiga’ is understandable, but ‘aga m eme ememme Ngabiga n’ebe ị nọ’ is more idiomatic for the intended setting and avoids suggesting merely remaining in someone’s company.
  terminology: ‘Onye Ozizi,’ ‘oge m dị nso,’ ‘ememme Ngabiga,’ and ‘ndị na-eso ụzọ m’ are appropriate, established, and theologically noninterpretive. ‘N’ebe ị nọ’ preserves the source’s non-specificity about a house.
  issues:
  - severity: medium
    issue: ‘Onye Ozizi kwuru’ renders λέγει with a past-tense verb.
    rationale: 'The Greek has the present λέγει, functioning as the content of the message: ‘The Teacher says.’ Standard Igbo ‘Onye Ozizi sịrị’ preserves this.'
  - severity: low
    issue: ‘jekwuru’ does not clearly mark the plural addressees after ‘Gaanụ.’
    rationale: Ὑπάγετε is plural, and the coordinated instruction remains addressed to the disciples. ‘jekwurunụ’ makes this explicit and natural.
  - severity: low
    issue: ‘ga-anọnyere gị mee ememme’ can overemphasize staying with the man rather than the contextual location of the meal.
    rationale: πρὸς σέ is literally ‘to/with you’ and contextually indicates the man’s place or hosting, without explicitly naming a house. ‘n’ebe ị nọ’ gives this sense without adding ‘ụlọ.’
  revised_text: Ọ sịrị, “Gaanụ n’obodo ahụ, jekwurunụ otu nwoke, sị ya, ‘Onye Ozizi sịrị, “Oge m dị nso. Aga m eme ememme Ngabiga n’ebe ị nọ, mụ na ndị na-eso ụzọ m.”’”
  revised_footnotes: []
  revision_rationale: The revision corrects the tense of λέγει, consistently marks the plural imperatives, and uses idiomatic Standard Igbo for the contextual force of πρὸς σέ while preserving its lack of an explicit reference to a house. It retains the source ambiguity of ‘my time’ and the established rendering of Passover and disciples.
