revisions:
- from: Ma Pita zara ya, sị, “Ọ bụrụgodị na mmadụ niile adaa n’ihi gị, mụ onwe m agaghị ada ma ọlị.”[a]
  to: Ma Pita zara ya, sị, “Ọ bụrụgodị na ha niile sụọ ngọngọ n’ihi gị, mụ onwe m agaghị asụ ngọngọ ma ọlị.”[a]
  rationale: The revision limits “all” to the contextually intended group without adding an explicit noun absent from the Greek. It uses the same broad, metaphorical rendering for both instances of σκανδαλίζω and revises the footnote so that its alternatives accurately describe the Greek verb’s range without introducing a mismatched plural construction.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:05Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter’s reply, the concessive force of εἰ, the causal/relational sense of ἐν σοί, Peter’s emphatic self-contrast, and the force of οὐδέποτε. However, “mmadụ niile” expands πάντες to all people, whereas the context concerns the other disciples. “Ha niile” preserves the source’s unexpressed but contextually delimited referent. Rendering σκανδαλίζω as “sụọ ngọngọ” more directly retains the verb’s metaphor and breadth in both occurrences.
  naturalness: “Ma Pita zara ya, sị” and “Ọ bụrụgodị na …” are natural Standard Igbo. “Ha niile” is more idiomatic and contextually apt than “mmadụ niile.” The repeated “sụọ ngọngọ” is clear, dignified, and suitable for biblical register.
  terminology: “Sụọ ngọngọ” is preferable here because it reflects the underlying metaphor without deciding whether the failure is offense, defection, or final apostasy. The footnote has been corrected to give alternatives appropriate to the singular/passive form in the verse; its previous wording (“mee ka ha…”) introduced an unsuitable plural active formulation.
  issues:
  - severity: medium
    issue: “mmadụ niile” is too broad for πάντες in context.
    rationale: It ordinarily means “all people,” while Peter contrasts himself with the other disciples who are expected to stumble. The Greek leaves the group implicit but does not mean humanity in general.
  - severity: medium
    issue: The footnote’s alternative “mee ka ha sụọ ngọngọ” does not match the form or reference of the verse.
    rationale: The verse uses a singular future passive verb for Peter and a third-person plural future passive verb for “all”; the footnote’s active causative plural wording is not a direct alternative at the marked occurrence. A lexical note should state the semantic range without altering participant reference.
  revised_text: Ma Pita zara ya, sị, “Ọ bụrụgodị na ha niile sụọ ngọngọ n’ihi gị, mụ onwe m agaghị asụ ngọngọ ma ọlị.”[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ngwaa a, “daa,” “kpasuo ya iwe,” ma ọ bụ “mee ka ọ sụọ ngọngọ.” N’ebe a, ọ pụrụ ịpụta ịsụ ngọngọ, ikpasu iwe, ma ọ bụ ịla azụ n’iso mmadụ.
    reason: lexical_alternative
  revision_rationale: The revision limits “all” to the contextually intended group without adding an explicit noun absent from the Greek. It uses the same broad, metaphorical rendering for both instances of σκανδαλίζω and revises the footnote so that its alternatives accurately describe the Greek verb’s range without introducing a mismatched plural construction.
