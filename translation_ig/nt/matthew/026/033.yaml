  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: ig
  text: Ma Pita zara ya, sị, “Ọ bụrụgodị na ha niile sụọ ngọngọ n’ihi gị, mụ onwe m agaghị asụ ngọngọ ma ọlị.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ngwaa a, “daa,” “kpasuo ya iwe,” ma ọ bụ “mee ka ọ sụọ ngọngọ.” N’ebe a, ọ pụrụ ịpụta ịsụ ngọngọ, ikpasu iwe, ma ọ bụ ịla azụ n’iso mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Ma Pita zara ya, sị
  rationale: Nke a na-asụgharị usoro okwu Grik nke pụtara n'ụzọ nkịtị ‘Pita zara wee sị ya’ n’Igbo dị ire ma dịkwa n'okike; ‘Ma’ na-egosi ọdịiche dị n’etiti amụma Jizọs na nzaghachi Pita.
- source_word: Εἰ πάντες
  choice: Ọ bụrụgodị na mmadụ niile
  rationale: ‘Ọ bụrụgodị’ na-eburu ike nkwenye ọnọdụ dị na okwu Pita, ebe ‘mmadụ niile’ na-ezo aka n’ìgwè ndị na-eso ụzọ n’akụkụ a.
- source_word: σκανδαλισθήσονται
  choice: adaa
  rationale: N’ebe a ngwaa ahụ na-egosi ịsụ ngọngọ ruo n’ịhapụ iguzosi ike n’akụkụ Jizọs. ‘Adaa’ bụ okwu Igbo dị mfe nke na-edobe ma ihe atụ nke ịsụ ngọngọ ma echiche nke ịla azụ, na-enweghị ịkọwa ya dị ka ịjụ okwukwe kpamkpam.
- source_word: ἐν σοί
  choice: n’ihi gị
  rationale: N’usoro okwu a, ἐν σοί na-egosi onye ihe ahụ sitere n’ihi ya ma ọ bụ onye ọnọdụ ahụ metụtara; ‘n’ihi gị’ bụ Igbo doro anya ma dị n'okike.
- source_word: ἐγὼ
  choice: mụ onwe m
  rationale: Nnochiaha Grik a bụ nke e kwusiri ike ma na-eme ka Pita dị iche n’ebe ‘mmadụ niile’ nọ; ‘mụ onwe m’ na-echekwa nkwusi ike ahụ.
- source_word: οὐδέποτε σκανδαλισθήσομαι
  choice: agaghị ada ma ọlị
  rationale: ‘Ma ọlị’ na-egosipụta nkwusi ike nke οὐδέποτε, ebe ikwughachi ‘ada’ na-echekwa otu ngwaa ahụ e ji mee ihe ugboro abụọ n’ahịrịokwu Grik.
theological_decisions:
- issue: Otu e si asụgharị σκανδαλίζω n’ọnọdụ ọdịda nke onye na-eso ụzọ
  choice: adaa
  alternative: sụọ ngọngọ; laa azụ; hapụ gị
  rationale: ‘Adaa’ na-echekwa obosara ihe ngwaa Grik nwere ike ịpụta—ịsụ ngọngọ, iwe iwe n’ihi mmadụ, ma ọ bụ ịla azụ n’ikwesị ntụkwasị obi. Ọ naghị ekpebi ma ọdịda ahụ ọ̀ bụ ịjụ okwukwe ikpeazụ, ya mere ọ na-echekwa esemokwu nkà mmụta okpukpe dị n’ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘mụ onwe m’ chekwaa nkwusi ike Pita, ma e zere okwu ụka pụrụ iche nke nwere ike imechi obosara ihe σκανδαλίζω pụtara.
