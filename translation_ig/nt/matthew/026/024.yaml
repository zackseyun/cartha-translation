id: MAT.26.24
reference: Matthew 26:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: ig
  text: Nwa nke Mmadụ na-ala dịka e dere banyere ya, ma ahụhụ ga-adịrị nwoke ahụ onye a ga-esi n'aka ya rara Nwa nke Mmadụ nye![a] Ọ gaara akara nwoke ahụ mma ma a sị na a mụghị nwoke ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye a ga-esi n'aka ya nyefee Nwa nke Mmadụ.” Ngwaa Grik ahụ pụrụ ịpụta “ịrara nye” ma ọ bụ, n'ụzọ nkịtị karị, “inyefe”; a họọrọ “rara ... nye” ebe a n'ihi na aghụghọ Judas ka a na-ekwu banyere ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: E jigidere aha-ọkwa a maara nke ọma; usoro ahịrịokwu Igbo na njikọ “ma” na-egosipụta ọdịiche μὲν...δὲ n'ụzọ eke.
- source_word: ὑπάγει
  choice: na-ala
  rationale: Na-edobe ngwaa oge ugbu a ma ghara ịkọwa ya kpọmkwem dị ka ọnwụ, ọ bụ ezie na ọnọdụ ahụ na-atụ aka n'ahụhụ Jizọs na-abịa.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: dịka e dere banyere ya
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị egosi ihe e dere nke ka dị ire.
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: ma ahụhụ ga-adịrị nwoke ahụ
  rationale: “Ahụhụ ga-adịrị” na-eburu ike amụma na ikpe dị na οὐαί; “nwoke ahụ” na-edobe onye nwoke a kapịrị ọnụ na ike demonstrative ἐκείνῳ.
- source_word: δι’ οὗ
  choice: onye a ga-esite n'aka ya
  rationale: Na-egosipụta agency nke διά na genitive n'Igbo eke.
- source_word: παραδίδοται
  choice: rara ... nye
  rationale: N'ọnọdụ a, okwu ahụ na-egosi nrara Judas nyeere Jizọs, ma ọ ka nwekwara echiche nke inyefe ya n'aka ndị ọzọ; ndetu ala na-echekwa nhọrọ sara mbara ahụ.
- source_word: καλὸν ἦν αὐτῷ
  choice: Ọ gaara akara ... mma
  rationale: Akpaalaokwu Igbo a na-egosipụta ihe gaara akacha mma n'ọnọdụ megidere eziokwu.
- source_word: εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: ma a sị na a mụghị ya
  rationale: Na-edobe ọnọdụ megidere eziokwu na echiche doro anya nke amụghị nwoke ahụ.
theological_decisions:
- issue: Mmekọrịta dị n'etiti ihe e dere na ibu ọrụ mmadụ
  choice: E debere ma na Nwa nke Mmadụ na-ala dịka e dere banyere ya, ma na onye rara ya nye nọ n'okpuru ahụhụ.
  alternative: Ịkọwa ya n'ụzọ ga-eme ka ihe e dere kagbuo ibu ọrụ Judas, ma ọ bụ ka omume Judas belata mmezu Akwụkwọ Nsọ.
  rationale: Grik na-edobe eziokwu abụọ ahụ ọnụ; nsụgharị ahụ anaghị edozi esemokwu nkà mmụta okpukpe karịa ihe amaokwu ahụ kwuru.
- issue: Ike okwu ikpeazụ banyere amụghị ya
  choice: E sụgharịrị ya dị ka okwu ikpe siri ike n'etinyeghị nkwubi okwu nkà mmụta okpukpe ọzọ.
  alternative: Ịkpọ ya naanị ikwubiga okwu ókè, ma ọ bụ iji ya kwado ozizi zuru ezu amaokwu ahụ ekwughị.
  rationale: Nsụgharị ahụ na-echekwa ịdị arọ nke ikpe ahụ n'ebughị ụzọ kọwaa ihe ederede ahụ ahapụghị n'ụzọ doro anya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “Nwa nke Mmadụ” mee aha-ọkwa ahụ, “ahụhụ ga-adịrị” mee okwu ikpe amụma, ma zere okwu ụka nke otu denominashọn.
