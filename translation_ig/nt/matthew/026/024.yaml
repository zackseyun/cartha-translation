revisions:
- from: Nwa nke Mmadụ na-ala dịka e dere banyere ya, ma ahụhụ ga-adịrị nwoke ahụ onye a ga-esite n'aka ya rara Nwa nke Mmadụ nye![a] Ọ gaara akara nwoke ahụ mma ma a sị na a mụghị ya.
  to: Nwa nke Mmadụ na-ala dịka e dere banyere ya, ma ahụhụ ga-adịrị nwoke ahụ onye a ga-esi n'aka ya rara Nwa nke Mmadụ nye![a] Ọ gaara akara nwoke ahụ mma ma a sị na a mụghị nwoke ahụ.
  rationale: The revision corrects the Standard Igbo future construction in both the text and its footnote, without altering the source meaning. It also repeats 'nwoke ahụ' in the final counterfactual clause to preserve the Greek's emphatic repeated reference to the man under woe.
