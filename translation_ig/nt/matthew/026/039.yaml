id: MAT.26.39
reference: Matthew 26:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: ig
  text: Ọ gara n’ihu ntakịrị, wee daa kpuo ihu n’ala[a], na-ekpe ekpere, na-asị, “Nna m, ọ bụrụ na ọ ga-ekwe omume, ka iko a[b] gabiga m; ma ọ bụghị dị ka m si chọọ, kama dị ka gị si chọọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ dara ihu ya n’ala.”
    reason: lexical_alternative
  - marker: b
    text: “Iko” bụ ihe oyiyi Akwụkwọ Nsọ maka oke e kenyere mmadụ, karịsịa ahụhụ; tulee Matiu 20:22 na 26:42.
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: Ọ gara n’ihu ntakịrị
  rationale: Nke a na-egosi na ọ gara n’ihu obere anya, ma na-asụ ya n’ụzọ Igbo nke oge a si ada nke ọma.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: daa n’ala kpuo ihu ya n’ala
  rationale: Nke a na-echekwa ọnọdụ ahụ nke mmadụ ji ahụ dum daa n’ala, ihu ya echee ala, ya bụ ịkpọ isiala n’ụzọ miri emi.
- source_word: προσευχόμενος καὶ λέγων
  choice: na-ekpe ekpere, na-asị
  rationale: Ụdị ngwaa ndị a na-egosi ihe ọ na-eme n’otu mgbe ahụ, ma nsụgharị a bụkwa Igbo doro anya ma dịkwa ebube.
- source_word: Πάτερ μου
  choice: Nna m
  rationale: Nke a na-echekwa ma mmekọ chiri anya ma nkwanye ùgwù dị n’okwu Grik ahụ, n’etinyeghị mmetụta ọzọ na-adịghị na ya.
- source_word: εἰ δυνατόν ἐστιν
  choice: ọ bụrụ na ọ ga-ekwe omume
  rationale: Nke a na-asụpụta ahịrịokwu Grik ahụ n’uju n’Igbo eke, na-agbakwụnyeghị ihe a na-ekwughị.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: ka ... gabiga m
  rationale: Nke a na-enye arịrịọ ahụ ma na-echekwa echiche nke ihe ahụ ịgafe ya kama ịbịakwasị ya.
- source_word: τὸ ποτήριον τοῦτο
  choice: iko a
  rationale: E debere ihe oyiyi nkịtị nke ‘iko’ ka njikọ ya na oke e kenyere mmadụ, karịsịa ahụhụ, ghara ịla n’iyi.
- source_word: πλὴν
  choice: ma
  rationale: N’ebe a, ‘ma’ na-eweta mgbanwe siri ike site n’arịrịọ ahụ gaa n’ido onwe ya n’okpuru ọchịchọ Nna, n’ụzọ dị nkenke ma bụrụ Igbo eke.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: ọ bụghị dị ka m si chọọ, kama dị ka gị si chọọ
  rationale: Nke a na-echekwa ọdịiche dị n’etiti ọchịchọ Jizọs na ọchịchọ Nna, ma na-emeju ngwaa a hapụrụ n’akụkụ nke abụọ ka okwu ahụ doo anya n’Igbo.
theological_decisions:
- issue: Ihe ‘iko’ pụtara n’ekpere Jizọs
  choice: E debere ‘iko a’ n’isiokwu ahụ
  alternative: ahụhụ a; akara aka a
  rationale: ποτήριον bụ ihe oyiyi Akwụkwọ Nsọ maka oke e kenyere mmadụ, nke na-abụkarị ahụhụ. Ịhapụ ya dịka ‘iko’ na-echekwa omimi na njikọ Akwụkwọ Nsọ ya n’akọwaghị ya gabiga ókè.
- issue: Ọchịchọ Jizọs n’ihe metụtara ọchịchọ Nna
  choice: A sụgharịrị θέλω dịka ‘chọọ’ ma debe ọdịiche ahụ n’ụzọ yiri nke Grik
  alternative: masị; chọrọ ime
  rationale: ‘Chọọ’ bụ okwu Igbo eke nke na-egosi ezi ọchịchọ, ebe ahịrịokwu ahụ dum na-echekwa ido ọchịchọ Jizọs n’okpuru nke Nna n’enweghị ime ka esemokwu dị n’okwu ahụ dị larịị.
translation_notes:
  register: E ji Standard Igbo nke oge a, doro anya ma dị ùgwù. A zere okwu ụka pụrụ iche, ma debe ihe oyiyi ‘iko’ na esemokwu dị n’etiti arịrịọ Jizọs na ido onwe ya n’okpuru ọchịchọ Nna.
