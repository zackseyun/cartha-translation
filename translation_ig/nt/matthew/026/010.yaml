  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: ig
  text: Ma Jizọs matara nke a wee sị ha, “Gịnị mere unu ji enye nwanyị a nsogbu? N’ihi na o meere m ọrụ ọma.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọrụ mara mma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: matara nke a
  rationale: Aorist participle ahụ na-egosi na Jizọs ghọtara ihe ha na-ekwu; ‘nke a’ na-ezo aka n’ọnọdụ dị n’amaokwu ndị gbara ya gburugburu.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị nwere obere mmegide site n’ntamu ndị na-eso ụzọ gaa n’azịza Jizọs.
- source_word: Τί κόπους παρέχετε τῇ γυναικί
  choice: Gịnị mere unu ji enye nwanyị a nsogbu?
  rationale: Nke a bụ ụzọ Igbo dị ndụ si kwuo idiom ahụ nke pụtara ịkpatara nwanyị ahụ nsogbu ma ọ bụ ịta ya ahụhụ.
- source_word: ἔργον καλὸν
  choice: ezi ọrụ mara mma
  rationale: ‘Ezi ọrụ mara mma’ na-ejigide ma ịdị mma omume ahụ ma ịdị mma na ịdị kwesị ekwesị nke καλός, n’enweghị ịtinye nkọwa ozizi ọzọ.
- source_word: ἠργάσατο
  choice: o meere
  rationale: Okwu a na-egosi omume e mezuru; n’Igbo, ‘o meere’ dabara nke ọma na onye omume ahụ metụtara.
- source_word: εἰς ἐμέ
  choice: m
  rationale: N’usoro ‘o meere m,’ ọ na-egosi na Jizọs bụ onye e meere omume ahụ, ma na-anọgide nso na echiche nke ntụzịaka ma ọ bụ mmekọrịta dị na εἰς ἐμέ.
theological_decisions:
- issue: Ntụle omume nwanyị ahụ
  choice: ezi ọrụ mara mma
  alternative: ọrụ ọma
  rationale: Nhọrọ a na-echekwa otuto Jizọs nyere omume ahụ na ndò nke καλός nke nwere ike ịpụta ihe ọma, mara mma, ma kwesị ekwesị, n’enweghị iweta echiche banyere uru nzọpụta ma ọ bụ emume nsọ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị nsọ ma dị mfe nghọta. ‘Inye mmadụ nsogbu’ bụ okwu nkịtị ma doo anya; ‘ezi ọrụ mara mma’ na-echekwa obosara καλός karịa ‘ọrụ ọma’ naanị.
