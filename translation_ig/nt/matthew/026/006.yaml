source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γενομένου ἐν Βηθανίᾳ ἐν οἰκίᾳ Σίμωνος τοῦ λεπροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/006.yaml
  text: While Jesus was in Bethany[a], in the house of Simon the leper[b],
translation:
  language: ig
  text: Mgbe Jizọs nọ na Betani[a], n'ụlọ Saịmọn onye ekpenta[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Mgbe Jizọs nọ na Betani.” Ihe owuwu genitive absolute n'asụsụ Grik na-eme ka oge na ọnọdụ akụkọ ahụ pụta ìhè.
    reason: lexical_alternative
  - marker: b
    text: “Onye ekpenta” na-egosipụta okwu Grik e ji mara Saịmọn; okwu ahụ n'onwe ya ekwughị ma ọrịa ahụ ka dị ya n'oge ahụ, ka ọ̀ bụ na ọ dịbu ya.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: Mgbe Jizọs nọ
  rationale: Nkebiokwu genitive absolute a na-egosi oge ma na-eme ka ebe akụkọ na ọnọdụ ya doo anya. “Mgbe Jizọs nọ” bụ Igbo dị mfe ma kwekọọ n'ike okwu ahụ n'enweghị ịsụgharị γίνομαι n'ụzọ siri ike dịka “mgbe ọ ghọrọ.”
- source_word: δὲ
  choice: E gosipụtaghị ya iche n'okwu Igbo
  rationale: δὲ bụ njikọ dị nro nke na-ebufe akụkọ n'ọnọdụ ọzọ, ọ bụghị mgbochi siri ike. N'Igbo, ịmalite ozugbo na “Mgbe” na-ebufe mgbanwe ahụ n'ụzọ ebumpụta ụwa, na-enweghị itinye “ugbu a” nke nwere ike iyi ka ọ bụ okwu oge doro anya.
- source_word: ἐν Βηθανίᾳ
  choice: na Betani
  rationale: Nke a bụ ntụaka ebe kwụ ọtọ; “na Betani” bụ ụzọ Igbo si egosi ịnọ n'otu ebe.
- source_word: ἐν οἰκίᾳ
  choice: n'ụlọ
  rationale: οἰκία ebe a na-ekwu maka ụlọ dị ka ebe ihe ahụ mere; “n'ụlọ” bụ nsụgharị doro anya ma bụrụ nke ndị Igbo na-asụkarị.
- source_word: Σίμωνος
  choice: Saịmọn
  rationale: Genitive ahụ na-egosi na ụlọ ahụ bụ nke Saịmọn. Nhazi Igbo “n'ụlọ Saịmọn” na-egosi nke a n'ụzọ ebumpụta ụwa.
- source_word: τοῦ λεπροῦ
  choice: onye ekpenta
  rationale: λεπρός bụ aha njirimara e nyere Saịmọn. “Onye ekpenta” na-edobe aha njirimara ahụ nkenke, ma ihe odide ahụ ekwughị ma ọrịa ahụ ka dị ya mgbe ahụ ma ọ bụ na ọ dịbu ya.
theological_decisions:
- issue: Ma aha njirimara Saịmọn ọ̀ na-egosi na ekpenta ka dị ya mgbe ahụ
  choice: E debere “Saịmọn onye ekpenta” n'enweghị ịkọwa oge ọnọdụ ahụ
  alternative: Saịmọn, onye bụbu onye ekpenta; ma ọ bụ Saịmọn, nwoke nwere ọrịa akpụkpọ ahụ
  rationale: Okwu Grik na-enye naanị aha njirimara, ọ naghị ekwu ma ekpenta ahụ ka dị ya, ma ọ bụ na a gwọọla ya. Ya mere, nsụgharị ahụ ekwesịghị itinye akụkọ ọgwụgwọ ma ọ bụ ụdị nchọpụta ọrịa nke oge a na-adịghị n'ihe odide ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “Mgbe Jizọs nọ” iji mee ka okwu oge ahụ dị nro ma kwekọọ n'asụsụ Igbo. A hapụrụ ahịrịokwu ahụ ka ọ kwụsị na rikoma n'ihi na Matiu 26:6 bụ mmalite nke ahịrịokwu na-aga n'ihu na amaokwu na-esote.
