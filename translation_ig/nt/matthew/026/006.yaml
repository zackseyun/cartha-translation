  verdict: revise
  source_fidelity: The verse translation accurately renders the temporal genitive absolute, both locative phrases, Simon’s possessive relation to the house, and λεπροῦ as an identifying epithet without asserting whether Simon’s condition was current or former. The mild connective δέ may naturally remain implicit in Igbo. Footnote a, however, offers “bịara nọrọ” as an alternative; this introduces a coming/arrival nuance that the Greek construction does not require.
  naturalness: “Mgbe Jizọs nọ na Betani, n'ụlọ Saịmọn onye ekpenta,” is clear, idiomatic Standard Igbo, and its final comma properly retains the verse’s syntactic continuation into verse 7. The revised footnote uses more natural and precise wording.
  terminology: Jizọs, Betani, Saịmọn, ụlọ, and onye ekpenta are suitable Standard Igbo biblical terms. “Onye ekpenta” preserves the source’s conventional epithet; the note appropriately avoids a claim of current disease, prior healing, or modern diagnostic precision.
  issues:
  - severity: low
    issue: Footnote a’s proposed alternative “Mgbe Jizọs bịara nọrọ na Betani” adds an arrival nuance.
    rationale: Τοῦ ... γενομένου is a genitive absolute functioning here as a temporal scene-setting expression. It can be rendered “mgbe Jizọs nọ” or “mgbe Jizọs nọ na Betani,” but does not require “bịara” (“came”).
