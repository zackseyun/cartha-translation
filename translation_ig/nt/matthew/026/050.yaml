revisions:
- from: Ma Jizọs sịrị ya[a], “Enyi, mee ihe ị bịara ime.” Mgbe ahụ, ha bịarutere, jide Jizọs aka, wee nwụchie ya.
  to: Ma Jizọs sịrị ya[a], “Enyi, mee ihe ị bịara ime.” Mgbe ahụ, ha bịakwutere, bikwasa Jizọs aka, wee jide ya.
  rationale: The revision replaces an expression that means holding Jesus’ hand with the idiomatic arrest-context expression “bikwasa Jizọs aka,” and it renders the following κρατέω with “jide ya.” This retains the Greek narrative’s two actions—laying hands on Jesus and seizing him—while preserving the draft’s careful handling of the ambiguous saying to Judas.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:19Z'
review_pass:
  verdict: revise
  source_fidelity: The first clause and Jesus’s address faithfully represent the Greek, and the footnote appropriately preserves the disputed interrogative understanding of ἐφ’ ὃ πάρει. However, “jide Jizọs aka” ordinarily means to hold Jesus’ hand, rather than the arresting-party action of laying hands on him. “Nwụchie ya” can also introduce a more formal arrest/detention sense and, following “jide ... aka,” does not clearly preserve the two distinct Greek actions.
  naturalness: “Ha bịakwutere” is more natural and precise than “ha bịarutere” for approaching a person. “Bikwasa Jizọs aka” is an idiomatic Standard Igbo expression for laying hands on someone, and “jide ya” clearly conveys the subsequent seizure.
  terminology: “Enyi” suitably renders the restrained vocative Ἑταῖρε without asserting intimate friendship. “Mee ihe ị bịara ime” is a defensible main-text rendering of the compressed clause. The revised arrest sequence distinguishes laying hands on Jesus from seizing him without adding legal or doctrinal interpretation.
  issues:
  - severity: medium
    issue: “jide Jizọs aka” is semantically misleading.
    rationale: In ordinary Igbo it means holding Jesus’ hand, whereas ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν describes the group putting their hands on him to take hold of him.
  - severity: low
    issue: “nwụchie ya” is less exact in this sequence.
    rationale: It can suggest formal arrest or detention, while ἐκράτησαν αὐτόν directly states that they seized/held him. “Jide ya” preserves this physical action and follows the idiomatic preceding phrase naturally.
  revised_text: Ma Jizọs sịrị ya[a], “Enyi, mee ihe ị bịara ime.” Mgbe ahụ, ha bịakwutere, bikwasa Jizọs aka, wee jide ya.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Enyi, gịnị ka ị bịara ime?” Okwu Grik ahụ dị mkpụmkpụ, a pụkwara ịghọta ya dị ka ajụjụ.
    reason: alternative_reading
  revision_rationale: The revision replaces an expression that means holding Jesus’ hand with the idiomatic arrest-context expression “bikwasa Jizọs aka,” and it renders the following κρατέω with “jide ya.” This retains the Greek narrative’s two actions—laying hands on Jesus and seizing him—while preserving the draft’s careful handling of the ambiguous saying to Judas.
