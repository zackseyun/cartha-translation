  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: ig
  text: Ma Jizọs sịrị ya[a], “Enyi, mee ihe ị bịara ime.” Mgbe ahụ, ha bịakwutere, bikwasa Jizọs aka, wee jide ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Enyi, gịnị ka ị bịara ime?” Okwu Grik ahụ dị mkpụmkpụ, a pụkwara ịghọta ya dị ka ajụjụ.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Enyi
  rationale: Ọ bụ okwu Jizọs ji kpọọ Judas ihu na ihu. “Enyi” bụ okwu Igbo doro anya ma dị ugbu a; n’ebe a, ọ pụtaghị na ha bụ ezigbo enyi chiri anya, kama ọ na-ejigide ụda okwu dị nwayọọ ma sie ike.
- source_word: ἐφ’ ὃ πάρει
  choice: mee ihe ị bịara ime
  rationale: Nkebiokwu Grik a dị mkpụmkpụ ma nwekwaa nghọta abụọ. N’isi ederede, nsụgharị a na-egosi na Jizọs kwere ka ebumnuche Judas pụta ìhè, ebe e debere nghọta ajụjụ n’ala ala peeji.
- source_word: προσελθόντες
  choice: ha bịarutere
  rationale: Okwu a na-egosi na ndị bịara ijide Jizọs bịakwutere ya. “Ha bịarutere” na-aga nke ọma n’usoro akụkọ Igbo.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: jide Jizọs aka
  rationale: N’ebe a, akpaalaokwu Grik ahụ pụtara iji aka jide mmadụ n’ike, ọ bụghị nanị ịtụkwasị ya aka. “Jide Jizọs aka” na-egosi omume ahụ n’Igbo doro anya.
- source_word: ἐκράτησαν αὐτόν
  choice: nwụchie ya
  rationale: κρατέω n’ebe a na-egosi ijide mmadụ ka ọ ghara ịpụ. “Nwụchie ya” na-enye nghọta nke ijide ya n’ike, n’agbanyeghị na ọ naghị etinye nkọwa iwu karịrị ihe amaokwu ahụ kwuru.
- source_word: δὲ
  choice: Ma
  rationale: δέ na-egosi obere mgbanwe ma ọ bụ ọdịiche n’akụkọ ahụ; “Ma” dabara n’ịtụgharị uche site n’omume Judas gaa n’azịza Jizọs.
theological_decisions:
- issue: Nkọwa okwu Jizọs gwara Judas
  choice: “Enyi, mee ihe ị bịara ime.”
  alternative: “Enyi, gịnị ka ị bịara ime?”
  rationale: A hapụrụ ụda okwu Jizọs ka ọ dị nwayọọ ma nwee esemokwu dị n’ime ya, n’emeghị ya ka ọ bụrụ okwu ịhụnanya chiri anya ma ọ bụ ikpe ọmụma doro anya. Ebe okwu Grik ahụ dị mkpụmkpụ ma nwee ike ịbụ ajụjụ, e debere nghọta ọzọ ahụ n’ala ala peeji.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ okwu ndị na-egosi ijide mmadụ n’ike n’enweghị itinye nkọwa iwu ma ọ bụ ozizi ụka na-adịghị n’ederede Grik.
