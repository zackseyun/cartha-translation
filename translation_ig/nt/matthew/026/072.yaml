revisions:
- from: O wee jiri iyi gọnahụ ya ọzọ, sị, “Amaghị m nwoke ahụ.”[a]
  to: Ọ gọnahụrụ ọzọ jiri iyi, sị, “Amaghị m nwoke ahụ.”
  rationale: 'The revision removes the unsupported pronoun while preserving the Greek sequence and force: repeated denial, accompanied by an oath, followed by its direct content. It retains “nwoke ahụ” rather than identifying the man as Jesus in the main text.'
  reviewer_model: gpt-5.6-terra
