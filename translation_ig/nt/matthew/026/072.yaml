  yaml_path: translation/nt/matthew/026/072.yaml
  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: ig
  text: Ọ gọnahụrụ ọzọ jiri iyi, sị, “Amaghị m nwoke ahụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: O wee
  rationale: Na-ejikọta ihe omume a na akụkọ gara aga n'ụzọ Igbo dị eke, n’etinyeghị nkọwa ọzọ na-adịghị na Grik.
- source_word: πάλιν
  choice: ọzọ
  rationale: Na-egosi na Pita mere ngọnahụ ahụ ọzọ.
- source_word: ἠρνήσατο
  choice: gọnahụ ya
  rationale: ‘Gọnahụ’ na-enye echiche nke ịjụ ma ọ bụ ịsị na ihe ahụ abụghị eziokwu; ‘ya’ na-eme ka ahịrịokwu ahụ dị ire n’Igbo tupu okwu kpọmkwem na-akọ ihe ọ gọnahụrụ.
- source_word: μετὰ ὅρκου
  choice: jiri iyi
  rationale: Na-egosi na o mere ngọnahụ ahụ site n’ịṅụ iyi, n’emeghị ka ọ dị ka iyi e nyere n’ụlọikpe.
- source_word: ὅτι
  choice: sị
  rationale: Na-ewebata okwu kpọmkwem nke bụ ọdịnaya ngọnahụ ahụ n’ụzọ Igbo dị eke.
- source_word: Οὐκ οἶδα
  choice: Amaghị m
  rationale: Nsụgharị kwụ ọtọ na nke dị ire nke nkwupụta na ọ maghị onye ahụ.
- source_word: τὸν ἄνθρωπον
  choice: nwoke ahụ
  rationale: Na-edobe aha Grik nke na-ekwu maka nwoke ahụ, kama iji ‘ya’ ma ọ bụ ‘Jizọs,’ si otú ahụ chekwaa okwu Pita ji kewapụ onwe ya n’ebe ọ nọ.
theological_decisions:
- issue: Onye okwu ‘nwoke ahụ’ na-ezo aka na ya
  choice: Edobere ‘nwoke ahụ’ dị ka Grik si kwuo.
  alternative: ‘ya’ ma ọ bụ ‘Jizọs’
  rationale: Ịkpọ ya ‘Jizọs’ ga-etinye nkọwa n’ime ederede; ‘nwoke ahụ’ na-echekwa otú Pita si jiri okwu kewapụ onwe ya n’ebe Jizọs nọ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘jiri iyi’ kama okwu nwere ike ime ka ọnọdụ ahụ yie ikpe ụlọikpe; ahịrịokwu ahụ na-edobe mkpụmkpụ na ike nke ngọnahụ Pita.
