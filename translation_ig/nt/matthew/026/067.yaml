  source_fidelity: 'The translation accurately represents the sequence and all three actions in the Greek: τότε as “Mgbe ahụ,” direct spitting at Jesus’ face, κολαφίζω as fist-striking, and the substantival οἱ δέ with ῥαπίζω as “ndị ọzọ ... maa ya ụra.” The implicit object of the final verb is naturally supplied as “ya.”'
