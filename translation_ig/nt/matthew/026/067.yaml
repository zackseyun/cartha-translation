  text: τότε ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ καὶ ἐκολάφισαν αὐτόν, οἱ δὲ ἐράπισαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/067.yaml
  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: ig
  text: Mgbe ahụ, ha gbụrụ ya ọnụ mmiri n’ihu, were ọkpọ tie ya, ndị ọzọ wee maa ya ụra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe sochiri n’usoro akụkọ; okwu a bụ Igbo nkịtị ma doo anya.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: ha gbụrụ ya ọnụ mmiri n’ihu
  rationale: Nke a na-egosi ịgbụ mmadụ ọnụ mmiri kpọmkwem n’ihu dị ka omume nlelị; ọ bụkwa ụzọ e si ekwu ya n’Igbo n’ụzọ sitere n’okike.
- source_word: ἐκολάφισαν αὐτόν
  choice: were ọkpọ tie ya
  rationale: Ngwaa Grik a na-egosi iti mmadụ ọkpọ, ọ bụghị naanị iti ya n’ozuzu.
- source_word: οἱ δὲ ἐράπισαν
  choice: ndị ọzọ wee maa ya ụra
  rationale: Akụkụ okwu a na-egosi ndị ọzọ mere ihe ọzọ; ῥαπίζω na-apụtakarị ịma mmadụ ụra n’ihu site n’aka ghe oghe. E tinyere ‘ya’ n’ihi na onye e mere ya pụtara ìhè site n’ahịrịokwu gara aga.
- source_word: δέ
  choice: wee
  rationale: N’ebe a, δέ na-ejikọta omume ọzọ n’akụkọ karịa igosi nnukwu mmegide; ‘wee’ na-aga were were n’Igbo akụkọ.
theological_decisions:
- issue: Nkọwa banyere mmegbu e mere Jizọs n’ihu ndị kansụl
  choice: 'A kọwara omume ndị ahụ kpọmkwem: ịgbụ ya ọnụ mmiri n’ihu, iti ya ọkpọ, na ịma ya ụra.'
  alternative: Iji okwu izugbe dịka ‘ha kpagburu ya’ ma ọ bụ ‘ha tiri ya.’
  rationale: Ihe odide ahụ n’onwe ya na-akọwa ụdị nlelị na mmegbu ahụ kpọmkwem. Nsụgharị a anaghị eme ka ha dị nro ma ọ bụ tinye nkọwa okpukpe ọzọ na-adịghị n’ebe ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘gbụrụ ya ọnụ mmiri n’ihu,’ ‘were ọkpọ tie ya,’ na ‘maa ya ụra’ iji chekwaa nkọwa doro anya nke omume atọ ahụ n’enweghị okwu siri ike nghọta.
