review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the sequence: the people came out of the tombs after his resurrection, entered the holy city, and appeared to many. “A kpọlitere ya n’ọnwụ” appropriately represents the resurrection without adding an agent, and “gosi ọtụtụ mmadụ onwe ha” clearly conveys ἐνεφανίσθησαν πολλοῖς.'
  naturalness: The opening “Mgbe ha si n’ili ndị ahụ pụta mgbe a kpọlitere ya n’ọnwụ” has a repeated temporal connector (“Mgbe … mgbe”) and leaves the initial temporal clause syntactically awkward. Recasting it as coordinated narrative verbs is natural Standard Igbo while retaining the Greek participle’s prior action.
  terminology: “Ili ndị ahụ,” “obodo nsọ ahụ,” and “ọtụtụ mmadụ” are suitable. The wording for appearing is understandable and appropriately avoids supplying interpretive detail. The Jerusalem footnote is useful.
  issues:
  - severity: medium
    issue: Awkward duplicated temporal construction at the beginning
    rationale: “Mgbe ha si n’ili ndị ahụ pụta mgbe a kpọlitere ya n’ọnwụ” repeats “mgbe” in a way that is less idiomatic and obscures the sentence structure. The Greek has one temporal phrase modifying the participial action, not two temporal conjunctions.
  revised_text: Ha si n’ili ndị ahụ pụta mgbe a kpọlitere ya n’ọnwụ,[a] banye n’obodo nsọ ahụ[b] wee gosi ọtụtụ mmadụ onwe ha.
