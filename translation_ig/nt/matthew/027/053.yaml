id: MAT.27.53
reference: Matthew 27:53
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: ig
  text: Ha si n’ili ndị ahụ pụta mgbe a kpọlitere ya n’ọnwụ,[a] banye n’obodo nsọ ahụ[b] wee gosi ọtụtụ mmadụ onwe ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịhazi okwu ahụ n’ụzọ ọzọ: “Mgbe a kpọlitere ya n’ọnwụ, ha si n’ili ndị ahụ pụta, banye n’obodo nsọ ahụ, wee gosi ọtụtụ mmadụ onwe ha.” N’asụsụ Grik, okwu bụ́ “mgbe a kpọlitere ya n’ọnwụ” dị n’etiti “si n’ili ndị ahụ pụta” na “ha banyere.”'
    reason: alternative_reading
  - marker: b
    text: “Obodo nsọ ahụ” bụ Jerusalem.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθόντες
  choice: Mgbe ha si ... pụta
  rationale: A sụgharịrị aorist participle ahụ dị ka nkebiokwu na-egosi oge; nke a bụ Igbo ebumpụta ụwa ma na-edobe njikọ ya na ngwaa bụ́ isi.
- source_word: μνημείων
  choice: ili ndị ahụ
  rationale: N’okwu a, μνημεῖον bụ ebe e liri mmadụ; “ili” bụ okwu Igbo doro anya ma kwekọọ n’ili ndị e meghere n’amaokwu bu ụzọ.
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: mgbe a kpọlitere ya n’ọnwụ
  rationale: μετά na accusative na-egosi oge sochirinụ. ἔγερσις na-ekwu maka ịkpọlite Jizọs n’ọnwụ; passive a na-edobekwa echiche nke Chineke ịkpọlite ya n’ọnwụ.
- source_word: εἰσῆλθον
  choice: ha banyere
  rationale: Nke a na-enye aorist narrative verb ahụ n’Igbo dị mfe ma bụrụ nke a na-asụkarị.
- source_word: τὴν ἁγίαν πόλιν
  choice: obodo nsọ ahụ
  rationale: Ọ na-edobe akpaalaokwu Akwụkwọ Nsọ ahụ n’etinyeghị “Jerusalem” ozugbo n’ahịrịokwu bụ́ isi.
- source_word: ἐνεφανίσθησαν
  choice: wee gosi ọtụtụ mmadụ onwe ha
  rationale: Ụdị a na-egosi na ha mere ka ndị ọzọ hụ ha; ọ bụ ụzọ Igbo doro anya isi nye echiche nke ịpụta ìhè n’ihu mmadụ.
- source_word: πολλοῖς
  choice: ọtụtụ mmadụ
  rationale: Ọ bụ ezie na Grik hapụrụ aha ahụ ka a ghọta ya, ịgbakwunye “mmadụ” na-eme ka okwu Igbo doo anya n’agbanweghi ihe ọ pụtara.
theological_decisions:
- issue: Njikọ dị n’etiti ịpụ n’ili na okwu oge bụ “mgbe a kpọlitere ya n’ọnwụ”
  choice: E debere okwu oge ahụ ozugbo n’azụ nkebiokwu banyere ịpụ n’ili, ka ọ gosi na ha si n’ili pụta mgbe a kpọlitere Jizọs n’ọnwụ, mgbe ahụ ha abanye n’obodo ahụ.
  alternative: 'A pụrụ ịhazi ya nke ọma karị dị ka: “Mgbe a kpọlitere ya n’ọnwụ, ha si n’ili ndị ahụ pụta, banye n’obodo nsọ ahụ...”'
  rationale: Usoro okwu Grik tinyere μετὰ τὴν ἔγερσιν αὐτοῦ n’etiti nkebiokwu participle na ngwaa bụ́ isi. Nsụgharị a na-edobe usoro na mgbagwoju anya ahụ, n’enweghị ịgbalị ime ka ọ kwekọọ n’ụzọ ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. A họọrọ “mgbe a kpọlitere ya n’ọnwụ” karịa aha odide siri ike maka “resurrection,” ma debe “obodo nsọ ahụ” dị ka akpaalaokwu Akwụkwọ Nsọ. Akara ụkwụedemede [a] na [b] pụtara n’ahịrịokwu bụ́ isi.
