revisions:
- from: Mgbe ha si n’ili ndị ahụ pụta mgbe a kpọlitere ya n’ọnwụ,[a] ha banyere n’obodo nsọ ahụ[b] wee gosi ọtụtụ mmadụ onwe ha.
  to: Ha si n’ili ndị ahụ pụta mgbe a kpọlitere ya n’ọnwụ,[a] banye n’obodo nsọ ahụ[b] wee gosi ọtụtụ mmadụ onwe ha.
  rationale: 'The revision removes the unnatural repeated “mgbe” while preserving the source sequence and the placement-related ambiguity noted in the audit trail: their coming out of the tombs occurred after his resurrection, followed by their entry into the holy city and appearance to many. Footnote a retains a transparent alternative ordering and accurately notes the Greek word order.'
