id: MAT.27.3
reference: Matthew 27:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: ig
  text: Mgbe ahụ, Judas, onye raara ya nye, hụrụ na a mara ya ikpe, o wutere ya n’obi, o wee weghachiri ndị isi nchụàjà na ndị okenye mkpụrụ ego ọlaọcha iri atọ ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Na-egosi ihe mere na-esote n’usoro akụkọ n’ụzọ doro anya ma bụrụ Igbo nkịtị.
- source_word: ἰδὼν
  choice: hụrụ na
  rationale: A tụgharịrị participle a dị ka omume mere tupu mmeghachi omume Judas; usoro a bụ nke sitere n’ọnụ Igbo nke ọma.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: onye raara ya nye
  rationale: N’ọnọdụ akụkọ a, παραδίδωμι na-egosi ịrara Jizọs nye n’aka ndị ga-ejide ya; nkebiokwu a na-echekwa ọrụ e ji mata Judas.
- source_word: ὅτι κατεκρίθη
  choice: na a mara ya ikpe
  rationale: Na-egosi na ndị ọchịchị ekpebiela ikpe megide Jizọs, ma na-edobe passive nke Grik n’enweghị ịkpọ ndị mere ya aha.
- source_word: μεταμεληθεὶς
  choice: o wutere ya n’obi
  rationale: Na-egosi mwute na ụta o nwere banyere ihe o mere, n’emeghị ka okwu ahụ bụrụ nkwupụta doro anya banyere nchegharị zuru ezu.
- source_word: ἔστρεψεν
  choice: o wee weghachiri
  rationale: N’ọnọdụ ego na ndị natara ya, ngwaa ahụ pụtara iweghachi ihe e nyere ma ọ bụ natara.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: mkpụrụ ego ọlaọcha iri atọ ahụ
  rationale: ἀργύρια bụ ego ọlaọcha; ‘mkpụrụ ego ọlaọcha’ bụ okwu Igbo nke oge a, doro anya nye ọtụtụ ndị na-agụ akwụkwọ.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: ndị isi nchụàjà na ndị okenye
  rationale: Ndị a bụ ìgwè ndị ndu okpukpe na ndị ndu obodo e kwuru banyere ha n’akụkọ Matiu.
theological_decisions:
- issue: Ihe μεταμεληθεὶς na-ekwu banyere mmeghachi omume Judas
  choice: o wutere ya n’obi
  alternative: o chegharịrị
  rationale: Okwu Grik bụ μεταμέλομαι, nke na-emesi mwute ma ọ bụ ịkwa ụta ike. ‘O chegharịrị’ nwere ike ikwu karịa ihe ederede ahụ kwuru banyere ọnọdụ ime mmụọ Judas.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘onye raara ya nye’ mee ka ihe okwu ahụ pụtara n’akụkọ doo anya; e jikwa ‘o wutere ya n’obi’ chekwaa ọdịiche dị n’etiti ịkwa ụta na nkwupụta banyere nchegharị zuru ezu.
