  text: ⸀ἔφη αὐτοῖς ὁ Πιλᾶτος· Ἔχετε κουστωδίαν· ὑπάγετε ἀσφαλίσασθε ὡς οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: ig
  text: Paịlet gwara ha, sị, “Unu nwere ndị nche.[a] Gaanụ, chekwanụ ya nke ọma dịka unu si mara.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Werenụ ndị nche,” ma ọ bụ ikekwe, “Unu nwere ndị nche nke unu.” Okwu Grik ahụ nwere ike ịpụta na Paịlet nyere ha ndị nche ka ha jiri, ma ọ bụ na ọ na-ezo aka n’ndị nche ha nwere ugbu a.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “Gaanụ, mee ka e chekwaa ya dịka unu si mara.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: gwara ha, sị
  rationale: Nke a bụ ụzọ Igbo sitere n’okike esi webata okwu mmadụ kwuru, ma ọ na-egosikwa na ọ bụ ha ka Paịlet gwara.
- source_word: Ἔχετε
  choice: Unu nwere
  rationale: Ọ na-edobe nghọta nkịtị nke ngwaa ἔχω n’ụdị ugbu a, ma ghara ikpebi n’ahịrịokwu bụ́ isi ma Paịlet ò nyere ha ndị nche ka ha were, ka ọ̀ na-ezo aka n’ndị nche ha nwere ugbu a.
- source_word: κουστωδίαν
  choice: ndị nche
  rationale: Okwu a, nke sitere na Latin custodia, na-ezo aka n’otu ndị e nyere ọrụ nche; ‘ndị nche’ bụ okwu Igbo doro anya ma dị mfe nghọta.
- source_word: ὑπάγετε
  choice: Gaanụ
  rationale: Ọ bụ iwu ka ha pụọ gaa mee ihe ahụ; ‘Gaanụ’ bụ okwu Igbo dị nkenke ma kwekọọ n’ọnụọgụ ọtụtụ.
- source_word: ἀσφαλίσασθε
  choice: mee ka e chekwaa ya nke ọma
  rationale: Ọ na-egosi ime ka ili ahụ sie ike megide mmebi ma ọ bụ mbanye. Nsụgharị a bụ nke Igbo sitere n’okike ma na-edobe ihe ngwaa ahụ pụtara.
- source_word: ὡς οἴδατε
  choice: dịka unu si mara
  rationale: Ọ na-edobe okwu Grik ahụ n’enweghị ịgbakwunye echiche siri ike dịka ‘n’ike unu niile’ ma ọ bụ ‘nke kacha mma unu nwere ike.’
theological_decisions:
- issue: Ma okwu Ἔχετε κουστωδίαν ọ̀ bụ Paịlet nyere ha ndị agha Rom ka ha were, ka ọ̀ na-ekwu banyere ndị nche ndị isi ndị Juu nwere
  choice: E dere ya n’ahịrịokwu bụ́ isi dịka ‘Unu nwere ndị nche’
  alternative: ‘Werenu ndị nche,’ ma ọ bụ ‘Unu nwere ndị nche nke unu’
  rationale: Ụdị okwu Grik ahụ nwere ike ịbụ ikike ka ha were ndị nche, ma ọ bụ nkwupụta na ndị nche adịlarị ha. Ahịrịokwu bụ́ isi na-edobe nghọta nkịtị, ebe nkọwa ala peeji na-echekwa nghọta ndị ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Paịlet’ bụ nsụgharị aha ahụ a na-ahụkarị n’Igbo. E ji ‘ndị nche’ kama okwu mbinye Latin iji mee ka ndị na-agụ akwụkwọ ghọta ya ozugbo; ọ pụtara otu ndị na-arụ ọrụ nche. Akara nkọwa [a] na [b] dị n’ahịrịokwu bụ́ isi dịka achọrọ.
