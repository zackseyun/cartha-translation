    issue: The main verb is rendered with a passive-causative construction.
    rationale: “Mee ka e chekwaa ya” may suggest arranging for someone else to secure it. The Greek ἀσφαλίσασθε is an imperative addressed to the hearers and is more closely represented by “chekwanụ ya.”
  - severity: low
    issue: Plural imperative spelling in footnote a.
    rationale: “Werenụ” is the standard plural imperative form and should replace “Werenu.”
