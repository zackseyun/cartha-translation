  source_fidelity: The draft accurately conveys Pilate's speech and appropriately preserves the ambiguity of Ἔχετε κουστωδίαν. However, “mee ka e chekwaa ya” can imply that they should cause an unspecified other party to guard it; the Greek middle imperative directly charges them with securing it.
  naturalness: The wording is generally clear Standard Igbo. A direct imperative, “chekwanụ ya,” is more natural and more immediate in this context than the passive-causative construction.
  terminology: “Paịlet” and “ndị nche” are suitable. “Ndị nche” naturally denotes a guard detail, and the footnote properly retains the debated alternatives without deciding whether the guard was Roman or already under the leaders' authority.
  issues:
