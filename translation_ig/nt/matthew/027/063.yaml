review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the participial introduction, recollection, pejorative reference to Jesus, temporal reference to his lifetime, and μετά plus accusative ('after three days'). However, “Nna anyị ukwu” adds the possessive ‘our’ and is not the most appropriate direct respectful vocative to Pilate. “Nna ukwu” retains a respectful ‘Sir/Lord’ address without that addition. The present-form ambiguity of ἐγείρομαι is appropriately retained in the main text and explained in the note.
  naturalness: The sentence is natural Standard Igbo. “M na-ebili” is a deliberately close present-form rendering and can sound less idiomatic than a future prediction in isolated modern Igbo, but the footnote responsibly supplies the more idiomatic future and passive alternatives. “Nna ukwu” is more natural and contextually precise than “Nna anyị ukwu” here.
  terminology: “Onye nduhie ahụ” faithfully conveys the hostile force of ἐκεῖνος ὁ πλάνος. “Nna ukwu” is preferable for Κύριε in an address to Pilate, avoiding both an added possessive and an unwarranted divine implication. The footnote needs the spelling correction “Okwu ngwaa Grik.”
  issues:
  - severity: medium
    issue: The vocative “Nna anyị ukwu” includes “anyị” (‘our’), which is absent from Κύριε.
    rationale: The Greek has a singular respectful vocative, not a possessive title. “Nna ukwu” provides an appropriate respectful address to Pilate without adding ‘our.’
  - severity: low
    issue: Footnote [a] contains the typo “Okw ngwaa Greek.”
    rationale: It should read “Okwu ngwaa Grik” in standard Igbo orthography and terminology.
