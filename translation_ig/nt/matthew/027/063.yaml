  text: λέγοντες· Κύριε, ἐμνήσθημεν ὅτι ἐκεῖνος ὁ πλάνος εἶπεν ἔτι ζῶν· Μετὰ τρεῖς ἡμέρας ἐγείρομαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/063.yaml
  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: ig
  text: na-asị, “Nna ukwu, anyị chetara na onye nduhie ahụ kwuru mgbe ọ ka dị ndụ[b], ‘Mgbe ụbọchị atọ gachara, m na-ebili[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya, “Mgbe ụbọchị atọ gachara, m ga-ebili,” ma ọ bụ, “Mgbe ụbọchị atọ gachara, a ga-akpọlite m.” Okwu ngwaa Grik dị n’ụdị present: “a na-akpọlite m” ma ọ bụ “m na-ebili.”'
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịhazi okwu ahụ, “mgbe onye nduhie ahụ ka dị ndụ, o kwuru.”
    reason: previous_rendering
lexical_decisions:
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ bụ participle nke na-ejikọta okwu a na amaokwu bu ya ụzọ; “na-asị” na-edobe njikọ ahụ n’ụzọ Igbo dị mfe.
- source_word: Κύριε
  choice: Nna anyị ukwu
  rationale: Nke a bụ okwu nkwanye ùgwù a gwara Paịlet, ọ bụghị nkwupụta na ọ bụ Chineke. “Nna anyị ukwu” na-enye nkwanye ùgwù ahụ n’Igbo n’enweghị ịmanye nghọta okpukpe.
- source_word: ἐμνήσθημεν
  choice: anyị chetara
  rationale: Aorist ahụ nwere ike ịpụta na ha chetara ihe ahụ n’oge ahụ. “Anyị chetara” na-edobe ụdị oge gara aga nke Greek ma ka bụrụ okwu Igbo doro anya.
- source_word: ἐκεῖνος ὁ πλάνος
  choice: onye nduhie ahụ
  rationale: “Onye nduhie” na-egosi onye na-eduhie ndị ọzọ, ebe “ahụ” na-edobe ike nkewapụ na nlelị dị na demonstrative Greek.
- source_word: ἔτι ζῶν
  choice: mgbe ọ ka dị ndụ
  rationale: Nke a na-egosi na o kwuru okwu ahụ tupu ọnwụ ya, n’ụzọ Igbo na-aga were were.
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: Mgbe ụbọchị atọ gachara
  rationale: μετά ya na accusative pụtara “mgbe ... gachara.” A naghị agbanwe ya ka ọ bụrụ “n’ụbọchị nke atọ,” ka e wee ghara ijikọta ya n’amaghị ama na okwu ndị ọzọ.
- source_word: ἐγείρομαι
  choice: m na-ebili
  rationale: Ụdị Greek bụ present middle/passive. “M na-ebili” na-edobe ụdị present na ohere nghọta nke ‘rise,’ ebe nkọwa ala peeji na-egosi nsụgharị future na passive ndị nwekwara ike ịdị.
theological_decisions:
- issue: Otu e si sụgharịa amụma Jizọs banyere mbilite n’ọnwụ ya
  choice: Mgbe ụbọchị atọ gachara, m na-ebili
  alternative: Mgbe ụbọchị atọ gachara, m ga-ebili; ma ọ bụ, a ga-akpọlite m
  rationale: A na-edobe present-form nke ἐγείρομαι n’ahịrị bụ isi, kama ime ka ya kwekọọ ozugbo na ụdị amụma ndị ọzọ. Nkọwa ala peeji na-echekwa ohere future na passive nke okwu Greek ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke nwere ugwu ma dị mfe nghọta. “Nna anyị ukwu” bụ aha nkwanye ùgwù dabara n’okwu a gwara Paịlet; “onye nduhie ahụ” na-echekwa ụda nlelị nke ndị na-ekwu okwu. E debere mgbagwoju anya dị na ἐγείρομαι, tinyere ọdịiche present/future na middle/passive, site n’ahịrị bụ isi na nkọwa [a].
