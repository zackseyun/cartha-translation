  text: οἱ δὲ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/039.yaml
  text: And those passing by were blaspheming him[a], shaking their heads[b],
translation:
  language: ig
  text: Ndị na-agafe agafe na-ekwulu ya[a], na-efegharị isi ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-akparị ya.” Okwu Grik a nwere ike ịpụta ịkpọ mmadụ okwu ọjọọ ma ọ bụ ikwu okwu nkwutọ megide ya, ọ bụghị naanị ikwulu Chineke n’echiche dị warara.
    reason: lexical_alternative
  - marker: b
    text: Nke a bụ mmegharị ahụ e ji egosi nlelị ma ọ bụ ịkwa emo; tulee Abụ Ọma 22:7.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ndị
  rationale: Akụkụ a na-eme participle ahụ ka ọ bụrụ aha ndị mmadụ. δέ bụ njikọ dị nro; n’Igbo, ịmalite ahịrịokwu ahụ na “Ndị” na-eme ka akụkọ ahụ na-aga were were n’etinyeghị mmegide siri ike na-adịghị na Grik.
- source_word: παραπορευόμενοι
  choice: na-agafe n’ebe ahụ
  rationale: Nke a na-egosi ndị nọ n’omume ịgafe ebe a kpọgidere Jizọs n’obe, ma na-edobe omume ahụ dị ka ihe na-aga n’ihu.
- source_word: ἐβλασφήμουν
  choice: nọ na-ekwulu
  rationale: “Ikwulu” na-eburu echiche okwu mkparị ma ọ bụ nkwutọ siri ike. “Nọ na-” na-egosipụta na omume ahụ gara n’ihu, dịka imperfect Grik si mee.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-arụtụ aka na Jizọs dịka onye okwu mkparị ahụ metụtara.
- source_word: κινοῦντες
  choice: na-efegharị
  rationale: Nke a na-egosi mmegharị ahụ ha mere n’otu oge ha na-ekwu okwu mkparị; “na-efegharị isi” bụ okwu Igbo doro anya maka mmegharị dị otú a.
- source_word: τὰς κεφαλὰς αὐτῶν
  choice: isi ha
  rationale: Igbo na-ejikarị aha ahụ n’otu n’ọnọdụ nkesa dị otú a, ebe onye ọ bụla na-efegharị isi nke ya; ọ na-ada nke ọma ma na-echekwa ihe Grik pụtara.
theological_decisions:
- issue: Ike okwu βλασφημέω mgbe a na-ekwu ya megide Jizọs n’akụkọ ahụhụ ya
  choice: na-ekwulu ya
  alternative: na-akparị ya
  rationale: “Na-ekwulu” na-echekwa ịdị arọ nke okwu Grik n’etinyeghị ozizi ọzọ n’ihe e dere. E nyere “na-akparị” n’okpuru peeji n’ihi na βλασφημέω nwekwara ike ịpụta ikwu okwu ọjọọ ma ọ bụ okwu nkwutọ megide mmadụ, ọ bụghị naanị ikwulu Chineke n’echiche dị warara.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Nọ na-ekwulu” na-egosipụta omume gara n’ihu, ebe “na-efegharị isi ha” na-enye ihe oyiyi mmegharị ahụ n’ụzọ ndị na-agụ akwụkwọ ga-aghọta ngwa ngwa.
