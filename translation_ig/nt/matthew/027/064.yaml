id: MAT.27.64
reference: Matthew 27:64
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: ig
  text: Ya mere, nye iwu ka e mee ka ili ahụ dị nchebe ruo n’ụbọchị nke atọ, ka ndị na-eso ụzọ ya ghara ịbịa[a] zuo ya ma gwa ndị mmadụ, ‘A kpọlitela ya[b] site n’etiti ndị nwụrụ anwụ.’ Aghụghọ ikpeazụ ahụ ga-adị njọ karịa nke mbụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ ihe odide na-agbakwụnye ‘n’abalị’ mgbe okwu ‘ịbịa’ gasịrị: ‘ka ndị na-eso ụzọ ya ghara ịbịa n’abalị zuo ya.’ E gbasoro ọgụgụ dị mkpirikpi n’ebe a.'
    reason: textual_variant
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘A kpọlitere ya site n’etiti ndị nwụrụ anwụ.’ Ngwaa Grik dị n’olu nnata.
    reason: lexical_alternative
lexical_decisions:
- source_word: κέλευσον
  choice: nye iwu
  rationale: Ọ bụ iwu a na-enye otu onye ka o jiri ikike ya mee ihe ozugbo; ‘nye iwu’ bụ okwu Igbo doro anya ma kwekọọ n’arịrịọ a rịọrọ Paịlet.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi ihe e kpebiri site n’ihe e kwuru n’amaokwu bu ụzọ.
- source_word: ἀσφαλισθῆναι
  choice: ka e chekwaa ... nke ọma
  rationale: Nke a na-egosi ime ka ili ahụ bụrụ ebe e ji n’aka na ọ dị nchebe, n’akọwaghị ụzọ e si eme ya karịa ihe Grik kwuru.
- source_word: τὸν τάφον
  choice: ili ahụ
  rationale: ‘Ili’ bụ okwu Igbo nkịtị maka ebe e liri onye nwụrụ anwụ ma dabara n’ili a wara n’oké nkume dị n’akụkọ a.
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: ruo n’ụbọchị nke atọ
  rationale: Ọ na-edebe usoro oge nke Grik nakwa njikọ ya na amụma banyere ụbọchị nke atọ.
- source_word: μήποτε
  choice: ka ... ghara
  rationale: Usoro a bụ ụzọ Igbo si ekwupụta ihe a chọrọ igbochi n’ihi egwu na o nwere ike ime.
- source_word: ἐλθόντες
  choice: ịbịa
  rationale: Ọ na-anọchi participle Grik n’ụzọ Igbo dị larịị; etinyeghị ‘n’abalị’ n’ihi na ọ dịghị na ederede SBLGNT a.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ nsụgharị Igbo doro anya nke ndị na-amụ ma na-eso onye nkụzi.
- source_word: κλέψωσιν αὐτόν
  choice: zuo ya
  rationale: Ọ na-edebe nnọchiaha ‘ya’ dị na Grik kama ịgbanwe ya ka ọ bụrụ ‘ozu ya,’ nke isi mmalite ahụ ekwughị kpọmkwem.
- source_word: εἴπωσιν τῷ λαῷ
  choice: gwa ndị mmadụ
  rationale: λαός na-ezo aka n’ebe a n’ebe ndị mmadụ n’ozuzu ha nọ, ọ bụghị naanị ìgwè mmadụ gbakọrọ n’otu ebe.
- source_word: Ἠγέρθη
  choice: A kpọlitela ya
  rationale: Usoro a na-edebe olu nnara nke Grik ma ghara ikwu kpọmkwem onye kpọlitere ya.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: site n’etiti ndị nwụrụ anwụ
  rationale: Ọ na-edebe echiche nke isi n’etiti ndị nwụrụ anwụ pụta, nke aha Grik n’ụbara na-egosi.
- source_word: ἡ ἐσχάτη πλάνη
  choice: aghụghọ ikpeazụ ahụ
  rationale: ‘Aghụghọ’ na-egosi nduhie e kwuru okwu ya n’ebe a, ebe ‘ikpeazụ’ na-edebe ntụnyere ya na nke mbụ.
theological_decisions:
- issue: Otu e si sụgharịa okwu banyere mbilite n’ọnwụ
  choice: A kpọlitela ya site n’etiti ndị nwụrụ anwụ
  alternative: O siri n’ọnwụ bilie
  rationale: Grik ji olu nnara mee ihe. Nsụgharị a na-edebe nke ahụ ma hapụ onye mere omume ahụ n’ekwughị ya, kama ịgbanwe ya ka ọ bụrụ naanị omume onye ahụ mere n’onwe ya.
- issue: Ihe nnọchiaha dị na ‘zuo ya’ na-ezo aka na ya
  choice: zuo ya
  alternative: zuo ozu ya
  rationale: Ọ bụ ezie na ihe a na-ekwu banyere ya bụ ahụ Jizọs dị n’ili, Grik kwuru ‘ya,’ ọ bụghị ‘ozu ya.’ Ya mere, e debeghị nkọwa ọzọ n’ime isi ederede.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-asọ n’ụzọ Igbo, ma e debeghị okwu ndị pụrụ idozi ihe Grik hapụrụ ghe oghe, karịchaa olu nnara nke okwu mbilite n’ọnwụ na nnọchiaha dị na ‘zuo ya.’
