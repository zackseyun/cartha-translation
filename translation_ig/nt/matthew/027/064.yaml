revisions:
- from: Ya mere, nye iwu ka e chekwaa ili ahụ nke ọma ruo n’ụbọchị nke atọ, ka ndị na-eso ụzọ ya ghara ịbịa[a] zuo ya, gwa ndị mmadụ, ‘A kpọlitela ya site n’etiti ndị nwụrụ anwụ[b].’ Aghụghọ ikpeazụ ahụ ga-adịkwa njọ karịa nke mbụ.
  to: Ya mere, nye iwu ka e mee ka ili ahụ dị nchebe ruo n’ụbọchị nke atọ, ka ndị na-eso ụzọ ya ghara ịbịa[a] zuo ya ma gwa ndị mmadụ, ‘A kpọlitela ya[b] site n’etiti ndị nwụrụ anwụ.’ Aghụghọ ikpeazụ ahụ ga-adị njọ karịa nke mbụ.
  rationale: The revision retains the source’s ambiguity and passive resurrection formulation while clarifying the coordination of the disciples’ two alleged actions, improving the rendering of securing the tomb, and placing the lexical footnote at its proper referent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the major Greek elements: the inferential οὖν, the official imperative, securing the tomb, the temporal limit, the feared action of the disciples, the personal object ‘him,’ the passive resurrection claim, and the comparison of the final deception with the first. A small syntactic revision is needed so that both ‘steal him’ and ‘tell the people’ remain clearly within the feared purpose after ‘ka ... ghara.’'
  naturalness: The present comma sequence, ‘ka ndị na-eso ụzọ ya ghara ịbịa zuo ya, gwa ndị mmadụ,’ can read awkwardly because ‘gwa’ is insufficiently joined to the preceding feared actions. Adding ‘ma’ produces a natural coordinated Igbo construction. ‘Mee ka ili ahụ dị nchebe’ is also more idiomatic and semantically precise here than ‘chekwaa ili ahụ nke ọma,’ which can suggest preserving or looking after it rather than making it secure.
  terminology: ‘Ili,’ ‘ndị na-eso ụzọ,’ ‘ndị mmadụ,’ and ‘aghụghọ’ suit Standard Igbo and the passage’s formal narrative register. ‘A kpọlitela ya’ appropriately retains the Greek passive without naming an agent. The footnote should call the Greek passive ‘olu nnata,’ a clearer Standard Igbo grammatical designation than ‘olu nnara.’
  issues:
  - severity: medium
    issue: The two feared actions are not explicitly coordinated in the Igbo text.
    rationale: Greek has coordinated subjunctives κλέψωσιν ... καὶ εἴπωσιν under μήποτε. In Igbo, adding ‘ma’ in ‘zuo ya ma gwa ndị mmadụ’ clearly keeps both actions under ‘ka ... ghara.’
  - severity: low
    issue: ‘Chekwaa ili ahụ nke ọma’ is less exact and less idiomatic for securing a tomb.
    rationale: ἀσφαλισθῆναι means to make secure. ‘Ka e mee ka ili ahụ dị nchebe’ expresses the resultant security without specifying how it is achieved.
  - severity: low
    issue: Footnote b is anchored after ‘ndị mmadụ’ rather than at the resurrection expression, and its grammatical terminology can be improved.
    rationale: The note concerns ‘A kpọlitela ya,’ so its marker belongs immediately after that expression. ‘Olu nnata’ clearly identifies the Greek passive voice.
  revised_text: Ya mere, nye iwu ka e mee ka ili ahụ dị nchebe ruo n’ụbọchị nke atọ, ka ndị na-eso ụzọ ya ghara ịbịa[a] zuo ya ma gwa ndị mmadụ, ‘A kpọlitela ya[b] site n’etiti ndị nwụrụ anwụ.’ Aghụghọ ikpeazụ ahụ ga-adị njọ karịa nke mbụ.
  revised_footnotes:
  - marker: a
    text: 'Ụfọdụ ihe odide na-agbakwụnye ‘n’abalị’ mgbe okwu ‘ịbịa’ gasịrị: ‘ka ndị na-eso ụzọ ya ghara ịbịa n’abalị zuo ya.’ E gbasoro ọgụgụ dị mkpirikpi n’ebe a.'
    reason: textual_variant
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘A kpọlitere ya site n’etiti ndị nwụrụ anwụ.’ Ngwaa Grik dị n’olu nnata.
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s ambiguity and passive resurrection formulation while clarifying the coordination of the disciples’ two alleged actions, improving the rendering of securing the tomb, and placing the lexical footnote at its proper referent.
