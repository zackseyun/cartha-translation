    rationale: 'For the antecedent binding action expressed by δήσαντες, Standard Igbo naturally uses ‘kechiri’: ‘Mgbe ha kechiri ya.’'
  - severity: low
    issue: The coordinated main actions lack an explicit Igbo coordinator.
    rationale: Adding ‘ma’ before ‘nyefee’ clearly joins ‘led him away’ and ‘handed him over,’ reflecting the Greek coordination and yielding smoother prose.
