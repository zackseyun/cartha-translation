reference: Matthew 27:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: ig
  text: Mgbe ha kechiri ya[a], ha duuru ya pụọ ma nyefee ya n’aka Paịlet, onye ọchịchị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ebe ha kechiri ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “gọvanọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δήσαντες
  choice: Mgbe ha kechara ya
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa ndị bụ isi; ‘Mgbe ha kechara ya’ na-egosipụta usoro ahụ n’Igbo dị mfe ma na-edobe echiche nke iji ihe kee ya.
- source_word: ἀπήγαγον
  choice: ha duuru ya pụọ
  rationale: Nhọrọ a na-edobe echiche nke iduru onye nọ n’okpuru njide pụọ, kama iji okwu sara mbara dị ka ‘kpọrọ ya pụọ.’
- source_word: παρέδωκαν
  choice: nyefee ya n’aka
  rationale: Ọ na-egosi inyefe Jizọs n’okpuru ikike ma ọ bụ njide onye ọzọ; ọ na-edobe ọnọdụ ikpe ahụ ma ghara ịkọwa ihe mmụta okpukpe karịa ihe ederede kwuru.
- source_word: Πιλάτῳ
  choice: Paịlet
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị kwekọrọ n’usoro ụda Igbo.
- source_word: τῷ ἡγεμόνι
  choice: onye ọchịchị
  rationale: ἡγεμών bụ onye ọchịchị nọ n’ọkwa ọchịchị. ‘Onye ọchịchị’ bụ okwu Igbo doro anya nke na-adịghị akọwapụta ọkwa ahụ karịa okwu Grik.
- source_word: καὶ ... καὶ
  choice: Mgbe ... ha ... , nyefee
  rationale: 'A haziri njikọ ndị ahụ n’usoro Igbo eke: nkebi oge na-esochi omume abụọ jikọrọ ọnụ. Nke a na-edobe usoro ihe omume n’agbanyeghị na a naghị atụgharị καί mbụ dịka ‘na.’'
theological_decisions:
- issue: Nsụgharị παραδίδωμι n’akụkọ ahụhụ Jizọs
  choice: nyefee ya n’aka
  alternative: rara ya nye
  rationale: ‘Nyefee ya n’aka’ na-eme ka echiche ikpe na inyefe n’okpuru ikike Paịlet pụta ìhè. ‘Rara ya nye’ nwere ike ibute echiche aghụghọ ma ọ bụ nrara nye nke ukwuu n’ebe a, ya mere ahọrọghị ya, ma e chekwara ịdị omimi nke ngwaa ahụ n’enweghị ịmanye nkọwa okpukpe.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘duuru ya pụọ’ gosipụta njem n’okpuru njide, jiri ‘nyefee ya n’aka’ gosipụta inyefe n’okpuru ikike. E tinyere akara ndetu ala peeji niile n’ederede bụ isi.
