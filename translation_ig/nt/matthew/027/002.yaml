  source_fidelity: The draft preserves the sequence and judicial sense of δήσαντες, ἀπήγαγον, and παρέδωκαν. However, the completed form of ‘kechie’ should be ‘kechiri’ rather than ‘kechara,’ and the two finite actions should be explicitly coordinated with ‘ma.’
  naturalness: ‘Ha duuru ya pụọ ma nyefee ya n’aka Paịlet’ is natural Standard Igbo. A comma before the appositional title ‘onye ọchịchị’ improves readability and correctly marks it as identifying Pilate’s office.
  terminology: ‘Paịlet’ appropriately transliterates Πιλάτῳ. ‘Onye ọchịchị’ is a suitably broad rendering of ἡγεμών; the footnote supplies ‘gọvanọ’ as a familiar alternative without over-specifying the Greek title.
  issues:
