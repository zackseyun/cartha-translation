    text: “Dara n’ụra” bụ akpaalaokwu a na-ejikarị ekwu na mmadụ anwụọla.
    reason: lexical_alternative
  revision_rationale: The revision retains every source-level semantic feature and the deliberate theological neutrality of 'a kpọlitekwara.' It makes a small syntactic clarification to the saint-relative phrase and corrects the footnote to natural Standard Igbo.
