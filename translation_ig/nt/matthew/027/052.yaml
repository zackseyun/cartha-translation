review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the Greek coordination, passive actions, tombs, bodies, saints, death-as-sleep idiom, and neutral passive 'were raised.' Adding the Greek article sense with 'ndị nsọ ahụ' improves precision without adding interpretation.
  naturalness: The verse is generally clear Standard Igbo. The revised possessive-relative sequence more naturally and unambiguously identifies the bodies as belonging to the saints who had 'fallen asleep.' The footnote should use idiomatic Igbo wording for death rather than the nonstandard/reduplicative 'ịnwụ anwụ.'
  terminology: '''Ili,'' ''ndị nsọ,'' and ''a kpọlitekwara'' are suitable. ''A kpọlitekwara'' appropriately preserves the passive and does not settle the nature of the raising. The sleep idiom and its explanatory note retain the source’s euphemism.'
  issues:
  - severity: low
    issue: The phrase 'ndị nsọ dara n’ụra' lacks the article represented by τῶν and can be slightly less clearly attached within the possessive phrase.
    rationale: Using 'ndị nsọ ahụ dara n’ụra' better reflects 'the saints who had fallen asleep' and clarifies that the qualifying phrase describes the saints.
  - severity: medium
    issue: The footnote gloss 'ịnwụ anwụ' is not idiomatic Standard Igbo for 'to die.'
    rationale: '''Ịnwụrụ anwụ'' is the normal expression; wording the note as ''na mmadụ anwụọla'' is clearer and natural while preserving the explanation of the idiom.'
  revised_text: E meghere ili ndị ahụ, a kpọlitekwara ọtụtụ ahụ́ nke ndị nsọ ahụ dara n’ụra[a],
  revised_footnotes:
