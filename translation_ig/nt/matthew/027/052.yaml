id: MAT.27.52
reference: Matthew 27:52
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ⸀ἠγέρθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/052.yaml
  text: And the tombs were opened[a], and many bodies of the saints who had fallen asleep were raised,
translation:
  language: ig
  text: E meghere ili ndị ahụ, a kpọlitekwara ọtụtụ ahụ́ nke ndị nsọ ahụ dara n’ụra[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dara n’ụra” bụ akpaalaokwu a na-ejikarị ekwu na mmadụ anwụọla.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: kwara
  rationale: Njikọ a na-edobe nhazi nke ihe ndị mere n’akụkọ ahụ n’etinyeghị nkọwa oge na-adịghị na Grik.
- source_word: τὰ μνημεῖα
  choice: ili ndị ahụ
  rationale: μνημεῖον n’ebe a bụ ebe e liri ndị nwụrụ anwụ; “ili” bụ okwu Igbo doro anya ma bụrụkwa nke nkịtị.
- source_word: ἀνεῴχθησαν
  choice: E meghere
  rationale: Ụdị ngwaa passive a na-egosi na ihe ahụ mere ili ndị ahụ; nsụgharị a anaghị atụkwasị otú e si meghee ha.
- source_word: πολλὰ σώματα
  choice: ọtụtụ ahụ́
  rationale: σῶμα bụ “ahụ́”; a zere okwu siri ike nke pụtara ozu kpọmkwem ka e wee debe okwu Grik n’enweghị mgbakwunye.
- source_word: τῶν κεκοιμημένων
  choice: nke ... dara n’ụra
  rationale: A na-edobe akpaalaokwu Grik nke ji ụra kwuo ọnwụ, ebe nkọwa ala peeji na-eme ka ihe ọ pụtara doo anya.
- source_word: ἁγίων
  choice: ndị nsọ
  rationale: “Ndị nsọ” bụ ụzọ Igbo a na-ejikarị akọwa ndị Chineke e doro nsọ, n’enweghị ịkọwapụta njirimara ha karịa ihe amaokwu ahụ kwuru.
- source_word: ἠγέρθησαν
  choice: a kpọlitekwara
  rationale: ἐγείρω na passive nwere ike ịpụta ịkpọlite n’ọnwụ; okwu a na-edobe nkọwa ahụ n’enweghị ikpebi ụdị mbilite ahụ.
theological_decisions:
- issue: Ụdị ihe ἠγέρθησαν na-akọ banyere ya
  choice: a kpọlitekwara
  alternative: ha sikwa n’ọnwụ bilie
  rationale: “A kpọlitere” na-anọ nso n’ụdị passive nke Grik ma ghara ikpebi ma nke a bụ mbilite n’ọnwụ zuru ezu ma ọ bụ ịlọghachi ná ndụ; a hapụrụ esemokwu ahụ ka gburugburu amaokwu kọwaa ya.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere akpaalaokwu banyere ụra, tinyekwa nkọwa ala peeji iji gbochie mgbagwoju anya.
