  to: E meghere ili ndị ahụ, a kpọlitekwara ọtụtụ ahụ́ nke ndị nsọ ahụ dara n’ụra[a],
  rationale: The revision retains every source-level semantic feature and the deliberate theological neutrality of 'a kpọlitekwara.' It makes a small syntactic clarification to the saint-relative phrase and corrects the footnote to natural Standard Igbo.
