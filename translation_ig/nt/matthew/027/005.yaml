  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: ig
  text: Mgbe o tụbachara ego ọlaọcha ahụ n’ime ụlọ nsọ[a][b], o wee pụọ, gaa kwụgbuo onwe ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ime ebe nsọ ahụ.” Okwu Grik bụ naos, nke na-ezokarị aka n’ụlọ nsọ ma ọ bụ n’ebe nsọ ya, karịa ogige ụlọ nsọ dum.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ ochie enweghị “n’ime ụlọ nsọ.”
    reason: textual_variant
lexical_decisions:
- source_word: ῥίψας
  choice: wee tụba
  rationale: Aorist participle a na-egosi ihe o mere tupu ọ pụọ; “wee tụba” na-egosi usoro omume ahụ n’Igbo dị mfe ma ghara ịgbatị okwu.
- source_word: τὰ ἀργύρια
  choice: ego ọlaọcha ahụ
  rationale: N'ụzọ nkịtị ọ bụ “ọlaọcha ahụ,” ma n’ọnọdụ a ọ na-ezo aka n’ego e nyere ya; “ego ọlaọcha ahụ” doro onye na-agụ anya ma ka na-echekwa ihe okwu Grik pụtara.
- source_word: εἰς τὸν ναὸν
  choice: n’ime ụlọ nsọ
  rationale: ναός na-ezokarị aka n’ebe nsọ dị n’ime ụlọ nsọ, ọ bụghị ogige ụlọ nsọ dum. “Ụlọ nsọ” bụ okwu Igbo dị mfe ma kwesị ekwesị; nkọwa ala peeji na-echekwa nghọta ya nke kapịrị ọnụ.
- source_word: ἀνεχώρησεν
  choice: si ebe ahụ pụọ
  rationale: Okwu a pụtara ịpụ ma ọ bụ ịla azụ. “Si ebe ahụ pụọ” na-enye akụkọ ahụ usoro doro anya n’Igbo.
- source_word: ἀπελθὼν
  choice: gaa
  rationale: Participle a na-egosi na ọ gara ebe ọzọ tupu omume ikpeazụ. “Gaa” na njikọ “gaa kwụgbuo” bụ Igbo ebumpụta ụwa ma ghara ime ka okwu abụọ nke ịpụ daa arọ.
- source_word: ἀπήγξατο
  choice: kwụgbuo onwe ya
  rationale: Middle voice na-egosi na o mere onwe ya ihe ahụ; n’ọnọdụ a, okwu ahụ pụtara n’ụzọ kacha kwe omume na o ji nkwụgbu gbuo onwe ya.
theological_decisions:
- issue: Ma ναός ọ̀ pụtara ụlọ nsọ n’ozuzu ya ka ọ bụ ebe nsọ dị n’ime ya
  choice: ụlọ nsọ n’ahịrịokwu bụ isi, tinyere nkọwa banyere ebe nsọ n’ala peeji
  alternative: ebe nsọ dị n’ime ụlọ nsọ
  rationale: Nhọrọ a na-eme ka ahịrịokwu ahụ dị mfe ịgụ, ma ọ naghị efunahụ nkọwa ụlọ ahụ nke okwu Grik nwere ike igosi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro omume atọ—ịtụba ego ahụ, ịpụ, na ịga kwụgbuo onwe ya—ma zere nkwughachi na-adịghị atọ ụtọ n’Igbo.
