  naturalness: “O wee tụba …, si ebe ahụ pụọ …” is understandable, but “Mgbe o tụbachara …, o wee pụọ, gaa …” is more natural Standard Igbo and clearly represents the initial aorist participle and the subsequent actions.
  terminology: “ego ọlaọcha ahụ” is appropriate in context. “ụlọ nsọ” is a readable rendering of ναός, with “ebe nsọ” supplied as a lexical alternative. “kwụgbuo onwe ya” accurately conveys the self-directed sense in this context.
