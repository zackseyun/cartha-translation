revisions:
- from: Mgbe ahụ, ọ hapụrụ ha Barabas ka ọ laa, ma mgbe ọ pịachara Jizọs ụtarị[a], o nyefere ya ka a kpọgide ya n’obe.
  to: Mgbe ahụ, ọ tọhapụrụ Barabas nye ha; ma mgbe o pịachara Jisọs ihe otiti[a], o nyefere ya ka a kpọgide ya n’obe.
  rationale: 'The revision improves Standard Igbo idiom while retaining every element of the Greek: temporal progression, release of Barabbas to the crowd, contrast with Jesus, flogging before the handing over, and the passive purpose of crucifixion. The footnote remains properly anchored to the flogging term and offers a valid lexical alternative.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly preserves the sequence: Barabbas is released, Jesus is flogged, and then he is handed over for crucifixion. However, “ọ hapụrụ ha Barabas ka ọ laa” is less precise and less idiomatic for a judicial release than a direct rendering with “tọhapụrụ,” and “pịachara Jizọs ụtarị” is not natural Standard Igbo phrasing.'
  naturalness: Use “ọ tọhapụrụ Barabas nye ha” for the judicial release and “mgbe o pịachara Jisọs ihe otiti” for the Roman flogging. These are clear, natural, and retain the antecedent action of the Greek participle.
  terminology: “Jisọs” and “Barabas” follow established Standard Igbo biblical naming. “Ihe otiti” accurately conveys flogging/scourging without minimizing the punishment. “Kpọgide ya n’obe” is an appropriate established rendering of crucifixion.
  issues:
  - severity: medium
    issue: Judicial release is rendered awkwardly.
    rationale: “Ọ hapụrụ ha Barabas ka ọ laa” is understandable, but it is an indirect and less idiomatic expression for ἀπέλυσεν. “Ọ tọhapụrụ Barabas nye ha” explicitly and naturally conveys that he released Barabbas to them.
  - severity: medium
    issue: The flogging expression is collocationally unnatural.
    rationale: “Pịachara Jizọs ụtarị” does not express the action naturally in Standard Igbo. “Pịachara Jisọs ihe otiti” clearly states that Jesus was subjected to lashes/flogging and supports the footnote’s lexical alternative.
  revised_text: Mgbe ahụ, ọ tọhapụrụ Barabas nye ha; ma mgbe o pịachara Jisọs ihe otiti[a], o nyefere ya ka a kpọgide ya n’obe.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe o tisịrị Jisọs ihe otiti.” Okwu Grik ahụ na-ezo aka ná ntaramahụhụ ndị Rom nke iji ụtarị pịa mmadụ.
    reason: lexical_alternative
  revision_rationale: 'The revision improves Standard Igbo idiom while retaining every element of the Greek: temporal progression, release of Barabbas to the crowd, contrast with Jesus, flogging before the handing over, and the passive purpose of crucifixion. The footnote remains properly anchored to the flogging term and offers a valid lexical alternative.'
