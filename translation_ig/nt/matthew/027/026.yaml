  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, τὸν δὲ Ἰησοῦν φραγελλώσας παρέδωκεν ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: ig
  text: Mgbe ahụ, ọ tọhapụrụ Barabas nye ha; ma mgbe o pịachara Jisọs ihe otiti[a], o nyefere ya ka a kpọgide ya n’obe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe o tisịrị Jisọs ihe otiti.” Okwu Grik ahụ na-ezo aka ná ntaramahụhụ ndị Rom nke iji ụtarị pịa mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi usoro ihe ndị mere n’akụkọ ahụ n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ἀπέλυσεν αὐτοῖς
  choice: ọ hapụrụ ha Barabas ka ọ laa
  rationale: N’ọnọdụ ikpe a, okwu ahụ pụtara ịtọhapụ onye mkpọrọ; nhazi a na-egosikwa na ọ bụ n’ihi ha ka a tọhapụrụ ya.
- source_word: Βαραββᾶν
  choice: Barabas
  rationale: A sụgharịghị aha mmadụ; e dere ya dịka ụda ya si kwekọọ n’usoro odide Igbo.
- source_word: δὲ
  choice: ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ịtọhapụ Barabas na ihe e mere Jizọs.
- source_word: φραγελλώσας
  choice: mgbe ọ pịachara Jizọs ụtarị
  rationale: Okwu Grik a na-ekwu banyere ntaramahụhụ ndị Rom nke ịpịa mmadụ ụtarị; ọdịdị participle gara aga na-egosi na nke a mere tupu e nyefee ya.
- source_word: παρέδωκεν
  choice: o nyefere ya
  rationale: Ọ na-egosi inyefe Jizọs n’aka ndị ga-emezu ntaramahụhụ ahụ, n’enweghị ịgbakwunye onye a na-akpọghị aha n’amaokwu ahụ.
- source_word: ἵνα σταυρωθῇ
  choice: ka a kpọgide ya n’obe
  rationale: Nke a na-egosipụta ebumnuche ma ọ bụ ihe a chọrọ ka e mee ya, ma na-edobe olu nnara nke okwu Grik.
theological_decisions:
- issue: Usoro ihe omume na onye mere ha n’ikpe Jizọs
  choice: Paịlet tọhapụrụ Barabas; mgbe o pịachara Jizọs ụtarị, o nyefere Jizọs ka a kpọgide ya n’obe.
  alternative: Paịlet buru ụzọ nyefee Jizọs, e mesịa pịa ya ụtarị.
  rationale: Aorist participle φραγελλώσας na-egosikarị ihe mere tupu isi ngwaa παρέδωκεν. Nsụgharị ahụ na-edobe usoro ahụ n’emeghị nkọwa ozizi ọzọ banyere usoro ikpe ndị Rom.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta. “Pịa ụtarị” na-eme ka ụdị ntaramahụhụ ahụ doo onye nkịtị anya; ihe odide ala peeji na-enye ụzọ ọzọ e si ekwu ya ma kọwaa ọnọdụ ndị Rom.
