id: MAT.27.8
reference: Matthew 27:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὸ ἐκλήθη ὁ ἀγρὸς ἐκεῖνος Ἀγρὸς Αἵματος ἕως τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/008.yaml
  text: Therefore that field has been called Field of Blood to this day.
translation:
  language: ig
  text: N’ihi ya, a kpọrọ ala ahụ Ala Ọbara ruo taa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: N’ihi ya
  rationale: Ọ na-egosi ihe si n’ihe a kọwara n’amaokwu bu ụzọ pụta; okwu a na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: ἐκλήθη
  choice: a kpọrọ
  rationale: Ọ bụ aorist passive nke καλέω, nke pụtara na e nyere ala ahụ aha; usoro a bụ nke okike ma doo anya n’Igbo.
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: ala ahụ
  rationale: N’ebe a ἀγρός bụ otu ibé ala a zụrụ; ‘ala ahụ’ bụ okwu Igbo dị mfe ma kwekọọkwa n’aha e nyere ya.
- source_word: Ἀγρὸς Αἵματος
  choice: Ala Ọbara
  rationale: A sụgharịrị aha ebe ahụ n’ụzọ na-echekwa njikọ genitive dị n’etiti ἀγρός na αἵματος, ma meekwa ka aha ahụ bụrụ nke okike n’Igbo.
- source_word: αἵματος
  choice: Ọbara
  rationale: Ọ bụ genitive singular nke αἷμα, ma bụrụ akụkụ nke aha ebe ahụ.
- source_word: ἕως τῆς σήμερον
  choice: ruo taa
  rationale: Nke a bụ usoro Igbo dị nkenke na nke okike nke na-egosi na aha ahụ ka dị ruo n’oge onye dere akụkọ ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù, ma dị mfe nghọta. E chekwara nkwughachi ‘ala’ n’ahịrịokwu na n’aha ebe ahụ iji gosipụta njikọ okwu dị na Grik.
