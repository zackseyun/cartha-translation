  naturalness: ‘Emehiela m,’ ‘Gịnị ka nke ahụ gbasara anyị?’ na ‘Ọ bụ gị ga-ahụ maka ya’ bụ Standard Igbo doro anya ma kwekọọ na ụda nkwupụta na nchụpụ dị n’amaokwu a. ‘Ọbara onye aka ya dị ọcha’ bụ ụzọ a pụrụ ịghọta nke na-edobe ihe atụ ‘ọbara’ ma na-egosi onye na-enweghị ikpe. N’ala peeji b, ‘E nwekwara ike ịsị’ na-adịkarị mma karịa ‘A pụkwara ịsụ ya.’
