  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: ig
  text: na-asị, “Emehiela m site n’ịrara ọbara onye aka ya dị ọcha.[a]” Ma ha sịrị, “Gịnị ka nke ahụ gbasara anyị? Ọ bụ gị ga-ahụ maka ya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ ka ya na Grik si dị kpọmkwem: “ebe m nyefere ọbara onye aka ya dị ọcha.”'
    reason: lexical_alternative
  - marker: b
    text: E nwekwara ike ịsị, “Gị onwe gị hụ maka ya”—okwu nchụpụ nke pụtara, “Ọ bụ ibu ọrụ gị.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: Emehiela m
  rationale: Ụdị a na-egosi nkwupụta mmehie Júdás na ikpe ọmụma nke omume ahụ ka dị ugbu a, n’Igbo dị mfe ma kwụ ọtọ.
- source_word: παραδοὺς
  choice: site n’ịrara ... nye ha
  rationale: N’akụkọ a, participle ahụ na-akọwa ihe mere nkwupụta mmehie ahụ ji dị; ‘ịrara ... nye ha’ na-egosipụta omume aghụghọ nke inyefe mmadụ n’aka ndị iro karịa naanị ‘inyefe.’
- source_word: αἷμα ἀθῷον
  choice: ọbara onye aka ya dị ọcha
  rationale: Nke a na-edobe ihe atụ ọbara dị n’asụsụ Grik ma na-eme ka echiche nke onye na-enweghị ikpe doo onye Igbo anya, n’etinyeghị aha Jizọs n’ebe ederede ahụ hapụrụ ya n’ime okwu atụ.
- source_word: Τί πρὸς ἡμᾶς;
  choice: Gịnị ka nke ahụ gbasara anyị?
  rationale: Ọ bụ ajụjụ nchụpụ nke na-ajụ ibu ọrụ ma ọ bụ mmetụ ha nwere n’okwu ahụ; nsụgharị a bụ Igbo nkịtị ma dị nso n’usoro Grik.
- source_word: σὺ ὄψῃ
  choice: Ọ bụ gị ga-ahụ maka ya
  rationale: 'Ọdịnihu etiti a na-arụ ọrụ dịka nchụpụ siri ike: onye ahụ n’onwe ya ga-ebu ọrụ ma lebara okwu ahụ anya. Igbo a na-echekwa ọdịdị ọdịnihu na nkwusi ike dị n’okwu σὺ.'
theological_decisions:
- issue: Ma a ga-akpọ Jizọs aha dịka onye Júdás raara nye ha
  choice: E tinyeghị aha Jizọs; e debere ya dịka ‘ọbara onye aka ya dị ọcha.’
  alternative: ‘Emehiela m site n’ịrara Jizọs, onye aka ya dị ọcha, nye ha.’
  rationale: Grik hapụrụ onye a na-ekwu maka ya n’ime okwu ‘ọbara dị ọcha.’ Ịkpọ Jizọs aha ga-eme ka o doo anya, ma ọ ga-agbakwụnye ihe ederede ahụ na-ekwughị kpọmkwem.
- issue: Ike iwu ma ọ bụ ọdịnihu dị na σὺ ὄψῃ
  choice: ‘Ọ bụ gị ga-ahụ maka ya,’ nke na-echekwa ọdịnihu ma gosipụta nchụpụ na ibu ọrụ.
  alternative: ‘Gị onwe gị hụ maka ya,’ nke na-eme ka ọ bụrụ iwu kpọmkwem.
  rationale: Ụdị okwu Grik bụ ọdịnihu, ma n’ọnọdụ a ọ nwere ike ịrụ ọrụ dịka iwu nchụpụ. Isi ederede na-echekwa ụdị ọdịnihu ahụ; nkọwa ala peeji na-egosi ụzọ iwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘onye aka ya dị ọcha’ kọwaa ἀθῷον n’ụzọ e ji ekwu enweghị ikpe n’Igbo, ebe a ka na-edobe ihe atụ ‘ọbara.’ Akara nkọwa [a] na [b] dị n’isi ederede kpọmkwem n’ebe ha metụtara.
