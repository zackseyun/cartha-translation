source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: ig
  text: Mgbe ọ nọ ọdụ n’oche ikpe, nwunye ya zigaara ya ozi sị, “E tinyela onwe gị n’okwu nwoke ezi omume ahụ[a], n’ihi na taa, atawo m ahụhụ nke ukwuu ná nrọ maka ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwoke ahụ aka ya dị ọcha.” Okwu Grik ahụ nwere ike ịpụta “onye ezi omume,” “onye ziri ezi,” ma ọ bụ, n’ọnọdụ ikpe, “onye na-enweghị ikpe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Mgbe ọ nọ ọdụ
  rationale: Nkebi okwu a na-egosi ihe na-aga n’ihu n’otu oge ihe ọzọ mere; ‘Mgbe ọ nọ ọdụ’ na-ekwupụta nke a n’Igbo nkịtị.
- source_word: ἐπὶ τοῦ βήματος
  choice: n’oche ikpe
  rationale: N’ọnọdụ a, βῆμα bụ oche ọchịchị ebe onyeikpe na-anọ ekpe ikpe, ọ bụghị naanị ebe dị elu.
- source_word: ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ
  choice: nwunye ya zigaara ya ozi
  rationale: γυνή pụtara nwunye n’ebe a, ebe ngwaa ahụ na-egosi na o zigara ya ihe e kwuru site n’aka onye ozi.
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: Etinyela aka n’okwu nwoke ezi omume ahụ
  rationale: Akpaalaokwu Grik a bụ ịdọ mmadụ aka ná ntị ka ọ ghara itinye aka n’ihe metụtara onye ahụ. Nsụgharị a bụ Igbo ebumpụta ụwa ma debe δίκαιος dịka ‘ezi omume.’
- source_word: πολλὰ ... ἔπαθον
  choice: atawo m ahụhụ nke ukwuu
  rationale: Nke a na-egosi ahụhụ siri ike n’ụzọ doro anya ma dịrị ndị na-agụ Igbo taa mfe.
- source_word: σήμερον κατ’ ὄναρ δι’ αὐτόν
  choice: taa ... ná nrọ maka ya
  rationale: ‘Taa’ na ‘ná nrọ’ na-edebe oge na ụzọ ahụ si mee; ‘maka ya’ na-egosi na nwoke ahụ bụ ihe kpatara ahụhụ ahụ, ma ọ bụghị na ọ bụ ya mere ya ahụhụ ozugbo.
theological_decisions:
- issue: Ihe δίκαιος pụtara mgbe e ji ya kọwaa Jizọs
  choice: nwoke ezi omume ahụ
  alternative: nwoke ahụ aka ya dị ọcha
  rationale: ‘Ezi omume’ na-edebe ike okwu δίκαιος nke metụtara omume ziri ezi, ebe ọnọdụ ikpe ahụ nwekwara ike ime ka ọ pụta na ikpe amaghị ya. E debere echiche nke abụọ ahụ n’okpuru peeji kama ime ka isiokwu ahụ bụrụ naanị mkpebi iwu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma doo anya, dee ya. ‘Oche ikpe’ na ‘zigaara ya ozi’ na-eme ka ọnọdụ ọchịchị na iziga ozi doo anya n’enweghị okwu ochie ma ọ bụ nkọwa agbakwunyere.
