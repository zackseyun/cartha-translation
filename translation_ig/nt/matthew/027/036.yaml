  text: καὶ καθήμενοι ἐτήρουν αὐτὸν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/036.yaml
  text: And sitting there[a], they kept watch over him.
translation:
  language: ig
  text: Ma ka ha nọ ọdụ n’ebe ahụ, ha nọ na-eche ya nche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ha nọdụrụ ala n’ebe ahụ ma nọgide na-eche ya nche.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ha
  rationale: N’Igbo, ịmalite ahịrịokwu a ozugbo site n’isiokwu ‘Ha’ na-eme ka akụkọ gaa n’ihu nke ọma; njikọ καὶ dị mfe, ọ dịghịkwa mkpa ịmanye ‘na’ n’ebe ọ ga-ada arọ.
- source_word: καθήμενοι
  choice: nọdụrụ ala
  rationale: Nkebi ngwaa a sitere na κάθημαι na-egosi na ha nọ n’ọnọdụ ịnọdụ ala mgbe ha na-eme ihe ngwaa bụ isi kwuru; ‘nọdụrụ ala’ bụ Igbo doro anya ma dị ndụ.
- source_word: ἐτήρουν
  choice: na-eche ... nche
  rationale: Ụdị imperfect na-egosi omume nọ na-aga n’ihu. ‘Na-eche ya nche’ na-egosi na ha nọgidere na-elekọta ka ọ ghara ịpụ ma ọ bụ ka ihe ghara ime n’enweghị ha ịhụ ya.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs; ‘ya’ bụ ntụgharị Igbo kwesịrị ekwesị.
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: Nkọwa ebe a na-egosi ebe omume ahụ mere; ‘n’ebe ahụ’ bụ okwu Igbo nkịtị ma doo anya.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo dị mfe, nke ugwu dịkwa na ya. Ahịrịokwu ahụ na-echekwa omume na-aga n’ihu nke ἐτήρουν, ebe nkọwa ala ala na-enye ụzọ ọzọ isi ghọta mmekọrịta nke participle καθήμενοι na ngwaa bụ isi.
