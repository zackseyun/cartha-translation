    reason: lexical_alternative
  revision_rationale: The revision corrects the opening orthography and separately represents καί with “kwa” and μετὰ with “ha na.” It preserves the source’s association of the scribes and elders with the chief priests in mocking Jesus, as well as the ongoing aspect of both mocking and speaking.
