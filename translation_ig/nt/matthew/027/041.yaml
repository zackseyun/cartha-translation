  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁμοίως ⸀καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες μετὰ τῶν γραμματέων καὶ ⸀πρεσβυτέρων ἔλεγον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: ig
  text: N'otu aka ahụ[a], ndị isi nchụaja kwa, ha na ndị odeakwụkwọ na ndị okenye na-akwa ya emo, na-asị,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N'otu ụzọ ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: N’otu aka ahụ
  rationale: Ọ na-ejikọta omume ịkwa emo a na nke ndị a kpọtụrụ aha n’amaokwu ndị bu ụzọ, ma na-edobe echiche nke ime otu ihe n’ụzọ yiri ibe ya.
- source_word: καὶ
  choice: tinyere
  rationale: N’usoro Igbo a, “tinyere” na-egosi na ndị isi nchụaja sonyekwara ndị ọzọ n’ịkwa emo ahụ; a jikọtara ya na μετὰ ka ahịrịokwu wee bụrụ nke e ji Igbo eke kwuo.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Nke a bụ aha kwesịrị ekwesị maka ndị ọchịchị kachasị elu n’etiti ndị nchụaja, ọ bụghị ọtụtụ ndị ji otu ọkwa Onyeisi Nchụaja.
- source_word: ἐμπαίζοντες
  choice: na-akwa ya emo
  rationale: Ọ na-egosi omume nlelị na ịkwa emo na-aga n’ihu; “ya” doro anya n’ọnọdụ a dịka Jizọs.
- source_word: μετὰ
  choice: tinyere
  rationale: 'Ọ na-egosi mkpakọrịta: ndị odeakwụkwọ na ndị okenye sonyere ndị isi nchụaja n’omume ahụ, ọ bụghị naanị na ha nọ nso.'
- source_word: γραμματέων
  choice: ndị odeakwụkwọ
  rationale: Nke a na-edobe aha òtù ndị ọkachamara n’Iwu ahụ n’ụzọ a na-ejikarị asụ ya n’Igbo, kama ịkọwa ọrụ ha n’ụzọ sara mbara.
- source_word: πρεσβυτέρων
  choice: ndị okenye
  rationale: N’ebe a, okwu ahụ na-ezo aka n’òtù ndị ndu obodo ndị Juu, ọ bụghị naanị ndị kara nká.
- source_word: ἔλεγον
  choice: na-asị
  rationale: Ọ na-edobe ọdịdị imperfect nke Grik, nke na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwu ugboro ugboro, na-enweghị ịgbakwunye nkọwa karịrị isi mmalite.
theological_decisions:
- issue: Ndị sonyere n’ịkwa Jizọs emo
  choice: Ndị isi nchụaja, ndị odeakwụkwọ, na ndị okenye sonyere ọnụ n’ịkwa ya emo.
  alternative: A pụrụ ịghọta ya dịka ndị isi nchụaja na-akwa ya emo naanị n’ihu ndị odeakwụkwọ na ndị okenye.
  rationale: μετὰ tinyere genitive na-egosikarị mkpakọrịta n’omume ahụ; ya mere nsụgharị ahụ na-egosi na òtù atọ ahụ sonyere, na-enweghị ịgbakwunye nkwupụta ozizi.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Usoro participle na imperfect nke Grik ka e gosipụtara site na “na-akwa ya emo, na-asị,” ebe “tinyere” na-eme ka mkpakọrịta nke òtù atọ ahụ doo anya.
