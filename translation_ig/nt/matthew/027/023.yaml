  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη· Τί γὰρ κακὸν ἐποίησεν; οἱ δὲ περισσῶς ἔκραζον λέγοντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: ig
  text: Ma ọ sịrị[a], “Olee ihe ọjọọ o mere?” Ma ha nọgidere na-eti mkpu karị, na-asị[b], “Ka a kpọgide ya n’obe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ikwu ya n’ụzọ Igbo na-adịkarị mfe, “Gịnịkwa? Olee ihe ọjọọ o mere?”
    reason: lexical_alternative
  - marker: b
    text: A na-asụkarị ya, “Kpọgide ya n’obe.” Ma Grik pụtara kpọmkwem karị, “Ka a kpọgide ya n’obe.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: ọ sịrị
  rationale: Aorist nke φημί bụ okwu mmeghe dị mfe n’akụkọ; “ọ sịrị” bụ Igbo nkịtị ma doo anya.
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: Olee ihe ọjọọ o mere?
  rationale: Ajụjụ a na-agbagha ebubo e boro Jizọs. Nsụgharị a na-echekwa κακόν dị ka “ihe ọjọọ,” ma na-eweta τί γάρ n’ụzọ Igbo e ji ajụ ajụjụ nke ọma.
- source_word: περισσῶς
  choice: ike karịa
  rationale: Ọ na-egosi na mkpu ha rịrị elu ma siekwuo ike, n’enweghị ịkọwa ya karịa ihe Grik kwuru.
- source_word: ἔκραζον
  choice: ha tikwara mkpu
  rationale: Imperfect ahụ na-egosi omume gara n’ihu; “-kwara” tinyere ọnọdụ okwu ahụ na-egosi na ha gara n’ihu na-eti mkpu megide ajụjụ Paịlet.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-egosi na ihe ha kwuru mere n’otu oge ahụ ha na-eti mkpu.
- source_word: Σταυρωθήτω
  choice: Ka a kpọgide ya n’obe
  rationale: “Ka a…” na-echekwa iwu onye nke atọ na olu nnara nke Grik, ebe “kpọgide ya n’obe” bụ okwu Igbo doro anya maka crucifixion.
- source_word: ὁ δὲ ... οἱ δὲ
  choice: Ma ọ ... Ma ha ...
  rationale: Ikwughachi “Ma” na-echekwa ọdịiche dị n’etiti okwu Paịlet na nzaghachi ìgwè mmadụ.
theological_decisions:
- issue: Ụdị iwu ìgwè mmadụ nyere banyere ịkpọgide Jizọs n’obe
  choice: Ka a kpọgide ya n’obe
  alternative: Kpọgide ya n’obe
  rationale: Grik ji iwu onye nke atọ n’olu nnara. “Ka a kpọgide ya n’obe” na-echekwa ụdị ahụ n’etinyeghị nkọwa okpukpe ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Ihe ọjọọ” na-echekwa ike omume nke κακόν; “Ka a kpọgide ya n’obe” na-echekwa olu nnara nke iwu Grik.
