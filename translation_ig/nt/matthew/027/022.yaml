id: MAT.27.22
reference: Matthew 27:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: ig
  text: Paịlet sịrị ha, “Gịnịzi ka m ga-eme Jizọs, onye a na-akpọ Mesaya[a]?” Ha niile sịrị, “Ka a kpọgide ya n’obe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye a na-akpọ Kraịst.”
    reason: A na-asụgharị χριστός dịka aha-ọkwa “Mesaya” ma ọ bụ jiri ụdị ọdịnala “Kraịst.”
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: Gịnịzi ka m ga-eme
  rationale: Ajụjụ a na-egosi na Paịlet na-atụgharị uche banyere ihe ọ ga-eme; “-zi” na-egosipụta njikọ na nkwubi okwu nke οὖν.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: E dere aha onye ahụ n’ụdị a na-ejikarị eme ihe n’Igbo.
- source_word: τὸν λεγόμενον χριστόν
  choice: onye a na-akpọ Mesaya
  rationale: λεγόμενον pụtara onye a na-akpọ, ebe χριστός bụ aha-ọkwa nke pụtara Onye E Tere Mmanụ; “Mesaya” na-echekwa nghọta ndị Juu banyere aha-ọkwa ahụ.
- source_word: λέγουσιν πάντες
  choice: Ha niile sịrị
  rationale: A tụgharịrị present akụkọ a n’oge gara aga dịka o si adị n’akụkọ Igbo, ma “niile” chekwara ike nke πάντες.
- source_word: Σταυρωθήτω
  choice: Ka a kpọgide ya n’obe
  rationale: 'Nke a na-echekwa iwu ahụ na ọdịdị passive ya: ha chọrọ ka e mee ya ihe ahụ, n’agbanyeghị na e kwughị kpọmkwem onye ga-eme ya.'
theological_decisions:
- issue: Ntughari χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a okwu ahụ bụ aha-ọkwa a na-akpọ Jizọs, ọ bụghị naanị akụkụ aha ya. “Mesaya” na-eme ka echiche Onye E Tere Mmanụ pụta ìhè, ebe e debere “Kraịst” n’okpuru peeji dịka ụzọ ọzọ.
translation_notes:
  register: E ji Standard Igbo nke dị mfe, dị ugwu, ma bụrụkwa nke ndị na-agụ akwụkwọ taa ga-aghọta. E debere ajụjụ Paịlet na iwu ìgwè mmadụ n’ụdị dị nkenke ma sie ike dịka isi mmalite Grik si dị.
