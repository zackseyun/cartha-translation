- from: N’ime ha ka Meri Magdalin, Meri nne Jemis na Josef[a], na nne ụmụ Zebedi nọ.
  to: N’ime ha ka Meri Magdalin, Meri, nne Jemis na Josef[a], na nne ụmụ ndị ikom Zebedi nọ.
  rationale: The revision retains the source order and existential construction, clarifies the apposition identifying the second Mary, and explicitly translates υἱῶν as male children (“ụmụ ndị ikom”). The footnote continues to preserve the variant reading without elevating it into the main text.
  reviewer_model: gpt-5.6-terra
