id: MAT.27.56
reference: Matthew 27:56
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν αἷς ἦν Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ἡ τοῦ Ἰακώβου καὶ ⸀Ἰωσὴφ μήτηρ καὶ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/056.yaml
  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: ig
  text: N’ime ha ka Meri Magdalin, Meri, nne Jemis na Josef[a], na nne ụmụ ndị ikom Zebedi nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ “Joses” kama “Josef.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐν αἷς
  choice: N’ime ha
  rationale: Ọ na-ezo aka n’òtù ụmụanyị a kpọrọ aha n’amaokwu bu ụzọ, ma n’Igbo ọ na-egosi nke ọma na ụmụanyị ndị a so n’òtù ahụ.
- source_word: ἦν
  choice: ka ... nọ
  rationale: N’usoro ahịrịokwu a, “ka ... nọ” bụ ụzọ Igbo dị ụtọ isi kwuo na ndị a bụ ụfọdụ n’ime ụmụanyị ahụ; “nọ” anaghị agbanwe n’ihi otu onye ma ọ bụ ọtụtụ mmadụ.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Meri Magdalin
  rationale: Nke a bụ nsụgharị aha onye ahụ na aha e ji amata ya nke a na-aghọta nke ọma n’Igbo.
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: Meri nne Jemis na Josef
  rationale: Mkpụrụokwu ndị e ji egosi nwe na μήτηρ na-akọwa Meri a site n’ịkpọ ya nne Jemis na Josef.
- source_word: Ἰάκωβος
  choice: Jemis
  rationale: “Jemis” bụ ụdị aha a a na-ejikarị amata onye Agba Ọhụrụ a n’Igbo, kama ịgbanwe ya ka ọ bụrụ Jekọb.
- source_word: Ἰωσὴφ
  choice: Josef
  rationale: SBLGNT gụrụ Ἰωσὴφ ebe a, ya mere “Josef” bụ nsụgharị aha kwesịrị ekwesị; e debere ọgụgụ ọzọ, “Joses,” n’okpuru peeji.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: nne ụmụ Zebedi
  rationale: Nke a bụ okwu Igbo dị mkpirikpi ma doo anya nke na-egosi na ọ bụ nne ụmụ ndị ikom Zebedi.
- source_word: Ζεβεδαίου
  choice: Zebedi
  rationale: Nke a bụ ụdị aha Ζεβεδαῖος a na-asụ nke ọma n’Igbo.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe dị ugwu ma dị mfe nghọta dee ya. Usoro “N’ime ha ka ... nọ” na-ejikọta amaokwu a n’ụzọ eke na ụmụanyị a kpọtụrụ aha n’amaokwu bu ụzọ. E tinyere akara [a] ozugbo n’aha Josef, ebe ọdịiche ihe odide ahụ metụtara.
