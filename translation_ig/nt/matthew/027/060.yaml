translation_notes:
  register: 'E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ usoro omume ndị dị n’amaokwu ahụ: o bu ụzọ tọgbọ ozu ahụ, tụgharịa nkume ahụ ruo n’ọnụ ili, mesịa pụọ.'
