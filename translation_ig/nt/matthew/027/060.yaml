review_pass:
  verdict: revise
  source_fidelity: 'The translation accurately preserves the sequence and principal sense: Joseph placed Jesus'' body in his own new rock-cut tomb and then departed after moving a large stone at its entrance. However, «ruo n’ọnụ ili ahụ» can sound as though the stone was rolled merely toward/as far as the entrance. The Greek dative with προσκυλίσας naturally depicts rolling the stone up to/against the tomb entrance.'
  naturalness: The register is clear, modern Standard Igbo, and «ili ọhụrụ nke aka ya» and «ọ wapụtara n’ime nkume» are natural in context. Recasting the stone clause as «tụgharịa nnukwu nkume n’ọnụ ili ahụ» is smoother and avoids the potentially directional ambiguity of «ruo».
  terminology: «Ili» is appropriate for μνημεῖον in this rock-cut burial context. «Ọnụ ili» is a good contextual rendering of θύρα; the note appropriately preserves «ọnụ ụzọ ili ahụ» as an alternative. No theological terminology requires adjustment.
  issues:
  - severity: low
    issue: «ruo n’ọnụ ili ahụ» may imply motion only toward the entrance.
    rationale: προσκυλίσας λίθον ... τῇ θύρᾳ presents the stone as rolled to/at, effectively against, the entrance. Removing «ruo» gives a more idiomatic Igbo representation without adding an explicit interpretive verb such as “mechie.”
  revised_text: O wee tọgbọ ya n’ili ọhụrụ nke aka ya, nke ọ wapụtara n’ime nkume. Mgbe ọ tụgharịchara nnukwu nkume n’ọnụ ili ahụ[a], ọ pụrụ.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ọnụ ụzọ ili ahụ.” Okwu Grik ahụ nwere ike ịpụta “ọnụ ụzọ” ma ọ bụ “ebe e si abanye”; a họọrọ “ọnụ ili” n’ihi na ọ dabara n’ili e wapụtara n’ime nkume.
    reason: lexical_alternative
  revision_rationale: A gbanwere naanị «ruo n’ọnụ ili ahụ» ka ọ bụrụ «n’ọnụ ili ahụ» iji gosipụta n'ụzọ Igbo dịkwuo eke na nkume ahụ ka a tụgharịrị n’ebe ọnụ ili ahụ dị, ma ghara igosi naanị na a tụgharịrị ya ruo ebe ahụ. Ihe ndị ọzọ na-edobe ihe Grik ahụ kwuru n’ụzọ kwesịrị ekwesị.
