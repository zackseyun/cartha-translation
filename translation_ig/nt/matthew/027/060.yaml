  text: καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/060.yaml
  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: ig
  text: O wee tọgbọ ya n’ili ọhụrụ nke aka ya, nke ọ wapụtara n’ime nkume. Mgbe ọ tụgharịchara nnukwu nkume n’ọnụ ili ahụ[a], ọ pụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọnụ ụzọ ili ahụ.” Okwu Grik ahụ nwere ike ịpụta “ọnụ ụzọ” ma ọ bụ “ebe e si abanye”; a họọrọ “ọnụ ili” n’ihi na ọ dabara n’ili e wapụtara n’ime nkume.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκεν
  choice: tọgbọ
  rationale: N’ọnọdụ olili a, “tọgbọ” na-egosi idowe ozu n’ili n’ụzọ sitere n’okwu ahụ ma bụrụkwa Igbo doro anya.
- source_word: καινῷ αὐτοῦ μνημείῳ
  choice: n’ili ọhụrụ nke aka ya
  rationale: “Ili” dabara n’ebe a maka μνημεῖον e wapụtara n’oké nkume; “ọhụrụ” na-edobe καινῷ n’akọwaghị ya karịa ka isi mmalite kwuru, ebe “nke aka ya” na-eme ka nwe ya pụta ìhè.
- source_word: ἐλατόμησεν ἐν τῇ πέτρᾳ
  choice: ọ wapụtara n’ime nkume
  rationale: “Wapụtara n’ime nkume” na-akọwa ili e ji ịkpụ na iwepụ nkume mee, n’asụsụ Igbo nkịtị ma doo anya.
- source_word: προσκυλίσας λίθον μέγαν
  choice: mgbe ọ tụgharịchara nnukwu nkume
  rationale: Nkebi a na-egosi na ịtụgharị nkume ahụ mere tupu ọ pụọ; “nnukwu nkume” na-edobe λίθον μέγαν n’enweghị ikwubiga oke.
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: ruo n’ọnụ ili ahụ
  rationale: θύρα nwere ike ịbụ ọnụ ụzọ ma ọ bụ ebe e si abanye; “ọnụ ili” dabara nke ọma n’ili e wapụtara n’ime nkume ma ghara ime ka onye na-agụ chee na ọ bụ ọnụ ụzọ nwere mgbabere.
- source_word: ἀπῆλθεν
  choice: ọ pụrụ
  rationale: “Ọ pụrụ” bụ ụzọ Igbo dị mfe ma kwekọọ n’omume ịhapụ ebe ahụ.
