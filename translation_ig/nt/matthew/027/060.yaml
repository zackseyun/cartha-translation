  to: O wee tọgbọ ya n’ili ọhụrụ nke aka ya, nke ọ wapụtara n’ime nkume. Mgbe ọ tụgharịchara nnukwu nkume n’ọnụ ili ahụ[a], ọ pụrụ.
  rationale: A gbanwere naanị «ruo n’ọnụ ili ahụ» ka ọ bụrụ «n’ọnụ ili ahụ» iji gosipụta n'ụzọ Igbo dịkwuo eke na nkume ahụ ka a tụgharịrị n’ebe ọnụ ili ahụ dị, ma ghara igosi naanị na a tụgharịrị ya ruo ebe ahụ. Ihe ndị ọzọ na-edobe ihe Grik ahụ kwuru n’ụzọ kwesịrị ekwesị.
