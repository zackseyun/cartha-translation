  text: οἱ δὲ πορευθέντες ἠσφαλίσαντο τὸν τάφον σφραγίσαντες τὸν λίθον μετὰ τῆς κουστωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/066.yaml
  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: ig
  text: Ha wee gaa chekwaa ili ahụ, ya na ndị nche, site n’ịka nkume ahụ akara.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ha chekwaa ili ahụ site n’ịka nkume ahụ akara, ha na ndị nche,” ma ọ bụ ikekwe, “ha chekwaa ili ahụ site n’ịka nkume ahụ akara na itinye ndị nche n’ebe ahụ.” Okwu Grik ahụ dị mkpirikpi; ọ pụrụ igosi na ndị nche so n’ọrụ ahụ ma ọ bụ nọ ebe ahụ, kama igosi omume ọzọ dị iche kpọmkwem.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụ ya, “site n’ịka nkume ahụ akara, ya na ndị nche.”
    reason: previous_rendering
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: Ya mere, ha gara
  rationale: Nkebi ahịrịokwu a na-aga n’ihu n’akụkọ ahụ; ịsụ ya dị ka ngwaa zuru ezu bụ ụzọ Igbo si ada nke ọma n’enweghị ime ka δέ bụrụ nnukwu nkwugide.
- source_word: ἠσφαλίσαντο
  choice: chekwaa
  rationale: ἀσφαλίζω pụtara ime ka ihe dị nchebe ma ọ bụ gbochie ka e metụ ya aka; “chekwaa” bụ okwu Igbo doro anya nke dabara n’ihe e mere ili ahụ.
- source_word: τὸν τάφον
  choice: ili ahụ
  rationale: τάφος ebe a bụ ebe e liri Jizọs; “ili” bụ okwu Igbo nkịtị ma doo anya.
- source_word: σφραγίσαντες
  choice: site n’ịka ... akara
  rationale: Aorist participle a nwere ike igosi ụzọ ha si chekwaa ili ahụ; “site n’ịka ... akara” na-egosipụta iji akara mechie ma chebe nkume ahụ.
- source_word: τὸν λίθον
  choice: nkume ahụ
  rationale: λίθος na-ezo aka na nkume e debere n’ọnụ ili ahụ; a naghị etinye nkọwa “n’ọnụ ili” ebe ọ bụ na Grik ekwughị ya kpọmkwem n’amaokwu a.
- source_word: μετὰ τῆς κουστωδίας
  choice: ndị nche nọnyere ha
  rationale: μετά ya na genitive na-egosikarị iso ma ọ bụ ịnọnyere; nsụgharị a na-egosi na ndị nche so n’ihe ahụ ma ọ naghị ekwu hoo haa na e debere ha n’ebe ahụ dị ka omume ọzọ.
theological_decisions:
- issue: Mmekọrịta μετὰ τῆς κουστωδίας na otu e si chekwaa ili ahụ
  choice: Ndị nche nọnyere ha mgbe ha na-aka nkume ahụ akara.
  alternative: Ha kaa nkume ahụ akara ma debe ndị nche; ma ọ bụ, ha na ndị nche wee kaa nkume ahụ akara.
  rationale: Okwu Grik ahụ dị mkpirikpi, ọ pụkwara igosi ndị nche iso ha ma ọ bụ ịnọ ebe ahụ kama igosi hoo haa omume nke abụọ nke idebe ndị nche. Nsụgharị bụ isi na ihe odide ala ala na-echekwa nghọta abụọ ahụ n’etinyeghị usoro ihe omume nke isi mmalite na-ekwughị kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ịka ... akara” na-eburu echiche nke iji akara mechie ihe, ebe “ndị nche nọnyere ha” na-echekwa nkenke na mgbagwoju anya dị na Grik.
