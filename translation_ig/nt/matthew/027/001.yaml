  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: ig
  text: Mgbe chi bọrọ[a], ndị isi nchụaja niile na ndị okenye nke ndị mmadụ kparịtara ọnụ[b] megide Jizọs ka ha wee gbuo ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’isi ụtụtụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mere ndụmọdụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: Mgbe chi bọrọ
  rationale: Nkebiokwu a na-egosi oge na mgbanwe n’akụkọ. “Mgbe chi bọrọ” bụ Igbo doro anya ma dịkwa n’usoro nkịtị; a naghị atụgharị δέ iche n’ihi na mgbanwe ahịrịokwu ahụ egosila ọrụ ya.
- source_word: συμβούλιον ἔλαβον
  choice: gbara izu
  rationale: N’Igbo, “ịgba izu” na-egosi na ndị mmadụ gbakọrọ ndụmọdụ banyere ihe ha ga-eme. Ọ dabara n’ọnọdụ ikpe a, ma a naghị agbakwụnye na ha eruola mkpebi n’ihi na okwu Grik ahụ n’onwe ya ekwughị nke ahụ kpọmkwem.
- source_word: πάντες
  choice: niile … niile
  rationale: E kwughachiri “niile” ka o doo anya n’Igbo na okwu ahụ metụtara ma ndị isi nchụaja ma ndị okenye, dịka πάντες si emesi njupụta ndị ndu sonyere ike.
- source_word: οἱ ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Nke a na-egosi ìgwè ndị ndu nchụaja nọ na Jerusalem, ọ bụghị ọtụtụ ndị ji otu ọkwa nke nnukwu onye nchụaja.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: ndị okenye nke ndị mmadụ
  rationale: A hapụrụ njikọ ahụ n’ụzọ na-egosi na ha bụ ndị okenye nke ndị ahụ, n’etinyeghị “ndị Juu” ma ọ bụ “Izrel,” bụ́ nkọwa ndị na-adịghị n’okwu Grik a kpọmkwem.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: megide Jizọs
  rationale: κατά ya na genitive n’ọnọdụ iro a pụtara mmegide, ọ bụghị naanị na ha na-ekwu banyere Jizọs.
- source_word: ὥστε
  choice: ka ha wee
  rationale: N’ebe a ὥστε na infinitive na-egosi ebumnuche ma ọ bụ ihe omume ha chọrọ ka o si na ndụmọdụ ahụ pụta; “ka ha wee” na-edobe njikọ a n’Igbo nkịtị.
- source_word: θανατῶσαι αὐτόν
  choice: gbuo ya
  rationale: Nke a bụ okwu Igbo kpọmkwem ma doo anya maka ime ka mmadụ nwụọ; ọ naghị agbakwụnye usoro iwu pụrụ iche nke okwu Grik ahụ akọwaghị.
theological_decisions:
- issue: Ụdị ihe ndị ndu ahụ mere megide Jizọs
  choice: 'A sụgharịrị ya dịka ndụmọdụ iro nke ebumnuche ya bụ igbu Jizọs: “gbara izu megide Jizọs ka ha wee gbuo ya.”'
  alternative: A pụrụ ikwu n’ụzọ adịghị ike, “kparịtara ụka banyere Jizọs,” ma ọ bụ n’ụzọ siri ike karị, “kpara nkata megide Jizọs.”
  rationale: κατὰ τοῦ Ἰησοῦ na-egosi iro n’ezie, ebe ὥστε θανατῶσαι αὐτόν na-egosi ebumnuche ọnwụ. “Gbara izu” na-edobe ma ndụmọdụ ha ma iro ahụ, n’agbanyeghị na a naghị etinye nkọwa ọzọ banyere ụdị nkata ahụ.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “chi bọrọ,” “ndị isi nchụaja,” na “gbara izu” dịka okwu ndị mmadụ na-aghọta nke ọma, ebe a zere ịgbakwunye nkọwa ụka ma ọ bụ usoro ikpe nke isi mmalite ahụ na-ekwughị.
