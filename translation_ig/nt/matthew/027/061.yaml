  text: ἦν δὲ ἐκεῖ ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία καθήμεναι ἀπέναντι τοῦ τάφου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/061.yaml
  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: ig
  text: Ma Meri Magdalin na Meri nke ọzọ nọ n'ebe ahụ, nọdụ ala chere ili ahụ ihu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν δὲ ἐκεῖ
  choice: Ma ... nọ n'ebe ahụ
  rationale: ἦν ... ἐκεῖ na-egosi na ụmụanyị abụọ ahụ nọ ebe ahụ; Igbo na-eji “nọ” mee ka ọnụ ọgụgụ nke ndị a kpọrọ aha ghara ịkpata okwu. δέ bụ njikọ dị nro nke na-aga n'ihu n’akụkọ, ya mere “Ma” dabara nke ọma n’enweghị ime ka ọ bụrụ nnukwu nghọtahie.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Meri Magdalin
  rationale: Nke a bụ ụdị aha a maara nke ọma n’Igbo maka Meri onye si Magdala.
- source_word: ἡ ἄλλη Μαρία
  choice: Meri nke ọzọ
  rationale: Ọ na-ekewa Meri a na Meri Magdalin a kpọrọ aha tupu ya, ma na-edebe nkwupụta Grik ahụ n'ụzọ doro anya.
- source_word: καθήμεναι
  choice: nọdụ ala
  rationale: Ọ bụ participle na-akọwa ọnọdụ ụmụanyị abụọ ahụ; “nọdụ ala” bụ okwu Igbo nkịtị ma doo anya.
- source_word: ἀπέναντι
  choice: chere ... ihu
  rationale: N’ebe a, okwu ahụ na-egosi na ha nọ n’akụkụ chere ili ahụ ihu; nsụgharị a bụ eke n’Igbo ma na-edebe echiche nke ịnọ n’ihu ma ọ bụ n’ofe ya.
- source_word: τοῦ τάφου
  choice: ili ahụ
  rationale: “Ili” bụ okwu Igbo dị ugbu a, dị mfe nghọta, nke dabara n’ebe e liri mmadụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E jighị okwu ochie ma ọ bụ okwu nke otu ụka pụrụ iche; e debere δέ dị ka njikọ akụkọ dị nro.
