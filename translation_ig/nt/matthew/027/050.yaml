- from: Ma Jizọs tikwara mkpu n’oké olu, wee hapụ mmụọ ya[a].
  to: Ma Jizọs tiri mkpu ọzọ n’oké olu, wee tọhapụ mmụọ ya[a].
  rationale: The revision explicitly renders πάλιν with “ọzọ” and replaces the potentially ambiguous “hapụ” with “tọhapụ,” which better conveys ἀφῆκεν in the source idiom. It retains “mmụọ ya” to preserve the lexical and theological openness of πνεῦμα, while the footnote supplies the natural death-expression alternative without making it the main text.
