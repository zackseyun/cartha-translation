  text: ὁ δὲ Ἰησοῦς πάλιν κράξας φωνῇ μεγάλῃ ἀφῆκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/050.yaml
  text: But Jesus cried out again with a loud voice and gave up his spirit[a].
translation:
  language: ig
  text: Ma Jizọs tiri mkpu ọzọ n’oké olu, wee tọhapụ mmụọ ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kubie ume ikpeazụ.” N'ụzọ nkịtị, Grik sịrị, “ọ tọhapụrụ mmụọ ahụ,” bụ́ akpaalaokwu na-egosi ịnwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi na akụkọ ahụ na-aga n’ihu ma nwekwaa obere ntụgharị; “Ma” dabara nke ọma n’ebe a.
- source_word: πάλιν
  choice: -kwara
  rationale: Mgbakwunye “-kwara” na “tikwara” na-egosi na o mere ya ọzọ, n’ụzọ dị nkenke ma bụrụkwa Igbo nkịtị.
- source_word: κράξας
  choice: tikwara mkpu
  rationale: Nke a na-egosi iti mkpu siri ike ma na-ejikọta omume ahụ na ngwaa bụ isi.
- source_word: φωνῇ μεγάλῃ
  choice: n’oké olu
  rationale: Ọ bụ okwu Igbo doro anya nke na-egosi na olu ahụ dara ụda nke ukwuu.
- source_word: ἀφῆκεν
  choice: hapụ
  rationale: “Hapụ” na-echekwa echiche bụ́ ịtọhapụ ma ọ bụ ịhapụ ihe ka ọ laa, n’enweghị ịkọwa okwu ahụ karịa ka Grik si kwuo ya.
- source_word: τὸ πνεῦμα
  choice: mmụọ ya
  rationale: Ọ bụ ezie na Grik kwuru “mmụọ ahụ,” Igbo na-achọ nnọchiaha nwe n’okwu a; “mmụọ ya” na-echekwa ma okwu ahụ n’onwe ya ma ịdị arọ ya.
theological_decisions:
- issue: Nsụgharị akpaalaokwu ἀφῆκεν τὸ πνεῦμα nke na-ekwu banyere ọnwụ
  choice: hapụ mmụọ ya
  alternative: kubie ume ikpeazụ
  rationale: “Hapụ mmụọ ya” na-anọ nso n’okwu Grik ma na-echekwa πνεῦμα dị ka “mmụọ.” “Kubie ume ikpeazụ” na-akọwa ọnwụ ahụ nke ọma n’Igbo, ma ọ na-atụgharị okwu ahụ gaa n’echiche “ume” ma na-eme ka otu n’ime nghọta ndị dị na Grik bụrụ naanị nghọta ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Tikwara” na-eburu echiche nke πάλιν n’enweghị itinye “ọzọ” ọzọ; “wee” na-eme ka njikọ dị n’etiti mkpu ahụ na ngwaa bụ isi pụta ìhè.
