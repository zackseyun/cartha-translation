id: MAT.27.33
reference: Matthew 27:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐλθόντες εἰς τόπον λεγόμενον Γολγοθᾶ, ὅ ἐστιν ⸂Κρανίου Τόπος λεγόμενος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/033.yaml
  text: And when they came to a place called Golgotha (which means Place of a Skull),[a]
translation:
  language: ig
  text: Mgbe ha rutere n’ebe a na-akpọ Gọlgọta (nke pụtara Ebe Okpokoro Isi),[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya dịka, “nke a na-akpọ Ebe Okpokoro Isi.” Okwu Grik a na-akọwa ihe aha Gọlgọta pụtara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: Mgbe ha rutere
  rationale: A sụgharịrị participle aorist a n’ụzọ na-egosi oge, nke dabara n’akụkọ Igbo ma chekwaa usoro akụkọ ahụ.
- source_word: τόπον
  choice: n’ebe
  rationale: τόπος pụtara ‘ebe’; okwu Igbo a dị mfe ma bụrụkwa nke a na-eji eme ihe n’asụsụ ugbu a.
- source_word: λεγόμενον
  choice: a na-akpọ
  rationale: N’usoro okwu a, λέγω pụtara ịkpọ ebe aha; ‘a na-akpọ’ bụ ntụgharị Igbo doro anya ma kwekọọ n’usoro passive nke Grik.
- source_word: Γολγοθᾶ
  choice: Gọlgọta
  rationale: A depụtara aha ebe ahụ n’ụda Igbo kama ịsụgharị ya, dị ka aha pụrụ iche.
- source_word: ὅ ἐστιν
  choice: nke pụtara
  rationale: Usoro a na-akọwa ihe aha Gọlgọta pụtara nye onye na-agụ ya; ‘nke pụtara’ na-egosipụta ọrụ nkọwa ahụ nke ọma.
- source_word: Κρανίου Τόπος
  choice: Ebe Okpokoro Isi
  rationale: κρανίον bụ ‘okpokoro isi,’ τόπος bụ ‘ebe.’ Nhazi a bụ Igbo dị mma ma na-ezere itinye nkọwa ọzọ na-adịghị n’isi mmalite.
- source_word: λεγόμενος
  choice: pụtara
  rationale: Nkwughachi nke ‘a na-akpọ’ n’asụsụ Grik so na nkọwa aha ahụ; n’Igbo, ‘pụtara’ na-ebufe ọrụ nkọwa ahụ n’enweghị nkwughachi na-adịghị eke.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere Gọlgọta dịka aha ebe, ma kọwaa ihe ọ pụtara n’ime akara nkọwa dịka isi mmalite Grik si mee.
