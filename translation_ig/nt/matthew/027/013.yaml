  text: τότε λέγει αὐτῷ ὁ Πιλᾶτος· Οὐκ ἀκούεις πόσα σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/013.yaml
  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: ig
  text: Mgbe ahụ, Paịlet sịrị ya, “Ì naghị anụ ole ihe ha na-agba akaebe megide gị?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “ha na-agba ama megide gị.” Ngwaa Grik ahụ nwere echiche metụtara iwu na ikpe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ akara oge na-egosi ihe sochiri n’usoro akụkọ; ‘Mgbe ahụ’ bụ Igbo doro anya ma kwụsie ike.
- source_word: λέγει
  choice: sịrị
  rationale: Ọ bụ historical present n’asụsụ Grik, ma n’akụkọ Igbo, oge gara aga ‘sịrị’ na-ada nke ọma ma na-edobe usoro akụkọ.
- source_word: αὐτῷ
  choice: ya
  rationale: E debere nnọchiaha ahụ dịka ọ dị na Grik; onye a na-ekwu maka ya doro anya site n’ihe gbara amaokwu ahụ gburugburu.
- source_word: ὁ Πιλᾶτος
  choice: Paịlet
  rationale: A sụgharịrị aha onye ahụ n’ụdị a na-ejikarị ede ya n’Igbo, na-enweghị isiokwu Grik nke na-adịghị mkpa n’Igbo.
- source_word: Οὐκ ἀκούεις
  choice: Ì naghị anụ
  rationale: Nke a na-edobe ajụjụ nkwenye na-adịghị mma na isi echiche ἀκούω, bụ́ ‘ịnụ.’
- source_word: πόσα
  choice: ọtụtụ ihe
  rationale: N’ebe a, πόσα na-egosi ọtụtụ okwu ma ọ bụ ihe e kwuru; ‘ọtụtụ ihe’ adịghị agbakwụnye nkọwa ‘ebubo’ nke Grik ekwughị kpọmkwem.
- source_word: σου
  choice: megide gị
  rationale: Mgbe ọ na-eso καταμαρτυρέω, genitive a nwere echiche nke ịgba akaebe megide mmadụ; Igbo chọrọ ka e kwuo njikọ ahụ hoo haa.
- source_word: καταμαρτυροῦσιν
  choice: ha na-agba akaebe megide
  rationale: Nke a na-edobe echiche iwu na ikpe dị na ngwaa Grik ma ghara ime ka ọ bụrụ naanị ‘ha na-ebo gị ebubo.’ Ọdịdị ‘na-agba’ na-egosi ihe na-aga n’ihu n’oge ahụ.
