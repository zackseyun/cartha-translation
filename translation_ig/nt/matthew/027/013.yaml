translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu na-ada nke ọma n’Igbo, ebe a na-edobe ọdịdị ajụjụ ahụ na echiche iwu dị n’okwu Grik.
