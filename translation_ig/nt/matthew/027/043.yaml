revisions:
- from: Ọ tụkwasịwo Chineke obi[a]; ka Chineke napụta ya ugbu a, ma ọ bụrụ na ọ chọrọ ya, n’ihi na o kwuru[b], ‘Abụ m Ọkpara Chineke.’
  to: Ọ tụkwasịwo Chineke obi[a]; ka Chineke napụta ya ugbu a, ma ọ bụrụ na Chineke chọrọ ya, n’ihi na o kwuru[b], ‘Abụ m Nwa Chineke.’
  rationale: The revision preserves the Greek syntax and taunting register while resolving pronoun ambiguity, correcting the alternative-reading footnote, and using the standard Igbo christological title ‘Nwa Chineke.’ No disputed textual matter is resolved beyond what the SBLGNT wording supports.
  reviewer_model: gpt-5.6-terra
