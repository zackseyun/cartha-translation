  edition: SBLGNT
  text: πέποιθεν ἐπὶ τὸν θεόν, ῥυσάσθω ⸀νῦν εἰ θέλει αὐτόν· εἶπεν γὰρ ὅτι Θεοῦ εἰμι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: ig
  text: Ọ tụkwasịwo Chineke obi[a]; ka Chineke napụta ya ugbu a, ma ọ bụrụ na Chineke chọrọ ya, n’ihi na o kwuru[b], ‘Abụ m Nwa Chineke.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘ma ọ bụrụ na Chineke na-enwe mmasị n’ebe ọ nọ.’ Okwu a na-ekwughachi Abụ Ọma 22:8, ebe echiche ihu ọma Chineke pụtara ìhè.
    reason: alternative_reading
  - marker: b
    text: Njakịrị a na-ekwughachi Abụ Ọma 22:8, na-ejikọta mkparị a a kparịrị Jizọs na onye ezi omume na-ata ahụhụ n’Abụ Ọma ahụ.
    reason: cross_reference
lexical_decisions:
- source_word: πέποιθεν ἐπὶ τὸν θεόν
  choice: Ọ tụkwasịwo Chineke obi
  rationale: Ụdị zuru oke nke πέποιθεν na-egosi ntụkwasị obi e tinyere na mbụ nke ka dịgide. ‘Tụkwasị ... obi’ bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo ịdabere n’ebe Chineke nọ.
- source_word: ῥυσάσθω νῦν
  choice: ka Chineke napụta ya ugbu a
  rationale: ῥύομαι pụtara ịnapụta mmadụ n’ihe ize ndụ; ‘napụta’ dabara nke ọma. A kpọpụtara ‘Chineke’ dịka onye na-eme ihe ahụ, ebe isiokwu ahụ sitere n’ahịrịokwu bu ụzọ ma doo anya na Grik.
- source_word: εἰ θέλει αὐτόν
  choice: ma ọ bụrụ na ọ chọrọ ya
  rationale: θέλω n’ebe a pụtara ‘ịchọ’ ma ọ bụ ‘ịchọrọ.’ Nsụgharị a na-edobe okwu Grik kpọmkwem, ebe nkọwa nwere echiche nke inwe mmasị n’ebe ọ nọ dị na nkọwa ala peeji.
- source_word: εἶπεν γὰρ ὅτι
  choice: n’ihi na o kwuru
  rationale: Aorist εἶπεν bụ ihe e kwuru n’oge gara aga; a tụgharịrị okwu na-esochi ya dịka okwu ọnụ kpọmkwem maka nghọta dị mfe.
- source_word: Θεοῦ εἰμι υἱός
  choice: Abụ m Ọkpara Chineke
  rationale: N’akụkọ Matiu, okwu a bụ aha e ji amata Jizọs n’ụzọ pụrụ iche. ‘Ọkpara Chineke’ na-edobe ịdị arọ nke aha ahụ, ọ bụghị nanị ‘otu nwa Chineke.’
theological_decisions:
- issue: Otu e si tụgharịa Θεοῦ εἰμι υἱός
  choice: Abụ m Ọkpara Chineke
  alternative: Abụ m nwa Chineke
  rationale: Ọnọdụ okwu a n’akwụkwọ Matiu na-egosi aha Kraịst pụrụ iche. ‘Ọkpara Chineke’ na-egosipụta nke a n’enweghị itinye nkọwa okpukpe ọzọ na-adịghị n’amaokwu ahụ.
- issue: Ma θέλει αὐτόν kwesịrị ịbụ okwu siri ike dịka ‘ọ na-atọ ya ụtọ’
  choice: ma ọ bụrụ na ọ chọrọ ya
  alternative: ma ọ bụrụ na ihe ya na-atọ ya ụtọ
  rationale: ‘Ọ chọrọ ya’ kacha eso ihe θέλω na-ekwu kpọmkwem. Otú ọ dị, n’ihi ndabere ya na Abụ Ọma 22:8, echiche nke ihu ọma ma ọ bụ obi ụtọ ka e debere na nkọwa ala peeji kama itinye ya n’ime amaokwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Napụta’ na ‘tụkwasị ... obi’ bụ okwu nkịtị ma ziri ezi; ‘Ọkpara Chineke’ na-edobe aha Kraịst ahụ n’ụzọ a na-aghọta nke ọma.
