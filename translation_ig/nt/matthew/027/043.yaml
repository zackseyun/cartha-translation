    reason: alternative_reading
  - marker: b
    text: Njakịrị a na-ekwughachi Abụ Ọma 22:8, na-ejikọta mkparị a a kparịrị Jizọs na onye ezi omume na-ata ahụhụ n’Abụ Ọma ahụ.
    reason: cross_reference
