id: MAT.27.46
reference: Matthew 27:46
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: ig
  text: N’ihe dị ka elekere atọ n’ehihie, Jizọs tiri mkpu n’olu dara ụda[a], sị, “Eli, Eli, lema sabaktani?” Ya bụ, “Chineke m, Chineke m,[b] gịnị mere i ji gbahapụ m?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu a na-eme ka mmadụ cheta Abụ Ọma 22:1.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsụgharị ya, “gịnị mere i ji gbahapụụrụ m?”; Grik ji ngwaa n’ụdị aorist.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: N’ihe dị ka elekere atọ nke ehihie
  rationale: περί na-egosi oge a na-eme atụmatụ, ya bụ ‘n’ihe dị ka.’ ‘Elekere atọ nke ehihie’ na-enye onye Igbo nke oge a nghọta kpọmkwem banyere elekere nke itoolu n’usoro oge ndị Juu, ebe δέ bụ njikọ dị nro nke a na-adịghị mkpa ịtụgharị iche n’ebe a.
- source_word: ἀνεβόησεν ... φωνῇ μεγάλῃ
  choice: tiri mkpu n’olu dara ụda
  rationale: Nkebiokwu a na-echekwa ma omume iti mkpu ma ike olu ahụ n’Igbo eke na nke dị ugwu.
- source_word: λέγων
  choice: sị
  rationale: ‘Sị’ bụ ụzọ Igbo dị mkpirikpi ma dị eke isi webata kpọmkwem ihe o kwuru.
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: Eli, Eli, lema sabaktani?
  rationale: Matiu buru ụzọ debe mkpu ahụ n’asụsụ Semitic tupu ọ kọwaa ya; nsụgharị ahụ na-emekwa otu ihe ahụ. ‘sabaktani’ na-anọchi ụda okwu ahụ n’usoro mkpụrụedemede Igbo.
- source_word: τοῦτ’ ἔστιν
  choice: Nke ahụ bụ
  rationale: Nke a bụ ntụgharị Igbo doro anya nke usoro na-ebute nkọwa ma ọ bụ nsụgharị okwu.
- source_word: Θεέ μου θεέ μου
  choice: Chineke m, Chineke m
  rationale: E debere ịkpọku Chineke ugboro abụọ dịka Grik si mee, ma chekwaa nkwughachi nke Abụ Ọma 22:1.
- source_word: ἱνατί
  choice: gịnị mere ... ji
  rationale: Nke a bụ usoro ajụjụ Igbo eke maka ‘n’ihi gịnị.’
- source_word: ἐγκατέλιπες
  choice: gbahapụ m
  rationale: Ngwaa a pụtara ịhapụ mmadụ n’enweghị enyemaka. ‘Gbahapụ’ dabara n’olu siri ike nke mkpu ahụ ma ghara ịgbakwunye nkọwa ozizi.
theological_decisions:
- issue: Mmekọrịta mkpu Jizọs na Abụ Ọma 22:1
  choice: Ịsụgharị ya dịka ezigbo mkpu nke ịgbahapụ, ma debe okwu nke Abụ Ọma ahụ n’enweghị ịkọwa esemokwu nkà mmụta okpukpe ya.
  alternative: Ịkọwa ya nanị dịka nt引用 aka n’Abụ Ọma 22, ma ọ bụ ime ka echiche ịgbahapụ dị nro.
  rationale: Grik na-enye mkpu ahụ ozugbo n’enweghị nkọwa na-eme ka ọ dị nro. Nsụgharị ahụ kwesịrị idebe ma ịdị adị nke mkpu ahụ ma omimi nkà mmụta okpukpe ya n’enweghị ịmanye otu nkọwa.
- issue: Idobe mkpu Semitic n’ahịrịokwu bụ isi
  choice: Idobe ‘Eli, Eli, lema sabaktani?’ ma nye nkọwa ya ozugbo.
  alternative: Inye naanị ihe okwu ahụ pụtara n’Igbo.
  rationale: Matiu n’onwe ya debere okwu mbụ ahụ ma sụgharịa ya; idobe ha abụọ na-asọpụrụ nhazi na mkpa akụkọ nke isi mmalite ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. E jiri ‘elekere atọ nke ehihie’ mee ka usoro oge ndị Juu doo onye na-agụ nke oge a anya; e debere okwu Semitic ahụ n’ụdị mkpụrụedemede dabara n’Igbo.
