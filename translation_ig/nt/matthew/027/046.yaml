revisions:
- from: N’ihe dị ka elekere atọ nke ehihie, Jizọs tiri mkpu n’olu dara ụda[a], sị, “Eli, Eli, lema sabaktani?” Nke ahụ bụ, “Chineke m, Chineke m,[b] gịnị mere i ji gbahapụ m?”
  to: N’ihe dị ka elekere atọ n’ehihie, Jizọs tiri mkpu n’olu dara ụda[a], sị, “Eli, Eli, lema sabaktani?” Ya bụ, “Chineke m, Chineke m,[b] gịnị mere i ji gbahapụ m?”
  rationale: The revision makes only minor idiomatic improvements to the time and explanatory formulas and clarifies the lexical-alternative note. It preserves the source’s approximate time reference, emphatic cry, Semitic wording, Psalmic echo, direct question, and theological openness.
