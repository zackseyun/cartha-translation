id: MAT.27.31
reference: Matthew 27:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν χλαμύδα καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ καὶ ἀπήγαγον αὐτὸν εἰς τὸ σταυρῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: ig
  text: Mgbe ha kwachara ya emo, ha yipụrụ ya uwe mwụda ahụ[a], yikwasịrị ya uwe ya, wee duru ya pụọ ka ha kpọgide ya n’obe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “uwe mgbokwasị ahụ.” Okwu Grik χλαμύς na-ezo aka n’uwe a na-eyikwasị n’elu uwe ndị ọzọ; n’ebe a, ọ bụ uwe ahụ e yikwasịrị Jizọs iji kwaa ya emo dị ka eze.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: kwachara ya emo
  rationale: Nkebiokwu a na-egosi ịkwa mmadụ emo n’ụzọ mkparị na obi ọjọọ; ‘kwachara’ na-egosikwa na ihe ahụ mere tupu ihe ndị sochirinụ.
- source_word: χλαμύδα
  choice: uwe mwụda ahụ
  rationale: χλαμύς bụ uwe a na-eyikwasị n’elu uwe ndị ọzọ, mgbe ụfọdụ uwe ndị agha ma ọ bụ ndị ọchịchị; ‘uwe mwụda’ na-edebe isi echiche ahụ n’Igbo nkịtị n’etinyeghị nkọwa karịrị okwu Grik.
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: ha yipụrụ ya uwe mwụda ahụ
  rationale: ἐκδύω pụtara iyipụ mmadụ uwe. Nsụgharị a doro anya ma bụrụkwa ụzọ e si ekwu ya n’Igbo.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: yirikwa ya uwe nke ya
  rationale: ἐνδύω bụ iyikwasị mmadụ uwe, ebe αὐτοῦ na-egosi na uwe ndị a bụ nke Jizọs n’onwe ya, dị iche n’uwe mwụda e ji mee ya eze n’ụzọ ịkwa emo.
- source_word: ἱμάτια
  choice: uwe
  rationale: ‘Uwe’ bụ okwu Igbo sara mbara ma doo anya maka uwe dị iche iche; ọnụọgụ ya pụtara ìhè site n’ọnọdụ okwu a n’Igbo.
- source_word: ἀπήγαγον
  choice: duru ya pụọ
  rationale: ἀπάγω na-egosi iduru mmadụ pụọ; ebe a, ndị agha na-eduru onye mkpọrọ aga.
- source_word: εἰς τὸ σταυρῶσαι
  choice: ka ha kpọgide ya n’obe
  rationale: εἰς tinyere infinitive a na-egosi nzube. ‘Ka ha kpọgide ya n’obe’ na-ekwupụta nzube ahụ n’Igbo ebumpụta ụwa.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ihe omume nke okwu Grik, ma jiri ‘kwachara’ mee ka njikọ oge ahụ pụta ìhè. E debere akara nkọwa ala peeji [a] ozugbo n’akụkụ okwu χλαμύς ọ na-akọwa.
