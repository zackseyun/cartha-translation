  verdict: revise
  source_fidelity: 'The draft preserves the sequence and sense of the Greek: mockery, removal of the χλαμύς, restoration of Jesus'' own clothing, and leading him away for crucifixion. The purpose clause is rendered accurately. However, the footnote''s alternative “uwe ogologo” (“long garment”) is not a reliable lexical alternative for χλαμύς, which denotes an outer cloak rather than necessarily a long garment.'
  naturalness: The sentence is generally clear Standard Igbo. Recasting the second clothing action with the explicit past form “yikwasịrị” makes the coordinated narrative actions smoother and less ambiguous.
  terminology: “Uwe mwụda” is retained as an established, intelligible rendering in this context, while the footnote now gives the more lexically focused alternative “uwe mgbokwasị” (“outer cloak”). The footnote also avoids implying more than the context says about the mock royal treatment.
  issues:
  - severity: medium
    issue: The footnote gives “uwe ogologo ahụ” as an alternative for χλαμύς.
    rationale: A χλαμύς is an outer cloak; its defining sense is not that it is long. “Uwe ogologo” can misidentify the garment.
  - severity: low
    issue: “yirikwa ya uwe nke ya” is less idiomatic and less explicitly finite than the surrounding past narrative verbs.
    rationale: “Yikwasịrị ya uwe ya” clearly expresses that they dressed him again in his own clothes.
  - severity: low
    issue: The footnote says the garment was used “iji mee ya eze.”
    rationale: The context concerns mocking Jesus as a king, not making him king. The wording should retain the mockery without overstating the action.
