revisions:
- from: Ma ndị ọzọ kwuru[a], “Hapụ ya otu ahụ. Ka anyị hụ ma Ịlaịja ọ̀ na-abịa ịzọpụta ya[b].”
  to: Ma ndị fọdụrụ kwuru[a], “Hapụ ya. Ka anyị hụ ma Elaija ọ̀ na-abịa[b] ịzọpụta ya.”
  rationale: The revision more precisely represents ‘the rest,’ uses the established Igbo biblical form ‘Elaija,’ and removes an added nuance from the imperative. It preserves the Greek present tense in the main text and retains the future-oriented alternative in an anchored footnote.
