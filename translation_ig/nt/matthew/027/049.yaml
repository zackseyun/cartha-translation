  text: οἱ δὲ λοιποὶ ⸀ἔλεγον· Ἄφες ἴδωμεν εἰ ἔρχεται Ἠλίας σώσων ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: ig
  text: Ma ndị fọdụrụ kwuru[a], “Hapụ ya. Ka anyị hụ ma Elaija ọ̀ na-abịa[b] ịzọpụta ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ọzọ kwuru.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ka anyị hụ ma Elaija ọ̀ ga-abịa ịzọpụta ya.” Asụsụ Grik ji ngwaa dị n’oge ugbu a, “na-abịa,” n’ajụjụ na-apụtaghị ozugbo nke “ma” webatara.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Ma ndị ọzọ
  rationale: Nke a na-egosi ndị fọdụrụ n’ebe ahụ n’adịghị ka onye ahụ e kwuru banyere ya tupu ugbu a; ‘ndị ọzọ’ bụ okwu Igbo dị mfe ma kwekọọ na ọnọdụ ahụ.
- source_word: ἔλεγον
  choice: kwuru
  rationale: Ọ bụ ezie na imperfect nwere ike igosi okwu a na-ekwu ugboro ugboro ma ọ bụ na-aga n’ihu, ‘kwuru’ bụ ụzọ akụkọ Igbo si ekwu ya nke ọma n’enweghị ịgbakwunye ihe akụkụ ngwaa ahụ na-akwadoghị nke ọma.
- source_word: Ἄφες
  choice: Hapụ ya otu ahụ
  rationale: Imperative a bụ otu onye ka a na-agwa ka ọ kwụsị itinye aka, ka ha hụ ihe ga-eme; e tinyere ‘ya’ dịka ihe a ghọtara site n’ọnọdụ ahụ.
- source_word: ἴδωμεν
  choice: Ka anyị hụ
  rationale: Nke a na-egosipụta subjunctive agbamume nke onye mbụ n’ọnụọgụ ọtụtụ n’ụzọ Igbo nkịtị ma doo anya.
- source_word: εἰ ἔρχεται
  choice: ma Ịlaịja ọ̀ na-abịa
  rationale: ‘Ma … ọ̀’ na-egosipụta ajụjụ na-apụtaghị ozugbo, ebe ‘na-abịa’ na-echekwa present tense na ịdị ngwa nke ihe na-eme.
- source_word: Ἠλίας
  choice: Ịlaịja
  rationale: Nke a bụ ụdị aha onye amụma Elijah a na-ejikarị n’Igbo.
- source_word: σώσων αὐτόν
  choice: ịzọpụta ya
  rationale: Future participle ahụ na-egosi ebumnuche nke ọbịbịa ahụ. ‘Ịzọpụta ya’ na-echekwa njikọ ya na σῴζω, ma n’ebe a ọ pụtara ịnapụta ya n’ọnwụ.
theological_decisions:
- issue: Ihe σώσων nwere ike ịpụta n’ụzọ nkà mmụta okpukpe n’akụkọ ịkpọgide n’obe
  choice: ịzọpụta ya
  alternative: ịnapụta ya
  rationale: Ndị na-ekwu okwu ahụ na-eche banyere ịnapụta Jizọs n’obe a na-ahụ anya, ọ bụghị na ha na-akọwa nzọpụta ebighị ebi. ‘Ịzọpụta’ ka na-echekwa okwu isi mmalite ahụ na amamihe dị omimi nke akụkọ ahụ n’enweghị ịkọwa ya gabiga ókè.
translation_notes:
  register: Asụsụ Igbo izugbe, nke dị ùgwù ma dị mfe nghọta. E debere usoro ajụjụ ‘ma … ọ̀’ iji mee ka okwu ahụ bụrụ Igbo eke, ma chekwaa present tense nke Grik n’isi ederede.
