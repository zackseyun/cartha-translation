  text: Ἐξερχόμενοι δὲ εὗρον ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα· τοῦτον ἠγγάρευσαν ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: ig
  text: Ka ha na-apụ, ha hụrụ otu nwoke si Saịrini, onye aha ya bụ Saịmọn. Ha manyere[a] nwoke a iburu obe ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘ha jiri ike tinye nwoke a n’ọrụ.’ Ngwaa Grik ahụ na-ekwu banyere ọrụ ndị ọchịchị ma ọ bụ ndị nwere ikike manyere mmadụ ịrụ.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, obe Jizọs.
    reason: referent_clarification
lexical_decisions:
- source_word: Ἐξερχόμενοι δὲ
  choice: Ka ha na-apụ
  rationale: A na-eji nkebiokwu a egosi ihe na-aga n’ihu n’otu oge ahụ akụkọ ahụ na-aga n’ihu. A hapụrụ δέ ka usoro ahịrịokwu Igbo wee bụrụ nke sitere n’ọnụ mmadụ, ebe ọ bụ naanị njikọ dị nro n’akụkọ a.
- source_word: εὗρον
  choice: ha hụrụ
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị mfe isi kwuo na ha chọtara ma ọ bụ zutere nwoke ahụ.
- source_word: ἄνθρωπον Κυρηναῖον
  choice: otu nwoke si Saịrini
  rationale: Nke a na-egosi na Saịrini bụ ebe nwoke ahụ si, n’ụzọ dị mma ma doo anya n’Igbo.
- source_word: ὀνόματι Σίμωνα
  choice: onye aha ya bụ Saịmọn
  rationale: Nke a bụ okwu Igbo sitere n’ọnụ mmadụ maka ịkọwa aha nwoke ahụ.
- source_word: τοῦτον
  choice: nwoke a
  rationale: A họọrọ okwu ngosipụta a kama naanị ‘ya’ iji chekwaa nkwusi ike dị na τοῦτον ma mee ka onye a na-ekwu banyere ya doo anya.
- source_word: ἠγγάρευσαν
  choice: ha manyere
  rationale: Ngwaa Grik a pụtara ịmanye mmadụ ịrụ ọrụ e nyere ya n’ihi ikike ndị ọchịchị; ‘manyere’ na-egosipụta mmanye ahụ nkenke ma doo anya.
- source_word: ἵνα ἄρῃ
  choice: iburu
  rationale: Infinitive Igbo a na-egosi nzube nke mmanye ahụ, ebe ‘iburu’ dabara n’ihe a na-eme obe n’ọnọdụ a.
- source_word: τὸν σταυρὸν
  choice: obe
  rationale: ‘Obe’ bụ okwu Igbo a na-ahụkarị ma zie ezi maka σταυρός; isi mmalite ahụ akọwaghị ya kpọmkwem dị ka naanị osisi obe a na-eburu n’ubu.
- source_word: αὐτοῦ
  choice: ya
  rationale: A chekwara nnọchiaha nke Grik kama itinye ‘Jizọs’ kpọmkwem n’ahịrịokwu bụ isi; ihe gbara ya gburugburu na-egosi onye nwe obe ahụ.
theological_decisions:
- issue: Onye αὐτοῦ (‘ya’) na-ezo aka na ya
  choice: E debere ‘obe ya,’ nke na-ezo aka n’obe Jizọs dịka akụkọ gbara ya gburugburu si egosi.
  alternative: A pụrụ ikwu ‘obe Jizọs’ kpọmkwem iji wepụ nghọtahie ọ bụla.
  rationale: Idobe nnọchiaha ahụ na-asọpụrụ usoro okwu Grik ma na-ahapụ ihe gbara amaokwu ahụ gburugburu ka ọ kọwaa onye a na-ekwu banyere ya; nkọwa ala peeji na-egbochi onye na-agụ ya iche na ọ bụ obe Saịmọn.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Saịrini’ na ‘Saịmọn’ bụ ntụgharị ụda aha obodo na aha mmadụ. E debere usoro akụkọ nkenke ma ghara itinye nkọwa okwukwe na-adịghị n’isi mmalite.
