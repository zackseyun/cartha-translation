id: MAT.27.24
reference: Matthew 27:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: ig
  text: Ya mere, mgbe Paịlet hụrụ na ihe ọ na-eme adịghị arụpụta ihe ọ bụla, kama na ọgba aghara na-amalite, o weere mmiri, saa aka ya n'ihu igwe mmadụ ahụ, sị, “Aka m adịghị n'ọbara a.”[a] “Unu onwe unu ga-ahụ maka ya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N''ụzọ nkịtị: “Enweghị m ikpe n''ọbara a.” Okwu a pụtara na Paịlet na-ekwu na ọ bụghị ya ka ibu ọrụ maka ọnwụ ahụ dịịrị.'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Unu onwe unu ga-ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πιλᾶτος
  choice: Ya mere, mgbe Paịlet hụrụ
  rationale: A na-eji “Ya mere, mgbe” gosipụta nzọụkwụ ọhụrụ na akụkọ ahụ na njikọ ya na ihe bu ya ụzọ, n'Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa.
- source_word: οὐδὲν ὠφελεῖ
  choice: ihe ọ na-eme adịghị arụpụta ihe ọ bụla
  rationale: Ọ bụ ezie na Grik pụtara n'ụzọ nkịtị na ‘ọ dịghị ihe ọ na-enyere,’ okwu a na-ezo aka n'ịda mba nke mbọ Paịlet; nsụgharị a na-eme ka ihe ahụ doo anya n'Igbo.
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: kama na ọgbaaghara na-amalite
  rationale: “Ọgbaaghara” na-ekpuchi echiche nke mkpọtụ, ọgba aghara, ma ọ bụ nnupụisi na-ebili; “na-amalite” na-echekwa echiche nke ọnọdụ ahụ na-eto eto.
- source_word: λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας
  choice: o weere mmiri saa aka ya
  rationale: Nke a bụ ụzọ Igbo nkịtị si kọwaa omume abụọ ahụ n'usoro ha mere, ma na-echekwa ihe ngosi ahụ Paịlet mere.
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: n'ihu igwe mmadụ ahụ
  rationale: Ọ na-egosi na Paịlet mere ihe ahụ ebe igwe mmadụ ahụ na-ahụ ya, dịka Grik si kwuo.
- source_word: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου
  choice: Aka m adịghị n'ọbara a
  rationale: Nke a bụ akpaalaokwu Igbo doro anya nke na-egosi na onye ahụ na-ekwu na ọ bụghị ya kpatara ọnwụ ahụ, ma ọ naghị ekpebi ma nkwupụta Paịlet ọ̀ bụ eziokwu.
- source_word: ὑμεῖς ὄψεσθε
  choice: Unu onwe unu ga-ahụ maka ya
  rationale: “Unu onwe unu” na-echekwa nkwusi ike dị na nnọchiaha Grik; “ga-ahụ maka ya” na-egosipụta ojiji akpaalaokwu nke ọdịnihu ὄψεσθε, ya bụ ibu ọrụ ahụ.
theological_decisions:
- issue: Nkwupụta Paịlet na aka ya dị ọcha
  choice: 'E debere ya dịka nkwupụta Paịlet n''onwe ya: “Aka m adịghị n''ọbara a.”'
  alternative: “Ọbara a amaghị m ikpe” ma ọ bụ nsụgharị nkịtị karịa, “Adịghị m ikpe site n'ọbara a.”
  rationale: Nsụgharị ahụ na-egosi na Paịlet na-agọnahụ ibu ọrụ maka ọnwụ ahụ, ma ọ naghị akwado ma ọ bụ jụ nkwupụta ya; ya mere, esemokwu omume na nkà mmụta okpukpe dị n'akụkọ ahụ ka dị.
- issue: ὑμεῖς ὄψεσθε dị ka ibu ọrụ
  choice: “Unu onwe unu ga-ahụ maka ya.”
  alternative: “Unu onwe unu ga-ahụ.”
  rationale: Ihe a họọrọ na-enye echiche akpaalaokwu ahụ n'Igbo nke oge a, ebe ihe ọzọ na-echekwa ọdịdị nkịtị mana ọ nwere ike ghara ido onye na-agụ ya anya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Aka m adịghị n'ọbara a” bụ akpaalaokwu Igbo na-enye otu echiche nke Grik banyere ịgọnahụ ibu ọrụ maka ọnwụ, ebe nkọwa ala peeji na-echekwa ọdịdị nkịtị nke isi mmalite.
