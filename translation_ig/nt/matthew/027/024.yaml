    issue: Footnote a gives an unnatural and misleading purportedly literal rendering.
    rationale: “Adịghị m ikpe site n'ọbara a” does not naturally mean ‘I am innocent of/from this blood’ in Standard Igbo. A footnote should clarify the source idiom rather than introduce an opaque or semantically faulty expression.
  - severity: low
    issue: The disturbance term and action sequence can be slightly regularized.
    rationale: Writing “ọgba aghara” and separating the sequential actions with punctuation improves modern Standard Igbo readability without changing meaning.
