id: MAT.27.9
reference: Matthew 27:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: ig
  text: 'Mgbe ahụ, okwu ahụ e kwuru site n’ọnụ Jeremaya onye amụma mezuru[a], sị:


    “Ha were mkpụrụ ego ọlaọcha iri atọ ahụ,


    ọnụ ego e ji onye ahụ e tinyere ọnụ ahịa n’isi ya,


    onye ha tinyere ọnụ ahịa n’isi ya site n’etiti ụmụ Izrel[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Matiu kwuru na okwu amụma a sitere n’ọnụ Jeremaya. Otú e si dee ya kacha yie Zekaraya 11:12–13. Ndị na-akọwa Akwụkwọ Nsọ enyela nkọwa dị iche iche: ụfọdụ na-ewere ya dị ka okwu e jikọtara site n’akwụkwọ amụma karịrị otu; ụfọdụ na-ekwu na ọ na-ezo aka n’otu nchịkọta akwụkwọ ndị amụma; ndị ọzọ na-ele ya anya dị ka nsogbu bilitere mgbe a na-ebufe ihe odide ahụ.'
    reason: textual_variant
  - marker: b
    text: A pụkwara ịsụgharị ya, “site n’ụmụ Izrel,” ma ọ bụ, “ụfọdụ n’ime ụmụ Izrel.” Nkebiokwu Grik a siri ike nghọta, ya mere a maghị kpọmkwem otú njikọ ya na okwu ndị bu ya ụzọ dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Na-egosi usoro oge n’akụkọ ahụ n’ụzọ dị mkpirikpi ma bụrụkwa Igbo nkịtị.
- source_word: ἐπληρώθη
  choice: mezuru
  rationale: Na-echekwa usoro okwu Matiu ji ekwu na okwu amụma mezuru, n’enweghị ịkọwa onye mere ka o mezuo.
- source_word: τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου
  choice: okwu ahụ e kwuru site n’ọnụ Jeremaya onye amụma
  rationale: “Site n’ọnụ” na-egosi na onye amụma bụ onye e si n’aka ya kwuo okwu ahụ, ma na-ada nke ọma n’Igbo.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: mkpụrụ ego ọlaọcha iri atọ ahụ
  rationale: Na-eme ka o doo anya na ἀργύρια bụ ego ọlaọcha, ọ bụghị naanị ọlaọcha dị ka ihe.
- source_word: τὴν τιμὴν τοῦ τετιμημένου
  choice: ọnụ ego e ji onye ahụ e tinyere ọnụ ahịa n’isi ya
  rationale: Na-echekwa echiche azụmahịa na ihe ịtụnanya dị n’iji τιμή/τιμάω eme ihe, ma bụrụkwa okwu Igbo a pụrụ ịghọta.
- source_word: ὃν ἐτιμήσαντο
  choice: onye ha tinyere ọnụ ahịa n’isi ya
  rationale: Ntughari a na-emeghachi otu okwu ahụ dịka Grik si emeghachi τιμάω, kama ịgbanwe ya ka ọ bụrụ naanị ‘sọpụrụ.’
- source_word: ἀπὸ υἱῶν Ἰσραήλ
  choice: n’etiti ụmụ Izrel
  rationale: Na-anọgide nso na nkebiokwu Grik siri ike ma na-ahapụ njikọ ya ka ọ ghara ịbụ nke a kpebiri kpamkpam; ihe ndị ọzọ e nwere dị na ndetu ala peeji.
theological_decisions:
- issue: Matiu kpọrọ Jeremaya aha, ebe okwu ahụ kacha yie Zekaraya 11:12–13.
  choice: E debere “Jeremaya onye amụma” n’ahịrị bụ isi.
  alternative: Ịgbanwe aha ahụ ka ọ bụrụ Zekaraya, ma ọ bụ ịkọwa ya ozugbo dịka ngwakọta okwu amụma.
  rationale: Ihe odide Grik SBLGNT kwuru Jeremaya; ntụgharị ekwesịghị imezi ma ọ bụ kpochapụ esemokwu akụkọ-ihe-odide a.
- issue: Mmetụta nke ἀπὸ υἱῶν Ἰσραήλ.
  choice: “n’etiti ụmụ Izrel,” tinyere ndetu na-egosi ihe ndị ọzọ e nwere.
  alternative: “site n’ụmụ Izrel” ma ọ bụ “ụfọdụ n’ime ụmụ Izrel.”
  rationale: Grik ahụ siri ike, ya mere a naghị ekpebi n’ahịrị bụ isi ma ọ bụ onye mere omume ahụ, ebe o si malite, ma ọ bụ òtù a họpụtara n’ime Izrel.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta. E zere okwu ụka nke otu denominashọn kpọmkwem. E debere mmeghachi “tinyere ọnụ ahịa n’isi ya” iji gosi mmeghachi okwu dị na Grik, ebe ndetu ala peeji na-echekwa mgbagwoju anya nke nkebiokwu ikpeazụ.
