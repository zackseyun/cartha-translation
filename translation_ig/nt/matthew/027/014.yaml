id: MAT.27.14
reference: Matthew 27:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὐκ ἀπεκρίθη αὐτῷ πρὸς οὐδὲ ἓν ῥῆμα, ὥστε θαυμάζειν τὸν ἡγεμόνα λίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: ig
  text: Ọzọkwa, ọ zaghị ya ọbụna otu okwu, nke mere na o juru gọvanọ ahụ anya nke ukwuu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ọ zaghị
  rationale: Ngwaa a pụtara ịza ma ọ bụ ịmeghachi okwu; “ọ zaghị” bụ ụzọ Igbo dị mfe ma kwụ ọtọ isi gosipụta ngọnarị ahụ.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha dative a na-egosi onye a na-aza; n'ọnọdụ a, ọ na-ezo aka na Paịlet.
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: ọbụna otu okwu
  rationale: 'Nke a na-echekwa nkwusi ike nke οὐδὲ ἕν: ọ zaghị ma ọlị, ọbụna otu okwu.'
- source_word: ὥστε
  choice: nke mere na
  rationale: Ọ na-ewebata ihe si n'ịgbachi nkịtị ahụ pụta; “nke mere na” bụ usoro Igbo ebumpụta ụwa maka nsonaazụ.
- source_word: θαυμάζειν
  choice: o juru ... anya
  rationale: Akpaalaokwu Igbo a na-egosi ịtụnanya ma ọ bụ oke iju anya n'ụzọ doro anya.
- source_word: ἡγεμόνα
  choice: gọvanọ ahụ
  rationale: N'ọnọdụ ọchịchị Rom a, okwu ahụ na-ezo aka n'aka gọvanọ, ya bụ Paịlet.
- source_word: λίαν
  choice: nke ukwuu
  rationale: Ọ na-echekwa ike nke adverb ahụ, na-egosi na o juru gọvanọ ahụ anya nke ukwuu.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma nwee ugwu; ahịrịokwu ahụ dị mfe nghọta ma na-echekwa nkwusi ike na Jizọs azaghị ọbụna otu okwu.
