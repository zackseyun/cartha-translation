  text: Τῇ δὲ ἐπαύριον, ἥτις ἐστὶν μετὰ τὴν παρασκευήν, συνήχθησαν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι πρὸς Πιλᾶτον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/062.yaml
  text: On the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
translation:
  language: ig
  text: N’echi ya[a], ya bụ ụbọchị sochiri Ụbọchị Nkwadebe, ndị isi nchụàjà na ndị Farisii zukọrọ n’ihu Paịlet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ya bụ, mgbe Nkwadebe gasịrị.” Okwu Grik ahụ nwere ike ịpụta ụbọchị nkwadebe tupu ụbọchị izuike; ịsụgharị ya “Fraịdee” ga-abụ ịkọwa ihe karịrị ihe ederede ahụ chọrọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: N’echi ya
  rationale: Nkebi okwu a na-egosi ụbọchị sochirinụ. Nsụgharị a bụ Igbo doro anya ma dịkwa nkenke; a naghị atụgharị δέ dịka okwu pụrụ iche n’ihi na ebe a ọ bụ njikọ dị nro.
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: ya bụ ụbọchị sochiri Ụbọchị Nkwadebe
  rationale: ἥτις na-eweta nkọwa banyere ụbọchị ahụ. ‘Ụbọchị sochiri’ na-egosipụta μετὰ nke ọma n’Igbo, ebe ‘ya bụ’ na-eme ka ọrụ nkọwa nke nkebiokwu ahụ pụta ìhè.
- source_word: παρασκευήν
  choice: Ụbọchị Nkwadebe
  rationale: Okwu a na-ezokarị aka n’ụbọchị nkwadebe tupu ụbọchị izuike ndị Juu. A naghị asụgharị ya ‘Fraịdee’ ka a ghara ịkọwa ihe karịrị ihe ederede Grik kwuru.
- source_word: συνήχθησαν
  choice: zukọrọ
  rationale: 'Ụdị ngwaa a na-arụ ọrụ dịka ngwaa na-anaghị achọ ihe a na-eme ya: ha gbakọrọ ọnụ. ‘Zukọrọ’ bụ okwu Igbo ebumpụta ụwa ma na-egosi nzukọ ahụ nke ọma.'
- source_word: οἱ ἀρχιερεῖς
  choice: ndịisi nchụàjà
  rationale: Nke a na-ezo aka n’ìgwè ndị ọchịchị nchụàjà kachasị elu, ọ bụghị ọtụtụ ndị ji naanị otu ọkwa nnukwu onye nchụàjà.
- source_word: οἱ Φαρισαῖοι
  choice: ndị Farisii
  rationale: Nke a bụ ndegharị aha ìgwè ndị Juu ahụ n’ụdị Igbo a na-aghọta ngwa ngwa.
- source_word: πρὸς Πιλᾶτον
  choice: n’ihu Paịlet
  rationale: πρός mgbe ọ na-eso ngwaa nke izukọ nwere ike igosi ịbịakwute mmadụ ma ọ bụ ịpụta n’ihu ya. ‘N’ihu Paịlet’ dabara n’ọnọdụ ọchịchị a ma ghara ịgbakwunye nkọwa ọzọ.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara okwu kalenda ndị Juu dịka “Ụbọchị Nkwadebe” kama iji aha ụbọchị nke ga-eme ka nkọwa ahụ sie ike karịa isi mmalite Grik.
