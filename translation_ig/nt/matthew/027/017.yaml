id: MAT.27.17
reference: Matthew 27:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: ig
  text: 'Ya mere, mgbe ha gbakọtara, Paịlet sịrị ha, “Olee onye unu chọrọ ka m tọhapụụrụ unu: Jizọs Barabas[a], ka ọ bụ Jizọs onye a na-akpọ Mesaịa[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ naanị “Barabas” kama “Jizọs Barabas.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ “Kraịst.” Okwu Grik bụ Christos; a sụgharịrị ya ebe a dịka “Mesaịa” n’ihi na ọ na-arụ ọrụ dịka aha e ji akọwa onye.
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων
  choice: mgbe ha gbakọtara
  rationale: 'Nke a na-egosi oge ihe ahụ mere: ìgwè mmadụ ahụ ebula ụzọ gbakọta tupu Paịlet ajụọ ha ajụjụ.'
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a na akụkọ gara aga ma na-egosi otú akụkọ ahụ si na-aga n’ihu.
- source_word: Τίνα
  choice: Olee onye
  rationale: Ọ bụ ajụjụ gbasara ịhọrọ otu onye n’etiti mmadụ abụọ a kpọrọ aha.
- source_word: θέλετε
  choice: unu chọrọ
  rationale: N’ebe a, okwu ahụ na-egosi ọchịchọ ma ọ bụ nhọrọ nke ìgwè mmadụ ahụ.
- source_word: ἀπολύσω
  choice: ka m tọhapụụrụ unu
  rationale: N’ọnọdụ ikpe a, ọ pụtara ịtọhapụ onye mkpọrọ, ọ bụghị ịgbaghara mmehie ya.
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: Jizọs Barabas
  rationale: A gbasoro ihe odide SBLGNT nke nwere aha Jizọs tupu Barabas, si otú a chekwaa ntụnyere dị n’etiti ndị ikom abụọ aha ha bụ Jizọs.
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: Jizọs onye a na-akpọ Mesaịa
  rationale: ‘Onye a na-akpọ’ na-egosipụta λεγόμενον n’enweghị ịgbakwụnye olu nlelị; ‘Mesaịa’ na-asụgharị χριστός dịka utu aha n’ebe a.
theological_decisions:
- issue: Nsụgharị χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ahịrịokwu a, χριστός bụ utu aha e ji amata Jizọs, ọ bụghị akụkụ aha ya; ya mere e ji ‘Mesaịa’ mee ka ọrụ utu aha ahụ doo anya.
- issue: Itinye ‘Jizọs’ tupu Barabas
  choice: E tinyere ya n’ahịrịokwu bụ isi dịka ‘Jizọs Barabas’
  alternative: Barabas naanị
  rationale: Ihe odide Greek e nyere, SBLGNT, nwere Ἰησοῦν; a hapụrụ ọgụgụ dị mkpụmkpụ nke ụfọdụ ihe odide n’ala ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. ‘Tọhapụụrụ unu’ na-enye echiche ikpe nke ịtọhapụ onye mkpọrọ; aha mmadụ bụ nsụgharị ụda a na-ahụkarị n’Igbo.
