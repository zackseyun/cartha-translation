source:
  edition: SBLGNT
  text: Τότε σταυροῦνται σὺν αὐτῷ δύο λῃσταί, εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/038.yaml
  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: ig
  text: Mgbe ahụ, a kpọgidere ndị ohi abụọ n'obe, ha na ya, otu n'aka nri ya, nke ọzọ n'aka ekpe ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị na-apụnara mmadụ ihe.” Okwu Grik ahụ nwere ike ịpụta ndị ohi na-eme ihe ike, mgbe ụfọdụkwa ọ pụrụ ịgụnye ndị nnupụisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe ọzọ sochiri n'usoro akụkọ ahụ; ‘Mgbe ahụ’ bụ okwu Igbo doro anya ma bụrụkwa nke e ji akọ akụkọ n'ụzọ ebumpụta ụwa.
- source_word: σταυροῦνται
  choice: a kpọgidere ... n'obe
  rationale: Ngwaa ahụ bụ passive ma dị na present e ji akọ akụkọ n'ụzọ dị ndụ; Igbo na-eji oge gara aga ebe a n'ụzọ ebumpụta ụwa, ma ‘kpọgidere n'obe’ na-egosi ụdị ọnwụ ahụ nke ọma.
- source_word: σὺν αὐτῷ
  choice: ya na ya
  rationale: Ọ na-egosi na a kpọgidere ha na Jizọs n'otu oge na ebe ahụ; ntụgharị a na-edobe echiche nke iso ya.
- source_word: δύο λῃσταί
  choice: ndị ohi abụọ
  rationale: λῃσταί na-akọwakarị ndị na-apụnara mmadụ ihe, ikekwe site n'iji ike; ‘ndị ohi’ bụ okwu Igbo ndị mmadụ na-aghọta ngwa ngwa, ebe nkọwa ọzọ dị n'ala peeji.
- source_word: εἷς ἐκ δεξιῶν
  choice: otu n'aka nri ya
  rationale: Nke a bụ okwu ọnọdụ ebe, ya bụ, otu onye nọ n'akụkụ aka nri Jizọs.
- source_word: καὶ εἷς ἐξ εὐωνύμων
  choice: nke ọzọ n'aka ekpe ya
  rationale: Ọ na-emegide akụkụ aka nri ma na-egosi onye nke abụọ nọ n'akụkụ aka ekpe Jizọs; ‘nke ọzọ’ bụ Igbo dị ire ma na-edobe mmadụ abụọ ahụ.
theological_decisions:
- issue: Ndị λῃσταί bụ ndị dị aṅaa?
  choice: A sụgharịrị ya ‘ndị ohi’ n'ebughị ụzọ kọwaa ha dị ka ndị nnupụisi ndọrọ ndọrọ ọchịchị.
  alternative: ndị na-apụnara mmadụ ihe; ndị nnupụisi
  rationale: Okwu Grik ahụ nwere ike ịpụta ndị ohi na-eme ihe ike ma ọ bụ ndị na-apụnara mmadụ ihe, mgbe ụfọdụkwa o nwere ike metụta ndị nnupụisi. Ma amaokwu a n'onwe ya ekwughị hoo haa na ha bụ ndị nnupụisi, ya mere ntụgharị ahụ ekwesịghị itinye nkọwa ahụ n'ime ederede.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro akụkọ Igbo n'ụzọ ebumpụta ụwa, ma na-edobe passive nke ihe e mere ndị ikom ahụ na enweghị nkọwa doro anya banyere ma ha bụ ndị ohi nkịtị ka hà bụ ndị nnupụisi.
