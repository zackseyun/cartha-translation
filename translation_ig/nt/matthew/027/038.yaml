    text: A pụkwara ịsị, “ndị na-apụnara mmadụ ihe.” Okwu Grik ahụ nwere ike ịpụta ndị ohi na-eme ihe ike, mgbe ụfọdụkwa ọ pụrụ ịgụnye ndị nnupụisi.
    reason: lexical_alternative
  revision_rationale: The revision replaces the ambiguous “n'obe ya na ya” with “n'obe, ha na ya,” which clearly expresses the Greek accompaniment phrase σὺν αὐτῷ while retaining the passive action and all positional details. The lexical footnote remains appropriate and no doctrinal or historical specificity has been added.
