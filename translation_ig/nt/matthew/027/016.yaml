  text: εἶχον δὲ τότε δέσμιον ἐπίσημον λεγόμενον ⸀Ἰησοῦν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/016.yaml
  text: At that time they had a notorious prisoner called Jesus Barabbas[a].
translation:
  language: ig
  text: N’oge ahụ, ha nwere otu onye mkpọrọ a ma aha ọjọọ, onye a na-akpọ Jizọs Barabas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ odide nwere naanị “Barabas”; ha hapụrụ “Jizọs.”
    reason: textual_variant
lexical_decisions:
- source_word: εἶχον
  choice: ha nwere
  rationale: Ngwaa a dị n’ụdị imperfect ma nwee onye na-eme ya n’ọtụtụ nke a kpọghị aha; “ha nwere” na-egosi na ndị ọchịchị na-ejide onye ahụ dịka onye mkpọrọ.
- source_word: δὲ
  choice: (egosighị ya iche)
  rationale: δὲ bụ njikọ akụkọ dị nro; n’Igbo, ịmalite ahịrịokwu ahụ na “N’oge ahụ” na-eme ka akụkọ gaa were were n’enweghị njikọ ọzọ ga-adị arọ.
- source_word: τότε
  choice: N’oge ahụ
  rationale: Nke a na-echekwa nghọta oge nke τότε n’Igbo dị mfe ma doo anya.
- source_word: δέσμιον
  choice: onye mkpọrọ
  rationale: Ọ bụ okwu Igbo nkịtị ma kwekọọ n’ọnọdụ onye e jidere ma debe n’ụlọ mkpọrọ.
- source_word: ἐπίσημον
  choice: a ma ama n’ihi ajọ omume ya
  rationale: ἐπίσημος nwere ike ịpụta onye pụtara ìhè ma ọ bụ onye a maara nke ọma; n’ọnọdụ onye mkpọrọ a, ọ na-egosi aha ọjọọ. Nsụgharị a na-eme ka nghọta ahụ doo anya n’Igbo, ma ọ naghị eme ka ọ bụrụ naanị “onye a ma ama” n’ụzọ nwere ike iyi otuto.
- source_word: λεγόμενον
  choice: onye a na-akpọ
  rationale: Nke a bụ ụzọ Igbo e si ewebata aha ma ọ bụ aha a na-akpọ mmadụ.
- source_word: Ἰησοῦν Βαραββᾶν
  choice: Jizọs Barabas
  rationale: SBLGNT nwere aha Ἰησοῦν tupu Βαραββᾶν; ya mere, e tinyere aha abụọ ahụ n’ahịrịokwu bụ isi, ebe e debere ụdị akwụkwọ ndị na-enweghị “Jizọs” n’okpuru peeji.
theological_decisions:
- issue: Ụdị aha Barabas dị n’ihe odide
  choice: 'E tinyere “Jizọs” n’ahịrịokwu bụ isi: “Jizọs Barabas.”'
  alternative: Ịgụ naanị “Barabas” n’enweghị “Jizọs.”
  rationale: Ihe odide SBLGNT e nyere na-agụ Ἰησοῦν Βαραββᾶν. Iji soro ihe odide Grik ahụ kpọmkwem, nsụgharị bụ isi tinyere “Jizọs”; e chekwara ụdị ọzọ dị mkpa n’okpuru peeji kama ihichapụ ọdịiche ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “A ma ama n’ihi ajọ omume ya” na-ebuga mmetụta ọjọọ nke ἐπίσημον n’ọnọdụ a; akara [a] dị n’ahịrịokwu bụ isi ma kwekọọ n’okpuru peeji.
