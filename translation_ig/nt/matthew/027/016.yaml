revisions:
- from: N’oge ahụ, ha nwere otu onye mkpọrọ a ma ama n’ihi ajọ omume ya, onye a na-akpọ Jizọs Barabas[a].
  to: N’oge ahụ, ha nwere otu onye mkpọrọ a ma aha ọjọọ, onye a na-akpọ Jizọs Barabas[a].
  rationale: The revision removes the unsupported explanation that Barabbas was notorious because of evil deeds, while retaining the negative force appropriate to ἐπίσημον in this context. It also improves the textual-variant footnote without altering its content.
  reviewer_model: gpt-5.6-terra
