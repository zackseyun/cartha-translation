id: MAT.27.18
reference: Matthew 27:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ᾔδει γὰρ ὅτι διὰ φθόνον παρέδωκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/018.yaml
  text: For he knew that they had handed him over because of envy[a].
translation:
  language: ig
  text: N’ihi na ọ maara na ọ bụ n’ihi anyaụfụ[a] ka ha ji nyefee ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ihi ekworo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: ọ maara
  rationale: Okwu οἶδα na-egosi ịma ma ọ bụ ịghọta ihe; “ọ maara” bụ nsụgharị Igbo doro anya ma bụrụkwa nke e ji ekwu okwu n'ụzọ ebumpụta ụwa.
- source_word: γὰρ
  choice: N’ihi na
  rationale: γάρ na-enye nkọwa maka ihe e kwuru tupu ya; “N’ihi na” na-egosipụta njikọ nkọwa ahụ nke ọma n’Igbo.
- source_word: ὅτι
  choice: na ọ bụ ... ka
  rationale: N'ebe a ὅτι na-ewebata ihe ọ maara. Usoro “na ọ bụ ... ka” na-egosipụta ọdịnaya ahụ ma na-eme ka ihe kpatara omume ahụ pụta ìhè n’Igbo.
- source_word: διὰ φθόνον
  choice: n’ihi anyaụfụ
  rationale: διά na accusative na-egosi ihe kpatara ya, ebe φθόνος bụ anyaụfụ ma ọ bụ iwe mmadụ nwere n’ihi ọnọdụ ọma onye ọzọ. “N’ihi anyaụfụ” dị nso n’asụsụ Grik ma doo anya.
- source_word: παρέδωκαν
  choice: ha ji nyefee
  rationale: παραδίδωμι n’ọnọdụ a pụtara inyefe mmadụ n’aka ndị ọchịchị. “Nyefee” na-egosi omume ahụ n’enweghị itinye echiche dị warara nke ‘ịrara mmadụ nye.’
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-arụtụ aka na Jizọs, ya mere “ya” bụ nsụgharị kwesịrị ekwesị.
theological_decisions:
- issue: Ihe kpaliri ndị boro Jizọs ebubo
  choice: Paịlet maara na anyaụfụ bụ ihe mere ha ji nyefee Jizọs.
  alternative: Paịlet maara na ekworo bụ ihe mere ha ji nyefee Jizọs.
  rationale: φθόνος na-egosi anyaụfụ ma ọ bụ obi ọjọọ mmadụ nwere n’ihi ọnọdụ onye ọzọ. “Anyaụfụ” na-echekwa ihe ederede kwuru n’etinyeghị nkọwa nkà mmụta okpukpe ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-echekwa ọrụ nkọwa nke γάρ na ihe kpatara omume ahụ nke διὰ φθόνον gosiri.
