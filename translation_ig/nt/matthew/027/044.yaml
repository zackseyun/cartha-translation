review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the plural subject, their crucifixion with Jesus, and the ongoing force of ὠνείδιζον. However, “N’otu aka ahụ” is a calque-like and less natural rendering for the adverbial idiom τὸ δὲ αὐτό in this context; “N’otu ụzọ ahụ” more directly means “in the same way.”
  naturalness: “N’otu ụzọ ahụ” is idiomatic Standard Igbo. The remaining wording is clear, modern, and appropriately restrained. “Nọ na-akparị” naturally conveys continuing action.
  terminology: “Ndị ohi” is an appropriate non-over-specified rendering of λῃσταί. “A kpọgidere ya na ha n’obe” preserves the passive relation of crucifixion with him. “Akparị” adequately conveys reviling/insulting without imposing interpretation.
  issues:
  - severity: low
    issue: “N’otu aka ahụ” is less idiomatic in this context.
    rationale: The Greek τὸ δὲ αὐτὸ is an adverbial idiom referring to the same manner of mockery. Standard Igbo “N’otu ụzọ ahụ” is more natural and precise here.
