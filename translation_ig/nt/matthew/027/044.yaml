id: MAT.27.44
reference: Matthew 27:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ δ’ αὐτὸ καὶ οἱ λῃσταὶ οἱ συσταυρωθέντες ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/044.yaml
  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: ig
  text: N’otu ụzọ ahụ[a], ọbụna ndị ohi ahụ a kpọgidere ya na ha n’obe nọ na-akparị ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-eme otu ihe ahụ”; akpaalaokwu Grik a pụtara na ha onwe ha sokwa na-emeso ya n’otu ụzọ ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-ekwujọ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: N’otu aka ahụ
  rationale: Akpaalaokwu Grik a na-arụ ọrụ dị ka nkọwa ụzọ e si mee ihe, na-ezo aka n’ụdị ịkwa emo a kọwara n’amaokwu ndị bu ya ụzọ. Nhọrọ a bụ Igbo doro anya ma dịkwa mfe nghọta.
- source_word: καὶ
  choice: ọbụna
  rationale: 'N’ebe a, καί na-agbakwụnye nkwusi ike: ọ bụghị naanị ndị ọzọ, kama ọbụna ndị ohi a kpọgidere n’obe sokwa kparịa ya.'
- source_word: λῃσταὶ
  choice: ndị ohi
  rationale: Okwu ahụ na-ezo aka n’ebe ndị na-apụnara mmadụ ihe nọ, n’ebughị ụzọ kpebie na ha bụ ndị nnupụisi ndọrọ ndọrọ ọchịchị.
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: ndị ahụ a kpọgidere ya na ha n’obe
  rationale: Nke a na-egosi na a kpọgidere ndị ohi ahụ n’obe ya na Jizọs, ma na-edobe nghọta nke passive participle ahụ n’Igbo e ji eme ihe ugbu a.
- source_word: ὠνείδιζον
  choice: nọ na-akparị
  rationale: Ụdị imperfect nke ngwaa Grik na-egosi omume gara n’ihu ruo oge ụfọdụ. “Nọ na-akparị” na-ebupụta echiche ahụ n’Igbo dị mfe ma dịkwa ndụ.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a bụ onye a na-eme ihe ahụ, ya bụ Jizọs.
theological_decisions:
- issue: Ma a ga-eme ka akụkọ Matiu kwekọọ n’akụkọ Luk banyere otu onye omekome kwuru ihe dị iche
  choice: E debere okwu Matiu n’ụdị ọtụtụ, ka ọ metụta ndị ohi a kpọgidere n’obe n’akụkụ Jizọs n’akụkụ akụkọ a.
  alternative: Ime ka ọtụtụ ahụ daa mbà ma ọ bụ kọwaa ya n’ụzọ ga-ewepụ esemokwu ọ bụla ya na akụkọ Luk.
  rationale: Grik ji οἱ λῃσταὶ, nke bụ ọtụtụ, ya na ngwaa ὠνείδιζον. Ya mere, nsụgharị ahụ ekwesịghị ịgbanwe ma ọ bụ mee ka esemokwu dị n’etiti nkọwa Oziọma ndị ahụ ghara ịpụta.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “A kpọgidere ya na ha n’obe” bụ ụzọ Igbo si egosi na a kpọgidere ndị ahụ na Jizọs n’obe, ebe “nọ na-akparị” na-echekwa omume na-aga n’ihu nke imperfect Grik.
