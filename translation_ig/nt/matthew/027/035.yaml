  yaml_path: translation/nt/matthew/027/035.yaml
  text: And after they crucified him[a], they divided his garments by casting lots.
translation:
  language: ig
  text: Mgbe ha kpọgidechara ya n’obe[a], ha kewara uwe ya site n’ịtụ nza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ nkịtị karịa: “Mgbe ha kpọgidechara ya n’obe, ha kewara uwe ya, na-atụ nza.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σταυρώσαντες
  choice: Mgbe ha kpọgidechara ya n’obe
  rationale: 'Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi: ha bu ụzọ kpọgide ya n’obe, mesịa ha ekee uwe ya. Nkebiokwu Igbo a na-egosi usoro oge ahụ n’asụsụ dị mfe ma doo anya.'
- source_word: δὲ
  choice: (a hapụrụ ya n’enweghị okwu pụrụ iche)
  rationale: δέ bụ njikọ dị nro na-akwalite akụkọ ahụ. N’Igbo, ịmalite ahịrịokwu a na “Mgbe” na-eme ka njikọ na usoro akụkọ pụta nke ọma; itinye “Ma” ma ọ bụ “Na” ga-adị arọ ma ọ bụ gbanwee ụda njikọ ahụ.
- source_word: διεμερίσαντο
  choice: ha fere
  rationale: Ngwaa a pụtara ikewa ihe n’etiti ọtụtụ ndị. “Ha fere” bụ okwu Igbo e ji ekwu ikesa ihe ka onye ọ bụla nweta òkè.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: uwe ya
  rationale: ἱμάτια na-ezo aka n’uwe n’ozuzu ya. “Uwe ya” bụ ntụgharị Igbo dị ugbu a, dị ugwu, ma ghara ime ka ọ bụrụ naanị uwe elu.
- source_word: βάλλοντες κλῆρον
  choice: site n’ife nza
  rationale: Nkebiokwu participle a na-egosi ụzọ ha si kee uwe ahụ. “Ife nza” bụ akpaalaokwu Igbo doro anya maka ime mkpebi site na lot, ebe “site na” na-eme ka mmekọrịta nke ụzọ e si mee ya pụta ìhè.
theological_decisions:
- issue: Mmekọrịta βάλλοντες κλῆρον na διεμερίσαντο
  choice: 'A tụgharịrị ife nza dị ka ụzọ ha si kee uwe ahụ: “ha fere uwe ya site n’ife nza.”'
  alternative: “ha fere uwe ya, na-efe nza.”
  rationale: Greek participle ahụ na-akọwa otú e si mee nkewa ahụ. “Site n’ife nza” na-eme ka mmekọrịta a doo anya n’Igbo n’etinyeghị nkọwa ozizi ọzọ.
- issue: Usoro oge nke σταυρώσαντες na ngwaa bụ isi
  choice: “Mgbe ha kpọgidechara ya n’obe”
  alternative: “Ka ha kpọgidechara ya n’obe” ma ọ bụ “Ha kpọgidere ya n’obe, mesịa...”
  rationale: Nhọrọ a na-edobe na ịkpọgide n’obe mere tupu ikewa uwe, ma na-ahapụ participle ahụ ka ọ bụrụ nkebiokwu oge dịka ọ dị na Greek.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. E ji “kpọgide ... n’obe” mee ihe maka σταυρόω, “uwe” maka ἱμάτια, na “ife nza” maka βάλλειν κλῆρον. A zere okwu ụka pụrụ iche na nkọwa karịrị ihe Greek kwuru.
