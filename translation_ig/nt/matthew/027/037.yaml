id: MAT.27.37
reference: Matthew 27:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπέθηκαν ἐπάνω τῆς κεφαλῆς αὐτοῦ τὴν αἰτίαν αὐτοῦ γεγραμμένην· Οὗτός ἐστιν Ἰησοῦς ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: ig
  text: 'Ha tinyere n’elu isi ya ebubo e boro ya, nke e dere ede[a], sị: “Onye a bụ Jizọs, Eze ndị Juu[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe e ji boo ya ebubo.” Okwu Grik αἰτία nwere nghọta metụtara ikpe n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “Eze ndị Judia.” Okwu Grik Ἰουδαίων nwere ike ịpụta “ndị Juu” ma ọ bụ “ndị Judia,” dabere n’ọnọdụ ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: Ha dokwasịrị
  rationale: 'Okwu a na-egosi omume e mere n’otu oge: ha tinyere ihe ahụ n’ebe e kwuru. “Dokwasịrị” bụ Igbo doro anya ma kwekọọ n’omume nke idowe ihe ahụ n’elu obe.'
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: n’elu isi ya
  rationale: Nke a na-edobe echiche ọnọdụ dị n’elu isi ya, ọ bụghị na ihe ahụ dị kpọmkwem n’isi ya.
- source_word: τὴν αἰτίαν αὐτοῦ
  choice: ihe e dere banyere ebubo e boro ya
  rationale: αἰτία nwere nghọta ikpe n’ebe a. Nsụgharị a na-eme ka o doo anya na ihe e dere bụ ebubo iwu e ji megide ya, ma ghara itinye nkọwa okpukpe ọzọ.
- source_word: γεγραμμένην
  choice: ihe e dere
  rationale: Nke a na-egosipụta participle perfect passive n’ụzọ Igbo dị mfe ma bụrụkwa nke okike.
- source_word: Οὗτός ἐστιν
  choice: Onye a bụ
  rationale: Maka onye mmadụ, “Onye a bụ” bụ ụzọ Igbo kacha dị mma isi kwuo demonstrative na copula a.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: A na-eji ụdị aha a a maara nke ọma n’Igbo dee aha Grik Ἰησοῦς.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Eze ndị Juu
  rationale: Nke a na-echekwa aha ọchịchị nke e dere n’elu obe, n’Igbo dị nkenke ma bụrụ nke a na-aghọta ngwa ngwa.
- source_word: Ἰουδαίων
  choice: ndị Juu
  rationale: N’usoro ebubo e dere banyere eze n’akụkọ ahụhụ Jizọs, “ndị Juu” bụ ntụaka a kacha mara ma dabara n’ebe a; a na-edebe “ndị Judia” dịka ihe ọzọ ọ pụrụ ịpụta na nkọwa ala peeji.
theological_decisions:
- issue: Okwu iwu dị n’ihe e dere n’elu obe
  choice: ebubo e boro ya
  alternative: ihe e ji boo ya ebubo
  rationale: Nhọrọ a na-echekwa ike ikpe nke αἰτία ma na-agwa onye na-agụ ya na ihe ahụ bụ ebubo e ji megide Jizọs, n’enweghị ịgbakwunye nkọwa okpukpe.
- issue: Nkọwa Ἰουδαίων n’aha eze ahụ
  choice: ndị Juu
  alternative: ndị Judia
  rationale: “Ndị Juu” na-echekwa aha ndọrọ ndọrọ ọchịchị na nke agbụrụ a maara n’akụkọ ahụ; ma okwu Grik ahụ nwekwara ike ịpụta ndị Judia, ya mere e debere nke ahụ n’ala peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro akụkọ ahụ na ọdịdị ihe e dere n’elu obe; akara nkọwa [a] na [b] pụtara n’ederede isi.
