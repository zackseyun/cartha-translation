review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the action, the position above Jesus’ head, the judicial sense of αἰτία, and the wording of the inscription. However, “ihe e dere banyere ebubo e boro ya” means ‘what was written about the charge against him,’ making the written object commentary about a charge rather than the charge itself, which is what the Greek states.
  naturalness: Most of the verse is clear Standard Igbo. Recasting the noun phrase as “ebubo e boro ya, nke e dere ede” is more direct and natural while retaining the Greek participle’s sense.
  terminology: “Jizọs,” “Eze,” and “ndị Juu” are appropriate. The judicial term “ebubo e boro ya” is suitable. The footnotes preserve the possible Judean/Jew distinction without forcing a disputed nuance.
  issues:
  - severity: medium
    issue: The main clause says “ihe e dere banyere ebubo e boro ya.”
    rationale: 'This changes the relationship between γράφω and αἰτία: the Greek identifies the charge itself as written, whereas the draft can imply a separate written statement about the charge.'
  revised_text: 'Ha tinyere n’elu isi ya ebubo e boro ya, nke e dere ede[a], sị: “Onye a bụ Jizọs, Eze ndị Juu[b].”'
