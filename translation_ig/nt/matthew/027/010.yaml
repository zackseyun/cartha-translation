  yaml_path: translation/nt/matthew/027/010.yaml
  text: and they gave them for the potter's field[b][a], just as the Lord directed me.
translation:
  language: ig
  text: Ha wee nye ha maka ubi ọkpụite,[a] dịka Onyenwe anyị nyere m iwu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nke bụ, ubi nke onye na-akpụ ite.
    reason: lexical_clarification
  - marker: b
    text: A pụkwara ịsụgharị ya “dịka Onyenwe anyị duziri m” ma ọ bụ “nyere m ntụziaka.” Matiu debere onye mbụ “m” n’okwu amụma a.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἔδωκαν
  choice: ha wee nye
  rationale: Na-echekwa ihe aorist active nke δίδωμι dị ka “nyere,” n’etinyeghị nkọwa “kwụrụ ụgwọ” nke karịrị okwu Grik ahụ.
- source_word: αὐτὰ
  choice: ha
  rationale: Nnochiaha a na-ezo aka n’ọlaọcha ndị e kwuru banyere ha n’okwu gbara amaokwu a gburugburu; n’Igbo, “ha” na-echekwa ntụaka ọtụtụ ahụ.
- source_word: εἰς τὸν ἀγρὸν
  choice: maka ubi
  rationale: N’ọnọdụ ịzụta ma ọ bụ iji ego mee ihe, εἰς na-egosi ihe e nyere ego ahụ maka ya; “maka ubi” na-enye nghọta ahụ n’Igbo nkịtị.
- source_word: τοῦ κεραμέως
  choice: ọkpụite
  rationale: Genitive a na-akọwa ubi ahụ dịka nke onye na-akpụ ite; “ubi ọkpụite” bụ usoro Igbo dị mkpirikpi ma doo anya.
- source_word: καθὰ
  choice: dịka
  rationale: Na-egosipụta nkwekọrịta kpọmkwem n’etiti ihe e mere na ntụziaka sochiri ya.
- source_word: συνέταξέν
  choice: nyere … iwu
  rationale: συντάσσω nwere ike ịpụta inye iwu, iduzi, ma ọ bụ ịkụziri ihe a ga-eme. “Nyere m iwu” bụ Igbo ebumpụta ụwa nke na-echekwa ikike dị n’okwu ahụ.
- source_word: μοι
  choice: m
  rationale: Na-echekwa onye mbụ “m” dị na ederede Grik, kama ime ka ya kwekọọ n’akụkọ gbara ya gburugburu.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ ntụgharị Igbo a na-ejikarị eme ihe maka κύριος dịka aha nsọpụrụ “Onyenwe anyị.”
theological_decisions:
- issue: Onye na-ekwu okwu n’ime nkwupụta amụma a
  choice: E debere onye mbụ “m” dịka Grik si kwuo.
  alternative: Ịgbanwe ya ka ọ bụrụ onye nke atọ ma ọ bụ kọwaa ya ka o kwekọọ n’akụkọ gbara amaokwu a gburugburu.
  rationale: μoι pụtara “m/maka m.” Idebe ya na-echekwa okwu Matiu na mgbagwoju anya dị n’otú o si jiri nkwupụta amụma ahụ, kama idozi ya n’ime ntụgharị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. “Ọkpụite” bụ aha ọrụ ebumpụta ụwa; e tinyere nkọwa n’ala peeji iji mee ka njikọ genitive doo anya. E debere “m” n’enweghị ime ka ọ kwekọọ n’akụkọ.
