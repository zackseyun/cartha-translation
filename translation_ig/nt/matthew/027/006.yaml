id: MAT.27.6
reference: Matthew 27:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: ig
  text: Ma ndị isi nchụàjà, mgbe ha natasịrị mkpụrụ ego ọlaọcha ahụ, sịrị, “Iwu anaghị ekwe ka e tinye ha n’ụlọ akụ ụlọnsọ ukwu[a], n’ihi na ha bụ ọnụ ahịa ọbara[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, Kọban; ọ na-ezo aka n’ụlọ akụ ụlọnsọ ukwu ma ọ bụ n’ego dị nsọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ego ọbara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Ọ bụ okwu Igbo doro anya maka ndị nọ n’ọkwa ọchịchị kachasị elu n’etiti ndị nchụàjà, ma kwekọọ na ojiji ya n’Oziọma.
- source_word: λαβόντες
  choice: chịkọtara ... wee
  rationale: N’ọnọdụ a, ọ pụtara na ha bulitere ma chịkọta mkpụrụ ego ahụ; usoro ‘wee’ na-egosi omume sochiri ya n’Igbo eke.
- source_word: τὰ ἀργύρια
  choice: mkpụrụ ego ọlaọcha ahụ
  rationale: Ọ na-ezo aka n’ego ọlaọcha a kpọtụrụla aha n’akụkọ ahụ, n’enweghị ikwu ụdị mkpụrụ ego a na-akpọghị aha na Grik.
- source_word: Οὐκ ἔξεστιν
  choice: Iwu akwadoghị
  rationale: Nke a na-egosi na ihe ahụ ekwesịghị ekwesị n’okpuru iwu na usoro okpukpe, ọ bụghị nanị na mmadụ enyeghị ikike.
- source_word: βαλεῖν
  choice: ka e tinye
  rationale: ‘Tinye’ bụ okwu Igbo kachasị eke n’ihe gbasara itinye ego n’ụlọ akụ, kama ịsụgharị ya n’ụzọ nkịtị dịka ‘tụba.’
- source_word: κορβανᾶν
  choice: ụlọ akụ nke ụlọnsọ ukwu
  rationale: Ọ na-akọwa ebe a na-edebe ego dị nsọ nke ụlọnsọ ukwu, ma na-eme ka onye na-agụ Igbo ghọta ya ozugbo.
- source_word: ἐπεὶ
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara ha ji kwuo na iwu akwadoghị ya.
- source_word: τιμὴ αἵματός
  choice: ụgwọ ọbara
  rationale: Nkebiokwu a dị nkenke ma dị ike n’Igbo, na-echekwa njikọ kpọmkwem dị n’etiti ego ahụ na ọbara, n’enweghị ịkọwa karịa ihe Grik kwuru.
theological_decisions:
- issue: Otu e si asụgharị κορβανᾶν n’enweghị ime ka okwu ahụ bụrụ ihe omimi nye onye na-agụ ya
  choice: ụlọ akụ nke ụlọnsọ ukwu
  alternative: Kọban; ụlọ akụ
  rationale: Nsụgharị a na-egosi na okwu ahụ metụtara ego dị nsọ nke ụlọnsọ ukwu na nchegbu ndị nchụàjà banyere iwu; ihe odide ala peeji na-echekwa aha Grik ahụ.
- issue: Otu e si echekwa ihe τιμὴ αἵματός pụtara
  choice: ụgwọ ọbara
  alternative: ọnụ ahịa ọbara; ego e ji kwụọ ụgwọ maka mwụfu ọbara
  rationale: ‘Ụgwọ ọbara’ na-echekwa mkpụmkpụ na ike nke okwu Grik, ma ghara idozi n’ụzọ gabigara ókè ma ọ bụ kọwaa kpọmkwem ụdị ikpe ọmụma ndị nchụàjà bu n’uche.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Ụlọnsọ ukwu’ na-eme ka ọnọdụ ụlọ nsọ ahụ doo anya; ‘Iwu akwadoghị’ na-egosipụta echiche iwu na usoro okpukpe nke Οὐκ ἔξεστιν. Akara ntụaka [a] na [b] abụọ pụtara n’ederede isi.
