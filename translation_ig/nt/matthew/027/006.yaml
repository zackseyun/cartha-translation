revisions:
- from: Ma ndị isi nchụàjà chịkọtara mkpụrụ ego ọlaọcha ahụ wee sị, “Iwu akwadoghị ka e tinye ha n’ụlọ akụ nke ụlọnsọ ukwu[a], n’ihi na ha bụ ụgwọ ọbara[b].”
  to: Ma ndị isi nchụàjà, mgbe ha natasịrị mkpụrụ ego ọlaọcha ahụ, sịrị, “Iwu anaghị ekwe ka e tinye ha n’ụlọ akụ ụlọnsọ ukwu[a], n’ihi na ha bụ ọnụ ahịa ọbara[b].”
  rationale: 'The revision removes the unsupported sense of collecting from the participle and uses a closer, natural Igbo rendering of “price of blood.” Footnote markers remain correctly anchored: [a] follows the rendering of κορβανᾶν, and [b] follows the rendering of τιμὴ αἵματός.'
