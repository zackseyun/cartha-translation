  text: καὶ ἀποκριθεὶς πᾶς ὁ λαὸς εἶπεν· Τὸ αἷμα αὐτοῦ ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: ig
  text: Ndị mmadụ niile zara[a] sị, “Ka ọbara ya dịrị n’ahụ anyị na n’ahụ ụmụ anyị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ndị gbakọtara n’ebe ahụ n’akụkọ a; ekwesịghị ịghọta okwu a dịka o kwuru na ndị Juu niile n’ọgbọ niile ga-anọgide na-ebu ikpe ọmụma maka ọnwụ ya.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: zara sị
  rationale: N'okwu Grik, participle ἀποκριθείς na εἶπεν jikọrọ aka iwebata nzaghachi. “Zara sị” bụ ụzọ Igbo si ekwu ya n'ụzọ eke, n'enweghị ịsụgharị ya n'ụzọ osisi dị ka “mgbe ha zara, ha kwuru.”
- source_word: πᾶς ὁ λαὸς
  choice: Ndị niile nọ n’ebe ahụ
  rationale: Nkebiokwu ahụ na-ezo aka n'ìgwè ndị gbakọtara n'ihe a na-akọ. Nhọrọ a na-egosipụta mkpokọta ahụ n'Igbo doro anya ma na-ezere ka a ghọta ya dịka ndị Juu niile n'oge niile.
- source_word: Τὸ αἷμα αὐτοῦ
  choice: ọbara ya
  rationale: “Ọbara ya” na-edobe ihe oyiyi na mkpụmkpụ nke Grik. N'ọnọdụ ikpe a, ọ na-egosi ibu ọrụ maka ọnwụ ya, ma a naghị akọwawanye nke ahụ n'ime amaokwu ahụ.
- source_word: ἐφ’ ἡμᾶς
  choice: Ka ... dịrị anyị
  rationale: Grik enweghị ngwaa n'ebe a, ma Igbo chọrọ usoro ga-egosi ọchịchọ ma ọ bụ nnabata ibu ọrụ. “Ka ... dịrị anyị” na-edobe ike nke okwu ahụ n'enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: na ụmụ anyị
  rationale: τέκνα pụtara n'ụzọ bụ isi “ụmụ.” E jighị “ụmụ ụmụ anyị” ma ọ bụ “ụmụazụ anyị,” n'ihi na nke ahụ ga-agbasawanye ihe okwu Grik kwuru.
theological_decisions:
- issue: Enwere ike ịghọtahie πᾶς ὁ λαὸς dịka ikpe ọmụma e nyere ndị Juu niile ruo mgbe ebighị ebi.
  choice: A sụgharịrị ya dịka ndị niile gbakọtara n'ebe ahụ n'ime akụkọ a.
  alternative: Ndị mmadụ niile; ìgwè mmadụ ahụ niile
  rationale: Amaokwu ahụ na-akọ okwu nke ndị nọ n'ebe ikpe ahụ, ọ naghị ekwu na ndị Juu niile n'ọgbọ niile nwere ikpe ọmụma ahụ. Ihe odide bụ isi ka na-edobe mkpokọta okwu Grik, ebe nkọwa ala peeji na-egbochi ịgbatị ya n'ụzọ na-ekwesịghị ekwesị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ka ọbara ya dịrị anyị” na-edobe ụda siri ike na esemokwu nkà mmụta okpukpe nke okwu mbụ, ebe nkọwa [a] na-akọwa naanị oke ndị okwu ahụ na-ezo aka na ha.
