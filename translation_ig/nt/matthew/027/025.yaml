revisions:
- from: Ndị niile nọ n’ebe ahụ zara[a] sị, “Ka ọbara ya dịrị anyị na ụmụ anyị.”
  to: Ndị mmadụ niile zara[a] sị, “Ka ọbara ya dịrị n’ahụ anyị na n’ahụ ụmụ anyị.”
  rationale: The revision preserves the Greek’s collective ‘all the people’ rather than inserting a narrowing locative phrase into the main text. It also represents both occurrences of ἐπί with “n’ahụ,” maintaining the source’s parallel ‘on us and on our children’ wording. The footnote retains the necessary historical-contextual clarification while avoiding any alteration of the verse’s wording or a doctrinal conclusion.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T06:36:05Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the responsive speech and the imprecatory force of the verbless Greek clause. However, “Ndị niile nọ n’ebe ahụ” narrows πᾶς ὁ λαός (“all the people”) to a locative description not stated in the wording, and “dịrị anyị” does not as clearly retain the repeated ‘on/upon’ relation of ἐφ’ ἡμᾶς ... ἐπὶ τὰ τέκνα ἡμῶν.
  naturalness: “Ndị mmadụ niile zara sị” is clear, idiomatic Standard Igbo. “Ka ọbara ya dịrị n’ahụ anyị na n’ahụ ụmụ anyị” is a natural solemn rendering that preserves the judicial/imprecatory imagery and the parallel repetition.
  terminology: “Ọbara ya” and “ụmụ anyị” accurately render αἷμα αὐτοῦ and τέκνα ἡμῶν. The contextual footnote should clarify the narrative referent without replacing the verse’s collective wording or suggesting a transgenerational ethnic accusation.
  issues:
  - severity: medium
    issue: The rendering of πᾶς ὁ λαός is overly narrowed.
    rationale: “Ndị niile nọ n’ebe ahụ” adds the explicit locative qualification “there” and recasts “all the people” as merely those present. The immediate scene supplies that context, but the translation should retain the source’s collective expression; the footnote can provide the needed contextual guardrail.
  - severity: medium
    issue: The two prepositional phrases meaning ‘on us’ and ‘on our children’ are not fully represented.
    rationale: “Ka ọbara ya dịrị anyị na ụmụ anyị” can sound like possession or benefit/detriment to us rather than blood being ‘upon’ us. Adding “n’ahụ” retains the source imagery and repeated parallelism.
  - severity: low
    issue: The current footnote uses “ịkatọ” (‘to accuse/condemn’), which is less precise than the source-context concern.
    rationale: The concern is an unwarranted assignment of enduring guilt to all Jews in every generation, not simply criticism or condemnation. A more exact wording is preferable.
  revised_text: Ndị mmadụ niile zara[a] sị, “Ka ọbara ya dịrị n’ahụ anyị na n’ahụ ụmụ anyị.”
  revised_footnotes:
  - marker: a
    text: Ya bụ, ndị gbakọtara n’ebe ahụ n’akụkọ a; ekwesịghị ịghọta okwu a dịka o kwuru na ndị Juu niile n’ọgbọ niile ga-anọgide na-ebu ikpe ọmụma maka ọnwụ ya.
    reason: cultural_note
  revision_rationale: The revision preserves the Greek’s collective ‘all the people’ rather than inserting a narrowing locative phrase into the main text. It also represents both occurrences of ἐπί with “n’ahụ,” maintaining the source’s parallel ‘on us and on our children’ wording. The footnote retains the necessary historical-contextual clarification while avoiding any alteration of the verse’s wording or a doctrinal conclusion.
