  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ⸂ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο⸃, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: ig
  text: Ma lee, ákwà mgbochi nke ụlọ nsọ[a] dọwara abụọ site n’elu ruo n’okpuru; ala ahụ maa jijiji, nkume ndị ahụ gbawara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ákwà mgbochi nke ebe nsọ.” Okwu Grik ahụ pụrụ izo aka n’ákwà mgbochi dị n’ime ebe nsọ nke ụlọ nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: Nke a na-echekwa ọrụ okwu ahụ dị ka ihe na-adọta uche na mberede ma na-enye akụkọ ahụ ịdị arọ.
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: ákwà mgbochi nke ụlọnsọ ukwu
  rationale: “Ákwà mgbochi” bụ Igbo doro anya maka nnukwu ákwà e ji kewaa ebe dị nsọ; “ụlọnsọ ukwu” na-enye okwu ναός n’ụzọ ndị mmadụ na-aghọta, ebe nkọwa ala peeji na-egosi na ọ pụrụ ịpụta ebe nsọ dị n’ime ya kpọmkwem.
- source_word: ἐσχίσθη ... εἰς δύο
  choice: dọwara abụọ
  rationale: Okwu a dabara n’ákwà, na-echekwa ihe mere na-enweghị ikwu onye mere ya, ma na-egosikwa na ọ kewara ụzọ abụọ.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: site n’elu ruo n’ala
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọ ntụziaka ndọwa ahụ, ma na-echekwa isi n’elu bido ruo n’okpuru.
- source_word: ἡ γῆ ἐσείσθη
  choice: Ala maa jijiji
  rationale: “Ala maa jijiji” bụ okwu Igbo e ji akọ ala ọma jijiji n’ụzọ dị ndụ ma dị mfe; ọ naghị amachi ya naanị n’otu obere ebe.
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: nkume niile gbawakwara
  rationale: “Gbawaa” dabara n’ihe na-eme nkume mgbe ala ọma jijiji mere ma na-egosipụta nkewa ha; “niile” na-arụ ọrụ dị ka akara ọtụtụ n’Igbo, ọ bụghị nkwupụta na nkume ọ bụla n’ụwa gbawara.
theological_decisions:
- issue: Ihe mgbawa ákwà ụlọnsọ ukwu ahụ pụtara
  choice: A kọwara ihe ahụ dịka akụkọ mere eme, na-enweghị itinye nkọwa ihe ọ na-anọchi anya n’ahịrịokwu ahụ.
  alternative: Ịkọwa ya dịka imeghe ụzọ ịbịakwute Chineke ma ọ bụ dịka ikpe e kpere usoro ụlọnsọ ukwu.
  rationale: Amaokwu ahụ na-akọ naanị ihe mere na ihe ịrịba ama so ya; ọ naghị akọwa ihe ha pụtara n’ụzọ nkà mmụta okpukpe. Ya mere, nsụgharị ahụ na-ahapụ esemokwu na omimi ahụ ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ahịrịokwu dị mkpirikpi iji mee ka ihe ịrịba ama atọ ahụ pụta ìhè, ma zere nkọwa ụka ma ọ bụ nke otu okwukwe kpọmkwem.
