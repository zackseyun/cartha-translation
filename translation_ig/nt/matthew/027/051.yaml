revisions:
- from: Ma lee, ákwà mgbochi nke ụlọnsọ ukwu[a] dọwara abụọ site n’elu ruo n’ala. Ala maa jijiji, nkume niile gbawakwara.
  to: Ma lee, ákwà mgbochi nke ụlọ nsọ[a] dọwara abụọ site n’elu ruo n’okpuru; ala ahụ maa jijiji, nkume ndị ahụ gbawara.
  rationale: The revision corrects the top-to-bottom directional expression and removes the unsupported “all” from the reference to the rocks. It also streamlines the temple term to standard, direct Igbo. The Greek’s passive, event-reporting style and its lack of an explicit theological interpretation are preserved.
  reviewer_model: gpt-5.6-terra
