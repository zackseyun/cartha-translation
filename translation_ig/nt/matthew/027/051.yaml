    text: Ma ọ bụ, “ákwà mgbochi nke ebe nsọ.” Okwu Grik ahụ pụrụ izo aka n’ákwà mgbochi dị n’ime ebe nsọ nke ụlọ nsọ.
    reason: lexical_alternative
  revision_rationale: The revision corrects the top-to-bottom directional expression and removes the unsupported “all” from the reference to the rocks. It also streamlines the temple term to standard, direct Igbo. The Greek’s passive, event-reporting style and its lack of an explicit theological interpretation are preserved.
