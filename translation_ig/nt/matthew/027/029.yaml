id: MAT.27.29
reference: Matthew 27:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ καὶ κάλαμον ⸂ἐν τῇ δεξιᾷ⸃ αὐτοῦ, καὶ γονυπετήσαντες ἔμπροσθεν αὐτοῦ ⸀ἐνέπαιξαν αὐτῷ λέγοντες· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/029.yaml
  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: ig
  text: Mgbe ha kpara okpueze e ji ogwu kpaa, ha kụkwasịrị ya n’isi ya, tinyekwa okporo amị n’aka nri ya. Ha wee gbuo ikpere n’ala n’ihu ya, na-akwa ya emo, na-asị, “Ekele dịrị gị, Eze ndị Juu![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Eze ndị Judia.” Okwu Grik bụ Ἰουδαίων nwere ike ịpụta ndị Judia ma ọ bụ ndị Juu; n’ebe a, ọ dị n’aha eze ha ji kwaa Jizọs emo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλέξαντες
  choice: Mgbe ha kpara
  rationale: Na-egosi na ha buru ụzọ kpaa okpueze ahụ tupu ha ekwasị ya n’isi ya, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: okpueze n’osisi ogwu
  rationale: “Okpueze” na-egosipụta ịkwa ọchịchị eze emo n’ọnọdụ a; “n’osisi ogwu” na-eme ka o doo anya ihe e ji kpaa ya.
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: ha kụkwasịrị ya n’isi ya
  rationale: Nsụgharị doro anya nke itinye ihe n’elu isi mmadụ.
- source_word: κάλαμον
  choice: okporo amị
  rationale: Na-echekwa ihe ahụ dị ka amị n’ezie, n’agbanyeghị na e ji ya mee ihe yiri mkpara eze n’ịkwa emo.
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: n’aka nri ya
  rationale: Na-egosipụta ebe ha tinyere amị ahụ n’ụzọ Igbo na-anụ nke ọma.
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: Ha wee gbuo ikpere n’ala n’ihu ya
  rationale: Na-egosipụta omume ha mere dịka à ga-asị na ha na-asọpụrụ eze, ebe n’ezie ha na-akwa ya emo.
- source_word: ἐνέπαιξαν αὐτῷ
  choice: na-akwa ya emo
  rationale: Na-enye kpọmkwem echiche nke mkparị na ịkwa emo dị n’okwu Grik.
- source_word: Χαῖρε
  choice: Ekele dịrị gị
  rationale: Ụdị ekele dị ùgwù nke dabara n’okwu a ha ji mee ka hà na-ekele eze, ma na-ahapụ ọnọdụ ahụ ka o gosipụta ịkwa emo.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: Eze ndị Juu
  rationale: Na-echekwa aha eze e ji boo Jizọs ebubo ma jiri kwaa ya emo; “ndị Juu” bụ nghọta sara mbara ma bụrụkwa nke a na-aghọta nke ọma n’ọnọdụ a.
theological_decisions:
- issue: Ichekwa asịrị na ịkwa emo dị n’ekele ọchịchị eze ahụ
  choice: “Ekele dịrị gị, Eze ndị Juu!”
  alternative: “Ndeewo, Eze ndị Juu!”
  rationale: “Ekele dịrị gị” nwere ụda nkwanye ùgwù kwesịrị ekwesị maka ekele eze ahụ, ebe akụkọ gbara ya gburugburu na-eme ka o doo anya na ọ bụ ịkwa emo.
- issue: Nsụgharị Ἰουδαίων n’aha eze ahụ
  choice: “ndị Juu”
  alternative: “ndị Judia”
  rationale: Okwu Grik ahụ nwere ike ịpụta ndị Juu ma ọ bụ ndị Judia. N’aha e ji boo Jizọs ebubo banyere ịbụ eze, “ndị Juu” na-enye nghọta sara mbara dabara n’akụkọ ahụ, ebe e debere nke ọzọ n’ala ala peeji.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro omume dị na Grik na ihe oyiyi nke ịkwa ọchịchị eze emo. E debere akara ala ala peeji [a] ozugbo n’aha “ndị Juu,” ebe nkọwa ya metụtara.
