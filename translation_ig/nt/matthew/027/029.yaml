- from: Mgbe ha kpara okpueze n’osisi ogwu, ha kụkwasịrị ya n’isi ya, tinyekwa okporo amị n’aka nri ya. Ha wee gbuo ikpere n’ala n’ihu ya, na-akwa ya emo, na-asị, “Ekele dịrị gị, Eze ndị Juu![a]”
  to: Mgbe ha kpara okpueze e ji ogwu kpaa, ha kụkwasịrị ya n’isi ya, tinyekwa okporo amị n’aka nri ya. Ha wee gbuo ikpere n’ala n’ihu ya, na-akwa ya emo, na-asị, “Ekele dịrị gị, Eze ndị Juu![a]”
