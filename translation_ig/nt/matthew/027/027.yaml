review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the sequence, the governor’s soldiers, Jesus’ being taken into the praetorium, and the gathering of the whole σπεῖρα around him. However, “ndị agha niile nke òtù agha ahụ” can be heard as every individual soldier belonging to the unit, whereas ὅλην τὴν σπεῖραν directly designates the unit as a whole. Rendering it as “òtù ndị agha ahụ niile” more closely preserves the source expression and its conventional military-unit sense.
  naturalness: The revised wording is natural Standard Igbo and avoids the somewhat heavy purpose construction “ka ha gbaa ya gburugburu” after “kpọkọtakwa.” “Gburugburu ya” directly and idiomatically expresses the convergence around Jesus.
  terminology: “Gọvanọ,” “praitọrịọm,” and “òtù ndị agha” are suitable modern Igbo choices. The cultural footnote is revised because its opening previously suggested that “òtù agha” translated a term meaning Roman soldiers, rather than a Roman military-unit term.
  issues:
  - severity: medium
    issue: The main text renders “the whole cohort” as “ndị agha niile nke òtù agha ahụ.”
    rationale: This may over-specify the expression as every soldier individually rather than the entire military unit, and it is less direct than a unit-focused rendering of ὅλην τὴν σπεῖραν.
  - severity: medium
    issue: Footnote b inaccurately describes the lexical referent.
    rationale: “Okwu ndị agha Rom” can mean ‘the Roman soldiers’ word.’ The note should identify σπεῖρα as a Roman term for a military unit.
  - severity: low
    issue: Footnote a uses “ebe obibi gọọmenti,” which is imprecise for the governor’s official residence/headquarters.
    rationale: “Ebe obibi ma ọ bụ isi ụlọ ọrụ agha nke gọvanọ Rom” states the historical function more accurately without forcing a single identification.
  revised_text: Mgbe ahụ, ndị agha nke gọvanọ kpọọrọ Jizọs banye na praitọrịọm[a], kpọkọtakwa òtù ndị agha ahụ niile gburugburu ya[b].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “isi ụlọ ọrụ gọvanọ.” Okwu Grik a na-ezo aka n'ebe obibi ma ọ bụ isi ụlọ ọrụ agha nke gọvanọ Rom.
    reason: lexical_alternative
  - marker: b
    text: “Òtù ndị agha” na-asụgharị okwu Rom maka otu ndị agha. Ọ nwere ike ịpụta otu ndị agha dị ka otu ọrụ, n'ebughị n'uche na onye agha ọ bụla nke otu ahụ nọ ebe ahụ n'ezie.
    reason: cultural_note
  revision_rationale: The revision keeps the source’s meaning while making the military-unit reference more exact and idiomatic in Standard Igbo. It also clarifies both footnotes without adding historical or theological claims.
