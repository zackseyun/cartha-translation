revisions:
- from: Mgbe ahụ, ndị agha gọvanọ kpọọrọ Jizọs banye na praitọrịọm[a], kpọkọtakwa ndị agha niile nke òtù agha ahụ ka ha gbaa ya gburugburu[b].
  to: Mgbe ahụ, ndị agha nke gọvanọ kpọọrọ Jizọs banye na praitọrịọm[a], kpọkọtakwa òtù ndị agha ahụ niile gburugburu ya[b].
  rationale: The revision keeps the source’s meaning while making the military-unit reference more exact and idiomatic in Standard Igbo. It also clarifies both footnotes without adding historical or theological claims.
  reviewer_model: gpt-5.6-terra
