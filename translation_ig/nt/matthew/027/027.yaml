  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: ig
  text: Mgbe ahụ, ndị agha nke gọvanọ kpọọrọ Jizọs banye na praitọrịọm[a], kpọkọtakwa òtù ndị agha ahụ niile gburugburu ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “isi ụlọ ọrụ gọvanọ.” Okwu Grik a na-ezo aka n'ebe obibi ma ọ bụ isi ụlọ ọrụ agha nke gọvanọ Rom.
    reason: lexical_alternative
  - marker: b
    text: “Òtù ndị agha” na-asụgharị okwu Rom maka otu ndị agha. Ọ nwere ike ịpụta otu ndị agha dị ka otu ọrụ, n'ebughị n'uche na onye agha ọ bụla nke otu ahụ nọ ebe ahụ n'ezie.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe sochiri ozugbo n'usoro akụkọ, ma bụrụkwa okwu Igbo doro anya ma dị n'okike.
- source_word: στρατιῶται τοῦ ἡγεμόνος
  choice: ndị agha gọvanọ
  rationale: Nke a na-egosi mmekọrịta ndị agha ahụ na onye ọchịchị Rom n'Igbo dị mfe ma na-enweghị ịgbakwunye nkọwa na-adịghị na isi mmalite.
- source_word: ἡγεμόνος
  choice: gọvanọ
  rationale: N'ọnọdụ akụkọ a, okwu ahụ na-ezo aka n'onye ọchịchị ógbè nke Rom; “gọvanọ” bụ okwu ndị Igbo nke oge a na-aghọta nke ọma.
- source_word: παραλαβόντες
  choice: kpọọrọ
  rationale: Ọ na-egosi na ndị agha ahụ weere Jizọs soro ha, n'okpuru ikike ha, gaa n'ime ebe ahụ; ọ bụkwa usoro okwu Igbo sitere n'okike.
- source_word: εἰς τὸ πραιτώριον
  choice: banye na praitọrịọm
  rationale: E debere aha pụrụ iche nke ebe ọchịchị Rom ahụ site n'ịsụgharị ụda ya, ebe nkọwa ya dị n'okpuru peeji.
- source_word: συνήγαγον
  choice: kpọkọtakwa
  rationale: Ọ na-egosi ịkpọkọta mmadụ n'otu ebe; njikọ “-kwa” na-eme ka usoro omume abụọ ahụ na-aga nke ọma n'Igbo.
- source_word: ἐπ’ αὐτὸν
  choice: ka ha gbaa ya gburugburu
  rationale: N'ọnọdụ a, ọ na-egosi na ndị agha ahụ zukọtara bịaruo Jizọs nso wee gbaa ya gburugburu, ma ọ bụghị naanị na ha bịakwutere ya.
- source_word: ὅλην τὴν σπεῖραν
  choice: ndị agha niile nke òtù agha ahụ
  rationale: Nke a na-echekwa ma echiche “niile” nke ὅλην ma ọdịdị σπεῖρα dị ka òtù agha Rom, n'asụsụ onye Igbo nkịtị ga-aghọta.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere “praitọrịọm” dị ka aha akụkọ ihe mere eme ma kọwaa ya n'okpuru peeji; a kọwakwara okwu agha Rom n'ụzọ na-adịghị ekwu na ndị agha niile n'otu n'otu nọ ebe ahụ.
