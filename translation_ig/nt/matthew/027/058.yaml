  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ. τότε ὁ Πιλᾶτος ἐκέλευσεν ⸀ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/058.yaml
  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: ig
  text: Ọ gakwuuru Paịlet rịọ ya ozu Jizọs. Mgbe ahụ, Paịlet nyere iwu ka e nyefee ya ozu ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ka e nye ya ozu ahụ” ma ọ bụ “ka e were ozu ahụ nye ya.” Okwu Grik ahụ nwere ike ịpụta ụzọ ndị a yiri ibe ha n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Ọ
  rationale: Nnọchiaha a na-ezo aka na Josef onye Arịmatịa e kwuru okwu ya n’amaokwu bu ụzọ; “Ọ” bụ ụzọ Igbo si akọ akụkọ n’ụzọ dị ire mgbe onye a na-ekwu maka ya doro anya.
- source_word: προσελθὼν τῷ Πιλάτῳ
  choice: gara n’ihu Paịlet
  rationale: Nkebi a na-egosi na Josef bịakwutere Paịlet tupu ọ rịọ ya ihe; “gara n’ihu Paịlet” dabara n’ọnọdụ ịbịakwute onye ọchịchị.
- source_word: ᾐτήσατο
  choice: rịọ ya ka e nye ya
  rationale: Ụdị etiti nke αἰτέω pụtara ịrịọ ka e nye mmadụ ihe; ntụgharị a na-eme ka ihe Josef chọrọ na onye ọ chọrọ ka e nye ya ya doo anya.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: ozu Jizọs
  rationale: N’ebe a σῶμα na-ezo kpọmkwem n’ahụ Jizọs mgbe ọ nwụsịrị; “ozu” bụ okwu Igbo nkịtị, doro anya, na-enweghị ụda okwu ụlọ ọgwụ.
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Okwu a na-egosi ihe mere sochiri arịrịọ Josef n’usoro akụkọ.
- source_word: ἐκέλευσεν
  choice: nyere iwu
  rationale: κελεύω pụtara inye iwu; “nyere iwu” bụ okwu Igbo kwesịrị ekwesị n’ọnọdụ ọchịchị a.
- source_word: ἀποδοθῆναι
  choice: ka e nyefee ya ozu ahụ
  rationale: Aorist passive infinitive a nwere echiche nke inyefe ma ọ bụ inye onye ọzọ ihe. “Nyefee” na-egosi nnyefe ahụ nke ọma, ebe “ya” na-akọwa onye natara ya site n’ihe gbara amaokwu ahụ gburugburu.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A họọrọ “ozu” kama “ahụ” n’ihi na ọnọdụ ahụ kwuru kpọmkwem banyere Jizọs nwụrụ anwụ. Akara nkọwa ala [a] dị n’isiokwu ma na-edebe obere obosara ihe ἀποδοθῆναι nwere ike ịpụta.
