language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· ⸀βασιλεὺς Ἰσραήλ ἐστιν, καταβάτω νῦν ἀπὸ τοῦ σταυροῦ καὶ πιστεύσομεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: ig
  text: “Ọ zọpụtara ndị ọzọ; ọ pụghị ịzọpụta onwe ya. Ọ bụ Eze Izrel; ka o si n’obe ahụ rịdata ugbu a,[a] anyị ga-ekwere na ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ bụrụ na ọ bụ Eze Izrel, ka o si n’obe ahụ rịdata ugbu a, anyị ga-ekwere na ya.” Ụfọdụ nsụgharị na-eme ka okwu ịkwa emo ahụ pụta ìhè site n’itinye echiche ọnọdụ, ma Grik n’ebe a kwuru aha ahụ ozugbo.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄλλους
  choice: ndị ọzọ
  rationale: Ọ bụ ọtụtụ mmadụ e ji okwu a nọchite anya ha; ‘ndị ọzọ’ bụ ụzọ Igbo dị nkenke ma doo anya, nke na-echekwa ntụnyere ịkwa emo dị n’etiti ndị ọzọ na onwe ya.
- source_word: ἔσωσεν
  choice: zọpụtara
  rationale: Okwu a na-eburu echiche ịnapụta ma ọ bụ ịzọpụta. ‘Zọpụtara’ dabara n’ebe a ma ghara ime ka otu akụkụ nke obosara ihe okwu Grik ahụ pụtara bụrụ naanị ya.
- source_word: ἑαυτὸν
  choice: onwe ya
  rationale: 'Nnọchiaha nlọghachi a na-eme ka ntụnyere ahụ pụta ìhè: ọ zọpụtara ndị ọzọ, ma ọ bụghị onwe ya.'
- source_word: οὐ δύναται σῶσαι
  choice: ọ pụghị ịzọpụta
  rationale: Nke a bụ nsụgharị Igbo ebumpụta ụwa nke δύναμαι tinyere infinitive, ma na-echekwa ike okwu ịkwa emo ahụ.
- source_word: βασιλεὺς Ἰσραήλ
  choice: Eze Izrel
  rationale: Ọ bụ aha ọchịchị e ji na-akwa ya emo. E dere ‘Eze’ na mkpụrụedemede ukwu dịka aha nsọpụrụ a na-ekwu kpọmkwem banyere Jizọs.
- source_word: καταβάτω
  choice: ya ... rịdata
  rationale: 'Imperative nke onye nke atọ na-enye aka ma ọ bụ ihe ịma aka: ‘ya rịdata’ bụ okwu Igbo dabara adaba.'
- source_word: νῦν
  choice: ugbu a
  rationale: Na-echekwa ngwa ngwa na ịdị ugbu a nke ihe ịma aka ahụ.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: si n’obe ahụ
  rationale: ‘Obe’ bụ okwu Igbo a na-ejikarị akọwa σταυρός n’ọnọdụ a; ‘ahụ’ na-egosi obe ahụ kpọmkwem ọ nọ n’elu ya.
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: anyị ga-ekwere na ya
  rationale: πιστεύω ya na ἐπί + accusative na-egosi nkwenye ma ọ bụ ntụkwasị obi a tụkwasịrị mmadụ; ‘kwere na ya’ bụ Igbo doro anya nke na-echekwa ntụziaka ahụ.
theological_decisions:
- issue: Otú e si sụgharịa nkwupụta ịkwa emo banyere ịbụ eze
  choice: Ọ bụ Eze Izrel
  alternative: Ọ bụrụ na ọ bụ Eze Izrel
  rationale: Grik ahụ kwuru aha ahụ ozugbo dịka nkebiokwu aha na-enweghị okwu ọnọdụ ‘ọ bụrụ na.’ Nsụgharị a na-echekwa ụdị okwu mbụ na esemokwu ịkwa emo ya, kama ịgbakwunye ọnọdụ na-adịghị n’okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ usoro okwu na-ada ka okwu ndị na-akwa emo kwuru ozugbo, ma e tinyeghị okwu ọnọdụ n’ahịrị bụ isi ebe Grik na-enweghị ya.
