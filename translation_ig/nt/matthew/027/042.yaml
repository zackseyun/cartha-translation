  to: “Ọ zọpụtara ndị ọzọ; ọ pụghị ịzọpụta onwe ya. Ọ bụ Eze Izrel; ka o si n’obe ahụ rịdata ugbu a,[a] anyị ga-ekwere na ya.”
  rationale: The revision removes the unwarranted additive force of -kwa and uses a clearer, natural Standard Igbo construction for the third-person imperative. It retains the source text’s direct declaration, rather than introducing a conditional sense into the main text; the possible conditional interpretive rendering remains confined to the footnote.
