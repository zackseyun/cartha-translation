  source_fidelity: 'Nsụgharị ahụ na-ebufe akụkụ niile dị mkpa nke Grik n’usoro kwesịrị ekwesị: Jizọs guzoro n’ihu gọvanọ ahụ; gọvanọ ahụ jụrụ ya ajụjụ; ajụjụ banyere ịbụ Eze ndị Juu; na nzaghachi Jizọs, Σὺ λέγεις. “Guzoro,” “n’ihu,” “gọvanọ,” na “jụọ ya” dabara nke ọma na ἐστάθη, ἔμπροσθεν, ἡγεμών, na ἐπηρώτησεν. “Ọ bụ gị na-ekwu ya” na-edobe nzaghachi ahụ dịka okwu dị mkpirikpi na nke na-adịghị akọwa nkwenye ahụ karịa ka Grik si akọwa ya.'
