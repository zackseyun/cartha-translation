id: MAT.27.11
reference: Matthew 27:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: ig
  text: Jizọs guzoro n’ihu gọvanọ ahụ, gọvanọ ahụ wee jụọ ya, sị, “Ị bụ Eze ndị Juu[a]?” Jizọs wee sị[b], “Ọ bụ gị na-ekwu ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Eze ndị Judia.” Okwu Grik ahụ nwere ike ịpụta ndị Juu n’ozuzu ha, ma ọ bụ ndị Judia kpọmkwem n’ọnọdụ ụfọdụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Gị na-ekwu ya,” ma ọ bụ “Ọ dị ka i kwuru.” Nzaghachi Jizọs dị nkenke, ihe ọ pụtara apụtachaghịkwa ihe niile n’asụsụ Grik.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστάθη
  choice: guzoro
  rationale: Okwu a na-egosi na Jizọs guzoro n’ihu gọvanọ; ọ naghị etinye echiche na e mere ka o guzoro, nke Grik ekwughị hoo haa.
- source_word: ἔμπροσθεν
  choice: n’ihu
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma dịkwa ùgwù si egosi ịnọ n’ihu onyeisi n’ọnọdụ ikpe.
- source_word: ἡγεμών / ἡγεμόνος
  choice: gọvanọ
  rationale: “Gọvanọ” bụ okwu ndị Igbo nke oge a na-aghọta nke ọma maka onye ọchịchị Rom a; “onye ọchịchị” ga-adị obosara karịa ihe a chọrọ.
- source_word: ἐπηρώτησεν
  choice: jụọ ya
  rationale: N’Igbo, “jụọ ya” na-egosi ajụjụ ahụ n'ụzọ eke; ọnọdụ ikpe dị n’akụkọ ahụ na-eme ka ọdịdị ajụjụ ahụ doo anya n’enweghị itinye okwu siri ike dịka ịgba ya ajụjụ ọnụ.
- source_word: λέγων
  choice: sị
  rationale: “Sị” bụ ụzọ Igbo eke si webata okwu a kpọpụtara kpọmkwem, ma na-ebufe ọrụ participle Grik ahụ n’enweghị nkwusawanye na-adịghị mkpa.
- source_word: βασιλεὺς
  choice: Eze
  rationale: “Eze” bụ ezigbo okwu Igbo maka βασιλεύς; mkpụrụedemede ukwu na-egosi na ọ bụ aha-ọkwa e kwuru kpọmkwem banyere Jizọs.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: “Ndị Juu” bụ nsụgharị ndị na-agụ Igbo ga-aghọta ozugbo n’ọnọdụ ebubo ndọrọ ndọrọ ọchịchị a; “ndị Judia” ka bụ ihe ọzọ okwu Grik ahụ nwere ike ịpụta n’ọnọdụ ụfọdụ.
- source_word: ἔφη
  choice: sị
  rationale: Okwu Grik a na-webata nzaghachi Jizọs n'ụzọ dị mfe; “sị” bụ ihe kwekọrọ na ya n’Igbo ma ghara ịgbakwunye nkọwa.
- source_word: Σὺ λέγεις
  choice: Ọ bụ gị na-ekwu ya
  rationale: Nsụgharị a na-edobe nzaghachi ahụ nkenke, na-apụtachaghị ihe niile, ma ghara ime ya nkwenye doro anya karịa ka Grik si dị.
theological_decisions:
- issue: Ụdị nzaghachi Jizọs n’okwu Σὺ λέγεις
  choice: “Ọ bụ gị na-ekwu ya,” nke na-edobe ya dịka nkwenye na-apụtachaghị ihe niile ma nwee njide onwe.
  alternative: “Ọ dị ka i kwuru,” nke ga-eme ka ọ bụrụ nkwenye doro anya karị; ma ọ bụ “Gị na-ekwu ya,” nke dị nso n’usoro okwu Grik ma ghara ịdịcha eke n’Igbo.
  rationale: Grik ahụ adịghị agọnahụ ebubo ahụ kpamkpam, ma ọ naghịkwa ekwughachi ya dịka nkwupụta ndọrọ ndọrọ ọchịchị doro anya. Ya mere, a hapụrụ esemokwu ahụ ka ọ dị kama idozi ya n’otu ụzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E jiri “wee” mee ka usoro akụkọ ahụ na-aga nke ọma n’Igbo, ebe a na-ejighị okwu mmalite pụtara “ugbu a,” n’ihi na isi mmalite Grik enweghị okwu oge dị otu ahụ. E tinyere akara [a] n’ebe “ndị Juu” dị na akara [b] n’ebe a na-webata nzaghachi Jizọs, ka nkọwa ala peeji kwekọọ kpọmkwem n’okwu ha na-akọwa.
