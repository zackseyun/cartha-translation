base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/045.yaml
  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: ig
  text: Site n’elekere nke isii, ọchịchịrị gbara ala ahụ dum ruo n’elekere nke itoolu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Elekere nke isii bụ ihe dị ka etiti ehihie, elekere nke itoolu bụkwa ihe dị ka elekere atọ n’ehihie.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “ụwa niile.” Okwu Grik ahụ nwere ike ịpụta “ala” ma ọ bụ “ụwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: Site
  rationale: “Site” na-egosi mmalite oge nke ἀπό; a hapụrụ δέ dị ka njikọ dị nro nke usoro okwu Igbo na ọnọdụ gbara amaokwu ahụ gburugburu na-eburu n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: ἕκτης ὥρας
  choice: n’elekere nke isii
  rationale: Nke a na-edobe usoro ịgụ oge dị n’asụsụ mbụ; nkọwa na ọ bụ ihe dị ka etiti ehihie dị n’okpuru peeji.
- source_word: σκότος
  choice: ọchịchịrị
  rationale: “Ọchịchịrị” bụ okwu Igbo doro anya maka ọnọdụ enweghị ìhè ma na-edobe ịdị ike nke ihe a kọrọ.
- source_word: ἐγένετο
  choice: gbara
  rationale: N’okwu Igbo “ọchịchịrị gbara” na-egosi na ọchịchịrị malitere ma gbasaa n’ebe ahụ, n’ụzọ eke karịa ntụgharị okwu n’otu n’otu.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: ala ahụ dum
  rationale: “Ala ahụ dum” na-edobe γῆ dị ka ala ma ghara ikpebi na ọ pụtara ụwa niile; nhọrọ “ụwa niile” ka e debere n’okpuru peeji.
- source_word: ἕως ὥρας ἐνάτης
  choice: ruo n’elekere nke itoolu
  rationale: Nke a na-edobe usoro oge nke ihe odide Grik; a kọwara ihe oge ahụ pụtara n’oge nke ugbu a n’okpuru peeji.
theological_decisions:
- issue: Ókè γῆ n’akụkọ banyere ọchịchịrị
  choice: ala ahụ dum
  alternative: ụwa niile
  rationale: γῆ nwere ike ịpụta “ala” ma ọ bụ “ụwa.” Isi amaokwu jiri “ala ahụ dum” ka ọ ghara ịgbakwunye nkwubi okwu na ọchịchịrị ahụ kpuchiri ụwa niile, ma ihe ọzọ kwere omume dị n’okpuru peeji iji chekwaa mgbagwoju anya nke Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ usoro oge ochie n’isi amaokwu, kọwaa ya n’okpuru peeji, ma chekwaa nghọtahie nwere isi nke γῆ.
