  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: ig
  text: Mgbe ndị isi nchụaja na ndị okenye na-ebo ya ebubo, ọ zaghị ihe ọ bụla.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “o nyeghị azịza ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: Mgbe ... na-ebo ya ebubo
  rationale: “Mgbe” tinyere ngwaa na-aga n’ihu na-egosi na ebubo ahụ na-aga n’ihu n’otu oge ahụ; nhazi a bụkwa Igbo nkịtị ma doo anya.
- source_word: κατηγορεῖσθαι
  choice: na-ebo ya ebubo
  rationale: Nke a na-egosi n'ụzọ ebumpụta ụwa na Igbo na ndị ọzọ na-ewetara ya ebubo, ma chekwaa ọnọdụ iwu dị n'okwu Grik.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: ndị isi nchụaja na ndị okenye
  rationale: “Ndị isi nchụaja” na-ezo aka n’òtù ndị ndú nchụaja, ebe “ndị okenye” bụ aha kwụ ọtọ maka ndị isi ahụ ọzọ.
- source_word: οὐδὲν
  choice: ihe ọ bụla
  rationale: 'N''okwu jụrụ ajụ “ọ zaghị,” “ihe ọ bụla” na-enye kpọmkwem echiche nke οὐδέν: ọ zaghị ihe ọbụla.'
- source_word: ἀπεκρίνατο
  choice: ọ zaghị
  rationale: “Ọ zaghị” bụ ụzọ Igbo dị nkenke ma dị ebumpụta ụwa isi kwuo na o nyeghị azịza.
- source_word: καὶ
  choice: Mgbe
  rationale: Njikọ akụkọ ahụ na-aga n'ihu site n'ahịrịokwu oge. Ịghara itinye “Ma” ezere iweta ọdịiche nke καὶ ekwughị kpọmkwem.
theological_decisions:
- issue: Ịgbachi nkịtị Jizọs n’ihu ndị na-ebo ya ebubo
  choice: Kọwaa naanị na ọ zaghị ihe ọ bụla.
  alternative: Ịsụgharị ya n'ụzọ ga-eme ka o kwuo hoo haa na nke a mezuru Aịzaya 53.
  rationale: Amaokwu a na-akọ ihe mere n’enweghị nkwupụta mmezu amụma; ya mere, nsụgharị ahụ anaghị etinye nkọwa nkà mmụta okpukpe nke ederede ahụ ekwughị.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ndị isi nchụaja” mee ka ọchịchị ndị isi nchụaja pụta ìhè, e jighịkwa okwu otu ụka pụrụ iche.
