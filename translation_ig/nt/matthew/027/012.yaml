  source_fidelity: 'Nsụgharị ahụ na-egosipụta nke ọma ἐν τῷ κατηγορεῖσθαι dị ka ọnọdụ oge na-aga n’ihu: “Mgbe ... na-ebo ya ebubo.” Ọ na-edobe olu nnata nke κατηγορεῖσθαι site n’igosipụta ndị na-ebo ya ebubo, ma sụgharị ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων n’ụzọ ziri ezi dịka “ndị isi nchụaja na ndị okenye.” “Ọ zaghị ihe ọ bụla” na-anọchi οὐδὲν ἀπεκρίνατο n’enweghị mgbakwunye nkọwa.'
  naturalness: Ahịrịokwu a bụ Igbo Ọkọlọtọ dị mfe, nke oge a, ma na-agụ nke ọma. “Ndị isi nchụaja” na “ndị okenye” bụ nhọrọ a na-ahụkarị ma doo anya n’akụkọ ọnọdụ a.
  terminology: Aha ìgwè ndị ọchịchị okpukpe na okwu gbasara ebubo na azịza ziri ezi ma nọgide n’usoro okwu na-adịghị akwalite nkọwa ụka ma ọ bụ nkà mmụta okpukpe pụrụ iche. Ihe odide ala peeji ahụ na-enye ụzọ ọzọ kwere omume n’enweghị mgbanwe pụtara ìhè.
