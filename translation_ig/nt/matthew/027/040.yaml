revisions:
- from: na-asị, “Gị onye ga-akwatu ụlọnsọ ukwu ma wuo ya n’ime ụbọchị atọ, zọpụta onwe gị! Ọ bụrụ na ị bụ Ọkpara Chineke, si n’obe ahụ rịdata.”
  to: na-asị, “Gị onye ga-akwatu ụlọ nsọ ma wuo ya n’ime ụbọchị atọ, zọpụta onwe gị! Ọ bụrụ na ị bụ Nwa Chineke, si n’obe ahụ gbadata.”
  rationale: 'The revision preserves the Greek taunt and its prospective sense in “ga-akwatu … wuo,” while replacing wording that either adds ‘firstborn’ to the divine-son title or is less idiomatic in Standard Igbo. No footnote is required: “wuo” directly represents οἰκοδομῶν without adopting the interpretive alternative ‘wughachi.’'
