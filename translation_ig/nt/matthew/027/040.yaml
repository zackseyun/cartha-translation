source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: ig
  text: na-asị, “Gị onye ga-akwatu ụlọ nsọ ma wuo ya n’ime ụbọchị atọ, zọpụta onwe gị! Ọ bụrụ na ị bụ Nwa Chineke, si n’obe ahụ gbadata.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ bụ participle nke na-aga n’ihu na akụkọ dị n’amaokwu bu ụzọ; ‘na-asị’ na-ejikọta okwu ịkwa emo ahụ n’ụzọ Igbo dị mfe, n’etinyeghị onye isiokwu ọzọ na-adịghị n’okwu Grik a.
- source_word: Ὁ καταλύων
  choice: Gị onye ga-akwatu
  rationale: Article na participle a na-arụ ọrụ dịka ịkpọ mmadụ okwu ozugbo. ‘Gị onye ga-akwatu’ na-egosipụta ebubo ha ji akparị Jizọs, kama ime ka ọ bụrụ na ọ na-akwatu ya ugbu a.
- source_word: καταλύω
  choice: kwatu
  rationale: ‘Kwatu’ bụ okwu Igbo doro anya maka ịkwatu ụlọ ma ọ bụ ihe e wuru, ma dabara n’ụlọnsọ ukwu.
- source_word: ναός
  choice: ụlọnsọ ukwu
  rationale: N’agbanyeghị na ναός nwere ike ịpụta ebe nsọ dị n’ime tempụl kpọmkwem, ‘ụlọnsọ ukwu’ bụ okwu ndị Igbo na-aghọta nke ọma maka tempụl dị na Jerusalem n’ọnọdụ a.
- source_word: ἐν τρισὶν ἡμέραις
  choice: n’ime ụbọchị atọ
  rationale: Nke a na-egosipụta oge ahụ n’asụsụ Igbo dị ugbu a ma na-edebe mpụtara nke okwu Grik.
- source_word: οἰκοδομῶν
  choice: wuo ya
  rationale: Okwu Grik pụtara ‘wuo,’ ọ bụghị kpọmkwem ‘wughachi.’ ‘Ya’ na-ezo aka n’ụlọnsọ ukwu ma na-eme ka Igbo bụrụ nke eke.
- source_word: σῶσον σεαυτόν
  choice: zọpụta onwe gị
  rationale: Nke a na-edobe iwu kpọmkwem na reflexive pronoun nke Grik, ma na-egosipụta ịma aka nke ndị na-akwa ya emo.
- source_word: εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Ọ bụrụ na ị bụ Ọkpara Chineke
  rationale: Nke a na-edobe ọnọdụ ‘ọ bụrụ na’ na aha Kraịst ahụ n’ụzọ doro anya, n’ebelataghị ma ọ bụ gbasaa ihe ọ pụtara.
- source_word: κατάβηθι
  choice: si ... rịdata
  rationale: ‘Si n’obe ahụ rịdata’ bụ ụzọ Igbo si enye onye nọ n’elu ihe iwu ka ọ gbadata, ma kwekọọ n’ihe a na-ekwu banyere obe.
- source_word: σταυρός
  choice: obe
  rationale: ‘Obe’ bụ okwu Igbo a nabatara nke ọma maka σταυρός n’akụkọ ahụhụ na ọnwụ Jizọs.
theological_decisions:
- issue: Otú e si sụgharị aha Kraịst υἱὸς τοῦ θεοῦ n’okwu ịkwa emo
  choice: Ọkpara Chineke
  alternative: Nwa Chineke
  rationale: ‘Ọkpara Chineke’ na-edobe aha pụrụ iche nke a na-akpọ Jizọs ma na-egosipụta ịdị arọ nke aha ahụ n’Igbo. A hapụrụ okwu ahụ dịka ịma aka ndị na-akwa emo, n’agbanyeghị na ndị na-agụ akwụkwọ maara nkwupụta Matiu banyere onye Jizọs bụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. A họọrọ ‘ụlọnsọ ukwu’ karịa okwu transliteration dịka ‘tempụl.’ E tinyeghị nkọwa ala peeji maka οἰκοδομῶν n’ihi na isi ederede ‘wuo ya’ na-edobe okwu Grik n’onwe ya; ‘wughachi’ bụ nkọwa sitere n’ọnọdụ, ọ bụghị okwu ọzọ e dere. Enweghị akara footnote n’isi ederede n’ihi na enweghị footnote e tinyere na draft a.
