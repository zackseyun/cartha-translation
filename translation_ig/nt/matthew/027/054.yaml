id: MAT.27.54
reference: Matthew 27:54
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: ig
  text: Mgbe ọchịagha otu narị ndị agha na ndị ha na ya nọ, bú ndị na-eche Jizọs nche, hụrụ ala ọma jijiji ahụ na ihe ndị mere, oke egwu jidere ha, ha wee sị, “N’ezie, onye a bụ Ọkpara Chineke.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu nwa Chineke.” Okwu Grik ahụ enweghị akara nkọwa (article); ma n’akụkọ Matiu, a ghọtara ya ebe a dị ka aha nsọ e ji akọwa Jizọs.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: ọchịagha ndị agha narị
  rationale: Nke a na-akọwa n'ụzọ doro anya onyeisi ndị agha Rom a na-akpọ centurion, n’asụsụ Igbo ndị mmadụ taa ga-aghọta.
- source_word: τηροῦντες
  choice: ndị na-eche Jizọs nche
  rationale: N’ọnọdụ a, okwu ahụ pụtara iche onye nche n’ebe a na-egbu ya, ọ bụghị naanị ile ya anya.
- source_word: ἰδόντες
  choice: mgbe ... hụrụ
  rationale: E gosipụtara participle a dị ka nkebiokwu oge ka ahịrịokwu ahụ bụrụ Igbo e ji ekwu okwu nke ọma.
- source_word: σεισμόν
  choice: ala ọma jijiji
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa earthquake, ọ dabara kpọmkwem n’ihe Matiu na-akọ.
- source_word: τὰ γενόμενα
  choice: ihe ndị mere
  rationale: Ọ na-ezo aka n’ihe dị iche iche mere gburugburu ọnwụ Jizọs, ọ bụghị naanị ala ọma jijiji ahụ.
- source_word: ἐφοβήθησαν σφόδρα
  choice: oke egwu jidere ha
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma sie ike isi gosi na egwu tụrụ ha nke ukwuu.
- source_word: Ἀληθῶς
  choice: N’ezie
  rationale: Ọ na-echekwa nkwenye siri ike na nkwupụta ha n’enweghị ịgbakwụnye nkọwa banyere ókè nghọta okpukpe ha ruru.
- source_word: θεοῦ υἱὸς
  choice: Ọkpara Chineke
  rationale: N’ọnọdụ akụkọ Matiu, nke a na-arụ ọrụ dị ka aha nsọ e ji akọwa Jizọs. “Ọkpara Chineke” bụkwa okwu Igbo a maara nke ọma maka aha a; e debere nghọta ọzọ nwere ike ịdị na ndetu.
- source_word: οὗτος
  choice: onye a
  rationale: Ọ na-echekwa ike okwu ngosi ahụ ma bụrụkwa Igbo nkịtị mgbe a na-ekwu banyere mmadụ.
theological_decisions:
- issue: Otú e si sụgharịa θεοῦ υἱὸς n’okwu ọchịagha ahụ
  choice: Ọkpara Chineke
  alternative: otu nwa Chineke
  rationale: Ọ bụ ezie na e nweghị article n’ihu okwu Grik a, usoro predicate nominative na ụzọ Matiu si eji aha a eme ihe na-akwado nghọta ya dị ka aha nsọ, “Ọkpara Chineke.” Ma ebe ọdịdị okwu Grik ahụ nwekwara ike ime ka ụfọdụ ghọta ya n’ụzọ indefinite, e gosiri nhọrọ ahụ na ndetu kama izochi esemokwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ọchịagha ndị agha narị” kama iburu okwu mba ọzọ “senturiọn.” Nkebiokwu “ndị ya na ha nọ, bú ndị na-eche Jizọs nche” na-edobe njikọ okwu Grik ahụ ma na-eme ka o doo anya ndị nọnyere ọchịagha ahụ na ọrụ ha.
