revisions:
- from: Mgbe ọchịagha ndị agha narị ahụ na ndị ya na ha nọ, bú ndị na-eche Jizọs nche, hụrụ ala ọma jijiji ahụ na ihe ndị mere, oke egwu jidere ha, ha wee sị, “N’ezie, onye a bụ Ọkpara Chineke.”[a]
  to: Mgbe ọchịagha otu narị ndị agha na ndị ha na ya nọ, bú ndị na-eche Jizọs nche, hụrụ ala ọma jijiji ahụ na ihe ndị mere, oke egwu jidere ha, ha wee sị, “N’ezie, onye a bụ Ọkpara Chineke.”[a]
  rationale: The revision corrects the pronoun relationship for the soldiers accompanying the centurion, improves the naturalness of the military title, and makes the grammatical footnote clearer in Standard Igbo. It retains the draft’s source-faithful structure and its non-dogmatic treatment of the anarthrous expression θεοῦ υἱός.
  reviewer_model: gpt-5.6-terra
