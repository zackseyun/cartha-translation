- from: N'oge ememme ahụ, gọvanọ na-emebu ịhapụrụ ìgwè mmadụ ahụ otu onye mkpọrọ ha chọrọ.[a]
  to: N'oge ememme ahụ, gọvanọ na-emebu ịtọhapụrụ ìgwè mmadụ ahụ otu onye mkpọrọ ha chọrọ.[a]
  rationale: Changed only “ịhapụrụ” to “ịtọhapụrụ” so that the translation explicitly and naturally conveys the release of a prisoner, as required by the Greek ἀπολύειν. All other wording and the alternative rendering for ἑορτή are retained.
