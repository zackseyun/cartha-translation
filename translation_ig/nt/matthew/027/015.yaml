source:
  edition: SBLGNT
  text: Κατὰ δὲ ἑορτὴν εἰώθει ὁ ἡγεμὼν ἀπολύειν ἕνα τῷ ὄχλῳ δέσμιον ὃν ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: ig
  text: N'oge ememme ahụ, gọvanọ na-emebu ịtọhapụrụ ìgwè mmadụ ahụ otu onye mkpọrọ ha chọrọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N'oge oriri ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: N'oge ememme ahụ
  rationale: κατά na aha dị n'ụdị accusative ebe a na-egosi oge, ya bụ “n'oge.” δέ bụ njikọ akụkọ dị nro nke a na-adịghị mkpa ịtụgharị iche n'Igbo. “Ememme ahụ” dabara n'ọnọdụ Ememme Ngabiga ma na-asụgharị ἑορτή n'ụzọ mmadụ taa ga-aghọta.
- source_word: εἰώθει
  choice: na-emebu
  rationale: Ụdị imperfect a na-egosi omume a na-eme dịka omenala n'oge gara aga; “na-emebu” na-egosipụta nke a n'Igbo n'ụzọ eke.
- source_word: ὁ ἡγεμὼν
  choice: gọvanọ
  rationale: N'ebe a ἡγεμών bụ onye ọchịchị Rom na-achị ógbè; “gọvanọ” bụ okwu doro anya ma bụrụ nke a na-eji n'Igbo ugbu a.
- source_word: ἀπολύειν
  choice: ịhapụrụ
  rationale: ἀπολύω n'ebe a pụtara ịtọhapụ onye nọ n'ụlọ mkpọrọ. “Ịhapụrụ” jikọtara omume ahụ na ndị a na-ahapụrụ onye mkpọrọ ahụ, dịka dative τῷ ὄχλῳ si gosi.
- source_word: ἕνα τῷ ὄχλῳ δέσμιον
  choice: ìgwè mmadụ ahụ otu onye mkpọrọ
  rationale: ἕνα na-akọwa na ọ bụ otu onye; δέσμιος bụ onye e jidere ma ọ bụ kee agbụ, ya mere “onye mkpọrọ” doro anya. “Ìgwè mmadụ ahụ” na-enye τῷ ὄχλῳ dịka ndị a na-ahapụrụ ya.
- source_word: ὃν ἤθελον
  choice: ha chọrọ
  rationale: Nkebiokwu a na-akọwa otu onye mkpọrọ ahụ dị ka onye ìgwè mmadụ họọrọ. Igbo na-ekwe ka e kwuo ya n'ụzọ dị mkpirikpi dịka “onye mkpọrọ ha chọrọ” n'enweghị ịgbakwunye nkọwa na-adịghị na Grik.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Na-emebu” chekwara echiche nke omume omenala gara aga, ebe “ememme” bụ isi ntụgharị ἑορτή; e debere “oriri” dịka ụzọ ọzọ n'okpuru ala peeji.
