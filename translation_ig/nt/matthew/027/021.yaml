  text: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς· Τίνα θέλετε ἀπὸ τῶν δύο ἀπολύσω ὑμῖν; οἱ δὲ εἶπαν· ⸀Τὸν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: ig
  text: Ma gọvanọ ahụ zara ha, sị, “Olee onye n’ime ndị abụọ ahụ ka unu chọrọ ka m tọhapụ unu?” Ha sịrị, “Barabas.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτοῖς
  choice: Ma ... zara ha, sị
  rationale: A tụgharịrị njikọ participle na finite verb n’ụzọ Igbo si ekwu okwu nke ọma. “Zara ha, sị” na-echekwa echiche nke nzaghachi na nke ikwu okwu, ebe “Ma” na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche dị na akụkọ ahụ.
- source_word: ὁ ἡγεμὼν
  choice: gọvanọ ahụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ọchịchị Rom nke na-achị ógbè ahụ; “gọvanọ” bụ aha doro anya ma bụrụ nke ndị Igbo nke oge a na-aghọta.
- source_word: Τίνα ... ἀπὸ τῶν δύο
  choice: Olee onye n’ime mmadụ abụọ ahụ
  rationale: Ajụjụ ahụ chọrọ ka a họrọ otu onye n’ime mmadụ abụọ a kpọrọ aha. Nhazi a bụ Igbo ebumpụta ụwa ma na-echekwa kpọmkwem nhọrọ dị n’asụsụ Grik.
- source_word: θέλετε
  choice: unu chọrọ
  rationale: θέλω n’ebe a na-egosi ihe mmadụ chọrọ ma ọ bụ họọrọ; “chọrọ” na-enye ya n’Igbo doro anya, nke oge a.
- source_word: ἀπολύσω ὑμῖν
  choice: ka m hapụrụ unu
  rationale: N’ọnọdụ ikpe a, ἀπολύω pụtara ịtọhapụ onye e jidere. “Hapụrụ unu” na-egosi ma ntọhapụ ahụ ma dative uru ὑμῖν, ya bụ, ime ya dịka nhọrọ e nyere ha.
- source_word: οἱ δὲ εἶπαν
  choice: Ha sịrị
  rationale: δὲ n’ebe a na-aga n’ihu na nzaghachi ìgwè mmadụ; Igbo anaghị achọ ka e tinye njikọ ọzọ, ya mere “Ha sịrị” na-aga were were ma ghara ime ka ọdịiche ahụ sie ike karịa isi mmalite.
- source_word: Τὸν Βαραββᾶν
  choice: Barabas
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị transliteration a na-ahụkarị ma dị mfe ịgụ n’Igbo.
theological_decisions: []
translation_notes:
  register: 'Asụsụ ahụ bụ Standard Igbo nke oge a: dị mfe nghọta, kwanyere ọnọdụ ikpe ahụ ùgwù, ma ghara ịdị arọ. E chekwara obere ọdịiche nke δέ mbụ site na “Ma,” ebe nke abụọ hapụrụ n’enweghị njikọ n’ihi usoro okwu Igbo ebumpụta ụwa.'
