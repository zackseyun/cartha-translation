revisions:
- from: Ma gọvanọ ahụ zara ha, sị, “Olee onye n’ime mmadụ abụọ ahụ unu chọrọ ka m hapụrụ unu?” Ha sịrị, “Barabas.”
  to: Ma gọvanọ ahụ zara ha, sị, “Olee onye n’ime ndị abụọ ahụ ka unu chọrọ ka m tọhapụ unu?” Ha sịrị, “Barabas.”
  rationale: The revision replaces the ambiguous completed-form “hapụrụ” with “tọhapụ,” the standard clear term for setting a prisoner free, while retaining the second-person plural object/benefactive sense. It also uses “ndị abụọ” for two specified people. No footnote is needed because the source has no unresolved textual or semantic ambiguity requiring one.
  reviewer_model: gpt-5.6-terra
