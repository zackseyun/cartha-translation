  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: ig
  text: Ma ndị isi nchụaja na ndị okenye mere ka ìgwè mmadụ ndị ahụ rịọ maka Barabas, ma gbuo Jizọs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mee ka Jizọs laa n’iyi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: N'ebe a, δέ na-egosi ọdịiche dị n'etiti ihe a na-akọ ugbu a na ihe bu ya ụzọ; “Ma” na-egosipụta nke a n'Igbo nkịtị.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Okwu a na-ezo aka n'òtù ndị ndu nchụaja dị na Jerusalem, ọ bụghị naanị otu nnukwu onye nchụaja.
- source_word: πρεσβύτεροι
  choice: ndị okenye
  rationale: N'ebe a ọ pụtara ndị ndu ndị Juu a ma ama; “ndị okenye” na-echekwa ma ọnọdụ ọchịchị ha ma ihe mere eme.
- source_word: ἔπεισαν
  choice: mere ka ... kweta
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo na ha mere ka ìgwè mmadụ ahụ kwenye ime ihe ha chọrọ.
- source_word: ὄχλους
  choice: ìgwè mmadụ ahụ
  rationale: Ọ na-anọchi anya igwe ndị gbakọrọ n'ebe ahụ; n'Igbo, mkpokọta otu a na-enye echiche nke ọtụtụ mmadụ n'ụzọ ebumpụta ụwa.
- source_word: ἵνα
  choice: ịrịọ ... ma ka
  rationale: Mgbe o sochara ngwaa nke ime ka mmadụ kwenye, ἵνα na-egosi ihe a chọrọ ka ha mee; usoro a na-asụ nke ọma n'Igbo.
- source_word: αἰτήσωνται
  choice: ịrịọ ka a hapụ
  rationale: N'ọnọdụ akụkọ a, ihe ha na-arịọ banyere Barabas bụ ka a hapụ ya; itinye “ka a hapụ” na-eme ka ebumnuche arịrịọ ahụ doo anya n'Igbo.
- source_word: Βαραββᾶν
  choice: Barabas
  rationale: E dere aha onye ahụ n'ụdị ntụgharị mkpụrụokwu a na-aghọta nke ọma n'Igbo.
- source_word: ἀπολέσωσιν
  choice: ka e bibie
  rationale: “Bibie” na-echekwa ike sara mbara nke ἀπόλλυμι, ya bụ ime ka onye laa n'iyi, n'agbanyeghị na n'ọnọdụ a ọ na-ezo aka n'igbu Jizọs.
- source_word: τὸν δὲ Ἰησοῦν
  choice: ma ka e bibie Jizọs
  rationale: 'δὲ nke abụọ na-eme ka Barabas na Jizọs dị iche: ha ga-arịọ maka Barabas, ma chọọ ka e bibie Jizọs.'
theological_decisions:
- issue: Ntụgharị ἀπολέσωσιν n'ọnọdụ ikpe ọnwụ
  choice: ka e bibie Jizọs
  alternative: ka e gbuo Jizọs
  rationale: Ngwaa Grik a sara mbara karịa okwu iwu pụrụ iche maka ikpe ọnwụ; “bibie” na-echekwa echiche nke ime ka onye laa n'iyi. E debere ntụgharị doro anya banyere ọnwụ n'okpuru peeji ka onye na-agụ ghọta ihe ọ pụtara n'ọnọdụ a.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị isi nchụaja” na “ndị okenye” maka okwu ndu ndị Juu; e zere okwu pụrụ iche nke otu ụka.
