id: MAT.27.57
reference: Matthew 27:57
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: ig
  text: Mgbe o ruru ná mgbede, otu nwoke bara ọgaranya nke si Arimatia bịara. Aha ya bụ Josef; ya onwe ya kwa aghọọla onye na-eso ụzọ Jizọs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “e meela ya onye na-eso ụzọ Jizọs,” ma ọ bụ, “ya onwe ya bụkwa onye na-eso ụzọ Jizọs.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Mgbe o ruru ná mgbede
  rationale: Nke a na-egosi oge ihe omume ọhụrụ malitere. Ọ bụ Igbo nkịtị ma doo anya maka ‘mgbe mgbede bịara,’ na-enweghị itinye okwu pụtara ‘ugbu a’ nke na-adịghị n'okwu Grik.
- source_word: ἦλθεν
  choice: bịara
  rationale: Ọ bụ nsụgharị kwụ ọtọ, dịkwa mma n'akụkọ maka mmegharị a kọwara.
- source_word: ἄνθρωπος πλούσιος
  choice: otu nwoke bara ọgaranya
  rationale: Okwu a na-ekwu kpọmkwem na nwoke ahụ nwere akụ; ‘bara ọgaranya’ bụ okwu Igbo a na-ejikarị eme ihe, nke ndị mmadụ na-aghọta ngwa ngwa.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: nke si Arimatia
  rationale: ἀπό na-egosi ebe o si; ‘si Arimatia’ na-echekwa echiche ahụ nke ọma.
- source_word: τοὔνομα Ἰωσήφ
  choice: Aha ya bụ Josef
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụ nke ebumpụta ụwa isi mata aha mmadụ.
- source_word: ὃς καὶ αὐτὸς
  choice: ya onwe ya kwa
  rationale: ‘Ya onwe ya’ na-echekwa nkwusi ike nke αὐτός, ‘kwa’ na-echekwakwa echiche nke καί na Josef sokwa ná ndị ọzọ.
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: aghọọla onye na-eso ụzọ Jizọs
  rationale: Ụdị passive nke μαθητεύω nwere ike igosi na mmadụ ghọrọ, ma ọ bụ na e mere ya, onye na-eso ụzọ. Nsụgharị a na-akọ ọnọdụ Josef n'ụzọ doro anya ma ghara ikwu kpọmkwem otú o si bata n'ịbụ onye na-eso ụzọ.
theological_decisions:
- issue: Ihe ἐμαθητεύθη pụtara n'ihe gbasara Josef na Jizọs
  choice: Josef aghọọla onye na-eso ụzọ Jizọs
  alternative: E meela Josef onye na-eso ụzọ Jizọs; ma ọ bụ, Josef bụkwa onye na-eso ụzọ Jizọs
  rationale: Okwu Grik ahụ nwere ike ilekwasị anya n'ịghọ onye na-eso ụzọ ma ọ bụ n'ịbụ onye e mere onye na-eso ụzọ. E ji ‘aghọọla’ chekwaa echiche nke mgbanwe rụpụtara ọnọdụ ọhụrụ, n'enweghị nkwubi okwu gbasara onye kụziiri ya kpọmkwem ma ọ bụ usoro o si bụrụ onye na-eso ụzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara okwu ahụ ụzọ ahịrịokwu abụọ ka njirimara Josef na nkọwa banyere ịbụ onye na-eso ụzọ ghara ịdị arọ, ebe ‘ya onwe ya kwa’ ka na-echekwa nkwusi ike dị n'okwu Grik.
