  yaml_path: translation/nt/matthew/027/059.yaml
  text: And Joseph took the body and wrapped it in a clean linen cloth[b][a],
translation:
  language: ig
  text: Josef wee buru ozu ahụ, fụchie ya n’ákwà linen dị ọcha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “fụchie ya n’ákwà linen a na-eji lie ozu.” Okwu Grik ahụ na-ekwu maka ákwà linen, nke a na-ejikarị n’olili ozu.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: wee buru
  rationale: Aorist participle ahụ na-egosi ihe Josef mere tupu o kechie ozu ahụ; ‘wee buru’ na-enye usoro omume ahụ n’Igbo akụkọ n’ụzọ eke.
- source_word: σῶμα
  choice: ozu ahụ
  rationale: N’ọnọdụ olili a, σῶμα na-ezo aka n’ahụ Jizọs nwụrụ anwụ; ‘ozu ahụ’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ahụ, na-etinyeghị nnọchiaha nwe nke Grik na-enweghị.
- source_word: ἐνετύλιξεν
  choice: kechie
  rationale: Okwu a pụtara ịfụchie ma ọ bụ ikpuchi ihe gburugburu; ‘kechie’ bụ okwu Igbo dị mfe ma dabara n’iji ákwà kwadebe ozu maka olili.
- source_word: αὐτὸ
  choice: ya
  rationale: Nnọchiaha Grik ahụ bụ neuter ma na-alaghachi na σῶμα. N’Igbo, ‘ya’ anaghị egosi gender, ya mere ọ na-echekwa njikọ ahụ n’enweghị ịmanye ọdịiche dị n’etiti ‘it’ na ‘him.’
- source_word: σινδόνι
  choice: n’ákwà ... e ji lìnen mee
  rationale: σινδών bụ ákwà linen, karịsịa nke a pụrụ iji lie ozu. Nsụgharị a kọwara ụdị ihe e ji mee ákwà ahụ n’asụsụ ndị mmadụ ga-aghọta, n’enweghị ime ka ọ bụrụ kpọmkwem ákwà olili naanị.
- source_word: καθαρᾷ
  choice: ọcha
  rationale: καθαρός n’ebe a pụtara ákwà dị ọcha. ‘Ọcha’ bụ okwu Igbo eke maka ịdị ọcha n’ọnọdụ a.
- source_word: καὶ ... ὁ Ἰωσὴφ
  choice: Josef wee
  rationale: Usoro ‘wee’ na-ejikọta omume a na akụkọ gara aga ma na-enye καί n’Igbo akụkọ n’ụzọ dị ugbu a na nke eke.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị mfe, dị ugwu, ma kwekọọ n’usoro akụkọ. E ji ‘ozu ahụ’ mee ka ọnọdụ ọnwụ na olili doo anya; ‘ya’ na-echekwa nghọta nnọchiaha Grik n’ihi na Igbo anaghị ekewa ‘it’ na ‘him’ n’ụzọ ahụ.
