  variant: Standard Igbo
source:
  edition: SBLGNT
  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: ig
  text: Ha kparịtachara ọnụ, ha ji ego ahụ[a] zụta Ubi Ọkpụite ka ọ bụrụ ebe a na-eli ndị si mba ọzọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “site na ha”; nnọchiaha ahụ na-ezo aka ná mkpụrụ ego ọlaọcha ndị a kpọtụrụ aha n’amaokwu ndị bu ụzọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị ọbịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον ... λαβόντες
  choice: mgbe ha gbachara izu
  rationale: Akpaalaokwu Igbo a na-egosi na ha tụkọrọ uche wee kparịta ihe ha ga-eme; ọ na-eburu echiche nke ‘ịnata ndụmọdụ/ịgba izu’ dị n’asụsụ Grik n’ụzọ dị nkenke ma bụrụkwa nke e ji eme ihe n’Igbo.
- source_word: δὲ
  choice: Ya mere
  rationale: N’ebe a, δέ na-aga n’ihu n’akụkọ ma na-ejikọ mkpebi ha na ihe mere tupu ya; ‘Ya mere’ na-egosi njikọ ahụ n’Igbo eke.
- source_word: ἠγόρασαν
  choice: ha ... zụta
  rationale: ‘Zụta’ bụ okwu Igbo doro anya ma kwekọọ n’omume aorist nke ἀγοράζω.
- source_word: ἐξ αὐτῶν
  choice: ha ji ha
  rationale: ‘Ji ha’ na-egosi ihe e ji kwụọ ụgwọ ma na-edobe nnọchiaha ọtụtụ nke Grik; ihe ndị ọ na-ezo aka na ha bụ mkpụrụ ego ọlaọcha e kwuru n’amaokwu ndị bu ụzọ.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: Ubi Ọkpụite
  rationale: Nke a bụ ntụgharị dị nkenke na nke eke nke aha ubi ahụ, ebe genitive τοῦ Κεραμέως na-akọwa onye ọ bụ ma ọ bụ aha e ji mara ya.
- source_word: εἰς ταφὴν
  choice: ka ọ bụrụ ebe a na-eli
  rationale: Nkebiokwu a na-egosi nzube e ji zụta ubi ahụ, ya bụ ka e jiri ya na-eli ndị nwụrụ anwụ.
- source_word: τοῖς ξένοις
  choice: ndị mba ọzọ
  rationale: N’ọnọdụ a, ξένοις na-ezo aka ná ndị si n’èzí ma ọ bụ ndị na-abụghị ndị obodo ahụ; ‘ndị mba ọzọ’ na-eme ka nke a doo anya n’Igbo nke oge a.
theological_decisions:
- issue: Ihe nnọchiaha αὐτῶν na-ezo aka na ya
  choice: E debere nnọchiaha ahụ dịka ‘ha’ ma tinye nkọwa na ọ na-ezo aka ná mkpụrụ ego ọlaọcha.
  alternative: A pụrụ ịsụ ya ozugbo dịka ‘ego ahụ.’
  rationale: Amaokwu ndị gbara ya gburugburu na-eme ka o doo anya na ọ bụ mkpụrụ ego ọlaọcha Judas weghachiri ka a na-ekwu maka ya. Ide ‘ha’ na-echekwa ụdị okwu Grik, ebe nkọwa ala peeji na-ewepụ mgbagwoju anya n’enweghị ịgbasa ihe odide ahụ karịa mkpa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Gbachara izu’ na-enye usoro akụkọ ahụ ụda eke; ‘Ubi Ọkpụite’ ka e dere dịka aha ebe a na-amata n’akụkọ ahụ. E debere mgbagwoju nta dị na nnọchiaha Grik ma kọwaa ya n’ala peeji.
