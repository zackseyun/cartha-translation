  rationale: A dochiri okwu nwere ike igosi izu ọjọọ anya (‘gbachara izu’) anya na ‘kparịtachara ọnụ,’ nke na-agbaso Grik nke ọma. A kọwara ihe e ji zụta ubi ahụ dịka ‘ego ahụ,’ ebe onye e zoro aka na ya doro anya n’akụkụ okwu, ma debe nkọwa nke ụdị okwu Grik n’ala peeji. A hazikwara ntụgharị ξένοι ka ọ bụrụ Standard Igbo eke ma kpọmkwem.
