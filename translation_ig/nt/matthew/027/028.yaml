  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐκδύσαντες αὐτὸν ⸂χλαμύδα κοκκίνην περιέθηκαν αὐτῷ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/028.yaml
  text: And after stripping him[a], they put a scarlet cloak on him,
translation:
  language: ig
  text: Mgbe ha yipụsịrị ya uwe, ha yikwasịrị ya uwe elu na-acha uhie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “uwe mwụda uhie.” Okwu Grik ahụ nwekwara ike izo aka n'uwe mkpuchi ma ọ bụ uwe elu ọzọ a na-eyi n'elu uwe ndị ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδύσαντες
  choice: Mgbe ha yipụsịrị ya uwe
  rationale: Nkebiokwu a na-egosi na ha buru ụzọ yipụ ya uwe tupu ha eyikwasị ya nke ọzọ; nsụgharị a bụ Igbo eke ma na-echekwa usoro omume ahụ.
- source_word: χλαμύδα
  choice: uwe mwụda
  rationale: χλαμύς bụ uwe elu a na-eyikwasị n'elu uwe ndị ọzọ, ọtụtụ mgbe uwe dị mkpụmkpụ nke ndị agha ma ọ bụ ndị ọchịchị na-eyi. “Uwe mwụda” na-enye echiche uwe elu ahụ n'Igbo a na-aghọta nke ọma.
- source_word: κοκκίνην
  choice: uhie
  rationale: κόκκινος na-egosi agba uhie na-enwu enwu, ya bụ scarlet. “Uhie” bụ okwu Igbo doro anya ma ghara ịkọwa ụdị ndo agba ahụ karịa ihe ndị na-agụ akwụkwọ nkịtị ga-aghọta.
- source_word: περιέθηκαν αὐτῷ
  choice: ha yikwasịrị ya
  rationale: N'ebe a περιτίθημι na-egosi iyikwasị mmadụ uwe ma ọ bụ itinye ya n'ahụ ya; “ha yikwasịrị ya” bụ ụzọ Igbo dị nkenke ma bụrụkwa eke.
- source_word: καὶ
  choice: Mgbe
  rationale: Ọ bụ ezie na καί bụ njikọ “na,” mmekọrịta ya na aorist participle na-eme ka usoro ihe omume pụta ìhè. Ịmalite na “Mgbe” na-egosipụta njikọ ahụ n'Igbo eke n'enweghị ịgbanwe ihe ọ pụtara.
theological_decisions:
- issue: Ụdị uwe e ji kwaa Jizọs emo
  choice: uwe mwụda uhie
  alternative: uwe elu uhie
  rationale: Nhọrọ a na-echekwa echiche χλαμύς dị ka uwe a na-eyikwasị n'elu uwe ndị ọzọ, ma ọ naghị etinye nkọwa eze karịrị ihe ọnọdụ ahụ n'onwe ya na-egosi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. “Yipụsịrị ya uwe” na “yikwasịrị ya” na-eme ka ihe ndị agha mere pụta ìhè n'ụzọ eke; ihe nrịbama [a] dị n'ahịrịokwu ahụ dịka achọrọ.
