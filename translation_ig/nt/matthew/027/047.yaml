  text: τινὲς δὲ τῶν ἐκεῖ ⸀ἑστηκότων ἀκούσαντες ἔλεγον ὅτι Ἠλίαν φωνεῖ οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/047.yaml
  text: But some of those standing there[a], when they heard it, were saying[b], “This man is calling Elijah.”
translation:
  language: ig
  text: Ma ụfọdụ n’ime ndị guzo n’ebe ahụ, mgbe ha nụrụ ya, nọ na-asị, “Onye a na-akpọ Ịlaịja.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ dabara okwu Greek karịa: “Onye a na-akpọ Ịlaịja.”'
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka ndị nọ ebe ahụ ghọtahiere mkpu Jizọs dị n’amaokwu gara aga, were ya dị ka ọ na-akpọ Ịlaịja.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: ụfọdụ
  rationale: Na-egosi mmadụ ole na ole a na-akọwaghị kpọmkwem n’etiti ndị nọ ebe ahụ.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n’akụkọ ahụ mgbe ndị nọ ebe ahụ meghachiri omume n’ihe ha nụrụ.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: n’ime ndị guzo n’ebe ahụ
  rationale: Na-echekwa nkọwa doro anya banyere ndị nọ ebe ahụ nakwa ọnọdụ ha dị ka ndị guzo.
- source_word: ἀκούσαντες
  choice: mgbe ha nụrụ ya
  rationale: Na-egosi na ịnụ ahụ buru ụzọ mee tupu ha ekwuo; ‘ya’ na-anọchi anya mkpu Jizọs e kwuru n’amaokwu gara aga.
- source_word: ἔλεγον
  choice: nọ na-asị
  rationale: Na-egosipụta ọdịdị na-aga n’ihu nke imperfect Greek n’enweghị ikwubiga ugboro ole ha kwuru ya ókè.
- source_word: Ἠλίαν
  choice: Ịlaịja
  rationale: Ọ bụ ụdị aha onye amụma Elijah a na-ejikarị n’Igbo.
- source_word: φωνεῖ
  choice: na-akpọ
  rationale: Na-echekwa okwu Greek nke pụtara ịkpọ mmadụ, n’enweghị ịgbakwunye ma ọ bụ ịrịọ ka ọ bịa ma ọ bụ ịkpọku ya.
- source_word: οὗτος
  choice: Nwoke a
  rationale: Na-enye demonstrative ahụ n’Igbo nkịtị ma na-echekwa ntụaka kpọmkwem ndị na-ekwu okwu nyere Jizọs.
theological_decisions:
- issue: Ma okwu ndị nọ ebe ahụ ò kwesịrị igosi na Jizọs kpọrọ Ịlaịja n’ezie, ka ọ bụ naanị ihe ha chere na ha nụrụ
  choice: 'E dere ya dị ka okwu ha kwuru: “Nwoke a na-akpọ Ịlaịja.”'
  alternative: “Ọ na-akpọku Ịlaịja” ma ọ bụ “Ọ na-akpọ Ịlaịja ka ọ bịa.”
  rationale: Greek na-akọ ihe ndị ahụ kwuru, ọ naghị akwado na nghọta ha ziri ezi. Nsụgharị ahụ na-ahapụ mgbagwoju anya na ihe ọchị dị n’akụkọ ahụ ka ha dị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ùgwù. A họọrọ “nọ na-asị” iji gosipụta omume na-aga n’ihu, ebe “na-akpọ” na-echekwa ohere nghọta nke φωνεῖ n’enweghị ịgbakwunye nkọwa okpukpe.
