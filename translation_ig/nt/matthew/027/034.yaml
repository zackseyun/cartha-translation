  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔδωκαν αὐτῷ πιεῖν ⸀οἶνον μετὰ χολῆς μεμιγμένον· καὶ γευσάμενος οὐκ ⸀ἠθέλησεν πιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: ig
  text: Ha nyere ya mmanya a gwakọtara na mmiri ilu ka ọ ṅụọ; ma mgbe o detụrụ ya ire, ọ chọghị ịṅụ ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: Ha nyere ya ... ka ọ ṅụọ
  rationale: Nke a na-egosipụta ngwaa δίδωμι na infinitive πιεῖν n’ụzọ doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: οἶνον
  choice: mmanya
  rationale: Ọ bụ okwu Igbo nkịtị maka wine, kwekọrọ kpọmkwem n’okwu Grik.
- source_word: μετὰ χολῆς μεμιγμένον
  choice: a gwakọtara ya na ihe ilu dị ka ọnya
  rationale: μεμιγμένον pụtara ihe a gwakọtara; χολή nwere ike ịbụ ọnya/gall n’onwe ya ma ọ bụ ihe ilu n’ozuzu. Nkọwa a na-edebe ma ilu ya ma okwu ahụ kpọmkwem n’enweghị imechi nghọta ya.
- source_word: γευσάμενος
  choice: mgbe o detụrụ ya ire
  rationale: Nke a bụ ụzọ Igbo dị ndụ e si kwuo na mmadụ detụrụ ihe, ma na-egosipụta ihe mere tupu ọ jụ ịṅụ ya.
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: ọ chọghị ịṅụ ya
  rationale: θέλω metụtara ọchịchọ ma ọ bụ njikere; ‘ọ chọghị’ na-edebe echiche ahụ n’etinyeghị ike ọzọ dị ka ‘ọ jụrụ kpamkpam.’
theological_decisions:
- issue: Nkọwa χολή n’akụkọ ahụhụ Jizọs na njikọ ya na Akwụkwọ Nsọ
  choice: ihe ilu dị ka ọnya
  alternative: ọnya; ihe ilu
  rationale: χոլή nwere ike ịpụta gall/bile kpọmkwem ma ọ bụ ihe ilu n’ozuzu. Isiokwu a na-eme ka ihe ilu ahụ doo anya nye onye Igbo nke oge a, ebe ‘dị ka ọnya’ na-edebe okwu Matiu na njikọ Akwụkwọ Nsọ ya n’enweghị ịkọwa ihe ahụ karịa ihe Grik kwuru.
translation_notes:
  register: Asụsụ Igbo izugbe, dị ùgwù ma dị mfe nghọta. E jiri ‘ihe ilu dị ka ọnya’ zere okwu ‘ọnya’ naanị ya ịbụ ihe mgbagwoju anya nye ndị na-agụ Igbo ugbu a, ma ka e chekwaa obosara ihe χολή nwere ike ịpụta.
