revisions:
- from: Ha nyere ya mmanya a gwakọtara ya na ihe ilu dị ka ọnya[a] ka ọ ṅụọ; ma mgbe o detụrụ ya ire, ọ chọghị ịṅụ ya.
  to: Ha nyere ya mmanya a gwakọtara na mmiri ilu ka ọ ṅụọ; ma mgbe o detụrụ ya ire, ọ chọghị ịṅụ ya.
  rationale: The correction replaces the erroneous «ọnya» (‘wound’) with «mmiri ilu» (‘bile/gall’), a clear Standard Igbo expression that faithfully conveys χολή. The footnote preserves the possible broader sense of a bitter substance and notes, without conflating them, Matthew’s wording and Mark 15:23.
  reviewer_model: gpt-5.6-terra
