review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the giving, wine, mixing, tasting, and subsequent unwillingness to drink. However, «ọnya» means a wound/sore in Standard Igbo and cannot render χολή (‘gall,’ literally bile, or a bitter substance). The phrase «ihe ilu dị ka ọnya» therefore both introduces an incorrect comparison and fails to translate the Greek lexical item faithfully.
  naturalness: Apart from the rendering of χολή, the sentence is clear and appropriately dignified. «Mgbe o detụrụ ya ire» is a natural Igbo way to express tasting. «Mmiri ilu» is comprehensible modern Igbo for bile/gall in this context.
  terminology: Replace «ọnya» with «mmiri ilu» (bile/gall). This retains Matthew’s concrete wording while the footnote can note the broader sense ‘bitter substance.’ The proposed wording does not harmonize Matthew with Mark’s myrrh.
  issues:
  - severity: high
    issue: «ọnya» is used for χολή in both the text and footnote.
    rationale: In Standard Igbo, «ọnya» denotes a wound or sore, not gall/bile. It is consequently a false lexical equivalent and materially distorts the substance mixed with the wine.
  - severity: medium
    issue: «ihe ilu dị ka ọnya» adds a comparison not present in the Greek.
    rationale: The source states that the wine was mixed with χολή; it does not say it was mixed with a bitter thing ‘like a wound.’ Rendering χολή as «mmiri ilu» is direct and preserves the lexical reference.
  revised_text: Ha nyere ya mmanya a gwakọtara na mmiri ilu ka ọ ṅụọ; ma mgbe o detụrụ ya ire, ọ chọghị ịṅụ ya.
  revised_footnotes:
  - marker: a
    text: Okwu Grik χολή nwere ike ịpụta gall, ya bụ mmiri ilu, ma ọ bụ n’ozuzu ya, ihe ilu. Nsụgharị a ji «mmiri ilu» gosipụta okwu Matiu; tụlee akụkọ yiri nke a na Mak 15:23, ebe a kpọrọ myrrh aha.
    reason: lexical_alternative
  revision_rationale: The correction replaces the erroneous «ọnya» (‘wound’) with «mmiri ilu» (‘bile/gall’), a clear Standard Igbo expression that faithfully conveys χολή. The footnote preserves the possible broader sense of a bitter substance and notes, without conflating them, Matthew’s wording and Mark 15:23.
