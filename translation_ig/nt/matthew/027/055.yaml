source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ ἀπὸ μακρόθεν θεωροῦσαι, αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας διακονοῦσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: ig
  text: Ọtụtụ ụmụ nwanyị nọ n'ebe ahụ, na-ele anya site n'ebe dị anya[a]; ha bụ ndị soro Jizọs site na Galili, na-ejere ya ozi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ele ihe na-eme site n'ebe tere aka.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-enyere ya aka.” Okwu Grik a nwere ike ịpụta ijere mmadụ ozi n'ụzọ bara uru ma ọ bụ ịkwado ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ
  choice: nọkwa n'ebe ahụ
  rationale: “Nọ” na-egosi na ha dị n'ebe ahụ, ebe “-kwa” na-eburu njikọ dị nro nke δέ n'ebughị echiche nke nnukwu mmegide.
- source_word: γυναῖκες πολλαὶ
  choice: ọtụtụ ụmụ nwanyị
  rationale: Nke a na-echekwa ọnụ ọgụgụ na okike ndị a kpọrọ aha n'ụzọ doro anya ma bụrụ Igbo a na-asụ ugbu a.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: na-ekiri site n'ebe dị anya
  rationale: “Na-ekiri” na-egosi ilegide ihe na-eme anya ruo oge ụfọdụ; “site n'ebe dị anya” na-echekwa nkewa nke ebe ahụ.
- source_word: αἵτινες ἠκολούθησαν τῷ Ἰησοῦ
  choice: Ha bụ ndị ... soro Jizọs
  rationale: Nhazi a na-akọwapụta ndị inyom ahụ dị ka ndị soro Jizọs, n'ụzọ na-adị mfe nghọta n'Igbo.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: si Galili
  rationale: Ọ na-egosi Galili dị ka ebe ha siri malite iso Jizọs.
- source_word: διακονοῦσαι αὐτῷ
  choice: na-ejere ya ozi
  rationale: Nkebiokwu a sara mbara nke ọma iji gụnye ilekọta, inyere aka, ma ọ bụ ịkwado ya, n'emeghị ka ọ bụrụ ọkwa ọchịchị ụka.
theological_decisions:
- issue: Ụdị ọrụ ụmụ nwanyị ahụ rụrụ nye Jizọs
  choice: na-ejere ya ozi
  alternative: na-enyere ya aka
  rationale: διακονέω nwere ike ịpụta ọrụ ma ọ bụ nkwado a na-enye n'ụzọ bara uru. Nhọrọ a anaghị eme ka ihe ahụ bụrụ naanị ọrụ ụlọ ma ọ bụ ọkwa ozi nke ụka.
- issue: Oge ha malitere iso Jizọs ma e jiri ya tụnyere ebe obe ahụ
  choice: Ha bụ ndị si Galili soro Jizọs
  alternative: ndị sooro Jizọs site na Galili ruo ebe ahụ
  rationale: Aorist ahụ na-ezo aka n'iso Jizọs nke malitere tupu ọnọdụ ha nọ na ya ugbu a; Igbo anaghị achọ past perfect pụrụ iche, ya mere usoro okwu na ọnọdụ akụkọ na-eme ka mmekọrịta oge ahụ doo anya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ iji zere ogologo usoro nkebiokwu nke ga-adị arọ n'Igbo, ma e chekwara njikọ echiche na nkọwa niile dị na Grik.
