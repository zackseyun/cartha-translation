revisions:
- from: Ọtụtụ ụmụ nwanyị nọkwa n'ebe ahụ, na-ekiri site n'ebe dị anya[a]. Ha bụ ndị si Galili soro Jizọs, na-ejere ya ozi[b].
  to: Ọtụtụ ụmụ nwanyị nọ n'ebe ahụ, na-ele anya site n'ebe dị anya[a]; ha bụ ndị soro Jizọs site na Galili, na-ejere ya ozi[b].
  rationale: The revision removes the potentially over-specific additive force of -kwa, uses the natural Igbo expression “na-ele anya,” and more closely joins the women’s following Jesus from Galilee with their ongoing service to him. It preserves the source’s temporal and participial relationships without adding doctrinal or historical interpretation.
