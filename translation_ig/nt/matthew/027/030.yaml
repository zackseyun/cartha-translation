  text: καὶ ἐμπτύσαντες εἰς αὐτὸν ἔλαβον τὸν κάλαμον καὶ ἔτυπτον εἰς τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/030.yaml
  text: And after spitting on him[b][a], they took the reed and kept striking his head.
translation:
  language: ig
  text: Mgbe ha gbụsịrị ya ọnụ mmiri, ha weere mkpara amị ahụ[b] wee nọgide na-akụ ya n’isi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-akụ ya n’isi.” Ụdị imperfect nke ngwaa Grik nwere ike imesi ike na omume ahụ na-aga n’ihu ma ọ bụ na-eme ugboro ugboro.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik κάλαμος nwere ike ịpụta “amị” ma ọ bụ, site n’ịgbatị ihe ọ pụtara, mkpara e ji amị mee ma ọ bụ mkpara yiri amị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: Mgbe ha gbụsịrị ya ọnụ mmiri
  rationale: Nkebi a na-egosi ihe mere tupu ngwaa ndị bụ isi; okwu Igbo a na-egosi usoro ahụ n'ụzọ doro anya ma bụrụkwa ụzọ nkịtị e si ekwu na a gbụsara mmadụ ọnụ mmiri.
- source_word: ἔλαβον
  choice: ha weere
  rationale: Nke a bụ ntụgharị kwụ ọtọ na nke e ji eme ihe kwa ụbọchị maka omume nke iwere ihe ahụ.
- source_word: κάλαμον
  choice: mkpara amị ahụ
  rationale: κάλαμος bụ amị ma ọ bụ mkpara yiri amị. “Mkpara amị ahụ” na-ejikọ ihe a na nke e nyere Jizọs n’aka na akụkọ ahụ, ma na-echekwa ihe okwu Grik pụtara.
- source_word: ἔτυπτον
  choice: nọgidekwa na-akụ
  rationale: Ụdị imperfect nke ngwaa Grik na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro; “nọgidekwa na-akụ” na-eme ka nke a pụta ìhè n’Igbo nkịtị.
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: ya n’isi
  rationale: N’ebe a, εἰς na-egosi ebe a na-akụ ihe ahụ; “ya n’isi” bụ usoro okwu Igbo kwesịrị ekwesị.
theological_decisions:
- issue: Otu e si kọwaa mmegbu ndị agha mere Jizọs
  choice: Ikwu omume ndị ahụ n'ụzọ doro anya, gụnyere na ịkụ ya gara n’ihu.
  alternative: “Ha wee were mkpara amị ahụ na-akụ ya n’isi.”
  rationale: Akụkụ a abụghị okwu ozizi a na-arụrịta ụka, ya mere a kọwara mmechuihu na ihe ike ahụ n’enweghị ibelata ya ma ọ bụ itinye nkọwa ọzọ na-adịghị n’ihe odide Grik. A hapụrụ imperfect ka ọ gosi omume na-aga n’ihu ma ọ bụ ugboro ugboro.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Mkpara amị” na-eme ka ihe ahụ doo onye na-agụ anya, ebe “nọgidekwa na-akụ” na-echekwa omume na-aga n’ihu nke dị na ngwaa Grik.
