- from: Ozugbo ahụ, otu onye n’ime ha gbara ọsọ, were ogbo, jupụta ya na mmanya gbara ụka[a], tụkwasị ya n’ahịhịa amị, nye ya ka ọ ṅụọ.[b]
  to: Ozugbo ahụ, otu onye n’ime ha gbara ọsọ, were ogbo, jupụta ya na mmanya gbara ụka[a], tinye ya n’osisi amị, ma na-enye ya ka ọ ṅụọ[b].
  rationale: The revision retains the draft’s faithful narrative sequence and its nonsectarian rendering of ὄξος, while representing the imperfect ἐπότιζεν directly in the text. It also uses a clearer Standard Igbo expression for mounting the sponge on a reed and aligns the footnote anchors with their relevant terms.
