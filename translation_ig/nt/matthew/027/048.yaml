source:
  edition: SBLGNT
  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: ig
  text: Ozugbo ahụ, otu onye n’ime ha gbara ọsọ, were ogbo, jupụta ya na mmanya gbara ụka[a], tinye ya n’osisi amị, ma na-enye ya ka ọ ṅụọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “viniga.” Okwu Grik ὄξος nwere ike ịpụta mmanya gbara ụka ma ọ bụ viniga sitere na mmanya.
    reason: lexical_alternative
  - marker: b
    text: Ụdị ngwaa Grik a nwekwara ike ịpụta, “na-enye ya ka ọ ṅụọ” ma ọ bụ “nọgidere na-enye ya ka ọ ṅụọ.”
    reason: aspectual_ambiguity
lexical_decisions:
- source_word: εὐθέως
  choice: Ozugbo ahụ
  rationale: Na-egosi na ihe ahụ mere n’egbughị oge, n’asụsụ Igbo dị mfe ma bụrụ nke a na-asụ ugbu a.
- source_word: δραμὼν
  choice: gbara ọsọ
  rationale: Na-egosipụta ngwa ngwa na ịdị ọkụ nke omume ahụ; a tụgharịrị participle ahụ dị ka ngwaa n’usoro akụkọ Igbo.
- source_word: εἷς ἐξ αὐτῶν
  choice: otu onye n’ime ha
  rationale: Nke a bụ ụzọ Igbo doro anya si egosi na ọ bụ naanị otu onye sitere n’ìgwè ahụ.
- source_word: λαβὼν σπόγγον
  choice: were ogbo
  rationale: ‘Ogbo’ bụ okwu Igbo maka sponge; ụdị ngwaa a na-eme ka usoro omume ahụ dị mfe ma kwekọọ n’akụkọ Igbo.
- source_word: πλήσας τε ὄξους
  choice: jupụta ya na mmanya gbara ụka
  rationale: ὄξος bụ mmanya gbara ụka ma ọ bụ mmanya-vinegar; ‘mmanya gbara ụka’ na-egosi ihe ọṅụṅụ ahụ nke ọma karịa naanị ‘mmanya vinega.’
- source_word: περιθεὶς καλάμῳ
  choice: tụkwasị ya n’ahịhịa amị
  rationale: καλάμος bụ ahịhịa amị ma ọ bụ osisi amị; nsụgharị a na-edobe ihe e ji bulie ogbo ahụ n’enweghị ịkọwa ihe karịrị ederede.
- source_word: ἐπότιζεν αὐτόν
  choice: nye ya ka ọ ṅụọ
  rationale: Na-egosipụta ihe ποτίζω pụtara—ime ka mmadụ ṅụọ—ma na-anọgide bụrụ Igbo ebumpụta ụwa. Ihe imperfect nwere ike igosi omume na-aga n’ihu ma ọ bụ nke a na-anwa ime; a hapụrụ nke ahụ na ndetu.
theological_decisions:
- issue: Ụdị ihe ọṅụṅụ e nyere Jizọs
  choice: mmanya gbara ụka
  alternative: vinega
  rationale: ὄξος nwere ike ịpụta mmanya gbara ụka ma ọ bụ vinegar sitere na mmanya. ‘Mmanya gbara ụka’ na-egosi na ọ bụ ihe ọṅụṅụ acidic n’enweghị ịmanye otu nghọta ọdịnala.
- issue: Akụkụ omume nke ἐπότιζεν
  choice: nye ya ka ọ ṅụọ
  alternative: na-enye ya ka ọ ṅụọ / nọgidere na-enye ya ka ọ ṅụọ
  rationale: Imperfect ahụ nwere ike ịkọwa omume na-aga n’ihu ma ọ bụ mbọ e mere. Isi ederede ji okwu Igbo dị mfe, ebe ndetu na-echekwa nghọta aspect ahụ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugwu ma dị mfe nghọta. E ji usoro ngwaa ndị dị n’otu ahịrị mee ka eriri participle Grik bụrụ akụkọ Igbo ebumpụta ụwa, ma e chekwara mgbagwoju anya nke ὄξος na ἐπότιζεν na ndetu.
