    text: Ma ọ bụ, “ngwa ngwa.”
    reason: lexical_alternative
  revision_rationale: 'The revision supplies “wee” to form a natural, clear Igbo verb sequence while retaining the source’s temporal order: they promptly left the boat and their father, then followed him. No stronger claim about permanent familial abandonment is introduced.'
