  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: ig
  text: Ha hapụrụ ụgbọ mmiri ahụ na nna ha ozugbo, wee soro ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ngwa ngwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ha
  rationale: Isiokwu a na-ezo aka n’ụmụnne abụọ a kpọtụrụ aha n’amaokwu bu ụzọ. A hapụrụ δέ n’enweghị okwu njikọ pụrụ iche, n’ihi na n’Igbo akụkọ ahụ na-aga n’ihu nke ọma na-enweghị ya, ma a dịghị etinye echiche nke mmegide na-adịghị na Grik.
- source_word: εὐθέως
  choice: ozugbo
  rationale: “Ozugbo” bụ okwu Igbo doro anya nke na-egosi na ha emeghị oge, ma na-echekwa ngwa ngwa nke okwu Matiu ji ugboro ugboro.
- source_word: ἀφέντες
  choice: hapụrụ
  rationale: “Hapụrụ” na-egosi omume mere tupu ha esoro ya, n’enweghị ịgbakwụnye echiche siri ike na ha gbahapụrụ nna ha ruo mgbe ebighị ebi.
- source_word: τὸ πλοῖον
  choice: ụgbọ mmiri ahụ
  rationale: N’ọnọdụ a, okwu a na-ezo aka n’ụgbọ e ji egbu azụ; “ụgbọ mmiri” bụ okwu Igbo nkịtị ma doo anya.
- source_word: τὸν πατέρα αὐτῶν
  choice: nna ha
  rationale: Nke a bụ nsụgharị Igbo ebumpụta ụwa nke na-echekwa mmekọrịta ezinụlọ na ọnụ ahịa mkpebi ha mere.
- source_word: ἠκολούθησαν αὐτῷ
  choice: soro ya
  rationale: “Soro ya” na-echekwa ma echiche nke iso Jizọs jee, ma nghọta nke ịbụ ndị na-eso ụzọ ya, n’enweghị nkọwa agbakwunyere.
theological_decisions:
- issue: Nzaghachi nke ndị na-eso ụzọ na ịhapụ nna ha
  choice: 'A sụgharịrị ya dị ka omume mere ozugbo: ha hapụrụ ụgbọ ahụ na nna ha, soro Jizọs.'
  alternative: Ịsị na ha gbahapụrụ nna ha kpamkpam ruo mgbe ebighị ebi, ma ọ bụ na ha hapụrụ ya naanị nwa oge.
  rationale: ἀφέντες na-egosi ịhapụ n’ebe a, mana amaokwu ahụ ekwughị kpọmkwem ogologo oge nkewapụ ahụ ga-adị. “Hapụrụ” na-echekwa ike akụkọ ahụ n’etinyeghị nkwubi okwu karịrị ihe odide ahụ kwuru.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. Usoro okwu ahụ na-eme ka “ozugbo” metụta ịhapụ ụgbọ mmiri na nna ha, dịka participle Grik si gosi omume butere iso ya.
