id: MAT.4.10
reference: Matthew 4:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: ig
  text: 'Mgbe ahụ, Jizọs sịrị ya, “Si ebe a pụọ, Setan! N’ihi na e dere, sị: ‘Ọ bụ Onyenweanyị Chineke gị ka ị ga-efe ofufe[a], ọ bụkwa naanị ya ka ị ga-ejere ozi[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ị ga-akpọ isiala nye Onyenweanyị Chineke gị.” Ngwaa Grik ahụ pụrụ ịpụta n’ụzọ nkịtị ịkpọ isiala ma ọ bụ ihulata n’ihu onye a na-asọpụrụ.
    reason: lexical_alternative
  - marker: b
    text: Ngwaa a sụgharịrị “ijere ozi” pụrụ izo aka kpọmkwem n’ọrụ nsọ ma ọ bụ ọrụ ofufe a na-enye Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Na-egosi usoro ihe mere n’akụkọ n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: λέγει αὐτῷ
  choice: sịrị ya
  rationale: Ọ bụ ezie na Grik ji historical present mee ka akụkọ dị ndụ, oge gara aga bụ ụzọ Igbo si akọ akụkọ a n’ụzọ kachasị eke.
- source_word: Ὕπαγε
  choice: Si ebe a pụọ
  rationale: Na-egosipụta iwu siri ike ka onye ahụ pụọ, n’asụsụ Igbo nke oge a.
- source_word: Σατανᾶ
  choice: Setan
  rationale: Ụdị aha a nabatara n’Igbo maka aha/utu aha onye iro ahụ.
- source_word: γέγραπται
  choice: e dere ya
  rationale: Na-echekwa usoro okwu a na-eji webata ihe e dere n’Akwụkwọ Nsọ.
- source_word: Κύριον τὸν θεόν σου
  choice: Onyenwe anyị Chineke gị
  rationale: Na-egosipụta κύριος dị ka aha nsọ a maara nke ọma n’Igbo, ebe ‘Chineke gị’ nọ n’otu apposition ahụ.
- source_word: προσκυνήσεις
  choice: ị ga-efe ofufe
  rationale: N’ebe a ọ pụtara ofufe e nyere Chineke; okwu a bụ nke eke ma doo ndị na-agụ Igbo anya.
- source_word: αὐτῷ μόνῳ
  choice: ọ bụkwa naanị ya
  rationale: Usoro a na-eme ka nkwusi okwu Grik banyere naanị Chineke ịbụ onye a ga-ejere ozi pụta ìhè.
- source_word: λατρεύσεις
  choice: ị ga-ejere ozi
  rationale: Na-edobe ọdịiche dị n’etiti προσκυνέω na λατρεύω, ma ihe odide ala peeji kọwara na ozi a nwere nghọta nke ọrụ nsọ.
theological_decisions:
- issue: Idobe ọdịiche dị n’etiti προσκυνέω na λατρεύω
  choice: “ife ofufe” maka προσκυνήσεις na “ijere ozi” maka λατρεύσεις
  alternative: Ịsụgharị ha abụọ n’okwu ofufe, ma ọ bụ iji “ịkpọ isiala” maka προσκυνήσεις
  rationale: Grik ji ngwaa abụọ yiri ibe ha ma dị iche. Nsụgharị a na-echekwa ma ofufe ma ọrụ e nyere naanị Chineke, n’etinyeghị nkọwa okwukwe karịrị ihe ederede kwuru.
- issue: Nkwusi okwu nke αὐτῷ μόνῳ
  choice: “ọ bụkwa naanị ya ka ị ga-ejere ozi”
  alternative: “ị ga-ejere ya naanị ozi”
  rationale: Ụdị a na-egosi nke ọma na ‘naanị’ na-akọwa onye a na-ejere ozi—ya bụ, naanị Chineke—ọ bụghị ụdị ozi ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji “sịrị” kama historical present mee ka usoro akụkọ bụrụ nke eke n’Igbo; e dokwara nkwusi okwu ‘naanị ya’ anya.
