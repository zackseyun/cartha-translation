id: MAT.4.11
reference: Matthew 4:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: ig
  text: Mgbe ahụ, ekwensu hapụrụ ya. Ma lee, ndị mmụọ ozi bịara na-ejere ya ozi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị mmụọ ozi bịara jeere ya ozi.” Ngwaa Grik ahụ nwere ike ịpụta “jeere ozi” ma ọ bụ “na-ejere ozi”; ụdị imperfect ya na-egosi na omume ahụ nọ na-aga n’ihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe sochiri ihe mere tupu ya, ma bụrụkwa njikọ akụkọ sitere n’okike n’Igbo.
- source_word: ἀφίησιν
  choice: hapụrụ
  rationale: Ọ bụ ngwaa dị n’ụdị ugbu a e ji akọ ihe gara aga na Grik; oge gara aga dabara n’akụkọ Igbo, ebe ihe ọ pụtara n’ebe a bụ na ekwensu siri n’ebe Jizọs nọ pụọ.
- source_word: ὁ διάβολος
  choice: ekwensu
  rationale: N’akụkọ ọnwụnwa a, okwu ahụ bụ aha a maara e ji ekwu banyere Setan; ‘ekwensu’ doro ndị na-agụ Igbo anya karịa nsụgharị nkịtị dịka ‘onye nkwutọ.’
- source_word: ἰδοὺ
  choice: lee
  rationale: Ọ na-akpọ uche onye na-agụ ka ọ hụ ihe mberede na ihe dị mkpa na-esote, ma na-edobe ike okwu Grik ahụ.
- source_word: ἄγγελοι
  choice: ndị mmụọ ozi
  rationale: Ihe ndị dị n’eluigwe ka a na-ekwu maka ha n’ebe a, ya mere okwu Igbo a doro anya karịa ‘ndị ozi’ n’ozuzu ya.
- source_word: προσῆλθον
  choice: bịara
  rationale: Ọ na-egosi na ha bịakwutere Jizọs; ‘bịara’ dị nkenke ma bụrụ okwu akụkọ Igbo sitere n’okike.
- source_word: διηκόνουν
  choice: na-ejere ya ozi
  rationale: Ụdị imperfect nke Grik na-egosi omume na-aga n’ihu; ‘na-ejere ya ozi’ na-echekwa akụkụ ahụ ma na-egosikwa nlekọta ha nyere ya.
- source_word: αὐτῷ
  choice: ya
  rationale: Ọ bụ nnọchiaha dative na-egosi na Jizọs bụ onye ọrụ ndị mmụọ ozi ahụ ruru.
theological_decisions:
- issue: Nsụgharị διάβολος dịka aha onye ahụ na-anwa Jizọs
  choice: ekwensu
  alternative: onye nkwutọ
  rationale: Ọ bụ ezie na okwu Grik ahụ nwere ike ịpụta ‘onye nkwutọ,’ n’akụkọ a ọ bụ aha a na-akpọ Setan. ‘Ekwensu’ na-eme ka onye a na-ekwu maka ya doo anya n’etinyeghị nkọwa ozizi ọzọ.
- issue: Ụdị ọrụ ndị mmụọ ozi nyere Jizọs
  choice: na-ejere ya ozi
  alternative: jeere ya ozi
  rationale: Nsụgharị ahọrọla adịghị akọwa kpọmkwem ụdị enyemaka ahụ karịa ihe Grik kwuru, ma ọ na-echekwa echiche nke omume nọ na-aga n’ihu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E kewara ahịrịokwu ahụ ụzọ abụọ iji mee ka akụkọ ahụ na ‘Ma lee’ daa nke ọma n’Igbo, ebe a ka na-echekwa usoro na ịdị ndụ nke Grik.
