  source_fidelity: 'Nsụgharị ahụ na-anọchi anya usoro na ihe okwu Grik pụtara nke ọma: «Mgbe ahụ» maka τότε, «ekwensu hapụrụ ya» maka ἀφίησιν αὐτόν, «Ma lee» maka καὶ ἰδού, na «ndị mmụọ ozi bịara na-ejere ya ozi» maka ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ. «Na-ejere ya ozi» na-echekwa echiche imperfect nke ọrụ na-aga n’ihu, n’etinyeghị nkọwa ọzọ banyere ụdị ozi ahụ.'
