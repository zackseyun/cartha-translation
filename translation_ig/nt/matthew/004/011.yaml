  terminology: «Ekwensu» dabara n’ọrụ ὁ διάβολος dịka aha onye a maara n’akụkọ ọnwụnwa ahụ. «Ndị mmụọ ozi» bụ okwu doro anya maka ἄγγελοι n’ọnọdụ a. «Jeere ozi»/«na-ejere ozi» na-enye nhọrọ nkịtị kwesịrị ekwesị maka διακονέω.
