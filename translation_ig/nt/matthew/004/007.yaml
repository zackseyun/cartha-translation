    text: A pụkwara ịsụgharị ya n’ụzọ dị mfe, “Anwala Onyenwe Chineke gị.” Ngwaa Grik ἐκπειράζω nwere ike ịpụta “ịnwale” ma ọ bụ “itinye n’ule.”
    reason: lexical_alternative
  - marker: b
    text: Nke a hotara Diuterọnọmi 6:16. “Onyenwe” n’asụsụ Grik na-agbaso Septuagint, bụ́ nsụgharị Grik nke Akwụkwọ Nsọ Hibru, nke ji okwu a sụgharịa aha Chineke.
    reason: cross_reference
  revision_rationale: The revision corrects the singular possessive required by σου while retaining the established Igbo rendering of κύριος and the citation’s formal register. It also makes the explanatory footnote historically precise without imposing a theological interpretation.
