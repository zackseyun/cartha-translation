  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: ig
  text: 'Jizọs sịrị ya, “E dekwara ya[b], sị: ‘Etinyela Onyenwe Chineke gị n’ule[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ dị mfe, “Anwala Onyenwe Chineke gị.” Ngwaa Grik ἐκπειράζω nwere ike ịpụta “ịnwale” ma ọ bụ “itinye n’ule.”
    reason: lexical_alternative
  - marker: b
    text: Nke a hotara Diuterọnọmi 6:16. “Onyenwe” n’asụsụ Grik na-agbaso Septuagint, bụ́ nsụgharị Grik nke Akwụkwọ Nsọ Hibru, nke ji okwu a sụgharịa aha Chineke.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jizọs sịrị ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi webata okwu Jizọs gwara onye ahụ, n’agbakwụnyeghị ike okwu na-adịghị na Grik.
- source_word: Πάλιν γέγραπται
  choice: E dekwara ya
  rationale: “Dekwara” na-egosipụta echiche nke πάλιν, ya bụ na e nwere ihe ọzọ e dere; usoro a na-agụkwa nke ọma dị ka okwu eji ewebata amaokwu Akwụkwọ Nsọ.
- source_word: Οὐκ ἐκπειράσεις
  choice: Etinyela … n’ule
  rationale: Ụdị iwu a na-asọ ihe na Grik ka e ji iwu n’asụsụ Igbo sụgharịa. “Itinye … n’ule” na-egosipụta echiche nke ịnwale onye iji hụ ihe ọ ga-eme.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị asụgharị κύριος mgbe ọ na-ezo aka n’ebe Chineke nọ, ma ọ na-edobe nsọpụrụ na ụda ọgbụgba ndụ dị n’amaokwu ahụ.
- source_word: τὸν θεόν σου
  choice: Chineke gị
  rationale: Nke a na-egosipụta nke ọma na n’ụzọ Igbo ebumpụta ụwa na ọ bụ Chineke nke onye a na-agwa okwu.
theological_decisions:
- issue: Otú e si asụgharị κύριος n’amaokwu Akwụkwọ Nsọ nke na-ezo aka n’ebe Chineke Izrel nọ
  choice: Onyenwe anyị
  alternative: Yahweh
  rationale: Ihe odide Grik nwere κύριος, ọ bụghị aha Hibru ahụ n’onwe ya. Ya mere, isi ederede na-edobe “Onyenwe anyị,” ebe nkọwa ala peeji na-akọwa ndabere nke aha Chineke.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. Usoro “E dekwara ya, sị” na-ejigide ụda amaokwu Akwụkwọ Nsọ n’enweghị asụsụ ochie siri ike; “Etinyela … n’ule” na-egosipụta echiche ngwaa Grik karịa nanị “anwala.”
