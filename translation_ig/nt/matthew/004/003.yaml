id: MAT.4.3
reference: Matthew 4:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: ig
  text: Onye ọnwụnwa ahụ bịakwutere ya, sị ya, “Ọ bụrụ na[a] ị bụ Ọkpara Chineke, gwa nkume ndị a ka ha ghọọ achịcha[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ebe ị bụ Ọkpara Chineke.” Okwu ọnọdụ a n’asụsụ Grik nwere ike ịbụ okwu ịma aka, ọ bụghị naanị okwu na-egosi obi abụọ.
    reason: alternative_reading
  - marker: b
    text: N’asụsụ Grik, “achịcha” dị n’ụdị ọtụtụ, ya bụ, “ogbe achịcha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: bịakwutere ya
  rationale: Nke a na-egosi na onye ọnwụnwa ahụ bịara nso Jizọs; ọ na-ejikọta omume a n'ụzọ ebumpụta ụwa na ‘sị ya.’
- source_word: ὁ πειράζων
  choice: Onye ọnwụnwa ahụ
  rationale: Participul a ji dị ka aha na-akọwa onye na-anwa Jizọs ọnwụnwa. Nhọrọ a dabara n'okwu a ma ghara ime ka ọ bụrụ naanị onye na-ele ule.
- source_word: εἶπεν αὐτῷ
  choice: sị ya
  rationale: Nke a bụ ụzọ Igbo dị mkpirikpi ma bụrụkwa nke ebumpụta ụwa isi kwuo ‘ọ gwara ya okwu.’
- source_word: Εἰ
  choice: Ọ bụrụ na
  rationale: Ọ na-edobe usoro ọnọdụ dị n'okwu Grik ma hapụ ka okwu ahụ nwee ike ịbụ ma ajụjụ ịma aka ma okwu na-egosi obi abụọ.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: N'ọnọdụ a, okwu ahụ bụ utu aha pụrụ iche e ji amata Jizọs, ọ bụghị nanị otu nwa n'etiti ụmụ Chineke.
- source_word: εἰπὲ ἵνα
  choice: gwa ... ka
  rationale: Usoro Igbo a na-egosi ihe e nyere iwu ka o mee n'ụzọ doro anya, na-etinyeghị okwu siri ike karịa ngwaa Grik λέγω.
- source_word: οἱ λίθοι οὗτοι
  choice: nkume ndị a
  rationale: Ọ na-edobe ma ihe a na-ekwu maka ya, bụ nkume, ma nrụtụ aka ‘ndị a.’
- source_word: ἄρτοι
  choice: achịcha
  rationale: ‘Achịcha’ bụ okwu Igbo ebumpụta ụwa maka ihe oriri a; ọ naghị agbanwe ọdịdị iji gosi ọtụtụ, ebe nnọchiaha ‘ha’ na-egosi na nkume ndị ahụ niile ka a na-ekwu maka ha.
- source_word: γένωνται
  choice: ha ghọọ
  rationale: Ọ na-enye echiche γίνομαι nke ịbụ ma ọ bụ ịghọ ihe ọzọ n'ụzọ kpọmkwem ma doo anya.
theological_decisions:
- issue: Ike nke okwu ọnọdụ Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Ọ bụrụ na ị bụ Ọkpara Chineke
  alternative: Ebe ị bụ Ọkpara Chineke
  rationale: ‘Ọ bụrụ na’ na-edobe ụdị okwu Grik ma ghara ikpebi ma onye ọnwụnwa ahụ nwere obi abụọ, na-enye nkwenye, ma ọ bụ na-ama Jizọs aka.
- issue: Utu aha Kraịst υἱὸς τοῦ θεοῦ
  choice: Ọkpara Chineke
  alternative: otu nwa Chineke
  rationale: N'akụkọ Matiu, nke a bụ utu aha e ji amata Jizọs n'ụzọ pụrụ iche; nsụgharị ahụ anaghị eme ka ọ bụrụ nanị onye so n'otu ìgwè.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. ‘Sị ya’ na ‘gwa ... ka’ na-eme ka ahịrịokwu ahụ daa nke ọma n'Igbo, ebe ‘Ọkpara Chineke’ na-edobe ịdị arọ nke utu aha ahụ.
