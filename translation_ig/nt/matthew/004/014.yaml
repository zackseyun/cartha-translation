  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: ig
  text: 'ka e wee mezuo ihe e kwuru site n’aka Aịsaịa, onye amụma, sị:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro Igbo a na-egosi nzube ma ọ bụ ihe si n’omume ahụ pụta, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: πληρωθῇ
  choice: mezuo
  rationale: “Mezuo” na-echekwa echiche nke imezu okwu Akwụkwọ Nsọ; nhazi “wee mezuo” na-egosikwa na ihe ahụ bụ ihe e mere ka o zuo oke n’enweghị ịgbasa nkọwa ya.
- source_word: τὸ ῥηθὲν
  choice: okwu ahụ e kwuru
  rationale: Nke a na-asụgharị participle ahụ e ji dịka aha n’ụzọ doro anya ma bụrụkwa Igbo eke.
- source_word: διὰ
  choice: site n’ọnụ
  rationale: N’ebe a διά na-egosi onye Chineke si n’aka ya kwuo okwu. “Site n’ọnụ” bụ akpaalaokwu Igbo doro anya nke na-echekwa ọrụ Aịsaịa dịka onye mgbasa ozi, ọ bụghị isi mmalite nke okwu ahụ.
- source_word: Ἠσαΐου
  choice: Aịsaịa
  rationale: Nke a bụ ụdị aha onye amụma ahụ a maara nke ọma n’Igbo, dabere n’ụdị aha Grik dị n’ebe a.
- source_word: τοῦ προφήτου
  choice: onye amụma
  rationale: E debere aha ọrụ Aịsaịa kpọmkwem dịka ederede Grik si mee.
- source_word: λέγοντος
  choice: 'sị:'
  rationale: “Sị:” bụ ụzọ Igbo dị mkpirikpi ma bụrụkwa nke eke iji webata okwu a ga-ehota ozugbo; ọ na-edobe ọrụ participle ahụ n’okwu.
theological_decisions:
- issue: Usoro okwu Matiu ji egosi mmezu amụma
  choice: “wee mezuo”
  alternative: “wee bụrụ eziokwu”
  rationale: “Mezuo” na-echekwa njikọ pụrụ iche Matiu na-eme n’etiti ihe mere na okwu Akwụkwọ Nsọ, ebe “bụrụ eziokwu” nwere ike ime ka echiche ahụ dị larịị ma tufuo isiokwu mmezu amụma.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. “Site n’ọnụ” bụ akpaalaokwu a na-aghọta nke ọma ma na-egosi na Aịsaịa bụ onye e si n’aka ya kwuo okwu. E tinyereghị akara nkọwa ala peeji n’ihi na amaokwu a achọghị ya.
