id: MAT.4.6
reference: Matthew 4:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: ig
  text: 'Ọ sịrị ya, “Ọ bụrụ na ị bụ Ọkpara Chineke, si n’elu tụda onwe gị[a], n’ihi na e dere, sị: ‘Ọ ga-enye ndị mmụọ ozi ya iwu banyere gị,’ na, ‘Ha ga-ebuli gị n’aka ha[b], ka ị ghara ịkụ ụkwụ gị n’otu nkume.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ọdịnala karị, “wụtuo onwe gị n’ala.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ha ga-ebu gị n’aka ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ọ sịrị
  rationale: Oge ugbu a nke Grik na-arụ ọrụ dị ka historical present n’akụkọ a; oge gara aga bụ ụzọ Igbo kachasị dịrị ndụ isi kọọ ya.
- source_word: Εἰ
  choice: Ọ bụrụ na
  rationale: Nke a na-edobe ya dị ka okwu ịma aka, n’enweghị ikweta ọnọdụ ahụ tupu oge eruo.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: N’ọnọdụ akụkọ Matiu, nke a bụ aha e ji amata Jizọs, ọ bụghị nanị ịkpọ ya otu nwa n’etiti ọtụtụ ụmụ Chineke.
- source_word: βάλε σεαυτὸν κάτω
  choice: tụda onwe gị n’ala
  rationale: Nke a bụ Igbo doro anya ma dị ugbu a maka iwu ka mmadụ tụda onwe ya site n’ebe dị elu.
- source_word: γέγραπται
  choice: e dere
  rationale: Ọ bụ usoro Igbo a na-ejikarị ewebata ihe e dere n’Akwụkwọ Nsọ, ma na-edobe ịdịgide nke ihe ahụ e dere.
- source_word: ἐντελεῖται
  choice: Ọ ga-enye ... iwu
  rationale: Nke a na-egosipụta inye iwu nwere ikike dịka ngwaa Grik si kwuo.
- source_word: περὶ σοῦ
  choice: banyere gị
  rationale: Ọ na-esochi kpọmkwem echiche nke περί na genitive, na-enweghị ime ka ọ bụrụ naanị ‘maka gị.’
- source_word: ἐπὶ χειρῶν ἀροῦσίν σε
  choice: Ha ga-eji aka ha bulie gị elu
  rationale: Okwu a bụ Igbo eke nke na-edobe ihe atụ nke ndị mmụọ ozi iji aka ha kwado ma bulie onye ahụ.
- source_word: μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου
  choice: ka ị ghara ịkụ ụkwụ gị na nkume
  rationale: Nke a na-egosipụta ebumnuche igbochi ihe ọjọọ ahụ ma na-edobe ụkwụ n’otu na nkume na-enweghị article dị ka ihe a na-akọghị kpọmkwem.
theological_decisions:
- issue: Ike aha ‘Ọkpara Chineke’ n’okwu ọnwụnwa ahụ
  choice: Ọkpara Chineke
  alternative: nwa Chineke
  rationale: ‘Ọkpara Chineke’ na-arụ ọrụ dị ka aha a maara nke ọma n’akụkọ Matiu. Ọ na-edobe ike Kraịst nke okwu ahụ n’enweghị itinye nkọwa ozizi ọzọ.
- issue: Ekwensu na-ehota Abụ Ọma 91
  choice: E debere okwu ahụ dịka ihe Ekwensu kwuru site n’Akwụkwọ Nsọ
  alternative: Itinye nkọwa ma ọ bụ mmezi n’ime isiokwu amaokwu ahụ
  rationale: Amaokwu ahụ n’onwe ya na-egosi Ekwensu ka ọ na-ehota Akwụkwọ Nsọ; nsụgharị ekwesịghị idozi ma ọ bụ kọwaa arụmụka ya n’ime okwu a sụgharịrị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke doro anya ma nwee nsọpụrụ. Ahịrịokwu ahụ na-agụ nke ọma n’olu, na-edobekwa ụdị okwu Akwụkwọ Nsọ n’enweghị okwu ochie na-adịghị mkpa. Akara nkọwa [a] na [b] dị n’isiokwu ahụ n’ebe okwu ha na-akọwa dị.
