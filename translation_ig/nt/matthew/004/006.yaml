  to: 'Ọ sịrị ya, “Ọ bụrụ na ị bụ Ọkpara Chineke, si n’elu tụda onwe gị[a], n’ihi na e dere, sị: ‘Ọ ga-enye ndị mmụọ ozi ya iwu banyere gị,’ na, ‘Ha ga-ebuli gị n’aka ha[b], ka ị ghara ịkụ ụkwụ gị n’otu nkume.’”'
  rationale: The revision clarifies the explicit downward force of κάτω and renders ἐπὶ χειρῶν more directly as ‘n’aka ha.’ It otherwise retains the draft’s faithful conditional challenge, established title ‘Ọkpara Chineke,’ Scripture-introduction formula, quoted wording, and ambiguity-free singular ‘ụkwụ.’
