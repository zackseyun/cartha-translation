  text: Ἀκούσας ⸀δὲ ὅτι Ἰωάννης παρεδόθη ἀνεχώρησεν εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/012.yaml
  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: ig
  text: Mgbe ọ nụrụ na e nyefewo Jọn[a], ọ wezugara onwe ya gaa Galili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ kapịrị ọnụ n'ọnọdụ a, “e jidewo Jọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: Mgbe ọ nụrụ
  rationale: Aorist participle a na-arụ ọrụ oge n'ebe ngwaa bụ isi nọ. Nke a bụ Igbo dị mfe ma na-egosi na ịnụ ihe ahụ bu ụzọ tupu ọ wezuga onwe ya.
- source_word: δὲ
  choice: E gosighị ya site n'okwu pụrụ iche
  rationale: N'ebe a δὲ bụ njikọ akụkọ dị nro, ọ bụghị nnukwu mmegide. Usoro ahịrịokwu Igbo na mgbanwe akụkọ gbara ya gburugburu na-egosi ọrụ ahụ nke ọma n'etinyeghị “ma” nke nwere ike ime ka mmegide sie ike karịa Grik.
- source_word: παρεδόθη
  choice: e nyefewo
  rationale: Ụdị nnara nke παραδίδωμι nwere echiche sara mbara nke inyefe mmadụ n'aka ndị ọzọ. “E nyefewo” na-edobe obosara ahụ ma ghara ime ka ọ bụrụ naanị okwu teknụzụ maka njide.
- source_word: ἀνεχώρησεν
  choice: ọ wezugara onwe ya
  rationale: Nke a na-egosi ịpụ ma ọ bụ iwezụga onwe ya n'ihi ọnọdụ, n'ekwughị na ọ gbara ọsọ n'ụjọ.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: gaa Galili
  rationale: “Gaa” na-egosi ntụziaka na mmegharị ruo Galili n'Igbo ebumpụta ụwa.
- source_word: Ἰωάννης
  choice: Jọn
  rationale: Ọ bụ ụdị aha a na-ejikarị eme ihe n'Igbo maka Ἰωάννης.
theological_decisions:
- issue: Otú e si sụgharị παραδίδωμι gbasara Jọn
  choice: e nyefewo
  alternative: e jidewo
  rationale: Okwu Grik ahụ sara mbara karịa naanị ijide mmadụ, ma ọ nwekwara ike ibu echiche nke inyefe mmadụ n'aka ikike. Isi ederede na-edobe obosara a; nkọwa ala peeji na-enye ihe okwu ahụ pụtara kpọmkwem n'ọnọdụ a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta, dee ya. “Ọ wezugara onwe ya” na-edobe ntakịrị echiche nke ἀναχωρέω karịa “ọ gara,” ebe “e nyefewo” na-echekwa obosara παραδίδωμι. Akara nkọwa [a] dị n'isi ederede.
