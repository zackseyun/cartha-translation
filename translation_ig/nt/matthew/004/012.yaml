  source_fidelity: The rendering accurately preserves the temporal aorist participle ('Mgbe ọ nụrụ'), the passive and deliberately broad sense of παρεδόθη ('e nyefewo Jọn'), and the responsive nuance of ἀνεχώρησεν ('ọ wezugara onwe ya'). 'gaa Galili' naturally expresses εἰς τὴν Γαλιλαίαν. The mild connective δέ is acceptably left implicit in idiomatic Igbo.
