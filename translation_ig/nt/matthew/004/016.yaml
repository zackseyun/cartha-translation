id: MAT.4.16
reference: Matthew 4:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: ig
  text: Ndị mmadụ ndị nọ ọdụ n’ọchịchịrị hụrụ nnukwu ìhè; ìhè wee wara n’ahụ ndị nọ ọdụ n’ógbè na n’onyinyo ọnwụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oké ọchịchịrị.” E debere “onyinyo ọnwụ” n’amaokwu ahụ n’ihi na Grik kpọrọ “ọnwụ” aha hoo haa, okwu ahụ na-ekwughachikwa ihe oyiyi a maara nke ọma na Baịbụl.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: Ndị ahụ
  rationale: Nke a na-egosi otu ìgwè mmadụ n'ụzọ dị mfe ma kwekọọ n'ahịrịokwu Igbo; ọ naghị etinye echiche nke mba ma ọ bụ agbụrụ n'amaokwu ahụ.
- source_word: καθήμενος / καθημένοις
  choice: nọ ọdụ
  rationale: Ọ na-echekwa ihe oyiyi nke ịnọdụ ala na usoro yiri ibe ya nke dị n'amaokwu Grik, kama ịgbanwe ya ka ọ bụrụ naanị 'bi.'
- source_word: σκοτίᾳ
  choice: ọchịchịrị
  rationale: Nke a bụ okwu Igbo nkịtị nke nwere ike ịpụta ọchịchịrị n'ezie ma ọ bụ n'ụzọ ihe atụ, n'ebughị ụzọ kọwaa ụdị ọchịchịrị ahụ.
- source_word: φῶς εἶδεν μέγα
  choice: hụrụ nnukwu ìhè
  rationale: Ọ na-echekwa usoro na ike nke okwu Grik, ma bụrụkwa Igbo doro anya na nke sitere n'okike.
- source_word: χώρᾳ
  choice: ala
  rationale: N'okwu a, 'ala' na-enye echiche nke ebe ma ọ bụ ógbè n'ụzọ dị nkenke ma na-adabara asụsụ amụma ahụ.
- source_word: σκιᾷ θανάτου
  choice: onyinyo ọnwụ
  rationale: Ọ na-echekwa θανάτου, 'ọnwụ,' na ihe oyiyi Baịbụl nke onyinyo kama ịtụgharị ya naanị dị ka oké ọchịchịrị.
- source_word: ἀνέτειλεν
  choice: wara
  rationale: A na-eji 'ìhè wara' ekwu n'Igbo na ìhè apụtala ma malite inwu; ọ na-echekwa ihe oyiyi nke ìhè na-abịa dị ka chi na-abọ.
- source_word: αὐτοῖς
  choice: ndị ahụ
  rationale: A kọwapụtara ndị ìhè ahụ wara n'ahịrịokwu nke abụọ, nke na-eme ka ndị natara ìhè pụta ìhè n'Igbo.
theological_decisions:
- issue: Ụdị ihe ọchịchịrị na ìhè na-anọchi anya ya
  choice: E chekwara ihe oyiyi nke ọchịchịrị na ìhè n'akọwaghị ya ọzọ.
  alternative: Ịkọwa ọchịchịrị dịka mmehie ma ọ bụ amaghị ihe, ma ọ bụ ịkpọ ìhè ahụ Mesaịa ma ọ bụ nzọpụta kpọmkwem.
  rationale: Amaokwu Grik ahụ nwere ihe oyiyi amụma sara mbara, ma n'ahịrịokwu a ọ kọwaghị kpọmkwem ihe ọchịchịrị na ìhè pụtara. Nsụgharị ahụ anaghị egbochi ọtụtụ nghọta ziri ezi nke okwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E jigidere usoro ihe oyiyi abụọ ahụ—ịnọ ọdụ n'ọchịchịrị na ịnọ ọdụ n'ala na onyinyo ọnwụ—ma mee ka ahịrịokwu ahụ daa nke ọma n'Igbo.
