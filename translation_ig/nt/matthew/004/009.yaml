id: MAT.4.9
reference: Matthew 4:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀εἶπεν αὐτῷ· Ταῦτά ⸂σοι πάντα⸃ δώσω, ἐὰν πεσὼν προσκυνήσῃς μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: ig
  text: Ọ sịrị ya, “Aga m enye gị ihe ndị a niile ma ọ bụrụ na ị daa n’ala fee m ofufe[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ị kpọọ m isiala” ma ọ bụ “ị nye m nsọpụrụ.” Ngwaa Grik a nwere ike ịpụta ịkpọ isiala ma ọ bụ inye nsọpụrụ, ma n'ebe a, ihe gbara okwu ahụ gburugburu na-akwado “fee m ofufe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ọ
  rationale: N'Igbo, ịmalite ahịrịokwu a ozugbo site n'isiokwu na-eme ka akụkọ na-aga were were; njikọ ahụ dị n'usoro akụkọ gbara ya gburugburu, ya mere itinye “Ma” ma ọ bụ “Mgbe ahụ” nwere ike ịgbakwunye nghọta na-adịghị n'okwu Grik ahụ.
- source_word: εἶπεν αὐτῷ
  choice: Ọ sịrị ya
  rationale: Nke a na-edobe nnọchiaha abụọ dị n'okwu Grik, ghara ịtinye aha ndị a na-akpọghị n'ahịrịokwu a.
- source_word: Ταῦτά σοι πάντα
  choice: ihe ndị a niile ... gị
  rationale: “Ihe ndị a niile” na-edobe ọtụtụ nke Ταῦτά na ike nchịkọta nke πάντα; “gị” bụ onye a ga-enye ha.
- source_word: δώσω
  choice: Aga m enye
  rationale: Ọ bụ nkwa ma ọ bụ onyinye e kwuru n'ụdị ọdịnihu; “aga m enye” bụ Igbo doro anya ma kwekọọ na ya.
- source_word: ἐὰν
  choice: ma ọ bụrụ na
  rationale: Ọ na-egosi ọnọdụ a ga-emezu tupu e nye onyinye ahụ.
- source_word: πεσὼν
  choice: ị daa n’ala
  rationale: Nke a na-edobe ihe ahụ mmadụ ji ahụ́ eme—ịda n'ala—nke participle Grik ahụ kwuru, kama iwepụ ya n'ime echiche ofufe naanị.
- source_word: προσκυνήσῃς μοι
  choice: fee m ofufe
  rationale: N'ọnọdụ ọnwụnwa a na azịza Jizọs n'amaokwu na-esote, okwu ahụ nwere ibu nke ofufe okpukpe. Nsụgharị a na-egosi nke ahụ, ebe nkọwa ala peeji na-edobe nghọta ndị ọzọ okwu Grik ahụ nwere ike inwe.
theological_decisions:
- issue: Otu a ga-esi sụgharịa προσκυνέω n'ihe Setan chọrọ n'aka Jizọs
  choice: fee m ofufe
  alternative: kpọọrọ m isiala; nye m nsọpụrụ
  rationale: Ọnọdụ ọnwụnwa ahụ na okwu banyere ofufe kwesịịrị naanị Chineke n'amaokwu na-esote na-akwado “fee m ofufe.” Ma ebe ngwaa Grik ahụ nwekwara ike ịpụta ịkpọ isiala ma ọ bụ inye onye nsọpụrụ, e debere nghọta ndị ahụ na nkọwa ala peeji kama ihichapụ obosara okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. “Ị daa n’ala” na-edobe mmegharị ahụ́ e kwuru n'isi mmalite, ebe “fee m ofufe” na-egosi ibu okpukpe nke arịrịọ ahụ.
