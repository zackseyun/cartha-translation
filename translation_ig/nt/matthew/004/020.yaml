id: MAT.4.20
reference: Matthew 4:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ εὐθέως ἀφέντες τὰ δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: ig
  text: Ha hapụrụ ụgbụ ndị ahụ ozugbo, soro ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: (ejighị okwu pụrụ iche sụgharịa ya)
  rationale: N'ebe a, δέ bụ njikọ dị nro na-aga n'ihu n'akụkọ. Usoro ahịrịokwu Igbo na njikọta site na rikoma na-egosi nke a nke ọma; ịgbakwunye “ma” nwere ike iweta nghọta nke esemokwu na-adịghị n'okwu Grik.
- source_word: εὐθέως
  choice: ozugbo
  rationale: “Ozugbo” bụ okwu Igbo doro anya ma bụrụkwa nke a na-eji eme ihe ugbu a iji gosi na ha mere ihe ahụ n'egbughị oge.
- source_word: ἀφέντες
  choice: hapụrụ
  rationale: 'N’agbanyeghị na ọ bụ participle aorist, ọ na-egosi omume mere tupu isi ngwaa ahụ: ha buru ụzọ hapụ ụgbụ, mesịa soro ya. “Hapụrụ” na-ekwupụta nke a n''Igbo nkịtị n''enweghị ime ka ọ sie ike dịka “gbahapụrụ.”'
- source_word: τὰ δίκτυα
  choice: ụgbụ ndị ahụ
  rationale: “Ụgbụ ndị ahụ” na-edobe article Grik ma na-ezo aka n'ụgbụ e kwuru okwu ha n'ọnọdụ akụkọ ahụ, n'etinyeghị “nke ha” ma ọ bụ “ịkụ azụ” nke na-adịghị n'okwu ahụ kpọmkwem.
- source_word: ἠκολούθησαν αὐτῷ
  choice: soro ya
  rationale: “Soro ya” nwere ike ịpụta iso mmadụ gawa ma ọ bụ ịghọ onye na-eso ụzọ ya; ya mere ọ na-edobe ma nghọta mmegharị nkịtị ma nghọta ịbụ onye na-eso ụzọ dị n'ọnọdụ Oziọma ahụ.
theological_decisions:
- issue: Nghọta ịbụ onye na-eso ụzọ dị na ἠκολούθησαν αὐτῷ
  choice: soro ya
  alternative: gara n'azụ ya
  rationale: '“Soro ya” na-edobe obosara nke ngwaa ahụ: ọ pụrụ ịkọwa iso Jizọs gawa n''ụzọ nkịtị ma n''otu oge ahụ gosi njikọ nke ịbụ ndị na-eso ụzọ ya, n''etinyeghị nkọwa ozizi karịrị ihe ederede kwuru.'
translation_notes:
  register: Standard Igbo dị mfe, nke ugbu a, ma dị ùgwù. E ji usoro ngwaa abụọ—“hapụrụ …, soro”—gosipụta na ịhapụ ụgbụ ahụ butere iso ya, dịka participle na isi ngwaa Grik si hazie omume ndị ahụ.
