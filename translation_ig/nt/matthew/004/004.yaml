id: MAT.4.4
reference: Matthew 4:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: ig
  text: 'Ma ọ zara sị, “E dere ya, sị: ‘Ọ bụghị naanị achịcha ka mmadụ[a] ga-adị ndụ site na ya, kama ọ ga-adị ndụ site n’okwu ọ bụla na-esi n’ọnụ Chineke apụta[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik e ji ebe a bụ aha nwoke n’ụdị ụtọasụsụ, ma ọ na-anọchite mmadụ niile n’ozuzu ha.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ahụ na-ekwu n’ụzọ nkịtị maka okwu “na-apụta site n’ọnụ Chineke.” A sụgharịrị ya “na-esi n’ọnụ Chineke apụta” iji chekwaa onyinyo Chineke na-ekwu okwu n’Igbo ebumpụta ụwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ọ zara sị
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu n’ụzọ ebumpụta ụwa ma doo anya, ma ọ na-echekwa ma nzaghachi ahụ ma okwu o kwuru.
- source_word: Γέγραπται
  choice: E dere ya n’Akwụkwọ Nsọ, sị
  rationale: Ọ na-egosipụta usoro e ji ewebata ihe e dere n’Akwụkwọ Nsọ, ma na-echekwa echiche nke ihe e dere nke ka dị ire.
- source_word: ἄρτῳ μόνῳ
  choice: naanị achịcha
  rationale: “Achịcha” bụ kpọmkwem ihe ἄρτος pụtara n’ebe a; “naanị” na-enye μόνῳ n’ụzọ Igbo doro anya.
- source_word: ζήσεται
  choice: ga-eji dị ndụ
  rationale: Usoro “iji … dị ndụ” na-eme ka njikọ ἐπί dị na amaokwu ahụ pụta n’Igbo, ma na-asụgharị ọdịnihu ζήσεται nke ọma.
- source_word: ὁ ἄνθρωπος
  choice: mmadụ
  rationale: “Mmadụ” bụ okwu Igbo na-anọchite mmadụ n’ozuzu ya, ọ bụghị naanị nwoke, ma kwekọọ n’ike nnọchiteanya nke okwu Grik ahụ.
- source_word: παντὶ ῥήματι
  choice: okwu niile
  rationale: N’ebe a ῥῆμα bụ ihe Chineke kwuru; “okwu niile” bụ asụsụ Igbo dị mfe ma ziri ezi.
- source_word: ἐκπορευομένῳ διὰ στόματος θεοῦ
  choice: na-esi n’ọnụ Chineke apụta
  rationale: Nke a na-echekwa onyinyo okwu na-apụta site n’ọnụ Chineke, ma bụrụkwa usoro okwu Igbo dị ebumpụta ụwa.
theological_decisions:
- issue: ὁ ἄνθρωπος dị ka otu aha nwoke nke na-anọchite mmadụ niile
  choice: mmadụ
  alternative: nwoke
  rationale: Amaokwu ahụ na-ekwu eziokwu gbasara mmadụ niile. “Mmadụ” na-echekwa echiche izugbe ahụ n’enweghị itinye ihe gbasara nwoke naanị.
- issue: Ike na-adịgide adịgide nke Γέγραπται
  choice: E dere ya n’Akwụkwọ Nsọ, sị
  alternative: E deela ya, sị
  rationale: Nhọrọ a na-edobe usoro a ma ama e ji kpọpụta Akwụkwọ Nsọ, n’enweghị ịgbakwụnye nkọwa ozizi pụrụ iche.
- issue: διὰ στόματος θεοῦ
  choice: na-esi n’ọnụ Chineke apụta
  alternative: na-agafe n’ọnụ Chineke
  rationale: “Na-esi … apụta” na-echekwa onyinyo nke okwu Chineke na-apụta n’ọnụ ya ma zere Igbo na-adịghị ebumpụta ụwa; ọ naghị edozi esemokwu dị n’etiti echiche “site na” na “gafee” n’ụzọ ozizi.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ọ zara sị” na “ga-eji dị ndụ” mee ka ahịrịokwu ahụ daa ka ezigbo Igbo, ebe “na-esi n’ọnụ Chineke apụta” na-echekwa onyinyo dị n’asụsụ Grik.
