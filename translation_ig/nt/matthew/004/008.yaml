id: MAT.4.8
reference: Matthew 4:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: ig
  text: Ọzọkwa, ekwensu kpọọrọ ya gaa n’ugwu dị nnọọ elu, wee gosi ya alaeze niile nke ụwa na ebube ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịma mma ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Ọzọkwa
  rationale: Ọ na-egosi na ọnwụnwa ọzọ sochiri nke gara aga, ma bụrụkwa okwu dị nkenke ma na-ada nke ọma n’Igbo.
- source_word: παραλαμβάνει
  choice: kpọọrọ ya gaa
  rationale: Nhọrọ a na-egosi na ekwensu duuru ya gaa ebe ọzọ, n’enweghị ịgbakwụnye nkọwa na-adịghị na Grik.
- source_word: ὁ διάβολος
  choice: ekwensu
  rationale: Nke a bụ aha a na-ejikarị eme ihe n’Igbo maka onye ahụ a kpọrọ διάβολος n’ebe a.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: gaa n’elu ugwu dị nnọọ elu
  rationale: Ọ na-echekwa echiche ngagharị ruo n’elu ugwu ma na-egosikwa ike okwu λίαν, ‘nnọọ.’
- source_word: δείκνυσιν
  choice: gosi
  rationale: Ọ bụ nsụgharị kwụ ọtọ na nke sitere n’okwu ahụ n’onwe ya, n’enweghị ime ka ihe ọ pụtara sie ike karịa Grik.
- source_word: πάσας τὰς βασιλείας
  choice: alaeze niile
  rationale: Ọ na-echekwa ọtụtụ alaeze na echiche ọchịchị eze dị na βασιλεία.
- source_word: τοῦ κόσμου
  choice: nke ụwa
  rationale: Ụwa bụ okwu Igbo doro anya ma kwekọọ n’echiche κόσμος n’ọnọdụ a.
- source_word: τὴν δόξαν αὐτῶν
  choice: ebube ha
  rationale: ‘Ebube’ na-echekwa njikọ sara mbara nke δόξα, ma n’ebe a ọ pụkwara izo aka n’ịma mma na ịdị ukwuu nke alaeze ndị ahụ.
theological_decisions:
- issue: Ụdị ihe mere n’elu ugwu n’akụkọ ọnwụnwa ahụ
  choice: A sụgharịrị ihe ahụ dịka akụkọ ahụ siri kwuo ya, n’enweghị ịkọwa otú e si gosi ya alaeze niile.
  alternative: Ịkọwa ya dịka ihe anya hụrụ site n’ugwu nkịtị, ma ọ bụ dịka ọhụụ ma ọ bụ ngosipụta karịrị nke mmadụ.
  rationale: Grik kwuru naanị na ekwensu kpọọrọ ya gaa n’ugwu dị nnọọ elu ma gosi ya alaeze niile nke ụwa na ebube ha; ya mere, nsụgharị ahụ echekwaghị mgbagwoju anya ahụ kama idozi ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa nsọpụrụ. E ji oge gara aga kọọ akụkọ ahụ n’ụzọ na-ada nke ọma n’Igbo, ọ bụ ezie na Grik ji oge ugbu a nke akụkọ.
