revisions:
- from: Ọzọkwa, ekwensu kpọọrọ ya gaa n’elu ugwu dị nnọọ elu, wee gosi ya alaeze niile nke ụwa na ebube ha.[a]
  to: Ọzọkwa, ekwensu kpọọrọ ya gaa n’ugwu dị nnọọ elu, wee gosi ya alaeze niile nke ụwa na ebube ha.[a]
  rationale: The revision changes only the destination phrase to match the Greek movement-to-a-mountain construction without implying ascent to its top, and narrows the footnote alternative to a closer rendering of δόξα in this context. It preserves the narrative ambiguity regarding how all the kingdoms were shown.
  reviewer_model: gpt-5.6-terra
