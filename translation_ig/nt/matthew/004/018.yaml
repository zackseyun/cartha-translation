  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: ig
  text: Mgbe ọ na-aga n'akụkụ Osimiri Galili, ọ hụrụ ụmụnne nwoke abụọ—Saịmọn, onye a na-akpọ Pita, na Andru nwanne ya nwoke—ka ha na-atụ ụgbụ[a] n'ime osimiri ahụ, n'ihi na ha bụ ndị ọkụ azụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ụgbụ a na-atụba n'ime mmiri iji jide azụ.
    reason: lexical_clarification
lexical_decisions:
- source_word: Περιπατῶν
  choice: Mgbe ọ na-aga
  rationale: Present participle ahụ na-egosi ihe Jizọs nọ na-eme n'otu oge ahụ ọ hụrụ ha; nkebi ahịrịokwu a bụ Igbo nkịtị ma na-egosi omume na-aga n'ihu.
- source_word: παρὰ τὴν θάλασσαν
  choice: n'akụkụ Osimiri
  rationale: παρά tinyere accusative na-egosi ịga n'akụkụ; “n'akụkụ” na-enye echiche ahụ n'ụzọ doro anya.
- source_word: θάλασσαν τῆς Γαλιλαίας
  choice: Osimiri Galili
  rationale: N'Igbo, “Osimiri Galili” bụ aha ala a na-aghọta nke ọma, ọ bụ ezie na ebe ahụ bụ ọdọ mmiri n'ihe gbasara ọdịdị ala.
- source_word: εἶδεν
  choice: ọ hụrụ
  rationale: Aorist indicative a bụ omume akụkọ dị mfe; “ọ hụrụ” na-edobe mfe ya.
- source_word: δύο ἀδελφούς
  choice: ụmụnne nwoke abụọ
  rationale: N'ebe a, okwu ahụ na-ezo aka n'ụmụnne abụọ bụ nwoke; nsụgharị ahụ na-eme ka nke a doo anya.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: Saịmọn, onye a na-akpọ Pita
  rationale: Relative clause a na-asụ nke ọma n'Igbo ma na-edobe ihe λεγόμενον pụtara.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: nwanne ya nwoke Andru
  rationale: Ọ na-akọwa Andru dị ka nwanne Saịmọn; usoro a bụ Igbo eke ma doo anya.
- source_word: βάλλοντας
  choice: ka ha na-atụ
  rationale: Present participle ahụ na-akọwa ihe ụmụnne abụọ ahụ nọ na-eme mgbe a hụrụ ha.
- source_word: ἀμφίβληστρον
  choice: ụgbụ nkedo
  rationale: Okwu Grik ahụ pụtara ụgbụ a na-atụba n'ime mmiri ka ọ gbasaa gburugburu; “ụgbụ nkedo” na-edobe nkọwa ahụ karịa naanị “ụgbụ.”
- source_word: εἰς τὴν θάλασσαν
  choice: n'ime mmiri ahụ
  rationale: εἰς na-egosi mmegharị ịbanye n'ime; “mmiri ahụ” na-ezere ikwughachi aha ebe ahụ n'ụzọ na-adịghị eke ma na-ezo aka na Osimiri Galili.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: n'ihi na ha bụ ndị ọkụ azụ
  rationale: γάρ na-enye ihe kpatara ha ji na-atụ ụgbụ; “n'ihi na” na-egosipụta njikọ nkọwa ahụ nke ọma.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, sụgharịa ya. E debere aha ndị mmadụ dị ka Saịmọn, Pita, na Andru n'ụdị ntụgharị-ụda a maara n'Igbo. Akara nkọwa ala ala [a] dị n'ahịrịokwu ahụ ma kọwaa ụdị ụgbụ Grik ἀμφίβληστρον na-ezo aka na ya.
