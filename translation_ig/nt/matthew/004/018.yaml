  naturalness: The sentence is generally clear Standard Igbo. However, “ụgbụ nkedo” is not as transparent or idiomatic as simply “ụgbụ,” with the specific cast-net sense supplied in a note. “N'ime osimiri ahụ” also gives a smoother explicit referent than “n'ime mmiri ahụ.”
