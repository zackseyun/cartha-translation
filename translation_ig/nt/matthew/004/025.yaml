  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: ig
  text: Ọtụtụ ìgwè mmadụ sitere na Galili, Dekapọlis, Jerusalem, Judia, nakwa n’ofe Jọdan[a] soro ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’akụkụ nke ọzọ nke Jọdan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: soro ya
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ nkịtị na ha gbasoro ya; ọ na-edokwa ma echiche nke iso mmadụ eje ije ma ohere nke mmasị ịghọ ndị na-eso ụzọ, n’enweghị ikwu na ha niile abụrụla ndị na-eso ụzọ ya n’ụzọ zuru ezu.
- source_word: ὄχλοι πολλοὶ
  choice: Oké ìgwè mmadụ
  rationale: Okwu a bụ Igbo dị mfe ma dị ebube maka nnukwu ọnụọgụ mmadụ gbakọrọ ọnụ; ọ naghị esochi usoro Grik n’ụzọ ga-eme ka Igbo sie ike nghọta.
- source_word: ἀπὸ
  choice: sitere na
  rationale: Ọ na-egosi ebe ìgwè mmadụ ndị ahụ si bịa ma na-achịkwa ndepụta ebe niile.
- source_word: Γαλιλαίας
  choice: Galili
  rationale: Aha a na-ejikarị akpọ mpaghara Galilee n’Igbo.
- source_word: Δεκαπόλεως
  choice: Dekapọlis
  rationale: Ntugharị ụda aha mpaghara a, nke a maara dịka mpaghara obodo iri.
- source_word: Ἱεροσολύμων
  choice: Jerusalem
  rationale: Ụdị aha obodo a nke ndị na-agụ Igbo maara nke ọma.
- source_word: Ἰουδαίας
  choice: Judia
  rationale: Ụdị aha mpaghara Judea a na-eji n’Igbo.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: n’ofe Jọdan
  rationale: Ọ na-echekwa echiche gbasara ala dị n’ofe Osimiri Jọdan, ma hapụkwa njikọ ya na ‘sitere na’ ka ọ gbasoo ndepụta ahụ dum.
- source_word: καὶ ... καὶ ... καὶ
  choice: ', ... , ... , nakwa'
  rationale: Ndepụta Igbo a na-agụ nke ọma ma ‘nakwa’ na-edobe mmetụta nke καί ikpeazụ na nchịkọta ebe dị iche iche.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu. A họọrọ usoro ahịrịokwu nke na-eme ka ebe ìgwè mmadụ si bịa doo anya, ma ghara ime ka ‘iso ya’ pụta ozugbo dịka nkwupụta na ha niile abụrụla ndị na-eso ụzọ ya n’ụzọ zuru ezu.
