review_pass:
  verdict: revise
  source_fidelity: The draft conveys the persons, boat setting, shared father, net-mending activity, and Jesus' call accurately. However, “Mgbe” introduces an explicit temporal ‘when’ relation not required by the Greek aorist participle, and “kpọkwara” can carry an unnecessary ‘also/again’ nuance beyond the simple καί.
  naturalness: The wording is generally clear Standard Igbo. Revising the opening to a straightforward sequential narrative and placing the boat/activity phrase directly under what Jesus saw yields a more natural, precise sentence.
  terminology: Jemis, Jọn, Zebedi, ụgbọ mmiri, ụgbụ, and kpọrọ are suitable modern Standard Igbo forms. “Nwa Zebedi” correctly renders the Greek parentage idiom, while “nwanne ya” naturally identifies John as James’s brother.
  issues:
  - severity: low
    issue: “Mgbe o si ebe ahụ gaa n’ihu” adds an explicit ‘when’ clause.
    rationale: προβὰς ἐκεῖθεν is a participial sequential action, ‘going on/from there.’ Igbo can express this without adding a temporal subordination relation.
  - severity: low
    issue: “Ọ kpọkwara ha” may imply ‘he also called them’ or ‘called them again.’
    rationale: ἐκάλεσεν αὐτούς, linked with a simple καί, states that he called them; the extra -kwa is not needed and can introduce nuance not explicit in this verse.
  revised_text: O si ebe ahụ gaa n’ihu, ọ hụrụ ụmụnne nwoke abụọ ọzọ—Jemis, nwa Zebedi, na Jọn, nwanne ya—n’ụgbọ mmiri ka ha na nna ha Zebedi na-edozi ụgbụ ha; ọ kpọrọ ha.
  revised_footnotes: []
  revision_rationale: 'The revision retains every stated element of the Greek: movement onward from the prior place, two additional brothers, James’s identification as Zebedee’s son, John as his brother, their presence in the boat with their father, their mending of their nets, and Jesus’ call. It removes minor added discourse nuances while preserving natural narrative Igbo.'
