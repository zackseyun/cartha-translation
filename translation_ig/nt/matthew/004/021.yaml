id: MAT.4.21
reference: Matthew 4:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: ig
  text: O si ebe ahụ gaa n’ihu, ọ hụrụ ụmụnne nwoke abụọ ọzọ—Jemis, nwa Zebedi, na Jọn, nwanne ya—n’ụgbọ mmiri ka ha na nna ha Zebedi na-edozi ụgbụ ha; ọ kpọrọ ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: Mgbe o si ebe ahụ gaa n’ihu
  rationale: Nkebi ahịrị a na-egosi na o si n’ebe ahụ pụọ gaa n’ihu. Usoro a bụ Igbo nkịtị ma na-echekwa njikọ oge nke participle ahụ.
- source_word: εἶδεν
  choice: ọ hụrụ
  rationale: Nke a bụ ntụgharị kpọmkwem na nke nkịtị nke ngwaa ịhụ n’akụkọ.
- source_word: ἄλλους δύο ἀδελφούς
  choice: ụmụnne nwoke abụọ ọzọ
  rationale: ‘Abụọ ọzọ’ na-egosi na ha bụ ndị ọzọ e wezụga ụmụnne abụọ a kpọtụrụ aha na mbụ; ‘ụmụnne nwoke’ na-eme ka mmekọrịta ha doo anya.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Jemis nwa Zebedi
  rationale: Genitive Grik ahụ na-egosi na Jemis bụ nwa Zebedi; usoro a dị mkpirikpi ma bụrụ Igbo ebumpụta ụwa.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: Jọn nwanne ya
  rationale: Nke a na-akọwa Jọn dị ka nwanne Jemis n’enweghị mgbakwunye na-adịghị na isi mmalite.
- source_word: ἐν τῷ πλοίῳ
  choice: n’ụgbọ mmiri
  rationale: N’ọnọdụ a πλοῖον bụ ụgbọ e ji akụ azụ; ‘ụgbọ mmiri’ bụ okwu Igbo doro anya ma kwesị ekwesị.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: ka ha na nna ha Zebedi nọ
  rationale: Usoro a na-egosi ma iso nna ha nọ ma aha ya, n’Igbo dị nro ma doo anya.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: na-edozi ụgbụ ha
  rationale: καταρτίζω pụtara ime ka ụgbụ dịghachi n’ọnọdụ kwesịrị ekwesị, nke nwere ike ịgụnye ịkwa ebe dọwara adọwa ma ọ bụ ịkwadebe ya. ‘Na-edozi’ na-echekwa obosara ihe okwu ahụ nwere.
- source_word: ἐκάλεσεν αὐτούς
  choice: Ọ kpọkwara ha
  rationale: ‘Kpọọ’ na-echekwa okwu dị mfe nke Grik ma hapụ ọnọdụ gbara ya gburugburu ka ọ kọwaa na nke a bụ ọkpụkpọ ịbụ ndị na-eso ụzọ.
theological_decisions:
- issue: Ihe ọkpụkpọ ahụ pụtara n’ihe gbasara iso ụzọ
  choice: Ọ kpọkwara ha
  alternative: Ọ kpọrọ ha ka ha soro ya
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi na ọ bụ ọkpụkpọ iso Jizọs, ma amaokwu a n’onwe ya ekwughị ‘ka ha soro ya.’ Ya mere, e tinyeghị nkọwa ahụ n’ime ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ntụgharị ahụ. E debere usoro akụkọ n’ụzọ Igbo na-asụkarị, ma chekwaa nkọwa niile dị mkpa n’asụsụ Grik.
