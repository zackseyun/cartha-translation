revisions:
- from: Mgbe o si ebe ahụ gaa n’ihu, ọ hụrụ ụmụnne nwoke abụọ ọzọ—Jemis nwa Zebedi na Jọn nwanne ya—ka ha na nna ha Zebedi nọ n’ụgbọ mmiri, na-edozi ụgbụ ha. Ọ kpọkwara ha.
  to: O si ebe ahụ gaa n’ihu, ọ hụrụ ụmụnne nwoke abụọ ọzọ—Jemis, nwa Zebedi, na Jọn, nwanne ya—n’ụgbọ mmiri ka ha na nna ha Zebedi na-edozi ụgbụ ha; ọ kpọrọ ha.
  rationale: 'The revision retains every stated element of the Greek: movement onward from the prior place, two additional brothers, James’s identification as Zebedee’s son, John as his brother, their presence in the boat with their father, their mending of their nets, and Jesus’ call. It removes minor added discourse nuances while preserving natural narrative Igbo.'
  reviewer_model: gpt-5.6-terra
