    rationale: “Gaa n’ihu” explicitly states continuation. Although continuation is compatible with the narrative context, Ἀπὸ τότε is more directly and naturally represented by “Malite n’oge ahụ.”
  - severity: medium
    issue: Footnote b adds an explicit return to God.
    rationale: Μετανοεῖτε calls for repentance/change, but this verse does not expressly say “return to God.” The clarification should explain the semantic range without presenting that contextual implication as the wording’s direct meaning.
