id: MAT.4.17
reference: Matthew 4:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: ig
  text: Malite n’oge ahụ, Jizọs malitere ikwusa ozi[a], na-asị, “Chegharịanụ[b], n’ihi na alaeze eluigwe abịaruwo nso[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “malitere ikwusa ma na-ekwu.” Grik ji ngwaa abụọ mee ihe.
    reason: previous_rendering
  - marker: b
    text: Ya bụ, gbanweenụ echiche na ụzọ ndụ unu.
    reason: lexical_clarification
  - marker: c
    text: A pụkwara ịsụgharị ya, “abịala nso” ma ọ bụ “dị nso.” Ụdị ngwaa Grik na-emesi ike na alaeze ahụ abịaruola nso, ọnọdụ ahụ ka dịkwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Site n’oge ahụ gaa n’ihu
  rationale: Nkebiokwu a na-egosi mgbanwe dị mkpa n’akụkọ ahụ nakwa na ihe a malitere mgbe ahụ wee gaa n’ihu.
- source_word: ἤρξατο
  choice: malitere
  rationale: Nke a bụ ụzọ Igbo doro anya ma kwekọọ n’ụdị ngwaa Grik nke na-egosi mmalite omume ahụ.
- source_word: κηρύσσειν καὶ λέγειν
  choice: ikwusa ozi, na-asị
  rationale: ‘Ikwusa ozi’ na-egosipụta nkwupụta e mere n’ihu ọha; ‘na-asị’ na-ewebata kpọmkwem ihe Jizọs kwusara n’Igbo na-aga were were.
- source_word: Μετανοεῖτε
  choice: Chegharịanụ
  rationale: Okwu a na-akpọ ndị mmadụ ka ha gbanwee echiche na ụzọ ndụ ha ma laghachikwute Chineke; ụdị ọtụtụ ‘-nụ’ kwekọrọ n’iwu Grik e nyere ọtụtụ mmadụ.
- source_word: ἤγγικεν
  choice: abịaruwo nso
  rationale: 'Ụdị a na-echekwa echiche nke ngwaa perfect Grik: alaeze ahụ abịala nso, ọnọdụ ahụ ka dịkwa ugbu a.'
- source_word: βασιλεία τῶν οὐρανῶν
  choice: alaeze eluigwe
  rationale: Nke a bụ okwu Igbo a maara nke ọma ma na-echekwa ụzọ Matiu si ekwu okwu; ‘alaeze’ nwekwara ike ịgụnye ọchịchị eze, ọ bụghị nanị ógbè.
theological_decisions:
- issue: Ihe Μετανοεῖτε pụtara
  choice: Chegharịanụ
  alternative: Gbanweenụ obi na ụzọ unu
  rationale: ‘Chegharịanụ’ na-agụnye mgbanwe nke echiche, obi, na omume, n’enweghị ịmachi ya n’otu nkọwa ụka pụrụ iche.
- issue: Nkọwa βασιλεία τῶν οὐρανῶν
  choice: alaeze eluigwe
  alternative: ọchịchị eluigwe
  rationale: ‘Alaeze eluigwe’ na-echekwa okwu pụrụ iche Matiu ji eme ihe ma hapụkwa nghọta ya dị ka ọchịchị Chineke na ógbè ọchịchị ya ka ha abụọ dịrị.
- issue: Ike nke ἤγγικεν
  choice: abịaruwo nso
  alternative: dị nso
  rationale: Nhọrọ a na-egosipụta na ịbịaru nso emeela ma na-adịgide, kama ịkọwa kpọmkwem n’ụzọ ozizi otú alaeze ahụ siri dị ugbu a.
translation_notes:
  register: E ji Standard Igbo nke dị ùgwù ma dị mfe nghọta mee ntụgharị a. ‘Na-asị’ na-eme ka ahịrịokwu ahụ bụrụ nke e ji ọnụ ekwu nke ọma, ebe ‘ikwusa ozi’ na-echekwa echiche nke nkwupụta n’ihu ọha. E tinyere akara ntụaka ụkwụ niile n’ebe okwu ha na-akọwa dị.
