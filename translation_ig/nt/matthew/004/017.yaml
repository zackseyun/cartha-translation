  source_fidelity: The core rendering accurately conveys the temporal transition, Jesus' beginning of public proclamation, the plural imperative to repent, and the perfect-force nearness of the kingdom. “Alaeze eluigwe” appropriately retains Matthew’s characteristic expression. A small revision makes the opening more idiomatic without adding an explicit continuative element beyond the Greek wording.
  naturalness: “Malite n’oge ahụ” is a smoother Standard Igbo narrative transition than “Site n’oge ahụ gaa n’ihu.” The remaining sentence is clear, dignified, and suitable for Scripture reading.
  terminology: “Jizọs,” “ikwusa ozi,” “Chegharịanụ,” “alaeze eluigwe,” and “abịaruwo nso” are established, understandable Standard Igbo choices. The repentance footnote should avoid expanding the imperative into the explicit statement “return to God,” which is theologically consonant with the context but is not stated in this verse.
