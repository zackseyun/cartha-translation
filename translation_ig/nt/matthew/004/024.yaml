id: MAT.4.24
reference: Matthew 4:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: ig
  text: 'Akụkọ banyere ya wee ruo Siria dum. Ha kpọtaara ya ndị niile na-arịa ọrịa: ndị ọrịa dị iche iche na oké ihe mgbu na-emekpa, ndị mmụọ ọjọọ ji[a], ndị na-adọ akwụkwụ[b], na ndị ahụ ha kpọnwụrụ akpọnwụ. O wee gwọọ ha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị mmụọ ọjọọ na-emekpa” ma ọ bụ “ndị mmụọ ọjọọ bi n'ime ha.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a pụtara n'ụzọ nkịtị ndị e chere na ọnwa na-emetụta ha; a na-asụgharịkarị ya “ndị nwere ọrịa akwụkwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: Akụkọ banyere ya
  rationale: N'ebe a, okwu ahụ pụtara ihe ndị mmadụ nụrụ ma na-akọ banyere Jizọs, ọ bụghị ikike ịnụ ihe. “Akụkọ banyere ya” bụ Igbo doro anya ma kwekọọ n'echiche nke ozi a na-agbasa.
- source_word: ἀπῆλθεν ... εἰς ὅλην τὴν Συρίαν
  choice: wee ruo Siria dum
  rationale: Nke a na-edobe ihe atụ nke akụkọ ahụ na-aga wee ruo mpaghara ahụ niile, ma na-ada ka Igbo nkịtị.
- source_word: προσήνεγκαν αὐτῷ
  choice: Ha kpọtaara ya
  rationale: Ọ pụtara na ha kpọtara ndị ọrịa ka ha bịakwute Jizọs; “kpọtaara ya” bụ okwu Igbo ebumpụta ụwa n'ọnọdụ a.
- source_word: κακῶς ἔχοντας
  choice: ndị niile na-arịa ọrịa
  rationale: Akpaalaokwu Grik a na-ezo aka n'ahụ adịghị mmadụ mma ma ọ bụ n'ọrịa. Nsụgharị a doro ndị na-agụ akwụkwọ taa anya.
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: ndị ọrịa dị iche iche na oké ahụhụ na-emekpa ahụ
  rationale: “Ọrịa dị iche iche” na-egosipụta ụdị ọrịa ọtụtụ, ebe “oké ahụhụ” na-echekwa ịdị ike nke βασάνοις; “na-emekpa ahụ” na-ekwupụta συνεχομένους n'Igbo dị mma.
- source_word: δαιμονιζομένους
  choice: ndị mmụọ ọjọọ na-achị
  rationale: Nke a na-ekwupụta n'ụzọ doro anya na nsogbu ahụ metụtara mmụọ ọjọọ, ma ọ naghị amanye otu nkọwa Igbo dị warara karịa okwu Grik ahụ. E debere ụzọ ndị ọzọ e nwere ike isi ghọta ya n'ala peeji.
- source_word: σεληνιαζομένους
  choice: ndị na-adọ akwụkwụ
  rationale: Okwu Grik ahụ sitere n'echiche nke ọnwa na-emetụta mmadụ, ma n'ọnọdụ a ọ na-ezo aka n'ọrịa nke na-eme ka mmadụ na-adọ akwụkwụ. Nsụgharị a na-akọwa ihe ndị na-agụ akwụkwọ taa ga-aghọta n'ebughị ụzọ kwado ihe kpatara ọrịa ahụ n'echiche ndị mgbe ochie.
- source_word: παραλυτικούς
  choice: ndị ahụ ha kpọnwụrụ akpọnwụ
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị ugbu a isi kọwaa ndị akụkụ ahụ ha enweghị ike imegharị n'ihi mkpọnwụ.
- source_word: ἐθεράπευσεν αὐτούς
  choice: O wee gwọọ ha
  rationale: “Gwọọ” bụ okwu Igbo kwesịrị ekwesị maka θεραπεύω n'akụkọ ọgwụgwọ, “ha” na-edobekwa ihe nnọchiaha Grik.
theological_decisions:
- issue: Otu e si akọwa δαιμονιζομένους n'ekweghị agọnahụ mmụọ ọjọọ ma ọ bụ mee okwu ahụ ka ọ bụrụ nkọwa teknụzụ dị warara
  choice: ndị mmụọ ọjọọ na-achị
  alternative: ndị mmụọ ọjọọ ji; ndị mmụọ ọjọọ bi n'ime ha
  rationale: Nhọrọ a na-echekwa eziokwu nke mmekpa ahụ sitere n'aka mmụọ ọjọọ, ma na-ahapụ ogo ma ọ bụ ụdị nchịkwa ahụ dịka okwu Grik si hapụ ya. Ihe e dere n'ala peeji na-egosi ụzọ ndị ọzọ a na-asụkarị.
- issue: Otu e si akọwa σεληνιαζομένους n'akwadosịghị echiche ochie na ọnwa bụ ihe kpatara ọrịa ahụ
  choice: ndị na-adọ akwụkwụ
  alternative: ndị ọnwa na-emetụta; ndị nwere ọrịa akwụkwụ
  rationale: Nhọrọ a na-enye onye na-agụ akwụkwọ taa ihe ọrịa ahụ yiri, ebe ala peeji na-echekwa njikọ okwu Grik ahụ na ọnwa na enweghị ntụkwasị obi zuru oke banyere aha ọrịa kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E kewara amaokwu ahụ n'ahịrịokwu atọ ka ogologo usoro Grik ghara ịdị arọ n'Igbo. Kọlọọn na-egosi na ihe ndị na-esochi ya na-akọwa ụdị ndị ọrịa niile a kpọtara. Akara ala peeji [a] na [b] pụtara kpọmkwem n'ederede.
