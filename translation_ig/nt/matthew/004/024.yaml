- from: 'Akụkọ banyere ya wee ruo Siria dum. Ha kpọtaara ya ndị niile na-arịa ọrịa: ndị ọrịa dị iche iche na oké ahụhụ na-emekpa ahụ, ndị mmụọ ọjọọ na-achị[a], ndị na-adọ akwụkwụ[b], na ndị ahụ ha kpọnwụrụ akpọnwụ. O wee gwọọ ha.'
  to: 'Akụkọ banyere ya wee ruo Siria dum. Ha kpọtaara ya ndị niile na-arịa ọrịa: ndị ọrịa dị iche iche na oké ihe mgbu na-emekpa, ndị mmụọ ọjọọ ji[a], ndị na-adọ akwụkwụ[b], na ndị ahụ ha kpọnwụrụ akpọnwụ. O wee gwọọ ha.'
