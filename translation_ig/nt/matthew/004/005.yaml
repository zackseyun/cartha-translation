- from: Mgbe ahụ, Ekwensu kpọọrọ ya banye n’obodo nsọ[a], mee ka o guzoro n’elu ọnụ ọnụ ụlọ nsọ[b].
  to: Mgbe ahụ, Ekwensu kpọọrọ ya banye n’obodo nsọ[a], mee ka o guzo n’elu ọnụ ọnụ ụlọ nsọ[b].
  rationale: The revision makes one small idiomatic correction to the causative rendering of ἔστησεν and smooths the lexical-alternative footnote. It retains the Greek designation “the holy city,” the ambiguity of πτερύγιον, and both original footnote anchors.
