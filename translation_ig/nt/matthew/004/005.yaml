id: MAT.4.5
reference: Matthew 4:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: ig
  text: Mgbe ahụ, Ekwensu kpọọrọ ya banye n’obodo nsọ[a], mee ka o guzo n’elu ọnụ ọnụ ụlọ nsọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, Jerusalem.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “nku ụlọ nsọ”; okwu Grik ahụ nwere ike ịpụta akụkụ ụlọ na-apụta n’èzí ma ọ bụ ebe kachasị elu n’ogige ụlọ nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Na-egosi ihe sochiri ihe gara aga n’akụkọ ahụ n’asụsụ Igbo doro anya.
- source_word: παραλαμβάνει
  choice: kpọọrọ ya
  rationale: Okwu a pụtara ịkpọrọ mmadụ soro mmadụ gaa; ụdị ngwaa Igbo a na-egosi mmegharị ahụ nke ọma.
- source_word: ὁ διάβολος
  choice: Ekwensu
  rationale: Nke a bụ aha a na-ejikarị n’Igbo akọwa διάβολος dị ka onye a kpọrọ aha n’akụkọ ahụ.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: banye n’obodo nsọ
  rationale: “Banye” na-echekwa echiche nke mmegharị ịbanye ebe, ebe “obodo nsọ” na-edobe aha nsọpụrụ e ji kpọọ obodo ahụ n’asụsụ Grik.
- source_word: ἔστησεν
  choice: mee ka o guzoro
  rationale: 'Ụdị a na-egosi ihe kpatara mmadụ iji guzoro: Ekwensu mere ka Jizọs guzoro ebe ahụ, ọ bụghị na Jizọs guzoro n’onwe ya.'
- source_word: ἐπὶ τὸ πτερύγιον
  choice: n’elu ọnụ ọnụ
  rationale: “Ọnụ ọnụ” na-enye echiche nke akụkụ ụlọ na-apụta elu ma ọ bụ ebe kachasị elu, ma ihe a kpọmkwem ka nwere ntakịrị mgbagwoju anya.
- source_word: τοῦ ἱεροῦ
  choice: ụlọ nsọ
  rationale: N’Igbo, “ụlọ nsọ” bụ okwu nkịtị ma dị ùgwù maka temple; ebe a ἱερόν nwere ike ịgụnye ogige ụlọ nsọ dum.
theological_decisions:
- issue: Ịmata “obodo nsọ”
  choice: E debere “obodo nsọ” n’ahịrị isi.
  alternative: Jerusalem
  rationale: Nke a na-echekwa aha nsọpụrụ dị n’ihe odide Grik kama iji aha obodo dochie ya; ihe odide ala peeji na-akọwa na ọ bụ Jerusalem.
- issue: Nkọwa πτερύγιον τοῦ ἱεροῦ
  choice: ọnụ ọnụ ụlọ nsọ
  alternative: nku ụlọ nsọ; ebe kachasị elu n’ogige ụlọ nsọ
  rationale: A maghị kpọmkwem akụkụ owuwu ụlọ okwu Grik a na-ezo aka na ya. Nsụgharị ahụ na-enye isi echiche ya, ebe ihe odide ala peeji na-echekwa nhọrọ ndị ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. E ji “kpọọrọ ya” mee ka akụkọ ahụ na-aga were were; e debere akara ala peeji [a] na [b] ozugbo n’ebe okwu ha na-akọwa dị.
