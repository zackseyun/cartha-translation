id: MAT.4.1
reference: Matthew 4:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: ig
  text: Mgbe ahụ, Mmụọ Nsọ duuru Jizọs rigo n’ọzara ka ekwensu nwaa ya ọnwụnwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwalee ya”; ngwaa Grik ahụ nwere ike ịpụta “ịnwa mmadụ ọnwụnwa” ma ọ bụ “ịnwale mmadụ,” ma ihe ndị na-esochi n’akụkọ a na-akwado “ịnwa ya ọnwụnwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ njikọ oge doro anya nke na-egosi na ihe a mere na-esochi ihe ndị mere tupu ya.
- source_word: ἀνήχθη
  choice: duuru ... rigo
  rationale: Nke a na-egosipụta idu mmadụ na ntụgharị mmegharị elu dị n’okwu Grik, ma jiri ahịrịokwu na-ada nke ọma n’Igbo.
- source_word: εἰς τὴν ἔρημον
  choice: n’ọzara
  rationale: “Ọzara” bụ okwu Igbo a na-aghọta nke ọma maka ala kpọrọ nkụ ma ọ bụ ebe mmadụ na-ebighị, n’enweghị ịkọwa ụdị ala ahụ gabiga ihe isi mmalite kwuru.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: Mmụọ Nsọ
  rationale: Ihe e kwuru ozugbo tupu amaokwu a gbasara Mmụọ nke Chineke bịakwasịrị Jizọs na-eme ka o doo anya na ọ bụ Mmụọ Nsọ ka a na-ekwu maka ya. Ịkpọ ya “Mmụọ Nsọ” na-ewepụ mgbagwoju anya nke okwu “Mmụọ” naanị ya nwere ike ịkpata n’Igbo.
- source_word: πειρασθῆναι
  choice: nwaa ya ọnwụnwa
  rationale: N’ihi na ekwensu bụ onye na-eme ihe a, na ihe ndị na-esochi bụ ịrafu Jizọs ime ihe ọjọọ, okwu a na-egosi ọnwụnwa nke ọma. E debere echiche ọzọ nke ‘ịnwale’ n’ala peeji.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: ekwensu
  rationale: “Ekwensu” bụ okwu Igbo nkịtị ma doo anya maka aha onye iro ahụ n’ebe a.
theological_decisions:
- issue: Onye τοῦ πνεύματος na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ; mmụọ mmadụ
  rationale: Akụkọ e mere ozugbo tupu nke a, ebe Mmụọ bịakwasịrị Jizọs mgbe e mere ya baptizim, na-akwado na ọ bụ Mmụọ Nsọ ka e kwuru maka ya.
- issue: Ihe πειρασθῆναι pụtara
  choice: ka a nwaa ya ọnwụnwa
  alternative: ka a nwalee ya
  rationale: Onye na-eme ya na ihe ndị mere n’akụkọ na-esochi na-akwado echiche nke ọnwụnwa, ma okwu Grik nwekwara ike ịpụta nnwale; ya mere, e chekwara nhọrọ nke abụọ n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu nke onye na-eme ihe (“Mmụọ Nsọ duuru”) n’ihi na ọ na-ada nke ọma karịa usoro nnara Igbo, ebe ọ ka na-edebe Mmụọ dịka onye duuru Jizọs. E debere ntụgharị mmegharị elu nke ἀνάγω site na “rigo.”
