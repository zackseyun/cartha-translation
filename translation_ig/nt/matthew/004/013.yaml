  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: ig
  text: Ọ hapụrụ Nazara[a], bịara Kapanọm ma biri n’obodo ahụ dị n’akụkụ osimiri, n’ógbè Zebulọn na Naftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “Nazara”; ọtụtụ nsụgharị na-eji “Nazaret.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: Ọ hapụrụ
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi; nkebiokwu a bụ ụzọ Igbo dị mfe ma doo anya isi gosi na ọ si Nazara pụọ.
- source_word: Ναζαρὰ
  choice: Nazara
  rationale: A sụgharịghị aha ahụ ka ọ bụrụ Nazaret, n’ihi na ụdị Grik dị n’amaokwu a bụ Ναζαρά; e debere ụdị aha a maara nke ọma n’ala ala peeji.
- source_word: ἐλθὼν
  choice: bịaruo
  rationale: 'N’Igbo, ijikọ ya na ngwaa sochirinụ na-egosi usoro omume ahụ nke ọma: ọ bịaruru Kapanọm wee biri ebe ahụ.'
- source_word: κατῴκησεν
  choice: biri n’ebe ahụ
  rationale: κατοικέω n’ebe a pụtara ibido ibi ma ọ bụ guzobe ebe obibi; okwu a bụ Igbo nkịtị ma na-egosi na ọ biri ebe ahụ.
- source_word: Καφαρναοὺμ
  choice: Kapanọm
  rationale: Nke a bụ nsụgharị ụda aha obodo Καφαρναούμ n’usoro mkpopụta Igbo.
- source_word: τὴν παραθαλασσίαν
  choice: n’akụkụ osimiri
  rationale: Ọ na-akọwa Kapanọm dị ka obodo dị n’akụkụ nnukwu mmiri ahụ; ‘n’akụkụ osimiri’ bụ okwu Igbo dị mfe ma kwekọọ na ojiji Akwụkwọ Nsọ nke ‘osimiri’ maka ọdọ mmiri ahụ.
- source_word: ἐν ὁρίοις
  choice: n’ógbè
  rationale: ὅρια nwere ike ịpụta oke ala ma ọ bụ mpaghara; n’ebe a, ọ na-arụtụ aka n’ala e jikọtara ya na Zebulọn na Naftali.
- source_word: Ζαβουλὼν
  choice: Zebulọn
  rationale: Ụdị aha a kwekọrọ n’usoro mkpopụta Igbo ma na-eme ka a mata aha ebo na mpaghara ahụ.
- source_word: Νεφθαλίμ
  choice: Naftali
  rationale: Ụdị aha a kwekọrọ n’usoro mkpopụta Igbo ma na-eme ka a mata aha ebo na mpaghara ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo izugbe nke oge a, dị mfe ma nwee ugwu. E kewara participle ndị Grik ka ha bụrụ ngwaa ndị na-aga n’usoro n’Igbo, ma a hapụrụ ụdị aha Ναζαρά dị na isi mmalite, tinyekwa ‘Nazaret’ n’ala ala peeji.
