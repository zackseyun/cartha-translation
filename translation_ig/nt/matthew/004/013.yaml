    issue: Verb form and flow
    rationale: Replace “bịaruo” with “bịara,” and coordinate it with “biri,” for an unambiguous, idiomatic past narrative sequence corresponding to the Greek participle followed by the main verb.
  - severity: low
    issue: Reference of “n’ebe ahụ”
    rationale: Replacing the deictic phrase with “n’obodo ahụ dị n’akụkụ osimiri” makes explicit that the coastal description qualifies Capernaum, as in τὴν παραθαλασσίαν.
