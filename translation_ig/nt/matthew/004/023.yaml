id: MAT.4.23
reference: Matthew 4:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: ig
  text: Jizọs wee na-agagharị n’ime Galili niile, na-akụzi ihe n’ụlọ nzukọ ha, na-ekwusa ozi ọma nke alaeze ahụ, na-agwọkwa ọrịa ọ bụla na adịghị ike ọ bụla n’etiti ndị mmadụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιῆγεν
  choice: wee na-agagharị
  rationale: Ngwaa imperfect a na-egosi njem ọ na-eme ugboro ugboro ma na-aga n’ihu n’ógbè ahụ; “na-agagharị” na-egosipụta mmegharị a nke ọma n’Igbo.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: n’ime Galili niile
  rationale: N’agbanyeghị na ἐν pụtara “n’ime,” ya na ngwaa mmegharị na ὅλῃ na-egosi na ọ gara n’akụkụ dị iche iche nke ógbè Galili dum.
- source_word: διδάσκων
  choice: na-akụzi ihe
  rationale: Participle a na-egosi ihe ọ nọ na-eme n’otu oge ahụ ọ na-agagharị; okwu Igbo a bụ nke doro anya ma bụrụkwa nke mmadụ niile na-aghọta.
- source_word: συναγωγαῖς αὐτῶν
  choice: n’ụlọ nzukọ ndị Juu ha
  rationale: συναγωγή ebe a bụ ụlọ nzukọ okpukpe ndị Juu. A hapụrụ αὐτῶν dị ka “ha,” ebe “ndị Juu” na-eme ka ụdị ụlọ nzukọ ahụ doo onye na-agụ Igbo anya.
- source_word: κηρύσσων
  choice: na-ekwusa
  rationale: κηρύσσω na-egosi ikwupụta ozi n’ihu ọha dịka onye na-akpọsa ya; “na-ekwusa” na-echekwa echiche ahụ n’asụsụ Igbo dị ugwu.
- source_word: τὸ εὐαγγέλιον
  choice: ozi ọma
  rationale: “Ozi ọma” na-enye kpọmkwem isi lexical nke εὐαγγέλιον ma bụrụ okwu Igbo a na-aghọta nke ọma.
- source_word: τῆς βασιλείας
  choice: nke alaeze ahụ
  rationale: A sụgharịrị genitive ahụ n’ụzọ dị nso n’usoro Grik. “Alaeze ahụ” na-edobe njikọ ya na alaeze e kwuru okwu ya na ọnọdụ a, n’enweghị ịkọwa ma genitive ahụ ọ bụ nke njirimara ka ọ bụ nke isiokwu.
- source_word: θεραπεύων
  choice: na-agwọkwa
  rationale: N’ebe a θεραπεύω pụtara ime ka ndị ọrịa dị mma; “ịgwọ” bụ okwu Igbo kachasị eke ma saa mbara maka ya.
- source_word: πᾶσαν νόσον
  choice: ụdị ọrịa ... niile
  rationale: νόσος bụ ọrịa; usoro “ụdị ... niile” na-egosi oke zuru ezu nke πᾶσαν n’Igbo eke.
- source_word: πᾶσαν μαλακίαν
  choice: adịghị ike niile
  rationale: μαλακία nwere ike ịpụta adịghị ike, nrịanrịa, ma ọ bụ enweghị ike nke ahụ. “Adịghị ike” na-echekwa ọdịiche ya na νόσος kama ijikọta aha abụọ ahụ n’otu okwu.
- source_word: ἐν τῷ λαῷ
  choice: dị n’etiti ndị mmadụ
  rationale: Nkebiokwu a na-egosi ebe ma ọ bụ n’etiti ndị ọ na-agwọ nọ; “n’etiti ndị mmadụ” bụ Igbo eke ma ghara ịmanye λαός ka ọ bụrụ okwu teknụzụ gbasara ndị ọgbụgba ndụ.
theological_decisions:
- issue: Nsụgharị εὐαγγέλιον τῆς βασιλείας
  choice: ozi ọma nke alaeze ahụ
  alternative: ozi ọma banyere alaeze ahụ
  rationale: “Nke alaeze ahụ” na-anọ nso na genitive Grik ma na-echekwa ohere na nkebiokwu ahụ pụrụ ịkọwa ozi ọma nke alaeze ji mara ma ọ bụ ozi ọma gbasara alaeze, n’enweghị idozi mgbagwoju anya ahụ n’aka onye ntụgharị.
- issue: Oke ọgwụgwọ dị na πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: ụdị ọrịa na adịghị ike niile
  alternative: ọrịa niile na nrịanrịa niile
  rationale: Nsụgharị ahụ na-echekwa nkwusi ike nke πᾶσαν ugboro abụọ ma na-edobekwa ọdịiche lexical n’etiti νόσος na μαλακία, n’enweghị ikwu ihe karịrị amaokwu ahụ.
- issue: Onye a na-ekwu maka ya na αὐτός nke a ghọtara n’ime ngwaa
  choice: Jizọs
  alternative: Ọ
  rationale: Grik ji isiokwu a ghọtara site na ọnọdụ gara aga. Ịkpọ “Jizọs” aha na-eme ka amaokwu a guzoro onwe ya nke ọma dị ka ntinye akwụkwọ nsọ, n’enweghị mgbanwe onye a na-ekwu maka ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Usoro “wee na-agagharị ... na-akụzi ... na-ekwusa ... na-agwọkwa” na-echekwa omume ndị na-aga n’ihu n’otu oge. Enweghị akara nkọwa ụkwụ n’ihi na enweghị nkọwa dị mkpa a ga-etinye; akara [a] nke English POB yiri ka etinyere ya n’ebe na-ekwekọghị na ọdịnaya nkọwa ya, ya mere e mepụtaghị ya n’enweghị ihe akaebe sitere n’ederede Grik.
