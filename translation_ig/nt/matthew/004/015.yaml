id: MAT.4.15
reference: Matthew 4:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: ig
  text: “Ala Zebulun na ala Naftali, ụzọ nke oké osimiri, n’ofe Jọdan, Galili nke ndị mba ọzọ[a]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Galili nke mba dị iche iche.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γῆ / γῆ
  choice: Ala / ala
  rationale: “Ala” na-egosi mpaghara ebo ma na-edobe nkwughachi na usoro yiri ibe ya dị na Grik.
- source_word: Ζαβουλὼν
  choice: Zebulọn
  rationale: Ụdị aha a kwekọrọ n’otú a na-asụ ma na-ede aha ebo a n’Igbo.
- source_word: Νεφθαλίμ
  choice: Naftali
  rationale: Ụdị aha a bụ nke doro anya ma dị mfe ọgụgụ n’Igbo.
- source_word: ὁδὸν θαλάσσης
  choice: ụzọ nke oké osimiri
  rationale: 'Nsụgharị a na-edobe ahịrịokwu amụma ahụ na nghọta abụọ o nwere: ọ pụrụ ịbụ ụzọ ama ama ma ọ bụ mpaghara dị n’akụkụ oké osimiri.'
- source_word: πέραν τοῦ Ἰορδάνου
  choice: n’ofe Jọdan
  rationale: “N’ofe” na-edobe akpaalaokwu ala ahụ n’ekpebighị kpọmkwem akụkụ onye na-ekwu okwu nọ.
- source_word: Γαλιλαία
  choice: Galili
  rationale: Nke a bụ ụdị aha mpaghara ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: τῶν ἐθνῶν
  choice: nke ndị mba ọzọ
  rationale: N’ọnọdụ akụkọ Matiu na amaokwu Aịzaya a, okwu ahụ na-ezo aka karịsịa ná ndị na-abụghị ndị Juu, ọ bụghị naanị mba dị iche iche dịka ọchịchị.
theological_decisions:
- issue: Nsụgharị nke ἐθνῶν n’amaokwu e hotara n’Aịzaya
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: “Ndị mba ọzọ” na-egosipụta ọdịiche dị n’etiti ndị Juu na ndị na-abụghị ndị Juu nke okwu a nwere n’ọnọdụ a; ihe ọzọ okwu ahụ pụrụ ịpụta ka e debere n’okpuru peeji.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị ugwu ma dị mfe nghọta mee ihe. E debere usoro uri na nkwughachi nke amaokwu amụma ahụ, tinyere akara ogologo na-egosi na ahịrịokwu ahụ gara n’ihu n’amaokwu na-esote.
