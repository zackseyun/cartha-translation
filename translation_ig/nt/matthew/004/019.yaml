  source_fidelity: The draft preserves the summons, following relationship, future promise, and fishing metaphor. However, “ndị ọkụ azụ mmadụ” does not express the established Igbo verbal image for catching people as fish; its word order can instead suggest ‘people’s fishers’ and is less clear.
