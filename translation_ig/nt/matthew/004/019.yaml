  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: ig
  text: Ọ sịrị ha, “Bịanụ, soro m, aga m eme unu ndị na-akụ mmadụ azụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Ọ sịrị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a n’akụkọ a, Igbo na-ejikarị oge gara aga akọ ihe mere n’usoro akụkọ; nke a na-eme ka okwu ahụ bụrụ nke mmadụ na-aghọta nke ọma n’enweghị mgbanwe n’ihe ọ pụtara.
- source_word: Δεῦτε ὀπίσω μου
  choice: Bịanụ soro m
  rationale: “Bịanụ” na-egosipụta ọkpụkpọ dị na Δεῦτε, ebe “soro m” na-enye echiche nke ịga n’azụ Jizọs dị na ὀπίσω μου n’ụzọ Igbo nkịtị.
- source_word: ποιήσω ὑμᾶς
  choice: aga m eme unu
  rationale: Nke a na-edobe oge ọdịnihu na nkwa Jizọs na ọ ga-agbanwe ha ka ha bụrụ ụdị ndị ọ kpọrọ aha.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: ndị ọkụ azụ mmadụ
  rationale: “Ndị ọkụ azụ” bụ aha ọrụ dabara na ἁλιεῖς, ebe “mmadụ” na Igbo na-ezo aka n’ụmụ mmadụ n’ozuzu ya, dịka ἀνθρώπων si pụta ebe a.
theological_decisions:
- issue: Ihe atụ nke ἁλιεῖς ἀνθρώπων
  choice: ndị ọkụ azụ mmadụ
  alternative: ndị na-akụta mmadụ
  rationale: A hapụrụ ihe atụ nke ịkụ azụ ka o guzosie ike, n’ihi na Jizọs na-ekwu maka ọrụ ọhụrụ ndị na-eso ụzọ ya ga-arụ. E tinyebeghị nkọwa nke ụzọ ha ga-esi “kụta” mmadụ, ka a ghara idozi ihe atụ ahụ karịa ka isi mmalite si kwuo.
- issue: Mmekọahụ nwoke/nwanyị n’okwu ἀνθρώπων
  choice: mmadụ
  alternative: ụmụ mmadụ
  rationale: N’ebe a ἀνθρώπων pụtara mmadụ niile, ọ bụghị naanị ndị nwoke. Okwu Igbo “mmadụ” na-egosipụta nke ahụ n’enweghị ịgbakwunye nkọwa na-adịghị n’isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. “Bịanụ” na “unu” na-egosi na a na-agwa ihe karịrị otu onye okwu. A họọrọ usoro okwu a na-anụkarị n’Igbo kama idegharị historical present nke Grik n’ụzọ ga-ada ka ihe na-eme ugboro ugboro.
