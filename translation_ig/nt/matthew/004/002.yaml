  text: καὶ νηστεύσας ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα ὕστερον ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: ig
  text: Mgbe o buchara ọnụ ụbọchị iri anọ na abalị iri anọ, agụụ gụrụ ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “O buchara ọnụ ụbọchị iri anọ na abalị iri anọ; e mesịa, agụụ gụrụ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύσας
  choice: Mgbe o buchara ọnụ
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi. “Mgbe o buchara ọnụ” bụ Igbo doro anya ma na-egosi na ibu ọnụ ahụ ezuola tupu agụụ agụọ ya.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: ụbọchị iri anọ na abalị iri anọ
  rationale: Accusative a na-egosi ogologo oge; n'Igbo, a pụrụ ikwu oge ahụ ozugbo n'enweghị okwu mgbakwunye, ma ahịrịokwu ahụ ka na-egosi ogologo oge nke ọma.
- source_word: ὕστερον
  choice: Mgbe ... buchara
  rationale: A tụnyere ὕστερον na participle νηστεύσας n'usoro Igbo dị n'okike iji gosi na agụụ bịara mgbe ibu ọnụ ahụ gasịrị. Ihe ọzọ kwe omume bụ ikwu “e mesịa.”
- source_word: ἐπείνασεν
  choice: agụụ gụrụ ya
  rationale: Nke a bụ ụzọ Igbo dị ugbu a, nke doro anya, isi kwuo na mmadụ nwere ezigbo agụụ; ọ naghị etinye nkọwa ozizi karịrị ihe Greek kwuru.
- source_word: καὶ
  choice: Mgbe
  rationale: Njikọ καί na-aga n'ihu n'akụkọ ahụ, ma n'usoro Igbo, ịmalite na nkebi oge “Mgbe...” na-eme ka mmekọrịta dị n'etiti ibu ọnụ na agụụ pụta nke ọma n'enweghị itinye echiche ọhụrụ.
theological_decisions:
- issue: Nkọwa banyere ezigbo mkpa anụ ahụ Jizọs nwere mgbe o buchara ọnụ
  choice: agụụ gụrụ ya
  alternative: agụụ malitere ịgụ ya
  rationale: “Agụụ gụrụ ya” na-ekwupụta ezigbo agụụ mmadụ n'ụzọ nkịtị ma ghara ịgbasa ya ka ọ bụrụ nkwupụta ozizi pụrụ iche. Nhọrọ ọzọ na-eme ka mmalite ọnọdụ ahụ pụta ìhè karịa, ma ọ dị ntakịrị arọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ibu ọnụ” bụ okwu a na-ahụkarị maka izere nri n'ọnọdụ a; ahịrịokwu ahụ chekwara usoro oge nke Greek n'ụzọ Igbo dị n'okike.
