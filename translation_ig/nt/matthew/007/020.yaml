id: MAT.7.20
reference: Matthew 7:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: ig
  text: Ya mere[a], unu ga-eji mkpụrụ ha mata ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi ya n’ezie, unu ga-esite na mkpụrụ ha mata ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα γε
  choice: Ya mere
  rationale: Nkebiokwu a na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya, ya na ntakịrị nkwusi ike. “Ya mere” bụ ụzọ Igbo dị ugbu a ma dịkwa mfe isi gosipụta nke a.
- source_word: ἀπὸ
  choice: ga-eji
  rationale: N’ebe a, ἀπό na-egosi ihe a ga-adabere na ya iji mata ndị ahụ. Usoro “jiri ... mata” bụ ụzọ Igbo sitere n’okike isi kwuo ya.
- source_word: καρπῶν
  choice: mkpụrụ
  rationale: A hapụrụ ihe atụ nke mkpụrụ dịka ọ dị n’asụsụ Grik, kama ịkọwa ya ozugbo dịka omume ma ọ bụ ihe si n’omume pụta. N’Igbo, “mkpụrụ” nwere ike ịbụ otu n’ụdị okwu ya ma na-anọchi ma otu mkpụrụ ma ọtụtụ mkpụrụ dịka ọnọdụ siri dị.
- source_word: αὐτῶν
  choice: ha
  rationale: N’usoro “mkpụrụ ha,” “ha” na-egosi na mkpụrụ ndị ahụ bụ nke ndị a na-ekwu maka ha.
- source_word: ἐπιγνώσεσθε
  choice: unu ga-... mata
  rationale: Ngwaa ahụ bụ ọdịnihu, onye nke abụọ ọtụtụ, ma n’ọnọdụ a ọ pụtara ịmata ndị mmadụ site n’ihe àmà a na-ahụ anya. “Unu ga-eji ... mata” na-egosipụta nke a n’Igbo nkịtị.
- source_word: αὐτούς
  choice: ha
  rationale: Nnọchiaha a na-alaghachi n’ebe ndị a na-ekwu maka ha nọ; “ha” bụ ntụgharị Igbo doro anya.
theological_decisions:
- issue: Ojiji e ji “mkpụrụ” mee ihe atụ n’ịmata ụdị ndị mmadụ bụ
  choice: E debere ihe atụ ahụ dịka “mkpụrụ ha.”
  alternative: omume ha; ihe omume ha na-amịpụta
  rationale: Amaokwu ahụ na-ekwu na a ga-amata ha site n’ihe a na-ahụ na ndụ ha, ma okwu Grik n’onwe ya ji ihe atụ nke mkpụrụ mee ihe. Idebe ihe atụ ahụ na-ejikọta amaokwu a na ihe gbara ya gburugburu ma zere ịkọwa ya n’ụzọ dị warara karịa ihe odide ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “unu” iji chekwaa onye nke abụọ ọtụtụ dị na Grik; a hapụrụ ihe atụ “mkpụrụ” n’akwụghị ya dịka “omume” ma ọ bụ “ihe si na ya pụta.”
