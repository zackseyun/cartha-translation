review_pass:
  verdict: revise
  source_fidelity: The core contrast of the narrow gate with the wide gate and broad road is retained, as is the warning of destruction. The final phrase should express entry through rather than entry from the referent; the draft's “na-esikwa na ya abanye” can imply “also enter from it,” because -kwa introduces an unintended ‘also’ and the construction is not a clear equivalent of δι’ αὐτῆς.
  naturalness: “Banyenụ n’ọnụ ụzọ dị warara” is a more natural, concise Standard Igbo imperative than “Sitenụ n’ọnụ ụzọ dị warara banye.” Recasting the last clause as “ọtụtụ ndị na-esite na ya abanye” removes the unintended additive sense while preserving the pronoun’s ambiguity.
  terminology: “Mbibi” is an appropriate rendering of ἀπώλεια and avoids over-defining the theological outcome. The proposed alternative “ọdịda zuru oke” is not a sound lexical equivalent here; “ịla n’iyi” is sufficient as an alternative. “Ọnụ ụzọ,” “ụzọ,” “warara,” and “obosara” are suitable modern Standard Igbo terms.
  issues:
  - severity: medium
    issue: The phrase “na-esikwa na ya abanye” has an unintended additive and directional nuance.
    rationale: The element -kwa normally conveys ‘also,’ while “esi na” can suggest movement from a place. The Greek says that many enter through the referent (δι’ αὐτῆς), not that they also enter from it.
  - severity: low
    issue: The alternative “ọdịda zuru oke” for ἀπώλεια is semantically imprecise.
    rationale: It suggests complete failure or collapse rather than the destruction/ruin sense of ἀπώλεια in this warning.
  revised_text: Banyenụ n’ọnụ ụzọ dị warara. N’ihi na ọnụ ụzọ ahụ sara mbara, ụzọ ahụ dịkwa obosara, nke na-eduga ná mbibi[a]; ọtụtụ ndị na-esite na ya abanye.[b]
  revised_footnotes:
