    reason: referential_ambiguity
  revision_rationale: The revision improves idiomatic Standard Igbo and corrects the final verbal phrase so that it conveys entry through the referent without adding an ‘also’ sense. It retains the Greek pronoun’s grammatical ambiguity in the text and explanatory footnote, and it narrows the lexical note on ἀπώλεια to a defensible alternative without imposing a doctrinal interpretation.
