revisions:
- from: Sitenụ n’ọnụ ụzọ dị warara banye. N’ihi na ọnụ ụzọ ahụ sara mbara, ụzọ ahụ dịkwa obosara, nke na-eduga ná mbibi[a]; ọtụtụ ndị na-esikwa na ya abanye.[b]
  to: Banyenụ n’ọnụ ụzọ dị warara. N’ihi na ọnụ ụzọ ahụ sara mbara, ụzọ ahụ dịkwa obosara, nke na-eduga ná mbibi[a]; ọtụtụ ndị na-esite na ya abanye.[b]
  rationale: The revision improves idiomatic Standard Igbo and corrects the final verbal phrase so that it conveys entry through the referent without adding an ‘also’ sense. It retains the Greek pronoun’s grammatical ambiguity in the text and explanatory footnote, and it narrows the lexical note on ἀπώλεια to a defensible alternative without imposing a doctrinal interpretation.
