id: MAT.7.13
reference: Matthew 7:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: ig
  text: Banyenụ n’ọnụ ụzọ dị warara. N’ihi na ọnụ ụzọ ahụ sara mbara, ụzọ ahụ dịkwa obosara, nke na-eduga ná mbibi[a]; ọtụtụ ndị na-esite na ya abanye.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ἀπώλεια dịka “ịla n’iyi.”
    reason: lexical_alternative
  - marker: b
    text: “Ya” nwere ike izo aka n’ọnụ ụzọ ahụ ma ọ bụ n’ụzọ ahụ. N’asụsụ Grik, aha abụọ ahụ bụ aha nwanyị, ya mere ụdị nnọchiaha ahụ anaghị edozi nke ọ bụ.
    reason: referential_ambiguity
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: Sitenụ … banye
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ. Usoro a bụ Igbo dị ndụ ma na-egosipụta ịbanye site n’otu ebe.
- source_word: διὰ τῆς στενῆς πύλης
  choice: n’ọnụ ụzọ dị warara
  rationale: “N’ọnụ ụzọ” na-egosipụta ịgafe site na ya; “dị warara” na-echekwa ọdịiche ya na ọnụ ụzọ sara mbara.
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe mere e ji nye iwu ahụ.
- source_word: πλατεῖα ἡ πύλη
  choice: ọnụ ụzọ ahụ sara mbara
  rationale: Nke a bụ okwu Igbo nkịtị maka ọnụ ụzọ nke obosara ya buru ibu, ma na-echekwa nkwusi ike dị n’asụsụ Grik.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: ụzọ ahụ dịkwa obosara
  rationale: εὐρύχωρος nwere echiche nke ịdị obosara ma ọ bụ inwe nnukwu ohere; “dị obosara” dabara n’oyiyi nke ụzọ ma dị mfe nghọta.
- source_word: ἡ ἀπάγουσα
  choice: nke na-eduga
  rationale: Ọ na-echekwa omume na-aga n’ihu nke ụzọ ahụ na-eburu ndị nọ na ya ruo n’ebe njedebe.
- source_word: εἰς τὴν ἀπώλειαν
  choice: ná mbibi
  rationale: “Mbibi” na-egosipụta njedebe dị egwu nke ἀπώλεια n’enweghị ịkọwa ya n’ụzọ okpukpe karịrị ihe amaokwu ahụ kwuru.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: ọtụtụ ndị na-esikwa na ya abanye
  rationale: Ọ na-etinye “ọtụtụ” n’ihu dị ka Grik si mee, ma hapụ “ya” ka ọ ghara idozi kpamkpam ihe nnọchiaha ahụ na-ezo aka na ya.
theological_decisions:
- issue: Ihe ἀπώλεια pụtara n’ịdọ aka ná ntị Jizọs
  choice: mbibi
  alternative: ịla n’iyi; ọdịda zuru oke
  rationale: “Mbibi” na-echekwa ịdị arọ nke ịdọ aka ná ntị ahụ, ma ọ naghị etinye nkọwa zuru ezu banyere ọdịdị njedebe ahụ karịa ihe ederede kwuru.
- issue: Ihe αὐτῆς na-ezo aka na ya n’ahịrị ikpeazụ
  choice: ya
  alternative: ọnụ ụzọ ahụ; ụzọ ahụ
  rationale: Ma πύλη (“ọnụ ụzọ”) ma ὁδός (“ụzọ”) bụ aha nwanyị n’asụsụ Grik, ya mere ụdị αὐτῆς n’onwe ya anaghị edozi ihe ọ na-ezo aka na ya. “Ya” na-echekwa enweghị ido anya ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Sitenụ … banye” na-egosipụta iwu e nyere ọtụtụ ndị; “ọnụ ụzọ sara mbara” na “ụzọ dị obosara” na-echekwa ọdịiche oyiyi dị n’ederede. E zere okwu pụrụ iche nke otu ụka ma ọ bụ ozizi.
