id: MAT.7.28
reference: Matthew 7:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: ig
  text: O wee mee[b] na, mgbe Jizọs kwuchara okwu ndị a[a], ìgwè mmadụ ndị ahụ tụrụ n’anya n’ihi ozizi ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘okwu nkuzi ndị a.’
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ dị mfe karị: ‘Mgbe Jizọs kwuchara.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: O wee ruo
  rationale: Nke a na-egosipụta usoro akụkọ nke na-ejikọta ihe a na ihe gara aga. Ọ bụ okwu Igbo dị ugwu ma dịkwa nghọta, na-enweghị iji okwu ochie siri ike.
- source_word: ὅτε
  choice: na mgbe
  rationale: Ọ na-ebute nkebiokwu oge nke na-akọ mgbe mmeghachi omume ìgwè mmadụ ahụ mere, ma na-echekwa usoro Καὶ ἐγένετο ὅτε.
- source_word: ἐτέλεσεν
  choice: kwuchara
  rationale: N’ebe a, ngwaa a pụtara na Jizọs mezuru ikwu okwu ya. ‘Kwuchara’ na-egosipụta mmecha ahụ n’Igbo nkịtị karịa nsụgharị nkịtị dịka ‘mezuchara.’
- source_word: τοὺς λόγους τούτους
  choice: okwu ndị a
  rationale: ‘Okwu ndị a’ na-echekwa ma λόγους ma ike ngosipụta nke τούτους, ma na-ezo aka n’ihe Jizọs kwuru ugbu a n’emeghị ka ọ bụrụ aha nkọwa pụrụ iche.
- source_word: ἐξεπλήσσοντο
  choice: tụrụ n’anya
  rationale: Nke a na-egosipụta oke ihe ijuanya nke ìgwè mmadụ ahụ n’asụsụ Igbo dị ugbu a ma dịkwa ugwu.
- source_word: οἱ ὄχλοι
  choice: ìgwè mmadụ ndị ahụ
  rationale: Ụdị a na-egosipụta ọtụtụ ìgwè dị na plural Greek, kama ime ka ha bụrụ naanị otu ìgwè.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: maka ozizi ya
  rationale: ‘Maka’ na-egosipụta na ozizi Jizọs bụ ihe kpatara ma ọ bụ ihe ndabere nke ijuanya ha; ‘ozizi ya’ na-asụgharị διδαχῇ αὐτοῦ n’ụzọ doro anya.
theological_decisions:
- issue: Ihe ‘okwu ndị a’ na-ezo aka na ya
  choice: E debere ya dịka ‘okwu ndị a,’ nke na-ezo aka n’ozizi Jizọs kwuru ozugbo tupu amaokwu a.
  alternative: ‘okwu nkuzi ndị a’ ma ọ bụ ‘okwuchukwu a’
  rationale: Greek ekwughị aha pụrụ iche dịka ‘okwuchukwu.’ Nsụgharị a na-echekwa ntụaka ahụ n’enweghị itinye nkọwa ụka ma ọ bụ aha e nyere akụkụ ahụ mgbe e mesịrị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. ‘O wee ruo’ na-echekwa usoro akụkọ Greek, ebe ‘kwuchara’ na ‘tụrụ n’anya’ na-eme ka amaokwu ahụ daa ka Igbo eke.
