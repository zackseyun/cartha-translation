    text: A pụkwara ịsụgharị ya, ‘okwu nkuzi ndị a.’
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ dị mfe karị: ‘Mgbe Jizọs kwuchara.’'
    reason: lexical_alternative
  revision_rationale: The revision corrects the unnatural calque at the opening while preserving the Greek narrative transition, temporal relationship, completed action, plural crowds, and their astonishment at Jesus’ teaching. Footnote anchors are retained and remain correctly placed.
