id: MAT.7.11
reference: Matthew 7:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: ig
  text: Ya mere, ọ bụrụ na unu bụ ndị ọjọọ ma unu maara otú e si enye ụmụ unu onyinye ọma, lee ka Nna unu nke nọ n’eluigwe[a] ga-aka enye ndị na-arịọ ya ihe ọma[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grik ji ụdị ọtụtụ mee ihe n’ebe a: “n’eluigwe.” A pụkwara ịtụgharị ya n’ụzọ omenala dịka “Nna unu nọ n’eluigwe.”'
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ nsụgharị na-ekwu “onyinye ọma” n’ahịrị nke abụọ, ma Grik kwuru naanị “ihe ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ ὄντες
  choice: ebe unu bụ ndị ọjọọ
  rationale: Nke a na-edobe nkọwa ahụ kpọmkwem na mmadụ ndị Jizọs na-agwa okwu bụ ndị ọjọọ, n’enweghị ime ka ọ dị nro ma ọ bụ ịgbakwụnye ozizi ọzọ.
- source_word: οἴδατε ... διδόναι
  choice: maara otú e si enye
  rationale: Nkebiokwu a na-egosi ịma ụzọ ma ọ bụ inwe ikike ime ihe, ọ bụghị naanị ịmata otu eziokwu.
- source_word: δόματα ἀγαθὰ
  choice: ezi onyinye
  rationale: “Onyinye” na-anọchi δόματα n'ụzọ doro anya, “ezi” na-akọwakwa ụdị onyinye ahụ.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: ụmụ unu
  rationale: “Ụmụ” gụnyere ma ụmụ nwoke ma ụmụ nwanyị ma bụrụkwa okwu Igbo a na-ejikarị eme ihe n’ụzọ ebumpụta ụwa.
- source_word: πόσῳ μᾶλλον
  choice: lee ka ... karịa nke ukwuu
  rationale: Nke a na-egosipụta arụmụka sitere n’ihe nta gaa n’ihe ka ukwuu ma na-ada nke ọma n’Igbo.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: Nna unu nke nọ n’eluigwe
  rationale: A hapụrụ “Nna unu” dị ka aha, ebe nkebiokwu na-esochi ya na-egosi ebe ọ nọ. “Eluigwe” bụ okwu Igbo nkịtị nke nwere ike ịkọwa ógbè eluigwe ahụ n’enweghị ntụgharị na-adịghị ebumpụta ụwa.
- source_word: δώσει ἀγαθὰ
  choice: ga-enye ... ezi ihe
  rationale: E degharịghị “onyinye” n’ahịrị nke abụọ n’ihi na Grik dekwara naanị adjective e ji mee noun, ya bụ “ezi ihe.”
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: ndị na-arịọ ya
  rationale: Nke a na-egosipụta ndị na-arịọ ya n’ozuzu ha ma na-ada nke ọma n’Igbo.
theological_decisions:
- issue: Ike okwu “ebe unu bụ ndị ọjọọ” gbasara ọnọdụ mmadụ
  choice: Edobere nkọwa kpọmkwem na ndị a na-agwa okwu bụ ndị ọjọọ.
  alternative: “ọ bụ ezie na unu ezughị oke” ma ọ bụ “unu bụ ndị mmehie”
  rationale: Nke a na-echekwa esemokwu dị n’etiti ịdị njọ mmadụ na ịdị mma Nna, ma ọ naghị eme ka okwu ahụ dị nro ma ọ bụ tinye ozizi zuru ezu banyere ọdịdị mmehie mmadụ.
- issue: Nọmba ọtụtụ dị na ὁ ἐν τοῖς οὐρανοῖς
  choice: “n’eluigwe,” ya na nkọwa ala peeji banyere ụdị ọtụtụ nke Grik
  alternative: “Nna unu nke eluigwe” ma ọ bụ ntụgharị nkịtị dịka “n’eluigwe dị iche iche”
  rationale: Igbo anaghị egosipụta ọtụtụ aha ihe n’otu ụzọ Grik si eme ya, “n’eluigwe” bụkwa okwu ebumpụta ụwa. Nkọwa ala peeji na-echekwa ihe akaebe nke ụdị ọtụtụ n’asụsụ mbụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ usoro mkpu “lee ka ... karịa nke ukwuu” iji mee ka arụmụka πόσῳ μᾶλλον pụta ìhè n’ụzọ Igbo ebumpụta ụwa, ebe a nọgidere na-edobe ọdịiche dị n’etiti “ezi onyinye” na “ezi ihe.”
