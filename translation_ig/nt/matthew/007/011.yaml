revisions:
- from: Ya mere, ọ bụrụ na unu, ebe unu bụ ndị ọjọọ, maara otú e si enye ụmụ unu ezi onyinye, lee ka Nna unu nke nọ n’eluigwe[a] ga-esi nye ndị na-arịọ ya ezi ihe[b] karịa nke ukwuu!
  to: Ya mere, ọ bụrụ na unu bụ ndị ọjọọ ma unu maara otú e si enye ụmụ unu onyinye ọma, lee ka Nna unu nke nọ n’eluigwe[a] ga-aka enye ndị na-arịọ ya ihe ọma[b]!
  rationale: The revision retains the source-text distinctions and the plural-heavens note, while replacing the strained comparative construction with an idiomatic Igbo a-fortiori expression. It also uses more natural noun-adjective collocations without altering meaning.
