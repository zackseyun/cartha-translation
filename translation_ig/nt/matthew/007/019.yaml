base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: ig
  text: Osisi ọ bụla nke na-adịghị amị ezi mkpụrụ[a], a na-egbutu ya, a na-atụbakwa ya n’ọkụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-adịghị ewepụta ezi mkpụrụ.”
    reason: lexical_alternative
  - marker: b
    text: “Ọkụ” bụ ihe atụ nke ikpe; amaokwu a n’onwe ya akọwaghị kpọmkwem ma ihe e mesiri ike bụ ikpe n’oge a, ikpe nke oge ọgwụgwụ, ka ọ bụ ha abụọ.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: Osisi ọ bụla
  rationale: πᾶν ya na aha otu δένδρον na-ekesa echiche ahụ n’osisi n’osisi; “osisi ọ bụla” bụ ụzọ Igbo doro anya ma dịkwa eke.
- source_word: μὴ ποιοῦν
  choice: nke na-adịghị amị
  rationale: Ọ bụ participle nke na-egosi omume e ji mara osisi ahụ. N’Igbo, a na-asịkarị na osisi “na-amị mkpụrụ”; nke a bụ ntụgharị eke nke echiche ποιέω n’ebe a.
- source_word: καρπὸν καλὸν
  choice: ezi mkpụrụ
  rationale: “Ezi mkpụrụ” na-egosi mkpụrụ dị mma ma na-edobekwa uru omume ọma nke okwu a nwere n’okwu gbara ya gburugburu.
- source_word: ἐκκόπτεται
  choice: a na-egbutu ya
  rationale: Passive present a na-egosi ihe a na-eme osisi dị otu a. “A na-egbutu ya” bụ okwu Igbo nkịtị maka igbutu osisi.
- source_word: εἰς πῦρ βάλλεται
  choice: tụba ya n’ọkụ
  rationale: Nke a na-edobe mmegharị banye n’ọkụ na olu passive nke Grik site n’usoro Igbo e jikọtara ya na “a na-”; ọ naghị akọwa ọkụ ahụ karịa ihe amaokwu ahụ kwuru.
theological_decisions:
- issue: Ihe atụ nke ọkụ dịka ikpe
  choice: E debere ihe atụ nke igbutu osisi na ịtụba ya n’ọkụ, n’akọwaghị kpọmkwem ihe ọkụ ahụ na-anọchi anya ya.
  alternative: Ịkọwa ya kpọmkwem dịka ikpe nke oge a, ikpe nke ọgwụgwụ ụwa, ma ọ bụ hel.
  rationale: Amaokwu ahụ na-enye ịdọ aka ná ntị banyere ikpe site n’ihe atụ ọrụ ugbo, ma ya onwe ya akọwaghị oge ma ọ bụ ụdị ikpe ahụ kpọmkwem. Ya mere, ntụgharị ahụ na-edobe mgbagwoju anya na nrụgide nkà mmụta okpukpe dị n’isi mmalite.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “amị mkpụrụ” mee ihe n’ihi na ọ bụ akpaalaokwu Igbo kacha eke maka osisi na mkpụrụ; e zere ịkpọ ọkụ ahụ “hel” ka a ghara itinye nkọwa okpukpe karịrị ihe Grik kwuru.
