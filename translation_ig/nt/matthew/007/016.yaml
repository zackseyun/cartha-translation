id: MAT.7.16
reference: Matthew 7:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: ig
  text: Unu ga-amata ha site ná mkpụrụ ha[a]. Ndị mmadụ hà na-aghọrọ mkpụrụ vaịn n’osisi ogwu, ma ọ bụ mkpụrụ fig n’ahịhịa ogwu[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu ga-eji mkpụrụ ha mara ha.”
    reason: lexical_alternative
  - marker: b
    text: 'Ajụjụ a na-atụ anya azịza mba: ndị mmadụ anaghị aghọrọ mkpụrụ vaịn n’osisi ogwu ma ọ bụ mkpụrụ fig n’ahịhịa ogwu.'
    reason: discourse_clarification
lexical_decisions:
- source_word: καρπῶν
  choice: mkpụrụ
  rationale: “Mkpụrụ” bụ okwu Igbo na-arụ ọrụ nke ọma ma maka mkpụrụ osisi nkịtị ma maka ihe omume ma ọ bụ ihe si ná ndụ mmadụ pụta; ya mere, ọ na-edobe ihe atụ ahụ n’enweghị ịkọwa ya karịa ihe odide Grik.
- source_word: ἐπιγνώσεσθε
  choice: unu ga-amata
  rationale: Oge ọdịnihu nke ngwaa a na-egosi na a ga-amata ndị ahụ site n’ihe a hụrụ n’aka ha. “Ga-amata” bụ okwu Igbo doro anya ma ọ naghị agbakwunye echiche nke ịmata ha n’ụzọ zuru oke.
- source_word: μήτι
  choice: hà na-
  rationale: “Hà na-...?” na-eme ka ajụjụ ahụ bụrụ nke na-atụ anya azịza mba, dịka μήτι si arụ ọrụ n’asụsụ Grik.
- source_word: συλλέγουσιν
  choice: na-aghọrọ
  rationale: “Ịghọrọ” dabara n’ịchịkọta mkpụrụ sitere n’osisi ma na-edobe ihe atụ ọrụ ugbo.
- source_word: ἀκανθῶν
  choice: osisi ogwu
  rationale: Okwu ahụ nwere ike ịpụta ogwu ma ọ bụ osisi ogwu; “osisi ogwu” na-eme ka isi ebe a na-achọ ịghọrọ mkpụrụ pụta ìhè n’Igbo.
- source_word: σταφυλάς
  choice: mkpụrụ vaịn
  rationale: Nke a bụ aha Igbo a na-aghọta nke ọma maka grapes ma na-egosi ọtụtụ mkpụrụ n’ụyọkọ.
- source_word: τριβόλων
  choice: ahịhịa ogwu
  rationale: τρίβολος na-ezo aka n’ahịhịa ma ọ bụ osisi nta nwere ogwu. “Ahịhịa ogwu” bụ okwu sara mbara nke na-adịghị ekpebi ụdị osisi ahụ karịa ihe Grik kwuru.
- source_word: σῦκα
  choice: mkpụrụ fig
  rationale: Nke a bụ ntụgharị aha mkpụrụ ahụ n’ụzọ ndị na-agụ Igbo nke oge a ga-aghọta.
- source_word: αὐτῶν / αὐτούς
  choice: ha / ha
  rationale: 'Nnọchiaha ndị a na-ezo aka n’ebe ndị a na-ekwu banyere ha nọ; Igbo na-edobe njikọ ahụ n’ụzọ nkịtị: “mkpụrụ ha ... amata ha.”'
theological_decisions:
- issue: Ihe “mkpụrụ” pụtara mgbe a na-amata ụdị mmadụ ha bụ
  choice: E debere ihe atụ ahụ dịka “mkpụrụ ha.”
  alternative: “Omume ha” ma ọ bụ “ihe si n’ọrụ ha pụta.”
  rationale: Ihe odide ahụ ji mkpụrụ osisi mee ihe atụ ma hapụ onye na-agụ ya ka ọ ghọta ihe ọ na-anọchi anya ya. Ide “omume” ma ọ bụ “nsonaazụ” ga-eme ka ihe nwere ike ịdị sara mbara bụrụ naanị otu nkọwa.
- issue: Ụdị azịza ajụjụ ahụ na-atụ anya ya
  choice: E ji “hà na-...?” gosipụta ajụjụ na-atụ anya azịza mba.
  alternative: Ikwupụta ya ozugbo dịka “Ndị mmadụ adịghị aghọrọ...”
  rationale: Ajụjụ ahụ bụ ajụjụ nkwupụta na Grik, ọ bụghị naanị ahịrịokwu na-agọnahụ ihe. Ịhapụ ya dịka ajụjụ na-edobe ike na usoro okwu Jizọs.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Mkpụrụ” na-edobe ma ihe osise ọrụ ugbo ma ihe atụ ime mmụọ. E ji “osisi ogwu” na “ahịhịa ogwu” gosi ọdịiche dị n’etiti ἀκάνθαι na τρίβολοι n’enweghị ịkpọ aha ụdị ahịhịa a na-amaghị nke ọma n’etiti ndị na-agụ Igbo.
