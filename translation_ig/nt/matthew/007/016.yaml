  verdict: approve
  source_fidelity: The Igbo accurately preserves the future assertion, the personal pronouns, the fruit metaphor, and the two-part rhetorical question that expects a negative reply. “Unu ga-amata ha site ná mkpụrụ ha” appropriately renders ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. The renderings “osisi ogwu” and “ahịhịa ogwu” reasonably distinguish the two prickly-plant terms without claiming an unwarranted botanical precision.
  naturalness: The wording is clear, modern Standard Igbo, and suitably dignified. “Ndị mmadụ hà na-aghọrọ ...?” is a natural rhetorical-question form, and the agricultural image is readily intelligible.
  terminology: “Mkpụrụ” properly retains the concrete and metaphorical force of καρποί. “Mkpụrụ vaịn” and “mkpụrụ fig” are understandable current terms. No doctrinal interpretation has been added.
