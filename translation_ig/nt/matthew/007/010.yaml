id: MAT.7.10
reference: Matthew 7:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: ig
  text: Ma ọ bụkwanụ, ọ bụrụ na ọ rịọ ya azụ̀—ọ̀ ga-enye ya agwọ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Ma ọ bụkwanụ
  rationale: Ọ na-ewebata ihe atụ nke abụọ n’usoro ajụjụ abụọ ahụ. “Ma ọ bụkwanụ” bụ Igbo nkịtị nke na-egosi na nke a bụ ihe atụ ọzọ, na-enweghị ime ka καί pụta ihe karịrị otú o kwesịrị.
- source_word: ἰχθὺν
  choice: azụ̀
  rationale: N’ebe a, okwu ahụ pụtara azụ̀ a na-arịọ dị ka nri.
- source_word: αἰτήσει
  choice: ọ bụrụ na ọ rịọ ya
  rationale: Ọ bụ ngwaa ọdịnihu e ji mee ihe atụ yiri ọnọdụ. Usoro “ọ bụrụ na” na-eme ka nke a daa nke ọma n’Igbo; “ya” na-egosi onye a na-arịọ, nke a na-amata site n’okwu gbara amaokwu ahụ gburugburu.
- source_word: μὴ
  choice: ọ̀ ... ?
  rationale: μή na-egosi ajụjụ a na-atụ anya ka azịza ya bụrụ mba. Ụdị ajụjụ “ọ̀ ...?” na-eburu ike ajụjụ arụmụka ahụ n’Igbo; ihe atụ ahụ n’onwe ya na-eme ka azịza a tụrụ anya ya doo anya.
- source_word: ὄφιν
  choice: agwọ
  rationale: “Agwọ” bụ okwu Igbo nkịtị ma doo anya maka anụmanụ ahụ; ọ naghị etinye nkọwa okpukpe na-adịghị n’okwu Grik.
- source_word: ἐπιδώσει
  choice: ga-enye
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara inye mmadụ ihe. “Ga-enye” na-echekwa ọdịnihu nke Grik ma bụrụkwa okwu nkịtị n’Igbo.
- source_word: αὐτῷ
  choice: ya
  rationale: Ọ bụ onye a na-enye ihe. Igbo na-egosipụta ya n'ụzọ dị mfe site n’ịsị “nye ya.”
theological_decisions:
- issue: Ike ajụjụ a na-atụ anya azịza na-adịghị mma
  choice: 'E debere ya dịka ajụjụ: “ọ̀ ga-enye ya agwọ?”'
  alternative: 'Ikwu ya dịka nkwupụta: “ọ gaghị enye ya agwọ”'
  rationale: μή na-egosi na onye na-ekwu okwu na-atụ anya azịza “mba.” Idebe ya dịka ajụjụ na-echekwa usoro arụmụka Jizọs, kama ịgbanwe ya ka ọ bụrụ nkwupụta nkịtị.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. A na-eji akara ogologo (—) gosi nkwụsị siri ike tupu ajụjụ ahụ, dịka nhazi ederede isi mmalite si dị. “Agwọ” bụ okwu nkịtị ma kwekọọ ma ‘snake’ ma ‘serpent,’ ya mere nkọwa ala peeji adịghị mkpa.
