id: MAT.7.14
reference: Matthew 7:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: ig
  text: N’ihi na ọnụ ụzọ ahụ dị warara, ụzọ ahụ nke na-eduga ná ndụ dịkwa siri ike, ndị na-achọta ya dịkwa ole na ole.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενὴ
  choice: dị warara
  rationale: Na-egosipụta kpọmkwem na ọnụ ụzọ ahụ adịghị obosara, n’Igbo nkịtị ma doo anya.
- source_word: τεθλιμμένη
  choice: siri ike
  rationale: Okwu Grik a na-egosi ụzọ a pịara apị ma ọ bụ nke nwere mkpagbu; “siri ike” na-enye echiche nke ihe ịma aka n’Igbo eke n’enweghị ịkọwa ihe oyiyi ahụ gabiga ókè.
- source_word: ἀπάγουσα εἰς τὴν ζωήν
  choice: na-eduga ná ndụ
  rationale: Na-echekwa echiche nke ụzọ na-ebuga mmadụ n’ebe ndụ dị, ma hapụ “ndụ” ka ọ nwee ịdị omimi ya n’okwu a.
- source_word: ὀλίγοι ... οἱ εὑρίσκοντες αὐτήν
  choice: ndị na-achọta ya dịkwa ole na ole
  rationale: Ọ bụ ntụgharị doro anya na nke eke nke na-echekwa nrụtụ aka nke αὐτήν n’ụzọ ahụ.
theological_decisions:
- issue: Ihe “ndụ” pụtara
  choice: ndụ
  alternative: ndụ ebighị ebi
  rationale: E tinyeghị “ebighị ebi” n’amaokwu Grik; ide naanị “ndụ” na-echekwa mkpụmkpụ na obosara ihe okwu ahụ nwere.
- issue: Ike nke ụzọ ahụ
  choice: siri ike
  alternative: dị mkpagide / a pịara apị
  rationale: “Siri ike” kwekọrọ na ntụgharị ndụmọdụ Bekee ma na-egosi na ụzọ ahụ abụghị nke dị mfe, n’etinyeghị nkọwa okpukpe pụrụ iche.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa nhazi ihe oyiyi abụọ—ọnụ ụzọ dị warara na ụzọ siri ike—na-enweghị ịgbakwunye nkọwa na-adịghị na isi mmalite.
