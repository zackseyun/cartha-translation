review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the narrow gate, the way leading to life, and the few who find it. However, its word order makes “siri ike” most naturally modify “ndụ” (“a hard life”), rather than the way, whereas τεθλιμμένη predicates the condition of ἡ ὁδός (“the way”).
  naturalness: The wording is generally modern Standard Igbo, but “ụzọ ahụ na-edugakwa ná ndụ siri ike” is syntactically ambiguous and likely conveys the wrong attachment. Reordering makes the intended sense clear and idiomatic.
  terminology: “ọnụ ụzọ,” “warara,” “ndụ,” and “ndị na-achọta ya” are appropriate. “siri ike” is an acceptable contextual rendering of τεθλιμμένη, provided it explicitly describes ụzọ rather than ndụ. “Ndụ” should remain unexpanded, since the Greek does not say “eternal life.”
  issues:
  - severity: medium
    issue: Modifier attachment in “ụzọ ahụ na-edugakwa ná ndụ siri ike”
    rationale: In Igbo, “siri ike” in this position naturally qualifies “ndụ,” producing “the way leads to a hard life.” The Greek instead says that the way which leads to life is constrained/hard.
  revised_text: N’ihi na ọnụ ụzọ ahụ dị warara, ụzọ ahụ nke na-eduga ná ndụ dịkwa siri ike, ndị na-achọta ya dịkwa ole na ole.
