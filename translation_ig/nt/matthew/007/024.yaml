    issue: Ambiguous passive comparison construction
    rationale: In the main text, “a ga-eji ya tụnyere nwoke maara ihe” leaves the object/comparand relationship unclear in Igbo. The Greek ὁμοιωθήσεται means that the hearer-doer is the one compared or likened to the wise man; “A ga-atụnyere ya na nwoke maara ihe” states this directly.
  - severity: low
    issue: Footnote a contains an unclear alternative
    rationale: “A ga-eji ya mee ihe atụ dịka” is incomplete/awkward as an alternative rendering. A direct passive alternative such as “a ga-eme ka ọ dị ka” communicates the lexical option clearly.
