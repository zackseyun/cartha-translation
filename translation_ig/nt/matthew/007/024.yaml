review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the inferential force of οὖν, the generic scope of Πᾶς ὅστις, the hearing-and-doing sequence, the masculine illustrative referent (ἀνδρί), possession of the house, and the rock imagery. However, “a ga-eji ya tụnyere nwoke maara ihe” is not a fully clear Igbo passive comparison construction: it can suggest using the person as a means to compare something else. “A ga-atụnyere ya na nwoke maara ihe” directly expresses the Greek future passive, ‘will be compared/likened to a wise man.’'
  naturalness: The register and vocabulary are generally natural Standard Igbo. The revised comparison clause is clearer and more idiomatic. The alternative wording in footnote a should likewise use an unambiguous comparison construction.
  terminology: “okwu m ndị a,” “na-eme ha,” “nwoke maara ihe,” “ụlọ ya,” and “n’elu nkume” are suitable and retain the source imagery without theological expansion. The masculine cultural note is appropriate because ἀνήρ is specifically male in the comparison.
  issues:
