id: MAT.7.24
reference: Matthew 7:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: ig
  text: Ya mere, onye ọ bụla nke na-anụ okwu m ndị a ma na-eme ha, a ga-atụnyere ya na nwoke maara ihe[b], onye wuru ụlọ ya n’elu nkume.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a ga-eme ka ọ dị ka” ma ọ bụ “a ga-atụnyere ya.”
    reason: lexical_alternative
  - marker: b
    text: Grik kwuru kpọmkwem, “nwoke maara ihe”; n’asụsụ isi mmalite, onye e ji mee ntụnyere a bụ nwoke.
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Ya mere, onye ọ bụla nke
  rationale: “Onye ọ bụla nke” na-egosipụta na okwu a metụtara onye ọbụla n’otu n’otu, ebe “Ya mere” na-edobe njikọ nkwubi okwu οὖν nwere na nkuzi bu ya ụzọ.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: na-anụ okwu m ndị a
  rationale: Nsụgharị a na-edobe “okwu” maka λόγους na njikọ nke μου (“m”), ma bụrụkwa okwu Igbo doro anya ma dị mfe.
- source_word: καὶ ποιεῖ αὐτούς
  choice: ma na-eme ha
  rationale: ποιεῖ n’ebe a pụtara ime ihe okwu ndị ahụ kwuru; “na-eme ha” na-edobe ụzọ okwu Grik si kwuo ya nkenke na myirịta dị n’etiti ịnụ na ime.
- source_word: ὁμοιωθήσεται
  choice: a ga-eji ya tụnyere
  rationale: Ụdị ọdịnihu nke ngwaa a na-anabata echiche nke ‘ịtụnyere’ n’enweghị ịkọwapụta onye ga-eme ntụnyere ahụ.
- source_word: ἀνδρὶ φρονίμῳ
  choice: nwoke maara ihe
  rationale: ἀνήρ na-egosi nwoke kpọmkwem, ebe φρόνιμος na-akọwa onye nwere amamihe na ezi uche; “maara ihe” bụ ụzọ Igbo nkịtị si egosipụta ya n’ebe a.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: onye wuru ụlọ ya
  rationale: “Wuru ụlọ ya” na-edobe ma omume iwu ụlọ ma nnọchiaha nke na-egosi na ụlọ ahụ bụ nke nwoke ahụ.
- source_word: ἐπὶ τὴν πέτραν
  choice: n’elu nkume
  rationale: “Nkume” na-edobe ihe atụ πέτρα n’enweghị ịgbakwụnye nkọwa na ọ bụ nkume ntọala ma ọ bụ ụdị nkume pụrụ iche.
theological_decisions:
- issue: Asụsụ nwoke e ji mee onye nnọchianya n’ihe atụ ahụ
  choice: nwoke maara ihe
  alternative: onye maara ihe
  rationale: Ọ bụ ezie na mmalite amaokwu ahụ metụtara “onye ọ bụla,” Grik ji ἀνήρ, nke pụtara nwoke, mee onye nọ n’ihe atụ ahụ. Ya mere, e debere ụdị nwoke ahụ n’enweghị ime ka okwu niile bụrụ naanị maka ụmụ nwoke.
- issue: Ige ntị na ime okwu Jizọs
  choice: na-anụ okwu m ndị a ma na-eme ha
  alternative: na-ege okwu m ndị a ntị ma na-etinye ha n’ọrụ
  rationale: E debere ngwaa abụọ ahụ n’ụzọ kpọmkwem iji ghara ịgbakwunye nkọwa banyere otú ime okwu ahụ ga-adị, ma ka esemokwu dị n’etiti ịnụ na ime pụta ìhè.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe njikọ nkwubi okwu, myirịta nke ịnụ na ime, na ihe atụ ụlọ e wuru n’elu nkume.
