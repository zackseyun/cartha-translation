revisions:
- from: Mmiri ozuzo wee da, osimiri wee bịa[a], ifufe wee fe, dakwasịkwa ụlọ ahụ[b]. Ma ụlọ ahụ adaghị, n’ihi na a tọrọ ntọala ya n’elu nkume ahụ.
  to: Mmiri ozuzo wee daa, osimiri wee bịa[a], ifufe wee fere, ha niile wee dakwasị ụlọ ahụ[b]; ụlọ ahụ adaghị, n’ihi na a tọrọ ntọala ya n’elu nkume ahụ.
  rationale: The revision explicitly links the storm elements collectively to their impact on the house, uses idiomatic narrative verb forms, and replaces an inaccurate lexical alternative in footnote b. It otherwise preserves the source’s sequence, imagery, and ambiguity.
  reviewer_model: gpt-5.6-terra
