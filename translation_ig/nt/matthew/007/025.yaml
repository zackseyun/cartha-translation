review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the rain, rivers, winds, the house’s not falling, and its prior foundation on the rock. However, its final storm verb is grammatically left with ‘ifufe’ (wind[s]) as its apparent subject, whereas Greek προσέπεσαν is plural and naturally gathers the preceding storm elements as coming/falling against the house. The revised wording makes this collective action explicit. The alternative ‘kụgide’ in footnote b does not accurately express προσπίπτω in this context.
  naturalness: The revised narrative verb forms (‘daa,’ ‘fere’) and collective phrase ‘ha niile’ are natural, clear Standard Igbo. They retain the compact, formal-parabolic register while avoiding the impression that only the winds struck the house.
  terminology: ‘osimiri,’ ‘ụlọ,’ ‘ntọala,’ and ‘nkume’ are appropriate. ‘N’elu nkume ahụ’ preserves the unelaborated parabolic image and does not import a theological identification. The footnote for ποταμοί appropriately retains ‘ide mmiri’ only as an alternative.
  issues:
  - severity: medium
    issue: The main clause ‘ifufe wee fe, dakwasịkwa ụlọ ahụ’ makes the winds alone appear to be the subject of ‘dakwasị.’
    rationale: Greek uses plural προσέπεσαν after rain, rivers, and winds have all been introduced; the wording should permit or express their collective force against the house.
  - severity: medium
    issue: Footnote b offers ‘kụgide ụlọ ahụ’ as an alternative for προσέπεσαν.
    rationale: ‘Kụgide’ means to fasten/attach and does not convey falling, striking, or beating against the house. A faithful alternative should use falling upon or striking against.
  revised_text: Mmiri ozuzo wee daa, osimiri wee bịa[a], ifufe wee fere, ha niile wee dakwasị ụlọ ahụ[b]; ụlọ ahụ adaghị, n’ihi na a tọrọ ntọala ya n’elu nkume ahụ.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ide mmiri wee bịa”; okwu Grik ahụ pụtara n’ụzọ nkịtị “osimiri.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dara n’elu ụlọ ahụ” ma ọ bụ “kụrụ ụlọ ahụ.”
    reason: lexical_alternative
  revision_rationale: The revision explicitly links the storm elements collectively to their impact on the house, uses idiomatic narrative verb forms, and replaces an inaccurate lexical alternative in footnote b. It otherwise preserves the source’s sequence, imagery, and ambiguity.
