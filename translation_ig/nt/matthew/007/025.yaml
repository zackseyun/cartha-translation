id: MAT.7.25
reference: Matthew 7:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: ig
  text: Mmiri ozuzo wee daa, osimiri wee bịa[a], ifufe wee fere, ha niile wee dakwasị ụlọ ahụ[b]; ụlọ ahụ adaghị, n’ihi na a tọrọ ntọala ya n’elu nkume ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ide mmiri wee bịa”; okwu Grik ahụ pụtara n’ụzọ nkịtị “osimiri.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dara n’elu ụlọ ahụ” ma ọ bụ “kụrụ ụlọ ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: Mmiri ozuzo wee da
  rationale: Nke a na-egosipụta na mmiri si n’elu daa, ma na-ada ka Igbo nkịtị karịa nsụgharị okwu n’otu n’otu.
- source_word: οἱ ποταμοί
  choice: osimiri
  rationale: ποταμοί pụtara ‘osimiri’ n’ụzọ bụ isi. E debere ihe oyiyi ahụ kama ịgbanwe ya ozugbo ka ọ bụrụ ‘ide mmiri,’ ma tinye nhọrọ ahụ n’ala peeji.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: ifufe wee fe
  rationale: Nke a bụ ụzọ Igbo doro anya ma kwekọọ n’echiche nkịtị nke πνέω mgbe ifufe bụ onye na-eme ihe.
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: dakwasịkwa ụlọ ahụ
  rationale: ‘Dakwasị’ na-echekwa echiche nke προσπίπτω, ya bụ ịbịakwasị ma ọ bụ ịdakwasị ihe n’ike, n’enweghị itinye nkọwa karịrị nke Grik.
- source_word: οὐκ ἔπεσεν
  choice: ụlọ ahụ adaghị
  rationale: A kpọghachiri ‘ụlọ ahụ’ n’Igbo iji mee ka onye nnọchiaha doo anya; ‘adaghị’ bụ nsụgharị kpọmkwem nke οὐκ ἔπεσεν ma ọ naghị eme ka okwu ahụ sie ike karịa ka Grik siri dị.
- source_word: τεθεμελίωτο
  choice: a tọrọ ntọala ya
  rationale: Ụdị a na-egosi na e tinyeworị ntọala ahụ tupu oké ihu igwe abịa, ma na-echekwa ihe oyiyi nke ntọala.
- source_word: ἐπὶ τὴν πέτραν
  choice: n’elu nkume ahụ
  rationale: ‘Nkume ahụ’ na-echekwa nkọwa na ịdị kpọmkwem nke πέτρα nwere mkpụrụokwu njirimara, n’etinyeghị echiche pụrụ iche dịka ‘nkume siri ike dị n’okpuru ala.’
theological_decisions:
- issue: Ihe oyiyi ilu banyere ntọala
  choice: n’elu nkume ahụ
  alternative: n’elu nnukwu nkume siri ike
  rationale: Amaokwu a anaghị akọwa n’onwe ya onye ma ọ bụ ihe nkume ahụ nọchiri anya ya. Nsụgharị a na-ahapụ ihe oyiyi na esemokwu nkà mmụta okpukpe dị ka ederede si hapụ ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. Usoro ‘wee’ na-ejikọta ihe ndị ahụ mere n’usoro dịka καί si eme na Grik, ebe ahịrịokwu nke abụọ na-eme ka ihe ụlọ ahụ na-anọchi anya ya doo anya.
