review_pass:
  verdict: revise
  source_fidelity: The three coordinated generalizing clauses are faithfully represented. However, “a ga-emeghekwara” includes the additive element -kwa (“also”), which is not present in ἀνοιγήσεται, even though the passive and the unstated thing opened should be retained.
  naturalness: The wording is clear, dignified Standard Igbo, and its parallel structure reads naturally. “A ga-emegheere onye na-akụ aka” is more idiomatic here than “a ga-emeghekwara onye na-akụ aka.”
  terminology: “Onye ọ bụla,” “na-arịọ,” “na-anata,” “na-achọ,” and “na-achọta” appropriately convey the Greek terms. “Onye na-akụ aka” suitably retains the knocking image without supplying “ọnụ ụzọ” in the verse text.
  issues:
  - severity: low
    issue: The additive suffix -kwa in “a ga-emeghekwara” adds “also.”
    rationale: The Greek future passive ἀνοιγήσεται states simply that it will be opened; it contains no additive particle. Removing -kwa preserves the passive construction and avoids adding nuance.
  revised_text: N’ihi na onye ọ bụla na-arịọ na-anata, onye na-achọ na-achọta, a ga-emegheere onye na-akụ aka.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “a ga-emeghe ya nye onye na-akụ aka.” Grik ekwughị kpọmkwem na ọ bụ “ọnụ ụzọ”; ihe atụ ahụ na-eme ka a ghọta ya.
    reason: lexical_alternative
  revision_rationale: The revision removes the unrepresented additive sense in -kwa while preserving the Greek’s future passive, its unstated object, and the dative sense of “to/for the one who knocks.” The footnote continues to clarify that “ọnụ ụzọ” is implied by the image rather than explicitly stated.
