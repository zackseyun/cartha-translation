revisions:
- from: N’ihi na onye ọ bụla na-arịọ na-anata; onye na-achọ na-achọta; a ga-emeghekwara onye na-akụ aka.[a]
  to: N’ihi na onye ọ bụla na-arịọ na-anata, onye na-achọ na-achọta, a ga-emegheere onye na-akụ aka.[a]
  rationale: The revision removes the unrepresented additive sense in -kwa while preserving the Greek’s future passive, its unstated object, and the dative sense of “to/for the one who knocks.” The footnote continues to clarify that “ọnụ ụzọ” is implied by the image rather than explicitly stated.
  reviewer_model: gpt-5.6-terra
