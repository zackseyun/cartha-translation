id: MAT.7.8
reference: Matthew 7:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: ig
  text: N’ihi na onye ọ bụla na-arịọ na-anata, onye na-achọ na-achọta, a ga-emegheere onye na-akụ aka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a ga-emeghe ya nye onye na-akụ aka.” Grik ekwughị kpọmkwem na ọ bụ “ọnụ ụzọ”; ihe atụ ahụ na-eme ka a ghọta ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: onye ọ bụla
  rationale: N’ebe a, okwu a na-egosi mmadụ niile so n’otu ndị a kọwara; “onye ọ bụla” bụ Igbo nkịtị nke na-edobe oke zuru ụwa ọnụ nke okwu Grik.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe kpatara agbamume dị n’amaokwu bu ya ụzọ.
- source_word: ὁ αἰτῶν
  choice: na-arịọ
  rationale: Nsonye oge ugbu a e ji dị ka aha na-egosi onye na-arịọ; mgbe “onye ọ bụla” gachara, usoro a bụ nke dị mfe ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: λαμβάνει
  choice: na-anata
  rationale: Ọ na-enye nghọta nkịtị nke ịnata ihe, ma na-edobe usoro yiri ibe ya nke ahịrịokwu Grik.
- source_word: ὁ ζητῶν
  choice: onye na-achọ
  rationale: Ọ na-edobe usoro aha na nsonye nke Grik, tinyekwa ụda ahịrịokwu atọ yiri ibe ha.
- source_word: εὑρίσκει
  choice: na-achọta
  rationale: Nke a bụ nghọta nkịtị dabara n’ebe a ma na-edobe ịdị mfe na ịdị mfe icheta okwu ahụ.
- source_word: τῷ κρούοντι
  choice: onye na-akụ aka
  rationale: Ọ na-egosi onye a na-emegheere ihe, ma na-edobe ihe atụ nke ịkụ aka n’ọnụ ụzọ n’etinyeghị “ọnụ ụzọ” n’ime isiokwu.
- source_word: ἀνοιγήσεται
  choice: a ga-emeghekwara
  rationale: Usoro a na-egosi ihe ga-eme n’ụdị nnara omume ma hapụ ihe a ga-emeghe n’akọwaghị ya, dịka Grik si mee.
theological_decisions:
- issue: Oke na ike nke nkwa ahụ
  choice: E depụtara ya dịka mmesi obi ike gbasara onye ọ bụla, n’etinyeghị nkọwa ga-amachi nkwa ahụ ma ọ bụ kwuo na arịrịọ ọ bụla ga-emezu kpọmkwem otú a rịọrọ ya.
  alternative: Ịsụgharị ya dị ka nkwa na-enweghị ihe mgbochi na a ga-enye arịrịọ ọ bụla kpọmkwem, ma ọ bụ ịmachi ya naanị n’arịrịọ ime mmụọ ụfọdụ.
  rationale: Grik ji okwu zuru ụwa ọnụ kwuo ya. Nsụgharị ahụ kwesịrị idobe ịdị obosara na esemokwu nkọwa dị n’okwu ahụ n’onwe ya, kama idozi ya site n’ịgbakwunye ozizi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu atọ yiri ibe ha na-enyere aka idobe ụda na ike okwu Grik; e tinyebeghị “ọnụ ụzọ” n’isiokwu n’ihi na Grik akpọghị ya aha.
