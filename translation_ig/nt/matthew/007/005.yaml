- from: Onye ihu abụọ, buru ụzọ wepụ osisi ukwu ahụ dị n'anya gị[a]; mgbe ahụ ị ga-ahụ ụzọ nke ọma iwepụ irighiri osisi dị n'anya nwanne gị[b].
  to: Onye ihu abụọ, buru ụzọ wepụ ogwe osisi ahụ dị n'anya gị[a], mgbe ahụ ị ga-ahụ nke ọma ka i wee wepụ irighiri osisi[b] dị n'anya nwanne gị.
  rationale: The revision corrects the misplaced [b] anchor, improves the syntax of the second clause, and uses “ogwe osisi” for the substantial timber δοκός. It preserves the rebuking vocative, temporal priority, eye imagery, and the intended large-versus-small contrast without adding interpretation.
