  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: ig
  text: Onye ihu abụọ, buru ụzọ wepụ ogwe osisi ahụ dị n'anya gị[a], mgbe ahụ ị ga-ahụ nke ọma ka i wee wepụ irighiri osisi[b] dị n'anya nwanne gị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ntụhie.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “obere mgbawa osisi” ma ọ bụ “iberibe ahịhịa kpọrọ nkụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: Onye ihu abụọ
  rationale: Ọ bụ okwu ịkpọ mmadụ kpọmkwem n'ụdị ịbara ya mba; nke a na-edobe ịdị nkọ nke okwu Grik ahụ n'Igbo nkịtị.
- source_word: ἔκβαλε
  choice: wepụ
  rationale: Iwu a pụtara iwepụ ihe nọchiri anya ihe mgbochi n'anya; “wepụ” bụ okwu Igbo doro anya ma kwekọọkwa n'okwu ahụ e ji mee ihe ọzọ n'amaokwu a.
- source_word: πρῶτον
  choice: buru ụzọ
  rationale: Ọ na-egosi ihe a ga-eme tupu ihe ọzọ, ma nke a bụ ụzọ e si ekwu ya n'Igbo nke oge a.
- source_word: δοκόν
  choice: osisi ukwu
  rationale: δοκός bụ nnukwu osisi e ji arụ ụlọ, dịka ogwe ma ọ bụ ntụhie; “osisi ukwu” na-eme ka oke ọdịiche ya na obere irighiri osisi pụta ìhè.
- source_word: ὀφθαλμοῦ
  choice: anya
  rationale: Nke a bụ ntụgharị Igbo kwụ ọtọ nke akụkụ ahụ e kwuru okwu ya.
- source_word: διαβλέψεις
  choice: ị ga-ahụ ụzọ nke ọma
  rationale: Ọ na-edobe echiche siri ike nke ngwaa Grik ahụ, ya bụ ịhụ nke ọma ruo n'inwe ike ime ihe a na-ekwu.
- source_word: ἐκβαλεῖν
  choice: iwepụ
  rationale: A na-emegharị otu okwu e ji sụgharịa ἔκβαλε ka njikọ na nhata dị n'okwu Grik ahụ ghara ịla n'iyi.
- source_word: κάρφος
  choice: irighiri osisi
  rationale: κάρφος nwere ike ịbụ obere iberibe ihe kpọrọ nkụ, ahịhịa, ma ọ bụ osisi; “irighiri osisi” na-enye ọdịiche doro anya n'etiti ya na nnukwu osisi ahụ.
- source_word: ἀδελφοῦ
  choice: nwanne gị
  rationale: “Nwanne” bụ okwu Igbo ebumpụta ụwa maka onye nọ n'otu mmekọrịta obodo ma ọ bụ okwukwe; ebe Igbo anaghị egosi nwoke n'okwu a n'onwe ya, ọ naghị amanye nkọwa nwoke nke ọdịdị okwu Grik.
theological_decisions:
- issue: 'Okwu mmekọrịta nwere ọdịdị nwoke: ἀδελφοῦ'
  choice: nwanne gị
  alternative: nwanna nwoke gị
  rationale: Ọ bụ ezie na okwu Grik ahụ bụ ụdị nwoke otu onye, “nwanne gị” bụ ntụgharị Igbo nkịtị na-ekwupụtaghị ihe karịrị ihe okwu ahụ chọrọ n'ebe a. “Nwanna nwoke gị” ga-eme ka mmekọahụ nwoke pụta ìhè karịa ka okwu Igbo na ọnọdụ ahụ si achọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ ahụ siri ike na ọdịiche dị n'etiti nnukwu osisi na obere irighiri osisi; e tinyere akara nkọwa ala peeji niile n'ahịrị isi.
