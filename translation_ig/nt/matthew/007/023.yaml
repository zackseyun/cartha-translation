review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the sequence, absolute negation, plural address, relational force of ἔγνων, dismissal command, and moral-legal sense of ἀνομία. However, “n’ihu ha” means “before/in their presence,” whereas αὐτοῖς identifies the recipients (“to them”). The public/open force of ὁμολογήσω can be expressed without changing that relationship.
  naturalness: “Aga m agwa ha hoo haa” is natural Standard Igbo for a solemn, explicit declaration addressed to them. “Sinụ n’ebe m nọ pụọ” is idiomatic and appropriately forceful. “Ndị na-emebi iwu” is more natural than the noun phrase “ndị na-eme mmebi iwu.”
  terminology: “Maara” appropriately preserves the relational/judicial ambiguity of γινώσκω. “Iwu” preserves the legal dimension of ἀνομία without narrowing it to a particular doctrinal system. The footnote is adjusted so that its alternative does not turn the main text’s relational wording into an assertion that they were specifically “my people.”
  issues:
  - severity: medium
    issue: “n’ihu ha” does not render αὐτοῖς precisely.
    rationale: The Greek says that the declaration is made to them. “N’ihu ha” instead says it happens before them/in their presence. “Agwa ha hoo haa” retains direct address while representing the open, declarative force of ὁμολογήσω.
  - severity: low
    issue: Footnote a’s wording “dịka ndị m maara” adds a possessive categorization not expressed by the Greek.
    rationale: The source leaves the relational and judicial implications of “I never knew you” unstated. A lexical note should describe that nuance without recasting it as a claim about being Jesus’ own people.
  revised_text: Mgbe ahụ, aga m agwa ha hoo haa, sị, “Ọ dịghị mgbe m maara unu[a]. Sinụ n’ebe m nọ pụọ, unu ndị na-emebi iwu[b].”
  revised_footnotes:
