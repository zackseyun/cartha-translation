revisions:
- from: Mgbe ahụ, aga m ekwupụta n’ihu ha, sị, “Ọ dịghị mgbe m maara unu[a]. Sinụ n’ebe m nọ pụọ, unu ndị na-eme mmebi iwu[b].”
  to: Mgbe ahụ, aga m agwa ha hoo haa, sị, “Ọ dịghị mgbe m maara unu[a]. Sinụ n’ebe m nọ pụọ, unu ndị na-emebi iwu[b].”
  rationale: The revision replaces a recipient/location shift with an idiomatic direct-address construction, improves the natural rendering of characteristic lawbreaking, and removes interpretive expansion from footnote a. It preserves the source’s solemn register, plural address, and theological ambiguity.
  reviewer_model: gpt-5.6-terra
