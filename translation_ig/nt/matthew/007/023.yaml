id: MAT.7.23
reference: Matthew 7:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: ig
  text: Mgbe ahụ, aga m agwa ha hoo haa, sị, “Ọ dịghị mgbe m maara unu[a]. Sinụ n’ebe m nọ pụọ, unu ndị na-emebi iwu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ dịghị mgbe m nabatara unu.” Okwu Grik a sụgharịrị “maara” nwere ike igosi ịmata mmadụ n’ime mmekọrịta, ọ bụghị naanị ịma na onye ahụ dị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “unu ndị na-eme ajọ omume” ma ọ bụ “unu ndị na-arụ ajọ omume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: Mgbe ahụ
  rationale: Nke a na-egosi ihe ga-esochi ihe ndị e kwuru n’amaokwu bu ya ụzọ. Igbo anaghị achọ ka e tinye ‘na’ n’isi ahịrịokwu a iji chekwaa njikọ ahụ.
- source_word: ὁμολογήσω
  choice: aga m ekwupụta n’ihu ha
  rationale: N’ọnọdụ ikpe a, okwu ahụ pụtara ikwu ihe n’ihu ọha n’ụzọ doro anya, ọ bụghị ikwupụta mmehie.
- source_word: Οὐδέποτε
  choice: Ọ dịghị mgbe
  rationale: 'Nke a na-echekwa nkw否 zuru oke na ike okwu Grik ahụ: ọ dịghị mgbe ọ bụla.'
- source_word: ἔγνων
  choice: m maara
  rationale: ‘Mara’ na-echekwa okwu mmekọrịta dị na Grik, kama ịkọwa ya nanị dị ka ịma ihe n’uche ma ọ bụ ịnakwere mmadụ.
- source_word: ἀποχωρεῖτε ἀπ’ ἐμοῦ
  choice: Sinụ n’ebe m nọ pụọ
  rationale: Nke a bụ iwu ịchụpụ mmadụ; ntụgharị a bụ Igbo eke ma na-echekwa ịdị nsọ na ike nke okwu ahụ.
- source_word: οἱ ἐργαζόμενοι τὴν ἀνομίαν
  choice: unu ndị na-eme mmebi iwu
  rationale: Ụdị ‘ndị na-eme’ nwere ike igosi omume e ji amata mmadụ, ebe ‘mmebi iwu’ na-echekwa akụkụ omume megidere iwu dị na ἀνομία.
theological_decisions:
- issue: Ihe ‘Ọ dịghị mgbe m maara unu’ pụtara
  choice: E debere okwu mmekọrịta ahụ dịka ‘Ọ dịghị mgbe m maara unu.’
  alternative: Ọ dịghị mgbe m nabatara unu / matara unu dịka ndị nke m
  rationale: Okwu Grik kwuru banyere ịma mmadụ n’ụzọ mmekọrịta. Ịgbasa ya ka ọ bụrụ ịnabata, ịkwado, ma ọ bụ ịbụ ndị nke Kraịst ga-ekpebi esemokwu nkà mmụta okpukpe nke amaokwu ahụ hapụrụ n’ime okwu ya.
- issue: Ike okwu ἀνομία
  choice: mmebi iwu
  alternative: ajọ omume / ajọ ihe
  rationale: ‘Mmebi iwu’ na-echekwa akụkụ iwu na ụkpụrụ dị n’okwu Grik ahụ, ma ọ naghị etinye nkọwa pụrụ iche nke otu ụka.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘unu’ chekwaa ụdị ọtụtụ mmadụ dị na Grik. E debere ahịrịokwu Jizọs dịka nkwupụta ikpe siri ike, na-enweghị okwu ụka ochie gabigara ókè ma ọ bụ nkọwa ozizi agbakwunyere.
