    text: Ma ọ bụ, “Ọ dịghị mgbe m nabatara unu.” Okwu Grik a sụgharịrị “maara” nwere ike igosi ịmata mmadụ n’ime mmekọrịta, ọ bụghị naanị ịma na onye ahụ dị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “unu ndị na-eme ajọ omume” ma ọ bụ “unu ndị na-arụ ajọ omume.”
    reason: lexical_alternative
  revision_rationale: The revision replaces a recipient/location shift with an idiomatic direct-address construction, improves the natural rendering of characteristic lawbreaking, and removes interpretive expansion from footnote a. It preserves the source’s solemn register, plural address, and theological ambiguity.
