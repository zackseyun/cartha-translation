id: MAT.7.12
reference: Matthew 7:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: ig
  text: Ya mere, n’ihe niile, ihe ọ bụla unu chọrọ ka ndị mmadụ meere unu, unu kwa meerenụ ha otu ahụ; n’ihi na nke a bụ Iwu na Ndị Amụma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα οὖν
  choice: Ya mere, n’ihe niile
  rationale: “Ya mere” na-egosi nkwubi okwu sitere n’ihe ndị bu ụzọ, ebe “n’ihe niile” na-echekwa oke zuru ezu nke Πάντα n’ụzọ Igbo na-ada nke ọma.
- source_word: ὅσα ἐὰν θέλητε
  choice: ihe ọ bụla unu chọrọ
  rationale: Nke a na-egosipụta echiche izugbe na nke na-enweghị mmachi dị na njikọ ὅσα ἐὰν, n’asụsụ Igbo dị ugbu a ma doo anya.
- source_word: ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι
  choice: ka ndị mmadụ meere unu
  rationale: “Ndị mmadụ” na-egosipụta ἄνθρωποι dịka mmadụ niile, ọ bụghị naanị ụmụ nwoke; “meere unu” na-enye echiche nke omume a na-emere mmadụ n’ụzọ Igbo ebumpụta ụwa.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: unu onwe unu mekwara ha otu ahụ
  rationale: “Unu onwe unu” na-echekwa nkwusi ike dị na καὶ ὑμεῖς, “otu ahụ” na-egosipụta οὕτως, ebe ụdị ngwaa a na-enye iwu maka omume a ga na-eme.
- source_word: οὗτος γάρ ἐστιν
  choice: n’ihi na nke a bụ
  rationale: Nsụgharị kwụ ọtọ na nke doro anya nke nkebiokwu nkọwa a, na-echekwa ọrụ γάρ nke inye ihe kpatara iwu ahụ.
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: Iwu na Ndị Amụma
  rationale: E debere usoro okwu Akwụkwọ Nsọ a maara nke ọma kama ịkọwa ya n’ụzọ ga-ebelata njikọ ya na akwụkwọ Iwu na akwụkwọ Ndị Amụma.
theological_decisions:
- issue: ἄνθρωποι bụ aha nwoke n’ụdị ụtọasụsụ ma e ji ya mee ihe izugbe
  choice: ndị mmadụ
  alternative: ụmụ nwoke
  rationale: N’ebe a, okwu Grik ahụ na-ezo aka n’ụmụ mmadụ n’ozuzu ha, ya mere “ndị mmadụ” na-echekwa oke iwu omume a n’enweghị ime ka ọ bụrụ naanị maka ụmụ nwoke.
- issue: Oke ihe “Iwu na Ndị Amụma” pụtara
  choice: E debere ya dịka usoro okwu na-achịkọta akụkụ Akwụkwọ Nsọ
  alternative: isi ihe niile Akwụkwọ Nsọ na-akụzi banyere omume
  rationale: Okwu Grik ahụ bụ usoro okwu ndị Juu na Matiu ji eme ihe. Idebe ya na-echekwa ụda njikọ Akwụkwọ Nsọ na ịdị arọ nke nkà mmụta okpukpe ya n’enweghị ịgbakwunye nkọwa n’amaokwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji nnọchiaha ọtụtụ “unu” kwekọọ na ὑμεῖς/ὑμῖν, ma debe ahịrịokwu ahụ dịka otu iwu zuru ụwa ọnụ nke nwere njikọ doro anya na nkuzi bu ya ụzọ.
