- from: Ya mere, n’ihe niile, ihe ọ bụla unu chọrọ ka ndị mmadụ meere unu, unu onwe unu mekwara ha otu ahụ; n’ihi na nke a bụ Iwu na Ndị Amụma.
  to: Ya mere, n’ihe niile, ihe ọ bụla unu chọrọ ka ndị mmadụ meere unu, unu kwa meerenụ ha otu ahụ; n’ihi na nke a bụ Iwu na Ndị Amụma.
  rationale: The revision retains the draft’s faithful rendering of the verse while replacing added reflexive emphasis with the additive “kwa” and using the explicit plural imperative “meerenụ” for the Greek present imperative.
