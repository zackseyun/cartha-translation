review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the comprehensive scope, reciprocal ethical instruction, generic reference to human beings, and the scriptural formula “the Law and the Prophets.” However, “unu onwe unu” adds a reflexive emphasis not explicit in καὶ ὑμεῖς (“you also”), and “mekwara” is less direct than an imperative form for ποιεῖτε.
  naturalness: The proposed revision uses clear, contemporary Standard Igbo. “Unu kwa meerenụ ha otu ahụ” naturally expresses both reciprocity and the present imperative.
  terminology: “Ndị mmadụ” appropriately renders generic οἱ ἄνθρωποι. “Iwu na Ndị Amụma” suitably preserves the established scriptural designation without interpretive expansion.
  issues:
  - severity: medium
    issue: “unu onwe unu” overstates the Greek subject emphasis.
    rationale: καὶ ὑμεῖς means “you also”; it does not specifically express the reflexive/emphatic sense “you yourselves.” “Unu kwa” conveys the additive force without addition.
  - severity: medium
    issue: “mekwara” does not clearly mark the imperative force of ποιεῖτε.
    rationale: ποιεῖτε is a present imperative. “Meerenụ” clearly gives the plural command, while retaining the intended ongoing ethical instruction.
  revised_text: Ya mere, n’ihe niile, ihe ọ bụla unu chọrọ ka ndị mmadụ meere unu, unu kwa meerenụ ha otu ahụ; n’ihi na nke a bụ Iwu na Ndị Amụma.
