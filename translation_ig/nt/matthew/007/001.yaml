  source_fidelity: “Unu ekpela mmadụ ikpe, ka a ghara ikpe unu ikpe” faithfully conveys the prohibition introduced by μή, the broad and repeated sense of κρίνω/κριθῆτε, and the purpose/result relation of ἵνα. The impersonal construction “a ghara ikpe unu ikpe” appropriately represents the Greek passive without specifying the agent.
  naturalness: The wording is natural, clear Standard Igbo with an appropriately dignified biblical register. “Ikpe mmadụ ikpe” is an idiomatic way to express judging a person, and the repeated expression effectively retains the rhetorical balance of the Greek.
  terminology: The main rendering properly keeps κρίνω broad rather than restricting it to condemnation. The footnote supplies “ịma mmadụ ikpe” as a legitimate narrower alternative and accurately explains why it is not preferred for the main text.
