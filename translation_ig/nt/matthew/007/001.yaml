id: MAT.7.1
reference: Matthew 7:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μὴ κρίνετε, ἵνα μὴ κριθῆτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/001.yaml
  text: Do not judge[a], so that you may not be judged.
translation:
  language: ig
  text: Unu ekpela mmadụ ikpe[a], ka a ghara ikpe unu ikpe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu amala mmadụ ikpe, ka a ghara ịma unu ikpe.” Ngwaa Grik a nwere ike ịpụta ịma mmadụ ikpe n'ọnọdụ ụfọdụ; ma “ikpe mmadụ ikpe” sara mbara karị, na-echekwakwa nkwughachi nke otu okwu ahụ n'amaokwu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: Unu ekpela
  rationale: Mgbe μή so ngwaa dị n'ụdị iwu ugbu a, ọ na-enye iwu mmachibido; “unu ekpela” na-egosipụta nke a n'Igbo dị mfe ma kwanyere ùgwù.
- source_word: κρίνετε
  choice: ikpe mmadụ ikpe
  rationale: κρίνω nwere nghọta sara mbara nke gụnyere ikpebi okwu mmadụ, ịtụle ya, ma ọ bụ ịma ya ikpe. “Ikpe mmadụ ikpe” na-edobe nghọta sara mbara ahụ ma na-emekwa ka otu mgbọrọgwụ okwu pụta ìhè n'ahịrịokwu abụọ ahụ.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-egosipụta nzube ma ọ bụ ihe ga-esi na ya pụta n'ụzọ ebumpụta ụwa n'Igbo, dịka ἵνα na subjunctive si arụ ọrụ ebe a.
- source_word: μὴ
  choice: ghara
  rationale: “Ghara” na-agọnarị ngwaa na-esote ya nke ọma n'usoro okwu Igbo “ka a ghara…”
- source_word: κριθῆτε
  choice: a ghara ikpe unu ikpe
  rationale: Ụdị passive nke κρίνω ka e ji usoro onye na-emeghị ka a mata, “a … unu,” tụgharịa. Iji “ikpe … ikpe” ọzọ na-echekwa nkwughachi na nguzozi nke Grik.
theological_decisions:
- issue: Oke nghọta κρίνω n'iwu Jizọs
  choice: E debere okwu sara mbara bụ “ikpe mmadụ ikpe,” kama ime ka ọ bụrụ naanị “ịma mmadụ ikpe.”
  alternative: Unu amala mmadụ ikpe, ka a ghara ịma unu ikpe.
  rationale: Amaokwu a n'onwe ya akọwaghị oke niile nke iwu ahụ; ihe gbara ya gburugburu na Matiu 7:2–5 ga-enyekwu nkọwa. Nhọrọ sara mbara na-echekwa esemokwu na nghọta dị na isi mmalite n'etinyeghị nkọwa ozizi pụrụ iche.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ọtụtụ onye “unu” mee ka iwu nke Grik dokwuo anya, e jikwa usoro “a … unu” gosipụta passive na-enweghị ịkọ onye ga-ekpe ikpe.
