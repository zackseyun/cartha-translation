revisions:
- from: Ọtụtụ mmadụ ga-asị m n’ụbọchị ahụ, ‘Onyenwe anyị, Onyenwe anyị, ọ̀ bụ na anyị ebughị amụma n’aha gị, chụpụkwa ndị mmụọ ọjọọ n’aha gị, ma rụọkwa ọtụtụ ọrụ dị ike n’aha gị[a]?’
  to: Ọtụtụ mmadụ ga-asị m n’ụbọchị ahụ, ‘Onyenweanyị, Onyenweanyị, ọ̀ bụghị n’aha gị ka anyị buru amụma, chụpụ mmụọ ọjọọ n’aha gị, ma rụọ ọtụtụ ọrụ dị ike[a] n’aha gị?’
  rationale: The revision removes an unintended possessive implication in the address to Jesus by using the conventional lexicalized title “Onyenweanyị.” It also uses a more idiomatic expression for casting out demons and places the lexical note anchor directly on “ọrụ dị ike.” The rhetorical form, all three occurrences of “n’aha gị,” and the source’s ambiguity regarding mighty works versus miracles are retained.
