review_pass:
  verdict: revise
  source_fidelity: The draft preserves the future setting, the affirmative-expecting rhetorical questions, the threefold repetition of “in your name,” and the non-specific force of δυνάμεις as powerful deeds. However, the separated phrase “Onyenwe anyị” is grammatically liable to mean “our Lord,” whereas the Greek vocative Κύριε has no possessive pronoun. The conventional title should be written as the lexicalized form “Onyenweanyị.”
  naturalness: The overall register is clear Standard Igbo. “Chụpụ mmụọ ọjọọ” is more idiomatic and direct than “chụpụ ndị mmụọ ọjọọ” here. Moving the footnote marker directly after “ọrụ dị ike” makes its scope unambiguous.
  terminology: “Onyenweanyị” suitably renders the direct address “Lord” without adding a possessive. “Ibu amụma,” “n’aha gị,” “mmụọ ọjọọ,” and “ọrụ dị ike” retain the source sense and established biblical usage. The note appropriately supplies “ọrụ ebube” only as an alternative, not as the main-text interpretation.
  issues:
  - severity: medium
    issue: “Onyenwe anyị” is written as a possessive noun phrase.
    rationale: Read compositionally, it means “our Lord,” introducing anyị (“our”) that is absent from Κύριε. The conventional lexicalized title “Onyenweanyị” avoids this unintended possessive reading.
  - severity: low
    issue: Footnote anchor follows the final “n’aha gị” rather than the expression it explains.
    rationale: The note concerns δυνάμεις / “ọrụ dị ike,” so the anchor should immediately follow that expression.
  - severity: low
    issue: “Ndị mmụọ ọjọọ” is less direct than necessary.
    rationale: “Mmụọ ọjọọ” naturally conveys the plural object in this context and corresponds directly to δαιμόνια.
  revised_text: Ọtụtụ mmadụ ga-asị m n’ụbọchị ahụ, ‘Onyenweanyị, Onyenweanyị, ọ̀ bụghị n’aha gị ka anyị buru amụma, chụpụ mmụọ ọjọọ n’aha gị, ma rụọ ọtụtụ ọrụ dị ike[a] n’aha gị?’
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “rụọ ọtụtụ ọrụ ebube” ma ọ bụ “rụọ ọtụtụ ọrụ nke ike.” Okwu Grik ahụ pụtara n’ụzọ nkịtị ọtụtụ “ike,” bụrụkwa okwu a na-ejikarị n’Oziọma akọwa ọrụ ebube.
    reason: lexical_alternative
  revision_rationale: The revision removes an unintended possessive implication in the address to Jesus by using the conventional lexicalized title “Onyenweanyị.” It also uses a more idiomatic expression for casting out demons and places the lexical note anchor directly on “ọrụ dị ike.” The rhetorical form, all three occurrences of “n’aha gị,” and the source’s ambiguity regarding mighty works versus miracles are retained.
