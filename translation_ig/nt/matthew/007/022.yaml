id: MAT.7.22
reference: Matthew 7:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: ig
  text: Ọtụtụ mmadụ ga-asị m n’ụbọchị ahụ, ‘Onyenweanyị, Onyenweanyị, ọ̀ bụghị n’aha gị ka anyị buru amụma, chụpụ mmụọ ọjọọ n’aha gị, ma rụọ ọtụtụ ọrụ dị ike[a] n’aha gị?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “rụọ ọtụtụ ọrụ ebube” ma ọ bụ “rụọ ọtụtụ ọrụ nke ike.” Okwu Grik ahụ pụtara n’ụzọ nkịtị ọtụtụ “ike,” bụrụkwa okwu a na-ejikarị n’Oziọma akọwa ọrụ ebube.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Ọtụtụ mmadụ
  rationale: Aha nkọwa a dị n’ụdị ọtụtụ na-anọchi aha mmadụ; itinye “mmadụ” na-eme ka Igbo doo anya ma ọ naghị agbakwụnye otu ndị a na-akọwaghị n’asụsụ Grik.
- source_word: ἐροῦσίν μοι
  choice: ga-asị m
  rationale: Nke a na-egosipụta ọdịnihu nke λέγω na nnọchiaha dative; “ga-asị m” bụ ụzọ Igbo dị mfe ma kwụ ọtọ.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: n’ụbọchị ahụ
  rationale: Nke a bụ okwu oge kwekọrọ n’ụzọ e si ekwu ya n’Igbo. Ọ na-edobe ntụaka banyere ụbọchị ikpeazụ n’enweghị ịkọwa ya karịa ihe Grik kwuru.
- source_word: Κύριε κύριε
  choice: Onyenwe anyị, Onyenwe anyị
  rationale: Aha a a kpọrọ ugboro abụọ na-egosi arịrịọ siri ike. “Onyenwe anyị” na-edobe ma echiche nke onye nwe ikike ma ibu okwu a nwere mgbe a na-akpọ Jizọs.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: ọ̀ bụ na anyị ebughị amụma
  rationale: Ajụjụ a na-atụ anya azịza nkwenye. “Ibu amụma” bụ okwu Igbo a na-aghọta nke ọma maka προφητεύω.
- source_word: τῷ σῷ ὀνόματι
  choice: n’aha gị
  rationale: Nkebiokwu a na-egosi ime ihe n’okpuru ikike onye ahụ ma ọ bụ site n’ịkpọku aha ya. E debere ugboro atọ ọ pụtara iji chekwaa nkwughachi na ike okwu ahụ.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: chụpụkwa ndị mmụọ ọjọọ
  rationale: ἐκβάλλω ya na δαιμόνια pụtara ịchụpụ mmụọ ọjọọ. Okwu Igbo a bụ nke doro anya ma bụrụkwa nke a na-ejikarị eme ihe.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: rụọkwa ọtụtụ ọrụ dị ike
  rationale: δύναμις nwere ike izo aka n’ọrụ ike ma ọ bụ ọrụ ebube. “Ọrụ dị ike” na-edobe njikọ ya na ike n’ebughị ụzọ kpebie na naanị “ọrụ ebube” ka okwu ahụ pụtara.
theological_decisions:
- issue: Otú e si sụgharịa κύριος mgbe a na-akpọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” na-edobe ma ihe aha ahụ na-apụtakarị ma ibu Kraịst nke ọ nwere n’ebe a, n’etinyeghị nkọwa karịrị ihe ederede kwuru.
- issue: Ike okwu banyere oge ikpeazụ dị na “ụbọchị ahụ”
  choice: n’ụbọchị ahụ
  alternative: n’ụbọchị ikpe ahụ
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi ikpe ikpeazụ, ma Grik kwuru naanị “ụbọchị ahụ.” Ya mere, e debere okwu ahụ ka ọ ghara idozi n’ederede isi ihe a hapụrụ ka onye na-agụ ya ghọta site n’ọnọdụ ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi “n’aha gị” ugboro atọ, tinyekwa nkwughachi “Onyenwe anyị,” iji chekwaa ụda arịrịọ na ike okwu Grik. E tinyere akara nkọwa ụkwụ [a] n’akụkụ “ọrụ dị ike,” ebe nhọrọ okwu ahụ metụtara kpọmkwem.
