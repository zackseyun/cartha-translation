  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: ig
  text: Ezi osisi[a] apụghị ịmị mkpụrụ ọjọọ[b]; osisi rere ure[c] apụghịkwa ịmị ezi mkpụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “osisi dị ike.”
    reason: lexical_alternative
  - marker: b
    text: Okwu a nwekwara ike igosi “mkpụrụ ajọ omume.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “osisi mebiri emebi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: ezi osisi
  rationale: “Ezi osisi” na-edobe ma ihe atụ nkịtị nke osisi ma echiche nke ịdị mma; “osisi dị mma” ga-ekwe omume, ma nke a dị mkpụmkpụ ma doo anya.
- source_word: δύναται ... ποιεῖν
  choice: apụghị ịmị
  rationale: δύναται na-egosi enweghị ike, ebe ποιεῖν na καρπούς bụ okwu e ji ekwu osisi na-amị mkpụrụ. “Apụghị ịmị” bụ Igbo ebumpụta ụwa ma na-edobe nkwupụta siri ike ahụ.
- source_word: καρποὺς πονηρούς
  choice: mkpụrụ ọjọọ
  rationale: πονηρός nwere ike ịpụta ihe ọjọọ ma ọ bụ ihe na-adịghị mma. “Mkpụrụ ọjọọ” na-edobe obosara okwu ahụ na ike omume dị n’ihe atụ ahụ.
- source_word: οὐδέ
  choice: apụghịkwa
  rationale: “-kwa” jikọtara nkebi nke abụọ dị ka nkwupụta njụ yiri nke mbụ, ma mee ka usoro ahịrịokwu ahụ bụrụ nke Igbo nkịtị.
- source_word: δένδρον σαπρόν
  choice: osisi rere ure
  rationale: σαπρός pụtara ihe rere ure ma ọ bụ mebiri emebi. “Rere ure” bụ okwu doro anya ma dị ndụ nke na-edobe ihe atụ ahụ.
- source_word: καρποὺς καλούς
  choice: ezi mkpụrụ
  rationale: καλός ebe a na-egosi mkpụrụ dị mma. “Ezi mkpụrụ” na-emegide “mkpụrụ ọjọọ” n’ụzọ doro anya ma na-edobe nhazi okwu abụọ ahụ.
theological_decisions:
- issue: Ụdị enweghị ike dị n’ihe atụ ahụ
  choice: “apụghị” dị ka enweghị ike kpamkpam
  alternative: “anaghị amịkarị” ma ọ bụ “ekwesịghị ịmị”
  rationale: δύναται tinyere οὐ na-ekwu hoo haa na ọ pụghị ime, ọ bụghị naanị na ọ naghị emekarị ma ọ bụ na o kwesịghị ime. Nsụgharị ahụ anaghị agbakwunye nkwubi okwu nkà mmụta okpukpe gafere ihe atụ ahụ.
translation_notes:
  register: Standard Igbo; okwu ndị dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “ịmị mkpụrụ” mee ihe kama ntụgharị nkịtị nke “ime mkpụrụ,” n’ihi na ọ bụ usoro okwu Igbo kwesịrị ekwesị maka osisi. Akara nkọwa ala peeji niile dị n’ahịrịokwu bụ isi.
