review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the explanatory force of γάρ, the repeated judgment/measure imagery, future passive/impersonal construction, and the unstated agent. However, its first clause needs a more explicit instrumental construction, and the second requires a more idiomatic passive rendering in Standard Igbo.
  naturalness: “Ikpe unu ji ekpe ka a ga-eji kpee unu” is understandable but syntactically compressed and less natural than repeating the instrument after “a ga-eji.” “Ọ̀tụ̀tụ̀” is appropriate, but “a ga-eji tụọrọ unu” lacks the measure as the grammatical object and is awkward. The revision is clear, parallel, and idiomatic.
  terminology: “Ikpe” appropriately retains the broad sense of κρίμα/κρίνω without narrowing it to condemnation. “Ọ̀tụ̀tụ̀” and “atụ” preserve the measure wordplay. The impersonal “a ga-eji” properly avoids identifying the agent of the passive.
  issues:
  - severity: medium
    issue: The instrumental relationship and passive result are expressed awkwardly in both clauses.
    rationale: 'The Greek repeats ἐν ᾧ to identify the judgment/measure used as the standard. Explicitly placing each instrument after “a ga-eji” produces natural Igbo and preserves the parallelism: “a ga-eji X ... kpee unu; a ga-ejikwa Y ... tụọrụ unu.”'
  - severity: low
    issue: The footnote’s alternative wording is not fully idiomatic.
    rationale: “Tụghachiere unu” is less natural here. “A ga-atụghachi ya nye unu” clearly conveys the optional reciprocal sense while stating that “back” is not explicit in Greek.
  revised_text: N’ihi na a ga-eji ikpe unu ji ekpe kpee unu; a ga-ejikwa ọ̀tụ̀tụ̀ unu ji atụ tụọrụ unu.[a]
