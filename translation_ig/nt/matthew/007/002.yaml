id: MAT.7.2
reference: Matthew 7:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: ig
  text: N’ihi na a ga-eji ikpe unu ji ekpe kpee unu; a ga-ejikwa ọ̀tụ̀tụ̀ unu ji atụ tụọrụ unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a ga-atụghachi ya nye unu.” Asụsụ Grik ekwughị “ghachi” kpọmkwem, ọ bụ ezie na echiche nke nkwụghachi kwekọrọ n’ihe mmadụ mere dị n’okwu ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι / κρίνετε / κριθήσεσθε
  choice: ikpe / ji ekpe / kpee
  rationale: E ji okwu ndị sitere n’otu mgbọrọgwụ mee ihe iji chekwaa njikọ na nkwughachi dị n’asụsụ Grik, n’akọwaghị ya kpọmkwem dịka ịma ikpe ọnwụ ma ọ bụ ikpe ọmụma.
- source_word: μέτρῳ / μετρεῖτε / μετρηθήσεται
  choice: ọ̀tụ̀tù / ji atụ / tụọrọ
  rationale: Okwu ndị a na-echekwa ihe atụ nke iji otu ọ̀tụ̀tù tụọ ihe, nakwa ụda ilu nke ahịrịokwu Grik.
- source_word: μετρηθήσεται ὑμῖν
  choice: a ga-eji tụọrọ unu
  rationale: Usoro a bụ nke e ji onye na-eme ihe zoo, dịka passive Grik si dị; ọ naghị akpọ onye ga-atụ ya aha, ọ naghịkwa etinye ‘ghachi’ n’ahịrị bụ isi.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: unu ji ... ka a ga-eji
  rationale: Usoro Igbo a na-egosi ma ngwá ọrụ ma ọ bụ ụkpụrụ e ji eme ihe, ma na-echekwa nhazi yiri ibe ya nke akụkụ abụọ ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a na-enye ihe mere e ji nye iwu dị n’amaokwu bu ya ụzọ.
theological_decisions:
- issue: Onye na-eweta ikpe na ọ̀tụ̀tù ahụ
  choice: E zoro onye na-eme ihe site n’iji ‘a ga-eji,’ dịka passive Grik si dị.
  alternative: Ịsị kpọmkwem na Chineke ga-ekpe unu, ma ọ bụ na ndị mmadụ ga-ekpe unu.
  rationale: Ihe odide Grik akpọghị onye na-eme ihe aha; nsụgharị ahụ na-ahapụ ohere ma maka ikpe Chineke ma maka nkwụghachi kwekọrọ na omume mmadụ.
translation_notes:
  register: E ji Standard Igbo dị mfe ma dị ùgwù. Nhazi ‘ikpe unu ji ekpe ka a ga-eji kpee unu’ na ‘ọ̀tụ̀tù unu ji atụkwa ka a ga-eji tụọrọ unu’ na-echekwa nkwughachi na ndakọrịta nke ahịrịokwu mbụ.
