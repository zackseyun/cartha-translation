id: MAT.7.21
reference: Matthew 7:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: ig
  text: Ọ bụghị onye ọ bụla na-asị m, ‘Onyenwe anyị, Onyenwe anyị,’ ga-abanye n’alaeze eluigwe[a]; kama ọ bụ onye na-eme uche Nna m nke nọ n’eluigwe ga-abanye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a bụ ‘alaeze nke eluigwe,’ ebe ‘eluigwe’ dị n’ụba (plural). Matiu na-ejikarị okwu a eme ihe n’ebe akwụkwọ ndị ọzọ nwere ike ịsị ‘alaeze Chineke.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: Ọ bụghị onye ọ bụla na-asị m
  rationale: 'Nke a na-echekwa nkwụsi akụkụ ahụ: ọ pụtara ‘ọ bụghị onye ọ bụla,’ ọ bụghị ‘ọ dịghị onye.’ A sụgharịrị participle dị ugbu a dịka nkebiokwu ikwu banyere omume n’ozuzu ya.'
- source_word: Κύριε κύριε
  choice: Onyenwe anyị, Onyenwe anyị
  rationale: ‘Onyenwe anyị’ bụ okwu Igbo a na-ejikarị n'ụzọ dị ùgwù maka κύριος. E debere nkwughachi ahụ iji gosipụta arịrịọ siri ike.
- source_word: εἰσελεύσεται
  choice: ga-abanye
  rationale: Nke a bụ ntụgharị Igbo doro anya ma kwekọọ na future indicative ahụ.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: n’alaeze eluigwe
  rationale: ‘Alaeze eluigwe’ bụ ụzọ Igbo dị mma isi kwuo okwu Matiu ji eme ihe mgbe niile; ọ na-ezere ntụgharị siri ike nke plural ‘eluigwe dị iche iche’.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: kama ọ bụ onye na-eme
  rationale: Nke a na-echekwa ọdịiche dị n’etiti onye na-ekwu naanị ihe na onye na-eme ya, ma na-anọgide n’otu onye dịka Greek ahụ.
- source_word: τὸ θέλημα
  choice: uche
  rationale: ‘Uche’ n’ebe a na-egosi ihe Nna chọrọ ma ọ bụ kpebiri, n’ụzọ dị mkpirikpi ma bụrụkwa nke a na-aghọta nke ọma n’Igbo.
- source_word: τοῦ πατρός μου τοῦ ἐν τοῖς οὐρανοῖς
  choice: Nna m nke nọ n’eluigwe
  rationale: Nke a na-echekwa asụsụ mmekọrịta nke Jizọs, ‘Nna m,’ tinyere nkọwa ebe ọ nọ, n’usoro Igbo eke.
theological_decisions:
- issue: Ịbanye n’alaeze n’ihe metụtara ịkpọ Jizọs Onyenwe anyị na ime uche Nna
  choice: E debere ọdịiche doro anya dị n’etiti ịkpọ Jizọs ‘Onyenwe anyị’ n’ọnụ na ime uche Nna n’eziokwu.
  alternative: Ịkọwa amaokwu a dịka nkwupụta zuru ezu na ọrụ mmadụ na-eweta nzọpụta, ma ọ bụ na nkwupụta ọnụ naanị ezuola.
  rationale: Amaokwu Greek ahụ na-emesi ọdịiche dị n’etiti ikwu na ime ike, ma ọ naghị akọwa usoro ozizi nzọpụta dum n’ebe a. Ya mere, ntụgharị ahụ anaghị edozi esemokwu nkà mmụta okpukpe karịa ihe ederede kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kwughachiri ‘ga-abanye’ na nkebiokwu ikpeazụ iji mee ka ọdịiche ahụ zuo oke n’Igbo, ọ bụ ezie na Greek hapụrụ ngwaa ahụ ka a ghọta ya site na nkebiokwu mbụ.
