base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: ig
  text: Rịọnụ[a], a ga-enye unu; chọọnụ, unu ga-achọta; kụọnụ aka n’ọnụ ụzọ, a ga-emegheere unu ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Iwu atọ ndị a n’asụsụ Grik nwekwara ike igosi omume na-aga n’ihu: “Nọgidenụ na-arịọ ... na-achọ ... na-akụ aka n’ọnụ ụzọ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: Rịọnụ
  rationale: Ọ bụ iwu dị n’ụdị onye nke abụọ ọtụtụ. “Rịọnụ” bụ okwu Igbo doro anya maka ịrịọ ihe ma na-edobe ike nke iwu ahụ; echiche nke ime ya n’aga n’ihu ka a kọwara n’okpuru peeji.
- source_word: δοθήσεται
  choice: a ga-enye unu
  rationale: Aorist? Ọ bụ future passive indicative nke δίδωμι. Nhazi “a ga-enye unu” bụ ụzọ Igbo ebumpụta ụwa si egosi passive na-ekwughị onye ga-enye ya, dịka Grik si mee.
- source_word: ὑμῖν
  choice: unu
  rationale: Nnọchiaha dative nke onye nke abụọ ọtụtụ; “unu” na-egosi na a na-agwa ọtụtụ mmadụ okwu ma na-arụ ọrụ nke ‘nye unu’ na ‘megheere unu.’
- source_word: ζητεῖτε
  choice: chọọnụ
  rationale: Ọ bụ iwu present active nke onye nke abụọ ọtụtụ. “Chọọnụ” na-eburu echiche ịchọ ihe nke ọma ma dị mfe nghọta n’Igbo ugbu a.
- source_word: εὑρήσετε
  choice: unu ga-achọta
  rationale: Future active indicative; nsụgharị a na-edobe onye na-eme ihe ahụ na nkwa dị n’ọdịnihu n’ụzọ Igbo ebumpụta ụwa.
- source_word: κρούετε
  choice: kụọ aka n’ọnụ ụzọ
  rationale: N’Igbo, nanị “kụọnụ” agaghị ezuru iji gosipụta ịkụ aka n’ọnụ ụzọ. Okwu a zuru ezu na-eme ka ihe Grik pụtara doo anya n’enweghị ịgbakwunye ihe nkà mmụta okpukpe.
- source_word: ἀνοιγήσεται
  choice: a ga-emeghere unu ya
  rationale: Future passive indicative. “A ga-emeghere unu ya” na-edobe passive ahụ na onye na-emepeghị aha, ma nnọchiaha “ya” na-ezo aka n’ọnụ ụzọ nke ahịrịokwu Igbo mere ka o doo anya.
- source_word: καὶ
  choice: ; / ,
  rationale: Njikọ καὶ ugboro atọ na-ejikọta iwu na ihe ga-eso ya. N’Igbo, akara edemede na nhazi ahịrịokwu na-eburu njikọ ahụ n’ụzọ dị nro; itinye “ma” ma ọ bụ “na” ebe ọ bụla nwere ike ime ka okwu ahụ sie ike ma ọ bụ gbanwee njikọ ya.
theological_decisions:
- issue: Ụdị omume nke iwu atọ dị na present imperative
  choice: 'Jiri iwu nkịtị: “Rịọnụ ... chọọnụ ... kụọ aka,” ma tinye nkọwa banyere omume na-aga n’ihu n’okpuru peeji.'
  alternative: “Na-arịọrịtanụ ... na-achọrịtanụ ... na-akụrịtanụ aka.”
  rationale: Present imperative Grik nwere ike ibu echiche nke ime ihe n’aga n’ihu, ma ọ dịghị amanye ka e tinye “na-eme mgbe niile” n’isi ederede. Nhọrọ a na-edobe ma ịdị mfe nke iwu ahụ ma ezigbo ohere nkọwa nke aspect ahụ.
- issue: Onye na-enye ma na-emepe ụzọ
  choice: Debe ya n’enweghị aha site n’iji “a ga-enye” na “a ga-emeghere.”
  alternative: Kpọọ Chineke aha dị ka onye na-enye ma na-emepe.
  rationale: Ọdịdị passive nke Grik ekwughị onye na-eme ihe ahụ. Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu nwere ike ime ka a ghọta Chineke, ịkpọ ya aha n’ebe a ga-eme ka ihe a hapụrụ n’amaghị ama bụrụ ihe akọwapụtara.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ụdị ọtụtụ mmadụ “-nụ” iji chekwaa ὑμῖν na ụdị iwu nke onye nke abụọ ọtụtụ. Ahịrịokwu atọ ahụ debere nhazi yiri ibe ha na ụda okwu Grik.
