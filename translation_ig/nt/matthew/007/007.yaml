  verdict: revise
  source_fidelity: Isi ederede ahụ na-edobe iwu atọ nke onye nke abụọ ọtụtụ, ọdịnihu atọ sochiri ha, na passive a na-akpọghị onye na-eme ihe n’ahịrị nke mbụ na nke atọ. “Kụọnụ aka n’ọnụ ụzọ” bụ nkọwapụta idiomatic kwesịrị ekwesị nke κρούετε n’ọnọdụ a; “ụzọ” bụ ihe a ghọtara na ‘a ga-emegheere unu ya.’
  naturalness: 'Ederede a gbanwere na-adị ụtọ ma bụrụ Standard Igbo: “kụọnụ aka n’ọnụ ụzọ” na-ezere nghọta ‘kụọ aka’ dịka ịkụ aka ọnụ, ebe “a ga-emegheere unu ya” na-eji ụdị ọdịnihu kwesịrị ekwesị nke imeghe.'
  terminology: “Rịọnụ,” “chọọnụ,” na “kụọnụ aka n’ọnụ ụzọ” dabara na register nsọpụrụ na nke oge a. A na-edobe ‘a ga-enye’ na ‘a ga-emegheere’ n’enweghị ịkpọ Chineke aha, dịka passive Grik si hapụ onye na-eme ihe ahụ n’ekwughị ya.
