    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ogwe osisi” ma ọ bụ “okporo osisi” (δοκός).
    reason: lexical_alternative
  revision_rationale: The revision replaces the potentially misleading ‘nnukwu osisi’ (‘large tree’) with a construction-beam expression that accurately represents δοκός. It also clarifies the gender note while retaining the source’s masculine singular wording. No theological interpretation has been added.
