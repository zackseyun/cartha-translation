revisions:
- from: Ma gịnị mere i ji ahụ irighiri ihe dị n’anya nwanne gị nwoke,[a] ma ị naghị achọpụta nnukwu osisi dị n’anya nke gị?[b]
  to: Ma gịnị mere i ji ahụ irighiri ihe dị n’anya nwanne gị nwoke,[a] ma ị naghị achọpụta osisi e ji akwado ụlọ dị n’anya nke gị?[b]
  rationale: The revision replaces the potentially misleading ‘nnukwu osisi’ (‘large tree’) with a construction-beam expression that accurately represents δοκός. It also clarifies the gender note while retaining the source’s masculine singular wording. No theological interpretation has been added.
  reviewer_model: gpt-5.6-terra
