id: MAT.7.3
reference: Matthew 7:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: ig
  text: Ma gịnị mere i ji ahụ irighiri ihe dị n’anya nwanne gị nwoke,[a] ma ị naghị achọpụta osisi e ji akwado ụlọ dị n’anya nke gị?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’edemede Grik, okwu ahụ bụ ụdị nwoke n’otu ọgụgụ; e debere nke a n’nsụgharị a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ogwe osisi” ma ọ bụ “okporo osisi” (δοκός).
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: gịnị mere
  rationale: N’ajụjụ a, τί na-arụ ọrụ dịka ‘gịnị mere,’ nke na-egosipụta ike ajụjụ nkọcha ahụ n’Igbo eke.
- source_word: δὲ
  choice: Ma
  rationale: δέ na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche n’ihe e kwuru tupu ya; ‘Ma’ dabara nke ọma.
- source_word: βλέπεις
  choice: ị ... ahụ
  rationale: ‘Ịhụ’ na-edobe ihe oyiyi anya ahụ ma dị iche na κατανοεῖς, nke a sụgharịrị ‘ịchọpụta.’
- source_word: κάρφος
  choice: irighiri ihe
  rationale: κάρφος bụ obere ihe kpọrọ nkụ, dịka iberibe ahịhịa, mkpachapụ osisi, ma ọ bụ ntakịrị ntụ; ‘irighiri ihe’ bụ okwu sara mbara, doo anya, ma ghara ịkọwa ụdị ihe ahụ karịa isi mmalite.
- source_word: ἀδελφοῦ
  choice: nwanne gị nwoke
  rationale: Okwu Grik ahụ bụ otu nwoke; ‘nwanne gị nwoke’ na-edobe ma mmekọrịta nwanne ma ụdị nwoke e kwuru kpọmkwem.
- source_word: σῷ
  choice: nke gị
  rationale: Ụdị nnọchiaha a nwere nkwusi ike; ‘nke gị’ na-eme ka ọdịiche dị n’etiti anya nwanne ya na anya nke ya pụta ìhè.
- source_word: δοκόν
  choice: nnukwu osisi
  rationale: δοκός bụ nnukwu osisi a na-eji akwado ụlọ. ‘Nnukwu osisi’ na-eme ka ihe oyiyi ahụ ghọta ndị Igbo taa ma na-edobe nnukwu ọdịiche ya na irighiri ihe.
- source_word: οὐ κατανοεῖς
  choice: ị naghị achọpụta
  rationale: κατανοέω pụtara ilebara anya ruo n’ịchọpụta ma ọ bụ ịghọta. ‘Ị naghị achọpụta’ na-edobe ihe ọchị dị ilu n’ajụjụ ahụ ma dị iche na ‘ịhụ.’
- source_word: ὀφθαλμῷ
  choice: anya
  rationale: Nke a bụ okwu Igbo nkịtị na nke ziri ezi maka ὀφθαλμός n’ihe oyiyi a.
theological_decisions:
- issue: Okwu mmekọrịta nwoke, ἀδελφοῦ
  choice: nwanne gị nwoke
  alternative: nwanne gị; onye ibe gị
  rationale: Isi mmalite ahụ ji otu nwoke kpọmkwem. Nsụgharị ahụ na-edobe nke a n’agbanyeghị na nkuzi ahụ metụtara mmadụ niile.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere usoro ajụjụ nkọcha na nnukwu ọdịiche dị n’etiti obere irighiri ihe na nnukwu osisi. A họọrọ ‘nwanne gị nwoke’ iji gosi ụdị otu nwoke dị na Grik n’enweghị ịtụnye nkọwa ụka pụrụ iche.
