source:
  edition: SBLGNT
  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: ig
  text: Kpacharanụ anya maka ndị amụma ụgha[a], ndị na-abịakwute unu yi uwe atụrụ[b], ma n’ime ha, ha bụ wolf na-achọ iri anụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nọọnụ na nche megide ndị amụma ụgha.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ mkpụrụokwu n’ụzọ mkpụrụokwu, “n’uwe atụrụ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n’ime ha ha bụ wolf ndị na-apụnara ihe n’ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Kpacharanụ anya maka
  rationale: Ngwaa iwu dị n’oge ugbu a na-akpọ ndị na-ege ntị ka ha nọgide na-eche nche megide ndị a; okwu Igbo a na-egosipụta ịdọ aka ná ntị ahụ n'ụzọ doro anya ma dịkwa eke.
- source_word: ψευδοπροφητῶν
  choice: ndị amụma ụgha
  rationale: Nke a bụ okwu Igbo a na-aghọta ngwa ngwa maka ndị na-azọrọ na ha bụ ndị amụma ma ha abụghị, ma ọ bụ ndị na-ekwu okwu ụgha dịka ndị amụma.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: ndị na-abịakwute unu
  rationale: Ọ na-edobe nkọwa banyere ụdị ndị a na-ekwu maka ha, tinyere echiche nke ịbịaru ndị na-ege ntị nso.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: yi uwe atụrụ
  rationale: Ọ na-edobe ihe atụ nke ọdịdị atụrụ n’èzí n’Igbo dị mfe ma dị ndụ; ‘yi’ na-eme ka ahịrịokwu ahụ daa nke ọma karịa ntụgharị mkpụrụokwu n’otu n’otu.
- source_word: ἔσωθεν δέ
  choice: ma n'ime ha
  rationale: Ọ na-egosipụta ọdịiche siri ike dị n’etiti ihe a na-ahụ n’èzí na ụdị ha bụ n’ezie n’ime.
- source_word: λύκοι ἅρπαγες
  choice: anụ ọhịa wolf ndị na-adọgbu anụ
  rationale: ‘Ndị na-adọgbu anụ’ na-egosipụta omume anụ na-awakpo ma na-ebibi anụ ọ jidere, nke na-eburu ike nke ἅρπαγες n’ụzọ ndị na-agụ Igbo ga-aghọta.
theological_decisions:
- issue: Ụdị ịdọ aka ná ntị megide ndị ndu okpukpe na-eduhie mmadụ
  choice: E debere ihe atụ ahụ dịka ịdọ aka ná ntị banyere ndị amụma ụgha ndị ọdịdị ha n’èzí na-ekpuchi ụdị mbibi ha nwere n’ezie.
  alternative: Ịkọwa ya kpọmkwem dịka ndị ozizi jụrụ otu ozizi chọọchị e guzobere n’oge mechara.
  rationale: Amaokwu Grik ahụ kwuru maka ndị amụma ụgha ma jiri ọdịiche dị n’etiti uwe atụrụ na wolf na-adọgbu anụ kọwaa ha. Ọ naghị akọwapụta otu chọọchị, otu ụka, ma ọ bụ esemokwu ozizi e mesịrị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ntụgharị a. ‘Anụ ọhịa wolf’ na-edobe anụ ahụ kpọmkwem n’ihe atụ ahụ; a zere itinye nkọwa ụka ma ọ bụ nke otu ozizi n’ime amaokwu ahụ.
