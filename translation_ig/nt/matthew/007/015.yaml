revisions:
- from: Kpacharanụ anya maka ndị amụma ụgha[a], ndị na-abịakwute unu yi uwe atụrụ[b], ma n'ime ha, ha bụ anụ ọhịa wolf ndị na-adọgbu anụ[c].
  to: Kpacharanụ anya maka ndị amụma ụgha[a], ndị na-abịakwute unu yi uwe atụrụ[b], ma n’ime ha, ha bụ wolf na-achọ iri anụ[c].
  rationale: The revision preserves the Greek contrast between outward sheep-like dress and inward predatory reality. It removes a redundant animal expression, sharpens the rendering of ἅρπαγες as ravenous predation, and makes the warning alternative in footnote a unambiguous. No doctrinal interpretation is added.
