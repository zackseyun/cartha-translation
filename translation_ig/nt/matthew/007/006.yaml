revisions:
- from: Unu enyela nkịta ihe dị nsọ[a], unu atụbakwala nkume pel unu n’ihu ezi[b], ka ha ghara iji ụkwụ ha zọpịa ha, tụgharịa wee dọkasịa unu[c].
  to: Unu enyela nkịta ihe dị nsọ[a], unu atụkwala pel unu n’ihu ezi[b], ka ha wee ghara iji ụkwụ ha zọpịa ha, tụgharịa dọkasịa unu[c].
  rationale: The revision replaces the less idiomatic “nkume pel” with “pel,” regularizes the result-warning construction as “ka ha wee ghara,” and renders στραφέντες ῥήξωσιν as the natural Igbo sequence “tụgharịa dọkasịa.” It keeps the Greek’s broad sacred referent, vivid animal imagery, plural addressees, and the two feared outcomes intact. Footnote b is placed after the whole expression to which its traditional wording pertains.
