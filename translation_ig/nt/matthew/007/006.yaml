  verdict: revise
  source_fidelity: 'The draft retains all principal elements of the Greek: the plural prohibitions, the broad substantival sense of τὸ ἅγιον, the dogs/pigs and pearls imagery, the trampling with feet, and the subsequent turning to tear the hearers. A small syntactic revision makes the warning clause and the participial sequence more idiomatic in Standard Igbo without narrowing the metaphors.'
  naturalness: “Nkume pel” is understandable but less natural and less economical than “pel” for ‘pearls.’ The warning is smoother with “ka ha wee ghara,” and the hostile sequence reads more naturally without “wee” after “tụgharịa.”
  terminology: “Ihe dị nsọ,” “nkịta,” “pel,” “ezi,” “zọpịa,” and “dọkasịa” are suitable Standard Igbo equivalents. The imagery remains metaphorical and no doctrinal interpretation is added.
  issues:
  - severity: low
    issue: “nkume pel” is somewhat redundant/less idiomatic for μαργαρίτας.
    rationale: “Pel” is the ordinary concise Igbo borrowing for pearls and preserves the plural reference by context.
  - severity: medium
    issue: The subordinate warning clause is slightly awkward as drafted.
    rationale: Adding “wee” in “ka ha wee ghara” clearly introduces the anticipated harmful result, while “tụgharịa dọkasịa” naturally renders the participle-plus-verb sequence.
  - severity: low
    issue: The traditional-rendering footnote is anchored after “ezi” rather than at the phrase “pel unu n’ihu ezi.”
    rationale: Moving the anchor to the complete phrase it concerns improves footnote anchoring without affecting meaning.
