id: MAT.7.6
reference: Matthew 7:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: ig
  text: Unu enyela nkịta ihe dị nsọ[a], unu atụkwala pel unu n’ihu ezi[b], ka ha wee ghara iji ụkwụ ha zọpịa ha, tụgharịa dọkasịa unu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe ahụ dị nsọ” ma ọ bụ “ihe e doro nsọ.” Okwu Grik ahụ sara mbara.
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ ọdịnala: “unu atụkwala pel unu n’ihu ezi.”'
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “tụgharịa wee dọwaa unu” ma ọ bụ “tụgharịa wee dọkasị unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: ihe dị nsọ
  rationale: Adjective a e ji dị ka aha n’asụsụ Grik nwere ntụaka sara mbara. “Ihe dị nsọ” bụ Igbo doro anya nke na-adịghị akpọwa ya kpọmkwem dị ka ozizi, ihe e doro nsọ, ma ọ bụ ihe ọzọ.
- source_word: κυσίν
  choice: nkịta
  rationale: Nke a bụ aha nkịtị maka “dogs”; ọ na-edobe ihe atụ ahụ na ịdị nkọ ya n’enweghị ime ka okwu ahụ dị nro.
- source_word: βάλητε
  choice: atụbakwala
  rationale: “Ịtụba” na-enye nghọta nkịtị nke βάλλω ma na-adabara ihe a na-atụ n’ihu anụmanụ; njikọ “-kwala” na-egosipụta iwu nke abụọ a machibidoro.
- source_word: μαργαρίτας
  choice: nkume pel
  rationale: “Nkume pel” bụ okwu Igbo a na-aghọta maka pearl, a hapụkwara ya n’ụbara dị ka isi mmalite ahụ si dị.
- source_word: χοίρων
  choice: ezi
  rationale: “Ezi” bụ okwu Igbo nkịtị maka pigs ma na-edobe ihe atụ ahụ.
- source_word: μήποτε
  choice: ka ha ghara
  rationale: Nkebiokwu a na-ebute ịdọ aka ná ntị banyere ihe nwere ike isi n’omume ahụ pụta. “Ka ha ghara” na-ekwupụta echiche ahụ n’ụzọ Igbo e ji eme ihe.
- source_word: καταπατήσουσιν ... ἐν τοῖς ποσὶν αὐτῶν
  choice: iji ụkwụ ha zọpịa ha
  rationale: “Zọpịa” na “iji ụkwụ ha” jikọtara ọnụ na-ebupụta ihe oyiyi nke ịzọ ihe ụkwụ nke ọma, n’enweghị nkwughachi na-adịghị eke.
- source_word: στραφέντες ῥήξωσιν
  choice: tụgharịa wee dọkasịa
  rationale: 'Nke a na-edobe usoro omume abụọ ahụ: ha tụgharịa, mesịa mee ihe ike nke ịdọkasị. “Dọkasịa” ka siri ike karịa nanị “wakpo.”'
- source_word: ὑμᾶς
  choice: unu
  rationale: Nnọchiaha a bụ onye nke abụọ n’ụbara; “unu” na-egosipụta nke ahụ kpọmkwem.
theological_decisions:
- issue: Ihe ihe atụ ndị a—“ihe dị nsọ,” “nkịta,” “nkume pel,” na “ezi”—pụtara kpọmkwem
  choice: Edobere ihe atụ niile n’enweghị nkọwa agbakwunyere.
  alternative: Ịkọwa “ihe dị nsọ” ma ọ bụ “nkume pel” dị ka ozi alaeze, ma kọwaa “nkịta” na “ezi” dị ka ndị ajọ omume ma ọ bụ ndị na-emegide ozi ọma.
  rationale: Amaokwu ahụ akọwaghị ndị ma ọ bụ ihe oyiyi ndị a kpọmkwem. Ịhapụ ha dị ka ihe atụ na-echekwa obosara ihe isi mmalite ahụ nwere ma zere itinye nkọwa otu okwukwe n’ime ederede.
- issue: Mmekọrịta dị n’etiti ịzọpịa pel na ịdọkasị ndị a na-agwa okwu
  choice: 'E debere ha dị ka ihe abụọ anụmanụ ndị ahụ nwere ike ime n’usoro: zọpịa ha, tụgharịa, dọkasịa unu.'
  alternative: Ime ka akụkụ nke abụọ bụrụ nkọwa nke akụkụ mbụ, ma ọ bụ ikewapụ ndị na-eme omume abụọ ahụ.
  rationale: Usoro okwu Grik na-enye otu isiokwu ahụ maka omume ndị a ma na-egosi ntụgharị tupu mwakpo ahụ; nsụgharị ahụ anaghị edozi ihe oyiyi a karịa ka ederede si mee.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Unu” na-edobe ụbara nke iwu na nnọchiaha Grik. E jighị nkọwa ụka pụrụ iche dochie ihe atụ ndị siri ike dị n’amaokwu ahụ.
