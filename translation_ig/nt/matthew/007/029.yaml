- from: N’ihi na ọ nọ na-akụziri ha ihe dịka onye nwere ikike[a], ọ bụghịkwa dịka ndị odeakwụkwọ ha.
  to: N'ihi na ọ nọ na-akụziri ha dịka onye nwere ikike[a], ọ bụghịkwa dịka ndị odeakwụkwọ ha.
  rationale: The revision removes the unstated ‘ihe,’ preserves the source’s explanatory and imperfective force, retains the non-doctrinally-expanded expression ‘dịka onye nwere ikike,’ and makes the lexical-alternative footnote idiomatic in Standard Igbo.
