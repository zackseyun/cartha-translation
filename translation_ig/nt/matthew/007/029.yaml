  text: ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: ig
  text: N'ihi na ọ nọ na-akụziri ha dịka onye nwere ikike[a], ọ bụghịkwa dịka ndị odeakwụkwọ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya n’ụzọ Igbo na-adị mfe: “jiri ikike.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: N’ihi na ọ nọ na-akụziri
  rationale: “N’ihi na” na-egosipụta ọrụ nkọwa nke γάρ, ebe “ọ nọ na-akụziri” na-echekwa omume na-aga n’ihu n’oge gara aga nke periphrastic imperfect.
- source_word: αὐτούς
  choice: ha
  rationale: Nnọchiaha a na-ezo aka n’ìgwè mmadụ ndị na-ege Jizọs ntị.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: dịka onye nwere ikike
  rationale: Nke a na-esochi usoro Grik nke ọma ma na-egosi na ikike ahụ bụ àgwà onye na-akụzi, n’akọwaghị ebe ikike ahụ si bịa.
- source_word: καὶ οὐχ ὡς
  choice: ọ bụghịkwa dịka
  rationale: Nke a na-echekwa njikọ na ọdịiche doro anya dị n’ederede Grik.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: ndị odeakwụkwọ ha
  rationale: “Ndị odeakwụkwọ” bụ okwu kpọmkwem maka ndị ọkachamara n’Iwu n’ọnọdụ a; “ha” na-echekwa αὐτῶν.
theological_decisions:
- issue: Ụdị ikike Jizọs nwere mgbe ọ na-akụzi
  choice: dịka onye nwere ikike
  alternative: jiri ikike; dịka onye nwere ikike Chineke
  rationale: Amaokwu ahụ na-ekwu na ikike Jizọs dị adị ma jiri ụzọ nkuzi ya tụnyere nke ndị odeakwụkwọ, ma ọ kọwaghị kpọmkwem ntọala nkà mmụta okpukpe nke ikike ahụ. Nsụgharị a anaghị eme ka ọ bụrụ naanị obi ike, ọ naghịkwa etinye nkọwa karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ọ nọ na-akụziri” na-eburu ọdịdị omume na-aga n’ihu, ebe “dịka onye nwere ikike” na-echekwa ntụnyere na mgbagwoju anya dị n’isi mmalite.
