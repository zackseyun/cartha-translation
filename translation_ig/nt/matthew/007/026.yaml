  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: ig
  text: Onye ọ bụla na-anụ okwu m ndị a ma anaghị eme ha ga-adị ka otu nwoke nzuzu[a], onye wuru ụlọ ya n'elu ájá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu onye nzuzu.” N’asụsụ Grik, e dere “otu nwoke nzuzu,” na-eji nwoke anọchi anya mmadụ n’ihe atụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: Onye ọ bụla nke na-anụ
  rationale: Nkebi a na-arụ ọrụ dị ka aha ma na-emetụta onye ọ bụla; nsụgharị a bụ Igbo doro anya ma na-echekwa ihe ọ pụtara n'ozuzu ya.
- source_word: μου τοὺς λόγους τούτους
  choice: okwu m ndị a
  rationale: Nke a na-echekwa ma ngosipụta ‘ndị a’ ma njikọ nke okwu ndị ahụ na Jizọs.
- source_word: μὴ ποιῶν αὐτούς
  choice: ma ghara ime ha
  rationale: ‘Ime ha’ na-esochi ποιέω n'ụzọ kwụ ọtọ ma na-egosi na onye ahụ anaghị eme ihe okwu ndị ahụ kwuru.
- source_word: ὁμοιωθήσεται
  choice: ga-adị ka
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ihe n'ịkọwa ntụnyere n'ọdịnihu.
- source_word: ἀνδρὶ μωρῷ
  choice: otu nwoke nzuzu
  rationale: ἀνήρ kpọmkwem bụ nwoke; ‘nwoke nzuzu’ na-echekwa asụsụ nwoke nke ihe atụ ahụ, ebe ‘otu’ na-eme ka ntụnyere ahụ daa nke ọma n'Igbo.
- source_word: ὅστις
  choice: nke
  rationale: ‘Nke’ na-ewebata nkọwa gbasara nwoke ahụ n'ụzọ ebumpụta ụwa n'Igbo.
- source_word: ᾠκοδόμησεν
  choice: wuru
  rationale: Okwu a na-enye ihe ngwaa Grik ahụ pụtara n'ụzọ dị mkpirikpi na nke nkịtị.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: ụlọ ya
  rationale: ‘Ụlọ’ na-ezo aka n'ụlọ a na-ewu n'ihe atụ ahụ, ‘ya’ echekwakwa ihe nnọchiaha nwe.
- source_word: ἐπὶ τὴν ἄμμον
  choice: n'elu ájá
  rationale: Nke a na-egosi ebe e wuru ụlọ ahụ ma na-echekwa oyiyi nke iwukwasị ya n'elu ájá.
theological_decisions:
- issue: Asụsụ nwoke e ji anọchi anya mmadụ n'ihe atụ ahụ
  choice: otu nwoke nzuzu
  alternative: otu onye nzuzu
  rationale: Grik ji ἀνήρ, nke pụtara nwoke, mee ihe atụ ahụ. A hapụrụ nkọwa nwoke ahụ n'amaokwu ahụ, ma ihe ‘onye ọ bụla’ dị na mbido na-egosi na ịdọ aka ná ntị ahụ metụtara mmadụ niile.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ghara ime ha’ chekwaa njikọ kpọmkwem dị n'etiti ịnụ okwu na ime ha; e jikwa ‘nwoke’ chekwaa nkọwa doro anya nke ἀνήρ, tinyere nkọwa ala peeji maka nhọrọ zuru mmadụ ọnụ.
