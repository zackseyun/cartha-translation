  source_fidelity: 'The draft retains all source elements: the generic ‘everyone,’ hearing Jesus’ present words, not doing them, the future comparison, the explicitly male representative figure, his building of his own house, and the sand foundation. Recasting the two participial descriptions with matching habitual negatives better represents their generic-present force without adding interpretation.'
