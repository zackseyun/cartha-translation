  terminology: ‘Okwu m ndị a,’ ‘nwoke nzuzu,’ ‘ụlọ ya,’ and ‘ájá’ are appropriate. ‘Nwoke’ properly preserves ἀνήρ in the comparison; the footnote may state the inclusive representative application without neutralizing the verse.
