id: MAT.7.4
reference: Matthew 7:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: ig
  text: Ma ọ bụ, olee otú ị ga-esi sị nwanne gị[a], ‘Kwe ka m wepụ irighiri ihe[b] n’anya gị,’ ma lee, osisi e ji akwado ụlọ[c] dị n’anya gị?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a bụ “nwanne nwoke gị”; a pụkwara iji ya mee ihe maka onye ibe n’ụzọ nnọchiteanya.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya “obere iberibe osisi”; okwu Grik κάρφος pụtara obere iberibe ihe kpọrọ nkụ.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya “nnukwu osisi e ji ewu ụlọ”; okwu Grik δοκός pụtara nnukwu osisi e ji akwado ụlọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ πῶς ἐρεῖς
  choice: Ma ọ bụ, olee otu ị ga-esi sị
  rationale: “Ma ọ bụ” na-ejikọ ajụjụ a na arụmụka bu ya ụzọ, ebe “olee otu ị ga-esi sị” na-echekwa ụdị ajụjụ na ọdịdị ọdịnihu nke ἐρεῖς.
- source_word: τῷ ἀδελφῷ σου
  choice: nwanne gị
  rationale: “Nwanne” bụ okwu Igbo ebumpụta ụwa maka onye otu nne na nna ma ọ bụ onye ibe n’otu okwukwe; ọ naghị egosi nwoke ma ọ bụ nwanyị n’onwe ya, ọ bụ ezie na Grik ji aha nwoke otu onye mee ihe.
- source_word: Ἄφες ἐκβάλω
  choice: Kwe ka m wepụ
  rationale: N’ebe a Ἄφες bụ arịrịọ maka ikike, ya mere “Kwe ka m” dabara n’Igbo; “wepụ” na-egosi iwepụta ihe n’anya n’ụzọ doro anya.
- source_word: τὸ κάρφος
  choice: irighiri ihe
  rationale: κάρφος bụ obere iberibe ihe kpọrọ nkụ. “Irighiri ihe” na-echekwa echiche nke ihe pere mpe n’akọwaghị ya kpọmkwem dịka ogwu osisi.
- source_word: καὶ ἰδοὺ
  choice: ma lee
  rationale: “Lee” na-akpọ uche onye na-agụ ka ọ hụ ihe ijuanya ahụ; “ma” na-egosipụta nnukwu ọdịiche dị n’etiti ihe onye ahụ kwuru na ọnọdụ nke ya.
- source_word: ἡ δοκὸς
  choice: nnukwu osisi
  rationale: δοκός bụ nnukwu osisi e ji ewu ụlọ. “Nnukwu osisi” bụ okwu ndị mmadụ na-aghọta ngwa ngwa ma na-echekwa nnukwu ọdịiche ya na irighiri ihe.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: dị n’anya nke gị
  rationale: '“Nke gị” na-eme ka ntụnyere ahụ pụta ìhè n’Igbo: ihe ahụ dị n’anya onye na-achọ idozi anya onye ọzọ.'
theological_decisions:
- issue: Ụdị nwoke nke ἀδελφῷ
  choice: nwanne gị
  alternative: nwanne nwoke gị
  rationale: Grik bụ aha nwoke otu onye, ma “nwanne” n’Igbo bụ okwu nkịtị na nke ebumpụta ụwa nke nwere ike ịpụta nwanne nwoke ma ọ bụ nwanyị. Ihe e dere n’okpuru na-eme ka ụdị Grik doo anya n’ebugharịghị nkọwa ọzọ n’ime amaokwu ahụ.
- issue: Nnukwu ihe atụ κάρφος / δοκός
  choice: irighiri ihe / nnukwu osisi
  alternative: obere ogwu osisi / osisi e ji akwado ụlọ
  rationale: Nhọrọ a na-echekwa ikwubiga okwu ókè nke Jizọs na nnukwu ọdịiche dị n’etiti ihe abụọ ahụ, n’emeghị ka ụdị obere ihe ahụ sie ike karịa ihe Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. “Ma lee” na-edobe oku ἰδοὺ na-akpọ uche, ebe “n’anya nke gị” na-eme ka ọdịiche ahụ pụta ìhè n’ụzọ Igbo si ekwu okwu.
