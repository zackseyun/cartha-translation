  to: Ma ọ bụ, olee otú ị ga-esi sị nwanne gị[a], ‘Kwe ka m wepụ irighiri ihe[b] n’anya gị,’ ma lee, osisi e ji akwado ụlọ[c] dị n’anya gị?
  rationale: Revised only the rendering of δοκός and its corresponding note. The new wording identifies the object as a building beam/timber rather than a living tree, preserving the source’s concrete imagery and scale contrast without introducing doctrinal interpretation. The remainder is retained because it is faithful and natural Standard Igbo.
