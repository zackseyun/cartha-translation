id: MAT.7.9
reference: Matthew 7:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: ig
  text: Ma ọ̀ nwere onye n’ime unu nke, mgbe nwa nwoke ya rịọrọ ya achịcha, ọ ga-enye ya nkume?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: Ma
  rationale: Ọ na-ejikọta ajụjụ atụ a na okwu bu ya ụzọ n’ụzọ Igbo si ada nke ọma.
- source_word: τίς ... ἄνθρωπος
  choice: ò nwere nwoke
  rationale: Nke a na-eme ka ajụjụ nkwupụta ahụ bụrụ Igbo nkịtị ma na-edobe aha nwoke nke Grik ji mee ihe n’ụzọ nnọchite anya.
- source_word: ἐξ ὑμῶν
  choice: n’ime unu
  rationale: Ọ bụ ụzọ Igbo doro anya e si egosi otu onye sitere n’etiti ndị a na-agwa okwu.
- source_word: ὁ υἱὸς αὐτοῦ
  choice: nwa ya
  rationale: N’Igbo, “nwa” nwere ike ịpụta nwa nwoke ma ọ bụ nwaanyị; n’ebe a, njikọ ya na okwu Grik υἱός ka na-egosi nwa nwoke n’ọnọdụ a n’enweghị okwu na-ada arọ.
- source_word: αἰτήσει
  choice: ga-arịọ ya
  rationale: Ọ na-edobe ọdịdị ọdịnihu nke ngwaa Grik, ma tinye onye a na-arịọ dịka asụsụ Igbo chọrọ.
- source_word: ἄρτον
  choice: achịcha
  rationale: Nke a bụ ntụgharị kpọmkwem ma bụrụkwa okwu ndị mmadụ na-aghọta maka bread.
- source_word: μὴ ... ἐπιδώσει αὐτῷ
  choice: ya enye ya
  rationale: Ụdị ajụjụ a na-atụ anya azịza mba; usoro a na-eme ka atụmanya ahụ pụta ìhè n’Igbo n’etinyeghị “ọ bụghị” nke na-adịghị n’ahịrị okwu ahụ.
- source_word: λίθον
  choice: nkume
  rationale: Ọ na-edobe ihe e ji tụnyere achịcha n’ụzọ kpọmkwem.
theological_decisions:
- issue: Asụsụ nwoke e ji nọchite anya mmadụ
  choice: nwoke
  alternative: onye
  rationale: ἄνθρωπος nọ n’ụdị otu nwoke ma na-arụ ọrụ nnọchite anya. E debere “nwoke” n’ahịrị isi, ebe nkọwa ala peeji na-egosi na ọ na-anọchite anya mmadụ n’ozuzu ya n’ajụjụ a.
- issue: Ajụjụ na-atụ anya azịza mba
  choice: ya enye ya nkume?
  alternative: ọ̀ gaghị enye ya nkume?
  rationale: μή na-egosi na a na-atụ anya azịza mba, ma ịtinye nkwupụta na-adịghị mma ozugbo nwere ike ịgbanwe ọdịdị ajụjụ ahụ. E debere esemokwu ahụ dịka ajụjụ nkwupụta.
translation_notes:
  register: Asụsụ ahụ bụ Igbo ọkọlọtọ, dị mfe ma dị ùgwù. A họọrọ usoro ajụjụ a na-asụkarị n’Igbo, ma e debe ọdịdị nwoke, nwa, achịcha, na nkume nke isi mmalite Grik.
