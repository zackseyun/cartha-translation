revisions:
- from: Mmiri ozuzo wee daa, osimiri wee bịa[a], ifufe wee fee, kụgidekwa ụlọ ahụ. Ụlọ ahụ wee daa, ọdịda ya dịkwa ukwuu.
  to: Mmiri ozuzo wee daa, osimiri wee bịa[a], ifufe wee fee ma tie ụlọ ahụ, ụlọ ahụ wee daa, ọdịda ya dịkwa ukwuu.
  rationale: The revision corrects the wind-and-house clause so that it is grammatically complete, natural in Standard Igbo, and faithful to προσέκοψαν. It retains the source’s storm sequence, its unexpanded ruin imagery, and the lexical ambiguity of ποταμοί through the footnote.
  reviewer_model: gpt-5.6-terra
