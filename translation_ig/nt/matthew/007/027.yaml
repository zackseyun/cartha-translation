id: MAT.7.27
reference: Matthew 7:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: ig
  text: Mmiri ozuzo wee daa, osimiri wee bịa[a], ifufe wee fee ma tie ụlọ ahụ, ụlọ ahụ wee daa, ọdịda ya dịkwa ukwuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmiri idei wee bịa.” Okwu Grik ahụ pụtara n'ụzọ nkịtị “osimiri,” ma n'ebe a ọ pụrụ izo aka na mmiri idei.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: Mmiri ozuzo wee daa
  rationale: N'Igbo a na-asịkarị na mmiri ozuzo ‘dara’; nke a na-egosi i si n'elu rịdata ma na-ada ka okwu Igbo nkịtị.
- source_word: ἦλθον οἱ ποταμοί
  choice: osimiri wee bịa
  rationale: ποταμοί pụtara n'ụzọ nkịtị ‘osimiri.’ E debere ihe okwu Grik kwuru, ebe ihe gbara ya gburugburu na-eme ka a ghọta osimiri ndị ahụ dịka mmiri tojuru etoju.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: ifufe wee fee
  rationale: Nke a bụ ntụgharị doro anya ma bụrụkwa ụzọ Igbo si ekwu maka ifufe na-efe.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: kụgidekwa ụlọ ahụ
  rationale: N'ebe a προσκόπτω na-egosi ịkụgide ihe n'ike. ‘Kụgide’ na-eburu ike nke ifufe dakwasịrị ụlọ ahụ n'emebighị okwu ahụ ka ọ bụrụ nkọwa sara mbara.
- source_word: ἔπεσεν
  choice: Ụlọ ahụ wee daa
  rationale: ‘Daa’ na-edebe okwu dị mfe nke πίπτω; e kwughị ‘kwatuo kpamkpam,’ nke ga-abụ ịgbasa ihe isi mmalite kwuru.
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: ọdịda ya dịkwa ukwuu
  rationale: ‘Ọdịda’ kwekọrọ na πτῶσις ma na-ejide njikọ ya na ngwaa ‘daa’; ‘dị ukwuu’ na-echekwa nnukwu ịdị njọ nke nsonaazụ ahụ.
theological_decisions:
- issue: Ogo mbibi e sere na njedebe ilu a
  choice: ọdịda ya dịkwa ukwuu
  alternative: mbibi ya dị egwu nke ukwuu
  rationale: Okwu Grik kwuru na ọdịda ụlọ ahụ dị ukwuu, ma ọ kọwaghị kpọmkwem na nke a bụ ikpe ikpeazụ. Ya mere, ntụgharị a na-edebe ịdọ aka ná ntị ahụ n'ike n'etinyeghị nkọwa okpukpe ọzọ n'ime ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. Usoro ‘wee’ na-echekwa ngagharị na nkwughachi nke καί n'akụkọ ahụ n'ụzọ na-ada nke ọma n'Igbo.
