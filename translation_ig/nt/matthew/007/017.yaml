source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: ig
  text: N’ụzọ dị otu a[a], osisi ọma ọ bụla na-amị mkpụrụ ọma, ma osisi rere ure[b] na-amị mkpụrụ ọjọọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ya mere” ma ọ bụ “N’otu aka ahụ.”
    reason: lexical_alternative
  - marker: b
    text: “Rere ure” sụgharịrị okwu Grik sapron, nke nwekwara ike ịpụta “adịghị mma,” “mebiri emebi,” ma ọ bụ “rụrụ arụ.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị “mkpụrụ ọjọọ” dịka “mkpụrụ dị njọ.” Okwu “ọjọọ” na-echekwa echiche ọjọọ nke okwu Grik ahụ, ebe ọ ka dabara n’ihe atụ ọrụ ugbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: N’otu aka ahụ
  rationale: Ọ na-ejikọta okwu a na ihe atụ dị n’ihu ma na-egosi nkwubi okwu ma ọ bụ myirịta; ọ bụ okwu Igbo doro anya ma dịkwa n’usoro okwu nkịtị.
- source_word: πᾶν δένδρον
  choice: osisi ... ọ bụla
  rationale: Ọ na-echekwa nghọta nkesa nke πᾶν ya na aha otu, ya bụ, osisi nke ọ bụla.
- source_word: ἀγαθὸν
  choice: ọma
  rationale: Ọ na-egosi ịdị mma nke osisi n’ụzọ sara mbara, na-enweghị ịkọwa ihe atụ ahụ karịa ihe Grik kwuru.
- source_word: καρποὺς καλοὺς
  choice: mkpụrụ ọma
  rationale: N’ihe gbasara mkpụrụ osisi, καλός pụtara mkpụrụ dị mma; nsụgharị a bụ nke e ji eme ihe n’Igbo ma na-echekwa ịdị mfe nke ilu ahụ.
- source_word: ποιεῖ
  choice: na-amị
  rationale: Ọ bụ okwu Igbo kwekọrọ n’omume osisi nke ịmị mkpụrụ, ọ bụ ezie na ποιέω n’onwe ya pụtara ime ma ọ bụ mepụta.
- source_word: τὸ δὲ
  choice: ma osisi
  rationale: “Ma” na-egosi ọdịiche δέ na-etinye n’etiti ụdị osisi abụọ ahụ.
- source_word: σαπρὸν
  choice: rere ure
  rationale: Ọ na-egosipụta ihe mebiri emebi ma ọ bụ rere ure n’ụzọ doro anya, kama iji naanị okwu sara mbara bụ́ “ọjọọ.”
- source_word: καρποὺς πονηροὺς
  choice: mkpụrụ ọjọọ
  rationale: Ọ bụ okwu nkịtị n’ihe atụ gbasara osisi ma ka na-ahapụkwa echiche omume ọjọọ nke gburugburu okwu ahụ nwere.
theological_decisions:
- issue: Ma ihe atụ a ọ bụ naanị banyere ọrụ ugbo ka ọ bụkwa banyere omume mmadụ
  choice: E debere ihe atụ ahụ kpọmkwem dịka osisi na mkpụrụ, n’etinyeghị nkọwa ya banyere ndị amụma ụgha n’ahịrịokwu ahụ.
  alternative: Ịsụgharị ya n’ụzọ nkọwa dịka “onye ezi omume na-arụ ezi ọrụ, ma onye rụrụ arụ na-arụ ọrụ ọjọọ.”
  rationale: Grik kwuru ihe atụ ahụ n’onwe ya, ebe gburugburu amaokwu na-enye ya ike metụtara omume na mmụọ. Idebe ihe atụ ahụ na-echekwa esemokwu na omimi ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “na-amị mkpụrụ” mee ihe dịka okwu Igbo nkịtị maka osisi na-emepụta mkpụrụ; e zere ịgbakwunye nkọwa ozizi n’ime amaokwu ahụ.
