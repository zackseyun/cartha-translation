    rationale: “N’otu aka ahụ” commonly functions as “likewise,” whereas οὕτως here is more naturally “thus/in this way,” drawing the comparison from the preceding saying.
  - severity: low
    issue: Footnote c offers an unsuitable alternative.
    rationale: “Mkpụrụ ihe ọjọọ” means more nearly “fruit of evil” and introduces a different construction. “Mkpụrụ dị njọ” is a natural alternative that retains the phrase’s sense.
