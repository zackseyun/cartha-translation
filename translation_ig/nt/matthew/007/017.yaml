  verdict: revise
  source_fidelity: 'The principal clauses are faithful: the distributive sense of πᾶν δένδρον, the contrast marked by δέ, the tree-and-fruit imagery, and the present habitual verbs are retained. “N’otu aka ahụ” can mean “likewise/in the same manner,” but it is less direct here than οὕτως, which introduces the stated comparison or conclusion; “N’ụzọ dị otu a” better preserves that force.'
  naturalness: “Osisi ọma ọ bụla na-amị mkpụrụ ọma, ma osisi rere ure na-amị mkpụrụ ọjọọ” is natural, clear Standard Igbo. “N’ụzọ dị otu a” is a more idiomatic and contextually exact opening than “N’otu aka ahụ.”
  terminology: “Rere ure” appropriately conveys σαπρόν in the concrete agricultural image, and “mkpụrụ ọjọọ” suitably renders καρποὺς πονηρούς without forcing the moral application into the wording. The current note’s proposed “mkpụrụ ihe ọjọọ” is not a clean lexical alternative for the Greek phrase and should be replaced with a direct alternative such as “mkpụrụ dị njọ.”
  issues:
