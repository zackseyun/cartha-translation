review_pass:
  verdict: revise
  source_fidelity: The draft preserves the balanced reversal, the reflexive sense, and the unspecified agency of both passive verbs. However, the Greek uses future forms for both active verbs as well as the passives; rendering the active verbs with Igbo progressive forms ("na-ebuli / na-eweda") weakens that future correspondence. Using "ga-" throughout preserves the source tense and retains the proverbial force.
  naturalness: The revised wording is idiomatic Standard Igbo, concise, and keeps the parallel rhythm of the saying. "Onye ọ bụla ga-..." is more natural here than retaining the relative particle "nke" before a future verbal phrase.
  terminology: '"Ibuli onwe ya elu" and "iweda onwe ya ala" naturally convey self-exaltation and self-humbling. The passive expressions "a ga-eweda ya ala" and "a ga-ebuli ya elu" appropriately leave the agent unnamed, as does the Greek.'
  issues:
  - severity: low
    issue: The active verbs are rendered as present progressive forms.
    rationale: Both ὑψώσει and ταπεινώσει are future active indicatives. In this context, Igbo future forms more directly preserve the temporal form and the symmetrical construction.
  - severity: low
    issue: The footnote broadly says that the Greek words are masculine singular.
    rationale: The generic masculine point applies specifically to the Greek expressions for “whoever” and “himself,” not to every word in the sentence. A more precise note avoids overstatement.
  revised_text: Ma onye ọ bụla ga-ebuli onwe ya elu, a ga-eweda ya ala; onye ọ bụla ga-eweda onwe ya ala, a ga-ebuli ya elu.[a]
