    reason: cultural_note
  revision_rationale: The revision changes the two active clauses to Igbo future forms, matching the Greek future verbs while preserving the verse’s generic, proverbial character. It also refines the gender note so that it accurately identifies the relevant Greek expressions. The passive agency remains unstated.
