id: MAT.23.12
reference: Matthew 23:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: ig
  text: Ma onye ọ bụla ga-ebuli onwe ya elu, a ga-eweda ya ala; onye ọ bụla ga-eweda onwe ya ala, a ga-ebuli ya elu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ndị pụtara “onye ọ bụla” na “onwe ya” dị n’ụdị nwoke otu onye, ma n’okwu a ha na-anọchite onye ọ bụla. Okwu Igbo bụ “ya” anaghị egosi ma onye ahụ ọ̀ bụ nwoke ma ọ bụ nwaanyị.
    reason: cultural_note
lexical_decisions:
- source_word: ὅστις
  choice: onye ọ bụla nke
  rationale: Okwu a na-egosi onye ọ bụla n’enweghị ịkpọ otu onye aha, ma na-enye ụkpụrụ metụtara mmadụ niile.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche n’ihe Jizọs kwuru tupu nke a.
- source_word: ὑψώσει ἑαυτὸν
  choice: na-ebuli onwe ya elu
  rationale: Nke a bụ ụzọ Igbo si ekwu na mmadụ na-eme onwe ya onye ukwu ma ọ bụ na-achọ nsọpụrụ dị elu; ọ na-edobekwa ihe atụ nke ibuli elu.
- source_word: ταπεινωθήσεται
  choice: a ga-eweda ya ala
  rationale: Ụdị okwu a na-edobe passive nke Grik ma ghara ịkpọ onye ga-eweda ya ala aha.
- source_word: ταπεινώσει ἑαυτὸν
  choice: na-eweda onwe ya ala
  rationale: Ọ na-egosi na onye ahụ ji aka ya họrọ ịdị umeala n’obi, ma na-edobe ọdịiche dị n’etiti iweda ala na ibuli elu.
- source_word: ὑψωθήσεται
  choice: a ga-ebuli ya elu
  rationale: Ọ na-edobe passive na njikọ okwu ya na ‘na-ebuli onwe ya elu,’ n’enweghị ịkọwa onye na-eme ihe ahụ.
theological_decisions:
- issue: Onye na-eme ihe e kwuru n’ụdị passive
  choice: Hapụ onye na-eweda ala ma ọ bụ na-ebuli elu n’ekwughị aha site n’iji ‘a ga-’.
  alternative: Kwuo hoo haa na Chineke ga-eweda onye ahụ ala ma ọ bụ bulie ya elu.
  rationale: Grik akpọghị onye na-eme ihe ndị a aha. Nsụgharị ahụ na-edobe ohere nke ịghọta ọrụ Chineke n’enweghị itinye aha ya n’ebe isiokwu ahụ na-etinyeghị ya.
- issue: Nnọchite nwoke n’ụdị okwu Grik
  choice: Jiri ‘onye ọ bụla’ na ‘ya,’ nke na-anọchite mmadụ ọ bụla n’Igbo.
  alternative: Tinye okwu na-akọwa onye ahụ kpọmkwem dị ka nwoke.
  rationale: Ọ bụ ezie na Grik ji ụdị nwoke otu onye, okwu ahụ bụ ụkpụrụ zuru mmadụ niile ọnụ. ‘Onye ọ bụla’ na ‘ya’ bụ ụzọ ebumpụta ụwa Igbo si chekwaa nghọta ahụ n’enweghị ịgbanwe ya ka ọ bụrụ ọtụtụ mmadụ.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugwu ma dịkwa mfe nghọta. Ahịrị abụọ ahụ nwere nhazi yiri ibe ha—‘ibuli onwe ya elu / iweda ya ala’ na ‘iweda onwe ya ala / ibuli ya elu’—iji chekwaa ọdịdị ilu na ntụgharị ọnọdụ dị na Grik.
