revisions:
- from: Ma onye ọ bụla nke na-ebuli onwe ya elu, a ga-eweda ya ala; onye ọ bụla nke na-eweda onwe ya ala, a ga-ebuli ya elu.[a]
  to: Ma onye ọ bụla ga-ebuli onwe ya elu, a ga-eweda ya ala; onye ọ bụla ga-eweda onwe ya ala, a ga-ebuli ya elu.[a]
  rationale: The revision changes the two active clauses to Igbo future forms, matching the Greek future verbs while preserving the verse’s generic, proverbial character. It also refines the gender note so that it accurately identifies the relevant Greek expressions. The passive agency remains unstated.
  reviewer_model: gpt-5.6-terra
