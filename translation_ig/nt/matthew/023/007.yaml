  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ καλεῖσθαι ὑπὸ τῶν ἀνθρώπων· ⸀Ῥαββί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: ig
  text: na ekele n’ámá ahịa, nakwa ka ndị mmadụ kpọọ ha, ‘Rabaị.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμούς
  choice: ekele a na-ekele ha
  rationale: N’ebe a, okwu ahụ pụtara ekele nkwanye ùgwù a na-enye ha; ntụgharị a na-eme ka ebumnuche ahụ doo anya n’Igbo.
- source_word: ἀγοραῖς
  choice: ámá ahịa
  rationale: Ọ bụ ebe ọha na-azụ ma na-ere ahịa, kwekọrọ n’ọnọdụ obodo oge ahụ.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: ndị mmadụ
  rationale: ἄνθρωποι bụ okwu zuru mmadụ niile; ‘ndị mmadụ’ na-echekwa obosara ihe Grik kwuru kama ime ka ọ bụrụ naanị ụmụ nwoke.
- source_word: Ῥαββί
  choice: Rabaị
  rationale: E debere aha nsọpụrụ Semitik ahụ n’ụdị a na-asụ n’Igbo, kama ịkọwa ya n’ime ahịrịokwu.
theological_decisions:
- issue: Ma a ga-atụgharị ἀνθρώπων dịka ‘ụmụ nwoke’ ma ọ bụ ‘ndị mmadụ’
  choice: ndị mmadụ
  alternative: ụmụ nwoke
  rationale: N’agbanyeghị ntụgharị Bekee e nyere, okwu Grik a na-arụkarị ọrụ dịka okwu gụnyere mmadụ n’ozuzu; ọnọdụ a anaghị egosi na ọ bụ naanị ụmụ nwoke ka e bu n’obi.
- issue: Ichekwa aha ‘Ῥαββί’ dịka aha nsọpụrụ
  choice: Rabaị
  alternative: Onye Ozizi m
  rationale: Ichekwa ‘Rabaị’ na-ejikọta amaokwu a na arụmụka banyere aha nsọpụrụ n’amaokwu ndị na-esote, ma zere ịkọwa ihe karịrị ihe ederede kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. Akụkụ a bụ ihe na-aga n’ihu site n’amaokwu gara aga, ya mere e debere mbido ‘na’.
