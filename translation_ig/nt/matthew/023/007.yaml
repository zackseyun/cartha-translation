- from: na ekele a na-ekele ha n’ámá ahịa, nakwa ka ndị mmadụ na-akpọ ha, ‘Rabaị.’
  to: na ekele n’ámá ahịa, nakwa ka ndị mmadụ kpọọ ha, ‘Rabaị.’
  rationale: The revision removes the unnecessary repetitive passive wording, retains the verse as a continuation beginning with ‘na,’ and renders the coordinated infinitive with an idiomatic Igbo clause without narrowing ‘ndị mmadụ’ to males or interpreting the title beyond the source text.
