id: MAT.23.23
reference: Matthew 23:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: ig
  text: '“Ahụhụ dịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ! N’ihi na unu na-enye otu ụzọ n’ụzọ iri nke mint, dil na kumin, ma unu elegharala ihe ndị ka mkpa n’Iwu ahụ anya: ikpe ziri ezi, ebere na okwukwe[a]. Ihe ndị a ka unu kwesịrị ime, ma ghara ileghara ihe ndị ahụ anya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikwesị ntụkwasị obi.” Okwu Grik a nwere ike ịpụta okwukwe, ntụkwasị obi, ma ọ bụ ikwesị ntụkwasị obi; n’ọnọdụ gbasara omume a, ọtụtụ na-aghọta ya dị ka ikwesị ntụkwasị obi n’ọgbụgba ndụ.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Ahụhụ dịrị unu
  rationale: Na-egosipụta mkpu amụma nke ịkatọ na ikpe, ọ bụghị naanị mwute.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Ọ bụ aha a na-ejikarị akọwa ndị ọkachamara n’Iwu n’oge ahụ, ma na-edobe aha ọrụ ahụ kama ịgbasa nkọwa ya.
- source_word: ὑποκριταί
  choice: ndị ihu abụọ
  rationale: Ọ bụ okwu Igbo doro anya maka ndị na-eme ka ha bụ ihe ha na-abụghị, kwekọrọ n’echiche omume nke okwu Grik ahụ n’ebe a.
- source_word: ἀποδεκατοῦτε
  choice: na-enye otu ụzọ n’ụzọ iri
  rationale: Na-akọwa kpọmkwem omume inye otu ụzọ n’ụzọ iri n’asụsụ ndị nkịtị ga-aghọta.
- source_word: ἡδύοσμον, ἄνηθον, κύμινον
  choice: mint, dil na kumin
  rationale: Ejiri aha osisi na uda nri ndị a n’ụdị ntụgharị-aha a na-amata, ebe enweghị aha Igbo zuru ebe niile nke ga-adị kpọmkwem karịa.
- source_word: ἀφήκατε
  choice: elegharala ... anya
  rationale: Na-egosipụta ịhapụ ma ọ bụ ileghara ọrụ dị mkpa anya, nke dabara n’ịba mba dị n’amaokwu ahụ.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: ihe ndị ka mkpa n’Iwu ahụ
  rationale: Na-ebuga ihe atụ nke ịdị arọ gaa n’echiche nke ịdị mkpa n’Igbo eke na nghọta.
- source_word: κρίσιν
  choice: ikpe ziri ezi
  rationale: N’usoro ihe omume ọma a, okwu ahụ na-ezo aka n’ime ihe ziri ezi, ọ bụghị nanị n’ikpe mmadụ ikpe.
- source_word: ἔλεος
  choice: ebere
  rationale: Ọ bụ okwu Igbo ọdịnala ma doo anya maka obi ebere na omume ebere.
- source_word: πίστιν
  choice: okwukwe
  rationale: Na-edobe isi echiche nke ‘okwukwe’ ma na-ahapụkwa ‘ikwesị ntụkwasị obi’ n’ala peeji n’ihi na ọnọdụ omume a nwere ike ịkwado ya.
- source_word: ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ἀφιέναι
  choice: Ihe ndị a ka unu kwesịrị ime, n’elegharaghịkwa ihe ndị ọzọ anya
  rationale: 'Na-echekwa njikọ abụọ ahụ: ime ihe ndị ka mkpa ma ghara ịhapụ inye otu ụzọ n’ụzọ iri.'
theological_decisions:
- issue: Nkọwa πίστιν n’usoro ikpe ziri ezi, ebere na πίστις
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi
  rationale: Okwu Grik ahụ nwere ike ịpụta okwukwe, ntụkwasị obi, ma ọ bụ ikwesị ntụkwasị obi. A hapụrụ ‘okwukwe’ n’ahịrị isi iji ghara imechi nghọta ahụ, ma debe nkọwa omume nke ‘ikwesị ntụkwasị obi’ n’ala peeji.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘Iwu’ kpọọ Iwu Mozis n’ọnọdụ a. A họọrọ ahịrịokwu siri ike nke na-edobe ụda ịkatọ nke Jizọs, ma ghara itinye nkọwa ụka pụrụ iche.
