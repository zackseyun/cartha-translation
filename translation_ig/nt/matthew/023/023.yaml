revisions:
- from: '“Ahụhụ dịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ! N’ihi na unu na-enye otu ụzọ n’ụzọ iri nke mint, dil na kumin, ma unu elegharala ihe ndị ka mkpa n’Iwu ahụ anya: ikpe ziri ezi, ebere na okwukwe[a]. Ihe ndị a ka unu kwesịrị ime, n’elegharaghịkwa ihe ndị ọzọ anya.”'
  to: '“Ahụhụ dịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ! N’ihi na unu na-enye otu ụzọ n’ụzọ iri nke mint, dil na kumin, ma unu elegharala ihe ndị ka mkpa n’Iwu ahụ anya: ikpe ziri ezi, ebere na okwukwe[a]. Ihe ndị a ka unu kwesịrị ime, ma ghara ileghara ihe ndị ahụ anya.”'
  rationale: The revision retains the draft’s accurate renderings and its deliberate preservation of the πίστις ambiguity. It clarifies that the final "those things" refers to the tithing practices named in the verse and makes a minor naturalness improvement in the footnote.
