review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the denunciation, the tithing of the three herbs, the contrast with the more important requirements of the Law, and the final insistence that the lesser requirement not be set aside. πίστιν is appropriately rendered as "okwukwe" with "ikwesị ntụkwasị obi" preserved as an alternative. The final pronoun "ihe ndị ọzọ" is slightly too broad: κἀκεῖνα specifically points back to the tithing practices just mentioned.'
  naturalness: The Igbo is generally clear and suitably formal. Recasting the final clause as "ma ghara ileghara ihe ndị ahụ anya" is more idiomatic and makes the antecedent explicit without adding interpretation. "n’ọnọdụ gbasara omume" is smoother than "n’ọnọdụ omume" in the footnote.
  terminology: '"ndị odeakwụkwọ," "ndị Farisii," "ndị ihu abụọ," "Iwu," "ikpe ziri ezi," and "ebere" are appropriate Standard Igbo choices. Retaining the familiar international herb names is reasonable. "Ahụhụ dịrị unu" preserves the force of Οὐαί.'
  issues:
  - severity: low
    issue: The expression "ihe ndị ọzọ" in the final clause has an overly broad referent.
    rationale: Greek κἀκεῖνα means "those [things]," referring specifically to the tithing of mint, dill, and cumin, rather than unspecified other matters.
  - severity: low
    issue: The footnote phrase "n’ọnọdụ omume" is somewhat compressed.
    rationale: '"n’ọnọdụ gbasara omume" more naturally expresses the ethical context intended by the note.'
  revised_text: '“Ahụhụ dịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ! N’ihi na unu na-enye otu ụzọ n’ụzọ iri nke mint, dil na kumin, ma unu elegharala ihe ndị ka mkpa n’Iwu ahụ anya: ikpe ziri ezi, ebere na okwukwe[a]. Ihe ndị a ka unu kwesịrị ime, ma ghara ileghara ihe ndị ahụ anya.”'
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ikwesị ntụkwasị obi.” Okwu Grik a nwere ike ịpụta okwukwe, ntụkwasị obi, ma ọ bụ ikwesị ntụkwasị obi; n’ọnọdụ gbasara omume a, ọtụtụ na-aghọta ya dị ka ikwesị ntụkwasị obi n’ọgbụgba ndụ.
    reason: alternative_reading
  revision_rationale: The revision retains the draft’s accurate renderings and its deliberate preservation of the πίστις ambiguity. It clarifies that the final "those things" refers to the tithing practices named in the verse and makes a minor naturalness improvement in the footnote.
