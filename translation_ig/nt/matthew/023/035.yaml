id: MAT.23.35
reference: Matthew 23:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: ig
  text: ka ọbara niile nke ndị ezi omume, nke a na-awụfu n’elu ụwa, bịakwasị unu[a]—site n’ọbara Ebel onye ezi omume ruo n’ọbara Zekaraya nwa Barakaya[b], onye unu gburu n’etiti ebe nsọ ahụ na ebe ịchụ aja ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’elu ala ahụ.” Okwu Grik ahụ nwere ike ịpụta “ụwa” ma ọ bụ “ala.”
    reason: lexical_alternative
  - marker: b
    text: A ka na-arụrịta ụka banyere onye “Zekaraya nwa Barakaya” bụ. Ụfọdụ na-ejikọta ya na Zekaraya onye amụma; ndị ọzọ na-ejikọta ya na Zekaraya nwa Jehoiada (2 Ihe E Mere 24:20–22). Nsụgharị a gbasoro ihe odide Grik dịka e si dee ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: ka
  rationale: “Ka” na-egosi nzube ma ọ bụ ihe ga-esi n’okwu bu ụzọ pụta, ma na-ada ka Igbo nkịtị.
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: bịakwasị unu
  rationale: Nke a na-echekwa echiche nke ihe na-abịakwasị mmadụ, tinyere ụda ikpe dị n’okwu Grik.
- source_word: πᾶν αἷμα δίκαιον
  choice: ọbara niile nke ndị ezi omume
  rationale: N’asụsụ Grik, “ezi omume” na-akọwa ọbara n’ụzọ nnọchianya; Igbo a na-eme ka o doo anya na ọ bụ ọbara ndị ezi omume n’emebighị ihe ọ pụtara.
- source_word: ἐκχυννόμενον
  choice: nke a na-awụfu
  rationale: Ọ na-echekwa ọdịdị participle dị ugbu a na onyonyo nke ịwụfu ọbara.
- source_word: ἐπὶ τῆς γῆς
  choice: n’elu ụwa
  rationale: γῆ nwere ike ịbụ ụwa dum ma ọ bụ ala; usoro sitere n’Ebel gaa n’ihu na-akwado “ụwa,” ebe e debere ụzọ ọzọ na nkọwa ala peeji.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: site n’ọbara Ebel onye ezi omume
  rationale: Nke a na-echekwa njikọ genitive na aha nkọwa δίκαιος n’Igbo doro anya.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: ruo n’ọbara Zekaraya nwa Barakaya
  rationale: “Site…ruo…” na-egosipụta oke ἀπό…ἕως, ebe aha ndị ahụ na-agbaso ụdị a na-anụkarị n’Igbo.
- source_word: ὃν ἐφονεύσατε
  choice: onye unu gburu
  rationale: “Gburu” bụ ụzọ Igbo kacha kwụ ọtọ isi kwuo igbu mmadụ; ọnọdụ okwu a na-eme ka ebubo igbu ọchụ pụta ìhè.
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: n’etiti ebe nsọ ahụ na ebe ịchụ aja
  rationale: “Ebe nsọ ahụ” na-egosi ναός, ya bụ akụkụ ụlọ nsọ ahụ kpọmkwem, ọ bụghị ogige ụlọ nsọ dum; “ebe ịchụ aja” bụ okwu Igbo doro anya maka θυσιαστήριον.
theological_decisions:
- issue: Onye a na-akpọ Zekaraya nwa Barakaya bụ onye?
  choice: Idebe aha ahụ kpọmkwem dịka ihe odide Grik si dị
  alternative: Ịkọwa ya dịka Zekaraya onye amụma, ma ọ bụ jikọta ya na Zekaraya nwa Jehoiada
  rationale: Ihe odide Grik kwuru “nwa Barakaya.” Nsụgharị ahụ ekwesịghị idozi esemokwu akụkọ ihe mere eme n’ime isiokwu; a kọwara esemokwu ahụ n’ala peeji.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. A họọrọ “ebe nsọ ahụ” kama “ụlọ nsọ” iji gosi na ναός bụ ebe nsọ dị n’ime ogige ụlọ nsọ; e chekwara ihe mgbagwoju anya nke γῆ na njirimara Zekaraya n’ala peeji.
