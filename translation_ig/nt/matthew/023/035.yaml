    rationale: Greek has τοῦ θυσιαστηρίου, “the altar.” Since the draft already has “ebe nsọ ahụ” for τοῦ ναοῦ, “ebe ịchụ aja ahụ” better reflects the paired definite nouns without changing meaning.
