id: MAT.23.13
reference: Matthew 23:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: ig
  text: Ma ahụhụ dịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ! N’ihi na unu na-emechi alaeze eluigwe[a] n’ihu ndị mmadụ. Unu onwe unu adịghị abanye, unu adịghịkwa ekwe ka ndị na-abanye[b] banye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ okwu si dị kpọmkwem: “alaeze nke eluigwe.” Matiu na-ejikarị okwu a eme ihe n’ebe akwụkwọ ndị ọzọ nwere ike ịsị “alaeze Chineke.”'
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ndị na-agbalị ịbanye.” Okwu Grik ahụ nwere ike ịpụta ndị nọ n’usoro ịbanye ma ọ bụ ndị na-achọ ịbanye.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: ahụhụ dịrị unu
  rationale: Nke a na-egosipụta mkpọpụta ikpe na ịdọ aka ná ntị siri ike nke okwu amụma ahụ, kama ime ka ọ bụrụ naanị mwute.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Ọ bụ aha a maara nke ọma n’asụsụ Baịbụl maka ndị ọkachamara n’Iwu ahụ, ma ọ naghị atụgharị ya n’ụzọ ga-etinye nkọwa karịrị nke Grik.
- source_word: Φαρισαῖοι
  choice: ndị Farisii
  rationale: A sụgharịrị aha òtù ahụ n’ụdị a na-amakarị n’Igbo.
- source_word: ὑποκριταί
  choice: ndị ihu abụọ
  rationale: Okwu Igbo a na-egosi ndị na-eme ka ha bụ ihe ha na-abụghị, karịchaa n’omume okpukpe na omume ọma.
- source_word: κλείετε
  choice: na-emechi
  rationale: Ọ na-edobe ihe atụ nke igbochi ụzọ mbata n’alaeze ahụ.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: alaeze eluigwe
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a maara nke ọma isi kwuo okwu Matiu a, n’etinyeghị ọdịiche ozizi na-adịghị n’ebe a.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: n’ihu ndị mmadụ
  rationale: Ọ na-edobe echiche nke imechi ụzọ n’ihu ndị ọzọ n’ụzọ dị mfe nghọta n’Igbo.
- source_word: ἀνθρώπων
  choice: ndị mmadụ
  rationale: Okwu Grik a na-ekwu maka mmadụ n’ozuzu ha, ọ bụghị naanị ụmụ nwoke.
- source_word: εἰσέρχεσθε
  choice: adịghị abanye
  rationale: Ọ na-edobe ihe atụ nke ịbanye n’alaeze ahụ n’enweghị nkọwa agbakwunyere.
- source_word: τοὺς εἰσερχομένους
  choice: ndị na-abanye
  rationale: Ọ na-edobe ọdịdị present participle nke Grik, nke nwere ike ịpụta ndị nọ n’usoro ịbanye ma ọ bụ ndị na-agbalị ịbanye.
- source_word: ἀφίετε εἰσελθεῖν
  choice: ekwe ka … banye
  rationale: Nke a bụ ụzọ Igbo e si ekwu ikwe ka mmadụ mee ihe; ọ na-egosikwa ngwaa ikpeazụ εἰσελθεῖν nke ọma.
theological_decisions:
- issue: Ntụgharị βασιλεία τῶν οὐρανῶν
  choice: alaeze eluigwe
  alternative: alaeze nke eluigwe
  rationale: Nhọrọ a bụ okwu Igbo dị ndụ ma na-edobe okwu Matiu n’enweghị ịmepụta ọdịiche pụrụ iche n’etiti ya na ‘alaeze Chineke.’
- issue: Ihe τοὺς εἰσερχομένους pụtara
  choice: ndị na-abanye
  alternative: ndị na-agbalị ịbanye
  rationale: E debere nghọtahie ziri ezi nke participle Grik n’isiokwu ahụ, ebe nkọwa ala peeji na-egosi na ọ pụkwara ịpụta mgbalị ịbanye.
translation_notes:
  register: E ji Standard Igbo nke dị ùgwù ma dị mfe nghọta mee ihe. E debere ụda ikpe siri ike nke οὐαί, ihe atụ nke imechi ụzọ alaeze, na nkwughachi ‘ndị na-abanye … banye’ n’ihi na ha bụ akụkụ pụtara ìhè nke isi mmalite Grik.
