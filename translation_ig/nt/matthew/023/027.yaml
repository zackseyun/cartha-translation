review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the denunciatory force of οὐαί, the direct comparison, the outward/inward contrast, and the broad sense of πάσης ἀκαθαρσίας. The rendering of the scribal group should be adjusted: ‘ndị ode akwụkwọ’ ordinarily denotes writers/authors, whereas ‘ndị odeakwụkwọ’ is the established designation for scribes in this setting.'
  naturalness: The verse is clear and appropriately forceful in modern Standard Igbo. ‘Ili e ji nzu tee ọcha’ is slightly more idiomatic and explicit than ‘ili e tere nzu ọcha,’ while retaining the lime-whitewashing image.
  terminology: Retain ‘ndị Farisii,’ ‘ndị ihu abụọ,’ and ‘adịghị ọcha.’ Use ‘ndị odeakwụkwọ’ for γραμματεῖς. The broad wording ‘adịghị ọcha niile’ avoids narrowing ritual and moral dimensions of ἀκαθαρσία.
  issues:
  - severity: medium
    issue: ‘ndị ode akwụkwọ’ for γραμματεῖς
    rationale: In contemporary Igbo this normally means writers/authors. ‘Ndị odeakwụkwọ’ is the conventional and more accurate term for the scribes addressed in the passage.
  - severity: low
    issue: Wording of the whitewashed-tomb expression
    rationale: ‘Ili e ji nzu tee ọcha’ states the means and result naturally in Standard Igbo and more transparently conveys κεκονιαμένοις.
  revised_text: Ahụhụ ga-adịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ! N’ihi na unu dị ka ili e ji nzu tee ọcha[a]; n’èzí ha na-adị mma n’anya, ma n’ime ha juputara n’ọkpụkpụ ndị nwụrụ anwụ na adịghị ọcha niile[b].
