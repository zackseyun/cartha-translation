id: MAT.23.27
reference: Matthew 23:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: ig
  text: Ahụhụ ga-adịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ! N’ihi na unu dị ka ili e ji nzu tee ọcha[a]; n’èzí ha na-adị mma n’anya, ma n’ime ha juputara n’ọkpụkpụ ndị nwụrụ anwụ na adịghị ọcha niile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ili e ji nzu techaa ọcha.”
    reason: lexical_alternative
  - marker: b
    text: N’ebe a, “adịghị ọcha” nwere ike ịgụnye ma adịghị ọcha n’usoro emume okpukpe ma nrụrụ omume.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ
  choice: Ahụhụ ga-adịrị unu
  rationale: Nkebiokwu a na-egosipụta ịma ikpe na ịdọ aka ná ntị n’ike, ọ bụghị naanị mwute.
- source_word: γραμματεῖς
  choice: ndị ode akwụkwọ
  rationale: Ọ bụ aha a maara nke ọma maka òtù ndị Juu ahụ maara Akwụkwọ Nsọ na Iwu nke ọma; ọ naghị akọwafe okwu Grik ahụ.
- source_word: Φαρισαῖοι
  choice: ndị Farisii
  rationale: E depụtara aha òtù ahụ n’ụzọ a na-amakarị n’Igbo.
- source_word: ὑποκριταί
  choice: ndị ihu abụọ
  rationale: Ọ na-egosi ndị na-eme ka ha dị mma n’ihu mmadụ ma ihe dị n’ime ha dị iche.
- source_word: παρομοιάζετε
  choice: unu dị ka
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo ntụnyere ahụ.
- source_word: τάφοις κεκονιαμένοις
  choice: ili e tere nzu ọcha
  rationale: Ọ na-echekwa ihe atụ nke ili e ji nzu mee ka ọ na-acha ọcha.
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: n’èzí ... ma n’ime ha
  rationale: Ọ na-echekwa ọdịiche siri ike dị n’etiti ihe a na-ahụ anya na ihe dị n’ime.
- source_word: φαίνονται ὡραῖοι
  choice: ha na-adị mma n’anya
  rationale: Ọ na-egosi na mma ahụ bụ otú ili ndị ahụ si pụta n’anya, ọ bụghị ihe ha bụ n’eziokwu.
- source_word: γέμουσιν
  choice: ha juputara
  rationale: Ọ bụ nsụgharị Igbo nkịtị nke ịbụ ihe jupụtara n’ihe ọzọ.
- source_word: ὀστέων νεκρῶν
  choice: ọkpụkpụ ndị nwụrụ anwụ
  rationale: Ọ na-egosipụta nke ọma na ọ bụ ọkpụkpụ ndị mmadụ nwụrụ anwụ.
- source_word: πάσης ἀκαθαρσίας
  choice: ụdị adịghị ọcha niile
  rationale: Ọ na-ahapụ okwu ahụ ka ọ gbasaa ma adịghị ọcha nke emume okpukpe ma nrụrụ omume.
theological_decisions:
- issue: Ihe ἀκαθαρσία pụtara n’ihe atụ a
  choice: ụdị adịghị ọcha niile
  alternative: adịghị ọcha nke emume okpukpe naanị; ma ọ bụ nrụrụ omume naanị
  rationale: Ili na-akpalite echiche banyere adịghị ọcha n’usoro okpukpe ndị Juu, ebe nkatọ Jizọs na-emetụtakwa nrụrụ omume dị n’ime. Nsụgharị sara mbara na-echekwa akụkụ abụọ ahụ n’enweghị ịmanye naanị otu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ụda ịma ikpe nke okwu Jizọs na ntụnyere siri ike dị n’etiti ọdịdị elu na eziokwu dị n’ime.
