  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς πληρώσατε τὸ μέτρον τῶν πατέρων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/032.yaml
  text: And you[a], fill up the measure of your fathers.
translation:
  language: ig
  text: Unu kwa, mejupụtanụ ọ̀tụ̀tụ̀ nke ndị nna ochie unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “mezuonụ ọ̀tụ̀tụ̀ zuru ezu nke mmehie ndị nna ochie unu.” N’ụzọ nkịtị, Grik kwuru, “mejupụtanụ ọ̀tụ̀tụ̀ nke ndị nna unu,” na-eji ihe atụ nke ikpe ọmụma na-agbakọta ruo ókè ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: kwa
  rationale: E tinyere ya n’ọnọdụ dabara n’asụsụ Igbo iji jikọta okwu a na nkatọ bu ya ụzọ; ọ na-echekwa njikọ nke Grik.
- source_word: ὑμεῖς
  choice: unu onwe unu
  rationale: Nnochiaha ahụ pụtara ìhè na Grik ma nwee nkwusi ike; ‘unu onwe unu’ na-egosipụta nkwusi ike ahụ n’ụzọ okike n’Igbo.
- source_word: πληρώσατε
  choice: jupụtanụ
  rationale: Ọ bụ iwu aorist nye ọtụtụ mmadụ. ‘Jupụtanụ’ na-echekwa ma ụdị iwu ahụ ma ihe atụ nke ime ka ihe rute n’ọ̀tụ̀tụ̀ ya zuru ezu.
- source_word: τὸ μέτρον
  choice: ihe ọ̀tụ̀tụ̀
  rationale: Nsụgharị a na-echekwa ihe atụ Grik nke oke ma ọ bụ ọnụọgụ na-eru n’ókè ya, kama ịkọwa ya ozugbo dị ka mmehie.
- source_word: τῶν πατέρων ὑμῶν
  choice: nke ndị nna nna unu
  rationale: N’ọnọdụ a πατέρων na-ezo aka ná ndị nna ochie ha; ‘ndị nna nna unu’ bụ okwu Igbo doro anya ma na-echekwa echiche banyere usoro ndị ha si pụta.
theological_decisions:
- issue: 'Ike okwu Jizọs: iwu ka ọ bụ amụma e ji akatọ ha'
  choice: 'E debere ya dị ka iwu nwere ụda ịkatọ na ikpe: ‘jupụtanụ.’'
  alternative: ‘Unu na-emeju’ ma ọ bụ ‘unu ga-emeju’ ihe ọ̀tụ̀tụ̀ ahụ.
  rationale: πληρώσατε bụ aorist active imperative, onye nke abụọ ọtụtụ. Ya mere, nsụgharị ahụ na-echekwa ụdị iwu ya, ma ghara iwepụ esemokwu nke na-egosi na ọ bụ okwu njakịrị siri ike na ikpe megide ha.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘unu onwe unu’ gosipụta nkwusi ike nke ὑμεῖς; e chekwara ihe atụ nke ‘ihe ọ̀tụ̀tụ̀’ n’ahịrị bụ isi, ebe nkọwa banyere mmehie dị n’ala ala peeji.
