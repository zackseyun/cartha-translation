base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/006.yaml
  text: And they love the places of honor at banquets and the best seats in the synagogues[c][b][a],
translation:
  language: ig
  text: Ha na-ahụ ebe kachasị ùgwù n’oriri[a][c] na oche ndị kachasị ùgwù n’ụlọ nzukọ[b] n’anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ebe onye kacha nwee ùgwù n’ebe a na-eri nri.” N’oge ahụ, n’oriri ndị dị mkpa, ndị mmadụ na-edina n’akụkụ tebụl, a na-enyekwa onye a na-asọpụrụ ebe pụrụ iche.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “oche ndị bụ isi” ma ọ bụ “oche ndị kachasị ùgwù.” Okwu Grik ahụ na-emesi oche ndị na-egosi ọkwa ma ọ bụ ibu ụzọ ike.
    reason: lexical_alternative
  - marker: c
    text: N’oge ahụ, a na-ahazi ebe ndị mmadụ nọ n’oriri dịka ọkwa ùgwù ha si dị. Ya mere, okwu a na-egosi ọchịchọ inwe ùgwù n’ihu ọha, ọ bụghị naanị ịchọ ebe dị mma ịnọ.
    reason: cultural_note
lexical_decisions:
- source_word: φιλοῦσι
  choice: na-ahụ ... n’anya
  rationale: N’ebe a, φιλέω na-egosi na ihe ndị a na-atọ ha ụtọ nke ukwuu ma ha na-achọsi ha ike; okwu Igbo a na-edobe ike nke nkatọ ahụ n’enweghị itinye echiche ịhụnanya ọgbụgba ndụ.
- source_word: δὲ
  choice: -kwa
  rationale: δὲ bụ njikọ dị nro nke na-aga n’ihu n’ịkọ omume ha; mgbakwunye -kwa na-eme ka njikọ ahụ bụrụ nke ebumpụta ụwa n’Igbo n’enweghị ime ka ọ bụrụ nnukwu ntụnyere.
- source_word: τὴν πρωτοκλισίαν
  choice: ebe ndị a na-asọpụrụkarị
  rationale: Okwu a na-ezo aka n’ebe onye nwere ugwu kachasị na-anọdụ ma ọ bụ na-edina n’oge nri. Nsụgharị a na-eme ka ihe gbasara ugwu ọha doo onye na-agụ Igbo anya.
- source_word: ἐν τοῖς δείπνοις
  choice: na oriri
  rationale: δεῖπνον bụ nri abalị ma ọ bụ nnukwu nri e ji ele ọbịa; n’ebe a, “oriri” na-egosi nnọkọ nri ọha ebe a na-ahụ ọkwa na nsọpụrụ.
- source_word: τὰς πρωτοκαθεδρίας
  choice: oche ndị kacha elu
  rationale: Okwu Grik a pụtara oche ndị nwere ọkwa ma ọ bụ ugwu kachasị. “Ndị kacha elu” na-edobe echiche nke ibu ụzọ na ọkwa, ọ bụghị naanị nkasi obi.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: n’ụlọ nzukọ
  rationale: Nke a bụ ụzọ Igbo doro anya isi kpọọ ebe ndị Juu na-ezukọ maka ofufe na nkuzi; ọ na-edobe ọnọdụ ụlọ ọrụ nke okwu Grik ahụ.
