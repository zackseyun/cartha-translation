translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe nkatọ Jizọs banyere ọchịchọ ha maka ọkwa n’ihu ọha. E tinyere akara nkọwa ụkwụ ozugbo n’akụkụ okwu ha na-akọwa.
