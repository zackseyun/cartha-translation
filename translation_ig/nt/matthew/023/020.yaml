id: MAT.23.20
reference: Matthew 23:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: ig
  text: Ya mere, onye na-eji ebe ịchụ aja aṅụ iyi na-eji ya na ihe niile dị n’elu ya aṅụ iyi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: Ya mere, onye na-eji … aṅụ iyi
  rationale: οὖν bụ njikọ na-egosi nkwubi okwu, ya mere a sụgharịrị ya “Ya mere.” Nkebi participle nwere article na-arụ ọrụ n’ozuzu ya dịka “onye na-aṅụ iyi.” Usoro “iji … aṅụ iyi” bụ ụzọ Igbo si ekwu ihe e ji gbaa iyi.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: na-eji ebe ịchụ aja aṅụ iyi
  rationale: N’usoro iyi a, ἐν na-egosi ihe e ji ṅụọ iyi, ọ bụghị ọnọdụ dị n’ime ihe. θυσιαστήριον bụ “ebe ịchụ aja.”
- source_word: ὀμνύει
  choice: na-aṅụ iyi
  rationale: Oge ugbu a na-egosipụta ụkpụrụ zuru ụwa ọnụ, ma na-edobe nkwughachi nke ngwaa iyi dị n’asụsụ Grik.
- source_word: ἐν αὐτῷ
  choice: na-eji ya … aṅụ iyi
  rationale: αὐτῷ na-ezo aka n’ebe ịchụ aja; “iji ya aṅụ iyi” na-enye usoro iyi ahụ n’Igbo n’ụzọ doro anya.
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: na ihe niile dị n’elu ya
  rationale: Nkebi a pụtara ihe niile dị n’elu ebe ịchụ aja ahụ. A hapụrụ ya ka ọ dị obosara dịka Grik si dị, kama imechi ya naanị n’onyinye ma ọ bụ àjà.
theological_decisions:
- issue: Ihe “ihe niile dị n’elu ya” na-ezo aka na ya
  choice: E debere ya dịka ihe niile dị n’elu ebe ịchụ aja, n’akọwaghị na ha bụ naanị onyinye àjà.
  alternative: onyinye niile dị n’elu ya; ihe niile nọ n’elu ya
  rationale: Amaokwu ndị bu ụzọ na-ekwu maka onyinye dị n’elu ebe ịchụ aja, ma okwu Grik ebe a sara mbara karịa “onyinye” otu. Nsụgharị sara mbara na-echekwa usoro arụmụka ahụ n’etinyeghị nkọwa ọzọ n’ime ederede.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị mfe nghọta ma dị ugwu. E ji “ebe ịchụ aja” mee ihe maka altar, ma jiri usoro Igbo nkịtị “iji … aṅụ iyi” gosipụta oath formula.
