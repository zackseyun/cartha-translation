id: MAT.23.25
reference: Matthew 23:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: ig
  text: “Ahụhụ ga-adịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ! N’ihi na unu na-asacha akụkụ dị n’èzí nke iko na efere, ma n’ime ha jupụtara n’ịpụnara mmadụ ihe na enweghị njide onwe onye.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta okwu mbụ ahụ dị ka ‘anyaukwu’; ọ nwekwara ike ịpụta izu ohi ma ọ bụ inara mmadụ ihe n’ike. ‘Enweghị njide onwe onye’ nwekwara ike ịpụta imeju ọchịchọ onwe onye gabiga ókè.
    reason: Okwu Grik abụọ ahụ nwere ike igosi ịchịkọta ihe n’ụzọ mmegbu na ime ihe gabiga ókè n’enweghị njide onwe onye.
lexical_decisions:
- source_word: Οὐαὶ
  choice: Ahụhụ ga-adịrị unu
  rationale: Na-egosipụta nkwupụta ikpe siri ike nke okwu amụma a, kama ime ka ọ bụrụ naanị mkpu mwute.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Ọ bụ aha a maara nke ọma n’Igbo maka ndị odeakwụkwọ okpukpe ndị Juu; ọ naghị akọwa ọrụ ha karịa ihe okwu Grik kwuru.
- source_word: Φαρισαῖοι
  choice: ndị Farisii
  rationale: Ntugharị aha òtù ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: ὑποκριταί
  choice: ndị ihu abụọ
  rationale: Okwu Igbo doro anya nke na-egosi ndị na-eme ka ha bụrụ ihe ha na-abụghị n’ihe gbasara omume na okpukpe.
- source_word: καθαρίζετε
  choice: unu na-asacha
  rationale: Na-egosipụta omume dị ugbu a n’asụsụ Igbo dị mfe ma bụrụkwa nke mmadụ na-eji kwa ụbọchị.
- source_word: τὸ ἔξωθεν
  choice: elu
  rationale: N’ihe gbasara iko na efere, ‘elu’ na-egosi akụkụ dị n’èzí n’Igbo nkịtị, ma na-edobe ọdịiche ya na ‘ime.’
- source_word: ποτηρίου
  choice: iko
  rationale: Ọ bụ nnọchi okwu kpọmkwem ma doo anya.
- source_word: παροψίδος
  choice: efere
  rationale: Ọ bụ okwu sara mbara ma dị mfe nghọta maka arịa e ji eri ma ọ bụ etinye nri.
- source_word: ἔσωθεν
  choice: ime ha
  rationale: Na-edobe ihe atụ nke ime iko na efere ma na-eme ka nnọchiaha ahụ kwekọọ na arịa abụọ ahụ.
- source_word: γέμουσιν
  choice: jupụtara
  rationale: Na-egosipụta ngwaa Grik nke dị n'ụdị ọtụtụ ma na-ezo aka n’iko na efere ọnụ.
- source_word: ἁρπαγῆς
  choice: anyaukwu
  rationale: Na-ekwupụta ọchịchọ nke ịchọ ijide ihe n’ụzọ na-ezighị ezi; e debere mmetụta siri ike nke ịpụnara mmadụ ihe na nkọwa ala peeji.
- source_word: ἀκρασίας
  choice: enweghị njide onwe onye
  rationale: Na-egosipụta kpọmkwem enweghị ike ịchị ọchịchọ na omume onwe onye, na-enweghị ime ka okwu ahụ bụrụ naanị ụdị mmehie pụrụ iche.
theological_decisions:
- issue: Ihe ‘ime’ iko na efere na-anọchi anya ya
  choice: 'E debere ihe atụ ahụ n’ogo iko na efere: ‘ime ha jupụtara.’'
  alternative: ‘ma n’ime unu, unu jupụtara n’anyaukwu na enweghị njide onwe onye’
  rationale: Ụdị ọtụtụ nke ngwaa Grik na-aga n’ihu na-ezo aka n’iko na efere, ọ bụ ezie na o doro anya na Jizọs ji ha atụ ndị ndu ahụ. Nke a na-ezere ịkọwapụta ihe atụ ahụ n’ime ederede n’onwe ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ndị ihu abụọ’ mee ka ebubo ahụ sie ike, ma e debere ihe atụ nke elu na ime arịa ndị ahụ n’enweghị itinye nkọwa gbasara obi ndị ndu n’ime amaokwu ahụ.
