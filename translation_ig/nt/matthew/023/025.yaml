review_pass:
  verdict: revise
  source_fidelity: The draft preserves the denunciation, the addressed groups, the hypocrite charge, and the plural reference to the cup and dish. However, “elu” ordinarily means “top/above” and does not adequately render τὸ ἔξωθεν, “the outside.” Also, “anyaukwu” can convey greed but weakens ἁρπαγή’s prominent sense of exploitative seizure, plunder, or extortion; a stronger primary rendering is warranted, with “anyaukwu” retained as an alternative in the note.
  naturalness: The wording is generally clear Standard Igbo. Replacing “elu” with “akụkụ dị n’èzí” gives an unambiguous and natural exterior/interior contrast. “N’ime ha jupụtara…” naturally retains the vessel imagery and Greek plural syntax.
  terminology: “Ndị odeakwụkwọ,” “ndị Farisii,” “ndị ihu abụọ,” “iko,” and “efere” are suitable. “Enweghị njide onwe onye” accurately communicates ἀκρασία. “Ịpụnara mmadụ ihe” better represents ἁρπαγή in this polemical context than the less specific “anyaukwu.”
  issues:
  - severity: medium
    issue: “elu” is used for τὸ ἔξωθεν.
    rationale: “Elu” normally denotes the top or upper surface, whereas the Greek contrasts the outside/exterior of the vessels with their inside. “Akụkụ dị n’èzí” preserves the intended spatial contrast.
  - severity: medium
    issue: “anyaukwu” is the sole main-text rendering of ἁρπαγή.
    rationale: Although greed is a possible contextual sense, ἁρπαγή commonly has the sharper sense of plunder, robbery, or exploitative taking. The main text should retain this force, while a footnote can note “anyaukwu” as a contextual alternative.
  revised_text: “Ahụhụ ga-adịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ! N’ihi na unu na-asacha akụkụ dị n’èzí nke iko na efere, ma n’ime ha jupụtara n’ịpụnara mmadụ ihe na enweghị njide onwe onye.[a]”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịghọta okwu mbụ ahụ dị ka ‘anyaukwu’; ọ nwekwara ike ịpụta izu ohi ma ọ bụ inara mmadụ ihe n’ike. ‘Enweghị njide onwe onye’ nwekwara ike ịpụta imeju ọchịchọ onwe onye gabiga ókè.
    reason: Okwu Grik abụọ ahụ nwere ike igosi ịchịkọta ihe n’ụzọ mmegbu na ime ihe gabiga ókè n’enweghị njide onwe onye.
  revision_rationale: The revision corrects the exterior/interior imagery and gives ἁρπαγή its stronger lexical force without excluding its contextual sense of greed. It retains the Greek metaphor at the level of the cup and dish, avoids interpretive expansion to the leaders themselves, and preserves the footnote anchor.
