revisions:
- from: Ma unu ekwela ka a kpọọ unu “Rabbi,”[a] n’ihi na otu onye bụ Onye Ozizi unu, unu niile bụkwa ụmụnna.[b]
  to: Ma unu, ekwela ka a kpọọ unu “Rabbi,”[a] n’ihi na otu onye bụ onye nkuzi unu, unu niile bụkwa ụmụnna.[b]
  rationale: The revision preserves every substantive element of the Greek and the English audit trail while improving Standard Igbo idiom. It removes potentially interpretive capitalization, corrects the historical description of “Rabbi,” and makes the note on ἀδελφοί clear without changing the translation’s inclusive collective sense.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:14Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition (μὴ κληθῆτε), retains “Rabbi,” preserves the singular force of εἷς, and renders the concluding familial metaphor without imposing an interpretation. The wording “otu onye bụ onye nkuzi unu” closely represents εἷς γάρ ἐστιν ὑμῶν ὁ διδάσκαλος.
  naturalness: The verse is natural Standard Igbo after minor punctuation and orthographic/register adjustments. “Onye nkuzi” is more ordinary contemporary Igbo here than the capitalized “Onye Ozizi.” The existing second footnote is syntactically awkward and should be recast.
  terminology: '“Rabbi” appropriately preserves the Jewish title and setting. The first footnote should not call it a Greek title in origin: it is a Jewish/Hebrew-Aramaic title represented in the Greek text. “Ụmụnna” is an appropriate natural Igbo rendering of ἀδελφοί in this collective disciple context.'
  issues:
  - severity: low
    issue: The capitalization “Onye Ozizi” can make the expression read as a supplied formal divine title.
    rationale: The Greek has the common noun ὁ διδάσκαλος, qualified by “your”; lowercase “onye nkuzi” is natural and avoids adding titular force while retaining the referential ambiguity of the verse.
  - severity: medium
    issue: Footnote a identifies “Rabbi” as a Greek title.
    rationale: Ῥαββί occurs in the Greek text, but the title itself is Jewish, deriving from Hebrew/Aramaic usage. The note should distinguish the source title from its Greek textual representation.
  - severity: medium
    issue: Footnote b is awkwardly phrased in Igbo.
    rationale: “N’ebe ndị niile bụ ndị na-eso ụzọ ibe ha nọ” does not clearly state that the masculine plural can collectively denote fellow disciples. A direct formulation is needed.
  revised_text: Ma unu, ekwela ka a kpọọ unu “Rabbi,”[a] n’ihi na otu onye bụ onye nkuzi unu, unu niile bụkwa ụmụnna.[b]
