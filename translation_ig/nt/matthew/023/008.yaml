source:
  edition: SBLGNT
  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: ig
  text: Ma unu, ekwela ka a kpọọ unu “Rabbi,”[a] n’ihi na otu onye bụ onye nkuzi unu, unu niile bụkwa ụmụnna.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye nkuzi.” “Rabbi” bụ aha ndị Juu nke pụtara onye nkuzi. Idebe ya na-echekwa ọnọdụ ndị Juu ma ghara ime ka ọ bụrụ otu okwu na “onye nkuzi” nke na-esote.
    reason: lexical_alternative
  - marker: b
    text: “Ụmụnna” sụgharịrị ἀδελφοί, okwu Grik dị n’ụdị ọtụtụ nwoke. N’ebe a, ọ pụrụ izo aka n’ìgwè ndị na-eso ụzọ ibe ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: unu ekwela ka a kpọọ unu
  rationale: Nke a na-egosipụta iwu mgbochi dị n’ụdị passive n’asụsụ Grik n’Igbo dị ndụ ma doo anya.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Idebe aha ahụ otú e si kpọpụta ya na-echekwa ọnọdụ ndị Juu nke amaokwu ahụ, gharakwa ime ka ọ bụrụ otu okwu kpọmkwem na διδάσκαλος nke na-esote.
- source_word: εἷς
  choice: otu onye
  rationale: Nke a na-edobe echiche nke ịdị otu n’enweghị ịgbakwunye ike nkọwa nke ‘naanị otu onye’ karịa ihe e dere.
- source_word: ὁ διδάσκαλος
  choice: Onye Ozizi unu
  rationale: 'ὑμῶν na-egosi mmekọrịta: onye ahụ bụ onye na-ezi ha ihe. ‘Onye Ozizi unu’ bụ Igbo nkịtị ma na-edobe aha ọrụ ahụ.'
- source_word: πάντες δὲ ὑμεῖς
  choice: unu niile bụkwa
  rationale: Usoro a na-egosipụta na ndị niile a na-agwa okwu nwere otu ọnọdụ, n’ụzọ na-asụ ụtọ n’Igbo.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: ‘Ụmụnna’ na-echekwa ihe atụ nke ezinụlọ ma nwee ike ịgụnye ndị otu niile n’enweghị ịmanye nkọwa gbasara okike nwoke naanị n’Igbo.
theological_decisions:
- issue: Ma Jizọs ọ na-amachibido aha nsọpụrụ mmadụ niile kpamkpam, ka ọ na-ekwu banyere ịchọ ọkwa n’etiti ndị na-eso ụzọ
  choice: E debere iwu mgbochi ahụ kpọmkwem n’enweghị ịgbasa ya ka ọ bụrụ ụkpụrụ ozizi zuru ụwa ọnụ gafee ihe amaokwu ahụ kwuru.
  alternative: Ịkọwa ya dịka mmachibido kpamkpam nke iji ‘Rabbi’ ma ọ bụ aha yiri ya; ma ọ bụ ime ka ọ bụrụ naanị nkatọ nke ọchịchọ ọkwa ihu abụọ.
  rationale: Asụsụ Grik nyere iwu mgbochi na ihe kpatara ya, ma ọ kọwaghị ngwa ya niile n’oge ndị ọzọ. Ya mere, ntụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe ahụ ka ọ dị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Ma unu’ na-edobe ọdịiche nke ὑμεῖς δέ; ‘ekwela ka a kpọọ unu’ na-enye iwu mgbochi ahụ n’ụzọ Igbo nkịtị. E dere ‘Onye Ozizi’ na mkpụrụedemede ukwu dịka aha ọrụ a kapịrị ọnụ n’ahịrịokwu ahụ, n’enweghị ịkọwapụta onye ọ bụ karịa ihe amaokwu ahụ kwuru.
