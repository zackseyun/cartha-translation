  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ⸀ἥξει ⸂ταῦτα πάντα⸃ ἐπὶ τὴν γενεὰν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: ig
  text: “N’ezie, ana m asị unu, ihe ndị a niile[a] ga-adakwasị ọgbọ a[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “ihe a niile.” Okwu Grik dị n’ụdị ọtụtụ: “ihe ndị a niile.”'
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ nwekwara ike ịghọta “ọgbọ a” dị ka “ndị a” ma ọ bụ dị ka ọgbọ sara mbara nke ndị na-ekweghị ekwe; ma okwu Grik kacha doo anya bụ “ọgbọ a.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: N’ezie
  rationale: N’usoro okwu ἀμὴν λέγω ὑμῖν, okwu a bụ nkwupụta siri ike nke na-ebute okwu nwere ikike. “N’ezie” na-egosipụta nke a n’Igbo nkịtị ma dịkwa nsọpụrụ.
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Nke a na-asụgharị ngwaa dị ugbu a na nnọchiaha ọtụtụ nke ọma, ma na-edobe ụda okwu siri ike nke ahịrịokwu ahụ.
- source_word: ἥξει
  choice: ga-adakwasị
  rationale: Ọ bụ ezie na ngwaa Grik pụtara ịbịa ma ọ bụ iru, n’ebe a ọ na-ekwu maka ihe ikpe ndị ahụ ga-erute ndị a kpọrọ aha. “Ga-adakwasị” bụ ụzọ Igbo doro anya ma dị ndụ isi kwuo na ihe ndị ahụ ga-abịakwasị ha.
- source_word: ταῦτα πάντα
  choice: ihe ndị a niile
  rationale: Nnọchiaha ngosi na πᾶς bụ ọtụtụ n’asụsụ Grik. “Ihe ndị a niile” na-edobe ọtụtụ ahụ ma na-ezo aka n’ihe ikpe na ikpe ọmụma e kwuru banyere ha n’amaokwu ndị bu ụzọ.
- source_word: ἐπὶ
  choice: ga-adakwasị
  rationale: A jikọtara echiche preposition ahụ na ngwaa Igbo “dakwasị,” nke na-egosi na ihe ndị ahụ ga-erute ma bịakwasị ọgbọ ahụ. Nke a na-ezere ịgbakwunye echiche “imegide” nke okwu Grik anaghị ekwupụta kpọmkwem.
- source_word: γενεὰν ταύτην
  choice: ọgbọ a
  rationale: “Ọgbọ a” bụ ntụgharị kacha nso na nke ebumpụta ụwa maka γενεὰν ταύτην. Ọ na-ahapụ ókè ndị okwu ahụ na-ezo aka na ya ka ihe gbara ya gburugburu kọwaa ya.
theological_decisions:
- issue: Ndị okwu “ọgbọ a” (γενεὰν ταύτην) na-ezo aka na ha
  choice: A sụgharịrị ya “ọgbọ a” n’enweghị nkọwa agbakwunyere.
  alternative: Ụfọdụ nwere ike ịghọta ya dị ka “ndị a,” ọgbọ sara mbara nke ndị na-ekweghị ekwe, ndị Juu n’oge niile, ma ọ bụ oge a.
  rationale: Okwu Grik kacha doo anya bụ “ọgbọ a.” Ịhapụ ya otú ahụ na-echekwa ike oge dị n’okwu ahụ nakwa esemokwu nkọwa ya, kama itinye otu usoro nkà mmụta okpukpe n’ime ntụgharị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma nwee ugwu, dee ya. Ahịrịokwu ahụ na-edobe ụda nkwupụta siri ike nke Jizọs, na-enweghị itinye nkọwa otu ụka ma ọ bụ idozi arụmụka banyere “ọgbọ a.”
