id: MAT.23.11
reference: Matthew 23:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ μείζων ὑμῶν ἔσται ὑμῶν διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: ig
  text: Ma onye kachasị ukwuu n’etiti unu ga-abụ onye na-ejere unu ozi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ dabara nnọọ n’okwu Grik: “Onye ka ukwuu n’etiti unu ga-abụ onye na-ejere unu ozi.” Okwu Grik e ji atụnyere ihe abụọ nwere ike, n’ebe a, ịpụta onye kachasị ukwuu n’ìgwè ahụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ịchọ ọkwa dị elu nke a na-ekwu maka ya n’amaokwu ndị bu ụzọ na ụzọ Jizọs si kọwaa ịdị ukwuu.
- source_word: μείζων
  choice: onye kachasị ukwuu
  rationale: Ọ bụ ezie na okwu Grik ahụ bụ comparative, n’ebe a ọ na-arụ ọrụ n’ụzọ yiri superlative, ya bụ onye nọ n’ọkwa kachasị elu n’etiti ndị a na-agwa okwu.
- source_word: ὑμῶν (mbụ)
  choice: n’etiti unu
  rationale: 'Genitive mbụ ahụ bụ partitive: ọ na-ekwu maka onye dị ukwuu n’ime ìgwè ndị a na-agwa okwu.'
- source_word: ἔσται
  choice: ga-abụ
  rationale: Nke a na-egosipụta future nke εἰμί n’Igbo nkịtị, nke oge a.
- source_word: ὑμῶν (nke abụọ)
  choice: unu
  rationale: N’usoro ‘na-ejere unu ozi,’ ọ na-egosi ndị onye ahụ ga-ejere ozi n’ụzọ Igbo si ada nke ọma.
- source_word: διάκονος
  choice: onye na-ejere unu ozi
  rationale: N’ebe a, okwu ahụ pụtara onye na-ejere ndị ọzọ ozi, ọ bụghị aha ọkwa pụrụ iche n’ọgbakọ. Nkebiokwu a doro anya ma na-ezere itinye echiche banyere ọkwa ụka.
theological_decisions:
- issue: Asụsụ gbasara ọkwa na nkuzi Jizọs banyere ịdị ukwuu na ije ozi
  choice: 'A sụgharịrị ya dị ka ntụgharị nke echiche ọkwa: onye kachasị ukwuu ga-abụ onye na-ejere ndị ọzọ ozi.'
  alternative: Onye ka unu ukwuu ga-abụ odibo unu.
  rationale: Nke a na-echekwa esemokwu dị n’okwu ahụ—ịdị ukwuu pụtara ije ozi—n’etinyeghị nkọwa nke otu ụka ma ọ bụ mee διάκονος ka ọ bụrụ ọkwa ụka.
translation_notes:
  register: Standard Igbo; asụsụ bụ nke oge a, dị ùgwù, ma dị mfe nghọta. E ji ‘onye na-ejere unu ozi’ zere ‘dīkọn’ ma ọ bụ okwu ọzọ nwere ike ịpụta ọkwa ụka. Akara ndetu ala peeji [a] dị n’ahịrị isi.
