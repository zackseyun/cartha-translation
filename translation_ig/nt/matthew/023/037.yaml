id: MAT.23.37
reference: Matthew 23:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: ig
  text: “Jerusalem, Jerusalem, gị onye na-egbu ndị amụma, na-atụkwa ndị e zitere ya nkume—ugboro ole ka m chọrọ ịchịkọta ụmụ gị ọnụ, dịka nne ọkụkọ[b] si achịkọta ụmụ ya n’okpuru nku ya, ma unu[a] achọghị!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, “unu achọghị” bụ ọtụtụ mmadụ, ebe “ụmụ gị” na-agwa Jerusalem dịka otu onye.
    reason: grammatical_clarification
  - marker: b
    text: Okwu Grik a sụgharịrị “nne ọkụkọ” nwekwara ike ịpụta “nnụnụ” n’ozuzu; ma ihe gbasara ịchịkọta ụmụ ya n’okpuru nku ya na-egosi nne ọkụkọ n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Jerusalem, Jerusalem
  rationale: E debere nkwughachi aha obodo ahụ iji gosipụta oku siri ike na akwa arịrị.
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας
  choice: gị onye na-egbu ndị amụma
  rationale: Ụdị a na-asụ nke ọma n’Igbo ma na-echekwa ihe participle nke oge dị ugbu a na-egosi omume e ji mara Jerusalem.
- source_word: λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: na-atụkwa ndị e zitere ya nkume
  rationale: A nọgidere na-eji ‘ya’ dịka Grik si jiri nnọchiaha onye nke atọ maka obodo ahụ; ‘ịtụ ... nkume’ bụ okwu Igbo doro anya maka stoning.
- source_word: ποσάκις ἠθέλησα
  choice: ugboro ole ka m chọrọ
  rationale: Nke a na-echekwa olu akwa arịrị nke ‘how often’ na echiche nke ọchịchọ, n’etinyeghị nkọwa ozizi ọzọ.
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: ịchịkọta ụmụ gị ọnụ
  rationale: ‘Ụmụ gị’ na-echekwa ihe atụ nke obodo dịka nne nke ndị bi na ya; ‘chịkọta ... ọnụ’ na-egosi nchịkọta ha n’otu ebe.
- source_word: ὄρνις
  choice: nne ọkụkọ
  rationale: Ọ bụ ezie na okwu Grik ahụ nwere ike ịpụta nnụnụ n’ozuzu, ụmụ ya n’okpuru nku ya na-egosi nne ọkụkọ n’ọnọdụ a.
- source_word: τὰ νοσσία αὐτῆς ὑπὸ τὰς πτέρυγας
  choice: ụmụ ya n’okpuru nku ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kpọmkwem isi chekwaa ihe atụ nke ụmụ nnụnụ na nchebe n’okpuru nku.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: ma unu achọghị
  rationale: E jiri ‘chọrọ/achọghị’ mee ka otu mgbọrọgwụ echiche nke θέλω pụta ìhè, ma chekwaa ọtụtụ mmadụ dị na ngwaa Grik.
theological_decisions:
- issue: Ọchịchọ Jizọs megide enweghị ọchịchọ nke ndị Jerusalem
  choice: “m chọrọ ... ma unu achọghị”
  alternative: Ịsụgharị ya dịka mkpebi a kara aka, ma ọ bụ dịka naanị mwute mmetụta obi
  rationale: Amaokwu ahụ na-edobe esemokwu dị n’etiti ọchịchọ Jizọs na ajụjụ ndị a na-agwa; nsụgharị ahụ anaghị edozi esemokwu ozizi a karịa ihe ederede kwuru.
- issue: Ndị bụ “ụmụ gị”
  choice: Chekwaa “ụmụ gị”
  alternative: “ndị gị” ma ọ bụ “ndị bi n’ime gị”
  rationale: Nke a na-echekwa Jerusalem dịka obodo e mere ka ọ bụrụ onye na ihe atụ nke ụmụ ya, n’akọwaghị otu ndị ahụ n’ụzọ dị warara.
- issue: Mgbanwe site na Jerusalem dịka otu onye gaa n’ọtụtụ mmadụ
  choice: “ụmụ gị ... ma unu achọghị”
  alternative: “ma ị chọghị”
  rationale: Grik ji nnọchiaha otu onye na ‘ụmụ gị,’ ma ngwaa ikpeazụ bụ ọtụtụ mmadụ. A chekwara mgbanwe ahụ n’ihi na ọ na-atụgharị uche site n’obodo e mere ka ọ bụrụ onye gaa n’ebe ndị ya nọ.
translation_notes:
  register: Igbo ọkọlọtọ dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi, akwa arịrị, ihe atụ nne ọkụkọ, nnọchiaha onye nke atọ ‘ya,’ na mgbanwe sitere n’otu onye gaa n’ọtụtụ mmadụ.
