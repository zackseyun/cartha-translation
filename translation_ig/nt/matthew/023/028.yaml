revisions:
- from: N'otu aka ahụ, unu onwe unu na-apụtakwa n'ihu ndị mmadụ dị ka ndị ezi omume, ma n'ime unu, unu jupụtara n'ịgha ihu abụọ na imebi iwu.
  to: N'otu aka ahụ, unu kwa, n'èzí, na-adị ndị mmadụ ka ndị ezi omume; ma n'ime unu, unu jupụtara n'ịgha ihu abụọ na mmebi iwu.
  rationale: 'The revision distinguishes the two source components previously combined in “n''ihu ndị mmadụ”: “n''èzí” renders ἔξωθεν, while “ndị mmadụ” renders τοῖς ἀνθρώποις. It preserves φαίνεσθε as an appearance (“na-adị ... ka”), preserves the contrast with “n''ime unu,” and uses a natural noun phrase for ἀνομία.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the apparent-righteousness contrast and the inner fullness of hypocrisy and lawlessness. However, it merges ἔξωθεν (“outwardly/on the outside”) with τοῖς ἀνθρώποις (“to/in the sight of people”) in “n'ihu ndị mmadụ,” leaving the explicit external-versus-internal contrast underrepresented.
  naturalness: 'The proposed revision uses clear Standard Igbo and maintains the balanced external/internal antithesis: “n''èzí ... ma n''ime unu.” “Na-adị ndị mmadụ ka” naturally expresses appearing to people as something one is not necessarily in reality.'
  terminology: “Ndị ezi omume” appropriately renders δίκαιοι in this context. “Ịgha ihu abụọ” is an established, natural rendering of ὑποκρίσεως. “Mmebi iwu” is preferable to the infinitive “imebi iwu” after “jupụtara na,” while retaining the law-related force of ἀνομίας without adding a doctrinal specification.
  issues:
  - severity: medium
    issue: The explicit sense of ἔξωθεν is not separately translated.
    rationale: “N'ihu ndị mmadụ” accurately represents τοῖς ἀνθρώποις, but it does not itself express “outwardly.” The Greek deliberately contrasts ἔξωθεν with ἔσωθεν, so both elements should be explicit.
  - severity: low
    issue: “Imebi iwu” is less idiomatic as the noun complement of “jupụtara na.”
    rationale: “Mmebi iwu” supplies a parallel nominal expression with “ịgha ihu abụọ” and retains the meaning of lawlessness/law-breaking.
  revised_text: N'otu aka ahụ, unu kwa, n'èzí, na-adị ndị mmadụ ka ndị ezi omume; ma n'ime unu, unu jupụtara n'ịgha ihu abụọ na mmebi iwu.
  revised_footnotes: []
  revision_rationale: 'The revision distinguishes the two source components previously combined in “n''ihu ndị mmadụ”: “n''èzí” renders ἔξωθεν, while “ndị mmadụ” renders τοῖς ἀνθρώποις. It preserves φαίνεσθε as an appearance (“na-adị ... ka”), preserves the contrast with “n''ime unu,” and uses a natural noun phrase for ἀνομία.'
