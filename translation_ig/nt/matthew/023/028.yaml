id: MAT.23.28
reference: Matthew 23:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: ig
  text: N'otu aka ahụ, unu kwa, n'èzí, na-adị ndị mmadụ ka ndị ezi omume; ma n'ime unu, unu jupụtara n'ịgha ihu abụọ na mmebi iwu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: N'otu aka ahụ
  rationale: Na-ejikọta amaokwu a na ntụnyere ili ndị e tere ọcha dị n'amaokwu bu ya ụzọ, ma na-egosipụta ‘otu a kwa’ n'Igbo nkịtị.
- source_word: ἔξωθεν ... ἔσωθεν
  choice: n'ihu ndị mmadụ ... n'ime unu
  rationale: Na-echekwa ọdịiche dị n'etiti ihe ndị mmadụ na-ahụ n'èzí na ezi ọnọdụ dị n'ime, n'ụzọ doro anya ma bụrụkwa nke Igbo na-asụ ugbu a.
- source_word: φαίνεσθε
  choice: na-apụta ... dị ka
  rationale: Na-egosi otú ndị mmadụ si ahụ ha, n'ekwughị na ha bụ ndị ezi omume n'ezie.
- source_word: τοῖς ἀνθρώποις
  choice: n'ihu ndị mmadụ
  rationale: Dative a na-egosi ọnọdụ ha n'anya ndị mmadụ; ‘ndị mmadụ’ bụ okwu gụnyere mmadụ niile, ọ bụghị naanị ụmụ nwoke.
- source_word: δίκαιοι
  choice: ndị ezi omume
  rationale: Na-echekwa echiche omume na okpukpe dị n'okwu Grik, ebe syntax na-egosi na ọ bụ naanị otú ha si apụta.
- source_word: μεστοὶ
  choice: jupụtara
  rationale: Ọ bụ ụzọ Igbo doro anya na nke siri ike isi kwuo na ihe ndị a juputara n'ime ha.
- source_word: ὑποκρίσεως
  choice: ịgha ihu abụọ
  rationale: Okwu Igbo a na-egosi aghụghọ nke ime onwe onye ka ọ dị mma n'èzí ebe ezi ọnọdụ ya dị iche.
- source_word: ἀνομίας
  choice: imebi iwu
  rationale: Na-echekwa njikọ ἀνομία nwere na ileghara iwu anya ma ọ bụ imegide ya, kama ime ka ọ bụrụ naanị ajọ omume n'ozuzu.
theological_decisions:
- issue: Ma δίκαιοι ọ na-ekwu na ha bụ ndị ezi omume n'ezie, ka ọ bụ naanị otú ha si yie n'anya mmadụ
  choice: Ha na-apụta n'ihu ndị mmadụ dị ka ndị ezi omume
  alternative: Ha bụ ndị ezi omume n'ihu ndị mmadụ
  rationale: φαίνεσθε na ọdịiche dị n'etiti mpụta na ime na-egosi na Jizọs na-ekwu banyere ọdịdị ha n'anya mmadụ, ọ bụghị ezi ọnọdụ ime mmụọ ha.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E ji ‘unu onwe unu’ mesie καὶ ὑμεῖς ike; a zere okwu ụka pụrụ iche ma chekwaa ụda ịba mba nke amaokwu ahụ.
