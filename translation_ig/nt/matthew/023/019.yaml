id: MAT.23.19
reference: Matthew 23:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: ig
  text: 'Ndị kpuru ìsì! N’ihi na, olee nke ka ukwuu: onyinye ahụ[a], ka ọ bụ ebe ịchụ àjà nke na-edo onyinye ahụ nsọ[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe e nyere n’àjà.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “nke na-eme ka onyinye ahụ dị nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοί
  choice: Ndị kpuru ìsì
  rationale: Ọ bụ adjective plural e ji mee aha ma kpọọ ndị a okwu ozugbo. Nhọrọ a bụ okwu Igbo doro anya ma bụrụ mbaara siri ike, n’etinyeghị ‘ndị nzuzu’ nke na-adịghị n’amaokwu a.
- source_word: τί γὰρ μεῖζον
  choice: N’ihi na, olee nke ka ukwuu
  rationale: ‘Olee nke ka ukwuu’ na-echekwa ajụjụ ntụnyere nke τί ... μεῖζον, ebe ‘N’ihi na’ na-egosipụta ọrụ nkọwa nke γάρ.
- source_word: τὸ δῶρον
  choice: onyinye ahụ
  rationale: ‘Onyinye’ bụ ntụgharị kpọmkwem nke δῶρον; n’ọnọdụ ụlọ nsọ, ọ pụkwara ịpụta ihe e nyere n’àjà.
- source_word: θυσιαστήριον
  choice: ebe ịchụ àjà
  rationale: Nke a bụ okwu Igbo doro anya maka ebe a na-achụ àjà, ma na-echekwa ọnọdụ ofufe nke okwu Grik ahụ.
- source_word: τὸ ἁγιάζον
  choice: nke na-edo ... nsọ
  rationale: Nkebi okwu a na-egosipụta omume na-aga n’ihu nke participle ahụ ma na-echekwa echiche ofufe nke ime ka onyinye bụrụ ihe dị nsọ.
theological_decisions:
- issue: Asụsụ ofufe nke ἁγιάζω gbasara ebe ịchụ àjà na onyinye
  choice: ebe ịchụ àjà nke na-edo onyinye ahụ nsọ
  alternative: ebe ịchụ àjà nke na-eme ka onyinye ahụ dị nsọ
  rationale: Nhọrọ bụ isi na-echekwa ịdị arọ nke okwu gbasara ịdị nsọ na echiche na ebe ịchụ àjà na-enye onyinye ahụ ọnọdụ dị nsọ, n’agbanyeghị na ụzọ ọzọ na-akọwa ya n’Igbo nkịtị karịa.
translation_notes:
  register: E ji asụsụ Igbo Izugbe nke oge a, nke dị ùgwù ma doo anya, dee ya. Mbaara ‘Ndị kpuru ìsì!’ ka bụ nke siri ike dịka Grik si dị, ma e tinyeghị okwu mkparị ọzọ. E debere okwu ụlọ nsọ na ịdị nsọ n’ụzọ ndị nkịtị ga-aghọta.
