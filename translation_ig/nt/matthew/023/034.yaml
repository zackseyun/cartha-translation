id: MAT.23.34
reference: Matthew 23:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: ig
  text: N’ihi ya, lee, m na-ezitere unu ndị amụma, ndị maara ihe, na ndị odeakwụkwọ. Unu ga-egbu ụfọdụ n’ime ha ma kpọgide ha n’obe; unu ga-apịa ụfọdụ n’ime ha ụtarị n’ụlọ nzukọ unu, na-achụgharịkwa ha site n’otu obodo ruo n’obodo ọzọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi ya
  rationale: Na-egosipụta njikọ nkwubi okwu ma ọ bụ ihe si n’okwu ndị bu ụzọ pụta.
- source_word: ἰδοὺ
  choice: leenụ
  rationale: Ọ bụ oku ka ndị a na-agwa ṅaa ntị; ụdị ọtụtụ dabara na ὑμᾶς.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Na-edobe aha otu ndị maara Akwụkwọ Nsọ ma na-ede ma na-akụzi ya, n’enweghị ịgbakwunye nkọwa okpukpe pụrụ iche.
- source_word: σταυρώσετε
  choice: kpọgide ha n’obe
  rationale: Na-ekwupụta kpọmkwem ụdị igbu mmadụ e ji obe eme.
- source_word: μαστιγώσετε
  choice: apịa ... ihe
  rationale: Okwu Igbo a na-aghọta nke ọma maka iti mmadụ ihe dị ka ntaramahụhụ.
- source_word: συναγωγαῖς
  choice: ụlọ nzukọ
  rationale: Okwu Igbo a na-ejikarị akọwa ebe ndị Juu na-ezukọ maka ofufe na nkuzi.
- source_word: διώξετε ἀπὸ πόλεως εἰς πόλιν
  choice: na-achụgharịkwa ha site n’otu obodo ruo n’obodo ọzọ
  rationale: Na-egosi mkpagbu na-aga n’ihu n’ebe dị iche iche, ọ bụghị nanị ịchụ mmadụ n’otu ebe.
theological_decisions:
- issue: Onye na-eziga ndị amụma, ndị maara ihe, na ndị odeakwụkwọ
  choice: ana m ezitere unu
  alternative: A ga-ezitere unu
  rationale: E debere nnọchiaha ἐγώ na ngwaa onye mbụ ἀποστέλλω, nke mere ka Jizọs bụrụ onye na-ekwu na ya na-eziga ha.
- issue: Nkesa omume megide ndị e zitere
  choice: ụfọdụ n’ime ha ... ụfọdụ n’ime ha
  alternative: site n’ime ha ... site n’ime ha
  rationale: Nke a na-enye echiche ἐξ αὐτῶν n’Igbo nkịtị n’ebughị ụzọ kpebie ma otu onye ọ bụla ga-enweta naanị otu ụdị mkpagbu.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma doo anya. E ji “leenụ” chekwaa ike nke ἰδοὺ, ma jiri usoro ahịrịokwu nkịtị mee ka amaokwu ahụ dị mfe nghọta.
