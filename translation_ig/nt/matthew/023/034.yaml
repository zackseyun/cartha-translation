revisions:
- from: N’ihi ya, leenụ, ana m ezitere unu ndị amụma, ndị maara ihe, na ndị odeakwụkwọ. Unu ga-egbu ụfọdụ n’ime ha ma kpọgide ha n’obe; unu ga-apịa ụfọdụ n’ime ha ihe n’ụlọ nzukọ unu, na-achụgharịkwa ha site n’otu obodo ruo n’obodo ọzọ.
  to: N’ihi ya, lee, m na-ezitere unu ndị amụma, ndị maara ihe, na ndị odeakwụkwọ. Unu ga-egbu ụfọdụ n’ime ha ma kpọgide ha n’obe; unu ga-apịa ụfọdụ n’ime ha ụtarị n’ụlọ nzukọ unu, na-achụgharịkwa ha site n’otu obodo ruo n’obodo ọzọ.
  rationale: The revision makes flogging explicit and uses a more natural Standard Igbo present-progressive construction. It otherwise retains the draft’s faithful structure and leaves the source’s distributive “some of them” wording unexpanded.
