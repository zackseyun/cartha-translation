review_pass:
  verdict: revise
  source_fidelity: The draft preserves the speaker’s emphatic first person, the three groups sent, the two paired sets of hostile actions, and the movement from city to city. However, μαστιγώσετε specifically denotes flogging/whipping and should be made explicit rather than rendered only with the broad expression “apụa ... ihe.”
  naturalness: Most of the verse is clear Standard Igbo. “M na-ezitere unu” is a more natural present-progressive form than “ana m ezitere unu,” and “pịa ... ụtarị” is idiomatic and precise for judicial flogging.
  terminology: “Ndị amụma,” “ndị maara ihe,” “ndị odeakwụkwọ,” “kpọgide ... n’obe,” and “ụlọ nzukọ” are appropriate. “Ụtarị” supplies the needed specificity for flogging without introducing an interpretation.
  issues:
  - severity: medium
    issue: The rendering of μαστιγώσετε is too nonspecific.
    rationale: “Apịa ụfọdụ n’ime ha ihe” can mean simply beat some of them. The Greek refers specifically to flogging/whipping; “pịa ụfọdụ n’ime ha ụtarị” retains that meaning.
  - severity: low
    issue: Present-progressive wording is somewhat less natural.
    rationale: “M na-ezitere unu” is the ordinary clear Standard Igbo form for “I am sending you,” while retaining the Greek present tense.
  revised_text: N’ihi ya, lee, m na-ezitere unu ndị amụma, ndị maara ihe, na ndị odeakwụkwọ. Unu ga-egbu ụfọdụ n’ime ha ma kpọgide ha n’obe; unu ga-apịa ụfọdụ n’ime ha ụtarị n’ụlọ nzukọ unu, na-achụgharịkwa ha site n’otu obodo ruo n’obodo ọzọ.
  revised_footnotes: []
  revision_rationale: The revision makes flogging explicit and uses a more natural Standard Igbo present-progressive construction. It otherwise retains the draft’s faithful structure and leaves the source’s distributive “some of them” wording unexpanded.
