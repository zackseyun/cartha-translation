reference: Matthew 23:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: ig
  text: Unu akpọkwala onye ọ bụla n’ụwa nna unu, n’ihi na otu onye bụ Nna unu, Onye nke eluigwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu akpọla onye ọ bụla n’ụwa nna unu”; ma ọ bụ, “Nna unu, onye nọ n’eluigwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα
  choice: nna
  rationale: Ọ bụ ihe e ji akpọ ma ọ bụ aha nsọpụrụ n’ahịrịokwu a; ‘nna’ na-edobe njikọ ya na ‘Nna unu’ dị na nkebi nke abụọ, n’ebughị ụzọ kpebie ma iwu a ọ metụtara nna mụrụ mmadụ.
- source_word: μὴ καλέσητε
  choice: Unu akpọkwala
  rationale: Ụdị a bụ iwu mgbochi doro anya ma bụrụkwa ụzọ Igbo nke oge a si ekwu ya n'ụzọ ebumpụta ụwa.
- source_word: ὑμῶν
  choice: unu
  rationale: 'A sụgharịrị genitive a dị ka okwu nwe ihe n’Igbo: ‘nna unu’ na ‘Nna unu.’'
- source_word: ἐπὶ τῆς γῆς
  choice: n’ụwa
  rationale: Nke a bụ okwu Igbo dị mfe ma kwekọọ na mpaghara ụwa nke a na-atụnyere nke eluigwe.
- source_word: εἷς
  choice: otu onye
  rationale: Ọ na-edobe okwu Grik ahụ bụ́ ‘otu’ n’etinyeghị ‘naanị’ na isi ederede, ọ bụ ezie na ihe e kwuru na-egosi ịdị naanị otu.
- source_word: ὁ πατήρ
  choice: Nna unu
  rationale: Nke a na-egosipụta mmekọrịta onwe onye dị na ὑμῶν ma na-edobe njikọ okwu ‘nna’ n’akụkụ abụọ ahụ.
- source_word: ὁ οὐράνιος
  choice: Onye Eluigwe
  rationale: Aha a na-edobe adjective ahụ dị ka okwu na-anọchi aha mmadụ—‘Onye Eluigwe’—kama ịgbasa ya ozugbo ka ọ bụrụ ‘onye nọ n’eluigwe.’
- source_word: understood human object of καλέσητε
  choice: onye ọ bụla
  rationale: Ọ dịghị okwu Grik pụrụ iche pụtara ‘nwoke’ n’ebe a; ‘onye ọ bụla’ na-egosipụta onye mmadụ ọ bụla nke ọma ma bụrụ Igbo nkịtị.
theological_decisions:
- issue: Ókè iwu Jizọs nyere
  choice: E debere ya dị ka iwu mgbochi siri ike banyere ịkpọ onye ọ bụla n’ụwa ‘nna,’ n’enyeghị nkọwa ga-eme ka ọ bụrụ naanị aha nsọpụrụ ime mmụọ ma ọ bụ ka ọ bụrụ mmachibido ojiji niile nke ‘nna.’
  alternative: Ịsụgharị ya ka ọ bụrụ mmachibido zuru oke megide ịkpọ mmadụ ọ bụla ‘nna,’ ma ọ bụ ime ka iwu ahụ dị nro site n’ịkọwa ya dị ka naanị okwu ikwubiga ihe ókè.
  rationale: Okwu Grik ahụ siri ike, ma nsụgharị ekwesịghị ikpebi n’ime ederede otú iwu ahụ si metụta nna mụrụ mmadụ, mmekọrịta ọha mmadụ, ma ọ bụ aha ndị ndu okpukpe. Nke a na-ahapụ esemokwu nkà mmụta okpukpe ahụ ka gburugburu amaokwu kpebie ya.
- issue: Nkọwa nke ὁ οὐράνιος
  choice: Onye Eluigwe
  alternative: Nna nke eluigwe; onye nọ n’eluigwe
  rationale: Nke a na-agbalị idebe adjective ahụ e ji mee aha n’asụsụ Grik, ma ihe ndị ọzọ nwere ike ịkọwa ya dị ka ‘Nna nke eluigwe’ ma ọ bụ ‘onye nọ n’eluigwe.’
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Unu akpọkwala’ bụ iwu mgbochi ebumpụta ụwa; ‘Onye Eluigwe’ na-enye ụda dị elu n’ebughị nkọwa adjective Grik ahụ gaa naanị n’otu ụzọ.
