revisions:
- from: Unu akpọkwala onye ọ bụla n’ụwa nna unu[a], n’ihi na otu onye bụ Nna unu, ya bụ Onye Eluigwe.[b]
  to: Unu akpọkwala onye ọ bụla n’ụwa nna unu, n’ihi na otu onye bụ Nna unu, Onye nke eluigwe.[a]
  rationale: The revision replaces the unclear “Onye Eluigwe” with the grammatically transparent “Onye nke eluigwe,” preserving the Greek’s designation of the Father as the heavenly one. The footnote is also recast to offer close, non-interpretive alternatives rather than glossing the command as a rule about title usage.
  reviewer_model: gpt-5.6-terra
