review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the prohibition, the earthly/heavenly contrast, the possessive “your,” and the singular “one.” However, “Onye Eluigwe” is not a sufficiently natural or precise Standard Igbo rendering of ὁ οὐράνιος in this apposition. It risks functioning as an unexplained divine title rather than identifying the Father as the heavenly one.
  naturalness: “Unu akpọkwala onye ọ bụla n’ụwa nna unu” is understandable and suitably direct. The second clause becomes more idiomatic and clear when the final apposition is expressed as “Onye nke eluigwe.”
  terminology: Retain “nna” / “Nna” to preserve the deliberate parallel and theological force without deciding whether the saying excludes ordinary biological usage. “Onye nke eluigwe” communicates the substantival heavenly descriptor without turning it into an interpretive explanation.
  issues:
  - severity: medium
    issue: “Onye Eluigwe” is an unclear rendering of ὁ οὐράνιος.
    rationale: In Standard Igbo, the unlinked expression can sound like a fixed title or an unusual designation rather than “the heavenly one.” “Onye nke eluigwe” supplies the needed grammatical relationship and is more transparent while retaining the Greek’s adjectival/appositional force.
  - severity: low
    issue: Footnote a introduces an interpretive expression about using the title “nna.”
    rationale: “Ejikwala aha ‘nna’ kpọ” is plausible, but it explains the honorific-title sense more explicitly than the source. A lexical alternative should remain closer to the direct prohibition.
  revised_text: Unu akpọkwala onye ọ bụla n’ụwa nna unu, n’ihi na otu onye bụ Nna unu, Onye nke eluigwe.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu akpọla onye ọ bụla n’ụwa nna unu”; ma ọ bụ, “Nna unu, onye nọ n’eluigwe.”
    reason: lexical_alternative
  revision_rationale: The revision replaces the unclear “Onye Eluigwe” with the grammatically transparent “Onye nke eluigwe,” preserving the Greek’s designation of the Father as the heavenly one. The footnote is also recast to offer close, non-interpretive alternatives rather than glossing the command as a rule about title usage.
