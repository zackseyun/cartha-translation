id: MAT.23.17
reference: Matthew 23:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: ig
  text: 'Ndị nzuzu na ndị ìsì, n’ihi na olee nke ka ukwuu: ọlaedo ahụ, ka ọ bụ ụlọ nsọ ahụ[b] nke mere ka ọlaedo ahụ dị nsọ[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘nke mere ọlaedo ahụ nsọ.’
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ ναός; ọ pụrụ ịpụta kpọmkwem ebe nsọ dị n’ime ụlọ nsọ.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: Ndị nzuzu
  rationale: Ọ bụ okwu ịkpọ ndị a ihu na ihu n’ụdị ọtụtụ; ‘ndị nzuzu’ na-edobe ịba mba ahụ n’asụsụ Igbo doro anya ma dịkwa ugwu.
- source_word: τυφλοί
  choice: ndị ìsì
  rationale: Ọ na-esokwa μωροὶ dị ka okwu ịkpọ mmadụ ihu na ihu n’ụdị ọtụtụ; nsụgharị a na-edobe ihe atụ nke enweghị nghọta.
- source_word: τίς γὰρ μείζων ἐστίν
  choice: N’ihi na, olee nke ka ukwuu
  rationale: ‘Olee nke’ na-ajụ nhọrọ n’etiti ihe abụọ a kpọrọ aha, ebe ‘n’ihi na’ na-edobe ọrụ nkọwa nke γάρ.
- source_word: ὁ χρυσὸς
  choice: ọlaedo ahụ
  rationale: ‘Ahụ’ na-egosi ọlaedo a kapịrị ọnụ a na-ekwu maka ya n’okwu iyi ahụ.
- source_word: ὁ ναὸς
  choice: ụlọnsọ ukwu
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ụlọ nsọ dị na Jerusalem; ihe odide ala peeji na-akọwa na ναός nwere ike ịpụta kpọmkwem ebe nsọ dị n’ime ya.
- source_word: ὁ ἁγιάσας
  choice: nke mere ka ... dị nsọ
  rationale: Ọ na-edobe ụda okpukpe nke ἁγιάζω, nakwa ọdịdị aorist participle, n’Igbo nkịtị ma doo anya.
- source_word: τὸν χρυσόν
  choice: ọlaedo ahụ
  rationale: Ikwughachi okwu ahụ na-edobe nhazi na ike ajụjụ nke Grik kama iji nnọchiaha dochie ya.
theological_decisions:
- issue: Nsụgharị ἁγιάζω n’ihe gbasara ụlọnsọ ukwu
  choice: mere ka ọlaedo ahụ dị nsọ
  alternative: doro ọlaedo ahụ nsọ
  rationale: ‘Mere ka ... dị nsọ’ na-egosi na ụlọnsọ ukwu nyere ọlaedo ahụ ọnọdụ ịdị nsọ, na-enweghị ịgbakwunye nkọwa ụka pụrụ iche; ụzọ ọzọ dị mkpụmkpụ ma nwee ike ịdị obere nghọta nye ụfọdụ ndị na-agụ akwụkwọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. E debere ịba mba siri ike nke okwu mbụ, ajụjụ ntụnyere ahụ, na echiche banyere ịdị nsọ n’enweghị ịkọwa esemokwu ahụ karịa ihe Grik kwuru.
