  revision_rationale: Replaced “ụlọ nsọ ukwu” with “ụlọ nsọ” to avoid adding the unexpressed idea “great/large,” while retaining a footnote that identifies ναός more specifically as the sanctuary proper. Also adjusted punctuation for natural Standard Igbo. The aorist participle’s completed/consecrating sense remains adequately represented by “mere ka ... dị nsọ.”
