id: MAT.23.26
reference: Matthew 23:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: ig
  text: Onye Farisii kpuru ìsì, buru ụzọ sachaa ime iko na efere[a], ka èzí ya wee dịkwa ọcha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ọkwá,” “nnukwu efere,” ma ọ bụ “efere e ji enye nri”; παροψίς bụ arịa e ji etinye ma ọ bụ enye nri.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: Onye Farisii kpuru ìsì
  rationale: E debere okwu a kpọrọ onye ahụ kpọmkwem na ihe atụ nke ikpu ìsì n’ụzọ siri ike ma bụrụkwa Igbo nkịtị.
- source_word: καθάρισον πρῶτον
  choice: buru ụzọ sachaa
  rationale: “Buru ụzọ” na-egosi ihe a ga-ebute ụzọ; “sachaa” dabara n’iwu ime ihe ozugbo nakwa n’ihe atụ gbasara arịa.
- source_word: τὸ ἐντὸς τοῦ ποτηρίου
  choice: ime iko
  rationale: Nke a na-egosi akụkụ dị n’ime iko n'ụzọ dị nkenke ma doo anya.
- source_word: καὶ τῆς παροψίδος
  choice: na efere[a]
  rationale: “Efere” bụ okwu Igbo sara mbara maka arịa e ji etinye ma ọ bụ enye nri; ihe odide ala peeji na-edebe ụdị arịa ndị ọzọ okwu Grik ahụ nwere ike ịpụta.
- source_word: ἵνα γένηται καὶ τὸ ἐκτὸς αὐτοῦ καθαρόν
  choice: ka èzí ya wee dịkwa ọcha
  rationale: E debere njikọ nsonaazụ ahụ, tinyere “dịkwa” maka καί, ma jiri nnọchiaha otu ọnụ kwekọọ na αὐτοῦ.
theological_decisions:
- issue: Ihe atụ arịa a na-asacha na nkọwa omume ime mmụọ
  choice: Idobe okwu banyere ịsacha ime na èzí iko na efere dịka ihe atụ ahụ siri dị
  alternative: Ịkọwa ya ozugbo dịka ime ka ndụ ime mmadụ na omume ya dị ọcha
  rationale: Ihe odide Grik hapụrụ ihe ọ pụtara n’ụdị ihe atụ. Ịkọwa ndụ ime mmadụ kpọmkwem n’ahịrị bụ isi ga-agbakwụnye nkọwa na-adịghị n’okwu ahụ ma belata ike okwu Jizọs.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ùgwù. A họọrọ okwu ndị mmadụ na-aghọta ngwa ngwa, ma debe ike ịba mba dị n’okwu a na ihe atụ nke ime na èzí arịa.
