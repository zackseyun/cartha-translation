revisions:
- from: Ahụhụ ga-adịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ! N’ihi na unu na-agafe oke osimiri na ala iji mee ka otu onye bata n’okwukwe unu[a]; mgbe ọ batakwara, unu na-eme ya nwa Gịhena[b] okpukpu abụọ karịa unu onwe unu.
  to: Ahụhụ ga-adịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ! N’ihi na unu na-agafe oke osimiri na ala iji mee ka otu onye ghọọ onye ntụgharị[a]; mgbe o mechara ghọọ onye ntụgharị, unu na-eme ya nwa Gịhena[b] nke ka unu okpukpu abụọ.
  rationale: The revision removes the unstated “n’okwukwe unu,” makes the temporal clause explicitly refer back to the person’s becoming a convert, and retains the Greek-derived term “Gịhena” with the documented alternative in a footnote. It preserves the verse’s denunciatory register and singular reference without imposing a doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the principal elements of the Greek: the woe pronouncement, the addressed groups, extensive travel, the singular proselyte/convert, Gehenna, and the comparative force. However, “bata n’okwukwe unu” adds “your faith,” which is not stated in the Greek and is more specific than the wording requires. A direct rendering of becoming a convert/proselyte better preserves the source’s economy.'
  naturalness: The register is generally natural Standard Igbo. “Mgbe o mechara ghọọ onye ntụgharị” is clearer and more idiomatic in this context than “mgbe ọ batakwara,” since it directly resumes the stated purpose. The comparative is recast for clear Igbo syntax.
  terminology: “Ndị odeakwụkwọ,” “ndị Farisii,” “ndị ihu abụọ,” and “Gịhena” are suitable. Retaining “Gịhena” appropriately follows the Greek rather than prematurely equating it with “hel.” The alternative “proselait” is retained in a concise footnote without importing a fuller historical explanation into the note.
  issues:
  - severity: medium
    issue: The phrase “n’okwukwe unu” is added to the rendering of προσήλυτον.
    rationale: Although proselytes are historically associated with conversion to Judaism, the Greek here says only “one proselyte/convert.” The added possessive construction narrows and explicates the source beyond what the verse expressly says.
  - severity: low
    issue: The first footnote gives an expanded definition of “proselait.”
    rationale: The English audit trail supplies only the lexical alternative “proselyte.” The added explanation about entering the Jews’ faith is historically plausible but unnecessary and more interpretive than the source wording.
  revised_text: Ahụhụ ga-adịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ! N’ihi na unu na-agafe oke osimiri na ala iji mee ka otu onye ghọọ onye ntụgharị[a]; mgbe o mechara ghọọ onye ntụgharị, unu na-eme ya nwa Gịhena[b] nke ka unu okpukpu abụọ.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “proselait.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nwa hel.” N’asụsụ Grik, “nwa Gịhena.”
    reason: alternative_reading
  revision_rationale: The revision removes the unstated “n’okwukwe unu,” makes the temporal clause explicitly refer back to the person’s becoming a convert, and retains the Greek-derived term “Gịhena” with the documented alternative in a footnote. It preserves the verse’s denunciatory register and singular reference without imposing a doctrinal interpretation.
