id: MAT.23.15
reference: Matthew 23:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: ig
  text: Ahụhụ ga-adịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ! N’ihi na unu na-agafe oke osimiri na ala iji mee ka otu onye ghọọ onye ntụgharị[a]; mgbe o mechara ghọọ onye ntụgharị, unu na-eme ya nwa Gịhena[b] nke ka unu okpukpu abụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “proselait.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nwa hel.” N’asụsụ Grik, “nwa Gịhena.”
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: Ahụhụ ga-adịrị unu
  rationale: Na-egosipụta nkwupụta amụma nke ikpe na-abịanụ, ọ bụghị naanị akwa arịrị ma ọ bụ mwute.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Okwu Igbo a maara nke ọma maka òtù ndị ọkachamara n’Iwu ahụ; ọ naghị akọwa ọrụ ha karịa ihe okwu Grik kwuru.
- source_word: Φαρισαῖοι
  choice: ndị Farisii
  rationale: Ntugharị aha òtù ndị Juu ahụ n’ụdị a na-ejikarị eme ihe n’Igbo.
- source_word: ὑποκριταί
  choice: ndị ihu abụọ
  rationale: Ọ bụ okwu Igbo doro anya ma kwekọọ n’omume ime ka mmadụ bụrụ ihe ọ na-abụghị n’ihe gbasara omume na okpukpe.
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν
  choice: unu na-agafe oke osimiri na ala
  rationale: Na-egosipụta njem sara mbara na nnukwu mbọ ahụ n’Igbo dị mfe, ma na-edebe ihe oyiyi nke osimiri na ala.
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: iji mee ka otu onye bata n’okwukwe unu
  rationale: Na-enye nghọta nkịtị nke ime otu onye onye ntụgharị n’okwukwe, ma ‘n’okwukwe unu’ na-eme ka ihe e zoro n’okwu ahụ doo anya n’Igbo; okwu teknịkal dị na nkọwa ala peeji.
- source_word: ὅταν γένηται
  choice: mgbe ọ batakwara
  rationale: Na-ejikọta ya n'ụzọ ebumpụta ụwa na nkebi gara aga ma na-edebe ntụaka onye otu nwoke nke Grik.
- source_word: υἱὸν γεέννης
  choice: nwa Gịhena
  rationale: Na-edebe ma akpaalaokwu Semitik ‘nwa’ ma aha γεέννα, kama ịgbanwe ya ozugbo ka ọ bụrụ echiche zuru ezu banyere hel.
- source_word: διπλότερον ὑμῶν
  choice: okpukpu abụọ karịa unu onwe unu
  rationale: Na-egosipụta ntụnyere Grik ahụ nke ọma ma na-eme ka ọdịiche dị n’etiti onye ahụ na ndị a na-agwa okwu pụta ìhè.
theological_decisions:
- issue: Ntughari γεέννα
  choice: Gịhena
  alternative: hel
  rationale: Aha Grik ahụ nwere ndabere pụrụ iche n’akụkọ na echiche ikpe ikpeazụ nke ndị Juu. Idebe aha ahụ na-ezere ịgbatị ya ka ọ bụrụ naanị okwu izugbe ‘hel’; nkọwa ala peeji na-enye ihe ọzọ ndị na-agụ akwụkwọ maara.
- issue: Akpaalaokwu υἱὸν γεέννης
  choice: nwa Gịhena
  alternative: onye kwesịrị hel / nwa hel
  rationale: ‘Nwa Gịhena’ na-edebe akpaalaokwu Semitik na ike okwu ahụ n’enweghị ịkọwa kpọmkwem otú ọnọdụ ahụ si arụ ọrụ n’ụzọ nkà mmụta okpukpe.
- issue: Ntụaka nwoke otu n’ọnụọgụ mgbe προσήλυτον gasịrị
  choice: mgbe ọ batakwara, unu na-eme ya
  alternative: mgbe onye ahụ batakwara, unu na-eme onye ahụ
  rationale: Ụdị Grik bụ nwoke otu n’ọnụọgụ; nnọchiaha ‘ọ/ya’ bụ Igbo ebumpụta ụwa, ma ọ naghị etinye nkọwa gbasara nwoke ma ọ bụ nwaanyị nke isiokwu ahụ na-achọghị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-edebe ụda ịkatọ siri ike nke Jizọs, aha òtù ndị ahụ, ihe oyiyi ‘oke osimiri na ala,’ na akpaalaokwu ‘nwa Gịhena.’ Akara nkọwa ala peeji [a] na [b] dị n’ebe kwesịrị ekwesị n’isi ederede.
