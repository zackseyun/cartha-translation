    text: A na-akpọkwa ha ‘igbe ekpere.’ Ha bụ obere igbe akpụkpọ anụ e tinyere akụkụ Akwụkwọ Nsọ n’ime ha, nke ụfọdụ ndị Juu na-eyiri n’egedege ihu ma ọ bụ n’aka dịka nrubeisi nye amaokwu ndị dị ka Diuterọnọmi 6:8.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, ‘ọnụ uwe.’ Tulee Ọnụ Ọgụgụ 15:38–39 maka eriri ndị a a na-etinye n’ọnụ uwe.
    reason: lexical_alternative
  revision_rationale: The revision removes the added “memorial” idea from the rendering of φυλακτήρια and replaces the misleading jewellery term for κράσπεδα with an explicit reference to garment tassels. It retains the purpose clause and the explanatory relationship in the Greek, while the footnotes accurately explain the Jewish cultural items without polemical implication.
