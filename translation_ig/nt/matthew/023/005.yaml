id: MAT.23.5
reference: Matthew 23:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: ig
  text: Ma ihe niile ha na-eme bụ ka ndị mmadụ hụ ha; n’ihi na ha na-eme ka igbe akpụkpọ anụ Akwụkwọ Nsọ ha saa mbara[a], na-emekwa ka eriri ndị dị n’ọnụ uwe ha dị ogologo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A na-akpọkwa ha ‘igbe ekpere.’ Ha bụ obere igbe akpụkpọ anụ e tinyere akụkụ Akwụkwọ Nsọ n’ime ha, nke ụfọdụ ndị Juu na-eyiri n’egedege ihu ma ọ bụ n’aka dịka nrubeisi nye amaokwu ndị dị ka Diuterọnọmi 6:8.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, ‘ọnụ uwe.’ Tulee Ọnụ Ọgụgụ 15:38–39 maka eriri ndị a a na-etinye n’ọnụ uwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔργα αὐτῶν
  choice: ọrụ ha niile
  rationale: Nke a na-egosi mkpokọta ihe niile ha na-eme, ma na-edobe njikọ nkịtị dị n’etiti πάντα na ἔργα.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti okwu a na ihe Jizọs kwuru tupu ya.
- source_word: πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: ka ndị mmadụ hụ ha
  rationale: Nkebiokwu a na-egosi ebumnuche ha ji eme ihe ndị ahụ; ‘ndị mmadụ’ na-agụnye mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke.
- source_word: φυλακτήρια
  choice: igbe ncheta Akwụkwọ Nsọ
  rationale: Nhọrọ a na-akọwa obere igbe akpụkpọ anụ ndị nwere akụkụ Akwụkwọ Nsọ n’ime ha n’asụsụ Igbo a ga-aghọta, na-enweghị ịkpọ ha ihe ọjọọ n’onwe ha.
- source_word: πλατύνουσι
  choice: na-eme ka ... saa mbara
  rationale: 'Ọ na-egosipụta ihe ngwaa Grik ahụ pụtara kpọmkwem: ime ka ihe bawanye n’obosara.'
- source_word: κράσπεδα
  choice: ọla ọnụ uwe
  rationale: N’ọnọdụ omenala ndị Juu a, okwu ahụ na-ezo aka n’ọla ma ọ bụ eriri ndị dị n’ọnụ uwe dịka e nyere n’Iwu.
- source_word: μεγαλύνουσι
  choice: na-eme ka ... buru ibu
  rationale: Nke a na-edobe echiche sara mbara nke ime ka ihe dị ukwuu, kama ịkọwapụta naanị ogologo ya ebe Grik ekwughị nke ahụ kpọmkwem.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe atụ na-akọwa ebubo e kwuru na mbido amaokwu ahụ.
theological_decisions:
- issue: Ịsụgharị ihe okpukpe ndị Juu n’enweghị itinye echiche na ha bụ ihe ọjọọ
  choice: Jiri ‘igbe ncheta Akwụkwọ Nsọ’ na ‘ọla ọnụ uwe,’ tinyekwa nkọwa omenala n’ala peeji.
  alternative: Jiri naanị okwu mbinye ‘filakteri’ ma ọ bụ kpọọ ha ‘igbe ekpere’ na ‘eriri ọnụ uwe.’
  rationale: Amaokwu ahụ na-akatọ ime ihe iji gosi onwe onye, ọ bụghị nrubeisi n’iwu ndị metụtara ihe ndị a. Nsụgharị ahụ mere ka ihe ndị ahụ doo anya n’emeghị ka a ghọta na ha bụ ihe ọjọọ n’onwe ha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. ‘Igbe ncheta Akwụkwọ Nsọ’ na-akọwa ihe ndị na-agụ akwụkwọ nwere ike amaghị, ebe nkọwa ala peeji na-enye nkọwa omenala zuru ezu. E debere nkatọ ahụ n’ebumnuche nke ndị mmadụ—ka a hụ ha—ọ bụghị n’ihe okpukpe ndị ahụ n’onwe ha.
