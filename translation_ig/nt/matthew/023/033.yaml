id: MAT.23.33
reference: Matthew 23:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: ig
  text: Unu agwọ, ụmụ ajụala! Olee otú unu ga-esi gbanahụ ikpe Gehena[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ikpe ọkụ ala mmụọ.” N’asụsụ Grik: “Gehena.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὄφεις
  choice: agwọ
  rationale: Ọ bụ okwu ịkpọ mmadụ aha n’ihu ya; “agwọ” bụ okwu Igbo doro anya ma na-edobe ike nke ihe atụ ahụ.
- source_word: γεννήματα
  choice: ụmụ
  rationale: “Ụmụ” na-egosi ndị a mụrụ ma ọ bụ ndị sitere n’aka ihe ọzọ, ma na-ada nke ọma n’okwu Igbo a.
- source_word: ἐχιδνῶν
  choice: ajụala
  rationale: “Ajụala” na-egosi ụdị agwọ na-egbu egbu, ya mere ọ na-edobe nkọwa pụrụ iche na ịdị arọ nke okwu Grik ahụ.
- source_word: πῶς
  choice: Olee otú
  rationale: Ọ na-ebute ajụjụ nkwuwa okwu banyere otú mgbapụ ahụ ga-esi kwe omume, n’etinyeghị n’ime ya nkọwa karịrị nke isi mmalite.
- source_word: φύγητε
  choice: unu ga-esi gbanahụ
  rationale: “Gbanahụ” bụ okwu Igbo e ji ekwu mmadụ izere ma ọ bụ gbapụ n’ihe egwu ma ọ bụ ikpe; usoro “ga-esi” na-egosikwa ntụgharị uche nke ajụjụ ahụ n’ọdịnihu.
- source_word: κρίσεως
  choice: ikpe
  rationale: “Ikpe” bụ okwu sara mbara nke na-edobe echiche ikpe e kpebiri n’enweghị ime ka ọ bụrụ “ikpe ọmụma” n’ụzọ siri ike karịa Grik ahụ.
- source_word: γεέννης
  choice: Gehena
  rationale: E debere aha pụrụ iche ahụ dịka “Gehena” iji chekwaa ndabere ndị Juu na nkọwa eskatọlọjị ya, kama ịgwakọta ya ozugbo na echiche niile e jikọtara na “ala mmụọ.”
theological_decisions:
- issue: Nsụgharị γέεννα
  choice: Gehena
  alternative: ala mmụọ
  rationale: “Gehena” na-edobe okwu pụrụ iche nke ihe odide Grik na ndabere akụkọ ihe mere eme ya. A na-enye “ala mmụọ” n’ala ala peeji dịka nsụgharị a na-ejikarị eme ihe, n’etinyeghị nkọwa okpukpe ọzọ n’isiokwu ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Unu agwọ” na “ụmụ ajụala” na-edobe ụdị ịkatọ mmadụ ozugbo na ike nke ihe atụ ahụ; ajụjụ “Olee otú unu ga-esi…” na-ada nke ọma n’Igbo ma na-edobe ọdịdị ajụjụ nkwuwa okwu.
