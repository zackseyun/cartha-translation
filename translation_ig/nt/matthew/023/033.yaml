  to: Unu agwọ, ụmụ ajụala! Olee otú unu ga-esi gbanahụ ikpe Gehena[a]?
  rationale: Only the footnote is revised. “Ọkụ ala mmụọ” gives a clearer conventional Igbo equivalent for the English alternative “hell,” while the text properly preserves the source term “Gehena.”
