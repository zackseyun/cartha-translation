id: MAT.23.2
reference: Matthew 23:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγων· Ἐπὶ τῆς Μωϋσέως καθέδρας ἐκάθισαν οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/002.yaml
  text: saying[a], “The scribes and the Pharisees sit in Moses’ seat.”
translation:
  language: ig
  text: na-asị[a], “Ndị odeakwụkwọ na ndị Farisii anọdụwo n’oche Mozis.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ sịrị.” Okwu Grik a jikọtara okwu a na amaokwu bu ụzọ.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: na-asị
  rationale: Ọ bụ participle nke na-ejikọta okwu Jizọs na amaokwu bu ụzọ; ‘na-asị’ na-edobe njikọ ahụ kama ime ya ngwaa kwụụrụ onwe ya.
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: n’oche Mozis
  rationale: Nke a na-edobe ihe atụ nke oche dị ka ọnọdụ ikike izi ihe e jikọtara ya na Mozis, n’Igbo dị mfe ma doo anya.
- source_word: ἐκάθισαν
  choice: anọdụwo
  rationale: Aorist καθίζω nwere ike ịpụta ịnọdụ ala ma ọ bụ ịnara ọnọdụ. ‘Anọdụwo’ na-egosi ọnọdụ ha batara ma nọgide na ya, n’ebughị ụzọ kpebie ma ha họpụtara onwe ha ma ọ bụ na e nyere ha ya.
- source_word: οἱ γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Ọ bụ aha a na-ejikarị akọwa ndị ọkachamara n’iwu na ndị na-ede akwụkwọ n’oge ahụ; e debere aha ahụ nkenke kama itinye nkọwa sara mbara n’ahụ isiokwu.
- source_word: οἱ Φαρισαῖοι
  choice: ndị Farisii
  rationale: Nke a bụ nsụgharị aha otu ahụ nke a na-aghọta nke ọma n’Igbo Baịbụl.
theological_decisions:
- issue: Ma ἐκάθισαν ọ̀ pụtara naanị ‘na-anọdụ’ ka ọ̀ na-egosi na ha ewerela ọnọdụ ikike
  choice: anọdụwo
  alternative: na-anọdụ; etinyewo onwe ha n’oche
  rationale: ‘Anọdụwo’ na-edobe echiche nke ọnọdụ ha nọ na ya, ma ọ naghị agbakwụnye okwu reflexive ‘onwe ha’ nke adịghị n’Grik. Ya mere, ọ na-ahapụ ajụjụ banyere otú ha si nweta ikike ahụ ka ọ ghara ikpebi n’ime nsụgharị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E ji ‘oche Mozis’ debe ihe atụ gbasara ikike izi ihe; e zere itinye echiche doro anya na ndị ahụ họpụtara onwe ha, ebe okwu Grik n’onwe ya anaghị ekwu ‘onwe ha’.
