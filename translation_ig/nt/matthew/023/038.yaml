review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the attention signal, the passive construction, the dative sense (‘unu’), and the deliberately broad ‘ụlọ unu.’ However, ‘a hapụrụla’ is perfect/completive (‘has been left’), whereas ἀφίεται is present passive. ‘A na-ahapụ’ better represents the source’s present, solemn declaration without naming an agent.
  naturalness: ‘Lee’ is a natural, suitably solemn attention-getter in Standard Igbo. The revised sentence is idiomatic and clear. ‘Ka ọ tọgbọrọ n’efu’ naturally conveys the predicative force of ἔρημος in this judgment context.
  terminology: ‘ụlọ unu’ properly retains οἶκος without prematurely identifying it as the temple. ‘Ụlọnsọ ukwu’ in the footnote is an appropriate contextual alternative, while the note correctly states that the Greek remains broader. ‘Tọgbọrọ n’efu’ fittingly communicates desolation/abandonment.
  issues:
  - severity: medium
    issue: ‘a hapụrụla’ changes the source verb’s aspect.
    rationale: The -la form is completive/perfective in Igbo, while ἀφίεται is present passive. Revising to ‘a na-ahapụ’ more closely reflects ‘is being left’ and retains the passive, agent-unspecified declaration.
  revised_text: Lee[a], a na-ahapụ unu ụlọ unu ka ọ tọgbọrọ n’efu.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, ‘ụlọnsọ ukwu unu’; ‘ụlọ unu’ nwere ike na-ezo kpọmkwem n’ụlọnsọ ukwu, ọ bụ ezie na okwu Grik ahụ ka sara mbara.
    reason: alternative_reading
  revision_rationale: Only the verbal aspect is revised for closer fidelity to the Greek present passive. The broad referent of ‘ụlọ unu,’ the passive construction, the solemn register, and the footnote’s restrained contextual clarification are retained.
