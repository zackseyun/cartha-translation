  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν ⸀ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/038.yaml
  text: Look[a], your house is left to you desolate.
translation:
  language: ig
  text: Lee[a], a na-ahapụ unu ụlọ unu ka ọ tọgbọrọ n’efu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘ụlọnsọ ukwu unu’; ‘ụlọ unu’ nwere ike na-ezo kpọmkwem n’ụlọnsọ ukwu, ọ bụ ezie na okwu Grik ahụ ka sara mbara.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu Igbo dị ugbu a nke na-adọta uche ma na-ejigide ịdị arọ nke ọkwa a.
- source_word: ἀφίεται
  choice: a hapụrụla
  rationale: Nke a na-echekwa olu nnara nke ngwaa Grik ahụ ma na-egosi na a hapụrụ ụlọ ahụ; ọ naghị akpọ onye mere ya aha.
- source_word: ὑμῖν
  choice: unu
  rationale: E tinyere ‘unu’ dịka onye a hapụrụ ụlọ ahụ nye, n’usoro Igbo na-asụkarị ‘a hapụrụ unu ụlọ unu.’
- source_word: ὁ οἶκος ὑμῶν
  choice: ụlọ unu
  rationale: Nke a na-edobe okwu sara mbara nke Grik n’enweghị ime ka ọ bụrụ naanị ụlọnsọ ukwu, Jerusalem, ma ọ bụ ezinụlọ Izrel.
- source_word: ἔρημος
  choice: ka ọ tọgbọrọ n’efu
  rationale: Nkebiokwu a na-egosi na ebe ahụ aghọwo nke a gbahapụrụ na nke tọgbọrọ n’efu, kwekọrọ n’olu amụma ikpe dị n’amaokwu ahụ.
theological_decisions:
- issue: Ihe ‘ụlọ unu’ na-ezo aka na ya
  choice: E debere ya dịka ‘ụlọ unu’ n’ahịrị bụ isi.
  alternative: ‘Ụlọnsọ ukwu unu,’ Jerusalem, ma ọ bụ ụlọ Izrel.
  rationale: Ọnọdụ okwu ahụ na-atụ aka n’ụlọnsọ ukwu na Jerusalem, ma okwu Grik ahụ ka sara mbara. Idobe ‘ụlọ’ na-echekwa mgbagwoju anya na ịdị arọ amụma ahụ.
translation_notes:
  register: Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. ‘Lee’ bụ ụzọ eke isi kpọọ uche; ‘tọgbọrọ n’efu’ na-eburu echiche nke ịbụ ihe a gbahapụrụ na ịtọgbọrọ n’efu.
