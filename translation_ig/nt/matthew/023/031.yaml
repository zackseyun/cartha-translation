id: MAT.23.31
reference: Matthew 23:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: ig
  text: Ya mere, unu na-agba akaebe megide onwe unu na unu bụ ụmụ ndị ahụ gburu ndị amụma[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu na-agbara onwe unu akaebe.” A pụrụ ịsụgharị okwu Grik ahụ n'ụzọ nkịtị otu a, ma n'ọnọdụ a ọ pụtara na akaebe ha na-ama na-ebo ha ebubo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ya mere
  rationale: Na-ewebata ihe a na-ekwubi site n'okwu ndị bu ụzọ; ọ bụ okwu Igbo doro anya ma dịkwa mma n'ọnọdụ a.
- source_word: μαρτυρεῖτε
  choice: unu na-agba akaebe
  rationale: Na-echekwa echiche nke ịgba akaebe, tinyere ụda ikpe dị n'okwu a.
- source_word: ἑαυτοῖς
  choice: megide onwe unu
  rationale: Ọ bụ ezie na dative ahụ nwere ike ịbụ ‘nye onwe unu,’ n'ọnọdụ a akaebe ha na-ama na-etinye ha n'ikpe; ‘megide onwe unu’ na-egosipụta ike okwu ahụ n'Igbo.
- source_word: ὅτι
  choice: na
  rationale: Na-ewebata ihe akaebe ahụ kwuru, ọ bụghị ihe kpatara ya.
- source_word: υἱοί
  choice: ụmụ
  rationale: ‘Ụmụ’ bụ ụzọ Igbo sitere n'okike isi kwuo ndị sitere n'aka ndị ahụ, ma na-ahapụkwa echiche nke njikọ ezinụlọ na iso ha nwee otu omume.
- source_word: τῶν φονευσάντων
  choice: ndị ahụ gburu
  rationale: Na-akọwa ndị nna nna ahụ site n'omume ha mezuru. N'Igbo, ‘gburu’ n'ọnọdụ a na-egosi igbu mmadụ n'ụzọ ajọ omume n'enweghị okwu na-adịghị eke eke.
- source_word: τοὺς προφήτας
  choice: ndị amụma
  rationale: Ọ bụ aha a na-ejikarị eme ihe n'Igbo maka ndị ozi Chineke a kpọrọ ndị amụma.
theological_decisions:
- issue: Ma a ga-asụgharị υἱοί n'ụzọ na-elekwasị anya n'okwu ‘ụmụ nwoke,’ ka ọ bụ n'ụzọ Igbo nke na-egosi ụmụ sitere n'ezinụlọ na ndị na-eso otu omume.
  choice: ụmụ
  alternative: ụmụ nwoke; ụmụ ụmụ ha
  rationale: N'Igbo, ‘ụmụ’ bụ okwu ezinụlọ kwesịrị ekwesị nke na-egosi ndị sitere n'aka mmadụ, ma ọ naghị emebi njikọ dị n'etiti ịbụ ụmụ ha n'ọbara na iso ụzọ ọjọọ ha. ‘Ụmụ nwoke’ ga-eme ka okwu ahụ lekwasị anya n'okike nwoke karịa ka ebumnuche okwu Grik a chọrọ n'Igbo.
- issue: Ma ἑαυτοῖς ga-abụ ‘nye onwe unu’ n'ụzọ nkịtị ma ọ bụ ‘megide onwe unu’ dịka ihe ọ pụtara n'ọnọdụ ikpe a.
  choice: megide onwe unu
  alternative: nye onwe unu
  rationale: Ihe ha kwuru na-ama ha ikpe. Nhọrọ bụ isi na-eme ka nke a doo anya, ebe ihe odide ala peeji na-echekwa ụdị nkịtị na nghọta ọzọ nke dative ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere ụda ịkatọ na echiche ikpe nke amaokwu ahụ, ma chekwaa mgbagwoju anya dị na ἑαυτοῖς site n'ihe odide ala peeji.
