review_pass:
  verdict: revise
  source_fidelity: The draft faithfully retains the sequence and imagery of binding heavy burdens, placing them on people’s shoulders, and the emphatic contrast that those imposing them refuse to move them. The expression “megharịa” is potentially understood as ‘do again/repeat’ rather than physical movement; “ịkwagharị” more directly renders κινῆσαι (‘move’).
  naturalness: The wording is clear Standard Igbo and maintains an appropriately serious register. “Iji mkpịsị aka ha ịkwagharị ha” is more idiomatic and semantically precise for the final clause.
  terminology: “Ibu arọ,” “n’ubu ndị mmadụ,” and “ha onwe ha” appropriately preserve the Greek’s burden metaphor, generic reference to human beings, and emphatic contrast. The footnote is unnecessary because “ndị mmadụ” already naturally conveys the generic sense, but it is not misleading; it may be retained as a concise clarification of the anchor.
  issues:
  - severity: medium
    issue: “megharịa ha” is ambiguous in Igbo.
    rationale: “Megharịa” can suggest doing something again or repeating it. κινῆσαι αὐτά specifically means ‘move them’; “ịkwagharị ha” preserves that physical image and the intended refusal to exert even minimal effort.
  revised_text: Ha na-ekekọta ibu arọ, na-ebikwasịkwa ha n’ubu ndị mmadụ[a], ma ha onwe ha adịghị achọ iji mkpịsị aka ha ịkwagharị ha.
