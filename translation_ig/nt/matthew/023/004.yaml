id: MAT.23.4
reference: Matthew 23:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: ig
  text: Ha na-ekekọta ibu arọ, na-ebikwasịkwa ha n’ubu ndị mmadụ[a], ma ha onwe ha adịghị achọ iji mkpịsị aka ha ịkwagharị ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, mmadụ niile n’ozuzu ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: na-ekekọta
  rationale: Ọ na-egosi ikekọta ihe ọnụ; okwu a na-edobe ihe atụ nke ịkwadebe ibu a ga-ebikwasị ndị ọzọ.
- source_word: φορτία βαρέα
  choice: ibu arọ
  rationale: Nke a na-egosi ma ibu a na-ebu n’ahụ ma arọ na mmekpa ahụ ya nwere ike ịnọchite anya.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: na-ebikwasịkwa ha n’ubu
  rationale: Ọ na-edobe ihe oyiyi doro anya nke ịtụkwasị ibu n’ubu mmadụ.
- source_word: τῶν ἀνθρώπων
  choice: ndị mmadụ
  rationale: ἄνθρωποι n’ebe a na-anọchite anya mmadụ niile; “ndị mmadụ” bụ ntụgharị Igbo ebumpụta ụwa nke na-enweghị ịgbachi ya n’ebe ụmụ nwoke naanị nọ.
- source_word: αὐτοὶ δὲ
  choice: ma ha onwe ha
  rationale: “Ha onwe ha” na-edobe nkwusi ike na ọdịiche dị n’etiti ihe ha na-ebikwasị ndị ọzọ na ihe ha jụrụ ime.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: iji mkpịsị aka ha
  rationale: Ọ na-edobe mkpịsị aka n’ọnụọgụ otu dịka Grik si dị, ma na-egosikwa obere mgbalị kacha nta.
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: adịghị achọ ... megharịa ha
  rationale: “Adịghị achọ” na-egosi ajụjụ sitere n’uche, ọ bụghị enweghị ike; “megharịa” na-anọ nso na κινέω, ‘ịkwagharị’.
theological_decisions:
- issue: Ma ibu ndị a hà bụ ibu nkịtị ka hà bụ ihe atụ
  choice: Edobere okwu ihe atụ ahụ dịka “ibu arọ” n’enweghị ịkọwa kpọmkwem ihe ibu ahụ bụ.
  alternative: Ịkọwa ha kpọmkwem dịka iwu okpukpe ma ọ bụ ihe ndị isi okpukpe chọrọ ka e mee.
  rationale: Ọnọdụ amaokwu ahụ na-egosi ibu ọrụ na-emegbu mmadụ, ma Grik akpọghị kpọmkwem ihe ndị ahụ; ịhapụ ihe atụ ahụ na-echekwa obosara na esemokwu nke ederede.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ihe oyiyi nke ikekọta ibu, ibikwasị ya n’ubu, na ịghara iji ọbụna mkpịsị aka megharịa ya.
