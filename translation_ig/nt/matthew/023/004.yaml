- from: Ha na-ekekọta ibu arọ, na-ebikwasịkwa ha n’ubu ndị mmadụ[a], ma ha onwe ha adịghị achọ iji mkpịsị aka ha megharịa ha.
  to: Ha na-ekekọta ibu arọ, na-ebikwasịkwa ha n’ubu ndị mmadụ[a], ma ha onwe ha adịghị achọ iji mkpịsị aka ha ịkwagharị ha.
  rationale: Only the final verb has been revised, from “megharịa” to “ịkwagharị,” to express the Greek verb κινέω unambiguously as ‘move’ while preserving the concrete burden image and the text’s rhetorical force. The generic expression “ndị mmadụ” and its clarification are retained.
