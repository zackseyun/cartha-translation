revisions:
- from: “Ahụhụ ga-adịrị unu, unu ndị ndu kpuru ìsì, ndị na-asị, ‘Onye ọ bụla ji ụlọnsọ ukwu ṅụọ iyi[a], ọ bụ ihe efu[b]; ma onye ji ọlaedo nke ụlọnsọ ukwu ṅụọ iyi, iyi ahụ kere ya agbụ.’”
  to: “Ahụhụ ga-adịrị unu, ndu ndị kpuru ìsì, ndị na-asị, ‘Onye ọ bụla ji ụlọ nsọ ṅụọ iyi[a], ọ bụ ihe efu[b]; ma onye ji ọlaedo nke ụlọ nsọ ṅụọ iyi, ọ ghaghị imezu iyi ya.’”
  rationale: The revision removes the unsupported modifier ‘ukwu’ from the rendering of ναός, uses more idiomatic Igbo word order for ‘blind guides,’ and expresses the obligation of ὀφείλει in natural oath-context language. The elliptical first oath judgment remains ‘ọ bụ ihe efu,’ with its intended sense retained in the footnote.
