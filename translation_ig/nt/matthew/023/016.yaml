  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: ig
  text: “Ahụhụ ga-adịrị unu, ndu ndị kpuru ìsì, ndị na-asị, ‘Onye ọ bụla ji ụlọ nsọ ṅụọ iyi[a], ọ bụ ihe efu[b]; ma onye ji ọlaedo nke ụlọ nsọ ṅụọ iyi, ọ ghaghị imezu iyi ya.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, a pụkwara ịsụgharị ya, “ṅụọ iyi n'ime ụlọ nsọ.” N'ebe a, okwu ahụ bụ usoro e ji eme iyi, ya mere ọ pụtara iji ụlọ nsọ ṅụọ iyi.
    reason: lexical_alternative
  - marker: b
    text: 'N''asụsụ Grik: “ọ bụ ihe efu”; ya bụ, a na-ewere iyi dị otú ahụ dịka nke na-adịghị eke onye ṅụrụ ya agbụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: Ahụhụ ga-adịrị unu
  rationale: Na-egosipụta mkpu amụma nke ikpe na ịdọ aka ná ntị, n'Igbo dị ugwu ma doo anya.
- source_word: ὁδηγοὶ τυφλοὶ
  choice: ndị ndu kpuru ìsì
  rationale: Na-echekwa ihe atụ nke ndị na-edu ndị ọzọ ma ha onwe ha enweghị ike ịhụ ụzọ.
- source_word: οἱ λέγοντες
  choice: ndị na-asị
  rationale: Ọ bụ nsụgharị nkịtị ma dịkwa mfe nghọta nke participle ahụ dịka nkebiokwu njikọ.
- source_word: Ὃς ἂν ὀμόσῃ
  choice: Onye ọ bụla ... ṅụọ iyi
  rationale: Na-egosipụta ọnọdụ izugbe na-akọwapụtaghị otu onye kpọmkwem.
- source_word: ἐν τῷ ναῷ
  choice: ji ụlọnsọ ukwu ṅụọ iyi
  rationale: Ọ bụ ezie na ἐν nwere ike ịpụta ‘n'ime,’ ebe a ọ bụ usoro okwu iyi nke pụtara iji ụlọnsọ ahụ mee ihe akaebe ma ọ bụ ihe nkwado iyi.
- source_word: οὐδέν ἐστιν
  choice: ọ bụ ihe efu
  rationale: Na-echekwa mkpụmkpụ na nghọtahie nwere ike ịdị na okwu Grik ahụ; nkọwa ala peeji na-eme ka ihe e bu n'uche doo anya.
- source_word: χρυσῷ τοῦ ναοῦ
  choice: ọlaedo nke ụlọnsọ ukwu
  rationale: Na-echekwa njikọ genitive na ọdịiche dị n'etiti ụlọnsọ ukwu na ọlaedo ya.
- source_word: ὀφείλει
  choice: iyi ahụ kere ya agbụ
  rationale: Na-egosipụta ọrụ iwu na omume nke ὀφείλει n'ọnọdụ iyi, n'asụsụ Igbo a na-aghọta nke ọma.
theological_decisions:
- issue: Okwu iyi dị mkpụmkpụ na ibu ọrụ a hapụrụ ka a ghọta ya
  choice: E debere nkebi mbụ dịka ‘ọ bụ ihe efu,’ ma kọwaa nkebi nke abụọ dịka ‘iyi ahụ kere ya agbụ.’
  alternative: 'A pụrụ ịsụgharị ya n''ụzọ ka nso n''ụdị okwu Grik: ‘ọ bụ ihe efu ... o ji ụgwọ.’'
  rationale: Nke a na-echekwa mkpụmkpụ nke nkebi mbụ ma mee ka ọdịiche gbasara iyi na-adịgide adịgide doo onye na-agụ Igbo anya, n'etinyeghị ozizi ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji ‘ụlọnsọ ukwu’ mee ναός iji gosi ebe nsọ bụ isi, a hapụghịkwa ihe atụ nke ndị ndu kpuru ìsì.
