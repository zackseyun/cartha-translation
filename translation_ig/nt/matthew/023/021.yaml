  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ ναῷ ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ ⸀κατοικοῦντι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: ig
  text: Onye ọ bụla nke ji ụlọ nsọ aṅụ iyi na-eji ya na Onye bi n’ime ya aṅụ iyi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime ụlọ nsọ ... n’ime ya”; preposition Grik a pụtara kpọmkwem “n’ime,” ma n’usoro iyi dị ebe a, ọ na-enye echiche nke ihe e ji aṅụ iyi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: Onye ọ bụla nke ... aṅụ iyi
  rationale: Nkebi okwu a bụ participle nwere article nke na-arụ ọrụ dị ka aha ma na-ezo aka n’ozuzu nye onye ọ bụla mere iyi; okwu Igbo a na-egosipụta echiche ahụ n’ụzọ doro anya ma dịkwa eke.
- source_word: ἐν τῷ ναῷ
  choice: ji ụlọ nsọ aṅụ iyi
  rationale: Ọ bụ ezie na ἐν pụtarakarị ‘n’ime,’ n’usoro okwu iyi dị n’ebe a ọ na-egosi ihe e ji aṅụ iyi. ‘Ji ụlọ nsọ aṅụ iyi’ bụ ụzọ Igbo si ekwu ‘swear by the temple.’
- source_word: ναῷ
  choice: ụlọ nsọ
  rationale: ναός na-ezo aka n’ebe nsọ nke tempụl ahụ; ‘ụlọ nsọ’ bụ okwu Igbo a na-aghọta nke ọma ma dabara n’ebe a.
- source_word: ὀμνύει
  choice: na-aṅụ iyi
  rationale: Present indicative a na-ekwu ụkpụrụ zuru ezu nke na-adị mgbe niile; usoro ‘na-aṅụ iyi’ na-egosipụta nke a n’Igbo.
- source_word: ἐν αὐτῷ
  choice: na-eji ya ... aṅụ iyi
  rationale: Dị ka ἐν nke mbụ, nke a na-arụ ọrụ n’usoro iyi, na-ezo aka n’ụlọ nsọ dị ka ihe e ji aṅụ iyi.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: Onye bi n’ime ya
  rationale: Present participle a na-arụ ọrụ dị ka aha ma na-ezo aka n’Onye bi n’ụlọ nsọ ahụ. ‘Bi n’ime ya’ na-echekwa onyinyo nke ibi n’ụlọ nsọ ahụ.
theological_decisions:
- issue: Onye ‘Onye bi n’ime ya’ na-ezo aka na ya
  choice: E ji mkpụrụedemede ukwu dee ‘Onye’ iji gosi na ọ na-ezo aka na Chineke.
  alternative: A pụrụ ide ‘onye bi n’ime ya’ na-enweghị mkpụrụedemede ukwu, mee ka onye a na-ekwu banyere ya bụrụ nke a ga-amata naanị site n’ọnọdụ okwu.
  rationale: N’ọnọdụ okwu a, Jizọs na-akụzi na onye ji ụlọ nsọ aṅụ iyi na-etinyekwa Chineke, onye bi n’ime ya, n’iyi ahụ. Mkpụrụedemede ukwu anaghị atụkwasị ozizi ọzọ; ọ na-eme ka onye amaara site n’ọnọdụ okwu pụta ìhè.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ụlọ nsọ’ mee ka okwu ναός doo anya, e jikwa usoro Igbo ‘iji ... aṅụ iyi’ mee ka usoro iyi ahụ bụrụ nke eke, ebe nkọwa ala peeji na-echekwa ihe preposition Grik ahụ pụtara kpọmkwem.
