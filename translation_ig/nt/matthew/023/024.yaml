  text: ὁδηγοὶ τυφλοί, ⸀οἱ διϋλίζοντες τὸν κώνωπα τὴν δὲ κάμηλον καταπίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: ig
  text: Unu ndị ndu kpuru ìsì! Unu na-eji nzacha ewepụ anwụnta[a], ma unu na-elo kamel!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-enyochapụ anwụnta.” Ngwaa Grik a na-ekwu maka iji nzacha enyo mmiri ka e wepụ ihe na-adịghị ọcha dị n’ime ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδηγοὶ
  choice: ndị ndu
  rationale: Okwu a pụtara ndị na-edu ma ọ bụ na-egosi ndị ọzọ ụzọ; “ndị ndu” bụ okwu Igbo doro anya ma dabara n’ihe atụ a.
- source_word: τυφλοί
  choice: kpuru ìsì
  rationale: Nke a na-edobe nkọcha siri ike na ihe atụ nke enweghị ike ịhụ ma ọ bụ ịghọta ihe ime mmụọ.
- source_word: διϋλίζοντες
  choice: na-eji nzacha ewepụ
  rationale: Ngwaa Grik a na-ekwu maka inyo mmiri ka e wepụ ihe na-adịghị mkpa dị n’ime ya. Nsụgharị a na-eme ka omume ahụ doo onye na-agụ Igbo anya n’enweghị ịkọwa ihe karịrị ihe e dere.
- source_word: τὸν κώνωπα
  choice: anwụnta
  rationale: κώνωψ bụ obere ahụhụ yiri anwụnta; “anwụnta” bụ okwu Igbo nkịtị nke na-edobe ọdịiche dị n’etiti obere ahụhụ ahụ na nnukwu kamel.
- source_word: τὴν δὲ κάμηλον
  choice: ma unu na-elo kamel
  rationale: “Ma” na-egosipụta δέ nke na-emegide ịkpachapụ anya n’ihe pere mpe na ime ihe dị nnọọ ukwuu ma dị njọ.
- source_word: καταπίνοντες
  choice: na-elo
  rationale: “Na-elo” na-egosipụta omume ilo ihe ma na-edobe ikwubiga okwu ókè dị ndụ nke okwu Grik ahụ.
theological_decisions:
- issue: Ihe atụ nke anụmanụ ndị e weere dị ka ndị na-adịghị ọcha
  choice: Idobe kpọmkwem ihe oyiyi nke iwepụ anwụnta site na nzacha ma ilo kamel.
  alternative: Ịkọwa ya ozugbo dị ka ilekwasị anya n’obere mmejọ ma leghara nnukwu mmejọ anya.
  rationale: Ike nke nkọcha ahụ sitere n’ọdịiche na-atọ ọchị ma dị egwu n’etiti obere anwụnta na nnukwu kamel. Idobe ihe oyiyi ahụ na-echekwa ihe Grik kwuru ma ghara ịgbakwunye nkọwa okpukpe pụrụ iche.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị mfe ma dị ùgwù. Mmegharị “Unu” na nkebi nke abụọ na-eme ka okwu ahụ bụrụ nke eke n’Igbo ma na-edobe ịkpọ ndị a okwu ozugbo na nkọcha siri ike nke amaokwu ahụ.
