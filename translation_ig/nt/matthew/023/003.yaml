id: MAT.23.3
reference: Matthew 23:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: ig
  text: Ya mere, meenụ ma debeenu ihe niile ha gwara unu. Ma unu emela dị ka ha si eme[a], n’ihi na ha na-ekwu ma ha anaghị eme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu emela ihe kwekọrọ n’omume ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: Ya mere ... ihe niile
  rationale: “Ya mere” na-egosi nkwubi okwu nke οὖν, ebe “ihe niile” na-echekwa ike zuru ezu nke πάντα ... ὅσα ἐὰν n’Igbo dị mfe nghọta.
- source_word: εἴπωσιν ὑμῖν
  choice: ha gwara unu
  rationale: “Gwara unu” bụ ụzọ Igbo si ekwu okwu e kwuru kpọmkwem nye mmadụ, n’ebughị ụzọ tinye echiche sara mbara dịka ‘kụziere’ nke adịghị n’okwu Grik.
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: meenụ ma debekwanụ
  rationale: '“Meenụ” na “debekwanụ” na-edobe ngwaa abụọ dị iche iche: ime ihe ahụ na idebe ya, ma na-enye ha dịka iwu nye ọtụtụ mmadụ.'
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε
  choice: Ma unu emela ihe n’ụzọ ha si eme ya
  rationale: Nke a na-egosipụta κατά dịka ịgbaso ụkpụrụ ma ọ bụ ụzọ omume ha, ma na-anọgide bụrụ Igbo eke. E debere nsụgharị nke na-akpọ ἔργα ‘omume ha’ n’ala peeji.
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: n’ihi na ha na-ekwu, ma ha anaghị eme
  rationale: Nke a na-echekwa mkpụmkpụ okwu ahụ, ọdịiche dị n’etiti ikwu na ime, nakwa nkwughachi nke ngwaa ‘ime’ dị n’amaokwu ahụ.
theological_decisions:
- issue: Ma a ga-akọwapụta n’amaokwu a na okwu ahụ metụtara ikike ndị odeakwụkwọ na ndị Farisii nwere site n’oche Mosis.
  choice: Ahapụrụ ihe ha na-ekwu ka amaokwu ndị gbara ya gburugburu kọwaa ya; a tinyeghị ‘ihe ha na-akụziri unu’ ma ọ bụ ‘ihe ha na-ekwu site n’oche Mosis.’
  alternative: Ịsụgharị ya dịka ‘ihe niile ha na-akụziri unu’ ma ọ bụ ‘ihe niile ha na-agwa unu site n’oche Mosis.’
  rationale: Amaokwu Grik a anaghị ekwughachi nkọwa ndị ahụ. Ịhapụ ya otu a na-ezere itinye nkọwa sitere n’amaokwu gara aga n’ime amaokwu a.
- issue: Ma a ga-eme ka nkwughachi nke ποιέω dị nro n’Igbo.
  choice: Ejiri “meenụ ... emela ... anaghị eme” chekwaa nkwughachi ahụ.
  alternative: Iji ngwaa dị iche iche dịka ‘sorọnụ ... eṅomila ... anaghị etinye ya n’ọrụ.’
  rationale: Nkwughachi ahụ bụ akụkụ dị mkpa nke ụzọ okwu Grik si kpughee ọdịiche dị n’etiti ihe ha na-ekwu na ihe ha na-eme.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. Ụdị iwu “meenụ,” “debekwanụ,” na “unu emela” na-egosi na a na-agwa ọtụtụ mmadụ okwu. E zere okwu ụka pụrụ iche na nkọwa agbakwunyere.
