id: MAT.23.30
reference: Matthew 23:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγετε· Εἰ ⸀ἤμεθα ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν, οὐκ ἂν ⸁ἤμεθα ⸂αὐτῶν κοινωνοὶ⸃ ἐν τῷ αἵματι τῶν προφητῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: ig
  text: Unu na-asịkwa, “A sị na anyị nọ n’oge ndị nna anyị ochie, anyị agaraghị eso ha keta oke n’ọbara ndị amụma.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγετε
  choice: unu na-asịkwa
  rationale: Oge ugbu a na onye nke abụọ ọtụtụ ka e ji mee ka okwu ịkatọ Jizọs na-agwa ha ozugbo pụta ìhè; καί bụ ‘-kwa’.
- source_word: Εἰ ἤμεθα ἐν ταῖς ἡμέραις
  choice: A sị na anyị dị ndụ n’oge
  rationale: Nke a na-egosi ọnọdụ a na-eche n’echiche banyere oge gara aga nke na-emeghị eme; ‘dị ndụ n’oge’ bụ Igbo doro anya ma kwekọọ n’ụdị okwu Grik.
- source_word: τῶν πατέρων ἡμῶν
  choice: nna nna anyị ha
  rationale: N’ọnọdụ a πατέρες na-ezo aka n’ụmụ nwoke ndị nna ochie ha, ọ bụghị naanị nna mụrụ mmadụ; ‘nna nna anyị ha’ bụ okwu Igbo e ji ekwu ndị nna ochie.
- source_word: οὐκ ἂν ἤμεθα
  choice: anyị agaraghị
  rationale: Ụdị ọnọdụ a na-egosi ihe ha kwuru na ha agaraghị eme n’oge gara aga.
- source_word: αὐτῶν κοινωνοὶ
  choice: eso ha nwee oke
  rationale: κοινωνοί pụtara iso ndị ọzọ kerịta ma ọ bụ tinye aka n’ihe; okwu a na-edobe echiche nke mmekọ na mmehie ahụ n’ebughị ụzọ mee ya ka ọ bụrụ naanị ‘ndị ogbugbu ibe ha.’
- source_word: ἐν τῷ αἵματι τῶν προφητῶν
  choice: n’ọbara ndị amụma
  rationale: A hapụrụ ihe atụ doro anya nke ‘ọbara’ dịka Grik si dị; n’ọnọdụ a ọ na-ezo aka n’ịkwafu ọbara na ikpe ọmụma metụtara ọnwụ ndị amụma.
theological_decisions:
- issue: Ogo nke iso mee ihe ọjọọ dị na κοινωνοὶ ἐν τῷ αἵματι
  choice: “eso ha nwee oke n’ọbara ndị amụma”
  alternative: “soro ha kwafuo ọbara ndị amụma”
  rationale: Nhọrọ bụ isi na-edobe asụsụ mmekọ nke κοινωνοί na ihe atụ ‘ọbara,’ ma ghara ime ka ihe Grik hapụrụ n’ụzọ sara mbara bụrụ naanị nkwupụta kpọmkwem banyere omume igbu mmadụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ụda okwu a na-ekwu ozugbo na ọnọdụ gara aga nke na-emegide eziokwu. Enweghị akara nkọwa ala peeji n’ihi na nkọwa ụkwụ Bekee e nyere adabaghị na akara ha n’ahịrịokwu Bekee, ebe ntụgharị Igbo a na-eme ka isi okwu ahụ doo anya n’enweghị nkọwa ọzọ.
