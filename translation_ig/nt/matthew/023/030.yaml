revisions:
- from: unu na-asịkwa, “A sị na anyị dị ndụ n’oge nna nna anyị ha, anyị agaraghị eso ha nwee oke n’ọbara ndị amụma.”
  to: Unu na-asịkwa, “A sị na anyị nọ n’oge ndị nna anyị ochie, anyị agaraghị eso ha keta oke n’ọbara ndị amụma.”
  rationale: The revision corrects the possessive and improves idiomatic Standard Igbo. “Nọ n’oge” faithfully renders the temporal idiom “in the days of,” and “eso ha keta oke n’ọbara” maintains the Greek image and its stated participation/complicity without interpretive expansion.
  reviewer_model: gpt-5.6-terra
