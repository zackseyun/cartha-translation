  text: Τότε ὁ Ἰησοῦς ἐλάλησεν τοῖς ὄχλοις καὶ τοῖς μαθηταῖς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/001.yaml
  text: Then Jesus spoke to the crowds and to his disciples,
translation:
  language: ig
  text: Mgbe ahụ, Jizọs gwara ìgwè mmadụ ahụ na ndị na-eso ụzọ ya okwu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Na-egosi usoro ihe ndị na-eme n’akụkọ; ọ bụ ụzọ doro anya ma bụrụkwa nke e ji asụ Igbo ugbu a.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: Aha onye; Igbo achọghị mkpụrụokwu na-arụ ọrụ dị ka article Grik n’ihu aha onye.
- source_word: ἐλάλησεν
  choice: gwara ... okwu
  rationale: Na-egosipụta omume ikwu okwu n’ụzọ Igbo si ada nke ọma, n’etinyeghị nkọwa ọzọ na-adịghị na Grik.
- source_word: τοῖς ὄχλοις
  choice: ìgwè mmadụ ahụ
  rationale: Na-anọchi anya ndị mmadụ gbakọtara; n’Igbo, aha nchịkọta a na-ada nke ọma ebe a ma nwee ike ịgụnye ọtụtụ ìgwè Grik ahụ na-ekwu maka ha.
- source_word: καὶ
  choice: na
  rationale: Njikọ dị mfe nke jikọtara ìgwè abụọ a gwara okwu.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo doro anya na nke a na-ejikarị akọwa μαθηταί, ebe “ya” na-egosipụta αὐτοῦ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ahịrịokwu ahụ ka ọ gaa n’ihu site na kọma n’ihi na amaokwu na-esote ga-eweta ihe Jizọs kwuru.
