  source_fidelity: The translation accurately conveys Τότε as “Mgbe ahụ,” Jesus as “Jizọs,” and ἐλάλησεν ... τοῖς ὄχλοις καὶ τοῖς μαθηταῖς αὐτοῦ as Jesus speaking to the gathered people and his disciples. Although ὄχλοις is formally plural, “ìgwè mmadụ ahụ” is an idiomatic Igbo collective expression and does not materially alter the referent.
  naturalness: “Mgbe ahụ, Jizọs gwara ìgwè mmadụ ahụ na ndị na-eso ụzọ ya okwu,” is natural, clear Standard Igbo in an appropriate elevated but accessible biblical register. The continuing comma appropriately reflects that the following verse supplies the content of the speech.
