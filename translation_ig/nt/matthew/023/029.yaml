  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: ig
  text: “Ahụhụ dịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ, n’ihi na unu na-ewu ili ndị amụma, na-achọkwa ihe ncheta ndị ezi omume mma[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ili ncheta.” Okwu Grik ahụ nwere ike ịpụta ihe ncheta ma ọ bụ ili e ji echeta mmadụ; ebe a, a sụgharịrị ya “ihe ncheta” iji kewaa ya na “ili” e ji sụgharịa okwu Grik ọzọ dị na mbụ n’amaokwu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: Ahụhụ dịrị unu
  rationale: Ọ na-edobe ike nke nkwupụta amụma nke ikpe, ma bụrụkwa okwu Igbo doro anya na nke dị ùgwù.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Aha a na-ejikarị akọwa ndị ọkachamara n’Iwu ahụ; ọ dị nso n’ụdị okwu Grik karịa nkọwa sara mbara dị ka ‘ndị nkuzi Iwu.’
- source_word: Φαρισαῖοι
  choice: ndị Farisii
  rationale: E degharịrị aha òtù ahụ n’ụdị Igbo a maara nke ọma.
- source_word: ὑποκριταί
  choice: ndị ihu abụọ
  rationale: Ọ na-egosi ndị na-eme ka ha bụrụ ihe ha na-abụghị n’omume okpukpe, n’asụsụ Igbo sitere n’okike.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosipụta ihe kpatara nkwupụta ahụ n’ụzọ doro anya.
- source_word: οἰκοδομεῖτε
  choice: unu na-ewuru
  rationale: Ọ na-edobe omume nke ngwaa ahụ n’oge ugbu a, n’etinyeghị echiche ‘iwughachi’ nke Grik anaghị amanye.
- source_word: τάφους
  choice: ili
  rationale: Ọ dabara n’ebe e wuru maka olili ma kwekọọ na ihe ngwaa ‘iwuru’ pụtara.
- source_word: προφητῶν
  choice: ndị amụma
  rationale: Ọ bụ ntụgharị nkịtị nke genitive na-egosi ndị nwe ili ahụ.
- source_word: κοσμεῖτε
  choice: na-achọkwa ... mma
  rationale: Nkebiokwu Igbo a na-asụkarị na-enye echiche nke ịchọ ihe mma ma ọ bụ ịma ya mma.
- source_word: μνημεῖα
  choice: ihe ncheta ili
  rationale: Ọ na-echekwa echiche nke ihe ncheta ma na-egosikwa njikọ ya na olili; ọ na-ekewapụ ya ntakịrị na τάφους.
- source_word: δικαίων
  choice: ndị ezi omume
  rationale: Ọ na-egosi ndị mmadụ e ji ezi omume mara n’enweghị ibubata nkọwa ozizi ọzọ.
theological_decisions:
- issue: Ntụgharị δικαίων n’akụkụ ndị kwesịrị ntụkwasị obi n’oge gara aga
  choice: ndị ezi omume
  alternative: ndị ziri ezi
  rationale: ‘Ndị ezi omume’ bụ okwu Igbo doro anya maka ndị omume ha ziri ezi, ma ọ naghị amanye nkọwa Pọl ma ọ bụ ozizi otu ụka n’ime amaokwu ahụ.
translation_notes:
  register: Asụsụ Igbo Standard nke oge a, dị ùgwù ma dị mfe nghọta. E jikọtara nkwupụta ikpe ahụ na ihe kpatara ya site na ‘n’ihi na,’ dịka usoro Grik si dị. E debere ọdịiche dị n’etiti τάφους na μνημεῖα n’ụzọ na-adịghị ehichapụ ohere μνημεῖα nwere ịpụta ili ncheta.
