review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the denunciatory «Οὐαί», the addressed groups, their hypocrisy, the causal clause, and the paired actions. However, «unu na-ewuru ndị amụma ili» naturally foregrounds building tombs for the prophets, whereas the Greek says building the prophets’ tombs. «Ili ndị amụma» directly preserves the genitive relationship. For μνημεῖα, «ihe ncheta ndị ezi omume» preserves the distinct memorial sense without adding ‘tomb’ to the main text.
  naturalness: The revised wording is fluent, contemporary Standard Igbo. «Na-achọ ... mma» is idiomatic for decorating/adornment. «Ihe ncheta ili» is understandable but somewhat heavy and less natural than «ihe ncheta»; the tomb-related alternative is better retained in a note.
  terminology: «Ndị odeakwụkwọ», «ndị Farisii», «ndị ihu abụọ», «ndị amụma», and «ndị ezi omume» are suitable Standard Igbo renderings in this register. «Ahụhụ dịrị unu» appropriately retains the prophetic judgment force of Οὐαί.
  issues:
  - severity: medium
    issue: «unu na-ewuru ndị amụma ili»
    rationale: This can mean ‘you build tombs for the prophets.’ The Greek has ‘you build the tombs of the prophets’; «unu na-ewu ili ndị amụma» is more direct and avoids the possible beneficiary sense of -ewuru.
  - severity: low
    issue: «ihe ncheta ili» in the main text
    rationale: The phrase is understandable, but it adds a tomb specification to μνημεῖα and is less idiomatic than «ihe ncheta». The Greek term can refer to tombs or memorials; retaining ‘memorials’ in the text and noting ‘tomb memorials’ preserves the lexical range and the contrast with τάφους.
  - severity: low
    issue: Footnote alternative does not clearly state the compact lexical alternative
    rationale: The note presently offers a longer phrase while explaining that ‘ili’ was added. A note offering «ili ncheta» directly and explaining the Greek range more clearly supports the revised main rendering.
  revised_text: “Ahụhụ dịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ, n’ihi na unu na-ewu ili ndị amụma, na-achọkwa ihe ncheta ndị ezi omume mma[a].”
  revised_footnotes:
