    text: A pụkwara ịsị, “ili ncheta.” Okwu Grik ahụ nwere ike ịpụta ihe ncheta ma ọ bụ ili e ji echeta mmadụ; ebe a, a sụgharịrị ya “ihe ncheta” iji kewaa ya na “ili” e ji sụgharịa okwu Grik ọzọ dị na mbụ n’amaokwu a.
    reason: lexical_alternative
  revision_rationale: The revision changes «na-ewuru ndị amụma ili» to «na-ewu ili ndị amụma» to match the Greek possessive construction without a possible ‘for the prophets’ implication. It renders μνημεῖα as «ihe ncheta» in the text, preserving its commemorative sense and its distinction from τάφους, while the footnote retains the legitimate tomb-memorial alternative.
