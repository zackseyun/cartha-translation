- from: “Ahụhụ dịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ, n’ihi na unu na-ewuru ndị amụma ili, na-achọkwa ihe ncheta ili ndị ezi omume mma[a].”
  to: “Ahụhụ dịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ, n’ihi na unu na-ewu ili ndị amụma, na-achọkwa ihe ncheta ndị ezi omume mma[a].”
  rationale: The revision changes «na-ewuru ndị amụma ili» to «na-ewu ili ndị amụma» to match the Greek possessive construction without a possible ‘for the prophets’ implication. It renders μνημεῖα as «ihe ncheta» in the text, preserving its commemorative sense and its distinction from τάφους, while the footnote retains the legitimate tomb-memorial alternative.
