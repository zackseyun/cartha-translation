  to: “Ahụhụ[a] dịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ! N’ihi na unu na-eripịa akụ ndị inyom di ha nwụrụ, ma na-ekpe ogologo ekpere n’okpuru ngọpụ; n’ihi nke a, unu ga-anata ikpe dị arọ karị.”
