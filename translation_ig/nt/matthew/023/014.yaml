review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal sense, but “iji kpuchie ihe unu na-eme” makes the pretext specifically conceal their actions, whereas προφάσει more broadly denotes acting under a pretext. “Ikpe ọmụma unu ga-aka njọ” is less natural and does not express λήψεσθε (“you will receive”) as directly as the Greek.
  naturalness: 'The proposed revisions use idiomatic Standard Igbo: “na-eripịa akụ” effectively conveys exploitative “devour [widows’] houses,” and “n’okpuru ngọpụ” renders the pretext construction without unnecessary interpretation. “Ikpe dị arọ karị” is clearer than “ikpe ọmụma ... ga-aka njọ.”'
  terminology: “Ndị odeakwụkwọ,” “ndị Farisii,” and “ndị ihu abụọ” are suitable. “Akụ ndị inyom di ha nwụrụ” retains the idiomatic wider estate/household sense of οἰκίας while avoiding an overly literal and potentially misleading reference to physical buildings. The textual note should match the English audit trail’s reference to early Coptic translations rather than qualifying them as only “some.”
  issues:
  - severity: medium
    issue: The pretext phrase is overly explicit.
    rationale: “Iji kpuchie ihe unu na-eme” adds a specific object—concealing what they do—not stated by προφάσει. “N’okpuru ngọpụ” preserves the Greek ambiguity and force.
  - severity: medium
    issue: The final judgment clause is semantically and stylistically weak.
    rationale: “Ikpe ọmụma” is not the most natural rendering here, and “ga-aka njọ” omits the explicit future reception in λήψεσθε. “Unu ga-anata ikpe dị arọ karị” directly and naturally renders the clause.
  - severity: low
    issue: Footnote narrows the Coptic manuscript evidence.
    rationale: The draft says “ụfọdụ nsụgharị Kọptik,” while the audit trail says “early Coptic translations” without that restriction.
  revised_text: “Ahụhụ[a] dịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ! N’ihi na unu na-eripịa akụ ndị inyom di ha nwụrụ, ma na-ekpe ogologo ekpere n’okpuru ngọpụ; n’ihi nke a, unu ga-anata ikpe dị arọ karị.”
