source:
  edition: robinson-pierpont-2005-byzantine
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κατεσθίετε τὰς οἰκίας τῶν χηρῶν, καὶ προφάσει μακρὰ προσευχόμενοι· διὰ τοῦτο λήψεσθε περισσότερον κρίμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: ig
  text: “Ahụhụ[a] dịrị unu, ndị odeakwụkwọ na ndị Farisii, ndị ihu abụọ! N’ihi na unu na-eripịa akụ ndị inyom di ha nwụrụ, ma na-ekpe ogologo ekpere n’okpuru ngọpụ; n’ihi nke a, unu ga-anata ikpe dị arọ karị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Amaokwu a adịghị n’ihe odide Grik ndị kacha ochie, gụnyere Codex Sinaiticus na Codex Vaticanus nke narị afọ nke anọ, nakwa na nsụgharị Kọptik oge mbụ. Ma ọ dị n’ọtụtụ ihe odide nke ọdịnala Baịzantium, nakwa na nsụgharị Latịn Ochie, Vulgate, na Syriac. O yikarịrị ka ndị odeakwụkwọ oge e mesịrị gbakwụnyere ya iji mee ka ebe a kwekọọ n’okwu yiri ya dị na Mak 12:40 na Luk 20:47. Ihe odide ndị nwere ya adịghịkwa otu n’ebe ha debere ya: ụfọdụ debere ya tupu amaokwu 13, ndị ọzọ debere ya mgbe amaokwu 13 gasịrị.'
    reason: textual_critical
lexical_decisions:
- source_word: κατεσθίετε
  choice: na-eripịa ihe onwunwe
  rationale: Okwu Grik a pụtara ‘iri chapụ’ n’ụzọ ihe atụ; ebe a ọ na-egosi iji aghụghọ napụ ndị inyom di ha nwụrụ ihe ha ji biri ma bibie ọnọdụ akụ na ụba ha.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: ihe onwunwe ndị inyom di ha nwụrụ
  rationale: Ọ bụ ezie na ‘ụlọ’ bụ ntụgharị nkịtị, n’ebe a ọ gbasara akụ na ihe niile nwanyị di ya nwụrụ nwere; ‘ihe onwunwe’ na-eme ka echiche ahụ doo onye Igbo nke oge a anya.
- source_word: προφάσει
  choice: iji kpuchie ihe unu na-eme
  rationale: Ọ na-egosi na ogologo ekpere ahụ bụ ihe e ji mee ngọpụ ma ọ bụ kpuchie ajọ ebumnobi, ọ bụghị nanị ihe ngosi n’èzí.
- source_word: μακρὰ προσευχόμενοι
  choice: na-ekpe ogologo ekpere
  rationale: Nke a na-edebe ihe oyiyi na usoro okwu Grik n’asụsụ Igbo dị mfe ma kwanye ùgwù.
- source_word: περισσότερον κρίμα
  choice: ikpe ọmụma unu ga-aka njọ
  rationale: N’ọnọdụ a, κρίμα bụ ikpe na-eweta ntaramahụhụ, ebe περισσότερον na-egosi na ikpe ahụ ga-adị arọ karịa; okwu a na-echekwa njikọ dị n’etiti ikpe ọmụma na ịdị njọ nke ntaramahụhụ.
theological_decisions:
- issue: Ma ‘ikpe’ a ọ bụ naanị mkpebi ikpe ka ọ bụ ntaramahụhụ ikpe ahụ na-eweta
  choice: ikpe ọmụma unu ga-aka njọ
  alternative: unu ga-anata ntaramahụhụ ka njọ
  rationale: Nhọrọ a na-edebe obosara nke κρίμα—mkpebi ikpe na nsonaazụ ntaramahụhụ ya—n’enweghị ịkpọchi ya naanị n’otu akụkụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ndị odeakwụkwọ’ maka γραμματεῖς dịka aha òtù ndị ọkachamara n’Iwu, ‘ndị ihu abụọ’ maka ὑποκριταί, ma zere okwu ụka nke nwere ike ibubata nkọwa otu denominashọn.
