revisions:
- from: Onye ọ bụla ji eluigwe ṅụọ iyi na-eji ocheeze Chineke na Onye ahụ nọkwasịrị n’elu ya[a] aṅụ iyi.
  to: Onye ọ bụla ji eluigwe ṅụọ iyi ji ocheeze Chineke na onye nọ ọdụ n’elu ya[a] aṅụ iyi.
  rationale: The revision preserves the generic force of the articular aorist participle and the oath idiom while using ‘onye nọ ọdụ’ for the one presently seated on the throne. It also avoids capitalizing the circumlocution as though it were an explicit divine name, while its referent remains clear from ‘ocheeze Chineke.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:42:22Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the generic oath saying, the oath-formula sense of ἐν ('ji'), 'eluigwe,' God's throne, and the person seated on the throne. However, 'nọkwasịrị' is less direct for the present participle καθημένῳ than the ordinary continuous expression 'nọ ọdụ'; the revised text uses the latter.
  naturalness: The revised wording is idiomatic Standard Igbo. Repeating 'ji' after the first clause cleanly expresses the Greek consequence without an awkward instrumental chain. Lowercase 'onye' is appropriate because the Greek uses an articular participle/circumlocution, not a proper name or title.
  terminology: ‘Eluigwe,’ ‘ocheeze Chineke,’ and ‘aṅụ iyi’ are accurate, clear, and suitably elevated. The circumlocution for God is retained without adding doctrinal interpretation.
  issues:
  - severity: low
    issue: The main text uses ‘Onye ahụ nọkwasịrị’ for τῷ καθημένῳ.
    rationale: This can be understood as ‘the one who has sat down/is seated,’ but ‘onye nọ ọdụ’ more naturally reflects the Greek present participle, ‘the one sitting/seated.’
  - severity: low
    issue: The footnote gives ‘Onye ahụ nọ ọdụ n’elu ya’ as an alternative although it is the more straightforward rendering.
    rationale: Once the main text is made more idiomatic, the lexical alternative can retain ‘nọkwasịrị.’
  revised_text: Onye ọ bụla ji eluigwe ṅụọ iyi ji ocheeze Chineke na onye nọ ọdụ n’elu ya[a] aṅụ iyi.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “onye nọkwasịrị n’elu ya.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the generic force of the articular aorist participle and the oath idiom while using ‘onye nọ ọdụ’ for the one presently seated on the throne. It also avoids capitalizing the circumlocution as though it were an explicit divine name, while its referent remains clear from ‘ocheeze Chineke.’
