  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: ig
  text: Onye ọ bụla ji eluigwe ṅụọ iyi ji ocheeze Chineke na onye nọ ọdụ n’elu ya[a] aṅụ iyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye nọkwasịrị n’elu ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: Onye ọ bụla ... ṅụọ iyi
  rationale: Nkebi participle a nwere article ma dị n’ụdị aorist na-arụ ọrụ dịka okwu izugbe; n’Igbo, ‘Onye ọ bụla ... ṅụọ iyi’ na-egosi ụkpụrụ gbasara onye ọ bụla, ọ bụghị naanị ihe mere n’oge gara aga.
- source_word: ἐν
  choice: ji
  rationale: N’okwu iyi, ἐν tinyere dative na-egosi ihe e ji aṅụ iyi. ‘Ji’ bụ ụzọ Igbo si ekwu nke a nke ọma, ma e jiri otu nghọta ahụ mee ihe n’ebe ἐν ugboro atọ pụtara.
- source_word: οὐρανῷ
  choice: eluigwe
  rationale: N’ọnọdụ okpukpe ndị Juu a, okwu ahụ na-ezo aka n’eluigwe, ọ bụghị naanị mbara igwe, karịchaa ebe e jikọtara ya ozugbo na ocheeze Chineke.
- source_word: ὀμνύει
  choice: na-eji ... aṅụ iyi
  rationale: Present indicative a na-ekwupụta eziokwu izugbe; usoro ‘na-eji ... aṅụ iyi’ bụ Igbo doro anya ma dị ugbu a.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: ocheeze Chineke
  rationale: Nhọrọ a na-edobe njikọ genitive ahụ ma na-enwe ụda dị ugwu ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: τῷ καθημένῳ
  choice: Onye ahụ nọkwasịrị
  rationale: κάθημαι na-egosi onye nọ n’oche ahụ. ‘Onye ahụ nọkwasịrị’ na-edobe nkọwa ahụ n’enweghị iji ‘Chineke’ dochie ya ozugbo.
- source_word: ἐπάνω αὐτοῦ
  choice: n’elu ya
  rationale: N’ọnọdụ ocheeze a, okwu ahụ na-ezo aka n’ịnọ n’elu ocheeze ahụ, ọ bụghị ịnọ n’ebe dị elu ma kewapụ onwe ya na ya.
theological_decisions:
- issue: Onye ‘Onye ahụ nọkwasịrị n’elu ya’ na-ezo aka na ya
  choice: E debere ya dịka okwu nsọ na-ezo aka na Chineke nọ n’ocheeze n’eluigwe
  alternative: Ikwu naanị ‘onye nọ n’ebe ahụ’ n’enweghị ime ka onye a na-ekwu maka ya doo anya
  rationale: ‘Ocheeze Chineke’ nke dị ya nso na-eme ka onye a na-ezo aka na ya doo anya, ma echiche amaokwu ahụ bụ na ịṅụ iyi site n’eluigwe na-emetụtakwa Chineke n’onwe ya. Nsụgharị ahụ edochighị nkọwa a na aha ‘Chineke’ n’isiokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Ṅụọ/aṅụ iyi’ bụ okwu nkịtị maka ị swear; ‘ocheeze’ na-edobe ihe oyiyi eze dị n’ederede Grik. E tinyere akara [a] kpọmkwem n’isiokwu.
