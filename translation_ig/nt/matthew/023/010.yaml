review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the passive sense of κληθῆτε, the title sense of καθηγηταί/καθηγητής, the reason clause, the emphasis that there is only one, and the title “the Messiah.” “Ndị nduzi / onye nduzi” appropriately preserves a distinction from “teacher” in the surrounding context.
  naturalness: “A kpọkwala unu ndị nduzi” can be understood, but its impersonal imperative construction is less explicit and can momentarily sound like an instruction about whom to call. “Unu ekwela ka a kpọọ unu …” is a clear, natural Standard Igbo way to express the Greek passive prohibition.
  terminology: “Nduzi” is a suitable rendering for καθηγητής in this context. “Mezaịa” is retained as the translation of Χριστός, and the lexical-alternative footnote for “Kraịst” is correctly anchored to it. Lowercasing “onye nduzi” avoids making the common noun into an additional formal title not marked as such in the Greek, while the identification “ya bụ Mezaịa” supplies the referent.
  issues:
  - severity: low
    issue: The passive prohibition is not maximally explicit in the opening clause.
    rationale: The Greek says “do not be called.” Recasting it as “Unu ekwela ka a kpọọ unu” makes the passive/title-receiving sense unambiguous in idiomatic Igbo.
  - severity: low
    issue: Capitalization of “Onye Nduzi” may imply a fixed formal title beyond the Greek wording.
    rationale: καθηγητής is a common noun here; the following “the Messiah” identifies the one guide/instructor. Lowercase is more textually restrained.
  revised_text: Unu ekwela ka a kpọọ unu ndị nduzi, n’ihi na unu nwere naanị otu onye nduzi, ya bụ Mezaịa[a].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.”
    reason: lexical_alternative
  revision_rationale: The revision clarifies the Greek passive imperative with a natural Standard Igbo construction and removes unnecessary title-style capitalization. It otherwise preserves the draft’s accurate rendering of the unique guide/instructor and of Χριστός as “Mezaịa.”
