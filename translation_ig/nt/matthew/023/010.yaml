- from: A kpọkwala unu ndị nduzi, n’ihi na unu nwere naanị otu Onye Nduzi, ya bụ Mezaịa[a].
  to: Unu ekwela ka a kpọọ unu ndị nduzi, n’ihi na unu nwere naanị otu onye nduzi, ya bụ Mezaịa[a].
  rationale: The revision clarifies the Greek passive imperative with a natural Standard Igbo construction and removes unnecessary title-style capitalization. It otherwise preserves the draft’s accurate rendering of the unique guide/instructor and of Χριστός as “Mezaịa.”
