id: MAT.23.10
reference: Matthew 23:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: ig
  text: Unu ekwela ka a kpọọ unu ndị nduzi, n’ihi na unu nwere naanị otu onye nduzi, ya bụ Mezaịa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: A … kwala
  rationale: A na-etinye njikọ ahụ n’usoro mmachibido iwu nke ngwaa Igbo; ebe amaokwu a guzoro naanị ya, ọ dịghị mkpa ibido ya na “Ọzọkwa.”
- source_word: κληθῆτε
  choice: kpọkwala unu
  rationale: Ụdị a na-egosi na ndị ọzọ na-akpọ ha aha ma ọ bụ utu aha, dịka passive Grik si dị.
- source_word: καθηγηταί / καθηγητής
  choice: ndị nduzi / Onye Nduzi
  rationale: Καθηγητής bụ onye na-edu ma na-akụziri ndị ọzọ ụzọ. “Onye nduzi” na-echekwa echiche iduzi ma ghara ime ka okwu a bụrụ otu ihe kpọmkwem na διδάσκαλος (“onye nkuzi”) nke dị n’amaokwu ndị dị nso.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Njikọ a na-eweta ihe kpatara mmachibido iwu ahụ.
- source_word: ὑμῶν ἐστιν εἷς
  choice: unu nwere naanị otu Onye Nduzi
  rationale: Nke a bụ usoro Igbo doro anya nke na-echekwa nkwusi ike Grik na otu onye ahụ, ọ bụ ezie na Grik n’onwe ya dị nso na “Onye Nduzi unu bụ otu.”
- source_word: ὁ χριστός
  choice: Mezaịa
  rationale: N’ebe a Χριστός bụ utu aha e tere mmanụ ahụ, ya mere “Mezaịa” na-egosipụta ihe ọ pụtara na ọnọdụ ndị Juu karịa iji “Kraịst” dịka aha nkịtị.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mezaịa
  alternative: Kraịst
  rationale: Artikụl Grik na ọnọdụ ahịrịokwu a na-egosi na okwu ahụ na-arụ ọrụ dịka utu aha. “Mezaịa” na-echekwa echiche nke onye e tere mmanụ, ebe e debere “Kraịst” n’ala peeji dịka nsụgharị ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E dere “Onye Nduzi” n’ukwu mkpụrụedemede n’ebe ọ na-ezo aka kpọmkwem n’ebe Mezaịa nọ, ma “ndị nduzi” bụ utu aha a machibidoro ndị na-eso ụzọ ịnata.
