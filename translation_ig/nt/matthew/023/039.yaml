revisions:
- from: N’ihi na ana m agwa unu[a], site ugbu a gaa n’ihu, unu agaghị ahụkwa m ma ọlị ruo mgbe unu ga-asị[b], ‘Onye a gọziri agọzi ka ọ bụ, bụ onye na-abịa n’aha Onyenwe anyị.’
  to: N’ihi na ana m agwa unu[a], site ugbu a gaa n’ihu, unu agaghị ahụ m ma ọlị ruo mgbe unu ga-asị[b], ‘A gọziri agọzi onye na-abịa n’aha Onyenwe anyị.’
  rationale: Removed -kwa to avoid adding an unsupported ‘again/also’ nuance. Recast the Psalm quotation as the natural Igbo blessing “A gọziri agọzi onye na-abịa …,” removing the source-absent demonstrative and preserving the text’s ambiguity about the future occasion of the acclamation.
  reviewer_model: gpt-5.6-terra
