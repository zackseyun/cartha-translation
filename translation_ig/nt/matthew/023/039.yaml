id: MAT.23.39
reference: Matthew 23:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: ig
  text: N’ihi na ana m agwa unu[a], site ugbu a gaa n’ihu, unu agaghị ahụ m ma ọlị ruo mgbe unu ga-asị[b], ‘A gọziri agọzi onye na-abịa n’aha Onyenwe anyị.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịhazi ya dịka, “N’ihi na ana m agwa unu, unu agaghị ahụ m ma ọlị site ugbu a ruo mgbe unu ga-asị.” N’asụsụ Grik, e ji οὐ μή, bụ nkwụpụ siri ike.
    reason: lexical_alternative
  - marker: b
    text: Nke a bụ nhota ma ọ bụ ntụaka sitere n’Abụ Ọma 118:26.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: N’ihi na ana m agwa unu
  rationale: “Ana m agwa unu” bụ ụzọ Igbo dị ndụ e si kwuo usoro okwu a na-agwa ndị mmadụ ozugbo; “N’ihi na” na-edobe ọrụ nkọwa nke γάρ, nke jikọtara amaokwu a na ihe bu ya ụzọ.
- source_word: οὐ μή
  choice: agaghị ... ma ọlị
  rationale: Njikọ “agaghị” na “ma ọlị” na-egosipụta nkwusi ike nke nkwụpụ οὐ μή n’Igbo doro anya, n’enweghị ime ka ọ bụrụ ‘mgbe ọ bụla’ ma ọ bụ idozi oge ihe a ga-eme.
- source_word: ἴδητε
  choice: ahụkwa m
  rationale: “Ịhụ” bụ ntụgharị kwụ ọtọ na nke nkịtị nke ὁράω; -kwa na-ejikọta ya n’echiche nke ‘site ugbu a gaa n’ihu, unu agaghị ahụ m ọzọ.’
- source_word: ἀπ’ ἄρτι
  choice: site ugbu a gaa n’ihu
  rationale: Nkebiokwu a na-egosi oge na-amalite ugbu a ma na-aga n’ihu, dịka ἀπ’ ἄρτι si dị.
- source_word: ἕως ἂν εἴπητε
  choice: ruo mgbe unu ga-asị
  rationale: “Ruo mgbe ... ga-asị” na-egosi njedebe dị n’ọdịnihu nke ἕως ἄν tinyere subjunctive, na-akọwaghị kpọmkwem ihe omume ma ọ bụ oge ahụ.
- source_word: Εὐλογημένος
  choice: Onye a gọziri agọzi ka ọ bụ
  rationale: Usoro a na-ebute ‘onye’ n’ihu ma na-egosipụta nkwupụta ngọzi nke okwu Hibru/Greek e hotara, n’Igbo dị ugwu ma doo anya.
- source_word: ὁ ἐρχόμενος
  choice: onye na-abịa
  rationale: Nke a na-edobe articular participle dị ka onye a na-akọwa site n’omume ya, n’etinyeghị n’ime ya echiche pụrụ iche na ọ bụ aha nsọpụrụ.
- source_word: ἐν ὀνόματι κυρίου
  choice: n’aha Onyenwe anyị
  rationale: “N’aha” na-edobe usoro ἐν ὀνόματι, ebe “Onyenwe anyị” bụ okwu Igbo a na-ejikarị akọwa κύριος n’ụdị nsọpụrụ na nke Akwụkwọ Nsọ.
theological_decisions:
- issue: Ike nke nkwupụta Jizọs banyere ịhụ ya ọzọ na ikwupụta ngọzi ahụ
  choice: Edobere ya dịka nkwupụta siri ike na ha agaghị ahụ ya site ugbu a ruo mgbe ha ga-ekwu okwu ngọzi ahụ, n’akọwaghị kpọmkwem mgbe ma ọ bụ ihe omume nke ga-emezu ya.
  alternative: Ịkọwa ya kpọmkwem dịka mbata mmeri ya na Jerusalem, ọbịbịa nke ugboro abụọ, ma ọ bụ nchegharị Izrel n’ọdịnihu.
  rationale: Greek kwuru njedebe ahụ site na “ruo mgbe unu ga-asị,” ma o kwughị kpọmkwem ihe omume akụkọ ihe mere eme ma ọ bụ nke ọgwụgwụ oge e bu n’obi. Ya mere, ntụgharị ahụ na-ahapụ esemokwu nkọwa ahụ ka ọ dị.
- issue: Ma ὁ ἐρχόμενος bụ aha Mesaya kpọmkwem
  choice: “onye na-abịa”
  alternative: “Onye ahụ Na-abịa” dịka aha pụrụ iche
  rationale: Ọ bụ ezie na okwu ahụ nwere ike inwe ụda Mesaya n’ọnọdụ ya, amaokwu a bụ nhota Abụ Ọma 118:26, articular participle n’onwe ya anaghị amanye ka e depụta ya dịka aha pụrụ iche.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E jiri “unu” mee ka plural nke ὑμῖν/ἴδητε/εἴπητε pụta ìhè. E debere nkwusi ike nke οὐ μή site na “agaghị ... ma ọlị,” ma zere ịkọwa kpọmkwem oge ma ọ bụ ụdị mmezu nke okwu ahụ.
