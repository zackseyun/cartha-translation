  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: ig
  text: Ọzọkwa, ‘Onye ọ bụla jiri ebe ịchụàjà ṅụọ iyi, iyi ahụ abụghị ihe ọ bụla[b]; ma onye ọ bụla jiri onyinye[a] dị n’elu ya ṅụọ iyi nọ n’okpuru ibu ọrụ.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe e ji achụ àjà.” Okwu Grik a nwere ike ịpụta onyinye e wetara nye Chineke n’ụlọ nsọ.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, dị ka ozizi Jizọs na-akatọ si kwuo, iyi e ji ebe ịchụàjà ṅụọ “abụghị ihe ọ bụla,” ma a na-ewere iyi e ji onyinye dị n’elu ya ṅụọ dị ka nke na-ejide onye ṅụrụ ya.
    reason: cultural_note
lexical_decisions:
- source_word: καί
  choice: Ọzọkwa
  rationale: Ọ na-aga n’ihu n’usoro ihe ndị e kwuru nke Jizọs na-akatọ; “Ọzọkwa” na-egosi njikọ ahụ nke ọma n’Igbo.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: Onye ọ bụla ... ṅụọ iyi / ma onye ọ bụla ... ṅụọ iyi
  rationale: Usoro ὅς + ἄν na ngwaa subjunctive na-egosi ọnọdụ metụtara onye ọ bụla; nsụgharị a bụ Igbo e ji eme ihe ma na-edobe echiche ahụ n’ozuzu ya.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: were ebe ịchụàjà ṅụọ iyi
  rationale: N’usoro okwu iyi a, ἐν na-egosi ihe e ji ṅụọ iyi, ọ bụghị ịnọ n’ime ebe ịchụàjà. “Were ... ṅụọ iyi” bụ ụzọ doro anya e si kwuo ya n’Igbo.
- source_word: θυσιαστήριον
  choice: ebe ịchụàjà
  rationale: Nke a bụ okwu Igbo ziri ezi ma bụrụkwa nke a maara nke ọma maka ebe a na-achụ àjà n’ụlọ nsọ.
- source_word: οὐδέν ἐστιν
  choice: ọ bụ ihe efu
  rationale: Ọ na-edobe mkpụmkpụ okwu Grik ma na-egosi nkwupụta ha na iyi dị otú ahụ adịghị mkpa ma ọ bụ adịghị ejide onye ṅụrụ ya.
- source_word: ἐν τῷ δώρῳ
  choice: were onyinye ṅụọ iyi
  rationale: δῶρον bụ onyinye e nyere Chineke n’ụlọ nsọ; “onyinye” bụ ihe okwu ahụ pụtara kpọmkwem, ebe ihe gbara ya gburugburu na-egosi na ọ bụ ihe a na-achụ n’ebe ịchụàjà.
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: dị n’elu ya
  rationale: Ọ na-egosi na onyinye ahụ dị n’elu ebe ịchụàjà ma na-eme ka ihe nnọchiaha “ya” na-ezo aka na ya doo anya.
- source_word: ὀφείλει
  choice: nọ n’okpuru ibu ọrụ
  rationale: N’okwu banyere iyi, ὀφείλω na-egosi na iwu ma ọ bụ ọrụ omume ejidela onye ahụ. Nhọrọ a anaghị agbakwụnye kpọmkwem ihe ọ ga-eme, n’ihi na Grik ekwughị ya.
theological_decisions:
- issue: Ihe a hapụrụ ekwughị nke onye ahụ ji dị ka ọrụ n’okwu iyi
  choice: nọ n’okpuru ibu ọrụ
  alternative: iyi ahụ ejidela ya / ọ ga-emezurịrị iyi ya
  rationale: Grik hapụrụ ihe ọrụ ahụ metụtara ekwughị. Isi okwu na-edobe nke a kama ịgbakwunye na ọ ga-emezu iyi ya, ọ bụ ezie na ihe ndị gbara amaokwu ahụ gburugburu na-egosi nke ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta mee ihe. A họọrọ “were ... ṅụọ iyi” maka usoro iyi a na-asụ n’Igbo, ma e debere mkpụmkpụ na esemokwu dị n’etiti “ọ bụ ihe efu” na “nọ n’okpuru ibu ọrụ.” E tinyere akara [a] n’akụkụ “onyinye,” ebe nkọwa ya metụtara δῶρον, ma tinye [b] n’akụkụ “ihe efu,” ebe nkọwa omenala ahụ metụtara okwu ahụ.
