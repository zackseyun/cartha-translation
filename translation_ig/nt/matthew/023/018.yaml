revisions:
- from: Ọzọkwa, ‘Onye ọ bụla were ebe ịchụàjà ṅụọ iyi, ọ bụ ihe efu[b]; ma onye ọ bụla were onyinye[a] dị n’elu ya ṅụọ iyi nọ n’okpuru ibu ọrụ.’
  to: Ọzọkwa, ‘Onye ọ bụla jiri ebe ịchụàjà ṅụọ iyi, iyi ahụ abụghị ihe ọ bụla[b]; ma onye ọ bụla jiri onyinye[a] dị n’elu ya ṅụọ iyi nọ n’okpuru ibu ọrụ.’
  rationale: The revision uses the customary Igbo instrumental expression “jiri ... ṅụọ iyi” and identifies the implied subject of “abụghị ihe ọ bụla” as the oath. This preserves the source’s intended casuistic contrast and prevents an unintended reading about the altar itself. No doctrinal interpretation has been added, and the obligation remains unspecified, as in Greek.
  reviewer_model: gpt-5.6-terra
