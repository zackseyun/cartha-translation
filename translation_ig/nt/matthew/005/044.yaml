review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the contrastive first-person declaration, the two plural imperatives, “your enemies,” and prayer for those persecuting the hearers. “Maka” is an appropriate natural rendering of ὑπέρ with the genitive in this context. The only needed change is grammatical: “na-ekpekwanụ ekpere” has progressive-form wording rather than a clear plural imperative.'
  naturalness: “Hụnụ ndị iro unu n’anya” is idiomatic Standard Igbo. Replacing “na-ekpekwanụ ekpere” with “kpeekwanụ ekpere” gives the second coordinated command a natural, explicit plural imperative, matching “Hụnụ.”
  terminology: “Ndị iro” and “ndị na-akpagbu” are suitable, clear terms for ἐχθροί and διώκοντες. No doctrinal expansion is introduced. The alternative footnote retains the “on behalf of” sense without adding a specified content to the prayer.
  issues:
