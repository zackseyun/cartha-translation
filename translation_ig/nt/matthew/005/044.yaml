  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: ig
  text: 'Ma ana m asị unu: Hụnụ ndị iro unu n’anya, kpeekwanụ ekpere maka ndị na-akpagbu unu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “kpeekwanụ ekpere n’aha ndị na-akpagbu unu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ma ana m asị unu
  rationale: “Ma” na-egosipụta ọdịiche δέ wetara, ebe “ana m asị unu” na-edobe nkwusi ike nke ἐγώ ma na-ada ka Igbo nkịtị dị ùgwù.
- source_word: ἀγαπᾶτε
  choice: Hụnụ ... n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu iwu nke ịmá mmadụ n’anya; ọ naghị agbakwụnye nkọwa banyere ụdị mmetụta ma ọ bụ omume ịhụnanya ahụ ga-abụ.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: ndị iro unu
  rationale: Ọ bụ nsụgharị kpọmkwem ma doo anya nke na-edobe mmekọrịta iro dị na ἐχθρός.
- source_word: προσεύχεσθε
  choice: na-ekpekwanụ ekpere
  rationale: Ọ na-enye iwu ahụ n’ụzọ Igbo sitere n’okike; njikọ “-kwa-” na-egosikwa na nke a bụ iwu nke abụọ e tinyere na nke mbụ.
- source_word: ὑπὲρ
  choice: maka
  rationale: N’ebe a, “maka” na-egosi ikpe ekpere n’ihi ọdịmma mmadụ ma ọ bụ n’aha ya, n’enweghị ịgbatị ihe ederede kwuru.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: ndị na-akpagbu unu
  rationale: Ọ na-edobe ọdịdị omume na-aga n’ihu nke participle dị ugbu a ma bụrụkwa okwu Igbo doro anya maka mmegide na mkpagbu.
theological_decisions:
- issue: Ókè iwu ahụ gbasara ndị iro
  choice: 'E nyere iwu abụọ ahụ kpọmkwem: ịhụ ndị iro n’anya na ikpe ekpere maka ndị na-akpagbu mmadụ.'
  alternative: Ịkọwa ịhụnanya ahụ dịka naanị ime ihe ọma, ma ọ bụ ịkọwapụta na ekpere ahụ ga-abụ maka ngọzi, nchegharị, ma ọ bụ nzọpụta ha.
  rationale: Amaokwu ahụ ekwughị kpọmkwem ụdị mmetụta, omume, ma ọ bụ ihe a ga-arịọ n’ekpere. Nsụgharị ahụ na-edobe ike na mgbagwoju anya nke iwu ahụ n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. E ji ụdị ọtụtụ mmadụ “unu” na iwu “Hụnụ / na-ekpekwanụ” kwekọọ na okwu Grik ahụ. Akara [a] dị n’isiokwu ma na-ezo aka n’ụzọ ọzọ a pụrụ isi ghọta ὑπέρ.
