    issue: The second command is not expressed with a clear imperative form.
    rationale: Greek προσεύχεσθε is a present imperative, coordinated with ἀγαπᾶτε. “Na-ekpekwanụ ekpere” can be read as progressive (“are also praying”) rather than as the required command. “Kpeekwanụ ekpere” is the natural plural imperative.
