  rationale: The revision changes only the verbal form of the second clause so that it unambiguously functions as a plural imperative in Standard Igbo. The footnote is correspondingly updated to use the same imperative form. The verse’s scope and its deliberate lack of specification concerning the content of the prayer are preserved.
