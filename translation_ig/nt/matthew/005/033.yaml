  to: Ọzọkwa, unu anụla na a gwara ndị oge ochie, sị, “Aṅụla iyi ụgha[a], kama mezuo iyi ndị ị ṅụrụ nye Onyenweanyị[b].”
  rationale: 'The revision makes only safe idiomatic and audit-trail-alignment changes: it clarifies the historical referent of τοῖς ἀρχαίοις, uses the conventional Igbo biblical title for κύριος, and changes the footnote alternative so that it reflects the Greek ''Lord'' and the English audit''s ''the LORD'' rather than supplying a transliterated divine name. The source''s ambiguity concerning false swearing versus oath violation remains preserved in footnote a.'
