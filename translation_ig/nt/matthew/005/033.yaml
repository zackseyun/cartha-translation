  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: ig
  text: Ọzọkwa, unu anụla na a gwara ndị oge ochie, sị, “Aṅụla iyi ụgha[a], kama mezuo iyi ndị ị ṅụrụ nye Onyenweanyị[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Emebila iyi”; ngwaa Grik ahụ nwere ike ịpụta ịṅụ iyi ụgha ma ọ bụ imebi iyi.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nye ONYENWEANYỊ,” nke na-egosi aha Chineke nke ọgbụgba ndụ n’ndabere Akwụkwọ Nsọ Agba Ochie.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: Ọzọkwa
  rationale: Ọ na-egosi na Jizọs na-agbakwụnye ihe atụ ọzọ n’usoro okwu ya; “Ọzọkwa” bụ Igbo doro anya ma dịkwa n’usoro okwu a.
- source_word: ἠκούσατε
  choice: unu anụla
  rationale: Ọ na-edobe onye nke abụọ n’ụbara ma na-egosi na ihe ha nụrụ ka metụtara ha ugbu a.
- source_word: ἐρρέθη τοῖς ἀρχαίοις
  choice: a gwara ndị mgbe ochie
  rationale: Ọ na-echekwa ụdị okwu a na-ekwughị kpọmkwem onye kwuru ya, ma na-ezo aka n’ọgbọ ndị gara aga, ọ bụghị naanị ndị agadi.
- source_word: Οὐκ ἐπιορκήσεις
  choice: Aṅụla iyi ụgha
  rationale: Nke a na-egosipụta isi echiche nke ịṅụ iyi n’ụgha, ma nkọwa ala peeji na-echekwa nghọta ọzọ nke imebi iyi.
- source_word: ἀποδώσεις
  choice: mezuo
  rationale: N’ebe a, okwu ahụ pụtara imezu ihe mmadụ ji iyi kwe nkwa, ọ bụghị nanị ịkwụ ụgwọ.
- source_word: τῷ κυρίῳ
  choice: nye Onyenwe anyị
  rationale: “Onyenwe anyị” bụ ụzọ Igbo a na-ejikarị akọwa κύριος mgbe ọ na-ezo aka na Chineke.
- source_word: τοὺς ὅρκους σου
  choice: iyi ndị ị ṅụrụ
  rationale: Ụdị a bụ okwu Igbo sitere n’okike, na-echekwa ihe ὅρκους pụtara nakwa onye nke abụọ n’otu nke σου.
theological_decisions:
- issue: Otú e si sụgharịta κύριος n’okwu na-atụ aka n’Akwụkwọ Nsọ Izrel
  choice: Onyenwe anyị
  alternative: Yahweh
  rationale: Ihe odide Grik nwere κυρίῳ, ya mere a hapụrụ ya dị ka “Onyenwe anyị”; ma n’ihi ndabere okwu a n’Akwụkwọ Nsọ Agba Ochie, nkọwa ala peeji na-egosi na aha ọgbụgba ndụ Chineke nwere ike ịdị n’azụ ya.
- issue: Oke ihe ἐπιορκέω pụtara
  choice: ịṅụ iyi ụgha
  alternative: imebi iyi
  rationale: Ngwaa ahụ nwere ike ịpụta ịṅụ iyi ụgha ma ọ bụ ịghara imezu iyi. E tinyere nke mbụ n’ahịrịokwu, ebe a na-echekwa nke ọzọ na nkọwa ala peeji n’enweghị ime ka ọ bụrụ naanị okwu iwu ụlọikpe.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. “Unu” na-edobe ọtụtụ ndị a na-agwa okwu na ἠκούσατε, ebe “ị” na-edobe otu onye n’iwu e hotara na σου. E debere mgbagwoju pụtara nke ἐπιορκέω na njikọ κύριος na aha Chineke site na nkọwa ala peeji.
