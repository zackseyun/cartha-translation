review_pass:
  verdict: revise
  source_fidelity: The clause order, causal relation, present-tense possession, and Matthean expression for the kingdom are retained. However, “ndị dara ogbenye” can suggest people who have become impoverished, whereas οἱ πτωχοί simply identifies “the poor”; “ndị ogbenye” is more direct and source-faithful.
  naturalness: “Ngọzi na-adịrị” and “alaeze eluigwe” are natural, dignified Standard Igbo biblical register. Replacing “ndị dara ogbenye” with “ndị ogbenye” improves idiomatic precision without resolving the deliberately open expression “in spirit.”
  terminology: “mmụọ” appropriately avoids specifying the Holy Spirit; “alaeze eluigwe” is established terminology for βασιλεία τῶν οὐρανῶν. The revised note on Μακάριοι supplies idiomatic alternatives without implying that the word means mere subjective happiness.
  issues:
  - severity: medium
    issue: “ndị dara ogbenye” over-specifies πτωχοί
    rationale: The construction can imply those who fell into poverty or were made poor. The Greek substantival adjective denotes poor people without expressing such a change of state. “ndị ogbenye” preserves the source more exactly.
  - severity: low
    issue: Footnote a's proposed alternative “Ọ dị mma n'ezie nye” is not a clear equivalent for Μακάριοι
    rationale: It sounds like a general evaluative statement rather than a beatitude. More idiomatic alternatives such as “Ndị a gọziri agọzi” or “Ndị aṅụrị na” better explain the lexical range, while the note should retain the warning against reducing the term to an emotion.
  revised_text: Ngọzi na-adịrị ndị ogbenye n'ime mmụọ[a][b], n'ihi na alaeze eluigwe[c] bụ nke ha.
