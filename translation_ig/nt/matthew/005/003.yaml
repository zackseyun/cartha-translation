  to: Ngọzi na-adịrị ndị ogbenye n'ime mmụọ[a][b], n'ihi na alaeze eluigwe[c] bụ nke ha.
  rationale: The revision removes the unintended change-of-state nuance in “ndị dara ogbenye,” while preserving the compact and theologically open wording of τῷ πνεύματι. It also improves the lexical footnote for Μακάριοι and states accurately that the Greek form of “heavens” is plural, without forcing an unnatural plural into the Igbo main text. Footnote markers remain attached to the terms they explain.
