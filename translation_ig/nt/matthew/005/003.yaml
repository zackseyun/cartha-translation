  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: ig
  text: Ngọzi na-adịrị ndị ogbenye n'ime mmụọ[a][b], n'ihi na alaeze eluigwe[c] bụ nke ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘Ndị a gọziri agọzi’ ma ọ bụ ‘Ndị aṅụrị na.’ Okwu Grik a na-egosi ọnọdụ ihu ọma Chineke nke mmadụ pụrụ ile anya dị ka nke a na-achọsi ike, ọ bụghị naanị mmetụta obi ụtọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta ‘ndị ogbenye n'ime mmụọ’ dịka ‘ndị ogbenye n'ụzọ ime mmụọ’ ma ọ bụ ‘ndị ghọtara mkpa ime mmụọ ha.’ Nsụgharị a debere usoro okwu Grik ahụ n'emechighị nkọwa ya.
    reason: alternative_reading
  - marker: c
    text: N'ụzọ nkịtị, Grik sịrị ‘alaeze nke eluigwe’ n’ụdị ọtụtụ. Nke a bụ usoro okwu Matiu ji eme ihe mgbe niile, nke a na-asụgharịkarị ‘alaeze eluigwe.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Ngọzi na-adịrị
  rationale: Nke a na-egosi ọnọdụ nke ihu ọma Chineke na nkwado ya, ọ bụghị naanị mmetụta obi ụtọ. Ọ bụkwa okwu Igbo doro anya ma dị ùgwù n'usoro ngọzi ndị a.
- source_word: οἱ πτωχοὶ
  choice: ndị dara ogbenye
  rationale: Ọ na-edobe echiche nke ịda ogbenye na ụkọ dị n'okwu Grik, ma na-arụ ọrụ dị ka aha otu ndị mmadụ n'Igbo.
- source_word: τῷ πνεύματι
  choice: n'ime mmụọ
  rationale: Ọ na-edobe okwu Grik n'ụzọ dị mkpirikpi ma hapụ ihe ọ pụtara ka ọ ghara ịbụ naanị otu nkọwa; ọ naghị eme ka ‘mmụọ’ bụrụ Mmụọ Nsọ n'amaghị ama.
- source_word: ὅτι
  choice: n'ihi na
  rationale: Ọ na-egosi ihe mere e ji kwuo na ngọzi na-adịrị ha, n'Igbo nke oge a doro anya.
- source_word: αὐτῶν ἐστιν
  choice: bụ nke ha
  rationale: Ọ na-edobe oge dị ugbu a nke ngwaa Grik ma gosipụta na alaeze ahụ bụ nke ndị a.
- source_word: ἡ βασιλεία
  choice: alaeze
  rationale: ‘Alaeze’ bụ okwu a maara nke ọma ma nwee ike ịgụnye ma ọchịchị eze ma ógbè ọchịchị ya.
- source_word: τῶν οὐρανῶν
  choice: eluigwe
  rationale: Ọ bụ ụzọ Igbo si ekwu okwu a n'ụzọ eke; ọ na-anọchi anya ọtụtụ ‘eluigwe’ dị n'ụdị Grik n'enweghị ntụgharị siri ike na-adịghị eke.
theological_decisions:
- issue: Ihe ‘ndị dara ogbenye n'ime mmụọ’ pụtara
  choice: E debere okwu ahụ dịka ‘ndị dara ogbenye n'ime mmụọ.’
  alternative: ‘ndị dara ogbenye n'ụzọ ime mmụọ’ ma ọ bụ ‘ndị ghọtara mkpa ime mmụọ ha’
  rationale: Okwu Grik nwere oghere nkọwa bara ụba. Ịkọwa ya n'ụzọ sara mbara n'ahịrị bụ isi ga-emechi ihe ederede ahụ hapụrụ oghe.
- issue: Oge nke inwe alaeze ahụ
  choice: ‘bụ nke ha’ n'oge dị ugbu a
  alternative: ‘ga-abụ nke ha’ n'oge na-abịa
  rationale: ἐστιν dị n'oge ugbu a. Ya mere, e kwesịghị ịgbanwe nkwa ahụ ka ọ bụrụ naanị ihe ga-eme n'ọdịnihu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke doro anya ma dị ùgwù. ‘Ngọzi na-adịrị’ bụ okwu eke maka nkwupụta ngọzi; ‘ndị dara ogbenye n'ime mmụọ’ na-echekwa mgbagwoju anya dị n'asụsụ mbụ kama ịkọwa ya n'otu ụzọ.
