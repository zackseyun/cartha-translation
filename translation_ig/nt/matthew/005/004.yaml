  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: ig
  text: Ngọzi na-adịrị ndị na-eru uju[a], n’ihi na a ga-akasi ha obi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-enwe mwute.” Okwu Grik ahụ sara mbara; ọ kọwaghị ihe kpatara iru uju ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Ngọzi na-adịrị
  rationale: Nke a na-egosipụta nkwupụta ngọzi na ọnọdụ ọma n’anya Chineke, kama ịkọwa nanị mmetụta obi ụtọ.
- source_word: οἱ πενθοῦντες
  choice: ndị na-eru uju
  rationale: Ọ na-asụgharị participle ahụ dịka ìgwè mmadụ n’Igbo dị mfe ma doo anya, na-ahapụghị ihe kpatara iru uju ahụ ka ọ bụrụ naanị ọnwụ, mmehie, ma ọ bụ mkpagbu.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara nkwupụta ngọzi ahụ n'ụzọ doro anya n’Igbo nke oge a.
- source_word: αὐτοὶ
  choice: ha
  rationale: Nnochiaha a zuru ezu n’Igbo; itinye nkwusi ike pụrụ iche ga-eme ka okwu ahụ sie ike karịa ka ihe gbara ya gburugburu chọrọ.
- source_word: παρακληθήσονται
  choice: a ga-akasi ha obi
  rationale: Nke a bụ ụzọ ebumpụta ụwa Igbo si kwuo na ha ga-anata nkasi obi, ma na-echekwa ọdịdị passive nke ngwaa Grik ahụ.
theological_decisions:
- issue: Oke ihe iru uju ahụ na-emetụta
  choice: ndị na-eru uju
  alternative: ndị na-eru uju n’ihi mmehie; ndị na-eru uju n’ihi ọnwụ; ndị na-akwa arịrị maka ọnọdụ Izrel
  rationale: Ihe odide Grik akọwaghị kpọmkwem ihe kpatara iru uju ahụ. Nsụgharị sara mbara na-echekwa ohere ọ nwere ịgụnye mfu, ahụhụ, mmehie, mmegbu, ma ọ bụ agụụ maka nzọpụta Chineke, n’etinyeghị nkọwa otu ọdịnala n’ime isiokwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ejiri “Ngọzi na-adịrị” chekwaa usoro nkwupụta ngọzi ahụ; “ndị na-eru uju” bụ okwu sara mbara ma ghara imechi ihe kpatara mwute ahụ.
