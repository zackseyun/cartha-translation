review_pass:
  verdict: revise
  source_fidelity: 'The main text closely follows the Greek: it retains the conditional warning, “right hand,” the stumble metaphor, the two forceful imperatives, the comparison between one bodily part and the whole body, and the movement into Gehenna. “Tụfuo ya” is an appropriately natural rendering of βάλε ἀπὸ σοῦ, though the footnote can express the directional nuance more accurately.'
  naturalness: The verse is clear, idiomatic Standard Igbo, and maintains the grave rhetorical register of the source. “Ọ kaara gị mma” and the contrast between “otu akụkụ ahụ gị” and “ahụ gị dum” are natural and clear.
  terminology: '“Gehena” appropriately preserves γέεννα. The alternative gloss “ọkụ ala mmụọ” is too specific: it introduces “fire,” which is not present in this verse or in the lexical term itself. “Ala mmụọ” is a less interpretively expanded alternative. The footnote on βάλε ἀπὸ σοῦ should say “pụọ n’ebe ị nọ” rather than merely “n’ebe ị nọ,” to convey removal away from the person.'
  issues:
  - severity: low
    issue: Footnote b omits the directional force of ἀπό.
    rationale: “N’ebe ị nọ” means “where you are,” whereas ἀπὸ σοῦ means “away/from you.” Adding “pụọ” preserves the source nuance naturally.
  - severity: medium
    issue: Footnote c renders the alternative as “ọkụ ala mmụọ.”
    rationale: This adds the concept of fire to γέεννα. While Gehenna is associated with judgment imagery, the term itself in this verse should not be expanded in an alternative gloss beyond what the source states.
  revised_text: Ọ bụrụkwa na aka nri gị na-eme ka ị sụọ ngọngọ[a], bipụ ya, tụfuo ya[b]. N’ihi na ọ kaara gị mma ka otu akụkụ ahụ gị laa n’iyi karịa ka ahụ gị dum banye na Gehena[c].
