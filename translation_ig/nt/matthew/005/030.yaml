id: MAT.5.30
reference: Matthew 5:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: ig
  text: Ọ bụrụkwa na aka nri gị na-eme ka ị sụọ ngọngọ[a], bipụ ya, tụfuo ya[b]. N’ihi na ọ kaara gị mma ka otu akụkụ ahụ gị laa n’iyi karịa ka ahụ gị dum banye na Gehena[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-eme ka i mee mmehie.” Okwu Grik ahụ pụtara n’ụzọ nkịtị “na-eme ka ị sụọ ngọngọ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “tụpụ ya pụọ n’ebe ị nọ.”
    reason: source_form
  - marker: c
    text: Ma ọ bụ, “ala mmụọ.” “Gehena” bụ okwu Grik sitere n’aha Ndagwurugwu Hinom, e jikwa ya ekwu maka ikpe nke oge ikpeazụ.
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: aka nri gị
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọwa ‘right hand,’ ma ọ na-edobe kpọmkwem akụkụ ahụ e kwuru okwu ya.
- source_word: σκανδαλίζει
  choice: na-eme ka ị sụọ ngọngọ
  rationale: Nke a na-echekwa ihe atụ nke ịsụ ngọngọ dị n’okwu Grik, ebe nkọwa ya n’ebe a gụnyere iduba mmadụ ná mmehie.
- source_word: ἔκκοψον
  choice: bipụ ya
  rationale: Ọ bụ iwu siri ike nke chọrọ ime ihe ozugbo; ‘bipụ ya’ bụ okwu Igbo doro anya maka iwepụ aka site n’ịkpụ ya.
- source_word: βάλε ἀπὸ σοῦ
  choice: tụfuo ya
  rationale: Nke a bụ okwu Igbo dị ugbu a ma dị mfe nghọta nke na-egosi iwepụ ihe na ịjụ ya kpamkpam; nkọwa ala peeji na-echekwa echiche ‘site n’ebe ị nọ.’
- source_word: συμφέρει γάρ σοι
  choice: N’ihi na ọ kaara gị mma
  rationale: N’ebe a, okwu ahụ pụtara ihe ka mma nye mmadụ, ọ bụghị uru ego.
- source_word: ἵνα ἀπόληται
  choice: ka ... laa n’iyi
  rationale: ‘Laa n’iyi’ na-echekwa ịdị arọ nke ọnwụ ma ọ bụ mbibi nke akụkụ ahụ ahụ n’enweghị ịkọwa ya karịa isi mmalite.
- source_word: ἓν τῶν μελῶν σου
  choice: otu akụkụ ahụ gị
  rationale: Nke a bụ Igbo eke ma doo anya, ọ naghịkwa eme ka μέλος bụrụ naanị aka ma ọ bụ ụkwụ.
- source_word: ὅλον τὸ σῶμά σου
  choice: ahụ gị dum
  rationale: Nke a na-echekwa ọdịiche dị n’etiti otu akụkụ ahụ na ahụ niile.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: banye na Gehena
  rationale: ‘Banye’ na-egosipụta ngagharị ahụ dị na ἀπέλθῃ εἰς, ebe ‘Gehena’ na-echekwa aha Grik ahụ n’enweghị itinye nkọwa ozizi ndị e mechara jikọta na ya.
theological_decisions:
- issue: Nsụgharị γέεννα
  choice: Gehena
  alternative: ọkụ ala mmụọ
  rationale: ‘Gehena’ na-echekwa okwu dị n’ihe odide Grik, nke sitere n’aha Ndagwurugwu Hinom ma bụrụ okwu e ji ekwu maka ikpe ikpeazụ. E nyere nkọwa ‘ọkụ ala mmụọ’ n’ala peeji dị ka okwu ndị na-agụ akwụkwọ maara nke ọma, ma etinyeghị echiche ozizi ndị ọzọ n’ahịrịokwu ahụ.
- issue: Ihe σκανδαλίζει pụtara n’ebe a
  choice: na-eme ka ị sụọ ngọngọ
  alternative: na-eme ka i mee mmehie
  rationale: Nhọrọ bụ isi na-echekwa ihe atụ Grik ahụ, ebe nhọrọ dị n’ala peeji na-eme ka ihe ọ pụtara n’ọnọdụ a doo anya n’enweghị ihichapụ ihe atụ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. Ahịrịokwu ahụ na-echekwa ike nke iwu Jizọs, ihe atụ nke ịsụ ngọngọ, na ọdịiche dị n’etiti otu akụkụ ahụ na ahụ dum. E debere ‘Gehena’ n’ahịrịokwu bụ isi, tinyekwa nkọwa ya n’ala peeji.
