revisions:
- from: Ma ana m asị unu na onye ọ bụla na-ewesa nwanne ya iwe ga-aza ajụjụ n’ihu ikpe[a]; onye ọ bụla sị nwanne ya, “Raka,”[b] ga-aza ajụjụ n’ihu ndị kansụl[c]; ma onye ọ bụla sị, “Onye nzuzu!” ga-aza ajụjụ nke nwere ike iduba ya na Gehena ọkụ.[d][e]
  to: Ma m na-agwa unu na onye ọ bụla na-ewe nwanne ya iwe[d] ga-adị n'okpuru ikpe[a]; onye ọ bụla sị nwanne ya, “Raka,”[b] ga-adị n'okpuru kansụl[c]; onye ọ bụla sị, “Onye nzuzu!” ga-adị n'okpuru Gehena ọkụ.[e]
  rationale: E mezie arụmụka okwu «iwe» ka ọ bụrụ onye na-ewe nwanne ya iwe, wepụtakwa mgbakwunye «nke nwere ike iduba ya na» n'ihi na o nweghị ihe kwekọrọ na ya n'asụsụ Grik. E debere mgbago atọ nke ikpe—ikpe, kansụl, Gehena ọkụ—na-enweghị ịmanye nkọwa denominashọn ma ọ bụ ikpebi na συνέδριον bụ Sanhedrin. E meziekwa ebe akara [d] dị na okwu ọ na-akọwa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:33:49Z'
