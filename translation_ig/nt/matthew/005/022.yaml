  verdict: revise
  source_fidelity: A chọrọ mmezi. «na-ewesa nwanne ya iwe» pụtara ime ka nwanne ya wee iwe, ọ bụghị iwe megide nwanne ya. Nkebi ikpeazụ «nke nwere ike iduba ya na» na-agbakwunye echiche ‘iduba’ nke na-adịghị na Grik ma na-eme ka ἔνοχος ἔσται ghara ịdị n'otu na nkebi abụọ mbụ. Nsụgharị a gbanwere na-edobe ibu ikpe/ịdaba n'okpuru ikike ikpe n'usoro atọ ahụ, ma na-edobe Gehena na ọkụ.
  naturalness: «Ma m na-agwa unu» na «na-ewe nwanne ya iwe» bụ Standard Igbo eke ma doo anya. «Ga-adị n'okpuru ikpe/kansụl/Gehena ọkụ» na-ejigide usoro ikwu okwu nke amaokwu ahụ karịa «ga-aza ajụjụ ... nke nwere ike iduba ya na».
  terminology: E debere «Raka» na «Gehena». «Kansụl» na-asụgharị συνέδριον n'enweghị ikpebi na ọ bụ Sanhedrin kpọmkwem. A kpọgoro akara nkọwa banyere «nwanne» n'ebe okwu ahụ dị, kama itinye ya n'akụkụ Gehena.
