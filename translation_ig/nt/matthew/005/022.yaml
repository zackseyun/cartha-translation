id: MAT.5.22
reference: Matthew 5:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: ig
  text: Ma m na-agwa unu na onye ọ bụla na-ewe nwanne ya iwe[d] ga-adị n'okpuru ikpe[a]; onye ọ bụla sị nwanne ya, “Raka,”[b] ga-adị n'okpuru kansụl[c]; onye ọ bụla sị, “Onye nzuzu!” ga-adị n'okpuru Gehena ọkụ.[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agbakwunye “n’enweghị ihe kpatara ya” mgbe “na-ewe nwanne ya iwe.” Ihe odide ndị kacha ochie na ndị akaebe ha kacha sie ike enweghị okwu ndị a.
    reason: textual_variant
  - marker: b
    text: “Raka” bụ okwu mkparị Aramaik; ihe ọ pụtara dị ka “isi efu” ma ọ bụ “onye na-abaghị uru.”
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya “Sanhedrin,” ya bụ kansụl ọchịchị ndị Juu.
    reason: alternative_reading
  - marker: d
    text: “Nwanne” ebe a na-anọchi anya mmadụ n’ozuzu ya; okwu a abụghị naanị banyere ụmụnne nwoke.
    reason: lexical_alternative
  - marker: e
    text: A pụkwara ịsụgharị ya “hel nke ọkụ.” “Gehena” na-edobe okwu ahụ Jizọs ji, nke sitere n’ihe oyiyi Ndagwurugwu Hinom e jikọtara na ikpe.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ma ana m asị unu
  rationale: Na-egosipụta ntụnyere siri ike nke ἐγώ na δέ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: onye ọ bụla na-ewesa ... iwe
  rationale: Na-edebe okwu ahụ dịka eziokwu metụtara onye ọ bụla na-eme omume a, n’etinyeghị nkọwa ọzọ banyere ogologo oge iwe ahụ.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: nwanne ya
  rationale: “Nwanne” bụ okwu Igbo sitere n’okike nke nwere ike ịgụnye nwoke ma ọ bụ nwanyị; ọ na-edebe mmekọrịta ἀδελφός n’enweghị ịgbakwunye “onye kwere ekwe.”
- source_word: ἔνοχος ἔσται
  choice: ga-aza ajụjụ
  rationale: Na-egosipụta ịbụ onye iwu ma ọ bụ ikpe jidere, ma na-arụ ọrụ n’usoro ihe ikpe atọ dị n’amaokwu ahụ.
- source_word: τῇ κρίσει
  choice: n’ihu ikpe
  rationale: Na-ahapụ ohere ma okwu ahụ ọ bụ ụlọikpe kpọmkwem ma ọ bụ usoro ikpe, dịka asụsụ Grik si kwe.
- source_word: Ῥακά
  choice: Raka
  rationale: E debere okwu mkparị Arameik ahụ n’ụdị nsụgharị mkpụrụokwu, ma kọwaa ya n’ala peeji.
- source_word: τῷ συνεδρίῳ
  choice: n’ihu ndị kansụl
  rationale: Na-asụgharị συνέδριον n’ụzọ ndị na-agụ Igbo ga-aghọta, n’ebughị ụzọ kpebie na ọ bụ Sanhedrin kpọmkwem.
- source_word: Μωρέ
  choice: Onye nzuzu!
  rationale: Na-egosipụta na ọ bụ mkparị a na-akpọ mmadụ ihu, ma na-edebe ịdị arọ nke okwu ahụ.
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: nke nwere ike iduba ya na Gehena ọkụ
  rationale: εἰς mgbe ọ na-eso ἔνοχος na-egosi ntaramahụhụ onye ahụ nọ n’ihe ize ndụ ya; “Gehena” na-edebe okwu akụkọ ihe mere eme Jizọs ji, ebe “ọkụ” na-edebe τοῦ πυρός.
theological_decisions:
- issue: Nsụgharị γέεννα
  choice: Gehena
  alternative: hel; ala mmụọ
  rationale: “Gehena” na-edebe ndabere Ndagwurugwu Hinom na ihe oyiyi ikpe, n’etinyeghị echiche niile e mechara jikọta na okwu ndị ọzọ.
- issue: Okwu ἀδελφός nke bụ oke n’ụdị Grik
  choice: nwanne
  alternative: nwanna nwoke; nwanne nwoke ma ọ bụ nwanyị; onye otu okwukwe
  rationale: N’Igbo, “nwanne” nwere ike ịrụ ọrụ n’enweghị oke okike, ya mere ọ na-ekwupụta ntụaka sara mbara nke okwu ahụ n’ụzọ eke ma ghara ịkọwa ya naanị dịka onye otu okwukwe.
- issue: Ike nke εἰς na nkebi ikpeazụ
  choice: ga-aza ajụjụ nke nwere ike iduba ya na
  alternative: ga-abụ onye ikpe Gehena ọkụ mara; ga-adaba na Gehena ọkụ
  rationale: Nhọrọ a na-egosipụta ịbụ onye kwesịrị ntaramahụhụ ahụ ma ghara ime ka ἔνοχος bụrụ naanị nkwupụta na onye ahụ adabalarị ebe ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke ugwu na nkwanye ùgwù dị na ya ma dị mfe nghọta. E debere “Raka” na “Gehena” dịka okwu pụrụ iche ma kọwaa ha n’ala peeji. Usoro “ga-aza ajụjụ” na-ejikọta ihe oyiyi ikpe atọ ahụ n’enweghị ịmanye otu nkọwa pụrụ iche banyere ụlọikpe nke mbụ.
