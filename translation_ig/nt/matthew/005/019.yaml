id: MAT.5.19
reference: Matthew 5:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: ig
  text: Ya mere[a], onye ọ bụla nke na-eme ka otu n’ime iwu ndị a kasị nta ghara ịdị ire, ma kuziere ndị mmadụ[b] ime otu ahụ, a ga-akpọ ya onye kasị nta n’alaeze eluigwe; ma onye ọ bụla nke na-eme iwu ndị a ma na-akụzikwa ha, ọ bụ onye ahụ ka a ga-akpọ onye ukwu n’alaeze eluigwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘ịtọpụ,’ ‘iwepụ,’ ma ọ bụ ‘imebi.’ Okwu Grik ahụ pụtara n’ụzọ nkịtị ‘ịtọpụ’; n’ebe a, ọ na-ekwu maka ime ka iwu gharazie ịdị ike ma ọ bụ ile ya anya dị ka ihe na-adịghị amanye mmadụ.
    reason: lexical_alternative
  - marker: b
    text: ‘Ndị mmadụ’ n’ebe a na-ezo aka na mmadụ niile, ọ bụghị naanị ụmụ nwoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi na okwu a bụ nkwubi okwu sitere n’ihe Jizọs kwuru tupu ya banyere Iwu ahụ.
- source_word: λύσῃ
  choice: na-eme ka … ghara ịdị ire
  rationale: λύω pụtara n'ụzọ nkịtị ‘ịtọpụ,’ ma n’ebe a ọ na-ekwu maka ime ka iwu ghara ịdị ike ma ọ bụ ile ya anya dị ka ihe na-adịghị amanye mmadụ. Nsụgharị a na-ekwupụta echiche ahụ n’Igbo dị mfe ma doo anya.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: otu n’ime iwu ndị a, nke so ná ndị kasị nta
  rationale: Na-echekwa echiche nke otu iwu dị n’etiti iwu ndị e weere dị ka ndị kasị nta, na-enweghị ime ka ọ bụrụ naanị ‘iwu kacha nta’.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: kuziere ndị mmadụ ime otu ahụ
  rationale: ‘Ime otu ahụ’ na-ezo azụ n’ime ka iwu ghara ịdị ire; ‘ndị mmadụ’ na-egosi mmadụ niile n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: ἐλάχιστος κληθήσεται
  choice: a ga-akpọ ya onye kasị nta
  rationale: Na-edobe ọdịdị passive nke κληθήσεται na ntụnyere nke ἐλάχιστος, na-enweghị ịkọwa ya dị ka ịchụpụ onye ahụ n’alaeze.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: n’alaeze eluigwe
  rationale: Nke a bụ ụzọ Igbo doro anya ma guzosie ike isi kwuo okwu Matiu banyere ọchịchị eluigwe.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: na-eme iwu ndị a ma na-akụzikwa ha
  rationale: A kpọpụtara ihe ποιήσῃ na-ezo aka na ya—iwu ndị a—iji mee ka Igbo doo anya, ebe ‘na-eme’ ka na-anọgide nso na ποιέω.
- source_word: οὗτος
  choice: ọ bụ onye ahụ
  rationale: Na-echekwa nkwusi ike nke demonstrative ahụ na ọdịiche ya na onye e kwuru okwu banyere na nkebi mbụ.
- source_word: μέγας
  choice: onye ukwu
  rationale: Ọ bụ ụzọ Igbo ebumpụta ụwa isi gosipụta ‘great’ dị ka ọkwa ma ọ bụ ịdị mkpa, n’ụzọ megidere ‘onye kasị nta.’
theological_decisions:
- issue: Ọkwa ‘onye kasị nta/onye ukwu’ n’alaeze eluigwe
  choice: E gosipụtara ha dị ka ọkwa n’ime alaeze eluigwe, n’enweghị ịkọwa na onye kasị nta nọ n’èzí alaeze ahụ.
  alternative: Ịsụgharị ‘onye kasị nta’ dị ka onye a chụpụrụ n’alaeze, ma ọ bụ ‘onye ukwu’ dị ka aha pụrụ iche nke ụgwọ ọrụ eluigwe.
  rationale: Amaokwu ahụ kwuru kpọmkwem na a ga-akpọ onye ahụ onye kasị nta ‘n’alaeze eluigwe.’ Ya mere, nsụgharị ahụ hapụrụ esemokwu nkà mmụta okpukpe banyere nzọpụta, ụgwọ ọrụ, na ọkwa n’enweghị idozi ya.
- issue: Ndị ἀνθρώπους na-ezo aka na ha
  choice: Jiri ‘ndị mmadụ’ mee ka o doo anya na ọ na-ezo aka n’ebe mmadụ niile nọ.
  alternative: Jiri okwu nwere ike ime ka ndị na-agụ ya chee na ọ bụ naanị ụmụ nwoke ka a na-ekwu maka ha.
  rationale: N’agbanyeghị na okwu Grik ahụ dị n’ụdị masculine plural, ojiji ya ebe a bụ generic. ‘Ndị mmadụ’ na-enye otu ihe ahụ n’Igbo n’enweghị ịgbanwe ebe ọ na-ezo aka.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu ‘ghara ịdị ire’ ka echiche iwu ahụ doo ndị nkịtị anya, ebe nkọwa ala peeji na-echekwa ihe atụ nkịtị nke λύω. A hapụrụ nkwusi ike nke οὗτος n’ụdị ‘ọ bụ onye ahụ.’
