id: MAT.5.16
reference: Matthew 5:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: ig
  text: N’otu aka ahụ, ka ìhè unu nwuo n’ihu ndị mmadụ, ka ha wee hụ ọrụ ọma unu ma nye Nna unu nke nọ n’eluigwe[a] otuto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, okwu a dị n’ụdị ọtụtụ: “n’eluigwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: N’otu aka ahụ
  rationale: Na-ejikọta iwu a na ihe atụ oriọna na ìhè e kwuru tupu ya, ma na-egosi ụzọ ihe ahụ ga-esi mee.
- source_word: λαμψάτω τὸ φῶς ὑμῶν
  choice: ka ìhè unu nwuo
  rationale: Ụdị ‘ka … nwuo’ na-ebute iwu onye nke atọ n’Igbo n’ụzọ ebumpụta ụwa, ma na-edobe ‘ìhè’ dịka otu aha mkpokọta.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: n’ihu ndị mmadụ
  rationale: ‘Ndị mmadụ’ bụ okwu Igbo doro anya nke na-agụnye mmadụ niile; nke a kwekọrọ n’ojiji ἀνθρώπων ebe a, ọ bụghị naanị ụmụ nwoke.
- source_word: ὅπως ἴδωσιν
  choice: ka ha wee hụ
  rationale: Na-egosi ebumnuche nke ime ka ìhè ahụ nwuo ma na-anọchi subjunctive Grik n’ụzọ Igbo na-asụkarị.
- source_word: τὰ καλὰ ἔργα
  choice: ọrụ ọma unu
  rationale: ‘Ọrụ ọma’ bụ ntụgharị doro anya ma bụrụ nke a na-asụkarị maka ọrụ ndị dị mma ma kwesịkwa otuto.
- source_word: δοξάσωσιν
  choice: nye … otuto
  rationale: Na-egosi inye Chineke ebube ma ọ bụ otuto n’ụzọ dị mfe nghọta, na-enweghị ịgbakwụnye echiche na-adịghị n’isi mmalite.
- source_word: τὸν πατέρα ὑμῶν
  choice: Nna unu
  rationale: Na-edobe mmekọrịta nna nke dị mkpa n’amaokwu ahụ, tinyere nnọchiaha ọtụtụ ‘unu.’
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: nke nọ n’eluigwe[a]
  rationale: ‘N’eluigwe’ bụ ụzọ ebumpụta ụwa Standard Igbo si ekwu ebe obibi Chineke; nkọwa ala peeji na-eme ka ọtụtụ nke okwu Grik pụta ìhè.
theological_decisions:
- issue: Ihe ἀνθρώπων pụtara n’ebe a
  choice: ndị mmadụ
  alternative: ụmụ nwoke
  rationale: N’ebe a, okwu Grik ahụ na-ezo aka n’ụmụ mmadụ n’ozuzu, ya mere ‘ndị mmadụ’ na-edobe echiche ahụ n’enweghị ime ka ọ bụrụ naanị ndị nwoke.
- issue: Ụdị ọtụtụ nke οὐρανοῖς
  choice: n’eluigwe, tinyere nkọwa ala peeji
  alternative: n’eluigwe dị iche iche
  rationale: Igbo na-ejikarị ‘eluigwe’ dịka okwu mkpokọta n’ọnọdụ a. Ịgbakwunye ‘dị iche iche’ n’ahịrị bụ isi nwere ike ime ka onye na-agụ ya chee na a na-akụzi nkewa eluigwe kpọmkwem; nkọwa ala peeji na-edobe ọdịdị ọtụtụ nke Grik n’enweghị idozi ihe ọ pụtara n’ike.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe njikọ ya na ihe atụ ìhè gara aga, ike iwu nke ‘ka … nwuo,’ na ebumnuche bụ́ ka ndị mmadụ nye Nna otuto.
