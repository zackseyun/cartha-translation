  source_fidelity: 'Ahịrịokwu bụ isi na-atụgharị ihe Grik kwuru n’ụzọ kwesịrị ntụkwasị obi: iwu ahụ (‘ka ìhè unu nwuo’), ọnọdụ ya n’ihu mmadụ niile, ebumnuche ya, ọrụ ọma, na inye Nna otuto ka edobere. Otú ọ dị, nkọwa ala peeji ahụ na-akọwa ọtụtụ οὐρανοῖς n’ụzọ karịrị ihe okwu ahụ n’onwe ya na-ekwu.'
