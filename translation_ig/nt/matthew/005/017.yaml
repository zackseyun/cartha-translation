  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: ig
  text: “Unu echela na m bịara[a] ịkagbu Iwu ahụ ma ọ bụ Ndị Amụma; abịaghị m ịkagbu ha, kama imezu ha.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “abịala m”; n’ebe nke abụọ, “abịabeghị m.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta “imezu” dịka “ime ka ha zuo oke” ma ọ bụ “ime ka ihe ha pụtara pụta ìhè n’uju.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Unu echela
  rationale: 'Nke a bụ ụzọ Igbo dị mfe ma kwụ ọtọ isi nye iwu a na-ajụ mmadụ ime ihe: ‘Unu echela.’ Ọ na-edobe ike nke μή na aorist subjunctive n’asụsụ Grik.'
- source_word: ἦλθον
  choice: abịara m / abịaghị m
  rationale: Oge gara aga dị mfe dabara na aorist Grik ma na-ada nke ọma n’Igbo. Ụdị nke abụọ bụ nke njụ, dịka οὐκ si dị na isi mmalite.
- source_word: καταλῦσαι
  choice: ịkagbu
  rationale: N’ebe a okwu ahụ abụghị ibibi ihe n’ụzọ anụ ahụ, kama ọ bụ iwepụ ikike ya ma ọ bụ ime ka ọ ghara ịdị ire. ‘Ịkagbu’ na-egosipụta nke a nke ọma n’ihe metụtara Iwu na Ndị Amụma.
- source_word: τὸν νόμον
  choice: Iwu ahụ
  rationale: ‘Iwu ahụ’ na-egosi Iwu Mosis/Tora dịka akụkụ Akwụkwọ Nsọ a maara ama, ọ bụghị iwu n’ozuzu ya.
- source_word: τοὺς προφήτας
  choice: Ndị Amụma
  rationale: N’ụzọ e jikọtara ya na ‘Iwu ahụ,’ okwu a na-ezo aka n’akụkụ Akwụkwọ Nsọ a na-akpọ Ndị Amụma, ọ bụghị naanị ndị amụma n’ozuzu ha.
- source_word: ἀλλὰ πληρῶσαι
  choice: kama imezu ha
  rationale: '‘Imezu’ na-edobe obosara πληρόω: ime ka ihe ruo n’ihe e zubere ya, zuo oke, ma ọ bụ pụta ìhè n’uju. ‘Ha’ na-ezo aka n’Iwu ahụ na Ndị Amụma.'
theological_decisions:
- issue: Ihe πληρῶσαι na-ekwu banyere mmekọrịta Jizọs na Iwu ahụ na Ndị Amụma
  choice: imezu ha
  alternative: ime ka ha zuo oke; ime ka ihe ha pụtara pụta ìhè n’uju
  rationale: ‘Imezu’ anaghị ekpebi naanị otu nkọwa ozizi. Ọ na-ahapụ ohere maka echiche nke iru n’ihe e zubere, izu oke, na ngosipụta zuru ezu, dịka obosara okwu Grik si dị.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. E ji mkpụrụedemede ukwu dee ‘Iwu’ na ‘Ndị Amụma’ iji gosi na ha bụ aha akụkụ Akwụkwọ Nsọ. E debeghị nkọwa otu ụka n’ime okwu ‘imezu.’
