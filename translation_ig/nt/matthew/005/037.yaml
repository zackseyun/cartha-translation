  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: ig
  text: Ma ka okwu unu bụrụ, ‘Ee, ee,’ ma ọ bụ ‘Mba, mba.’ Ihe ọ bụla karịrị ihe ndị a sitere n’aka onye ọjọọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “sitere n’ihe ọjọọ.” Okwu Grik τοῦ πονηροῦ nwere ike ịpụta ma “onye ọjọọ” ma “ihe ọjọọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: ka ... bụrụ
  rationale: Ọ bụ iwu onye nke atọ n’oge ugbu a; ‘ka ... bụrụ’ na-enye ndụmọdụ ahụ n’ụzọ Igbo dị mma ma na-edobe ike iwu ya.
- source_word: λόγος
  choice: okwu
  rationale: N’ebe a ọ na-ekwu banyere ihe mmadụ na-ekwu; ‘okwu’ dị nkenke ma na-edobe ọdịdị ilu nke ahịrịokwu ahụ.
- source_word: ναὶ ναί, οὒ οὔ
  choice: ‘Ee, ee,’ ma ọ bụ, ‘Mba, mba’
  rationale: E debere nkwughachi nke okwu Grik ahụ iji chekwaa nkwusi ike na ụda ya; ‘ma ọ bụ’ na-eme ka ọdịiche ahụ doo anya n’Igbo.
- source_word: περισσὸν
  choice: Ihe ọ bụla karịrị
  rationale: Okwu a na-arụ ọrụ dị ka aha ma na-ezo aka n’ihe gafere azịza ee/mbà ndị ahụ dị mfe.
- source_word: τούτων
  choice: ndị a
  rationale: Ọ na-alaghachi n’azịza abụọ a kpọrọ aha; ‘ndị a’ bụ ntụaka ọtụtụ dabara adaba n’Igbo.
- source_word: ἐκ
  choice: sitere n’aka
  rationale: Ọ na-egosi isi mmalite; n’ịgụ ya dị ka onye, ‘sitere n’aka’ bụ Igbo eke.
- source_word: τοῦ πονηροῦ
  choice: ajọ onye
  rationale: Nkebiokwu Grik a nwere ike ịpụta ‘ajọ onye ahụ’ ma ọ bụ ‘ihe ọjọọ.’ N’Oziọma Matiu, o yikarịrị ka ọ na-ezo aka n’onye ọjọọ, ya mere a họọrọ ‘ajọ onye,’ ma debe nghọta nke ọzọ n’akwụkwọ nkọwa.
theological_decisions:
- issue: Ma τοῦ πονηροῦ ọ̀ bụ ihe na-abụghị onye (‘ihe ọjọọ’) ka ọ bụ onye (‘ajọ onye’).
  choice: ajọ onye
  alternative: ihe ọjọọ
  rationale: Ụdị asụsụ Grik ahụ nwere nghọta abụọ, ma ojiji Matiu na-akwado nghọta nke onye. E debere nghọta nke na-abụghị onye n’akwụkwọ nkọwa ka a ghara iwepụ mgbagwoju anya dị n’asụsụ mbụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E debere nkwughachi ‘Ee, ee’ na ‘Mba, mba’ iji chekwaa usoro na nkwusi ike nke Grik.
