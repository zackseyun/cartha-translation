  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: ig
  text: Ndị mmadụ anaghịkwa amụnye oriọna ma tinye ya n'okpuru nkata e ji atụ ihe[a]; kama, ha na-etinye ya n'elu ihe nkwụnye oriọna, ọ na-enyekwa ndị niile nọ n'ụlọ ahụ ìhè.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'okpuru ihe e ji atụ ihe.” Mọdịọs nke Grik bụ ihe e ji atụ ihe akọrọ; o nwekwara ike ịpụta akpa e ji atụ ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ na-enwukwa nye ndị niile nọ n'ụlọ ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: Ndị mmadụ adịghịkwa
  rationale: Ọ na-ejikọta ihe atụ a na okwu bu ya ụzọ ma na-egosipụta omume ndị mmadụ n'ozuzu, dịka ngwaa ọtụtụ na-enweghị isiokwu a kpọrọ aha si dị.
- source_word: καίουσιν λύχνον
  choice: amụnye oriọna
  rationale: N'okwu a, καίω na λύχνος pụtara ịmụnye oriọna mmanụ; nke a bụkwa ụzọ Igbo si ekwu ya n'ụzọ ebumpụta ụwa.
- source_word: τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον
  choice: tụnye ya n'okpuru nkata e ji atụ ihe
  rationale: μόδιος bụ ihe ọ̀tụ̀tụ̀ akọrọ nakwa akpa e ji atụ ya. 'Nkata e ji atụ ihe' na-eme ka ihe a na-ekwu doo onye na-agụ taa anya n'ebughị ụzọ gbanwee ihe oyiyi ahụ.
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: kama, ha na-edobe ya n'elu ihe ndọba oriọna
  rationale: λυχνία bụ ebe ma ọ bụ ihe e ji adọba oriọna; ntụgharị a na-edebe ọdịiche dị n'etiti oriọna na ihe a na-adọba ya n'elu.
- source_word: λάμπει
  choice: ọ na-enyekwa ... ìhè
  rationale: Ọ bụ ezie na λάμπω nwekwara ike ịbụ 'na-enwu,' dative πᾶσιν na-egosi uru ìhè ahụ baara ndị nọ n'ụlọ; okwu a na-asụkarị na Igbo ma na-echekwa echiche ahụ.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: ndị niile nọ n'ụlọ ahụ
  rationale: Ọ na-echekwa oke zuru ezu nke πᾶσιν na echiche ebe nke οἰκία, ya bụ, mmadụ niile nọ n'ime ụlọ ahụ.
theological_decisions:
- issue: Isiokwu mmadụ nke atọ ọtụtụ nke Grik na-akpọghị aha
  choice: Ndị mmadụ adịghịkwa amụnye...
  alternative: Ọ dịghịkwa onye na-amụnye... / Ha adịghịkwa amụnye...
  rationale: Grik ji ngwaa ọtụtụ mee okwu izugbe n'enweghị isiokwu a kpọrọ aha. 'Ndị mmadụ' na-egosipụta ọdịdị ilu ahụ nke ọma, ma zere ime ka 'ha' zoo aka n'otu ìgwè a na-amaghị.
- issue: Ụzọ e si ghọta λάμπει na dative πᾶσιν
  choice: ọ na-enyekwa ndị niile nọ n'ụlọ ahụ ìhè
  alternative: ọ na-enwukwa nye ndị niile nọ n'ụlọ ahụ
  rationale: Nhọrọ bụ isi na-egosipụta ọrụ oriọna ahụ nye mmadụ niile, ebe nhọrọ nke ọzọ na-arapara nso n'ụdị okwu Grik. Ha abụọ adịghị agbanwe isi ihe atụ ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E ji 'nkata e ji atụ ihe' mee ka ihe ọdịnala ahụ doo anya; e jighị okwu denominational ọ bụla. Akara ndetu ala ala [a] na [b] dị n'ederede isi.
