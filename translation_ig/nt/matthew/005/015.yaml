review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the generic negative statement, the lighting of a lamp, the measuring-container image, the contrast with placing it on a lampstand, and the light reaching all who are in the house. The revision retains these features while making the paired actions and lampstand term more idiomatic.
  naturalness: “Adịghịkwa amụnye oriọna tụnye ya” lacks a natural connector between the two coordinated actions. “Anaghịkwa amụnye oriọna ma tinye ya” is clear Standard Igbo. “Ihe nkwụnye oriọna” is a more natural, concise term for a lampstand than “ihe ndọba oriọna.”
  terminology: “Oriọna,” “nkata e ji atụ ihe,” and “ihe nkwụnye oriọna” preserve the concrete imagery without imposing interpretation. The footnotes distinguish the measure/container sense of μόδιος and the more literal sense of λάμπει.
  issues:
  - severity: medium
    issue: Missing coordination between “amụnye oriọna” and “tụnye ya.”
    rationale: The Greek joins the actions with καί. In the draft, the adjacent verb phrase is awkward in Igbo and can momentarily read as an incomplete construction. Adding “ma” supplies the necessary coordination without altering meaning.
  - severity: low
    issue: “Ihe ndọba oriọna” is less idiomatic than a standard lampstand expression.
    rationale: “Ihe nkwụnye oriọna” more naturally identifies the object on which a lamp is placed, while retaining the lexical distinction between λύχνος and λυχνία.
  revised_text: Ndị mmadụ anaghịkwa amụnye oriọna ma tinye ya n'okpuru nkata e ji atụ ihe[a]; kama, ha na-etinye ya n'elu ihe nkwụnye oriọna, ọ na-enyekwa ndị niile nọ n'ụlọ ahụ ìhè.[b]
