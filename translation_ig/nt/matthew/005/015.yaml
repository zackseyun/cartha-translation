revisions:
- from: Ndị mmadụ adịghịkwa amụnye oriọna tụnye ya n'okpuru nkata e ji atụ ihe[a]; kama, ha na-edobe ya n'elu ihe ndọba oriọna, ọ na-enyekwa ndị niile nọ n'ụlọ ahụ ìhè.[b]
  to: Ndị mmadụ anaghịkwa amụnye oriọna ma tinye ya n'okpuru nkata e ji atụ ihe[a]; kama, ha na-etinye ya n'elu ihe nkwụnye oriọna, ọ na-enyekwa ndị niile nọ n'ụlọ ahụ ìhè.[b]
  rationale: The revision resolves the awkward coordination in the first clause and uses a more natural Standard Igbo term for “lampstand.” It keeps the generic force of the Greek plural, the concrete measuring-container image, and the sense that the lamp gives light to everyone in the house. Footnote anchors and alternatives are retained and clarified.
