  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: ig
  text: Unu anụla na a gwara ndị oge ochie[a] sị, “Egbula mmadụ n’ụzọ iwu na-akwadoghị[b]; onye ọ bụla gburu mmadụ n’ụzọ iwu na-akwadoghị ga-aza ikpe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị biri n’oge gara aga.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, okwu a na-ezo aka n’igbu mmadụ dịka mpụ, ọ bụghị n’igbu ọ bụla n’ozuzu ya. N’ọdịnala, a na-asụgharị ya, “Egbula mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Unu anụla
  rationale: Ụdị a na-egosi ihe ndị na-ege ntị nụrụla ma ka maara dị ka ozizi e nyefere ha; ọ bụkwa okwu Igbo dị mfe ma kwekọọ n’ụzọ Jizọs si webata okwu a.
- source_word: ἐρρέθη
  choice: a gwara
  rationale: E ji usoro a na-akpọghị onye kwuru ya chekwaa passive nke Grik, n’etinyeghị nkọwa na ọ bụ Chineke ma ọ bụ Mozis kwuru ya kpọmkwem.
- source_word: τοῖς ἀρχαίοις
  choice: ndị mgbe ochie
  rationale: Nke a na-egosi ndị biri n’oge gara aga ma na-echekwa dative recipient sense—na ọ bụ ha ka a gwara okwu ahụ.
- source_word: Οὐ φονεύσεις
  choice: Egbula mmadụ n’ụzọ igbu ọchụ
  rationale: φονεύω pụtara igbu mmadụ dịka mpụ, ọ bụghị ụdị igbu ihe niile. Mgbakwunye ‘n’ụzọ igbu ọchụ’ na-eme ka ọdịiche a doo anya n’Igbo.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: onye ọ bụla gburu mmadụ n’ụzọ igbu ọchụ
  rationale: ‘Onye ọ bụla’ na-egosipụta indefinite general condition nke ἄν tinyere subjunctive; past-form Igbo ‘gburu’ na-arụ ọrụ nke ọma n’ahịrịokwu ọnọdụ a.
- source_word: ἔνοχος ἔσται τῇ κρίσει
  choice: ga-aza ikpe
  rationale: Nke a na-enye echiche iwu nke ịbụ onye a ga-ajụ ajụjụ ma kpee ikpe, n’ebughị ụzọ kwuo na a mara ya ikpe ma ọ bụ kọwaa ụlọikpe ahụ kpọmkwem.
theological_decisions:
- issue: Otú e si sụgharịa iwu nke isii
  choice: Egbula mmadụ n’ụzọ igbu ọchụ
  alternative: Egbula mmadụ
  rationale: φονεύω dị warara karịa igbu mmadụ ma ọ bụ ihe n’ozuzu ya; nhọrọ a na-egbochi ka a ghọta okwu ahụ dịka mmachibido ụdị igbu niile.
- issue: Onye kwuru okwu ahụ
  choice: a gwara
  alternative: Chineke gwara
  rationale: Grik ekwughị onye kwuru ya n’ahịrịokwu a. A hapụrụ ya n’enweghị aha ka a ghara itinye nkọwa okpukpe nke ederede ahụ ekwughị kpọmkwem.
- issue: Ókè okwu e hotara
  choice: E tinyere iwu ahụ na ihe ga-eso ya n’otu okwu e hotara
  alternative: Naanị ‘Egbula mmadụ n’ụzọ igbu ọchụ’ ka a ga-etinye n’akara okwu
  rationale: Ihe odide Grik mbụ enweghị akara okwu e hotara, ya mere ókè quotation ahụ nwere obere mgbagwoju anya. Isi ederede na-ewere iwu na ihe ikpe ga-eso ya dịka otu ozizi a nụrụ, ebe ndetu na-echekwa nhọrọ ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Unu anụla’ na-agwa ìgwè ndị na-ege ntị okwu n’ụzọ nkịtị. A họọrọ ‘ndị mgbe ochie’ kama okwu siri ike ma ọ bụ nke ochie. A kọwara murder n’ụzọ zuru oke n’isi ederede ka ọdịiche dị n’etiti φονεύω na igbu n’ozuzu ya ghara ịla n’iyi.
