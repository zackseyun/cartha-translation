review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the prohibition against swearing by one''s own head and its stated reason: a person cannot cause even one hair to be white or black. No broader teaching about oaths is added.'
  naturalness: ‘Ejikwala’ is less idiomatic here than the ordinary negative imperative ‘Ejila.’ Also, ‘otu ntutu isi’ is clearer and more current Standard Igbo for ‘one hair’ than ‘otu agịrị isi.’
  terminology: ‘Ịṅụ iyi’ appropriately renders oath-taking, and ‘isi gị’ correctly retains the personal possessive. ‘Ọcha’ and ‘oji’ preserve the Greek color contrast without interpretive expansion.
  issues:
  - severity: medium
    issue: Negative imperative wording
    rationale: For a direct prohibition, Standard Igbo naturally says ‘Ejila isi gị ṅụọ iyi.’ ‘Ejikwala’ can carry a discontinuative nuance (‘do not use again/any longer’) that is not present in μήτε ... ὀμόσῃς.
  - severity: low
    issue: Term for a single hair
    rationale: ‘Otu ntutu isi’ is the more transparent, broadly natural Standard Igbo expression for μίαν τρίχα; it avoids possible ambiguity or regional variation in ‘agịrị isi.’
  - severity: low
    issue: Footnote anchor placement
    rationale: The note offers an alternative for the expression of inability, so its marker should follow ‘ị pụghị,’ the phrase it clarifies, rather than the whole sentence.
  revised_text: Ejila isi gị ṅụọ iyi, n’ihi na ị pụghị[a] ime ka ọbụ otu ntutu isi dị ọcha ma ọ bụ dị oji.
  revised_footnotes:
