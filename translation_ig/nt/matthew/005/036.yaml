  to: Ejila isi gị ṅụọ iyi, n’ihi na ị pụghị[a] ime ka ọbụ otu ntutu isi dị ọcha ma ọ bụ dị oji.
  rationale: The revision uses the idiomatic Standard Igbo negative imperative, retains the oath-by-one’s-head idiom, and uses ‘otu ntutu isi’ for the singular hair. The note is retained as a lexical-style alternative and moved to the inability phrase that it reformulates.
