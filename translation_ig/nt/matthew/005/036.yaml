id: MAT.5.36
reference: Matthew 5:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: ig
  text: Ejila isi gị ṅụọ iyi, n’ihi na ị pụghị[a] ime ka ọbụ otu ntutu isi dị ọcha ma ọ bụ dị oji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ihi na i nweghị ike ime ka otu ntutu isi dị ọcha ma ọ bụ dị oji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτε
  choice: Ejikwala
  rationale: Ọ na-aga n’ihu n’usoro mmachibido iwu ndị bu ya ụzọ; ụdị njikọ a na-eme ka Igbo bụrụ nke e ji eme ihe n’enweghị ikwughachi okwu na-adịghị mkpa.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: isi gị
  rationale: Mgbe ọ na-eso ὀμόσῃς, ọ na-egosi ihe onye ahụ ji aṅụ iyi; ‘iji isi gị ṅụọ iyi’ bụ ụzọ Igbo doro anya si kwuo ya.
- source_word: ὀμόσῃς
  choice: ṅụọ iyi
  rationale: Nke a bụ okwu Igbo nkịtị ma dị ugwu maka ịṅụ iyi, ma na-edobe mmachibido iwu dị n’asụsụ Grik.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara mmachibido iwu ahụ.
- source_word: οὐ δύνασαι
  choice: ị pụghị
  rationale: Ọ na-egosi enweghị ike mmadụ n’ụzọ dị nkenke ma bụrụ nke a na-aghọta ngwa ngwa.
- source_word: μίαν τρίχα
  choice: ọbụ otu agịrị isi
  rationale: ‘Ọbụ otu’ na-edobe nkwusi ike nke μίαν, ebe ‘agịrị isi’ bụ ụzọ Igbo si akọ otu ntutu dị n’isi.
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: dị ọcha ma ọ bụ dị oji
  rationale: Ọ na-edobe agba abụọ ahụ n’ụdị ha kpọmkwem, n’etinyeghị nkọwa ọzọ dị ka isi awọ.
- source_word: ποιῆσαι
  choice: ime ka ... dị
  rationale: Ụdị a na-egosi ime ka ihe ghọọ ma ọ bụ bụrụ otu ọnọdụ, nke bụ nghọta ποιέω nwere n’ebe a.
theological_decisions:
- issue: Ụdị mmachibido iwu banyere ịṅụ iyi
  choice: A sụgharịrị ya dị ka mmachibido iwu kpọmkwem megide iji isi mmadụ aṅụ iyi.
  alternative: Ịkọwa ya dị ka mmachibido iyi niile n’ọnọdụ niile, ma ọ bụ naanị iyi aghụghọ na nke mgbapụ.
  rationale: Amaokwu ahụ n’onwe ya kwuru kpọmkwem banyere iji isi mmadụ aṅụ iyi ma kwado ya n’enweghị ike mmadụ ịchị ọbụ otu agịrị isi; nsụgharị ahụ ekwesịghị idozi arụmụka nkà mmụta okpukpe sara mbara karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu mee ihe. ‘Ịṅụ iyi’ bụ okwu nkịtị maka oath-taking; ‘ọbụ otu agịrị isi’ na-edobe nkwusi ike nke otu ntutu n’asụsụ Grik.
