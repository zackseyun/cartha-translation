id: MAT.5.27
reference: Matthew 5:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη· Οὐ μοιχεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/027.yaml
  text: You have heard that it was said[a], ‘You shall not commit adultery.’
translation:
  language: ig
  text: “Unu anụla na e kwuru, sị, ‘Ị gaghị akwa iko.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Unu anụla
  rationale: Oge aorist n'usoro okwu a na-ezo aka n'ihe ndị na-ege ntị nụrụla ma nata dị ka ozizi; ‘Unu anụla’ bụ Igbo ebumpụta ụwa nke na-egosi na ihe ahụ ka dị ha n'uche.
- source_word: ὅτι
  choice: na
  rationale: ‘Na’ na-ewebata ọdịnaya nke ihe a nụrụ n'ụzọ doro anya ma bụrụkwa nke a na-ejikarị eme ihe n'Igbo.
- source_word: ἐρρέθη
  choice: e kwuru
  rationale: Ụdị passive a na-akpọghị onye kwuru ya dabara nke ọma na ‘e kwuru,’ ma ọ naghị atụkwasị onye kwuru okwu ahụ n'ime ederede.
- source_word: Οὐ μοιχεύσεις
  choice: Ị gaghị akwa iko
  rationale: Nke a na-echekwa ụdị iwu machibidoro ihe nke Iwu Iri ahụ, ebe ‘ịkwa iko’ bụ okwu Igbo a na-aghọta nke ọma maka ime mmehie ịkwa iko n'alụmdi na nwunye.
theological_decisions:
- issue: Mmekọrịta okwu a na Iwu Iri ahụ
  choice: Ị gaghị akwa iko.
  alternative: Akwa.la iko.
  rationale: Ụdị ‘Ị gaghị...’ na-echekwa ụda nke iwu e nyere n'Iwu Iri ahụ na njikọ ederede Jizọs na-akpọtụrụ, n'etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji ‘unu’ mee ka o doo anya na Jizọs na-agwa ọtụtụ ndị okwu; e jighị okwu ụka pụrụ iche ma ọ bụ nkọwa denominashọn.
