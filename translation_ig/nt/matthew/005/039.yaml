review_pass:
  verdict: revise
  source_fidelity: 'Isi nsụgharị ahụ na-anọchi anya Grik nke ọma: iwu mgbochi “eguzogidela” na-echekwa obosara μὴ ἀντιστῆναι, “onye ọjọọ” na-anọchi anya nghọta mmadụ n’ọnọdụ a, “amaa gị ụra” dabara na ῥαπίζει, ma “ntì aka nri” na “ntì nke ọzọ” na-ewepụta akụkụ ahụ a na-ekwu maka ya. Otú ọ dị, ụdị ngwaa “tụgharịakwaara” nwere nhazi na-adịghị mma n’Igbo Standard; “tụgharịakwara” na-edobe στρέψον ... καὶ ma na-adị mma karịa.'
  naturalness: Ahịrị ahụ bụ Igbo Standard a pụrụ ịghọta nke ọma. A chọrọ naanị idozi “tụgharịakwaara,” nke nwere ụda nhazi-mgbakwunye na-adịghị eke. “Tụgharịakwara ya ntì nke ọzọ” na-adịkwu mma ma na-edobe nghazi “nye/kwuru ya” nke Grik αὐτῷ.
  terminology: “Onye ọjọọ” bụ nhọrọ kwesịrị ekwesị maka isi ederede n’ihi ihe atụ sochiri ya banyere onye na-ama ụra. Ala peeji a ga-echekwa “ihe ọjọọ” na “onye ọjọọ ahụ” dịka nghọta ndị ọzọ. “Ajọ onye ahụ” anaghị akọwa nke ọma ọdịiche dị n’etiti “onye ọjọọ” n’ozuzu na “onye ọjọọ ahụ/the evil one,” ya mere a gbanwere ya.
