  - severity: low
    issue: 'Nkọwa ala peeji a: “ajọ onye ahụ”'
    rationale: Ọ naghị echekwa nke ọma nhọrọ Grik “the evil one”; “onye ọjọọ ahụ” na-egosi onye a kapịrị ọnụ nke ọma, n’enweghị ịmanye nkọwa okpukpe.
