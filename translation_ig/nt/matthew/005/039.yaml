id: MAT.5.39
reference: Matthew 5:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: ig
  text: Ma ana m asị unu, unu eguzogidela onye ọjọọ[a]. Kama, ọ bụrụ na onye ọ bụla amaa gị ụra na ntì aka nri, tụgharịakwara ya ntì nke ọzọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu eguzogidela ihe ọjọọ”; ụzọ ọzọkwa bụ, “unu eguzogidela onye ọjọọ ahụ.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “tụgharịakwara ya nke ọzọ.”
    reason: previous_rendering
lexical_decisions:
- source_word: μὴ ἀντιστῆναι
  choice: unu eguzogidela
  rationale: “Iguzogide” na-egosipụta isi echiche nke ịkwụrụ megide ma ọ bụ iguzogide, n’emeghị ka okwu ahụ bụrụ naanị ịbọ ọbọ ma ọ bụ okwu ikpe.
- source_word: τῷ πονηρῷ
  choice: onye ọjọọ
  rationale: Ụdị okwu Grik a nwere ike ịpụta ihe ọjọọ, onye ọjọọ, ma ọ bụ ajọ onye ahụ. Ihe atụ sochirinụ banyere onye na-ama mmadụ ụra na-akwado ịghọta ya dịka onye na-eme ihe ọjọọ, ma e debere nghọta ndị ọzọ n’ala peeji.
- source_word: ῥαπίζει
  choice: amaa gị ụra
  rationale: N'okwu a, ngwaa ahụ na-ezo aka n'ịkụ mmadụ aka n'ihu, karịsịa ịma ya ụra; okwu Igbo a na-egosipụta ma ihe mgbu ma mmechuihu dị n'omume ahụ.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: na ntì aka nri
  rationale: σιαγών nwere ike ịbụ agba ma ọ bụ ntì, ma “ntì” bụ okwu ebumpụta ụwa karịa n’ebe a na-ekwu maka ịma ụra.
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: tụgharịakwaara ya ntì nke ọzọ
  rationale: Nsụgharị a na-edobe ihe ngwaa στρέφω pụtara, ya bụ “tụgharịa,” ma na-eme ka ihe a ghọtara n'okwu Grik—ntì nke ọzọ—pụta ìhè n'Igbo.
- source_word: ὅστις
  choice: ọ bụrụ na onye ọ bụla
  rationale: Nke a na-egosipụta ike na-akọwapụtaghị onye kpọmkwem nke okwu ahụ n'usoro yiri nkebi ọnọdụ.
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ma ana m asị unu
  rationale: “Ma” na-edobe ọdịiche δέ na ihe bu ụzọ, ebe “ana m asị unu” na-egosipụta okwu Jizọs kpọmkwem n'ụzọ doro anya ma dị ùgwù.
theological_decisions:
- issue: Ihe τῷ πονηρῷ pụtara
  choice: onye ọjọọ
  alternative: ihe ọjọọ; ma ọ bụ ajọ onye ahụ
  rationale: 'Akụkụ a nwere mgbagwoju anya n''ụtọ asụsụ: ọ pụrụ ịbụ ihe ọjọọ n''ozuzu, onye ọjọọ, ma ọ bụ ajọ onye ahụ. Ebe ihe atụ na-esote bụ banyere mmadụ na-eme mmejọ, isi ederede họọrọ “onye ọjọọ,” ma ala peeji na-echekwa ụzọ nghọta ndị ọzọ.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, mee ihe. A họọrọ “amaa gị ụra na ntì” dịka okwu nkịtị maka ịkụ mmadụ aka n'ihu; e zere ime ka iwu ahụ bụrụ naanị okwu banyere ịbọ ọbọ, n'ihi na ngwaa Grik sara mbara karịa nke ahụ.
