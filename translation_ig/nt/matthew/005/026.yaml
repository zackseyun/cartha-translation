  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: ig
  text: N’ezie, ana m agwa gị, ị gaghị esi n’ebe ahụ pụta ma ọlị ruo mgbe ị kwụrụ kwọdrans ikpeazụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Kwọdrans bụ obere mkpụrụ ego ndị Rom.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: N’ezie
  rationale: N’usoro okwu ἀμὴν λέγω σοι, okwu a bụ nkwenye siri ike nke na-ebute okwu nwere ikike; “N’ezie” na-egosipụta nke a n’Igbo nkịtị ma dị ugwu.
- source_word: λέγω σοι
  choice: ana m agwa gị
  rationale: Nke a bụ ụzọ ebumpụta ụwa e si agwa otu onye okwu ozugbo n’Igbo, ma na-edobe ike dị n’okwu ahụ.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: ị gaghị ... pụta ma ọlị
  rationale: Ngwakọta οὐ μή na-enye ngọnarị siri nnọọ ike. “Ma ọlị” na-eme ka ike ahụ doo anya n’Igbo na-enweghị iji okwu ochie.
- source_word: ἐκεῖθεν
  choice: esi n’ebe ahụ
  rationale: Okwu Grik ahụ na-egosi isi n’otu ebe pụọ; “esi n’ebe ahụ pụta” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ mkpọchi.
- source_word: ἕως ἂν ἀποδῷς
  choice: ruo mgbe ị kwụrụ
  rationale: Nkebi a na-egosi ọnọdụ ga-akwụsị naanị mgbe ịkwụ ụgwọ zuru ezu mezuru. “Ruo mgbe ị kwụrụ” na-enye ihe ahụ n’Igbo ebumpụta ụwa.
- source_word: τὸν ἔσχατον
  choice: ikpeazụ
  rationale: Ọ na-ezo aka n’ego ikpeazụ fọdụrụ n’ụgwọ ahụ; “ikpeazụ” na-edobe ihe okwu ahụ pụtara n’enweghị ịgbakwunye nkọwa.
- source_word: κοδράντην
  choice: mkpụrụ ego kwọdrans
  rationale: A na-edobe aha kpọmkwem nke mkpụrụ ego Rom ahụ n’ụdị a sụgharịrị ka onye na-agụ ghara iche na ọ bụ ego Igbo ma ọ bụ ego nke oge a; “mkpụrụ ego” na-eme ka ụdị ihe ahụ doo anya.
theological_decisions:
- issue: Ma a ga-akọwa mkpọchi na ịkwụ ụgwọ a kpọmkwem dị ka ikpe ikpeazụ, ịsacha mmehie, ma ọ bụ naanị ọnọdụ iwu na ụlọ mkpọrọ
  choice: E debere onyinyo pụtara ìhè nke mkpọchi n’ihi ụgwọ, n’enweghị ịkọwa ozizi pụrụ iche.
  alternative: Ịsụgharị ya n’ụzọ ga-eme ka ọ bụrụ kpọmkwem ikpe Chineke, ịsacha mmehie, ma ọ bụ naanị okwu gbasara ụlọikpe mmadụ.
  rationale: Ihe odide Grik kwuru naanị na onye ahụ agaghị apụta ruo mgbe ọ kwụrụ ego ikpeazụ. Ya mere, nsụgharị ahụ na-ahapụ mgbagwoju anya na esemokwu nkà mmụta okpukpe dị na gburugburu okwu ahụ kama idozi ya n’ụzọ otu ozizi.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E jiri “ana m agwa gị” mee ka adreesị otu onye doo anya; e jiri “ma ọlị” chekwaa ike nke ngọnarị Grik. A haziri akara nkọwa ala peeji n’usoro ha pụtara n’ederede.
