  to: 'N’ihi na ana m agwa unu n’ezie: ruo mgbe eluigwe na ụwa ga-agabiga, otu iota[a] ma ọ bụ otu obere akara[b] agaghị apụ n’Iwu ahụ ma ọlị, ruo mgbe ihe niile ga-eme[c].'
