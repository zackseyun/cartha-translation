    issue: Opening word order is awkward.
    rationale: “N’ihi na n’ezie” stacks two discourse markers unnaturally. “N’ihi na ana m agwa unu n’ezie” preserves both γάρ and ἀμήν in idiomatic Standard Igbo.
  - severity: low
    issue: “Yọta” is not the clearest form of the Greek letter name.
    rationale: Using “iota” retains the Greek technical term directly and is more readily identifiable; the footnote continues to explain it.
  - severity: low
    issue: The second alternative in footnote c is unnatural.
    rationale: “Ihe niile ga-abịa na mmezu” is less idiomatic than “ihe niile ga-eru mmezu,” while both communicate the accomplishment sense as an alternative.
