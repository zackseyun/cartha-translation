id: MAT.5.18
reference: Matthew 5:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: ig
  text: 'N’ihi na ana m agwa unu n’ezie: ruo mgbe eluigwe na ụwa ga-agabiga, otu iota[a] ma ọ bụ otu obere akara[b] agaghị apụ n’Iwu ahụ ma ọlị, ruo mgbe ihe niile ga-eme[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Iota bụ aha otu mkpụrụedemede Grik, nke bụ mkpụrụedemede kacha nta. A pụkwara ịsụgharị ya, “otu mkpụrụedemede kacha nta.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, obere ahịrị ma ọ bụ ntụpọ e ji eme ka otu mkpụrụedemede dị iche n’ibe ya.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ruo mgbe a ga-emezu ihe niile,” ma ọ bụ, “ruo mgbe ihe niile ga-eru mmezu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: n’ezie
  rationale: N’okwu Jizọs, okwu a bụ nkwenye siri ike nke na-ebute okwu nwere ikike; “n’ezie” na-egosipụta ike ya n’Igbo doro anya.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-ejikọta amaokwu a na nke bu ya ụzọ dịka nkọwa ma ọ bụ ihe na-akwado okwu ahụ.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a bụ ntụgharị kpọmkwem ma dịkwa n’Igbo nkịtị, na-edobe ụda okwu Jizọs nke nwere ikike.
- source_word: ἕως ἂν παρέλθῃ
  choice: ruo mgbe ... ga-agabiga
  rationale: Ọ na-egosi ihe a na-atụ anya ya n’ọdịnihu, ma na-edobe ihe atụ nke eluigwe na ụwa ịgabiga.
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: eluigwe na ụwa
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọwa okwu ahụ nwere obosara nke ihe niile e kere eke.
- source_word: ἰῶτα ἓν
  choice: otu yọta
  rationale: A hapụrụ aha mkpụrụedemede Grik ahụ ka nkọwa ya ghara ịla n’iyi; ihe odide ala peeji kọwara na ọ bụ mkpụrụedemede kacha nta.
- source_word: μία κεραία
  choice: otu obere akara
  rationale: Ọ na-ezo aka n’obere ahịrị ma ọ bụ ntụpọ e ji amata mkpụrụedemede; okwu a doro ndị na-agụ Igbo taa anya.
- source_word: οὐ μὴ παρέλθῃ
  choice: agaghị apụ ... ma ọlị
  rationale: “Ma ọlị” na-ebute nkwusioru siri ike nke οὐ μή, ebe “apụ” na-arụ ọrụ nke ọma n’Igbo mgbe a na-ekwu maka ihe dị n’iwu na-agaghị efu.
- source_word: ἀπὸ τοῦ νόμου
  choice: n’Iwu ahụ
  rationale: Mkpụrụedemede ukwu na “ahụ” na-egosi iwu Akwụkwọ Nsọ a kpọtụrụ aha n’ọnọdụ a, n’agbanyeghị na isi okwu Grik n’onwe ya anaghị akọwapụta ókè ya niile.
- source_word: ἕως ἂν πάντα γένηται
  choice: ruo mgbe ihe niile ga-eme
  rationale: Nke a na-edobe obosara γένηται dịka ihe ime ma ọ bụ ịbịa n’eziokwu, na-enweghị imechi ya naanị n’echiche nke mmezu.
theological_decisions:
- issue: Ihe νόμος pụtara n’okwu Jizọs
  choice: “Iwu ahụ” dịka iwu Chineke dị n’Akwụkwọ Nsọ
  alternative: Iwu Mozis/Tora kpọmkwem, ma ọ bụ Akwụkwọ Nsọ Ochie dum site n’ịgbasa ihe ọ na-ezo aka na ya
  rationale: Matiu 5:17–19 na-ekwu banyere “Iwu na Ndị Amụma.” Isiokwu ahụ na-edobe naanị ihe Grik kwuru, ma ọ naghị ekpebi ma ebe a ọ bụ naanị Tora ka ọ bụ Akwụkwọ Nsọ Ochie n’obosara.
- issue: Ike na obosara nke πάντα γένηται
  choice: “ruo mgbe ihe niile ga-eme”
  alternative: “ruo mgbe a ga-emezu ihe niile”
  rationale: γίνομαι nwere ike ịpụta ihe ime, ịbịa n’eziokwu, ma ọ bụ—n’ọnọdụ a—imezu. A họọrọ okwu sara mbara n’isi amaokwu, tinyezie nghọta nke mmezu n’ihe odide ala peeji, ka e ghara idozi esemokwu nkọwa n’amaghị ama.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ debere usoro nkwupụta siri ike nke Jizọs, jiri “ma ọlị” gosipụta nkwusioru Grik siri ike, ma zere okwu ụka nke otu ọgbakọ pụrụ iche.
