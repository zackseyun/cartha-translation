id: MAT.5.5
reference: Matthew 5:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: ig
  text: Ngọzi na-adịrị ndị dị nwayọọ[b], n’ihi na ọ bụ ha ga-eketa ụwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ala.” O yikarịrị ka ahịrịokwu a na-ekwughachi Abụ Ọma 37:11, ebe a pụrụ ịghọta nkwa ahụ dịka nke metụtara ala e kwere n’ọgbụgba ndụ nakwa dịka nkwa sara mbara karị.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ndị dị umeala n’obi.” “Ndị dị nwayọọ” n’ebe a pụtara ndị dị umeala ma dị nwayọọ n’omume, ọ bụghị ndị na-adịghị ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Ngọzi na-adịrị
  rationale: Nke a na-egosi ihu ọma na ndụ ọma sitere n’aka Chineke, kama ịkọwa naanị mmetụta obi ụtọ.
- source_word: οἱ πραεῖς
  choice: ndị dị umeala n’obi
  rationale: Ọ na-egosi ịdị nwayọọ na ịdị umeala n’obi, ọ bụghị adịghị ike ma ọ bụ ụjọ. Nke a bụ okwu Igbo dị mfe nghọta ma kwesịkwa ekwesị n’ebe a.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe mere ngọzi ahụ ji dịrị ha, n’asụsụ Igbo nke oge a doro anya.
- source_word: αὐτοὶ
  choice: ọ bụ ha
  rationale: Nhazi a na-egosipụta nkwusi ike dị na nnọchiaha Grik ahụ n’ụzọ Igbo sitere n’okike.
- source_word: κληρονομήσουσι
  choice: ga-eketa
  rationale: Ọ na-echekwa echiche nke ịnata ihe dịka ihe nketa na asụsụ nkwa.
- source_word: τὴν γῆν
  choice: ụwa
  rationale: γῆ pụrụ ịpụta ụwa ma ọ bụ ala. “Ụwa” dabara n’echiche sara mbara nke nkwa ahụ, ebe e debere “ala” dị ka nhọrọ ọzọ n’okpuru ederede.
theological_decisions:
- issue: Oke ihe τὴν γῆν na-ezo aka na ya
  choice: ụwa
  alternative: ala
  rationale: Okwu Grik ahụ nwere ike izo aka n’ụwa niile ma ọ bụ n’ala e kwere ná nkwa. Isi ederede ji “ụwa” gosipụta nkwa sara mbara, ebe nkọwa ala peeji na-echekwa njikọ o nwere ike inwe na Abụ Ọma 37:11 na echiche ala ọgbụgba ndụ.
- issue: Ihe οἱ πραεῖς pụtara
  choice: ndị dị umeala n’obi
  alternative: ndị dị nwayọọ
  rationale: Nhọrọ bụ isi na-ejikọta ịdị umeala n’obi na ịdị nwayọọ, na-enweghị ime ka okwu ahụ pụta adịghị ike. Nhọrọ ọzọ na-echekwa akụkụ ịdị nwayọọ nke okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. Nhazi “ọ bụ ha” na-echekwa nkwusi ike nke αὐτοὶ, ebe nkọwa ala peeji na-echekwa nghọta abụọ nke γῆ na ọdịiche dị n’etiti ịdị umeala n’obi na adịghị ike.
