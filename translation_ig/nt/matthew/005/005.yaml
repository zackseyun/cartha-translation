review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the beatitude formula, the causal clause, emphatic pronoun, future inheritance, and the deliberate earth/land ambiguity. However, “ndị dị umeala n’obi” primarily denotes the humble rather than the πραεῖς, whose central sense is meek/gentle. The main text should retain gentleness/meekness rather than broaden it into humility of heart.
  naturalness: “Ngọzi na-adịrị …” and “ọ bụ ha ga-eketa ụwa” are natural, dignified Standard Igbo. “Ndị dị nwayọọ” is a more direct and natural rendering of the substantival adjective in this context.
  terminology: Revise the principal term for οἱ πραεῖς to “ndị dị nwayọọ.” Retain “ndị dị umeala n’obi” only as a qualified alternative in the note, since it captures an associated quality but is not the closest lexical equivalent. The earth/land note should express the possible covenantal-land sense without deciding the scope.
  issues:
  - severity: medium
    issue: The main rendering of οἱ πραεῖς is overly narrowed to humility.
    rationale: “Ndị dị umeala n’obi” naturally translates ‘the humble’ and does not itself adequately convey the gentleness/meekness denoted by πραεῖς. “Ndị dị nwayọọ” directly preserves the Greek term’s key semantic component and avoids importing a more specific phrase from Matthew 5:3.
  revised_text: Ngọzi na-adịrị ndị dị nwayọọ[b], n’ihi na ọ bụ ha ga-eketa ụwa[a].
