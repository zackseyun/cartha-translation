    text: 'N’asụsụ Grik, okwu a bụ ụdị ọtụtụ: “n’eluigwe.” Matiu na-ejikarị ụdị ọtụtụ ebe Igbo na-asịkarị “eluigwe.”'
    reason: lexical_alternative
  revision_rationale: The revision makes the two Greek imperatives parallel and idiomatic in Standard Igbo, clarifies that the prophets preceded the audience, and corrects the footnote so it reports the Greek plural without introducing the unsupported idea of separate heavens. It retains the natural singular Igbo “n’eluigwe” and does not resolve any doctrinal question.
