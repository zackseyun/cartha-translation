revisions:
- from: Ṅụrịanụ ọṅụ, nwekwanụ aṅụrị dị ukwuu, n’ihi na nnukwu ụgwọ ọrụ unu dị n’eluigwe[a]; n’ihi na ọ bụ otu a ka ha si kpagbuo ndị amụma ndị buru unu ụzọ.
  to: Ṅụrịanụ ọṅụ, ṅụrịanụkwa ọṅụ nke ukwuu, n’ihi na nnukwu ụgwọ ọrụ unu dị n’eluigwe[a]; n’ihi na otu a ka ha si kpagbuo ndị amụma ndị bu unu ụzọ.
  rationale: The revision makes the two Greek imperatives parallel and idiomatic in Standard Igbo, clarifies that the prophets preceded the audience, and corrects the footnote so it reports the Greek plural without introducing the unsupported idea of separate heavens. It retains the natural singular Igbo “n’eluigwe” and does not resolve any doctrinal question.
