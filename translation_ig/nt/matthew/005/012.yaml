review_pass:
  verdict: revise
  source_fidelity: The draft conveys the two imperatives, the greatness and heavenly location of the reward, and the comparison with the earlier persecution of the prophets. However, the second imperative is more naturally and directly rendered as a further command to rejoice, and the footnote inaccurately turns the Greek plural into ‘different heavens.’
  naturalness: “Ṅụrịanụ ọṅụ” is understandable Standard Igbo, but “nwekwanụ aṅụrị dị ukwuu” is less idiomatic as a parallel imperative. “ṅụrịanụkwa ọṅụ nke ukwuu” is natural, retains the intensification of ἀγαλλιᾶσθε, and preserves the paired commands. “Ndị bu unu ụzọ” idiomatically denotes predecessors more directly than “ndị buru unu ụzọ.”
  terminology: “Ụgwọ ọrụ,” “eluigwe,” “ndị amụma,” and “kpagbuo” are appropriate Standard Igbo renderings in this context. The plural Greek οὐρανοῖς should be described as a grammatical plural, not as multiple distinct heavens.
  issues:
  - severity: medium
    issue: Footnote renders the Greek plural as “n’eluigwe dị iche iche.”
    rationale: “Different heavens” adds a sense of distinct heavens not expressed by τοῖς οὐρανοῖς. The note should simply identify the Greek plural form and explain that Igbo normally uses “eluigwe” here.
  - severity: low
    issue: The second imperative is rendered “nwekwanụ aṅụrị dị ukwuu.”
    rationale: This is comprehensible but less direct and less idiomatic than an imperative explicitly calling for intensified rejoicing; the Greek has a second present imperative.
  - severity: low
    issue: “Ndị buru unu ụzọ” can suggest those who led the audience.
    rationale: The phrase refers to prophets who preceded the audience historically. “Ndị bu unu ụzọ” more directly expresses predecessors in this context.
  revised_text: Ṅụrịanụ ọṅụ, ṅụrịanụkwa ọṅụ nke ukwuu, n’ihi na nnukwu ụgwọ ọrụ unu dị n’eluigwe[a]; n’ihi na otu a ka ha si kpagbuo ndị amụma ndị bu unu ụzọ.
  revised_footnotes:
