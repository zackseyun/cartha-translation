  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: ig
  text: Ṅụrịanụ ọṅụ, ṅụrịanụkwa ọṅụ nke ukwuu, n’ihi na nnukwu ụgwọ ọrụ unu dị n’eluigwe[a]; n’ihi na otu a ka ha si kpagbuo ndị amụma ndị bu unu ụzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, okwu a bụ ụdị ọtụtụ: “n’eluigwe.” Matiu na-ejikarị ụdị ọtụtụ ebe Igbo na-asịkarị “eluigwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρετε
  choice: Ṅụrịanụ ọṅụ
  rationale: Ngwaa iwu dị n’ọnụọgụ ọtụtụ na-akpọ ndị a na-agwa okwu ka ha ṅụrịa ọṅụ; “-nụ” na-egosi na a na-agwa ọtụtụ mmadụ okwu.
- source_word: ἀγαλλιᾶσθε
  choice: nwekwanụ aṅụrị dị ukwuu
  rationale: Nke a na-eme ka ike ọṅụ dị na ngwaa nke abụọ pụta ìhè n’Igbo dị mfe nghọta, ma na-edowe ya iche n’iwu mbụ.
- source_word: μισθὸς
  choice: ụgwọ ọrụ
  rationale: N’ọnọdụ a ọ pụtara ihe ọma Chineke ga-eji kwụọ ndị a na-akpagbu ụgwọ, ọ bụghị naanị ụgwọ ọnwa; “ụgwọ ọrụ” bụ okwu Igbo a na-aghọta nke ọma maka reward.
- source_word: πολὺς
  choice: nnukwu
  rationale: “Nnukwu” na-egosi ịdị ukwuu nke ụgwọ ọrụ ahụ n’ụzọ e ji ekwu Igbo ugbu a.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: n’eluigwe
  rationale: Ọ bụ ezie na Grik ji ụdị ọtụtụ, Igbo na-ejikarị “eluigwe” otu a akọwa ebe nke Chineke n’ụzọ ebumpụta ụwa.
- source_word: οὕτως
  choice: ọ bụ otu a
  rationale: Nkebiokwu a na-egosi ụzọ ma ọ bụ ụdị mkpagbu ahụ, ya bụ, otu ụzọ ahụ e si kpagbuo ndị amụma.
- source_word: ἐδίωξαν
  choice: ha si kpagbuo
  rationale: N’ebe a διώκω pụtara imegide na ịta ahụhụ n’ihi okwukwe, nke “kpagbuo” na-egosipụta nke ọma.
- source_word: προφήτας
  choice: ndị amụma
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị amụma nke Akwụkwọ Nsọ.
- source_word: τοὺς πρὸ ὑμῶν
  choice: ndị buru unu ụzọ
  rationale: Ọ na-egosi ndị amụma biri tupu ndị na-eso ụzọ ahụ, n’Igbo dị nkenke ma doo anya.
theological_decisions:
- issue: Ihe “n’eluigwe” pụtara na ụdị ọtụtụ nke okwu Grik
  choice: A sụgharịrị ya “n’eluigwe,” ebe ụgwọ ọrụ ha dị n’aka Chineke.
  alternative: “n’eluigwe dị iche iche” ma ọ bụ ntụgharị na-agbasochi ụdị ọtụtụ nke Grik anya
  rationale: Igbo anaghị achọ ụdị ọtụtụ iji zipụta echiche a. Nhọrọ a anaghị ekpebi esemokwu ozizi, kama ọ na-enye otu echiche ahụ n’Igbo nkịtị, ebe nkọwa ala peeji na-echekwa ozi banyere ụdị Grik.
- issue: Njikọ dị n’etiti mkpagbu ndị na-eso ụzọ na nke ndị amụma
  choice: “ọ bụ otu a ka” na-egosi na ụdị mmegide ahụ kwekọrọ n’ụzọ e si kpagbuo ndị amụma.
  alternative: Ịsụgharị ya naanị dịka “n’ihi na ha kpagburu” n’enweghị igosi ntụnyere ụzọ
  rationale: οὕτως na-egosi ụzọ ma ọ bụ manner; idebe nke a na-echekwa ntụnyere Jizọs mere n’enweghị ịgbakwunye nkọwa ozizi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “-nụ” gosi na iwu abụọ ahụ bụ maka ọtụtụ mmadụ, ma zere okwu ochie ma ọ bụ nke otu ụka pụrụ iche.
