  text: Ἠκούσατε ὅτι ἐρρέθη· Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ καὶ ὀδόντα ἀντὶ ὀδόντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/038.yaml
  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: ig
  text: “Unu anụla na e kwuru sị, ‘Anya maka anya, ezé maka ezé.’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kpọmkwem karịa, “Anya n’ọnọdụ anya, ezé n’ọnọdụ ezé.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Unu anụla
  rationale: Oge aorist dị n'usoro okwu Matiu a na-ezo aka n'ihe ndị na-ege ntị nụrụ ma mara dị ka ozizi e nyefere ha; ‘Unu anụla’ bụ Igbo ebumpụta ụwa nke na-egosi na ihe ahụ ha nụrụ ka metụtara ha ugbu a.
- source_word: ὅτι ἐρρέθη
  choice: na e kwuru sị
  rationale: Nke a na-edobe ụdị okwu na-enweghị onye kpọmkwem dị ka onye kwuru ya, ma ‘sị’ na-ewebata ihe e kwuru n'ụzọ Igbo doro anya.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: Anya n’ọnọdụ anya
  rationale: ‘N’ọnọdụ’ na-egosipụta ngbanwe ma ọ bụ ihe kwekọrọ n’ihe ọzọ, nke bụ isi ọrụ ἀντί n’usoro iwu a, na-enweghị ịkọwa ma mmeghachi ahụ ọ bụ kpọmkwem ma ọ bụ naanị nha anya.
- source_word: καὶ ὀδόντα ἀντὶ ὀδόντος
  choice: ezékwa n’ọnọdụ ezé
  rationale: ‘-kwa’ na-ejikọta akụkụ nke abụọ na nke mbụ n'ụzọ Igbo dị mfe, ebe nkwughachi ‘n’ọnọdụ’ na-edobe nhazi abụọ yiri ibe ha nke isi mmalite ahụ.
theological_decisions:
- issue: Otu e si asụ ụkpụrụ iwu nke mmeghachi kwekọrọ n'ihe e mere
  choice: Anya n’ọnọdụ anya, ezékwa n’ọnọdụ ezé
  alternative: Anya maka anya, ezékwa maka ezé
  rationale: Nhọrọ a na-edobe echiche ἀντί nke ịnọchi ma ọ bụ ikwekọ, ma ọ naghị etinye nkọwa ọzọ banyere ma iwu ahụ chọrọ mmegwara nkịtị ma ọ bụ na ọ na-amachi mmegwara ka ọ ghara ịgafe ihe e mere.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E ji ‘Unu’ kwupụta onye nke abụọ n'ụbara dị na Grik. E debere usoro okwu ahụ nkenke dịka ilu iwu a maara ama.
