  verdict: revise
  source_fidelity: The draft correctly represents the plural address, the formulaic passive statement, and the balanced legal maxim. ‘Maka’ is an accurate and more idiomatic Standard Igbo equivalent for ἀντί in this fixed expression; the footnote retains the more explicit substitutional sense, ‘n’ọnọdụ.’
  naturalness: ‘Anya maka anya, ezé maka ezé’ is the clearest, most natural, and appropriately proverbial/legal Standard Igbo form. It also preserves the compact parallelism of the Greek better than the draft’s primary wording. ‘E kwuru sị’ is retained as a natural impersonal citation formula.
  terminology: ‘Anya’ and ‘ezé’ are correct. The revision does not interpret the maxim as requiring either literal retaliation or merely proportional compensation.
