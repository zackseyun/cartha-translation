    issue: Primary rendering ‘Anya n’ọnọdụ anya, ezékwa n’ọnọdụ ezé’ is less idiomatic and slightly less balanced as a legal maxim.
    rationale: Although ‘n’ọnọdụ’ can convey substitution, ‘maka’ is the established natural Igbo form for this concise reciprocal formula. Repeating ‘ezé’ without enclitic -kwa better reflects the Greek’s simple καί (‘and’) and maintains exact parallelism.
  - severity: low
    issue: The footnote wording is less precise than the English audit trail’s stated purpose.
