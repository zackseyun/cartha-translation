source:
  edition: SBLGNT
  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: ig
  text: Onye chọrọ ịgba gị akwụkwọ n’ụlọikpe[a] iji were uwe ime gị[b], hapụkwa ya uwe elu gị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ịkpọga gị n’ụlọikpe.” N’ụzọ nkịtị, okwu Grik ahụ na-ekwu, “ka e kpee gị ikpe”; n’ebe a, ọ na-ekwu maka ịkpọ mmadụ n’ụlọikpe.
    reason: lexical_alternative
  - marker: b
    text: “Uwe ime” ebe a bụ uwe a na-eyi nso n’ahụ, ebe “uwe elu” bụ akwa a na-eyi n’elu ya.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: Onye chọrọ
  rationale: Nkebi a na-arụ ọrụ dị ka aha ma na-ezo aka n’onye ọ bụla n’ozuzu ya; “onye chọrọ” bụ Igbo dị mfe ma na-edobe echiche nke ọchịchọ dị na θέλω.
- source_word: σοι κριθῆναι
  choice: ịgba gị akwụkwọ n’ụlọikpe
  rationale: N’asụsụ Grik, okwu a na-ekwu kpọmkwem banyere ikpe mmadụ n’ọnọdụ iwu. N’ebe a, ebumnuche ya bụ iwere uwe onye ahụ, ya mere okwu Igbo a na-egosi ịmalite ikpe megide mmadụ n’ụlọikpe.
- source_word: χιτῶνά
  choice: uwe ime
  rationale: χιτών bụ uwe a na-eyi n’ime, nso n’ahụ. “Uwe ime” na-eme ka ọdịiche ya na uwe elu pụta ìhè, ma nkọwa ala peeji na-egbochi nghọta ya dị ka naanị uwe ndị a na-akpọ underwear taa.
- source_word: λαβεῖν
  choice: ka o were
  rationale: λαμβάνω n’ebe a pụtara inweta ma ọ bụ iwere ihe ahụ dịka ihe onye meriri n’ikpe ga-enweta; “were” bụ okwu Igbo kwụ ọtọ dabara n’ọnọdụ a.
- source_word: ἄφες αὐτῷ
  choice: hapụkwara ya
  rationale: Iwu a sitere na ἀφίημι na-agwa onye a na-ekwu okwu ka ọ ghara ijigide uwe elu ahụ kama ka onye nke ọzọ nweta ya. “Hapụkwara ya” na-edobe ike iwu ahụ n’enweghị ịgbakwunye usoro iwu ọzọ.
- source_word: ἱμάτιον
  choice: uwe elu
  rationale: ἱμάτιον bụ uwe a na-eyi n’elu χιτών. “Uwe elu” na-egosi ọdịiche ahụ n’Igbo dị ugbu a; nkọwa ala peeji na-akọwa ọnọdụ omenala ya.
- source_word: καὶ ... καὶ
  choice: — ... -kwara
  rationale: καί nke mbụ jikọtara okwu a na nkuzi bu ya ụzọ, nke a na-aghọta site n’usoro amaokwu; mgbakwunye “-kwara” na “hapụkwara” na-edobe ike καί nke abụọ, ya bụ inye uwe elu ahụ kwa.
theological_decisions:
- issue: Ike ụkpụrụ omume dị n’iwu Jizọs banyere esemokwu n’ụlọikpe
  choice: E depụtara ya dịka iwu doro anya nke ịhapụ ịbọ ọbọ na nke njikere inyefe ihe ọzọ kwa.
  alternative: Ịsụgharị ya naanị dịka ụkpụrụ sara mbara banyere ịhapụ ihe ruuru mmadụ.
  rationale: Ụdị iwu ἄφες na ihe atụ doro anya nke uwe abụọ ahụ na-eme ka okwu ahụ dị nkọ ma bụrụ ihe a na-akpọ onye na-ege ntị ka o mee. Nsụgharị ahụ anaghị eme ka iwu ahụ dị nro ma ọ bụ tinye nkọwa otu ụka pụrụ iche.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe ma dị ùgwù, dee amaokwu ahụ. “Ịgba mmadụ akwụkwọ n’ụlọikpe” bụ okwu a na-aghọta nke ọma maka ịmalite ikpe megide mmadụ. E debere ọdịiche omenala dị n’etiti χιτών na ἱμάτιον site na “uwe ime” na “uwe elu,” tinyere nkọwa ala peeji iji gbochie nghọtahie.
