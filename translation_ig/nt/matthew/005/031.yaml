  terminology: ‘ịgba alụkwaghịm’ and ‘akwụkwọ ịgba alụkwaghịm’ are appropriate modern legal-marital terms. The footnote’s lexical alternatives should identify the Greek verb specifically rather than present an incomplete alternative quotation.
