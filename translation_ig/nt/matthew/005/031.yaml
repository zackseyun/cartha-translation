source:
  edition: SBLGNT
  text: Ἐρρέθη ⸀δέ· Ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ, δότω αὐτῇ ἀποστάσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: ig
  text: Ma e kwuru, sị, “Onye ọ bụla nke gbara nwunye ya alụkwaghịm, ya nye nwunye ya akwụkwọ ịgba alụkwaghịm.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ngwaa Grik ahụ, ἀπολύσῃ, dịka “chụpụ” ma ọ bụ “hapụ ka ọ laa.” Ma n’ọnọdụ iwu alụmdi na nwunye ebe a, ọ na-ezo aka n’ịgba alụkwaghịm.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη
  choice: e kwukwara
  rationale: Usoro a na-egosi na e kwuru okwu ahụ dịka okwu e hotara; “e kwuru” bụ Igbo doro anya, ebe “-kwara” na δέ na-egosi ntụgharị gaa n'okwu ọzọ.
- source_word: δέ
  choice: Ma ... -kwara
  rationale: “Ma” na-egosi mgbanwe ma ọ bụ ntakịrị ọdịiche n'ihe bu ụzọ, ebe “-kwara” na-eme ka okwu ahụ bụrụ nke eke n'Igbo.
- source_word: Ὃς ἂν
  choice: Onye ọ bụla nke
  rationale: Nke a na-egosipụta ọnọdụ izugbe na-adịghị akọwa otu onye kpọmkwem.
- source_word: ἀπολύσῃ
  choice: gbara ... alụkwaghịm
  rationale: Ọ bụ ezie na ngwaa Grik ahụ nwekwara ike ịpụta ‘chụpụ’ ma ọ bụ ‘hapụ ka ọ laa,’ n'ọnọdụ iwu alụmdi na nwunye a ọ na-ezo aka n'ịgba alụkwaghịm.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: nwunye ya
  rationale: Ọnọdụ okwu na ihe onye ahụ ji ya mee na-egosi na γυνή pụtara nwunye, ọ bụghị naanị nwanyị.
- source_word: δότω
  choice: ya nye
  rationale: Nke a na-echekwa iwu e nyere onye nke atọ n'ụzọ dị mkpirikpi ma bụrụkwa Igbo a na-aghọta nke ọma.
- source_word: αὐτῇ
  choice: ya
  rationale: N'usoro “nye ya,” nnọchiaha a bụ onye a na-enye akwụkwọ ahụ, ya bụ nwunye ahụ.
- source_word: ἀποστάσιον
  choice: akwụkwọ ịgba alụkwaghịm
  rationale: Nhọrọ a na-egosi nke ọma na ọ bụ akwụkwọ iwu na-akwado ịgba alụkwaghịm, ọ bụghị naanị omume ịgba alụkwaghịm.
theological_decisions:
- issue: Mmekọrịta okwu Jizọs na ndokwa iwu Mosis banyere ịgba alụkwaghịm
  choice: E depụtara ya dịka okwu iwu e hotara, n'etinyeghị na amaokwu a ma Jizọs ọ kwadoro ya ma ọ bụ katọọ ya.
  alternative: Ịsụgharị ya dịka iwu Jizọs kwadoro kpọmkwem, ma ọ bụ dịka naanị nkọwa banyere ozizi ndị mmadụ.
  rationale: Amaokwu a na-ebute okwu ọdịnala Jizọs ga-aza n'amaokwu na-esote; ya mere, nsụgharị ahụ kwesịrị ichekwa esemokwu nkà mmụta okpukpe ahụ kama idozi ya n'amaghị ama.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ụdị okwu iwu e hotara, na-enweghị itinye nkọwa ụka pụrụ iche.
