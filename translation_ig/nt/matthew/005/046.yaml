id: MAT.5.46
reference: Matthew 5:46
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: ig
  text: N’ihi na ọ bụrụ na unu ahụ ndị hụrụ unu n’anya, ụgwọ ọrụ gịnị ka unu nwere?[a] Ọ̀ bụ na ọbụna ndị na-anakọta ụtụ isi anaghị eme otu ihe ahụ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụgwọ a na-akwụ mmadụ gịnị ka unu nwere?” Okwu Grik a nwere ike ịpụta ụgwọ a na-akwụ mmadụ ma ọ bụ ụgwọ ọrụ/nkwụghachi; n’ebe a, ọ na-ekwu maka ihe a na-enweta n’ihi omume n’ime ozizi Jizọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: “N’ihi na” na-ejikọ okwu a na ihe bu ya ụzọ, ebe “ọ bụrụ na” na-egosi ọnọdụ e kwuru maka ya.
- source_word: ἀγαπήσητε
  choice: unu ahụ ... n’anya
  rationale: Oge dị ugbu a n’Igbo na-enye ọnọdụ izugbe nke aorist subjunctive sochiri ἐάν n'ụzọ ebumpụta ụwa.
- source_word: τοὺς ἀγαπῶντας ὑμᾶς
  choice: ndị hụrụ unu n’anya
  rationale: Nke a na-egosi ìgwè ndị omume ha—ịhụ ndị a na-agwa okwu n’anya—kọwara, ma na-edokwa myirịta okwu ἀγαπάω n'akụkụ abụọ ahụ.
- source_word: τίνα μισθὸν ἔχετε
  choice: ụgwọ ọrụ gịnị ka unu nwere?
  rationale: “Ụgwọ ọrụ” nwere ike ịpụta ụgwọ a na-akwụ ma ọ bụ ihe nkwụghachi/onyinye e nyere n’ihi omume; ya mere ọ na-echekwa obosara μισθός na esemokwu dị n’okwu a.
- source_word: οὐχὶ
  choice: Ọ̀ bụ na ... adịghị
  rationale: Ụdị ajụjụ a n’Igbo bụ ajụjụ nkwupụta nke na-atụ anya azịza nkwenye, dịka οὐχί si arụ ọrụ ebe a.
- source_word: καὶ
  choice: ọbụna
  rationale: “Ọbụna” na-egosipụta ike nkwusi okwu nke καί n’iji ndị ọna ụtụ isi tụnyere ndị na-ege ntị.
- source_word: τελῶναι
  choice: ndị ọna ụtụ isi
  rationale: Ọ bụ okwu Igbo doro anya maka ndị na-anakọta ụtụ isi ma ọ bụ ụgwọ ụzọ n’ọnọdụ akụkọ a.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: eme otu ihe ahụ
  rationale: Nke a bụ ntụgharị Igbo dị mfe ma zuru oke nke “ime otu ihe ahụ.”
theological_decisions:
- issue: Ihe μισθός pụtara n’ozizi omume Jizọs
  choice: ụgwọ ọrụ
  alternative: nkwụghachi ụgwọ; ụgwọ ọnwa
  rationale: “Ụgwọ ọrụ” na-echekwa echiche nke ihe a na-enweta n’ihi omume, ma ọ naghị ekpebi ma ọ bụ tinye ozizi pụrụ iche banyere otu mmadụ si enweta ihu ọma Chineke.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “unu” mee ka ọnụọgụ ọtụtụ nke ὑμεῖς pụta ìhè; e zere okwu chọọchị pụrụ iche.
