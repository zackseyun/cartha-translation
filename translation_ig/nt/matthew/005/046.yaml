- from: N’ihi na ọ bụrụ na unu ahụ naanị ndị hụrụ unu n’anya, ụgwọ ọrụ gịnị ka unu nwere?[a] Ọ̀ bụ na ọbụna ndị ọna ụtụ isi adịghị eme otu ihe ahụ?
  to: N’ihi na ọ bụrụ na unu ahụ ndị hụrụ unu n’anya, ụgwọ ọrụ gịnị ka unu nwere?[a] Ọ̀ bụ na ọbụna ndị na-anakọta ụtụ isi anaghị eme otu ihe ahụ?
  rationale: Removed the unsupported restrictive “naanị,” replaced the tax-collector expression with a clearer modern Standard Igbo phrase, and lightly clarified the lexical footnote while preserving μισθός’s range of ‘wages/pay’ and ‘reward/recompense.’
