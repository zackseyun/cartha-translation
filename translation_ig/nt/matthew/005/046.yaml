review_pass:
  verdict: revise
  source_fidelity: The adverb “naanị” (“only”) has no counterpart in the Greek and narrows the conditional statement. It should be removed. The rhetorical question and the emphatic comparison with tax collectors are otherwise retained.
  naturalness: The revised wording is natural Standard Igbo. “Ndị na-anakọta ụtụ isi” is a transparent, contemporary designation and avoids uncertainty over the less widely transparent occupational term “ndị ọnaụtụ.” “Ọ̀ bụ na ọbụna … anaghị eme …?” naturally conveys a question expecting an affirmative answer.
  terminology: “Hụrụ … n’anya” appropriately renders ἀγαπάω in both clauses, preserving the verbal correspondence. “Ụgwọ ọrụ” suitably renders μισθός in this context, while the footnote preserves the possible ‘wages/pay’ sense without settling a theological interpretation.
  issues:
  - severity: medium
    issue: The draft adds “naanị” (“only”) in the first clause.
    rationale: The source says, “if you love those who love you,” not “if you love only those who love you.” Although reciprocal love is the point of the saying, the restrictive adverb is an interpretive addition and should not be supplied.
  - severity: low
    issue: “Ndị ọna ụtụ isi” is less clear and its spacing is nonstandard/unstable.
    rationale: “Ndị na-anakọta ụtụ isi” is unambiguous modern Standard Igbo for τελῶναι and retains the historical occupation without adding evaluative language.
  revised_text: N’ihi na ọ bụrụ na unu ahụ ndị hụrụ unu n’anya, ụgwọ ọrụ gịnị ka unu nwere?[a] Ọ̀ bụ na ọbụna ndị na-anakọta ụtụ isi anaghị eme otu ihe ahụ?
