  source_fidelity: 'The draft retains the principal elements: the connective, opening his mouth, teaching an unspecified “them,” and the speech-introducing participle. However, “na-ezikwa” is not an appropriate past narrative rendering of ἐδίδασκεν here: it carries a present/progressive form and the enclitic -kwa (“also/too”), which is not expressed by the Greek.'
  naturalness: “O wee meghee ọnụ ya, na-ezi ha ihe, sị:” is natural, dignified Standard Igbo biblical narrative. It preserves the formal mouth-opening idiom while using the progressive teaching form without the unwarranted additive nuance.
