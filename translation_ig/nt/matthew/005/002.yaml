  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara akpaalaokwu 'meghee ọnụ ya' na nnọchiaha 'ha,' ebe a gosipụtara ịdị na-aga n'ihu nke ἐδίδασκεν site na 'na-ezikwa ha ihe.'
