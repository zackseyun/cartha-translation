  yaml_path: translation/nt/matthew/005/002.yaml
  text: 'And he opened his mouth and taught them[a], saying:'
translation:
  language: ig
  text: 'O wee meghee ọnụ ya, na-ezi ha ihe, sị:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: O wee
  rationale: Na-ejikọta amaokwu a na ihe bu ya ụzọ n'ụzọ nkịtị n'Igbo, na-enweghị ịgbakwunye ike oge nke okwu Grik ahụ na-enweghị.
- source_word: ἀνοίξας
  choice: meghee
  rationale: Na-echekwa ihe participle a pụtara kpọmkwem, ya bụ imeghe, ma tinye ya n'usoro ahịrịokwu Igbo nke na-aga were were.
- source_word: τὸ στόμα αὐτοῦ
  choice: ọnụ ya
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu ahụ n'ụzọ nkịtị, ma ọ ka na-echekwa akpaalaokwu dị n'asụsụ isi nke na-ebute okwu e kwuru n'ụzọ dị nsọ ma ọ bụ n'ụzọ iwu kwadoro.
- source_word: ἐδίδασκεν
  choice: na-ezikwa ha ihe
  rationale: Ụdị ngwaa na-aga n'ihu na-egosi omume gara aga nke nọ na-aga n'ihu. 'Na-ezi ... ihe' bụ Igbo nkịtị maka ịkụzi, ma '-kwa' na-ejikọta omume a na imeghe ọnụ ya.
- source_word: αὐτοὺς
  choice: ha
  rationale: Na-echekwa nnọchiaha ahụ n'enweghị ikpebi n'amaokwu a naanị ma ọ bụ ndị na-eso ụzọ ya ka ọ bụ ìgwè mmadụ niile.
- source_word: λέγων
  choice: sị
  rationale: Ọ bụ ụzọ Igbo doro anya ma dị mfe isi webata ọdịnaya nke ihe ọ na-ezi, kwekọrọ na participle Grik ahụ.
