id: MAT.5.10
reference: Matthew 5:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: ig
  text: Ngọzi na-adịrị ndị a kpagburu n’ihi ezi omume[a], n’ihi na alaeze eluigwe bụ nke ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ihi ikpe ziri ezi.” Okwu Grik ahụ pụrụ ịgụnye ma ibi ndụ n’ụzọ ziri ezi ma ime ka ikpe ziri ezi guzosie ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Ngọzi na-adịrị
  rationale: Nke a na-egosipụta nkwupụta banyere ọnọdụ ngọzi sitere n’aka Chineke, kama ịbụ naanị mmetụta obi ụtọ.
- source_word: οἱ δεδιωγμένοι
  choice: ndị a kpagburu
  rationale: 'Ọ na-egosipụta participle zuru oke nke passive: ndị e kpagburu, ndị nsonaazụ mkpagbu ahụ ka metụtara.'
- source_word: ἕνεκεν
  choice: n’ihi
  rationale: Ọ bụ ụzọ Igbo doro anya ma bụrụ nke e ji eme ihe ugbu a iji gosi ihe kpatara mkpagbu ahụ.
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: N’ebe a, okwu ahụ na-egosi ibi ndụ kwekọrọ n’uche Chineke na ime ihe ziri ezi; nkọwa ọzọ nke metụtara ikpe ziri ezi ka edobere n’ala peeji.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe mere e ji kwuo na ngọzi na-adịrị ha.
- source_word: αὐτῶν
  choice: bụ nke ha
  rationale: Ọ na-enye possessive genitive ahụ n’ụzọ Igbo dị mfe ma doo anya.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: alaeze eluigwe
  rationale: Nke a bụ okwu Igbo a maara nke ọma maka ọchịchị Chineke nke sitere n’eluigwe, ma na-edobe akparamàgwà okwu pụrụ iche nke Matiu.
theological_decisions:
- issue: Ntụgharị δικαιοσύνη
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: “Ezi omume” na-ejide echiche nke ndụ na omume kwekọrọ n’uche ziri ezi nke Chineke n’ọnọdụ a. Ma okwu Grik ahụ nwekwara ike imesi “ikpe ziri ezi” ike, ya mere e debere nke ahụ dịka ntụgharị ọzọ n’ala peeji.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. “Ngọzi na-adịrị” na-edobe ọdịdị nkwupụta nke beatitude; “ndị a kpagburu” na-egosipụta ọnọdụ sitere na mkpagbu e mere ha. Ejighị okwu ụka pụrụ iche nke otu denominashọn.
