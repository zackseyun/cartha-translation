id: MAT.5.11
reference: Matthew 5:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: ig
  text: Ngọzi na-adịrị unu mgbe ha na-akparị unu[a], na-akpagbu unu, na-ekwukwa ụdị ajọ ihe niile megide unu n’ụgha[b], n’ihi m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ekwujọ unu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-ekwu ajọ ihe niile megide unu n’ụgha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: Ngọzi na-adịrị unu
  rationale: Nke a na-edobe usoro okwu ngọzi e ji malite akụkụ ndị a, ma na-ada ka Igbo nkịtị, dị ùgwù.
- source_word: ὅταν
  choice: mgbe
  rationale: Ọ na-egosi ọnọdụ nwere ike ime, dị ka ụdị ngwaa ndị so ya si gosi, n’enweghị ime ka ọ pụta na ọ ga-abụ naanị otu ugboro.
- source_word: ὀνειδίσωσιν
  choice: ha na-akparị unu
  rationale: Ọ na-egosi okwu mkparị ma ọ bụ okwu e ji eweda mmadụ ala n’Igbo dị mfe nghọta.
- source_word: διώξωσιν
  choice: na-akpagbu unu
  rationale: Ọ na-edobe obosara nke mmegide na mmeso ọjọọ a na-eme mmadụ n’ihi njikọ ya na Jizọs, n’ejedebeghị ya na ime ihe ike nkịtị.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: na-ekwukwa ụdị ajọ ihe niile megide unu
  rationale: Ọ na-egosi okwu ọjọọ dị iche iche a na-ekwu megide mmadụ, ma na-edobe κατά dị ka “megide unu.”
- source_word: ψευδόμενοι
  choice: n’ụgha
  rationale: Ọ na-akọwa na ihe ọjọọ ndị ahụ a na-ekwu abụghị eziokwu, n’ụzọ na-ada nke ọma n’Igbo.
- source_word: ἕνεκεν ἐμοῦ
  choice: n’ihi m
  rationale: Ọ na-egosi na ihe kpatara mmegide ahụ bụ njikọ ndị a na-agwa okwu nwere n’ebe Jizọs nọ, n’etinyeghị nkọwa ọzọ na-adịghị n’ederede.
theological_decisions:
- issue: Ụdị mmegide a na-ekwu maka ya
  choice: E debere mkparị, mkpagbu, na okwu ụgha ọjọọ dị ka akụkụ atọ jikọrọ ọnụ nke mmegide a na-ata n’ihi Jizọs.
  alternative: Ijedebe “mkpagbu” naanị na ime ihe ike nkịtị, ma ọ bụ ime ka akụkụ ahụ dum bụrụ naanị nkwutọ.
  rationale: Ngwaa atọ e jikọtara ọnụ n’asụsụ Grik na-egosi ụdị mmegide sara mbara; ntụgharị a anaghị ebelata ha ka ha bụrụ naanị otu ụdị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. “Ngọzi na-adịrị unu” na-edobe ụda okwu ngọzi; “na-akpagbu” adịghị ekpebi ma mkpagbu ahụ ọ bụ nke iwu, nke ahụ, ma ọ bụ nke ọha mmadụ.
