  source_fidelity: The main text faithfully retains the three coordinated actions—insulting, persecuting, and falsely speaking evil against the disciples—and preserves the causal phrase ἕνεκεν ἐμοῦ as “n’ihi m.” “Na-akpagbu” appropriately retains the broad force of διώκω without restricting it to physical violence.
