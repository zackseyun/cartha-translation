id: MAT.5.48
reference: Matthew 5:48
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: ig
  text: Ya mere, unu ga-abụ ndị zuru oke[a], dị ka Nna unu nke eluigwe zuru oke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị τέλειος dịka “zuru ezu,” “zuru oke n’akụkụ niile,” ma ọ bụ “tozuru okè.” Okwu Grik a nwere ike izo aka n’izu ezu, ịdị dum, ma ọ bụ ntozu okè, nakwa n’izuzu oke.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: ga-abụ
  rationale: Ọ bụ ngwaa ọdịnihu nke εἰμί, ma n’ebe a o nwere ike iwu ma ọ bụ gbaa ume. “Ga-abụ” na-edobe ọdịdị ọdịnihu ahụ na ụda okwu siri ike, n’agbanyeghị na ihe gbara ya gburugburu na-egosi na ọ bụ oku e nyere ndị na-eso ụzọ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ozizi bu ya ụzọ banyere ịhụ ndị iro n’anya.
- source_word: ὑμεῖς
  choice: unu
  rationale: Ọ na-edobe nnọchiaha doro anya nke Grik ma na-agwa ìgwè mmadụ okwu n’ụzọ Igbo nkịtị.
- source_word: τέλειοι / τέλειός
  choice: ndị zuru oke / zuru oke
  rationale: “Zuru oke” na-edobe otu mkpụrụokwu ahụ n’akụkụ abụọ nke ntụnyere ahụ ma nwee ike ịpụta izu ezu, ịdị n’otu n’obi, ma ọ bụ ntozu oke. A kọwara obosara ihe ọ pụtara n’ala peeji.
- source_word: ὡς
  choice: dị ka
  rationale: Ọ na-ewebata ntụnyere dị n’etiti ndị na-eso ụzọ na Nna ha.
- source_word: πατὴρ ὑμῶν ὁ οὐράνιος
  choice: Nna unu nke eluigwe
  rationale: Nke a bụ okwu Igbo doro anya nke na-edobe ma “Nna unu” ma njirimara ya dị ka onye nke eluigwe.
theological_decisions:
- issue: Ihe τέλειος pụtara n’okwu agbamume gbasara omume
  choice: zuru oke
  alternative: zuru ezu; obi ya dum; tozuru etozu
  rationale: “Zuru oke” bụ ntụgharị kpọmkwem nke na-edobe ịdị arọ nke oku ahụ na ntụnyere ya na Nna. Ihe ndị ọzọ nwere ike igosi izu ezu ma ọ bụ ntozu oke n’ịhụnanya, karịsịa n’ihe gbara amaokwu a gburugburu; ya mere e tinyere ha n’ala peeji kama idozi naanị otu nkọwa n’ime ederede.
- issue: Ike iwu dị na Ἔσεσθε
  choice: ga-abụ
  alternative: unu aghaghị ịbụ; bụrụnụ
  rationale: Ụdị Grik bụ ọdịnihu, ma a na-eji ya enye iwu ma ọ bụ agbamume n’ebe a. “Ga-abụ” na-echekwa ụdị ahụ ma hapụ ihe gbara ya gburugburu ka o gosipụta ike oku ahụ.
translation_notes:
  register: Asụsụ Igbo izugbe, dị ugbu a ma nwee ugwu. E ji “unu” gosi na a na-agwa ọtụtụ mmadụ okwu. E debere otu okwu “zuru oke” n’akụkụ abụọ iji chekwaa nkwughachi na ntụnyere nke Grik.
