  to: Ma ana m asị unu na onye ọ bụla na-ele nwanyị[b] anya iji nwee agụụ mmekọahụ n’ebe nwanyị ahụ nọ[a], ya na nwanyị ahụ akwaworị iko n’obi ya.
  rationale: The revision clarifies that the purposeful looking is directed toward sexual desire for the woman, as required by the syntax and immediate context, while retaining “nwanyị” rather than narrowing γυνή to “nwunye.” It also retains “akwaworị” for ἤδη and the heart-language of the source.
