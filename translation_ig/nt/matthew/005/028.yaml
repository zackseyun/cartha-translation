review_pass:
  verdict: revise
  source_fidelity: The draft preserves the contrast, universal construction, purposive force of πρὸς τὸ + infinitive, the completed/already force of ἤδη ἐμοίχευσεν, and the inward locus. However, “inwe agụụ n’ebe ọ nọ” is potentially unclear and can sound like desire in someone’s presence rather than desire directed toward the woman. Adding “mmekọahụ” is warranted by the immediate adultery context and makes the intended sense clear without adding a disputed marital-status restriction.
  naturalness: The sentence is generally readable Standard Igbo. Recasting the desire phrase as “inwe agụụ mmekọahụ n’ebe nwanyị ahụ nọ” is more precise and idiomatic in this context, and repeating “nwanyị ahụ” avoids ambiguity from gender-neutral third-person pronouns.
  terminology: “nwanyị” appropriately retains the lexical breadth of γυνή, with “nwunye” in a footnote. “akwa iko” appropriately communicates μοιχεύω in a natural Igbo construction. “obi” is the established and natural rendering for καρδία here.
  issues:
  - severity: medium
    issue: The phrase “iji nwee agụụ n’ebe ọ nọ” is ambiguous.
    rationale: It does not clearly mark the woman as the object of desire and may be read spatially (“in her presence”). The Greek αὐτήν explicitly identifies her as the desired person; the adultery context specifies the desire as sexual.
