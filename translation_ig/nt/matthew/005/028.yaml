id: MAT.5.28
reference: Matthew 5:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: ig
  text: Ma ana m asị unu na onye ọ bụla na-ele nwanyị[b] anya iji nwee agụụ mmekọahụ n’ebe nwanyị ahụ nọ[a], ya na nwanyị ahụ akwaworị iko n’obi ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “iji chọsie ya ike n’ụzọ mmekọahụ.”'
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a sụgharịrị “nwanyị” nwekwara ike ịpụta “nwunye,” dabere n’ọnọdụ okwu ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ma ana m asị unu
  rationale: “Ma” na-egosipụta ntụnyere δέ, ebe “ana m asị unu” na-edobe okwu onye mbụ na okwu a gwara ndị na-ege ntị kpọmkwem. Nkwuwa okwu dị na ἐγώ pụtara ìhè nke ọma n’ọnọdụ a ọbụna na-enweghị itinye “mụ onwe m,” nke ga-eme ka Igbo sie ike karịa ka ọ dị mkpa.
- source_word: πᾶς ὁ βλέπων
  choice: onye ọ bụla nke na-ele
  rationale: Nke a na-egosipụta echiche zuru ụwa ọnụ nke πᾶς yana omume ile anya nke participle βλέπων, n’Igbo dị ugbu a ma doo anya.
- source_word: γυναῖκα
  choice: nwanyị
  rationale: γυνή nwere ike ịbụ “nwanyị” ma ọ bụ “nwunye.” Ebe Grik ekwughị kpọmkwem na ọ bụ nwunye, “nwanyị” na-edobe obosara okwu ahụ; e debere nhọrọ ọzọ n’okpuru amaokwu.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: iji nwee agụụ n’ebe ọ nọ
  rationale: “Iji” na-egosipụta nzube ma ọ bụ ebumnuche nke πρὸς τό tinyere infinitive. “Inwe agụụ n’ebe ọ nọ” na-edobe echiche nke ἐπιθυμέω n’enweghị ime ka isiokwu ya dị warara karịa Grik, ebe okwu ịkwa iko gbara ya gburugburu na-eme ka ụdị agụụ ahụ doo anya.
- source_word: ἤδη ἐμοίχευσεν αὐτὴν
  choice: ya na nwanyị ahụ akwaworị iko
  rationale: “Akwaworị” na-egosipụta ma perfect nke ἐμοίχευσεν n’ọnọdụ a ma “ugbua tupu nke ahụ” nke ἤδη. Usoro “ya na … ịkwa iko” bụ Igbo doro anya ma kwekọọ n’ihe αὐτήν na-arụ n’ahịrịokwu ahụ.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: n’obi ya
  rationale: Nke a bụ ntụgharị nkịtị ma bụrụkwa okwu Igbo a na-aghọta nke ọma maka ime mmadụ—echiche, ọchịchọ, na mkpebi ya.
theological_decisions:
- issue: Ma a ga-asụgharị γυνή dịka “nwanyị” ka ọ bụ “nwunye”
  choice: nwanyị
  alternative: nwunye
  rationale: Okwu Grik ahụ n’onwe ya akọwaghị ọnọdụ alụmdi na nwunye nwanyị ahụ. “Nwanyị” na-ezere ime ka ihe ederede kwuru dị warara, ebe okwu banyere ịkwa iko ka na-edobe ịdị arọ nke nkuzi ahụ.
- issue: Ma ἐπιθυμέω ga-abụ agụụ n’ozuzu ya ka ọ bụ okwu pụtara agụụ mmekọahụ kpọmkwem
  choice: inwe agụụ n’ebe ọ nọ
  alternative: ịchọsie ya ike n’ụzọ mmekọahụ
  rationale: Ngwaa Grik ahụ nwere nghọta sara mbara karịa naanị agụụ mmekọahụ, ma n’ebe a ihe gbasara ịkwa iko na-egosi na ọ bụ ọchịchọ mmekọahụ na-ezighị ezi. Isi ederede na-edobe obosara okwu ahụ; nkọwa ala peeji na-enye ụdị nke na-ekwu ya hoo haa.
- issue: Ma ile anya ahụ ọ bụ nanị ịhụ nwanyị ma ọ bụ ile ya anya n’ebumnuche ịzụlite ọchịchọ
  choice: ile … anya iji nwee agụụ
  alternative: ile … anya wee nwee agụụ
  rationale: πρὸς τό tinyere infinitive na-egosi nzube ma ọ bụ ntụziaka ebumnuche. “Iji” na-echekwa nke a, ka a ghara ime ka okwu ahụ bụrụ ikpe megide ịhụ mmadụ n’amaghị ama.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ntụnyere Jizọs, ebumnuche dị n’ile anya ahụ, na ihe e mere “n’obi,” n’enweghị ịgbakwunye ọnọdụ alụmdi na nwunye ma ọ bụ nkọwa ụka ọ bụla.
