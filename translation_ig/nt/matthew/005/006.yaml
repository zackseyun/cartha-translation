revisions:
- from: Ngọzi na-adịrị ndị agụụ ezi omume[a] na-agụ, ndị akpịrị na-akpọkwa nkụ maka ya, n’ihi na a ga-eme ka afọ ju ha.
  to: Ngọzi na-adịrị ndị agụụ na-agụ ma akpịrị na-akpọ nkụ maka ezi omume, n’ihi na a ga-eme ka afọ ju ha.
  rationale: The revision removes the unclear repetition of “ndị” and the pronoun “ya,” preserving the source’s one set of people who hunger and thirst for righteousness. It maintains the beatitude register, the ambiguity of δικαιοσύνη through the footnote, and the passive future sense of χορτασθήσονται.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:30:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the blessing declaration, the hunger-and-thirst imagery, righteousness as the object of both desires, the explanatory clause, and the future passive promise. However, it separates the Greek’s single group into two coordinated groups and makes “maka ya” an unclear referent; this weakens the shared object and can sound as though the thirst is merely ‘for it’ after a separate hunger clause.
  naturalness: “Ndị agụụ ezi omume na-agụ, ndị akpịrị na-akpọkwa nkụ maka ya” is awkward in Standard Igbo and has an unclear parallel structure. A single relative clause with “agụụ na-agụ ma akpịrị na-akpọ nkụ” is more natural and clearly describes the same people.
  terminology: “Ngọzi na-adịrị,” “ezi omume,” and “a ga-eme ka afọ ju ha” are appropriate. The footnote’s “ikpe ziri ezi” suitably preserves the justice-related sense of δικαιοσύνη without displacing the main rendering.
  issues:
  - severity: medium
    issue: The hunger and thirst expressions are split into two noun phrases, with an ambiguous pronoun.
    rationale: Greek has one article governing both participles and one object, τὴν δικαιοσύνην. The revision keeps one group and makes “ezi omume” the explicit object of the combined metaphor.
  revised_text: Ngọzi na-adịrị ndị agụụ na-agụ ma akpịrị na-akpọ nkụ maka ezi omume, n’ihi na a ga-eme ka afọ ju ha.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi.” Okwu Grik a nwere ike ịpụta ezi omume, ikpe ziri ezi, ma ọ bụ ihe ziri ezi n’ihu Chineke.
    reason: alternative_reading
  revision_rationale: The revision removes the unclear repetition of “ndị” and the pronoun “ya,” preserving the source’s one set of people who hunger and thirst for righteousness. It maintains the beatitude register, the ambiguity of δικαιοσύνη through the footnote, and the passive future sense of χορτασθήσονται.
