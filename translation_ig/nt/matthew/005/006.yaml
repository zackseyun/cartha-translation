  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: ig
  text: Ngọzi na-adịrị ndị agụụ na-agụ ma akpịrị na-akpọ nkụ maka ezi omume, n’ihi na a ga-eme ka afọ ju ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: Ngọzi na-adịrị
  rationale: Nke a na-egosipụta nkwupụta ngọzi nke okwu a, kama ime ka ọ bụrụ nanị mmetụta obi ụtọ.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: ndị agụụ ... na-agụ, ndị akpịrị na-akpọkwa nkụ
  rationale: Akpaalaokwu Igbo ndị a na-egosipụta agụụ na akpịrị ịkpọ nkụ na-aga n’ihu, ma na-edobekwa ihe atụ abụọ ahụ nke Grik.
- source_word: τὴν δικαιοσύνην
  choice: ezi omume
  rationale: “Ezi omume” bụ okwu Igbo doro anya maka ịdị na ime ihe ziri ezi n’ihu Chineke; ihe odide ala peeji na-echekwa echiche “ikpe ziri ezi,” nke okwu Grik ahụ nwekwara ike ịpụta.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe mere ngọzi ahụ ji dịrị ha n’asụsụ Igbo dị ugbu a ma doo anya.
- source_word: αὐτοὶ
  choice: ha
  rationale: Nnọchiaha a na-akọwapụta otu ndị ahụ a kpọrọ aha; Igbo ebumpụta ụwa adịghị achọ itinye okwu nkwusi ike ọzọ ebe a.
- source_word: χορτασθήσονται
  choice: a ga-eme ka afọ ju ha
  rationale: Nke a na-echekwa ọdịdị mmeju nke ngwaa ahụ na ihe atụ agụụ, ma hapụ onye na-eme ihe ahụ n’amaghị aha dịka Grik si mee.
theological_decisions:
- issue: Nkọwa δικαιοσύνη
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: Okwu Grik ahụ nwere ike ịgụnye ibi ndụ ziri ezi n’ihu Chineke nakwa ikpe ma ọ bụ ọnọdụ ziri ezi n’etiti mmadụ. Isi ederede họọrọ okwu sara mbara a na-ejikarị eme ihe, ebe ihe odide ala peeji na-echekwa ụzọ ọzọ ahụ n’enweghị ịkpa ókè n’etiti ha.
translation_notes:
  register: Asụsụ Igbo izugbe, nke dị ugwu ma dị mfe nghọta. E kewara ihe atụ agụụ na akpịrị ịkpọ nkụ n’ụzọ na-ada ka Igbo ebumpụta ụwa, ma e chekwara njikọ ha abụọ na ezi omume.
