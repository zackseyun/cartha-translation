id: MAT.5.32
reference: Matthew 5:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: ig
  text: Ma mụ na-agwa unu na onye ọ bụla gbara nwunye ya alụkwaghịm, ma e wezụga n’ihi omume mmekọahụ rụrụ arụ[a], na-eme ka nwanyị ahụ kwaa iko[b]; onye ọ bụla lụrụkwa nwanyị a gbara alụkwaghịm na-akwa iko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Omume mmekọahụ rụrụ arụ” bụ ntụgharị okwu Greek porneia, okwu sara mbara nke na-ezo aka n’omume mmekọahụ na-ezighị ezi; ụfọdụ na-atụgharị ya “ịkwa iko” ma ọ bụ “omume adịghị ọcha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, n’ụzọ dị nso na Greek, “na-eme ka nwanyị ahụ ghọọ onye na-akwa iko.” Infinitive Greek ahụ dị n’ụdị passive.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: gbara ... alụkwaghịm / nwanyị a gbara alụkwaghịm
  rationale: N’ọnọdụ alụmdi na nwunye, ἀπολύω pụtara ịgba alụkwaghịm, ọ bụghị naanị izipụ mmadụ ma ọ bụ ịhapụ ya. Otu okwu ahụ n’ụdị abụọ ahụ na-edobe njikọ dị n’etiti akụkụ abụọ nke amaokwu ahụ.
- source_word: γυναῖκα
  choice: nwunye
  rationale: Ọ bụ ezie na γυνή nwekwara ike ịpụta ‘anyịanyị,’ okwu na-egosi onye nwe ya (αὐτοῦ) na ọnọdụ ịgba alụkwaghịm na-egosi na ihe ọ pụtara ebe a bụ ‘nwunye.’
- source_word: παρεκτὸς λόγου πορνείας
  choice: ma e wezụga n’ihi omume mmekọahụ rụrụ arụ
  rationale: παρεκτός na-egosi ezigbo ọnọdụ e wepụrụ n’iwu a; λόγου na-ezo aka n’ihe kpatara ya ma ọ bụ okwu metụtara ya. ‘Omume mmekọahụ rụrụ arụ’ na-edobe obosara πορνεία n’enweghị ime ka ọ bụrụ naanị ịkwa iko nke onye lụrụ di ma ọ bụ nwunye.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: na-eme ka nwanyị ahụ kwaa iko
  rationale: ποιέω tinyere infinitive na-egosi ime ka ihe mee. Nsụgharị a bụ Igbo doro anya, ebe nkọwa ala peeji na-edobe eziokwu ahụ na μοιχευθῆναι dị n’ụdị passive ma nwekwaa ike igosi ime ka nwanyị ahụ ghọọ onye na-akwa iko.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: onye ọ bụla lụrụkwa
  rationale: Nkebiokwu a na-egosi ọnọdụ izugbe gbasara onye ọ bụla; ntụgharị a dị mkpirikpi ma bụrụkwa Igbo e ji eme ihe.
- source_word: μοιχᾶται
  choice: na-akwa iko
  rationale: N’ebe a okwu ahụ pụtara ime mmehie ịkwa iko n’ihe gbasara alụmdi na nwunye. Igbo anaghị egosipụta ọdịiche olu Greek ahụ n’ụzọ eke.
- source_word: πᾶς ὁ ἀπολύων
  choice: onye ọ bụla gbara
  rationale: Ọdịdị participle nwoke otu na-arụ ọrụ izugbe. ‘Onye ọ bụla’ na-egosi ike izugbe ahụ, ebe ‘nwunye ya’ ka na-egosi ọnọdụ nwoke a na-ekwu banyere ya.
theological_decisions:
- issue: Ihe nkebiokwu mwepụ παρεκτὸς λόγου πορνείας pụtara
  choice: 'A tụgharịrị ya dịka ezigbo ọnọdụ e wepụrụ: ‘ma e wezụga n’ihi omume mmekọahụ rụrụ arụ.’'
  alternative: ‘ma e wezụga n’okwu alụmdi na nwunye megidere iwu’ ma ọ bụ ime ka ọ bụrụ naanị otu ụdị mmehie mmekọahụ
  rationale: Greek na-egosi mwepụ n’ụzọ doro anya, ma ọ kọwaghị kpọmkwem ókè πορνεία ruru. Ya mere, ntụgharị ahụ anaghị ezobe mwepụ ahụ ma ọ bụ kpebie esemokwu nkà mmụta okpukpe banyere ókè ya.
- issue: Ike μοιχευθῆναι mgbe ποιεῖ gasịrị
  choice: E ji ‘na-eme ka nwanyị ahụ kwaa iko’ mee isi ederede, ma debe ntụgharị na-egosi ụdị passive/resultative na nkọwa ala peeji.
  alternative: ‘na-eme ka nwanyị ahụ ghọọ onye na-akwa iko’ ma ọ bụ ‘na-eme ka e kwaa iko megide ya’
  rationale: Infinitive Greek dị n’ụdị passive, mana a na-arụrịta ụka ma uche ya ebe a ọ bụ ime ka nwanyị ahụ kwaa iko, ime ka ọ ghọọ onye na-akwa iko, ma ọ bụ ka e mee iko megide ya. Isi ederede na-eji Igbo kwụ ọtọ, ebe nkọwa ala peeji na-echekwa mgbagwoju anya ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Mụ onwe m’ na-enye ἐγώ ike ntakịrị n’enweghị ime ka ahịrịokwu sie ike; ‘nwaanyị ahụ’ na-eme ka onye αὐτή na-ezo aka na ya doo anya. E debere okwu ịgba alụkwaghịm na ịkwa iko n’ụdị ndị ndị Igbo na-aghọta ngwa ngwa.
