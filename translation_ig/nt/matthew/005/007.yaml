  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: ig
  text: Ngọzi na-adịrị ndị na-eme ebere, n’ihi na a ga-emere ha ebere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ha ga-anata ebere.” Ngwaa Grik ahụ bụ ngwaa passive nke na-ekwu maka ihe ga-eme n’ọdịnihu, ma ọ kpọghị onye ga-eme ebere ahụ aha.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Ngọzi na-adịrị
  rationale: Nke a na-egosipụta ọnọdụ ihu ọma na ọdịmma sitere n’aka Chineke, ọ bụghị naanị obi ụtọ mmadụ na-enwe; ọ dịkwa n’ụdị okwu ngọzi a na-eji na Beatitudes.
- source_word: οἱ ἐλεήμονες
  choice: ndị na-eme ebere
  rationale: Adjective ahụ e ji article mee aha na-ezo aka n’ụdị ndị mmadụ. Okwu a bụ nke Igbo nkịtị ma na-echekwa njikọ ya na ngwaa ebere dị n’ahịrị nke abụọ.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara ma ọ bụ ntọala nke ngọzi ahụ n’ụzọ doro anya ma dịkwa mma n’Igbo ugbu a.
- source_word: αὐτοὶ
  choice: ha
  rationale: Ọ na-ezo kpọmkwem n’ebe ndị na-eme ebere nọ. N’Igbo, ‘ha’ na-enye nghọta ahụ n’enweghị ibu okwu na-adịghị mkpa.
- source_word: ἐλεηθήσονται
  choice: a ga-emere ha ebere
  rationale: Ọ na-egosipụta future passive nke ngwaa Grik ma na-ahapụ onye ga-eme ebere ahụ n’ekwughị aha, dịka isi mmalite ahụ si mee.
theological_decisions:
- issue: Onye ga-emere ha ebere
  choice: a ga-emere ha ebere
  alternative: Chineke ga-emere ha ebere
  rationale: Ụdị passive nke Grik ekwughị onye na-eme ihe ahụ. Ọ bụ ezie na gburugburu okwu ahụ nwere ike ime ka a ghọta Chineke, nsụgharị ahụ anaghị etinye aha onye isi mmalite ahụ na-ekwughị.
- issue: Njikọ dị n’etiti ime ebere na ịnata ebere
  choice: Chekwaa njikọ okwu ahụ site n’iji ‘ebere’ n’akụkụ abụọ
  alternative: ndị nwere ọmịiko ... a ga-emere ha ebere
  rationale: Ikwughachi ‘ebere’ na-echekwa ụda na njikọ lexical dị n’etiti ἐλεήμονες na ἐλεηθήσονται, n’enweghị ịkọwa kpọmkwem ụdị njikọ nkà mmụta okpukpe dị n’etiti ha.
translation_notes:
  register: E ji Standard Igbo dị mfe, dị ugwu, ma kwekọọ n’ụdị okwu ngọzi dị mkpirikpi. ‘Ngọzi na-adịrị’ na-ezere ime ka μακάριοι bụrụ naanị mmetụta obi ụtọ; ‘a ga-emere ha ebere’ na-echekwa passive na amaghị onye mere ihe ahụ.
