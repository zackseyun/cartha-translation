review_pass:
  verdict: revise
  source_fidelity: The draft faithfully conveys the emphatic plural address, the metaphor “salt of the earth,” salt losing its quality, the means-question, subsequent uselessness, being cast outside, and being trampled by human beings. “Ndị mmadụ” appropriately renders the generic sense of ἀνθρώπων in Standard Igbo.
  naturalness: The final expression “ka ndị mmadụ zọtọ ya ụkwụ” is not idiomatic Standard Igbo for being trampled underfoot. “Ka ndị mmadụ zọda ya n’ụkwụ” is natural and retains the passive-result sense in context.
  terminology: 'Key terms are appropriate: “nnu,” “ụwa,” “atụfuo ụtọ nnu ya,” and “n’èzí” are clear, modern, and suitably dignified. No doctrinally loaded terminology is introduced.'
  issues:
