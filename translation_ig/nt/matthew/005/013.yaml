id: MAT.5.13
reference: Matthew 5:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: ig
  text: Unu bụ nnu nke ụwa. Ma ọ bụrụ na nnu atụfuo ụtọ nnu ya, gịnị ka a ga-eji mee ka ọ dị nnu ọzọ? Ọ baghịzi uru ọ bụla ma e wezụga ka a tụpụ ya n’èzí, ka ndị mmadụ zọda ya n’ụkwụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Unu
  rationale: Nnọchiaha a bụ nke ọtụtụ mmadụ ma nwee ntakịrị nkwusi ike n’asụsụ Grik. “Unu” bụ ụzọ doro anya na nke ebumpụta ụwa e si agwa ìgwè ndị na-ege Jizọs ntị okwu n’Igbo.
- source_word: τὸ ἅλας τῆς γῆς
  choice: nnu nke ụwa
  rationale: γῆ nwere ike ịpụta ụwa, ala, ma ọ bụ ala e ji akọ ihe; n’ihe atụ a, “ụwa” na-egosi oke sara mbara nke okwu ahụ ma na-ada nke ọma n’Igbo.
- source_word: μωρανθῇ
  choice: atụfuo ụtọ nnu ya
  rationale: Mgbe e ji ngwaa a kwuo banyere nnu, ọ pụtara na ụtọ nnu ya alala. Nsụgharị a na-eme ka ihe atụ ahụ doo anya n’Igbo ma ghara ibubata echiche “ịghọ onye nzuzu,” nke na-abụghị isi ya n’ebe a.
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: gịnị ka a ga-eji mee ka ọ dị nnu ọzọ?
  rationale: Nke a na-edobe ajụjụ Grik banyere ihe a ga-eji mee ka nnu ahụ dị nnu, ma “ọzọ” na-eme ka echiche iweghachi ụtọ ya doo anya n’Igbo.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: Ọ baghịzi uru ọ bụla
  rationale: N’ebe a, ἰσχύει na-ekwu maka ịdị irè ma ọ bụ ịba uru; akpaokwu Igbo a bụ nke ebumpụta ụwa ma na-egosi na nnu ahụ abaghịzi uru ma ọlị.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: ma e wezụga ịtụpụ ya n’èzí
  rationale: “N’èzí” na-echekwa echiche ọnọdụ nke ἔξω, ebe “ịtụpụ ya” na-enye okwu ahụ n’Igbo nke ọma.
- source_word: καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων
  choice: ka ndị mmadụ zọtọ ya ụkwụ
  rationale: “Zọtọ ya ụkwụ” na-egosipụta ihe oyiyi siri ike nke ịzọda ihe. “Ndị mmadụ” na-ezo aka n’ụmụ mmadụ n’ozuzu, dịka ἀνθρώπων si mee n’ebe a, ọ bụghị naanị ụmụ nwoke.
theological_decisions:
- issue: Mmetụta sara mbara nke ὑπὸ τῶν ἀνθρώπων
  choice: ndị mmadụ
  alternative: ụmụ nwoke
  rationale: ἀνθρώπων na-ezo aka n’ụmụ mmadụ niile n’ebe a. “Ndị mmadụ” bụ okwu Igbo ziri ezi nke na-edobe echiche izugbe ahụ n’enweghị ime ka ọ bụrụ naanị ndị nwoke.
translation_notes:
  register: E ji Igbo Ọkọlọtọ nke oge a, nke dị ugwu ma dịkwa mfe nghọta. A hapụrụ ihe atụ banyere nnu ka ọ bụrụ ihe atụ, ma e mere ajụjụ na nkwubi okwu ya ka ha daa nke ọma n’okwu Igbo nkịtị.
