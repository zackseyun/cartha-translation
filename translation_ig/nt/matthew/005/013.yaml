    issue: Non-idiomatic rendering of καταπατεῖσθαι
    rationale: “zọtọ ya ụkwụ” is grammatically and idiomatically weak in this context. “zọda ya n’ụkwụ” naturally means “trample it underfoot” and accurately represents καταπατεῖσθαι.
