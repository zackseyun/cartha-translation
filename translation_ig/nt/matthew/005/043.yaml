  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη· Ἀγαπήσεις τὸν πλησίον σου καὶ μισήσεις τὸν ἐχθρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: ig
  text: “Unu anụla na e kwuru[a] sị, ‘Ị ga-ahụ onye agbata obi gị n’anya, kpọọkwa onye iro gị asị.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nkebi nke mbụ na-ekwughachi echiche dị na Levitikọs 19:18. Nkebi nke abụọ, ‘kpọọkwa onye iro gị asị,’ abụghị okwu e hotara kpọmkwem n’Agba Ochie; ọ na-egosipụta ozizi ndị mmadụ natara nke Jizọs na-agbazi.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Unu anụla
  rationale: Ụdị a na-egosi na ndị na-ege ntị anụwo ozizi a n’oge gara aga, ma ọ ka dị ha n’uche; ọ bụkwa Igbo nkịtị dabara n’usoro okwu Jizọs ji akụzi.
- source_word: ἐρρέθη
  choice: e kwuru
  rationale: A hapụrụ ya n’ụdị na-akọwaghị onye kwuru ya, dịka passive Grik si dị, ka a ghara ịkpọ onye kwuru ya aha n’enweghị ihe akaebe.
- source_word: Ἀγαπήσεις
  choice: Ị ga-ahụ ... n’anya
  rationale: Ọdịnihu Grik na-arụ ọrụ dịka iwu; ‘Ị ga-ahụ ... n’anya’ na-edobe ụdị iwu ahụ n’Igbo dị mfe ma dị ùgwù.
- source_word: τὸν πλησίον σου
  choice: onye agbata obi gị
  rationale: N’ọnọdụ iwu gbasara mmekọrịta mmadụ, nke a bụ okwu Igbo a maara nke ọma maka ‘neighbor,’ ma kwekọọkwa na nkwalite nke Levitikọs 19:18.
- source_word: μισήσεις
  choice: kpọọkwa ... asị
  rationale: Nke a na-enye echiche kpọmkwem nke ịkpọ mmadụ asị, ma njikọ ‘-kwa’ na-egosi na ọ bụ akụkụ nke otu okwu ahụ a kọrọ.
- source_word: τὸν ἐχθρόν σου
  choice: onye iro gị
  rationale: ‘Onye iro’ bụ okwu Igbo doro anya na nke nkịtị maka onye na-emegide mmadụ.
theological_decisions:
- issue: Ọnọdụ nkebi okwu ‘kpọọkwa onye iro gị asị’
  choice: E tinyere ya dịka akụkụ nke ozizi Jizọs kwuru na ndị na-ege ya ntị anụwo, ma e meghị ka o doo anya na ọ bụ kpọmkwem ihe e hotara n’Akwụkwọ Nsọ.
  alternative: Iwere ahịrịokwu ahụ dum dịka ihe e hotara kpọmkwem n’Agba Ochie, ma ọ bụ ịkọwa n’ederede isi na nkebi nke abụọ bụ naanị ọdịnala nkọwa.
  rationale: Grik jikọtara nkebi abụọ ahụ n’okwu a kọrọ mgbe e kwuru, ‘Unu anụla na e kwuru.’ Ma ebe iwu ịkpọ onye iro asị na-adịghị dịka ihe e hotara kpọmkwem n’Agba Ochie, nkọwa ala peeji na-eme ka ọdịiche ahụ doo anya n’enweghị ịgbanwe mgbagwoju anya dị n’ederede isi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E debere okwu ahụ n’ụdị ọtụtụ mmadụ (‘Unu’) dịka Grik si dị, ma okwu e hotara jiri otu onye (‘Ị ... gị’) dịka iwu ahụ si dị.
