  text: καὶ ὅστις σε ἀγγαρεύσει μίλιον ἕν, ὕπαγε μετ’ αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/041.yaml
  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: ig
  text: Ọ bụrụ na onye ọ bụla amanye gị[a] ịga otu maịl[b], soro ya gaa maịl abụọ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ngwaa a nwekwara ike ịpụta ‘ịmanye mmadụ ịrụ ọrụ.’ A na-ejikarị ya ekwu maka ọrụ ọchịchị ji ikike manye mmadụ ịrụ.
    reason: lexical_alternative
  - marker: b
    text: Maịl e kwuru ebe a bụ maịl Rom.
    reason: historical_context
  - marker: c
    text: N'asụsụ Grik, naanị ‘abụọ’ ka e kwuru; a ghọtara okwu ‘maịl’ site n'okwu gara aga.
    reason: source_form
lexical_decisions:
- source_word: ὅστις
  choice: Onye ọ bụla
  rationale: Nkebiokwu a na-egosi onye ọ bụla ọnọdụ ahụ nwere ike ịgụnye; ọ na-edobe echiche izugbe dị n'okwu Grik ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ἀγγαρεύσει
  choice: manyere gị ka gị na ya gaa
  rationale: Ngwaa ahụ na-egosi ịmanye mmadụ ịrụ ọrụ ma ọ bụ iso gaa n'ihi ikike e ji achị ya. Nhọrọ a na-eme ka mmanye ahụ doo anya n'Igbo n'enweghị ịtinye ndị agha Rom n'ahịrịokwu ahụ.
- source_word: μίλιον ἕν
  choice: otu maịl
  rationale: Ọ bụ ogologo a na-akpọ maịl Rom. Iji ‘otu maịl’ na-edobe ọnụ ọgụgụ na ihe atụ anya doro anya nke isi mmalite ahụ.
- source_word: ὕπαγε
  choice: soro ya gaa
  rationale: Ọ bụ iwu ka onye ahụ gaa n'ihu. E jikọtara ya na μετ’ αὐτοῦ ka ahịrịokwu ahụ bụrụ Igbo sitere n'okike.
- source_word: μετ’ αὐτοῦ
  choice: soro ya
  rationale: μετά na-egosi iso onye ọzọ; ‘soro ya’ bụ ụzọ Igbo doro anya ma dị mfe isi kwuo ya.
- source_word: δύο
  choice: maịl abụọ
  rationale: N'asụsụ Grik, naanị ‘abụọ’ ka e kwuru, ebe a ghọtara ‘maịl’ site n'okwu gara aga. Ikwughachi ‘maịl’ na-eme ka Igbo ahụ bụrụ nke sitere n'okike n'agbanweghị ihe ọ pụtara.
theological_decisions:
- issue: Ọrụ a manyere mmadụ ịrụ site n'ikike ọchịchị
  choice: E gosiri na a manyere onye ahụ iso gaa, ma e kwughị kpọmkwem na onye nyere iwu ahụ bụ onye agha Rom.
  alternative: Ịkpọ onye nyere iwu ahụ onye agha Rom kpọmkwem.
  rationale: Ngwaa ἀγγαρεύσει na okwu ‘maịl’ nwere ike ime ka onye na-agụ ya cheta usoro ndị Rom ji amanye ndị mmadụ ịrụ ọrụ, ma ihe odide Grik akpọghị ndị agha aha. Ya mere, nsụgharị ahụ na-edobe ọnọdụ mmanye ahụ n'etinyeghị nkọwa akụkọ ihe mere eme n'ime isi okwu.
- issue: Ma ‘maịl abụọ’ ọ pụtara ngụkọta njem ahụ ka ọ bụ maịl abụọ ọzọ
  choice: A sụgharịrị ya ‘soro ya gaa maịl abụọ,’ nke na-edobe ngụkọta ọnụ ọgụgụ e kwuru n'asụsụ Grik.
  alternative: ‘Gakwuru ya otu maịl ọzọ,’ nke na-akọwa ya dị ka otu maịl agbakwunyere.
  rationale: Ihe odide ahụ kwuru ‘otu maịl ... abụọ,’ ọ bụghị kpọmkwem ‘otu ọzọ.’ Nsụgharị ahụ na-ahapụ usoro ọnụ ọgụgụ ahụ ka ọ dị ma ghara ịgbakwunye nkọwa na-anọghị n'okwu Grik.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. ‘Manyere gị’ na-egosi mmanye nke ọma; ‘soro ya gaa’ na-eme ka njikọ iso onye ahụ doo anya. E zere okwu ụka pụrụ iche na nkọwa na-akpọ ndị agha Rom aha n'isi ederede.
