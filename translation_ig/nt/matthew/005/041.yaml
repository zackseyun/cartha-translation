revisions:
- from: Onye ọ bụla manyere gị[a] ka gị na ya gaa otu maịl[b], soro ya gaa maịl abụọ.[c]
  to: Ọ bụrụ na onye ọ bụla amanye gị[a] ịga otu maịl[b], soro ya gaa maịl abụọ.[c]
  rationale: Removed the unstated accompaniment from the first clause, while retaining “soro ya” where the Greek explicitly says “with him.” The conditional form expresses the general hypothetical case introduced by ὅστις without adding a specific actor or historical scenario. Footnote a was also adjusted to describe compelled service more precisely and naturally.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:30:43Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the coercive requisition and the contrast between one mile and two miles well. However, “ka gị na ya gaa otu maịl” introduces accompaniment in the first clause. The Greek first clause says only that someone compels the hearer for one mile; accompaniment is explicitly expressed only in the second clause (μετ’ αὐτοῦ). The revision preserves that distinction.
  naturalness: The revised conditional construction is clear, idiomatic Standard Igbo, and retains the direct imperative force of the saying. “Soro ya gaa maịl abụọ” naturally renders the explicitly stated accompaniment in the second clause.
  terminology: “Amanye” appropriately expresses ἀγγαρεύσει in this context without specifying a Roman soldier. “Maịl” is suitable, and supplying “maịl” with “abụọ” is a natural rendering of the Greek ellipsis. The historical footnote appropriately identifies the mile as Roman without importing that historical detail into the main text.
  issues:
  - severity: medium
    issue: The first clause adds “gị na ya” (‘with him’).
    rationale: The source has no counterpart to μετ’ αὐτοῦ in the first clause; that accompaniment occurs only after the imperative ὕπαγε. Retaining it only in the second clause better follows the Greek syntax and emphasis.
  revised_text: Ọ bụrụ na onye ọ bụla amanye gị[a] ịga otu maịl[b], soro ya gaa maịl abụọ.[c]
