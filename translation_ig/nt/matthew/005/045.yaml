id: MAT.5.45
reference: Matthew 5:45
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: ig
  text: ka unu wee ghọọ ụmụ Nna unu[a], bụ́ onye nọ n’eluigwe[b], n’ihi na ọ na-eme ka anyanwụ ya waa n’elu ndị ọjọọ na ndị ọma, na-emekwa ka mmiri zoo n’elu ndị ezi omume na ndị ajọ omume[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ahụ bụ “ụmụ nwoke”; n’ebe a ọ na-anọchi ndị na-eso ụzọ n’ozuzu ha.
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik: “n’eluigwe” (n’ụdị ọtụtụ); “n’eluigwe” bụ ụzọ Igbo si ekwu okwu a nke ọma n’ebe a.'
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, okwu ahụ bụ “ọ na-ezo mmiri n’elu ndị ezi omume na ndị ajọ omume.” E ji “na-eme ka mmiri zoo” n’ahịrị bụ isi iji gosi Chineke dịka onye na-eme ihe ahụ n’Igbo eke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: ka unu wee
  rationale: Ọ na-egosi nzube ma ọ bụ ihe a tụrụ anya ya; nke a bụ ụzọ Igbo dị ndụ si jikọta ya na ngwaa na-esote.
- source_word: γένησθε
  choice: ghọọ
  rationale: “Ghọọ” na-edobe echiche nke ịbata n’ọnọdụ ma ọ bụ igosipụta àgwà ahụ, kama ime ya ka ọ bụrụ naanị ọnọdụ na-adịghị agbanwe agbanwe.
- source_word: υἱοὶ
  choice: ụmụ
  rationale: N’Igbo, “ụmụ Nna unu” bụ okwu eke maka ndị nọ ná mmekọrịta nwa na nna, ma na-emetụta ndị na-eso ụzọ niile. Ihe odide Grik ji okwu pụtara kpọmkwem “ụmụ nwoke,” ya mere e depụtara nke ahụ n’ala ala peeji.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: Nna unu
  rationale: Nke a na-asụgharị njikọ nwe ahụ ozugbo ma na-edobe okwu “Nna” dị ka aha mmekọrịta.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: bụ́ onye nọ n’eluigwe
  rationale: Ọ na-edobe nkebiokwu ahụ dị iche, ka a ghara ịgbaze ya naanị n’aha nkọwa dịka “Nna nke eluigwe.”
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe kpatara nkebiokwu gara aga n’Igbo doro anya.
- source_word: τὸν ἥλιον αὐτοῦ
  choice: anyanwụ ya
  rationale: Ọ na-edobe nnọchiaha nwe αὐτοῦ, nke na-egosi na anyanwụ ahụ bụ nke Chineke ma nọ n’okpuru ọchịchị ya.
- source_word: ἀνατέλλει
  choice: na-eme ka ... chakwasị
  rationale: N’ebe anyanwụ bụ ihe ngwaa ahụ metụtara, usoro a na-egosi n’ụzọ Igbo dị mma na Chineke bụ onye na-eme ka ọ chawapụta.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: ndị ọjọọ na ndị ọma
  rationale: Adjective ndị ahụ na-anọchi mmadụ; ntụgharị a na-edobe nhazi okwu abụọ ahụ na mmegide ha.
- source_word: βρέχει
  choice: na-ezitekwara ... mmiri ozuzo
  rationale: Nke a bụ Igbo eke nke na-egosi na Chineke na-enye mmiri ozuzo, na-enweghị okwu na-adịghị eke dịka “ọ na-ezokwa ndị mmadụ.”
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: ndị ezi omume na ndị ajọ omume
  rationale: Okwu abụọ a na-egosi ọdịiche omume dị n’etiti δικαίους na ἀδίκους n’Igbo Akwụkwọ Nsọ a na-aghọta nke ọma.
theological_decisions:
- issue: Okwu gbasara ịbụ ụmụ nke Nna
  choice: ụmụ Nna unu
  alternative: ụmụ nwoke nke Nna unu
  rationale: Grik kwuru υἱοί, “ụmụ nwoke,” ma n’ọnọdụ a ọ na-agụnye ndị na-eso ụzọ n’ozuzu ha. “Ụmụ Nna unu” bụ Igbo eke nke na-edobe mmekọrịta nwa na nna; ala ala peeji na-echekwa ụdị okwu nwoke dị na Grik.
- issue: Ike okwu γένησθε n’ihe gbasara ịbụ ụmụ Chineke
  choice: wee ghọọ
  alternative: wee bụrụ; wee gosi na unu bụ
  rationale: “Ghọọ” na-edobe ike ngwaa Grik ahụ ma ọ naghị akọwa n’onwe ya usoro nzọpụta ma ọ bụ ikuchi mmadụ dịka nwa. Ọ na-ahapụ esemokwu dị n’okwu ahụ ka ọnọdụ gbara ya gburugburu kọwaa ya.
- issue: Mmesapụ aka Chineke nye ụdị mmadụ abụọ
  choice: ọ na-eme ka anyanwụ ya chakwasị ndị ọjọọ na ndị ọma, ọ na-ezitekwara ndị ezi omume na ndị ajọ omume mmiri ozuzo
  alternative: anyanwụ ya na-achakwasị ... mmiri na-ezokwa ...
  rationale: Nhọrọ a na-edobe Chineke dịka onye na-eme ihe abụọ ahụ, dịka nhazi ahịrịokwu Grik si gosi, n’enweghị itinye nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ụmụ Nna unu” kama okwu na-adịghị eke “ụmụ nwoke nke Nna unu” n’ahịrị bụ isi, ma e chekwara nkọwa nwoke dị na Grik n’ala ala peeji. A haziri nkebiokwu anyanwụ na mmiri ozuzo n’ụzọ kwekọrọ n’usoro Igbo ma debe ọrụ Chineke nke ọma.
