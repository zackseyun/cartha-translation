  source_fidelity: A na-edobe nzube nke ὅπως, ike γένησθε site n’“ghọọ,” na mmekọrịta “ụmụ ... Nna unu” nke ọma. Otú ọ dị, “na-eme ka anyanwụ ya chakwasị” na-atụgharị echiche anyanwụ na-enwu n’ebe mmadụ nọ karịa ἀνατέλλει, “ime ka anyanwụ ... waa/rịpụta.” Ọzọkwa, “na-ezite ... mmiri ozuzo” adịghị egosi ἐπὶ (“n’elu/n’isi”) nke ọma dịka “ime ka mmiri zoo n’elu” si eme.
  naturalness: “Ụmụ Nna unu” na “bụ́ onye nọ n’eluigwe” bụ Standard Igbo dị mfe ịghọta. “Ka anyanwụ ya waa n’elu...” na “ka mmiri zoo n’elu...” bụkwa usoro eke ma kwekọọ nke ọma n’usoro ahịrịokwu ahụ.
