  to: ka unu wee ghọọ ụmụ Nna unu[a], bụ́ onye nọ n’eluigwe[b], n’ihi na ọ na-eme ka anyanwụ ya waa n’elu ndị ọjọọ na ndị ọma, na-emekwa ka mmiri zoo n’elu ndị ezi omume na ndị ajọ omume[c].
