    issue: The draft uses 'na-eweta ... n'ebe ịchụàjà.'
    rationale: This means bringing the gift to/at the altar and somewhat weakens both the sacrificial sense of προσφέρῃς and the source's ἐπὶ with the altar. 'Na-enye ... n'elu ebe ịchụàjà' better preserves the action and location.
  - severity: low
    issue: The footnote's phrase 'mmadụ abụọ ahụ' is imprecise and unnatural in this explanation.
    rationale: It can be read as referring to two particular persons rather than to male and female referents. The revision explicitly says 'ma nwoke ma nwaanyị.'
