  rationale: The revision strengthens correspondence with the Greek sacrificial scene by rendering the present action as offering a gift upon the altar, while preserving the original's conditional syntax, spatial emphasis, and indefinite complaint. It also clarifies the existing lexical footnote without expanding the main text beyond the masculine singular Greek term.
