source:
  edition: SBLGNT
  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: ig
  text: Ya mere, ọ bụrụ na ị na-enye onyinye gị n'elu ebe ịchụàjà, ma n'ebe ahụ cheta na nwanne gị nwoke[a] nwere ihe megide gị,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta ya dịka “nwanne gị nwoke ma ọ bụ nwanne gị nwaanyị”; okwu Grik ahụ bụ “nwanne nwoke,” okwu dị n'ụdị nwoke, otu onye, nke nwere ike ịnọchite anya ma nwoke ma nwaanyị n'ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Ya mere, ọ bụrụ na
  rationale: “Ya mere” na-egosi nkwubi okwu sitere n'ozizi bu ụzọ, ebe “ọ bụrụ na” na-edobe ọnọdụ nke ἐὰν.
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: ị na-eweta onyinye gị
  rationale: “Na-eweta” na-egosi omume nke iburu ihe onyinye bịaruo ebe a na-achụ àjà; “onyinye” na-edobe nghọta sara mbara nke δῶρον n'enweghị ime ka ọ bụrụ naanị otu ụdị àjà.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: n'ebe ịchụàjà
  rationale: N'Igbo, nke a bụ ụzọ doro anya ma dị mfe isi kwuo na a na-eweta onyinye ahụ ruo ebe ịchụàjà; ọ na-egosipụta ntụziaka nke ἐπί ya na accusative n'ụzọ ebumpụta ụwa.
- source_word: κἀκεῖ μνησθῇς
  choice: ma n'ebe ahụ cheta
  rationale: “N'ebe ahụ” na-edobe nrụgide gbasara ebe ahụ, “cheta” kwa na-enye μνησθῇς n'ụzọ kwụ ọtọ na-enweghị ịkọwa ihe mere ncheta ahụ ji bịa.
- source_word: ὁ ἀδελφός σου
  choice: nwanne gị nwoke[a]
  rationale: Okwu Grik bụ aha nwoke otu onye. “Nwanne gị nwoke” na-edobe ụdị ahụ kpọmkwem; ihe odide ala peeji na-akọwa na okwu ahụ nwere ike ịnọchite anya nwanne nwoke ma ọ bụ nwaanyị n'ọnọdụ a.
- source_word: ἔχει τι κατὰ σοῦ
  choice: nwere ihe megide gị
  rationale: Nke a bụ akpaala okwu Igbo kwekọrọ na akpaala okwu Grik ma na-edobe τι (“ihe”) n'enweghị ịkọwapụta ụdị iwe ma ọ bụ ebubo ahụ.
theological_decisions:
- issue: 'Okwu ikwu nwanne nke bụ ụdị nwoke: ἀδελφός'
  choice: nwanne gị nwoke
  alternative: nwanne gị nwoke ma ọ bụ nwaanyị; onye kwere ekwe ibe gị
  rationale: Isi ederede na-edobe ụdị nwoke otu onye dị na Grik kama ime ka ọ bụrụ okwu na-enweghị njirimara nwoke ma ọ bụ nwaanyị. Ihe odide ala peeji na-egosi ohere ọrụ nnọchiteanya ya n'ọnọdụ a.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta mee ya. Ahịrịokwu ahụ ka bụ nkebi ọnọdụ na-aga n'ihu, ya mere e debere rikọm n'ọgwụgwụ dịka isi mmalite si dị.
