id: MAT.5.42
reference: Matthew 5:42
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: ig
  text: Nye onye na-arịọ gị ihe, atụgharịkwala onye chọrọ ịgbazite ihe n’aka gị azụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ajụla onye chọrọ ịgbazite ihe n’aka gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτοῦντί
  choice: onye na-arịọ gị ihe
  rationale: Participu nwere artikul na-arụ ọrụ dị ka aha ma na-ezo aka n’ozuzu nye onye na-arịọ. Ịtinye “ihe” na-eme ka okwu ahụ bụrụ Igbo nkịtị n’agbanyeghị na ihe a na-arịọ akọwaghị ya.
- source_word: δός
  choice: Nye
  rationale: Iwu aorist nke δίδωμι bụ iwu kwụ ọtọ; “Nye” na-edobe ike iwu ahụ n’etinyeghị okwu modal ọzọ.
- source_word: θέλοντα
  choice: onye chọrọ
  rationale: Participu a nwere artikul ma na-arụ ọrụ dị ka aha. “Onye chọrọ” bụ ụzọ Igbo dị mfe ma kwekọọ na θέλω.
- source_word: ἀπὸ σοῦ
  choice: n’aka gị
  rationale: N’ọnọdụ ịgbazite ihe, “n’aka gị” bụ ụzọ Igbo sitere n’okike isi gosi na ihe ahụ ga-esi n’aka onye a na-agwa okwu.
- source_word: δανίσασθαι
  choice: ịgbazite ihe
  rationale: Okwu a pụtara ịnara ihe n’aka onye ọzọ ka e mesịa weghachi ya. “Ịgbazite ihe” anaghị amachibido ihe ahụ n’ego, ebe Grik ekwughị ihe a ga-agbazite.
- source_word: μὴ ἀποστραφῇς
  choice: atụgharịkwala ... azụ
  rationale: Nkebi a bụ mmachibido iwu. Nsụgharị a na-edobe onyinyo nke ịtụgharị mmadụ azụ, kama ịkọwa ya naanị dị ka ịjụ arịrịọ.
theological_decisions:
- issue: Oke na ike iwu omume Jizọs nyere
  choice: E gosipụtara ya dị ka iwu abụọ kwụ ọtọ nke metụtara onye ọ bụla na-arịọ ma ọ bụ chọrọ ịgbazite ihe.
  alternative: Ịkọwa ya ka ọ bụ naanị maka ụfọdụ ndị a hụrụ na ha kwesiri, ma ọ bụ ịsụgharị akụkụ nke abụọ naanị dị ka “ajụla ya.”
  rationale: Grik nyere iwu ndị a n’ozuzu, n’etinyeghị ókè gbasara ụdị onye na-arịọ. Ya mere, nsụgharị ahụ ekwesịghị itinye nkọwa ma ọ bụ mbelata nke adịghị n’ederede.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. “Atụgharịkwala ... azụ” na-echekwa onyinyo okwu Grik; ihe e dere n’okpuru na-enye ụzọ nkọwa ya nke ọma karịa.
