review_pass:
  verdict: approve
  source_fidelity: The translation accurately renders both imperatives and their generic substantival participants. “Nye onye na-arịọ gị ihe” naturally expresses giving to the person asking, while “atụgharịkwala onye chọrọ ịgbazite ihe n’aka gị azụ” retains the prohibition against turning away a prospective borrower. The unspecified object is appropriately retained as “ihe,” without narrowing the borrowing to money.
  naturalness: The wording is clear, idiomatic Standard Igbo, and maintains an appropriately direct but dignified register. “N’aka gị” is a natural contextual rendering of ἀπὸ σοῦ, and “atụgharịkwala ... azụ” is an understandable idiom for not turning someone away.
  terminology: “Nye,” “na-arịọ,” “ịgbazite,” and “atụgharịkwala ... azụ” are suitable and consistent. The footnote supplies a legitimate more-explicit alternative (“ajụla”) without making that interpretation the main text.
