review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the beatitude, the active sense of εἰρηνοποιοί, the causal clause, and the future passive ‘will be called.’ However, ‘ụmụ ndị ikom nke Chineke’ is an overly literal and semantically awkward rendering of υἱοὶ θεοῦ in Standard Igbo. It can suggest male children as a contrastive biological category rather than the Greek filial designation, whose referents in this saying are not restricted to males.
  naturalness: ‘Ngọzi na-adịrị ndị na-eme ka udo dịrị’ is clear, dignified Standard Igbo. Replacing ‘ụmụ ndị ikom nke Chineke’ with the established idiom ‘ụmụ Chineke’ makes the final clause natural and readily intelligible without losing its filial sense.
  terminology: Use ‘ụmụ Chineke’ in the text. Retain a footnote noting that the Greek literally says ‘sons of God’ and uses masculine plural filial language with representative force. This preserves relevant source-language information without importing an unnatural calque into Igbo.
  issues:
  - severity: medium
    issue: ‘ụmụ ndị ikom nke Chineke’ is an unnatural calque for υἱοὶ θεοῦ.
    rationale: In Standard Igbo, ‘ụmụ Chineke’ is the idiomatic filial designation. Adding ‘ndị ikom’ makes masculine sex unnecessarily foregrounded and may imply an exclusion that the representative masculine plural does not require in this context.
  revised_text: Ngọzi na-adịrị ndị na-eme ka udo dịrị[a], n’ihi na a ga-akpọ ha ụmụ Chineke.
