  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: ig
  text: Ngọzi na-adịrị ndị na-eme ka udo dịrị[a], n’ihi na a ga-akpọ ha ụmụ Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, Grik kwuru, “ụmụ ndị ikom nke Chineke.” Ọ na-eji asụsụ ọtụtụ nke nwoke gbasara ịbụ ụmụ n’ụzọ nnọchiteanya.
    reason: source_language_note
lexical_decisions:
- source_word: μακάριοι
  choice: Ngọzi na-adịrị
  rationale: Nke a na-egosi ọnọdụ ndị Chineke kwadoro ma gọzie, karịa naanị mmetụta obi ụtọ.
- source_word: εἰρηνοποιοί
  choice: ndị na-eme ka udo dịrị
  rationale: Ọ na-egosi ndị na-arụsi ọrụ ike iweta ma ọ bụ mee ka udo dịrị, dịka aha onye na-eme ihe dị n'okwu Grik ahụ si dị.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara ngọzi ahụ n'Igbo doro anya ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: αὐτοὶ
  choice: ha
  rationale: N'usoro ahịrịokwu Igbo a, 'ha' na-eburu nrụsiaka nnọchiaha Grik ahụ n'ụzọ eke, n'agbanyeghị na etinyeghị 'ha onwe ha' nke ga-ada arọ.
- source_word: υἱοὶ θεοῦ
  choice: ụmụ ndị ikom nke Chineke
  rationale: Nke a na-edobe asụsụ ụmụ nwoke dị na υἱοί ma na-ahapụ ihe ọ pụtara gbasara ọnọdụ mmekọrịta nwa na nna ka ọ dị; nkọwa ala peeji na-egosi na ọ nwere ike ịnọchite anya ụmụ Chineke niile.
- source_word: κληθήσονται
  choice: a ga-akpọ
  rationale: Nke a na-edobe ọdịdị ọdịnihu na nke nnara omume nke ngwaa Grik, n'etinyeghị nkọwa ọzọ dịka naanị 'a ga-amata ha dị ka.'
theological_decisions:
- issue: Asụsụ gbasara ụmụ nwoke n'okwu υἱοὶ θεοῦ
  choice: ụmụ ndị ikom nke Chineke
  alternative: ụmụ Chineke
  rationale: Isi ederede na-edobe ụdị nwoke ọtụtụ dị na Grik na echiche ọnọdụ ịbụ nwa nwere ike iso ya, ebe nkọwa ala peeji na-eme ka o doo anya na e nwekwara ike ịghọta ya n'ụzọ nnọchiteanya nke gụnyere ụmụ Chineke niile.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-eji ntụgharị eke mee ka ọrụ ndị na-eweta udo pụta ìhè, ma na-edobe okwu Grik a kapịrị ọnụ gbasara 'ụmụ ndị ikom' na isi ederede.
