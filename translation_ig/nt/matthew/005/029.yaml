id: MAT.5.29
reference: Matthew 5:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: ig
  text: Ma ọ bụrụ na anya nri gị na-eme ka ị sụọ ngọngọ[a], ghụpụ ya, tụfuo ya ka ọ pụọ n’ebe ị nọ. N’ihi na ọ kaara gị mma ka otu akụkụ ahụ gị laa n’iyi karịa ka a tụba ahụ gị dum na Gehena[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “na-eme ka i mee mmehie.”'
    reason: lexical_alternative
  - marker: b
    text: Gehena bụ ụdị Grik nke aha e jikọtara na Ndagwurugwu Hinọm; a na-asụgharịkarị ya “hel.”
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: na-eme ka ị sụọ ngọngọ
  rationale: Nke a na-echekwa ihe atụ Grik nke ịsụ ngọngọ, ma ọ ka na-egosi n’ụzọ doro anya na ihe a na-ekwu bụ ihe na-eduga mmadụ ná mmehie.
- source_word: ἔξελε
  choice: ghụpụ ya
  rationale: Okwu a bụ iwu siri ike nke na-egosi iwepụ anya ahụ n’ike, ọ bụghị nanị iwepụ ya nwayọọ.
- source_word: βάλε ἀπὸ σοῦ
  choice: tụfuo ya n’ebe dị anya n’ebe ị nọ
  rationale: Nke a na-echekwa ma ike dị n’iwu ‘tụfuo’ ma echiche nke ime ka ihe ahụ pụọ kpamkpam n’ebe onye ahụ nọ.
- source_word: συμφέρει
  choice: ọ kaara gị mma
  rationale: Nke a bụ ụzọ Igbo sitere n’okike si egosi uru dị n’otu nhọrọ karịa nke ọzọ.
- source_word: ἀπόληται
  choice: laa n’iyi
  rationale: Nhọrọ a na-echekwa ịdị arọ nke mfu ahụ n’ebughị ụzọ kọwaa ya dị ka mkpochapụ kpamkpam.
- source_word: μέλος
  choice: akụkụ ahụ
  rationale: Ọ na-ezo aka n’otu akụkụ nke ahụ ma dabara anya nke ọma karịa okwu pụtara naanị aka ma ọ bụ ụkwụ.
- source_word: βληθῇ
  choice: a tụba
  rationale: Ụdị a na-echekwa olu nnara na ike nke ngwaa Grik ahụ n’Igbo dị mfe nghọta.
- source_word: γέενναν
  choice: Gehena
  rationale: Aha a na-echekwa okwu pụrụ iche dị na Grik na njikọ akụkọ ihe mere eme ya, kama ịgbasa ya ozugbo ka ọ bụrụ okwu ozizi sara mbara.
- source_word: ὁ δεξιὸς
  choice: aka nri
  rationale: Nke a na-edowe nkọwa doro anya nke isi mmalite banyere anya nke aka nri.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi njikọ nwere obere mmegide n’ihe Jizọs kwuru tupu nke a.
theological_decisions:
- issue: Nsụgharị γέεννα
  choice: Gehena
  alternative: ala mmụọ (hel)
  rationale: Idowe ‘Gehena’ na-echekwa aha pụrụ iche Jizọs ji mee ihe ma na-ezere itinye ozizi ndị mechara pụta n’ime okwu ahụ. Ihe odide ala peeji na-egosi nsụgharị a na-ahụkarị.
- issue: Ike ihe atụ dị na σκανδαλίζω
  choice: na-eme ka ị sụọ ngọngọ
  alternative: na-eme ka i mee mmehie
  rationale: Isi ederede na-echekwa ihe atụ nke ịsụ ngọngọ dị na Grik. Ebe ihe gbara amaokwu ahụ gburugburu metụtara mmehie, a na-enye nkọwa ahụ dị ka nhọrọ n’ihe odide ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. Ahịrịokwu ahụ na-edowe iwu ndị siri ike na ntụnyere dị n’asụsụ Grik, ma na-ezere okwu ụka nke otu òtù pụrụ iche.
