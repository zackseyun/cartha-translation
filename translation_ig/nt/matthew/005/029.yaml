revisions:
- from: Ma ọ bụrụ na anya aka nri gị na-eme ka ị sụọ ngọngọ[a], ghụpụ ya, tụfuo ya n’ebe dị anya n’ebe ị nọ. N’ihi na ọ kaara gị mma ka otu akụkụ ahụ gị laa n’iyi karịa ka a tụba ahụ gị dum na Gehena[b].
  to: Ma ọ bụrụ na anya nri gị na-eme ka ị sụọ ngọngọ[a], ghụpụ ya, tụfuo ya ka ọ pụọ n’ebe ị nọ. N’ihi na ọ kaara gị mma ka otu akụkụ ahụ gị laa n’iyi karịa ka a tụba ahụ gị dum na Gehena[b].
  rationale: The revision improves idiomatic Standard Igbo for ‘right eye’ and for casting something away from oneself, while preserving the Greek’s metaphor, imperative force, comparison, passive construction, and the untranslated proper term ‘Gehena.’ The footnote is narrowed to a historically and lexically appropriate conventional alternative.
  reviewer_model: gpt-5.6-terra
