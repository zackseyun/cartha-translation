    text: 'Ma ọ bụ: “na-eme ka i mee mmehie.”'
    reason: lexical_alternative
  - marker: b
    text: Gehena bụ ụdị Grik nke aha e jikọtara na Ndagwurugwu Hinọm; a na-asụgharịkarị ya “hel.”
    reason: alternative_reading
  revision_rationale: The revision improves idiomatic Standard Igbo for ‘right eye’ and for casting something away from oneself, while preserving the Greek’s metaphor, imperative force, comparison, passive construction, and the untranslated proper term ‘Gehena.’ The footnote is narrowed to a historically and lexically appropriate conventional alternative.
