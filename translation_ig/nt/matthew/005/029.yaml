review_pass:
  verdict: revise
  source_fidelity: The draft retains the explicit ‘right’ qualification, the stumbling metaphor of σκανδαλίζω, the forceful imperatives, the comparison between one bodily part being lost and the whole body being thrown into Gehenna, and the passive sense of βληθῇ. The phrase for throwing the eye away is, however, overly repetitive and does not naturally express ἀπὸ σοῦ (‘from/away from you’).
  naturalness: ‘Anya nri gị’ is the more idiomatic Standard Igbo expression for ‘your right eye.’ ‘Tụfuo ya ka ọ pụọ n’ebe ị nọ’ is natural and clearly conveys separation, without the awkward repetition in ‘n’ebe dị anya n’ebe ị nọ.’
  terminology: ‘Gehena’ appropriately preserves γέεννα. The footnote should not equate it with ‘ala mmụọ,’ which can denote the spirit world and is not a reliable equivalent here. ‘Hel’ is the usual conventional rendering to note as an alternative.
  issues:
  - severity: medium
    issue: The expression ‘tụfuo ya n’ebe dị anya n’ebe ị nọ’ is repetitive and unnatural.
    rationale: It adds ‘far’ beyond the Greek and repeats ‘n’ebe’; the source requires throwing it away from oneself, not necessarily specifying distance.
  - severity: low
    issue: ‘Anya aka nri gị’ is less idiomatic than ‘anya nri gị.’
    rationale: Both can be understood, but ‘anya nri’ is the usual natural Standard Igbo designation for the right eye.
  - severity: medium
    issue: The Gehenna footnote offers ‘ala mmụọ’ as though it were a standard equivalent.
    rationale: ‘Ala mmụọ’ has broader and potentially different associations. The note should identify the historical name and give only the conventional alternative ‘hel,’ without importing extra theological meaning.
  revised_text: Ma ọ bụrụ na anya nri gị na-eme ka ị sụọ ngọngọ[a], ghụpụ ya, tụfuo ya ka ọ pụọ n’ebe ị nọ. N’ihi na ọ kaara gị mma ka otu akụkụ ahụ gị laa n’iyi karịa ka a tụba ahụ gị dum na Gehena[b].
  revised_footnotes:
