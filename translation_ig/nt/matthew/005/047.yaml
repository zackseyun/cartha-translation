id: MAT.5.47
reference: Matthew 5:47
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: ig
  text: Ọ bụrụkwa na unu na-ekele naanị ụmụnne unu[a], gịnị pụrụ iche ka unu na-eme[b]? Ọ̀ bụghịkwa otu ihe ahụ ka ndị mba ọzọ[c] na-eme?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ kwuru “ụmụnne nwoke,” ma n’ebe a ọ pụkwara ịgụnye ụmụnne nwoke na ụmụnne nwanyị, ma ọ bụ ndị otu unu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “gịnị ọzọ ka unu na-eme?”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ndị na-ekpere arụsị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: na-ekele
  rationale: N’ebe a, okwu Grik ahụ pụtara ịkele mmadụ ma ọ bụ ịgwa ya okwu ekele. “Na-ekele” bụ okwu Igbo doro anya nke na-adịghị etinye echiche ile ọbịa na-adịghị n’amaokwu ahụ.
- source_word: ἀδελφοὺς
  choice: ụmụnne
  rationale: “Ụmụnne” bụ ụzọ Igbo sitere n’ụzọ ebumpụta ụwa ekwu maka ụmụnne ma nwee ike ịgụnye ndị otu ezinụlọ ma ọ bụ ndị otu mmadụ. Ọ na-echekwa ohere sara mbara nke okwu Grik ahụ n’ebe a; ihe gbasara ọdịdị oke nwoke ya kọwara n’ala peeji.
- source_word: μόνον
  choice: naanị
  rationale: “Naanị” na-egosi na ha na-ekele otu ndị a ma ghara ịkele ndị ọzọ.
- source_word: τί περισσὸν ποιεῖτε
  choice: gịnị pụrụ iche ka unu na-eme
  rationale: περισσόν na-ezo aka n’ihe karịrị ihe a na-emekarị ma ọ bụ ihe pụrụ iche. Nsụgharị a na-eburu ike ajụjụ ahụ n’Igbo nkịtị.
- source_word: ἐθνικοὶ
  choice: ndị mba ọzọ
  rationale: N’ọnọdụ ndị Juu nke okwu a, ἐθνικοί bụ ndị na-abụghị ndị Juu. “Ndị mba ọzọ” na-echekwa ọdịiche ahụ n’etinyeghị mkpebi okpukpe siri ike nke “ndị na-ekpere arụsị” nwere ike itinye.
- source_word: τὸ αὐτὸ
  choice: otu ihe ahụ
  rationale: Nke a bụ ụzọ Igbo doro anya na nke ebumpụta ụwa isi kwuo “the same thing.”
theological_decisions:
- issue: Oke ndị ἀδελφοὺς na-ezo aka na ha
  choice: E ji “ụmụnne” mee ihe n’amaokwu ahụ.
  alternative: ụmụnne nwoke; ụmụnne nwoke na ụmụnne nwanyị; ndị otu unu
  rationale: Ọ bụ ezie na okwu Grik ahụ dị n’ụdị ọtụtụ nke oke nwoke, n’ọnọdụ a ọ pụrụ izo aka n’ụmụnne ma ọ bụ ndị otu mmadụ n’ụzọ sara mbara. “Ụmụnne” bụ okwu Igbo kwesịrị ekwesị nke na-ahapụghị esemokwu ahụ; ala peeji na-eme ka ọdịdị Grik ahụ doo anya.
- issue: Ihe ἐθνικοὶ pụtara
  choice: ndị mba ọzọ
  alternative: ndị Jentaịl; ndị na-ekpere arụsị
  rationale: Isi echiche ya n’ọnọdụ a bụ ndị na-abụghị ndị Juu. Nhọrọ a na-echekwa ọdịiche agbụrụ na ọgbụgba ndụ ahụ, ma ọ naghị eme ka okwu ahụ bụrụ nkatọ okpukpe karịrị ihe Grik kwuru.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. Usoro ajụjụ abụọ ahụ na-echekwa ike okwu nkwagide dị na Grik, ebe akara [a], [b], na [c] na-egosi ezigbo nhọrọ ntụgharị na-enweghị idozi ihe ederede ahụ hapụrụ oghe.
