id: MAT.5.24
reference: Matthew 5:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: ig
  text: Hapụ onyinye gị n’ebe ahụ n’ihu ebe ịchụ aja, gaa; buru ụzọ gị na nwanne gị[b] dịghachi ná mma[a], mgbe ahụ bịa chụọ onyinye gị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị ya, “ka gị na nwanne gị dịghachi ná mma.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Greek a sụgharịrị “nwanne” bụ okwu nwoke otu onye. Ma okwu Igbo bụ “nwanne” anaghị egosi ma onye ahụ ọ bụ nwoke ma ọ bụ nwanyị; n’ọnọdụ a, ụkpụrụ nke imezi mmekọrịta nwekwara ike ịmetụta ndị ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: Hapụ
  rationale: N’ebe a, ngwaa ahụ pụtara ịhapụ ihe ka ọ nọrọ n’otu ebe, ọ bụghị ‘ịgbaghara’ ma ọ bụ ‘ikwe ka.’
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: Nke a na-edobe nkọwa gbasara ebe a ga-ahapụ onyinye ahụ.
- source_word: τὸ δῶρόν σου
  choice: onyinye gị
  rationale: ‘Onyinye’ na-egosipụta ihe e wetara nye Chineke; okwu banyere ebe ịchụ aja na-eme ka ọnọdụ ịchụ aja doo anya.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: n’ihu ebe ịchụ aja
  rationale: Nke a bụ ụzọ Igbo doro anya si egosipụta ọnọdụ ihe ahụ n’ihu ebe a na-achụ aja.
- source_word: ὕπαγε
  choice: gaa
  rationale: Iwu dị nkenke nke na-egosipụta mmegharị gaa ebe ọzọ.
- source_word: πρῶτον
  choice: buru ụzọ
  rationale: Ọ na-edobe mkpa na usoro nke ime ka mmekọrịta dịghachi ná mma tupu inye onyinye.
- source_word: διαλλάγηθι
  choice: mee ka … dịghachi ná mma
  rationale: Nke a bụ okwu Igbo nkịtị ma dị ùgwù nke na-egosipụta ịbanye ọzọ n’ọnọdụ udo na ezi mmekọrịta, n’enweghị ịkọwa onye kpatara esemokwu ahụ.
- source_word: τῷ ἀδελφῷ σου
  choice: gị na nwanne gị
  rationale: Njikọ ‘gị na’ bụ ụzọ Igbo e ji ekwu mmekọrịta nke mmadụ abụọ na-emezi; ‘nwanne’ bụ okwu Igbo sitere n’okike nke nwere ike ịpụta nwoke ma ọ bụ nwanyị.
- source_word: τότε
  choice: mgbe ahụ
  rationale: Ọ na-egosipụta na omume nke abụọ ga-esochi mmezi mmekọrịta.
- source_word: ἐλθὼν
  choice: bịaghachi
  rationale: Ọ bụ ezie na Greek pụtara kpọmkwem ‘bịa,’ ọnọdụ ahụ na-egosi na onye ahụ ga-alaghachi n’ebe onyinye ahụ dị; ‘bịaghachi’ na-eme ka usoro ahụ doo anya n’Igbo.
- source_word: πρόσφερε
  choice: nye
  rationale: N’ọnọdụ ịchụ aja, ‘nye onyinye’ bụ okwu Igbo dị mfe ma bụrụkwa nke nkịtị maka iweta ihe a na-enye Chineke.
theological_decisions:
- issue: Ụdị iwu na διαλλάγηθι na onye ga-ebute mmezi mmekọrịta
  choice: mee ka gị na nwanne gị dịghachi ná mma
  alternative: ka e mee ka gị na nwanne gị dịghachi ná mma
  rationale: Ụdị a họọrọ na-agụ nke ọma n’Igbo ma na-akpọ onye a na-agwa ka o mee ihe iji weghachite udo. Ọ naghị ekwu na ọ bụ naanị ya kpatara esemokwu ahụ. Ihe ọzọ a pụrụ ịsụ na-edobe ọdịdị passive nke Greek nke ọma karịa, ma ọ naghị ada ka iwu nkịtị n’Igbo.
- issue: Ịsụgharị ἀδελφός, okwu Greek nke bụ nwoke otu onye
  choice: nwanne gị
  alternative: nwanne gị nwoke
  rationale: ‘Nwanne’ bụ okwu Igbo nkịtị maka onye mmadụ na ya nwere njikọ nwanne ma ọ bụ onye ibe ya, ma okwu ahụ n’onwe ya anaghị egosi okike. Ịgbakwunye ‘nwoke’ ga-edobe okike grammatical nke Greek, ma ọ nwere ike ime ka ndị na-agụ ya chee na ụkpụrụ ahụ metụtara naanị nwoke. Ihe odide ala peeji na-echekwa nkọwa nke ụdị Greek.
translation_notes:
  register: 'E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù, sụgharịa amaokwu ahụ. Nkebi ahịrịokwu dị mkpirikpi na-edobe usoro iwu atọ ahụ: hapụ onyinye ahụ, buru ụzọ meezi mmekọrịta, mgbe ahụ laghachi nye onyinye ahụ. E tinyere akara ala peeji [a] na [b] kpọmkwem n’ebe okwu ha na-akọwa dị.'
