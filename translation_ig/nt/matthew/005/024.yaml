revisions:
- from: Hapụ onyinye gị n’ebe ahụ n’ihu ebe ịchụ aja, gaa. Buru ụzọ mee ka gị na nwanne gị[b] dịghachi ná mma[a]; mgbe ahụ, bịaghachi nye onyinye gị.
  to: Hapụ onyinye gị n’ebe ahụ n’ihu ebe ịchụ aja, gaa; buru ụzọ gị na nwanne gị[b] dịghachi ná mma[a], mgbe ahụ bịa chụọ onyinye gị.
  rationale: The revision retains the source’s command sequence—leave, go, first be reconciled, then come and offer—while avoiding the added explicit sense of return. It uses a direct non-causative reconciliation expression and a cultically appropriate verb for offering the gift. Footnote anchors remain attached to the reconciliation and “brother” expressions they explain.
