- from: Mee ngwa ngwa ka obi dị gị mma n’ebe onye na-ebo gị ebubo nọ[a], mgbe gị na ya ka nọ n’ụzọ, ka onye ahụ na-ebo gị ebubo ghara inyefe gị n’aka onyeikpe, onyeikpe ahụ enyefekwa gị n’aka onye nche ụlọikpe, e mesịa tụba gị n’ụlọ mkpọrọ.
  to: Nwee obi ọma n’ebe onye na-emegide gị n’ịkpe nọ ngwa ngwa[a], mgbe gị na ya ka nọ n’ụzọ, ka onye ahụ na-emegide gị ghara inyefe gị n’aka onyeikpe, onyeikpe ahụ enyefekwa gị n’aka onye ọrụ ụlọikpe, e mesịa tụba gị n’ụlọ mkpọrọ.
  rationale: E degharịala iwu mmalite ka ọ bụrụ Igbo eke nke na-egosi inwe ihu ọma, ma ọ bụghị nanị idozi okwu. E debekwala ἀντίδικος n’echiche ya sara mbara dịka onye mmegide n’usoro ikpe; ndetu ala peeji na-enye ntụgharị idiomatik nke metụtara nkwekọrịta. A gbanwerekwa aha ὑπηρέτης ka ọ ghara ikwu karịa ihe okwu Grik ahụ kwuru.
