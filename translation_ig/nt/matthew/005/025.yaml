id: MAT.5.25
reference: Matthew 5:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: ig
  text: Nwee obi ọma n’ebe onye na-emegide gị n’ịkpe nọ ngwa ngwa[a], mgbe gị na ya ka nọ n’ụzọ, ka onye ahụ na-emegide gị ghara inyefe gị n’aka onyeikpe, onyeikpe ahụ enyefekwa gị n’aka onye ọrụ ụlọikpe, e mesịa tụba gị n’ụlọ mkpọrọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, dịka okwu iwu dabara adaba karị: “Gị na onye na-emegide gị n’ịkpe dozie okwu ngwa ngwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: Mee ... ka obi dị gị mma n’ebe ... nọ
  rationale: Nke a na-echekwa isi echiche nke ịbụ onye nwere ezi obi ma ọ bụ ihu ọma n’ebe onye ọzọ nọ, kama ịkọwa ya ozugbo dị ka idozi esemokwu; iwu ahụ na-egosikwa omume a ga-eme ngwa ngwa.
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: onye na-ebo gị ebubo
  rationale: Ọnọdụ ikpe nke okwu ahụ—onyeikpe, onye ọrụ ụlọikpe, na ụlọ mkpọrọ—na-akwado ntụgharị nke na-egosi onye na-emegide mmadụ n’ikpe.
- source_word: ταχὺ
  choice: ngwa ngwa
  rationale: Ọ na-egosi mkpa ime ihe ahụ n’egbughị oge.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: mgbe gị na ya ka nọ n’ụzọ
  rationale: Nke a na-edobe ihe atụ doro anya nke mmadụ abụọ nọkọrọ n’ụzọ, na-akọwaghị n’ime ederede na ụzọ ahụ bụ kpọmkwem ụzọ ụlọikpe.
- source_word: μήποτέ
  choice: ka ... ghara
  rationale: Usoro a bụ ụzọ Igbo dị eke isi gosipụta ịdọ aka ná ntị banyere ihe nwere ike ime.
- source_word: παραδῷ
  choice: inyefe ... n’aka
  rationale: Ọ na-egosi nnyefe mmadụ n’okpuru ikike onye ọzọ n’usoro ikpe.
- source_word: κριτῇ / κριτὴς
  choice: onyeikpe
  rationale: Nke a bụ okwu Igbo ọkọlọtọ ma doo anya maka onye na-ekpe ikpe.
- source_word: ὑπηρέτῃ
  choice: onye nche ụlọikpe
  rationale: N’usoro ikpe a, okwu ahụ na-ezo aka n’onye nọ n’okpuru onyeikpe nke na-eme ka iwu ikpe mezuo; ntụgharị a na-eme ka ọrụ ya doo anya n’Igbo.
- source_word: εἰς φυλακὴν
  choice: n’ụlọ mkpọrọ
  rationale: Nke a bụ ntụgharị Igbo ọkọlọtọ maka ebe a na-edebe onye mkpọrọ.
- source_word: βληθήσῃ
  choice: tụba gị
  rationale: Ọ na-echekwa ike na nkọwa doro anya nke ngwaa βάλλω karịa okwu dị nro dịka ‘tinye.’
theological_decisions:
- issue: Ma iwu mmalite ahụ ọ ga-abụ okwu iwu pụtara ‘dozie okwu’ ka ọ bụ ka e chekwaa echiche nke inwe ezi obi n’ebe onye mmegide nọ
  choice: E debere isi echiche nke εὐνοέω dịka ‘Mee ... ka obi dị gị mma n’ebe ... nọ.’
  alternative: ‘Gị na onye na-ebo gị ebubo kwekọrịta ngwa ngwa’ ma ọ bụ ‘Dozie okwu gị na ya ngwa ngwa.’
  rationale: Ọnọdụ ahụ nwere ike ịpụta nkwekọrịta tupu ikpe, ma isi okwu Grik na-elekwasị anya n’ịbụ onye nwere ihu ọma ma ọ bụ ezi obi n’ebe onye ahụ nọ. Ihe odide bụ isi na-echekwa nghọta ahụ, ebe ndetu ala peeji na-enye ntụgharị iwu nke dabara n’ọnọdụ ahụ.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe oyiyi nke ịnọkọ n’ụzọ dịka ọ dị n’asụsụ Grik, ma jiri usoro okwu ikpe doro anya. Akara ndetu [a] dị n’ederede bụ isi.
