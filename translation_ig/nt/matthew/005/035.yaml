  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: ig
  text: ejikwala ụwa ṅụọ iyi, n’ihi na ọ bụ ihe mgbakwasị ụkwụ ya[b]; ejikwala Jerusalem ṅụọ iyi[a], n’ihi na ọ bụ obodo nke nnukwu Eze ahụ[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, e ji preposition εἰς, nke na-enwekarị echiche ntụziaka dịka “gaa” ma ọ bụ “n’ebe,” mee ihe n’ihu Jerusalem. Ma n’usoro okwu iyi ebe a, ọ pụrụ ịrụ ọrụ n’ụzọ idiomatik n’echiche “iji Jerusalem ṅụọ iyi.”
    reason: lexical_alternative
  - marker: b
    text: 'Nke a na-ezo aka n’Aịzaya 66:1: “ụwa bụ ihe mgbakwasị ụkwụ m.”'
    reason: cross_reference
  - marker: c
    text: Nke a na-ezo aka n’Abụ Ọma 48:2, ebe a kpọrọ Jerusalem “obodo nke nnukwu Eze ahụ.”
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: ejikwala … ṅụọ iyi
  rationale: Okwu a na-aga n’ihu n’usoro mmachibido iwu malitere n’amaokwu bu ụzọ. Iweghachite ngwaa ‘ṅụọ iyi’ na-eme ka Igbo doo anya ma na-echekwa njikọ ahụ.
- source_word: ἐν τῇ γῇ
  choice: ejikwala ụwa ṅụọ iyi
  rationale: N’usoro okwu iyi a, ἐν na-egosi ihe e ji aṅụ iyi. Usoro ‘iji … ṅụọ iyi’ bụ Igbo sitere n’ọdịnala okwu, dokwara anya.
- source_word: γῇ
  choice: ụwa
  rationale: N’ebe a, a na-atụnyere ya eluigwe na Jerusalem; ya mere ọ pụtara ụwa dum, ọ bụghị otu ala ma ọ bụ ógbè.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara mmachibido iwu ahụ.
- source_word: ὑποπόδιόν
  choice: ihe mgbakwasị ụkwụ
  rationale: Nke a bụ okwu Igbo doro anya maka ihe a na-adọba ụkwụ n’elu ya, ma na-echekwa oyiyi dị n’akwụkwọ nsọ e zoro aka na ya.
- source_word: τῶν ποδῶν αὐτοῦ
  choice: ụkwụ ya
  rationale: ‘Ya’ na-anọchi anya nnọchiaha Grik n’enweghị itinye mkpụrụedemede ukwu nke ga-eme ka onye a na-ekwu banyere ya pụta ìhè karịa ka isi mmalite mere.
- source_word: εἰς Ἱεροσόλυμα
  choice: ejikwala Jerusalem ṅụọ iyi
  rationale: Ọ bụ ezie na εἰς na-enwekarị ntụziaka ‘gaa/che Jerusalem ihu,’ n’usoro iyi a ọ na-arụ ọrụ dị ka ihe e ji aṅụ iyi. Nsụgharị a bụ Igbo nkịtị; nkọwa ala peeji na-echekwa ọdịdị preposition Grik ahụ.
- source_word: πόλις
  choice: obodo
  rationale: ‘Obodo’ bụ okwu Igbo nkịtị na nke kwesịrị ekwesị maka πόλις n’ebe a.
- source_word: τοῦ μεγάλου βασιλέως
  choice: nke nnukwu Eze ahụ
  rationale: Nke a na-echekwa genitive nke nwe ya na ịdị elu nke okwu ahụ. ‘Nnukwu Eze ahụ’ na-anọgide nso na okwu Grik ma na-eme ka ntụaka Akwụkwọ Abụ Ọma pụta.
theological_decisions:
- issue: Onye nnọchiaha αὐτοῦ (‘ya’) na-ezo aka na ya
  choice: E ji ‘ya’ mee ihe, nke na-adịghị eji mkpụrụedemede ukwu ekwupụta onye ahụ kpọmkwem, ọ bụ ezie na ihe gbara okwu ahụ gburugburu na-ezo aka na Chineke.
  alternative: Ikwu ‘ụkwụ Chineke’ n’ụzọ doro anya.
  rationale: Grik kwuru naanị αὐτοῦ, ọ kpọghị Chineke aha n’ahịrịokwu a. ‘Ya’ na-echekwa usoro isi mmalite na ntụaka Aịzaya na-eme ka onye ọ bụ doo anya.
- issue: Ọkwa okwu ‘nnukwu Eze ahụ’
  choice: nke nnukwu Eze ahụ
  alternative: nke Eze Ukwu ahụ
  rationale: ‘Nnukwu Eze ahụ’ na-anọ nso na μεγάλου βασιλέως ma ghara ime ya ka ọ bụrụ utu aha pụrụ iche karịa ihe Grik n’onwe ya kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ‘iji ihe ṅụọ iyi’ na-eme ka okwu iyi ahụ bụrụ ihe ndị na-agụ Igbo ga-aghọta ozugbo. N’ihi na amaokwu a bụ ịga n’ihu n’ahịrịokwu malitere na amaokwu 34, e ji mkpụrụedemede nta malite ya, a hapụkwara semicolon n’ọgwụgwụ iji gosi na usoro okwu ahụ ka na-aga n’ihu.
