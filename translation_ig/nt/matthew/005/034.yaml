id: MAT.5.34
reference: Matthew 5:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: ig
  text: 'Ma ana m asị unu: Unu aṅụla iyi ma ọlị—unu ejikwala eluigwe ṅụọ iyi, n’ihi na ọ bụ ocheeze Chineke;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Ma ana m asị unu
  rationale: Na-egosipụta ntụnyere siri ike dị na δέ na nkwusi ike dị na ἐγώ n’ụzọ Igbo dị ndụ ma kwekọọ n’okwu Jizọs.
- source_word: μὴ ὀμόσαι ὅλως
  choice: Unu aṅụla iyi ma ọlị
  rationale: “Ịṅụ iyi” bụ okwu Igbo a na-ahụkarị maka ὀμνύω, ebe “ma ọlị” na-ebute ike zuru ezu nke ὅλως n’enweghị ịgbakwunye nkọwa.
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: unu aṅụkwala iyi n’eluigwe
  rationale: Na-eme ka ngwaa e kwuru na mbụ doo anya n’Igbo; “n’eluigwe” na-anọchi ụzọ e si eji heaven dị ka ihe e ji aṅụ iyi.
- source_word: ὅτι θρόνος ἐστὶν τοῦ θεοῦ
  choice: n’ihi na ọ bụ ocheeze Chineke
  rationale: ὅτι ebe a na-enye ihe kpatara iwu ahụ; “ocheeze Chineke” na-edebe usoro na ihe oyiyi nke Grik.
theological_decisions:
- issue: Ogo mmachibido iwu dị na μὴ ὀμόσαι ὅλως
  choice: Unu aṅụla iyi ma ọlị
  alternative: Unu ejila iyi eme ihe n’ụzọ aghụghọ
  rationale: E debere nkwupụta ahụ n’ụdị sara mbara dịka Grik si kwuo ya, n’ebughị ụzọ belata ya site n’ịkọwa na ọ metụtara naanị iyi aghụghọ ma ọ bụ iyi nkịtị.
- issue: Mmekọrịta nke eluigwe na ocheeze Chineke
  choice: n’ihi na ọ bụ ocheeze Chineke
  alternative: n’ihi na Chineke na-anọ n’ocheeze n’eluigwe
  rationale: Nhọrọ ahụ na-echekwa ihe atụ kpọmkwem nke isi mmalite ma ghara ịgbanwe ya ka ọ bụrụ nkọwa banyere ebe Chineke bi.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “ịṅụ iyi” mee ihe dịka akpaokwu Igbo nkịtị; ahịrịokwu ahụ na-edebe ụda iwu siri ike na njikọ ihe kpatara ya dị n’isi mmalite.
