  verdict: revise
  source_fidelity: The draft correctly conveys Jesus’ contrastive statement, the comprehensive prohibition on swearing, and the reason that heaven is God’s throne. However, "n’eluigwe" can naturally mean “in heaven” as a location in Igbo, whereas the Greek oath formula μήτε ἐν τῷ οὐρανῷ means swearing “by heaven.”
  naturalness: The register is clear and modern Standard Igbo. Recasting the second clause with "ejikwala eluigwe ṅụọ iyi" makes the oath-formula sense explicit and idiomatic without altering the force of the command.
  terminology: '"Ịṅụ iyi" is an appropriate established rendering for taking an oath, and "ocheeze Chineke" accurately preserves θρόνος τοῦ θεοῦ. No doctrinal expansion is introduced.'
  issues:
  - severity: medium
    issue: Potential locative ambiguity in “unu aṅụkwala iyi n’eluigwe.”
    rationale: This may be read as “do not swear in heaven,” rather than “do not swear by heaven.” The Greek construction here identifies heaven as the object invoked in an oath.
