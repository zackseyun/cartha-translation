  naturalness: 'The phrase ''ọ rịgoro n’elu ugwu ahụ'' is understandable but somewhat redundant in Standard Igbo: ''rịgoro'' already expresses upward movement. ''Ọ rịgoro ugwu ahụ'' is the more natural idiom and corresponds closely to the Greek movement onto/up the mountain.'
