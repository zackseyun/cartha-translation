id: MAT.5.1
reference: Matthew 5:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: ig
  text: Mgbe ọ hụrụ ìgwè mmadụ ahụ[a], ọ rịgoro ugwu ahụ[b]. Mgbe ọ nọdụrụ ala[c], ndị na-eso ụzọ ya bịakwutere ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, ‘Ka ọ hụrụ ìgwè mmadụ ahụ.’
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, ‘ọ gara n’elu ugwu ahụ.’
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụ ya, ‘Mgbe ọ nọdụrụla ala.’ Grik ji usoro okwu a na-akpọ genitive absolute.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: Mgbe ọ hụrụ
  rationale: Aorist participle a na-akọ ọnọdụ metụtara ngwaa bụ isi; ‘Mgbe ọ hụrụ’ bụ Igbo doro anya ma ghara ime ka usoro oge sie ike karịa Grik.
- source_word: δὲ
  choice: —
  rationale: Nke a bụ njikọ dị nro n’akụkọ; ịhapụ ya n’enweghị okwu pụrụ iche na-eme ka Igbo bụrụ nke eke, na-agbakwụnyeghị nkwusi ike na-adịghị na Grik.
- source_word: τοὺς ὄχλους
  choice: ìgwè mmadụ ahụ
  rationale: Ọ na-ezo aka n’ọtụtụ mmadụ gbakọtara. N’Igbo, ‘ìgwè mmadụ’ bụ ụzọ eke isi kwuo nke a; ‘ahụ’ na-egosipụta article nke Grik n’enweghị Igbo na-adịghị mma.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: ọ rịgoro n’elu ugwu ahụ
  rationale: ‘Rịgoro n’elu’ na-egosipụta ngagharị elu ruo n’ugwu ma na-ada ka Igbo nke oge a.
- source_word: τὸ ὄρος
  choice: ugwu ahụ
  rationale: ‘Ugwu’ na-anọchi ὄρος nke ọma, ‘ahụ’ na-echekwa ntụaka doro anya nke article; nke a apụtaghị na e nyere ugwu ahụ aha.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: Mgbe ọ nọdụrụ ala
  rationale: Genitive absolute a na-egosi ọnọdụ oge. ‘Mgbe’ na-echekwa mmekọrịta ahụ n’etinyeghị usoro siri ike nke ‘mgbe o mechara’ ga-etinye.
- source_word: προσῆλθαν αὐτῷ
  choice: bịakwutere ya
  rationale: ‘Bịakwutere ya’ bụ okwu Igbo eke nke pụtara ịbịakwuru ma ọ bụ ịbịaru mmadụ nso.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka μαθηταί, ndị na-amụta ihe n’aka onye nkụzi ma na-eso ya.
theological_decisions:
- issue: Article dị na τὸ ὄρος
  choice: ugwu ahụ
  alternative: otu ugwu; mkpọda ugwu ahụ
  rationale: Grik ji article mee ntụaka ahụ ka ọ doo anya. ‘Ugwu ahụ’ na-echekwa nke a, ma ọ naghị ekwu na ọ bụ ugwu nwere aha pụrụ iche.
- issue: Mmekọrịta oge dị na καθίσαντος αὐτοῦ
  choice: Mgbe ọ nọdụrụ ala
  alternative: Mgbe ọ nọdụrụla ala
  rationale: Ihe owuwu Grik na-egosi ọnọdụ oge ma ọ bụ ihe so mee; nhọrọ bụ isi anaghị eme ka ọ bụrụ usoro oge siri ike ma ọ bụ tinye nkọwa okpukpe banyere ịnọdụ ala izi ihe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ maka usoro Igbo eke, ma echekwara njikọ echiche na ambiguity nke participle na genitive absolute.
