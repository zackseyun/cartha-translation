id: MAT.5.20
reference: Matthew 5:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: ig
  text: 'N’ihi na ana m agwa unu: ọ bụrụ na ezi omume unu[a] akarịghị nke ndị odeakwụkwọ na ndị Farisii, unu agaghị abanye ma ọlị n’alaeze eluigwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ikpe ziri ezi unu.” Okwu Grik a nwere ike ịpụta ma ezi omume ma ikpe ziri ezi; n’ebe a, “ezi omume” kacha daba n’ihe a na-ekwu na Matiu 5.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: N’ihi na ana m agwa unu
  rationale: “N’ihi na” na-egosipụta ọrụ nkọwa nke γάρ, ebe “ana m agwa unu” bụ okwu Igbo dị ndụ nke na-echekwa okwu Jizọs gwara ndị na-ege ya ntị ozugbo.
- source_word: ἐὰν μὴ
  choice: ọ bụrụ na ... akarịghị
  rationale: N’usoro Igbo a, ọnọdụ na-adịghị mma pụtara nke ọma site na “ọ bụrụ na” tinyere ngwaa jụrụ ajụ; nke a na-ebunye echiche ‘unless’ n’ụzọ eke.
- source_word: περισσεύσῃ ... πλεῖον
  choice: akarịghị nke
  rationale: Ngwaa “ịkarị” na-egosipụta na ezi omume a ga-agafe nke ìgwè a na-atụnyere ya, n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: ezi omume unu
  rationale: “Ezi omume” bụ okwu Igbo doro anya maka ndụ ziri ezi na omume kwekọrọ n’uche Chineke n’ọnọdụ Matiu 5; ọ naghị ekpebi esemokwu nkà mmụta okpukpe banyere ma okwu ahụ ọ bụ naanị ọnọdụ mmadụ ma ọ bụ omume ya.
- source_word: γραμματέων
  choice: ndị odeakwụkwọ
  rationale: Nke a na-echekwa aha ìgwè ndị odeakwụkwọ maara Iwu nke ọma, kama ịtụgharị ya ozugbo ka ọ bụrụ naanị “ndị nkuzi Iwu,” nke ga-abụ nkọwa karịa ntụgharị.
- source_word: Φαρισαίων
  choice: ndị Farisii
  rationale: Aha ìgwè ahụ ka e dere n’ụdị ntụgharị-ụda a na-amakarị n’Igbo.
- source_word: οὐ μὴ εἰσέλθητε
  choice: unu agaghị abanye ma ọlị
  rationale: “Ma ọlị” na-echekwa nkwusi ike siri ike nke οὐ μή tinyere aorist subjunctive.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: alaeze eluigwe
  rationale: Nke a bụ okwu Igbo eke ma bụrụkwa ụzọ a maara nke ọma isi kwuo ahịrịokwu Matiu a, na-echekwa echiche ọchịchị/alaeze nke Chineke.
theological_decisions:
- issue: Otú e si tụgharị δικαιοσύνη n’ọnọdụ Matiu 5:20
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N’ebe a, ihe a na-atụnyere bụ ndụ na omume ndị na-erubere Chineke isi; ya mere “ezi omume” dabara n’ọnọdụ ahụ karịa “ikpe ziri ezi.” Ihe e nwere ike ịghọta dị ka justice ka e debere n’ala peeji kama ihichapụ ya.
- issue: Ihe a na-atụnyere n’okwu πλεῖον τῶν γραμματέων καὶ Φαρισαίων
  choice: ezi omume unu ... nke ndị odeakwụkwọ na ndị Farisii
  alternative: unu ga-eme ezi omume karịa ndị odeakwụkwọ na ndị Farisii
  rationale: Nhọrọ a na-eme ka o doo anya na ihe a na-atụnyere bụ δικαιοσύνη nke ndị otu abụọ ahụ, ọ bụghị uru mmadụ nwere karịa mmadụ, ma ọ naghị akọwa ụdị ịdị-karị ahụ n’ụzọ otu ozizi pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ usoro okwu ahụ ka ọ bụrụ nke ọnụ a na-ekwu, ma chekwaa nkwusi ike nke njedebe site na “ma ọlị.”
