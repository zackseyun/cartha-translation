base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: ig
  text: Unu bụ ìhè nke ụwa. A pụghị izochi obodo nke dị n’elu ugwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ dị nso n’okwu Grik: “A pụghị izochi obodo dina n’elu ugwu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Unu
  rationale: Nnọchiaha onye nke abụọ n’ụbara pụtara ìhè ma nwee nkwusi ike na Grik. “Unu” na-agwa ndị niile Jizọs na-agwa okwu okwu ozugbo ma dịkwa eke n’Igbo.
- source_word: τὸ φῶς
  choice: ìhè
  rationale: “Ìhè” na-edobe ihe atụ ahụ n'ụzọ doro anya; n’Igbo, a dịghị mkpa ịgbakwunye okwu ga-anọchi artikel Grik ahụ.
- source_word: τοῦ κόσμου
  choice: nke ụwa
  rationale: Nke a na-edobe njikọ genitiv ahụ na nghọta sara mbara nke κόσμος dị ka ụwa na ụmụ mmadụ bi na ya, n’etinyeghị nkọwa ọzọ dịka “maka ụwa.”
- source_word: οὐ δύναται
  choice: A pụghị
  rationale: Nke a bụ ụzọ Igbo dị eke isi kwupụta enweghị ike ma ọ bụ ekweghị omume ahụ omume.
- source_word: πόλις
  choice: obodo
  rationale: “Obodo” bụ okwu Igbo nkịtị ma sara mbara maka ebe ndị mmadụ bi; n’ebe a, ọ na-enye ihe oyiyi πόλις n’enweghị okwu amịpụtara amịpụta.
- source_word: κρυβῆναι
  choice: izochi
  rationale: 'Ụdị a na “A pụghị” na-egosipụta ihe passive pụtara: obodo ahụ enweghị ike ịbụ ihe e zoro ezo.'
- source_word: ἐπάνω ὄρους
  choice: n’elu ugwu
  rationale: “N’elu ugwu” na-esochi Grik nke ọma ma na-ahapụ ὄρος ka ọ bụrụ “ugwu,” kama ime ka ọ bụrụ naanị obere ugwu.
- source_word: κειμένη
  choice: nke dị
  rationale: “Nke dị” bụ ụzọ Igbo dị mfe ma dị eke isi kọwaa obodo nke nọ ma ọ bụ tọgbọrọ n’ebe ahụ, n’agbanyeghị na Grik n’onwe ya nwere echiche “dina/ịnọ n’ọnọdụ.”
theological_decisions:
- issue: Njirimara ihe atụ nke ndị na-eso ụzọ dị ka ìhè
  choice: “Unu bụ ìhè nke ụwa”
  alternative: “Unu bụ ìhè maka ụwa”
  rationale: A hapụrụ ihe atụ ahụ kpọmkwem dịka Grik si kwuo ya, n’agbakwunyeghị nkọwa banyere ọrụ ha ma ọ bụ ozizi pụrụ iche.
- issue: Mmekọrịta ahịrịokwu nke abụọ na nke mbụ
  choice: E debere ya dịka nkwupụta ihe oyiyi na-esote ozugbo
  alternative: Ịgbakwunye njikọ dịka “n’ihi na” ma ọ bụ “dịka”
  rationale: Grik etinyeghị njikọ nkọwa, ya mere ntụgharị ahụ ekwesịghị ikpebi kpọmkwem otú ihe oyiyi obodo ahụ si kọwaa ihe oyiyi ìhè ahụ.
translation_notes:
  register: Igbo Standard nke oge a, dị ùgwù ma dị mfe nghọta. E ji “Unu” debe onye a na-agwa n’ụbara; e ji “obodo” zere okwu teknụzụ ma ọ bụ okwu amịpụtara. Akara ụda dị na “ìhè” iji belata mgbagwoju anya.
