  text: μακάριοι οἱ καθαροὶ τῇ καρδίᾳ, ὅτι αὐτοὶ τὸν θεὸν ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/008.yaml
  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: ig
  text: Ngọzi na-adịrị ndị obi ha dị ọcha, n’ihi na ha ga-ahụ Chineke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Nkwa ahụ, “ha ga-ahụ Chineke,” nwere ike izo aka n’ịbịaru n’ihu Chineke ozugbo, tinyere mmezu ya n’ọdịnihu; e debere okwu ahụ otú ọ dị n’emechighị ihe ọ pụtara.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Ngọzi na-adịrị
  rationale: Nke a na-egosi ọnọdụ ndị Chineke kwadoro ma gọzie, kama ime ka okwu ahụ bụrụ naanị mmetụta nke obi ụtọ.
- source_word: καθαροὶ
  choice: dị ọcha
  rationale: Ọ na-egosi ịdị ọcha n’omume na n’ime mmadụ; ọ ka bụkwa ụzọ e si ekwu okwu nke ọma n’Igbo.
- source_word: τῇ καρδίᾳ
  choice: obi ha
  rationale: N’Igbo, ‘obi’ nwere ike ịpụta ime mmadụ dum—echiche, ọchịchọ na ebumnobi—ọ bụghị naanị mmetụta.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe mere ngọzi ahụ ji dịrị ha, n’ụzọ doro anya ma bụrụkwa Igbo nke oge a.
- source_word: αὐτοὶ
  choice: ha
  rationale: Ọ na-ezo aka kpọmkwem n’otu ndị ahụ e kwuru okwu banyere ha; itinye okwu ọzọ maka nkwusi ike ga-eme ka ahịrịokwu ahụ dị arọ n’Igbo.
- source_word: τὸν θεὸν
  choice: Chineke
  rationale: Nke a bụ ihe ὄψονται na-achị dịka ihe a ga-ahụ; ‘Chineke’ bụ nsụgharị kwụ ọtọ na nke ebumpụta ụwa.
- source_word: ὄψονται
  choice: ga-ahụ
  rationale: Ọ na-echekwa nkwa nke oge na-abịa n’enweghị ịgbasa ma ọ bụ imechi ihe ‘ịhụ’ pụtara.
theological_decisions:
- issue: Ihe ‘ịhụ Chineke’ pụtara
  choice: E debere ya dịka ‘ha ga-ahụ Chineke.’
  alternative: ‘ha ga-abata n’ihu Chineke’ ma ọ bụ ‘ha ga-ahụ Chineke n’ọgwụgwụ oge.’
  rationale: Okwu Grik ahụ dị nkenke ma nwee omimi nke nwere ike ịgụnye ịbịaru n’ihu Chineke na mmezu ya n’ọdịnihu. Nsụgharị ahụ anaghị amachi ya n’otu nkọwa.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ usoro ‘Ngọzi na-adịrị…’ iji chekwaa ọdịdị nkwupụta ngọzi, ebe ‘obi ha dị ọcha’ na-egosi ịdị ọcha nke ime mmadụ n’ụzọ ebumpụta ụwa.
