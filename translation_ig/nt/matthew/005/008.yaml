  naturalness: Ahịrịokwu ahụ bụ Igbo ọkọlọtọ, dị mfe ịghọta, ma dabara n’ụdị nkwupụta ngọzi. “Ndị obi ha dị ọcha” bụ ụzọ ebumpụta ụwa e si akọwa ịdị ọcha nke ime mmadụ.
  terminology: “Ngọzi na-adịrị,” “obi,” na “Chineke” dabara nke ọma na ndebanye aha Akwụkwọ Nsọ na Igbo. “Dị ọcha” na-echekwa mgbagwoju anya dị n’okwu καθαροί, nke nwere ike ịgụnye ịdị ọcha/ịdị ọcha n’ime mmadụ, n’etinyeghị “kpamkpam,” nke isi okwu anaghị ekwu.
