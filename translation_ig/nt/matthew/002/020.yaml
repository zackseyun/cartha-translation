id: MAT.2.20
reference: Matthew 2:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: ig
  text: na-asị, “Bilie, kpọrọ nwata ahụ na nne ya, gaa n’ala Izrel, n’ihi na ndị na-achọ igbu nwata ahụ anwụọla.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ dị nso karị n’okwu Grik: “ndị na-achọ ịnara nwata ahụ ndụ anwụọla.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: na-asị
  rationale: Ọ bụ participle nke na-ejikọta okwu mmụọ ozi ahụ na amaokwu bu ụzọ; ‘na-asị’ na-edobe njikọ ahụ n’ụzọ Igbo dị mfe.
- source_word: Ἐγερθείς
  choice: Bilie
  rationale: Ọ bụ participle aorist e ji mee iwu n’ụzọ akpaala okwu; ‘Bilie’ na-enye iwu ahụ n’Igbo nkịtị.
- source_word: παράλαβε
  choice: kpọrọ
  rationale: N’ebe a, ọ pụtara ịkpọ mmadụ soro gị; ‘kpọrọ’ na-egosi na Josef ga-akpọrọ ha gawa.
- source_word: τὸ παιδίον
  choice: nwata ahụ
  rationale: παιδίον pụtara nwata; ‘ahụ’ na-anọchi article Grik ma na-arụtụ aka n’otu nwata ahụ a marala.
- source_word: τὴν μητέρα αὐτοῦ
  choice: nne ya
  rationale: Nke a bụ ụzọ Igbo doro anya na nke ebumpụta ụwa isi kwuo ‘his mother.’
- source_word: πορεύου
  choice: gaa
  rationale: Imperative a pụtara ịga njem ma ọ bụ ịga ebe; ‘gaa’ bụ okwu kacha mfe ma zie ezi.
- source_word: εἰς γῆν Ἰσραήλ
  choice: n’ala Izrel
  rationale: Ọ na-echekwa echiche nke ókèala ma ọ bụ ala Izrel, ọ bụghị nanị aha ndị mmadụ.
- source_word: τεθνήκασιν
  choice: anwụọla
  rationale: Perfect ahụ na-egosi ọnwụ mere eme nke ọnọdụ ya ka dị ugbu a; suffix ‘-la’ na Igbo na-egosipụta nke a nke ọma.
- source_word: οἱ ζητοῦντες
  choice: ndị na-achọ
  rationale: Ọ na-edobe participle substantival ahụ dịka otu ndị nọ na-achọ ime ihe ahụ.
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: igbu nwata ahụ
  rationale: Akpaala okwu Grik ‘ịchọ ndụ mmadụ’ n’ọnọdụ a pụtara ịchọ igbu ya; Igbo ‘ịchọ igbu’ na-ekwupụta ebumnuche ahụ n’ụzọ doro anya ma dị ndụ.
theological_decisions:
- issue: Ịsụgharị ψυχή n’ọnọdụ iyi ndụ egwu
  choice: igbu nwata ahụ
  alternative: ịchọ ndụ nwata ahụ
  rationale: N’akụkọ a, okwu ahụ na-ekwu maka ndị chọrọ ime ka nwata ahụ nwụọ, ọ bụghị banyere mkpụrụ obi ya. Isiokwu a na-edobe nghọta ahụ n’enweghị itinye ozizi banyere ọdịdị mkpụrụ obi.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘nwata ahụ’ mee ka ntụaka ahụ doo anya; e zere okwu ụka pụrụ iche. A kpọgara akara nkọwa [a] n’isi ngwụcha ahịrịokwu ọ na-akọwa.
