  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης λάθρᾳ καλέσας τοὺς μάγους ἠκρίβωσεν παρ’ αὐτῶν τὸν χρόνον τοῦ φαινομένου ἀστέρος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/007.yaml
  text: Then Herod secretly summoned the magi and determined from them the time when the star had appeared,[a]
translation:
  language: ig
  text: Mgbe ahụ, Herọd kpọrọ ndị Magi[a] na nzuzo, wee chọpụta n'aka ha kpọmkwem oge kpakpando ahụ pụtara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị amamihe.” Okwu Grik bụ μάγοι (magoi), nke na-ezo aka kpọmkwem n’ndị Magi, ndị ọkà mmụta n’Ebe Ọwụwa Anyanwụ bụ́ ndị na-amụ kpakpando.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ akara oge na-eduga n'ihe ọzọ mere n'akụkọ ahụ; okwu a bụ Igbo doro anya ma na-aga nke ọma n'usoro akụkọ.
- source_word: Ἡρῴδης
  choice: Herọd
  rationale: E depụtara aha onye ahụ n'ụdị a na-ejikarị ede ya n'Igbo, kama ịsụgharị ihe aha ahụ pụtara.
- source_word: λάθρᾳ
  choice: na nzuzo
  rationale: Nke a na-egosi na Herọd mere oku ahụ n'ụzọ zoro ezo.
- source_word: καλέσας
  choice: kpọrọ
  rationale: Aorist participle a na-egosi ihe Herọd buru ụzọ mee tupu ọ jụọ ha; n'Igbo, ijikọ omume abụọ ahụ n'usoro a bụ ihe ebumpụta ụwa.
- source_word: τοὺς μάγους
  choice: ndị Magi
  rationale: Ịhapụ ya dị ka aha otu ìgwè ahụ na-echekwa nkọwa kpọmkwem nke μάγοι ma zere ịkpọ ha nanị ndị amamihe, nke na-adịghị egosi ọrụ ha nke ọma.
- source_word: ἠκρίβωσεν
  choice: jụọ ha nke ọma
  rationale: Ngwaa ahụ pụtara ịchọpụta ihe kpọmkwem site n'ịjụ ajụjụ; nsụgharị a na-egosi ma ajụjụ ahụ ma nlezianya Herọd tinyere na ya.
- source_word: παρ’ αὐτῶν
  choice: ha
  rationale: N'ime ahịrịokwu Igbo a, nnọchiaha dị ka ihe nnara nke 'jụọ' na-egosi nke ọma na ozi ahụ si n'aka ndị Magi bịa.
- source_word: τὸν χρόνον
  choice: mgbe
  rationale: N'ọnọdụ a, χρόνος na-ezo aka n'oge ihe ahụ mere; 'mgbe' na-eme ka nkebiokwu oge ahụ bụrụ Igbo dị mfe ma doo anya.
- source_word: τοῦ φαινομένου ἀστέρος
  choice: mgbe kpakpando ahụ pụtara
  rationale: A sụgharịrị genitive participial phrase ahụ dị ka nkebiokwu oge, nke bụ ụzọ Igbo ebumpụta ụwa isi kwuo oge kpakpando ahụ pụtara, n'emebighị ihe akụkụ okwu Grik ahụ nwere ike ịpụta.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere 'ndị Magi' n'ahịrị bụ isi iji chekwaa nkọwa akụkọ ihe mere eme nke okwu Grik, tinyekwa okwu a maara nke ọma, 'ndị amamihe,' n'ala peeji.
