  to: Mgbe ahụ, Herọd kpọrọ ndị Magi[a] na nzuzo, wee chọpụta n'aka ha kpọmkwem oge kpakpando ahụ pụtara.
  rationale: The revision renders ἠκρίβωσεν with “chọpụta ... kpọmkwem,” preserving its sense of precise ascertainment, and renders παρ’ αὐτῶν directly with “n'aka ha.” The footnote remains a lexical alternative but removes an unneeded elaboration.
