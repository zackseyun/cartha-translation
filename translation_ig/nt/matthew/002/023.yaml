id: MAT.2.23
reference: Matthew 2:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: ig
  text: 'Ọ bịara biri n’obodo a na-akpọ Nazaret[a], ka ihe e kwuru site n’ọnụ ndị amụma wee mezuo: “A ga-akpọ ya onye Nazaret.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye Nazorean.” A ka na-arụrịta ụka banyere ebe kpọmkwem n’akwụkwọ ndị amụma okwu a, “A ga-akpọ ya onye Nazaret,” si. O nwere ike ịbụ na Matiu na-achịkọta isiokwu ndị dị n’akwụkwọ ndị amụma kama ikwughachi otu amaokwu kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Ọ bịara
  rationale: Aorist participle a na-ebute isi ngwaa; iji ngwaa zuru ezu sị “Ọ bịara” na-eme ka Igbo bụrụ nke okike ma na-echekwa usoro omume ahụ.
- source_word: κατῴκησεν
  choice: biri
  rationale: “Biri” na-egosi ibi ma ọ bụ iwere ebe dị ka ebe obibi, n’enweghị ịgbakwunye echiche na ọ ga-anọgide ebe ahụ ruo mgbe ebighị ebi.
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: n’obodo a na-akpọ Nazaret
  rationale: N’Igbo, “biri n’obodo” bụ usoro okwu okike maka κατοικέω na εἰς; “obodo” dabara πόλις ma bụrụkwa okwu ndị mmadụ na-aghọta ngwa ngwa.
- source_word: ὅπως πληρωθῇ
  choice: ka ... wee mezuo
  rationale: Usoro “ka ... wee” na-echekwa echiche ebumnuche/ọgwụgwụ dị na ὅπως tinyere subjunctive, ebe “mezuo” na-egosipụta fulfillment formula nke Matiu.
- source_word: τὸ ῥηθὲν διὰ τῶν προφητῶν
  choice: ihe e kwuru site n’ọnụ ndị amụma
  rationale: “Ihe e kwuru” na-anọchi articular participle n’ụzọ okike. “Site n’ọnụ” na-egosi na ndị amụma bụ ndị e si n’aka ha kwuo okwu ahụ, ma na-echekwa plural “ndị amụma.”
- source_word: Ναζωραῖος
  choice: onye Nazaret
  rationale: N’ebe a, okwu ahụ bụ aha njirimara e jikọtara na Nazaret. “Onye Nazaret” bụ Igbo doro anya ma ghara ịgwakọta ya na onye Naziraịt.
- source_word: κληθήσεται
  choice: A ga-akpọ ya
  rationale: Nke a na-echekwa future passive ma na-ada nke ọma n’ụdị amụma n’Igbo.
theological_decisions:
- issue: Ụdị amaokwu amụma Matiu na-emezu mgbe ọ na-enweghị otu ederede Agba Ochie dabara kpọmkwem
  choice: E debere “ndị amụma” n’ụbara, n’enweghị ịkpọ otu amaokwu kpọmkwem n’isi ederede.
  alternative: Ịkọwa ya dị ka ntụaka kpọmkwem nye Aịzaya 11:1, ma ọ bụ dị ka nchịkọta isiokwu banyere ịdị ala na ịbụ onye a na-elelị nke Mesaịa.
  rationale: Grik kwuru “ndị amụma” n’ụbara, nke nwere ike igosi nchịkọta ma ọ bụ otu isiokwu sitere n’aka ọtụtụ ndị amụma. Nsụgharị ahụ ekwesịghị idozi arụmụka a n’isi ederede.
- issue: Nkọwa Ναζωραῖος
  choice: onye Nazaret
  alternative: onye Nazorean; onye Naziraịt
  rationale: Ihe gbara amaokwu ahụ gburugburu jikọtara aha ahụ na obodo Nazaret. A jụrụ “onye Naziraịt” n’ihi na ọ bụ echiche ọzọ gbasara nkwa Naziraịt; e debere ụdị “Nazorean” na nkọwa ala peeji iji chekwaa nhọrọ mkpụrụokwu na ejighị n’aka banyere ndabere amụma ya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Site n’ọnụ ndị amụma” bụ usoro okwu Igbo na-egosi ndị amụma dị ka ndị e si n’aka ha kwuo okwu ahụ; e zere asụsụ ochie na nkọwa okpukpe nke ederede ahụ ekwughị.
