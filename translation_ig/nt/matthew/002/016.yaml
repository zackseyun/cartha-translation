revisions:
- from: Mgbe ahụ, Herọd, mgbe ọ hụrụ na ndị Magi[b] aghọgbuola ya[a], were oké iwe. O zipụrụ ndị mmadụ ka ha gbuo ụmụ nwoke niile nọ na Betlehem na n’ógbè niile gbara ya gburugburu, ndị dị afọ abụọ ma ọ bụ ndị na-erubeghị afọ abụọ, dabere n’oge ọ jụrụ ndị Magi ajụjụ nke ọma wee chọpụta.
  to: Mgbe ahụ, Herọd, ebe ọ hụrụ na ndị Magi[b] aghọgbuola ya[a], were oké iwe. O zipụrụ ndị mmadụ ka ha gbuo ụmụ nwoke niile nọ na Betlehem na n’ógbè niile gbara ya gburugburu, ndị gbara afọ abụọ na ndị ka ha nta, dịka oge ahụ ọ chọpụtara nke ọma n’aka ndị Magi.
  rationale: 'The revised text preserves the Greek’s causal sequence: Herod perceived that the Magi had deceived or made a fool of him, became very angry, sent agents, and had the boys killed. It retains the Magi terminology and footnote anchors, uses a natural inclusive Igbo expression for the age limit, and avoids adding that Herod learned the time specifically by questioning the Magi.'
