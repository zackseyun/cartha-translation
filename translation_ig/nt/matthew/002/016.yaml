id: MAT.2.16
reference: Matthew 2:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: ig
  text: Mgbe ahụ, Herọd, ebe ọ hụrụ na ndị Magi[b] aghọgbuola ya[a], were oké iwe. O zipụrụ ndị mmadụ ka ha gbuo ụmụ nwoke niile nọ na Betlehem na n’ógbè niile gbara ya gburugburu, ndị gbara afọ abụọ na ndị ka ha nta, dịka oge ahụ ọ chọpụtara nke ọma n’aka ndị Magi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “e kwara ya emo.”
    reason: lexical_alternative
  - marker: b
    text: A na-asụgharịkarị ya “ndị amamihe.” Okwu Grik bụ Magi, nke na-ezo aka n’ebe a ná ndị ọkà mmụta na ndị na-enyocha kpakpando si n’Ọwụwa Anyanwụ.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ njikọ oge doro anya nke na-egosi ihe sochiri ihe ndị mere tupu ya.
- source_word: ἐνεπαίχθη
  choice: aghọgbuola ya
  rationale: N’ebe a, okwu ahụ na-egosi na ndị Magi emeghị ihe Herọd tụrụ anya ya, si otú ahụ mee ka atụmatụ ya ghara ịga nke ọma. Ihe ọ pụtara n’ụzọ nkịtị, ‘kwara ya emo,’ dị n’ala peeji.
- source_word: μάγων
  choice: ndị Magi
  rationale: Nke a na-edobe aha pụrụ iche nke ndị ọkà mmụta na ndị na-enyocha kpakpando si n’Ọwụwa Anyanwụ, kama ịkọwa ha naanị dị ka ‘ndị amamihe.’
- source_word: ἐθυμώθη λίαν
  choice: were oké iwe
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma doo anya isi kwuo na iwe were ya nke ukwuu.
- source_word: ἀποστείλας ἀνεῖλεν
  choice: O zipụrụ ndị mmadụ ka ha gbuo
  rationale: Ọ na-egosi na Herọd zigara ndị ga-eme ihe ahụ, ma na ọ bụ n’okpuru iwu ya ka e gburu ụmụaka ahụ.
- source_word: πάντας τοὺς παῖδας
  choice: ụmụ nwoke niile
  rationale: N’agbanyeghị na παῖς nwere ike ịpụta nwa n’ozuzu, ọnọdụ akụkọ a na-ezo aka n’ụmụaka ndị nwoke Herọd chọrọ igbu.
- source_word: ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: na n’ógbè niile gbara ya gburugburu
  rationale: ὅρια n’ebe a pụtara mpaghara ma ọ bụ ógbè ndị gbara Betlehem gburugburu, ọ bụghị naanị ahịrị oke ala.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: ndị dị afọ abụọ ma ọ bụ ndị na-erubeghị afọ abụọ
  rationale: Nke a na-eme ka oke afọ ahụ, nke gụnyere ndị gbara afọ abụọ, doo onye na-agụ Igbo anya.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: dabere n’oge ọ jụrụ ndị Magi ajụjụ nke ọma wee chọpụta
  rationale: Nke a na-egosi na Herọd ji ozi oge ọ nwetara site n’ịjụ ndị Magi nke ọma kpebie oke afọ ahụ.
theological_decisions:
- issue: Nsụgharị μάγοι
  choice: ndị Magi
  alternative: ndị amamihe
  rationale: ‘Ndị Magi’ na-edobe njirimara akụkọ ihe mere eme na omenala ha n’enweghị itinye ọdịnala ndị mechara pụta; e debere okwu a maara nke ọma n’ala peeji.
- issue: Nsụgharị ἐνεπαίχθη
  choice: aghọgbuola ya
  alternative: kwara ya emo
  rationale: N’ọnọdụ a, Herọd chere na ndị Magi aghọgbuola ya n’ihi na ha alaghachighị. Ma ebe okwu Grik ahụ nwekwara ike ịpụta ‘ịkwa emo,’ e debere nke ahụ n’ala peeji iji ghara ikpochapụ nghọta ọzọ dị n’okwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, mee ihe. Ahịrịokwu abụọ na-enyere ọgụgụ aka n’enweghị ịgbanwe usoro ihe omume ahụ. E tinyere akara ala peeji n’ebe okwu ha na-akọwa dị, ya bụ [a] n’akụkụ ‘aghọgbuola ya’ na [b] n’akụkụ ‘ndị Magi.’
