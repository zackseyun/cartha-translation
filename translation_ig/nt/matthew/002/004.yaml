    text: Ma ọ bụ, “Kraịst ahụ.” N'ebe a, okwu Grik bụ Χριστός, nke pụtara “onye e tere mmanụ.”
    reason: alternative_reading
  revision_rationale: The revision replaces the inaccurate and unnatural ‘nke ndị ahụ’ with ‘nke ndị mmadụ’ for ‘of the people,’ and uses a natural temporal clause plus progressive past construction to reflect the antecedent aorist participle and the imperfect inquiry. The Messiah title and its alternative footnote are preserved.
