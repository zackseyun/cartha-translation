id: MAT.2.4
reference: Matthew 2:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: ig
  text: Mgbe ọ kpọkọtachara ndị isi nchụàjà niile na ndị odeakwụkwọ nke ndị mmadụ, ọ nọ na-ajụ ha ebe a ga-amụ Mesaịa ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst ahụ.” N'ebe a, okwu Grik bụ Χριστός, nke pụtara “onye e tere mmanụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγὼν
  choice: Ọ kpọkọtara
  rationale: Aorist participle denotes action accompanying and naturally preceding the inquiry; Igbo serial narration conveys the sequence clearly without cumbersome subordination.
- source_word: πάντας
  choice: niile
  rationale: Preserves the comprehensiveness of the Greek adjective.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Refers to the senior priestly leadership, not to several sole high priests.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: A direct, established rendering of the Jewish scribes, avoiding the added interpretation of calling them teachers or legal experts.
- source_word: τοῦ λαοῦ
  choice: nke ndị ahụ
  rationale: Preserves the genitive reference to the people already in view without inserting an ethnic label absent from the Greek wording.
- source_word: ἐπυνθάνετο παρ’ αὐτῶν
  choice: na-ajụ ha
  rationale: The progressive construction reflects the imperfective inquiry, while ordinary Igbo absorbs the prepositional relation into the verb and object.
- source_word: ποῦ
  choice: ebe
  rationale: Directly expresses the interrogative location.
- source_word: ὁ χριστὸς
  choice: Mesaịa ahụ
  rationale: Renders Χριστός as the expected Jewish anointed ruler in this context rather than treating it as a personal name.
- source_word: γεννᾶται
  choice: a ga-amụ
  rationale: The passive construction and future-oriented expectation in the indirect question are naturally expressed this way in Igbo.
theological_decisions:
- issue: Rendering Χριστός as a title
  choice: Mesaịa ahụ
  alternative: Kraịst ahụ
  rationale: Herod is asking about the expected anointed ruler of Jewish prophecy, so the title ‘Messiah’ best preserves the contextual force; the alternative is retained in a footnote.
translation_notes:
  register: Standard Igbo in a natural, dignified narrative register. The wording remains compact and source-grounded; the progressive ‘na-ajụ’ preserves the imperfect aspect, and the footnote retains the familiar alternative title.
