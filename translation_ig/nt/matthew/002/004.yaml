- from: Ọ kpọkọtara ndị isi nchụàjà niile na ndị odeakwụkwọ nke ndị ahụ, na-ajụ ha ebe a ga-amụ Mesaịa ahụ[a].
  to: Mgbe ọ kpọkọtachara ndị isi nchụàjà niile na ndị odeakwụkwọ nke ndị mmadụ, ọ nọ na-ajụ ha ebe a ga-amụ Mesaịa ahụ[a].
  rationale: The revision replaces the inaccurate and unnatural ‘nke ndị ahụ’ with ‘nke ndị mmadụ’ for ‘of the people,’ and uses a natural temporal clause plus progressive past construction to reflect the antecedent aorist participle and the imperfect inquiry. The Messiah title and its alternative footnote are preserved.
