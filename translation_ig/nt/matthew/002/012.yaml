  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: ig
  text: Mgbe a dọrọ ha aka ná ntị ná nrọ ka ha ghara ịlaghachikwuru Herọd[a], ha si n’ụzọ ọzọ[b] gawara n’ala ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụzọ passive e ji kwuo ya n’asụsụ Grik na-egosi na ịdọ aka ná ntị ahụ sitere n’aka Chineke, ọ bụ ezie na amaokwu a akpọghị Chineke aha kpọmkwem.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’ụzọ ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: a dọrọ ha aka ná ntị
  rationale: Okwu Grik a, dị ka participle n'ụdị passive, pụtara na ha natara ịdọ aka ná ntị ma ọ bụ ntụziaka; nsụgharị a bụ Igbo nkịtị ma na-ahapụ onye nyere ịdọ aka ná ntị ahụ n'ekwughị aha, dịka isiokwu Grik mere.
- source_word: κατ’ ὄναρ
  choice: ná nrọ
  rationale: Nke a bụ ụzọ Igbo doro anya na nke ebumpụta ụwa isi kwuo na ozi ahụ bịara mgbe ha nọ ná nrọ.
- source_word: μὴ ἀνακάμψαι
  choice: ka ha ghara ịlaghachikwuru
  rationale: μή na infinitive na-enye ọdịnaya nke ịdọ aka ná ntị ahụ; ịlaghachikwuru dabara n'ọnọdụ njem ma gosi ịlaghachi n'ebe onye ahụ nọ.
- source_word: πρὸς Ἡρῴδην
  choice: Herọd
  rationale: E jikọtara ya na ngwaa ịlaghachikwuru iji gosipụta mmegharị ịgakwuru Herọd n'Igbo dị ire.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: si n’ụzọ ọzọ
  rationale: ὁδός n'akụkọ njem a na-ezo aka n'ụzọ ha gara; okwu a doro ndị na-agụ Igbo anya ma na-ezere ime ka ọ bụrụ naanị ihe atụ ime mmụọ.
- source_word: ἀνεχώρησαν
  choice: laghachi
  rationale: N'ọnọdụ a, ngwaa ahụ na-egosi na ha pụrụ ma gawa ebe ha si; laghachi na-ejikọta nke a n'ụzọ ebumpụta ụwa na ebe njedebe ahụ, obodo ha.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: n’obodo ha
  rationale: χώρα nwere ike ịbụ ala, obodo, ma ọ bụ ógbè. N'ebe a, obodo ha na-enye nghọta ebumpụta ụwa nke ala ha si bịa n'Igbo.
theological_decisions:
- issue: Onye nyere ịdọ aka ná ntị ahụ bụ Chineke n'ụzọ e zoro ezo
  choice: 'E ji passive kwuo ya: “a dọrọ ha aka ná ntị,” na-agbakwụghị “Chineke” n''ahịrịokwu bụ isi.'
  alternative: “Chineke dọrọ ha aka ná ntị” ma ọ bụ “e nyere ha ịdọ aka ná ntị sitere n'aka Chineke.”
  rationale: Ụdị passive nke χρηματισθέντες na ọnọdụ Matiu na-egosi nke ukwuu na ịdọ aka ná ntị ahụ sitere n'aka Chineke, ma amaokwu a akpọghị Chineke aha kpọmkwem. Ya mere, nsụgharị ahụ chekwara ma ihe e kwuru ma ihe a na-atụ aka na ya.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee nsọpụrụ. E ji “a dọrọ ha aka ná ntị” chekwaa passive na isi iyi nke ozi ahụ nke a na-ekwughị kpọmkwem; e ji “obodo ha” mee χώρα ka ọ bụrụ okwu ndị Igbo na-aghọta ngwa ngwa n'ọnọdụ ịlaghachi n'ala ha.
