    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’ụzọ ọzọ.”
    reason: lexical_alternative
  revision_rationale: The revision distinguishes ἀνακάμψαι (‘return to Herod’) from ἀνεχώρησαν (‘departed/went away’), retains the implied but unexpressed divine source of the warning, and renders χώρα with the broader ‘ala ha.’ Footnote a is recast as an explanatory note so that it does not add God explicitly as a competing translation.
