    issue: The appositive phrase identifying Mary lacks punctuation.
    rationale: In “na Meri nne ya,” adding a comma—“na Meri, nne ya”—clearly marks “nne ya” as apposition and follows natural modern written Igbo practice. This does not alter the meaning.
