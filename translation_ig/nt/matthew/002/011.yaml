id: MAT.2.11
reference: Matthew 2:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: ig
  text: 'Mgbe ha banyere n’ụlọ ahụ, ha hụrụ nwata ahụ na Meri, nne ya. Ha dara n’ala, kpọọrọ ya isiala[a]. Ha meghere akụ ha, nye ya onyinye: ọlaedo, frankinsens na mea.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “fee ya ofufe.” Okwu Grik ahụ nwere ike ịpụta ife ofufe ma ọ bụ igosi nsọpụrụ miri emi, dabere n’ọnọdụ e ji ya mee ihe.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίαν
  choice: ụlọ ahụ
  rationale: “Ụlọ” na-egosi ebe obibi a kpọrọ aha n’asụsụ Grik n’enweghị ịgbakwụnye nkọwa ọzọ.
- source_word: παιδίον
  choice: nwata ahụ
  rationale: “Nwata” na-edobe izugbe okwu Grik; ọ naghị akọwa afọ nwata ahụ karịa ka isi mmalite si mee.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: na Meri nne ya
  rationale: Nke a na-egosi na nwata ahụ na Meri nọkọrọ, ma kọwaa Meri dị ka nne ya n’ụzọ Igbo dị mfe.
- source_word: πεσόντες
  choice: Ha dara n’ala
  rationale: Nke a na-edobe omume ahụ a na-ahụ anya, bụ́ ịda n’ala, tupu ha akpọọ ya isiala.
- source_word: προσεκύνησαν
  choice: kpọọrọ ya isiala
  rationale: Nkebi okwu a na-egosi nsọpụrụ miri emi na mmegharị ahụ nke ịkpọ isiala, ma ọ naghị amanye naanị otu nghọta banyere ma ọ bụ ofufe Chineke ka ọ bụ nsọpụrụ eze.
- source_word: θησαυροὺς
  choice: akụ ha
  rationale: “Akụ ha” na-edobe okwu ahụ n’izugbe, kama ịkọwa ya kpọmkwem dị ka igbe akụ, nke okwu Grik ekwughị hoo haa.
- source_word: προσήνεγκαν αὐτῷ δῶρα
  choice: nye ya onyinye
  rationale: Nke a bụ ụzọ Igbo dị ndụ isi kwuo na ha nyere ya ihe ndị ahụ dị ka onyinye, n’enweghị ibu nkọwa okpukpe ọzọ bata.
- source_word: χρυσὸν
  choice: ọlaedo
  rationale: Ọ bụ okwu Igbo doro anya maka gold.
- source_word: λίβανον
  choice: frankinsens
  rationale: Aha a na-ezo aka kpọmkwem n’ụdị resin na-esi ísì ụtọ ahụ, ọ bụghị insens n’izugbe.
- source_word: σμύρναν
  choice: mea
  rationale: “Mea” bụ aha a na-eji n’Igbo maka myrrh, resin na-esi ísì ụtọ ahụ.
theological_decisions:
- issue: Otú e si sụgharịa προσκυνέω n’ihe gbasara nwata ahụ bụ Jizọs
  choice: kpọọrọ ya isiala
  alternative: fee ya ofufe
  rationale: Okwu Grik ahụ nwere ike igosi ma ofufe ma nsọpụrụ miri emi a na-enye onye eze. Isi ederede na-edobe oghere nghọta abụọ ahụ site n’iji “kpọọrọ ya isiala,” ebe ihe e dere n’okpuru peeji na-egosi “fee ya ofufe” dị ka nsụgharị ọzọ kwesịrị ekwesị.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E kewara ahịrịokwu ogologo Grik ahụ ka ọ bụrụ ahịrịokwu atọ iji mee ka ọgụgụ ya doo anya, ma edobere usoro omume na nghọta abụọ dị na προσκυνέω.
