revisions:
- from: Ha wee sị ya, “Na Betlehem nke Judia, n’ihi na otu a ka e si dee ya site n’ọnụ onye amụma:”
  to: Ha wee sị ya, “Na Betlehem nke Judia, n’ihi na e dere ya otu a site n’aka onye amụma:”
  rationale: The revision retains the referent, place designation, causal connection, forward-pointing “thus,” passive written-scripture formula, and the colon introducing the ensuing prophetic quotation. It replaces the over-specific ‘from the mouth of the prophet’ with a neutral mediating expression corresponding to διά + genitive.
  reviewer_model: gpt-5.6-terra
