id: MAT.2.5
reference: Matthew 2:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: ig
  text: Ha wee sị ya, “Na Betlehem nke Judia, n’ihi na e dere ya otu a site n’aka onye amụma:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ha wee
  rationale: ‘Ha’ na-ezo aka n’isi ndị nchụàjà na ndị odeakwụkwọ n’amaokwu gara aga; ‘wee’ na-enye njikọ dị nro nke δέ n’Igbo nkịtị.
- source_word: εἶπαν αὐτῷ
  choice: sị ya
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa nkenke isi kwuo ‘said to him,’ n’enweghị ịgbakwụnye nkọwa.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: Na Betlehem nke Judia
  rationale: ‘Na’ na-egosi ebe, ebe ‘nke Judia’ na-akọwapụta Betlehem a na-ekwu maka ya ma na-edobe usoro genitive nke Grik.
- source_word: οὕτως γὰρ
  choice: n’ihi na otu a ka
  rationale: ‘N’ihi na’ na-egosi ihe kpatara azịza ahụ; ‘otu a’ na-atụ aka n’ihu n’ihe odide onye amụma nke na-esote.
- source_word: γέγραπται
  choice: e si dee ya
  rationale: Nkebi a na-egosipụta passive citation formula n’Igbo dị ndụ ma na-eburu echiche nke ihe e dere nke ka dị irè.
- source_word: διὰ τοῦ προφήτου
  choice: site n’ọnụ onye amụma
  rationale: Akpaalaokwu Igbo a na-egosi na onye amụma bụ onye e si n’aka ya zie okwu ahụ, ma ghara ime ka o doo anya karịa ihe διά + genitive kwuru.
theological_decisions:
- issue: Usoro okwu gbasara izisa amụma
  choice: site n’ọnụ onye amụma
  alternative: onye amụma dere ya
  rationale: Nhọrọ a na-edobe echiche nke onye amụma dịka onye okwu ahụ si n’aka ya bịa, kama ime ka ọ bụrụ naanị onye dere ya; ọ naghị ekpebi n’ụzọ gabigara ihe Grik kwuru onye bụ isi mmalite ikpeazụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị nsọ ma dị mfe nghọta. E ji ‘Judia’ mee aha mpaghara ahụ, ‘Betlehem’ bụrụkwa ntụgharị mkpụrụokwu nke aha obodo. Akara rikoma na-edobe azịza ahụ na ihe kpatara ya n’otu okwu na-aga n’ihu, ebe kolọn na-akwadebe amaokwu amụma na-esote.
