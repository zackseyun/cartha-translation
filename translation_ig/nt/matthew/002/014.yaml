id: MAT.2.14
reference: Matthew 2:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: ig
  text: Mgbe ahụ, o biliri, kpọrọ nwata ahụ na nne ya n'abalị, wee pụọ gaa Ijipt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “wee gawa Ijipt.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ya mere
  rationale: Ọ bụ njikọ dị nro na-akwalite akụkọ ahụ ma na-egosi na Josef mere ihe e nyere ya n'iwu n'amaokwu bu ụzọ.
- source_word: ἐγερθεὶς
  choice: o biliri
  rationale: Nke a na-egosi na Josef biliri ime ihe ahụ ozugbo; ọ bụkwa okwu Igbo doro anya ma bụrụ nke e ji eme ihe kwa ụbọchị.
- source_word: παρέλαβε
  choice: kpọrọ
  rationale: N'ọnọdụ a, okwu ahụ pụtara ịkpọrọ mmadụ soro onwe onye gaa, ọ bụghị nanị ịnabata ya.
- source_word: τὸ παιδίον
  choice: nwata ahụ
  rationale: Nke a na-enye kpọmkwem echiche nke παιδίον n'ebughị nkọwa ọzọ nke adịghị n'ihe odide Grik.
- source_word: τὴν μητέρα αὐτοῦ
  choice: nne ya
  rationale: ‘Ya’ na-ezo aka n'ebe nwata ahụ nọ, dịka usoro okwu Grik si dị.
- source_word: νυκτὸς
  choice: n'abalị
  rationale: Genitiv oge a na-egosi na omume ahụ mere n'oge abalị.
- source_word: ἀνεχώρησεν
  choice: wee gawa
  rationale: Ọ na-egosi ịhapụ ebe mmadụ nọ ma malite njem gaa ebe ọzọ; ‘gawa’ na-egosikwa ije a na-aga n'otu ebe a kpọrọ aha.
- source_word: εἰς Αἴγυπτον
  choice: Ijipt
  rationale: εἰς na-egosi ebe njem ahụ chere ihu; n'Igbo, ngwaa ‘gawa’ na aha ebe ahụ na-egosipụta nke a n'ụzọ ebumpụta ụwa.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ usoro okwu na-aga were were n'akụkọ, ma e chekwara njikọ omume ndị dị n'asụsụ Grik.
