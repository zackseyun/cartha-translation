revisions:
- from: Ma mgbe Herọd nwụsịrị, lee, otu mmụọ ozi nke Onyenwe anyị[a] pụtara n’ime nrọ nye Josef n’Ijipt.
  to: Ma mgbe Herọd nwụsịrị, lee, mmụọ ozi nke Onyenwe anyị pụtara na nrọ nye Josef n’Ijipt.
  rationale: The revision removes possible numerical force from “otu,” uses the more idiomatic “na nrọ,” and makes the alternative-reading footnote fully Igbo while accurately describing the Greek anarthrous noun. It retains the natural Igbo narrative past tense and all source meaning.
  reviewer_model: gpt-5.6-terra
