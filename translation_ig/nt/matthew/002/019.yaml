id: MAT.2.19
reference: Matthew 2:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: ig
  text: Ma mgbe Herọd nwụsịrị, lee, mmụọ ozi nke Onyenwe anyị pụtara na nrọ nye Josef n’Ijipt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τελευτήσαντος
  choice: mgbe Herọd nwụsịrị
  rationale: Aorist participle dị na genitive absolute na-egosi oge; “mgbe Herọd nwụsịrị” na-ekwupụta na ọnwụ ya buru ihe sochirinụ ụzọ n’Igbo dị ire.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntugharị akụkọ nwere obere ọdịiche n’ihe gara aga; “Ma” dabara n’akụkọ Igbo.
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” na-echekwa oku onye na-agụ ka o tinye uche na ihe mberede na-esote.
- source_word: ἄγγελος κυρίου
  choice: otu mmụọ ozi nke Onyenwe anyị
  rationale: E nweghị article n’ihu ἄγγελος; “otu mmụọ ozi” na-egosi na ọ bụghị kpọmkwem mmụọ ozi a marala, ebe “nke Onyenwe anyị” na-egosipụta genitive κυρίου.
- source_word: φαίνεται
  choice: pụtara
  rationale: Ọ bụ historical present n’akụkọ Grik. Oge gara aga “pụtara” bụ ụzọ Igbo dị mma isi kọọ ihe mere, n’enweghị ime ka ahịrịokwu ahụ daa ka ihe na-eme ugboro ugboro.
- source_word: κατ’ ὄναρ
  choice: n’ime nrọ
  rationale: Nke a bụ akpaalaokwu na-egosi na ngosipụta ahụ mere site ná nrọ; “n’ime nrọ” bụ Igbo doro anya ma dị ire.
- source_word: τῷ Ἰωσὴφ
  choice: nye Josef
  rationale: Dative a na-egosi onye mmụọ ozi ahụ pụtara nye; “Josef” bụ odide aha a na-ejikarị eme ihe n’Igbo.
- source_word: ἐν Αἰγύπτῳ
  choice: n’Ijipt
  rationale: Ọ bụ nkebiokwu ebe, na-egosi ebe Josef nọ mgbe ngosipụta ahụ mere.
theological_decisions:
- issue: Ntụgharị κυρίου n’ime ἄγγελος κυρίου
  choice: Onyenwe anyị
  alternative: Onyenwe
  rationale: “Onyenwe anyị” bụ aha nsọpụrụ a maara nke ọma n’Igbo maka κύριος n’ọnọdụ a, ma ọ naghị etinye aha Chineke nke na-adịghị n’ihe odide Grik.
- issue: Article n’ihu ἄγγελος
  choice: otu mmụọ ozi nke Onyenwe anyị
  alternative: mmụọ ozi ahụ nke Onyenwe anyị
  rationale: Ebe Grik na-enweghị article n’ihu ἄγγελος, isi ihe odide na-eji ụdị na-akọwaghị otu onye kpọmkwem. Ihe ọzọ a pụrụ ịgụ ka edobere na nkọwa ala peeji n’ihi njikọ okwu ọdịnala na nke nkà mmụta okpukpe o nwere.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “lee” chekwaa ike okwu ἰδοὺ; e jikwa oge gara aga “pụtara” mee ka akụkọ ahụ daa nke ọma n’Igbo, ọ bụ ezie na Grik ji historical present.
