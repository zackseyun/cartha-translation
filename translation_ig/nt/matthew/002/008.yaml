- from: Mgbe o zipụrụ ha gaa Betlehem, ọ sịrị ha, “Gaanụ chọọ nwata ahụ nke ọma. Mgbe unu chọtara ya, kọọrọ m, ka mụ onwe m kwa wee bịa fee ya ofufe[a].”
  to: O zigasịrị ha na Betlehem, sị ha, “Gaanụ chọọ nwata ahụ nke ọma. Mgbe unu chọtara ya, kọọrọ m, ka mụ kwa wee bịa fee ya ofufe[a].”
  rationale: The revision preserves the draft’s meaning and its lexically defensible rendering of προσκυνέω, while improving the sequence of the opening participle, avoiding added emphasis in κἀγώ, and making the homage alternative idiomatic in Standard Igbo.
