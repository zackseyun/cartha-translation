id: MAT.2.8
reference: Matthew 2:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: ig
  text: O zigasịrị ha na Betlehem, sị ha, “Gaanụ chọọ nwata ahụ nke ọma. Mgbe unu chọtara ya, kọọrọ m, ka mụ kwa wee bịa fee ya ofufe[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “kpọọ isiala n’ihu ya” ma ọ bụ “sọpụrụ ya dịka eze.” Ngwaa Grik ahụ nwere ike ịpụta ife ofufe, ma ọ bụ omume ịkpọ isiala iji sọpụrụ onye eze.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: Mgbe o zipụrụ ha
  rationale: Aorist participle ahụ na-egosi ihe mere tupu ngwaa bụ isi εἶπεν; ‘Mgbe o zipụrụ ha’ na-egosipụta usoro ahụ n’Igbo dị mfe ma bụrụkwa nke sitere n’okike.
- source_word: Πορευθέντες
  choice: Gaanụ
  rationale: N’ebe a participle ahụ na-arụ ọrụ dịka iwu ya na ἐξετάσατε; ‘Gaanụ’ bụ ụzọ Igbo doro anya isi malite iwu ahụ.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: chọọ ... nke ọma
  rationale: Ngwakọta ngwaa na adverb a pụtara ịchọ ma ọ bụ ime nchọpụta nke ọma na nlezianya; okwu a dabara n’ịchọta ebe nwata ahụ nọ.
- source_word: περὶ τοῦ παιδίου
  choice: nwata ahụ
  rationale: Mgbe περί so ngwaa nke ịchọ ma ọ bụ ịjụ ase, Igbo na-etinye onye a na-achọ dịka ihe ngwaa ahụ metụtara ozugbo.
- source_word: παιδίου
  choice: nwata
  rationale: παιδίον pụtara nwata; nsụgharị a bụ nke nkịtị ma ọ naghị etinye afọ nwata ahụ nke ederede ekwughị kpọmkwem.
- source_word: ἐπὰν δὲ εὕρητε
  choice: Mgbe unu chọtara ya
  rationale: Nkebiokwu ahụ na-egosi ihe a na-atụ anya na ọ ga-eme n’okpuru ọnọdụ; ‘Mgbe’ na-enye ntụziaka Herọd n’Igbo n’enweghị ikwu na ịchọta ya bụ ihe doro anya.
- source_word: ἀπαγγείλατέ μοι
  choice: kọọrọ m
  rationale: ἀπαγγέλλω nwere echiche nke iweta akụkọ azụ; ‘kọọrọ m’ na-egosipụta ịlaghachikwuru ya nye ya ozi ahụ.
- source_word: ὅπως
  choice: ka ... wee
  rationale: Ụdị ‘ka ... wee’ na-egosipụta ebumnuche nke ὅπως n’Igbo dị n’okike.
- source_word: κἀγὼ
  choice: mụ onwe m kwa
  rationale: Nke a na-echekwa nkwusi ike Herọd na-etinye onwe ya n’otu ebumnuche ahụ ndị ọbịa ahụ nwere.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: wee bịa fee ya ofufe
  rationale: A sụgharịrị participle na subjunctive dịka omume abụọ jikọrọ ọnụ n’Igbo. ‘Fee ya ofufe’ na-echekwa nghọta siri ike nke προσκυνέω, ebe a na-edebe nghọta ndị ọzọ n’ala ala peeji.
theological_decisions:
- issue: Ihe προσκυνήσω αὐτῷ pụtara mgbe Jizọs bụ nwata bụ onye omume ahụ metụtara
  choice: fee ya ofufe
  alternative: kpọọ isiala nye ya; sọpụrụ ya dịka eze
  rationale: προσκυνέω nwere ike ịpụta ife ofufe ma ọ bụ ịkpọ isiala iji sọpụrụ onye ọchịchị. N’Akụkọ Matiu, iji ya mee ihe banyere Jizọs nwere ike ibu nghọta nke ofufe, ma okwu Herọd n’onwe ya bụ aghụghọ. A họọrọ ‘fee ya ofufe’ n’ahịrịokwu, ma e debere obosara ihe okwu Grik ahụ nwere ike ịpụta n’ala ala peeji ka a ghara ikpochapụ nghọta ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. E debere ụdị iwu n’ọnụ Herọd n’ụzọ ndị mmadụ na-aghọta ngwa ngwa, ma e zere okwu ụka pụrụ iche nke otu nzukọ.
