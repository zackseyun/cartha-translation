revisions:
- from: Mgbe ha lawara, lee, otu mmụọ ozi nke Onyenwe anyị[a] pụtara Josef ná nrọ, sị, “Bilie, kuru nwatakịrị ahụ na nne ya gbaga Ijipt, nọrọkwa n’ebe ahụ ruo mgbe m ga-agwa gị. N’ihi na Herọd na-aga ịchọ[b] nwatakịrị ahụ iji gbuo ya[c].”
  to: Mgbe ha lawara, lee, mmụọ ozi nke Onyenwe anyị[a] pụtara Josef na nrọ, sị, “Bilie, kpọrọ nwatakịrị ahụ na nne ya gbaga Ijipt, nọrọkwa n’ebe ahụ ruo mgbe m ga-agwa gị. N’ihi na Herọd na-aga ịchọ[b] nwatakịrị ahụ iji gbuo ya[c].”
  rationale: The revision removes the unnecessary numerical force of “otu” while retaining an indefinite sense, and uses a more natural Igbo command construction for taking the child and his mother along in flight. No interpretive or doctrinal change has been introduced; all footnote anchors and their corresponding notes are retained.
