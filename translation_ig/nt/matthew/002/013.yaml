id: MAT.2.13
reference: Matthew 2:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: ig
  text: Mgbe ha lawara, lee, mmụọ ozi nke Onyenwe anyị[a] pụtara Josef na nrọ, sị, “Bilie, kpọrọ nwatakịrị ahụ na nne ya gbaga Ijipt, nọrọkwa n’ebe ahụ ruo mgbe m ga-agwa gị. N’ihi na Herọd na-aga ịchọ[b] nwatakịrị ahụ iji gbuo ya[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mmụọ ozi ahụ nke Onyenwe anyị.” Grik enweghị article n’ihu “mmụọ ozi,” ma ụfọdụ ndị nwere ike ịghọta ya dịka okwu Akwụkwọ Nsọ a maara nke ọma.
    reason: alternative_reading
  - marker: b
    text: Grik pụtara na Herọd na-achọ ime nke a n’oge dị nnọọ nso.
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “ime ka ọ laa n’iyi”; n’ebe a ọ pụtara ime ka ọ nwụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: Mgbe ha lawara
  rationale: Nke a na-egosi na ọpụpụ ha mere tupu ihe sochirinụ; ọ bụkwa okwu Igbo doro anya ma dị mfe.
- source_word: ἰδοὺ
  choice: lee
  rationale: E debere akara akụkọ a iji gosipụta na ihe dị mkpa na mberede na-abata n’akụkọ ahụ.
- source_word: ἄγγελος κυρίου
  choice: otu mmụọ ozi nke Onyenwe anyị
  rationale: Enweghị mkpụrụokwu na-eme ka ‘mmụọ ozi’ bụrụ onye a kapịrị ọnụ na Grik; ‘otu mmụọ ozi’ na-egosipụta nke ahụ, ebe ‘Onyenwe anyị’ na-enye κύριος dịka aha nsọ a na-ejikarị eme ihe n’Igbo.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: pụtara Josef ná nrọ
  rationale: Ọ bụ ụzọ Igbo ebumpụta ụwa si ekwu na mmụọ ozi ahụ mere ka Josef hụ ya n’ime nrọ.
- source_word: Ἐγερθεὶς παράλαβε
  choice: Bilie, kuru
  rationale: Ọ bụ ezie na okwu mbụ bụ participle n’ụdị Grik, n’usoro iwu a ọ na-arụ ọrụ dịka iwu; ‘kuru’ na-egosi ịkpọrọ ha soro onwe ya.
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: nwatakịrị ahụ na nne ya
  rationale: 'Nke a na-edobe ntụaka doro anya nke Grik: nne ahụ bụ nne nwatakịrị ahụ.'
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: gbaga Ijipt
  rationale: ‘Gbaga’ na-egosipụta ọsọ na izere ihe ize ndụ dị n’okwu φεύγω.
- source_word: ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι
  choice: nọrọkwa n’ebe ahụ ruo mgbe m ga-agwa gị
  rationale: Nke a na-enye echiche nke ịnọgide n’ebe ahụ ruo n’oge a na-akọwaghị kpọmkwem.
- source_word: μέλλει γὰρ Ἡρῴδης ζητεῖν
  choice: N’ihi na Herọd na-aga ịchọ
  rationale: ‘Na-aga ịchọ’ na-egosipụta ebumnobi dị nso nke μέλλει ma na-edobekwa omume ‘ịchọ’ nke ζητεῖν.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: iji gbuo ya
  rationale: ἀπόλλυμι pụtara ime ka ọ laa n’iyi; n’ọnọdụ a ebumnobi Herọd bụ ime ka nwatakịrị ahụ nwụọ, ya mere ‘igbu ya’ bụ okwu Igbo doro anya.
theological_decisions:
- issue: Nsụgharị κύριος n’okwu ἄγγελος κυρίου
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: ‘Onyenwe anyị’ bụ aha nsọ a na-aghọta nke ọma n’Igbo ma kwekọọ n’ọrụ κύριος n’okwu a, n’enweghị ịmanye nkọwa pụrụ iche banyere onye mmụọ ozi ahụ bụ.
- issue: Ma ἄγγελος ọ̀ bụ mmụọ ozi a kapịrị ọnụ
  choice: otu mmụọ ozi
  alternative: mmụọ ozi ahụ
  rationale: Grik enweghị article n’ihu ἄγγελος, ya mere nsụgharị isi na-ahapụ ya dịka onye a na-akọwapụtaghị; ihe ọzọ ga-ekwe omume n’ihi ojiji amaara ama nke okwu ahụ n’Akwụkwọ Nsọ.
- issue: Ike okwu ἀπολέσαι n’ọnọdụ a
  choice: igbu ya
  alternative: ime ka ọ laa n’iyi
  rationale: N’ebe a ‘imebi’ pụtara ịkpata ọnwụ nwatakịrị ahụ. Nsụgharị isi na-eme ihe ọnọdụ ahụ pụtara ka o doo anya, ebe ndetu na-echekwa obosara okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ “lee” iji chekwaa ike akara akụkọ Matiu, ma jiri okwu iwu dị ndụ—“Bilie,” “kuru,” na “gbaga”—gosipụta ngwa ngwa nke ihe ize ndụ ahụ.
