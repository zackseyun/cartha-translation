id: MAT.2.22
reference: Matthew 2:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: ig
  text: Ma mgbe ọ nụrụ na Akelaọs na-achị Judia n’ọnọdụ nna ya Herọd, ụjọ tụrụ ya ịga ebe ahụ. Ma mgbe a dọrọ ya aka ná ntị ná nrọ[a], ọ lawapụrụ gaa n’akụkụ Galili,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe e nyere ya ntụziaka”; ngwaa Grik a na-egosikarị ịdọ aka ná ntị ma ọ bụ ntụziaka sitere n’aka Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: mgbe ọ nụrụ
  rationale: Na-egosipụta ihe mere tupu ụjọ atụ ya, ma bụrụkwa ụzọ Igbo dị mfe na nke ebumpụta ụwa isi kwuo aorist participle.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi mgbanwe ma ọ bụ ihe mgbochi bilitere n’akụkọ ahụ.
- source_word: βασιλεύει
  choice: na-achị
  rationale: Na-egosipụta ọchịchị Akelaọs na-aga n’ihu; n’Igbo, ‘na-achị’ bụ okwu ebumpụta ụwa karịa ịsị na ọ bụ eze, ma ọ ka na-edobe echiche ọchịchị dị na ngwaa Grik.
- source_word: τῆς Ἰουδαίας
  choice: Judia
  rationale: ‘Na-achị Judia’ bụ usoro okwu Igbo doro anya maka ịchị otu ala.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: n’ọnọdụ nna ya Herọd
  rationale: Na-edobe echiche nke ịnọchi onye ọzọ n’ọchịchị, n’agbanyeghị na ederede ahụ ekwughị kpọmkwem usoro e si nye ya ọchịchị.
- source_word: ἐφοβήθη
  choice: ụjọ tụrụ ya
  rationale: Nke a bụ ụzọ Igbo a na-asụkarị ma doo anya isi kwuo na mmadụ tụrụ egwu.
- source_word: ἐκεῖ ἀπελθεῖν
  choice: ịga ebe ahụ
  rationale: Na-enye ebumnuche ebe ọ chọrọ ịga n’ụzọ dị mfe ma kwekọọ n’Igbo.
- source_word: χρηματισθεὶς
  choice: mgbe a dọrọ ya aka ná ntị
  rationale: Na-edobe passive na echiche nke ịnata ịdọ aka ná ntị, n’etinyeghị onye mere ya n’ihi na Grik ekwughị onye ahụ kpọmkwem.
- source_word: κατ’ ὄναρ
  choice: ná nrọ
  rationale: Ọ bụ usoro okwu Igbo ebumpụta ụwa maka ozi e nyere mmadụ mgbe ọ na-arọ nrọ.
- source_word: ἀνεχώρησεν
  choice: ọ laghachiri
  rationale: Na-egosi na ọ gbanwere ụzọ wee pụọ gaa ebe ọzọ n’ihi ihe ize ndụ; ọ dị mfe nghọta n’Igbo ebe a.
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: n’ógbè Galili
  rationale: ‘Ógbè’ na-egosipụta akụkụ ala ma ọ bụ mpaghara Galili n’ụzọ Igbo dị mma, ọbụna mgbe Grik ji ụdị ọtụtụ.
theological_decisions:
- issue: Ma a ga-akpọpụta Chineke dịka onye dọrọ Josef aka ná ntị na χρηματισθείς
  choice: E debere ya dịka ‘a dọrọ ya aka ná ntị’ n’ahịrịokwu bụ isi, n’akpọghị Chineke aha.
  alternative: mgbe Chineke dọrọ ya aka ná ntị; mgbe o natara ntụziaka sitere n’aka Chineke
  rationale: N’akwụkwọ Matiu, ngwaa ahụ na-egosikarị ozi ma ọ bụ ịdọ aka ná ntị sitere n’aka Chineke, ma onye mere omume ahụ apụtaghị n’amaokwu Grik a. Ya mere, nsụgharị ahụ na-edobe passive na nghọtahie nta ahụ, ebe nkọwa ala peeji na-akọwa ihe ngwaa ahụ na-egosikarị.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji aha ebe ‘Judia’ na ‘Galili,’ na aha mmadụ ‘Akelaọs’ na ‘Herọd.’ E debere njikọ ikpeazụ na akara rikoma n’ihi na amaokwu a na-aga n’ihu n’amaokwu na-esote.
