id: MAT.2.10
reference: Matthew 2:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδόντες δὲ τὸν ἀστέρα ἐχάρησαν χαρὰν μεγάλην σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/010.yaml
  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: ig
  text: Mgbe ha hụrụ kpakpando ahụ, ha ṅụrịrị ọṅụ dị nnọọ ukwuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, e kwuru ya n’ụzọ nkịtị dịka, “ha ṅụrịrị ọṅụ dị ukwuu nke ukwuu,” nke bụ okwu e ji mesie ịdị ukwuu nke ọṅụ ha ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Mgbe ha hụrụ
  rationale: Aorist participle ahụ na-arụ ọrụ nke oge; “Mgbe ha hụrụ” bụ Igbo ebumpụta ụwa nke na-egosi na ịhụ kpakpando ahụ butere ihe e kwuru n’isi ngwaa.
- source_word: δὲ
  choice: ejikọghị ya na mkpụrụokwu pụrụ iche
  rationale: δὲ bụ njikọ akụkọ dị nro n’ebe a. Usoro ahịrịokwu Igbo na-aga nke ọma n’enweghị “ma,” nke nwere ike ime ka o yie ka e nwere mmegide siri ike.
- source_word: τὸν ἀστέρα
  choice: kpakpando ahụ
  rationale: “Kpakpando” bụ ihe ἀστήρ pụtara, ebe “ahụ” na-egosi otu kpakpando ahụ e kwuburu banyere ya.
- source_word: ἐχάρησαν
  choice: ha ṅụrịrị ọṅụ
  rationale: Nhọrọ a na-edowe ike ngwaa χαίρω na asụsụ Igbo dị ugwu ma doo anya.
- source_word: χαρὰν μεγάλην
  choice: ọṅụ dị ukwuu
  rationale: Nke a na-anọchi cognate accusative nke na-eme ka echiche ọṅụ sie ike, ma na-ada ka Igbo a na-asụ ugbu a.
- source_word: σφόδρα
  choice: nnọọ
  rationale: “Nnọọ” na-eme ka “dị ukwuu” sie ike ma na-ebufe nkwusi ike pụrụ iche nke σφόδρα n’enweghị asụsụ gbagọrọ agbagọ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edowe nkwusi ike ugboro abụọ dị na Grik site na “ọṅụ dị nnọọ ukwuu,” ebe nkọwa ala peeji na-egosi usoro okwu Grik siri ike karị.
