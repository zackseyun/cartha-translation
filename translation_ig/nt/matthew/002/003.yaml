    issue: The disturbance vocabulary is somewhat narrowed to fear.
    rationale: “Obi lọrọ ya mmiri” and “nwee ụjọ” are intelligible, but they can mean being frightened. The Greek ἐταράχθη is broader; “nwee nchekasị” better preserves the stated disturbance/alarm without over-specifying its cause or intensity.
