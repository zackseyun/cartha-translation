id: MAT.2.3
reference: Matthew 2:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: ig
  text: Mgbe Eze Herọd nụrụ ihe a, o nwere nchekasị, Jeruselem dum sokwa ya nwee nchekasị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Jeruselem dum” ji aha obodo ahụ anọchi ndị bi na ya; o nwere ike ịbụ ụzọ izugbe ma ọ bụ ụzọ e mere ka okwu sie ike iji kọwaa nchekasị juru obodo ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Mgbe ... nụrụ ihe a
  rationale: Aorist participle ahụ na-arụ ọrụ oge; ‘Mgbe ... nụrụ’ bụ Igbo dị ndụ. ‘Ihe a’ na-ezo aka n’ozi ndị amamihe kwuru n’amaokwu ndị bu ya ụzọ.
- source_word: δὲ
  choice: Mgbe
  rationale: δέ bụ njikọ dị nro; n’ebe a, a na-egosipụta ọrụ ya nke ọma n’ahịrịokwu oge ahụ n’enweghị ịgbakwunye njikọ ọzọ.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: Eze Herọd
  rationale: Nke a bụ usoro aha na utu aha na-ada nke ọma n’Igbo ma na-edobe βασιλεύς na aha Herọd.
- source_word: ἐταράχθη
  choice: obi lọrọ ya mmiri
  rationale: Akpaalaokwu Igbo a na-egosi na ụjọ na ọgba aghara jidere ya n’ime, n’enweghị ịkọwa oke mmetụta ahụ karịa ihe Grik kwuru.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: Jeruselem dum
  rationale: A na-edobe aha obodo ahụ dịka ihe nnọchianya nke ndị bi na ya, kama ịgbakwunye ‘ndị mmadụ’ n’ahịrịokwu bụ isi.
- source_word: μετ’ αὐτοῦ
  choice: sokwa ya
  rationale: Nke a na-egosipụta na Jeruselem sonyeere Herọd n’ọgba aghara ahụ.
theological_decisions:
- issue: Oke ihe πᾶσα Ἱεροσόλυμα pụtara
  choice: Jeruselem dum dịka aha obodo ji anọchi ndị bi na ya
  alternative: Ọtụtụ ndị bi na Jeruselem, ma ọ bụ karịsịa ndị isi obodo ahụ
  rationale: Grik kpọrọ obodo ahụ dum aha, ma o nwere ike ịbụ okwu izugbe ma ọ bụ okwu e mere ka o sie ike. Nsụgharị ahụ anaghị ekpebi na ọ bụ naanị ndị isi ma ọ bụ mmadụ niile n’otu n’otu.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘obi lọrọ ya mmiri’ mee ka mmetụta ταράσσω daa nke ọma n’Igbo, ebe nkọwa ala peeji na-echekwa ụzọ ọzọ e nwere ike isi sụgharịa ya.
