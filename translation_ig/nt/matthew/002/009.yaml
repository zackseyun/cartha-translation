id: MAT.2.9
reference: Matthew 2:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: ig
  text: Mgbe ha nụsịrị eze ahụ, ha wee gawa. Lee, kpakpando ahụ ha hụrụ n’ọwụwa anyanwụ[a] na-aga n’ihu ha ruo mgbe ọ bịarutere, wee guzoro n’elu ebe nwata ahụ nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe kpakpando ahụ na-awa.” Okwu Greek a nwere ike izo aka n’ọwụwa anyanwụ dị ka mpaghara ma ọ bụ akụkụ ụwa, ma ọ bụ n’oge kpakpando ahụ na-awa.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: Mgbe ha nụchara okwu eze ahụ
  rationale: Nkebi a na-egosi na ha buru ụzọ gee eze ahụ ntị tupu ha agawa. “Okwu eze ahụ” na-eme ka Igbo dị ire n’etinyeghị aha Herọd, nke na-adịghị n’amaokwu a.
- source_word: ἐπορεύθησαν
  choice: ha wee gawa
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke akụkọ si egosi na ha hapụrụ ebe ahụ gaa n’ihu njem ha.
- source_word: ἰδοὺ
  choice: Lee
  rationale: “Lee” na-echekwa akara okwu nke na-akpọ onye na-agụ ya ka o lebara ihe mberede na-esochi anya.
- source_word: ἀστήρ
  choice: kpakpando
  rationale: Nke a bụ okwu Igbo nkịtị na nke ziri ezi maka ἀστήρ.
- source_word: ὃν εἶδον
  choice: ahụ ha hụrụ
  rationale: Nhazi a na-ejikọta kpakpando ahụ na nke ha hụburu, dị ka Greek si eme, n’enweghị nkọwa agbakwunyere.
- source_word: ἐν τῇ ἀνατολῇ
  choice: n’ọwụwa anyanwụ
  rationale: Nke a na-enye nghọta a maara nke ọma banyere mpaghara ma ọ bụ akụkụ ọwụwa anyanwụ, ebe e debere nghọta gbasara oge kpakpando ahụ wara na nkọwa ala peeji.
- source_word: προῆγεν αὐτούς
  choice: na-aga n’ihu ha
  rationale: Nke a na-echekwa oyiyi nke kpakpando ahụ na-aga n’ihu ha, n’ekwughị kpọmkwem otú o si edu ha.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: ruo mgbe ọ bịarutere, wee kwụsị
  rationale: 'Nke a na-egosi usoro omume abụọ dị na Greek: ọ bịarutere, mesịa kwụsị.'
- source_word: ἐπάνω οὗ ἦν τὸ παιδίον
  choice: n’elu ebe nwata ahụ nọ
  rationale: Nhọrọ a na-edebe ọnọdụ ahụ n’elu ebe nwata ahụ nọ, ma na-eji Igbo doro anya ma dị mfe.
theological_decisions:
- issue: Ihe ἐν τῇ ἀνατολῇ pụtara n’akụkọ kpakpando ahụ
  choice: n’ọwụwa anyanwụ
  alternative: mgbe ọ na-awa
  rationale: Okwu Greek ahụ nwere ike ịpụta mpaghara ma ọ bụ akụkụ ọwụwa anyanwụ, ma ọ bụ oge kpakpando ahụ na-awa. Amaokwu ahụ n’onwe ya adịghị amanye ka e kpebie naanị otu nghọta; ya mere, e tinyere nke a maara nke ọma n’ahịrịokwu, debe nke ọzọ na nkọwa ala peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe ma dị ùgwù. “Lee” na-echekwa ịdị ndụ nke akụkọ ahụ; “nwata ahụ” anaghị etinye afọ ma ọ bụ nkọwa ọzọ Greek na-ekwughị.
