id: MAT.2.18
reference: Matthew 2:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: ig
  text: '“A nụrụ olu na Rama—ịkwa ákwá na oké iru újú[a]: Rechel na-akwara ụmụ ya ákwá, ọ chọghịkwa ka a kasie ya obi[b], n’ihi na ha anọkwaghị[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “akwa arịrị na oké iru újú.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọ jụrụ ka a kasie ya obi.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “n’ihi na ha adịghị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Φωνὴ
  choice: olu
  rationale: “Olu” na-echekwa echiche nke olu mmadụ na ụda amụma a, ma kwekọọ n’ụzọ e si kọwaa Rechel dị ka onye na-akwa ákwá.
- source_word: ἐν Ῥαμὰ
  choice: na Rama
  rationale: “Na” bụ ụzọ Igbo nkịtị si egosi ebe ihe mere; “Rama” bụ ntụgharị aha obodo ahụ n’ụdị a na-ahụkarị.
- source_word: ἠκούσθη
  choice: A nụrụ
  rationale: Nke a na-echekwa ụdị ngwaa nnara nke Grik ma na-ada nke ọma n’Igbo.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: ịkwa ákwá na oké iru újú
  rationale: “Ịkwa ákwá” na-egosi akwa a na-anụ olu ya, ebe “oké iru újú” na-echekwa ike nke πολύς na ọdịiche dị n’etiti akwa na mwute miri emi.
- source_word: Ῥαχὴλ
  choice: Rechel
  rationale: E debere ya dị ka aha nwanyị ahụ n’ụdị Igbo a na-ahụkarị, n’enweghị ịkọwa ihe ọ na-anọchi anya ya n’ahịrịokwu ahụ.
- source_word: κλαίουσα τὰ τέκνα αὐτῆς
  choice: na-akwara ụmụ ya ákwá
  rationale: Ụdị “na-akwara” na-egosi omume na-aga n’ihu; “ụmụ ya” anaghị ekwu na ha bụ naanị ụmụ nwoke.
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: ọ chọghịkwa ka a kasie ya obi
  rationale: Nke a na-anọ nso n’echiche nke ‘ọ chọghị/ọ dịghị njikere’ karịa ime ka okwu ahụ sie ike dịka ‘ọ jụrụ ajụ,’ ma “kasie ya obi” bụ Igbo ebumpụta ụwa maka nkasi obi.
- source_word: ὅτι οὐκ εἰσίν
  choice: n’ihi na ha anọkwaghị
  rationale: Nke a na-echekwa mkpụmkpụ na ịdị arọ nke okwu Grik, na-egosi na ụmụ ahụ adịghịzi, n’ebughị ụzọ tinye okwu doro anya dịka ‘ha nwụrụ anwụ.’
theological_decisions:
- issue: Ụdị ọrụ Rechel n’amụma ahụ
  choice: E debere Rechel dị ka nne na-akwa ákwá n’okwu amụma ahụ, n’akọwaghị ihe atụ ọ pụtara n’ahịrịokwu bụ isi.
  alternative: Ịkọwa Rechel ozugbo dịka onye nnọchianya ndị nne Izrel, ma ọ bụ dịka nne akụkọ ihe mere eme na-ekwu okwu n’onwe ya.
  rationale: Okwu Grik na-akpọ naanị aha Rechel ma hapụ mmekọrịta dị n’etiti akụkọ ihe mere eme, ihe atụ, na mmezu amụma ka ọ dị. Ntụgharị ahụ ekwesịghị ikpebi otu nkọwa naanị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ụda uri na iru újú nke amụma ahụ; akara ogologo na kolon na-eme ka akụkụ mbụ banyere olu e nụrụ jikọọ nke ọma na nkọwa banyere Rechel.
