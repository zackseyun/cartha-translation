id: MAT.2.21
reference: Matthew 2:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: ig
  text: O biliri, kpọrọ nwatakịrị ahụ na nne ya, wee banye n’ala Izrel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ya mere
  rationale: N’ebe a, δέ na-eme ka akụkọ gaa n’ihu, ọ bụghị igosi nnukwu mmegide. “Ya mere” jikọtara ihe a na iwu e nyere ya n’amaokwu bu ụzọ.
- source_word: ἐγερθεὶς
  choice: o biliri
  rationale: Ọ bụ participle aorist passive nke na-arụ ọrụ dị ka intransitive n’ebe a, ya bụ, o biliri wee mee ihe sochirinụ.
- source_word: παρέλαβε
  choice: kpọrọ
  rationale: παραλαμβάνω n’ebe a pụtara ịkpọrọ mmadụ soro onwe ya. “Kpọrọ” bụ okwu Igbo dị mfe ma kwekọọ na ọnọdụ njem ahụ.
- source_word: τὸ παιδίον
  choice: nwatakịrị ahụ
  rationale: παιδίον pụtara nwatakịrị; okwu ahụ anaghị achọ ka a gbakwụnye nkọwa afọ ọzọ.
- source_word: τὴν μητέρα αὐτοῦ
  choice: nne ya
  rationale: αὐτοῦ na-ezo aka n’ebe nwatakịrị ahụ nọ; “nne ya” na-edobe usoro Grik n’ụzọ Igbo dị mma.
- source_word: εἰσῆλθεν
  choice: wee banye
  rationale: εἰσέρχομαι pụtara ịbanye ma ọ bụ ịga n’ime. “Wee banye” na-egosi usoro omume ndị ahụ n’akụkọ n’ụzọ dị nro.
- source_word: εἰς γῆν Ἰσραήλ
  choice: n’ala Izrel
  rationale: Nke a na-edobe echiche ala ma ọ bụ mpaghara mba Izrel, n’enweghị ịgbakwunye nkọwa ọzọ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe ma nwee ugwu. E debere usoro omume nke ahịrịokwu Grik, ma zere participle siri ike nke na-agaghị ada ka Igbo nkịtị.
