  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: ig
  text: Ha na-ekwu, sị, “Ebee ka eze ndị Juu a mụrụ nọ? N’ihi na anyị hụrụ kpakpando ya n’ọwụwa anyanwụ[a], anyị abịawo ịkpọ isiala nye ya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “n’oge kpakpando ahụ wara.” Nkebiokwu Grik ahụ nwere ike ịpụta “n’ọwụwa anyanwụ” ma ọ bụ na ọ na-ekwu banyere mgbe kpakpando ahụ wara.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ife ya ofufe.” Okwu Grik ahụ nwere ike ịpụta ịkpọ isiala ma ọ bụ inye eze nsọpụrụ; o nwekwara ike ịpụta ife ofufe, dabere n’ọnọdụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: Ha na-ajụ
  rationale: Ọ bụ participle nke na-ewebata ihe ndị ọkachamara ahụ kwuru. Ebe okwu ha bụ ajụjụ, ‘Ha na-ajụ’ bụ Igbo doro anya ma dịkwa mma n’akụkọ.
- source_word: Ποῦ ἐστιν
  choice: Olee ebe ... nọ?
  rationale: Nke a bụ usoro ajụjụ Igbo nkịtị maka ịjụ ebe mmadụ nọ, na-agbakwụghị ihe ọ bụla n’ihe Grik kwuru.
- source_word: ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων
  choice: onye ahụ a mụrụ dị ka eze ndị Juu
  rationale: Nke a na-echekwa njikọ dị n’etiti ọmụmụ onye ahụ na ọkwa eze ya, ma ọ naghị agbakwunye echiche na ọ ka bụ nwa ọhụrụ.
- source_word: εἴδομεν γὰρ
  choice: N’ihi na anyị hụrụ
  rationale: γάρ na-enye ihe kpatara ha ji ajụ ajụjụ ahụ; ‘N’ihi na’ na-egosi njikọ a n’Igbo, ebe ‘anyị hụrụ’ na-egosi ihe mere n’oge gara aga.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: kpakpando ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa kpọmkwem isi gosipụta genitive nke nwe, n’akọwaghị ụdị ihe ịrịba ama ahụ.
- source_word: ἐν τῇ ἀνατολῇ
  choice: n’ọwụwa anyanwụ
  rationale: Nkebiokwu Grik a nwere ike ịpụta mpaghara ọwụwa anyanwụ ma ọ bụ oge kpakpando ahụ wara. Nsụgharị bụ isi na-eji echiche mpaghara, ebe nkọwa ala peeji na-echekwa echiche nke ọzọ.
- source_word: ἤλθομεν
  choice: anyị abịawokwa
  rationale: Ụdị a na-egosi na ọbịbịa ha emezuola ma na-emetụta ọnọdụ ha nọ na ya ugbu a ka ha na-ekwu okwu.
- source_word: προσκυνῆσαι αὐτῷ
  choice: ịkpọ isiala nye ya
  rationale: Okwu Igbo a na-egosi omume nsọpụrụ miri emi e nyere eze, ma ọ ka nwekwara ike ibu echiche nke ofufe; ya mere ọ naghị ekpebi ihe okwu Grik ahụ hapụrụ ka ọnọdụ ya kọwaa.
theological_decisions:
- issue: Ihe προσκυνῆσαι pụtara mgbe a na-ekwu banyere Jizọs bụ nwata
  choice: ịkpọ isiala nye ya
  alternative: ife ya ofufe
  rationale: N’ọnọdụ a, ndị na-ekwu okwu na-achọ ‘eze ndị Juu,’ ya mere nsọpụrụ eze pụtara ìhè. ‘Ịkpọ isiala’ na-echekwa ma nsọpụrụ eze ma ohere nke ofufe, kama ikpebi ozugbo na naanị otu n’ime ha ka okwu ahụ pụtara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Ịkpọ isiala nye ya’ bụ okwu nkịtị maka nsọpụrụ miri emi a na-enye onye dị elu, ma ọ naghị ehichapụ mgbagwoju echiche dị na okwu Grik. Akara nkọwa [a] na [b] dị n’ebe okwu ndị ha na-akọwa nọ.
