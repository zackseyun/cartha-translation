  text: τότε ἐπληρώθη τὸ ῥηθὲν ⸀διὰ Ἰερεμίου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/017.yaml
  text: 'Then what was spoken through Jeremiah the prophet was fulfilled[a], saying:'
translation:
  language: ig
  text: 'Mgbe ahụ, ihe e kwuru site n’aka Jeremaya onye amụma mezuru, sị:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe sochiri ihe ndị a kọrọ tupu ya, ma bụrụkwa okwu Igbo doro anya ma dị mfe.
- source_word: ἐπληρώθη
  choice: mezuru
  rationale: Ọ na-edobe okwu Matiu ji ekwu na ihe onye amụma kwuru enwetala mmezu, n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: τὸ ῥηθὲν
  choice: ihe e kwuru
  rationale: Nke a na-egosipụta participle ahụ e jiri dị ka aha n’ụzọ Igbo nkịtị.
- source_word: διὰ Ἰερεμίου
  choice: site n’ọnụ Jeremaya
  rationale: Ọ na-egosi Jeremaya dị ka onye e si n’ọnụ ya kwuo okwu ahụ; nke a bụ ụzọ Igbo e ji akọ okwu amụma n’ụzọ ebumpụta ụwa.
- source_word: τοῦ προφήτου
  choice: onye amụma
  rationale: Ọ na-akọwa ọrụ Jeremaya kpọmkwem dịka ederede Grik si mee.
- source_word: λέγοντος
  choice: sị
  rationale: Ọ na-ewebata okwu a ga-ehota n’amaokwu na-esote n’ụzọ Igbo dị mkpirikpi ma kwekọọ na usoro okwu Grik.
theological_decisions:
- issue: Usoro okwu Matiu banyere mmezu amụma
  choice: 'E debere okwu mmezu ahụ kpọmkwem: “mezuru.”'
  alternative: “mere ka ihe ahụ mezuo” ma ọ bụ “mere iji mezuo”
  rationale: Ederede ahụ na-ekwu na okwu amụma ahụ mezuru; ọ naghị akọwa ihe mere dị ka nzube e ji mee ihe ahụ. Nsụgharị a na-edobe nkwupụta edemede na nke nkà mmụta okpukpe Matiu n’enweghị ime ka ọ sie ike karịa Grik.
- issue: Ihe λέγοντος na-ejikọta na ya
  choice: E ji “sị” hapụ njikọ ya ka ọ dị nkenke dịka usoro iwebata okwu e hotara.
  alternative: “nke na-asị” ma ọ bụ “Jeremaya kwuru sị”
  rationale: N’asụsụ Grik, participle ahụ dị na genitive ma na-esochi “Jeremaya onye amụma,” ma ọrụ ya bụ iwebata ihe e kwuru. “Sị” bụ ụzọ Igbo ebumpụta ụwa nke na-adịghị amanye nkọwa karịa ihe ederede kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Site n’ọnụ” bụ usoro Igbo nkịtị maka onye Chineke si n’aka ya kwuo okwu, ebe “sị” na-ejikọta amaokwu a na okwu e hotara n’amaokwu na-esote.
