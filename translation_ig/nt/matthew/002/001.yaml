id: MAT.2.1
reference: Matthew 2:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: ig
  text: Mgbe a mụsịrị Jizọs na Betlehem nke Judia, n’oge Herọd bụ eze, lee, ndị ọkà mmụta[a] si n’ọwụwa anyanwụ bịarutere Jerusalem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Magi.” Okwu Grik a na-ezo aka n’ndị ọkà mmụta si n’ebe ọwụwa anyanwụ, ndị o nwere ike ịbụ na ha na-agụ kpakpando ma ọ bụ na-arụ ọrụ n’ụlọ eze dịka ndị ndụmọdụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: Mgbe a mụsịrị Jizọs
  rationale: Nkebiokwu genitive absolute a na-enye ọnọdụ oge bu ụzọ tupu isi omume ahụ; “Mgbe a mụsịrị Jizọs” na-egosipụta nke a n’ụzọ Igbo dị ire ma ghara ịgbakwunye okwu ‘ugbu a’ na-adịghị n’isi mmalite ahụ.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: Betlehem nke Judia
  rationale: A sụgharịrị aha ebe ndị ahụ n’ụdị a na-aghọta n’Igbo; “nke Judia” na-edobe njikọ genitive ma na-akọwa Betlehem a na-ekwu maka ya.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: n’oge Herọd bụ eze
  rationale: Nke a na-enye otu ihe akụkọ ihe mere eme ahụ pụtara n’Igbo nke oge a, ma na-edobe Herọd dịka eze n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” bụ okwu Igbo dị mkpụmkpụ nke na-adọta uche onye na-agụ ya gaa n’ihe na-esote, dịka ἰδού si arụ ọrụ n’akụkọ ahụ.
- source_word: μάγοι
  choice: ndị ọkà mmụta
  rationale: Okwu a na-ezo aka n’ụmụ nwoke ndị ọwụwa anyanwụ nwere ihe ọmụma pụrụ iche, ikekwe n’ihe banyere kpakpando ma ọ bụ amamihe ụlọ eze. “Ndị ọkà mmụta” dị mfe nghọta ma ghara ịkpọ ha ndị eze ma ọ bụ ịkọ ọnụ ọgụgụ ha; ihe odide ala peeji kọwara okwu ahụ nke ọma.
- source_word: ἀπὸ ἀνατολῶν
  choice: si n’ọwụwa anyanwụ
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosipụta na ha si mpaghara ndị dị n’ọwụwa anyanwụ bịa.
- source_word: παρεγένοντο
  choice: bịarutere
  rationale: Ngwaa ahụ na-egosi ọbịbịa n’ebe ahụ; “bịarutere” na-egosipụta mmegharị na njedebe ya nke ọma.
- source_word: εἰς Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Mgbe e jikọtara ya na “bịarutere,” aha ebe ahụ na-arụ ọrụ dịka ebe njem ahụ jedebere; nke a bụ usoro Igbo eke.
theological_decisions:
- issue: Ịsụgharị μάγοι n’enweghị itinye akụkọ ọdịnala e mesịrị
  choice: ndị ọkà mmụta
  alternative: ndị Magi
  rationale: Nhọrọ a na-eme ka ọrụ ha dịka ndị nwere ihe ọmụma pụta ìhè, ma ọ naghị ekwu na ha bụ ndị eze, na ha dị atọ, ma ọ bụ tinye nkọwa ọdịnala ndị ọzọ na-adịghị n’amaokwu ahụ. Ihe odide ala peeji na-edobe okwu teknịkalụ “Magi” na njikọ ya na ịmụ kpakpando ma ọ bụ amamihe ụlọ eze.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere “lee” iji gosipụta ike okwu ἰδού, ma zere okwu ochie gabiga ókè na nkọwa ọdịnala na-adịghị n’isi mmalite.
