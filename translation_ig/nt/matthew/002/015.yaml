    text: Matiu hotara Hosea 11:1. N’ebe ahụ, okwu a na mbụ na-ezo aka n’Izrel dịka nwa Chineke; n’ebe a, Matiu na-egosi na Jizọs mezuru Akwụkwọ Nsọ a.
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, “ihe Onyenwe anyị kwuru site n’aka onye amụma.”
    reason: lexical_alternative
  revision_rationale: The revision restores the plural narrative subject, removes an unwarranted additive nuance, represents the passive fulfillment formula more directly, and corrects the citation verb to ‘kpọrọ’ (‘called’). It retains the Lord/prophet distinction and does not resolve Matthew’s fulfillment claim into a particular theological model.
