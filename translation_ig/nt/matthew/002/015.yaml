id: MAT.2.15
reference: Matthew 2:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: ig
  text: Ha nọ n’ebe ahụ ruo mgbe Herọd nwụrụ, ka ihe Onyenwe anyị kwuru site n’aka onye amụma[c] wee mezue, sị:[b] “Site n’Ijipt ka m kpọrọ nwa m.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’Ijipt ka m kpọrọ nwa m.”
    reason: lexical_alternative
  - marker: b
    text: Matiu hotara Hosea 11:1. N’ebe ahụ, okwu a na mbụ na-ezo aka n’Izrel dịka nwa Chineke; n’ebe a, Matiu na-egosi na Jizọs mezuru Akwụkwọ Nsọ a.
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, “ihe Onyenwe anyị kwuru site n’aka onye amụma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: Ọ nọkwa n’ebe ahụ
  rationale: N’Igbo, ‘ịnọ n’ebe ahụ’ na-egosipụta n'ụzọ dị mfe na ọ gara n’ihu ịnọ ebe ahụ, ma ọ naghị etinye nkọwa karịrị imperfect ἦν na ἐκεῖ.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: ruo mgbe Herọd nwụrụ
  rationale: τελευτή pụtara ọnwụ ma ọ bụ njedebe ndụ n’ebe a. Usoro ngwaa a bụ Igbo nkịtị ma na-enye otu ihe ahụ nominal construction Grik na-enye.
- source_word: ἵνα πληρωθῇ
  choice: ka ... wee mezuo
  rationale: Usoro ‘ka ... wee’ na-echekwa ike ebumnuche ma ọ bụ nsonaazụ nke ἵνα, ebe ‘mezuo’ na-egosipụta passive fulfillment formula n'ụzọ Igbo na-anabata nke ọma.
- source_word: τὸ ῥηθὲν
  choice: ihe ... kwuru
  rationale: Nke a bụ ntụgharị Igbo dị ndụ nke articular passive participle, ya bụ ‘ihe e kwuru’; onye na-ekwu ya ka e gosiri ozugbo dịka Onyenwe anyị.
- source_word: ὑπὸ κυρίου
  choice: Onyenwe anyị kwuru
  rationale: Onyenwe anyị bụ isi mmalite okwu amụma ahụ. A naghị atụkwasị ‘Chineke’ n’ihi na okwu Grik bụ naanị κυρίου.
- source_word: διὰ τοῦ προφήτου
  choice: site n’ọnụ onye amụma
  rationale: 'Akpaalaokwu Igbo a na-echekwa mediated agency nke διά: Onyenwe anyị bụ onye kwuru okwu ahụ, onye amụma bụkwa ụzọ o si kwuo ya.'
- source_word: λέγοντος
  choice: Onye amụma ahụ kwuru, sị
  rationale: Ọ na-ewebata okwu e hotara n'ụzọ doro anya ma dịkwa mma n’Igbo; a na-eme ka onye participle ahụ na-ezo aka na ya pụta ìhè n’ihi nhazi ahịrịokwu Igbo.
- source_word: Ἐξ Αἰγύπτου
  choice: Ọ bụ n’Ijipt ka
  rationale: Cleft construction a na-edobe okwu Ijipt n’ihu ma na-egosipụta mmegharị si n’ime Ijipt pụta, dịka ἐξ si eme.
- source_word: ἐκάλεσα
  choice: m kpọpụtara
  rationale: N’usoro a, ‘kpọpụta’ na-egosi ịkpọ mmadụ ka o si n’otu ebe pụta. Ọ dabara na njikọ ἐξ ... ἐκάλεσα ma na-ezere nghọtahie ‘kpọrọ aha,’ ọ bụ ezie na ‘kpọrọ’ bụ ntụgharị dị nso karịa n’ụdị okwu.
- source_word: τὸν υἱόν μου
  choice: nwa m nwoke
  rationale: υἱός bụ ‘nwa nwoke/son,’ ọ bụghị naanị nwa n’ozuzu. Nhọrọ a na-echekwa okike nwoke n’etinyeghị echiche ‘ọkpara,’ nke ga-agbakwụnye na ọ bụ nwa mbụ.
theological_decisions:
- issue: Usoro mmezu na nhota Hosea 11:1
  choice: E debere okwu ‘ka ... wee mezuo’ n’enweghị ịkọwa ụdị mmezu Matiu bu n’obi.
  alternative: Ịsị na ọ bụ naanị amụma kpọmkwem, ma ọ bụ ịkọwa ya ozugbo dịka Jizọs na-emeghachi akụkọ Izrel.
  rationale: Matiu kwuru n’ezie na Akwụkwọ Nsọ ahụ mezuru, ma ntụgharị ekwesịghị ikpebi n’ime ederede ma mmezu ahụ ọ bụ amụma kpọmkwem ka ọ bụ mmezu ihe atụ nke akụkọ Izrel.
- issue: κύριος n’usoro okwu amụma
  choice: Onyenwe anyị
  alternative: ONYENWE ANYỊ ma ọ bụ Onyenwe anyị Chineke
  rationale: κυρίου n’ederede Grik bụ ‘Onyenwe anyị.’ Ide ya n’ụdị nkịtị ma ghara ịgbakwunye ‘Chineke’ na-anọgide n’ihe isi iyi ahụ kwuru.
- issue: ‘Nwa m nwoke’ na Hosea na Matiu
  choice: E chekwara singular filial language n’enweghị ịkọwa onye ọ na-ezo aka na ya n’ime nhota ahụ.
  alternative: Ịsị ‘Izrel, nwa m’ ma ọ bụ iji aha Jizọs dochie ‘nwa m nwoke.’
  rationale: Nhota ahụ n’onwe ya kwuru naanị ‘nwa m nwoke.’ Ihe gbara Hosea gburugburu na-ezo aka n’Izrel, ebe Matiu jiri ya mee ihe banyere Jizọs; ntụgharị ahụ na-echekwa njikọ na mgbagwoju a.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Site n’ọnụ onye amụma’ bụ akpaalaokwu nkịtị na-egosi na Onyenwe anyị bụ isi okwu ahụ, onye amụma bụrụ onye o si n’ọnụ ya kwuo. A zere ‘ọkpara’ n’ihi na ọ nwere ike ịpụta nwa nwoke mbụ, ihe υἱός n’onwe ya na-ekwughị.
