revisions:
- from: Ma gị onwe gị, Betlehem, ala Juda, ị bụghị ma ọlị onye kasị nta n’etiti ndị ọchịchị Juda; n’ihi na ọ bụ n’ime gị ka onye ọchịchị ga-esi pụta[a], onye ga-azụ ndị m Izrel dịka atụrụ[b].
  to: Ma gị onwe gị, Betlehem, ala Juda, ị bụghị ma ọlị onye kasị nta n’etiti ndị ọchịchị Juda; n’ihi na ọ bụ n’ime gị ka onye ọchịchị ga-esi pụta[a], onye ga-elekọta ndị m, bụ Izrel, dịka onye ọzụzụ atụrụ[b].
  rationale: The revision removes the added comparison “as sheep” while retaining the explicit shepherding imagery through a natural Igbo expression. It also clarifies that Israel is appositional to “my people.” The emphatic, geographic, and governing elements of the Greek remain intact, and both footnote anchors remain attached to the relevant expressions.
  reviewer_model: gpt-5.6-terra
