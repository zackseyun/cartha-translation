id: MAT.2.6
reference: Matthew 2:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: ig
  text: Ma gị onwe gị, Betlehem, ala Juda, ị bụghị ma ọlị onye kasị nta n’etiti ndị ọchịchị Juda; n’ihi na ọ bụ n’ime gị ka onye ọchịchị ga-esi pụta[a], onye ga-elekọta ndị m, bụ Izrel, dịka onye ọzụzụ atụrụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ga-apụta”; n’ụzọ nkịtị karị, “ga-apụ.”
    reason: lexical_alternative
  - marker: b
    text: Okwu a sụgharịrị “ga-elekọta … dịka onye ọzụzụ atụrụ” nwekwara ike ibu echiche nke “ga-achị,” ya mere ọ na-ejikọta ọchịchị eze na nlekọta onye ọzụzụ atụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: ala
  rationale: N’ebe a, okwu ahụ na-egosi ógbè ma ọ bụ ala e jikọtara na Juda, ọ bụghị ájá ma ọ bụ ụwa dum.
- source_word: οὐδαμῶς
  choice: ọ bụghị ma ọlị
  rationale: Nke a na-echekwa nkwusi ike dị n’ajụjụ ahụ karịa nanị ịsị ‘ọ bụghị.’
- source_word: ἐλαχίστη
  choice: onye kasị nta
  rationale: Ọ na-ekwu maka ịdị nta n’ọkwa ma ọ bụ n’uru; ntụgharị a kwekọrọ na otú e si agwa Betlehem okwu dịka mmadụ.
- source_word: ἡγεμόσιν
  choice: ndị ọchịchị
  rationale: Ọ na-echekwa echiche nke ndị nwere ikike ịchị, n’etinyeghị otu ọkwa ọchịchị kpọmkwem nke okwu Grik ahụ na-amanyeghị.
- source_word: ἐξελεύσεται
  choice: ga-esi pụta
  rationale: Ọ na-egosi na onye ahụ ga-esite na Betlehem pụta ma na-echekwa ihe oyiyi nke mmegharị dị n’okwu Grik ahụ.
- source_word: ἡγούμενος
  choice: onye ọchịchị
  rationale: Participụl a na-arụ ọrụ dịka aha ma na-akọwa onye ahụ dịka onye na-edu ma na-achị.
- source_word: ποιμανεῖ
  choice: ga-azụ … dịka atụrụ
  rationale: Nke a na-echekwa ihe oyiyi onye ọzụzụ atụrụ, ebe ihe okwu ahụ pụtara n’ihe gbasara ịchị ka dịkwa n’akụkụ ya.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: ndị m Izrel
  rationale: Nke a na-egosipụta njikọ nke Izrel na ‘ndị m’ n’ụzọ dị mkpirikpi ma doo anya n’Igbo.
theological_decisions:
- issue: Ma a ga-egosi onye ahụ dịka eze na-achị ka ọ bụ dịka onye ọzụzụ atụrụ
  choice: A kpọrọ ya ‘onye ọchịchị,’ ma kwuo na ọ ‘ga-azụ ndị m Izrel dịka atụrụ.’
  alternative: Ịsụgharị okwu abụọ ahụ naanị n’asụsụ ọchịchị, ma ọ bụ naanị n’asụsụ nlekọta onye ọzụzụ atụrụ.
  rationale: Ihe odide ahụ jikọtara ikike ọchịchị na ihe oyiyi onye ọzụzụ atụrụ. Idebe ha abụọ na-egbochi ntụgharị ahụ idozi esemokwu ahụ n’otu akụkụ naanị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dịkwa mfe nghọta, dee ya. A hapụrụ ntụgharị okwu a n’ụdị abụ amụma, ma zere okwu ụka pụrụ iche. Akara nkọwa ala peeji dị n’ebe okwu ha na-akọwa dị.
