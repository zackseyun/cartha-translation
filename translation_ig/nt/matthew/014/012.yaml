review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the sequence: John''s disciples came, took up the dead body, buried him, and then went to report to Jesus. However, “ozu ya” adds an explicit possessive to τὸ πτῶμα, which has only the article; “ozu ahụ” more closely preserves the Greek wording while remaining clear from context.'
  naturalness: The narrative is clear, modern Standard Igbo, and suitably restrained. “Ha wee gaa kọọrọ Jizọs ihe mere” naturally expresses the sequential participle and the implied content of the report.
  terminology: “Ndị na-eso ụzọ,” “ozu,” “lie,” and “Jizọs” are appropriate Standard Igbo choices. The footnote's alternative should use the more idiomatic expression “ahụ onye nwụrụ anwụ,” rather than “ahụ ya nwụrụ anwụ.”
  issues:
  - severity: low
    issue: Explicit possessive in “ozu ya”
    rationale: The Greek reads τὸ πτῶμα (“the body/corpse”), without a possessive. Context identifies it as John's body, but “ozu ahụ” avoids adding a possessive while retaining natural clarity.
  - severity: low
    issue: Footnote alternative is not idiomatic Igbo
    rationale: “Ahụ ya nwụrụ anwụ” is awkward and can be misconstrued. “Ahụ onye nwụrụ anwụ” idiomatically conveys “a dead body.”
  revised_text: Ndị na-eso ụzọ ya bịara, buru ozu ahụ, lie ya; ha wee gaa kọọrọ Jizọs ihe mere.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ahụ onye nwụrụ anwụ.” Okwu Grik a pụtara ahụ onye nwụrụ anwụ.
    reason: lexical_alternative
  revision_rationale: The revision removes the possessive not expressed with πτῶμα and improves the lexical-alternative footnote's idiomatic Standard Igbo. It retains the draft's natural rendering of the final report and does not resolve beyond the context the identity already left implicit by the Greek pronoun.
