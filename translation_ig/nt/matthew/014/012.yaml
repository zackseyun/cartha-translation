revisions:
- from: Ndị na-eso ụzọ ya bịara, buru ozu ya[a], lie ya; ha wee gaa kọọrọ Jizọs ihe mere.
  to: Ndị na-eso ụzọ ya bịara, buru ozu ahụ, lie ya; ha wee gaa kọọrọ Jizọs ihe mere.
  rationale: The revision removes the possessive not expressed with πτῶμα and improves the lexical-alternative footnote's idiomatic Standard Igbo. It retains the draft's natural rendering of the final report and does not resolve beyond the context the identity already left implicit by the Greek pronoun.
