  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: ig
  text: Ndị na-eso ụzọ ya bịara, buru ozu ahụ, lie ya; ha wee gaa kọọrọ Jizọs ihe mere.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: bịara
  rationale: Nkebi ngwaa a na-egosi na ndị na-eso ụzọ ahụ bịarutere ebe ahụ tupu ha eburu ozu ahụ. “Bịara” bụ okwu Igbo dị mfe ma kwekọọ n’usoro akụkọ a.
- source_word: μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a na-edobe okwu a na-ejikarị akọwa μαθηταί na mmekọrịta ha na onye ha na-eso. N’ọnọdụ akụkọ a, “ya” na-ezo aka na Jọn Onye Na-eme Baptizim, ma a hapụrụ nnọchiaha ahụ dịka Grik si kwuo ya.
- source_word: ἦραν
  choice: buru
  rationale: N’ebe a, αἴρω pụtara ibuli ma buru ihe pụọ. “Buru” dabara n’omume iburu ozu gaa lie ya, na-enweghị itinye nkọwa ọzọ na-adịghị na Grik.
- source_word: πτῶμα
  choice: ozu ya
  rationale: πτῶμα na-ezo kpọmkwem n’ahụ onye nwụrụ anwụ. “Ozu” bụ okwu Igbo nkịtị, doro anya, ma dabara n’akụkọ olili.
- source_word: ἔθαψαν αὐτόν
  choice: lie ya
  rationale: θάπτω pụtara ili. “Lie ya” bụ ntụgharị kwụ ọtọ nke na-adịghị agbakwunye ili ma ọ bụ ọnọdụ olili a na-ekwughị n’amaokwu a.
- source_word: ἐλθόντες
  choice: ha wee gaa
  rationale: Nkebi ngwaa a na-egosi mmegharị na ihe omume sochirinụ. “Ha wee gaa” na-eme ka usoro akụkọ ahụ bụrụ Igbo eke ma na-edobe echiche nke ịga ruo ebe Jizọs nọ.
- source_word: ἀπήγγειλαν
  choice: kọọrọ ... ihe mere
  rationale: ἀπαγγέλλω pụtara ịkọ ma ọ bụ izisa akụkọ. Ebe ihe a kọọrọ Jizọs adịghị ka ihe e dere kpọmkwem n’ahịrịokwu Grik, “ihe mere” na-eme ka Igbo zuo oke ma na-ezo n’ọnọdụ ahụ n’enweghị ịkọwapụta karịa ihe gbara amaokwu ahụ gburugburu.
- source_word: τῷ Ἰησοῦ
  choice: Jizọs
  rationale: “Jizọs” bụ ụdị aha Ἰησοῦς a maara nke ọma n’Igbo ọkọlọtọ.
theological_decisions:
- issue: Onye okwu ahụ bụ “ndị na-eso ụzọ ya” na-ezo aka na ya
  choice: E debere ya dịka “ndị na-eso ụzọ ya”; ọnọdụ akụkọ ahụ na-egosi na ha bụ ndị na-eso ụzọ Jọn Onye Na-eme Baptizim.
  alternative: Ịsụgharị ya kpọmkwem dịka “ndị na-eso ụzọ Jọn.”
  rationale: Ọnwụ Jọn bụ ihe a na-akọ ozugbo tupu amaokwu a, ya mere nnọchiaha αὐτοῦ na-ezo aka na Jọn. Ma ide “ya” na-edobe usoro na ntakịrị oghere nkọwa dị n’asụsụ Grik kama itinye aha Jọn n’ederede.
translation_notes:
  register: Ejiri Igbo ọkọlọtọ dị ugbu a, dị mfe ma dị ùgwù. Usoro “ha wee gaa” na “kọọrọ Jizọs ihe mere” na-eme ka akụkọ ahụ na-aga were were n’Igbo, ebe “ozu” na-egosipụta kpọmkwem na πτῶμα bụ ahụ onye nwụrụ anwụ.
