id: MAT.14.19
reference: Matthew 14:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: ig
  text: Mgbe o nyere ìgwè mmadụ ahụ iwu ka ha nọdụ ala iri nri n’elu ahịhịa, o weere ogbe achịcha ise ahụ na azụ abụọ ahụ, leliri anya n’eluigwe, gọzie[a], nyawaa ogbe achịcha ndị ahụ, wee nye ndị na-eso ụzọ ya achịcha ndị ahụ; ndị na-eso ụzọ ya wee nye ìgwè mmadụ ahụ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gọzie Chineke,” ma ọ bụ, “kwuo ekpere ngọzi.” Grik kwuru naanị “gọzie,” n’ekwughị onye ma ọ bụ ihe ọ gọziri.
    reason: alternative_reading
lexical_decisions:
- source_word: κελεύσας
  choice: Mgbe o nyere ... iwu
  rationale: Na-egosi na ntụziaka ahụ buru ụzọ mee tupu o were achịcha na azụ, ma na-echekwa ike nke iwu ahụ.
- source_word: τοὺς ὄχλους
  choice: ìgwè mmadụ ahụ
  rationale: Okwu Igbo a bụ nke a na-aghọta nke ọma maka ọtụtụ mmadụ zukọtara n’otu ebe.
- source_word: ἀνακλιθῆναι
  choice: ka ha nọdụ ala iri nri
  rationale: Omume a bụ ịnọdụ ma ọ bụ ịdabere ala maka iri nri; ntụgharị a na-eme ka ọnọdụ nri ahụ doo onye Igbo nke oge a anya n’enweghị ịmanye ha ka ha dinara ala kpamkpam.
- source_word: ἐπὶ τοῦ χόρτου
  choice: n’elu ahịhịa
  rationale: Na-asụgharị ebe ahụ kpọmkwem, n’etinyeghị nkọwa Mark banyere ahịhịa ndụ.
- source_word: λαβὼν
  choice: o weere
  rationale: A tụgharịrị participle ahụ dịka ngwaa zuru ezu ka akụkọ ahụ na-aga nke ọma n’Igbo, ma usoro omume ya ka dị.
- source_word: τοὺς πέντε ἄρτους
  choice: ogbe achịcha ise ahụ
  rationale: Ogbe achịcha na-egosi achịcha ndị a pụrụ ịgụ ọnụ karịa naanị ‘achịcha.’
- source_word: τοὺς δύο ἰχθύας
  choice: azụ abụọ ahụ
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke ziri ezi isi kwuo azụ abụọ.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: leliri anya n’eluigwe
  rationale: Na-echekwa omume ile anya elu na ebe e lere anya n’asụsụ Igbo dị nkenke ma dị ùgwù.
- source_word: εὐλόγησεν
  choice: gọzie
  rationale: E hapụrụ ihe ma ọ bụ onye a gọziri agọzi n’ekwughị ya, dịka Grik si mee, iji ghara ikpebi ma ọ bụ Chineke ka a gọziri, ma ọ bụ nri ahụ.
- source_word: κλάσας
  choice: nyawaa ogbe achịcha ndị ahụ
  rationale: ‘Nyawaa’ na-egosi ịgbaji achịcha ka e kee ya; e kwuru ihe e nyawara ka okwu ahụ doo anya.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: nye ha ndị na-eso ụzọ ya
  rationale: ‘Ha’ na-ezo aka n’ogbe achịcha ndị a nyawara, ebe ‘ndị na-eso ụzọ ya’ bụ okwu Igbo doro anya maka μαθηταί.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: ndị na-eso ụzọ ya nyekwara ha ìgwè mmadụ ahụ
  rationale: E mejupụtara ngwaa Grik hapụrụ n’ime ahịrịokwu ahụ ka Igbo wee bụrụ nke eke ma doo anya.
theological_decisions:
- issue: Ihe ma ọ bụ onye εὐλόγησεν (‘gọzie’) metụtara
  choice: E dere naanị ‘gọzie,’ n’ekwughị ihe ma ọ bụ onye ọ gọziri.
  alternative: ‘gọzie ha’ maka achịcha na azụ, ma ọ bụ ‘gọzie Chineke’ / ‘kwuo ekpere ngọzi.’
  rationale: Grik ekwughị object nke ngwaa ahụ. Ịhapụ ya otu a na-echekwa ihe a na-amaghị anya na esemokwu nkọwa ahụ kama ịhọrọ otu nghọta n’ime ha.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘nọdụ ala iri nri’ iji mee ka omenala ịdabere ala eri nri pụta ìhè n’ụzọ onye Igbo ga-aghọta; e zere okwu ụka pụrụ iche. Akara ndetu [a] dị ozugbo n’ebe okwu na-edochaghị anya dị.
