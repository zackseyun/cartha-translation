  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: ig
  text: Ma ha sịrị ya, “Anyị enweghị ihe ọ bụla n’ebe a ma e wezụga ogbe achịcha ise na azụ abụọ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị ya, “Ihe anyị nwere n’ebe a bụ naanị ogbe achịcha ise na azụ abụọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ma ha
  rationale: ‘Ha’ na-ezo aka n’ebe ndị na-eso ụzọ nọ, ebe ‘Ma’ na-egosi obere ọdịiche dị n’etiti okwu ha na ntụziaka Jizọs kwuru tupu ya.
- source_word: λέγουσιν αὐτῷ
  choice: sịrị ya
  rationale: Ọ bụ ezie na Grik ji oge ugbu a n’akụkọ ihe mere eme, oge gara aga bụ ụzọ e si akọ akụkọ a nke ọma na Igbo.
- source_word: Οὐκ ἔχομεν
  choice: Anyị enweghị ihe ọ bụla
  rationale: Nke a na-egosipụta n’ụzọ doro anya ma bụrụkwa Igbo ebumpụta ụwa na ha enweghị ihe ọzọ.
- source_word: ὧδε
  choice: n’ebe a
  rationale: Nke a na-echekwa nkọwa ọnọdụ nke okwu Grik ahụ, ya bụ ‘ebe a.’
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: Mgbe ọ na-eso nkwupụta jụrụ ihe, okwu a pụtara ‘ma e wezụga,’ ọ bụghị ‘ọ bụrụ na ọ bụghị.’
- source_word: πέντε ἄρτους
  choice: ogbe achịcha ise
  rationale: ‘Ogbe achịcha’ na-egosi achịcha ndị a pụrụ ịgụ n’otu n’otu, dịka aha Grik n'ụdị ọtụtụ si gosi.
- source_word: δύο ἰχθύας
  choice: azụ abụọ
  rationale: Nke a bụ ntụgharị Igbo dị mfe ma zie ezi maka azụ abụọ.
