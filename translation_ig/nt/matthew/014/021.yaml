  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: ig
  text: Ndị ikom riri nri ahụ ruru ihe dị ka puku ise, ma e wezụga ụmụ nwanyị na ụmụaka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “a gụnyeghị ụmụ nwanyị na ụmụaka n’ọnụ ọgụgụ ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Ndị riri nri ahụ
  rationale: Nkebi a na-arụ ọrụ dịka aha, na-ezo aka ná ndị sonyere rie nri ahụ. Igbo a bụ nke e ji eme ihe n'ụzọ ebumpụta ụwa, ma ọ naghị amanye ọdịiche oge nke participle ahụ karịa ihe Grik kwuru; δέ bụ njikọ akụkọ dị nro nke a na-ekwesịghị ịtụgharị dịka okwu oge pụrụ iche n'ebe a.
- source_word: ἦσαν
  choice: dị
  rationale: Imperfect nke εἰμί na-enye nkwupụta dị mfe banyere ọnụ ọgụgụ; “dị” bụ okwu Igbo dabara adaba n'usoro a.
- source_word: ἄνδρες
  choice: ndị ikom
  rationale: ἀνήρ na-ezo kpọmkwem ná ndị nwoke, ọ bụghị ná mmadụ niile; “ndị ikom” na-echekwa ọdịiche ahụ ebe a kpọkwara ụmụ nwanyị na ụmụaka iche.
- source_word: ὡσεὶ
  choice: ihe dị ka
  rationale: ὡσεί na-egosi na ọnụ ọgụgụ ahụ bụ atụmatụ, ya mere “ihe dị ka” bụ Igbo doro anya ma bụrụkwa nke a na-asụkarị.
- source_word: πεντακισχίλιοι
  choice: puku ... ise
  rationale: 'Nke a bụ ntụgharị nkịtị nke ọnụ ọgụgụ puku ise, tinyere aha ọ na-akọwa n''usoro Igbo: “puku ndị ikom ise.”'
- source_word: χωρὶς
  choice: ma a gụnyeghị
  rationale: χωρίς tinyere genitive na-egosi na ụmụ nwanyị na ụmụaka adịghị n'ọnụ ọgụgụ e kwuru. “Ma a gụnyeghị” na-eme ka nke a doo ndị na-agụ Igbo anya.
- source_word: γυναικῶν
  choice: ụmụ nwanyị
  rationale: N'ebe a γυνή pụtara ụmụ nwanyị n'ozuzu, ọ bụghị ndị nwunye, n'ihi na ọ dịghị mmekọrịta alụmdi na nwunye a na-ekwu maka ya.
- source_word: παιδίων
  choice: ụmụaka
  rationale: παιδίον pụtara nwa; “ụmụaka” bụ ọtụtụ ya n'Igbo ma ọ naghị ebelata ya ka ọ bụrụ naanị ụmụaka dị nnọọ nta.
theological_decisions:
- issue: Okwu ọnụ ọgụgụ metụtara nwoke kpọmkwem n'ime ìgwè mmadụ agwakọtara
  choice: Ịtụgharị ἄνδρες dịka “ndị ikom” ma debe na a gụnyeghị ụmụ nwanyị na ụmụaka.
  alternative: “ndị mmadụ” ma ọ bụ “mmadụ”
  rationale: Grik ahụ gụrụ ndị nwoke kpọmkwem, mesịa kpọọ ụmụ nwanyị na ụmụaka iche. Ịsị “ndị mmadụ” ga-ehichapụ ọdịiche okwu a ma mee ka nkọwa akụkọ na omenala dị n'amaokwu ahụ daa mbà.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Puku ndị ikom ise” bụ usoro Igbo ebumpụta ụwa; akara nkọwa [a] dị n'isiokwu ma na-enye ụzọ ọzọ e si asụ χωρίς.
