  naturalness: '“Ndị riri nri ahụ dị ihe dị ka puku ndị ikom ise” is understandable but not idiomatic Standard Igbo number phrasing: it makes “puku ndị ikom ise” sound structurally awkward. Putting “ndị ikom” with the subject and using “ruru ... puku ise” yields a more natural sentence.'
  terminology: “Ndị ikom,” “ụmụ nwanyị,” and “ụmụaka” are appropriate Standard Igbo terms and correctly retain the distinctions in the Greek.
  issues:
