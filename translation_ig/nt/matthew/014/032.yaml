id: MAT.14.32
reference: Matthew 14:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: ig
  text: Mgbe ha banyere n’ụgbọ mmiri ahụ[a], ifufe ahụ kwụsịrị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ nkịtị karị, “mgbe ha rigoro banye n’ụgbọ mmiri ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Mgbe
  rationale: N'Igbo, njikọ oge nke genitive absolute na-eme ka mmalite ahịrịokwu a bụrụ ihe dị mfe ma kwekọọ n'usoro akụkọ; a naghị atụgharị καί iche n'ihi na njikọ ahụ pụtara nke ọma n'ahịrịokwu oge a.
- source_word: ἀναβάντων αὐτῶν
  choice: ha banyere
  rationale: Genitive absolute a bụ nkebiokwu oge. Ọ bụ ezie na ἀναβαίνω pụtara n'ụzọ nkịtị ‘rịgoro’ ma ọ bụ ‘gbagoro,’ ‘banyere’ bụ okwu Igbo sitere n'okike mgbe a na-ekwu maka ịbanye n'ụgbọ mmiri.
- source_word: πλοῖον
  choice: ụgbọ mmiri
  rationale: N'ebe a, πλοῖον bụ ụgbọ ndị na-eso ụzọ ji aga n'Oké Osimiri Galili; ‘ụgbọ mmiri’ bụ okwu Igbo nkịtị, ọ dịghịkwa egosi nnukwu ship karịa ihe isi mmalite kwuru.
- source_word: ἐκόπασεν
  choice: kwụsịrị
  rationale: κοπάζω na-egosi na ifufe kwụsịrị ma ọ bụ dajụọ. ‘Kwụsịrị’ na-edobe nkenke na mmezu nke ngwaa aorist ahụ n'etinyeghị echiche usoro nwayọọ nwayọọ.
- source_word: ὁ ἄνεμος
  choice: ifufe ahụ
  rationale: ‘Ifufe ahụ’ na-asụgharị isiokwu ahụ na article ya n'ụzọ doro anya ma sitere n'okike n'Igbo.
theological_decisions:
- issue: Ihe akụkọ a na-egosi banyere ikike Jizọs n'ahụ ihe e kere eke
  choice: 'Ikwu ihe mere n''ụzọ kwụ ọtọ: ifufe ahụ kwụsịrị mgbe ha banyere n''ụgbọ mmiri.'
  alternative: Itinye okwu nkọwa nke ga-ekwusi ike na nke a bụ ngosipụta ebube nke ikike Jizọs.
  rationale: Ihe ọ pụtara n'ihe gbasara okwukwe pụtara n'ọnọdụ akụkọ ahụ, ma Grik anaghị etinye nkọwa ahụ n'amaokwu a. Ya mere, nsụgharị ahụ anaghị agbakwunye nkọwa okpukpe.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. E jiri ‘ụgbọ mmiri’ na ‘ifufe ahụ kwụsịrị’ mee ka okwu ahụ bụrụ nke mmadụ nkịtị ga-aghọta, ebe ihe odide ala ala peeji na-echekwa nkọwa nkịtị nke ἀναβαίνω.
