  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: ig
  text: Ọ gwara ndị na-ejere ya ozi, sị, “Onye a bụ Jọn onye na-eme baptizim. A kpọlitere ya site n’etiti ndị nwụrụ anwụ, ọ bụkwa ya mere ike ndị a[a] na-arụ ọrụ n’ime ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ike ọrụ ebube ndị a,” ma ọ bụ, n’ụzọ nkọwa karịa, “ọrụ ebube ndị a.” Okwu Grik bụ “ike” (αἱ δυνάμεις), nke na-ezo aka n’ike karịrị nke mmadụ nke na-apụta ìhè n’ọrụ dị ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: ndị na-ejere ya ozi
  rationale: N’ọnọdụ a, παῖς na-ezo aka ná ndị na-ejere Herọd ozi n’ụlọ ya ma ọ bụ n’obí ya. Okwu a na-egosi mmekọrịta ha na ya n’etinyeghị ọkwa a kapịrị ọnụ n’ihe odide ahụ.
- source_word: ὁ βαπτιστής
  choice: Onye Na-eme Baptizim
  rationale: Nke a na-egosipụta ọrụ Jọn nke ọma n’Igbo nke oge a ma na-edobe ya dị ka aha e ji amata ya.
- source_word: ἠγέρθη
  choice: E ... kpọlite ya
  rationale: Ụdị ngwaa Grik bụ passive; nsụgharị a na-edobe na e mere ka Jọn bilie kama ikwu na o ji aka ya bilie.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: n’etiti ndị nwụrụ anwụ
  rationale: Nke a na-egosipụta echiche nke isi n’etiti ndị nwụrụ anwụ pụta, ma bụrụkwa okwu doro anya ma dị mma n’Igbo.
- source_word: διὰ τοῦτο
  choice: ọ bụkwa ya mere
  rationale: 'Ọ na-edobe njikọ ihe kpatara ihe: Herọd chere na mbilite Jọn bụ ihe mere ike ndị ahụ ji arụ ọrụ n’ime ya.'
- source_word: αἱ δυνάμεις
  choice: ike ndị a
  rationale: A hapụrụ δύναμεις dị ka ‘ike’ kama ịgbanwe ya ozugbo ka ọ bụrụ ‘ọrụ ebube,’ ka obosara na ntakịrị mgbagwoju anya nke okwu Grik dịgide.
- source_word: ἐνεργοῦσιν
  choice: ji arụ ọrụ
  rationale: Nke a na-egosi ike ndị ahụ dị ka ihe na-arụsi ọrụ ike ma na-eweta nsonaazụ.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Nke a na-agbaso ἐν nke ọma, na-egosi onye ahụ dị ka ebe ike ndị ahụ na-arụ ọrụ, n’agbanweghị ya ka ọ bụrụ ‘site n’aka ya.’
theological_decisions:
- issue: Ụdị mbilite Jọn
  choice: E siwo n’etiti ndị nwụrụ anwụ kpọlite ya
  alternative: O siwo n’etiti ndị nwụrụ anwụ bilie
  rationale: A họọrọ okwu passive iji kwekọọ na ἠγέρθη, n’enweghị ikwu kpọmkwem onye kpọlitere ya ma ọ bụ na Jọn kpọlitere onwe ya.
- issue: Ihe αἱ δυνάμεις pụtara n’ọnọdụ a
  choice: ike ndị a ji arụ ọrụ n’ime ya
  alternative: ọrụ ebube ndị a na-eme site n’aka ya
  rationale: Okwu ahụ nwere ike ịpụta ike karịrị nke mmadụ nke na-apụta ìhè n’ọrụ dị ike, ma isi ihe odide ahụ na-edobe ‘ike’ ka a ghara ịkọwa ya karịa ihe Grik kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “ndị na-ejere ya ozi” kama okwu nwere ike ịkọwa ha dị ka ụmụaka ma ọ bụ ndị nọ n’ọkwa obí a kapịrị ọnụ. E tinyere akara nkọwa [a] n’akụkụ “ike ndị a,” bụ okwu nkọwa ahụ metụtara.
