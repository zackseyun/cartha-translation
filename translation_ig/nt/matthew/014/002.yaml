  to: Ọ gwara ndị na-ejere ya ozi, sị, “Onye a bụ Jọn onye na-eme baptizim. A kpọlitere ya site n’etiti ndị nwụrụ anwụ, ọ bụkwa ya mere ike ndị a[a] na-arụ ọrụ n’ime ya.”
  rationale: The revision retains the draft’s appropriate rendering of παῖς as household servants/attendants, preserves the passive ambiguity of ἠγέρθη, and keeps δυνάμεις as “ike” in the text. It changes the verb construction so that “ike ndị a” unambiguously functions as the subject that is active, as in the Greek. The footnote is adjusted to give natural Igbo alternatives without treating “miracles” as the sole meaning.
