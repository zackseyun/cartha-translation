  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: ig
  text: Ma ụgbọ mmiri ahụ anọọlarị ọtụtụ stadia site n’ala[a][b], ebili mmiri na-akụ ya n’ike[c], n’ihi na ifufe ahụ na-efe ya ihu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “site n’ụsọ mmiri.” N’asụsụ Grik, e dere “site n’ala.”
    reason: lexical_alternative
  - marker: b
    text: Otu stadion bụ ihe e ji atụ ogologo ụzọ n’oge ochie, ihe dị ka mita 185.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsị, “ebili mmiri na-akụgbu ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: ụgbọ mmiri
  rationale: N’ọnọdụ njem n’Ọdọ Mmiri Galili, “ụgbọ mmiri” bụ okwu Igbo doro anya ma kwekọọ n’ụgbọ e ji agafe mmiri n’akụkọ a.
- source_word: ἤδη
  choice: adịlarị
  rationale: Ụdị a na-egosi na ọnọdụ ahụ amalitela tupu oge a n’akụkọ ahụ, dị ka ἤδη si eme.
- source_word: σταδίους πολλοὺς
  choice: ọtụtụ stadia
  rationale: E debere aha ihe atụ anya oge ochie ahụ iji ghara ime ka okwu Grik ahụ ghọọ naanị “ebe dị anya.” Ihe odide ala peeji kọwara nha ya.
- source_word: ἀπὸ τῆς γῆς
  choice: site n’ala
  rationale: Nke a na-esochi γῆ n’ụzọ kwụ ọtọ ma na-egosi ọdịiche dị n’etiti ala na mmiri; “site n’ụsọ mmiri” bụkwa nghọta dabara n’ọnọdụ a ma e debere ya n’ala peeji.
- source_word: ἀπεῖχεν
  choice: dị ... site na
  rationale: N’Igbo, nhazi “dị ọtụtụ stadia site na” na-ekwupụta ịdị anya n’ụzọ dị mfe ma kwekọọ n’ọrụ ἀπέχω ebe a.
- source_word: βασανιζόμενον
  choice: na-akụgharịkwa ya n’ike
  rationale: N’ọnọdụ oke mmiri a, okwu ahụ na-egosi na ebili mmiri nọ na-akụ ụgbọ ahụ ike. Nhọrọ a na-egosipụta ike ahụ n’asụsụ Igbo nkịtị n’etinyeghị echiche nke ahụhụ uche.
- source_word: ὑπὸ τῶν κυμάτων
  choice: ebili mmiri
  rationale: E mere ebili mmiri onye na-eme ihe n’ahịrịokwu Igbo ahụ, nke na-enye otu ihe ahụ usoro Grik nke na-ekwu na ọ bụ ebili mmiri na-akpa ụgbọ ahụ.
- source_word: ἐναντίος
  choice: na-emegide ya
  rationale: Nke a na-egosi na ifufe na-efe ihu n’ụzọ megidere njem ụgbọ ahụ, ma “ya” na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi mgbanwe na ntakịrị ọdịiche dị n’etiti ọnọdụ Jizọs na nke ụgbọ mmiri ahụ.
- source_word: γάρ
  choice: n’ihi na
  rationale: Nkebiokwu a na-ewebata ihe kpatara ebili mmiri ji na-akụgharị ụgbọ ahụ n’ike.
theological_decisions: []
translation_notes:
