- from: E wetara isi ya n’elu efere[a], nyefee ya nwa agbọghọ ahụ; o wee wegara ya nne ya.
  to: E wetara isi ya n’elu efere sara mbara[a], e nyekwaa nwa agbọghọ ahụ ya; ọ wee bugara nne ya isi ahụ.
  rationale: The revision makes the second passive event unambiguously past narrative Igbo, specifies the serving platter sense of πίναξ, and clarifies that the girl carried the head to her mother. It preserves the Greek’s sequence and direct description.
