  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: ig
  text: E wetara isi ya n’elu efere sara mbara[a], e nyekwaa nwa agbọghọ ahụ ya; ọ wee bugara nne ya isi ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’elu tray” ma ọ bụ “n’elu efere e ji enye nri.” Okwu Grik πίναξ na-ekwu maka efere sara mbara ma ọ bụ tray e ji eburu ma ọ bụ enye nri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: E wetara
  rationale: A na-eji “e” na Igbo egosi onye a na-akpọghị aha mere ihe ahụ; nke a na-edobe nghọta nke aorist passive φέρω ma na-ada nke ọma n’akụkọ.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: isi ya
  rationale: Nke a bụ ntụgharị kpọmkwem na nke doro anya; ederede Grik ejighị okwu mkpuchi dochie “isi.”
- source_word: ἐπὶ πίνακι
  choice: n’elu efere
  rationale: πίναξ bụ efere sara mbara ma ọ bụ tray e ji eburu ma na-enye ihe; “n’elu efere” bụ okwu Igbo nkịtị nke na-egosi ihe e bu isi ahụ n’elu ya.
- source_word: ἐδόθη
  choice: nyefee ya
  rationale: “Nyefee ya” na-egosi na e nyere nwa agbọghọ ahụ isi ahụ, ma na-aga nke ọma n’usoro ahịrịokwu Igbo mgbe “E wetara” gasịrị.
- source_word: τῷ κορασίῳ
  choice: nwa agbọghọ ahụ
  rationale: κοράσιον na-ezo aka n’ebe nwa agbọghọ nọ; “ahụ” na-eme ka o doo anya na ọ bụ onye ahụ a kpọtụrụla aha n’akụkọ.
- source_word: ἤνεγκεν
  choice: o wee wegara ya
  rationale: Aorist active φέρω na-egosi na nwa agbọghọ ahụ buuru ihe ahụ gakwuru nne ya. “Wegara” na-egosi ebe e bugara ya, “wee” na-edobe usoro ihe ndị mere, ebe “ya” na-anọchi isi ahụ.
- source_word: τῇ μητρὶ αὐτῆς
  choice: nne ya
  rationale: Nke a na-enye dative phrase ahụ n’ụzọ Igbo nkịtị; “ya” na-ezo aka n’ebe nwa agbọghọ ahụ nọ.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe ike dị n’ederede ahụ n’enweghị okwu mkpuchi. Akara nkọwa [a] dị n’akụkụ “efere,” bụ okwu nkọwa ahụ metụtara.
