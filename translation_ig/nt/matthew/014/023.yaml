- from: Mgbe ọ gbasasịrị ìgwè mmadụ ahụ, ọ rịgoro n’elu ugwu naanị ya ikpe ekpere.[a] Mgbe chi jiri, ọ nọ naanị ya n’ebe ahụ.
  to: Mgbe ọ zipụsịrị ìgwè mmadụ ahụ ka ha laa, ọ rịgoro n’ugwu naanị ya[a] ikpe ekpere. Mgbe mgbede ruru, ọ nọ naanị ya n’ebe ahụ.
  rationale: The revision uses a contextually precise equivalent for ἀπολύσας, preserves the ascent to the mountain and the purpose of prayer, and keeps the deliberate repetition of solitude in κατ’ ἰδίαν and μόνος. The footnote is recast as a lexical alternative and anchored to the expression it explains.
