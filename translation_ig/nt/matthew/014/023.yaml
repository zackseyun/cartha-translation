  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: ig
  text: Mgbe ọ zipụsịrị ìgwè mmadụ ahụ ka ha laa, ọ rịgoro n’ugwu naanị ya[a] ikpe ekpere. Mgbe mgbede ruru, ọ nọ naanị ya n’ebe ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị κατ’ ἰδίαν dịka “n’ebe nzuzo” ma ọ bụ “na nzuzo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσας
  choice: Mgbe ọ gbasasịrị
  rationale: Aorist participle na-egosi ihe mere tupu ngwaa isi; usoro ‘Mgbe ọ ...sịrị’ na-egosi nke a n’Igbo n'ụzọ doro anya. ‘Gbasasịrị’ ebe a pụtara na o zipụrụ ndị mmadụ ka ha lawa.
- source_word: τοὺς ὄχλους
  choice: ìgwè mmadụ ahụ
  rationale: Ọ na-egosi ọtụtụ ndị gbakọrọ ọnụ; ‘ìgwè mmadụ’ bụ okwu Igbo nkịtị ma kwekọọ n’echiche ahụ.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: ọ rịgoro n’elu ugwu
  rationale: ‘Rịgoro’ na-echekwa mmegharị ịrị elu, ebe ‘n’elu ugwu’ na-egosi ebe ọ gara.
- source_word: κατ’ ἰδίαν
  choice: naanị ya
  rationale: Nkebiokwu a nwere ike ịpụta ịnọ iche ma ọ bụ ịnọ naanị onwe ya; n’ọnọdụ a, ‘naanị ya’ bụ Igbo eke ma na-ejikọta nke ọma na naanị ya e mesịrị.
- source_word: προσεύξασθαι
  choice: ikpe ekpere
  rationale: Nke a bụ infinitive nke nzube, ya mere ‘ikpe ekpere’ na-egosi ihe mere o ji rịgoro ugwu.
- source_word: ὀψίας δὲ γενομένης
  choice: Mgbe chi jiri
  rationale: Nke a bụ genitive absolute nke na-egosi oge; ‘Mgbe chi jiri’ bụ ụzọ Igbo sitere n’okike isi kwuo na mgbede eruola.
- source_word: μόνος ἦν ἐκεῖ
  choice: ọ nọ naanị ya n’ebe ahụ
  rationale: ‘Nọ’ dabara n’Igbo maka ọnọdụ mmadụ nọ n’otu ebe, ‘naanị ya’ na-echekwa nkwusiri ike nke μόνος, ‘n’ebe ahụ’ na-anọchi ἐκεῖ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. E debere ọdịiche dị n’etiti κατ’ ἰδίαν (‘naanị ya’ ma ọ bụ ‘n’ebe nzuzo’) na μόνος (‘naanị ya’) site n’ihe odide na nkọwa ala peeji.
