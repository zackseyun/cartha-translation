  verdict: revise
  source_fidelity: The draft accurately conveys the immediate action, Jesus’ extending his hand and taking hold of Peter, the direct rebuke concerning limited faith, and the question about doubt/wavering. The lexical alternative appropriately preserves the wider sense of ἐδίστασας.
  naturalness: 'A safe grammatical correction is needed: “jide ya” is not the appropriate completed narrative form following “setịrị”; “jidere ya” gives the intended past action. “Gị onye okwukwe nta” is a more idiomatic and concise Standard Igbo vocative than “Gị onye okwukwe gị dị nta.”'
  terminology: “Jizọs” and “okwukwe” are standard, suitable biblical Igbo terms. “Obi abụọ” is a clear rendering for doubt; the footnote retains the possible nuance of wavering without importing an interpretive conclusion.
  issues:
