    issue: 'Narrative verb form: “jide ya”'
    rationale: In this past narrative sequence, ἐπελάβετο (“took hold of him”) should be rendered with the completed form “jidere ya,” not “jide ya.”
  - severity: low
    issue: Awkward vocative wording
    rationale: “Gị onye okwukwe nta” naturally expresses Ὀλιγόπιστε (‘you of little faith’) while retaining the contrast with total lack of faith.
  - severity: low
    issue: Footnote’s ‘ịma jijiji n’obi’ is overly specific
    rationale: The Greek διστάζω denotes doubt, hesitation, or wavering. “Ịma jijiji n’obi” can suggest fear or trembling rather than the verb’s core semantic range. A neutral alternative better preserves the ambiguity.
