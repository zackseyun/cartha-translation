source:
  edition: SBLGNT
  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: ig
  text: Ozugbo ahụ, Jizọs setịrị aka ya, jidere ya, sị ya, “Gị onye okwukwe nta, gịnị mere i ji nwee obi abụọ[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gịnị mere i ji laa azụ?” Okwu Grik ahụ pụkwara ịpụta inwe obi abụọ, ịla azụ, ma ọ bụ ịmagharị, ọ bụghị naanị inwe obi abụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Ozugbo ahụ
  rationale: Na-egosi na Jizọs mere ihe ahụ n’egbughị oge ma na-echekwa ọsọ akụkọ ahụ.
- source_word: δὲ
  choice: —
  rationale: A hapụrụ njikọ a n’enweghị okwu Igbo pụrụ iche n’ihi na usoro ahịrịokwu ahụ egosilarị njikọ na ihe bu ya ụzọ; itinye “ma” nwere ike ime ka mmegide ahụ sie ike karịa nke Grik.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: setịrị aka ya
  rationale: Nke a bụ okwu Igbo doro anya ma dị ndụ nke na-echekwa ihe omume ahụ kpọmkwem.
- source_word: ἐπελάβετο αὐτοῦ
  choice: jide ya
  rationale: Na-egosi na Jizọs jidere Pita ka ọ ghara ịda, n’etinyeghị nkọwa na-adịghị n’ederede.
- source_word: λέγει αὐτῷ
  choice: sị ya
  rationale: Oge gara aga dabara n’akụkọ Igbo nke ọma, ebe “sị ya” na-enye okwu ahụ kpọmkwem ma dịkwa nkenke.
- source_word: Ὀλιγόπιστε
  choice: Gị onye okwukwe gị dị nta
  rationale: Na-echekwa ụdị ịkpọ onye ahụ okwu ozugbo na echiche nke okwukwe na-ezughị ezu, ọ bụghị enweghị okwukwe kpamkpam.
- source_word: εἰς τί
  choice: gịnị mere
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi jụọ ihe kpatara ihe.
- source_word: ἐδίστασας
  choice: i ji nwee obi abụọ
  rationale: Na-enye isi echiche nke inwe obi abụọ n’Igbo doro anya, ebe ihe odide ala ala na-echekwa echiche ọzọ nke ịla azụ ma ọ bụ ịma jijiji n’obi.
theological_decisions:
- issue: Nsụgharị Ὀλιγόπιστε n’ihe gbasara πίστις
  choice: Gị onye okwukwe gị dị nta
  alternative: Gị onye nwere obere okwukwe
  rationale: Nhọrọ a na-edobe “okwukwe” dị ka isi okwu ma na-egosi na okwukwe Pita ezughị ezu; ọ naghị ekwu na o nweghị okwukwe ma ọlị.
- issue: Nuance nke ἐδίστασας
  choice: i ji nwee obi abụọ
  alternative: i ji laa azụ n’obi
  rationale: Okwu Grik nwere ike ịpụta inwe obi abụọ, ịla azụ, ma ọ bụ ịma jijiji n’obi. Isi ederede ji okwu Igbo kacha doo anya, ebe ihe odide ala ala na-echekwa obosara ihe ọ pụtara.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe nghọta ma nwee nsọpụrụ. E ji “Jizọs” na “okwukwe” dịka ụdị okwu ndị a na-ahụkarị n’Igbo. Usoro ngwaa “setịrị … jide … sị” na-eme ka akụkọ ahụ gaa were were n’ụzọ ebumpụta ụwa.
