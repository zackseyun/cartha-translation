translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro akụkọ Grik, ebe ihe odide ala ala peeji na-echekwa ụzọ ndị ọzọ e nwere isi ghọta akpaokwu oge na ebe ahụ.
