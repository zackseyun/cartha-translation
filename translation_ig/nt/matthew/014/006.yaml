  to: Ma mgbe emume ụbọchị ọmụmụ Herọd ruru[a], ada Herọdias gbara egwu n’etiti[b], wee masị Herọd.
  rationale: The revision solely removes the demonstrative subject “nke a” so that the daughter remains the explicit subject of both “gbara egwu” and “masị,” as in the Greek. The temporal expression, names, register, and both footnote anchors are retained.
