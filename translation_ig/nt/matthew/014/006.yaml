    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’etiti ha.” O yiri ka ihe a pụtara bụ na ọ gbara egwu n’etiti ndị bịara emume ahụ.
    reason: lexical_alternative
  revision_rationale: The revision solely removes the demonstrative subject “nke a” so that the daughter remains the explicit subject of both “gbara egwu” and “masị,” as in the Greek. The temporal expression, names, register, and both footnote anchors are retained.
