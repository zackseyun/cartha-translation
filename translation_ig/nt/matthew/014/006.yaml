id: MAT.14.6
reference: Matthew 14:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: ig
  text: Ma mgbe emume ụbọchị ọmụmụ Herọd ruru[a], ada Herọdias gbara egwu n’etiti[b], wee masị Herọd.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mgbe ụbọchị ọmụmụ Herọd ruru” ma ọ bụ “n’emume ụbọchị ọmụmụ Herọd.” Okwu Grik na-ekwu banyere oge e ji mee emume ụbọchị ọmụmụ Herọd.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’etiti ha.” O yiri ka ihe a pụtara bụ na ọ gbara egwu n’etiti ndị bịara emume ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: mgbe emume ụbọchị ọmụmụ Herọd ruru
  rationale: Akpaokwu a na-egosi mgbe emume ncheta ụbọchị ọmụmụ Herọd mere; “ruru” na-enye echiche oge ahụ bịarutere n’Igbo dị mma.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi ntughari akụkọ ahụ na obere ọdịiche dị n’ihe bu ụzọ.
- source_word: ὠρχήσατο
  choice: gbara egwu
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo na ọ gbara egwu, n’etinyeghị nkọwa ọzọ na-adịghị na Grik.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: ada Herọdias
  rationale: Ọ na-egosi mmekọrịta nne na nwaanyị ahụ kpọmkwem, ma ọ naghị etinye aha nwaanyị ahụ nke akụkụ Akwụkwọ Nsọ a na-akpọghị.
- source_word: ἐν τῷ μέσῳ
  choice: n’etiti
  rationale: Nke a na-edobe ihe Grik kwuru n’enweghị ịkọwapụta kpọmkwem ndị ọ nọ n’etiti ha; ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ n’etiti ndị bịara emume ahụ.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: nke a wee masị Herọd
  rationale: “Masị Herọd” na-egosipụta ihe ἀρέσκω pụtara n’Igbo eke; “nke a” na-eme ka njikọ ya na ịgba egwu ahụ doo anya.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: Herọd
  rationale: Nke a bụ nsụgharị mkpụrụokwu aha ahụ kwekọrọ n’ụdị aha ndị a na-ejikarị n’Igbo.
