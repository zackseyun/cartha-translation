id: MAT.14.27
reference: Matthew 14:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: ig
  text: Ma ozugbo ahụ, Jizọs gwara ha okwu, sị, “Obi sie unu ike; ọ bụ m.[a] Unu atụla egwu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “Abụ m.” Okwu Grik a nwere ike ịbụ naanị ụzọ o si mee ka ha mata na ọ bụ ya n’ebe a, ọ bụ ezie na ụfọdụ ndị na-anụkwa n’ime ya ihe yiri okwu Chineke ji kọwaa onwe ya.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: ozugbo ahụ
  rationale: Ọ na-egosipụta na Jizọs gwara ha okwu n’egbughị oge; nke a bụ okwu Igbo dị ugbu a ma doo anya.
- source_word: δὲ
  choice: Ma
  rationale: 'Ọ na-egosi obere mgbanwe na ihe merenụ: ụjọ jidere ndị na-eso ụzọ ya, ma Jizọs zara ha ozugbo.'
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: Jizọs gwara ha okwu, sị
  rationale: Nke a na-ejikọta ngwaa na participle Grik n’ụzọ Igbo sitere n’okike, ma na-edobe ma onye kwuru okwu ma ndị ọ gwara ya.
- source_word: Θαρσεῖτε
  choice: Obi sie unu ike
  rationale: Nke a bụ agbamume e nyere ọtụtụ mmadụ ka ha nwee obi ike; ọ bụ okwu Igbo doro anya ma bụrụkwa nke sitere n’okike.
- source_word: ἐγώ εἰμι
  choice: ọ bụ m
  rationale: N’ọnọdụ a, Jizọs na-eme ka ndị na-eso ụzọ ya mata na ọ bụ ya. Nsụgharị a na-enye nghọta ahụ n’Igbo sitere n’okike, ebe nkọwa ala peeji na-edobe nsụgharị nkịtị karị na ihe ọ pụrụ ịpụta.
- source_word: μὴ φοβεῖσθε
  choice: Unu atụla egwu
  rationale: Ọ bụ iwu a gwara ọtụtụ mmadụ ka ha ghara ịtụ egwu, nke a na-ekwukwa ya n’Igbo doro anya ma dị ugbu a.
theological_decisions:
- issue: Ma ἐγώ εἰμι ọ bụ naanị ụzọ Jizọs si mee ka ha mata onye ọ bụ, ka ọ̀ bụkwa okwu nwere ike ime ka mmadụ cheta aha Chineke ji kọwaa onwe ya
  choice: E dere “ọ bụ m” n’ahịrịokwu bụ isi iji gosi na Jizọs na-eme ka ndị na-eso ụzọ ya mata na ọ bụ ya.
  alternative: “Abụ m.”
  rationale: Ọnọdụ akụkọ ahụ na-akwado nghọta nke ime ka ha mata onye na-abịakwute ha bụ, ma okwu Grik ahụ nwekwara ike ịkpalite echiche banyere ụzọ Chineke si kọwaa onwe ya. Nkọwa ala peeji na-edobe ohere abụọ ahụ n’enweghị ịmanye otu nkọwa.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù, ma dị mfe nghọta mee ihe. “Obi sie unu ike” na “Unu atụla egwu” na-edobe ụda agbamume na nkasi obi e nyere ndị na-eso ụzọ ahụ.
