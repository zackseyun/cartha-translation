lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: N’oge ahụ
  rationale: Nke a bụ ụzọ Igbo dị ugbu a si ekwu akara oge ahụ n’ụzọ doro anya ma dịkwa mma n’ọnụ.
- source_word: ἤκουσεν
  choice: nụrụ
  rationale: Nke a na-egosipụta kpọmkwem ihe aorist ἀκούω pụtara n’ebe a, n’etinyeghị nkọwa ọzọ dịka ‘ọ matara.’
- source_word: Ἡρῴδης
  choice: Herọd
  rationale: Nke a bụ nsụgharị mkpụrụokwu aha ahụ kwekọrọ n’usoro ụda na mkpopụta Igbo.
- source_word: ὁ τετραάρχης
  choice: onye na-achị otu mpaghara
  rationale: Nke a na-eme ka ndị na-agụ Igbo nke oge a ghọta ọrụ ọchịchị ahụ, ebe nkọwa ala ala peeji na-edobe aha ọkwa ndọrọ ndọrọ ọchịchị ahụ na izi ezi akụkọ ihe mere eme ya.
- source_word: τὴν ἀκοὴν
  choice: akụkọ
  rationale: N’ebe a, ἀκοή pụtara ihe mmadụ nụrụ—akụkọ ma ọ bụ ozi a na-akọ—ọ bụghị ikike ịnụ ihe.
- source_word: Ἰησοῦ
  choice: banyere Jizọs
  rationale: Genitive a na-egosi onye akụkọ ahụ gbasara; ‘banyere’ bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji eme ihe ugbu a.
