translation_notes:
  register: Ejiri Igbo Izugbe dị ugbu a, nke dị mfe nghọta ma nwee ugwu. A kọwara ọkwa tetrak n’ahịrị isi n’ụzọ onye nkịtị ga-aghọta, ma debe nkọwa aha ọkwa ahụ n’ala ala peeji. Rịkọm nke ikpeazụ na-egosi na ahịrịokwu ahụ gara n’ihu n’amaokwu na-esote.
