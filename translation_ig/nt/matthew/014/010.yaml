revisions:
- from: O wee zipụ ndị mmadụ ka ha gaa gbupụ Jọn isi n’ụlọ mkpọrọ.[a]
  to: O wee zipụ ka e gbupụ Jọn isi n’ụlọ mkpọrọ.[a]
  rationale: The revision removes the unstated plural agents while retaining the narrative implication that Herod’s sending resulted in John’s execution. The footnote now reflects the Greek aorist participle without adding an object to “sent.”
