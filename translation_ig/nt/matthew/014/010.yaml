  yaml_path: translation/nt/matthew/014/010.yaml
  text: And he sent and beheaded John in the prison[a].
translation:
  language: ig
  text: O wee zipụ ka e gbupụ Jọn isi n’ụlọ mkpọrọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’usoro okwu kwekọrọ nnọọ na Grik: “Mgbe o zigasịrị, e gbupụrụ Jọn isi n’ụlọ mkpọrọ.” N’asụsụ Grik, e ji participle aorist nke πέμπω (“izipu”) tupu ngwaa bụ isi, ἀπεκεφάλισεν (“gbupụrụ isi”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: O wee
  rationale: Njikọ a na-aga n’ihu n’akụkọ ahụ; “O wee” bụ ụzọ Igbo si egosi usoro ihe mere n’enweghị ịtinye nkọwa ọzọ.
- source_word: πέμψας
  choice: zipụ ndị mmadụ ka ha gaa
  rationale: Nke a bụ aorist participle nke πέμπω. Nsụgharị a na-egosi na Herọd zipụrụ ndị ga-eme ihe ahụ, kama ime ka ọ dị ka ọ bụ ya ji aka ya mee ya.
- source_word: ἀπεκεφάλισεν
  choice: gbupụ Jọn isi
  rationale: ἀποκεφαλίζω pụtara kpọmkwem igbupụ mmadụ isi. E debere omume ahụ n’okpuru isiokwu nke ngwaa Grik, ma usoro ‘zipụ ndị mmadụ’ na-egosi na e mere ya site n’aka ndị o zipụrụ.
- source_word: τὸν Ἰωάννην
  choice: Jọn
  rationale: Aha ahụ naanị ya dị n’amaokwu Grik, ọnọdụ gbara ya gburugburu emewokwa ka a mara Jọn a na-ekwu banyere ya.
- source_word: ἐν τῇ φυλακῇ
  choice: n’ụlọ mkpọrọ
  rationale: φυλακή ebe a bụ ebe e ji mmadụ kpọchie; ‘ụlọ mkpọrọ’ bụ okwu Igbo doro anya ma na-adị ugbu a maka ebe ahụ.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke dị mfe, dị ugwu, ma bụrụ nke ndị nkịtị ga-aghọta. ‘Zipụ ndị mmadụ ka ha gaa’ na-eme ka ọrụ πέμψας doo anya n’Igbo, ebe a na-edobe ụzọ Grik si kwuo na ọ bụ Herọd kpatara igbu Jọn.
