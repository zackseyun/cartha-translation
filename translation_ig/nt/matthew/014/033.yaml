base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: ig
  text: Mgbe ahụ, ndị nọ n’ime ụgbọ ahụ fere ya ofufe[a], na-asị, “N’ezie, ị bụ Ọkpara Chineke.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kpọrọ isiala nye ya” ma ọ bụ “gosi ya nsọpụrụ.” Okwu Grik ahụ pụrụ ịpụta nsọpụrụ e gosiri site n’ikpere ala ma ọ bụ ịkpọ isiala; ma n’ebe a, ihe gbara ya gburugburu na-akwado nghọta nke ife ofufe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Nwa Chineke.” Ọ bụ ezie na n’okwu Grik e nweghị article n’ihu “Chineke,” nkebiokwu a n’ebe a na-arụ ọrụ dị ka aha nsọpụrụ, ọ bụghị n’echiche nke “otu nwa chi.”
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mgbe ahụ, ndị
  rationale: δέ bụ njikọ dị nro; “Mgbe ahụ” na-egosi usoro akụkọ n’Igbo n’enweghị ime ka ọ bụrụ nnukwu ntụnyere.
- source_word: ἐν τῷ πλοίῳ
  choice: nọ n’ime ụgbọ ahụ
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụ nke e ji eme ihe maka ndị nọ n’ime ụgbọ mmiri e kwuburu okwu ya.
- source_word: προσεκύνησαν αὐτῷ
  choice: kpọrọ isiala nye ya
  rationale: “Ịkpọ isiala nye” nwere ike igosi ife ofufe ma na-echekwakwa ihe omume nke ikpere ala ma ọ bụ ịkpọ isiala nke προσκυνέω nwere ike ịpụta; ihe gbara ya gburugburu na-eme ka nsọpụrụ a sie ike.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-echekwa ọdịdị participle Grik ma na-ada nke ọma n’akụkọ Igbo.
- source_word: Ἀληθῶς
  choice: N’ezie
  rationale: Ọ bụ nkwenye siri ike, dị ùgwù, nke dabara n’okwu nkwupụta a.
- source_word: θεοῦ υἱὸς
  choice: Ọkpara Chineke
  rationale: N’ebe a okwu ahụ na-arụ ọrụ dị ka aha nsọpụrụ akọwapụtara, ọ bụghị naanị “otu nwa chi”; “Ọkpara Chineke” bụ Igbo eke ma doo anya.
- source_word: εἶ
  choice: ị bụ
  rationale: Nke a bụ usoro Igbo nkịtị maka copula onye nke abụọ n’okwu a na-agwa mmadụ kpọmkwem.
theological_decisions:
- issue: Ike okwu προσκυνέω mgbe a na-eme ya nye Jizọs
  choice: kpọrọ isiala nye ya
  alternative: fee ya ofufe
  rationale: Nhọrọ a na-edobe ma omume ahụ nke ịkpọ isiala ma ohere ọ pụtara ife ofufe. N’ihi ikike Jizọs gosiri n’elu mmiri na nkwupụta sochiri ya, ihe gbara ya gburugburu na-akwado nghọta nke ofufe; e tinyere nke ahụ n’ala peeji kama imechi obosara okwu Grik n’ahịrị isi.
- issue: Ma θεοῦ υἱὸς ọ̀ bụ aha akọwapụtara
  choice: Ọkpara Chineke
  alternative: otu nwa chi
  rationale: Enweghị article n’ihu θεοῦ anaghị eme ka nkebiokwu ahụ bụrụ indefinite. N’ọnọdụ nkwupụta a n’akwụkwọ Matiu, ọ na-arụ ọrụ dị ka aha nsọpụrụ akọwapụtara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ụgbọ” dabara n’akụkọ a; “ịkpọ isiala nye” na-echekwa mgbagwoju pụtara nke προσκυνέω, ebe ala peeji na-akọwa na ọnọdụ a na-akwado “ife ofufe.” Akara ala peeji [a] na [b] dị n’ahịrị isi.
