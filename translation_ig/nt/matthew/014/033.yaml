revisions:
- from: Mgbe ahụ, ndị nọ n’ime ụgbọ ahụ kpọrọ isiala nye ya[a], na-asị, “N’ezie, ị bụ Ọkpara Chineke.”[b]
  to: Mgbe ahụ, ndị nọ n’ime ụgbọ ahụ fere ya ofufe[a], na-asị, “N’ezie, ị bụ Ọkpara Chineke.”[b]
  rationale: The principal correction restores the contextual force of προσεκύνησαν with “fere ya ofufe,” in agreement with the source-contextual reading reflected in the English audit trail. The footnote preserves the legitimate homage/bowing semantic range. The title “Ọkpara Chineke” is retained as established Standard Igbo usage, while its note is made more accurate and idiomatic.
