  to: Mgbe mgbede ruru, ndị na-eso ụzọ ahụ bịakwutere ya, sị, “Ebe a tọgbọrọ n’efu[a], oge agaala[b]. Zipụ ìgwè mmadụ ahụ ka ha gaa n’obodo nta zụtara onwe ha nri.”
  rationale: 'The revision removes the unsupported “dị iche iche,” improves the idiomatic rendering of the dismissal request, and preserves the source’s sequence and purpose: send the crowd away so that they may go to villages and buy food for themselves. Footnote anchors correctly remain on the phrases they explain.'
