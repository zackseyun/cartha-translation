id: MAT.14.15
reference: Matthew 14:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: ig
  text: Mgbe mgbede ruru, ndị na-eso ụzọ ahụ bịakwutere ya, sị, “Ebe a tọgbọrọ n’efu[a], oge agaala[b]. Zipụ ìgwè mmadụ ahụ ka ha gaa n’obodo nta zụtara onwe ha nri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ebe a bụ ebe mmadụ na-ebighị.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “Oge ahụ agafeela.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Mgbe o ruru ná mgbede
  rationale: Nke a na-egosi mgbanwe oge n’akụkọ ahụ. Nsụgharị a bụ Igbo nkịtị ma doo anya na ọ bụ mgbede, ebe δέ na-aga n’ihu n’akụkọ ahụ n’enweghị mkpa itinye okwu ọzọ.
- source_word: προσῆλθον αὐτῷ
  choice: bịakwutere ya
  rationale: Ọ na-egosi na ha bịara nso n’ebe ọ nọ, n’ụzọ dị mkpirikpi ma bụrụkwa Igbo e ji eme ihe.
- source_word: οἱ μαθηταὶ
  choice: ndị na-eso ụzọ ahụ
  rationale: Mkpụrụokwu ahụ na-ezo aka n’ìgwè ndị a maralarị n’akụkọ; “ahụ” na-egosipụta njirimara ahụ n’Igbo n’etinyeghị “nke ya” nke Grik ekwughị kpọmkwem.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Ebe a tọgbọrọ n’efu
  rationale: Ọ na-egosi ebe mmadụ na-ebighị ma ọ bụ ebe dị anya n’obodo, n’ebughị ụzọ kpebie na ọ bụ ọzara kpọmkwem.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: oge agaala
  rationale: Nke a bụ ụzọ Igbo si ekwu na oge adịla anya ma ọ bụ na chi na-eji; ọ na-edebe echiche nke oge gafere n’enweghị okwu na-adịghị eke.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: Zilaga ìgwè mmadụ ndị a
  rationale: N’ọnọdụ a, ἀπολύω pụtara ịchụpụ ma ọ bụ iziga ndị mmadụ ka ha laa; “zilaga” na-egosi arịrịọ ahụ nke ọma.
- source_word: ἵνα ἀπελθόντες εἰς τὰς κώμας
  choice: ka ha gaa n’obodo nta dị iche iche
  rationale: Ọ na-enye ebumnuche nke arịrịọ ahụ n’Igbo dị larịị. Ọ naghị atụkwasị “dị nso” nke na-adịghị n’ihe odide Grik.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: zụtaara onwe ha nri
  rationale: Ọ na-edebe ma echiche ịzụ nri ma nkwughachi ἑαυτοῖς, “maka onwe ha.”
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere “ebe tọgbọrọ n’efu” ka ọ ghara ime ἔρημος ka ọ bụrụ ọzara kpọmkwem. E tinyere akara nkọwa ụkwụ n’akụkụ okwu ndị ha na-akọwa, ebe akara ndị dị na English POB yiri ka ha gbanwere ọnọdụ.
