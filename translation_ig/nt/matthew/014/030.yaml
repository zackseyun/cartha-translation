  verdict: approve
  source_fidelity: 'Nsụgharị ahụ na-egosipụta nke ọma usoro na ihe okwu Grik pụtara: Pita hụrụ ifufe dị ike, ụjọ atụ ya, ọ malitere imikpu, ma o tiri mkpu kpọkuo Jizọs. “Mgbe ọ hụrụ” na “mgbe ọ malitere imikpu” bụ ụzọ Igbo ziri ezi isi sụgharị akụkụ okwu ndị ahụ, na-enweghị ikwu na ọ mikpụrụ kpamkpam.'
  naturalness: Asụsụ ahụ bụ Standard Igbo dị ndụ ma dị mfe ịghọta. “Ụjọ tụrụ ya,” “o tiri mkpu sị,” na “imikpu” dabara nke ọma na akụkọ a ma debe ụda dị ùgwù nke Akwụkwọ Nsọ.
  terminology: “Onyenwe anyị” na-arụ ọrụ nke ọma ebe a maka Κύριε dịka aha nsọpụrụ a na-akpọ Jizọs; ọ dịghị atụkwasị nkọwa ozizi na-adịghị na ederede. “Zọpụta m” sụgharịrị σῶσόν με n'ụzọ ziri ezi, na-edobe ma arịrịọ ozugbo ka a napụta ya n’ihe ize ndụ ma ụda okwu ahụ sara mbara. Nkọwa ala abụọ ahụ kwekọrọ na ebe ha tụrụ akara.
