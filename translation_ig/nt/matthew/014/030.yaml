id: MAT.14.30
reference: Matthew 14:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: ig
  text: Ma mgbe ọ hụrụ ifufe ahụ siri ike[a], ụjọ tụrụ ya. Mgbe ọ malitere imikpu, o tiri mkpu sị, “Onyenwe anyị, zọpụta m![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ifufe ahụ na-efe n’ike.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “napụta m!” Ngwaa Grik a nwere ike ịpụta ịnapụta mmadụ n’ihe ize ndụ dị ya n’ihu ozugbo, nakwa nzọpụta n’ụzọ sara mbara.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: mgbe ọ hụrụ
  rationale: Nkebi okwu a na-egosi na ịhụ ifufe ahụ mere n’otu oge ahụ ụjọ malitere; nsụgharị a na-asụ nke ọma n’Igbo ma na-edobe njikọ ahụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi mgbanwe megidere ihe gara aga, mgbe Pita nọ na-aga nke ọma n’elu mmiri.
- source_word: ἄνεμον ἰσχυρόν
  choice: ifufe ahụ siri ike
  rationale: ἰσχυρός na-akọwa ike ifufe ahụ kpọmkwem; okwu Igbo a doro anya ma ghara ime ka ike ya karịa ihe odide ahụ kwuru.
- source_word: ἐφοβήθη
  choice: ụjọ tụrụ ya
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi na ụjọ bidoro ịtụ mmadụ, ọ bụghị naanị na onye ahụ nọ n’ọnọdụ egwu.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: mgbe ọ malitere imikpu
  rationale: Ọ na-edobe mmalite nke omume ahụ, na-egosikwa na Pita amalitela ịba n’okpuru mmiri, ọ bụghị na mmiri eriela ya kpamkpam.
- source_word: ἔκραξεν λέγων
  choice: o tiri mkpu sị
  rationale: Ọ bụ okwu Igbo dị ndụ nke na-egosi olu ike na arịrịọ ngwa ngwa, ma na-ejikọta mkpu ahụ na okwu o kwuru.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị asụ κύριος mgbe a na-akpọ Jizọs okwu; ọ na-edobe ịdị arọ nke aha ahụ n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: σῶσόν με
  choice: zọpụta m
  rationale: Ọ bụ iwu-arịrịọ ngwa ngwa maka nzọpụta pụọ n’ihe ize ndụ; “zọpụta” dabara n’ihe ize ndụ anụ ahụ dị ebe a ma na-edobekwa obosara ihe σῴζω nwere ike ịpụta.
theological_decisions:
- issue: Otu e si asụ κύριος mgbe a na-akpọ Jizọs okwu
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” na-edobe ịdị arọ nke κύριος na njikọ ya na Jizọs, ebe “Nna ukwu” nwere ike ime ka ọ bụrụ naanị aha onye isi ma ọ bụ onye nkuzi.
- issue: Otu e si asụ σῴζω n’ọnọdụ ihe ize ndụ ozugbo
  choice: zọpụta m
  alternative: napụta m
  rationale: Ọ bụ ezie na Pita na-arịọ ka a napụta ya n’ịmikpu, “zọpụta m” na-ezo aka n’ihe ize ndụ ahụ nke ọma ma na-edobekwa obosara okwu Grik ahụ kama imechi ya naanị n’ịnapụta mmadụ n’ọnọdụ a.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “O tiri mkpu sị” na-eme ka akụkọ ahụ bụrụ nke e ji ọnụ ekwu nke ọma; “imikpu” na-egosi usoro ịba n’okpuru mmiri n’enweghị ikwu na mmiri erielarị ya.
