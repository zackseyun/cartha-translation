    issue: Footnote has an awkward Igbo need-construction.
    rationale: “Ọ dịghị ha mkpa ịla” is understandable, but “Ọ dịghị mkpa ka ha laa” is the natural Standard Igbo expression and better matches the main text’s construction. The alternative should remain an alternative for ἀπελθεῖν (“laa”), not introduce an unnatural idiom.
