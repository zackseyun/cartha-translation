  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: ig
  text: Ma Jizọs sịrị ha, “Ọ dịghị mkpa ka ha pụọ; unu onwe unu nye ha ihe ha ga-eri.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ dịghị mkpa ka ha laa; unu nye ha nri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’etiti atụmatụ ndị na-eso ụzọ ka igwe mmadụ laa na nzaghachi Jizọs.
- source_word: εἶπεν αὐτοῖς
  choice: sịrị ha
  rationale: Nke a bụ ụzọ Igbo nkịtị, doro anya e si ewebata okwu a gwara mmadụ.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Ọ dịghị mkpa ka ha
  rationale: Ọ na-egosipụta echiche nke enweghị mkpa ma na-ada ka Igbo nke oge a, kama ịrapara n’usoro okwu Grik n’ụzọ na-ekwekọghị n’Igbo.
- source_word: ἀπελθεῖν
  choice: pụọ
  rationale: N’ebe a, okwu ahụ pụtara isi n’ebe ahụ laa; “pụọ” na-egosi nke a nkenke ma doo anya.
- source_word: δότε
  choice: nye
  rationale: Ọ bụ iwu a gwara ọtụtụ mmadụ; usoro “unu ... nye” na-egosi nke ahụ n’Igbo.
- source_word: αὐτοῖς
  choice: ha
  rationale: Ọ na-ezo aka n’igwe mmadụ ahụ, bụrụkwa nnara nke ngwaa “nye.”
- source_word: ὑμεῖς
  choice: unu onwe unu
  rationale: Nnọchiaha ahụ pụtara ìhè n’asụsụ Grik, ya mere “unu onwe unu” na-echekwa nkwusi ike Jizọs tinyere n’ọrụ ndị na-eso ụzọ.
- source_word: φαγεῖν
  choice: ihe ha ga-eri
  rationale: Mgbe ọ gbasoro “nye,” ụdị okwu Igbo a na-egosi nke ọma ihe e nyere ha maka iri, n’etinyeghị ụdị nri a na-ekwughị n’amaokwu ahụ.
theological_decisions:
- issue: Nkwusi ike n’ọrụ ndị na-eso ụzọ n’iwu Jizọs
  choice: Ịsụgharị ὑμεῖς dịka “unu onwe unu”
  alternative: Ịsụgharị ya naanị dịka “unu”
  rationale: Nke a na-echekwa nkwusi ike dị n’asụsụ Grik na Jizọs na-enye ndị na-eso ụzọ iwu ozugbo, n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. “Unu onwe unu” na-echekwa nkwusi ike Grik, ebe “ihe ha ga-eri” na-enye okwu ahụ ọdịdị Igbo ebumpụta ụwa.
