id: MAT.14.13
reference: Matthew 14:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: ig
  text: Mgbe Jizọs nụrụ ihe a, o si n’ebe ahụ jiri ụgbọ mmiri gaa n’ebe tọgbọrọ chakoo[a] naanị ya. Ma mgbe ìgwè mmadụ dị iche iche nụrụ, ha si n’obodo[b] dị iche iche jee ije soro ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ebe mmadụ na-ebighị” ma ọ bụ “ebe dịpụrụ adịpụ.” Okwu Grik ahụ na-ekwu maka ebe dịpụrụ adịpụ ma ọ bụ ebe mmadụ na-ebighị; ọ bụghị na ọ ga-abụrịrị ọzara aja.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ahụ nwere ike ịpụta obodo nta ma ọ bụ obodo ukwu, dabere n’ọnọdụ e ji ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: Mgbe ... nụrụ
  rationale: A sụgharịrị participle a dị ka nke na-egosi oge. δέ na-akwalite akụkọ ahụ n’ihu, ọ naghị egosi nnukwu mmegide.
- source_word: ἀνεχώρησεν
  choice: o si ... gaa
  rationale: N’ebe a, okwu ahụ na-egosi na Jizọs hapụrụ ebe ahụ gaa ebe ọzọ; nsụgharị a bụ nke Igbo nkịtị ma ọ naghị atụkwasị ihe kpatara ọpụpụ ya.
- source_word: ἐν πλοίῳ
  choice: jiri ụgbọ mmiri
  rationale: Nke a na-egosi ụzọ o si mee njem n’Igbo doro anya.
- source_word: εἰς ἔρημον τόπον
  choice: gaa n’ebe tọgbọrọ n’efu
  rationale: ἔρημος na-akọwa ebe mmadụ na-ebighị ma ọ bụ ebe dịpụrụ adịpụ; ọ pụtaghị na ebe ahụ ga-abụ ọzara aja.
- source_word: κατ’ ἰδίαν
  choice: naanị ya
  rationale: Nke a na-edobe echiche nke ịnọ iche ma ọ bụ ịnọ n’onwe ya.
- source_word: οἱ ὄχλοι
  choice: ìgwè mmadụ ahụ
  rationale: Ọ bụ okwu Igbo dị mfe ma dị ugbu a maka ndị mmadụ gbakọtara n’ìgwè.
- source_word: πεζῇ
  choice: jiri ụkwụ
  rationale: Nke a na-egosi na ha gara ije, ọ bụghị n’ụgbọ mmiri.
- source_word: ἀπὸ τῶν πόλεων
  choice: si n’obodo dị iche iche
  rationale: πόλις nwere ike ịbụ obodo ukwu ma ọ bụ nke nta; “obodo” na-edobe ohere abụọ ahụ n’Igbo.
theological_decisions:
- issue: Ihe mere Jizọs ji pụọ gaa ebe dịpụrụ adịpụ
  choice: E kwughị ihe kpatara ya; e gosiri naanị na ọ hapụrụ ebe ahụ gaa ịnọ naanị ya.
  alternative: Ịkọwa na ọ gbara ọsọ maka nchekwa ya, ma ọ bụ na ọ gara iru uju ma ọ bụ ikpe ekpere.
  rationale: Amaokwu ahụ anaghị ekwu kpọmkwem ihe kpatara Jizọs ji pụọ, ya mere nsụgharị ahụ anaghị etinye nkọwa okpukpe ma ọ bụ ebumnuche na-adịghị n’ihe odide ahụ.
- issue: Ihe ìgwè mmadụ ahụ nụrụ
  choice: A hapụrụ ngwaa “nụrụ” n’enweghị ịkpọ ihe ha nụrụ aha kpọmkwem.
  alternative: “mgbe ha nụrụ ebe ọ gara” ma ọ bụ “mgbe ha nụrụ ihe a.”
  rationale: Ihe odide Grik ekwughị kpọmkwem ihe ha nụrụ; ịhapụ ya otú a na-echekwa nghọta sara mbara nke isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-aga nke ọma n’Igbo, ma e chekwara nkọwa na-edoghị anya banyere ihe mere Jizọs ji pụọ na ihe ìgwè mmadụ ahụ nụrụ.
