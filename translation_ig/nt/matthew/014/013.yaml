    text: A pụkwara ịsụgharị ya “ebe mmadụ na-ebighị” ma ọ bụ “ebe dịpụrụ adịpụ.” Okwu Grik ahụ na-ekwu maka ebe dịpụrụ adịpụ ma ọ bụ ebe mmadụ na-ebighị; ọ bụghị na ọ ga-abụrịrị ọzara aja.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ahụ nwere ike ịpụta obodo nta ma ọ bụ obodo ukwu, dabere n’ọnọdụ e ji ya.
    reason: lexical_alternative
