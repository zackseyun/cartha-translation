  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: ig
  text: N’ịbụ onye nne ya kpaliri, ọ sịrị, “Nye m n’ebe a, n’elu nnukwu efere, isi Jọn Onye Na-eme Baptizim[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụdị a na-ahụkarị, “Jọn Baptist.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: ebe ... kpalirila ya
  rationale: “Kpalirila ya” na-egosi na nne ya emetụtala ya ma gbaa ya ume tupu ọ rịọ arịrịọ ahụ, na-enweghị ịkọwa mmetụta ahụ dị ka iwu kpọmkwem.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: nne ya
  rationale: N’ahịrịokwu a, “nne ya” bụ onye mere ihe e gosiri site n’ụdị nkw受? passive Greek; nhazi Igbo na-eme ka onye ahụ doo anya n’ụzọ ebumpụta ụwa.
- source_word: Δός μοι
  choice: Nye m
  rationale: Nke a bụ iwu kwụ ọtọ, “Nye m” bụkwa ụzọ Igbo dị mfe ma dị ike isi kwuo ya.
- source_word: φησίν
  choice: ọ sịrị
  rationale: Ọ bụ ezie na Greek ji historical present, oge gara aga bụ usoro akụkọ kacha bụrụ nke ebumpụta ụwa n’Igbo ma ka na-echekwa ịdị ngwa nke okwu ahụ.
- source_word: ὧδε
  choice: n’ebe a
  rationale: Nke a na-echekwa ntụaka kpọmkwem nke ὧδε banyere ebe ahụ.
- source_word: ἐπὶ πίνακι
  choice: n’elu nnukwu efere
  rationale: πίναξ n’ọnọdụ oriri a bụ efere sara mbara e ji ebute nri; “nnukwu efere” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
- source_word: τὴν κεφαλὴν
  choice: isi
  rationale: A sụgharịrị okwu ahụ kpọmkwem, na-ejighị okwu dị nro zoo ihe jọgburu onwe ya dị n’akụkọ ahụ.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Jọn Onye Na-eme Baptizim
  rationale: βαπτιστής bụ aha ọrụ na-akọwa Jọn dị ka onye na-eme baptizim; nsụgharị a na-echekwa ike nkọwa ahụ n’Igbo.
theological_decisions:
- issue: Otu e si sụgharịa aha ọrụ Jọn, βαπτιστής
  choice: Jọn Onye Na-eme Baptizim
  alternative: Jọn Baptist
  rationale: Nhọrọ bụ isi na-egosi na βαπτιστής bụ aha ọrụ, ọ bụghị naanị aha otu okpukpe. E debere ụdị ọdịnala a maara nke ọma n’ala ala peeji maka ndị na-agụ akwụkwọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa mmetụta nne ahụ, arịrịọ iwu ozugbo, na nkọwa doro anya nke isi e tinyere n’elu nnukwu efere.
