  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: ig
  text: Pita wee zaa ya, sị, “Onyenwe anyị, ọ bụrụ na ọ bụ gị, nye m iwu ka m bịakwute gị n’elu mmiri[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a sụgharịrị “mmiri” dị n’ọnụọgụ ọtụtụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: Pita wee zaa ya, sị
  rationale: Nke a bụ ụzọ Igbo dị ire ụtọ si ebu usoro akụkọ ahụ na echiche nke ịza onye okwu; “wee” na-egosi njikọ ya na ihe gara aga n’ebughị δέ ibu karịa ka o kwesịrị.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị akpọ Jizọs ‘Onyenwe’; ọ na-echekwa ma nkwanye ùgwù ahụ ma ịdị arọ nke okwu ahụ n’ihe gbasara onye Jizọs bụ.
- source_word: εἰ σὺ εἶ
  choice: ọ bụrụ na ọ bụ gị
  rationale: Ọ bụ ụzọ Igbo kachasị doo anya isi gosi na Pita na-ajụ ma onye ahụ ọ̀ bụ Jizọs n’ezie.
- source_word: κέλευσόν με
  choice: nye m iwu
  rationale: κελεύω na-egosi ntụziaka e nyere n’ike; “nye m iwu” na-echekwa ike ahụ n’asụsụ Igbo nke oge a.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: ka m bịakwute gị
  rationale: “Bịakwute gị” na-egosi ngagharị Pita na-aga ebe Jizọs nọ, dịka πρός σέ si kwuo.
- source_word: ἐπὶ τὰ ὕδατα
  choice: n’elu mmiri
  rationale: “N’elu mmiri” bụ ụzọ Igbo nkịtị si kwuo ya. Ọ bụ ezie na ὕδατα dị n’ọnụọgụ ọtụtụ na Grik, “mmiri” na-arụkarị ọrụ dịka aha a na-adịghị agụ ọnụ n’Igbo; e debere nkọwa nke ọnụọgụ ọtụtụ ahụ n’ala peeji.
theological_decisions:
- issue: Ike okwu κύριε mgbe Pita na-akpọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” anaghị eme ka okwu ahụ bụrụ naanị aha nkwanye ùgwù, ma ọ naghịkwa akọwapụta karịa ihe amaokwu ahụ kwuru; ya mere ọ na-echekwa ịdị arọ na mgbagwoju anya nke okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “Pita wee zaa ya, sị” dịka usoro akụkọ nkịtị, ebe “nye m iwu” na-echekwa ike arịrịọ Pita. Akara ala peeji [a] dị n’ahịrị ederede n’ebe okwu ọ na-akọwa dị.
