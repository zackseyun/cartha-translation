review_pass:
  verdict: revise
  source_fidelity: 'The verse is substantially faithful: Peter answers Jesus, addresses him as Lord, and asks for an authoritative command to come to him on the water(s). “Onyenwe anyị” is an established Igbo biblical rendering for κύριε and can retain the term’s respectful and potentially weighty sense. The Greek plural ὕδατα need not be forced into an unnatural Igbo plural in the main text, since mmiri is ordinarily a mass noun.'
  naturalness: The main text is fluent, modern Standard Igbo. “Pita wee zaa ya, sị” and “nye m iwu ka m bịakwute gị” are natural narrative and request forms.
  terminology: “Onyenwe anyị” appropriately renders κύριε in the project’s established biblical register without reducing it to “Nna ukwu.” “Nye m iwu” preserves the force of κέλευσον. The footnote’s proposed wording “mmiri ndị ahụ” unnecessarily adds a demonstrative sense (“those waters”) that is not required by the Greek article.
  issues:
  - severity: low
    issue: The footnote gives “n’elu mmiri ndị ahụ” as an alternative.
    rationale: “Ndị ahụ” adds a demonstrative nuance not present in ἐπὶ τὰ ὕδατα. The relevant textual point is simply that Greek uses a plural form, while natural Igbo uses the mass noun mmiri.
  revised_text: Pita wee zaa ya, sị, “Onyenwe anyị, ọ bụrụ na ọ bụ gị, nye m iwu ka m bịakwute gị n’elu mmiri[a].”
