  yaml_path: translation/nt/matthew/014/007.yaml
  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: ig
  text: N’ihi ya, o ji iyi kwe ya nkwa na ọ ga-enye ya ihe ọ bụla ọ ga-arịọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe ọ bụla ọ pụrụ ịrịọ.” Okwu Grik ahụ (ὃ ἐὰν αἰτήσηται) na-egosi arịrịọ ọdịnihu nke a na-amabeghị ihe ọ ga-abụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: N’ihi ya
  rationale: Na-egosi ihe si n’ihe mere tupu ya pụta; ọ na-edobe ike nke njikọ nkwubi okwu ahụ n’Igbo nkịtị.
- source_word: μετὰ ὅρκου
  choice: ji iyi
  rationale: Na-egosi na o mere nkwa ahụ site n’ịṅụ iyi; nke a bụ ụzọ Igbo doro anya ma dịkwa nkenke isi kwuo ya.
- source_word: ὡμολόγησεν
  choice: kwe ya nkwa
  rationale: N’ọnọdụ a, okwu ahụ pụtara ime nkwenye siri ike ma ọ bụ nkwa, ọ bụghị ikwupụta mmehie.
- source_word: αὐτῇ
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’ebe nwa agbọghọ ahụ nọ dịka onye a kwere nkwa.
- source_word: δοῦναι
  choice: na ọ ga-enye ya
  rationale: A sụgharịrị infinitive ahụ dịka nkebiokwu na-akọ ọdịnaya nke nkwa ahụ n’Igbo eke.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: ihe ọ bụla ọ ga-arịọ
  rationale: Na-edobe arịrịọ ọdịnihu ahụ ghe oghe, n’ebughị ụzọ kọwaa kpọmkwem ihe ọ ga-arịọ.
