source:
  edition: SBLGNT
  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: ig
  text: Ha rịọrọ ya nke ukwuu ka ha metụ naanị ọnụ ọnụ uwe ya aka[a]; ndị niile metụrụ ọnụ ọnụ uwe ahụ aka ka a gwọrọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọnụ uwe” ma ọ bụ “akụkụ uwe.” Okwu Grik ahụ nwere ike ịpụta nsọtụ ma ọ bụ ọnụ uwe, ma o nwekwara ike ịgụnye eriri dị n’ọnụ uwe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ahụ dị ha mma.” Ngwaa Grik ahụ nwere ike ịpụta na a gwọrọ mmadụ, na e mere ka ọ dịghachi mma, ma ọ bụ, n’ụzọ sara mbara karị, na a zọpụtara ya; ma n’ebe a ihe a na-ekwu bụ ọgwụgwọ ọrịa anụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: Ha nọ na-arịọ ya arịrịọ
  rationale: Ụdị ngwaa na-egosi arịrịọ e ji ịnọgide na-arịọ; okwu a na-egosipụta ịdị ọkụ n’obi karịa nanị ‘rịọ.’
- source_word: ἵνα μόνον ἅψωνται
  choice: ka ha metụ naanị ... aka
  rationale: Nke a na-egosipụta ihe ha rịọrọ nakwa na nanị imetụ aka bụ ihe ha chọrọ.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: ọnụ ọnụ uwe ya
  rationale: ‘Ọnụ ọnụ uwe’ bụ okwu Igbo doro anya maka akụkụ dị na nsọtụ uwe, ma ọ naghị ekpebi ma ọ bụ ọnụ uwe nkịtị, fringe, ka ọ bụ tassel.
- source_word: ὅσοι ἥψαντο
  choice: ndị niile metụrụ ya aka
  rationale: ‘Ndị niile’ na-echekwa echiche nke ὅσοι na ọ metụtara onye ọ bụla n’ime ndị metụrụ aka.
- source_word: διεσώθησαν
  choice: a gwọkwara
  rationale: N’ebe a akụkọ ahụ na-ekwu maka ọrịa anụ ahụ, ya mere ‘a gwọrọ’ na-enye nghọta kacha pụta ìhè, ebe nkọwa ala peeji na-echekwa obosara okwu Grik ahụ.
theological_decisions:
- issue: Ihe διεσώθησαν pụtara n’akụkọ ọrụ ebube ọgwụgwọ a
  choice: a gwọrọ
  alternative: ahụ dị ha mma; a zọpụtara ha
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ ọgwụgwọ ọrịa anụ ahụ. Nsụgharị a anaghị ebubata ozizi nzọpụta ime mmụọ n’ebe ederede ahụ na-ekwughị ya hoo haa, ma nkọwa ala peeji na-egosi na ngwaa Grik ahụ nwere ike ịpụta ihe sara mbara.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa arịrịọ ha nọgidere na-arịọ, okwu ‘naanị,’ na echiche na onye ọ bụla metụrụ aka nwetara ọgwụgwọ. E tinyere akara nkọwa [a] na [b] kpọmkwem n’ebe okwu ndị ha na-akọwa dị.
