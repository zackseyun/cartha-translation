    text: Ma ọ bụ, “ọnụ uwe” ma ọ bụ “akụkụ uwe.” Okwu Grik ahụ nwere ike ịpụta nsọtụ ma ọ bụ ọnụ uwe, ma o nwekwara ike ịgụnye eriri dị n’ọnụ uwe.
