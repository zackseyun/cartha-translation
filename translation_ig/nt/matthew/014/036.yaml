revisions:
- from: Ha nọ na-arịọ ya arịrịọ ka ha metụ naanị ọnụ ọnụ uwe ya aka[a]; a gwọkwara ndị niile metụrụ ya aka[b].
  to: Ha rịọrọ ya nke ukwuu ka ha metụ naanị ọnụ ọnụ uwe ya aka[a]; ndị niile metụrụ ọnụ ọnụ uwe ahụ aka ka a gwọrọ[b].
  rationale: The revision improves idiomatic Standard Igbo, explicitly maintains the fringe as the object of touching, and preserves the source’s contextual physical-healing sense without importing a broader theological meaning. Footnote anchors remain attached to the terms they explain.
