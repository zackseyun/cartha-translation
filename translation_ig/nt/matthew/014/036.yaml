review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the continued earnest request, the restriction to mere touch, the garment border, and the physical-healing sense of διεσώθησαν. However, the final pronoun in “metụrụ ya aka” most naturally points back to Jesus rather than to the garment fringe, whereas the Greek context specifies touching the fringe. The revision makes that referent explicit.
  naturalness: “Ha nọ na-arịọ ya arịrịọ” is unnecessarily repetitive and less idiomatic than a direct expression of earnest repeated pleading. The revised wording is natural Standard Igbo and retains the imperfect force.
  terminology: “Ọnụ ọnụ uwe” is an appropriate non-over-specific rendering of κράσπεδον. The revised footnote retains border/fringe/tassel ambiguity without asserting that the tassel was tied to the garment.
  issues:
  - severity: medium
    issue: Ambiguous antecedent in “ndị niile metụrụ ya aka”
    rationale: In Igbo, “ya” ordinarily refers to the masculine person just mentioned (Jesus), while the Greek refers in context to those who touched the fringe of his garment. Explicitly naming the garment border prevents a shift in the object touched.
  - severity: low
    issue: Redundant expression “na-arịọ ya arịrịọ”
    rationale: The noun and verb repeat the same idea. “Ha rịọrọ ya nke ukwuu” naturally communicates earnest entreaty and is suitable for the imperfect in this context.
  - severity: low
    issue: Footnote description of a tassel is overly specific
    rationale: κράσπεδον may include a tassel/fringe, but the source does not say it was an ‘eriri a na-ekekọta’ (a string tied on). A neutral wording better preserves the lexical range.
  revised_text: Ha rịọrọ ya nke ukwuu ka ha metụ naanị ọnụ ọnụ uwe ya aka[a]; ndị niile metụrụ ọnụ ọnụ uwe ahụ aka ka a gwọrọ[b].
  revised_footnotes:
