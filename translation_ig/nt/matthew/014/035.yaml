- from: Mgbe ndị ikom ebe ahụ matara ya, ha zigara ozi n’akụkụ niile nke obodo ahụ gbara ya gburugburu, kpọtaara ya ndị niile na-arịa ọrịa,[a]
  to: Mgbe ndị ikom nke ebe ahụ matara ya, ha zigaara ozi[a] n’ógbè niile gbara ebe ahụ gburugburu, ma kpọtaara ya ndị niile na-arịa ọrịa,[b]
  rationale: The revision preserves the Greek wording and narrative sense while replacing a town-focused expression with one denoting the whole surrounding region. It retains the natural Igbo clarification “ozi,” now marked by a footnote because the Greek object is unexpressed, and preserves the illness idiom note with a correctly placed anchor.
