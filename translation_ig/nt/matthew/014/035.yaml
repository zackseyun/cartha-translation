review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys recognition, the explicitly male referent, bringing the sick to Jesus, and the idiom for illness. However, “n’akụkụ niile nke obodo ahụ gbara ya gburugburu” narrows the surrounding region to parts of a town and is syntactically less clear than the Greek sense. “Ozi” legitimately supplies an implicit object for natural Igbo, but this addition should be disclosed in a note.
  naturalness: “Ndị ikom nke ebe ahụ” and “n’ógbè niile gbara ebe ahụ gburugburu” are clearer, natural Standard Igbo. “Kpọtaara ya” is suitable in this healing context.
  terminology: “Matara ya” appropriately expresses recognizing him; “ndị ikom” preserves ἄνδρες; “ndị niile na-arịa ọrịa” accurately renders the Greek idiom without importing extra theological meaning.
  issues:
  - severity: medium
    issue: The surrounding area is rendered as parts of a town.
    rationale: περίχωρος denotes the surrounding region/district, whereas “akụkụ niile nke obodo ahụ” can mean every part of the town itself. “Ógbè niile gbara ebe ahụ gburugburu” retains the spatial scope.
  - severity: low
    issue: The supplied object of “sent” is not footnoted.
    rationale: Greek leaves the object of ἀπέστειλαν implicit. Supplying “ozi” is idiomatic in Igbo, but a note should preserve transparency about this ambiguity.
  revised_text: Mgbe ndị ikom nke ebe ahụ matara ya, ha zigaara ozi[a] n’ógbè niile gbara ebe ahụ gburugburu, ma kpọtaara ya ndị niile na-arịa ọrịa,[b]
  revised_footnotes:
