  text: καὶ ἐπιγνόντες αὐτὸν οἱ ἄνδρες τοῦ τόπου ἐκείνου ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην, καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/035.yaml
  text: And when the men of that place recognized him[a], they sent into that whole surrounding region and brought to him all who were sick[b],
translation:
  language: ig
  text: Mgbe ndị ikom nke ebe ahụ matara ya, ha zigaara ozi[a] n’ógbè niile gbara ebe ahụ gburugburu, ma kpọtaara ya ndị niile na-arịa ọrịa,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ekwughị kpọmkwem ihe ha zigara; ọ pụrụ ịbụ ozi ma ọ bụ ndị ozi.
    reason: lexical_alternative
  - marker: b
    text: N’okwu Grik, ọ bụ n’ụzọ nkịtị, “ndị niile nọ n’ọnọdụ ọjọọ,” bụ akpaalaokwu pụtara ndị na-arịa ọrịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: matara ya
  rationale: N’ọnọdụ akụkọ a, okwu a pụtara na ha ghọtara onye Jizọs bụ mgbe ha hụrụ ya; “matara ya” bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: ndị ikom ebe ahụ
  rationale: A nọgidere na nkọwa nwoke dị n’okwu ἄνδρες, ebe τόπος na-ezo aka n’ebe ahụ.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: ha zigara ozi n’akụkụ niile nke obodo ahụ gbara ya gburugburu
  rationale: Ihe e zigara ekwughị kpọmkwem n’asụsụ Grik; “ozi” na-eme ka Igbo bụrụ nke doro anya ma kwekọọ n’omume nkwusa e bu n’obi. περίχωρος bụ mpaghara gbara ebe ahụ gburugburu.
- source_word: προσήνεγκαν αὐτῷ
  choice: kpọtaara ya
  rationale: N’ebe a προσφέρω pụtara ịkpọtara Jizọs ndị mmadụ, ọ bụghị ịchụ àjà.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: ndị niile na-arịa ọrịa
  rationale: κακῶς ἔχειν bụ akpaalaokwu Grik nke pụtara ịrịa ọrịa ma ọ bụ ịnọ n’ahụhụ ọrịa.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. A kọwara ihe e zigara dị ka “ozi” maka ịdị n’usoro n’Igbo, ọ bụ ezie na Grik hapụrụ ihe ahụ e zigara n’ekwughị ya kpọmkwem.
