review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the temporal phrase, Jesus’ coming to the disciples, and his walking on the water. However, the main text’s “mmiri ahụ” is broader than θάλασσα (“sea”), while Standard Igbo has the natural term “oke osimiri” for a sea. Using it preserves the source term without identifying the body of water beyond what the Greek says.
  naturalness: “N’oge nche nke anọ n’abalị” is more idiomatic Standard Igbo than “N’oge nche nke anọ nke abalị.” The remaining syntax is clear, natural, and appropriately dignified.
  terminology: Use “oke osimiri” for θάλασσα. Retain “nche” for φυλακή and “bịakwutere ha” for ἦλθεν πρὸς αὐτούς. The revised note distinguishes a looser ‘water’ rendering from the contextual interpretation without treating the latter as the main translation.
  issues:
  - severity: low
    issue: The main text renders θάλασσα as “mmiri ahụ.”
    rationale: Although context makes the reference understandable, “mmiri” is semantically wider than “sea.” “Oke osimiri” is an established Standard Igbo equivalent and more closely reflects the Greek lexical wording.
  - severity: low
    issue: The wording of footnote b presents “n’elu oke mmiri ahụ” as an alternative while the main text uses “mmiri ahụ.”
    rationale: This reverses the more source-specific and less specific expressions. Revising the main text and note makes the lexical relationship clear.
  revised_text: N’oge nche nke anọ n’abalị[a], ọ bịakwutere ha, na-eje ije n’elu oke osimiri ahụ[b].
  revised_footnotes:
  - marker: a
    text: “Nche nke anọ n’abalị” bụ oge nche ikpeazụ n’abalị; n’usoro ndị Rom, ọ dị ihe dịka elekere atọ nke ụtụtụ ruo elekere isii nke ụtụtụ.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “na-eje ije n’elu mmiri ahụ.” Ụfọdụ aghọtala okwu a dịka “na-eje ije n’akụkụ oke osimiri ahụ,” ma ihe ndị gbara ya gburugburu na-akwado nke ọma na ọ na-eje ije n’elu mmiri ahụ n’onwe ya.
    reason: alternative_reading
  revision_rationale: The revision improves idiomatic Standard Igbo in the temporal expression and restores the lexical specificity of θάλασσα with “oke osimiri.” It preserves the Greek’s narrative force and the contextual sense that Jesus walks on the water, without adding theological interpretation.
