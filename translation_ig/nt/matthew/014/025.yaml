id: MAT.14.25
reference: Matthew 14:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: ig
  text: N’oge nche nke anọ n’abalị[a], ọ bịakwutere ha, na-eje ije n’elu oke osimiri ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nche nke anọ n’abalị” bụ oge nche ikpeazụ n’abalị; n’usoro ndị Rom, ọ dị ihe dịka elekere atọ nke ụtụtụ ruo elekere isii nke ụtụtụ.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “na-eje ije n’elu mmiri ahụ.” Ụfọdụ aghọtala okwu a dịka “na-eje ije n’akụkụ oke osimiri ahụ,” ma ihe ndị gbara ya gburugburu na-akwado nke ọma na ọ na-eje ije n’elu mmiri ahụ n’onwe ya.
    reason: alternative_reading
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: N’oge nche nke anọ nke abalị
  rationale: Nkebi a na-egosi oge ihe ahụ mere. Ijigide okwu “nche” na-echekwa usoro e ji ekewa abalị n’oge ahụ, ebe nkọwa ala peeji na-akọwa ya n’oge a.
- source_word: δὲ
  choice: (egosighị ya iche)
  rationale: δὲ bụ njikọ dị nro nke na-akwalite akụkọ ahụ. N’Igbo, ịmalite amaokwu a ozugbo site n’okwu oge na-eme ka asụsụ daa nke ọma n’enweghị mgbanwe n’usoro akụkọ.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: ọ bịakwutere ha
  rationale: Okwu a na-egosi na ọ bịara n’ebe ha nọ ma na-aga n’ihu ruo ha nso; “bịakwutere ha” bụ Igbo doro anya ma kwekọọ n’echiche ahụ.
- source_word: περιπατῶν
  choice: na-eje ije
  rationale: Ọ na-egosi omume na-aga n’ihu n’otu oge ahụ na ngwaa bụ isi.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: n’elu mmiri ahụ
  rationale: N’okwu gbara ya gburugburu, nkebi a na-egosi na ọ na-eje ije n’elu mmiri ahụ n’onwe ya. “Mmiri ahụ” bụ okwu Igbo e ji ekwu maka nnukwu mmiri ahụ n’ụzọ dị mfe ma ghara ịmanye ọdịdị ala ya ịbụ oke osimiri.
theological_decisions:
- issue: Nkọwa ọrụ ebube nke ije Jizọs n’elu mmiri
  choice: na-eje ije n’elu mmiri ahụ
  alternative: na-eje ije n’akụkụ mmiri ahụ
  rationale: Nhazi okwu Grik na ihe ndị gbara amaokwu ahụ gburugburu na-akwado ije n’elu mmiri, ọ bụghị naanị ije n’akụkụ ụsọ mmiri. Nsụgharị ahụ na-echekwa ihe odide ahụ kwuru n’enweghị ibelata ọrụ ebube ahụ ma ọ bụ itinye nkọwa ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “bịakwutere ha” maka mmegharị n’ebe ndị na-eso ụzọ nọ, ma jiri “mmiri ahụ” zere ịkọwa θάλασσα n’ụzọ nwere ike ime ka ndị na-agụ ya chee naanị banyere oke osimiri.
