  to: N’oge nche nke anọ n’abalị[a], ọ bịakwutere ha, na-eje ije n’elu oke osimiri ahụ[b].
  rationale: The revision improves idiomatic Standard Igbo in the temporal expression and restores the lexical specificity of θάλασσα with “oke osimiri.” It preserves the Greek’s narrative force and the contextual sense that Jesus walks on the water, without adding theological interpretation.
