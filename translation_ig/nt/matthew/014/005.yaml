  source_fidelity: 'The main rendering accurately conveys θέλων ἀποκτεῖναι, ἐφοβήθη τὸν ὄχλον, and the idiom αὐτὸν εἶχον ὡς προφήτην. The concessive force in “Ọ bụ ezie na” is contextually defensible: Herod''s desire to kill John stands in contrast to his fear of the crowd. The first footnote, however, should offer a genuinely closer participial alternative rather than characterize “Ebe ọ chọrọ” as especially conforming to the Greek construction.'
