source:
  edition: SBLGNT
  text: καὶ θέλων αὐτὸν ἀποκτεῖναι ἐφοβήθη τὸν ὄχλον, ὅτι ὡς προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: ig
  text: Ọ bụ ezie na ọ chọrọ igbu ya,[a] ọ tụrụ egwu ìgwè mmadụ ahụ, n’ihi na ha weere ya dị ka onye amụma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ nkịtị karịa: “N’ịchọ igbu ya, ọ tụrụ egwu ìgwè mmadụ ahụ.” N’ọnọdụ a, a pụrụ ịghọta participle ahụ dịka “ọ bụ ezie na ọ chọrọ igbu ya.”'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha lere ya anya dịka onye amụma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: Ọ bụ ezie na ọ chọrọ
  rationale: 'Nkọwa a na-egosi mmekọrịta nkwenye-emegide nke participle ahụ na ἐφοβήθη n’ọnọdụ a: ọchịchọ igbu ya dị, ma egwu ìgwè mmadụ gbochiri ya. Ihe odide ala peeji na-edobe nsụgharị nkịtị karị.'
- source_word: ἀποκτεῖναι
  choice: igbu
  rationale: Nke a bụ okwu Igbo doro anya ma kwekọọ na infinitive ahụ; ‘igbu ọchụ’ ga-etinye ikpe omume nke ngwaa Grik ahụ ekwughị kpọmkwem.
- source_word: ἐφοβήθη
  choice: ọ tụrụ egwu
  rationale: Nke a bụ ụzọ ebumpụta ụwa e si ekwu ‘he feared/was afraid’ n’Igbo Standard.
- source_word: τὸν ὄχλον
  choice: ìgwè mmadụ ahụ
  rationale: Ọ na-egosi ọtụtụ mmadụ gbakọtara dịka ὄχλος si pụta, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara egwu ahụ n’ụzọ doro anya.
- source_word: ὡς προφήτην
  choice: dị ka onye amụma
  rationale: Ọ na-egosi ọnọdụ ha nyere ya n’echiche ha, n’etinyeghị obi abụọ na-enweghị isi.
- source_word: αὐτὸν εἶχον
  choice: ha weere ya
  rationale: N’usoro a, ἔχω na predicate accusative pụtara iwere ma ọ bụ ile mmadụ anya dịka ihe e kwuru; ‘ha weere ya dị ka’ bụ Igbo ebumpụta ụwa.
theological_decisions:
- issue: Onye isiokwu na onye a na-eme ihe adịghị aha kpọmkwem n’amaokwu Grik a
  choice: E debere nnọchiaha ‘ọ’ na ‘ya’ n’amaokwu ahụ.
  alternative: Ọ bụ ezie na Herọd chọrọ igbu Jọn, ọ tụrụ egwu ìgwè mmadụ ahụ, n’ihi na ha weere Jọn dị ka onye amụma.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-eme ka a mata na ndị ahụ bụ Herọd na Jọn. Idebe nnọchiaha na-agbaso ụdị isi mmalite ahụ ma ghara itinye aha ndị Grik ekwughị n’amaokwu a.
- issue: Ma θέλων kwesịrị ịbụ nke nkịtị ma ọ bụ nke nkwenye-emegide
  choice: A sụgharịrị ya ‘Ọ bụ ezie na ọ chọrọ’ n’ahịrị isi.
  alternative: Ebe ọ chọrọ igbu ya / N’ịchọ igbu ya.
  rationale: Ọnọdụ akụkọ ahụ na-egosi na, n’agbanyeghị ọchịchọ ya, egwu ìgwè mmadụ mere ka o ghara ime ya. Ihe odide ala peeji na-echekwa ụdị participle ahụ nke nkịtị karị.
translation_notes:
  register: Ejiri Igbo Standard nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere nnọchiaha nke isi mmalite kama ịgbakwunye aha Herọd na Jọn; e jikwa akara ụda naanị ebe ọ bara uru n’ịgụ okwu nke ọma.
