id: MAT.14.26
reference: Matthew 14:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: ig
  text: Ma mgbe ndị na-eso ụzọ hụrụ ya ka ọ na-eje ije n’elu oké osimiri, ụjọ jidere ha. Ha sịrị, “Ọ bụ mmụọ[a]!” Ha wee tie mkpu n’ihi egwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe pụtara n’ihu mmadụ” ma ọ bụ “mmụọ a na-ahụ anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n’akụkọ ahụ, karịchaa n’etiti ihe ha hụrụ na mmeghachi omume ụjọ ha.
- source_word: μαθηταὶ
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị na-amụ ihe ma na-eso onye nkuzi; n’ebe a, ihe gbara amaokwu ahụ gburugburu na-egosi na ha bụ ndị na-eso ụzọ Jizọs.
- source_word: ἰδόντες αὐτὸν
  choice: mgbe ndị na-eso ụzọ hụrụ ya
  rationale: A tụgharịrị participle a dị ka nkebiokwu oge ka usoro ihe mere doo anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: ka ọ na-eje ije n’elu oké osimiri
  rationale: “N’elu oké osimiri” na-egosi na ọ na-aga n’elu mmiri ahụ, ma na-edebekwa okwu θάλασσα dị ka “oké osimiri.”
- source_word: ἐταράχθησαν
  choice: ụjọ jidere ha
  rationale: N’ọnọdụ a, okwu ahụ na-egosi oké mgbagwoju anya na ụjọ n’ihi ihe ha chere na ha hụrụ; nkebiokwu Igbo a na-enye ike ahụ n’ụzọ eke.
- source_word: λέγοντες
  choice: Ha sịrị
  rationale: E kewara participle ahụ ka ọ bụrụ ahịrịokwu dị mkpirikpi, nke na-eme ka mkpu ha daa nke ọma n’Igbo.
- source_word: Φάντασμά ἐστιν
  choice: Ọ bụ mmụọ!
  rationale: “Mmụọ” bụ okwu ndị Igbo nkịtị ga-aghọta ozugbo dị ka ihe mmụọ mmadụ chere na ọ hụrụ; akara nkọwa na-echekwa ụzọ ndị ọzọ e nwere isi ghọta φάντασμα.
- source_word: ἀπὸ τοῦ φόβου
  choice: n’ihi egwu
  rationale: ἀπό na-egosi ihe kpatara mkpu ahụ; “n’ihi egwu” bụ Igbo eke ma doo anya.
- source_word: ἔκραξαν
  choice: Ha wee tie mkpu
  rationale: Nkebiokwu a na-egosi olu siri ike nke κράζω n’emeghị ka ọ pụta ihe karịrị ihe Grik kwuru.
theological_decisions:
- issue: Ụdị ihe φάντασμα pụtara n’okwu ndị na-eso ụzọ
  choice: E tinyere “mmụọ” n’ahịrịokwu bụ isi.
  alternative: “ihe pụtara dị ka mmụọ” ma ọ bụ “onyinyo mmụọ”
  rationale: Amaokwu ahụ na-akọ ihe ndị na-eso ụzọ chere n’ụjọ, ọ bụghị nkwupụta banyere ụdị ịdị adị nke ndị mmụọ. Nkọwa ala peeji na-echekwa obosara ihe okwu Grik ahụ pụrụ ịpụta n’etinyeghị ozizi ọzọ n’ime amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị nsọ n’ụda, mee ihe. E kewara participle abụọ ka ha bụrụ ahịrịokwu eke n’Igbo, ma e debere ọsọ na ike nke akụkọ ahụ.
