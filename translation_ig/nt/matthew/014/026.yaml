review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal participle, Jesus walking on the sea, the disciples’ alarm, their exclamation, and their loud cry caused by fear. “Ụjọ jidere ha” fittingly expresses the contextual force of ἐταράχθησαν, and “tie mkpu” properly renders ἔκραξαν without over-specifying the sound.
  naturalness: 'The main text is clear, idiomatic Standard Igbo, with an appropriate biblical narrative register. The existing footnote, however, is not fully natural or precise: “ihe pụtara dị ka mmụọ” is cumbersome, while “onyinyo mmụọ” can suggest a spirit’s shadow rather than a phantom or apparition.'
  terminology: “Ndị na-eso ụzọ,” “oké osimiri,” and “mmụọ” are suitable terms. In this fearful context, “mmụọ” naturally communicates the disciples’ perception of a ghost/apparition and does not make a doctrinal claim. The lexical-alternative note should retain that breadth in more idiomatic Igbo.
  issues:
  - severity: low
    issue: The lexical-alternative footnote is awkward and partly imprecise.
    rationale: The Greek φάντασμα can denote an apparition or phantom. “Onyinyo mmụọ” is liable to be read as ‘a spirit’s shadow,’ not ‘a phantom’; the first alternative is also unnecessarily indirect.
  revised_text: Ma mgbe ndị na-eso ụzọ hụrụ ya ka ọ na-eje ije n’elu oké osimiri, ụjọ jidere ha. Ha sịrị, “Ọ bụ mmụọ[a]!” Ha wee tie mkpu n’ihi egwu.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe pụtara n’ihu mmadụ” ma ọ bụ “mmụọ a na-ahụ anya.”
    reason: lexical_alternative
  revision_rationale: The main text is retained because it is faithful and natural. Only the footnote is revised to provide idiomatic Igbo alternatives that better reflect ‘apparition’ and ‘phantom’ without narrowing φάντασμα to a doctrinally defined category.
