  to: Ma mgbe ndị na-eso ụzọ hụrụ ya ka ọ na-eje ije n’elu oké osimiri, ụjọ jidere ha. Ha sịrị, “Ọ bụ mmụọ[a]!” Ha wee tie mkpu n’ihi egwu.
  rationale: The main text is retained because it is faithful and natural. Only the footnote is revised to provide idiomatic Igbo alternatives that better reflect ‘apparition’ and ‘phantom’ without narrowing φάντασμα to a doctrinally defined category.
