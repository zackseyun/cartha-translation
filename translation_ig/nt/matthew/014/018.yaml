  text: ὁ δὲ εἶπεν· Φέρετέ μοι ⸂ὧδε αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/018.yaml
  text: But he said[a], “Bring them here to me.”
translation:
  language: ig
  text: Ma ọ sịrị[a], “Wetaranụ m ha n’ebe a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, achịcha na azụ ndị a kpọrọ aha n’amaokwu nke bu ụzọ.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: δὲ bụ njikọ dị nro; “Ma” na-egosi ọdịiche dị n’etiti ihe ndị na-eso ụzọ kwuru na nzaghachi Jizọs, n’Igbo dị mfe ma bụrụkwa nke e ji eme ihe.
- source_word: εἶπεν
  choice: ọ sịrị
  rationale: Aorist nke λέγω pụtara nanị na o kwuru; “ọ sịrị” anaghị atụkwasị echiche iwu n’elu ngwaa ahụ.
- source_word: Φέρετέ
  choice: Wetaranụ
  rationale: Ọ bụ present active imperative, onye nke abụọ ọtụtụ; “Wetaranụ” na-egosi iwu e nyere ọtụtụ mmadụ ka ha bute ihe ndị ahụ.
- source_word: μοι
  choice: nye m
  rationale: Dative μοι na-egosi onye a na-ewetara ihe; “nye m” bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: ὧδε
  choice: n’ebe a
  rationale: ὧδε bụ adverb ebe pụtara “ebe a”; okwu a na-echekwa ntụaka kpọmkwem banyere ebe ahụ.
- source_word: αὐτούς
  choice: ha
  rationale: N’agbanyeghị na nnọchiaha Grik ahụ bụ masculine plural, ihe ọ na-ezo aka na ya n’ebe a bụ achịcha na azụ ndị a kpọrọ aha n’amaokwu bu ụzọ; “ha” na-ezo aka n’ihe ndị ahụ n’ụzọ nkịtị n’Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji ụdị ọtụtụ mmadụ “Wetaranụ” chekwaa ọnụọgụ dị na iwu Grik ahụ; akara nkọwa [a] sochiri ngwaa okwu dịka o si dị na oyi akwa ntụnyere Bekee.
