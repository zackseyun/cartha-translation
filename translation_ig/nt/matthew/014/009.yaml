  - severity: low
    issue: Nkọwa ala peeji a kwuru “ndị ha na ya.”
    rationale: Ngwakọta a adịghị edo anya; ọ ga-abụ “ndị ha na eze ahụ...” ma ọ bụ “ndị ya na eze ahụ...” ka onye a na-ekwu maka ya doo anya.
  - severity: low
