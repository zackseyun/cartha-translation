  verdict: revise
  source_fidelity: 'Isi ahịrị ahụ na-enye echiche Grik ahụ nke ọma: eze ahụ nwere mwute, ma iyi ya na ndị ya na ha riri nri mere ka o nye iwu. Otú ọ dị, “ka e nye ya” na-etinye onye nnata (“ya”) n’isi ahịrị, ebe Grik hapụrụ ihe a ga-enye n’amaghị aha, na-ekwughịkwa onye nnata n’amaokwu a. A pụrụ ide ya n’ụzọ na-ahapụ ellipsis ahụ n’Igbo.'
  naturalness: “Obi wutere eze ahụ” na “o nyere iwu” bụ Igbo Standard dị mma ma dị mfe nghọta. “Ndị ya na ha nọ na-eri nri” dịkwa mma, mana nkọwa ala peeji a nwere “ndị ha na ya,” nke na-adịghị edo anya ma kwesịkwara idozi ya.
  terminology: “eze,” “iyi,” na “nyere iwu” dabara nke ọma. Nkọwa banyere ndị “na-adabere n’akụkụ tebụl” kwesịrị ịkọwa ihe συνανακειμένους pụtara n’enweghị usoro Igbo na-adịghị eke.
