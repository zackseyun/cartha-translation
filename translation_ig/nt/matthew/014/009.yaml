translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ihe a ga-enye n’amaghị aha dịka ọ dị na Grik, ma kọwaa ya n’ala peeji; e tinyekwara nkọwa omenala gbasara ọnọdụ ndị na-eri nri n’ala peeji kama ime ka isi okwu sie ike.
