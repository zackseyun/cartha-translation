  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: ig
  text: Obi wutere eze ahụ, ma n’ihi iyi ndị ọ ṅụrụ na ndị ya na ha nọ na-eri nri[a], o nyere iwu ka e nye ihe ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ya na eze ahụ dinara n’akụkụ tebụl.” Okwu Grik ahụ na-ezo aka n’omenala nke ịdina n’akụkụ tebụl mgbe a na-eri nri n’oge ahụ.
    reason: cultural_note
  - marker: b
    text: N’asụsụ Grik, a kpọghị ihe a ga-enye aha; ọ na-ezo aka n’ihe a rịọrọ n’amaokwu bu ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: Obi wutere
  rationale: Nkebi a na-egosi na eze ahụ nwere mwute. “Obi wutere” bụ ụzọ Igbo kwụ ọtọ ma dịkwa mma isi kwuo ọnọdụ mwute ahụ, ebe “ma” na-egosi na ihe o mere mechara megidere mwute ya.
- source_word: ὁ βασιλεὺς
  choice: eze ahụ
  rationale: βασιλεύς pụtara “eze”; “ahụ” na-arụ ọrụ ngosi nke mkpụrụokwu Grik ahụ ma na-ezo aka na Herọd a kpọtụrụla aha.
- source_word: διὰ τοὺς ὅρκους
  choice: n’ihi iyi ndị ọ ṅụrụ
  rationale: διά ya na accusative na-egosi ihe kpatara omume ahụ, ebe ὅρκους bụ iyi e ji okwu ṅụọ. Nsụgharị a debere ụdị ọtụtụ nke okwu Grik ahụ.
- source_word: τοὺς συνανακειμένους
  choice: ndị ya na ha nọ na-eri nri
  rationale: Okwu a na-ezo aka ná ndị ha na ya nọkọrọ na nri, bụ́ ndị na-adabere n’akụkụ mgbe ha na-eri nri dịka omenala oge ahụ. Isi okwu ahụ na-eji Igbo nke oge a, ebe nkọwa ala peeji na-akọwa ọnọdụ ahụ.
- source_word: ἐκέλευσεν
  choice: o nyere iwu
  rationale: κελεύω pụtara inye iwu ma ọ bụ ịtụ iwu; “nyere iwu” bụ okwu Igbo doro anya ma dabara n’ụdị akụkọ a.
- source_word: δοθῆναι
  choice: ka e nye ya
  rationale: Infinitive a bụ nke passive, “ka e nye.” Grik akpọghị ihe a ga-enye aha. Igbo “ka e nye ya” na-egosi onye a ga-enye ya ma hapụ ihe a ga-enye n’ime nghọta sitere n’amaokwu bu ụzọ.
