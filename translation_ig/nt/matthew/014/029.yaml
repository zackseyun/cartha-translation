source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: ig
  text: Ọ sịrị, “Bịa.” Pita wee si n’ụgbọ mmiri ahụ gbadata, jee ije n’elu mmiri, bịakwuru Jizọs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịsụgharị ya, “bịarute Jizọs.” Okwu Grik ahụ na-egosi na Pita na-aga n’ebe Jizọs nọ; ọ naghị ekwusi ike n’ahịrịokwu a na o reru Jizọs.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθέ
  choice: Bịa
  rationale: Ọ bụ iwu kpọmkwem e nyere otu onye. “Bịa” bụ okwu Igbo dị nkenke ma bụrụkwa nke sitere n’usoro okwu Grik ahụ pụta nke ọma.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: si n’ụgbọ mmiri ahụ rịdata
  rationale: Nke a na-egosi na Pita si n’ụgbọ mmiri ahụ gbadata tupu ya agaa ije. Usoro a bụ Igbo nkịtị ma na-edobe usoro ihe ndị mere.
- source_word: πλοίου
  choice: ụgbọ mmiri
  rationale: N’ọnọdụ akụkọ a nke dị n’Ọdọ Mmiri Galili, “ụgbọ mmiri” bụ okwu Igbo kwesịrị ekwesị ma doo anya.
- source_word: περιεπάτησεν
  choice: jee ije
  rationale: N’ebe a, ngwaa ahụ pụtara ịga ije n’ụzọ nkịtị; ọ dịghị mkpa ịgbakwụnye na ọ ‘malitere’ ije, n’ihi na nke ahụ adịghị n’okwu Grik.
- source_word: ἐπὶ τὰ ὕδατα
  choice: n’elu mmiri
  rationale: Nke a na-egosi na ọ na-aga ije n’elu mmiri. Igbo na-ejikarị “mmiri” dịka aha mkpokọta n’ọnọdụ a.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: bịakwuru Jizọs
  rationale: “Bịakwuru” na-egosi mmegharị n’ebe Jizọs nọ, ma ọ dịghị amanye echiche na Pita eruola ya kpamkpam.
- source_word: δὲ
  choice: Ọ sịrị
  rationale: δέ bụ njikọ akụkọ dị nro. N’Igbo, ịga n’ihu ozugbo na “Ọ sịrị” na-eme ka akụkọ ahụ dị ire n’ọnụ n’enweghị ịmepụta ọdịiche siri ike nke okwu Grik ahụ na-achọghị.
theological_decisions:
- issue: Ma Pita ọ bịarutere Jizọs kpamkpam ka ọ̀ bụ naanị na ọ na-aga n’ebe ọ nọ
  choice: bịakwuru Jizọs
  alternative: bịarute Jizọs
  rationale: πρός na-egosi ntụziaka n’ebe Jizọs nọ, ma ahịrịokwu ahụ n’onwe ya anaghị ekwusi ike na Pita eruola ebe ọ nọ. Nsụgharị a na-edobe nhịahụ ahụ kama idozi ya n’otu ụzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe nghọta ma nwee ugwu. A họọrọ “wee” iji mee ka usoro ihe ndị mere doo anya, ebe “bịakwuru” na-edobe ntụziaka nke okwu Grik n’enweghị ikwu hoo haa na Pita eruola Jizọs.
