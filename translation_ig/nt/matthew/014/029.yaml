    reason: alternative_reading
  revision_rationale: The revision replaces an awkward verb with idiomatic Standard Igbo and repairs the footnote’s grammar. It retains “bịakwuru Jizọs” as a natural rendering of movement toward Jesus while the note preserves the source text’s directional nuance and avoids claiming a completed arrival.
