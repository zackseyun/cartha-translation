  to: Ọ sịrị, “Bịa.” Pita wee si n’ụgbọ mmiri ahụ gbadata, jee ije n’elu mmiri, bịakwuru Jizọs.[a]
  rationale: The revision replaces an awkward verb with idiomatic Standard Igbo and repairs the footnote’s grammar. It retains “bịakwuru Jizọs” as a natural rendering of movement toward Jesus while the note preserves the source text’s directional nuance and avoids claiming a completed arrival.
  reviewer_model: gpt-5.6-terra
