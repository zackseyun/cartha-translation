- from: Ozugbo ahụ, ọ manyere ndị na-eso ụzọ ya ka ha banye n'ụgbọ mmiri buru ya ụzọ gaa n'akụkụ nke ọzọ, ka ọ na-achụsasị ìgwè mmadụ ahụ.
  to: Ozugbo ahụ, ọ manyere ndị na-eso ụzọ ya ka ha banye n’ụgbọ mmiri buru ya ụzọ gaa n’akụkụ nke ọzọ, ruo mgbe ọ ga-ezipụ ìgwè mmadụ ndị ahụ laa.
  rationale: The final clause has been revised to express the prospective temporal limit in ἕως οὗ ἀπολύσῃ and the contextual sense of ἀπολύω, ‘send away/dismiss.’ All other wording is retained because it faithfully and naturally represents the Greek.
