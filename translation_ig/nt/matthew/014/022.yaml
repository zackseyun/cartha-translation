id: MAT.14.22
reference: Matthew 14:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: ig
  text: Ozugbo ahụ, ọ manyere ndị na-eso ụzọ ya ka ha banye n’ụgbọ mmiri buru ya ụzọ gaa n’akụkụ nke ọzọ, ruo mgbe ọ ga-ezipụ ìgwè mmadụ ndị ahụ laa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: Ozugbo ahụ
  rationale: Na-egosi na ihe a mere n'egbughị oge ma na-edobe ọsọ akụkọ Matiu.
- source_word: ἠνάγκασεν
  choice: ọ manyere
  rationale: Na-echekwa echiche nke ime ka mmadụ mee ihe site ná nkwụsi ike ma ọ bụ mmanye siri ike, n'ebughị n'uche na e ji ike anụ ahụ mee ya.
- source_word: τοὺς μαθητάς
  choice: ndị na-eso ụzọ ya
  rationale: Ụdị a bụ asụsụ Igbo doro anya maka ndị ahụ a maara dị ka ndị na-eso Jizọs; mkpụrụokwu 'ya' na-eme ka njikọ ahụ doo anya n'Igbo n'agbanyeghị na ọ bụ isiokwu gbara ya gburugburu na-egosi ya na Grik.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: ka ha banye n'ụgbọ mmiri
  rationale: Nke a bụ ụzọ Igbo e ji ekwu ịbanye ma ọ bụ ịrị n'ụgbọ mmiri.
- source_word: πλοῖον
  choice: ụgbọ mmiri
  rationale: Asụsụ Igbo anaghị achọ isiokwu pụrụ iche dịka Bekee; ọnọdụ akụkọ ahụ na-egosi ụgbọ mmiri a kapịrị ọnụ.
- source_word: προάγειν αὐτόν
  choice: buru ya ụzọ gaa
  rationale: Na-egosi kpọmkwem na ndị na-eso ụzọ ga-eburu Jizọs ụzọ pụọ.
- source_word: εἰς τὸ πέραν
  choice: gaa n'akụkụ nke ọzọ
  rationale: Ọ bụ okwu Igbo doro anya maka ịga n'akụkụ mmiri nke chere ihu.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: ka ọ na-achụsasị
  rationale: Nhazi 'ka ... na-' na-egosi ihe Jizọs ga-anọ na-eme n'oge ndị na-eso ụzọ na-eburu ya ụzọ, n'ụzọ dị mma n'Igbo.
- source_word: ἀπολύσῃ τοὺς ὄχλους
  choice: ọ na-achụsasị ìgwè mmadụ ahụ
  rationale: N'ebe a ἀπολύω pụtara ikwe ka ndị mmadụ laa ma ọ bụ izipụ ha; 'ịchụsasị' na-ekwupụta nke a n'ụzọ dị nkenke na nke eke.
- source_word: τοὺς ὄχλους
  choice: ìgwè mmadụ ahụ
  rationale: N'Igbo, aha nchịkọta a na-ekwupụta ọtụtụ ìgwè mmadụ ndị ahụ n'ụzọ dị mfe ma kwekọọ n'ọnọdụ akụkọ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji 'manyere' chekwaa ike dị na ἠνάγκασεν, ebe ahịrịokwu ikpeazụ ka e mere ka ọ na-ada nke ọma n'Igbo n'enweghị ịgbakwụnye nkọwa okpukpe.
