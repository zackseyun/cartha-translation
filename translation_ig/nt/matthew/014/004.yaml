revisions:
- from: N’ihi na Jọn nọ na-agwa ya, “O zighị ezi n’iwu ka i were ya[a].”
  to: N’ihi na Jọn nọ na-agwa ya, “Iwu anaghị ekwe ka i nwee ya[a].”
  rationale: The revision preserves the explanatory connective and the ongoing past action of John’s repeated warning. It replaces an awkward legal idiom with a natural Standard Igbo impersonal-prohibition construction and renders ἔχειν with “nwee,” avoiding unnecessary expansion while preserving the contextual relationship sense.
  reviewer_model: gpt-5.6-terra
