  text: ἔλεγεν γὰρ ⸂αὐτῷ ὁ Ἰωάννης⸃· Οὐκ ἔξεστίν σοι ἔχειν αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: ig
  text: N’ihi na Jọn nọ na-agwa ya, “Iwu anaghị ekwe ka i nwee ya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “E kweghị ka i nwee ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: nọ na-agwa
  rationale: Ụdị ngwaa imperfect na-egosi omume gara aga nke na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro; ‘nọ na-agwa’ na-egosipụta nke a n’Igbo nkịtị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Okwu a na-enye ihe kpatara ma ọ bụ nkọwa banyere ihe e kwuru n’amaokwu bu ụzọ.
- source_word: αὐτῷ
  choice: ya
  rationale: N’usoro ‘na-agwa ya,’ ‘ya’ bụ onye Jọn na-agwa, dịka dative nke Grik si egosi.
- source_word: ὁ Ἰωάννης
  choice: Jọn
  rationale: Ederede Grik kpọrọ ya naanị Jọn; amaokwu ndị gbara ya gburugburu emeela ka onye ọ bụ doo anya.
- source_word: Οὐκ ἔξεστίν
  choice: O zighị ezi n’iwu
  rationale: Nke a na-echekwa echiche nke ihe iwu na-akwadoghị, ma ghara ime ka ọ bụrụ naanị echiche mmadụ banyere ihe kwesịrị ekwesị.
- source_word: σοι
  choice: ka i
  rationale: Nke a bụ ụzọ Igbo si ekwu onye mmachibido iwu ahụ metụtara n’ụzọ dị mma ma doo anya.
- source_word: ἔχειν
  choice: were
  rationale: ‘Were’ na-echekwa okwu sara mbara nke Grik banyere ịnwe nwanyị ahụ, ebe ọnọdụ akụkọ ahụ na-egosi mmekọrịta alụmdi na nwunye n’ebughị ụzọ tinye nkọwa ahụ kpọmkwem.
- source_word: αὐτήν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’Herodias ozugbo, dịka nnọchiaha Grik si eme.
theological_decisions:
- issue: Ụdị ịba mba Jọn baara ya
  choice: O zighị ezi n’iwu ka i were ya.
  alternative: E kweghị ka i were ya.
  rationale: Nhọrọ bụ isi na-egosipụta ịdị n’iwu ma ọ bụ enweghị ya nke ἔξεστιν; ntụgharị ọzọ na-echekwa echiche sara mbara nke ikike ma ọ bụ nkwenye. E tinyeghị iwu kpọmkwem ma ọ bụ nkọwa okpukpe ọzọ na-adịghị n’amaokwu ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị mfe nghọta ma nwee ugwu. ‘Nọ na-agwa’ na-egosipụta omume na-aga n’ihu; ‘were ya’ na-ahapụ okwu Grik ka ọ dị sara mbara, ebe ọnọdụ akụkọ na-eme ka ihe gbasara mmekọrịta alụmdi na nwunye doo anya.
