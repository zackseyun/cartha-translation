review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents γάρ as explanatory, preserves the imperfect/durative sense of ἔλεγεν with “nọ na-agwa,” and retains the indirect object “ya.” Its main clause, however, is less idiomatic and less precise: “O zighị ezi n’iwu” can sound like a general judgment that something is wrong according to law, rather than the impersonal prohibition expressed by οὐκ ἔξεστίν.'
  naturalness: “Jọn nọ na-agwa ya” is natural in this narrative setting. “Iwu anaghị ekwe ka i nwee ya” is more natural Standard Igbo than “O zighị ezi n’iwu ka i were ya.” It directly expresses legal non-permission without making “were” carry an uncertain sense of taking, marrying, or obtaining.
  terminology: “Iwu anaghị ekwe” appropriately conveys the legal-moral force of ἔξεστιν in context. “Nwee ya” retains the source’s non-expanded “have her” wording and lets the preceding context supply the marital referent.
  issues:
  - severity: medium
    issue: The phrase “O zighị ezi n’iwu” is not the most idiomatic rendering of the impersonal prohibition οὐκ ἔξεστίν.
    rationale: It may be understood as a general assertion of incorrectness rather than “the law does not permit it.” A construction with “iwu anaghị ekwe” better preserves both the legal force and the impersonal syntax.
  - severity: low
    issue: “Were ya” is broader and potentially less clear than the source-oriented marital/relational sense intended here.
    rationale: In Igbo, “were” can evoke taking or marrying, whereas “nwee ya” corresponds more closely to ἔχειν (“have”) while retaining the contextual implication.
  revised_text: N’ihi na Jọn nọ na-agwa ya, “Iwu anaghị ekwe ka i nwee ya[a].”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “E kweghị ka i nwee ya.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the explanatory connective and the ongoing past action of John’s repeated warning. It replaces an awkward legal idiom with a natural Standard Igbo impersonal-prohibition construction and renders ἔχειν with “nwee,” avoiding unnecessary expansion while preserving the contextual relationship sense.
