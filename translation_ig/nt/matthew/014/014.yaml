reference: Matthew 14:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: ig
  text: Mgbe o si n’ụgbọ mmiri rịpụta[a], ọ hụrụ nnukwu igwe mmadụ. O nwere ọmịiko n’ebe ha nọ[b], gwọọkwa ndị nọ n’etiti ha na-arịa ọrịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara kpọmkwem n’okwu Grik, “mgbe o pụtara” ma ọ bụ “mgbe o si pụta.” N’ọnọdụ akụkọ a, o yikarịrị ka ọ na-ekwu maka ịpụ n’ụgbọ mmiri rute n’ikpere mmiri.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “obi ebere metụrụ ya n’ihi ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Mgbe ọ rịpụtara n’ụgbọ mmiri
  rationale: Okwu a pụtara n'ụzọ nkịtị ‘mgbe ọ pụtara.’ N’ọnọdụ akụkọ a, Jizọs si n’ụgbọ mmiri pụta, ya mere nsụgharị a na-eme ka ihe ahụ doo anya n’Igbo nkịtị, ebe ndetu ala na-echekwa nkọwa sara mbara nke okwu Grik.
- source_word: εἶδεν
  choice: ọ hụrụ
  rationale: Nke a bụ nsụgharị Igbo kwụ ọtọ ma bụrụkwa nke e ji ekwu okwu kwa ụbọchị maka ịhụ mmadụ ma ọ bụ ihe.
- source_word: πολὺν ὄχλον
  choice: nnukwu igwe mmadụ
  rationale: ‘Igwe mmadụ’ na-egosi ọtụtụ mmadụ gbakọrọ ọnụ, ebe ‘nnukwu’ na-echekwa ike nke πολύς.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: O nwere ọmịiko n’ahụ ha
  rationale: Nkebiokwu a na-egosi ọmịiko miri emi. Nsụgharị ahụ bụ Igbo doro anya ma na-echekwa njikọ dị n’etiti mmetụta Jizọs na ọgwụgwọ o mere.
- source_word: ἐθεράπευσεν
  choice: gwọọkwa
  rationale: θεραπεύω n’ebe a na-ekwu maka ime ka ndị ọrịa gbakee; ‘gwọọ’ bụ okwu Igbo kwesịrị ekwesị ma bụrụ nke a na-aghọta ngwa ngwa.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: ndị nọ n’etiti ha na-arịa ọrịa
  rationale: Nke a na-egosi n’Igbo ebumpụta ụwa na ndị a bụ ndị ọrịa so n’igwe mmadụ ahụ, na-enweghị ime ka ‘ndị ọrịa ha’ yie ka ha bụ ihe ha nwere.
theological_decisions:
- issue: Otú e si kọwaa mmetụta Jizọs
  choice: O nwere ọmịiko n’ahụ ha
  alternative: Obi ebere metụrụ ya n’ihi ha
  rationale: Nhọrọ a na-echekwa isi okwu ahụ—ọmịiko Jizọs kpaliri ọgwụgwọ ya—ma ọ naghị etinye nkọwa mmetụta ọzọ na-adịghị n’amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. E kewara ahịrịokwu ahụ ụzọ abụọ ka ọ na-aga nke ọma n’Igbo, ma a hapụrụ njikọ dị n’etiti ọmịiko Jizọs na ọgwụgwọ ndị ọrịa ka o doo anya.
