  to: Mgbe o si n’ụgbọ mmiri rịpụta[a], ọ hụrụ nnukwu igwe mmadụ. O nwere ọmịiko n’ebe ha nọ[b], gwọọkwa ndị nọ n’etiti ha na-arịa ọrịa.
  rationale: The revision preserves the draft’s faithful contextual rendering and its concise, modern register. It replaces two less idiomatic constructions with natural Standard Igbo, without adding theological interpretation. Footnote a retains the Greek participle’s broader sense and notes that the boat/shore wording is contextually inferred.
