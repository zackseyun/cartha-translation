review_pass:
  verdict: revise
  source_fidelity: The main clause accurately represents the antecedent aorist participle and the arrival at the land of Gennesaret. However, “n’ofe mmiri” (“across the water”) adds an explicit object not stated in this verse; the participle simply says “having crossed over.”
  naturalness: “Mgbe ha gafesịrị, ha rutere n’ala Genesaret” is concise, natural Standard Igbo, and retains the verse’s elevated but straightforward narrative register.
  terminology: “Genesaret” is an appropriate Igbo-form transliteration of Γεννησαρέτ. “Rutere n’ala Genesaret” suitably conveys arrival at the land/shore in the Gennesaret region without turning the name into a more specific administrative designation.
  issues:
  - severity: low
    issue: The translation adds “mmiri” in “gafesịrị n’ofe mmiri.”
    rationale: The wider narrative concerns a boat crossing, but διαπεράσαντες in this verse does not expressly name water. Removing it better preserves the source’s economy.
  - severity: medium
    issue: The footnote’s proposed alternative, “n’ala dị na Genesaret,” makes the land explicitly located in Gennesaret and does not clearly reflect the Greek’s compressed, somewhat awkward combination of ἐπὶ τὴν γῆν and εἰς Γεννησαρέτ.
    rationale: The note should describe the landing/arrival sense while retaining the possible relation of “land” and “Gennesaret,” rather than resolving it as a simple locative description.
  revised_text: Mgbe ha gafesịrị[a], ha rutere n’ala Genesaret.
  revised_footnotes:
