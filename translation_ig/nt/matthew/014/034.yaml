    text: A pụkwara ịsụgharị ya, “Mgbe ha gafesịrị, ha rutere n’ala, na Genesaret.” Okwu Grik ahụ jikọtara “n’ala” na “na Genesaret,” ma na-egosi na ha rutere n’ala ma ọ bụ n’ikpere mmiri n’ógbè Genesaret.
    reason: lexical_alternative
  revision_rationale: Removed the source-unspecified “water” from the rendering of διαπεράσαντες. The footnote has been recast so that it explains the Greek destination phrasing without imposing a more definite geographical relationship than the text warrants.
