  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ διαπεράσαντες ἦλθον ⸂ἐπὶ τὴν γῆν εἰς⸃ Γεννησαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/034.yaml
  text: And after crossing over[a], they came to the land of Gennesaret.
translation:
  language: ig
  text: Mgbe ha gafesịrị[a], ha rutere n’ala Genesaret.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Mgbe ha gafesịrị, ha rutere n’ala, na Genesaret.” Okwu Grik ahụ jikọtara “n’ala” na “na Genesaret,” ma na-egosi na ha rutere n’ala ma ọ bụ n’ikpere mmiri n’ógbè Genesaret.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: Mgbe ha gafesịrị n’ofe mmiri
  rationale: Aorist participle na-egosi ihe mere tupu ngwaa bụ isi. N’ọnọdụ akụkọ a, ‘gafesịrị n’ofe mmiri’ na-eme ka njem ụgbọ mmiri doo anya n’Igbo, n’agbanyeghị na ‘mmiri’ adịghị kpọmkwem n’okwu Grik.
- source_word: ἦλθον
  choice: ha rutere
  rationale: ‘Rutere’ bụ ụzọ Igbo si ekwu ọbịbịa n’ebe njem na-aga, ma kwekọọ nke ọma na nkebi na-akọ ebe ha bịarutere.
- source_word: ἐπὶ τὴν γῆν
  choice: n’ala
  rationale: Ọ na-edobe echiche nkịtị nke ‘n’elu/n’ala’ ma n’ọnọdụ njem mmiri na-egosi na ha bịarutere n’ala.
- source_word: εἰς Γεννησαρέτ
  choice: Genesaret
  rationale: Aha ebe ahụ so ‘n’ala’ wee kọwaa ebe ha rutere; nhazi Igbo na-enye ‘n’ala Genesaret’ n’enweghị ịmanye ma ọ bụ obodo kpọmkwem ma ọ bụ mpaghara kpọmkwem.
- source_word: Γεννησαρέτ
  choice: Genesaret
  rationale: E dere aha ebe Grik ahụ n’ụdị dabara ụda na odide Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ugwu. A họọrọ ‘rutere’ kama ‘bịara’ n’ihi na ọ bụ okwu ebumpụta ụwa maka iru ebe njem na-aga. Ihe odide bụ nkenke dịka amaokwu Grik ahụ.
