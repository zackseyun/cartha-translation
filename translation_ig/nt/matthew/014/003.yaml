  verdict: revise
  source_fidelity: The verse’s sequence and causal relation are preserved, but “kee ya agbụ” specifies chains, whereas ἔδησεν says only that Herod bound John. The relationship phrase is also clearer if it explicitly identifies Philip as Herod’s brother.
  naturalness: The draft is generally clear Standard Igbo. Removing “agbụ” gives a more source-controlled expression, and appositive punctuation improves readability.
  terminology: Herọd, Jọn, Herọdias, Filip, ụlọ mkpọrọ, and nwunye are suitable. “Kee ya” renders ‘bound him’ without adding an unspecified instrument.
  issues:
  - severity: medium
    issue: “kee ya agbụ” adds chains.
    rationale: The Greek ἔδησεν means ‘bound’; it does not specify that chains were used. The translation should not add that detail.
  - severity: low
    issue: “Filip nwanne ya nwoke” leaves the possessive reference somewhat less explicit.
    rationale: The Greek identifies Philip as Herod’s brother. “Filip, nwanne Herọd nwoke” states this plainly in Igbo.
  revised_text: N’ihi na Herọd jidere Jọn[a], kee ya, ma tinye ya n’ụlọ mkpọrọ n’ihi Herọdias, nwunye Filip, nwanne Herọd nwoke.
