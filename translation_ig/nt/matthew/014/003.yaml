id: MAT.14.3
reference: Matthew 14:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: ig
  text: N’ihi na Herọd jidere Jọn[a], kee ya, ma tinye ya n’ụlọ mkpọrọ n’ihi Herọdias, nwunye Filip, nwanne Herọd nwoke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe Herọd jidesịrị Jọn ... tinye ya n’ụlọ mkpọrọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-egosi na amaokwu a na-akọwa ihe kpatara ihe e kwuru n’amaokwu bu ya ụzọ.
- source_word: κρατήσας
  choice: jidere
  rationale: N’ọnọdụ a, okwu ahụ pụtara ijide mmadụ ka e tinye ya n’okpuru nche; Igbo a dị mfe ma kwekọọ n’ihe gbasara mkpọrọ.
- source_word: ἔδησεν
  choice: kee ya agbụ
  rationale: Na-edobe echiche doro anya nke ịkpọchi mmadụ agbụ, n’agbanyeghị na isi mmalite ekwughị kpọmkwem ụdị agbụ ahụ.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: tinye ya n’ụlọ mkpọrọ
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọwa itinye mmadụ n’ime mkpọrọ.
- source_word: διὰ Ἡρῳδιάδα
  choice: n’ihi Herọdias
  rationale: διά tinyere accusative na-egosi ihe kpatara omume ahụ.
- source_word: γυναῖκα
  choice: nwunye
  rationale: N’usoro mmekọrịta a, γυνή pụtara nwunye, ọ bụghị naanị nwanyị.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: Filip nwanne ya nwoke
  rationale: Na-eme ka o doo anya na Filip bụ nwanne Herọd nwoke, ma na-edobe njikọ ya na Herọdias dị ka nwunye Filip.
theological_decisions:
- issue: Otú e si kọwaa mmekọrịta Herọdias na Filip
  choice: Herọdias, nwunye Filip nwanne ya nwoke
  alternative: Herọdias, nwunye nwanne ya nwoke Filip
  rationale: Amaokwu a na-akọwa naanị onye Herọdias bụ site na mmekọrịta ya na Filip; ọ naghị ekwu n’ebe a kpọmkwem na mmekọrịta ahụ megidere iwu. Ya mere, a naghị ebute ikpe omume nke amaokwu na-esote ụzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “jidere” maka ọnọdụ njide mmadụ, ebe nkọwa ala peeji na-echekwa usoro participle nke Grik n’ụzọ pụtara ihe kpọmkwem.
