  to: N’ihi na Herọd jidere Jọn[a], kee ya, ma tinye ya n’ụlọ mkpọrọ n’ihi Herọdias, nwunye Filip, nwanne Herọd nwoke.
  rationale: The revision removes the added specification of chains while retaining the arrest, binding, imprisonment, causal force, and neutral historical identification of Herodias. It also makes explicit that Philip was Herod’s brother, without importing the judgment stated in the following verse.
