  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: ig
  text: Ha niile riri, afọ jukwara ha; ha chịkọtara nkata iri na abụọ jupụtara n’iberibe[a] ndị fọdụrụnụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mpempe.” Okwu Grik ahụ nwere ike ịpụta iberibe e nyawara nke fọdụrụ mgbe e richara nri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: wee rie
  rationale: Oge aorist n’akụkọ a na-egosi omume mere n’usoro akụkọ; “wee rie” bụ ụzọ Igbo si egosi nke a n'ụzọ eke.
- source_word: πάντες
  choice: Ha niile
  rationale: Nke a na-eme ka onye a na-ekwu banyere ya pụta ìhè ma na-echekwa echiche na onye ọ bụla n’ìgwè ahụ riri.
- source_word: ἐχορτάσθησαν
  choice: rijuokwa afọ
  rationale: χορτάζω n’ebe a pụtara na e nyere ha nri ruo mgbe afọ juru ha; okwu a bụ Igbo doro anya ma bụrụkwa nke a na-asụkarị.
- source_word: ἦραν
  choice: chịkọta
  rationale: Ọ bụ ezie na αἴρω nwere ike ịpụta ibuli ma ọ bụ iwepụ, n’ọnọdụ a ọ na-ekwu maka ịnakọta ihe fọdụrụ mgbe e richara nri.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: iberibe ndị fọdụrụnụ
  rationale: Nke a na-egosi iberibe e nyawara nke fọdụrụ mgbe nri gachara, na-enweghị ịkọwapụta ihe Grik ahụ na-ekwughị kpọmkwem.
- source_word: δώδεκα κοφίνους πλήρεις
  choice: ha ejupụta nkata iri na abụọ
  rationale: Nhazi a na-egosi nke ọma na iberibe ndị ahụ zuru iji jupụta nkata iri na abụọ.
theological_decisions:
- issue: Nkọwa njupụta afọ n’ọrụ ebube nke inye ìgwè mmadụ nri
  choice: rijuokwa afọ
  alternative: rijupụtakwa
  rationale: Nhọrọ a na-echekwa nkọwa nkịtị nke na ha riri ruo mgbe afọ juru ha, na-agbakwụghị nkọwa okpukpe ọzọ n’elu ederede ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. “Ha niile wee rie” na “rijuokwa afọ” na-agbaso usoro akụkọ Igbo eke; e debere ihe odide ala ala peeji iji kọwaa obosara nkọwa κλασμάτων.
