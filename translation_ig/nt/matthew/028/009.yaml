revisions:
- from: Ma lee, Jizọs zutere ha wee sị, “Ekele dịrị unu!” Ha bịaruru ya nso, jide ya n’ụkwụ, kpọọkwa isiala nye ya.[a]
  to: Ma lee, Jizọs zutere ha wee sị, “Ekele!” Ha bịakwutere ya, jidesiri ụkwụ ya ike, kpọọkwa isiala nye ya.[a]
  rationale: The revisions clarify that the women grasped Jesus’ own feet, use an idiomatic Igbo greeting, and smooth the explanatory footnote. The main rendering continues to preserve the source verb’s possible range between physical prostration/homage and worship, with the contextual alternative stated in the note.
