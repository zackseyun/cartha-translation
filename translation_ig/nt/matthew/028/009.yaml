  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ἰδοὺ Ἰησοῦς ⸀ὑπήντησεν αὐταῖς λέγων· Χαίρετε· αἱ δὲ προσελθοῦσαι ἐκράτησαν αὐτοῦ τοὺς πόδας καὶ προσεκύνησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: ig
  text: Ma lee, Jizọs zutere ha wee sị, “Ekele!” Ha bịakwutere ya, jidesiri ụkwụ ya ike, kpọọkwa isiala nye ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “fee ya ofufe.” Okwu Grik a, προσεκύνησαν, nwere ike ịpụta ịkpọ isiala ma ọ bụ inye nsọpụrụ; n’ihi ọnọdụ mbilite n’ọnwụ a, ọ pụkwara igosi ofufe.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: Na-edobe ọrụ okwu ahụ dị ka ihe na-adọta uche ma na-eme ka akụkọ ahụ dị ndụ n’ụzọ Igbo si ekwu okwu.
- source_word: ὑπήντησεν
  choice: zutere ha
  rationale: Nke a na-egosi n'ụzọ dị mfe na Jizọs zutere ụmụanyị ahụ n'ụzọ, na-etinyeghị nkọwa ntụziaka nke ngwaa ahụ ekwughị kpọmkwem.
- source_word: Χαίρετε
  choice: Ekele dịrị unu!
  rationale: Ọ bụ ezie na ọdịdị okwu Grik ahụ bụ iwu nye ọtụtụ mmadụ ka ha ṅụrịa, n'ebe a ọ na-arụ ọrụ dị ka ekele; nsụgharị a bụ ekele sitere n'ọnụ Jizọs nye ọtụtụ ụmụanyị.
- source_word: προσελθοῦσαι
  choice: Ha bịaruru ya nso
  rationale: 'Na-egosi usoro ihe mere: ha buru ụzọ bịaruo Jizọs nso tupu ha ejide ụkwụ ya ma kpọọ isiala.'
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: jide ya n’ụkwụ
  rationale: Na-edobe mmetụ ahụ doro anya na nke anụ ahụ, n'ejighị okwu nwere echiche ime ihe ike.
- source_word: προσεκύνησαν αὐτῷ
  choice: kpọọkwa isiala nye ya
  rationale: Akpaokwu Igbo a nwere ike ịpụta ịkpọ isiala n'ụzọ a na-ahụ anya nakwa inye nsọpụrụ dị omimi, ya mere ọ na-echekwa obosara ihe προσκυνέω nwere ike ịpụta n'ọnọdụ a.
theological_decisions:
- issue: Nsụgharị προσκυνέω n'ebe Jizọs ahụ e mere ka o si n'ọnwụ bilie nọ
  choice: kpọọ isiala nye ya
  alternative: fee ya ofufe
  rationale: Ọnọdụ mbilite n'ọnwụ na-eme ka ofufe bụrụ nghọta siri ike ma kwe omume, ma ngwaa Grik ahụ nwekwara ike ịpụta ịkpọ isiala ma ọ bụ inye nsọpụrụ. Isi ederede na-edobe mmegharị ahụ na mgbagwoju ihe ọ pụtara, ebe nkọwa ala peeji na-egosi nghọta nke ofufe.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “Ma lee” chekwaa ihe na-adọta uche n’akụkọ ahụ, ma jiri “kpọọ isiala” chekwaa ma omume ahụ a hụrụ anya ma nghọta okpukpe nwere ike ịdị na ya.
