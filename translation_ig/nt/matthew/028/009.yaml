review_pass:
  verdict: revise
  source_fidelity: A safe revision is needed. The draft correctly retains the attention marker, Jesus’ meeting the women, their approach, physical contact with his feet, and their act of prostration/homage. However, “jide ya n’ụkwụ” can mean holding Jesus by the feet rather than explicitly taking hold of his feet; “jidesiri ụkwụ ya ike” is precise. “Ekele dịrị unu!” is less idiomatic as a direct greeting than “Ekele!” and can sound like a benediction.
  naturalness: “Ma lee” and “Ha bịakwutere ya” are natural, clear Standard Igbo in this narrative register. “Jidesiri ụkwụ ya ike” clearly expresses firm physical grasp. “Kpọọkwa isiala nye ya” is natural and retains the visible act without prematurely resolving the full force of προσκυνέω.
  terminology: “Kpọọ isiala nye ya” appropriately preserves the lexical range of προσκυνέω in the main text. The note supplies “fee ya ofufe” as a viable contextual rendering, while avoiding a doctrinally imposed resolution. The footnote is revised for natural Standard Igbo and to identify the Greek verb clearly.
  issues:
  - severity: medium
    issue: “jide ya n’ụkwụ” is syntactically ambiguous.
    rationale: It may be understood as ‘held him by the feet,’ whereas the Greek explicitly says that they took hold of his feet. “jidesiri ụkwụ ya ike” states the object plainly and preserves κρατέω’s sense of firm grasp.
  - severity: low
    issue: “Ekele dịrị unu!” is not the most natural rendering of a spoken greeting here.
    rationale: It can sound like a wish or benediction. “Ekele!” functions more naturally as a plural-directed greeting in this context while retaining the salutation force of χαίρετε.
  - severity: low
    issue: The footnote’s wording about the resurrection context is awkward.
    rationale: “n’ihi ọnọdụ mbilite n’ọnwụ” naturally expresses that the contextual setting supports the ‘worship’ sense without making the main text doctrinally narrower.
  revised_text: Ma lee, Jizọs zutere ha wee sị, “Ekele!” Ha bịakwutere ya, jidesiri ụkwụ ya ike, kpọọkwa isiala nye ya.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “fee ya ofufe.” Okwu Grik a, προσεκύνησαν, nwere ike ịpụta ịkpọ isiala ma ọ bụ inye nsọpụrụ; n’ihi ọnọdụ mbilite n’ọnwụ a, ọ pụkwara igosi ofufe.
    reason: alternative_reading
  revision_rationale: The revisions clarify that the women grasped Jesus’ own feet, use an idiomatic Igbo greeting, and smooth the explanatory footnote. The main rendering continues to preserve the source verb’s possible range between physical prostration/homage and worship, with the contextual alternative stated in the note.
