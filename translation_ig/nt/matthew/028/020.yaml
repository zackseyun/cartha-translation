  to: na-akụziri ha ka ha debe ihe niile m nyere unu n’iwu. Ma lee, anọ m na unu n’ụbọchị niile, ruo na njedebe nke oge a.[a]
  rationale: Revised only for idiomatic Standard Igbo and clearer subject reference in the assurance of presence. The translation continues to preserve the source’s participial connection, command language, comprehensive scope, emphatic “lee,” day-by-day duration, and the distinction between the age and the physical world.
