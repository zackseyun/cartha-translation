  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: ig
  text: na-akụziri ha ka ha debe ihe niile m nyere unu n’iwu. Ma lee, anọ m na unu n’ụbọchị niile, ruo na njedebe nke oge a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ruo na mmezu nke oge a.” N’asụsụ Grik, okwu a na-ekwu banyere njedebe ma ọ bụ mmezu nke oge (αἰών), ọ bụghị kpọmkwem banyere njedebe nke ụwa anụ ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: διδάσκοντες
  choice: na-akụziri ha
  rationale: Nke a na-egosipụta omume na-aga n’ihu ma jikọta ya na ime ndị mmadụ ndị na-eso ụzọ n’amaokwu bu ụzọ.
- source_word: τηρεῖν
  choice: ka ha debe
  rationale: “Idebe” na-ejikọta irube isi na ilezi iwu anya, n’enweghị ime ka ọ bụrụ naanị omume a na-ahụ anya.
- source_word: πάντα ὅσα
  choice: ihe niile
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke eke isi gosipụta oke zuru ezu nke okwu Grik ahụ.
- source_word: ἐνετειλάμην
  choice: m nyere unu n’iwu
  rationale: Ọ na-echekwa ikike dị n’iwu Jizọs nyere ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” bụ okwu Igbo dị nkenke nke na-adọta uche ma na-echekwa nkwusi ike na ịdị nsọpụrụ nke okwu ahụ.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: mụ na unu nọ
  rationale: Nke a na-egosipụta ọnụnọ ya na ndị na-eso ụzọ n’ụzọ kpọmkwem ma doo anya.
- source_word: πάσας τὰς ἡμέρας
  choice: ụbọchị niile
  rationale: Nsụgharị a na-echekwa echiche nkịtị nke ‘ụbọchị niile’ na nkwa nke ọnụnọ na-adịgide kwa ụbọchị.
- source_word: συντελείας
  choice: njedebe
  rationale: “Njedebe” bụ okwu a na-aghọta ngwa ngwa nke na-egosipụta iru na mmechi zuru ezu nke oge ahụ.
- source_word: αἰῶνος
  choice: oge a
  rationale: “Oge a” na-ezo aka n’ọgbọ ma ọ bụ usoro oge, ọ bụghị kpọmkwem ụwa anụahụ.
theological_decisions:
- issue: ἕως τῆς συντελείας τοῦ αἰῶνος
  choice: ruo na njedebe nke oge a
  alternative: ruo na mmezu nke oge a; ruo na njedebe nke ụwa
  rationale: Nhọrọ a na-echekwa echiche banyere mmechi nke oge dị ugbu a ma zere ịkọwa αἰών dị ka ụwa anụahụ. “Njedebe” bụkwa okwu Igbo nke ndị nkịtị na-aghọta nke ọma.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro amaokwu ahụ dị ka akụkụ ahịrịokwu nke malitere n’amaokwu bu ụzọ; e chekwara nkwusi ike nke “lee” na nkwa nke ọnụnọ kwa ụbọchị.
