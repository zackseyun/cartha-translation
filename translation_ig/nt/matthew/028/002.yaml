review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the earthquake, the angel’s descent from heaven, approach, and sitting on the stone. However, “tụgharịa nkume ahụ” most directly means “turn the stone” and does not adequately convey ἀπεκύλισε, the removal/rolling away of the stone.
  naturalness: The sentence is generally clear and uses natural Standard Igbo narrative sequencing. “Ma lee” more fully reflects καὶ ἰδού and is an idiomatic attention-directing introduction in this register.
  terminology: “mmụọ ozi nke Onyenwe anyị” appropriately renders ἄγγελος κυρίου without importing a denominational interpretation. “ala ọma jijiji” and “eluigwe” are standard and suitable. “kwapụ nkume ahụ” naturally communicates moving the stone away in context.
  issues:
  - severity: medium
    issue: The verb used for the stone does not clearly express removal/rolling away.
    rationale: ἀπεκύλισε denotes rolling the stone away, not merely turning it. “Tụgharịa” can describe turning or rotating an object without removing it from the tomb entrance. “Kwapụ” conveys that the stone was moved away, while avoiding an unnatural over-literal construction.
  revised_text: Ma lee, nnukwu ala ọma jijiji mere, n’ihi na otu mmụọ ozi nke Onyenwe anyị si n’eluigwe rịdata, bịaruo nso, kwapụ nkume ahụ, nọdụkwa n’elu ya.
