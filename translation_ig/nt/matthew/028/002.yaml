id: MAT.28.2
reference: Matthew 28:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: ig
  text: Ma lee, nnukwu ala ọma jijiji mere, n’ihi na otu mmụọ ozi nke Onyenwe anyị si n’eluigwe rịdata, bịaruo nso, kwapụ nkume ahụ, nọdụkwa n’elu ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu a na-eji adọta uche onye na-agụ ya n’ihe dị ịtụnanya na-esochi; “Lee” bụ ụzọ Igbo dị mkpirikpi ma dịkwa ebube isi kwuo ya.
- source_word: σεισμὸς ... μέγας
  choice: nnukwu ala ọma jijiji
  rationale: Nke a na-egosi kpọmkwem ala ọma jijiji nke siri ike, ma na-agbaso usoro okwu Igbo nkịtị.
- source_word: ἄγγελος ... κυρίου
  choice: otu mmụọ ozi nke Onyenwe anyị
  rationale: “Mmụọ ozi” na-enye echiche nke onye ozi sitere n’eluigwe; “nke Onyenwe anyị” na-edobe njikọ genitive ahụ n’enweghị itinye nkọwa òtù ụka.
- source_word: καταβὰς ἐξ οὐρανοῦ
  choice: si n’eluigwe rịdata
  rationale: Ọ na-edobe mmegharị sitere n’eluigwe gbadata n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: προσελθὼν
  choice: bịaruo nso
  rationale: Okwu Grik a pụtara ịbịaru ihe ma ọ bụ onye nso; nke a ziri ezi karịa ịsị nanị na ọ “bịara elu.”
- source_word: ἀπεκύλισε τὸν λίθον
  choice: tụgharịa nkume ahụ
  rationale: Ngwaa ahụ na-akọ ịtụgharị nkume ka ọ pụọ n’ọnụ ili; “tụgharịa” na-egosipụta mmegharị nkume ahụ n’enweghị mgbakwunye ihe na-adịghị na isi mmalite.
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: nọdụkwa n’elu ya
  rationale: Ọ na-egosipụta na mmụọ ozi ahụ nọ ọdụ n’elu nkume ahụ, ma na-ejikọta omume ahụ nke ọma n’Igbo.
theological_decisions:
- issue: Njikọ ala ọma jijiji ahụ na mgbadata mmụọ ozi ahụ
  choice: n’ihi na
  alternative: mgbe
  rationale: γάρ na-enye ihe kpatara ma ọ bụ nkọwa maka ala ọma jijiji ahụ; ya mere, a hapụrụ njikọ ihe kpatara ya kama ime ya naanị ihe abụọ mere n’otu oge.
- issue: Usoro oge nke omume mmụọ ozi ahụ
  choice: rịdata, bịaruo nso, tụgharịa ... nọdụkwa
  alternative: ọ rịdatala ... ma bịaruo nso
  rationale: Aorist participles na ngwaa bụ isi na-akọ usoro ihe omume ahụ, ma ihe odide Grik anaghị amanye pluperfect. Nsụgharị a na-echekwa usoro ahụ n’enweghị ikpebi oge karịrị ihe isi mmalite kwuru.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “Onyenwe anyị” mee ihe maka κύριος n’ebe a, a zerekwa okwu pụrụ iche nke otu ụka. Enweghị ihe odide ala peeji dị mkpa maka amaokwu a.
