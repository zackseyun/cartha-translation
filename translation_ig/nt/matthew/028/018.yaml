- from: Jizọs bịakwutere ha, gwa ha sị, “E nyela m ikike niile n’eluigwe na n’ụwa.”
  to: Jizọs bịakwutere ha wee gwa ha okwu, sị, “E nyela m ikike niile n’eluigwe na n’ụwa.”
  rationale: The revision makes the narrative sequence and the act of speaking explicit in idiomatic Standard Igbo while preserving the Greek passive (‘E nyela m’), the totality of the authority (‘ikike niile’), and the heaven/earth scope. No footnote is required, since the translation has no unresolved ambiguity requiring a note.
  reviewer_model: gpt-5.6-terra
