id: MAT.28.18
reference: Matthew 28:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ Ἰησοῦς ἐλάλησεν αὐτοῖς λέγων· Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ ⸀τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: ig
  text: Jizọs bịakwutere ha wee gwa ha okwu, sị, “E nyela m ikike niile n’eluigwe na n’ụwa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθὼν
  choice: bịakwutere ha
  rationale: Na-egosi na Jizọs bịaruru ndị na-eso ụzọ ya nso tupu o kwuo okwu; okwu a bụ Igbo nkịtị ma na-echekwa echiche nke ịbịaru nso.
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: gwa ha sị
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu n'ụzọ ebumpụta ụwa, ma ọ na-anọchi ma ngwaa ‘kwuru okwu’ ma participle ‘na-asị’ n’enweghị nkwughachi siri ike.
- source_word: Ἐδόθη μοι
  choice: E nyela m
  rationale: 'Ụdị a na-echekwa passive nke Greek ma na-egosi omume e mezuru nke nsonaazụ ya ka dị ugbu a: ikike ahụ bụzi nke Jizọs.'
- source_word: πᾶσα ἐξουσία
  choice: ikike niile
  rationale: ‘Ikike’ na-egosi ikike ziri ezi nke ịchị na inye iwu karịa naanị ike anụ ahụ; ‘niile’ na-egosi ngụkọta ya.
- source_word: ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς
  choice: n’eluigwe na n’ụwa
  rationale: Nke a bụ ụzọ doro anya na nke a na-ejikarị ekwupụta mpaghara abụọ ahụ n’Igbo.
theological_decisions:
- issue: Ụdị ikike zuru ụwa ọnụ Jizọs nwere
  choice: E nyela m ikike niile n’eluigwe na n’ụwa
  alternative: Enyere m ikike niile n’eluigwe na n’ụwa; E nyela m ike niile n’eluigwe na n’ụwa
  rationale: A hapụrụ okwu ahụ n’ụdị passive ka ederede ahụ si kwuo na e nyere Jizọs ikike ahụ. A họọrọ ‘ikike’ kama ‘ike’ n’ihi na ἐξουσία na-elekwasị anya n’ọchịchị na ikike ziri ezi, ọ bụghị nanị n’ike ime ihe.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. ‘Gwa ha sị’ bụ usoro okwu sitere n’Igbo ebumpụta ụwa; ‘E nyela m’ na-echekwa omume e mezuru na mmetụta ya nke ka dị ugbu a.
