id: MAT.28.5
reference: Matthew 28:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν ταῖς γυναιξίν· Μὴ φοβεῖσθε ὑμεῖς, οἶδα γὰρ ὅτι Ἰησοῦν τὸν ἐσταυρωμένον ζητεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: ig
  text: Ma mmụọ ozi ahụ zara ụmụ nwanyị ahụ[a], sị, “Unu atụla egwu; n’ihi na ama m na unu na-achọ Jizọs, onye a kpọgideworo n’obe[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, e tinyere nnọchiaha pụtara ‘unu’ kpọmkwem iji mesie ike na nkasi obi a bụ maka ụmụ nwanyị ahụ karịsịa.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya nkenke, ‘Jizọs ahụ a kpọgidere n’obe’ ma ọ bụ ‘Jizọs onye a kpọgidere n’obe.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Ma ... zara, sị
  rationale: Nke a na-echekwa usoro okwu akụkọ Grik ‘zara wee sị’ n’ụzọ na-ada nke ọma n’Igbo; ‘Ma’ na-egosipụta ntụgharị dị nro nke δέ.
- source_word: ὁ ἄγγελος
  choice: mmụọ ozi ahụ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’onye ozi sitere n’eluigwe; ‘mmụọ ozi’ bụ okwu Igbo a na-ahụkarị ma doo anya.
- source_word: ταῖς γυναιξίν
  choice: ụmụ nwanyị ahụ
  rationale: Ọ na-ezo aka n’ụmụ nwanyị ndị akụkọ ahụ kwuburu okwu ha, ọ bụghị nanị ‘ndị inyom lụrụ di.’
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: Unu atụla egwu
  rationale: Nke a bụ iwu nkasi obi dị n’Igbo nke ugbu a. ‘Unu’ na-eme ka ndị a na-agwa okwu pụta ìhè, ebe nkọwa ala peeji na-akọwa nkwusi ike nke nnọchiaha Grik.
- source_word: οἶδα γὰρ ὅτι
  choice: n’ihi na ama m na
  rationale: Ọ na-echekwa ihe γάρ pụtara—ihe kpatara nkasi obi ahụ—nakwa ὅτι nke na-ewebata ihe mmụọ ozi ahụ maara.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: Ọ bụ nsụgharị aha ahụ a na-ejikarị eme ihe n’Igbo Standard.
- source_word: τὸν ἐσταυρωμένον
  choice: onye a kpọgideworo n’obe
  rationale: Ụdị ngwaa zuru oke nke Grik na-egosi ihe e merechaala nke ọnọdụ ya ka dị; ‘a kpọgideworo’ na-echekwa nke a nke ọma.
- source_word: ζητεῖτε
  choice: unu na-achọ
  rationale: Ọ na-egosipụta omume na-aga n’ihu nke present tense ma bụrụkwa okwu Igbo nkịtị na nke doro anya.
theological_decisions:
- issue: Nkwusi ike dị na nnọchiaha ὑμεῖς
  choice: E jiri ‘Unu’ kwuo ya n’ahịrịokwu ahụ, ma kọwaa nkwusi ike ya na nkọwa ala peeji [a].
  alternative: ‘Unu onwe unu atụla egwu’ ma ọ bụ ‘Unu ụmụ nwanyị, atụla egwu.’
  rationale: Ịgbakwunye ‘onwe unu’ nwere ike ịda ka ntụnyere siri ike karịa ihe Grik kwuru, ebe ‘unu ụmụ nwanyị’ na-etinye okwu na-adịghị n’ebe ahụ. Nkọwa ala peeji na-echekwa nkwusi ike ahụ n’enweghị ịkọwapụta ihe e ji atụnyere ha.
- issue: Udi oge na ọnọdụ nke τὸν ἐσταυρωμένον
  choice: ‘onye a kpọgideworo n’obe’
  alternative: ‘onye a kpọgidere n’obe’ ma ọ bụ ‘onye ahụ a kpọgidere n’obe.’
  rationale: Nhọrọ ahụ na-echekwa echiche nke omume e mechara nke nsonaazụ ya ka dị, n’enweghị ịgbakwunye nkọwa ozizi pụrụ iche.
translation_notes:
  register: E ji Igbo Standard nke oge a, dị ùgwù ma dị mfe nghọta. ‘Mmụọ ozi,’ ‘ụmụ nwanyị,’ na ‘kpọgide n’obe’ bụ okwu ndị nkịtị ga-aghọta; usoro ‘zara, sị’ na-edobe ụda akụkọ Akwụkwọ Nsọ n’enweghị ịdị arọ gabiga ókè.
