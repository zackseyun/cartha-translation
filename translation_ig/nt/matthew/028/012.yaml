id: MAT.28.12
reference: Matthew 28:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ συναχθέντες μετὰ τῶν πρεσβυτέρων συμβούλιόν τε λαβόντες ἀργύρια ἱκανὰ ἔδωκαν τοῖς στρατιώταις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: ig
  text: Mgbe ha na ndị okenye zukọtara ma gbakọọ izu, ha nyere ndị agha ahụ ọlaọcha dị ukwuu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναχθέντες
  choice: Mgbe ha ... zukọtara
  rationale: Aorist participle a na-egosi na ha gbakọtara tupu isi omume ahụ; ‘mgbe ... zukọtara’ bụ Igbo doro anya ma dịkwa eke.
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: na ndị okenye
  rationale: μετά na genitive na-egosi iso mmadụ nọkọọ; ‘ndị okenye’ bụ okwu a na-ejikarị akọwa ndị ndu a.
- source_word: συμβούλιόν τε λαβόντες
  choice: ma kparịtakwa ihe ha ga-eme
  rationale: Akpaalaokwu Grik a pụtara ịgbakọ echiche ma ọ bụ ịtụle atụmatụ; nsụgharị a na-egosipụta mkparịta ụka na mkpebi n’enweghị ịgbakwụnye nkọwa pụrụ iche.
- source_word: ἀργύρια ἱκανὰ
  choice: nnukwu ego ọlaọcha
  rationale: ἀργύρια na-ezo aka n’ego ọlaọcha, ebe ἱκανὰ na-egosi na ọ bara ụba ma ọ bụ buru ibu; ‘nnukwu ego ọlaọcha’ bụ okwu Igbo dị mfe ma debe ihe e ji ego ahụ mee.
- source_word: ἔδωκαν
  choice: ha nyere
  rationale: Nke a bụ nsụgharị kwụ ọtọ na nke eke nke aorist δίδωμι.
- source_word: τοῖς στρατιώταις
  choice: ndị agha ahụ
  rationale: στρατιώταις pụtara ndị agha; ‘ahụ’ na-eme ka o doo anya na ọ bụ ndị agha e kwuru okwu ha n’akụkọ gara aga.
theological_decisions:
- issue: Onye nnọchiaha ‘ha’ na-anọchi anya ya
  choice: ‘Ha’ bụ ndị isi nchụàjà e kwuru okwu ha n’amaokwu bu ụzọ.
  alternative: Ìgwè mmadụ a na-akọwaghị ndị ha bụ.
  rationale: Participles na isi ngwaa Grik niile dị na masculine plural, isiokwu ha aghọtaghịkwa aha ọzọ kama ọ na-aga n’ihu site na Matiu 28:11. E tinyeghị ‘ndị isi nchụàjà’ ọzọ n’ederede n’ihi na Grik ekwughị aha ahụ ọzọ.
translation_notes:
  register: 'Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe usoro omume dị na Grik: nzukọ, mkparịta ụka/atụmatụ, mgbe ahụ inye ndị agha ego.'
