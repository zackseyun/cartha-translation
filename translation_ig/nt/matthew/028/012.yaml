- from: Mgbe ha na ndị okenye zukọtara ma kparịtakwa ihe ha ga-eme, ha nyere ndị agha ahụ nnukwu ego ọlaọcha,
  to: Mgbe ha na ndị okenye zukọtara ma gbakọọ izu, ha nyere ndị agha ahụ ọlaọcha dị ukwuu,
  rationale: 'The revision removes the added specification in “ihe ha ga-eme” while retaining the participial sequence and deliberative force of the Greek. It also renders ἀργύρια ἱκανά more directly as “ọlaọcha dị ukwuu.” No footnote is necessary: the wording is clear and does not conceal a material ambiguity requiring explanation.'
