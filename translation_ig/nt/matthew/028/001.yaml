id: MAT.28.1
reference: Matthew 28:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὀψὲ δὲ σαββάτων, τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων, ἦλθεν ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία θεωρῆσαι τὸν τάφον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: ig
  text: Mgbe ụbọchị izuike gasịrị[a], ka chi na-abọ n’ụbọchị mbụ nke izu, Meri onye Magdala na Meri nke ọzọ bịara ile ili ahụ anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’oge ngwụcha ụbọchị izuike, ka chi na-abọ n’ụbọchị mbụ nke izu.” Akpaokwu Grik dị na mbido nwere ike ịpụta ma “mgbe ụbọchị izuike gasịrị” ma “n’oge ngwụcha ụbọchị izuike.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: Mgbe ụbọchị izuike gasịrị
  rationale: ὀψέ ya na genitive nwere ike ịpụta oge ihe gasịrị; ebe a, ihe ndị ọzọ na-egosi oge na-akwado na ọ bụ mgbe ụbọchị izuike gwụsịrị. σαββάτων bụ plural n’ụdị ya, ma n’okwu Grik ndị Juu ọ na-arụkarị ọrụ dị ka singular, ya bụ otu ụbọchị izuike. A hapụrụ δέ ka usoro ahịrịokwu Igbo buru njikọ ya n’enweghị itinye okwu oge na-adịghị na isi mmalite.
- source_word: τῇ ἐπιφωσκούσῃ
  choice: ka chi na-abọ
  rationale: N’ebe a, ἐπιφώσκω na-ezo aka n’ìhè ụtụtụ na-apụta. ‘Ka chi na-abọ’ bụ ụzọ Igbo dị ndụ ma doo anya isi kwuo ya.
- source_word: εἰς μίαν σαββάτων
  choice: ịbanye n’ụbọchị mbụ nke izu
  rationale: μίαν σαββάτων bụ akpaalaokwu Semitic/Grik nke pụtara ụbọchị mbụ nke izu; ‘ịbanye’ na-egosipụta ntụgharị oge dị na εἰς mgbe chi na-abọ.
- source_word: ἦλθεν
  choice: bịara
  rationale: Aorist nke ἔρχομαι pụtara ‘bịara’ n’akụkọ a.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Meri onye Magdala
  rationale: A sụgharịrị aha ahụ n’ụdị Igbo a na-amakarị, ebe ‘onye Magdala’ na-egosi obodo e ji mara ya.
- source_word: ἡ ἄλλη Μαρία
  choice: Meri nke ọzọ
  rationale: Nke a na-edobe ọdịiche akụkọ ahụ n’etiti Meri abụọ ahụ n’asụsụ Igbo doro anya.
- source_word: θεωρῆσαι
  choice: ile ... anya
  rationale: θεωρέω na-egosi ile ihe anya n’ebumnuche; okwu a anaghị emebiga ya ka à ga-asị na ha bịara ime nnyocha iwu.
- source_word: τὸν τάφον
  choice: ili ahụ
  rationale: τάφος bụ ebe e liri Jizọs; ‘ili’ bụ okwu Igbo nkịtị, doro anya maka ebe olili.
theological_decisions:
- issue: Oge e kwuru na mbido akụkọ mbilite n’ọnwụ
  choice: A sụgharịrị ya dị ka oge ụbọchị izuike gasịrị, mgbe chi na-abọ ịbanye n’ụbọchị mbụ nke izu.
  alternative: ‘Mgbe chi jiri n’ụbọchị izuike’ ma ọ bụ ‘N’oge ngwụcha ụbọchị izuike.’
  rationale: ὀψὲ σαββάτων nwere ike ịghọta n’ụzọ abụọ. Ihe ngosi oge niile dị n’amaokwu a na-akwado ‘mgbe ụbọchị izuike gasịrị,’ ma ihe odide ala peeji na-echekwa nghọta nke ọzọ kama idozi esemokwu ahụ n’ime ederede.
translation_notes:
  register: Standard Igbo; okwu ndị a bụ nke oge a, kwanyere ugwu, ma dị mfe nghọta. ‘Ụbọchị izuike’ na-ezere ibubata aha ụka pụrụ iche, ebe ‘ka chi na-abọ’ na-enye Igbo eke maka mmalite ìhè ụtụtụ.
