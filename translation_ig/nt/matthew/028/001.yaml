review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the principal reading of ὀψὲ ... σαββάτων as occurring after the Sabbath and accurately identifies the women, their purpose, and the tomb. However, “ka chi na-abọ ịbanye n’ụbọchị mbụ” makes the dawn itself seem to enter the day; the Greek temporal construction means that daylight was dawning toward/on the first day of the week.
  naturalness: “Meri onye Magdala,” “Meri nke ọzọ,” “bịara ile ili ahụ anya,” and “Mgbe ụbọchị izuike gasịrị” are clear Standard Igbo. Revising the dawn clause to “ka chi na-abọ n’ụbọchị mbụ nke izu” is more idiomatic and natural.
  terminology: The names, “ụbọchị izuike” for Sabbath, and “ili” for τάφος are appropriate. The alternative-reading footnote should use “n’oge ngwụcha ụbọchị izuike” rather than “mgbe chi jiri,” since ὀψέ means late/at the end of the Sabbath, not specifically nightfall.
  issues:
  - severity: medium
    issue: Unnatural rendering of the dawning temporal clause
    rationale: “ka chi na-abọ ịbanye n’ụbọchị mbụ” assigns the action of entering the first day to dawn. The source describes dawn occurring toward the first day.
  - severity: medium
    issue: Alternative footnote over-specifies darkness
    rationale: “Mgbe chi jiri n’ụbọchị izuike” means when night fell/on becoming dark during the Sabbath. The disputed sense of ὀψέ is late/end of the Sabbath and should not be narrowed to darkness.
  revised_text: Mgbe ụbọchị izuike gasịrị[a], ka chi na-abọ n’ụbọchị mbụ nke izu, Meri onye Magdala na Meri nke ọzọ bịara ile ili ahụ anya.
