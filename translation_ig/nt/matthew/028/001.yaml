- from: Mgbe ụbọchị izuike gasịrị[a], ka chi na-abọ ịbanye n’ụbọchị mbụ nke izu, Meri onye Magdala na Meri nke ọzọ bịara ile ili ahụ anya.
  to: Mgbe ụbọchị izuike gasịrị[a], ka chi na-abọ n’ụbọchị mbụ nke izu, Meri onye Magdala na Meri nke ọzọ bịara ile ili ahụ anya.
  rationale: The revision retains the chosen, contextually well-supported reading “Mgbe ụbọchị izuike gasịrị,” while making the dawn clause idiomatic Igbo. The footnote preserves the genuine ambiguity of the opening Greek expression without adding the unsupported detail that it was already dark.
