id: MAT.28.6
reference: Matthew 28:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ὧδε, ἠγέρθη γὰρ καθὼς εἶπεν· δεῦτε ἴδετε τὸν τόπον ὅπου ⸀ἔκειτο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: ig
  text: Ọ nọghị ebe a,[a] n’ihi na a kpọlitere ya, dịka o kwuru. Bịanụ, hụnụ ebe o dinara.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya, “O biliela.” Okwu Grik ahụ dị n’ụdị nrụọrụ: “A kpọlitere ya.”'
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “ebe o dina,” ma ọ bụ “ebe e dinyere ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Ọ nọghị ebe a
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu banyere ebe mmadụ nọ; ‘ebe a’ na-egosipụta ὧδε nke ọma.
- source_word: ἠγέρθη
  choice: e mere ka o si n’ọnwụ bilie
  rationale: Nhọrọ a na-echekwa ọdịdị nnara-eme nke okwu Grik ahụ ma na-eme ka ihe mbilite n’ọnwụ pụta ìhè n’Igbo nkịtị.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-enye ihe kpatara na ọ nọghị ebe ahụ.
- source_word: καθὼς εἶπεν
  choice: dịka o kwuru
  rationale: Ọ na-egosi na ihe a mere kwekọrọ n’ihe Jizọs kwuru tupu oge ahụ, na-enweghị ịgbakwụnye nkọwa na-adịghị n’ahịrịokwu ahụ.
- source_word: δεῦτε ἴδετε
  choice: Bịanụ lee
  rationale: ‘Bịanụ’ bụ ọkpụkpọ nye ọtụtụ mmadụ, ‘lee’ bụkwa iwu ka ha jiri anya nyochaa ebe ahụ.
- source_word: τὸν τόπον
  choice: ebe
  rationale: ‘Ebe’ bụ okwu Igbo doro anya ma kwekọọ n’ebe ahụ dị n’ili.
- source_word: ὅπου ἔκειτο
  choice: ebe ọ tọgbọrọ
  rationale: ‘Ọ tọgbọrọ’ na-echekwa ọnọdụ nke κεῖμαι—ịdina ma ọ bụ ịtọgbọ n’otu ebe—na-enweghị ịkọwapụta onye tọgbọrọ ya.
theological_decisions:
- issue: Ụdị olu na onye mere ka mbilite n’ọnwụ mee
  choice: e mere ka o si n’ọnwụ bilie
  alternative: o si n’ọnwụ bilie
  rationale: ἠγέρθη bụ nnara-eme n’ụdị ya. Nsụgharị a na-echekwa ọdịdị ahụ na-enweghị ịkpọ onye mere ihe ahụ aha ebe ahịrịokwu Grik a na-akpọghị ya aha.
- issue: Ọnọdụ ahụ ya n’ili
  choice: ebe ọ tọgbọrọ
  alternative: ebe e tọgbọrọ ya
  rationale: κεῖμαι na-akọwa ọnọdụ mmadụ ma nwee ike ịpụta ‘ịdina’ ma ọ bụ ‘ịbụ onye e debere.’ Isi nsụgharị ahụ echekwala nghọta ọnọdụ ahụ, ebe nkọwa ala peeji na-egosi ụzọ ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E jiri ‘e mere ka o si n’ọnwụ bilie’ chekwaa nnara-eme nke Grik; e jiri akara ụkwụ kọwaa ụzọ nsụgharị ndị ọzọ n’ebughị nkọwa okpukpe otu ụka bata.
