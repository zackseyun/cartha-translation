revisions:
- from: Ọ nọghị ebe a,[a] n’ihi na e mere ka o si n’ọnwụ bilie, dịka o kwuru. Bịanụ lee ebe ọ tọgbọrọ.[b]
  to: Ọ nọghị ebe a,[a] n’ihi na a kpọlitere ya, dịka o kwuru. Bịanụ, hụnụ ebe o dinara.[b]
  rationale: The revision renders ἠγέρθη as “a kpọlitere ya,” retaining passive form and unspecified agency without importing wording not present in the verse. It renders ἔκειτο with the natural stative expression “o dinara.” The revised footnotes are aligned with the text and explain alternatives without imposing theological interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:30Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the location statement, the causal connection, Jesus’ prior statement, and the invitation to inspect the place. However, “e mere ka o si n’ọnwụ bilie” is an overly causative paraphrase of ἠγέρθη. “A kpọlitere ya” is a natural Igbo passive/agent-unspecified rendering that preserves the Greek passive force without adding “from death,” which is not stated in this verse.
  naturalness: “A kpọlitere ya” and “ebe o dinara” are more idiomatic Standard Igbo than “e mere ka o si n’ọnwụ bilie” and “ebe ọ tọgbọrọ.” “Bịanụ, hụnụ” is a clear plural invitation and command corresponding to δεῦτε ἴδετε.
  terminology: “A kpọlitere ya” appropriately renders the resurrection verb without specifying the agent. “Dina” naturally expresses the stative sense of ἔκειτο in this tomb context. The footnotes retain legitimate alternatives while accurately describing the Greek voice.
  issues:
  - severity: medium
    issue: The resurrection clause is rendered with an unnecessarily explicit causative construction.
    rationale: “E mere ka o si n’ọnwụ bilie” adds both a causative periphrasis and “si n’ọnwụ” (‘from death’). The latter is contextually true but absent from the Greek wording here. “A kpọlitere ya” is more faithful and natural.
  - severity: medium
    issue: “Ebe ọ tọgbọrọ” is not the clearest natural rendering of the stative verb ἔκειτο.
    rationale: In contemporary Standard Igbo, “ebe o dinara” more naturally denotes the place where he lay, preserving the imperfect’s stative contextual sense.
  - severity: low
    issue: Footnote a describes the Greek as “nnara-eme.”
    rationale: “Ụdị nrụọrụ” or a direct explanation that it is passive in form is clearer Igbo grammatical terminology. The revised wording avoids potentially opaque terminology.
  revised_text: Ọ nọghị ebe a,[a] n’ihi na a kpọlitere ya, dịka o kwuru. Bịanụ, hụnụ ebe o dinara.[b]
