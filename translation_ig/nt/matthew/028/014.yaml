id: MAT.28.14
reference: Matthew 28:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀκουσθῇ τοῦτο ⸀ἐπὶ τοῦ ἡγεμόνος, ἡμεῖς πείσομεν ⸀αὐτὸν καὶ ὑμᾶς ἀμερίμνους ποιήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: ig
  text: Ọ bụrụkwa na gọvanọ anụ okwu a,[a] anyị ga-eme ka o kwenye, meekwa ka unu ghara ịdaba ná nsogbu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụrụ na okwu a eruo gọvanọ ntị.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “anyị ga-emekwa ka unu bụrụ ndị na-enweghị nchegbu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ
  choice: anụ okwu a
  rationale: Okwu a na-egosi na akụkọ ahụ ga-eru mmadụ ntị ma ọ bụ bụrụ ihe ọ matara. N'Igbo, ‘gọvanọ anụ okwu a’ bụ ụzọ doro anya ma dịkwa n'okike isi kwuo ya n'olu mmebere a.
- source_word: ἐπὶ τοῦ ἡγεμόνος
  choice: gọvanọ anụ
  rationale: N'ebe a, njikọ ἐπί na-egosi na okwu ahụ rutere n'ntị ma ọ bụ n'ihu gọvanọ. A tụgharịrị ya n'ụzọ Igbo si ekwu okwu, ebe a na-eme gọvanọ onye nụrụ okwu ahụ; e debere echiche nke ‘irute ya ntị’ n'okpuru peeji.
- source_word: ἡγεμόνος
  choice: gọvanọ
  rationale: N'ọnọdụ akụkọ a, ἡγεμών bụ onye Rom na-achị ógbè ahụ, ya bụ Paịlet. ‘Gọvanọ’ bụ okwu ziri ezi ma ndị na-agụ Igbo nke oge a na-aghọta ya ngwa ngwa.
- source_word: πείσομεν αὐτόν
  choice: anyị ga-eme ka o kwenye
  rationale: πείθω pụtara ime ka mmadụ kwenye ma ọ bụ ịdọrọ ya n'akụkụ mmadụ. Nhọrọ a na-edobe ihe odide ahụ kwuru n'emeghị ka ihe a ga-eme ka o kwenye na ya pụta ìhè karịa ka isi mmalite mere.
- source_word: ἀμερίμνους
  choice: ka unu ghara ịdaba ná nsogbu
  rationale: N'ụzọ nkịtị, okwu ahụ pụtara ịbụ onye na-enweghị nchegbu; ma n'ọnọdụ a, nchegbu ndị nche ahụ bụ ntaramahụhụ ma ọ bụ nsogbu ha nwere ike ịbanye na ya. Nhọrọ a na-enye nghọta ahụ n'Igbo dị ndụ.
- source_word: ποιήσομεν
  choice: anyị ga-eme ka
  rationale: ποιέω tinyere nkọwa ọnọdụ nwere echiche nke ime ka mmadụ nọrọ n'ọnọdụ ahụ. ‘Anyị ga-eme ka’ na-egosipụta usoro na nsonaazụ ahụ n'ụzọ Igbo kwesịrị ekwesị.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo ọkọlọtọ nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro ahịrịokwu ahụ n'ụzọ na-aga were were n'Igbo, ebe nkọwa ndị na-egosi ọdịdị okwu Grik n'ụzọ ka nso dị n'okpuru peeji.
