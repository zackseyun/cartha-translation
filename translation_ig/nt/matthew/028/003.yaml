  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦν δὲ ἡ εἰδέα αὐτοῦ ⸀ὡς ἀστραπὴ καὶ τὸ ἔνδυμα αὐτοῦ λευκὸν ὡς χιών.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: ig
  text: Ọdịdị ya dị ka àmụ̀mà[a], uwe ya dịkwa ọcha dị ka snoo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ụdị ya” ma ọ bụ “Otú o si ele anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: dịkwa
  rationale: A sụgharịrị njikọ dị nro δέ site na “dịkwa” n’ahịrị nke abụọ, ka ọ jikọta nkọwa abụọ ahụ n’Igbo n’enweghị itinye ọdịiche siri ike.
- source_word: εἰδέα
  choice: ọdịdị
  rationale: “Ọdịdị” na-egosi ihe a na-ahụ anya banyere onye ahụ, ma na-echekwakwa ohere pụtara ‘ụdị’ ma ọ bụ ‘ile anya.’
- source_word: ὡς ἀστραπή
  choice: dị ka àmụ̀mà
  rationale: Nke a na-echekwa ntụnyere ὡς ma jiri okwu Igbo a na-ejikarị akọwa lightning.
- source_word: ἔνδυμα
  choice: uwe
  rationale: “Uwe” bụ okwu Igbo doro anya na nke izugbe; ọ naghị akọwapụta ụdị uwe nke Grik na-akọwaghị.
- source_word: λευκόν
  choice: dị ọcha
  rationale: N’Igbo, “uwe dị ọcha” bụ ụzọ ebumpụta ụwa isi kwuo na uwe na-acha ọcha n’ebe a, n’enweghị ịgbakwunye ike nke okwu Grik na-ekwughị.
- source_word: ὡς χιών
  choice: dị ka snow
  rationale: A chekwara ntụnyere nke abụọ. “Snow” bụ okwu a na-aghọta n’Igbo ọgbara ọhụrụ ma na-ezo kpọmkwem n’ihe χιών pụtara.
theological_decisions:
- issue: Onye αὐτοῦ na-ezo aka na ya
  choice: E debere nnọchiaha “ya,” nke n’ọnọdụ amaokwu a na-ezo aka n’mmụọ ozi Onyenwe anyị e kwuru okwu ya n’amaokwu nke 2.
  alternative: Ịkpọ “mmụọ ozi ahụ” aha kpọmkwem n’amaokwu a, ma ọ bụ ịghọtahie “ya” dị ka Jizọs.
  rationale: Onye kacha nso αὐτοῦ na-ezo aka na ya bụ mmụọ ozi Onyenwe anyị. Ide “ya” na-agbaso Grik ma ghara itinye aha ọzọ na-adịghị n’amaokwu a.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E jiri “àmụ̀mà” mee ka ọdịiche dị n’etiti lightning na “égbè eluigwe” (thunder) doo anya.
