review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the women’s departure from the tomb, their haste, the paired emotions of φόβος and great joy, their running, and their purpose of reporting to Jesus’ disciples. The implicit content of ἀπαγγεῖλαι is appropriately not supplied.
  naturalness: “Jiri egwu na nnukwu ọṅụ gbaga” is understandable, but it can suggest that fear and joy are instruments used for running. Standard Igbo more naturally expresses these accompanying emotions as “n’egwu na n’oké ọṅụ.” “Gbaa ọsọ” is also the clearest ordinary rendering of ἔδραμον.
  terminology: “Ili” and “ndị na-eso ụzọ ya” are appropriate in this Gospel context. “N’oké ọṅụ” naturally conveys χαρᾶς μεγάλης. The footnote retains the lexical possibility of reverential awe without narrowing the main text’s “egwu.”
  issues:
  - severity: low
    issue: The circumstantial phrase is phrased with “jiri.”
    rationale: Although intelligible, “jiri egwu na nnukwu ọṅụ” may sound instrumental in Igbo. “N’egwu na n’oké ọṅụ” more directly expresses the Greek accompanying circumstance μετά + genitive.
  - severity: low
    issue: The main verb “gbaga” is less explicit than the source.
    rationale: “Gbaa ọsọ” directly states that they ran (ἔδραμον), while retaining natural modern Igbo.
  - severity: low
    issue: Footnote anchor follows “ọṅụ,” though the alternative specifically concerns “egwu.”
    rationale: Placing the marker directly after “egwu” makes the footnote’s referent clear.
  revised_text: Ha si n’ili ahụ pụọ ngwa ngwa, n’egwu[a] na n’oké ọṅụ, wee gbaa ọsọ ịkọrọ ndị na-eso ụzọ ya.
  revised_footnotes:
