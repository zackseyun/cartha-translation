    text: Ma ọ bụ, “n’egwu nsọpụrụ na n’oké ọṅụ.” Okwu Grik a sụgharịrị “egwu” nwekwara ike igosi ịtụ egwu jupụtara ná nsọpụrụ n’ọnọdụ a.
    reason: lexical_alternative
  revision_rationale: The revision preserves every source element while using a more idiomatic Igbo construction for the women’s concurrent fear and joy. It also makes the physical running explicit and places the lexical-alternative marker at the term it qualifies.
