id: MAT.28.8
reference: Matthew 28:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου μετὰ φόβου καὶ χαρᾶς μεγάλης ἔδραμον ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: ig
  text: Ha si n’ili ahụ pụọ ngwa ngwa, n’egwu[a] na n’oké ọṅụ, wee gbaa ọsọ ịkọrọ ndị na-eso ụzọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’egwu nsọpụrụ na n’oké ọṅụ.” Okwu Grik a sụgharịrị “egwu” nwekwara ike igosi ịtụ egwu jupụtara ná nsọpụrụ n’ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσαι
  choice: Ha wee si ... pụọ
  rationale: Aorist participle ahụ na-egosi na ụmụ nwanyị ahụ hapụrụ ili ahụ; usoro a bụ Igbo dị mfe ma na-aga nke ọma n’akụkọ.
- source_word: ταχὺ
  choice: ngwa ngwa
  rationale: Na-egosi ọsọ na enweghị igbu oge n’ụzọ doro anya.
- source_word: μνημείου
  choice: ili
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ebe e liri Jizọs; “ili” bụ okwu Igbo a na-aghọta nke ọma.
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: jiri egwu na nnukwu ọṅụ
  rationale: E debere mmetụta abụọ ahụ ọnụ dịka Grik si mee, n’emeghị ka egwu ghọọ naanị egwu nsọpụrụ ma ọ bụ egwu nkịtị.
- source_word: ἔδραμον
  choice: gbaga
  rationale: Na-echekwa ihe omume anụ ahụ doro anya nke ịgba ọsọ, kama iji okwu dị nro dịka ime ngwa ngwa.
- source_word: ἀπαγγεῖλαι
  choice: ịkọrọ
  rationale: 'Infinitive nke nzube: ha gbara ọsọ iji zie ndị na-eso ụzọ ozi. A naghị atụkwasị ihe e kwuru kpọmkwem dịka ihe nnara ebe Grik ekwughị ya.'
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa μαθηταί n’akụkọ Oziọma; “ya” na-ezo aka na Jizọs dịka ọnọdụ akụkọ si gosi.
theological_decisions:
- issue: Mmetụta abụọ dị n’azịza ụmụ nwanyị ahụ
  choice: jiri egwu na nnukwu ọṅụ
  alternative: jiri egwu nsọpụrụ na nnukwu ọṅụ
  rationale: φόβος nwere ike ịpụta egwu ma ọ bụ egwu jupụtara ná nsọpụrụ n’ọnọdụ a. Isi ederede na-edobe okwu sara mbara “egwu,” ka esemokwu dị n’etiti egwu na ọṅụ ghara ịla n’iyi; nkọwa ala peeji na-egosi ụzọ ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “ndị na-eso ụzọ” mee ka okwu ahụ bụrụ nke a na-aghọta n’ụzọ nkịtị, ma debe usoro mmetụta abụọ nke Grik.
