revisions:
- from: Ha wee si n’ili ahụ pụọ ngwa ngwa, jiri egwu na nnukwu ọṅụ[a] gbaga ịkọrọ ndị na-eso ụzọ ya.
  to: Ha si n’ili ahụ pụọ ngwa ngwa, n’egwu[a] na n’oké ọṅụ, wee gbaa ọsọ ịkọrọ ndị na-eso ụzọ ya.
  rationale: The revision preserves every source element while using a more idiomatic Igbo construction for the women’s concurrent fear and joy. It also makes the physical running explicit and places the lexical-alternative marker at the term it qualifies.
  reviewer_model: gpt-5.6-terra
