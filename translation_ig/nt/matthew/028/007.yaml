id: MAT.28.7
reference: Matthew 28:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: ig
  text: Gaanụ ngwa ngwa, gwa ndị na-eso ụzọ ya na, “A kpọlitela ya n’ọnwụ; lee, ọ na-aga unu n’ihu ruo Galili. N’ebe ahụ ka unu ga-ahụ ya.” Lee, agwala m unu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ πορευθεῖσαι
  choice: Gaanụ ngwa ngwa
  rationale: Na-egosipụta iwu ka ha gaa ozugbo na ngwa ngwa, n'Igbo dị mfe ma kwekọọ n'ọnọdụ ahụ.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka μαθηταί, ndị na-amụta ihe site n'iso onye nkụzi.
- source_word: Ἠγέρθη ἀπὸ τῶν νεκρῶν
  choice: E si nʼọnwụ kpọlite ya
  rationale: Na-edobe olu nnara nke Ἠγέρθη, ma ghara ịkọwapụta onye kpọlitere ya ebe Grik ahụ ekwughị ya kpọmkwem.
- source_word: ἰδοὺ
  choice: leenụ
  rationale: Na-eburu ọrụ okwu ahụ nke ịdọrọ uche ndị na-ege ntị, ma na-ada n'ụzọ ebumpụta ụwa na asụsụ Igbo.
- source_word: προάγει ὑμᾶς
  choice: ọ na-ebu unu ụzọ aga
  rationale: Na-egosipụta na ọ na-aga n'ihu ha ma na-eduga ụzọ ha, dịka προάγει si pụta n'ọnọdụ a.
- source_word: ἰδοὺ εἶπον ὑμῖν
  choice: Leenụ, agwala m unu
  rationale: 'Na-echekwa nkwusi ike na ụdị okwu oge zuru ezu nke Grik ahụ: onye mmụọ ozi ekwuola ha ihe ahụ ugbu a.'
theological_decisions:
- issue: Olu nnara n'okwu mbilite n'ọnwụ
  choice: E si nʼọnwụ kpọlite ya
  alternative: O si nʼọnwụ bilie
  rationale: Nhọrọ a na-echekwa Ἠγέρθη dị ka olu nnara, ya mere ọ naghị agbanwe ya ka ọ bụrụ naanị omume Jizọs mere n'onwe ya, ma ọ bụ kpọọ onye mere ya aha n'ụzọ ederede ahụ na-ekwughị.
- issue: Ihe προάγει pụtara
  choice: ọ na-ebu unu ụzọ aga Galili
  alternative: ọ na-aga n'ihu unu ruo Galili
  rationale: Nhọrọ ahụ na-echekwa ma echiche nke ịga n'ihu ha ma nke iduzi ha; ọ naghị ekpebi kpọmkwem ma okwu ahụ na-ekwu naanị banyere oge ọ ga-erute ma ọ bụkwa nduzi.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ụdị ọtụtụ mmadụ “gaanụ/gwa/unu” mee ihe n'ihi na okwu Grik ahụ na-agwa ọtụtụ ụmụ nwanyị okwu. Enweghị akara nkọwa ala peeji n'ihi na enweghị ihe dị mkpa chọrọ ya n'amaokwu a.
