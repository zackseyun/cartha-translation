revisions:
- from: Gaanụ ngwa ngwa gwa ndị na-eso ụzọ ya, sị, “E si nʼọnwụ kpọlite ya, ma leenụ, ọ na-ebu unu ụzọ aga Galili. Nʼebe ahụ ka unu ga-ahụ ya.” Leenụ, agwala m unu.
  to: Gaanụ ngwa ngwa, gwa ndị na-eso ụzọ ya na, “A kpọlitela ya n’ọnwụ; lee, ọ na-aga unu n’ihu ruo Galili. N’ebe ahụ ka unu ga-ahụ ya.” Lee, agwala m unu.
  rationale: The revision more closely distinguishes Jesus’ going ahead of the disciples from leading them, removes an unnecessary contrastive connector, and retains the resurrection statement’s unspecified agent. No footnote is required.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:30Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperative to go quickly, the announcement of resurrection with an unspecified agent, the future meeting in Galilee, and the emphatic concluding assurance. However, “ọ na-ebu unu ụzọ aga Galili” can suggest that he is actively leading the women along the way, whereas προάγει ὑμᾶς more directly says that he goes ahead of them. The additive καὶ ἰδού is also better rendered without the contrastive implication of “ma.”
  naturalness: The wording is broadly understandable Standard Igbo, but “ọ na-aga unu n’ihu ruo Galili” is more idiomatic and more exact for ‘is going ahead of you into Galilee.’ Adding a pause after “ngwa ngwa” improves readability.
  terminology: “ndị na-eso ụzọ ya,” “Galili,” “n’ọnwụ,” and “Lee” are suitable. “A kpọlitela ya n’ọnwụ” is a natural impersonal/passive-compatible Igbo rendering that does not identify the one who raised him.
  issues:
  - severity: medium
    issue: “ọ na-ebu unu ụzọ aga Galili” overstates προάγει.
    rationale: 'It may mean ‘he leads you to Galilee,’ while the Greek primarily locates him ahead of the disciples: ‘he is going ahead of you into Galilee.’'
  - severity: low
    issue: “ma leenụ” gives the connective a contrastive coloring.
    rationale: The Greek καὶ ἰδού is additive and attention-directing, not adversative; “lee” alone after suitable punctuation is preferable.
  revised_text: Gaanụ ngwa ngwa, gwa ndị na-eso ụzọ ya na, “A kpọlitela ya n’ọnwụ; lee, ọ na-aga unu n’ihu ruo Galili. N’ebe ahụ ka unu ga-ahụ ya.” Lee, agwala m unu.
  revised_footnotes: []
  revision_rationale: The revision more closely distinguishes Jesus’ going ahead of the disciples from leading them, removes an unnecessary contrastive connector, and retains the resurrection statement’s unspecified agent. No footnote is required.
