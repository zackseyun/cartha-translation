  to: Mgbe ha hụrụ ya, ha fere ya ofufe, ma ụfọdụ nwere obi abụọ.[a]
  rationale: The revision strengthens the translation of προσκυνέω to reflect worship in the stated resurrection context, while keeping the source’s ambiguity regarding διστάζω. The footnote is corrected to offer a natural and semantically relevant alternative without over-interpreting the doubt as unbelief.
