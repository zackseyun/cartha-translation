  text: καὶ ἰδόντες αὐτὸν ⸀προσεκύνησαν, οἱ δὲ ἐδίστασαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/017.yaml
  text: And when they saw him[a], they worshiped him, but some doubted.
translation:
  language: ig
  text: Mgbe ha hụrụ ya, ha fere ya ofufe, ma ụfọdụ nwere obi abụọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nọ na-ala azụ.” Okwu Grik ahụ nwere ike igosi ịla azụ ma ọ bụ inwe obi abụọ, karịa ekweghị ekwe kwụsiri ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Mgbe ha hụrụ
  rationale: A sụgharịrị participle aorist ahụ n'ụzọ na-egosi oge, ka njikọ ya na omume ndị sochirinụ doo anya n'Igbo eke.
- source_word: προσεκύνησαν
  choice: ha kpọrọ isiala nye ya
  rationale: N'Igbo, ‘ịkpọ isiala nye’ na-egosi omume nsọpụrụ miri emi, ma n'ọnọdụ a nke Jizọs bilitere n'ọnwụ ọ na-ebukwa echiche ife ofufe n'enweghị ịgbakwụnye ihe Grik ahụ na-ekwughị kpọmkwem.
- source_word: οἱ δὲ
  choice: ma ụfọdụ
  rationale: Nkebiokwu Grik a na-ekewa ụfọdụ n'ime ìgwè ahụ na ndị ọzọ; ‘ma ụfọdụ’ na-egosipụta nkwekọrịta ahụ nke ọma n'Igbo.
- source_word: ἐδίστασαν
  choice: nwere obi abụọ
  rationale: Nhọrọ a na-edebe isi echiche nke inwe obi abụọ, ebe ndetu ala na-egosi na okwu Grik ahụ nwekwara ike ịpụta ịla azụ ma ọ bụ ịdị na-amaghị nke a ga-eme.
theological_decisions:
- issue: Ike okwu προσκυνέω mgbe a na-eme ya nye Jizọs bilitere n'ọnwụ
  choice: kpọrọ isiala nye ya
  alternative: fere ya ofufe
  rationale: ‘Ịkpọ isiala nye’ bụ okwu Igbo nwere ike ibu ma omume ahụ nke ịda n'ala n'ihu onye, ma nsọpụrụ ofufe dị n'ọnọdụ a. Ọ na-edebe obosara okwu Grik ahụ na ịdị arọ nke ọnọdụ ahụ.
- issue: Ụdị obi abụọ dị na διστάζω
  choice: nwere obi abụọ
  alternative: la azụ / maa jijiji n'obi
  rationale: Isi ederede na-edebe obi abụọ ahụ n'ụzọ doro anya, ma ndetu ala na-echekwa ohere na ọ bụ enweghị mkpebi ma ọ bụ ịla azụ, ọ bụghị ekweghị ekwe siri ike.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘ịkpọ isiala nye’ chekwaa ma omume ahụ a na-ahụ anya ma nghọta ofufe nke ọnọdụ ahụ.
