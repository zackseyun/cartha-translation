review_pass:
  verdict: revise
  source_fidelity: The temporal rendering “Mgbe ha hụrụ ya” accurately represents the aorist participle ἰδόντες, and “ma ụfọdụ” appropriately conveys the contrastive subset indicated by οἱ δέ. “Nwere obi abụọ” is a sound main-text rendering of ἐδίστασαν. However, “kpọrọ isiala nye ya” primarily denotes showing deference or bowing and understates προσκυνέω in this resurrection context; “fere ya ofufe” more directly conveys the source’s likely force while remaining natural Igbo.
  naturalness: The revised wording is idiomatic, current Standard Igbo, and retains a reverent biblical register. The former footnote alternatives were not both natural or sufficiently precise for διστάζω; the revision gives a clear, usable alternative.
  terminology: Use “fere ya ofufe” for worship directed to the risen Jesus. Retain “nwere obi abụọ” in the text, with “nọ na-ala azụ” in the note to preserve the possible sense of hesitation or wavering without construing it as settled unbelief.
  issues:
  - severity: medium
    issue: The rendering “kpọrọ isiala nye ya” weakens the likely force of προσεκύνησαν.
    rationale: Although it can describe a reverential gesture, it more readily means paying respect or homage. In Matthew’s resurrection setting, “fere ya ofufe” is the clearer and lexically defensible rendering of worship.
  - severity: medium
    issue: The footnote’s “maa jijiji n'obi” is not an apt lexical alternative for ἐδίστασαν.
    rationale: It suggests emotional trembling rather than the uncertainty, wavering, or hesitation expressed by διστάζω. “Nọ na-ala azụ” better preserves the alternative nuance.
  revised_text: Mgbe ha hụrụ ya, ha fere ya ofufe, ma ụfọdụ nwere obi abụọ.[a]
