    issue: Added locative emphasis in the final clause
    rationale: 'The cleft “ọ bụkwa n’ebe ahụ ka” is stronger than Greek κἀκεῖ, which simply joins the location: “and there.”'
  - severity: low
    issue: Footnote grammatical wording and idiom
    rationale: The note should identify the Greek as masculine plural and use natural Standard Igbo for Jesus’ disciples.
