review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the sequence, plural prohibitions and commands, the indirect instruction to go to Galilee, and the future promise that they will see Jesus. “Ụmụnna m” appropriately retains the familial wording of τοῖς ἀδελφοῖς μου.
  naturalness: The wording is generally clear Standard Igbo. However, “ọ bụkwa n’ebe ahụ ka” is a cleft construction that adds marked locative emphasis not present in κἀκεῖ (“and there”). “N’ebe ahụkwa ka” naturally carries the connective force without that added focus.
  terminology: “Jizọs,” “Galili,” and “ụmụnna m” are suitable. The footnote’s description “aha nwoke n’ọnụọgụ ọtụtụ” is linguistically imprecise; the Greek word is a masculine plural form, not simply a ‘male noun.’ “Ndị na-eso ụzọ Jizọs” is more natural modern Igbo than “ụmụazụ Jizọs” in the explanatory note.
  issues:
