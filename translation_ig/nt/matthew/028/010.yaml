  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: ig
  text: Mgbe ahụ, Jizọs sịrị ha, “Unu atụla egwu. Gaanụ gwa ụmụnna m[a] ka ha gaa Galili; n’ebe ahụkwa ka ha ga-ahụ m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ebe a, “ụmụnna m” na-ezo aka n’ndị na-eso ụzọ Jizọs. Okwu Grik ahụ dị n’ụdị nwoke, n’ọnụọgụ ọtụtụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Na-egosi usoro ihe mere n’akụkọ n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: λέγει αὐταῖς
  choice: Jizọs sịrị ha
  rationale: Ọ bụ ezie na Grik ji historical present, oge gara aga dabara n’akụkọ Igbo; “ha” na-ezo aka n’ụmụ nwanyị ndị a kpọtụrụ aha n’okwu gbara amaokwu a gburugburu.
- source_word: Μὴ φοβεῖσθε
  choice: Unu atụla egwu
  rationale: Nke a bụ ụzọ Igbo sitere n’okike e si nye ọtụtụ mmadụ iwu ka ha ghara ịtụ egwu.
- source_word: ὑπάγετε
  choice: Gaanụ
  rationale: Na-enye iwu ngagharị nkenke ma doo anya.
- source_word: ἀπαγγείλατε
  choice: gwa
  rationale: N’ebe a, okwu ahụ pụtara izigara ndị ọzọ ozi; “gwa” bụ ụzọ Igbo dị mfe ma sitere n’okike isi kwuo ya.
- source_word: τοῖς ἀδελφοῖς μου
  choice: ụmụnna m
  rationale: “Ụmụnna” na-echekwa okwu ezinụlọ dị na Grik. Ebe okwu Grik bụ nwoke ọtụtụ, ihe gbara ya gburugburu na-egosi na ọ na-ezo aka n’ụmụazụ Jizọs.
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: ka ha gaa Galili
  rationale: “Ka” na subjunctive na-egosipụta ọdịnaya nke iwu a na-ezisa n’ụzọ Igbo sitere n’okike.
- source_word: κἀκεῖ με ὄψονται
  choice: ọ bụkwa n’ebe ahụ ka ha ga-ahụ m
  rationale: Na-echekwa ma “na” dị n’okwu ahụ ma nkwusi ike e nyere ebe ahụ, na-agbanweghị “ịhụ” ka ọ bụrụ “izute.”
theological_decisions:
- issue: Ndị okwu “ụmụnna m” na-ezo aka na ha
  choice: E debere “ụmụnna m” n’ahịrịokwu, tinyekwa nkọwa na ọ na-ezo aka n’ụmụazụ Jizọs.
  alternative: Ịsụgharị ya ozugbo dị ka “ụmụazụ m.”
  rationale: Nke a na-echekwa okwu ezinụlọ na-ekpo ọkụ nke Jizọs ji, ma nkọwa ala peeji na-eme ka onye a na-ezo aka na ya doo anya n’enweghị dochie okwu mbụ ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E ji ụdị ọtụtụ “unu/gaanụ” mee ka okwu Jizọs gwara ụmụ nwanyị ahụ doo anya; e zere okwu ụka pụrụ iche na nkọwa karịrị ihe isi mmalite kwuru.
