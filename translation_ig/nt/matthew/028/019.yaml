revisions:
- from: Ya mere, gaanụ mee mba niile ka ha bụrụ ndị na-eso ụzọ, na-eme ha baptizim ka ha banye n’aha nke Nna na nke Ọkpara na nke Mmụọ Nsọ.[a]
  to: Ya mere, gaanụ mee ndị mba niile ka ha bụrụ ndị na-eso ụzọ, na-eme ha baptizim n’aha[a] nke Nna na nke Ọkpara na nke Mmụọ Nsọ.
  rationale: The revision retains the command’s force, the universal object, baptism as a means associated with making disciples, and the singular threefold name formula. It adopts idiomatic Standard Igbo for the baptismal expression and relocates the ‘into’ sense to a precise footnote, where it can be represented without forcing an unnatural main-text construction.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:34Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the attendant force of πορευθέντες ('gaanụ'), the imperative μαθητεύσατε, the universal scope of πάντα τὰ ἔθνη, and the threefold baptismal formula. However, 'ka ha banye n’aha' is not idiomatic Standard Igbo as a complement to 'na-eme ... baptizim' and can misleadingly make literal physical entry the stated action. The Greek εἰς nuance can be documented in a footnote while the main text uses the established, natural Igbo baptismal construction.
  naturalness: Replacing 'na-eme ha baptizim ka ha banye n’aha' with 'na-eme ha baptizim n’aha' makes the sentence natural and readily understandable in modern Standard Igbo. 'Ndị mba niile' more clearly denotes the peoples/nations who are to become disciples than an unqualified reference to political nations.
  terminology: ‘Nna,’ ‘Ọkpara,’ and ‘Mmụọ Nsọ’ are appropriate established divine titles. ‘Baptizim’ appropriately retains the rite without deciding its mode. The singular ‘aha’ and the repeated ‘nke’ preserve the structure of the Greek formula.
  issues:
  - severity: medium
    issue: The main-text rendering of εἰς as 'ka ha banye n’aha' is unnatural in this Igbo baptismal construction.
    rationale: Although εἰς can carry an ‘into’ nuance, this wording is grammatically and idiomatically strained and risks obscuring the baptismal command. Natural Igbo uses ‘ime baptizim n’aha’; the source-language nuance can be preserved in an anchored note.
  - severity: low
    issue: ‘mba niile’ may be heard primarily as political nations.
    rationale: τὰ ἔθνη here includes peoples/nations. ‘ndị mba niile’ communicates the human referents more directly while retaining the universal scope.
  revised_text: Ya mere, gaanụ mee ndị mba niile ka ha bụrụ ndị na-eso ụzọ, na-eme ha baptizim n’aha[a] nke Nna na nke Ọkpara na nke Mmụọ Nsọ.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “banye n’aha.” N’ụzọ nkịtị, Grik kwuru “n’ime aha,” nke nwere ike imesi ịbanye na mmekọrịta ma ọ bụ njikọta ike.
    reason: alternative_reading
  revision_rationale: The revision retains the command’s force, the universal object, baptism as a means associated with making disciples, and the singular threefold name formula. It adopts idiomatic Standard Igbo for the baptismal expression and relocates the ‘into’ sense to a precise footnote, where it can be represented without forcing an unnatural main-text construction.
