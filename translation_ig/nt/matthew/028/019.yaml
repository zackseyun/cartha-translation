id: MAT.28.19
reference: Matthew 28:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πορευθέντες ⸀οὖν μαθητεύσατε πάντα τὰ ἔθνη, ⸀βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: ig
  text: Ya mere, gaanụ mee ndị mba niile ka ha bụrụ ndị na-eso ụzọ, na-eme ha baptizim n’aha[a] nke Nna na nke Ọkpara na nke Mmụọ Nsọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “banye n’aha.” N’ụzọ nkịtị, Grik kwuru “n’ime aha,” nke nwere ike imesi ịbanye na mmekọrịta ma ọ bụ njikọta ike.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: gaanụ
  rationale: Ọ bụ participle aorist nke na-ebute iwu bụ isi μαθητεύσατε; n’ebe a, ụdị iwu “gaanụ” na-egosipụta ike nke ozi ahụ n’Igbo nke ọma karịa ntụgharị siri ike dịka “mgbe unu gara.”
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’okwu Jizọs banyere ikike niile e nyere ya n’amaokwu 18.
- source_word: μαθητεύσατε
  choice: mee ... ka ha bụrụ ndị na-eso ụzọ
  rationale: Nke a na-echekwa echiche causative nke ime ka ndị mmadụ ghọọ ndị na-eso ụzọ, ma bụrụkwa Igbo doro anya nke oge a.
- source_word: πάντα τὰ ἔθνη
  choice: mba niile
  rationale: Ọ na-egosipụta oke zuru ụwa ọnụ nke “mba/agbụrụ niile” ma ghara ime ka okwu ahụ bụrụ naanị ndị na-abụghị ndị Juu.
- source_word: βαπτίζοντες
  choice: na-eme ha baptizim
  rationale: “Baptizim” bụ okwu a maara nke ọma maka emume Ndị Kraịst a; ọ naghị ekpebi ụzọ e si eme ya dịka imikpu n’ime mmiri.
- source_word: εἰς τὸ ὄνομα
  choice: ka ha banye n’aha
  rationale: Nke a na-anwa ichekwa ntụgharị na mmekọrịta ma ọ bụ njikọta nke εἰς (“banye n’ime”), kama ime ya naanị ka ọ bụrụ usoro e ji eme ihe.
- source_word: τοῦ πατρὸς
  choice: nke Nna
  rationale: “Nna” bụ aha nsọ n’usoro atọ a, ya mere e ji mkpụrụedemede ukwu dee ya.
- source_word: τοῦ υἱοῦ
  choice: nke Ọkpara
  rationale: “Ọkpara” na-egosipụta aha nsọ nke Ọkpara n’usoro a, ọ bụghị naanị nwa nwoke n’ozuzu.
- source_word: τοῦ ἁγίου πνεύματος
  choice: nke Mmụọ Nsọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka aha nsọ a, ma na-egosipụta onye a na-ekwu maka ya.
theological_decisions:
- issue: Ụzọ e si sụgharịa εἰς n’usoro baptizim ahụ
  choice: ka ha banye n’aha
  alternative: n’aha
  rationale: εἰς na-enwekarị echiche nke ịbanye n’ime; ntụgharị a na-echekwa echiche nke ịbanye na mmekọrịta ma ọ bụ njikọta n’etinyeghị nkọwa zuru ezu banyere otú baptizim si arụ ọrụ. E debere “n’aha” n’ala peeji dịka ntụgharị Igbo ọdịnala na nke kwere omume.
- issue: Otu “aha” na aha nsọ atọ so ya
  choice: n’aha nke Nna na nke Ọkpara na nke Mmụọ Nsọ
  alternative: n’aha Nna, Ọkpara, na Mmụọ Nsọ
  rationale: E debere “aha” n’otu ọnụ dịka Grik si dị, ebe njikọ atọ ahụ na-egosi Nna, Ọkpara, na Mmụọ Nsọ n’enweghị ịgbakwunye nkọwa karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ihe. E ji “gaanụ” gosipụta ike nke ozi ahụ; e zere okwu ga-ekpebi otu ụka si aghọta usoro baptizim.
