  text: Πορευομένων δὲ αὐτῶν ἰδού τινες τῆς κουστωδίας ἐλθόντες εἰς τὴν πόλιν ἀπήγγειλαν τοῖς ἀρχιερεῦσιν ἅπαντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/011.yaml
  text: While they were going[a], behold[b], some of the guard came into the city and reported to the chief priests everything that had happened.
translation:
  language: ig
  text: Mgbe ha na-aga[a], lee[b], ụfọdụ ndị nche ahụ batara n’obodo wee kọọrọ ndị isi nchụaja ihe niile mere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, ‘Ka ha na-aga.’ Ihe owuwu a n’asụsụ Grik, nke a kpọrọ genitive absolute, na-egosi oge ihe sochirinụ mere.
    reason: lexical_alternative
  - marker: b
    text: ‘Lee’ sụgharịrị okwu Grik ἰδού, nke na-adọta uche gaa n’ihe mberede ma ọ bụ ihe kwesịrị nlebara anya n’akụkọ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: Mgbe ha na-aga
  rationale: Nkebiokwu genitive absolute a na-enye oge ihe ọzọ mere; ntụgharị a na-edobe echiche ‘mgbe ha nọ n’ịga’ n’agbanyeghị na e kwughị ebe ha na-aga.
- source_word: ἰδού
  choice: lee
  rationale: ‘Lee’ bụ akara e ji adọta uche n’Igbo, na-egosi mgbanwe mberede ma ọ bụ ihe kwesịrị ka onye na-agụ ya ṅaa ntị.
- source_word: τινες τῆς κουστωδίας
  choice: ụfọdụ ndị nche ahụ
  rationale: κουστωδία na-ezo aka n’ìgwè ndị nche e debere n’ili; ‘ụfọdụ ndị nche ahụ’ doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: batara n’obodo
  rationale: Aorist participle a na-akọ ihe mere tupu ha enye akụkọ; ‘batara n’obodo’ na-eweta ya n’ụzọ Igbo dị ire.
- source_word: ἀπήγγειλαν
  choice: wee kọọrọ
  rationale: Ngwaa ahụ pụtara iweta ma nye akụkọ; ‘kọọrọ’ dabara n’ọnọdụ ndị nche na-agwa ndị ọchịchị ihe mere.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: ndị isi nchụaja
  rationale: Nke a bụ okwu Igbo doro anya maka ọtụtụ ἀρχιερεῖς, ndị nọ n’ọkwa ndu n’etiti ndị nchụaja.
- source_word: ἅπαντα τὰ γενόμενα
  choice: ihe niile mere
  rationale: ‘Ihe niile’ na-edobe ike zuru ezu nke ἅπαντα, ebe ‘mere’ na-ezo aka n’ihe ndị ahụ mere tupu akụkọ ahụ.
