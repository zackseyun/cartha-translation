id: MAT.28.4
reference: Matthew 28:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τοῦ φόβου αὐτοῦ ἐσείσθησαν οἱ τηροῦντες καὶ ἐγενήθησαν ⸀ὡς νεκροί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: ig
  text: Egwu ha tụrụ ya mere ka ndị nche ahụ maa jijiji, ha wee dị ka ndị nwụrụ anwụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ akụkụ mbụ a, “N’ihi egwu ha tụrụ ya, ndị nche ahụ mara jijiji.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ
  choice: mere ka
  rationale: N’ebe a, ἀπό na-egosi ihe kpatara mmeghachi omume ahụ. “Mere ka” na-egosipụta ihe kpatara ya nke ọma n’Igbo dị ugbu a.
- source_word: δὲ
  choice: (egosipụtaghị ya iche)
  rationale: δέ bụ njikọ akụkọ dị nro. N’Igbo, usoro ahịrịokwu na-aga n’ihu n’enweghị mkpa itinye “ma” ma ọ bụ “ugbu a,” nke nwere ike iweta nkwụsị ma ọ bụ mmegide na-adịghị n’isi mmalite.
- source_word: φόβου αὐτοῦ
  choice: egwu ha tụrụ ya
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ ebumpụta ụwa na onye ahụ bụ ihe ha tụrụ egwu. “Ya” na-edobe nnọchiaha Grik n’enweghị ịkpọ onye ahụ aha n’amaokwu a.
- source_word: ἐσείσθησαν
  choice: maa jijiji
  rationale: Okwu a na-egosi ahụ ịma jijiji n’ihi oke egwu; “maa jijiji” bụ okwu Igbo doro anya ma dị ndụ.
- source_word: οἱ τηροῦντες
  choice: ndị nche ahụ
  rationale: N’ọnọdụ akụkọ a, participle ahụ pụtara ndị nọ na-eche ili nche. “Ndị nche ahụ” bụ ntụgharị dị nkenke ma doo anya.
- source_word: ἐγενήθησαν
  choice: ha wee dị
  rationale: γίνομαι na-egosi mgbanwe ọnọdụ. N’Igbo, “wee dị” n’usoro ihe omume na-egosi na ha batara n’ọnọdụ ahụ, ma na-ada karịa “wee ghọọ ka,” nke na-adịghị eke ọnụ nke ọma.
- source_word: ὡς νεκροί
  choice: ka ndị nwụrụ anwụ
  rationale: '“Ka” na-edobe ntụnyere ahụ: ha abụghị ndị nwụrụ anwụ n’ezie, kama ọnọdụ ha yiri nke ndị nwụrụ anwụ.'
theological_decisions:
- issue: Onye αὐτοῦ (“ya”) na-ezo aka na ya
  choice: E debere nnọchiaha “ya,” nke n’ọnọdụ amaokwu ndị gbara ya gburugburu na-ezo aka n’ozi ahụ sitere n’eluigwe.
  alternative: Iwere ya dị ka ihe omume ahụ sitere n’eluigwe n’ozuzu ya.
  rationale: Onye a kpọtụrụ aha nso tupu amaokwu a bụ ozi ahụ nke ọdịdị ya dị ka àmụ̀mà. Ide “ya” na-echekwa njikọ ahụ ma ghara ịgbakwunye nkọwa ozizi n’ime amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Egwu ha tụrụ ya mere ka” bụ nhazi ebumpụta ụwa nke na-egosipụta ihe kpatara omume ahụ; “ndị nwụrụ anwụ” na-edobe ntụnyere ahụ n’enweghị ime ka ọ bụrụ na ha nwụrụ n’ezie.
