id: MAT.28.16
reference: Matthew 28:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οἱ δὲ ἕνδεκα μαθηταὶ ἐπορεύθησαν εἰς τὴν Γαλιλαίαν εἰς τὸ ὄρος οὗ ἐτάξατο αὐτοῖς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/016.yaml
  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: ig
  text: Ndị na-eso ụzọ iri na otu ahụ wee gaa Galili, gaa n’ugwu ahụ Jizọs gwara ha ka ha gaa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jizọs họpụtara ya nye ha.” Ngwaa Grik ahụ nwere ike ịpụta “ịhọpụta,” “inye ntụziaka,” ma ọ bụ “ịkọwapụta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: wee
  rationale: Ọ bụ njikọ dị nro na-akwalite akụkọ n’ihu; “wee” na-eme ka Igbo na-aga were were n’etinyeghị mmegide siri ike.
- source_word: ἕνδεκα μαθηταὶ
  choice: ndị na-eso ụzọ iri na otu ahụ
  rationale: “Ndị na-eso ụzọ” bụ okwu Igbo doro anya maka ndị na-amụta ihe n’aka Jizọs ma na-eso ya; “iri na otu” na-edobe ọnụ ọgụgụ kpọmkwem dị na Grik.
- source_word: ἐπορεύθησαν
  choice: gaa
  rationale: Ngwaa a pụtara ịga ma ọ bụ ime njem; “gaa” bụ okwu Igbo nkịtị ma dabara n’akụkọ a.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: gaa Galili
  rationale: Ọ na-egosi njem e mere ruo n’ógbè Galili; nke a bụ usoro okwu Igbo sitere n’okike.
- source_word: εἰς τὸ ὄρος
  choice: gaa n’ugwu ahụ
  rationale: “Ugwu” na-edobe ihe ὄρος pụtara, ebe “ahụ” na-egosi ugwu a kapịrị ọnụ nke Jizọs kwuru banyere ya.
- source_word: οὗ
  choice: ahụ ... ka ha gaa
  rationale: E tinyere ihe njikọ ebe ahụ n’usoro okwu Igbo sitere n’okike, nke na-akọwa ugwu Jizọs kwuru ka ha gaa.
- source_word: ἐτάξατο
  choice: gwara ha ka ha gaa
  rationale: N’ọnọdụ a, ngwaa ahụ na-egosi na Jizọs eburu ụzọ kọwaa ma ọ bụ họpụta ebe nzukọ ahụ; nsụgharị a doro onye Igbo anya ma ọ naghị agbakwunye echiche ọchịchị pụrụ iche.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha a na-ezo aka n’ebe ndị na-eso ụzọ iri na otu nọ.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: Nke a bụ odide aha ahụ a na-ejikarị eme ihe n’Igbo.
theological_decisions:
- issue: Otu e si ghọta ebe nzukọ ahụ Jizọs kwuru
  choice: “gwara ha ka ha gaa”
  alternative: “họpụtara nye ha” ma ọ bụ “doziiri ha”
  rationale: Ihe a na-ekwu bụ na Jizọs eburu ụzọ gosi ha ebe ha ga-aga. Okwu a na-edobe uche akụkọ ahụ n’etinyeghị echiche banyere nhọpụta n’ọkwa ọchịchị ma ọ bụ iwu siri ike nke ihe odide ahụ na-ekwughị hoo haa.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E debere “ugwu” na ọnụ ọgụgụ “iri na otu” kpọmkwem, ma jiri usoro okwu sitere n’okike kọwaa ntụziaka Jizọs nyere tupu oge ahụ.
