  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: ig
  text: Ha natara ọlaọcha ahụ ma mee dịka a gwara ha. Akụkọ a[a] gbasara n’etiti ndị Juu ruo taa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ozi a” ma ọ bụ “akụkọ a kọrọ.” Okwu Grik λόγος nwere ike ịpụta “okwu,” “ozi,” “akụkọ,” ma ọ bụ “akụkọ a kọrọ,” dịka ọnọdụ ya si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: ha natara
  rationale: N’ọnọdụ a, λαμβάνω na-egosi na ndị nche natara ọlaọcha ahụ ndị isi nchụaja nyere ha n’amaokwu bu ụzọ; “natara” bụ okwu Igbo doro anya ma kwekọọ n’omume ahụ.
- source_word: τὰ ἀργύρια
  choice: ọlaọcha ahụ
  rationale: ἀργύρια nwere ike ịpụta ọlaọcha ma ọ bụ ego; “ọlaọcha ahụ” na-edobe ihe okwu Grik kwuru n’enweghị ịkọwa ya kpọmkwem dịka mkpụrụ ego.
- source_word: ἐποίησαν ὡς ἐδιδάχθησαν
  choice: mee dịka a gwara ha
  rationale: N’ebe a, passive nke διδάσκω na-ezo aka n’ihe a kụziiri ma ọ bụ nyere ha iwu ka ha kwuo. “Dịka a gwara ha” bụ Igbo nkịtị ma na-edobe echiche nke ntụziaka ahụ.
- source_word: διεφημίσθη
  choice: wee gbasaa
  rationale: Ngwaa a pụtara mgbasa sara mbara nke akụkọ ma ọ bụ okwu. “Wee gbasaa” na-egosi ihe malitere mgbe ahụ ma nọgide ruo oge onye dere akwụkwọ ahụ.
- source_word: ὁ λόγος οὗτος
  choice: Akụkọ a
  rationale: λόγος nwere ọtụtụ nghọta, gụnyere okwu, akụkọ, na akụkọ a kọọrọ mmadụ. N’ọnọdụ a, ọ na-ezo aka n’ihe ndị nche kwuru nke gbasara n’etiti ndị mmadụ.
- source_word: παρὰ Ἰουδαίοις
  choice: n’etiti ndị Juu
  rationale: παρά tinyere dative ebe a pụtara “n’etiti” otu ndị mmadụ. Nsụgharị a na-ejedebe naanị n’ọnọdụ akụkọ Matiu ma ọ dịghị etinye ikpe sara mbara banyere ndị Juu.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: ruo taa
  rationale: Nke a bụ akpaalaokwu pụtara na mgbasa akụkọ ahụ gara n’ihu ruo oge onye dere ya; “ruo taa” bụ Igbo dị mkpirikpi ma doo anya.
theological_decisions:
- issue: Ụzọ e si asụgharị Ἰουδαίοις n’akụkọ nwere ike ime ka ndị na-agụ ya were ya dịka ikpe megide ndị Juu niile
  choice: n’etiti ndị Juu
  alternative: n’etiti ndị Judia
  rationale: Okwu ahụ na-ekwu banyere ebe akụkọ a gbasara n’ime obodo ndị Juu n’oge akụkọ ahụ. “Ndị Juu” bụ nsụgharị kpọmkwem ma a naghị eji ya kwuo ihe karịrị ihe Matiu kwuru; “ndị Judia” ga-eme ka ọ yie ka isi okwu bụ naanị mpaghara ala.
- issue: Ihe ὁ λόγος οὗτος na-ezo aka na ya
  choice: Akụkọ a
  alternative: Ozi a
  rationale: Okwu Grik ahụ nwere ike ịbụ akụkọ, ozi, okwu, ma ọ bụ akụkọ a kọrọ. “Akụkọ a” dabara n’ihe ndị nche kọrọ, ma e debere “ozi a” dịka nhọrọ ọzọ n’okpuru peeji iji ghara ikpochapụ obosara nghọta λόγος.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị mfe nghọta ma nwee ugwu. Ahịrịokwu abụọ ahụ na-agbaso usoro akụkọ Grik, ebe “wee gbasaa” na-enye njikọ akụkọ dị mma n’Igbo. E tinyere akara ndetu [a] ozugbo n’azụ “ruo taa” dịka usoro mbipụta chọrọ.
