  text: λέγοντες· Εἴπατε ὅτι Οἱ μαθηταὶ αὐτοῦ νυκτὸς ἐλθόντες ἔκλεψαν αὐτὸν ἡμῶν κοιμωμένων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/013.yaml
  text: saying[a], “Say[b], ‘His disciples came by night and stole him while we were sleeping.’”
translation:
  language: ig
  text: na-asị, “Sịanụ, ‘Ndị na-eso ụzọ ya bịara n'abalị[a] zuru ya[b] mgbe anyị nọ na-ehi ụra.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n'oge abalị.” Okwu Greek νυκτός na-egosi oge ha bịara.
    reason: lexical_alternative
  - marker: b
    text: Greek kwuru “ya,” ọ bụghị “ozu ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ bụ participle nke na-ewebata ihe e nyere ha iwu ikwu; “na-asị” dabara n'usoro akụkọ Igbo ma na-ejigide omume ahụ na-aga n'ihu.
- source_word: Εἴπατε
  choice: Unu ga-asị
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ. N'Igbo, “Unu ga-asị” na-enye iwu siri ike n'ụzọ ebumpụta ụwa, n'agbanyeghị na ọdịdị ya yiri future.
- source_word: ὅτι
  choice: akara nhota okwu
  rationale: ὅτι na-ewebata ọdịnaya okwu ahụ; akara nhota okwu na-egosipụta ọrụ ya nke ọma n'Igbo n'enweghị ịgbakwunye “na” na-adịghị mkpa.
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: Ndị na-eso ụzọ ya
  rationale: Nke a bụ ụzọ Igbo doro anya na nke ebumpụta ụwa isi kwuo ndị bụ ndị na-eso ụzọ ya.
- source_word: νυκτὸς
  choice: n'abalị
  rationale: Genitive a na-arụ ọrụ adverb, na-egosi oge ha bịara; “n'abalị” bụ okwu Igbo dị mfe ma kpọmkwem.
- source_word: ἐλθόντες
  choice: bịara
  rationale: 'Aorist participle a mere tupu ma jikọọ ya na isi ngwaa; Igbo na-egosipụta ya nke ọma dịka ngwaa n''usoro: “bịara ... zuru.”'
- source_word: ἔκλεψαν
  choice: zuru
  rationale: “Zuru” bụ ngwaa Igbo nkịtị maka izu mmadụ ma ọ bụ ihe n'ụzọ ohi.
- source_word: αὐτὸν
  choice: ya
  rationale: Edebere personal pronoun nke Greek kpọmkwem; a gbakwụnyeghị “ozu ya,” nke ga-abụ nkọwa na-adịghị na isi mmalite.
- source_word: ἡμῶν κοιμωμένων
  choice: mgbe anyị nọ na-ehi ụra
  rationale: Nke a na-asụgharị genitive absolute ahụ n'Igbo doro anya, na-egosi na izu ahụ mere n'oge ha na-ehi ụra.
theological_decisions:
- issue: Ihe αὐτόν na-ezo aka na ya n'akụkọ ụgha ahụ
  choice: Edebere ya dịka personal pronoun “ya.”
  alternative: “ozu ya”
  rationale: Greek kwuru αὐτόν, ya bụ “ya,” ọ bụghị “ozu ya.” Ọnọdụ akụkọ ahụ emeela ka onye a na-ekwu maka ya doo anya, ya mere ọ dịghị mkpa ịgbakwunye nkọwa nwere ike imechi nghọta okwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E ji “ndị na-eso ụzọ” mee ka μαθηταί bụrụ okwu ndị nkịtị ga-aghọta; e jikwa usoro okwu kwụ ọtọ chekwaa ọdịdị iwu na akụkọ ụgha ahụ.
