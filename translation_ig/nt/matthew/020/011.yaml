  text: λαβόντες δὲ ἐγόγγυζον κατὰ τοῦ οἰκοδεσπότου
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/011.yaml
  text: And after receiving it[a], they began grumbling against the master of the house,
translation:
  language: ig
  text: Mgbe ha natara ya[a], ha malitere ịtamụ ntamu megide onye nwe ụlọ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ha natara ụgwọ ahụ, ha nọ na-atamụ ntamu megide onye nwe ala ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: Mgbe ha natara ya
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi. Nke a na-eme ka usoro ihe ahụ doo anya n'Igbo; “ya” na-anọchi anya otu denariọs ahụ e kwuru okwu ya n'amaokwu ndị gbara ya gburugburu.
- source_word: δὲ
  choice: ''
  rationale: δὲ bụ njikọ dị nro na-aga n'ihu n'akụkọ ahụ. N'Igbo, usoro ahịrịokwu ahụ na-aga nke ọma n'enweghị ịsụgharị ya iche.
- source_word: ἐγόγγυζον
  choice: ha malitere ịtamụ ntamu
  rationale: Imperfect a nwere ike igosi mmalite ma ọ bụ omume na-aga n'ihu. “Malitere ịtamụ ntamu” na-egosi na mkpesa ahụ bidoro mgbe ha natara ụgwọ, ma na-echekwa echiche nke ikwu okwu n'obi adịghị ụtọ.
- source_word: κατὰ
  choice: megide
  rationale: κατά na genitive ebe a na-egosi na ntamu ahụ chere ihu megide mmadụ.
- source_word: τοῦ οἰκοδεσπότου
  choice: onye nwe ụlọ ahụ
  rationale: Nke a na-enye echiche οἰκοδεσπότης dị ka onye isi ma ọ bụ onye nwe ụlọ na ihe ndị dị n'okpuru ya, n'Igbo dị ugbu a ma dị mfe nghọta.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe, dị ugwu ma dị mfe nghọta. E debere ọdịiche dị n'etiti nghọta inceptive na progressive nke ἐγόγγυζον, nakwa n'etiti “onye nwe ụlọ” na “onye nwe ala,” n'ihe odide na nkọwa ala peeji.
