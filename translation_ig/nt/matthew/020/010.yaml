    reason: lexical_alternative
  - marker: b
    text: Denarịọs bụ ego a na-akwụkarị onye ọrụ ụgwọ otu ụbọchị.
    reason: cultural_note
  revision_rationale: The revision keeps the draft’s faithful rendering while replacing a repetitive distributive phrase with idiomatic Standard Igbo and correcting footnote a so that it is both grammatical and structurally a genuine alternative. The historical-currency note is also smoothed for natural usage.
