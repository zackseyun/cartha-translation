  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: ig
  text: Mgbe ndị mbụ[a] bịara, ha chere na ha ga-anata ego karị; ma ha onwe ha natakwara otu denarịọs, onye ọ bụla.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị e buru ụzọ were n’ọrụ”; okwu a na-ezo aka na ndị ọrụ e buru ụzọ were n’ọrụ n’ilu ahụ.
    reason: lexical_alternative
  - marker: b
    text: Denarịọs bụ ego a na-akwụkarị onye ọrụ ụgwọ otu ụbọchị.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: Mgbe ... bịara
  rationale: A sụgharịrị participle aorist ahụ dị ka nkebiokwu oge iji gosipụta usoro ihe mere n’ụzọ Igbo na-asụkarị.
- source_word: οἱ πρῶτοι
  choice: ndị mbụ
  rationale: Nke a na-ejigide nkenke na ntakịrị mgbagwoju anya dị n’okwu Grik, ebe ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ ndị ọrụ e buru ụzọ were n’ọrụ.
- source_word: ἐνόμισαν
  choice: ha chere
  rationale: Ọ na-egosi echiche ma ọ bụ atụmanya ha, n’enweghị ịkọwa ya dị ka ihe ha ji n’aka.
- source_word: πλεῖον
  choice: ego karị
  rationale: N’agbanyeghị na okwu Grik pụtara ‘karị,’ itinye ‘ego’ na-eme ka ihe a na-ekwu banyere ya doo anya n’Igbo dịka ụgwọ ọrụ.
- source_word: λήμψονται
  choice: ha ga-anata
  rationale: Oge ọdịnihu dị n’okwu Grik na-egosi ihe ha tụrụ anya na ha ga-enweta.
- source_word: τὸ ἀνὰ δηνάριον
  choice: otu denarịọs n’otu n’otu
  rationale: ἀνά nwere nghọta nkesa; ‘n’otu n’otu’ na-egosi na onye ọ bụla natara otu denarịọs.
- source_word: καὶ αὐτοί
  choice: ma ha onwe ha natakwara
  rationale: ‘Ha onwe ha’ na ‘-kwa’ na-egosipụta nrụsi ike nke αὐτοί na ihe ijuanya na ha natakwara otu ụgwọ ahụ; ‘ma’ na-egosi ọdịiche doro anya n’ọnọdụ a.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ‘denarịọs’ dị ka aha mkpụrụ ego oge ahụ, tinyekwa nkọwa omenala n’ala ala peeji.
