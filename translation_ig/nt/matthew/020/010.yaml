review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal participle, the first group’s expectation of greater pay, and the emphatic fact that they also received the same denarius. Adding “ego” to “karị” is a contextually warranted clarification. The distributive expression “otu denarịọs n’otu n’otu,” however, is unnecessarily repetitive and less idiomatic in Standard Igbo.
  naturalness: The verse is generally clear and appropriately modern, but “otu denarịọs n’otu n’otu” should be recast as “otu denarịọs, onye ọ bụla.” The wording of footnote a is grammatically awkward and does not provide a genuine lexical alternative to the main text.
  terminology: “Denarịọs” suitably retains the historical currency name. “Ndị mbụ” preserves the Greek’s concise designation, while the note can identify them as the laborers hired first in the parable without making that expansion the translation itself.
  issues:
  - severity: medium
    issue: The distributive phrase is redundant and unnatural.
    rationale: “Otu denarịọs n’otu n’otu” repeats the notion of one/each. “Otu denarịọs, onye ọ bụla” naturally expresses τὸ ἀνὰ δηνάριον.
  - severity: medium
    issue: Footnote a is malformed and is not a true alternative reading.
    rationale: The phrase “n’ebe a nye” is not natural in this construction, and the note’s proposed wording is an explanatory expansion rather than a lexical alternative. It should offer “ndị e buru ụzọ were n’ọrụ” as the alternative and then explain the referent.
  revised_text: Mgbe ndị mbụ[a] bịara, ha chere na ha ga-anata ego karị; ma ha onwe ha natakwara otu denarịọs, onye ọ bụla.[b]
