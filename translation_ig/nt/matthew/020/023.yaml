  to: Ọ sịrị ha, “N’ezie, unu ga-aṅụ iko m[a]. Ma ịnọdụ n’aka nri m na n’aka ekpe m[b] abụghị nke m inye; kama ọ bụ maka ndị Nna m kwadebeere ha ya.”
  rationale: The revision is limited to the final clause. It explicitly renders the Greek dative beneficiaries (‘for whom’) with ha while retaining ya for the thing prepared, thereby preserving the source’s ellipsis and meaning in natural, unambiguous Standard Igbo. The existing footnote anchors appropriately attach the cup note to “iko m” and the lexical alternative to the sitting phrase.
