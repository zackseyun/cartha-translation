id: MAT.20.23
reference: Matthew 20:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: ig
  text: Ọ sịrị ha, “N’ezie, unu ga-aṅụ iko m[a]. Ma ịnọdụ n’aka nri m na n’aka ekpe m[b] abụghị nke m inye; kama ọ bụ maka ndị Nna m kwadebeere ha ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Iko” bụ ihe atụ nke ahụhụ ma ọ bụ akara aka e kenyere Jizọs, nke ndị na-eso ụzọ ya ga-esokwa kerịta.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsụgharị ya, “ịnọdụ n’akụkụ aka nri m na n’akụkụ aka ekpe m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Ọ sịrị ha
  rationale: Ọ bụ ezie na Grik ji ngwaa oge ugbu a n’akụkọ a, iji oge gara aga mee ya n’Igbo bụ ụzọ e si akọ akụkọ n’ụzọ dị ire ma na-edobe ihe okwu ahụ pụtara.
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: N’ezie, unu ga-aṅụ iko m
  rationale: E debere ihe atụ ahụ bụ ‘iko m’ n’enweghị ịkọwa ya n’ahịrịokwu bụ isi. ‘N’ezie’ na-egosipụta nkwenye na ọdịiche nke μὲν tupu okwu mgbochi na-esochi.
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: ịnọdụ n’aka nri m na n’aka ekpe m
  rationale: Nke a bụ okwu Igbo doro anya maka ịnọ n’ebe nsọpụrụ dị n’akụkụ aka nri na aka ekpe Jizọs, ma ọ ka na-edobe oyiyi nke okwu Grik.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: abụghị nke m inye
  rationale: Nsụgharị a na-esochi okwu Grik anya ma na-edobe nkwupụta Jizọs n’enweghị ịgbakwunye nkọwa banyere ikike ya.
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: kama ọ bụ maka ndị ... kwadebeere ya
  rationale: Okwu Grik hapụrụ akụkụ ụfọdụ ka onye na-agụ ya ghọta. E tinyere ‘ọ bụ maka’ iji mee ka Igbo doo anya, ebe ‘kwadebeere’ na-egosi na nkwadebe ahụ emeworị ma ka dị irè.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: Nna m
  rationale: A tụgharịrị onye mere nkwadebe ahụ ozugbo dịka Nna Jizọs, n’etinyeghị okwu dịka ‘naanị,’ nke na-adịghị n’ihe odide Grik.
theological_decisions:
- issue: Ihe okwu Jizọs bụ́ ‘abụghị nke m inye’ pụrụ ịpụta banyere ikike ya
  choice: E debere nkwupụta ahụ otú o si dị, n’etinyeghị okwu ga-akọwa ya ma ọ bụ belata ike ya.
  alternative: Ịsị ‘abụghị nke m inye ma e wezụga site n’aka Nna m,’ ma ọ bụ ịkọwagharị ya iji wepụ esemokwu nkà mmụta okpukpe.
  rationale: Ihe odide ahụ n’onwe ya na-edobe ọdịiche dị n’etiti ọrụ Jizọs na nkwadebe Nna ya. Nsụgharị ekwesịghị itinye nkọwa nkwenkwe iji dozie esemokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ ‘iko’ na esemokwu nkà mmụta okpukpe dị n’okwu Jizọs, kama ịkọwa ha n’ime amaokwu ahụ.
