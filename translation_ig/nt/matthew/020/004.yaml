  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: ig
  text: Ọ sịrị ha, “Unu kwa, gaanụ n’ubi vaịn ahụ, aga m enye unu ihe ọ bụla ziri ezi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe ọ bụla bụ nke ikpe ziri ezi” ma ọ bụ “ihe ọ bụla kwesịrị ekwesị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις
  choice: ha
  rationale: Nnọchiaha a n'ụdị dative plural na-ezo aka n ndị ọrụ ndị ọzọ a kpọtụrụ aha n'okwu gbara ya gburugburu; “ha” bụ Igbo nkịtị ma doo anya.
- source_word: εἶπεν
  choice: Ọ sịrị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n'ịwebata okwu mmadụ kwuru kpọmkwem.
- source_word: Ὑπάγετε
  choice: gaanụ
  rationale: Ụdị iwu plural nke ὑπάγω ebe a bụ iwu dị mfe ka ha gaa n'ubi vaịn.
- source_word: καὶ ὑμεῖς
  choice: Unu onwe unu kwa
  rationale: '“Onwe unu kwa” na-echekwa nkwusi ike na nsonye dị na καὶ ὑμεῖς: a na-ezigakwa ndị a dịka ndị gara aga.'
- source_word: ἀμπελῶνα
  choice: ubi vaịn
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ubi a na-akụ mkpụrụ vaịn.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: ihe ọ bụla ziri ezi
  rationale: Nhọrọ a na-echekwa obosara nke δίκαιον dịka ihe ziri ezi, nke e mere n'ikpe ziri ezi, ma ọ bụ nke kwesiri ekwesi, n'emeghị ka ọ bụrụ naanị okwu iwu ma ọ bụ ụgwọ ọrụ.
- source_word: δώσω ὑμῖν
  choice: aga m enye unu
  rationale: δίδωμι pụtara “inye”; ọ bụ ezie na ọnọdụ ahụ metụtara ụgwọ ọrụ, nsụgharị a anaghị etinye ngwaa “ịkwụ” nke na-adịghị na Grik.
theological_decisions:
- issue: Nsụgharị δίκαιον n'ọnọdụ nkwekọrịta ụgwọ ọrụ
  choice: ziri ezi
  alternative: nke ikpe ziri ezi; nke kwesiri ekwesi
  rationale: “Ziri ezi” na-echekwa echiche omume na ikpe ziri ezi dị n'okwu Grik ahụ n'enweghị itinye nkọwa iwu siri ike ma ọ bụ ime ka ọ bụrụ naanị ihe mmadụ chere na ọ dabara adaba.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E jiri “ubi vaịn” mee ka ọnọdụ ọrụ ahụ doo ndị na-agụ akwụkwọ anya; e chekwara nkwusi ike nke καὶ ὑμεῖς site na “Unu onwe unu kwa.”
