id: MAT.20.19
reference: Matthew 20:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: ig
  text: Ha ga-enyefe ya n’aka ndị mba ọzọ ka ha kwaa ya emo, pịa ya ụtarị, ma kpọgide ya n’obe; n’ụbọchị nke atọ, a ga-akpọlite ya n’ọnwụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ ga-ebili n’ọnwụ.” Ngwaa Grik dị n’olu nnabata (“a ga-akpọlite ya”), bụ ụzọ a na-ejikarị ekwu maka mbilite n’ọnwụ nke nwere ike igosi ọrụ Chineke.
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: Ha ga-enyefe ya n’aka
  rationale: “Nyefee ... n’aka” na-egosi inyefe mmadụ n’ike ma ọ bụ n’aka ndị ọzọ, n’etinyeghị echiche a kapịrị ọnụ nke ịrara mmadụ nye.
- source_word: τοῖς ἔθνεσιν
  choice: ndị mba ọzọ
  rationale: N’ọnọdụ ndị Juu a, okwu a na-ezo aka n’ebe ndị na-abụghị ndị Juu nọ, ọ bụghị naanị mba dị iche iche n’ozuzu.
- source_word: ἐμπαῖξαι
  choice: kwaa ya emo
  rationale: Nke a bụ okwu Igbo doro anya ma dịkwa ndụ maka ime mmadụ ihe ọchị n’ụzọ mkparị.
- source_word: μαστιγῶσαι
  choice: pịa ya ụtarị
  rationale: Ọ na-egosi iti mmadụ ụtarị dịka ntaramahụhụ, ma doo ndị na-agụ Igbo nke oge a anya.
- source_word: σταυρῶσαι
  choice: kpọgide ya n’obe
  rationale: Nke a bụ ụzọ Igbo a na-aghọta nke ọma isi kwuo igbu mmadụ site n’ịkpọgide ya n’obe.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: n’ụbọchị nke atọ
  rationale: Ọ na-edobe okwu oge nke Grik n’ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ihe.
- source_word: ἐγερθήσεται
  choice: a ga-akpọlite ya n’ọnwụ
  rationale: Usoro a na-edobe olu nnabata nke ngwaa Grik ma na-ahapụ onye mere omume ahụ n’ekwughị kpọmkwem, dị ka ihe e nwere ike ịghọta dịka ọrụ Chineke.
theological_decisions:
- issue: Olu ngwaa mbilite n’ọnwụ
  choice: a ga-akpọlite ya n’ọnwụ
  alternative: ọ ga-ebili n’ọnwụ
  rationale: Grik ji ngwaa ọdịnihu dị n’olu nnabata. Nsụgharị a na-edobe ọdịdị ahụ na echiche ọrụ Chineke nwere ike ịdị na ya, n’agọnahụghị ụzọ ọzọ Akwụkwọ Nsọ si ekwu banyere ike Kraịst.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke kwụ ọtọ ma dị ùgwù. E tinyere ihe nnara “ya” n’ebe ụfọdụ maka nghọta na ịdị larịị n’Igbo, ebe Grik na-eme ka otu ihe nnara ahụ gbasaa n’usoro ngwaa atọ.
