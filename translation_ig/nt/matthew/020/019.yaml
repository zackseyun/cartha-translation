  verdict: approve
  source_fidelity: 'The translation accurately represents each principal Greek element: handing over to non-Jewish authorities, the coordinated purposes of mockery, flogging, and crucifixion, and the temporal resurrection prediction. “A ga-akpọlite ya n’ọnwụ” appropriately preserves the future passive force of ἐγερθήσεται without specifying the agent.'
  naturalness: The wording is clear, idiomatic Standard Igbo, and maintains an appropriate solemn biblical register. The coordinated verbs and semicolon make the sequence easy to follow.
  terminology: “Ndị mba ọzọ” suitably conveys τοῖς ἔθνεσιν in this Jewish narrative setting; “kpọgide ya n’obe” is an established, comprehensible rendering for crucifixion; and the resurrection terminology is natural and theologically non-presumptive. The footnote gives a legitimate active-voice alternative while correctly identifying the Greek passive.
