source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: ig
  text: Jizọs wee nwee ọmịiko n’ebe ha nọ, metụkwa anya ha aka. Ozugbo ahụ, ha hụkwara ụzọ, soro ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha natara ike ịhụ ụzọ ọzọ.” Ngwaa Grik ahụ nwekwara ike ịpụta, n’ụzọ nkịtị, “ile anya elu”; ma n’ebe a, ọ na-ekwu maka ndị ìsì inweta ike ịhụ ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: nweere ha ọmịiko
  rationale: Okwu a na-egosi ọmịiko miri emi nke kpaliri Jizọs ime ihe. Nke a bụ ụzọ doro anya ma dịkwa eke e si kwuo ya n’Igbo.
- source_word: δὲ
  choice: wee
  rationale: N’ebe a, δέ bụ njikọ dị nro nke na-eme ka akụkọ gaa n’ihu; “wee” na-arụ ọrụ ahụ nke ọma n’Igbo n’enweghị ime ka o yie okwu mmegide.
- source_word: ἥψατο
  choice: metụ ... aka
  rationale: N’ọnọdụ ọgwụgwọ a, ngwaa ahụ pụtara imetụ mmadụ ma ọ bụ ihe aka n’anụ ahụ.
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: anya ha
  rationale: Nke a bụ ụzọ Igbo si akọwa ihe Grik ahụ pụtara n’ụzọ dị mfe ma bụrụkwa nke eke.
- source_word: εὐθέως
  choice: Ozugbo ahụ
  rationale: Ọ na-egosi na nsonaazụ ahụ bịara n’otu ntabi anya, n’enweghị oge gafere.
- source_word: ἀνέβλεψαν
  choice: ha wee hụ ụzọ
  rationale: N’ọnọdụ ọgwụgwọ ndị ìsì a, okwu ahụ na-egosi na ha natara ike ịhụ ụzọ. Nsụgharị a na-eme ka ihe mere doo anya ma ghara ịgbakwunye nkọwa na-adịghị n’amaokwu ahụ.
- source_word: ἠκολούθησαν αὐτῷ
  choice: soro ya
  rationale: Nke a na-echekwa ma echiche nke iso Jizọs gawa ma ụda nke iso ụzọ ya, n’enweghị ikwu hoo haa na ha ghọrọ ndị na-eso ụzọ ya ruo mgbe ebighị ebi.
theological_decisions:
- issue: Ihe ἀνέβλεψαν pụtara gbasara ọgwụgwọ ahụ
  choice: Ha natara ike ịhụ ụzọ ozugbo
  alternative: Ha lere anya elu, ma ọ bụ malite ịhụ ihe n’ụzọ a na-akọwaghị nke ọma
  rationale: Njikọ εὐθέως na ἀνέβλεψαν n’akụkọ ọgwụgwọ ndị ìsì na-egosi ọgwụgwọ anya nke mere ozugbo. A kọwara nke a n’enweghị ịgbatị ihe ederede ahụ.
- issue: Ihe ἠκολούθησαν αὐτῷ pụtara
  choice: soro ya
  alternative: ghọrọ ndị na-eso ụzọ ya
  rationale: Amaokwu ahụ kwuru na ha soro Jizọs. Ọ pụrụ inwe echiche nke ịbụ ndị na-eso ụzọ ya, ma ọ kọwaghị ogologo oge ma ọ bụ omimi nke iso ya; ya mere, a hapụrụ okwu ahụ ka o nwee obosara ihe ọ pụtara.
translation_notes:
  register: E ji asụsụ Igbo izugbe nke oge a, dị mfe ma dị ùgwù, sụgharịa amaokwu ahụ. E debere akara nkọwa ala peeji [a] n’akụkụ “hụ ụzọ,” bụ okwu nkọwa ahụ metụtara.
