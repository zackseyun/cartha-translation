revisions:
- from: Jizọs wee nweere ha ọmịiko, metụ anya ha aka. Ozugbo ahụ, ha wee hụ ụzọ[a], soro ya.
  to: Jizọs wee nwee ọmịiko n’ebe ha nọ, metụkwa anya ha aka. Ozugbo ahụ, ha hụkwara ụzọ, soro ya.[a]
  rationale: The revision uses idiomatic Standard Igbo for Jesus’ compassion, retains the immediate healing and subsequent following, and corrects the lexical note so that it reflects the Greek alternatives without adding an inceptive meaning. The note anchor is moved to the end of the clause containing “hụ ụzọ,” so it unambiguously applies to the whole healing-result expression.
