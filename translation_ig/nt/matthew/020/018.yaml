id: MAT.20.18
reference: Matthew 20:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: ig
  text: “Lee[a], anyị na-arịgo Jerusalem. A ga-enyefe[b] Nwa nke Mmadụ[c] n’aka ndị isi nchụaja na ndị odeakwụkwọ, ha ga-amakwa ya ikpe ọnwụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Lekwa.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a ga-etinye ya n’aka ha”; n’ọnọdụ okwu dị warara karị, ngwaa ahụ nwekwara ike ịpụta “a ga-arara ya nye.”
    reason: lexical_alternative
  - marker: c
    text: “Nwa nke Mmadụ” bụ aha Jizọs ji akpọ onwe ya mgbe mgbe, ọ pụkwara ịdị na-echetara okwu dị na Daniel 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu e ji adọta uche onye na-ege ntị; “Lee” bụ okwu Igbo dị ugbu a, doo anya, ma nwee nsọpụrụ.
- source_word: ἀναβαίνομεν
  choice: anyị na-arịgo
  rationale: Ọ na-echekwa ụdị ngwaa oge ugbu a na echiche ịrịgo Jerusalem, ma n’ụzọ ala ma n’ụzọ omenala ofufe.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Nke a bụ aha obodo ahụ a na-ejikarị eme ihe n’Igbo ugbu a.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Ọ na-echekwa aha Jizọs ji akpọ onwe ya na nkwughachi o nwere ike inwe banyere Daniel 7:13–14, kama ịkọwa ya n’ụzọ ga-eme ka otu ihe ọ pụtara naanị pụta.
- source_word: παραδοθήσεται
  choice: a ga-enyefe
  rationale: Ọ na-egosi na a ga-etinye ya n’aka ndị ọzọ, n’akọwaghị n’amaokwu a kpọmkwem onye mere ya ma ọ bụ mee ka ọ bụrụ naanị omume ịrara mmadụ nye.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: n’aka ndị isi nchụaja
  rationale: Ọ na-ezo aka n’òtù ndị ndu nchụaja, ọ bụghị naanị otu nnukwu onye nchụaja.
- source_word: γραμματεῦσιν
  choice: ndị odeakwụkwọ
  rationale: Nke a na-echekwa aha otu ndị ahụ dịka okwu Grik si kwuo ya, na-enweghị itinye nkọwa sara mbara n’ime amaokwu ahụ.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: ha ga-ama ya ikpe ọnwụ
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si kwuo mkpebi ikpe nke ntaramahụhụ ya bụ ọnwụ.
theological_decisions:
- issue: Nsụgharị aha Kraịst ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: Nhọrọ a na-echekwa aha pụrụ iche Jizọs ji ekwu banyere onwe ya na njikọ o nwere ike inwe na Daniel 7, na-emeghị ya ka ọ bụrụ naanị okwu izugbe banyere mmadụ.
- issue: Oke ihe παραδοθήσεται pụtara
  choice: a ga-enyefe
  alternative: a ga-arara ya nye
  rationale: “A ga-enyefe” na-echekwa echiche sara mbara nke itinye mmadụ n’aka ndị iro; ọ naghị ekpebi n’amaokwu a na ihe a na-ekwu bụ naanị nrara Judas rara ya.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị mfe nghọta ma nwee nsọpụrụ. E debere usoro okwu ahụ n’ụzọ na-asụ ụtọ n’Igbo, ma chekwaa echiche ịrịgo Jerusalem, aha “Nwa nke Mmadụ,” na obosara ihe ngwaa παραδίδω pụtara.
