revisions:
- from: N’ihi na alaeze eluigwe dị ka otu nwoke, bụ́ onye nwe ụlọ, onye pụrụ n’isi ụtụtụ gaa iku ndị ọrụ ka ha rụọ ọrụ n’ubi vaịn ya.
  to: N’ihi na alaeze eluigwe dị ka otu nwoke, onye bụ nna ukwu ụlọ, onye pụrụ n’isi ụtụtụ ịkụ ndị ọrụ n’ọrụ n’ubi vaịn ya.
  rationale: The revision preserves the Greek apposition (a man, a householder/master), the explicit early-morning departure, and the purpose of hiring workers for his vineyard. It uses current, intelligible Standard Igbo and does not resolve any interpretive issue beyond the lexical force of οἰκοδεσπότης.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the comparison, the kingdom-of-heaven expression, the early-morning departure, the workers, and the vineyard. However, "onye nwe ụlọ" ordinarily means the owner of a house and does not fully express οἰκοδεσπότῃ, a householder/master of a household. The construction "gaa iku ndị ọrụ ka ha rụọ ọrụ" is understandable but somewhat redundant and less direct than the Greek purpose infinitive.
  naturalness: The overall register is clear Standard Igbo. "Pụtara n’isi ụtụtụ" naturally expresses going out early in the morning. "ịkụ ndị ọrụ n’ọrụ" is a more idiomatic, concise expression for hiring/employing workers.
  terminology: Retain "alaeze eluigwe" and "ubi vaịn." Use "nna ukwu ụlọ" for the householder/master sense, while retaining "otu nwoke" for ἀνθρώπῳ.
  issues:
  - severity: medium
    issue: '"onye nwe ụlọ" is narrower than οἰκοδεσπότης.'
    rationale: It can mean merely a homeowner, whereas the Greek identifies the man as a householder/master. "nna ukwu ụlọ" better retains the social role without adding interpretation.
  - severity: low
    issue: The hiring clause is unnecessarily repetitive.
    rationale: '"iku ndị ọrụ ka ha rụọ ọrụ" repeats the work idea. "ịkụ ndị ọrụ n’ọrụ n’ubi vaịn ya" naturally conveys hiring workers for employment in his vineyard.'
  revised_text: N’ihi na alaeze eluigwe dị ka otu nwoke, onye bụ nna ukwu ụlọ, onye pụrụ n’isi ụtụtụ ịkụ ndị ọrụ n’ọrụ n’ubi vaịn ya.
