id: MAT.20.1
reference: Matthew 20:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: ig
  text: N’ihi na alaeze eluigwe dị ka otu nwoke, onye bụ nna ukwu ụlọ, onye pụrụ n’isi ụtụtụ ịkụ ndị ọrụ n’ọrụ n’ubi vaịn ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: alaeze eluigwe
  rationale: Nke a bụ okwu Igbo a maara nke ọma maka ‘the kingdom of heaven,’ ma na-edobe ụdị okwu Matiu ji eme ihe.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: otu nwoke, bụ́ onye nwe ụlọ
  rationale: A hapụrụ ma ἀνθρώπῳ (‘otu nwoke’) ma οἰκοδεσπότῃ (‘onye nwe ụlọ’) ka nkọwa abụọ ahụ dị n’asụsụ isi mmalite ghara ịla n’iyi.
- source_word: ἅμα πρωῒ
  choice: n’isi ụtụtụ
  rationale: Ọ na-egosi oge ụtụtụ malitere, n’asụsụ Igbo dị mfe ma bụrụ nke e ji eme ihe ugbu a.
- source_word: μισθώσασθαι ἐργάτας
  choice: iku ndị ọrụ ka ha rụọ ọrụ
  rationale: Nke a na-egosi ebumnuche ịkpọ ndị ọrụ n’ọrụ n’ụzọ doro onye Igbo anya; echiche ụgwọ ọrụ dịkwa n’usoro akụkọ na-esochi.
- source_word: ἀμπελῶνα
  choice: ubi vaịn
  rationale: Ọ bụ aha kpọmkwem maka ubi a na-akụ mkpụrụ vaịn, ma zere ime ka ọ bụrụ naanị ‘ubi’ n’ozuzu.
theological_decisions:
- issue: Ihe a na-atụnyere alaeze eluigwe na ya
  choice: alaeze eluigwe dị ka otu nwoke, bụ́ onye nwe ụlọ
  alternative: alaeze eluigwe dị ka ihe onye nwe ụlọ mere
  rationale: E debere nhazi na ntakịrị esemokwu dị n’okwu Grik, nke na-ekwu na alaeze ahụ ‘dị ka nwoke, onye nwe ụlọ,’ kama ịkọwa ozugbo na ọ bụ naanị omume ya ka a na-atụnyere.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘bụ́’ mee apposition n’etiti ‘otu nwoke’ na ‘onye nwe ụlọ’; enweghị akara nkọwa ala peeji n’ihi na amaokwu a achọghị nke ọ bụla.
