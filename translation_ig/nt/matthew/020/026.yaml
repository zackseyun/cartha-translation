  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: ig
  text: Ọ gaghị adị ụzọ dị otú a n’etiti unu.[a] Kama, onye ọ bụla chọrọ ịghọ onye ukwu n’etiti unu ga-abụ onye na-ejere unu ozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ bụghị ụzọ dị otú a n’etiti unu.” N’asụsụ Grik, ngwaa ahụ dị n’ọdịnihu (“ọ gaghị adị”); nke a pụrụ igosi otú ihe na-ekwesịghị ịdị n’etiti ndị na-eso ụzọ Jizọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: Ọ gaghị adị otu a n’etiti unu
  rationale: E jigidere ngwaa ọdịnihu ἔσται site n'iji “gaghị adị,” ka okwu ahụ nọgide na-egosi ụkpụrụ Jizọs nyere banyere otú ihe na-agaghị adị n'etiti ndị na-eso ụzọ ya. “N’etiti unu” na-egosipụta ἐν ὑμῖν n'ọnọdụ mmekọrịta mmadụ.
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: Kama, onye ọ bụla chọrọ
  rationale: “Onye ọ bụla” na-egosipụta ọnọdụ izugbe nke ὃς ἂν tinyere subjunctive, ebe “chọrọ” na-egosipụta uche dị na θέλῃ n'Igbo doro anya.
- source_word: μέγας γενέσθαι
  choice: ịghọ onye ukwu
  rationale: “Ịghọ” na-echekwa echiche mgbanwe dị na γενέσθαι, kama ịsụgharị ya naanị dị ka ịnọ n'ọnọdụ ịdị ukwuu.
- source_word: διάκονος
  choice: onye na-ejere unu ozi
  rationale: N'ebe a διάκονος bụ onye na-eje ozi, ọ bụghị aha ọkwa ụka e mechara guzobe. Nkebiokwu a bụ Igbo ebumpụta ụwa ma na-echekwa ihe omume nke ijere ndị ọzọ ozi.
- source_word: ὑμῶν
  choice: unu
  rationale: E tinyere genitive ahụ n'ime nkebiokwu Igbo “na-ejere unu ozi,” nke na-egosipụta mmekọrịta ahụ nke ọma karịa nsụgharị mkpụrụokwu n'usoro Grik.
theological_decisions:
- issue: Ụdị ịdị ukwuu n’etiti ndị na-eso ụzọ Jizọs
  choice: 'E gosipụtara okwu ahụ dị ka ntụgharị nke usoro ọchịchị ụwa: onye chọrọ ịdị ukwuu ga-ejere ndị ọzọ ozi.'
  alternative: Ịghọta διάκονος dị ka ọkwa ụka nke “dikin,” ma ọ bụ iwepụ okwu ije ozi were naanị echiche ịdị umeala n’obi dochie ya.
  rationale: Ọnọdụ okwu ahụ na-atụnyere ụzọ ndị mba ọzọ si achị na ụkpụrụ Jizọs nyere ndị na-eso ụzọ ya. Nsụgharị ahụ na-echekwa okwu ije ozi n'enweghị ibubata usoro ọchịchị ụka nke oge e mesịrị.
translation_notes:
  register: Igbo Izugbe nke oge a, doro anya ma dị ugwu. E ji “onye na-ejere unu ozi” zere okwu nwere ike ịdị ka aha ọkwa ụka, ma mee ka echiche ije ozi doo onye nkịtị anya.
