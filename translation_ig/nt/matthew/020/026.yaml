review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the Greek future ἔσται with “ga-adị,” preserves the contrast introduced by ἀλλά, the indefinite scope of ὃς ἂν, the ingressive sense of γενέσθαι (“ịghọ”), and διάκονος as one who serves rather than an ecclesial office.
  naturalness: The wording is otherwise clear Standard Igbo. Replacing “otu a” with “ụzọ dị otú a” makes the idiom unambiguously mean “in this way,” rather than potentially suggesting “one/same.” The same adjustment is needed in the footnote’s present-tense alternative.
  terminology: “Onye ukwu” appropriately conveys greatness/status in context, and “onye na-ejere unu ozi” naturally conveys διάκονος without importing the later church-office sense of “dikọn.”
  issues:
  - severity: low
    issue: “otu a” is less idiomatic and can be semantically less specific here.
    rationale: The Greek οὕτως means “thus/in this way.” “ụzọ dị otú a” is natural Standard Igbo and clearly preserves that manner sense. The footnote alternative should use the same idiom.
