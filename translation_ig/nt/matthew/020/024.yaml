  yaml_path: translation/nt/matthew/020/024.yaml
  text: And when the ten heard it, they became indignant about the two brothers.
translation:
  language: ig
  text: Mgbe mmadụ iri ahụ nụrụ nke a, iwe were ha banyere ụmụnne abụọ ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δέκα
  choice: mmadụ iri ndị ọzọ
  rationale: Ihe a na-ekwu bụ ndị na-eso ụzọ iri fọdụrụ; ‘ndị ọzọ’ na-eme ka nke a doo anya n’Igbo n’enweghị ịgbakwunye aha ha.
- source_word: ἠγανάκτησαν
  choice: iwe were ha
  rationale: Nke a bụ ụzọ Igbo nkịtị, dị ùgwù, si egosi iwe siri ike ma ọ bụ iwe n’obi.
- source_word: περὶ τῶν δύο ἀδελφῶν
  choice: n’ihi ụmụnne abụọ ahụ
  rationale: περί na genitive ebe a na-egosi ihe ma ọ bụ ndị kpatara iwe; ‘n’ihi’ na-ebuga echiche ahụ n’Igbo nke ọma n’ebughị ụzọ kpebie na iwe ahụ bụ naanị mwakpo kpọmkwem megide ha.
