id: MAT.20.2
reference: Matthew 20:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: ig
  text: Mgbe ya na ndị ọrụ ahụ kwekọrịtara na ọ ga-akwụ ha otu denarius maka ụbọchị ahụ[a], o zipụrụ ha n’ubi vaịn ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Otu denarius bụ ụgwọ a na-akwụkarị onye ọrụ maka ọrụ otu ụbọchị.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: Mgbe ya na ndị ọrụ ahụ kwekọrịtara
  rationale: Aorist participle ahụ na-egosi ihe mere tupu ngwaa bụ isi; ‘Mgbe ... kwekọrịtara’ na-enye Igbo dị mfe ma doo anya na e buru ụzọ ruo nkwekọrịta.
- source_word: δὲ
  choice: —
  rationale: N’ebe a, δέ bụ njikọ akụkọ dị nro; usoro ‘Mgbe...’ ejikọtala ahịrịokwu ahụ nke ọma n’Igbo, ya mere ọ dịghị mkpa ịsụgharị ya iche.
- source_word: ἐργατῶν
  choice: ndị ọrụ
  rationale: Nke a bụ okwu Igbo a na-aghọta ngwa ngwa maka ndị e goro ịrụ ọrụ, ma dabara n’ọnọdụ ubi vaịn.
- source_word: ἐκ δηναρίου
  choice: ọ ga-akwụ ha otu denarius
  rationale: Akpaalaokwu Grik ahụ na-egosi ụgwọ a kwekọrịtara. Ịkpọpụta ‘akwụ’ na-eme ka mmekọrịta ụgwọ ahụ doo anya n’Igbo, ebe a ka debere aha mkpụrụ ego oge ochie ahụ.
- source_word: τὴν ἡμέραν
  choice: maka ụbọchị ahụ
  rationale: Nke a na-egosi oge ọrụ nke ụgwọ ahụ metụtara, n’enweghị ịgbakwunye na ọ bụ ụbọchị zuru ezu karịa ihe Grik kwuru.
- source_word: ἀπέστειλεν
  choice: o zipụrụ ha
  rationale: Nke a bụ nsụgharị akụkọ nkịtị na nke ziri ezi nke ngwaa ahụ.
- source_word: ἀμπελῶνα
  choice: ubi vaịn
  rationale: ‘Ubi vaịn’ bụ ụzọ doro anya na nke e ji eme ihe n’Igbo maka vineyard.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnochiaha nwe a na-ezo aka n’ubi vaịn nke onye nwe ala ahụ.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ‘denarius’ dị ka aha mkpụrụ ego oge ochie, tinyekwa nkọwa omenala n’ala peeji.
