  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: ig
  text: Ọ̀ bụghị ihe m nwere ikike ime, iji ihe bụ nke m mee ihe m chọrọ? Ka anya gị ọ̀ dị njọ n’ihi na m dị mma?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Ị na-enwe anyaụfụ n’ihi na m dị mma?” Okwu ahụ bụ́ “anya gị dị njọ” bụ akpaalaokwu Grik na-egosi anyaụfụ ma ọ bụ iwe n’obi n’ihi ịdị mma ma ọ bụ emesapụ aka onye ọzọ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: iwu ekweghị m
  rationale: N’usoro ajụjụ na-agọnahụ, okwu a na-egosi ihe iwu kwadoro ma ọ bụ ihe mmadụ nwere ikike ime; ntụgharị a na-edobe echiche banyere izi ezi n’iwu.
- source_word: ὃ θέλω ποιῆσαι
  choice: mee ihe m chọrọ
  rationale: Nke a na-egosipụta ọchịchọ nke onye nwe ubi n’ụzọ Igbo nke oge a na-aghọta nke ọma.
- source_word: ἐν τοῖς ἐμοῖς
  choice: jiri ihe bụ nke m
  rationale: Ọ na-egosi ihe onwunwe nke onye na-ekwu okwu, ma dabara n’ọnọdụ akụ na ụba dị n’ilu ahụ.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: anya gị ọ̀ dị njọ
  rationale: A hapụrụ ihe atụ nke okwu Grik ahụ n’ahịrịokwu bụ isi, ebe nkọwa ala peeji na-egosi na ọ na-ezo aka n’anyaụfụ ma ọ bụ iwe n’ihi ihe ọma e meere onye ọzọ.
- source_word: ἀγαθός
  choice: dị mma
  rationale: Nke a na-edobe isi okwu ahụ bụ ‘mma’ na ọdịiche ya na ‘anya dị njọ,’ kama ịkọwa ya ozugbo dị ka ‘onye na-emesapụ aka.’
theological_decisions:
- issue: Ma a ga-akọwa akpaalaokwu ὁ ὀφθαλμός σου πονηρός ozugbo n’ahịrịokwu bụ isi
  choice: E debere ihe atụ ahụ dịka “anya gị ọ̀ dị njọ” n’ahịrịokwu bụ isi.
  alternative: “Ị na-enwere m anyaụfụ n’ihi na m dị mma?”
  rationale: Nke a na-echekwa ọdịiche dị n’etiti ‘anya dị njọ’ nke onye ọrụ na ịdị mma nke onye nwe ubi, n’enweghị ịmanye naanị otu nkọwa; nkọwa ala peeji na-eme ka akpaalaokwu ahụ doo anya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. A hapụrụ akpaalaokwu nke isi mmalite n’ahịrịokwu bụ isi, ma kọwaa ya n’ala peeji.
