revisions:
- from: Ọ̀ bụ na iwu ekweghị m ka m jiri ihe bụ nke m mee ihe m chọrọ? Ka anya gị ọ̀ dị njọ n’ihi na m dị mma?[a]
  to: Ọ̀ bụghị ihe m nwere ikike ime, iji ihe bụ nke m mee ihe m chọrọ? Ka anya gị ọ̀ dị njọ n’ihi na m dị mma?[a]
  rationale: The revision idiomatically expresses the Greek question of permitted or rightful action with one’s own possessions. It retains the source’s literal ‘evil eye’ metaphor in the main text and corrects the footnote’s explanatory alternative so that it reflects envy arising from the owner’s goodness, not envy directed at him merely as an object.
  reviewer_model: gpt-5.6-terra
