translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma dị ugwu. E debere “elekere nke atọ” maka ịkwụsi ike nʼisi mmalite, tinyekwa nkọwa omenala nʼala peeji. “Nʼenweghị ọrụ” na-ewepụ echiche na-enweghị isi na ha bụ ndị umengwụ.
