  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: ig
  text: Mgbe o pụtasịrị n’ihe dị ka elekere nke atọ[a], ọ hụrụ ndị ọzọ ka ha guzo n’ahịa, na-adịghị arụ ọrụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe dị ka elekere itoolu nke ụtụtụ.” “Elekere nke atọ” sitere n’usoro ndị Juu si agụ oge ehihie malite mgbe anyanwụ wara.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “ndị na-enweghị ọrụ.” Okwu Grik ahụ pụtara na ha anaghị arụ ọrụ n’oge ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Mgbe ọ pụkwara
  rationale: Aorist participle a na-egosi ihe mere tupu ihe so ya; nkebiokwu a bụ Igbo eke nke na-echekwa usoro omume ahụ.
- source_word: περὶ τρίτην ὥραν
  choice: ihe dị ka nʼelekere nke atọ
  rationale: E debere usoro ndị Juu si agụ oge ehihie ka ntụgharị ahụ wee nọgide nso nʼisi mmalite; nkọwa oge nke oge a dị nʼala peeji.
- source_word: εἶδεν
  choice: ọ hụrụ
  rationale: Nke a bụ ntụgharị dị mfe ma kwụ ọtọ nke ὁράω nʼakụkọ.
- source_word: ἄλλους
  choice: ndị ọzọ
  rationale: Okwu ahụ na-arụ ọrụ dị ka aha, ma Igbo a anaghị etinye nwoke ma ọ bụ ndị ikom ebe Grik ekwughị ya.
- source_word: ἑστῶτας
  choice: ka ha guzo
  rationale: Nke a na-egosi ọnọdụ ha nọ na ya nʼụzọ Igbo na-ada nke ọma.
- source_word: ἀγορᾷ
  choice: nʼahịa
  rationale: ἀγορά bụ ebe ọha na-azụ ahịa, bụkwa ebe ndị ọrụ nwere ike ịgbakọta ịchọ ọrụ; “ahịa” bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị eme ihe.
- source_word: ἀργούς
  choice: nʼenweghị ọrụ
  rationale: Nʼọnọdụ a, ἀργούς pụtara na ha anaghị arụ ọrụ. Nhọrọ a na-ezere echiche na ha bụ ndị umengwụ ma na-echekwa nkọwa na ha enweghị ọrụ nʼoge ahụ.
