revisions:
- from: Mgbe ọ pụkwara ihe dị ka nʼelekere nke atọ[a], ọ hụrụ ndị ọzọ ka ha guzo nʼahịa nʼenweghị ọrụ[b].
  to: Mgbe o pụtasịrị n’ihe dị ka elekere nke atọ[a], ọ hụrụ ndị ọzọ ka ha guzo n’ahịa, na-adịghị arụ ọrụ[b].
  rationale: The revision corrects the sequential participial clause, improves idiomatic Standard Igbo, and makes the lexical note for ἀργούς accurate in context. It retains the source’s third-hour expression and does not add an interpretation beyond the historical and narrative context.
