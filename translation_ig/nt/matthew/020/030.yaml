id: MAT.20.30
reference: Matthew 20:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: ig
  text: Ma lee, ndị ikom abụọ kpuru ìsì nọ ọdụ n'akụkụ ụzọ. Mgbe ha nụrụ na Jizọs na-agafe, ha tiri mkpu sị, “Onyenwe anyị, meere anyị ebere, Nwa Devid!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lee
  rationale: Ọ na-echekwa ọrụ okwu Grik a nke ịdọrọ uche onye na-agụ ya gaa n’ihe na-eme, ma bụrụkwa okwu Igbo doro anya ma dị ndụ.
- source_word: δύο τυφλοὶ
  choice: ndị ikom abụọ kpuru ìsì
  rationale: Ọ na-egosi ma ọnụ ọgụgụ ha ma na okwu a na-ekwu banyere ụmụ nwoke abụọ kpọmkwem.
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: nọ ọdụ n'akụkụ ụzọ
  rationale: Nke a bụ ụzọ Igbo e si akọ ọnọdụ ahụ n'ụzọ nkịtị ma doo anya.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: Mgbe ha nụrụ na Jizọs na-agafe
  rationale: “Mgbe” na-egosipụta njikọ oge dị na participle ahụ, ebe “na-agafe” na-enye παράγει n'ụzọ Igbo na-aga were were.
- source_word: ἔκραξαν λέγοντες
  choice: ha tiri mkpu sị
  rationale: Ọ na-echekwa ike dị na κράζω, ma na-ezere ntụgharị siri ike nke λέγοντες.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ aha nkwanye ugwu a na-ejikarị asụgharị κύριος mgbe a na-akpọ Jizọs, ma ọ kwekọrọ n’ịkpọ ya “Nwa Devid” n’ebe a.
- source_word: ἐλέησον ἡμᾶς
  choice: meere anyị ebere
  rationale: Nke a bụ arịrịọ Igbo ebumpụta ụwa nke na-egosipụta ịrịọ maka ọmịiko na enyemaka.
- source_word: υἱὸς Δαυίδ
  choice: Nwa Devid
  rationale: Ọ na-echekwa aha Mesaya ahụ na njikọ ya na Devid kama ime ya naanị nkọwa agbụrụ.
theological_decisions:
- issue: Ihe κύριος pụtara mgbe ndị ikom ahụ kpọrọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu; Nnukwu onye
  rationale: N’ihi na okwu ahụ jikọtara ya na “Nwa Devid,” “Onyenwe anyị” na-echekwa nkwanye ugwu na ụda Mesaya dị n’okwu ahụ, ma ọ dịghị ekpebi karịa ihe Grik kwuru kpọmkwem.
- issue: Ike Mesaya dị na υἱὸς Δαυίδ
  choice: Nwa Devid
  alternative: Nwa sitere n’agbụrụ Devid
  rationale: “Nwa Devid” na-edobe ya dịka aha a maara nke ọma, gụnyere njikọ eze na Mesaya; ntụgharị ọzọ nwere ike ime ka ọ bụrụ naanị okwu banyere usoro ọmụmụ.
translation_notes:
  register: 'E ji Standard Igbo nke oge a, nke dị mfe nghọta ma nwee nsọpụrụ, dee ya. A hapụrụ usoro arịrịọ ahụ nso na Grik: “Onyenwe anyị, meere anyị ebere, Nwa Devid!”'
