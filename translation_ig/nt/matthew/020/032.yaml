  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: ig
  text: Jizọs kwụsịrị, kpọrọ ha, sị, “Gịnị ka unu chọrọ ka m meere unu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: kwụsịrị
  rationale: Aorist participle ahụ na-egosi na Jizọs kwụsịrị ije ya tupu ọ kpọọ ha; ‘kwụsịrị’ bụ okwu Igbo doro anya ma kwekọọ n’usoro akụkọ ahụ.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: Aha nke onye ahụ n'ụdị a na-ejikarị ede ya n'Igbo Izugbe.
- source_word: ἐφώνησεν
  choice: kpọọ
  rationale: N'ebe a φωνέω pụtara ịkpọ ndị ahụ ka ha bịakwute ya ma ọ bụ ka o gwa ha okwu; ‘kpọọ ha’ na-enye echiche ahụ n'ụzọ dị nkenke ma bụrụkwa Igbo nkịtị.
- source_word: αὐτοὺς
  choice: ha
  rationale: Nnọchiaha ụbara a na-ezo aka n'ndị ikom abụọ kpuru ìsì a kpọtụrụ aha n'akụkụ okwu a.
- source_word: Τί
  choice: Gịnị
  rationale: Nnọchiaha ajụjụ a na-ebido ajụjụ kpọmkwem; ‘Gịnị’ bụ ntụgharị Igbo sitere n'okike.
- source_word: θέλετε
  choice: unu chọrọ
  rationale: θέλω na-egosi ihe mmadụ chọrọ ma ọ bụ na-achọ ka e mee; ‘unu chọrọ’ doro anya ma na-edobe ụdị ajụjụ kpọmkwem ahụ.
- source_word: ποιήσω
  choice: ka m meere
  rationale: Aorist subjunctive ahụ na-esochi θέλετε ma na-egosi ihe ha chọrọ ka Jizọs mee; usoro ‘ka m meere’ bụ Igbo sitere n'okike ma tinye uru omume ahụ ga-abara ha.
- source_word: ὑμῖν
  choice: unu
  rationale: 'Dative a bụ nke uru: ihe a ga-eme ga-abara ha uru. Ngwaa ‘meere unu’ na-egosipụta nke a n''Igbo n''enweghị mgbakwunye na-adịghị mkpa.'
theological_decisions:
- issue: Ụda na ike ajụjụ Jizọs
  choice: 'Ajụjụ kpọmkwem nke na-akpọ ha ka ha kwuo mkpa ha: “Gịnị ka unu chọrọ ka m meere unu?”'
  alternative: “Gịnị ka unu na-achọ ka m mee maka unu?”
  rationale: Ederede Grik ahụ na-egosi na Jizọs ji aka ya jụọ ha ihe ha chọrọ, ma ọ naghị akọwa ebumnuche ya karịa nke ahụ. Nhọrọ a na-edobe ịdị mfe, ọmịiko, na ịdị kpọmkwem nke ajụjụ ahụ n'enweghị itinye nkọwa ozizi.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji usoro ngwaa ndị so n'usoro—‘kwụsịrị, kpọọ ha, sị’—mee ka akụkọ ahụ na-aga were were. Enweghị ihe odide ala peeji dị mkpa, n'ihi na ntụgharị bụ isi na-edobe ma ihe στὰς pụtara n'akụkọ a ma ajụjụ θέλετε ποιήσω ὑμῖν n'ụzọ doro anya.
