revisions:
- from: Mgbe Jizọs na-arịgo Jeruselem, ọ kpọọrọ ndị na-eso ụzọ ya iri na abụọ gaa n'akụkụ naanị ha; ka ha nọ n'ụzọ, ọ sịrị ha,
  to: Mgbe Jizọs na-arịgo Jeruselem, ọ kpọpụrụ ndị na-eso ụzọ iri na abụọ ahụ iche, ma n’ụzọ ọ sịrị ha,
  rationale: The revision replaces an unclear private-setting expression with idiomatic “kpọpụrụ ... iche,” represents the definite group as “iri na abụọ ahụ,” and avoids adding an unexpressed possessive. The trailing comma is retained because Jesus’ speech continues in the next verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:01Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the journey, the Twelve, the private setting, and Jesus' speech. However, “n'akụkụ naanị ha” is not a clear or idiomatic rendering of κατ’ ἰδίαν (‘apart/private’), and the possessive “ya” is not expressed in the Greek.
  naturalness: “Ọ kpọpụrụ ... iche” is a more natural Standard Igbo way to say that Jesus took the group apart from others. “N’ụzọ” naturally retains the travel-setting phrase without adding unnecessary detail.
  terminology: “Ndị na-eso ụzọ” is suitable for μαθητάς. “Jizọs” and “Jeruselem” are retained as established Igbo biblical forms. The explicit Greek designation ‘the twelve’ is represented by “iri na abụọ ahụ.”
  issues:
  - severity: medium
    issue: The phrase “gaa n'akụkụ naanị ha” is awkward and imprecise.
    rationale: It can sound merely spatial (‘go to a side’) rather than conveying the intended separation from others for a private communication expressed by κατ’ ἰδίαν.
  - severity: low
    issue: The draft adds the possessive “ya” (‘his’) to ‘disciples.’
    rationale: The referent is readily understood, but τοὺς δώδεκα μαθητὰς does not contain a possessive. Omitting it more closely reflects the source.
  revised_text: Mgbe Jizọs na-arịgo Jeruselem, ọ kpọpụrụ ndị na-eso ụzọ iri na abụọ ahụ iche, ma n’ụzọ ọ sịrị ha,
  revised_footnotes: []
