  text: ⸂Καὶ ἀναβαίνων ὁ⸃ Ἰησοῦς εἰς Ἱεροσόλυμα παρέλαβεν τοὺς δώδεκα ⸀μαθητὰς κατ’ ἰδίαν, ⸂καὶ ἐν τῇ ὁδῷ⸃ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: ig
  text: Mgbe Jizọs na-arịgo Jeruselem, ọ kpọpụrụ ndị na-eso ụzọ iri na abụọ ahụ iche, ma n’ụzọ ọ sịrị ha,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: na-arịgo
  rationale: Ọ bụ participle dị ugbu a nke na-egosi ihe na-aga n’ihu n’otu oge ahụ; “na-arịgo” na-echekwa echiche ịrịgo Jeruselem ma bụrụkwa Igbo nkịtị.
- source_word: εἰς Ἱεροσόλυμα
  choice: Jeruselem
  rationale: N'ọnọdụ a, εἰς na-egosi ebe a na-aga; n'Igbo, ngwaa “ịrịgo” nwere ike iburu echiche ahụ n'enweghị itinye “na” ọzọ.
- source_word: παρέλαβεν
  choice: ọ kpọọrọ ... gaa
  rationale: “Kpọọrọ ... gaa” na-egosi na Jizọs weere ha soro ya ma kewapụ ha maka mkparịta ụka.
- source_word: τοὺς δώδεκα μαθητὰς
  choice: ndị na-eso ụzọ ya iri na abụọ
  rationale: A gụnyere μαθητάς n'ụzọ doro anya; “ndị na-eso ụzọ” bụ okwu Igbo a na-aghọta nke ọma maka ndị na-amụ ihe n'aka onye nkuzi ma na-eso ya.
- source_word: κατ’ ἰδίαν
  choice: n'akụkụ naanị ha
  rationale: Nkebiokwu a na-echekwa ma echiche ikewapụ ha n'ebe ndị ọzọ nọ ma nzuzo nke mkparịta ụka ahụ.
- source_word: ἐν τῇ ὁδῷ
  choice: ka ha nọ n'ụzọ
  rationale: Nke a bụ ụzọ Igbo dị mma isi gosipụta na okwu ahụ mere mgbe ha ka na-eme njem.
- source_word: εἶπεν αὐτοῖς
  choice: ọ sịrị ha
  rationale: Nke a bụ nsụgharị kpọmkwem ma dịkwa n'okike nke ngwaa ikwu okwu; ọ na-ahapụ ọdịnaya okwu ahụ nye amaokwu na-esote.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ahịrịokwu ahụ ka ọ kwụsị na kọma n'ihi na okwu Jizọs na-aga n'ihu n'amaokwu na-esote.
