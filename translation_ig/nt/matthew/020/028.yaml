  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: ig
  text: Dị nnọọ ka Nwa nke Mmadụ abịaghị ka e jeere ya ozi, kama ka o jee ozi ma nye ndụ ya dịka ụgwọ mgbapụta maka ọtụtụ mmadụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya n’ụzọ doro anya karị, “dịka ụgwọ mgbapụta n’ọnọdụ ọtụtụ ndị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ
  choice: Dị nnọọ ka
  rationale: Na-egosi ntụnyere ya na nkuzi bu ụzọ, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Ọ bụ nsụgharị a maara nke ọma maka aha Jizọs ji akpọ onwe ya, ma na-echekwa njikọ ya na ihe odide Akwụkwọ Nsọ ndị ọzọ.
- source_word: οὐκ ἦλθεν
  choice: abịaghị
  rationale: Na-egosipụta aorist ahụ dịka ihe mere n’oge gara aga, n’etinyeghị ebe ma ọ bụ nkọwa ọzọ na-adịghị na Grik.
- source_word: διακονηθῆναι
  choice: ka e jeere ya ozi
  rationale: Na-echekwa olu nnara nke ngwaa ahụ ma jiri okwu Igbo doro anya nke na-abụghị naanị okwu ụka.
- source_word: ἀλλὰ διακονῆσαι
  choice: kama ọ bịara ije ozi
  rationale: Na-eme ka ọdịiche dị n’etiti ịbụ onye a na-ejere ozi na ịbụ onye na-eje ozi pụta ìhè n’Igbo nkịtị.
- source_word: καὶ δοῦναι
  choice: na inye
  rationale: Na-ejikọta omume a na ije ozi dịka infinitive Grik si eme, n’enweghị itinye echiche ọzọ.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ndụ ya
  rationale: N’ebe a ψυχή pụtara ndụ mmadụ nke a na-enye ruo n’ọnwụ, ọ bụghị naanị mkpụrụ obi na-adịghị ahụ anya.
- source_word: λύτρον
  choice: ụgwọ mgbapụta
  rationale: Na-egosi ụgwọ a na-akwụ iji tọhapụ mmadụ, ma bụrụ okwu doro anya ma kwanyere ugwu.
- source_word: ἀντὶ πολλῶν
  choice: maka ọtụtụ mmadụ
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụ ihe a na-aghọta nke ọma; a na-echekwa nkọwa nnọchi anya nke ἀντί n’okpuru peeji.
theological_decisions:
- issue: Ike na nkọwa nke ἀντί n’okwu banyere ụgwọ mgbapụta
  choice: maka ọtụtụ mmadụ
  alternative: n’ọnọdụ ọtụtụ mmadụ
  rationale: Isi ederede na-eji okwu Igbo dị mfe, ma nkọwa ala peeji na-echekwa echiche mgbanwe ma ọ bụ ịnọchite anya nke preposishọn Grik ahụ nwere ike igosi, n’enweghị imechi esemokwu nkọwa okpukpe dị na ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma kwanyere ugwu. E ji “Nwa nke Mmadụ” chekwaa aha a maara nke ọma na njikọ Akwụkwọ Nsọ ya; e zere okwu ụka siri ike ebe okwu Igbo nkịtị zuru oke.
