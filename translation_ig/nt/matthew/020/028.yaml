    text: A pụkwara ịsụ ya n’ụzọ doro anya karị, “dịka ụgwọ mgbapụta n’ọnọdụ ọtụtụ ndị.”
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported second occurrence of ‘came’ and makes both ‘serve’ and ‘give his life’ dependent on the one purpose contrast introduced by ‘abịaghị … kama ka.’ It preserves the draft’s clear main-text rendering of ἀντί as “maka,” while retaining its more explicit substitutional force in the footnote.
