  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Κύριε, ἵνα ⸂ἀνοιγῶσιν οἱ ὀφθαλμοὶ ἡμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: ig
  text: Ha sịrị ya, “Onyenwe anyị, ka e meghee anya anyị.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: Ha sịrị
  rationale: Ọ bụ ngwaa dị n'oge ugbu a e ji akọ akụkọ; Igbo nkịtị na-eji oge gara aga ebe a mee ka akụkọ daa nke ọma.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha dative a na-egosi onye a gwara okwu; ‘ya’ bụ ntụgharị Igbo kwesịrị ekwesị.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ okwu a kpọrọ onye ihu na ihu; ‘Onyenwe anyị’ na-echekwa nsọpụrụ na ikike okwu κύριος nwere mgbe a na-agwa Jizọs okwu.
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ na-ebute ihe ha na-arịọ n’ụzọ Igbo sitere n’okike ma na-echekwa echiche subjunctive ahụ.
- source_word: ἀνοιγῶσιν
  choice: e meghee
  rationale: Ụdị passive subjunctive ahụ gosiri na anya bụ ihe a ga-emepe; ‘e meghee’ na-echekwa olu passive n’ụzọ Igbo nkịtị.
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: anya anyị
  rationale: Nke a bụ ntụgharị Igbo kpọmkwem na nke sitere n’okike maka ‘our eyes.’
theological_decisions:
- issue: Otú e si tụgharịa κύριος mgbe a na-agwa Jizọs okwu
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa ibu okwu ahụ na ntụaka nwere ike ịdị n’ịmata ikike Jizọs, ma ọ naghị amanye ihe karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: Asụsụ Igbo izugbe, dị ugbu a ma dị ùgwù. Ahịrịokwu ahụ dị mfe nghọta; e chekwara olu passive nke ἀνοιγῶσιν na arịrịọ nke ἵνα site n’okwu ‘ka e meghee.’
