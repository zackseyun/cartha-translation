review_pass:
  verdict: revise
  source_fidelity: The draft preserves the Greek future reversal and does not over-specify the referents of ‘last’ and ‘first.’ However, the second balanced clause must explicitly retain the future verb, as in the Greek.
  naturalness: ‘N’ihi ya’ is understandable, but ‘Ya mere’ is the more natural modern Standard Igbo equivalent here for the inferential οὕτως. The wording ‘ndị mbụ abụrụ ndị ikpeazụ’ is not a well-formed parallel future clause; ‘ga-abụkwa’ supplies the required future verb and natural coordinating force.
  terminology: ‘Ndị ikpeazụ’ and ‘ndị mbụ’ are appropriate, concise Standard Igbo renderings that preserve the source’s deliberately open reversal language. No theological narrowing is introduced.
  issues:
  - severity: medium
    issue: The second clause lacks an explicit future verb.
    rationale: Greek has ἔσονται governing both coordinated predicate statements. In Standard Igbo, ‘ndị mbụ abụrụ ndị ikpeazụ’ is not an adequate parallel future clause; it should be ‘ndị mbụ ga-abụkwa ndị ikpeazụ.’
  - severity: low
    issue: The opening connective can be made more idiomatic.
    rationale: ‘Ya mere’ naturally expresses the concluding/inferential force of οὕτως in this context, while retaining the concise register of the saying.
  - severity: low
    issue: The footnote alternative repeats the malformed second clause.
    rationale: Its second clause likewise needs an explicit future construction to be grammatical and to preserve the source parallelism.
  revised_text: Ya mere, ndị ikpeazụ ga-abụ ndị mbụ, ndị mbụ ga-abụkwa ndị ikpeazụ.[a]
