- from: N’ihi ya, ndị ikpeazụ ga-abụ ndị mbụ, ndị mbụ abụrụ ndị ikpeazụ.[a]
  to: Ya mere, ndị ikpeazụ ga-abụ ndị mbụ, ndị mbụ ga-abụkwa ndị ikpeazụ.[a]
  rationale: The revision preserves the Greek’s concise future reversal, its simple coordination, and its ambiguity concerning the nature of being ‘first’ or ‘last.’ It corrects the incomplete second clause and uses idiomatic Standard Igbo for the concluding connective. The alternative footnote now has matching future forms in both clauses.
