  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: ig
  text: Ya mere, ndị ikpeazụ ga-abụ ndị mbụ, ndị mbụ ga-abụkwa ndị ikpeazụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Otu a ka ndị ikpeazụ ga-esi bụrụ ndị mbụ, ndị mbụ ga-esikwa bụrụ ndị ikpeazụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: N’ihi ya
  rationale: Ọ na-ewebata nkwubi okwu sitere n’ilu ahụ; ọ na-egosipụta ike nke nsonaazụ ma ọ bụ ntụpụta dị n’okwu Grik n’Igbo nkịtị.
- source_word: ἔσονται
  choice: ga-abụ
  rationale: Nke a na-egosipụta oge ọdịnihu nke εἰμί n'ụzọ doro anya ma dị ire n’Igbo.
- source_word: οἱ ἔσχατοι
  choice: ndị ikpeazụ
  rationale: Adjective nwere article na-arụ ọrụ dị ka aha; ‘ndị ikpeazụ’ na-echekwa echiche nke ọnọdụ ma ọ bụ usoro n’akọwaghị ya dị ka enweghị uru.
- source_word: πρῶτοι
  choice: ndị mbụ
  rationale: Ọ na-echekwa okwu nkenke nke ntụgharị ọnọdụ ahụ ma na-adaba n’usoro asụsụ Igbo.
- source_word: καὶ
  choice: —
  rationale: E gosipụtara njikọ dị mfe site n’ịtụkwasị nkebiokwu abụọ ahụ n’usoro na kọma; itinye ‘ma’ nwere ike ime ka okwu ahụ yie ihe na-emegide onwe ya karịa ka καὶ si kwuo.
- source_word: οἱ πρῶτοι
  choice: ndị mbụ
  rationale: Ọ bụ adjective e ji mere aha, ya na ‘ndị ikpeazụ’ kwekọrọ n’usoro ahịrịokwu ahụ.
- source_word: ἔσχατοι
  choice: ndị ikpeazụ
  rationale: Ọ na-emecha usoro ntụgharị ahụ ma na-echekwa myirịta nke ‘mbụ/ikpeazụ.’
theological_decisions:
- issue: Ụdị ntụgharị ọnọdụ okwu a na-ekwu maka ya
  choice: A sụgharịrị ya dị ka okwu amamihe dị nkenke banyere ntụgharị nke ndị ikpeazụ na ndị mbụ, n’akọwaghị kpọmkwem ihe ọnọdụ ndị ahụ bụ.
  alternative: Ịkọwa ya kpọmkwem dị ka ntụgharị ọnọdụ ọha mmadụ, ụgwọ ọrụ ndị na-eso ụzọ, ma ọ bụ usoro nzọpụta.
  rationale: Okwu Grik ahụ anaghị ekpebi ma ‘ikpeazụ/mbụ’ ọ̀ bụ banyere oge, ọnọdụ mmadụ, ụgwọ ọrụ, ma ọ bụ nzọpụta; nsụgharị ahụ na-ahapụ nghọta ahụ oghe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A chekwara nhazi okwu abụọ na-emegiderịta onwe ha na nkenke nke okwu Grik ahụ.
