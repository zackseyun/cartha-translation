id: MAT.20.29
reference: Matthew 20:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: ig
  text: Mgbe ha na-esi na Jeriko pụọ[a], nnukwu ìgwè mmadụ sooro ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ha hapụrụ Jeriko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένων
  choice: Mgbe ha na-esi ... pụọ
  rationale: Nkebi a na-egosi ihe na-aga n’ihu n’otu oge ahụ; nsụgharị a na-edobe echiche nke participle dị na Greek ma na-ada nke ọma n’Igbo.
- source_word: ἀπὸ Ἰεριχὼ
  choice: na Jeriko
  rationale: Mgbe e jikọtara ya na ‘na-esi ... pụọ,’ ọ na-egosi ebe ha si pụọ n'ụzọ doro anya ma bụrụkwa usoro okwu Igbo nkịtị.
- source_word: ἠκολούθησεν
  choice: sooro
  rationale: Okwu a na-egosi iso mmadụ n’azụ ma ọ bụ iso ya gawa; ‘sooro’ bụ okwu Igbo doro anya kwesịrị ekwesị n’ebe a.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha otu onye dị na Greek na-ezo aka n’ebe Jizọs nọ; ‘ya’ na-edobe mgbanwe ahụ site na ‘ha’ gaa n’otu onye.
- source_word: ὄχλος πολύς
  choice: nnukwu ìgwè mmadụ
  rationale: Nke a na-egosi ìgwè mmadụ bara ụba n’ọnụ ọgụgụ; okwu a bụ nke oge a, doo anya, ma dị ùgwù.
theological_decisions:
- issue: Onye nnọchiaha otu onye αὐτῷ na-ezo aka na ya mgbe nkebi bu ya ụzọ kwuru maka ọtụtụ mmadụ
  choice: Ìgwè mmadụ ahụ sooro Jizọs (‘ya’).
  alternative: Ìgwè mmadụ ahụ sooro ndị otu ahụ (‘ha’).
  rationale: Greek gbanwere site n’ọtụtụ mmadụ n’okwu ‘mgbe ha na-apụ’ gaa n’otu onye n’okwu ‘sooro ya.’ Ihe gbara ya gburugburu na-egosi na Jizọs bụ onye a na-ekwu maka ya, ya mere nsụgharị ahụ edobere mgbanwe a kama ime ka ọ bụrụ ‘ha.’
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. E debere usoro oge nke participle Greek na mgbanwe nnọchiaha site na ‘ha’ gaa na ‘ya.’
