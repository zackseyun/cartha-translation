  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: ig
  text: Mgbe ahụ, nne ụmụ Zebedi, ya na ụmụ ya, bịakwutere ya, na-akpọ isiala n’ihu ya[a] ma na-arịọ ya ihe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “fee ya ofufe.” Ngwaa Grik a pụrụ ịpụta ịkpọ isiala n’ihi nsọpụrụ, ịsọpụrụ mmadụ nke ukwuu, ma ọ bụ ife ofufe, dabere n’ọnọdụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Mgbe ahụ
  rationale: Ọ bụ njikọ oge na-egosi ihe sochiri n’usoro akụkọ; ‘Mgbe ahụ’ bụ okwu Igbo doro anya ma kwekọọ na ya.
- source_word: προσῆλθεν αὐτῷ
  choice: bịakwutere ya
  rationale: ‘Bịakwutere ya’ na-egosi ịbịa nso n’ebe mmadụ nọ, dịka προσέρχομαι si pụta n’ebe a.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: nne ụmụ Zebedi
  rationale: Nke a na-egosipụta njikọ genitiv ahụ n’ụzọ dị nkenke ma bụrụkwa Igbo nkịtị, na-akọwa nwanyị ahụ site n’ụmụ Zebedi.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: ya na ụmụ ya
  rationale: μετά tinyere genitiv na-egosi iso mmadụ; ‘ya na ụmụ ya’ bụ usoro okwu Igbo ebumpụta ụwa.
- source_word: προσκυνοῦσα
  choice: kpọọ isiala n’ihu ya
  rationale: Nhọrọ a na-echekwa omume ahụ nke irube isi na nsọpụrụ n’etinyeghị n’amaokwu ahụ n’onwe ya mkpebi siri ike na ọ bụ ofufe; e debere ihe ọzọ okwu ahụ pụrụ ịpụta n’ala ala peeji.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: rịọkwa ya otu ihe
  rationale: αἰτέω bụ ịrịọ, τι bụ ihe a na-akọwaghị kpọmkwem, παρά tinyere genitiv na-egosikwa onye a na-arịọ; usoro a bụ Igbo dị mfe ma zie ezi.
theological_decisions:
- issue: Otú e si sụgharịa προσκυνοῦσα mgbe e mere ya n’ihu Jizọs
  choice: kpọọ isiala n’ihu ya
  alternative: fee ya ofufe; kpọọ ya isiala iji sọpụrụ ya
  rationale: προσκυνέω pụrụ ịpụta ịkpọ isiala n’ihi nsọpụrụ ma ọ bụ ife ofufe, dabere n’ọnọdụ. Isiokwu ahụ na-eji nkọwa omume sara mbara, ebe ihe odide ala ala peeji na-echekwa nghọta nke ofufe, ka a ghara idozi esemokwu nkà mmụta okpukpe ahụ n’enweghị ihe àmà zuru ezu.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Kpọọ isiala n’ihu ya’ na-eme ka omume ahụ doo anya ma na-echekwa obosara ihe okwu Grik ahụ pụrụ ịpụta; akara ala ala peeji [a] dị n’isiokwu ahụ.
