  rationale: The revision preserves the source’s participial structure by presenting the bowing and request as actions accompanying the approach. It also retains the Greek indefinite object with “ihe.” The wording for προσκυνέω and its footnote continue to preserve the contextual and theological ambiguity of the Greek.
