review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the evening setting, vineyard owner, steward, summons, payment of wages, and the order from last to first. However, «asị» is not a finite narrative form here; the Greek historical present λέγει is best represented naturally in Standard Igbo by «sịrị» in this past-time narrative. «Onye na-elekọta ihe ya» is overly broad for ἐπίτροπος, which denotes the owner's steward/overseer.
  naturalness: The sentence is generally clear, but «onye nwe ubi vaịn» is less idiomatic than «onye nwe ubi mkpụrụ vaịn», and «onye na-elekọta ihe ya» is vague. «Ndị ikpeazụ» and «ndị mbụ» are sufficient and more natural than locating them «n’ebe ... nọ».
  terminology: Render ἀμπελών explicitly as «ubi mkpụrụ vaịn». Render ἐπίτροπος as «onye nlekọta ya» (steward/overseer), preserving the delegated-management role without importing ecclesiastical terminology. «Ụgwọ ọrụ» appropriately renders μισθός.
  issues:
  - severity: medium
    issue: Finite verb «asị» after the past-time introductory clause
    rationale: «Asị» is an infinitival/dependent form and does not function naturally as the main finite verb in this narrative. «Sịrị» gives idiomatic Standard Igbo while retaining the narrative force of Greek λέγει.
  - severity: medium
    issue: «onye na-elekọta ihe ya» for ἐπίτροπος
    rationale: The expression can mean anyone who looks after his belongings and does not clearly identify the delegated steward/overseer. «onye nlekọta ya» is concise and contextually accurate.
  - severity: low
    issue: «ubi vaịn» for ἀμπελών
    rationale: «Ubi mkpụrụ vaịn» explicitly expresses a vineyard and is clearer Standard Igbo usage.
  revised_text: Mgbe chi jiri, onye nwe ubi mkpụrụ vaịn ahụ sịrị onye nlekọta ya, ‘Kpọọ ndị ọrụ ahụ, kwụọ ha ụgwọ ọrụ ha, malite n’ebe ndị ikpeazụ nọ ruo n’ebe ndị mbụ nọ.’
  revised_footnotes: []
  revision_rationale: 'The revision corrects the non-finite main verb, clarifies the steward''s role, and makes «vineyard» explicit. It retains the source''s sequence and scope: summon the workers, pay their wages, beginning with the last and continuing to the first. No footnote is required, since the wording does not introduce a textual or interpretive ambiguity needing explanation.'
