revisions:
- from: Mgbe chi jiri, onye nwe ubi vaịn ahụ asị onye na-elekọta ihe ya, ‘Kpọọ ndị ọrụ ahụ, kwụọ ha ụgwọ ọrụ ha, malite n’ebe ndị ikpeazụ nọ ruo n’ebe ndị mbụ nọ.’
  to: Mgbe chi jiri, onye nwe ubi mkpụrụ vaịn ahụ sịrị onye nlekọta ya, ‘Kpọọ ndị ọrụ ahụ, kwụọ ha ụgwọ ọrụ ha, malite n’ebe ndị ikpeazụ nọ ruo n’ebe ndị mbụ nọ.’
  rationale: 'The revision corrects the non-finite main verb, clarifies the steward''s role, and makes «vineyard» explicit. It retains the source''s sequence and scope: summon the workers, pay their wages, beginning with the last and continuing to the first. No footnote is required, since the wording does not introduce a textual or interpretive ambiguity needing explanation.'
