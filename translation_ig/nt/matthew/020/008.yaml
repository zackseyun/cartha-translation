id: MAT.20.8
reference: Matthew 20:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: ig
  text: Mgbe chi jiri, onye nwe ubi mkpụrụ vaịn ahụ sịrị onye nlekọta ya, ‘Kpọọ ndị ọrụ ahụ, kwụọ ha ụgwọ ọrụ ha, malite n’ebe ndị ikpeazụ nọ ruo n’ebe ndị mbụ nọ.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας
  choice: mgbe chi jiri
  rationale: Ọ bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo na oge mgbede eruola.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: onye nwe ubi vaịn ahụ
  rationale: Nke a na-egosi onye nwe ubi ahụ kpọmkwem, kama iji okwu nwere ike ime ka e chee na ọ bụ aha nsọ.
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: onye na-elekọta ihe ya
  rationale: Na-akọwa onye e nyere ọrụ ilekọta ihe onye nwe ubi ahụ, n’asụsụ ndị mmadụ na-aghọta ngwa ngwa.
- source_word: ἀπόδος αὐτοῖς τὸν μισθὸν
  choice: kwụọ ha ụgwọ ọrụ ha
  rationale: Na-egosipụta inye ndị ọrụ ụgwọ ruru ha n'ụzọ eke n’Igbo.
- source_word: ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: malite n’ebe ndị ikpeazụ nọ ruo n’ebe ndị mbụ nọ
  rationale: Na-echekwa usoro na ọdịiche dị n’etiti ndị ikpeazụ na ndị mbụ n’ederede Grik.
theological_decisions:
- issue: Oge ngwaa akụkọ ihe mere eme λέγει dị n’ụdị ugbu a
  choice: asị
  alternative: sịrị
  rationale: E chekwara ụdị ugbu a nke Grik, nke na-eme ka akụkọ ahụ dị ndụ, dị ka o si dịkwa na consultation layer.
translation_notes:
  register: Standard Igbo dị ugbu a, kwụ ọtọ ma dị ùgwù; ahịrịokwu ahụ kwesịrị ịdị mfe nghọta nye ndị na-agụ akwụkwọ n’ozuzu. Ejighị okwu ụka pụrụ iche ma ọ bụ nkọwa agbakwunyere.
