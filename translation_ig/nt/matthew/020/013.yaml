id: MAT.20.13
reference: Matthew 20:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: ig
  text: Ma ọ zara otu onye n’ime ha sị, “Enyi m, anaghị m emejọ gị.[a] Ọ̀ bụghị otu denarịọs[b] ka mụ na gị kwekọrịtara?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anaghị m emeso gị ihe n’ụzọ na-ezighị ezi.”
    reason: lexical_alternative
  - marker: b
    text: Denarịọs bụ mkpụrụ ego ọlaọcha ndị Rom; a na-ewerekarị ya dị ka ụgwọ ọrụ onye ọrụ maka otu ụbọchị.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: ọ zara ... sị
  rationale: Nke a na-egosipụta participle ahụ dị ka mmalite nzaghachi onye nwe ubi, n’ụzọ na-ada nke ọma n’Igbo.
- source_word: ἑνὶ αὐτῶν
  choice: otu onye n’ime ha
  rationale: 'Ọ na-echekwa dative singular na partitive genitive: ọ gwara otu onye si n’ìgwè ahụ.'
- source_word: Ἑταῖρε
  choice: Enyi m
  rationale: Ọ bụ okwu a na-akpọ mmadụ ihu na ihu; ‘Enyi m’ bụ Igbo nkịtị ma nwee ike ibu ụda dịtụ anya ma ọ bụ nke ịdọ aka ná ntị n’ọnọdụ a.
- source_word: οὐκ ἀδικῶ σε
  choice: anaghị m emejọ gị
  rationale: Ọ na-echekwa echiche nke ime mmadụ ihe na-ezighị ezi ma ọ bụ ikpe ya n’ụzọ na-adịghị mma, tinyere object ‘gị’ na present tense.
- source_word: οὐχὶ
  choice: Ọ̀ bụghị ... ka
  rationale: Ụdị ajụjụ a na-atụ anya azịza nkwenye, dịka Greek si mee.
- source_word: δηναρίου
  choice: otu denarịọs
  rationale: A hapụrụ aha ego akụkọ ihe mere eme ahụ kama ịgbanwe ya ka ọ bụrụ naanị ‘ụgwọ otu ụbọchị’ ma ọ bụ ‘mkpụrụ ego.’
- source_word: συνεφώνησάς μοι
  choice: mụ na gị kwekọrịtara
  rationale: Ọ na-egosi nkwekọrịta e mere tupu ọrụ ahụ amalite, n’ụzọ doro anya ma bụrụ Igbo eke.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro ajụjụ nkwenye na aha mkpụrụ ego oge Rom; e tinyere akara nkọwa ala peeji niile n’ederede isi.
