id: MAT.20.25
reference: Matthew 20:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: ig
  text: Ma Jizọs kpọrọ ha ka ha bịakwute ya, sị, “Unu maara na ndị ọchịchị nke ndị mba ọzọ[a] na-achị ha aka ike, ndị ukwu ha[b] na-ejikwa ikike achị ha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mba dị iche iche.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ndị isi ọchịchị ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: kpọrọ ha ka ha bịakwute ya
  rationale: Nke a na-egosi na Jizọs kpọrọ ndị na-eso ụzọ ya ka ha bịaruo ya nso tupu o kwuo okwu, ma na-ada ka Igbo nkịtị.
- source_word: Οἴδατε
  choice: Unu maara
  rationale: Ọ bụ ụzọ doro anya ma kwekọọ n'Igbo isi kwuo ngwaa a nke zuru oke n'ụdị ya ma nwee nghọta nke ugbu a.
- source_word: ἄρχοντες
  choice: ndị ọchịchị
  rationale: Okwu a na-ezo aka n'ebe ndị na-achị ma ọ bụ na-elekọta ọchịchị nọ; “ndị ọchịchị” sara mbara ma doo anya.
- source_word: τῶν ἐθνῶν
  choice: nke ndị mba ọzọ
  rationale: N'ọnọdụ ndị Juu nke okwu Jizọs a, nkebiokwu ahụ na-ezo aka n'ebe ndị na-abụghị ndị Juu nọ. Ihe odide ala peeji na-edebe nghọta ọzọ, “mba dị iche iche.”
- source_word: κατακυριεύουσιν
  choice: na-achị ha aka ike
  rationale: Nkebiokwu a na-ebute nghọta nke ọchịchị nchịgbu na nke ike karịrị naanị “ịchị”; “ịchị aka ike” na-egosipụta ụda nkatọ ahụ n'Igbo ebumpụta ụwa.
- source_word: οἱ μεγάλοι
  choice: ndị ukwu ha
  rationale: Nke a na-edebe ụdị aha e ji nkọwa “ndị ukwu” mee, ma na-egosi ndị a ma ama ma ọ bụ ndị nọ n'ọkwa ọchịchị dị elu n'etiti ha.
- source_word: κατεξουσιάζουσιν
  choice: na-ejikwa ikike achị ha
  rationale: Nke a na-egosi iji ikike na-achị ndị ọzọ, ma na-edebe ọdịiche dị n'etiti ngwaa a na κατακυριεύουσιν.
- source_word: αὐτῶν
  choice: ha
  rationale: Nnọchiaha a na-alaghachi n'ebe ndị mba ọzọ nọ; “ha” bụ ụzọ Igbo dị mfe ma kwekọọ n'usoro ahịrịokwu ahụ.
theological_decisions:
- issue: Nghọta nke ἐθνῶν n'okwu Jizọs kwuru n'ọnọdụ ndị Juu
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: “Ndị mba ọzọ” na-egosi nke ọma ndị na-abụghị ndị Juu n'ọnọdụ a, ebe ihe odide ala peeji na-edebe nghọta ndọrọ ndọrọ ọchịchị nke “mba dị iche iche.”
- issue: Nsụgharị οἱ μεγάλοι
  choice: ndị ukwu ha
  alternative: ndị isi ọchịchị ha
  rationale: “Ndị ukwu ha” na-edebe ịdị mkpirikpi na ọdịdị nke okwu Grik ahụ. Ebe Igbo anaghị egosi oke nwoke n'ụdị aha a, a gaghị etinye oke nwoke nke ga-eme ka nghọta ya dị warara karịa isi mmalite ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Ịchị aka ike” na-eburu ụda nkatọ nke ngwaa Grik mbụ, ebe “iji ikike achị” na-edebe myirịta na ọdịiche nke ngwaa nke abụọ. E debere akara ihe odide ala peeji n'akụkụ okwu ha na-akọwa.
