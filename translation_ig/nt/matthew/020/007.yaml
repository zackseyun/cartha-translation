base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: ig
  text: Ha sịrị ya[a], “N’ihi na ọ dịghị onye goro anyị ọrụ.” Ọ sịrị ha, “Unu kwa, gaanụ n’ubi vaịn ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, ngwaa abụọ a dị n’oge ugbu a e ji akọ akụkọ: “Ha na-ekwu” na “Ọ na-ekwu.” N’akụkọ Igbo, a pụkwara iji oge gara aga, dịka “Ha sịrị” na “Ọ sịrị,” sụgharịa ha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: Ha sịrị ya
  rationale: A sụgharịrị historical present Grik n’oge gara aga ka akụkọ ahụ na-aga nke ọma n’Igbo; ndetu [a] na-egosi ụdị okwu Grik ahụ.
- source_word: Ὅτι
  choice: Ọ bụ n’ihi na
  rationale: N’ebe a, ὅτι na-enye ihe kpatara ha ji ka na-eguzo ebe ahụ; okwu a na-egosipụta azịza kpatara ihe n’Igbo nke ọma.
- source_word: οὐδεὶς
  choice: ọ dịghị onye
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke a na-ejikarị asụ ‘no one’ n’Igbo.
- source_word: ἐμισθώσατο
  choice: goro anyị ọrụ
  rationale: Ngwaa ahụ pụtara iwere mmadụ n’ọrụ maka ụgwọ; ịgbakwunye ‘ọrụ’ na-eme ka ihe ọ pụtara doo anya n’Igbo.
- source_word: λέγει
  choice: Ọ sịrị ha
  rationale: Ọ bụ historical present ọzọ; e ji oge gara aga mee ya ka usoro akụkọ Igbo bụrụ nke ebumpụta ụwa, na-enweghị ịgbanwe ihe okwu ahụ pụtara.
- source_word: Ὑπάγετε
  choice: gakwaanụ
  rationale: Nke a na-enye iwu ka ha gaa, ebe mgbakwunye nkwanye ugwu/otutu ‘-nụ’ dabara ndị a na-agwa okwu.
- source_word: καὶ ὑμεῖς
  choice: Unu onwe unu
  rationale: 'Nke a na-echekwa nkwusi ike nke καὶ ὑμεῖς: a na-etinyekwa ìgwè a n’etiti ndị e zigara n’ubi.'
- source_word: ἀμπελῶνα
  choice: ubi vaịn
  rationale: Ọ bụ okwu Igbo a na-aghọta ngwa ngwa maka ubi a na-akụ mkpụrụ vaịn.
