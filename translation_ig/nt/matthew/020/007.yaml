  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E tinyere ‘ọrụ’ n’akụkụ ‘goro’ maka nghọta, ma debe nkwusi ike dị na καὶ ὑμεῖς site n’okwu ‘Unu onwe unu.’
