revisions:
- from: Ha sịrị ya[a], “Ọ bụ n’ihi na ọ dịghị onye goro anyị ọrụ.” Ọ sịrị ha, “Unu onwe unu gakwaanụ n’ubi vaịn ahụ.”
  to: Ha sịrị ya[a], “N’ihi na ọ dịghị onye goro anyị ọrụ.” Ọ sịrị ha, “Unu kwa, gaanụ n’ubi vaịn ahụ.”
  rationale: The revision preserves the Greek historical-present nuance in the footnote while using natural Igbo narrative past in the text. It replaces the reflexive-heavy “Unu onwe unu” with “Unu kwa,” which accurately represents the inclusive emphasis of καὶ ὑμεῖς without adding force absent from the source.
  reviewer_model: gpt-5.6-terra
