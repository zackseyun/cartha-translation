review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the workers’ explanation, the hiring-for-work sense of ἐμισθώσατο, and the instruction to go to the vineyard. However, “Unu onwe unu” overstates καὶ ὑμεῖς: the Greek marks addition/inclusion (“you also”), not reflexive emphasis (“you yourselves”).'
  naturalness: The narrative past forms “Ha sịrị” and “Ọ sịrị” are natural Standard Igbo. “Unu kwa, gaanụ” is a more idiomatic and precise way to express the inclusive imperative than “Unu onwe unu gakwaanụ.”
  terminology: “goro anyị ọrụ” accurately communicates being hired for work, and “ubi vaịn” is clear modern Standard Igbo for “vineyard.”
  issues:
  - severity: medium
    issue: “Unu onwe unu” renders καὶ ὑμεῖς too strongly.
    rationale: '“Onwe unu” normally adds reflexive/self-emphatic force. The Greek καὶ ὑμεῖς simply includes this group with those previously sent: “you also/you too.” Use “Unu kwa.”'
  - severity: low
    issue: The historical-present footnote’s illustrative Igbo wording is less natural than necessary.
    rationale: For the Greek present forms λέγουσιν and λέγει, “Ha na-ekwu” and “Ọ na-ekwu” are the straightforward Igbo present-form illustrations. The main text may naturally retain narrative past tense.
  revised_text: Ha sịrị ya[a], “N’ihi na ọ dịghị onye goro anyị ọrụ.” Ọ sịrị ha, “Unu kwa, gaanụ n’ubi vaịn ahụ.”
