  naturalness: “Ma Jizọs zara ha sị” na “Unu pụrụ ịṅụ” bụ Standard Igbo a pụrụ ịghọta ma dabara na ụda akụkọ Akwụkwọ Nsọ. “Pụrụ” na-enye register dị ùgwù ma na-edobe nkwughachi nke okwu ike/ikike dị n’azịza ha.
