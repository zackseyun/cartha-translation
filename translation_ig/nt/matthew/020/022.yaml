source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: ig
  text: Ma Jizọs zara ha sị, “Unu amaghị ihe unu na-arịọ. Unu pụrụ ịṅụ iko ahụ[a] m na-aga ịṅụ?” Ha sịrị ya, “Anyị pụrụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ nkọwa karịa: “iko ahụhụ ahụ m na-aga ịṅụ.” Grik na-edobe ihe atụ “iko,” nke bụ ihe atụ Akwụkwọ Nsọ a na-ahụkarị maka òkè e kenyere mmadụ, karịsịa ahụhụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Ma Jizọs zara ha sị
  rationale: “Ma” na-egosipụta ntụgharị dị nro nke δέ; “zara ha sị” bụ ụzọ Igbo si ekwu usoro Grik nke nwere ma participle ma finite verb n'ụzọ eke, ebe “ha” na-eme ka ndị a na-aza doo anya site n'ọnọdụ akụkọ ahụ.
- source_word: Οὐκ οἴδατε
  choice: Unu amaghị
  rationale: Nke a na-edobe isi echiche οἶδα, ya bụ ịma, kama ịtụgharị ya ozugbo ka ọ bụrụ ịghọta.
- source_word: τί αἰτεῖσθε
  choice: ihe unu na-arịọ
  rationale: Ụdị “na-arịọ” na-egosipụta omume arịrịọ ahụ na-aga n'ihu ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: δύνασθε
  choice: Unu pụrụ
  rationale: “Pụrụ” na-egosipụta ikike ma ọ bụ ike ime ihe ahụ, ma kwekọọ na azịza “Anyị pụrụ.”
- source_word: πιεῖν
  choice: ịṅụ
  rationale: Nke a bụ ntụgharị kpọmkwem na nke eke nke infinitive Grik ahụ.
- source_word: τὸ ποτήριον
  choice: iko ahụ
  rationale: E debere ihe atụ “iko” dị ka ọ dị na Grik, n'ebughị ụzọ kọwaa ya naanị dị ka ahụhụ ma ọ bụ ọnwụ.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: ahụ m na-aga ịṅụ
  rationale: “Na-aga ịṅụ” na-egosipụta ihe na-abịa n'ihu nke μέλλω na infinitive ya, ma na-edobe ihe atụ ahụ.
- source_word: λέγουσιν αὐτῷ
  choice: Ha sịrị ya
  rationale: A tụgharịrị historical present ahụ n'ụdị oge gara aga, dịka akụkọ Igbo si aga nke ọma.
- source_word: Δυνάμεθα
  choice: Anyị pụrụ
  rationale: Nke a na-edobe otu okwu ikike e ji tụgharịa δύνασθε, ma na-eme ka azịza ha dị nkenke ma sie ike.
theological_decisions:
- issue: Ihe atụ nke “iko”
  choice: Idobe “iko ahụ” n'ahịrịokwu bụ isi n'enweghị nkọwa ọzọ.
  alternative: “ahụhụ ahụ m na-aga ịnata” ma ọ bụ “iko ahụhụ ahụ m na-aga ịṅụ”
  rationale: Ihe atụ ahụ nwere ibu Akwụkwọ Nsọ ma na-atụ aka n'ihe e kenyere mmadụ, karịchaa ahụhụ Jizọs na-abịanụ. Ịhapụ ya dị ka “iko” na-edobe oghere ihe ọ pụtara na esemokwu nkà mmụta okpukpe nke akụkọ ahụ, kama imechi ya n'otu nkọwa.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “Jizọs,” “iko,” na usoro “zara ha sị” mee ka okwu ahụ bụrụ nke eke n'Igbo ma nọgide nso n'ụdị na ihe atụ nke Grik.
