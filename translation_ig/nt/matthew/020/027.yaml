  text: καὶ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν εἶναι πρῶτος ⸀ἔσται ὑμῶν δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your servant[a].
translation:
  language: ig
  text: Onye ọ bụla n’ime unu nke chọrọ ịbụ onye mbụ ga-abụ ohu unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a bụ doulos. Ọ siri ike karịa okwu e ji mee ihe n’amaokwu bu ụzọ, ọ na-apụtakarị ohu, ya bụ, onye nọ n’okpuru onye nwe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: Onye ọ bụla ... chọrọ
  rationale: Njikọ nnọchiaha na ἄν tinyere ngwaa n’ụdị subjunctive na-egosi onye ọ bụla ọnọdụ a metụtara; “chọrọ” na-edobe echiche nke ọchịchọ n’Igbo dị mfe ma bụrụkwa nke mmadụ na-asụ ugbu a.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: N’ebe a ọ na-egosi ọnọdụ mmadụ n’ime ndị na-eso ụzọ, ọ bụghị nanị ebe mmadụ nọ; “n’etiti unu” bụ Igbo doro anya maka echiche ahụ.
- source_word: εἶναι πρῶτος
  choice: ịbụ onye mbụ
  rationale: Nke a na-egosi ọchịchọ ịnọ n’ọkwa kachasị elu. Nsụgharị a kwụ ọtọ ma na-ada nke ọma n’Igbo.
- source_word: ἔσται
  choice: ga-abụ
  rationale: A hapụrụ ngwaa ahụ n’ọdịnihu dịka ọ dị n’asụsụ Grik. N’ọnọdụ a, ọ ka na-enye iwu ma ọ bụ ụkpụrụ n’enweghị ịgbanwe ya ka ọ bụrụ “aghaghị ịbụ.”
- source_word: ὑμῶν
  choice: unu
  rationale: Ọ na-egosi na onye ahụ ga-anọ n’ọrụ dị ala n’ihi ndị ọzọ niile nọ n’ìgwè ahụ; “ohu unu” na-egosipụta njikọ a n’ụzọ nkịtị n’Igbo.
- source_word: δοῦλος
  choice: ohu
  rationale: “Ohu” na-egosipụta ọnọdụ onye na-enweghị nnwere onwe nke δοῦλος karịa okwu nkịtị maka onye na-eje ozi. Ọ na-echekwa ike okwu Jizọs jiri mee ka ihe o kwuru n’amaokwu bu ụzọ sikwuo ike.
theological_decisions:
- issue: Otú e si asụgharị δοῦλος n’okwu gbasara iso ụzọ
  choice: ohu
  alternative: onye na-eje ozi; odibo
  rationale: Jizọs na-atụgharị ọchịchọ ịbụ onye kachasị elu ka ọ bụrụ iweda onwe onye ala nke ukwuu. Ebe amaokwu bu ụzọ ji διάκονος, iji “ohu” ebe a na-echekwa mmụba ike dị n’okwu Grik, n’etinyeghị nkọwa ụka pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. Ahịrịokwu ahụ na-edobe usoro echiche Grik n’enweghị ime ka ọ daa ka ntụgharị mkpụrụokwu n’otu n’otu. “Ohu” na-echekwa ihe dị iche n’etiti δοῦλος ebe a na διάκονος n’amaokwu bu ụzọ.
