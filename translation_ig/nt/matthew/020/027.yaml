review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the indefinite condition ('whoever ... wants'), aspiration to first place, the future normative force ('will be'), and the possessive relation in 'your slave.' It also properly retains the stronger sense of δοῦλος rather than flattening it to the service term used in the preceding verse.
  naturalness: “Onye ọ bụla n’etiti unu chọrọ ịbụ onye mbụ” is understandable, but “Onye ọ bụla n’ime unu nke chọrọ ịbụ onye mbụ” more naturally and unambiguously identifies the person from within the group who has this desire. “Ga-abụ ohu unu” is clear and suitably direct.
  terminology: “Ohu” is the appropriate rendering for δοῦλος here and preserves the rhetorical intensification from διάκονος in Matthew 20:26. The footnote should explain this lexical contrast without presenting “a person completely under an owner” as though it were a separate alternative meaning.
  issues:
  - severity: low
    issue: The placement of “n’etiti unu” can momentarily attach to “chọrọ” less smoothly than intended.
    rationale: Using “n’ime unu nke chọrọ” makes the indefinite relative construction natural in Standard Igbo while retaining the source sense, 'whoever among you wishes.'
  - severity: medium
    issue: The footnote’s wording, “onye nọ n’okpuru onye nwe ya kpamkpam,” is an explanatory paraphrase joined by “ma ọ bụ,” which can imply an alternative lexical sense.
    rationale: δοῦλος denotes a slave/enslaved person; the note should state that directly and explain its stronger force relative to the previous verse.
  revised_text: Onye ọ bụla n’ime unu nke chọrọ ịbụ onye mbụ ga-abụ ohu unu.[a]
  revised_footnotes:
  - marker: a
    text: Okwu Grik a bụ doulos. Ọ siri ike karịa okwu e ji mee ihe n’amaokwu bu ụzọ, ọ na-apụtakarị ohu, ya bụ, onye nọ n’okpuru onye nwe ya.
    reason: lexical_alternative
  revision_rationale: The revision improves the Standard Igbo relative construction and refines the lexical note. It retains all source-level elements and preserves the contrast between δοῦλος ('ohu') here and the less forceful service term in the preceding verse.
