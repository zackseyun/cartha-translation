- from: Onye ọ bụla n’etiti unu chọrọ ịbụ onye mbụ ga-abụ ohu unu.[a]
  to: Onye ọ bụla n’ime unu nke chọrọ ịbụ onye mbụ ga-abụ ohu unu.[a]
  rationale: The revision improves the Standard Igbo relative construction and refines the lexical note. It retains all source-level elements and preserves the contrast between δοῦλος ('ohu') here and the less forceful service term in the preceding verse.
  reviewer_model: gpt-5.6-terra
