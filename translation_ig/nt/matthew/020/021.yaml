  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: ig
  text: Ọ sịrị ya, “Gịnị ka ị chọrọ?” Ọ sịrị ya, “Kwuo ka ụmụ m nwoke abụọ ndị a nọdụ, otu n’aka nri gị, nke ọzọ n’aka ekpe gị, n’alaeze gị.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί θέλεις
  choice: Gịnị ka ị chọrọ?
  rationale: Nke a bụ ụzọ Igbo nke oge a si ajụ kpọmkwem ihe mmadụ na-arịọ, ma ọ na-echekwa ịdị mfe nke okwu Grik.
- source_word: Εἰπὲ
  choice: Kwuo
  rationale: Okwu Grik pụtara n'ụzọ bụ isi ‘kwuo.’ Ọ bụ ezie na ọnọdụ a nwere ike ime ka ọ bụrụ iwu ma ọ bụ nkwenye, ‘Kwuo’ anaghị etinye nkọwa karịrị nke dị n’isiokwu ahụ.
- source_word: ἵνα καθίσωσιν
  choice: ka ... nọdụ
  rationale: Usoro ‘ka ... nọdụ’ na Igbo na-egosipụta ihe arịrịọ ahụ chọrọ ka e mee, n'ụzọ doro anya ma dịkwa eke.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: ụmụ m nwoke abụọ ndị a
  rationale: Nke a na-echekwa ma ‘ụmụ m nwoke abụọ’ ma mkpụrụokwu ngosi οὗτοι, ‘ndị a.’
- source_word: εἷς ἐκ δεξιῶν σου
  choice: otu n’aka nri gị
  rationale: ‘N’aka nri gị’ bụ okwu Igbo a na-aghọta nke ọma maka ọnọdụ dị n’akụkụ aka nri, ma na-ebukwa echiche nke ọnọdụ nsọpụrụ.
- source_word: εἷς ἐξ εὐωνύμων σου
  choice: nke ọzọ n’aka ekpe gị
  rationale: Nke a na-enye ntụnyere eke n’Igbo n’etiti otu onye n’aka nri na onye nke ọzọ n’aka ekpe.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: n’alaeze gị
  rationale: ‘Alaeze’ bụ okwu Igbo a maara nke ọma maka βασιλεία; ọ nwere ike ịgụnye ma ógbè eze na ọchịchị eze n’enweghị imechi nghọta ahụ n’otu ụzọ.
theological_decisions:
- issue: Ụdị ịnọdụ ala a rịọrọ n’ihe gbasara ịbụ eze nke Jizọs
  choice: E gosipụtara ya dịka ọnọdụ nsọpụrụ n’aka nri na n’aka ekpe ya ‘n’alaeze gị,’ n’enweghị ịkọwa oge ma ọ bụ ụdị alaeze ahụ.
  alternative: Ịkọwa ya kpọmkwem dịka alaeze Mesaịa n’ụwa ma ọ bụ dịka alaeze eluigwe mgbe ihe niile zuru oke.
  rationale: Grik kwuru naanị maka ịnọdụ n’aka nri na n’aka ekpe Jizọs n’alaeze ya. Nsụgharị ahụ kwesịrị ịhapụ mgbagwoju anya gbasara oge na ọdịdị alaeze ahụ dịka isiokwu ahụ si mee.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘Kwuo’ iji nọgide nso na λέγω kama ịtụgharị ya ozugbo dịka ‘Nye iwu’ ma ọ bụ ‘Kwere,’ bụ́ ndị ga-akọwa ihe e zoro aka na ya karịa okwu Grik n’onwe ya.
