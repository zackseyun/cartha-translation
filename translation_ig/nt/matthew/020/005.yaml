base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: ig
  text: Ha wee pụọ. Ọ pụkwara ọzọ n’ihe dị ka elekere nke isii na nke itoolu[a], mee otu ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, n’ihe dị ka etiti ehihie na elekere atọ nke ehihie, dị ka usoro ndị Juu si agụ oge.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: Ha wee pụọ
  rationale: “Ha” na-ezo aka n’ebe ndị ọrụ ahụ a gwara okwu na amaokwu gara aga nọ. “Wee” na-egosi njikọ akụkọ dị nro nke δέ, ebe “pụọ” na-enye echiche ἀπῆλθον n’Igbo nkịtị.
- source_word: πάλιν
  choice: ọzọ
  rationale: “Ọzọ” na-egosi na ihe a bụ omume e mere ọzọ, dị ka πάλιν si kwuo.
- source_word: ἐξελθὼν
  choice: Mgbe ọ pụrụ
  rationale: Nkebiokwu a na-egosi omume nke bu ụzọ ma jikọọ ya nke ọma na ngwaa bụ isi, n’enweghị ịkọwa mmekọrịta oge karịa ihe Grik kwuru.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: n’ihe dị ka elekere nke isii na nke itoolu
  rationale: “N’ihe dị ka” na-egosipụta περὶ. Idebe “elekere nke isii na nke itoolu” na-echekwa usoro ndị Juu ji agụ oge; nkọwa ala peeji na-enye oge ndị a n’usoro oge nke oge a.
- source_word: ἐποίησεν
  choice: o mere
  rationale: ποιέω bụ ngwaa sara mbara ebe a, ọdịnaya ya na-esite n’okwu ὡσαύτως; “mere” na-edebe ya nkenke.
- source_word: ὡσαύτως
  choice: otu ihe ahụ
  rationale: N’okwu Igbo a, “otu ihe ahụ” na-egosipụta echiche nke ime dị ka o mere na mbụ n’ụzọ doro anya ma dịkwa mfe nghọta.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe ma nwee ugwu. E debere usoro oge nke omenala isi mmalite n’ahụ amaokwu ahụ, tinyezie nkọwa oge nke oge a n’ala peeji.
