- from: Ha wee pụọ. Mgbe ọ pụrụ ọzọ n’ihe dị ka elekere nke isii na nke itoolu[a], o mekwara otu ihe ahụ.
  to: Ha wee pụọ. Ọ pụkwara ọzọ n’ihe dị ka elekere nke isii na nke itoolu[a], mee otu ahụ.
  rationale: The revision retains the source’s sequence, repetition, approximation, and traditional Jewish-hour expression. It uses a more natural Igbo narrative construction for the participle and a concise equivalent for “likewise,” while preserving the existing accurate footnote and anchor.
