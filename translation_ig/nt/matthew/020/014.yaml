revisions:
- from: Were ihe bụ nke gị, lawa. Ma achọrọ m inye nwoke ikpeazụ a otu ihe ahụ m nyere gị.
  to: Were nke gị, laa. Ma achọrọ m inye nwoke ikpeazụ a otu ihe ahụ dị ka gị.
  rationale: 'The revision removes the unwarranted explicit past tense in the final comparison and improves idiomatic Standard Igbo. It retains the direct imperatives, the mild contrast introduced by δέ, the owner''s expressed will, and the masculine singular reference to the last worker. No footnote is needed: the English audit footnote does not identify a distinct source-text ambiguity requiring an Igbo note.'
  reviewer_model: gpt-5.6-terra
