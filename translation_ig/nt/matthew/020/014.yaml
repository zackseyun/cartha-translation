reference: Matthew 20:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἆρον τὸ σὸν καὶ ὕπαγε· θέλω δὲ τούτῳ τῷ ἐσχάτῳ δοῦναι ὡς καὶ σοί·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: ig
  text: Were nke gị, laa. Ma achọrọ m inye nwoke ikpeazụ a otu ihe ahụ dị ka gị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἆρον
  choice: Were
  rationale: Iwu a na-egosi ka onye ahụ were ihe ruuru ya; “Were” bụ okwu Igbo doro anya nke na-edowe ike nke iwu ahụ.
- source_word: τὸ σὸν
  choice: ihe bụ nke gị
  rationale: Nkebiokwu a pụtara n'ụzọ sara mbara ihe bụ nke onye ahụ. Ọ naghị etinye “ụgwọ ọrụ” n'amaokwu ebe Grik ekwughị ya kpọmkwem.
- source_word: ὕπαγε
  choice: lawa
  rationale: N'ebe a, okwu ahụ bụ iwu ka onye ahụ pụọ. “Lawa” bụ okwu Igbo dị nkenke ma dịkwa n'okike, na-enweghị ịgbakwụnye iwe n'olu onye na-ekwu okwu.
- source_word: θέλω δὲ
  choice: Ma achọrọ m
  rationale: “Achọrọ m” na-egosi ọchịchọ ma ọ bụ mkpebi onye nwe ubi, ebe “Ma” na-edowe ntakịrị ọdịiche δέ na-egosi.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: nwoke ikpeazụ a
  rationale: Okwu Grik ahụ na-ezo aka n'otu nwoke bụ onye ọrụ bịara n'ikpeazụ; ntụgharị a na-edowe ma mmadụ ọ bụ na ọnọdụ ya n'akụkọ ahụ.
- source_word: δοῦναι
  choice: inye
  rationale: “Inye” na-edowe ihe δίδωμι pụtara n'ụzọ nkịtị, n'agbanyeghị na ihe a na-enye bụ ụgwọ n'ọnọdụ akụkọ ahụ.
- source_word: ὡς καὶ σοί
  choice: otu ihe ahụ m nyere gị
  rationale: Grik na-egosi nhata n'ihe a na-enye. Igbo na-achọ ka ngwaa e zoro ezo pụta ìhè ka ahịrịokwu ahụ bụrụ nke eke ma doo anya.
theological_decisions:
- issue: Ịsụgharị onye a kpọrọ aha n'ụdị oke nwoke otu onye
  choice: nwoke ikpeazụ a
  alternative: onye ikpeazụ a
  rationale: Ụdị Grik bụ oke nwoke otu onye ma na-ezo aka n'otu onye ọrụ nwoke n'ilu ahụ. “Nwoke ikpeazụ a” na-edowe nkọwa ahụ kama ime ya okwu na-anọpụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ “lawa” maka iwu ọpụpụ, ma e zere itinye “ụgwọ ọrụ” ebe isiokwu Grik kwuru naanị “ihe bụ nke gị.” Enweghị akara nkọwa ala peeji n'ihi na ntụgharị a achọghị nkọwa ọzọ; ihe odide Bekee nyere akara [a], ma ọdịnaya nkọwa ya yiri akụkụ ọzọ nke amaokwu ahụ, ọ bụghị ihe ọzọ e kwesịrị itinye n'akụkụ “go.”
