    rationale: Ntụgharị oge ahụ ziri ezi n’ọnọdụ ụbọchị malitere n’elekere isii ụtụtụ, ma ọ na-ewepụ idiom na nhazi oge ilu ahụ nke Greek ji. Idowe ya n’ahịrị isi na itinye elekere ise n’ala ala peeji na-enye nkwụsi ike ka ukwuu.
