  to: N’ihe dị ka awa nke iri na otu[a], o wee pụọ, hụ ndị ọzọ ka ha guzo. Ọ sịrị ha[b], “Gịnị mere unu ji guzo ebe a ụbọchị dum n’emeghị ihe ọ bụla?”
  rationale: E wepụrụ “ọzọ,” nke na-enweghị nkwado n’amaokwu Grik, ma weghachi ‘awa nke iri na otu’ n’ahịrị isi iji chekwaa usoro oge ilu ahụ. E deziekwara ahịrị mbụ ka ọ ghara ịgbakwunye “n’ebe ahụ,” ebe ὧδε pụtara n’ajụjụ na-esote. A hapụrụ nkọwa maka historical present n’ala ala peeji.
