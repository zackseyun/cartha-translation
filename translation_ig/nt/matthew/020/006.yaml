review_pass:
  verdict: revise
  source_fidelity: A chọrọ imegharị ya. “ọzọ” na “ọ gara ọzọ” na-agbakwunye echiche ‘ọzọ/again’ nke na-adịghị na Greek nke amaokwu a. Ịsụgharị ‘awa nke iri na otu’ ka ọ bụrụ naanị ‘elekere ise nke mgbede’ na-eme ka nhazi oge ilu ahụ ghara ịdị pụta ìhè; ọ ka mma idowe okwu isi ahụ ma nye ntụgharị oge n’ala ala peeji.
  naturalness: 'Mgbanwe a na-eji usoro Igbo dị mfe ma dị ugbu a: “o wee pụọ, hụ…” maka participle na ngwaa isi, na “Gịnị mere unu ji…” maka ajụjụ ahụ. “n’emeghị ihe ọ bụla” bụ okwu eke maka ἀργοί n’ebe a.'
  terminology: “awa nke iri na otu” na-echekwa nhazi oge nke ihe odide Grik; “n’emeghị ihe ọ bụla” na-ebuga ‘idle’ n’enweghị ịgbakwunye echiche enweghị ọrụ. A hapụrụ ‘ọ sịrị ha’ ka ọ bụrụ akụkọ Igbo eke, ma ala ala peeji na-akọwa historical present nke λέγει.
