  text: περὶ δὲ τὴν ⸀ἑνδεκάτην ἐξελθὼν εὗρεν ἄλλους ⸀ἑστῶτας, καὶ λέγει αὐτοῖς· Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: ig
  text: N’ihe dị ka awa nke iri na otu[a], o wee pụọ, hụ ndị ọzọ ka ha guzo. Ọ sịrị ha[b], “Gịnị mere unu ji guzo ebe a ụbọchị dum n’emeghị ihe ọ bụla?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe dị ka elekere ise nke mgbede,” ma ọ bụrụ na a gụọ ụbọchị malite n’ihe dị ka elekere isii nke ụtụtụ. N’ụzọ nkịtị, “ihe dị ka awa nke iri na otu.”
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ, “Ọ na-asị ha.” Asụsụ Grik ji ngwaa nke oge ugbu a n’akụkọ a: “ọ na-asị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: Mgbe o ruru ihe dị ka elekere ise nke mgbede
  rationale: N’agụ oge ndị Juu malite n’ihe dị ka elekere isii nke ụtụtụ, awa nke iri na otu bụ ihe dị ka elekere ise nke mgbede. ‘Ihe dị ka’ na-echekwa echiche nke περί na accusative, ya bụ oge a na-atụghị kpọmkwem.
- source_word: ἐξελθὼν
  choice: ọ gara ọzọ
  rationale: Aorist participle na-egosi ihe o mere tupu ọ hụ ndị ahụ; n’Igbo, ngwaa e jikọtara n’usoro a na-ada eke. ‘Ọzọ’ sitere n’usoro akụkọ ilu ahụ, ebe onye nwe ubi na-apụ ugboro ugboro.
- source_word: εὗρεν ἄλλους ἑστῶτας
  choice: hụ ndị ọzọ ka ha guzo
  rationale: Nke a na-egosipụta n'ụzọ Igbo dị eke na ọ hụrụ ndị ọzọ nọ n’ọnọdụ iguzo, na-agbakwụnyeghị na ha bụ naanị ụmụ nwoke.
- source_word: καὶ λέγει αὐτοῖς
  choice: Ọ sịrị ha
  rationale: Igbo na-ejikarị oge gara aga akọ akụkọ. Nke a na-ebuga historical present λέγει n'ụzọ doro anya ma dị eke; e debere nhọrọ nkịtị nke Greek n’ala ala peeji.
- source_word: Τί ὧδε ἑστήκατε
  choice: Gịnị mere unu ji guzo n’ebe a
  rationale: Τί bụ ‘gịnị mere’ n’ajụjụ a; perfect ἑστήκατε na-egosi ọnọdụ ha nọgidere na ya, nke usoro ‘ji guzo’ na gburugburu okwu ahụ na-ebuga nke ọma.
- source_word: ὅλην τὴν ἡμέραν ἀργοί
  choice: ụbọchị dum n’emeghị ihe ọ bụla
  rationale: Nke a bụ okwu Igbo doro anya maka ịnọ ἀργοί—ịnọ na-arụghị ọrụ ma ọ bụ na-emeghị ihe—n’oge ụbọchị dum, n’enweghị itinye echiche akụ na ụba nke ‘enweghị ọrụ.’
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, nke a na-aghọta ngwa ngwa ma nọgide na-enwe nkwanye ùgwù. A gbanwere ‘awa nke iri na otu’ gaa n’oge elekere ndị na-agụ taa maara, ma debe okwu nkịtị n’ala ala peeji. A zere ‘ndị na-enweghị ọrụ’ ka a ghara itinye nkọwa mmekọrịta akụ na ụba nke ἀργοί na-ekwughị kpọmkwem.
