id: MAT.20.31
reference: Matthew 20:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: ig
  text: Ma ìgwè mmadụ ahụ baara ha mba ka ha mechie ọnụ. Ma ha tiri mkpu karịa, sị, “Onyenwe anyị, meere anyị ebere, Nwa Devid[a]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nwa Devid” bụ aha e ji akpọ Mesaịa ahụ; ọ bụghị naanị okwu na-egosi na mmadụ si n’agbụrụ Devid.
    reason: cultural_note
lexical_decisions:
- source_word: ὄχλος
  choice: ìgwè mmadụ ahụ
  rationale: Nke a bụ okwu Igbo nkịtị na nke doro anya maka ìgwè mmadụ nọ n’otu ebe; ọ dabara n’ọnọdụ akụkọ a.
- source_word: ἐπετίμησεν
  choice: baara ha mba
  rationale: Ọ na-egosi ịkatọ ma ọ bụ inye iwu n’ike ka ha kwụsị, n’enweghị ịgbakwunye ihe karịrị ihe Grik kwuru.
- source_word: ἵνα σιωπήσωσιν
  choice: ka ha gbachie nkịtị
  rationale: 'Ọ na-egosipụta ebumnuche ìgwè mmadụ ahụ: ime ka ndị ikom ahụ kwụsị ikwu okwu.'
- source_word: μεῖζον
  choice: karịa
  rationale: Comparative a na-eme ka omume iti mkpu sie ike, ma ọ naghị ekpebi kpamkpam ma ihe a na-emesi ike bụ olu ka ukwuu ma ọ bụ ịnọgide na-eti mkpu karịa.
- source_word: ἔκραξαν
  choice: tikuru mkpu
  rationale: Ọ na-egosi mkpu dara ụda nke jupụtara ná ngwa ngwa na arịrịọ.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ nsụgharị Igbo a na-ejikarị maka κύριος; ọ na-echekwa ma nkwanye ùgwù n’ịkpọ Jizọs okwu ma ihe ọ pụrụ ịpụta banyere onye ọ bụ.
- source_word: ἐλέησον ἡμᾶς
  choice: meere anyị ebere
  rationale: Nke a bụ ụzọ Igbo dị ndụ na nke kwụ ọtọ isi rịọ mmadụ ka o gosi ebere.
- source_word: υἱὸς Δαυίδ
  choice: Nwa Devid
  rationale: E debere aha a n’ụdị ya kpọmkwem n’ihi na ọ bụ aha e ji akọwa Mesaịa n’akụkọ Matiu, ọ bụghị naanị ịkọ usoro ọmụmụ.
theological_decisions:
- issue: Aha Mesaịa e nyere Jizọs
  choice: Nwa Devid
  alternative: Nwa sitere n’agbụrụ Devid
  rationale: “Nwa Devid” na-echekwa ịdị arọ nke aha eze na Mesaịa ahụ n’enweghị ịtụgharị ya naanị ka ọ bụrụ okwu gbasara usoro ọmụmụ.
- issue: Ụzọ e si sụgharịa κύριος mgbe a na-akpọ Jizọs okwu
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” na-echekwa ma nkwanye ùgwù dị n’okwu ahụ ma ohere nke nghọta miri emi banyere Jizọs; “Nna ukwu” ga-eme ka ihe ọ pụtara dị warara.
- issue: Ihe comparative μεῖζον na-emesi ike
  choice: karịa
  alternative: n’olu ka ukwuu
  rationale: Grik ahụ pụrụ igosi mmụba n’ike omume n’ozuzu ma ọ bụ kpọmkwem n’ịdị elu nke olu. “Karịa” na-ahapụ obere nghọta abụọ ahụ ka ha dị.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “tikuru mkpu karịa” iji chekwaa nghọta sara mbara nke μεῖζον; ya mere, e tinyeghị nkọwa ọzọ gbasara “n’olu ka ukwuu” n’ala peeji. Akara ndetu [a] dị n’isiokwu ahụ ozugbo e kwusịrị aha ọ na-akọwa.
