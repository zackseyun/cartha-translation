- from: Mgbe ndị bịara n’ihe dị ka elekere iri na otu bịarutere, onye ọ bụla n’ime ha natara otu denarịọs[a].
  to: Ma ndị bịara n’ihe dị ka elekere iri na otu natara otu denarịọs onye ọ bụla[a].
  rationale: The revision translates καὶ with “Ma,” retains the approximate eleventh-hour reference, and expresses ἐλθόντες only once through “ndị bịara.” “Natara otu denarịọs onye ọ bụla” naturally conveys receipt of one denarius apiece without adding that the workers were hired.
