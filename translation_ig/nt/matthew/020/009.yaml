  text: ⸂καὶ ἐλθόντες⸃ οἱ περὶ τὴν ἑνδεκάτην ὥραν ἔλαβον ἀνὰ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: ig
  text: Ma ndị bịara n’ihe dị ka elekere iri na otu natara otu denarịọs onye ọ bụla[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Denarịọs bụ mkpụrụ ego ọlaọcha ndị Rom; a na-ewerekarị ya dịka ụgwọ a na-akwụ onye ọrụ maka otu ụbọchị.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: Mgbe
  rationale: N’Igbo, ijikọ amaokwu a na usoro akụkọ site n’ahịrịokwu oge na-eme ka okwu ahụ na-aga nke ọma. Ọ naghị agbakwụnye echiche karịrị njikọ akụkọ nke καί nwere n’ebe a.
- source_word: ἐλθόντες
  choice: bịarutere
  rationale: Aorist participle a na-egosi ọbịbịa ndị ọrụ ahụ; ‘bịarutere’ bụ okwu Igbo doro anya ma kwekọọ n’usoro ahịrịokwu oge.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: ndị bịara n’ihe dị ka elekere iri na otu
  rationale: ‘N’ihe dị ka’ na-echekwa nghọta oge nke περὶ, ebe ‘elekere iri na otu’ na-edobe usoro ịgụ oge dị n’ihe odide ahụ n’ebughị ụzọ kọwaa ya dị ka oge nke taa.
- source_word: ἔλαβον
  choice: natara
  rationale: N’ọnọdụ ịkwụ ụgwọ a, ‘natara’ na-egosi nke ọma na e nyere ha ụgwọ ahụ.
- source_word: ἀνὰ
  choice: onye ọ bụla n’ime ha
  rationale: 'Nke a na-egosipụta nkesa nke ἀνά n’Igbo nkịtị: otu mkpụrụ ego nye onye nke ọ bụla.'
- source_word: δηνάριον
  choice: otu denarịọs
  rationale: A na-edobe aha mkpụrụ ego Rom ahụ kama ịtụgharị ya ozugbo ka ọ bụrụ ụgwọ otu ụbọchị; nkọwa banyere uru ya dị n’ala ala peeji.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma nwee ugwu. A haziri ahịrịokwu ahụ ka ọ bụrụ nke ndị na-agụ akwụkwọ nkịtị ga-aghọta ngwa ngwa, ma e debere aha mkpụrụ ego oge ochie na nkọwa ala ala peeji.
