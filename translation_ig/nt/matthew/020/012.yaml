  to: na-asị, “Ndị a bịara n’ikpeazụ rụrụ otu awa, ma i mere ka ha na anyị hara—anyị ndị buuru ibu ọrụ nke ụbọchị ahụ na okpomọkụ na-ere ọkụ.”
