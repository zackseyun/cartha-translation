  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: ig
  text: na-asị, “Ndị a bịara n’ikpeazụ rụrụ otu awa, ma i mere ka ha na anyị hara—anyị ndị buuru ibu ọrụ nke ụbọchị ahụ na okpomọkụ na-ere ọkụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ bụ participle dị ugbu a, nke jikọrọ okwu a na ihe omume dị n’amaokwu bu ụzọ; ‘na-asị’ na-echekwa usoro ahụ n’Igbo nkịtị.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: Ndị a bịara n’ikpeazụ
  rationale: N’ilu a, okwu ahụ na-ezo aka n’ụmụọrụ e goro n’ikpeazụ; nsụgharị a na-eme ka onye a na-ekwu maka ya doo anya n’Igbo.
- source_word: μίαν ὥραν ἐποίησαν
  choice: rụrụ naanị otu awa
  rationale: ποιέω tinyere oge pụtara ịrụ ọrụ ruo oge ahụ. ‘Naanị’ na-egosipụta mkpesa na ọdịiche dị n’etiti otu awa na ụbọchị dum.
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: i mere ka ha na anyị hara
  rationale: Nke a na-esochi echiche nkịtị nke ime ka otu ndị na ndị ọzọ hara, ma na-ahapụ mkpesa ndị ọrụ ahụ ka ọ kwuo onwe ya.
- source_word: τοῖς βαστάσασι
  choice: anyị ndị buru
  rationale: ‘Buru’ na-echekwa ihe oyiyi nke ibu arọ ma nwee ike ịgụnye ịtachi obi n’ọrụ siri ike.
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: ibu ọrụ ụbọchị ahụ
  rationale: ‘Ibu ọrụ’ na-echekwa ihe oyiyi βάρος ma na-egosi arọ nke ịrụ ọrụ ụbọchị dum n’Igbo doro anya.
- source_word: τὸν καύσωνα
  choice: okpomọkụ na-ere ọkụ
  rationale: καύσων bụ okpomọkụ siri ike ma na-akpọ ọkụ; okwu a na-egosipụta ike ya karịa naanị ‘okpomọkụ.’
theological_decisions:
- issue: Mkpesa dị n’ilu banyere nha anya na ikpe ziri ezi
  choice: E gosipụtara mkpesa ndị ọrụ ahụ ozugbo, n’enweghị ịkọwa ma onye nwe ubi mere ihe ziri ezi ma ọ bụ na o meghị.
  alternative: Ịsụgharị ya n’ụzọ ga-ekwusi ike na e mesoro ha n’ụzọ na-ezighị ezi.
  rationale: Amaokwu ahụ na-akọ mkpesa ha; nsụgharị ekwesịghị idozi esemokwu nkà mmụta okpukpe nke ilu ahụ n’okwu amaokwu ahụ n’onwe ya.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ndị a bịara n’ikpeazụ’ mee ka ihe ἔσχατοι na-ezo aka na ya doo anya; e debere ihe oyiyi nke ibu arọ na okpomọkụ siri ike.
