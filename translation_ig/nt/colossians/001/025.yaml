  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: ig
  text: Aghọrọ m onye na-ejere ụka ahụ ozi, dị ka ọrụ nlekọta Chineke nyere m maka unu[a], ka m wee mezuo okwu Chineke[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka ọrụ nlekọta nke si n’aka Chineke, nke e nyere m maka unu.”
    reason: previous_rendering
  - marker: b
    text: Ma ọ bụ, “ka m wee mee ka a mara okwu Chineke n’uju,” ma ọ bụ, “ka m wee mee ka okwu Chineke zuo oke.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: ụka ahụ
  rationale: Nnọchiaha nwanyị a na-alaghachi n’okwu ἐκκλησία (‘ụka’) dị n’amaokwu 24. Ikwupụta ‘ụka ahụ’ n’Igbo na-eme ka njikọ ahụ doo anya n’enweghị ịgbanwe ihe ọ na-ezo aka na ya.
- source_word: ἐγενόμην
  choice: Abụrụ m
  rationale: Na-egosi na Pọl batara n’ọrụ a; ọ naghị etinye echiche nke nhọpụta n’olu mmegharị karịa ka Greek si kwuo.
- source_word: διάκονος
  choice: onye na-ejere ... ozi
  rationale: Na-egosi onye na-arụ ọrụ ije ozi, ma na-ezere iji aha ọkwa ụka e mechara guzobe mee ihe n’ebe a.
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ
  choice: dị ka ọrụ nlekọta nke si n’aka Chineke
  rationale: ‘Ọrụ nlekọta’ na-echekwa echiche nke ọrụ e nyefere mmadụ ka ọ lekọta, ebe ‘nke si n’aka Chineke’ na-egosi isi mmalite ya.
- source_word: τὴν δοθεῖσάν μοι
  choice: nke e nyere m
  rationale: Na-echekwa ọdịdị okwu nnara nke Greek na echiche nke ọrụ e nyefere Pọl.
- source_word: εἰς ὑμᾶς
  choice: maka unu
  rationale: Na-egosi na ọrụ ahụ chere ndị Kọlọsi ihu ma bụrụ maka uru ha.
- source_word: πληρῶσαι
  choice: ka m wee mezuo
  rationale: ‘Mezuo’ na-echekwa obosara ihe okwu a nwere ike ịpụta—imezu, iweta n’uju, ma ọ bụ ime ka a mara n’uju—n’enweghị idozi esemokwu nkọwa ahụ n’isi ederede.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Nke a bụ nsụgharị Igbo doro anya nke na-echekwa ụda na njikọ Akwụkwọ Nsọ nke okwu ahụ.
theological_decisions:
- issue: Ihe πληρῶσαι τὸν λόγον τοῦ θεοῦ pụtara
  choice: ka m wee mezuo okwu Chineke
  alternative: ka m wee mee ka a mara okwu Chineke n’uju; ma ọ bụ, ka m wee weta okwu Chineke n’uju
  rationale: Greek nwere ike imesi mmezu, iweta ozi ahụ n’uju, ma ọ bụ ikwusa ya n’uju ike. Isi ederede jiri okwu sara mbara mee ihe, ebe nkọwa ala peeji na-egosi nghọta ndị ọzọ.
- issue: Mmekọrịta τοῦ θεοῦ na οἰκονομία
  choice: ọrụ nlekọta nke si n’aka Chineke
  alternative: ọrụ nlekọta Chineke nyere m
  rationale: Genitive ahụ nwere ike igosi na ọrụ ahụ sitere n’aka Chineke, ebe participle na-ekwu na e nyere Pọl ya. Nsụgharị isi na-edebe ihe abụọ ahụ iche dịka usoro Greek si dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ ‘onye na-ejere ... ozi’ kama aha ọkwa ụka, a họrọkwara ‘ọrụ nlekọta’ iji chekwaa ihe atụ nke ọrụ e nyefere mmadụ. Akara nkọwa [a] na [b] dị n’isi ederede n’ebe okwu ndị ha na-akọwa dị.
