revisions:
- from: Abụrụ m onye na-ejere ụka ahụ ozi, dị ka ọrụ nlekọta nke si n’aka Chineke, nke e nyere m maka unu[a], ka m wee mezuo okwu Chineke[b].
  to: Aghọrọ m onye na-ejere ụka ahụ ozi, dị ka ọrụ nlekọta Chineke nyere m maka unu[a], ka m wee mezuo okwu Chineke[b].
  rationale: The revision uses “Aghọrọ m” to represent ἐγενόμην precisely, streamlines the stewardship construction in idiomatic Standard Igbo, and improves the alternative footnote while preserving the source text’s debated breadth. The footnote markers remain attached to the phrases they explain.
