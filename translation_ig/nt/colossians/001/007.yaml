  to: dị nnọọ ka unu si mụta ya n’aka Epafras, onye anyị hụrụ n’anya, bụ́ ohu ibe anyị, onye bụ onye na-eje ozi nke Mesaịa[b] kwesịrị ntụkwasị obi maka anyị.[c]
  rationale: E degharịala διάκονος dịka “onye na-eje ozi” maka izi ezi na nghọta Igbo, ma gbanwee ὑπὲρ ἡμῶν ka ọ bụrụ “maka anyị” ka a ghara ime ka echiche nnọchite anya sie ike karịa ihe Grik na-ekwu. E wepụrụ ndetu ala a na-enweghị nkwado maka ọdịiche ederede, ma mee ka ndetu maka ὑπὲρ ἡμῶν bụrụ naanị nhọrọ nsụgharị. “Ya” ka edobere n’ihi na ọ na-ezo aka n’ozi ọma a kpọtụrụ aha n’amaokwu gara aga, ma ọ dị mkpa n’usoro ahịrịokwu Igbo.
