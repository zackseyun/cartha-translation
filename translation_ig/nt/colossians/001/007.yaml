id: COL.1.7
reference: Colossians 1:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καθὼς ἐμάθετε ἀπὸ Ἐπαφρᾶ τοῦ ἀγαπητοῦ συνδούλου ἡμῶν, ὅς ἐστιν πιστὸς ὑπὲρ ⸀ἡμῶν διάκονος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/007.yaml
  text: just as you learned from Epaphras[a], our beloved fellow servant, who is a faithful minister of the Messiah on our behalf[c][b],
translation:
  language: ig
  text: dị nnọọ ka unu si mụta ya n’aka Epafras, onye anyị hụrụ n’anya, bụ́ ohu ibe anyị, onye bụ onye na-eje ozi nke Mesaịa[b] kwesịrị ntụkwasị obi maka anyị.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ma ọ bụ “Kraịst.” Okwu Grik ahụ bụ Christos, nke pụtara “Onye e tere mmanụ.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị “maka anyị” dịka “n’aha anyị” ma ọ bụ “n’ihi anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: 'Ọ na-ejikọta amaokwu a na ihe e kwuru tupu ya ma na-egosi nkwekọrịta: “dị nnọọ ka.”'
- source_word: ἐμάθετε ἀπὸ
  choice: unu si mụta ya n’aka
  rationale: “N’aka” na-egosi onye ha si n’aka ya nata ihe ọmụmụ ahụ. E tinyere “ya” n’ihi usoro asụsụ Igbo; ọ na-ezo aka n’ozi ọma e kwuru n’amaokwu bu ụzọ.
- source_word: Ἐπαφρᾶ
  choice: Epafras
  rationale: E dere aha onye ahụ n’ụdị dabara n’usoro mkpọpụta na odide Igbo.
- source_word: ἀγαπητοῦ
  choice: onye anyị hụrụ n’anya
  rationale: Nke a na-egosipụta ịhụnanya dị na okwu Grik ahụ n’Igbo dị mfe ma dị ùgwù.
- source_word: συνδούλου
  choice: ohu ibe anyị
  rationale: Okwu ahụ pụtara onye ya na ndị ọzọ bụ ohu n’okpuru otu nna ukwu; “ohu ibe anyị” na-echekwa ihe oyiyi ahụ karịa “onye ọrụ ibe anyị.”
- source_word: πιστὸς
  choice: kwesịrị ntụkwasị obi
  rationale: N’ebe a, okwu ahụ na-akọwa Epafras dị ka onye a pụrụ ịtụkwasị obi n’ozi ya.
- source_word: διάκονος
  choice: onye ozi
  rationale: Ọ na-egosi onye na-eje ozi, ọ bụghị n’ụzọ doro anya aha ọkwa chọọchị e guzobere mgbe e mesịrị.
- source_word: τοῦ Χριστοῦ
  choice: Mesaịa
  rationale: Χριστός na-arụ ọrụ dị ka utu aha nke Onye E Tere Mmanụ; “Mesaịa” na-eme ka ihe utu aha ahụ pụtara doo anya.
- source_word: ὑπὲρ ἡμῶν
  choice: n’aha anyị
  rationale: Nke a na-echekwa echiche nke ije ozi n’ọnọdụ ma ọ bụ n’aha Pọl na ndị ya na ha nọ.
theological_decisions:
- issue: Ihe σύνδουλος pụtara
  choice: ohu ibe anyị
  alternative: onye ọrụ ibe anyị
  rationale: Nhọrọ a na-echekwa mmekọrịta nke ndị niile nọ n’okpuru otu nna ukwu, n’agbanyeghị na “onye ọrụ ibe anyị” ga-adị nro karịa.
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ahịrịokwu a ọ bụ utu aha nke onye Epafras na-ejere ozi; “Mesaịa” na-egosipụta ihe utu aha ahụ pụtara kama ime ya naanị ka ọ bụrụ aha.
- issue: Ihe ὑπὲρ ἡμῶν pụtara
  choice: n’aha anyị
  alternative: maka anyị
  rationale: “N’aha anyị” na-egosi nnọchite anya nke ọma, ebe “maka anyị” nwekwara ike ịpụta naanị uru a baara ha.
- issue: Ọdịiche ederede n’aha nnọchiaha
  choice: anyị (ἡμῶν)
  alternative: unu (ὑμῶν)
  rationale: Ederede SBLGNT họọrọ “anyị,” ma ụfọdụ akaebe ochie nwere “unu”; e debere ọdịiche ahụ n’okpuru peeji kama ikpochapụ ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “ohu ibe anyị” iji chekwaa ike nke σύνδουλος; a họọrọ “onye ozi” iji zere ịmanye aha ọkwa chọọchị n’ebe okwu Grik ahụ nwere nghọta sara mbara.
