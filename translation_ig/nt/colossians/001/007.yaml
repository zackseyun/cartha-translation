  verdict: revise
  source_fidelity: 'A sụgharịrị isi ihe ndị Grik nke ọma n’ozuzu ha: καθὼς, ἐμάθετε ἀπό, ἀγαπητός, σύνδουλος, πιστός, Χριστός, na ὑπὲρ ἡμῶν. Otú ọ dị, “onye ozi” na-achọkarị ịpụta onye ozi/zitere ozi, ebe διάκονος n’ebe a bụ onye na-eje ozi n’ozi Kraịst. “N’aha anyị” nwekwara ike ikwu na Epafras nọchitere ha anya n’ụzọ gọọmenti ma ọ bụ n’okpuru ikike ha; “maka anyị” na-echekwa obosara ὑπέρ karịa.'
  naturalness: Ederede ahụ na-agụ nke ọma na Standard Igbo. “Onye na-eje ozi nke Mesaịa” bụ okwu eke na nke doro anya karịa “onye ozi Mesaịa” n’ọnọdụ a. Iwepụ “-kwa” na-eme ka njikọ okwu ahụ soro Grik nke ọma.
  terminology: “Ohu ibe anyị” na-echekwa ike σύνδουλος nke ọma, “Mesaịa” dabara na Χριστός dị ka utu aha, ma “kwesịrị ntụkwasị obi” dabara na πιστός. A gbanwere διάκονος ka ọ bụrụ “onye na-eje ozi” iji zere nghọta “onye ozi” dịka messenger/apostle.
  issues:
