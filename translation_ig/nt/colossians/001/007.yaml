    issue: “onye ozi” maka διάκονος
    rationale: N’Igbo, “onye ozi” na-adịkarị ka onye e zigara ozi ma ọ bụ onye na-ebuga ozi. διάκονος ebe a na-ekwu maka onye na-eje ozi n’ozi Kraịst; “onye na-eje ozi” na-egosi nke a n’enweghị ịmanye ọkwa ụka.
  - severity: medium
