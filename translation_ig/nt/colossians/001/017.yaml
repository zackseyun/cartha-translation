revisions:
- from: Ya onwe ya dị tupu ihe niile[b], ọ bụkwa n’ime ya ka ihe niile ji dịkọ ọnụ[a].
  to: Ya onwe ya dị tupu ihe niile[b], ọ bụkwa n’ime ya ka ihe niile dịrịkọtara ọnụ[a].
  rationale: The revision replaces only the less natural and potentially causative-sounding “ji dịkọ ọnụ” with “dịrịkọtara ọnụ.” This retains the perfect’s present resultant state and the sense that all things cohere or hold together in him. The footnote on temporal priority is lightly clarified by repeating “ihe niile” rather than using the potentially less clear pronoun “ha.”
