  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ αὐτός ἐστιν πρὸ πάντων καὶ τὰ πάντα ἐν αὐτῷ συνέστηκεν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/017.yaml
  text: And he is before all things[b][a], and in him all things hold together.
translation:
  language: ig
  text: Ya onwe ya dị tupu ihe niile[b], ọ bụkwa n’ime ya ka ihe niile dịrịkọtara ọnụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe niile nwere ịdị adị ha n’ime ya,” ma ọ bụ, “ihe niile na-ejikọta ọnụ n’ime ya.”
    reason: lexical_alternative
  - marker: b
    text: “Tupu ihe niile” nwekwara ike ịgụnye echiche na ọ dị elu karịa ihe niile, ma okwu Grik na-egosi n’ụzọ bụ isi na ọ dịrị adị tupu ihe niile.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτός
  choice: Ya onwe ya
  rationale: Ọnọdụ nnọchiaha a n’asụsụ Grik na-enye ya nkwusi ike. “Ya onwe ya” na-egosipụta nkwusi ike ahụ n’Igbo n’enweghị ịgbatị ihe amaokwu ahụ kwuru.
- source_word: πρὸ πάντων
  choice: tupu ihe niile
  rationale: πρό na genitive na-egosi n’ụzọ bụ isi na ọ dịrị adị tupu ihe niile. Nhọrọ a na-echekwa echiche nke ịdịbu ụzọ, kama ịgbanwe ya naanị ka ọ bụrụ ịdị elu n’ọkwa.
- source_word: τὰ πάντα
  choice: ihe niile
  rationale: Nkebiokwu a sara mbara ma na-agụnye ihe niile. Ọ na-echekwakwa nkwughachi okwu ahụ dị n’amaokwu ndị gbara ya gburugburu.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Nhọrọ a na-echekwa ἐν dịka “n’ime,” ma hapụkwa obosara nke mmekọrịta ahụ kama ịkọwa ya kpọmkwem dịka “site n’aka ya.”
- source_word: συνέστηκεν
  choice: ji dịkọ ọnụ
  rationale: Oge perfect nke ngwaa Grik na-egosi ọnọdụ ka dị ugbu a sitere n’ihe meworo. “Ji dịkọ ọnụ” na-ekwu n’Igbo doro anya na ihe niile ka na-enwe njikọ na ịdị n’usoro n’ime ya.
theological_decisions:
- issue: Mmekọrịta Kraịst na ihe e kere eke n’okwu πρὸ πάντων
  choice: 'E gosipụtara ịdịbu ụzọ n’oge: “dị tupu ihe niile.”'
  alternative: 'Ịdị elu n’ọkwa: “dị elu karịa ihe niile.”'
  rationale: Okwu Grik na-egosi n’ụzọ bụ isi ịdịbu ụzọ. N’ọnọdụ Ndị Kọlọsi 1:15–20, nke a nwere ihe ọ na-egosi banyere ịdị adị Ọkpara tupu ihe e kere eke, ma ntụgharị ahụ ekwesịghị itinye nkọwa okwukwe sara mbara karịa okwu ahụ n’onwe ya.
- issue: Ike okwu συνέστηκεν
  choice: Ihe niile ka na-adịkọ ọnụ ma na-anọgide n’usoro n’ime ya.
  alternative: Ihe niile mejupụtara ịdị adị ha n’ime ya.
  rationale: Nhọrọ a na-echekwa echiche nke njikọta na nkwado nke eluigwe na ụwa, n’asụsụ Igbo dị mfe nghọta, ma ghara imechi ụzọ nye obosara okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ya onwe ya” na-eburu nkwusi ike nke αὐτός; usoro “ọ bụkwa n’ime ya ka…” bụ usoro Igbo ebumpụta ụwa nke na-echekwa nkwusi ike nke ἐν αὐτῷ.
