  to: Ọ bụkwa maka nke a ka m na-adọgbu onwe m n’ọrụ[a], na-agbasi mbọ ike[b] dịka ọrụ ya[c] si dị, bụ́ ọrụ nke na-arụ ọrụ n’ime m n’ike[d].
