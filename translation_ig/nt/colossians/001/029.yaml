  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: ig
  text: Ọ bụkwa maka nke a ka m na-adọgbu onwe m n’ọrụ[a], na-agbasi mbọ ike[b] dịka ọrụ ya[c] si dị, bụ́ ọrụ nke na-arụ ọrụ n’ime m n’ike[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “iji ruo nzube a” ma ọ bụ “maka ihe a.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-alụ ọgụ.”
    reason: lexical_alternative
  - marker: c
    text: Ihe odide Grik kwuru “ọrụ ya” n’akọwaghị kpọmkwem ma “ya” ọ na-ezo aka na Chineke ka ọ̀ bụ Kraịst.
    reason: alternative_reading
  - marker: d
    text: A pụkwara ịsụgharị ya, “nke na-arụ ọrụ n’ime m n’ụzọ dị ike” ma ọ bụ “nke ji ike na-arụ ọrụ n’ime m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: maka nke a
  rationale: Nkebiokwu a na-atụgharị uche n’ihe Pọl kwuru n’amaokwu bu ụzọ ma na-egosi ihe ọ na-agbalị iru; nsụgharị a dị nkenke ma bụrụ Igbo nkịtị.
- source_word: καὶ
  choice: ọ bụkwa
  rationale: “-kwa” na-egosi na Pọl na-agbakwụnye ndọgbu onwe ya n’ọrụ n’ihe ọ ka kwuru.
- source_word: κοπιῶ
  choice: na-adọgbu onwe m n’ọrụ
  rationale: Nke a na-egosipụta ọrụ siri ike nke na-eme ka ike gwụ mmadụ, bụ́ isi echiche nke κοπιάω.
- source_word: ἀγωνιζόμενος
  choice: na-agbasi mbọ ike
  rationale: Ọ na-egosi mgbalị siri ike, ma na-aga nke ọma n’Igbo ugbu a n’enweghị ụda okwu nka.
- source_word: κατὰ
  choice: dịka ... si dị
  rationale: Nke a na-echekwa echiche nke ụkpụrụ ma ọ bụ ókè nke ọrụ ahụ, ọ bụghị nanị ikwu ihe e ji mee ya.
- source_word: ἐνέργειαν
  choice: ọrụ
  rationale: N’ebe a, “ọrụ” pụtara ike na-arụpụta ihe. Ọ na-enyekwa ohere idobe njikọ okwu ya na ἐνεργουμένην n’Igbo.
- source_word: αὐτοῦ
  choice: ya
  rationale: Aha nnọchi a anaghị akọwapụta kpọmkwem ma ọ na-ezo aka n’ebe Chineke nọ ka ọ̀ bụ n’ebe Kraịst nọ; “ya” na-echekwa ihe odide Grik ahụ.
- source_word: τὴν ἐνεργουμένην
  choice: bụ́ ọrụ nke ... na-arụ ọrụ
  rationale: Nke a na-egosi ọrụ na-aga n’ihu ma na-echekwa nkwughachi mgbọrọgwụ dị n’etiti ἐνέργεια na ἐνεργουμένην.
- source_word: ἐν ἐμοὶ
  choice: n’ime m
  rationale: Ọ na-esochi ihe ἐν pụtara kpọmkwem ma na-ahapụ ọdịiche dị n’etiti ike dị n’ime Pọl na ihe a na-arụ site n’aka ya.
- source_word: ἐν δυνάμει
  choice: ji ike
  rationale: Nke a bụ Igbo e ji ekwu okwu nke ọma, ma ọ ka na-edobe echiche δύναμις dị ka ike nke ọrụ ahụ ji arụ ọrụ.
theological_decisions:
- issue: Ihe αὐτοῦ (“ya”) na-ezo aka na ya
  choice: Edobere aha nnọchi “ya” n’akọwaghị ma ọ bụ Chineke ka ọ̀ bụ Kraịst.
  alternative: “ọrụ Chineke” ma ọ bụ “ọrụ Kraịst”
  rationale: Amaokwu a n’onwe ya akpọghị onye aha. Idobe “ya” na-echekwa nghọtahie kwesịrị ekwesị dị n’ihe odide Grik ma ghara ịmanye otu nkọwa okpukpe.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Na-adọgbu onwe m n’ọrụ” na “na-agbasi mbọ ike” na-egosipụta ịdị arọ nke okwu Grik abụọ ahụ n’enweghị okwu ochie ma ọ bụ okwu otu ụka pụrụ iche.
