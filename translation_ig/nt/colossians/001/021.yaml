id: COL.1.21
reference: Colossians 1:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὑμᾶς ποτε ὄντας ἀπηλλοτριωμένους καὶ ἐχθροὺς τῇ διανοίᾳ ἐν τοῖς ἔργοις τοῖς πονηροῖς—
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/021.yaml
  text: And you[a], who once were alienated and hostile in mind in evil deeds—
translation:
  language: ig
  text: Unu kwa,[a] ndị e kewapụrụ n’oge gara aga, bụrụkwa ndị iro n’uche n’ajọ omume—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị iro n’uche, n’ajọ omume.” Okwu Grik ahụ dị mkpụmkpụ; njikọ dị n’etiti ibu iro n’uche na ajọ omume adịghị akọwa nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμᾶς
  choice: Unu onwe unu kwa
  rationale: Na-aga n’ihu n’ahịrịokwu sitere n’amaokwu bu ụzọ ma tinye ndị a na-agwa okwu n’ọrụ ime ka ha na Chineke dịghachi ná mma.
- source_word: ποτε ὄντας
  choice: ndị nọbu
  rationale: Na-egosi ọnọdụ ha nọ na ya n’oge gara aga n’Igbo dị nfe ma kwekọọ n’ike nkọwa nke participle Grik.
- source_word: ἀπηλλοτριωμένους
  choice: n’ọnọdụ nkewapụ
  rationale: Na-egosi ọnọdụ nke ịbụ ndị e kewapụrụ ma ọ bụ ndị mmekọrịta ha na Chineke mebiri, na-agbakwụnyeghị onye mere nkewapụ ahụ.
- source_word: ἐχθροὺς
  choice: ndị iro
  rationale: Na-edobe aha Grik ahụ n’ụzọ kwụ ọtọ, kama ịgbanwe ya kpamkpam ka ọ bụrụ naanị mmetụta nke ibu iro.
- source_word: τῇ διανοίᾳ
  choice: n’uche
  rationale: Na-egosi ebe ma ọ bụ akụkụ ibu iro ahụ metụtara—echiche na nghọta mmadụ.
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: n’ime ajọ omume unu
  rationale: 'Na-edobe preposition ἐν na mgbagwoju anya ya: ajọ omume ndị ahụ nwere ike ịbụ ebe e gosipụtara ibu iro ahụ ma ọ bụ akụkụ ọnọdụ ahụ, n’enweghị ikwu hoo haa na ha bụ ihe kpatara ya.'
- source_word: ἔργοις
  choice: omume
  rationale: ‘Omume’ bụ okwu Igbo nkịtị ma doo anya maka ihe mmadụ na-eme n’ebe a.
- source_word: πονηροῖς
  choice: ajọ
  rationale: Na-ebuga ike omume ọjọọ nke okwu Grik ahụ n’Igbo dị ugbu a ma dị ùgwù.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ibu iro n’uche na ajọ omume
  choice: ndị iro n’uche n’ime ajọ omume unu
  alternative: ndị bu iro n’uche, na-eme ajọ omume
  rationale: Nhọrọ a na-edobe njikọta Grik ἐν na enweghị nkọwa doro anya ma ajọ omume ahụ bụ ebe e gosipụtara ibu iro ahụ, akụkụ ya, ma ọ bụ ihe metụtara ya; ọ naghị etinye mmekọrịta nke ihe kpatara ihe nke isi mmalite ahụ ekwughị hoo haa.
- issue: Ọnọdụ nkewapụ
  choice: n’ọnọdụ nkewapụ
  alternative: ndị e kewapụrụ
  rationale: Perfect passive participle na-egosi ọnọdụ na-adịgide site n’ihe mere na mbụ, ma onye mere ya apụtaghị ìhè n’amaokwu a; nsụgharị ahụ na-echekwa nke a.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma nwee nghọta nye ndị nkịtị. E ji ‘unu’ gosipụta plural ὑμᾶς. Dash ikpeazụ na-echekwa na ahịrịokwu ahụ gara n’ihu n’amaokwu na-esonụ.
