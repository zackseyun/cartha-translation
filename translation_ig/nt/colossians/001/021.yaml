revisions:
- from: Unu onwe unu kwa,[a] ndị nọbu n’ọnọdụ nkewapụ, bụrụkwa ndị iro n’uche n’ime ajọ omume unu—
  to: Unu kwa,[a] ndị e kewapụrụ n’oge gara aga, bụrụkwa ndị iro n’uche n’ajọ omume—
  rationale: The revision removes unsupported emphasis and possession, restores the passive sense of ἀπηλλοτριωμένους, and retains the compact, ambiguous relationship marked by ἐν. The dash remains because the Greek sentence continues into the following verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:20Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the temporal contrast, alienation, hostility of mind, and the deliberately open relation of ἐν τοῖς ἔργοις τοῖς πονηροῖς. However, “Unu onwe unu” adds an emphatic reflexive element not present in καὶ ὑμᾶς, and “unu” after “ajọ omume” adds a possessive absent from the Greek. “N’ọnọdụ nkewapụ” conveys the state but weakens the passive alienation expressed by ἀπηλλοτριωμένους.
  naturalness: The proposed revision is direct, standard, and appropriately formal Igbo. “Ndị e kewapụrụ n’oge gara aga” gives a natural rendering of the former passive state, while “ndị iro n’uche n’ajọ omume” preserves the Greek’s compressed phrasing and its unresolved syntactic relation.
  terminology: “Ndị e kewapụrụ” preserves alienation without specifying who effected it or adding “from God.” “Ndị iro n’uche” keeps the nominal force of ἐχθρούς. “Ajọ omume” is a suitable contemporary rendering of evil deeds. The footnote is revised to state the alternative without the unnatural expression “ndị bu iro.”
  issues:
  - severity: medium
    issue: Added emphatic reflexive wording
    rationale: “Onwe unu” has no corresponding element in καὶ ὑμᾶς and unnecessarily heightens emphasis.
  - severity: medium
    issue: Added possessive with evil deeds
    rationale: The source says “the evil deeds,” not explicitly “your evil deeds”; the implied possessive should not be made explicit here.
  - severity: low
    issue: Passive force of alienation is diluted
    rationale: “N’ọnọdụ nkewapụ” describes separation as a condition, but “ndị e kewapụrụ” more closely reflects the perfect passive participle while leaving the agent unstated.
  - severity: low
    issue: Footnote alternative is not idiomatic Igbo
    rationale: “Ndị bu iro n’uche” is not a natural way to express the noun “enemies/hostile persons” in this context.
  revised_text: Unu kwa,[a] ndị e kewapụrụ n’oge gara aga, bụrụkwa ndị iro n’uche n’ajọ omume—
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị iro n’uche, n’ajọ omume.” Okwu Grik ahụ dị mkpụmkpụ; njikọ dị n’etiti ibu iro n’uche na ajọ omume adịghị akọwa nke ọma.
    reason: lexical_alternative
  revision_rationale: The revision removes unsupported emphasis and possession, restores the passive sense of ἀπηλλοτριωμένους, and retains the compact, ambiguous relationship marked by ἐν. The dash remains because the Greek sentence continues into the following verse.
