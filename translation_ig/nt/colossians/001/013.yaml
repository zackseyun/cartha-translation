    text: Ma ọ bụ, “alaeze nke Ọkpara nke ịhụnanya ya.”
    reason: lexical_alternative
  revision_rationale: The revision uses idiomatic Standard Igbo for the Son as the object of God's love, while the footnote preserves a closer structural rendering of the Greek genitive for readers who want it. 'Ike ọchịchịrị' more closely reflects ἐξουσία as authority or ruling power than 'ọchịchị nke ọchịchịrị.' The conjunction is rendered without 'ma' so that καί remains a simple coordination rather than suggesting contrast.
