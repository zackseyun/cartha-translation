source:
  edition: SBLGNT
  text: ὃς ἐρρύσατο ἡμᾶς ἐκ τῆς ἐξουσίας τοῦ σκότους καὶ μετέστησεν εἰς τὴν βασιλείαν τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/013.yaml
  text: who rescued us from the authority of darkness and transferred us into the kingdom of the Son of his love,[a]
translation:
  language: ig
  text: onye napụtara anyị n’ike ọchịchịrị ma bufee anyị n’alaeze nke Ọkpara ya ọ hụrụ n’anya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “alaeze nke Ọkpara nke ịhụnanya ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρρύσατο
  choice: napụtara
  rationale: “Ịnapụta” na-egosi ịzọpụta mmadụ n’ihe ize ndụ ma ọ bụ n’aka ike na-achị ya, ma na-edobe echiche nke enyemaka siri ike dị na ῥύομαι.
- source_word: ἐξουσίας
  choice: ọchịchị
  rationale: N’ebe a, “ọchịchị” na-egosi ikike na-achị achị nke ọchịchịrị, ma kwekọọkwa n’oyiyi nke ịbufe mmadụ site n’otu ọchịchị banye n’alaeze ọzọ.
- source_word: σκότους
  choice: ọchịchịrị
  rationale: “Ọchịchịrị” bụ ihe σκότος pụtara ozugbo; a hapụrụ echiche ime mmụọ na nke omume ọ na-ebu ka ọ dị n’ime okwu ahụ n’enweghị nkọwa agbakwunyere.
- source_word: μετέστησεν
  choice: bufee
  rationale: “Bufee” na-egosi iwepụ mmadụ n’otu ọnọdụ ma ọ bụ n’okpuru otu ọchịchị, tinye ya n’ọzọ; nke a dabara na mmegharị e kwuru n’amaokwu ahụ.
- source_word: βασιλείαν
  choice: alaeze
  rationale: “Alaeze” na-egosi ebe Ọkpara na-achị ma na-edobekwa echiche nke ọchịchị ya.
- source_word: υἱοῦ
  choice: Ọkpara
  rationale: “Ọkpara” bụ okwu Igbo kwanyere ùgwù nke na-ezo aka n’Ọkpara pụrụ iche n’akụkụ Akwụkwọ Nsọ a.
- source_word: ἀγάπης
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ ntụgharị kwụ ọtọ nke ἀγάπη.
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: Ọkpara nke ịhụnanya ya
  rationale: A hapụrụ usoro genitive nke Grik ka ọ pụta ìhè n’Igbo, kama ịkọwa ya nanị dị ka “Ọkpara ọ hụrụ n’anya”; ụzọ ndị dị mfe nghọta ka e tinyere n’okpuru amaokwu.
theological_decisions:
- issue: Otú e si sụgharị τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: Ọkpara nke ịhụnanya ya
  alternative: Ọkpara ya ọ hụrụ n’anya; Ọkpara ahụ ọ hụrụ n’anya
  rationale: Nhọrọ bụ isi na-edobe ọdịdị okwu Grik na ihe omimi ya, ebe nhọrọ ndị ọzọ na-akọwa nke ọma na okwu ahụ na-ekwu banyere ịhụnanya Nna nwere n’ebe Ọkpara nọ, n’enweghị itinye ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Ọchịchị nke ọchịchịrị” na “alaeze” na-edobe ọdịiche dị n’etiti ike abụọ ahụ; a hapụrụ “Ọkpara nke ịhụnanya ya” n’ụdị dị nso na Grik, tinyekwa nkọwa ndị ọzọ n’okpuru amaokwu.
