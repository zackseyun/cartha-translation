revisions:
- from: onye napụtara anyị n’ọchịchị nke ọchịchịrị, ma bufee anyị n’alaeze nke Ọkpara nke ịhụnanya ya.[a]
  to: onye napụtara anyị n’ike ọchịchịrị ma bufee anyị n’alaeze nke Ọkpara ya ọ hụrụ n’anya.[a]
  rationale: The revision uses idiomatic Standard Igbo for the Son as the object of God's love, while the footnote preserves a closer structural rendering of the Greek genitive for readers who want it. 'Ike ọchịchịrị' more closely reflects ἐξουσία as authority or ruling power than 'ọchịchị nke ọchịchịrị.' The conjunction is rendered without 'ma' so that καί remains a simple coordination rather than suggesting contrast.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:13Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders ἐρρύσατο ('napụtara anyị'), σκότος ('ọchịchịrị'), μετέστησεν ('bufee anyị'), and βασιλεία ('alaeze'). However, 'ọchịchị nke ọchịchịrị' primarily denotes a government or rule, whereas ἐξουσία more directly denotes authority/ruling power. The Greek genitive phrase is faithfully represented in sense by 'Ọkpara ya ọ hụrụ n’anya'; a literal calque, 'Ọkpara nke ịhụnanya ya,' is not natural Igbo and is liable to be understood as 'the Son belonging to his love,' rather than the Son loved by him.
  naturalness: The sentence is otherwise clear and uses contemporary Standard Igbo. 'Onye napụtara anyị...' is appropriately connected to the preceding relative clause context. Replacing the opaque genitive calque with an idiomatic possessive-relative expression gives the intended sense plainly without adding interpretation.
  terminology: Use 'ikike ọchịchịrị' for ἐξουσία, retaining its sense of governing authority. 'Alaeze' and the reverential title 'Ọkpara' are suitable in this biblical register. 'Ọkpara ya ọ hụrụ n’anya' is idiomatic and accurately expresses τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ. The alternative 'Ọkpara ahụ ọ hụrụ n’anya' loses the explicit referent of αὐτοῦ ('his') and should not be retained as an equivalent footnote alternative.
  issues:
  - severity: medium
    issue: The main-text phrase 'Ọkpara nke ịhụnanya ya' is an unnatural literalism in Igbo.
    rationale: Although it imitates the Greek genitive form, it does not communicate the idiomatic genitive sense naturally and may obscure that the Son is the one loved by God.
  - severity: low
    issue: '''Ọchịchị nke ọchịchịrị'' is less precise for ἐξουσία.'
    rationale: '''Ikike ọchịchịrị'' more directly conveys the authority or ruling power of darkness, while preserving the source ambiguity between authority and dominion.'
  - severity: low
    issue: The second footnote alternative omits 'ya' ('his').
    rationale: The source explicitly includes αὐτοῦ. A footnote alternative should preserve that possessive relationship.
  revised_text: onye napụtara anyị n’ike ọchịchịrị ma bufee anyị n’alaeze nke Ọkpara ya ọ hụrụ n’anya.[a]
  revised_footnotes:
