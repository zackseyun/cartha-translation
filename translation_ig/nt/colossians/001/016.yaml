id: COL.1.16
reference: Colossians 1:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: ig
  text: 'N’ihi na e kere ihe niile n’ime ya[a]: ihe ndị dị n’eluigwe na n’ụwa[b], ihe ndị a na-ahụ anya na ihe ndị a na-adịghị ahụ anya, ma hà bụ ocheeze, ma ọ bụ ọchịchị[c], ma ọ bụ ndịisi, ma ọ bụ ikike; e keela ihe niile site n’aka ya, nakwa maka ya[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi”; okwu a na-enye ihe kpatara nkwupụta bu ya ụzọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’eluigwe na n’ụwa”; n’asụsụ Grik, okwu e ji dee “eluigwe” dị n’ụdị ọtụtụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ọchịchị-nwe”; o yikarịrị ka okwu ndị a na-ezo aka n’ọkwa dị iche iche nke ikike e kere eke.
    reason: lexical_alternative
  - marker: d
    text: N’ụzọ nkịtị karịa, “gaa n’ebe ya nọ”; “maka ya” na-egosi na ya bụ ebumnuche nke okike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-egosi ihe kpatara okwu bu ya ụzọ ji bụrụ eziokwu, ma bụrụkwa ụzọ Igbo dị ebumpụta ụwa si webata ihe akaebe ahụ.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: E debere echiche preposition ἐν dị iche na δι’ αὐτοῦ nke na-abịa n’ikpeazụ; a tụgharịghị ya naanị ka ọ bụrụ ‘site n’aka ya.’
- source_word: ἐκτίσθη / ἔκτισται
  choice: e kere / e sila ... kee
  rationale: ‘Ike’ na-egosi ime ka ihe dịrị, ebe usoro abụọ ahụ na-edobe ọdịiche dị n’etiti aorist na perfect n’ụzọ Igbo na-ada nke ọma.
- source_word: τὰ πάντα
  choice: ihe niile
  rationale: Ọ bụ okwu Igbo doro anya nke na-egosipụta oke ihe niile e kere eke n’enweghị nkọwa agbakwunyere.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: ihe ndị dị n’eluigwe
  rationale: ‘Eluigwe’ bụ okwu Igbo a na-ejikarị ekwu mpaghara eluigwe; ndetu na-eme ka o doo anya na Grik ji ụdị ọtụtụ.
- source_word: ἐπὶ τῆς γῆς
  choice: ihe ndị dị n’elu ụwa
  rationale: Ọ na-enye njikọ ebumpụta ụwa na ‘ihe ndị dị n’eluigwe’ ma na-egosipụta ebe ha dị.
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: ihe ndị a na-ahụ anya na ihe ndị a na-adịghị ahụ anya
  rationale: Nke a bụ Igbo doro anya ma na-edobe ọdịiche ahụ n’etinyeghị nkọwa banyere ụdị ihe ndị a.
- source_word: θρόνοι
  choice: ocheeze
  rationale: A hapụrụ ihe oyiyi okwu Grik ahụ kpọmkwem, n’ihi na ọ pụrụ ịpụta ọkwa ma ọ bụ ikike dị elu.
- source_word: κυριότητες
  choice: ndị na-achị achị
  rationale: Ọ na-ekwupụta echiche nke ịchị n’Igbo a na-aghọta taa, n’etinyeghị aha teknụzụ ma ọ bụ ozizi pụrụ iche.
- source_word: ἀρχαὶ
  choice: ndị ọchịchị
  rationale: Ọ na-egosi ndị ma ọ bụ ikike na-achị, ma na-anwa idowe ya iche na κυριότητες na ἐξουσίαι.
- source_word: ἐξουσίαι
  choice: ndị nwere ikike
  rationale: Ọ na-edobe isi echiche nke ikike e nyere ma na-ada nke ọma n’Igbo.
- source_word: δι’ αὐτοῦ
  choice: site n’aka ya
  rationale: Ọ na-egosi na ọ bụ site n’aka ya ka e si kee ihe niile, ma na-edobe ya iche na ‘n’ime ya.’
- source_word: εἰς αὐτόν
  choice: maka ya
  rationale: Ọ na-egosi na ya bụ ebumnuche ma ọ bụ njedebe nke ihe e kere eke; ndetu na-enye ntụgharị nkịtị karịa, ‘ịgakwuru ya.’
theological_decisions:
- issue: Mmekọrịta nke Ọkpara na okike n’okwu ἐν αὐτῷ / δι’ αὐτοῦ / εἰς αὐτόν
  choice: n’ime ya ... site n’aka ya ... maka ya
  alternative: site n’aka ya ... site n’aka ya ... ịgakwuru ya
  rationale: E debere preposition atọ ahụ iche iche ka e ghara ịgwakọta echiche nke ọnọdụ ma ọ bụ mpaghara, ụzọ e si mee ya, na ebumnuche ya.
- issue: Ụdị ‘ocheeze ... ndị na-achị achị ... ndị ọchịchị ... ndị nwere ikike’
  choice: A hapụrụ ha dịka ọkwa ma ọ bụ ndị nwere ikike n’etinyeghị ụdị ha kpọmkwem.
  alternative: Ịkpọ ha ndị mmụọ ozi naanị ma ọ bụ ọchịchị mmadụ naanị
  rationale: Amaokwu a anaghị ekpebi kpọmkwem ma ha bụ ikike ime mmụọ, nke ụwa, ma ọ bụ ụdị abụọ ahụ; ntụgharị ahụ anaghị etinye nkọwa ozizi karịa ihe ederede kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A haziri ahịrịokwu ahụ dịka otu ahịrịokwu jikọrọ ọnụ, jiri semicolon kewaa nkwupụta nke abụọ. E zere okwu ụka pụrụ iche na nkọwa na-ekpebi ụdị ikike ndị e depụtara.
