revisions:
- from: N’ihi na e kere ihe niile n’ime ya[a], ihe ndị dị n’eluigwe na ihe ndị dị n’elu ụwa[b], ihe ndị a na-ahụ anya na ihe ndị a na-adịghị ahụ anya, ma hà bụ ocheeze, ma ọ bụ ndị na-achị achị[c], ma ọ bụ ndị ọchịchị, ma ọ bụ ndị nwere ikike; e sila n’aka ya kee ihe niile, keekwa ha maka ya[d].
  to: 'N’ihi na e kere ihe niile n’ime ya[a]: ihe ndị dị n’eluigwe na n’ụwa[b], ihe ndị a na-ahụ anya na ihe ndị a na-adịghị ahụ anya, ma hà bụ ocheeze, ma ọ bụ ọchịchị[c], ma ọ bụ ndịisi, ma ọ bụ ikike; e keela ihe niile site n’aka ya, nakwa maka ya[d].'
  rationale: The text is revised to correct the earth-location phrase, distinguish the aorist and perfect creation verbs in natural Igbo, and make the authority categories parallel while retaining their unspecified scope. The footnotes are retained at their anchors but made meaningful and idiomatic; none imposes a particular theological identification of the listed powers.
