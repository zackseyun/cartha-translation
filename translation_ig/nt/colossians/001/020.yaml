id: COL.1.20
reference: Colossians 1:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ δι’ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, ⸂[δι’ αὐτοῦ]⸃ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ⸀ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: ig
  text: Ọ bụkwa site na ya ka Chineke si mee ka ihe niile dịghachi ná mma n’onwe ya[a][b], site n’ọbara obe ya mee udo—site na ya[c]—ma ihe ndị dị n’ụwa ma ihe ndị dị n’eluigwe.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’aka ya”; nke a nwere ike ịdị maka ugboro abụọ okwu ahụ “site na ya” pụtara.
    reason: lexical_alternative
  - marker: b
    text: A hapụrụ “ihe niile” ka ọ sara mbara dịka o siri dị n’asụsụ Grik nakwa n’okwu so ya, “ma ihe ndị dị n’ụwa ma ihe ndị dị n’eluigwe.” Amaokwu a n’onwe ya akọwaghị otú ịdịghachi ná mma a si metụta nzọpụta ikpeazụ.
    reason: alternative_reading
  - marker: c
    text: Ụfọdụ akwụkwọ aka ochie enweghị nkwughachi nke abụọ, “site na ya.”
    reason: textual_variant
  - marker: d
    text: Okwu Grik a sụgharịrị “n’eluigwe” dị n’ụdị ọtụtụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: site n’aka ya
  rationale: Nkebi a na-egosi ụzọ ma ọ bụ onye e ji rụọ ọrụ ahụ. “Site n’aka ya” bụ Igbo nkịtị ma na-echekwa ọrụ Ọkpara ahụ dị ka onye Chineke si n’aka ya mee ka e nwee ịdịghachi ná mma.
- source_word: ἀποκαταλλάξαι
  choice: mee ka ... na ya dịghachi ná mma
  rationale: Nke a na-egosi ime ka mmekọrịta mebiri emebi laghachi n’udo. Nkebi okwu a doro ndị na-agụ Igbo anya ma ọ naghị etinye okwu “kpamkpam,” nke ga-abụ ịkọwa ihe karịrị ihe Grik kwuru.
- source_word: τὰ πάντα
  choice: ihe niile
  rationale: Ọ na-echekwa obosara okwu Grik ahụ ma kwekọọ n’ihe sochirinụ gbasara ihe dị n’ụwa na ihe dị n’eluigwe.
- source_word: εἰς αὐτόν
  choice: na ya
  rationale: N’usoro ahịrịokwu a, Chineke bụ onye na-eme ka ihe niile na ya dịghachi ná mma site n’aka Ọkpara. “Na ya” na-egosi mmekọrịta a n’Igbo n’enweghị ịgbakwụnye nkọwa okpukpe ọzọ.
- source_word: εἰρηνοποιήσας
  choice: mgbe o ... mee ka udo dị
  rationale: Ọ na-echekwa njikọ dị n’etiti ime udo na ime ka ihe niile dịghachi ná mma, ma na-ada nke ọma n’Igbo.
- source_word: διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ
  choice: site n’ọbara nke ọ wụsịrị n’obe ya
  rationale: Grik kwuru n’ụzọ nkịtị “site n’ọbara nke obe ya.” N’Igbo, ịsị “ọbara nke ọ wụsịrị n’obe ya” na-eme ka njikọ ahụ doo anya ma na-echekwa ma ọbara ma obe, n’enweghị ime ka ha bụrụ naanị okwu “ọnwụ.”
- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: sitekwa n’aka ya
  rationale: E debere nkwughachi ahụ maka ike okwu ya, ma jiri akara rịkọm na akara ogologo kewaa ya dịka nkwughachi na-eweghachi isi okwu.
- source_word: εἴτε ... εἴτε
  choice: ma ... ma
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si egosipụta ụzọ abụọ a kpọkọtara ọnụ.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: ihe ndị dị n’ụwa
  rationale: “Ụwa” dabara na ọdịiche sara mbara dị n’etiti ụwa na eluigwe; ọ bụghị naanị ala otu mba.
- source_word: τὰ ἐν τοῖς οὐρανοῖς
  choice: ihe ndị dị n’eluigwe
  rationale: “Eluigwe” bụ okwu Igbo a na-eji n’ụzọ mkpokọta maka mpaghara eluigwe; ndetu ụkwụ na-akọwa na okwu Grik dị n’ụdị ọtụtụ.
theological_decisions:
- issue: Obosara ịdịghachi ná mma dị na τὰ πάντα
  choice: A sụgharịrị ya “ihe niile” n’enweghị ibelata ihe ọ na-ezo aka na ya ma ọ bụ kwuo na ihe niile ga-enweta nzọpụta ikpeazụ.
  alternative: “Mmadụ niile,” ma ọ bụ ịkọwa ya dịka nzọpụta ikpeazụ nke ihe niile.
  rationale: Okwu Grik sara mbara, ihe sochirinụ kọwakwara ya dịka ihe dị n’ụwa na ihe dị n’eluigwe. Nsụgharị ahụ kwesịrị ịhapụ obosara na esemokwu nkà mmụta okpukpe ahụ dịka ha dị.
- issue: Onye αὐτόν na-ezo aka na ya na εἰς αὐτόν
  choice: A ghọtara ya dịka Chineke na-eme ka ihe niile na ya dịghachi ná mma site n’aka Ọkpara.
  alternative: Kraịst na-eme ka ihe niile na onwe ya dịghachi ná mma.
  rationale: Usoro ahịrịokwu ahụ na-aga n’ihu site n’amaokwu 19, ebe onye na-eme ihe dị ka Chineke, ebe Ọkpara bụ onye e si n’aka ya mee ya. E tinyere “Chineke” iji mee ka isiokwu a ghara ịgbagwoju onye na-agụ Igbo anya.
- issue: Ihe “ọbara nke obe ya” pụtara
  choice: E chekwara okwu ọbara na obe dịka ihe mere n’eziokwu nke nwere nghọta ịchụ àjà.
  alternative: “Ọnwụ ya n’obe.”
  rationale: Grik kpọrọ ma ọbara ma obe aha. Idebe ha abụọ na-echekwa ike okwu ahụ n’enweghị ịmanye otu nkọwa pụrụ iche banyere mgbaghara mmehie.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “dịghachi ná mma” maka reconciliation, “site n’aka ya” maka agency/means, ma chekwaa obosara “ihe niile.” E tinyere “Chineke” dịka isiokwu doro anya n’Igbo n’ihi na isiokwu ahụ sitere n’amaokwu gara aga; nke a na-egbochi mgbagwoju anya n’enweghị ịgbanwe mmekọrịta dị n’etiti Chineke na Ọkpara.
