revisions:
- from: ọ bụkwa site n’aka ya ka Chineke si mee ka ihe niile na ya dịghachi ná mma[a][b]—mgbe o site n’ọbara nke ọ wụsịrị n’obe ya mee ka udo dị—sitekwa n’aka ya,[c] ma ihe ndị dị n’ụwa ma ihe ndị dị n’eluigwe.[d]
  to: Ọ bụkwa site na ya ka Chineke si mee ka ihe niile dịghachi ná mma n’onwe ya[a][b], site n’ọbara obe ya mee udo—site na ya[c]—ma ihe ndị dị n’ụwa ma ihe ndị dị n’eluigwe.[d]
  rationale: The revision removes an unstated action (“he shed”), renders “blood of his cross” directly, clarifies the reflexive εἰς αὐτόν as “n’onwe ya,” and replaces the overly temporal “mgbe” construction. It retains the bracketed second “through him” with its textual-variant note, preserves the broad scope of “all things,” and maintains all footnote anchors and their meanings.
