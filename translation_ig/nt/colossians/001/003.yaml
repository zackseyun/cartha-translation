id: COL.1.3
reference: Colossians 1:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: ig
  text: Anyị na-enye Chineke, bụ́ Nna nke Onyenwe anyị Jizọs, bụ́ Mesaịa ahụ[a], ekele mgbe niile mgbe anyị na-ekpe ekpere maka unu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka a na-asụgharị ya n’ọdịnala, “Jizọs Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: anyị na-enye ... ekele
  rationale: Nke a bụ ụzọ Igbo dị ugwu ma dịkwa eke si kwuo ‘anyị na-ekele/anyị na-enye ekele,’ ma ọ dabara n’okwu ekele dị n’akwụkwọ ozi.
- source_word: θεῷ πατρὶ
  choice: Chineke, bụ́ Nna
  rationale: Aha abụọ a dị n’ọnọdụ nkọwa ibe ha; ‘bụ́ Nna’ na-eme ka o doo anya na ‘Nna’ na-akọwa Chineke, ọ bụghị na ọ bụ onye ọzọ e jikọtara ya na ya.
- source_word: κυρίου
  choice: Onyenwe
  rationale: ‘Onyenwe’ bụ aha nsọpụrụ Igbo kwesịrị ekwesị maka κύριος n’ebe a.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ́ Mesaịa ahụ
  rationale: Χριστός ka bụ aha ọrụ n’ebe a; ‘Mesaịa ahụ’ na-eme ka ihe aha ahụ pụtara pụta ìhè, ebe ntụaka ala peeji na-edebe ụdị ọdịnala ‘Jizọs Kraịst.’
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Ọ na-egosipụta omume ekele ha na-eme mgbe niile, dịka nghọta kachasị mfe nke njikọ okwu Grik a.
- source_word: περὶ ὑμῶν
  choice: maka unu
  rationale: N’ọnọdụ ekpere, ‘maka unu’ na-egosi na ha na-arịọchitere ndị ahụ arịrịọ, ọ bụghị nanị ikwu banyere ha.
- source_word: προσευχόμενοι
  choice: mgbe anyị na-ekpe ekpere
  rationale: Nkebi a na-egosi ihe na-eme n’otu oge na inye ekele; ụdị a bụ Igbo nkịtị ma na-edebe ike nke participle ahụ.
theological_decisions:
- issue: Otú e si asụgharị Χριστός n’okwu ekele Pọl
  choice: Mesaịa ahụ
  alternative: Kraịst
  rationale: ‘Mesaịa’ na-edebe Χριστός dịka aha ọrụ nke Onye E Tere Mmanụ, kama ime ka ọ dị naanị ka akụkụ aha mmadụ. A hapụrụ ‘Jizọs Kraịst’ na ntụaka dịka ụdị ọdịnala a maara nke ọma.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa ugwu. E ji ‘unu’ debe onye nke abụọ n’ụbara. Usoro ahịrịokwu ahụ na-edebe ‘mgbe niile’ n’akụkụ inye ekele, ma na-ahapụ nkebi ekpere dịka ọnọdụ a na-enye ekele n’ime ya.
