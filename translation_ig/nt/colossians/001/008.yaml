  text: ὁ καὶ δηλώσας ἡμῖν τὴν ὑμῶν ἀγάπην ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/008.yaml
  text: and who also made known to us your love in the Spirit[a].
translation:
  language: ig
  text: Onye mekwara ka anyị mara banyere ịhụnanya unu n’ime Mmụọ Nsọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịhụnanya unu n’ime mmụọ,” ya bụ, ịhụnanya ime mmụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: Ọ bụkwa ya mere ka anyị mara
  rationale: Nkọwa ahụ na participle a na-arụ ọrụ dị ka aha, na-ezo aka n’Epafras n’amaokwu bu ụzọ. Usoro a na-asụ Igbo n'ụzọ eke ma na-egosi na ọ bụ ya gwara Pọl na ndị ya na ha nọ banyere ịhụnanya ahụ.
- source_word: καὶ
  choice: kwa
  rationale: ‘Kwa’ na-egosi na nke a bụ ihe ọzọ Epafras mere, ma na-ejikọ amaokwu a na nkọwa dị n’amaokwu bu ụzọ.
- source_word: ἡμῖν
  choice: anyị
  rationale: E tinyere ya n’usoro ‘mere ka anyị mara,’ nke na-egosi ndị a gwara ozi ahụ—Pọl na ndị ya na ha nọ.
- source_word: ἀγάπην
  choice: ịhụnanya
  rationale: ‘Ịhụnanya’ bụ okwu Igbo doro anya ma kwesị ntụkwasị obi maka ἀγάπη n’ebe a.
- source_word: ἐν πνεύματι
  choice: n'ime Mmụọ Nsọ
  rationale: O yikarịrị ka πνεύματι na-ezo aka na Mmụọ Nsọ n’usoro okwu Pọl. Ịgbakwunye ‘Nsọ’ na-eme ka ihe a pụtara doo anya n’Igbo, ebe e debere nghọta ọzọ nke na-adịghị akọwapụta Mmụọ Nsọ kpọmkwem n’ala ala peeji.
theological_decisions:
- issue: Ihe πνεύματι na-ezo aka na ya
  choice: Mmụọ Nsọ bụ ihe o yikarịrị ka okwu ‘n'ime Mmụọ Nsọ’ na-ezo aka na ya.
  alternative: ‘n’ime mmụọ,’ ya bụ, ịhụnanya nke ime mmụọ
  rationale: Nkebiokwu Grik ahụ nwere ike ịpụta Mmụọ Nsọ, ma ọ bụ mmụọ/ọnọdụ ime mmụọ. Isi ederede na-ahọrọ nghọta a na-ahụkarị n’akwụkwọ Pọl, ma ala ala peeji na-echekwa nghọta ọzọ ka a ghara ikpochapụ mgbagwoju anya dị n’isi mmalite.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘Ọ bụkwa ya mere ka anyị mara’ mee ka njikọ ya na Epafras nke amaokwu bu ụzọ doo anya n’ụzọ Igbo si aga nke ọma.
