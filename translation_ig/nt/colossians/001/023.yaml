revisions:
- from: ọ bụrụ n’ezie na unu anọgide n’okwukwe, bụrụ ndị a tọrọ ntọala nke ọma ma guzosie ike, ghara ikwe ka e wepụ unu n’olileanya nke ozi ọma ahụ unu nụrụ, nke a kwusara n’etiti ihe niile e kere eke n’okpuru eluigwe[a]; ọ bụkwa ozi ọma a ka mụ onwe m, bụ Pọl, ghọrọ onye na-eje ozi ya[b].
  to: ọ bụrụ n’ezie na unu anọgide n’okwukwe, bụrụ ndị a tọrọ ntọala nke ọma ma guzosie ike, ka a ghara iwepụ unu n’olileanya nke ozi ọma ahụ unu nụrụ, nke a kwusara n’ime ihe niile e kere eke n’okpuru eluigwe[a], nke mụ onwe m, Pọl, ghọrọ onye na-eje ozi[b].
