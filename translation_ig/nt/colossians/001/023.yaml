review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the emphatic real condition, the plural addressees, faith, the foundation/stability imagery, the hope associated with the gospel, its proclamation, and Paul’s service. Two expressions need adjustment: “ghara ikwe ka e wepụ unu” adds the active idea of permitting, whereas the Greek is a passive participle (“not being moved/shifted”); and the final cleft construction adds emphasis not marked in Greek.'
  naturalness: The register is clear Standard Igbo. Recasting the negative participial phrase as “ka a ghara iwepụ unu” is more idiomatic while retaining the passive sense. A direct relative-clause ending is smoother and avoids the extra emphasis of “ọ bụkwa ... a ka.”
  terminology: “okwukwe,” “a tọrọ ntọala,” “guzosie ike,” “ozi ọma,” and “onye na-eje ozi” are suitable, natural equivalents. “N’ime ihe niile e kere eke” more directly reflects ἐν πάσῃ κτίσει than “n’etiti.”
  issues:
  - severity: medium
    issue: The phrase “ghara ikwe ka e wepụ unu” introduces permission/allowing.
    rationale: μὴ μετακινούμενοι is passive and describes their not being shifted from the gospel’s hope; it does not explicitly say that they must not permit someone to shift them.
  - severity: low
    issue: “n’etiti ihe niile e kere eke” is less direct than the Greek locative expression.
    rationale: ἐν πάσῃ κτίσει is best represented by “n’ime ihe niile e kere eke”; “n’etiti” can suggest merely ‘among’ created things.
  - severity: low
    issue: The final cleft, “ọ bụkwa ozi ọma a ka ...,” supplies contrastive emphasis.
    rationale: The Greek simply identifies the gospel as that of which Paul became a διάκονος. A relative-clause rendering is closer and more restrained.
  revised_text: ọ bụrụ n’ezie na unu anọgide n’okwukwe, bụrụ ndị a tọrọ ntọala nke ọma ma guzosie ike, ka a ghara iwepụ unu n’olileanya nke ozi ọma ahụ unu nụrụ, nke a kwusara n’ime ihe niile e kere eke n’okpuru eluigwe[a], nke mụ onwe m, Pọl, ghọrọ onye na-eje ozi[b].
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nye ihe ọ bụla e kere eke n’okpuru eluigwe.” Okwu Grik κτίσις nwere ike ịpụta “ihe e kere eke” n’ozuzu ya, ma n’ọnọdụ ụfọdụ ọ pụrụ ịpụta “onye ma ọ bụ ihe e kere eke.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “onye ozi.” Okwu Grik διάκονος nwere ike ịpụta onye na-eje ozi, onye ọrụ, ma ọ bụ onye ozi, dabere n’ọnọdụ ya.
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s conditional force and theological openness, while removing added permission language, rendering the locative phrase more directly, and making the concluding relative clause closer to the Greek. Footnote anchors remain attached to the terms they explain.
