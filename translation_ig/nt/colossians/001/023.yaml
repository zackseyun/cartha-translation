id: COL.1.23
reference: Colossians 1:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: ig
  text: ọ bụrụ n’ezie na unu anọgide n’okwukwe, bụrụ ndị a tọrọ ntọala nke ọma ma guzosie ike, ka a ghara iwepụ unu n’olileanya nke ozi ọma ahụ unu nụrụ, nke a kwusara n’ime ihe niile e kere eke n’okpuru eluigwe[a], nke mụ onwe m, Pọl, ghọrọ onye na-eje ozi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nye ihe ọ bụla e kere eke n’okpuru eluigwe.” Okwu Grik κτίσις nwere ike ịpụta “ihe e kere eke” n’ozuzu ya, ma n’ọnọdụ ụfọdụ ọ pụrụ ịpụta “onye ma ọ bụ ihe e kere eke.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “onye ozi.” Okwu Grik διάκονος nwere ike ịpụta onye na-eje ozi, onye ọrụ, ma ọ bụ onye ozi, dabere n’ọnọdụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: ọ bụrụ n’ezie
  rationale: Na-edobe ọnọdụ εἰ na nkwusi ike nke γε, n’enweghị ịgbanwe ya ka ọ bụrụ nkwenye doro anya.
- source_word: ἐπιμένετε τῇ πίστει
  choice: unu anọgide n’okwukwe
  rationale: Na-egosi ịnọgide na-aga n’ihu n’okwukwe; “okwukwe” bụ ntụgharị nkịtị nke πίστις n’ebe a.
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: bụrụ ndị a tọrọ ntọala nke ọma ma guzosie ike
  rationale: “A tọrọ ntọala” na-echekwa ihe atụ nke ntọala na olu nnara nke participle zuru oke; “guzosie ike” na-egosi nkwụsi ike.
- source_word: μὴ μετακινούμενοι
  choice: ghara ikwe ka e wepụ unu
  rationale: Na-echekwa echiche nnara nke ịbụ ndị a na-ewepụ n’ọnọdụ ha, ma bụrụkwa Igbo dị ndụ ma doo anya.
- source_word: ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου
  choice: n’olileanya nke ozi ọma
  rationale: Na-echekwa njikọ genitive n’etiti olileanya na ozi ọma n’agbanyeghị na njikọ ahụ nwere ike ịpụta olileanya ozi ọma na-eweta ma ọ bụ nke metụtara ya.
- source_word: τοῦ κηρυχθέντος
  choice: nke a kwusara
  rationale: Na-egosi nkwusa ozi n’ihu ọha, na-enweghị itinye okwu ụka pụrụ iche na-adịghị mkpa.
- source_word: ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: n’etiti ihe niile e kere eke n’okpuru eluigwe
  rationale: κτίσις nwere ike izo aka n’ihe e kere eke n’ozuzu ya ma ọ bụ n’otu onye/ihe e kere eke; isi ederede na-eji ntụgharị sara mbara nke dabara n’Igbo.
- source_word: διάκονος
  choice: onye na-eje ozi
  rationale: Na-egosi onye ọrụ ma ọ bụ onye na-eje ozi, na-enweghị ịmanye aha ọkwa ụka n’ebe Grik anaghị eme ya hoo haa.
theological_decisions:
- issue: Ike ọnọdụ nke εἴ γε na ịnọgide n’okwukwe
  choice: ọ bụrụ n’ezie na unu anọgide
  alternative: ebe ọ bụ na unu na-anọgide; ma ọ bụrụhaala na unu anọgide
  rationale: Grik na-etinye ọnọdụ nwere nkwusi ike, ma amaokwu a n’onwe ya anaghị ekpebi arụmụka banyere ma onye nwere ike isi na nzọpụta daa ma ọ bụ na a ga-edobe ya n’enweghị ọdịda.
- issue: Ihe πίστις pụtara na τῇ πίστει
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N’usoro okwu a na gburugburu ya, “okwukwe” bụ nhọrọ kachasị kwekọọ, ma a naghị agbanwe ya ka ọ bụrụ nkọwa ozizi sara mbara.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “unu” gosipụta plural nke ἐπιμένετε; e chekwara ihe atụ ntọala na ọnọdụ nke ahịrịokwu ahụ, ma zere okwu nwere ụda otu ụka kpọmkwem.
