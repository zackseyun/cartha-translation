source:
  edition: SBLGNT
  text: τὸ μυστήριον τὸ ἀποκεκρυμμένον ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν,— ⸀νῦν δὲ ἐφανερώθη τοῖς ἁγίοις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/026.yaml
  text: the mystery hidden from the ages and from the generations—but now revealed to his saints[b][a],
translation:
  language: ig
  text: ihe omimi ahụ e zoro ezo kemgbe oge ndị gara aga na kemgbe ọgbọ ndị gara aga—ma ugbu a, e kpugheere ndị nsọ ya[b][a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe nzuzo.” N’akwụkwọ ozi Pọl, “ihe omimi” na-apụtakarị atụmatụ Chineke e zoro na mbụ ma e kpughee ugbu a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ndị ya dị nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: ihe omimi
  rationale: N’akwụkwọ Pọl, okwu a na-ezo aka n’atụmatụ Chineke nke e zoburu ma e kpughere ugbu a; “ihe omimi” na-edobe echiche ahụ n’Igbo dị ugbu a, ọ bụghị naanị ihe nzuzo mmadụ na-ezo.
- source_word: ἀποκεκρυμμένον
  choice: e zoro ezo
  rationale: Nke a na-egosi ihe e zoro na mbụ ma nọgide n’ọnọdụ nke ịbụ ihe zoro ezo; usoro a bụ nke okike ma dokwaa ụda nnara nke Grik.
- source_word: ἀπὸ τῶν αἰώνων
  choice: site n’ọgbọ niile nke oge
  rationale: “Oge” naanị ya nwere ike ghara igosi αἰῶνες dị ka usoro ogologo oge dị iche iche; nkebiokwu a na-edobe echiche nke eras/ages na ἀπό dị ka “site na.”
- source_word: καὶ ἀπὸ τῶν γενεῶν
  choice: na site n’ọgbọ niile nke mmadụ
  rationale: Nke a na-edobe myiri ahịrịokwu Grik ma na-ekewa γενεαί, bụ́ ọgbọ mmadụ, na αἰῶνες, bụ́ usoro oge. “Niile” na Igbo na-eme ka plurals nwere articles bụrụ ihe doro anya n’enweghị ịgbakwunye echiche nke na-adịghị na ya.
- source_word: νῦν δὲ
  choice: ma ugbu a
  rationale: Ọ na-egosipụta nnukwu ntụgharị dị n’etiti izobe ihe n’oge gara aga na ikpughe ya ugbu a.
- source_word: ἐφανερώθη
  choice: e kpugheere ya
  rationale: Nke a na-edobe nnara aorist ahụ ma na-enye ngwaa ahụ ihe nnọchi anya doro anya n’Igbo, ya bụ “ihe omimi ahụ.”
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: ndị nsọ ya
  rationale: “Ndị nsọ” bụ okwu Igbo guzosiri ike maka ndị Chineke doro nsọ; ọ naghị egbochi ya ịbụ naanị ndị a họpụtara n’ọkwa pụrụ iche.
theological_decisions:
- issue: Ihe “ndị nsọ ya” na-ezo aka na ya
  choice: Ndị Chineke doro nsọ, ya bụ obodo ndị kwere ekwe
  alternative: Ndị ya dị nsọ / ndị nke ya
  rationale: N’ojiji Pọl, ἅγιοι na-akpọkarị ndị kwere ekwe niile ndị e kewapụrụ nye Chineke, ọ bụghị naanị otu ìgwè ndị pụrụ iche. A hapụrụ okwu ahụ ka ọ dokwaa ibu okwu okpukpe ya.
- issue: Ụdị “ihe omimi”
  choice: Atụmatụ Chineke e zoburu ma e kpughere ugbu a
  alternative: Ihe nzuzo
  rationale: Ederede ahụ n’onwe ya na-ejikọta μυστήριον na ihe e zoburu ma kpughee ugbu a; a naghị akọwa ya dị ka ihe anwansi ma ọ bụ ihe naanị ndị nwere ihe ọmụma nzuzo maara.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E debere ọdịiche dị n’etiti αἰῶνες (ọgbọ/usoro oge) na γενεαί (ọgbọ mmadụ), yana ntụgharị siri ike nke “ma ugbu a.” Akara nkọwa ụkwụ abụọ pụtara n’ederede bụ isi.
