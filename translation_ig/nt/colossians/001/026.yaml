revisions:
- from: ihe omimi ahụ e zoro ezo site n’ọgbọ niile nke oge na site n’ọgbọ niile nke mmadụ—ma ugbu a, e kpugheere ya ndị nsọ ya[b][a],
  to: ihe omimi ahụ e zoro ezo kemgbe oge ndị gara aga na kemgbe ọgbọ ndị gara aga—ma ugbu a, e kpugheere ndị nsọ ya[b][a],
  rationale: 'The revision removes the unsupported twofold “all,” renders the two Greek temporal plurals in clear parallel Standard Igbo, and preserves the aorist passive sense: the mystery has now been revealed to his saints. It retains “ihe omimi” and “ndị nsọ ya,” while the footnotes provide the stated lexical alternatives in natural Igbo.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:49Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the concealed-and-now-revealed contrast and correctly renders the passive disclosure to God's holy people. However, “niile” (“all”) is supplied twice, although neither πάντων nor an equivalent universal expression occurs in the Greek. The temporal pair αἰώνων / γενεῶν should remain distinct without adding this universal scope.
  naturalness: The proposed revision uses natural Standard Igbo temporal phrasing and removes the slightly cumbersome constructions “ọgbọ niile nke oge” and “ọgbọ niile nke mmadụ.”
  terminology: “Ihe omimi” is an appropriate established rendering for μυστήριον in this Pauline setting, and “ndị nsọ ya” appropriately retains the ecclesial force of τοῖς ἁγίοις αὐτοῦ. The alternative footnotes are retained with corrected natural Igbo wording.
  issues:
  - severity: medium
    issue: “niile” is added to both temporal expressions.
    rationale: The Greek reads “from the ages and from the generations,” not “from all ages and from all generations.” Adding “all” introduces universal scope not explicitly present in the source.
  - severity: low
    issue: The draft’s expressions for ages and generations are overly expanded and awkwardly contrast “time” with “humanity.”
    rationale: “ọgbọ niile nke oge” and “ọgbọ niile nke mmadụ” are understandable, but they add explanatory material and are less idiomatic than a direct temporal rendering that preserves the parallelism.
  - severity: low
    issue: Footnote wording needs minor Standard Igbo normalization.
    rationale: “A pụkwara ịsị” is the natural form here; “n’akwụkwọ ozi Pọl” is more precise than “n’akwụkwọ Pọl.”
  revised_text: ihe omimi ahụ e zoro ezo kemgbe oge ndị gara aga na kemgbe ọgbọ ndị gara aga—ma ugbu a, e kpugheere ndị nsọ ya[b][a],
  revised_footnotes:
