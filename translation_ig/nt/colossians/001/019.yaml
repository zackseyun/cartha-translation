translation:
  language: ig
  text: N’ihi na ọ masịrị ya ka ozuzu niile biri n’ime ya.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta njikọ mmalite ahụ dịka “N’ihi na…” ma ọ bụ “n’ihi nke a.” Okwu Grik ahụ nwere ike ịrụ ọrụ nkọwa n’ụzọ karịrị otu, dịka ihe gbara ya gburugburu si dị.
    reason: lexical_alternative
  - marker: b
    text: 'Ọtụtụ nsụgharị na-akọwa onye a na-akpọghị aha kpọmkwem: “N’ihi na Chineke masịrị ka ozuzu ya niile biri n’ime ya,” ma ọ bụ “N’ihi na Nna masịrị…” Grik anaghị akọwa onye ahụ kpọmkwem.'
    reason: alternative_reading
  - marker: c
    text: A na-aghọtakarị “ozuzu niile” dịka ozuzu nke Chineke; tụlee Ndị Kọlọsi 2:9.
