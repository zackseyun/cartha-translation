lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Njikọ a na-enye ihe kpatara okwu ndị bu ya ụzọ banyere Ọkpara; “N’ihi na” na-egosipụta ọrụ nkọwa a n’Igbo dị mfe nghọta.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Nnọchiaha a na-ezo aka n’Ọkpara a kpọrọ aha n’okwu ndị gbara amaokwu a gburugburu. “N’ime ya” na-edobe okwu Grik n’etinyeghị “Kraịst” ma ọ bụ “Mezaịa” n’amaokwu a.
- source_word: εὐδόκησεν
  choice: ọ dị mma n’anya
  rationale: Akpaalaokwu Igbo a na-egosipụta ezi mmasị ma ọ bụ ọchịchọ dị mma. E ji ya mee ihe n’ụzọ na-adịghị akpọ onye nwere mmasị ahụ aha, dịka Grik na-emeghị ka onye ahụ pụta ìhè.
- source_word: πᾶν τὸ πλήρωμα
  choice: izu ezu niile
  rationale: “Izu ezu niile” na-edobe ike okwu πᾶν na echiche zuru oke nke πλήρωμα, n’agbakwụnyeghị “nke Chineke,” nke a na-aghọta site n’ihe gbara amaokwu ahụ gburugburu ma ọ bụghị okwu e dere kpọmkwem n’ebe a.
- source_word: κατοικῆσαι
  choice: biri
  rationale: “Biri” na-egosipụta ịnọgide n’ebe dịka ebe obibi, ma bụrụ okwu Igbo nkịtị, doro anya ma dịkwa ùgwù.
theological_decisions:
- issue: Onye a na-ekwughị aha ya nke εὐδόκησεν
  choice: E kwughị “Chineke” ma ọ bụ “Nna” kpọmkwem n’ahịrị bụ isi; e ji “ọ dị mma n’anya” hapụ onye ahụ n’ụzọ na-apụtaghị ìhè.
  alternative: N’ihi na Chineke nwere mmasị ka izu ezu ya niile biri n’ime ya; ma ọ bụ, N’ihi na Nna nwere mmasị…
  rationale: Grik ekwughị onye bụ isiokwu nke εὐδόκησεν. Ịtinye “Chineke” ma ọ bụ “Nna” ga-abụ nkọwa a na-ahụkarị, ma ọ ga-eme ka ihe Grik hapụrụ n’ụzọ na-apụtaghị ìhè doo anya karịa isi mmalite ahụ.
- issue: Ihe “izu ezu” na-ezo aka na ya
  choice: E debere “izu ezu niile” n’agbakwụnyeghị “nke Chineke.”
  alternative: izu ezu niile nke Chineke; izu ezu ya niile
  rationale: Ihe gbara amaokwu a gburugburu, karịsịa Ndị Kọlọsi 2:9, na-akwado nghọta na ọ bụ izu ezu nke Chineke. Ma amaokwu a n’onwe ya enweghị okwu “nke Chineke,” ya mere e debere ibu okwu ahụ na-enweghị ịgbasa ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Akpaalaokwu “ọ dị mma n’anya” na-edobe echiche ezi mmasị nke εὐδοκέω ma na-enyekwa ohere ka onye Grik na-ekwughị aha ya ghara ịghọ onye a kpọrọ aha n’amaghị ama. “Izu ezu” na-edobe ibu nkà mmụta okpukpe nke πλήρωμα n’enweghị mgbakwunye nkọwa n’ahịrị bụ isi.
