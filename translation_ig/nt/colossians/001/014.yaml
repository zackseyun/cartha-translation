  rationale: The revision corrects the Igbo syntax for “in whom” while retaining the source’s personal referent, present-tense “we have,” and appositional identification of redemption with forgiveness of sins. The footnote retains the English audit trail’s lexical alternative and cautious explanatory observation in idiomatic Igbo.
