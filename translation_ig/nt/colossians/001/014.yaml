  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν, τὴν ἄφεσιν τῶν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/014.yaml
  text: in whom we have redemption[a], the forgiveness of sins.
translation:
  language: ig
  text: N’ime ya ka anyị nwere mgbapụta[a], ya bụ, mgbaghara mmehie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “mgbapụta” na “mgbaghara” abụọ ahụ dịka “ntọhapụ.” O yiri ka Pọl ji “mgbaghara mmehie” kọwaa ihe mgbapụta a bụ n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Onye ... n’ime ya
  rationale: Nnọchiaha ahụ bụ nke nwoke, otu onye, ma na-ezo aka n’Ọkpara a hụrụ n’anya n’amaokwu gara aga. Nhazi a na-echekwa echiche nke ịnọ n’ime Onye ahụ, kama ịgbanwe ya ka ọ bụrụ nanị ‘site n’aka ya.’
- source_word: ἔχομεν
  choice: anyị nwere
  rationale: Nke a na-egosipụta n’ụzọ dị mfe na ndị kwere ekwe nwere uru a ugbu a, n’etinyeghị nkọwa ọzọ.
- source_word: ἀπολύτρωσιν
  choice: mgbapụta
  rationale: ‘Mgbapụta’ bụ okwu Igbo a na-amakarị maka nnwere onwe e wetara site n’ịkwụ ụgwọ ma ọ bụ site n’omume nzọpụta; ọ na-echekwa ibu okwu ahụ nwere n’ojiji Pọl.
- source_word: ἄφεσιν
  choice: mgbaghara
  rationale: N’ebe a, okwu ahụ na-akọwa ihe mgbapụta ahụ bụ n’ihe gbasara mmehie. ‘Mgbaghara’ bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe n’ọnọdụ omume na okpukpe.
- source_word: τῶν ἁμαρτιῶν
  choice: mmehie
  rationale: Ọ na-egosi ihe a gbaghaara. Igbo anaghị achọ itinye okwu ọzọ kwekọrọ n’ihuaha Grik n’ebe a.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ‘mgbapụta’ na ‘mgbaghara mmehie’
  choice: 'Jiri ‘ya bụ’ gosipụta na nkebi nke abụọ na-akọwakwu okwu nke mbụ: ‘mgbapụta ... ya bụ mgbaghara mmehie.’'
  alternative: ‘mgbapụta, mgbaghara mmehie’ na-enweghị njikọ nkọwa
  rationale: Grik tinyere τὴν ἄφεσιν τῶν ἁμαρτιῶν dị ka nkebi aha na-akọwa τὴν ἀπολύτρωσιν. N’Igbo, ‘ya bụ’ na-eme ka njikọ ahụ doo anya ma ghara ịsị na mgbapụta enweghị ihe ọzọ ọ pụrụ ịgụnye n’ebe ndị ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ‘n’ime ya’ iji chekwaa ọdịdị na echiche mmekọrịta nke ἐν ᾧ; e zere okwu ụka nke otu nzukọ pụrụ iche.
