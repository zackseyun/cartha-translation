id: COL.1.27
reference: Colossians 1:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: ig
  text: Ọ bụ ha ka Chineke họọrọ ime ka ha mata otú akụ̀ na ụba nke ebube dị n’ihe omimi a si dị ukwuu n’etiti ndị mba ọzọ, ya bụ, Mesaịa nọ n’ime unu[a], olileanya nke ebube.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’etiti unu.” Nkebiokwu Grik a nwere ike ịpụta na Mesaịa nọ n’etiti ndị mba ọzọ dịka otu ndị, ma ọ bụ na ọ nọ n’ime ndị kwere ekwe.
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: Ọ bụ ha ka
  rationale: Ọ na-ezo aka n’ebe ndị nsọ a kpọrọ aha n’amaokwu bu ụzọ nọ, ma na-egosi na ọ bụ ha ka Chineke mere ka ha mata ihe ahụ.
- source_word: ἠθέλησεν
  choice: họọrọ
  rationale: Ọ na-egosi mkpebi na ọchịchọ Chineke ji aka ya mee, n’asụsụ Igbo dị mfe ma kwekọọ n’ọnọdụ a.
- source_word: γνωρίσαι
  choice: ime ka ha mata
  rationale: Nke a na-egosipụta kpọmkwem echiche nke ime ka ihe a na-amaghị bụrụ ihe a maara.
- source_word: τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου
  choice: otú akụ̀ na ụba nke ebube dị n’ihe omimi a si dị ukwuu
  rationale: Nsụgharị a na-edobe echiche nke ịdị ukwuu nke ‘akụ̀ na ụba’ na ‘ebube’ dị n’ihe omimi ahụ, ma mee ka okwu Grik ahụ dị mkpụmkpụ bụrụ Igbo nkịtị a na-aghọta.
- source_word: μυστηρίου
  choice: ihe omimi
  rationale: N’ebe a, ọ bụ nzube Chineke nke e zoro ezo na mbụ ma e meela ka a mata ya, ọ bụghị naanị ilu a na-apụghị ịghọta.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: n’etiti ndị mba ọzọ
  rationale: N’ọnọdụ Pọl ji okwu a, ọ na-ezo aka karịsịa ná ndị na-abụghị ndị Juu.
- source_word: ὅ ἐστιν
  choice: ya bụ
  rationale: Ọ na-ewebata nkọwa na-akọwapụta ihe ihe omimi ahụ bụ.
- source_word: Χριστὸς
  choice: Mezaịa
  rationale: Okwu ahụ na-arụ ọrụ dị ka utu aha n’ebe a, ya mere ‘Mezaịa’ na-egosipụta onye ahụ Chineke tere mmanụ.
- source_word: ἐν ὑμῖν
  choice: n’ime unu
  rationale: Nke a na-esochi usoro okwu Grik nke ọma, ma hapụkwa ohere maka nghọta nke ịnọ n’ime ndị kwere ekwe; nkọwa ala peeji na-echekwa nghọta ọzọ nke ịnọ n’etiti ha.
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: olileanya nke ebube
  rationale: Ọ na-echekwa njikọ okwu ahụ dị mkpụmkpụ n’asụsụ Grik, n’enweghị ịkọwa ya naanị dịka olileanya maka ebube ga-abịa.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mezaịa
  alternative: Kraịst
  rationale: N’ahịrịokwu a, Χριστός na-akọwapụta ihe dị n’ihe omimi ahụ ma nwee ike nke utu aha; ‘Mezaịa’ na-eme ka nke a pụta ìhè.
- issue: Ihe ἐν ὑμῖν pụtara
  choice: n’ime unu
  alternative: n’etiti unu
  rationale: Okwu Grik ahụ nwere ike ịpụta ọnụnọ Mezaịa n’ime ndị kwere ekwe ma ọ bụ ọnụnọ ya n’etiti ha dịka otu obodo. E tinyere nke mbụ n’ahịrịokwu, ma debe nke ọzọ na nkọwa ala peeji ka a ghara idozi esemokwu ahụ n’enweghị ihe akaebe zuru ezu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E jigidere mkpụrụokwu Pọl nke ‘akụ̀ na ụba,’ ‘ebube,’ na ‘ihe omimi,’ ma hazie usoro ya ka ọ daa nke ọma n’Igbo.
