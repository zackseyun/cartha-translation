id: COL.1.22
reference: Colossians 1:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νυνὶ δὲ ⸀ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου— παραστῆσαι ὑμᾶς ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους κατενώπιον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/022.yaml
  text: But now he has reconciled you in his body of flesh through death[a], to present you holy and blameless and beyond reproach before him[b],
translation:
  language: ig
  text: Ma ugbu a, e meela ka unu na Chineke dịghachi ná mma n’ahụ anụ ahụ ya, site n’ọnwụ, ka e wee chee unu n’ihu ya dị nsọ, ndị na-enweghị ntụpọ, ndị a na-apụghịkwa ibo ebubo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ma ugbu a, o meela ka unu na Chineke dịghachi ná mma.” Ngwaa Grik dị n’ụdị passive.
    reason: alternative_reading
  - marker: b
    text: “Ndị na-enweghị ntụpọ” nwekwara ike ịbụ “ndị na-enweghị ihe a ga-eji taa ụta.” Okwu Grik ahụ nwekwara ike icheta anụ àjà na-enweghị ntụpọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ma ugbu a
  rationale: Na-egosipụta mgbanwe na-emegide ọnọdụ ha gara aga nke amaokwu 21, n’Igbo dị mfe ma kwekọọ n’ike okwu Grik.
- source_word: ἀποκατηλλάγητε
  choice: o meela ka unu na ya dịghachi ná mma
  rationale: Ọ bụ ngwaa aorist passive; nsụgharị a na-eji onye na-eme ihe nke gbara ya gburugburu doo anya, ma na-edobe echiche na Chineke bụ onye mere ka mmekọrịta ahụ dịghachi ná mma. Ihe odide Grik n’onwe ya bụ passive, nke e debere n’ala ala peeji.
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ
  choice: n’ahụ anụ ahụ ya
  rationale: Na-edobe nkwusi ike na ahụ mmadụ ya nke a pụrụ imetụ aka, n’ebughị echiche nke ‘ọdịdị mmehie’ bata na σάρξ.
- source_word: διὰ τοῦ θανάτου
  choice: site n’ọnwụ
  rationale: Na-egosipụta ụzọ e si mee ka ha na Chineke dịghachi ná mma, ma ọ naghị etinye ‘ọnwụ ya’ ebe Grik kwuru naanị ‘ọnwụ.’
- source_word: παραστῆσαι
  choice: ka o wee chee unu n’ihu ya
  rationale: Na-egosipụta ebumnuche nke ime ka ha dịghachi ná mma na ihe oyiyi nke ime ka mmadụ guzo n’ihu onye ọzọ.
- source_word: ἁγίους
  choice: ndị dị nsọ
  rationale: Ọ bụ okwu Igbo a nabatara nke na-edobe echiche nke ịbụ ndị e kewapụrụ nye Chineke na ịdị ọcha.
- source_word: ἀμώμους
  choice: ndị na-enweghị ntụpọ
  rationale: Na-edobe ma echiche nke enweghị ihe a ga-eji taa ụta ma ndabere asụsụ àjà nke ihe na-enweghị mmerụ ma ọ bụ ntụpọ.
- source_word: ἀνεγκλήτους
  choice: ndị a na-apụghịkwa ibo ebubo
  rationale: 'Na-eme ka ụda ikpe nke okwu ahụ pụta ìhè: ndị a na-enweghị ebubo ziri ezi a pụrụ iweta megide ha.'
- source_word: κατενώπιον αὐτοῦ
  choice: n’ihu ya
  rationale: Na-edobe nnọchiaha Grik n’enweghị ikpebi n’ime isi okwu ma ‘ya’ ọ̀ na-ezo aka na Chineke ka ọ bụ Kraịst.
theological_decisions:
- issue: Onye mere ihe n’ime ngwaa passive ἀποκατηλλάγητε
  choice: 'Tụgharịa ya n’ụdị na-egosi onye na-eme ihe: ‘o meela ka unu na ya dịghachi ná mma,’ ma tinye ụdị passive n’ala ala peeji.'
  alternative: ‘e meela ka unu na ya dịghachi ná mma’
  rationale: Ihe ndị gbara amaokwu ahụ gburugburu na-egosi onye na-eme ihe, ya mere ụdị a bụ Igbo eke. Ma n’ihi na Grik bụ passive ma hapụ onye ahụ n’ime ngwaa ahụ, ala ala peeji na-echekwa ụdị ahụ na mgbagwoju anya ya.
- issue: Ihe σάρξ pụtara n’okwu ‘ahụ anụ ahụ’
  choice: Were ya n’echiche nkịtị nke anụ ahụ mmadụ.
  alternative: ‘ọdịdị mmehie’
  rationale: Ọnwụ e kwuru na-egosi na a na-ekwu maka ahụ mmadụ Kraịst n’ezie; ‘ọdịdị mmehie’ ga-etinye echiche na-adịghị n’ebe a.
- issue: Ọdịiche dị n’etiti ἀμώμους na ἀνεγκλήτους
  choice: ‘ndị na-enweghị ntụpọ’ na ‘ndị a na-apụghịkwa ibo ebubo’
  alternative: ‘ndị na-enweghị ihe a ga-eji taa ụta, ndị a na-enweghịkwa nkọcha’
  rationale: Nhọrọ ahụ na-edobe ọdịiche dị n’etiti ihe oyiyi nke ịdị ọcha/enweghị ntụpọ na asụsụ ikpe nke enweghị ebubo ziri ezi.
- issue: Onye nnọchiaha αὐτοῦ na-ezo aka na ya na κατενώπιον αὐτοῦ
  choice: Debe ya dị ka ‘n’ihu ya.’
  alternative: ‘n’ihu Chineke’ ma ọ bụ ‘n’ihu Kraịst’
  rationale: Grik ji nnọchiaha mee ihe; ịkpọ otu onye aha kpọmkwem ga-ekpebi ihe ederede hapụrụ ka a ghọta site n’ihe ndị gbara ya gburugburu.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ịdịghachi ná mma’ na-ekwupụta reconciliation n’ụzọ eke; ‘ahụ anụ ahụ’ na-edobe nkwusi ike n’ahụ mmadụ n’ezie. E debere akara ala ala peeji [a] na [b] n’isi okwu.
