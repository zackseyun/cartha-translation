id: COL.1.12
reference: Colossians 1:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εὐχαριστοῦντες τῷ πατρὶ τῷ ἱκανώσαντι ⸀ὑμᾶς εἰς τὴν μερίδα τοῦ κλήρου τῶν ἁγίων ἐν τῷ φωτί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/012.yaml
  text: giving thanks to the Father[a], who has qualified you for the share of the inheritance of the saints in the light[b],
translation:
  language: ig
  text: na-enye Nna ekele, onye mere ka unu[a] ruo eru maka òkè n’ihe nketa nke ndị nsọ n’ìhè[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie nwere “anyị” n’ọnọdụ “unu.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “òkè e kenyere ndị nsọ n’ìhè.” Okwu Grik na-akpọlite echiche nke ihe nketa e ji nza kee ma kenye mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: na-enye ... ekele
  rationale: Ọ bụ participle dị na present tense nke na-egosi omume na-aga n’ihu ma na-ejikọta amaokwu a na ihe bu ya ụzọ. Usoro a bụ Igbo kwụ ọtọ ma dị mfe nghọta.
- source_word: τῷ πατρὶ
  choice: Nna
  rationale: Asụsụ Grik kwuru kpọmkwem “Nna”; etinyeghị “Chineke” n’ihi na ọ dịghị n’okwu amaokwu a.
- source_word: ἱκανώσαντι
  choice: onye mere ka ... ruo eru
  rationale: Nke a na-egosipụta ihe ἱκανόω pụtara, ya bụ ime ka mmadụ tozuo ma ọ bụ ruo eru, ọ bụghị nanị inye ya ikike.
- source_word: ὑμᾶς
  choice: unu
  rationale: A gbasoro ọgụgụ SBLGNT, ὑμᾶς, nke bụ onye nke abụọ n’ọnụọgụ ọtụtụ. E debere ọgụgụ ọzọ “anyị” n’okpuru amaokwu.
- source_word: εἰς τὴν μερίδα τοῦ κλήρου
  choice: inweta òkè n’ihe nketa
  rationale: “Òkè” na “ihe nketa” jikọtara echiche μερίς na κλῆρος n’Igbo dị ire, ma na-echekwa echiche nke iketa ihe e kenyere mmadụ.
- source_word: τῶν ἁγίων
  choice: nke ndị nsọ
  rationale: “Ndị nsọ” bụ ụzọ dị nkenke ma bụrụkwa okwu a maara nke ọma maka ndị Chineke doro nsọ; ọ naghị atụkwasị echiche nke otu ụka pụrụ iche.
- source_word: ἐν τῷ φωτί
  choice: n’ime ìhè
  rationale: Nke a na-echekwa ihe atụ na nghọta ime mmụọ nke okwu Grik ahụ n’akọwaghị ya karịa ihe odide ahụ kwuru.
theological_decisions:
- issue: Ọgụgụ dị iche n’aha nnọchi nke bụ ihe ἱκανώσαντι na-emetụta
  choice: unu
  alternative: anyị
  rationale: Ihe odide SBLGNT e nyere nwere ὑμᾶς (“unu”), ya mere ọ bụ ya dị n’ahịrị isi. E gosiri ἡμᾶς (“anyị”), nke dị n’ụfọdụ akwụkwọ aka ochie, n’okpuru amaokwu ka a ghara izochi ọdịiche ahụ.
- issue: Mmekọrịta “n’ime ìhè” na okwu ndị bu ya ụzọ
  choice: E debere ya n’isi njedebe dịka n’asụsụ Grik
  alternative: Ịkọwa ya kpọmkwem dịka ihe na-akọwa naanị “ndị nsọ” ma ọ bụ naanị “ihe nketa”
  rationale: Nhazi Grik nwere ike ikwe ka a ghọta njikọ ahụ n’ụzọ karịrị otu. Nsụgharị ahụ echekwala ohere nghọta a kama ikpebi ya n’enweghị ihe doro anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “Nna,” “ndị nsọ,” “ihe nketa,” na “ìhè” iji debe okwu na ihe atụ ndị bụ isi n’asụsụ Grik. E tinyere akara [a] n’ebe “unu” dị n’ihi na ọ bụ pronoun ahụ ka ọdịiche akwụkwọ aka ochie metụtara; akara [b] dị n’akụkụ ahịrịokwu ọ na-akọwa.
