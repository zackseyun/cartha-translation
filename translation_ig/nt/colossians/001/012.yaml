    reason: lexical_alternative
  revision_rationale: The revision removes the added explicit notion of receiving while preserving the sense that the Father has made the readers fit for their allotted share in the inheritance. It also uses the more natural Standard Igbo phrase “n’ìhè.” The textual-variant note remains attached to “unu,” and the lexical note remains attached to the final light phrase, preserving the source ambiguity.
