id: COL.1.2
reference: Colossians 1:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῖς ἐν ⸀Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: ig
  text: 'Nye ụmụnna[b] ndị dị nsọ na ndị kwesịrị ntụkwasị obi[a] n''ime Mesaya[c], ndị nọ na Kọlọsi: Amara dịrị unu na udo sitere na Chineke, Nna anyị.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị kwere ekwe”; okwu Grik πιστοῖς nwere ike ịkọwa ndị kwere ekwe ma ọ bụ ndị kwesịrị ntụkwasị obi.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ “ụmụnne nwoke”; n'ọnọdụ a, o yikarịrị ka Pọl na-agwa ọgbakọ dum okwu, gụnyere ụmụ nwanyị.
    reason: lexical_alternative
  - marker: c
    text: Nsụgharị ọdịnala bụ “n'ime Kraịst.” Aha ọkwá Grik Χριστός pụtara “Mesaya.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: ndị nọ na Kọlọsi
  rationale: Nkebiokwu a na-akọwa ndị a na-edegara akwụkwọ ozi site n'ebe ha nọ. ‘Ndị nọ na Kọlọsi’ bụ Igbo doro anya ma kwekọọ n'echiche ọnọdụ nke ἐν.
- source_word: ἁγίοις
  choice: ndị dị nsọ
  rationale: Nke a na-edobe isi echiche nke ịbụ ndị e doro nsọ nye Chineke, ma ghara itinye echiche pụrụ iche e mesịrị banyere aha ‘ndị nsọ.’
- source_word: πιστοῖς
  choice: ndị kwesịrị ntụkwasị obi
  rationale: πιστός nwere ike ịpụta ndị kwesịrị ntụkwasị obi ma ọ bụ ndị kwere ekwe. Nhọrọ a na-egosipụta àgwà nke iguzosi ike n'okwukwe, ebe e debere ihe ọzọ ọ pụrụ ịpụta n'ala peeji.
- source_word: ἀδελφοῖς
  choice: ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu Igbo ebumpụta ụwa maka ndị otu ezinụlọ ma ọ bụ obodo okwukwe. Ọ na-anọchi anya mmekọrịta ezinụlọ nke okwu Grik ahụ, ma nkọwa ala peeji na-egosi na ụdị okwu Grik ahụ bụ nke nwoke ma o yikarịrị ka ọ gụnyere ụmụ nwanyị.
- source_word: ἐν Χριστῷ
  choice: n'ime Mesaya
  rationale: Χριστός bụ aha ọkwá pụtara Mesaya. ‘N'ime Mesaya’ na-edobe ma aha ọkwá ahụ ma asụsụ Pọl banyere ịdị n'otu na ya.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Ka amara na udo ... bịara unu
  rationale: Grik bụ ekele n'ụdị ahịrịokwu na-enweghị ngwaa. Itinye ‘Ka ... bịara unu’ na-eme ka ọchịchọ ngọzi ahụ bụrụ Igbo ebumpụta ụwa ma na-edobe amara tupu udo.
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: si n'aka Chineke Nna anyị
  rationale: 'Nke a na-agụ πατρὸς ἡμῶν dị ka nkọwa nke θεοῦ: Chineke, bụ́ Nna anyị. Ọ naghị etinye njikọ na-adịghị na Grik.'
theological_decisions:
- issue: Ihe πιστοῖς pụtara
  choice: ndị kwesịrị ntụkwasị obi
  alternative: ndị kwere ekwe
  rationale: Amaokwu ahụ ekpebighị kpamkpam ma okwu ahụ na-emesi ikwere ike ka ọ̀ bụ ikwesị ntụkwasị obi. Isi ederede họọrọ nke ikpeazụ, ma ala peeji na-echekwa nke mbụ.
- issue: Ụdị nwoke nke ἀδελφοῖς na ndị ọ na-ezo aka na ha
  choice: ụmụnna
  alternative: ụmụnne nwoke; ụmụnna nwoke na nwanyị
  rationale: ‘Ụmụnna’ na-asụ Igbo nke ọma ma na-edobe echiche ezinụlọ. Nkọwa ala peeji na-echekwa eziokwu na okwu Grik bụ nke nwoke ma na-akọwa na ndị a na-ekwu okwu banyere ha nwere ike ịbụ ọgbakọ dum, gụnyere ụmụ nwanyị.
- issue: Ịsụgharị Χριστῷ
  choice: Mesaya
  alternative: Kraịst
  rationale: Χριστός ka bụ aha ọkwá n'ebe a. ‘Mesaya’ na-eme ka ihe aha ọkwá ahụ pụtara doo anya; a na-edebe ‘Kraịst’ dị ka nsụgharị ọdịnala n'ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-ada ka mmalite akwụkwọ ozi n'Igbo, ebe a na-edobe usoro echiche Grik, mgbagwoju anya nke πιστοῖς, na aha ọkwá ‘Mesaya.’
