- from: 'Nye ụmụnna[b] ndị dị nsọ na ndị kwesịrị ntụkwasị obi[a] n''ime Mesaya[c], bụ́ ndị nọ na Kọlọsi: Ka amara na udo si n''aka Chineke Nna anyị bịara unu.'
  to: 'Nye ụmụnna[b] ndị dị nsọ na ndị kwesịrị ntụkwasị obi[a] n''ime Mesaya[c], ndị nọ na Kọlọsi: Amara dịrị unu na udo sitere na Chineke, Nna anyị.'
  rationale: The revision retains the draft’s faithful rendering of the recipient description and its lexical and theological alternatives. It replaces the greeting with ‘Amara dịrị unu na udo sitere na Chineke, Nna anyị,’ which is idiomatic Standard Igbo, preserves the benedictory force of the Greek epistolary formula, and renders ἀπὸ θεοῦ directly without adding ‘hand’ or a completed-arrival sense.
