language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦ παρόντος εἰς ὑμᾶς, καθὼς καὶ ἐν παντὶ τῷ ⸀κόσμῳ ἐστὶν καρποφορούμενον καὶ αὐξανόμενον καθὼς καὶ ἐν ὑμῖν, ἀφ’ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε τὴν χάριν τοῦ θεοῦ ἐν ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/006.yaml
  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: ig
  text: nke bịakwutere unu[a], dị nnọọ ka ọ na-amị mkpụrụ ma na-eto n’ụwa niile[b], otu ahụkwa ka ọ na-amị mkpụrụ ma na-eto n’etiti unu[c], malite n’ụbọchị unu nụrụ ma mata amara Chineke n’eziokwu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke nọnyere unu,” ma ọ bụ, “nke bịarutere n’etiti unu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’akụkụ niile nke ụwa.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n’ime unu.” Grik ahụ nwere ike izo aka n’ọgbakọ ahụ dịka otu ìgwè ma ọ bụ n’ọrụ ozi ọma na-arụ n’ime ha.
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “n’ezie,” ma ọ bụ, “n’ime eziokwu ahụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: nke bịakwutere unu
  rationale: Nkebi a na-aga n’ihu ịkọwa ozi ọma e kwuru na amaokwu nke 5. “Bịakwutere unu” na-egosi ma ọbịbịa ya ma iru ya n’etiti ndị Kọlọsi n’Igbo dị mfe ma kwekọọ n’echiche πάρειμι n’ebe a.
- source_word: καθὼς καὶ ἐν παντὶ τῷ κόσμῳ
  choice: Dị nnọọ ka ... n’ụwa niile
  rationale: Nke a na-edobe ntụnyere καθὼς καὶ na okwu sara mbara nke κόσμος, n’ebughị ụzọ kọwaa ya dịka akụkụ ụwa niile n’ụzọ siri ike.
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: ọ na-amị mkpụrụ ma na-eto
  rationale: Ụdị “na-” abụọ ahụ na-egosi omume na-aga n’ihu, ma na-edobekwa ihe atụ nke ihe ọkụkụ dị na καρποφορέω na αὐξάνω.
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: otu ahụkwa ka ọ na-eme n’etiti unu
  rationale: “N’etiti unu” dabara n’ọgbakọ a na-agwa okwu ma ghara ikpebi na ọ bụ naanị ọrụ ime mmụọ n’ime onye ọ bụla. E tinyere “ọ na-eme” iji mee ka ahịrịokwu Igbo zuo oke, ebe ihe omume ahụ na-ezo aka n’ịmị mkpụrụ na ito.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε
  choice: malite n’ụbọchị unu nụrụ ma mata
  rationale: “Malite n’ụbọchị” na-egosi mmalite oge ahụ; “nụrụ ma mata” na-edobe ihe abụọ mere n’oge gara aga n’emeghị ka ἐπέγνωτε pụta ihe karịrị ihe ọ na-ekwu.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: amara Chineke
  rationale: “Amara Chineke” bụ ụzọ Igbo doro anya ma kwanyere ùgwù isi kwuo genitive Grik a, ma na-edobe ibu okwu ahụ n’ozizi Pọl.
- source_word: ἐν ἀληθείᾳ
  choice: n’eziokwu
  rationale: “N’eziokwu” nwere ike ịpụta ‘n’ezie’ ma ọ bụ ‘n’ime eziokwu,’ ya mere ọ na-ahapụ nghọta Grik ahụ ka ọ ghara ịkpọchi n’otu nkọwa.
theological_decisions:
- issue: Ogologo okwu “n’ụwa niile”
  choice: E debere okwu zuru ụwa ọnụ dịka okwu Pọl si dị, dị ka nkọwa sara mbara banyere mgbasa ozi ọma.
  alternative: Ịghọta ya dịka nkwupụta siri ike na ozi ọma eruolarị onye ọ bụla na mpaghara ụwa niile.
  rationale: κόσμος n’ebe a na-egosi mgbasa sara mbara n’ụwa ndị mmadụ bi; nsụgharị ahụ anaghị etinye nkọwa ga-eme ka okwu Pọl dị warara ma ọ bụ sie ike karịa Grik.
- issue: Nghọta ἐν ἀληθείᾳ
  choice: n’eziokwu
  alternative: n’ezie; n’ime eziokwu ahụ
  rationale: Nkebi Grik ahụ nwere ike ịkọwa ụzọ ha si mata amara ahụ ma ọ bụ eziokwu bụ ọnọdụ/ọdịnaya nke ịmata ya. Isi ederede na-edobe ohere abụọ ahụ.
- issue: Ọrụ ozi ọma ἐν ὑμῖν
  choice: n’etiti unu
  alternative: n’ime unu
  rationale: Ọ bụ ọtụtụ mmadụ ka a na-agwa, ya mere ọ pụrụ izo aka n’ọrụ ozi ọma n’ọgbakọ ahụ ma ọ bụ n’ime ha. Isi ederede họọrọ okwu obodo, ebe ndetu ala na-echekwa nghọta nke ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. Ahịrịokwu ahụ na-aga n’ihu site n’amaokwu nke 5, ya mere e ji “nke” malite ya. E debere ihe atụ ịmị mkpụrụ na ito, mmegharị ntụnyere, na mgbagwoju anya dị na ἐν ὑμῖν na ἐν ἀληθείᾳ.
