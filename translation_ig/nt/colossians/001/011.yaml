  text: ἐν πάσῃ δυνάμει δυναμούμενοι κατὰ τὸ κράτος τῆς δόξης αὐτοῦ εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν μετὰ χαρᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/011.yaml
  text: being strengthened with all power[a], according to the might of his glory, for all endurance and patience with joy,
translation:
  language: ig
  text: ka a na-eji ike niile eme ka unu sie ike, dị ka ike nke ebube ya si dị[a], ka unu nwee ntachi obi na ndidi n’ụzọ niile n’ọṅụ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka ike ya dị ebube.” N’asụsụ Grik, okwu ya n’ụzọ nkịtị karị bụ “dị ka ike nke ebube ya si dị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει
  choice: iji ike niile
  rationale: “Iji” na-egosi na ike ahụ bụ ihe e ji eme ka ha sie ike; “niile” na-echekwa oke pụtara na πάσῃ.
- source_word: δυναμούμενοι
  choice: ka a na-eme ka unu sie ike
  rationale: Nke a na-egosi omume na-aga n’ihu nke onye ọzọ na-eme ha, dịka participle passive dị na Grik; a hapụrụ onye na-eme ya n’ezoghị ọnụ dịka isi mmalite si mee.
- source_word: κατὰ τὸ κράτος
  choice: dị ka ike ... si dị
  rationale: “Dị ka ... si dị” na-egosi ụkpụrụ ma ọ bụ ogo nke κατά, ebe “ike” na-eburu echiche nke κράτος banyere ịdị ike dị ukwuu.
- source_word: τῆς δόξης αὐτοῦ
  choice: nke ebube ya
  rationale: Nke a na-echekwa genitive Grik ahụ n’ụzọ dị nso, kama ịgbanwe ya ozugbo ka ọ bụrụ nkọwa adjective.
- source_word: εἰς πᾶσαν ὑπομονὴν
  choice: ka unu nwee ntachi obi ... niile
  rationale: “Ka” na-egosi nzube ma ọ bụ ihe omume ahụ ga-arụpụta; “ntachi obi” na-egosi iguzosi ike n’okpuru ọnwụnwa ma ọ bụ ihe isi ike.
- source_word: μακροθυμίαν
  choice: ndidi
  rationale: “Ndidi” bụ okwu Igbo doro anya ma dị ugbu a maka inwe ogologo ume na ịnagide ndị mmadụ ma ọ bụ ọnọdụ, ma ọ dị iche ntakịrị na “ntachi obi.”
- source_word: μετὰ χαρᾶς
  choice: n’ọṅụ
  rationale: Nke a na-echekwa aha χαρά ma hapụkwa njikọ kpọmkwem nke nkebiokwu ahụ ka ọ nwee ntakịrị mgbagwoju anya dịka ọ dị na Grik.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ime ka ndị kwere ekwe sie ike na ebube Chineke
  choice: “dị ka ike nke ebube ya si dị”
  alternative: “dị ka ike ya dị ebube si dị”
  rationale: Nhọrọ bụ isi na-echekwa usoro okwu Grik nke na-ekwu banyere “ike nke ebube ya,” n’agbanyeghị na nhọrọ ọzọ bụ Igbo dị nro karịa. E tinyeghị nkọwa ozizi karịrị ihe isi mmalite kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. “Ntachi obi” na “ndidi” na-echekwa okwu abụọ Grik yiri ibe ha ma na-adịghị otu ihe kpamkpam. E debere ahịrịokwu a dịka nkebi na-aga n’ihu n’ekpere gbara ya gburugburu.
