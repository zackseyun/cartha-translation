reference: Colossians 1:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: ig
  text: Ọ bụ ya ka anyị na-ekwusa, na-adọ onye ọ bụla aka ná ntị ma na-akụziri onye ọ bụla ihe n’amamihe niile, ka anyị wee chee onye ọ bụla dị ka onye tozuru oke n’ime Kraịst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγγέλλομεν
  choice: anyị na-ekwusa
  rationale: Ọ na-egosi ikwusa ozi n’ihu ọha ma ọ bụ ime ka a mara ya; “na-ekwusa” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: νουθετοῦντες
  choice: na-adọ ... aka ná ntị
  rationale: Okwu a pụtara ịdụ mmadụ ọdụ site n’itinye uche ya n’ihe, ma n’ebe a ọ gụnyere ịdọ aka ná ntị; ntụgharị a na-edobe ike nke okwu ahụ n’Igbo nkịtị.
- source_word: πάντα ἄνθρωπον
  choice: onye ọ bụla
  rationale: Nkwughachi ya ugboro atọ na-ekwusi ike na ozi na ebumnuche a metụtara mmadụ niile n’otu n’otu; e debere nkwughachi ahụ.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: n’amamihe niile
  rationale: Nke a na-edobe oke nke πᾶς n’enweghị imechi ma ọ bụ kọwaa kpọmkwem ma ọ bụ amamihe Chineke, amamihe zuru ezu, ma ọ bụ ụzọ amamihe niile.
- source_word: τέλειον
  choice: onye tozuru oke
  rationale: N’ọnọdụ a, okwu ahụ na-egosi ntozu ma ọ bụ izu oke nke onye nọ n’ime Kraịst; “tozuru oke” na-ezere echiche nke enweghị ntụpọ kpamkpam.
- source_word: ἐν Χριστῷ
  choice: n’ime Kraịst
  rationale: 'Nke a bụ ntụgharị nkịtị nke njikọ Pọl na-akọwa: ọnọdụ ma ọ bụ njikọ onye ahụ na Kraịst.'
theological_decisions:
- issue: Ihe παραστήσωμεν pụtara na onye a ga-eche mmadụ n’ihu ya
  choice: ka anyị wee chee onye ọ bụla n’ihu Chineke
  alternative: ka anyị wee weta onye ọ bụla
  rationale: παρίστημι pụtara iweta ma ọ bụ iche mmadụ n’ihu onye ọzọ. Chineke abụghị okwu e dere kpọmkwem n’ahịrịokwu Grik a, ma ọ bụ onye a na-aghọta n’ọnọdụ ikpeazụ nke ọrụ ozi ahụ. A họọrọ nkọwa a maka Igbo doro anya, n’enweghị ịgbanwe ntozu ‘n’ime Kraịst’ ka ọ bụrụ ntozu n’ihu Chineke.
- issue: Ịtụgharị Χριστός
  choice: Kraịst
  alternative: Mesaya
  rationale: Χριστός bụ aha/utu aha e ji eme ihe n’akwụkwọ ozi Pọl, “Kraịst” bụkwa ụdị Igbo a maara nke ọma. “Mesaya” ga-emesi aha e tere mmanụ ike, ma ọ nwere ike ime ka ụdị okwu Pọl n’ebe a gbanwee.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro atọ nke “onye ọ bụla” iji chekwaa nkwusi ike nke Grik. Enweghị akara nkọwa ụkwụ n’ihi na ọ dịghị nkọwa ụkwụ dị mkpa n’akwụkwọ a.
