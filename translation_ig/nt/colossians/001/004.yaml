- from: mgbe anyị nụrụ banyere okwukwe unu n’ime Mesaịa Jizọs na ịhụnanya unu nwere n’ebe ndị nsọ niile nọ.[a]
  to: ebe anyị nụrụ banyere okwukwe unu n’ime Mesaịa Jizọs na ịhụnanya unu nwere n’ebe ndị nsọ niile nọ,[a]
  rationale: The revision changes only the connector for ἀκούσαντες, preserving its participial link to the preceding verse rather than reading it as a merely temporal ‘when’ clause. The footnote is polished for clear, natural Igbo while retaining the same non-exclusive lexical alternatives.
