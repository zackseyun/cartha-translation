source:
  edition: SBLGNT
  text: ἀκούσαντες τὴν πίστιν ὑμῶν ἐν Χριστῷ Ἰησοῦ καὶ τὴν ἀγάπην ⸂ἣν ἔχετε⸃ εἰς πάντας τοὺς ἁγίους
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/004.yaml
  text: having heard of your faith in Messiah Jesus and the love that you have for all the saints,[a]
translation:
  language: ig
  text: ebe anyị nụrụ banyere okwukwe unu n’ime Mesaịa Jizọs na ịhụnanya unu nwere n’ebe ndị nsọ niile nọ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ntụkwasị obi unu n’ime Mesaịa Jizọs” ma ọ bụ “ikwesị ntụkwasị obi unu n’ime Mesaịa Jizọs.” Okwu Grik bụ πίστις nwere ike ịpụta nghọta ndị a metụtara ibe ha, dabere n’ihe gbara ya gburugburu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες
  choice: mgbe anyị nụrụ banyere
  rationale: Ụdị a na-egosi na ịnụ akụkọ ahụ jikọtara okwu a na ekele na ekpere dị n’ahịrịokwu bu ya ụzọ, ma na-ada nke ọma n’Igbo.
- source_word: πίστιν
  choice: okwukwe
  rationale: “Okwukwe” bụ okwu Igbo a na-ejikarị sụgharị πίστις n’ọnọdụ a; ihe a na-ekwu bụ okwukwe ndị Kọlọsi nke dị n’ime Mesaịa Jizọs. E debere nghọta ndị ọzọ n’ala ala peeji.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaịa Jizọs
  rationale: “N’ime” na-echekwa ụzọ Pọl si ekwu mmekọrịta/ọnọdụ dị na ἐν, ebe “Mesaịa” na-asụgharị Χριστός dị ka utu aha ma na-edebe Jizọs dị ka aha.
- source_word: ἀγάπην
  choice: ịhụnanya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị sụgharị ἀγάπη.
- source_word: ἣν ἔχετε
  choice: unu nwere
  rationale: Nke a na-egosipụta ahịrịokwu njikọ dị na Grik ma na-akọwa ịhụnanya ahụ dị ka ihe ndị na-agụ akwụkwọ nwere ma na-egosipụta.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: n’ebe ndị nsọ niile nọ
  rationale: Ụdị a na-egosi ndị ịhụnanya ahụ chere ihu; “ndị nsọ” na-echekwa aha Pọl ji akpọ ndị kwere ekwe.
theological_decisions:
- issue: Ma a ga-asụgharị Χριστῷ dị ka utu aha ka ọ bụ jiri ụdị yiri aha
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: N’ebe a Χριστός bụ utu aha e jikọrọ ya na aha Jizọs; “Mesaịa” na-eme ka ihe utu aha ahụ pụtara doo anya.
- issue: Nghọta πίστις n’ebe a
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: Ihe gbara okwu ahụ gburugburu na-akwado okwukwe ma ọ bụ ntụkwasị obi ndị Kọlọsi nwere n’ime Mesaịa Jizọs, ma πίστις nwekwara ike ịpụta ikwesị ntụkwasị obi; ya mere e chekwara nghọta ndị ahụ n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A haziri participle Grik ka ọ bụrụ “mgbe anyị nụrụ” iji mee ka njikọ ya na ahịrịokwu bu ụzọ doo anya n’Igbo, na-enweghị ime ka ọ bụrụ ahịrịokwu kwụụrụ onwe ya.
