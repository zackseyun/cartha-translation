id: COL.1.18
reference: Colossians 1:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας· ὅς ⸀ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/018.yaml
  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: ig
  text: Ọ bụkwa isi nke ahụ, ya bụ ụka; ọ bụ mmalite[a], onye mbụ a mụrụ site n’etiti ndị nwụrụ anwụ, ka ya onwe ya wee bụrụ onye nọ n’ọkwá mbụ n’ihe niile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “isi mmalite” ma ọ bụ “onye ọchịchị” n’ọnọdụ “mmalite” (ἀρχή).
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka o nwee ọnọdụ mbụ n’ihe niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: ọ / ya onwe ya
  rationale: N’ahịrịokwu mbụ, “ọ” bụ ụzọ Igbo si ekwu ya nke ọma; n’ahịrịokwu ikpeazụ, “ya onwe ya” na-egosipụta nkwusi okwu dị na nnọchiaha Grik ahụ.
- source_word: κεφαλή
  choice: isi
  rationale: “Isi” na-echekwa ihe atụ nke Kraịst dịka isi nke ahụ, n’akọwaghị ya naanị dịka onye ọchịchị ma ọ bụ isi mmalite.
- source_word: σώματος
  choice: ahụ
  rationale: Nke a bụ okwu Igbo dabara adaba maka ihe atụ nke otu ndị mmadụ dịka otu ahụ, ma ọ na-aga nke ọma na “isi.”
- source_word: ἐκκλησίας
  choice: ụka
  rationale: “Ụka” bụ okwu a maara nke ọma n’Igbo maka ndị kwere ekwe dịka ọgbakọ Kraịst n’ọnọdụ a; ọ bụghị ụlọ ka okwu ahụ na-ezo aka ebe a.
- source_word: ἀρχή
  choice: mmalite
  rationale: “Mmalite” dabara na nkọwa na-esochi ya banyere onye mbụ a mụrụ site n’etiti ndị nwụrụ anwụ, ma ọ ka na-ahapụ ohere maka nghọta ndị ọzọ nke okwu Grik ahụ.
- source_word: πρωτότοκος
  choice: onye mbụ a mụrụ
  rationale: Nkebiokwu a na-echekwa echiche nke ịbụ onye e buru ụzọ mụọ n’emeghị ka okwu ahụ bụrụ naanị ọkwa ma ọ bụ ọchịchị.
- source_word: ἐκ τῶν νεκρῶν
  choice: site n’etiti ndị nwụrụ anwụ
  rationale: “Site n’etiti” na-eme ka ἐκ pụta ìhè ma na-egosi na okwu a metụtara mbilite n’ọnwụ.
- source_word: ἵνα γένηται
  choice: ka … wee bụrụ
  rationale: Usoro a bụ ụzọ Igbo si egosipụta ebumnuche ma ọ bụ ihe si na ya pụta, ma “bụrụ” na-echekwa echiche nke γένηται.
- source_word: ἐν πᾶσιν
  choice: n’ihe niile
  rationale: Nke a na-echekwa obosara nke okwu Grik ahụ, nke nwere ike ịgụnye ihe niile.
- source_word: πρωτεύων
  choice: onye nọ n’ọkwá mbụ
  rationale: Nke a na-ekwupụta n’ụzọ doro anya na nke eke n’Igbo echiche nke ijide ọnọdụ mbụ, n’etinyeghị echiche sara mbara karịa okwu Grik ahụ.
theological_decisions:
- issue: Ihe κεφαλή pụtara n’ihe atụ Kraịst na ahụ
  choice: E debere ihe atụ ahụ dịka “isi,” n’akọwaghị ya naanị dịka ọchịchị ma ọ bụ isi mmalite.
  alternative: “onye na-achị ahụ” ma ọ bụ “isi mmalite nke ahụ”
  rationale: Okwu Grik ahụ nwere ihe atụ bara ụba. “Isi” na-echekwa ya ma ghara idozi arụmụka nkọwa nke amaokwu ahụ n’onwe ya na-edozighị.
- issue: Ihe ἀρχή pụtara n’ihe gbasara mbilite n’ọnwụ na okike ọhụrụ
  choice: mmalite
  alternative: isi mmalite; onye ọchịchị
  rationale: “Mmalite” kwekọrọ nke ọma na “onye mbụ a mụrụ site n’etiti ndị nwụrụ anwụ,” ma nkọwa ala peeji na-echekwa ụzọ ndị ọzọ okwu ahụ nwere ike isi pụta.
- issue: Ike okwu πρωτότοκος ἐκ τῶν νεκρῶν nwere
  choice: E debere ụdị okwu ọmụmụ ahụ dịka “onye mbụ a mụrụ site n’etiti ndị nwụrụ anwụ.”
  alternative: onye mbụ bilitere n’ọnwụ; onye kachasị ndị nwụrụ anwụ elu
  rationale: Nke a na-echekwa njikọ okwu Akwụkwọ Nsọ banyere onye mbụ a mụrụ na ịdị elu ya, ebe ahịrịokwu ikpeazụ na-ekwupụta ọnọdụ mbụ ya nke ọma.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E debere ihe atụ “isi—ahụ,” ma jiri “ya bụ ụka” mee ka o doo anya na “ahụ” ahụ bụ ụka. E tinyere akara ala peeji [a] n’ebe “mmalite” dị, n’ihi na nkọwa ahụ metụtara ἀρχή, ọ bụghị “ahụ.”
