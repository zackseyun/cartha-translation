  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother[b],
translation:
  language: ig
  text: Pọl, onyeozi nke Mesaịa Jizọs[a] site n’uche Chineke, na Timoti, nwanne anyị[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Kraịst Jizọs.” Okwu Grik bụ Χριστός, utu aha nke pụtara “Mesaịa,” ya bụ, Onye E Tere Mmanụ.
    reason: alternative_reading
  - marker: b
    text: N’ụzọ nkịtị, Grik kwuru “nwanne ahụ”; e ji “nwanne anyị” mee ka mmekọrịta ndị kwere ekwe pụta ìhè n’Igbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Pọl
  rationale: Ụdị a bụ nsụgharị mkpụrụokwu aha Παῦλος nke a na-ejikarị eme ihe n’Igbo.
- source_word: ἀπόστολος
  choice: onyeozi
  rationale: “Onyeozi” na-egosi onye e zigara nke nwere ọrụ na ikike pụrụ iche; ọ dabara n’otú Pọl si akọwa ọrụ ya ebe a karịa naanị “onye ozi.”
- source_word: Χριστοῦ Ἰησοῦ
  choice: nke Mesaịa Jizọs
  rationale: Genitive a na-egosi na Pọl bụ onyeozi nke Mesaịa Jizọs, ya bụ, onye o zigara ma bụrụkwa nke ya. “Mesaịa” na-echekwa Χριστός dị ka utu aha, ebe “Jizọs” bụ aha mmadụ.
- source_word: διὰ θελήματος θεοῦ
  choice: site n’uche Chineke
  rationale: Nkebiokwu a na-egosi na ịbụ onyeozi Pọl sitere ná mkpebi na nzube Chineke. “Site n’uche Chineke” bụ Igbo doro anya ma na-echekwa ọrụ διά na genitive.
- source_word: Τιμόθεος
  choice: Timoti
  rationale: Nke a bụ ụdị aha Τιμόθεος a na-ejikarị eme ihe n’Igbo.
- source_word: ὁ ἀδελφὸς
  choice: nwanne anyị
  rationale: Ọ bụ ezie na Grik kwuru kpọmkwem “nwanne ahụ,” n’usoro ekele akwụkwọ ozi a ọ na-akọwa Timoti dị ka nwanne n’ọgbakọ okwukwe. “Nwanne anyị” bụ Igbo eke ma ghara ịgbakwunye nkọwa karịrị ihe gbara okwu ahụ gburugburu.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dị ka utu aha nke Jizọs, ya mere “Mesaịa” na-eme ka ihe utu aha ahụ pụtara pụta ìhè. “Kraịst” bụkwa ụdị ụka maara nke ọma, ma ọ na-adịkarị ka akụkụ aha.
- issue: Mmekọrịta dị na ὁ ἀδελφός
  choice: nwanne anyị
  alternative: nwanne ahụ
  rationale: “Nwanne anyị” na-eme ka mmekọrịta ndị kwere ekwe nke okwu ahụ na-egosi doo anya n’Igbo. Ọ naghị ekwu na Timoti bụ nwanne Pọl n’anụ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. “Onyeozi,” “Mesaịa,” na “uche Chineke” bụ okwu doro anya n’usoro Ndị Kraịst ma na-anọgide nso n’usoro na ihe Grik pụtara. Akara rịkọm ikpeazụ na-egosi na mmalite akwụkwọ ozi ahụ gara n’ihu n’amaokwu na-esonụ.
