id: COL.1.9
reference: Colossians 1:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: ig
  text: N’ihi nke a, anyị kwa, site n’ụbọchị anyị nụrụ, akwụsịbeghị ikpe ekpere maka unu na ịrịọ ka unu jupụta n’ịmata[a] uche ya, n’amamihe na nghọta niile nke ime mmụọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịmata nke ọma” ma ọ bụ “ịmata n’ụzọ miri emi.” Okwu Grik ahụ nwere ike ịpụta ihe karịrị nanị ịmata ihe.
    reason: lexical_alternative
  - marker: b
    text: “Nke ime mmụọ” nwere ike ịpụta na amamihe na nghọta ahụ nwere àgwà ime mmụọ, ma ọ bụ na ọ bụ Mmụọ Nsọ na-enye ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi ihe kpatara ekpere ahụ ma na-ezo aka n’akụkọ banyere okwukwe na ịhụnanya ndị Kọlọsi e kwuru n’amaokwu ndị bu ụzọ.
- source_word: καὶ ἡμεῖς
  choice: anyị onwe anyị kwa
  rationale: “Onwe anyị” na-egosi nrụgide dị na nnọchiaha Grik ahụ, ebe “kwa” na-echekwa echiche nke καί.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: malite n’ụbọchị anyị nụrụ ya
  rationale: Ọ na-egosi ụbọchị ekpere ha na-aga n’ihu malitere. “Ya” na-ezo aka n’ihe ha nụrụ n’amaokwu ndị bu ụzọ n’enweghị ịkọwa ya karịa ihe Grik kwuru.
- source_word: οὐ παυόμεθα
  choice: akwụsịbeghị
  rationale: Ụdị a na-egosi omume malitere n’oge gara aga nke ka na-aga n’ihu ruo ugbu a.
- source_word: ὑπὲρ ὑμῶν
  choice: maka unu
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwu ekpere a na-ekpe maka ọdịmma ndị ọzọ.
- source_word: προσευχόμενοι καὶ αἰτούμενοι
  choice: ikpe ekpere maka unu na ịrịọ
  rationale: 'E debere okwu abụọ ahụ iche: nke mbụ bụ ekpere n’ozuzu ya, nke abụọ bụ arịrịọ kpọmkwem.'
- source_word: ἵνα πληρωθῆτε
  choice: ka e mee ka unu jupụta
  rationale: Ụdị a na-echekwa olu nnabata nke Grik ma hapụ onye na-eme ya ka ọ bụrụ onye a ghọtara n’okwu ahụ, kama ịkpọ aha ya n’ụzọ doro anya.
- source_word: τὴν ἐπίγνωσιν
  choice: n’ịmata
  rationale: “Ịmata” bụ okwu Igbo dị mfe ma doo anya; akara nkọwa na-egosi na okwu Grik ahụ nwekwara ike ịpụta ịmata nke ọma ma ọ bụ nke miri emi.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: uche ya
  rationale: “Uche ya” bụ ụzọ Igbo ebumpụta ụwa si ekwu ihe onye ahụ chọrọ ma ọ bụ kpebie ime.
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: n’amamihe na nghọta ime mmụọ niile
  rationale: Nke a na-echekwa amamihe na nghọta dị ka echiche abụọ jikọrọ ọnụ, ma kwe ka “ime mmụọ” kọwaa ha abụọ n’enweghị ikwubi ma ọ bụ àgwà ime mmụọ ka a na-ekwu, ka ọ bụ ihe Mmụọ Nsọ na-enye.
- source_word: σοφίᾳ
  choice: amamihe
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọwa ikike ikpebi na ime ihe n’ụzọ ziri ezi.
- source_word: συνέσει
  choice: nghọta
  rationale: Ọ na-egosi ikike ịghọta ihe na njikọ dị n’etiti ihe dị iche iche, ma na-adaba nke ọma na “amamihe.”
theological_decisions:
- issue: Ike ma ọ bụ omimi nke ἐπίγνωσις n’ekpere Pọl
  choice: ịmata
  alternative: ịmata nke ọma; ịmata n’ụzọ zuru ezu
  rationale: Okwu Grik ahụ nwere ike ibu echiche nke ịmata nke ọma ma ọ bụ nke miri emi, ma ịtinye “n’ụzọ zuru ezu” n’ahịrị bụ isi nwere ike ime ka e kwuo karịa ihe usoro okwu ahụ chọrọ. Ya mere, e debere nkọwa ahụ n’okpuru.
- issue: Ihe πνευματικῇ na-ezo aka na ya
  choice: ime mmụọ, na-akọwa ma amamihe ma nghọta n’enweghị ịkpọ Mmụọ Nsọ aha kpọmkwem
  alternative: amamihe na nghọta Mmụọ Nsọ na-enye
  rationale: Okwu ahụ nwere ike ịpụta ihe nwere àgwà ime mmụọ ma ọ bụ ihe sitere n’aka Mmụọ Nsọ. Nsụgharị bụ isi hapụrụ ohere abụọ ahụ ka ọ ghara idozi ihe Grik hapụrụ ntakịrị oghe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe usoro ekpere Pọl na-aga n’ihu, ma na-ezere okwu ụka pụrụ iche nke nwere ike imechi nghọta ndị Grik hapụrụ oghe.
