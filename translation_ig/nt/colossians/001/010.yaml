source:
  edition: SBLGNT
  text: ⸀περιπατῆσαι ἀξίως τοῦ κυρίου εἰς πᾶσαν ἀρεσκείαν ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες καὶ αὐξανόμενοι ⸂τῇ ἐπιγνώσει⸃ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/010.yaml
  text: so as to walk worthily of the Lord[a], to all pleasing, bearing fruit in every good work and growing in the knowledge of God[b],
translation:
  language: ig
  text: ka unu wee na-eje ije n'ụzọ kwesịịrị Onyenweanyị, na-eme ihe na-atọ ya ụtọ n'ụzọ niile[a], na-amị mkpụrụ n'ọrụ ọma ọ bụla, na-etowanye n'ịmata Chineke[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “maka ihe nile na-atọ ụtọ.” Asụsụ Grik ekwughị kpọmkwem onye a na-atọ ụtọ, ma ihe ndị gbara okwu a gburugburu na-egosi Onyenweanyị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “na-etowanye n'ịmata Chineke nke ọma.” Okwu Grik a nwere ike izo aka n'ịmata nke miri emi karịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατῆσαι
  choice: ka unu wee na-eje ije
  rationale: E debere ihe atụ nke ‘ije ije’ Pọl ji ekwu banyere ụzọ mmadụ si ebi ndụ; ‘ka unu wee’ na-egosikwa njikọ nzube ya na amaokwu bu ụzọ.
- source_word: ἀξίως τοῦ κυρίου
  choice: n'ụzọ kwesịrị Onyenweanyị
  rationale: Nke a na-egosi ibi ndụ n'ụzọ dabara na Onyenweanyị, ma na-edebe κύριος dị ka ‘Onyenweanyị.’
- source_word: εἰς πᾶσαν ἀρεσκείαν
  choice: na-eme ihe na-atọ ya ụtọ n'ụzọ niile
  rationale: Nke a bụ Igbo doro anya ma dị ndụ maka echiche nke ime ihe na-amasị; ‘ya’ na-ezo aka n'Onyenweanyị dịka okwu gbara ya gburugburu si egosi, ọ bụ ezie na Grik ekwughị onye ahụ kpọmkwem.
- source_word: ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες
  choice: na-amị mkpụrụ n'ọrụ ọma ọ bụla
  rationale: E debere ihe atụ nke ịmị mkpụrụ na oke nkesa nke παντί, ‘ọ bụla.’
- source_word: αὐξανόμενοι τῇ ἐπιγνώσει τοῦ θεοῦ
  choice: na-etokwa n'ịmata Chineke
  rationale: ‘Na-etokwa’ na-aga n'ihu n'ihe atụ nke uto; ‘n'ịmata Chineke’ na-ewere dative ahụ dịka ọnọdụ ma ọ bụ akụkụ uto ahụ metụtara, na-enweghị ime ka nuance nke ἐπίγνωσις bụrụ okwu nkà mmụta okpukpe siri ike.
theological_decisions:
- issue: Onye ihe na-atọ ụtọ na εἰς πᾶσαν ἀρεσκείαν
  choice: E mere onye okwu ahụ na-ezo aka ka ọ pụta ìhè dịka ‘ya,’ ya bụ Onyenweanyị.
  alternative: ‘iji mee ihe niile na-atọ ụtọ,’ na-ahapụ onye a na-atọ ụtọ n'ekwughị ya kpọmkwem.
  rationale: Ọ bụ ezie na Grik enweghị object e dere ede, Onyenweanyị bụ onye okwu gbara ya gburugburu na-egosi. Ịkpọ ya ‘ya’ na-eme ka Igbo bụrụ nke mmadụ na-aghọta ozugbo; nkọwa ala peeji na-echekwa ọdịdị nke Grik.
- issue: Nuance nke ἐπίγνωσις
  choice: ịmata Chineke
  alternative: ịmata Chineke nke ọma / ịmata Chineke n'ụzọ zuru ezu
  rationale: ἐπίγνωσις pụrụ ịpụta ịmata nke ọma ma ọ bụ nke miri emi, mana okwu a n'onwe ya anaghị amanye echiche nke ihe ọmụma zuru oke. E debere nuance ọzọ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ abụọ—ije ije na ịmị mkpụrụ—n'ihi na ha dị mkpa n'usoro echiche Pọl ma bụrụkwa ihe a pụrụ ịghọta n'Igbo. A họọrọ ‘Onyenweanyị’ dịka okwu nkịtị Baịbụl maka κύριος.
