  terminology: “Mezaịa” suitably represents Χριστός as a title, “anụ ahụ” accurately renders σάρξ in this embodied sense, and “ahụ” / “ụka” preserve the σώμα / ἐκκλησία distinction. The only needed correction is to place each note marker at the expression its note explains.
