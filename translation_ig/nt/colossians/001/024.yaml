id: COL.1.24
reference: Colossians 1:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: ig
  text: Ugbu a, ana m aṅụrị ọṅụ n’ahụhụ m na-ata n’ihi unu; n’anụ ahụ m, ana m emeju ihe kọrọ n’ahụhụ Mezaịa[a], n’ihi ahụ ya, nke bụ ụka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị akụkụ a, “ana m emezucha ihe fọdụrụ n’ahụhụ Mezaịa.” Pọl anaghị ekwu na ọrụ mgbapụta Mezaịa ezughị ezu; ọ na-ekwu maka isonye ya n’ahụhụ metụtara Mezaịa na ahụ ya, bụ ụka.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν χαίρω
  choice: Ugbu a, ana m aṅụrị ọṅụ
  rationale: “Ugbu a” na-egosi ọnọdụ Pọl n’oge ahụ, ebe “ana m aṅụrị ọṅụ” na-enye echiche nke omume na ọnọdụ na-aga n’ihu n’Igbo nkịtị.
- source_word: ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν
  choice: n’ahụhụ m na-ata n’ihi unu
  rationale: E tinyere “m na-ata” n’ihi na ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ ahụhụ Pọl; “n’ihi unu” na-echekwa uru ahụhụ ahụ baara ndị a na-agwa okwu.
- source_word: ἀνταναπληρῶ τὰ ὑστερήματα
  choice: ana m emeju ihe kọrọ
  rationale: Nke a na-echekwa ihe atụ nke imeju ihe na-akọghị ezu na ike okwu Grik ahụ, n’etinyeghị nkọwa ga-eme ka esemokwu dị n’okwu ahụ pụọ.
- source_word: τῶν θλίψεων
  choice: n’ahụhụ
  rationale: “Ahụhụ” bụ okwu Igbo doro anya ma saa mbara maka mkpagbu na ihe mgbu; usoro ahịrịokwu ahụ ka na-egosi njikọ ya na Mezaịa.
- source_word: τοῦ Χριστοῦ
  choice: Mezaịa
  rationale: Χριστός na-arụ ọrụ dị ka utu aha n’ebe a. “Mezaịa” na-eme ka echiche nke Onye E Tere Mmanụ pụta ìhè kama ime ka okwu ahụ bụrụ naanị aha mmadụ.
- source_word: ἐν τῇ σαρκί μου
  choice: n’anụ ahụ m
  rationale: Nke a na-egosi ndụ anụ ahụ Pọl na ahụhụ ọ na-ata n’ahụ ya, ọ bụghị “agwa mmehie.”
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: n’ihi ahụ ya
  rationale: “N’ihi” na-egosi na ahụhụ ahụ bụ maka uru ahụ Mezaịa; “ahụ” na-echekwa ihe atụ Pọl ji mee ihe.
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: nke bụ ụka
  rationale: Nkebi ahịrịokwu a na-akọwa kpọmkwem na “ahụ ya” bụ ụka. “Ụka” bụ okwu Standard Igbo a na-aghọta nke ọma maka ọgbakọ ndị kwere ekwe n’ọnọdụ a.
theological_decisions:
- issue: Ihe “ihe kọrọ n’ahụhụ Mezaịa” pụtara
  choice: 'E debere okwu siri ike ahụ n’isi amaokwu dị ka ọ dị: Pọl na-ekwu na ọ na-emeju ihe kọrọ n’ahụhụ Mezaịa n’anụ ahụ ya, maka ụka.'
  alternative: Ịsụgharị ya n’ụzọ ga-ekwu hoo haa na ọ bụ naanị oke ahụhụ ndị na-ejere Mezaịa ozi ga-ata, ma ọ bụ na ahụhụ Pọl na-eme ka ọrụ mgbapụta Mezaịa zuo oke.
  rationale: Grik ahụ nwere esemokwu nkọwa n’ezie, ya mere nsụgharị ahụ ekwesịghị ime ka ọ dị nro. Otú ọ dị, θλίψεις na njikọ ya na “ahụ ya, nke bụ ụka” na-akwado nghọta nke isonye Pọl n’ahụhụ metụtara ozi Mezaịa na ndị ya, ọ bụghị na ọnwụ mgbapụta Mezaịa ezughị ezu.
- issue: Nsụgharị Χριστοῦ
  choice: Mezaịa
  alternative: Kraịst
  rationale: N’ebe a Χριστός nwere ike nke utu aha. “Mezaịa” na-echekwa ihe okwu ahụ pụtara, ebe e nyere “Kraịst” dị ka ụdị ọzọ n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E zere okwu pụrụ iche nke otu ụka. E debere “anụ ahụ,” “ahụ,” na “ụka” iche iji chekwaa ọdịiche dị n’etiti σάρξ, σῶμα, na ἐκκλησία.
