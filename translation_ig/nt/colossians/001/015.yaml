  text: ὅς ἐστιν εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου, πρωτότοκος πάσης κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/015.yaml
  text: He is the image of the invisible God[a], the firstborn of all creation.
translation:
  language: ig
  text: Ọ bụ oyiyi nke Chineke a na-apụghị ịhụ anya, ọkpara nke ihe niile e kere eke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ebe a, “ọkpara” nwere ike igosi ọkwa kacha elu na ikike ihe nketa, ọ bụghị na Ọkpara bụ otu n'ime ihe e kere eke. A pụkwara ịsụgharị akụkụ a, “ọkpara nke na-achị ihe niile e kere eke.” Tulee nkọwa dị n’amaokwu ndị na-esote.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅς ἐστιν
  choice: Ọ bụ
  rationale: Nnọchiaha a na-ezo aka n’Ọkpara ahụ a kpọtụrụ aha n’amaokwu bu ụzọ. “Ọ bụ” na-enye Igbo kwụ ọtọ ma debe ngwaa njikọ dị na Grik.
- source_word: εἰκὼν
  choice: oyiyi
  rationale: “Oyiyi” na-egosi ihe na-anọchi anya ma na-eme ka onye ọzọ pụta ìhè, n’etinyeghị nkọwa karịrị ihe okwu Grik kwuru.
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: Chineke onye a na-apụghị ịhụ anya
  rationale: Nke a na-egosipụta nke ọma na ἀοράτου na-akọwa Chineke, ma bụrụkwa Igbo dị mfe nghọta.
- source_word: πρωτότοκος
  choice: ọkpara
  rationale: “Ọkpara” na-edebe ihe atụ nke onye mbụ a mụrụ, tinyere echiche Akwụkwọ Nsọ banyere ọkwa na ihe nketa, kama ịtụgharị ya ozugbo ka ọ bụrụ naanị “onye kachasị elu.”
- source_word: πάσης κτίσεως
  choice: nke ihe niile e kere eke
  rationale: Nke a na-esochi njikọ genitiv Grik nke ọma ma debe nghọtahie ziri ezi dị n’okwu ahụ, n’agbanyeghị na gburugburu amaokwu ndị na-esote na-akọwa ọkwa Ọkpara n’ebe okike dị.
theological_decisions:
- issue: Ihe πρωτότοκος πάσης κτίσεως pụtara banyere Ọkpara na ihe e kere eke
  choice: ọkpara nke ihe niile e kere eke
  alternative: ọkpara nke na-achị ihe niile e kere eke
  rationale: Isiokwu ahụ na-edebe ụzọ okwu Grik si dị na esemokwu nkọwa ya, kama ịgbakwunye “na-achị” n’ahịrị bụ isi. Ihe “ọkpara” pụtara nwere ike ịgụnye ọkwa na ikike ihe nketa, ọ bụghị naanị onye mbụ n’usoro oge; amaokwu 16–17 na-enyekwu nkọwa banyere mmekọrịta Ọkpara na okike.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Oyiyi” ka ahọrọ kama okwu nwere ike ịpụta naanị onyinyo; “ọkpara” na-edebe ihe atụ na esemokwu nkọwa nke Grik.
