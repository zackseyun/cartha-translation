  text: διὰ τὴν ἐλπίδα τὴν ἀποκειμένην ὑμῖν ἐν τοῖς οὐρανοῖς, ἣν προηκούσατε ἐν τῷ λόγῳ τῆς ἀληθείας τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/005.yaml
  text: because of the hope laid up for you in the heavens[a], which you heard before in the word of truth[d][c][b], the gospel
translation:
  language: ig
  text: N’ihi olileanya ahụ e debere maka unu n’eluigwe,[a] nke unu nụrụ banyere ya na mbụ n’ozi nke eziokwu ahụ, ya bụ oziọma.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a dị n’ụdị plural, “n’eluigwe.” N’Igbo, “eluigwe” anaghị egosi ọdịiche dị n’etiti singular na plural.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “nke unu nụrụ tupu oge ahụ.”
    reason: lexical_alternative
  - marker: c
    text: “Ozi nke eziokwu” nwekwara ike ịbụ “okwu nke eziokwu.” “Oziọma” na-akọwapụta ozi ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: n’ihi olileanya ahụ
  rationale: διά na accusative na-egosi ihe kpatara ya; “n’ihi” na-egosipụta nke a nke ọma. “Olileanya” bụ okwu Igbo a na-ejikarị akọwa ἐλπίς.
- source_word: ἀποκειμένην ὑμῖν
  choice: e debere unu
  rationale: Ọ na-egosi ihe echekwara ma ọ bụ doziri maka uru ha. “E debere unu” na-edobe echiche ahụ n’asụsụ Igbo dị mfe.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: n’eluigwe
  rationale: Ọ bụ ezie na Grik ji plural mee ihe, Standard Igbo na-eji “eluigwe” n’enweghị mgbanwe ọnụ ọgụgụ; ya mere okwu a nwere ike izipụta singular ma ọ bụ plural dịka ọnọdụ siri dị.
- source_word: ἣν προηκούσατε
  choice: nke unu nụrụ banyere ya na mbụ
  rationale: ἣν na-alaghachi kpọmkwem na “olileanya,” ebe προακούω na-egosi ịnụ ihe tupu oge ahụ. “Nụrụ banyere ya” bụ usoro Igbo kwesịrị ekwesị mgbe ihe a na-ekwu maka ya bụ olileanya.
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: n’ozi nke eziokwu ahụ
  rationale: λόγος n’ebe a pụtara okwu ma ọ bụ ozi. “Ozi” na-eme ka ihe ọ pụtara doo ndị na-agụ Igbo anya ma ghara ime ka “okwu” yie naanị otu mkpụrụokwu.
- source_word: τοῦ εὐαγγελίου
  choice: ya bụ oziọma
  rationale: Genitive a na-akọwapụta “ozi nke eziokwu ahụ” site n’apposition. “Ya bụ” na-eme ka njikọ nkọwa ahụ doo anya, “oziọma” bụkwa okwu Baịbụl Igbo a maara nke ọma.
theological_decisions:
- issue: Ihe nnọchiaha ἣν na-ezo aka na ya
  choice: Ọ na-ezo aka kpọmkwem na “olileanya ahụ.”
  alternative: Iwere ya dị ka ihe na-ezo n’ozuzu ya n’oziọma niile.
  rationale: ἣν bụ feminine singular, ya na ἐλπίδα kwekọrọ kpọmkwem. Nsụgharị ahụ na-edobe njikọ ụtọasụsụ Grik ahụ.
- issue: Ụdị plural nke οὐρανοῖς
  choice: Jiri “n’eluigwe” n’ahịrịokwu ma tinye nkọwa ala peeji.
  alternative: Ịgbalị ime plural ahụ pụta ìhè site n’okwu Igbo na-adịghị eke eke.
  rationale: Igbo anaghị egosi singular/plural n’aha a dịka Bekee ma ọ bụ Grik. Nkọwa ala peeji na-echekwa nkọwa gbasara ụdị Grik n’enweghị imebi asụsụ Igbo.
- issue: Njikọ τοῦ εὐαγγελίου na λόγῳ τῆς ἀληθείας
  choice: 'Gụọ “oziọma” dị ka apposition: “ya bụ oziọma.”'
  alternative: Gụọ ya naanị dị ka genitive nke ga-apụta “okwu nke eziokwu nke oziọma.”
  rationale: Apposition kacha kwekọọ na usoro okwu ahụ ma mee ka o doo anya na ozi nke eziokwu ahụ bụ oziọma.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ntụaka nke nnọchiaha ahụ n’olileanya, ma na-eji “ya bụ” mee ka apposition nke oziọma doo anya. E zere imepụta plural na-adịghị eke eke maka “eluigwe.”
