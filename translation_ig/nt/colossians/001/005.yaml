- from: n’ihi olileanya ahụ e debere unu n’eluigwe,[a] nke unu nụrụ banyere ya na mbụ n’ozi nke eziokwu ahụ, ya bụ oziọma.[b][c]
  to: N’ihi olileanya ahụ e debere maka unu n’eluigwe,[a] nke unu nụrụ banyere ya na mbụ n’ozi nke eziokwu ahụ, ya bụ oziọma.[b][c]
  rationale: The revision supplies 'maka' to express the Greek dative ὑμῖν as beneficiary ('for you') and revises the plural note so that it reports the Greek form without suggesting multiple distinct heavens. No change is made to the relative clause’s reference to hope or to the apposition identifying the message of truth as the gospel.
