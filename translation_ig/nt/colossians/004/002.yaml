  text: Τῇ προσευχῇ προσκαρτερεῖτε, γρηγοροῦντες ἐν αὐτῇ ἐν εὐχαριστίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/002.yaml
  text: Devote yourselves to prayer[a], staying alert in it with thanksgiving,
translation:
  language: ig
  text: Nọgidesienụ ike n'ekpere[a], na-amụ anya n'ime ya n'obi ekele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Nọgidesienụ n''ekpere, na-echenụ nche n''ime ya n''obi ekele.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσευχῇ
  choice: n'ekpere
  rationale: Nkọwa okwu a na-egosi ekpere dị ka omume a na-eme mgbe niile, ọ bụghị otu ekpere a kapịrị ọnụ.
- source_word: προσκαρτερεῖτε
  choice: Na-anọgidesienụ ike
  rationale: Iwu dị n'ụdị oge ugbu a na-akpọ ndị na-agụ akwụkwọ ka ha nọgide na-eme ihe a n'esepụghị aka. Nhọrọ a na-egosi ma ntachi obi ma ịdịgide.
- source_word: γρηγοροῦντες
  choice: na-amụ anya
  rationale: Nke a na-egosi otu ha ga-esi nọgide n'ekpere—ha ga-anọ na nche ma lezie anya—na-enweghị ime ka ọ pụta nanị ịnọghị n'ụra.
- source_word: ἐν αὐτῇ
  choice: n'ime ya
  rationale: ‘Ya’ na-alaghachi n'ekpere, dịka nnọchiaha Grik ahụ si mee, ma hapụkwa njikọ ahụ ka ọ pụta ìhè na-enweghị ikwughachi okwu ahụ.
- source_word: ἐν εὐχαριστίᾳ
  choice: na-enwekwa obi ekele
  rationale: Nhọrọ a na-egosi na obi ekele ga-eso ịmụrụ anya na ekpere, ma bụrụkwa Igbo dị mfe ma doo anya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere iwu ahụ n'ụdị ọtụtụ mmadụ, ma chekwaa echiche nke ịnọgide n'ekpere, ịmụrụ anya, na obi ekele.
