source:
  edition: SBLGNT
  text: Ἀσπάζεται ὑμᾶς Ἀρίσταρχος ὁ συναιχμάλωτός μου, καὶ Μᾶρκος ὁ ἀνεψιὸς Βαρναβᾶ (περὶ οὗ ἐλάβετε ἐντολάς, ἐὰν ἔλθῃ πρὸς ὑμᾶς δέξασθε αὐτόν),
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/010.yaml
  text: Aristarchus[a], my fellow prisoner, greets you, and Mark, the cousin of Barnabas (about whom you received instructions—if he comes to you, welcome him)[b],
translation:
  language: ig
  text: 'Arịstakọs, onye mụ na ya nọ n’ụlọ mkpọrọ, na Mak, nwa nwanne Banabas,[a] na-ekele unu. (Unu natara ntụziaka banyere ya: ọ bụrụ na ọ bịakwute unu, nabatanụ ya.)[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a pụtara kpọmkwem “cousin,” ya bụ, onye ya na Banabas bụ ụmụ nwanne nne ma ọ bụ ụmụ nwanne nna; ọ bụghị “nephew.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “naranụ ya.” N’ebe a, ngwaa Grik ahụ nwere echiche nke ịnabata mmadụ nke ọma dị ka ọbịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: na-ekele unu
  rationale: N’akwụkwọ ozi, okwu a na-egosi iziga ekele. “Na-ekele unu” bụ Igbo doro anya ma na-edebe usoro ngwaa nke Grik.
- source_word: συναιχμάλωτός
  choice: onye mụ na ya nọ n’ụlọ mkpọrọ
  rationale: Nke a na-egosipụta onye ya na Pọl bụ onye mkpọrọ, n’Igbo nkịtị ma doo anya, n’etinyeghị “n’ime Kraịst,” nke na-adịghị n’amaokwu a.
- source_word: ἀνεψιὸς
  choice: nwa nwanne
  rationale: ἀνεψιός na Grik Koine pụtara cousin. “Nwa nwanne” bụ ụzọ Igbo nkịtị si akọwa nwa nwoke nke nwanne nne ma ọ bụ nwanne nna, n’agbanyeghị na okwu ahụ nwekwara ike ịchọ nkọwa n’ihi usoro ikwu ndị ikwu n’Igbo.
- source_word: ἐλάβετε ἐντολάς
  choice: unu anatala ntụziaka
  rationale: “Ntụziaka” na-edebe echiche nke nduzi nwere ikike n’ọnọdụ a n’emeghị ka ọ daa ka iwu agha siri ike.
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: ọ bụrụ na ọ bịakwute unu
  rationale: Nke a na-egosipụta ọnọdụ ga-ekwe omume n’ọdịnihu n’ụzọ Igbo dị mfe ma kwekọọ na ἐάν tinyere aorist subjunctive.
- source_word: δέξασθε αὐτόν
  choice: nabatanụ ya
  rationale: N’ọnọdụ ile ọbịa, δέχομαι pụtara ịnabata mmadụ. “Nabatanụ ya” na-egosipụta nke a nke ọma n’Igbo nke oge a.
theological_decisions:
- issue: Ụdị mmekọrịta Pọl na Arịstakọs dị na συναιχμάλωτός μου
  choice: onye mụ na ya nọ n’ụlọ mkpọrọ
  alternative: onye mụ na ya bụ ndị a dọọrọ n’agha n’ime Onyenwe anyị; onye mụ na ya na-arụkọ ọrụ n’ahụhụ
  rationale: Nsụgharị ahụ na-edebe isi echiche nke ịbụ ndị mkpọrọ ọnụ, ma ọ naghị agbakwunye nkọwa ma ọ bụ ozizi na-ekpebi ma okwu ahụ ọ bụ kpọmkwem ka ọ bụ ihe atụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dịkwa mfe nghọta. E kewara ekele nke Arịstakọs na Mak n’ụzọ na-eme ka ahịrịokwu ahụ na-aga nke ọma n’Igbo, ebe akara mkpụrụokwu dị n’ahụ ederede kwekọrọ na ndetu ala peeji.
