revisions:
- from: 'Arịstakọs, onye mụ na ya nọ n’ụlọ mkpọrọ, na-ekele unu; Mak, nwa nwanne Banabas,[a] na-ekelekwa unu. (Unu anatala ntụziaka banyere ya: ọ bụrụ na ọ bịakwute unu, nabatanụ ya.)[b]'
  to: 'Arịstakọs, onye mụ na ya nọ n’ụlọ mkpọrọ, na Mak, nwa nwanne Banabas,[a] na-ekele unu. (Unu natara ntụziaka banyere ya: ọ bụrụ na ọ bịakwute unu, nabatanụ ya.)[b]'
  rationale: The revision corrects the past-time reference to the instructions, aligns the greeting syntax with the Greek coordination, and clarifies the kinship footnote. It retains the draft's clear, modern Standard Igbo and does not add interpretive claims about the nature of Aristarchus's imprisonment.
