  text: Ἐν σοφίᾳ περιπατεῖτε πρὸς τοὺς ἔξω, τὸν καιρὸν ἐξαγοραζόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/005.yaml
  text: Walk in wisdom toward outsiders[b][a], making the most of the time.
translation:
  language: ig
  text: Na-ejenu ije n’amamihe n’ebe ndị nọ n’èzí nọ,[a] na-ejikwa ohere ahụ eme ihe n’ụzọ kasị mma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu a nwere ike izo aka n’ebe a nye ndị na-anọghị n’ọgbakọ ndị kwere ekwe.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “na-azụta oge ahụ”; ihe ọ pụtara bụ iji ohere mee ihe n’ụzọ kasị mma.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν σοφίᾳ
  choice: n’amamihe
  rationale: Ọ na-edobe aha bụ ‘amamihe’ ma na-egosi ụzọ ma ọ bụ ọnọdụ e ji ebi ndụ.
- source_word: περιπατεῖτε
  choice: Na-ejenu ije
  rationale: Ọ na-echekwa ihe atụ Pọl ji ‘ije’ kọwaa omume na ụzọ mmadụ si ebi ndụ; ụdị iwu a bụkwa Igbo doro anya.
- source_word: πρὸς τοὺς ἔξω
  choice: n’ebe ndị nọ n’èzí nọ
  rationale: Ọ na-egosi otú ndị kwere ekwe kwesịrị isi na-akpa àgwà n’ebe ndị na-abụghị ndị otu ha nọ, ma na-echekwa okwu ahụ n’ụdị na-adịghị ekpe ha ikpe.
- source_word: τὸν καιρόν
  choice: ohere unu nwere
  rationale: καιρός n’ebe a pụtara oge kwesịrị ekwesị ma ọ bụ ohere, ọ bụghị naanị oge n’ozuzu; ‘ohere unu nwere’ na-eme ka echiche ahụ doo anya n’Igbo.
- source_word: ἐξαγοραζόμενοι
  choice: na-ejikwa ... eme ihe n’ụzọ kasị mma
  rationale: N’ebe a, okwu ahụ bụ akpaalaokwu nke pụtara iji ohere mee ihe nke ọma, ọ bụghị mgbapụta n’echiche nzọpụta.
theological_decisions:
- issue: Enwere ike ịghọta ἐξαγοραζόμενοι dịka okwu banyere mgbapụta nke okpukpe.
  choice: A sụgharịrị ya dịka iji ohere mee ihe n’ụzọ kasị mma.
  alternative: ‘na-agbapụta oge’ ma ọ bụ ‘na-azụta oge ahụ.’
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi ndụ amamihe n’ebe ndị na-abụghị ndị otu ndị kwere ekwe nọ na iji ohere kwesịrị ekwesị eme ihe; ọ naghị ekwu maka mgbaghara mmehie ma ọ bụ àjà mgbapụta.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ nke ‘ije’ n’isi okwu, ebe a kọwara akpaalaokwu azụmahịa dị na ἐξαγοραζόμενοι n’ụzọ nkịtị ma doo anya; e tinyere ụdị ya kpọmkwem n’okpuru ala.
