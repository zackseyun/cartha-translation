    text: Okwu a nwere ike izo aka n’ebe a nye ndị na-anọghị n’ọgbakọ ndị kwere ekwe.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “na-azụta oge ahụ”; ihe ọ pụtara bụ iji ohere mee ihe n’ụzọ kasị mma.
    reason: lexical_alternative
  revision_rationale: The revision removes the possessive not present in the Greek while retaining the contextual sense of καιρός as opportunity. It also replaces the redundant first note with a concise explanation of the idiomatic social referent of τοὺς ἔξω. The metaphor of walking, the wisdom terminology, and the non-soteriological idiomatic sense of ἐξαγοραζόμενοι are retained.
