id: COL.4.1
reference: Colossians 4:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ κύριοι, τὸ δίκαιον καὶ τὴν ἰσότητα τοῖς δούλοις παρέχεσθε, εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν ⸀οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your servants with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: ig
  text: Unu ndị nna ukwu, nyenụ ndị ohu unu ihe ziri ezi na ịha nhata[a], n’ihi na unu maara na unu onwe unu nwekwara Onyenwe n’eluigwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ziri ezi na omume nkwụmọtọ.” Okwu Grik a sụgharịrị “ịha nhata” nwekwara ike ịpụta “omume nkwụmọtọ” ma ọ bụ “ezi omume n’enweghị ele mmadụ anya n’ihu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι
  choice: unu ndị nna ukwu
  rationale: N’ebe a, okwu ahụ na-akpọ ndị nwere ikike n’ebe ndị ohu nọ okwu. “Ndị nna ukwu” bụ okwu Igbo doro anya ma bụrụ nke a na-aghọta nke ọma n’ọnọdụ a.
- source_word: τὸ δίκαιον
  choice: ihe ziri ezi
  rationale: Nke a na-egosi ihe kwekọrọ n’ikpe ziri ezi na omume ọma, n’asụsụ Igbo dị mfe ma doo anya.
- source_word: τὴν ἰσότητα
  choice: ihe a na-eme n’ụzọ nha anya
  rationale: Ἰσότης nwere ike ịpụta nha anya, ikpe nkwụmọtọ, ma ọ bụ omume na-adịghị ele mmadụ anya n’ihu. Nsụgharị a na-ekwupụta omume kwesịrị ekwesị n’ọnọdụ a ma na-ahapụ “ịha nhata” dị ka ụzọ ọzọ n’ihe odide ala peeji.
- source_word: τοῖς δούλοις
  choice: ndị ohu unu
  rationale: N’usoro mmekọrịta dị n’etiti ndị nna ukwu na ndị nọ n’okpuru ha ebe a, “ndị ohu” na-egosipụta ọnọdụ agbụ ahụ nke ọma, n’adịghị ka okwu dị nro dịka “ndị na-eje ozi.”
- source_word: παρέχεσθε
  choice: na-enye
  rationale: Ụdị iwu a na-akpọ ha ka ha na-enye ndị ohu ha ụdị omume ahụ mgbe niile; “na-enye” bụ Igbo dị ndụ ma kwekọọ n’echiche ahụ.
- source_word: εἰδότες
  choice: ebe unu maara
  rationale: 'Nke a na-echekwa njikọ nke participle ahụ: ihe ọmụma ha banyere Onyenwe dị n’eluigwe bụ ihe na-eso ma na-akwado iwu ahụ.'
- source_word: καὶ ὑμεῖς
  choice: unu onwe unu nwekwara
  rationale: “Onwe unu” na “nwekwara” na-echekwa nkwusi ike na ndị nna ukwu ahụ onwe ha nọkwa n’okpuru ikike onye ọzọ.
- source_word: κύριον
  choice: Onyenwe
  rationale: E ji mkpụrụedemede ukwu gosipụta aha nsọ na ịdị arọ nke κύριος, ma mee ka ọ dị iche n’ebe “ndị nna ukwu” mmadụ nọ.
- source_word: ἐν οὐρανῷ
  choice: n’eluigwe
  rationale: Nke a bụ ụzọ Igbo nkịtị, doro anya e si ekwu okwu banyere ebe eluigwe.
theological_decisions:
- issue: Otu e si asụgharị δοῦλοι n’usoro ezinụlọ oge ochie
  choice: ndị ohu
  alternative: ndị na-eje ozi
  rationale: Ebe e kpọrọ ndị nna ukwu aha kpọmkwem, ọnọdụ ndị ahụ dị ka ndị e ji agbụ ma ọ bụ ndị nwe ha nwere ikike n’ebe ha nọ pụtara ìhè. “Ndị ohu” anaghị ezobe ọnọdụ mmekọrịta ahụ.
- issue: Otu e si asụgharị ἰσότητα
  choice: ihe a na-eme n’ụzọ nha anya
  alternative: ịha nhata
  rationale: Okwu Grik ahụ nwere ike ịpụta nha anya n’onwe ya ma ọ bụ omume ziri ezi na nke nkwụmọtọ. Isi okwu na-eji asụsụ Igbo dị mfe egosi omume nha anya, ebe ihe odide ala peeji na-echekwa ụzọ ọzọ nke kpọmkwem karị.
- issue: Njikọ dị n’etiti κύριοι mmadụ na κύριον nke eluigwe
  choice: ndị nna ukwu … Onyenwe
  alternative: ndị nwe … Nna Ukwu
  rationale: Nhọrọ a na-echekwa egwuregwu echiche ahụ—ndị nwere ikike n’ụwa nwekwara Onye nwere ikike n’ebe ha nọ—ma na-egosikwa ịdị nsọ na ịdị elu nke Onyenwe dị n’eluigwe.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ndị ohu” mee ka ọnọdụ mmekọrịta ahụ ghara ịdị nro karịa ka isi mmalite Grik siri kwuo; e jikwa “Onyenwe” kewapụ Onye dị n’eluigwe n’ebe ndị nna ukwu mmadụ nọ.
