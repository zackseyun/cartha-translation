source:
  edition: SBLGNT
  text: σὺν Ὀνησίμῳ τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ, ὅς ἐστιν ἐξ ὑμῶν· πάντα ὑμῖν γνωρίσουσιν τὰ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/009.yaml
  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: ig
  text: ya na Onesimọs, nwanna a pụrụ ịtụkwasị obi na onye a hụrụ n’anya, onye bụ otu n’ime unu. Ha ga-eme ka unu mara ihe niile dị n’ebe a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ha ga-agwa unu ihe niile dị n’ebe a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν Ὀνησίμῳ
  choice: ya na Onesimọs
  rationale: “Ya na” na-egosi na Onesimọs so Tịkọs a kpọrọ aha n’amaokwu gara aga; e degharịrị aha ahụ n’ụzọ dabara n’usoro ụda Igbo.
- source_word: πιστῷ
  choice: kwesịrị ntụkwasị obi
  rationale: Nke a na-egosipụta na ọ bụ onye a pụrụ ịtụkwasị obi, ma ọ bụ onye na-eguzosi ike n’ọrụ na mmekọrịta Ndị Kraịst.
- source_word: ἀγαπητῷ
  choice: onye anyị hụrụ n’anya
  rationale: Nkebiokwu a bụ ụzọ Igbo dị ndụ ma dị ọkụ e si akọwa onye a hụrụ n’anya n’etiti ndị kwere ekwe.
- source_word: ἀδελφῷ
  choice: nwanna
  rationale: “Nwanna” na-echekwa asụsụ ezinụlọ nke ọgbakọ Ndị Kraịst; ihe gbara ya gburugburu na-egosi na ọ bụ nwoke, Onesimọs.
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: onye bụ otu n’ime unu
  rationale: Nke a na-egosi na Onesimọs sitere n’etiti ha ma bụrụkwa onye nke obodo ha, n’etinyeghị nkọwa ọzọ sitere n’akwụkwọ Faịlimọn.
- source_word: πάντα ὑμῖν γνωρίσουσιν
  choice: Ha ga-eme ka unu mara ihe niile
  rationale: Ọ na-esochi usoro okwu Grik nke pụtara ime ka ihe doo ndị ọzọ anya, ma bụrụkwa Igbo a na-aghọta nke ọma.
- source_word: τὰ ὧδε
  choice: ihe niile dị n’ebe a
  rationale: Nke a na-ezo aka n’ihe ma ọ bụ ọnọdụ dị n’ebe Pọl nọ, n’agbasaghị ya ka ọ bụrụ naanị ihe ndị na-eme eme.
theological_decisions:
- issue: Mpụtara ἀδελφῷ n’ọgbakọ
  choice: nwanna
  alternative: nwanna n’okwukwe
  rationale: Ihe odide ahụ kpọrọ ya naanị “nwanna.” Nhọrọ a na-echekwa ihe atụ ezinụlọ nke ndị kwere ekwe n’etinyeghị okwu nkọwa na-adịghị na Grik.
- issue: Ike okwu ἐξ ὑμῶν
  choice: onye bụ otu n’ime unu
  alternative: onye si n’etiti unu
  rationale: Nhọrọ a na-echekwa njikọ Onesimọs na ndị Kọlọsi ma ghara itinye nkọwa banyere ọnọdụ obodo ma ọ bụ ọnọdụ ohu nke amaokwu a ekwughị.
- issue: Onye “ha” na-ezo aka na ya
  choice: Ha ga-eme ka unu mara
  alternative: Tịkọs na Onesimọs ga-agwa unu
  rationale: A hapụrụ nnọchiaha ọtụtụ nke Grik ka njikọ ya na Tịkọs nke amaokwu gara aga na Onesimọs pụta site n’ihe gbara ya gburugburu, n’etinyeghị aha ha ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Kwesịrị ntụkwasị obi” na “onye anyị hụrụ n’anya” bụ okwu nkịtị ma na-echekwa ịdị ọkụ nke akwụkwọ ozi ahụ. Akara nkọwa ala ala [a] na [b] dị n’ederede isi.
