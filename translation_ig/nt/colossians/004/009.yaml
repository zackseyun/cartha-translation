    issue: “onye anyị hụrụ n’anya”
    rationale: Nkebiokwu a pụtara “the one whom we love,” ma tinye nnọchiaha “anyị” nke adịghị na Grik. ἀγαπητῷ bụ nkọwa a na-enye Onesimọs, n’enweghị ikwu kpọmkwem onye hụrụ ya n’anya.
  - severity: low
    issue: Nkọwa ala [a] bụ nkọwa gbasara amaokwu gara aga, ọ bụghị nhọrọ nsụgharị nke mkpụrụokwu e tinyere akara ya.
    rationale: Ebe ọ bụ na “ya na” na-eme ka njikọ ya na Tịkọs pụta n’onwe ya n’usoro amaokwu, nkọwa a adịghị mkpa. Ịhapụ ya na-ezere itinye nkọwa mgbakwunye na ederede.
