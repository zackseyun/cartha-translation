source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα ⸀γνῶτε τὰ περὶ ⸀ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: ig
  text: 'Ọ bụ n’ihi nke a kpọmkwem ka m zigara ya ka ọ gakwuru unu: ka unu mara otú anyị dị[a], nakwa ka ọ gbaa obi unu ume.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie sịrị, “ka anyị mara otú unu dị.”
    reason: textual_variant
lexical_decisions:
- source_word: ὃν
  choice: ya
  rationale: Nnọchiaha a na-arụtụ aka na Taịkọs onye a kpọrọ aha n’amaokwu bu ụzọ; “ya” bụ ụzọ Igbo si ekwu ya nke ọma n’ahịrịokwu a.
- source_word: ἔπεμψα
  choice: Ezitere m
  rationale: Oge aorist dị ebe a dabara n’omume mere eme; “Ezitere m” na-egosi nke ahụ n’Igbo n’enweghị ịgbakwụnye nkọwa gbasara oge.
- source_word: πρὸς ὑμᾶς
  choice: ka ọ bịakwute unu
  rationale: Mgbe πρός na-eso ngwaa iziga, ọ na-egosi ebe onye ahụ na-aga. N’Igbo, “ka ọ bịakwute unu” na-egosipụta nke a n’ụzọ doro anya ma bụrụkwa eke.
- source_word: εἰς αὐτὸ τοῦτο
  choice: n’ihi otu nzube a kpọmkwem
  rationale: Okwu a na-emesi nzube ahụ ike; “kpọmkwem” na-eburu ike αὐτὸ τοῦτο nwere.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-ewebata nkebiokwu nzube n’Igbo n’ụzọ dị mfe ma doo anya.
- source_word: γνῶτε
  choice: unu mara
  rationale: Ụdị subjunctive nke ἵνα na-achị na-egosi nzube; “unu mara” na-edebe echiche ahụ n’Igbo eke.
- source_word: τὰ περὶ ἡμῶν
  choice: otú anyị dị
  rationale: Nkebiokwu a na-ekwu maka ọnọdụ Pọl na ndị ya na ha nọ; “otú anyị dị” bụ ntụgharị Igbo dị nkenke ma bụrụ nke mmadụ na-asụ kwa ụbọchị.
- source_word: παρακαλέσῃ
  choice: o nyekwa ... ume
  rationale: παρακαλέω nwere ike ịpụta ịgba ume, ịkasi obi, ma ọ bụ ịdụ ọdụ. N’ebe a, “inye obi ume” na-ejide echiche nke iwusi ha ike ma ghara imechi ohere nkasi obi dị na okwu Grik.
- source_word: τὰς καρδίας ὑμῶν
  choice: obi unu
  rationale: Nke a na-edebe okwu ihe atụ nke Grik, “obi,” nke bụkwa okwu Igbo sitere n’ụzọ ebumpụta ụwa maka ndụ ime mmadụ.
theological_decisions:
- issue: Ọdịiche ederede gbasara onye ga-amata ọnọdụ onye ọzọ
  choice: 'Isi ederede soro SBLGNT: “ka unu mara otú anyị dị” (γνῶτε τὰ περὶ ἡμῶν).'
  alternative: 'Ụfọdụ akwụkwọ aka ochie nwere echiche a: “ka anyị mara otú unu dị.”'
  rationale: A gbasoro ederede Grik e nyere maka isi ederede. E debere ọdịiche a ma ama n’okpuru peeji n’ihi na ọ na-agbanwe onye na-enweta akụkọ banyere ọnọdụ onye ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E ji “nye obi ume” mee ka ihe παρακαλέω pụtara n’ebe a pụta ìhè, ebe a na-edebe “obi” dịka okwu Akwụkwọ Nsọ na okwu Igbo eke.
