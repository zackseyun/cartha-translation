id: COL.4.3
reference: Colossians 4:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, δι’ ὃ καὶ δέδεμαι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: ig
  text: Ka unu na-ekpekwa ekpere maka anyị n’otu oge ahụ[d], ka Chineke megheere anyị ọnụ ụzọ maka okwu ahụ[a], ka anyị wee kwuo ihe omimi nke Mesaịa[b]. Ọ bụkwa n’ihi ya ka m ji nọrọ n’agbụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ọnụ ụzọ maka ozi ahụ,” ma ọ bụ “ohere maka ikwu okwu ahụ.”
    reason: lexical_alternative
  - marker: b
    text: 'Grik: “ihe omimi nke Kraịst”; e jiri “Mesaịa” mee ihe n’ebe a n’ihi na Χριστός bụ utu aha.'
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsụ ya, “n’ihi ya ka m nọkwa n’agbụ.”
    reason: lexical_alternative
  - marker: d
    text: 'N’ụzọ dị nso n’usoro Grik: “na-ekpekwa ekpere n’otu oge ahụ maka anyị.”'
    reason: previous_rendering
lexical_decisions:
- source_word: προσευχόμενοι
  choice: Ka unu na-ekpekwa ekpere
  rationale: Ọ bụ participle nke na-aga n’ihu n’ọdụmọdụ ekpere dị n’amaokwu bu ụzọ. Ntughari a na-egosi omume na-aga n’ihu ma mee ka njikọ ahụ doo anya n’Igbo.
- source_word: ἅμα καὶ περὶ ἡμῶν
  choice: maka anyị kwa
  rationale: ‘Kwa’ na-egosi mgbakwunye nke καί; usoro ahịrịokwu ahụ na-egosikwa na a ga-eme ya n’otu oge ahụ. ‘Maka anyị’ bụ ụzọ Igbo si ekwu περί na okwu gbasara ekpere.
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ
  choice: ka Chineke megheere anyị
  rationale: ‘Ka’ na-eburu nzube na arịrịọ nke ἵνα tinyere subjunctive; ‘megheere anyị’ na-edobe onye ihe ahụ ga-abara uru.
- source_word: ἡμῖν θύραν τοῦ λόγου
  choice: megheere anyị ọnụ ụzọ maka okwu ahụ
  rationale: E debere ihe atụ ‘ọnụ ụzọ’ kama ịkọwa ya naanị dị ka ohere. ‘Okwu ahụ’ na-anọchi λόγος dị ka ozi a ga-ekwusa.
- source_word: λαλῆσαι
  choice: ka anyị wee kwuo
  rationale: Nke a na-egosi infinitive nke nzube ma na-ejigide nghọta nkịtị nke λαλέω, ‘ikwu,’ n’etinyeghị echiche ọrụ nkwusa pụrụ iche.
- source_word: τὸ μυστήριον
  choice: ihe omimi
  rationale: ‘Ihe omimi’ dabara n’iji okwu a eme ihe n’akwụkwọ Pọl maka nzube Chineke nke e kpughere, ma na-ejigide njikọ ya na ebe ndị ọzọ.
- source_word: τοῦ Χριστοῦ
  choice: nke Mesaịa ahụ
  rationale: Χριστός na-arụ ọrụ dị ka utu aha n’ebe a; ‘Mesaịa’ na-egosipụta uru aha ahụ pụtara, ebe ‘nke’ na-edobe njikọ genitive n’emeghị ka nkọwa ya sie ike karịa isi mmalite.
- source_word: δι’ ὃ
  choice: n’ihi ya
  rationale: διά tinyere accusative na-egosi ihe kpatara ya; ‘ya’ na-alaghachi n’ihe omimi/ozi ahụ e kwuru okwu ya.
- source_word: καὶ δέδεμαι
  choice: m ji nọrọkwa n’agbụ
  rationale: Perfect passive na-egosi ọnọdụ dị ugbu a sitere n’ihe mere na mbụ. ‘Nọrọ n’agbụ’ bụ Igbo nkịtị maka ọnọdụ onye a tụrụ mkpọrọ, ‘kwa’ na-anọchi καί.
theological_decisions:
- issue: Ntughari Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a Χριστός bụ utu aha nwere ihe ọ pụtara, ya mere ‘Mesaịa’ ka ahọrọ; e tinyeghị echiche otu ụka pụrụ iche.
- issue: Ihe atụ θύραν τοῦ λόγου
  choice: ọnụ ụzọ maka okwu ahụ
  alternative: ohere maka izi ozi ahụ
  rationale: A hapụrụ ihe atụ Pọl nke ‘ọnụ ụzọ’ ka ọ dị, kama idozi ya kpamkpam bụrụ naanị ‘ohere.’
- issue: Ihe δέδεμαι pụtara
  choice: ịnọ n’agbụ
  alternative: ịbụ onye e kere agbụ
  rationale: Nke bụ isi bụ ọnọdụ Pọl dị ugbu a dị ka onye mkpọrọ. Nhọrọ a bụ Igbo e ji eme ihe nke ọma ma na-edobe ihe oyiyi agbụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. E debere ihe atụ ‘ọnụ ụzọ,’ okwu ‘ihe omimi,’ na njikọ nke ahịrịokwu ahụ, ma zere usoro ga-ada ka ntụgharị okwu n’otu n’otu.
