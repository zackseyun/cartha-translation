  to: Ka unu na-ekpekwa ekpere maka anyị n’otu oge ahụ[d], ka Chineke megheere anyị ọnụ ụzọ maka okwu ahụ[a], ka anyị wee kwuo ihe omimi nke Mesaịa[b]. Ọ bụkwa n’ihi ya ka m ji nọrọ n’agbụ[c].
