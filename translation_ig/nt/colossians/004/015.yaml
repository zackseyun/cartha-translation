source:
  edition: SBLGNT
  text: ἀσπάσασθε τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς καὶ ⸂Νύμφαν καὶ τὴν κατ’ οἶκον αὐτῆς⸃ ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: ig
  text: Keleenụ ụmụnna nọ na Laodisia, na Nimfa[a] na chọọchị dị n'ụlọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide aka na-akwado “Nimfas na chọọchị dị n'ụlọ Nimfas”; ndị ọzọ na-akwado “Nimfa na chọọchị dị n'ụlọ ha.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Keleenụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha zie ekele; “Keleenụ” bụ okwu Igbo dị mfe ma na-echekwa ike nke iwu ahụ.
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: ụmụnna nọ na Laodisia
  rationale: “Ụmụnna” bụ ụzọ Igbo e si akpọ ndị okwukwe ibe, ọ pụkwara ịgụnye ndị nwoke na ndị nwanyị dịka ojiji Pọl si dị, ma ọ naghị agbanwe okwu ahụ ka ọ bụrụ naanị “ndị kwere ekwe.”
- source_word: Νύμφαν
  choice: Nimfa
  rationale: Ederede SBLGNT nwere ụdị aha a na-aghọtakarị dị ka aha nwanyị; e degharịrị ya n'ụdị mkpọpụta dabara n'Igbo.
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: chọọchị dị n'ụlọ ya
  rationale: Nke a na-echekwa echiche nke ọgbakọ dị n'ụlọ ya n'enweghị ịgbakwunye hoo haa na ha “na-ezukọ” ebe ahụ.
- source_word: ἐκκλησίαν
  choice: chọọchị
  rationale: “Chọọchị” bụ okwu ndị Igbo na-ejikarị maka ọgbakọ Ndị Kraịst, ma n'ebe a ọ na-ezo aka n'ọgbakọ ndị kwere ekwe, ọ bụghị ụlọ naanị ya.
theological_decisions:
- issue: Mmekọahụ/ụdị aha Νύμφαν na nnọchiaha kwekọrọ na ya
  choice: Nimfa ... chọọchị dị n'ụlọ ya
  alternative: Nimfas ... chọọchị dị n'ụlọ ya; ma ọ bụ Nimfa ... chọọchị dị n'ụlọ ha
  rationale: Ederede SBLGNT a bipụtara na-akwado aha nwanyị na αὐτῆς, “nke ya” (nwanyị). N'ihi ọdịiche dị n'ihe odide aka, e debere ọgụgụ ndị ọzọ n'ala peeji kama idozi esemokwu ahụ n'ụzọ zoro ezo.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “ụmụnna” mee ka okwu ezinụlọ nke ndị okwukwe dịrị, jiri “chọọchị” mee ihe n'echiche ọgbakọ, ma debe akara ala peeji [a] ozugbo n'akụkụ akụkụ ederede metụtara ọdịiche ahụ.
