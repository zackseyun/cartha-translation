  rationale: The revision corrects the verbal force of the command concerning the Laodicean assembly. It retains the Greek’s ellipsis and preserves uncertainty about the identity and destination of the letter from Laodicea. The single footnote remains correctly anchored to the ambiguous phrase and incorporates both the implied-noun explanation and the historical caution.
