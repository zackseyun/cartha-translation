reference: Colossians 4:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὅταν ἀναγνωσθῇ παρ’ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ ⸀Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: ig
  text: 'Mgbe a gụchara akwụkwọ ozi a n’etiti unu, hụkwanụ na a gụkwaa ya n’ọgbakọ ndị Laodisia; unu onwe unu gụkwaanụ nke si na Laodisia.[a]


    [a] Ihe e ji “nke si na Laodisia” ezo aka na ya edoghị anya. N’asụsụ Grik, e kwughachighị okwu ahụ bụ “akwụkwọ ozi,” kama a hapụrụ ya ka ihe ndị gbara ya gburugburu mee ka a ghọta ya; a pụkwara ikwu ya n’ụzọ doro anya dịka “akwụkwọ ozi si na Laodisia.” O nwere ike ịbụ akwụkwọ ozi dị na Laodisia n’oge ahụ, ọ bụghị iwu na ọ bụ akwụkwọ ozi e degara ndị Laodisia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ihe e ji “nke si na Laodisia” ezo aka na ya edoghị anya. N’asụsụ Grik, e kwughachighị okwu ahụ bụ “akwụkwọ ozi,” kama a hapụrụ ya ka ihe ndị gbara ya gburugburu mee ka a ghọta ya; a pụkwara ikwu ya n’ụzọ doro anya dịka “akwụkwọ ozi si na Laodisia.” O nwere ike ịbụ akwụkwọ ozi dị na Laodisia n’oge ahụ, ọ bụghị iwu na ọ bụ akwụkwọ ozi e degara ndị Laodisia.
    reason: lexical_alternative_and_historical_ambiguity
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: a gụchara / gụkwaanụ
  rationale: Okwu Grik pụtara ịgụ ihe, ọ na-abụkarịkwa ịgụ ya n’ihu ọgbakọ n’ọnọdụ dị otú a. Igbo “gụ” bụ okwu kachasị mfe ma dịkwa eke; ọnọdụ ahụ na-egosi na ọ bụ ịgụ n’ọgbakọ.
- source_word: παρ’ ὑμῖν
  choice: n’etiti unu
  rationale: Nke a na-egosi na a gụrụ akwụkwọ ozi ahụ n’ime obodo ndị kwere ekwe nọ na Kọlọsi, ọ bụghị naanị na otu onye n’ime ha gụrụ ya.
- source_word: ἡ ἐπιστολή
  choice: akwụkwọ ozi a
  rationale: Mkpụrụokwu ahụ na-ezo aka n’akwụkwọ ozi a Pọl na-ede ugbu a. “Akwụkwọ ozi a” na-eme ka ntụaka ahụ doo anya n’Igbo.
- source_word: ποιήσατε ἵνα
  choice: hụkwanụ na
  rationale: N’ebe a, iwu ahụ na-agwa ha ka ha hụ na ihe a kwuru mezuru. “Hụkwanụ na” bụ Igbo eke nke na-echekwa ike nke iwu ahụ.
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: n’ọgbakọ ndị Laodisia
  rationale: “Ọgbakọ” na-egosipụta nzukọ obodo ndị kwere ekwe, ebe “ndị Laodisia” na-echekwa njikọ genitiv nke Grik n’enweghị nkọwa agbakwunyere.
- source_word: τὴν ἐκ Λαοδικείας
  choice: nke si na Laodisia
  rationale: Grik hapụrụ aha “akwụkwọ ozi” n’ekwughị ya ọzọ. “Nke si na Laodisia” na-echekwa nhapụ ahụ ma ka na-edo anya n’Igbo.
- source_word: ἐκ Λαοδικείας
  choice: si na Laodisia
  rationale: ἐκ pụtara n’ụzọ nkịtị “site na” ma ọ bụ “si na.” Nsụgharị a anaghị agbanwe ya ka ọ bụrụ “e degara Laodisia,” ebe ihe akaebe Grik ekwughị otú ahụ.
theological_decisions:
- issue: Ihe bụ akwụkwọ ozi ahụ si na Laodisia
  choice: 'A sụgharịrị ya n’enweghị ịkpọ ya otu akwụkwọ ozi ama ama: “nke si na Laodisia.”'
  alternative: Akwụkwọ ozi Pọl degara ndị Laodisia; akwụkwọ ozi e si Laodisia ziga Kọlọsi; ma ọ bụ akwụkwọ ozi e kesara n’ọgbakọ dị iche iche, nke ụfọdụ na-ejikọ na Ndị Efesọs.
  rationale: Grik na-ekwu naanị njikọ akwụkwọ ozi ahụ na Laodisia; ọ naghị akọwa onye e degaara ya ma ọ bụ akwụkwọ ozi ọ bụ. Ya mere, nsụgharị ahụ echekwala ejighị n’aka dị n’ihe odide ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù, mee nsụgharị ahụ. A họọrọ “ọgbakọ” kama okwu nwere ike ibu nkọwa ụka pụrụ iche. E chekwara iwu dị n’amaokwu ahụ na ejighị n’aka banyere akwụkwọ ozi si na Laodisia.
