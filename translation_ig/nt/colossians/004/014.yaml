id: COL.4.14
reference: Colossians 4:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/014.yaml
  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: ig
  text: Luk, dibịa a hụrụ n’anya, na Dimas na-ekele unu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: na-ekele
  rationale: N’akwụkwọ ozi, okwu a na-egosi iziga ekele. Ọ bụ ezie na ngwaa Grik dị n’otu n’ihi na ọ na-ebute ndị na-eme ihe n’azụ ya, Igbo eke na-eji usoro ‘Luk ... na Dimas na-ekele unu’ maka ndị abụọ ahụ.
- source_word: ὑμᾶς
  choice: unu
  rationale: Nnọchiaha a bụ onye nke abụọ n’ụbara; ‘unu’ na-egosi nke ahụ kpọmkwem n’Igbo.
- source_word: Λουκᾶς
  choice: Luk
  rationale: Ụdị aha a bụ ntụgharị mkpụrụokwu e ji eme ihe n’Igbo maka Λουκᾶς.
- source_word: ἰατρὸς
  choice: dibịa
  rationale: N’ebe a, ‘dibịa’ pụtara onye na-agwọ ọrịa, kwekọrọ n’ọrụ ἰατρός n’oge ahụ; ọ bụ okwu Igbo dị mfe ma dị ùgwù.
- source_word: ἀγαπητὸς
  choice: a hụrụ n’anya
  rationale: Nkebiokwu a na-echekwa ịhụnanya na nsọpụrụ dị na ἀγαπητός karịa naanị ịsị onye ‘dị mma’ ma ọ bụ ‘dị anyị nso.’
- source_word: καὶ
  choice: na
  rationale: Njikọ a na-ejikọta Dimas na Luk dịka ndị na-ezigara ndị Kọlọsi ekele.
- source_word: Δημᾶς
  choice: Dimas
  rationale: Ụdị aha a na-anọchi anya Δημᾶς n’ụzọ dabara n’usoro mkpọpụta na ide aha n’Igbo.
theological_decisions:
- issue: Onye nkebiokwu ‘a hụrụ n’anya’ na-akọwa
  choice: ‘dibịa a hụrụ n’anya’ na-akọwa naanị Luk.
  alternative: Ịhapụ nhazi ahịrịokwu ka o nwee ike iyi na nkọwa ahụ metụtara Dimas kwa.
  rationale: N’asụsụ Grik, ὁ ἰατρὸς ὁ ἀγαπητός bụ nkọwa abụọ na-esochi Λουκᾶς kpọmkwem; ọ naghị akọwa Dimas.
translation_notes:
  register: Asụsụ Igbo izugbe, nke dị ugbu a ma dị ùgwù. A họọrọ ‘dibịa’ n’echiche doro anya nke onye na-agwọ ọrịa; nhazi ahịrịokwu ahụ na-eme ka o doo anya na ma Luk ma Dimas na-ekele ndị a na-agwa okwu.
