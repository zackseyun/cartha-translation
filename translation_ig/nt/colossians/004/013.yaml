id: COL.4.13
reference: Colossians 4:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μαρτυρῶ γὰρ αὐτῷ ὅτι ἔχει ⸂πολὺν πόνον⸃ ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ τῶν ἐν Ἱεραπόλει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/013.yaml
  text: For I testify for him that he has great labor for you and for those in Laodicea and those in Hierapolis[a].
translation:
  language: ig
  text: N’ihi na ana m agba akaebe banyere ya na ọ na-adọgbu onwe ya n’ọrụ nke ukwuu maka unu na maka ndị nọ na Laodisia na ndị nọ na Hierapolis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “o nwere nnukwu nchegbu” ma ọ bụ “ọ nọ na nnukwu nhụjuanya.” Okwu Grik ahụ nwere ike ịpụta ọrụ siri ike, ma n’ọnọdụ a, ọ pụkwara ịgụnye nchegbu miri emi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: ana m agba akaebe
  rationale: Okwu a dị n’oge ugbu a, onye mbụ otu; nsụgharị a na-egosi na Pọl ji aka ya na-agba akaebe.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-edobe njikọ nkọwa nke amaokwu a na nke bu ya ụzọ.
- source_word: αὐτῷ
  choice: banyere ya
  rationale: Dative a na μαρτυρέω nwere ike igosi onye a na-agba akaebe banyere ya; nke a bụ okwu Igbo doro anya ma na-adịghị etinye echiche ọzọ.
- source_word: ὅτι
  choice: na
  rationale: Na-ewebata ihe akaebe Pọl kwuru.
- source_word: ἔχει πολὺν πόνον
  choice: ọ na-adọgbu onwe ya n’ọrụ nke ukwuu
  rationale: Na-egosipụta ọrụ siri ike na mgbalị dị ukwuu nke πόνος, ma ghara imechi ihe ọ pụtara nanị n’ahụhụ mmetụta uche.
- source_word: ὑπὲρ ὑμῶν
  choice: maka unu
  rationale: Na-egosi mgbalị e mere maka ọdịmma ndị Kọlọsi; “unu” na-edobe ọtụtụ mmadụ nke ὑμῶν.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: ndị nọ na Laodisia
  rationale: Nsụgharị dị nkenke na nke eke maka ndị kwere ekwe nọ n’obodo ahụ.
- source_word: τῶν ἐν Ἱεραπόλει
  choice: ndị nọ na Hierapolis
  rationale: Na-edobe usoro ya na nkebi bu ya ụzọ ma na-edegharị aha obodo ahụ n’ụzọ a na-amata.
theological_decisions:
- issue: Ihe πόνος pụtara n’ihe gbasara ozi Epafras
  choice: ọ na-adọgbu onwe ya n’ọrụ nke ukwuu
  alternative: o nwere nnukwu nchegbu / ọ nọ n’oké ihe mgbu
  rationale: Ọnọdụ okwu dị na 4:12 gụnyere mgba Epafras na-ekpe n’ekpere, ya mere nchegbu ma ọ bụ ihe mgbu nwere ike iso n’ihe okwu ahụ pụtara. Ma πόνος na-ezo n’ụzọ bụ isi n’ọrụ na-agwụ ike; nsụgharị a na-edobe obosara ahụ n’enweghị ịmanye otu nkọwa.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “na-adọgbu onwe ya n’ọrụ” mee ka echiche mgbalị siri ike doo anya; ihe odide ala peeji na-echekwa ụzọ ndị ọzọ πόνος pụrụ isi pụta.
