- from: Tikikọs, nwanna anyị a hụrụ n’anya, onye ozi kwesịrị ntụkwasị obi, na onye mụ na ya bụ ohu nke Onyenwe anyị, ga-eme ka unu mara ihe niile banyere m.[a][b][c]
  to: Tikikọs, nwanna a hụrụ n’anya, onye na-eje ozi kwesịrị ntụkwasị obi[b], na onye mụ na ya bụ ohu n’ime Onyenwe anyị[c], ga-eme ka unu mara ihe niile banyere m[a].
  rationale: E wepụrụ “anyị” iji ghara ịgbakwunye ihe na-adịghị na Grik. E dochiri “onye ozi” anya na “onye na-eje ozi” ka διάκονος ghara ịdị ka aha onye ozi pụrụ iche, ma nkọwa ụkwụ na-edebe ụzọ ọzọ. E weghachiri ἐν κυρίῳ dịka “n’ime Onyenwe anyị” iji chekwaa obosara na mgbagwoju anya nke njikọ ya na ahịrịokwu ahụ. Akara nkọwa ụkwụ ugbu a dị kpọmkwem n’akụkụ okwu ọ bụla ha na-akọwa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:05Z'
