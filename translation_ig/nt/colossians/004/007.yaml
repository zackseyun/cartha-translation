reference: Colossians 4:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τὰ κατ’ ἐμὲ πάντα γνωρίσει ὑμῖν Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος καὶ σύνδουλος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/007.yaml
  text: Tychicus[a], the beloved brother and faithful minister and fellow servant in the Lord[c][b], will make known to you everything about me.
translation:
  language: ig
  text: Tikikọs, nwanna a hụrụ n’anya, onye na-eje ozi kwesịrị ntụkwasị obi[b], na onye mụ na ya bụ ohu n’ime Onyenwe anyị[c], ga-eme ka unu mara ihe niile banyere m[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe niile metụtara m” ma ọ bụ “ọnọdụ m niile.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị διάκονος dị ka “onye ozi” ma ọ bụ, n’ebe ụfọdụ, “dikọn.” N’ebe a, ọ bụghị ihe doro anya na ọ na-ekwu maka ọkwa ụka a na-akpọ dikọn.
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “onye mụ na ya bụ ohu n’ime Onyenwe anyị.” Okwu Grik σύνδουλος na-ezo aka n’onye ya na onye ọzọ bụ ohu; a pụkwara ịsụgharị ya “onye mụ na ya na-eje ozi.” Akpaokwu “n’ime Onyenwe anyị” nwekwara ike ịkọwa nkọwa ndị bu ya ụzọ, ọ bụghị naanị “onye mụ na ya bụ ohu.”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: ihe niile banyere m
  rationale: Akpaokwu Grik a na-ezo aka n’ihe niile metụtara Pọl—ọnọdụ ya, ihe na-eme ya, na okwu ya—na-enweghị ịmachi ya nanị n’ọnọdụ ya.
- source_word: γνωρίσει ὑμῖν
  choice: ga-eme ka unu mara
  rationale: Nke a na-egosipụta ọdịnihu nke γνωρίζω na onye nnata dị n'ụdị ọtụtụ, ma bụrụkwa okwu Igbo doro anya ma dị ùgwù.
- source_word: Τυχικὸς
  choice: Tikikọs
  rationale: E depụtara aha onye ahụ n’ụzọ kwekọrọ na mkpọpụta na usoro ide aha n’Igbo.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: nwanna anyị a hụrụ n’anya
  rationale: Nke a na-echekwa ịhụnanya dị na ἀγαπητός na njikọ okwukwe nke ἀδελφός; ‘anyị’ na-eme ka okwu ahụ daa nke ọma n’Igbo n’enweghị ịgbanwe onye a na-ekwu maka ya.
- source_word: πιστὸς διάκονος
  choice: onye ozi kwesịrị ntụkwasị obi
  rationale: διάκονος n’ebe a nwere ike ịbụ onye na-eje ozi ma ọ bụ onye ozi, ma ihe gbara ya gburugburu anaghị egosi n'ụzọ doro anya ọkwa ụka a na-akpọ dikọn; ‘onye ozi’ na-echekwa obosara ahụ.
- source_word: σύνδουλος
  choice: onye mụ na ya bụ ohu
  rationale: Okwu a pụtara onye ya na Pọl nọkọrọ n’okpuru otu Nna Ukwu n’ọrụ na nrubeisi. ‘Ohu’ na-egosipụta ọnọdụ ịbụ nke nna ukwu karịa nanị ‘onye na-eje ozi,’ ebe nkọwa ụkwụ na-edebe ụzọ ọzọ.
- source_word: ἐν κυρίῳ
  choice: nke Onyenwe anyị
  rationale: N’usoro ahịrịokwu Igbo a, ‘ohu nke Onyenwe anyị’ na-egosipụta na Onyenwe anyị bụ onye ha bụ nke ya ma na-ejere ozi, nke bụ isi echiche nke akpaokwu ahụ n’ebe a.
theological_decisions:
- issue: Otu e si sụgharịa σύνδουλος na asụsụ ohu
  choice: onye mụ na ya bụ ohu
  alternative: onye mụ na ya na-eje ozi; onye mụ na ya bụ ohu e kere agbụ
  rationale: Nhọrọ a na-echekwa echiche nke ịbụ ndị nọ n’okpuru otu Onyenwe anyị, ma zere ime ka okwu ahụ bụrụ naanị aha ọkwa ụka. Nkọwa ụkwụ na-egosi ụdị okwu ndị ọzọ n’ihi na σύνδουλος nwere ma echiche ije ozi ma nke ịbụ ohu.
- issue: Mmekọrịta ἐν κυρίῳ na aha ọrụ ndị bu ya ụzọ
  choice: jikọta ya na ‘onye mụ na ya bụ ohu’ dị ka ‘ohu nke Onyenwe anyị’
  alternative: ‘n’ime Onyenwe anyị,’ nke nwere ike ịkọwa ọrụ abụọ ahụ ma ọ bụ mmekọrịta Tíkikọs niile
  rationale: Ọnọdụ akpaokwu Grik na-enye ohere ka ‘n’ime Onyenwe anyị’ gbasaa karịa σύνδουλος naanị. Isi ederede na-eji usoro Igbo kachasị eke, ebe nkọwa ụkwụ na-edebe obosara ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘unu’ mee ka ọtụtụ mmadụ dị na ὑμῖν pụta ìhè. E zere ‘dikọn’ n’isi ederede n’ihi na ọnọdụ a anaghị egosi n'ụzọ doro anya ọkwa ụka pụrụ iche. Akara nkọwa ụkwụ niile [a], [b], [c] dị n’isi ederede.
