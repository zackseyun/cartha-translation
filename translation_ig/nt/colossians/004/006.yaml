id: COL.4.6
reference: Colossians 4:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: ig
  text: Ka okwu unu bụrụ mgbe niile n’amara[a], nke nnu gbara[b], ka unu wee mara otú unu kwesịrị isi zaa onye ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nke obiọma ji mara” ma ọ bụ “n’ụzọ amara.” Nkebiokwu a nwere ike ịpụta okwu e ji obiọma na ihuọma kwuo, ma o nwekwara ike ijigide echiche sara mbara nke amara.
    reason: lexical_alternative
  - marker: b
    text: “Nke nnu gbara” bụ ihe atụ maka okwu dabara adaba, na-adọrọ mmasị, ma nwee amamihe; ọ bụghị okwu na-adịghị atọ ụtọ ma ọ bụ nke na-adịghị mma.
    reason: cultural_note
lexical_decisions:
- source_word: λόγος
  choice: okwu
  rationale: N’ebe a, λόγος na-ekwu maka ụzọ ndị kwere ekwe si ekwu okwu, ọ bụghị naanị otu mkpụrụokwu ma ọ bụ ozi pụrụ iche. “Okwu unu” bụ Igbo nkịtị ma dabara n’iwu banyere ịza mmadụ.
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Nke a na-egosi na okwu ha kwesịrị ịdị otu a n’oge niile.
- source_word: ἐν χάριτι
  choice: nke jupụtara n’amara
  rationale: Nhọrọ a na-egosi okwu nke amara, obiọma na ihuọma ji mara, ma na-edobekwa ụda Pọl banyere amara n’enweghị ịkọwa ya gabiga ókè.
- source_word: ἅλατι ἠρτυμένος
  choice: nke e ji nnu mee ka ọ dị ụtọ
  rationale: A hapụrụ ihe atụ nke nnu ka ọ dị, ebe okwu Igbo a na-egosi àgwà okwu a kwadebere nke ọma, nke dabara adaba ma na-atọ ụtọ ịnụ.
- source_word: εἰδέναι
  choice: ka unu wee mara
  rationale: Infinitive a nwere njikọ sintaks siri ike; nsụgharị a na-ewere ya dị ka nzube ma ọ bụ ihe ga-esi n’iwu gara aga pụta, n’enweghị ikewapụ njikọ ahụ.
- source_word: δεῖ
  choice: kwesịrị
  rationale: “Kwesịrị” na-egosi ihe dị mkpa na ihe dabara adaba, ma ọ naghị eme ka ụda ndụmọdụ ahụ sie ike karịa isi iyi.
- source_word: ἑνὶ ἑκάστῳ
  choice: onye ọ bụla
  rationale: 'Nke a na-edobe ike nkesa nke okwu Grik ahụ: a ga-aza mmadụ n’otu n’otu dịka o kwesịrị.'
- source_word: ἀποκρίνεσθαι
  choice: ịza
  rationale: “Ịza” bụ ụzọ Igbo doro anya ma kwekọọ n’ọnọdụ mkparịta ụka a na-atụ anya ya.
theological_decisions:
- issue: Ma χάρις ebe a ọ pụtara amara Chineke kpọmkwem ka ọ bụ ịdị obiọma n’okwu
  choice: E ji “amara” mee isi nsụgharị ma kọwaa obosara ya n’ala peeji.
  alternative: okwu ọma na nke obiọma
  rationale: ἐν χάριτι nwere ike ịkọwa okwu nwere obiọma ma nwee ike ịnọgide na-ebu ụda sara mbara nke amara n’akwụkwọ Pọl. Nsụgharị ahụ anaghị ekpebi naanị otu n’ime ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee nsụgharị ahụ. A hapụrụ ihe atụ “nnu” ka ọ dị ma kọwaa ya n’ala peeji. Akara ala peeji [a] na [b] pụtara n’ederede isi.
