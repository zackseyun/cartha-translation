revisions:
- from: Ka okwu unu bụrụ mgbe niile nke jupụtara n’amara[a], nke e ji nnu mee ka ọ dị ụtọ[b], ka unu wee mara otú unu kwesịrị isi zaa onye ọ bụla.
  to: Ka okwu unu bụrụ mgbe niile n’amara[a], nke nnu gbara[b], ka unu wee mara otú unu kwesịrị isi zaa onye ọ bụla.
  rationale: The revision changes “jupụtara n’amara” to “n’amara” to avoid adding intensity not explicit in the Greek and replaces the more expansive salt rendering with “nke nnu gbara,” preserving the source metaphor naturally. The footnotes are adjusted to explain the lexical range and metaphor without overstating their implications.
