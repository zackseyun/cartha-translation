id: COL.4.17
reference: Colossians 4:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἴπατε Ἀρχίππῳ· Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ, ἵνα αὐτὴν πληροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: ig
  text: Gwakwanụ Akịpọs, “Lezie anya n’ozi ahụ ị natara n’ime Onyenwe anyị, ka i wee rụzuo ya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma eleghị anya: “ozi ahụ i natara n’aka Onyenwe anyị.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἴπατε
  choice: Gwakwanụ
  rationale: Ọ bụ iwu e nyere ọtụtụ ndị; ‘Gwakwanụ’ bụ ụzọ Igbo dị mfe ma doo anya isi kwuo ka ọgbakọ gwa Akịpọs.
- source_word: Ἀρχίππῳ
  choice: Akịpọs
  rationale: E depụtara aha Grik ahụ n’ụdị mkpọpụta dabara n’usoro na ụda asụsụ Igbo.
- source_word: Βλέπε
  choice: Lezie anya
  rationale: Iwu a dị n’ụdị na-egosi nlekọta na-aga n’ihu; ‘Lezie anya’ na-egosi ilekwasị anya nke ọma n’ọrụ e nyere ya.
- source_word: διακονίαν
  choice: ozi
  rationale: N’ebe a, okwu ahụ pụtara ọrụ e nyere mmadụ ka ọ rụọ n’ime ndị kwere ekwe; ‘ozi’ anaghị ekwu kpọmkwem na ọ bụ otu ọkwa ọchịchị ụka.
- source_word: παρέλαβες
  choice: ị natara
  rationale: Nke a na-egosi na e nyere ya ọrụ ahụ, ọ bụghị na o jiri aka ya họpụta onwe ya.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Nke a na-edobe preposition ἐν na nghọta ya nke ọnọdụ ma ọ bụ mmekọrịta, na-enweghị imechi ohere nke nghọta ọzọ banyere isi iyi ozi ahụ.
- source_word: ἵνα
  choice: ka i wee
  rationale: Ọ na-egosi nzube nke ndụmọdụ ahụ n’ụzọ Igbo nke sitere n’okike.
- source_word: πληροῖς
  choice: rụzuo
  rationale: ‘Rụzuo’ jikọtara echiche nke ịrụ ọrụ ahụ nke ọma na iwere ya ruo na mmezu.
theological_decisions:
- issue: Ihe ἐν κυρίῳ pụtara
  choice: n’ime Onyenwe anyị
  alternative: nke i natara n’aka Onyenwe anyị
  rationale: Grik ji ἐν, ọ bụghị preposition na-egosi isi iyi n’ụzọ doro anya. Ya mere, isi ederede na-edobe echiche nke ịdị n’ime mmekọrịta ma ọ bụ ọnọdụ nke Onyenwe anyị, ebe nkọwa ala peeji na-egosi nghọta ọzọ nwere ike ịdị.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. ‘Ozi’ na ‘rụzuo’ na-enye nghọta doro anya n’enweghị ịkọwa ọrụ Akịpọs dịka otu ọkwa ụka pụrụ iche.
