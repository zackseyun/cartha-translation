translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dị ugwu. Nhazi ‘ka m wee’ na-egosi nzube; ‘mee ka ọ pụta ìhè’ na-echekwa ọtụtụ nghọta φανερόω nwere n’ebe a. E tinyere akara ntụaka ukwu abụọ n’ahịrị bụ isi, [a] na [b].
