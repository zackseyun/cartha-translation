- from: ka m wee mee ka ọ pụta ìhè[a], dị ka m kwesịrị ikwu ya.[b]
  to: ka m wee mee ka ọ pụta ìhè[a], dị ka m kwesịrị isi kwuo.[b]
  rationale: The revision removes the unexpressed object from the final infinitive and uses ‘isi kwuo’ to render the manner/standard force of ὡς naturally in Standard Igbo. The first clause and its footnote remain faithful to φανερώσω αὐτό and to the preceding contextual antecedent.
