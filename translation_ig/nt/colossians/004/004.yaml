  text: so that I may make it clear[b][a], as I ought to speak.
translation:
  language: ig
  text: ka m wee mee ka ọ pụta ìhè[a], dị ka m kwesịrị isi kwuo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “kpughee ya” ma ọ bụ “mee ka a mara ya.” “Ọ” na-arụtụ aka n’ihe omimi ahụ e kwuru n’amaokwu gara aga.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “dị ka m na-aghaghị isi kwuo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka m wee
  rationale: Na-egosi nzube nke arịrịọ ahụ n’Igbo nkịtị ma na-echekwa ike telic nke okwu Grik.
- source_word: φανερώσω
  choice: mee ka ọ pụta ìhè
  rationale: Na-enye echiche ime ka ihe ahụ doo anya ma ọ bụ pụta ìhè n’oge nkwusa; ọ naghị amachi okwu ahụ naanị n’ịkọwa ya.
- source_word: αὐτὸ
  choice: ọ ... ya
  rationale: Aha nnọchi a na-arụtụ aka n’ihe omimi ahụ e kwuru n’amaokwu gara aga. E chekwara ya dịka aha nnọchi kama itinye ‘ihe omimi ahụ’ n’ahịrị bụ isi.
- source_word: ὡς
  choice: dị ka
  rationale: Na-egosi ụzọ ma ọ bụ ụkpụrụ Pọl kwesịrị isi kwuo okwu.
- source_word: δεῖ
  choice: kwesịrị
  rationale: Na-echekwa echiche ọrụ dịịrị ya ma ọ bụ ihe dị mkpa ka o mee, n’asụsụ Igbo dị mfe ma dị ebube.
- source_word: με
  choice: m
  rationale: Ọ bụ ezie na με dị n’ụdị accusative dịka isiokwu infinitive n’asụsụ Grik, Igbo na-eji ‘m’ n’ụzọ ebumpụta ụwa.
- source_word: λαλῆσαι
  choice: ikwu ya
  rationale: ‘Ikwu’ bụ ntụgharị sara mbara ma kwụ ọtọ; ‘ikwusa’ ga-eme ka ihe okwu Grik ahụ pụtara bụrụ nke akọwapụtara karịa ka ọ dị. ‘Ya’ na-eme ka ihe a na-ekwu banyere ya doo anya n’Igbo.
