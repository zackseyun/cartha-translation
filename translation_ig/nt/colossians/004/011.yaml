id: COL.4.11
reference: Colossians 4:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: ig
  text: na Jizọs, onye a na-akpọ Jọstọs. N'ime ndị e biri úgwù, ọ bụ naanị ndị a bụ ndị ha na m na-arụkọ ọrụ maka alaeze Chineke,[a] ndị ghọrọ m nkasi obi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Naanị ndị ọrụ ibe a maka alaeze Chineke bụ ndị sitere n’etiti ndị e biri úgwù.” Okwu Grik ahụ bụ n'ụzọ nkịtị “ndị sitere n’ibi úgwù,” nke pụkwara ịpụta ndị Juu.
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: Ma ọ bụ, “ha ghọrọ m agbamume,” ma ọ bụ, “ha abụrụla m nkasi obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Aha a na-ejikarị n’Agba Ọhụrụ Igbo; ọ na-edobe ụdị aha Grik ebe a kama ịtụgharị ya Jọshụa.
- source_word: ὁ λεγόμενος Ἰοῦστος
  choice: onye a na-akpọ Jọstọs
  rationale: Nke a na-egosi aha ọzọ e ji mara ya ma na-asụkwa ya n’Igbo dị mfe ma kwesị ekwesị.
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: n'ime ndị e biri úgwù
  rationale: Ọ na-edobe ihe oyiyi nke okwu Grik ma na-egosi otu ndị ahụ si n’etiti ha pụta; ihe ọ pụtara dị ka ndị Juu ka a kọwara n’ala ala peeji.
- source_word: οὗτοι μόνοι
  choice: ọ bụ naanị ndị a
  rationale: 'Ọ na-eme ka nkwusi ike nke μόνοι doo anya: n’etiti otu ahụ, naanị ndị a bụ ndị ọrụ ibe Pọl.'
- source_word: συνεργοὶ
  choice: ndị ha na m na-arụkọ ọrụ
  rationale: Ụdị a bụ Igbo eke, ma na-egosi na ha bụ ndị ọrụ ibe Pọl n’ozi ahụ.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: maka alaeze Chineke
  rationale: “Maka” na-egosi ebumnuche ma ọ bụ ozi ha na-arụ, ebe “alaeze Chineke” na-edobe okwu Baịbụl a maara nke ọma.
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: ha aghọọkwala ndị nyere m nkasi obi
  rationale: “Aghọọkwala” na-anọ nso n’echiche γίνομαι, ebe “nyere m nkasi obi” na-eme ka predicate noun ahụ bụrụ Igbo dị ndụ; παρηγορία nwekwara ike ịpụta agbamume.
theological_decisions:
- issue: Ihe “ndị e biri úgwù” na-ezo aka na ya
  choice: E debere okwu ibi úgwù n’ahịrị isi, ma hazie ya ka ọ pụta na naanị ndị a sitere n’otu ahụ bụ ndị ọrụ ibe Pọl.
  alternative: Ịsị kpọmkwem “ndị Juu,” ma ọ bụ ịghọta ya dị ka otu pụrụ iche nke ndị na-akwado ibi úgwù.
  rationale: N’ọnọdụ a, okwu ahụ yiri ka ọ na-akọwa ndị ọrụ ibe Pọl sitere n’agbụrụ na omenala ndị Juu. Ma okwu Grik n’onwe ya ekwughị kpọmkwem ma ọ bụ akara agbụrụ n’ozuzu ya ka ọ bụ aha otu pụrụ iche; ya mere, a naghị edozi mgbagwoju a n’ahịrị isi.
- issue: Njikọ naanị ndị a na “ndị e biri úgwù”
  choice: “N'ime ndị e biri úgwù, ọ bụ naanị ndị a...”
  alternative: “Naanị ndị ọrụ ibe a ... bụ ndị e biri úgwù.”
  rationale: Nhazi Grik buru ụzọ mata otu ndị e biri úgwù, mesịa kwuo na naanị ndị a n’etiti ha bụ ndị ọrụ ibe ya. Nhọrọ a na-edobe nkwusi ike ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ugwu. E ji “úgwù” mee ka ụdaokwu dị iche na “ugwu,” ma jiri usoro ahịrịokwu Igbo eke gosi nkwusi ike na nhazi nke Grik.
