  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/018.yaml
  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: ig
  text: Ọ bụ mụ onwe m, Pọl, ji aka m dee ekele[a] a. Chetanụ agbụ m.[b] Ka amara dịnyere unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ekele mmechi.” Okwu Grik a na-ezo aka n’ekele mmechi nke Pọl ji aka ya dee.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mkpọrọ m” ma ọ bụ “agbụ e ji kee m.” N’ụzọ nkịtị, “agbụ m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασμός
  choice: Ekele
  rationale: N'ọnọdụ a, okwu ahụ na-ezo aka n'ekele mmechi nke akwụkwọ ozi; “ekele” bụ okwu Igbo dị mfe ma kwekọọ n'usoro akwụkwọ ozi.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: ka m ji aka m dee—mụ onwe m, Pọl
  rationale: Nke a na-egosi na Pọl ji aka ya dee ekele mmechi ahụ. Nsụgharị a na-eme ka ahịrịokwu Grik ahụ doro anya n'Igbo ma na-edobe nkwusi ike dị n'okwu “aka m.”
- source_word: μνημονεύετέ
  choice: Chetanụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ. “Chetanụ” bụ okwu Igbo kwụ ọtọ ma nwee ike ịgụnye ịnọgide na-echeta dịka ọnọdụ ahụ si dị.
- source_word: μου τῶν δεσμῶν
  choice: agbụ m
  rationale: δεσμοί pụtara agbụ n'ụzọ nkịtị, ma ọ na-anọchikwa anya ọnọdụ Pọl dị ka onye mkpọrọ. “Agbụ m” na-edobe ihe oyiyi siri ike nke okwu mbụ ahụ.
- source_word: ἡ χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa χάρις n'ekele ngọzi Pọl; etinyeghị onye nwe ya n'ihi na ederede Grik ekwughị kpọmkwem “nke Chineke.”
- source_word: μεθ’ ὑμῶν
  choice: Ka ... dịnyere unu
  rationale: Grik enweghị ngwaa n'ahịrịokwu ngọzi a, ma usoro “Ka ... dịnyere unu” bụ ụzọ Igbo ebumpụta ụwa si ekwu ngọzi ahụ n'agbakwụnyeghị echiche ọhụrụ.
theological_decisions:
- issue: Ngọzi mmechi Pọl nke na-enweghị ngwaa doro anya na Grik
  choice: Ka amara dịnyere unu
  alternative: Amara dịnyere unu
  rationale: Iji “Ka” na-eme ka ọ bụrụ ngọzi ma ọ bụ ọchịchọ n'Igbo doro anya, ebe ọ na-edobe ihe ederede Grik pụtara n'agbakwụnyeghị onye na-enye amara ahụ.
- issue: Ma “agbụ” ọ bụ naanị agbụ nkịtị ka ọ na-anọchi anya mkpọrọ
  choice: Edobere “agbụ m” n'isiokwu ahụ
  alternative: mkpọrọ m
  rationale: Okwu Grik ahụ na-edobe ihe oyiyi nke agbụ ma nwee ike izo aka n'ọnọdụ mkpọrọ Pọl. Nsụgharị ahụ anaghị ehichapụ njikọ abụọ a; nkọwa ala peeji na-akọwa ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu, dee ya. E ji ụdị ọtụtụ mmadụ “unu” mee ihe dịka ὑμῶν na-egosi. Akara ogologo ahịrị na-enyere aka igosi nkwusi ike Pọl tinyere n'ịkpọ aha onwe ya.
