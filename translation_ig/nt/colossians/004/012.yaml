revisions:
- from: Epafras, onye bụ otu onye n’ime unu, na-ekele unu. Ọ bụ ohu Mezaịa[a], ọ na-adọga mbọ mgbe niile n’ekpere ya maka unu, ka unu wee guzo dị ka ndị tozuru oke, bụrụkwa ndị kwenyesiri ike[b] n’ihe niile Chineke chọrọ.
  to: Epafras, onye bụ otu n’ime unu, na-ekele unu; ọ bụ ohu Mesaịa[a], na-agbasi mbọ ike mgbe niile n’ekpere ya maka unu, ka unu wee guzo, bụrụ ndị tozuru oke, ma bụrụkwa ndị kwenyesiri ike[b] n’ihe niile Chineke chọrọ.
  rationale: The revision corrects the Standard Igbo spelling of Mesaịa, removes minor redundancy, and uses more idiomatic wording for earnest striving. It also makes “mature” a direct description of the recipients, as in the Greek, while preserving the ambiguity of πεπληροφορημένοι in the footnote.
  reviewer_model: gpt-5.6-terra
