id: COL.4.12
reference: Colossians 4:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a servant of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: ig
  text: Epafras, onye bụ otu n’ime unu, na-ekele unu; ọ bụ ohu Mesaịa[a], na-agbasi mbọ ike mgbe niile n’ekpere ya maka unu, ka unu wee guzo, bụrụ ndị tozuru oke, ma bụrụkwa ndị kwenyesiri ike[b] n’ihe niile Chineke chọrọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, Kraịst—Onye Chineke tere mmanụ.
    reason: title_explanation
  - marker: b
    text: A pụkwara ịsụgharị ya, “ndị e mere ka ha guzosie ike nke ọma.” Okwu Grik ahụ nwere ike ịpụta inwe nkwenye zuru ezu ma ọ bụ ịbụ ndị e mere ka ha guzosie ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: na-ekele unu
  rationale: Nke a bụ ụzọ Igbo si ekwu ekele mmadụ na-eziga n’oge mmechi akwụkwọ ozi; ọ dị mfe ma bụrụkwa nke sitere n’echiche okwu Grik.
- source_word: ὁ ἐξ ὑμῶν
  choice: onye bụ otu onye n’ime unu
  rationale: Ọ na-egosi na Epafras so n’obodo ndị Kọlọsi; ntụgharị a doro ndị na-agụ Igbo anya.
- source_word: δοῦλος
  choice: ohu
  rationale: “Ohu” na-echekwa echiche nke ịbụ onye nwe ya na onye nọ n’okpuru ọchịchị ya kpamkpam, nke siri ike karịa naanị “onye na-eje ozi.”
- source_word: Χριστοῦ
  choice: Mezaịa
  rationale: Χριστός bụ aha ọkwá nke pụtara Onye E Tere Mmanụ; “Mezaịa” na-egosipụta aha ọkwá ahụ n’enweghị itinye “Jizọs,” nke na-adịghị n’amaokwu Grik a.
- source_word: ἀγωνιζόμενος
  choice: na-adọga mbọ
  rationale: Okwu a na-egosi ịgbasi mbọ ike ma ọ bụ ịlụ ọgụ; “na-adọga mbọ” na-echekwa ịdị ukwuu nke mgbalị ahụ n’Igbo nkịtị.
- source_word: ἐν ταῖς προσευχαῖς
  choice: n’ekpere ya
  rationale: Ọ na-eme ka o doo anya na ọ bụ Epafras na-ekpe ekpere, ma kwekọọ n’ụzọ Igbo si ekwu ya.
- source_word: ἵνα σταθῆτε
  choice: ka unu wee guzo
  rationale: “Guzo” na-echekwa onyonyo okwu Grik ahụ ma ghara itinye echiche ọzọ n’ime ya.
- source_word: τέλειοι
  choice: dị ka ndị tozuru oke
  rationale: N’ebe a, okwu ahụ na-egosi ntozu na izu oke nke mmụọ, ọ bụghị ịbụ onye na-enweghị mmehie ma ọlị.
- source_word: πεπληροφορημένοι
  choice: bụrụkwa ndị kwenyesiri ike
  rationale: Nke a na-egosi ọnọdụ nke inwe nkwenye zuru ezu; e debere nghọta ọzọ nke ịbụ ndị e mere ka ha guzosie ike n’okpuru amaokwu.
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: n’ihe niile Chineke chọrọ
  rationale: Nke a bụ Igbo doro anya nke na-echekwa obosara nke “uche Chineke niile” ma ghara ịkọwa kpọmkwem otu akụkụ naanị.
theological_decisions:
- issue: Otú e si sụgharịa Χριστοῦ n’okwu δοῦλος Χριστοῦ
  choice: ohu Mezaịa
  alternative: ohu Kraịst
  rationale: Aha ọkwá Χριστός pụtara Mezaịa, ya bụ Onye E Tere Mmanụ. E tinyeghị “Jizọs” n’ebe a n’ihi na aha ahụ adịghị n’ihe odide Grik nke amaokwu a.
- issue: Otú e si sụgharịa δοῦλος
  choice: ohu
  alternative: onye na-eje ozi
  rationale: N’okwu a, δοῦλος na-egosi nnwekọrịta na nrubeisi zuru ezu nye Mezaịa; “ohu” na-echekwa ike nke okwu ahụ.
- issue: Ihe πεπληροφορημένοι pụtara
  choice: ndị kwenyesiri ike
  alternative: ndị e mere ka ha guzosie ike nke ọma
  rationale: Okwu Grik ahụ nwere ike igosi nkwenye zuru ezu ma ọ bụ ọnọdụ siri ike nke e mere ka mmadụ guzosie ike. Isi ederede họọrọ echiche nkwenye, ebe nkọwa ala peeji chekwara nke ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ “na-adọga mbọ” iji chekwaa ike dị na ἀγωνιζόμενος, ma zere okwu egwuregwu ma ọ bụ ọgụ nke nwere ike ime ka ihe atụ ahụ sie ike karịa ihe odide Grik. A hapụrụ onyonyo “guzo” ka ọ dị, ma sụgharịa njedebe ya n’ụzọ Igbo na-asụkarị.
