  to: ka e wee gbaa obi ha ume, ebe e jikọtara ha ọnụ n’ịhụnanya, ka ha nweta akụ̀nụba niile nke nkwenye zuru ezu n’ime nghọta, ka ha matakwa ihe omimi nke Chineke—Mezaya.[a][b][c][d]
