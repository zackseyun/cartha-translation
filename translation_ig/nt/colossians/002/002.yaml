id: COL.2.2
reference: Colossians 2:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα παρακληθῶσιν αἱ καρδίαι αὐτῶν, ⸀συμβιβασθέντες ἐν ἀγάπῃ καὶ εἰς ⸂πᾶν πλοῦτος⸃ τῆς πληροφορίας τῆς συνέσεως, εἰς ἐπίγνωσιν τοῦ μυστηρίου τοῦ ⸀θεοῦ, Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/002.yaml
  text: so that their hearts may be encouraged[a], having been knit together in love and unto all the riches of the full assurance of understanding, unto the knowledge of the mystery of God, Messiah[d][c][b],
translation:
  language: ig
  text: ka e wee gbaa obi ha ume, ebe e jikọtara ha ọnụ n’ịhụnanya, ka ha nweta akụ̀nụba niile nke nkwenye zuru ezu n’ime nghọta, ka ha matakwa ihe omimi nke Chineke—Mezaya.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘ebe e mere ka ha dịrị n’otu n’ịhụnanya.’ Ngwaa Grik a nwere ike ịpụta ịkpọkọta ndị mmadụ ma ọ bụ ijikọ ha nke ọma.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ‘ịmata nke ọma’ ma ọ bụ ‘inwe ọmụma zuru ezu,’ n’ihi na okwu Grik ahụ nwere ike igosi ọmụma miri emi ma ọ bụ zuru oke.
    reason: lexical_alternative
  - marker: c
    text: 'Okwu Grik ebe a dị mkpụmkpụ ma sie ike: ‘ihe omimi nke Chineke, Mezaya.’ Nsụgharị a na-eji akara ogologo egosi na a na-aghọta ‘Mezaya’ dịka okwu nọ n’akụkụ nke na-akọwa ihe omimi ahụ; Grik ahụ n’onwe ya ekwughị ‘ya bụ.’'
    reason: alternative_reading
  - marker: d
    text: Ụfọdụ akwụkwọ aka ochie nwere ọgụgụ dị ogologo, dịka ‘ihe omimi nke Chineke, bụ Nna, na nke Kraịst.’ Nsụgharị a gbasoro ọgụgụ dị mkpụmkpụ nke ihe odide Grik e nyere.
    reason: textual_variant
lexical_decisions:
- source_word: παρακληθῶσιν αἱ καρδίαι αὐτῶν
  choice: ka e wee gbaa obi ha ume
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu n’ụzọ ebumpụta ụwa ma ka na-edobe ‘obi’ dị ka ihe atụ nke mmadụ ime; ‘ịgba ume’ na-agụnye ịkasi obi na iwusi mmadụ ike.
- source_word: συμβιβασθέντες ἐν ἀγάπῃ
  choice: ebe e jikọtara ha ọnụ n’ịhụnanya
  rationale: ‘Jikọta ... ọnụ’ na-egosipụta ime ka ndị mmadụ dị n’otu ma dịrị ibe ha nso; ‘n’ịhụnanya’ na-egosi ọnọdụ ma ọ bụ eriri nke njikọ ahụ.
- source_word: εἰς πᾶν πλοῦτος
  choice: ka ha wee nweta akụ̀nụba niile
  rationale: A sụgharịrị εἰς dị ka ebumnuche a na-erute, ebe ‘akụ̀nụba’ na-edobe ihe atụ nke πλοῦτος n’Igbo dị mfe nghọta.
- source_word: πληροφορίας τῆς συνέσεως
  choice: nkwenye zuru ezu nke nghọta na-enye
  rationale: ‘Nkwenye zuru ezu’ na-egosi obi siri ike na ntụkwasị obi; ịgbakwụnye ‘nke nghọta na-enye’ na-eme ka njikọ genitiv ahụ doo anya n’Igbo na-enweghị ịgbanwe echiche ya.
- source_word: ἐπίγνωσιν
  choice: ịmata
  rationale: ‘Ịmata’ bụ okwu Igbo dị mfe ma sara mbara; a hapụrụ ohere n’ihe odide ala peeji maka echiche nke ịmata nke ọma ma ọ bụ ọmụma zuru ezu.
- source_word: μυστηρίου
  choice: ihe omimi
  rationale: ‘Ihe omimi’ dabara n’echiche Pọl banyere nzube Chineke nke zoro ezo ma e mesịa kpughee, karịa ‘ihe nzuzo’ nkịtị.
- source_word: θεοῦ, Χριστοῦ
  choice: nke Chineke—Mezaya
  rationale: Akara ogologo na-edobe mkpụmkpụ na nrụgide nke Grik, ma na-egosi na ‘Mezaya’ nọ n’apposition n’enweghị itinye okwu nkọwa dịka ‘ya bụ’ n’ahịrị isi.
theological_decisions:
- issue: Mmekọrịta apposition dị na τοῦ μυστηρίου τοῦ θεοῦ, Χριστοῦ
  choice: ‘ihe omimi nke Chineke—Mezaya,’ ebe a na-aghọta Mezaya dị ka nkọwa apposition nke ihe omimi ahụ
  alternative: ‘ihe omimi nke Chineke, nke Mezaya’; ma ọ bụ ọgụgụ ogologo ụfọdụ akwụkwọ aka ochie nwere, dịka ‘ihe omimi nke Chineke, bụ́ Nna, na nke Kraịst’
  rationale: Ihe odide Grik e nyere dị mkpụmkpụ ma sie ike. Akara ogologo na-egosi apposition a na-ele anya na ya n’enweghị ime ka okwu Grik kwuo karịa ka o kwuru; ihe odide ala peeji na-ekwupụta ihe isi ike na ọgụgụ ndị ọzọ.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ nke ‘obi,’ ‘akụ̀nụba,’ na ‘ihe omimi’; a họọrọ ‘Mezaya’ dị ka aha ọkwa Χριστός. Akara ogologo na-enyere aka idobe mkpụmkpụ na ntakịrị mgbagwoju anya nke ahịrị Grik.
