revisions:
- from: Unu onwe unu kwa, mgbe unu bụ ndị nwụrụ anwụ n’ime njehie unu[a] nakwa n’ọnọdụ a na-ebighị unu úgwù n’anụ ahụ unu[b], o mere ka unu na ya dịrị ndụ, ebe ọ gbaghaara anyị[c] njehie anyị niile.
  to: Unu kwa, ndị nwụrụ anwụ n’ime mmehie unu[a] na n’ebighị úgwù nke anụ ahụ unu[b], o mere ka unu na ya dịrị ndụ, n’ịgbaghara anyị[c] mmehie anyị niile.
  rationale: Mmegharị ahụ na-eme ka participle mbụ bụrụ nkọwa ọnọdụ, na-asụgharị ἀκροβυστία n’ụzọ kpọmkwem, ma na-edobe ‘anụ ahụ’ na-enweghị ịkpa nkọwa doktrinel. ‘N’ịgbaghara anyị’ na-anọchi participle χαρισάμενος n’enweghị ikwu n’ụzọ siri ike ma mgbaghara ahụ bụ nanị ihe kpatara ma ọ bụ ihe mere tupu ime ka ha dị ndụ. Akara ndetu niile dị n’ebe ha kwesịrị ịdị ma dabara na ederede a gbanwere.
