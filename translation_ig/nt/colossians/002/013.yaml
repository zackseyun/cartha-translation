review_pass:
  verdict: revise
  source_fidelity: A chọrọ mmezi iji wepụ nghọta oge na-adịghị n’akụkụ participle νεκροὺς ὄντας ('mgbe unu bụ') ma mee ka ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν pụta kpọmkwem. E debere ἐν ugboro abụọ, njikọ iso Kraịst, na mgbanwe nnọchiaha site na 'unu' ruo 'anyị'.
  naturalness: '''Ndị nwụrụ anwụ'' bụ ụzọ Igbo dị mma isi rụọ ọrụ participle ahụ n’enweghị itinye ''mgbe''. ''N’ebighị úgwù nke anụ ahụ unu'' dị mkpirikpi, doo anya, ma kwekọọ na asụsụ Baịbụl Igbo karịa nkọwa ogologo ''ọnọdụ a na-ebighị unu úgwù''. ''N’ịgbaghara'' na-arụ ọrụ participial n’ụzọ eke.'
  terminology: A gbanwere 'njehie' ka ọ bụrụ 'mmehie', okwu Standard Igbo a na-ejikarị maka παράπτωμα n’ọnọdụ Pọl banyere mmehie na mgbaghara. A hapụrụ 'anụ ahụ' kama ịsụgharị ya dị ka 'ọdịdị mmehie', ma a hapụrụ 'ya' n’enweghị itinye aha Kraịst n’ederede.
