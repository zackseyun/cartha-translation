id: COL.2.13
reference: Colossians 2:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὑμᾶς νεκροὺς ὄντας ⸀ἐν τοῖς παραπτώμασιν καὶ τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν, συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ· χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/013.yaml
  text: And you[a], being dead in your trespasses and the uncircumcision of your flesh, he made alive together with him, having forgiven us all our trespasses[c][b],
translation:
  language: ig
  text: Unu kwa, ndị nwụrụ anwụ n’ime mmehie unu[a] na n’ebighị úgwù nke anụ ahụ unu[b], o mere ka unu na ya dịrị ndụ, n’ịgbaghara anyị[c] mmehie anyị niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “mmehie” dịka “mmejọ.”
    reason: lexical_alternative
  - marker: b
    text: “Ebighị úgwù nke anụ ahụ unu” na-ezo kpọmkwem n’ọnọdụ anụ ahụ ha dịka ndị a na-ebighị úgwù, ọ bụ ezie na n’ọnọdụ okwu a, ọ nwekwara mkpa ime mmụọ.
    reason: cultural_note
  - marker: c
    text: 'Okwu Grik gbanwere site n’“unu” gaa n’“anyị”: “n’ịgbaghara anyị mmehie anyị niile.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: mgbe unu bụ ndị nwụrụ anwụ
  rationale: Nke a na-egosipụta ọnọdụ nke participle ahụ—na ha nọ n’ọnọdụ ọnwụ—n’ụzọ Igbo dị mfe ma ghara ime ka ọ bụrụ naanị ọnwụ anụ ahụ.
- source_word: ἐν τοῖς παραπτώμασιν
  choice: n’ime njehie unu
  rationale: “N’ime” na-edobe ἐν na echiche nke ịnọ n’ọnọdụ ma ọ bụ n’okpuru ọchịchị njehie, kama ịkọwa ya nanị dị ka ihe kpatara ọnwụ ahụ.
- source_word: ἀκροβυστίᾳ
  choice: n’ọnọdụ a na-ebighị unu úgwù
  rationale: Nke a na-egosi ọnọdụ ịbụ ndị a na-ebighị úgwù, nke bụ isi ihe okwu Grik ahụ pụtara n’ebe a, ma na-ezere okwu nwere ike ịdị ka ọ na-ekwu naanị akụkụ ahụ.
- source_word: τῆς σαρκὸς ὑμῶν
  choice: n’anụ ahụ unu
  rationale: “Anụ ahụ” na-edobe ihe okwu a na-ekwu kpọmkwem banyere ahụ mmadụ, n’enweghị ịgbanwe ya ka ọ bụrụ “ọdịdị mmehie,” bụ́ nkọwa a na-amanyeghị n’ebe a.
- source_word: συνεζωοποίησεν ... σὺν αὐτῷ
  choice: o mere ka unu na ya dịrị ndụ
  rationale: Nkebi a na-edobe ma ime ka ha dị ndụ ma mmekọ ha na onye a na-ekwu maka ya. A hapụrụ “ya” dịka nnọchiaha, dị ka ọ dị na Grik.
- source_word: χαρισάμενος
  choice: ebe ọ gbaghaara
  rationale: Nke a na-ejikọta mgbaghara ahụ na ime ka ha dị ndụ, ma jiri okwu Igbo nkịtị maka ịgbaghara mmehie.
- source_word: ἡμῖν
  choice: anyị
  rationale: E debere mgbanwe Grik si n’“unu” gaa n’“anyị” kama ime ka ha bụrụ otu.
- source_word: πάντα τὰ παραπτώματα
  choice: njehie anyị niile
  rationale: Nke a na-edobe nkwughachi παράπτωμα na ike nke πάντα, ya bụ, mgbaghara njehie niile.
theological_decisions:
- issue: Ihe τῆς σαρκὸς ὑμῶν pụtara
  choice: “n’anụ ahụ unu,” nke na-ezo n’ụzọ kachasị nso n’ọnọdụ anụ ahụ nke ịbụ ndị a na-ebighị úgwù
  alternative: “n’ọdịdị mmehie unu”
  rationale: Ọnọdụ okwu banyere ibi úgwù na 2:11–13 na-akwado ihe anụ ahụ pụtara ozugbo, ọ bụ ezie na okwu ahụ nwekwara mkpa ime mmụọ n’ebe a. Ịsụgharị ya “ọdịdị mmehie” ga-ekpebi ihe ederede ahụ hapụrụ ka ọ nwee nghọta abụọ.
- issue: Onye αὐτῷ na-ezo aka na ya
  choice: E debere nnọchiaha ahụ dịka “ya”; n’ọnọdụ okwu a ọ na-ezo aka na Kraịst.
  alternative: Ịkpọ aha ahụ ozugbo dịka “Kraịst” ma ọ bụ ịghọta ya dịka Chineke.
  rationale: Amaokwu bu ụzọ na-ekwu maka iso Kraịst nwụọ ma bilie, ya mere Kraịst bụ onye nnọchiaha ahụ kacha nso na-ezo aka na ya. Ma ide “ya” na-edobe ụdị okwu Grik ma ghara itinye aha na-adịghị n’ahịrịokwu ahụ.
- issue: Mgbanwe si ὑμᾶς gaa ἡμῖν
  choice: E debere “unu” na “anyị” dịka mgbanwe dị na Grik.
  alternative: Ime ha abụọ “unu” ma ọ bụ “anyị.”
  rationale: Mgbanwe ahụ nwere ike ịgbasa okwu ahụ site n’aka ndị Kọlọsi ruo n’ebe Pọl na ndị kwere ekwe niile nọ; ekwesịghị ihichapụ ya site n’ime ka nnọchiaha ahụ kwekọọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Unu onwe unu kwa” na-eme ka ihe a na-ekwu banyere ndị na-agụ akwụkwọ pụta ìhè; “n’ọnọdụ a na-ebighị unu úgwù” na-akọwa aha Grik ahụ n’ụzọ eke n’Igbo, ebe “anụ ahụ” na-echekwa nghọta ya kpọmkwem na ụda ime mmụọ ya.
