revisions:
- from: N’ime ya ka e birikwara unu ugwu site n’ibi ugwu nke aka mmadụ na-emeghị[a], n’iyipụ ahụ nke anụ ahụ[b][c], n’ibi ugwu nke Mesaịa[d].
  to: N’ime ya ka e birikwara unu ugwu site n’ibi ugwu nke aka mmadụ na-emeghị[a], n’iwepụ ahụ nke anụ ahụ[b][c], n’ibi ugwu nke Mesaịa[d].
  rationale: A small lexical and idiomatic revision replaces the main-text nominal 'n’iyipụ' with 'n’iwepụ,' which naturally conveys ἀπεκδύσει without resolving the phrase’s metaphorical force. The footnote now supplies 'n’iyipụ' as the close alternative for 'stripping off.' All source ambiguities, theological restraint, terminology, and existing anchors are preserved.
