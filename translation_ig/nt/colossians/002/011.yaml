id: COL.2.11
reference: Colossians 2:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ περιετμήθητε περιτομῇ ἀχειροποιήτῳ ἐν τῇ ἀπεκδύσει τοῦ ⸀σώματος τῆς σαρκός, ἐν τῇ περιτομῇ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/011.yaml
  text: In him you also were circumcised with a circumcision not made by hands[a], in the removal of the body of flesh, in the circumcision of Messiah[e][d][c][b],
translation:
  language: ig
  text: N’ime ya ka e birikwara unu ugwu site n’ibi ugwu nke aka mmadụ na-emeghị[a], n’iwepụ ahụ nke anụ ahụ[b][c], n’ibi ugwu nke Mesaịa[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ibi ugwu a na-ejighị aka mee.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’iyipụ ahụ nke anụ ahụ.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịghọta “anụ ahụ” n’ụzọ nkọwa dịka ọdịdị mmehie, ma a hapụrụ okwu Grik ahụ n’ụdị nkịtị ebe a.
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “site n’ibi ugwu nke Mesaịa,” “ibi ugwu Mesaịa mere,” ma ọ bụ “ibi ugwu nke bụ nke Mesaịa.” Grik nwere ike ịpụta ibi ugwu Mesaịa mere, nke bụ nke ya, ma ọ bụ nke metụtara ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: N’ime ya
  rationale: Nkebi a na-ezo aka na Mesaịa e kwuru okwu ya n’amaokwu ndị bu ụzọ. “N’ime ya” bụ Igbo doro anya nke na-echekwa echiche nke ịdị n’otu na ya.
- source_word: περιετμήθητε
  choice: ka e birikwara unu ugwu
  rationale: Nke a na-egosi ihe e mere unu, dị ka ngwaa Grik nke nọ n’ụdị nnara ma na-ekwu maka ihe e mechara eme. E debere okwu ibi ugwu ka ihe atụ Pọl ji ghara ịla n’iyi.
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: site n’ibi ugwu nke aka mmadụ na-emeghị
  rationale: “Site na” na-egosi ụzọ ma ọ bụ ihe e ji mee ya; “nke aka mmadụ na-emeghị” na-echekwa ọdịiche dị n’etiti ihe mmadụ mere na ihe sitere n’ọrụ Chineke.
- source_word: ἐν τῇ ἀπεκδύσει
  choice: n’iyipụ
  rationale: Okwu a pụtara iyipụ ma ọ bụ iwepụ ihe dị ka uwe. “Iyipụ” na-echekwa ihe atụ ahụ ma bụrụkwa Igbo a na-aghọta ngwa ngwa.
- source_word: τοῦ σώματος τῆς σαρκός
  choice: ahụ nke anụ ahụ
  rationale: A hapụrụ usoro okwu a n’ụdị na-adịghị ekpebi kpamkpam ma ọ bụ ahụ mmadụ nkịtị, ndụ nke anụ ahụ na-achị, ma ọ bụ ọnọdụ ochie ka e bu n’obi.
- source_word: σαρκός
  choice: anụ ahụ
  rationale: A họọrọ okwu pụtara “flesh” n’ụzọ nkịtị kama ịkọwa ya ozugbo dịka “ọdịdị mmehie,” ka obosara na mgbagwoju anya nke okwu Pọl dịrị.
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: n’ibi ugwu nke Mesaịa
  rationale: '“Nke Mesaịa” na-ahapụ njikọ dị na genitive Grik ka ọ ghere oghe: o nwere ike ịbụ ibi ugwu Mesaịa na-eme, nke metụtara ya, ma ọ bụ nke bụ nke ya.'
theological_decisions:
- issue: Ihe “ibi ugwu nke Mesaịa” pụtara
  choice: 'E debere ya dịka genitive ghere oghe: “ibi ugwu nke Mesaịa.”'
  alternative: “ibi ugwu Mesaịa mere” ma ọ bụ “ibi ugwu e biri Mesaịa n’onwe ya”
  rationale: τοῦ Χριστοῦ anaghị ekpebi ụdị njikọ ahụ n’onwe ya. Ịhapụ ya otú a na-echekwa esemokwu nkọwa ahụ ma ghara itinye ozizi otu ụka n’ime amaokwu ahụ.
- issue: Ihe “ahụ nke anụ ahụ” pụtara
  choice: E debere okwu ahụ n’ụdị dị nso na Grik, n’enweghị ịgbasa ya ka ọ bụrụ “ọdịdị mmehie.”
  alternative: “ahụ nke ọchịchọ anụ ahụ na-achị” ma ọ bụ “ọdịdị mmehie”
  rationale: Nkebi Grik ahụ siri ike ma nwee ihe karịrị otu ụzọ e si aghọta ya. Nsụgharị a anaghị etinye nkọwa e mesịrị ma ọ bụ okwu ndị na-adịghị na SBLGNT.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ibi ugwu” bụ okwu Igbo a na-ejikarị akọwa circumcision; e zere nkọwa ụka pụrụ iche, ma e chekwara nkwughachi na mgbagwoju anya dị n’usoro Grik.
