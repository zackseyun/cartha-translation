id: COL.2.18
reference: Colossians 2:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: ig
  text: Ka onye ọ bụla ghara ikpebi na unu erughị eru inweta ihe nrite ahụ. Onye dị otú ahụ na-enwe mmasị n’ịdị umeala n’obi na ife ndị mmụọ ozi[a]; ọ na-anọgide na-atụgharị uche n’ihe ọ hụrụ[c][b], ebe uche nke anụ ahụ ya na-eme ka o jiri mpako na-afụli onwe ya elu n’efu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okpukpe nke ndị mmụọ ozi,” ma ọ bụ, “iso ndị mmụọ ozi na-efe ofufe.” A pụrụ ịghọta nkebiokwu Grik ahụ n’ụzọ karịrị otu.
    reason: alternative_reading
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie nwere “ihe ọ na-ahụghị” kama “ihe ọ hụrụ,” nke ga-enye echiche dịka, “na-ekwu ọtụtụ ihe banyere ihe ọ na-ahụghị.”
    reason: textual_variant
  - marker: c
    text: Ma ọ bụ, “na-anọgide n’ihe ọ hụrụ,” ma ọ bụ, “na-abanye n’ime ihe ọ hụrụ.” Ngwaa Grik ahụ anaghị adịkarị, ọ dịkwa ike ịkọwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβραβευέτω
  choice: kpebie na unu erughị eru inweta ihe nrite ahụ
  rationale: Nke a na-egosipụta oyiyi nke onye ọkaikpe egwuregwu nke na-ekpe mmadụ ikpe megide ya, si otú ahụ mee ka ọ ghara iru eru ma ọ bụ ghara inweta ihe nrite.
- source_word: θέλων
  choice: na-enwe mmasị
  rationale: N’usoro okwu a, participle ahụ na-egosi mmasị ma ọ bụ obi ụtọ onye ahụ nwere n’omume ndị a, ọ bụghị naanị ọchịchọ nkịtị.
- source_word: ταπεινοφροσύνῃ
  choice: ịdị umeala n’obi
  rationale: Nke a bụ ihe okwu Grik ahụ na-apụtakarị. Ọnọdụ okwu ahụ na-egosi na ịdị umeala n’obi a nwere ike ịbụ nke ngosi ma ọ bụ nke ịta onwe ahụhụ, ma e tinyebeghị nkọwa ahụ n’ime isiokwu.
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: ife ndị mmụọ ozi
  rationale: A họọrọ nghọta nke na-ewere ndị mmụọ ozi dị ka ndị a na-efe; e debere nghọta ndị ọzọ n’okpuru peeji n’ihi na genitive Grik ahụ edoghị anya kpamkpam.
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: na-anọgide na-atụgharị uche n’ihe ọ hụrụ
  rationale: ἐμβατεύω bụ okwu na-adịkebeghị ma sie ike. Nsụgharị a na-egosi itinye uche ma ọ bụ ịnọgide n’ahụmahụ ọhụụ ndị ahụ, ma ihe ndị ọzọ ọ pụrụ ịpụta dị n’okpuru peeji.
- source_word: εἰκῇ
  choice: n’efu
  rationale: Ọ na-egosi na mpako ahụ enweghị ezi ihe ndabere ma ọ bụ uru.
- source_word: φυσιούμενος
  choice: na-afụli onwe ya elu
  rationale: Nke a na-edebe oyiyi Pọl ji ekwu maka mpako na nganga.
- source_word: νοὸς
  choice: uche
  rationale: ‘Uche’ bụ okwu Igbo dabara adaba ma na-edebe nkebiokwu ahụ nkenke.
- source_word: σαρκὸς
  choice: anụ ahụ
  rationale: A sụgharịrị σάρξ n’ụzọ nkịtị ka a ghara itinye nkọwa ozizi dịka ‘ọdịdị mmehie’ n’ime ederede.
theological_decisions:
- issue: Ihe θρησκείᾳ τῶν ἀγγέλων pụtara
  choice: ife ndị mmụọ ozi, ya bụ ofufe a na-enye ndị mmụọ ozi
  alternative: ofufe nke ndị mmụọ ozi, ma ọ bụ iso ndị mmụọ ozi na-efe ofufe
  rationale: Nkebiokwu genitive ahụ nwere nghọta karịrị otu. Isiokwu họọrọ nghọta a na-ahụkarị na nke kwekọrọ n’ịdọ aka ná ntị banyere omume okpukpe ụgha, ebe ihe ndị ọzọ e nwere ike ịghọta dị n’okpuru peeji.
- issue: Ihe σάρξ pụtara na τῆς σαρκὸς αὐτοῦ
  choice: anụ ahụ
  alternative: ọdịdị mmehie
  rationale: Nsụgharị nkịtị na-edebe esemokwu dị n’echiche Pọl ma zere ịtụgharị okwu ahụ ka ọ bụrụ nkọwa ozizi a haziri ahazi.
- issue: Ọgụgụ ἃ ἑόρακεν
  choice: ihe ọ hụrụ
  alternative: ihe ọ na-ahụghị
  rationale: A gbasoro ederede SBLGNT n’isiokwu, ma e gosiri ọgụgụ ụfọdụ akwụkwọ aka ochie n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. E kewara ahịrịokwu ogologo Grik ahụ ụzọ abụọ iji mee ka ọ bụrụ nke eke n’Igbo, ma e debere njikọ echiche ya. E ji “uche nke anụ ahụ ya” chekwaa asụsụ Pọl n’agbanyeghị na ọ bụ nkebiokwu siri ike; akara [a], [b], na [c] niile dị n’isiokwu.
