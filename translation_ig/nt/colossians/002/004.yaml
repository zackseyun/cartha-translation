  text: ⸀τοῦτο λέγω ἵνα ⸀μηδεὶς ὑμᾶς παραλογίζηται ἐν πιθανολογίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/004.yaml
  text: I say this so that no one may deceive you with persuasive argument.
translation:
  language: ig
  text: Ana m ekwu nke a ka onye ọ bụla ghara iji okwu na-eme ka mmadụ kwenye duhie unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “iji okwu yiri ihe ziri ezi,” ma ọ bụ, “iji okwu na-adọrọ adọrọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: nke a
  rationale: Nnọchiaha ngosi a dị n’otu, ọ na-arụtụ aka n’ihe Pọl kwuru tupu nke a n’akọwaghị ókè ihe ahụ ruru.
- source_word: λέγω
  choice: Ana m ekwu
  rationale: Nke a na-egosipụta ngwaa dị n’oge ugbu a n’ụzọ doro anya ma bụrụkwa okwu Igbo a na-asụkarị.
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ na-egosipụta ebumnuche nke okwu Pọl n’ụzọ dị nkenke ma kwekọọ n’Igbo.
- source_word: μηδεὶς
  choice: onye ọ bụla ghara
  rationale: Usoro a bụ ụzọ ebumpụta ụwa e si egosipụta ‘ọ dịghị onye’ n’ahịrịokwu ebumnuche na Igbo.
- source_word: ὑμᾶς
  choice: unu
  rationale: ‘Unu’ na-echekwa nke ọma na nnọchiaha Grik a na-ezo aka n’ọtụtụ mmadụ.
- source_word: παραλογίζηται
  choice: duhie
  rationale: ‘Duhie’ na-enye echiche nke ime ka mmadụ hie ụzọ site n’echiche ma ọ bụ okwu aghụghọ, n’etinyeghị nkọwa karịrị ihe odide ahụ kwuru.
- source_word: ἐν πιθανολογίᾳ
  choice: iji okwu na-eme ka mmadụ kwenye
  rationale: ‘Iji’ na-egosipụta ụzọ e si eduhie, ebe ‘okwu na-eme ka mmadụ kwenye’ na-eburu echiche nke okwu na-adọrọ ma ọ bụ na-ada ka o kwesiri ntụkwasị obi, n’agbanyeghị na ọ bụghị eziokwu.
theological_decisions:
- issue: Ụdị ịdọ aka ná ntị dị na παραλογίζηται ἐν πιθανολογίᾳ
  choice: Ịdọ aka ná ntị ka a ghara ikwe ka okwu na-eme ka mmadụ kwenye duhie mmadụ, n’akọwaghị ozizi pụrụ iche e bu n’obi.
  alternative: Ịkọwa ya kpọmkwem dị ka ịdọ aka ná ntị megide nkà ihe ọmụma ụgha ma ọ bụ naanị okwu e ji nka kwuo.
  rationale: Amaokwu Grik a n’onwe ya ekwughị usoro ozizi a kapịrị ọnụ; ya mere nsụgharị ahụ na-echekwa obosara na esemokwu dị n’okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Unu’ na-eme ka ọtụtụ ndị a na-agwa okwu pụta ìhè; e zere okwu ụka nke otu òtù ma ọ bụ nkọwa ozizi a na-etinyeghị n’ihe odide Grik.
