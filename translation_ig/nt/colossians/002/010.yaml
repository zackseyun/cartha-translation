- from: E meela kwa ka unu jupụta n’ime ya[a]; ya onwe ya bụ isi[b] nke onye ọchịchị ọ bụla na ikike ọ bụla.
  to: E meela kwa ka unu jupụta n’ime ya[a]; ya onwe ya bụ isi[b] nke ọchịchị na ikike niile.
