  text: καὶ ἐστὲ ἐν αὐτῷ πεπληρωμένοι, ὅς ἐστιν ἡ κεφαλὴ πάσης ἀρχῆς καὶ ἐξουσίας,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/010.yaml
  text: and in him you have been made full, who is the head of every ruler and authority.
translation:
  language: ig
  text: E meela kwa ka unu jupụta n’ime ya[a]; ya onwe ya bụ isi[b] nke ọchịchị na ikike niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “e mejupụtala unu” ma ọ bụ “e meela ka unu zuo oke.”
    reason: lexical_alternative
  - marker: b
    text: “Isi” na-edobe ihe atụ dị n’asụsụ Grik; n’ebe a, echiche ya bụ na ọ dị elu karịa ọchịchị na ikike niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: kwa
  rationale: E ji “kwa” jikọta okwu a na arụmụka dị n’amaokwu bu ya ụzọ n’ụzọ Igbo si ada nke ọma.
- source_word: ἐστὲ … πεπληρωμένοι
  choice: E meela ka unu jupụta
  rationale: Nke a na-egosi ihe e merela nke ihe ọ rụpụtara ka dị ugbu a, ma na-edobekwa nghọta nke passive na ihe atụ nke uju.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Ọ na-edobe okwu Pọl dị mkpirikpi banyere ịdị n’ime Kraịst, n’enweghị ịkọwa njikọ ahụ karịa ihe Grik kwuru.
- source_word: ὅς ἐστιν
  choice: ya onwe ya bụ
  rationale: Ọ na-ezo aka n’ụzọ doro anya n’ebe Kraịst nọ ma na-eme ka ahịrịokwu ahụ bụrụ Igbo eke.
- source_word: ἡ κεφαλὴ
  choice: isi
  rationale: “Isi” bụ ntụgharị kpọmkwem nke ihe atụ Grik ahụ; ọ naghị agbanwe ya ozugbo ka ọ bụrụ naanị “onye ọchịchị.”
- source_word: πάσης ἀρχῆς καὶ ἐξουσίας
  choice: onye ọchịchị ọ bụla na ikike ọ bụla
  rationale: Nke a na-egosi na okwu ahụ gbasara ha niile n’otu n’otu, ma na-ekewapụ echiche nke onye na-achị na nke ikike n’ụzọ ndị na-agụ Igbo ga-aghọta.
theological_decisions:
- issue: Ihe “ịjupụta” nke ndị kwere ekwe n’ime Kraịst pụtara
  choice: E debere okwu nke uju na omume Chineke mere nke nsonaazụ ya ka dị, n’enweghị ime ya ozugbo ka ọ bụrụ ozizi zuru ezu banyere izu okè ma ọ bụ enweghị mmehie.
  alternative: Ịsị na ndị kwere ekwe ‘ezuola oke’ ma ọ bụ na ọ dịghị ihe ọ bụla fọdụrụ ha mkpa maka nzọpụta.
  rationale: “E meela ka unu jupụta” na-ejikọta amaokwu a na uju e kwuru banyere Kraịst n’amaokwu gara aga, ma na-ahapụ obosara nke okwu Pọl ka ọ dị.
- issue: Ike nke κεφαλή n’ebe ndị ọchịchị na ikike dị
  choice: E debere ihe atụ “isi,” ebe ọnọdụ okwu ahụ na-egosi ịdị elu Kraịst karịa ndị ọchịchị na ikike niile.
  alternative: Ịsụgharị κεφαλή dị ka “isi mmalite” nke ndị ọchịchị na ikike niile.
  rationale: N’ọnọdụ a, okwu banyere ike dị iche iche na-akwado nghọta nke ịdị elu na ọchịchị; ma isi ederede ka na-edobe ihe atụ Grik ahụ kama idozi esemokwu lexical ahụ n’onwe ya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “unu” kwuo ndị a na-agwa n’ọnụọgụgụ, “n’ime ya” wee debe okwu nkà mmụta okpukpe Pọl n’enweghị ịgbatị nkọwa ya.
