    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s formal treatment of the Head and the intentionally open genitive in "uto nke Chineke." It removes the added reference to bones, improves the rendering of the body’s being supplied and united, and makes the final growth expression both natural in Standard Igbo and closer to the Greek construction.
