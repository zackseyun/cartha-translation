id: COL.2.19
reference: Colossians 2:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὐ κρατῶν τὴν κεφαλήν, ἐξ οὗ πᾶν τὸ σῶμα διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον αὔξει τὴν αὔξησιν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: ig
  text: ma ọ naghị ejidesi Isi ahụ ike[a]. Ọ bụkwa site n’Isi ahụ ka ahụ dum, nke a na-enye ihe dị ya mkpa ma na-ejikọta ọnụ site na nkwonkwo na eriri njikọ[b], na-eto n’uto nke Chineke[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ naghị araparasi Isi ahụ ike.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site na nkwonkwo na eriri njikọ, a na-azụ ya ma na-ejikọta ya ọnụ.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “ahụ ahụ na-eto uto nke Chineke”; okwu a nwere ike ịpụta uto nke sitere n’aka Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατῶν
  choice: ejidesi ... ike
  rationale: Nke a na-egosi ijidesi ihe ike ma ọ bụ ịnọgide na-arapara n’ahụ ya, ọ bụghị nanị imetụ ya aka.
- source_word: κεφαλήν
  choice: Isi ahụ
  rationale: Ọ na-edobe ihe atụ nke isi na ahụ; n’ebe a, Isi ahụ bụ Kraịst.
- source_word: ἐξ οὗ
  choice: site n’Isi ahụ
  rationale: E kwughachiri onye okwu ahụ na-ezo aka na ya ka njikọ ahịrịokwu ahụ doo anya n’Igbo, ma chekwaa echiche nke isi mmalite.
- source_word: πᾶν τὸ σῶμα
  choice: ahụ dum
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwụ ọtọ isi kwuo ahụ ahụ niile dịka otu ihe.
- source_word: ἁφῶν
  choice: nkwonkwo
  rationale: N’ihe atụ gbasara ahụ mmadụ, okwu a na-ezo aka n’ebe akụkụ ahụ na-ejikọta.
- source_word: συνδέσμων
  choice: eriri ndị na-ejikọta ọkpụkpụ
  rationale: Nkọwa a bụ Igbo doro anya maka ligaments ma na-echekwa ọrụ ha nke ijikọ akụkụ ahụ ọnụ.
- source_word: ἐπιχορηγούμενον
  choice: a na-enye ... ihe dị ya mkpa
  rationale: Ọ na-egosi na a na-enye ahụ ahụ ihe na-akwado ya; ọ naghị amachi ihe ahụ nanị n’ihe oriri.
- source_word: συμβιβαζόμενον
  choice: na-ejikọta ya ọnụ
  rationale: Ọ na-egosi ime ka akụkụ dị iche iche bụrụ otu ahụ jikọtara ọnụ.
- source_word: αὔξει
  choice: ana-etokwa
  rationale: Ọ na-aga n’ihu n’ihe atụ nke ahụ dị ndụ nke na-eto.
- source_word: τὴν αὔξησιν τοῦ θεοῦ
  choice: uto nke Chineke
  rationale: Nke a na-esochi ọdịdị genitive nke Grik ma hapụkwa nghọta ya n’ụzọ sara mbara; ndetu ala kọwara na ọ pụrụ ịpụta uto sitere n’aka Chineke.
theological_decisions:
- issue: Ihe genitive dị na τὴν αὔξησιν τοῦ θεοῦ pụtara
  choice: uto nke Chineke
  alternative: uto nke sitere n’aka Chineke
  rationale: Nsụgharị isi na-echekwa mkpakọ na ntakịrị mgbagwoju anya dị n’asụsụ Grik, kama ikpebi n’ime ederede na genitive ahụ bụ naanị nke isi mmalite. Ndetu ala na-enye nghọta ahụ a na-ahụkarị.
- issue: Onye “Isi ahụ” na-anọchi anya ya
  choice: E debere ihe atụ ahụ n’enweghị itinye “Kraịst” n’ederede
  alternative: Kraịst, bụ́ Isi ahụ
  rationale: Ọnọdụ okwu na-egosi na ọ bụ Kraịst, ma isi mmalite kwuru “Isi”; idobe ya na-echekwa ihe atụ Pọl ji ahụ na isi mee.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ nke Isi na ahụ ka ọ dị; a kọwara “ligaments” n’ụzọ ndị na-agụ akwụkwọ nkịtị ga-aghọta. Akara ndetu ala [a], [b], na [c] niile dị n’ederede.
