language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μὴ οὖν τις ὑμᾶς κρινέτω ἐν βρώσει ⸀ἢ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νουμηνίας ἢ σαββάτων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/016.yaml
  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: ig
  text: Ya mere, unu ekwela ka onye ọ bụla maa unu ikpe[a] n’ihe banyere ihe oriri ma ọ bụ ihe ọṅụṅụ[b], ma ọ bụ n’ihe banyere ememme, ememme ọnwa ọhụrụ, ma ọ bụ ụbọchị izu ike[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kpee unu ikpe.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, n’ihe banyere iwu ma ọ bụ ụkpụrụ gbasara ihe a na-eri na ihe a na-aṅụ.
    reason: cultural_note
  - marker: c
    text: 'Usoro “ememme, ememme ọnwa ọhụrụ, ma ọ bụ ụbọchị izu ike” na-atụ aka n’usoro ụbọchị nsọ ndị Juu: nke a na-eme kwa afọ, kwa ọnwa, na kwa izu.'
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ οὖν τις
  choice: Ya mere, unu ekwela ka onye ọ bụla
  rationale: “Ya mere” na-egosi njikọ nkwubi okwu οὖν na ihe e kwuru tupu ya; usoro “unu ekwela ka onye ọ bụla” na-ebupụta mmachibido Μὴ ... κρινέτω n’Igbo dị ndụ.
- source_word: ὑμᾶς κρινέτω
  choice: maa unu ikpe
  rationale: “Ịma mmadụ ikpe” bụ ụzọ Igbo kwụ ọtọ si egosi ikpe mmadụ ma ọ bụ ịkatọ ya n’ihe ndị a; nkọwa ọzọ dị na ndetu [a] na-echekwa obosara okwu Grik ahụ.
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: n’ihe banyere ihe oriri ma ọ bụ ihe ọṅụṅụ
  rationale: βρῶσις na πόσις nwere ike ịpụta iri/ịṅụ ma ọ bụ nri/ihe ọṅụṅụ. N’usoro a gbasara omume a na-edebe, aha ihe ndị ahụ dabara nke ọma, ebe “n’ihe banyere” na-ebupụta ọrụ ἐν n’ụzọ Igbo doro anya.
- source_word: ἐν μέρει ἑορτῆς
  choice: n’ihe banyere ememme
  rationale: ἐν μέρει bụ akpaalaokwu pụtara “n’ihe banyere,” ọ bụghị “n’otu akụkụ.” “Ememme” na-egosi ἑορτή dịka ememme okpukpe n’enweghị itinye nkọwa na-adịghị n’amaokwu ahụ.
- source_word: νουμηνίας
  choice: ememme ọnwa ọhụrụ
  rationale: Okwu ahụ na-ezo aka n’ememme a na-eme mgbe ọnwa ọhụrụ pụtara. Ịgụnye “ememme” na-eme ka ọ pụta ìhè n’Igbo na ọ bụghị naanị ọnwa n’onwe ya ka a na-ekwu.
- source_word: σαββάτων
  choice: ụbọchị izu ike
  rationale: Nke a bụ okwu Igbo kwụ ọtọ ma ghọta ngwa ngwa maka ụbọchị Sabbath. Ọ na-echekwa echiche banyere ụbọchị ndị a na-edebe, ọ bụ ezie na Igbo anaghị egosi ọtụtụ dịka Grik n’otu ụzọ ebe a.
theological_decisions:
- issue: Ụdị ihe ndị e depụtara na ihe amaokwu ahụ na-ekwu banyere ha
  choice: Amaokwu ahụ machibidoro mmadụ ikpe ndị kwere ekwe n’ihe gbasara nri, ihe ọṅụṅụ, na ụbọchị nsọ; ọ naghị ekwu kpọmkwem n’amaokwu a naanị ya na e kagbuola omume ndị ahụ kpamkpam.
  alternative: Ịsụgharị ya dịka nkwupụta na a kagbuola ememme na ụbọchị izu ike niile, ma ọ bụ dịka ihe na-ekwu naanị banyere iwu ndị mmadụ chepụtara.
  rationale: Grik lekwasịrị anya n’omume nke ikpe mmadụ “n’ihe banyere” ihe ndị a. Nsụgharị ahụ na-echekwa isi okwu a ma ghara idozi esemokwu nkà mmụta okpukpe nke amaokwu ahụ n’onwe ya na-adịghị edozi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Maa unu ikpe” bụ okwu a na-anụkarị ma ka na-echekwa ịdị arọ nke κρίνω; “ememme ọnwa ọhụrụ” na “ụbọchị izu ike” na-enye onye na-agụ ya nghọta ozugbo banyere kalenda nsọ ndị Juu.
