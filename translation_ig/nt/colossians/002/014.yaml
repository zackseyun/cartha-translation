id: COL.2.14
reference: Colossians 2:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξαλείψας τὸ καθ’ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου προσηλώσας αὐτὸ τῷ σταυρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/014.yaml
  text: having wiped out the record of debt against us in decrees[a], which was opposed to us, and he has taken it out of the way[b], having nailed it to the cross.
translation:
  language: ig
  text: Ọ hichapụrụ ihe e ji aka dee banyere ụgwọ dị anyị n’isi[a], bụ́ nke dị n’iwu ndị e nyere[b] ma na-emegide anyị; o wepụla ya n’ụzọ site n’ịkpọgide ya n’obe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “akwụkwọ akaebe nke ụgwọ” ma ọ bụ “ihe e dere ede.” Okwu Grik a nwere ike ịpụta akwụkwọ e ji aka dee nke na-egosi ụgwọ ma ọ bụ ọrụ iwu chọrọ ka mmadụ mezuo.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị nkebi a “n’iwu ndị e nyere” ma ọ bụ “nke iwu ndị e nyere mejupụtara.” Ụzọ okwu Grik si dị nwere ike ịpụta na akwụkwọ ụgwọ ahụ dị n’iwu ma ọ bụ na iwu ndị ahụ bụ ihe mejupụtara ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαλείψας
  choice: Ọ hichapụrụ
  rationale: “Hichapụrụ” na-egosi ihichapụ ihe e dere ka ọ ghara ịdịkwa, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: χειρόγραφον
  choice: ihe e ji aka dee banyere ụgwọ dị anyị n’isi
  rationale: Nke a na-echekwa ma echiche nke akwụkwọ e ji aka dee ma echiche nke ụgwọ ma ọ bụ ibu iwu dị n’isi mmadụ, n’ebughị ụzọ kpebie kpọmkwem ụdị akwụkwọ iwu ọ bụ.
- source_word: καθ’ ἡμῶν
  choice: banyere ụgwọ dị anyị n’isi
  rationale: N’ime ihe atụ nke akwụkwọ ụgwọ, okwu a na-egosi na ihe e dere guzoro megide anyị ma na-ebo anyị ibu ọrụ.
- source_word: τοῖς δόγμασιν
  choice: n’iwu ndị e nyere
  rationale: Nke a na-egosi njikọ dị n’etiti akwụkwọ ụgwọ ahụ na iwu ma ọ bụ ụkpụrụ ndị e nyere, ma nkọwa ala peeji na-echekwa mgbagwoju anya dị n’ụzọ okwu Grik si jikọta ha.
- source_word: ὑπεναντίον
  choice: na-emegide anyị
  rationale: Nke a na-enye ike okwu ahụ n’ụzọ doro anya, n’emeghị ka ọ sie ike karịa ihe Grik kwuru.
- source_word: ἦρκεν ἐκ τοῦ μέσου
  choice: o wepụla ya n’ụzọ
  rationale: “Wepụla” na-egosi ihe e mezuru nke nsonaazụ ya ka dị, ebe “n’ụzọ” na-enye echiche nke iwepụ ihe na-egbochi mmadụ.
- source_word: προσηλώσας αὐτὸ τῷ σταυρῷ
  choice: site n’ịkpọgide ya n’obe
  rationale: “Site n’ịkpọgide” na-egosi na ịkpọgide ya n’obe bụ ụzọ e si wepụ ya.
theological_decisions:
- issue: Ihe χειρόγραφον τοῖς δόγμασιν pụtara
  choice: Ihe e ji aka dee banyere ụgwọ dị anyị n’isi, nke metụtara iwu ndị e nyere
  alternative: Iwu Mosis n’onwe ya; ndepụta mmehie; akwụkwọ ikpe megide anyị
  rationale: Nsụgharị ahụ na-echekwa ihe atụ nke akwụkwọ ụgwọ na njikọ ya na iwu ndị e nyere, ma ọ naghị eme ka otu nkọwa okpukpe a na-arụrịta ụka banyere ya bụrụ naanị ihe amaokwu ahụ pụtara.
- issue: Onye na-eme ihe n’okwu ἦρκεν
  choice: “o” na-ezo aka na Chineke dịka onye wepụụrụ ya
  alternative: Ịhapụ onye mere ihe ahụ n’amaghị aha, dịka ihe yiri okwu ndabere nke Chineke mere
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na Chineke bụ onye na-eme ihe; iji “o” na Igbo na-eme ka ahịrịokwu zuo oke n’etinyeghị nkụzi ọhụrụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “ụgwọ dị anyị n’isi” maka ihe atụ iwu nke χειρόγραφον, “iwu ndị e nyere” maka δόγματα n’emeghị ka ọ bụrụ Iwu Mosis kpọmkwem, na “obe” maka σταυρός dịka okwu Ndị Kraịst maara nke ọma.
