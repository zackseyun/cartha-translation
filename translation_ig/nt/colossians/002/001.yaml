    issue: Attachment of “n’anụ ahụ” is potentially unclear
    rationale: In “ndị niile na-ahụbeghị ihu m n’anụ ahụ,” the final phrase may appear to modify “ihu m.” Placing it before the object more clearly expresses “have not seen me/my face in physical presence,” as ἐν σαρκί does.
  - severity: low
    issue: Footnote explanation is somewhat unnatural and imprecise
    rationale: “ọnụnọ mmadụ n’ahụ́” is less idiomatic and does not expressly identify the referent. The note should explain that Paul means physical, face-to-face acquaintance.
