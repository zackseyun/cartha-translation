  to: N’ihi na achọrọ m ka unu mara oke mgba m na-agba maka unu, maka ndị nọ na Laodisia, nakwa maka ndị niile na-ahụbeghị n’anụ ahụ ihu m.[a]
  rationale: The revision preserves the literal “ihu m” and “n’anụ ahụ,” while putting the latter immediately after “na-ahụbeghị” to show that it describes physical, personal encounter. The footnote retains the literal Greek wording and gives natural contextual alternatives without treating the phrase as a statement about sinful flesh.
