id: COL.2.1
reference: Colossians 2:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ⸀ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/001.yaml
  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: ig
  text: N’ihi na achọrọ m ka unu mara oke mgba m na-agba maka unu, maka ndị nọ na Laodisia, nakwa maka ndị niile na-ahụbeghị n’anụ ahụ ihu m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihu na ihu” ma ọ bụ “n’ahụ́ nkịtị.” N’asụsụ Grik, okwu ya kpọmkwem bụ “n’anụ ahụ,” nke pụtara na ha ahụbeghị Pọl n’onwe ya n’ọnụnọ anụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω γὰρ ὑμᾶς εἰδέναι
  choice: N’ihi na achọrọ m ka unu mara
  rationale: “N’ihi na” na-ejikọta okwu a na ihe Pọl kwuru tupu ya, ebe “achọrọ m ka unu mara” na-enye echiche θέλω ... εἰδέναι n’ụzọ Igbo doro anya ma dị ugbu a.
- source_word: ἡλίκον ἀγῶνα ἔχω ὑπὲρ ὑμῶν
  choice: oke mgba m na-agba maka unu
  rationale: “Oke” na-egosi ịdị ukwuu nke ἡλίκον, “mgba m na-agba” bụ akpaalaokwu Igbo kwesịrị ekwesị maka ἀγῶνα ἔχω, “maka unu” echekwakwa echiche nke ịgba mbọ n’ihi ọdịmma ha.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: ndị nọ na Laodisia
  rationale: Nkebiokwu Grik a na-arụ ọrụ dị ka aha mmadụ; nsụgharị a dị nkenke ma bụrụ Igbo nkịtị.
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: ndị niile na-ahụbeghị
  rationale: “Ndị niile” na-echekwa ike njikọta nke ὅσοι, ebe “na-ahụbeghị” na-egosi ọnọdụ na-aga n’ihu sitere n’omume emebeghị, dịka perfect tense Grik si dị.
- source_word: τὸ πρόσωπόν μου ἐν σαρκί
  choice: ihu m n’anụ ahụ
  rationale: A hapụrụ “ihu m” na “n’anụ ahụ” nso n’ụdị okwu Grik iji gosipụta na ihe a na-ekwu bụ ịhụ Pọl n’ọnọdụ anụ ahụ, ọ bụghị nanị ịmata ya site n’ozi.
theological_decisions:
- issue: Ihe ἐν σαρκί pụtara n’ebe a
  choice: n’anụ ahụ
  alternative: ihu na ihu; n’ahụ́ nkịtị
  rationale: N’ebe a σάρξ anaghị ekwu banyere ọchịchọ mmehie, kama ọ na-ekwu banyere ọnụnọ mmadụ n’ahụ́. E debere okwu anụ ahụ ka ihe Grik kwuru pụta ìhè, tinyekwa nkọwa ụkwụ maka ụdị Igbo na-akọwa ya nke ọma.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. A họọrọ “mgba m na-agba” kama okwu siri ike ma ọ bụ nke egwuregwu naanị, ka ike na mgbalị dị na ἀγών pụta ìhè.
