base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: ig
  text: Ihe ndị a niile na-ala n’iyi n’iji ha eme ihe[a], dị ka iwu na ozizi ndị mmadụ si dị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndị a niile na-ala n’iyi site n’iji ha eme ihe.”
    reason: lexical_alternative
  - marker: b
    text: Nkebiokwu a yiri okwu dị na Aịzaya 29:13 banyere “iwu na ozizi ndị mmadụ.”
    reason: cross_reference
lexical_decisions:
- source_word: ἅ ἐστιν πάντα
  choice: Ihe ndị a niile
  rationale: Nkebi a na-arụtụ aka n’ihe ndị e kwuru banyere ha n’iwu mmachibido ama nke amaokwu bu ụzọ. Nsụgharị a bụ Igbo nkịtị ma na-edobe ntụaka ahụ.
- source_word: εἰς φθοράν
  choice: na-ala n’iyi
  rationale: φθορά nwere ike ịpụta ire ure, mmebi, ma ọ bụ ịla n’iyi. N’ebe a, ihe ndị a na-ekwu maka ha bụ ihe a na-eji eme ihe ruo mgbe ha gwụsịrị; ‘na-ala n’iyi’ na-edobe obosara echiche ahụ.
- source_word: τῇ ἀποχρήσει
  choice: mgbe e ji ha eme ihe
  rationale: ἀπόχρησις na-egosi iji ihe eme ihe, karịsịa iji ya ruo mgbe ọ gwụsịrị. Okwu a doro ndị na-agụ Igbo anya ma ghara ịkọwa ya karịa ihe Grik kwuru.
- source_word: κατὰ
  choice: ha dabere na
  rationale: N’ebe a κατὰ na-egosi ụkpụrụ ma ọ bụ isi mmalite nke iwu ndị ahụ. ‘Dabere na’ na-egosipụta njikọ a n’Igbo eke.
- source_word: ἐντάλματα καὶ διδασκαλίας
  choice: iwu na ozizi
  rationale: ‘Iwu’ na-edobe ọdịdị nke ihe e nyere n’iwu, ebe ‘ozizi’ bụ okwu Igbo dị mfe ma kwesị ekwesị maka διδασκαλίας.
- source_word: τῶν ἀνθρώπων
  choice: ndị mmadụ
  rationale: ἀνθρώπων pụtara ụmụ mmadụ n’ozuzu ha ma na-emegide ihe sitere n’aka Chineke. ‘Ndị mmadụ’ bụ okwu Igbo eke, zuru mmadụ niile ọnụ, ma na-edobe isi mmalite mmadụ nke iwu ndị a.
theological_decisions:
- issue: Ihe nkebi a na-akọwa n’ihe gbasara iwu mmachibido ama
  choice: Ihe ndị a machibidoro bụ ihe na-ala n’iyi mgbe e ji ha eme ihe, iwu ndị ahụ bụkwa nke dabere n’iwu na ozizi mmadụ.
  alternative: A pụrụ ịghọta okwu ahụ dị ka nkatọ siri ike karị megide iwu ndị ahụ n’onwe ha n’ihi na ha metụtara nanị ihe na-agwụ n’iji ya eme ihe.
  rationale: Grik na-ejikọta nnọchiaha ἅ na ihe ndị amaokwu gara aga kwuru banyere ha, ma mesịa kọwaa iwu ndị ahụ dị ka nke mmadụ. Nsụgharị ahụ na-edobe akụkụ abụọ a n’ebughị ụzọ kpebie nke Pọl kacha mesie ike.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Na-ala n’iyi’ na ‘mgbe e ji ha eme ihe’ na-agụ nke ọma n’Igbo ma na-edobe echiche nke ihe na-agwụ ma ọ bụ na-emebi site n’iji ya. Nkebi nke abụọ jiri ‘ha dabere n’iwu...’ mee ka amaokwu ahụ guzozie nke ọma n’onwe ya, ebe ọ ka na-edobe njikọ ya na iwu mmachibido ama ndị dị n’amaokwu bu ụzọ.
