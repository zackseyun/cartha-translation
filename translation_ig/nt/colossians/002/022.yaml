revisions:
- from: Ihe ndị a niile na-ala n’iyi mgbe e ji ha eme ihe[a]; ha dabere n’iwu na ozizi ndị mmadụ.[b]
  to: Ihe ndị a niile na-ala n’iyi n’iji ha eme ihe[a], dị ka iwu na ozizi ndị mmadụ si dị.[b]
  rationale: The revision keeps the objects of the prohibitions as the referent of “Ihe ndị a niile” and renders their perishing in use directly. It recasts the final prepositional phrase so that it naturally relates to the human commandments and teachings underlying the preceding prohibitions, without making the perishable objects themselves depend on those teachings. Both notes are corrected for accuracy, clarity, and appropriate restraint.
