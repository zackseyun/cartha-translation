  terminology: ‘Nkà ihe ọmụma,’ ‘aghụghọ efu,’ ‘ọdịnala mmadụ,’ na ‘Mesaya’ dabara nke ọma. ‘Ihe ndị bụ isi nke ụwa’ na-ahapụ ihe στοιχεῖα pụtara ghe oghe; ndetu kwesịrị ikwu naanị nhọrọ ‘ike mmụọ’ n’enweghị ịgbakwunye na ha ‘na-achị’ ụwa.
