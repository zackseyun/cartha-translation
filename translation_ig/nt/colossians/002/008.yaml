id: COL.2.8
reference: Colossians 2:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: ig
  text: Kpacharanụ anya ka onye ọ bụla ghara iji nkà ihe ọmụma na aghụghọ efu dọrọ unu n’agha, dị ka ọdịnala mmadụ si dị, dị ka ihe ndị bụ isi nke ụwa[a] si dị, ọ bụghịkwa dị ka Mesaya[b] si dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ike mmụọ nke ụwa.” Okwu Grik ahụ nwere ike ịpụta ihe ma ọ bụ ụkpụrụ ndị bụ isi, ma ọ bụ ike mmụọ nke ụwa.
    reason: alternative_reading
  - marker: b
    text: Grik, “Kraịst”; ebe a a sụgharịrị ya “Mesaya” n’ihi na echiche ya dịka aha-ọrụ pụtara ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: Kpacharanụ anya ka onye ọ bụla ghara
  rationale: Ọ na-egosipụta iwu ịmụrụ anya nye ọtụtụ mmadụ na ịdọ aka ná ntị banyere ihe nwere ike ime, n’Igbo dị ugbu a ma doo anya.
- source_word: ἔσται ὁ συλαγωγῶν
  choice: dọrọ unu n’agha
  rationale: Ọ na-echekwa ihe atụ nke ịdọrọ mmadụ dịka onye a dọtara n’agha ma ọ bụ dịka ihe nkwata, na-enweghị ime ka ya bụrụ naanị ‘iduhie.’
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: iji nkà ihe ọmụma na aghụghọ efu
  rationale: ‘Iji’ na-egosi ụzọ e si eme ihe; njikọ ‘na’ na-edobe okwu abụọ ahụ iche dịka Grik si mee, kama ịkọwa otu dịka nkọwa nke ibe ya.
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: dị ka ọdịnala mmadụ si dị
  rationale: Ọ na-egosi ụkpụrụ ma ọ bụ ihe a na-agbaso; ‘mmadụ’ ebe a bụ aha mkpokọta na-adịghị akọwapụta nwoke naanị.
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: dị ka ihe ndị bụ isi nke ụwa si dị
  rationale: Nhọrọ a na-edobe obosara στοιχεῖα dịka ihe mbụ ma ọ bụ ụkpụrụ ndị bụ isi, ebe ndetu na-echekwa nghọta nke ike mmụọ.
- source_word: οὐ κατὰ Χριστόν
  choice: ọ bụghịkwa dị ka Mesaya si dị
  rationale: Χριστός bụ aha-ọrụ nke pụtara Onye E Tere Mmanụ; ‘Mesaya’ na-eme ka ọdịdị aha-ọrụ ahụ pụta ìhè n’ebe a.
theological_decisions:
- issue: Ihe στοιχεῖα τοῦ κόσμου pụtara
  choice: ihe ndị bụ isi nke ụwa
  alternative: mmụọ ndị bụ isi na-achị ụwa
  rationale: Okwu Grik ahụ nwere ike izo aka n’ihe ma ọ bụ ụkpụrụ ndị bụ isi, ma ọ bụ n’ike mmụọ nke eluigwe na ụwa. Isi ederede anaghị ekpebi esemokwu ahụ kpamkpam; ndetu na-edobe nghọta ọzọ dị mkpa.
- issue: Otu e si sụgharịa Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ahịrịokwu a, okwu ahụ na-arụ ọrụ dịka aha-ọrụ nke e ji atụnyere ọdịnala mmadụ na ihe ndị bụ isi nke ụwa; ‘Mesaya’ na-egosipụta echiche Onye E Tere Mmanụ.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ gosipụta na ndị a na-agwa okwu karịrị otu. E debere usoro ugboro atọ nke κατὰ site n’iji ‘dị ka ... si dị,’ ma zere ịkatọ nkà ihe ọmụma niile dịka ihe bụ aghụghọ n’onwe ya.
