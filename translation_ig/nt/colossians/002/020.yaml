id: COL.2.20
reference: Colossians 2:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: ig
  text: 'Ọ bụrụ na unu na Kraịst nwụrụ pụọ n’ụkpụrụ ntọala nke ụwa[a], gịnị mere unu ji na-edo onwe unu n’okpuru iwu e nyere[b], dị ka à ga-asị na unu ka na-ebi n’ụwa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmụọ ndị metụtara ihe ndị bụ isi nke ụwa”; ụzọ ọzọ bụ, “ihe ndị bụ isi nke ụwa.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “gịnị mere a na-edobe unu n’okpuru iwu e nyere?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Ọ bụrụ na
  rationale: Nke a na-edobe usoro ọnọdụ dị na Grik. N’agbanyeghị na Pọl yiri ka ọ na-ewere ọnwụ ha na Kraịst dị ka eziokwu, nsụgharị a anaghị agbanwe ya ka ọ bụrụ ‘ebe ọ bụ na.’
- source_word: ἀπεθάνετε σὺν Χριστῷ
  choice: unu na Kraịst nwụrụ
  rationale: Oge gara aga dị mfe na-egosi ihe mere otu mgbe; ‘na Kraịst’ na-edobe echiche nke iso Kraịst nwụọ. ‘Kraịst’ bụ aha-utu a maara nke ọma n’Igbo maka Onye E Tere Mmanụ.
- source_word: ἀπὸ
  choice: si otú ahụ pụọ n’
  rationale: Ọ na-egosi nkewapụ. ‘Pụọ n’…’ na-enye echiche ahụ n’Igbo doro anya, ebe ‘si otú ahụ’ jikọtara nkewapụ ahụ na ọnwụ ha na Kraịst n’enweghị ịgbakwụnye nkwubi okwu nkà mmụta okpukpe.
- source_word: τῶν στοιχείων τοῦ κόσμου
  choice: ụkpụrụ ndị mbụ nke ụwa
  rationale: στοιχεῖα nwere ike ịpụta ụkpụrụ ndị bụ ntọala, ihe ndị bụ isi, ma ọ bụ ike/mmụọ ndị metụtara ụwa. ‘Ụkpụrụ ndị mbụ’ na-ahapụ okwu ahụ ka ọ nwee obosara pụtara, ebe e depụtara ụzọ ndị ọzọ n’okpuru ama nkọwa.
- source_word: τί
  choice: gịnị mere
  rationale: N’ajụjụ a, τί na-ajụ ihe kpatara omume ahụ; ‘gịnị mere’ bụ ụzọ Igbo si ekwu ya n’ụzọ ebumpụta ụwa.
- source_word: ὡς ζῶντες ἐν κόσμῳ
  choice: dị ka à ga-asị na unu ka na-ebi n’ụwa
  rationale: Nke a na-edobe ntụnyere ma ọ bụ echiche a na-atụ n’ὡς na participle, tinyere ike okwu Pọl na-ajụ.
- source_word: δογματίζεσθε
  choice: unu ji na-edo onwe unu n’okpuru iwu dị iche iche
  rationale: 'Ụdị ngwaa ahụ nwere ike ịbụ nke etiti ma ọ bụ nke nnabata: ido onwe ha n’okpuru ụkpụrụ, ma ọ bụ ịbụ ndị a na-edobe n’okpuru ha. Isi ederede họọrọ nghọta nke etiti, ebe ama nkọwa na-echekwa nke ọzọ.'
theological_decisions:
- issue: Ihe στοιχεῖα pụtara n’akwụkwọ Pọl
  choice: ụkpụrụ ndị mbụ nke ụwa
  alternative: mmụọ ndị na-achị ụwa; ma ọ bụ ihe ndị bụ isi nke ụwa
  rationale: Okwu ahụ ka a na-arụrịta ụka banyere ya, ọ pụkwara ịgụnye usoro ntọala nke ụwa na ike ime mmụọ. Isi nsụgharị anaghị ekpebi otu echiche naanị; ama nkọwa na-echekwa ụzọ ndị ọzọ.
- issue: 'Ụdị δογματίζεσθε: etiti ka ọ bụ nnabata'
  choice: na-edo onwe unu n’okpuru iwu dị iche iche
  alternative: a na-edobe unu n’okpuru iwu dị iche iche
  rationale: Ụdị Grik nwere ike ibu nghọta abụọ ahụ. Isi ederede na-egosi òkè ndị na-agụ akwụkwọ nwere n’omume ahụ, ma ama nkọwa na-echekwa nghọta nnabata.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ akara abụọ n’isi njedebe n’ihi na amaokwu na-esonụ na-eweta ihe atụ nke iwu ndị ahụ. E tinyere akara ama nkọwa [b] n’akụkụ ngwaa ọ na-akọwa kama n’akụkụ ‘ụwa.’
