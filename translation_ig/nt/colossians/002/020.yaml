    text: Ma ọ bụ, “mmụọ ndị metụtara ihe ndị bụ isi nke ụwa”; ụzọ ọzọ bụ, “ihe ndị bụ isi nke ụwa.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “gịnị mere a na-edobe unu n’okpuru iwu e nyere?”
    reason: lexical_alternative
  revision_rationale: The revision removes the extra connective sense in “si otú ahụ,” improves the idiomatic connection between dying with Christ and separation from the world’s στοιχεῖα, and avoids an over-specific spirit interpretation in footnote a. It also renders the decrees more precisely while retaining the middle/passive ambiguity through footnote b.
