  text: For in him all the fullness of deity dwells bodily,[a]
translation:
  language: ig
  text: N’ihi na izu oke dum nke ịbụ Chineke na-ebi n’ime ya n’anụ ahụ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Izu oke ahụ dum nke ịbụ Chineke na-ebi n’ime ya n’anụ ahụ́.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-egosi ihe kpatara ịdọ aka ná ntị dị n’amaokwu ndị bu ụzọ, ma na-edobe ike causal nke okwu Grik ahụ.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Nke a bụ ntụgharị locative doro anya nke na-ezo aka na Kraịst; etinyeghị echiche ‘naanị’ nke na-adịghị n’ederede Grik.
- source_word: κατοικεῖ
  choice: bi
  rationale: ‘Bi’ na-egosi ịnọgide na ebe, ọ bụghị nanị ịbịa ma ọ bụ ịnọ nwa oge, ma bụrụkwa okwu Igbo dị mfe ma dị ugwu.
- source_word: πᾶν τὸ πλήρωμα
  choice: izu oke niile
  rationale: Ọ na-egosipụta mkpokọta na izu oke nke okwu Grik ahụ, n’enweghị ibelata ya ka ọ bụrụ naanị akụkụ ụfọdụ.
- source_word: τῆς θεότητος
  choice: nke ihe Chineke bụ n’onwe ya
  rationale: θεότης na-ekwu maka ịbụ Chineke n’ezie, ọ bụghị naanị àgwà yiri nke Chineke. Nkebiokwu a na-ekwupụta nke ahụ n’Igbo nkịtị ma zere okwu teknụzụ na-edochaghị anya.
- source_word: σωματικῶς
  choice: n’ụdị ahụ́
  rationale: Nke a na-edobe echiche bodily/corporeal nke adverb Grik ahụ, ma ghara ịkọwa ya karịa ihe ederede kwuru.
theological_decisions:
- issue: Ike okwu θεότης na σωματικῶς banyere onye Kraịst bụ
  choice: Amaokwu ahụ na-ekwu na izu oke niile nke ihe Chineke bụ n’onwe ya bi n’ime Kraịst n’ụdị ahụ́.
  alternative: Ịsị na ọ bụ naanị àgwà Chineke ma ọ bụ ọnụnọ Chineke ka bi n’ime Kraịst.
  rationale: θεότης bụ okwu siri ike maka ịbụ Chineke n’ezie, ebe σωματικῶς na-egosi ibi ahụ n’ụdị ahụ́. A hapụrụ nkwupụta ahụ n’ike ya n’enweghị ibelata ya ma ọ bụ ịgbakwunye nkọwa ozizi nke na-adịghị n’ederede.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. E ji “ihe Chineke bụ n’onwe ya” kọwaa θεότης n’ụzọ siri ike ma doo anya; akara ụkwụ [a] dị n’ederede isi.
