id: COL.2.15
reference: Colossians 2:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: ig
  text: Mgbe o napụsịrị ndị ọchịchị na ndị nwere ikike ike ha, o mere ka ha bụrụ ihe ngosi n’ihu ọha, ma merie ha n’ime ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site na ya.” N’asụsụ Grik, “ya” nwere ike ịbụ nwoke ma ọ bụ etiti, ihe ọ na-ezo aka na ya adịghịkwa doo anya nke ọma. Ụfọdụ na-ejikọta ya na Kraịst, ebe ụfọdụ na-ejikọta ya n’obe ahụ.
    reason: Ichekwa mgbagwoju anya dị na ἐν αὐτῷ na ụdị dative ya, n’enweghị ikpebi otu ntụaka ma ọ bụ itinye nkọwa okpukpe n’ederede.
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: Mgbe ọ yipụsịrị ... ihe agha ha
  rationale: Okwu Grik a pụtara n'ụzọ nkịtị ‘iyipụ’; n'ebe a, ọ na-egosi ịnapụ ndị iro ihe ike ha ji alụ ọgụ, ya mere e ji okwu doro ndị na-agụ akwụkwọ anya mee ya.
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: ndị ọchịchị na ndị nwere ikike
  rationale: E debere ụzọ abụọ ahụ SBLGNT si kọwaa ike ndị a, n’enweghị ịgbakwunye nkọwa banyere ụdị mmụọ ha.
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: o mere ka ha bụrụ ihe ngosi n’ihu ọha
  rationale: Nke a na-egosipụta ihere e mere ha n’ihu mmadụ niile na mmeri pụtara ìhè.
- source_word: θριαμβεύσας αὐτοὺς
  choice: na-emeri ha
  rationale: Ngwaa ahụ sitere n’echiche nke iduru ndị e meriri n’usoro ngosi mmeri; nsụgharị a na-edobe isi echiche mmeri ahụ n’asụsụ Igbo dị mfe.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: E debere nnọchiaha nwoke nke SBLGNT n'ụzọ nkịtị kama ịgbanwe ya ka ọ bụrụ ‘n’ime obe ahụ’ ma ọ bụ ‘site na ya.’
theological_decisions:
- issue: Onye na-eme omume ndị a
  choice: E ji ‘ọ’ hapụ onye a ka ama ya site n’amaokwu ndị gbara ya gburugburu.
  alternative: Ịkpọ Chineke aha ozugbo
  rationale: Isi okwu Grik bụ participle na ngwaa onye nke atọ; amaokwu a n’onwe ya ekwughị aha onye ahụ, ya mere a naghị etinye aha na-adịghị na ya.
- issue: Ihe αὐτῷ na-ezo aka na ya
  choice: n’ime ya
  alternative: n’ime obe ahụ / site n’obe ahụ
  rationale: Ụdị Grik ahụ bụ nnọchiaha nwoke ma nwee ezigbo mgbagwoju anya banyere ihe ọ na-ezo aka na ya. Nsụgharị bụ isi na-echekwa nke a kama idozi ya n’ụzọ nkà mmụta okpukpe.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘ihe agha ha’ kọwaa ihe oyiyi nke iyipụ ndị iro ike, ma e chekwara mgbagwoju anya dị na nkebi ikpeazụ site na ‘n’ime ya’ na nkọwa ala peeji.
