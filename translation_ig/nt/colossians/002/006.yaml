    issue: The phrase “Onyenwe anyị” adds a first-person plural possessive.
    rationale: Although it is familiar Christian phrasing in Igbo, it means “our Lord.” The source reads “the Lord,” so “anyị” is an unwarranted addition in this appositional title sequence.
  revised_text: Ya mere, dị nnọọ ka unu si nabata Mesaịa[a] Jizọs, bụ Onyenwe, na-ejegharịnụ n’ime ya.
