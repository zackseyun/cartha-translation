id: COL.2.6
reference: Colossians 2:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/006.yaml
  text: Therefore[a], just as you received Messiah Jesus the Lord, walk in him,
translation:
  language: ig
  text: Ya mere, dị nnọọ ka unu si nabata Mesaịa[a] Jizọs, bụ Onyenwe, na-ejegharịnụ n’ime ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst Jizọs.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: dị nnọọ ka
  rationale: Na-egosi ntụnyere dị n’etiti otú ndị Kọlọsi si nabata Jizọs na otú ha ga-esi nọgide na-ebi ndụ; okwu a na-eme ka ike ntụnyere ahụ doo anya n’Igbo.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi ihe e si n’okwu ndị bu ụzọ kwubie, ma na-ejikọta amaokwu a nke ọma na arụmụka gara aga.
- source_word: παρελάβετε
  choice: unu si nabata
  rationale: Na-ezo aka n’ihe ha mere n’oge gara aga. “Nabata” na-edobe ohere nke ịnabata ma ozi ahụ ma onye ahụ, n’etinyeghị nkọwa karịrị ihe Grik kwuru.
- source_word: τὸν Χριστὸν Ἰησοῦν
  choice: Mesaịa Jizọs
  rationale: Χριστός nọ ebe a dị ka utu aha. “Mesaịa” na-asụgharị ihe utu aha ahụ pụtara, ebe “Jizọs” bụ aha a sụgharịrị n’ụda Igbo.
- source_word: τὸν κύριον
  choice: bụ Onyenwe anyị
  rationale: “Onyenwe anyị” bụ ụzọ ebumpụta ụwa na nke e ji nsọpụrụ asụ κύριος dịka utu aha Jizọs. “Bụ” na-eme ka njikọ nkọwa ahụ doo anya n’Igbo n’agbanweghi onye okwu ahụ na-ekwu maka ya.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Na-edobe okwu Pọl dị mkpirikpi banyere njikọ ndị kwere ekwe na Mesaịa, n’akọwaghị ya karịa ka Grik si kwuo.
- source_word: περιπατεῖτε
  choice: na-ejegharịnụ
  rationale: Na-edobe ihe atụ Pọl ji ije kọwaa omume na ụzọ ndụ. Ụdị iwu a na-egosikwa omume ha kwesịrị ịnọgide na-eme.
theological_decisions:
- issue: Ịsụgharị Χριστός n’usoro utu aha Pọl ji
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: N’ebe a, Χριστός ka nwere ọrụ dị ka utu aha, ya mere a sụgharịrị ihe ọ pụtara dịka “Mesaịa.” E tinyere “Kraịst Jizọs” n’ala peeji maka ndị maara ụdị ọdịnala ahụ.
- issue: Okwu Pọl banyere ịdị “n’ime” Mesaịa na ἐν αὐτῷ
  choice: n’ime ya
  alternative: n’ịdị n’otu na ya
  rationale: “N’ime ya” na-edobe nkenke, omimi, na nghọta dị iche iche okwu Grik ahụ nwere; ụdị ọzọ ga-akọwa okwu ahụ karịa ihe isi mmalite kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ nke “ijegharị” ka ihe oyiyi Pọl ghara ịla n’iyi, ma jiri “na-ejegharịnụ” gosi ndụ a ga-anọgide na-ebi.
