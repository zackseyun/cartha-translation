id: COL.2.7
reference: Colossians 2:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐρριζωμένοι καὶ ἐποικοδομούμενοι ἐν αὐτῷ καὶ ⸀βεβαιούμενοι τῇ πίστει καθὼς ἐδιδάχθητε, ⸀περισσεύοντες ἐν εὐχαριστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: ig
  text: E meela ka unu gbanye mgbọrọgwụ, a na-ewukwa unu elu n’ime ya, a na-emekwa ka unu guzosie ike n’okwukwe[a] dị nnọọ ka a kuziri unu, na-ejubigakwa ókè n’ekele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na ntụkwasị obi”; ma ọ bụ, “n’ikwesị ntụkwasị obi.” Okwu Grik bụ pistis nwere ike ịpụta okwukwe, ntụkwasị obi, ma ọ bụ ikwesị ntụkwasị obi; ma n’ebe a, “okwukwe” yiri ka ọ na-ezo aka n’okwukwe ma ọ bụ ozi ahụ a kuziri ha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: ebe e mere ka unu gbanye mgbọrọgwụ
  rationale: 'Na-echekwa ihe atụ nke osisi na perfect participle: ihe e meworị nke nsonaazụ ya ka dịgide.'
- source_word: ἐποικοδομούμενοι
  choice: a na-ewukwa unu elu
  rationale: Na-egosipụta present participle na omume na-aga n’ihu, ma na-echekwa ihe atụ nke iwu ụlọ.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Na-echekwa nnọchiaha Grik nke na-ezo aka na Kraịst n’amaokwu ndị gbara ya gburugburu, kama iji aha dochie ya.
- source_word: βεβαιούμενοι
  choice: a na-emekwa ka unu guzosie ike
  rationale: Na-egosi ime ka mmadụ sie ike ma guzosie ike, n’ụzọ Igbo nkịtị ma doo anya.
- source_word: τῇ πίστει
  choice: n’okwukwe
  rationale: “Okwukwe” na-echekwa πίστις; njikọ ya na ihe a kuziri ha na-akwado echiche nke okwukwe/ozi ahụ a kụziri, n’agbanyeghị na okwu ahụ nwekwara ike ịpụta ntụkwasị obi ma ọ bụ ikwesị ntụkwasị obi.
- source_word: καθὼς ἐδιδάχθητε
  choice: dị nnọọ ka a kuziri unu
  rationale: Na-echekwa ike ntụnyere nke καθώς na passive nke ἐδιδάχθητε.
- source_word: περισσεύοντες
  choice: na-ejupụtakwa
  rationale: Na-egosipụta ụba na-aga n’ihu n’asụsụ Igbo dị ndụ; ọ na-enye echiche nke ihe jubigara ókè.
- source_word: ἐν εὐχαριστίᾳ
  choice: n’inye ekele
  rationale: Ụdị Igbo a bụ nke eke ma na-egosipụta omume ekele nke εὐχαριστία.
theological_decisions:
- issue: Ihe τῇ πίστει pụtara
  choice: okwukwe, nke o yikarịrị ka ọ bụ okwukwe ma ọ bụ ozi a kuziri ha
  alternative: ntụkwasị obi nke ha; ma ọ bụ ikwesị ntụkwasị obi
  rationale: Article ahụ na okwu na-esochi, “dị nnọọ ka a kuziri unu,” na-akwado ihe a kwenyere ma ọ bụ ozi a kụziri; ma a hapụrụ nghọta ndị ọzọ n’ala ala peeji ka e ghara idozi ihe Grik hapụrụ ntakịrị oghere.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ abụọ dị na Grik—ịgbanye mgbọrọgwụ na iwu ụlọ—nakwa ọdịiche dị n’etiti omume e meworị nke nsonaazụ ya ka dị na omume ndị na-aga n’ihu.
