revisions:
- from: ebe e mere ka unu gbanye mgbọrọgwụ, a na-ewukwa unu elu n’ime ya, a na-emekwa ka unu guzosie ike n’okwukwe[a] dị nnọọ ka a kuziri unu, na-ejupụtakwa n’inye ekele.
  to: E meela ka unu gbanye mgbọrọgwụ, a na-ewukwa unu elu n’ime ya, a na-emekwa ka unu guzosie ike n’okwukwe[a] dị nnọọ ka a kuziri unu, na-ejubigakwa ókè n’ekele.
  rationale: The revision removes the added locative sense, retains the perfect result of being rooted through “E meela ka…,” preserves the ongoing passive ideas of being built up and established, and renders the final participle as abounding in thanksgiving. The footnote remains suitably cautious about the semantic range of πίστις.
  reviewer_model: gpt-5.6-terra
