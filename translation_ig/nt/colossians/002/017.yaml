  yaml_path: translation/nt/colossians/002/017.yaml
  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: ig
  text: Ihe ndị a bụ onyinyo nke ihe ndị na-abịa, ma ahụ bụ nke Mesaịa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “ma ezi ihe ahụ bụ nke Mesaịa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅ
  choice: Ihe ndị a
  rationale: Ọ na-ezo aka n'ihe ndị e kwuru n'amaokwu bu ụzọ; ntụgharị a bụ Igbo doro anya ma na-edobe njikọ ahụ.
- source_word: σκιὰ
  choice: onyinyo
  rationale: Ọ na-edobe ihe atụ Pọl ji mee ka ihe ndị ahụ dị ka onyinyo nke ihe ga-abịa.
- source_word: τῶν μελλόντων
  choice: nke ihe ndị na-abịa
  rationale: Ọ na-edobe nghọta nke ihe ka ga-abịa, n'ebughị ụzọ kpebie ma ọ bụ naanị mmezu Mesaịa ka ọ bụkwa ihe gbasara ọgwụgwụ oge.
- source_word: δὲ
  choice: ma
  rationale: Ọ na-egosi ọdịiche dị n'etiti onyinyo na ahụ.
- source_word: σῶμα
  choice: ahụ
  rationale: Nke a bụ ihe okwu Grik pụtara n'ụzọ kwụ ọtọ, ọ na-edobekwa ihe atụ 'onyinyo/ahụ' ka onye na-agụ ya tụgharịa uche na ya.
- source_word: τοῦ Χριστοῦ
  choice: bụ nke Mesaịa
  rationale: Genitive ahụ na-egosi njikọ ma ọ bụ inwe; 'bụ nke Mesaịa' bụ Igbo eke nke na-edobe nkenke na ntakịrị mgbagwoju anya nke Grik. A sụgharịrị Χριστός dị ka utu aha, 'Mesaịa'.
theological_decisions:
- issue: Ihe σῶμα pụtara mgbe e jiri ya tụnyere σκιά
  choice: A sụgharịrị ya n'ụzọ kwụ ọtọ dị ka “ahụ.”
  alternative: “ezi ihe ahụ” ma ọ bụ “ihe bụ isi”
  rationale: “Ahụ” na-edobe okwu Grik na esemokwu ihe atụ dị n'etiti onyinyo na ihe nwere ahụ, n'etinyeghị nkọwa nkà mmụta okpukpe pụrụ iche n'ime ederede.
- issue: Nkọwa genitive τοῦ Χριστοῦ
  choice: “bụ nke Mesaịa”
  alternative: “bụ ezi ihe ahụ nke dị na Mesaịa” ma ọ bụ “bụ nke Kraịst”
  rationale: Nke a na-edobe nhazi okwu dị nkenke nke Grik na echiche inwe/njikọ, ma ọ naghị eme ka otu nkọwa naanị bụrụ iwu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E debere ihe atụ “onyinyo/ahụ” nke Grik; akara nkọwa ala peeji abụọ pụtara n'ederede isi.
