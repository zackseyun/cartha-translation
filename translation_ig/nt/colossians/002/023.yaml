review_pass:
  verdict: revise
  source_fidelity: 'Isi nsụgharị ahụ na-esochi Grik nke ọma: ọ na-ezo aka n''iwu ndị gara aga, na-egosi naanị ọdịdị/aha amamihe, ma na-edobe nghọta ahọpụtara nke nkebi ikpeazụ—na omume ndị a enweghị uru n''ịchịkwa ma ọ bụ igbochi afọ ojuju nke anụ ahụ́. Otú ọ dị, akara amaokwu ndị dị ugbu a etinyere niile n''azụ ‘ahụ́,’ ya mere ha anaghị arapara n''ebe okwu ọ bụla ha na-akọwa dị.'
  naturalness: ‘Ofufe mmadụ ji aka ya họrọ’ ghọtara, ma ‘ofufe mmadụ chepụtara n'onwe ya’ dịkwuo eke na Standard Igbo. ‘Imeso ahụ́ n'ụzọ siri ike’ na-ekwu n'ụzọ doro anya karịa ‘imeso ahụ́ ike.’
  terminology: ‘Ịdị umeala n'obi,’ ‘anụ ahụ́,’ na ‘ofufe mmadụ chepụtara n'onwe ya’ dabara nke ọma. E debere ‘anụ ahụ́’ kama ịkọwa σάρξ n'ụzọ nkwenkwe kpọmkwem. A mezigharịrị amaokwu nhọrọ ka ọ ghara ikwu n'ụzọ na-adịghị dabara na Grik, ‘ha adịghị asọpụrụ ihe ọ bụla.’
  issues:
  - severity: medium
    issue: Akara nkọwa [a]–[d] niile dị n'azụ ‘ahụ́.’
    rationale: Nke a na-eme ka [a] na [b], bụ ndị metụtara ‘ọdịdị amamihe’ na ‘ofufe mmadụ chepụtara n'onwe ya,’ yie ka ha na-akọwa naanị ‘ahụ́.’ A ghaghị idowe akara ọ bụla n'akụkụ okwu ma ọ bụ nkebi ọ na-akọwa.
  - severity: low
    issue: Nsụgharị ọzọ dị na nkọwa [c] anaghị egosipụta ‘οὐκ ἐν τιμῇ τινι’ nke ọma.
    rationale: ‘Ha adịghị asọpụrụ ihe ọ bụla’ na-atụgharị echiche ahụ gaa n'ihe ha na-asọpụrụ, ebe Grik na-ekwu banyere enweghị nsọpụrụ/uru. A gbanwere ya ka ọ nọgide bụrụ nsụgharị ọzọ nke nkebi Grik siri ike.
  - severity: low
    issue: Ụfọdụ okwu nwere ike ịdịkwuo eke.
    rationale: ‘Ofufe mmadụ chepụtara n'onwe ya’ na ‘imeso ahụ́ n'ụzọ siri ike’ na-adịkwu mma n'Igbo oge a, na-enweghị mgbanwe n'echiche.
