id: COL.2.23
reference: Colossians 2:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: ig
  text: Ihe ndị a n'ezie nwere ọdịdị amamihe[a] n’ofufe mmadụ chepụtara n’onwe ya[b], na n’ịdị umeala n’obi, na n’imeso ahụ́ n’ụzọ siri ike; ma ha abaghị uru ọ bụla n’igbochi imeju ọchịchọ nke anụ ahụ́[d].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “a na-ekwu na ha bụ amamihe.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “ofufe mmadụ nyere onwe ya iwu”; n’ụzọ ọdịnala, “ofufe nke uche mmadụ.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nkebi ikpeazụ siri ike. A pụkwara ịsụgharị ya: “ọ bụghị n’asọpụrụ ọ bụla, maka imeju anụ ahụ́,” ma ọ bụ, “ha enweghị nsọpụrụ ọ bụla megide imeju anụ ahụ́.”'
    reason: alternative_reading
  - marker: d
    text: N'ebe a, “anụ ahụ́” nwere ike ịpụta ọchịchọ mmadụ nke mmehie merụrụ; tulee otú Pọl si eji okwu ahụ n'ebe ndị ọzọ dịka gburugburu okwu si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Ihe ndị a
  rationale: Ọ na-ezo aka n'iwu ndị e kwuru okwu ha n'amaokwu 21–22, ma na-edobe ike ntụaka nke okwu Grik ahụ.
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: nwere ọdịdị amamihe n'ezie
  rationale: Akpaalaokwu ahụ na-egosi ihe yiri ka ọ bụ amamihe ma ọ bụ ihe a na-ewere dị ka amamihe; ‘ọdịdị amamihe’ na-egosipụta nkwenye nwa oge nke μέν na-enweghị ikwu na ọ bụ ezi amamihe.
- source_word: ἐθελοθρησκίᾳ
  choice: ofufe mmadụ ji aka ya họrọ
  rationale: Okwu a na-adịghị ahụkarị na-ezo aka n'ofufe mmadụ chepụtara ma ọ bụ tinyere onwe ya, kama nke Chineke nyere n'iwu.
- source_word: ταπεινοφροσύνῃ
  choice: ịdị umeala n'obi
  rationale: Nke a bụ ihe okwu ahụ pụtara n'ụzọ nkịtị; gburugburu okwu ahụ na-eme ka o doo anya na ọ pụrụ ịbụ ịdị umeala n'obi nke naanị ya na-apụta ìhè.
- source_word: ἀφειδίᾳ σώματος
  choice: imeso ahụ́ ike
  rationale: Ọ na-egosi imeso ahụ́ n'ụzọ siri ike na-enweghị imere ya ebere; nsụgharị a bụ Igbo dị mfe ma doo anya.
- source_word: οὐκ ἐν τιμῇ τινι
  choice: ha abaghị uru ọ bụla
  rationale: N'agbanyeghị na nkebi a siri ike, ịghọta τιμή dị ka uru na-eme ka ọdịiche dị n'etiti ọdịdị amamihe na enweghị ike igbochi ọchịchọ doo anya.
- source_word: πρὸς πλησμονὴν
  choice: n'igbochi imeju ọchịchọ
  rationale: N'ọnọdụ a, πρός na πλησμονή na-egosi mmekọrịta ya na imeju ma ọ bụ ịna-emeju ọchịchọ; ‘igbochi’ na-egosipụta nghọta ahọpụtara nke arụmụka ahụ.
- source_word: τῆς σαρκός
  choice: nke anụ ahụ́
  rationale: ‘Anụ ahụ́’ na-edobe ihe atụ na mgbagwoju echiche nke σάρξ, kama ịkọwa ya ozugbo dịka ‘ọdịdị mmehie.’
theological_decisions:
- issue: Ihe nkebi ikpeazụ οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός pụtara
  choice: Omume ndị a abaghị uru n'igbochi imeju ọchịchọ nke anụ ahụ́.
  alternative: Ha adịghị eweta nsọpụrụ ọ bụla, kama ha bụ maka imeju anụ ahụ́; ma ọ bụ, ha adịghị asọpụrụ ahụ́ mgbe ha na-achọ igbochi imeju anụ ahụ́.
  rationale: 'Usoro okwu Grik ahụ dị mkpụmkpụ ma sie ike. Nghọta ahọpụtara dabara n''usoro arụmụka Pọl: iwu ndị ahụ yiri amamihe, ma ha enweghị ike ịchịkwa ọchịchọ nke anụ ahụ́. E debere nghọta ndị ọzọ n''okpuru amaokwu n''ihi na mgbagwoju ahụ bụ eziokwu.'
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ‘anụ ahụ́’ iji chekwaa mgbagwoju echiche nke σάρξ, ma kọwaa ohere nghọta ya n'okpuru amaokwu. E haziri akara nkọwa [a]–[d] n'usoro nkịtị ma tinye ha niile n'ahịrị amaokwu.
