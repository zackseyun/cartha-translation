    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s intended lexical and theological choices while correcting an unnatural expression for Paul’s spiritual presence, preserving the Greek’s two coordinated objects, and improving the accuracy and grammar of the footnotes. The lowercase “mmụọ” continues to preserve the source’s ambiguity without specifying a doctrinal mechanism.
