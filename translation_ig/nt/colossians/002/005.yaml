id: COL.2.5
reference: Colossians 2:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: ig
  text: N’ihi na ọ bụrụgodị na anọghị m n’etiti unu n’anụ ahụ, ma mụ na unu nọ na mmụọ, ana m aṅụrị ọṅụ ma na-ahụ usoro ọma unu na ịdịsi ike nke okwukwe unu na Mesaịa[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịdịgide nke okwukwe unu na Mesaịa.”
    reason: lexical_alternative
  - marker: b
    text: O nwekwara ike ịbụ, “ikwesị ntụkwasị obi unu n’ebe Mesaịa nọ.”
    reason: alternative_reading
  - marker: c
    text: Okwu Grik bụ Χριστός, nke a na-atụgharịkarị “Kraịst”; a sụgharịrị ya “Mesaịa” n’ebe a n’ihi na ọ na-arụ ọrụ dịka utu aha.
    reason: lexical_alternative
lexical_decisions:
- source_word: σαρκί
  choice: n’anụ ahụ
  rationale: N’ebe a, okwu ahụ na-ekwu banyere enweghị Pọl n’ebe ha nọ n’ụzọ anụ ahụ, ọ bụghị banyere ọchịchọ mmehie. Nsụgharị a na-echekwa ọdịiche ya na “na mmụọ.”
- source_word: πνεύματι
  choice: na mmụọ
  rationale: O yikarịrị ka ọ na-ekwu na Pọl nọnyere ha na mmụọ ya n’agbanyeghị na ahụ ya anọghị ebe ahụ. Ide “mmụọ” na obere mkpụrụedemede adịghị emechi ụzọ kpamkpam nye nghọta nke metụtara Mmụọ Nsọ.
- source_word: χαίρων καὶ βλέπων
  choice: ana m aṅụrị ọṅụ ma na-ahụ
  rationale: A na-echekwa ngwaa abụọ ahụ na-aga n’otu oge n’asụsụ Igbo dị mfe ma dị ebube.
- source_word: τάξιν
  choice: usoro ọma unu
  rationale: τάξις na-egosi nhazi ma ọ bụ ịdị n’usoro kwesiri ekwesị. “Usoro ọma” na-egosi na Pọl na-eto ha, n’emeghị ka okwu ahụ bụrụ naanị okwu agha ma ọ bụ iwu siri ike.
- source_word: στερέωμα
  choice: otu ... siri kwụsie ike
  rationale: Okwu a na-egosi ịdị ike, ịdịgide, na enweghị ịma jijiji. Ụdị okwu a bụ nke Igbo nkịtị ma na-eburu ihe oyiyi nke okwukwe guzosiri ike.
- source_word: πίστεως
  choice: okwukwe
  rationale: “Okwukwe” bụ nsụgharị kacha kwekọọ n’ebe a, ebe a na-edebe nghọta ọzọ nke “ikwesị ntụkwasị obi” n’okpuru peeji.
- source_word: εἰς Χριστόν
  choice: na Mesaịa
  rationale: εἰς na-akọwa onye okwukwe ahụ na-elekwasị anya na ya; “na” bụ ụzọ Igbo si ekwu “okwukwe na” mmadụ. Χριστός na-arụ ọrụ dịka utu aha n’ebe a, ya mere e ji “Mesaịa.”
theological_decisions:
- issue: Onye “mmụọ” na-ezo aka na ya
  choice: A sụgharịrị ya “na mmụọ,” nke n’isi okwu ya na-egosi na Pọl nọnyere ha n’ụzọ na-abụghị nke anụ ahụ.
  alternative: Ọ pụrụ ịbụ na Pọl na-ekwu maka ịnọnyere ha site na Mmụọ Nsọ.
  rationale: Ọdịiche dị n’etiti “n’anụ ahụ” na “na mmụọ” na-akwado nghọta nke mmụọ Pọl, ma nsụgharị ahụ anaghị etinye nkọwa ozizi karịrị ihe Grik kwuru.
- issue: Nsụgharị Χριστόν
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ahịrịokwu a, Χριστός ka na-arụ ọrụ dịka utu aha; “Mesaịa” na-eme ka nke ahụ doo anya. A na-edebe “Kraịst,” nke bụ ntụgharị mkpụrụokwu Grik ahụ, n’okpuru peeji.
- issue: Ihe πίστις pụtara
  choice: okwukwe na Mesaịa
  alternative: ikwesị ntụkwasị obi n’ebe Mesaịa nọ
  rationale: “Okwukwe” bụ nghọta kacha adabara njikọ πίστις εἰς Χριστόν, ma okwu Grik ahụ nwekwara ike iburu echiche nke ikwesị ntụkwasị obi; ya mere e debere nke ahụ n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ ọdịiche “n’anụ ahụ ... na mmụọ” ka ọ dị n’enweghị ịgbakwunye nkwubi okwu ozizi. A gbanwere usoro aha nke Grik n’ụzọ ntakịrị gaa n’usoro okwu Igbo ka ahịrịokwu ahụ bụrụ nke mmadụ na-ekwu n’ezie, ma e chekwara isi ihe niile.
