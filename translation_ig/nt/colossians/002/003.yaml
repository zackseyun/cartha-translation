- from: N’ime onye ahụ ka e zoro akụ niile nke amamihe na ihe ọmụma[a][b].
  to: N’ime onye ahụ ka akụ niile nke amamihe na ihe ọmụma zoro ezo dị[a][b].
  rationale: The revision changes only the expression of hiddenness from an agentive passive to a stative Igbo construction, thereby matching the Greek predicate adjective more closely. It retains the personal antecedent, the full scope of the treasures, and the neutral lexical ambiguity. Footnote b is adjusted to avoid importing a future-oriented sense into the alternative “stored up.”
  reviewer_model: gpt-5.6-terra
