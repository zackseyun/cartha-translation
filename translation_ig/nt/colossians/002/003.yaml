  text: ἐν ᾧ εἰσιν πάντες οἱ θησαυροὶ τῆς σοφίας ⸀καὶ γνώσεως ἀπόκρυφοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/003.yaml
  text: in whom are hidden all the treasures of wisdom and knowledge[a][b].
translation:
  language: ig
  text: N’ime onye ahụ ka akụ niile nke amamihe na ihe ọmụma zoro ezo dị[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ime ihe ahụ,” ma ọ bụrụ na e were na nnọchiaha a na-ezo n’ụzọ sara mbara n’ihe omimi nke Chineke, kama izo aka n’onwe Kraịst.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “e chekwara”; okwu Grik ahụ nwere ike ịpụta ihe e zoro ezo ma ọ bụ ihe e debeere n’ụlọ nchekwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: N’ime onye ahụ
  rationale: Nnọchiaha njikọ a dị n’otu ma yikarịrị ka ọ na-ezo aka n’ebe Kraịst, onye a kpọtụrụ aha ozugbo na 2:2, nọ. Ya mere, okwu na-egosi mmadụ ka mma karịa nke ga-egosi ihe; ‘n’ime’ na-echekwa echiche ọnọdụ dị na ἐν.
- source_word: πάντες οἱ θησαυροὶ
  choice: akụ niile
  rationale: 'Nke a na-egosipụta mkpokọta zuru ezu nke okwu Grik ahụ: akụ niile, na-enweghị ibelata nkwupụta Pọl.'
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: nke amamihe na ihe ọmụma
  rationale: ‘Amamihe’ na ‘ihe ọmụma’ na-echekwa okwu abụọ dị iche ma nwee njikọ, na-ejikọghị ha ka ha bụrụ otu echiche.
- source_word: ἀπόκρυφοι
  choice: e zoro
  rationale: ‘E zoro’ bụ ntụgharị doro anya nke ihe e mere ka ọ ghara ịdị n’ihu ọha; ọ naghị ekpebi ma ihe ndị ahụ bụ ihe a na-apụghị iru ma ọ bụ ihe e debere n’ebe dị nchebe.
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: ka e zoro
  rationale: Usoro a bụ Igbo nkịtị na nke doro anya maka nkwupụta Grik nke na-ekwu na akụ ndị ahụ nọ n’ọnọdụ ezoro ezo.
theological_decisions:
- issue: Ma ἀπόκρυφοι ọ na-egosi ihe nzuzo naanị ndị ụfọdụ maara, ka ọ bụ ihe echekwara n’ime Kraịst
  choice: E jiri ‘e zoro’ kwuo ya n’ụzọ na-anọpụ iche.
  alternative: ‘e chekwara’ iji mesie nchekwa ma ọ bụ ịdị njikere ya ike; ma ọ bụ ‘dị na nzuzo’ iji mesie izochi ya ike.
  rationale: Okwu Grik ahụ n’onwe ya anaghị amanye ka a họrọ otu nkọwa n’ime ndị a. Ya mere, ntụgharị ahụ na-echekwa nghọtahie na esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Akụ’ bụ okwu nkịtị na nke siri ike maka θησαυροί; a hapụrụ ‘amamihe’ na ‘ihe ọmụma’ ka ha bụrụ echiche abụọ dị iche. Ihe nrịba ama ukwu ala [a] na [b] dị n’ahịrị amaokwu ahụ.
