  yaml_path: translation/nt/colossians/002/021.yaml
  text: “Do not handle[a], nor taste, nor touch,”
translation:
  language: ig
  text: “Ejidela[a], edetụkwala ire, emetụkwala aka,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Emetụla aka, edetụkwala ire, emetụkwala aka.” Ngwaa mbụ ahụ (ἅψῃ) nwekwara ike ịpụta “metụ aka” ma ọ bụ “jide”; e ji “ejidela” ebe a mee ka ọ dị iche na ngwaa ikpeazụ, θίγῃς (“metụ aka”).
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: Ejila
  rationale: μή ya na aorist subjunctive na-enye iwu mmachibido; “Ejila” na-ebute usoro iwu ndị a n’Igbo n’ụzọ doro anya.
- source_word: ἅψῃ
  choice: aka jide
  rationale: ἅπτω n’ụdị middle nwere ike ịpụta ‘metụ aka’ ma ọ bụ ‘jide.’ A họọrọ “aka jide” iji gosi ọdịiche ya na θίγῃς nke e sụgharịrị “metụ aka.”
- source_word: μηδὲ
  choice: -kwala
  rationale: Mmegharị μηδὲ na-ejikọta mmachibido ndị ahụ. Mgbakwunye “-kwala” bụ ụzọ Igbo nkịtị si kwuo ‘ọzọkwa emela,’ ma na-echekwa ike nchịkọta nke usoro ahụ.
- source_word: γεύσῃ
  choice: detụ ire
  rationale: γεύομαι pụtara n’ụzọ bụ isi ‘detụ ire’; nke a ka kpọmkwem karịa ịsụgharị ya dịka ‘rie.’
- source_word: θίγῃς
  choice: metụ aka
  rationale: θιγγάνω na-apụtakarị ‘metụ aka.’ Nke a na-echekwa ọdịiche dị n’etiti ya na ἅψῃ, nke e sụgharịrị “aka jide.”
theological_decisions:
- issue: Ụdị mmachibido iwu ndị a n’ihe gbara amaokwu ahụ gburugburu
  choice: E debere ha dịka usoro iwu mmachibido dị mkpirikpi, nke yiri okwu e hotara, n’enweghị nkọwa agbakwunyere.
  alternative: Ịgbasa ya ka ọ bụrụ “Ejila aka jide nke a, edetụkwala nke ahụ ire, emetụkwala aka,” ma ọ bụ ikwu hoo haa na ha bụ ụkpụrụ mmadụ.
  rationale: Grik nke amaokwu a dị nkenke ma nwee naanị mmachibido atọ. Nsụgharị ekwesịghị ibubata nkọwa sitere n’amaokwu ndị gbara ya gburugburu ma si otú ahụ dozie mgbagwoju anya ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. E chekwara mkpụmkpụ na ụda iwu nke Grik; usoro “Ejila … edetụkwala … emetụkwala” bụ okwu Igbo eke.
