revisions:
- from: E likọrọ unu na ya n'ime baptizim[a]; ọ bụkwa na baptizim ahụ ka e mere ka unu soro ya bilie, site n'okwukwe unu nwere n'ọrụ Chineke[b], onye mere ka o si ná ndị nwụrụ anwụ bilie.
  to: E liri unu na ya n'ime baptizim[a], nke e sikwa na ya mee ka unu soro ya bilie, site n'okwukwe n'ọrụ Chineke[b], onye mere ka o si ná ndị nwụrụ anwụ bilie.
  rationale: The revision corrects the central lexical error for burial, removes an unnecessary addition to ‘faith,’ and retains the Greek’s passive and union-with-Christ emphases without imposing a sacramental interpretation. Footnote anchors remain attached to “baptizim” and “ọrụ Chineke,” respectively, and the first note preserves the grammatically possible alternative antecedent of the relative pronoun.
  reviewer_model: gpt-5.6-terra
