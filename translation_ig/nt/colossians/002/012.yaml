review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal sequence of burial with Christ, baptism, co-resurrection, faith, God's operative work, and resurrection from the dead. However, “E likọrọ unu” does not naturally or accurately express being buried; it must be replaced with “E liri unu.” The revised wording also more closely retains the participial relationship and avoids adding “unu nwere” (“that you have”) to πίστις.
  naturalness: The revision uses clear, dignified Standard Igbo. “E liri unu na ya” and “nke e sikwa na ya mee ka unu soro ya bilie” are natural passive constructions and clearly convey the shared-with-Christ sense of the compound Greek verbs.
  terminology: “Baptizim,” “okwukwe,” “ọrụ Chineke,” and “ndị nwụrụ anwụ” are suitable. “Mesaya” is retained only in the alternative-reading note, where identifying the possible antecedent is useful. The note on πίστις now gives a more idiomatic Igbo expression for the possible sense of faithfulness.
  issues:
  - severity: high
    issue: “E likọrọ unu na ya” is not an adequate rendering of συνταφέντες αὐτῷ.
    rationale: 'συνταφέντες means ‘having been buried with [him].’ The normal, unambiguous Igbo verb is “lie” (passive: “e liri”). “Likọrọ” does not reliably communicate burial and risks changing the sense.'
  - severity: medium
    issue: The phrase “okwukwe unu nwere” adds an explicit possessive/verbal element not present in διὰ τῆς πίστεως.
    rationale: The Greek simply says ‘through faith,’ further qualified by the genitive phrase concerning God’s working. Removing “unu nwere” is both closer to the source and more concise Igbo.
  - severity: low
    issue: The main text’s linkage to the relative clause can be made more direct.
    rationale: Using “nke e sikwa na ya…” corresponds smoothly to ἐν ᾧ καὶ συνηγέρθητε while retaining baptism as the main-text antecedent and leaving the Messiah alternative in the footnote.
  revised_text: E liri unu na ya n'ime baptizim[a], nke e sikwa na ya mee ka unu soro ya bilie, site n'okwukwe n'ọrụ Chineke[b], onye mere ka o si ná ndị nwụrụ anwụ bilie.
  revised_footnotes:
