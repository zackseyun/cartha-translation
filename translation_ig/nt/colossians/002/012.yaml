id: COL.2.12
reference: Colossians 2:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: συνταφέντες αὐτῷ ἐν τῷ ⸀βαπτισμῷ, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ⸀ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/012.yaml
  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: ig
  text: E liri unu na ya n'ime baptizim[a], nke e sikwa na ya mee ka unu soro ya bilie, site n'okwukwe n'ọrụ Chineke[b], onye mere ka o si ná ndị nwụrụ anwụ bilie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma eleghị anya, a pụkwara ịsụ ya, “n'ime ya,” ma ọ bụrụ na e were okwu njikọ Grik ahụ ka ọ na-ezo aka na Mesaya kama baptizim.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “site na ntụkwasị obi n'ọrụ Chineke.” Okwu Grik ahụ nwekwara ike ịpụta “ikwesị ntụkwasị obi” n'ebe ụfọdụ, ma “okwukwe” bụ ntụgharị e ji mee ihe n'isiokwu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνταφέντες αὐτῷ
  choice: E likọrọ unu na ya
  rationale: “Likọrọ” na-egosipụta συν- (“ọnụ/na ya”), ebe usoro passive “e ... unu” na-edobe na ọ bụ ndị ọzọ mere olili ahụ, dị ka participle passive Grik si dị.
- source_word: ἐν τῷ βαπτισμῷ
  choice: n'ime baptizim
  rationale: “N'ime” na-edobe ohere locative/instrumental nke ἐν n'enweghị ịkọwa ya n'ụzọ nkwenkwe otu chọọchị; “baptizim” bụ okwu Standard Igbo a na-aghọta nke ọma.
- source_word: ἐν ᾧ
  choice: ọ bụkwa na baptizim ahụ ka
  rationale: Ihe kacha nso okwu njikọ ahụ na-ezo aka na ya bụ βαπτισμῷ; usoro a na-eme ka njikọ ahụ doo anya n'Igbo, ebe ndetu ala na-echekwa ụzọ ọzọ e nwere ike isi ghọta ya.
- source_word: συνηγέρθητε
  choice: e mere ka unu soro ya bilie
  rationale: “Soro ya bilie” na-egosipụta συν- nke ngwaa ahụ, “e mere ka” na-echekwakwa passive aorist.
- source_word: διὰ τῆς πίστεως
  choice: site n'okwukwe unu nwere
  rationale: “Site” na-egosipụta ụzọ e si mee ya; “okwukwe” bụ ntụgharị bụ isi nke πίστις n'ebe a, ebe “unu nwere” na-eme ka okwu Igbo bụrụ nke eke n'emebighị uche ahụ.
- source_word: τῆς ἐνεργείας τοῦ θεοῦ
  choice: n'ọrụ Chineke
  rationale: “Ọrụ” na-egosipụta ike Chineke na-arụ ọrụ n'ezie, ọ bụghị naanị ike dị ka echiche nkịtị.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: onye mere ka o si ná ndị nwụrụ anwụ bilie
  rationale: Usoro a na-edobe Chineke dị ka onye kpalitere mbilite ahụ ma na-asụ ἐκ νεκρῶν n'Igbo eke.
theological_decisions:
- issue: Ihe ἐν ᾧ na-ezo aka na ya
  choice: 'Na isiokwu bụ isi, ọ na-ezo aka na baptizim: “na baptizim ahụ.”'
  alternative: 'Ọ pụrụ izo aka na Mesaya: “n''ime onye ahụ.”'
  rationale: βαπτισμῷ bụ ihe kacha nso ọ na-ezo aka na ya n'usoro ahịrịokwu Grik. Ma ebe ụdị okwu Grik ahụ na-enye ohere ọzọ, e debere ya na ndetu ala kama ihichapụ esemokwu ahụ.
- issue: Uche okwu banyere baptizim
  choice: E debere njikọ siri ike dị n'etiti baptizim, iso Mesaya lie, na iso ya bilie, tinyere okwukwe.
  alternative: Ịkọwa ya kpọmkwem dịka baptizim na-eweta amara n'onwe ya, ma ọ bụ dịka naanị ihe nnọchianya.
  rationale: Amaokwu ahụ jikọtara ihe ndị a ọnụ, ma ọ naghị ekpebi n'onwe ya arụmụka chọọchị ndị mechara bilie banyere ụzọ baptizim si arụ ọrụ.
- issue: Uche πίστις
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N'usoro a, “okwukwe” ma ọ bụ “ntụkwasị obi” mmadụ nwere n'ọrụ Chineke bụ uche kacha dabara adaba; “ikwesị ntụkwasị obi” ka ekwe omume n'okwu ndị ọzọ ma o yighị ka ọ bụ isi uche ebe a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Likọrọ,” “soro ya bilie,” na “ọrụ Chineke” na-eme ka njikọ okwu Grik pụta ìhè n'enweghị itinye ozizi pụrụ iche nke otu chọọchị. Akara ndetu [a] na [b] abụọ dị n'isiokwu bụ isi.
