id: COL.3.15
reference: Colossians 3:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ ⸀Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: ig
  text: Ka udo nke Mesaịa[a] chịkwaa n’obi unu[b], bụ udo ahụ a kpọrọ unu ka unu nwee n’otu ahụ[c]. Na-enwekwanụ ekele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya “Kraịst.” Okwu Grik bụ Χριστός bụ aha ọkwá pụtara “Onye E Tere Mmanụ.”
    reason: lexical_alternative
  - marker: b
    text: Okwu a sụgharịrị “chịkwaa” nwekwara ike ịpụta “kpee ikpe dịka ọkaikpe egwuregwu” ma ọ bụ “kpebie.” Nke a na-egosi udo Mesaịa dịka ihe na-ekpebi ma na-eduzi.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịghọta ya dịka “ịbanye n’otu ahụ,” nke na-emesi ijikọta ha ka ha bụrụ otu ahụ ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: udo
  rationale: “Udo” bụ okwu Igbo nkịtị ma dabara n’echiche Pọl banyere ịdị n’udo na ịdị n’otu n’etiti ndị kwere ekwe.
- source_word: τοῦ Χριστοῦ
  choice: nke Mesaịa
  rationale: Χριστός bụ aha ọkwá pụtara Onye E Tere Mmanụ; “Mesaịa” na-edobe ọrụ aha ọkwá ahụ kama ime ya naanị aha mmadụ.
- source_word: βραβευέτω
  choice: na-achị
  rationale: Okwu Grik ahụ nwere echiche onye na-ekpebi okwu ma ọ bụ ọkaikpe egwuregwu; “na-achị” na-egosi na udo ga-abụ ihe na-edu ma na-ekpebi omume ha.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: n’obi unu
  rationale: Nke a bụ ụzọ Igbo sitere n’okike si kwuo ebe echiche, ọchịchọ, na mmetụta mmadụ dị; “unu” na-edobekwa ọtụtụ mmadụ dị na Grik.
- source_word: εἰς ἣν
  choice: udo ahụ ... ka unu nwee
  rationale: Nhazi a na-eme ka o doo anya n’Igbo na okwu nnọchi ahụ na-ezo aka n’udo, ma ọ naghị akọwa ụzọ kpọmkwem e si ‘kpọọ’ ha baa na ya.
- source_word: ἐν ἑνὶ σώματι
  choice: n’otu ahụ
  rationale: Nke a na-edobe ihe atụ Pọl nke ọtụtụ mmadụ jikọrọ ọnụ dịka otu ahụ, n’enweghị ịgbakwunye ‘ụka’ n’amaokwu ahụ.
- source_word: εὐχάριστοι γίνεσθε
  choice: Na-abụkwanụ ndị nwere obi ekele
  rationale: Nke a bụ Igbo dị ndụ nke na-egosi ọnọdụ ha kwesịrị ịnọgide na-azụlite, ọ bụghị naanị otu omume inye ekele.
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: Ebe a okwu ahụ ka na-arụ ọrụ dịka aha ọkwá nke Onye E Tere Mmanụ; e tinyere ụdị a na-ejikarị “Kraịst” na nkọwa ala peeji.
- issue: Ihe “otu ahụ” pụtara
  choice: E debere ihe atụ nke otu ahụ n’enweghị ịkọwa ya ọzọ
  alternative: Ịsị kpọmkwem “n’otu ụka”
  rationale: Ọ bụ ezie na okwu Pọl nwere ike na-ezo aka n’ụka, ide “ụka” n’ahịrị bụ ịkọwa ihe ihe odide Grik hapụrụ dịka ihe atụ.
- issue: Ike βραβευέτω
  choice: na-achị
  alternative: na-ekpebi ihe dịka ọkaikpe
  rationale: “Na-achị” bụ okwu a na-aghọta ngwa ngwa ma na-edobe echiche nke udo ịbụ ihe na-achịkwa ndụ ime mmụọ na mmekọrịta obodo; nkọwa ala peeji na-echekwa ihe oyiyi onye ọkaikpe.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “obi ekele” kama naanị “ekele” iji mee ka εὐχάριστοι bụrụ àgwà na-adịgide adịgide. Akara ogologo ahịrị na-ejikọta “udo ahụ” na udo e kwuru na mbụ n’enweghị ahịrịokwu gbagọrọ agbagọ.
