  text: εἰδότες ὅτι ἀπὸ κυρίου ⸀ἀπολήμψεσθε τὴν ἀνταπόδοσιν τῆς κληρονομίας· ⸀τῷ κυρίῳ Χριστῷ δουλεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/024.yaml
  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: ig
  text: N’ịmara na n’aka Onyenwe anyị ka unu ga-anata ụgwọ ọrụ nke ihe nketa ahụ. Ọ bụ Onyenwe anyị bú Mesaya ka unu na-ejere ozi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka a na-asụgharịkarị ya, “Onyenwe anyị bú Kraịst.” Okwu Grik a bụ nkwupụta, “unu na-ejere ozi,” ọ bụghị iwu kpọmkwem, “jeerenụ ozi.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδότες
  choice: ebe unu maara
  rationale: Na-egosi participle nke na-aga n’ihu site n’amaokwu bu ya ụzọ; ọ na-enye echiche nke ihe mere e ji mee ndụmọdụ ahụ n’enweghị ịtụgharị ya ka ọ bụrụ ahịrịokwu ọhụrụ kpamkpam.
- source_word: ἀπὸ κυρίου
  choice: n’aka Onyenwe anyị
  rationale: N’Igbo, “ịnata n’aka” na-egosi nke ọma na Onyenwe anyị bụ isi iyi nke ihe a ga-anata, dịka ἀπό na genitive si egosi.
- source_word: ἀπολήμψεσθε
  choice: unu ga-anata
  rationale: Ọ bụ future middle indicative; “ga-anata” bụ okwu Igbo doro anya ma kwekọọ n’ihe ἀνταπόδοσιν na-ekwu.
- source_word: ἀνταπόδοσιν
  choice: ụgwọ ọrụ
  rationale: Na ọnọdụ ọma a nke ụgwọ a ga-enye n’ọdịnihu, “ụgwọ ọrụ” na-ebute echiche nke nkwụghachi ma bụrụkwa okwu ndị nkịtị na-aghọta ngwa ngwa.
- source_word: τῆς κληρονομίας
  choice: nke ihe nketa ahụ
  rationale: E debere genitive ahụ n’ụzọ dị mkpirikpi, ka a ghara ikpebi ma ihe nketa ahụ ọ̀ bụ ụgwọ ọrụ ahụ n’onwe ya ma ọ bụ ihe e ji mara ya.
- source_word: τῷ κυρίῳ Χριστῷ
  choice: Onyenwe anyị bú Mesaya
  rationale: A sụgharịrị Χριστός dịka aha ọkwa “Mesaya,” ebe κύριος bụ “Onyenwe anyị”; “bú” na-eme ka njikọ aha ọkwa abụọ ahụ doo anya n’Igbo.
- source_word: δουλεύετε
  choice: ka unu na-ejere ozi
  rationale: 'A nọgidere n’ụdị indicative nke Grik: ọ na-ekwupụta onye ha na-ejere ozi ugbu a, ọ bụghị iwu kpọmkwem.'
theological_decisions:
- issue: Otu e si sụgharịa Χριστῷ dịka aha ọkwa
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a Χριστός na-arụ ọrụ dịka aha ọkwa nke onye ahụ e tere mmanụ; “Mesaya” na-eme ka echiche aha ọkwa ahụ pụta ìhè, ebe e nyere “Kraịst” dịka ụzọ ọdịnala n’okpuru amaokwu.
- issue: Ike okwu δουλεύετε
  choice: 'indicative: “ka unu na-ejere ozi”'
  alternative: 'imperative: “jeerenụ ... ozi”'
  rationale: Ụdị Grik bụ present active indicative, onye nke abụọ plural. Ya mere, nsụgharị ahụ na-edebe ya dịka nkwupụta na-akpali ha, kama ime ya iwu kpọmkwem.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. E ji “unu” debe plural nke Grik. Nhazi “Ọ bụ ... ka ...” na-eme ka onye a na-ejere ozi pụta ìhè n’ụzọ ebumpụta ụwa n’Igbo, ebe ọ ka na-edebe indicative nke isi mmalite.
