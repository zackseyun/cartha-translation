id: COL.3.4
reference: Colossians 3:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ⸀ὑμῶν, τότε καὶ ὑμεῖς σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/004.yaml
  text: When Messiah[a], who is your life, is revealed[c][b], then you also will be revealed with him in glory.
translation:
  language: ig
  text: Mgbe Mesaịa[a], onye bụ ndụ unu[b], ga-apụta ìhè, mgbe ahụ unu onwe unu ga-apụta ìhè ọnụ na ya n’ebube.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” Okwu Grik bụ Χριστός, aha ọkwá nke pụtara Onye E Tere Mmanụ.
    reason: alternative_reading
  - marker: b
    text: N’ụzọ nkịtị, “Mesaịa, ndụ unu.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịtụgharị ya, “mgbe ahụ a ga-ekpughekwa unu ọnụ na ya n’ebube.” E ji otu mgbọrọgwụ ngwaa Grik mee ihe n’ebe abụọ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Mgbe
  rationale: Ọ na-ewebata ihe a na-atụ anya na ọ ga-eme n’ọdịnihu; “Mgbe” bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji ekwu ụdị oge a.
- source_word: ὁ Χριστὸς
  choice: Mesaịa
  rationale: Χριστός bụ aha ọkwá nke pụtara Onye E Tere Mmanụ; “Mesaịa” na-edobe ya dị ka aha ọkwá, ọ bụghị naanị aha mmadụ.
- source_word: φανερωθῇ
  choice: ga-apụta ìhè
  rationale: Nkebiokwu a na-egosi na a ga-eme ka a hụ ya nke ọma ma ọ bụ ka ọ pụta n’ihu ọha; ọ bụkwa Igbo e ji eme ihe n’ụzọ ebumpụta ụwa.
- source_word: ἡ ζωὴ ὑμῶν
  choice: onye bụ ndụ unu
  rationale: Akwụkwọ Grik tinyere “ndụ unu” n’akụkụ “Mesaịa” iji kọwaa onye ọ bụ. “Onye bụ ndụ unu” na-eme ka njikọ ahụ doo anya n’Igbo n’etinyeghị echiche ọzọ.
- source_word: τότε καὶ ὑμεῖς
  choice: mgbe ahụ unu onwe unu ga-
  rationale: “Mgbe ahụ” na-edobe usoro oge, ebe “unu onwe unu” na-egosipụta nkwusi ike dị na nnọchiaha Grik; echiche nke καί pụtara na ngwaa “ga-esokwa.”
- source_word: σὺν αὐτῷ
  choice: soro ya
  rationale: Ọ na-egosi mkpakọrịta na isonye n’ihe ga-eme Mesaịa.
- source_word: φανερωθήσεσθε
  choice: ga-apụta ìhè
  rationale: E ji otu nkebiokwu ahụ tụgharịa mgbọrọgwụ ngwaa ahụ e ji na mbụ, ka myirịta dị n’etiti mpụta Mesaịa na nke ndị kwere ekwe ghara ifu.
- source_word: ἐν δόξῃ
  choice: n'ebube
  rationale: Ọ na-edobe ma okwu njikọ ahụ ma ịdị arọ nke δόξα, nke nwere ike igosi ọnọdụ ma ọ bụ ụdị mpụta ahụ.
theological_decisions:
- issue: Ịtụgharị Χριστός dị ka aha ọkwá ma ọ bụ dị ka aha nkịtị
  choice: Mesaịa
  alternative: Kraịst
  rationale: Ebe a Χριστός nwere njirimara aha ọkwá; “Mesaịa” na-egosi ihe aha ọkwá ahụ pụtara n’enweghị itinye nkọwa otu ụka.
- issue: Njirimara apposition nke Mesaịa na ndụ ndị kwere ekwe
  choice: onye bụ ndụ unu
  alternative: ndụ unu
  rationale: Nke a na-edobe nkwupụta siri ike nke ederede na Mesaịa bụ ndụ ha, ma na-eme ka usoro ahụ bụrụ Igbo doro anya.
- issue: Myirịta dị n’etiti ụdị abụọ nke φανερόω
  choice: ga-apụta ìhè ... ga-esokwa ya pụta ìhè
  alternative: ga-ekpughe ... a ga-ekpughekwa unu
  rationale: Ịmegharị “pụta ìhè” na-echekwa njikọ okwu ahụ ma na-anọgide na-asụ Igbo dị mma; ọ naghị ekpebi ma isi echiche bụ ịhụ anya, ikpughe, ma ọ bụ ha abụọ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “unu” chekwaa plural nke ὑμῶν na ὑμεῖς. “Pụta ìhè” na-enye Igbo ebumpụta ụwa ma na-echekwa myirịta nke ngwaa abụọ ahụ.
