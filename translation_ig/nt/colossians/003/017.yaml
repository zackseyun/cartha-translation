    text: A pụkwara ịsị, “n'ihe unu na-ekwu ma ọ bụ n'ihe unu na-eme.”
    reason: lexical_alternative
  - marker: b
    text: “N'aha” nwekwara ike ịpụta “n'okpuru ikike” ma ọ bụ “dị ka ndị na-anọchite anya Onyenwe anyị Jizọs.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the central connective so that the translation retains the Greek ‘or’ between word and deed. It also changes the final prepositional phrase to the usual Igbo expression for mediation, preserving ‘through him.’ The comprehensive ‘πάντα’ is made explicit as ‘ihe niile’; although this slightly repeats the earlier indefinite expression, it naturally reflects the Greek’s deliberate totalizing restatement.
