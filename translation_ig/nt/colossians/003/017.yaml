language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πᾶν ⸂ὅ τι⸃ ⸀ἐὰν ποιῆτε ἐν λόγῳ ἢ ἐν ἔργῳ, πάντα ἐν ὀνόματι κυρίου Ἰησοῦ, εὐχαριστοῦντες τῷ ⸀θεῷ πατρὶ δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: ig
  text: Ihe ọ bụla unu na-eme, ma n'okwu ma ọ bụ n'omume[a], meenụ ihe niile n'aha Onyenwe anyị Jizọs[b], na-ekele Chineke Nna site na ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n'ihe unu na-ekwu ma ọ bụ n'ihe unu na-eme.”
    reason: lexical_alternative
  - marker: b
    text: “N'aha” nwekwara ike ịpụta “n'okpuru ikike” ma ọ bụ “dị ka ndị na-anọchite anya Onyenwe anyị Jizọs.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: Ihe ọ bụla unu na-eme
  rationale: Nkebiokwu a na-egosi ihe niile n'enweghị nke a hapụrụ. ‘Ihe ọ bụla unu na-eme’ bụ Igbo doro anya nke na-echekwa nghọta ahụ sara mbara.
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: ma n'okwu ma n'omume
  rationale: Nke a na-echekwa ntụnyere dị n'etiti okwu mmadụ na omume ya n'ụzọ dị mkpirikpi ma bụrụkwa nke ndị na-agụ Igbo taa ga-aghọta.
- source_word: πάντα
  choice: meenụ ya niile
  rationale: ‘Ya niile’ na-achịkọta ihe ọ bụla e kwuru na mbụ ma na-egosipụta ike nke πάντα n'Igbo nkịtị.
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: n'aha Onyenwe anyị Jizọs
  rationale: Nsụgharị a na-echekwa akpaalaokwu Akwụkwọ Nsọ na obosara nghọta ya, nke nwere ike ịgụnye ikike, nnọchite anya, na nrubeisi.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: N'ebe a κύριος bụ utu aha Kraịst. ‘Onyenwe anyị’ na-echekwa ịdị arọ nke utu aha ahụ ma bụrụkwa Igbo a maara nke ọma.
- source_word: εὐχαριστοῦντες
  choice: na-ekele
  rationale: Ụdị a na-egosi na inye ekele na-aga n'ihu n'otu oge ahụ ha na-eme ihe niile ahụ.
- source_word: τῷ θεῷ πατρὶ
  choice: Chineke Nna
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma doo anya isi sụgharịa apposition ahụ n'etinyeghị nkọwa ọzọ.
- source_word: δι’ αὐτοῦ
  choice: site n'aka ya
  rationale: Nnọchiaha ahụ na-ezo aka n'Onyenwe anyị Jizọs. ‘Site n'aka ya’ na-echekwa echiche nke ịbụ onye e ji ekele Chineke n'ebughị nkọwa gafee ihe Grik kwuru.
theological_decisions:
- issue: Ihe ‘n'aha Onyenwe anyị Jizọs’ pụtara
  choice: E debere akpaalaokwu ‘n'aha Onyenwe anyị Jizọs’ n'ahịrịokwu bụ isi.
  alternative: ‘n'okpuru ikike Onyenwe anyị Jizọs’ ma ọ bụ ‘dị ka ndị na-anọchite anya Onyenwe anyị Jizọs’
  rationale: Nkebiokwu Grik ahụ nwere nghọta sara mbara nke gụnyere ikike, nnọchite anya, na njikọ mmadụ na Jizọs. Ichekwa akpaalaokwu ahụ na-egbochi nsụgharị ịkpa ya ókè n'otu nkọwa.
- issue: Onye ‘ya’ dị na ‘site n'aka ya’ na-ezo aka na ya
  choice: Ọ na-ezo aka n'Onyenwe anyị Jizọs dịka onye e si n'aka ya ekele Chineke Nna.
  alternative: Ịghọta nnọchiaha ahụ n'ụzọ izugbe n'enweghị imesi ọrụ Jizọs ike
  rationale: Onyenwe anyị Jizọs bụ onye e kwuru aha ya nso tupu nnọchiaha ahụ, ya mere nke a bụ nghọta kacha kwekọọ n'usoro okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere nhazi okwu na omume, aha Onyenwe anyị Jizọs, na inye Chineke Nna ekele site n'aka ya n'ụzọ na-echekwa usoro na ịdị arọ nke Grik.
