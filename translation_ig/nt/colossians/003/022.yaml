id: COL.3.22
reference: Colossians 3:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Servants[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: ig
  text: Ndị ohu[a], ruberenụ ndị bụ nna unu ukwu n’anụ ahụ[c] isi n’ihe niile; ọ bụghị naanị mgbe ha na-ele unu anya[b], dị ka ndị na-achọ ime mmadụ obi ụtọ, kama n’obi na-enweghị aghụghọ, na-atụ Onyenwe anyị egwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Ndị ohu” (Grik: δοῦλοι) nwekwara ike ịpụta “ndị na-eje ozi,” ma n’ebe a ọ na-ezokarị aka ná ndị nọ n’ohu n’okpuru ikike nna ukwu.'
    reason: lexical_alternative
  - marker: b
    text: Nke a pụtara ọrụ mmadụ na-arụ naanị mgbe nna ya ukwu na-ahụ ya.
    reason: cultural_note
  - marker: c
    text: “N’anụ ahụ” pụtara n’ihe gbasara mmekọrịta mmadụ n’ụwa a; ọ na-egosi na ikike ndị nna ukwu ahụ nwere abụghị nke ikpeazụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: Ndị ohu
  rationale: N’ọnọdụ iwu ezinụlọ a, δοῦλοι na-ezo aka kpọmkwem ná ndị nọ n’ohu n’okpuru nna ukwu; “ndị ohu” anaghị eme ka ezi ọnọdụ mmekọrịta ahụ dị nro.
- source_word: ὑπακούετε κατὰ πάντα
  choice: na-eruberenụ ... isi n’ihe niile
  rationale: Ụdị iwu a na-enye iwu ka ha rube isi, ebe “n’ihe niile” na-edobe obosara κατὰ πάντα.
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: ndị bụ nna unu ukwu n’ụzọ anụ ahụ
  rationale: “Nna ukwu” na-egosi ndị nwe ohu, ebe “n’ụzọ anụ ahụ” na-echekwa okwu Pọl bụ κατὰ σάρκα na oke ọchịchị mmadụ ndị a nwere.
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: unu arụla ọrụ naanị mgbe ha na-ele unu anya
  rationale: 'Nkọwa a na-enye echiche okwu ngwakọta ahụ n’Igbo doro anya: ọrụ a na-arụ naanị n’ihu onye na-ele anya.'
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: dị ka ndị na-achọ ime ndị mmadụ obi ụtọ
  rationale: Nke a na-egosi ebumnuche ọjọọ nke ime ihe nanị iji nweta ihu ọma mmadụ.
- source_word: ἀλλ’ ἐν ἁπλότητι καρδίας
  choice: kama jirinụ otu obi nke eziokwu
  rationale: ἁπλότης καρδίας ebe a pụtara obi na-enweghị aghụghọ ma lekwasị anya n’otu ihe; okwu a na-ezere nghọta nke “ịdị mfe” dị ka enweghị amamihe.
- source_word: φοβούμενοι τὸν κύριον
  choice: na-atụ Onyenwe anyị egwu
  rationale: Ọ na-echekwa echiche Akwụkwọ Nsọ banyere ịtụ Onyenwe anyị egwu, ghara ime ka ọ bụrụ naanị nsọpụrụ; “Onyenwe anyị” na-ekewa Kraịst n’ebe ndị nna ukwu mmadụ nọ.
theological_decisions:
- issue: Ndụmọdụ omume e nyere n’etiti usoro ịgba ohu
  choice: Kpọọ ndị ahụ “ndị ohu” na ndị nwere ha “nna ukwu,” ma mee ka ọdịiche dị n’etiti ọchịchị mmadụ na Onyenwe anyị pụta ìhè.
  alternative: Ịsụgharị ha dị ka ndị ọrụ na ndị were ha n’ọrụ.
  rationale: Okwu Grik na ọnọdụ iwu ezinụlọ oge ochie na-ekwu banyere ịgba ohu, ọ bụghị nkwekọrịta ọrụ nke oge a. Nsụgharị ahụ na-akọ ezi ọnọdụ ahụ n’emeghị ka amaokwu ahụ bụrụ nkwado usoro ịgba ohu.
- issue: Ihe “ịtụ Onyenwe anyị egwu” pụtara
  choice: Debe okwu ahụ dị ka “na-atụ Onyenwe anyị egwu.”
  alternative: “na-asọpụrụ Onyenwe anyị.”
  rationale: “Ịsọpụrụ” naanị ya nwere ike ime ka ike φοβούμενοι na isiokwu Akwụkwọ Nsọ banyere egwu Onyenwe anyị dị nro; nsụgharị a na-ahapụ njikọ egwu na nsọpụrụ ka ọ dị.
translation_notes:
  register: Standard Igbo nke oge a, nwere ugwu ma dị mfe nghọta. E jiri “nna ukwu” maka κύριος nke mmadụ, ma jiri aha nsọ “Onyenwe anyị” maka κύριος nke Chineke. E kọwara ὀφθαλμοδουλία n’ụzọ nkịtị kama iji okwu ọhụrụ siri ike. Akara nkọwa ụkwụ [a], [b], na [c] niile dị n’ederede bụ isi.
