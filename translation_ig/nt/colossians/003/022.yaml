revisions:
- from: Ndị ohu[a], na-eruberenụ ndị bụ nna unu ukwu n’ụzọ anụ ahụ isi n’ihe niile; unu arụla ọrụ naanị mgbe ha na-ele unu anya[b], dị ka ndị na-achọ ime ndị mmadụ obi ụtọ, kama jirinụ otu obi nke eziokwu na-atụ Onyenwe anyị egwu.[c]
  to: Ndị ohu[a], ruberenụ ndị bụ nna unu ukwu n’anụ ahụ[c] isi n’ihe niile; ọ bụghị naanị mgbe ha na-ele unu anya[b], dị ka ndị na-achọ ime mmadụ obi ụtọ, kama n’obi na-enweghị aghụghọ, na-atụ Onyenwe anyị egwu.
  rationale: The revision preserves the Greek contrast between obedience to human masters and fear of the Lord, expresses eye-service as a manner of conduct rather than a separate command, and uses idiomatic Standard Igbo for sincere, uncalculated devotion. It also relocates footnote [c] to its proper textual anchor.
