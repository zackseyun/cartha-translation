    text: “N’anụ ahụ” pụtara n’ihe gbasara mmekọrịta mmadụ n’ụwa a; ọ na-egosi na ikike ndị nna ukwu ahụ nwere abụghị nke ikpeazụ.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek contrast between obedience to human masters and fear of the Lord, expresses eye-service as a manner of conduct rather than a separate command, and uses idiomatic Standard Igbo for sincere, uncalculated devotion. It also relocates footnote [c] to its proper textual anchor.
