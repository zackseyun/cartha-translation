    rationale: Ụdị a na-etinye 'mmadụ' n’ederede ma na-ekpebi nghọta mmadụ-nanị. Okwu Grik dị mkpụmkpụ ma nwee ohere nghọta sara mbara; 'n'ime ha niile' na-edobe ambiguity ahụ nke ọma n’ebe ndepụta ndị a nọ.
