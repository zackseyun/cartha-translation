id: COL.3.11
reference: Colossians 3:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, servant, free, but Messiah is all[c][b], and in all.
translation:
  language: ig
  text: N'ebe ahụ, ọ dịghị onye Grik na onye Juu, onye e biri úgwù na onye a na-ebighị úgwù, onye mba ọzọ[a], onye Sitia, ohu na onye nweere onwe ya; kama Mezaịa[b] bụ ihe niile, nọkwa n'ime ha niile.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a na-akọwakarị onye na-abụghị onye Grik, karịsịa onye ndị Grik lere anya dị ka onye na-amaghị asụsụ ma ọ bụ omenala ha; n'ọtụtụ nsụgharị ọdịnala, “onye mba ọhịa.”
    reason: historical_context
  - marker: b
    text: Grik bụ Christos, ya bụ utu aha “Mezaịa” ma ọ bụ “Onye E Tere Mmanụ.” A na-asụgharịkwa ya n'ọdịnala dịka “Kraịst.”
    reason: lexical_alternative
  - marker: c
    text: N'ụzọ nkịtị, “n'ime niile.” Okwu Grik ahụ dị mkpụmkpụ; ọ pụrụ izo aka na mmadụ niile nọ n'obodo ọhụrụ ahụ, ma ọ bụ nwee nghọta sara mbara dịka “n'ime ihe niile.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: N'ebe ahụ
  rationale: Ọ na-ezo aka n'ọnọdụ ọhụrụ ahụ a kọwara n'amaokwu bu ụzọ, ma na-edobe echiche nke ebe ma ọ bụ ngalaba.
- source_word: οὐκ ἔνι
  choice: e nweghị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma dị ndụ si egosi na ọdịiche ndị a enweghị ọnọdụ n'ime obodo ọhụrụ ahụ.
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: onye Grik ma ọ bụ onye Juu
  rationale: E debere aha agbụrụ abụọ ahụ kpọmkwem; n'okpuru nkwupụta na-ajụ ihe, “ma ọ bụ” bụ ụzọ Igbo nkịtị si depụta ndị otu ahụ n'enweghị ịgbanwe ihe Grik pụtara.
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: onye e biri úgwù ma ọ bụ onye a na-ebighị úgwù
  rationale: Ọ bụ ezie na Grik ji aha omume, ebe a ha na-anọchi anya ìgwè mmadụ. Ịkọwa ha dị ka mmadụ na-eme ka Igbo doo anya ma na-edobe ọdịiche okpukpe na mmekọrịta mmadụ.
- source_word: βάρβαρος
  choice: onye mba ọzọ
  rationale: N'okwu Grik oge ahụ, ọ na-akpọ onye na-abụghị onye Grik ma a na-ele anya dị ka onye na-adịghị asụ asụsụ ma ọ bụ na-adịghị eso omenala Grik. “Onye mba ọzọ” na-ezere ibubata mkparị nke oge a, ebe nkọwa ala peeji na-edobe agba akụkọ ihe mere eme ya.
- source_word: Σκύθης
  choice: onye Sitia
  rationale: Nke a bụ aha otu agbụrụ kpọmkwem, ya mere a sụgharịghị ya ka ọ bụrụ aha izugbe.
- source_word: δοῦλος
  choice: ohu
  rationale: N'ihi na e tinyere ya megide onye nweere onwe ya, “ohu” na-edobe ọnọdụ mmadụ nọ n'okpuru onye nwe ya, ọ bụghị naanị onye na-eje ozi.
- source_word: ἐλεύθερος
  choice: onye nweere onwe ya
  rationale: Nke a bụ okwu Igbo doro anya nke na-emegide “ohu” n'ihe gbasara ọnọdụ mmadụ n'obodo.
- source_word: τὰ πάντα
  choice: bụ ihe niile
  rationale: Nke a na-edobe mkpụmkpụ na ịdị ukwuu nke nkwupụta Grik n'enweghị ịgbakwunye nkọwa banyere kpọmkwem otú Mezaịa si bụrụ ihe niile.
- source_word: ἐν πᾶσιν
  choice: ọ nọkwa n'ime mmadụ niile
  rationale: Ndị e depụtara n'amaokwu ahụ na-eme ka nghọta gbasara ndị niile nọ n'obodo ọhụrụ ahụ bụrụ nke kacha kwekọọ n'ọnọdụ ahụ; nkọwa ala peeji na-edobe ohere sara mbara nke okwu Grik.
- source_word: Χριστός
  choice: Mezaịa
  rationale: E ji ya dịka utu aha nke Onye Chineke tere mmanụ. “Mezaịa” na-egosipụta ọrụ utu aha ahụ; nkọwa ala peeji na-enye ụdị ọdịnala “Kraịst.”
theological_decisions:
- issue: Oke ἐν πᾶσιν
  choice: n'ime mmadụ niile
  alternative: n'ime ihe niile; ma ọ bụ n'ime ha niile
  rationale: Ihe gbara okwu ahụ gburugburu bụ ndị otu obodo ọhụrụ ahụ, ma okwu Grik dị mkpụmkpụ ma nwee ike ịdị sara mbara. Nkọwa ala peeji na-ekwupụta ohere ahụ kama izochi ya.
- issue: Ntụgharị Χριστός
  choice: Mezaịa
  alternative: Kraịst; Onye E Tere Mmanụ
  rationale: Ebe a okwu ahụ na-arụ ọrụ dịka utu aha. “Mezaịa” na-edobe ọdịnaya nke utu aha ahụ, ebe a na-egosi ụdị a na-ejikarị eme ihe n'ala peeji.
- issue: Ọnọdụ δοῦλος
  choice: ohu
  alternative: onye na-eje ozi
  rationale: Njikọ ya na ἐλεύθερος na-eme ka ọnọdụ ịgba ohu pụta ìhè; “onye na-eje ozi” ga-eme ka ike ọdịiche ahụ belata.
translation_notes:
  register: E jiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro ọdịiche agbụrụ, okpukpe, omenala, na ọnọdụ mmadụ nke Grik, ma jiri “ma ọ bụ” mee ka ndepụta dị n'okpuru nkwupụta na-ajụ ihe bụrụ Igbo nkịtị. E tinyere nkọwa ala peeji ebe okwu Grik nwere agba akụkọ ihe mere eme ma ọ bụ nghọta karịrị otu.
