review_pass:
  verdict: revise
  source_fidelity: A ghaghị idozi njikọ abụọ mbụ ka ha ghara ịgbanwe καὶ ('na') nke Grik ka ọ bụrụ 'ma ọ bụ'. Ọzọkwa, 'n'ime mmadụ niile' na-akọwa ἐν πᾶσιν n'ụzọ dị warara karịa ihe Grik na-ekwu; 'n'ime ha niile' na-edobe mkpirisi na oghere okwu ahụ nke ọma n’ọnọdụ a.
  naturalness: 'Ntụgharị a gbanwere ka ọ bụrụ Standard Igbo dị mfe: ''ọ dịghị onye Grik na onye Juu'' na ndepụta ndị na-eso ya na-agụ nke ọma. ''Mezaịa bụ ihe niile, nọkwa n''ime ha niile'' bụ ahịrịokwu dị ndụ ma ghara imejuputa okwu ''mmadụ'' nke isi mmalite ekwughị.'
  terminology: A na-edobe 'Mezaịa' maka Χριστός, 'ohu' maka δοῦλος n’ihi ọdịiche ya na onye nweere onwe ya, na 'onye Sitia' maka Σκύθης. 'Onye mba ọzọ' maka βάρβαρος chọrọ nkọwa ala peeji iji gosi agba akụkọ ihe mere eme na nlele ndị Grik oge ahụ, na-enweghị ibubata mkparị na-adịghị mkpa n’Igbo nke oge a.
