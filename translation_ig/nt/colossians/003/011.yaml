- from: N'ebe ahụ, e nweghị onye Grik ma ọ bụ onye Juu, onye e biri úgwù ma ọ bụ onye a na-ebighị úgwù, onye mba ọzọ[a], onye Sitia, ohu ma ọ bụ onye nweere onwe ya; kama Mezaịa[b] bụ ihe niile, ọ nọkwa n'ime mmadụ niile.[c]
  to: N'ebe ahụ, ọ dịghị onye Grik na onye Juu, onye e biri úgwù na onye a na-ebighị úgwù, onye mba ọzọ[a], onye Sitia, ohu na onye nweere onwe ya; kama Mezaịa[b] bụ ihe niile, nọkwa n'ime ha niile.[c]
  rationale: E dochiela 'ma ọ bụ' abụọ ahụ na 'na' iji soro καὶ nke isi mmalite. E dochiekwala 'n'ime mmadụ niile' na 'n'ime ha niile' ka e wee ghara ịkọwa ἐν πᾶσιν n’ụzọ mechiri emechi. Nkọwa ala peeji ndị dị adị na-anọgide na-enye nkọwa gbasara βάρβαρος, Χριστός, na ohere nghọta nke ἐν πᾶσιν.
