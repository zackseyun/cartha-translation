    reason: alternative_reading
  revision_rationale: Only the rendering of εὐάρεστον has been changed. ‘Ihe na-amasị’ naturally communicates ‘what is pleasing’ in Standard Igbo while retaining the Greek construction’s lack of an explicitly named recipient. The wording ‘n’ime Onyenwe anyị’ and the note preserve the source phrase’s interpretive openness.
