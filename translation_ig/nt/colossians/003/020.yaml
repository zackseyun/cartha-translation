  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν κατὰ πάντα, τοῦτο γὰρ ⸂εὐάρεστόν ἐστιν⸃ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: ig
  text: Ụmụ, na-eruberenụ ndị mụrụ unu isi n’ihe niile, n’ihi na nke a bụ ihe na-amasị[a] n’ime Onyenwe anyị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe a na-anabata.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta “n’ime Onyenwe anyị” dị ka ihe na-akọwa ihe na-amasị n’ime mmekọrịta mmadụ na Onyenwe anyị, ọ bụghị naanị dị ka “ihe na-amasị Onyenwe anyị.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: Ụmụ
  rationale: “Ụmụ” bụ okwu nkịtị n’Igbo maka ụmụ mmadụ ndị a na-agwa okwu n’ezinụlọ; ọ naghị ekewapụ ụmụ nwoke na ụmụ nwanyị, ọ dịghịkwa amachibido ya naanị n’ebe ụmụaka dị obere nọ.
- source_word: ὑπακούετε
  choice: na-eruberenụ ... isi
  rationale: Nkebiokwu “irubere mmadụ isi” na-egosi ime ihe onye nwere ikike kwuru, ya mere ọ na-ebute ike iwu dị na ὑπακούετε karịa naanị “ige ntị.” “Na-” na-enyekwa iwu ahụ echiche omume a ga na-eme mgbe niile.
- source_word: τοῖς γονεῦσιν
  choice: ndị mụrụ unu
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke e ji asụ Igbo ugbu a maka “nne na nna/parents”; “unu” na-eme ka njikọ ahụ doo anya dị ka ọ dị mkpa n’okwu a na-agwa ụmụ kpọmkwem.
- source_word: κατὰ πάντα
  choice: n’ihe niile
  rationale: Ọ na-echekwa echiche banyere obosara ma ọ bụ akụkụ niile nke nrubeisi, kama ịtụgharị ya ka ọ bụrụ naanị oge niile.
- source_word: τοῦτο
  choice: nke a
  rationale: Ọ na-ezo aka n’iwu nrubeisi e kwuru tupu ya, ma na-echekwa usoro ngosi dị mfe nke Grik.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara e ji nye iwu ahụ n’Igbo eke na nghọta.
- source_word: εὐάρεστόν ἐστιν
  choice: bụ ihe na-atọ ụtọ
  rationale: Ọ na-egosi ihe dị mma ma na-enye afọ ojuju; ihe odide ala peeji na-edebe nhọrọ ọzọ, “ihe a na-anabata.”
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Ọ na-echekwa preposishọn ἐν na okwu Pọl na-ejikarị eme ihe, kama ime ya naanị “na-atọ Onyenwe anyị ụtọ,” nke ga-akọwa njikọ ahụ n’ụzọ dị warara karịa Grik.
theological_decisions:
- issue: Oke iwu ahụ bụ “n’ihe niile” na njikọ ya na “n’ime Onyenwe anyị”
  choice: E debere “n’ihe niile” na “n’ime Onyenwe anyị” n’enweghị itinye okwu mgbochi na-adịghị n’amaokwu ahụ.
  alternative: A pụrụ ịghọta “n’ime Onyenwe anyị” dị ka ihe na-amachi nrubeisi n’ihe kwekọrọ n’uche Onyenwe anyị, ma ọ bụ dị ka “n’ihi na nke a na-atọ Onyenwe anyị ụtọ.”
  rationale: Grik etinyeghị nkebiokwu mgbochi n’akụkụ “n’ihe niile,” njikọ ụtọasụsụ ya na-eme ka “n’ime Onyenwe anyị” soro echiche nke ihe na-atọ ụtọ n’ụzọ kachasị nso. Nsụgharị ahụ na-edebe esemokwu na obosara okwu ahụ ka onye na-agụ ya tụlee, kama idozi ya site n’itinye nkọwa n’ime amaokwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ụmụ” gụnyere ụmụ nwoke na ụmụ nwanyị; “ndị mụrụ unu” bụ okwu eke maka nne na nna. E debere “n’ime Onyenwe anyị” n’agbanyeghị na ọ dị ntakịrị arọ karịa ntụgharị nkọwa, iji chekwaa njupụta na nghọtahie pụrụ ịdị na ἐν κυρίῳ.
