  text: ἀνεχόμενοι ἀλλήλων καὶ χαριζόμενοι ἑαυτοῖς ἐάν τις πρός τινα ἔχῃ μομφήν· καθὼς καὶ ὁ ⸀κύριος ἐχαρίσατο ὑμῖν οὕτως καὶ ὑμεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/013.yaml
  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: ig
  text: Na-enwe ndidi n'ebe ibe unu nọ, na-agbagharakwa ibe unu, ma ọ bụrụ na onye ọ bụla nwere mkpesa megide onye ọzọ[a]. Dịka Onyenweanyị gbaghaara unu, unu kwa na-emekwa otu ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ma ọ bụrụ na onye ọ bụla nwere ihe mere o ji taa onye ọzọ ụta.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, e kwughị ngwaa dị na nkebi ikpeazụ; a na-aghọta ya site n’ihe gbara ya gburugburu. A pụrụ ịsụgharị ya, “unu kwa na-agbagharakwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι ἀλλήλων
  choice: Na-anagiderịta ibe unu
  rationale: “Na-anagiderịta” na-egosi omume na-aga n’ihu nke mmadụ ji ndidi na-anabata ibe ya; ụdị mmegharị ahụ na-egosikwa mmekọrịta dị n’etiti ndị otu okwukwe.
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: na-agbagharakwa ibe unu
  rationale: N’ebe a, χαρίζομαι pụtara ịgbaghara mmejọ. “Ibe unu” na-enye echiche nke omume ndị obodo ahụ na-emere ibe ha.
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: ma ọ bụrụ na onye ọ bụla nwere mkpesa megide onye ọzọ
  rationale: Nkebi a bụ ọnọdụ gbasara onye ọ bụla n’enweghị onye a kpọrọ aha. “Mkpesa” na-egosi ihe mmadụ nwere megide ibe ya n’ebughị ya karịa ihe Grik kwuru.
- source_word: καθὼς καὶ
  choice: Dị nnọọ ka
  rationale: Nke a na-edobe ntụnyere siri ike nke mere mgbaghara Onyenwe anyị ji bụrụ ụkpụrụ maka mgbaghara ndị kwere ekwe.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị eme ihe maka κύριος dị ka aha nsọpụrụ, n’akọwaghị onye ọ bụ karịa ka Grik mere.
- source_word: ἐχαρίσατο
  choice: gbaghara
  rationale: Okwu a kwekọrọ n’echiche χαριζόμενοι dị n’elu ma na-egosi mgbaghara Onyenwe anyị nyere ha.
- source_word: οὕτως καὶ ὑμεῖς
  choice: unu onwe unu ga-emekwa otu ahụ
  rationale: Grik hapụrụ ngwaa ahụ ka a ghọta ya site n’ihe gbara ya gburugburu. Igbo chọrọ mmeju a ka ahịrịokwu guzozie nke ọma; “mee otu ahụ” na-ezere ịgbakwunye echiche ọhụrụ.
theological_decisions:
- issue: Onye ὁ κύριος na-ezo aka na ya
  choice: Jiri “Onyenwe anyị” n’ahịrịokwu ahụ n’akọwaghị ya ọzọ
  alternative: Ịkọwa ya kpọmkwem dịka Kraịst, ma ọ bụ ịghọta ya n’ozuzu dịka Chineke
  rationale: N’akwụkwọ Ndị Kọlọsi, aha a yikarịrị ka ọ na-ezo aka na Kraịst, ma nsụgharị ahụ na-edobe aha Grik n’onwe ya ka ọ ghara imechi nghọta ọzọ okwu ahụ nwere ike ibu.
- issue: Ngwaa a hapụrụ n’ikpeazụ
  choice: Mee ka ọ doo anya dịka “ga-emekwa otu ahụ”
  alternative: Ịsị naanị “otu ahụkwa unu,” ma ọ bụ ịgbakwunye kpọmkwem “unu ga-agbagharakwa”
  rationale: Grik hapụrụ omume ahụ ka a ghọta ya site n’okwu bu ya ụzọ. Nsụgharị a na-eme ka Igbo bụrụ nke okike ma na-edobe njikọ ahụ n’enweghị ịkọwa ngwaa ahụ karịa ka ọ dị mkpa.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke nwere ugwu ma dị mfe nghọta, dee ya. “Na-anagiderịta” na “na-agbagharakwa” na-edobe usoro omume na-aga n’ihu, ebe “Onyenwe anyị” na-echekwa aha nsọpụrụ nke Grik n’ebughị nkọwa ụka ọ bụla bata.
