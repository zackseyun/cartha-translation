revisions:
- from: Na-anagiderịta ibe unu, na-agbagharakwa ibe unu, ma ọ bụrụ na onye ọ bụla nwere mkpesa megide onye ọzọ[a]. Dị nnọọ ka Onyenwe anyị gbaghaara unu, unu onwe unu ga-emekwa otu ahụ[b].
  to: Na-enwe ndidi n'ebe ibe unu nọ, na-agbagharakwa ibe unu, ma ọ bụrụ na onye ọ bụla nwere mkpesa megide onye ọzọ[a]. Dịka Onyenweanyị gbaghaara unu, unu kwa na-emekwa otu ahụ[b].
  rationale: The revision replaces an awkward rendering of reciprocal forbearance with idiomatic Standard Igbo, regularizes the title for κύριος, and removes unnecessary reflexive emphasis from the final clause. It retains the source’s elliptical comparison by using “na-emekwa otu ahụ,” while the footnote identifies forgiveness as the contextually implied action without making it the sole wording of the text.
