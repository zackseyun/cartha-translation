  text: τὰ ἄνω φρονεῖτε, μὴ τὰ ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/002.yaml
  text: Set your minds on the things above[b][a], not on the things on the earth.
translation:
  language: ig
  text: Dọnụ uche unu n’ihe ndị dị n’elu[a], ọ bụghị n’ihe ndị dị n’ụwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Cheenụ echiche banyere ihe ndị dị n’elu.” Ngwaa Grik ahụ abụghị naanị iche echiche; ọ gụnyekwara ime ka uche ma ọ bụ mmasị mmadụ lekwasị anya n’ihe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ihe ndị dị n’elu ala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄνω
  choice: ihe ndị dị n’elu
  rationale: Nkebiokwu a na-arụ ọrụ dị ka aha ọtụtụ, na-ezo aka n’ihe ma ọ bụ ọnọdụ ndị dị n’elu; ntụgharị a na-edobe ọdịiche ya na ihe ndị dị n’ụwa.
- source_word: φρονεῖτε
  choice: Na-echekwanụ echiche unu n’
  rationale: Ngwaa a pụtara ime ka uche, echiche, na mmasị mmadụ lekwasị anya n’ihe, ọ bụghị naanị icheta ya otu mgbe. Ụdị iwu na-aga n’ihu ka e gosiri site na ‘na-echekwanụ.’
- source_word: μὴ
  choice: ọ bụghị
  rationale: Ọ na-ajụ ihe nke abụọ n’ụzọ na-eme ka ọdịiche dị n’etiti ihe ndị dị n’elu na ihe ndị dị n’ụwa pụta ìhè.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: ihe ndị dị n’ụwa
  rationale: Nke a na-edobe usoro aha ọtụtụ na ọdịiche gbasara ebe dị n’okwu Grik, n’asụsụ Igbo dị mfe ma kwekọọ n’usoro okwu nkịtị.
- source_word: γῆς
  choice: ụwa
  rationale: N’ọdịiche a na ‘elu,’ okwu Grik na-ezo aka n’ụwa, ọ bụghị n’otu ala ma ọ bụ ógbè kpọmkwem.
theological_decisions:
- issue: Ụdị ndụmọdụ Pọl nyere site na φρονεῖτε
  choice: Iwu ka mmadụ na-eme ka echiche, uche, na ihe ọ na-eji kpọrọ ihe lekwasị anya n’ihe ndị dị n’elu
  alternative: Iwu dị warara nke naanị iche echiche banyere eluigwe
  rationale: φρονέω metụtara echiche, ọnọdụ uche, na mmasị mmadụ. Nsụgharị a na-edobe ike omume na nke mmụọ nke okwu ahụ n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Na-echekwanụ echiche unu n’…’ na-egosi iwu a na-aga n’ihu nye ọtụtụ mmadụ, ma na-edobe obosara nke φρονεῖτε.
