revisions:
- from: 'Unu onwe unu kwa na-ejebukwa n’ime ihe ndị a[a], mgbe unu na-ebi n’ime ha.


    [a] A pụkwara ịsụgharị ya, “N’ime ihe ndị ahụ ka unu onwe unu kwa na-ejebụ, mgbe unu na-ebi n’ime ha.” Okwu nnọchiaha nke Grik nwere ike ịpụta n’ụzọ nkịtị karị, “n’ime ihe ndị ahụ.”'
  to: N’ime ihe ndị a ka unu kwa na-eje ije n’oge gara aga, mgbe unu na-ebi n’ime ha.[a]
  rationale: The revision explicitly renders ποτέ as “n’oge gara aga,” uses idiomatic Standard Igbo syntax, and retains the lexical and conceptual distinction between metaphorical walking and living. The footnote remains a legitimate lexical alternative while describing the Greek relative pronoun accurately.
