  text: In these things you too once walked[a], when you were living in them.
translation:
  language: ig
  text: N’ime ihe ndị a ka unu kwa na-eje ije n’oge gara aga, mgbe unu na-ebi n’ime ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “N’ime ihe ndị ahụ ka unu kwa na-eje ije n’oge gara aga, mgbe unu na-ebi n’ime ha.” Okwu nnọchiaha mmekọrịta dị na Grik nwere ike ịpụta n’ụzọ nkịtị karị, “n’ime ihe ndị ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: n’ime ihe ndị a
  rationale: Okwu a na-arụtụ aka n’ihe ọjọọ ndị e depụtara n’amaokwu ndị bu ụzọ. Nsụgharị a doro anya ma ka na-echekwa echiche nke ịnọ n’ime omume ndị ahụ.
- source_word: καὶ ὑμεῖς
  choice: unu onwe unu kwa
  rationale: '“Onwe unu kwa” na-egosipụta nkwusi okwu dị na καὶ na nnọchiaha ὑμεῖς: ndị Kọlọsi sokwa bie ụdị ndụ ahụ n’oge gara aga.'
- source_word: περιεπατήσατε
  choice: na-ejebukwa
  rationale: Nke a na-echekwa ihe atụ Pọl ji ‘ije’ kọwaa ụzọ mmadụ si ebi ndụ, ma “-bu” na-egosi na ọ bụ omume oge gara aga.
- source_word: ποτε
  choice: -bu
  rationale: Mgbakwunye “-bu” na Igbo na-egosi n’ụzọ e ji asụ Igbo na omume ahụ bụ nke oge gara aga, ọ bụghị nke ugbu a.
- source_word: ὅτε
  choice: mgbe
  rationale: Ọ bụ njikọ oge sitere n’okike nke na-ejikọta ụzọ ndụ ha gara aga na ọnọdụ ha nọ na ya mgbe ahụ.
- source_word: ἐζῆτε
  choice: na-ebi
  rationale: Ụdị a na-egosipụta ọnọdụ gara n’ihu n’oge ahụ, ma na-edokwa ọdịiche dị n’etiti ‘ije’ dị ka ihe atụ na ‘ibi ndụ.’
- source_word: ἐν τούτοις
  choice: n’ime ha
  rationale: “Ha” na-alaghachi n’ihe ọjọọ ndị ahụ ma na-ezere ikwughachi “ihe ndị a” n’ụzọ na-adịghị mkpa.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ‘ije’ na ‘ibi’ n’otú Pọl si kọwaa ndụ omume mmadụ
  choice: E debere ‘ije’ maka ụzọ ha si akpa àgwà, e debekwa ‘ibi n’ime ha’ maka ọnọdụ ndụ ha nọ na ya.
  alternative: Ịsụgharị ngwaa abụọ ahụ naanị dị ka ‘ibi ndụ.’
  rationale: Idobe ngwaa abụọ dị iche na-eso περιπατέω na ζάω nke Grik, na-echekwa nkọwa Pọl nwere akụkụ abụọ, ma ọ naghị etinye ozizi ọzọ n’ime amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E chekwara ihe atụ nke ‘ije’ kama ime ka ngwaa abụọ ahụ bụrụ naanị ‘ibi ndụ.’
