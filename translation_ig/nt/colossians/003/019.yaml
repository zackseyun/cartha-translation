review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies ἄνδρες and γυναῖκες as husbands and wives in this household-code context, and it preserves the imperative force of ἀγαπᾶτε. “Unu enwekwala obi ilu n’ebe ha nọ” appropriately retains the bitterness/embitterment imagery of μὴ πικραίνεσθε while directing it toward the wives (πρὸς αὐτάς).
  naturalness: “Ndị bụ di” and “ndị nwunye unu” are understandable but less idiomatic than the concise, standard forms “Ndị di” and “nwunye unu.” The revised wording is natural modern Standard Igbo while retaining the plural address and marital sense.
  terminology: “Hụnụ ... n’anya” is the normal Igbo rendering for love. “Obi ilu” preserves the lexical image and relational implication without restricting the Greek to physical force or coercion. The footnote is revised because its proposed alternative, “imeso ... ihe n’ike,” is too narrow and can suggest coercion rather than bitter or harsh treatment.
  issues:
  - severity: low
    issue: Less idiomatic marital labels
    rationale: “Ndị bụ di” and “ndị nwunye unu” can be simplified to “Ndị di” and “nwunye unu,” which are more natural Standard Igbo in a direct address.
  - severity: medium
    issue: Footnote alternative narrows the Greek sense
    rationale: “Unu emesokwala ha ihe n’ike” focuses on forceful treatment and does not adequately represent the possible sense of being or becoming bitter/embittered toward them.
