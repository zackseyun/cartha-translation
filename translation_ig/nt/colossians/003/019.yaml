  rationale: The revision makes the marital terms more idiomatic in Standard Igbo and replaces a footnote alternative that overly narrows πικραίνεσθε. The main line continues to preserve the Greek term’s bitterness imagery and its direction toward the wives, while the footnote states the related sense of harsh, resentful treatment without treating it as the only possible meaning.
