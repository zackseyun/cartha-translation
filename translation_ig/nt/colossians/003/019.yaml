  text: οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας καὶ μὴ πικραίνεσθε πρὸς αὐτάς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/019.yaml
  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: ig
  text: Ndị di, hụnụ nwunye unu n’anya, unu enwekwala obi ilu n’ebe ha nọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “unu aghọkwala ndị obi ilu n’ebe ha nọ.” Ngwaa Grik ahụ pụrụ ịpụta ịbụ ma ọ bụ ịghọ onye obi ilu n’ebe mmadụ nọ; n’ebe a, ọ nwekwara ike ịpụta imeso ha ihe n’obi iwe ma ọ bụ n’ụzọ siri ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: Ndị bụ di
  rationale: Ọ bụ ezie na ἀνήρ pụrụ ịpụta nwoke ma ọ bụ di, ọnọdụ ntụziaka ezinụlọ a na okwu gbasara ndị nwunye na-egosi na ihe a na-ekwu bụ ndị bụ di.
- source_word: ἀγαπᾶτε
  choice: hụnụ ... n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị si kwuo ịhụ mmadụ n’anya; ụdị iwu ahụ na-egosipụta imperative dị na Grik.
- source_word: τὰς γυναῖκας
  choice: ndị nwunye unu
  rationale: γυνή pụrụ ịpụta nwanyị ma ọ bụ nwunye, ma n’ọnọdụ mmekọrịta alụmdi na nwunye a, ọ pụtara ndị nwunye; ‘unu’ na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: μὴ πικραίνεσθε
  choice: unu enwekwala obi ilu
  rationale: πικραίνω nwere echiche bụ isi nke ilu ma ọ bụ ịbụ onye obi ya jupụtara n’ilu; nsụgharị a na-echekwa ihe oyiyi okwu Grik na nghọtahie ya nwere ike ibu, kama imechi ya naanị n’omume ike.
- source_word: πρὸς αὐτάς
  choice: n’ebe ha nọ
  rationale: πρός na accusative ebe a na-egosi onye a na-eche ihu n’omume ma ọ bụ n’ọnọdụ obi; okwu Igbo a na-egosi na obi ilu ahụ bụ megide ndị nwunye ha.
theological_decisions:
- issue: Ntụziaka ezinụlọ na okwu e ji kpọọ nwoke na nwanyị
  choice: E debere okwu ahụ kpọmkwem nye ndị bụ di banyere ndị nwunye ha.
  alternative: Iji okwu sara mbara dịka ‘ndị nwoke’ na ‘ndị nwanyị.’
  rationale: Okwu Grik n’ọnọdụ a na-ekwu kpọmkwem banyere mmekọrịta alụmdi na nwunye, ọ bụghị banyere ụmụ nwoke na ụmụ nwanyị niile.
- issue: Ma πικραίνεσθε na-ekwu maka ọnọdụ obi ka ọ bụ omume ọjọọ
  choice: E ji ‘enwekwala obi ilu’ chekwaa echiche bụ isi nke ilu, ebe nkọwa ala peeji kọwara na ọ pụrụ ịpụta mmeso ike sitere n’iwe na iwe n’obi.
  alternative: ‘Unu emesokwala ha ihe n’ike.’
  rationale: Ngwaa Grik nwere ike igosi ịghọ onye obi ilu ma ọ bụ ime ka mmekọrịta jupụta n’ilu; ịhapụ okwu ilu n’ahịrị bụ isi na-echekwa nghọta na esemokwu ahụ.
translation_notes:
  register: Asụsụ Igbo Ọha dị ugbu a, dị nsọ ma dị mfe nghọta. E ji ‘Ndị bụ di’ na ‘ndị nwunye unu’ mee ka mmekọrịta alụmdi na nwunye doo anya; e tinyere akara ala peeji [a] ozugbo n’ahịrị isi.
