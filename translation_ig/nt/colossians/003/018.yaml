  rationale: The revision improves the natural Standard Igbo address and uses the conventional imperative form “dọnụ onwe unu n’okpuru.” It preserves the Greek’s marital context, voluntary/reflexive imperative sense, and the Lord-related qualifier. Footnote b is corrected to describe the imperfect-form alternative without importing the unsupported phrase “n’oge ahụ.”
