  text: Αἱ γυναῖκες, ὑποτάσσεσθε ⸀τοῖς ἀνδράσιν, ὡς ἀνῆκεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/018.yaml
  text: Wives[a], submit yourselves to your husbands[b], as is fitting in the Lord.
translation:
  language: ig
  text: Ndị nwunye, dọnụ onwe unu n’okpuru di unu[a], dịka o kwesịrị[b] n’ime Onyenwe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nọọnụ n’okpuru di unu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dịka o dabara adaba”; ụdị ngwaa Grik ahụ nwere ike ịpụta “o dabara adaba” n’oge gara aga, ma n’ebe a o yikarịrị ka ọ na-arụ ọrụ n’echiche oge ugbu a n’ozuzu.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: Unu ndị bụ nwunye
  rationale: N’ọnọdụ ntụziaka ezinụlọ a, okwu ahụ na-ezo aka n’ụmụanyị lụrụ di, ọ bụghị ụmụanyị niile. Nhọrọ a na-egosipụta mmekọrịta alụmdi na nwunye n’Igbo doro anya.
- source_word: ὑποτάσσεσθε
  choice: doonụ onwe unu n’okpuru
  rationale: Okwu iwu a na-akọwa iji ọchịchọ nke onwe kwado ọnọdụ mmadụ n’okpuru onye ọzọ n’ime mmekọrịta a. ‘Doonụ onwe unu n’okpuru’ na-echekwa echiche nke ime ihe ahụ n’onwe ha, kama ikwu na onye ọzọ mere ka ha nọrọ n’okpuru.
- source_word: ἀνδράσιν
  choice: ndị di unu
  rationale: N’ihi na e jikọtara ya na ‘ndị bụ nwunye’ n’ime ntụziaka ezinụlọ, ἀνήρ pụtara ‘di,’ ọ bụghị naanị ‘nwoke.’ ‘Unu’ na-eme ka mmekọrịta ahụ doo anya n’Igbo.
- source_word: ὡς
  choice: dịka
  rationale: N’ebe a ὡς na-egosi ụkpụrụ nke ihe kwesịrị ekwesị, ọ bụghị ihe kpatara ya. ‘Dịka’ na-egosipụta njikọ ahụ n'ụzọ ebumpụta ụwa.
- source_word: ἀνῆκεν
  choice: o kwesịrị
  rationale: Ọ bụ ezie na ụdị okwu Grik ahụ bụ nke na-adịkarị na-egosi oge gara aga, n’okwu ndụmọdụ a ọ na-eburu echiche zuru oge nke ihe kwesịrị ekwesị. ‘O kwesịrị’ bụ okwu Igbo dị mfe ma kwesị ntụkwasị obi.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: A na-edebe nkebiokwu a nso n’usoro Grik. Ọ na-egosi na ịdị ekwesị nke ndụmọdụ ahụ dị n’ime mmekọrịta ha na Onyenwe anyị.
theological_decisions:
- issue: Ókè na ntọala nke iwu a
  choice: E debere ‘dịka o kwesịrị n’ime Onyenwe anyị,’ ka o doo anya na a na-atụle ihe kwesịrị ekwesị n’okpuru mmekọrịta na nrubeisi nye Onyenwe anyị.
  alternative: Ịghọta ya naanị dịka omenala ọha mmadụ na-enweghị nkọwa banyere Onyenwe anyị, ma ọ bụ ijikọ ‘n’ime Onyenwe anyị’ naanị na ndị nwunye.
  rationale: N’usoro Grik, ἐν κυρίῳ so na nkwupụta banyere ihe kwesịrị ekwesị. Nsụgharị ahụ anaghị eme iwu ahụ ka ọ bụrụ ụkpụrụ na-enweghị ókè, ma ọ naghịkwa agbakwunye nkọwa ozizi nke amaokwu ahụ na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Unu ndị bụ nwunye’ na ‘ndị di unu’ na-eme ka ọnọdụ alụmdi na nwunye pụta ìhè; ‘Onyenwe anyị’ bụ nsụgharị a na-ahụkarị maka κύριος.
