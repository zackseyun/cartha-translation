id: COL.3.12
reference: Colossians 3:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐνδύσασθε οὖν ὡς ἐκλεκτοὶ τοῦ θεοῦ, ἅγιοι καὶ ἠγαπημένοι, σπλάγχνα οἰκτιρμοῦ, χρηστότητα, ταπεινοφροσύνην, πραΰτητα, μακροθυμίαν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/012.yaml
  text: Put on[a], then, as God’s chosen ones, holy and beloved, compassion, kindness, humility, gentleness[b], and patience[c],
translation:
  language: ig
  text: Ya mere, dị ka ndị Chineke họpụtara, ndị dị nsọ na ndị Chineke hụrụ n’anya, yikwasịnụ obi ebere[a], obiọma, ịdị umeala n’obi, ịdị nwayọọ[b], na ndidi[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, okwu Grik ahụ na-ekwu maka mmetụta ebere dị n’ime mmadụ; a pụkwara ịsụgharị ya “mmetụta miri emi nke ebere.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “ịdị nro.” Ọ pụtaghị adịghị ike.
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, ndidi na-adịte aka, karịsịa n’imeso ndị ọzọ ihe; a pụkwara ịsụgharị ya “ịta ahụhụ nwayọọ ogologo oge.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνδύσασθε
  choice: yikwasịnụ
  rationale: 'Ọ bụ iwu nke na-eji iyi uwe mee ihe atụ: ka ha were omume ọma ndị a dị ka uwe ha na-eyikwasị. “Yikwasịnụ” na-edobe ihe atụ ahụ n’Igbo dị mfe ma doo anya.'
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi na ndụmọdụ a sitere n’ihe e kwuru tupu ya; “Ya mere” na-ejikọta okwu abụọ ahụ nke ọma.
- source_word: ὡς
  choice: dị ka
  rationale: Na-edobe echiche nke ime ihe kwekọrọ n’ọnọdụ ha bụ́ ndị Chineke họpụtara, na-enweghị ime ka njikọ ahụ bụrụ naanị ihe kpatara ya.
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: ndị Chineke họpụtara
  rationale: Na-egosi n’ụzọ doro anya na Chineke bụ onye họọrọ ha, ma na-ezere okwu pụrụ iburu nkọwa ozizi pụrụ iche karịrị ihe amaokwu ahụ kwuru.
- source_word: ἅγιοι
  choice: ndị dị nsọ
  rationale: Na-edobe ya dịka nkọwa gbasara njirimara ndị a na-agwa okwu, kama ịgbanwe ya ka ọ bụrụ aha ọdịnala.
- source_word: ἠγαπημένοι
  choice: ndị ọ hụrụ n’anya
  rationale: Na-egosipụta na Chineke hụrụ ha n’anya ma na-edobe ịhụnanya ahụ; nnọchiaha “ọ” na-ezo aka na Chineke e kwuru ozugbo tupu ya.
- source_word: σπλάγχνα οἰκτιρμοῦ
  choice: obi ebere
  rationale: Okwu Grik ahụ pụtara n’ụzọ nkịtị mmetụta ebere dị n’ime mmadụ. “Obi ebere” bụ okwu Igbo ebumpụta ụwa nke na-egosi ebere sitere n’ime obi, ma ọ bụghị nkọwa ahụ mmadụ siri ike.
- source_word: χρηστότητα
  choice: obiọma
  rationale: Ọ bụ okwu Igbo a na-aghọta nke ọma maka omume ọma na mmesapụ aka n’ebe ndị ọzọ nọ.
- source_word: ταπεινοφροσύνην
  choice: ịdị umeala n’obi
  rationale: Na-egosipụta echiche nke ịdị ala n’uche n’ụzọ dị mma na nke a na-ejikarị eme ihe n’Igbo.
- source_word: πραΰτητα
  choice: ịdị nwayọọ
  rationale: Na-egosi omume dị nro nke a na-achịkwa nke ọma, na-enweghị ime ka ọ pụta ìhè dị ka adịghị ike.
- source_word: μακροθυμίαν
  choice: ogologo ntachi obi
  rationale: Na-egosipụta ndidi na-adịte aka, karịsịa n’imeso ndị ọzọ ihe, ma na-edobe akụkụ “ogologo” dị n’okwu Grik.
theological_decisions:
- issue: Ịsụgharị ἐκλεκτοὶ τοῦ θεοῦ n’enweghị itinye usoro ozizi pụrụ iche banyere nhọpụta
  choice: ndị Chineke họpụtara
  alternative: ndị Chineke họrọpụtara iche
  rationale: Nhọrọ a na-ekwupụta ihe ederede ahụ kwuru—na Chineke họpụtara ha—ma ọ naghị akọwa ụzọ, oge, ma ọ bụ usoro nhọpụta ahụ nke amaokwu a na-akọwaghị.
- issue: Mmekọrịta nke ἅγιοι καὶ ἠγαπημένοι na “ndị Chineke họpụtara”
  choice: ndị dị nsọ na ndị ọ hụrụ n’anya
  alternative: dị nsọ, bụrụkwa ndị a hụrụ n’anya
  rationale: 'E debere ha dịka nkọwa atọ gbasara njirimara ndị na-agụ akwụkwọ: ndị Chineke họpụtara, ndị dị nsọ, na ndị Chineke hụrụ n’anya. Nke a anaghị eme ka ha bụrụ iwu ọhụrụ ma ọ bụ ihe mmadụ ga-eji nweta nhọpụta.'
- issue: Ichekwa ihe atụ uwe n’iwu Ἐνδύσασθε
  choice: yikwasịnụ
  alternative: nweenụ
  rationale: “Yikwasịnụ” na-edobe ihe atụ Pọl ji mee ihe, ebe “nweenụ” ga-eme ka ihe atụ ahụ laa n’iyi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ debere usoro ndepụta nke Grik na ihe atụ nke iyi uwe. “Obi ebere” bụ akpaalaokwu Igbo dị ndụ maka σπλάγχνα οἰκτιρμοῦ; “ogologo ntachi obi” na-eme ka akụkụ ndidi na-adịte aka nke μακροθυμία pụta ìhè.
