    text: N’ụzọ nkịtị, okwu Grik ahụ na-ekwu maka mmetụta ebere dị n’ime mmadụ; a pụkwara ịsụgharị ya “mmetụta miri emi nke ebere.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “ịdị nro.” Ọ pụtaghị adịghị ike.
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, ndidi na-adịte aka, karịsịa n’imeso ndị ọzọ ihe; a pụkwara ịsụgharị ya “ịta ahụhụ nwayọọ ogologo oge.”
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s meaning and the established clothing metaphor while making God the explicit referent of “beloved.” It uses the more idiomatic “ndidi” for μακροθυμία and corrects the related note so that it describes patient forbearance rather than generalized endurance. Footnote b is narrowed to a genuine lexical alternative for πραΰτης.
