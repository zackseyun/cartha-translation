revisions:
- from: Ya mere, dị ka ndị Chineke họpụtara, ndị dị nsọ na ndị ọ hụrụ n’anya, yikwasịnụ obi ebere[a], obiọma, ịdị umeala n’obi, ịdị nwayọọ[b], na ogologo ntachi obi[c].
  to: Ya mere, dị ka ndị Chineke họpụtara, ndị dị nsọ na ndị Chineke hụrụ n’anya, yikwasịnụ obi ebere[a], obiọma, ịdị umeala n’obi, ịdị nwayọọ[b], na ndidi[c],
  rationale: The revision retains the source’s meaning and the established clothing metaphor while making God the explicit referent of “beloved.” It uses the more idiomatic “ndidi” for μακροθυμία and corrects the related note so that it describes patient forbearance rather than generalized endurance. Footnote b is narrowed to a genuine lexical alternative for πραΰτης.
