id: COL.3.8
reference: Colossians 3:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: ig
  text: 'Ma ugbu a, unu kwa, tufụnụ ihe ndị a niile: iwe, ọnụma, obi ọjọọ, nkwulu, na okwu rụrụ arụ n’ọnụ unu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: ga-ewepụkwa
  rationale: Ọ na-enye iwu ka ha tufuo àgwà ndị a dị ka ihe a na-eyipụ; “wepụ” bụ okwu Igbo doro anya ma dịkwa eke n’ebe a.
- source_word: ὀργήν
  choice: iwe
  rationale: “Iwe” bụ okwu sara mbara maka anger, ma na-edobe ọdịiche ya na θυμός.
- source_word: θυμόν
  choice: ọnụma
  rationale: “Ọnụma” na-egosi iwe siri ike ma ọ bụ iwe na-enwu ọkụ, nke dabara na θυμός ma kewapụ ya na ὀργή.
- source_word: κακίαν
  choice: obi ọjọọ
  rationale: N’usoro omume ọjọọ ndị a, “obi ọjọọ” na-egosi ebumnobi ime mmadụ ihe ọjọọ, ya bụ malice.
- source_word: βλασφημίαν
  choice: nkwulu
  rationale: βλασφημία nwere ike ịbụ okwu mkparị ma ọ bụ nkwulu; “nkwulu” na-edobe ịdị obosara ya n’enweghị ịmachi ya naanị n’ikwu okwu megide Chineke.
- source_word: αἰσχρολογίαν
  choice: okwu rụrụ arụ
  rationale: Ọ na-akọwa okwu ihere, okwu na-adịghị ọcha, ma ọ bụ okwu jọgburu onwe ya; “okwu rụrụ arụ” bụ ntụgharị eke na nke ndị mmadụ na-aghọta.
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: n’ọnụ unu
  rationale: Nke a na-agbaso ihe oyiyi nke isi mmalite ma na-ada nke ọma n’Igbo.
theological_decisions:
- issue: Ma βλασφημία ọ̀ bụ naanị nkwulu megide Chineke ka ọ bụ okwu mkparị n’ozuzu
  choice: nkwulu
  alternative: okwu mkparị
  rationale: Isi okwu Grik nwere ike ibu ihe abụọ ahụ. “Nkwulu” na Standard Igbo nwekwara ike ịpụta ikwu okwu na-eweda onye ọzọ ala, ya mere ọ naghị ekpebi na ọ bụ naanị megide Chineke.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debeghị akara ntụaka ụkwụ n’ihi na ọ dịghị ntụaka ụkwụ dị mkpa n’amaokwu a.
