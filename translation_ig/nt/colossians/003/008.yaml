review_pass:
  verdict: revise
  source_fidelity: The vice list is accurately represented, including the distinction between ὀργή (iwe) and θυμός (ọnụma). However, ἀπόθεσθε is an aorist imperative, so the future-like ga-ewepụkwa weakens the direct apostolic command. καὶ ὑμεῖς means “you also,” not specifically “you yourselves.”
  naturalness: The wording is otherwise clear and natural Standard Igbo. Using the direct plural imperative tufụnụ gives the sentence a more idiomatic and appropriately exhortative form.
  terminology: iwe, ọnụma, obi ọjọọ, nkwulu, and okwu rụrụ arụ are suitable renderings in this context. “Nkwulu” retains the broad defamatory/abusive sense of βλασφημία without restricting it to speech against God.
  issues:
  - severity: medium
    issue: The verb ga-ewepụkwa is future/modal rather than a direct imperative.
    rationale: ἀπόθεσθε is a second-person plural aorist imperative (“put away/lay aside”), requiring an imperative in Igbo for source-faithful force.
  - severity: low
    issue: unu onwe unu overstates the Greek pronoun.
    rationale: καὶ ὑμεῖς emphasizes inclusion (“you also”); it does not use a reflexive expression equivalent to “you yourselves.”
  revised_text: 'Ma ugbu a, unu kwa, tufụnụ ihe ndị a niile: iwe, ọnụma, obi ọjọọ, nkwulu, na okwu rụrụ arụ n’ọnụ unu.'
