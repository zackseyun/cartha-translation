  text: καὶ ἐνδυσάμενοι τὸν νέον τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατ’ εἰκόνα τοῦ κτίσαντος αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/010.yaml
  text: and have put on the new self[a], which is being renewed in knowledge according to the image of the one who created it[b],
translation:
  language: ig
  text: ma unu yikwasịla mmadụ ọhụrụ ahụ[b], onye a na-eme ka ọ dị ọhụrụ n'ọmụma[a], dị ka oyiyi onye kere ya si dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ọmụma zuru ezu.” Okwu Grik a pụrụ igosi ọmụma miri emi ma ọ bụ nke zuru ezu karị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye ọhụrụ ahụ.” Okwu Grik ahụ na-emegide “mmadụ ochie” dị n'akụkụ amaokwu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: unu eyikwasịla onwe unu
  rationale: Nke a na-echekwa ihe atụ nke iyi uwe, ma na-egosikwa omume e merela dịka aorist participle si dị. E tinyere “onwe unu” iji mee ka okwu ahụ bụrụ Igbo doro anya ma kwekọọ n’isiokwu ọtụtụ mmadụ.
- source_word: τὸν νέον
  choice: onye ọhụrụ ahụ
  rationale: Adjective a na-arụ ọrụ dịka aha mmadụ. “Onye ọhụrụ” bụ Igbo eke nke na-egosipụta njirimara mmadụ ọhụrụ, na-enweghị ime ka okwu ahụ bụrụ naanị maka nwoke.
- source_word: ἀνακαινούμενον
  choice: onye a na-eme ka ọ dị ọhụrụ
  rationale: Okwu a na-echekwa passive voice na omume na-aga n’ihu nke present participle ahụ.
- source_word: εἰς ἐπίγνωσιν
  choice: ruo n'ọmụma
  rationale: “Ruo” na-egosipụta mmegharị ma ọ bụ ebumnuche dị na εἰς. “Ọmụma” anaghị amanye echiche “ọmụma zuru ezu,” nke okwu Grik ahụ nwere ike ịgụnye mana ọ bụghị iwu ka e kwuo ya n’ahịrị isi.
- source_word: κατ’ εἰκόνα
  choice: dị ka oyiyi ... si dị
  rationale: Nke a na-egosipụta ịdị ka ụkpụrụ ma na-echekwa aha “oyiyi,” nke nwere ike ịkpọghachi asụsụ Jenesis.
- source_word: τοῦ κτίσαντος αὐτόν
  choice: Onye kere ya
  rationale: Nke a na-edebe Onye Okike dịka onye, ma “ya” na-alaghachi n’ebe “onye ọhụrụ ahụ” nọ n’ụzọ Igbo doro anya.
theological_decisions:
- issue: Ụzọ e si sụgharị τὸν νέον n'okwu gbasara mmadụ
  choice: onye ọhụrụ ahụ
  alternative: mmadụ ọhụrụ ahụ
  rationale: “Onye ọhụrụ” na-echekwa ọdịiche ya na onye ochie n’akụkụ amaokwu a, ma ọ naghị eme ka okwu ahụ bụrụ naanị maka nwoke. “Mmadụ ọhụrụ” ga-ekwe omume, ma ọ na-ada ntakịrị ka nkọwa karịa njirimara onye.
- issue: Ike echiche dị na ἐπίγνωσις
  choice: ọmụma
  alternative: ọmụma zuru ezu
  rationale: Okwu Grik ahụ nwere ike ịpụta ọmụma miri emi ma ọ bụ zuru ezu, ma itinye “zuru ezu” n’ahịrị isi nwere ike ịkọwa karịa ihe ederede kwuru kpọmkwem. A na-edebe nhọrọ ahụ n’okpuru amaokwu.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ iyi uwe na asụsụ “oyiyi” iji chekwaa njikọ ederede na gburugburu amaokwu ahụ na Jenesis. E debere akara nkọwa [a] n’akụkụ “ọmụma” na [b] n’akụkụ “onye ọhụrụ” ka ihe nkọwa nke ọ bụla doo anya.
