id: COL.3.5
reference: Colossians 3:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: ig
  text: 'Ya mere, meenụ ka akụkụ ahụ ndị dị n’ụwa nwụọ[a]: omume rụrụ arụ nke mmekọahụ, adịghị ọcha, agụụ, ọchịchọ ọjọọ, na anyaukwu[b], nke bụ ife arụsị.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ọ bụla dị n’ime unu nke bụ nke ụwa.” N’asụsụ Grik, okwu ya kpọmkwem karị bụ “akụkụ ahụ ndị dị n’ụwa.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọchịchọ inweta ihe mmadụ ọzọ nwere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Νεκρώσατε
  choice: meenụ ka ... nwụọ
  rationale: Nke a na-egosipụta iwu siri ike ka e mee ihe ndị ahụ ka ha nwụọ. Ọ bụ Igbo doro anya ma na-edobe ihe atụ nke igbu ma ọ bụ ime ka ihe nwụọ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu amaokwu a.
- source_word: μέλη
  choice: akụkụ ahụ
  rationale: Ọ na-edobe ihe atụ nke akụkụ anụ ahụ nke okwu Grik ahụ na-eji, kama ịgbanwe ya ozugbo ka ọ bụrụ ‘agwa ụwa.’
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: ndị dị n’ụwa
  rationale: Nsụgharị a na-edobe ihe atụ gbasara ọnọdụ n’ụwa ma ghara ịkọwa ya karịa ihe ederede kwuru.
- source_word: πορνείαν
  choice: omume rụrụ arụ nke mmekọahụ
  rationale: Nke a bụ okwu Igbo sara mbara nke na-ekpuchi omume mmekọahụ niile na-adịghị mma; ọ sara mbara karịa naanị ịkwa iko.
- source_word: ἀκαθαρσίαν
  choice: adịghị ọcha
  rationale: Ọ na-anọchi anya adịghị ọcha n’omume ma na-adabara usoro okwu ọjọọ ndị a.
- source_word: πάθος
  choice: agụụ mmekọahụ
  rationale: N’usoro okwu a, ọ na-ezo aka n’agụụ siri ike a na-achịkwaghị achịkwa, karịsịa n’ihe gbasara mmekọahụ.
- source_word: ἐπιθυμίαν κακήν
  choice: ọchịchọ ọjọọ
  rationale: Ọ na-edobe ma echiche nke ọchịchọ ma nkọwa doro anya na ọchịchọ ahụ dị njọ.
- source_word: πλεονεξίαν
  choice: anyaukwu
  rationale: Anyaukwu bụ okwu Igbo nkịtị maka ọchịchọ ijide ma ọ bụ inwetakwu ihe mgbe niile.
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: nke bụ ife arụsị
  rationale: Ọ na-edobe nkwupụta Pọl siri ike ma na-ahapụ nkebi ahịrịokwu ahụ ka ọ na-ezo n’ụzọ kacha pụta ìhè n’anyaukwu.
theological_decisions:
- issue: Ihe ‘nke bụ ife arụsị’ na-ezo aka na ya
  choice: E mere ka nkebi ahịrịokwu ahụ zoo kpọmkwem n’anyaukwu.
  alternative: Ọ pụrụ ịbụ nchịkọta nke omume ọjọọ niile e depụtara.
  rationale: Nnochiaha Grik ἥτις bụ otu mkpụrụ okwu nke ụdị nwanyị, kwekọrọ nke ọma na πλεονεξίαν, bụ́ okwu kacha nso ya nke pụtakwara otu mkpụrụ okwu nke ụdị nwanyị.
- issue: Nkọwa nke ‘akụkụ ahụ ndị dị n’ụwa’
  choice: E debere ihe atụ nke akụkụ anụ ahụ n’ahịrị bụ isi.
  alternative: Ihe ọ bụla dị n’ime unu nke bụ nke ụwa; ma ọ bụ agwa ụwa unu.
  rationale: Ederede Grik kwuru ‘akụkụ ahụ,’ ebe ndepụta na-esote na-akọwapụta ihe a ga-eme ka ọ nwụọ. Idebe ihe atụ ahụ na-ezere itinye nkọwa na-anọghị kpọmkwem n’ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. A hapụrụ ihe atụ ‘akụkụ ahụ ndị dị n’ụwa’ n’ahịrị bụ isi, ebe e tinyere nkọwa ọzọ n’okpuru ala. A họọrọ ‘omume rụrụ arụ nke mmekọahụ’ iji zere ime ka πορνεία dị warara karịa ka ọ dị n’asụsụ Grik.
