revisions:
- from: 'Ya mere, meenụ ka akụkụ ahụ ndị dị n’ụwa nwụọ[a]: omume rụrụ arụ nke mmekọahụ, adịghị ọcha, agụụ mmekọahụ, ọchịchọ ọjọọ, na anyaukwu[b], nke bụ ife arụsị.'
  to: 'Ya mere, meenụ ka akụkụ ahụ ndị dị n’ụwa nwụọ[a]: omume rụrụ arụ nke mmekọahụ, adịghị ọcha, agụụ, ọchịchọ ọjọọ, na anyaukwu[b], nke bụ ife arụsị.'
  rationale: Only the rendering of πάθος is revised, from the narrower 'agụụ mmekọahụ' to 'agụụ,' so that the Igbo preserves the source term's broader sense without supplying an unstated qualification. The remaining text and both footnotes are retained.
  reviewer_model: gpt-5.6-terra
