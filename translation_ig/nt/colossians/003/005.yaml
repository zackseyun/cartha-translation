review_pass:
  verdict: revise
  source_fidelity: The rendering accurately preserves the imperative force, the inferential οὖν, the 'members ... on the earth' metaphor, the vice list, and the singular reference of 'which is idolatry' to greed. However, πάθος is rendered as 'agụụ mmekọahụ' ('sexual passion'), which narrows the Greek term. Although the context includes sexual wrongdoing, πάθος itself is broader 'passion' and should not be specified as sexual in the main text.
  naturalness: The wording is clear, modern Standard Igbo and appropriately dignified. 'Meenụ ka ... nwụọ' is a natural way to express the figurative imperative without making the bodily-member metaphor sound like a literal command to mutilate oneself.
  terminology: '''Omume rụrụ arụ nke mmekọahụ,'' ''adịghị ọcha,'' ''ọchịchọ ọjọọ,'' ''anyaukwu,'' and ''ife arụsị'' are suitable. Revising ''agụụ mmekọahụ'' to ''agụụ'' retains the breadth of πάθος; the surrounding context sufficiently signals the moral sense.'
  issues:
  - severity: medium
    issue: πάθος has been restricted to sexual passion.
    rationale: The Greek πάθος denotes passion or an overpowering impulse and is not lexically limited to sexual desire. Rendering it 'agụụ mmekọahụ' adds a sexual qualification absent from the source and overlaps too closely with πορνεία.
  revised_text: 'Ya mere, meenụ ka akụkụ ahụ ndị dị n’ụwa nwụọ[a]: omume rụrụ arụ nke mmekọahụ, adịghị ọcha, agụụ, ọchịchọ ọjọọ, na anyaukwu[b], nke bụ ife arụsị.'
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ọ bụla dị n’ime unu nke bụ nke ụwa.” N’asụsụ Grik, okwu ya kpọmkwem karị bụ “akụkụ ahụ ndị dị n’ụwa.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọchịchọ inweta ihe mmadụ ọzọ nwere.”
    reason: lexical_alternative
  revision_rationale: Only the rendering of πάθος is revised, from the narrower 'agụụ mmekọahụ' to 'agụụ,' so that the Igbo preserves the source term's broader sense without supplying an unstated qualification. The remaining text and both footnotes are retained.
