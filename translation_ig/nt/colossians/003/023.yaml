  to: Ihe ọ bụla unu na-eme, jirinụ mkpụrụ obi unu dum rụọ ya, dị ka unu na-arụrụ Onyenweanyị[a] ọrụ, ọ bụghị ụmụ mmadụ[b].
  rationale: The revision changes only the final generic noun from singular to plural and supplies ‘ọrụ’ after ‘na-arụrụ’ for a fully natural and explicit Igbo construction. It preserves the source’s exhortation, its wholehearted sense, and its contrast between service to the Lord and service to human beings.
