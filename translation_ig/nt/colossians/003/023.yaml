  yaml_path: translation/nt/colossians/003/023.yaml
  text: Whatever you do[a], work from the soul, as for the Lord and not for men[c][b],
translation:
  language: ig
  text: Ihe ọ bụla unu na-eme, jirinụ mkpụrụ obi unu dum rụọ ya, dị ka unu na-arụrụ Onyenweanyị[a] ọrụ, ọ bụghị ụmụ mmadụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta “Onyenweanyị” n’ebe a dịka “Nna ukwu,” n’ihi ọnọdụ okwu a gbasara ndị ohu na ndị nwe ha.
    reason: alternative_reading
  - marker: b
    text: Grik pụtara “ụmụ mmadụ”; okwu ahụ na-ezo aka ná mmadụ niile, ọ bụghị naanị ụmụ nwoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: Ihe ọ bụla unu na-eme
  rationale: Nkebiokwu a na-egosi ihe ọ bụla, n’enweghị ịkpa ókè; Igbo a bụ ụzọ ebumpụta ụwa isi kwuo ya.
- source_word: ἐκ ψυχῆς
  choice: jirinụ mkpụrụ obi unu dum
  rationale: Nke a na-edobe onyinyo ψυχή (‘mkpụrụ obi’) ma na-eji ‘dum’ gosi ezi obi na itinye onwe mmadụ niile n’ọrụ ahụ.
- source_word: ἐργάζεσθε
  choice: rụọ ya
  rationale: Ọ bụ iwu na-aga n’ihu nke na-akpọ ha ka ha jiri mgbalị rụọ ihe ahụ; ‘rụọ ya’ dabara n’Igbo ma zere ikwughachi ‘ọrụ’ n’ụzọ siri ike.
- source_word: ὡς τῷ κυρίῳ
  choice: dị ka unu na-arụrụ Onyenweanyị
  rationale: ‘Dị ka ... na-arụrụ’ na-egosi echiche na ụzọ ha ga-esi rụọ ọrụ ahụ, ebe ‘Onyenweanyị’ na-echekwa κύριος dị ka aha nsọpụrụ.
- source_word: καὶ οὐκ ἀνθρώποις
  choice: ọ bụghị mmadụ
  rationale: ἀνθρώποις bụ mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke; ‘mmadụ’ na Igbo nwere ike ịpụta ụmụ mmadụ n’ozuzu ma na-eme ka ọdịiche dị n’etiti mmadụ na Onyenweanyị doo anya.
theological_decisions:
- issue: Ntụgharị κύριος n’ọnọdụ ntụziaka gbasara ndị ohu na ndị nwe ha
  choice: Onyenweanyị
  alternative: Nna ukwu
  rationale: N’agbanyeghị na gburugburu okwu a metụtara ndị nwe mmadụ, κύριος n’ebe a na-ezo aka n’Onyenweanyị ahụ e buliri elu. Agbanyeghị, ọnọdụ ezinụlọ na ọrụ ohu nwere ike ime ka ụda ‘Nna ukwu’ pụta ìhè; e debere nke ahụ n’okpuru nkọwa.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere onyinyo ‘mkpụrụ obi’ nke Grik, ma tinye ‘dum’ iji mee ka echiche nke ezi obi na itinye onwe niile doo anya.
