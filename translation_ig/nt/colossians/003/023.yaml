  source_fidelity: 'The draft correctly conveys the indefinite scope (''Ihe ọ bụla''), the imperative to perform it wholeheartedly, and the contrast between the Lord and human beings. However, the final noun is singular (''mmadụ'') while ἀνθρώποις is plural, and the wording can more clearly retain the shared ''for'' relation: for the Lord, not for human beings.'
