  text: For the wrongdoer will be repaid for what he has done wrong[b][a], and there is no partiality.
translation:
  language: ig
  text: N’ihi na onye na-eme ihe ọjọọ ga-anataghachi ihe ọjọọ o mere[a], ile mmadụ anya n’ihu adịghịkwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “onye na-eme ihe ọjọọ ga-enweta ihe o mejọrọ.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, a naghị emere onye amara pụrụ iche ma ọ bụ kpee ya ikpe dabere n’ọkwa ya ma ọ bụ n’ihe a na-ahụ n’elu. N’okwu Grik, n’ụzọ nkịtị, ọ pụtara “ịnabata ihu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: N’ihi na onye na-eme ihe ọjọọ
  rationale: Akụkụ okwu articular present participle a na-ezo aka n’ozuzu nye onye na-eme ihe na-ezighị ezi. “Onye na-eme ihe ọjọọ” bụ Igbo doro anya ma dịkwa eke; “N’ihi na” na-egosipụta ọrụ nkọwa nke γάρ.
- source_word: κομίσεται
  choice: ga-anata ụgwọ
  rationale: N’ebe a κομίσεται pụtara ịnata ihe kwesiri omume mmadụ dịka nkwụghachi. “Ga-anata ụgwọ” na-eme ka echiche nkwụghachi pụta ìhè n’enweghị ịkọwapụta onye ga-akwụ ya ma ọ bụ mgbe ọ ga-eme.
- source_word: ὃ ἠδίκησεν
  choice: ihe ọjọọ o mere
  rationale: Nkebi a na-ezo aka n’ihe na-ezighị ezi onye ahụ mere. Nhọrọ a na-ejikọ ya nke ọma na ἀδικῶν ma na-anọgide n’ụdị onye otu nke Grik.
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: ile mmadụ anya n’ihu adịghịkwa
  rationale: Akpaalaokwu Igbo a na-egosi mmadụ ime mmadụ amara pụrụ iche ma ọ bụ ikpe ya dabere n’ọkwa na ọdịdị elu. Ọ bụ asụsụ ndị mmadụ na-aghọta nke na-echekwa isi προσωπολημψία.
- source_word: implicit generic masculine in ὁ ... ἀδικῶν / ἠδίκησεν
  choice: onye ... o mere
  rationale: Igbo anaghị achọ nnọchiaha nwoke n’ebe a. “Onye” na “o” na-echekwa onye otu na nghọta izugbe nke Grik n’enweghị itinye nwoke ebe asụsụ Igbo na-adịghị amanye ya.
theological_decisions:
- issue: Ụdị nkwụghachi na ikpe na-adịghị ele mmadụ anya n’ihu
  choice: Amaokwu ahụ na-ekwu ụkpụrụ izugbe na onye mere ihe ọjọọ ga-anata ihe kwekọrọ n’omume ya, na enweghị ile mmadụ anya n’ihu.
  alternative: Ịkọwa ya naanị dịka ikpe ụbọchị ikpeazụ, ma ọ bụ naanị dịka okwu gbasara mmekọrịta ndị nwe na ndị ohu.
  rationale: Grik ekwughị kpọmkwem onye na-akwụghachi, oge nkwụghachi ahụ, ma ọ bụ usoro ya. Nsụgharị ahụ anaghị etinye nkọwa ndị ahụ, kama ọ na-echekwa ịdọ aka ná ntị sara mbara na esemokwu nkà mmụta okpukpe dị na ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ile mmadụ anya n’ihu” mee ka echiche ele mmadụ anya pụrụ iche pụta n’ụzọ sitere n’okwu Igbo; e zere asụsụ ụka ochie na nkọwa na-emechi nghọta amaokwu ahụ.
