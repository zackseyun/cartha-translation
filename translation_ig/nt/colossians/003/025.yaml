revisions:
- from: N’ihi na onye na-eme ihe ọjọọ ga-anata ụgwọ ihe ọjọọ o mere[a], ile mmadụ anya n’ihu adịghịkwa[b].
  to: N’ihi na onye na-eme ihe ọjọọ ga-anataghachi ihe ọjọọ o mere[a], ile mmadụ anya n’ihu adịghịkwa[b].
  rationale: The revision replaces the potentially commercial or reward-like “ga-anata ụgwọ” with “ga-anataghachi,” preserving the future reciprocal/retributive force of κομίσεται without specifying who repays the wrongdoer or when. It retains the established idiom for impartiality and corrects the footnote’s description of the Greek literal gloss.
