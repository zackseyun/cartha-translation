- from: Ọ bụ n’ihi ihe ndị a ka iwe Chineke ji na-abịakwasị ụmụ ndị nnupụisi[a].
  to: Ọ bụ n’ihi ihe ndị a ka iwe Chineke ji na-abịakwasị ụmụ nke nnupụisi[a][b].
  rationale: The revision corrects the Igbo possessive construction so that it retains the source idiom rather than implying that the referents are children of other rebellious people. The first note explains the idiom without flattening it in the main text. The second note records the manuscript uncertainty indicated by the bracketed SBLGNT text.
