review_pass:
  verdict: revise
  source_fidelity: The causal clause, present-tense coming of divine wrath, and its directional force are conveyed accurately. However, “ụmụ ndị nnupụisi” means “children of the rebellious people/rebels” in ordinary Igbo and introduces an extra referent not present in τοὺς υἱοὺς τῆς ἀπειθείας. “ụmụ nke nnupụisi” more closely preserves the Greek idiom. The bracketed SBLGNT phrase reflects a textual variant and should be noted.
  naturalness: “Ọ bụ n’ihi ihe ndị a ka iwe Chineke ji na-abịakwasị …” is natural, formal Standard Igbo. “ụmụ nke nnupụisi” is deliberately idiomatic/literary, but its meaning requires the supplied clarification.
  terminology: “iwe Chineke” suitably renders ἡ ὀργὴ τοῦ θεοῦ, and “na-abịakwasị” naturally carries ἔρχεται ἐπί in this judgment context. “nnupụisi” is an appropriate rendering of ἀπειθεία here.
  issues:
  - severity: high
    issue: The phrase “ụmụ ndị nnupụisi” changes the genitive relationship.
    rationale: It naturally denotes children belonging to rebellious persons, whereas the Greek idiom denotes persons characterized by disobedience. Replace it with “ụmụ nke nnupụisi” and clarify the idiom in a footnote.
  - severity: medium
    issue: The textual uncertainty signaled by the SBLGNT brackets is not represented.
    rationale: The words ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας have significant manuscript variation. A textual footnote preserves this uncertainty without deciding the reading in translation.
  revised_text: Ọ bụ n’ihi ihe ndị a ka iwe Chineke ji na-abịakwasị ụmụ nke nnupụisi[a][b].
  revised_footnotes:
  - marker: a
    text: Ya bụ, ndị nnupụisi ji mara.
    reason: idiom_clarification
  - marker: b
    text: 'Ụfọdụ ihe odide ochie anaghị enwe okwu ndị a: “n’ahụ ụmụ nke nnupụisi.”'
    reason: textual_variant
  revision_rationale: The revision corrects the Igbo possessive construction so that it retains the source idiom rather than implying that the referents are children of other rebellious people. The first note explains the idiom without flattening it in the main text. The second note records the manuscript uncertainty indicated by the bracketed SBLGNT text.
