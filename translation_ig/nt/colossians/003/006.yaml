  yaml_path: translation/nt/colossians/003/006.yaml
  text: Because of these things the wrath of God is coming upon the sons of disobedience[a].
translation:
  language: ig
  text: Ọ bụ n’ihi ihe ndị a ka iwe Chineke ji na-abịakwasị ụmụ nke nnupụisi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ndị nnupụisi ji mara.
    reason: idiom_clarification
  - marker: b
    text: 'Ụfọdụ ihe odide ochie anaghị enwe okwu ndị a: “n’ahụ ụmụ nke nnupụisi.”'
    reason: textual_variant
lexical_decisions:
- source_word: δι’ ἃ
  choice: n’ihi ihe ndị a
  rationale: διά tinyere nnọchiaha ἃ na-egosi ihe kpatara ya; okwu a na-ezo aka n’ihe ọjọọ ndị a kpọrọ aha n’amaokwu gara aga.
- source_word: ἔρχεται
  choice: na-abịakwasị
  rationale: Ụdị ugbu a nke ἔρχομαι na-egosi na iwe ahụ na-abịa, ma nwee echiche nke ikpe na-abịanụ; njikọ ya na ἐπί mere ka ‘na-abịakwasị’ bụrụ okwu Igbo doro anya.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: iwe Chineke
  rationale: ‘Iwe’ na-eburu echiche ὀργή nke iwe Chineke metụtara ikpe, na-enweghị ịgbakwunye nkọwa na-adịghị n’ederede.
- source_word: ἐπὶ
  choice: -bịakwasị
  rationale: N’ebe a ἐπί na-egosi ndị iwe ahụ na-eche ihu; e tinyere echiche ya n’okwu ngwaa ‘na-abịakwasị’ ka Igbo wee daa nke ọma.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: ụmụ ndị nnupụisi
  rationale: Nkebiokwu Grik a bụ akpaalaokwu ndị Semitic maka ndị e ji nnupụisi mara. ‘Ụmụ ndị nnupụisi’ na-echekwa ọdịdị akpaalaokwu ahụ, ebe nkọwa ala peeji na-eme ka ihe ọ pụtara doo anya.
theological_decisions:
- issue: Ma a ga-echekwa akpaalaokwu ‘ụmụ ndị nnupụisi’ ka a ga-asụgharị ya ozugbo dịka ndị na-enupụrụ Chineke isi
  choice: E chekwara ‘ụmụ ndị nnupụisi’ n’ahịrị isi.
  alternative: ndị na-enupụrụ Chineke isi
  rationale: Nke a na-echekwa ọdịdị na esemokwu asụsụ nke τοὺς υἱοὺς τῆς ἀπειθείας, ma nkọwa ala peeji na-akọwa na ọ bụ ndị nnupụisi ji mara.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘Ọ bụ n’ihi... ka... ji...’ iji gosipụta ihe kpatara ya n’ụzọ Igbo ebumpụta ụwa, ma chekwaa ‘ụmụ’ iji nọgide n’akpaalaokwu nke isi mmalite.
