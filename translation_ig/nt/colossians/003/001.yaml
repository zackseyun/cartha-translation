revisions:
- from: Ya mere, ọ bụrụ[a] na e mere ka unu na Mezaịa[b] bilie, na-achọnụ ihe ndị dị n’elu, ebe Mezaịa nọ ọdụ n’aka nri Chineke.
  to: Ya mere, ọ bụrụ[a] na e mere ka unu soro Mezaịa[b] bilie, na-achọnụ ihe ndị dị n’elu, ebe Mezaịa nọ ọdụ n’aka nri Chineke.
  rationale: The sole textual revision supplies “soro” to make explicit that the readers, not the Messiah alongside them as a coordinate subject, are those raised in union with the Messiah. The conditional form, plural “things above,” ongoing imperative, locative clause, and seated-at-God’s-right-hand imagery are otherwise retained.
