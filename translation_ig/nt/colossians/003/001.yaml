id: COL.3.1
reference: Colossians 3:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: ig
  text: Ya mere, ọ bụrụ[a] na e mere ka unu soro Mezaịa[b] bilie, na-achọnụ ihe ndị dị n’elu, ebe Mezaịa nọ ọdụ n’aka nri Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘Ebe ọ bụ na e mere ka unu soro Mezaịa bilie.’ Grik ji ụdị ọnọdụ, ‘ọ bụrụ,’ mee ihe, ma o yikarịrị ka n’ebe a a na-ewere ọnọdụ ahụ dị ka eziokwu.
    reason: alternative_reading
  - marker: b
    text: Grik bụ Χριστός, nke pụtara ‘onye e tere mmanụ’; a sụgharịrị ya ‘Mezaịa’ ebe a n’ihi na ọ na-arụ ọrụ dịka aha ọkwa. A pụkwara ịsụgharị ya ‘Kraịst.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Ya mere, ọ bụrụ
  rationale: Nke a na-edobe ma njikọ nkwubi okwu οὖν (‘ya mere’) ma ụdị ọnọdụ εἰ (‘ọ bụrụ’), n’agbanyeghị na okwu ndị gbara ya gburugburu na-egosi na Pọl na-ewere ọnọdụ ahụ dị ka eziokwu.
- source_word: συνηγέρθητε τῷ Χριστῷ
  choice: e mere ka unu na Mezaịa bilie
  rationale: Ụdị a na-egosi olu nnara nke aorist ma na-echekwa echiche nke iso Mezaịa bilie; ‘unu’ na-egosikwa na okwu ahụ bụ maka ọtụtụ mmadụ.
- source_word: τὰ ἄνω
  choice: ihe ndị dị n’elu
  rationale: Ọ na-echekwa ụdị ọtụtụ nke okwu Grik ahụ ma ghara ịkọwa ‘n’elu’ ozugbo dịka ‘ihe eluigwe,’ nke ga-agbasa nkọwa karịa ihe e dere.
- source_word: ζητεῖτε
  choice: na-achọnụ
  rationale: Iwu dị n’ụdị ugbu a na-egosi omume na-aga n’ihu; ‘na-achọnụ’ bụ Igbo doro anya ma dị ndụ maka ntụziaka a.
- source_word: οὗ ὁ Χριστός ἐστιν
  choice: ebe Mezaịa nọ
  rationale: ‘Ebe’ na-echekwa ọrụ locative nke οὗ ma jikọta ya n'ụzọ nkịtị na ihe ndị dị n’elu.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ καθήμενος
  choice: nọdụ n’aka nri Chineke
  rationale: Nke a na-echekwa ihe oyiyi eze na nsọpụrụ dị n’okwu banyere ịnọ n’aka nri Chineke, na-enweghị ịgbakwunye ‘n’ocheeze,’ nke na-adịghị kpọmkwem n’amaokwu ahụ.
theological_decisions:
- issue: Otu e si sụgharị Χριστός
  choice: Mezaịa
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dịka aha ọkwa nke Onye E Tere Mmanụ; ‘Mezaịa’ na-eme ka ihe aha ọkwa ahụ pụtara pụta ìhè kama ime ya naanị aha mmadụ.
- issue: Ike okwu ọnọdụ Εἰ
  choice: ọ bụrụ
  alternative: ebe ọ bụ na
  rationale: ‘Ọ bụrụ’ na-echekwa ụdị ọnọdụ nke Grik. Ọ bụ ezie na o yikarịrị ka Pọl na-ewere na e mere ka ndị na-agụ ya na Mezaịa bilie, nsụgharị ahụ ekwesịghị ihichapụ ọnọdụ okwu ahụ n’onwe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, mee ihe. ‘Na-achọnụ’ na-enye iwu na-aga n’ihu; e zere okwu ụka pụrụ iche na nkọwa ndị na-agafe ihe Grik kwuru.
