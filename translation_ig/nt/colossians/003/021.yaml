  text: οἱ πατέρες, μὴ ἐρεθίζετε τὰ τέκνα ὑμῶν, ἵνα μὴ ἀθυμῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/021.yaml
  text: Fathers[a], do not provoke your children, so that they may not become discouraged.
translation:
  language: ig
  text: Ndị nna, unu akpasịla ụmụ unu iwe, ka ha ghara ịda mbà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ha ghara ịkwụsị inwe obi ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες
  choice: Ndị nna
  rationale: Okwu Grik a pụtara kpọmkwem ‘ndị nna’; ọ naghị agbanwe ya ka ọ bụrụ okwu gbasara nne na nna niile, ya mere ọ na-echekwa onye a na-agwa n’usoro ndụ ezinụlọ a.
- source_word: μὴ ἐρεθίζετε
  choice: unu akpasula ... iwe
  rationale: Nkebiokwu Igbo a bụ ụzọ doro anya ma kwekọọ n’asụsụ ndị mmadụ si ekwu banyere omume na-akpalite iwe ma ọ bụ mmeghachi omume na-adịghị mma n’ime ụmụaka.
- source_word: τὰ τέκνα ὑμῶν
  choice: ụmụ unu
  rationale: ‘Ụmụ unu’ bụ okwu Igbo dị mfe ma gụnye ma ụmụ nwoke ma ụmụ nwanyị, dịka τέκνα si eme.
- source_word: ἵνα μὴ
  choice: ka ... ghara
  rationale: Usoro a na-egosi ebumnuche ma ọ bụ ihe omume ahụ nwere ike ịkpata, n’enweghị ịkpebi otu n’ime ha karịa ka Grik mere.
- source_word: ἀθυμῶσιν
  choice: obi ghara ịda ha mbà
  rationale: Akpaalaokwu a na-egosi ịda mba na ịkwụsị inwe obi ike, nke bụ isi echiche ἀθυμέω, ma bụrụkwa Igbo dị ugbu a ma doo anya.
theological_decisions:
- issue: Ndị okwu πατέρες na-agwa n’usoro ndụ ezinụlọ
  choice: A gwara ndị nna kpọmkwem
  alternative: Ịsụgharị ya dịka ‘ndị nne na nna’
  rationale: Aha Grik ahụ bụ ‘ndị nna.’ Ọ bụ ezie na ụkpụrụ ndụ dị n’amaokwu ahụ nwere ike ịbara nne na nna niile uru, nsụgharị ahụ kwesịrị ichekwa onye ederede kpọrọ aha kpọmkwem.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. ‘Unu akpasula ụmụ unu iwe’ na-enye iwu ahụ n’ụzọ eke, ebe ‘obi ghara ịda ha mbà’ na-echekwa mmetụta ime mmụọ na nke obi dị na ngwaa Grik.
