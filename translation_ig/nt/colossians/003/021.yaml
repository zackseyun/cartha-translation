revisions:
- from: Ndị nna, unu akpasula ụmụ unu iwe, ka obi ghara ịda ha mbà.[a]
  to: Ndị nna, unu akpasịla ụmụ unu iwe, ka ha ghara ịda mbà.[a]
  rationale: The revision retains the source’s direct address to fathers, its prohibition, and its purpose clause, while using idiomatic Standard Igbo for the children’s discouragement. The footnote now offers a close alternative that reflects “lose heart” without introducing the distinct idea of being worn out.
  reviewer_model: gpt-5.6-terra
