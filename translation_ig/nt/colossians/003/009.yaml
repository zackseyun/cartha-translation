id: COL.3.9
reference: Colossians 3:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ ψεύδεσθε εἰς ἀλλήλους· ἀπεκδυσάμενοι τὸν παλαιὸν ἄνθρωπον σὺν ταῖς πράξεσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/009.yaml
  text: Do not lie to one another[a], since you have stripped off the old man with his practices[b],
translation:
  language: ig
  text: Unu aghala ịgha ụgha nye ibe unu, ebe ọ bụ na unu eyipụwo[a] mmadụ ochie ahụ[b], ya na omume ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe unu eyipụrụ” ma ọ bụ “n’ihi na unu eyipụwo.” Usoro okwu Grik ahụ nwekwara ike ịhapụ mmekọrịta ya na iwu ahụ n’ụzọ na-akọwaghị kpọmkwem; n’ebe a, o yikarịrị ka ọ na-enye ihe mere e ji nye iwu ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onwe ochie ahụ.” Okwu Grik bụ “mmadụ ochie ahụ,” nke na-echekwa ntụnyere Pọl mere na “mmadụ ọhụrụ ahụ” n’amaokwu na-esote.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: Unu aghara ịgha ụgha
  rationale: Nke a bụ iwu na-asị ka a ghara ime ihe. “Ịgha ụgha” bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ψεύδομαι; ihe gbara ya gburugburu adịghị amanye ka a sụgharịa ya dị ka “kwụsịnụ ịgha ụgha.”
- source_word: εἰς ἀλλήλους
  choice: nye ibe unu
  rationale: “Ibe unu” na-echekwa echiche nke ime ihe n’etiti ndị kwere ekwe ibe ha, ebe “nye” na-eme ka okwu ahụ bụrụ Igbo eke.
- source_word: ἀπεκδυσάμενοι
  choice: ebe ọ bụ na unu eyipụwo
  rationale: Aorist middle participle a na-ezo aka n’ihe e mechaala, ọ yikwara ka ọ na-enye ihe mere e ji nye iwu ahụ. “Eyipụwo” na-echekwa ihe atụ nke iyipụ uwe.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: mmadụ ochie ahụ
  rationale: Nke a na-agbasochi ἄνθρωπος anya ma na-echekwa njikọ ya na “mmadụ ọhụrụ” nke amaokwu na-esote, kama ime ka ọ bụrụ naanị àgwà ochie.
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: ya na omume ya
  rationale: “Ya na” na-egosipụta njikọ σὺν, ebe “omume” na-anabata ma ihe mmadụ na-eme ma ụzọ ndụ a na-eme ugboro ugboro.
theological_decisions:
- issue: Otu e si sụgharịa τὸν παλαιὸν ἄνθρωπον
  choice: mmadụ ochie ahụ
  alternative: onwe ochie ahụ
  rationale: “Mmadụ ochie” na-echekwa ihe atụ Pọl ji atụnyere mmadụ ochie na mmadụ ọhụrụ, ma ihe ọzọ a pụrụ ịsụgharị ya bụ “onwe ochie” ma ọ bụrụ na e mesie ọnọdụ onye ahụ ike.
- issue: Mmekọrịta ἀπεκδυσάμενοι na iwu ahụ
  choice: 'A kọwara ya dị ka ihe kpatara iwu ahụ: “ebe ọ bụ na”'
  alternative: 'A pụrụ ịhapụ ya dị ka participle na-esochi iwu ahụ: “unu eyipụwokwa”'
  rationale: N’ebe a participle ahụ yikarịrị ka ọ na-akwado iwu ahụ site n’ọnọdụ ọhụrụ nke ndị a na-agwa okwu, ma usoro Grik ahụ nwekwara ike ịhapụ mmekọrịta ahụ n’ụzọ na-akọwaghị ya nke ukwuu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Eyipụwo” na-echekwa ihe atụ uwe dị n’asụsụ Grik; “mmadụ ochie” na-echekwa ntụnyere mmadụ ochie na mmadụ ọhụrụ n’agbanyeghị na “onwe ochie” nwere ike ịdị mfe nghọta nye ụfọdụ ndị.
