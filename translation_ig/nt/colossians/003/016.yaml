id: COL.3.16
reference: Colossians 3:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: ig
  text: Ka okwu Mesaịa biri n’ime unu[a] n’ụba, n’amamihe niile; ka unu jiri abụ ọma, ukwe otuto, na abụ ime mmụọ na-akụziri ma na-adọ ibe unu aka ná ntị, na-abụ abụ nye Chineke n’obi unu n’amara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’etiti unu.” Nnọchiaha Grik a dị n’ụbara, ya mere ọ pụrụ izo aka ka okwu ahụ biri n’ime onye kwere ekwe ọ bụla, ma ọ bụ n’etiti ọgbakọ ahụ dum.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “n’ekele.” Okwu Grik ahụ pụrụ ịpụta amara, obiọma, ma ọ bụ ekele n’ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος
  choice: okwu
  rationale: '“Okwu” na-echekwa obosara echiche nke λόγος: okwu ma ọ bụ ozi metụtara Mesaịa, n''agbanyeghị na ọ naghị eme ka ọ bụrụ naanị nkwusa.'
- source_word: τοῦ Χριστοῦ
  choice: Mesaịa
  rationale: Χριστός na-arụ ọrụ dị ka utu aha n'ebe a; “Mesaịa” na-egosipụta ihe utu aha ahụ pụtara kama ime ya naanị aha mmadụ.
- source_word: ἐνοικείτω
  choice: ka ... biri
  rationale: Nke a na-echekwa ihe atụ nke okwu ahụ ibi n'ime mmadụ ma ọ bụ ọgbakọ, tinyere iwu ka ọnọdụ ahụ na-aga n'ihu.
- source_word: ἐν ὑμῖν
  choice: n'ime unu
  rationale: Ntụgharị a na-agbasochi okwu Grik anya, ebe “unu” n'ụbara ka na-enye ohere nghọta gbasara ndị n'otu n'otu na ọgbakọ dum; e debere “n’etiti unu” n'ala peeji.
- source_word: πλουσίως
  choice: n'ụba
  rationale: “N'ụba” na-egosi izu oke na ịba ụba nke adverb Grik ahụ n'Igbo nkịtị.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: n'amamihe niile
  rationale: Nke a na-echekwa usoro okwu Grik na ohere ka nkebiokwu ahụ metụta ibi nke okwu ahụ ma ọ bụ ọrụ ịkụzi na ịdọ aka ná ntị.
- source_word: διδάσκοντες καὶ νουθετοῦντες ἑαυτούς
  choice: ka unu na-akụziri ma na-adọrịta ibe unu aka ná ntị
  rationale: “Na-akụziri” na-egosi διδάσκοντες; “na-adọrịta ... aka ná ntị” na-echekwa akụkụ mmezi nke νουθετοῦντες; “ibe unu” bụ ụzọ Igbo si egosi omume ha na-emere onwe ha n'otu.
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: site n'abụ ọma, ukwe otuto, na abụ ime mmụọ
  rationale: E kewapụrụ ụdị abụ atọ ahụ dịka Grik siri mee; “site na” na-egosi ọrụ dative ahụ dị ka ụzọ ha si akụzi ma na-adọ aka ná ntị.
- source_word: ἐν χάριτι
  choice: na-eji amara
  rationale: “Amara” na-echekwa ụdị na obosara χάρις; n'ihi na “ekele” dịkwa ike n'ọnọdụ a, e tinyere ya n'ala peeji.
- source_word: ᾄδοντες ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ
  choice: na-abụku Chineke abụ n'obi unu
  rationale: 'Nke a na-egosipụta ịbụ abụ a na-eche Chineke ihu, nakwa ebe Grik kwuru na ọ dị: n''obi ha.'
theological_decisions:
- issue: Utu aha Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: A họọrọ ihe utu aha ahụ pụtara iji chekwaa njikọ ya na olileanya banyere Onye E Tere Mmanụ, kama ịme Χριστός ka ọ bụrụ naanị aha.
- issue: Ma ἐν ὑμῖν ọ bụ nke onye ọ bụla ma ọ bụ nke ọgbakọ
  choice: n'ime unu
  alternative: n’etiti unu
  rationale: “N'ime unu” na-agbasochi preposition ahụ anya, ma nnọchiaha n'ụbara na omume ha na-emere ibe ha na-eme ka nghọta ọgbakọ kwe omume; ala peeji na-echekwa ya n'enweghị idozi esemokwu ahụ kpamkpam.
- issue: Ihe ἐν χάριτι pụtara
  choice: na-eji amara
  alternative: na-eji ekele
  rationale: χάρις nwere ike igosi amara, ịdị mma, ma ọ bụ obi ekele. Isiokwu ahụ na-eji “amara” nke na-anọgide nso n'okwu Grik, ebe ala peeji na-echekwa nghọta “ekele.”
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “Mesaịa” dịka utu aha; “abụ ọma,” “ukwe otuto,” na “abụ ime mmụọ” na-edobe ụdị abụ atọ dị na Grik. Ahịrịokwu ahụ na-edobe njikọ dị n'etiti iwu bụ isi na ọrụ ịkụzi, ịdọ aka ná ntị, na ịbụ abụ, ma ọ naghị emechi mgbagwoju anya nke “n'amamihe niile.”
