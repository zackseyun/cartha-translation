    rationale: Ngwaa Igbo a na-ejikarị bụ “ịdọ mmadụ aka ná ntị”; n’ọrụ mmekọrịta, “na-adọ ibe unu aka ná ntị” bụ usoro nkịtị ma na-egosi νουθετοῦντες ἑαυτούς n’enweghị mgbagwoju anya.
  - severity: low
    issue: “Na-abụku Chineke abụ” na “na-eji amara”
    rationale: Ha ghọtara ihe a chọrọ ikwu, mana “na-abụ abụ nye Chineke n’obi unu n’amara” dịkwuo eke na Standard Igbo ma na-edobe ᾄδοντες ... τῷ θεῷ na ἐν χάριτι.
  - severity: low
    issue: Nkọwa ala peeji b
