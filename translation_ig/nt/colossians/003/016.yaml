- from: 'Ka okwu Mesaịa biri n''ụba n''ime unu[a] n''amamihe niile; ka unu na-akụziri ma na-adọrịta ibe unu aka ná ntị site n''abụ ọma, ukwe otuto, na abụ ime mmụọ, na-eji amara[b] na-abụku Chineke abụ n''obi unu.


