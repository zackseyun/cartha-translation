  to: Ka okwu Mesaịa biri n’ime unu[a] n’ụba, n’amamihe niile; ka unu jiri abụ ọma, ukwe otuto, na abụ ime mmụọ na-akụziri ma na-adọ ibe unu aka ná ntị, na-abụ abụ nye Chineke n’obi unu n’amara[b].
  rationale: A gbanwere naanị okwu ndị na-adịghị ada nke ọma n’Igbo. A debere usoro na ọdịnaya Grik, tinyere mgbagwoju anya nke “n’amamihe niile,” ọdịiche dị n’etiti nghọta onye ọ bụla na nke ọgbakọ maka ἐν ὑμῖν, na ohere “amara” ma ọ bụ “ekele” maka ἐν χάριτι.
