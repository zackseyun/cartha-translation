revisions:
- from: N’ihi na unu nwụrụ, e zokwawokwa ndụ unu na Kraịst n’ime Chineke.[a]
  to: N’ihi na unu nwụrụ, e zoro ndụ unu na Mesaya n’ime Chineke.[a]
  rationale: The revision retains the source order and sense while using an idiomatic passive construction for κέκρυπται. It also renders Χριστός as “Mesaya” in the main text to preserve its title sense, without excluding the established Igbo Christian form “Kraịst” in a footnote.
  reviewer_model: gpt-5.6-terra
