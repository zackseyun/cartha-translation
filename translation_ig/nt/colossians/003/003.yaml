  text: ἀπεθάνετε γάρ, καὶ ἡ ζωὴ ὑμῶν κέκρυπται σὺν τῷ Χριστῷ ἐν τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/003.yaml
  text: For you died, and your life has been hidden with the Messiah in God.
translation:
  language: ig
  text: N’ihi na unu nwụrụ, e zoro ndụ unu na Mesaya n’ime Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na Kraịst.” Okwu Grik Χριστός bụ aha-ọkwá a pụrụ ịsụgharị “Mesaya” ma ọ bụ “Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: unu nwụrụ
  rationale: Aorist indicative na-ezo aka n’ọnwụ doro anya nke ndị kwere ekwe nwụrụ n’oge gara aga; ụdị gara aga a bụ nke ebumpụta ụwa n’Igbo.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-enye ihe kpatara ndụmọdụ dị n’amaokwu bu ụzọ, ma na-ejikọta echiche abụọ ahụ nke ọma.
- source_word: ἡ ζωὴ ὑμῶν
  choice: ndụ unu
  rationale: Nke a na-edobe okwu nkịtị ζωή (‘ndụ’) n’etinyeghị nkọwa ọzọ na-adịghị n’ihe odide ahụ.
- source_word: κέκρυπται
  choice: e zokwawokwa
  rationale: Perfect passive a na-egosi ihe e mere nke ọnọdụ ya ka na-adị ugbu a; ‘e zokwawokwa’ na-eburu ma omume e mezuru ma ọnọdụ na-aga n’ihu.
- source_word: σὺν τῷ Χριστῷ
  choice: na Kraịst
  rationale: N’Igbo Baịbụl na okwu Ndị Kraịst nke oge a, ‘Kraịst’ bụ aha-ọkwá Χριστός a maara nke ọma; ‘na’ na-egosi njikọ ma ọ bụ ịdịkọ ọnụ.
- source_word: ἐν τῷ θεῷ
  choice: n’ime Chineke
  rationale: ‘N’ime’ na-echekwa echiche ọnọdụ ma ọ bụ ebe ἐν na-egosi, n’ejighị ya tụgharịa bụrụ nanị ‘nyere Chineke.’
theological_decisions:
- issue: Ịsụgharị Χριστῷ dị ka aha-ọkwá ma ọ bụ ụdị yiri aha mmadụ
  choice: Kraịst
  alternative: Mesaya
  rationale: Χριστός bụ aha-ọkwá nke pụtara Onye E Tere Mmanụ. ‘Kraịst’ bụ ụdị aha-ọkwá a nabatara nke ọma n’Standard Igbo, ma ihe odide ala na-egosi ‘Mesaya’ iji mee ka ihe aha-ọkwá ahụ pụtara pụta ìhè.
- issue: Nuance nke perfect passive κέκρυπται
  choice: e zokwawokwa
  alternative: zoro ezo
  rationale: Nhọrọ bụ isi na-egosi omume e mezuru na nsonaazụ ya ka dị; nke ọzọ na-emesi ọnọdụ dị ugbu a ike. A naghị ewepụ nke ọ bụla n’ime nuance abụọ ahụ.
translation_notes:
  register: Standard Igbo dị mfe, dị ùgwù, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. E ji ‘unu’ chekwaa onye nke abụọ n’ụbara. E tinyere akara ihe odide ala [a] ozugbo n’ahịrịokwu bụ isi.
