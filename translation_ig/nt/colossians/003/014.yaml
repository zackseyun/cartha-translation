  text: ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ⸀ὅ ἐστιν σύνδεσμος τῆς τελειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/014.yaml
  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: ig
  text: N'elu ihe ndị a niile, yikwasịnụ ịhụnanya, nke bụ nkekọ nke izu okè.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nkekọ nke izu ezu” ma ọ bụ “nkekọ nke ntozu oke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ πᾶσιν δὲ τούτοις
  choice: Ma, karịa ihe ndị a niile
  rationale: N'oyiyi uwe nke malitere n'amaokwu 12, nkebi a na-egosi na ịhụnanya kacha mkpa ma dịkwa ka ihe a na-eyikwasị n'elu àgwà ndị ọzọ. Nsụgharị a na-echekwa ma nkwusi ike ma njikọ ahụ.
- source_word: τὴν ἀγάπην
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị asụgharị ἀγάπη.
- source_word: '[implicit verb from context: ἐνδύσασθε in v. 12]'
  choice: yikwasịnụ
  rationale: Ọ bụ ezie na ngwaa ahụ adịghị n'amaokwu a n'onwe ya, τὴν ἀγάπην na-adabere n'iwu ἐνδύσασθε dị n'amaokwu 12. “Yikwasịnụ” mezuru ahịrịokwu ahụ ma chekwaa oyiyi iyi uwe.
- source_word: ὅ
  choice: nke
  rationale: Nnochiaha njikọ a na-akọwa ịhụnanya, ma ọdịdị neuter ya nwekwara ike ịtụ aka n'echiche ahụ dum. “Nke” na-ahapụ obosara a n'enweghị ịgbatị nkọwa.
- source_word: σύνδεσμος
  choice: ihe nkekọ
  rationale: Okwu a pụtara ihe na-ejikọta ma ọ bụ na-ekekọta ihe ọnụ. “Ihe nkekọ” bụ okwu Igbo kwụ ọtọ nke na-egosipụta ọrụ ahụ n'enweghị itinye oyiyi anụahụ dịka “akwara njikọ.”
- source_word: τῆς τελειότητος
  choice: nke izu okè
  rationale: “Izu okè” na-echekwa nkọwa sara mbara nke τελειότης—izu ezu, ntozu oke, ma ọ bụ ịdị zuru oke—ma ghara imechi genitive ahụ n'otu nkọwa naanị.
theological_decisions:
- issue: Ihe “σύνδεσμος τῆς τελειότητος” pụtara
  choice: “ihe nkekọ nke izu okè”
  alternative: “ihe na-ekekọta ihe niile ọnụ ka ha zuo ezu” ma ọ bụ “ihe nkekọ nke ntozu oke”
  rationale: Nhazi genitive Grik ahụ nwere ike ịpụta nkekọ e ji mara izu okè, nkekọ na-eweta izu ezu, ma ọ bụ ihe na-ejikọta àgwà ọma ndị ahụ ka ha bụrụ otu zuru oke. Nsụgharị dị mkpụmkpụ na-echekwa esemokwu nkọwa a kama idozi ya n'ụzọ otu.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Yikwasịnụ” na-ejide oyiyi uwe nke amaokwu ndị gbara ya gburugburu; “ihe nkekọ” bụ okwu nkịtị na nke doro anya karịa okwu nka ma ọ bụ okwu ahụ́ mmadụ.
