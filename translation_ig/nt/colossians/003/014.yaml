revisions:
- from: Ma, karịa ihe ndị a niile, yikwasịnụ ịhụnanya, nke bụ ihe nkekọ nke izu okè.[a]
  to: N'elu ihe ndị a niile, yikwasịnụ ịhụnanya, nke bụ nkekọ nke izu okè.[a]
  rationale: The revision retains the source's dependence on the prior imperative and its clothing metaphor, while using the more direct and idiomatic Standard Igbo "nkekọ." It preserves the ambiguity of τῆς τελειότητος rather than interpreting it as either a bond that produces perfection or a bond belonging to perfection.
