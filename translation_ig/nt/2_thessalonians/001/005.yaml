review_pass:
  verdict: revise
  source_fidelity: 'The main rendering follows the Greek closely: “ihe àmà” appropriately renders ἔνδειγμα; “ikpe ziri ezi nke Chineke” renders τῆς δικαίας κρίσεως τοῦ θεοῦ; and “ka e wee gụọ unu dị ka ndị kwesịrị” retains the passive sense of καταξιωθῆναι without implying merit. The draft, however, does not explicitly represent καί (“also”) in καὶ πάσχετε. The alternative “n’aha ya” in footnote c is not a suitable rendering of ὑπὲρ ἧς in this context.'
  naturalness: The revised wording remains natural, modern Standard Igbo and retains a dignified biblical register. “Unu na-atakwa ahụhụ” idiomatically conveys the ongoing present suffering while explicitly retaining “also.”
  terminology: “Alaeze Chineke,” “ikpe ziri ezi,” and “ndị kwesịrị” are appropriate established Igbo biblical terminology. Footnote c is adjusted so that its alternatives express suffering for the sake of, or because of, the kingdom rather than acting in its name.
  issues:
  - severity: medium
    issue: The translation omits the explicit force of καί in καὶ πάσχετε.
    rationale: Although Igbo may sometimes leave additive particles implicit, this καί is a meaningful link in the clause and can be naturally represented by the enclitic -kwa in “na-atakwa ahụhụ.”
  - severity: medium
    issue: Footnote c gives “n’aha ya” as an alternative for ὑπὲρ ἧς.
    rationale: “N’aha ya” means “in its name” and does not accurately convey ὑπέρ with the genitive here, which denotes suffering for the sake of/on account of the kingdom.
  revised_text: Nke a bụ ihe àmà nke ikpe ziri ezi nke Chineke[a], ka e wee gụọ unu dị ka ndị kwesịrị alaeze Chineke[b], nke unu na-atakwa ahụhụ n’ihi ya[c].
