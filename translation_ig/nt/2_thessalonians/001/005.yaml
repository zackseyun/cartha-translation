id: 2TH.1.5
reference: 2 Thessalonians 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/005.yaml
  text: This is evidence of the righteous judgment of God[a], so that you may be counted worthy of the kingdom of God, for which you are also suffering[c][b],
translation:
  language: ig
  text: Nke a bụ ihe àmà nke ikpe ziri ezi nke Chineke[a], ka e wee gụọ unu dị ka ndị kwesịrị alaeze Chineke[b], nke unu na-atakwa ahụhụ n’ihi ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe na-egosi” ma ọ bụ “ihe ịrịba ama” nke ikpe ziri ezi nke Chineke.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka e wee were unu dị ka ndị kwesịrị,” ma ọ bụ, “nke mere na a ga-agụ unu dị ka ndị kwesịrị.” Usoro okwu Grik ahụ nwere ike igosi ebumnuche ma ọ bụ ihe si na ya pụta.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “maka ya” ma ọ bụ “n’ihi alaeze ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδειγμα
  choice: ihe àmà
  rationale: “Ihe àmà” na-egosi ihe na-eme ka eziokwu pụta ìhè ma ọ bụ na-atụ aka na ya, n’etinyeghị echiche siri ike karịa nke okwu Grik ahụ nwere.
- source_word: δικαίας κρίσεως
  choice: ikpe ziri ezi
  rationale: Nke a na-egosi ma ikpe Chineke na àgwà ya nke ịbụ nke ziri ezi n’Igbo doro anya ma dị ùgwù.
- source_word: εἰς τὸ καταξιωθῆναι
  choice: ka e wee gụọ unu dị ka ndị kwesịrị
  rationale: 'Ụdị a na-echekwa olu nnara nke ngwaa ahụ: ọ bụghị ime ka ha bụrụ ndị kwesịrị site n’ike nke ha, kama ịgụ ma ọ bụ ile ha anya dị ka ndị kwesịrị. “Ka e wee” nwere ike ibu echiche ebumnuche ma ọ bụ ihe si na ya pụta.'
- source_word: βασιλείας τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ ntụgharị Igbo a maara nke ọma, dịkwa kpọmkwem maka nkebi okwu Grik ahụ.
- source_word: ὑπὲρ ἧς
  choice: n’ihi ya
  rationale: N’ebe a, okwu ahụ jikọtara ahụhụ ha na alaeze Chineke, ya bụ na ha na-ata ahụhụ n’ihi ya ma ọ bụ maka ọdịmma ya.
- source_word: καὶ πάσχετε
  choice: unu na-ata ahụhụ
  rationale: Ụdị na-aga n’ihu na-egosi ahụhụ ha na-aga n’ihu n’oge ahụ. Njikọ καί pụtara n’echiche nke amaokwu ahụ, n’agbanyeghị na a naghị atụgharị ya iche ka okwu Igbo ghara ịdị arọ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ahụhụ na ịbụ ndị kwesịrị alaeze
  choice: Ahụhụ ha bụ ihe àmà metụtara ikpe ziri ezi nke Chineke, nke ebumnuche ya ma ọ bụ ihe si na ya pụta bụ ka a gụọ ha dị ka ndị kwesịrị alaeze; e kwughị na ahụhụ ahụ na-azụta ma ọ bụ na-erite nnabata n’alaeze.
  alternative: Ahụhụ ha na-eme ka ha rite ma ọ bụ nweta ịdị kwesịrị alaeze dịka ụgwọ ọrụ ha meriri.
  rationale: καταξιωθῆναι dị n’olu nnara ma pụta ‘ka a gụọ/lee ha anya dị ka ndị kwesịrị.’ Usoro okwu ahụ na-ejikọta nke a na ikpe Chineke, ọ naghị akọwa ahụhụ dị ka ụgwọ e ji azụta nnabata.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E jiri “ihe àmà,” “ikpe ziri ezi,” na “gụọ unu dị ka ndị kwesịrị” chekwaa ike na mgbagwoju anya nke okwu Grik, na-enweghị itinye nkọwa ụka pụrụ iche.
