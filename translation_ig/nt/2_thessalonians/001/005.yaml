revisions:
- from: Nke a bụ ihe àmà nke ikpe ziri ezi nke Chineke[a], ka e wee gụọ unu dị ka ndị kwesịrị alaeze Chineke[b], nke unu na-ata ahụhụ n’ihi ya[c].
  to: Nke a bụ ihe àmà nke ikpe ziri ezi nke Chineke[a], ka e wee gụọ unu dị ka ndị kwesịrị alaeze Chineke[b], nke unu na-atakwa ahụhụ n’ihi ya[c].
  rationale: The revision adds -kwa to represent καί (“also”) while preserving the ongoing sense of the present verb. Footnote c replaces an inaccurate alternative with Igbo expressions that faithfully convey suffering for the sake of, or on account of, the kingdom. No doctrinal interpretation has been added.
