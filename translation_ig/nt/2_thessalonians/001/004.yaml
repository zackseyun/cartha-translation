    text: Ma ọ bụ, “ikwesị ntụkwasị obi”; πίστις nwere ike ịpụta okwukwe ma ọ bụ ịnọgide na-ekwesị ntụkwasị obi, karịchaa n’oge ahụhụ.
    reason: alternative_reading
