id: 2TH.1.4
reference: 2 Thessalonians 1:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε ⸂αὐτοὺς ἡμᾶς⸃ ἐν ὑμῖν ⸀ἐγκαυχᾶσθαι ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ ὑπὲρ τῆς ὑπομονῆς ὑμῶν καὶ πίστεως ἐν πᾶσιν τοῖς διωγμοῖς ὑμῶν καὶ ταῖς θλίψεσιν αἷς ἀνέχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/004.yaml
  text: so that we ourselves boast about you among the churches of God because of your perseverance and faith in all your persecutions and afflictions that you are enduring,[a]
translation:
  language: ig
  text: nke mere na anyị onwe anyị ji unu anya isi n’etiti ọgbakọ Chineke, n’ihi ntachi obi na okwukwe unu n’ime mkpagbu na ahụhụ unu niile ndị unu na-anagide.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikwesị ntụkwasị obi”; πίστις nwere ike ịpụta okwukwe ma ọ bụ ịnọgide na-ekwesị ntụkwasị obi, karịchaa n’oge ahụhụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: nke mere na
  rationale: Ọ na-egosi ihe si n’okwu bu ụzọ pụta; nke a bụ ụzọ Igbo si ekwu ya n'ụzọ doro anya.
- source_word: αὐτοὺς ἡμᾶς
  choice: anyị onwe anyị
  rationale: Ọ na-echekwa nkwusi ike dị n’aha nnọchiaha Grik ahụ, na-egosi Pọl na ndị ya kpọmkwem.
- source_word: ἐν ὑμῖν ἐγκαυχᾶσθαι
  choice: ji unu anya isi
  rationale: N’ebe a, ἐν ὑμῖν na-egosi ndị a na-anya isi n’ihi ha; akpaalaokwu Igbo a na-ebute echiche ahụ n'ụzọ ebumpụta ụwa.
- source_word: ἐν ταῖς ἐκκλησίαις τοῦ θεοῦ
  choice: n’etiti ọgbakọ Chineke dị iche iche
  rationale: Ọ na-egosi ọtụtụ nzukọ ndị kwere ekwe nke Chineke, bụ́ ebe a na-ekwu okwu ịnya isi ahụ.
- source_word: ὑπὲρ
  choice: n’ihi
  rationale: N’ebe a ọ na-egosi ihe kpatara ha ji anya isi.
- source_word: ὑπομονῆς
  choice: ntachi obi
  rationale: Ọ na-egosi ịnọgide na-eguzosi ike ma na-edi nrụgide; okwu a bụ nke a na-aghọta nke ọma n’Igbo ugbu a.
- source_word: πίστεως
  choice: okwukwe
  rationale: Nke a bụ ntụgharị bụ isi nke πίστις, ma ọnọdụ mkpagbu a nwekwara ike ime ka ọ gụnye ikwesị ntụkwasị obi; e debere nke ahụ n’ala ala peeji.
- source_word: διωγμοῖς
  choice: mkpagbu
  rationale: Ọ na-ezo aka n’imegide na mmegbu a na-eme mmadụ n’ihi nkwenye ya.
- source_word: θλίψεσιν
  choice: ahụhụ
  rationale: Ọ na-egosi nrụgide na nsogbu siri ike, ma na-anọgide dị iche ntakịrị na mkpagbu a kpọrọ aha.
- source_word: αἷς ἀνέχεσθε
  choice: unu na-edi
  rationale: Ọ na-echekwa echiche nke ahụmahụ na-aga n’ihu nke ha na-anagide ugbu a.
theological_decisions:
- issue: Ma a ga-asụgharị πίστις dịka okwukwe ka ọ bụ ikwesị ntụkwasị obi
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi
  rationale: πίστις nwere ike ịpụta ntụkwasị obi n’ebe Chineke nọ ma ọ bụ iguzosi ike n’ikwesị ntụkwasị obi, karịchaa n’ọnọdụ ahụhụ. Isi ederede ji “okwukwe,” ebe nkọwa ala peeji na-echekwa ihe ọzọ ahụ nwere ike ịpụta.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta. “Ji unu anya isi” na-ebute ike okwu Grik n’enweghị ime ka ọ daa ka mpako ọjọọ; “ọgbakọ Chineke dị iche iche” na-eme ka ọtụtụ dị na ἐκκλησίαις pụta ìhè.
