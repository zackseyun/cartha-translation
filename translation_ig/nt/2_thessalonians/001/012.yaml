id: 2TH.1.12
reference: 2 Thessalonians 1:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅπως ἐνδοξασθῇ τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν ὑμῖν, καὶ ὑμεῖς ἐν αὐτῷ, κατὰ τὴν χάριν τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/012.yaml
  text: so that the name of our Lord Jesus may be glorified in you[a], and you in him[c][b], according to the grace of our God and the Lord Jesus the Messiah.
translation:
  language: ig
  text: ka aha Onyenwe anyị Jizọs wee nweta otuto n'ime unu[a], ka unu onwe unu kwa nweta otuto n'ime ya, dị ka amara Chineke anyị na Onyenwe anyị Jizọs bụ Mezaịa si dị.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n'etiti unu.” Preposishọn Grik ahụ nwere ike inwe nghọta abụọ ahụ n'ebe a.
    reason: lexical_alternative
  - marker: c
    text: Enwere ike ịghọta okwu ikpeazụ ahụ dịka okwu jikọrọ “Chineke” na “Onyenwe anyị Jizọs bụ Mezaịa” nke ukwuu, ma ọ bụ dịka okwu na-ekwu iche banyere “Chineke anyị” na “Onyenwe anyị Jizọs bụ Mezaịa.” Nsụgharị a ahapụghị esemokwu ahụ site n'ịmanye otu nghọta.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: ka e wee
  rationale: Na-egosi nzube ma ọ bụ ihe a na-atụ anya ka o si n'ekpere dị n'ihu pụta; ọ bụkwa ụzọ Igbo nkịtị si kwuo ya.
- source_word: ἐνδοξασθῇ
  choice: nye ... otuto
  rationale: Na-echekwa echiche nke ime ka e too ma ọ bụ mee ka onye ahụ dị ebube, ma na-ada nke ọma n'Igbo. Usoro ‘e ... nye’ na-egosikwa na ngwaa Grik ahụ dị n'olu nnabata.
- source_word: τὸ ὄνομα
  choice: aha
  rationale: A hapụrụ ihe oyiyi Akwụkwọ Nsọ ahụ dịka ọ dị; ‘aha’ nwere ike ịgụnye onye ọ bụ na aha ọma ya.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: Onyenwe anyị Jizọs
  rationale: Na-echekwa utu aha κύριος, nnọchiaha nke nwe, na aha Jizọs n'usoro na-ada nke ọma n'Igbo.
- source_word: ἐν ὑμῖν
  choice: n'ime unu
  rationale: Na-agbasochi preposishọn Grik ahụ anya; ebe ọ bụ ọtụtụ mmadụ ka a na-agwa, ọ pụkwara inwe nghọta nke ‘n'etiti unu,’ nke e dere n'okpuru.
- source_word: καὶ ὑμεῖς ἐν αὐτῷ
  choice: nyekwa unu otuto n'ime ya
  rationale: 'Na-echekwa nhazi okwu abụọ ahụ na-adakọ: a na-enye aha Onyenwe anyị otuto n''ime ndị kwere ekwe, a na-enyekwa ha otuto n''ime ya. ‘Ya’ na-ezo aka n''ụzọ kacha kwe omume na Jizọs.'
- source_word: κατὰ τὴν χάριν
  choice: dị ka amara ... si dị
  rationale: Na-egosi ụkpụrụ ma ọ bụ ntọala nke ihe ahụ, n'etinyeghị echiche nke naanị ụzọ e si mee ya.
- source_word: χάριν
  choice: amara
  rationale: ‘Amara’ bụ okwu Igbo Akwụkwọ Nsọ a maara nke ọma maka χάρις, ma na-eburu echiche nke ihu ọma Chineke na-enye n'efu.
- source_word: τοῦ θεοῦ ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: Chineke anyị na Onyenwe anyị Jizọs bụ Mezaịa
  rationale: Na-echekwa njikọ okwu Grik ahụ n'ụzọ dị mkpirikpi ma ghara itinye okwu ga-amanye otu n'ime nghọta abụọ a na-arụrịta ụka. A sụgharịrị Χριστός dịka utu aha ‘Mezaịa.’
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Mezaịa
  alternative: Kraịst
  rationale: N'ebe a Χριστός na-arụ ọrụ dịka utu aha; ‘Mezaịa’ na-eme ka ihe utu aha ahụ pụtara pụta ìhè, ebe ‘Kraịst’ bụkwa ụdị a na-ejikarị eme ihe dịka aha.
- issue: Ihe αὐτῷ na-ezo aka na ya
  choice: ya, ya bụ Onyenwe anyị Jizọs
  alternative: ya, ya bụ aha ahụ
  rationale: Nhazi otuto a na-enye ibe ya na ụdị okwu Pọl ji ekwu ịdị ‘n'ime’ Jizọs na-akwado na ọ na-ezo aka na Jizọs; a naghị agbanwe okwu isi ahụ karịa ka ọ dị.
- issue: Nghọta ahịrịokwu genitiv ikpeazụ
  choice: A hapụrụ ‘Chineke anyị na Onyenwe anyị Jizọs bụ Mezaịa’ n'ụdị njikọ dị mkpirikpi
  alternative: 'Ịghọta ya dịka ndị a kpọrọ aha abụọ dị iche: ‘Chineke anyị’ na ‘Onyenwe anyị Jizọs bụ Mezaịa’'
  rationale: Nhazi Grik ahụ jikọtara θεοῦ na κυρίου Ἰησοῦ Χριστοῦ nke ukwuu, ma a ka na-atụle ma ọ na-akọwa otu onye ka ọ bụ na ọ na-ekwu banyere mmadụ abụọ. Igbo enweghị article nke ga-emepụtaghachi nhazi ahụ kpọmkwem, ya mere ihe e dere n'okpuru na-edobe esemokwu ahụ n'ebughị ụzọ kpebie ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ ‘Onyenwe anyị,’ ‘amara,’ na ‘Mezaịa’ iji debe ụda Akwụkwọ Nsọ n'enweghị okwu otu ụka pụrụ iche. A hapụrụ ntụgharị uche nke preposishọn ἐν na nhazi ahịrịokwu ikpeazụ n'ihe ndị e dere n'okpuru.
