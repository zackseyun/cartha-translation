  rationale: The revision adds appositional commas for clarity and replaces the unnatural literal genitive construction with the natural qualitative rendering “ndị mmụọ ozi ya dị ike.” The footnote preserves the more formal, source-near alternative and thus retains awareness of the Greek construction without burdening the main text.
