source:
  edition: SBLGNT
  text: καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ’ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ’ οὐρανοῦ μετ’ ἀγγέλων δυνάμεως αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/007.yaml
  text: and to you who are being afflicted[a], relief with us at the revelation of the Lord Jesus from heaven with his mighty angels.
translation:
  language: ig
  text: na inye unu, ndị a na-akpagbu, ahụ efe tinyere anyị, mgbe e kpughere Onyenwe anyị Jizọs site n’eluigwe, ya na ndị mmụọ ozi ya dị ike.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ya na ndị mmụọ ozi nke ike ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβομένοις
  choice: ndị a na-akpagbu
  rationale: Ọ bụ participle dị na present passive, nke na-egosi ndị a na-emegbu ma ọ bụ a na-enye nsogbu ugbu a. “Ndị a na-akpagbu” na-echekwa nghọta passive ahụ ma bụrụkwa okwu Igbo doro anya.
- source_word: ἄνεσιν
  choice: ahụ efe
  rationale: N’ebe a, okwu ahụ pụtara nnwere onwe ma ọ bụ izu ike site ná nrụgide na mkpagbu. “Ahụ efe” na-egosi ibelata ibu na nsogbu, ọ bụghị naanị izu ike nke obi.
- source_word: μεθ’ ἡμῶν
  choice: tinyere anyị
  rationale: Nke a na-egosi na Pọl na ndị ya na ya so ga-esokwa ndị na-agụ akwụkwọ ozi ahụ nweta ahụ efe ahụ.
- source_word: ἐν τῇ ἀποκαλύψει
  choice: mgbe e kpughere
  rationale: ἐν nwere ọrụ oge n’ebe a. Nsụgharị a na-eme ka oge ahụ doo anya ma chekwaa echiche nke ikpughe onye zoro ezo ma ọ bụ onye a na-ahụbeghị anya.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: Onyenwe anyị Jizọs
  rationale: “Onyenwe anyị” bụ aha nsọpụrụ a na-ejikarị sụgharịa κύριος n’Agba Ọhụrụ, ebe “Jizọs” na-edobe aha onye ahụ.
- source_word: ἀπ’ οὐρανοῦ
  choice: site n’eluigwe
  rationale: ἀπό na-egosi ebe o si bịa; “site n’eluigwe” bụ ụzọ Igbo dị mma isi kwuo ya.
- source_word: μετ’ ἀγγέλων δυνάμεως αὐτοῦ
  choice: ya na ndị mmụọ ozi nke ike ya
  rationale: 'Nke a na-esochi usoro genitive Grik nke ọma ma na-ahapụ nghọta ya ghe oghe: ha nwere ike ịbụ ndị mmụọ ozi e ji ike ya mara, ma ọ bụ ndị mmụọ ozi so na ngosipụta nke ike ya.'
theological_decisions:
- issue: Nghọta nke genitive n’okwu ἀγγέλων δυνάμεως αὐτοῦ
  choice: ya na ndị mmụọ ozi nke ike ya
  alternative: ya na ndị mmụọ ozi ya dị ike
  rationale: Usoro okwu Grik ahụ dị mkpụmkpụ ma nwee ike ịpụta àgwà ndị mmụọ ozi ahụ ma ọ bụ njikọ ha na ike Onyenwe anyị. Isiokwu bụ isi na-echekwa usoro a na mgbagwoju anya ya; nkọwa ala peeji na-enye ụzọ Igbo ka mfe.
- issue: Ọrụ oge nke ἐν τῇ ἀποκαλύψει
  choice: mgbe e kpughere Onyenwe anyị Jizọs
  alternative: n’ikpughe Onyenwe anyị Jizọs
  rationale: Ahịrịokwu ahụ na-ejikọta ahụ efe ahụ na oge a ga-ekpughe Jizọs. “Mgbe e kpughere” na-ekwupụta ọrụ oge nke ἐν n’Igbo eke, na-enweghị ịgbanwe ọdịnaya ihe ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ “ahụ efe” maka ọdịiche ya na mkpagbu, ma debe usoro “ndị mmụọ ozi nke ike ya” iji ghara iwepụ mgbagwoju anya dị n’usoro Grik.
