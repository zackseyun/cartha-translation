revisions:
- from: n’ụbọchị ahụ, mgbe ọ ga-abịa ka e nye ya otuto n’etiti ndị nsọ ya[a], ka ndị niile kwere wee ju ya anya, n’ihi na unu kwere n’ama anyị gbara n’ihu unu.[b]
  to: n’ụbọchị ahụ, mgbe ọ ga-abịa ka e nye ya otuto n’etiti ndị nsọ ya[a], ka ọ wee ju ndị niile kwere anya, n’ihi na a kwenyere n’ama anyị gbara unu.[b]
  rationale: The revision corrects the direction of the amazement expression and renders the apostolic testimony as being borne to the readers while preserving the Greek passive with “a kwenyere.” It retains the fronted temporal phrase for clear modern Igbo and preserves the disputed nuance of ἐν in footnote a.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:20:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the future coming, glorification, the holy people, the causal clause, and the framing phrase “n’ụbọchị ahụ.” However, “ka ndị niile kwere wee ju ya anya” reverses the Igbo participant roles: it normally means that the believers surprise him, whereas θαυμασθῆναι means that he is the one marveled at. “n’ihu unu” also means chiefly “before/in the presence of you,” not the directional sense of ἐφ’ ὑμᾶς here.'
  naturalness: 'The revised wording uses idiomatic Standard Igbo: “ka ọ wee ju ndị niile kwere anya” makes Christ the one who evokes amazement, and “ama anyị gbara unu” naturally expresses testimony addressed to the Thessalonians.'
  terminology: “ndị nsọ,” “otuto,” and “ama anyị gbara” are appropriate, dignified, and theologically nonsectarian. The alternative sense of ἐν (“n’ime”) remains appropriately preserved in footnote a.
  issues:
  - severity: high
    issue: Participant roles are reversed in the rendering of θαυμασθῆναι.
    rationale: “Ka ndị niile kwere wee ju ya anya” makes “ndị niile kwere” the grammatical source of surprise and “ya” the experiencer. The Greek passive says that Christ is marveled at by/in relation to all believers. Recast so that he is the one who causes their amazement.
  - severity: medium
    issue: “n’ihu unu” does not adequately render ἐφ’ ὑμᾶς in this context.
    rationale: The phrase normally denotes presence before someone. In this apostolic-testimony context, the sense is testimony borne to/for the readers; “ama anyị gbara unu” is direct and idiomatic.
  revised_text: n’ụbọchị ahụ, mgbe ọ ga-abịa ka e nye ya otuto n’etiti ndị nsọ ya[a], ka ọ wee ju ndị niile kwere anya, n’ihi na a kwenyere n’ama anyị gbara unu.[b]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime ndị nsọ ya.” Okwu Grik a nwere ike ịpụta na a na-enye ya otuto n’etiti ndị ya dị nsọ, ma ọ bụ na a na-egosipụta otuto ya n’ime ha.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịhazi ahịrịokwu ahụ otú a: “mgbe ọ ga-abịa ka e nye ya otuto n’etiti ndị nsọ ya, ka ọ wee ju ndị niile kwere anya—n’ihi na a kwenyere n’ama anyị gbara unu—n’ụbọchị ahụ.”'
    reason: previous_rendering
  revision_rationale: The revision corrects the direction of the amazement expression and renders the apostolic testimony as being borne to the readers while preserving the Greek passive with “a kwenyere.” It retains the fronted temporal phrase for clear modern Igbo and preserves the disputed nuance of ἐν in footnote a.
