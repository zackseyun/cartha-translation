id: 2TH.1.10
reference: 2 Thessalonians 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅταν ἔλθῃ ἐνδοξασθῆναι ἐν τοῖς ἁγίοις αὐτοῦ καὶ θαυμασθῆναι ἐν πᾶσιν τοῖς πιστεύσασιν, ὅτι ἐπιστεύθη τὸ μαρτύριον ἡμῶν ἐφ’ ὑμᾶς, ἐν τῇ ἡμέρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/010.yaml
  text: on that day when he comes to be glorified among his saints and to be marveled at among all who have believed[b][a], because our testimony to you was believed.
translation:
  language: ig
  text: n’ụbọchị ahụ, mgbe ọ ga-abịa ka e nye ya otuto n’etiti ndị nsọ ya[a], ka ọ wee ju ndị niile kwere anya, n’ihi na a kwenyere n’ama anyị gbara unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime ndị nsọ ya.” Okwu Grik a nwere ike ịpụta na a na-enye ya otuto n’etiti ndị ya dị nsọ, ma ọ bụ na a na-egosipụta otuto ya n’ime ha.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịhazi ahịrịokwu ahụ otú a: “mgbe ọ ga-abịa ka e nye ya otuto n’etiti ndị nsọ ya, ka ọ wee ju ndị niile kwere anya—n’ihi na a kwenyere n’ama anyị gbara unu—n’ụbọchị ahụ.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὅταν ἔλθῃ
  choice: mgbe ọ ga-abịa
  rationale: Nke a na-egosi otu ihe doro anya nke ga-eme n’ọdịnihu; usoro a bụ Igbo nkịtị ma doo anya.
- source_word: ἐνδοξασθῆναι
  choice: ka e nye ya otuto
  rationale: Na-echekwa olu nnara na nzube/metụta nke infinitive ahụ, tinyere echiche nke otuto dị nsọ.
- source_word: ἐν τοῖς ἁγίοις αὐτοῦ
  choice: n’etiti ndị nsọ ya
  rationale: “N’etiti” na-egosi ọnọdụ ya n’etiti ndị nke ya, ma ihe odide ala peeji na-echekwakwa ohere nke “n’ime.”
- source_word: θαυμασθῆναι
  choice: ka ... wee ju ya anya
  rationale: Na-egosi ihe ijuanya juputara n’ịsọpụrụ, ọ bụghị nanị mmasị nkịtị.
- source_word: ἐν πᾶσιν τοῖς πιστεύσασιν
  choice: ndị niile kwere
  rationale: Na-echekwa ike ngwaa nke participle ahụ ma na-ada ka Igbo nke oge a.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Na-egosi njikọ ihe kpatara ya nke ọma.
- source_word: ἐπιστεύθη
  choice: unu kwere
  rationale: 'A gbanwere passive Grik ka ọ bụrụ active Igbo dị ndụ, ebe ọ ka na-ekwu otu ihe ahụ: ndị a natara ama ahụ site n’okwukwe.'
- source_word: τὸ μαρτύριον ἡμῶν
  choice: ama anyị gbara
  rationale: “Ịgba ama” bụ okwu Igbo doro anya maka nkwupụta ndịozi nke na-agba akaebe.
- source_word: ἐφ’ ὑμᾶς
  choice: n’ihu unu
  rationale: Na-egosi na e nyere ha ama ahụ kpọmkwem; “nyere unu” bụkwa ihe ọzọ enwere ike ikwu.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: n’ụbọchị ahụ
  rationale: Ọ bụ okwu oge nkịtị ma dị nsọ nke na-akọwa ụbọchị ahụ a na-atụ anya ya.
theological_decisions:
- issue: Ike ἐν n’okwu “ndị nsọ ya”
  choice: n’etiti ndị nsọ ya
  alternative: n’ime ndị nsọ ya
  rationale: Ihe gbara ya gburugburu jikọtara ndị nsọ ya na ndị kwere; “n’etiti” na-eme ka ọnọdụ ọha pụta ìhè, ebe ihe odide ala peeji na-echekwa echiche na a ga-egosipụta otuto ya n’ime ha.
- issue: Mmekọrịta πιστεύσασιν na ἐπιστεύθη na ama ndịozi
  choice: ndị niile kwere ... unu kwere n’ama anyị
  alternative: ndị niile tụkwasịrị obi ... a kwenyere n’ama anyị
  rationale: Asụsụ okwukwe nkịtị na-echekwa njikọ okwu abụọ ahụ n’enweghị itinye nkọwa ụka pụrụ iche.
- issue: Ọnọdụ ahịrịokwu ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: E tinyere “n’ụbọchị ahụ” ná mmalite
  alternative: Itinye ya n’ọgwụgwụ dịka usoro Grik siri dị
  rationale: Usoro mmalite bụ Igbo dị mfe nghọta ma na-eme ka ụbọchị ahụ kpuchie ihe omume niile; ihe odide ala peeji na-echekwa usoro nke yiri nke Grik.
translation_notes:
  register: Standard Igbo; asụsụ dị ùgwù ma dị mfe nghọta. Ejiri “ndị nsọ” dịka okwu Pọl maara ama, “ịgba ama” maka μαρτύριον, ma zere okwu ụka pụrụ iche. Akara ihe odide ala peeji [a] na [b] dị n’ahịrịokwu isi.
