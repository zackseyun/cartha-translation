id: 2TH.1.11
reference: 2 Thessalonians 1:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ προσευχόμεθα πάντοτε περὶ ὑμῶν, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/011.yaml
  text: To this end also we always pray for you[a], that our God may count you worthy of the calling and may fulfill every good resolve and work of faith with power[c][b],
translation:
  language: ig
  text: 'N’ihi nke a kwa, anyị na-ekpe ekpere mgbe niile maka unu: ka Chineke anyị gụọ unu dịka ndị ruru eru maka ọkpụkpọ ahụ[a], ma site n’ike ya mezuo nzube ọma ọ bụla[b] na ọrụ okwukwe[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mee ka unu bụrụ ndị ruru eru maka ọkpụkpọ ahụ.” Ngwaa Grik ahụ nwere ike ịpụta ma “gụọ/lee anya dịka ndị ruru eru” ma “mee ka ha bụrụ ndị ruru eru.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “nzube ọ bụla nke ịdị mma,” “mkpebi ọ bụla ime ihe ọma,” ma ọ bụ “ihe ọma ọ bụla mmadụ bu n’obi ime.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịghọta “ọrụ okwukwe” dịka “ọrụ sitere n’okwukwe.” N’ebe a, “okwukwe” nwekwara ike ịpụta “ikwesị ntụkwasị obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ καὶ
  choice: Ọ bụkwa n’ihi nke a
  rationale: Nkebi a na-atụgharị uche azụ n’ihe e kwuru tupu ya ma na-egosikwa nzube; okwu Igbo a na-egosipụta njikọ ahụ n’ụzọ doro anya ma dịkwa mfe nghọta.
- source_word: προσευχόμεθα πάντοτε περὶ ὑμῶν
  choice: anyị ji ekpe ekpere mgbe niile maka unu
  rationale: Nke a na-egosipụta omume ekpere na-aga n’ihu dịka ihe a na-eme mgbe niile, ma na-atụgharị περὶ ὑμῶν n’ụzọ Igbo nkịtị.
- source_word: ἀξιώσῃ
  choice: were unu dị ka ndị kwesịrị
  rationale: Nke a na-ebute ụzọ n’echiche nke ịgụ ma ọ bụ ile mmadụ anya dị ka onye kwesịrị, n’ebughị ụzọ kpebie na ngwaa ahụ pụtara naanị ime ka mmadụ bụrụ onye kwesịrị.
- source_word: τῆς κλήσεως
  choice: ọkpụkpọ ahụ
  rationale: Asụsụ Grik enweghị nnọchiaha nwe dịka ‘nke ya’ ma ọ bụ ‘nke unu’; ‘ahụ’ na-egosi ọkpụkpọ a maara nke ọma n’ihe a na-ekwu.
- source_word: πληρώσῃ ... ἐν δυνάμει
  choice: jirikwa ike mezuo
  rationale: Nke a na-echekwa echiche nke imezu ihe n’ike, ma hapụkwa Chineke dịka onye na-eme ihe ahụ.
- source_word: πᾶσαν εὐδοκίαν ἀγαθωσύνης
  choice: ezi mkpebi ọ bụla
  rationale: εὐδοκία nwere ike ịbụ nzube ma ọ bụ mkpebi mmadụ ji obi ya nabata; ἀγαθωσύνης na-akọwa ịdị mma ya. Okwu a họọrọ dị nkenke ma na-agụkwa nke ọma n’Igbo.
- source_word: ἔργον πίστεως
  choice: ọrụ okwukwe
  rationale: A hapụrụ njikọ genitive ahụ n’ụdị dị mkpụmkpụ, ka ọ ghara ịmanye naanị otu nghọta—ma ọrụ sitere n’okwukwe ma ọ bụ ọrụ e ji ikwesị ntụkwasị obi rụọ.
theological_decisions:
- issue: Ihe ἀξιώσῃ pụtara n’ihe gbasara ọkpụkpọ Chineke
  choice: ka Chineke were unu dị ka ndị kwesịrị ọkpụkpọ ahụ
  alternative: ka Chineke mee ka unu bụrụ ndị kwesịrị ọkpụkpọ ahụ
  rationale: Ngwaa Grik ahụ nwere ike ịpụta ịgụ mmadụ dịka onye kwesịrị ma ọ bụ ime ka ọ bụrụ onye kwesịrị. Isiokwu ahụ họọrọ nghọta nke mbụ, ebe nkọwa ala peeji na-echekwa nke ọzọ n’edoziwaghị esemokwu ahụ.
- issue: Ihe πίστεως pụtara n’okwu ἔργον πίστεως
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi
  rationale: ‘Okwukwe’ bụ ntụgharị bụ isi nke πίστις n’ebe a, ma okwu Grik ahụ na njikọ ya na ‘ọrụ’ nwekwara ike ibu echiche nke ikwesị ntụkwasị obi; e debere nke ahụ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta, dee ya. E chekwara usoro ekpere nke amaokwu ahụ na ihe ndị okwu Grik nwere ike ịpụta, n’etinyeghị nnọchiaha nwe n’ebe isi mmalite na-enweghị ya.
