revisions:
- from: 'Ọ bụkwa n’ihi nke a ka anyị ji ekpe ekpere mgbe niile maka unu: ka Chineke anyị were unu dị ka ndị kwesịrị ọkpụkpọ ahụ[a], jirikwa ike mezuo ezi mkpebi ọ bụla[b] na ọrụ okwukwe[c].'
  to: 'N’ihi nke a kwa, anyị na-ekpe ekpere mgbe niile maka unu: ka Chineke anyị gụọ unu dịka ndị ruru eru maka ọkpụkpọ ahụ[a], ma site n’ike ya mezuo nzube ọma ọ bụla[b] na ọrụ okwukwe[c].'
  rationale: The revision improves the idiomatic expression of being deemed worthy and replaces a potentially misleading “correct decision” sense with “good purpose.” It also places the instrumental force of ἐν δυνάμει clearly with God’s fulfilling action, while preserving the source’s scope and the compact, open genitive in “ọrụ okwukwe.”
