review_pass:
  verdict: revise
  source_fidelity: 'Isi nsụgharị ahụ na-anọchi anya echiche Grik nke ọma: ọrụ nke inye Chineke ekele mgbe niile, uto karịrị akarị nke okwukwe, na mmụba nke ịhụnanya. Otú ọ dị, «n’ebe ibe unu nọ» mgbe isiokwu ya bụ «onye ọ bụla» anaghị akọwapụta n''ụzọ kacha doo anya na ịhụnanya onye nke ọ bụla na-aga n’ebe ibe ya nọ (εἰς ἀλλήλους). «Unu niile» na-echekwakwa nkwusi ike dị na πάντων ὑμῶν.'
  naturalness: Ahịrịokwu ahụ bụ Standard Igbo doro anya ma dị n’usoro ekpere kwesịrị ekwesị. Idozi «ibe unu» ka ọ bụrụ «ibe ya» n’usoro «onye ọ bụla» na-eme ka nkwekọrịta okwu na nghọta nke mmekọrịta ibe-ya-ibe-ya bụrụ nke eke karịa.
  terminology: «Chineke», «okwukwe», «ịhụnanya», na «ụmụnna» dabara adaba n’ọrụ Ndị Kraịst na Standard Igbo. Ala peeji a na-echekwa ma ụdị nwoke nke ἀδελφοί ma ohere nghọta ọzọ nke πίστις n’enweghị ịmanye nkọwa okpukpe pụrụ iche.
  issues:
  - severity: medium
    issue: Nkọwa nke mmekọrịta εἰς ἀλλήλους adịghị edo anya nke ọma
    rationale: N’okwu «ịhụnanya onye ọ bụla n’ime unu nwere n’ebe ibe unu nọ», «ibe unu» nwere ike ịpụta ndị ibe unu n’ozuzu, ma ọ naghị ejikọta nke ọma na onye nke ọ bụla dịka isiokwu. «n’ebe ibe ya nọ» na-egosi n’Igbo na onye ọ bụla nwere ịhụnanya n’ebe onye ibe ya nọ, ma si otú a chekwaa echiche mmekọrịta nke Grik.
  - severity: low
    issue: Nkwusi ike dị na πάντων ὑμῶν kwesịrị ịdị n’ahịrị isi
    rationale: «onye ọ bụla n’ime unu» dị mma, ma «onye ọ bụla n’ime unu niile» na-egosipụta nke ọma nkwughachi na nkwusi ike nke ἑνὸς ἑκάστου πάντων ὑμῶν.
