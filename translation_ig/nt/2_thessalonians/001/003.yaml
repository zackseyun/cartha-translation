  to: anyị kwesịrị ịna-ekele Chineke mgbe niile n’ihi unu, ụmụnna[a], dị ka o kwesịrị ekwesị, n’ihi na okwukwe unu na-eto nke ukwuu[b], ịhụnanya onye ọ bụla n’ime unu niile nwere n’ebe ibe ya nọ na-abawanye[c].
