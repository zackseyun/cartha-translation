id: 2TH.1.3
reference: 2 Thessalonians 1:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εὐχαριστεῖν ὀφείλομεν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοί, καθὼς ἄξιόν ἐστιν, ὅτι ὑπεραυξάνει ἡ πίστις ὑμῶν καὶ πλεονάζει ἡ ἀγάπη ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/003.yaml
  text: We ought always to give thanks to God for you[a], brothers, as is fitting, because your faith is growing abundantly and the love of each and every one of you for one another is increasing[c][b],
translation:
  language: ig
  text: anyị kwesịrị ịna-ekele Chineke mgbe niile n’ihi unu, ụmụnna[a], dị ka o kwesịrị ekwesị, n’ihi na okwukwe unu na-eto nke ukwuu[b], ịhụnanya onye ọ bụla n’ime unu niile nwere n’ebe ibe ya nọ na-abawanye[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, ‘ụmụnne nwoke’; okwu Grik ahụ dị n’ụdị ọtụtụ nke nwoke, ma o nwere ike ịgụnye ndị nwoke na ndị nwaanyị niile nọ n’ọgbakọ ndị kwere ekwe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘ikwesị ntụkwasị obi unu na-eto nke ukwuu’; okwu Grik ahụ nwere ike ịpụta ‘okwukwe,’ ‘ntụkwasị obi,’ ma ọ bụ ‘ikwesị ntụkwasị obi.’
    reason: alternative_reading
  - marker: c
    text: N’ụzọ dị nso n’usoro Grik, ‘ịhụnanya nke onye ọ bụla n’ime unu niile n’ebe ibe ya nọ.’
    reason: previous_rendering
lexical_decisions:
- source_word: Εὐχαριστεῖν ὀφείλομεν
  choice: Anyị kwesịrị ịna-ekele
  rationale: Ngwakọta infinitive na ὀφείλομεν na-egosi ọrụ kwesịrị ekwesị, ọ bụghị naanị mmetụta ekele. ‘Kwesịrị ịna-ekele’ na-egosikwa omume na-aga n’ihu.
- source_word: τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: Chineke mgbe niile n’ihi unu
  rationale: N’usoro ekele a, περί ὑμῶν pụtara na ha bụ ihe kpatara ekele ahụ; ‘n’ihi unu’ bụ Igbo dị mfe ma kwekọọ na nke ahụ.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu nkwanye ùgwù a na-eji akpọ ndị otu okwukwe n’Igbo, ọ pụkwara ịgụnye ọgbakọ dum. Ihe okwu Grik ahụ pụtara n’ụdị nwoke ka e debere n’ala peeji.
- source_word: καθὼς ἄξιόν ἐστιν
  choice: dị ka o kwesịrị ekwesị
  rationale: Nke a na-egosi na inye ekele ahụ ziri ezi ma dabara adaba, na-enweghị ime ka ọ bụrụ okwu banyere iru eru mmadụ.
- source_word: ὑπεραυξάνει ἡ πίστις ὑμῶν
  choice: okwukwe unu na-eto nke ukwuu
  rationale: ‘Na-eto nke ukwuu’ na-echekwa ike dị na ngwaa ngwakọta ὑπεραυξάνει, ebe ‘okwukwe’ bụ ntụgharị nkịtị nke πίστις n’ebe a.
- source_word: πλεονάζει ἡ ἀγάπη
  choice: ịhụnanya ... na-abawanye
  rationale: ‘Na-abawanye’ na-egosipụta mmụba na-aga n’ihu nke πλεονάζει n’Igbo doro anya.
- source_word: ἑνὸς ἑκάστου πάντων ὑμῶν εἰς ἀλλήλους
  choice: onye ọ bụla n’ime unu nwere n’ebe ibe unu nọ
  rationale: Nke a bụ Igbo ebumpụta ụwa nke na-echekwa nkwusi ike na onye ọ bụla tinyere ntụgharị ịhụnanya ahụ n’ebe ibe ha nọ.
theological_decisions:
- issue: Ihe πίστις pụtara
  choice: okwukwe
  alternative: ịkwụsi ike n’ikwesị ntụkwasị obi; ntụkwasị obi
  rationale: N’ọnọdụ a, okwu ahụ yiri ka ọ na-ekwu maka okwukwe ndị Tesalonaịka na-eto. Ma ebe πίστις nwekwara ike ịpụta ntụkwasị obi ma ọ bụ ikwesị ntụkwasị obi, e debere nke ahụ n’ala peeji kama idozi nghọta ahụ kpamkpam.
- issue: Ịsụgharị ἀδελφοί mgbe a na-agwa ọgbakọ nwere nwoke na nwaanyị okwu
  choice: ụmụnna
  alternative: ụmụnne nwoke
  rationale: Ụdị Grik bụ ọtụtụ nke nwoke, ma a na-ejikarị ya akpọ ndị otu ọgbakọ dum. ‘Ụmụnna’ bụ okwu Igbo kwesịrị ekwesị nke na-arụ ọrụ dị ka okwu ịkpọ ndị otu obodo okwukwe, ebe ala peeji na-akọwa ụdị okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. ‘Ịna-ekele,’ ‘na-eto nke ukwuu,’ na ‘na-abawanye’ na-eme ka omume ndị a na-aga n’ihu pụta ìhè. E kweghị ka arọ nke usoro okwu Grik mebie ịdị ebumpụta ụwa nke ahịrịokwu Igbo, ma e chekwara nkwusi ike na onye ọ bụla site n’okwu ‘onye ọ bụla n’ime unu.’
