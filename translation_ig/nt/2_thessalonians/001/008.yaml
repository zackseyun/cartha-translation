review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the principal elements of the Greek: fiery revelation, judicial ἐκδίκησις, the two coordinated groups, the gospel, and the title ''our Lord Jesus.'' However, ''mgbe ọ na-abọ ọbọ'' introduces a temporal sense (''when'') not expressed by the participle διδόντος, which functions descriptively in the continuing sentence from the preceding verse.'
  naturalness: The register is clear, modern Standard Igbo, and 'ndị na-adịghị erubere ... isi' is natural. Removing 'mgbe' yields a smoother participial continuation. 'Ọkụ na-enwu enwu' is understandable and vivid, though 'ire ọkụ' more directly represents φλόξ ('flame').
  terminology: '''Ozi ọma,'' ''Onyenwe anyị Jizọs,'' and ''ịbọ ọbọ'' are appropriate. In this judicial context, ''ịbọ ọbọ'' retains the severity of ἐκδίκησις without requiring an interpretation beyond the text. A footnote should be anchored to that expression for the alternative judicial wording.'
  issues:
  - severity: medium
    issue: The word 'mgbe' ('when') adds an unexpressed temporal relationship.
    rationale: διδόντος is a participle modifying the revealed Lord in the preceding verse; it need not, and here should not, be recast with a temporal conjunction.
  - severity: low
    issue: The lexical alternative for διδόντος ἐκδίκησιν lacks an anchor and footnote.
    rationale: The English audit trail supplies a lexical alternative for this phrase. Including an anchored Igbo alternative improves auditability without changing the translation.
