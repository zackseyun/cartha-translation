source:
  edition: SBLGNT
  text: ἐν ⸂φλογὶ πυρός⸃, διδόντος ἐκδίκησιν τοῖς μὴ εἰδόσι θεὸν καὶ τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ τοῦ κυρίου ἡμῶν Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/008.yaml
  text: in flaming fire[a], inflicting vengeance on those who do not know God and on those who do not obey the gospel of our Lord Jesus[b],
translation:
  language: ig
  text: n’ime ọkụ na-enwu enwu[a], na-abọ ọbọ[b] n’ahụ ndị na-amaghị Chineke na ndị na-adịghị erubere ozi ọma nke Onyenwe anyị Jizọs isi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘n’ire ọkụ.’
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘na-eweta nkwụghachi ntaramahụhụ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φλογὶ πυρός
  choice: n’ime ọkụ na-enwu enwu
  rationale: Nke a na-ejigide onyinyo siri ike nke ire ọkụ ma na-ada ka Igbo nkịtị. Akụkụ a na-akọwa otú e si ekpughe Onyenwe anyị n’amaokwu bu ụzọ.
- source_word: διδόντος ἐκδίκησιν
  choice: mgbe ọ na-abọ ọbọ
  rationale: N’agbanyeghị na διδόντος pụtara n’ụzọ nkịtị ‘na-enye,’ njikọ ya na ἐκδίκησιν pụtara ime ma ọ bụ iweta ntaramahụhụ ikpe ziri ezi. ‘Ịbọ ọbọ’ na-ejigide ike okwu Grik ahụ n’ejighị ya mee ka ọ bụrụ iwe mmadụ na-ezighị ezi.
- source_word: τοῖς μὴ εἰδόσι θεὸν
  choice: ndị na-amaghị Chineke
  rationale: Ọ na-egosipụta ọnọdụ dị ugbu a nke ịmaghị Chineke ma na-ada n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: τοῖς μὴ ὑπακούουσιν
  choice: ndị na-adịghị erubere ... isi
  rationale: ‘Irubere ... isi’ na-egosipụta nrubeisi ma ọ bụ ịṅa ntị a na-achọ n’okwu ὑπακούω, n’etinyeghị echiche ọzọ na ha kpachaara anya jụ.
- source_word: τῷ εὐαγγελίῳ
  choice: ozi ọma
  rationale: ‘Ozi ọma’ bụ okwu Igbo doro anya ma kwụsie ike maka εὐαγγέλιον, karịsịa n’akwụkwọ Pọl.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: nke Onyenwe anyị Jizọs
  rationale: Ọ na-echekwa aha κύριος dị ka ‘Onyenwe’ na mmekọrịta genitivu nke ozi ọma ahụ na Onyenwe anyị Jizọs.
theological_decisions:
- issue: Ụdị ἐκδίκησις n’ikpe Chineke
  choice: ịbọ ọbọ
  alternative: iweta nkwụghachi ntaramahụhụ
  rationale: N’ebe a okwu ahụ bụ ntaramahụhụ ikpe ziri ezi nke Onyenwe ahụ e kpughere ekpughe na-eweta. ‘Ịbọ ọbọ’ na-echekwa ịdị arọ na esemokwu okpukpe dị n’ederede ahụ, kama ime ka ọ dị nro; ihe gbara ya gburugburu na-egosi na ọ bụ ikpe Chineke, ọ bụghị iwe mmehie nke mmadụ.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ọkụ na-enwu enwu’ mee ka onyinyo Grik doo anya; e jighị okwu ụka nke otu denominashọn kpọmkwem. Ihe odide ahụ na-aga n’ihu site n’amaokwu 7, ya mere ọ malitere n’obere mkpụrụedemede ma mechie na rikoma.
