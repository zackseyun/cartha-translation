revisions:
- from: Ndị a ga-akwụ ụgwọ ntaramahụhụ ha, ya bụ mbibi ebighị ebi[a], n'ebe ọnụnọ Onyenwe anyị na ebube nke ike ya dị anya,
  to: Ndị a ga-ata ntaramahụhụ, ya bụ, mbibi ebighị ebi[a], site n’ọnụnọ Onyenwe anyị na site n’ebube nke ike ya pụọ,
  rationale: The revision removes an unsupported possessive, uses an idiomatic Igbo expression for judicial punishment, and makes the double ἀπό phrase explicit without deciding between the separation and source/origin readings. The footnote preserves the grammatical ambiguity and remains doctrinally noncommittal.
