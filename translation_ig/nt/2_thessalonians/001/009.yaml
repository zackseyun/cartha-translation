  text: οἵτινες δίκην τίσουσιν ὄλεθρον αἰώνιον ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/009.yaml
  text: These will pay the penalty of eternal destruction[a], away from the presence of the Lord and from the glory of his might,
translation:
  language: ig
  text: Ndị a ga-ata ntaramahụhụ, ya bụ, mbibi ebighị ebi[a], site n’ọnụnọ Onyenwe anyị na site n’ebube nke ike ya pụọ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụzọ ọzọ e nwere ike isi sụgharịa ya bụ: “mbibi nke si n’ọnụnọ Onyenwe anyị na n’ebube nke ike ya bịa.” Mkpụrụokwu njikọ Grik ahụ nwere ike igosi nkewa (“site n’... pụọ”) ma ọ bụ isi mmalite (“nke si ... bịa”).'
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: Ndị a
  rationale: Ọ na-arụtụ aka n’azụ n’ebe ndị na-emegide ma na-akpagbu ndị kwere ekwe nọ; “Ndị a” na-enye njikọ ahụ n’Igbo n’enweghị ịgbakwụnye ihe ederede ekwughị.
- source_word: δίκην τίσουσιν
  choice: ga-akwụ ụgwọ ntaramahụhụ ha
  rationale: Nkebiokwu Grik a na-egosi ịnata ma ọ bụ ịkwụ ụgwọ ntaramahụhụ e kpebiri n’ikpe; nsụgharị a na-edobe echiche iwu ahụ ma bụrụkwa Igbo a na-aghọta nke ọma.
- source_word: ὄλεθρον
  choice: mbibi
  rationale: “Mbibi” na-egosi oke ọdachi na mmebi dị n’okwu ikpe a, ma ọ naghị ekpebi n’onwe ya kpọmkwem ụdị ntaramahụhụ ikpeazụ ahụ.
- source_word: αἰώνιον
  choice: ebighị ebi
  rationale: N’okwu gbasara ikpeazụ a, ọ na-egosi ịdịgide na njedebe nke ikpe ahụ; “ebighị ebi” bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwu ya.
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: n'ebe ọnụnọ Onyenwe anyị ... dị anya
  rationale: A ghọtara ἀπό ebe a dị ka nkewa ma ọ bụ ịchụpụ. πρόσωπον pụtara “ihu” n'ụzọ nkịtị, ma “ọnụnọ” bụ okwu Igbo kwesịrị ekwesị n’ebe a.
- source_word: καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ
  choice: na ebube nke ike ya
  rationale: “Ebube” na-edobe δόξα, “ike” na-egosikwa ἰσχύς; usoro a na-ahapụ njikọ genitive ahụ ka ọ bụrụ ebube nke bụ nke ike ya ma ọ bụ nke na-egosipụta ike ya.
theological_decisions:
- issue: Ihe ἀπό pụtara n’ihe gbasara ikpe ikpeazụ
  choice: 'Nkewa ma ọ bụ ịchụpụ: ịnọ n''ebe ọnụnọ Onyenwe anyị dị anya'
  alternative: 'Isi mmalite: mbibi nke si n’ọnụnọ Onyenwe anyị na ebube nke ike ya bịa'
  rationale: ἀπό nwere ike igosi nkewa ma ọ bụ isi ebe ihe si bịa. Isi ederede họọrọ nkewa dịka nghọta siri ike n’ọnọdụ a, ma e debere nghọta nke isi mmalite n’okpuru peeji ka e wee ghara iwepụ mgbagwoju anya dị n’asụsụ Grik.
- issue: Ihe “mbibi ebighị ebi” pụtara kpọmkwem
  choice: E debere ya dịka “mbibi ebighị ebi” n’enweghị ịkọwa usoro ntaramahụhụ ahụ
  alternative: Ịghọta ya dịka ikpochapụ kpamkpam, ma ọ bụ dịka ahụhụ a na-amata ruo mgbe ebighị ebi
  rationale: Nkebiokwu Grik ahụ na-ekwu ikpe a ga-akwụ, ma amaokwu a n’onwe ya anaghị edozi arụmụka niile gbasara ọdịdị ntaramahụhụ ikpeazụ. Ya mere, nsụgharị ahụ anaghị etinye ozizi otu ụka.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “Onyenwe anyị” maka κύριος. E tinyere akara [a] n’isi ederede kpọmkwem n’ebe nkọwa ọzọ metụtara.
