  yaml_path: translation/nt/2_thessalonians/001/006.yaml
  text: since it is just before God to repay affliction to those who afflict you[a]
translation:
  language: ig
  text: ebe ọ bụ na ọ bụ ihe ziri ezi n’anya Chineke ịkwụghachi ndị na-akpagbu unu mkpagbu[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụrụ n’ezie na ọ bụ ihe ziri ezi n’anya Chineke ịkwụghachi ndị na-akpagbu unu mkpagbu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: ebe ọ bụ na
  rationale: N’ọnọdụ a, okwu ahụ na-ewebata ihe Pọl na-ewere dị ka eziokwu iji mee ka arụmụka ya sie ike. ‘Ebe ọ bụ na’ na-egosi nke a n’Igbo nkịtị, ebe ndetu ala na-echekwa ohere ịgụ ya dị ka ọnọdụ.
- source_word: δίκαιον
  choice: ihe ziri ezi
  rationale: Nke a na-egosi ihe dabara n’ikpe ziri ezi nke Chineke. ‘Ihe ziri ezi’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ikpe na nkwụghachi ụgwọ.
- source_word: παρὰ θεῷ
  choice: n’anya Chineke
  rationale: Nkebiokwu a na-ekwu maka ihe dị ziri ezi dịka Chineke si ele ya ma ọ bụ dịka ikpe ya si dị. ‘N’anya Chineke’ na-ekwupụta echiche a n’Igbo eke.
- source_word: ἀνταποδοῦναι
  choice: ịkwụghachi
  rationale: Okwu a pụtara inyeghachi mmadụ ihe kwekọrọ n’ihe o mere. ‘Ịkwụghachi’ dabara n’echiche nke nkwụghachi ikpe n’enweghị itinye nkọwa gbasara oge ma ọ bụ ụzọ ikpe ahụ ga-esi mee.
- source_word: τοῖς θλίβουσιν ὑμᾶς
  choice: ndị na-akpagbu unu
  rationale: ‘Na-akpagbu’ na-egosi ime ka mmadụ taa ahụhụ ma ọ bụ ịnọgide na-amanye ya ike, ma dabara n’ọnọdụ mkpagbu ndị kwere ekwe.
- source_word: θλῖψιν
  choice: mkpagbu
  rationale: ‘Mkpagbu’ na-egosi ahụhụ ma ọ bụ nrụgide dị ukwuu, ma na-echekwa njikọ okwu dị n’etiti ‘na-akpagbu’ na ‘mkpagbu’ n’asụsụ Grik.
theological_decisions:
- issue: Ụdị na oge nkwụghachi ikpe Chineke
  choice: Amaokwu a na-ekwu n’ozuzu na Chineke ga-eji mkpagbu kwụghachi ndị na-akpagbu ndị kwere ekwe, ma ọ kọwaghị n’ebe a oge ma ọ bụ ụzọ nke ahụ ga-esi mee.
  alternative: Ịkọwa mkpagbu ahụ kpọmkwem dịka naanị ikpe ikpeazụ, ma ọ bụ dịka ma ikpe ndị na-eme ugbu a ma ikpe ikpeazụ.
  rationale: Asụsụ Grik na-emesi izi ezi nke nkwụghachi Chineke ike, ma nkebiokwu a n’onwe ya anaghị ekpebi oge na ụzọ niile nke ikpe ahụ. Ya mere, nsụgharị ahụ ahapụrụ okwu ahụ n’ozuzu ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E chekwara nkwugharị mgbọrọgwụ okwu n’etiti ‘na-akpagbu’ na ‘mkpagbu,’ dịka njikọ θλίβουσιν na θλῖψιν dị n’asụsụ Grik.
