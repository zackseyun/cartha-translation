  source_fidelity: Isi ederede ahụ na-ezigara amara na udo n’aka Chineke Nna na Onyenwe anyị Jizọs Kraịst. “Ka amara na udo … dịrị unu” na-egosipụta ngọzi a nke ọma. “Chineke Nna anyị” na-esoro nhọrọ audit Bekee, n’agbanyeghị na ἡμῶν (‘anyị’) adịghị na SBLGNT; ọ bụ mgbakwunye mmekọrịta e mere maka Igbo eke, ọ bụghị mgbanwe nke ozi bụ isi. “Onyenwe anyị” bụ aha nsọpụrụ Igbo a na-ahụkarị maka κύριος. “Jizọs, bụ́ Mezaya” na-edobe Χριστός dịka aha ọkwá karịa ime ya naanị aha ọzọ.
  naturalness: Ahịrịokwu a bụ Igbo Izugbe doro anya ma nwee ụda ngọzi akwụkwọ ozi kwesịrị ekwesị. Nhazi “Ka … dịrị unu” dị mma. Akara rịkọm ndị gbara “bụ́ Mezaya” gburugburu na-eme ka ọ pụta ìhè na Mezaya bụ aha ọkwá Jizọs.
  terminology: “Amara,” “udo,” “Chineke,” “Nna,” na “Onyenwe anyị” dabara na ndekọ nsọpụrụ na okwu Ndị Kraịst nke Igbo. “Mezaya” bụ nhọrọ kwesịrị ekwesị maka ihe Χριστός pụtara. Otú ọ dị, “Kraịst” abụghị n’ezie ntụgharị pụtara ihe nke Χριστός kama ọ bụ ụdị aha e si na Grik bata n’Igbo; ya mere, a ga-edozi nkọwa ala peeji ka ọ ghara ikwu na e “sụgharị” χριστός dịka “Kraịst.”
