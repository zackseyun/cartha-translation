  yaml_path: translation/nt/2_thessalonians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ig
  text: Ka amara na udo si n’aka Chineke Nna anyị na Onyenwe anyị Jizọs, bụ́ Mezaya, dịrị unu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa χάρις; ọ na-echekwa ma ụdị ekele Pọl ji ede akwụkwọ ma echiche miri emi banyere ihu ọma Chineke.
- source_word: ὑμῖν
  choice: dịrị unu
  rationale: N’usoro ngọzi Igbo, “dịrị unu” na-ekwupụta dative ahụ n’ụzọ e ji asụ Igbo nke ọma.
- source_word: εἰρήνη
  choice: udo
  rationale: “Udo” bụ ntụgharị doro anya nke εἰρήνη, ọ pụkwara ịgụnye ịdị mma na izu oke nke ndụ.
- source_word: ἀπὸ
  choice: si n’aka
  rationale: “Si n’aka” na-egosi ebe ngọzi ahụ sitere n’ụzọ dị mfe ma bụrụkwa Igbo eke.
- source_word: θεοῦ πατρὸς
  choice: Chineke Nna anyị
  rationale: Ọ bụ ezie na ἡμῶν adịghị n’ederede SBLGNT a, “Nna anyị” na-eme ka aha mmekọrịta ahụ bụrụ Igbo eke ma kwekọọ n’usoro ekele Pọl a maara nke ọma.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: “Onyenwe anyị” na-echekwa κύριος dị ka aha nsọpụrụ e nyere Jizọs, ọ bụkwa okwu a nabatara nke ọma n’Igbo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ́ Mezaya
  rationale: “Mezaya” na-eme ka Χριστός pụta ìhè dị ka aha ọkwá nke pụtara Onye E Tere Mmanụ, kama ime ya naanị aha ọzọ.
theological_decisions:
- issue: Ịtinye “anyị” n’akụkụ “Nna” mgbe ἡμῶν na-adịghị n’ederede Grik e bipụtara
  choice: Chineke Nna anyị
  alternative: Chineke Nna
  rationale: Igbo chọrọ ka mmekọrịta a doo anya n’usoro ahịrịokwu a; “Nna anyị” na-enye echiche ahụ n’ụzọ eke ma kwekọọ n’usoro ekele Pọl, na-enweghị ịgbakwụnye nkwenkwe ọhụrụ.
- issue: Otú e si akọwa Χριστός
  choice: Mezaya
  alternative: Kraịst
  rationale: “Mezaya” na-echekwa ihe aha ọkwá Grik ahụ pụtara; e tinyere “Kraịst” na nkọwa ala peeji dịka ụdị a maara nke ọma.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. Usoro “Ka … dịrị unu” na-eme ka ngọzi akwụkwọ ozi ahụ daa nke ọma n’Igbo, ebe “bụ́ Mezaya” na-egosi na Mezaya bụ aha ọkwá.
