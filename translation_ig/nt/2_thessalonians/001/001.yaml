source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God our Father and the Lord Jesus the Messiah:'
translation:
  language: ig
  text: 'Pọl, Silvanọs na Timoti, degara ọgbakọ ndị Tesalonaịka dị na Chineke Nna anyị na Onyenwe Jizọs Mesaya:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: Pọl
  rationale: Ụdị aha Παῦλος a na-ejikarị eme ihe n'Igbo.
- source_word: Σιλουανὸς
  choice: Silvanọs
  rationale: A sụgharịrị kpọmkwem aha dị n'ihe odide Grik kama iji ụdị aha dị mkpụmkpụ, bụ́ Saịlas.
- source_word: Τιμόθεος
  choice: Timoti
  rationale: Ụdị aha Τιμόθεος a na-ejikarị eme ihe n'Igbo.
- source_word: ἐκκλησίᾳ
  choice: ọgbakọ
  rationale: N'ebe a, okwu ahụ na-ezo aka n'ìgwè ndị kwere ekwe, ọ bụghị ụlọ ha na-ezukọ na ya.
- source_word: Θεσσαλονικέων
  choice: ndị Tesalonaịka
  rationale: Echekwara ntụaka Grik ahụ na-ezo aka ná ndị obodo ahụ, kama ịgbanwe ya ka ọ bụrụ naanị ebe ha nọ.
- source_word: ἐν
  choice: nke dị n’ime
  rationale: Nke a na-echekwa okwu Pọl banyere ịdị n'ime Chineke na Onyenwe anyị, n'agbanyeghị na mmekọrịta ahụ nwere ike ịgụnye njikọ, ntọala, ma ọ bụ ebe ndụ ime mmụọ dị.
- source_word: θεῷ πατρὶ ἡμῶν
  choice: Chineke Nna anyị
  rationale: Nke a na-echekwa nnọchiaha ἡμῶν, 'anyị,' ma na-ada nke ọma n'Igbo.
- source_word: κυρίῳ
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị aha-ọrụ κύριος a na-ejikarị eme ihe mgbe ọ na-ezo aka na Jizọs.
- source_word: Ἰησοῦ Χριστῷ
  choice: Jizọs, bụ́ Mesaya
  rationale: A translitere aha Jizọs ma sụgharịa Χριστός dị ka aha-ọrụ 'Mesaya,' n'ụzọ doro anya ma dịkwa mma n'Igbo.
theological_decisions:
- issue: Nsụgharị Χριστῷ n'usoro aha na aha-ọrụ Ἰησοῦ Χριστῷ
  choice: Mesaya
  alternative: Kraịst
  rationale: Χριστός bụ aha-ọrụ nke pụtara onye e tere mmanụ; 'Mesaya' na-eme ka ọrụ aha ahụ pụta ìhè, ebe 'Kraịst' bụ ụdị ọdịnala a translitere.
- issue: Mmekọrịta ἐν θεῷ πατρὶ ἡμῶν καὶ κυρίῳ Ἰησοῦ Χριστῷ na-egosi
  choice: nke dị n’ime Chineke Nna anyị na Onyenwe anyị Jizọs, bụ́ Mesaya
  alternative: nke bụ nke Chineke Nna anyị na Onyenwe anyị Jizọs, bụ́ Mesaya
  rationale: A hapụrụ echiche 'n'ime' ka ọ nọgide buru nghọta sara mbara nke njikọ, ebe ndụ, ma ọ bụ ntọala, kama ịkọwa ya nanị dị ka inwe mmadụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘na-edegara ... akwụkwọ ozi a’ mee ka usoro ekele akwụkwọ ozi Grik bụrụ nke okike n'Igbo, na-etinyeghị echiche ọhụrụ n'ime ya. E ji ‘ọgbakọ’ zere mgbagwoju anya nke ‘ụka’ nwere ike ịpụta ụlọ ma ọ bụ òtù okpukpe.
