review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse’s contrast, the literal ‘bread,’ strenuous work, continual time expression, and purpose of avoiding burden. However, placement of n’efu after ‘achịcha onye ọ bụla’ can be read less clearly than the Greek’s ‘from anyone free of charge,’ and the final idiom needs a more natural construction.
  naturalness: ‘Ka anyị ghara ịbụ onye ọ bụla n’ime unu ibu arọ’ is not idiomatic Standard Igbo word order. ‘Ka anyị ghara ịbụ ibu arọ nye onye ọ bụla n’ime unu’ is natural and retains the distributive sense. ‘Abalị na ehihie’ also follows the Greek order and is a common Igbo expression.
  terminology: ‘Achịcha,’ ‘ndọgbu na ihe isi ike,’ and ‘ibu arọ’ appropriately convey the concrete and economic/support-related language without overinterpreting it.
  issues:
  - severity: medium
    issue: Ambiguous placement of n’efu
    rationale: In ‘anyị erighịkwa achịcha onye ọ bụla n’efu,’ n’efu may attach awkwardly to the preceding noun phrase. Moving it before ‘n’aka onye ọ bụla’ clearly expresses receiving bread from no one without payment.
  - severity: medium
    issue: Unnatural final predicate
    rationale: ‘Ịbụ onye ọ bụla n’ime unu ibu arọ’ lacks the natural dative linker. ‘Ịbụ ibu arọ nye onye ọ bụla n’ime unu’ is idiomatic and accurately renders ἐπιβαρῆσαί τινα ὑμῶν.
  - severity: low
    issue: Footnote alternative is syntactically unclear
    rationale: ‘anyị erighị achịcha onye ọ bụla n’akwụghị ụgwọ’ can imply that the person, rather than the speakers, did not pay. Recasting it explicitly preserves the lexical alternative.
  revised_text: anyị erighịkwa achịcha n’efu n’aka onye ọ bụla[a]; kama, anyị ji ndọgbu na ihe isi ike na-arụ ọrụ abalị na ehihie, ka anyị ghara ịbụ ibu arọ nye onye ọ bụla n’ime unu.
