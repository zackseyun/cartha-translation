source:
  edition: SBLGNT
  text: οὐδὲ δωρεὰν ἄρτον ἐφάγομεν παρά τινος, ἀλλ’ ἐν κόπῳ καὶ μόχθῳ ⸂νυκτὸς καὶ ἡμέρας⸃ ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/008.yaml
  text: nor did we eat bread from anyone free of charge[a], but with labor and hardship, working night and day so as not to burden any of you.
translation:
  language: ig
  text: anyị erighịkwa achịcha n’efu n’aka onye ọ bụla[a]; kama, anyị ji ndọgbu na ihe isi ike na-arụ ọrụ abalị na ehihie, ka anyị ghara ịbụ ibu arọ nye onye ọ bụla n’ime unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anyị erighị achịcha n’aka onye ọ bụla na-enweghị ịkwụ ụgwọ.” Okwu Grik ahụ kwuru “achịcha” kpọmkwem, ọ bụ ezie na ọ pụrụ izo aka n’ihe oriri ma ọ bụ nkwado ihe onwunwe n’ozuzu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: δωρεὰν
  choice: n’efu
  rationale: Nke a na-egosi ịnara ihe n’akwụghị ụgwọ; “n’efu” bụ okwu Igbo dị mfe ma kwekọọ n’echiche akụ na ụba dị n’ọnọdụ a.
- source_word: ἄρτον
  choice: achịcha
  rationale: Ọ pụtara achịcha n’ụzọ nkịtị, ọ bụ ezie na ọ nwekwara ike ịnọchi anya nri ma ọ bụ nkwado ihe onwunwe n’ozuzu ya; idebe “achịcha” na-echekwa ihe oyiyi nke Grik.
- source_word: παρά τινος
  choice: onye ọ bụla
  rationale: παρά tinyere genitive na-egosi ebe ihe si, ebe τις bụ onye a na-akọwaghị; n’usoro Igbo a, “anyị erighị achịcha onye ọ bụla” na-egosi na ha anabataghị ya n’aka onye ọ bụla.
- source_word: ἐν κόπῳ καὶ μόχθῳ
  choice: ji ndọgbu na ihe isi ike
  rationale: Okwu abụọ ahụ na-emesi ike ọrụ na-agwụ ike na nsogbu so ya; nsụgharị a na-echekwa ike nkwupụta ahụ n’Igbo a na-aghọta ngwa ngwa.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: ehihie na abalị
  rationale: Ọ bụ akpaala okwu oge na-egosi ịrụsi ọrụ ike mgbe niile. “Ehihie na abalị” bụ usoro okwu Igbo ebumpụta ụwa.
- source_word: ἐργαζόμενοι
  choice: na-arụ ọrụ
  rationale: Participle a na-akọwa ihe Pọl na ndị ya na ha so mere iji kwado onwe ha; “na-arụ ọrụ” doro anya ma kwekọọ n’ọnọdụ a.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: ka anyị ghara ịbụ ... ibu arọ
  rationale: Ihe owuwu a na-egosi nzube, ebe ngwaa ahụ na-ekwu maka ibokwasị mmadụ ibu nke nkwado ego ma ọ bụ ihe onwunwe.
- source_word: τινα ὑμῶν
  choice: onye ọ bụla n’ime unu
  rationale: 'Nke a na-echekwa nghọta nkesa nke singular indefinite tinyere genitive pronoun: ọ dịghị otu onye n’ime ha.'
- source_word: οὐδὲ ... ἀλλ’
  choice: anyị erighịkwa ... kama
  rationale: “kwa” jikọtara nkwupụta a na ihe bu ya ụzọ, ebe “kama” na-echekwa ọdịiche siri ike dị n’etiti ịnara nkwado n’efu na ịrụsi ọrụ ike.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere “achịcha” dịka ihe oyiyi nkịtị nke Grik, ma jiri ndetu ala kọwaa nghọta sara mbara ya. Ahịrịokwu ahụ na-echekwa njikọ na amaokwu bu ya ụzọ site na “kwa” na ọdịiche οὐδὲ ... ἀλλ’ site na “kama.”
