  text: καὶ μὴ ὡς ἐχθρὸν ἡγεῖσθε, ἀλλὰ νουθετεῖτε ὡς ἀδελφόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/015.yaml
  text: And do not regard him as an enemy[b][a], but admonish him as a brother.
translation:
  language: ig
  text: Unu ewerekwala ya dị ka onye iro[a], kama dụọnụ ya ọdụ dị ka nwanne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu echekwala na ọ bụ onye iro.”
    reason: lexical_alternative
  - marker: b
    text: “Nwanne” n’ebe a pụtara onye otu okwukwe; okwu ahụ pụrụ ịnọchite anya nwoke ma ọ bụ nwaanyị so n’ọgbakọ Ndị Kraịst.
    reason: cultural_note
lexical_decisions:
- source_word: ἡγεῖσθε
  choice: ewerekwala ya dị ka
  rationale: Okwu a na-egosi ile mmadụ anya ma ọ bụ ịgụ ya n’otu ọnọdụ. “Ewere ya dị ka” bụ ụzọ Igbo doro anya si kwuo echiche a.
- source_word: ἐχθρόν
  choice: onye iro
  rationale: Nke a na-edobe kpọmkwem echiche onye a na-ele anya dị ka onye iro, n’etinyeghị nkọwa ọzọ na-adịghị n’isi mmalite.
- source_word: νουθετεῖτε
  choice: dụọ ya ọdụ
  rationale: “Ịdụ mmadụ ọdụ” na-ejikọta ịkụziri ya ihe, ịdọ ya aka ná ntị, na imezi ya; ya mere, ọ na-echekwa ike mgbazi na nlekọta dị n’okwu Grik.
- source_word: ἀδελφόν
  choice: nwanne
  rationale: “Nwanne” bụ okwu Igbo sitere n’okike maka onye e jikọrọ mmadụ na ya dịka onye ezinụlọ, ma n’ebe a ọ na-arụtụ aka n’onye otu okwukwe. Ọ naghị amanye ụdị nwoke ma ọ bụ nwaanyị n’Igbo.
- source_word: ὡς
  choice: dị ka
  rationale: N’ebe abụọ ọ pụtara, okwu a na-egosi ọnọdụ ma ọ bụ ụzọ e si ele onye ahụ anya ma na-emeso ya.
- source_word: καὶ μὴ ... ἀλλὰ
  choice: Unu ewerekwala ... kama ...
  rationale: Nhazi a na-echekwa iwu jụrụ ihe na ọdịiche siri ike nke “ọ bụghị ... kama ...,” ma gosikwa na iwu ahụ bụ maka ọtụtụ ndị.
theological_decisions:
- issue: Ụzọ a ga-esi mesoo onye kwere ekwe na-adịghị erube isi n’oge ịdọ aka ná ntị
  choice: E kwesịghị ịgụ onye ahụ dịka onye iro; a ga na-agbazi ya dịka nwanne nọgidekwara n’ime obodo ndị kwere ekwe.
  alternative: A pụrụ ịghọta amaokwu ahụ dịka ndụmọdụ gbasara esemokwu mmadụ na ibe ya n’ozuzu, na-abụghị kpọmkwem ịdọ aka ná ntị n’ime nzukọ ndị kwere ekwe.
  rationale: Ihe gbara amaokwu ahụ gburugburu na 2 Ndị Tesalonaịka 3:14–15 bụ ịdọ onye na-adịghị erube isi aka ná ntị n’ime obodo ndị kwere ekwe. “Nwanne” na-echekwa mmekọrịta ahụ n’agbanyeghị mgbazi a na-eme ya.
translation_notes:
  register: Asụsụ Igbo Izugbe dị mfe, dị ugwu, ma kwekọọ n’otú ndị mmadụ si ekwu taa. E ji “unu” gosipụta na ngwaa Grik abụọ ahụ bụ iwu e nyere ọtụtụ mmadụ; e jikwa “nwanne” chekwaa ihe atụ ezinụlọ nke isi mmalite.
