review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the two contrasting imperatives: the person must not be regarded as an enemy (μὴ ὡς ἐχθρὸν ἡγεῖσθε) but must be given corrective counsel as a brother (ἀλλὰ νουθετεῖτε ὡς ἀδελφόν). “Onye iro,” “dị ka,” and “nwanne” are faithful and appropriate. “Dụọ mmadụ ọdụ” suitably expresses corrective, pastoral admonition in this context.'
  naturalness: 'The wording is clear Standard Igbo overall. However, because the addressees are plural, the affirmative imperative should carry the plural imperative ending: “dụọnụ,” not “dụọ.”'
  terminology: “Nwanne” naturally preserves the Greek familial/community term without imposing a sex-specific interpretation that Igbo does not require. The explanatory note should use the clearer and more idiomatic “onye otu okwukwe” and “ọgbakọ Ndị Kraịst.”
  issues:
  - severity: medium
    issue: The second imperative lacks the plural addressee suffix.
    rationale: νουθετεῖτε is a second-person plural imperative, matching “Unu” and the plural negative imperative “ewerekwala.” Standard Igbo should read “dụọnụ ya ọdụ.”
  - severity: low
    issue: Footnote b’s community explanation is slightly awkward and has an unclear antecedent in “onye ha na ya kwekọrọ n’okwukwe.”
    rationale: “Onye otu okwukwe” directly and naturally identifies the intended fellow-believer sense; “ọgbakọ Ndị Kraịst” is clearer than “obodo ndị Kraịst” for the Christian community.
