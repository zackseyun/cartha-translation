id: 2TH.3.16
reference: 2 Thessalonians 3:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος τῆς εἰρήνης δῴη ὑμῖν τὴν εἰρήνην διὰ παντὸς ἐν παντὶ τρόπῳ. ὁ κύριος μετὰ πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/016.yaml
  text: May the Lord of peace himself give you peace at all times in every way[b][a]. The Lord be with all of you.
translation:
  language: ig
  text: Ka Onyenweanyị nke udo n’onwe ya nye unu udo mgbe niile[a] n’ụzọ ọ bụla[b]. Ka Onyenweanyị nọnyere unu niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “n’oge niile.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “n’ụzọ niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: n’onwe ya
  rationale: N’ebe a αὐτός na-emesi onye na-eme ihe ike; “n’onwe ya” na-egosi na ọ bụ Onyenweanyị n’onwe ya ka a na-arịọ ka o nye ha udo.
- source_word: δὲ
  choice: (egosighị ya iche n’Igbo)
  rationale: δὲ bụ njikọ dị nro nke na-ebute ngọzi mmechi. Ịtinye “ma” ga-adị ka e nwere esemokwu siri ike, ebe “ugbu a” ga-etinye echiche oge nke okwu Grik ahụ na-adịghị akpọpụta; mmalite “Ka…” na-arụ ọrụ mgbanwe ahụ nke ọma n’Igbo.
- source_word: κύριος
  choice: Onyenweanyị
  rationale: Nke a bụ nsụgharị Igbo a na-ahụkarị ma dị ùgwù maka κύριος dị ka aha nsọ “Onyenweanyị.”
- source_word: τῆς εἰρήνης
  choice: nke udo
  rationale: Ọ na-edobe njikọ genitiv ahụ n’ụdị aha “Onyenweanyị nke udo” n’enweghị ịgbasa ya ka ọ bụrụ nkọwa dịka “onye na-enye udo.”
- source_word: δῴη
  choice: Ka … nye
  rationale: Usoro “Ka … nye” na-egosi ọchịchọ ma ọ bụ ekpere ngọzi, kwekọrọ n’optative aorist nke Grik.
- source_word: τὴν εἰρήνην
  choice: udo
  rationale: “Nye unu udo” bụ Igbo ebumpụta ụwa ma na-ebute ihe okwu Grik pụtara n’enweghị ịmanye article Grik n’ụdị na-adịghị mkpa.
- source_word: διὰ παντὸς
  choice: mgbe niile
  rationale: Ọ na-egosi na udo ahụ ga-adị n’oge niile ma na-asụkwa nke ọma n’Igbo nke oge a.
- source_word: ἐν παντὶ τρόπῳ
  choice: n’ụzọ ọ bụla
  rationale: τρόπος na-ezo aka n’ụzọ ma ọ bụ ụdị omume; “n’ụzọ ọ bụla” na-edobe obosara okwu ahụ n’enweghị ịkọwa kpọmkwem ụzọ ndị ahụ.
- source_word: μετὰ πάντων ὑμῶν
  choice: nọnyere unu niile
  rationale: Ọ na-edobe echiche nke ịnọnyere mmadụ na mkpokọta πάντων—ọ dịghị onye n’ime ha a hapụrụ.
theological_decisions:
- issue: Onye “Onyenweanyị” na-ezo aka n’ebe a
  choice: E debere naanị “Onyenweanyị,” dịka ederede Grik si kwuo.
  alternative: Ịsụgharị ya “Onyenweanyị Jizọs” ma ọ bụ ịkọwa ya n’ozuzu dịka Chineke.
  rationale: N’akwụkwọ Pọl, o yikarịrị ka aha a na-ezo aka n’Onyenweanyị Jizọs, ma amaokwu a n’onwe ya ekwughị “Jizọs.” Nsụgharị ahụ ekwesịghị ịgbakwunye ihe ederede na-akpọpụtaghị.
- issue: Ike okwu ikpeazụ ὁ κύριος μετὰ πάντων ὑμῶν
  choice: Ka Onyenweanyị nọnyere unu niile.
  alternative: Onyenweanyị nọnyere unu niile.
  rationale: Ọ bụ ezie na Grik enweghị ngwaa e dere ede n’ahịrịokwu ikpeazụ, ọnọdụ ya bụ nke ngọzi ma ọ bụ ọchịchọ, ọ bụghị nanị nkwupụta ihe dị adị. “Ka” na-egosipụta nke ahụ n’Igbo.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Onyenweanyị” na “Ka … nye/nọnyere” dabara n’asụsụ ngọzi nke Ndị Kraịst ma ghara itinye nkọwa otu ụka ọ bụla. E debere akara ndetu ala ala [a] na [b] ozugbo n’akụkụ okwu ha na-akọwa.
