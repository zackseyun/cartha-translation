source:
  edition: SBLGNT
  text: Τὸ λοιπὸν προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/001.yaml
  text: Finally[a], brothers, pray for us, that the word of the Lord may spread rapidly and be honored, just as it was among you[b],
translation:
  language: ig
  text: N’ikpeazụ[a], ụmụnna, na-ekperenụ anyị ekpere, ka okwu Onyenwe anyị gbasaa ngwa ngwa, ka e nyekwa ya otuto, dị nnọọ ka o mere n’etiti unu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “N’ihe fọdụrụ.”
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ nkịtị: “ka okwu Onyenwe anyị gbaa ọsọ, ka e nyekwa ya otuto, dị nnọọ ka o mere n’etiti unu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπὸν
  choice: N’ikpeazụ
  rationale: Ọ bụ akara okwu e ji abanye n’akụkụ ikpeazụ nke akwụkwọ ozi; “N’ikpeazụ” bụ Igbo doro anya ma kwekọọ n’ọrụ ya ebe a.
- source_word: προσεύχεσθε
  choice: na-ekperenụ ... ekpere
  rationale: Iwu dị n’ụdị ugbu a na-arịọ ka ha nọgide na-ekpe ekpere; usoro Igbo a na-egosi arịrịọ na-aga n’ihu n’ụzọ sitere n’okike.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo a na-eji akpọkọta ndị otu obodo ma ọ bụ ọgbakọ, ma ọ naghị amanye ịkọwa na ọ bụ naanị ụmụ nwoke.
- source_word: περὶ ἡμῶν
  choice: anyị ekpere
  rationale: N’usoro okwu Igbo “na-ekperenụ anyị ekpere,” nke a pụtara n’ụzọ doro anya ‘kpeerenụ anyị ekpere.’
- source_word: ὁ λόγος τοῦ κυρίου
  choice: okwu Onyenwe anyị
  rationale: Nke a na-edobe okwu Akwụkwọ Nsọ “okwu” ma na-egosi ozi nke sitere n’aka Onyenwe anyị ma ọ bụ nke gbasara ya.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a nabatara nke κύριος n’aha nsọpụrụ a.
- source_word: τρέχῃ
  choice: gbasaa ngwa ngwa
  rationale: Ọ bụ ezie na ngwaa Grik pụtara ‘gba ọsọ’ n’ụzọ nkịtị, ebe a ọ bụ ihe atụ maka mgbasa ozi ahụ n’ọsọ; nsụgharị a na-eme ka uche ahụ doo onye Igbo anya.
- source_word: δοξάζηται
  choice: ka a na-asọpụkwa ya
  rationale: N’ebe ọ na-ezo aka n’okwu Onyenwe anyị, nke a na-egosi na ndị mmadụ na-anabata ya ma na-enye ya nsọpụrụ kwesịrị ya; ụdị passive ahụ ka edobere.
- source_word: καθὼς καὶ πρὸς ὑμᾶς
  choice: dị nnọọ ka o mere n’etiti unu
  rationale: A gbakwụnyere ‘o mere’ dịka ngwaa a ghọtara n’ahịrị Grik, iji mee ka Igbo bụrụ nke zuru oke ma gosipụta ahụmahụ ndị Tesalonaịka.
theological_decisions:
- issue: Otu e si sụgharị ἀδελφοί mgbe a na-akpọ ọgbakọ
  choice: ụmụnna
  alternative: ụmụnne nwoke
  rationale: “Ụmụnna” na Standard Igbo nwere ike ịkpọ ọgbakọ dum n’ụzọ nnọchite anya, ma ọ ka na-edobe ụdị okwu mmekọrịta ezinụlọ nke Grik n’enweghị ịgbakwunye nkọwa okpukpe pụrụ iche.
- issue: Ihe atụ τρέχῃ banyere ọganihu ozi ọma
  choice: gbasaa ngwa ngwa
  alternative: gba ọsọ
  rationale: Optimal equivalence na-akwado ikwupụta uche ihe atụ ahụ n’Igbo doro anya. Ihe a na-arịọ bụ ka okwu Onyenwe anyị gaa n’ihu ọsọ ọsọ, ọ bụghị ịgba ọsọ n’ụzọ nkịtị.
- issue: Uche passive δοξάζηται mgbe isiokwu ya bụ okwu Onyenwe anyị
  choice: ka a na-asọpụkwa ya
  alternative: ka e nyekwa ya otuto
  rationale: Nhọrọ a na-edobe na okwu ahụ bụ ihe ndị mmadụ na-akwanyere ùgwù ma na-anabata, n’enweghị ikwubi ụzọ kpọmkwem nsọpụrụ ahụ si apụta.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere nsọpụrụ ma dị mfe nghọta. E ji “ụmụnna” mee okwu ọgbakọ n’ụzọ Igbo sitere n’okike. E debere akara edemede ikpeazụ dịka kọma n’ihi na amaokwu ahụ na-aga n’ihu n’amaokwu 2.
