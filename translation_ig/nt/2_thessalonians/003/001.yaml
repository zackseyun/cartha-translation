revisions:
- from: N’ikpeazụ[a], ụmụnna, na-ekperenụ anyị ekpere, ka okwu Onyenwe anyị gbasaa ngwa ngwa, ka a na-asọpụkwa ya, dị nnọọ ka o mere n’etiti unu[b],
  to: N’ikpeazụ[a], ụmụnna, na-ekperenụ anyị ekpere, ka okwu Onyenwe anyị gbasaa ngwa ngwa, ka e nyekwa ya otuto, dị nnọọ ka o mere n’etiti unu[b],
  rationale: The revision corrects the mistranslation of δοξάζηται while retaining the draft’s sound optimal-equivalence rendering of τρέχῃ as “gbasaa ngwa ngwa.” The adjusted footnotes provide valid lexical alternatives and preserve the source’s comparison with the Thessalonians’ experience.
  reviewer_model: gpt-5.6-terra
