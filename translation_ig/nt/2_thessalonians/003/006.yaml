id: 2TH.3.6
reference: 2 Thessalonians 3:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ Χριστοῦ στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν ⸀παρελάβοσαν παρ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/006.yaml
  text: We command you[a], brothers, in the name of our Lord Jesus the Messiah[e][d][c][b], to keep away from every brother who is walking disorderly and not according to the tradition that they received from us.
translation:
  language: ig
  text: Ma, ụmụnna[a], anyị na-enye unu iwu n'aha Onyenwe anyị Jizọs Kraịst[b], ka unu kewapụ onwe unu n'ebe nwanna ọ bụla na-ebi ndụ n'enweghị usoro[c] nọ, onye na-adịghị ebi ndụ dịka ozizi ahụ ha natara n'aka anyị.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụmụnna” sụgharịrị okwu Grik nke dị n'ụdị ọtụtụ nke nwoke; Pọl na-agwa ọgbakọ niile okwu.
    reason: lexical_alternative
  - marker: b
    text: “Kraịst” pụtara “Mesaya,” ya bụ, Onye e tere mmanụ.
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsụgharị ya, “onye na-eje ije n'enweghị usoro.” “Ije ije” bụ ihe atụ maka ụzọ mmadụ si ebi ndụ.
    reason: lexical_alternative
  - marker: d
    text: Ụfọdụ akwụkwọ aka ochie nwere “nke unu natara n'aka anyị” ma ọ bụ “nke ọ natara n'aka anyị.” Ihe odide a gbasoro ebe a nwere “nke ha natara n'aka anyị.”
    reason: textual_variant
lexical_decisions:
- source_word: Παραγγέλλομεν
  choice: anyị na-enye unu iwu
  rationale: Nke a na-egosipụta ntụziaka nwere ikike karịa naanị arịrịọ ma ọ bụ ndụmọdụ.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo sitere n'okike e ji akpọ ndị otu okwukwe ọnụ; ọ nwere ike ịgụnye ndị nwoke na ndị nwanyị n'agbanyeghị na Grik bụ ụdị ọtụtụ nke nwoke.
- source_word: ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: n'aha Onyenwe anyị Jizọs Kraịst
  rationale: Ọ na-edobe akpaalaokwu na ịdị nsọ nke okwu Grik; “Kraịst” bụ aha-utu a maara nke ọma n'Igbo maka Μεσσίας/Χριστός.
- source_word: στέλλεσθαι ὑμᾶς ἀπὸ
  choice: ka unu zere iso
  rationale: Ọ na-egosi ịdọrọ onwe onye azụ n'iso onye ahụ akpachi anya, na-emeghị ka okwu ahụ bụrụ iwu ịchụpụ mmadụ n'ọgbakọ.
- source_word: ἀτάκτως περιπατοῦντος
  choice: nke na-ebi ndụ aghara aghara
  rationale: “Ibi ndụ” na-ebupụta ihe atụ Grik nke ‘ije ije’ n'ụzọ doro anya n'Igbo, ebe “aghara aghara” na-edobe obosara ihe ἀτάκτως pụtara karịa ịkọwa ya naanị dị ka ịdị umengwụ.
- source_word: παράδοσιν
  choice: ozizi e nyefere
  rationale: Nke a na-egosipụta ihe e nyefere ndị ọzọ, ma na-ezere nghọtahie nwere ike isi n'iji naanị okwu “omenala” pụta n'Igbo.
- source_word: ἣν παρελάβοσαν παρ’ ἡμῶν
  choice: e nyefere ha n'aka anyị
  rationale: Ọ na-agbaso ọgụgụ SBLGNT nke ji onye nke atọ ọtụtụ (“ha”), ma na-edobe ntakịrị nghọta siri ike dị na syntax ahụ.
theological_decisions:
- issue: Nsụgharị Χριστοῦ dị ka aha-utu Mesaya
  choice: Kraịst
  alternative: Mesaya
  rationale: N'Igbo Baịbụl na okwu Ndị Kraịst nke oge a, “Kraịst” bụ aha-utu sitere na Χριστός a na-aghọta nke ọma. Ihe odide ala peeji na-eme ka o doo anya na ọ pụtara Mesaya, ya mere a naghị atụfu ọrụ ya dị ka aha-utu.
- issue: Ókè nkewapụ nke στέλλεσθαι ὑμᾶς ἀπὸ nyere n'iwu
  choice: zere iso
  alternative: dọpụ onwe unu n'ebe ... nọ
  rationale: Nhọrọ a na-edobe ike ịdọ aka ná ntị na ịkwụsị mkpakọrịta chiri anya, ma ọ naghị ebubata echiche teknịkal nke ịchụpụ onye ahụ n'ọgbakọ.
translation_notes:
  register: Igbo ọkọlọtọ, nke ugwu dịrị ma dịkwa mfe nghọta. E ji “ụmụnna” mee ka okwu ezinụlọ nke ọgbakọ dịgide; e ji “ozizi e nyefere” kama “omenala” mee ka παράδοσις doo anya n'ọnọdụ a. Akara ihe odide ala peeji niile dị n'ahịrị isi.
