source:
  edition: SBLGNT
  text: Εἰ δέ τις οὐχ ὑπακούει τῷ λόγῳ ἡμῶν διὰ τῆς ἐπιστολῆς, τοῦτον σημειοῦσθε, ⸀μὴ ⸀συναναμίγνυσθαι αὐτῷ, ἵνα ἐντραπῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/014.yaml
  text: And if anyone does not obey our word through this letter[a], take note of that person; do not associate with him[d][c][b], so that he may be ashamed.
translation:
  language: ig
  text: Ọ bụrụkwa na onye ọ bụla anaghị erubere okwu anyị e ji akwụkwọ ozi a zie[a] isi, rịbanụ ama onye ahụ[b]; unu na ya esokwala akpakọrịta[c], ka ihere wee mee ya[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘site n’akwụkwọ ozi a’ ma ọ bụ ‘n’akwụkwọ ozi a.’ Nkebiokwu Grik ahụ nwere ike igosi ụzọ e si nye ntụziaka ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘kaa onye ahụ akara’ ma ọ bụ ‘debe onye ahụ n’uche.’
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, ‘unu na ya enwekwala mmekọrịta.’
    reason: lexical_alternative
  - marker: d
    text: 'Nzube ya bụ idozi onye ahụ: tulee amaokwu 15, ebe a ka na-ekwu ka a dọọ ya aka ná ntị ‘dị ka nwanne.’'
    reason: cross_reference
lexical_decisions:
- source_word: ὑπακούει
  choice: adịghị erubere ... isi
  rationale: ‘Irubere ... isi’ bụ ụzọ Igbo nkịtị na nke doro anya si akọwa nrubeisi nye ntụziaka ma ọ bụ onye nwere ikike.
- source_word: τῷ λόγῳ ἡμῶν
  choice: okwu anyị
  rationale: Nke a na-echekwa okwu Grik ahụ, ma n’ebe a ọ pụtara ozi ma ọ bụ ntụziaka ndịozi nyere.
- source_word: διὰ τῆς ἐπιστολῆς
  choice: nke e si n’akwụkwọ ozi a zie unu
  rationale: διά ya na genitive na-egosi ụzọ e si zie okwu ahụ. Nsụgharị a na-eme ka nke ahụ doo anya n’Igbo, ebe ‘a’ na-ezo aka n’akwụkwọ ozi dị n’aka ndị na-agụ ya.
- source_word: σημειοῦσθε
  choice: rịba onye ahụ ama
  rationale: ‘Ịrịba mmadụ ama’ na-egosi ịmata onye ahụ nke ọma ma lekwasị ya anya, n’enweghị ịgbakwụnye echiche ntaramahụhụ siri ike karịa ihe Grik kwuru.
- source_word: τοῦτον
  choice: onye ahụ
  rationale: Ọ na-ezo kpọmkwem n’onye ahụ na-adịghị erubere okwu ahụ isi.
- source_word: μὴ συναναμίγνυσθαι αὐτῷ
  choice: unu na ya enwekwala mmekọrịta
  rationale: Nke a na-egosi ịkwụsị iso onye ahụ akpakọrịta, ma ọ naghị eme ya ka ọ bụrụ okwu iwu ụka pụrụ iche nke ihe odide ahụ ekwughị.
- source_word: ἐντραπῇ
  choice: ka ihere wee mee ya
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa maka mmadụ ịmata ihere; ọ na-echekwa nzube e kwuru n’ahịrịokwu ahụ n’enweghị ime ka ọ bụrụ naanị mmechuihu obi ọjọọ.
- source_word: τις
  choice: onye ọ bụla
  rationale: Ọ na-echekwa obosara nke nnọchiaha na-akọwaghị otu onye kpọmkwem.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha Igbo ‘ya’ na-ezo n'ụzọ doro anya n’onye ahụ e kwuru okwu ya ma ọ naghị egosi nwoke ma ọ bụ nwaanyị, dịka usoro nnọchiaha Igbo si dị.
theological_decisions:
- issue: Ụdị ịdọ aka ná ntị dị na μὴ συναναμίγνυσθαι αὐτῷ
  choice: Ịkwụsị iso onye kwere ekwe na-adịghị erube isi akpakọrịta dịka ịdọ aka ná ntị iji dozie ya, ọ bụghị ikpe ikpeazụ.
  alternative: Ịchụpụ ya n’ụzọ iwu ụka zuru ezu, ma ọ bụ naanị izere mkpakọrịta nkịtị nke na-enweghị ihe jikọrọ ya na ọgbakọ.
  rationale: Amaokwu 15 ka na-akpọ onye ahụ ‘nwanne’ ma nye iwu ka a dọọ ya aka ná ntị; ya mere, e chekwabara nzube idozi ya n’etinyeghị usoro iwu ụka e mechara guzobe.
- issue: Ike na nzube nke ἐντραπῇ
  choice: Ihere nke ga-eme ka onye ahụ mata mmejọ ya ma nwee ike ịgbanwe.
  alternative: Ime ya ihere n’ihu ọha dịka njedebe n’onwe ya.
  rationale: Nkebiokwu nzube na amaokwu na-esote na-egosi na ọ bụ ihe e ji achọ mgbazi, ọ bụghị mmechuihu obi ọjọọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Unu’ na-eme ka ndị a na-enye iwu pụta ìhè. E tinyere akara ukwu ala niile [a]–[d] n’ebe okwu ha metụtara dị na isi ihe odide.
