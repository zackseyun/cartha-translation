  rationale: 'Removed the unsupported demonstrative from “ikike ahụ.” Recast the final wording so that the two Greek purpose expressions remain clear: the writers give themselves as an example to the readers, for the readers to imitate them. The revision maintains the source’s wording and does not add theological interpretation.'
