review_pass:
  verdict: revise
  source_fidelity: A revision is needed. The draft correctly conveys the contrast and the legitimate entitlement expressed by ἐξουσίαν, but “ikike ahụ” adds a demonstrative not present in Greek. More importantly, “ihe nlereanya unu ga-eṅomi” changes the purpose construction into a future-relative expression and leaves μιμεῖσθαι ἡμᾶς less explicit. The revision retains the purpose and expressly renders “imitate us.”
  naturalness: The revised wording is clear, idiomatic Standard Igbo, and keeps a formal but contemporary biblical register. “nye onwe anyị dị ka ihe nlereanya nye unu” is readily understandable and preserves the Greek image without awkwardness.
  terminology: “ikike” appropriately represents ἐξουσία here as a legitimate claim or entitlement, without importing broader claims of apostolic power. “ihe nlereanya” suitably renders τύπον; the footnotes preserve viable alternatives. “ṅomie anyị” directly and naturally renders μιμεῖσθαι ἡμᾶς.
  issues:
  - severity: medium
    issue: The demonstrative in “ikike ahụ” is unsupported.
    rationale: ἐξουσίαν has no demonstrative. Plain “ikike” is more source-faithful and avoids suggesting a specifically previously identified right within this verse.
  - severity: medium
    issue: “ihe nlereanya unu ga-eṅomi” does not clearly retain the Greek purpose construction or explicit object.
    rationale: εἰς τὸ μιμεῖσθαι ἡμᾶς means “for the purpose of imitating us.” The future form “ga-eṅomi” can sound predictive, while the explicit “anyị” should be retained.
  revised_text: ọ bụghị n’ihi na anyị enweghị ikike[a], kama ka anyị wee nye onwe anyị dị ka ihe nlereanya nye unu[b], ka unu ṅomie anyị.
  revised_footnotes:
