  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλ’ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/009.yaml
  text: not because we do not have the right, but in order to give ourselves to you as an example for you to imitate us.
translation:
  language: ig
  text: ọ bụghị n’ihi na anyị enweghị ikike[a], kama ka anyị wee nye onwe anyị dị ka ihe nlereanya nye unu[b], ka unu ṅomie anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikike ime nke a” ma ọ bụ “ike.” N’ebe a, ihe a na-ekwu bụ ikike ziri ezi inweta nkwado.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ụkpụrụ” ma ọ bụ “ihe atụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: ikike ahụ
  rationale: N’ọnọdụ okwu a, ọ na-egosi ikike ziri ezi Pọl na ndị ya nwere ịnata nkwado, ọ bụghị naanị ike ime ihe.
- source_word: ἑαυτοὺς
  choice: onwe anyị
  rationale: Nnọchiaha nlaghachi a na-ezo aka na Pọl na ndị ọrụ ibe ya; “onwe anyị” na-edobe ike okwu ahụ.
- source_word: τύπον
  choice: ihe nlereanya
  rationale: N’ebe a, ọ pụtara ụkpụrụ omume e kwesịrị iṅomi; “ihe nlereanya” bụ okwu Igbo doro anya ma bụrụkwa nke sitere n’okwu Grik ahụ.
- source_word: δῶμεν
  choice: nye
  rationale: Nke a na-edobe onyonyo dị n’akpaokwu Grik, bụ́ ‘inye onwe anyị ka ihe nlereanya,’ n’ụzọ Igbo ka na-ada nke ọma.
- source_word: εἰς τὸ μιμεῖσθαι
  choice: unu ga-eṅomi
  rationale: Ọ na-egosipụta ebumnuche nke ime onwe ha ihe nlereanya, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: μιμεῖσθαι ἡμᾶς
  choice: unu ga-eṅomi
  rationale: Nsụgharị a na-edobe kpọmkwem echiche nke iṅomi Pọl na ndị ọrụ ibe ya.
- source_word: οὐχ ὅτι οὐκ
  choice: ọ bụghị n’ihi na anyị enweghị
  rationale: Ọ na-edobe ngọnarị abụọ ahụ na ọdịiche dị n’etiti ihe na-abụghị ihe kpatara ya na ezi ebumnuche ha.
- source_word: ἀλλ’ ἵνα
  choice: kama ọ bụ ka
  rationale: Ọ na-egosi ebumnuche nke akụkụ nke abụọ n’Igbo dị mfe ma kwekọọ n’ọdịiche dị n’ahịrịokwu Grik.
theological_decisions:
- issue: Ụdị ikike Pọl na-ekwu maka ya n’okwu ἐξουσίαν
  choice: Pọl na ndị ọrụ ibe ya nwere ikike ziri ezi ịnata nkwado, ma ha ahọrọghị iji ya mee ihe n’ọnọdụ a.
  alternative: O nwere ike izo aka n’ikike ma ọ bụ ike ndị ozi n’ụzọ sara mbara.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ekwu banyere ịrụ ọrụ ka ha ghara ịbụ ibu arọ nye ndị ọzọ. Ya mere, “ikike” ebe a bụ ikike ziri ezi inweta nkwado, ma nsụgharị ahụ adịghị agbasawanye ya ka ọ bụrụ nkwupụta ozizi banyere ikike ndị ozi n’ozuzu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere ọdịiche nke ‘ọ bụghị ... kama’ na ebumnuche nke ἵνα, ma zere ịgbakwunye ozizi na-adịghị n’amaokwu ahụ.
