  yaml_path: translation/nt/2_thessalonians/003/007.yaml
  text: For you yourselves know how you ought to imitate us[a], because we did not behave disorderly among you.
translation:
  language: ig
  text: N’ihi na unu onwe unu maara otú unu kwesịrị isi ṅomie anyị, n’ihi na anyị ebighị ndụ aghara aghara n’etiti unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, kpọmkwem karị n’ọnọdụ a, “anyị ebighị ndụ umengwụ n’etiti unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: unu onwe unu
  rationale: 'Ọ na-emesi isiokwu ahụ ike: ndị Tesalonaịka n’onwe ha maara ihe a.'
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe kpatara ndụmọdụ dị n’amaokwu bu ụzọ.
- source_word: οἴδατε
  choice: maara
  rationale: 'Ọ bụ ezie na ọdịdị okwu Grik a bụ perfect, ihe ọ pụtara ebe a bụ ọnọdụ dị ugbu a: ‘unu maara.’'
- source_word: πῶς δεῖ μιμεῖσθαι ἡμᾶς
  choice: otú unu kwesịrị isi ṅomie anyị
  rationale: Nke a na-egosipụta ụzọ e kwesịrị isi ṅomie Pọl na ndị ya, ma na-edobe ike nke δεῖ dị ka ọrụ kwesịrị ime.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ebe a, ọ na-ejikọta ihe ha maara na ihe kpatara ya, ya bụ omume ndị ozi ahụ n’etiti ha.
- source_word: οὐκ ἠτακτήσαμεν
  choice: anyị ebighị ndụ aghara aghara
  rationale: ἀτακτέω sara mbara karịa ịnọ nkịtị; ọ na-egosi ibi ndụ na-enweghị usoro ma ọ bụ ọzụzụ. Nsụgharị a na-edobe obosara ahụ.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: Ọ na-egosi omume ha mgbe ha na ndị Tesalonaịka nọkọrọ.
theological_decisions:
- issue: Ihe ἀτακτέω pụtara n’ebe a
  choice: anyị ebighị ndụ aghara aghara
  alternative: anyị anọghị nkịtị n’etiti unu
  rationale: Isiakwụkwọ a na-ekwu karịsịa banyere ndị na-ajụ ịrụ ọrụ, ma okwu Grik ahụ pụkwara ịkọwa omume na-enweghị usoro n’ụzọ sara mbara. Ya mere, isi ederede edobela obosara okwu ahụ, ebe nkọwa ala peeji na-egosi ihe ọ pụrụ ịpụta kpọmkwem n’ọnọdụ a.
translation_notes:
  register: Standard Igbo dị ugbu a, nke ugwu na nsọpụrụ dị na ya ma dịkwa mfe nghọta. E ji ‘ṅomie’ debe ihe μιμεῖσθαι pụtara ozugbo; e jighị ‘soro ihe nlereanya anyị’ dochie ya. E tinyere akara [a] mgbe ahịrịokwu ahụ gasịrị ka o zoo aka n’alternative nke ἀτακτέω.
