    text: Okwu a pụtara ịrụ ọrụ n’ụzọ dị jụụ na nke kwụsiri ike, n’adịghị ka ibi ndụ aghara aghara ma ọ bụ itinye aka n’ihe ndị ọzọ.
    reason: lexical_clarification
  revision_rationale: The revision replaces an expression that can mean “slowly” with wording that explicitly conveys the quiet, settled manner denoted by μετὰ ἡσυχίας. It also punctuates the Messiah title as an apposition and updates the footnote accordingly. The verse’s command, appeal, participial relationship, and “their own bread” imagery remain intact.
