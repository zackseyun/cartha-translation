revisions:
- from: Ndị dị otú ahụ ka anyị na-enye iwu ma na-agba ume n’ime Onyenwe anyị Jizọs bụ́ Mesaịa[a], ka ha jiri nwayọọ[b] na-arụ ọrụ, na-erikwa achịcha nke ha.
  to: Ndị dị otú ahụ ka anyị na-enye iwu ma na-agba ume n’ime Onyenwe anyị Jizọs, bụ́ Mesaịa[a], ka ha na-arụ ọrụ n’ụzọ dị jụụ, na-eri achịcha nke ha.[b]
  rationale: The revision replaces an expression that can mean “slowly” with wording that explicitly conveys the quiet, settled manner denoted by μετὰ ἡσυχίας. It also punctuates the Messiah title as an apposition and updates the footnote accordingly. The verse’s command, appeal, participial relationship, and “their own bread” imagery remain intact.
  reviewer_model: gpt-5.6-terra
