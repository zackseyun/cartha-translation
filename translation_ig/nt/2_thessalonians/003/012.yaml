source:
  edition: SBLGNT
  text: τοῖς δὲ τοιούτοις παραγγέλλομεν καὶ παρακαλοῦμεν ⸂ἐν κυρίῳ Ἰησοῦ Χριστῷ⸃ ἵνα μετὰ ἡσυχίας ἐργαζόμενοι τὸν ἑαυτῶν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/012.yaml
  text: To such people we command and urge in the Lord Jesus the Messiah that[a], working quietly[c][b], they should eat their own bread.
translation:
  language: ig
  text: Ndị dị otú ahụ ka anyị na-enye iwu ma na-agba ume n’ime Onyenwe anyị Jizọs, bụ́ Mesaịa[a], ka ha na-arụ ọrụ n’ụzọ dị jụụ, na-eri achịcha nke ha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime Onyenwe anyị Jizọs Kraịst.” Okwu Grik bụ Χριστός ka a sụgharịrị “Mesaịa” n’ebe a n’ihi na ọ na-arụ ọrụ dịka utu aha.
    reason: alternative_reading
  - marker: b
    text: Okwu a pụtara ịrụ ọrụ n’ụzọ dị jụụ na nke kwụsiri ike, n’adịghị ka ibi ndụ aghara aghara ma ọ bụ itinye aka n’ihe ndị ọzọ.
    reason: lexical_clarification
lexical_decisions:
- source_word: τοῖς δὲ τοιούτοις
  choice: Ndị dị otú ahụ
  rationale: Nkebiokwu a na-arụtụ aka n’ebe ndị na-ebi ndụ aghara aghara ma na-adịghị arụ ọrụ ndị a kpọtụrụ aha n’amaokwu ndị bu ụzọ nọ. A hapụrụ δέ ka njikọ dị nro nke ihe gbara ya gburugburu na-egosi, kama ịgbakwunye okwu oge dịka ‘ugbu a.’
- source_word: παραγγέλλομεν καὶ παρακαλοῦμεν
  choice: anyị na-enye iwu ma na-agba ume
  rationale: Nke a chekwara ma ikike dị n’okwu παραγγέλλομεν ma arịrịọ siri ike na nke ọzụzụ atụrụ dị na παρακαλοῦμεν.
- source_word: ἐν κυρίῳ Ἰησοῦ Χριστῷ
  choice: n’ime Onyenwe anyị Jizọs bụ́ Mesaịa
  rationale: ‘N’ime’ na-egosi ọnọdụ na ikike nke njikọ ha na Onyenwe anyị, ọ bụghị naanị na ọ bụ ya ji ha zie iwu. ‘Bụ́ Mesaịa’ mere ka Χριστός pụta ìhè dịka utu aha.
- source_word: μετὰ ἡσυχίας ἐργαζόμενοι
  choice: ka ha jiri nwayọọ na-arụ ọrụ
  rationale: Ọ na-akọwa ọrụ a na-arụ n’ụzọ dị jụụ na nke kwụsiri ike, n’adịghị ka ịnọ nkịtị na-akpaghasị ndị ọzọ; ọ pụtaghị na ha agaghị ekwu okwu ma ọlị.
- source_word: τὸν ἑαυτῶν ἄρτον ἐσθίωσιν
  choice: na-erikwa achịcha nke ha
  rationale: E debere ihe oyiyi ‘achịcha’ nke dị n’asụsụ Grik. N’ọnọdụ a, ọ na-anọchi anya nri na ihe mmadụ ji ebi ndụ nke sitere n’ọrụ aka ya.
theological_decisions:
- issue: Nsụgharị Χριστός dịka utu aha
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dịka utu aha nke Jizọs. ‘Mesaịa’ na-eme ka ihe utu aha ahụ pụtara ghara ịghọ naanị akụkụ aha mmadụ.
- issue: Ike dị n’ọdụmọdụ ndịozi
  choice: E debere ma ‘na-enye iwu’ ma ‘na-agba ume’
  alternative: Ijikọta ha n’otu okwu dịka ‘na-adụ ọdụ’
  rationale: Okwu Grik ahụ jikọtara ikike nke iwu na arịrịọ siri ike. Ichekwa ha abụọ na-ezere ime ka otu akụkụ n’ime ha daa mba.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘jiri nwayọọ na-arụ ọrụ’ ka ọ bụrụ okwu mmadụ na-asụ nke ọma ma chekwaa echiche nke ndụ dị jụụ na nke na-adịghị akpaghasị ndị ọzọ. E debere ‘achịcha’ dịka ihe oyiyi Akwụkwọ Nsọ, ebe nkọwa ụkwụ na mkpebi okwu na-egosi na ọ gbasara ihe mmadụ ji ebi ndụ.
