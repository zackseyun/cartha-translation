base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/004.yaml
  text: And we have confidence in the Lord about you, that you are doing and will do what we command.
translation:
  language: ig
  text: Ma anyị nwere ntụkwasị obi n’Onyenwe anyị banyere unu, na unu na-eme ma ga-emekwa ihe ndị anyị na-enye unu iwu ka unu mee.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεποίθαμεν
  choice: anyị nwere obi ike
  rationale: Ọ na-egosi ntụkwasị obi siri ike dị ugbu a, n’asụsụ Igbo doro anya ma dịkwa ugwu.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: E debere njikọ ahụ na Onyenwe anyị dị ka ntọala na mpaghara ntụkwasị obi ndị ozi ahụ.
- source_word: ἐφ’ ὑμᾶς
  choice: banyere unu
  rationale: Nke a na-egosipụta ntụkwasị obi e nwere banyere ndị a na-agwa okwu, na-enweghị ime ka ihe ahụ pụta karịa ka Grik si kwuo.
- source_word: παραγγέλλομεν
  choice: ihe ndị anyị na-enye unu n’iwu
  rationale: παραγγέλλω ebe a pụtara inye ntụziaka nwere ikike; ‘inye n’iwu’ na-ebute ike okwu ahụ nke ọma.
- source_word: ποιεῖτε καὶ ποιήσετε
  choice: unu na-eme, unu ga-emekwa
  rationale: E chekwara ọdịiche dị n’etiti omume dị ugbu a na nke ga-eme n’ọdịnihu.
theological_decisions:
- issue: Ebe ntụkwasị obi ahụ siri malite
  choice: n’ime Onyenwe anyị
  alternative: anyị tụkwasịrị unu obi n’ihi Onyenwe anyị
  rationale: Nhọrọ ahụ na-agbasochi ἐν κυρίῳ anya ma na-ahapụ njikọ ziri ezi n’etiti ọrụ Onyenwe anyị na nzaghachi ndị kwere ekwe n’enweghị ịkọwa ya karịa ederede.
- issue: Ụdị okwu ndị ozi ahụ nyere
  choice: ihe ndị anyị na-enye unu n’iwu
  alternative: ihe ndị anyị na-agwa unu ka unu mee
  rationale: ‘Iwu’ na-echekwa ikike dị na παραγγέλλομεν; nhọrọ ọzọ nwere ike ime ka okwu ahụ dị nro karịa isi mmalite.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. E jiri ‘Ma’ gosipụta δέ n’enweghị ime ka ọdịiche ahụ sie ike gabiga ókè; usoro ahịrịokwu ahụ na-echekwa nkwughachi nke ugbu a na ọdịnihu.
