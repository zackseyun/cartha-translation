  to: Ma anyị nwere ntụkwasị obi n’Onyenwe anyị banyere unu, na unu na-eme ma ga-emekwa ihe ndị anyị na-enye unu iwu ka unu mee.
  rationale: The revision retains δέ (“Ma”), πεποίθαμεν (“anyị nwere ntụkwasị obi”), ἐν κυρίῳ (“n’Onyenwe anyị”), and the present/future force of ποιεῖτε καὶ ποιήσετε (“na-eme ma ga-emekwa”). It also retains the authoritative sense of παραγγέλλομεν in a natural Igbo construction and introduces no interpretive or denominational addition.
