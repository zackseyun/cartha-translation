source:
  edition: SBLGNT
  text: καὶ ἵνα ῥυσθῶμεν ἀπὸ τῶν ἀτόπων καὶ πονηρῶν ἀνθρώπων, οὐ γὰρ πάντων ἡ πίστις.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/002.yaml
  text: and that we may be delivered from wicked and evil men[b][a], for not all have faith.
translation:
  language: ig
  text: ka a napụta anyị n’aka ndị na-adịghị ezi uche na ndị ajọ omume,[a] n’ihi na ọ bụghị mmadụ niile nwere okwukwe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-eme omume na-ekwesịghị ekwesị na ndị ajọ omume.” Okwu Grik ahụ nwere ike ịpụta ihe na-ekwesịghị ekwesị, ihe nzuzu, ma ọ bụ enweghị ezi uche; n’ebe a, ọ na-ekwu banyere ndị mmegide omume ha gbagọrọ agbagọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihi na ọ bụghị mmadụ niile nwere ikwesị ntụkwasị obi.” N’ụzọ nkịtị, Grik sịrị, “n’ihi na okwukwe abụghị nke mmadụ niile.”
    reason: alternative_reading
lexical_decisions:
- source_word: ῥυσθῶμεν
  choice: a napụta anyị
  rationale: 'Na-esochi ἵνα dị ka aorist passive subjunctive, ọ na-egosi nzube: ka a napụta anyị n’aka ndị mmegide.'
- source_word: ἀτόπων
  choice: na-eme ihe na-ekwesịghị ekwesị
  rationale: Ọ na-echekwa echiche nke ihe na-adịghị mma, na-ekwesịghị ekwesị, ma ọ bụ enweghị ezi uche, n’ejikọghị ya kpamkpam na πονηρῶν.
- source_word: πονηρῶν
  choice: ndị ajọ omume
  rationale: Nke a bụ okwu doro anya n’Igbo maka ndị na-eme ihe ọjọọ, ma dị iche ntakịrị na ἀτόπων.
- source_word: ἀνθρώπων
  choice: ndị ikom
  rationale: A họọrọ ụdị na-egosi nwoke dịka ihe akaebe e nyere si ghọta ndị mmegide a kpọmkwem; a naghị agbanwe ya ka ọ bụrụ mmadụ n’ozuzu.
- source_word: πίστις
  choice: okwukwe
  rationale: N’ebe a, 'okwukwe' bụ nghọta kacha kwekọọ n’okwu banyere ndị na-emegide ozi ahụ, ebe a na-edobe 'ikwesị ntụkwasị obi' dịka nhọrọ ọzọ.
- source_word: οὐ γὰρ πάντων ἡ πίστις
  choice: n’ihi na ọ bụghị mmadụ niile nwere okwukwe
  rationale: Nke a na-eme ka ahịrịokwu Grik dị mkpirikpi—'ọ bụghị nke mmadụ niile ka okwukwe bụ'—bụrụ Igbo eke n’etinyeghị nkwupụta siri ike karịa ihe odide ahụ.
theological_decisions:
- issue: Ihe πίστις pụtara n’ahịrịokwu nwere nghọta abụọ
  choice: okwukwe
  alternative: ọ bụghị mmadụ niile kwesịrị ntụkwasị obi
  rationale: Ọnọdụ okwu ahụ na-akwado enweghị okwukwe, ma πίστις nwekwara ike ịpụta ikwesị ntụkwasị obi; ya mere e debere nhọrọ ahụ n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ 'n’aka' iji gosipụta isi iyi nke nnapụta, a hapụkwara nghọta abụọ dị na ἀτόπων na πίστις ka nkọwa ala peeji chekwaa ha.
