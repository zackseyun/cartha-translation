    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihi na ọ bụghị mmadụ niile nwere ikwesị ntụkwasị obi.” N’ụzọ nkịtị, Grik sịrị, “n’ihi na okwukwe abụghị nke mmadụ niile.”
    reason: alternative_reading
