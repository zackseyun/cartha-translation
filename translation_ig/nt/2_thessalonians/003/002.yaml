revisions:
- from: ka a napụtakwa anyị n’aka ndị ikom na-eme ihe na-ekwesịghị ekwesị na ndị ajọ omume,[a] n’ihi na ọ bụghị mmadụ niile nwere okwukwe.[b]
  to: ka a napụta anyị n’aka ndị na-adịghị ezi uche na ndị ajọ omume,[a] n’ihi na ọ bụghị mmadụ niile nwere okwukwe.[b]
  rationale: The revision removes an unsupported male-only restriction, uses an idiomatic Standard Igbo expression for ἀτόπων, and regularizes the alternative footnote for πίστις. It preserves the Greek purpose construction, the distinction between ἀτόπων and πονηρῶν, and the ambiguity of the final clause.
