reference: 2 Thessalonians 3:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀκούομεν γάρ τινας περιπατοῦντας ἐν ὑμῖν ἀτάκτως, μηδὲν ἐργαζομένους ἀλλὰ περιεργαζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/011.yaml
  text: For we hear that some among you are walking disorderly[a], doing no work at all[b], but meddling.
translation:
  language: ig
  text: N’ihi na anyị na-anụ na ụfọdụ ndị nọ n’etiti unu na-ebi ndụ n’enweghị usoro[a], na-adịghị arụ ọrụ ọ bụla ma ọlị, kama na-etinye aka n’ihe na-adịghị ha metụta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “na-ebi ndụ umengwụ” ma ọ bụ “na-ebi ndụ na-enweghị ọzụzụ.” Okwu Grik ahụ nwere ike ịkọwa omume na-adịghị n’usoro ma ọ bụ ndụ umengwụ nke na-emegide ihe ọgbakọ ahụ tụrụ anya ya.
    reason: lexical_alternative
  - marker: b
    text: 'Okwu Grik abụọ a nwere mgbọrọgwụ metụtara “ọrụ”: ha “anaghị arụ ọrụ,” kama ha na-etinye onwe ha n’ihe na-adịghị ha metụta. Nke a na-egosi egwuregwu okwu dị n’asụsụ Grik ahụ.'
    reason: lexical_wordplay
lexical_decisions:
- source_word: ἀκούομεν
  choice: anyị na-anụ
  rationale: Okwu a dị n’ụdị ugbu a, na-egosi akụkọ ha na-anụ ugbu a ma ọ bụ ihe ha na-anụ mgbe niile.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ndụmọdụ bu ya ụzọ ma na-enye ihe kpatara ndụmọdụ ahụ.
- source_word: τινας
  choice: ụfọdụ ndị
  rationale: Ọ na-ekwu banyere mmadụ ole na ole a na-akpọghị aha n’ime ọgbakọ ahụ.
- source_word: περιπατοῦντας
  choice: na-ebi ndụ
  rationale: N’ebe a, ‘ije ije’ bụ akpaalaokwu Grik maka otú mmadụ si ebi ndụ; ‘na-ebi ndụ’ na-eme ka echiche ahụ doo anya n’Igbo.
- source_word: ἐν ὑμῖν
  choice: ndị nọ n’etiti unu
  rationale: Nke a na-egosi na ndị ahụ so n’obodo ndị kwere ekwe ahụ ma nọ n’etiti ha.
- source_word: ἀτάκτως
  choice: n’enweghị usoro
  rationale: Ọ na-echekwa echiche sara mbara nke omume na-adịghị n’usoro ma ọ bụ na-enweghị ọzụzụ, n’etinyeghị naanị echiche nke ịdị umengwụ n’ime isi okwu.
- source_word: μηδὲν ἐργαζομένους
  choice: ha anaghị arụ ọrụ ọ bụla ma ọlị
  rationale: ‘Ọ bụla ma ọlị’ na-egosipụta nkwusi ike dị na μηδέν—na ha anaghị arụ ọrụ bara uru ọbụla.
- source_word: ἀλλὰ
  choice: kama
  rationale: Ọ na-egosi ọdịiche siri ike n’etiti ịrụ ọrụ kwesịrị ekwesị na itinye aka n’ihe na-ekwesịghị ha.
- source_word: περιεργαζομένους
  choice: ha na-etinye aka n’ihe na-agbasaghị ha
  rationale: Nke a bụ ụzọ Igbo dị ugbu a si kọwaa mmadụ na-etinye ọnụ ma ọ bụ aka n’ihe ndị ọzọ kama ịrụ ọrụ nke ya. A kọwara egwuregwu okwu Grik n’ala ala peeji.
theological_decisions:
- issue: Ma ἀτάκτως ọ pụtara naanị ịdị umengwụ ka ọ bụ omume na-adịghị n’usoro n’ozuzu ya
  choice: n’enweghị usoro
  alternative: na-ebi ndụ umengwụ
  rationale: Ihe gbara amaokwu ahụ gburugburu metụtara ịghara ịrụ ọrụ, ma okwu Grik ahụ sara mbara karịa ịdị umengwụ naanị. Ya mere, isi okwu na-echekwa nghọta sara mbara, ebe nkọwa ala ala peeji na-egosi nhọrọ ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A sụgharịrị akpaalaokwu ‘ije ije’ dị ka ‘ibi ndụ’ ka ọ bụrụ Igbo eke; e chekwara ịdị mgbagwoju anya nke ἀτάκτως site n’isi okwu na nkọwa [a].
