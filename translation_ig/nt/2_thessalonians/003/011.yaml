review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the causal connection, the report concerning an unspecified group within the community, their disorderly manner of life, their refusal to work, and the contrast with meddling. The phrase “n’ihe na-agbasaghị ha,” however, is not a clear or dependable Standard Igbo expression for matters that do not concern them and can suggest a different sense.
  naturalness: The overall register is clear and suitable for modern Standard Igbo. Replacing “n’ihe na-agbasaghị ha” with “n’ihe na-adịghị ha metụta” makes the final clause idiomatic and immediately intelligible. Keeping the linked participial actions in one sentence also reflects the Greek construction smoothly.
  terminology: “na-ebi ndụ n’enweghị usoro” appropriately retains the broader force of ἀτάκτως rather than reducing it to idleness alone. “ha anaghị arụ ọrụ ọ bụla ma ọlị” properly conveys the emphatic μηδέν. The second footnote is revised to explain the Greek wordplay without the unclear expression “na-arụgharị onwe ha.”
  issues:
  - severity: medium
    issue: The rendering “n’ihe na-agbasaghị ha” is unclear/non-idiomatic for περιεργαζομένους.
    rationale: περιεργαζομένους denotes meddling or occupying oneself with matters outside one’s proper concern. “Ihe na-adịghị ha metụta” is a natural Standard Igbo way to express this without adding a specific object or motive.
  - severity: low
    issue: Footnote [b] uses the unclear wording “na-arụgharị onwe ha.”
    rationale: This wording does not clearly communicate the Greek play between ἐργαζομένους and περιεργαζομένους. A direct explanation of the related work-language better serves the reader.
  revised_text: N’ihi na anyị na-anụ na ụfọdụ ndị nọ n’etiti unu na-ebi ndụ n’enweghị usoro[a], na-adịghị arụ ọrụ ọ bụla ma ọlị, kama na-etinye aka n’ihe na-adịghị ha metụta[b].
