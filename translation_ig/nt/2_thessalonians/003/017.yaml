  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου, ὅ ἐστιν σημεῖον ἐν πάσῃ ἐπιστολῇ· οὕτως γράφω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/017.yaml
  text: The greeting is by my own hand—Paul's—which is a sign in every letter[a]; this is how I write.
translation:
  language: ig
  text: Ekele a ka mụ, Pọl, ji aka m dee; ọ bụ akara n’akwụkwọ ozi ọ bụla[a]. Otu a ka m si ede.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Ekele nke mụ, Pọl, ji aka m dee—nke bụ akara n’akwụkwọ ozi ọ bụla; otu a ka m na-ede.” A pụkwara ịtụgharị ahịrịokwu ikpeazụ n’ụzọ kpọmkwem karịa: “Otu a ka m na-ede.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασμὸς
  choice: Ekele
  rationale: “Ekele” bụ okwu Igbo dị mfe ma kwekọọ n’ekele e ji mechie akwụkwọ ozi; ọ bụ ihe ndị na-agụ akwụkwọ taa ga-aghọta nke ọma.
- source_word: τῇ ἐμῇ χειρὶ
  choice: nke m ... ji aka m dee
  rationale: Nke a na-egosi n'ụzọ doro anya na Pọl ji aka ya dee ekele a, kama ịbụ naanị ntụaka nkịtị banyere aka ya.
- source_word: Παύλου
  choice: nke m, Pọl
  rationale: Aha “Pọl” nọ n’ọnọdụ nkọwa nke na-eme ka onye ji aka ya dee ihe a mata onwe ya; usoro a bụ Igbo ebumpụta ụwa.
- source_word: ὅ
  choice: ọ bụkwa
  rationale: Nnọchiaha a na-ezo azụ n’ekele ahụ Pọl ji aka ya dee. “Ọ bụkwa” na-ejikọta echiche ahụ nke ọma n’Igbo n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: σημεῖον
  choice: akara
  rationale: “Akara” nwere ike ịpụta ihe e ji amata ma ọ bụ gosi izi ezi, nke dabara n’ọrụ σημεῖον n’ebe a.
- source_word: ἐν πάσῃ ἐπιστολῇ
  choice: n’akwụkwọ ozi ọ bụla
  rationale: Nke a na-edobe echiche nke omume Pọl n’akwụkwọ ozi ya niile, ma jiri okwu Igbo a na-asụ taa.
- source_word: οὕτως γράφω
  choice: Otu a ka m si ede
  rationale: Nke a na-edobe echiche banyere otú o si ede, ma hapụkwa ohere nke okwu Grik ahụ nwere ike ịbụ nkwupụta dị nkenke, “Lee ka m si ede.”
theological_decisions:
- issue: Ihe okwu Pọl banyere aka ya na akara pụtara
  choice: E gosiri na ekele Pọl ji aka ya dee bụ akara e ji amata akwụkwọ ozi ya.
  alternative: 'A pụrụ ịghọta ahịrịokwu ikpeazụ dị ka nke na-ezo naanị n’ihe ọ na-ede ugbu a: “Lee ka m si ede.”'
  rationale: Okwu ndị gbara ya gburugburu, karịsịa “akara n’akwụkwọ ozi ọ bụla,” na-akwado echiche nke akara e ji amata akwụkwọ ozi ahụ. Ma ihe odide na nkọwa ala peeji anaghị eme ka nhọrọ ọzọ ghara ịdị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-eme ka olu Pọl nke na-akọwa onwe ya pụta ìhè, n’enweghị itinye okwu ụka pụrụ iche ma ọ bụ nkọwa nkwenkwe agbakwunyere.
