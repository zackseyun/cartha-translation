  rationale: 'The revision makes the autograph formula idiomatic and unambiguous in Standard Igbo: Paul himself writes this greeting with his own hand. It preserves the relative connection between the greeting and its role as a sign in every letter, as well as the restrained ambiguity of οὕτως γράφω. The footnote has been recast for grammatical clarity and continues to record the more literal rendering of the final clause.'
