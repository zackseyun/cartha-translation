  text: καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/010.yaml
  text: 'For even when we were with you, we kept commanding you this: if anyone is not willing to work, neither let him eat.'
translation:
  language: ig
  text: 'N’ihi na ọbụna mgbe anyị na unu nọ, anyị na-enyekarị unu iwu a: “Ọ bụrụ na onye ọ bụla achọghị ịrụ ọrụ[b], ya erikwala nri[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka ọ ghara iri nri.”
    reason: lexical_alternative
  - marker: b
    text: Asụsụ Grik kwuru “achọghị ịrụ ọrụ,” nke na-ekwu banyere enweghị ọchịchọ ịrụ ọrụ, ọ bụghị enweghị ike ịrụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: N’ihi na ọbụna
  rationale: “N’ihi na” na-egosi njikọ nkọwa nke γάρ na amaokwu bu ya ụzọ, ebe “ọbụna” na-echekwa nkwusi ike nke καί.
- source_word: ὅτε ἦμεν πρὸς ὑμᾶς
  choice: mgbe anyị na unu nọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji ekwu na mmadụ nọ n’etiti ndị ọzọ ma ọ bụ soro ha biri.
- source_word: τοῦτο παρηγγέλλομεν ὑμῖν
  choice: anyị na-enyekarị unu iwu a
  rationale: “Iwu a” na-ezo aka n’ihe na-esochi ya, “na-enyekarị” na-egosikwa omume gara aga a na-eme ugboro ugboro, dịka imperfect παρηγγέλλομεν si kwado.
- source_word: εἴ τις
  choice: Ọ bụrụ na onye ọ bụla
  rationale: Nke a na-echekwa ọnọdụ a na-ekwu banyere onye ọbụla n’enweghị ịkpa oke.
- source_word: οὐ θέλει ἐργάζεσθαι
  choice: achọghị ịrụ ọrụ
  rationale: θέλει metụtara ọchịchọ ma ọ bụ njikere mmadụ, ọ bụghị enweghị ike; “achọghị” bụ okwu Igbo nkịtị nke na-echekwa ihe ahụ.
- source_word: μηδὲ ἐσθιέτω
  choice: ya erikwala nri
  rationale: Nke a na-echekwa ike iwu nke imperative ahụ na njikọ “ọ bụghịkwa” nke μηδέ, ma na-ada ka Igbo doro anya.
theological_decisions:
- issue: Ma okwu a ọ na-ekwu banyere onye na-enweghị ike ịrụ ọrụ ka ọ bụ onye na-achọghị ịrụ ọrụ
  choice: “onye ọ bụla achọghị ịrụ ọrụ”
  alternative: “onye ọ bụla na-enweghị ike ịrụ ọrụ”
  rationale: θέλει na-ekwu kpọmkwem banyere ọchịchọ ma ọ bụ njikere. Ya mere, amaokwu a anaghị ebo ndị na-enweghị ike ịrụ ọrụ ebubo.
- issue: Ụdị onye otu nke dị na nsonaazụ iwu ahụ
  choice: “ya erikwala nri”
  alternative: “ha erikwala nri”
  rationale: Asụsụ Grik ji onye na-akọwaghị aha n’otu (τις) na iwu onye nke atọ n’otu; Igbo “ya” na-echekwa ụdị onye otu ahụ ma ka na-emetụta onye ọbụla.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Anyị na-enyekarị unu iwu” na-egosipụta iwu e nyere ugboro ugboro; “ya erikwala nri” bụ iwu siri ike ma bụrụkwa okwu Igbo e ji eme ihe n'ụzọ ebumpụta ụwa.
