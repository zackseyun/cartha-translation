  rationale: E degharịrị naanị ụzọ e si akọwa τοῦ πονηροῦ iji gosipụta isiokwu a kapịrị ọnụ na ọgụgụ nke onye, ma chekwaa ọgụgụ nke «ihe ọjọọ» n’okpuru peeji. E tinyekwara «ga-» n’ọrụ nke abụọ maka nghọta doro anya nke ọdịnihu abụọ ahụ.
