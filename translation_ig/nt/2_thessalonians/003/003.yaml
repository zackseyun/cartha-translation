review_pass:
  verdict: revise
  source_fidelity: Ederede ahụ na-anọchi anya ọdịiche δέ, nkwa n’ọdịnihu dị na στηρίξει na φυλάξει, na nchebe ἀπὸ τοῦ πονηροῦ nke ọma. Otú ọ dị, «ajọ onye» anaghị egosi nke ọma nkọwa a kapịrị ọnụ nke mkpụrụokwu ahụ nwere isiokwu («the evil one»); «onye ọjọọ ahụ» na-echekwa ya nke ọma.
  naturalness: «Onyenwe anyị kwesịrị ntụkwasị obi» na «ga-eme ka unu guzosie ike» bụ Igbo ọkọlọtọ eke. Ikwughachi «ga-» n’ọrụ nke abụọ na-eme nkwa abụọ ahụ doo anya, ebe «chebe unu n’aka...» bụ nkwupụta Igbo sitere n’okike.
  terminology: A chebere «Onyenwe anyị» maka ὁ κύριος. «Onye ọjọọ ahụ» na-enye ọgụgụ nke onye n’enweghị ịkpọ ya Setan ma ọ bụ itinye nkọwa okpukpe ọzọ. Nkọwa ala peeji ahụ na-edobe ohere ziri ezi na τοῦ πονηροῦ nwere ike ịpụta «ihe ọjọọ».
  issues:
  - severity: medium
    issue: «ajọ onye» enweghị isiokwu a kapịrị ọnụ nke dị na τοῦ πονηροῦ.
    rationale: Okwu Grik ahụ nwere article, ebe «ajọ onye» nwere ike ịpụta naanị mmadụ ọjọọ ọ bụla. «onye ọjọọ ahụ» na-anọchi anya ọgụgụ nwoke a kapịrị ọnụ nke ọma, ma anaghị ekpebi onye ọ bụ.
  - severity: low
    issue: Nkọwa ala peeji banyere «ụdị nwoke» na «ụdị na-abụghị nwoke na nwanyị» adịghị eke nke ọma n’Igbo.
    rationale: Ịkọwa ohere abụọ ahụ kpọmkwem dịka «onye ọjọọ ahụ» ma ọ bụ «ihe ọjọọ» dị mfe nghọta ma na-edobe mgbagwoju anya nke Grik.
