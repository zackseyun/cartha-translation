  text: πιστὸς δέ ἐστιν ὁ κύριος, ὃς στηρίξει ὑμᾶς καὶ φυλάξει ἀπὸ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/003.yaml
  text: But the Lord is faithful[a], who will strengthen you and guard you from the evil one.
translation:
  language: ig
  text: Ma Onyenwe anyị kwesịrị ntụkwasị obi; ọ ga-eme ka unu guzosie ike, ga-echebekwa unu n’aka onye ọjọọ ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ihe ọjọọ.” N’asụsụ Grik, τοῦ πονηροῦ nwere ike ịpụta “onye ọjọọ ahụ” ma ọ bụ “ihe ọjọọ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: kwesịrị ntụkwasị obi
  rationale: Nkebiokwu a na-egosi na a pụrụ ịtụkwasị Onyenwe anyị obi na ọ ga-emezu ihe o kwuru; ọ na-ekwupụta ntụkwasị obi ya n'ụzọ Igbo nke oge a na-aghọta nke ọma.
- source_word: δέ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti enweghị okwukwe ma ọ bụ ntụkwasị obi nke ụfọdụ mmadụ n’amaokwu bu ụzọ na ntụkwasị obi nke Onyenwe anyị.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ Igbo a na-ejikarị sụgharịa κύριος; a hapụrụ onye aha ahụ na-ezo aka na ya dịka isi mmalite siri mee, na-akọwaghị ya karịa.
- source_word: στηρίξει
  choice: ga-eme ka unu guzosie ike
  rationale: Nke a na-eburu echiche nke ime ka mmadụ sie ike ma guzosie ike, ma kwekọọ n’ọnọdụ ndụ okwukwe na nke ọzụzụ atụrụ dị ebe a.
- source_word: φυλάξει
  choice: chebekwa unu
  rationale: Ọ na-egosi nche na nlekọta na-arụ ọrụ, n’Igbo dị mfe ma dịkwa ebube.
- source_word: ἀπὸ
  choice: pụọ n’aka
  rationale: N’ihu onye a kpọrọ ajọ onye, ‘pụọ n’aka’ bụ ụzọ Igbo si egosi nchebe ka onye ghara ịdaba n’ike ma ọ bụ n’ọchịchị onye ahụ.
- source_word: τοῦ πονηροῦ
  choice: ajọ onye
  rationale: Ụdị Grik ahụ nwere ike ịbụ nwoke, ‘ajọ onye,’ ma ọ bụ ihe na-abụghị onye, ‘ihe ọjọọ.’ Isi ederede họọrọ nghọta nke onye, ebe e debere nghọta nke ọzọ n’okpuru peeji.
theological_decisions:
- issue: Ihe τοῦ πονηροῦ na-ezo aka na ya
  choice: ajọ onye
  alternative: ihe ọjọọ
  rationale: N’ụtọasụsụ Grik, otu ụdị ahụ nwere ike ịpụta onye ọjọọ a kapịrị ọnụ ma ọ bụ ihe ọjọọ n’ozuzu. A họọrọ nghọta nke onye n’isi ederede n’ihi ojiji Agba Ọhụrụ na ọnọdụ mmegide ime mmụọ, ma e chekwara ihe ọzọ ọ pụrụ ịpụta n’okpuru peeji ka a ghara iwepụ mgbagwoju anya dị n’isi mmalite.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. E jiri ‘Onyenwe anyị’ mee aha nsọpụrụ ahụ, ma jiri ‘ga-eme ka unu guzosie ike’ chekwaa echiche nke nkwụsi ike na ike dị na στηρίξει.
