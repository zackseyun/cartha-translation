  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/018.yaml
  text: The grace of our Lord Jesus Christ be with all of you[a].
translation:
  language: ig
  text: Ka amara Onyenwe anyị Jizọs Kraịst[a] dịnyere unu niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jizọs Mezaịa.”
    reason: Aha-ọrụ Grik bụ Χριστός; “Kraịst” na “Mezaịa” bụ ụzọ abụọ a na-eji akọwa Onye E Tere Mmanụ.
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa χάρις dị ka ihu ọma na onyinye ọma Chineke na-enye n’efu; ọ dabara nke ọma n’ọgụgụ ngọzi Pọl ji mechie akwụkwọ ozi.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: “Onyenwe anyị” na-egosipụta ma ọchịchị ma nsọpụrụ dị na κύριος, ma na-ejigidekwa “anyị” dị na τοῦ κυρίου ἡμῶν.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs Kraịst
  rationale: “Jizọs” bụ aha e dere n’ụdị Igbo, ebe “Kraịst” bụ aha-ọrụ a maara nke ọma n’Igbo maka Χριστός; ọ na-anọgide na-egosi Onye E Tere Mmanụ n’usoro ngọzi a.
- source_word: μετὰ πάντων ὑμῶν
  choice: dịnyere unu niile
  rationale: μετά na genitive pụtara “nọnyeere/nyere.” N’Igbo, “dịnyere unu niile” bụ ụzọ doro anya ma dịkwa mma isi kwuo ngọzi a, ma “unu niile” na-edobe na ngọzi ahụ bụ nke ndị niile nọ n’ọgbakọ.
theological_decisions:
- issue: Otu e si sụgharịa Χριστοῦ n’ọgụgụ ngọzi mmechi
  choice: Kraịst
  alternative: Mezaịa
  rationale: N’agbanyeghị na Χριστός bụ aha-ọrụ pụtara Onye E Tere Mmanụ, “Jizọs Kraịst” bụ usoro a maara nke ọma ma dị ugwu n’Igbo, ọ naghịkwa ewepụ ọrụ aha ahụ. E debere “Mezaịa” n’ala peeji dị ka ụzọ ọzọ nke na-eme ka aha-ọrụ ahụ pụta ìhè.
translation_notes:
  register: Asụsụ ahụ bụ Igbo izugbe nke oge a, dị mfe nghọta ma dịkwa ugwu. E ji usoro “Ka … dịnyere …” chekwaa ọdịdị ngọzi nke ahịrịokwu Grik, nke na-enweghị ngwaa e dere kpọmkwem.
