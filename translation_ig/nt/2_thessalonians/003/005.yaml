- from: Ka Onyenwe anyị duzie obi unu banye n’ịhụnanya nke Chineke[a] na ntachi obi nke Mezaịa[b][c].
  to: Ka Onyenwe anyị duzie obi unu n’ịhụnanya nke Chineke[a] na n’ntachi obi nke Mezaịa[b][c].
  rationale: The revised prepositional construction is idiomatic Standard Igbo and maintains the Greek prayer’s figurative direction of the readers’ hearts. The revised alternative in footnote b more closely represents the objective possibility of τοῦ Χριστοῦ, while the main text continues to leave both disputed genitives unresolved.
