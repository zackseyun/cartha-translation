    text: A pụkwara ịsụgharị ya, “ịhụ Chineke n’anya.” Okwu Grik ahụ nwekwara ike ịpụta “ịhụnanya Chineke nwere.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “ntachi obi Mezaịa nwere,” ma ọ bụ “ntachi obi e nwere n’ebe Mezaịa nọ.”
    reason: alternative_reading
  - marker: c
    text: N’asụsụ Grik, “Kraịst”; a sụgharịrị ya “Mezaịa” n’ebe a n’ihi na okwu ahụ bụ utu aha nke pụtara “Onye E Tere Mmanụ.”
    reason: lexical_alternative
