id: 2TH.3.5
reference: 2 Thessalonians 3:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος κατευθύναι ὑμῶν τὰς καρδίας εἰς τὴν ἀγάπην τοῦ θεοῦ καὶ εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/003/005.yaml
  text: May the Lord direct your hearts into the love of God and into the steadfastness of Messiah[a][b][c].
translation:
  language: ig
  text: Ka Onyenwe anyị duzie obi unu n’ịhụnanya nke Chineke[a] na n’ntachi obi nke Mezaịa[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ịhụ Chineke n’anya.” Okwu Grik ahụ nwekwara ike ịpụta “ịhụnanya Chineke nwere.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “ntachi obi Mezaịa nwere,” ma ọ bụ “ntachi obi e nwere n’ebe Mezaịa nọ.”
    reason: alternative_reading
  - marker: c
    text: N’asụsụ Grik, “Kraịst”; a sụgharịrị ya “Mezaịa” n’ebe a n’ihi na okwu ahụ bụ utu aha nke pụtara “Onye E Tere Mmanụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Ọ bụ okwu Igbo a na-ejikarị asụgharị aha nsọ a; ọ na-echekwa ịdị arọ ya dị ka aha ọchịchị na nke Chineke n’akọwaghị onye a na-ekwu banyere ya karịa ihe ederede kwuru.
- source_word: κατευθύναι
  choice: duzie
  rationale: 'Ụdị ngwaa Grik a bụ ekpere ma ọ bụ ọchịchọ: “Ka ... duzie.” “Duzie” na-egosi iduga mmadụ n’ụzọ ziri ezi ma bụrụkwa okwu Igbo doro anya.'
- source_word: καρδίας
  choice: obi
  rationale: “Obi” na-echekwa ihe atụ Akwụkwọ Nsọ maka ebe echiche, ọchịchọ na mmetụta mmadụ si apụta, kama ịgbatị ya naanị ka ọ bụrụ “uche.”
- source_word: ἀγάπην
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ okwu Igbo nkịtị ma ziri ezi maka ἀγάπη.
- source_word: τοῦ θεοῦ
  choice: nke Chineke
  rationale: Nhazi “nke Chineke” na-anọ nso n’ụdị genitive Grik ma ghara ikpebi n’ahịrị bụ isi ma ọ bụ ịhụnanya Chineke nwere n’ebe mmadụ nọ, ịhụ Chineke n’anya, ma ọ bụ ịhụnanya sitere n’aka Chineke.
- source_word: ὑπομονὴν
  choice: ntachi obi
  rationale: “Ntachi obi” na-egosi ịnọgide na-eguzosi ike n’okpuru nsogbu ma bụrụ okwu ndị Igbo nke oge a na-aghọta nke ọma.
- source_word: τοῦ Χριστοῦ
  choice: nke Mezaịa
  rationale: “Mezaịa” na-egosi na Χριστός na-arụ ọrụ dị ka utu aha, ọ bụghị naanị aha mmadụ; “nke” na-echekwa mgbagwoju anya nke njikọ genitive ahụ.
theological_decisions:
- issue: Genitive nwere ihe karịrị otu nghọta na τὴν ἀγάπην τοῦ θεοῦ
  choice: ịhụnanya nke Chineke
  alternative: ịhụ Chineke n’anya; ịhụnanya Chineke nwere
  rationale: Grik nwere ike ịpụta ịhụnanya sitere n’aka Chineke ma ọ bụ ịhụnanya mmadụ nwere n’ebe Chineke nọ. Ahịrị bụ isi anaghị amanye otu nghọta.
- issue: Genitive nwere ihe karịrị otu nghọta na τὴν ὑπομονὴν τοῦ Χριστοῦ
  choice: ntachi obi nke Mezaịa
  alternative: ntachi obi Mezaịa nwere; ntachi obi n’ihi Mezaịa; ntachi obi yiri nke Mezaịa
  rationale: Nkebiokwu ahụ nwere ike izo aka na ntachi obi nke Mezaịa n’onwe ya, ntachi obi a na-enwe n’ihi ya, ma ọ bụ ntachi obi e ji àgwà ya mara; a hapụrụ esemokwu ahụ ghe oghe.
- issue: Nsụgharị Χριστοῦ dị ka utu aha
  choice: Mezaịa
  alternative: Kraịst; Onye E Tere Mmanụ
  rationale: N’ebe a Χριστός bụ utu aha. “Mezaịa” na-eme ka ọrụ ya dị ka utu aha pụta ìhè; nkọwa ala peeji na-egosi okwu Grik na ihe utu aha ahụ pụtara.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Ka ... duzie” na-egosipụta ekpere dị n’optative Grik; “banye n’...” na-echekwa ihe oyiyi nke εἰς ugboro abụọ n’enweghị Igbo siri ike ma ọ bụ nke na-adịghị eke. E debere “nke” n’ebe genitive abụọ dị ka ụzọ kacha nso isi ghara idozi mgbagwoju anya nkà mmụta okpukpe dị na Grik.
