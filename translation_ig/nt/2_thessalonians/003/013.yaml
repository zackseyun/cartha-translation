  yaml_path: translation/nt/2_thessalonians/003/013.yaml
  text: But as for you[a], brothers, do not grow weary in doing good.
translation:
  language: ig
  text: Ma unu onwe unu, ụmụnna[a], adịla ada mbà n’ime ezi ihe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ụmụnna nwoke na ụmụnna nwanyị”; okwu Grik a sụgharịrị “ụmụnna” kpọmkwem pụtara “ụmụnna nwoke,” ma n’ebe a ọ pụrụ ịkpọ ndị kwere ekwe niile, ma nwoke ma nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Ma unu onwe unu
  rationale: “Ma” na-egosi ọdịiche dị n’etiti ndị a na-agwa okwu na ndị na-adịghị achọ ịrụ ọrụ a kpọtụrụ aha n’amaokwu ndị bu ụzọ; “unu onwe unu” na-echekwa nkwusi ike nke nnọchiaha ὑμεῖς e butere n’ihu.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo sitere n’echiche ụmụnne ma bụrụkwa ụzọ nkwanye ùgwù e si akpọ ndị otu okwukwe; n’ebe a, ọ pụrụ ịgụnye ọgbakọ niile, ma nwoke ma nwaanyị.
- source_word: μὴ ἐγκακήσητε
  choice: ike agwụla unu
  rationale: Nkebi a bụ iwu na-asị ka ha ghara ịda mba ma ọ bụ kwụsị n’ihi ike ọgwụgwụ. “Ike agwụla unu” bụ okwu Igbo doro anya nke na-egosi ịghara ịgwụ ike n’ịga n’ihu.
- source_word: καλοποιοῦντες
  choice: n’ime ezi ihe
  rationale: Ọ na-egosi ọrụ ọma a na-eme na-aga n’ihu, bụ́ ebe ha na-ekwesịghị ikwe ka ike gwụ ha. “N’ime ezi ihe” bụ ntụgharị eke ma gụnye ime ihe ọma n’ozuzu ya.
theological_decisions:
- issue: Otú e si sụgharịta ἀδελφοί mgbe a na-agwa ọgbakọ okwu
  choice: ụmụnna
  alternative: ụmụnna nwoke na ụmụnna nwaanyị
  rationale: Ụdị Grik ahụ bụ aha ọtụtụ nke nwoke, ma n’akwụkwọ ozi Pọl ọ na-akpọkarị ọgbakọ niile, gụnyere ụmụ nwaanyị. “Ụmụnna” na-echekwa ụdị okwu e ji akpọ ndị otu ezinụlọ okwukwe, ebe nkọwa ala peeji na-eme ka njụnye ya doo anya n’enweghị ịgbatị isiokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. Usoro “Ma unu onwe unu” na-eme ka ọdịiche na nkwusi ike dị n’Grik pụta ìhè; iwu “ike agwụla unu” na-ada ka ndụmọdụ siri ike ma bụrụkwa okwu ndị nkịtị ga-aghọta.
