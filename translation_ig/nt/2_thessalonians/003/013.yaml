    reason: lexical_alternative
  revision_rationale: The revision changes the declarative “ike agwụla unu” to the negative prohibitive “adịla ada mbà,” accurately reflecting μὴ ἐγκακήσητε without narrowing its sense solely to physical tiredness. It retains the marked contrast and emphasis in “Ma unu onwe unu,” the customary congregational address “ụmụnna,” and the ongoing activity expressed by “n’ime ezi ihe.”
