id: 2TH.2.3
reference: 2 Thessalonians 2:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ⸀ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/003.yaml
  text: Let no one deceive you in any way[a], because that day will not come unless the rebellion comes first and the man of lawlessness is revealed[b], the son of destruction.
translation:
  language: ig
  text: Ka onye ọ bụla ghara iduhie unu n’ụzọ ọ bụla, n’ihi na ụbọchị ahụ agaghị abịa ruo mgbe nnupụisi ahụ[a] ga-ebu ụzọ bịa, a ga-ekpughekwa nwoke nke mmebi iwu ahụ[b], nwa mbibi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ndapụ n’okwukwe” ma ọ bụ “ịhapụ okwukwe ahụ.” Okwu Grik a nwere ike ịpụta nnupụisi dị ukwuu; a na-aghọtakarịkwa ya dị ka ndapụ n’okwukwe.
    reason: alternative_reading
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie nwere “nwoke nke mmehie ahụ” kama “nwoke nke mmebi iwu ahụ.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐξαπατήσῃ
  choice: iduhie
  rationale: “Iduhie” bụ okwu Igbo dị ugbu a ma doo anya maka ime ka mmadụ kwenye n’ihe na-abụghị eziokwu; ọ dabara n’ịdọ aka ná ntị a n’ebughị ibu karịa ihe ngwaa Grik ahụ kwuru.
- source_word: κατὰ μηδένα τρόπον
  choice: n'ụzọ ọ bụla
  rationale: 'Nkebi okwu a na-eme ka mmachibido ahụ sie ike: a gaghị ekwe ka onye ọ bụla duhie ha, n’agbanyeghị ụzọ e si mee ya.'
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a, ὅτι na-ewebata ihe mere e ji nye ịdọ aka ná ntị ahụ; “n’ihi na” na-egosi njikọ echiche ahụ nke ọma.
- source_word: ἐὰν μὴ ἔλθῃ
  choice: agaghị abịa ma ọ bụrụ na ... ebughị ụzọ bịa
  rationale: Usoro a na-egosi ihe ndị ga-emerịrị tupu ụbọchị ahụ abịa. E tinyere “ụbọchị ahụ” site n’amaokwu bu ụzọ iji mee ka Igbo doo anya.
- source_word: ἀποστασία
  choice: nnupụisi ahụ
  rationale: Okwu ahụ nwere ike ịpụta nnupụisi, mgbapụ, ma ọ bụ ịhapụ okwukwe. “Nnupụisi” na-edebe echiche sara mbara nke ịjụ ọchịchị n’akọwaghị ya ozugbo dị ka ndapụ n’okpukpe; ihe ọzọ o nwere ike ịpụta dị n’ala ala peeji.
- source_word: πρῶτον
  choice: ebughị ụzọ
  rationale: 'Nke a na-egosi usoro oge n’ụzọ Igbo si ekwu ya nke ọma: nnupụisi ahụ ga-ebu ụzọ bịa.'
- source_word: ἀποκαλυφθῇ
  choice: e kpugheekwa
  rationale: Ụdị nnara ahụ na-egosi na a ga-eme ka onye ahụ pụta ìhè. “Kpughee” na-edebe echiche nke ikpughe ihe zoro ezo.
- source_word: ὁ ἄνθρωπος τῆς ἀνομίας
  choice: nwoke mmebi iwu ahụ
  rationale: A sụgharịrị ἀνομία dị ka “mmebi iwu,” ma debe “nwoke” n’ihi na okwu Grik ahụ bụ otu onye nke nwoke a kapịrị ọnụ.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: nwa mbibi
  rationale: “Nwa mbibi” na-edebe ụdị akpaala okwu Semitic nke Grik, nke nwere ike ịkọwa onye mbibi ji mara ma ọ bụ onye e kpebiri na mbibi ga-adakwasị.
theological_decisions:
- issue: Itinye onye a na-ekwu na ọ ga-abịa, nke Grik hapụrụ n’ihi amaokwu bu ụzọ
  choice: E tinyere “ụbọchị ahụ” n’ahịrịokwu
  alternative: 'Ịhapụ ya dị ka Grik: “n’ihi na ọ bụrụ na nnupụisi ahụ ebughị ụzọ bịa...”'
  rationale: Amaokwu nke abụọ mere ka o doo anya na ihe a na-ekwu bụ ụbọchị Onyenwe anyị. Itinye “ụbọchị ahụ” na-eme ka Igbo zuo oke ma doo anya, n’etinyeghị echiche ọhụrụ.
- issue: Ihe ἀποστασία pụtara
  choice: nnupụisi ahụ
  alternative: ịhapụ okwukwe ahụ; ndapụ ahụ
  rationale: Okwu a nwere ike ịpụta nnupụisi n’ozuzu ya ma ọ bụ ndapụ n’okwukwe. Isi ederede ji okwu sara mbara mee ka a ghara idozi esemokwu nkọwa banyere ihe ga-eme n’oge ikpeazụ n’ụzọ a na-amanye amanye.
- issue: Ọgụgụ ederede na τῆς ἀνομίας
  choice: mmebi iwu
  alternative: mmehie
  rationale: SBLGNT e nyere nwere ἀνομίας, ya mere isi ederede soro “mmebi iwu.” E debere ọgụgụ “mmehie” nke ụfọdụ akwụkwọ aka ochie nwere n’ala ala peeji.
- issue: Ihe akpaala okwu “nwa mbibi” na-egosi
  choice: 'E debere ụdị akpaala okwu ahụ: “nwa mbibi”'
  alternative: onye mbibi ga-adakwasị
  rationale: Ụdị a na-echekwa ma echiche nke àgwà e ji mara onye ahụ ma echiche nke njedebe mbibi ya, kama ịhọrọ naanị otu n’ime ha.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E zere okwu ụka nke otu ụka pụrụ iche. “Ya bụ” na-eme ka njikọ dị n’etiti “nwoke mmebi iwu ahụ” na “nwa mbibi” doo anya n’Igbo, ebe a ka na-edebe ike na ihe omimi nke aha abụọ ahụ.
