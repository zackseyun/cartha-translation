    text: Ma ọ bụ “ndapụ n’okwukwe” ma ọ bụ “ịhapụ okwukwe ahụ.” Okwu Grik a nwere ike ịpụta nnupụisi dị ukwuu; a na-aghọtakarịkwa ya dị ka ndapụ n’okwukwe.
    reason: alternative_reading
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie nwere “nwoke nke mmehie ahụ” kama “nwoke nke mmebi iwu ahụ.”
    reason: textual_variant
  revision_rationale: 'The revision clarifies the Greek ἐὰν μὴ sequence in idiomatic Standard Igbo: the day will not come until the rebellion comes first and the man of lawlessness is revealed. It retains the supplied “ụbọchị ahụ,” which is warranted by the immediate preceding context; preserves the broad, non-sectarian “nnupụisi”; follows SBLGNT’s “mmebi iwu”; and maintains both footnote anchors and their purposes. The appositional “nwa mbibi” is retained without doctrinally narrowing its force.'
