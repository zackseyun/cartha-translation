revisions:
- from: Ọbịbịa ya ga-abụ dịka ọrụ Setan si dị, ya na ike niile, ihe ịrịba ama na ọrụ ebube nke ụgha.[a][b]
  to: Ọbịbịa ya bụ n’usoro ọrụ Setan, ya na ike niile, ihe ịrịba ama na ọrụ ebube nke ụgha.[a][b]
  rationale: The revision removes the unsupported future tense and renders κατ’ ἐνέργειαν as “n’usoro ọrụ Setan,” preserving the sense of accordance with Satan’s activity. The final genitive expression remains “nke ụgha,” which neither reduces the signs and wonders to counterfeit tricks nor asserts a particular metaphysical account. The footnotes are adjusted to be genuine alternatives and to match the source tense.
