  text: whose coming is according to the working of Satan[b][a], with all power and signs and wonders of falsehood.
translation:
  language: ig
  text: Ọbịbịa ya bụ n’usoro ọrụ Setan, ya na ike niile, ihe ịrịba ama na ọrụ ebube nke ụgha.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ọnụnọ ya ma ọ bụ mbata ya dị n’usoro ọrụ Setan.”'
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịghọta akụkụ ikpeazụ ahụ dịka: “ọrụ ebube ndị na-eduhie eduhie.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ ἐστιν ἡ παρουσία
  choice: Ọbịbịa ya ga-abụ
  rationale: οὗ na-ezo aka n'onye ahụ na-emebi iwu e kwuru banyere ya n'amaokwu bu ụzọ; παρουσία n'ọnọdụ a pụtara ọbịbịa ya, ọ bụghị naanị ịnọ ya.
- source_word: κατ’ ἐνέργειαν τοῦ Σατανᾶ
  choice: dịka ọrụ Setan si dị
  rationale: Nke a na-egosi na ụdị na ụzọ ọbịbịa ahụ si arụ ọrụ dabara n'ọrụ Setan; ọ naghị akọwa karịa ihe Grik kwuru.
- source_word: ἐν πάσῃ δυνάμει
  choice: ya na ike niile
  rationale: ἐν ebe a na-egosi ihe so ọbịbịa ahụ; 'ike niile' na-edobe δυνάμει n'echiche sara mbara n'emeghị ya naanị 'ọrụ ebube.'
- source_word: σημείοις καὶ τέρασιν
  choice: ihe ịrịba ama na ọrụ ebube
  rationale: Ndị a bụ okwu Igbo doro anya maka ihe ndị pụrụ iche e ji egosi ma ọ bụ kpalite ịtụnanya.
- source_word: ψεύδους
  choice: nke ụgha
  rationale: Genitive a na-akọwa ihe ndị ahụ dịka ndị e ji ụgha mara ma ọ bụ ndị na-arụ ọrụ n'ịghọgbu; ọ naghị ekpebi ma ha bụ aghụghọ nkịtị ka ha bụ ihe nwere ike karịrị mmadụ.
theological_decisions:
- issue: Ụdị ike, ihe ịrịba ama na ọrụ ebube ndị a
  choice: E debere 'nke ụgha' ka ọ kọwaa ihe ngosi ndị a dịka ihe jikọrọ ya na ụgha na nduhie.
  alternative: Ịsụgharị ya dịka 'ọrụ ebube adịgboroja' ma ọ bụ kwuo hoo haa na ha bụ ezi ọrụ ebube sitere n'aka Setan.
  rationale: Grik anaghị ekpebi ma ihe ndị a bụ naanị aghụghọ adịgboroja ma ọ bụ ihe karịrị mmadụ n'ezie; ya mere nsụgharị ahụ na-edobe esemokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. 'Ọbịbịa' dabara n'ọnọdụ amụma banyere mbata onye ahụ; 'ọrụ Setan' na 'nke ụgha' na-edobe okwu isi mmalite n'enweghị itinye nkọwa otu ụka.
