  text: Do you not remember that while I was still with you, I was telling you these things?
translation:
  language: ig
  text: Ùnu echetaghị na mgbe m ka nọnyere unu, m na-agwa unu ihe ndị a?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνημονεύετε
  choice: echetaghị
  rationale: N’ahịrị ajụjụ na-adịghị ekweta, “Ùnu echetaghị...?” na-ajụ ma ha ka na-echeta ihe a kụziiri ha. Ọ bụ ụzọ Igbo doro anya ma dịkwa ndụ si kwuo ajụjụ a.
- source_word: ἔτι
  choice: ka
  rationale: '“Ka” na-egosi na ọnọdụ ahụ gara n’ihu ruo oge ahụ: Pọl ka nọnyere ha.'
- source_word: ὢν πρὸς ὑμᾶς
  choice: mgbe m ka nọnyere unu
  rationale: Nkebi a na-egosi oge na ọnụnọ Pọl n’etiti ha. “Nọnyere unu” bụ okwu Igbo ebumpụta ụwa maka ịnọ mmadụ nso ma ọ bụ ịnọ n’etiti ha.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nke a na-edobe ọtụtụ ihe nke okwu Grik ahụ na-arụtụ aka na ha, ya bụ, ihe ndị Pọl nọ na-akụziri ha n’okwu gbara amaokwu a gburugburu.
- source_word: ἔλεγον
  choice: m na-agwa unu
  rationale: Ụdị imperfect Grik na-egosi omume gara n’ihu ma ọ bụ nke e mere ugboro ugboro n’oge gara aga. N’ọnọdụ oge nke “mgbe m ka nọnyere unu,” “m na-agwa unu” na-eburu nghọta ahụ n’Igbo n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: οὐ ... ὅτι
  choice: Ùnu echetaghị na ...?
  rationale: Usoro a na-edobe ajụjụ na-adịghị ekweta na njikọ “na” nke na-ewebata ihe ha kwesịrị icheta.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ “ihe ndị a” ka ọ ghara ịkọwapụta ihe amaokwu ahụ n’onwe ya na-akọwaghị, ma e debere ajụjụ ahụ dịka ajụjụ Pọl ji akpalite ncheta ha.
