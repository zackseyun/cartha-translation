translation:
  language: ig
  text: ka ọ gbaa obi unu ume[a], meekwa ka unu guzosie ike[b] n’ọrụ ọma ọ bụla na n’okwu ọma ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka ọ kasie obi unu” ma ọ bụ “ka ọ dụọ unu ọdụ”; παρακαλέσαι nwekwara ike ibu echiche ndị a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “mee ka unu sie ike” ma ọ bụ “mee ka unu guzosie ike nke ọma,” n’ọrụ ọma ọ bụla na n’okwu ọma ọ bụla.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: gbaa obi unu ume
  rationale: N’Igbo nkebiokwu a na-egosi ịgba ume n’ụzọ sara mbara; ọ dabara n’ekpere a ma na-ahapụkwa echiche nkasi obi na ndụmọdụ siri ike ka ha dị nso.
- source_word: καρδίας
  choice: obi
  rationale: “Obi” na-echekwa ihe atụ Akwụkwọ Nsọ nke na-ezo aka n’ime mmadụ, ọ bụghị naanị mmetụta uche.
- source_word: στηρίξαι
  choice: mee ka unu guzosie ike
  rationale: Nke a na-egosi ime ka mmadụ sie ike ma guzosie ike; ọ bụkwa okwu Igbo doro anya ma dị ndụ.
- source_word: ἐν παντὶ
  choice: n’... niile
  rationale: Ọ na-egosi ebe ma ọ bụ akụkụ ndụ nke ime ka ha guzosie ike metụtara, ebe “niile” na-eburu echiche nkesa nke παντί.
- source_word: ἔργῳ
  choice: ọrụ
  rationale: “Ọrụ” bụ ntụgharị nkịtị nke ἔργον ma na-agụnye omume ma ọ bụ ihe mmadụ na-eme.
- source_word: λόγῳ
  choice: okwu
  rationale: N’usoro ya na “ọrụ,” “okwu” na-ezo aka n’ihe mmadụ na-ekwu ma na-echekwa njikọ dị mkpirikpi nke okwu Grik.
- source_word: ἀγαθῷ
  choice: ọma
  rationale: “Ọma” na-akọwa ma ọrụ ma okwu n’ụzọ kpọmkwem ma sara mbara.
- source_word: ὑμῶν
  choice: unu
  rationale: 'Ọ bụ nnọchiaha onye nke abụọ ọtụtụ, nke jikọrọ ya na “obi”: “obi unu.”'
- source_word: καὶ
  choice: ma / na
  rationale: 'A sụgharịrị njikọ ndị ahụ n’ụzọ dabara n’usoro ụtọasụsụ Igbo: “meekwa” maka ijikọ ngwaa, “na” maka ijikọ ọrụ na okwu.'
theological_decisions:
- issue: Ma a ga-akọwa καρδία dị ka uche ma ọ bụ mmetụta uche naanị
  choice: obi
  alternative: ime mmadụ; uche
  rationale: “Obi” na-echekwa ihe atụ Akwụkwọ Nsọ na ịdị obosara nke okwu ahụ, kama ime ka ọ bụrụ naanị uche ma ọ bụ mmetụta.
- issue: Ma στηρίξαι kwesịrị ịbụ naanị “mee ka o sie ike” ma ọ bụ okwu na-egosi iguzosi ike
  choice: mee ka unu guzosie ike
  alternative: mee ka unu sie ike; mee ka unu guzosie ike kpamkpam
  rationale: Nhọrọ a na-eburu echiche ime ka ha sie ike ma kwụsie ike, n’enweghị itinye nkọwa okpukpe ọzọ.
- issue: Mmekọrịta ἀγαθῷ na ἔργῳ καὶ λόγῳ
  choice: ọrụ ọma na okwu ọma niile
  alternative: ọrụ na okwu ọma niile
  rationale: Ikwughachi “ọma” na Igbo na-eme ka o doo anya na ọ na-akọwa ma ọrụ ma okwu, dịka echiche Grik si dị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere “obi” dịka ihe atụ Akwụkwọ Nsọ, ma jiri “guzosie ike” mee ka echiche nke στηρίζω pụta n’ụzọ okike n’Igbo.
