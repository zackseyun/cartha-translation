  text: τὸ γὰρ μυστήριον ἤδη ἐνεργεῖται τῆς ἀνομίας· μόνον ὁ κατέχων ἄρτι ἕως ἐκ μέσου γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/007.yaml
  text: For the mystery of lawlessness is already at work[b][a]; only the one who now restrains will do so until he is out of the way.
translation:
  language: ig
  text: N’ihi na ihe omimi nke imebi iwu na-arụrịrị ọrụ. Naanị, onye ahụ na-egbochi ugbu a ga-anọgide na-egbochi, ruo mgbe ọ ga-apụ n’ụzọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘ruo mgbe a ga-ewepụ ya’ ma ọ bụ ‘ruo mgbe a ga-ewepụ ya n’ụzọ.’ Grik ahụ akọwaghị nke ọma otú nke a ga-esi mee.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: ihe omimi
  rationale: Nke a na-egosi eziokwu zoro ezo nke na-arụ ọrụ ugbu a, ọ bụghị naanị ihe mgbagwoju anya a ga-edozi.
- source_word: ἐνεργεῖται
  choice: amalitelarị ịrụ ọrụ
  rationale: Ọ na-egosi na ọrụ ahụ amalitela ma na-aga n’ihu ugbu a.
- source_word: ἀνομίας
  choice: imebi iwu
  rationale: Nke a na-echekwa echiche bụ isi nke ἀνομία—ịjụ ma ọ bụ imebi iwu—ma na-ada nke ọma n’Igbo nke oge a.
- source_word: μόνον
  choice: ma
  rationale: N’ebe a μόνον na-ewebata ihe na-egbochi ma ọ bụ na-amachi ihe e kwuru tupu ya; ‘ma’ na-eme ka nkebi ahịrịokwu ahụ bụrụ nke doro anya n’Igbo.
- source_word: ὁ κατέχων
  choice: onye ahụ na-egbochi ya
  rationale: Ọ na-echekwa ọrụ onye ahụ dị ka onye na-egbochi, n’akọwaghị onye ọ bụ.
- source_word: ἄρτι
  choice: ugbu a
  rationale: Ọ na-egosi na ọrụ igbochi ahụ na-eme n’oge a.
- source_word: ἕως ἐκ μέσου γένηται
  choice: ruo mgbe ọ ga-anọkwaghị n’etiti
  rationale: Nke a na-egosi na onye ahụ agaghịzi anọ n’etiti ma ọ bụ n’ọnọdụ igbochi, ma ọ naghị ekwu onye ma ọ bụ ihe mere ka nke a mee.
theological_decisions:
- issue: Onye ὁ κατέχων bụ
  choice: A sụgharịrị ya n’ozuzu dịka ‘onye ahụ na-egbochi ya ugbu a,’ n’akọwaghị onye ọ bụ.
  alternative: Ọchịchị Rom, ọchịchị mmadụ, Mmụọ Nsọ, mmụọ ozi, Pọl, ma ọ bụ nkwusa ndịozi.
  rationale: Amaokwu Grik ahụ ekwughị onye na-egbochi ya bụ; ya mere, nsụgharị ahụ kwesịrị ịhapụ ajụjụ a ka ọ dị.
- issue: Onye na-eme ka ὁ κατέχων pụọ n’etiti
  choice: ‘Ruo mgbe ọ ga-anọkwaghị n’etiti’ anaghị akpọ onye mere ka ọ pụọ.
  alternative: ‘Ruo mgbe a ga-ewepụ ya’ ma ọ bụ ‘ruo mgbe a ga-ewepụ ya n’ụzọ.’
  rationale: Grik ahụ anaghị ekwu hoo haa na onye ọzọ ga-ewepụ ya; okwu a họọrọ na-echekwa enweghị nkọwa ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. ‘Ihe omimi’ na-echekwa asụsụ nkà mmụta okpukpe Pọl, ebe ‘imebi iwu’ na-eme ka ἀνομία doo onye na-agụ ya anya. E zere ịkọwa onye na-egbochi ya ma ọ bụ onye ga-eme ka ọ pụọ.
