  text: εἰς ⸀ὃ ἐκάλεσεν ὑμᾶς διὰ τοῦ εὐαγγελίου ἡμῶν, εἰς περιποίησιν δόξης τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/014.yaml
  text: to which he called you through our gospel[b][a], for obtaining the glory of our Lord Jesus the Messiah.
translation:
  language: ig
  text: Ọ bụ nke a ka o ji oziọma anyị kpọọ unu, ka unu nweta ebube nke Onyenwe anyị Jizọs, bụ́ Mesaya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ ọdịnala, “Jizọs Kraịst.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị “ka unu nweta ebube” dịka “ka ebube bụrụ nke unu” ma ọ bụ “ka unu keta oke n’ebube nke Onyenwe anyị Jizọs, bụ́ Mesaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Ọ bụ nke a ka
  rationale: Nkebi a na-arụtụ aka n’ihe e kwuru n’amaokwu gara aga—nzọpụta na ido nsọ—ma na-egosikwa ihe Chineke kpọrọ ha baa na ya, n’enweghị ịkọwa ihe a na-arụtụ aka karịa otú Grik si kwuo ya.
- source_word: ἐκάλεσεν ὑμᾶς
  choice: o ... kpọọ unu
  rationale: “Kpọọ” bụ okwu Igbo sara mbara nke na-echekwa ike okwu Pọl n’ebe nzọpụta dị, ma ọ naghị etinye nkọwa otu ụka banyere otú ọkpụkpọ Chineke si arụ ọrụ.
- source_word: διὰ τοῦ εὐαγγελίου ἡμῶν
  choice: site n’oziọma anyị
  rationale: “Site n’” na-egosi ụzọ ma ọ bụ ihe e ji kpọọ ha. “Oziọma anyị” na-echekwa akpaokwu Pọl; ọ pụtara oziọma ndị ozi kwusara, ọ bụghị oziọma ọzọ nke ha nwe.
- source_word: εἰς περιποίησιν
  choice: ka unu nweta
  rationale: “Nweta” na-egosipụta ebumnuche nke εἰς ma na-ekpuchi nghọta περιποίησις dịka inweta ma ọ bụ iketa ihe, n’Igbo dị mfe ma kwụ ọtọ.
- source_word: δόξης τοῦ κυρίου ἡμῶν
  choice: ebube nke Onyenwe anyị
  rationale: “Ebube” bụ okwu Igbo kwesịrị ekwesị maka δόξα n’ebe a; “Onyenwe anyị” na-echekwa aha nsọpụrụ κύριος na njikọ genitiv ahụ.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ́ Mesaya
  rationale: “Mesaya” na-eme ka ọrụ Χριστός dịka aha ọkwá pụta ìhè. “Bụ́” na-eme ka ya bụrụ Igbo sitere n’ọnụ ma doo anya na Mesaya bụ aha ọkwá Jizọs.
theological_decisions:
- issue: Ụdị ọkpụkpọ Chineke n’ihe gbasara nzọpụta
  choice: “o ... kpọọ unu”
  alternative: “o kpọrọ unu n’ụzọ na-arụpụta nzọpụta” ma ọ bụ “o kpọrọ unu oku”
  rationale: E debeghị “na-arụpụta nzọpụta” ma ọ bụ “kpọrọ oku” n’ihi na nke mbụ na-ekpebi arụmụka nkà mmụta okpukpe, nke abụọ nwekwara ike ime ka okwu ahụ bụrụ nanị òkù mmadụ nwere ike ileghara anya. “Kpọọ” na-echekwa esemokwu dị n’ederede.
- issue: Ihe περιποίησις δόξης pụtara
  choice: “ka unu nweta ebube”
  alternative: “ka ebube bụrụ nke unu” ma ọ bụ “ka unu soro ... kerịta ebube”
  rationale: Okwu Grik nwere ike ịpụta inweta ma ọ bụ inwe dịka ihe onwunwe. Isi ederede jiri “nweta” mee ka ebumnuche pụta ìhè, ebe ndetu na-echekwa ụzọ nghọta ndị ọzọ.
- issue: Nsụgharị Χριστοῦ
  choice: “Mesaya”
  alternative: “Kraịst”
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dịka aha ọkwá. E tinyere nsụgharị ọdịnala “Kraịst” na ndetu kama iwepụ ya kpamkpam.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro “Ọ bụ nke a ka ...” na-eme ka ntụaka εἰς ὃ pụta ìhè; “site n’oziọma anyị” na-anọgide nso n’usoro Grik. E debere akara ndetu [a] na [b] ozugbo n’isi ederede.
