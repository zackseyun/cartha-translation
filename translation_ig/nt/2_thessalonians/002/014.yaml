    issue: “si n’oziọma anyị”
    rationale: N’akụkụ a, διά na genitive pụtara ụzọ/ngwá ọrụ (‘through’), ọ bụghị isi ebe ihe malitere (‘from’). “Ji oziọma anyị” bụ nkwekọrịta Igbo kwesịrị ekwesị.
  - severity: low
    issue: Nkọwa ‘kerịta ebube’ n’ndetu b
    rationale: “Soro Onyenwe anyị ... kerịta ebube” nwere ike ịpụta na ha na Onyenwe anyị na-ekekọrịta ebube n’etiti ha. “Keta oke n’ebube” na-echekwa echiche ‘share in the glory’ n’enweghị nghọtahie ahụ.
