review_pass:
  verdict: revise
  source_fidelity: A chọrọ ndozi nta. “o si n’oziọma anyị kpọọ unu” na-egosi ebe mmalite (‘from our gospel’) karịa ụzọ ma ọ bụ ngwá ọrụ nke διὰ τοῦ εὐαγγελίου ἡμῶν. “o ji oziọma anyị kpọọ unu” na-egosi ‘through/by means of our gospel’ n’Igbo nke ọma. Ihe ndị ọzọ na-echekwa nzube εἰς ὃ na εἰς περιποίησιν, yana ‘ebube nke Onyenwe anyị Jizọs, bụ́ Mesaya.’
  naturalness: Usoro e degharịrị, “Ọ bụ nke a ka o ji oziọma anyị kpọọ unu,” dị nfe ma bụrụ Standard Igbo ebumpụta ụwa. A gbanwere nhọrọ nke abụọ n’ndetu b ka ọ ghara ịdị ka ndị kwere ekwe na Onyenwe anyị na-ekekọrịta otu ebube n’etiti ha, kama ka o gosipụta ‘to share in the glory.’
  terminology: “o kpọọ unu,” “oziọma,” “ebube,” “Onyenwe anyị,” na “Mesaya” dabara n’akwụkwọ nsọ na Standard Igbo. Ndetu a na-edobe “Jizọs Kraịst” dịka nsụgharị ọdịnala nke Χριστοῦ.
  issues:
