  rationale: The revision keeps the neutral wording for κριθῶσιν while making “hụrụ ajọ omume n’anya” a description of the same “ndị niile” who rejected the truth. “Kama nke ahụ” explicitly conveys the Greek adversative ἀλλά without altering its force.
