source:
  edition: SBLGNT
  text: ἵνα κριθῶσιν ⸀πάντες οἱ μὴ πιστεύσαντες τῇ ἀληθείᾳ ἀλλὰ εὐδοκήσαντες ⸀τῇ ἀδικίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/012.yaml
  text: so that all may be judged who did not believe the truth but took pleasure in unrighteousness[a].
translation:
  language: ig
  text: ka e wee kpee ndị niile na-ekweghị n’eziokwu ikpe, ndị kama nke ahụ hụrụ ajọ omume n’anya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka e wee maa ha ikpe.” N’ọnọdụ a, ngwaa Grik ahụ nwere ike ịpụta ikpe na-adịghị mma, ọ bụ ezie na ihe ọ pụtara n’ụzọ nkịtị karị bụ “ikpe ikpe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka e wee
  rationale: Na-egosi nzube ma ọ bụ ihe si n’ihe e kwuru tupu ya pụta, n’ebughị ụzọ kpebie nke ọ bụ naanị ya.
- source_word: κριθῶσιν
  choice: kpee ... ikpe
  rationale: Na-echekwa isi echiche nke ikpe ikpe; ihe gbara amaokwu ahụ gburugburu na-egosi na ikpe ahụ adịghị mma, ma okwu Grik n’onwe ya ekwughị ‘maa ha ikpe’ kpọmkwem.
- source_word: πάντες
  choice: ndị niile
  rationale: Na-egosi mmadụ niile so n’òtù ndị participle ndị na-esonụ kọwara.
- source_word: οἱ μὴ πιστεύσαντες
  choice: ndị ... na-ekweghị
  rationale: Ọ bụ ụzọ Igbo dị ire ụtọ isi sụgharịa participle a ji mee aha; ‘ikweta’ dabara n’ihi na ihe a na-ekwetaghị bụ eziokwu.
- source_word: τῇ ἀληθείᾳ
  choice: n’eziokwu
  rationale: Na-egosi eziokwu ahụ a kapịrị ọnụ, nke n’ọnọdụ a na-ezo aka n’eziokwu nke ozi ọma.
- source_word: ἀλλὰ
  choice: kama
  rationale: Na-egosi ọdịiche siri ike n’etiti ịjụ eziokwu na inwe mmasị n’ajọ omume.
- source_word: εὐδοκήσαντες
  choice: ihe na-atọ ha ụtọ bụ
  rationale: Na-egosi ma mmasị obi ma nnabata mmadụ ji ọchịchọ ya nye ihe ahụ, ọ bụghị naanị echiche na ọ dị mma.
- source_word: τῇ ἀδικίᾳ
  choice: ajọ omume
  rationale: Okwu Igbo a bụ nke mmadụ nkịtị na-aghọta nke ọma ma na-eburu echiche sara mbara nke omume na-adịghị ezi omume, ọ bụghị naanị ikpe na-ezighị ezi.
theological_decisions:
- issue: Ma κριθῶσιν ga-abụ ‘kpee ikpe’ ka ọ bụ okwu siri ike karị nke pụtara ‘maa ikpe.’
  choice: kpee ... ikpe
  alternative: maa ... ikpe
  rationale: Ọnọdụ okwu ahụ na-egosi ikpe na-adịghị mma, ma κρίνω n’onwe ya pụtara ikpe ikpe n’ụzọ sara mbara. Ya mere, isi ederede na-echekwa obosara na esemokwu dị n’okwu Grik, ebe nkọwa ala peeji na-egosi ihe ọzọ nwere ike ịbụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. A họọrọ ‘ajọ omume’ kama okwu Igbo e mere kpọmkwem site na ‘unrighteousness,’ iji zere asụsụ siri ike ma chekwaa obosara nke ἀδικία.
