id: 2TH.2.2
reference: 2 Thessalonians 2:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς ⸀μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι’ ἐπιστολῆς ὡς δι’ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/002.yaml
  text: that you not be quickly shaken from your mind or alarmed[a], either by a spirit or by a message or by a letter as if from us[b], to the effect that the day of the Lord has come.
translation:
  language: ig
  text: ka obi unu ghara ịma jijiji ngwa ngwa n’echiche unu kwụsiri ike, ka ụjọ ghara ịtụkwa unu, ma ọ bụ site na mmụọ, ma ọ bụ site n’ozi ọnụ, ma ọ bụ site n’akwụkwọ ozi dị ka a ga-asị na o si n’aka anyị, sị na ụbọchị Onyenwe anyị abịala[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’okwu sitere n’ike mmụọ” ma ọ bụ “site ná mkpughe amụma.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dị ugbu a.” Okwu Grik a dị n’ụdị perfect nwere ike ịpụta na a na-ekwu na ụbọchị Onyenwe anyị eruolarị, na ọ dịkwa ugbu a.
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: ngwa ngwa
  rationale: Ọ na-egosi na a na-adọ ha aka ná ntị ka ha ghara ikwe ka e mee ka ha maa jijiji ozugbo.
- source_word: σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς
  choice: ka obi unu ghara ịdịkwa jụụ
  rationale: Nkebi okwu Grik a na-ekwu maka ime ka mmadụ tufuo obi iru ala ma ọ bụ echiche ya kwụsiri ike; nsụgharị a bụ Igbo eke nke na-edobe echiche ahụ n’enweghị ịkọwa ya gabiga ókè.
- source_word: θροεῖσθαι
  choice: ka ụjọ jide unu
  rationale: Okwu a pụtara inwe nnukwu nchegbu ma ọ bụ ịma jijiji n’ihi egwu; okwu Igbo a na-egosipụta ike mmetụta ahụ nke ọma.
- source_word: πνεύματος
  choice: mmụọ
  rationale: A hapụrụ okwu ahụ n’ụdị sara mbara dịka Grik si dị, ka ọ ghara ikpebi n’ime amaokwu ahụ ma ọ bụ mmụọ n’onwe ya, okwu sitere n’ike mmụọ, ma ọ bụ mkpughe amụma.
- source_word: λόγου
  choice: ozi ọnụ
  rationale: N’ihi na e tinyere ya n’akụkụ akwụkwọ ozi, o yikarịrị ka ọ bụ ozi e kwuru ọnụ; nke a doro onye Igbo anya karịa naanị ‘okwu.’
- source_word: ἐπιστολῆς
  choice: akwụkwọ ozi
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka ozi e dere ezigara mmadụ.
- source_word: ὡς δι’ ἡμῶν
  choice: e kwuru na o si n’aka anyị
  rationale: Ọ na-egosi na e mere ka ozi ahụ yie nke Pọl na ndị ya zitere, n’agbanyeghị na a na-enwe obi abụọ banyere nkwupụta ahụ.
- source_word: ἐνέστηκεν
  choice: abịala
  rationale: Perfect Grik na-egosi mbata nke rụpụtara ọnọdụ dị ugbu a—ya bụ, nkwupụta na ụbọchị ahụ eruolarị ma dị ugbu a; e debere akụkụ nke abụọ na nkọwa ala peeji.
- source_word: ἡμέρα τοῦ κυρίου
  choice: ụbọchị Onyenwe anyị
  rationale: Nke a bụ okwu gbasara ụbọchị ikpeazụ nke Chineke, ọ bụghị ụbọchị ofufe kwa izu; ‘Onyenwe anyị’ bụ nsụgharị kwesịrị ekwesị nke κύριος n’ebe a.
theological_decisions:
- issue: Ihe ἐνέστηκεν pụtara n’okwu banyere ụbọchị Onyenwe anyị
  choice: abịala
  alternative: dị ugbu a; eruolarị
  rationale: ‘Abịala’ na-egosipụta ma mbata ma nsonaazụ ya dị ugbu a. N’ihi na ‘dị ugbu a’ nwere ike imetụta nghọta banyere ihe ikpeazụ, e debere ya na nkọwa ala peeji kama iwepụ ya.
- issue: Ihe πνεύματος pụtara n’usoro ụzọ atọ e kwuru na ozi ahụ si bịa
  choice: mmụọ
  alternative: okwu sitere n’ike mmụọ; mkpughe amụma
  rationale: Okwu Grik enweghị article, ọnọdụ ya nwekwara ike izo aka n’ozi amụma a sị na e nyere site n’ike mmụọ, ọ bụghị naanị Mmụọ Nsọ n’onwe ya. Isi amaokwu ahụ na-edobe okwu sara mbara, ebe nkọwa ala peeji na-egosi ụzọ ndị ọzọ e nwere ike isi ghọta ya.
translation_notes:
  register: E ji Igbo Standard nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘obi unu ghara ịdịkwa jụụ’ dịka ụzọ Igbo eke isi kwuo echiche nke ịpụ n’ọnọdụ uche kwụsiri ike. E tinyere akara nkọwa ala peeji [a] na [b] n’isi amaokwu dịka a chọrọ.
