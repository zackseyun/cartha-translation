revisions:
- from: ka unu ghara ikwe ka e mee ngwa ngwa ka obi unu ghara ịdịkwa jụụ, ma ọ bụ ka ụjọ jide unu[a], ma ọ̀ bụ site na mmụọ, ma ọ bụ site n’ozi ọnụ, ma ọ bụ site n’akwụkwọ ozi e kwuru na o si n’aka anyị, nke na-ekwu na ụbọchị Onyenwe anyị abịala[b].
  to: ka obi unu ghara ịma jijiji ngwa ngwa n’echiche unu kwụsiri ike, ka ụjọ ghara ịtụkwa unu, ma ọ bụ site na mmụọ, ma ọ bụ site n’ozi ọnụ, ma ọ bụ site n’akwụkwọ ozi dị ka a ga-asị na o si n’aka anyị, sị na ụbọchị Onyenwe anyị abịala[b].[a]
  rationale: 'The revision removes the added idea of allowing something to happen and renders the warning as a coherent pair: not to have one’s settled understanding quickly shaken and not to be alarmed. It retains the Greek triad of purported sources, marks the alleged attribution to Paul and his companions, and uses “sị na” so that the final assertion applies to the whole triad. Footnote anchors are placed after the relevant expressions: [a] after “mmụọ” and [b] after “abịala.”'
