id: 2TH.2.15
reference: 2 Thessalonians 2:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι’ ἐπιστολῆς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/015.yaml
  text: So then[a], brothers, stand firm and hold fast to the traditions that you were taught, whether by word or by our letter.
translation:
  language: ig
  text: Ya mere, ụmụnna[a], guzosienụ ike, jidesiekwanụ ọdịnala ndị a kụziiri unu, ma ọ̀ bụ site n'okwu ọnụ ma ọ bụ site n'akwụkwọ ozi anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụmụnne nwoke na ụmụnne nwanyị.” Okwu Grik e ji ebe a pụtara n'ụzọ nkịtị “ụmụnne nwoke,” ma o yiri ka ọ na-agwa ọgbakọ dum okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n'ihe Pọl kwuru tupu nke a, ma na-ada nke ọma n'Igbo nke oge a.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: Ọ bụ okwu nkwanye ùgwù a na-eji akpọ ndị otu okwukwe. Ọ kwekọrọ n'ụdị okwu Grik ma nwee ike ịgụnye ọgbakọ dum n'ọnọdụ a.
- source_word: στήκετε
  choice: guzosienụ ike
  rationale: Ọ na-egosi ịnọgide na-eguzosi ike ma ghara ịma jijiji; iwu dị ugbu a na-akpọ ha ka ha nọgide na-eme otú ahụ.
- source_word: κρατεῖτε
  choice: jidesiekwanụ
  rationale: 'Ọ na-echekwa ike dị n''iwu ahụ: ka ha jidesie ihe ahụ ike ma ghara ịhapụ ya.'
- source_word: παραδόσεις
  choice: ọdịnala
  rationale: Ọ na-echekwa echiche nke ihe e nyefere ma ọ bụ nke e bufere n'aka ndị ọzọ, kama ime ka ọ bụrụ naanị 'nkuzi.'
- source_word: ἐδιδάχθητε
  choice: ndị a kụziiri unu
  rationale: Ọ na-egosi n'ụzọ doro anya na ha bụ ndị natara nkuzi ahụ.
- source_word: διὰ λόγου
  choice: site n'okwu ọnụ
  rationale: N'ọnọdụ a, λόγος bụ ozi e kwuru n'ọnụ, nke a na-atụnyere akwụkwọ ozi; 'ọnụ' na-eme ka ọdịiche ahụ doo anya n'Igbo.
- source_word: δι’ ἐπιστολῆς ἡμῶν
  choice: site n'akwụkwọ ozi anyị
  rationale: Ọ na-echekwa ma ụzọ e si zie ozi ahụ ma njikọ nke akwụkwọ ozi ahụ na ndị na-ekwu okwu.
theological_decisions:
- issue: Ịsụgharị παράδοσις n'ebe a na-arụrịta ụka banyere ọdịnala ndịozi
  choice: ọdịnala
  alternative: nkuzi; ntụziaka
  rationale: ‘Ọdịnala’ na-egosipụta ihe e nyefere ha, ma n'okwu ọnụ ma n'akwụkwọ ozi. Ọ naghị ekpebi arụmụka ụka ndị mechara bilie banyere ókè ma ọ bụ ikike ọdịnala.
- issue: Ndị ἀδελφοί na-ezo aka na ha
  choice: ụmụnna, tinyere nkọwa ala peeji
  alternative: ụmụnne nwoke na ụmụnne nwanyị
  rationale: A hapụrụ ụdị okwu kwekọrọ na okwu Grik n'ahịrị bụ isi, ebe nkọwa ala peeji na-egosi na ọ ga-abụ na a na-agwa ọgbakọ dum okwu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro ‘guzosienụ ike, jidesiekwanụ’ na-echekwa iwu abụọ siri ike dị na Grik, ebe ‘okwu ọnụ’ na-eme ka ọdịiche dị n'etiti ozi e kwuru na akwụkwọ ozi doo anya.
