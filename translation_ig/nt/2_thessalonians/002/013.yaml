source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ὀφείλομεν εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν, ἀδελφοὶ ἠγαπημένοι ὑπὸ κυρίου, ὅτι εἵλατο ὑμᾶς ὁ θεὸς ⸀ἀπαρχὴν εἰς σωτηρίαν ἐν ἁγιασμῷ πνεύματος καὶ πίστει ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/013.yaml
  text: But we ought always to give thanks to God for you[a], brothers beloved by the Lord, because God chose you as firstfruits for salvation through sanctification by the Spirit and faith in the truth[b],
translation:
  language: ig
  text: Ma anyị kwesịrị ịdị na-ekele Chineke mgbe niile n’ihi unu, ụmụnna[a] ndị Onyenwe anyị hụrụ n’anya, n’ihi na Chineke họọrọ unu ka unu bụrụ mkpụrụ mbụ[b] maka nzọpụta, site n’ido unu nsọ nke Mmụọ Nsọ na site n’okwukwe n’eziokwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ἀδελφοί bụ aha ọtụtụ nke ụdị nwoke; ma n’ebe a ọ pụrụ ịgụnye ndị niile kwere ekwe, ma ndị nwoke ma ndị nwanyị.
    reason: cultural_note
  - marker: b
    text: 'Ụfọdụ ihe odide nwere: “n’ihi na Chineke họọrọ unu site ná mmalite maka nzọpụta.” Isi ederede soro ọgụgụ “mkpụrụ mbụ” (ἀπαρχήν); ọgụgụ ọzọ bụ “site ná mmalite” (ἀπ’ ἀρχῆς).'
    reason: textual_variant
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: Ma anyị
  rationale: “Ma” na-egosi ọdịiche dị n’etiti ndị a na ndị na-ala n’iyi a kpọtụrụ aha tupu ya; “anyị” doro anya na-edobekwa nkwusiri ike nke Ἡμεῖς.
- source_word: ὀφείλομεν
  choice: kwesịrị
  rationale: Na-egosi ọrụ kwesịrị ekwesị na ibu ọrụ omume, n’etinyeghị echiche mmanye karịrị ihe Grik kwuru.
- source_word: εὐχαριστεῖν τῷ θεῷ πάντοτε περὶ ὑμῶν
  choice: ịdị na-ekele Chineke mgbe niile n’ihi unu
  rationale: Nke a bụ Igbo nkịtị ma doo anya maka usoro ekele Pọl, ma chekwaa echiche nke πάντοτε na περὶ ὑμῶν.
- source_word: ἀδελφοὶ
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo sitere n’okike nke na-akpọ ndị otu obodo okwukwe ma nwee ike ịgụnye nwoke na nwanyị, na-enweghị ịgbakwunye nkewa na-adịghị na Grik.
- source_word: ἠγαπημένοι ὑπὸ κυρίου
  choice: ndị Onyenwe anyị hụrụ n’anya
  rationale: Na-ebute echiche participle passive ahụ n’Igbo dị ugbu a ma dị ugwu; “Onyenwe anyị” na-anọchi κύριος.
- source_word: εἵλατο
  choice: họọrọ
  rationale: Nke a bụ ntụgharị kpọmkwem na nke nkịtị nke αἱρέομαι n’ebe a, n’etinyeghị ozizi pụrụ iche banyere nhọpụta.
- source_word: ἀπαρχὴν
  choice: ka unu bụrụ mkpụrụ mbụ
  rationale: Na-agbaso ederede SBLGNT ἀπαρχήν ma na-eme ka ọrụ predicative ya doo anya n’Igbo; ọdịiche ederede “site ná mmalite” dị n’okpuru peeji.
- source_word: εἰς σωτηρίαν
  choice: maka nzọpụta
  rationale: Na-echekwa nzube ma ọ bụ ihe nhọpụta ahụ na-eduga na ya, n’asụsụ Igbo doro anya.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: site n’ido unu nsọ nke Mmụọ Nsọ
  rationale: “Site na” na-egosi ụzọ ma ọ bụ prostřed; “ido unu nsọ” na-eme ka ἁγιασμός ghọta nke ọma. Ọnọdụ a na-akwado ịghọta πνεῦμα dị ka Mmụọ Nsọ.
- source_word: καὶ πίστει ἀληθείας
  choice: na site n’okwukwe n’eziokwu
  rationale: Na-ewere genitive ahụ dị ka ihe okwukwe chere ihu—okwukwe n’eziokwu—ma na-ejikọta ya na ụzọ nzọpụta ahụ.
theological_decisions:
- issue: Ihe πνεύματος pụtara na ἐν ἁγιασμῷ πνεύματος
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ
  rationale: N’ọnọdụ okwu Pọl banyere nzọpụta, ọrụ ido nsọ dabara nke ọma n’ọrụ Mmụọ Nsọ; mkpụrụedemede ukwu na-egosi mkpebi a n’enweghị ịgbakwunye nkọwa ozizi ọzọ.
- issue: Ihe εἵλατο ὑμᾶς ὁ θεὸς na-ekwu banyere nhọpụta
  choice: Chineke họọrọ unu
  alternative: Chineke họpụtara unu / were unu nye onwe ya
  rationale: “Họọrọ” na-echekwa isi echiche okwu Grik ahụ, ma ọ naghị ekpebi arụmụka ụka banyere usoro ma ọ bụ ọnọdụ nhọpụta karịa ihe amaokwu ahụ kwuru.
- issue: Ọgụgụ ἀπαρχὴν megide ἀπ’ ἀρχῆς
  choice: mkpụrụ mbụ
  alternative: site ná mmalite
  rationale: Isi ederede na-agbaso SBLGNT ἀπαρχήν. Ebe ọdịiche ederede ahụ bụ nke ama ama ma na-agbanwe ihe okwu pụtara, e debere ya n’okpuru peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. A họọrọ “ụmụnna” dịka okwu Igbo nkịtị maka obodo ndị kwere ekwe. E chekwara usoro echiche amaokwu ahụ, ma e mere ụfọdụ njikọ ka ha bụrụ Igbo sitere n’okike. Akara [a] na [b] dị n’isi ederede ma kwekọọ n’okpuru peeji.
