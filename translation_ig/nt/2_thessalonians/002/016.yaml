id: 2TH.2.16
reference: 2 Thessalonians 2:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς καὶ ⸀θεὸς ⸀ὁ πατὴρ ἡμῶν, ὁ ἀγαπήσας ἡμᾶς καὶ δοὺς παράκλησιν αἰωνίαν καὶ ἐλπίδα ἀγαθὴν ἐν χάριτι,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/016.yaml
  text: May our Lord Jesus the Messiah himself[a], and God our Father, who loved us and gave us eternal encouragement and good hope by grace,
translation:
  language: ig
  text: Ka Onyenwe anyị Jizọs bụ́ Mezaya n’onwe ya, ya na Chineke Nna anyị, onye hụrụ anyị n’anya ma jiri amara nye anyị nkasi obi[a] ebighị ebi na ezi olileanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “mgbamume” ma ọ bụ “ihe na-ewusi obi ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: n’onwe ya
  rationale: Ọ na-egosipụta nkwusi ike dị na αὐτός ma na-eme ka o doo anya na Onyenwe anyị Jizọs bụ́ Mezaya n’onwe ya bụ onye a na-arịọ ka o mee ihe ahụ.
- source_word: δὲ
  choice: —
  rationale: A hapụrụ obere njikọ mkparịta ụka a n’enweghị okwu pụrụ iche, n’ihi na itinye “Ma” n’ebe a nwere ike ime ka e chee na e nwere nnukwu nghọtahie ma ọ bụ mmegide karịa ihe Greek na-ekwu.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị asụgharị κύριος dịka aha nsọpụrụ Kraịst.
- source_word: Ἰησοῦς Χριστὸς
  choice: Jizọs bụ́ Mezaya
  rationale: Χριστός na-arụ ọrụ dịka aha ọkwa ebe a; “bụ́ Mezaya” na-enye ya n’Igbo dị mfe ma doo anya karịa ime ya naanị aha mmadụ.
- source_word: θεὸς ὁ πατὴρ ἡμῶν
  choice: Chineke Nna anyị
  rationale: Nke a na-echekwa ma θεός ma πατήρ n’usoro Igbo sitere n’okike.
- source_word: ὁ ἀγαπήσας
  choice: onye hụrụ anyị n’anya
  rationale: E ji nkebi ahịrịokwu njikọ asụgharị participle ahụ n’Igbo dị mfe, n’enweghị ịgbakwunye nkọwa banyere onye naanị ya ọ na-ezo aka na ya.
- source_word: δοὺς
  choice: nye anyị
  rationale: Okwu a jikọtara ya na “onye hụrụ anyị n’anya”; “nye” na-echekwa omume inye ahụ n’ụzọ doro anya.
- source_word: παράκλησιν
  choice: nkasi obi
  rationale: παράκλησις nwere ike ịpụta nkasi obi, mgbamume, ma ọ bụ ihe na-ewusi obi ike. “Nkasi obi” bụ okwu Igbo dị mfe ma dabara n’ọnọdụ a; e debere nhọrọ ọzọ n’ala peeji.
- source_word: αἰωνίαν
  choice: ebighị ebi
  rationale: Ọ na-egosi ịdịgide na-enweghị ọgwụgwụ nke αἰώνιος n’Igbo nkịtị.
- source_word: ἐλπίδα ἀγαθὴν
  choice: ezi olileanya
  rationale: Nke a na-echekwa ma echiche olileanya ma ịdị mma nke ἀγαθή n’enweghị mgbasawanye.
- source_word: ἐν χάριτι
  choice: jiri amara
  rationale: “Jiri amara” na-enye ἐν n’echiche ụzọ ma ọ bụ ntọala e ji nye onyinye ndị ahụ, n’Igbo sitere n’okike.
theological_decisions:
- issue: Participles ndị dị n’otu n’agbanyeghị na e kpọrọ Onyenwe anyị Jizọs bụ́ Mezaya na Chineke Nna anyị ọnụ
  choice: E debere otu nkebi “onye hụrụ anyị n’anya ma jiri amara nye anyị...” mgbe a kpọchara ha abụọ ọnụ.
  alternative: Ịkọwa na nkebi ahụ na-ezo aka naanị na Chineke Nna anyị, ma ọ bụ ịgbanwe ya ka o kwuo kpọmkwem na ha abụọ mere ihe ndị ahụ.
  rationale: Greek nwere isiokwu abụọ ejikọtara ọnụ, ma participles sochirinụ dị n’otu. Nsụgharị ahụ anaghị ekpebi n’ezoghị ọnụ onye naanị ya nkebi ahụ na-ezo aka na ya, ọ naghịkwa eme ka nkwupụta nkà mmụta okpukpe gbasaa karịa usoro okwu mbụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ya na” na-ejikọta ndị a kpọrọ aha n’ụzọ sitere n’okike; a hapụrụ ahịrịokwu ahụ na kọma n’ihi na ekpere-ngọzi a na-aga n’ihu n’amaokwu 17.
