id: 2TH.2.4
reference: 2 Thessalonians 2:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ἀντικείμενος καὶ ὑπεραιρόμενος ἐπὶ πάντα λεγόμενον θεὸν ἢ σέβασμα, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ ⸀θεοῦ καθίσαι ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/004.yaml
  text: the one who opposes and exalts himself over every so-called god or object of worship[a], so that he takes his seat in the temple of God[b], displaying himself as being God.
translation:
  language: ig
  text: onye ahụ na-emegide ma na-ebuli onwe ya elu karịa ihe ọ bụla a na-akpọ chi ma ọ bụ ihe a na-efe ofufe, nke mere na ọ nọdụ ala n'ụlọ nsọ Chineke[b], na-egosi na ya onwe ya bụ Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-egosi na ya onwe ya bụ chi.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “n’ebe nsọ Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντικείμενος
  choice: onye ahụ na-emegide
  rationale: Akụkụ-okwu a dị ka aha onye ma na-egosi omume na-aga n’ihu; nsụgharị a doro anya ma ghara ime ya aha ọkwa pụrụ iche nke Grik ekwughị kpọmkwem.
- source_word: ὑπεραιρόμενος
  choice: na-ebuli onwe ya elu karịa
  rationale: Nke a na-echekwa echiche nke mmadụ iji aka ya bulie onwe ya elu ma na-egosikwa na ọ na-edobe onwe ya n’elu ihe ndị ọzọ.
- source_word: ἐπὶ πάντα λεγόμενον θεὸν
  choice: karịa ihe ọ bụla a na-akpọ chi
  rationale: “Karịa” na-egosipụta ịdị elu ọ na-azọrọ, ebe “a na-akpọ chi” na-echekwa λεγόμενον n’emeghị ka onye ntụgharị kwado na ihe ahụ bụ chi n’ezie.
- source_word: σέβασμα
  choice: ihe a na-efe ofufe
  rationale: Okwu a gbasara ihe ọ bụla ndị mmadụ na-asọpụrụ n’ụzọ okpukpe, ọ bụghị naanị chi; okwu Igbo a bụ nke nkịtị ma doo anya.
- source_word: ὥστε
  choice: nke mere na
  rationale: Ọ na-ewebata ihe omume nke sitere n’omume mmegide na ibuli onwe ya elu; nsụgharị a na-echekwa njikọ nke nsonaazụ ahụ.
- source_word: εἰς τὸν ναὸν τοῦ θεοῦ
  choice: n’ụlọ nsọ Chineke
  rationale: ναός na-ezo aka n’ụlọ nsọ, ma nwee ike ịpụta ebe nsọ dị n’ime ya. “Ụlọ nsọ Chineke” bụ okwu Igbo doro anya nke na-adịghị ekpebi ma ihe ahụ ọ̀ bụ ụlọ nkịtị ka ọ bụ ihe atụ.
- source_word: καθίσαι
  choice: ọ nọdụ ala
  rationale: Nke a na-egosipụta omume ịnọdụ n’ebe ahụ n’ụzọ dị mfe, na-etinyeghị echiche ọzọ dịka ikwupụta onwe ya eze nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: ἀποδεικνύντα ἑαυτὸν
  choice: na-egosi na ya onwe ya bụ
  rationale: Ọ na-echekwa echiche nke ime ka onwe ya pụta ìhè ma ọ bụ igosi onwe ya dị ka ihe, kama ịsụgharị ya dịka nkwupụta ọnụ naanị.
- source_word: ὅτι ἔστιν θεός
  choice: Chineke
  rationale: N’ọnọdụ a, onye ahụ nọ n’ụlọ nsọ Chineke ma na-egosi onwe ya dị ka Chineke. “Chineke” na-egosipụta ịdị arọ nke nzọrọ nkwulu ahụ, ebe a na-edebe “chi” dịka ụzọ ọzọ e nwere ike isi ghọta θεός na-enweghị mkpọaha.
theological_decisions:
- issue: Ma θεός ikpeazụ kwesịrị ịbụ “Chineke” ka ọ bụ “chi”
  choice: Chineke
  alternative: chi
  rationale: Ọnọdụ okwu ahụ na-ejikọta nzọrọ onye ahụ na ụlọ nsọ Chineke, ya mere “Chineke” na-egosipụta nzọrọ kasị elu ahụ n’emeghị ka nsụgharị kwuo na ọ bụ Chineke n’ezie. Ebe θεός enweghị mkpọaha n’asụsụ Grik, “chi” ka bụ ụzọ kwe omume, ya mere e debere ya n’ala peeji.
- issue: Ma ναός kwesịrị ịbụ “ụlọ nsọ” ka ọ bụ “ebe nsọ”
  choice: ụlọ nsọ Chineke
  alternative: ebe nsọ Chineke
  rationale: “Ụlọ nsọ Chineke” bụ okwu Igbo kachasị doo anya n’ahịrịokwu a ma ghara idozi esemokwu banyere ma Pọl ọ na-ekwu maka ụlọ nkịtị ka ọ bụ ihe atụ. “Ebe nsọ” na-egosipụta nkọwa pụrụ iche nke ναός ma dị n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A haziri ahịrịokwu ahụ ka usoro participle ndị Grik pụta dịka nkọwa nke “onye ahụ,” ma zere aha teknụzụ ma ọ bụ nkọwa ụka pụrụ iche. E debere akara ala peeji n’ebe ha metụtara kpọmkwem n’ahịrịokwu.
