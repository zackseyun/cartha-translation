  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ⸀πέμπει αὐτοῖς ὁ θεὸς ἐνέργειαν πλάνης εἰς τὸ πιστεῦσαι αὐτοὺς τῷ ψεύδει,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/011.yaml
  text: And because of this[a], God sends them a working of delusion so that they may believe the lie,
translation:
  language: ig
  text: N’ihi nke a, Chineke na-eziga ha ọrụ nke nduhie[a], ka ha wee kwere ụgha ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mmetụta nduhie,” “ọrụ aghụghọ,” ma ọ bụ, dị ka nsụgharị ọdịnala ụfọdụ si kwuo, “nnukwu nduhie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi ihe kpatara ya ma na-atụ aka n’ihe e kwuru n’amaokwu bu ụzọ, ya bụ, na ha jụrụ ịhụ eziokwu n’anya.
- source_word: πέμπει
  choice: na-ezitere
  rationale: Nke a na-edobe ngwaa ahụ n’oge ugbu a, na-egosikwa Chineke kpọmkwem dị ka onye na-ezipụ ya.
- source_word: ἐνέργειαν πλάνης
  choice: ọrụ nke nduhie
  rationale: Nke a na-edobe aha abụọ ahụ na njikọ ha, ma hapụkwa nghọta ahụ imeghe ma ọ̀ bụ ọrụ na-eduhie eduhie ka a na-ekwu ma ọ bụ ọrụ nke ọdịdị ya bụ nduhie.
- source_word: εἰς τὸ πιστεῦσαι
  choice: ka ha wee kwere
  rationale: Ọ na-egosipụta ma nzube ma ihe si na ya pụta, n’ebughị ụzọ kpebie nke n’ime ha ka a ga-akọwa naanị ya.
- source_word: τῷ ψεύδει
  choice: ụgha ahụ
  rationale: Nkọwa ‘ahụ’ na-edobe ịdị kpọmkwem nke aha Grik ahụ nwere, ma jikọta ya na nduhie a kọwara n’akụkụ amaokwu a.
theological_decisions:
- issue: Ọrụ Chineke n’ikpe nke na-eme ka ndị jụrụ eziokwu kwenye n’ụgha
  choice: Chineke na-ezitere ha ọrụ nke nduhie
  alternative: Chineke na-ekwe ka ọrụ nke nduhie bịakwasị ha
  rationale: Grik kwuru Chineke kpọmkwem dị ka onye na-ezipụ ya. Ya mere, a naghị eme ka okwu ahụ dị nro site n’ịsị naanị na Chineke kwere ka o mee; nke a na-edobe esemokwu nkà mmụta okpukpe dị n’etiti ikpe Chineke na mbụ ha jụrụ eziokwu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ọrụ nke nduhie’ dị ntakịrị n’ụdị okwu nkịtị, ma a họọrọ ya iji chekwaa nhazi na mgbagwoju nghọta nke ἐνέργειαν πλάνης; ihe odide ala peeji nyere ụzọ ndị ka mfe n’Igbo.
