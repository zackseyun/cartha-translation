id: 2TH.2.8
reference: 2 Thessalonians 2:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τότε ἀποκαλυφθήσεται ὁ ἄνομος, ὃν ὁ κύριος ⸀Ἰησοῦς ⸀ἀνελεῖ τῷ πνεύματι τοῦ στόματος αὐτοῦ καὶ καταργήσει τῇ ἐπιφανείᾳ τῆς παρουσίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/008.yaml
  text: And then the lawless one will be revealed[a], whom the Lord Jesus will slay with the breath of his mouth and bring to nothing by the appearance of his coming[b],
translation:
  language: ig
  text: Ma mgbe ahụ, a ga-ekpughe onye ahụ na-emebi iwu, onye Onyenwe anyị Jizọs ga-eji ume[a] si n’ọnụ ya gbuo, meekwa ka ọ ghara ịdị irè site na ngosipụta nke ọbịbịa ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “jiri mmụọ nke ọnụ ya.” Okwu Grik ahụ nwere ike ịpụta “ume” ma ọ bụ “mmụọ”; “ume” kacha dabara n’usoro okwu a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site na ngosipụta nke ọnụnọ ya.” N’ebe a, “ọbịbịa” bụ ihe παρουσία na-apụtakarị n’ọnọdụ okwu a, ma okwu ahụ nwekwara ike ịpụta “ọnụnọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαλυφθήσεται
  choice: a ga-ekpughe
  rationale: Ọdịdị ọdịnihu nke na-anata omume dị na Grik ka e chekwara; okwu a na-egosi na a ga-eme ka onye ahụ pụta ìhè n’ebughị ụzọ kọwaa onye ga-ekpughe ya.
- source_word: ὁ ἄνομος
  choice: onye ahụ na-emebi iwu
  rationale: Nke a na-egosipụta adjective Grik e ji dị ka aha, ma ọ naghị atụkwasị okwu ‘nwoke’ nke na-adịghị n’amaokwu a.
- source_word: ὁ κύριος Ἰησοῦς
  choice: Onyenwe anyị Jizọs
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị asụ aha nsọpụrụ κύριος na aha Jizọs n’Agba Ọhụrụ.
- source_word: ἀνελεῖ
  choice: ga-egbu
  rationale: N’ebe a, ngwaa ahụ pụtara igbu ma ọ bụ ime ka mmadụ nwụọ; ‘ga-egbu’ doro anya ma bụrụkwa Igbo nke oge a.
- source_word: τῷ πνεύματι τοῦ στόματος αὐτοῦ
  choice: jiri ume si n’ọnụ ya
  rationale: πνεῦμα nwere ike ịpụta ‘ume’ ma ọ bụ ‘mmụọ.’ ‘Ume si n’ọnụ ya’ kacha dabara n’usoro okwu a ma na-echekwa onyinyo ikpe e ji okwu ọnụ mee; a debere nhọrọ ọzọ n’ala ala peeji.
- source_word: καταργήσει
  choice: meekwa ka ọ ghara ịdị irè
  rationale: καταργέω na-egosi ime ka ihe ghara inwe ike ma ọ bụ ghara ịrụ ọrụ. Nsụgharị a na-egosi mkpochapụ ike ya n’ebughị ụzọ mee ka okwu ahụ pụta naanị ‘bibie kpamkpam.’
- source_word: τῇ ἐπιφανείᾳ
  choice: site na ngosipụta
  rationale: ἐπιφάνεια bụ mpụta ma ọ bụ ngosipụta a na-ahụ anya; ‘ngosipụta’ na-ejide ihe okwu ahụ pụtara n’enweghị ịgbakwụnye echiche banyere ebube.
- source_word: τῆς παρουσίας αὐτοῦ
  choice: nke ọbịbịa ya
  rationale: N’ọnọdụ okwu banyere ihe ikpeazụ, παρουσία na-ezokarị aka n’ọbịbịa Kraịst; ‘ọnụnọ’ ka bụ ihe okwu ahụ nwekwara ike ịpụta, ya mere e tinyere ya n’ala ala peeji.
theological_decisions:
- issue: Njirimara na nkọwa onye mmegide nke oge ikpeazụ
  choice: onye ahụ na-emebi iwu
  alternative: nwoke mmebi iwu
  rationale: Amaokwu a ji ὁ ἄνομος, adjective e mere aha, ọ bụghị okwu zuru ezu dị n’amaokwu ndị gbara ya gburugburu. Nsụgharị a anaghị ebubata ‘nwoke’ n’ebe Grik amaokwu a na-ekwughị ya.
- issue: Ụzọ Onyenwe anyị Jizọs si emeri
  choice: jiri ume si n’ọnụ ya
  alternative: jiri mmụọ nke ọnụ ya
  rationale: ‘Ume’ kacha dabara n’usoro okwu a ma na-echetakwa onyinyo ikpe amụma; ebe ‘mmụọ’ nwekwara ike ịbụ ihe πνεῦμα pụtara, e chekwara ya n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. A zere okwu ụka pụrụ iche na nkọwa na-ekpebi njirimara onye ahụ karịa ka amaokwu Grik si kwuo. E debere akara [a] n’akụkụ okwu πνεῦμα ọ na-akọwa, ọ bụghị n’akụkụ ‘a ga-ekpughe.’
