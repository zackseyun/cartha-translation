id: 2TH.2.10
reference: 2 Thessalonians 2:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐν πάσῃ ἀπάτῃ ⸀ἀδικίας τοῖς ἀπολλυμένοις, ἀνθ’ ὧν τὴν ἀγάπην τῆς ἀληθείας οὐκ ἐδέξαντο εἰς τὸ σωθῆναι αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/010.yaml
  text: and with every deception of unrighteousness for those who are perishing[d][c][b][a], because they did not accept the love of the truth so as to be saved.
translation:
  language: ig
  text: nakwa n’aghụghọ niile nke ajọ omume[a] n’etiti ndị na-ala n’iyi[b], n’ihi na ha anabataghị[c] ịhụnanya nke eziokwu, ka e wee zọpụta ha.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “aghụghọ niile nke ihe na-adịghị ezi omume.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nye ndị na-ala n’iyi” ma ọ bụ “n’ebe ndị na-ala n’iyi nọ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ha anataghị” ma ọ bụ “ha ejighị obi ha nabata.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “nke ga-eme ka a zọpụta ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπάτῃ
  choice: aghụghọ
  rationale: “Aghụghọ” na-egosi omume nke iduhie mmadụ, ya mere ọ dabara n’ọnọdụ a karịa okwu ga-egosi naanị echiche ụgha dị n’ime mmadụ.
- source_word: ἀδικίας
  choice: nke ajọ omume
  rationale: Nke a na-edobe ụdị aha dị na Grik ma na-akọwa aghụghọ ahụ dị ka nke ajọ omume ji mara.
- source_word: τοῖς ἀπολλυμένοις
  choice: n’etiti ndị na-ala n’iyi
  rationale: Datịvụ Grik nwere ike igosi ebe aghụghọ ahụ na-arụ ọrụ ma ọ bụ ndị ọ na-erute. “N’etiti” bụ Igbo doro anya nke na-adịghị eme ka ntụziaka ahụ sie ike karịa ihe odide Grik kwuru; “na-ala” na-echekwa ọnọdụ na-aga n’ihu.
- source_word: ἀνθ’ ὧν
  choice: n’ihi na
  rationale: N’ebe a nkebiokwu ahụ na-egosi ihe kpatara ọnọdụ a; “n’ihi na” na-enye njikọ ahụ n’Igbo nkịtị.
- source_word: ἀγάπην
  choice: ịhụnanya
  rationale: Ọ bụ okwu Igbo kwesịrị ekwesị maka ἀγάπη, ma ọ na-egosi na ihe a abụghị naanị ịmata eziokwu n’uche kama ọ metụtara inwe mmasị n’eziokwu ahụ.
- source_word: τῆς ἀληθείας
  choice: nke eziokwu
  rationale: A hapụrụ njikọ genitịvụ ahụ ka ọ dị, iji ghara ịkọwa ya karịa ihe Grik kwuru, ọ bụ ezie na ọnọdụ ahụ na-akwado ịhụnanya mmadụ nwere maka eziokwu.
- source_word: ἐδέξαντο
  choice: anabataghị
  rationale: “Ịnabata” na-egosi ịnata ma jiri obi nabata ihe e nyere, ma ọ dabara nke ọma na ihe a na-ekwu banyere ịhụnanya nke eziokwu.
- source_word: εἰς τὸ σωθῆναι αὐτούς
  choice: ka e wee zọpụta ha
  rationale: Nkebiokwu a na-echekwa echiche nke nzube ma ọ bụ ihe ga-esi na ya pụta, na passive “zọpụta ha” kwekọrọ na σωθῆναι.
theological_decisions:
- issue: Ma a ga-akpọ ndị a ndị a kara ikpe mbibi, ka a ga-egosi na ha nọ n’ọnọdụ ịla n’iyi na-aga n’ihu.
  choice: ndị na-ala n’iyi
  alternative: ndị a ga-ebibi
  rationale: Participle nke present na Grik na-egosi ọnọdụ na-aga n’ihu. Nsụgharị a anaghị ebubata echiche banyere akara aka nke ihe odide ahụ ekwughị kpọmkwem.
- issue: Ma “ịhụnanya nke eziokwu” pụtara ịhụnanya ha kwesịrị inwe maka eziokwu, ka ọ bụ ịhụnanya nke eziokwu nwere n’ebe ha nọ.
  choice: ịhụnanya nke eziokwu
  alternative: ịhụ eziokwu n’anya
  rationale: E debere nhazi genitịvụ nke Grik ka ezigbo obosara ya ghara ifu. Ọnọdụ okwu na-akwado ịhụnanya maka eziokwu, ma isi ederede adịghị emegharị nkebiokwu ahụ ka ọ bụrụ naanị otu nkọwa.
- issue: Ma εἰς τό na-egosi nzube naanị ya, ka ọ bụ ihe ga-esi na nnabata ahụ pụta.
  choice: ka e wee zọpụta ha
  alternative: nke ga-eme ka a zọpụta ha
  rationale: “Ka e wee” na-egosikarị nzube, ma n’Igbo ọ ka nwere ike ikwe ka a ghọta njikọ nke ihe ga-esi na ya pụta, ya mere ọ naghị emechi esemokwu ahụ kpamkpam.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “na-ala n’iyi” iji chekwaa omume na-aga n’ihu, ebe “ịhụnanya nke eziokwu” na-edobe nhazi na obere obosara nke okwu Grik.
