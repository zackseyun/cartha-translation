  text: καὶ νῦν τὸ κατέχον οἴδατε, εἰς τὸ ἀποκαλυφθῆναι αὐτὸν ἐν τῷ ⸀ἑαυτοῦ καιρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/006.yaml
  text: And now you know what is restraining him[b][a], so that he may be revealed in his own time.
translation:
  language: ig
  text: Ugbu a kwa, unu maara ihe na-egbochi ya[a], ka e wee kpughee ya n'oge ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe na-ejide ya azụ.” Okwu Grik ahụ dị n'ụdị etiti; ọ kọwaghị ike na-egbochi ya n'ebe a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “n'oge a kara aka maka ya.” Okwu Grik ahụ pụrụ ịpụta oge kwesịrị ekwesị ma ọ bụ oge a kara aka.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ κατέχον
  choice: ihe na-egbochi ya
  rationale: “Ihe” na-egosipụta na okwu Grik ahụ nọ n'ụdị etiti, ma ọ naghị ekwu onye ma ọ bụ ihe kpọmkwem na-egbochi ya. “Na-egbochi” na-ebute echiche nke ijide azụ ma ọ bụ igbochi n'ebughị ụzọ kọwaa ike ahụ.
- source_word: οἴδατε
  choice: unu maara
  rationale: Nke a bụ nsụgharị doro anya ma kwekọọ n'echiche ngwaa ahụ nwere ugbu a; ọ na-egosikwa na ndị a na-agwa okwu amaralarị ihe ahụ.
- source_word: εἰς τὸ ἀποκαλυφθῆναι αὐτόν
  choice: ka e wee kpughee ya
  rationale: Ụdị a na-egosipụta nzube ma ọ bụ ihe ga-esi na ya pụta, ma na-edobekwa ụda nnara nke ngwaa Grik ahụ.
- source_word: ἐν τῷ ἑαυτοῦ καιρῷ
  choice: n'oge nke ya
  rationale: Nke a na-edobe okwu ahụ nso na Grik ma ghara itinye nkọwa doro anya karịa isi mmalite banyere ma oge ahụ bụ nke a kara aka.
- source_word: νῦν
  choice: ugbu a
  rationale: Ọ bụ okwu oge dị mfe, “ugbu a” bụkwa ụzọ Igbo nkịtị si kwuo ya.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha ahụ na-arụtụ aka n'ebe nwoke ahụ a kpọtụrụla aha na mbụ nọ, n'ebughị ụzọ kọwaa onye ọ bụ.
theological_decisions:
- issue: Onye ma ọ bụ ihe bụ ike na-egbochi ya
  choice: E jiri “ihe na-egbochi ya” mee ka njirimara onye ma ọ bụ ihe ahụ ghara ịkọwapụta.
  alternative: Ọchịchị Rom; Mmụọ Nsọ; mmụọ ozi; ma ọ bụ iwu na nlekọta Chineke.
  rationale: Amaokwu a anaghị akọwa onye ma ọ bụ ihe ahụ bụ, okwu Grik τὸ κατέχον dịkwa n'ụdị etiti. Ya mere, nsụgharị ahụ ekwesịghị idozi ajụjụ nkọwa a n'onwe ya.
- issue: Ihe καιρός pụtara n'okwu banyere ihe ga-eme n'ọdịnihu
  choice: n'oge nke ya
  alternative: n'oge a kara aka maka ya; n'oge kwesịrị ekwesị
  rationale: καιρός nwere ike ịpụta oge kwesịrị ekwesị ma ọ bụ oge a kara aka, ma “n'oge nke ya” na-edobe obosara ihe okwu Grik ahụ nwere n'ebughị nkọwa ọzọ n'ime amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ihe” na-echekwa ụdị etiti nke okwu Grik, ebe “ka e wee kpughee ya” na-enye nnara ngwaa ahụ n'ụzọ Igbo sitere n'okike.
