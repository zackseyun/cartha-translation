id: 2TH.2.1
reference: 2 Thessalonians 2:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ’ αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/2_thessalonians/002/001.yaml
  text: We ask you[a], brothers, concerning the coming of our Lord Jesus the Messiah and our gathering together to him[b],
translation:
  language: ig
  text: Ma anyị na-arịọ unu, ụmụnna,[b] banyere ọbịbịa nke Onyenwe anyị Jizọs, bụ́ Mesaịa ahụ,[a] na nchịkọta anyị ọnụ n’ebe ọ nọ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Jizọs Kraịst.” E ji “Mesaịa” sụgharịa aha ọkwa Grik bụ Χριστός n’ebe a iji mee ka ihe ọ pụtara pụta ìhè.
    reason: alternative_reading
  - marker: b
    text: “Ụmụnna” bụ ụzọ Pọl si akpọ ndị ọ na-agwa okwu; n’ebe a, o yikarịrị ka ọ na-agwa ọgbakọ ndị kwere ekwe dum okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: anyị na-arịọ unu
  rationale: N’ebe a, ngwaa ahụ na-egosi arịrịọ dị nro nke ndị ọzụzụ atụrụ, ọ bụghị iwu siri ike.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị gaa n’isiokwu ọzọ metụtara nke bu ya ụzọ; “Ma” na-eme ka njikọ ahụ pụta ìhè n’Igbo n’etinyeghị esemokwu siri ike.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu a na-ejikarị akpọ ndị otu okwukwe n’Igbo; ọ ka na-edebe ọdịdị okwu ịkpọ oku nke Grik, ebe nkọwa ala peeji na-akọwa obosara ndị a na-ekwu okwu ha.
- source_word: ὑπὲρ
  choice: banyere
  rationale: N’ahịrịokwu a, ọ na-ewebata okwu a na-ekwu maka ya, ọ bụghị uru a na-emere mmadụ.
- source_word: παρουσίας
  choice: ọbịbịa
  rationale: N’ọnọdụ a gbasara ọgwụgwụ oge, okwu ahụ na-ezo aka n’ọbịbịa Jizọs n’ọdịnihu, ọ bụ ezie na ọ pụkwara ịpụta ịnọ ya n’ebe mmadụ nọ n’ọnọdụ ndị ọzọ.
- source_word: κυρίου
  choice: Onyenwe
  rationale: Ọ na-edebe ma ikike nke aha ahụ ma ojiji nkà mmụta okpukpe ya n’Agba Ọhụrụ.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ́ Mesaịa ahụ
  rationale: A sụgharịrị Χριστός dị ka aha ọkwa “Mesaịa” ebe a, ma e jiri ahịrịokwu nkọwa Igbo mee ka aha ọkwa ahụ doo anya ma bụrụkwa nke e ji otu onye kpọrọ aha.
- source_word: ἐπισυναγωγῆς
  choice: nchịkọta a ga-achịkọta anyị
  rationale: Nhazi a na-edebe echiche nke ịchịkọta ndị kwere ekwe ọnụ, ma na-ezere ime ya ka ọ bụrụ aha ụlọ ọrụ ma ọ bụ nzukọ e guzobere.
- source_word: ἐπ’ αὐτόν
  choice: ka anyị bịakwute ya
  rationale: Ọ na-egosi ngagharị na ntụziaka n’ebe Kraịst nọ, dị ka ἐπί tinyere accusative si arụ ọrụ n’ebe a.
theological_decisions:
- issue: Otu e si sụgharịa Χριστοῦ n’aha Jizọs
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a, Χριστός ka na-arụ ọrụ dị ka aha ọkwa. “Mesaịa” na-eme ka nke ahụ pụta ìhè; e debere “Kraịst” dị ka nsụgharị ọdịnala n’ala peeji.
- issue: Ndị okwu ἀδελφοί na-agụnye
  choice: ụmụnna
  alternative: ụmụnne nwoke na ụmụnne nwanyị
  rationale: E debere okwu ịkpọ oku dị mkpirikpi ma dịrị ndụ n’Igbo. Nkọwa ala peeji na-egosi na o yikarịrị ka Pọl ọ na-agwa ọgbakọ ndị kwere ekwe dum okwu.
- issue: Mmekọrịta dị n’etiti ọbịbịa Onyenwe anyị na nchịkọta anyị
  choice: E jikọtara ha abụọ naanị site na “na”
  alternative: Ịkọwa na nchịkọta ahụ ga-eme kpọmkwem n’oge ọbịbịa ahụ, ma ọ bụ na ihe abụọ ahụ bụ otu ihe
  rationale: Grik jikọtara okwu abụọ ahụ ọnụ ma ọ kọwaghị kpọmkwem mmekọrịta oge ma ọ bụ echiche dị n’etiti ha. Nsụgharị ahụ anaghị etinye usoro nkà mmụta ọgwụgwụ oge n’ime amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ụda arịrịọ Pọl, ntụgharị δέ, na njikọ na-akọwaghị kpọmkwem n’etiti ọbịbịa Jizọs na nchịkọta ndị kwere ekwe. E debere akara ala peeji [a] na [b] n’ebe okwu nke ọ bụla ha na-akọwa dị.
