id: 1PE.2.21
reference: 1 Peter 2:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ⸀ὑμῶν, ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: ig
  text: 'N’ihi na ọ bụ nke a ka a kpọrọ unu: Mesaya kwa tara ahụhụ n’ihi unu, hapụụrụ unu ihe nlereanya[a], ka unu wee soro nzọụkwụ ya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “ụkpụrụ” ma ọ bụ “ihe e dere ka onye na-amụ ihe degharịa”—okwu Grik ahụ na-ezo aka n’ihe nlereanya e debere n’ihu ndị na-amụ ihe ka ha soro ya dee.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: ọ bụ nke a ka
  rationale: Nkebiokwu a na-arụtụ aka n’ihe e kwuru tupu ya banyere ịtachi obi mgbe mmadụ na-ata ahụhụ n’emeghị ihe ọjọọ; ntụgharị a na-edobe njikọ ahụ n’Igbo doro anya.
- source_word: ἐκλήθητε
  choice: a kpọrọ unu
  rationale: Ụdị a na-edobe olu nnara nke Grik na echiche ọkpụkpọ sitere n’aka Chineke, ma ọ naghị atụkwasị nkọwa ozizi pụrụ iche.
- source_word: Χριστὸς
  choice: Mesaya
  rationale: N’ebe a, okwu ahụ na-arụ ọrụ dị ka utu aha nke Onye E Tere Mmanụ, ọ bụghị naanị dị ka aha mmadụ.
- source_word: ἔπαθεν
  choice: tara ahụhụ
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke ziri ezi isi kwuo na ọ tara ahụhụ, n’etinyeghị ọnwụ ma ọ bụ ụdị ahụhụ a na-akọwaghị n’amaokwu a.
- source_word: ὑπὲρ ὑμῶν
  choice: n’ihi unu
  rationale: Ọ na-egosi na ahụhụ Mesaya bụ maka ọdịmma ha ma na-ahapụ obosara echiche nke Grik n’emeghị ka ọ bụrụ naanị otu nkọwa banyere nnọchi anya.
- source_word: ὑμῖν ὑπολιμπάνων
  choice: hapụụrụ unu
  rationale: Okwu a na-egosi na Mesaya hapụrụ ha ihe ha ga-eji duzie ndụ ha.
- source_word: ὑπογραμμὸν
  choice: ihe nlereanya
  rationale: Nke a na-ekwupụta isi echiche nke ihe e nyere mmadụ ka o ṅomie; nkọwa ala peeji na-echekwa ihe atụ kpọmkwem nke ihe onye na-amụ ihe na-edegharị.
- source_word: ἵνα ἐπακολουθήσητε
  choice: ka unu wee soro
  rationale: Ọ na-edobe ebumnuche nke ἵνα na omume iso ụzọ onye ọzọ n’Igbo dị mfe ma dị ndụ.
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: nzọụkwụ ya
  rationale: Ọ na-echekwa ihe atụ nke iso nzọụkwụ onye ọzọ, ya bụ ịgbaso ụzọ omume ya.
theological_decisions:
- issue: Ihe ὑπὲρ ὑμῶν pụtara gbasara ahụhụ Mesaya
  choice: n’ihi unu
  alternative: n’ọnọdụ unu; maka ọdịmma unu
  rationale: Amaokwu ahụ na-ekwu na Mesaya tara ahụhụ maka ndị na-agụ ya, ma ebe a ọ na-elekwasịkwa anya n’ịbụ ihe nlereanya ha ga-agbaso. “N’ihi unu” na-echekwa obosara echiche ahụ n’amanyeghị nkọwa otu ozizi naanị.
- issue: Ọrụ Χριστός n’amaokwu a
  choice: Mesaya
  alternative: Kraịst
  rationale: A họọrọ “Mesaya” iji mee ka ọrụ ya dị ka utu aha nke Onye E Tere Mmanụ pụta ìhè, dịka isi mmalite Grik na ọnọdụ amaokwu ahụ si kwado.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta mee ntụgharị a. Nhazi ahịrịokwu ahụ na-edobe njikọ dị n’etiti ọkpụkpọ, ahụhụ Mesaya, na ebumnuche nke iso nzọụkwụ ya; akara ala peeji [a] dịkwa n’ahịrị isi.
