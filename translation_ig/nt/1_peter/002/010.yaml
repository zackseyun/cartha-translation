  text: οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ, οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/010.yaml
  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: ig
  text: Unu bụ ndị na-adịghị bụrụ ndị[a] n’oge gara aga, ma ugbu a unu bụ ndị Chineke; unu bụ ndị a na-emereghị ebere, ma ugbu a e meere unu ebere.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pita na-ekwughachi Hosea 1:9–10; 2:23, na-etinye okwu banyere mweghachi Izrel n’ọrụ n’ihe gbasara njirimara ndị ọ na-edegara akwụkwọ ozi a ugbu a dịka ndị Chineke.
    reason: cross_reference
  - marker: b
    text: 'Ma ọ bụ: “unu bụ ndị na-anataghị ebere, ma ugbu a unu anatala ebere.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ
  choice: unu bụ ndị
  rationale: Ọ na-ezo aka n’ebe ndị a na-agwa okwu nọ n’amaokwu bu ụzọ; ‘unu bụ ndị’ na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: ποτε
  choice: n’oge gara aga
  rationale: Ọ na-egosi ọnọdụ mbụ nke e ji ‘ugbu a’ tụnyere; nkebi a bụ Igbo doro anya ma dịkwa mma n’ọnụ.
- source_word: λαὸς
  choice: otu ndị / ndị nke Chineke
  rationale: λαός na-egosi ìgwè mmadụ nwere njirimara ọnụ, karịsịa n’okwu ọgbụgba ndụ. ‘Otu ndị’ na-edobe echiche ahụ n’ahịrị mbụ, ebe ‘ndị nke Chineke’ na-asụgharị λαὸς θεοῦ n’ụzọ eke.
- source_word: θεοῦ
  choice: nke Chineke
  rationale: Ọ na-egosi ndị bụ nke Chineke; ‘ndị nke Chineke’ bụ usoro okwu Igbo dị mfe ma na-edobe ike okwu ọgbụgba ndụ ahụ.
- source_word: οὐκ ἠλεημένοι
  choice: a na-emereghị ebere
  rationale: Perfect passive participle ahụ na-akọ ọnọdụ mbụ nke ndị ahụ dịka ndị a na-emerebeghị ebere; usoro a na-edobe olu nnara nke Grik.
- source_word: ἐλεηθέντες
  choice: e meere unu ebere
  rationale: Aorist passive participle ahụ na-egosi na ebere bịara ha site n’omume e mere ha; Igbo a na-egosikwa ọnọdụ ọhụrụ sitere n’omume ahụ.
- source_word: δὲ
  choice: ma
  rationale: ‘Ma’ na-egosi mgbanwe doro anya n’etiti ọnọdụ mbụ na nke ugbu a.
- source_word: νῦν
  choice: ugbu a
  rationale: Ọ na-egosi ọnọdụ ha ugbu a ma na-emegide ya na nke oge gara aga.
theological_decisions:
- issue: Ntụaka Hosea na njirimara ndị ọgbụgba ndụ
  choice: E debere ọdịiche dị n’etiti ‘na-abụghị otu ndị’ na ‘ndị nke Chineke.’
  alternative: Ịsụgharị akụkụ abụọ ahụ dịka ‘unu abụghị ndị Chineke ... ugbu a unu bụ ndị Chineke.’
  rationale: Grik kwuru mbụ ‘ọ bụghị otu ndị,’ ọ bụghị kpọmkwem ‘ọ bụghị ndị Chineke,’ ma mesịa kwuo ‘ndị nke Chineke.’ Idebe ọdịiche a na-echekwa okwu isi mmalite na mgbagwoju anya ya, ma na-eme ka nkwughachi asụsụ mweghachi nke Hosea pụta ìhè n’etinyeghị nkọwa agbụrụ ma ọ bụ nke ụka n’ime amaokwu ahụ.
- issue: Ụzọ e si kọwaa ebere
  choice: 'E ji olu nnara sụgharịa ya: ‘a na-emereghị ebere ... e meere unu ebere.’'
  alternative: ‘Unu anataghị ebere ... ugbu a unu anatala ebere.’
  rationale: Nhọrọ a na-anọ nso n’ụdị passive nke Grik ma ghara ịkọwapụta karịa ihe ederede kwuru; ụzọ nke ‘ịnata ebere’ ka bụ ezigbo ntụgharị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. ‘Otu ndị’ na-egosi njirimara ọnụ nke λαός, ebe usoro abụọ yiri ibe ha na-edobe ngbanwe siri ike nke dị na Grik.
