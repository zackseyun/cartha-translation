revisions:
- from: Unu bụ ndị na-abụghị otu ndị[a] n’oge gara aga, ma ugbu a unu bụ ndị nke Chineke; unu bụ ndị a na-emereghị ebere, ma ugbu a e meere unu ebere.[b]
  to: Unu bụ ndị na-adịghị bụrụ ndị[a] n’oge gara aga, ma ugbu a unu bụ ndị Chineke; unu bụ ndị a na-emereghị ebere, ma ugbu a e meere unu ebere.[b]
  rationale: 'The revision replaces the unnatural and potentially misleading ‘otu ndị’ with ‘ndị’ in the negative predicate, yielding idiomatic Standard Igbo while preserving the source’s deliberate contrast: formerly not a people, now God’s people. The passive mercy wording and parallel structure are retained. The cross-reference footnote is adjusted for precision and natural Igbo without adding theological claims.'
