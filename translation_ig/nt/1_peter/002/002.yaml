id: 1PE.2.2
reference: 1 Peter 2:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε ⸂εἰς σωτηρίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/002.yaml
  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: ig
  text: Dị ka ụmụ a mụrụ ọhụrụ, na-achọsienụ ike mmiri ara ehi dị ọcha nke ime mmụọ[a], ka unu wee too site na ya ruo na nzọpụta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mmiri ara ehi dị ọcha nke uche” ma ọ bụ “mmiri ara ehi dị ọcha nke ezi uche.” Okwu Grik ahụ pụrụ ịpụta ihe metụtara uche ma ọ bụ ndụ ime mmadụ; n'ebe a, ọ pụrụ izo aka na nri nke ime mmụọ, ọ bụghị mmiri ara nkịtị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἀρτιγέννητα βρέφη
  choice: Dị ka ụmụ ọhụrụ
  rationale: Ọ na-egosi ntụnyere ma na-echekwa onyinyo ụmụ a mụrụ ọhụrụ n'Igbo dị mfe ma kwekọọ n'okwu a na-ekwu kwa ụbọchị.
- source_word: τὸ λογικὸν
  choice: nke ime mmụọ
  rationale: N'ọnọdụ a, ọ na-akọwa mmiri ara ehi n'ụzọ ihe atụ dị ka nri nke ndụ ime mmadụ, ọ bụghị mmiri ara nkịtị. Ihe ndị ọzọ okwu Grik ahụ pụrụ ịpụta ka edebere n'ala ala peeji.
- source_word: ἄδολον
  choice: dị ọcha
  rationale: Ọ na-egosi ihe a na-agwaghị ihe ọzọ, nke na-enweghị aghụghọ ma ọ bụ ngwakọta na-emebi ya.
- source_word: γάλα
  choice: mmiri ara ehi
  rationale: Ọ na-echekwa ihe atụ nke nri na-eme ka nwa too.
- source_word: ἐπιποθήσατε
  choice: na-agụsinụ agụụ ike maka
  rationale: Ọ bụ iwu na-akpọ ndị a na-agwa ka ha chọọ ihe ahụ nke ukwuu; nsọtụ -nụ na-egosi na a na-agwa ọtụtụ mmadụ.
- source_word: ἵνα ἐν αὐτῷ αὐξηθῆτε
  choice: ka unu wee site na ya too
  rationale: Ọ na-egosi ebumnuche ahụ nakwa na mmiri ara ehi ahụ bụ ihe e ji eme ka ha too.
- source_word: εἰς σωτηρίαν
  choice: ruo na nzọpụta
  rationale: Ọ na-echekwa ntụziaka na ebumnuche dị na εἰς, n'ebughị ụzọ kpebie ma nzọpụta a bụ naanị nke ugbu a ma ọ bụ naanị nke ga-eme n'ọdịnihu.
theological_decisions:
- issue: Ihe λογικός pụtara n'ihe atụ nke mmiri ara ehi
  choice: nke ime mmụọ
  alternative: nke uche; nke ezi uche dị na ya
  rationale: “Nke ime mmụọ” na-eme ka onye Igbo ghọta na a naghị ekwu maka mmiri ara nkịtị, ma okwu Grik ahụ nwekwara ike izo aka n'uche, ezi uche, ma ọ bụ ndụ ime mmadụ. Ihe e dere n'ala ala peeji na-echekwa nghọtahie a pụrụ inwe.
- issue: Ike okwu εἰς σωτηρίαν
  choice: ruo na nzọpụta
  alternative: maka nzọpụta; ka unu too n'ime nzọpụta
  rationale: Nke a na-echekwa echiche nke uto na-aga n'ihu n'ebe nzọpụta nọ, n'ịmanyeghị nkọwa ụka pụrụ iche banyere usoro ma ọ bụ oge nzọpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere ihe atụ nke nwa ọhụrụ, mmiri ara ehi, uto na nzọpụta, ma e zere okwu pụrụ iche nke otu ụka.
