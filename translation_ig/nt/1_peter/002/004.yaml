    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “ndị mmadụ”; nke a nwere ike ịpụta “ndị mmadụ n’ozuzu” ma ọ bụ “ụmụ mmadụ.”
    reason: lexical_alternative
