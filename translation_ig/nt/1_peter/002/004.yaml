revisions:
- from: Ka unu na-abịakwute ya[a]—ya bụ, nkume dị ndụ—ndị mmadụ jụrụ ya, ma n’ebe Chineke nọ, ọ bụ nke a họọrọ, dịkwa oke ọnụ ahịa.[b]
  to: Mgbe unu na-abịakwute ya[a]—nkume dị ndụ nke ndị mmadụ[b] jụrụ—ma n’anya Chineke, ọ bụ onye a họọrọ, onye dị oke ọnụ ahịa.
  rationale: The revised text renders the participle with an unambiguously temporal expression, preserves the Greek contrast between human rejection and God's evaluation, and uses a natural Igbo expression ('n’anya Chineke') for the evaluative force of παρὰ θεῷ. Footnote anchors are aligned with the words they explain. No doctrinal expansion is introduced, and the referent remains pronominal as in Greek.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:14:06Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the participial approach to Christ, the living-stone metaphor, human rejection, and God''s contrary valuation. However, the conjunction "Ka" is potentially exhortative (''let''), whereas the Greek participle is descriptive/temporal (''as/while you are coming''). The wording should therefore be adjusted to avoid adding an imperative nuance. The footnote b anchor is also misplaced: it follows the whole clause but its content discusses only ἔντιμον and παρά with dative, while the English audit footnote b concerns ὑπὸ ἀνθρώπων.'
  naturalness: '"Mgbe unu na-abịakwute ya" is natural Standard Igbo and clearly gives the temporal force. "Ọ bụkwa onye Chineke họọrọ, onye dị oke ọnụ ahịa n’anya ya" reads naturally, though the repeated ''onye'' is used predicatively for the personal referent while retaining the stone metaphor.'
  terminology: '"Nkume dị ndụ," "ndị mmadụ," "jụrụ," and "Chineke" are appropriate. "Onye Chineke họọrọ" naturally renders ἐκλεκτός without importing doctrinal terminology. "Onye dị oke ọnụ ahịa n’anya ya" suitably expresses ἔντιμος as valued/precious. The alternate ''onye a na-asọpụrụ nke ukwuu'' remains a legitimate semantic alternative.'
  issues:
  - severity: medium
    issue: '"Ka unu na-abịakwute ya" can be read as an exhortation.'
    rationale: Greek προσερχόμενοι is a present participle modifying the readers, naturally rendered temporally here; it is not an imperative. "Mgbe unu na-abịakwute ya" avoids an added hortatory force.
  - severity: medium
    issue: Footnote b is not anchored to the phrase it explains and does not preserve the audit-trail note for ὑπὸ ἀνθρώπων.
    rationale: The marker follows the final clause, but its note discusses ἔντιμον and παρὰ θεῷ. The source audit footnote b specifically clarifies that 'men' denotes human beings/people. Place the marker after "ndị mmadụ" and supply that clarification.
  - severity: low
    issue: The explanation of παρά with dative in the footnote is interpretive and unnecessary in the verse note.
    rationale: The main wording already conveys the evaluative relation to God. Retaining only a lexical alternative for ἔντιμον keeps the footnotes concise and properly anchored.
  revised_text: Mgbe unu na-abịakwute ya[a]—nkume dị ndụ nke ndị mmadụ[b] jụrụ—ma n’anya Chineke, ọ bụ onye a họọrọ, onye dị oke ọnụ ahịa.
