id: 1PE.2.4
reference: 1 Peter 2:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/004.yaml
  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: ig
  text: Mgbe unu na-abịakwute ya[a]—nkume dị ndụ nke ndị mmadụ[b] jụrụ—ma n’anya Chineke, ọ bụ onye a họọrọ, onye dị oke ọnụ ahịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “mgbe unu na-abịakwute onye ahụ” ma ọ bụ “ka unu na-abịakwute onye ahụ.”'
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “ndị mmadụ”; nke a nwere ike ịpụta “ndị mmadụ n’ozuzu” ma ọ bụ “ụmụ mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸς ὃν
  choice: na-abịakwute ya
  rationale: Ngwaa Igbo “ịbịakwute” na-egosi ije ma ọ bụ ịbịaru onye ahụ nso, ma na-edobe ntụziaka dị na πρός.
- source_word: προσερχόμενοι
  choice: Ka unu na-abịakwute
  rationale: “Ka … na-” na-egosi omume na-aga n’ihu ma na-enye participle ahụ nghọta nke “mgbe unu na-abịa,” nke dabara n’usoro okwu a.
- source_word: λίθον ζῶντα
  choice: nkume dị ndụ
  rationale: Nke a na-edobe ihe atụ dị ịtụnanya nke nkume nke dị ndụ, ma ghara ịgbanwe λίθος ka ọ bụrụ nnukwu okwute.
- source_word: ὑπὸ ἀνθρώπων
  choice: ndị mmadụ
  rationale: “Ndị mmadụ” bụ ụzọ Igbo nkịtị si akọwa ἄνθρωποι n’ụdị ọtụtụ; ọ gụnyere mmadụ n’ozuzu ma na-edobe ọdịiche dị n’etiti mkpebi mmadụ na nke Chineke.
- source_word: ἀποδεδοκιμασμένον
  choice: jụrụ ya
  rationale: Nke a bụ okwu doro anya ma dị ndụ n’Igbo maka ihe a nwalere ma a nabataghị; ọ na-egosikwa ọnọdụ nke ịjụ ahụ rụpụtara.
- source_word: παρὰ δὲ θεῷ
  choice: ma n’ebe Chineke nọ
  rationale: Nkebi a na-egosi ọnọdụ na ntule n’ihu Chineke, ma na-ekwe ka “nke a họọrọ” na “dị oke ọnụ ahịa” bụrụ nkọwa abụọ metụtara nkume ahụ.
- source_word: ἐκλεκτὸν
  choice: nke a họọrọ
  rationale: Ọ na-edobe echiche nke ịhọrọ n’enweghị iji okwu ụka pụrụ iche ma ọ bụ ịtinye aha onye họọrọ n’ebe Grik hapụrụ usoro ahụ mkpụmkpụ.
- source_word: ἔντιμον
  choice: dịkwa oke ọnụ ahịa
  rationale: Okwu a na-egosi uru dị elu; ọ dabara n’ihe atụ nkume ahụ ma na-ahapụkwa echiche nke ịbụ onye a na-asọpụrụ ka ọ pụta ìhè na nkọwa ala peeji.
theological_decisions:
- issue: Onye “ya” na nkume dị ndụ na-arụtụ aka na ya
  choice: E debere ya dịka nnọchiaha na ihe atụ “nkume dị ndụ.”
  alternative: Ịtinye aha Jizọs Kraịst kpọmkwem.
  rationale: Amaokwu ndị gbara ya gburugburu na-egosi na ọ bụ Onyenwe anyị/Kraịst ka a na-ekwu maka ya, ma Grik ji nnọchiaha mee ya ebe a. Ya mere, ntụgharị ahụ anaghị etinye aha na-adịghị n’amaokwu a.
- issue: Oke ọrụ nke παρὰ δὲ θεῷ
  choice: '“N’ebe Chineke nọ” dị n’ihu nkọwa abụọ ahụ: onye a họọrọ na onye dị oke ọnụ ahịa.'
  alternative: “Chineke họọrọ ya, ọ dịkwa oke ọnụ ahịa n’anya Chineke.”
  rationale: Usoro a na-edobe ọnọdụ/ntule nke παρά na dative ma ghara ịmanye amaokwu ahụ ikwu kpọmkwem na nkebi ahụ bụ naanị onye mere nhọpụta ma ọ bụ na ọ metụtara naanị “oke ọnụ ahịa.”
- issue: Ihe ἔντιμον pụtara
  choice: “dị oke ọnụ ahịa”
  alternative: “a na-asọpụrụ”
  rationale: Okwu Grik nwere ike igosi nnukwu uru ma ọ bụ nsọpụrụ. “Oke ọnụ ahịa” dabara nke ọma n’ihe atụ nkume, ebe a na-echekwa echiche nsọpụrụ n’ala peeji.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrị ogologo ahụ na akara nkewa na-echekwa usoro nkọwa Grik ma mee ka ihe atụ “nkume dị ndụ” doo anya. Ejighị okwu ụka pụrụ iche dochie “nke a họọrọ,” a hapụkwara nnọchiaha “ya” dịka ọ dị na isi mmalite.
