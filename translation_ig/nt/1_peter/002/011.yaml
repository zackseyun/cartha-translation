id: 1PE.2.11
reference: 1 Peter 2:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: ig
  text: Ndị m hụrụ n’anya, ana m arịọsi unu ike, dịka ndị bi n’ala na-abụghị ala ha na ndị ọbịa na-anọ nwa oge[a], ka unu zere ọchịchọ nke anụ ahụ[b] ndị na-ebuso mkpụrụ obi[c] agha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị okwu abụọ a dịka “ndị bi n’ebe na-abụghị ala ha” na “ndị bịara ịnọ nwa oge.” Ha abụọ na-emesi ike na ndị kwere ekwe anaghị enwe ọnọdụ ụmụ amaala zuru ezu n’ụwa ma ọ bụ n’ọgbọ dị ugbu a.
    reason: lexical_alternative
  - marker: b
    text: “Ọchịchọ nke anụ ahụ” a pụkwara ịsụgharị dịka “ọchịchọ anụ ahụ”; n’ụzọ nkọwa, “ọchịchọ mmehie.”
    reason: lexical_alternative
  - marker: c
    text: “Mkpụrụ obi” nwekwara ike ịpụta “ndụ” ma ọ bụ “onwe mmadụ” n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Ndị m hụrụ n’anya
  rationale: Ọ bụ okwu a na-akpọ ọtụtụ ndị n’ịhụnanya. Nsụgharị a bụ Igbo doro anya ma na-echekwa mmetụta ịhụnanya dị n’okwu Grik ahụ.
- source_word: παρακαλῶ
  choice: ana m arịọ unu
  rationale: N’ebe a, okwu ahụ bụ arịrịọ siri ike nke na-akpọ ndị na-ege ntị ka ha mee ihe. ‘Ana m arịọ unu’ bụ okwu Igbo dị mma ma dị ùgwù, na-enweghị ịdị ka iwu ike.
- source_word: παροίκους καὶ παρεπιδήμους
  choice: ndị mba ọzọ bi n’ala ọzọ na ndị ọbịa nọ nwa oge
  rationale: Okwu abụọ ahụ na-egosi ndị bi ebe na-abụghị ala nke ha na ndị ọnụnọ ha bụ naanị nwa oge. E debere ha abụọ ka ike njikọ ahụ ghara ifu.
- source_word: ἀπέχεσθαι
  choice: ka unu zere
  rationale: Ọ na-akpọ ha ka ha nọgide na-ewepụ onwe ha n’ihe ndị ahụ. ‘Zere’ bụ okwu Igbo nkịtị, doro anya, ma na-egosi ịghara iso ihe ahụ.
- source_word: σαρκικῶν ἐπιθυμιῶν
  choice: ọchịchọ nke anụ ahụ
  rationale: Nsụgharị a na-echekwa ihe oyiyi nke σάρξ kama ịkọwa ya ozugbo dịka ‘ọchịchọ mmehie,’ nke ga-eme ka nkọwa ahụ dị warara karịa isi mmalite.
- source_word: στρατεύονται
  choice: na-ebuso ... agha
  rationale: Nke a na-echekwa ihe oyiyi agha dị n’okwu Grik ma na-ada nke ọma n’Igbo.
- source_word: κατὰ τῆς ψυχῆς
  choice: na-ebuso mkpụrụ obi agha
  rationale: ‘Mkpụrụ obi’ na-echekwa ịdị arọ nke ψυχή, ma ihe odide ahụ anaghị amanye ka a ghọta ya naanị dịka akụkụ ime mmụọ dị iche n’ahụ.
theological_decisions:
- issue: Ihe σαρκικῶν pụtara n’ọnọdụ ndụ omume
  choice: nke anụ ahụ
  alternative: nke mmehie
  rationale: ‘Nke anụ ahụ’ na-echekwa njikọ okwu ahụ na σάρξ na mgbagwoju anya dị na ya; ‘nke mmehie’ ga-abụ nkọwa gbakwunyere, ọ bụghị naanị nsụgharị.
- issue: Ihe ψυχή pụtara
  choice: mkpụrụ obi
  alternative: ndụ ma ọ bụ onwe mmadụ
  rationale: ‘Mkpụrụ obi’ na-echekwa okwu ọdịnala na ịdị arọ ya, ebe ndetu na-egosi na n’ebe a ọ pụkwara ịpụta ndụ ma ọ bụ mmadụ n’onwe ya; a naghị eji ya kwado nkewa ahụ na mkpụrụ obi n’ụzọ ederede ahụ na-ekwughị.
- issue: Ọnọdụ ndị kwere ekwe dịka παροίκους καὶ παρεπιδήμους
  choice: ndị mba ọzọ bi n’ala ọzọ na ndị ọbịa nọ nwa oge
  alternative: ndị njem na ndị a chụgara n’ala ọzọ
  rationale: Isi okwu Grik na-emesi ọnọdụ onye na-abụghị nwa afọ na ọnụnọ nwa oge ike. ‘Ndị a chụgara’ nwere ike ịgbakwunye echiche nke ịchụpụ mmadụ n’ike, nke okwu ndị a anaghị ekwu kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A na-echekwa ihe oyiyi agha na okwu ‘anụ ahụ’ nke isi mmalite, ebe ndetu na-enye ụzọ nghọta ndị ọzọ n’enweghị ịmanye otu nkọwa okpukpe.
