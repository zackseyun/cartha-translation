review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the exhortation, abstention, flesh-related desires, and military metaphor. However, “ndị mba ọzọ bi n’ala ọzọ” is potentially misleading and tautological: it can suggest people of other nationalities living abroad rather than resident foreigners in a land not their own. The revised wording retains the paired κατοικία/temporary-presence nuance of παροίκους and παρεπιδήμους without adding forced exile.'
  naturalness: 'The revision uses more idiomatic Standard Igbo: “Ana m arịọsi unu ike” conveys the earnest force of παρακαλῶ, and “ndị bi n’ala na-abụghị ala ha” is clearer than the draft’s national-language phrasing. The relative clause is made to follow its plural referent naturally.'
  terminology: “Ndị m hụrụ n’anya,” “ọchịchọ nke anụ ahụ,” and “mkpụrụ obi” appropriately preserve the warm address, σάρξ imagery, and the semantic breadth of ψυχή. The footnotes retain alternatives without resolving ψυχή into a technical doctrinal sense or equating σαρκικός outright with “sinful.”
  issues:
  - severity: medium
    issue: The rendering “ndị mba ọzọ bi n’ala ọzọ” is semantically imprecise for παροίκους.
    rationale: It may mean foreigners living in another country and does not clearly express residence in a land that is not one’s own. “Ndị bi n’ala na-abụghị ala ha” conveys the relevant non-native-resident status.
  - severity: low
    issue: “Ana m arịọ unu” somewhat softens the exhortative force of παρακαλῶ.
    rationale: “Ana m arịọsi unu ike” is still courteous but more clearly conveys an earnest appeal/urge.
  - severity: low
    issue: The phrase “bụ́ ndị” after the generic singular-form “ọchịchọ” is less smooth.
    rationale: Placing the relative clause directly after “ọchịchọ nke anụ ahụ” gives a natural generic/plural sense corresponding to the Greek plural ἐπιθυμιῶν.
  revised_text: Ndị m hụrụ n’anya, ana m arịọsi unu ike, dịka ndị bi n’ala na-abụghị ala ha na ndị ọbịa na-anọ nwa oge[a], ka unu zere ọchịchọ nke anụ ahụ[b] ndị na-ebuso mkpụrụ obi[c] agha.
