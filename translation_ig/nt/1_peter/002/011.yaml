- from: Ndị m hụrụ n’anya, ana m arịọ unu, dị ka ndị mba ọzọ bi n’ala ọzọ na ndị ọbịa nọ nwa oge[a], ka unu zere ọchịchọ nke anụ ahụ[b], bụ́ ndị na-ebuso mkpụrụ obi[c] agha.
  to: Ndị m hụrụ n’anya, ana m arịọsi unu ike, dịka ndị bi n’ala na-abụghị ala ha na ndị ọbịa na-anọ nwa oge[a], ka unu zere ọchịchọ nke anụ ahụ[b] ndị na-ebuso mkpụrụ obi[c] agha.
  rationale: The revision clarifies the two related outsider-status terms, strengthens the earnest appeal, and smooths the relative clause. It preserves the source’s ambiguity concerning “flesh” and “soul,” retains the military image, and keeps all footnote anchors attached to the words they explain.
