base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/022.yaml
  text: who committed no sin[b][a], nor was deceit found in his mouth.
translation:
  language: ig
  text: Onye na-emeghị mmehie ọ bụla,[b] a hụghịkwa aghụghọ n’ọnụ ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “wayo” ma ọ bụ “nduhie”; okwu Grik a na-egosi aghụghọ, wayo, ma ọ bụ nduhie.
    reason: lexical_alternative
  - marker: b
    text: Usoro okwu a na-ekwughachi okwu dị na Aịzaya 53:9.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: onye
  rationale: Ọ bụ nnọchiaha njikọ nke na-ezo aka na Kraịst n’amaokwu bu ụzọ; “onye” na-edobe njikọ ahụ n’ụzọ Igbo si ada nke ọma.
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: na-emeghị mmehie ọ bụla
  rationale: Mgbe ποιέω sonyere ἁμαρτία, ihe ọ pụtara bụ ime mmehie. “Mmehie ọ bụla” na-egosi n’ụzọ doro anya na o meghị mmehie, n’agbanyeghị na okwu Grik bụ otu.
- source_word: οὐδὲ
  choice: a hụghịkwa
  rationale: Mgbakwunye “-kwa” na-ejikọta nkebiokwu nke abụọ na nke mbụ ma na-edobe nkwụsi ike nke ajụ abụọ ahụ.
- source_word: εὑρέθη
  choice: a hụghị
  rationale: Nke a na-edobe ọdịdị nnara nke ngwaa Grik n’enweghị ịkọ onye nyochara ma ọ bụ chọta ya.
- source_word: δόλος
  choice: aghụghọ
  rationale: “Aghụghọ” bụ okwu Igbo doro anya nke na-ekpuchi echiche nke iduhie mmadụ, wayo, ma ọ bụ omume aghụghọ.
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: n’ọnụ ya
  rationale: Ntụgharị a dị nso n’okwu Grik, na-edobekwa ihe atụ nke ọnụ nke dị mkpa n’olu e si kwuo Aịzaya 53:9.
theological_decisions:
- issue: Okwu a na-ada ụda Aịzaya 53:9 mgbe ọ na-ekwu banyere enweghị mmehie na eziokwu Kraịst.
  choice: E debere “na-emeghị mmehie ọ bụla” na “a hụghịkwa aghụghọ n’ọnụ ya.”
  alternative: “Ọ dịghị mgbe o mere mmehie, ọ dịghịkwa mgbe o kwuru okwu aghụghọ.”
  rationale: Ntụgharị dịtụ nso n’usoro Grik na-echekwa njikọ ya na Aịzaya ma ghara ịgbasa ihe amaokwu ahụ kwuru site n’ịkọwa ya n’ụzọ sara mbara.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. E debere usoro ahịrịokwu dị nso n’akwụkwọ nsọ e zoro aka na ya, ma mee ka ọ daa nke ọma n’Igbo.
