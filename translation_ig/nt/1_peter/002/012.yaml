source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: ig
  text: Nọgidenụ na-ebi ndụ ọma n’etiti ndị mba ọzọ, ka ha wee, n’ihe ha na-ekwutọ unu dị ka ndị na-eme ihe ọjọọ, site n’ịhụ ọrụ ọma unu, nye Chineke otuto n’ụbọchị nleta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “n’ụbọchị nlekọta.” Okwu Greek ahụ nwere ike izo aka n’oge Chineke na-eleta ma ọ bụ na-enyocha mmadụ; n’ebe a, ọ naghị ekpebi kpọmkwem ma nleta ahụ bụ nke amara, enyemaka, ma ọ bụ ikpe.'
    reason: Iji chekwaa obosara na mgbagwoju ihe ἐπισκοπή nwere ike ịpụta, n’enweghị ịgbakwunye onye a na-eleta ma ọ bụ ịkọwa ụdị nleta ahụ kpọmkwem.
lexical_decisions:
- source_word: ἀναστροφή
  choice: àgwà
  rationale: N’ebe a, okwu ahụ pụtara ụzọ mmadụ si ebi ndụ ma ọ bụ omume ya; “àgwà” bụ okwu Igbo dị mfe ma sara mbara nke na-eburu echiche ahụ.
- source_word: τὰ ἔθνη
  choice: ndị mba ọzọ
  rationale: N’ọnọdụ a, ọ na-ezo aka na ndị na-abụghị ndị nke Chineke, ya bụ ndị mba ọzọ; nsụgharị a na-edobe ọdịiche mmekọrịta dị na Greek n’enweghị ịkụnye nkọwa ụka pụrụ iche.
- source_word: καταλαλοῦσιν
  choice: na-ekwutọ
  rationale: Ọ pụtara ikwu okwu ọjọọ megide mmadụ ma ọ bụ ibo ya ebubo n’ụzọ na-emebi aha ya.
- source_word: ἐποπτεύοντες
  choice: hụ ... anya
  rationale: Okwu ahụ na-egosi iji nlezianya hụ ma leba omume anya, ọ bụghị naanị ịnụ akụkọ banyere ya.
- source_word: ἐπισκοπή
  choice: ọ ga-abịa ileta ha
  rationale: “Nleta” na-edobe isi echiche Greek nke ọbịbịa Chineke iji nyochaa ma ọ bụ nyere aka; itinye Chineke dị ka onye na-abịa na-eme ka Igbo doo anya, ebe “ha” bụ ihe mmeju asụsụ Igbo chọrọ mana ọ bụghị ihe Greek kwuru hoo haa.
theological_decisions:
- issue: Ihe “ụbọchị nleta” pụtara
  choice: ụbọchị ọ ga-abịa ileta ha
  alternative: ụbọchị ọ ga-abịa ikpe ha ikpe / ụbọchị nzọpụta
  rationale: Greek ἡμέρα ἐπισκοπῆς nwere ike ịpụta oge nleta Chineke maka amara, nyocha, ma ọ bụ ikpe. Nsụgharị isi na-edobe mgbagwoju ahụ kama ikpebi otu nkọwa nkà mmụta okpukpe.
- issue: Njikọ ἐν ᾧ
  choice: n’ihe ha na-ekwutọ unu dị ka ndị na-eme ihe ọjọọ
  alternative: ọ bụ ezie na ha na-ekwutọ unu dị ka ndị na-eme ihe ọjọọ
  rationale: A họọrọ usoro dị nso na Greek iji chekwaa ihe na-edochaghị anya banyere ma ọ bụ ọnọdụ, okwu ebubo, ma ọ bụ akụkụ ndụ ha na-ekwutọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro “Na-akpa...” nye iwu na-aga n’ihu, ma zere okwu ụka pụrụ iche. Akara ụda dị na “àgwà” na-enyere aka igbochi mgbagwoju ọgụgụ.
