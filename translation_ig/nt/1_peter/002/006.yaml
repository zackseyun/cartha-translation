reference: 1 Peter 2:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διότι περιέχει ⸀ἐν γραφῇ· Ἰδοὺ τίθημι ἐν Σιὼν λίθον ⸂ἀκρογωνιαῖον ἐκλεκτὸν⸃ ἔντιμον, καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ μὴ καταισχυνθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/006.yaml
  text: 'For it stands in Scripture: “Behold[a], I lay in Zion a chosen and honored cornerstone[e][d][c][b], and the one who believes in him will certainly not be put to shame.”'
translation:
  language: ig
  text: 'N’ihi na e dere n’Akwụkwọ Nsọ, sị: “Lee, ana m etinye na Zayọn nkume isi nkuku a họọrọ, nke a na-asọpụrụ[a]; onye kwere na ya agaghị eme ya ihere ma ọlị.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nke dị oke ọnụ ahịa.” Okwu Grik ahụ nwekwara echiche nke uru dị elu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “agaghị eme ka ihere mee ya ma ọlị.” Okwu Grik ahụ na-ekwusi ike nke ukwuu na nke a agaghị eme.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe Akwụkwọ Nsọ kwuru iji kwado okwu bu ya ụzọ; ‘N’ihi na’ na-egosipụta njikọ nkọwa ahụ nke ọma.
- source_word: περιέχει ἐν γραφῇ
  choice: e dere n’Akwụkwọ Nsọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ugwu isi kwuo akpaalaokwu Grik pụtara na okwu ahụ dị n’Akwụkwọ Nsọ, n’enweghị ịmanye usoro okwu Grik na-adịghị eke n’Igbo.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: ‘Lee’ na-edobe ike oku ka onye na-agụ gee ntị, ma dabara n’asụsụ amụma dị ugwu.
- source_word: τίθημι
  choice: ana m atọgbọ
  rationale: N’ihe atụ owuwu ụlọ, ‘ịtọgbọ nkume’ na-egosi itinye nkume n’ọnọdụ ya nke ọma.
- source_word: ἐν Σιὼν
  choice: na Zayọn
  rationale: Ọ na-edobe echiche ebe nke ἐν n’ụzọ Igbo nkịtị.
- source_word: λίθον ἀκρογωνιαῖον
  choice: nkume isi nkuku
  rationale: Ọ bụ okwu Igbo doro anya maka nkume dị mkpa nke nkuku ụlọ, ma ọ naghị akọwa ya karịa ihe Grik kwuru.
- source_word: ἐκλεκτὸν
  choice: nke a họọrọ
  rationale: Ọ na-edobe echiche nke ịhọpụta nkume ahụ, n’asụsụ Igbo dị mfe.
- source_word: ἔντιμον
  choice: nke a na-asọpụrụ
  rationale: Ọ na-ebute echiche nsọpụrụ dị n’okwu ahụ ụzọ, ma okwu Grik nwekwara ike ịpụta ihe dị oke ọnụ ahịa.
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: onye kwere na ya
  rationale: ‘Onye kwere’ na-anọchi participle ahụ nke ọma. ‘Na ya’ na-ahapụ nnọchiaha Igbo ka ọ kwekọọ ma na nkume e kwuru okwu ya ma na onye Kraịst nke Pita na-etinye ihe atụ ahụ n’ahụ ya.
- source_word: οὐ μὴ καταισχυνθῇ
  choice: agaghị abụ onye ihere ma ọlị
  rationale: ‘Ma ọlị’ na-egosipụta nkwusi ike nke οὐ μή, ebe ‘ịbụ onye ihere’ na-eburu echiche ka mmadụ ghara ịla n’ihere.
theological_decisions:
- issue: Ihe αὐτῷ na-ezo aka na ya n’amaokwu Aịzaya dịka Pita si jiri ya
  choice: onye kwere na ya
  alternative: onye tụkwasịrị nkume ahụ obi / onye kwere na ya dịka onye nwoke
  rationale: Nnọchiaha Igbo ‘ya’ adịghị egosi okike, ya mere ọ na-echekwa ihe atụ nkume ahụ ma kwekwa ka gburugburu 1 Pita 2:4–8 gosi na Pita na-etinye ya n’ahụ Kraịst, n’enweghị idozi mgbagwoju anya ahụ n’ụzọ aka ike.
- issue: Uru ma ọ bụ nsọpụrụ dị na ἔντιμον
  choice: nke a na-asọpụrụ
  alternative: nke dị oke ọnụ ahịa
  rationale: ‘Nke a na-asọpụrụ’ na-akwado isiokwu nsọpụrụ dị n’amaokwu na-esote, ebe ndetu na-echekwa echiche uru dị elu nke okwu Grik nwekwara ike ibu.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Lee’ na-echekwa ụda amụma; ‘e dere n’Akwụkwọ Nsọ’ na-eme ka akpaalaokwu Grik bụrụ nke eke n’Igbo. Nnọchiaha ‘ya’ na-echekwa ma ihe atụ nkume ahụ ma ntinye ya n’ahụ Kraịst n’okwu gbara amaokwu ahụ gburugburu.
