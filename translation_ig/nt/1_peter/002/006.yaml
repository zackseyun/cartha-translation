review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the scriptural citation, Zion, the chosen and honored cornerstone, belief directed to the referent, and the emphatic assurance. However, “agaghị abụ onye ihere” describes someone as a shameful person rather than expressing the passive sense of καταισχυνθῇ, “will not be put to shame.”
  naturalness: “E dere n’Akwụkwọ Nsọ, sị” and “Lee” are natural, suitably elevated Standard Igbo. “Ana m etinye” is more idiomatic and direct for laying/placing a building stone than “ana m atọgbọ.” “Agaghị eme ya ihere ma ọlị” naturally expresses the intended result.
  terminology: “Nkume isi nkuku,” “a họọrọ,” and “a na-asọpụrụ” are clear Standard Igbo renderings. The gender-neutral “ya” appropriately preserves the stone image while allowing the immediate Petrine context. Separate notes make the alternative senses and anchors clear.
  issues:
  - severity: medium
    issue: The final clause is semantically inaccurate.
    rationale: “Agaghị abụ onye ihere” means “will not be a shameful person,” whereas οὐ μὴ καταισχυνθῇ means that the believer will emphatically not be shamed/put to shame.
  - severity: low
    issue: The verb for placing the stone is less idiomatic than it could be.
    rationale: “Ana m atọgbọ” is understandable, but “ana m etinye” is the more natural general Standard Igbo expression for placing or setting a stone in this construction.
  - severity: low
    issue: The single footnote combines alternatives for two separate phrases and is anchored only at the verse end.
    rationale: Separate anchors after the relevant expressions improve auditability without changing meaning.
