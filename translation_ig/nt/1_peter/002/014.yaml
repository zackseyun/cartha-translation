  text: εἴτε ἡγεμόσιν ὡς δι’ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: ig
  text: ma ọ bụ ndị gọvanọ, dị ka ndị e zitere site n’aka ya[a] ka ha taa ndị na-eme ihe ọjọọ ahụhụ ma too ndị na-eme ihe ọma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị o zitere.” O yikarịrị ka “ya” na-ezo aka n’eze ma ọ bụ eze ukwu a kpọrọ aha n’amaokwu bu ụzọ; ụfọdụ na-aghọta “site n’aka ya” n’ụzọ sara mbara dịka Chineke, onye na-ahazi ikike ọchịchị.
    reason: alternative_reading
lexical_decisions:
- source_word: εἴτε
  choice: ma ọ bụ
  rationale: Ọ na-aga n’ihu n’usoro nhọrọ malitere n’amaokwu bu ụzọ; “ma ọ bụ” bụ ụzọ Igbo si ejikọta akụkụ nke abụọ nke usoro ahụ n'ụzọ ebumpụta ụwa.
- source_word: ἡγεμόσιν
  choice: ndị gọvanọ
  rationale: N’ọnọdụ ọchịchị a, okwu ahụ na-ezo aka n’ebe ndị ọchịchị e nyefere ọrụ nọ; “ndị gọvanọ” doro anya ma ọ naghị akọwapụta usoro ọchịchị Rom karịa ihe Grik kwuru.
- source_word: ὡς
  choice: dị ka ndị
  rationale: Nke a na-egosi otú e si lee ndị gọvanọ anya dịka ndị e zitere, ma na-eme ka njikọ participle ahụ bụrụ Igbo dị mfe nghọta.
- source_word: δι’ αὐτοῦ
  choice: o zitere
  rationale: A tụgharịrị agency nke διά na ngwaa ahụ n’ụzọ Igbo dị mma. “O” na-ezo n’ụzọ kacha nso n’eze/eze ukwu nke amaokwu 13, ma e tinyere ndetu iji chekwaa ohere nghọta ọzọ.
- source_word: πεμπομένοις
  choice: ndị o zitere
  rationale: “Zitere” na-edobe echiche nke iziga ndị ọchịchị dịka ndị e nyere ọrụ, n’etinyeghị echiche siri ike karịa nke dị na Grik.
- source_word: εἰς ἐκδίκησιν
  choice: ka ha taa ... ahụhụ
  rationale: N’ọnọdụ ọrụ ọchịchị na ikpe, nke a na-egosi ntaramahụhụ ma ọ bụ ime ka ikpe ziri ezi ruo ndị ajọ omume; ahịrịokwu a bụ Igbo nkịtị ma na-ezere ụda nke ịbọ ọbọ onwe onye.
- source_word: κακοποιῶν
  choice: ndị na-eme ihe ọjọọ
  rationale: Ọ na-echekwa echiche ngwaa nke ndị a na-akọwa site n’ime ihe ọjọọ, ma bụrụkwa okwu ndị mmadụ na-aghọta ngwa ngwa.
- source_word: ἔπαινον
  choice: too
  rationale: A na-egosipụta “otuto” dịka ọrụ ndị ọchịchị ga-arụ. Ụdị ngwaa a kwekọrọ n’usoro “taa ... ahụhụ, too ...” ma na-ada nke ọma n’Igbo.
- source_word: ἀγαθοποιῶν
  choice: ndị na-eme ezi ihe
  rationale: Ọ na-echekwa echiche nke ime ihe ọma n’ụzọ doro anya na nke oge a.
theological_decisions:
- issue: Onye αὐτοῦ dị na δι’ αὐτοῦ na-ezo aka na ya
  choice: E ji nnọchiaha “o” mee ka ọ kacha yie ka ọ na-ezo aka n’eze/eze ukwu a kpọrọ aha n’amaokwu bu ụzọ.
  alternative: Ụfọdụ nwere ike ịghọta ya dịka Chineke, onye ikike ọchịchị si n’usoro ya dị.
  rationale: Onye e kwuru okwu ya nso bụ eze/eze ukwu nke amaokwu 13, nke dabara n’echiche nke ndị ọchịchị o nyere ikike; ma ebe a pụrụ ịghọta njikọ ahụ n’ụzọ ọzọ, ndetu na-edobe esemokwu ahụ kama idozi ya kpamkpam.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị ugwu ma dị mfe nghọta. E ji “ndị gọvanọ” mee ka ọrụ ọchịchị doo anya; e jiri usoro ngwaa yiri ibe ya—“taa ... ahụhụ, too ...”—mee ka ebumnuche abụọ dị na Grik pụta nke ọma.
