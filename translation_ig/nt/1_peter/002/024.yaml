id: 1PE.2.24
reference: 1 Peter 2:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: ig
  text: Ya onwe ya buru mmehie anyị n’ahụ ya n’elu osisi[a], ka anyị, ebe anyị esila n’ime mmehie pụọ, bie ndụ n’ezi omume. Ọ bụ site n’ọnya ya[b] ka a gwọrọ unu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụrụ ịsụgharị ya, “n’elu obe.” Okwu Grik ahụ bụ “n’elu osisi,” ma eleghị anya ọ na-ekwughachi Diuterọnọmi 21:23.
    reason: alternative_reading
  - marker: b
    text: A pụrụ ịsụgharị ya, “akara otiti ya” ma ọ bụ “mmerụ ahụ ya.” Aha Grik ahụ dị n’otu ma na-ekwughachi Aịzaya 53:5.
    reason: lexical_alternative
  - marker: c
    text: E kwuru ọgwụgwọ a n’ụzọ sara mbara. N’ọnọdụ okwu gbara amaokwu a gburugburu, ọ metụtara mmehie na ezi omume; ma okwu ahụ n’onwe ya anaghị ejedebe ya naanị n’ọgwụgwọ anụ ahụ ma ọ bụ naanị n’ọgwụgwọ ime mmụọ.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνήνεγκεν
  choice: buru
  rationale: “Buru” na-egosipụta iburu mmehie anyị n’onwe ya, na-echekwakwa njikọ okwu a na Aịzaya 53 n’emeghị ka ọ bụrụ naanị okwu nka gbasara ịchụ àjà.
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: n’ahụ ya
  rationale: Nke a na-asụgharị ahịrịokwu Grik ahụ n’ụzọ kwụ ọtọ ma na-egosipụta na ahụhụ ahụ mere n’ahụ ya n’ezie.
- source_word: ἐπὶ τὸ ξύλον
  choice: n’elu osisi
  rationale: “Osisi” na-echekwa ihe ξύλον pụtara kpọmkwem na njikọ ya nwere ike inwe na Diuterọnọmi 21:23; “obe” ga-abụ nkọwa karịa okwu Grik ahụ n’onwe ya.
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: ebe anyị nwụrụ n’ebe mmehie dị
  rationale: Nke a na-egosipụta nkewapụ siri ike na mmehie nke ἀπογίνομαι na-ekwu, ma na-edowe “mmehie” n’ụbara dịka ọ dị na Grik.
- source_word: τῇ δικαιοσύνῃ
  choice: dịrị ezi omume ndụ
  rationale: “Ezi omume” bụ okwu Igbo doro anya maka δικαιοσύνη n’ebe a, ebe okwu ahụ na-ekwu maka ndụ a na-edu n’ụzọ ziri ezi.
- source_word: μώλωπι
  choice: ọnya
  rationale: “Ọnya” bụ okwu Igbo dị mfe ma bụrụ nke oge a maka mmerụ nke otiti kpatara; a hapụrụ ya n’otu dịka ọ dị na Grik na Aịzaya 53:5.
- source_word: ἰάθητε
  choice: e ji gwọọ unu
  rationale: Ụdị a na-echekwa olu nnara nke ngwaa ahụ na obosara okwu “ịgwọ,” n’emeghị ka ọ bụrụ naanị ọgwụgwọ anụ ahụ ma ọ bụ naanị nke ime mmụọ.
- source_word: αὐτὸς
  choice: Ya onwe ya
  rationale: Nke a na-eme ka nkwusi ike dị n’aha nnọchi Grik ahụ pụta ìhè n’Igbo.
theological_decisions:
- issue: Ókè ọgwụgwọ dị n’ahịrịokwu ikpeazụ
  choice: E ji gwọọ unu
  alternative: A gwọrọ unu n’ọrịa anụ ahụ naanị; ma ọ bụ a gwọrọ unu na mmehie naanị
  rationale: Ihe gbara amaokwu ahụ gburugburu na-elekwasị anya na mmehie, ezi omume, na ahụhụ Kraịst, ma okwu Grik ahụ n’onwe ya ekewaghị ọgwụgwọ ahụ ka ọ bụrụ naanị nke anụ ahụ ma ọ bụ naanị nke ime mmụọ. Ya mere, a hapụrụ obosara ya dịka ọ dị.
- issue: Nsụgharị ξύλον
  choice: osisi
  alternative: obe
  rationale: Ọ bụ ezie na ihe a na-ekwu bụ ịkpọgide Jizọs n’obe, Grik ji ξύλον, ọ bụghị σταυρός. “Osisi” na-echekwa okwu mbụ ahụ na njikọ Akwụkwọ Nsọ o nwere ike inwe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwusi ike nke “Ya onwe ya,” okwu “osisi,” ihe atụ nke ịnwụ n’ebe mmehie dị, na obosara nke “ịgwọ,” n’enweghị itinye nkọwa otu ụka pụrụ iche.
