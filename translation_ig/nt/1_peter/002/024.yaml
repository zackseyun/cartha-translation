revisions:
- from: Ya onwe ya buru mmehie anyị n’ahụ ya n’elu osisi[a], ka anyị, ebe anyị nwụrụ n’ebe mmehie dị, wee dịrị ezi omume ndụ. Site n’ọnya ya[b] ka e ji gwọọ unu.[c]
  to: Ya onwe ya buru mmehie anyị n’ahụ ya n’elu osisi[a], ka anyị, ebe anyị esila n’ime mmehie pụọ, bie ndụ n’ezi omume. Ọ bụ site n’ọnya ya[b] ka a gwọrọ unu.[c]
  rationale: 'The revision preserves the source''s ambiguity and scriptural allusions while correcting the completed passive sense of ἰάθητε. It recasts the central purpose clause into idiomatic Standard Igbo: leaving sins behind and living in righteousness. This reflects ἀπογενόμενοι as a decisive separation without forcing a literal death metaphor where the Greek verb itself denotes departure or cessation. All footnote anchors are retained and their explanations are aligned with the main text.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:15:01Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders Christ's emphatic agency, bearing of sins, embodied suffering, and the deliberately literal ξύλον as “osisi.” The final clause, however, uses a present/general healing construction (“e ji gwọọ unu”) where the Greek aorist passive ἰάθητε refers to healing already effected. The purpose clause also needs a more idiomatic Igbo expression for the decisive departure from sins and life directed by righteousness.
  naturalness: “Wee dịrị ezi omume ndụ” is not natural Standard Igbo. “Ka anyị, ebe anyị esila n’ime mmehie pụọ, bie ndụ n’ezi omume” is clear, modern, and preserves the participle-plus-purpose relationship. “Ọ bụ site n’ọnya ya ka a gwọrọ unu” naturally expresses the completed passive clause.
  terminology: “Ya onwe ya,” “mmehie,” “ahụ,” “osisi,” “ezi omume,” and “ọnya” are suitable Standard Igbo terms. The footnotes retain the lexical alternatives and do not resolve the healing language into a denominationally narrowed sense.
  issues:
  - severity: high
    issue: The final clause is rendered with an incomplete/non-past healing expression.
    rationale: ἰάθητε is an aorist passive, “you were healed.” “E ji gwọọ unu” can sound generic or prospective (“is used to heal you”) and does not clearly express the completed passive event.
  - severity: medium
    issue: The expression “wee dịrị ezi omume ndụ” is unnatural.
    rationale: It does not idiomatically communicate ζήσωμεν τῇ δικαιοσύνῃ, “that we might live for/in righteousness.”
  - severity: low
    issue: Footnote wording can be made more idiomatic and precise.
    rationale: “A pụrụ ịsụgharị ya” is more natural than “A pụkwara ịsụ ya,” and the contextual-healing note should say that the wording does not restrict the healing to either physical or spiritual healing alone.
  revised_text: Ya onwe ya buru mmehie anyị n’ahụ ya n’elu osisi[a], ka anyị, ebe anyị esila n’ime mmehie pụọ, bie ndụ n’ezi omume. Ọ bụ site n’ọnya ya[b] ka a gwọrọ unu.[c]
