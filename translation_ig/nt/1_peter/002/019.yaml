  text: τοῦτο γὰρ χάρις εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας πάσχων ἀδίκως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/019.yaml
  text: 'For this is grace: if someone endures sorrows while suffering unjustly because of consciousness of God[a][b][c].'
translation:
  language: ig
  text: 'N’ihi na nke a bụ amara[a]: ọ bụrụ na mmadụ, n’ihi na ọ na-eburu Chineke n’uche[b], anagide mwute mgbe ọ na-ata ahụhụ n’ụzọ na-ezighị ezi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Amara” n’ebe a nwekwara ike ịpụta “ihe kwesịrị otuto,” “ihe a na-anabata,” ma ọ bụ “ihe kwesịrị ihu ọma.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihi akọ na uche n’ebe Chineke nọ,” ma ọ bụ “n’ihi mmata Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” na-edobe njikọ okwu ahụ na echiche χάρις n’Agba Ọhụrụ, ebe ọnọdụ okwu a na-egosikwa na ọ bụ ihe a na-anabata ma ọ bụ ihe kwesịrị ihu ọma.
- source_word: διὰ συνείδησιν θεοῦ
  choice: n’ihi na ọ na-eburu Chineke n’uche
  rationale: Nke a bụ ụzọ Igbo dị ndụ si kwuo na mmadụ maara ma na-eche banyere Chineke mgbe ọ na-eme ihe. Ọ na-edobe Chineke dịka ihe na-akpali ntachi obi ahụ, na-enweghị ikwubi kpamkpam ma συνείδησις ọ pụtara naanị akọ na uche ma ọ bụ ịma ihe n’obi.
- source_word: ὑποφέρει
  choice: anagide
  rationale: “Anagide” na-egosi iji ndidi guzosie ike n’okpuru ihe isi ike, nke dabara n’ọnọdụ ndụmọdụ nke amaokwu a.
- source_word: λύπας
  choice: ihe mgbu
  rationale: “Ihe mgbu” na-agụnye mwute, nhụjuanya, na ihe na-eweta nsogbu, ma ọ naghị amachi okwu ahụ naanị n’ihe mgbu anụ ahụ.
- source_word: πάσχων ἀδίκως
  choice: mgbe ọ na-ata ahụhụ n’ụzọ na-ezighị ezi
  rationale: 'Nke a na-egosi ọnọdụ nke ntachi obi ahụ: onye ahụ na-ata ahụhụ n’agbanyeghị na e mesoro ya ihe na-ezighị ezi.'
- source_word: τις
  choice: mmadụ
  rationale: “Mmadụ” bụ ụzọ ebumpụta ụwa n’Igbo isi kọwaa onye ọ bụla n’enweghị itinye okike nwoke ma ọ bụ nwanyị na-adịghị n’isi okwu Grik.
- source_word: τοῦτο γὰρ
  choice: N’ihi na nke a
  rationale: Nke a na-edobe ọrụ γάρ dịka nkọwa ma na-eme ka τοῦτο rụtụ aka n’ọnọdụ a kọwara n’ahịrịokwu na-esochi.
theological_decisions:
- issue: Ihe χάρις pụtara n’ebe a
  choice: A sụgharịrị ya “amara.”
  alternative: Ihe kwesịrị otuto; ihe na-eweta ihu ọma; ihe a na-anabata.
  rationale: “Amara” na-edobe ụda nkà mmụta okpukpe na njikọ okwu Grik ahụ n’akwụkwọ ndị ọzọ, ma ihe odide a ekwughị hoo haa n’amaokwu a na ọ bụ “ihu ọma n’ebe Chineke nọ.” Ihe odide ala peeji na-egosi nghọta ndị ọzọ okwu ahụ nwere ike ibu.
- issue: Ihe συνείδησις θεοῦ pụtara
  choice: A sụgharịrị ya “ọ na-eburu Chineke n’uche.”
  alternative: N’ihi akọ na uche ya n’ebe Chineke nọ; n’ihi na ọ maara Chineke n’obi.
  rationale: Nkebiokwu Grik a nwere ike ịpụta ịma Chineke n’obi ma ọ bụ akọ na uche e duziri n’ebe Chineke nọ. Nsụgharị bụ isi na-enye Igbo doro anya ma hapụkwa esemokwu ahụ ka nkọwa ala peeji gosipụta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro okwu na-eme ka o doo anya na iburu Chineke n’uche bụ ihe kpatara mmadụ ji anagide ahụhụ ahụ, ọ bụghị ihe kpatara e ji mesoo ya ihe na-ezighị ezi.
