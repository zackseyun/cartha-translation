revisions:
- from: 'N’ihi na nke a bụ amara[a]: ọ bụrụ na mmadụ, n’ihi na ọ na-eburu Chineke n’uche[b], anagide ihe mgbu mgbe ọ na-ata ahụhụ n’ụzọ na-ezighị ezi.'
  to: 'N’ihi na nke a bụ amara[a]: ọ bụrụ na mmadụ, n’ihi na ọ na-eburu Chineke n’uche[b], anagide mwute mgbe ọ na-ata ahụhụ n’ụzọ na-ezighị ezi.'
  rationale: The revision changes only “ihe mgbu” to “mwute” to reflect the broader sense of λύπας, and replaces a misleading footnote alternative with closer alternatives that retain the phrase’s acknowledged ambiguity. The placement of the causal phrase is retained so that it clearly governs endurance.
