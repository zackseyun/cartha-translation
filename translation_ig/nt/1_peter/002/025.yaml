review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the comparison with sheep, the contrast introduced by ἀλλά, the Christological titles, and “your souls.” However, the return is not idiomatically or explicitly directed to the two titles in the Igbo sentence; the Greek ἐπί with the accusative requires that relationship to be made clear.
  naturalness: “Atụrụ na-akpafu akpafu” is understandable but awkward and unnecessarily repetitive in this context. “Atụrụ na-awagharị” is natural Standard Igbo and retains the ongoing pastoral image. Adding “n’ebe ... nọ” makes the destination of “alaghachila” clear and idiomatic.
  terminology: “Onye Ọzụzụ Atụrụ” is appropriate for ποιμήν. “Onye Nlekọta” is a natural, non-denominational rendering of ἐπίσκοπος and avoids importing the later church-office sense of “Bishọp.” “Mkpụrụ obi” appropriately retains ψυχῶν.
  issues:
  - severity: medium
    issue: The phrase “unu alaghachikwutela Onye Ọzụzụ Atụrụ na Onye Na-elekọta” does not clearly express returning to the Shepherd and Overseer.
    rationale: ἐπεστράφητε ἐπὶ takes the Shepherd and Overseer as the destination. In Standard Igbo, “alaghachi n’ebe ... nọ” expresses this relationship clearly and naturally.
  - severity: low
    issue: “na-akpafu akpafu” is stylistically awkward.
    rationale: The reduplication is not needed to represent πλανώμενοι. “na-awagharị” naturally conveys sheep wandering/go­ing astray while preserving the source ambiguity concerning agency.
  - severity: low
    issue: The passive alternative in footnote b is overly causative.
    rationale: “E mere ka unu laghachi” can suggest a stronger external causation than the passive form itself. “E duuru unu laghachi” is a clearer passive-like alternative in the pastoral context, while the main text properly avoids resolving the voice nuance.
  revised_text: N’ihi na unu dịbu ka atụrụ na-awagharị[a], ma ugbu a unu alaghachila[b] n’ebe Onye Ọzụzụ Atụrụ na Onye Nlekọta[c] mkpụrụ obi unu nọ.
