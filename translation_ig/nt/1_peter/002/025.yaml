revisions:
- from: N’ihi na unu dịbu ka atụrụ na-akpafu akpafu[a], ma ugbu a unu alaghachikwutela[b] Onye Ọzụzụ Atụrụ na Onye Na-elekọta[c] mkpụrụ obi unu.
  to: N’ihi na unu dịbu ka atụrụ na-awagharị[a], ma ugbu a unu alaghachila[b] n’ebe Onye Ọzụzụ Atụrụ na Onye Nlekọta[c] mkpụrụ obi unu nọ.
  rationale: The revision makes explicit the directional force of ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον through the idiomatic phrase “n’ebe ... nọ.” It replaces an awkward repeated verb with natural Standard Igbo, maintains the sheep metaphor and the source text’s voice ambiguity, and retains non-denominational renderings of the two Christological titles.
  reviewer_model: gpt-5.6-terra
