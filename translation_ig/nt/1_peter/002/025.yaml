  text: ἦτε γὰρ ὡς πρόβατα ⸀πλανώμενοι, ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/025.yaml
  text: For you were like sheep going astray[c][b][a], but now you have returned to the Shepherd and Overseer of your souls.
translation:
  language: ig
  text: N’ihi na unu dịbu ka atụrụ na-awagharị[a], ma ugbu a unu alaghachila[b] n’ebe Onye Ọzụzụ Atụrụ na Onye Nlekọta[c] mkpụrụ obi unu nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-akpafu ụzọ” ma ọ bụ “ndị a na-eduhie.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “unu echegharịtala”; ọdịdị okwu Grik ahụ nwekwara ike ịpụta, “e duuru unu laghachi.”
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “Onye Nche”; n’ọdịnala, “Bishọp.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γὰρ
  choice: N’ihi na unu dịbu
  rationale: “N’ihi na” na-egosi njikọ γάρ na ihe e kwuru n’amaokwu bu ụzọ, ebe “dịbu” na-egosi ọnọdụ ha nọ na ya n’oge gara aga dị ka imperfect ἦτε si eme.
- source_word: ὡς πρόβατα
  choice: dị ka atụrụ
  rationale: “Dị ka” na-echekwa ntụnyere nke ὡς; “atụrụ” bụ okwu Igbo nkịtị ma doo anya maka πρόβατα.
- source_word: πλανώμενοι
  choice: na-akpafu akpafu
  rationale: Nke a na-echekwa onyinyo atụrụ na-awagharị ụzọ ma hapụ ya ka ọ bụrụ ihe nwere ike ịpụta ịkpafu n’onwe ha ma ọ bụ ịbụ ndị e duhiere.
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: ma ugbu a unu alaghachikwutela
  rationale: “Ma ugbu a” na-egosi ọdịiche siri ike nke ἀλλά, ebe “alaghachikwutela” na-egosi mgbanwe mezuru emezụ nke ka metụtara ọnọdụ ha ugbu a, n’enweghị ịkọwapụta onye mere ka ha laghachi.
- source_word: ἐπὶ τὸν ποιμένα
  choice: Onye Ọzụzụ Atụrụ
  rationale: Nke a bụ nsụgharị doro anya nke ποιμήν ma na-arụ ọrụ dị ka aha nsọpụrụ Kraịst n’ebe a.
- source_word: καὶ ἐπίσκοπον
  choice: na Onye Na-elekọta
  rationale: Okwu a na-egosi onye na-elekọta ma na-ahụ maka ndị ọzọ; ọ na-ezere itinye n’amaokwu a usoro ọkwa ụka nke mechara pụta n’akụkọ ihe mere eme.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: mkpụrụ obi unu
  rationale: “Mkpụrụ obi” na-echekwa ụzọ ọdịnala na nke okwu ahụ n’onwe ya si akọwa ψυχή n’ọnọdụ a nke nlekọta ime mmụọ, n’agbanyeghị na ψυχή nwekwara ike ịpụta ndụ ma ọ bụ mmadụ n’onwe ya.
theological_decisions:
- issue: Iji ἐπίσκοπος mee aha nsọpụrụ Kraịst
  choice: Onye Na-elekọta
  alternative: Onye Nche; Bishọp
  rationale: Amaokwu ahụ na-akpọ Kraịst ma Onye Ọzụzụ Atụrụ ma Onye Na-elekọta. Nhọrọ a na-echekwa ọrụ ilekọta nke okwu Grik ahụ ma na-ezere itinye echiche pụrụ iche banyere ọkwa ọchịchị ụka n’ime ederede.
- issue: Ụdị olu nke ἐπεστράφητε
  choice: unu alaghachikwutela
  alternative: unu alaghachila; e mere ka unu laghachi
  rationale: Ọ bụ ezie na ọdịdị ngwaa ahụ nwere ike ibu nghọta passive nke na-egosi na e mere ka ha laghachi, ọ nwekwara ike ịrụ ọrụ n’echiche intransitive/middle. Isi ederede na-ahapụ esemokwu dị n’etiti omume Chineke na nzaghachi mmadụ n’emeghị mkpebi karịrị ihe Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere onyinyo atụrụ na aha nsọpụrụ abụọ ahụ, ma zere okwu ga-etinye ozizi otu ụka kpọmkwem n’amaokwu ahụ.
