id: 1PE.2.8
reference: 1 Peter 2:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: ig
  text: na kwa, “nkume na-eme ka mmadụ sụọ ngọngọ, na okwute na-eme ka mmadụ daa.” Ha na-asụ ngọngọ n’ihi na ha anaghị erubere okwu ahụ isi; ọ bụkwa maka nke a ka e debere ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: nkume na-eme ka mmadụ sụọ ngọngọ
  rationale: A natural Igbo rendering that preserves the image of a stone causing someone to stumble.
- source_word: πέτρα σκανδάλου
  choice: okwute na-eme ka mmadụ daa
  rationale: Distinguishes πέτρα from λίθος while conveying the trap-like or downfall-causing force of σκάνδαλον in accessible Igbo.
- source_word: τῷ λόγῳ ἀπειθοῦντες
  choice: n’ihi na ha anaghị erubere okwu ahụ isi
  rationale: The participle ἀπειθοῦντες denotes refusing obedience or being disobedient; this rendering retains its causal connection with stumbling.
- source_word: ἐτέθησαν
  choice: e debere ha
  rationale: Preserves the passive sense of being set, placed, or appointed without specifying the unstated agent.
theological_decisions:
- issue: Referent of εἰς ὃ (‘to/for which’)
  choice: ọ bụkwa maka nke a ka e debere ha
  alternative: ọ bụkwa maka ịsụ ngọngọ ka e debere ha
  rationale: The Greek antecedent is genuinely open to whether ‘this’ points chiefly to stumbling, disobedience, or the preceding outcome as a whole. The demonstrative ‘nke a’ preserves that ambiguity rather than resolving it doctrinally.
- issue: Force of divine appointment in ἐτέθησαν
  choice: e debere ha
  alternative: a kara aka ka ha mee nke a
  rationale: The passive is retained without expanding it into explicit predestination language or naming God as agent, neither of which is overtly stated in this clause.
translation_notes:
  register: Standard Igbo; current, dignified, and accessible. The paired imagery is retained with ‘nkume’ and ‘okwute,’ while the final clause deliberately preserves the source text’s theological tension and referential ambiguity.
