- from: Onye ahụ, mgbe a kparịrị ya[a], o jighị mkparị kwụghachi; mgbe ọ tara ahụhụ, o yighị egwu, kama ọ nọgidere na-enyefe onwe ya[b] n’aka Onye ahụ na-ekpe ikpe n’ụzọ ziri ezi.
  to: Onye ahụ, mgbe a na-akparị ya[a], ọ naghị eji mkparị akwụghachi; mgbe ọ na-ata ahụhụ, ọ naghị atụ egwu, kama ọ nọgidere na-enyefe onwe ya[b] n’aka Onye ahụ na-ekpe ikpe n’ụzọ ziri ezi.
  rationale: The revision retains the draft’s meaning and its careful footnote on the unstated object of παρεδίδου. It changes the two participial clauses and corresponding negative verbs to progressive/habitual Igbo forms, which more closely represent the Greek aspect without overexplaining it. “Ọ naghị atụ egwu” is a direct, natural rendering of not making threats.
