source:
  edition: SBLGNT
  text: ὃς λοιδορούμενος οὐκ ἀντελοιδόρει, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: ig
  text: Onye ahụ, mgbe a na-akparị ya[a], ọ naghị eji mkparị akwụghachi; mgbe ọ na-ata ahụhụ, ọ naghị atụ egwu, kama ọ nọgidere na-enyefe onwe ya[b] n’aka Onye ahụ na-ekpe ikpe n’ụzọ ziri ezi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mgbe a na-akọcha ya.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ihe ọ na-enyefe ekwughị kpọmkwem; a pụkwara ịghọta ya dị ka inyefe okwu ya ma ọ bụ ikpe ya n’aka Onye ahụ na-ekpe ikpe n’ụzọ ziri ezi.
    reason: source_ambiguity
lexical_decisions:
- source_word: λοιδορούμενος
  choice: mgbe a kparịrị ya
  rationale: Nkebi a na-egosi na a na-akparị ya ma na-agwa ya okwu ọjọọ. “A kparịrị ya” bụ okwu Igbo dị ugbu a, doo anya, nke na-eburu echiche nke mkparị ọnụ.
- source_word: οὐκ ἀντελοιδόρει
  choice: o jighị mkparị kwụghachi
  rationale: Nke a na-egosi na ọ naghị eji mkparị azaghachi mkparị e mere ya. Nhazi a na-eburu ike nkwughachi dị na ἀντι- ma na-ada nke ọma n’Igbo.
- source_word: πάσχων
  choice: mgbe ọ tara ahụhụ
  rationale: A sụgharịrị participle ahụ dị ka ọnọdụ oge, n’usoro yiri “mgbe a kparịrị ya,” ka njikọ ahịrịokwu abụọ ahụ doo anya.
- source_word: οὐκ ἠπείλει
  choice: o yighị egwu
  rationale: “Iyi egwu” bụ ụzọ Igbo nkịtị si egosipụta ikwu ma ọ bụ ime iyi egwu; oge gara aga na-egosipụta omume ya n’oge ahụ.
- source_word: παρεδίδου
  choice: ọ nọgidere na-enyefe onwe ya
  rationale: “Ọ nọgidere” na-egosipụta ọdịdị omume na-aga n’ihu nke imperfect, ebe “na-enyefe onwe ya” na-enye nghọta dabara n’ọnọdụ ahụ n’agbanyeghị na ihe a na-enyefe ekwughị kpọmkwem n’asụsụ Grik.
- source_word: τῷ κρίνοντι δικαίως
  choice: n’aka Onye ahụ na-ekpe ikpe n’ụzọ ziri ezi
  rationale: Nke a na-edobe nkọwa ahụ dị ka okwu na-akọwa onye ahụ, kama ime ya aha pụrụ iche, ma na-egosipụta δικαίως dị ka ụzọ ziri ezi e si ekpe ikpe.
- source_word: δὲ
  choice: kama
  rationale: “Kama” na-egosipụta ọdịiche dị n’etiti ịghara imegwara na nzaghachi ọma ya nke inyefe onwe ya.
- source_word: ὃς
  choice: Onye ahụ
  rationale: N’Igbo, “Onye ahụ” na-ejikọta ahịrịokwu a n’ụzọ eke na Kraịst a kpọtụrụ aha n’amaokwu bu ụzọ, ebe iji nnọchiaha njikọ naanị ya agaghị abụ ahịrịokwu zuru oke n’ebe a.
theological_decisions:
- issue: Onye “na-ekpe ikpe n’ụzọ ziri ezi” bụ onye?
  choice: E gosipụtara ya naanị dị ka “Onye ahụ na-ekpe ikpe n’ụzọ ziri ezi,” dịka Grik si mee.
  alternative: Ịkpọ ya kpọmkwem “Chineke Nna.”
  rationale: Ọnọdụ ahụ na-egosi Chineke dịka onye Kraịst tụkwasịrị obi, ma ederede Grik enyeghị aha “Nna” n’amaokwu a. Ya mere, nsụgharị ahụ anaghị etinye nkọwa karịrị ihe e dere.
- issue: Ihe παρεδίδου na-ekwu na e nyefere
  choice: “Onwe ya” dị n’ahịrị bụ nghọta dabara n’ọnọdụ ahụ, ma e tinyere nkọwa ala peeji iji gosi na ihe e nyefere ekwughị kpọmkwem na Grik.
  alternative: “Okwu ya” ma ọ bụ ikpe ya ka ọ na-enyefe n’aka Onyeikpe.
  rationale: Ngwaa Grik enweghị ihe a kpọrọ aha nke e nyefere. Ịsụgharị “onwe ya” na-eme ka Igbo zuo oke ma dabaa na nhụjuanya Kraịst, ebe nkọwa ala peeji na-echekwa ohere nghọta ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “mkparị,” “iyi egwu,” na “ikpe ikpe n’ụzọ ziri ezi” n’ihi na ha bụ okwu ndị mmadụ na-aghọta ngwa ngwa ma na-edobe ọdịdị na esemokwu nke ederede Grik.
