revisions:
- from: Unu onwe unu kwa, dị ka nkume ndị dị ndụ,[a] ka a na-ewuli ka unu bụrụ ụlọ ime mmụọ, wee ghọọ òtù ndị nchụàjà dị nsọ,[b][d] ka unu chụọ àjà ime mmụọ ndị Chineke na-anabata site n'aka Jizọs bụ Mesaya.[c]
  to: Unu onwe unu kwa, dị ka nkume ndị dị ndụ,[a] a na-ewuli unu ka unu bụrụ ụlọ ime mmụọ, ka unu ghọọ òtù ndị nchụàjà dị nsọ,[b][d] ka unu chụọ àjà ime mmụọ ndị Chineke na-anabata site n'aka Jizọs bụ Mesaya.[c]
  rationale: The revision corrects the incomplete passive construction by making “unu” the explicit object of “a na-ewuli,” thereby preserving the Greek present passive plural. It leaves the divine agent unstated, maintains the goal/result flexibility of εἰς, and preserves Messiah as a title. The footnotes are adjusted only to match the corrected Igbo and to avoid introducing unwarranted emphasis.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:13:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the emphatic plural addressee, the living-stone comparison, the passive ongoing building image, the spiritual-house and holy-priesthood metaphors, spiritual sacrifices, divine acceptance, and mediation through Jesus the Messiah. However, “ka a na-ewuli ka unu bụrụ” omits the object after the passive verb and is not a sound or clear rendering of οἰκοδομεῖσθε. Supplying “unu” restores the source’s direct plural reference without naming an agent.
  naturalness: The proposed revision is natural, dignified Standard Igbo. “A na-ewuli unu ka unu bụrụ…” clearly expresses an ongoing passive process. “Ka unu ghọọ” gives the εἰς phrase its goal/result sense without forcing a single syntactic analysis.
  terminology: “Ụlọ ime mmụọ,” “òtù ndị nchụàjà dị nsọ,” “ịchụ àjà ime mmụọ,” and “Mesaya” are appropriate and consistent. “Site n'aka Jizọs bụ Mesaya” naturally expresses mediation through a person and retains Messiah as a title.
  issues:
  - severity: medium
    issue: The main clause lacks the passive verb’s expressed object.
    rationale: In “ka a na-ewuli ka unu bụrụ ụlọ ime mmụọ,” the readers are not grammatically identified as those being built. Greek οἰκοδομεῖσθε directly addresses them in the passive plural. “A na-ewuli unu…” is required for clear, natural Igbo.
  - severity: low
    issue: Footnote a’s proposed alternative adds emphasis not present in its stated English alternative.
    rationale: “Dị nnọọ ka” means more nearly “just like,” whereas the alternative only represents “like.” A neutral “ka nkume ndị dị ndụ” better reflects the lexical alternative.
  - severity: low
    issue: Footnote d should reflect the revised grammatical wording.
    rationale: Its current wording repeats the former incomplete passive construction. Updating it preserves a meaningful alternative arrangement while keeping the same ambiguity.
  revised_text: Unu onwe unu kwa, dị ka nkume ndị dị ndụ,[a] a na-ewuli unu ka unu bụrụ ụlọ ime mmụọ, ka unu ghọọ òtù ndị nchụàjà dị nsọ,[b][d] ka unu chụọ àjà ime mmụọ ndị Chineke na-anabata site n'aka Jizọs bụ Mesaya.[c]
