id: 1PE.2.5
reference: 1 Peter 2:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε οἶκος πνευματικὸς ⸀εἰς ἱεράτευμα ἅγιον, ἀνενέγκαι πνευματικὰς θυσίας ⸀εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: ig
  text: Unu onwe unu kwa, dị ka nkume ndị dị ndụ,[a] a na-ewuli unu ka unu bụrụ ụlọ ime mmụọ, ka unu ghọọ òtù ndị nchụàjà dị nsọ,[b][d] ka unu chụọ àjà ime mmụọ ndị Chineke na-anabata site n'aka Jizọs bụ Mesaya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka nkume ndị dị ndụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “maka òtù ndị nchụàjà dị nsọ.” Okwu Grik ahụ nwere ike igosi nzube ma ọ bụ ihe si na ya pụta.
    reason: alternative_reading
  - marker: c
    text: N'asụsụ Grik, “Jizọs Kraịst.” N'ebe a, a sụgharịrị Χριστός dịka “Mesaya” n'ihi na ọ bụ utu aha.
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “a na-ewuli unu dịka ụlọ ime mmụọ ka unu ghọọ òtù ndị nchụàjà dị nsọ.”
    reason: previous_rendering
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: Unu onwe unu kwa
  rationale: Na-egosipụta ma nkwusi ike dị na αὐτοὶ ma echiche mgbakwunye dị na καί, na-agwa ndị na-agụ akwụkwọ okwu n'ụdị ọtụtụ.
- source_word: ὡς λίθοι ζῶντες
  choice: dị ka nkume ndị dị ndụ
  rationale: Na-edobe ntụnyere ahụ na ihe oyiyi nke nkume ndị dị ndụ, nke jikọtara amaokwu a na nkume dị ndụ e kwuru banyere Kraịst n'okwu bu ụzọ.
- source_word: οἰκοδομεῖσθε
  choice: ka a na-ewuli
  rationale: Na-edobe olu nnara na omume na-aga n'ihu, n'ekwughị onye na-ewu ya ebe Grik ekwughị ya kpọmkwem.
- source_word: οἶκος πνευματικὸς
  choice: ka unu bụrụ ụlọ ime mmụọ
  rationale: Na-enye Igbo doro anya maka ụlọ nke Mmụọ metụtara, ma na-edobe ihe atụ nke ndị kwere ekwe dịka ụlọ.
- source_word: εἰς ἱεράτευμα ἅγιον
  choice: wee ghọọ òtù ndị nchụàjà dị nsọ
  rationale: “Wee ghọọ” na-egosipụta nzube ma ọ bụ ihe si n'iwuli ahụ pụta; “òtù ndị nchụàjà” na-egosi ahụ ndị nchụàjà ọnụ, ọ bụghị naanị ndị nchụàjà n'otu n'otu.
- source_word: ἀνενέγκαι πνευματικὰς θυσίας
  choice: ka unu chụọ àjà ime mmụọ
  rationale: “Ịchụ àjà” bụ okwu Igbo nkịtị maka inye àjà, ebe “ime mmụọ” na-edobe πνευματικός n'akọwaghị ụdị àjà ndị ahụ karịa ihe ederede kwuru.
- source_word: εὐπροσδέκτους θεῷ
  choice: ndị Chineke na-anabata
  rationale: Na-edobe asụsụ nke Chineke ịnabata àjà n'ụzọ dị mfe nghọta.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: site n'aka Jizọs bụ Mesaya
  rationale: “Site n'aka” na-egosi ụzọ ma ọ bụ onye ogbugbo; “Mesaya” na-asụgharị Χριστός dịka utu aha, ebe “bụ” na-eme ka aha-utu ahụ bụrụ Igbo ebumpụta ụwa.
theological_decisions:
- issue: Olu na onye na-eme ihe na οἰκοδομεῖσθε
  choice: 'Olu nnara: “ka a na-ewuli,” n''ekwughị onye na-ewu ya'
  alternative: “na-ewulite onwe unu”
  rationale: Ụdị Grik na ihe gbara ya gburugburu kwadoro olu nnara. Nsụgharị ahụ anaghị atụkwasị onye na-eme ihe n'amaokwu ahụ ma ọ bụ mee ka ndị kwere ekwe bụrụ ndị na-ewulite onwe ha.
- issue: Ihe εἰς pụtara n'ihu ἱεράτευμα ἅγιον
  choice: “wee ghọọ òtù ndị nchụàjà dị nsọ”
  alternative: “maka òtù ndị nchụàjà dị nsọ”
  rationale: εἰς nwere ike igosi nzube ma ọ bụ nsonaazụ. Isi ederede na-eji okwu na-anabata ha abụọ n'ụzọ ebumpụta ụwa; ndetu ala na-edobe nhọrọ ọzọ.
- issue: Nsụgharị Χριστοῦ
  choice: “Mesaya” dịka utu aha
  alternative: “Kraịst”
  rationale: N'okwu a Χριστός na-arụ ọrụ dịka utu aha e tinyere n'aha Jizọs; “Mesaya” na-edobe ihe utu aha ahụ pụtara.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “unu” doo anya na a na-agwa ọtụtụ mmadụ okwu; e debere ihe atụ ụlọ, olu nnara, na asụsụ àjà. A haziri ahịrịokwu ahụ ka ọ na-asọ n'Igbo n'enweghị idozi mgbagwoju anya dị n'etiti ụlọ ime mmụọ na òtù ndị nchụàjà.
