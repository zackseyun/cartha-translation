revisions:
- from: N’ihi na olee otuto dị n’ime ya ma ọ bụrụ na unu anọgide na-atachi obi mgbe unu na-eme mmehie, a na-etigbukwa unu ihe? Ma ọ bụrụ na unu anọgide na-atachi obi mgbe unu na-eme ihe ọma ma na-ata ahụhụ, nke a bụ amara n’ihu Chineke.[a]
  to: N’ihi na olee otuto dị na ya ma ọ bụrụ na, mgbe unu na-eme mmehie ma a na-akụ unu ọkpọ, unu atachie obi? Ma ọ bụrụ na, mgbe unu na-eme ihe ọma ma na-ata ahụhụ, unu atachie obi, nke a bụ amara n’ihu Chineke.[a]
  rationale: The revision corrects the rendering of κολαφιζόμενοι to an idiomatic Standard Igbo expression that retains the concrete sense of being struck with the fist. It also removes an added continuative element while preserving the source’s repeated call to endure. The footnote continues to preserve the contextual alternatives for χάρις παρὰ θεῷ.
