source:
  edition: SBLGNT
  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: ig
  text: N’ihi na olee otuto dị na ya ma ọ bụrụ na, mgbe unu na-eme mmehie ma a na-akụ unu ọkpọ, unu atachie obi? Ma ọ bụrụ na, mgbe unu na-eme ihe ọma ma na-ata ahụhụ, unu atachie obi, nke a bụ amara n’ihu Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke a na-enweta ihu ọma n’ebe Chineke nọ,” ma ọ bụ, “nke a bụ ihe kwesịrị otuto n’ihu Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κλέος
  choice: otuto
  rationale: N’ajụjụ a, okwu ahụ pụtara otuto ma ọ bụ nnabata mmadụ pụrụ inweta, ọ bụghị naanị ịbụ onye a ma ama. “Otuto” bụ okwu Igbo doro anya nke na-edobe ọdịiche dị n’etiti ntaramahụhụ kwesịrị ekwesị na ahụhụ a na-ata n’ihi ime ezi ihe.
- source_word: ἁμαρτάνοντες
  choice: mgbe unu na-eme mmehie
  rationale: Nke a na-edobe ike omume na nke okpukpe dị n’okwu Grik ahụ, tinyekwara ọdịdị omume na-aga n’ihu nke participle.
- source_word: κολαφιζόμενοι
  choice: a na-etigbukwa unu ihe
  rationale: Okwu Grik ahụ na-ezo aka n’ịkụ mmadụ aka ma ọ bụ iti ya ihe. Nsụgharị a na-eme ka mmegbu anụ ahụ pụta ìhè n’Igbo nke oge a.
- source_word: ὑπομενεῖτε
  choice: unu anọgide na-atachi obi
  rationale: Nkebiokwu a na-egosi ịnọgide n’ụkwụ n’okpuru ihe isi ike, ma na-edobe nkwughachi otu ngwaa ahụ n’ahịrịokwu abụọ ahụ.
- source_word: ἀγαθοποιοῦντες
  choice: mgbe unu na-eme ihe ọma
  rationale: Nke a bụ nsụgharị kpọmkwem, dịkwa mfe nghọta, maka ime ihe ziri ezi ma ọ bụ ihe bara ndị ọzọ uru.
- source_word: πάσχοντες
  choice: na-ata ahụhụ
  rationale: A họọrọ okwu sara mbara nke na-adịghị amachi ahụhụ ahụ n’otu ụdị mmegbu naanị.
- source_word: χάρις
  choice: amara
  rationale: “Amara” na-edobe okwu nkà mmụta okpukpe a maara nke ọma, ebe ihe odide ala na-egosi nghọta okwu a n’ọnọdụ a dịka ihu ọma ma ọ bụ ihe kwesịrị otuto n’ebe Chineke nọ.
- source_word: παρὰ θεῷ
  choice: n’ihu Chineke
  rationale: παρά ya na dative ebe a na-egosi ọnọdụ n’anya Chineke ma ọ bụ n’ule ya. “N’ihu Chineke” na-edobe echiche mmekọrịta ahụ n’enweghị ịkọwa ya gabiga ókè.
theological_decisions:
- issue: Ihe χάρις pụtara n’ahịrịokwu mmechi
  choice: “nke a bụ amara n’ihu Chineke” n’isi ederede
  alternative: “nke a na-ewetara mmadụ ihu ọma n’ebe Chineke nọ” ma ọ bụ “nke a kwesịrị otuto n’ihu Chineke”
  rationale: Okwu ahụ nwere ike ibu ụda nkà mmụta okpukpe nke “amara,” ma n’ọnọdụ a ọ pụkwara igosi ihu ọma ma ọ bụ nnabata Chineke. Isi ederede na-edobe ambiguiti ahụ; ihe odide ala na-enye nkọwa kwe omume.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “unu” mee ka onye nke abụọ plural nke Grik pụta ìhè. E debere usoro participle site na “mgbe unu na-eme…” na “mgbe… a na-eti…” n’ụzọ na-ada ka Igbo nkịtị.
