id: 1PE.2.9
reference: 1 Peter 2:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: ig
  text: Ma unu bụ ndị a họọrọ[a], òtù ndị nchụàjà eze, mba dị nsọ, ndị Chineke nwe pụrụ iche, ka unu wee kwusaa omume ọma ya ndị dị ebube[b]—onye kpọrọ unu ka unu pụọ n’ọchịchịrị banye n’ìhè ya dị ịtụnanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “agbụrụ a họọrọ.” Okwu Grik ahụ nwere ike ịpụta agbụrụ, usoro ụmụ, ma ọ bụ otu ndị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “otuto kwesịrị ya” ma ọ bụ “ọrụ ukwu ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: Ma unu
  rationale: “Ma” na-egosi ọdịiche dị n’etiti ndị a na ndị a kọwara tupu ha; “unu” na-edowe nkwusi ike nke nnọchiaha Grik ahụ.
- source_word: γένος ἐκλεκτόν
  choice: ndị a họọrọ
  rationale: Nke a na-egosi otu ndị Chineke họọrọ, ma na-ezere ka “agbụrụ” mee ka onye na-agụ ya chee naanị banyere agbụrụ mmadụ n’echiche nke oge a.
- source_word: βασίλειον ἱεράτευμα
  choice: òtù ndị nchụàjà eze
  rationale: Nke a na-edowe ma echiche nke ịbụ ndị nchụàjà ma njikọ ha na eze; ọ naghị agbanwe okwu Grik ahụ ka ọ bụrụ nkọwa sara mbara karịa ya.
- source_word: ἔθνος ἅγιον
  choice: mba dị nsọ
  rationale: Ọ bụ ntụgharị kwụ ọtọ nke na-edowe echiche nke ndị e doro iche nye Chineke.
- source_word: λαὸς εἰς περιποίησιν
  choice: ndị nke Chineke n’onwe ya
  rationale: Ọ na-egosi na ha bụ ndị Chineke nwepụtara onwe ya n’ụzọ pụrụ iche. E mere onye nwe ha ka o doo anya dịka ọnọdụ okwu ahụ si gosi.
- source_word: ὅπως
  choice: ka unu wee
  rationale: Ọ na-egosi nzube, dịka njikọokwu Grik ahụ si eme.
- source_word: τὰς ἀρετὰς
  choice: ịdị mma ya dị ebube
  rationale: Nhọrọ a na-anwa idebe obosara nke okwu Grik ahụ, nke nwere ike ịrụtụ aka n’àgwà Chineke kwesịrị otuto ma ọ bụ n’ihe ukwu ọ na-eme, n’enweghị ịmachi ya naanị n’otu n’ime ha.
- source_word: ἐξαγγείλητε
  choice: kwusaa
  rationale: “Kwụsaa” na-egosi ime ka ihe mara n’ihu ọha, dịka ngwaa Grik ahụ si pụta.
- source_word: τοῦ ... καλέσαντος
  choice: onye ahụ kpọpụtara unu ... kpọbata unu
  rationale: Nke a na-akọwa Chineke site n’omume ọ mere, ma na-edowe ihe atụ nke isi n’otu ọnọdụ pụta banye n’ọzọ.
- source_word: ἐκ σκότους
  choice: n’ọchịchịrị
  rationale: Mgbe e jikọtara ya na “kpọpụtara,” ọ na-egosi isi n’ọchịchịrị pụta.
- source_word: εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: n’ìhè ya dị ịtụnanya
  rationale: Ọ na-edowe ma echiche nke ịbanye n’ìhè Chineke ma ịdị ebube na ịtụnanya nke ìhè ahụ.
theological_decisions:
- issue: Aha njirimara ọgbụgba ndụ e si n’Agba Ochie nweta
  choice: 'E debere aha ndị ahụ n’ụdị otu ndị: “ndị a họọrọ,” “òtù ndị nchụàjà eze,” na “mba dị nsọ.”'
  alternative: Ịtụgharị ha dịka naanị ihe atụ ma ọ bụ okwu nkọwa na-adịghị egosi otu ndị kpọmkwem.
  rationale: Pita ji aha ọgbụgba ndụ ndị a kpọọ ndị ọ na-edegara akwụkwọ ozi. Nsụgharị ahụ na-edowe ike nke okwu ahụ, ma ọ naghị etinye usoro nkụzi gbasara njikọ ha na Izrel karịa ihe amaokwu ahụ kwuru.
- issue: Onye nwe “ndị ... maka inwe” na λαὸς εἰς περιποίησιν
  choice: 'E mere Chineke ka ọ bụrụ onye nwe ha: “ndị nke Chineke n’onwe ya.”'
  alternative: “ndị maka inwe,” nke na-ahapụ onye nwe ha n’ekwughị.
  rationale: Ọnọdụ okwu ahụ na-egosi Chineke nke ọma, ebe Igbo chọrọ ka njikọ ahụ doo anya iji zere okwu na-edoghị anya. Nke a bụ ime ka ihe dị n’ọnọdụ okwu ahụ pụta ìhè, ọ bụghị itinye ozizi ọhụrụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ndị a họọrọ” na-ezere nghọtahie agbụrụ nke oge a ma na-edowe njirimara otu; “òtù ndị nchụàjà eze” na-edowe mkpirikpi na ịdị elu nke ahịrịokwu ahụ. E tinyere akara nkọwa ụkwụ [a] na [b] n’ebe okwu ha na-akọwa dị n’ahịrịokwu ahụ.
