- from: Ma unu bụ ndị a họọrọ[a], òtù ndị nchụàjà eze, mba dị nsọ, ndị nke Chineke n’onwe ya, ka unu wee kwusaa ịdị mma ya dị ebube[b]—onye ahụ kpọpụtara unu n’ọchịchịrị kpọbata unu n’ìhè ya dị ịtụnanya.
  to: Ma unu bụ ndị a họọrọ[a], òtù ndị nchụàjà eze, mba dị nsọ, ndị Chineke nwe pụrụ iche, ka unu wee kwusaa omume ọma ya ndị dị ebube[b]—onye kpọrọ unu ka unu pụọ n’ọchịchịrị banye n’ìhè ya dị ịtụnanya.
  rationale: The revision restores the governing idea of divine calling rather than converting it into two transfer actions, while retaining the darkness-to-light movement. It replaces a tautological singular phrase with a natural plural expression for God’s praiseworthy excellencies. The divine-possession phrase is adjusted for natural Standard Igbo without adding theological interpretation. Footnote anchors remain attached to the terms they explain.
