revisions:
- from: Dị ka ndị nweere onwe ha, unu ejikwala nnwere onwe unu mere ihe mkpuchi maka ihe ọjọọ, kama dịrị ndụ dị ka ndị ohu Chineke.[a]
  to: Dị ka ndị nweere onwe ha, ma ọ bụghị dịka ndị na-eji nnwere onwe ha ekpuchi ihe ọjọọ, kama dịka ndị ohu Chineke.[a]
  rationale: The revision retains the source's threefold “as ... not as ... but as ...” structure, restores the participial characterization rather than a direct imperative, and uses idiomatic Igbo to preserve the concrete metaphor of freedom being used to conceal evil. It retains “ndị ohu Chineke” for δοῦλοι without imposing a doctrinal gloss.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:14:32Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the central contrast between freedom and being God's δοῦλοι. However, “unu ejikwala ...” turns the Greek participial contrast into a direct prohibition, and “dịrị ndụ” adds an explicit exhortation not stated in this verse.
  naturalness: “Ejikwala nnwere onwe unu mere ihe mkpuchi” is not idiomatic Standard Igbo. A relative construction with “ndị na-eji ... ekpuchi” is clear, natural, and retains the metaphor.
  terminology: “Ndị nweere onwe ha,” “ihe mkpuchi,” “ihe ọjọọ,” and “ndị ohu Chineke” are suitable. “Ndị ohu Chineke” properly preserves the force of δοῦλοι and its deliberate contrast with freedom. The footnote should present the alternative more directly without overstating that the Greek term itself necessarily means both in every context.
  issues:
  - severity: medium
    issue: 'The main clause uses an imperative: “unu ejikwala.”'
    rationale: The Greek reads “as free [people], and not as having freedom as a cover for evil, but as slaves of God.” It characterizes the manner/identity of conduct rather than independently issuing the prohibition “do not use.”
  - severity: medium
    issue: “Ejikwala nnwere onwe unu mere ihe mkpuchi” is grammatically and idiomatically awkward.
    rationale: It does not naturally express using freedom as a cover. “Ndị na-eji nnwere onwe ha ekpuchi ihe ọjọọ” gives the intended metaphor in idiomatic Standard Igbo.
  - severity: low
    issue: “Dịrị ndụ” adds an explicit command to live in a certain way.
    rationale: Although compatible with the context, it is not expressed in the Greek wording of this verse and is unnecessary for a natural translation.
  revised_text: Dị ka ndị nweere onwe ha, ma ọ bụghị dịka ndị na-eji nnwere onwe ha ekpuchi ihe ọjọọ, kama dịka ndị ohu Chineke.[a]
  revised_footnotes:
