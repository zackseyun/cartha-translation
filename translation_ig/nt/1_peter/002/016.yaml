id: 1PE.2.16
reference: 1 Peter 2:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς ἐλεύθεροι, καὶ μὴ ὡς ἐπικάλυμμα ἔχοντες τῆς κακίας τὴν ἐλευθερίαν, ἀλλ’ ὡς ⸂θεοῦ δοῦλοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/016.yaml
  text: as free people[a], and not using freedom as a cover for evil, but as servants of God.
translation:
  language: ig
  text: Dị ka ndị nweere onwe ha, ma ọ bụghị dịka ndị na-eji nnwere onwe ha ekpuchi ihe ọjọọ, kama dịka ndị ohu Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka ndị na-ejere Chineke ozi.” Okwu Grik a pụrụ ịsụgharị “ndị ohu” ma ọ bụ “ndị na-ejere ozi”; “ndị ohu” na-echekwa nke ọma ọdịiche siri ike dị na “ndị nweere onwe ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: ndị nweere onwe ha
  rationale: Nkebiokwu a na-egosi ndị nwere onwe ha n'ụzọ doro anya ma na-agụnye ndị niile Pita na-agwa okwu, na-enweghị ime ka ọ bụrụ naanị ụmụ nwoke.
- source_word: ἐπικάλυμμα
  choice: ihe mkpuchi
  rationale: Nke a na-echekwa oyiyi nke ihe e ji ekpuchi ma ọ bụ zoo ajọ omume, ma bụrụkwa Igbo nkịtị a na-aghọta.
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: ejikwala nnwere onwe unu mere
  rationale: Nke a na-egosipụta n'Igbo dị ire na nnwere onwe bụ ihe a na-eji eme ihe mkpuchi, kama ịsụgharị usoro Grik ahụ n'ụzọ siri ike.
- source_word: κακίας
  choice: ihe ọjọọ
  rationale: κακία ebe a sara mbara karịa iwe ọjọọ naanị; “ihe ọjọọ” gụnyere omume ọjọọ n'ozuzu ya.
- source_word: θεοῦ δοῦλοι
  choice: ndị ohu Chineke
  rationale: “Ndị ohu” na-echekwa ike δοῦλοι na nnukwu ọdịiche dị n'etiti ịbụ ndị nweere onwe ha na ịbụ ndị Chineke nwe kpamkpam.
theological_decisions:
- issue: Otu e si sụgharị δοῦλοι dịka njirimara ndị kwere ekwe
  choice: ndị ohu Chineke
  alternative: ndị na-ejere Chineke ozi
  rationale: Amaokwu ahụ kpachapụrụ anya na-etinye nnwere onwe na ịbụ nke Chineke kpamkpam n'akụkụ ibe ha. “Ndị ohu Chineke” na-echekwa esemokwu ahụ, ebe “ndị na-ejere Chineke ozi” ga-eme ka ike okwu ahụ belata.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E tinyere “dịrị ndụ” iji mee ka njikọ nke ὡς na ndụ omume doo anya n'Igbo, n'emebighị echiche isi mmalite. Akara nkọwa ala [a] pụtara n'ahịrị isi ma kwekọọ na nkọwa ala.
