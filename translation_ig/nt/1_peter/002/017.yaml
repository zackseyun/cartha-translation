id: 1PE.2.17
reference: 1 Peter 2:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντας τιμήσατε, τὴν ἀδελφότητα ⸀ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: ig
  text: Sọpụrụ mmadụ niile; hụ ụmụnna n’okwukwe n’anya[a]; tụọ egwu Chineke; sọpụrụ eze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụmụnna n’okwukwe” bụ obodo ma ọ bụ ezinụlọ ndị kwere ekwe niile.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta ya dịka “eze ukwu”; okwu Grik bụ “eze,” ma n’ọnọdụ ọchịchị Rom nke Pita, o yikarịrị ka ọ na-ezo aka n’eze ukwu Rom.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντας
  choice: mmadụ niile
  rationale: Okwu a na-arụ ọrụ dị ka aha ma na-agụnye mmadụ nile; “mmadụ niile” bụ Igbo doro anya ma dịkwa n’ụzọ e si ekwu okwu taa.
- source_word: τιμήσατε / τιμᾶτε
  choice: sọpụrụ
  rationale: “Sọpụrụ” na-egosipụta nsọpụrụ karịrị nanị ịkwanyere mmadụ ùgwù n’obi, ma na-edobekwa otu okwu ahụ n’ebe abụọ ahụ dịka Grik si megharịa τιμάω.
- source_word: ἀδελφότητα
  choice: ụmụnna n’okwukwe
  rationale: Okwu Grik a na-ezo aka n’ezinụlọ ma ọ bụ obodo ndị kwere ekwe. “Ụmụnna n’okwukwe” na-eburu echiche ezinụlọ ahụ ma bụrụkwa okwu ndị Igbo nke oge a ga-aghọta ngwa ngwa.
- source_word: ἀγαπᾶτε
  choice: hụ … n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke zuru oke si akọwa ἀγαπάω; iwu dị n’ahịrịokwu ahụ na-ahapụ ịdịgide n’omume ahụ ka a ghọta ya n’enweghị itinye okwu ọzọ.
- source_word: θεὸν
  choice: Chineke
  rationale: Nke a bụ ntụgharị Igbo kwụ ọtọ maka θεός n’ebe a.
- source_word: φοβεῖσθε
  choice: tụọ egwu
  rationale: Ọ na-edobe ike nke φοβέομαι, kama ime ka ọ dị nro naanị ka “sọpụrụ.” Nke a na-echekwa ọdịiche dị n’etiti ihe e kwesịrị ime n’ebe Chineke nọ na nsọpụrụ e nyere eze.
- source_word: βασιλέα
  choice: eze
  rationale: “Eze” bụ ihe βασιλεύς pụtara kpọmkwem. N’ọnọdụ ọchịchị Rom nke Pita, ọ pụrụ ịbụ eze ukwu Rom; a kọwara nke ahụ n’okpuru peeji kama dochie okwu isi mmalite.
theological_decisions:
- issue: Ọdịiche dị n’etiti ihe a na-enye Chineke na ihe a na-enye onye ọchịchị
  choice: “Tụọ egwu” maka Chineke, ma “sọpụrụ” maka eze
  alternative: Iji “sọpụrụ nke ukwuu” ma ọ bụ “tụrụ egwu” mee ka okwu abụọ ahụ yie otu
  rationale: Grik ji φοβέομαι naanị n’ebe Chineke nọ, ma jiri τιμάω n’ebe mmadụ niile na eze nọ. Ntugharị a na-echekwa usoro na ịdị arọ dị iche iche ahụ n’etinyeghị ozizi ndọrọ ndọrọ ọchịchị ọzọ.
translation_notes:
  register: E ji Igbo Izugbe dị mfe, nke oge a, ma dị ùgwù. E debere ahịrịokwu ahụ dịka usoro iwu anọ dị nkenke, tinyere nkwụsị ọkara iji mee ka nhazi Grik pụta ìhè. “Ụmụnna n’okwukwe” na-ada nke ọma karịa ntụgharị nkịtị siri ike dịka “òtù ụmụnna,” ma nkọwa ala peeji na-echekwa echiche obodo ndị kwere ekwe.
