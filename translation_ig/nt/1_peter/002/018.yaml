revisions:
- from: Ndị ohu na-eje ozi n’ụlọ mmadụ,[a] werenu nsọpụrụ zuru ezu do onwe unu n’okpuru ndị nwe unu—ọ bụghị naanị ndị dị mma na ndị dị nwayọọ, kama ndị gbagọrọ agbagọ kwa.[b]
  to: Ndị ohu ụlọ,[a] dọnụ onwe unu n’okpuru ndị nwe unu na nsọpụrụ niile,[b] ọ bụghị naanị ndị dị mma na ndị dị nwayọọ, kama ọbụna ndị gbagọrọ agbagọ.[c]
  rationale: The revision uses idiomatic Standard Igbo for the imperative force of the participle while retaining the domestic-slave terminology and the social hierarchy explicit in the Greek. It renders ἐν παντὶ φόβῳ contextually as “na nsọpụrụ niile,” with a note preserving the literal “in all fear” and its interpretive breadth. The revised footnotes also provide complete anchors for each materially contextual lexical rendering and preserve the ambiguity of σκολιοῖς.
  reviewer_model: gpt-5.6-terra
