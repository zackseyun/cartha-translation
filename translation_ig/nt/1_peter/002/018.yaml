source:
  edition: SBLGNT
  text: Οἱ οἰκέται ὑποτασσόμενοι ἐν παντὶ φόβῳ τοῖς δεσπόταις, οὐ μόνον τοῖς ἀγαθοῖς καὶ ἐπιεικέσιν ἀλλὰ καὶ τοῖς σκολιοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/018.yaml
  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: ig
  text: Ndị ohu ụlọ,[a] dọnụ onwe unu n’okpuru ndị nwe unu na nsọpụrụ niile,[b] ọ bụghị naanị ndị dị mma na ndị dị nwayọọ, kama ọbụna ndị gbagọrọ agbagọ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị ohu n’ụlọ mmadụ” ma ọ bụ “ndị na-eje ozi n’ụlọ mmadụ.” Okwu Grik a na-ezo kpọmkwem aka ná ndị ohu ma ọ bụ ndị dabere n’ụlọ, ndị na-eje ozi n’ezinụlọ.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’egwu niile.” N’ebe a, okwu ahụ nwere ike igosi nkwanye ùgwù na nrubeisi.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “ndị na-emeso mmadụ ihe n’ezighị ezi” ma ọ bụ “ndị siri ike.” Okwu Grik ahụ pụtara n’ụzọ nkịtị “ndị gbagọrọ agbagọ” ma ọ bụ “ndị agbagọworo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: Ndị ohu na-eje ozi n’ụlọ mmadụ
  rationale: Okwu a na-ezo kpọmkwem aka ná ndị ohu ma ọ bụ ndị nọ n’okpuru onye nwe ụlọ, bụ́ ndị na-eje ozi n’ezinụlọ; nsụgharị a na-egosi ma ọnọdụ ohu ahụ ma ebe ọrụ ahụ.
- source_word: ὑποτασσόμενοι
  choice: do onwe unu n’okpuru
  rationale: Participle a na-arụ ọrụ dị ka iwu n’ọnọdụ a; okwu a na-egosi irubere ikike ha isi n’enweghị ime ka ọ pụta na ọnọdụ ahụ bụ naanị nke afọ ofufo.
- source_word: ἐν παντὶ φόβῳ
  choice: werenu nsọpụrụ zuru ezu
  rationale: N’agbanyeghị na φόβος pụtara n’ụzọ nkịtị ‘egwu,’ n’ebe a ọ na-egosi nkwanye ùgwù na nrubeisi. ‘Nsọpụrụ zuru ezu’ na-enye echiche ahụ n’Igbo doro anya.
- source_word: δεσπόταις
  choice: ndị nwe unu
  rationale: δεσπότης bụ onye nwere ikike n’ebe ohu ụlọ nọ; ‘ndị nwe unu’ dabara na mmekọrịta ọha mmadụ e kwuru ebe a.
- source_word: ἀγαθοῖς
  choice: ndị dị mma
  rationale: Ọ na-edobe nkọwa omume sara mbara nke ἀγαθός n’enweghị ime ka ihe ọ pụtara dị warara.
- source_word: ἐπιεικέσιν
  choice: ndị dị nwayọọ
  rationale: Ọ na-egosi ịdị nwayọọ, ime ihe n’ezi uche, na ịghara isi ike, nke bụ isi echiche ἐπιεικής n’ebe a.
- source_word: σκολιοῖς
  choice: ndị gbagọrọ agbagọ
  rationale: Ọ na-echekwa ihe atụ nkịtị nke σκολιός, ‘gbagọrọ agbagọ,’ ma na-ekwe ka ọ gụnye omume ezighị ezi, obi ọjọọ, ma ọ bụ mmegbu n’ebughị ụzọ họrọ naanị otu n’ime ha.
theological_decisions:
- issue: Otu e si akọwa ọnọdụ οἰκέται n’emeghị ka ọnọdụ ohu ahụ dị nro ma ọ bụ gbasaa okwu ahụ karịa ebe o ruru
  choice: Ndị ohu na-eje ozi n’ụlọ mmadụ
  alternative: Ndị na-eje ozi n’ụlọ mmadụ
  rationale: Nhọrọ a na-egosi na ndị a abụghị naanị ndị ọrụ ụlọ nkịtị kama ndị nọ n’ọnọdụ ohu ma ọ bụ ndị dabere n’ezinụlọ ahụ, ebe ọ ka na-echekwa nkọwa pụrụ iche banyere ọrụ ụlọ.
- issue: Ma a ga-asụgharị φόβος dịka egwu ka ọ bụ dịka nkwanye ùgwù
  choice: werenu nsọpụrụ zuru ezu
  alternative: n’egwu niile
  rationale: N’usoro ndụ ezinụlọ a, ahịrịokwu ahụ na-akọwa nrubeisi juputara na nkwanye ùgwù; ‘egwu niile’ nwere ike ime ka onye na-agụ ya ghọta ya naanị dịka ịtụ ụjọ ndị nwe ha. Ihe nkịtị ahụ ka akọwara na ndetu.
- issue: Otu e si echekwa obosara ihe σκολιός pụtara
  choice: ndị gbagọrọ agbagọ
  alternative: ndị obi ọjọọ ma ọ bụ ndị na-eme ihe n’ezighị ezi
  rationale: Nsụgharị nkịtị a na-echekwa ihe atụ Grik ahụ na mgbagwoju anya ya kama ime ka ọ bụrụ naanị obi ọjọọ ma ọ bụ ikpe na-ezighị ezi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘ndị ohu na-eje ozi n’ụlọ mmadụ’ iji zere ime ka ọnọdụ ọha mmadụ ahụ dị nro; ‘ndị nwe unu’ na-egosi ikike nke δεσπόταις. Ahịrịokwu ahụ gbanwere participle Grik ka ọ bụrụ iwu doro anya n’Igbo.
