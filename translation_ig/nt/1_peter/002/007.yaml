id: 1PE.2.7
reference: 1 Peter 2:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: ig
  text: Ya mere, nsọpụrụ ahụ bụ nke unu ndị kwere ekwe[a]; ma nye ndị na-ekweghị ekwe[b], “Nkume ahụ ndị na-ewu ụlọ jụrụ—ọ bụ ya ghọrọ isi nkuku[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe dị oké ọnụ ahịa bụ nke unu ndị kwere ekwe,” ya bụ, nkume ahụ dị oké ọnụ ahịa nye ndị kwere ekwe.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ndị na-ajụ ikwere”; ngwaa ahụ na-egosi ịjụ ikwere, ma n'ebe ụfọdụ ọ pụrụ inwe echiche nke ekweghị-isi.
    reason: lexical_alternative
  - marker: c
    text: N'ụzọ ọdịnala, “nkume nkuku” ma ọ bụ “nkume nkuku kachasị mkpa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: nsọpụrụ
  rationale: Okwu a nwere ike ịpụta nsọpụrụ, uru, ma ọ bụ ịdị oké ọnụ ahịa. N'ebe a, “nsọpụrụ” na-edobe nkebiokwu Grik nkenke ma na-egosi na nsọpụrụ ahụ bụ nke ndị kwere ekwe; a hapụrụ nghọta ọzọ na nkọwa ala peeji.
- source_word: τοῖς πιστεύουσιν
  choice: unu ndị kwere ekwe
  rationale: Nke a na-edobe okwu a gwara ndị na-agụ akwụkwọ ozugbo, tinyere echiche nke ndị na-ekwere.
- source_word: ἀπιστοῦσιν
  choice: ndị na-ekweghị ekwe
  rationale: N'ihi na e tinyere ya n'ụzọ megidere πιστεύουσιν, nke a bụ ntụgharị kacha doo anya. O nwekwara ike ịpụta ndị jụrụ ikwere ma si otú ahụ nupụ isi; e debere nke ahụ na nkọwa ala peeji.
- source_word: λίθος
  choice: nkume
  rationale: “Nkume” bụ okwu Igbo nkịtị dabara n'ihe atụ banyere iwu ụlọ.
- source_word: ἀπεδοκίμασαν
  choice: jụrụ
  rationale: Ọ na-egosi ịjụ ihe mgbe a tụlere ya. “Jụrụ” bụ okwu dị mfe ma bụrụkwa nke sitere n'okike n'Igbo n'ahịrịokwu a.
- source_word: οἰκοδομοῦντες
  choice: ndị na-ewu ụlọ
  rationale: Nke a na-egosipụta ndị ahụ dị ka ndị na-arụ ọrụ iwu ụlọ ma na-edobe ihe atụ ahụ nke ọma.
- source_word: κεφαλὴν γωνίας
  choice: isi nkuku
  rationale: Nke a na-edobe ihe oyiyi nkịtị nke Grik, “isi nke nkuku,” n'Igbo dị nkenke, n'ebughị ụzọ kpebie kpọmkwem ọrụ nkume ahụ n'ụlọ.
theological_decisions:
- issue: Ihe ἡ τιμή pụtara n'ihe metụtara ndị kwere ekwe na Kraịst bụ́ nkume ahụ
  choice: Nsọpụrụ ahụ bụ nke ndị kwere ekwe.
  alternative: Ihe dị oké ọnụ ahịa bụ nke unu ndị kwere ekwe, ya bụ, nkume ahụ dị oké ọnụ ahịa nye ha.
  rationale: Usoro okwu Grik na-akwado nghọta na nsọpụrụ bụ nke ndị kwere ekwe, nke kwekọkwara n'echiche nke na ihere agaghị eme ha. Ma njikọ ya na nkume “dị oké ọnụ ahịa” n'amaokwu bu ụzọ na-eme ka nghọta nke ọzọ kwe omume, ya mere e debere ya na nkọwa ala peeji.
- issue: Otú e si tụgharịa κεφαλὴ γωνίας
  choice: E debere ihe atụ ahụ dịka “isi nkuku.”
  alternative: nkume nkuku ma ọ bụ nkume nkuku kachasị mkpa
  rationale: Nke a na-edobe okwu ihe atụ nke Grik ma ghara ime ka otu nkọwa naanị banyere ọnọdụ nkume ahụ bụrụ ihe amaokwu ahụ kwuru hoo haa. E nyere ntụgharị ọdịnala na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo dị mfe, nke oge a ma dịkwa ùgwù. Ahịrịokwu ahụ na-edobe ọdịiche dị n'etiti ndị kwere ekwe na ndị na-ekweghị ekwe, ma na-ahapụ nghọta abụọ nke τιμή na ihe atụ ụlọ dị na κεφαλὴ γωνίας n'enweghị ịmanye otu nkọwa ụka.
