  text: Ἀποθέμενοι οὖν πᾶσαν κακίαν καὶ πάντα δόλον καὶ ⸀ὑποκρίσεις καὶ φθόνους καὶ πάσας καταλαλιάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/001.yaml
  text: Therefore[a], having put away all malice and all deceit and hypocrisies and envies and all slanders[b],
translation:
  language: ig
  text: Ya mere, mgbe unu wepụsịrị[a] obi ọjọọ niile, aghụghọ niile, ihu abụọ niile, anyaụfụ niile, na nkwutọ niile[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe unu dọsịrị n’akụkụ.” Okwu Greek a na-egosi iwepụ ma ọ bụ ịhapụ ihe, dịka a ga-asị na a na-eyipụ uwe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “okwu ọjọọ niile a na-ekwu megide ndị ọzọ.” Okwu Greek a gụnyere okwu dịgasị iche a na-ekwu iji mebie aha ndị ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: ebe unu wepụsịrị
  rationale: Okwu a bụ aorist middle participle nke na-egosi ihe e mere dịka nkwadebe tupu iwu dị n’amaokwu nke abụọ. “Ebe unu wepụsịrị” na-edobe njikọ ahụ na mmetụta nke imecha ihe ahụ, ma bụrụkwa Igbo dị mfe nghọta.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru na 1 Pita 1:22–25.
- source_word: πᾶσαν κακίαν
  choice: ajọ obi niile
  rationale: N’usoro omume ọjọọ a, κακία na-elekwasị anya n’ajọ ọchịchọ ma ọ bụ obi ọjọọ mmadụ nwere n’ebe ndị ọzọ nọ; “ajọ obi” na-egosipụta nke a nke ọma karịa okwu sara mbara dịka “ajọ omume.”
- source_word: πάντα δόλον
  choice: aghụghọ niile
  rationale: “Aghụghọ” bụ okwu Igbo dị ugbu a nke na-egosi iduhie mmadụ ma ọ bụ iji ụzọ aghụghọ mee ihe.
- source_word: ὑποκρίσεις
  choice: ụdị ihu abụọ niile
  rationale: Greek jiri ọtụtụ mee okwu a. “Ụdị ihu abụọ niile” na-egosi omume ihu abụọ n’ụdị ya dị iche iche n’Igbo nkịtị.
- source_word: φθόνους
  choice: anyaụfụ niile
  rationale: “Anyaụfụ” bụ okwu doro anya maka mwute ma ọ bụ iwe n’ihi ezi ihe onye ọzọ nwere. “Niile” na-enyere aka igosipụta ọtụtụ e ji mee okwu Greek ahụ.
- source_word: πάσας καταλαλιάς
  choice: nkwutọ niile
  rationale: καταλαλιά na-ezo aka n’okwu a na-ekwu megide ndị ọzọ iji mebie aha ha. “Nkwutọ” dị nkenke ma bụrụ okwu Igbo a na-aghọta, ebe nkọwa ala peeji na-edobe nghọta ya sara mbara.
theological_decisions:
- issue: Oke omume ọjọọ ndị e depụtara
  choice: A sụgharịrị nke ọ bụla dịka omume doro anya n’enweghị itinye nkọwa ozizi ọzọ.
  alternative: Ịsụgharị κακία dịka “ajọ omume niile,” ma ọ bụ καταλαλιάς dịka “okwu ọjọọ niile a na-ekwu megide ndị ọzọ.”
  rationale: Amaokwu a bụ ndụmọdụ gbasara omume. Nsụgharị a na-edobe ike na ọdịiche nke ndepụta Greek ahụ, ma ghara ime ka okwu ndị ahụ bụrụ ozizi nke otu ụka.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu a na-aga n’ihu ruo n’iwu dị n’amaokwu nke abụọ, ya mere e debere ya dịka nkebi ahịrịokwu nwere akara rikoma na njedebe.
