  text: ⸀Ὑποτάγητε πάσῃ ἀνθρωπίνῃ κτίσει διὰ τὸν κύριον· εἴτε βασιλεῖ ὡς ὑπερέχοντι,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/013.yaml
  text: Submit yourselves to every human institution for the Lord’s sake[a], whether to a king as one in authority[b],
translation:
  language: ig
  text: Doonụ onwe unu n’okpuru usoro ọchịchị mmadụ ọ bụla[a] n’ihi Onyenwe anyị, ma ọ bụ eze dịka onye nwere ikike dị elu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ihe ọ bụla mmadụ kere”; nsụgharị ọdịnala bụ “iwu mmadụ.” N’ebe a, okwu ahụ na-ezo aka n’usoro ma ọ bụ ikike ọchịchị obodo nke mmadụ, dịka okwu ndị na-esochi banyere eze na ndị ọchịchị si egosi.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dịka onye kachasị elu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποτάγητε
  choice: Doonụ onwe unu n’okpuru
  rationale: Nke a na-egosipụta iwu ka ndị na-agụ ya jiri aka ha nabata ịnọ n’okpuru ikike, ma na-ada ka Igbo nke oge a.
- source_word: πάσῃ ἀνθρωπίνῃ κτίσει
  choice: usoro ọchịchị mmadụ ọ bụla
  rationale: πάσῃ bụ ‘ọ bụla’ n’ụzọ nkesa. N’agbanyeghị na κτίσις na-apụtakarị ‘ihe e kere eke,’ ihe ndị na-esochi—eze na ndị ọchịchị—na-egosi na ebe a ọ na-ekwu maka usoro ọchịchị obodo nke mmadụ.
- source_word: διὰ τὸν κύριον
  choice: n’ihi Onyenwe anyị
  rationale: διά ya na accusative na-egosi ihe kpatara ma ọ bụ mkpali; okwu a na-eme ka o doo anya na ọ bụ mmekọrịta ha na Onyenwe anyị kpatara nrubeisi a.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: A hapụrụ aha nsọpụrụ ahụ n’enweghị ịkọwapụta ma ọ bụ Jizọs ma ọ bụ Chineke, dịka Grik ahụ si mee.
- source_word: εἴτε βασιλεῖ
  choice: ma ọ bụ eze
  rationale: εἴτε na-amalite usoro ‘ma ọ bụ ... ma ọ bụ’ nke na-aga n’ihu n’amaokwu na-esote; βασιλεύς bụ ‘eze,’ okwu sara mbara karịa ‘eze ukwu.’
- source_word: ὡς ὑπερέχοντι
  choice: dịka onye nwere ikike dị elu
  rationale: Nke a na-egosi ọkwa na ikike dị elu n’enweghị ime ka ikike eze yie nke enweghị oke.
theological_decisions:
- issue: Ihe ἀνθρωπίνῃ κτίσει pụtara n’ihe banyere ọchịchị obodo
  choice: usoro ọchịchị mmadụ ọ bụla
  alternative: ihe mmadụ ọ bụla e kere eke; iwu mmadụ ọ bụla
  rationale: Eze na ndị ọchịchị a kpọrọ aha n’okwu na-esote na-akọwa na ọ bụ usoro ma ọ bụ ikike ọchịchị obodo ka a na-ekwu maka ya, ọ bụghị mmadụ niile n’otu n’otu. Nsụgharị a anaghị ekwu karịa ihe odide ahụ kwuru banyere otú usoro ndị ahụ si malite.
- issue: Onye κύριον na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Jizọs; Chineke
  rationale: Ihe odide Grik kwuru naanị ‘Onyenwe anyị.’ Ịhapụ ya otu a na-echekwa obosara na ntakịrị edoghị anya nke okwu mbụ ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Doonụ onwe unu n’okpuru” na-echekwa ike nke iwu ahụ; “usoro ọchịchị” na-eme ka ọnọdụ obodo doo anya n’enweghị itinye ozizi ụka pụrụ iche.
