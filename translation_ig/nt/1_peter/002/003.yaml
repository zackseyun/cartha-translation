  text: if indeed you have tasted that the Lord is good[a][b].
translation:
  language: ig
  text: Ọ bụrụ n’ezie na unu edetụla ire hụ na Onyenwe anyị dị mma[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ebe ọ bụ na unu edetụla ire hụ.” Grik ji usoro okwu nwere ọnọdụ, ma o nwere ike ịdị ka ọ na-ewere na ọnọdụ ahụ bụ eziokwu.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị “dị mma” dịka “nwere obiọma” ma ọ bụ “na-eme amara.” Okwu a na-ekwughachi Abụ Ọma 34:8.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: ọ bụrụ n’ezie
  rationale: Nke a na-edobe ọdịdị nkwenye nwere ọnọdụ dị na Grik, ebe ‘n’ezie’ na-egosi na Pita yiri ka ọ na-atụ anya na ọnọdụ ahụ bụ eziokwu.
- source_word: ἐγεύσασθε
  choice: unu edetụla ire hụ
  rationale: Akpaalaokwu Igbo a na-edobe ihe atụ nke ‘idetụ ire’ ma na-egosikwa ịmata ihe site n’ahụmahụ; ọ dabara n’onyonyo nri dị na 2:2–3.
- source_word: ὅτι
  choice: na
  rationale: ‘Na’ na-ewebata ihe ha matara site n’idetụ ire, dịka usoro okwu Grik si dị.
- source_word: χρηστὸς
  choice: dị mma
  rationale: ‘Dị mma’ na-edobe obosara ihe χρηστός pụtara ma na-echekwa njikọ ya na Abụ Ọma 34:8; ‘nwere obiọma’ ma ọ bụ ‘na-eme amara’ ga-eme ka ihe ọ pụtara dị warara karịa.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ Igbo a na-ejikarị maka κύριος. Ọ naghị akọwapụta kpọmkwem na ọ bụ Kraịst, ya mere ọ na-edobe ma njikọ okwu a na Jizọs n’ebe a ma nkwughachi ya sitere n’Abụ Ọma.
theological_decisions:
- issue: Ike nke nkebi okwu nwere ọnọdụ εἰ
  choice: E debere ya dịka ‘ọ bụrụ n’ezie na unu edetụla ire hụ.’
  alternative: ‘ebe unu edetụla ire hụ’ ma ọ bụ ‘ebe ọ bụ na unu edetụla ire hụ.’
  rationale: Ọ bụ ezie na okwu ahụ nwere ike iwere na ahụmahụ ndị na-agụ ya bụ eziokwu, Grik ka ji εἰ mee ya okwu nwere ọnọdụ. Nsụgharị a na-edobe esemokwu ahụ kama ime ya nkwupụta doro anya.
- issue: Onye ‘Onyenwe anyị’ na-ezo aka na ya
  choice: E debere naanị ‘Onyenwe anyị.’
  alternative: ‘Onyenwe anyị, bụ Kraịst.’
  rationale: Ihe gbara amaokwu ahụ gburugburu jikọtara aha a na Jizọs, ma okwu ahụ na-ekwughachikwa Abụ Ọma 34:8. Ịghara itinye nkọwa n’ahịrị bụ isi na-edobe njikọ abụọ ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘unu’ kwado onye nke abụọ n’ọnụọgụ ọtụtụ. Akpaalaokwu ‘detụ ire hụ’ na-eme ka ihe atụ banyere nri daa nke ọma n’Igbo ma ghara ịgbanwe ya ka ọ bụrụ naanị ‘nwee ahụmahụ.’
