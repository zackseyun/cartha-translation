    reason: lexical_alternative
  revision_rationale: The revision replaces an unidiomatic literal metaphor with a natural Igbo expression for ending the foolish people’s ignorant speech. It preserves the source’s rhetorical force and retains the literal “muzzle” image in the footnote.
