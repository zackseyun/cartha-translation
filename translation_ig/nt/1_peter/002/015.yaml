  text: (ὅτι οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ, ἀγαθοποιοῦντας φιμοῦν τὴν τῶν ἀφρόνων ἀνθρώπων ἀγνωσίαν)·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/015.yaml
  text: 'For this is the will of God: that by doing good you should silence the ignorance of foolish people[a].'
translation:
  language: ig
  text: 'N’ihi na nke a bụ uche Chineke: ka unu site n’ime ihe ọma mee ka okwu amaghị ihe nke ndị nzuzu kwụsị[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kuchie ọnụ okwu amaghị ihe nke ndị nzuzu.” Ngwaa Grik ahụ pụtara n’ụzọ nkịtị “ikuchi ọnụ,” dị ka a na-ekuchi ọnụ anụmanụ; n’ebe a, e ji ya mee ihe atụ maka ime ka okwu mmegide kwụsị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-egosi ihe kpatara ndụmọdụ dị n’amaokwu bu ụzọ.
- source_word: οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ
  choice: nke a bụ uche Chineke
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche Grik nke na-arụtụ aka n’ụzọ e kwuru okwu ya.
- source_word: ἀγαθοποιοῦντας
  choice: site n’ime ihe ọma
  rationale: Ọ na-egosi ụzọ ma ọ bụ ihe e ji emezu ihe infinitive φιμοῦν kwuru.
- source_word: φιμοῦν
  choice: mechie ọnụ
  rationale: Ọ na-echekwa ihe atụ nke ngwaa ahụ, nke pụtara n'ụzọ nkịtị ikuchi ọnụ anụmanụ, ma n’ebe a ọ pụtara ime ka okwu mmegide kwụsị.
- source_word: ἀγνωσίαν
  choice: amaghị ihe
  rationale: Ọ na-enye echiche nke enweghị nghọta ma ọ bụ amaghị ihe n'ụzọ doro anya n’Igbo.
- source_word: ἀφρόνων ἀνθρώπων
  choice: ndị nzuzu
  rationale: Ọ na-egosi mmadụ n’ozuzu ha, ọ bụghị naanị ụmụ nwoke, ma na-echekwa nkọwa ἄφρων nke pụtara ndị na-enweghị ezi uche.
theological_decisions:
- issue: Mmekọahụ nwoke/nwanyị n’ịsụgharị ἀνθρώπων
  choice: ndị nzuzu
  alternative: ndị ikom nzuzu
  rationale: N’ebe a, ἀνθρώπων na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke.
- issue: Ike ihe atụ dị na φιμοῦν
  choice: mechie ọnụ
  alternative: mee ka ... gbachie nkịtị
  rationale: “Mechie ọnụ” na-echekwa ihe atụ siri ike nke Grik n’ụzọ Igbo ga-aghọta, ebe nkọwa ala peeji na-akọwa ihe ọ pụtara n’ebe a.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E jiri “unu” mee ihe n’ihi na ndị a na-agwa okwu bụ ọtụtụ mmadụ, dịka ọnọdụ Grik si gosi.
