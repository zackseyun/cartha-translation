id: 1PE.1.17
reference: 1 Peter 1:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: ig
  text: Ma ọ bụrụ na unu na-akpọ Onye ahụ nke na-ekpe ikpe n’enweghị ele mmadụ anya n’ihu dịka ọrụ onye ọ bụla si dị Nna[a], birinụ ndụ unu n’egwu[c] n’oge obibi unu dịka ndị ọbịa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-akpọku Onye ahụ dịka Nna.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’oge unu nọ n’ala ọzọ.” Okwu Grik ahụ nwere ike ịpụta ibi dịka onye mba ọzọ ma ọ bụ onye bi nwa oge.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “na nsọpụrụ” ma ọ bụ “n’egwu nsọpụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: na-akpọ ... Nna
  rationale: Nke a na-egosi na ndị kwere ekwe na-akpọku Chineke ma na-akpọ ya Nna; nhazi ahịrịokwu Igbo mere ka ‘Nna’ bịa n’azụ nkọwa banyere Onye ahụ.
- source_word: πατέρα
  choice: Nna
  rationale: Ọ bụ aha ndị kwere ekwe ji akpọ Chineke, ya mere e ji mkpụrụedemede ukwu dee ya.
- source_word: ἀπροσωπολήμπτως
  choice: n’eleghị onye ọ bụla anya
  rationale: Akpaalaokwu Igbo a na-egosi ikpe na-enweghị ile mmadụ anya n’ihu ma ọ bụ ịkpa oke.
- source_word: κρίνοντα
  choice: Onye ahụ nke na-ekpe ikpe
  rationale: A tụgharịrị participle ahụ dịka nkọwa na-aga n’ihu banyere Chineke, nke kwekọrọ na usoro Igbo.
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: dịka ọrụ onye ọ bụla si dị
  rationale: Nke a na-echekwa ọrụ dịka ụkpụrụ ikpe na ibu ọrụ nke onye ọ bụla, n’etinyeghị ozizi pụrụ iche.
- source_word: ἐν φόβῳ
  choice: jirinụ egwu
  rationale: ‘Egwu’ na-echekwa ịdị arọ na nghọta sara mbara nke φόβος kama ime ka ọ bụrụ naanị nsọpụrụ.
- source_word: παροικίας
  choice: bi dịka ndị ọbịa
  rationale: Okwu a na-egosi ibi n’ebe mmadụ na-abụghị nwa afọ ma ọ bụ ibi nwa oge; ntụgharị a bụ nke ndị Igbo nke oge a ga-aghọta ngwa ngwa.
- source_word: ἀναστράφητε
  choice: na-ebi ndụ
  rationale: N’ọnọdụ a, ngwaa ahụ metụtara ụzọ mmadụ si ebi ndụ na omume ya, ọ bụghị naanị otu omume kpọmkwem.
- source_word: τὸν τῆς παροικίας ὑμῶν χρόνον
  choice: n’oge unu bi dịka ndị ọbịa
  rationale: Nke a na-egosipụta ogologo oge ahụ dum na ọnọdụ ha dịka ndị na-abụghị ụmụ afọ.
theological_decisions:
- issue: Ihe φόβος pụtara n’ihe gbasara Chineke dịka Nna na Onyeikpe
  choice: E debere ‘egwu’ n’ahịrịokwu bụ isi.
  alternative: nsọpụrụ; egwu jupụtara na nsọpụrụ
  rationale: Amaokwu ahụ jikọtara ịbụ Nna nke Chineke na ikpe ya na-enweghị ịkpa oke. ‘Egwu’ na-echekwa ịdị arọ na esemokwu ahụ n’enweghị ime ka okwu ahụ dị nro.
- issue: Ókè ikpe dịka ọrụ mmadụ si dị
  choice: A tụgharịrị ya ozugbo dịka ‘dịka ọrụ onye ọ bụla si dị.’
  alternative: ikpe ikpeazụ nke ọrụ ndị kwere ekwe; ụkpụrụ izugbe nke nnyocha Chineke
  rationale: Grik ahụ kwuru na Chineke na-ekpe ikpe dịka ọrụ onye ọ bụla si dị. Tụgharịasụsụ ahụ anaghị etinye usoro ozizi banyere uru ọrụ, nzọpụta, ma ọ bụ nkwụsi ike nke onye kwere ekwe.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma doo ndị nkịtị anya. E jiri ‘n’eleghị onye ọ bụla anya’ mee ka enweghị ịkpa oke pụta n’ụzọ eke; e debere ‘egwu’ na ‘ndị ọbịa’ iji chekwaa mgbagwoju nghọta na isiokwu nke ibi nwa oge.
