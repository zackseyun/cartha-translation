    text: Ma ọ bụ, “na nsọpụrụ” ma ọ bụ “n’egwu nsọpụrụ.”
    reason: lexical_alternative
  revision_rationale: 'The revision preserves the Greek syntax and its theological tension: those who address the impartial judge as Father are commanded to live in φόβος throughout their προσωρινή/foreigner-like residence. It improves Standard Igbo idiom, clarifies impartiality, and removes an awkward verbal construction without adding doctrinal interpretation.'
