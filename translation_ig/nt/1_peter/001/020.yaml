  text: προεγνωσμένου μὲν πρὸ καταβολῆς κόσμου, φανερωθέντος δὲ ἐπ’ ⸀ἐσχάτου τῶν χρόνων δι’ ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/020.yaml
  text: He was foreknown before the foundation of the world[a], but was revealed at the end of the times for your sake[b],
translation:
  language: ig
  text: E buru ụzọ mara ya tupu e tọọ ntọala ụwa[a], ma e mere ka ọ pụta ìhè n’oge ngwụcha maka unu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “A họpụtara ya tupu oge eruo.” Okwu Grik ahụ kwuru, “E buru ụzọ mara ya”; nke a nwere ike ịgụnye nzube Chineke, ma okwu ahụ n’onwe ya anaghị amanye nghọta ahụ sara mbara.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’oge ikpeazụ ndị a.”
    reason: alternative_reading
lexical_decisions:
- source_word: προεγνωσμένου
  choice: A maara ya tupu
  rationale: Nke a na-edobe isi echiche nke ịma tupu oge eruo, n’etinyeghị echiche siri ike karịa nke ịhọpụta ya tupu oge eruo n’amaokwu bụ isi.
- source_word: πρὸ καταβολῆς κόσμου
  choice: tupu e tọọ ntọala ụwa
  rationale: Ọ bụ ụzọ doro anya ma kwụsie ike n’Igbo isi kwuo ihe mere tupu e kee ụwa, ma na-echekwa ihe oyiyi nke ‘ịtọ ntọala.’
- source_word: φανερωθέντος
  choice: e mere ka ọ pụta ìhè
  rationale: Nke a na-egosipụta olu nnara nke Grik na echiche nke ime ka onye ahụ pụta ìhè ma ọ bụ bụrụ onye a hụrụ nke ọma.
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: na njedebe nke oge niile
  rationale: Nke a na-echekwa ike okwu oge ikpeazụ dị na Grik n’agbakwụnyeghị ‘ndị a,’ nke na-adịghị n’ederede ahụ kpọmkwem.
- source_word: δι’ ὑμᾶς
  choice: n’ihi unu
  rationale: N’ebe a, okwu a na-egosi na mkpughe ahụ bụ maka ọdịmma ndị a na-agwa okwu; ‘n’ihi unu’ bụ okwu Igbo dị mfe ma kwekọọ na ya.
theological_decisions:
- issue: Ihe προεγνωσμένου pụtara banyere Kraịst tupu e kee ụwa
  choice: A maara ya tupu
  alternative: A họpụtara ya tupu oge eruo
  rationale: Nhọrọ bụ isi na-edobe okwu banyere ịma tupu oge eruo ma ghara ịtụgharị ya ozugbo ka ọ bụrụ ịhọpụta ma ọ bụ ikpebi akara aka tupu oge eruo. Nke a na-echekwa nghọta na esemokwu nkà mmụta okpukpe dị n’ederede ahụ.
- issue: Ike oge nke ἐπ’ ἐσχάτου τῶν χρόνων
  choice: na njedebe nke oge niile
  alternative: n’oge ikpeazụ ndị a
  rationale: Grik na-ekwu maka akụkụ ikpeazụ nke oge, ma o kwughị ‘ndị a’ kpọmkwem. Nsụgharị bụ isi na-esochi ụdị okwu ahụ nke ọma.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ nghọta nke ‘ịma tupu’ n’amaokwu bụ isi kama itinye ozizi ịhọpụta n’ime ya; ihe ọzọ ga-ekwe omume dị n’okpuru peeji.
