revisions:
- from: A maara ya tupu e tọọ ntọala ụwa[a], ma e mere ka ọ pụta ìhè na njedebe nke oge niile n’ihi unu[b].
  to: E buru ụzọ mara ya tupu e tọọ ntọala ụwa[a], ma e mere ka ọ pụta ìhè n’oge ngwụcha maka unu[b].
  rationale: The revised text corrects the misleading “oge niile,” clarifies the benefactive force of διά + accusative, and uses more idiomatic Standard Igbo for divine foreknowledge. It retains the source’s ambiguity concerning foreknowledge versus prior choosing, with the latter confined to a footnote.
  reviewer_model: gpt-5.6-terra
