id: 1PE.1.24
reference: 1 Peter 1:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα ⸀αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ⸀ἄνθος ἐξέπεσεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: ig
  text: 'N’ihi na,


    “Ụmụ mmadụ niile[a] dị ka ahịhịa,


    ebube ha niile[b] dịkwa ka okooko ahịhịa;


    ahịhịa ahụ kpọnwụrụ,


    okooko ya wee dapụ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Gris, okwu ya bụ “anụ ahụ niile.” Ọ na-ekwughachi Aịzaya 40:6 ma na-emesi ike na mmadụ niile na-anwụ anwụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “ebube” dịka “ịma mma” ma ọ bụ “ịdị ùgwù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: N’ihi na
  rationale: Okwu a na-egosi na ihe e dere n’Akwụkwọ Nsọ bụ ihe na-akwado okwu e kwuru tupu ya, ma na-edobe ike nke njikọ ihe kpatara ihe.
- source_word: πᾶσα σὰρξ
  choice: Ụmụ mmadụ niile
  rationale: N’ebe a, σάρξ na-anọchi anya mmadụ niile dịka ndị na-anwụ anwụ, ọ bụghị agwa mmehie. Nsụgharị a bụ Igbo doro anya ma dịkwa n’okwu ọnụ; ihe odide nkịtị ‘anụ ahụ niile’ ka akọwara n’ala peeji iji chekwaa njikọ ya na Aịzaya 40:6.
- source_word: ὡς χόρτος
  choice: dị ka ahịhịa
  rationale: χόρτος bụ ahịhịa ma ọ bụ ihe ọkụkụ dị mkpụmkpụ ndụ; ‘dị ka ahịhịa’ na-edobe ntụnyere ahụ n’Igbo nkịtị.
- source_word: πᾶσα δόξα αὐτῆς
  choice: ebube ha niile
  rationale: δόξα pụtara ebube, ịma mma, ma ọ bụ ịdị ùgwù n’ebe a. ‘Ha’ na-ezo aka n’ụmụ mmadụ niile n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: ὡς ἄνθος χόρτου
  choice: dị ka okooko ahịhịa
  rationale: Nsụgharị a na-edobe ihe oyiyi Gris nke okooko nke ahịhịa, kama ịgbanwe ya ka ọ bụrụ okooko ọhịa ma ọ bụ ubi.
- source_word: ἐξηράνθη
  choice: kpọnwụrụ
  rationale: Okwu a na-egosi ahịhịa nke mmiri gwụrụ ma kpọnwụọ; ‘kpọnwụrụ’ bụ okwu Igbo dabara adaba maka ya.
- source_word: ἐξέπεσεν
  choice: wee dapụ
  rationale: Ngwaa a na-egosi okooko si n’osisi ya daa. ‘Wee dapụ’ na-eme ka usoro ihe abụọ ahụ doo anya ma na-agụkwa nke ọma n’Igbo.
theological_decisions:
- issue: Nsụgharị σάρξ n’okwu gbasara ọnwụ na adịghịte aka nke mmadụ
  choice: Ụmụ mmadụ niile
  alternative: Anụ ahụ niile
  rationale: N’ebe a, σάρξ anaghị ekwu maka ọchịchọ mmehie, kama ọ na-ekwu maka mmadụ niile dịka ndị na-adịghị adịgide adịgide. Isi nsụgharị ahụ na-eji okwu ndị Igbo ga-aghọta ozugbo, ebe nkọwa ala peeji na-echekwa okwu nkịtị na njikọ ya na Aịzaya 40:6.
- issue: Ihe δόξα pụtara n’ihe atụ a
  choice: ebube
  alternative: ịma mma ma ọ bụ ịdị ùgwù
  rationale: ‘Ebube’ na-echekwa obosara okwu Gris ahụ—ịma mma, ịdị ùgwù, na ihe mmadụ ji anya isi—n’ebughị otu nkọwa kpọmkwem n’elu ndị ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, mee nsụgharị ahụ. E debere ya n’usoro abụ iji gosipụta na ọ bụ okwu e hotara n’Akwụkwọ Nsọ. Akara [a] na [b] dị n’isiokwu n’ebe nkọwa ala peeji ha metụtara.
