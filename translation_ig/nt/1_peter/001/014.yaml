  text: ὡς τέκνα ὑπακοῆς, μὴ συσχηματιζόμενοι ταῖς πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν ἐπιθυμίαις,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/014.yaml
  text: as children of obedience[a], not conforming yourselves to the desires you formerly had in your ignorance,
translation:
  language: ig
  text: dị ka ụmụ nke nrubeisi[a], unu ekwekwala ka ọchịchọ ndị unu nwere na mbụ, mgbe unu nọ n’amaghị ihe, kpụzie unu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka ụmụ na-erube isi.” N’asụsụ Grik, ọ bụ n’ụzọ nkịtị, “ụmụ nke nrubeisi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: dị ka
  rationale: Ọ na-egosi ụdị njirimara na omume a na-akpọ ndị na-agụ akwụkwọ ka ha bie n’ime ya.
- source_word: τέκνα ὑπακοῆς
  choice: ụmụ nke nrubeisi
  rationale: E debere usoro genitive nke Grik iji chekwaa echiche nke njirimara e ji nrubeisi mara, ọ bụ ezie na ‘ụmụ na-erube isi’ ga-adịkwu mfe n’Igbo.
- source_word: μὴ συσχηματιζόμενοι
  choice: unu ekwekwala ka ... kpụzie ndụ unu
  rationale: Nke a na-egosipụta mmachibido omume na-aga n’ihu, ma na-edobe echiche nke ịghara ikwe ka ọchịchọ ochie nye ndụ ha ọdịdị.
- source_word: ταῖς ... ἐπιθυμίαις
  choice: ọchịchọ ndị ahụ
  rationale: ‘Ọchịchọ’ bụ okwu Igbo doro anya ma saa mbara; n’ebe a, ihe gbara ya gburugburu na-egosi na ọchịchọ ndị a adịghị mma n’omume.
- source_word: πρότερον
  choice: unu nwere mgbe mbụ
  rationale: Nke a na-egosi ndụ na ọchịchọ ha nwere n’oge gara aga n’ụzọ Igbo sitere n’okike.
- source_word: ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: n’oge unu nọ n’amaghị ihe
  rationale: Nke a na-edobe ọnọdụ mbụ ha nke enweghị ezi ihe ọmụma n’ebughị nkọwa okpukpe ọzọ bata.
theological_decisions:
- issue: Ma a ga-eme ka τέκνα ὑπακοῆς bụrụ okwu nkọwa dị mfe
  choice: ụmụ nke nrubeisi
  alternative: ụmụ na-erube isi
  rationale: Nhọrọ a na-echekwa ike nke okwu Grik nke na-akọwa njirimara e ji nrubeisi mara; ihe odide ala peeji na-enye ụdị Igbo dị mfe n’akọwaghị ya gabiga ihe amaokwu ahụ kwuru.
- issue: Ma μὴ συσχηματιζόμενοι na-egosi nanị ihe mmadụ na-eme onwe ya ma ọ bụ ikwe ka ihe ọzọ kpụzie ya
  choice: unu ekwekwala ka ... kpụzie ndụ unu
  alternative: unu akpụkwala onwe unu dịka ...
  rationale: Ụdị participle ahụ nwere ike ibu middle ma ọ bụ passive. Nsụgharị a na-echekwa echiche nke ịghara ịgbaso ụkpụrụ ọchịchọ ochie, n’emeghị ka otu akụkụ nke ambiguity ahụ bụrụ naanị ihe o nwere ike ịpụta.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ ‘ụmụ nke nrubeisi’ n’ahịrị bụ isi iji chekwaa ọdịdị na ike njirimara nke Grik, ebe ihe odide ala peeji nyere ụzọ Igbo a na-asụkarị.
