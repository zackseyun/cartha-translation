  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ, ἐλυτρώθητε ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/018.yaml
  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: ig
  text: ebe unu maara na ọ bụghị ihe ndị na-emebi emebi, dị ka ọlaọcha ma ọ bụ ọlaedo, ka e ji gbapụta unu[a] site n’ụzọ ndụ unu na-abaghị uru, nke e nyefere unu site n’aka ndị nna unu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “tọhapụ unu site n’ịkwụ ụgwọ.” Ngwaa Grik ahụ nwere echiche nke ịtọhapụ mmadụ site n’ụgwọ mgbapụta.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “nke unu ketara n’aka ndị nna ochie unu.” N’ụzọ nkịtị, Grik sịrị, “nke e nyefere site n’aka ndị nna.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: ebe unu maara
  rationale: Ọ na-edobe njikọ participle ahụ na okwu ndị gbara ya gburugburu, ma na-ada ka Igbo nkịtị n’enweghị ime ka njikọ ahụ bụrụ naanị ihe kpatara ya.
- source_word: ἐλυτρώθητε
  choice: e ji gbapụta unu
  rationale: “Gbapụta” na-egosi ịtọhapụ onye site n’ịkwụ ụgwọ, ma na-edobekwa ụda okwu mgbapụta nke amaokwu ahụ.
- source_word: φθαρτοῖς
  choice: ihe ndị na-emebi emebi
  rationale: Adjective ahụ na-arụ ọrụ dị ka aha ebe a; nsụgharị a na-egosi ihe na-emebi ma ọ bụ na-agaghị adịgide.
- source_word: ἀργυρίῳ ἢ χρυσίῳ
  choice: dị ka ọlaọcha ma ọ bụ ọlaedo
  rationale: “Dị ka” na-eme ka o doo anya na ọlaọcha na ọlaedo bụ ihe atụ nke ihe ndị na-emebi emebi.
- source_word: ἐκ
  choice: n’ụzọ ndụ
  rationale: N’usoro Igbo “gbapụta unu n’ụzọ ndụ” na-egosi nkewapụ ma ọ bụ ịpụ n’ọnọdụ mbụ ahụ nke ọma.
- source_word: ματαίας
  choice: na-abaghị uru
  rationale: Ọ na-egosi ihe efu, ihe na-enweghị ezi mkpụrụ ma ọ bụ uru, n’asụsụ ndị mmadụ na-aghọta ngwa ngwa.
- source_word: ἀναστροφῆς
  choice: ụzọ ndụ
  rationale: Ọ gụnyere omume na usoro mmadụ si ebi ndụ, ọ bụghị naanị otu omume kpọmkwem.
- source_word: πατροπαραδότου
  choice: nke e nyefere unu site n’aka ndị nna unu
  rationale: Ọ na-edobe echiche nke ihe a natara site n’ọgbọ ndị nna, tinyere asụsụ gbasara “ndị nna” dị na Grik.
theological_decisions:
- issue: Okwu mgbapụta na echiche ụgwọ
  choice: gbapụta
  alternative: tọhapụ site n’ịkwụ ụgwọ
  rationale: “Gbapụta” na-edobe ihe oyiyi mgbapụta ahụ n’ebughị ụzọ kọwaa usoro ozizi pụrụ iche; ọlaọcha na ọlaedo na-eme ka echiche ụgwọ ahụ pụta ìhè.
- issue: Asụsụ banyere ihe e ketara n’aka ndị gara aga
  choice: ndị nna unu
  alternative: ndị nna nna unu / ndị nna ochie unu
  rationale: Grik kpọmkwem na-ekwu maka ndị nna. A hapụrụ okwu ahụ otú ahụ, ebe nkọwa ala peeji na-egosi na ọ pụkwara ịpụta ndị nna nna ma ọ bụ ndị nna ochie n’ozuzu.
translation_notes:
  register: 'E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ malitere na “ebe unu maara” iji gosi na ọ na-aga n’ihu site n’okwu gbara ya gburugburu. E debere usoro nkwuwa okwu nke Grik: ọ bụghị ihe na-emebi emebi—ọlaọcha ma ọ bụ ọlaedo—ka e ji gbapụta ha.'
