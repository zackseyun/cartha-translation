  to: n’ihi na e dere[a] sị, “Unu ga-adị nsọ, n’ihi na m dị nsọ.”
  rationale: The revision removes an unneeded object pronoun from the standard Scripture-citation formula and avoids adding reflexive emphasis to God’s self-description. It preserves the causal logic, plural address, consistent holiness terminology, and the future-form wording of the Greek citation.
