    reason: alternative_reading
  revision_rationale: The revision removes an unneeded object pronoun from the standard Scripture-citation formula and avoids adding reflexive emphasis to God’s self-description. It preserves the causal logic, plural address, consistent holiness terminology, and the future-form wording of the Greek citation.
