  yaml_path: translation/nt/1_peter/001/016.yaml
  text: because it is written[a], “You shall be holy, because I am holy.”
translation:
  language: ig
  text: n’ihi na e dere[a] sị, “Unu ga-adị nsọ, n’ihi na m dị nsọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya kpọmkwem dị ka iwu, “Dịnụ nsọ.” Asụsụ Grik na-agbaso okwu Akwụkwọ Nsọ e hotara site n’iji ụdị ọdịnihu, “Unu ga-adị nsọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: n’ihi na
  rationale: Ọ na-egosi na ihe e dere n’Akwụkwọ Nsọ bụ ihe ndabere nye ndụmọdụ dị n’amaokwu bu ụzọ; ‘n’ihi na’ na-egosipụta ihe kpatara ya n’Igbo nke oge a.
- source_word: γέγραπται
  choice: e dere ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma dị ugwu si ekwu usoro a na-eji webata ihe e hotara n’Akwụkwọ Nsọ; ọ na-egosikwa na ihe ahụ e dere ka dị ire.
- source_word: ὅτι (nke mbụ)
  choice: sị
  rationale: Ọ na-arụ ọrụ dị ka akara mmeghe nke okwu a hotara; ‘sị’ bụ ụzọ ebumpụta ụwa e si webata okwu kpọmkwem n’Igbo.
- source_word: Ἅγιοι
  choice: nsọ
  rationale: ‘Nsọ’ na-eburu ma echiche nke ịbụ onye e kewapụrụ nye Chineke ma nke ịdị ọcha n’omume n’ọnọdụ a.
- source_word: ἔσεσθε
  choice: unu ga-adị
  rationale: Ọ na-echekwa ọdịdị ọdịnihu nke Grik, ma n’ime okwu iwu a hotara, ọ ka nwere ike ibu ike nke iwu ma ọ bụ agbamume.
- source_word: ὅτι (nke abụọ)
  choice: n’ihi na
  rationale: 'Ọ na-egosi ihe kpatara a ga-eji dị nsọ: ịdị nsọ nke Chineke n’onwe ya.'
- source_word: ἐγὼ
  choice: mụ onwe m
  rationale: A gbasiri nnọchiaha ahụ ike na Grik; ‘mụ onwe m’ na-echekwa nkwusiri ike ahụ nke Chineke na-ekwu banyere onwe ya.
- source_word: ἅγιος
  choice: nsọ
  rationale: E ji otu okwu ahụ mee ihe n’ebe abụọ iji chekwaa njikọ doro anya n’etiti ịdị nsọ nke ndị a na-agwa okwu na ịdị nsọ nke Chineke.
theological_decisions:
- issue: Ike ọdịnihu ἔσεσθε nwere n’okwu a banyere ịdị nsọ
  choice: “Unu ga-adị nsọ” iji chekwaa ụdị ọdịnihu dị n’ihe e hotara, ya na ike iwu ọ pụrụ inwe.
  alternative: “Dịnụ nsọ” ma ọ bụ “Unu ga-emesị dị nsọ.”
  rationale: Grik na-agbaso usoro okwu e hotara na Levitikọs, nke ji ọdịnihu kwuo ihe nwere ike ịrụ ọrụ dị ka iwu. Nsụgharị a anaghị eme ya naanị amụma, ọ naghịkwa ehichapụ ụdị ọdịnihu nke isi mmalite ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu. ‘Unu’ dabara na nnọchiaha ọtụtụ mmadụ nke Grik. E tinyere akara ụkwụ [a] ozugbo n’usoro okwu ‘e dere ya,’ dị ka isi ederede Bekee si hazie ya.
