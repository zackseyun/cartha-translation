    reason: alternative_reading
  revision_rationale: The revision removes the explicitly supplied redemption clause so that the Igbo, like the Greek, remains an instrumental continuation of verse 18. It retains the clear implied comparison of blood and uses more natural sacrificial terminology for the lamb’s two qualifications. The title “Mesaya” and its alternative footnote are retained.
