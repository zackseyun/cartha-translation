  yaml_path: translation/nt/1_peter/001/019.yaml
  text: but with the precious blood of Messiah[a], like that of a lamb without blemish and without spot,
translation:
  language: ig
  text: kama site n’ọbara dị oke ọnụ ahịa nke Mesaya[a], dịka ọbara nwa atụrụ na-enweghị ntụpọ na mmerụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Kraịst.” Okwu Grik Χριστοῦ bụ aha utu nke pụtara “Mesaya”; a na-asụgharịkwa ya dịka “Kraịst” n’ụzọ ọdịnala.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: kama
  rationale: 'Ọ na-egosi ọdịiche siri ike megide ihe e kwuru n’amaokwu bu ụzọ: ọ bụghị site n’ihe na-emebi emebi, kama site n’ọbara.'
- source_word: τιμίῳ
  choice: dị oke ọnụ ahịa
  rationale: Nke a na-egosi nnukwu uru na nsọpụrụ ọbara ahụ nwere, n’asụsụ Igbo dị ugbu a ma dịkwa ugwu.
- source_word: αἵματι
  choice: ọbara
  rationale: A hapụrụ ihe oyiyi doro anya nke Grik; ọ na-ezo aka n’ọnwụ ịchụ àjà, ma a naghị eji nkọwa ahụ dochie aha ahụ.
- source_word: ὡς
  choice: dịka
  rationale: Ọ na-ebute ntụnyere, ebe nkebi okwu gbara ya gburugburu na-eme ka o doo anya na ọbara Mesaya ka a na-atụnyere ọbara nwa atụrụ.
- source_word: ἀμνοῦ
  choice: nwa atụrụ
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya; echiche banyere anụmanụ àjà ka nọ n’ime ihe oyiyi ahụ n’enweghị ịkọwa ya karịa isi mmalite.
- source_word: ἀμώμου
  choice: na-enweghị nkwarụ
  rationale: Ọ dabara n’asụsụ e ji akọwa anụmanụ àjà a na-anabata, ma ghara ime ka okwu ahụ bụrụ naanị banyere omume ọma.
- source_word: καὶ
  choice: nke na-enweghịkwa
  rationale: Ọ na-ejikọta nkọwa abụọ ahụ ma na-edobe ịdị iche ha n’Igbo eke.
- source_word: ἀσπίλου
  choice: ntụpọ
  rationale: ‘Na-enweghị ntụpọ’ na-edobe ihe oyiyi a na-ahụ anya ma kewapụ ya na ‘na-enweghị nkwarụ.’
- source_word: Χριστοῦ
  choice: Mesaya
  rationale: N’ebe a, Χριστός na-arụ ọrụ dịka utu aha; ‘Mesaya’ na-eme ka ihe utu aha ahụ pụtara doo anya karịa iji ya dịka aha nkịtị.
theological_decisions:
- issue: Otú e si sụgharịa Χριστοῦ
  choice: nke Mesaya
  alternative: nke Kraịst
  rationale: E debere Χριστός dịka utu aha Mesaya n’isi ederede; ‘Kraịst’ bụ ntụgharị ọdịnala a na-enye n’ala ala peeji, n’ebughị ụzọ kpebie esemokwu okpukpe ọ bụla.
- issue: Mmekọrịta ὡς ἀμνοῦ na ọbara
  choice: dịka ọbara nwa atụrụ
  alternative: dịka nwa atụrụ
  rationale: 'Imegharị ‘ọbara’ n’Igbo na-eme ka ntụnyere ahụ doo anya: ọbara Mesaya ka e ji tụnyere nke nwa atụrụ, ọ bụghị nanị ịkpọ Mesaya nwa atụrụ n’ụzọ na-edoghị anya.'
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E tinyere ‘gbapụta unu’ site n’ọrụ ngwaa amaokwu bu ụzọ, ebe dativ ndị a na-emecha echiche ahụ; nke a na-eme ka iberibe amaokwu ahụ guzozie nke ọma mgbe a gụrụ ya naanị ya.
