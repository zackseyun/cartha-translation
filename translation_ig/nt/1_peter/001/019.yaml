revisions:
- from: kama e ji ọbara dị oke ọnụ ahịa nke Mesaya[a] gbapụta unu, dịka ọbara nwa atụrụ na-enweghị nkwarụ, nke na-enweghịkwa ntụpọ.
  to: kama site n’ọbara dị oke ọnụ ahịa nke Mesaya[a], dịka ọbara nwa atụrụ na-enweghị ntụpọ na mmerụ.
  rationale: The revision removes the explicitly supplied redemption clause so that the Igbo, like the Greek, remains an instrumental continuation of verse 18. It retains the clear implied comparison of blood and uses more natural sacrificial terminology for the lamb’s two qualifications. The title “Mesaya” and its alternative footnote are retained.
  reviewer_model: gpt-5.6-terra
