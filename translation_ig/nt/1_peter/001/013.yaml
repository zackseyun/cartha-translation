id: 1PE.1.13
reference: 1 Peter 1:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: ig
  text: Ya mere, mgbe unu kechara úkwù nke uche unu[a], na-enwekwa uche doro anya kpamkpam[b], tụkwasịnụ olileanya unu n’amara a na-ewetara unu mgbe a ga-ekpughe Jizọs bụ́ Mezaya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “kechara úkwù nke uche unu”; ya bụ, kwadebenụ uche unu maka ime ihe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta ya dịka, “na-enwe uche doro anya, tụkwasịnụ olileanya unu kpamkpam n’amara…” Okwu Grik a sụgharịrị “kpamkpam” pụrụ ịga na nke bu ya ụzọ ma ọ bụ na iwu nke na-esote ya.
    reason: alternative_reading
  - marker: c
    text: N’asụsụ Grik, “Jizọs Kraịst.” N’ebe a, Χριστός bụ aha ọkwa nke pụtara “Mezaya,” ya bụ, onye e tere mmanụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya, ma bụrụkwa okwu Igbo doro anya ma dị ebube.
- source_word: ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: ebe unu kechiri úkwù nke uche unu
  rationale: A hapụrụ ihe atụ ahụ dị ndụ nke ịkekọ úkwù maka ịdị njikere; ndetu ala kọwara ihe ọ pụtara n’ụzọ nkịtị.
- source_word: νήφοντες
  choice: na-enwekwa uche doro anya
  rationale: N’ebe a okwu ahụ na-ezo aka n’ịdị njikere n’uche na iche echiche nke ọma, ọ bụghị kpọmkwem izere mmanya.
- source_word: τελείως
  choice: kpamkpam
  rationale: Ọ na-egosi izu oke. E tinyere ya nso na ‘uche doro anya,’ ebe ndetu ala na-echekwa ohere na ọ pụrụ ịkọwa otú e si atụkwasị olileanya.
- source_word: ἐλπίσατε
  choice: tụkwasịnụ olileanya unu
  rationale: Ụdị a na-egosi iwu siri ike ka ndị na-agụ ya debe olileanya ha n’otu ebe.
- source_word: ἐπὶ τὴν φερομένην ὑμῖν χάριν
  choice: n’amara a na-ewetara unu
  rationale: Ọ na-echekwa ụdị okwu ugbu a nke participle passive φερομένην, ma ‘amara’ bụ okwu a na-anabata nke ọma maka χάρις n’ọmụmụ Kraịst.
- source_word: ἐν ἀποκαλύψει
  choice: mgbe a ga-ekpughe
  rationale: Ọ na-eme ka njikọ oge dị na nkebiokwu ahụ doo anya n’Igbo, n’enweghị ịgbanwe echiche nke mkpughe.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ́ Mezaya
  rationale: A sụgharịrị Χριστός dịka aha ọkwa ‘Mezaya,’ ọ bụghị dịka aha ezinụlọ; ‘bụ́’ na-eme ka aha ọkwa ahụ bụrụ Igbo eke.
theological_decisions:
- issue: Ma a ga-edebe ihe atụ nke ‘úkwù nke uche’ ma ọ bụ gbanwee ya naanị ka ọ bụrụ ‘kwadebenụ uche unu’
  choice: E debere ‘kechiri úkwù nke uche unu’ n’ahịrị bụ isi.
  alternative: kwadebenụ uche unu maka ime ihe
  rationale: Ihe atụ ahụ bụ akụkụ pụtara ìhè nke okwu Grik; ndetu ala na-enyere onye na-agụ ya aka ịghọta echiche nke ịdị njikere.
- issue: Ihe τελείως na-akọwa
  choice: N’ahịrị bụ isi, ‘kpamkpam’ na-akọwa inwe uche doro anya.
  alternative: Ọ pụrụ ịkọwa ịtụkwasị olileanya kpamkpam.
  rationale: Nhazi okwu Grik nwere ezigbo mgbagwoju anya n’ebe a; a họọrọ otu ụzọ maka Igbo na-asụ were were, ma chekwaa ụzọ nke ọzọ na ndetu ala.
- issue: Nsụgharị Χριστοῦ
  choice: Mezaya
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dịka aha ọkwa nke onye ahụ e tere mmanụ; ya mere ‘Mezaya’ na-eme ka nke ahụ pụta ìhè n’enweghị itinye ozizi otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ Grik n’ahịrị bụ isi, ma e jiri ndetu ala kọwaa ya. A zere iji okwu gbasara ịṅụ mmanya maka νήφοντες n’ihi na gburugburu okwu a na-elekwasị anya n’uche na ịdị njikere.
