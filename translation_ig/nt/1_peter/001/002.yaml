id: 1PE.1.2
reference: 1 Peter 1:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: ig
  text: dị ka mburụzọmata nke Chineke Nna si dị,[a] n’ido nsọ nke Mmụọ Nsọ,[b] maka nrubeisi na ifesa ọbara Jizọs bụ Mesaya.[c] Ka amara na udo baara unu ụba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mburụzọmata” sụgharịrị πρόγνωσις. Ndị na-akọwa Akwụkwọ Nsọ ekwekọghị ma okwu a ọ na-emesi ịmata Chineke tupu oge eruo ike, ka ọ bụ nhọpụta ya tupu oge eruo, ma ọ bụ ha abụọ.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’ido nsọ nke Mmụọ.” Nkebiokwu Grik ahụ nwere ike igosi ọnọdụ nke ido nsọ ma ọ bụ ọrụ Mmụọ na-arụ iji doo ha nsọ.
    reason: lexical_alternative
  - marker: c
    text: Ifesa ọbara nwere ike ịbụ nkwalite onyinyo ọgbụgba ndụ na ime ka ihe dị ọcha n’Agba Ochie, karịsịa Ọpụpụ 24:8.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρόγνωσιν
  choice: dị ka mburụzọmata ... si dị
  rationale: Nke a na-egosi ụkpụrụ ma ọ bụ ndabere nke κατά, ma jigide echiche πρόγνωσις nke ịmata tupu oge eruo n’enweghị ịkọwa ya ozugbo dịka nhọpụta.
- source_word: θεοῦ πατρός
  choice: nke Chineke Nna
  rationale: Ọ na-egosi na mburụzọmata ahụ bụ nke Chineke, onye bụ Nna.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: site n’ọrụ Mmụọ Nsọ nke ido ha nsọ
  rationale: Asụsụ Igbo a na-agụ nke ọma ma na-egosi na Mmụọ Nsọ bụ onye na-arụ ọrụ ido nsọ; e tinyere “Nsọ” iji mee ka onye πνεύματος na-ezo aka na ya doo anya n’usoro nke Nna, Mmụọ, na Jizọs.
- source_word: εἰς ὑπακοὴν
  choice: ka ha wee rubere isi
  rationale: Ọ na-egosi nzube ma ọ bụ ihe ga-esi na ya pụta, dịka εἰς si arụ ọrụ ebe a.
- source_word: καὶ ῥαντισμὸν αἵματος
  choice: ka e fesakwa ha ọbara
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo ifesa mmadụ ọbara, ma na-echekwa onyinyo ọgbụgba ndụ na ime ka ihe dị ọcha.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mesaya
  rationale: “Mesaya” na-echekwa Χριστός dịka utu aha; “bụ” na-eme ka njikọ aha na utu aha daa nke ọma n’Igbo.
- source_word: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη
  choice: Ka amara na udo baara unu ụba
  rationale: “Ka” na-egosipụta ọchịchọ/ngọzi nke optative πληθυνθείη, ebe “baara unu ụba” bụ Igbo ebumpụta ụwa maka mmụba dị ukwuu.
theological_decisions:
- issue: Ihe πρόγνωσις pụtara n’ihe gbasara nhọpụta
  choice: Mburụzọmata
  alternative: Nhọpụta e mere tupu oge eruo; ịhụnanya e kpebiri tupu oge eruo; nanị ịmata ihe ga-eme
  rationale: Nhọrọ a na-echekwa esemokwu dị n’okwu Grik ahụ ma ghara ịmanye otu nkọwa ozizi.
- issue: Onye πνεύματος na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ ma ọ bụ ike na-abụghị onye
  rationale: Usoro atọ nke Chineke Nna, Mmụọ, na Jizọs na-akwado na ọ bụ Mmụọ Nsọ ka a na-ekwu maka ya.
- issue: Ike utu aha Χριστοῦ
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a, Χριστός ka nwere ike dịka utu aha nke Jizọs, ya mere “Mesaya” na-ebupụta ihe okwu ahụ pụtara karịa nanị idegharị ụda ya.
- issue: Njikọ ὑπακοὴν na ῥαντισμὸν
  choice: Ka ha wee rubere isi, ka e fesakwa ha ọbara
  alternative: Nrubeisi nye Jizọs na ifesa ọbara ya; ma ọ bụ nrubeisi nke Jizọs na ifesa ọbara ya
  rationale: Nsụgharị ahụ na-edobe ihe abụọ ahụ dịka ebumnuche ma ọ bụ nsonaazụ nke εἰς, n’enweghị ịgbakwunye onye a na-erubere isi ebe Grik ekwughị ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “mburụzọmata” chekwaa okwu nkà mmụta okpukpe n’enweghị idozi esemokwu ya; e ji nkọwa dị ntakịrị mee “ἁγιασμῷ πνεύματος” ka ọ bụrụ Igbo a na-agụ nke ọma. Akara edemede ukwu na-egosi ngwụcha nkebi salutation ahụ.
