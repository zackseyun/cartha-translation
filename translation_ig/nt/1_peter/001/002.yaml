  to: dị ka mburụzọmata nke Chineke Nna si dị,[a] n’ido nsọ nke Mmụọ Nsọ,[b] maka nrubeisi na ifesa ọbara Jizọs bụ Mesaya.[c] Ka amara na udo baara unu ụba.
