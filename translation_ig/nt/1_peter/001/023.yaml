  yaml_path: translation/nt/1_peter/001/023.yaml
  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: ig
  text: Ebe ọ bụ na a mụọla unu ọzọ, ọ bụghị site na mkpụrụ na-emebi emebi, kama site na mkpụrụ na-adịghị emebi emebi, site n’okwu Chineke dị ndụ ma na-adịgide adịgide.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’okwu nke Chineke dị ndụ ma na-adịgide adịgide.” N’asụsụ Grik, okwu ndị a sụgharịrị “dị ndụ” na “na-adịgide adịgide” nwere ike ịkọwa ma “okwu” ma “Chineke,” ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-akwado ka ha na-akọwa “okwu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: ebe ọ bụ na a mụworo unu ọzọ
  rationale: Ọ bụ participle zuru oke (perfect), nke e ji olu nnara mee. Nsụgharị a na-egosi na Chineke bụ onye mere ka ọmụmụ ọhụrụ ahụ dịrị, nakwa na ihe ọ rụpụtara ka dị ugbu a; “ebe ọ bụ na” na-ejikọkwa ya nke ọma na ihe gbara amaokwu ahụ gburugburu.
- source_word: σπορᾶς
  choice: mkpụrụ
  rationale: “Mkpụrụ” bụ okwu Igbo doro anya nke na-edobe ihe atụ nke ọmụmụ na mmalite ndụ dị n'okwu Grik.
- source_word: φθαρτῆς
  choice: na-emebi emebi
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka ihe nwere ike ire ure ma ọ bụ laa n'iyi, ma na-eme ka ọdịiche ya na ἀφθάρτου pụta ìhè.
- source_word: ἀφθάρτου
  choice: na-adịghị emebi emebi
  rationale: Nhọrọ a na-edobe kpọmkwem ọdịiche dị n'etiti φθαρτῆς na ἀφθάρτου n'asụsụ dị mfe nghọta.
- source_word: διὰ
  choice: site na
  rationale: Mgbe διά so genitive, ọ na-egosi ụzọ ma ọ bụ ihe e ji mee ihe; “site na” bụ ụzọ Igbo kwụ ọtọ isi kwuo ya.
- source_word: λόγου
  choice: okwu
  rationale: “Okwu” na-edobe isi nghọta λόγος n'enweghị ịkọwa ya karịa ihe odide ahụ kwuru; “ozi” ga-ekwe omume ma ọ ga-adị ntakịrị ka nkọwa.
- source_word: ζῶντος
  choice: dị ndụ
  rationale: Nke a na-asụgharị participle ahụ kpọmkwem ma na-adabara “okwu” n'Igbo eke.
- source_word: θεοῦ
  choice: Chineke
  rationale: N'ahịrịokwu “okwu Chineke,” Igbo na-egosi genitive nke nwe ma ọ bụ isi mmalite n'ụzọ eke, n'agbanyeghị na ọ naghị etinye okwu ọzọ maka “nke.”
- source_word: μένοντος
  choice: na-adịgide adịgide
  rationale: Nhọrọ a na-egosi omume na-aga n'ihu nke μένω ma na-ekwu n'ụzọ doro anya na okwu ahụ anaghị agafe agafe.
theological_decisions:
- issue: Ma ζῶντος na μένοντος hà na-akọwa “okwu” ka hà na-akọwa “Chineke”
  choice: 'A tụgharịrị ha ka ha na-akọwa “okwu”: “okwu Chineke dị ndụ ma na-adịgide adịgide.”'
  alternative: “okwu nke Chineke dị ndụ ma na-adịgide adịgide”
  rationale: N'asụsụ Grik, participle abụọ ahụ kwekọrọ na λόγου, ihe gbara ya gburugburu—karịsịa amaokwu 25—na-ekwukwa banyere okwu na-adịgide. Otú ọ dị, n'ihi na ụdị genitive ndị ahụ nwere ike ime ka a ghọta na ha na-akọwa Chineke, e debere nghọta ọzọ ahụ n'okpuru peeji kama iwepụ esemokwu ụtọasụsụ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta mee ihe. “A mụworo unu ọzọ” na-edobe olu nnara na nsonaazụ ọmụmụ ọhụrụ ahụ ka dị ugbu a; e zere okwu ụka pụrụ iche ma ọ bụ nkọwa nke otu nzukọ.
