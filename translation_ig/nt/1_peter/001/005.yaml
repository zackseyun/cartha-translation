  terminology: “Okwukwe,” “nzọpụta,” and “oge ikpeazụ” are appropriate established Standard Igbo biblical terms. The first note’s alternative for faithfulness is adjusted to the more idiomatic infinitival expression “ikwesi ntụkwasị obi.”
