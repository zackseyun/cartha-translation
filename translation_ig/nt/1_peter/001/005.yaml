id: 1PE.1.5
reference: 1 Peter 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοὺς ἐν δυνάμει θεοῦ φρουρουμένους διὰ πίστεως εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι ἐν καιρῷ ἐσχάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: ig
  text: ndị e ji ike Chineke na-echekwa site n’okwukwe[a] maka nzọpụta dị njikere ka e kpughee ya n’oge ikpeazụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site ná ntụkwasị obi”; nke na-adịchaghị yie ka ọ bụ ya n’ebe a, “site n’ikwesi ntụkwasị obi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mgbe oge ikpeazụ ga-eru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς
  choice: ndị
  rationale: “Ndị” na-arụ ọrụ dị ka nnọchiaha njikọ n’Igbo ma na-ejikọ ndị a na-ekwu okwu ha na amaokwu gara aga, na-etinyeghị “unu” nke na-anọghị kpọmkwem n’okwu Grik a.
- source_word: ἐν δυνάμει θεοῦ
  choice: Chineke ji ike ya
  rationale: Nhazi a na-egosi ike Chineke dị ka ụzọ e si echekwa ha. Ọ bụ okwu Igbo sitere n’ọnụ ma doo anya karịa nsụgharị nkịtị “n’ime ike Chineke.”
- source_word: φρουρουμένους
  choice: na-echekwa
  rationale: Ọ na-egosi omume nchebe na-aga n’ihu nke a na-emere ndị a na-ekwu maka ha. “Na-echekwa” bụ okwu Igbo nkịtị ma na-eburu echiche nke idebe mmadụ na nchekwa.
- source_word: διὰ πίστεως
  choice: site n’okwukwe
  rationale: “Okwukwe” bụ okwu Igbo a na-ejikarị sụgharị πίστις, ebe “site na” na-egosi ụzọ ma ọ bụ ihe e ji enweta nche ahụ. E debere nhọrọ ndị ọzọ n’ala ala peeji.
- source_word: εἰς σωτηρίαν
  choice: maka nzọpụta
  rationale: “Maka” na-egosi ihe nche ahụ na-ele anya iru, ebe “nzọpụta” na-edebe echiche σωτηρία n’enweghị ịkọwa ya karịa ihe okwu a kwuru.
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: dị njikere ka e kpughee ya
  rationale: Nkebiokwu a na-edebe echiche na nzọpụta ahụ adịla njikere, nakwa na a ga-ekpughe ya, kama ikwu na ọ bụ naanị ịkwadebe ka a na-akwadebe ya ugbu a.
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: n’oge ikpeazụ
  rationale: “Oge” dabara na καιρός dịka oge a kara aka ma ọ bụ oge dị mkpa; “ikpeazụ” na-edebe ntụgharị uche gaa n’ọdịnihu n’ebughị usoro nkọwa pụrụ iche banyere ọgwụgwụ ụwa.
theological_decisions:
- issue: Mmekọrịta dị n’etiti nchebe Chineke na okwukwe mmadụ na διὰ πίστεως
  choice: Chineke ji ike ya echekwa, ebe okwukwe bụ ụzọ nche ahụ si arụ ọrụ.
  alternative: Ịgụ okwukwe dịka ihe e kwuru naanị iji kọwaa ndị ahụ, ma ọ bụ ịgụ πίστις n’ebe a dịka ikwesị ntụkwasị obi.
  rationale: Usoro okwu Grik na-egosi ike Chineke dịka ihe e ji echekwa ha, na okwukwe dịka ụzọ. Nsụgharị ahụ hapụrụ ihe abụọ ahụ ọnụ n’enweghị ikpebi esemokwu ozizi banyere ịnọgidesi ike ma ọ bụ ịdapụ.
- issue: Oge nzọpụta ahụ ga-apụta
  choice: Nzọpụta a na-ele anya n’ọdịnihu, mgbe a ga-ekpughe ya n’oge ikpeazụ.
  alternative: Ịgụ nzọpụta a naanị dịka nchegharị nke ugbu a, ma ọ bụ ikwu na ọ nweghị akụkụ ọbụla metụtara ugbu a.
  rationale: “Dị njikere ka e kpughee ya n’oge ikpeazụ” na-ele anya n’ọdịnihu, ma amaokwu ahụ n’onwe ya anaghị agọnahụ ụzọ ndị ọzọ Agba Ọhụrụ si ekwu maka nzọpụta.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ nhazi “Chineke ji ike ya na-echekwa” iji mee ka ụzọ nchebe ahụ doo anya n’Igbo, ebe a hapụrụ okwu banyere okwukwe na oge ikpeazụ ka ha nwee nghọta ndị isi mmalite ahụ kwere omume.
