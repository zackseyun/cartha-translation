id: 1PE.1.11
reference: 1 Peter 1:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: ig
  text: Ha na-enyocha onye, ma ọ bụ ụdị oge, Mmụọ Mesaya nke nọ n’ime ha na-egosi, ka ọ na-ebu ụzọ agba akaebe banyere ahụhụ ndị dịịrị Mesaya[a] na ebube ndị ga-esochi ihe ndị ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ahụhụ nke Mesaya.”
    reason: A pụrụ ịghọta τὰ εἰς Χριστὸν παθήματα dịka ahụhụ ndị metụtara Mesaya, ma ọ bụ kpọmkwem dịka ahụhụ nke Mesaya.
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: Ha na-enyocha
  rationale: “Na-enyocha” na-egosi nchọgharị siri ike nke ndị amụma nọ na-eme, ma na-aga n’ihu n’echiche amaokwu bu ụzọ.
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: onye ọ bụ ma ọ bụ ụdị oge ọ bụ
  rationale: 'Nke a na-echekwa ajụjụ abụọ dị na Grik: onye e bu n’uche na ụdị oge e bu n’uche, n’agbanyeghị na usoro okwu ahụ siri ike.'
- source_word: ἐδήλου
  choice: na-egosi
  rationale: Ụdị ngwaa a na-egosi ihe na-aga n’ihu; “na-egosi” bụ okwu Igbo doro anya ma ghara ịkọwa ihe karịrị isi mmalite.
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: Mmụọ Mesaya nọ n’ime ha
  rationale: A na-edobe njikọ kpọmkwem n’etiti Mmụọ ahụ na Mesaya, nakwa eziokwu ahụ na Mmụọ ahụ nọ n’ime ndị amụma.
- source_word: προμαρτυρόμενον
  choice: mgbe ọ na-ebu ụzọ gbaa akaebe
  rationale: Nke a na-echekwa ma echiche ịgba akaebe ma echiche na akaebe ahụ bịara tupu ihe ndị ahụ emee.
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: ahụhụ ndị dịịrị Mesaya
  rationale: “Dịịrị” na-egosi ahụhụ ndị metụtara ma chere Mesaya ihu, n’ebughị ụzọ mee ka εἰς bụrụ naanị ihe nwe; a na-edobe nghọta ọzọ na nkọwa ala peeji.
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: ebube dị iche iche ga-esochi ihe ndị ahụ
  rationale: Nke a na-echekwa ọtụtụ ebube dị na ụdị ọtụtụ nke Grik na usoro oge ha—ha na-abịa mgbe ahụhụ ndị ahụ gasịrị.
theological_decisions:
- issue: Njikọ nke “Mmụọ Mesaya” na ndị amụma
  choice: Mmụọ Mesaya nọ n’ime ha
  alternative: Mmụọ amụma nke na-ekwu banyere Mesaya
  rationale: A naghị eme ka okwu Grik bụrụ naanị nkọwa banyere Mesaya; a na-edobe nkwupụta ya na Mmụọ ahụ bụ nke Mesaya ma nọ n’ime ndị amụma.
- issue: Ike nke εἰς n’okwu gbasara ahụhụ Mesaya
  choice: ahụhụ ndị dịịrị Mesaya
  alternative: ahụhụ nke Mesaya
  rationale: Isi ederede na-egosipụta njikọ sara mbara nke εἰς, ebe nkọwa ala peeji na-echekwa nghọta nke nwe nke bụkwa ihe kwere omume n’ọnọdụ a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “Mesaya” maka Χριστός mgbe ọ na-arụ ọrụ dị ka utu aha. A hapụrụ mgbagwoju anya nke ahịrịokwu Grik n’ókè ọ ga-ekwe omume, ma jiri nkọwa ala peeji chekwaa nghọta ọzọ dị mkpa.
