review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the present participial sense of κομιζόμενοι ('as/while you receive'), the possessive phrase 'your faith,' and the appositional identification of the outcome as salvation. However, 'ihe okwukwe unu rụpụtara' is a less direct and somewhat more interpretive way to render τέλος than a standard Igbo noun for 'outcome/result.'
  naturalness: The sentence is understandable, but 'nsonaazụ nke okwukwe unu' is more idiomatic, concise, and suitably formal Standard Igbo than 'ihe okwukwe unu rụpụtara.' The alternative wording 'nzọpụta nke unu onwe unu' is also unnatural; 'nzọpụta nke onwe unu' is clearer.
  terminology: '''okwukwe,'' ''nzọpụta,'' and ''mkpụrụ obi'' are appropriate Standard Igbo renderings. Retaining ''mkpụrụ obi'' in the main text preserves the Greek wording without deciding the lexical/anthropological question; the footnote appropriately records ''ndụ'' and ''onwe unu'' as contextual alternatives.'
  issues:
  - severity: low
    issue: The rendering of τέλος is unnecessarily periphrastic.
    rationale: '''Ihe okwukwe unu rụpụtara'' can mean ''what your faith produced,'' but τέλος here names the outcome/goal/result itself. ''Nsonaazụ'' renders this more directly and naturally while retaining the contextual sense of realized outcome.'
  - severity: low
    issue: Footnote b contains an awkward alternative phrase.
    rationale: '''Nzọpụta nke unu onwe unu'' is not natural Standard Igbo. ''Nzọpụta nke onwe unu'' accurately conveys ''the salvation of yourselves/persons'' without changing the stated lexical range.'
