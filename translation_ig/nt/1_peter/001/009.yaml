  text: as you receive the outcome of your faith[b][a], the salvation of your souls.
translation:
  language: ig
  text: ka unu na-anata nsonaazụ nke okwukwe unu[a], ya bụ, nzọpụta nke mkpụrụ obi unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “njedebe,” “ebumnobi,” ma ọ bụ “ihe si n’okwukwe unu pụta.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nzọpụta nke ndụ unu” ma ọ bụ “nzọpụta nke onwe unu.” Okwu Grik a nwere ike ịpụta “mkpụrụ obi,” “ndụ,” ma ọ bụ “mmadụ,” dịka okwu gbara ya gburugburu si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: ka unu na-anata
  rationale: Na-egosipụta participle dị ugbu a nke na-ejikọta amaokwu a na ihe bu ya ụzọ, ma na-enye echiche nke ịnọgide na-anata ihe okwukwe na-eweta.
- source_word: τέλος
  choice: ihe ... rụpụtara
  rationale: N'ebe a, τέλος bụ ihe okwukwe mechara weta ma ọ bụ rụpụta, ọ bụghị naanị njedebe n'ihe gbasara oge. A kọwara nhọrọ ndị ọzọ n'okpuru amaokwu.
- source_word: πίστεως ὑμῶν
  choice: okwukwe unu
  rationale: Genitive a na-ezo aka n'okwukwe nke ndị a na-agwa okwu; ntụgharị a bụ nke doro anya ma bụrụkwa okwu Igbo a na-ejikarị eme ihe.
- source_word: σωτηρίαν
  choice: nzọpụta
  rationale: Nke a bụ okwu Igbo kwekọrọ nke ọma na σωτηρία ma na-edobe obosara echiche nke nzọpụta n'akwụkwọ ozi a.
- source_word: ψυχῶν
  choice: mkpụrụ obi
  rationale: Ọ bụ ntụgharị kpọmkwem nke na-edobe asụsụ na esemokwu echiche nke Grik; ọ naghị ekpebi na mmadụ bụ naanị mkpụrụ obi ma ọ bụ na nzọpụta adịghị emetụta ahụ.
theological_decisions:
- issue: Ihe πίστις pụtara n'okwu a
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N'okwu gbara ya gburugburu, ọ na-ezo n'ụzọ kachasị pụta ìhè n'okwukwe ndị na-agụ akwụkwọ ahụ, n'agbanyeghị na okwu Grik ahụ nwere ike inwe ndò echiche ndị ọzọ.
- issue: Ihe ψυχαί pụtara n'okwu ‘nzọpụta nke mkpụrụ obi unu’
  choice: mkpụrụ obi
  alternative: ndụ; mmadụ n'onwe ha
  rationale: A na-edobe okwu Grik ahụ n'ụzọ kpọmkwem n'ahịrị bụ isi, ma a na-enye nghọta ndị ọzọ n'okpuru amaokwu ka a ghara ịmanye nkọwa banyere ọdịdị mmadụ nke ederede ahụ ekwughị hoo haa.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. Nkebiokwu ‘ihe okwukwe unu rụpụtara’ na-ada ka Igbo e kere eke ma na-edobe echiche nke αποτέλεσμα/τέλος n’enweghị ime ka ọ bụrụ naanị njedebe oge.
