revisions:
- from: Pita, onyeozi Jizọs bụ Mezaya, na-edegara ndị Chineke họọrọ, bú ndị ọbịa bi n'ebe dị iche iche n'etiti ndị gbasasịrị agbasasị n'ógbè Pọntọs, Galeshia, Kapadoshia, Eshia na Bitinia:[a]
  to: Pita, onyeozi Jizọs bụ Mezaya, na-edegara ndị a họọrọ, bụ ndị ọbịa a gbasasịrị n’ógbè Pọntọs, Galeshia, Kapadoshia, Eshia, na Bitinia,[a]
  rationale: The revision retains the formal sender-recipient structure and the regional names, while rendering the Greek more directly. It avoids making God the explicit chooser in a verse where the agent is unstated, and it expresses the combined sense of sojourners/exiles and dispersion without forcing either an ethnic-Jewish-only or a purely spiritual interpretation. The footnote preserves the principal lexical alternatives and the Diaspora resonance.
