id: 1PE.1.1
reference: 1 Peter 1:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/001.yaml
  text: Peter[a], an apostle of Jesus the Messiah, to the chosen sojourners of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia[e][d][c][b],
translation:
  language: ig
  text: Pita, onyeozi Jizọs bụ Mezaya, na-edegara ndị a họọrọ, bụ ndị ọbịa a gbasasịrị n’ógbè Pọntọs, Galeshia, Kapadoshia, Eshia, na Bitinia,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị akụkụ a: “ndị a họọrọ, ndị ọbịa nke mgbasa,” ma ọ bụ “ndị a họọrọ, ndị bi nwa oge n’ebe na-abụghị obodo ha.” Okwu “mgbasa” nwere ike ime ka mmadụ cheta ma ndị Juu gbasasịrị n’ala dị iche iche ma echiche sara mbara nke ndị Chineke bi n’ebe na-abụghị ezi ala ha.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: Πέτρος
  choice: Pita
  rationale: Ụdị aha a maara nke ọma n'Igbo maka Πέτρος.
- source_word: ἀπόστολος
  choice: onyeozi
  rationale: Ọ na-egosi onye e zigara nke nwere ikike pụrụ iche, ma bụrụkwa okwu Igbo dị nkenke ma doo anya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mezaya
  rationale: A sụgharịrị Χριστός dị ka utu aha 'Mezaya,' ebe 'bụ' mere ka njikọ ahụ daa nke ọma n'Igbo n'enweghị ịgbanwe ihe Greek kwuru.
- source_word: ἐκλεκτοῖς
  choice: ndị Chineke họọrọ
  rationale: Greek pụtara ndị a họọrọ; itinye 'Chineke' na-eme ka onye họọrọ ha pụta ìhè dịka ihe gbara ama n'ọnọdụ ahụ, n'enweghị iji okwu nkà mmụta okpukpe nwere ike ibu nkọwa otu ụka.
- source_word: παρεπιδήμοις
  choice: ndị ọbịa bi n'ebe dị iche iche
  rationale: Nke a na-egosi ndị bi nwa oge ma ọ bụ ndị na-abụghị ụmụ amaala ebe ha bi, ma zere okwu ga-eme ka a manye echiche nke nchụpụ n'ike.
- source_word: διασπορᾶς
  choice: n'etiti ndị gbasasịrị agbasasị
  rationale: Ọ na-echekwa echiche nke Diaspora ma ghara ikpebi ma okwu ahụ bụ naanị maka ndị Juu ka ọ bụkwa ihe atụ banyere ndị Chineke.
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: n'ógbè Pọntọs, Galeshia, Kapadoshia, Eshia na Bitinia
  rationale: A kpọgharịrị aha ógbè ndị ahụ n'ụdị kwekọrọ na ụda na mkpopụta Igbo; 'n'ógbè' na-egosi ọrụ ọnọdụ nke ndepụta genitive ahụ.
theological_decisions:
- issue: Ihe ἐκλεκτοῖς pụtara
  choice: ndị Chineke họọrọ
  alternative: ndị a họpụtara
  rationale: Nke a na-ekwupụta na Chineke họọrọ ndị a, ma ọ naghị ebubata usoro ozizi pụrụ iche banyere nhọpụta.
- issue: Mmekọrịta παρεπιδήμοις διασπορᾶς
  choice: ndị ọbịa bi n'ebe dị iche iche n'etiti ndị gbasasịrị agbasasị
  alternative: ndị a chụgara n'etiti ndị gbasasịrị agbasasị
  rationale: Nhọrọ a na-ahapụ ma ọnọdụ mmadụ n'ezie ma ụda ime mmụọ nke ndị bi n'ebe na-abụghị ala ha, n'enweghị ikpebi na ọ bụ naanị ndị Juu ma ọ bụ naanị ihe atụ Ndị Kraịst.
- issue: Nsụgharị Χριστοῦ
  choice: Mezaya
  alternative: Kraịst
  rationale: E ji utu aha 'Mezaya' chekwaa echiche nke onye Chineke tere mmanụ nke dị na Χριστός.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe ọdịdị mmalite akwụkwọ ozi Greek, mana e tinyere 'na-edegara' iji mee ka onye a na-ezigara akwụkwọ ozi doo anya n'Igbo. Akara ụkwụ [a] dị n'isiokwu ahụ ma kwekọọ na nkọwa ya.
