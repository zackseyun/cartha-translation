review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies Peter as an apostle and retains the Messianic force of Χριστοῦ. However, it adds an explicit agent ('Chineke') to ἐκλεκτοῖς, though no agent is stated in this verse, and its rendering of παρεπιδήμοις διασπορᾶς ('ndị ọbịa bi n'ebe dị iche iche n'etiti ndị gbasasịrị agbasasị') is diffuse and shifts the Diaspora designation into an awkward reference to being among scattered people.
  naturalness: The revised wording uses a more concise, idiomatic epistolary address. It removes the redundant 'n'ebe dị iche iche' before a list of regions and corrects the nonstandard spelling 'bú' to 'bụ.'
  terminology: Pita, onyeozi, and Mezaya are suitable. 'Ndị a họọrọ' represents ἐκλεκτοῖς without importing an unstated explicit agent. 'Ndị ọbịa a gbasasịrị' keeps both the outsider/temporary-resident sense and the dispersion imagery without deciding whether the reference is exclusively Jewish or wholly metaphorical.
  issues:
  - severity: medium
    issue: The phrase 'ndị Chineke họọrọ' adds 'God' explicitly.
    rationale: ἐκλεκτοῖς means 'chosen/elect,' but this verse does not state the chooser. Although the wider context identifies God, the translation of this verse should not add the agent to the text.
  - severity: medium
    issue: The rendering 'ndị ọbịa bi n'ebe dị iche iche n'etiti ndị gbasasịrị agbasasị' weakens and recasts παρεπιδήμοις διασπορᾶς.
    rationale: It makes the recipients live 'among scattered people,' whereas the Greek addresses sojourners/exiles characterized by dispersion. It is also wordy and redundant before the geographical list.
  - severity: low
    issue: The form 'bú' should be 'bụ.'
    rationale: Standard Igbo orthography requires ụ in the copular form.
  - severity: low
    issue: The terminal colon does not reflect the source punctuation.
    rationale: The Greek superscription continues with a comma; retaining a comma is the least intrusive formal equivalent.
  revised_text: Pita, onyeozi Jizọs bụ Mezaya, na-edegara ndị a họọrọ, bụ ndị ọbịa a gbasasịrị n’ógbè Pọntọs, Galeshia, Kapadoshia, Eshia, na Bitinia,[a]
  revised_footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị akụkụ a: “ndị a họọrọ, ndị ọbịa nke mgbasa,” ma ọ bụ “ndị a họọrọ, ndị bi nwa oge n’ebe na-abụghị obodo ha.” Okwu “mgbasa” nwere ike ime ka mmadụ cheta ma ndị Juu gbasasịrị n’ala dị iche iche ma echiche sara mbara nke ndị Chineke bi n’ebe na-abụghị ezi ala ha.'
    reason: lexical_alternative_and_cultural_note
  revision_rationale: The revision retains the formal sender-recipient structure and the regional names, while rendering the Greek more directly. It avoids making God the explicit chooser in a verse where the agent is unstated, and it expresses the combined sense of sojourners/exiles and dispersion without forcing either an ethnic-Jewish-only or a purely spiritual interpretation. The footnote preserves the principal lexical alternatives and the Diaspora resonance.
