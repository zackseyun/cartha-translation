id: 1PE.1.10
reference: 1 Peter 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Περὶ ἧς σωτηρίας ἐξεζήτησαν καὶ ἐξηραύνησαν προφῆται οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/010.yaml
  text: Concerning this salvation[a], the prophets who prophesied about the grace for you searched and investigated carefully[b],
translation:
  language: ig
  text: Banyere nzọpụta a, ndị amụma ahụ buru amụma banyere amara dịịrị unu[a] jiri ịnụ ọkụ n’obi chọọ ya ma nyochaa ya nke ọma[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “amara nke ga-abịara unu.” Ihe ndị gbara amaokwu a gburugburu na-atụ aka n’oge ọdịnihu, ma amaokwu a ekwughị oge ahụ kpọmkwem.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsị, “chọgharịrị ma nyochaa nke ọma.” Ngwaa Grik abụọ ahụ na-egosi nchọ na nyocha siri ike.
    reason: translation_clarity
lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: Banyere nzọpụta a
  rationale: “Banyere” na-egosi isiokwu dịka περί na genitive si eme; “a” na-ezo aka na nzọpụta e kwuru okwu ya n’amaokwu ndị bu ụzọ, n’ụzọ Igbo doro anya.
- source_word: σωτηρίας
  choice: nzọpụta
  rationale: “Nzọpụta” na-echekwa ma echiche nke ịnapụta mmadụ ma ibu okwu a nwere n’ihe gbasara ọrụ Chineke n’akụkụ amaokwu a.
- source_word: ἐξεζήτησαν
  choice: jiri ịnụ ọkụ n’obi chọọ ya
  rationale: Nkebi a na-egosi nchọ siri ike nke ἐκζητέω; “ya” na-eme ka ihe ngwaa ahụ na-ezo aka na ya, ya bụ nzọpụta ahụ, doo anya n’Igbo.
- source_word: ἐξηραύνησαν
  choice: nyochaa ya nke ọma
  rationale: Nke a na-egosi nyocha miri emi nke ἐξεραυνάω ma mee ka ngwaa nke abụọ dị iche na ngwaa mbụ.
- source_word: προφῆται
  choice: ndị amụma ahụ
  rationale: Ọ bụ ndị amụma a kọwara site na nkebi participle na-esochi ka a na-ekwu maka ha; “ahụ” na-egosi otu ahụ a kapịrị ọnụ n’Igbo.
- source_word: οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες
  choice: ndị amụma ahụ buru amụma banyere amara dịịrị unu
  rationale: Usoro a na-ejikọta ndị amụma na ihe ha buru amụma banyere ya, ma “dịịrị unu” na-echekwa echiche ntụziaka na uru dị na εἰς ὑμᾶς n’enweghị itinye oge ọdịnihu na-adịghị n’okwu Grik ahụ kpọmkwem.
- source_word: χάριτος
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa χάρις dịka ihu ọma na onyinye ọma Chineke.
- source_word: εἰς ὑμᾶς
  choice: dịịrị unu
  rationale: Nke a bụ ụzọ Igbo dị nfe isi gosi na amara ahụ metụtara ndị a na-agwa okwu ma bụrụkwa maka uru ha.
theological_decisions:
- issue: Ma a ga-eme ka oge ọdịnihu pụta ìhè n’okwu “amara dịịrị unu”
  choice: E tinyebeghị “nke ga-abịara unu” n’ahịrị bụ isi.
  alternative: amara nke ga-abịara unu
  rationale: Ọrụ ndị amụma na ihe gbara amaokwu a gburugburu na-atụ aka n’ọdịnihu, ma amaokwu Grik a n’onwe ya enweghị ngwaa ma ọ bụ participle na-ekwu oge ọdịnihu kpọmkwem. Ya mere, e debere nghọta ahụ n’okpuru peeji kama itinye ya n’ahịrị bụ isi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere okwu okpukpe ndị a maara nke ọma, “nzọpụta,” “ndị amụma,” na “amara.” Usoro ahịrị ahụ na-eme ka isiokwu e butere ụzọ pụta ìhè, ma rịkọm na njedebe na-egosi na echiche ahụ na-aga n’ihu n’amaokwu na-esote.
