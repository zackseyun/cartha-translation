  source_fidelity: 'The draft accurately represents the principal Greek relations: belief in God is mediated through Christ; God raised Christ from the dead and gave him glory; and the readers’ faith and hope are directed to God. The result nuance of ὥστε is retained adequately.'
  naturalness: The opening word order, “unu ndị site na ya kwere,” is understandable but less natural than placing “kwere na Chineke” directly after “ndị.” The revised wording is smoother Standard Igbo while retaining the verse’s continuing-clause form.
  terminology: “okwukwe,” “olileanya,” and “ebube” are appropriate established terms. “Kpọlitere ... site n’ọnwụ” is a natural resurrection expression. Footnote a needs adjustment because its proposed alternative and explanation should not make πιστούς sound as though it independently means “faithful to God” in this construction.
