id: 1PE.1.21
reference: 1 Peter 1:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοὺς δι’ αὐτοῦ ⸀πιστοὺς εἰς θεὸν τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν καὶ δόξαν αὐτῷ δόντα, ὥστε τὴν πίστιν ὑμῶν καὶ ἐλπίδα εἶναι εἰς θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: ig
  text: unu ndị kwere na Chineke site na ya[a], onye kpọlitere ya site n’ọnwụ ma nye ya ebube[b], ka okwukwe unu na olileanya unu wee dị na Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị kwesịrị ntụkwasị obi”; ma n’ebe a, o yikarịrị ka ọ pụtara ndị kwere na Chineke site na Kraịst.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị njikọ a, “nke mere na okwukwe unu na olileanya unu dị na Chineke.”
    reason: alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: site na ya
  rationale: Nke a na-egosi na Kraịst bụ onye e si n’aka ya bịaruo n’okwukwe na Chineke, ma ọ naghị agbakwụnye echiche karịrị ihe διά na genitive pụtara.
- source_word: πιστοὺς εἰς θεόν
  choice: ndị ... kwere na Chineke
  rationale: N’usoro okwu a, πιστούς na εἰς θεόν na-ezo aka n’ịkwere na Chineke, ọ bụghị nanị n’ịbụ ndị kwesịrị ntụkwasị obi. Nkebiokwu a bụkwa Igbo doro anya ma dị ndụ.
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: onye kpọlitere ya site n’ọnwụ
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si kwuo mbilite n’ọnwụ ma na-edobe echiche nke isi n’ọnwụ pụta.
- source_word: δόξαν αὐτῷ δόντα
  choice: ma nye ya ebube
  rationale: Nsụgharị a kwụ ọtọ, na-ejikọta omume Chineke abụọ—ịkpọlite Kraịst na inye ya ebube.
- source_word: ὥστε
  choice: ka ... wee
  rationale: Usoro a nwere ike igosi ebumnuche ma ọ bụ ihe si n’omume ahụ pụta, ya mere ọ na-echekwa ntakịrị mgbagwoju anya dị n’asụsụ Grik.
- source_word: τὴν πίστιν ὑμῶν καὶ ἐλπίδα
  choice: okwukwe unu na olileanya unu
  rationale: “Okwukwe” na “olileanya” bụ okwu Igbo a maara nke ọma ma na-egosi ntụkwasị obi na atụmanya ndị na-agụ akwụkwọ ahụ.
- source_word: εἶναι εἰς θεόν
  choice: dị na Chineke
  rationale: Nke a na-egosi na Chineke bụ onye okwukwe na olileanya ha lekwasịrị anya na ya, ma na-edobekwa nkwughachi εἰς θεόν dị n’amaokwu ahụ.
theological_decisions:
- issue: Ihe πιστούς pụtara
  choice: ndị kwere na Chineke site na Kraịst
  alternative: ndị kwesịrị ntụkwasị obi nye Chineke
  rationale: Njikọ ya na εἰς θεόν na-akwado echiche nke ikwere ma ọ bụ ịtụkwasị Chineke obi; ma a na-edebe ihe ọzọ okwu ahụ pụrụ ịpụta na nkọwa ala peeji.
- issue: Ọrụ Kraịst n’ịbịaru Chineke nso
  choice: “site na ya” na-egosi na a na-esite na Kraịst kwere na Chineke
  alternative: “n’ihi ya” dị ka nanị ihe kpatara okwukwe ahụ
  rationale: διά na genitive na-egosi ụzọ ma ọ bụ onye e si n’aka ya mee ihe; nsụgharị ahụ anaghị etinye nkọwa ozizi ọzọ na-abụghị ihe ederede kwuru.
- issue: Ike nke ὥστε
  choice: “ka ... wee”
  alternative: “nke mere na” ma ọ bụ “ihe si na ya pụta bụ na”
  rationale: Asụsụ Grik nwere ike ibu echiche nke nsonaazụ ma ọ bụ ebumnuche. “Ka ... wee” na-ahapụ njikọ ahụ oghe, ebe nkọwa ala peeji na-egosi nghọta nke nsonaazụ nke ọma.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, dee ya. E debere amaokwu ahụ dị ka nkebiokwu na-aga n’ihu site n’amaokwu bu ya ụzọ, dịka usoro Grik si dị. “Site na ya,” “kpọlitere ya site n’ọnwụ,” na “nye ya ebube” bụ okwu kwụ ọtọ; “ka ... wee” na-echekwa ohere nke ebumnuche na nsonaazụ dị na ὥστε.
