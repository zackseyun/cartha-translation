id: 1PE.1.12
reference: 1 Peter 1:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: ig
  text: E kpugheere ha na ọ bụghị maka onwe ha kama ọ bụ maka unu ka ha na-eje ozi n’ihe ndị a[a]. Ugbu a, e kwupụtalaara unu ihe ndị ahụ site n’aka ndị kwusaara unu ozi ọma site na Mmụọ Nsọ e zitere site n’eluigwe[b]—ihe ndị mmụọ ozi na-agụsi agụụ ike ileba anya n’ime ha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ bụghị onwe ha kama unu ka ha na-ejere ozi.” Dative nke Grik na-egosi ndị ozi ndị amụma ahụ baara uru.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “site n’aka ndị kwusaara unu ozi ọma.” Grik ji ngwaa nke pụtara ‘ikwusa ozi ọma.’
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị “ileba anya” dịka “ile n’ime ya nke ọma” ma ọ bụ “ịhulata lee anya n’ime ya”; okwu ahụ na-egosi nlele jupụtara n’ọchịchọ siri ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: ha
  rationale: Nnọchiaha a dị na dative ma na-ezo aka n’ebe ndị amụma a kpọrọ aha n’amaokwu gara aga nọ; ‘ha’ dabara nke ọma n’Igbo mgbe ọ na-eso ‘E kpugheere.’
- source_word: ἀπεκαλύφθη
  choice: E kpugheere
  rationale: Nke a na-edobe olu nnara nke ngwaa ahụ na echiche nke ime ka ihe Chineke zoro ezo pụta ìhè, n’agbanyeghị na ekwughị onye mere ya kpọmkwem.
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ
  choice: ọ bụghị maka onwe ha kama ọ bụ maka unu
  rationale: ‘Maka’ na-egosipụta n’ụzọ doro anya na dative abụọ ahụ na-akọ ndị rite uru n’ozi ndị amụma, ma na-edobe nkwụrịta dị n’etiti ‘onwe ha’ na ‘unu.’
- source_word: διηκόνουν
  choice: ha na-eje ozi
  rationale: Ụdị imperfect ahụ na-egosi ọrụ gara n’ihu n’oge gara aga; ‘na-eje ozi’ bụ Igbo dị ugbu a, doo anya, nke na-adịghị etinye echiche ụka ọzọ n’ime okwu ahụ.
- source_word: αὐτά
  choice: n’ihe ndị a
  rationale: Ọ na-ezo aka n’ihe ndị amụma buru amụma banyere ha; ‘ihe ndị a’ na-eme ka njikọ ahụ doo anya karịa nnọchiaha naanị ya.
- source_word: ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: Ugbu a, e kwupụtalaara unu ihe ndị ahụ
  rationale: ‘Ugbu a’ na-edobe νῦν, ebe ‘e kwupụtalaara’ na-ejigide olu nnara ma na-ejikọta nkwupụta ahụ mere eme na ọnọdụ ndị na-agụ akwụkwọ ugbu a.
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: site n’aka ndị ... kwusara unu ozi ọma
  rationale: Nke a na-egosipụta ndị mmadụ dịka ụzọ ozi ahụ si bịarute, ma na-asụgharị ngwaa εὐαγγελίζω n’asụsụ ndị mmadụ na-aghọta nke ọma.
- source_word: πνεύματι ἁγίῳ
  choice: ji Mmụọ Nsọ
  rationale: ‘Ji’ na-egosipụta dative nke ngwá ọrụ, ya bụ, Mmụọ Nsọ bụ onye ha ji kwusaa ozi ọma; mkpụrụedemede ukwu na-egosi na ọ bụ Mmụọ Nsọ Chineke ka a na-ekwu maka ya.
- source_word: ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: ahụ e zitere site n’eluigwe
  rationale: Nkebiokwu a na-akọwa Mmụọ Nsọ, na-edobekwa echiche nke izite ya na ebe o si bịa.
- source_word: ἐπιθυμοῦσιν
  choice: na-agụsi agụụ ike
  rationale: Nke a na-egosipụta ọchịchọ siri ike, na-aga n’ihu, nke present tense nke Grik na-enye.
- source_word: παρακύψαι
  choice: ilebanye anya n’ime
  rationale: Nhọrọ a na-edobe εἰς na echiche nke nlele siri ike, nke chọrọ ịmata ihe nke ọma, n’enweghị ịmanye ọdịdị ahụ́ nke ‘ịhulata’ n’isiokwu bụ ndị mmụọ ozi.
theological_decisions:
- issue: Onye πνεύματι ἁγίῳ na-ezo aka na ya na ọrụ ya n’ikwusa ozi ọma
  choice: Mmụọ Nsọ bụ onye sitere n’eluigwe zipụ, onye ndị nkwusa ji kwusaa ozi ọma
  alternative: ‘mmụọ dị nsọ’ dịka ike ime mmụọ ma ọ bụ ọnọdụ ime mmụọ n’ozuzu
  rationale: Ọnọdụ okwu a na nkọwa nke izite ya site n’eluigwe na-akwado na ọ bụ Mmụọ Nsọ Chineke ka a na-ekwu maka ya; nsụgharị ahụ anaghị agbakwụnye nkọwa karịrị nke ahịrịokwu ahụ.
- issue: Mmekọrịta dị n’etiti ozi ndị amụma na ozi ọma e kwusara ndị kwere ekwe
  choice: Ndị amụma jere ozi nke baara ndị kwere ekwe n’oge e mesịrị uru, n’ihe ndị a kwupụtara ugbu a n’ozi ọma
  alternative: Ndị amụma jere ozi naanị maka onwe ha ma ọ bụ naanị maka ndị ha na ha dịkọrọ ndụ
  rationale: Nkwụrịta ‘ọ bụghị ... kama ...’ na njikọ dị n’etiti ‘ihe ndị a’ na ihe a kwupụtara ugbu a na-egosi ọdịiche oge ahụ ma na-ejikọta ozi abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta, mee ihe. A họọrọ ‘eje ozi,’ ‘ozi ọma,’ na ‘ilebanye anya’ ka ederede ghara ịdị arọ ma ọ bụ bụrụ nke otu ụka kpọmkwem. A na-eji ‘ozi ọma’ dị ka mkpụrụokwu abụọ dịka ojiji Standard Igbo a họọrọ n’isi ederede.
