    rationale: πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ na-akọwa ụzọ/ọrụ e ji kwusaa ozi ọma, ebe participle ‘e zitere’ na-akọwa Mmụọ Nsọ. Ịtụ ‘kwusaara ... ozi ọma’ n’ihu, wee tinye ‘site na Mmụọ Nsọ e zitere...’ n’azụ, na-eme njikọ ahụ pụta ìhè n’Igbo.
  - severity: low
