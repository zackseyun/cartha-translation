- from: E kpugheere ha na ọ bụghị maka onwe ha kama ọ bụ maka unu ka ha na-eje ozi n’ihe ndị a[a]. Ugbu a, e kwupụtalaara unu ihe ndị ahụ site n’aka ndị ji Mmụọ Nsọ ahụ e zitere site n’eluigwe kwusara unu ozi ọma[b]—ihe ndị mmụọ ozi na-agụsi agụụ ike ilebanye anya n’ime ha[c].
  to: E kpugheere ha na ọ bụghị maka onwe ha kama ọ bụ maka unu ka ha na-eje ozi n’ihe ndị a[a]. Ugbu a, e kwupụtalaara unu ihe ndị ahụ site n’aka ndị kwusaara unu ozi ọma site na Mmụọ Nsọ e zitere site n’eluigwe[b]—ihe ndị mmụọ ozi na-agụsi agụụ ike ileba anya n’ime ha[c].
  rationale: 'E megharịrị naanị okwu ndị chọrọ imezi nhazi na idiom Igbo: e wepụrụ ‘ahụ,’ a haziri nkebiokwu na-akọwa Mmụọ Nsọ e zitere site n’eluigwe, ma dochie ‘ilebanye anya’ anya na ‘ileba anya.’ A mekwara footnote c ka ọ ghara ịgbakwunye echiche ‘ọchịchọ ịmata ihe’ nke na-adịghị kpọmkwem na isi Grik.'
