review_pass:
  verdict: revise
  source_fidelity: 'Isi nsụgharị ahụ na-esochi Grik nke ọma: ‘E kpugheere ha’ na-edobe passive ahụ; ọdịiche ‘ọ bụghị maka onwe ha ... maka unu’ na-egosi ndị rite uru; ‘e kwupụtalaara’ na-edobe nkwupụta e mere ugbu a; ‘ndị mmụọ ozi na-agụsi agụụ ike’ na-egosi present tense nke ἐπιθυμοῦσιν. Otú ọ dị, nhazi ‘ndị ji Mmụọ Nsọ ahụ e zitere ... kwusara’ na-adị mgbagwoju anya n’Igbo, ma ‘ahụ’ enweghị ihe ọ na-atụgharị kpọmkwem na Grik.'
  naturalness: A ghọtara ederede ahụ, ma mgbanwe obere na usoro okwu na-eme ka akụkụ gbasara ndị kwusaara ozi ọma na Mmụọ Nsọ bụrụ Igbo dị larịị ma doo anya. ‘ileba anya’ bụ mkpokọta okwu a na-ahụkarị karịa ‘ilebanye anya.’
  terminology: ‘Mmụọ Nsọ,’ ‘ozi ọma,’ ‘ndị mmụọ ozi,’ na ‘eje ozi’ dabara na Standard Igbo na ndekọ Akwụkwọ Nsọ. Edebeghị nkọwa okpukpe karịrị ihe Grik kwuru.
