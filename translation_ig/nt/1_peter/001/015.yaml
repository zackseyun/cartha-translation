id: 1PE.1.15
reference: 1 Peter 1:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον καὶ αὐτοὶ ἅγιοι ἐν πάσῃ ἀναστροφῇ γενήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/015.yaml
  text: but as the Holy One who called you is holy[a], you yourselves also be holy in all your conduct[b],
translation:
  language: ig
  text: Kama, dị ka Onye ahụ kpọrọ unu si dị nsọ, unu onwe unu kwa dịrịnụ nsọ[a] n’omume unu niile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ghọọnụ ndị nsọ.” Iwu Grik a nwere ike imesi ịbanye n’ọnọdụ a ma ọ bụ igosipụta ya ike.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ụzọ ndụ unu niile.” Mkpụrụokwu Grik a nwere ike ịpụta ụzọ mmadụ niile si ebi ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Kama
  rationale: Ọ na-egosi mgbanwe doro anya site n’ụzọ ndụ ochie a kpọtụrụ aha n’amaokwu bu ụzọ gaa n’iwu ọhụrụ a.
- source_word: κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον
  choice: dị ka Onye ahụ kpọrọ unu si dị nsọ
  rationale: Nke a na-egosi na ịdị nsọ nke Onye kpọrọ ha bụ ụkpụrụ ha ga-agbaso, ma na-edobe ‘ịkpọ’ na ‘ịdị nsọ’ dị ka ha dị n’asụsụ Grik.
- source_word: καὶ αὐτοὶ
  choice: unu onwe unu kwa
  rationale: ‘Onwe unu’ na-egosipụta nkwusi ike dị na αὐτοὶ, ebe ‘kwa’ na-anọchi καί.
- source_word: ἅγιοι
  choice: nsọ
  rationale: Ọ na-edobe otu mkpụrụokwu ahụ e ji kọwaa Onye kpọrọ ha, ka njikọ dị n’etiti ịdị nsọ ya na nke ndị a kpọrọ pụta ìhè.
- source_word: ἐν πάσῃ ἀναστροφῇ
  choice: n’omume unu niile
  rationale: ἀναστροφή na-ezo aka n’omume ma ọ bụ n’ụzọ mmadụ niile si ebi ndụ; nsụgharị a dị mkpirikpi, doo anya, ma dịkwa arọ n’ụzọ kwesịrị ekwesị.
- source_word: γενήθητε
  choice: dịrịnụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ. ‘Dịrịnụ nsọ’ bụ ndụmọdụ iwu sitere n’okike n’Igbo ma ọ naghị amanye echiche pụrụ iche banyere usoro mmadụ si aghọ onye nsọ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ịdị nsọ Chineke na oku a kpọrọ ndị kwere ekwe
  choice: dị ka Onye ahụ kpọrọ unu si dị nsọ ... unu onwe unu kwa dịrịnụ nsọ
  alternative: dị ka Onye Nsọ ahụ kpọrọ unu si dị, unu onwe unu kwa bụrụnụ ndị nsọ
  rationale: Nhọrọ a na-eme ka ntụnyere ahụ zuo oke ma na-edobe nkwughachi ‘nsọ’ nke dị n’asụsụ Grik, n’etinyeghị nkọwa ozizi ọzọ.
- issue: Ike iwu dị na γενήθητε
  choice: dịrịnụ nsọ
  alternative: ghọọnụ ndị nsọ
  rationale: ‘Dịrịnụ nsọ’ na-enye iwu ahụ n’Igbo dị mfe ma dị ebube, ebe nkọwa ala peeji na-echekwa ohere nke nghọta na-emesi ịbanye n’ọnọdụ ahụ ike.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu, dee ya. E tinyere ‘-nụ’ n’iwu ahụ n’ihi na a na-agwa ọtụtụ mmadụ okwu. E debere nhazi ntụnyere na nkwughachi ‘nsọ’ n’enweghị itinye ozizi otu ụka.
