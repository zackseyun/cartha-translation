- from: ka e wee hụ na eziokwu nke okwukwe unu nke a nwapụtara—nke dị oké ọnụ ahịa karịa ọlaedo na-ala n’iyi, n’agbanyeghị na e ji ọkụ anwale ya—ga-eweta otuto na ebube na nsọpụrụ n’oge mkpughe Jizọs bụ́ Mesaịa ahụ[a][b][c].
  to: ka e wee hụ na àgwà okwukwe unu a nwapụtara—nke dị oké ọnụ ahịa karịa ọlaedo na-ala n’iyi, n’agbanyeghị na e ji ọkụ anwale ya—ga-eweta otuto na ebube na nsọpụrụ n’oge mkpughe Jizọs bụ́ Mesaịa ahụ[a][b][c].
