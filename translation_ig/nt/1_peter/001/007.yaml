id: 1PE.1.7
reference: 1 Peter 1:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: ig
  text: ka e wee hụ na àgwà okwukwe unu a nwapụtara—nke dị oké ọnụ ahịa karịa ọlaedo na-ala n’iyi, n’agbanyeghị na e ji ọkụ anwale ya—ga-eweta otuto na ebube na nsọpụrụ n’oge mkpughe Jizọs bụ́ Mesaịa ahụ[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ule a na-anwale okwukwe unu”; okwu Grik ahụ nwere ike imesi usoro ịnwale ahụ ike, ma ọ bụ àgwà okwukwe ule gosipụtara.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Jizọs Kraịst.” N’ebe a, “Mesaịa” sụgharịrị aha-ọrụ Χριστός dịka ihe ọ pụtara si dị.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “a ga-achọpụta na ọ bụ maka otuto na ebube na nsọpụrụ.”
    reason: previous_rendering
lexical_decisions:
- source_word: δοκίμιον
  choice: eziokwu ... nke a nwapụtara
  rationale: Nke a na-egosi na ule egosila na okwukwe ahụ bụ nke eziokwu, kama ilekwasị anya naanị n’omume ịnwale ya.
- source_word: πίστεως
  choice: okwukwe
  rationale: “Okwukwe” bụ okwu Igbo doro anya ma kwesị ekwesị n’ebe a maka ntụkwasị obi ndị kwere ekwe nwere.
- source_word: πολυτιμότερον
  choice: dị oké ọnụ ahịa karịa
  rationale: Ọ na-echekwa ntụnyere uru dị n’etiti okwukwe a nwapụtara na ọlaedo.
- source_word: χρυσίου
  choice: ọlaedo
  rationale: Nke a bụ nsụgharị nkịtị na nke doro anya nke okwu Grik ahụ.
- source_word: ἀπολλυμένου
  choice: na-ala n’iyi
  rationale: Ọ na-echekwa echiche na ọbụna ọlaedo anaghị adịgide ruo mgbe ebighị ebi.
- source_word: διὰ πυρὸς ... δοκιμαζομένου
  choice: e ji ọkụ anwale ya
  rationale: Ọ na-egosi na ọkụ bụ ihe e ji anwale ọlaedo, na-enweghị ịgbakwụnye nkọwa pụrụ iche banyere ịnụcha ya.
- source_word: εὑρεθῇ εἰς
  choice: ka e wee hụ na ... ga-eweta
  rationale: Ọ bụ Igbo dị ugbu a nke na-egosi nchọpụta na nsonaazụ a ga-apụta, ma ọ naghị eme ka ahịrịokwu ahụ sie ike nghọta.
- source_word: ἔπαινον καὶ δόξαν καὶ τιμήν
  choice: otuto na ebube na nsọpụrụ
  rationale: Ọ na-echekwa ihe atọ ahụ n’usoro ha dị na Grik, ma hapụ onye a ga-enye ha ma ọ bụ onye ga-enye ha n’ejighị aka kpebie ya.
- source_word: ἐν ἀποκαλύψει
  choice: n’oge mkpughe
  rationale: Ọ na-enye nkebiokwu ahụ nghọta oge, ma chekwaa echiche nke ikpughe Jizọs.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ́ Mesaịa ahụ
  rationale: “Mesaịa” na-ebute ihe aha-ọrụ Χριστός pụtara, ebe “ahụ” na-eme ka aha-ọrụ ahụ daa nke ọma n’Igbo.
theological_decisions:
- issue: Ihe τὸ δοκίμιον ὑμῶν τῆς πίστεως pụtara
  choice: Eziokwu nke okwukwe nke ule nwapụtara
  alternative: Ule a na-anwale okwukwe unu
  rationale: N’ọnọdụ a, δοκίμιον yikarịrị ka ọ na-elekwasị anya n’ezi ọnọdụ ule gosipụtara; e debere nghọta nke usoro ịnwale ahụ n’okpuru peeji.
- issue: Onye otuto, ebube na nsọpụrụ metụtara
  choice: A hapụrụ ya n’enweghị onye a kpọpụtara aha
  alternative: Nsọpụrụ a ga-enye ndị kwere ekwe, ma ọ bụ otuto a ga-enye Chineke/Kraịst
  rationale: Grik ahụ ekwughị kpọmkwem onye ga-anata ma ọ bụ nye ihe atọ ahụ, ya mere nsụgharị ahụ echekwaghị otu nkọwa okpukpe n’ike.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara ahịrịokwu ebumnuche nke malitere na “ka,” n’ihi njikọ amaokwu a na ihe bu ya ụzọ. Akara ogologo kewapụrụ nkọwa banyere ọlaedo ka isi echiche ahụ doo anya.
