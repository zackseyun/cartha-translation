review_pass:
  verdict: revise
  source_fidelity: The draft preserves the threefold Greek description and correctly renders the perfect passive sense of τετηρημένην as an inheritance already kept. However, “nke e debere unu n’eluigwe” makes “unu” the object of “e debere” (‘which was placed/kept you in heaven’), rather than expressing that the inheritance is kept for its readers. “Ntụpọ” primarily denotes a defect or fault and does not adequately convey ἀμίαντον, ‘undefiled/unpolluted.’
  naturalness: “Gaa n’ihe nketa” is awkward in this dependent, non-imperative context. Recasting the purpose/result relation as “ka unu nweta ihe nketa” is natural Standard Igbo and fits the preceding clause in v. 3. The revised serial descriptions are idiomatic and retain the distinct concepts.
  terminology: “Ihe nketa” is appropriate for κληρονομία. “Na-adịghị emebi emebi,” “na-adịghị emetọ emetọ,” and “na-adịghị akpọnwụ akpọnwụ” distinguish imperishable, undefiled, and unfading without importing theological interpretation. “N’eluigwe maka unu” accurately represents ἐν οὐρανοῖς εἰς ὑμᾶς.
  issues:
  - severity: high
    issue: The beneficiary phrase is grammatically mistranslated.
    rationale: “Nke e debere unu n’eluigwe” syntactically treats “unu” as what was kept/placed in heaven. The Greek says the inheritance is kept in heaven for the addressees.
  - severity: medium
    issue: “Nke na-enweghị ntụpọ” is not a precise rendering of ἀμίαντον.
    rationale: It means without fault/defect, whereas ἀμίαντον refers to being undefiled or unstained.
  - severity: medium
    issue: “Gaa n’ihe nketa” is not natural for the Greek dependent εἰς phrase.
    rationale: It can sound imperative-like or semantically incomplete in Igbo. A purpose construction naturally carries the connection to the preceding verse.
  revised_text: ka unu nweta ihe nketa na-adịghị emebi emebi, nke na-adịghị emetọ emetọ, nke na-adịghị akpọnwụ akpọnwụ, nke e debere n’eluigwe maka unu,
  revised_footnotes: []
  revision_rationale: The revision corrects the beneficiary syntax, renders the undefiled quality more closely, and uses a natural Igbo purpose construction while preserving the source’s three coordinated descriptions, heavenly location, and completed passive sense.
