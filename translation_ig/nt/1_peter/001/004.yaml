  text: εἰς κληρονομίαν ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον, τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/004.yaml
  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: ig
  text: ka unu nweta ihe nketa na-adịghị emebi emebi, nke na-adịghị emetọ emetọ, nke na-adịghị akpọnwụ akpọnwụ, nke e debere n’eluigwe maka unu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς κληρονομίαν
  choice: gaa n’ihe nketa
  rationale: “Ihe nketa” na-egosipụta ihe a na-enweta dị ka oke e ketara; “gaa n’ime” na-echekwa ntụziaka nke εἰς n’usoro ahịrịokwu ahụ.
- source_word: ἄφθαρτον
  choice: nke na-apụghị ire ure
  rationale: Na-egosipụta ihe na-adịghị emebi emebi ma ọ bụ laa n’iyi.
- source_word: ἀμίαντον
  choice: nke na-enweghị ntụpọ
  rationale: Na-echekwa echiche nke ihe a na-emerụghị ma ọ bụ metọọ.
- source_word: ἀμάραντον
  choice: nke na-apụghịkwa ịkpọ nkụ
  rationale: Na-echekwa ihe atụ nke ifuru ma ọ bụ ahịhịa na-adịghị akpọnwụ, ya bụ, ihe ebube ya na-adịghị agwụ.
- source_word: τετηρημένην
  choice: nke e debere
  rationale: Oge perfect passive na-egosi na e chekwala ihe nketa ahụ, ọ ka dịkwa otú ahụ.
- source_word: ἐν οὐρανοῖς
  choice: n’eluigwe
  rationale: Igbo na-ejikarị “eluigwe” dị ka aha mkpokọta eke maka okwu Grik dị n’ụdị ọtụtụ.
- source_word: εἰς ὑμᾶς
  choice: unu
  rationale: N’akụkụ “e debere,” Igbo eke na-asị “e debere unu,” nke pụtara na e chekwara ya maka unu.
theological_decisions:
- issue: Ụdị ihe nketa ahụ
  choice: 'A hapụrụ nkọwa atọ ahụ iche: enweghị ire ure, enweghị ntụpọ, na enweghị ịkpọ nkụ.'
  alternative: Ịchịkọta ha n’otu okwu dịka “ihe nketa ebighị ebi.”
  rationale: Ịchịkọta ha ga-ehichapụ ụdị echiche atọ dị iche iche Pita ji kọwaa ihe nketa ahụ.
- issue: Ebe e debere ihe nketa ahụ
  choice: n’eluigwe
  alternative: n’ụwa mmụọ
  rationale: “N’eluigwe” na-agbaso οὐρανοῖς ozugbo, ghara itinye nkọwa okpukpe ọzọ n’ime ederede.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji nkebi ahịrị “—” kewaa nkọwa ihe nketa ahụ na nkebi na-ekwu na e debere ya n’eluigwe. Ederede a bụ akụkụ nke ahịrịokwu malitere n’amaokwu bu ya ụzọ, ya mere “gaa n’...” na-edobe njikọ ahụ.
