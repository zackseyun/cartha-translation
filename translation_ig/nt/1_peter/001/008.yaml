id: 1PE.1.8
reference: 1 Peter 1:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: ig
  text: Ọ bụ ezie na unu ahụbeghị ya, unu hụrụ ya n’anya. Ọ bụ ezie na unu adịghị ahụ ya ugbu a, ma unu na-ekwere na ya, unu ji ọṅụ a na-apụghị iji okwu kọwaa, nke dịkwa ebube[a], na-aṅụrị ọṅụ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọṅụ e nyeworo ebube,” ma ọ bụ, “ọṅụ jupụtara n’ebube.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’ebe Jizọs Kraịst nọ n’amaokwu ndị bu ụzọ; ‘ya’ bụ ụzọ Igbo si ekwu ya nke ọma n’ọnọdụ a.
- source_word: οὐκ ἰδόντες
  choice: unu ahụbeghị ya
  rationale: Ụdị a na-egosi na ha ahụtụbeghị ya ruo ugbu a, ma na-edobe njikọ ahụ na ọnọdụ ha dị ugbu a.
- source_word: ἀγαπᾶτε
  choice: unu hụrụ ya n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si kwupụta ịhụ mmadụ n’anya.
- source_word: εἰς ὃν ... πιστεύοντες
  choice: unu na-ekwere na ya
  rationale: ‘Na-ekwere na ya’ na-egosi okwukwe ha tinyere n’ime Kraịst nakwa omume ahụ na-aga n’ihu.
- source_word: ἄρτι μὴ ὁρῶντες
  choice: unu adịghị ahụ ya ugbu a
  rationale: Nke a na-edobe oge ugbu a na ọdịiche dị n’etiti ahụtụbeghị ya na enweghị ike ịhụ ya ugbu a.
- source_word: δὲ
  choice: ma
  rationale: ‘Ma’ na-egosi ọdịiche dị n’etiti enweghị ịhụ ya na ikwere na ya ma na-aṅụrịkwa ọṅụ.
- source_word: ἀγαλλιᾶσθε
  choice: unu ... na-aṅụrị ọṅụ
  rationale: Nkebiokwu a na-egosi nnukwu ọṅụ n’asụsụ Igbo dị ugbu a ma kwekọọ na omume na-aga n’ihu.
- source_word: χαρᾷ ἀνεκλαλήτῳ
  choice: ji ọṅụ a na-apụghị iji okwu kọwaa
  rationale: Nke a na-egosi na ọṅụ ahụ karịrị ihe mmadụ pụrụ ikwu ma ọ bụ kọwaa n’okwu.
- source_word: δεδοξασμένῃ
  choice: nke dịkwa ebube
  rationale: Nke a bụ ntụgharị Igbo dị mfe nghọta nke na-ejikọta ọṅụ ahụ na ebube, ebe nkọwa ala peeji na-echekwa ụzọ ndị na-egosipụta participle passive ahụ nke ọma karị.
theological_decisions:
- issue: Ihe πιστεύοντες εἰς ὃν pụtara
  choice: unu na-ekwere na ya
  alternative: unu tụkwasịrị ya obi
  rationale: ‘Na-ekwere na ya’ na-edobe okwu okwukwe nke Greek n’enweghị itinye nkọwa ụka pụrụ iche; ‘ịtụkwasị obi’ bụ ezi echiche ọzọ ma ọ bụghị naanị ihe okwu ahụ pụrụ ịpụta.
- issue: Ntụgharị δεδοξασμένῃ χαρᾷ
  choice: ọṅụ ... nke dịkwa ebube
  alternative: ọṅụ e nyeworo ebube; ọṅụ jupụtara n’ebube
  rationale: Isi ederede jiri Igbo dị mma ma doo anya, ebe nkọwa ala peeji na-echekwa ike passive/perfect nke δεδοξασμένῃ na nghọta ọzọ nke ịbụ nke jupụtara n’ebube.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere nkwughachi ‘ọṅụ ... na-aṅụrị ọṅụ’ n’ihi na ọ na-anọchi anya njikọ dị n’etiti χαρά na ἀγαλλιάομαι n’ederede Greek.
