    text: Ma ọ bụ, “ule dị iche iche”; n’ọnọdụ ndị ọzọ, okwu Grik ahụ nwekwara ike ịpụta ọnwụnwa na-adọta mmadụ ime mmehie.
    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural time expression and adjusts the grief clause to reflect the Greek passive participle more closely. It preserves the conditional force of εἰ δέον, the present-and-brief temporal sense of ὀλίγον ἄρτι, and the contextual sense of πειρασμοῖς as varied trials, while retaining the lexical alternative in the footnote.
