  text: ἐν ᾧ ἀγαλλιᾶσθε, ὀλίγον ἄρτι εἰ ⸀δέον λυπηθέντες ἐν ποικίλοις πειρασμοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/006.yaml
  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: ig
  text: N’ihe a ka unu na-aṅụrị ọṅụ, ọ bụ ezie na ugbu a, ọ bụrụ na ọ dị mkpa, e meela ka obi wute unu nwa obere oge site n’ọnwụnwa dị iche iche[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ule dị iche iche”; n’ọnọdụ ndị ọzọ, okwu Grik ahụ nwekwara ike ịpụta ọnwụnwa na-adọta mmadụ ime mmehie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: N’ihe a
  rationale: Nke a na-ezo aka n’olileanya nzọpụta na ihe nketa a kọwara tupu amaokwu a. Ọ na-echekwa echiche nke ịnọ n’ime ihe ahụ ma zere ime ka ọ bụrụ naanị ihe kpatara ọṅụ.
- source_word: ἀγαλλιᾶσθε
  choice: unu na-aṅụrị ọṅụ
  rationale: Nkebiokwu a na-egosi ọṅụ siri ike. Nsụgharị a bụ Igbo doro anya ma dị ndụ, n’enweghị iji okwu na-adịghị adịkarị n’ọnụ ndị mmadụ.
- source_word: ὀλίγον ἄρτι
  choice: ugbu a, ruo nwa oge nta
  rationale: Ọ na-echekwa ma echiche nke oge dị ugbu a ma echiche na oge ahụ dị mkpirikpi.
- source_word: εἰ δέον
  choice: ọ bụrụ na ọ dị mkpa
  rationale: Ọ na-echekwa ọnọdụ nke εἰ na echiche nke mkpa dị na δέον, n’etinyeghị nkọwa gbasara onye kpebiri mkpa ahụ.
- source_word: λυπηθέντες
  choice: emewo ka unu nwee mwute
  rationale: Ụdị a na-egosi na ihe ndị ahụ butere ha mwute, ma na-eburu ibu mmetụta uche nke okwu Grik ahụ n’Igbo dị mma.
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: ọnwụnwa dị iche iche
  rationale: N’ebe a, okwu ahụ na-ezo karịsịa n’ihe isi ike na-anwale okwukwe. ‘Ọnwụnwa dị iche iche’ bụ okwu Igbo zuru ezu nke na-anaghị eme ka ihe ọ pụtara bụrụ naanị ndọrọ ime mmehie.
theological_decisions:
- issue: Ihe πειρασμοῖς pụtara n’ọnọdụ nke ahụhụ
  choice: ọnwụnwa dị iche iche
  alternative: ule dị iche iche; ọnwụnwa nke na-adọta mmadụ ime mmehie
  rationale: Amaokwu na-esonụ na-ekwu maka ịnwapụta okwukwe, ya mere ebe a okwu ahụ na-egosi ihe isi ike ndị na-anwale mmadụ. A hapụrụ ohere okwu ahụ nwere kama ime ka ọ bụrụ naanị ọnwụnwa ime mmehie.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, mee ihe. Nhazi ahịrịokwu ahụ na-edobe ọdịiche dị n’etiti ọṅụ nke ndị kwere ekwe na mwute ha na-enwe ugbu a.
