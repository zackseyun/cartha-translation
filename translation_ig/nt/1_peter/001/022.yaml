id: 1PE.1.22
reference: 1 Peter 1:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ⸀ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ⸀ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: ig
  text: N’ịrubere eziokwu ahụ isi, unu emewo ka mkpụrụ obi unu dị ọcha ka unu nwee ịhụnanya ụmụnna na-enweghị ihu abụọ[a]; site n’obi, hụnụ ibe unu n’anya nke ukwuu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịhụnanya maka ndị kwere ekwe ibe unu.” Okwu Grik a sụgharịrị “ịhụnanya ụmụnna” pụtara ịhụnanya dịka nke ndị otu ezinụlọ n’etiti ndị Kraịst ibe ha; ọ gụnyere ụmụnna nwanyị nakwa ụmụnna nwoke.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie nwere, “site n’obi dị ọcha.”
    reason: textual_variant
lexical_decisions:
- source_word: ἡγνικότες
  choice: Ebe unu mere ka ... dị ọcha
  rationale: Nke a na-egosi omume e mere nke nsonaazụ ya ka dị, ma na-edobe ya dịka nkebi ahịrịokwu na-akwado iwu dị n’isi ahịrịokwu ahụ.
- source_word: ψυχὰς
  choice: mkpụrụ obi unu
  rationale: ‘Mkpụrụ obi’ bụ okwu Igbo a na-ahụkarị maka ψυχή n’ebe a, ma ọ na-ezo aka n’ime ndụ mmadụ, ọ bụghị naanị n’otu akụkụ mmadụ e kewapụrụ iche.
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: site n’irubere eziokwu ahụ isi
  rationale: ‘Site na’ na-egosi na nrubeisi bụ ụzọ e si mee ka ha dị ọcha; ‘eziokwu ahụ’ na-edobe kpọmkwem ihe e kwuru n’asụsụ Grik.
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: ka unu wee nwee ịhụnanya ụmụnna nke na-enweghị ihu abụọ
  rationale: ‘Ka unu wee’ na-egosi ebumnuche ma ọ bụ nsonaazụ; ‘ịhụnanya ụmụnna’ na-echekwa echiche nke ịhụnanya ezinụlọ dị n’etiti ndị kwere ekwe, ebe ‘na-enweghị ihu abụọ’ na-egosi ezi ịhụnanya na-abụghị nke aghụghọ.
- source_word: ἀλλήλους ἀγαπήσατε
  choice: hụ ibe unu n’anya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi nye iwu ịhụrịta onwe ha n’anya.
- source_word: ἐκ καρδίας
  choice: jirinụ obi
  rationale: Nke a na-edobe ọgụgụ SBLGNT nke na-ekwu naanị ‘site n’obi,’ n’agbakwụnyeghị ‘dị ọcha.’
- source_word: ἐκτενῶς
  choice: nke ukwuu
  rationale: N’okwu a, ọ na-egosi ịhụnanya siri ike ma na-adịgide; ‘nke ukwuu’ bụ okwu Igbo nkịtị nke na-ebute ike nke ndụmọdụ ahụ n’enweghị ụda okwu ochie.
theological_decisions:
- issue: Ọdịiche dị n’etiti φιλαδελφία na ἀγαπάω n’otu amaokwu ahụ
  choice: A sụgharịrị φιλαδελφία dịka ‘ịhụnanya ụmụnna,’ ma sụgharịa ἀγαπήσατε dịka ‘hụ ... n’anya.’
  alternative: Iji otu okwu ‘ịhụnanya’ mee ha abụọ.
  rationale: Nhọrọ a na-echekwa ọdịdị okwu Grik abụọ ahụ na ọganihu dị n’ahịrịokwu ahụ, ma ọ naghị amanye ọdịiche nkuzi okpukpe karịrị nke ederede kwuru.
- issue: Ma ‘ịhụnanya ụmụnna’ ọ gụnyere ụmụanyị
  choice: E debere ‘ịhụnanya ụmụnna’ n’ederede, tinyekwa nkọwa na ọ gụnyere ụmụnna nwoke na ụmụnna nwanyị niile kwere ekwe.
  alternative: ịhụnanya maka ndị kwere ekwe ibe unu
  rationale: Okwu a họọrọ na-echekwa ihe atụ ezinụlọ nke φιλαδελφία na ọdịiche ya na ngwaa ịhụ n’anya sochirinụ; nkọwa ala peeji na-eme ka nghọta ya zuru oke.
- issue: Ọgụgụ ederede mgbe ἐκ καρδίας gasịrị
  choice: jirinụ obi
  alternative: site n’obi dị ọcha
  rationale: SBLGNT enyere enweghị καθαρᾶς (‘dị ọcha’). A naghị etinye okwu ahụ n’ederede bụ isi, ma a na-edebe ọgụgụ ọzọ ahụ na nkọwa ala peeji.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. ‘Irubere ... isi,’ ‘ịhụnanya ụmụnna,’ na ‘hụ ibe unu n’anya’ bụ usoro okwu a na-aghọta nke ọma; e zere okwu ụka nke otu ngalaba pụrụ iche.
