revisions:
- from: Ebe unu mere ka mkpụrụ obi unu dị ọcha site n’irubere eziokwu ahụ isi, ka unu wee nwee ịhụnanya ụmụnna nke na-enweghị ihu abụọ[a], jirinụ obi[b] hụ ibe unu n’anya nke ukwuu.
  to: N’ịrubere eziokwu ahụ isi, unu emewo ka mkpụrụ obi unu dị ọcha ka unu nwee ịhụnanya ụmụnna na-enweghị ihu abụọ[a]; site n’obi, hụnụ ibe unu n’anya nke ukwuu[b].
  rationale: The revision removes the misleading opening “Ebe,” retains the perfect-completed sense of ἡγνικότες with “unu emewo,” and renders ἐκ καρδίας directly as “site n’obi.” It preserves the source text’s textual reading, both footnote anchors, and the lexical distinction between sibling/familial love and the following command to love.
  reviewer_model: gpt-5.6-terra
