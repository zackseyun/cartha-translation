    text: Ma ọ bụ, “ịhụnanya maka ndị kwere ekwe ibe unu.” Okwu Grik a sụgharịrị “ịhụnanya ụmụnna” pụtara ịhụnanya dịka nke ndị otu ezinụlọ n’etiti ndị Kraịst ibe ha; ọ gụnyere ụmụnna nwanyị nakwa ụmụnna nwoke.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie nwere, “site n’obi dị ọcha.”
    reason: textual_variant
