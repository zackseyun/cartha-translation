id: 1PE.1.25
reference: 1 Peter 1:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: ig
  text: Ma okwu Onyenweanyị na-adịgide ruo mgbe ebighị ebi.” Ma okwu a bụ okwu ahụ e kwusaara unu dịka ozi ọma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Okwu ahụ e kwusara unu dị ka ozi ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥῆμα
  choice: okwu
  rationale: “Okwu” na-anọgide na njikọ ya na Aịzaya 40:8 ma dabara n’ebe abụọ a ῥῆμα pụtara; ọ nwekwara ike ịpụta okwu e kwuru ma ọ bụ ozi.
- source_word: κυρίου
  choice: Onyenweanyị
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị asụ κύριος n'ụzọ dị ùgwù; ụdị njikọ “okwu Onyenweanyị” na-egosi ihe Greek genitive “of the Lord” pụtara.
- source_word: μένει
  choice: na-adịgide
  rationale: “Na-adịgide” na-egosi ịnọgide na-adị n’enweghị nkwụsị, nke kwekọrọ n’ike na-aga n’ihu nke μένει.
- source_word: εἰς τὸν αἰῶνα
  choice: ruo mgbe ebighị ebi
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke nkịtị maka ịdịgide ruo mgbe niile.
- source_word: τοῦτο δέ ἐστιν
  choice: Okwu a bụkwa
  rationale: “Bụkwa” na-egosi ntụgharị dị nro nke δέ ma jikọta okwu e hotara na nkọwa Pita na-enye ya.
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: ozi ọma ahụ e ziri
  rationale: “Ozi ọma” na-echekwa ihe εὐαγγελίζω pụtara, ebe “e ziri” na-egosi omume ịkpọsa ma ọ bụ izi ozi ahụ n’asụsụ Igbo dị mfe.
- source_word: εἰς ὑμᾶς
  choice: unu
  rationale: N’usoro “e ziri unu,” nnọchiaha a na-egosi ndị ozi ahụ ruru, ma na-asụgharị εἰς ὑμᾶς n’ụzọ Igbo eke.
theological_decisions:
- issue: Ihe “okwu Onyenweanyị” na-ezo aka na ya n’etiti Aịzaya 40:8 na itinye ya n’ozi ọma
  choice: E debe “okwu Onyenweanyị” n’okwu e hotara, ma n’ahịrị nke abụọ kọwaa na okwu a bụ ozi ọma e ziri ndị na-agụ akwụkwọ ahụ.
  alternative: Ịsụgharị ya n’ụzọ nkọwa dịka “ozi si n’aka Onyenweanyị” n’ebe abụọ ahụ.
  rationale: Nke a na-echekwa njikọ ya na Akwụkwọ Nsọ e hotara, ma na-ahapụ Pita n’onwe ya ka o jikọta okwu ahụ na ozi ọma; ọ naghị eme ka esemokwu bara uru dị n’etiti okwu e hotara na ntinye ya laa n’iyi.
- issue: Nsụgharị εὐαγγελισθέν
  choice: Jiri “ozi ọma” na ngwaa “e ziri” mee ka echiche nke izi ozi ọma pụta ìhè.
  alternative: “Okwu ahụ e kwusaara unu dịka ozi ọma.”
  rationale: Nsụgharị isi dị nkenke ma bụrụ Igbo eke, ma ndetu ala na-echekwa nsụgharị ọzọ nke na-eme ka ῥῆμα na ọdịdị ngwaa εὐαγγελισθέν pụta ìhè karị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Onyenweanyị” na-echekwa aha nsọ a na-ejikarị eme ihe; “na-adịgide ruo mgbe ebighị ebi” na-agụ nke ọma n’ọnụ ma na-echekwa ịdịgide adịgide nke Greek. Akara [a] dị n’ederede isi ma kwekọọ na ndetu ala.
