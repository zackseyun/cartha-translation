id: 1PE.1.3
reference: 1 Peter 1:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: ig
  text: Ka otuto dịrị Chineke, onye bụ Nna nke Onyenwe anyị Jizọs bụ́ Mezaya[a]. Dị ka nnukwu ebere ya si dị, o mere ka a mụọ anyị ọzọ[b], ka anyị nwee olileanya dị ndụ site na mbilite n’ọnwụ Jizọs bụ́ Mezaya n’etiti ndị nwụrụ anwụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Jizọs Kraịst.” Okwu Grik bụ Χριστός pụtara “Mezaya,” ya bụ, “Onye e tere mmanụ.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsị, “o nyere anyị ọmụmụ ọhụrụ.” Ngwaa Grik ahụ na-edobe ihe atụ nke ịbụ onye a mụrụ ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Ka otuto dịrị
  rationale: Nke a bụ okwu otuto a na-eji ebido ekpere ma ọ bụ abụ otuto. Ọ na-enye echiche nke ito Chineke n’ụzọ Igbo dị ugbu a ma dịkwa nsọpụrụ, kama iji okwu ga-ada ka mmadụ na-arịọ ka a gọzie Chineke.
- source_word: θεὸς καὶ πατὴρ
  choice: Chineke, bụ́kwa Nna
  rationale: “Bụ́kwa” jikọtara aha abụọ ahụ n’otu onye ma chekwaa ma “Chineke” ma “Nna,” n’enweghị nghọtahie na a na-ekwu banyere mmadụ abụọ.
- source_word: κυρίου
  choice: Onyenwe
  rationale: “Onyenwe” bụ aha ọkwa na-egosi ikike na ọchịchị, ọ bụghị naanị okwu nkwanye ùgwù.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ́ Mezaya
  rationale: A sụgharịrị Χριστός dị ka aha ọkwa “Mezaya,” ebe “bụ́” mere ka njikọ ahụ bụrụ Igbo nkịtị ma doo anya na Mezaya bụ aha ọkwa.
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: Dị ka nnukwu ebere ya si dị
  rationale: Nke a na-echekwa echiche κατά nke ụkpụrụ ma ọ bụ oke omume ahụ kwekọrọ na ya, ma na-asụkwa Igbo eke.
- source_word: ἀναγεννήσας
  choice: o mere ka a mụọ anyị ọzọ
  rationale: Nke a na-echekwa Chineke dị ka onye mere omume ahụ, tinyekwa ihe atụ nke ịmụ mmadụ ọzọ nke dị na ngwaa Grik.
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: ka anyị nwee olileanya dị ndụ
  rationale: Nkebiokwu a na-egosi nzube ma ọ bụ ihe si n’ọmụmụ ọhụrụ ahụ pụta, ma chekwaa ihe atụ nke olileanya “dị ndụ” n’Igbo a na-aghọta ngwa ngwa.
- source_word: δι’ ἀναστάσεως
  choice: site na mbilite n’ọnwụ
  rationale: “Site na” na-egosi ụzọ ma ọ bụ ihe e ji mee omume ahụ, dịka διά tinyere genitive si eme ebe a.
- source_word: ἐκ νεκρῶν
  choice: n’etiti ndị nwụrụ anwụ
  rationale: Nke a na-egosipụta na Jizọs bilitere pụta n’etiti ndị nwụrụ anwụ, ma bụrụkwa okwu Igbo doro anya.
theological_decisions:
- issue: Ịsụgharị Χριστός dịka aha ọkwa nke metụtara Jizọs
  choice: Jizọs bụ́ Mezaya
  alternative: Jizọs Kraịst
  rationale: “Mezaya” na-eme ka ihe Χριστός pụtara dịka Onye E Tere Mmanụ pụta ìhè, kama ime ka ọ daa naanị dịka aha ọzọ.
- issue: Onye na-eme ka ọmụmụ ọhụrụ ahụ dịrị
  choice: o mere ka a mụọ anyị ọzọ
  alternative: o nyere anyị ọmụmụ ọhụrụ
  rationale: Ụdị a na-edebe Chineke dịka onye na-eme ihe n’ahịrịokwu ahụ ma na-echekwa ihe atụ nke ọmụmụ, n’ebughị usoro ozizi ọ bụla karịrị ihe ederede kwuru.
- issue: Mmekọrịta εἰς ἐλπίδα ζῶσαν na ọmụmụ ọhụrụ
  choice: ka anyị nwee olileanya dị ndụ
  alternative: banye n’olileanya dị ndụ
  rationale: “Ka anyị nwee” na-egosi ihe ọmụmụ ọhụrụ ahụ na-eweta n’Igbo eke; ọ naghị ekpebi ma εἰς bụ naanị nzube ma ọ bụ ihe si n’omume ahụ pụta.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọpụrụ ma dị mfe nghọta, dee ya. “Ka otuto dịrị” na-enye ụda okwu otuto; “bụ́kwa” na-egbochi nghọtahie na “Chineke” na “Nna” bụ mmadụ abụọ. E tinyere akara nkọwa [a] na [b] kpọmkwem n’ebe okwu ndị ha na-akọwa dị.
