revisions:
- from: Ka otuto dịrị Chineke, bụ́kwa Nna Onyenwe anyị Jizọs bụ́ Mezaya[a]. Dị ka nnukwu ebere ya si dị, o mere ka a mụọ anyị ọzọ[b], ka anyị nwee olileanya dị ndụ site na mbilite n’ọnwụ Jizọs bụ́ Mezaya n’etiti ndị nwụrụ anwụ.
  to: Ka otuto dịrị Chineke, onye bụ Nna nke Onyenwe anyị Jizọs bụ́ Mezaya[a]. Dị ka nnukwu ebere ya si dị, o mere ka a mụọ anyị ọzọ[b], ka anyị nwee olileanya dị ndụ site na mbilite n’ọnwụ Jizọs bụ́ Mezaya n’etiti ndị nwụrụ anwụ.
  rationale: The revision makes the God-and-Father relationship explicit in idiomatic Igbo and corrects the explanatory wording of footnote b. It preserves the draft’s rendering of Χριστός as “Mezaya,” divine agency in new birth, the living-hope goal, and resurrection from the dead.
