  text: Πάντων δὲ τὸ τέλος ἤγγικεν. σωφρονήσατε οὖν καὶ νήψατε ⸀εἰς προσευχάς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: ig
  text: Ma ọgwụgwụ ihe niile abịaruola nso[a]. Ya mere, nweenụ ezi uche ma mụọnụ anya maka ekpere[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘dị nso.’ Ụdị ngwaa Grik ahụ na-egosi na ọ bịaruworị nso ma nọgide na-adị nso.
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, ‘maka ekpere.’ Okwu Grik ahụ dị n’ụdị ọtụtụ; nke a pụrụ igosi ekpere ugboro ugboro karịa naanị otu ekpere.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων
  choice: ihe niile
  rationale: Nke a na-egosi ihe nile n’ozuzu ya, ma na-adaba n’ụzọ Igbo si ekwu okwu mgbe e jikọtara ya na ‘ọgwụgwụ.’
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n’ihe Pita na-ekwu, n’enweghị ime ka ọdịiche ahụ sie ike karịa ihe Grik kwuru.
- source_word: τὸ τέλος
  choice: ọgwụgwụ
  rationale: N’ebe a, τέλος na-ezo aka na njedebe nke ihe niile, ọ bụghị nanị nsonaazụ ma ọ bụ nzube ha.
- source_word: ἤγγικεν
  choice: abịaruola nso
  rationale: Ụdị perfect nke ngwaa Grik na-egosi na ihe ahụ abịaruworị nso ma nọgide na-adị nso; ‘abịaruola nso’ na-echekwa echiche abụọ ahụ n’Igbo.
- source_word: σωφρονήσατε
  choice: nwee ezi uche
  rationale: Okwu a na-akpọ ndị na-agụ ya ka ha na-eche echiche nke ọma, na-ekpebi ihe n’ụzọ ziri ezi, ma na-achịkwa onwe ha. ‘Nwee ezi uche’ bụ okwu Igbo dị ndụ nke na-ebute isi echiche ahụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi na ndụ a gwara ha ibi bụ ihe sitere n’eziokwu ahụ bụ na ọgwụgwụ abịaruola nso.
- source_word: νήψατε
  choice: mụrụ anya
  rationale: N’ebe a, νήφω bụ ihe atụ nke ịdị njikere na ịdị doo anya n’uche, ọ bụghị iwu kpọmkwem banyere mmanya. ‘Mụrụ anya’ na-egosi nchekwube ime mmụọ na uche na-adịghị agbagwoju anya.
- source_word: εἰς προσευχάς
  choice: ka unu wee nwee ike ikpe ekpere
  rationale: εἰς na-egosi ebumnuche ma ọ bụ ihe omume abụọ ahụ na-eduga na ya. Nsụgharị a na-eme ka njikọ ahụ doo anya ma na-asụ Igbo n’ụzọ eke; ‘ikpe ekpere’ nwere ike ịgụnye ekpere a na-ekpe ugboro ugboro n’agbanyeghị na Igbo anaghị achọ plural kpọmkwem ebe a.
theological_decisions:
- issue: Ike okwu gbasara ọgwụgwụ nke ‘ọgwụgwụ ihe niile’
  choice: E debere ya dịka nkwupụta doro anya na ọgwụgwụ ihe niile abịaruola nso, n’akọwaghị usoro oge ya.
  alternative: Ịsụgharị τέλος dịka ‘nzube’ ma ọ bụ ịkọwa na ọgwụgwụ ahụ emezuola kpamkpam.
  rationale: Ihe odide ahụ na-eme ka ịdị nso nke ọgwụgwụ bụrụ ntọala maka ezi uche, ịmụrụ anya, na ekpere. Nsụgharị ahụ na-echekwa ịdị ngwa ya n’etinyeghị usoro nkà mmụta okpukpe nke otu ụka.
- issue: Njikọ dị n’etiti ezi uche, ịmụrụ anya, na ekpere
  choice: E gosiri omume abụọ ahụ dịka ihe na-enyere ndị kwere ekwe aka ikpe ekpere.
  alternative: Ịgụ ha naanị dịka iwu gbasara ịchịkwa omume ma ọ bụ izere mmanya.
  rationale: εἰς προσευχάς na-ejikọta iwu abụọ ahụ na ekpere, ebe νήφω n’ebe a na-arụ ọrụ n’ụzọ ihe atụ maka nche na idoanya nke uche.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere nsọpụrụ ma dị mfe nghọta. E ji ‘nwee ezi uche’ na ‘mụrụ anya’ kewaa echiche nke σωφρονέω na νήφω n’ụzọ eke, ma zere ime ka νήφω bụrụ naanị okwu gbasara ịṅụ mmanya. A gbanwere plural προσευχάς ka ọ bụrụ akpaalaokwu Igbo ‘ikpe ekpere,’ ebe ndetu ala kọwara echiche nke ekpere ugboro ugboro.
