revisions:
- from: Ma ọgwụgwụ ihe niile abịaruola nso[a]. Ya mere, nwee ezi uche ma mụrụ anya, ka unu wee nwee ike ikpe ekpere[b].
  to: Ma ọgwụgwụ ihe niile abịaruola nso[a]. Ya mere, nweenụ ezi uche ma mụọnụ anya maka ekpere[b].
  rationale: The revision supplies plural imperative forms matching the Greek and removes the unexpressed idea of ability. It retains the direct purpose-oriented relation to prayer and corrects the footnote’s unsupported ‘various’ qualifier while preserving the relevant observation about the Greek plural.
