- from: Ma ọ bụrụ na onye ahụ na-ata ahụhụ dị ka onye Kraịst, ya emela ihere; kama, ya nye Chineke otuto n’aha a.[a]
  to: Ma ọ bụrụ na mmadụ na-ata ahụhụ dị ka onye Kraịst, ka ihere ghara ime ya; kama ka o nye Chineke otuto n’aha a.[a]
  rationale: The revision preserves the source’s conditional exhortation and its contextual implication of suffering, while replacing an ambiguous shame expression with a natural Standard Igbo construction that clearly means not being ashamed. The phrase “n’aha a” and its footnote retain the Greek wording and its interpretive openness.
