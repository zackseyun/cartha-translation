source:
  edition: SBLGNT
  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ⸀ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: ig
  text: Ma ọ bụrụ na mmadụ na-ata ahụhụ dị ka onye Kraịst, ka ihere ghara ime ya; kama ka o nye Chineke otuto n’aha a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihe a,” ma ọ bụ, “n’ihi aha a.” N’asụsụ Grik, ọ bụ kpọmkwem “n’aha a,” nke yikarịrị ka ọ na-ezo aka n’aha “onye Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: “Ma” na-egosi obere ntụgharị echiche nke δέ, ebe “ọ bụrụ na” na-edobe ọnọdụ nke εἰ n’Igbo dị mfe ma doo anya.
- source_word: ὡς Χριστιανός
  choice: dị ka onye Kraịst
  rationale: “Onye Kraịst” bụ aha e ji ama onye na-eso Kraịst n’Igbo nke oge a. Aha Χριστιανός aghọọla aha pụrụ iche, ya mere a naghị akọwaghachi ya dị ka naanị “onye na-eso Mesaịa.”
- source_word: μὴ αἰσχυνέσθω
  choice: ya emela ihere
  rationale: Nke a na-edobe iwu a na-enye onye nke atọ, ma na-eji okwu Igbo a na-asụkarị egosi na onye ahụ ekwesịghị ime ihere.
- source_word: δοξαζέτω δὲ
  choice: kama, ya nye ... otuto
  rationale: “Kama” na-eme ka ọdịiche dị n’etiti ime ihere na inye Chineke otuto pụta ìhè; “ya nye ... otuto” na-edobe ike iwu nke δοξαζέτω.
- source_word: τὸν θεόν
  choice: Chineke
  rationale: Nke a bụ ntụgharị Igbo nkịtị na nke kwụ ọtọ maka θεός n’ebe a.
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: n’aha a
  rationale: Nke a na-edobe okwu Greek ahụ n’ụzọ dị nso ma jikọta ya na aha “onye Kraịst,” n’enweghị iwepụ ohere nke nghọta ndị ọzọ.
theological_decisions:
- issue: Ihe “n’aha a” (ἐν τῷ ὀνόματι τούτῳ) na-ezo aka na ya
  choice: E debere “n’aha a,” nke yikarịrị ka ọ na-ezo aka n’aha “onye Kraịst.”
  alternative: A pụrụ ịghọta ya dịka “n’ihe a” ma ọ bụ “n’ihi aha a.”
  rationale: Χριστιανός bụ okwu nọ ya nso, ὄνομα na-apụtakarịkwa aha ma ọ bụ ihe e ji akpọ mmadụ. Ide “n’aha a” na-echekwa njikọ ahụ na mgbagwoju nghọta dị n’asụsụ Greek kama ikpebi naanị otu nkọwa.
- issue: Ngwaa e zoro ezo n’ahịrị ọnọdụ ahụ
  choice: E tinyere “na-ata ahụhụ” ka ahịrịokwu ahụ bụrụ Igbo zuru oke ma kwekọọ n’ihe amaokwu ndị gbara ya gburugburu na-ekwu.
  alternative: Ịhapụ ya dịka “ọ bụrụ na ọ bụ dị ka onye Kraịst,” nke na-adịghị ada ka Igbo ebumpụta ụwa ma nwee ike imegharị ihe Greek pụtara.
  rationale: N’asụsụ Greek, “ọ bụrụ na dị ka onye Kraịst” na-adabere n’okwu banyere ịta ahụhụ dị n’amaokwu gara aga. Igbo chọrọ ka e kwuo ngwaa ahụ iji mee ka ọnọdụ ahụ doo anya, n’enweghị ịgbakwunye echiche ọhụrụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “onye Kraịst” dịka aha a maara nke ọma, ma e debere usoro iwu “ya emela ... ya nye ...” iji gosipụta agbamume onye nke atọ.
