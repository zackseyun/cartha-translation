id: 1PE.4.13
reference: 1 Peter 4:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: ig
  text: Kama, n’ókè unu na-ekere òkè n’ahụhụ nke Mesaịa[a], ṅụrịanụ ọṅụ, ka unu wee ṅụrịakwa ọṅụ nke ukwuu n’oge mkpughe[b] nke ebube ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ahụhụ nke Kraịst.” Okwu Grik bụ Χριστός bụ utu aha nke pụtara Onye E Tere Mmanụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “mgbe e kpughere ebube ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὸ
  choice: ruo ókè
  rationale: Nke a na-egosi na ọṅụ ahụ kwekọrọ n’ókè ha si ekere òkè, kama ịsụgharị ya nanị dịka ‘mgbe’ ma ọ bụ ‘dịka.’
- source_word: κοινωνεῖτε
  choice: unu na-ekere òkè
  rationale: Ọ bụ okwu Igbo doro anya nke na-echekwa echiche nke isonye n’ihe ahụ, ọ bụghị naanị inwe ọmịiko maka ya.
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: n’ahụhụ nke Mesaịa
  rationale: Ọ na-echekwa njikọ genitive ahụ ma hapụkwa ụdị na ụzọ ndị kwere ekwe si ekere òkè n’ahụhụ ahụ n’enweghị ịkọwa ya gabiga ihe Grik kwuru.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: N’ebe a Χριστός bụ utu aha nke pụtara Onye E Tere Mmanụ; ‘Mesaịa’ na-echekwa ọrụ ya dịka utu aha ma ka bụrụ okwu ndị na-agụ Igbo maara.
- source_word: χαίρετε
  choice: ṅụrịanụ ọṅụ
  rationale: Ụdị iwu a na-akpọ ndị na-agụ akwụkwọ ka ha nwee ọṅụ ugbu a, ma na-ejikọkwa ya na χαρῆτε nke na-abịa n’azụ.
- source_word: ἵνα
  choice: ka unu wee
  rationale: Nke a na-egosi nzube ma ọ bụ nsonaazụ nke ahịrịokwu ahụ n’ụzọ Igbo na-asụkarị.
- source_word: ἀποκαλύψει
  choice: n’oge mkpughe
  rationale: ‘Mkpughe’ na-echekwa aha-nkpọaha dị na Grik ma na-arụtụ aka n’oge a ga-eme ka ebube ya pụta ìhè.
- source_word: δόξης αὐτοῦ
  choice: nke ebube ya
  rationale: Nke a bụ ntụgharị njide dị mfe ma doro anya nke na-echekwa ihe Grik kwuru.
- source_word: χαρῆτε
  choice: unu wee ṅụrịakwa ọṅụ
  rationale: Ọ na-echekwa njikọ okwu ya na χαίρετε, ebe ‘-kwa’ na-anọchi καὶ ma jikọta ọṅụ nke ugbu a na nke ga-abịa.
- source_word: ἀγαλλιώμενοι
  choice: ọṅụ nke ukwuu
  rationale: Nke a na-egosi ọṅụ siri ike na nke na-apụta ìhè n’Igbo nkịtị, n’enweghị ntụgharị okwu nke ga-ada ka ihe siri ike ma ọ bụ nke ochie.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: E jiri ‘Mesaịa’ mee ihe n’ihi na okwu Grik a na-arụ ọrụ dịka utu aha ebe a. Ihe odide ala peeji na-enye ‘Kraịst’ dịka ụzọ ọzọ a na-ahụkarị.
- issue: Ụdị isonye n’ahụhụ Mesaịa
  choice: ikere òkè n’ahụhụ nke Mesaịa
  alternative: ịta ahụhụ n’ihi Mesaịa
  rationale: Grik na-ekwu maka isonye n’ahụhụ ndị metụtara Mesaịa, ma ọ kọwaghị kpọmkwem usoro njikọ ahụ. Ya mere, a hapụrụ esemokwu nkà mmụta okpukpe ahụ n’enweghị ikwu na ọ bụ imeghachi ahụhụ mgbapụta ya ma ọ bụ naanị ahụhụ n’ihi ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta mee ihe. ‘Ruo ókè’ na-echekwa echiche nke ịdị n’ogo kwekọrọ; ‘n’oge mkpughe’ na-echekwa aha-nkpọaha Grik, ebe ihe odide ala peeji na-enye ntụgharị omume nke na-ada mfe karị n’Igbo.
