  naturalness: The wording is understandable and suitably elevated in Standard Igbo. ‘N’ókè unu na-ekere òkè’ is a slightly smoother idiomatic expression than ‘ruo ókè unu na-ekere òkè.’
  terminology: ‘Mesaịa’ appropriately preserves Χριστός as a title. ‘Mkpughe’ is an appropriate formal rendering of ἀποκάλυψις. The alternative footnote for ‘Kraịst’ is acceptable, though its explanatory wording has been made more idiomatic.
