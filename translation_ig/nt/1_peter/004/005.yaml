    reason: lexical_alternative
  revision_rationale: The revision removes an avoidable Igbo ambiguity concerning who is being answered and makes the judicial-accountability sense explicit through an idiomatic construction. It does not identify the judge beyond the Greek wording or add a doctrinal interpretation.
