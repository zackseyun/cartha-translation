  text: οἳ ἀποδώσουσιν λόγον τῷ ἑτοίμως ⸂ἔχοντι κρῖναι⸃ ζῶντας καὶ νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/005.yaml
  text: They will give an account to the one who stands ready to judge the living and the dead[a].
translation:
  language: ig
  text: Ha ga-aza ajụjụ n’ihu onye ahụ dị njikere ikpe ndị dị ndụ na ndị nwụrụ anwụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ahụ nọ na njikere ikpe.” N’ụzọ nkịtị, okwu Grik ahụ na-akọwa onye “nwere njikere ikpe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: Ha
  rationale: Nnọchiaha a na-ezo aka n’ebe ndị a kpọtụrụ aha n’amaokwu bu ụzọ nọ; “Ha” na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: ἀποδώσουσιν λόγον
  choice: ga-aza ... ajụjụ
  rationale: Nke a bụ akpaalaokwu metụtara ikpe, nke pụtara na ha ga-aza maka onwe ha ma kọwaa omume ha; okwu a họọrọ bụ Igbo doro anya ma na-edobe echiche nke ịza ajụjụ n’ihu onye ikpe.
- source_word: τῷ
  choice: onye ahụ
  rationale: Edemede Grik ya na participle so na-arụ ọrụ dị ka aha. “Onye ahụ” na-edobe ụzọ Grik si akọwa onye a n’ebughị ụzọ kpọọ ya Chineke ma ọ bụ Kraịst.
- source_word: ἑτοίμως ἔχοντι κρῖναι
  choice: dị njikere ikpe
  rationale: Nkebiokwu a na-egosi onye nọ n’ọnọdụ njikere ikpe. Nsụgharị a bụ Igbo eke ma na-edobe echiche nke njikere ozugbo.
- source_word: ζῶντας καὶ νεκρούς
  choice: ndị dị ndụ na ndị nwụrụ anwụ
  rationale: Nke a na-enye nkọwa ziri ezi ma dị nkenke banyere ìgwè abụọ ahụ niile okwu Grik gụnyere.
theological_decisions:
- issue: Onye bụ “onye ahụ dị njikere ikpe ndị dị ndụ na ndị nwụrụ anwụ”
  choice: E kpọghị ya aha kpọmkwem; e debere “onye ahụ.”
  alternative: Ịkpọ ya Chineke ma ọ bụ Kraịst/Mesaịa.
  rationale: Grik akpọghị onye ikpe ahụ aha n’amaokwu a. Agbanyeghị na akụkụ ndị ọzọ nke Agba Ọhụrụ na-ekwu maka Chineke dịka onye ikpe ma na-ekwukwa na Kraịst ga-ekpe ikpe, ịhapụ ya dịka “onye ahụ” na-edobe ihe amaokwu a kwuru na mgbagwoju anya nkà mmụta okpukpe dị na ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu, mee ihe. Nhazi “ga-aza ... ajụjụ” bụ akpaalaokwu Igbo a na-aghọta nke ọma ma na-eburu echiche ikpe dị n’isiokwu Grik.
