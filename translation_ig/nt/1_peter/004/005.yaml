review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the future judicial accounting, the unnamed judge, readiness to judge, and the comprehensive phrase “the living and the dead.” However, “Ha ga-aza onye ahụ ... ajụjụ” naturally means that they will answer a question asked by that person, rather than that they will render an account before the judge.
  naturalness: “Ha ga-aza ajụjụ n’ihu onye ahụ ...” is natural Standard Igbo in a judicial context and clearly expresses accountability before the judge.
  terminology: “ndị dị ndụ na ndị nwụrụ anwụ” is accurate and suitably established in register. “onye ahụ” properly leaves the judge unidentified, as in the Greek.
  issues:
  - severity: medium
    issue: Placement and government of “ajụjụ” in the main text
    rationale: In the draft, “aza onye ahụ ... ajụjụ” can be understood as answering the judge’s question. Moving “ajụjụ” directly after “aza” and using “n’ihu” expresses the Greek idiom ἀποδώσουσιν λόγον as rendering an account before someone.
  revised_text: Ha ga-aza ajụjụ n’ihu onye ahụ dị njikere ikpe ndị dị ndụ na ndị nwụrụ anwụ[a].
  revised_footnotes:
