id: 1PE.4.6
reference: 1 Peter 4:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: ig
  text: 'N’ihi na ọ bụ maka nke a ka e kwusakwara ndị nwụrụ anwụ[a] ozi ọma: ka e wee kpee ha ikpe n’anụ ahụ n’ụzọ ụmụ mmadụ[b], ma ka ha wee dị ndụ na mmụọ n’ụzọ Chineke[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ bụ ‘ndị nwụrụ anwụ.’ Amaokwu a anaghị akọwa ma ha bụ ndị nụrụ ozi ọma mgbe ha ka dị ndụ ma nwụọ emesịa, ndị nwụrụ anwụ n’ụzọ ọzọ, ma ọ bụ ndị ọzọ a na-ekwu maka ha.
    reason: theological_ambiguity
  - marker: b
    text: Ma ọ bụ ‘dịka ụkpụrụ mmadụ si dị’ ma ọ bụ ‘n’echiche ụmụ mmadụ.’ Okwu Grik ahụ ekwughị na ọ bụ ụmụ mmadụ n’onwe ha kpeere ha ikpe.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ ‘n’ime mmụọ.’ O nwere ike ịpụta ọnọdụ ndụ ime mmụọ nke dị iche na ndụ anụ ahụ; ụfọdụ na-aghọta ya dịka ndụ site na Mmụọ Nsọ.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ
  choice: N’ihi na ọ bụ maka nke a
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru tupu ya ma na-egosi na ihe na-esonụ bụ nkọwa nke ihe mere e ji kwusaa ozi ọma.
- source_word: νεκροῖς
  choice: ndị nwụrụ anwụ
  rationale: Ọ bụ adjective dative plural e ji mee aha; nsụgharị a bụ nke nkịtị ma ọ naghị akọwapụta mgbe ma ọ bụ n’ụzọ dị aṅaa ha si bụrụ ndị nwụrụ anwụ.
- source_word: εὐηγγελίσθη
  choice: e kwusakwara ... ozi ọma
  rationale: Passive nke εὐαγγελίζω; okwu a na-egosi ikwusa ozi ọma n’asụsụ Igbo doro anya ma dị ugwu.
- source_word: ἵνα
  choice: ka e wee
  rationale: Ọ na-egosi ebumnuche ma ọ bụ ihe a tụrụ anya na ọ ga-esi na ya pụta.
- source_word: κριθῶσι μὲν ... ζῶσι δὲ
  choice: ka e wee kpee ha ikpe ... ma ha adịrị ndụ
  rationale: E chekwara usoro ọdịiche μὲν...δὲ na passive nke κριθῶσι, na-enweghị ime ka ikpe ahụ bụrụ naanị ikpe mmadụ, ọnwụ anụ ahụ, ma ọ bụ ikpe Chineke.
- source_word: κατὰ ἀνθρώπους
  choice: dịka ụmụ mmadụ si ekpe ikpe
  rationale: κατά na accusative na-egosi ụkpụrụ ma ọ bụ echiche e ji ele ihe anya; ‘ụmụ mmadụ’ bụ okwu gụnyere mmadụ niile ma na-emegide ‘Chineke.’
- source_word: σαρκί
  choice: n’anụ ahụ
  rationale: N’ebe a σάρξ na-ezo aka n’ọnọdụ ndụ nke anụ ahụ, ọ bụghị kpọmkwem ‘ọdịdị mmehie’; a chekwara ọdịiche ya na πνεύματι.
- source_word: κατὰ θεὸν
  choice: dịka Chineke si chọọ
  rationale: Ọ na-enye Igbo sitere n’okike maka ibi ndụ n’ụzọ kwekọrọ n’ụkpụrụ ma ọ bụ echiche Chineke, ma na-echekwa ọdịiche dị n’etiti ụmụ mmadụ na Chineke.
- source_word: πνεύματι
  choice: na mmụọ
  rationale: Dative a nwere ike igosi ọnọdụ ma ọ bụ akụkụ ndụ ime mmụọ; isi okwu ahụ n’onwe ya ekwughị hoo haa na ọ bụ Mmụọ Nsọ.
theological_decisions:
- issue: Ndị ‘nwụrụ anwụ’ bụ ndị ònye?
  choice: A sụgharịrị ya nanị dịka ‘ndị nwụrụ anwụ,’ n’akọwaghị ma ha anwụọla mgbe e kwusara ha ozi ọma ma ọ bụ na a na-ekwu maka ọnọdụ ime mmụọ.
  alternative: Ndị dị ndụ mgbe ha nụrụ ozi ọma ma nwụọ mgbe e mesịrị; ndị nwụrụ anwụ n’ime mmụọ; ma ọ bụ ndị metụtara nkwusa nke Kraịst e kwuru na 3:19.
  rationale: Ihe Grik kwuru nwere nnukwu esemokwu n’ụzọ e si akọwa ya. Nsụgharị ahụ echekwala okwu ahụ n’enweghị itinye nkọwa ozizi n’ime amaokwu ahụ.
- issue: Ọdịiche dị n’etiti ikpe ‘n’anụ ahụ’ na ndụ ‘na mmụọ’
  choice: E chekwara ọdịiche dị n’etiti otú ụmụ mmadụ si ekpe ikpe n’ọnọdụ anụ ahụ na ibi ndụ dịka Chineke si chọọ na mmụọ.
  alternative: Ikpe mmadụ n’oge ndụ anụ ahụ; ọnwụ anụ ahụ dịka ikpe; ma ọ bụ ikpe Chineke nke metụtara anụ ahụ ma ndụ na-aga n’ihu na mmụọ.
  rationale: Amaokwu ahụ anaghị ekpebi otu n’ime nkọwa ndị a kpamkpam; ya mere, nsụgharị ahụ anaghị emechi esemokwu ahụ.
- issue: Ma πνεύματι ọ̀ bụ mmụọ mmadụ ka ọ bụ Mmụọ Nsọ
  choice: E jiri ‘mmụọ’ obere mkpụrụedemede mee ihe, n’enweghị ịkọwapụta onye ọ bụ.
  alternative: ‘site na Mmụọ Nsọ’ ma ọ bụ ‘n’ime Mmụọ Nsọ.’
  rationale: Dative ahụ yiri σαρκί n’usoro ya ma nwee ike igosi ọnọdụ ndụ ime mmụọ. Ihe odide ahụ anaghị akpọ Mmụọ Nsọ aha hoo haa.
translation_notes:
  register: E jiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘N’anụ ahụ’ na ‘na mmụọ’ na-echekwa ọdịiche nke σαρκί/πνεύματι, ebe ‘ụmụ mmadụ’ na-enye echiche gụnyere mmadụ niile kama ịkpa oke nwoke.
