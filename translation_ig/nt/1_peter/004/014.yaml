reference: 1 Peter 4:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ, μακάριοι, ὅτι τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα ἐφ’ ὑμᾶς ⸀ἀναπαύεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/014.yaml
  text: If you are insulted in the name of Messiah[a], you are blessed[b], because the Spirit of glory and of God rests upon you.
translation:
  language: ig
  text: Ọ bụrụ na a na-akparị unu n’aha Mesaịa[a], ngọzi na-adịrị unu, n’ihi na Mmụọ nke ebube na nke Chineke[b] na-ezu ike n’elu unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, “Kraịst”; ebe a, a sụgharịrị ya “Mesaịa” n’ihi na Χριστός bụ utu aha nke pụtara Onye E Tere Mmanụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Mmụọ Chineke ahụ dị ebube”; ma ọ bụ, “Mmụọ nke ebube, ya bụ, Mmụọ nke Chineke.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: a na-akparị unu
  rationale: Nke a na-egosi na ndị ọzọ na-aga n’ihu na-ekwujọ ma na-eweda ha ala. “Ịkparị” bụ okwu Igbo dị ugbu a nke na-egosipụta mkparị na mmechuihu n’ụzọ doro anya.
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: n’ihi aha Mesaịa
  rationale: N’ebe a, nkebiokwu ahụ na-egosi mkpagbu a na-enweta n’ihi njikọ mmadụ na aha na onye Mesaịa bụ. “N’ihi aha” na-eme ka ihe ọ pụtara doo anya n’Igbo ma ka na-edebe “aha” dị n’asụsụ Grik.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: Χριστός bụ utu aha nke pụtara Onye E Tere Mmanụ. “Mesaịa” na-edebe ọrụ ya dị ka utu aha kama ime ya naanị aha mmadụ.
- source_word: μακάριοι
  choice: ngọzi na-adịrị unu
  rationale: Nkebiokwu a na-edebe ịdị arọ nke okwu ngọzi n’okwukwe ma na-ada ka Igbo e ji ekwu okwu taa; ọ pụtaghị naanị inwe obi ụtọ.
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: Mmụọ nke ebube na nke Chineke
  rationale: Nsụgharị a na-edebe usoro genitive abụọ nke Grik ma ghara ikpebi ma “nke Chineke” hà na-akọwa “nke ebube” ọzọ, ka ha abụọ hà bụ nkọwa abụọ kwekọrọ ekwekọ gbasara otu Mmụọ ahụ.
- source_word: δόξης
  choice: ebube
  rationale: “Ebube” bụ okwu Igbo a na-ejikarị egosipụta ịdị ukwuu na ọnụnọ dị ebube nke Chineke.
- source_word: ἀναπαύεται
  choice: na-ezu ike n’elu unu
  rationale: Nke a na-edebe ihe onyonyo nke Mmụọ na-ezu ike ma ọ bụ na-anọkwasị n’elu mmadụ, nke kwekọrọ n’ụzọ e si eji okwu ahụ eme ihe n’Akwụkwọ Nsọ.
theological_decisions:
- issue: Otu a ga-esi ghọta τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: Mmụọ nke ebube na nke Chineke
  alternative: Mmụọ Chineke ahụ dị ebube; ma ọ bụ, Mmụọ nke ebube, ya bụ, Mmụọ nke Chineke
  rationale: Asụsụ Grik dị mkpụmkpụ ma nwee ike ịpụta na “nke ebube” na “nke Chineke” bụ nkọwa abụọ gbasara Mmụọ ahụ, ma ọ bụ na nke abụọ na-akọwa nke mbụ. Isi okwu ahụ na-edebe ohere abụọ ahụ kama ịhọrọ otu n’ime ha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Ngọzi na-adịrị unu” na-enye ụda yiri okwu ngọzi Akwụkwọ Nsọ, ebe “a na-akparị unu” na-egosipụta mkparị a na-aga n’ihu. E zere ịgbakwunye “Nsọ” n’aha Mmụọ n’ihi na okwu ahụ adịghị kpọmkwem n’amaokwu Grik.
