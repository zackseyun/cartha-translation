- from: ka onye ahụ wee ghara ibi oge fọdụrụ ya n’anụ ahụ maka ọchịchọ ụmụ mmadụ[a], kama ka o bie ya maka uche Chineke.
  to: ka onye ahụ wee ghara ịdị na-ebi oge fọdụrụ ya n’anụ ahụ n’ịgbaso ọchịchọ ụmụ mmadụ[a], kama n’ime uche Chineke.
  rationale: 'The revision restores the Greek''s single purpose construction and its direct contrast: the remaining embodied life is no longer to be lived in pursuit of human desires but in doing God''s will. The footnote anchor and its lexical clarification are retained, with only punctuation normalized.'
  reviewer_model: gpt-5.6-terra
