id: 1PE.4.2
reference: 1 Peter 4:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς τὸ μηκέτι ἀνθρώπων ἐπιθυμίαις ἀλλὰ θελήματι θεοῦ τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: ig
  text: ka onye ahụ wee ghara ịdị na-ebi oge fọdụrụ ya n’anụ ahụ n’ịgbaso ọchịchọ ụmụ mmadụ[a], kama n’ime uche Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “oge fọdụrụ ya n’ahụ.” N’ebe a, okwu Grik a sụgharịrị “n’anụ ahụ” na-ezo aka ná ndụ mmadụ n’ahụ n’ụwa; ọ pụtaghị kpọmkwem “ọdịdị mmehie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸ
  choice: ka ... wee
  rationale: Usoro a na-egosi nzube ma ọ bụ ihe si n'okwu amaokwu gara aga pụta; “ka ... wee” na-enye nke a n'Igbo nkịtị.
- source_word: μηκέτι
  choice: ghara ... ọzọ
  rationale: Ọ na-egosi na a kwụsịrị ụzọ ndụ gara aga.
- source_word: ἀνθρώπων
  choice: ụmụ mmadụ
  rationale: Ọ bụ okwu gbasara mmadụ niile, ọ bụghị naanị ndị nwoke.
- source_word: ἐπιθυμίαις
  choice: ọchịchọ
  rationale: “Ọchịchọ” sara mbara karịa okwu metụtara agụụ mmekọahụ naanị, ma dabara n'ọnọdụ a.
- source_word: ἀλλὰ
  choice: kama
  rationale: Ọ na-eme ka ọdịiche siri ike dị n'etiti ọchịchọ ụmụ mmadụ na uche Chineke.
- source_word: θελήματι θεοῦ
  choice: maka uche Chineke
  rationale: Ọ na-egosi ihe kwesịrị ịchị ma duzie ndụ mmadụ, ma debe usoro ntụnyere nke ahịrịokwu ahụ.
- source_word: τὸν ἐπίλοιπον ... χρόνον
  choice: oge fọdụrụ ya
  rationale: Nke a na-egosipụta oge ndụ nke onye ahụ ka dị, dịka isiokwu otu onye sitere n'amaokwu gara aga.
- source_word: ἐν σαρκὶ
  choice: n’anụ ahụ
  rationale: N'ebe a, okwu ahụ na-ezo aka ná ndụ mmadụ n'ahụ n'ụwa, ọ bụghị kpọmkwem n'ọdịdị mmehie.
- source_word: βιῶσαι
  choice: ibi ... ka o bie ya
  rationale: “Ibi” bụ ụzọ Igbo doro anya isi kwuo ibi ma ọ bụ iji oge ndụ mee ihe.
theological_decisions:
- issue: Ihe σάρξ pụtara na ἐν σαρκὶ
  choice: ndụ mmadụ n’anụ ahụ n’ụwa
  alternative: ọdịdị mmehie
  rationale: Ihe gbara okwu a gburugburu na-ekwu maka oge ndụ onye kwere ekwe ka fọdụrụ n'ahụ; ọ bụghị aha e nyere ike mmehie dị n'ime mmadụ. Nsụgharị a na-edebe ọdịiche ahụ n'enweghị ịmanye nkọwa ozizi ọzọ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “onye ahụ” debe njikọ ya na onye otu e kwuru n'amaokwu gara aga; e jiri “n’anụ ahụ” mee ka echiche ndụ n'ahụ doo anya, ebe nkọwa ala peeji na-echekwa okwu na nkọwa ọzọ.
