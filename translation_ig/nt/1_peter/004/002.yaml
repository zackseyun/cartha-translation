    reason: lexical_alternative
  revision_rationale: 'The revision restores the Greek''s single purpose construction and its direct contrast: the remaining embodied life is no longer to be lived in pursuit of human desires but in doing God''s will. The footnote anchor and its lexical clarification are retained, with only punctuation normalized.'
