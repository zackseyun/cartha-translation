lexical_decisions:
- source_word: φιλόξενοι
  choice: Na-anabatakwanụ … dị ka ndị ọbịa
  rationale: Adjective a na-arụ ọrụ dị ka iwu n’ebe a. Igbo ji nkebiokwu a kwuo omume ile ọbịa nke ọma n’ụzọ doro anya ma dịrị ndị na-agụ ugbu a mfe.
- source_word: εἰς ἀλλήλους
  choice: ibe unu
  rationale: Nke a na-echekwa echiche nke omume a na-eme n’etiti ndị otu okwukwe n’otu n’otu.
- source_word: ἄνευ
  choice: n’emeghị
  rationale: Ọ na-egosi na a ga-eme omume ahụ ma omume ọzọ a kpọrọ aha adịghị ya.
- source_word: γογγυσμοῦ
  choice: ntamu
  rationale: “Ntamu” na-egosi mkpesa a na-ekwu n’obi adịghị mma ma ọ bụ n’olu dị ala, karịsịa n’ihe gbasara ibu ọrụ ile ọbịa.
