revisions:
- from: Na-anabatakwanụ ibe unu dị ka ndị ọbịa n’emeghị ntamu.[a]
  to: Na-anabatanụ ibe unu ọbịa n’enweghị ntamu.[a]
  rationale: The revision uses the idiomatic Standard Igbo expression “na-anabata mmadụ ọbịa” for showing hospitality, preserves the reciprocal force of εἰς ἀλλήλους with “ibe unu,” and renders ἄνευ γογγυσμοῦ naturally as “n’enweghị ntamu.” The footnote now preserves the same hospitality sense while offering “mkpesa” as a lexical alternative for “ntamu.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:16:46Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the imperative, reciprocity, and absence of grumbling. However, “dị ka ndị ọbịa” means ‘as guests’ and shifts φιλόξενοι away from the sense of extending hospitality.
  naturalness: “Na-anabatanụ ibe unu ọbịa” is a natural Standard Igbo expression for mutual hospitality. “N’enweghị ntamu” is clear and suitably idiomatic.
  terminology: “Ọbịa” accurately retains the hospitality/guest-reception domain of φιλόξενοι, and “ntamu” suitably renders γογγυσμός as discontented grumbling.
  issues:
  - severity: medium
    issue: The phrase “dị ka ndị ọbịa” misstates the hospitality relation.
    rationale: The Greek calls believers to be hospitable toward one another, not to receive one another ‘as guests.’ Removing this phrase and using the idiom “na-anabata ... ọbịa” restores the intended sense.
  - severity: medium
    issue: The footnote’s proposed alternative changes the meaning to general care for one another.
    rationale: “Na-elekọtanụ ibe unu” does not preserve the specific hospitality sense of φιλόξενοι. The alternative should retain hospitality and vary only γογγυσμός as ‘mkpesa.’
  revised_text: Na-anabatanụ ibe unu ọbịa n’enweghị ntamu.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Na-anabatanụ ibe unu ọbịa n’enweghị mkpesa.”
    reason: lexical_alternative
  revision_rationale: The revision uses the idiomatic Standard Igbo expression “na-anabata mmadụ ọbịa” for showing hospitality, preserves the reciprocal force of εἰς ἀλλήλους with “ibe unu,” and renders ἄνευ γογγυσμοῦ naturally as “n’enweghị ntamu.” The footnote now preserves the same hospitality sense while offering “mkpesa” as a lexical alternative for “ntamu.”
