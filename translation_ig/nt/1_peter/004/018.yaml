id: 1PE.4.18
reference: 1 Peter 4:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ⸀ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: ig
  text: Ma ọ bụrụ na a na-azọpụta onye ezi omume naanị n’ụzọ siri ike[a], olee ebe onye na-adịghị asọpụrụ Chineke na onye mmehie ga-apụta[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “a na-azọpụta ya na nnukwu ihe isi ike” ma ọ bụ “a na-azọpụta ya naanị n’ụzọ siri ike.” N’ebe a, okwu ahụ na-elekwasị anya n’ihe isi ike na ahụhụ onye ezi omume na-agabiga ka a na-azọpụta ya; ọ pụtaghị n’onwe ya na nzọpụta ahụ ejighị n’aka.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “olee ebe a ga-ahụ onye na-adịghị asọpụrụ Chineke na onye mmehie?”
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιος
  choice: onye ezi omume
  rationale: Ọ bụ nkọwaaha e ji dị ka aha, dị n’otu onye, nke na-anọchite anya onye ọ bụla bụ onye ezi omume. Nhọrọ a bụ Igbo nkịtị ma na-edobe ụdị otu onye nke Grik.
- source_word: μόλις
  choice: n'ụzọ siri ike
  rationale: Okwu a na-egosi ihe e ji nnukwu ihe isi ike mee ma ọ bụ ihe fọrọ obere ka ọ ghara ime. ‘N'ụzọ siri ike’ na-egosipụta isi ihe banyere ihe isi ike n’enweghị ịkọwa na nzọpụta n’onwe ya ejighị n’aka.
- source_word: σῴζεται
  choice: a na-azọpụta
  rationale: Ụdị ngwaa dị ugbu a nke na-anabata omume. ‘A na-azọpụta’ bụ okwu Igbo doro anya nke na-edobekwa echiche nke usoro na-aga n’ihu nke ụdị Grik nwere ike igosi.
- source_word: ἀσεβής
  choice: onye na-adịghị asọpụrụ Chineke
  rationale: Ọ na-egosi onye na-enweghị nsọpụrụ kwesịrị ekwesị n’ebe Chineke nọ. Nkọwa a bụ nke nghọta ya doro ndị na-agụ Igbo anya, ma e jikọtaghị ya na ‘onye mmehie.’
- source_word: ἁμαρτωλός
  choice: onye mmehie
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa onye mmehie, ma ọ na-edobe ya iche n’okwu ἀσεβής.
- source_word: ποῦ
  choice: olee ebe
  rationale: Ọ bụ ntụgharị ajụjụ ebe kpọmkwem, nke na-edobe ike ajụjụ nkwupụta ahụ.
- source_word: φανεῖται
  choice: ga-apụta
  rationale: 'Ọ na-edobe ihe ρήμα Grik pụtara n’ụzọ kwụ ọtọ: ịpụta ma ọ bụ ịbụ onye a hụrụ. Ọ na-edobekwa ụda ajụjụ ahụ yiri ilu.'
theological_decisions:
- issue: Ihe μόλις σῴζεται pụtara
  choice: E gosipụtara na nzọpụta onye ezi omume na-abịa n'ụzọ siri ike n’etiti ahụhụ na ikpe, n’enweghị ikwu na njedebe nzọpụta ya ejighị n’aka.
  alternative: Ịsị na ọ fọrọ obere ka a ghara ịzọpụta onye ezi omume, dị ka à ga-asị na nzọpụta ikpeazụ ya ejighị n’aka.
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-ekwu maka ahụhụ, ikpe nke malitere n’ụlọ Chineke, na ntachi obi. Ya mere, ‘n'ụzọ siri ike’ na-edobe esemokwu dị n’okwu Grik ma ọ naghị ebubata ozizi na-adịghị n’amaokwu ahụ.
- issue: Otu onye nwoke na-anọchite anya mmadụ niile
  choice: Jiri ‘onye ezi omume’ dị n’otu onye.
  alternative: ‘Ndị ezi omume’ ma ọ bụ nkọwa gbasaa nke na-adịghị n’otu onye.
  rationale: Grik ji otu onye nwoke mee ihe n’ụzọ nnọchiteanya. Igbo ‘onye ezi omume’ na-edobe ụdị ilu ahụ n’enweghị ime ka ọ bụrụ naanị nwoke.
- issue: Mmekọrịta ἀσεβής na ἁμαρτωλός
  choice: 'Debe ha dị ka nkọwa abụọ: ‘onye na-adịghị asọpụrụ Chineke’ na ‘onye mmehie.’'
  alternative: Ijikọta ha ka ha bụrụ otu aha, dịka ‘onye ajọ omume.’
  rationale: Grik jikọtara nkọwa abụọ dị iche iche; idebe ha abụọ na-echekwa ịdị arọ na usoro okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ụdị ajụjụ yiri ilu, ụdị otu onye nke Grik, na ọdịiche dị n’etiti onye na-adịghị asọpụrụ Chineke na onye mmehie.
