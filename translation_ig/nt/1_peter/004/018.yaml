revisions:
- from: Ma ọ bụrụ na a na-azọpụta onye ezi omume n'ụzọ siri ike[a], olee ebe onye na-adịghị asọpụrụ Chineke na onye mmehie ga-apụta[b]?
  to: Ma ọ bụrụ na a na-azọpụta onye ezi omume naanị n’ụzọ siri ike[a], olee ebe onye na-adịghị asọpụrụ Chineke na onye mmehie ga-apụta[b]?
  rationale: The revision is limited to making the restrictive force of μόλις explicit in the text and refining its footnote alternatives. It retains the Greek present passive, the source’s singular representative form, the two distinct descriptors for the unrighteous, and the rhetorical “where will ... appear?” without resolving the verse’s theological tension.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:17:19Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the conditional rhetorical question, the representative singular expressions, the distinction between ἀσεβής and ἁμαρτωλός, and the future force of φανεῖται. Adding naanị (“only”) to the main clause better represents μόλις, which denotes salvation occurring only with difficulty/scarcely.
  naturalness: The sentence is clear Standard Igbo and suitably formal. “Naanị n’ụzọ siri ike” makes the intended restrictive force more explicit while retaining a natural proverbial cadence. The revised footnote gives idiomatic Igbo alternatives without implying a doctrinal conclusion beyond the verse.
  terminology: “Onye ezi omume,” “onye na-adịghị asọpụrụ Chineke,” and “onye mmehie” are accurate, distinct, and appropriate theological terms in modern Standard Igbo. “A na-azọpụta” appropriately renders the present passive in this generic statement.
  issues:
  - severity: low
    issue: The main text’s “n’ụzọ siri ike” does not fully make explicit the restrictive/scarcely force of μόλις.
    rationale: While it conveys difficulty, μόλις more specifically means “only/scarcely/with difficulty.” Adding naanị preserves that nuance without overinterpreting the verse.
  - severity: low
    issue: Footnote a’s proposed wording “ọ fọrọ obere ka a ghara ịzọpụta ya” can sound as though the person was almost not saved.
    rationale: This is a possible way to express “barely,” but “a na-azọpụta ya naanị n’ụzọ siri ike” and “a na-azọpụta ya na nnukwu ihe isi ike” more directly express the lexical alternatives and better preserve the source’s ambiguity.
