id: 1PE.4.12
reference: 1 Peter 4:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: ig
  text: Ndị m hụrụ n’anya, unu ejula anya n’ọnwụnwa ahụ dị ka ọkụ nke na-eme n’etiti unu iji nwalee unu, dị ka a ga-asị na ihe ọhụrụ na-eme unu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Ndị m hụrụ n’anya
  rationale: This is the natural, warm Standard Igbo vocative for people dearly loved, fitting Peter’s pastoral address.
- source_word: μὴ ξενίζεσθε
  choice: ya ejula unu anya
  rationale: This idiomatic Igbo expression means ‘do not be surprised’ and also permits a conceptual echo with ‘ihe iju anya’ later in the sentence.
- source_word: πυρώσει
  choice: oké ahụhụ dị ka ọkụ
  rationale: This conveys a severe ordeal while retaining the Greek image of burning or fire without implying that literal flames are necessarily in view.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: The phrase presents the ordeal as occurring among the addressed community, while not excluding the experience of its individual members.
- source_word: πρὸς πειρασμόν
  choice: iji nwalee unu
  rationale: In this context the ordeal proves or tests them; the purpose construction is natural Igbo and does not suggest enticement to sin.
- source_word: γινομένῃ
  choice: na-eme
  rationale: The progressive Igbo form reflects the ongoing occurrence expressed by the Greek present participle.
- source_word: ὡς ξένου
  choice: dị ka a ga-asị na ihe iju anya
  rationale: This naturally expresses treating the event as strange or unexpected and echoes the earlier wording for surprise.
- source_word: συμβαίνοντος
  choice: na-eme unu
  rationale: This concise expression communicates an event happening to or befalling the audience.
theological_decisions:
- issue: Nature of πειρασμός in context
  choice: nnwale (testing)
  alternative: ọnwụnwa (temptation or trial)
  rationale: The surrounding discussion concerns suffering as a proving ordeal, not enticement to evil. ‘Nnwale’ clearly communicates testing while the footnote preserves the broader lexical range.
- issue: Force of the fire imagery in πυρώσει
  choice: oké ahụhụ dị ka ọkụ
  alternative: ọkụ / nnwale ọkụ
  rationale: The chosen wording preserves the vivid fire comparison but avoids forcing a literal burning or an explicitly refining-fire interpretation not stated in the verse.
translation_notes:
  register: Natural, current Standard Igbo in a dignified pastoral register. The rendering retains the communal setting, ongoing aspect, fire imagery, and the Greek rhetorical link between being surprised and regarding an event as strange.
