    text: A pụkwara ịsụgharị ya, “ọnwụnwa ọkụ nke na-eme n’etiti unu ... maka nnwale.” Okwu Grik bụ πυρώσει na-akpọta echiche nke ọkụ ma ọ bụ ihe na-ere; πειρασμός nwekwara ike ịpụta “nnwale,” “ọnwụnwa,” ma ọ bụ, n’ọnọdụ ndị ọzọ, “ịnwa mmadụ ka o mee ihe ọjọọ.”
    reason: Preserves the literal fire imagery of πυρώσει and explains the contextual lexical range of πειρασμός.
  revision_rationale: The revision more closely reflects πυρώσει as a fire-imaged ordeal, retains the purpose of testing, and renders ξένου as an unfamiliar or unexpected occurrence rather than an astonishing one. It also improves the negative imperative in natural Standard Igbo. The footnote anchor remains at the fire-imagery phrase.
