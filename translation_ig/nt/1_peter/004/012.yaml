review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the ordeal as ongoing, communal, fire-imaged suffering intended for testing. However, “oké ahụhụ dị ka ọkụ” inserts “suffering” where πυρώσει is more directly a fiery burning/ordeal, and the final “ihe iju anya” chiefly means an astonishing thing rather than the Greek sense of something strange, unfamiliar, or unexpected.
  naturalness: The address and overall sentence are understandable, but “ya ejula unu anya” is less direct than the natural prohibitive “unu ejula anya,” and “ihe ọhụrụ” is a more idiomatic contextual rendering for an event treated as unfamiliar or unexpected.
  terminology: “Ndị m hụrụ n’anya” and “nnwale” are appropriate. “ọnwụnwa dị ka ọkụ” retains the trial/ordeal sense and fire imagery without adding a specific refining interpretation. The footnote should use “ọnwụnwa” for πειρασμός and clarify its contextual sense.
  issues:
  - severity: medium
    issue: The rendering of πυρώσει adds “oké ahụhụ.”
    rationale: The Greek evokes a burning or fiery ordeal; although suffering is contextual, “oké ahụhụ” narrows and adds a lexical element not explicitly present. “ọnwụnwa dị ka ọkụ” is closer while remaining natural.
  - severity: medium
    issue: “ihe iju anya” does not adequately render ξένου.
    rationale: The Greek term means strange, foreign, or unfamiliar. It is linked rhetorically to the preceding prohibition against surprise, but it does not specifically mean something astonishing. “ihe ọhụrụ” naturally conveys an unfamiliar/unexpected occurrence in this context.
  - severity: low
    issue: The negative imperative wording can be more idiomatic.
    rationale: “Unu ejula anya” is a clear, natural Standard Igbo prohibition and does not require the initial “ya.”
  revised_text: Ndị m hụrụ n’anya, unu ejula anya n’ọnwụnwa ahụ dị ka ọkụ nke na-eme n’etiti unu iji nwalee unu, dị ka a ga-asị na ihe ọhụrụ na-eme unu.
  revised_footnotes:
