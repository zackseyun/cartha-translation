id: 1PE.4.17
reference: 1 Peter 4:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: ig
  text: N’ihi na oge eruola ka ikpe malite site n’ezinụlọ Chineke[a]; ma ọ bụrụ na ọ malite ibu ụzọ site n’ebe anyị nọ, gịnị ga-abụ ọgwụgwụ[b] ndị na-enupụrụ oziọma Chineke isi[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ụlọ Chineke.” Okwu Grik οἶκος nwere ike ịpụta “ụlọ” ma ọ bụ “ezinụlọ”; n’ebe a, o yikarịrị ka ọ na-ekwu banyere ndị Chineke dịka ezinụlọ ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “gịnị ga-abụ ihe ga-esi na ya pụta?” Okwu Grik τέλος nwere ike ịpụta “ọgwụgwụ,” “njedebe,” ma ọ bụ “ihe ga-esi na ya pụta.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “ndị na-ajụ ikwere n’oziọma Chineke,” n’ihi na okwu Grik ahụ nwere ike ịpụta ma nnupụisi ma ekweghị ekwe mgbe mmadụ na-azaghachi oziọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Njikọ a na-enye ihe kpatara okwu dị n’amaokwu bu ụzọ; “N’ihi na” na-egosipụta ọrụ ahụ nke ọma n’Igbo.
- source_word: ὁ καιρός
  choice: oge eruola
  rationale: καιρός bụ oge kwesịrị ekwesị ma ọ bụ oge a kara aka, ọ bụghị naanị oge na-agafe; “oge eruola” na-ebute echiche ahụ n’ụzọ Igbo si ada.
- source_word: τοῦ ἄρξασθαι τὸ κρίμα
  choice: ka ikpe malite
  rationale: Nke a na-egosipụta infinitive ahụ dị ka ihe oge ahụ bụ maka ya, ma na-anọgide n’Igbo doro anya.
- source_word: κρίμα
  choice: ikpe
  rationale: '“Ikpe” na-echekwa obosara okwu Grik ahụ: omume Chineke nke ikpe ikpe, na-enweghị ime ya naanị ntaramahụhụ ikpeazụ ma ọ bụ naanị ịdọ aka ná ntị.'
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: n’ezinụlọ Chineke
  rationale: οἶκος nwere ike ịbụ ụlọ ma ọ bụ ezinụlọ. N’ebe a, “n’ezinụlọ Chineke” na-egosi ndị Chineke dịka obodo ya; n’Igbo, mmalite “n’ebe” pụtara ìhè site n’usoro ahịrịokwu dum.
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: ma ọ bụrụ na ọ ga-ebu ụzọ malite n’ebe anyị nọ
  rationale: E webatara “ọ ga-…malite” site n’ahịrịokwu gara aga ka Igbo doo anya; “n’ebe anyị nọ” na-echekwa echiche ἀπό nke na-egosi ebe mmalite.
- source_word: τέλος
  choice: ọgwụgwụ
  rationale: “Ọgwụgwụ” bụ okwu Igbo nkịtị nke nwere ike ịpụta njedebe ma ọ bụ ihe ikpeazụ ga-esi n’ihe pụta; ndetu ala na-egosi ụzọ ọzọ “ihe ga-esi na ya pụta.”
- source_word: ἀπειθούντων
  choice: ndị na-enupụrụ ... isi
  rationale: Okwu a nwere echiche nke nnupụisi nakwa ịjụ ikwere mgbe a na-azaghachi oziọma; “na-enupụrụ ... isi” na-echekwa ike omume ahụ.
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: oziọma Chineke
  rationale: Nke a na-echekwa oziọma ahụ dịka nke si n’aka Chineke ma ọ bụ nke bụ nke ya, n’ụdị okwu Ndị Kraịst Igbo maara nke ọma.
theological_decisions:
- issue: Ụdị κρίμα metụtara ndị Chineke
  choice: A sụgharịrị ya “ikpe” n’akọwaghị ya dịka ikpe ọmụma ma ọ bụ ịdọ aka ná ntị naanị.
  alternative: “ikpe ọmụma” ma ọ bụ “ịdọ aka ná ntị”
  rationale: '“Ikpe” na-ahapụ esemokwu dị n’amaokwu ahụ ka ọ dị: omume ikpe Chineke na-amalite n’etiti ndị nke ya, ebe ọgwụgwụ nke ndị na-enupụrụ oziọma isi ka na-egosi ịdị njọ karị.'
- issue: Ndị οἶκος τοῦ θεοῦ na-ezo aka na ha
  choice: E gosipụtara ya dịka “ezinụlọ Chineke,” ya bụ, ndị Chineke.
  alternative: “ụlọ Chineke,” nke nwere ike ịpụta ụlọ nsọ ma ọ bụ ụlọ ofufe
  rationale: “N’ebe anyị nọ” nke so ya na-akwado na ihe a na-ekwu bụ ndị mmadụ dịka obodo Chineke, ọ bụghị naanị ụlọ.
- issue: Njikọ nnupụisi na ekweghị ekwe n’ἀπειθούντων
  choice: E jiri “ndị na-enupụrụ oziọma Chineke isi,” ma tinye ụzọ ọzọ na ndetu ala.
  alternative: “ndị na-ajụ ikwere n’oziọma Chineke”
  rationale: Okwu Grik ahụ nwere ike ijikọ ekweghị ekwe na nnupụisi. Isi ederede na-echekwa akụkụ nnupụisi, ebe ndetu ala na-eme ka akụkụ ịjụ ikwere pụta ìhè.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E jiri “oziọma” n’ihi na ọ bụ okwu a maara n’ọtụtụ obodo Igbo, ebe “ezinụlọ Chineke” na-eme ka ntụaka ahụ ruo ndị Chineke, ọ bụghị ụlọ nkịtị. Akara ndetu ala [a], [b], na [c] niile dị n’isi ederede.
