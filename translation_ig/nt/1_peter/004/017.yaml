review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the causal connection, the judicial breadth of κρίμα, the communal sense of οἶκος, the rhetorical contrast, and the disobedience sense of ἀπειθούντων. However, it renders ἀπό as simple location ('n’ezinụlọ Chineke'), whereas the Greek states that judgment begins 'from' God’s household. The same directional nuance should be retained in the repeated ἀφ’ ἡμῶν.
  naturalness: The wording is generally clear and idiomatic Standard Igbo. 'Site n’ezinụlọ Chineke' and 'site n’ebe anyị nọ' naturally retain the intended starting-point sense. Moving footnote [c] to the phrase 'na-enupụrụ ... isi' gives the note an appropriate anchor.
  terminology: '''Ikpe,'' ''ezinụlọ Chineke,'' and ''oziọma Chineke'' are suitable, established Standard Igbo terms and preserve the source’s theological and lexical range without overinterpreting it.'
  issues:
  - severity: medium
    issue: The directional force of ἀπό / ἀφ’ is not represented consistently.
    rationale: ‘N’ezinụlọ Chineke’ means ‘in the household of God,’ while ἀπὸ τοῦ οἴκου means that judgment begins ‘from’ or ‘starting with’ that household. The parallel ἀφ’ ἡμῶν likewise calls for a starting-point expression.
  - severity: low
    issue: Footnote [c] is anchored after ‘Chineke’ rather than after the expression translating ἀπειθούντων.
    rationale: The note concerns ‘those who disobey/refuse to believe,’ not ‘the gospel of God’; its marker should follow ‘isi.’
  - severity: low
    issue: Footnote [b] can state the lexical alternative more directly.
    rationale: Since the main text already uses ‘ọgwụgwụ,’ the footnote’s useful alternative is ‘ihe ga-esi na ya pụta’ (outcome), rather than adding the near-synonymous ‘njedebe.’
