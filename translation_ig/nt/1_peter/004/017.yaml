  to: N’ihi na oge eruola ka ikpe malite site n’ezinụlọ Chineke[a]; ma ọ bụrụ na ọ malite ibu ụzọ site n’ebe anyị nọ, gịnị ga-abụ ọgwụgwụ[b] ndị na-enupụrụ oziọma Chineke isi[c]?
