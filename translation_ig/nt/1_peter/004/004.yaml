  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: ig
  text: N’ihe a[a], ọ na-eju ha anya na unu anaghị eso ha agba ọsọ banye n’otu idei nke omume rụrụ arụ ahụ[b], ha na-ekwujọ unu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “N’ihi nke a,” ma ọ bụ, “N’ime nke a.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’otu njupụta ma ọ bụ mwụpụ nke ndụ enweghị njide ahụ.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “ha na-akọcha unu,” ma ọ bụ, “ha na-ekwu okwu mkparị megide unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: N’ihe a
  rationale: Nke a na-ejikọta amaokwu a na mgbanwe ndụ a kọwara n’amaokwu bu ya ụzọ, ma ọ naghị eme ka njikọ ahụ bụrụ nanị ihe kpatara ihe ahụ.
- source_word: ξενίζονται
  choice: ọ na-eju ha anya
  rationale: Nke a na-egosi na ha hụrụ omume ndị kwere ekwe dị ka ihe ọhụrụ ma ọ bụ ihe ijuanya, n’Igbo doro anya nke oge a.
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: na unu anaghị eso ha agbaba
  rationale: Nke a na-echekwa onyonyo nke iso ndị ọzọ gbaa ọsọ, ma na-egosikwa ịghara isonye n’omume ha.
- source_word: εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν
  choice: n’otu idei omume rụrụ arụ ahụ
  rationale: “Idei” na-echekwa onyonyo nke ihe na-asọpụta ma jubiga ókè; “omume rụrụ arụ” na-ekpuchi ndụ enweghị njide na mmefu onwe onye nke ἀσωτία n’enweghị ime ka ọ bụrụ naanị mmehie mmekọahụ.
- source_word: βλασφημοῦντες
  choice: ha ana-ekwujọ unu
  rationale: N’ọnọdụ a, okwu ahụ na-egosi ikwu okwu ọjọọ megide ndị kwere ekwe. “Na-ekwujọ” na-enye echiche nke ịkatọ, ịkọcha, ma ọ bụ ikwutọ mmadụ, ọ bụghị naanị nkwulu megide Chineke.
theological_decisions:
- issue: Onye okwu βλασφημοῦντες metụtara
  choice: Ikwujọ ndị kwere ekwe
  alternative: Nkwulu megide Chineke ma ọ bụ ikwu okwu ọjọọ n’ozuzu
  rationale: Ọnọdụ amaokwu ahụ bụ mmeghachi omume ndị ọzọ n’ihi na ndị kwere ekwe akwụsịla iso ha bie ndụ mbụ ahụ. Ya mere, a kọwara ndị kwere ekwe dịka ndị okwu ọjọọ ahụ metụtara, ma e meghị okwu ahụ ka ọ bụrụ nkwulu megide Chineke.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. “Agbaba” na “idei” na-echekwa mmegharị na onyonyo mmiri dị n’asụsụ Gris; “omume rụrụ arụ” na-ezere imechi ἀσωτία n’otu ụdị mmehie naanị.
