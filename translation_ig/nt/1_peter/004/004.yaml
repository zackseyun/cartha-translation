review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the verse’s main relationships: the readers’ refusal to join their former associates, those associates’ surprise, the shared metaphor of excessive dissipation, and their hostile speech. However, “idei omume rụrụ arụ” lacks the needed genitive link and is less idiomatic than a construction with “nke.”'
  naturalness: “Ọ na-eju ha anya” and “ha ana-ekwujọ unu” are understandable Standard Igbo. Revising the central phrase to “idei nke omume rụrụ arụ” makes the image and syntax clearer; “eso ha agba ọsọ banye” more transparently expresses συντρέχω plus εἰς.
  terminology: “Omume rụrụ arụ” is a suitably broad contextual rendering of ἀσωτία, and “na-ekwujọ unu” appropriately renders human-directed βλασφημοῦντες without suggesting blasphemy against God. “Idei” preserves the overflow/flood metaphor of ἀνάχυσις.
  issues:
  - severity: medium
    issue: The phrase “n’otu idei omume rụrụ arụ ahụ” is syntactically compressed and potentially unclear.
    rationale: 'The Greek construction is explicitly “an overflow/flood of dissipation.” Standard Igbo is clearer with the linker: “idei nke omume rụrụ arụ.”'
  - severity: low
    issue: “Eso ha agbaba” is less explicit about running together into the described course.
    rationale: “Eso ha agba ọsọ banye” naturally preserves both the running-together image and the directional force of εἰς.
  revised_text: N’ihe a[a], ọ na-eju ha anya na unu anaghị eso ha agba ọsọ banye n’otu idei nke omume rụrụ arụ ahụ[b], ha na-ekwujọ unu[c].
