id: 1PE.4.11
reference: 1 Peter 4:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: ig
  text: Ọ bụrụ na onye ọ bụla na-ekwu okwu, ka o kwuo dị ka okwu Chineke[a]; ọ bụrụ na onye ọ bụla na-eje ozi, ka o jee ozi site n’ike nke Chineke na-enye[b], ka e wee nye Chineke otuto n’ihe niile site n’aka Jizọs bụ Mesaya, onye otuto na ike ọchịchị dịịrị[c] ruo mgbe ebighị ebi[d]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka okwu si n’ọnụ Chineke.” Okwu Grik λόγια na-ezo aka n’okwu Chineke kwuru, ọ bụghị naanị okwu nkịtị.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “dị ka site n’ike nke Chineke na-enye.”
    reason: literal_rendering
  - marker: c
    text: “Onye” a yiri ka ọ na-ezo aka na Jizọs bụ Mesaya, bụ́ onye a kpọrọ aha ozugbo tupu ya; ma ụfọdụ na-aghọta na otuto a na-ezo aka na Chineke Nna n’ihi ihe e kwuru n’ahịrịokwu bu ya ụzọ.
    reason: alternative_reading
  - marker: d
    text: N’ụzọ nkịtị, “ruo n’ọgbọ niile nke ọgbọ niile.”
    reason: literal_rendering
lexical_decisions:
- source_word: λαλεῖ
  choice: na-ekwu okwu
  rationale: Nke a bụ ntụgharị sara mbara ma kwekọọ n’ahịrịokwu ọnọdụ a; ọ naghị akpa ihe ọ pụtara naanị n’ime nkwusa.
- source_word: λόγια θεοῦ
  choice: okwu Chineke
  rationale: Ọ na-edobe njikọ chiri anya dị n’etiti okwu ahụ na Chineke, ebe nkọwa ala peeji na-egosi na λόγια bụ okwu sitere n’aka Chineke ma ọ bụ okwu Chineke kwuru.
- source_word: διακονεῖ
  choice: na-eje ozi
  rationale: Ọ na-egosi ije ozi n’ụzọ sara mbara, na-enweghị ime ka ọ bụrụ naanị ọkwa ọchịchị n’ọgbakọ.
- source_word: ἐξ ἰσχύος
  choice: site n’ike
  rationale: “Site n’” na-egosi na ike ahụ bụ isi iyi ije ozi ahụ, dịka ἐξ si kwuo.
- source_word: ἧς χορηγεῖ ὁ θεός
  choice: Chineke na-enye
  rationale: Nke a bụ Igbo dị mfe ma doo anya maka ike Chineke na-eweta ma na-enye onye na-eje ozi.
- source_word: ἐν πᾶσιν
  choice: n’ihe niile
  rationale: Ọ na-edobe oke okwu Grik ahụ n’enweghị ịkpa ya ókè.
- source_word: δοξάζηται
  choice: ka e wee nye Chineke otuto
  rationale: Usoro a na-egosipụta ebumnuche nke ἵνα na olu nnara nke δοξάζηται n’Igbo nkịtị.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: site n’aka Jizọs bụ Mesaya
  rationale: “Site n’aka” na-egosi ụzọ ma ọ bụ onye e si n’aka ya mee ihe ahụ; “Mesaya” na-edobe Χριστός dịka utu aha.
- source_word: κράτος
  choice: ike ọchịchị
  rationale: Ọ na-egosi ike dị ebube nke ịchị achị karịa naanị ike anụ ahụ.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: ruo mgbe niile ebighị ebi
  rationale: Nke a bụ ụzọ Igbo dị mma isi kwupụta ogologo oge na-enweghị njedebe, ebe ntụgharị mkpụrụokwu n’otu n’otu dị na nkọwa ala peeji.
theological_decisions:
- issue: Onye ᾧ na-ezo aka n’abụ otuto ikpeazụ
  choice: E jiri “onye” mee ka onye kacha nso, Jizọs bụ Mesaya, bụrụ onye o yikarịrị ka a na-ezo aka na ya.
  alternative: Ụfọdụ na-ewere ya na ọ na-ezo aka na Chineke Nna, ma ọ bụ na abụ otuto ahụ jikọtara otuto Chineke na nke e si n’aka Jizọs Mesaya nye ya.
  rationale: N’usoro asụsụ Grik, Jizọs Mesaya bụ aha kacha nso ᾧ; ma ahịrịokwu bu ya ụzọ lekwasịrị anya n’inye Chineke otuto. Nkọwa ala peeji na-echekwa nghọta abụọ ahụ n’enweghị ikpebi ihe karịrị ihe usoro okwu na-enye.
- issue: Ike ὡς n’ahịrịokwu abụọ ahụ
  choice: 'E gosipụtara ya dịka ndụmọdụ: “ka o kwuo…” na “ka o jee ozi…”'
  alternative: 'A pụrụ ịtụgharị ya n’ụzọ dị nso na mkpụrụokwu Grik: “ọ bụrụ na onye ọ bụla na-ekwu okwu, dị ka okwu Chineke; ọ bụrụ na onye ọ bụla na-eje ozi, dị ka site n’ike…”'
  rationale: Grik hapụrụ ngwaa ndụmọdụ ahụ n’ime nghọta. Ịtinye “ka o…” na-eme ka Igbo doo anya ma ghara ịgbakwunye echiche ọhụrụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. “Na-eje ozi,” “site n’ike,” na “ike ọchịchị” na-edobe ịdị elu nke okwu ahụ n’enweghị asụsụ ụka siri ike ma ọ bụ nkọwa otu ụka pụrụ iche.
