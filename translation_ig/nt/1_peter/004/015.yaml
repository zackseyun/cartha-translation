review_pass:
  verdict: revise
  source_fidelity: 'A safe correction is needed for γάρ: “N’ihi ya” means ‘therefore/so’ and introduces an inference, whereas γάρ is explanatory (‘for/because’). “N’ihi na” preserves the source connection. The remaining list accurately represents the Greek, including the broad sense of κακοποιός and the repeated ὡς before the final term.'
  naturalness: The revised wording is fluent, modern Standard Igbo. “Onye na-etinye onwe ya n’ihe na-abụghị nke ya” is clearer and more idiomatic than “onye na-etinye ọnụ n’ihe ndị ọzọ,” while retaining the negative sense required by the vice list.
  terminology: “Ogbu mmadụ,” “onye ohi,” “onye na-eme ihe ọjọọ,” and “ịta ahụhụ” are appropriate. The rare ἀλλοτριεπίσκοπος is rendered without importing an ecclesiastical meaning; its literal-overseer nuance is appropriately retained in the footnote as an explanatory alternative.
  issues:
  - severity: medium
    issue: “N’ihi ya” renders γάρ as an inferential ‘therefore/so.’
    rationale: The Greek γάρ supplies an explanatory connection (‘for’), not a conclusion. “N’ihi na” is the appropriate Standard Igbo equivalent here.
  - severity: low
    issue: The main rendering of ἀλλοτριεπίσκοπος is somewhat vague.
    rationale: “Onye na-etinye ọnụ n’ihe ndị ọzọ” can be understood broadly as intervening in others’ matters. “Onye na-etinye onwe ya n’ihe na-abụghị nke ya” more directly expresses intrusive involvement in affairs not one’s own.
  revised_text: N’ihi na, ka onye ọ bụla n’ime unu ghara ịta ahụhụ dịka ogbu mmadụ, ma ọ bụ onye ohi, ma ọ bụ onye na-eme ihe ọjọọ, ma ọ bụ dịka onye na-etinye onwe ya n’ihe na-abụghị nke ya[a].
