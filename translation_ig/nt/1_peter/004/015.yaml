  to: N’ihi na, ka onye ọ bụla n’ime unu ghara ịta ahụhụ dịka ogbu mmadụ, ma ọ bụ onye ohi, ma ọ bụ onye na-eme ihe ọjọọ, ma ọ bụ dịka onye na-etinye onwe ya n’ihe na-abụghị nke ya[a].
  rationale: The revision corrects the connective so that it reflects γάρ as ‘for/because,’ rather than a consequential ‘therefore.’ It also uses a more precise, natural Igbo expression for the rare compound ἀλλοτριεπίσκοπος, while the footnote preserves both the alternative idiom and the compound’s more literal lexical imagery. No doctrinal interpretation is introduced.
