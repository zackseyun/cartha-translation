  text: μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: ig
  text: N’ihi na, ka onye ọ bụla n’ime unu ghara ịta ahụhụ dịka ogbu mmadụ, ma ọ bụ onye ohi, ma ọ bụ onye na-eme ihe ọjọọ, ma ọ bụ dịka onye na-etinye onwe ya n’ihe na-abụghị nke ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-etinye ọnụ n’ihe ndị ọzọ.” N’ụzọ nkịtị karị, okwu ahụ na-enye echiche nke “onye na-elekọta ihe ndị ọzọ,” ya bụ, onye na-etinye onwe ya n’ihe na-abụghị nke ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γάρ
  choice: N’ihi ya, ... ghara
  rationale: γάρ na-ejikọta amaokwu a na ihe gbara ya gburugburu dịka nkọwa ma ọ bụ ihe kpatara ya; “N’ihi ya” na-eme ka njikọ ahụ doo anya n’Igbo. μὴ na-enye iwu mgbochi, nke “ghara” na-egosipụta.
- source_word: τις ὑμῶν
  choice: onye ọ bụla n’ime unu
  rationale: N’okpuru mgbochi “ghara,” okwu a na-enye echiche na ọ dịghị onye ọbụla n’etiti ha kwesịrị ime otú ahụ, ma na-edobekwa nlebara anya n’otu onye n’otu onye.
- source_word: πασχέτω
  choice: ịta ahụhụ
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu πάσχω, n’etinyeghị echiche pụrụ iche nke ntaramahụhụ nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: ὡς
  choice: dịka
  rationale: “Dịka” na-egosi ọnọdụ ma ọ bụ ụdị onye ihe kpatara ahụhụ ya ji bụrụ, dịka ọ dị na ndepụta ahụ.
- source_word: φονεύς
  choice: ogbu mmadụ
  rationale: “Ogbu mmadụ” na-egosi onye gburu mmadụ n’ụzọ ajọ omume, ọ bụghị naanị onye kpatara ọnwụ n’ụzọ sara mbara.
- source_word: κλέπτης
  choice: onye ohi
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe maka κλέπτης.
- source_word: κακοποιός
  choice: onye na-eme ihe ọjọọ
  rationale: Nhọrọ a na-edobe ịdị sara mbara na ụda omume nke κακοποιός, kama ime ka ọ bụrụ naanị okwu gbasara iwu obodo.
- source_word: ἀλλοτριεπίσκοπος
  choice: onye na-etinye ọnụ n’ihe ndị ọzọ
  rationale: Okwu Grik a dị ụkọ ma na-egosi onye na-abanye n’ihe na-abụghị nke ya. Akpaokwu Igbo a bụ nke mmadụ nkịtị ga-aghọta, ma ihe e dere n’ala ala na-edobe nhọrọ ọzọ na nkọwa okwu ahụ.
theological_decisions:
- issue: Ihe ἀλλοτριεπίσκοπος pụtara
  choice: onye na-etinye ọnụ n’ihe ndị ọzọ
  alternative: onye na-etinye onwe ya n’ihe na-abụghị nke ya; onye na-elekọta ihe ndị ọzọ
  rationale: Ndepụta a bụ nke omume ọjọọ ndị nwere ike ime ka mmadụ taa ahụhụ n’ụzọ kwesiri ya. Ya mere, a họọrọ echiche nke itinye ọnụ n’ihe na-abụghị nke mmadụ, na-ewebataghị echiche banyere ọkwa onye nlekọta n’ọgbakọ.
translation_notes:
  register: Asụsụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ịta ahụhụ” debe isiokwu ahụhụ dị na 1 Pita, ebe “onye na-etinye ọnụ n’ihe ndị ọzọ” na-akọwa okwu Grik dị ụkọ n’enweghị ụda ụka ma ọ bụ nkwenkwe otu okpukpe.
