id: 1PE.4.19
reference: 1 Peter 4:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε καὶ οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ ⸀θεοῦ πιστῷ κτίστῃ παρατιθέσθωσαν τὰς ψυχὰς ⸀αὐτῶν ἐν ἀγαθοποιΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: ig
  text: N’ihi ya, ka ndị na-ata ahụhụ dị ka uche Chineke si dị nyefee mkpụrụ obi ha[a] n’aka Onye Okike kwesịrị ntụkwasị obi n’ime ezi omume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndụ ha” ma ọ bụ “onwe ha”; okwu Grik ahụ nwere ike ịpụta mkpụrụ obi, ndụ, ma ọ bụ mmadụ n’onwe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya; okwu a bụ Igbo doro anya ma na-echekwa njikọ echiche ahụ.
- source_word: οἱ πάσχοντες
  choice: ndị na-ata ahụhụ
  rationale: Ọ na-egosi ìgwè ndị ahụ na-ata ahụhụ, n’ụzọ kwekọrọ n’aha-ngwaa dị ugbu a n’asụsụ Grik.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: dị ka uche Chineke si dị
  rationale: Ọ na-echekwa echiche nke ihe kwekọrọ n’uche Chineke, n’akọwaghị ma ọ bụ ikike Chineke nyere, ihe o nyere iwu, ma ọ bụ ụzọ ọzọ.
- source_word: πιστῷ κτίστῃ
  choice: n’aka Onye Okike kwesịrị ntụkwasị obi
  rationale: ‘Onye Okike’ na-asụgharị κτίστης, ebe ‘kwesịrị ntụkwasị obi’ na-egosi na a pụrụ ịdabere n’ebe ọ nọ; ‘n’aka’ na-eme ka echiche inyefe ihe ka e chebe ya doo anya n’Igbo.
- source_word: παρατιθέσθωσαν
  choice: ka ... nyefee
  rationale: Ọ na-echekwa iwu e nyere onye nke atọ n’ọnụọgụgụ nakwa echiche nke itinye onwe ha nlekọta onye ọzọ.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: mkpụrụ obi ha
  rationale: Ọ na-echekwa okwu bụ isi ψυχή na ihe omimi okpukpe dị na ya; ihe ọ pụkwara ịpụta n’ebe a ka edere na nkọwa ala peeji.
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: mgbe ha na-eme ezi ihe
  rationale: Ọ na-egosi omume ọma na-aga n’ihu dịka ọnọdụ na-eso inyefe onwe ha n’aka Chineke, n’emeghị ka ọ bụrụ naanị àgwà dị n’ime mmadụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ahụhụ na uche Chineke
  choice: dị ka uche Chineke si dị
  alternative: site n’uche Chineke
  rationale: κατά na-egosi nkwekọrịta na uche Chineke, ma amaokwu ahụ akọwaghị kpọmkwem otú uche Chineke si metụta ahụhụ ahụ. Nsụgharị a na-ahapụ esemokwu nkà mmụta okpukpe ahụ ka ọ dị.
- issue: Ihe ψυχή pụtara n’ebe a
  choice: mkpụrụ obi ha
  alternative: ndụ ha; onwe ha
  rationale: ‘Mkpụrụ obi’ na-echekwa ụdị okwu Grik na mkpa okpukpe ya, ebe nkọwa ala peeji na-egosi na okwu ahụ nwekwara ike ịpụta ndụ mmadụ ma ọ bụ mmadụ n’onwe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ụdị iwu nke Grik, njikọ nkwubi okwu ya, na nghọtahie ziri ezi dị na ‘uche Chineke’ na ψυχή.
