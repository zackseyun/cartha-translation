review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the inferential force of ὥστε, the third-person imperative, suffering in accordance with God's will, entrusting oneself to the faithful Creator, and the broad semantic range of ψυχή. The final phrase mgbe ha na-eme ezi ihe is understandable, but it makes ἐν ἀγαθοποιΐᾳ explicitly temporal ('while/when') rather than retaining its more general sense of conduct or manner ('in doing good').
  naturalness: The wording is clear Standard Igbo and maintains an appropriate formal biblical register. Recasting the final phrase as n’ime ezi omume is more idiomatic as a noun phrase and more closely corresponds to the Greek prepositional construction.
  terminology: Mkpụrụ obi is an established rendering for ψυχή, and the footnote appropriately preserves 'lives' and 'selves' as contextual alternatives. Onye Okike kwesịrị ntụkwasị obi is natural and accurately conveys πιστῷ κτίστῃ without adding doctrinal detail.
  issues:
  - severity: low
    issue: The rendering of ἐν ἀγαθοποιΐᾳ is overly temporal.
    rationale: Mgbe ha na-eme ezi ihe means 'while/when they are doing good.' The Greek ἐν plus ἀγαθοποιΐα more directly presents good conduct as the accompanying sphere or manner. N’ime ezi omume retains this without narrowing it to a temporal clause.
  revised_text: N’ihi ya, ka ndị na-ata ahụhụ dị ka uche Chineke si dị nyefee mkpụrụ obi ha[a] n’aka Onye Okike kwesịrị ntụkwasị obi n’ime ezi omume.
  revised_footnotes:
