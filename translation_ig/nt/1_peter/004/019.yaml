  to: N’ihi ya, ka ndị na-ata ahụhụ dị ka uche Chineke si dị nyefee mkpụrụ obi ha[a] n’aka Onye Okike kwesịrị ntụkwasị obi n’ime ezi omume.
  rationale: Only the final prepositional phrase has been revised. N’ime ezi omume better reflects ἐν ἀγαθοποιΐᾳ as conduct accompanying the act of entrusting oneself, while leaving the rest of the accurate and natural draft unchanged.
