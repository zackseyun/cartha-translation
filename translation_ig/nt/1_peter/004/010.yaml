  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/010.yaml
  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: ig
  text: Ka onye ọ bụla jiri onyinye ọ natara na-ejere ibe ya ozi, dịka ezi ndị nlekọta nke amara Chineke nke nwere ọtụtụ ụdị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’etiti unu” ma ọ bụ “nye ibe unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: Onye ọ bụla
  rationale: Na-egosi onye nke ọ bụla n’ime ndị kwere ekwe n’otu n’otu, n’Igbo doro anya ma bụrụ nke a na-asụ ugbu a.
- source_word: καθὼς ἔλαβεν
  choice: dịka o si nata
  rationale: Na-echekwa njikọ dị n’etiti onyinye onye natara na ọrụ o kwesịrị iji ya rụọ, n’enweghị ikwu kpọmkwem onye nyere ya karịa ihe Grik kwuru.
- source_word: χάρισμα
  choice: onyinye
  rationale: Na-echekwa obosara okwu Grik; ‘onyinye nke mmụọ’ ga-eme ka ihe ọ pụtara dị warara karịa isi mmalite ahụ.
- source_word: εἰς ἑαυτοὺς
  choice: ibe ya
  rationale: Na-egosi na ndị nọ n’otu obodo ndị kwere ekwe bụ ndị a na-ejere ozi. N’Igbo, ‘ibe ya’ bụ ụzọ eke isi kwuo ‘otu onye nye onye ọzọ.’
- source_word: αὐτὸ διακονοῦντες
  choice: ya jiri ya na-ejere ... ozi
  rationale: Participu ahụ nwere ike ịrụ ọrụ dịka agbamume n’ebe a; ntụgharị a na-eme ka agbamume ahụ doo anya ma na-edobe onyinye ahụ dịka ihe e ji eje ozi.
- source_word: ὡς καλοὶ οἰκονόμοι
  choice: dịka ndị ezi na-elekọta
  rationale: ‘Ndị na-elekọta’ na-egosi ndị e nyefere ihe onye ọzọ ka ha jikwaa ya nke ọma; ‘ezi’ na-ebuga καλοί n’enweghị itinye ‘ndị kwesịrị ntụkwasị obi,’ nke ga-abụ nkọwa agbakwunyere.
- source_word: ποικίλης χάριτος θεοῦ
  choice: amara Chineke nke nwere ụdị dị iche iche
  rationale: Na-egosi na amara ahụ sitere n’aka Chineke ma na-apụta n’ụdị dị iche iche; okwu a bụ nke doro ndị na-agụ Igbo nke oge a anya.
theological_decisions:
- issue: Ma a ga-atụgharị χάρισμα dịka ‘onyinye nke mmụọ’
  choice: onyinye
  alternative: onyinye nke mmụọ; onyinye amara
  rationale: Okwu Grik n’onwe ya anaghị amanye nkọwa teknụzụ dị warara. ‘Onyinye’ na-ahapụ ọnọdụ amaokwu ahụ ka o gosi na ọ bụ onyinye sitere n’amara Chineke.
- issue: Otu e si egosipụta ike mmekọrịta nke εἰς ἑαυτούς
  choice: ibe ya
  alternative: n’etiti unu; nye ibe unu
  rationale: ‘Ibe ya’ na-egosi ndị ọzọ nọ n’obodo ahụ dịka ndị ọrụ ahụ baara uru. Ihe odide ala peeji na-echekwa ụzọ ndị ọzọ e nwere ike isi ghọta njikọ ahụ.
- issue: Ike iwu nke διακονοῦντες
  choice: ya jiri ya na-ejere ... ozi
  alternative: na-ejere ... ozi
  rationale: Ọ bụ ezie na ọdịdị okwu ahụ bụ participu, n’ọnọdụ a ọ na-enye agbamume. Igbo chọrọ ka ike agbamume ahụ pụta ìhè iji bụrụ nke eke ma doo anya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A zere okwu ụka pụrụ iche ebe okwu nkịtị na-ebuga echiche Grik nke ọma. Akara [a] dị n’isi amaokwu ma kwekọọ na ihe odide ala peeji.
