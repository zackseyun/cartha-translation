revisions:
- from: N’ihi na oge gafeworo ezuola unu iji meezuo uche ndị mba ọzọ, ebe unu biri ndụ n’omume rụrụ arụ na-enweghị ihere[a], n’agụụ ọjọọ, n’ịṅụbiga mmanya ókè[b], n’oriri mkpọtụ, n’oriri ịṅụ mmanya, na n’ofufe arụsị ndị iwu na-akwadoghị[c].
  to: N’ihi na oge gafeworo ezuola unu imezu ihe ndị mba ọzọ chọrọ, ebe unu biri ndụ n’omume rụrụ arụ na-enweghị ihere[a], n’ọchịchọ ọjọọ, n’ịṅụbiga mmanya ókè[b], n’oriri ọṅụṅụ na ọgba aghara, n’oriri ịṅụ mmanya, nakwa n’ofufe arụsị na-emegide ụkpụrụ ziri ezi[c].
