id: 1PE.4.3
reference: 1 Peter 4:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: ig
  text: N’ihi na oge gafeworo ezuola unu imezu ihe ndị mba ọzọ chọrọ, ebe unu biri ndụ n’omume rụrụ arụ na-enweghị ihere[a], n’ọchịchọ ọjọọ, n’ịṅụbiga mmanya ókè[b], n’oriri ọṅụṅụ na ọgba aghara, n’oriri ịṅụ mmanya, nakwa n’ofufe arụsị na-emegide ụkpụrụ ziri ezi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “omume ịhapụ onwe n’agụụ anụahụ”; okwu Grik ahụ na-emesi omume gabigara ókè nke ihere na-adịghị ya ike.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “oge dị iche iche nke ịṅụbiga mmanya ókè.” Ụdị ọtụtụ nke okwu Grik nwere ike igosi omume a na-eme ugboro ugboro.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ofufe arụsị a machibidoro iwu.” Okwu Grik ahụ pụtara ihe a na-ekweghị ka e mee ma ọ bụ ihe megidere iwu na ụkpụrụ ziri ezi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: N’ihi na oge gafeworo ezuola unu
  rationale: “Ezuola” na-egosipụta echiche nke ἀρκετός, bụ́ ‘o zuola’; “gafeworo” na-egosipụta oge ahụ nke gaferela. E tinyere “unu,” nke dị n’echiche nke πεπορευμένους, ka ahịrịokwu ahụ bụrụ Igbo doro anya ma dị ndụ.
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: uche ndị mba ọzọ
  rationale: “Uche” nwere ike ịpụta ihe mmadụ chọrọ ma ọ bụ nzube ya, dịka βούλημα. N’ebe a, “ndị mba ọzọ” na-ezo aka n’ndị na-abụghị ndị Juu, ọ bụghị nanị mba dị iche iche n’usoro ndọrọ ndọrọ ọchịchị.
- source_word: κατειργάσθαι
  choice: iji meezuo
  rationale: “Meezuo” na-egosipụta ime ihe ahụ n’ezie ruo n’ókè a rụzuru ya, ma kwekọọ n’ụdị perfect infinitive nke Grik.
- source_word: πεπορευμένους
  choice: ebe unu biri ndụ
  rationale: Ọ bụ ezie na okwu Grik pụtara n’ụzọ nkịtị ‘ije,’ n’ebe a ọ bụ ihe atụ maka otú mmadụ si ebi ndụ. “Biri ndụ” bụ okwu Igbo ebumpụta ụwa nke na-edobe echiche omume ahụ.
- source_word: ἐν ἀσελγείαις
  choice: n’omume rụrụ arụ na-enweghị ihere
  rationale: ἀσέλγεια na-egosi ịhapụ onwe n’omume ọjọọ n’enweghị ihere, ọtụtụ mgbe gụnyere mmehie mmekọahụ ma ọ bụghị naanị ya. Nsụgharị a na-edobe obosara okwu ahụ na ike omume ya.
- source_word: ἐπιθυμίαις
  choice: n’agụụ ọjọọ
  rationale: ἐπιθυμία nwere ike ịbụ ọchịchọ nkịtị, ma n’usoro omume ọjọọ a ọ na-ezo aka n’ọchịchọ na-adịghị mma. “Agụụ ọjọọ” na-eme ka ọnọdụ ahụ doo anya n’enweghị ime ka ọ bụrụ naanị agụụ mmekọahụ.
- source_word: οἰνοφλυγίαις
  choice: n’ịṅụbiga mmanya ókè
  rationale: Okwu a na-ezo aka n’ịṅụ mmanya gabiga ókè ma ọ bụ ịnọ n’ịṅụbiga mmanya ugboro ugboro. Nsụgharị a bụ Igbo doro anya ma dị mfe nghọta.
- source_word: κώμοις
  choice: n’oriri mkpọtụ
  rationale: κῶμος bụ oriri ma ọ bụ emume jupụtara n’ịṅụbiga mmanya na omume enweghị njide onwe. “Oriri mkpọtụ” na-egosipụta ụdị oriri ọgba aghara a n’asụsụ dị mfe.
- source_word: πότοις
  choice: n’oriri ịṅụ mmanya
  rationale: πότος na-ezo aka n’oge ma ọ bụ nnọkọ e mere maka ịṅụ mmanya. Nsụgharị a na-ekewa ya nke ọma na ịṅụbiga mmanya ókè na oriri mkpọtụ.
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: n’ofufe arụsị ndị iwu na-akwadoghị
  rationale: ἀθέμιτος pụtara ihe a na-ekweghị ka e mee ma ọ bụ ihe megidere ụkpụrụ iwu ziri ezi. “Ndị iwu na-akwadoghị” na-edobe ike iwu na omume nke okwu ahụ, ebe ọtụtụ “ofufe” na-anọchi ụdị omume arụsị dị iche iche.
theological_decisions:
- issue: Ihe ἐθνῶν pụtara n’ebe a
  choice: ndị mba ọzọ
  alternative: ndị Jentaịl; mba dị iche iche
  rationale: N’ọnọdụ akwụkwọ ozi a, okwu ahụ na-akọwa ụwa ndị na-abụghị ndị Juu na ụzọ ndụ ha. “Ndị mba ọzọ” bụ okwu Igbo a na-aghọta nke ọma ma ọ naghị agbanwe ya ka ọ bụrụ nanị mba ndọrọ ndọrọ ọchịchị.
- issue: Ike omume nke ἀθεμίτοις εἰδωλολατρίαις
  choice: ofufe arụsị ndị iwu na-akwadoghị
  alternative: ofufe arụsị ndị rụrụ arụ; ofufe arụsị ndị a machibidoro iwu
  rationale: Okwu Grik na-ekwusi ike na omume ndị ahụ abụghị ihe e kwere ma megide ụkpụrụ ziri ezi. A họọrọ nsụgharị nwere echiche iwu kama ịgbakwunye naanị mmetụta ịkpọasị nke okwu dịka ‘ihe arụ’ nwere ike iweta.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A zere okwu ụka pụrụ iche ebe okwu ndị nkịtị nwere ike iburu ihe Grik pụtara. Ndepụta omume ọjọọ ahụ ka dị iche iche dịka o si dị na isi mmalite, ebe a gbanwere ụfọdụ ọtụtụ nke Grik ka ha bụrụ usoro Igbo ebumpụta ụwa; nkọwa ala peeji na-echekwa echiche omume a na-eme ugboro ugboro ebe ọ dị mkpa.
