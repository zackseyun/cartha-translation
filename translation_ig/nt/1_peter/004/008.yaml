  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πρὸ ⸀πάντων τὴν εἰς ἑαυτοὺς ἀγάπην ἐκτενῆ ἔχοντες, ὅτι ἀγάπη ⸀καλύπτει πλῆθος ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/008.yaml
  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: ig
  text: Karịsịa, nọgidesienụ na-ahụrịta onwe unu n’anya nke ukwuu[a][c], n’ihi na ịhụnanya na-ekpuchi ọtụtụ mmehie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nọgidesienụ n’ịhụrịta ibe unu n’anya nke ukwuu.”
    reason: lexical_alternative
  - marker: b
    text: Okwu a na-emegharị Ilu 10:12. A pụkwara ịghọta “na-ekpuchi” dị ka “na-eleghara anya” ma ọ bụ “na-ezochi,” n’echiche nke ịghara ịkpali mmejọ ka ọ ghọọ esemokwu.
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, “na-enwe ịhụnanya siri ike n’ebe ibe unu nọ.”
    reason: previous_rendering
lexical_decisions:
- source_word: πρὸ πάντων
  choice: Karịsịa
  rationale: Nke a na-egosi na ndụmọdụ a kacha mkpa, ọ bụghị nanị ihe na-ebute ụzọ n’usoro oge.
- source_word: εἰς ἑαυτοὺς
  choice: na-ahụrịta onwe unu n’anya
  rationale: Ụdị nkwughachi a na-egosi ịhụnanya ndị nọ n’otu ahụ na-egosirịta ibe ha; nsụgharị a bụ Igbo doro anya ma dịkwa ndụ.
- source_word: ἀγάπην
  choice: n’anya / ịhụnanya
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị akọwa ἀγάπη, ma dabara n’ọnọdụ a.
- source_word: ἐκτενῆ
  choice: nke ukwuu
  rationale: Ọ na-egosi ịdị omimi na ike nke ịhụnanya ahụ; echiche ịnọgidesi ike dịkwa na ngwaa ‘nọgidesienụ’.
- source_word: ἔχοντες
  choice: nọgidesienụ
  rationale: Ọ bụ participle na-aga n’ihu n’usoro ndụmọdụ nke amaokwu ndị gbara ya gburugburu; iji iwu kpọmkwem na-eme ka Igbo bụrụ nke eke ma chekwaa echiche nke ịnọgide na-enwe ịhụnanya ahụ.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara ndụmọdụ ahụ.
- source_word: καλύπτει
  choice: na-ekpuchi
  rationale: Nke a na-echekwa ihe atụ dị na Grik na njikọ ya na Ilu 10:12, n’akọwaghị ya n’ụzọ ga-amanye naanị otu nghọta.
- source_word: πλῆθος ἁμαρτιῶν
  choice: ọtụtụ mmehie
  rationale: Nke a bụ Igbo dị mfe ma dị ike nke na-egosi ọnụ ọgụgụ buru ibu nke mmehie.
theological_decisions:
- issue: Ihe ‘ịhụnanya na-ekpuchi ọtụtụ mmehie’ pụtara
  choice: Edebere ihe atụ ahụ dị ka ‘na-ekpuchi’ n’akọwaghị kpọmkwem mmehie ndị ọ bụ ma ọ bụ usoro mkpuchi ahụ.
  alternative: Ịhụnanya na-eleghara ọtụtụ mmejọ anya; ma ọ bụ ịhụnanya na-eweta mgbaghara maka ọtụtụ mmehie.
  rationale: Okwu Grik ahụ yiri ilu ma na-ezo aka n’Ilu 10:12. Ọ naghị amanye otu nkọwa ozizi, ya mere nsụgharị ahụ na-echekwa mgbagwoju na esemokwu echiche dị na isi mmalite.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Karịsịa’ na-enye okwu ahụ ike nke ibute ihe kacha mkpa ụzọ; ‘nọgidesienụ’ na-eme ka ndụmọdụ participle ahụ doo anya n’Igbo, ebe ‘na-ekpuchi’ na-echekwa ihe atụ na enweghị nkọwa otu ụzọ dị na Grik.
