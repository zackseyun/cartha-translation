    issue: Footnote a is semantically inaccurate and incomplete.
    rationale: “Jiri ịhụnanya siri ike” introduces ‘use’ (jiri), which is not represented by ἔχοντες, and it fails to express εἰς ἑαυτούς (‘for one another/among yourselves’). The lexical-alternative note should retain both the possession/continuance sense and the reciprocal community reference.
