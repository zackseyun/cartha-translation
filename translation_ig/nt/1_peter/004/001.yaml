id: 1PE.4.1
reference: 1 Peter 4:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Χριστοῦ οὖν ⸀παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ ⸀παθὼν σαρκὶ πέπαυται ⸀ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
translation:
  language: ig
  text: Ya mere, ebe Kraịst[a] tara ahụhụ n'anụ ahụ, unu onwe unu werekwa otu echiche ahụ kwadebe onwe unu dị ka ngwa agha, n'ihi na onye tara ahụhụ n'anụ ahụ[b] akwụsịla ime mmehie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mesaya.” Okwu Grik bụ Christos, aha-ọkwa nke pụtara Mesaya.
    reason: lexical_alternative
  - marker: b
    text: “N'anụ ahụ” na-ezo aka n'ịdị adị mmadụ n'ahụ; ọ pụtaghị n'onwe ya “ọdịdị mmehie.”
    reason: lexical_alternative
  - marker: c
    text: A na-arụrịta ụka banyere okwu a. Ọ pụrụ izo aka kpọmkwem na Kraịst, n'ebe ndị kwere ekwe na-agbaso ụzọ ahụhụ ya, ma ọ bụ n'ụkpụrụ izugbe banyere ịkwụsị ime mmehie n'ụzọ doro anya.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστοῦ
  choice: Kraịst
  rationale: “Kraịst” bụ aha-ọkwa a maara nke ọma n'Igbo maka Χριστός; ihe odide a na-ejigide ya dị ka aha-ọkwa, ebe nkọwa ala peeji na-akọwa na ọ pụtara “Mesaya.”
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n'okwu ndị bu ya ụzọ ma na-ada nke ọma n'Igbo ugbu a.
- source_word: παθόντος
  choice: ebe ... tara ahụhụ
  rationale: Nke a na-ebute ike oge na ihe kpatara nke participle ahụ n'Igbo nkịtị, n'ebughị nkọwa ọzọ abanye.
- source_word: σαρκὶ
  choice: n'anụ ahụ
  rationale: Ọ na-ejigide ntụaka banyere ịdị adị mmadụ n'ahụ na ahụhụ anụ ahụ, kama ịsụgharị ya dị ka “ọdịdị mmehie.”
- source_word: ἔννοιαν
  choice: echiche
  rationale: “Echiche” na-ekpuchi echiche, ọnọdụ uche, na mkpebi obi n'ụzọ ndị na-agụ Igbo ga-aghọta; “otu” na-ejigide τὴν αὐτήν.
- source_word: ὁπλίσασθε
  choice: jikwa ... jikere dị ka ndị ji ngwa agha
  rationale: Ọ na-echekwa ihe atụ agha na ike reflexive nke iwu ahụ, ma na-eme ka okwu ahụ bụrụ Igbo sitere n'okike.
- source_word: ὅτι
  choice: n'ihi na
  rationale: Ọ na-egosi na nkebi na-esote bụ ihe ndabere ma ọ bụ ihe kpatara ndụmọdụ ahụ.
- source_word: ὁ παθὼν
  choice: onye tara ahụhụ
  rationale: Ọ na-ahapụ onye nkebi okwu ahụ na-ezo aka na ya ka ọ ghara ịkọwapụta karịa ihe Grik kwuru.
- source_word: πέπαυται
  choice: akwụsịla
  rationale: Ụdị a na-egosi omume kwụsịrị nke nsonaazụ ya ka dị ugbu a, dịka perfect Grik ahụ.
- source_word: ἁμαρτίας
  choice: ime mmehie
  rationale: Igbo nkịtị chọrọ ngwaa iji gosipụta ịkwụsị omume mmehie; a ka na-ejigide “mmehie” n'otu n'otu dịka Grik ahụ.
theological_decisions:
- issue: Onye okwu “onye tara ahụhụ n'anụ ahụ akwụsịla ime mmehie” na-ezo aka na ya na ókè okwu ahụ ruru
  choice: E debere ya n'ụdị sara mbara, na-akọwaghị ma ọ bụ Kraịst kpọmkwem, ndị kwere ekwe na-agbaso ụzọ ya, ma ọ bụ ụkpụrụ izugbe.
  alternative: A pụrụ ịkọwa ya naanị banyere Kraịst, banyere ndị kwere ekwe ndị ahụhụ gosiri nkwụsị ha na mmehie, ma ọ bụ dị ka ilu izugbe banyere ịkwụsị ibi na mmehie.
  rationale: Okwu Grik ahụ dị mkpirikpi ma nwee nghọta dị iche iche. Nsụgharị ahụ ekwesịghị idozi esemokwu nkà mmụta okpukpe site n'ịgbakwunye ihe na-adịghị na ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ agha dị na ὁπλίσασθε na nkwughachi “n'anụ ahụ,” ma zere okwu ụka pụrụ iche nke otu denomination.
