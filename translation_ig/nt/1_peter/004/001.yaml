revisions:
- from: Ya mere, ebe Kraịst[a] tara ahụhụ n'anụ ahụ, unu onwe unu jikwa otu echiche ahụ jikere dị ka ndị ji ngwa agha, n'ihi na onye tara ahụhụ n'anụ ahụ[b] akwụsịla ime mmehie[c].
  to: Ya mere, ebe Kraịst[a] tara ahụhụ n'anụ ahụ, unu onwe unu werekwa otu echiche ahụ kwadebe onwe unu dị ka ngwa agha, n'ihi na onye tara ahụhụ n'anụ ahụ[b] akwụsịla ime mmehie[c].
  rationale: 'The revision replaces the unnatural construction for the military imperative with a clear Standard Igbo expression: readers are to prepare themselves using the same mindset as a weapon. It preserves the metaphor, the reflexive imperative, both occurrences of ''n''anụ ahụ,'' and the source''s ambiguity concerning the person who has suffered and ceased from sin. Footnote c is made more idiomatic while retaining all principal interpretive possibilities.'
