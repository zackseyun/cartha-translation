id: 1PE.3.18
reference: 1 Peter 3:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: ig
  text: N’ihi na Mesaya tarakwara ahụhụ otu mgbe maka mmehie[a], onye ezi omume maka ndị ajọ omume, ka o wee kpọbata unu n’ebe Chineke nọ[b]. E gburu ya n’anụ ahụ, ma e mere ka ọ dị ndụ n’ime mmụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie nwere “nwụrụ” kama “tara ahụhụ.”
    reason: textual_variant
  - marker: b
    text: A pụkwara ịsụgharị ya, “e mere ka ọ dị ndụ site na Mmụọ Nsọ.” Grik nwere ike ịpụta ọnọdụ ma ọ bụ akụkụ mmụọ, ma ọ bụ ọrụ nke Mmụọ Nsọ.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: Mesaya
  rationale: E ji ya dị ka utu aha, iji chekwaa echiche nke Onye E Tere Mmanụ kama ime ya naanị aha.
- source_word: ἅπαξ
  choice: otu mgbe
  rationale: Nke a na-egosipụta ihe ἅπαξ pụtara kpọmkwem, n’etinyeghị nkwusi ike ọzọ nke ‘otu mgbe ruo mgbe ebighị ebi.’
- source_word: περὶ ἁμαρτιῶν
  choice: maka mmehie
  rationale: N’ọnọdụ àjà na mgbapụta, nkebiokwu a pụtara ahụhụ metụtara mmehie ma bụrụ maka ya.
- source_word: ἔπαθεν
  choice: tara ahụhụ
  rationale: Nke a bụ ọgụgụ SBLGNT ma na-asụgharị ngwaa ahụ kpọmkwem; e debere ọgụgụ ọzọ ‘nwụrụ’ n’ala peeji.
- source_word: δίκαιος
  choice: onye ezi omume
  rationale: Adjective ahụ na-arụ ọrụ dị ka aha ma na-ezo aka na Mesaya, n’iche ya ihu na ndị ajọ omume.
- source_word: ὑπὲρ ἀδίκων
  choice: n’ọnọdụ ndị ajọ omume
  rationale: Nke a na-eme ka ike nnọchi anya nke ὑπέρ doo anya n’Igbo, ma ọ naghị agbasa ya ka ọ bụrụ nkọwa ozizi mgbaghara zuru ezu.
- source_word: προσαγάγῃ
  choice: kpọtara unu
  rationale: Ngwaa a na-egosi ịkpọbata mmadụ n’ihu onye ọzọ ma ọ bụ inye ya ohere ịbịaru nso.
- source_word: θανατωθεὶς
  choice: E gburu ya
  rationale: Nke a na-echekwa olu nnara nke participle ahụ n’Igbo dị mfe ma dị ndụ.
- source_word: σαρκὶ
  choice: n’anụ ahụ
  rationale: N’ebe a, σάρξ na-ezo aka n’ọnọdụ ndụ mmadụ nwere ahụ nke pụrụ ịnwụ, ọ bụghị ‘ọdịdị mmehie.’
- source_word: ζῳοποιηθεὶς
  choice: e mere ka ọ dị ndụ
  rationale: Nke a na-echekwa olu nnara ma na-enye Igbo doro anya.
- source_word: πνεύματι
  choice: na mmụọ
  rationale: Nke a na-echekwa nhata dị n’etiti datives abụọ ma hapụ ma ọ bụ akụkụ/ọnọdụ nke mmụọ ma ọ bụ ọrụ Mmụọ Nsọ ka ọ bụrụ ihe nwere ike ịgụ n’ụzọ abụọ.
theological_decisions:
- issue: Ihe ntụnyere ‘anụ ahụ/mmụọ’ pụtara na nkebi ikpeazụ
  choice: “n’anụ ahụ ... na mmụọ”
  alternative: “n’anụ ahụ ... site na Mmụọ Nsọ”
  rationale: 'Grik ahụ dị mkpirikpi ma nwee nghọta abụọ: πνεύματι nwere ike igosi ọnọdụ/akụkụ nke mmụọ ma ọ bụ onye ọrụ, ya bụ Mmụọ Nsọ. Isi ederede anaghị ekpebi nke ọ bụ.'
- issue: Ike nnọchi anya dị na ‘onye ezi omume maka ndị ajọ omume’
  choice: “onye ezi omume n’ọnọdụ ndị ajọ omume”
  alternative: “onye ezi omume maka ndị ajọ omume”
  rationale: ‘N’ọnọdụ’ na-eme ka ὑπέρ pụta ìhè dị ka nnọchi anya, ma ọ naghị etinye nkọwa ozizi gafere ihe Grik kwuru.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘Mesaya’ chekwaa Χριστός dị ka utu aha; e kewara ahịrịokwu ahụ n’ụzọ na-agụ nke ọma n’Igbo ma chekwaa usoro echiche Grik.
