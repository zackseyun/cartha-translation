id: 1PE.3.20
reference: 1 Peter 3:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ⸀ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι’ ὕδατος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: ig
  text: ndị nupụụrụ isi n’oge gara aga[a], mgbe Chineke ji ndidi na-echere n’ụbọchị Noa, ka a na-akwadebe ụgbọ mmiri ahụ. N’ime ya ka mmadụ ole na ole—ya bụ, mmadụ asatọ[b]—batara, e wee mee ka ha gabiga n’ime mmiri ahụ n’enweghị nsogbu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị jụrụ irube isi.”
    reason: lexical_alternative
  - marker: b
    text: N’okwu nkịtị, “mkpụrụ obi asatọ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “a zọpụtara ha site na mmiri ahụ.”
    reason: theological_alternative
lexical_decisions:
- source_word: ἀπειθήσασίν
  choice: ndị nupụụrụ isi
  rationale: Nke a na-egosi ịjụ irube isi, ọ bụghị naanị enweghị nkwenye n’uche.
- source_word: ποτε
  choice: n’oge gara aga
  rationale: Ọ na-egosi oge gara aga ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἀπεξεδέχετο
  choice: nọ na-echere
  rationale: Ụdị imperfect na-egosi nchere nke na-aga n’ihu; μακροθυμία ekwuola echiche nke ntachi obi.
- source_word: μακροθυμία
  choice: ogologo ntachi obi
  rationale: Ọ na-egosi na Chineke jidere ikpe azụ ruo ogologo oge, ma bụrụkwa okwu doro ndị na-agụ akwụkwọ anya.
- source_word: κατασκευαζομένης
  choice: ka a nọ na-akwadebe
  rationale: Ọ na-edobe echiche sara mbara nke ime ka ihe dị njikere, n’agbanyeghị na ọ gụnyere iwu ụgbọ ahụ.
- source_word: κιβωτοῦ
  choice: ụgbọ ahụ
  rationale: N’akụkọ Noa, nke a bụ ụgbọ pụrụ iche e ji lanarị iju mmiri; 'ụgbọ ahụ' bụ okwu Igbo nkịtị ma doo anya n’ọnọdụ a.
- source_word: εἰς ἣν
  choice: banyere n’ime ya
  rationale: εἰς na-egosi ngagharị ịbanye n’ime, ọ bụghị nanị ịnọ n’ime.
- source_word: ὀλίγοι
  choice: mmadụ ole na ole
  rationale: Ọ na-ekwusi ike na ọnụ ọgụgụ ndị nọ n’ụgbọ ahụ pere mpe.
- source_word: ψυχαί
  choice: mmadụ
  rationale: N’ebe a ψυχαί pụtara ndị mmadụ a na-agụ ọnụ, ọ bụghị nkọwa teknikal banyere mkpụrụ obi.
- source_word: διεσώθησαν
  choice: e wee mee ka ha ... n’udo
  rationale: Ọ na-egosi na e chebere ha ma mee ka ha gabiga ihe ize ndụ n’enweghị mbibi.
- source_word: δι’ ὕδατος
  choice: gabiga mmiri ahụ
  rationale: διά na genitive nwere ike igosi ụzọ ma ọ bụ ihe e ji mee ihe; 'gabiga mmiri ahụ' na-edobe ihe oyiyi nke ịgafe n’etiti mmiri iju ahụ na-enweghị imechi nghọta ọzọ.
theological_decisions:
- issue: Nkọwa διεσώθησαν δι’ ὕδατος nke nwere ike ibu echiche nzọpụta pụrụ iche
  choice: e wee mee ka ha gabiga mmiri ahụ n’udo
  alternative: e wee zọpụta ha site na mmiri ahụ
  rationale: Nhọrọ bụ isi na-egosi nchebe ha n’ihe ize ndụ nke iju mmiri, ma hapụ njikọ ya na baptizim n’amaokwu na-esote ka ederede n’onwe ya gosipụta ya. A na-edebe 'zọpụta' n’ala peeji n’ihi mkpa nkà mmụta okpukpe ya.
- issue: Nkọwa ψυχαί
  choice: mmadụ
  alternative: mkpụrụ obi
  rationale: Amaokwu a na-agụ ndị mmadụ nọ n’ụgbọ ahụ ọnụ; ọ naghị akụzi nkewa pụrụ iche n’etiti mmadụ na mkpụrụ obi. A na-edebe ntụgharị nkịtị ya n’ala peeji.
translation_notes:
  register: Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E jiri 'nupụụrụ isi' gosipụta nnupụisi doro anya; e zere okwu ụka pụrụ iche ebe Grik anaghị amanye ya. Ahịrịokwu ahụ na-ejigide njikọ ya na amaokwu bu ya ụzọ site na mmalite 'ndị...'.
