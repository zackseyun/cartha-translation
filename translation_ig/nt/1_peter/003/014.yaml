  rationale: The revision corrects the Igbo negative imperative and replaces an unidiomatic final clause. It retains the source’s concessive condition, blessing, key term ‘ezi omume,’ the ambiguous literal wording ‘egwu ha’ in the main text, and the alternative senses in the footnote.
