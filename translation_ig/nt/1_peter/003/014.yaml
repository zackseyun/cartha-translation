id: 1PE.3.14
reference: 1 Peter 3:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: ig
  text: Ma ọ bụrụgodị na unu ata ahụhụ n’ihi ezi omume, ndị a gọziri agọzi ka unu bụ. Unu atụla egwu ha[a], ka obi unu ghara ịma jijiji.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “unu atụla ha egwu” ma ọ bụ “unu atụla ihe ha na-atụ egwu.” Okwu Grik ahụ nwere ike ịpụta ụzọ abụọ ahụ, ọ na-adabakwa n’okwu Aịzaya 8:12.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ πάσχοιτε
  choice: Ma ọ bụrụgodị na unu ata ahụhụ
  rationale: “Ọ bụrụgodị” na-egosi ọnọdụ nwere ike ime ma na-emegide echiche gara aga; “ata ahụhụ” bụ ụzọ Igbo nkịtị si kwuo πάσχω n’ebe a.
- source_word: διὰ δικαιοσύνην
  choice: n’ihi ezi omume
  rationale: διά na accusative na-egosi ihe kpatara ahụhụ ahụ. “Ezi omume” na-egosipụta ịdị n’ụzọ ziri ezi n’ihu Chineke na mmadụ n’Igbo doro anya, n’emeghị ka okwu ahụ bụrụ naanị ikpe ziri ezi nke ọha.
- source_word: μακάριοι
  choice: ndị a gọziri agọzi ka unu bụ
  rationale: Nke a na-eme ka okwu predicate a na-agwa ndị na-agụ ya doo anya ma chekwaa echiche ngọzi, kama ịkọwa ya naanị dịka obi ụtọ ma ọ bụ ihu ọma ọnọdụ.
- source_word: τὸν ... φόβον αὐτῶν μὴ φοβηθῆτε
  choice: Unu atụkwala egwu ha
  rationale: “Egwu ha” na-echekwa nkenke na ambiguity nke αὐτῶν ma na-ekwe ka ọ pụta ma dịka egwu nke ha na-akpata, ma ọ bụ ihe ha onwe ha na-atụ egwu. Ngwakọta “ịtụ egwu” na-edobekwa mmegharị φόβος/φοβέομαι n’Igbo n’ụzọ kwesịrị ekwesị.
- source_word: μηδὲ ταραχθῆτε
  choice: obi amakwala unu jijiji
  rationale: Akpaalaokwu Igbo a na-egosipụta ọgba aghara na ụjọ ime mmụọ nke ταράσσω, ọ bụghị jijiji anụ ahụ naanị.
theological_decisions:
- issue: Ntụgharị δικαιοσύνη
  choice: ezi omume
  alternative: ikpe ziri ezi; ịdị n’ezi ụzọ
  rationale: N’ọnọdụ a, okwu ahụ metụtara ịta ahụhụ n’ihi ibi ndụ ziri ezi. “Ezi omume” bụ okwu Igbo a na-aghọta ngwa ngwa nke na-echekwa akụkụ omume na nke okwukwe, n’ebughị ya naanị n’akụkụ ikpe ziri ezi nke ọha.
- issue: Ambiguity dị na τὸν φόβον αὐτῶν
  choice: egwu ha
  alternative: ịtụ ha egwu; ihe ha na-atụ egwu
  rationale: Greek ahụ na-ekwe ka αὐτῶν bụrụ egwu ha na-akpata ma ọ bụ egwu ha onwe ha nwere. Isi ederede na-ahapụ ambiguity ahụ, ebe nkọwa ala peeji na-akọwa nhọrọ ndị ahụ, ma na-echekwa njikọ okwu ya na Aịzaya 8:12.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji plural “unu” mee ka adreesị ahụ doo anya. E debere ambiguity nke okwu Grik “egwu ha” ma kọwaa ya n’ala peeji.
