  source_fidelity: 'The translation accurately conveys the comparative construction: it is better to suffer in connection with doing good than in connection with doing evil. “N’ihi ime” appropriately represents a permissible causal construal of the paired participles, while footnote a responsibly records the contextual (“mgbe”) alternative. “Ma ọ bụrụ na uche Chineke achọọ otú ahụ” preserves the conditional force of εἰ with the optative and reflects the Greek’s deliberate association of God’s will with willing, without settling questions of divine causation.'
