id: 1PE.3.17
reference: 1 Peter 3:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἀγαθοποιοῦντας, εἰ θέλοι τὸ θέλημα τοῦ θεοῦ, πάσχειν ἢ κακοποιοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/017.yaml
  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: ig
  text: N’ihi na ọ ka mma ịta ahụhụ n’ihi ime ezi ihe[a], ma ọ bụrụ na uche Chineke achọọ otú ahụ[b], karịa ịta ahụhụ n’ihi ime ihe ọjọọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịta ahụhụ mgbe unu na-eme ezi ihe … karịa mgbe unu na-eme ihe ọjọọ.” Akụkụ-okwu Grik ndị a nwere ike igosi ihe kpatara ahụhụ ahụ (“n’ihi”) ma ọ bụ ọnọdụ a nọ na ya (“mgbe”).
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, Grik kwuru, “ma ọ bụrụ na uche Chineke achọọ ya.” Nke a bụ nkwupụta siri ike nke jikọtara okwu “uche” na “ịchọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: ọ ka mma
  rationale: 'Nke a na-egosipụta ntụnyere ahụ n’ụzọ Igbo si ekwu ya nke ọma: ‘ọ ka mma … karịa …’.'
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe bu ya ụzọ dịka nkọwa ma ọ bụ ihe kpatara ndụmọdụ ahụ.
- source_word: ἀγαθοποιοῦντας
  choice: n’ihi ime ezi ihe
  rationale: Ọ na-edobe ihe dị iche n’etiti ime ezi ihe na ime ihe ọjọọ. Akụkụ-okwu Grik a nwekwara ike ịkọ ọnọdụ mmadụ nọ na ya, ya mere e debere ụzọ ọzọ na nkọwa ala peeji.
- source_word: εἰ θέλοι
  choice: ma ọ bụrụ na … achọọ
  rationale: ‘Ma ọ bụrụ’ tinyere ụdị ‘achọọ’ na-egosipụta na ọnọdụ a bụ ihe nwere ike ịdị, ọ bụghị nkwupụta na ọ ga-abụrịrị otú ahụ.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: uche Chineke
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa nsọpụrụ isi kwuo ‘the will of God’.
- source_word: πάσχειν
  choice: ịta ahụhụ
  rationale: Ọ bụ ntụgharị Igbo kwụ ọtọ ma bụrụkwa nke a na-aghọta nke ọma maka ịnata ma ọ bụ ịnagide ahụhụ.
- source_word: ἢ
  choice: karịa
  rationale: Ọ dabara n’usoro ntụnyere Igbo ‘ọ ka mma … karịa …’.
- source_word: κακοποιοῦντας
  choice: n’ihi ime ihe ọjọọ
  rationale: Ọ na-eme ka ọdịiche ya na ‘ime ezi ihe’ pụta ìhè ma na-edobe nhazi ahịrịokwu abụọ ahụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ahụhụ na uche Chineke
  choice: Amaokwu ahụ kwuru na ịta ahụhụ mgbe mmadụ na-eme ezi ihe nwere ike ịdị n’ime uche Chineke, ma ọ kọwaghị kpọmkwem otú uche Chineke si metụta ahụhụ ahụ.
  alternative: Ịsị na Chineke kpebiri ahụhụ ọ bụla n’ụzọ zuru ezu, ma ọ bụ na nanị ihe ọ na-eme bụ ikwe ka ahụhụ mee n’enweghị aka ọ bụla o tinyere na ya.
  rationale: Okwu Grik εἰ θέλοι τὸ θέλημα τοῦ θεοῦ na-ezo aka n’uche Chineke n’ụzọ nwere ọnọdụ, ma ọ naghị edozi arụmụka sara mbara banyere ikpebi ihe na ikwe ka ihe mee. Ya mere, ntụgharị ahụ na-edobe esemokwu nkà mmụta okpukpe ahụ n’enweghị ịkwado ozizi otu ụka.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị mfe nghọta ma nwee nsọpụrụ. Ahịrịokwu ahụ na-edobe ntụnyere doro anya ‘ọ ka mma … karịa …’, ọnọdụ nwere ike ịdị nke εἰ θέλοι, na ikwughachi echiche ‘uche/ịchọ’ n’ụzọ Igbo na-ada nke ọma.
