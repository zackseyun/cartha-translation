id: 1PE.3.7
reference: 1 Peter 3:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: ig
  text: N'otu aka ahụ, unu ndị di, binu na ndị nwunye unu n'ụzọ nghọta,[a] na-enye ha nsọpụrụ dịka arịa nwanyị ka esighị ike,[b] dịka ndị unu na ha ga-eketa amara nke ndụ,[c] ka a ghara igbochi ekpere unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “dịka ihe ọmụma si dị.”
    reason: lexical_alternative
  - marker: b
    text: “Arịa nwanyị ka esighị ike” bụ ihe atụ nke nwere ike izo aka n'adịghị ike anụ ahụ ma ọ bụ n'ọnọdụ ọha na-eme ka nwanyị dị mfe imerụ ahụ; ọ pụtaghị na nwanyị abaghị uru karịa nwoke. Okwu na-esochi ya na-ekwu na ndị nwunye sokwa bụrụ ndị ga-eketa amara nke ndụ.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “ndị unu na ha ga-eso keta amara nke ndụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: unu ndị bụ di
  rationale: N'usoro ndụ ezinaụlọ nke malitere site n'ịgwa ndị nwunye okwu na 3:1, okwu a na-ezo aka n'ebe ndị di nọ, ọ bụghị ụmụ nwoke niile.
- source_word: ὁμοίως
  choice: N'otu aka ahụ
  rationale: Ọ na-edobe njikọ na ndụmọdụ ndị bu ụzọ ma na-egosipụta ike ntụnyere nke okwu Grik ahụ.
- source_word: συνοικοῦντες κατὰ γνῶσιν
  choice: soronụ ndị nwunye unu biri n'ụzọ nghọta
  rationale: Nke a na-egosipụta ibi ndụ alụmdi na nwunye ọnụ n'ụzọ ihe ọmụma na nghọta na-eduzi, n'Igbo dị ire ma doo anya.
- source_word: ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ
  choice: dịka onye bụ arịa na-esighị ike dịka unu
  rationale: A hapụrụ ihe atụ ahụ bụ 'arịa' na ntụnyere adịghị ike, ma e gosighị ya dịka enweghị nsọpụrụ ma ọ bụ ịbụ onye dị ala n'ụzọ ime mmụọ.
- source_word: ἀπονέμοντες τιμήν
  choice: na-enye nwanyị nsọpụrụ
  rationale: Nke a na-egosi inye ya nsọpụrụ kwesịrị ya n'okwu Igbo dị mfe ma dị ugwu.
- source_word: συγκληρονόμοις χάριτος ζωῆς
  choice: unu na ha bụkwa ndị ga-eketa amara nke ndụ
  rationale: Ọ na-egosi na ndị nwunye na ndị di so n'otu ihe nketa ahụ, ma na-ahapụ njikọ dị n'etiti amara na ndụ n'obosara ya.
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν
  choice: ka a ghara igbochi ekpere unu
  rationale: Nke a na-edobe ebumnuche ma ọ bụ nsonaazụ na olu nnabata nke okwu Grik ahụ.
theological_decisions:
- issue: Ihe 'arịa na-esighị ike' pụtara
  choice: E debere ya dịka ihe atụ nke adịghị ike e jiri tụnyere nke ndị di, na-enweghị ịkọwa ya dịka ịdị ala n'uru ma ọ bụ n'ọnọdụ ime mmụọ.
  alternative: Ọ pụrụ izo aka kpọmkwem n'adịghị ike nke anụ ahụ ma ọ bụ n'ọnọdụ ọha na-eme ka nwanyị dị mfe imerụ ahụ.
  rationale: Amaokwu ahụ n'onwe ya na-enye iwu ka a sọpụrụ nwanyị ma na-akpọ ya onye ya na di ga-eketa amara nke ndụ; ya mere, e kwesịghị itinye nkọwa dị warara n'ime isi amaokwu ahụ.
- issue: Ndị ha na di ga-eketa ihe
  choice: Ndị nwunye so ndị di bụrụ ndị ga-eketa amara nke ndụ.
  alternative: Enwere ike ịghọta ya dịka ndụ ebighị ebi kpọmkwem, ma ọ bụ onyinye ndụ nke amara Chineke n'obosara ya.
  rationale: Okwu Grik ahụ na-ekwusi ike n'ịkekọrịta otu ihe nketa ahụ, ma ọ naghị akọwa 'ndụ' karịa nke ahụ.
- issue: Njikọ nke ὡς καὶ na iwu inye nsọpụrụ
  choice: A sụgharịrị ya 'ebe unu na ha bụkwa' iji gosi ọnọdụ ma ọ bụ ihe ndabere, na-etinyeghị ihe kpatara ya n'ike karịa ka Grik kwuru.
  alternative: '''n''ihi na unu na ha bụkwa'' ga-eme ka njikọ ahụ bụrụ nke ihe kpatara ya kpọmkwem.'
  rationale: Nke a na-echekwa ntakịrị nghọta abụọ dị na ὡς καὶ kama idozi ya n'ụzọ otu naanị.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ 'n'ụzọ nghọta' kama ntụgharị siri ike nke 'dịka ihe ọmụma si dị,' ma debe nke ikpeazụ n'okpuru ala peeji. E debere ihe atụ 'arịa' n'ihi na ọ bụ akụkụ dị mkpa nke okwu mbụ, tinyekwa nkọwa ka a ghara ịghọta ya dịka iweda ndị inyom ala.
