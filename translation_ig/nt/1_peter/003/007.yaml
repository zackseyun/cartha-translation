    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “ndị unu na ha ga-eso keta amara nke ndụ.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the reversed negation and restores the Greek comparative in the “weaker vessel” metaphor, replaces an unidiomatic exhortation with natural Standard Igbo, and renders the two ὡς clauses in parallel. It does not define the metaphor’s disputed scope or narrow “the grace of life.”
