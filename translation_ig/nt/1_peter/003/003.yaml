base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: ig
  text: Ka ihe ịchọ mma unu ghara ịbụ nke dị n’èzí—ịkpa ntutu isi[a], iyikwasa ihe ịchọ mma ọlaedo, ma ọ bụ iyiri uwe—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Ka ihe ịchọ mma unu ghara ịbụ nke dị n’èzí: ntutu isi a kpara akpa, ihe ịchọ mma ọlaedo a yikwasara, ma ọ bụ iyiri uwe.” Amaokwu na-esote na-atụnyere ihe ịchọ mma nke dị n’èzí na mmadụ zoro ezo nke obi.'
    reason: Alternative rendering; it preserves the list while expressing the hair-braiding and gold-ornament phrases as resultative descriptions. The contextual note identifies the literary contrast without adding ‘naanị’ (‘only’) to the main text or imposing an absolute or denominational interpretation.
lexical_decisions:
- source_word: ὧν
  choice: unu / ihe ịchọ mma unu
  rationale: The genitive plural relative pronoun refers back to the women or wives addressed in the preceding verse. Recasting it with the second-person plural possessive is natural and clear in Igbo.
- source_word: ἔστω οὐχ
  choice: Unu ekwela ka ... bụrụ
  rationale: This idiomatic Igbo prohibitive construction preserves the force of the third-person present imperative negated by οὐχ.
- source_word: ὁ ἔξωθεν ... κόσμος
  choice: ihe ịchọ mma ... nke dị n’èzí
  rationale: Here κόσμος means adornment or ornamentation, not the world. Nke dị n’èzí preserves the contrast with the hidden inner person in verse 4.
- source_word: ἐμπλοκῆς τριχῶν
  choice: ịkpa ntutu isi
  rationale: This naturally expresses the action of braiding hair while retaining the nominal parallelism of the Greek list.
- source_word: περιθέσεως χρυσίων
  choice: iyikwasị ihe ịchọ mma e ji ọlaedo mee
  rationale: περίθεσις denotes putting or placing something around oneself, while χρυσίων denotes gold objects or ornaments. The Igbo wording makes the implied ornaments explicit without narrowing them to one type of jewelry.
- source_word: ἢ ἐνδύσεως ἱματίων
  choice: ma ọ bụ iyiri uwe
  rationale: This is a natural Igbo rendering of putting on or wearing garments and preserves the final item in the parallel list.
theological_decisions:
- issue: Whether the verse absolutely prohibits grooming, jewelry, and clothing or subordinates outward adornment to inward character
  choice: The main text preserves the Greek negated exhortation and its outward-versus-inward contrast without inserting ‘only.’
  alternative: Add ‘naanị’ (‘merely/only’) in the main text to state the comparative sense explicitly.
  rationale: The syntax itself is strongly negative, while verse 4 supplies the positive contrast. Since a literal absolute reading would also prohibit putting on clothing, the footnote identifies the contextual comparative sense without silently adding a limiting word to the main text.
translation_notes:
  register: Standard Igbo; contemporary, dignified, and accessible. The repeated verbal nouns preserve the list structure, and the final dash signals that the sentence and contrast continue into verse 4.
