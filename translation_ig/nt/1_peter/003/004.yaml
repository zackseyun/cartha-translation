reference: 1 Peter 3:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος ἐν τῷ ἀφθάρτῳ τοῦ ⸂πραέως καὶ ἡσυχίου⸃ πνεύματος, ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/004.yaml
  text: but the hidden person of the heart[a], in the imperishable beauty of a gentle and quiet spirit[c][b], which is very precious before God.
translation:
  language: ig
  text: kama, onye ahụ zoro ezo n’obi[a], n’ịma mma[b] na-adịghị emebi emebi nke mmụọ dị nwayọọ ma dị jụụ[c], nke dị oké ọnụ ahịa n’ihu Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ dabara nnọọ n’usoro Grik, ‘mmadụ ahụ zoro ezo nke obi.’ Okwu Grik a na-ezo aka n’onwe ime mmadụ, ọ bụghị nwoke kpọmkwem.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, ‘n’ihe na-adịghị emebi emebi nke mmụọ dị nwayọọ ma dị jụụ.’ E tinyere ‘ịma mma’ n’ihi ọdịiche ya na ihe ịchọ mma mpụga a kpọrọ aha n’amaokwu gara aga.
    reason: lexical_alternative
  - marker: c
    text: ‘Dị jụụ’ pụtara inwe obi dị n’udo na àgwà na-adịghị akpasu ọgba aghara; ọ pụtaghị na onye ahụ ga-agbachi nkịtị mgbe niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: onye ahụ zoro ezo n’ime obi
  rationale: Nke a na-egosipụta mmadụ ime, ọ bụghị nwoke kpọmkwem. ‘Onye’ dabara n’Igbo karịa ntụgharị okwu n’otu n’otu nke ga-abụ ‘mmadụ zoro ezo nke obi,’ ma ọ ka na-edobe echiche nke ihe e zoro ezo.
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: n’ịma mma na-adịghị emebi emebi
  rationale: Akụkụ Grik a hapụrụ aha ihe a na-ekwu maka ya n’ezoghị ọnụ. N’ihi ọdịiche dị n’etiti ihe ịchọ mma mpụga n’amaokwu gara aga na nke ime ebe a, ‘ịma mma’ na-eme ka okwu ahụ doo anya ma na-edobe ‘ihe na-adịghị emebi emebi.’
- source_word: πραέως
  choice: dị nwayọọ
  rationale: ‘Dị nwayọọ’ bụ okwu Igbo doro anya maka ịdị umeala n’omume na adịghị ike ime ihe ike, n’enweghị echiche na onye ahụ adịghị ike.
- source_word: ἡσυχίου
  choice: dị jụụ
  rationale: ‘Dị jụụ’ na-egosi obi dị n’udo na omume na-adịghị akpasu ọgba aghara; ọ pụtaghị na mmadụ agaghị ekwu okwu.
- source_word: πνεύματος
  choice: mmụọ
  rationale: ‘Mmụọ’ na-edobe okwu gbasara ihe dị n’ime mmadụ nke ederede Grik ji mee ihe, kama ịgbanwe ya kpamkpam ka ọ bụrụ nanị ‘omume’ ma ọ bụ ‘àgwà.’
- source_word: ὅ ἐστιν
  choice: nke dị
  rationale: Nkebi njikọ a na-ejikọta uru Chineke na-enye ihe a kọwara tupu ya, n’ebughị ụzọ kpebie n’ụzọ siri ike ma ọ na-ezo aka nanị na ‘mmụọ’ ka ọ bụ àgwà ahụ dum.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: n’ihu Chineke
  rationale: Nke a bụ ntụgharị kpọmkwem ma bụrụkwa okwu Igbo kwụ ọtọ nke na-egosi otú Chineke si ele ma na-atụle ihe ahụ.
- source_word: πολυτελές
  choice: dị oké ọnụ ahịa
  rationale: Okwu a na-egosi ihe bara uru nke ukwuu. ‘Dị oké ọnụ ahịa’ na-egosipụta ike okwu ahụ ma kwekọọ na ọdịiche ya na ihe ịchọ mma dị oke ọnụ.
theological_decisions:
- issue: Okwu banyere mmadụ n’amaokwu a na-agwa ụmụ nwanyị okwu
  choice: Jiri ‘onye ahụ zoro ezo n’ime obi,’ ọ bụghị okwu ga-egosi nwoke kpọmkwem.
  alternative: mmadụ ahụ zoro ezo nke obi; nwoke ahụ zoro ezo nke obi
  rationale: ἄνθρωπος ebe a na-ezo aka n’onwe ime mmadụ, ọ bụghị n’ịbụ nwoke. ‘Onye’ na-edobe izugbe okwu Grik ma zere ime ka onye na-agụ ya chee na ọ na-ekwu banyere nwoke.
- issue: Itinye aha a ghọtara ma a kpọghị ya aha n’akụkụ ἀφθάρτῳ
  choice: 'Tinye ‘ịma mma’: ‘n’ịma mma na-adịghị emebi emebi.’'
  alternative: n’ihe na-adịghị emebi emebi; n’àgwà na-adịghị emebi emebi
  rationale: Grik dị mkpirikpi ma hapụ aha ahụ. Ebe amaokwu nke atọ kwuru banyere ịchọ mma mpụga, ‘ịma mma’ na-eme ka ọdịiche dị n’etiti mpụga na ime pụta ìhè n’enweghị ịgbanwe isi echiche ahụ.
- issue: Ihe njikọ ὅ na-ezo aka na ya
  choice: Jiri ‘nke dị oké ọnụ ahịa’ ka njikọ ahụ nọgide ghere oghe dịka o kwere mee.
  alternative: mmụọ ahụ bụ ihe dị oké ọnụ ahịa; ịma mma ahụ bụ ihe dị oké ọnụ ahịa
  rationale: Ụdị Grik nwere ike ime ka onye na-agụ ya jikọta uru ahụ na mmụọ a kọwara ma ọ bụ na àgwà ahụ dum. Tụgharị ya n’enweghị ikwughachi otu aha na-ezere idozi ihe ederede ahụ na-edozighị n’ụzọ doro nnọọ anya.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘onye ahụ zoro ezo n’ime obi’ maka ịdị n’usoro Igbo, ‘dị nwayọọ ma dị jụụ’ maka àgwà ime mmadụ, na ‘n’ihu Chineke’ iji debe okwu nyocha Chineke dị na Grik. Akara nkọwa ụkwụ [a], [b], na [c] niile dị n’ederede isi.
