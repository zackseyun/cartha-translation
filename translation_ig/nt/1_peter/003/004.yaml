    issue: The phrase ‘kama ka ọ bụrụ onye ahụ zoro ezo n’ime obi’ is syntactically awkward and has an unexpressed subject in Igbo.
    rationale: Although the Greek is elliptical because it continues the contrast from the preceding verse, this particular Igbo construction reads as an incomplete directive. ‘Kama, onye ahụ zoro ezo n’obi’ retains the contextual ellipsis without introducing an awkward finite construction.
