revisions:
- from: N’ihi na, “Onye chọrọ ịhụ ndụ n’anya na ịhụ ụbọchị ọma ga-akwụsị ire ya ikwu ihe ọjọọ, gbochiekwa egbugbere ọnụ ya ikwu aghụghọ[a].”
  to: N’ihi na, “Onye chọrọ ịhụ ndụ n’anya na ịhụ ụbọchị ọma, ka ọ gbochie ire ya ikwu ihe ọjọọ, gbochiekwa egbugbere ọnụ ya ka ha ghara ikwu aghụghọ[a].”
  rationale: The revision replaces the future-like wording with a direct Igbo exhortation matching the Greek imperative, corrects the tongue-restraint construction, and makes the negative sense of the lips clause explicit. It preserves the generic singular, the Psalm-like imagery, and the broad sense of δόλος without imposing a theological interpretation.
