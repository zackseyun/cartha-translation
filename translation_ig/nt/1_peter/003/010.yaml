id: 1PE.3.10
reference: 1 Peter 3:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν ⸀γλῶσσαν ἀπὸ κακοῦ καὶ ⸀χείλη τοῦ μὴ λαλῆσαι δόλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/010.yaml
  text: For the one who wants to love life and see good days must keep his tongue from evil and his lips from speaking deceit[a].
translation:
  language: ig
  text: N’ihi na, “Onye chọrọ ịhụ ndụ n’anya na ịhụ ụbọchị ọma, ka ọ gbochie ire ya ikwu ihe ọjọọ, gbochiekwa egbugbere ọnụ ya ka ha ghara ikwu aghụghọ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwu nduhie.” Okwu Grik ahụ nwere ike ịpụta aghụghọ, nduhie, ma ọ bụ aghụghọ a na-ezo ezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: Onye chọrọ
  rationale: Nkebiokwu a na-arụ ọrụ dị ka aha ma na-ezo aka n’ozuzu nye onye ọ bụla; “Onye chọrọ” bụ Igbo nkịtị nke na-edobe echiche ahụ n’enweghị ịkọwa nwoke ma ọ bụ nwaanyị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe Akwụkwọ Nsọ kwuru iji kwado ma kọwaa ndụmọdụ dị n’amaokwu bu ụzọ.
- source_word: ζωὴν ἀγαπᾶν
  choice: ịhụ ndụ n’anya
  rationale: Nke a na-esochi okwu Grik nke ọma ma bụrụkwa okwu Igbo doro anya, n’etinyeghị nnọchiaha nke na-adịghị na isi mmalite.
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: na ịhụ ụbọchị ọma
  rationale: E debere ihe oyiyi nke “ịhụ,” ebe “ụbọchị ọma” sara mbara karịa naanị ụbọchị ịba ọgaranya.
- source_word: παυσάτω
  choice: ga-akwụsị
  rationale: Aorist imperative ahụ bụ iwu ka onye ahụ kwụsị omume ahụ; “ga-akwụsị” na nkebiokwu ilu a na-enye iwu siri ike n’Igbo eke, n’agbanyeghị na “ka ọ kwụsị” bụ ntụgharị ka nso n’usoro.
- source_word: τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: ire ya ikwu ihe ọjọọ
  rationale: N’Igbo, ihe a na-egbochi ire ime kwesịrị ikwupụta nke ọma; agbakwunyere “ikwu” site n’ihe okwu ahụ pụtara n’ebe a, ebe “ihe ọjọọ” na-edobe obosara nke κακόν.
- source_word: χείλη
  choice: egbugbere ọnụ ya
  rationale: E debere ihe oyiyi ahụ n’ụdị ọtụtụ dịka o kwere n’usoro Igbo, ya na nnọchiaha na-egosi akụkụ ahụ onye ahụ.
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: ikwu aghụghọ
  rationale: Ọ na-egosi ihe a ga-egbochi egbugbere ọnụ ime. “Aghụghọ” bụ okwu Igbo a na-aghọta nke gụnyere okwu nduhie ma ọ bụ ụzọ aghụghọ.
theological_decisions:
- issue: Onye otu e ji anọchi anya mmadụ niile na enweghị ịkpa ókè nwoke na nwaanyị
  choice: Jiri “Onye chọrọ” na “ya,” bụ́ okwu na-emetụtaghị nwoke ma ọ bụ nwaanyị.
  alternative: Iji okwu kpọmkwem maka nwoke, ma ọ bụ ime isiokwu ahụ ọtụtụ.
  rationale: Grik bụ otu onye a na-eji anọchi anya onye ọ bụla. Igbo “onye” na “ya” na-edobe ma ịdị otu ahụ ma ịdị n’ozuzu ya n’enweghị itinye nwoke naanị.
- issue: Iwu dị na παυσάτω
  choice: 'Gosipụta ya dịka ihe onye chọrọ ndụ ọma ga-eme: “ga-akwụsị ... gbochiekwa.”'
  alternative: “Ka ọ kwụsị ... ka ọ ghara ...”
  rationale: Nke a na-edobe ike iwu na njikọ ya na ọchịchọ ịhụ ndụ n’anya na ịhụ ụbọchị ọma, n’emeghị ya ka ọ bụrụ nkwa na omume ọma ga-eweta ọganihu ihe onwunwe.
translation_notes:
  register: Ejiri Igbo Standard nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro uri nke amaokwu e hotara, ihe oyiyi “ire” na “egbugbere ọnụ,” na obosara nke “ụbọchị ọma.”
