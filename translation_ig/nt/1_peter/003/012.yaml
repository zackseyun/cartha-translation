id: 1PE.3.12
reference: 1 Peter 3:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: ig
  text: N’ihi na anya Onyenweanyị dị n’ahụ ndị ezi omume, ntị ya na-egekwa ekpere ha ntị,[a] ma ihu Onyenweanyị dị megide ndị na-eme ihe ọjọọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ntị ya gaa n’ekpere ha”; Grik ahụ na-ekwu n’ụzọ mkpirikpi. Nsụgharị a na-egosi na ọ na-ege ekpere ha ntị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-egosi ihe kpatara ma ọ bụ ihe Akwụkwọ Nsọ ji akwado okwu ndị bu ya ụzọ; nsụgharị a na-edobe ike causal nke njikọ ahụ.
- source_word: ὀφθαλμοὶ κυρίου
  choice: anya Onyenweanyị
  rationale: A hapụrụ ihe atụ nke anya Chineke dịka ọ dị n’asụsụ mbụ na n’Abụ Ọma e hotara.
- source_word: ἐπὶ δικαίους
  choice: dị n’ebe ndị ezi omume nọ
  rationale: ἐπί na-egosi na nlekọta na uche Onyenweanyị chere ihu n’ebe ndị ezi omume nọ; okwu a bụ Igbo eke ma ọ naghị akọwakwu ihe ederede ahụ karịa ka ọ dị.
- source_word: ὦτα αὐτοῦ
  choice: ntị ya
  rationale: Nsụgharị kwụ ọtọ nke na-edobe ihe atụ ahụ na myirịta ya na ‘anya Onyenweanyị.’
- source_word: εἰς δέησιν αὐτῶν
  choice: dịkwa n’ekpere ha
  rationale: Grik ahụ bụ okwu e mere mkpụmkpụ, nke pụtara n’ụzọ nkịtị ‘ntị ya ruo n’ekpere ha’; Igbo a na-egosi ntị chere ekpere ahụ ihu n’etinyeghị okwu doro anya nke na-ekwu na a zara ya.
- source_word: πρόσωπον δὲ κυρίου
  choice: ma ihu Onyenweanyị
  rationale: ‘Ihu’ na-edobe ihe atụ sitere n’Abụ Ọma, ebe ‘ma’ na-egosi ọdịiche dị n’etiti ihu ọma nye ndị ezi omume na mmegide ndị na-eme ihe ọjọọ.
- source_word: ἐπὶ ποιοῦντας κακά
  choice: dị megide ndị na-eme ihe ọjọọ
  rationale: N’ahịrị na-adịghị mma a, ἐπί na-egosi mmegide; ‘ndị na-eme ihe ọjọọ’ na-edobe ike omume nke participle ahụ.
theological_decisions:
- issue: Iji anya, ntị, na ihu kọwaa omume Chineke
  choice: Idobe ihe atụ atọ ahụ n’onwe ha
  alternative: Ịkọwa ha dịka ‘Onyenweanyị na-elekọta, na-ege ntị, ma na-emegide’
  rationale: Ihe atụ ndị a bụ akụkụ nke ike edemede na nkà mmụta okpukpe nke amaokwu ahụ na nke Abụ Ọma ọ na-ehota; idobe ha anaghị ekpebi na Chineke nwere ahụ mmadụ.
- issue: Ma ‘ntị ya dị n’ekpere ha’ pụtara naanị ige ntị ka ọ bụ ịza ekpere
  choice: Idobe okwu ahụ dịka uche Chineke chere n’ekpere ha ihu
  alternative: ‘Ọ na-aza ekpere ha’
  rationale: δέησις na ahịrịokwu elliptical ahụ na-ekwu banyere ntị Chineke n’arịrịọ ha, ma ọ naghị ekwu kpọmkwem n’ebe a na azịza ahụ ga-adị n’ụdị ọ bụla akọwapụtara.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. ‘Onyenweanyị’ na-anọchi κύριος; e debere usoro ihe atụ nke anya, ntị, na ihu. Akara ndetu [a] pụtara n’ederede isi dịka iwu si dị.
