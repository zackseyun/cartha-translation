revisions:
- from: N’ihi na anya Onyenweanyị dị n’ebe ndị ezi omume nọ, ntị ya dịkwa n’ekpere ha,[a] ma ihu Onyenweanyị dị megide ndị na-eme ihe ọjọọ.
  to: N’ihi na anya Onyenweanyị dị n’ahụ ndị ezi omume, ntị ya na-egekwa ekpere ha ntị,[a] ma ihu Onyenweanyị dị megide ndị na-eme ihe ọjọọ.
  rationale: The revision improves idiomatic Standard Igbo at the two points where the draft’s close structural imitation of Greek obscures the meaning. It retains the imagery of the Lord’s eyes, ears, and face, the causal connection, and the contrastive force of “ma,” without interpreting the verse as a promise of a particular manner of answered prayer.
  reviewer_model: gpt-5.6-terra
