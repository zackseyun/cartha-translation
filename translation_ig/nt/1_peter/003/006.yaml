review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the comparison with Sarah, her obedience to Abraham, her respectful designation of him as “onyenwe m,” the resultant filial identity, and the paired participles with a plausible conditional force. “Ihe ọ bụla na-eyi egwu” appropriately conveys the broad force of μηδεμίαν πτόησιν without restricting it to an inward feeling.
  naturalness: 'The verse is clear and suitably dignified in Standard Igbo. The main sentence is natural enough; the footnote’s final alternative, however, is unidiomatic and reverses the intended relationship: “ihe ọ bụla na-atụ ụjọ” literally suggests something that itself is afraid, rather than something frightening.'
  terminology: “Sera,” “Ebraham,” “rubere ... isi,” “onyenwe m,” and “ụmụ ya” are appropriate. The lower-case respectful title does not identify Abraham with God. The lexical-alternative note should use an idiomatic expression for “anything frightening.”
  issues:
  - severity: medium
    issue: The final footnote alternative is grammatically and semantically defective.
    rationale: “Ihe ọ bụla na-atụ ụjọ” ordinarily means ‘anything that is afraid.’ For the alternative sense ‘anything frightening,’ Igbo needs an expressed affected person, such as “ihe ọ bụla na-atụ mmadụ ụjọ.”
  revised_text: dịka Sera rubere Ebraham isi, na-akpọ ya “onyenwe m.” Unu aghọọla ụmụ ya ma ọ bụrụ na unu na-eme ihe ọma, gharakwa ịtụ egwu ihe ọ bụla na-eyi egwu.[a]
  revised_footnotes:
