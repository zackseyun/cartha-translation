    reason: lexical_alternative
  revision_rationale: Only the footnote is revised. It now gives a natural Standard Igbo equivalent for the lexical alternative ‘anything frightening,’ while preserving the draft’s source-faithful main text and its ambiguity concerning πτόησις.
