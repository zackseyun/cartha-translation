id: 1PE.3.6
reference: 1 Peter 3:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς Σάρρα ⸀ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: ig
  text: dịka Sera rubere Ebraham isi, na-akpọ ya “onyenwe m.” Unu aghọọla ụmụ ya ma ọ bụrụ na unu na-eme ihe ọma, gharakwa ịtụ egwu ihe ọ bụla na-eyi egwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụjọ ọ bụla,” ma ọ bụ “ihe ọ bụla na-atụ mmadụ ụjọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: dịka
  rationale: Ọ na-ewebata Sera dịka ihe atụ kwekọrọ n’ọdụmọdụ dị n’ihu; “dịka” na-egosipụta ntụnyere ahụ n’Igbo nkịtị.
- source_word: ὑπήκουσεν
  choice: rubere ... isi
  rationale: Akpaalaokwu Igbo a na-egosi irube isi nke ọma, ma kwekọọ n’echiche nkịtị nke ὑπακούω n’ebe a.
- source_word: κύριον
  choice: onyenwe m
  rationale: N’ebe a ọ bụ okwu nkwanye ùgwù Sera ji kpọọ Ebraham, ọ bụghị aha Chineke. Ịtinye “m” na-eme ka okwu ọ kpọrọ ya bụrụ nke sitere n’ọnụ ya n’Igbo dị ndụ.
- source_word: καλοῦσα
  choice: na-akpọ ya
  rationale: Ọ na-egosi ụzọ Sera si gosipụta nrubeisi ya, ma na-echekwa omume ikpọ aha dị na participle Grik ahụ.
- source_word: ἧς ... τέκνα
  choice: ụmụ ya
  rationale: Ọ na-echekwa ihe atụ nke mmekọrịta nne na ụmụ, na-ezo aka n’ebe Sera nọ.
- source_word: ἐγενήθητε
  choice: Unu aghọọla
  rationale: Ụdị perfect Igbo a na-egosi na ha batara n’ọnọdụ ahụ, ọnọdụ ahụ ka dịkwa ugbu a.
- source_word: ἀγαθοποιοῦσαι
  choice: ma ọ bụrụ na unu na-eme ihe ọma
  rationale: A kọwara participle ahụ dịka ọnọdụ n’Igbo ka njikọ ya na ahịrịokwu bụ isi doo anya, ebe “na-eme” na-egosi omume na-aga n’ihu.
- source_word: μὴ φοβούμεναι
  choice: ghara ịtụ egwu
  rationale: Ọ na-enye iwu/ọnọdụ omume na-aga n’ihu n’Igbo nkịtị, ma jikọta ya na ime ihe ọma.
- source_word: μηδεμίαν πτόησιν
  choice: ihe ọ bụla na-eyi egwu
  rationale: πτόησις nwere ike ịbụ ụjọ, ihe na-akpata ụjọ, ma ọ bụ iyi egwu. Nsụgharị a na-echekwa obosara okwu ahụ n’enweghị ịkọwa ya naanị dịka mmetụta ime obi.
theological_decisions:
- issue: Nrubeisi Sera dị ka ihe atụ nye ndị nwunye kwere ekwe
  choice: A sụgharịrị ὑπήκουσεν kpọmkwem dịka “rubere ... isi,” n’enweghị ịgbasa amaokwu ahụ ka ọ bụrụ ozizi zuru ezu banyere alụmdi na nwunye.
  alternative: Iji okwu dị nro dịka “doro onwe ya n’okpuru” ma ọ bụ “gere ya ntị.”
  rationale: Ihe odide Grik kwuru nrubeisi n'ụzọ doro anya. E kwesịghị ime ka okwu ahụ dị nro n’ihi echiche omenala ma ọ bụ ozizi, ma e kwesịghịkwa itinye ihe amaokwu ahụ ekwughị.
- issue: Njikọ participle ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι na ἐγενήθητε
  choice: 'E gosipụtara ya dịka ọnọdụ: “ma ọ bụrụ na unu...”'
  alternative: 'Ịsụgharị ya dịka nkọwa: “mgbe unu na-eme ihe ọma...”'
  rationale: Njikọ ahụ nwere ike ibu nkọwa ma ọ bụ nwee ike ọnọdụ. N’ọnọdụ ndụmọdụ a, “ma ọ bụrụ na” na-egosipụta ike ọnọdụ bara uru, ma na-ahapụ esemokwu dị n’etiti njirimara ha na omume ha.
- issue: Ihe κύριον pụtara mgbe Sera kwuru ya banyere Ebraham
  choice: “onyenwe m,” dịka okwu nkwanye ùgwù mmadụ na-agwa di ya.
  alternative: “Onyenwe anyị,” nke nwere ike ịpụta aha Chineke, ma ọ bụ “nna ukwu,” nke nwere ike ịdị arọ karịa ihe dị n’ebe a.
  rationale: κύριος abụghị aha nsọ nye Chineke n’ebe a. “Onyenwe m” na-echekwa nkwanye ùgwù ahụ ma zere ịkọwa Ebraham dịka chi.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma doo onye nkịtị anya. “Rubere ... isi” bụ akpaalaokwu nkịtị maka nrubeisi; “onyenwe m” na-echekwa nkwanye ùgwù n’enweghị ime ya aha Chineke. Akara nkọwa ụkwụ [a] dị n’isiokwu ma kọwaa obosara πτόησις.
