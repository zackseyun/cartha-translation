  text: Καὶ τίς ὁ κακώσων ὑμᾶς ἐὰν τοῦ ἀγαθοῦ ⸀ζηλωταὶ γένησθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/013.yaml
  text: And who will harm you if you become zealous for what is good?[a]
translation:
  language: ig
  text: Ma ònye ga-emerụ unu ahụ ma ọ bụrụ na unu aghọọ ndị na-anụ ọkụ n’obi n’ihe ọma?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-achọsi ihe ọma ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Ọ bụkwa
  rationale: ‘-kwa’ na-ejikọta ajụjụ a na ndụmọdụ dị n’amaokwu bu ya ụzọ n’ụzọ Igbo na-aga were were.
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: onye ga-emerụ unu ahụ
  rationale: Nke a na-edobe ajụjụ nkwupụta ahụ na echiche ọdịnihu nke participle, ma na-eji okwu Igbo doro anya maka imerụ mmadụ ahụ.
- source_word: ἐὰν
  choice: ma ọ bụrụ na
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị egosi ọnọdụ nke nwere ike ime.
- source_word: τοῦ ἀγαθοῦ
  choice: ime ihe ọma
  rationale: Ọ bụ ezie na okwu Grik pụtara ‘ihe dị mma,’ ijikọ ya na ịnụ ọkụ n’obi dị ka ‘ime ihe ọma’ na-enye Igbo eke ma kwekọọ n’ọnọdụ nke omume ọma.
- source_word: ζηλωταὶ γένησθε
  choice: unu aghọọ ndị na-anụ ọkụ n’obi
  rationale: ‘Aghọọ’ na-echekwa echiche nke γένησθε banyere ịghọ, ebe ‘ndị na-anụ ọkụ n’obi’ na-egosi ike na ịnụ ọkụ n’obi nke ζηλωταί.
theological_decisions:
- issue: Ike ajụjụ nkwupụta ahụ n’ihe gbasara ịta ahụhụ n’ihi ezi omume
  choice: E debere ya dị ka ajụjụ nkwupụta na-enye obi ike, n’ekwughị na ọ dịghị mgbe ndị kwere ekwe ga-ata ahụhụ.
  alternative: Ịsụgharị ya dị ka nkwa zuru oke na ọ dịghị onye pụrụ imerụ ndị kwere ekwe ahụ n’ezie.
  rationale: Amaokwu ndị na-esote na-ekweta na ha pụrụ ịta ahụhụ n’ihi ezi omume; ya mere, nsụgharị ahụ na-edobe esemokwu ahụ kama idozi ya dịka nkwa nke enweghị nhụjuanya.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwụ ọtọ ma dị ùgwù. A na-eji ‘unu’ gosipụta na ὑμᾶς na γένησθε bụ ọtụtụ mmadụ.
