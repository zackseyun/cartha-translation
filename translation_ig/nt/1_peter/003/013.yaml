revisions:
- from: Ọ bụkwa onye ga-emerụ unu ahụ ma ọ bụrụ na unu aghọọ ndị na-anụ ọkụ n’obi ime ihe ọma?[a]
  to: Ma ònye ga-emerụ unu ahụ ma ọ bụrụ na unu aghọọ ndị na-anụ ọkụ n’obi n’ihe ọma?[a]
  rationale: The revision makes the question idiomatic in Standard Igbo and removes the added action sense from 'ime ihe ọma,' while preserving the Greek rhetorical force, future reference, plurality, conditionality, and the nuance of becoming zealous for what is good.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:15:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the rhetorical question, future sense (''ga-emerụ''), plural addressee, conditional construction, and ingressive sense of γένησθε (''aghọọ''). However, ''ime ihe ọma'' makes the Greek τοῦ ἀγαθοῦ more explicitly an activity (''doing good'') than the source states. The Greek is broader: ''what is good/the good.'''
  naturalness: '''Ọ bụkwa onye ...?'' is not the most natural way to open this Igbo rhetorical question. ''Ma ònye ...?'' is idiomatic Standard Igbo and adequately carries the connective Καὶ in context. ''Ndị na-anụ ọkụ n’obi n’ihe ọma'' is natural and directly expresses being zealous for what is good.'
  terminology: '''Emetụ/emerụ unu ahụ'' appropriately conveys κακώσων without narrowing it to a particular kind of injury. ''Ndị na-anụ ọkụ n’obi'' is a sound rendering of ζηλωταί. Retaining ''n’ihe ọma'' preserves the source’s broad, abstract reference better than ''ime ihe ọma.'''
  issues:
  - severity: medium
    issue: The rendering 'ime ihe ọma' adds an explicit verbal/action sense.
    rationale: τοῦ ἀγαθοῦ is literally and semantically 'what is good/the good.' Although the surrounding context concerns good conduct, the verse itself does not specify 'doing'; 'n’ihe ọma' retains the broader source wording.
  - severity: low
    issue: The opening 'Ọ bụkwa onye' is awkward in this interrogative context.
    rationale: A connective rhetorical question is more naturally expressed in Standard Igbo as 'Ma ònye ...?'.
  revised_text: Ma ònye ga-emerụ unu ahụ ma ọ bụrụ na unu aghọọ ndị na-anụ ọkụ n’obi n’ihe ọma?[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-achọsi ihe ọma ike.”
    reason: lexical_alternative
  revision_rationale: The revision makes the question idiomatic in Standard Igbo and removes the added action sense from 'ime ihe ọma,' while preserving the Greek rhetorical force, future reference, plurality, conditionality, and the nuance of becoming zealous for what is good.
