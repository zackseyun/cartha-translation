revisions:
- from: N'ikwekọ na nke ahụ, baptizim na-azọpụtakwa unu ugbu a—ọ bụghị iwepụ unyi dị n'anụ ahụ, kama ọ bụ ịrịọ Chineke maka akọnuche dị mma[a]—site ná mbilite n'ọnwụ Jizọs, onye bụ Mesaịa ahụ.
  to: Nke kwekọrọ na nke ahụ bụ baptizim, nke na-azọpụtakwa unu ugbu a—ọ bụghị iwepụ unyi dị n'anụ ahụ, kama ọ bụ ịrịọ Chineke maka akọnuche dị mma[a]—site ná mbilite n'ọnwụ Jizọs, onye bụ Mesaịa ahụ.
  rationale: The revision makes baptism explicitly the corresponding figure while preserving the source’s direct claim and theological restraint. It also corrects the footnote so that the debated ‘pledge’ sense is stated in comprehensible Standard Igbo and remains visibly alternative rather than being imposed on the main text.
