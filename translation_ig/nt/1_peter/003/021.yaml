id: 1PE.3.21
reference: 1 Peter 3:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃ ⸂καὶ ὑμᾶς ἀντίτυπον νῦν⸃ σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/021.yaml
  text: Corresponding to that[a], baptism now also saves you—not the removal of dirt from the flesh, but an appeal to God for a good conscience—through the resurrection of Jesus the Messiah,
translation:
  language: ig
  text: Nke kwekọrọ na nke ahụ bụ baptizim, nke na-azọpụtakwa unu ugbu a—ọ bụghị iwepụ unyi dị n'anụ ahụ, kama ọ bụ ịrịọ Chineke maka akọnuche dị mma[a]—site ná mbilite n'ọnwụ Jizọs, onye bụ Mesaịa ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nkwa e kwere Chineke nke akọnuche dị mma.” Okwu Grik a sụgharịrị “ịrịọ” (ἐπερώτημα) nwekwara ike ịpụta “nkwa” ma ọ bụ “azịza.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντίτυπον
  choice: N'ikwekọ na nke ahụ
  rationale: Nke a na-ejikọta baptizim na mmiri e kwuru okwu ya n'amaokwu bu ụzọ, ma ọ naghị eji okwu nkà mmụta okpukpe siri ike nke ndị nkịtị nwere ike ghara ịghọta.
- source_word: σῴζει
  choice: na-azọpụtakwa
  rationale: E debere nkwupụta ahụ kpọmkwem n'oge ugbu a, tinyekwa καί (‘kwa’), n'emeghị ka ihe Pita kwuru dị nro.
- source_word: βάπτισμα
  choice: baptizim
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka baptizim; a sụgharịghị ya dịka ịsa ahụ n'ihi na ahịrịokwu na-esote kewapụrụ ya n'ịsacha anụ ahụ nkịtị.
- source_word: σαρκὸς
  choice: dị n'anụ ahụ
  rationale: N'ọnọdụ a σάρξ na-ezo aka n'anụ ahụ mmadụ ebe unyi pụrụ ịdị; nsụgharị a bụ nke nkịtị ma doo anya n'Igbo.
- source_word: ἀπόθεσις ῥύπου
  choice: iwepụ unyi
  rationale: Nkebiokwu a na-egosi nhicha nke anụ ahụ, ọ bụghị nkọwa ime mmụọ agbakwunyere.
- source_word: συνειδήσεως ἀγαθῆς
  choice: maka akọnuche dị mma
  rationale: ‘Maka’ na-egosipụta njikọ genitive ahụ n'ụzọ Igbo dị mfe, ma na-ahapụ ihe okwu Grik ahụ pụtara ka nkọwa ἐπερώτημα kpebie.
- source_word: ἐπερώτημα
  choice: ịrịọ
  rationale: ‘Ịrịọ’ dabara n'usoro εἰς θεόν, ya bụ arịrịọ a na-eche ihu n'ebe Chineke nọ. E debeere nghọta ọzọ, ‘nkwa’ ma ọ bụ ‘azịza,’ n'ala ala peeji.
- source_word: εἰς θεόν
  choice: Chineke
  rationale: Ngwaa Igbo ‘ịrịọ’ na-ewere onye a na-arịọ ozugbo, ya mere ‘ịrịọ Chineke’ na-egosipụta ntụziaka εἰς θεόν n'ụzọ ebumpụta ụwa.
- source_word: δι’ ἀναστάσεως
  choice: site ná mbilite n'ọnwụ
  rationale: ‘Site ná’ na-egosipụta ụzọ ma ọ bụ ihe e ji arụpụta nzọpụta ahụ dịka διά ya na genitive si eme.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, onye bụ Mesaịa ahụ
  rationale: A sụgharịrị Χριστός dịka utu aha ‘Mesaịa,’ ọ bụghị naanị dịka aha mmadụ; usoro a dị mma ma doo anya n'Igbo.
theological_decisions:
- issue: Mmekọrịta baptizim na nzọpụta
  choice: 'E debere okwu ahụ kpọmkwem: ‘baptizim na-azọpụtakwa unu ugbu a,’ ka nkọwa Pita n''onwe ya kọwaa ihe ọ pụtara.'
  alternative: Ịsụgharị ya dịka ‘baptizim na-anọchi anya nzọpụta,’ ma ọ bụ ịgbakwụnye nkọwa sacrament nke otu ụka pụrụ iche.
  rationale: Ihe odide Grik kwuru ozugbo na baptizim na-azọpụta, ma kọwaa na ọ bụghị naanị iwepụ unyi n'anụ ahụ, nakwa na ọ bụ site ná mbilite n'ọnwụ Jizọs. Nsụgharị ahụ na-edobe esemokwu nkà mmụta okpukpe a n'emeghị ka ọ bụrụ ozizi otu ụka.
- issue: Ihe ἐπερώτημα pụtara n'ọnọdụ baptizim
  choice: E ji ‘ịrịọ’ mee ihe n'ahịrịokwu bụ isi, ma debe ‘nkwa’ na ‘azịza’ n'ala ala peeji.
  alternative: Nkwa; azịza.
  rationale: Ihe okwu Grik a pụtara ka na-arụrịta ụka. ‘Ịrịọ’ dabara nke ọma na εἰς θεόν, ma nghọta ‘nkwa’ nwere nkwado zuru ezu nke na e kwesịghị izochi ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. A hapụrụ nkwupụta banyere baptizim na nzọpụta ka ọ dị kpọmkwem, ma zere okwu teknụzụ ma ọ bụ nkọwa nke otu ụka pụrụ iche.
