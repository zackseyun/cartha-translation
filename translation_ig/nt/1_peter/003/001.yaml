id: 1PE.3.1
reference: 1 Peter 3:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/001.yaml
  text: Likewise[a], wives, being subject to your own husbands, so that even if some are disobeying the word, they may be won without a word through the conduct of their wives,
translation:
  language: ig
  text: N’otu aka ahụ, unu ndị nwunye, na-edobe onwe unu n’okpuru di unu, ka, ọ bụrụgodị na ụfọdụ n’ime ha anaghị erubere okwu ahụ isi[a], omume ndị nwunye ha, na-enweghị okwu ọ bụla, wee dọta ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anaghị erubere ozi ahụ isi”; ya bụ, ha na-ajụ ozi ọma ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁμοίως
  choice: N’otu aka ahụ
  rationale: Ọ bụ njikọ okwu na-ejikọta ndụmọdụ a na ntụziaka ezinụlọ ndị bu ya ụzọ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: γυναῖκες
  choice: unu ndị nwunye
  rationale: N’ihi na amaokwu ahụ kwuru banyere ‘di unu,’ ihe okwu a pụtara n’ebe a bụ ndị nwunye, ọ bụghị ụmụ nwanyị n’ozuzu.
- source_word: ὑποτασσόμεναι
  choice: doonụ onwe unu n’okpuru
  rationale: N’agbanyeghị na Grik ji participle mee ya, ọ na-arụ ọrụ dịka ndụmọdụ. Nsụgharị a na-egosi ido onwe n’usoro mmekọrịta ahụ n’etinyeghị echiche nke nrubeisi zuru oke ma ọ bụ ịdị ala n’ụdị mmadụ.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: di unu
  rationale: Ọnọdụ ezinụlọ na-egosi na ἀνήρ pụtara ‘di.’ Igbo na-egosi njikọ nke onye ọ bụla na di nke ya site n’okwu ‘unu’ n’ụzọ ebumpụta ụwa.
- source_word: καὶ εἴ τινες
  choice: ọ bụrụgodị na ụfọdụ n’ime ha
  rationale: ‘Ọ bụrụgodị’ na-echekwa ike nkwenye ma ọ bụ nkwenye megidere ọnọdụ siri ike nke καὶ εἴ.
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  choice: anaghị erubere okwu ahụ isi
  rationale: Nke a na-echekwa akụkụ nke nnupụisi dị na ἀπειθέω, ebe ndetu ala peeji na-akọwa na ‘okwu ahụ’ bụ ozi ọma nke ha na-ajụ.
- source_word: λόγῳ
  choice: okwu ahụ
  rationale: Ọ na-echekwa okwu ihe atụ nke Grik ma na-ezo aka n’ozi ọma e kwusara.
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  choice: site n’omume ndị nwunye ha
  rationale: ἀναστροφή pụtara ụzọ mmadụ si ebi ndụ ma ọ bụ omume ya. ‘Omume’ bụ okwu Igbo doro anya ma dịkwa nkenke.
- source_word: ἄνευ λόγου
  choice: n’ekwughị okwu ọ bụla
  rationale: Ọ na-egosi na ihe ga-emetụta ndị di ahụ bụ omume ndị nwunye ha, ọ bụghị okwu ha, ma na-echekwa ntụnyere ya na ‘okwu ahụ’ dị n’elu.
- source_word: κερδηθήσονται
  choice: e wee ... nweta ha
  rationale: ‘Inweta’ na-echekwa ihe atụ nke κερδαίνω nke pụtara imeri ma ọ bụ irite mmadụ n’ụzọ ime ka ọ nabata ozi ọma, na-agbakwụnyeghị nkọwa karịrị ederede.
theological_decisions:
- issue: Ụdị ido onwe n’okpuru nke ὑποτασσόμεναι na-egosi
  choice: Doonụ onwe unu n’okpuru
  alternative: Na-eruberenụ di unu isi
  rationale: Ederede ahụ ji ὑποτάσσω, ọ bụghị okwu siri ike nke pụtara nanị ‘irube isi.’ Nsụgharị a na-echekwa usoro mmekọrịta ahụ n’ekwughị na ndị nwunye dị ala n’ụdị mmadụ ma ọ bụ na nrubeisi ahụ enweghị oke.
- issue: Ihe ἀπειθοῦσιν τῷ λόγῳ pụtara
  choice: Anaghị erubere okwu ahụ isi
  alternative: Ha ekweghị n’ozi ọma ahụ
  rationale: Ngwaa Grik ahụ nwere ike ịgụnye ekweghị ekwe na nnupụisi. Isi ederede na-echekwa echiche nke nrubeisi, ebe ndetu na-eme ka o doo anya na ihe ha na-ajụ bụ ozi ọma.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke nwere ugwu ma dị mfe nghọta, dee ya. E tinyere akara ndetu [a] kpọmkwem n’akụkụ okwu ọ na-akọwa. A sụgharịrị participle ahụ dịka ndụmọdụ kpọmkwem ka ahịrịokwu ahụ bụrụ Igbo ebumpụta ụwa, ma e chekwara ebumnuche nke ἵνα site na ‘ka ... e wee.’
