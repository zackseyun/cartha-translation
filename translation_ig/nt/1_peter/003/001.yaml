revisions:
- from: N’otu aka ahụ, unu ndị nwunye, doonụ onwe unu n’okpuru di unu, ka ọ bụrụgodị na ụfọdụ n’ime ha anaghị erubere okwu ahụ isi[a], e wee site n’omume ndị nwunye ha nweta ha n’ekwughị okwu ọ bụla.
  to: N’otu aka ahụ, unu ndị nwunye, na-edobe onwe unu n’okpuru di unu, ka, ọ bụrụgodị na ụfọdụ n’ime ha anaghị erubere okwu ahụ isi[a], omume ndị nwunye ha, na-enweghị okwu ọ bụla, wee dọta ha.
  rationale: The revision preserves the source’s exhortational participle, the concessive condition, the reference to disobedience toward the proclaimed word, and the purpose that such husbands may be won through their wives’ conduct rather than speech. It improves Igbo syntax without strengthening submission into obedience or specifying the precise outcome of being won.
