  yaml_path: translation/nt/1_peter/003/002.yaml
  text: when they observe your pure conduct in fear.
translation:
  language: ig
  text: mgbe ha hụrụ nke ọma omume unu dị ọcha n’egwu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποπτεύσαντες
  choice: mgbe ha ji anya ha hụ
  rationale: Na-egosi ịhụ ma leruo ihe anya n’onwe ha, dị ka participle a si pụta n’ebe a.
- source_word: ἁγνὴν ἀναστροφὴν
  choice: omume unu dị ọcha
  rationale: “Omume” na-ekwupụta ụzọ mmadụ si ebi ndụ, ebe “dị ọcha” na-echekwa echiche nke ἁγνήν.
- source_word: ἐν φόβῳ
  choice: n’egwu
  rationale: Na-echekwa nkebi okwu Grik ahụ kpọmkwem ma ghara ikpebi n’ime ederede ma ọ bụ egwu Chineke, nsọpụrụ miri emi, ma ọ bụ egwu n’ụzọ sara mbara.
theological_decisions:
- issue: Ihe “egwu” na-ezo aka na ya
  choice: n’egwu
  alternative: n’ịsọpụrụ Chineke
  rationale: Ederede Grik ekwughị kpọmkwem onye a na-atụ egwu; ya mere, nsụgharị ahụ na-echekwa nghọta sara mbara na esemokwu dị n’ederede kama ịkọwa ya dịka naanị egwu Chineke.
translation_notes:
  register: Asụsụ Igbo Izugbe dị mfe ma dị ùgwù. “Ji anya ha hụ” bụ okwu nkịtị nke na-eme ka echiche nke ileba anya nke ọma pụta ìhè; ahapụrụ “n’egwu” ka ọ nọgide nwee nghọta sara mbara dịka isi mmalite ahụ.
