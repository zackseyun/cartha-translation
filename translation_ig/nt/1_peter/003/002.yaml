review_pass:
  verdict: revise
  source_fidelity: The draft conveys observation, pure conduct, and the source's deliberately unqualified phrase ἐν φόβῳ (“in fear”). However, “nke unu na-eme” unnecessarily recasts “conduct” as something separately done and is not represented in the Greek.
  naturalness: “Mgbe ha ji anya ha hụ” is understandable but somewhat heavy, and the added relative clause makes the sentence less idiomatic. “Mgbe ha hụrụ nke ọma...” naturally expresses attentive observation in Standard Igbo.
  terminology: “Omume” is an appropriate rendering of ἀναστροφή in this context, and “dị ọcha” correctly represents ἁγνή. “N’egwu” should remain unexpanded, since the Greek does not explicitly identify the object or nuance of the fear.
  issues:
