id: 1PE.3.9
reference: 1 Peter 3:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας τοὐναντίον δὲ ⸀εὐλογοῦντες, ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: ig
  text: Unu ejila ihe ọjọọ akwụghachi ihe ọjọọ, ma ọ bụ unu ejila okwu mkparị akwụghachi okwu mkparị[a]. Kama[b], gọzienụ, n’ihi na ọ bụ nke a ka a kpọrọ unu[c], ka unu wee keta ngọzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwu ọjọọ akwụghachi okwu ọjọọ.” Okwu Grik ahụ nwere ike ịpụta okwu mkparị ma ọ bụ okwu e ji emegbu mmadụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “N’ụzọ megidere nke ahụ.” Okwu Grik ahụ na-egosi ntụgharị siri ike.
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, a kpọrọ unu ka unu jiri ngọzi zaghachi mmeso ọjọọ kama imegwara.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: jiri … akwụghachi
  rationale: Nke a na-egosi imeghachi mmadụ ihe o mere, ma na-ada ka Igbo nke oge a n’ụzọ doro anya.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: ihe ọjọọ akwụghachi ihe ọjọọ
  rationale: “Ihe ọjọọ” na-echekwa ịdị arọ nke okwu gbasara omume, ebe usoro “kwụghachi” na-egosi mmegwara.
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: okwu mkparị akwụghachi okwu mkparị
  rationale: “Okwu mkparị” na-egosi okwu e ji akparị ma ọ bụ e ji emegbu mmadụ, ma doo ndị na-agụ Igbo nke oge a anya.
- source_word: τοὐναντίον δὲ
  choice: Kama
  rationale: “Kama” na-egosi ntụgharị siri ike site na mmegwara gaa n’ịgọzi; ihe ọzọ ga-ekwe omume dị na nkọwa ala peeji.
- source_word: εὐλογοῦντες
  choice: gọzienụ
  rationale: E mere ndụmọdụ ahụ ka ọ bụrụ iwu dị mfe n’Igbo. E tinyeghị onye a ga-agọzi, n’ihi na Grik ekwughị ya kpọmkwem.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara ndụmọdụ ahụ.
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: ọ bụ nke a ka a kpọrọ unu
  rationale: Nke a na-echekwa nrụtụ aka “nke a” na olu nnabata nke “a kpọrọ unu,” n’etinyeghị aha onye kpọrọ ha n’ahịrị bụ isi.
- source_word: ἵνα
  choice: ka … wee
  rationale: Usoro a bụ ụzọ Igbo si egosi ebumnuche ma ọ bụ ihe a chọrọ ka o si na ya pụta.
- source_word: εὐλογίαν
  choice: ngọzi
  rationale: “Ngọzi” nwere ike ịpụta amara ma ọ bụ ihe ọma sitere n’aka Chineke, dịka okwu Grik ahụ si kwe.
- source_word: κληρονομήσητε
  choice: keta
  rationale: “Keta” na-echekwa echiche nke inweta ihe dị ka ihe nketa, ọ bụghị naanị ịnata ya.
theological_decisions:
- issue: Ihe “nke a” na-ezo aka na ya n’okwu εἰς τοῦτο ἐκλήθητε
  choice: E debere “nke a” ka ọ na-ezo n’ụzọ kacha nso n’ịgọzi kama imegwara.
  alternative: Ọ pụrụ ịgụnye ndụ Ndị Kraịst n’ozuzu ya nke ịta ahụhụ na ịghara imegwara.
  rationale: Ihe ndị gbara amaokwu ahụ gburugburu na-akwado njikọ ya na ndụmọdụ e kwuru ozugbo, ma nsụgharị ahụ ahapụla ohere ka nrụtụ aka ahụ nwee obosara karịa.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ usoro iwu “Unu ejila …” na “gọzienụ” iji mee ka ndụmọdụ ahụ doo anya, ma e chekwara ihe Grik na-akọwaghị kpọmkwem, karịchaa onye a na-agọzi na obosara nke “nke a.”
