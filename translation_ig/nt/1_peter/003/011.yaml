  text: ἐκκλινάτω ⸀δὲ ἀπὸ κακοῦ καὶ ποιησάτω ἀγαθόν, ζητησάτω εἰρήνην καὶ διωξάτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/011.yaml
  text: But let him turn away from evil and do good[a]; let him seek peace and pursue it.
translation:
  language: ig
  text: Ma ka o site n’ihe ọjọọ wezuga onwe ya, mee ihe ọma[a]; ka ọ chọọ udo ma gbasoo ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka mmadụ site n’ihe ọjọọ wezuga onwe ya, mee ihe ọma; ka mmadụ chọọ udo ma gbasoo ya.” Grik ji iwu onye nke atọ n’otu n’ụzọ nnọchite anya mmadụ ọ bụla.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλινάτω
  choice: ka o ... wezuga onwe ya
  rationale: Na-egosipụta iwu onye nke atọ n’otu na ntụgharị doro anya isi n’ihe ọjọọ pụọ, kama nanị izere ya.
- source_word: δὲ
  choice: Ma
  rationale: Na-edobe obere ọdịiche nke δέ na-aga n’ihu n’okwu agbamume ahụ.
- source_word: ἀπὸ κακοῦ
  choice: n’ihe ọjọọ
  rationale: A ghọtara κακόν n’ụzọ omume dị ka ihe ọjọọ, n’ihi na e tinyere ya n’ọdịiche megide ihe ọma.
- source_word: ποιησάτω ἀγαθόν
  choice: mee ihe ọma
  rationale: Nke a bụ okwu Igbo dị mfe ma kwekọọ n’omume ọma nke Grik ahụ na-akpọ mmadụ ime.
- source_word: ζητησάτω
  choice: ka ọ chọọ
  rationale: ‘Chọọ’ na-edobe echiche ịchọ ihe, ma hapụ ngwaa na-esote ka o kwuo gbasoo ya n’ike.
- source_word: εἰρήνην
  choice: udo
  rationale: ‘Udo’ bụ okwu Igbo nkịtị nke nwere ike ibu nghọta Akwụkwọ Nsọ sara mbara nke εἰρήνη.
- source_word: διωξάτω αὐτήν
  choice: gbasookwa ya
  rationale: ‘Gbasoo’ na-egosi ịchụso udo nke ọma; ‘ya’ na-alaghachi n’udo.
- source_word: 3rd person singular imperatives across the verse
  choice: ka o ...; ka ọ ...
  rationale: Usoro ‘ka ọ’ na-edobe iwu onye nke atọ n’otu n’Igbo ma na-arụ ọrụ n’ụzọ nnọchite anya mmadụ ọ bụla.
theological_decisions:
- issue: Ike nnọchite anya mmadụ niile dị n’iwu onye nke atọ n’otu
  choice: Jiri ‘ka o/ọ’ n’ahịrị bụ isi
  alternative: Jiri ‘ka mmadụ’ ma ọ bụ iwu onye nke abụọ
  rationale: Grik ji onye nke atọ n’otu mee ihe n’ụzọ nnọchite anya. Igbo ‘ka ọ’ na-edobe otu ahụ n’enweghị ime ka okwu ahụ bụrụ naanị maka nwoke.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro agbamume anọ na mmegharị sitere n’ịwezuga onwe ruo n’ịchọ na ịgbaso udo.
