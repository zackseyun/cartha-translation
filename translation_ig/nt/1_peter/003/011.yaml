  naturalness: «Ka o site n’ihe ọjọọ wezuga onwe ya» is natural Standard Igbo. Replacing the enclitic conjunction in «gbasookwa ya» with «ma gbasoo ya» makes the coordination and the climactic force of διωξάτω clearer in a formal biblical register.
  terminology: '«ihe ọjọọ», «ihe ọma», and «udo» are appropriate established Standard Igbo renderings. The footnote must not call the Greek form masculine: these third-singular imperative forms do not grammatically mark masculine gender, though they may have a generic/representative reference in context.'
