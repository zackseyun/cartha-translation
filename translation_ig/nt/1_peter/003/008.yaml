id: 1PE.3.8
reference: 1 Peter 3:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τὸ δὲ τέλος πάντες ὁμόφρονες, συμπαθεῖς, φιλάδελφοι, εὔσπλαγχνοι, ⸀ταπεινόφρονες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/008.yaml
  text: Finally[a], all of you, be like-minded, sympathetic, loving as brothers, tenderhearted, humble-minded[b],
translation:
  language: ig
  text: N’ikpeazụ, unu niile, bụrụnụ ndị nwere otu uche, ndị na-enwe ọmịiko n'ebe ibe unu nọ, ndị na-ahụrịta onwe unu n’anya dịka ụmụnne[a], ndị nwere obi dị nro, na ndị dị umeala n’obi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nwere ịhụnanya ụmụnne.” Okwu Grik ahụ ji asụsụ ezinụlọ nke ụmụnne mee ihe, ma ọ na-agụnye ndị niile nọ n’ọgbakọ ndị kwere ekwe.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ ihe odide ochie nwere “ndị nwere omume enyi” ma ọ bụ “ndị na-anabata ndị ọzọ nke ọma” kama “ndị dị umeala n’obi.”
    reason: textual_variant
lexical_decisions:
- source_word: Τὸ δὲ τέλος
  choice: N’ikpeazụ
  rationale: Ọ bụ akara okwu na-ebute nchịkọta ndụmọdụ. “N’ikpeazụ” bụ ụzọ Igbo dị mfe ma dị ebube isi gosipụta nke a.
- source_word: πάντες
  choice: unu niile
  rationale: Ọ na-agwa ọgbakọ ahụ dum okwu ozugbo; “unu niile” na-eme ka ntụaka ahụ doo anya.
- source_word: ὁμόφρονες
  choice: ndị nwere otu obi
  rationale: Akpaokwu a na-egosi ịdị n’otu n’echiche na nzube, n’enweghị ikwu na mmadụ niile aghaghị inwe otu echiche banyere ihe niile.
- source_word: συμπαθεῖς
  choice: ndị na-eso ibe unu enwe mmetụta
  rationale: Nke a na-echekwa echiche nke isoro ndị ọzọ nwee mmetụta n’ihe na-eru ha, kama ime ka okwu ahụ bụrụ naanị imere ha ebere.
- source_word: φιλάδελφοι
  choice: ndị hụrụ ibe unu n’anya dịka ụmụnne
  rationale: “Ụmụnne” na-echekwa ihe atụ ezinụlọ dị n’okwu Grik ma na-agụnye ndị nwoke na ndị nwanyị n’ụzọ Igbo si eji okwu ahụ eme ihe.
- source_word: εὔσπλαγχνοι
  choice: ndị obi dị nro
  rationale: Ọ na-egosi ọmịiko miri emi na obi ọma, ma na-ekewapụkwa ya n’okwu bu ya ụzọ banyere isoro ndị ọzọ nwee mmetụta.
- source_word: ταπεινόφρονες
  choice: ndị dị umeala n’obi
  rationale: Nke a bụ akpaokwu Igbo doro anya maka àgwà nke ịdị umeala n’obi, ma na-echekwa akụkụ nke uche na ọnọdụ obi dị n’okwu Grik.
theological_decisions:
- issue: Asụsụ ụmụnne dị na φιλάδελφοι
  choice: ndị hụrụ ibe unu n’anya dịka ụmụnne
  alternative: ndị jupụtara n’ịhụnanya ụmụnne
  rationale: Nsụgharị ahụ na-echekwa ihe atụ nke ezinụlọ. N’Igbo, “ụmụnne” nwere ike ịgụnye ndị nwoke na ndị nwanyị, ya mere ọ na-egosi ọgbakọ ndị kwere ekwe dum n’enweghị ịgbasa okwu Grik n’ụzọ na-adịghị mkpa.
- issue: Ụdị okwu ikpeazụ n’ihe odide
  choice: ταπεινόφρονες = ndị dị umeala n’obi
  alternative: φιλόφρονες = ndị na-emeso ndị ọzọ omume ọma ma ọ bụ n’ụzọ enyi
  rationale: SBLGNT nyere ταπεινόφρονες, ya mere nke ahụ nọ n’ahịrị isi. E debere ụdị ọzọ dị mkpa n’ala ala peeji kama iji ya dochie ihe odide isi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma nwee ugwu mee ihe. E debere usoro ndụmọdụ ndị ahụ n’ụdị nkọwa aha mmadụ, ebe “bụrụnụ” na-achị ha niile. E bugharịrị akara [a] ka ọ soro okwu φιλάδελφοι nke nkọwa ya metụtara; akara [b] nọ n’akụkụ okwu ikpeazụ nke nwere ụdị ihe odide ọzọ.
