source:
  edition: SBLGNT
  text: οὕτως γάρ ποτε καὶ αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι ⸀εἰς θεὸν ἐκόσμουν ἑαυτάς, ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/005.yaml
  text: For in this way formerly also the holy women who hoped in God adorned themselves[a], submitting to their own husbands,
translation:
  language: ig
  text: N’ihi na n’oge gara aga, ọ bụkwa otu a ka ụmụ nwanyị ndị dị nsọ, ndị nwere olileanya n’ebe Chineke nọ[a], na-achọ onwe ha mma, na-edo onwe ha n’okpuru ndị di ha,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị tinyere olileanya ha n’ebe Chineke nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ọ bụ otu a
  rationale: Nke a na-arụtụ aka n’ụzọ a kọwara n’amaokwu ndị bu ụzọ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a bụ ihe ndabere ma ọ bụ nkọwa maka ndụmọdụ e nyere tupu ya.
- source_word: ποτε
  choice: n’oge gara aga
  rationale: Ọ na-ezo aka n’oge ndị inyom nke ọgbọ mbụ biri.
- source_word: ἅγιαι γυναῖκες
  choice: ụmụ nwanyị dị nsọ
  rationale: Ọ na-edobe ihe ἅγιαι pụtara n’enweghị ime ka ọ bụrụ naanị ‘ndị ezi omume’ ma ọ bụ okwu ọzọ dị nro.
- source_word: ἐλπίζουσαι εἰς θεὸν
  choice: ndị nwere olileanya na Chineke
  rationale: Nke a bụ Igbo doro anya ma dị mfe nke na-egosi na Chineke bụ onye ha tụrụ anya ya, na-enweghị ịgbanwe olileanya ka ọ bụrụ naanị ntụkwasị obi.
- source_word: ἐκόσμουν ἑαυτάς
  choice: si achọ onwe ha mma
  rationale: Ọ na-echekwa njikọ ya na isiokwu ịchọ mma dị n’amaokwu ndị gbara ya gburugburu ma na-ada ka Igbo mmadụ na-asụ.
- source_word: ὑποτασσόμεναι
  choice: site n’ido onwe ha n’okpuru
  rationale: ‘Site n’ـ’ na-egosi na participle a na-akọwa ụzọ ha si achọ onwe ha mma, ma okwu ahụ na-echekwa echiche nke ido onwe onye n’okpuru.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: di nke ha
  rationale: N’ọnọdụ gbasara alụmdi na nwunye, ἀνδράσιν pụtara ndị di; ‘nke ha’ na-egbochi ka e mee okwu a iwu gbasara ụmụ nwanyị niile na ụmụ nwoke niile.
theological_decisions:
- issue: Otu e si sụgharị okwu banyere ido onwe onye n’okpuru n’alụmdi na nwunye
  choice: site n’ido onwe ha n’okpuru di nke ha
  alternative: na-anọ n’okpuru ndị di ha
  rationale: Nhọrọ a na-echekwa omume nke participle ahụ na oke mmekọrịta alụmdi na nwunye nke ‘nke ha’ gosiri. Ọ naghị agbasa okwu a ka ọ bụrụ nkwupụta gbasara ụmụ nwanyị niile na ụmụ nwoke niile.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A haziri ahịrịokwu ahụ ka njikọ dị n’etiti ịchọ mma na ido onwe ha n’okpuru pụta ìhè, ma e chekwara okwu ‘dị nsọ,’ ‘olileanya,’ na ‘di nke ha’ n’ụzọ na-adịghị etinye nkọwa otu ụka pụrụ iche.
