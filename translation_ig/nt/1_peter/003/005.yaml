revisions:
- from: N’ihi na n’oge gara aga, ọ bụkwa otu a ka ụmụ nwanyị dị nsọ, ndị nwere olileanya na Chineke[a], si achọ onwe ha mma, site n’ido onwe ha n’okpuru di nke ha.
  to: N’ihi na n’oge gara aga, ọ bụkwa otu a ka ụmụ nwanyị ndị dị nsọ, ndị nwere olileanya n’ebe Chineke nọ[a], na-achọ onwe ha mma, na-edo onwe ha n’okpuru ndị di ha,
  rationale: The revision corrects the plural marital noun, clarifies that hope is directed toward God, and makes the participial relation of submitting more direct in idiomatic Standard Igbo. It preserves the source’s historical and descriptive force without extending the statement beyond women and their own husbands.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:15:32Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the main sense well, including the historical exemplum, holiness, hope directed toward God, self-adornment, and the marital limitation of submission. However, “di nke ha” is singular despite the plural γυναῖκες / ἀνδράσιν, and the construction “site n’ido onwe ha n’okpuru” is less direct than the Greek participle and leaves the relation to the husbands somewhat awkwardly expressed.
  naturalness: “Ndị nwere olileanya na Chineke” is understandable but less idiomatic and less precise than “ndị nwere olileanya n’ebe Chineke nọ.” The revised wording uses natural Standard Igbo and retains the ongoing participial relation by coordinating “na-achọ” and “na-edo.”
  terminology: “Ụmụ nwanyị ndị dị nsọ” suitably represents αἱ ἅγιαι γυναῖκες. “Ndị di ha” correctly renders the plural marital referent while retaining the possessive limitation of ἰδίοις. “Na-edo onwe ha n’okpuru” is retained as an appropriately formal, non-expansive rendering of ὑποτασσόμεναι.
  issues:
  - severity: medium
    issue: Singular “di nke ha” for plural ἀνδράσιν
    rationale: The source speaks of the women’s own husbands in the plural. “Ndị di ha” is the normal Igbo plural form and preserves the individual marital scope.
  - severity: low
    issue: “nwere olileanya na Chineke” is imprecise idiomatically
    rationale: The preposition “na” can be read as simple coordination. “n’ebe Chineke nọ” clearly expresses hope directed to God, corresponding to εἰς θεόν.
  - severity: low
    issue: Indirect submission phrase
    rationale: “Site n’ido onwe ha n’okpuru” is possible, but “na-edo onwe ha n’okpuru ndị di ha” more directly and naturally represents the participial description.
  revised_text: N’ihi na n’oge gara aga, ọ bụkwa otu a ka ụmụ nwanyị ndị dị nsọ, ndị nwere olileanya n’ebe Chineke nọ[a], na-achọ onwe ha mma, na-edo onwe ha n’okpuru ndị di ha,
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị tinyere olileanya ha n’ebe Chineke nọ.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the plural marital noun, clarifies that hope is directed toward God, and makes the participial relation of submitting more direct in idiomatic Standard Igbo. It preserves the source’s historical and descriptive force without extending the statement beyond women and their own husbands.
