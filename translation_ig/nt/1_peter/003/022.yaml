revisions:
- from: onye nọ n’aka nri Chineke, mgbe ọ gara n’eluigwe, ebe e mere ka ndị mmụọ ozi na ndị ọchịchị na ndị ike nọọrọ ya n’okpuru.
  to: onye nọ n’aka nri Chineke, onye garala n’eluigwe, mgbe e dorola ndị mmụọ ozi na ndị ọchịchị na ndị ike n’okpuru ya.
  rationale: The revision retains the Greek relative linkage and the scriptural right-hand idiom. “Onye garala n’eluigwe” represents the antecedent completed movement into heaven naturally in Igbo. “Mgbe e dorola … n’okpuru ya” conveys the completed passive subjection of angels, authorities, and powers without adding an interpretation of their identity or moral character.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:16:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the referent, God''s right-hand idiom, the ascent to heaven, and the threefold list. However, “ebe e mere ka … nọọrọ ya n’okpuru” is not a reliable or natural rendering of the aorist passive participle ὑποταγέντων: it uses an awkward causative construction and “nọọrọ” can suggest remaining/staying rather than having been subjected.'
  naturalness: “Mgbe ọ gara” is understandable, but “ọ garala n’eluigwe” better conveys the completed antecedent action. The revision also replaces the strained final construction with idiomatic Standard Igbo while retaining the passive sense.
  terminology: “N’aka nri Chineke,” “ndị mmụọ ozi,” “ndị ọchịchị,” and “ndị ike” suitably retain the biblical idiom and the distinct three-member Greek sequence. “E doro … n’okpuru ya” naturally expresses subjection without classifying these beings morally.
  issues:
  - severity: medium
    issue: The expression “ebe e mere ka ndị mmụọ ozi na ndị ọchịchị na ndị ike nọọrọ ya n’okpuru” is awkward and imprecise.
    rationale: The Greek says that these groups have been subjected to him. The draft's causative “e mere ka” plus “nọọrọ” does not naturally convey this completed passive subjection in Standard Igbo.
  revised_text: onye nọ n’aka nri Chineke, onye garala n’eluigwe, mgbe e dorola ndị mmụọ ozi na ndị ọchịchị na ndị ike n’okpuru ya.
