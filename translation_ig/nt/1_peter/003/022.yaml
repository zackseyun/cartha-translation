id: 1PE.3.22
reference: 1 Peter 3:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅς ἐστιν ἐν ⸀δεξιᾷ θεοῦ πορευθεὶς εἰς οὐρανὸν ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/022.yaml
  text: who is at the right hand of God[a], having gone into heaven, with angels and authorities and powers subjected to him.
translation:
  language: ig
  text: onye nọ n’aka nri Chineke, onye garala n’eluigwe, mgbe e dorola ndị mmụọ ozi na ndị ọchịchị na ndị ike n’okpuru ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅς
  choice: onye
  rationale: Ọ bụ nnọchiaha njikọ nke na-ezo aka na Jizọs Kraịst n’amaokwu bu ụzọ; “onye” na-ejigide njikọ ahịrịokwu Grik ahụ n’enweghị mgbakwunye nkwusi ike.
- source_word: ἐν δεξιᾷ θεοῦ
  choice: n’aka nri Chineke
  rationale: Nke a na-edobe akpaalaokwu Akwụkwọ Nsọ banyere ọnọdụ nsọpụrụ na ịdị elu, kama ịkọwa ya n’ụzọ ga-emechi ihe ọ pụtara.
- source_word: πορευθεὶς εἰς οὐρανόν
  choice: mgbe ọ gara n’eluigwe
  rationale: “Mgbe ọ gara” na-egosi na njem ahụ mere tupu ọnọdụ nke isi ngwaa; “n’eluigwe” bụ ụzọ Igbo dị mma isi kwupụta mmegharị εἰς gaa n’ime/ruo eluigwe.
- source_word: ὑποταγέντων αὐτῷ
  choice: ebe e mere ka … nọọrọ ya n’okpuru
  rationale: Nke a na-echekwa olu nnabata nke participle Grik na echiche nke ido ihe niile n’okpuru ya, ma na-ada ka Igbo nkịtị.
- source_word: ἀγγέλων
  choice: ndị mmụọ ozi
  rationale: N’ọnọdụ a nke ihe ndị dị n’eluigwe, okwu ahụ pụtara ndị ozi ime mmụọ, ọ bụghị ndị ozi mmadụ.
- source_word: ἐξουσιῶν
  choice: ndị ọchịchị
  rationale: Ọ na-egosi ndị ma ọ bụ ike nwere ikike n’usoro eluigwe; nhọrọ a na-ekewapụ ya na δυνάμεων.
- source_word: δυνάμεων
  choice: ndị ike
  rationale: Ọ na-echekwa aha nke atọ n’usoro ihe ndị dị n’eluigwe ma ghara ijikọta ya na “ndị ọchịchị.”
theological_decisions:
- issue: Ọnọdụ Kraịst n’aka nri Chineke
  choice: E debere akpaalaokwu ahụ dịka “n’aka nri Chineke.”
  alternative: n’ọnọdụ kacha elu nke nsọpụrụ n’akụkụ Chineke
  rationale: Akpaalaokwu mbụ ahụ nwere ma echiche ọnọdụ ma nke nsọpụrụ; ịkọwa ya kpamkpam dịka “ọnọdụ nsọpụrụ” ga-ebelata mgbagwoju ihe ọ pụtara.
- issue: Ndị bụ “ndị mmụọ ozi na ndị ọchịchị na ndị ike”
  choice: E debere aha atọ ahụ n’ozuzu ha, n’akọwaghị ma ha dị mma, dị njọ, ma ọ bụ ngwakọta.
  alternative: naanị ndị mmụọ ozi dị mma; ma ọ bụ kpọmkwem ike ime mmụọ ndị iro
  rationale: Grik ahụ ekwughị ụdị omume ha; nsụgharị ekwesịghị itinye usoro nkọwa okpukpe nke ederede ahụ na-ekwughị.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu na-aga were were, ebe a na-edobe akpaalaokwu Akwụkwọ Nsọ na usoro aha atọ nke isi mmalite.
