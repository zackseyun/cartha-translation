  text: in which also he went and proclaimed to the spirits in prison[c][b][a],
translation:
  language: ig
  text: N’ime ya[a] kwa, ọ gara kpọsaara[b] ndị mmụọ nọ n’ụlọ mkpọrọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘n’ime onye ahụ’; ma ọ bụ ‘site na ya.’ Grik nwere ike ịpụta ihe karịrị otu n’ihe banyere otú nkebi a si metụta okwu bu ya ụzọ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ ‘kwusaara.’ Ngwaa Grik ahụ pụtara ime nkwupụta, ma ebe a, ihe odide ahụ ekwughị kpọmkwem ihe dị n’ozi ahụ.
    reason: lexical_alternative
  - marker: c
    text: A na-arụrịta ụka banyere ndị ‘mmụọ nọ n’ụlọ mkpọrọ’ bụ. Ha nwere ike ịbụ ụmụ mmadụ nwụrụ anwụ ma ọ bụ ndị mmụọ ozi dara ada.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: N’ime ya
  rationale: Nkebi a na-edobe echiche bụ́ ‘n’ime ya/n’ime nke ahụ’ ma ghara ikpebi kpamkpam ma ya na-ezo aka n’ọnọdụ ma ọ bụ n’ụzọ e kwuru banyere mmụọ n’amaokwu bu ụzọ. Ihe odide ala peeji na-egosi ụzọ nghọta ndị ọzọ.
- source_word: καὶ
  choice: kwa
  rationale: ‘Kwa’ na-egosi na ihe omume a bụ ihe ọzọ agbakwunyere n’ihe e kwuru na mbụ.
- source_word: τοῖς ... πνεύμασιν
  choice: ndị mmụọ
  rationale: ‘Ndị mmụọ’ bụ ntụgharị kpọmkwem nke πνεύμασιν ma na-ahapụ njirimara ha ghe oghe; ‘mkpụrụ obi’ ma ọ bụ nkọwa ndị ọzọ ga-etinye ihe Grik ahụ ekwughị.
- source_word: ἐν φυλακῇ
  choice: n’ụlọ mkpọrọ
  rationale: Okwu a na-enye echiche ebe a na-eche ma ọ bụ na-ejide ndị a; ‘ụlọ mkpọrọ’ bụ ụzọ Igbo doro anya ma dị mfe isi kwuo ya.
- source_word: πορευθεὶς
  choice: ọ gara
  rationale: A gbanwere participle Grik ka ọ bụrụ ngwaa zuru ezu n’Igbo maka asụsụ dị ire, ma e debere echiche nke ịga.
- source_word: ἐκήρυξεν
  choice: kpọsaara
  rationale: ‘Kpọsaara’ na-egosi ikwupụta ozi n’ihu ọha n’ebughị ụzọ kọwaa ma ozi ahụ bụ ozi ọma, ikpe, ma ọ bụ mmeri.
theological_decisions:
- issue: Ihe ἐν ᾧ na-ezo aka na ya
  choice: A sụgharịrị ya ‘N’ime ya,’ nke na-edobe njikọ ya na nkebi bu ụzọ n’enweghị mkpebi siri ike banyere kpọmkwem ihe ‘ya’ bụ.
  alternative: ‘N’ime onye ahụ’ ma ọ bụ ‘Site na ya.’
  rationale: Usoro okwu Grik na ihe ọ pụtara bụ ihe a na-arụrịta ụka banyere ya. Ịhapụ ‘ya’ ka ọ ghe oghe na-egbochi nsụgharị ikpebi ozizi banyere ụzọ Kraịst si mee nkwusa ahụ.
- issue: Ndị bụ ‘ndị mmụọ nọ n’ụlọ mkpọrọ’
  choice: A hapụrụ ha dịka ‘ndị mmụọ nọ n’ụlọ mkpọrọ.’
  alternative: Ndị mmadụ nwụrụ anwụ n’oge Noa, ndị mmụọ ozi dara ada, ma ọ bụ ìgwè ndị mmụọ ndị ọzọ a tụrụ mkpọrọ.
  rationale: Grik anaghị akọwa njirimara ha nke ọma, ya mere nsụgharị ekwesịghị ịhọrọ otu n’ime nghọta ndị a.
- issue: Ụdị ozi e kpọsara
  choice: E ji ‘kpọsaara,’ okwu na-anọpụ iche banyere ọdịnaya ozi ahụ.
  alternative: ‘Kwusaara ozi ọma,’ ‘mara ọkwa ikpe,’ ma ọ bụ ‘kpọsara mmeri.’
  rationale: ἐκήρυξεν na-ekwu na e mere nkwupụta, ma amaokwu a anaghị akọwa ihe dị n’ozi ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ‘ọ gara kpọsaara’ na-eme ka participle Grik bụrụ okwu Igbo na-aga were were, ebe ‘ndị mmụọ’ na ‘ụlọ mkpọrọ’ na-edobe ihe oyiyi na mgbagwoju anya dị n’isi mmalite.
