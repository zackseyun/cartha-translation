id: 1PE.3.15
reference: 1 Peter 3:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κύριον δὲ τὸν ⸀Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ⸀ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: ig
  text: Ma n’ime obi unu, werenụ Mesaịa ahụ, bụ Onyenwe anyị, dị ka onye dị nsọ[a]. Na-adị njikere mgbe niile inye onye ọ bụla na-ajụ unu ihe kpatara olileanya dị n’ime unu azịza e ji agbachitere olileanya ahụ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ soro okwu Grik ahụ nso karị, “dọnụ Mesaịa ahụ, bụ Onyenwe anyị, nsọ n’ime obi unu.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị aha ọkwa Grik Χριστός dị ka “Kraịst”; ebe a, a sụgharịrị ya “Mesaịa.”
    reason: alternative_reading
lexical_decisions:
- source_word: κύριον δὲ τὸν Χριστὸν
  choice: Ma ... Mesaịa ahụ dị ka Onyenwe anyị
  rationale: A sụgharịrị Χριστός dị ka aha ọkwa bụ́ “Mesaịa,” ebe κύριος bụ “Onyenwe anyị.” Usoro a na-egosi na ndị kwere ekwe ga-amata Mesaịa ahụ dị ka Onyenwe ha, ma na-edobekwa njikọ okwu Grik ahụ.
- source_word: ἁγιάσατε
  choice: werenụ ... dị nsọ
  rationale: Ngwaa a pụtara ido nsọ ma ọ bụ ile anya dị ka ihe dị nsọ. N’ebe a, ọ naghị ekwu na mmadụ na-eme ka Mesaịa bụrụ onye nsọ; kama, ọ bụ ịsọpụrụ ya ma were ya dị ka Onyenwe dị nsọ.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: n’ime obi unu
  rationale: Nke a na-edobe ma ọnọdụ dị n’ime mmadụ ma ọtụtụ mmadụ nke okwu Grik ahụ.
- source_word: ἕτοιμοι ἀεὶ
  choice: Na-adị njikere mgbe niile
  rationale: Ọ na-edobe echiche nke ịdị njikere mgbe nile n’asụsụ Igbo doro anya.
- source_word: πρὸς ἀπολογίαν
  choice: ịgbachitere
  rationale: ἀπολογία nwere ike ịbụ nzaghachi, nkọwa, ma ọ bụ okwu e ji agbachitere ihe. “Ịgbachitere” na-edobe ike okwu ahụ karịa naanị “ịza.”
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον
  choice: n’ihu onye ọ bụla rịọrọ unu ka unu kọwaa ihe kpatara ya
  rationale: Nke a na-egosi na ajụjụ ahụ chọrọ nkọwa ma ọ bụ ihe kpatara olileanya ahụ, ma na-edobe echiche gbasara onye ọ bụla.
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: olileanya dị n’ime unu
  rationale: Nsụgharị a na-edobe okwu gbasara olileanya na-adị n’ime ma ọ bụ n’etiti ndị a na-agwa okwu.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a Χριστός na-arụ ọrụ dị ka aha ọkwa e jikọtara ya na κύριος; ya mere “Mesaịa” na-eme ka ihe aha ọkwa ahụ pụtara pụta ìhè.
- issue: Ihe ἁγιάσατε pụtara mgbe Mesaịa bụ onye a na-ekwu maka ya
  choice: werenụ Mesaịa ahụ dị ka Onyenwe anyị dị nsọ
  alternative: doonụ Mesaịa ahụ nsọ dị ka Onyenwe anyị
  rationale: Nhọrọ a na-egosi iwu ka a sọpụrụ ma mata ya dị ka onye nsọ, na-enweghị ime ka ọ dị ka ndị mmadụ bụ ndị na-eme ka ọ bụrụ onye nsọ.
- issue: Njikọ ἀπολογία na λόγον
  choice: ịgbachitere ... ka unu kọwaa ihe kpatara ya
  alternative: ịza ... banyere olileanya
  rationale: A hapụrụ ma echiche ịgbachitere ihe ma echiche inye nkọwa doro anya, kama ijikọta ha bụrụ naanị nzaghachi nkịtị.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ugwu ma dị mfe nghọta, mee ihe. “Werenụ ... dị ka” na-enye ἁγιάσατε n’ụzọ na-adịghị enye echiche na mmadụ na-eme ka Mesaịa bụrụ onye nsọ. E kewara ahịrịokwu ahụ ụzọ abụọ maka nghọta, ma rịkọm ikpeazụ na-egosi na amaokwu ahụ ka na-aga n’ihu.
