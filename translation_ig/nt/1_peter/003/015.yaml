    text: Ma ọ bụ, n’ụzọ soro okwu Grik ahụ nso karị, “dọnụ Mesaịa ahụ, bụ Onyenwe anyị, nsọ n’ime obi unu.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị aha ọkwa Grik Χριστός dị ka “Kraịst”; ebe a, a sụgharịrị ya “Mesaịa.”
    reason: alternative_reading
  revision_rationale: The revision retains the draft’s respectful, modern Standard Igbo and its rendering of Χριστός as “Mesaịa.” It clarifies that believers are to regard the Messiah, who is Lord, as holy in their hearts. It also restores the Greek’s linked ideas of a defense/account and the reason requested by every inquirer, without adding a requirement that the questioner first demand an explanation. The final comma is retained because the Greek sentence continues into the following verse.
