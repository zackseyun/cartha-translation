revisions:
- from: kama jiri ịdị nwayọọ na egwu[a] mee ya, na-enwekwa ezi akọnuche, ka ndị na-ekwutọ ezi omume unu n’ime Mesaịa wee bụrụ ndị ihere mere n’ihe ahụ ha ji ekwutọ unu[b].
  to: kama jiri ịdị nwayọọ na egwu[a] mee ya, na-enwe ezi akọnuche, ka, n’ihe a na-ekwu megide unu[c], ihere mee ndị na-akparị ụzọ unu si ebi ndụ ọma n’ime Mesaịa[b].
  rationale: The revision distinguishes the two Greek hostile-speech terms, restores the open syntactic force of ἐν ᾧ, and uses an idiomatic Igbo expression for the passive shame result. It also corrects the placement and coverage of footnote anchors. ‘Mesaịa’ is retained in accordance with the stated title-policy, while ‘Kraịst’ remains in the footnote.
