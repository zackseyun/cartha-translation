    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “n’okwu ahụ a na-ekwu megide unu.”
    reason: lexical_alternative
  revision_rationale: The revision distinguishes the two Greek hostile-speech terms, restores the open syntactic force of ἐν ᾧ, and uses an idiomatic Igbo expression for the passive shame result. It also corrects the placement and coverage of footnote anchors. ‘Mesaịa’ is retained in accordance with the stated title-policy, while ‘Kraịst’ remains in the footnote.
