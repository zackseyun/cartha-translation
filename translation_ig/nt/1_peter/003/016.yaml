id: 1PE.3.16
reference: 1 Peter 3:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ μετὰ πραΰτητος καὶ φόβου, συνείδησιν ἔχοντες ἀγαθήν, ἵνα ἐν ᾧ ⸀καταλαλεῖσθε καταισχυνθῶσιν οἱ ἐπηρεάζοντες ὑμῶν τὴν ἀγαθὴν ἐν Χριστῷ ἀναστροφήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/016.yaml
  text: but with gentleness and fear[a], having a good conscience, so that in what you are slandered[c][b], those who revile your good conduct in Messiah may be put to shame.
translation:
  language: ig
  text: kama jiri ịdị nwayọọ na egwu[a] mee ya, na-enwe ezi akọnuche, ka, n’ihe a na-ekwu megide unu[c], ihere mee ndị na-akparị ụzọ unu si ebi ndụ ọma n’ime Mesaịa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na nsọpụrụ,” ma ọ bụ “na nkwanye ùgwù.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “n’ime Mesaịa”; dịka a na-asụgharị ya n’ọdịnala, “n’ime Kraịst.”
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “n’okwu ahụ a na-ekwu megide unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πραΰτητος
  choice: ịdị nwayọọ
  rationale: Nkebi okwu a na-egosi omume dị umeala n’obi nke na-adịghị aka ike; “ịdị nwayọọ” bụ Igbo doro anya ma kwekọọ n’ọnọdụ ndụmọdụ a.
- source_word: φόβου
  choice: egwu
  rationale: A hapụrụ okwu sara mbara bụ “egwu” ka a ghara ikpebi n’enweghị ihe akaebe ma ihe a na-ekwu bụ egwu Chineke, nsọpụrụ, ma ọ bụ ịkwanyere ndị ọzọ ùgwù.
- source_word: συνείδησιν ἔχοντες ἀγαθήν
  choice: na-enwekwa ezi akọnuche
  rationale: Nke a na-egosipụta participle ahụ dị ka ọnọdụ na-aga n’ihu nke na-eso omume e nyere n’iwu.
- source_word: ἐν ᾧ
  choice: n’ihe ahụ
  rationale: “N’ihe ahụ” na-edobe ntụaka ahụ ka ọ ghara ịdị warawara karịa Grik, ma na-eme ka ahịrịokwu Igbo doo anya.
- source_word: καταλαλεῖσθε
  choice: ha ji ekwutọ unu
  rationale: “Ikwutọ” na-ezipụta ikwu okwu ọjọọ megide mmadụ, nke bụ isi ike okwu καταλαλέω n’ebe a.
- source_word: καταισχυνθῶσιν
  choice: wee bụrụ ndị ihere mere
  rationale: 'Nhọrọ a na-edobe echiche passive subjunctive ahụ: ihe ga-esi na ya pụta bụ na a ga-eme ka ihere mee ha.'
- source_word: ἐπηρεάζοντες
  choice: ndị na-ekwutọ
  rationale: N’ọnọdụ a, okwu ahụ na-egosi mwakpo iro e ji okwu eme megide ezi omume ndị kwere ekwe; “ndị na-ekwutọ” bụ okwu Igbo ebumpụta ụwa nke dabara na ya.
- source_word: ἀναστροφήν
  choice: omume
  rationale: “Omume” na-ezipụta ụzọ mmadụ si ebi ndụ na omume ya n’ụzọ dị mkpirikpi ma dị mfe nghọta.
- source_word: ἐν Χριστῷ
  choice: n’ime Mesaịa
  rationale: Χριστός ka na-arụ ọrụ dị ka utu aha n’ebe a; “Mesaịa” na-ezipụta ihe aha ahụ pụtara kama ịsụgharị ya nanị dịka ụda okwu.
- source_word: ἀγαθὴν
  choice: ezi
  rationale: “Ezi” na-edobe nkwughachi echiche ἀγαθός dị na “ezi akọnuche” na “ezi omume.”
theological_decisions:
- issue: Ihe φόβου pụtara na nkebi okwu “jiri ịdị nwayọọ na egwu”
  choice: Edobere “egwu” n’enweghị ịkpọ onye ma ọ bụ ihe a na-atụ egwu aha.
  alternative: nsọpụrụ; ịkwanyere ùgwù; egwu Chineke
  rationale: Ihe gbara okwu ahụ gburugburu ekwughị kpọmkwem onye φόβος na-elekwasị anya. Okwu “egwu” na-echekwa nghọtahie na mgbagwoju anya dị n’ederede ahụ.
- issue: Nsụgharị Χριστῷ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ime nkebi okwu a, Χριστός ka nwere ike ịbụ utu aha nke pụtara Onye E Tere Mmanụ; “Mesaịa” na-eme ka ihe utu aha ahụ pụtara pụta ìhè, ebe a na-edebe “Kraịst” na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A haziri usoro ahịrịokwu ahụ ka “n’ihe ahụ” metụta okwu nkwutọ n’ụzọ doro anya, n’enweghị imechi nghọta sara mbara nke ἐν ᾧ. E tinyere akara nkọwa ala peeji [a] na [b] n’ederede isi.
