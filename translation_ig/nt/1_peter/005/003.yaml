    rationale: The Greek participle describes a prohibited manner of exercising leadership. “Ejila aka ike na-achị” naturally conveys “do not domineer/rule oppressively” in modern Standard Igbo.
  - severity: low
    issue: The footnote’s literal alternative, “achị òkè ndị e kenyere unu,” is awkward Igbo.
    rationale: “Òkè unu” more directly represents “your allotments,” while the explanatory sentence can identify these as portions of God’s flock entrusted to each elder’s care.
