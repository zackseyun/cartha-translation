  text: μηδ’ ὡς κατακυριεύοντες τῶν κλήρων ἀλλὰ τύποι γινόμενοι τοῦ ποιμνίου·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/003.yaml
  text: not domineering over those allotted to your care[a], but becoming examples to the flock.
translation:
  language: ig
  text: Unu ejila aka ike na-achị ndị e kenyere unu ilekọta[a]; kama ghọọnụ ihe nlereanya nye ìgwè atụrụ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘Unu ejila aka ike na-achị òkè unu.’ N’ụzọ nkịtị, okwu Grik ahụ na-ekwu ‘òkè ndị e kenyere’; o yikarịrị ka ọ na-ezo aka n’akụkụ dị iche iche nke ìgwè atụrụ Chineke e nyefere onye okenye ọ bụla ilekọta.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδ’ ὡς
  choice: Unu ejikwala
  rationale: Ọ na-aga n’ihu n’iwu nchịkwa dị n’amaokwu bu ụzọ ma na-egosi ụdị omume ndị okenye na-ekwesịghị ime. N’Igbo, ụdị iwu a doro anya ma dabara n’usoro okwu a.
- source_word: κατακυριεύοντες
  choice: jiri aka ike achị
  rationale: Ngwaa a na-egosi iji ikike mee ndị ọzọ ihe n’ụzọ mpako ma ọ bụ mmegbu, ọ bụghị nanị idu ma ọ bụ ịchị n’ụzọ ziri ezi.
- source_word: τῶν κλήρων
  choice: ndị e kenyere unu ilekọta
  rationale: N’ụzọ nkịtị, okwu ahụ pụtara òkè ndị e kere ma ọ bụ e kenyere. N’ọnọdụ a, ọ na-ezo aka n’akụkụ ìgwè Chineke e tinyere nlekọta ya n’aka onye okenye ọ bụla, na-egosikwa ọrụ nlekọta kama ịbụ ndị mmadụ ha nwere.
- source_word: ἀλλὰ
  choice: kama
  rationale: Ọ na-egosi ọdịiche siri ike n’etiti iji ikike emegbu mmadụ na ịbụ ihe nlereanya.
- source_word: τύποι
  choice: ihe nlereanya
  rationale: Okwu a na-ezo aka n’omume ndị ọzọ kwesịrị iṅomi; ‘ihe nlereanya’ bụ okwu Igbo doro anya ma bụrụkwa nke a na-aghọta nke ọma.
- source_word: γινόμενοι
  choice: ghọọnụ
  rationale: Nke a na-echekwa echiche nke ịghọ ma ọ bụ igosipụta omume ahụ n’ezi ndụ, kama ịkọwa nanị ọnọdụ na-agbanweghi agbanwe.
- source_word: τοῦ ποιμνίου
  choice: ìgwè atụrụ ahụ
  rationale: Nke a na-echekwa ihe atụ nke ndị kwere ekwe dị ka ìgwè atụrụ a na-elekọta.
theological_decisions:
- issue: Ihe τῶν κλήρων pụtara n’ihe banyere ndị ndu nzukọ
  choice: Ọ na-ezo aka ná ndị kwere ekwe e kenyere ndị okenye ilekọta, ọ bụghị ndị ndị okenye nwere dịka ihe onwunwe.
  alternative: Ịhapụ ya dịka ‘òkè ndị e kenyere’ n’enweghị nkọwa, ma ọ bụ ịghọta ya dịka mpaghara ọchịchị ndị okenye.
  rationale: Ihe gbara ya gburugburu na-ekwu banyere ịzụ ìgwè atụrụ Chineke. Nsụgharị a na-egosi na ọ bụ ọrụ nlekọta e nyere ha, ma ọ naghị egosi na ndị ahụ bụ ihe onwunwe ha.
- issue: Ike nke κατακυριεύοντες
  choice: Ọ machibidoro iji ikike eme mmadụ ihe ma ọ bụ ịchị n’aka ike; ọ machibidoghị ụdị idu ndú niile.
  alternative: Ịghọta ya dịka mmachibido ọrụ ọchịchị ma ọ bụ idu ndú niile ndị okenye na-arụ.
  rationale: Ngwaa Grik ahụ na-elekwasị anya n’iji ọchịchị eme ihe n’ụzọ mmegbu. Amaokwu ahụ na-atụnyere ọchịchị aka ike na idu ndú site n’ezi ihe nlereanya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Jiri aka ike achị’ na-egosipụta mmegbu dị na κατακυριεύω, ebe ‘ndị e kenyere unu ilekọta’ na-eme ka ihe τῶν κλήρων pụtara n’ọnọdụ a doo anya ma na-edebe echiche nke ikenye ọrụ nlekọta.
