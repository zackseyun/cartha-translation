id: 1PE.5.13
reference: 1 Peter 5:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: ig
  text: Nwanyị ahụ nọ na Babịlọn[a][b], onye unu na ya bụ ndị a họpụtara, na-ezitere unu ekele; Mak, nwa m nwoke[c], na-ezitekwara unu ekele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịkọwa ya karịa otú a: “Ụka dị na Babịlọn, nke a họpụtara unu na ya.” N''asụsụ Grik, e ji okwu otu onye nke jinsị nwanyị mee ihe, ma aha ọ na-anọchi anya ya adịghị n''okwu ahụ.'
    reason: alternative_reading
  - marker: b
    text: “Babịlọn” nwere ike ịbụ aha e ji Rom nọchite anya ya n'okwu Ndị Kraịst oge mbụ; ma ihe odide ahụ n'onwe ya kwuru “Babịlọn.”
    reason: cultural_note
  - marker: c
    text: “Nwa m nwoke” nwere ike na-egosi mmekọrịta ime mmụọ karịa ịbụ nwa a mụrụ n'anụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: na-ezitere unu ekele
  rationale: Nke a na-egosipụta ekele a na-eziga n'akwụkwọ ozi n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ἡ ... συνεκλεκτὴ
  choice: Nwanyị ahụ ... onye a họpụtara unu na ya
  rationale: Ụdị okwu Grik bụ otu onye nke jinsị nwanyị, ma aha a na-akọwa adịghị na ya. Nsụgharị a na-edobe ntụaka nwanyị ahụ n'emejupụtaghị ‘ụka’ n'amaokwu ahụ.
- source_word: ἐν Βαβυλῶνι
  choice: nọ na Babịlọn
  rationale: E debere aha ebe ahụ dịka isi mmalite si kwuo ya, kama ịkọwa ya ozugbo dịka Rom.
- source_word: συνεκλεκτὴ
  choice: onye a họpụtara unu na ya
  rationale: Nke a na-egosipụta echiche nke ịbụ onye a họpụtara ya na ndị ọzọ ọnụ n'Igbo dị mfe nghọta.
- source_word: Μᾶρκος
  choice: Mak
  rationale: Nke a bụ odide aha Μᾶρκος a na-ejikarị n'Igbo.
- source_word: ὁ υἱός μου
  choice: nwa m nwoke
  rationale: A na-edobe okwu ezinụlọ ahụ kpọmkwem; a naghị etinye ‘nwa ime mmụọ m’ n'amaokwu ahụ n'ihi na Grik ekwughị ya hoo haa.
theological_decisions:
- issue: Onye ἡ ... συνεκλεκτὴ na-ezo aka na ya
  choice: 'E debere ya dịka nwanyị a na-akpọghị aha: ‘Nwanyị ahụ ... onye a họpụtara unu na ya.’'
  alternative: ‘Ụka dị na Babịlọn, nke a họpụtara unu na ya.’
  rationale: Grik nwere okwu otu onye nke jinsị nwanyị, ma o nweghị aha doro anya dịka ‘ụka.’ Nke a na-echekwa mgbagwoju anya dị n'isi mmalite.
- issue: Ihe ‘Babịlọn’ pụtara
  choice: E debere ‘Babịlọn’ n'amaokwu ahụ.
  alternative: Ịsụgharị ya dịka ‘Rom.’
  rationale: Ihe odide ahụ kpọrọ Babịlọn aha; ma ọ̀ bụ aha ebe ahụ kpọmkwem ma ọ bụ ihe nnọchianya Rom ka a hapụrụ ka ọ ghara idozi esemokwu ahụ n'amaokwu.
- issue: Mmekọrịta Mak dịka ‘nwa m nwoke’
  choice: E debere okwu ahụ dịka ‘nwa m nwoke.’
  alternative: ‘nwa ime mmụọ m.’
  rationale: O yikarịrị ka ọ na-ekwu maka mmekọrịta okwukwe, ma isi mmalite ahụ etinyeghị okwu ‘ime mmụọ.’
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta mee ihe. A kpachapụrụ anya debe nghọtahie dị n'ụdị nwanyị ahụ, Babịlọn, na mmekọrịta Mak, kama idozi ha n'amaokwu ahụ.
