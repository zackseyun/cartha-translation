id: 1PE.5.12
reference: 1 Peter 5:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: ig
  text: Ọ bụ site n’aka Silvanọs, nwanna ahụ kwesịrị ntụkwasị obi, dị ka m si ele ya anya, ka m ji degara unu nkenke[a], na-agba unu ume ma na-agba akaebe na nke a bụ ezi amara nke Chineke. Guzosienụ ike n’ime ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “jiri okwu ole na ole.”
    reason: Nhọrọ ntụgharị maka δι’ ὀλίγων, nke pụtara ide n’ụzọ dị mkpirikpi ma ọ bụ iji okwu ole na ole.
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie gụrụ, “nke unu guzoro n’ime ya,” kama, “Guzosienụ ike n’ime ya.”
    reason: Nke a na-edobe ọdịiche ederede dị n’etiti ụdị iwu na ụdị nkwupụta.
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: Ọ bụ site n’aka Silvanọs ... ka m ji dee
  rationale: “Site n’aka” na-egosipụta onye e sitere n’aka ya mee ihe, ma ọ naghị ekpebi ma Silvanọs bụ odeakwụkwọ, onye bu akwụkwọ ozi, ma ọ bụ ha abụọ.
- source_word: Σιλουανοῦ
  choice: Silvanọs
  rationale: A sụgharịghị aha mmadụ; e depụtara ya n’ụdị dabara na ụda aha Grik ahụ, kama iji “Sailas,” nke bụ ụdị aha ọzọ.
- source_word: τοῦ πιστοῦ ἀδελφοῦ
  choice: nwanna ahụ kwesịrị ntụkwasị obi
  rationale: N’ebe a πιστός bụ otuto e nyere Silvanọs dịka onye a pụrụ ịtụkwasị obi; “nwanna” na-egosi nwoke ibe ha n’okwukwe.
- source_word: ὡς λογίζομαι
  choice: dị ka m si ele ya anya
  rationale: Nke a na-edobe echiche Pita banyere Silvanọs dịka okwu a gbakwụnyere n’etiti ahịrịokwu, n’enweghị ime ka ọ bụrụ nkwupụta siri ike karịa Grik.
- source_word: δι’ ὀλίγων
  choice: ihe ole na ole
  rationale: Akpaokwu a pụtara ide ná nkenke ma ọ bụ jiri okwu ole na ole. E tinyere nhọrọ metụtara njikọ ya na Διὰ Σιλουανοῦ na nkọwa ala peeji.
- source_word: ἔγραψα
  choice: m ji dee
  rationale: Aorist epistolary a na-arụ ọrụ dịka okwu onye dere akwụkwọ ozi banyere ihe ọ na-ede; Igbo a na-ekwu okwu ugbu a anaghị achọ ka e tinye ọdịiche oge Bekee n’ike.
- source_word: παρακαλῶν
  choice: na-agba unu ume
  rationale: N’ọnọdụ ndụmọdụ na ume a, okwu a na-eburu echiche ịrịọsi ike na ịgba ume, n’asụsụ Igbo dị mfe ma dị nsọpụrụ.
- source_word: ἐπιμαρτυρῶν
  choice: na-agba akaebe
  rationale: Nke a na-edobe ike nke nkwenye sitere n’aka onye akaebe, ọ bụghị naanị ikwu na ihe bụ eziokwu.
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: na nke a bụ ezi amara Chineke
  rationale: '“Nke a” ka nọ n’ụdị sara mbara dịka Grik: ọ pụrụ ịrụtụ aka n’ozi na ndụmọdụ dị n’akwụkwọ ahụ n’enweghị ịkpa ókè n’ihe ọ kpọmkwem na-ezo aka na ya.'
- source_word: εἰς ἣν στῆτε
  choice: Guzosienụ ike n’ime ya
  rationale: στῆτε dị n’edemede e nyere bụ iwu e nyere ọtụtụ mmadụ; “guzosienụ ike” na-egosipụta iguzosi ike, ebe “n’ime ya” na-ezo azụ n’amara.
theological_decisions:
- issue: Ihe “nke a” na ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ na-ezo aka na ya
  choice: E debere “nke a” n’enweghị ịkọwa ya karịa ihe Grik kwuru.
  alternative: Ịkọwa ya kpọmkwem dịka ozi ọma, ahụmahụ ndị na-agụ akwụkwọ ahụ, ma ọ bụ naanị ozi Silvanọs wetara.
  rationale: Ọnọdụ okwu ahụ na-ejikọta ya na ihe Pita dere, ndụmọdụ ya, na akaebe ya, ma ókè kpọmkwem nke ihe ọ na-ezo aka na ya ka nwere mgbagwoju anya kwesịrị idobe.
- issue: Ụdị στῆτε n’ahịrịokwu ikpeazụ
  choice: 'Iwu: “Guzosienụ ike n’ime ya.”'
  alternative: 'Okwu nkwupụta: “nke unu guzo n’ime ya.”'
  rationale: SBLGNT e nyere nwere στῆτε dịka iwu; ụdị ọzọ dị n’ụfọdụ akwụkwọ aka ochie ka edebere na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. Nhazi “Ọ bụ ... ka ...” na-eme ka ọrụ Silvanọs pụta ìhè n’ụzọ nkịtị; e jikwa akara nkọwa ala peeji [a] na [b] kpọmkwem n’ederede isi.
