revisions:
- from: Ọ bụ site n’aka Silvanọs[a], nwanna ahụ kwesịrị ntụkwasị obi, dị ka m si ele ya anya, ka m ji dee ihe ole na ole nye unu, na-agba unu ume ma na-agba akaebe na nke a bụ ezi amara Chineke. Guzosienụ ike n’ime ya.[b]
  to: Ọ bụ site n’aka Silvanọs, nwanna ahụ kwesịrị ntụkwasị obi, dị ka m si ele ya anya, ka m ji degara unu nkenke[a], na-agba unu ume ma na-agba akaebe na nke a bụ ezi amara nke Chineke. Guzosienụ ike n’ime ya.[b]
  rationale: The revision corrects the ambiguity of ‘ihe ole na ole,’ restores a natural Igbo genitive construction, and relocates footnote a to the phrase it actually explains. The textual-variant footnote remains attached to the final clause and preserves the distinction between the SBLGNT imperative and the indicative variant without adjudicating beyond the supplied critical text.
