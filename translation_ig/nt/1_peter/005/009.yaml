id: 1PE.5.9
reference: 1 Peter 5:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ᾧ ἀντίστητε στερεοὶ τῇ πίστει, εἰδότες τὰ αὐτὰ τῶν παθημάτων τῇ ἐν ⸀τῷ κόσμῳ ὑμῶν ἀδελφότητι ἐπιτελεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/009.yaml
  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: ig
  text: Guzogidenụ ya, na-eguzosi ike n’okwukwe[a], ebe unu maara na a na-emezukwa otu ụdị ahụhụ ahụ n’etiti ụmụnna unu ndị kwere ekwe nọ n’ụwa[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “N’okwukwe” nwekwara ike ịpụta “site n’okwukwe,” ya bụ, site ná ntụkwasị obi ha nwere.
    reason: lexical_ambiguity
  - marker: b
    text: Okwu Grik a na-ezo aka n’òtù ndị kwere ekwe dum—ụmụ nwoke na ụmụ nwanyị—ọ bụghị naanị ụmụ nwoke.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “ụmụnna unu ndị kwere ekwe nọ n’ụwa na-agabiga otu ụdị ahụhụ ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’Ekwensu a kpọrọ aha n’amaokwu nke 8; ‘ya’ bụ ụzọ Igbo si kwuo ya n’enweghị mgbagwoju anya.
- source_word: ἀντίστητε
  choice: Guzogidenụ megide
  rationale: Nke a na-enye iwu ka ndị niile a na-agwa okwu kwụsie ike megide onye iro; ọ na-echekwa ike dị n’iwu Grik ahụ.
- source_word: στερεοὶ τῇ πίστει
  choice: na-eguzosi ike n’okwukwe
  rationale: Nkebiokwu a na-akọwa otú ha ga-esi guzogide ya. ‘N’okwukwe’ na-ahapụ ohere ma maka ntụkwasị obi ha nwere ma maka iguzosi ike n’okwukwe Ndị Kraịst.
- source_word: εἰδότες
  choice: ebe unu maara
  rationale: Ọ na-egosi ihe ọmụma na-akwado iwu ahụ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: otu ụdị ahụhụ ndị ahụ
  rationale: Ọ na-egosi ahụhụ ndị yiri ibe ha n’ụdị, ọ bụghị na ihe niile mere bụ kpọmkwem otu ihe.
- source_word: ἀδελφότητι
  choice: ụmụnna unu ndị kwere ekwe
  rationale: Ọ na-egosipụta ezinụlọ dum nke ndị kwere ekwe n’asụsụ Igbo doro anya; ọ bụghị naanị ụmụ nwoke ka okwu a na-ezo aka.
- source_word: ἐν τῷ κόσμῳ
  choice: nọ n’ụwa
  rationale: Nke a bụ nsụgharị kwụ ọtọ nke ebe òtù ụmụnna ahụ nọ, n’enweghị ịgbakwunye ‘n’ụwa niile’ n’ahịrị bụ isi.
- source_word: ἐπιτελεῖσθαι
  choice: na-agabigakwa
  rationale: N’ọnọdụ a, nke a na-egosi n’Igbo nkịtị na otu ahụhụ ahụ na-erukwa ndị kwere ekwe ndị ọzọ; ihe nwere ike ịpụta banyere imezu ma ọ bụ iweta ahụhụ ahụ n’isi njedebe ka e debere n’okpuru peeji.
theological_decisions:
- issue: Ihe τῇ πίστει pụtara
  choice: n’okwukwe
  alternative: site n’okwukwe; n’okwukwe Ndị Kraịst
  rationale: Grik nwere ike imetụta ntụkwasị obi mmadụ nwere ma ọ bụ okwukwe Ndị Kraịst nke mmadụ na-eguzosi ike na ya. Nsụgharị bụ isi anaghị ekpebi nke naanị ya.
- issue: Ndị ἀδελφότητι na-agụnye
  choice: ụmụnna unu ndị kwere ekwe
  alternative: òtù ụmụnna unu
  rationale: Okwu Grik bụ aha mkpokọta nke na-ezo aka n’obodo ndị kwere ekwe dum, ụmụ nwoke na ụmụ nwanyị, ọ bụghị naanị ụmụ nwoke.
- issue: Ike echiche dị na ἐπιτελεῖσθαι
  choice: na-agabigakwa
  alternative: a na-emezu; a na-eweta n’isi njedebe
  rationale: ‘Na-agabiga’ bụ Igbo doro anya n’ọnọdụ a, ma ihe ngwaa Grik nwere ike ịpụta banyere imezu ahụhụ ekwesịghị ifunahụ; ya mere e gosiri ya n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ụdị iwu nke ọtụtụ mmadụ (‘Guzogidenụ’) kwekọọ na ndị a na-agwa okwu. A họọrọ ‘ụmụnna unu ndị kwere ekwe’ ka njikọ ezinụlọ dị na Grik wee pụta ìhè ma ka o doo anya na ọ gụnyere obodo ndị kwere ekwe dum.
