revisions:
- from: Nweenụ uche doro anya[a]; mụrụnụ anya. Onye iro unu, bụ ekwensu, na-agagharị[b] dị ka ọdụm na-ebigbọ, na-achọ onye ọ ga-eripịa.
  to: Nweenụ uche doro anya[a]; nọọnụ na nche. Onye iro unu, bụ ekwensu, na-agagharị[b] dị ka ọdụm na-ebigbọ, na-achọ onye ọ ga-eripịa.
  rationale: The revision retains the draft’s faithful overall sense, improves the Standard Igbo idiom for watchful vigilance, and replaces both footnotes with alternatives and explanations that remain within the semantic range of the Greek without adding imagery or making misleading lexical claims.
