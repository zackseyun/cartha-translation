id: 1PE.5.8
reference: 1 Peter 5:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν ⸀τινα ⸀καταπιεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: ig
  text: Nweenụ uche doro anya[a]; nọọnụ na nche. Onye iro unu, bụ ekwensu, na-agagharị[b] dị ka ọdụm na-ebigbọ, na-achọ onye ọ ga-eripịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nọọnụ n'uche kwụ ọtọ,” ma ọ bụ, “Nọọnụ n'uche na njide onwe.” Ngwaa Grik bụ νήψατε; n'ụzọ nkịtị, ọ metụtara ịṅụbiga mmanya ókè, ma n'ebe a ọ na-ekwu maka ịdị doro anya n'uche na ịdị njikere n'oge ihe ize ndụ ime mmụọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-awagharị.” N'ụzọ nkịtị, ngwaa Grik ahụ pụtara “na-agagharị” ma ọ bụ “na-ejegharị”; ihe oyiyi ọdụm na-eme ka echiche nke ịzọgharị nwayọọ nwayọọ pụta ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε (νήφω)
  choice: Nweenụ uche doro anya
  rationale: N'ebe a, ngwaa ahụ na-ezo aka n'ịdị akọ n'uche na ijide onwe onye mgbe ihe ize ndụ ime mmụọ dị, ọ bụghị nanị izere mmanya. Nsụgharị a na-emekwa ka ọ dị iche na γρηγορήσατε, bụ́ ịmụrụ anya.
- source_word: γρηγορήσατε
  choice: mụrụnụ anya
  rationale: Nke a bụ ụzọ Igbo si ekwu ka mmadụ nọgide na-eche nche ma dị njikere; ọ na-akwado νήψατε n'enweghị ikwughachi otu echiche ahụ kpọmkwem.
- source_word: ἀντίδικος
  choice: onye iro unu
  rationale: Ọ bụ ezie na okwu Grik ahụ nwere ike ịpụta onye na-emegide mmadụ n'okwu ikpe, n'ebe a ọ na-egosi onye na-emegide ndị na-agụ akwụkwọ ahụ n'ozuzu ya.
- source_word: διάβολος
  choice: ekwensu
  rationale: N'ebe a, okwu ahụ bụ aha a maara nke onye ọjọọ ahụ, ọ bụghị nanị onye nkwutọ nkịtị.
- source_word: ὡς λέων ὠρυόμενος
  choice: dị ka ọdụm na-ebigbọ
  rationale: Nke a na-edobe ntụnyere doro anya na ihe oyiyi ọdụm nke na-ebigbọ.
- source_word: περιπατεῖ
  choice: na-agagharị
  rationale: Nke a na-edobe isi echiche ngwaa Grik ahụ, bụ́ ịga ma ọ bụ ịgagharị, ma hapụ ihe oyiyi ọdụm ka o gosipụta egwu dị na ya.
- source_word: ζητῶν τινα καταπιεῖν
  choice: na-achọ onye ọ ga-eripịa
  rationale: “Eripịa” bụ okwu Igbo kwekọrọ n'omume ọdụm ma na-ebute ike nke καταπιεῖν, bụ́ ilo ma ọ bụ laa mmadụ n'iyi.
theological_decisions:
- issue: Ma a ga-asụgharị διάβολος dị ka aha nkịtị pụtara “onye nkwutọ” ka ọ bụ dị ka aha onye ọjọọ ahụ
  choice: ekwensu
  alternative: onye nkwutọ
  rationale: Ihe gbara okwu ahụ gburugburu na-egosi onye ọjọọ ahụ na-emegide ndị kwere ekwe, ọ bụghị onye nkwutọ ọ bụla.
- issue: Ókè ike a ga-etinye na περιπατεῖ n'ime ihe oyiyi ọdụm
  choice: na-agagharị
  alternative: na-ezogharị na-achọ anụ ọ ga-eri
  rationale: “Na-agagharị” dị nso n'okwu Grik, ebe ntụnyere ọdụm na-ebigbọ na-ebute echiche ịchụ nta. A na-edebe nsụgharị kọwara ịchụ nta karịa na nkọwa ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe ma dị ùgwù, mee nsụgharị ahụ. E ji ụdị iwu nke ọtụtụ mmadụ—“Nweenụ” na “mụrụnụ”—gosipụta na okwu ahụ bụ maka ndị a na-agwa okwu ọnụ. E debere ihe oyiyi ọdụm na-ebigbọ na ike nke “eripịa” n'ụzọ nkịtị ma doo anya.
