id: 1PE.5.6
reference: 1 Peter 5:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ταπεινώθητε οὖν ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ, ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/006.yaml
  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: ig
  text: Ya mere, wedanụ onwe unu ala[a] n’okpuru aka dị ike nke Chineke, ka o wee bulie unu elu n’oge kwesịrị ekwesị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ka e weda unu ala ... ka o wee bulie unu elu n’oge kwesịrị ekwesị.” N’ihe gbasara nhazi okwu, iwu Grik ahụ dị n’olu nnara, ọ bụ ezie na n’ebe a a na-aghọtakarị ya dị ka “wedanụ onwe unu ala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταπεινώθητε
  choice: wedanụ onwe unu ala
  rationale: Ụdị ngwaa Grik a bụ iwu n’olu nnara, ma n’ọnọdụ ndụmọdụ a, a na-aghọtakarị ya n’ụzọ na-alaghachikwuru ndị a na-agwa okwu. Nhọrọ a bụ Igbo dị ndụ nke na-egosipụta iwu ka ha jiri obi umeala doo onwe ha n’okpuru Chineke, ebe nkọwa ala peeji na-echekwa ụdị nnara nke Grik.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya banyere Chineke iguzogide ndị mpako ma nye ndị dị umeala n’obi amara.
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα
  choice: n’okpuru aka dị ike
  rationale: Nke a na-echekwa ihe atụ Akwụkwọ Nsọ banyere ike na ọchịchị Chineke, ma bụrụkwa okwu Igbo doro anya.
- source_word: τοῦ θεοῦ
  choice: nke Chineke
  rationale: Ọ na-akọwa onye aka ahụ bụ nke ya n’enweghị mgbakwunye nkọwa.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a na-egosipụta ebumnuche ma ọ bụ ihe ga-esi na ya pụta n’Igbo nkịtị.
- source_word: ὑμᾶς ὑψώσῃ
  choice: o wee bulie unu elu
  rationale: Chineke bụ onye a ghọtara dị ka isiokwu ngwaa ahụ. ‘Bulie unu elu’ na-echekwa echiche nke ibuli ndị dị umeala n’obi nye nsọpụrụ ma ọ bụ nkwado, na-enweghị ime ka ọ bụrụ naanị ibuli ahụ elu.
- source_word: ἐν καιρῷ
  choice: n’oge kwesịrị ekwesị
  rationale: καιρός na-ezo aka n’oge dabara adaba ma ọ bụ oge e kenyere, ọ bụghị naanị oge n’usoro elekere.
theological_decisions:
- issue: Olu na onye na-eme ihe na Ταπεινώθητε
  choice: 'A sụgharịrị ya dịka iwu na-alaghachikwuru ndị a na-agwa okwu: ‘wedanụ onwe unu ala,’ ma debe ‘n’okpuru aka dị ike nke Chineke.’'
  alternative: ‘Ka e weda unu ala’ ma ọ bụ ‘Ka unu bụrụ ndị e wedara ala.’
  rationale: Nke a na-eme ka iwu ahụ bụrụ Igbo nkịtị ma gosipụta ọrụ mmadụ n’ido onwe ya n’okpuru Chineke. Nkọwa ala peeji na-echekwa mgbagwoju anya dị n’ụdị nnara nke Grik, ebe Chineke ka bụ onye ga-ebuli ha elu.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwụ ọtọ ma nwee ugwu. E ji ‘aka dị ike’ chekwaa ihe atụ Akwụkwọ Nsọ, ebe ‘n’oge kwesịrị ekwesị’ na-eme ka echiche καιρός doo onye nkịtị anya.
