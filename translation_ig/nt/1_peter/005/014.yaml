source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἀγάπης. εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/014.yaml
  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: ig
  text: Jirinụ nsusu ọnụ nke ịhụnanya kelee ibe unu. Udo dịrị unu niile ndị nọ n’ime Mesaịa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka ntụgharị ọdịnala si kwuo, “ndị nọ n’ime Kraịst.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ἀσπάσασθε ἀλλήλους
  choice: Keleenụ ibe unu
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha na-ekele ibe ha; ntụgharị a na-egosi omume ahụ dị ka nke onye ọ bụla na-emere ibe ya, ma bụrụkwa Igbo a na-asụ n’ụzọ eke.
- source_word: ἐν φιλήματι ἀγάπης
  choice: site na nsusu ọnụ nke ịhụnanya
  rationale: “Site na” na-egosi ụzọ e si ekele, “nsusu ọnụ” na-asụgharị φίλημα, ebe “nke ịhụnanya” na-edobe njikọ genitive nke ἀγάπης na okwu ịhụnanya n’ụzọ doro anya.
- source_word: εἰρήνη
  choice: Udo dịrị
  rationale: Ọ bụ ezie na Grik nwere naanị aha “udo,” n’Igbo usoro ngọzi a chọrọ ngwaa ka ọ bụrụ nke eke; “Udo dịrị” na-edobe ike nke ekpere/ngọzi ahụ n’etinyeghị nkọwa ọzọ.
- source_word: ὑμῖν πᾶσιν
  choice: unu niile
  rationale: Nke a na-egosi na ngọzi ahụ bụ maka ndị niile a na-agwa okwu, n’enweghị onye a hapụrụ.
- source_word: τοῖς ἐν Χριστῷ
  choice: ndị nọ n’ime Mesaịa
  rationale: Nkebiokwu nwere article na prepositional phrase na-arụ ọrụ dịka “ndị nọ n’ime …”; “Mesaịa” na-asụgharị Χριστός dịka aha ọkwa nke Onye E Tere Mmanụ.
theological_decisions:
- issue: Otú e si asụgharị Χριστῷ n’okwu ἐν Χριστῷ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka nwere nghọta aha ọkwa nke Onye E Tere Mmanụ, ya mere “Mesaịa” na-eme ka nghọta ahụ pụta ìhè. E debere “Kraịst,” nke a maara nke ọma n’ọdịnala Ndị Kraịst Igbo, n’ala peeji ka a ghara izochi ụzọ ntụgharị ọzọ a na-ejikarị eme ihe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “Keleenụ ibe unu” maka iwu mmekọrịta obodo ahụ, “nsusu ọnụ nke ịhụnanya” iji chekwaa ọdịdị okwu Grik, na “Udo dịrị” dịka usoro ngọzi Igbo nke eke. E debere akara ala peeji [a] ozugbo n’ebe okwu ọ na-akọwa dị.
