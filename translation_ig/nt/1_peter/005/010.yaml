id: 1PE.5.10
reference: 1 Peter 5:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: ig
  text: Ma Chineke nke amara niile, onye kpọrọ unu ka unu banye n’ebube ya nke na-adịru ebighị ebi n’ime Mesaịa[a], mgbe unu tachara ahụhụ obere oge, ya onwe ya ga-eweghachi unu n’ọnọdụ kwesịrị ekwesị[b], ga-eme ka unu kwụsie ike, ga-eme ka unu dị ike, ga-eguzobekwa unu n’elu ntọala siri ike[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime Kraịst.” A pụrụ ịsụgharị aha Grik a, Χριστός, dịka “Mesaịa” ma ọ bụ, n’usoro ọdịnala, “Kraịst.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ga-eme ka unu zuo oke” ma ọ bụ “ga-eme ka unu zuo ezu.” Ngwaa ahụ gụnyere echiche nke iweghachi ihe n’ọnọdụ kwesịrị ekwesị.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ga-atọ unu ntọala” ma ọ bụ “ga-eme ka unu guzosie ike n’elu ntọala siri ike.” Okwu Grik ahụ ji ihe atụ nke ntọala eme ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης χάριτος
  choice: nke amara niile
  rationale: Nke a na-edobe nghọta sara mbara nke amara Chineke niile, ma bụrụkwa okwu Igbo doro anya.
- source_word: καλέσας
  choice: onye kpọrọ unu
  rationale: A sụgharịrị participle a dị ka nkebiokwu kọwara Chineke; ọ na-egosi ọkpụkpọ ahụ mere eme n’enweghị itinye nkọwa ọzọ banyere oge ya.
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: ka unu bata n’ebube ya nke na-adịru ebighị ebi
  rationale: “Ka unu bata” na-echekwa ntụziaka nke εἰς, ebe nkebiokwu ndị ọzọ na-egosipụta ebube ahụ dị ka nke na-adịru ebighị ebi.
- source_word: ἐν Χριστῷ
  choice: n’ime Mesaya
  rationale: “Mesaya” na-asụgharị Χριστός dị ka utu aha, “n’ime” pedigidekwa usoro okwu Kraịst nke ἐν na-egosi n’ebe a.
- source_word: ὀλίγον παθόντας
  choice: mgbe unu tachara ahụhụ nwa oge
  rationale: Nke a na-ewere ὀλίγον dị ka oge dị mkpirikpi ma na-egosi usoro ahụhụ na omume Chineke ga-esochi ya.
- source_word: αὐτὸς
  choice: ya onwe ya
  rationale: 'Nke a na-edobe nkwusi ike dị na nnọchiaha Grik ahụ: Chineke n’onwe ya ga-eme ihe ndị a.'
- source_word: καταρτίσει
  choice: ga-eme ka unu dịghachi ka unu kwesịrị ịdị
  rationale: Nkebiokwu a na-egosi imezi ma ọ bụ iweghachi mmadụ n’ọnọdụ kwesịrị ekwesị, bụ isi echiche nke ngwaa ahụ n’ọnọdụ a.
- source_word: στηρίξει
  choice: mee ka unu guzosie ike
  rationale: Ọ na-egosi ime ka mmadụ kwụsie ike, ma na-anọpụ iche n’echiche nke ngwaa abụọ na-esote ya.
- source_word: σθενώσει
  choice: mee ka unu sie ike
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ na nke a na-aghọta ngwa ngwa iji gosipụta inye ume na ike.
- source_word: θεμελιώσει
  choice: tinyekwa unu n’elu ntọala siri ike
  rationale: Nke a na-echekwa ihe atụ nke ịtọ ntọala dị na ngwaa Grik ahụ, na-enweghị ịgwakọta ya na “guzosie ike.”
theological_decisions:
- issue: Nsụgharị Χριστῷ
  choice: Mesaya
  alternative: Kraịst
  rationale: Χριστός bụ utu aha pụtara onye e tere mmanụ; “Mesaya” na-eme ka ihe utu aha ahụ pụtara pụta ìhè, ebe e debere “Kraịst” dị ka nsụgharị ọdịnala na nkọwa ala peeji.
- issue: Mmekọrịta dị n’etiti ahụhụ na ihe Chineke ga-eme
  choice: mgbe unu tachara ahụhụ nwa oge
  alternative: mgbe unu tara ahụhụ nwa oge
  rationale: Nhọrọ a na-egosi na ahụhụ ahụ nwere oke ma na ihe Chineke ga-eme ga-esochi ya, ma ọ naghị akọwa usoro nkà mmụta okpukpe karịrị ihe ederede ahụ kwuru.
- issue: Ihe καταρτίσει pụtara
  choice: ga-eme ka unu dịghachi ka unu kwesịrị ịdị
  alternative: ga-eme ka unu zuo oke
  rationale: Nhọrọ bụ isi na-egosipụta iweghachi n’ọnọdụ kwesịrị ekwesị mgbe ahụhụ gasịrị, ma nkọwa ala peeji na-echekwa nghọta ọzọ nke ime ka ihe zuo oke ma ọ bụ mezue.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ngwaa anọ dị na Grik ma mee ka ọdịiche ha pụta ìhè. “Ya onwe ya” na-akwusi ike na Chineke n’onwe ya bụ onye ga-eme ihe ndị ahụ.
