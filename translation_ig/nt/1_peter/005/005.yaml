id: 1PE.5.5
reference: 1 Peter 5:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: ig
  text: 'N’otu ụzọ ahụ[a], unu ụmụ okorobịa, doonụ onwe unu n’okpuru ndị okenye. Ma unu niile, yikwasịnụ onwe unu[b] ịdị umeala n’obi n’ebe ibe unu nọ, n’ihi na,


    “Chineke na-emegide ndị mpako,

    ma ọ na-enye ndị dị umeala n’obi amara.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “unu ndị ka dị obere n’afọ.” Okwu Grik ahụ bụ ọtụtụ nke nwoke (“ụmụ okorobịa”), ọ bụ ezie na ụfọdụ na-ewere ya dị ka ndị niile ka dị obere n’afọ n’ime ọgbakọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “kechienụ ịdị umeala n’obi n’ahụ unu.” Ngwaa Grik ahụ na-enye echiche nke iyikwasị ma ọ bụ ikechi uwe n’ahụ, si otú a na-emesi mkpebi mmadụ ji eyiri ịdị umeala n’obi ike.
    reason: lexical_alternative
  - marker: c
    text: Nke a bụ okwu e hotara ma ọ bụ ntụaka sitere n’Ilu 3:34 na nsụgharị Grik Agba Ochie (LXX).
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: N’otu aka ahụ
  rationale: Ọ bụ njikọ okwu na-ejikọta ndụmọdụ a na nke bu ya ụzọ; okwu Igbo a doro anya ma bụrụ nke a na-asụkarị.
- source_word: νεώτεροι
  choice: unu ụmụ okorobịa
  rationale: Ụdị Grik ahụ bụ ọtụtụ nke nwoke ma na-egosi ndị nwoke ka dị obere n’afọ, n’iche ha na ndị okenye; ihe odide ala peeji na-egosi na a pụkwara ịghọta ya n’ụzọ sara mbara.
- source_word: ὑποτάγητε
  choice: doonụ onwe unu n’okpuru
  rationale: Nke a na-egosi ido onwe onye n’okpuru ikike ndị ọzọ, ma na-echekwa ume iwu dị n’ụdị ngwaa Grik.
- source_word: πρεσβυτέροις
  choice: ndị okenye
  rationale: N’ihi 1 Pita 5:1–4, o yikarịrị ka ọ na-ezo aka n’ime ndị okenye na-elekọta ọgbakọ. ‘Ndị okenye’ bụkwa okwu Igbo kwesịrị ekwesị nke na-anaghị etinye nkọwa karịrị isi mmalite.
- source_word: πάντες
  choice: unu niile
  rationale: Ọ na-agbasawanye ndụmọdụ ahụ site n’ebe ụmụ okorobịa nọ ruo n’ebe ndị niile nọ.
- source_word: ἀλλήλοις
  choice: n’ebe ibe unu nọ
  rationale: Ọ na-egosi mmekọrịta nke onye ọ bụla n’ebe ibe ya nọ n’ime ọgbakọ.
- source_word: ταπεινοφροσύνην
  choice: ịdị umeala n’obi
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị ndụ si kwuo ịdị nwayọọ na enweghị nganga.
- source_word: ἐγκομβώσασθε
  choice: yikwasịnụ onwe unu
  rationale: Ọ na-echekwa ihe atụ nke iyikwasị ma ọ bụ ikechi uwe n’ahụ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe mere e ji nye ndụmọdụ ahụ.
- source_word: ὑπερηφάνοις
  choice: ndị mpako
  rationale: Ọ na-anọchi anya ndị e ji nganga mara n’ụzọ dị nkenke ma doo anya.
- source_word: ἀντιτάσσεται
  choice: na-emegide
  rationale: Ọ na-egosi na Chineke na-eguzo megide ndị mpako, ọ bụghị naanị na omume ha adịghị ya mma.
- source_word: χάριν
  choice: amara
  rationale: ‘Amara’ bụ okwu Igbo a maara nke ọma maka χάρις ma na-echekwa ịdị omimi nke echiche ahụ.
theological_decisions:
- issue: Onye πρεσβυτέροις na-ezo aka na ya
  choice: ndị okenye ọgbakọ
  alternative: ndị nwoke meworo agadi n’ozuzu
  rationale: Amaokwu 1–4 kpọmkwem na-ekwu banyere ndị okenye na-azụ ìgwè atụrụ Chineke, ya mere ndị ndu okenye nke ọgbakọ bụ nghọta kacha kwekọọ n’ihe gbara ya gburugburu. Ma e debere ‘ndị okenye’ n’amaokwu ahụ ka a ghara imechi oke nghọta okwu Grik ahụ.
- issue: Ụdị nwoke nke νεώτεροι
  choice: unu ụmụ okorobịa
  alternative: unu ndị ka dị obere n’afọ
  rationale: Ụdị Grik bụ ọtụtụ nke nwoke. Nsụgharị ahụ chekwara nke a, ebe ihe odide ala peeji na-egosi nghọta sara mbara nke ụfọdụ na-enye ya. Okwu ‘unu niile’ na-esochi ya na-eme ka o doo anya na iwu banyere ịdị umeala n’obi gbasara mmadụ niile.
- issue: Ike okwu Chineke megide ndị mpako
  choice: Chineke na-emegide ndị mpako
  alternative: Chineke na-eguzogide ndị mpako
  rationale: ‘Na-emegide’ na-echekwa nkwupụta siri ike nke ἀντιτάσσεται n’enweghị ime ka esemokwu dị n’etiti nganga mmadụ na omume Chineke dị nro.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. E chekwara iwu ndị dị n’isi mmalite, ihe atụ nke iyikwasị uwe, na ọdịiche dị n’etiti ndị mpako na ndị dị umeala n’obi. A hapụrụ ‘ndị okenye’ n’enweghị mgbakwunye n’ahịrị bụ isi ka asụsụ ahụ bụrụ nke ebumpụta ụwa ma ghara ịkọwa ihe odide ahụ karịa ka o kwuru.
