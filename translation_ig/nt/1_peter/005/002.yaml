revisions:
- from: Na-azụnụ ìgwè atụrụ Chineke nke dị n’etiti unu[a], na-elekọta ha, ọ bụghị n’ihi mmanye, kama jiri obi unu niile, dị ka Chineke si chọọ; ọ bụghịkwa n’ihi uru ihere, kama jiri ịnụ ọkụ n’obi.
  to: Zụọnụ ìgwè atụrụ Chineke nke dị n’etiti unu, na-elekọta ya, ọ bụghị n’ihi mmanye, kama n’afọ ofufo, dị ka Chineke si chọọ[a]; ọ bụghịkwa n’ihi irite uru n’ụzọ ihere, kama jiri ịnụ ọkụ n’obi.
  rationale: The revision restores the voluntary sense of ἑκουσίως, places the κατὰ θεόν footnote at its proper anchor, and uses clearer idiomatic Igbo for disgraceful gain. It retains the source’s pastoral metaphor, nontechnical description of oversight, and theological ambiguity as far as natural Igbo permits.
