id: 1PE.5.2
reference: 1 Peter 5:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: ig
  text: Zụọnụ ìgwè atụrụ Chineke nke dị n’etiti unu, na-elekọta ya, ọ bụghị n’ihi mmanye, kama n’afọ ofufo, dị ka Chineke si chọọ[a]; ọ bụghịkwa n’ihi irite uru n’ụzọ ihere, kama jiri ịnụ ọkụ n’obi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịghọta ya dịka: “n’ụzọ kwekọrọ n’uche Chineke” ma ọ bụ “dị ka Chineke chọrọ ka unu mee.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ποιμάνατε
  choice: Na-azụnụ
  rationale: Ọ bụ iwu e nyere ndị okenye ka ha rụọ ọrụ onye na-azụ atụrụ; ntụgharị a na-echekwa ihe atụ nke ịzụ atụrụ n’asụsụ Igbo dị mfe.
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: ìgwè atụrụ Chineke nke dị n’etiti unu
  rationale: A hapụrụ ‘ìgwè atụrụ’ na ‘nke Chineke’ n’ụzọ doro anya iji gosi na ìgwè ahụ bụ nke Chineke, ọ bụghị ihe ndị okenye nwe; ‘dị n’etiti unu’ na-echekwa ọdịdị ἐν ὑμῖν.
- source_word: ἐπισκοποῦντες
  choice: na-elekọta ha
  rationale: Nke a na-egosi ọrụ nlekọta na ilekọta ìgwè ahụ n’ejighị aha ọkwa ụka pụrụ iche nke nwere ike ibubata usoro ọchịchị otu ụka.
- source_word: μὴ ἀναγκαστῶς
  choice: ọ bụghị n’ihi mmanye
  rationale: ‘Mmanye’ na-egosi ime ihe n’ihi nrụgide ma ọ bụ n’ihi na a manyere mmadụ, dịka okwu Grik si dị.
- source_word: ἀλλὰ ἑκουσίως
  choice: kama jiri obi unu niile
  rationale: Nkebi a na-egosi ime ọrụ ahụ site n’obi mmadụ n’onwe ya, n’enweghị mmanye; ọ bụkwa okwu Igbo nkịtị ma doo anya.
- source_word: κατὰ θεόν
  choice: dị ka Chineke si chọọ
  rationale: Nkebi Grik a dị mkpụmkpụ ma nwee ike ịpụta ime ihe dịka uche Chineke, ụkpụrụ ya, ma ọ bụ otú ọ chọrọ. Ntugharị a bụ nke e ji eme ihe n’Igbo ma a kọwara njupụta ya n’ala peeji.
- source_word: μηδὲ αἰσχροκερδῶς
  choice: ọ bụghịkwa n’ihi uru ihere
  rationale: '‘Uru ihere’ na-echekwa ike omume dị na αἰσχροκερδῶς: uru a na-achụ n’ụzọ jọgburu onwe ya ma ọ bụ n’ebumnobi na-adịghị mma.'
- source_word: ἀλλὰ προθύμως
  choice: kama jiri ịnụ ọkụ n’obi
  rationale: Nke a na-egosi ịdị njikere na ịnụ ọkụ n’obi, ma na-eme ka ọ dị iche na ἑκουσίως, nke e kwuru tupu ya.
theological_decisions:
- issue: Ma a ga-atụgharị ἐπισκοποῦντες dịka aha ọkwa ụka pụrụ iche
  choice: 'A tụgharịrị ya dịka ọrụ: ‘na-elekọta ha.’'
  alternative: ‘na-eje ozi dịka ndị nlekọta’ ma ọ bụ ‘dịka ndị bishọp’
  rationale: Okwu ahụ na-akọwa ọrụ ndị okenye kwesịrị ịrụ n’ebe a, ọ bụghị n’ezie aha ọkwa ụka nke e mesịrị guzobe. Nke a na-ezere ibubata usoro ọchịchị otu ụka.
- issue: Ogo nkọwa a ga-etinye na κατὰ θεόν
  choice: ‘dị ka Chineke si chọọ,’ tinyere nkọwa ọzọ n’ala peeji
  alternative: ‘dị ka Chineke si dị’ ma ọ bụ ‘n’ụzọ kwekọrọ n’uche Chineke’
  rationale: Nkebi ahụ nwere mkpakọ pụtara ihe ma nwee ike igosi uche Chineke, ụkpụrụ ya, ma ọ bụ ụzọ kwekọrọ na ya. A họọrọ okwu Igbo sitere n’okike ma hapụkwa obosara ahụ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A chekwara ihe atụ nke ìgwè atụrụ na onye na-azụ ha, ma zere okwu ọkwa ụka nke otu òtù pụrụ iche.
