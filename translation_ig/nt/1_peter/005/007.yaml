  text: πᾶσαν τὴν μέριμναν ὑμῶν ἐπιρίψαντες ἐπ’ αὐτόν, ὅτι αὐτῷ μέλει περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/007.yaml
  text: casting all your anxiety on him[c][b][a], because he cares for you.
translation:
  language: ig
  text: na-atụkwasị ya[c][b] nchegbu[a] unu niile, n’ihi na ọ na-eche banyere unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị μέριμνα dịka “nlekọta,” “ihe na-enye nsogbu,” ma ọ bụ “nchekasị”; n’ebe a, ọ pụtara nlekọta jupụtara na nchegbu.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ nkịtị: “mgbe unu tụkwasịrị ya [nchegbu unu]” ma ọ bụ “na-atụkwasị ya [nchegbu unu].”'
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, Chineke, dịka amaokwu nke 6 nke dị ya nso si gosi.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσαν
  choice: niile
  rationale: Ọ na-enye echiche zuru ezu nke nchegbu ha dum, ma dabara n’ụzọ e si ekwu ya n’Igbo.
- source_word: μέριμναν
  choice: nchegbu
  rationale: N’ebe a, okwu ahụ pụtara nchekasị ma ọ bụ ibu na-enye mmadụ nsogbu, ọ bụghị nanị ilekọta ihe.
- source_word: ὑμῶν
  choice: unu
  rationale: Ọ bụ nnọchiaha onye nke abụọ n’ụbara; ọ na-egosi ma onye nwe nchegbu ma ndị Chineke na-eche banyere ha.
- source_word: ἐπιρίψαντες
  choice: na-atụkwasị
  rationale: Ụdị a na-echekwa njikọ participle ahụ na ndụmọdụ dị n’amaokwu bu ya ụzọ, ma na-ebunye ihe atụ nke ibufe ibu n’isi onye ọzọ n’Igbo dị mfe nghọta.
- source_word: ἐπ’ αὐτόν
  choice: ya
  rationale: Ọ na-echekwa nnọchiaha Grik na echiche nke ịtụkwasị onye ahụ ibu, na-akọwaghị aha ya n’ahịrịokwu ahụ.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe mere ha ga-eji tụkwasị ya nchegbu ha.
- source_word: μέλει
  choice: ọ na-eche
  rationale: N’ụzọ a, ọ na-egosi mmasị na nlekọta onye ahụ nwere n’ebe ha nọ n’asụsụ Igbo dị ugbu a.
- source_word: περὶ ὑμῶν
  choice: banyere unu
  rationale: N’akụkụ ‘ọ na-eche,’ nke a na-ebunye echiche nke ilebara ha anya na inwe mmasị n’ihe gbasara ha, n’enweghị ịgbakwunye echiche ọzọ.
theological_decisions:
- issue: Onye αὐτόν/αὐτῷ na-ezo aka na ya
  choice: ‘ya/ọ’ na-ezo aka na Chineke
  alternative: Onyenwe anyị n’ozuzu, ebe a na-amata onye ahụ site n’ihe gbara amaokwu ahụ gburugburu
  rationale: 1 Pita 5:6 kwuru ozugbo banyere ‘aka dị ike nke Chineke,’ ya mere Chineke bụ onye nnọchiaha ndị a na-ezo aka na ya. Nsụgharị ahụ hapụrụ ya dị ka nnọchiaha, dịka Grik si mee, ma kọwaa onye ọ bụ n’ihe odide ala peeji.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘nchegbu’ kama okwu teknụzụ, ma e chekwara njikọ ahịrịokwu a na ndụmọdụ dị n’amaokwu bu ya ụzọ site na ‘na-atụkwasị.’
