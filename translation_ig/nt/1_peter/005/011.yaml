revisions:
- from: Ka ike ọchịchị bụrụ nke ya ruo mgbe ebighị ebi[a]. Amen.
  to: Ka ike ọchịchị dịrị ya ruo mgbe ebighị ebi[a]. Amen.
  rationale: The revision renders αὐτῷ more directly with the idiomatic dative-oriented expression “dịrị ya,” while retaining “ike ọchịchị” for κράτος and the established idiom “ruo mgbe ebighị ebi” for the emphatic eternal-duration formula. The footnote is corrected so that its literal alternative reflects “ages” rather than “generations.”
  reviewer_model: gpt-5.6-terra
