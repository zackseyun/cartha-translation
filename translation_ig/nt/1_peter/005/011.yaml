  yaml_path: translation/nt/1_peter/005/011.yaml
  text: To him be the dominion forever and ever[a]. Amen.
translation:
  language: ig
  text: Ka ike ọchịchị dịrị ya ruo mgbe ebighị ebi[a]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ dabara nnọọ n'okwu Grik, “ruo n'oge nile nke oge nile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτῷ
  choice: nke ya
  rationale: Nnọchiaha a dị na dative ma na-ezo aka n’ebe Chineke nọ dịka ihe gbara amaokwu a gburugburu si gosi. N'okwu otuto Igbo, “Ka ... bụrụ nke ya” na-egosipụta echiche “nye ya/ọ bụ nke ya” n'ụzọ dị mfe ma dị ugwu.
- source_word: κράτος
  choice: ike ọchịchị
  rationale: N'okwu otuto a, κράτος abụghị naanị ume ma ọ bụ ike nkịtị; ọ bụ ike dị ukwuu e ji achị. “Ike ọchịchị” na-ejide ma echiche ike ma nke ịchị achị.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: ruo mgbe ebighị ebi
  rationale: Nke a bụ akpaokwu otuto na-egosi oge na-enweghị ọgwụgwụ. “Ruo mgbe ebighị ebi” bụ Igbo nkịtị, doro anya, ma na-echekwa ike nke akpaokwu ahụ.
- source_word: ἀμήν
  choice: Amen
  rationale: “Amen” bụ ntụgharị mkpụrụokwu a na-ejikarị n'Igbo, ọ na-echekwakwa ọrụ ya dịka nkwenye mmechi.
theological_decisions:
- issue: Ngwaa a na-aghọtaghị anya n'okwu otuto ahụ
  choice: Ka ike ọchịchị bụrụ nke ya
  alternative: Ike ọchịchị bụ nke ya
  rationale: Grik enweghị ngwaa e dere n'ebe a. Iji “Ka ... bụrụ nke ya” na-echekwa ụda ekpere na otuto nke okwu ahụ n'etinyeghị nkọwa karịrị ihe isi mmalite kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E ji usoro okwu otuto “Ka ... bụrụ nke ya” mee ka okwu ahụ bụrụ nke sitere n'okike n'Igbo ma chekwaa enweghị ngwaa pụtara ìhè dị na Grik.
