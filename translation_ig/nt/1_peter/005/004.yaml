source:
  edition: SBLGNT
  text: καὶ φανερωθέντος τοῦ ἀρχιποίμενος κομιεῖσθε τὸν ἀμαράντινον τῆς δόξης στέφανον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/004.yaml
  text: And when the Chief Shepherd is revealed[b][a], you will receive the unfading crown of glory.
translation:
  language: ig
  text: Mgbe a ga-ekpughe Onyeisi Ndị Ọzụzụ Atụrụ[a], unu ga-anata okpueze ebube nke na-adịghị akpọnwụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe Onyeisi Ndị Ọzụzụ Atụrụ pụtara.”
    reason: alternative_reading
  - marker: b
    text: Okwu Grik a sụgharịrị “okpueze” nwekwara ike ịpụta ihe e ji okooko osisi ma ọ bụ akwụkwọ kpaa gbaa isi, nke a na-enye onye meriri dịka ihe nrite na nsọpụrụ; ọ pụtaghị kpọmkwem okpueze eze.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθέντος
  choice: mgbe e kpughere
  rationale: Nkebi a bụ aorist passive participle n’usoro genitive absolute, nke na-egosi oge. “Mgbe e kpughere” na-edobe olu nnara na echiche nke ime ka onye ahụ pụta ìhè; “mgbe ọ pụtara” bụkwa ntụgharị kwe omume.
- source_word: ἀρχιποίμενος
  choice: Onyeisi Ndị Ọzụzụ Atụrụ
  rationale: Okwu njikọ a pụtara onye bụ isi ma ọ bụ onye kachasị elu n’etiti ndị ọzụzụ atụrụ. Nhọrọ a doro ndị na-agụ Igbo anya ma na-arụ ọrụ dị ka aha nsọpụrụ nke Kraịst n’ebe a.
- source_word: κομιεῖσθε
  choice: unu ga-anata
  rationale: Future middle indicative a na-ekwu maka ịnata ihe a na-enye dị ka ụgwọ ọrụ ma ọ bụ nsọpụrụ. “Unu ga-anata” bụ Igbo doro anya nke na-edobe echiche ahụ.
- source_word: ἀμαράντινον
  choice: nke na-adịghị akpọnwụ
  rationale: Adjective a na-akọwa ihe na-adịghị akpọnwụ ma ọ bụ tụfuo ịdị ọhụrụ ya. Nkebi a bụ asụsụ Igbo nkịtị ma na-edobe ihe oyiyi nke okpueze e ji ahịhịa ma ọ bụ akwụkwọ kpaa.
- source_word: τῆς δόξης
  choice: ebube
  rationale: E debere njikọ genitive ahụ n’ụzọ eke dị ka “okpueze ebube,” nke na-ahapụ mmekọrịta dị n’etiti okpueze na ebube ka ọ nọgide bụrụ nke sara mbara kama ịkọwa ya karịa ihe Grik kwuru.
- source_word: στέφανον
  choice: okpueze
  rationale: στέφανος nwere ike ịbụ ihe e ji kpaa gbaa isi nke a na-enye onye meriri ma ọ bụ onye a na-asọpụrụ, ọ bụghị naanị okpueze eze. “Okpueze” bụ okwu Igbo a na-aghọta ngwa ngwa; nkọwa ala peeji na-eme ka ọdịiche ahụ doo anya.
theological_decisions:
- issue: Onye “Onyeisi Ndị Ọzụzụ Atụrụ” bụ
  choice: E ji ya mee aha nsọpụrụ na-ezo aka na Jizọs
  alternative: Ịhapụ mkpụrụedemede ukwu ma were ya naanị dị ka nkọwa ọrụ
  rationale: N’ọnọdụ okwu banyere ịzụ ìgwè atụrụ na mkpughe nke ga-abịa, aha ahụ na-ezo aka na Jizọs. Mkpụrụedemede ukwu na-egosi na ọ bụ aha nsọpụrụ n’enweghị itinye nkọwa ozizi ọzọ n’ahịrịokwu ahụ.
- issue: Asụsụ banyere mkpughe nke oge ikpeazụ
  choice: mgbe e kpughere
  alternative: mgbe ọ pụtara
  rationale: Nhọrọ ahụ na-edobe olu nnara nke Grik na echiche nke ime ka onye ahụ pụta ìhè, n’agbanyeghị na “mgbe ọ pụtara” ka bụ ntụgharị kwe omume; a naghị akọwapụta ụdị ihe omume ahụ karịa ihe ederede kwuru.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ndị ọzụzụ atụrụ” mee ihe iji debe ihe oyiyi nke ederede, ebe “nke na-adịghị akpọnwụ” na-eme ka njikọ ya na okpueze e ji ihe ọkụkụ kpaa pụta ìhè. Akara ala peeji [a] na [b] niile dị n’ahịrịokwu bụ isi.
