review_pass:
  verdict: revise
  source_fidelity: A safe revision is needed. The temporal participle φανερωθέντος is governed by the future main verb and refers to the Chief Shepherd’s future manifestation. “Mgbe e kpughere” normally reads as a completed past passive event in Igbo. “Mgbe a ga-ekpughe ...” expresses the required future passive sense. The demonstrative “ahụ” has no counterpart in the Greek and should be omitted.
  naturalness: The revised wording is natural Standard Igbo and keeps a dignified biblical register. “Onyeisi Ndị Ọzụzụ Atụrụ” is understandable as a titular designation. Removing “ahụ” also makes the noun phrase less unnecessarily specific.
  terminology: “Onyeisi Ndị Ọzụzụ Atụrụ,” “anata,” “okpueze,” and “ebube” suitably convey the Greek terms. “Nke na-adịghị akpọnwụ” accurately conveys ἀμαράντινον without overstating it as indestructible. The lexical footnote appropriately distinguishes στέφανος from a royal crown.
  issues:
  - severity: medium
    issue: The verb phrase “Mgbe e kpughere” is past-oriented.
    rationale: Although the Greek aorist participle is formally past in aspect, in this future temporal construction it denotes the future revelation accompanying the future reception of the crown. Igbo should use a future passive construction.
  - severity: low
    issue: “ahụ” adds definiteness not marked in the Greek.
    rationale: The source has anarthrous στέφανον; omitting the demonstrative better preserves the source’s wording while remaining idiomatic.
  revised_text: Mgbe a ga-ekpughe Onyeisi Ndị Ọzụzụ Atụrụ[a], unu ga-anata okpueze ebube nke na-adịghị akpọnwụ[b].
