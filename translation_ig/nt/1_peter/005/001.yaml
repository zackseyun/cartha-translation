id: 1PE.5.1
reference: 1 Peter 5:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: ig
  text: 'Ya mere, ana m agba ndị okenye nọ n’etiti unu ume, dịka onye bụkwa okenye ibe unu na onye akaebe nke ahụhụ Mesaya ahụ[a], bụrụkwa onye na-ekerekwa òkè n’ebube ahụ a ga-ekpughe[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ahụhụ Kraịst.” A pụrụ ịsụgharị aha ọkwa Grik bụ Χριστός dịka “Mesaya” ma ọ bụ, dịka omenala siri dị, “Kraịst.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “onye na-enwe oke n’ebube ahụ a ga-ekpughe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: ndị okenye
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ụdị ndị ndu n’ọgbakọ, ọ bụghị nanị ndị nwoke merela agadi. “Ndị okenye” bụ okwu Igbo doro anya nke na-adịghị ebubata aha ọkwa nke otu ụka pụrụ iche.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi na ndụmọdụ a sitere n’ihe e kwuru tupu ya; “Ya mere” na-echekwa njikọ echiche ahụ.
- source_word: ἐν ὑμῖν
  choice: nọ n’etiti unu
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa eke isi kwuo na ndị okenye ahụ nọ n’ime obodo ndị a na-agwa okwu.
- source_word: παρακαλῶ
  choice: ana m agba ... ume
  rationale: Nkebiokwu a na-egosi arịrịọ siri ike na ndụmọdụ onye ọzụzụ atụrụ, ọ bụghị nanị ịrịọ ihe nkịtị.
- source_word: συμπρεσβύτερος
  choice: okenye ibe ha
  rationale: Ọ na-egosi na onye na-ekwu okwu so ha nwee otu ọrụ ahụ, ma na-echekwa ụda nke ịdị n’otu karịa ịkwalite onwe ya elu.
- source_word: μάρτυς
  choice: onye akaebe
  rationale: Isi echiche bụ onye na-agba akaebe banyere ahụhụ Mesaya ahụ; okwu a anaghị ekwu n’onwe ya na ọ bụ onye nwụrụ n’ihi okwukwe.
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: nke ahụhụ Mesaya ahụ
  rationale: Nke a na-egosi ahụhụ nke Mesaya tara, ma na-ahapụ usoro genitive ahụ n’ụzọ Igbo doro anya.
- source_word: Χριστοῦ
  choice: Mesaya ahụ
  rationale: Χριστός ka na-arụ ọrụ dịka aha ọkwa nke Onye E Tere Mmanụ n’ebe a; “Mesaya” na-eme ka ihe aha ahụ pụtara pụta ìhè.
- source_word: κοινωνός
  choice: onye ga-esokwa nwee oke
  rationale: Okwu a na-egosi onye ya na ndị ọzọ na-ekere òkè ma ọ bụ nwere oke n’ihe; nsụgharị a bụ Igbo eke ma zere echiche mmekọrịta azụmahịa.
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: n’ebube ahụ a na-aga ikpughe
  rationale: Nke a na-echekwa ọdịnihu na atụmanya dị na μέλλω, tinyere ụdị nnara nke ἀποκαλύπτεσθαι, n’enweghị ikpebi kpọmkwem oge ihe ahụ ga-eme.
theological_decisions:
- issue: Nsụgharị Χριστοῦ dịka aha ọkwa metụtara Onye E Tere Mmanụ
  choice: Mesaya ahụ
  alternative: Kraịst
  rationale: “Mesaya” na-egosipụta kpọmkwem echiche aha ọkwa Χριστός n’ebe a. E debere “Kraịst” na ndetu dịka nsụgharị ọdịnala, n’ebughị echiche otu ụka pụrụ iche bata.
- issue: Ike na oge dị na μελλούσης ἀποκαλύπτεσθαι
  choice: a na-aga ikpughe
  alternative: a ga-ekpughe
  rationale: Nhọrọ ahụ na-echekwa atụmanya ọdịnihu dị n’asụsụ Grik. Ọ naghị ekpebi arụmụka banyere otú oge ahụ si dị nso.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. “Ndị okenye” na “ana m agba ... ume” na-enye ụda nduzi ọgbakọ n’enweghị okwu teknụzụ nke otu ụka. E tinyere akara ndetu [a] na [b] n’ebe ha metụtara kpọmkwem.
