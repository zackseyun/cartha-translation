review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential appeal to the elders, the speaker’s status as fellow elder and witness of the Messiah’s sufferings, and participation in the glory yet to be revealed. However, “okenye ibe ha” has a third-person possessive (“their fellow elder”) where the Greek and direct address require “your fellow elder.” “Ga-esokwa nwee oke” unnecessarily makes the speaker’s sharing explicitly future; κοινωνός is a present descriptive participle, qualified by the future revelation of the glory.
  naturalness: The register is clear Standard Igbo. “Okenye ibe unu” is the natural form in this direct address. “Onye na-ekerekwa òkè n’ebube ahụ a ga-ekpughe” is more idiomatic and keeps the Greek syntax and sense without adding a future act of sharing.
  terminology: “Ndị okenye,” “Mesaya,” and “onye akaebe” are suitable and do not impose denominational terminology. The alternative “Kraịst” is appropriately retained in the footnote. “Ebube ahụ a ga-ekpughe” naturally expresses the future passive revelation; it does not over-specify disputed eschatological timing.
  issues:
  - severity: medium
    issue: “okenye ibe ha” uses the wrong possessive referent.
    rationale: The addressees are “unu” (you plural), and συμπρεσβύτερος means that the writer is their/your fellow elder. In Igbo direct address, this should be “okenye ibe unu.”
  - severity: medium
    issue: “onye ga-esokwa nwee oke” adds a future sense to the speaker’s participation.
    rationale: 'κοινωνός is present: the writer identifies himself as a sharer/participant. The future element belongs to the glory’s being revealed (μελλούσης ἀποκαλύπτεσθαι), not explicitly to his becoming a participant.'
  revised_text: 'Ya mere, ana m agba ndị okenye nọ n’etiti unu ume, dịka onye bụkwa okenye ibe unu na onye akaebe nke ahụhụ Mesaya ahụ[a], bụrụkwa onye na-ekerekwa òkè n’ebube ahụ a ga-ekpughe[b]:'
  revised_footnotes:
