    text: Ma ọ bụ, “ahụhụ Kraịst.” A pụrụ ịsụgharị aha ọkwa Grik bụ Χριστός dịka “Mesaya” ma ọ bụ, dịka omenala siri dị, “Kraịst.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “onye na-enwe oke n’ebube ahụ a ga-ekpughe.”
    reason: lexical_alternative
