  text: Mark, Aristarchus, Demas, and Luke, my fellow workers.
translation:
  language: ig
  text: Mak, Aristakọs, Dimas na Luk, ndị mụ na ha na-arụkọ ọrụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μᾶρκος
  choice: Mak
  rationale: Nsụgharị aha mmadụ ahụ n'ụdị mkpọpụta dabara n'Igbo; a naghị atụgharị ihe aha ahụ pụtara.
- source_word: Ἀρίσταρχος
  choice: Aristakọs
  rationale: Nsụgharị aha Grik ahụ n'ụdị mkpụrụokwu na mkpọpụta dị mfe nye ndị na-agụ Igbo.
- source_word: Δημᾶς
  choice: Demas
  rationale: E debere aha mmadụ ahụ dịka nsụgharị ụda ya, n'enweghị ịtụgharị ihe ọ pụtara.
- source_word: Λουκᾶς
  choice: Luk
  rationale: Ụdị aha a bụ nke dị mkpirikpi ma dabara na mkpọpụta Igbo.
- source_word: οἱ συνεργοί μου
  choice: ndị mụ na ha na-arụkọ ọrụ
  rationale: Nkebiokwu a na-egosi ndị ha na Pọl na-arụkọ ọrụ. Ụdị a bụ Igbo ebumpụta ụwa ma chekwaa echiche nke imekọ ihe ọnụ na ọrụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma nwee ugwu. E ji njikọ “ndị mụ na ha na-arụkọ ọrụ” mee ka njirimara aha anọ ahụ pụta ìhè n'ụzọ ndị nkịtị ga-aghọta ngwa ngwa.
