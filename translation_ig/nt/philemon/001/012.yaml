  text: ὃν ἀνέπεμψά ⸂σοι αὐτόν, τοῦτ’ ἔστιν τὰ ἐμὰ σπλάγχνα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/012.yaml
  text: I am sending him back to you—him[a], that is[b], my very heart.
translation:
  language: ig
  text: Ana m ezighachitere gị ya[a]—ya onwe ya bụ, obi m n’onwe m[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ezighachiri m gị ya” ma ọ bụ “Ezighachitela m gị ya.” Aorist Grik nwere ike igosi ihe a n’ụzọ ndị a; okwu dị n’ahịrị na-egosi izighachi ahụ dịka ọ dị mgbe akwụkwọ ozi ahụ na-erute Faịlimọn.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “akụkụ ime m.” N’akpaalaokwu, ọ na-egosi mmetụta ịhụnanya miri emi ma ọ bụ ọmịiko dị nro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: ya
  rationale: Nnọchiaha a na-arụtụ aka n’ebe Onesimọs nọ. “Ya” bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo ya.
- source_word: ἀνέπεμψά
  choice: Ana m ezighachitere …
  rationale: Ngwaa ἀναπέμπω pụtara izighachi mmadụ azụ. E ji usoro ihe na-aga n’ihu gosi ihe ahụ dị ka ọ dị mgbe akwụkwọ ozi ahụ rutere Faịlimọn, ma ndetu ala na-echekwa ụzọ ndị ọzọ e nwere isi ghọta aorist ahụ.
- source_word: σοι
  choice: gị
  rationale: Ọ bụ nnọchiaha onye nke abụọ n’otu, na-egosi onye a na-ezigara Onesimọs.
- source_word: αὐτόν
  choice: ya onwe ya
  rationale: Nkwughachi nnọchiaha ahụ na-enye Onesimọs nkwusi ike; “ya onwe ya” na-echekwa nkwusi ike ahụ n’Igbo.
- source_word: τοῦτ’ ἔστιν
  choice: ya bụ
  rationale: Nke a bụ usoro nkọwa nke na-akọwakwu ihe Pọl kwuru banyere Onesimọs.
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: obi m n’onwe ya
  rationale: σπλάγχνα pụtara akụkụ ime ahụ n’ụzọ nkịtị, ma n’ebe a ọ bụ akpaalaokwu maka mmetụta ịhụnanya miri emi. “Obi m n’onwe ya” na-ebute ike mmetụta okwu Pọl n’Igbo doro anya.
theological_decisions:
- issue: Ihe atụ gbasara akụkụ ime mmadụ dị na σπλάγχνα
  choice: obi m n’onwe ya
  alternative: akụkụ ime m; onye m ji obi m niile hụ n’anya
  rationale: Nhọrọ a na-enye ihe akpaalaokwu Grik ahụ pụtara n’Igbo nke oge a, n’etinyeghị ozizi pụrụ iche. Ọ na-echekwa otú Pọl si were Onesimọs dị ka onye dị ya ezigbo nso.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ nkwusi ike nke αὐτόν site n’okwu “ya onwe ya,” ma a sụgharịrị akpaalaokwu σπλάγχνα n’ụzọ ndị na-agụ Igbo ga-aghọta ozugbo.
