    issue: “nnukwu nkwuwa okwu” is stylistically awkward in this context.
    rationale: Although it can be understood as bold speech, παρρησία here concerns Paul’s confidence/boldness to issue a command. “nnukwu obi ike” is more idiomatic Standard Igbo without materially narrowing the source.
