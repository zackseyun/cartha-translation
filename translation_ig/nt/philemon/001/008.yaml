  text: Διό, πολλὴν ἐν Χριστῷ παρρησίαν ἔχων ἐπιτάσσειν σοι τὸ ἀνῆκον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/008.yaml
  text: Therefore[a], though I have much boldness in Messiah to command you to do what is proper[b],
translation:
  language: ig
  text: N’ihi ya, ọ bụ ezie na n’ime Mesaịa[a] m nwere nnukwu obi ike inye gị iwu ka i mee ihe kwesịrị ekwesị[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ime Kraịst.” Okwu Grik bụ Χριστός, aha-ọrụ nke pụtara Onye E Tere Mmanụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ihe dabara adaba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διό
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu Pọl na-ewepụta site n’ihe o kwuru tupu nke a, ma ọ bụkwa ụzọ Igbo dị mfe ma doo anya isi kwuo ‘ya mere.’
- source_word: πολλὴν ... παρρησίαν
  choice: nnukwu nkwuwa okwu
  rationale: Nke a na-echekwa echiche nke nkwuwa okwu, nnwere onwe ikwu okwu, na obi ike, n’ebughị ụzọ kpebie na naanị otu n’ime ha ka okwu Grik ahụ pụtara.
- source_word: ἐν Χριστῷ
  choice: n’ime Mesaịa
  rationale: E debere ἐν dị ka ‘n’ime’ iji chekwaa echiche Pọl nke mmekọrịta ma ọ bụ ọnọdụ dị n’ime Mesaịa; a sụgharịrị Χριστός dị ka aha-ọrụ ‘Mesaịa.’
- source_word: ἔχων
  choice: ọ bụ ezie na m nwere
  rationale: 'N’ọnọdụ a, participle ahụ na-ebute ọdịiche nke ga-apụta ìhè n’amaokwu nke 9: Pọl nwere ikike inye iwu, ma ọ họọrọ ịrịọ arịrịọ.'
- source_word: ἐπιτάσσειν σοι
  choice: inye gị iwu
  rationale: Okwu a na-egosi ikike ikwu ihe mmadụ ga-eme; ‘inye gị iwu’ bụ Igbo nkịtị nke na-echekwa ike okwu Grik ahụ.
- source_word: τὸ ἀνῆκον
  choice: ihe kwesịrị ekwesị
  rationale: Ọ na-ezo aka n’ihe dabara adaba ma kwesịkwa ka e mee, n’etinyeghị echiche siri ike karịa nke dị n’isi mmalite.
theological_decisions:
- issue: Nsụgharị Χριστῷ
  choice: Mesaịa
  alternative: Kraịst
  rationale: Χριστός bụ aha-ọrụ nke pụtara Onye E Tere Mmanụ; ‘Mesaịa’ na-eme ka ụdị aha-ọrụ ahụ pụta ìhè, ebe ‘Kraịst’ bụkwa nsụgharị ọdịnala a na-ahụkarị.
- issue: Ike nke ἔχων
  choice: ọ bụ ezie na m nwere
  alternative: ebe m nwere / n’ihi na m nwere
  rationale: Ihe ga-esochi n’amaokwu nke 9 na-egosi ọdịiche dị n’etiti ikike Pọl nwere inye iwu na nhọrọ ya ịrịọ n’ihi ịhụnanya. A hapụghị ọdịiche ahụ ka ọ ghọọ nkwupụta banyere ụdị ikike pụrụ iche na-adịghị na ederede.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Akara [a] dị n’akụkụ ‘Mesaịa,’ okwu ọ na-akọwa. Akara rikoma n’ikpeazụ na-egosi na ahịrịokwu ahụ na-aga n’ihu n’amaokwu nke 9.
