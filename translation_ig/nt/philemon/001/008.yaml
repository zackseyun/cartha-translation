  rationale: The revision is limited to replacing a less idiomatic expression for Paul’s παρρησία with natural Standard Igbo, “nnukwu obi ike,” and adjusting word order for fluency. The source’s ambiguity between boldness, confidence, and frankness is not resolved beyond what the context of commanding permits; the comma is retained because the sentence continues in verse 9.
