reference: Philemon 1:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/001.yaml
  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: ig
  text: 'Pọl, onye mkpọrọ nke Mesaịa[b] Jizọs[a], na Timoti, nwanne anyị, na-edegara Faịlimọn, onye anyị hụrụ n’anya na onye anyị na ya na-arụkọ ọrụ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye a tụrụ mkpọrọ n’ihi Mesaịa Jizọs.” Ụdị okwu Grik ahụ nwere ike igosi mmekọrịta ya na Mesaịa Jizọs ma ọ bụ ihe mere e ji tụọ ya mkpọrọ.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị “Mesaịa” dịka “Kraịst.” Okwu Grik bụ́ Χριστός bụ utu aha nke pụtara Onye E Tere Mmanụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσμιος
  choice: onye mkpọrọ
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke ndị Igbo taa na-aghọta maka onye nọ n’agbụ ma ọ bụ n’ụlọ mkpọrọ.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: N’ebe a, Χριστός ka na-arụ ọrụ dị ka utu aha nke pụtara Onye E Tere Mmanụ; ya mere, e jiri “Mesaịa” kama ime ya ka ọ bụrụ aha ezinụlọ.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: Nke a bụ nsụgharị aha Ἰησοῦ a na-ejikarị eme ihe n’Igbo ọkọlọtọ.
- source_word: ὁ ἀδελφὸς
  choice: nwanne anyị
  rationale: Ọ bụ ezie na Grik kwuru n’ụzọ nkịtị “nwanne ahụ,” “nwanne anyị” na-egosipụta nke ọma njikọ ezinụlọ nke ndị kwere ekwe nke okwu ahụ na-atụ aro n’okwu ekele a.
- source_word: ἀγαπητῷ
  choice: onye anyị hụrụ n’anya
  rationale: Nkebiokwu a na-egosipụta ịhụnanya miri emi nke okwu Grik ahụ nwere n’ụzọ dị ndụ ma dị mfe nghọta n’Igbo.
- source_word: συνεργῷ
  choice: onye anyị na ya na-arụkọ ọrụ
  rationale: Nke a na-egosipụta kpọmkwem onye ya na ndị ọzọ na-arụ otu ọrụ, ma na-adịkwa ụtọ n’Igbo karịa ịmanye otu aha ngwakọta.
- source_word: ἡμῶν
  choice: anyị
  rationale: E debere nnọchiaha ọtụtụ ahụ iji gosipụta usoro ndị zitere akwụkwọ ozi ahụ, bụ́ Pọl na Timoti, n’agbanyeghị na ọ pụrụ ịpụta na ọ na-ejikọ ha na ndị ọrụ ibe ndị ọzọ.
- source_word: Φιλήμονι
  choice: na-edegara Faịlimọn
  rationale: Dative nke onye a na-ezigara ekele ghọrọ okwu mmalite akwụkwọ ozi dị mfe nghọta n’Igbo.
- source_word: καὶ Τιμόθεος
  choice: na Timoti
  rationale: E debere njikọ ahụ ka Timoti pụta dị ka onye ya na Pọl so eziga ekele ahụ.
theological_decisions:
- issue: Nsụgharị Χριστός n’okwu ekele a
  choice: Mesaịa
  alternative: Kraịst
  rationale: Χριστός bụ utu aha n’ebe a, ọ bụghị naanị ihe dị ka aha nke abụọ; “Mesaịa” na-eme ka ihe utu aha ahụ pụtara nọgide doo anya.
- issue: Mmekọrịta genitive dị na δέσμιος Χριστοῦ Ἰησοῦ
  choice: onye mkpọrọ nke Mesaịa Jizọs
  alternative: onye a tụrụ mkpọrọ n’ihi Mesaịa Jizọs
  rationale: Nhọrọ bụ isi na-edebe mkpụmkpụ na mgbagwoju anya nke Grik, nke nwere ike igosi ịbụ nke Mesaịa Jizọs ma ọ bụ ịbụ onye mkpọrọ n’ihi ya; e nyere nghọta nke ihe kpatara mkpọrọ ahụ n’ala ala peeji.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ugwu ma dị mfe nghọta, mee ihe. A gbakwụnyere “na-edegara” iji mee ka ekele akwụkwọ ozi ahụ zuo oke n’Igbo, ebe a hapụrụ mgbagwoju anya nke genitive “nke Mesaịa Jizọs” ka nkọwa ala ala peeji kọwaa ụzọ ọzọ e nwere ike isi ghọta ya.
