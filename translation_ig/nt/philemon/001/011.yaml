  text: τόν ποτέ σοι ἄχρηστον νυνὶ ⸀δὲ σοὶ καὶ ἐμοὶ εὔχρηστον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/011.yaml
  text: who once was useless to you[a], but now is useful both to you and to me,
translation:
  language: ig
  text: onye na-abaghị gị uru na mbụ[a], ma ugbu a ọ bara ma gị ma m uru,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O yikarịrị ka Pọl ji aha Onesimọs mee egwuregwu okwu, n'ihi na aha ahụ metụtara ịbụ onye bara uru ma ọ bụ onye na-eweta uru.
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: onye
  rationale: Edemede a ji ọrụ nnọchiaha na-arụtụ aka n'azụ n'ebe Onesimọs nọ; “onye” na-aga n'ihu n'ahịrịokwu ahụ n'ụzọ Igbo kwesịrị ekwesị.
- source_word: ποτέ
  choice: n'oge gara aga
  rationale: Nke a na-egosi oge mbụ ma na-emegide νυνί, “ugbu a,” n'ụzọ doro anya.
- source_word: σοι
  choice: nye gị
  rationale: Ọ na-egosipụta onye ọnọdụ enweghị uru ahụ metụtara.
- source_word: ἄχρηστον
  choice: na-abaghị uru
  rationale: Ọ na-enye echiche nke ihe na-adịghị aba uru, ma na-edobe mmegide doro anya ya na εὔχρηστον.
- source_word: νυνὶ δὲ
  choice: ma ugbu a
  rationale: Ọ na-edobe ma mgbanwe oge ma ike mmegide nke δέ.
- source_word: σοὶ καὶ ἐμοὶ
  choice: nye gị ma nyekwa m
  rationale: Nkwughachi “nye” na-eme ka mmadụ abụọ ahụ doo anya ma na-anụkwa nke ọma n'Igbo.
- source_word: εὔχρηστον
  choice: ọ bara uru
  rationale: Nke a bụ okwu Igbo nkịtị maka ịbụ onye bara uru, ma na-echekwa egwuregwu okwu dị n'etiti ἄχρηστον na εὔχρηστον.
theological_decisions:
- issue: Egwuregwu okwu nwere ike ịdị n'aha Onesimọs na mgbanwe ndụ ya
  choice: Idobe mmegide dị mfe n'etiti “na-abaghị uru” na “bara uru” n'isiokwu
  alternative: Ịkọwa egwuregwu okwu ahụ kpọmkwem n'isiokwu, dịka “ugbu a ọ ghọọla onye bara uru n'ezie”
  rationale: Grik n'onwe ya na-eme ka mmegide ahụ doo anya; ịhapụ ya otu a na-echekwa mmetụta edemede ahụ n'etinyeghị nkọwa karịrị ihe isi mmalite kwuru.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “na-abaghị uru/bara uru” iji chekwaa mmegide okwu Grik na egwuregwu okwu nwere ike ịdị n'aha Onesimọs.
