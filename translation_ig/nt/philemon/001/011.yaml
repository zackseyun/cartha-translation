  naturalness: “Onye na-abaghị uru nye gị” is understandable, but “onye na-abaghị gị uru” is more natural Standard Igbo. Likewise, “ọ bara ma gị ma m uru” is a concise, idiomatic rendering that explicitly marks both recipients.
  terminology: “bara uru” and its negative counterpart preserve the Greek wordplay (ἄχρηστον/εὔχρηστον) well. The footnote correctly identifies the probable wordplay connected with Onesimọs’s name; its wording is lightly improved for idiomatic clarity.
