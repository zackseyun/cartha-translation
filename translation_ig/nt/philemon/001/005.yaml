translation:
  language: ig
  text: n’ihi na ana m anụ banyere ịhụnanya gị na okwukwe i nwere n’ebe Onyenwe Jizọs nọ nakwa maka ndị nsọ niile.[c][b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, ma a kọwaa ihe ọ pụtara nke ọma karị: “okwukwe i nwere n’ebe Onyenwe Jizọs nọ na ịhụnanya i nwere maka ndị nsọ niile.”'
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ntụkwasị obi i nwere.” Okwu Grik ahụ nwere ike ịpụta okwukwe, ntụkwasị obi, ma ọ bụ ikwesị ntụkwasị obi.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ịhụnanya gị na okwukwe i nwere.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκούων
  choice: ana m anụ
  rationale: Ọ na-egosi ihe Pọl na-anụ mgbe niile; e tinyere “n’ihi na” iji gosipụta njikọ ya na ekele dị n’amaokwu bu ya ụzọ.
- source_word: ἀγάπην
  choice: ịhụnanya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nsụgharị nkịtị nke ἀγάπη.
- source_word: πίστιν
  choice: okwukwe
  rationale: “Okwukwe” bụ nsụgharị a na-ejikarị eme ihe maka πίστις; ebe okwu Grik ahụ nwekwara ike ịpụta ikwesị ntụkwasị obi, e debere nke ahụ n’ala peeji.
- source_word: πρὸς τὸν κύριον Ἰησοῦν
  choice: n’ebe Onyenwe anyị Jizọs nọ
  rationale: Nkebiokwu a na-egosi ntụgharị uche na mmekọrịta chere ihu n’ebe Jizọs nọ, ma na-edebekwa ọdịiche ya na εἰς nke na-esote.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị eme ihe n’Igbo maka κύριος mgbe ọ na-ezo aka na Jizọs.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: maka ndị nsọ niile
  rationale: “Maka” na-enye okwu Igbo dị mfe ma kwekọọ na ịhụnanya e nwere maka ndị kwere ekwe ibe ya.
- source_word: ἁγίους
  choice: ndị nsọ
  rationale: Ọ bụ aha dị nkenke, nke a maara nke ọma, e ji akpọ ndị nke Chineke n’akwụkwọ Pọl.
theological_decisions:
- issue: Otú e si jikọta “ịhụnanya” na “okwukwe” na nkebiokwu abụọ na-esote
  choice: 'E debere usoro okwu Grik: ịhụnanya na okwukwe buru ụzọ, nkebiokwu abụọ ahụ esorozie ha, n’enweghị ikewapụ nke ọ bụla n’ụzọ doro anya.'
  alternative: A pụrụ ịkọwa ya nke ọma dị ka okwukwe n’ebe Onyenwe anyị Jizọs nọ na ịhụnanya maka ndị nsọ niile.
  rationale: Ọtụtụ ndị na-aghọta na okwukwe bụ nke e nwere n’ebe Jizọs nọ, ebe ịhụnanya bụ nke e nwere maka ndị nsọ. Ma okwu Grik ekewaghị ha hoo haa; ya mere isi ederede na-echekwa mgbagwoju anya ahụ, ebe nkọwa ala peeji na-enye nghọta a na-ahụkarị.
- issue: Ihe πίστις pụtara n’ebe a
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi
  rationale: “Okwukwe” na-edebe ihe okwu a na-apụtakarị. N’ihi na n’ebe a ọ pụkwara ịgụnye echiche nke ikwesị ntụkwasị obi, e nyere nke ahụ dị ka ụzọ ọzọ n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Onyenwe anyị Jizọs” na “ndị nsọ” na-edebe okwu Ndị Kraịst a maara nke ọma, ebe usoro ahịrịokwu ahụ na-echekwa mgbagwoju anya dị n’asụsụ Grik.
