  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: ig
  text: Ma ọ bụrụ na o mere gị ihe ọjọọ ọ bụla, ma ọ bụ o ji gị ụgwọ ọ bụla, deba nke ahụ n’akaụntụ m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “gụọ nke ahụ n’akaụntụ m.” Ngwaa Grik a bụ okwu ndekọ ego; ọ pụtara ịde ma ọ bụ ịgụta ihe dịka ụgwọ n’akaụntụ mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Ma ọ bụrụ na
  rationale: Nkebiokwu a na-egosi ọnọdụ ma na-ewetakwa obere ntụgharị site n’ihe e kwuru n’amaokwu bu ụzọ; “Ma ọ bụrụ na” bụ Igbo doro anya ma dị mma.
- source_word: τι ἠδίκησέν σε
  choice: o mere gị ihe ọjọọ ọ bụla
  rationale: Nke a na-edobe echiche sara mbara nke ime mmadụ ihe na-ezighị ezi n’enweghị ịkọwa ma ọ bụ mmerụ onwe onye ka ọ bụ nke ihe onwunwe.
- source_word: ἢ ὀφείλει
  choice: ma ọ bụ jiri gị ụgwọ ihe ọ bụla
  rationale: Okwu a na-ezo aka n’ụgwọ ma ọ bụ ibu ọrụ mmadụ ji ibe ya; ntụgharị a na-eme ka onye e ji ụgwọ doo anya site n’ọnọdụ okwu ahụ.
- source_word: τοῦτο
  choice: nke ahụ
  rationale: Ihe nrụtụaka a na-alaghachi n’ihe ọjọọ ma ọ bụ ụgwọ e kwuru tupu ya.
- source_word: ἐμοὶ ἐλλόγα
  choice: deba nke ahụ n’akaụntụ m
  rationale: ἐλλογέω bụ okwu ndekọ ego nke pụtara ịgụnye ihe n’akaụntụ mmadụ ma ọ bụ ibunye ya ụgwọ ahụ; okwu Igbo a na-echekwa ihe atụ azụmahịa ahụ n’ụzọ doro anya.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Akaụntụ” bụ okwu a na-eji kwa ụbọchị nke na-echekwa echiche ndekọ ego dị na Grik; ihe e kwuru ekpebighị ma ihe ahụ bụ mmejọ onwe onye, mmerụ ihe onwunwe, ma ọ bụ ụgwọ ego.
