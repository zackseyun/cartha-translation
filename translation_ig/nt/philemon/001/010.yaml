  text: παρακαλῶ σε περὶ τοῦ ἐμοῦ τέκνου, ὃν ἐγέννησα ἐν τοῖς ⸀δεσμοῖς Ὀνήσιμον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/010.yaml
  text: I appeal to you concerning my child[a], Onesimus, whom I fathered in my chains[b],
translation:
  language: ig
  text: Ana m arịọ gị banyere nwa m[a], bụ́ Onesimọs, onye m mụrụ n’agbụ m[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwa nke m.” “Nwa” ebe a bụ ihe atụ nke mmekọrịta ime mmụọ dị n’etiti Pọl na Onesimọs.
    reason: lexical_alternative
  - marker: b
    text: “N’agbụ m” pụkwara ịpụta “mgbe a tụrụ m mkpọrọ.” Grik ahụ na-echekwa onyinyo doro anya nke agbụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: Ana m arịọ
  rationale: Ọ na-egosi arịrịọ sitere n’obi n’ọnọdụ mmekọrịta, ọ bụghị iwu siri ike.
- source_word: περὶ τοῦ ἐμοῦ τέκνου
  choice: n’ihi nwa m
  rationale: N’ebe a περί na genitive na-ewebata onye Pọl na-arịọchitere; ‘nwa m’ na-echekwa ịhụnanya na ihe atụ nke ịbụ nne ma ọ bụ nna n’ime mmụọ.
- source_word: ὃν ἐγέννησα
  choice: onye m mụrụ
  rationale: Ọ na-echekwa ihe atụ ọmụmụ dị na γεννάω, kama ịkọwa ya ozugbo dị ka ime ka mmadụ chegharịa ma ọ bụ kwere ekwe.
- source_word: ἐν τοῖς δεσμοῖς
  choice: mgbe m nọ n’agbụ
  rationale: ‘Agbụ’ na-echekwa onyinyo doro anya nke δεσμοί, ebe usoro ahịrịokwu a na-eme ka o doo anya na ọ na-ekwu maka oge a tụrụ Pọl mkpọrọ.
- source_word: Ὀνήσιμον
  choice: Onesimọs
  rationale: E degharịrị aha Grik ahụ n’ụzọ kwekọrọ n’usoro ụda na odide Igbo.
theological_decisions:
- issue: Ụdị mmekọrịta dị n’etiti Pọl na Onesimọs
  choice: E debere ihe atụ nke Pọl ‘mụrụ’ Onesimọs n’agbụ.
  alternative: onye m ghọrọ nna ya mgbe a tụrụ m mkpọrọ
  rationale: Grik na-egosi ịbụ nna n’ime mmụọ site n’ihe atụ ọmụmụ, ma ọ naghị ekwu kpọmkwem na Pọl mere ka Onesimọs chegharịa. Nsụgharị ahụ anaghị etinye nkọwa okwukwe karịrị ihe ederede kwuru.
translation_notes:
  register: Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. E ji ‘Ana m arịọ’ gosipụta olu arịrịọ nke akwụkwọ ozi ahụ; e debekwara ihe atụ ‘mụrụ’ na ‘agbụ’ n’enweghị ịkọwa ha gabiga ihe Grik kwuru.
