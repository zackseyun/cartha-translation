id: PHM.1.4
reference: Philemon 1:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εὐχαριστῶ τῷ θεῷ μου πάντοτε μνείαν σου ποιούμενος ἐπὶ τῶν προσευχῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/004.yaml
  text: I always thank my God[a], making mention of you in my prayers,
translation:
  language: ig
  text: Ana m ekele Chineke m mgbe niile, na-akpọ aha gị n'ekpere m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-echeta gị n'ekpere m.” N'ụzọ nkịtị, okwu Grik ahụ bụ “na-eme ncheta gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Ana m ekele
  rationale: Okwu a bụ ngwaa dị n'oge ugbu a, onye mbụ otu; “Ana m ekele” bụ Igbo nkịtị nke na-egosi omume Pọl na-eme mgbe niile.
- source_word: τῷ θεῷ μου
  choice: Chineke m
  rationale: Dative ahụ na-egosi onye a na-ekele; n'Igbo, “ekele Chineke m” na-egosipụta nke a n'ụzọ ebumpụta ụwa ma debe okwu nke onwe bụ “m.”
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Nke a na-egosipụta ịdịgide ma ọ bụ ime ihe mgbe nile, kwekọọkwa n'okwu ekele dị n'amaokwu a.
- source_word: μνείαν σου ποιούμενος
  choice: mgbe m na-akpọ aha gị
  rationale: Akpaalaokwu Grik ahụ pụtara n'ụzọ nkịtị ime ka a kpọtụrụ mmadụ aha. “Na-akpọ aha gị” na-edebe echiche nke ikwu banyere Filimọn n'ihu Chineke, ọ bụghị naanị icheta ya n'obi.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: n'ekpere m
  rationale: N'ọnọdụ a, ἐπί ya na genitive na-egosi ọnọdụ ma ọ bụ oge a na-akpọ aha ya; “n'ekpere m” bụ okwu Igbo doro anya ma dịkwa mma.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E debere usoro participle nke Grik site n'iji “mgbe m na-,” ma zere asụsụ ụka pụrụ iche.
