    issue: The phrase “mgbe m na-akpọ aha gị” is introduced by a second “mgbe.”
    rationale: Greek μνείαν σου ποιούμενος is a present participial phrase accompanying “I thank”; it does not itself mean “when/whenever I mention you.” The added temporal conjunction can narrow or alter the relation between thanksgiving and prayerful mention.
