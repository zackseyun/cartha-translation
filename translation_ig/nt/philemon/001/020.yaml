  text: ναί, ἀδελφέ, ἐγώ σου ὀναίμην ἐν κυρίῳ· ἀνάπαυσόν μου τὰ σπλάγχνα ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/020.yaml
  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: ig
  text: Ee, nwanne, ka m rite uru[a] n’aka gị n’ime Onyenweanyị; mee ka obi m[b] zuru ike n’ime Mesaịa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘ka m nweta ihe ọma n’aka gị,’ ma ọ bụ ‘ka m nweta ọṅụ n’aka gị.’ O nwere ike ịbụ na Pọl na-eme egwuregwu okwu n’aha Onesimọs na echiche nke ịbụ onye bara uru.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ bụ ‘akụkụ ime m,’ akpaalaokwu na-ezo aka n’obi ma ọ bụ mmetụta miri emi. E ji ‘obi m’ sụgharịa ya n’Igbo ebumpụta ụwa.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, ‘n’ime Kraịst.’ Okwu Grik bụ Χριστός, aha ọkwa pụtara ‘Onye e tere mmanụ.’
    reason: alternative_reading
lexical_decisions:
- source_word: ναί
  choice: Ee
  rationale: Ọ bụ okwu nkwenye nke na-amalite arịrịọ ahụ n’ụzọ na-ekpo ọkụ ma kwụ ọtọ.
- source_word: ἀδελφέ
  choice: nwanne m
  rationale: Ọ bụ okwu Pọl ji kpọọ Faịlimọn, nwoke ya na ya bụ otu n’okwukwe; ‘nwanne m’ bụ ụzọ Igbo si ekwu ya n’ụzọ ebumpụta ụwa.
- source_word: ἐγώ σου ὀναίμην
  choice: ka m rite uru n’aka gị
  rationale: Nke a na-egosipụta arịrịọ dị n’optative ahụ ma debe echiche nke inweta uru; ọ nwekwara ike ikwe ka egwuregwu okwu Pọl nwere ike iji aha Onesimọs mee pụta ìhè.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Nke a na-edebe okwu Pọl banyere mmekọrịta na omume ndị dị n’ime Onyenwe anyị, ma jiri aha nsọ a na-anụkarị n’Igbo.
- source_word: ἀνάπαυσόν
  choice: mee ka ... zuru ike
  rationale: Ọ na-egosipụta iwu ka e nye onye ahụ izu ike, enyemaka, ma ọ bụ ume ọhụrụ; ọ dịkwa n’otu ahịrị echiche ahụ e kwuru na amaokwu 7.
- source_word: μου τὰ σπλάγχνα
  choice: obi m
  rationale: Ọ bụ ezie na okwu Grik ahụ pụtara akụkụ dị n’ime mmadụ n’ụzọ nkịtị, ebe a ọ bụ akpaalaokwu maka mmetụta miri emi ma ọ bụ mmadụ ime; ‘obi m’ bụ okwu Igbo doro anya ma dịrị ndụ.
- source_word: ἐν Χριστῷ
  choice: n’ime Mesaịa
  rationale: Χριστός bụ aha ọkwa pụtara Onye E Tere Mmanụ; ‘Mesaịa’ na-eme ka echiche aha ọkwa ahụ doo anya ma debe ọnọdụ mmekọrịta Ndị Kraịst nke ahịrịokwu ahụ.
theological_decisions:
- issue: Nsụgharị Χριστῷ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a, okwu ahụ na-arụ ọrụ dị ka aha ọkwa nke Onye E Tere Mmanụ. ‘Mesaịa’ na-echekwa echiche ahụ; ‘Kraịst’ bụkwa nsụgharị ọdịnala kwe omume.
- issue: Nsụgharị κυρίῳ
  choice: Onyenwe anyị
  alternative: Onye Nwe
  rationale: ‘Onyenwe anyị’ na-echekwa nsọpụrụ na ojiji aha ahụ n’akwụkwọ Pọl, n’etinyeghị echiche nna ukwu na ohu n’ebe okwu a na-ekwughị ya kpọmkwem.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe ụda arịrịọ Pọl, echiche nke uru nke nwere ike ịbụ egwuregwu okwu, na akpaalaokwu Grik banyere mmetụta ime n’enweghị nsụgharị siri ike nke na-adịghị ebumpụta ụwa n’Igbo.
