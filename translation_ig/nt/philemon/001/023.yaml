id: PHM.1.23
reference: Philemon 1:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεταί σε Ἐπαφρᾶς ὁ συναιχμάλωτός μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: ig
  text: Epafras, onye mụ na ya nọ n’ụlọ mkpọrọ n’ime Mesaya Jizọs, na-ekele gị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, dịka e si asụkarị ya, “n’ime Kraịst Jizọs.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: na-ekele
  rationale: N’ebe a, ἀσπάζομαι pụtara izigara mmadụ ekele ma ọ bụ ikele ya. “Na-ekele” bụ okwu Igbo doro anya ma kwekọọ na onye na-eme ihe nke bụ Epafras.
- source_word: σε
  choice: gị
  rationale: Ọ bụ nnọchiaha onye nke abụọ, otu onye, ma na-ezo aka kpọmkwem na Faịlimọn.
- source_word: Ἐπαφρᾶς
  choice: Epafras
  rationale: E dere aha onye ahụ n’ụdị dabara n’usoro mkpụrụokwu na mkpọpụta Igbo.
- source_word: ὁ συναιχμάλωτός μου
  choice: onye mụ na ya nọ n’ụlọ mkpọrọ
  rationale: Nke a na-egosi na Epafras bụ onye mkpọrọ ibe Pọl. Usoro a bụ Igbo ebumpụta ụwa karịa nsụgharị mkpụrụokwu n’otu n’otu, ma ọ naghị atụfu echiche ịbụ ndị mkpọrọ ọnụ.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaya Jizọs
  rationale: “N’ime” na-echekwa okwu Pọl banyere ịdị n’otu na Mesaya, kama ịgbanwe ya ka ọ bụrụ “n’ihi” ma ọ bụ “maka.” Χριστός bụ aha ọkwa e tere mmanụ, ya mere “Mesaya” na-egosipụta ihe ọ pụtara; Ἰησοῦ ghọrọ “Jizọs.”
theological_decisions:
- issue: Nsụgharị Χριστῷ n’usoro okwu Pọl bụ ἐν Χριστῷ Ἰησοῦ
  choice: Mesaya
  alternative: Kraịst
  rationale: “Mesaya” na-eme ka aha ọkwa Χριστός pụta ìhè ma na-echekwa ịdị arọ nke okwu ahụ. “Kraịst” bụ ụdị ọdịnala a maara nke ọma, ya mere e tinyere ya n’ala ala peeji.
- issue: Mmekọrịta nke ἐν Χριστῷ Ἰησοῦ na ịbụ onye mkpọrọ ibe Pọl
  choice: n’ime Mesaya Jizọs
  alternative: n’ihi Mesaya Jizọs
  rationale: E jigidere “n’ime” iji ghara idozi nghọta ahụ naanị ka ọ bụrụ ihe kpatara mkpọrọ; nke a na-echekwa asụsụ njikọ Pọl na Mesaya na obere mgbagwoju anya dị n’usoro Grik.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji apostrophe Unicode mee nkwekọ ụdaume n’okwu ndị dị ka “n’ụlọ” na “n’ime.” Akara ala ala peeji [a] dị n’isiokwu ahụ kpọmkwem.
