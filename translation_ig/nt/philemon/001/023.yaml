  source_fidelity: The translation accurately represents the singular greeting, Epaphras’s status as Paul’s fellow prisoner, and the Pauline phrase ἐν Χριστῷ Ἰησοῦ. “Onye mụ na ya nọ n’ụlọ mkpọrọ” communicates the reciprocal sense of συναιχμάλωτός without adding a theological interpretation, while “n’ime Mesaya Jizọs” retains the source’s deliberately compact ἐν phrase.
