source:
  edition: SBLGNT
  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: ig
  text: Ma achọghị m ime ihe ọ bụla n’enweghị nkwenye gị[a], ka ihe ọma gị[b] ghara ịdị ka nke sitere ná mmanye, kama ka ọ bụrụ nke afọ ofufo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “n’enweghị nkwado gị” ma ọ bụ “n’enweghị echiche gị.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “obiọma gị” ma ọ bụ “ịdị mma gị.” Okwu Grik ahụ nwere ike izo aka n’ezi ihe Faịlimọn ga-eme n’okwu a, ma ọ bụ n’ịdị mma ya n’ozuzu.
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “n’ụzọ afọ ofufo”; ya bụ, ihe e mere n’uche mmadụ onwe ya, ọ bụghị ná mmanye.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: n’enweghị nkwenye gị
  rationale: N’ebe a γνώμη nwere ike ịpụta echiche, mkpebi, ma ọ bụ nkwenye. “Nkwenye gị” na-egosi nke ọma na Pọl achọghị ime ihe ahụ ma ọ bụrụ na Faịlimọn ekweghị, ma ọ naghị eme ka ihe ahụ sie ike karịa otú Grik si kwuo ya.
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: achọghị m ime ihe ọ bụla
  rationale: Nke a na-egosipụta uche Pọl ma na-asụgharị θέλω n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ἵνα μὴ
  choice: ka ... ghara
  rationale: Usoro a na-egosipụta nzube Pọl n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: ὡς κατὰ ἀνάγκην
  choice: dị ka nke sitere ná mmanye
  rationale: “Dị ka” na-echekwa ὡς, ebe “sitere ná mmanye” na-egosi nrụgide ma ọ bụ ịmanye mmadụ, ọ bụghị naanị mkpa nkịtị.
- source_word: τὸ ἀγαθόν σου
  choice: ọrụ ọma gị
  rationale: N’ọnọdụ a, okwu ahụ yiri ka ọ na-ezo aka n’ezi ihe Faịlimọn ga-eme. “Ọrụ ọma gị” na-adị mfe nghọta, ebe nkọwa ala peeji na-echekwa ohere na ọ pụrụ ịpụta obiọma ma ọ bụ ịdị mma ya n’ozuzu.
- source_word: ᾖ
  choice: dị ... bụrụ
  rationale: Usoro Igbo a dabara n’ahịrịokwu nzube nke ἵνα ma na-egosi ụdị ihe Pọl chọrọ ka ọrụ ahụ bụrụ.
- source_word: ἀλλὰ κατὰ ἑκούσιον
  choice: kama ka ọ bụrụ nke i ji aka gị họrọ ime
  rationale: Nke a na-egosipụta na omume ahụ ga-esite n’uche Faịlimọn n’onwe ya, ọ bụghị ná mmanye, ma na-ada nke ọma n’Igbo karịa iji naanị otu okwu nkọwa.
theological_decisions:
- issue: Ụdị nzaghachi Faịlimọn
  choice: E gosipụtara nchegbu Pọl dị ka ọdịiche dị n’etiti ihe e mere ná mmanye na ihe mmadụ ji aka ya họrọ ime, n’akọwaghị kpọmkwem ọrụ ọma ahụ.
  alternative: A pụrụ ịsụgharị τὸ ἀγαθόν σου dịka “obiọma gị” ma ọ bụ “ịdị mma gị.”
  rationale: Grik na-emesi nnwere onwe nke nzaghachi Faịlimọn ike, ma ọ hapụrụ kpọmkwem ihe ọma ahụ n’amaghị ama. Nsụgharị a anaghị etinye nkọwa ụka ma ọ bụ ozizi ọzọ n’ime ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “N’enweghị nkwenye gị,” “sitere ná mmanye,” na “i ji aka gị họrọ ime” na-eme ka ọdịiche dị n’etiti nkwenye onwe onye na mmanye doo anya n’enweghị asụsụ ochie ma ọ bụ okwu nke otu ụka pụrụ iche.
