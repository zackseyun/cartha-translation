- from: Ya mere, ọ bụrụ na i weere m dị ka onye gị na ya na-ekere òkè, nabata ya[a] otú ị ga-esi nabata m.
  to: Ya mere, ọ bụrụ na i gụ m dịka onye mmekọ gị, nabata ya[a] otú ị ga-esi nabata m.
