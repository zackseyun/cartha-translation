  text: Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/017.yaml
  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: ig
  text: Ya mere, ọ bụrụ na i gụ m dịka onye mmekọ gị, nabata ya[a] otú ị ga-esi nabata m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “kweta ya” ma ọ bụ “nara ya nke ọma.” Ngwaa Grik ahụ nwere ike ịpụta ịnabata mmadụ nke ọma ma ọ bụ ịnakwere ya n’ime mmekọrịta.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Ya mere, ọ bụrụ na
  rationale: Nke a na-edobe njikọ nkwubi okwu nke οὖν na ọnọdụ nke εἰ, ma na-ada nke ọma n'Igbo nke oge a.
- source_word: ἔχεις κοινωνόν
  choice: i weere m dị ka onye gị na ya na-ekere òkè
  rationale: κοινωνός bụ onye ya na onye ọzọ nwere òkè ma ọ bụ mmekọrịta n'otu ihe. Nkebiokwu a na-egosi mmekọrịta na oke ha nwere ọnụ n'enweghị itinye nkọwa okpukpe pụrụ iche.
- source_word: προσλαβοῦ
  choice: nabata
  rationale: Iwu a nwere ike ịpụta ịnabata mmadụ nke ọma ma ọ bụ ikweta ka ọ bụrụ onye nọ n'ime mmekọrịta. “Nabata” na-eburu echiche abụọ ahụ n'Igbo.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n'Ọnesimọs dịka ihe a ga-anabata.
- source_word: ὡς ἐμέ
  choice: otú ị ga-esi nabata m
  rationale: 'A gbasaara ntụnyere ahụ ntakịrị ka ọ bụrụ Igbo doro anya: Filemon ga-anabata Ọnesimọs otu ọ ga-esi anabata Pọl.'
theological_decisions:
- issue: Ike mmekọrịta nke κοινωνός n'arịrịọ Pọl
  choice: onye gị na ya na-ekere òkè
  alternative: onye gị na ya nọ n'otu mmekọrịta
  rationale: Nhọrọ a na-egosi na Pọl na Filemon nwere òkè na mmekọrịta ọnụ, ma ọ naghị eme okwu ahụ ka ọ bụrụ aha nkà mmụta okpukpe ma ọ bụ echiche otu ụka pụrụ iche.
translation_notes:
  register: Asụsụ Igbo a bụ nke Standard Igbo, dị ugwu ma dị mfe nghọta. E ji “onye gị na ya na-ekere òkè” zere okwu mgbaziri ma chekwaa echiche mmekọrịta dị na κοινωνός. E debere akara nkọwa [a] n'akụkụ “nabata ya,” bụ okwu nkọwa ahụ na-akọwa.
