id: PHM.1.7
reference: Philemon 1:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: ig
  text: N’ihi na enwere m ọṅụ dị ukwuu na agbamume n’ihi ịhụnanya gị, n’ihi na obi[a] ndị nsọ enwetala ume ọhụrụ site n’aka gị, nwanne m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị karị, “akụkụ ime” ndị nsọ; okwu a na-ezo aka na mmetụta miri emi ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρὰν
  choice: ọṅụ
  rationale: “Ọṅụ” bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị akọwa χαρά, ya bụ, ọṅụ ma ọ bụ obi ụtọ.
- source_word: πολλὴν ἔσχον
  choice: enweela m … dị ukwuu
  rationale: Nke a na-egosipụta ahụmahụ Pọl nwere, ebe “dị ukwuu” na-egosi ike nke πολλήν n’Igbo nkịtị.
- source_word: παράκλησιν
  choice: agbamume
  rationale: “Agbamume” na-egosipụta nkwado na iwuli mmadụ elu nke παράκλησις pụtara n’ọnọdụ mmekọrịta a; “nkasi obi” ka bụkwa ihe okwu Grik ahụ nwere ike ịpụta.
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: n’ihi ịhụnanya gị
  rationale: ἐπί ya na dative ebe a na-egosi ihe kpatara ọṅụ na agbamume Pọl.
- source_word: ἀγάπῃ
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ okwu Igbo kwesịrị ekwesị ma kwụ ọtọ maka ἀγάπη.
- source_word: σπλάγχνα
  choice: obi
  rationale: N’agbanyeghị na okwu Grik ahụ na-ezo n’ụzọ nkịtị aka n’akụkụ ime ahụ, ọ bụ akpaalaokwu maka ime mmadụ na mmetụta miri emi ya. “Obi” na-enye echiche ahụ n’Igbo eke; nkọwa ala peeji na-echekwa ọdịdị okwu mbụ ahụ.
- source_word: τῶν ἁγίων
  choice: ndị nsọ
  rationale: “Ndị nsọ” na-echekwa okwu Pọl ji akpọ ndị kwere ekwe dị ka ndị e doro Chineke iche.
- source_word: ἀναπέπαυται
  choice: e meela ka … nweta ume ọhụrụ
  rationale: Nke a na-egosi izu ike, ahụ efe, na ọnọdụ ọhụrụ nke sitere n’ihe Faịlimọn mere; usoro “e meela” na-enyere aka igosipụta ihe rụzuru nke nsonaazụ ya ka dị.
- source_word: διὰ σοῦ
  choice: site n’aka gị
  rationale: Nke a na-egosipụta onye Chineke ma ọ bụ omume ahụ si n’aka ya rụọ ọrụ, dịka διά ya na genitive si dị.
- source_word: ἀδελφέ
  choice: nwanne m
  rationale: “Nwanne m” bụ ụzọ Igbo eke e si agwa otu nwoke bụ onye otu ezinụlọ okwukwe okwu, na-enweghị ịgbakwunye nkọwa na-adịghị na Grik.
theological_decisions:
- issue: Nsụgharị ἅγιοι
  choice: ndị nsọ
  alternative: ndị e doro nsọ; ndị Chineke
  rationale: “Ndị nsọ” na-echekwa aha Pọl ji akọwa ọgbakọ ndị kwere ekwe dị ka ndị e doro Chineke iche, n’enweghị ime ka ọ pụta na ọ bụ naanị ndị e nyere ọkwa pụrụ iche mgbe ha nwụsịrị.
- issue: Akpaalaokwu gbasara mmadụ dị na σπλάγχνα
  choice: obi
  alternative: ihe dị n’ime mmadụ; mmetụta miri emi
  rationale: Okwu a na-ezo aka n’ime ndụ na mmetụta miri emi mmadụ, ọ bụghị naanị akụkụ ahụ. “Obi” bụ ezigbo ihe nnọchi anya ya n’Igbo, ebe nkọwa ala peeji na-egosi ihe okwu Grik ahụ pụtara n’ụzọ nkịtị karị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debeghị usoro Grik n’ụzọ ga-eme ka Igbo sie ike; a ka chekwara njikọ abụọ nke “n’ihi na,” okwu mmekọrịta “nwanne m,” na nsonaazụ na-adịgide adịgide nke perfect ἀναπέπαυται.
