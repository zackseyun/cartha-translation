    text: N’ụzọ nkịtị karị, “akụkụ ime” ndị nsọ; okwu a na-ezo aka na mmetụta miri emi ha.
    reason: lexical_alternative
  revision_rationale: The revision uses an unambiguous Igbo past form for Paul’s aorist ἔσχον, expresses the Greek perfect passive as a present resultant state, and refines the lexical note for σπλάγχνα. It preserves the causal force of ἐπὶ τῇ ἀγάπῃ σου, the instrumental/mediating force of διὰ σοῦ, and the familial vocative.
