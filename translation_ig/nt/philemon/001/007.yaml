revisions:
- from: N’ihi na enweela m ọṅụ dị ukwuu na agbamume n’ihi ịhụnanya gị, n’ihi na e meela ka obi[a] ndị nsọ nweta ume ọhụrụ site n’aka gị, nwanne m.
  to: N’ihi na enwere m ọṅụ dị ukwuu na agbamume n’ihi ịhụnanya gị, n’ihi na obi[a] ndị nsọ enwetala ume ọhụrụ site n’aka gị, nwanne m.
  rationale: The revision uses an unambiguous Igbo past form for Paul’s aorist ἔσχον, expresses the Greek perfect passive as a present resultant state, and refines the lexical note for σπλάγχνα. It preserves the causal force of ἐπὶ τῇ ἀγάπῃ σου, the instrumental/mediating force of διὰ σοῦ, and the familial vocative.
