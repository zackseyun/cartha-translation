source:
  edition: SBLGNT
  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: ig
  text: 'na Afịa, bụ nwanna nwanyị,[a] na Akịpọs, onye agha ibe anyị, na ọgbakọ dị n’ụlọ gị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie nwere “nwanna nwanyị anyị” kama “nwanna nwanyị.”
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: Afịa
  rationale: E depụtaghachiri aha Grik a n’ụzọ dabara na mkpọpụta na usoro ide Igbo.
- source_word: ἀδελφῇ
  choice: nwanna nwanyị ahụ
  rationale: Okwu Grik ahụ pụtara ‘nwanna nwanyị.’ E tinyere ‘ahụ’ iji gosipụta nkwuwa okwu dị n’isiokwu Grik, ma etinyeghị ‘anyị’ n’ihi na ọ dịghị na ederede SBLGNT a.
- source_word: Ἀρχίππῳ
  choice: Akịpọs
  rationale: E depụtaghachiri aha onye a n’ụzọ dabara na mkpọpụta na usoro ide Igbo.
- source_word: συστρατιώτῃ
  choice: onye anyị na ya so bụrụ ndị agha
  rationale: Nke a na-echekwa ihe atụ agha dị n’okwu Grik ma na-ada nke ọma n’Igbo karịa ịmanye otu mkpụrụokwu.
- source_word: ἐκκλησίᾳ
  choice: ọgbakọ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ọgbakọ ndị kwere ekwe, ọ bụghị ụlọ e ji efe ofufe.
- source_word: κατ’ οἶκόν σου
  choice: dị n’ụlọ gị
  rationale: Nke a na-anọ nso n’okwu Grik ma na-ahapụ ma ọ bụ ebe ọgbakọ ahụ dị ma ọ bụ ebe ha na-ezukọ n’enweghị ịgbakwụnye nkọwa na-adịghị n’ederede.
- source_word: καὶ
  choice: na
  rationale: E debere njikọ a ugboro ugboro iji chekwaa usoro e ji atụkwasị ndị a na-ekele n’otu n’otu.
theological_decisions:
- issue: Ma a ga-asụgharị ἀδελφῇ dịka ‘nwanna nwanyị ahụ’ ka ọ bụ tinye ‘anyị’ dịka ụfọdụ ọdịnala ederede si mee
  choice: nwanna nwanyị ahụ
  alternative: nwanna anyị nwanyị
  rationale: Ederede SBLGNT e nyere nwere τῇ ἀδελφῇ, o nweghị ἡμῶν (‘anyị’). Ya mere, isi ederede na-agbaso ihe akaebe Grik e nyere, ebe nkọwa ala peeji na-echekwa ụdị ọzọ ahụ.
translation_notes:
  register: Asụsụ a bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Ọgbakọ’ na-ezere nghọtahie nke ‘ụka’ dịka ụlọ, ebe ‘onye anyị na ya so bụrụ ndị agha’ na-echekwa ihe atụ agha Pọl ji mee ihe.
