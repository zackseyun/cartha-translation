review_pass:
  verdict: revise
  source_fidelity: The draft correctly follows the supplied SBLGNT reading τῇ ἀδελφῇ without adding ‘anyị’ (‘our’) to the main text, retains all three coordinated recipients, and renders κατ’ οἶκόν σου without unnecessarily specifying that the congregation meets there. However, ‘nwanna nwanyị ahụ’ introduces an Igbo demonstrative force (‘that sister’) that is stronger and less natural than the Greek article in this appositional greeting. The military metaphor is better represented by the idiomatic singular expression ‘onye agha ibe anyị.’
  naturalness: The revised wording is fluent Standard Igbo for an epistolary salutation. ‘Afịa, bụ nwanna nwanyị’ functions naturally as an apposition, while ‘onye agha ibe anyị’ is concise and idiomatic without flattening the metaphor. ‘Ọgbakọ dị n’ụlọ gị’ is clear and appropriately noncommittal concerning whether the house is the meeting place or location.
  terminology: ‘Ọgbakọ’ appropriately denotes the Christian congregation rather than a building. ‘Nwanna nwanyị’ preserves the feminine kinship term, and ‘onye agha ibe anyị’ preserves Paul’s military metaphor. The name forms Afịa and Akịpọs are acceptable Igbo transliterations.
  issues:
  - severity: medium
    issue: ‘nwanna nwanyị ahụ’ over-translates the Greek article.
    rationale: In Standard Igbo, ahụ is demonstrative and commonly means ‘that’; it can imply a contrast or a specifically identified woman. The Greek article τῇ in this greeting does not require that added demonstrative sense. Appositional ‘bụ nwanna nwanyị’ is both natural and faithful, while retaining the absence of ‘our.’
  - severity: low
    issue: ‘onye anyị na ya so bụrụ ndị agha’ is cumbersome and has an awkward singular-to-plural construction.
    rationale: The phrase communicates the general sense but is less idiomatic than ‘onye agha ibe anyị,’ which directly conveys ‘our fellow soldier’ and maintains the metaphor.
  revised_text: 'na Afịa, bụ nwanna nwanyị,[a] na Akịpọs, onye agha ibe anyị, na ọgbakọ dị n’ụlọ gị:'
