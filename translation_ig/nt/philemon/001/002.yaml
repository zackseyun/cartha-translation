revisions:
- from: 'na Afịa, nwanna nwanyị ahụ,[a] na Akịpọs, onye anyị na ya so bụrụ ndị agha, na ọgbakọ dị n’ụlọ gị:'
  to: 'na Afịa, bụ nwanna nwanyị,[a] na Akịpọs, onye agha ibe anyị, na ọgbakọ dị n’ụlọ gị:'
  rationale: The revision removes the demonstrative implication introduced by ahụ, preserves the SBLGNT reading without an added possessive, and uses more idiomatic Standard Igbo for Paul’s metaphorical designation of Archippus. The footnote is aligned with the revised main-text wording and accurately records the possessive variant.
  reviewer_model: gpt-5.6-terra
