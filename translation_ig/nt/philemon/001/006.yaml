id: PHM.1.6
reference: Philemon 1:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ ⸀τοῦ ἐν ἡμῖν εἰς ⸀Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/006.yaml
  text: so that the fellowship of your faith may become effective in the knowledge of every good thing that is in us for the Messiah[a][b][c][d][e].
translation:
  language: ig
  text: ka mmekọrịta nke okwukwe gị[a][b] wee dị irè n’ịmata ihe ọma niile dị n’ime anyị[c] maka Mezaịa[d].[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ịkekọrịta okwukwe gị” ma ọ bụ “mkpakọrịta gị n’okwukwe.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a sụgharịrị “okwukwe” nwekwara ike ịpụta “ikwesị ntụkwasị obi” ma ọ bụ “ntụkwasị obi” n’ọnọdụ ụfọdụ.
    reason: alternative_reading
  - marker: c
    text: Ụfọdụ akwụkwọ aka ochie nwere “dị n’ime gị” kama “dị n’ime anyị.”
    reason: textual_variant
  - marker: d
    text: Ma ọ bụ, “maka Kraịst.” N’ebe a, a sụgharịrị utu aha Χριστός ka ọ bụrụ “Mezaịa.”
    reason: lexical_alternative
  - marker: e
    text: 'A pụkwara ịhazi ngwụcha nkebi ahụ otu a: “ihe ọma niile nke dị n’ime anyị maka Mezaịa.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὅπως
  choice: ka ... wee
  rationale: Usoro a na-egosi nzube ma ọ bụ ihe Pọl na-arịọ n’ekpere n’Igbo dị ugbu a.
- source_word: κοινωνία
  choice: mmekọrịta
  rationale: “Mmekọrịta” na-edobe echiche nke inwekọ òkè, mkpakọrịta, na ikekọrịta ihe, n’ebughị ụzọ mee ka ọ bụrụ naanị ikwusa okwukwe.
- source_word: πίστεώς σου
  choice: nke okwukwe gị
  rationale: Ọ na-edobe okwukwe dị ka isi njikọ genitive ahụ, ma ọ naghị ekpebi kpamkpam ma ọ bụ okwukwe a na-ekekọrịta ka ọ bụ mmekọrịta nke sitere n’okwukwe.
- source_word: ἐνεργὴς γένηται
  choice: wee dị irè
  rationale: Ọ na-egosi ịghọ ihe na-arụ ọrụ ma na-amịpụta ihe, n’asụsụ Igbo dị mfe ma kwụ ọtọ.
- source_word: ἐν ἐπιγνώσει
  choice: n’ịmata
  rationale: Ọ na-egosipụta ịmata ma ọ bụ nghọta doro anya; “n’ịmata” na-edobe ohere na ἐν nwere ike igosi ọnọdụ ma ọ bụ ụzọ ihe ahụ si dị irè.
- source_word: παντὸς ἀγαθοῦ
  choice: ihe ọma niile
  rationale: Nke a bụ nsụgharị ebumpụta ụwa nke neuter singular Greek nke nwere πᾶς, na-agbakwụnyeghị echiche “onyinye” nke adịghị n’ederede.
- source_word: τοῦ ἐν ἡμῖν
  choice: dị n’ime anyị
  rationale: Ọ na-agbaso ọgụgụ SBLGNT bụ ἡμῖν, ma na-ejikọta nkebi ahụ na “ihe ọma niile.”
- source_word: εἰς Χριστόν
  choice: maka Mezaịa
  rationale: “Maka” na-egosi ntụziaka ma ọ bụ ebumnuche nke ihe ọma ahụ n’enweghị ịkọwa njikọ siri ike karịa Greek; Χριστός ka e gosipụtara dị ka utu aha “Mezaịa.”
theological_decisions:
- issue: Ihe κοινωνία τῆς πίστεώς σου pụtara
  choice: “mmekọrịta nke okwukwe gị,” nke na-ahapụ echiche inwekọ òkè na igosipụta okwukwe ka ha abụọ dị ndụ
  alternative: “ịkekọrịta okwukwe gị” ma ọ bụ “mkpakọrịta gị n’okwukwe”
  rationale: Nkebi Greek a siri ike ma nwee ọtụtụ nghọta. Nsụgharị bụ isi anaghị emechi ya naanị n’ikwusa okwukwe ma ọ bụ naanị n’ịbụ n’otu ndị kwere ekwe.
- issue: Onye “anyị” na-ezo aka na ya
  choice: Pọl, Faịlimọn, na ndị kwere ekwe dịka otu
  alternative: Ụfọdụ akwụkwọ aka ochie nwere “gị” kama “anyị”
  rationale: A na-edobe ἡμῖν nke SBLGNT n’ederede bụ isi, ebe a na-egosi variant ahụ n’okpuru.
- issue: Njikọ εἰς Χριστόν
  choice: “maka Mezaịa,” jikọtara ya na ihe ọma niile dị n’ime anyị
  alternative: “n’ebe Mezaịa nọ” ma ọ bụ ịgụ ya dịka ihe na-akọwa ịdị irè
  rationale: Greek dị mkpirikpi ma njikọ ya nwere ike ịdị mgbagwoju anya. Usoro a na-agbaso njikọ kacha nso n’enweghị itinye nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Mmekọrịta” na-edobe mgbagwoju anya dị na κοινωνία; akara ụda olu adịghị mkpa ebe a ma e wezụga apostrophe typographic n’usoro okwu.
