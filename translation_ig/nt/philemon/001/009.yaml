  text: διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος ⸂Χριστοῦ Ἰησοῦ⸃—
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/009.yaml
  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: ig
  text: kama nke ahụ, n’ihi ịhụnanya ka m na-arịọ arịrịọ[a], ebe m bụ Pọl, nwoke merela agadi[b], ma ugbu a bụkwa onye mkpọrọ nke Mesaịa Jizọs[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi ịhụnanya ka m na-arịọ arịrịọ kama.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ na-atụgharị ya, “Pọl, onye nnọchite anya”; ma πρεσβύτης n’asụsụ Grik na-apụtakarị “nwoke merela agadi,” ọ bụghị πρεσβευτής, “onye nnọchite anya.”
    reason: alternative_reading
  - marker: c
    text: N’asụsụ Grik, “Kraịst Jizọs.” E ji “Mesaịa Jizọs” mee ihe ebe a n’ihi na Χριστός na-arụ ọrụ dịka aha ọkwá.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: n’ihi ịhụnanya
  rationale: διά na aha nọ n’ọnọdụ accusative na-egosi ihe kpatara omume ahụ. “N’ihi ịhụnanya” bụ Igbo doro anya ma na-edobe ịhụnanya dịka ihe kpaliri arịrịọ Pọl.
- source_word: μᾶλλον παρακαλῶ
  choice: ọ kaara m mma ịrịọ gị arịrịọ
  rationale: μᾶλλον na-egosi na Pọl họọrọ ịrịọ arịrịọ kama inye iwu dịka amaokwu nke 8 si kwuo. “Ịrịọ gị arịrịọ” na-egosipụta arịrịọ siri ike ma dị nwayọọ, ọ bụghị iwu.
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: ebe m bụ onye dị otu a—ya bụ, Pọl
  rationale: Akụkụ Grik a dị nkenke ma na-akọwa onye na-ekwu okwu n’ụzọ pụrụ iche. Nsụgharị a na-edobe ụdị nkọwa onwe Pọl ma mee ka ọ ghọta nke ọma n’Igbo.
- source_word: πρεσβύτης
  choice: nwoke merela agadi
  rationale: Ihe okwu Grik a pụtara n’ụzọ kacha nkịtị bụ nwoke meworo agadi. Nke a na-ezere ịtụgharị ya dịka ọkwa ụka ma ọ bụ ịgwakọta ya na okwu Grik ọzọ pụtara onye nnọchite anya.
- source_word: νυνὶ δὲ καὶ
  choice: ma ugbu a bụrụkwa
  rationale: 'Nke a na-edobe mgbanwe nke δέ, oge nke νυνί, na mgbakwunye nke καί: ịbụ onye mkpọrọ bụ nkọwa ọzọ banyere ọnọdụ Pọl ugbu a.'
- source_word: δέσμιος
  choice: onye mkpọrọ
  rationale: Okwu ahụ na-akọwa onye a tụrụ mkpọrọ. “Onye mkpọrọ” bụ okwu Igbo kpọmkwem ma dị mfe nghọta.
- source_word: Χριστοῦ Ἰησοῦ
  choice: nke Mesaịa Jizọs
  rationale: Χριστός ka na-arụ ọrụ dịka aha ọkwá n’ebe a, ya mere “Mesaịa” na-eme ka ihe aha ahụ pụtara pụta ìhè. “Nke” na-edobe njikọ genitive ahụ n’ebughị ụzọ kpebie ma ọ pụtara ịbụ nke ya, ijere ya ozi, ma ọ bụ ịta mkpọrọ n’ihi ya.
theological_decisions:
- issue: Ihe πρεσβύτης pụtara
  choice: Pọl na-akpọ onwe ya nwoke merela agadi.
  alternative: Onye nnọchite anya; ma ọ bụ okenye ụka.
  rationale: πρεσβύτης bụ okwu metụtara afọ mmadụ n’ụzọ nkịtị. “Onye nnọchite anya” ga-adaba na okwu Grik ọzọ, πρεσβευτής, ebe “okenye” nwere ike ibubata ọkwa ụka nke akụkụ a anaghị ekwu kpọmkwem.
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ahịrịokwu a, Χριστός ka nwere ike ịrụ ọrụ dịka aha ọkwá, ya mere “Mesaịa” na-eme ka nke ahụ doo anya. “Kraịst” bụkwa ụdị a na-ejikarị eme ihe n’Igbo ma e depụtara ya na nkọwa ala peeji.
- issue: Njikọ dị na δέσμιος Χριστοῦ Ἰησοῦ
  choice: onye mkpọrọ nke Mesaịa Jizọs
  alternative: onye e tinyere mkpọrọ n’ihi Mesaịa Jizọs
  rationale: Genitive Grik ahụ nwere ike ịkọwa njikọ ma ọ bụ ịbụ nke Mesaịa, ma n’ọnọdụ ahụ ọ nwekwara ike ime ka ihe kpatara mkpọrọ ahụ pụta. “Nke” na-edobe ohere ndị a kama ikpebi otu n’ime ha n’enweghị ihe ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A hapụrụ ahịrịokwu ahụ ka ọ kwụsị na akara ogologo n’ihi na echiche ya na-aga n’ihu n’amaokwu na-esote. A haziri okwu ahụ ka ọ bụrụ ihe e nwere ike ịgụpụta nke ọma, ma e chekwara ntakịrị ọdịdị pụrụ iche nke nkọwa onwe Pọl dị n’asụsụ Grik.
