    text: A pụkwara ịsụ ya “ebe obibi” ma ọ bụ “ile ọbịa.” Okwu Grik a nwere ike izo aka n’ile ọbịa ma ọ bụ n’ebe a kwadebere onye ọbịa.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya “a ga-enye unu m” ma ọ bụ “a ga-eme ka m bịakwute unu.” Ngwaa Grik ahụ nwere echiche nke inye n’efu ma ọ bụ n’amara; o yikarịrị ka ọ na-egosi Chineke dị ka onye ga-eme ya, ọ bụ ezie na a kpọghị ya aha kpọmkwem.
    reason: lexical_alternative
