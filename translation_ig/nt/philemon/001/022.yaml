source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: ig
  text: N’otu oge ahụ kwa, kwadebeere m ebe m ga-anọ dị ka ọbịa[a], n’ihi na enwere m olileanya na site n’ekpere unu, a ga-enye unu m n’amara.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya “ebe obibi” ma ọ bụ “ile ọbịa.” Okwu Grik a nwere ike izo aka n’ile ọbịa ma ọ bụ n’ebe a kwadebere onye ọbịa.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya “a ga-enye unu m” ma ọ bụ “a ga-eme ka m bịakwute unu.” Ngwaa Grik ahụ nwere echiche nke inye n’efu ma ọ bụ n’amara; o yikarịrị ka ọ na-egosi Chineke dị ka onye ga-eme ya, ọ bụ ezie na a kpọghị ya aha kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: N’otu oge ahụ kwa
  rationale: Nke a na-egosi na arịrịọ a bụ ihe ọzọ Pọl tinyere n’arịrịọ o kwuburu; “kwa” na-echekwa echiche καὶ n’ụzọ Igbo na-asụkarị.
- source_word: ἑτοίμαζέ μοι
  choice: kwadebeere m
  rationale: Ọ na-enye iwu kpọmkwem ka a kwadoo ihe maka uru Pọl; ngwakọta ngwaa na “-ere m” na-egosi onye a na-akwadebere ya n’Igbo eke.
- source_word: ξενίαν
  choice: ebe m ga-anọ dị ka ọbịa
  rationale: Okwu Grik ahụ nwere ike ịpụta ile ọbịa ma ọ bụ ebe obibi a kwadebere onye ọbịa. N’ọnọdụ a, ngwaa “kwadebe” na-eme ka ebe obibi bụrụ nghọta kacha kwekọọ, ma nsụgharị ahụ anaghị ekwu kpọmkwem na ọ bụ otu ọnụ ụlọ.
- source_word: ἐλπίζω γὰρ ὅτι
  choice: n’ihi na enwere m olileanya na
  rationale: “N’ihi na” na-egosi na olileanya Pọl bụ ihe mere o ji rịọ ka a kwadebere ya ebe ọ ga-anọ.
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: site n’ekpere unu
  rationale: Nke a na-echekwa echiche nke ekpere ndị nnata dị ka ụzọ ihe ahụ ga-esi mee.
- source_word: χαρισθήσομαι ὑμῖν
  choice: a ga-eji amara nye m unu
  rationale: Nsụgharị a na-echekwa olu mmegharị na echiche nke inye mmadụ n’efu ma ọ bụ n’amara, na-ekwughị kpọmkwem onye ga-enye ya.
theological_decisions:
- issue: Onye na-eme ihe e gosiri n’olu mmegharị nke χαρισθήσομαι
  choice: 'E jighị aha kpọọ onye ga-enye Pọl, ma e chekwara olu mmegharị: “a ga-eji amara nye m unu.”'
  alternative: “Chineke ga-eji amara nyeghachi m unu.”
  rationale: O yikarịrị ka Pọl na-atụ Chineke n’uche dị ka onye ga-eme ya, ma ihe odide Grik akpọghị Chineke aha n’ahịrịokwu a. Ya mere, nsụgharị ahụ anaghị akọwapụta ihe isi mmalite hapụrụ ka ọ dị n’amaghị ama.
- issue: Ma χαρισθήσομαι pụtara ntọhapụ n’ụlọ mkpọrọ kpọmkwem
  choice: “a ga-eji amara nye m unu”
  alternative: “a ga-ahapụ m ka m bịakwute unu”
  rationale: Ọnọdụ akwụkwọ ozi ahụ nwere ike ime ka a ghọta ntọhapụ Pọl, ma ngwaa Grik n’onwe ya ekwughị “ịhapụ n’ụlọ mkpọrọ.” Nsụgharị a na-echekwa okwu onyinye na amara n’enweghị ịgbakwunye nkọwa ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. “Ebe m ga-anọ dị ka ọbịa” bụ okwu eke karịa ịmanye “ọnụ ụlọ ndị ọbịa,” ma ọ ka na-ahapụ ohere nkọwa ξενία. Ahịrịokwu mmegharị “a ga-eji amara nye m unu” na-echekwa mgbagwoju anya na echiche amara nke ihe odide Grik.
