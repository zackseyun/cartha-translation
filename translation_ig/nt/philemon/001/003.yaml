  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: ig
  text: Ka amara na udo sitere n’aka Chineke Nna anyị na Onyenwe anyị Jizọs, bụ Mesaya[a], dịrị unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Jizọs Kraịst.” Okwu Grik bụ Χριστός nwere ike ịrụ ọrụ dịka utu aha (“Mesaya”), ma ọ bụ, n’ọnọdụ ụfọdụ, dịka akụkụ aha (“Kraịst”).'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa χάρις; ọ na-echekwa ma ọdịdị ekele Pọl na ihe ọ pụtara banyere ihu ọma Chineke na-enye n’efu.
- source_word: ὑμῖν
  choice: dịrị unu
  rationale: N’ụdị ngọzi na ekele Igbo, a na-egosipụta dative ahụ nke ọma site n’okwu mmechi “dịrị unu.”
- source_word: εἰρήνη
  choice: udo
  rationale: “Udo” na-echekwa ma echiche ekele nkịtị ma obosara echiche שלום nke okwu Grik a nwere ike ịkpọta n’uche.
- source_word: ἀπὸ
  choice: sitere n’aka
  rationale: Nke a na-egosi n’ụzọ Igbo sitere n’ebe amara na udo si abịa.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Chineke Nna anyị
  rationale: 'A tụgharịrị usoro genitive ahụ dịka apposition: Chineke bụ Nna anyị, ọ bụghị dịka “Chineke anyị na Nna.”'
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: “Onyenwe anyị” na-echekwa ịdị elu, ikike, na mkpa okwu κύριος nwere mgbe Pọl ji ya kpọọ Jizọs.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ Mesaya
  rationale: “Jizọs” bụ aha a sụgharịghị n’echiche ya, ebe “Mesaya” na-eme ka ọrụ Χριστός dịka utu aha pụta ìhè; usoro “bụ Mesaya” bụ Igbo doro anya ma dịkwa n’okike.
theological_decisions:
- issue: Otu e si akọwa Χριστοῦ n’aha/utu aha Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ Mesaya
  alternative: Jizọs Kraịst
  rationale: Χριστός sitere n’echiche “onye e tere mmanụ” ma nwee ike ịrụ ọrụ dịka utu aha “Mesaya,” ọ bụ ezie na n’ụfọdụ ọnọdụ ọ na-adị ka akụkụ aha a na-akpọkarị mmadụ. Isi ederede mere utu aha ahụ ka ọ pụta ìhè, ebe ndetu ala na-echekwa nhọrọ ọdịnala “Kraịst.”
translation_notes:
  register: Ejiri Standard Igbo nke dị ugwu ma dị mfe nghọta. Usoro “Ka … dịrị unu” na-ebupụta ọdịdị ngọzi nke ahịrịokwu Grik na-enweghị itinye ngwaa na-agbanwe isi ya; “sitere n’aka” bụkwa ụzọ Igbo sitere n’okike isi gosi ebe amara na udo si abịa.
