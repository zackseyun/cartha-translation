  text: ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ ⸂μοι διακονῇ⸃ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/013.yaml
  text: I wanted to keep him with me[a], so that on your behalf he might serve me in the chains of the gospel,
translation:
  language: ig
  text: Ọ bụ ya ka m chọrọ idebe n’akụkụ m, ka o wee jeere m ozi n’ọnọdụ gị n’agbụ nke ozi ọma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’agbụ n’ihi ozi ọma”—ya bụ, agbụ a na-ata n’ihi ozi ọma.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: Ọ bụ ya
  rationale: Nnochiaha a na-arụtụ aka n’ebe Onesimọs nọ; usoro a bụ Igbo ebumpụta ụwa ma na-ejikọta amaokwu a na nke bu ya ụzọ.
- source_word: ἐβουλόμην
  choice: ka m chọrọ
  rationale: Na-egosi ọchịchọ Pọl nwere n’oge gara aga n’enweghị ịmanye nkọwa pụrụ iche n’ụdị imperfect ahụ.
- source_word: πρὸς ἐμαυτὸν κατέχειν
  choice: ijide ka ọ nọnyere m
  rationale: Na-echekwa echiche nke idebe Onesimọs n’aka Pọl na n’ụlọọrụ ya, ma na-ada ka Igbo a na-asụ ugbu a.
- source_word: ἵνα
  choice: ka o wee
  rationale: Na-egosipụta ebumnuche nke ọma n’Igbo.
- source_word: ὑπὲρ σοῦ
  choice: n’ọnọdụ gị
  rationale: Na-egosi na ozi Onesimọs ga-eje ga-anọchi anya nke Faịlimọn gaara ejere Pọl; ọ naghị eme ka echiche nnọchi ahụ sie ike karịa ihe Grik kwuru.
- source_word: μοι διακονῇ
  choice: jeere m ozi
  rationale: Na-ekpuchi enyemaka na ọrụ bara uru n’enweghị ime ka okwu ahụ bụrụ naanị ọrụ ụka.
- source_word: ἐν τοῖς δεσμοῖς
  choice: mgbe m nọ n’agbụ
  rationale: Na-echekwa ihe oyiyi nkịtị nke agbụ ma na-eme ka njikọ ahịrịokwu ahụ doo anya n’Igbo.
- source_word: τοῦ εὐαγγελίου
  choice: nke ozi ọma
  rationale: Na-edobe genitive Grik n’ụzọ dị mkpirikpi, kama idozi ya ozugbo dịka ‘n’ihi ozi ọma.’
theological_decisions:
- issue: Ihe τοῦ εὐαγγελίου pụtara mgbe ọ na-akọwa δεσμοῖς
  choice: agbụ nke ozi ọma
  alternative: agbụ m na-ebu n’ihi ozi ọma
  rationale: Isi ederede na-echekwa mkpirisi okwu Grik na nghọta ya sara mbara; ihe odide ala peeji na-egosi nghọta nke ihe kpatara agbụ ahụ n’enweghị imechi ohere nghọta ọzọ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘jeere m ozi’ zere ụda okwu ụka pụrụ iche, e jikwa ‘agbụ nke ozi ọma’ chekwaa mkpirisi na mgbagwoju anya dị na Grik.
