    issue: The main text omits “nke” between “amara” and “Onyenwe anyị Jizọs Kraịst.”
    rationale: 'Greek τοῦ κυρίου marks a genitive: “the grace of the Lord Jesus Christ.” In Standard Igbo, “amara nke Onyenwe anyị ...” clearly and naturally expresses this relationship; without it, the noun sequence is unnecessarily compressed and less precise.'
