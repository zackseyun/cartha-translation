  text: Ἡ χάρις τοῦ ⸀κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/025.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: ig
  text: Ka amara nke Onyenwe anyị Jizọs Kraịst dịnyere mmụọ unu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “Jizọs Kraịst” dịka “Jizọs Mezaịa”; “Kraịst” na “Mezaịa” bụ aha nsọpụrụ pụtara Onye E Tere Mmanụ.
    reason: lexical_alternative
  - marker: b
    text: “Unu” bụ ọtụtụ; ngọzi ikpeazụ a ruru ndị niile a kpọrọ aha dị ka ndị natara akwụkwọ ozi ahụ, ọ bụghị naanị Faịlimọn.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa ihuọma na ngọzi Chineke na-enye n’efu; ọ dabara n’usoro ngọzi Pọl ji emechi akwụkwọ ozi.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Ọ na-echekwa ịdị arọ nke κύριος dị ka aha nsọpụrụ e ji akpọ Jizọs ma na-ada nke ọma n’Igbo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs Kraịst
  rationale: “Jizọs” bụ nsụgharị aha ahụ a maara n’Igbo, ebe “Kraịst” na-echekwa aha nsọpụrụ Χριστός n’ụdị ndị na-agụ Igbo maara nke ọma.
- source_word: μετὰ
  choice: dịnyere
  rationale: Grik enweghị ngwaa n’ahịrịokwu a, ma “dịnyere” na-eme ka ngọzi ahụ bụrụ Igbo zuru oke ma na-enye echiche μετὰ, ‘ịnọnyere.’
- source_word: πνεύματος
  choice: mmụọ
  rationale: “Mmụọ” na-anọchi πνεῦμα n’enweghị itinye nkọwa karịrị nke Grik; n’ebe a, njikọ ya na ‘unu’ na-atụ aka n’ime mmadụ nke ndị a na-agwa okwu.
- source_word: ὑμῶν
  choice: unu
  rationale: “Unu” na-egosipụta nke ọma na nnọchiaha Grik ahụ bụ ọtụtụ, ya mere ngọzi ahụ gbasara ndị niile natara akwụkwọ ozi ahụ, ọ bụghị Faịlimọn naanị ya.
theological_decisions:
- issue: Otu e si sụgharịa Χριστοῦ
  choice: Kraịst
  alternative: Mezaịa
  rationale: “Kraịst” bụ aha nsọpụrụ a maara nke ọma n’Igbo ma na-echekwa njikọ ya na usoro okwu Ndịozi. “Mezaịa” na-eme ka ihe aha nsọpụrụ ahụ pụtara pụta ìhè, ya mere e debere ya n’okpuru peeji.
- issue: Onye ‘mmụọ unu’ na-ezo aka na ya
  choice: Mmụọ/ime mmadụ nke ndị natara akwụkwọ ozi ahụ
  alternative: Mmụọ Nsọ
  rationale: Nnọchiaha nke ọtụtụ bụ ὑμῶν, ‘unu,’ na-akwado nghọta na ọ bụ mmụọ nke ndị a na-agwa okwu. E jighị mkpụrụedemede ukwu ma ọ bụ nkọwa ọzọ manye echiche na ọ bụ Mmụọ Nsọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro “Ka … dịnyere …” na-eme ka ọdịdị ngọzi nke ahịrịokwu Grik na-enweghị ngwaa pụta ìhè. E ji “unu” chekwaa ọnụọgụ ọtụtụ nke ὑμῶν n’ahịrịokwu n’onwe ya.
