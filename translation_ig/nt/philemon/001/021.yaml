revisions:
- from: Ebe m nwere ntụkwasị obi ná nrubeisi gị, edere m gị akwụkwọ, ebe m maara na ị ga-eme ọbụna karịa ihe m na-ekwu.[a]
  to: N'ịtụkwasị nrubeisi gị obi, edere m gị akwụkwọ, n'ịmara na ị ga-eme ọbụna karịa ihe m na-ekwu.[a]
  rationale: The revision improves idiomatic Standard Igbo while preserving the source's grammar and rhetorical restraint. It retains “nrubeisi” for ὑπακοή, the future assurance “ị ga-eme,” and the ambiguity of what Philemon may do beyond Paul's stated request. The revised footnote states the lexical alternative clearly and does not specify the debated implied action.
