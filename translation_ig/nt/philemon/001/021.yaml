  text: πεποιθὼς τῇ ὑπακοῇ σου ἔγραψά σοι, εἰδὼς ὅτι καὶ ὑπὲρ ⸀ἃ λέγω ποιήσεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: ig
  text: N'ịtụkwasị nrubeisi gị obi, edere m gị akwụkwọ, n'ịmara na ị ga-eme ọbụna karịa ihe m na-ekwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ị ga-eme ihe gafere ihe m na-ekwu.” Pọl nwere ike ịdị na-egosi na Faịlimọn ga-eme ihe karịrị arịrịọ ahụ kpọmkwem ọ rịọrọ ya, ma ihe odide ahụ ekwughị kpọmkwem ihe ọ ga-eme karịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: Ebe m nwere ntụkwasị obi
  rationale: Perfect active participle ahụ na-egosi ọnọdụ ntụkwasị obi siri ike nke dịlarị. Nkebiokwu a na-asụ Igbo n'ụzọ eke ma na-ejigide njikọ ya na ihe mere Pọl ji dee akwụkwọ ahụ.
- source_word: τῇ ὑπακοῇ σου
  choice: ná nrubeisi gị
  rationale: “Nrubeisi” na-echekwa echiche bụ isi nke ὑπακοή—ige ntị ma mee ihe a gwara mmadụ—n’etinyeghị echiche mmanye nke okwu Grik ahụ na-ekwughị.
- source_word: ἔγραψά σοι
  choice: edere m gị akwụkwọ
  rationale: Aorist indicative a sụgharịrị dị ka ihe e mere n’oge gara aga. Ịgbakwụnye “akwụkwọ” na-eme ka okwu ahụ doo anya ma bụrụ Igbo nkịtị n’ọnọdụ akwụkwọ ozi.
- source_word: εἰδὼς
  choice: ebe m maara
  rationale: Perfect participle a na-egosi ihe Pọl maara nke ọma mgbe ọ na-ede. “Ebe m maara” na-ejikọta ya nke ọma na ahịrịokwu ahụ.
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: ọbụna karịa ihe m na-ekwu
  rationale: Nke a na-echekwa echiche nke ime ihe gafere ihe Pọl kwuru kpọmkwem, ma ọ naghị akọwa ihe omume ọzọ ahụ bụ.
- source_word: ποιήσεις
  choice: ị ga-eme
  rationale: Future indicative nke ποιέω sara mbara; “ị ga-eme” na-echekwa ịdị ghe oghe nke okwu Pọl.
theological_decisions:
- issue: Ike okwu ὑπακοή n’arịrịọ Pọl
  choice: nrubeisi
  alternative: ịnabata arịrịọ; ịdị njikere ime ihe a rịọrọ
  rationale: Okwu Grik ahụ pụtara nrubeisi ma ọ bụ ime ihe a gwara mmadụ. Idowe “nrubeisi” na-echekwa mmekọrịta ikike dị n’okwu Pọl, ma ọ naghị atụkwasị mmanye n’ihe odide ahụ.
- issue: Ihe “karịa ihe m na-ekwu” nwere ike ịpụta
  choice: A hapụrụ ya ka ọ ghara ịkọwapụta kpọmkwem ihe ọzọ Faịlimọn ga-eme.
  alternative: Pọl na-egosi na Faịlimọn kwesịrị ịtọ Onesimọs n’ohu; ma ọ bụ naanị na ọ ga-anabata ya n’ụba.
  rationale: Okwu ahụ na-enye ntụnye ma ọ naghị ekwu kpọmkwem ihe Pọl tụrụ anya ya. Nsụgharị ahụ na-echekwa ịdị ghe oghe na esemokwu nkọwa ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “nrubeisi” iji chekwaa ike okwu Grik ahụ, ebe e debere nkebi ikpeazụ ka ọ ghe oghe dịka isi mmalite ahụ si dị. E tinyere akara [a] ozugbo n’akụkụ nkebiokwu ọ na-akọwa.
