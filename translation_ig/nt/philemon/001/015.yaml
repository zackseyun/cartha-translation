  text: τάχα γὰρ διὰ τοῦτο ἐχωρίσθη πρὸς ὥραν ἵνα αἰώνιον αὐτὸν ἀπέχῃς,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/015.yaml
  text: For perhaps he was separated from you for a time so that you might have him back forever,[a]
translation:
  language: ig
  text: N’ihi na, eleghị anya, ọ bụ n’ihi nke a ka e kewapụrụ ya n’ebe ị nọ nwa oge, ka i wee nwetaghachi ya ruo ebighị ebi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ hapụrụ gị nwa oge.” Olu nnara dị n’okwu Grik ahụ, “e kewapụrụ ya,” nwere ike ịbụ ụzọ dị nro isi zere ịkpọ onye kpatara nkewa ahụ aha, ma nwee ike ikwekwa ka a ghọta na nzube Chineke dị n’ime ya.
    reason: alternative_reading
lexical_decisions:
- source_word: τάχα
  choice: eleghị anya
  rationale: Na-egosi na Pọl na-atụ aro ihe nwere ike ịbụ, ọ naghị ekwu ya dị ka ihe doro anya.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-ejikọta amaokwu a na ihe e kwuru tupu ya dị ka nkọwa ma ọ bụ ihe kpatara ya.
- source_word: διὰ τοῦτο
  choice: ọ bụ n’ihi nke a
  rationale: Na-echekwa echiche nke ihe kpatara ya ma ọ bụ nzube ya n'ụzọ Igbo doro anya.
- source_word: ἐχωρίσθη
  choice: e kewapụrụ ya
  rationale: Na-echekwa olu nnara nke Grik, na-akpọghị Chineke ma ọ bụ Ọnesimọs kpọmkwem dị ka onye mere ya.
- source_word: πρὸς ὥραν
  choice: nwa oge
  rationale: Ọ bụ akpaala okwu maka oge dị mkpirikpi, ọ bụghị otu awa nkịtị; ọ na-emegidekwa ‘ruo mgbe ebighị ebi.’
- source_word: ἵνα
  choice: ka
  rationale: Na-egosi nzube ma ọ bụ ihe ga-esi na ya pụta n’Igbo nkịtị.
- source_word: αἰώνιον
  choice: ruo mgbe ebighị ebi
  rationale: Na-arụ ọrụ dịka nkọwa oge n’ebe a ma na-egosi ịnọgide na-adị, megide nkewa nke nwa oge.
- source_word: αὐτὸν
  choice: ya
  rationale: Na-ezo aka n’Ọnesimọs dịka onye a ga-enwetaghachi.
- source_word: ἀπέχῃς
  choice: i wee nwetaghachi ya
  rationale: Na-egosipụta echiche nke inwe ma ọ bụ ịnata ya ọzọ n’ọnọdụ mmekọrịta nke akwụkwọ ozi a.
theological_decisions:
- issue: Onye mere ihe ahụ nke olu nnara ἐχωρίσθη na-egosi
  choice: E debere ya n’olu nnara dịka ‘e kewapụrụ ya,’ n’akpọghị onye mere ya aha.
  alternative: ‘ọ hapụrụ gị’ ma ọ bụ ‘Chineke kewapụrụ ya n’ebe ị nọ’
  rationale: Okwu Pọl nwere ike iji nwayọọ zere ịtụ Ọnesimọs ụta kpọmkwem, ma kwekwa ka a hụ nzube Chineke n’ime ya n’ekwughị nke ahụ hoo haa. Nsụgharị ahụ echekwala mgbagwoju echiche a.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘eleghị anya’ chekwaa ịdị nro nke nkwubi okwu Pọl; e jikwa ‘e kewapụrụ ya’ chekwaa olu nnara na nghọta abụọ okwu ahụ nwere ike ibu.
