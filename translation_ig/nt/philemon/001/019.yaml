    text: 'Ma ọ bụ, n''ụzọ na-agbaso usoro okwu Grik anya: “Mụ Pọl ji aka m n''onwe m dere ya; aga m akwụghachi ya; ka m ghara ịgwa gị na i ji m ụgwọ ọbụna onwe gị.”'
    reason: lexical_alternative
