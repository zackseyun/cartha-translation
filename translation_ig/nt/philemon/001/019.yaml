source:
  edition: SBLGNT
  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: ig
  text: 'Mụ Pọl ji aka m n''onwe m dere ya: aga m akwụghachi ya—ka m ghara ịgwa gị na i ji m ụgwọ—ọbụna onwe gị.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n''ụzọ na-agbaso usoro okwu Grik anya: “Mụ Pọl ji aka m n''onwe m dere ya; aga m akwụghachi ya; ka m ghara ịgwa gị na i ji m ụgwọ ọbụna onwe gị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ Παῦλος
  choice: Mụ onwe m, bụ Pọl
  rationale: Nnọchiaha ἐγώ e dere n'ụzọ pụtara ìhè na-emesi onye na-ekwu okwu ike; nkọwa a na-egosipụta nkwusi ahụ n'Igbo dị ebube ma doo anya.
- source_word: ἔγραψα
  choice: dee
  rationale: Aorist ἔγραψα pụtara n'ụzọ nkịtị ‘dere’; n'okwu akwụkwọ ozi a, ‘dee nke a’ na-ejigide echiche na Pọl ji aka ya tinye nkwa ahụ n'akwụkwọ.
- source_word: τῇ ἐμῇ χειρί
  choice: ji aka m
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ ebumpụta ụwa na onye ahụ ji aka nke ya dee ihe, ma na-akwado ịdị arọ nke nkwa onwe onye ahụ.
- source_word: ἀποτίσω
  choice: M ga-akwụghachi ya
  rationale: Okwu ọdịnihu a bụ nkwa ịkwụghachi ụgwọ ma ọ bụ mfu e kwuru banyere ya n'amaokwu bu ụzọ.
- source_word: ἵνα μὴ λέγω σοι
  choice: ka m ghara ichetara gị
  rationale: Nkebi a na-arụ ọrụ dị ka okwu akọ nke na-ekwu ihe ahụ site n'ịsị na ọ gaghị ekwu ya; ‘ichetara gị’ na-egosipụta echiche ahụ n'Igbo ekeghị eke.
- source_word: καὶ σεαυτόν
  choice: ọbụna onwe gị
  rationale: καί na-eme ka σεαυτόν sie ike; ‘ọbụna onwe gị’ na-edobe nkwusi ahụ n'ebughị ụzọ kọwaa kpọmkwem ụdị ụgwọ ahụ.
- source_word: προσοφείλεις
  choice: i ji m ụgwọ
  rationale: Ngwaa ahụ na-egosi ụgwọ ọzọ a ka ji; okwu gbara ya gburugburu, karịsịa ‘ọbụna onwe gị,’ na-enye echiche mgbakwunye ahụ n'ụzọ doro anya.
theological_decisions:
- issue: Ụdị ụgwọ Faịlimọn ji Pọl n'okwu ‘ọbụna onwe gị’
  choice: E debere ya dị ka ụgwọ onwe onye a na-akọwaghị kpọmkwem.
  alternative: Ịkọwa ya kpọmkwem dị ka ụgwọ maka nchegharị, nzọpụta, ma ọ bụ ndụ anụ ahụ.
  rationale: Grik na-ekwusi ụgwọ ahụ ike, ma ọ naghị akọwa kpọmkwem ihe kpatara ya. Ya mere, nsụgharị ahụ na-ahapụ esemokwu na obosara echiche dị na isi mmalite ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘ji aka m’ gosipụta na Pọl n'onwe ya dere nkwa ahụ; e jighị nkọwa ụka pụrụ iche kọwaa ụgwọ Faịlimọn.
