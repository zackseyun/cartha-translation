revisions:
- from: 'Mụ onwe m, bụ Pọl, ji aka m dee nke a: M ga-akwụghachi ya—ka m ghara ichetara gị na i ji m ụgwọ, ọbụna onwe gị.[a]'
  to: 'Mụ Pọl ji aka m n''onwe m dere ya: aga m akwụghachi ya—ka m ghara ịgwa gị na i ji m ụgwọ—ọbụna onwe gị.[a]'
  rationale: The revision replaces “remind” with “tell” to preserve the lexical and rhetorical sense of ἵνα μὴ λέγω. It also uses the explicit past form «dere» for ἔγραψα. The wording continues to leave unspecified what it means that Philemon owes Paul “even himself,” as the Greek does.
