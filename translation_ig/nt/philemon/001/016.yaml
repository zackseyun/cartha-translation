id: PHM.1.16
reference: Philemon 1:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a servant[a], but more than a servant, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: ig
  text: ọ bụghịkwa dị ka ohu[a], kama karịa ohu—nwanna a hụrụ n’anya, karịsịa nye m, ma karịa nke ukwuu nye gị[b], ma n’anụ ahụ ma n’ime Onyenwe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “dị ka onye na-eje ozi” ma ọ bụ “dị ka ohu.” Okwu Grik ahụ nwere ike ịgụnye ọnọdụ ije ozi dị iche iche, ma n'ebe a, o yikarịrị ka ọ na-ekwu banyere ọnọdụ Onesimọs dị ka ohu.
    reason: alternative_reading
  - marker: b
    text: “N’anụ ahụ” n'ebe a nwere ike ịpụta mmekọrịta unu n'ụwa ma ọ bụ n'etiti ọha mmadụ, ma ọ bụ ịnọ ya n'ihu gị; ọ pụtaghị “agwa mmehie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι ὡς δοῦλον
  choice: ọ bụghịkwa dị ka ohu
  rationale: “Ọ bụghịkwa” na-egosi na ọnọdụ e si na ya bịa agbanweela; “ohu” na-edobe ọnọdụ onye nọ n'okpuru onye nwe ya nke δοῦλος na-egosi n'akụkụ akwụkwọ a.
- source_word: ὑπὲρ δοῦλον
  choice: kama karịa ohu
  rationale: ὑπέρ na-egosi ọnọdụ ma ọ bụ uru karịrị nke ohu, ọ bụghị nnọchi anya.
- source_word: ἀδελφὸν ἀγαπητόν
  choice: dị ka nwanna a hụrụ n’anya
  rationale: “Nwanna” na-edobe ihe atụ ezinụlọ nke ndị kwere ekwe, ebe “a hụrụ n’anya” na-egosipụta ἀγαπητός n'Igbo dị ugbu a.
- source_word: μάλιστα ἐμοί
  choice: onye m hụrụ n’anya karịsịa
  rationale: N'usoro Igbo, ime ka mmekọrịta ahụ pụta ìhè na-enye μάλιστα ἐμοί nghọta doro anya ma na-edobe echiche nke ịbụ onye pụrụ iche nye Pọl.
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: ma gị onwe gị ga-ahụ ya n’anya karịa nnọọ
  rationale: 'Nke a na-ebuga ike ntụnyere ahụ n''Igbo eke: ọ bụrụ na Onesimọs dị Pọl mkpa, ọ ga-adị Faịlimọn mkpa karịa nnọọ.'
- source_word: ἐν σαρκὶ
  choice: n’anụ ahụ
  rationale: A na-edobe okwu Pọl n'ụzọ dị nso n'isi mmalite, ebe nkọwa ala peeji na-egosi na ọ bụ mmekọrịta mmadụ, mmekọrịta ọha, ma ọ bụ ịnọ n'ihu mmadụ ka a na-atụ anya ya, ọ bụghị agwa mmehie.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Nke a na-edobe okwu Pọl banyere mmekọrịta na ịdị n'otu nke ndị kwere ekwe n'ime Onyenwe anyị.
theological_decisions:
- issue: Nsụgharị δοῦλος n'ọnọdụ Onesimọs
  choice: ohu
  alternative: onye na-eje ozi; ohu e kere agbụ
  rationale: “Ohu” bụ okwu Igbo a na-aghọta nke na-egosi ọnọdụ mmadụ nọ n'okpuru onye nwe ya, ma na-eme ka ọdịiche dị na “karịa ohu” nọgide sie ike.
- issue: Ihe ἐν σαρκὶ καὶ ἐν κυρίῳ pụtara
  choice: ma n’anụ ahụ ma n’ime Onyenwe anyị
  alternative: ma na mmekọrịta unu n'ụwa ma n’ime Onyenwe anyị; ma n’ihu gị ma n’ime Onyenwe anyị
  rationale: 'A na-edobe nhazi na esemokwu nke okwu Pọl kama ikpebi naanị otu nkọwa: Philemon nwere mmekọrịta ya na Onesimọs n''akụkụ mmadụ na nke ọha, nakwa n''ime Onyenwe anyị.'
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere nsọpụrụ ma dị mfe nghọta. E ji “ohu” mee ka ọnọdụ mmekọrịta mmadụ na ibe ya pụta ìhè; e debere “n’anụ ahụ” iji chekwaa okwu na mgbagwoju anya Pọl, tinyere nkọwa ala peeji.
