revisions:
- from: Unu esokwala n’ọrụ ọchịchịrị ndị na-adịghị amị mkpụrụ[a]; kama, kpugheekwanụ ha[b].
  to: Unu eketala òkè n’ọrụ ọchịchịrị ndị na-adịghị amị mkpụrụ[a]; kama, ọbụna kpugheenụ ha[b].
  rationale: The revision uses an idiomatic expression for sharing in the works, explicitly represents the intensifying “even,” and regularizes the plural imperative. It retains the Greek imagery of unfruitful works of darkness and keeps “expose” as the contextual rendering of ἐλέγχετε. The second note is narrowed so that it does not add an unstated focus on warning the people who perform the works.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:16:53Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys both imperatives and retains the fruit/darkness imagery. However, “esokwala n’ọrụ” is less idiomatic and less precise for συγκοινωνεῖτε than an expression for sharing in or having a part. The force of καὶ is better represented explicitly by “ọbụna.”
  naturalness: “Unu eketala òkè n’ọrụ ...” is natural Standard Igbo for active participation. “Kpugheenụ” is the clear plural imperative form and reads more smoothly than “kpugheekwanụ.”
  terminology: “ọrụ ọchịchịrị ndị na-adịghị amị mkpụrụ” preserves the Greek construction and metaphor. “Kpugheenụ” appropriately reflects ἐλέγχετε in its contextual sense of exposing, while the note preserves the corrective/reproving sense without adding a specific method.
  issues:
  - severity: medium
    issue: The rendering “esokwala n’ọrụ” is not the most natural or exact expression for συγκοινωνεῖτε.
    rationale: The Greek calls for sharing in/participating with respect to the works. “Eketala òkè n’ọrụ” directly expresses this participation in idiomatic Standard Igbo.
  - severity: low
    issue: The intensifying καὶ in μᾶλλον δὲ καὶ is only indirectly conveyed by -kwa-.
    rationale: 'Using “ọbụna” makes the added force explicit: believers are not merely to refrain, but are even to expose the works.'
  - severity: low
    issue: Footnote b includes “dọọ ndị na-eme ha aka ná ntị,” which introduces people and a particular method not stated by the Greek object, ‘the works.’
    rationale: The lexical note should preserve alternatives for ἐλέγχετε without expanding the command beyond exposing/reproving the works.
  revised_text: Unu eketala òkè n’ọrụ ọchịchịrị ndị na-adịghị amị mkpụrụ[a]; kama, ọbụna kpugheenụ ha[b].
