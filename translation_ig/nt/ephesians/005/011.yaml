  text: καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, μᾶλλον δὲ καὶ ἐλέγχετε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/011.yaml
  text: And do not participate in the unfruitful works of darkness[a], but instead even expose them[b],
translation:
  language: ig
  text: Unu eketala òkè n’ọrụ ọchịchịrị ndị na-adịghị amị mkpụrụ[a]; kama, ọbụna kpugheenụ ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu esonyela na ha” ma ọ bụ “unu na ha enwekwala mmekọrịta.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “katọọ ha” ma ọ bụ “baanụ ha mba.” Okwu Grik ahụ nwere ike ịgụnye mgbazi e ji okwu eme, ma n’ebe a ọ na-egosikwa ime ka ọrụ ndị ahụ pụta ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: esokwala n’ọrụ
  rationale: Nkebi a na-egosi iso eme ihe ma ọ bụ iketa òkè na ya. “Esokwala n’ọrụ” bụ Igbo dị mfe ma doo anya, na-egosikwa na a na-ekwu maka itinye aka n’omume ndị ahụ.
- source_word: ἔργοις
  choice: ọrụ
  rationale: “Ọrụ” na-edobe okwu ihe mmadụ na-eme ma kwekọọ n’ụzọ Pọl si eji okwu a ekwu banyere omume.
- source_word: ἀκάρποις
  choice: ndị na-adịghị amị mkpụrụ
  rationale: Nke a na-edobe ihe atụ nke ịmị mkpụrụ dị n’okwu Grik, kama ịgbanwe ya ka ọ bụrụ naanị “ndị na-abaghị uru.”
- source_word: σκότους
  choice: ọchịchịrị
  rationale: “Ọrụ ọchịchịrị” na-edobe njikọ genitive ahụ na ihe atụ nke ọchịchịrị na ìhè dị n’amaokwu ndị gbara ya gburugburu.
- source_word: μᾶλλον δὲ καὶ
  choice: kama, ... kwanụ
  rationale: “Kama” na-egosi ntụgharị siri ike, ebe “-kwa-” na-egosi na iwu ahụ abụghị naanị izere ọrụ ndị ahụ, kama ọ gụnyekwara ime ihe megide ha.
- source_word: ἐλέγχετε
  choice: kpugheekwanụ
  rationale: N’ebe a, okwu ahụ nwere ike ịpụta ịbara mba ma ọ bụ ime ka ihe pụta ìhè. “Kpugheekwanụ” dabara n’isiokwu ọchịchịrị na ìhè nke akụkụ a, ma nkọwa ala peeji na-edobe nghọta nke ịdọ aka ná ntị ma ọ bụ ịbara mba.
theological_decisions:
- issue: Ihe ἐλέγχετε pụtara n’ihe metụtara ọrụ ọjọọ
  choice: kpugheekwanụ ha
  alternative: baaranụ ha mba; gosi na ha dị njọ
  rationale: Amaokwu ndị gbara ya gburugburu na-ekwu na ìhè na-eme ka ihe pụta ìhè. Ya mere, “kpugheekwanụ” na-edobe njikọ ahụ, ma ọ naghị ewepụ na mkpughe ahụ pụrụ ịgụnye ịdọ aka ná ntị ma ọ bụ ịbara mba.
- issue: Ike dị na ntụnyere iwu abụọ ahụ
  choice: esokwala ... kama, kpugheekwanụ
  alternative: eketala òkè ... kama baaranụ mba
  rationale: Nsụgharị ahụ na-edobe ma iwu izere itinye aka n’ọrụ ọjọọ ma iwu ime ihe iji mee ka ha pụta ìhè, n’etinyeghị usoro pụrụ iche nke ihe odide Grik na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ nke “ọchịchịrị” na “ịmị mkpụrụ” dịka ha dị n’asụsụ Grik, ma jiri “kpugheekwanụ” jikọta amaokwu ahụ na isiokwu ìhè na ọchịchịrị dị n’akụkụ a.
