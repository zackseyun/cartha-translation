translation:
  language: ig
  text: na-edobe onwe unu n’okpuru ibe unu n’ịtụ Mesaịa egwu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ịsọpụrụ Mesaịa” ma ọ bụ “n’egwu nsọ nye Mesaịa.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ Christos, ya bụ “Onye E Tere Mmanụ”; a sụgharịrị ya “Mesaịa” ebe a n’ihi na ọ na-arụ ọrụ dị ka utu aha. A pụkwara ịsụgharị ya “Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: na-edo onwe unu n’okpuru
  rationale: Okwu a bụ participle nke na-egosi omume na-aga n’ihu ma jikọọ na ntụziaka dị n’amaokwu ndị bu ya ụzọ. N’Igbo, ‘na-edo onwe unu n’okpuru’ na-ekwupụta nrubeisi a n’ụzọ doro anya ma dị ndụ, n’agbanyeghị na asụsụ Grik ekwughị reflexive n’ụzọ kpọmkwem.
- source_word: ἀλλήλοις
  choice: ibe unu
  rationale: 'Nke a na-echekwa echiche reciprocal: onye ọ bụla n’ebe onye ọzọ nọ.'
- source_word: ἐν
  choice: n’ịtụ
  rationale: N’ụlọokwu Igbo a, ‘n’ịtụ … egwu’ na-egosi ọnọdụ ma ọ bụ ụzọ e si eme nrubeisi ahụ, ma ghara ime ka ἐν bụrụ naanị ihe na-akpata ya.
- source_word: φόβῳ
  choice: egwu
  rationale: ‘Egwu’ na-echekwa isi ike na nghọta sara mbara nke φόβος. Ọ pụrụ ịgụnye egwu juputara na nkwanye ugwu; a hapụghị naanị ‘nkwanye ugwu’ n’ahịrị bụ isi ka esemokwu dị n’okwu ahụ ghara ịla n’iyi.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: Χριστός na-arụ ọrụ dị ka utu aha n’ebe a. ‘Mesaịa’ na-egosi Onye E Tere Mmanụ, kama iji naanị ntụgharị-ụda ọdịnala ‘Kraịst.’
theological_decisions:
- issue: Ihe ‘ịtụ Mesaịa egwu’ pụtara
  choice: egwu a na-atụ Mesaịa, nke nwere ike ịbụ egwu nsọ juputara na nkwanye ugwu
  alternative: nkwanye ugwu nye Mesaịa; egwu Mesaịa na-eme ka e nwee
  rationale: Genitive a kacha mfe ịghọta dịka egwu a na-atụ Mesaịa. Agbanyeghị, e debere ‘egwu’ n’ahịrị bụ isi iji ghara ime ka ịdị arọ nke okwu ahụ bụrụ naanị nsọpụrụ nkịtị ma ọ bụ mechie ụzọ nye nghọta ndị ọzọ.
- issue: Nsụgharị Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka nwere ike nke utu aha, ya mere ‘Mesaịa’ dabara adaba; a debere ụdị ọdịnala ‘Kraịst’ n’okpuru ala.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrị ahụ malitere na ‘na-’ iji chekwaa ọdịdị participle ya na njikọ ya na ihe ndị bu ya ụzọ. Apostrophe ndị e ji mee mkpirisi ụda kwekọrọ n’usoro odide Igbo.
