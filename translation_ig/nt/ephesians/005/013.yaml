id: EPH.5.13
reference: Ephesians 5:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐλεγχόμενα ὑπὸ τοῦ φωτὸς φανεροῦται,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/013.yaml
  text: But all things[a], when exposed by the light, are made visible,
translation:
  language: ig
  text: Ma ihe niile[a], mgbe ìhè kpughere ha, na-apụta ìhè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “Ihe ọ bụla ìhè kpughere na-apụta ìhè.” Enwere ike ịghọta participle na ngwaa Greek ahụ n''ụzọ abụọ yiri ibe ha nke ukwuu: e nwere ike imesi omume ikpughe ihe ike, ma ọ bụ mesie nsonaazụ ya—ịghọ ihe a na-ahụ anya—ike.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πάντα
  choice: ihe niile
  rationale: Nkebiokwu a dị n'ụdị neuter plural ma nwee article; “ihe niile” na-echekwa obosara na mkpokọta ya n'Igbo nkịtị.
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-egosi obere ntụgharị ma ọ bụ ọdịiche n'ihe e kwuru tupu ya; “Ma” dabara n'ọnọdụ a.
- source_word: ἐλεγχόμενα
  choice: mgbe ... kpughere ha
  rationale: N'ebe a, ἐλέγχω pụtara ime ka ihe zoro ezo pụta ìhè karịa ịbara mmadụ mba. Usoro “mgbe ... kpughere ha” na-egosipụta participle passive ahụ n'ụzọ Igbo na-ada nke ọma.
- source_word: ὑπὸ τοῦ φωτὸς
  choice: ìhè
  rationale: ὑπό tinyere genitive na-egosi onye ma ọ bụ ihe na-eme omume ahụ. Nhazi ahịrịokwu Igbo “mgbe ìhè kpughere ha” na-eme ka ìhè bụrụ onye na-eme omume ahụ ma na-echekwa nkọwa agency ahụ.
- source_word: φανεροῦται
  choice: na-apụta ìhè
  rationale: φανερόω n'ụdị passive ebe a na-ekwu maka ihe ịghọ ihe a na-ahụ anya. “Na-apụta ìhè” dabara n'onyonyo nke ìhè ma bụrụkwa okwu Igbo doro anya.
theological_decisions:
- issue: Ihe “ìhè” na-ezo aka na ya n'ọnọdụ a
  choice: A sụgharịrị ya naanị dịka “ìhè,” n'akọwaghị kpọmkwem onye ma ọ bụ ihe ọ bụ.
  alternative: Kraịst; ozi ọma; eziokwu banyere omume; ma ọ bụ akaebe nke ndị kwere ekwe.
  rationale: Amaokwu ahụ n'onwe ya akọwaghị kpọmkwem ihe ìhè ahụ bụ. Ịhapụ ihe atụ ahụ n'obosara ya na-echekwa mgbagwoju na esemokwu nkà mmụta okpukpe dị n'okwu ahụ.
- issue: Mmekọrịta dị n'etiti participle ἐλεγχόμενα na ngwaa φανεροῦται
  choice: “ihe niile, mgbe ìhè kpughere ha, na-apụta ìhè”
  alternative: “ihe niile ìhè kpughere na-apụta ìhè” ma ọ bụ “ihe ọ bụla ìhè kpughere na-aghọ ihe a na-ahụ anya.”
  rationale: Greek nwere ike itinye ibu n'omume ikpughe ihe ma ọ bụ na nsonaazụ ya, ya bụ, ịghọ ihe a na-ahụ anya. Isi ederede na nkọwa ala peeji na-echekwa ohere abụọ ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “kpughere” na “na-apụta ìhè” chekwaa onyonyo nke ìhè na nkwughe n'amaokwu ahụ, na-enweghị ịkọwa “ìhè” dịka otu echiche nkà mmụta okpukpe kpọmkwem.
