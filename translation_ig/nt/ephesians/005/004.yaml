revisions:
- from: Ka a ghara inwe okwu rụrụ arụ, okwu nzuzu, ma ọ bụ njakịrị na-adịghị ọcha[a], bụ́ ihe ndị na-ekwesịghị ekwesị[b]; kama, ka e nwee inye ekele.
  to: Ka a ghara inwe okwu rụrụ arụ, okwu nzuzu, ma ọ bụ njakịrị rụrụ arụ[a], bụ́ ihe na-ekwesịghị ekwesị[b]; kama, ka a na-enye ekele.
  rationale: The revision improves idiomatic Standard Igbo and maintains the Greek text’s coordinated vice list, collective qualification, and adversative contrast. It does not introduce a doctrinal interpretation or narrow the disputed lexical range beyond what the immediate negative context requires.
