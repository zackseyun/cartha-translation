language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ αἰσχρότης καὶ μωρολογία ἢ εὐτραπελία, ⸂ἃ οὐκ ἀνῆκεν⸃, ἀλλὰ μᾶλλον εὐχαριστία.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/004.yaml
  text: And obscenity and foolish talk or crude joking[a], which are not fitting[b], but rather thanksgiving.
translation:
  language: ig
  text: Ka a ghara inwe okwu rụrụ arụ, okwu nzuzu, ma ọ bụ njakịrị rụrụ arụ[a], bụ́ ihe na-ekwesịghị ekwesị[b]; kama, ka a na-enye ekele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “njakịrị na-adịghị ọcha.” Okwu Grik ahụ nwere ike ịpụta nkọ n’okwu ma ọ bụ amamihe n’ịkpa okwu n’ebe ndị ọzọ, ma n’ebe a a na-eji ya n’echiche na-adịghị mma, n’ihi na e jikọtara ya na okwu ndị na-ekwesịghị ekwesị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “bụ́ ihe na-adịghị adabara” ma ọ bụ “bụ́ ihe na-ekwesịghị ime.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχρότης
  choice: okwu rụrụ arụ
  rationale: N’ebe a, okwu ahụ na-egosi okwu ihere na adịghị ọcha; ihe ndị e depụtara ya na ha nakwa ọdịiche ya na inye ekele na-eme ka nghọta metụtara okwu bụrụ nke kacha dabara.
- source_word: μωρολογία
  choice: okwu nzuzu
  rationale: Nke a na-egosipụta okwu na-enweghị uche n’ụzọ doro anya, dị mfe nghọta, ma na-echekwa njikọ ya na ikwu okwu.
- source_word: ἢ
  choice: ma ọ bụ
  rationale: Nke a bụ njikọ nkịtị nke na-ejikọta ihe ikpeazụ na ndepụta ahụ, ebe gburugburu amaokwu ahụ na-egosi na a na-ajụ ihe niile e depụtara.
- source_word: εὐτραπελία
  choice: njakịrị na-adịghị ọcha
  rationale: Ọ bụ ezie na okwu Grik a nwere ike ịpụta amamihe n’ịtụgharị okwu n’ọnọdụ ndị ọzọ, ebe a e tinyere ya n’etiti ụdị okwu na-ekwesịghị ekwesị; ya mere ntụgharị na-adịghị mma dị mkpa.
- source_word: ἃ οὐκ ἀνῆκεν
  choice: bụ́ ihe ndị na-ekwesịghị ekwesị
  rationale: Nkebi a na-ezo aka n’ihe atọ ahụ niile ma na-ekwu na ha adịghị mma ma ọ bụ adịghị dabara n’omume kwesịrị ekwesị.
- source_word: ἀλλὰ μᾶλλον
  choice: kama
  rationale: ‘Kama’ na-egosipụta ọdịiche siri ike n’etiti okwu ndị a jụrụ na ihe kwesịrị ịnọchi ha.
- source_word: εὐχαριστία
  choice: inye ekele
  rationale: Nke a na-egosi nkwupụta ekele, ma na-eme ka ọdịiche dị n’etiti ụdị okwu ọjọọ na okwu ekele doo anya n’Igbo nkịtị.
theological_decisions:
- issue: Ókè αἰσχρότης metụtara okwu ọnụ
  choice: A sụgharịrị ya dị ka ‘okwu rụrụ arụ,’ ya bụ, ihe rụrụ arụ a na-ekwu.
  alternative: ‘Omume rụrụ arụ’ ma ọ bụ ‘ihe ihere’ n’ụzọ sara mbara.
  rationale: μωρολογία na εὐτραπελία metụtara okwu ọnụ kpọmkwem, ebe εὐχαριστία nwekwara ike ịbụ okwu e ji ekele; gburugburu ahụ na-akwado nghọta metụtara okwu, n’agbanyeghị na αἰσχρότης n’onwe ya nwere ike ịdị sara mbara.
- issue: Ntụle omume nke εὐτραπελία
  choice: A sụgharịrị ya n’ụzọ na-adịghị mma dị ka ‘njakịrị na-adịghị ọcha.’
  alternative: ‘Okwu ọchị nwere amamihe’ ma ọ bụ ‘nkọ n’okwu.’
  rationale: Ọ bụ ezie na okwu ahụ nwere ike inwe nghọta dị mma n’ebe ọzọ, itinye ya na ndepụta a na nkebi ‘ihe ndị na-ekwesịghị ekwesị’ na-enye ya nghọta na-adịghị mma ebe a.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Nhazi ‘Ka a ghara inwe… kama, ka e nwee…’ na-eme ka nkebi ahụ bụrụ ahịrịokwu zuru oke n’Igbo ma na-echekwa ọdịiche dị n’ederede Grik. E debere akara nkọwa ụkwụ [a] na [b] ozugbo n’isi ederede.
