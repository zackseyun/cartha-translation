  source_fidelity: The draft accurately conveys the connective force ('N’otu aka ahụ'), moral obligation, marital referents, repeated love expression, and the concluding reflexive logic. However, the first occurrence of γυναῖκας is plural, as are σώματα; the Igbo wording should make the plural forms explicit rather than relying on a potentially distributive singular.
  naturalness: The revised wording retains clear, modern Standard Igbo. 'Ndị di' is direct and idiomatic in this marital context, and 'ndị nwunye nke ha' and 'ahụ nke ha' clearly express the source plurals.
  terminology: '''Ndị di'' / ''ndị nwunye'' appropriately render husbands/wives in the household context. ''Ịhụ ... n’anya'' consistently renders ἀγαπάω, while ''ahụ'' preserves σῶμα. No theological expansion is introduced.'
  issues:
