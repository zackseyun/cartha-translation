  text: οὕτως ὀφείλουσιν ⸀καὶ οἱ ἄνδρες ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας ὡς τὰ ἑαυτῶν σώματα· ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/028.yaml
  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: ig
  text: N’otu aka ahụ, ndị di kwesịkwara ịhụ ndị nwunye nke ha n’anya dị ka ahụ nke ha. Di nke hụrụ nwunye nke ya n’anya hụrụ onwe ya n’anya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: N’otu aka ahụ
  rationale: Ọ na-ejikọta amaokwu a na ihe atụ na ndụmọdụ dị n’ihu ya, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ὀφείλουσιν
  choice: kwesịkwara
  rationale: “Kwesịrị” na-egosi ọrụ omume dịịrị ha n’enweghị ịgbanwe ụdị okwu ahụ ka ọ bụrụ iwu kpọmkwem; “-kwara” na-ejikọkwa καὶ.
- source_word: καὶ οἱ ἄνδρες
  choice: ndị bụ di ... -kwara
  rationale: N’ọnọdụ okwu gbasara alụmdi na nwunye, ἄνδρες bụ ndị di, καὶ nwekwara ike mgbakwunye nke “kwa.”
- source_word: ἀγαπᾶν
  choice: ịhụ ... n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke kwesịrị nsọpụrụ si ekwu “ịhụ n’anya,” ma ọ na-edobe nkwugharị nke ἀγαπάω.
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: nwunye nke ha
  rationale: “Nwunye” dabara n’ọnọdụ alụmdi na nwunye; “nke ha” na-echekwa nkwusi ike nke nnọchiaha ntụgharị ἑαυτῶν.
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: dị ka ahụ nke ha
  rationale: Ọ na-edobe ntụnyere ahụ na okwu σῶμα n’ụzọ Igbo sitere n’okike; Igbo na-ejikarị “ahụ” otu a ọbụna mgbe ndị a na-ekwu maka ha karịrị otu.
- source_word: ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα
  choice: Di nke hụrụ nwunye nke ya n’anya
  rationale: “Di” na-eme ka onye nwoke a na-ekwu maka ya doo anya n’ọnọdụ a, “nke ya” na-echekwakwa nkwusi ike nke ἑαυτοῦ.
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: hụrụ onwe ya n’anya
  rationale: Ọ na-egosipụta nnọchiaha ntụgharị ahụ kpọmkwem ma na-echekwa arụmụka Pọl banyere ịhụ nwunye n’anya na ịhụ onwe onye n’anya.
theological_decisions:
- issue: Asụsụ metụtara nwoke n’ọdụmọdụ ezinụlọ
  choice: E ji “ndị bụ di” na “Di nke” mee ihe.
  alternative: “ndị nwoke” ma ọ bụ okwu na-akọwaghị nwoke kpọmkwem
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ ndụmọdụ a na-enye ndị di n’alụmdi na nwunye, ọ bụghị okwu gbasara mmadụ niile n’ozuzu.
- issue: Ụdị ntụnyere dị n’etiti nwunye na ahụ
  choice: 'E debere ya dịka ntụnyere doro anya: “dị ka ahụ nke ha.”'
  alternative: Ịkọwa ya dịka nkwupụta na nwunye na ahụ bụ otu ihe n’ụzọ metaphysical
  rationale: Ederede ahụ na-atụnyere ịhụ nwunye n’anya na ịhụ ahụ onwe onye n’anya, wee kwuo na onye hụrụ nwunye ya n’anya hụrụ onwe ya n’anya; nsụgharị ahụ agbakwụnyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Asụsụ bụ Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. E ji “ndị bụ di” zere nghọtahie nke “ndị di” nwere ike ịkpata n’ụfọdụ ọnọdụ, ma e debere nkwugharị nke “ịhụ ... n’anya” dịka ọ dị na Grik.
