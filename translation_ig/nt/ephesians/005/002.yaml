    text: A pụkwara ịsị, “Kraịst.” Okwu Grik Χριστός bụ aha e ji akọwa Mesaịa, ya bụ, Onye E Tere Mmanụ.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsị, “maka anyị” ma ọ bụ “maka ọdịmma anyị.” N’ebe a, okwu Grik ὑπέρ pụrụ igosi imere mmadụ ihe ma ọ bụ ịnọchite anya ya, n’akọwaghị kpọmkwem naanị otu n’ime ha.
    reason: lexical_alternative
  - marker: c
    text: Okwu banyere “ihe na-esi ísì ụtọ” na-ekwughachi asụsụ ịchụ àjà dị n’Agba Ochie, ebe ọ na-akọwa àjà Chineke nabatara ma nwee mmasị na ya.
    reason: cross_reference
