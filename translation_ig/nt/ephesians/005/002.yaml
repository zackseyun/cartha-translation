revisions:
- from: Na-ebinụ ndụ n’ịhụnanya, dị nnọọ ka Mezaịa[a] hụkwara anyị n’anya wee nyefee onwe ya n’ihi anyị[b], dịka onyinye na àjà nye Chineke, ka ọ bụrụ ihe na-esi ísì ụtọ.[c]
  to: Na-ebinụ ndụ n’ịhụnanya, dị nnọọ ka Mesaịa[a] hụkwara anyị n’anya wee nyefee onwe ya n’ihi anyị[b], ka ọ bụrụ onyinye na àjà nye Chineke nke na-esi ísì ụtọ.[c]
  rationale: The revision corrects the comparative construction so that the Messiah gives himself as, rather than merely like, an offering and sacrifice to God. It standardizes the title as “Mesaịa” and refines the lexical footnote without narrowing the semantic range of ὑπέρ.
  reviewer_model: gpt-5.6-terra
