id: EPH.5.2
reference: Ephesians 5:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ⸀ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ⸀ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: ig
  text: Na-ebinụ ndụ n’ịhụnanya, dị nnọọ ka Mesaịa[a] hụkwara anyị n’anya wee nyefee onwe ya n’ihi anyị[b], ka ọ bụrụ onyinye na àjà nye Chineke nke na-esi ísì ụtọ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Kraịst.” Okwu Grik Χριστός bụ aha e ji akọwa Mesaịa, ya bụ, Onye E Tere Mmanụ.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsị, “maka anyị” ma ọ bụ “maka ọdịmma anyị.” N’ebe a, okwu Grik ὑπέρ pụrụ igosi imere mmadụ ihe ma ọ bụ ịnọchite anya ya, n’akọwaghị kpọmkwem naanị otu n’ime ha.
    reason: lexical_alternative
  - marker: c
    text: Okwu banyere “ihe na-esi ísì ụtọ” na-ekwughachi asụsụ ịchụ àjà dị n’Agba Ochie, ebe ọ na-akọwa àjà Chineke nabatara ma nwee mmasị na ya.
    reason: cross_reference
lexical_decisions:
- source_word: περιπατεῖτε
  choice: Na-ebinụ ndụ
  rationale: Nke a na-egosipụta okwu Pọl ji ‘ije ije’ akọwa ụzọ mmadụ si ebi ndụ, ma ọ na-ada nke ọma ma doo ndị na-agụ Igbo nke oge a anya. Ụdị ‘-nụ’ na-egosikwa na iwu ahụ bụ maka ọtụtụ mmadụ.
- source_word: ἐν ἀγάπῃ
  choice: n’ịhụnanya
  rationale: Ọ na-edobe echiche nke ịhụnanya dịka ọnọdụ na ụzọ e si ebi ndụ, ma na-ejikọkwa ya na ngwaa ἠγάπησεν nke pụtara ‘hụrụ n’anya.’
- source_word: ὁ Χριστός
  choice: Mezaịa
  rationale: N’ebe a Χριστός nwere artikel ma na-arụ ọrụ dịka utu aha. ‘Mezaịa’ na-egosipụta utu aha ahụ n’Igbo kama ime ka ọ bụrụ naanị aha mmadụ.
- source_word: ἠγάπησεν ἡμᾶς
  choice: hụkwara anyị n’anya
  rationale: Ntụgharị a kwụ ọtọ, na ‘-kwara’ na-egosipụta καί nke na-ejikọta ihe Mezaịa mere na iwu e nyere ndị kwere ekwe.
- source_word: παρέδωκεν ἑαυτὸν
  choice: nyefee onwe ya
  rationale: Ọ na-egosipụta n'ụzọ doro anya na ọ bụ onwe ya ka o ji aka ya nyefee, ma na-edobe echiche nke inyefe onwe n’àjà.
- source_word: ὑπὲρ ἡμῶν
  choice: n’ihi anyị
  rationale: Nke a bụ okwu Igbo dị mfe ma nwee ike ibu echiche nke imere anyị ihe ọma ma ọ bụ ịnọchite anya anyị, n’emeghị ka otu nkọwa nke ὑπέρ bụrụ naanị nke ga-ekwe omume.
- source_word: προσφορὰν καὶ θυσίαν
  choice: onyinye na àjà
  rationale: A hapụrụ okwu abụọ ahụ iche iji chekwaa asụsụ ịchụ àjà dị n’amaokwu ahụ; ‘onyinye’ na ‘àjà’ bụ okwu Igbo a na-aghọta nke ọma.
- source_word: τῷ θεῷ
  choice: nye Chineke
  rationale: Ọ na-egosipụta Chineke dịka onye a na-enye onyinye ahụ ma na-achụrụ àjà ahụ.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: ka ọ bụrụ ihe na-esi ísì ụtọ
  rationale: Nke a na-edobe ihe atụ a pụrụ ịnụ ísì ya na asụsụ ịchụ àjà, n’etinyeghị nkọwa karịrị ihe Grik kwuru n’ahịrị ahụ.
theological_decisions:
- issue: Ntụgharị Χριστός dịka utu aha
  choice: Mezaịa
  alternative: Kraịst
  rationale: Artikel dị na Grik na ọnọdụ okwu a na-akwado na Χριστός bụ utu aha. ‘Mezaịa’ na-eme ka ọrụ ya dịka utu aha pụta ìhè, ebe e nyere ‘Kraịst’ na nkọwa ala peeji dịka usoro ọzọ a na-ejikarị eme ihe.
- issue: Ike okwu ὑπὲρ ἡμῶν nwere n’ọnọdụ ịchụ àjà
  choice: n’ihi anyị
  alternative: n’ọnọdụ anyị; n’aha anyị
  rationale: Amaokwu ahụ na-egosi na inyefe onwe Mezaịa bụ àjà e mere maka ọdịmma anyị, ma ὑπέρ n’onwe ya anaghị amanye ka a kọwaa ya naanị dịka ịnọchi anya mmadụ n’ọnọdụ ya. Ntụgharị a na-ahapụ ịdị arọ na ohere nkọwa nke Grik ahụ.
- issue: Asụsụ nke ísì ụtọ n’àjà
  choice: ka ọ bụrụ ihe na-esi ísì ụtọ
  alternative: dịka ísì ọma na-atọ Chineke ụtọ
  rationale: Ntụgharị isi na-edobe ihe oyiyi Grik na mgbagwoju ya n’enweghị itinye ngwaa ‘na-atọ ụtọ’ n’ime amaokwu; nkọwa ala peeji na-akọwa njikọ ya na asụsụ Àgbụ Ọhụrụ banyere àjà Chineke nabatara.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Na-ebinụ ndụ’ bụ ntụgharị eke nke ihe atụ Pọl banyere ‘ije ije,’ ebe ‘Mezaịa,’ ‘onyinye,’ na ‘àjà’ na-echekwa asụsụ okpukpe na nke ịchụ àjà nke isi mmalite ahụ.
