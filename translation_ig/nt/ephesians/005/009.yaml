  rationale: The revision replaces the interpretive expansion of ἐν with “dị n’,” retaining the Greek copula and prepositional construction while remaining comprehensible in Standard Igbo. It also adjusts the textual-variant quotation to reflect the attested alternative without adding “Holy.” The lexical-alternative and textual-variant anchors remain attached to the relevant terms.
