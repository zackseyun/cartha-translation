  yaml_path: translation/nt/ephesians/005/009.yaml
  text: for the fruit of the light is in all goodness and righteousness and truth[c][b][a],
translation:
  language: ig
  text: N’ihi na mkpụrụ nke ìhè ahụ dị n’ịdị mma niile, n’ezi omume[a], na n’eziokwu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi.” Okwu Grik ahụ pụrụ ịpụta ma ezi omume ma ikpe ziri ezi n’ihe Pọl dere.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie na-agụ, “mkpụrụ nke Mmụọ,” kama “mkpụrụ nke ìhè ahụ.”
    reason: textual_variant
lexical_decisions:
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara ndụ a kpọrọ ndị kwere ekwe ka ha bie n’amaokwu bu ụzọ.
- source_word: καρπὸς
  choice: mkpụrụ
  rationale: E debere ihe atụ Pọl ji egosi ihe ìhè na-amịpụta ná ndụ mmadụ.
- source_word: τοῦ φωτός
  choice: nke ìhè ahụ
  rationale: Nkọwa aha ahụ na-arụtụ aka n’ìhè e kwuru banyere ya n’amaokwu nke 8.
- source_word: ἐν
  choice: na-apụta ìhè n’ụdị
  rationale: Nke a na-egosi ebe ma ọ bụ ụzọ a na-ahụ mkpụrụ ahụ, ma zere okwu Igbo nke ga-ada ka ọnọdụ nkịtị n’ime ihe.
- source_word: πάσῃ
  choice: niile
  rationale: Ọ na-enye aha atọ ndị a echiche zuru ezu.
- source_word: ἀγαθωσύνῃ
  choice: ịdị mma
  rationale: Ọ na-edobe echiche sara mbara nke ịdị mma n’omume, n’emeghị ka ọ bụrụ naanị obiọma.
- source_word: δικαιοσύνῃ
  choice: ezi omume
  rationale: Ọ bụ okwu Igbo doro anya maka ibi ndụ ziri ezi; ihe ọzọ ọ pụrụ ịpụta, ikpe ziri ezi, dị n’okpuru peeji.
- source_word: ἀληθείᾳ
  choice: eziokwu
  rationale: Ọ na-edobe ma echiche nke ihe bụ eziokwu ma nke ikwu na ime ihe n’ezi obi.
theological_decisions:
- issue: Ọgụgụ dị iche n’ahịrịokwu τοῦ φωτός
  choice: mkpụrụ nke ìhè ahụ
  alternative: mkpụrụ nke Mmụọ Nsọ
  rationale: SBLGNT gụrụ φωτός, nke kwekọrọ n’okwu gbasara ịbụ ìhè n’amaokwu nke 8. E debere ọgụgụ ọzọ a ma ama n’okpuru peeji.
- issue: Ihe δικαιοσύνη pụtara
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N’ebe a, ezi omume dabara n’usoro àgwà ndụ a kpọpụtara, ma okwu Grik ahụ nwekwara ike ịgụnye ikpe ziri ezi; ya mere e chekwara nke ahụ n’okpuru peeji.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ugwu. E ji “na-apụta ìhè n’ụdị” mee ka ọrụ ἐν doo anya n’ụzọ ebumpụta ụwa, n’agbanyeghị na ọ dịtụ nkọwa karịa ntụgharị mkpụrụokwu n’otu n’otu.
