id: EPH.5.23
reference: Ephesians 5:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, ⸀αὐτὸς σωτὴρ τοῦ σώματος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: ig
  text: N’ihi na di bụ isi[a] nwunye ya, dịkwa ka Mezaịa[b] bụ isi ọgbakọ ahụ; ya onwe ya bụ Onye Nzọpụta nke ahụ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Isi’ na-echekwa ihe atụ okwu Grik. A na-akọwa ya n’ụzọ dị iche iche dịka onye nwere ikike, onye nọ n’ọnọdụ pụtara ìhè, ma ọ bụ isi mmalite.
    reason: lexical_alternative
  - marker: b
    text: Asụsụ Grik kwuru ‘Kraịst’; e ji ‘Mezaịa’ sụgharịa ya ebe a n’ihi na ọ na-arụ ọrụ dịka aha ọkwa.
    reason: alternative_reading
  - marker: c
    text: 'A pụkwara ịsụgharị akụkụ ikpeazụ ya: ‘ebe ya onwe ya bụ Onye Nzọpụta nke ahụ.’'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-egosi ihe kpatara ma ọ bụ nkọwa nke ndụmọdụ dị n’amaokwu bu ụzọ; okwu a na-arụ ọrụ ahụ nke ọma n’Igbo.
- source_word: ἀνήρ / γυνή
  choice: di / nwunye
  rationale: N’ọnọdụ a nke na-ekwu banyere alụmdi na nwunye, ihe okwu abụọ a pụtara bụ di na nwunye, ọ bụghị nwoke na nwanyị n’ozuzu ha.
- source_word: κεφαλή
  choice: isi
  rationale: A hapụrụ ihe atụ okwu Grik ahụ ka ọ dị, kama ịkọwa ya ozugbo dịka ‘onyeisi,’ ‘onye nwere ikike,’ ma ọ bụ ‘isi mmalite.’
- source_word: Χριστός
  choice: Mezaịa
  rationale: N’ebe a ọ bụ aha ọkwa nke Onye E Tere Mmanụ, ya mere ‘Mezaịa’ na-eme ka ihe aha ọkwa ahụ pụtara pụta ìhè.
- source_word: ἐκκλησία
  choice: ọgbakọ ahụ
  rationale: Ọ na-ezo aka n’ọgbakọ ndị nke Mezaịa; ‘ọgbakọ’ na-ezere ime ka onye na-agụ ya chee naanị ụlọ ofufe ma ọ bụ otu ụka pụrụ iche.
- source_word: αὐτός
  choice: ya onwe ya
  rationale: Nkwupụta a siri ike n’Asụsụ Grik; ‘ya onwe ya’ na-echekwa nkwusi ike ahụ.
- source_word: σωτήρ
  choice: Onye Nzọpụta
  rationale: Nke a bụ okwu Igbo doro anya maka onye na-azọpụta, ma na-echekwa mkpa okwu ahụ nwere n’ihe gbasara nzọpụta.
- source_word: σῶμα
  choice: ahụ
  rationale: Ọ na-echekwa ihe atụ Pọl ji ahụ mmadụ kọwaa ọgbakọ ahụ, n’etinyeghị ‘ahụ ya’ ebe Asụsụ Grik na-ekwughị ‘ya’ kpọmkwem.
theological_decisions:
- issue: Ihe κεφαλή (‘isi’) pụtara n’ihe atụ di na nwunye na Mezaịa na ọgbakọ
  choice: E debere ihe atụ ahụ dịka ‘isi.’
  alternative: ‘onyeisi,’ ‘onye nwere ikike n’ebe ... nọ,’ ma ọ bụ ‘isi mmalite’
  rationale: Ndị na-akọwa Akwụkwọ Nsọ aghọtala okwu a n’ụzọ dị iche iche. Nsụgharị ahụ ekwesịghị idozi esemokwu ahụ n’ime amaokwu n’onwe ya.
- issue: Otú e si sụgharị Χριστός
  choice: Mezaịa
  alternative: Kraịst
  rationale: Okwu ahụ na-arụ ọrụ dịka aha ọkwa n’ebe a; ‘Mezaịa’ na-egosi echiche nke Onye E Tere Mmanụ.
- issue: Mmekọrịta αὐτὸς σωτὴρ τοῦ σώματος na nkebi okwu bu ya ụzọ
  choice: ‘ya onwe ya bụ Onye Nzọpụta nke ahụ’ dịka nkwupụta na-akọwa Mezaịa
  alternative: ‘ebe ya onwe ya bụ Onye Nzọpụta nke ahụ’
  rationale: Asụsụ Grik enweghị ngwaa e dere n’akụkụ a ma nwee ike ịgụ ya dịka nkwupụta aha nọ n’akụkụ nke bu ya ụzọ; Igbo chọrọ ka e tinye ‘bụ’ ka ahịrịokwu doo anya, ebe ndetu ala na-echekwa ụzọ ọzọ e nwere ike isi ghọta njikọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Di’ na ‘nwunye’ dabara n’ọnọdụ alụmdi na nwunye; ‘ọgbakọ’ na-egosi obodo ndị kwere ekwe n’etinyeghị echiche nke ụlọ ma ọ bụ otu ụka pụrụ iche. E debere ‘isi’ na ‘ahụ’ dịka ihe atụ ndị dị n’Asụsụ Grik.
