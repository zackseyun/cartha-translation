  terminology: “Di,” “nwunye,” “isi,” “Mezaịa,” “ọgbakọ,” “Onye Nzọpụta,” na “ahụ” dabara n’ọnọdụ a. Ndeta ala a na b na-echekwa ma ihe atụ “isi” na nhọrọ “Mezaịa”; ndeta c na-enye ụzọ ọzọ nke njikọ nkebi ikpeazụ n’enweghị ịgbanwe ihe amaokwu ahụ pụtara. Ihe nrịbama ndetu ala dị n’ebe kwesịrị ekwesị.
