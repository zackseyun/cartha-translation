  source_fidelity: 'Nsụgharị ahụ na-esochi Grik nke ọma: ὅτι dịka “N’ihi na”; ἀνήρ/γυνή dịka “di/nwunye”; e debere κεφαλή dịka “isi” n’enweghị ịkọwa arụmụka ya; ὡς καί dị na “dịkwa ka”; αὐτός natara nkwusi ike na “ya onwe ya”; a sụgharịkwara σωτήρ τοῦ σώματος n’ụzọ kwesịrị ekwesị dịka “Onye Nzọpụta nke ahụ.” “Mezaịa” maka Χριστός na-adịkwa n’otu na mkpebi ọrụ ngo banyere aha ọkwa a.'
