id: EPH.5.29
reference: Ephesians 5:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ ⸀Χριστὸς τὴν ἐκκλησίαν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/029.yaml
  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: ig
  text: N’ihi na ọ dịghị onye kpọrọ anụ ahụ nke ya[a] asị mgbe ọ bụla; kama, ọ na-azụ ya ma jiri ịhụnanya na-elekọta ya, dị nnọọ ka Mesaịa[b] si azụkwa ọgbakọ ahụ ma na-elekọta ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ahụ nke ya.” Okwu Grik a bụ “anụ ahụ,” ma ebe a ọ na-ezo aka n’ahụ mmadụ n’ezie, ọ bụghị n’ọdịdị mmehie.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, Onye E Tere Mmanụ; a na-akpọkwa ya “Kraịst.”
    reason: title_clarification
lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: N’ihi na ọ dịghị onye ... mgbe ọ bụla
  rationale: “N’ihi na” na-egosi na amaokwu a na-enye ihe mere e ji kwuo okwu gara aga; “ọ dịghị onye ... mgbe ọ bụla” na-egosipụta nkwupụta zuru ụwa ọnụ nke οὐδεὶς ... ποτε.
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: anụ ahụ nke ya
  rationale: N’ebe a σάρξ na-ezo aka n’ahụ mmadụ n’ezie, ọ bụghị n’ọchịchọ mmehie. “Anụ ahụ nke ya” na-echekwa ihe oyiyi okwu Grik ma na-egosi ἑαυτοῦ nke ọma.
- source_word: ἐμίσησεν
  choice: kpọrọ ... asị
  rationale: Nke a bụ ụzọ Igbo nkịtị ma sie ike nke ọma isi sụgharị μισέω.
- source_word: ἐκτρέφει
  choice: na-azụ ya
  rationale: “Ịzụ” gụnyere inye nri na ilekọta ihe ka ọ dị ndụ ma too; nke a dabara n’ilekọta ahụ mmadụ.
- source_word: θάλπει
  choice: jiri ịhụnanya na-elekọta ya
  rationale: θάλπω nwere echiche nke nlekọta dị nro ma na-ekpo ọkụ. Nkebi a na-enye echiche ahụ n’Igbo nkịtị karịa nsụgharị nkịtị nke ‘ime ka ọ na-ekpo ọkụ.’
- source_word: καθὼς καὶ
  choice: dị nnọọ ka ... kwa
  rationale: Nke a na-echekwa ma ntụnyere καθὼς ma mgbakwunye nke καί.
- source_word: ὁ Χριστός
  choice: Mesaịa
  rationale: Χριστός bụ aha ọkwá pụtara Onye E Tere Mmanụ. “Mesaịa” na-egosi na ọ bụ aha ọkwá ebe a, kama ile ya anya naanị dị ka aha mmadụ.
- source_word: τὴν ἐκκλησίαν
  choice: ọgbakọ ahụ
  rationale: ἐκκλησία ebe a bụ ndị kwere ekwe dịka otu ahụ, ọ bụghị ụlọ ha na-ezukọ n’ime ya. “Ọgbakọ ahụ” na-echekwa echiche nke ndị mmadụ kpọkọtara ọnụ.
theological_decisions:
- issue: Otu e si sụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst; Onye E Tere Mmanụ
  rationale: Edemede Grik tinyere njirimara ὁ n’ihu Χριστός, nke na-akwado nghọta ya dịka aha ọkwá. “Mesaịa” bụ okwu a maara nke na-echekwa njikọ ya na Onye E Tere Mmanụ, ebe “Kraịst” bụkwa nsụgharị ọdịnala.
- issue: Ihe σάρξ pụtara ebe a
  choice: anụ ahụ nke ya
  alternative: ahụ nke ya
  rationale: Ọ bụ ahụ mmadụ n’ezie ka a na-ekwu maka ya n’ihe atụ gbasara alụmdi na nwunye na ọgbakọ; ya mere a zere ịkọwa ya dịka ‘ọdịdị mmehie.’
- issue: Ngwaa ndị a hapụrụ n’ahịrị ikpeazụ
  choice: si azụkwa ọgbakọ ahụ ma na-elekọta ya
  alternative: si emekwa ọgbakọ ahụ
  rationale: Asụsụ Grik hapụrụ ἐκτρέφει καὶ θάλπει ka onye na-agụ ya ghọta na ha ka na-arụ ọrụ n’ahịrị ikpeazụ. Igbo chọrọ ka e kwughachi ha ka ahịrịokwu doo anya; nke a anaghị agbakwunye omume ọhụrụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere njikọ nkọwa “N’ihi na,” ihe oyiyi nke ilekọta ahụ, na ntụnyere dị n’etiti mmadụ na Mesaịa. E kwughachiri ngwaa ndị a ghọtara n’ahịrị ikpeazụ ka okwu ahụ bụrụ Igbo eke.
