  to: na-eji oge ahụ eme ihe n'ụzọ kacha mma[a], n’ihi na ụbọchị ndị ahụ dị njọ.
  rationale: The revision preserves the source’s participial exhortation and its idiomatic sense of making the best use of the opportune time. It removes the added deictic force of “ndị a,” renders the characterization of the days more precisely, and corrects the footnote’s alternative for the αγορά metaphor. No doctrinal interpretation is added.
