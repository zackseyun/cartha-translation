  text: making the most of the time[a], because the days are evil.
translation:
  language: ig
  text: na-eji oge ahụ eme ihe n'ụzọ kacha mma[a], n’ihi na ụbọchị ndị ahụ dị njọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịgbapụta oge ahụ”; okwu Grik a nwekwara ike ịpụta “ịzụta ohere ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαγοραζόμενοι
  choice: na-eji ... eme ihe n'ụzọ kacha mma
  rationale: N’agbanyeghị na ngwaa Grik a na-akpalite echiche nke ‘ịzụpụta’ ma ọ bụ ‘ịzụkọrọ,’ n’ebe a ọ bụ okwu ntụziaka pụtara iji oge ma ọ bụ ohere mee ihe nke ọma. Nsụgharị a bụ Igbo doro anya, ọ naghịkwa etinye echiche nzọpụta n’amaokwu ahụ.
- source_word: καιρόν
  choice: oge ahụ
  rationale: καιρός na-egosikarị oge kwesịrị ekwesị ma ọ bụ ohere pụrụ iche, ọ bụghị naanị oge n’ozuzu. ‘Oge ahụ’ na-edobe okwu oge n’ahịrị bụ isi, ebe nkebi ngwaa na-eme ka echiche iji ohere ahụ nke ọma pụta ìhè.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara ndụmọdụ ahụ; ‘n’ihi na’ bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo ya.
- source_word: ἡμέραι
  choice: ụbọchị ndị a
  rationale: Ọ bụ aha ọtụtụ nke na-ezo aka n’oge na ọnọdụ ndị ha nọ na ya. ‘Ndị a’ na-eme ka ntụaka ahụ bụrụ nke ebumpụta ụwa n’Igbo n’enweghị ịgbasa nkọwa ya.
- source_word: πονηραί
  choice: jọrọ njọ
  rationale: N’ebe a okwu ahụ na-akọwa ụbọchị ndị ahụ dị ka ndị ajọ omume na ọnọdụ ọjọọ jupụtara na ha. ‘Jọrọ njọ’ bụ okwu Igbo ebumpụta ụwa nke na-edobe ịdị arọ nke echiche ahụ.
theological_decisions:
- issue: Enwere ike ịghọta ἐξαγοραζόμενοι dị ka okwu banyere mgbapụta ma ọ bụ nzọpụta.
  choice: A sụgharịrị ya dị ka ndụmọdụ iji oge ma ọ bụ ohere mee ihe n'ụzọ kacha mma.
  alternative: ịgbapụta oge ahụ; ịzụkọrọ ohere ahụ
  rationale: N’ọnọdụ ndụmọdụ omume a, okwu ahụ na-ekwu maka iji ohere eme ihe nke ọma, ọ bụghị ozizi mgbapụta kpọmkwem. Ihe odide bụ isi na-ezere itinye echiche nzọpụta na-adịghị apụta ìhè, ebe nkọwa ala peeji na-echekwa ihe atụ dị n’okwu Grik na nghọta ọzọ o nwere ike inye.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘na-eji oge ahụ eme ihe n'ụzọ kacha mma’ nye echiche okwu ahụ n’ụzọ ebumpụta ụwa, ebe e debere ihe atụ ‘ịgbapụta/ịzụkọrọ’ na nkọwa ala peeji.
