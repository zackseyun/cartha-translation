id: EPH.5.5
reference: Ephesians 5:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: ig
  text: 'Nke a ka unu maara nke ọma: onye ọ bụla na-eme omume rụrụ arụ n’ihe gbasara mmekọahụ, ma ọ bụ onye omume ya na-adịghị ọcha, ma ọ bụ onye anyaukwu—onye na-efe arụsị[a]—enweghị ihe nketa n’alaeze nke Mesaịa[b] na Chineke.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nke bụ ife arụsị”; o yikarịrị ka nke a na-arụtụ aka karịsịa n’anyaukwu.
    reason: alternative_reading
  - marker: b
    text: N’asụsụ Grik, “Kraịst”; a sụgharịrị ya “Mesaịa” ebe a n’ihi na Χριστός na-arụ ọrụ dị ka utu aha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: unu maara nke a nke ọma
  rationale: Nkebiokwu Grik a jikọtara ngwaa abụọ metụtara ịma na ịghọta iji mesie obi ike ha nwere n’ihe a ike. ‘Unu maara nke a nke ọma’ na-ebute ike nkwusi ahụ n’Igbo dị ugbu a n’enweghị ikwughachi okwu n’ụzọ na-adịghị eke.
- source_word: πόρνος
  choice: onye na-eme omume rụrụ arụ n’ihe gbasara mmekọahụ
  rationale: Nke a na-akọwa onye omume rụrụ arụ n’ihe gbasara mmekọahụ ji mara. Nsụgharị a doro ndị na-agụ Igbo ugbu a anya ma ghara ime ka ihe okwu ahụ pụtara dị warara.
- source_word: ἀκάθαρτος
  choice: onye na-adịghị ọcha
  rationale: Okwu a pụrụ ịpụta adịghị ọcha n’omume n’ozuzu ya, ma nsụgharị a na-edebekwa ihe atụ nke ịdị ọcha na adịghị ọcha dị n’okwu Grik.
- source_word: πλεονέκτης
  choice: onye anyaukwu
  rationale: ‘Onye anyaukwu’ bụ okwu Igbo doro anya maka onye ọchịchọ inwetakwu ihe na-adịghị akwụsị akwụsị ji mara.
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: onye bụ onye na-efe arụsị
  rationale: N’ọnọdụ okwu a, nkebiokwu ahụ na-akọwa onye anyaukwu dị ka onye na-efe arụsị. E tinyere ihe ọzọ usoro okwu Grik ahụ pụrụ ịpụta na nkọwa ala peeji iji chekwaa mgbagwoju anya dị na ya.
- source_word: κληρονομίαν
  choice: ihe nketa
  rationale: ‘Ihe nketa’ na-echekwa echiche ọgbụgba ndụ na olileanya nke oge ikpeazụ dị n’iji okwu a eme ihe n’akwụkwọ Pọl.
- source_word: βασιλείᾳ
  choice: alaeze
  rationale: ‘Alaeze’ bụ okwu Igbo a maara nke ọma, ọ pụkwara ịgụnye ma ọchịchị ma ógbè onye eze na-achị.
- source_word: Χριστοῦ
  choice: Mezaya
  rationale: N’ebe a Χριστός na-arụ ọrụ dị ka utu aha; ya mere ‘Mezaya’ na-egosipụta ọrụ ahụ kama ime ya naanị aha mmadụ.
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: nke Mezaya na Chineke
  rationale: A sụgharịrị njikọ aha abụọ ahụ ozugbo dịka Grik siri dị, n’etinyeghị mkpebi nkà mmụta okpukpe karịrị ihe ahịrịokwu ahụ kwuru.
theological_decisions:
- issue: Ihe ὅ ἐστιν εἰδωλολάτρης na-arụtụ aka na ya
  choice: 'E mere ka ọ kọwaa onye e kwuru okwu ya, karịsịa onye anyaukwu: ‘onye bụ onye na-efe arụsị.’'
  alternative: ‘Nke bụ ife arụsị,’ nke na-arụtụ aka karịsịa n’anyaukwu.
  rationale: Nnochiaha Grik ahụ bụ nke ụdị etiti, ebe aha ndị bu ya ụzọ bụ nke ụdị nwoke, nke na-eme ka usoro okwu ahụ nwee mgbagwoju anya. Ihe gbara ya gburugburu na Ndị Kọlọsi 3:5 na-akwado njikọ anyaukwu na ife arụsị. Isi ederede na-eji okwu Igbo na-aga were were, ebe nkọwa ala peeji na-echekwa ụzọ ọzọ e nwere ike isi ghọta ya.
- issue: Ihe enweghị ihe nketa pụtara
  choice: 'E chekwara ya dịka ọnọdụ dị ugbu a: ‘enweghị ihe nketa.’'
  alternative: ‘Agaghị eketa alaeze ahụ.’
  rationale: Grik jiri ngwaa oge ugbu a, οὐκ ἔχει, ọ bụghị ngwaa ọdịnihu. Nsụgharị ahụ na-echekwa nke a ma ghara ime ka ịdọ aka ná ntị ahụ dị nro.
- issue: Mmekọrịta dị n’etiti ‘Mezaya na Chineke’
  choice: E debere njikọ aha abụọ ahụ dịka ‘alaeze nke Mezaya na Chineke.’
  alternative: Nsụgharị ga-ekpebi kpọmkwem otu aha abụọ ahụ si metụta onwe ha n’ụzọ nkà mmụta okpukpe.
  rationale: Usoro okwu ahụ na-egosi njikọ chiri anya, ma nsụgharị ekwesịghị ịmanye otu nkwubi okwu arụmụka karịrị ihe Grik kwuru kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E zere okwu ochie na asụsụ otu ụka pụrụ iche. Akara ogologo dị n’etiti ahịrịokwu na-ekewa nkọwa banyere onye na-efe arụsị n’ụzọ doro anya, ebe nkọwa ala peeji na-echekwa mgbagwoju anya nke Grik.
