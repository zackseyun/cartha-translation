review_pass:
  verdict: revise
  source_fidelity: The draft conveys the vice list, the present-tense assertion of having no inheritance, and the qualified association of greed with idolatry. However, the opening ‘N’ihi na’ can read as a subordinate causal clause (‘because’) rather than Paul’s connective assertion (‘for/indeed’). The rendering should make the statement ‘you know this’ and its content explicit.
  naturalness: Most wording is clear Standard Igbo. ‘Onye bụ onye na-efe arụsị’ is unnecessarily repetitive; ‘onye na-efe arụsị’ is more idiomatic. ‘Onye omume ya na-adịghị ọcha’ communicates the ethical sense of ἀκάθαρτος more naturally than a bare ‘onye na-adịghị ọcha,’ which can be heard literally.
  terminology: ‘Ihe nketa’ and ‘alaeze’ are appropriate. ‘Mesaịa’ is a more established Standard-Igbo form for ‘Messiah’ than ‘Mezaya’; retain the footnote explaining that the Greek is Χριστός (‘Kraịst’).
  issues:
  - severity: medium
    issue: Opening connective is potentially misread as a dependent causal clause.
    rationale: τοῦτο γὰρ ἴστε γινώσκοντες is an emphatic assertion/injunction introducing the content that follows. ‘N’ihi na unu maara...’ can sound like ‘because you know...’ and leaves the relationship less direct. ‘Nke a ka unu maara nke ọma’ is clear and preserves the emphatic knowing.
  - severity: low
    issue: Redundant expression for ‘idolater.’
    rationale: ‘Onye bụ onye na-efe arụsị’ repeats ‘onye’ without adding meaning. ‘Onye na-efe arụsị’ is natural Igbo and retains the personalized main-text resolution of the syntactically difficult Greek clause.
  - severity: low
    issue: Messiah transliteration is nonstandard/less established.
    rationale: ‘Mesaịa’ is the more established Standard-Igbo biblical form and avoids an English-influenced spelling, while still following the stated policy of rendering Χριστός as a title.
  revised_text: 'Nke a ka unu maara nke ọma: onye ọ bụla na-eme omume rụrụ arụ n’ihe gbasara mmekọahụ, ma ọ bụ onye omume ya na-adịghị ọcha, ma ọ bụ onye anyaukwu—onye na-efe arụsị[a]—enweghị ihe nketa n’alaeze nke Mesaịa[b] na Chineke.'
