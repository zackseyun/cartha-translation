revisions:
- from: 'N’ihi na unu maara nke a nke ọma: onye ọ bụla na-eme omume rụrụ arụ n’ihe gbasara mmekọahụ, ma ọ bụ onye na-adịghị ọcha, ma ọ bụ onye anyaukwu—onye bụ onye na-efe arụsị[a]—enweghị ihe nketa n’alaeze nke Mezaya[b] na Chineke.'
  to: 'Nke a ka unu maara nke ọma: onye ọ bụla na-eme omume rụrụ arụ n’ihe gbasara mmekọahụ, ma ọ bụ onye omume ya na-adịghị ọcha, ma ọ bụ onye anyaukwu—onye na-efe arụsị[a]—enweghị ihe nketa n’alaeze nke Mesaịa[b] na Chineke.'
  rationale: The revision clarifies the force of the opening statement, uses more idiomatic ethical language for moral impurity, removes a redundant noun in the idolatry clause, and normalizes the title ‘Messiah’ as ‘Mesaịa.’ The footnote continues to preserve the Greek neuter-relative ambiguity without imposing a theological conclusion.
