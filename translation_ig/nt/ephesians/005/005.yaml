    reason: lexical_alternative
  revision_rationale: The revision clarifies the force of the opening statement, uses more idiomatic ethical language for moral impurity, removes a redundant noun in the idolatry clause, and normalizes the title ‘Messiah’ as ‘Mesaịa.’ The footnote continues to preserve the Greek neuter-relative ambiguity without imposing a theological conclusion.
