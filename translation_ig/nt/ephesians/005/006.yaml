language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: ig
  text: Ka onye ọ bụla ghara iji okwu efu duhie unu, n’ihi ihe ndị a ka ọnụma Chineke ji abịakwasị ụmụ nnupụisi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ndị nnupụisi, ma ọ bụ ndị ịjụ irube isi ji mara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ... ἀπατάτω
  choice: Ka onye ọ bụla ghara ... duhie unu
  rationale: 'Usoro a na-egosipụta iwu mgbochi dị na Grik n’Igbo nkịtị ma doo anya: a gaghị ekwe ka onye ọ bụla ghọgbuo ma ọ bụ duhie ha.'
- source_word: κενοῖς λόγοις
  choice: iji okwu efu
  rationale: “Okwu efu” na-echekwa ihe atụ nke okwu na-enweghị ezi ọdịnaya ma ọ bụ uru; “iji” na-egosipụta ụzọ e si eduhie.
- source_word: διὰ ταῦτα
  choice: n’ihi ihe ndị a
  rationale: Nke a na-echekwa ihe kpatara ihe ahụ n’ụzọ doro anya, na-ezo aka n’omume ndị a kpọrọ aha n’amaokwu ndị bu ụzọ.
- source_word: ἔρχεται
  choice: na-abịakwasị
  rationale: Ọ na-echekwa ike nke oge ugbu a n’ahịrịokwu Grik ma kwekọọ n’ụzọ Igbo si ekwu banyere ihe na-abịakwasị mmadụ.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: ọnụma Chineke
  rationale: “Ọnụma” na-ebuga kpọmkwem echiche ὀργή, kama ime ka ọ dị nro dịka naanị ikpe Chineke.
- source_word: ἐπὶ
  choice: abịakwasị
  rationale: Ngwaa a na njikọ ya na-egosipụta na ọnụma ahụ na-abịa n’isi ndị ahụ, n’Igbo dị ire ụtọ.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: ụmụ nnupụisi
  rationale: N’Igbo, “ụmụ” nwere ike ịpụta ndị e ji otu àgwà mara, ma ọ naghị amanye ọdịiche nwoke na nwanyị. “Nnupụisi” na-egosipụta ndị ajụjụ irube isi ji mara, ebe nkọwa ala peeji na-eme ka akpaalaokwu ahụ doo anya.
- source_word: ἀπειθείας
  choice: nnupụisi
  rationale: N’okwu a, ọ na-egosi ịjụ irube isi. “Nnupụisi” bụ okwu Igbo siri ike ma kwekọọ n’ọnọdụ omume na ịdọ aka ná ntị dị n’akụkụ amaokwu a.
theological_decisions:
- issue: Otu e si sụgharị asụsụ banyere ọnụma Chineke
  choice: ọnụma Chineke
  alternative: ikpe Chineke
  rationale: Ederede ahụ ji ὀργή, nke pụtara ọnụma, ọ bụghị naanị okwu sara mbara maka ikpe. Ya mere, a hapụrụ ike nkà mmụta okpukpe nke okwu ahụ ka ọ dị.
- issue: Otu e si sụgharị akpaalaokwu τοὺς υἱοὺς τῆς ἀπειθείας
  choice: ụmụ nnupụisi
  alternative: ndị nnupụisi ji mara
  rationale: “Ụmụ nnupụisi” na-echekwa ọdịdị akpaalaokwu nke isi mmalite n’ụzọ Igbo kwere nghọta. Nkọwa ala peeji na-akọwa na ọ pụtara ndị àgwà nnupụisi ji mara, na-enweghị ime ka ihe ahụ bụrụ naanị mmekọrịta ezinụlọ ma ọ bụ ụmụ nwoke nkịtị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ka onye ọ bụla ghara” bụ usoro iwu mgbochi e ji eme ihe n’Igbo; “okwu efu” na-echekwa ihe atụ Grik; “ụmụ nnupụisi” na-edowe akpaalaokwu ahụ ma nkọwa ala peeji na-akọwa ihe ọ pụtara.
