    text: Ya bụ, ndị nnupụisi, ma ọ bụ ndị ịjụ irube isi ji mara.
    reason: lexical_alternative
  revision_rationale: The revision removes a duplicated causal connector while preserving the direct causal force of διὰ ταῦτα. It retains the source-shaped expression 'ụmụ nnupụisi' in the text and replaces the unnatural footnote wording with a clear idiomatic explanation of the genitive expression.
