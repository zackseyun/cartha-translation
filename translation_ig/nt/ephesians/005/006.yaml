revisions:
- from: Ka onye ọ bụla ghara iji okwu efu duhie unu, n’ihi na ọ bụ n’ihi ihe ndị a ka ọnụma Chineke ji abịakwasị ụmụ nnupụisi.[a]
  to: Ka onye ọ bụla ghara iji okwu efu duhie unu, n’ihi ihe ndị a ka ọnụma Chineke ji abịakwasị ụmụ nnupụisi.[a]
  rationale: The revision removes a duplicated causal connector while preserving the direct causal force of διὰ ταῦτα. It retains the source-shaped expression 'ụmụ nnupụisi' in the text and replaces the unnatural footnote wording with a clear idiomatic explanation of the genitive expression.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:16:50Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the prohibition against deception, the instrumental force of κενοῖς λόγοις ('iji okwu efu'), the causal διὰ ταῦτα, divine wrath, and its coming upon those characterized by ἀπείθεια. 'Ụmụ nnupụisi' suitably retains the source’s familial/characterizing idiom without falsely making a claim about literal descent.
  naturalness: The phrase 'n’ihi na ọ bụ n’ihi ihe ndị a ka' is unnecessarily repetitive in Standard Igbo. 'N’ihi ihe ndị a ka' expresses the Greek causal construction naturally and directly. The existing footnote’s proposed literal wording, 'ụmụ nke nnupụisi,' is not a natural Igbo expression and can be misunderstood.
  terminology: '''Ọnụma Chineke'' is an appropriate direct rendering of ἡ ὀργὴ τοῦ θεοῦ. ''Nnupụisi'' adequately represents ἀπείθεια in this ethical warning, and the explanatory note should state its sense as refusal to obey rather than introduce an unnatural pseudo-literal construction.'
  issues:
  - severity: low
    issue: Redundant causal construction
    rationale: The main text has both 'n’ihi na' and 'n’ihi ihe ndị a ka' for the single Greek expression διὰ ταῦτα. Removing the first produces a more idiomatic and equally precise rendering.
  - severity: medium
    issue: Footnote gives an unnatural and potentially misleading literal form
    rationale: '''Ụmụ nke nnupụisi'' is not idiomatic Standard Igbo and may suggest a literal familial relationship. The note should instead explain that ''ụmụ nnupụisi'' is an idiom for people marked by disobedience.'
  revised_text: Ka onye ọ bụla ghara iji okwu efu duhie unu, n’ihi ihe ndị a ka ọnụma Chineke ji abịakwasị ụmụ nnupụisi.[a]
  revised_footnotes:
