revisions:
- from: Ma otu ọ dị, unu onwe unu kwa—onye ọ bụla n’otu n’otu—ka ọ hụ nwunye nke ya n’anya dị ka onwe ya; nwunye ahụ kwa, ka ọ na-atụ di ya egwu[a].
  to: Otú ọ dị, unu kwa, onye ọ bụla n’otu n’otu, ka ọ hụ nwunye nke ya n’anya dịka onwe ya; nwunye ahụ kwa, ka ọ tụọ di ya egwu[a].
  rationale: 'The revision makes only safe idiomatic adjustments: ‘Otú ọ dị’ gives a natural concluding transition for πλὴν; the distributive phrase is syntactically attached more directly to the singular exhortation; and ‘ka ọ tụọ’ expresses the intended exhortative force without an unnecessary progressive nuance. The rendering ‘ịtụ egwu’ and its clarifying note preserve the Greek term’s lexical ambiguity and contextual reverential sense.'
