  text: πλὴν καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος τὴν ἑαυτοῦ γυναῖκα οὕτως ἀγαπάτω ὡς ἑαυτόν, ἡ δὲ γυνὴ ἵνα φοβῆται τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/033.yaml
  text: Nevertheless[a], you also—each one individually—must love his own wife as himself[b], and the wife must fear her husband.
translation:
  language: ig
  text: Otú ọ dị, unu kwa, onye ọ bụla n’otu n’otu, ka ọ hụ nwunye nke ya n’anya dịka onwe ya; nwunye ahụ kwa, ka ọ tụọ di ya egwu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ọ sọpụrụ di ya.” N’ebe a, “ịtụ egwu” na-ebu echiche nke ịkwanyere mmadụ ùgwù na nsọpụrụ miri emi, ọ bụghị nanị ịtụ ụjọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ma otu ọ dị
  rationale: Na-egosi ntụgharị okwu nke na-achịkọta ma na-emechi ihe a kọwara n’amaokwu ndị bu ụzọ.
- source_word: καὶ ὑμεῖς
  choice: unu onwe unu kwa
  rationale: Na-echekwa nkwusi ike na ndị a na-agwa okwu sokwa n’iwu a.
- source_word: οἱ καθ’ ἕνα ἕκαστος
  choice: onye ọ bụla n’otu n’otu
  rationale: 'Na-egosipụta ike nkesa nke okwu Grik: iwu a metụtara di ọ bụla n’onwe ya.'
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: nwunye nke ya
  rationale: γυνή pụtara ‘nwunye’ n’ọnọdụ alụmdi na nwunye a, ebe ἑαυτοῦ na-eme ka ‘nke ya’ pụta ìhè.
- source_word: οὕτως ἀγαπάτω
  choice: ka ọ hụ ... n’anya
  rationale: Ụdị a na-enye iwu n’Igbo n’ụzọ doro anya; njikọ ya na ‘dị ka onwe ya’ na-eburu ntụaka οὕτως gaa n’ụzọ e kwuru n’elu.
- source_word: ὡς ἑαυτόν
  choice: dị ka onwe ya
  rationale: Na-echekwa ntụnyere kpọmkwem nke ederede Grik.
- source_word: ἡ δὲ γυνὴ
  choice: nwunye ahụ kwa
  rationale: Na-amalite akụkụ nke abụọ nke nchịkọta ahụ ma na-edobe γυνή dị ka ‘nwunye.’
- source_word: ἵνα φοβῆται
  choice: ka ọ na-atụ ... egwu
  rationale: Na-echekwa okwu bụ isi nke φοβέομαι, ‘ịtụ egwu,’ ma ihe ndị gbara ya gburugburu na-egosi egwu nwere nsọpụrụ; a kọwara nke a n’okpuru amaokwu.
- source_word: τὸν ἄνδρα
  choice: di ya
  rationale: ἀνήρ pụtara ‘di’ n’ọnọdụ a, Igbo nkịtị na-achọkwa nnọchiaha ‘ya.’
theological_decisions:
- issue: Otú e si asụgharị φοβῆται n’iwu e nyere nwunye
  choice: ka ọ na-atụ di ya egwu
  alternative: ka ọ na-asọpụrụ di ya
  rationale: A hapụrụ ‘egwu’ ka o chekwaa obosara na esemokwu dị n’okwu Grik, nke nwere ike ịpụta egwu ma ọ bụ nsọpụrụ miri emi. Ihe e dere n’okpuru amaokwu na-egosi na n’ebe a ọ bụghị ụjọ nkịtị ka a na-ekwu, n’enweghị ihichapụ okwu mbụ.
- issue: Nkọwa nwoke na nwanyị n’iwu alụmdi na nwunye
  choice: nwunye nke ya ... nwunye ahụ ... di ya
  alternative: di na nwunye n’ozuzu
  rationale: Ederede Grik jiri ụdị okwu nwoke na nwanyị kpọmkwem maka di na nwunye; ntụgharị ahụ na-echekwa nkọwa ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘onye ọ bụla n’otu n’otu’ chekwaa nkwusi ike nkesa, ma jiri okwu ‘ịtụ egwu’ na nkọwa ala peeji chekwaa ma izi ezi nke mkpụrụokwu ma ihe ọ pụtara n’ọnọdụ alụmdi na nwunye.
