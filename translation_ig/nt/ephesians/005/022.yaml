  text: Wives[a], to your own husbands as to the Lord,
translation:
  language: ig
  text: Unu ndị nwunye[a], nye ndị di unu kpọmkwem, dịka nye Onyenwe anyị,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ọtụtụ nsụgharị na-atụkwasị “na-edobe onwe unu n’okpuru” site n’amaokwu 21: “Unu ndị nwunye, na-edobe onwe unu n’okpuru ndị di unu kpọmkwem, dịka unu na-edobe onwe unu n’okpuru Onyenwe anyị.” Ma amaokwu 22 n’onwe ya enweghị ngwaa a n’asụsụ Grik; ọ dabere n’okwu bu ya ụzọ.'
    reason: alternative_reading
lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: Unu ndị nwunye
  rationale: N’ọnọdụ ntụziaka gbasara ezinụlọ a, γυναῖκες pụtara ndị nwunye, ọ bụghị ụmụ nwanyị n’ozuzu. “Unu” na-eme ka okwu a a na-agwa ha doo anya n’Igbo.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: nye di nke unu n’onwe unu
  rationale: ἀνδράσιν pụtara “di” n’ebe a, ebe ἰδίοις na-egosi di nke onye ọ bụla n’ime ha. E debere echiche nke “nke unu onwe unu” dị n’asụsụ Grik.
- source_word: ὡς
  choice: dịka
  rationale: “Dịka” na-egosipụta ntụnyere ahụ n’enweghị ịkọwa karịa ihe Grik kwuru.
- source_word: τῷ κυρίῳ
  choice: nye Onyenwe anyị
  rationale: κύριος n’ebe a na-ezo aka n’Onyenwe anyị Jizọs; “Onyenwe anyị” bụ nsụgharị Igbo doro anya ma dị ùgwù.
- source_word: implicit verb from context
  choice: ahapụrụ ngwaa ahụ n’ekwughị ya
  rationale: Amaokwu Grik a enweghị ngwaa nke ya; ọ dabere na ὑποτασσόμενοι (“na-edo onwe ha n’okpuru”) nke amaokwu 21. Ahịrịokwu Igbo ahụ na-edebe oghere a, ebe ndetu ala na-akọwa ngwaa a ghọtara.
theological_decisions:
- issue: Ma a ga-etinye “na-edo onwe unu n’okpuru” n’ahịrịokwu bụ isi n’agbanyeghị na ọ dịghị n’ihe odide Grik nke amaokwu 22
  choice: E tinyeghị ngwaa ahụ n’ahịrịokwu bụ isi; e debere usoro okwu ezughị ezu nke Grik ma kọwaa ya na ndetu ala.
  alternative: Unu ndị nwunye, na-edo onwe unu n’okpuru di nke unu n’onwe unu dịka n’okpuru Onyenwe anyị.
  rationale: Ihe odide Grik nke amaokwu 22 na-enweta ngwaa ya site n’amaokwu 21. Itinye ngwaa ahụ ga-eme ka Igbo dị mfe karị, ma ọ ga-etinye n’amaokwu a okwu na-adịghị na ya kpọmkwem. Ndetu ala na-echekwa nghọta ya n’enweghị ikpochapụ njikọ ahụ na amaokwu gara aga.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A kpachapụrụ anya debe ahịrịokwu ahụ dịka nkebi na-adabere n’amaokwu 21, kama ime ka ọ bụrụ iwu zuru ezu site n’itinye ngwaa na-adịghị n’amaokwu Grik a.
