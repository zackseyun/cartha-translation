review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the ellipsis of the Greek text and rightly understands γυναῖκες and ἀνδράσιν in their marital sense. However, the singular “di” fails to reflect the plural ἀνδράσιν, and “n’onwe unu” naturally modifies the wives (“you yourselves”), not the husbands; it therefore does not accurately convey ἰδίοις (“own”).
  naturalness: The retained elliptical form is necessarily fragmentary, as in Greek, but can be expressed more naturally in Standard Igbo. “Ndị di unu kpọmkwem” clearly directs the wives to their respective husbands without the misleading reflexive phrase.
  terminology: “Ndị nwunye,” “ndị di,” and “Onyenwe anyị” are appropriate, dignified Standard Igbo renderings. “Dịka nye Onyenwe anyị” preserves the comparative dative structure without supplying the omitted verb.
  issues:
  - severity: high
    issue: “di” is singular although ἀνδράσιν is plural.
    rationale: The address is to plural wives and the Greek has plural “husbands”; Standard Igbo should read “ndị di.”
  - severity: high
    issue: “n’onwe unu” is attached to the wrong referent.
    rationale: In Igbo, this phrase means “you yourselves” and can suggest that the wives themselves are the object or emphasis. The Greek ἰδίοις qualifies “husbands,” indicating their respective/own husbands.
  - severity: medium
    issue: The supplied-reading quotation in the footnote uses “dịka n’okpuru Onyenwe anyị,” which does not naturally express the Greek comparison.
    rationale: The comparison is submission to husbands “as to the Lord,” not literally “as under the Lord.” Recasting it with an explicit parallel clause is clearer and faithful.
  revised_text: Unu ndị nwunye[a], nye ndị di unu kpọmkwem, dịka nye Onyenwe anyị,
  revised_footnotes:
  - marker: a
    text: 'Ọtụtụ nsụgharị na-atụkwasị “na-edobe onwe unu n’okpuru” site n’amaokwu 21: “Unu ndị nwunye, na-edobe onwe unu n’okpuru ndị di unu kpọmkwem, dịka unu na-edobe onwe unu n’okpuru Onyenwe anyị.” Ma amaokwu 22 n’onwe ya enweghị ngwaa a n’asụsụ Grik; ọ dabere n’okwu bu ya ụzọ.'
    reason: alternative_reading
  revision_rationale: The revision retains the source text’s deliberate ellipsis and its connection with verse 21, while correcting the plural “husbands” and expressing ἰδίοις without an Igbo reflexive that wrongly points back to the wives. The footnote continues to identify the supplied verb as contextual rather than explicit in verse 22.
