lexical_decisions:
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara okwu bu ụzọ; “n’ihi na” na-egosipụta njikọ ahụ n’Igbo doro anya.
- source_word: μέλη
  choice: akụkụ
  rationale: N’ebe a, okwu a pụtara akụkụ ndị mejupụtara otu ahụ. “Akụkụ” bụ okwu Igbo nkịtị nke na-echekwa ihe atụ Pọl banyere ndị kwere ekwe dịka akụkụ ahụ Kraịst, n’enweghị ịkọwa ya naanị dịka aka na ụkwụ.
- source_word: ἐσμὲν
  choice: anyị bụ
  rationale: Nke a na-asụgharị ngwaa nọ n’oge ugbu a n’ụzọ kwụ ọtọ ma dịrị Igbo mma.
- source_word: σώματος
  choice: ahụ
  rationale: “Ahụ” bụ nsụgharị kpọmkwem ma dịkwa eke maka ihe atụ banyere ahụ Kraịst n’akụkụ akwụkwọ ozi a.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnochiaha a na-ezo aka na Kraịst n’okwu gbara ya gburugburu; “ya” na-echekwa ntụaka onwe ahụ n’Igbo.
theological_decisions:
- issue: Ma a ga-etinye ọgụgụ dị ogologo, “n’anụ ahụ ya na n’ọkpụkpụ ya”
  choice: 'A sụgharịrị naanị ihe dị na SBLGNT: “n’ihi na anyị bụ akụkụ ahụ ya.”'
  alternative: n’ihi na anyị bụ akụkụ ahụ ya, n’anụ ahụ ya na n’ọkpụkpụ ya
  rationale: Isi mmalite enyere nwere ọgụgụ dị mkpụmkpụ. Ụfọdụ ihe odide nwere mgbakwunye yiri okwu Jenesis 2:23; e debere ya n’ala peeji kama itinye ya n’ahịrị bụ isi, ka ọdịiche dị n’ihe odide pụta ìhè n’enweghị idozi esemokwu ahụ n’ụzọ nzuzo.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị mfe nghọta ma nwee ugwu. E ji “akụkụ ahụ ya” chekwaa ihe atụ ahụ na echiche nke ịdị n’otu, n’ejighị asụsụ ụka pụrụ iche.
