revisions:
- from: Ma ka a gharadị ịkpọ omume mmekọahụ rụrụ arụ, adịghị ọcha ọ bụla, ma ọ bụ anyaukwu[b] aha n’etiti unu[a], dịka o kwesịrị ndị nsọ[c].
  to: Ma ka a ghara ọbụna ịkpọ omume mmekọahụ rụrụ arụ, adịghị ọcha ọ bụla, ma ọ bụ anyaukwu[b] aha n’etiti unu[a], dịka o kwesịrị ndị nsọ[c].
  rationale: The revision makes the force of μηδὲ explicit with the idiomatic phrase “ghara ọbụna,” while retaining the passive/generalizing form “ka a ghara ịkpọ ... aha.” It also improves the lexical alternative for πλεονεξία so that it does not narrow the Greek term. No theological or interpretive expansion has been introduced.
