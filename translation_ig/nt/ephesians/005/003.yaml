review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the three vices, the communal force of ἐν ὑμῖν, and the ethical standard appropriate to ἁγίοις. Its rendering of πλεονεξία as “anyaukwu” properly retains the broader sense of greed. The expression “ka a gharadị ịkpọ ... aha” aims to represent μηδὲ ὀνομαζέσθω, but “ghara ọbụna” is clearer and more idiomatic Standard Igbo for the emphatic prohibition.
  naturalness: The sentence is generally natural, but “ka a ghara ọbụna ịkpọ ... aha” is smoother than “ka a gharadị ịkpọ ... aha.” Keeping “aha” after the coordinated list preserves the idiomatic Igbo construction ‘ịkpọ aha.’
  terminology: “Omume mmekọahụ rụrụ arụ,” “adịghị ọcha ọ bụla,” “anyaukwu,” and “ndị nsọ” are appropriate modern Standard Igbo equivalents. The alternative note for anyaukwu is adjusted because “ọchịchọ ihe onye ọzọ” can suggest the narrower idea of coveting another person’s possessions, whereas πλεονεξία is broader.
  issues:
  - severity: low
    issue: The emphatic prohibition is expressed with “gharadị.”
    rationale: Although understandable, “ghara ọbụna” is the clearer and more natural way to convey μηδέ (‘not even’) in this sentence.
  - severity: low
    issue: The footnote alternative for “anyaukwu” is too narrow.
    rationale: “Ọchịchọ ihe onye ọzọ” may be heard specifically as desiring what belongs to another; “ọchịchọ inwetakwu ihe” better preserves the broad acquisitive sense of πλεονεξία.
  revised_text: Ma ka a ghara ọbụna ịkpọ omume mmekọahụ rụrụ arụ, adịghị ọcha ọ bụla, ma ọ bụ anyaukwu[b] aha n’etiti unu[a], dịka o kwesịrị ndị nsọ[c].
  revised_footnotes:
