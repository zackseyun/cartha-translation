source:
  edition: SBLGNT
  text: Πορνεία δὲ καὶ ⸂ἀκαθαρσία πᾶσα⸃ ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/003.yaml
  text: But sexual immorality and every impurity or greed must not even be named among you[a], as is proper for saints[c][b],
translation:
  language: ig
  text: Ma ka a ghara ọbụna ịkpọ omume mmekọahụ rụrụ arụ, adịghị ọcha ọ bụla, ma ọ bụ anyaukwu[b] aha n’etiti unu[a], dịka o kwesịrị ndị nsọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ekwudịla okwu banyere ihe ndị a n’etiti unu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọchịchọ inwetakwu ihe.”
    reason: lexical_alternative
  - marker: c
    text: “Ndị nsọ” n’ebe a pụtara ndị kwere ekwe dịka ndị dị nsọ nke Chineke, ọ bụghị naanị otu ìgwè ndị e mechara nye ọkwa ndị nsọ.
    reason: cultural_note
lexical_decisions:
- source_word: Πορνεία
  choice: omume mmekọahụ rụrụ arụ
  rationale: Okwu a na-ezo aka n’omume mmekọahụ niile megidere ụkpụrụ Chineke, ọ bụghị naanị otu ụdị mmehie mmekọahụ; nsụgharị a sara mbara ma doo onye Igbo nke oge a anya.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntughari nwere obere ọdịiche site n’ihe e kwuru n’amaokwu bu ụzọ.
- source_word: ἀκαθαρσία πᾶσα
  choice: adịghị ọcha ọ bụla
  rationale: Nke a na-edobe ịdị obosara nke πᾶσα ma ghara ịkpa oke okwu ahụ naanị n’otu ụdị adịghị ọcha.
- source_word: ἢ
  choice: ma ọ bụ
  rationale: Ọ na-edobe njikọ nkewa doro anya nke dị n’asụsụ Grik.
- source_word: πλεονεξία
  choice: anyaukwu
  rationale: Anyaukwu bụ okwu Igbo a na-aghọta nke ọma maka ọchịchọ ijide ma ọ bụ inwetakwu ihe; a naghị akpa ya oke ka ọ bụrụ naanị agụụ mmekọahụ.
- source_word: μηδὲ ὀνομαζέσθω
  choice: ka a gharadị ịkpọ ... aha
  rationale: Ụdị a na-egosi iwu siri ike, ebe -dị na-edobe nkwusi ike nke μηδέ, ‘ọbụnadị’.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: Ọ na-egosi ọgbakọ ndị a na-agwa okwu, ọ bụghị naanị ihe dị n’ime obi otu onye.
- source_word: καθὼς πρέπει
  choice: dịka o kwesịrị
  rationale: Nke a bụ okwu Igbo dị ugbu a nke na-egosi ihe dabara adaba n’omume.
- source_word: ἁγίοις
  choice: ndị nsọ
  rationale: Ọ na-edobe aha Pọl ji akpọ ndị kwere ekwe dịka ndị Chineke kewapụrụ nye onwe ya; nkọwa ala peeji na-egbochi nghọta ya dịka naanị ndị e mechara nye ọkwa pụrụ iche.
theological_decisions:
- issue: Ihe πλεονεξία pụtara n’usoro mmehie nke gụnyere mmehie mmekọahụ
  choice: A sụgharịrị ya ‘anyaukwu’ n’ụzọ sara mbara.
  alternative: Ọchịchọ ihe onye ọzọ; anyaukwu mmekọahụ
  rationale: Ọ bụ ezie na gburugburu amaokwu a metụtara omume mmekọahụ, okwu Grik ahụ n’onwe ya sara mbara karịa agụụ mmekọahụ, ya mere e kwesịghị ime ka ihe ọ pụtara dị warara n’enweghị ihe akaebe doro anya.
- issue: Ndị ἁγίοις na-ezo aka na ha
  choice: ‘Ndị nsọ’ bụ ndị niile kwere ekwe dịka ndị Chineke doro nsọ.
  alternative: Ndị dị nsọ; ndị nsọ Chineke
  rationale: N’akwụkwọ Pọl, okwu a na-akọwa obodo ndị kwere ekwe dịka ndị e kewapụrụ nye Chineke, ọ bụghị otu òtù ndị e mechara kwupụta dịka ndị nsọ pụrụ iche.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro na nkwusi ike nke Grik, ma akara ala peeji [a] na-echekwa nghọta abụọ nwere ike ịdị na ‘ịkpọ aha’—ma ọ bụ ikwu okwu banyere ya, ma ọ bụ ka omume ndị ahụ ghara ịdị n’etiti ọgbakọ.
