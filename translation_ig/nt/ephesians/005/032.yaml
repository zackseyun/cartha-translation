  text: τὸ μυστήριον τοῦτο μέγα ἐστίν, ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/032.yaml
  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: ig
  text: Ihe omimi a dị ukwuu,[a] ma ana m ekwu banyere Mesaịa[b] na ọgbakọ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Ihe omimi a dị oké mkpa.” Okwu Grik pụtara n’ụzọ nkịtị “dị ukwuu,” nke nwere ike igosi ịdị ukwuu ma ọ bụ ịdị mkpa, ọ bụghị naanị ịdị omimi.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ “Kraịst.” A sụgharịrị ya “Mesaịa” n’ebe a n’ihi na Χριστός na-arụ ọrụ dịka utu aha.
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: ihe omimi
  rationale: N’akwụkwọ Pọl, okwu a na-ezo aka n’eziokwu Chineke nke e zoro na mbụ ma kpughee ugbu a; “ihe omimi” na-edebe echiche ahụ n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: μέγα
  choice: dị ukwuu
  rationale: Nke a bụ ntụgharị kwụ ọtọ nke μέγα, ọ pụkwara ịpụta ịdị ukwuu ma ọ bụ ịdị oké mkpa, ọ bụghị naanị ịdị omimi.
- source_word: δὲ
  choice: ma
  rationale: “Ma” na-egosi obere mgbanwe ma ọ bụ ọdịiche dị n’etiti nkwupụta banyere ihe omimi ahụ na nkọwa Pọl nyere.
- source_word: λέγω
  choice: ana m ekwu
  rationale: Ụdị okwu a na-egosi ihe onye na-ekwu na-eme ugbu a; “ana m ekwu” bụ ụzọ Igbo si kwuo ya nke ọma.
- source_word: εἰς
  choice: banyere
  rationale: N’ebe a εἰς anaghị egosi ije banye n’ime ihe, kama ọ na-egosi ihe okwu ahụ na-ezo aka na ya; “banyere” na-enye nghọta ahụ n’Igbo nkịtị.
- source_word: Χριστόν
  choice: Mesaịa
  rationale: Χριστός na-arụ ọrụ dị ka utu aha n’ebe a; “Mesaịa” na-egosipụta nke ahụ kama ime ya naanị aha mmadụ.
- source_word: ἐκκλησίαν
  choice: ọgbakọ ahụ
  rationale: N’ebe a okwu ahụ na-ezo aka n’otu ndị Chineke dịka obodo jikọrọ ọnụ. “Ọgbakọ ahụ” na-ezere echiche na ọ bụ ụlọ ụka ma ọ bụ naanị nzukọ e mere otu ugboro.
theological_decisions:
- issue: Ihe “ihe omimi a” na-ezo aka na ya
  choice: E kwughị kpọmkwem ma ọ bụ alụmdi na nwunye, Jenesis 2:24, ma ọ bụ mmekọrịta ihe atụ dị n’etiti Mesaịa na ọgbakọ ahụ.
  alternative: A pụrụ ịkọwa ya kpọmkwem dịka njikọta di na nwunye ịbụ otu anụ ahụ, dịka okwu Jenesis 2:24, ma ọ bụ dịka alụmdi na nwunye nke na-atụ aka na Mesaịa na ọgbakọ ahụ.
  rationale: Asụsụ Grik na-ekwu naanị na ihe omimi a dị ukwuu, ma mesịa kwuo na okwu Pọl bụ banyere Mesaịa na ọgbakọ ahụ. Ya mere, ntụgharị ahụ na-edebe ohere nkọwa ndị ahụ kama idozi esemokwu ahụ n’otu ụzọ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. “Ọgbakọ ahụ” na-egosi ndị kwere ekwe dịka otu obodo, ọ bụghị ụlọ; ahịrịokwu ahụ anaghị edozi kpọmkwem ihe “ihe omimi a” bụ.
