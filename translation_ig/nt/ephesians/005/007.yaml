review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders the inferential οὖν (''Ya mere''), the prohibitive present imperative (''unu aghọkwala''), and the relational sense of συμμέτοχοι αὐτῶν without inserting ''ọrụ'' or ''omume'' into the main text. However, ''ndị ha na ha na-ekekọrịta òkè'' is structurally and semantically awkward: the doubled ''ha'' can make the intended relationship unclear and does not naturally express ''co-participants with them.'''
  naturalness: Replace the cumbersome and unclear nominal phrase with 'ndị na-esonyere ha eketa òkè,' a clear Standard Igbo expression for persons who join others in sharing/participating, while retaining the source's unspecified object of participation.
  terminology: '''Aghọkwala'' appropriately retains the becoming sense of γίνεσθε. ''Eket(a) òkè'' is a natural, suitably general rendering of συμμετοχή and does not impose a doctrinal interpretation. The footnote retains ''N''ihi ya'' as a legitimate alternative for οὖν and labels its contextual explanation as implication rather than wording in the Greek.'
  issues:
