    issue: The phrase 'ndị ha na ha na-ekekọrịta òkè' is malformed/unclear in Standard Igbo.
    rationale: It repeats 'ha' in a way that obscures who is participating with whom. The Greek means not to become people who participate together with 'them'; 'ndị na-esonyere ha eketa òkè' conveys this clearly.
  - severity: low
    issue: The footnote's explanation is phrased too categorically.
    rationale: The Greek does not explicitly name sinful conduct or consequences. These are contextual implications, so the note should state this as contextual sense rather than as the direct meaning of the following words.
