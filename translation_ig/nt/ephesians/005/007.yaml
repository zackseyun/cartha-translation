  text: μὴ οὖν γίνεσθε συμμέτοχοι αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/007.yaml
  text: Therefore[a], do not become partners with them.
translation:
  language: ig
  text: Ya mere[a], unu aghọkwala ndị na-esonyere ha eketa òkè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “N'ihi ya.” N'amaokwu ndị gbara ya gburugburu, okwu a na-atụ aka n'iso ha keta òkè n'omume mmehie ha ma ọ bụ n'ihe ga-esi na ya pụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: -kwala
  rationale: 'N''Igbo, njikọ nganiihu na nkwụnye okwu a na ngwaa na-enye iwu mgbochi n''ụzọ ebumpụta ụwa: “unu aghọkwala.”'
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n'ịdọ aka ná ntị dị n'amaokwu ndị bu ụzọ (amaokwu 3–6).
- source_word: γίνεσθε
  choice: unu aghọkwala
  rationale: “Ịghọ” na-echekwa echiche nke ịbanye n'ọnọdụ ma ọ bụ ịghọ ụdị mmadụ a, kama nanị ịnọ n'ọnọdụ ahụ.
- source_word: συμμέτοχοι
  choice: ndị ha na ha na-ekekọrịta òkè
  rationale: Nkebi okwu a na-egosi ndị ha na ndị ọzọ na-eso eketa ma ọ bụ na-ekere òkè n'ihe; ọ bụ okwu Igbo doro anya ma ghara ịkọwa ihe a na-ekere òkè na ya karịa ihe Grik kwuru.
- source_word: αὐτῶν
  choice: ha na ha
  rationale: Nnọchiaha a na-ezo aka n'“ha,” ya bụ ndị a kpọtụrụ aha n'amaokwu bu ụzọ; nhazi Igbo a na-egosi iso ha na-ekekọrịta òkè n'enweghị ịgbakwụnye “ọrụ ha” n'ahịrị bụ isi.
theological_decisions:
- issue: Ihe συμμέτοχοι αὐτῶν pụtara na a na-ekere òkè na ya
  choice: E debere ntụaka ahụ n'ebe ndị mmadụ nọ—“ndị ha na ha na-ekekọrịta òkè”—n'ekwughị kpọmkwem ihe a na-ekere òkè na ya.
  alternative: “Unu esokwala ha na-eme ihe ndị ahụ” ma ọ bụ “unu ekekọrịtala òkè n'ọrụ ha.”
  rationale: Grik kwuru αὐτῶν (“ha”), ọ bụghị “ihe ndị ahụ” ma ọ bụ “ọrụ ha.” Ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ iso ha na omume mmehie ha ma ọ bụ ihe ga-esi na ya pụta, ma nsụgharị ahụ kwesịrị ịhapụ obosara okwu mbụ ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “na-ekekọrịta òkè” mee ka echiche nke iso ndị ọzọ kerịta ihe pụta ìhè, ebe a na-echekwa enweghị nkọwa kpọmkwem banyere ihe a na-ekere òkè na ya.
