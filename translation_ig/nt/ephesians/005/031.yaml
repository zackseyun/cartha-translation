  text: ἀντὶ τούτου καταλείψει ἄνθρωπος ⸀τὸν ⸀πατέρα καὶ ⸀τὴν μητέρα καὶ προσκολληθήσεται ⸂τῇ γυναικὶ⸃ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: ig
  text: Ọ bụ n’ihi nke a[a] ka nwoke ga-eji hapụ nna ya na nne ya, rapara n’ahụ nwunye ya, ha abụọ ga-aghọkwa otu anụ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “N’ihi nke a.” Okwu Grik ahụ na-arụ ọrụ ebe a dị ka njikọ na-egosi ihe kpatara ihe n’okwu e hotara na Jenesis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: Ọ bụ n’ihi nke a ka
  rationale: N’ebe a, okwu ahụ na-egosi ihe kpatara ihe ga-esochi ya, ọ bụghị nnọchi ihe ọzọ. Usoro a bụ Igbo dị ire ma na-eme ka njikọ nke ihe kpatara ihe pụta ìhè.
- source_word: καταλείψει
  choice: ga-eji hapụ
  rationale: ‘Hapụ’ na-egosi ịhapụ ụlọ nne na nna iji malite njikọ alụmdi na nwunye, n’etinyeghị echiche nke ịgbahapụ ha n’enweghịzi ịhụnanya ma ọ bụ nlekọta.
- source_word: ἄνθρωπος
  choice: nwoke
  rationale: Ọ bụ ezie na okwu Grik a pụrụ ịpụta mmadụ n’ozuzu, ebe a ọ na-ekwu banyere nwoke ahụ e jikọtara ya na ‘nwunye ya.’
- source_word: πατέρα καὶ τὴν μητέρα
  choice: nna ya na nne ya
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu aha nne na nna ma na-edobe ihe okwu Grik pụtara.
- source_word: προσκολληθήσεται
  choice: rapara n’ahụ
  rationale: Okwu a na-egosi njikọ siri ike na nke na-adịgide adịgide. ‘Rapara n’ahụ’ bụ okwu Igbo doro anya nke na-echekwa ike dị n’oyiyi ahụ.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: nwunye ya
  rationale: Ọnọdụ alụmdi na nwunye na-egosi na γυνή pụtara nwunye ebe a, ọ bụghị naanị nwanyị.
- source_word: ἔσονται οἱ δύο
  choice: ha abụọ ga-aghọkwa
  rationale: Ọ bụ ezie na ngwaa Grik pụtara ‘ga-abụ,’ ‘ga-aghọ’ na-egosi n’Igbo n’ụzọ ebumpụta ụwa njikọ nke ga-esi na ya pụta; ‘ha abụọ’ na-echekwa οἱ δύο.
- source_word: εἰς σάρκα μίαν
  choice: otu anụ ahụ
  rationale: Nke a na-echekwa okwu na oyiyi Akwụkwọ Nsọ banyere njikọ alụmdi na nwunye, kama ịkọwa ya naanị dị ka ‘otu ahụ.’
theological_decisions:
- issue: Asụsụ na-egosi nwoke na nwanyị n’okwu alụmdi na nwunye a
  choice: nwoke … nwunye ya
  alternative: mmadụ … di ma ọ bụ nwunye ya
  rationale: Ihe odide ahụ kwuru kpọmkwem banyere nwoke na nwunye ya n’ihota Jenesis 2:24; ntụgharị ahụ anaghị eme ka njirimara nwoke na nwanyị dị n’isi mmalite ghara ịpụta.
- issue: Ntụgharị σάρξ n’okwu εἰς σάρκα μίαν
  choice: otu anụ ahụ
  alternative: otu ahụ
  rationale: σάρξ ebe a bụ okwu Jenesis banyere njikọ alụmdi na nwunye, ọ bụghị ihe atụ nke ọdịdị mmehie. ‘Anụ ahụ’ na-edobe oyiyi na esemokwu nkọwa dị n’okwu mbụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ‘Ọ bụ n’ihi nke a ka … ga-eji’ bụ usoro Igbo ebumpụta ụwa; ‘rapara n’ahụ’ na ‘otu anụ ahụ’ na-echekwa oyiyi siri ike nke okwu Grik na nkwughachi Jenesis.
