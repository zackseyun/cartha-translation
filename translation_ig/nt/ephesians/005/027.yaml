revisions:
- from: ka ya onwe ya wee weta ụka ahụ n’ihu onwe ya n’ebube[a], nke na-enweghị ntụpọ ma ọ bụ ahịrị ndọkpụ, ma ọ bụ ihe ọ bụla yiri ha[b], kama ka ọ dị nsọ, na-enweghịkwa ihe a ga-eji taa ya ụta[c].
  to: ka ya onwe ya wee weta ụka ahụ n’ihu onwe ya n’ebube[a], nke na-enweghị ntụpọ ma ọ bụ ndọlị, ma ọ bụ ihe ọ bụla dị otú ahụ[b], kama ka ọ dị nsọ, na-enweghịkwa ntụpọ ọ bụla[c].
  rationale: The revision replaces the non-idiomatic wrinkle expression, smooths the inclusive comparison, and renders ἄμωμος with a direct Igbo blemish-free expression. This necessarily repeats “ntụpọ,” as the Greek itself employs two distinct but overlapping purity terms (σπίλος and ἄμωμος); the note preserves the moral-forensic alternative.
  reviewer_model: gpt-5.6-terra
