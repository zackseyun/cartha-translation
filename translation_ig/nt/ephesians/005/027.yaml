language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα παραστήσῃ ⸀αὐτὸς ἑαυτῷ ἔνδοξον τὴν ἐκκλησίαν, μὴ ἔχουσαν σπίλον ἢ ῥυτίδα ἤ τι τῶν τοιούτων, ἀλλ’ ἵνα ᾖ ἁγία καὶ ἄμωμος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/027.yaml
  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: ig
  text: ka ya onwe ya wee weta ụka ahụ n’ihu onwe ya n’ebube[a], nke na-enweghị ntụpọ ma ọ bụ ndọlị, ma ọ bụ ihe ọ bụla dị otú ahụ[b], kama ka ọ dị nsọ, na-enweghịkwa ntụpọ ọ bụla[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “dị ebube”: nkọwa Grik ahụ nwere ike ịkọwa àgwà ya (“dị ebube”) ma ọ bụ ọnọdụ ọ nọ na ya (“n’ebube”).'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ma ọ bụ ụdị ihe ọ bụla dị otu ahụ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “na-enweghị ihe a ga-eji taa ya ụta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραστήσῃ
  choice: wee weta ... n’ihu
  rationale: Nke a na-egosipụta ime ka onye ma ọ bụ ihe bịa guzo n’ihu onye ọzọ, ma na-edobekwa ihe atụ nke ịkpọta nwunye n’ihu di ya.
- source_word: αὐτὸς ἑαυτῷ
  choice: ya onwe ya ... n’ihu onwe ya
  rationale: E tinyere nkwusi ike dị na αὐτός na nkwughachi onwe dị na ἑαυτῷ n’enweghị iwepụ mgbagwoju echiche dị n’okwu Grik.
- source_word: ἔνδοξον
  choice: n’ebube
  rationale: Ọ na-akọwa ọnọdụ ụka mgbe a na-eweta ya; ‘n’ebube’ bụ Igbo doro anya ma na-edobe echiche nke ịdị ebube.
- source_word: ἐκκλησίαν
  choice: ụka ahụ
  rationale: N’ebe a ọ na-ezo aka n’ọgbakọ ndị nke Kraịst n’ozuzu, ọ bụghị naanị nzukọ e nwere n’otu ebe.
- source_word: σπίλον
  choice: ntụpọ
  rationale: ‘Ntụpọ’ na-edobe ihe atụ anya pụrụ ịhụ nke ihe na-emebi ịdị ọcha.
- source_word: ῥυτίδα
  choice: ahịrị ndọkpụ
  rationale: Nke a bụ okwu Igbo a na-aghọta maka ahịrị ndị na-apụta n’akpụkpọ ahụ mgbe ọ kpọkọtara, ya bụ wrinkle.
- source_word: ἤ τι τῶν τοιούτων
  choice: ma ọ bụ ihe ọ bụla yiri ha
  rationale: Ọ na-eme ka ihe atụ abụọ ahụ gbasaa ruo n’ihe ndị ọzọ niile yiri ha.
- source_word: ἁγία
  choice: dị nsọ
  rationale: ‘Nsọ’ bụ okwu Igbo e ji akọwa ihe e doro nye Chineke ma dị ọcha.
- source_word: ἄμωμος
  choice: na-enweghịkwa ihe a ga-eji taa ya ụta
  rationale: Nke a na-egosipụta enweghị ntụpọ ma ọ bụ ihe kwesịrị ịta ụta, ma zere ikwughachi ‘ntụpọ’ n’ahịrịokwu ahụ.
theological_decisions:
- issue: Kraịst iweta ụka n’ihu onwe ya
  choice: E debere ‘ya onwe ya ... n’ihu onwe ya.’
  alternative: Ime ka ọ dị mfe dịka ‘ka o wee weta ụka ahụ’ ma ọ bụ ịkọwa ya dịka iweta ụka n’ihu Chineke.
  rationale: Grik nwere ma nkwusi ike αὐτός ma okwu nkwughachi onwe ἑαυτῷ. Nsụgharị ahụ na-edobe ha n’ebughị ụzọ kpebie ihe omimi nkà mmụta okpukpe dị n’ihe atụ ahụ.
- issue: Ihe atụ nke ịdị ọcha nke ụka
  choice: E jikọtara ‘ntụpọ,’ ‘ahịrị ndọkpụ,’ ‘nsọ,’ na ‘enweghị ihe a ga-eji taa ya ụta.’
  alternative: Iji naanị okwu gbasara mmehie ma ọ bụ naanị okwu gbasara mma nke nwunye.
  rationale: Amaokwu ahụ na-ejikọta ihe atụ a na-ahụ anya nke mma na ịdị ọcha na okwu gbasara ịdị nsọ; nsụgharị ahụ na-edobe akụkụ abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ụka ahụ’ na-anọchi ndị nke Kraịst n’ozuzu, ọ bụghị ụlọ ụka. ‘Ahịrị ndọkpụ’ na-eme ka ihe atụ wrinkle doo anya n’enweghị asụsụ Igbo ochie.
