  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εὐχαριστοῦντες πάντοτε ὑπὲρ πάντων ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῷ θεῷ καὶ πατρί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/020.yaml
  text: always giving thanks for everything to God the Father in the name of our Lord Jesus the Messiah[b][a],
translation:
  language: ig
  text: na-ekele Chineke bụ Nna mgbe niile n’ihi ihe niile[b], n’aha Onyenwe anyị Jizọs bụ Mezaịa[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka e si asụgharị ya n’ọdịnala, “Jizọs Kraịst.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya n’ụzọ kpọmkwem dịka “n’ihi ihe niile”; ụfọdụ na-aghọta ya dịka “n’ihi mmadụ niile,” ọ bụ ezie na okwu gbara ya gburugburu na-akwado nghọta sara mbara nke ihe ma ọ bụ ọnọdụ niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: na-ekele
  rationale: Ụdị ngwaa na-aga n’ihu na Grik na-ejikọ amaokwu a na ndụmọdụ dị n’amaokwu ndị bu ya ụzọ. “Na-ekele” bụ okwu Igbo dị mfe ma na-egosi omume na-aga n’ihu.
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Nke a bụ ụzọ Igbo nkịtị si kwuo “mgbe nile” ma ọ bụ “n’oge niile,” ma na-edobe echiche zuru oge nke okwu Grik.
- source_word: ὑπὲρ πάντων
  choice: n’ihi ihe niile
  rationale: πάντων nwere ike ịbụ ihe ma ọ bụ mmadụ n’ụdị ya, ma okwu gbara ya gburugburu na-akwado ekele gbasara ihe na ọnọdụ niile. “N’ihi ihe niile” bụ ntụgharị Igbo doro anya, ebe e debere nghọta ndị ọzọ n’okpuru peeji.
- source_word: ἐν ὀνόματι
  choice: n’aha
  rationale: Na-edobe akpaalaokwu Akwụkwọ Nsọ nke nwere ike ịgụnye ime ihe n’okpuru ikike ma ọ bụ site n’ọnọdụ nnọchiteanya nke onye a kpọrọ aha.
- source_word: κυρίου
  choice: Onyenwe
  rationale: “Onyenwe” bụ aha nsọpụrụ Igbo doro anya maka κύριος n’ebe a, ma “anyị” na-esochi ya dịka ederede Grik si dị.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bú Mezaịa
  rationale: A sụgharịrị Χριστός dị ka aha ọrụ, “Mezaịa,” ọ bụghị dị ka aha ezinụlọ; “bú” na-eme ka aha ọrụ ahụ daa nke ọma n’Igbo.
- source_word: τῷ θεῷ καὶ πατρί
  choice: Chineke bú Nna
  rationale: 'Dative ahụ na-egosi onye a na-enye ekele. Otu njikọ isiokwu ahụ na-ezo aka n’otu onye: Chineke, onye bụ Nna; ntụgharị a na-egosipụta nke ahụ n’Igbo eke.'
theological_decisions:
- issue: Otu e si sụgharịa Χριστοῦ n’ahịrịokwu τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: Mezaịa
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka nwere ike ya dịka aha ọrụ nke Onye E Tere Mmanụ. Ya mere e ji “Mezaịa” mee ihe n’ahịrị bụ isi, ma e debere “Kraịst,” nke ọdịnala Igbo maara nke ọma, dịka ụzọ ọzọ.
- issue: Ihe πάντων na-ezo aka na ya
  choice: ihe niile
  alternative: mmadụ niile
  rationale: Ụdị Grik nwere ike izo aka n’ihe niile ma ọ bụ mmadụ niile. N’ọnọdụ ndụmọdụ banyere ekele zuru ebe niile, “ihe niile” ka dabara nke ọma, ma a hapụrụ ohere nke “mmadụ niile” na nkọwa ala peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Akụkụ “na-ekele” na-edobe njikọ ụtọasụsụ ya na amaokwu ndị bu ụzọ; a hapụrụ rikoma ikpeazụ n’ihi na ederede isi mmalite bụ akụkụ nke ahịrịokwu na-aga n’ihu.
