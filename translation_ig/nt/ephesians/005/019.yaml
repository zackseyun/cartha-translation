  text: λαλοῦντες ⸀ἑαυτοῖς ψαλμοῖς καὶ ὕμνοις καὶ ᾠδαῖς πνευματικαῖς, ᾄδοντες καὶ ⸀ψάλλοντες τῇ καρδίᾳ ὑμῶν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/019.yaml
  text: speaking to one another with psalms and hymns and spiritual songs[a], singing and making melody with your heart to the Lord[b],
translation:
  language: ig
  text: na-agwa ibe unu okwu n’abụ ọma, na ukwe, na abụ ime mmụọ[a], na-abụ abụ ma na-ekwe Onyenwe anyị ukwe n’obi unu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’etiti unu” ma ọ bụ “n’onwe unu”; okwu nrụgharị onwe nke Grik dị ebe a ka a na-aghọtakarị n’ụzọ mmekọrịta, ya bụ, “ibe unu.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “na-abụ abụ otuto”; okwu Grik ahụ nwere ike ịpụta ịbụ abụ otuto ma ọ bụ ikwe ukwe, ma ọ dịghị ekwu kpọmkwem na a ga-eji ngwá egwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦντες
  choice: na-agwa … okwu
  rationale: Na-egosipụta participle nke na-aga n’ihu ma na-edobe nghọta sara mbara nke ‘ikwu okwu’ n’enweghị ịkọwa ya dịka okwu emume.
- source_word: ἑαυτοῖς
  choice: ibe unu
  rationale: N’ebe a, reflexive plural nwere nghọta reciprocal, ya bụ, ndị otu obodo na-agwa ibe ha okwu.
- source_word: ψαλμοῖς
  choice: abụ ọma
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa psalm; ọ naghị amachi ya naanị n’Abụ Ọma ndị dị n’Akwụkwọ Nsọ.
- source_word: ὕμνοις
  choice: ukwe
  rationale: ‘Ukwe’ bụ okwu ebumpụta ụwa maka hymn ma na-edobe ya iche n’abụ ọma na abụ ndị ọzọ.
- source_word: ᾠδαῖς πνευματικαῖς
  choice: abụ ime mmụọ
  rationale: Na-edobe adjective πνευματικαῖς dịka nkọwa nke abụ, n’enweghị ịgbakwunye nkwupụta siri ike na Mmụọ Nsọ kpaliri abụ ndị ahụ kpọmkwem.
- source_word: ᾄδοντες
  choice: na-abụ abụ
  rationale: Nsụgharị kwụ ọtọ nke omume ịbụ abụ.
- source_word: ψάλλοντες
  choice: na-ekwe … ukwe
  rationale: Na-egosipụta ime egwu ma ọ bụ ito site n’abụ, ma ọ naghị ekwu na ngwá egwu ga-adịrịrị.
- source_word: τῇ καρδίᾳ ὑμῶν
  choice: na-eji obi unu niile
  rationale: Dative a nwere ike igosi ụzọ ma ọ bụ ebe omume ahụ si apụta; okwu Igbo a na-egosi ịbụ abụ sitere n’obi nke ndị a na-agwa okwu, ma plural ‘unu’ na-edobe adreesị obodo.
- source_word: τῷ κυρίῳ
  choice: Onyenwe anyị
  rationale: Ọ bụ nsụgharị ọdịnala, doro anya, nke κύριος, ebe dative na-egosi onye a na-enye abụ ahụ.
theological_decisions:
- issue: Ihe ψάλλοντες pụtara gbasara ngwá egwu
  choice: A sụgharịrị ya ‘na-ekwe … ukwe’ n’ekwughị na a na-eji ngwá egwu.
  alternative: ‘na-abụ abụ otuto’ ma ọ bụ ịsụgharị ya n’ụzọ na-egosi ịkpọ ngwá egwu
  rationale: Okwu Grik ahụ nwere akụkọ ihe mere eme metụtara ịkụ ụdọ, ma n’oge Agba Ọhụrụ ọ nwere ike ịpụta ịbụ abụ otuto ma ọ bụ ime melody. Nsụgharị ahụ anaghị akwado ma ọ bụ gọnahụ ngwá egwu.
- issue: Onye ‘Onyenwe anyị’ na-ezo aka na ya
  choice: E debere ‘Onyenwe anyị’ n’agbakwụnyeghị ‘Jizọs’ ma ọ bụ ‘Kraịst.’
  alternative: ‘Onyenwe anyị Jizọs’ ma ọ bụ ‘Kraịst’
  rationale: Ọnọdụ sara mbara nwere ike igosi Kraịst, ma amaokwu ahụ n’onwe ya nwere naanị κύριος; ya mere, e debere nghọta ahụ ka ọnọdụ ya kọwaa ya.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere usoro abụ atọ dị na Grik, tinyere ọdịiche dị n’etiti ịbụ abụ na ikwe ukwe. Akara nkọwa ala [a] na [b] pụtara n’ederede bụ isi.
