id: EPH.5.10
reference: Ephesians 5:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δοκιμάζοντες τί ἐστιν εὐάρεστον τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/010.yaml
  text: testing what is pleasing to the Lord;[a]
translation:
  language: ig
  text: na-enyochakwa ihe na-atọ Onyenwe anyị ụtọ;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-aghọtakwa” ma ọ bụ “na-achọpụtakwa” ihe na-atọ Onyenwe anyị ụtọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμάζοντες
  choice: na-enyochakwa
  rationale: Ọ bụ participle dị na present active, na-aga n’ihu n’usoro ndụmọdụ nke amaokwu ndị gbara ya gburugburu. “Na-enyochakwa” na-egosi omume na-aga n’ihu nke iji nlezianya tụlee ma chọpụta ihe kwesịrị ekwesị, n’enweghị ịkọwa okwu ahụ karịa ihe Grik kwuru.
- source_word: τί
  choice: ihe
  rationale: N’ajụjụ na-apụtaghị ozugbo, “ihe” bụ ụzọ Igbo kwụ ọtọ ma dị mma isi kwuo “what,” dịka n’okwu “ihe na-atọ … ụtọ.”
- source_word: ἐστιν
  choice: na-
  rationale: N’usoro okwu Igbo “ihe na-atọ … ụtọ,” njikọ echiche nke ἐστιν dị n’ime ngwaa nkọwa ahụ; ịgbakwunye “bụ” ga-eme ka okwu ahụ ghara ịdị ụtọ n’Igbo.
- source_word: εὐάρεστον
  choice: na-atọ … ụtọ
  rationale: Nkebiokwu a bụ Igbo ebumpụta ụwa nke na-egosi ihe na-amasị mmadụ ma bụrụ ihe a nabatara n’anya ya. Ọ na-echekwa akụkụ mmekọrịta dị na “pleasing” karịa naanị ịsị “ihe a na-anabata.”
- source_word: τῷ κυρίῳ
  choice: Onyenwe anyị
  rationale: Dative a na εὐάρεστον na-egosi onye ihe ahụ na-atọ ụtọ. “Onyenwe anyị” bụ aha nsọpụrụ Igbo a na-ejikarị sụgharịa κύριος, ma ọ naghị agbakwunye onye aha ahụ na-ezo aka na ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Onye κύριος na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Onyenwe anyị Jizọs; Chineke
  rationale: Ihe odide Grik ji naanị aha nsọpụrụ κύριος, n’agbanyeghị na gburugburu okwu ahụ nwere ike ime ka a ghọta ya dị ka Kraịst. Nsụgharị ahụ hapụrụ aha nsọpụrụ ahụ otú ahụ iji ghara idozi ihe amaokwu ahụ ekwughị hoo haa.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị nsọpụrụ ma dị mfe nghọta. E ji “-kwa” jikọta participle ahụ na usoro ndụmọdụ gara aga, e wee debe semicolon iji gosipụta na nkebiokwu a na-aga n’ihu n’ahịrịokwu gbara ya gburugburu.
