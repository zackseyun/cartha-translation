id: EPH.5.14
reference: Ephesians 5:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: ig
  text: N’ihi na ihe niile a na-eme ka ọ pụta ìhè bụ ìhè.[a] N’ihi ya, a na-ekwu, “Teta, gị onye na-ehi ụra, biliekwa n’etiti ndị nwụrụ anwụ,[c] Mesaịa ahụ ga-enwukwasị gị.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ihe niile e kpughere bụ ìhè.” Okwu Greek φανερούμενον nwere ike ịpụta “ihe e mere ka ọ pụta ìhè” ma ọ bụ “ihe e kpughere.”
    reason: lexical_alternative
  - marker: b
    text: Greek bụ “Kraịst ahụ.” E ji “Mesaịa ahụ” sụgharịa ya ebe a n’ihi na Χριστός na-arụ ọrụ dịka utu aha.
    reason: alternative_reading
  - marker: c
    text: A maghị kpọmkwem ebe okwu a e hotara si. O nwere ike ịbụ nkwughachi isiokwu Akwụkwọ Nsọ, karịsịa Aịzaya 60:1, ma ọ bụ akụkụ abụ Ndị Kraịst oge mbụ.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν
  choice: ihe niile
  rationale: Ụdị neuter singular ya na participle nwere article na-enye echiche zuru ezu, ‘ihe niile,’ n’enweghị ịmanye ya ka ọ na-ekwu naanị banyere mmadụ.
- source_word: φανερούμενον
  choice: a na-eme ka ọ pụta ìhè
  rationale: Nke a na-edobe passive sense nke ‘ime ka a hụ ya/ka ọ pụta ìhè’; enwere ike ịghọta ya dịka ‘ikpughe,’ ya mere e debere nke ahụ n’ala peeji.
- source_word: φῶς
  choice: ìhè
  rationale: Ọ bụ ntụgharị kpọmkwem nke na-ahapụ ihe atụ ahụ ka ọ dị n’enweghị ịkọwa ya gabiga ihe ederede kwuru.
- source_word: διὸ
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu sitere n’okwu gara aga ma bụrụkwa Igbo dị mfe ma kwụ ọtọ.
- source_word: λέγει
  choice: a na-ekwu
  rationale: Greek ekwughị onye na-ekwu ya; passive impersonal Igbo a na-echekwa enweghị mkpebi ahụ.
- source_word: Ἔγειρε
  choice: Teta
  rationale: Imperative a bụ okwu Igbo nkịtị ma doo anya maka ịkpọte onye na-ehi ụra.
- source_word: ὁ καθεύδων
  choice: gị onye na-ehi ụra
  rationale: Ọ na-egosipụta participle ahụ dịka onye a na-akpọ okwu, n’ụzọ Igbo sitere n’okike.
- source_word: ἀνάστα
  choice: bilie
  rationale: Ọ na-echekwa ma echiche ibili elu ma ụda mbilite n’ọnwụ dị n’okwu ‘n’etiti ndị nwụrụ anwụ.’
- source_word: ἐκ τῶν νεκρῶν
  choice: n’etiti ndị nwụrụ anwụ
  rationale: ἐκ na plural substantive na-enye echiche isi n’etiti ndị nwụrụ anwụ pụta; Igbo a na-echekwa nuance ahụ nke ọma.
- source_word: ἐπιφαύσει
  choice: ga-enwu n’ahụ gị
  rationale: Ọ na-edobe ihe atụ ìhè ahụ na future sense nke ‘ịnwuru mmadụ/ịkụkwasị mmadụ ìhè.’
- source_word: ὁ Χριστός
  choice: Mesaịa ahụ
  rationale: Article ahụ na-akwado ọrụ ya dịka utu aha; ‘Mesaịa’ na-ebufe ihe Χριστός pụtara kama ime ya naanị aha mmadụ.
theological_decisions:
- issue: Isi iyi nke okwu e hotara
  choice: a na-ekwu
  alternative: Akwụkwọ Nsọ na-ekwu / ọ na-ekwu / abụ Ndị Kraịst oge mbụ na-ekwu
  rationale: Greek ahapụghị onye na-ekwu ya ma ọ bụ kpọọ isi iyi ya aha; ntụgharị ahụ ekwesịghị idozi ajụjụ ahụ n’ike.
- issue: Ntughari Χριστός
  choice: Mesaịa ahụ
  alternative: Kraịst
  rationale: N’ebe a, article ὁ na-egosi utu aha. ‘Mesaịa ahụ’ na-echekwa isi echiche nke ‘onye e tere mmanụ’; a na-enye ụdị ọdịnala ‘Kraịst’ n’ala peeji.
- issue: Njikọ ‘bilie n’etiti ndị nwụrụ anwụ’
  choice: Chekwaa ma ụda omume ime mmụọ ma ụda mbilite n’ọnwụ
  alternative: Kọwaa ya naanị dịka nchegharị ma ọ bụ naanị dịka mbilite n’ọnwụ nkịtị
  rationale: Ederede ahụ na-etinye onyonyo ụra, ọnwụ, ibili, na ìhè ọnụ; ntụgharị ekwesịghị imechi ọtụtụ ụda ihe atụ ndị ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “A na-ekwu” na-echekwa onye kwuru okwu ahụ ka ọ ghara ịbụ nke akọwapụtara; “Teta” na “bilie” na-eme ka usoro iwu abụọ ahụ doo anya. A haziri akara ala peeji ka [a], [c], na [b] pụta n’isi ederede n’ebe ha metụtara.
