revisions:
- from: N’ihi na ihe niile a na-eme ka ọ pụta ìhè bụ ìhè.[a] N’ihi ya, a na-ekwu, “Teta, gị onye na-ehi ụra, biliekwa n’etiti ndị nwụrụ anwụ,[c] Mesaịa ahụ ga-enwukwa n’ahụ gị.”[b]
  to: N’ihi na ihe niile a na-eme ka ọ pụta ìhè bụ ìhè.[a] N’ihi ya, a na-ekwu, “Teta, gị onye na-ehi ụra, biliekwa n’etiti ndị nwụrụ anwụ,[c] Mesaịa ahụ ga-enwukwasị gị.”[b]
  rationale: Only the expression for ἐπιφαύσει σοι is revised. “Ga-enwukwasị gị” is a natural Standard Igbo equivalent of “will shine upon you” and retains the source’s light imagery and future sense without interpretive expansion. Footnote anchors and content remain complete and correctly associated.
