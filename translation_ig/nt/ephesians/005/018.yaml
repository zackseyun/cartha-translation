id: EPH.5.18
reference: Ephesians 5:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ μὴ μεθύσκεσθε οἴνῳ, ἐν ᾧ ἐστιν ἀσωτία, ἀλλὰ πληροῦσθε ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/018.yaml
  text: And do not get drunk with wine[a], in which there is debauchery, but be filled with the Spirit,
translation:
  language: ig
  text: Unu aṅụla mmanya gabiga ókè, n’ime ya ka e nwere omume aghara aghara; kama, ka e were Mmụọ Nsọ mejupụta unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka e mejupụta unu n’ime Mmụọ Nsọ”; ụfọdụ na-aghọta ya n’ụzọ sara mbara dị ka “ka e mejupụta unu na mmụọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: μεθύσκεσθε
  choice: aṅụbigala mmanya ókè
  rationale: Ụdị iwu a na μὴ na-enye mmachibido iwu. N'Igbo nkịtị, ‘ịṅụbigara mmanya ókè’ na-egosi ịṅụ ruo n'ịṅụbiga mmanya ókè, ma na-edobe echiche nke usoro na nsonaazụ ahụ.
- source_word: οἴνῳ
  choice: mmanya
  rationale: Dative a na-egosi ihe na-egbu mmadụ mmanya; ‘mmanya’ bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe.
- source_word: ἐν ᾧ
  choice: n’ihi na nke ahụ
  rationale: N'ọnọdụ a, njikọ ahụ na-ezo aka n'ịṅụbiga mmanya ókè ma ọ bụ mmanya na-akpata ya. Nsụgharị a na-eme ka mmekọrịta nke Greek doo anya n'Igbo n'enweghị ịkọwa ya gabiga ókè.
- source_word: ἀσωτία
  choice: omume rụrụ arụ
  rationale: Okwu ahụ na-egosi ndụ ma ọ bụ omume enweghị njide onwe, nke na-emebi ihe ma bụrụkwa omume ọjọọ. ‘Omume rụrụ arụ’ bụ Igbo a na-aghọta ngwa ngwa ma na-edobe ibu omume ọma dị n'okwu ahụ.
- source_word: πληροῦσθε
  choice: ka e were ... mejupụta unu
  rationale: Ọ bụ iwu n'ụdị passive. Nhazi a na-edobe onye a na-eme ihe n'ahụ ya, ebe ụdị present ahụ nwekwara ike ịpụta ọnọdụ na-aga n'ihu, ọ bụ ezie na Igbo ekwesịghị ịgbakwunye ‘mgbe niile’ n'ụzọ doro anya.
- source_word: ἐν πνεύματι
  choice: were Mmụọ Nsọ
  rationale: ἐν na dative nwere ike igosi ihe e ji eme ihe, ebe ihe na-emeju mmadụ, ma ọ bụ ọnọdụ mmadụ nọ n'ime ya. ‘Were Mmụọ Nsọ’ bụ okwu Igbo sitere n'okike nke dabara na passive ‘mejupụta,’ ma a na-edobe ntụgharị ọzọ n'okpuru amaokwu.
theological_decisions:
- issue: Ihe πνεύματι na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ; ma ọ bụ n’ime Mmụọ Nsọ
  rationale: N'okwu agbamume Pọl a, ọ kacha kwe omume na πνεύματι na-ezo aka na Mmụọ Nsọ. Ma Greek ejighị article, ἐν nwekwara ike igosi ụzọ ma ọ bụ ọnọdụ; ya mere a naghị ekpochapụ nghọta ‘mmụọ’ ma ọ bụ ‘n'ime Mmụọ Nsọ,’ kama a na-edebe ha n'okpuru amaokwu.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Unu aṅụbigala mmanya ókè’ kama okwu ochie ma ọ bụ okwu siri ike maka ịṅụbiga mmanya ókè. Akara ụda dị na ‘ókè’ na-enyere aka izere mgbagwoju anya; ‘Mmụọ Nsọ’ na-egosi na isi ntụgharị na-ewere πνεύματι dị ka Mmụọ Nsọ, ebe nkọwa ala peeji na-echekwa nghọta ndị ọzọ.
