  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο μὴ γίνεσθε ἄφρονες, ἀλλὰ ⸀συνίετε τί τὸ θέλημα τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/017.yaml
  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: ig
  text: N’ihi nke a[a], unu aghọla ndị nzuzu, kama ghọtaanụ ihe uche Onyenwe anyị bụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ya mere, unu abụla ndị nzuzu.” Okwu Grik ahụ nwere ike igosi ọnọdụ mmadụ nọ na ya, ma “unu aghọla” na-echekwa echiche nke ịghọ ma ọ bụ ịbanye n’ọnọdụ ahụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Nkebi okwu a na-ezo azụ n’ndụmọdụ ndị bu ya ụzọ ma na-egosi ihe kpatara ma ọ bụ nkwubi okwu nke ndụmọdụ a.
- source_word: μὴ γίνεσθε
  choice: unu aghọla
  rationale: “Aghọla” na-echekwa echiche γίνομαι nke ịbanye n’ọnọdụ ma ọ bụ ịghọ ihe, kama ịsị naanị na mmadụ adịla otú ahụ.
- source_word: ἄφρονες
  choice: ndị nzuzu
  rationale: Nke a na-egosi ndị na-enweghị nghọta ma ọ bụ ezi uche n’omume, ma na-emepụta ọdịiche doro anya na iwu nke na-esote ka ha ghọta.
- source_word: ἀλλὰ
  choice: kama
  rationale: “Kama” na-egosi ọdịiche siri ike n’etiti ihe a machibidoro na ihe e nyere n’iwu.
- source_word: συνίετε
  choice: ghọtaanụ
  rationale: Okwu a na-enye echiche nke ịghọta ma ọ bụ ịmata ihe nke ọma; “ghọtaanụ” bụ Igbo nkịtị, doro anya.
- source_word: τί
  choice: ihe ... bụ
  rationale: Usoro “ihe ... bụ” na-ebute ọdịnaya nke ndị na-agụ ga-aghọta n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: τὸ θέλημα
  choice: uche
  rationale: N’ebe a, “uche” na-egosi ihe Onyenwe anyị chọrọ ma ọ bụ zubere, dịka θέλημα si arụ ọrụ n’ahịrịokwu ahụ.
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo kwụ ọtọ nke “Onyenwe anyị,” ma ọ naghị akọwapụta na ọ bụ Jizọs ma ọ bụ Chineke karịa otú Grik si kwuo.
theological_decisions:
- issue: Onye “Onyenwe anyị” (τοῦ κυρίου) na-ezo aka na ya
  choice: E dere naanị “Onyenwe anyị.”
  alternative: “Onyenwe anyị Jizọs” ma ọ bụ “Chineke”
  rationale: Ọnọdụ akwụkwọ ahụ nwere ike ime ka a ghọta na ọ bụ Jizọs, ma amaokwu ahụ n’onwe ya ekwughị aha ahụ; ya mere, nsụgharị ahụ na-echekwa obosara okwu Grik.
- issue: Ike nke mmachibido μὴ γίνεσθε
  choice: “unu aghọla”
  alternative: “unu abụla” ma ọ bụ “kwụsịnụ ịbụ”
  rationale: “Unu aghọla” na-echekwa echiche nke ịbanye n’ọnọdụ nzuzu, n’ebughị ụzọ kwuo na ndị a na-agwa okwu abụrụlarị ndị nzuzu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. A họọrọ “unu” n’ihi na iwu Grik ahụ bụ nke ọtụtụ mmadụ. Usoro “uche Onyenwe anyị” bụ okwu a na-aghọta nke ọma n’Igbo ma na-echekwa nkọwa θέλημα n’enweghị mgbakwunye nkọwa okpukpe na-adịghị n’ederede.
