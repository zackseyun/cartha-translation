id: EPH.5.8
reference: Ephesians 5:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦτε γάρ ποτε σκότος, νῦν δὲ φῶς ἐν κυρίῳ· ὡς τέκνα φωτὸς περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/008.yaml
  text: For you were once darkness[a], but now you are light in the Lord. Walk as children of light,
translation:
  language: ig
  text: N’ihi na unu bụbu ọchịchịrị, ma ugbu a unu bụ ìhè n’Onyenwe anyị. Na-ejegharịnụ[a] dịka ụmụ ìhè.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-akọwa ihe ọ pụtara, “Na-ebinụ ndụ dịka ụmụ ìhè.” Grik sịrị “na-ejegharịnụ,” bụ́ ihe atụ Pọl na-ejikarị ekwu maka ụzọ mmadụ si ebi ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε
  choice: unu bụbu
  rationale: Oge gara aga nke εἰμί na-egosi ọnọdụ ha nọbu na ya; “bụbu” na-egosipụta nke a n’ụzọ dị nkenke ma kwekọọ n’Igbo.
- source_word: γάρ
  choice: N’ihi na
  rationale: γάρ na-enye ihe mere e ji nye ndụmọdụ bu ya ụzọ; “N’ihi na” na-edobe njikọ nkọwa ahụ.
- source_word: ποτε
  choice: bụbu
  rationale: N’ebe a, echiche ποτε, ya bụ “n’oge gara aga,” jikọtara nke ọma n’okwu “bụbu,” ka Igbo wee daa nke ọma n’enweghị ikwugharị ihe.
- source_word: σκότος
  choice: ọchịchịrị
  rationale: 'E debere aha ihe ahụ kpọmkwem: Pọl ekwughị na ha nọ n’ọchịchịrị, kama na ha bụ ọchịchịrị. Nke a na-echekwa ike nke ihe atụ ahụ.'
- source_word: νῦν δὲ
  choice: ma ugbu a
  rationale: Ọ na-egosipụta ọdịiche siri ike n’etiti ọnọdụ mbụ ha na ọnọdụ ha ugbu a.
- source_word: φῶς
  choice: ìhè
  rationale: Dịka ọ dị n’okwu “ọchịchịrị,” e debere aha ihe ahụ ka a ghara ime ka okwu mgbanwe njirimara a dị nro.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Ọ na-egosi ọnọdụ ma ọ bụ njikọ ha na Onyenwe anyị, bụ́ ebe njirimara ọhụrụ ha dị.
- source_word: ὡς
  choice: dịka
  rationale: Ọ na-egosi ụzọ ha kwesịrị isi bie ndụ kwekọrọ n’ịbụ ụmụ ìhè.
- source_word: τέκνα φωτός
  choice: ụmụ ìhè
  rationale: τέκνα gụnyere ma nwoke ma nwanyị; “ụmụ ìhè” na-edobe okwu njirimara ahụ n’ụzọ dị nkenke ma dị mma n’Igbo.
- source_word: περιπατεῖτε
  choice: Na-ejegharịnụ
  rationale: E debere ihe atụ Pọl ji banyere ije dịka ụzọ mmadụ si ebi ndụ. Ihe odide ala peeji na-akọwa ihe ọ pụtara n’ebe a.
theological_decisions:
- issue: 'Okwu ihe atụ nke njirimara: “unu bụbu ọchịchịrị, ma ugbu a unu bụ ìhè”'
  choice: E debere “ọchịchịrị” na “ìhè” dịka aha na-akọwa ihe ha bụ.
  alternative: “unu nọbu n’ọchịchịrị, ma ugbu a unu nọ n’ìhè”
  rationale: Grik na-ekwu na ha bụ ọchịchịrị ma bụrụkwa ìhè, ọ bụghị naanị na ha nọ n’ime ha. Nsụgharị a na-echekwa ịdị ike na mgbagwoju anya nke mgbanwe ahụ.
- issue: Nsụgharị κύριος
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” bụ aha kwesịrị ekwesị na nke a na-ejikarị eme ihe maka κύριος n’Agba Ọhụrụ; ọ na-echekwakwa ụda okpukpe nke okwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ihe atụ ndị bụ isi—ọchịchịrị, ìhè, na ije—ma jiri ihe odide ala peeji kọwaa “ije” ka onye na-agụ ya ghọta na ọ na-ekwu maka omume na ụzọ ndụ.
