  rationale: A safe, minimal correction replaces n’ime Onyenwe anyị with n’Onyenwe anyị to represent ἐν κυρίῳ without importing an overly literal interior-location sense. All other wording and the explanatory footnote faithfully preserve the source and read naturally in Standard Igbo.
