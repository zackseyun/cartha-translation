  naturalness: The wording after the dash, “ọ bụghị dị ka …, kama dị ka …,” closely follows the Greek but is somewhat elliptical in modern Standard Igbo. Expressing the comparison as “ka unu ghara ịdị ka …, kama ka unu dị ka …” is clearer and idiomatic while retaining the exhortational force and contrast.
  terminology: “ndị na-enweghị amamihe” and “ndị nwere amamihe” are appropriate, balanced renderings of ἄσοφοι / σοφοί. The gender footnote should describe the Greek morphology more naturally as masculine plural, rather than “ụdị oke nwoke ọtụtụ.”
