base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/015.yaml
  text: Therefore[b][a], watch carefully how you walk—not as unwise but as wise—
translation:
  language: ig
  text: Ya mere, lezienụ anya nke ọma n’otú unu si eje ije[a]—ka unu ghara ịdị ka ndị na-enweghị amamihe[b], kama ka unu dị ka ndị nwere amamihe—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “lezienụ anya nke ọma n’otú unu si ebi ndụ.” N’asụsụ Grik, okwu ahụ bụ n’ụzọ nkịtị, “lezienụ anya nke ọma n’otú unu si eje ije,” ebe “ije ije” bụ ihe atụ nke ụzọ mmadụ si ebi ndụ.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, okwu ndị a sụgharịrị “ndị na-enweghị amamihe” na “ndị nwere amamihe” dị n’ụdị nwoke, ọtụtụ, ma e ji ha anọchite anya mmadụ niile. Ndụmọdụ a bụ maka ọgbakọ ndị kwere ekwe niile, ọ bụghị naanị ụmụ nwoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: lezienụ anya
  rationale: Ọ bụ iwu dị n’ụdị onye nke abụọ ọtụtụ; “lezienụ anya” na-egosipụta oku a na-akpọ ọgbakọ dum ka ha mụrụ anya.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya, ma “Ya mere” na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: ἀκριβῶς πῶς
  choice: nke ọma n’otú
  rationale: Nkebiokwu a na-emesi ụzọ ha si akpa àgwà ike. Nsụgharị a bụ Igbo eke ma na-echekwa echiche nke nlezianya na otú e si eme ihe.
- source_word: περιπατεῖτε
  choice: unu si eje ije
  rationale: E debere ihe atụ nke “ije ije,” nke Pọl ji akọwa ụzọ mmadụ si ebi ndụ; ihe odide ala peeji kọwara ihe ọ pụtara.
- source_word: μὴ ὡς ἄσοφοι
  choice: ọ bụghị dị ka ndị na-enweghị amamihe
  rationale: “Ndị na-enweghị amamihe” na-egosipụta ἄσοφοι nke ọma, na-enweghị ime ka ọ bụrụ okwu siri ike karịa isi okwu Grik.
- source_word: ἀλλ’ ὡς σοφοί
  choice: kama dị ka ndị nwere amamihe
  rationale: Ọ na-echekwa ọdịiche doro anya dị n’etiti ndị na-enweghị amamihe na ndị nwere amamihe.
theological_decisions:
- issue: Ụdị oke nwoke dị n’ἄσοφοι / σοφοί na ndị a na-agwa okwu
  choice: Jiri “ndị na-enweghị amamihe ... ndị nwere amamihe,” nke na-adịghị akọwa nwoke ma ọ bụ nwaanyị n’Igbo.
  alternative: Ịgbakwunye “ndị ikom” iji gosi ụdị oke nwoke nke ụtọ asụsụ Grik.
  rationale: Ọ bụ ezie na okwu nkọwa Grik ndị a dị n’ụdị oke nwoke ọtụtụ, ha na-anọchite anya ndị niile nọ n’ọgbakọ. Igbo anaghị egosi oke nwoke n’ụdị a, ya mere ịgbakwunye “ndị ikom” ga-etinye echiche na-adịghị n’ihe Pọl na-ekwu ma nwee ike ime ka ndị na-agụ ya chee na ọ bụ naanị ụmụ nwoke ka a na-agwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ihe atụ Pọl nke “ije ije,” ma kọwaa ya n’ihe odide ala peeji; ahịrị ogologo e tinyere ná ngwụcha na-egosi na echiche ahụ na-aga n’ihu n’amaokwu na-esonụ.
