  - severity: low
    issue: Unnatural grammatical terminology in footnote b
    rationale: “ụdị oke nwoke ọtụtụ” is not the clearest Standard Igbo way to describe a masculine plural Greek form. “ụdị nwoke, ọtụtụ” is clearer and preserves the intended explanation.
