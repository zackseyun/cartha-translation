  text: τὰ γὰρ κρυφῇ γινόμενα ὑπ’ αὐτῶν αἰσχρόν ἐστιν καὶ λέγειν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/012.yaml
  text: For it is shameful even to speak of the things done by them in secret[a].
translation:
  language: ig
  text: N’ihi na ọbụna ikwu banyere ihe ndị ha na-eme na nzuzo[a] bụ ihe ihere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ha na-eme n’ụzọ zoro ezo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a na-enye ihe kpatara ndụmọdụ dị n’amaokwu bu ụzọ, ma na-ejigide njikọ arụmụka Pọl.
- source_word: τὰ ... γινόμενα
  choice: ihe ndị ... na-eme
  rationale: Isiokwu na participle a jikọtara ọnụ na-arụ ọrụ dị ka aha, na-ezo aka n’ihe omume. Nsụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: κρυφῇ
  choice: na nzuzo
  rationale: Ọ na-egosi na a na-eme ihe ndị ahụ n’ụzọ zoro ezo; ‘na nzuzo’ bụ okwu Igbo dị mfe ma kwesị ekwesị.
- source_word: ὑπ’ αὐτῶν
  choice: ha na-eme
  rationale: Ọ bụ ezie na Grik jiri usoro passive na onye na-eme ihe, Igbo na-ada nke ọma karịa n’usoro active a, ebe ‘ha’ ka na-anọgide dị ka onye na-eme ihe ahụ.
- source_word: αἰσχρόν
  choice: ihe ihere
  rationale: Ọ na-egosi ihe na-eweta ihere n’ụzọ omume; okwu a bụ nke a na-aghọta ngwa ngwa n’Igbo ugbu a.
- source_word: καὶ λέγειν
  choice: ọbụna ikwu banyere
  rationale: καί nwere ike ịrụ ọrụ nkwusi ike n’ebe a, ya mere ‘ọbụna’ na-egosi na ikwu banyere omume ndị ahụ n’onwe ya bụ ihe ihere.
theological_decisions:
- issue: Ihe αὐτῶν (‘ha’) na-ezo aka na ya
  choice: E debere nnọchiaha ahụ dịka ‘ha’ n’enweghị ịkpọ ndị ọ na-ezo aka na ha aha n’amaokwu ahụ.
  alternative: Ịsụgharị ya dịka ‘ndị ahụ na-enupụ isi’ ma ọ bụ ịkọwa ya dịka ndị na-arụ ọrụ ọchịchịrị.
  rationale: Amaokwu ndị gbara ya gburugburu na-enye ihe nnọchiaha ahụ na-ezo aka na ya. Ịgbakwunye aha kpọmkwem n’ebe a ga-akọwa ihe karịrị ihe Grik kwuru ma belata obere oghere ntụaka dị na mbụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta. A họọrọ usoro active ‘ihe ndị ha na-eme’ n’ihi na ọ bụ usoro Igbo sitere n’okike karịa passive, ma ọ ka na-echekwa onye na-eme ihe na nzuzo. Akara ndetu [a] dị n’ederede isi.
