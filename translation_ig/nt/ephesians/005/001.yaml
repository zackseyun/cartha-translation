id: EPH.5.1
reference: Ephesians 5:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γίνεσθε οὖν μιμηταὶ τοῦ θεοῦ, ὡς τέκνα ἀγαπητά,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/001.yaml
  text: Therefore[a], become imitators of God, as beloved children,
translation:
  language: ig
  text: Ya mere, ghọọnụ[a] ndị na-eṅomi Chineke, dị ka ụmụ a hụrụ n’anya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-abụnụ ndị na-eṅomi Chineke.” Iwu Grik a nwere ike imesi ma ịghọ ihe ike ma ịnọgide na-abụ ya ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: ghọọnụ
  rationale: Ngwaa a na-egosi iwu e nyere ọtụtụ mmadụ, ọ pụkwara igosi ịbanye n’ọnọdụ ọhụrụ ma ọ bụ ịnọgide na-ebi n’ọnọdụ ahụ. “Ghọọnụ” na-egosipụta nke ọma ume nke ọkpụkpọ ahụ n’enweghị ịkọwa ya gabiga ihe Grik kwuru.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ndụmọdụ a na ihe e kwuru tupu ya dị ka nkwubi okwu ma ọ bụ ihe si na ya pụta.
- source_word: μιμηταὶ
  choice: ndị na-eṅomi
  rationale: Nke a na-egosi ndị na-eme omume dịka onye ọzọ, ọ bụghị naanị ndị na-eso ya; ya mere, ọ na-echekwa echiche doro anya nke iṅomi.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: N’usoro Igbo, “ndị na-eṅomi Chineke” na-egosipụta njikọ genitiv ahụ n’ụzọ ziri ezi ma dịkwa mfe nghọta.
- source_word: ὡς
  choice: dị ka
  rationale: Ọ na-echekwa ntụnyere nke na-egosi otu ha kwesịrị isi mee ya ma ọ bụ ọnọdụ ha ji mee ya, n’enweghị ime ka ọ bụrụ naanị ihe kpatara iwu ahụ.
- source_word: τέκνα
  choice: ụmụ
  rationale: Okwu Grik a gụnyere nwoke na nwanyị ma na-elekwasị anya ná mmekọrịta ụmụ na nne ma ọ bụ nna; “ụmụ” bụ okwu Igbo nkịtị na nke ziri ezi.
- source_word: ἀγαπητά
  choice: a hụrụ n’anya
  rationale: Nkebiokwu a bụ ụzọ Igbo dị ndụ na nke kwesịrị nsọpụrụ isi kwuo na ụmụ ahụ bụ ndị a hụrụ n’anya nke ukwuu.
theological_decisions:
- issue: Mmekọrịta dị n’etiti iwu iṅomi Chineke na ịbụ ụmụ a hụrụ n’anya
  choice: E debere “dị ka ụmụ a hụrụ n’anya” ka ọ kọwaa ọnọdụ ma ọ bụ ụzọ ndị kwere ekwe si aza iwu ahụ, n’ekwughị na iṅomi Chineke bụ ihe na-eme ka ha ghọọ ụmụ ya.
  alternative: 'A pụrụ ịghọta ya nanị dị ka ntụnyere: iṅomi Chineke otú ụmụ a hụrụ n’anya si eme.'
  rationale: Usoro okwu Grik na-enye ohere ka nkebiokwu ahụ gosi ma ụzọ ha si eme ihe ma ọnọdụ mmekọrịta ha ji mee ya. Nsụgharị ahụ echekwala ohere abụọ ahụ n’etinyeghị ozizi ọzọ n’ime amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọpụrụ ma dị mfe nghọta, dee ya. “Ghọọnụ” na-eburu iwu e nyere ọtụtụ mmadụ; “ndị na-eṅomi” na-echekwa aha onye na-eme iṅomi dị n’akwụkwọ Grik. Akara ụkwụakwụkwọ [a] dị n’akụkụ ngwaa ọ na-akọwa.
