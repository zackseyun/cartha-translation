  yaml_path: translation/nt/ephesians/005/026.yaml
  text: so that he might sanctify her[a], having cleansed her by the washing of water with the word[c][b],
translation:
  language: ig
  text: ka o wee doo ya nsọ[a], mgbe o sachapụrụ ya site n’ịsa mmiri tinyere okwu[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka o wee mee ya ka ọ dị nsọ.”
    reason: lexical_alternative
  - marker: b
    text: Nkebiokwu a nwere ike ime ka baptizim bata n’uche, ma okwu Grik ahụ n’onwe ya anaghị ekpebi kpọmkwem otú e kwesịrị isi ghọta njikọ ya na sakrament.
    reason: cultural_note
  - marker: c
    text: 'Ma ọ bụ, “tinyere ozi,” n’ọnọdụ “tinyere okwu” (Grik: rhēmati).'
