lexical_decisions:
- source_word: ἵνα
  choice: ka o wee
  rationale: Ọ na-egosi nzube e ji mee ihe; nke a bụ ụzọ Igbo nkịtị si egosipụta ebumnuche.
- source_word: αὐτὴν
  choice: ya
  rationale: Nnọchiaha a na-arụtụ aka n’ọgbakọ, nke e sere dịka nwanyị n’okwu ndị gbara amaokwu a gburugburu.
- source_word: ἁγιάσῃ
  choice: doo ya nsọ
  rationale: Ọ na-echekwa echiche nke ime ka ọ dị nsọ ma ọ bụ ikewapụ ya nye Chineke, n’asụsụ Igbo doro anya.
- source_word: καθαρίσας
  choice: mgbe o ... sachapụ ya
  rationale: Nke a na-egosi na nsachapụ ahụ metụtara ime ya nsọ, ma na-enye ahịrịokwu ahụ usoro dị mma n’Igbo.
- source_word: τῷ λουτρῷ τοῦ ὕδατος
  choice: jiri ịsa mmiri
  rationale: Ọ na-egosipụta ụzọ e si sachapụ ya ma na-echekwa ihe oyiyi nke ịsa ahụ na mmiri.
- source_word: ἐν ῥήματι
  choice: tinyere okwu ahụ
  rationale: Nke a na-egosi na okwu ahụ so n’ịsa mmiri ahụ, ma ọ naghị ekpebi kpọmkwem ma ọ bụ ụzọ e si mee ya, okwu e kwuru n’oge ahụ, ma ọ bụ ozi e kwusara.
- source_word: ῥήματι
  choice: okwu
  rationale: ‘Okwu’ na-echekwa obosara ihe okwu Grik a nwere ike ịpụta, n’etinyeghị ‘ozi’ ma ọ bụ usoro okwu pụrụ iche n’ime ederede.
theological_decisions:
- issue: Mmekọrịta dị n’etiti nsachapụ, ịsa mmiri, na okwu ahụ
  choice: E debere ihe oyiyi nke ịsa mmiri tinyere okwu ahụ n’enweghị ịkọwa ya dịka otu ozizi sakrament kpọmkwem.
  alternative: Ịkọwa ya hoo haa dịka baptizim sakrament, ma ọ bụ dịka naanị ihe atụ na-enweghị ihe jikọrọ ya na baptizim.
  rationale: Okwu Grik nwere ike ime ka baptizim bata n’uche, ma naanị ya anaghị ekpebi kpọmkwem otú e kwesịrị isi ghọta njikọ ahụ.
- issue: Ma ῥήματι ọ pụtara ‘okwu’ ka ọ bụ ihe akọwapụtara nke ọma dịka ‘ozi’
  choice: okwu
  alternative: ozi; okwu e kwuru; oziọma
  rationale: Ihe ndị ahụ pụrụ ịbụ ihe a na-ekwu maka ya, ma ‘okwu’ anaghị eme ka ihe Grik ahụ pụtara dị warara karịa ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Doo ya nsọ’ na ‘sachapụ ya’ na-echekwa ọdịiche dị n’etiti ime nsọ na ime ka ihe dị ọcha. Nhazi ahịrịokwu ahụ bụ nke Igbo nkịtị, ebe ‘tinyere’ na-ahapụ mmekọrịta okwu ahụ na ịsa mmiri ahụ ka ọ ghara ịdị warara karịa ihe Grik kwuru.
