- from: ka o wee doo ya nsọ[a], mgbe o jiri ịsa mmiri tinyere okwu ahụ[c][b] sachapụ ya.
  to: ka o wee doo ya nsọ[a], mgbe o sachapụrụ ya site n’ịsa mmiri tinyere okwu[c][b].
  rationale: The revision preserves the Greek purpose construction and the participial relation (“having cleansed”), while making the Igbo smoother. It retains the deliberately open relation of water and word, removes an unsupported definite article from “okwu,” and keeps the baptismal reference nonsectarian and noncommittal.
