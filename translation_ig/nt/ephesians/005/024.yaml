    rationale: “Nzukọ ndị kwere ekwe” correctly identifies the referent but adds “believers,” which is not explicit in the Greek. “Ọgbakọ” is closer and remains clear in this Pauline context.
  - severity: low
    issue: Footnote does not fully identify the reason for the main-text rendering
    rationale: The existing note gives the lexical meaning of Χριστός but should also explain that “Mesaịa” renders the Greek title here, while preserving “Kraịst” as the alternative.
