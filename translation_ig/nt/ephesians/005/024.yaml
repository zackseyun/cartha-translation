source:
  edition: SBLGNT
  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: ig
  text: Ma dị ka ọgbakọ si edo onwe ya n’okpuru Mesaịa[a], otu ahụkwa ka ndị nwunye si edo onwe ha n’okpuru di ha n’ihe niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” A sụgharịwo aha-ọkwa Grik Χριστός dịka “Mesaịa” n’ebe a; ọ pụtara “Onye e tere mmanụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Na-egosi ntụgharị ma ọ bụ njikọ megidere ihe e kwuru tupu ya n'ụzọ Igbo dị mfe.
- source_word: ὡς ... οὕτως καὶ
  choice: dị ka ... otu ahụkwa
  rationale: Na-echekwa usoro ntụnyere nke Grik n'Igbo eke.
- source_word: ἡ ἐκκλησία
  choice: nzukọ ndị kwere ekwe
  rationale: Na-egosi ọgbakọ Ndị Kraịst a na-ekwu maka ya, ọ bụghị ụlọ a na-anọ efe ofufe.
- source_word: ὑποτάσσεται
  choice: si edo onwe ya n'okpuru
  rationale: Na-egosipụta nrubeisi a haziri ahazi ma na-echekwa ọdịdị nke onye ahụ na-etinye onwe ya n'okpuru, n'etinyeghị echiche mmanye na-adịghị n'okwu ahụ.
- source_word: τῷ Χριστῷ
  choice: Mesaya
  rationale: Χριστός bụ aha ọkwá ebe a; 'Mesaya' na-asụgharị ọrụ ya dị ka Onye E Tere Mmanụ.
- source_word: αἱ γυναῖκες
  choice: ndị nwunye
  rationale: Ọnọdụ okwu ezinụlọ na njikọ ya na ἀνδράσιν chọrọ nghọta 'ndị nwunye,' ọ bụghị ụmụ nwanyị n'ozuzu.
- source_word: τοῖς ἀνδράσιν
  choice: di ha
  rationale: N'ebe a ἀνήρ pụtara di; 'ha' na-eme ka mmekọrịta alụmdi na nwunye doo anya n'Igbo.
- source_word: ἐν παντί
  choice: n'ihe niile
  rationale: Na-echekwa obosara okwu Grik ahụ n'enweghị ịgbakwunye nkọwa ma ọ bụ mmachi.
- source_word: ellipsis of ὑποτάσσεται in the second clause
  choice: si edo onwe ha n'okpuru
  rationale: Ọ bụ ezie na Grik ekwughachighị ngwaa ahụ, Igbo chọrọ ka e weghachite ya ka ahịrịokwu ahụ bụrụ nke zuru oke ma doo anya; ntụnyere ahụ na-egosi na ọ bụ otu ngwaa ahụ.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: Okwu Grik ahụ na-arụ ọrụ dị ka aha ọkwá; 'Mesaya' na-egosipụta nke a, ebe 'Kraịst' bụ nsụgharị ọdịnala e debere na nkọwa ala peeji.
- issue: Oke okwu nrubeisi nke ndị nwunye
  choice: n'ihe niile, n'enweghị mgbakwunye mmachi
  alternative: n'ihe niile kwesịrị ekwesị
  rationale: Grik kwuru naanị ἐν παντί. Ịgbakwunye 'kwesịrị ekwesị' ga-edozi esemokwu nkà mmụta okpukpe site n'itinye okwu na-adịghị n'amaokwu a.
translation_notes:
  register: Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. E jiri 'nzukọ ndị kwere ekwe' zere nghọtahie na ọ bụ ụlọ ụka ka ἐκκλησία na-ezo aka. E weghachiri ngwaa e hapụrụ n'ahịrị nke abụọ n'ihi usoro asụsụ Igbo, ma e tinyeghị nkọwa na-amachi 'n'ihe niile.'
