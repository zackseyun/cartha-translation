- from: Ma dị ka nzukọ ndị kwere ekwe si edo onwe ya n'okpuru Mesaya[a], otu ahụkwa ka ndị nwunye si edo onwe ha n'okpuru di ha n'ihe niile.
  to: Ma dị ka ọgbakọ si edo onwe ya n’okpuru Mesaịa[a], otu ahụkwa ka ndị nwunye si edo onwe ha n’okpuru di ha n’ihe niile.
  rationale: 'The revision makes only safe lexical and orthographic refinements: it uses the closer, natural Igbo equivalent “ọgbakọ” for ἐκκλησία, standardizes “Mesaịa,” and clarifies the footnote. It retains the explicitly supplied second-clause verb because Igbo syntax benefits from it, while preserving the source’s comparison and the unrestricted “n’ihe niile.”'
