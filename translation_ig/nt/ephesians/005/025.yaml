id: EPH.5.25
reference: Ephesians 5:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: ig
  text: Ndị di, hụnụ ndị nwunye unu n’anya, dịka Mesaịa[a] hụkwara ọgbakọ ahụ n’anya ma nyefere onwe ya maka ya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Kraịst.” A sụgharịrị aha ọkwá Grik Χριστός dịka “Mesaịa” ebe a iji chekwaa ihe ọ pụtara dịka aha ọkwá.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “rara onwe ya nye maka ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνδρες
  choice: Ndị bụ di
  rationale: N’ọnọdụ okwu gbasara alụmdi na nwunye a, okwu ahụ na-ezo aka n’ụmụ nwoke dị ka di, ọ bụghị ụmụ nwoke n’ozuzu.
- source_word: ἀγαπᾶτε
  choice: hụnụ ... n’anya
  rationale: Nke a bụ iwu e nyere ọtụtụ mmadụ; ọ bụkwa ụzọ Igbo nkịtị si kwuo ịhụ mmadụ n’anya.
- source_word: τὰς γυναῖκας
  choice: nwunye unu
  rationale: N’ihi na a na-agwa ndị bụ di okwu, γυναῖκας pụtara ndị nwunye ha. ‘Unu’ na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: καθὼς καὶ
  choice: dịka ... hụkwara
  rationale: ‘Dịka’ na-egosi ntụnyere ahụ, ebe ‘-kwa-’ dị na ‘hụkwara’ na-echekwa ike καί.
- source_word: ὁ Χριστός
  choice: Mesaịa
  rationale: A sụgharịrị aha ọkwá Χριστός dịka ‘Mesaịa’ iji chekwaa ihe aha ọkwá ahụ pụtara, kama ime ya naanị aha mmadụ.
- source_word: ἠγάπησεν
  choice: hụrụ ... n’anya
  rationale: Oge gara aga dị mfe na-echekwa njikọ okwu ya na iwu ‘hụnụ ... n’anya.’
- source_word: τὴν ἐκκλησίαν
  choice: ọgbakọ ahụ
  rationale: ‘Ọgbakọ’ na-egosi ndị Chineke kpọkọtara dịka otu ndị mmadụ, ọ bụghị ụlọ ma ọ bụ nzukọ ọchịchị nkịtị.
- source_word: ἑαυτὸν παρέδωκεν
  choice: nyefere onwe ya
  rationale: Nkebi a na-egosi na o ji aka ya rara onwe ya nye; ọ naghị atụkwasị nkọwa ọzọ banyere ụdị ọnwụ ma ọ bụ usoro mgbapụta.
- source_word: ὑπὲρ αὐτῆς
  choice: n’ihi ya
  rationale: Nke a na-egosi na o mere ya maka ọdịmma ọgbakọ ahụ ma na-ezere ime ka nnọchiaha ahụ yie ihe na-ezo aka n’otu nwanyị n’Igbo.
theological_decisions:
- issue: Otú e si sụgharịa Χριστός n’ihe atụ metụtara alụmdi na nwunye na ọgbakọ
  choice: Mesaịa
  alternative: Kraịst
  rationale: ‘Mesaịa’ na-echekwa ihe aha ọkwá Grik ahụ pụtara ma ọ naghị ebubata ozizi pụrụ iche nke otu ụka.
- issue: Oke echiche ịchụ àjà dị na παρέδωκεν ὑπὲρ αὐτῆς
  choice: nyefere onwe ya n’ihi ya
  alternative: were onwe ya nye maka ya
  rationale: Nhọrọ a na-egosi nrara onwe ya nye n’ihi ọgbakọ ahụ, ma ọ naghị agbakwụnye nkọwa mgbapụta nke okwu Grik ahụ ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. ‘Ndị bụ di’ na ‘nwunye unu’ bụ okwu mmekọrịta alụmdi na nwunye; ‘ọgbakọ ahụ’ na-egosi ndị kwere ekwe dịka otu ndị mmadụ. E tinyere akara ndetu [a] n’akụkụ ‘Mesaịa,’ ebe ndetu ahụ metụtara ya.
