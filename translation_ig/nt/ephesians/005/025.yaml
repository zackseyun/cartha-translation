revisions:
- from: Ndị bụ di, hụnụ nwunye unu n’anya, dịka Mesaịa[a] hụkwara ọgbakọ ahụ n’anya ma nyefere onwe ya n’ihi ya[b],
  to: Ndị di, hụnụ ndị nwunye unu n’anya, dịka Mesaịa[a] hụkwara ọgbakọ ahụ n’anya ma nyefere onwe ya maka ya[b],
  rationale: The revision corrects the benefit/on-behalf-of force of ὑπέρ with maka ya, improves the natural plural marital address, and adjusts the lexical-alternative footnote while preserving the Greek’s scope, register, personification, and ambiguity-free wording.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:17:00Z'
review_pass:
  verdict: revise
  source_fidelity: The main clause accurately conveys the imperative, the comparison with the Messiah’s love for the church, and his voluntary self-giving. However, n’ihi ya more readily expresses motive (‘because of it/her’) than ὑπὲρ αὐτῆς, which here is self-giving for the church’s benefit; maka ya is the closer equivalent.
  naturalness: Ndị bụ di is understandable but less idiomatic as a direct address than Ndị di. In this plural, relational address, ndị nwunye unu is clearer and more natural than the bare singular collective nwunye unu.
  terminology: Mesaịa appropriately preserves the title sense of Χριστός and its footnote is well anchored. Ọgbakọ ahụ is a viable rendering of ἐκκλησία as the corporate people. The revised wording retains these choices.
  issues:
  - severity: medium
    issue: n’ihi ya for ὑπὲρ αὐτῆς
    rationale: This can mean ‘because of it/her’ and therefore shifts the relation toward cause or motive. Maka ya naturally expresses ‘for/on behalf of her,’ the sense required here.
  - severity: low
    issue: Ndị bụ di, nwunye unu
    rationale: These are intelligible, but Ndị di and ndị nwunye unu are more idiomatic Standard Igbo for a plural direct address to husbands concerning their wives.
  - severity: low
    issue: Footnote b’s alternative wording
    rationale: The existing alternative is broadly understandable, but rara onwe ya nye is a more natural alternative expression for voluntary self-surrender and retains the ‘for her’ relation with maka ya.
  revised_text: Ndị di, hụnụ ndị nwunye unu n’anya, dịka Mesaịa[a] hụkwara ọgbakọ ahụ n’anya ma nyefere onwe ya maka ya[b],
  revised_footnotes:
