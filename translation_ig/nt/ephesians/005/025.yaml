    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “rara onwe ya nye maka ya.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the benefit/on-behalf-of force of ὑπέρ with maka ya, improves the natural plural marital address, and adjusts the lexical-alternative footnote while preserving the Greek’s scope, register, personification, and ambiguity-free wording.
