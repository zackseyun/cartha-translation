  terminology: “Obi ọma” communicates goodwill/willing benevolence naturally; “na-eje ozi” is an appropriate contextual rendering of δουλεύοντες without obscuring the slavery setting already made explicit in the preceding context. “Onyenwe anyị” maintains the theological force of κύριος.
