id: EPH.6.7
reference: Ephesians 6:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μετ’ εὐνοίας δουλεύοντες, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/007.yaml
  text: serving with goodwill[a], as to the Lord and not to men,
translation:
  language: ig
  text: jirinụ obi ọma na-eje ozi, dị ka unu na-ejere Onyenwe anyị ozi, ọ bụghịkwa mmadụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụ mmadụ”; Grik na-eme ka ụmụ mmadụ dị iche n’Onyenwe anyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: jirinụ obi ọma
  rationale: Nkebi a na-egosi mmụọ na ebumnuche ọma onye ji eje ozi. “Jirinụ obi ọma” bụ Igbo dị mfe ma na-egosipụta ịdị njikere na ihu ọma dị n’ime mmadụ.
- source_word: δουλεύοντες
  choice: na-eje ozi
  rationale: Okwu a pụtara ije ozi dị ka ohu; ebe amaokwu ndị gbara ya gburugburu kọwara ọnọdụ ohu ahụ, “na-eje ozi” na-eme ka ahịrịokwu ahụ bụrụ Igbo ebumpụta ụwa n’emeghị ka ọnọdụ ahụ funahụ n’isiokwu dum.
- source_word: ὡς
  choice: dị ka
  rationale: “Dị ka” na-echekwa ntụnyere na ụzọ e si eje ozi, na-agbakwụghị echiche “dị ka a ga-asị” nke nwere ike ime ka mmekọrịta ahụ yie ihe echepụtara echepụta.
- source_word: τῷ κυρίῳ
  choice: Onyenwe anyị
  rationale: Nke a na-echekwa aha nsọ nke κύριος ma na-egosi Onye-nwe Kraịst, nke dị iche na ndị nwe ohu nke ụwa a kpọrọ aha n’okwu gbara ya gburugburu.
- source_word: ἀνθρώποις
  choice: mmadụ
  rationale: Ọ bụ ezie na Grik jiri ọtụtụ mmadụ, “mmadụ” n’Igbo nwere ike ịrụ ọrụ mkpokọta, na-egosikwa ụmụ mmadụ n’ozuzu ha n’iche ha na Onyenwe anyị, n’enweghị mgbagwoju anya nke ntụgharị na-ezo naanị aka n’ụmụ nwoke.
theological_decisions:
- issue: Ntughari κύριος n’iche ya na ndị nwe ohu mmadụ
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” na-echekwa aha Kraịst ma na-egbochi ịgwakọta ya na ndị nna ukwu mmadụ ndị a na-ekwu maka ha n’akụkụ a.
- issue: Ogo a ga-eji gosipụta echiche ịgba ohu dị na δουλεύοντες
  choice: na-eje ozi
  alternative: na-eje ozi dị ka ndị ohu
  rationale: Amaokwu 6:5 akọwala na ndị a na-agwa okwu bụ ndị ohu. Ya mere, ntụgharị dị mfe ebe a na-echekwa echiche omume ahụ, ebe ọnọdụ mmekọrịta ohu ahụ ka pụtara ìhè n’okwu gbara ya gburugburu.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwụ ọtọ ma nwee nsọpụrụ. E ji iwu ọtụtụ mmadụ “jirinụ” kwekọọ na ndị a na-agwa okwu, ma ahịrịokwu ahụ ka na-aga n’ihu dịka nkebi participle nke amaokwu ndị gbara ya gburugburu.
