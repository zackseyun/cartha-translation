  source_fidelity: The rendering preserves the participial exhortation, the disposition expressed by μετ’ εὐνοίας (“jirinụ obi ọma”), the comparison/manner introduced by ὡς, and the contrast between service directed to the Lord and to human beings. “Onyenwe anyị” appropriately renders τῷ κυρίῳ in this christological context.
