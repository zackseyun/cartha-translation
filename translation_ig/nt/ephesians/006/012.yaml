id: EPH.6.12
reference: Ephesians 6:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ ⸀σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: ig
  text: N'ihi na mgba anyị abụghị megide anụ ahụ na ọbara[a], kama ọ bụ megide ndị ọchịchị, megide ikike ọchịchị, megide ndị na-achị ụwa nke ọchịchịrị a[b], megide ndị mmụọ nke ajọ omume n'ebe eluigwe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịgba mgba anyị abụghị megide anụ ahụ na ọbara.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị na-achị ụwa nke ọchịchịrị dị ugbu a.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n'ebe eluigwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: mgba
  rationale: Okwu a na-egosi mgba ihu na ihu, karịchaa ịgba mgba; “mgba” bụ okwu Igbo doro anya nke na-echekwa ihe atụ ahụ n’enweghị ime ka ọ bụrụ naanị otu ụdị ọgụ.
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: megide anụ ahụ na ọbara
  rationale: Ọ bụ akpaala okwu na-ezo aka n’ụmụ mmadụ. E debere okwu anụ ahụ na ọbara kama ịkọwa ya naanị dị ka “ụmụ mmadụ,” ka ihe oyiyi nke okwu Grik dịgide.
- source_word: ἀρχάς
  choice: ndị ọchịchị
  rationale: N’ebe a, okwu a na-ezo aka n’ike ma ọ bụ ndị na-achị; “ndị ọchịchị” bụ okwu Igbo nke oge a, dịkwa mfe nghọta.
- source_word: ἐξουσίας
  choice: ndị nwere ikike
  rationale: Nhọrọ a na-echekwa echiche nke ikike e ji achị ma mee ka ọdịiche ya na ἀρχάς pụta ìhè.
- source_word: κοσμοκράτορας
  choice: ndị na-achị ụwa
  rationale: Nke a na-egosipụta kpọmkwem ngwakọta echiche dị n’okwu Grik—ndị ọchịchị nke ụwa—n’enweghị iji okwu nkà mmụta okpukpe na-adịghị mfe nghọta.
- source_word: τοῦ σκότους τούτου
  choice: nke ọchịchịrị a
  rationale: A sụgharịrị njikọ mkpụrụokwu ahụ nso n’asụsụ Grik. E tinyeghị “nke ugbu a,” n’ihi na okwu kwekọrọ na ya adịghị n’ederede.
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: ike mmụọ nke ajọ omume
  rationale: Adjective neuter plural a na-arụ ọrụ dịka aha na-ezo aka n’ike ma ọ bụ ndị mmụọ. “Ike mmụọ” na-eme ka nke ahụ doo anya ma ghara ịkọwapụta ụdị ha karịa ihe ederede kwuru.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: n’ebe ndị dị n’eluigwe
  rationale: Nkebiokwu a na-ezo aka n’ógbè eluigwe ma na-apụta ugboro ugboro n’Akwụkwọ Ndị Efesọs. Nhọrọ a bụ Igbo nkịtị ma na-echekwa obosara echiche ahụ.
theological_decisions:
- issue: Ụdị ndị iro a kpọrọ aha n’amaokwu a
  choice: A kọwara ha dị ka ike mmụọ karịrị ụmụ mmadụ.
  alternative: Okwu ndị ahụ pụrụ ịgụnye ndị ọchịchị mmadụ na usoro ọchịchị ha, ma ọ bụ ma ike mmụọ ma ngosipụta ha n’ụwa.
  rationale: Nchịkọta okwu ndị ahụ, karịchaa κοσμοκράτορας na τὰ πνευματικὰ τῆς πονηρίας, na-atụ aka ozugbo n’ebe ndị iro mmụọ nọ. Agbanyeghị, nsụgharị ahụ anaghị ekwu na ha enweghị ike igosipụta ọrụ ha site n’usoro ụwa.
- issue: Ihe σάρξ pụtara n’ebe a
  choice: A sụgharịrị ya dịka “anụ ahụ” n’ime akpaala okwu “anụ ahụ na ọbara,” ọ bụghị dịka ọdịdị mmehie.
  alternative: Ọdịdị mmehie.
  rationale: N’ebe a, σάρξ so na akpaala okwu na-ezo aka n’ụmụ mmadụ nwere ahụ; ọ bụghị ojiji Pọl ji ya akọwa ọchịchọ ma ọ bụ ọdịdị mmehie.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi “megide” nke ederede Grik iji nye ahịrịokwu ahụ ike na usoro. Akara nkọwa ụkwụ niile [a], [b], na [c] pụtara n’isi ederede.
