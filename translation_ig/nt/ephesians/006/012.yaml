    text: Ma ọ bụ, “ndị na-achị ụwa nke ọchịchịrị dị ugbu a.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n'ebe eluigwe.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the source text's repeated structure, its contrast with human opponents, and the ambiguity of the classifications of hostile powers. It corrects the singular rendering of the substantival plural τὰ πνευματικά, improves the natural expression of ἐξουσίαι, and removes the unsupported “various” from footnote c.
