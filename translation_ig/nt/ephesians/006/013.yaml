revisions:
- from: N’ihi ya, burunụ ngwa agha zuru ezu nke Chineke[a], ka unu wee nwee ike iguzogide[b] n’ụbọchị ọjọọ[c], ma mgbe unu mechara ihe niile[d], guzosie ike.
  to: N’ihi ya, werenụ ngwa agha niile nke Chineke[a], ka unu wee nwee ike iguzogide[b] n’ụbọchị ọjọọ[c], ma mgbe unu mechara ihe niile[d], guzosie ike.
  rationale: The revision replaces a less precise imperative with idiomatic “werenụ” for taking up armor, uses the more natural inclusive expression “ngwa agha niile,” and corrects the lexical footnote for ἀντιστῆναι. It retains the source text’s ambiguity and military register without importing doctrinal interpretation.
