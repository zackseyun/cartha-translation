review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the inferential force, purpose clause, broad genitive in “nke Chineke,” the open-ended “ụbọchị ọjọọ,” and the sequence of resisting, completing all that is required, and standing firm. However, “burunụ” primarily means “carry,” whereas ἀναλάβετε in this military exhortation is more naturally rendered “werenụ” (“take up”).
  naturalness: “Werenụ ngwa agha niile nke Chineke” is more idiomatic Standard Igbo for taking up the complete military equipment. The remaining clause structure is clear, formal, and suitable for the passage’s exhortative register.
  terminology: “Ngwa agha niile” idiomatically conveys πανοπλία as the complete set of armor/equipment. The alternative for ἀντιστῆναι should be “iguzosi megide,” not “ịlụso ya ọgụ,” which can add the stronger notion of fighting and lacks an expressed object in the current footnote.
  issues:
  - severity: medium
    issue: “burunụ” for ἀναλάβετε
    rationale: “Burunụ” normally means “carry.” In this context the imperative calls readers to take up the armor; “werenụ” conveys this naturally without changing the imagery.
  - severity: low
    issue: Footnote b gives “ịlụso ya ọgụ” as an alternative
    rationale: This wording can suggest active fighting rather than resisting/standing against, and “ya” has no antecedent in the verse. “Iguzosi megide” is a closer lexical alternative.
  revised_text: N’ihi ya, werenụ ngwa agha niile nke Chineke[a], ka unu wee nwee ike iguzogide[b] n’ụbọchị ọjọọ[c], ma mgbe unu mechara ihe niile[d], guzosie ike.
