language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: ig
  text: N’ihi ya, werenụ ngwa agha niile nke Chineke[a], ka unu wee nwee ike iguzogide[b] n’ụbọchị ọjọọ[c], ma mgbe unu mechara ihe niile[d], guzosie ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ngwa agha zuru ezu nke Chineke.” Okwu Grik a na-ezo aka n’ihe niile onye agha ji akwadebe onwe ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “iguzosi megide.”
    reason: lexical_alternative
  - marker: c
    text: “Ụbọchị ọjọọ” nwere ike ịpụta oge ajọ ihe ma ọ bụ ọnwụnwa siri ike n’ozuzu ya; ọ bụghị iwu na ọ na-ezo naanị n’otu ụbọchị pụrụ iche n’oge ikpeazụ.
    reason: alternative_reading
  - marker: d
    text: A pụkwara ịsị, “mgbe unu mezuru ihe niile” ma ọ bụ “mgbe unu rụchara ihe niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi ya
  rationale: Ọ bụ njikọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya; okwu a bụ nke doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ἀναλάβετε
  choice: burunụ
  rationale: Ngwaa a pụtara iweli ma ọ bụ iburu ihe iji ya rụọ ọrụ. “Burunụ” dabara n’ihe atụ gbasara ngwa agha karịa ịsị nanị ka ha yikwasị ya.
- source_word: τὴν πανοπλίαν
  choice: ngwa agha zuru ezu
  rationale: πανοπλία na-ezo aka n’ihe niile onye agha ji akwadebe onwe ya, ọ bụghị otu ngwa agha naanị. “Zuru ezu” na-echekwa echiche nke ihe agha niile dị mkpa.
- source_word: τοῦ θεοῦ
  choice: nke Chineke
  rationale: 'A hapụrụ njikọ genitive a ka ọ saa mbara: ọ pụrụ ịbụ ngwa agha nke Chineke nwe, nke o nyere, ma ọ bụ nke sitere n’aka ya. Nsụgharị ahụ akọwaghị ya karịa ihe Grik kwuru.'
- source_word: ἵνα δυνηθῆτε
  choice: ka unu wee nwee ike
  rationale: Nke a na-egosi nzube yana ikike ime ihe, n’enweghị itinye echiche ọzọ na-adịghị n’ederede.
- source_word: ἀντιστῆναι
  choice: iguzogide
  rationale: N’ọnọdụ agha a, okwu ahụ pụtara iguzo megide mwakpo ma ghara ikwe ka a kwatuo mmadụ.
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: n’ụbọchị ọjọọ
  rationale: Nsụgharị a na-echekwa ịdị mkpụmkpụ na ịdị saa mbara nke okwu Grik ahụ, n’akọwaghị ma ọ bụ otu ụbọchị pụrụ iche ma ọ bụ oge ọnwụnwa.
- source_word: ἅπαντα κατεργασάμενοι
  choice: mgbe unu mechara ihe niile
  rationale: Nkebi a nwere ike ịpụta imezu ma ọ bụ ịrụcha ihe niile ọnọdụ ahụ chọrọ. “Mechara ihe niile” na-echekwa obosara nke okwu ahụ n’ebughị ụzọ kwuo na ha emeriela kpamkpam.
- source_word: στῆναι
  choice: guzosie ike
  rationale: N’ihe atụ agha a, okwu ahụ na-egosi ịnọgide n’ọnọdụ mmadụ n’akwụsịghị; “guzosie ike” na-eweta nke a n’Igbo dị ndụ ma dị ebube.
theological_decisions:
- issue: Ihe “ụbọchị ọjọọ” pụtara
  choice: E debere ya ka ọ bụrụ ụbọchị ma ọ bụ oge ajọ ihe na ọgụ ime mmụọ, n’akọwaghị ya kpọmkwem.
  alternative: Otu ụbọchị ikpeazụ pụrụ iche, ma ọ bụ otu ụbọchị ọnwụnwa nke onwe onye.
  rationale: Okwu Grik ahụ nwere ike ịgụnye oge mmegide siri ike, ma ọ naghị amanye ka a ghọta ya naanị dị ka ụbọchị ikpeazụ.
- issue: Ike njikọ dị na “ngwa agha ... nke Chineke”
  choice: E ji “nke Chineke” hapụ njikọ ahụ ka ọ saa mbara.
  alternative: Ngwa agha Chineke ji n’onwe ya, ma ọ bụ ngwa agha Chineke na-enye ndị ya.
  rationale: Genitive Grik ahụ nwere ike ibu echiche abụọ a; ịhọrọ naanị otu ga-eme ka nsụgharị ahụ dị warara karịa isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ agha na nkwughachi echiche nke iguzogide na iguzosi ike, ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa ga-eme ka ihe edemede ahụ dị warara.
