id: EPH.6.18
reference: Ephesians 6:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ πάσης προσευχῆς καὶ δεήσεως, προσευχόμενοι ἐν παντὶ καιρῷ ἐν πνεύματι, καὶ εἰς ⸀αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ δεήσει περὶ πάντων τῶν ἁγίων,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/018.yaml
  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: ig
  text: Jirinụ ekpere na arịrịọ niile na-ekpe ekpere mgbe niile n’ime Mmụọ Nsọ[a]. Maka nke a kpọmkwem, nọgidenụ na-amụ anya, jirinụ ntachi obi niile na arịrịọ maka ndị nsọ niile[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime mmụọ.” Grik nwere ike ịpụta nke a n’ụzọ sara mbara, ma n’ọnọdụ okwu a, o yikarịrị ka ọ na-ezo aka na Mmụọ Nsọ.
    reason: alternative_reading
  - marker: b
    text: “Ndị nsọ” n’ebe a pụtara ndị Chineke niile e doro nsọ, ya bụ ndị niile kwere ekwe.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “jirinụ ntachi obi niile n’arịrịọ.”
    reason: previous_rendering
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: Jirikwanụ ekpere na arịrịọ dị iche iche niile
  rationale: “Jirikwanụ” na-egosi ụzọ ma ọ bụ ihe e ji eme ihe nke διά na genitive na-egosi; “ekpere” bụ okwu izugbe, ebe “arịrịọ” na-egosi ịrịọ ihe kpọmkwem. “Dị iche iche niile” na-eme ka echiche ụdị ekpere niile doo anya n’Igbo.
- source_word: προσευχόμενοι ἐν παντὶ καιρῷ
  choice: na-ekpe ekpere mgbe niile
  rationale: Ọ na-edobe usoro participle ahụ ma na-egosipụta ike zuru ezu nke παντὶ καιρῷ n’Igbo nkịtị.
- source_word: ἐν πνεύματι
  choice: n’ime Mmụọ Nsọ
  rationale: N’ọnọdụ a, ọ yikarịrị ka πνεῦμα na-ezo aka na Mmụọ Nsọ; e debere ihe ọzọ Grik nwere ike ịpụta n’ala peeji.
- source_word: εἰς αὐτὸ ἀγρυπνοῦντες
  choice: Ka unu na-amụ anya maka nke a kpọmkwem
  rationale: “Maka nke a kpọmkwem” na-echekwa nkwusiri ike nke αὐτό, ebe “na-amụ anya” na-egosi nche na ịghara ịda ụra nke ἀγρυπνεῖν.
- source_word: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει
  choice: jiri ntachi obi niile nọgide na-arịọ arịrịọ
  rationale: Nsụgharị a na-egosi ma προσκαρτέρησις, ya bụ ịnọgidesi ike, ma δέησις, ya bụ arịrịọ; ọ na-agụkwa nke ọma n’Igbo ma ghara ikpebi kpamkpam ma okwu abụọ ahụ hà nhata ma ọ bụ na nke mbụ na-akọwa nke abụọ.
- source_word: περὶ πάντων τῶν ἁγίων
  choice: maka ndị nsọ niile
  rationale: “Ndị nsọ” na-echekwa okwu Pọl ji akpọ ndị Chineke kewapụtara nye onwe ya, ya bụ ndị niile kwere ekwe, ọ bụghị naanị otu ndị pụrụ iche e mesịrị kpọọ ndị nsọ.
theological_decisions:
- issue: Ihe πνεύματι na-ezo aka na ya
  choice: Mmụọ Nsọ (“n’ime Mmụọ Nsọ”)
  alternative: mmụọ mmadụ ma ọ bụ ikpe ekpere n’ụzọ ime mmụọ (“n’ime mmụọ”)
  rationale: Ọnọdụ okwu ahụ—karịsịa “mma agha nke Mmụọ” n’amaokwu 17 na ojiji Pọl—na-akwado Mmụọ Nsọ. Ma ebe Grik enweghị article ma nwee ike ịgụ ya n’ụzọ sara mbara, e debere nhọrọ ọzọ n’ala peeji.
- issue: Ihe ἅγιοι pụtara
  choice: ndị Chineke niile e doro nsọ, ya bụ ndị niile kwere ekwe
  alternative: naanị ndị e mesịrị kwupụta n’usoro ụka dịka ndị nsọ pụrụ iche
  rationale: N’akwụkwọ Pọl, ἅγιοι bụ aha obodo ndị kwere ekwe niile; ọ bụghị aha otu nta e nyere nsọpụrụ pụrụ iche.
- issue: Mmekọrịta προσκαρτερήσει na δεήσει
  choice: ịdịgide na-arịọ arịrịọ
  alternative: “jiri ntachi obi niile na arịrịọ niile” dịka ihe abụọ e depụtara n’otu ọkwa
  rationale: Καί na-akwado ịkọwa ha dịka ihe abụọ, ma okwu ahụ nwekwara ike ime ka “ntachi obi” kọwaa otú e si arịọ arịrịọ. Isi ederede na-enye Igbo ebumpụta ụwa ma ala peeji na-echekwa nsụgharị kwụ ọtọ ọzọ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “unu” mee ka plural nke participles pụta ìhè. Ahịrịokwu ahụ bụ n'ihu ndụmọdụ malitere n’amaokwu ndị bu ya ụzọ; “Jirikwanụ” na “Ka unu” na-eme ka njikọ ahụ bụrụ ihe a na-anụ nke ọma n’Igbo.
