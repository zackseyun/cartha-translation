id: EPH.6.1
reference: Ephesians 6:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν ὑμῶν ἐν κυρίῳ, τοῦτο γάρ ἐστιν δίκαιον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: ig
  text: Ụmụ, ruberenụ ndị mụrụ unu isi n’ime Onyenwe anyị,[a] n’ihi na nke a ziri ezi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dịka ndị nke Onyenwe anyị” / “n’ịdị n’otu na Onyenwe anyị.” Okwu ahụ bụ “n’ime Onyenwe anyị” nwere ike ịkọwa ọnọdụ ma ọ bụ ụzọ e si erube isi; ọ pụkwara igosi na nrubeisi dị otú ahụ dị n’okpuru nrubeisi nye Onyenwe anyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: Ụmụntakịrị
  rationale: Okwu a na-akpọ ụmụ nọ n’ezinụlọ okwu ozugbo; “Ụmụntakịrị” na-egosi mmekọrịta ha na ndị mụrụ ha n’ụzọ doro anya ma kwekọọ n’Igbo a na-asụ ugbu a.
- source_word: ὑπακούετε
  choice: ruberenụ ... isi
  rationale: Iwu a pụtara ige ntị ma mee ihe e kwuru, ọ bụghị naanị ịnụ okwu; “irubere mmadụ isi” bụ ụzọ Igbo si ekwu nrubeisi n’ụzọ ebumpụta ụwa.
- source_word: γονεῦσιν
  choice: ndị mụrụ unu
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị akọwa nne na nna ọnụ.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: 'A hapụrụ okwu Pọl n’ụdị ya dị mkpirikpi ka ọ nọgide nwee nghọta sara mbara: ọ pụrụ igosi ọnọdụ ma ọ bụ ụzọ e si erube isi, ma ọ bụ mmekọrịta ụmụ ahụ na Onyenwe anyị.'
- source_word: δίκαιον
  choice: ziri ezi
  rationale: N’ebe a, okwu ahụ pụtara ihe kwesịrị ekwesị n’omume ma dị mma n’ụzọ omume; “ziri ezi” bụ okwu Igbo doro anya ma dị mma n’ahịrịokwu a.
theological_decisions:
- issue: Ókè na ihe okwu “n’ime Onyenwe anyị” pụtara
  choice: 'E jikọtara ya na iwu ahụ: “ruberenụ ndị mụrụ unu isi n’ime Onyenwe anyị,” ma hapụ nghọta ya ka ọ ghe oghe.'
  alternative: Ọ pụrụ ịpụta na ụmụ ndị nọ n’ime Onyenwe anyị ga-erubere ndị mụrụ ha isi, ma ọ bụ na ha ga-erubere ha isi dịka o kwesịrị n’ime Onyenwe anyị.
  rationale: N’asụsụ Grik, ἐν κυρίῳ yiri ka ọ na-akọwa iwu ὑπακούετε, ma kpọmkwem ihe ọ pụtara apụtaghị kpamkpam. Nsụgharị a anaghị ekpebi ma ọ na-ekwu banyere njirimara ụmụ ahụ, ọnọdụ ma ọ bụ ụzọ nrubeisi ha, ma ọ bụ ókè nrubeisi ahụ nwere n’ihi iguzosi ike n’ebe Onyenwe anyị nọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ruberenụ ... isi” bụ akpaalaokwu Igbo ebumpụta ụwa maka nrubeisi, ebe “n’ime Onyenwe anyị” na-echekwa mkpirikpi okwu Pọl na nghọta ya ghe oghe.
