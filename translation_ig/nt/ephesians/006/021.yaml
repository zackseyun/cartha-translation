revisions:
- from: Ma ka unu onwe unu wee marakwa ihe ndị metụtara m[a], na ihe m na-eme, Taịkikọs, nwanna a hụrụ n’anya na onye ozi kwesịrị ntụkwasị obi n’ime Onyenwe anyị[b], ga-eme ka unu mata ihe niile.
  to: Ma ka unu kwa wee mata ihe ndị metụtara m[a], na ihe m na-eme, Taịkikọs, nwanna a hụrụ n’anya na onye na-eje ozi kwesịrị ntụkwasị obi n’ime Onyenwe anyị[b], ga-eme ka unu mata ihe niile.
  rationale: The revision replaces reflexive emphasis with the additive force required by καὶ ὑμεῖς, and renders διάκονος as functional service rather than as a messenger role or a definite church office. It retains the source's broad wording for Paul’s affairs, the purpose construction, and the respectful Pauline register. Footnotes preserve the stated alternatives and remain anchored to the revised expressions.
