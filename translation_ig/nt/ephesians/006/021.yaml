id: EPH.6.21
reference: Ephesians 6:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἵνα δὲ ⸂εἰδῆτε καὶ ὑμεῖς⸃ τὰ κατ’ ἐμέ, τί πράσσω, πάντα ⸂γνωρίσει ὑμῖν⸃ Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: ig
  text: Ma ka unu kwa wee mata ihe ndị metụtara m[a], na ihe m na-eme, Taịkikọs, nwanna a hụrụ n’anya na onye na-eje ozi kwesịrị ntụkwasị obi n’ime Onyenwe anyị[b], ga-eme ka unu mata ihe niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ọnọdụ m”; okwu Grik ahụ pụtara n’ụzọ nkịtị “ihe ndị metụtara m.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “ohu kwesịrị ntụkwasị obi.” Okwu Grik διάκονος nwekwara ike ịpụta “ohu” ma ọ bụ, n’ọnọdụ ụfọdụ, “dikọn.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: Ma ka ... wee
  rationale: ἵνα na-egosi nzube, ebe δέ bụ njikọ dị nro; “Ma ka ... wee” na-edobe ha abụọ n’Igbo dị mma.
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: unu onwe unu wee marakwa
  rationale: “marakwa” na “unu onwe unu” na-egosipụta echiche mgbakwunye na nkwusi ike dị na καὶ ὑμεῖς.
- source_word: τὰ κατ’ ἐμέ
  choice: ihe ndị metụtara m
  rationale: Nke a na-anọ nso n’okwu Grik ma na-ahapụ ohere ka ọ pụta ọnọdụ Pọl ma ọ bụ ihe ndị banyere ya n’ozuzu.
- source_word: τί πράσσω
  choice: ihe m na-eme
  rationale: Ntụgharị kwụ ọtọ ma bụrụ nke ndị na-agụ Igbo taa ga-aghọta ngwa ngwa.
- source_word: πάντα γνωρίσει ὑμῖν
  choice: ga-eme ka unu mata ihe niile
  rationale: Na-edobe ụdị causative nke γνωρίζω, ya bụ ime ka mmadụ mara ihe.
- source_word: Τυχικὸς
  choice: Taịkikọs
  rationale: E dere aha ahụ n’ụzọ kwekọrọ na ụda ya ma dị mfe ịgụ n’Igbo.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: nwanna a hụrụ n’anya
  rationale: “Nwanna” na-ebute mmekọrịta ezinụlọ nke ndị kwere ekwe, ebe “a hụrụ n’anya” na-egosipụta ἀγαπητός.
- source_word: πιστὸς διάκονος
  choice: onye ozi kwesịrị ntụkwasị obi
  rationale: “Onye ozi” na-egosipụta ọrụ διάκονος n’ebe a n’etinyeghị echiche na ọ bụ aha ọkwa chọọchị kpọmkwem; “kwesịrị ntụkwasị obi” na-egosipụta πιστός.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Na-edobe okwu Pọl a na-ejikarị akọwa mmekọrịta ma ọ bụ ọnọdụ mmadụ n’ime Onyenwe anyị.
theological_decisions:
- issue: Ihe διάκονος pụtara banyere Taịkikọs
  choice: onye ozi
  alternative: ohu; dikọn
  rationale: Ọnọdụ a na-akọwa Taịkikọs dịka onye ọrụ a pụrụ ịtụkwasị obi; ọ naghị egosi nke ọma na διάκονος bụ aha ọkwa chọọchị n’ebe a.
- issue: Ntụgharị ἀδελφός
  choice: nwanna
  alternative: nwanne nwoke
  rationale: Taịkikọs bụ nwoke, ma “nwanna” bụ okwu Igbo ebumpụta ụwa nke na-egosikwa mmekọrịta ime mmụọ n’etiti ndị kwere ekwe.
- issue: Ntụgharị κύριος
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: Nke a bụ aha Pọl ji akpọ Onyenwe anyị Jizọs, ya mere “Onyenwe anyị” na-edobe ịdị arọ nke aha ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị nsọ n’ụzọ kwesịrị ekwesị. Ahịrịokwu ahụ na-edobe nhazi na nghọta Grik, ma jiri okwu ndị mmadụ na-asụ nke ọma. Akara nkọwa ala [a] na [b] dị n’ederede isi.
