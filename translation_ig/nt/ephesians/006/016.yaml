source:
  edition: SBLGNT
  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: ig
  text: N’ọnọdụ niile, bulienụ ọta nke okwukwe, nke unu ga-eji nwee ike menyụọ àkụ niile[a] ndị e tinyere ọkụ[c] nke ajọ onye ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘ihe ndị a na-agbapụ n’agha’; okwu Grik βέλη bụ aha sara mbara maka ihe a na-agbapụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ ‘ajọ ihe’ kama ‘ajọ onye ahụ.’ Okwu Grik ahụ nwere ike ịpụta ajọ ihe n’ozuzu ya, ọ bụ ezie na nghọta nke na-ekwu maka onye dabara nke ọma n’ihe gbasara agha a.
    reason: alternative_reading
  - marker: c
    text: Nsụgharị ọdịnala bụ ‘àkụ ndị na-ere ọkụ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: N’ọnọdụ niile
  rationale: 'N’usoro ndepụta ngwa agha a, okwu a na-arụ ọrụ dị ka nkọwa ọnọdụ: ‘n’ọnọdụ niile.’ Nke a bụ Igbo doro anya ma ghara ịgbatị ihe odide ahụ.'
- source_word: ἀναλαβόντες
  choice: bulienụ
  rationale: Ọ bụ participle aorist nke jikọrọ ya na ndụmọdụ ndị dị n’usoro a. Iji iwu ‘bulienụ’ na Igbo na-eme ka njikọ ahụ doo anya ma debe echiche nke iweli ma ọ bụ iwere ngwa agha.
- source_word: θυρεὸν
  choice: ọta
  rationale: ‘Ọta’ bụ okwu Igbo a na-aghọta nke ọma maka ngwa agha nchebe ahụ; ọ na-edebe ihe atụ agha nke Grik θυρεός.
- source_word: τῆς πίστεως
  choice: nke okwukwe
  rationale: ‘Okwukwe’ bụ nsụgharị kwesịrị ekwesị nke πίστις n’ebe a, ebe ọta ahụ na-anọchi anya ịdabere n’ebe Chineke nọ.
- source_word: ἐν ᾧ
  choice: nke unu ga-eji
  rationale: Nke a na-egosi ụzọ ma ọ bụ ngwa e ji eme ihe, ma na-ezo azụ n’ọta ahụ n’ụzọ dị mma n’Igbo.
- source_word: δυνήσεσθε
  choice: ga-eji nwee ike
  rationale: Okwu a na-edebe ma ọdịnihu ma echiche nke ikike ime ihe.
- source_word: βέλη
  choice: àkụ
  rationale: βέλη bụ aha sara mbara maka ihe a na-agbapụ n’agha. ‘Àkụ’ bụ okwu dị mfe ma kwekọọ nke ọma n’ihe atụ a; a kọwara obosara okwu Grik ahụ n’ala peeji.
- source_word: τοῦ πονηροῦ
  choice: nke ajọ onye ahụ
  rationale: N’ọnọdụ agha ime mmụọ a, ịgụ ya dị ka onye—‘ajọ onye ahụ’—kacha kwekọọ. Ma ebe Grik nwekwara ike ịpụta ajọ ihe n’ozuzu ya, e debere nke ahụ n’ala peeji.
- source_word: πεπυρωμένα
  choice: na-enwu ọkụ
  rationale: Nke a na-enye ihe oyiyi nke ihe ndị a mụnyere ọkụ ma na-ere, n’Igbo dị ndụ ma doo anya.
- source_word: σβέσαι
  choice: menyụọ
  rationale: ‘Menyụọ’ na-egosi imenyụ ọkụ kpamkpam ma na-edebe ihe oyiyi dị na ngwaa Grik σβέννυμι.
theological_decisions:
- issue: Ihe τοῦ πονηροῦ pụtara
  choice: ajọ onye ahụ
  alternative: ajọ ihe
  rationale: Ihe gbasara agha ime mmụọ na mwakpo na-akwado nghọta nke na-ekwu maka onye. Agbanyeghị, e tinyeghị nghọta nke ‘ajọ ihe’ n’akụkụ, kama e debere ya n’ala peeji n’ihi na ụtọasụsụ Grik kwere ya.
- issue: Nsụgharị πίστις
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N’ebe a, ‘okwukwe’ na-egosi nzaghachi onye kwere ekwe nke ịdabere na Chineke, ma na-edebe okwu nkà mmụta okpukpe a maara nke ọma n’enweghị ịmanye nkọwa otu ụka.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe ihe atụ agha, ọdịnihu nke ikike, na mgbagwoju anya dị n’okwu τοῦ πονηροῦ; ala peeji na-egosi nhọrọ okwu ndị dị mkpa.
