revisions:
- from: N’ọnọdụ niile, bulienụ ọta nke okwukwe, nke unu ga-eji nwee ike menyụọ àkụ niile[a] na-enwu ọkụ[c] nke ajọ onye ahụ.[b]
  to: N’ọnọdụ niile, bulienụ ọta nke okwukwe, nke unu ga-eji nwee ike menyụọ àkụ niile[a] ndị e tinyere ọkụ[c] nke ajọ onye ahụ.[b]
  rationale: The revision is limited to making the Greek πεπυρωμένα (“having been set on fire”) more exact and idiomatic in Standard Igbo, and to aligning its traditional-rendering footnote with that sense. It retains the draft’s meaning, register, ambiguity note, and all footnote anchors.
