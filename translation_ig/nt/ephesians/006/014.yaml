  variant: Standard Igbo
source:
  edition: SBLGNT
  text: στῆτε οὖν περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ, καὶ ἐνδυσάμενοι τὸν θώρακα τῆς δικαιοσύνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/014.yaml
  text: Stand[a], therefore, having fastened your waist with truth and having put on the breastplate of righteousness[b],
translation:
  language: ig
  text: Ya mere, guzonụ, ebe unu jiworo eziokwu kee úkwù unu ma yikwasịrị onwe unu ihe nchebe obi nke ezi omume[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ihe nchebe obi nke ikpe ziri ezi.” Okwu Grik ahụ bụ δικαιοσύνη nwere ike ịpụta ma ezi omume ma ikpe ziri ezi n’akwụkwọ ozi Pọl.
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆτε
  choice: guzonụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha guzo. Nsụgharị a na-edebe ihe okwu Grik ahụ pụtara n’enweghị itinye ‘sienụ ike,’ nke okwu ahụ n’onwe ya ekwughị kpọmkwem.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi na iwu a sitere n’ihe a kwurula n’amaokwu ndị bu ya ụzọ.
- source_word: περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ
  choice: ebe unu jiworo eziokwu kee úkwù unu
  rationale: Nke a na-edebe ‘úkwù unu’ dị ka ihe omume ahụ metụtara, na ‘eziokwu’ dị ka ihe e ji eme ya, n’etinyeghị ‘eriri’ nke na-adịghị n’ederede Grik. ‘Jiworo’ na-egosi omume participle a rụcharala nke na-akwado iwu bụ́ ‘guzonụ.’
- source_word: ἐνδυσάμενοι
  choice: yikwasịkwa
  rationale: Ọ bụ okwu a na-eji maka iyikwasị uwe ma ọ bụ ngwa agha; ụdị a dị nkenke ma bụrụ Igbo a na-asụ ugbu a.
- source_word: θώρακα
  choice: ihe nchebe obi
  rationale: Ọ na-akọwa ngwa agha na-echebe obi na obi mmadụ gburugburu n’asụsụ ndị mmadụ ga-aghọta ngwa ngwa.
- source_word: δικαιοσύνης
  choice: nke ezi omume
  rationale: ‘Ezi omume’ bụ ụzọ Igbo doro anya isi kwuo righteousness, ma a hapụrụ ‘ikpe ziri ezi’ dịka nghọta ọzọ n’ala ala peeji.
theological_decisions:
- issue: Ihe δικαιοσύνη pụtara n’ihe atụ ngwa agha Pọl
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: ‘Ezi omume’ dabara n’ojiji Pọl na ihe atụ a, ma okwu Grik ahụ nwekwara ike ịgụnye echiche nke ikpe ziri ezi; ya mere e debeghị naanị otu nghọta ahụ ka ọ bụrụ nke a na-apụghị ịgbanwe.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A zere okwu ochie na nkọwa agbakwunyere dịka ‘eriri eziokwu,’ ebe ọ bụ na ‘eriri’ apụtaghị kpọmkwem n’ederede Grik. Akara ala ala peeji [a] dị n’isi ederede n’ebe okwu ọ na-akọwa dị.
