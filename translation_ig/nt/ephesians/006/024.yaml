  text: ἡ χάρις μετὰ πάντων τῶν ἀγαπώντων τὸν κύριον ἡμῶν Ἰησοῦν Χριστὸν ἐν ⸀ἀφθαρσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: ig
  text: Ka amara dịnyere ndị niile hụrụ Onyenwe anyị Jizọs, bụ Mesaya, n’anya n’ịdị adịghị emebi emebi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “ji ịhụnanya na-adịghị emebi emebi,” “n’ezi obi,” ma ọ bụ “ji ịhụnanya na-adịghị anwụ anwụ.” Nkebiokwu Grik a, “n’ịdị adịghị emebi emebi,” dị mkpirikpi; o doghị anya kpamkpam ma ọ na-akọwa ịhụnanya ha, ma ọ bụ àgwà/ọnọdụ nke ngọzi ahụ.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa χάρις, ọ dabakwara n’ụdị ngọzi e ji emechi akwụkwọ ozi Pọl.
- source_word: μετὰ πάντων
  choice: Ka ... dịnyere ndị niile
  rationale: Ọ bụ ezie na ahịrị Grik enweghị ngwaa, “Ka ... dịnyere” na-egosipụta ọchịchọ ngọzi ahụ n’ụzọ Igbo dị n'okike, ebe “ndị niile” na-anọchi πάντων.
- source_word: ἀγαπώντων
  choice: hụ ... n’anya
  rationale: E mere participle ahụ ka ọ bụrụ nkebiokwu na-akọwa ndị mmadụ, nke bụ ụzọ Igbo doro anya ma na-echekwa echiche ịhụnanya na-adịgide.
- source_word: κύριον
  choice: Onyenwe
  rationale: “Onyenwe” bụ nsụgharị kwesịrị ekwesị nke κύριος dịka aha nsọpụrụ e nyere Jizọs.
- source_word: Ἰησοῦν Χριστόν
  choice: Jizọs, bú Mesaya
  rationale: “Mesaya” na-eme ka ihe Χριστός pụtara dịka aha ọkwa pụta ìhè; “bú” na-ejikọta aha ahụ na aha ọkwa ahụ n’Igbo dị n'okike.
- source_word: ἐν ἀφθαρσίᾳ
  choice: ji ịhụnanya na-adịghị emebi emebi
  rationale: N’Igbo, okwu nkịtị dịka “n’ime enweghị mmebi” agaghị edo anya nke ọma. Isi ahịrị na-ejikọta àgwà ahụ na ịhụnanya, ma ihe odide ala ala na-edebe nghọta ndị ọzọ n’ihi mkpirikpi na mgbagwoju anya nke Grik.
theological_decisions:
- issue: Ihe ἐν ἀφθαρσίᾳ na-akọwa
  choice: Jikọta ya na ịhụnanya dịka “ji ịhụnanya na-adịghị emebi emebi,” ma tinye ihe ịrịba ama ala ala
  alternative: “n’ezi obi” ma ọ bụ “n’ọnọdụ na-adịghị emebi emebi”
  rationale: Nkebiokwu Grik ahụ dị mkpirikpi ma nwee ike ịkọwa ịhụnanya na-adịghị agwụ agwụ, ezi obi, ma ọ bụ ọnọdụ/àgwà nke enweghị mmebi. Igbo chọrọ ntakịrị nkọwa ka ahịrị ahụ bụrụ nke a pụrụ ịghọta; ihe odide ala ala na-egbochi nsụgharị ahụ ịmechi naanị otu nghọta.
translation_notes:
  register: Standard Igbo; asụsụ ngọzi dị ùgwù ma dị mfe nghọta. E jiri “dịnyere” kama usoro okwu siri ike, ma debe mgbagwoju anya nke nkebiokwu ikpeazụ n’ihe odide ala ala.
