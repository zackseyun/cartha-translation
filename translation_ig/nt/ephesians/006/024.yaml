    text: 'A pụkwara ịsụgharị ya: “ji ịhụnanya na-adịghị emebi emebi,” “n’ezi obi,” ma ọ bụ “ji ịhụnanya na-adịghị anwụ anwụ.” Nkebiokwu Grik a, “n’ịdị adịghị emebi emebi,” dị mkpirikpi; o doghị anya kpamkpam ma ọ na-akọwa ịhụnanya ha, ma ọ bụ àgwà/ọnọdụ nke ngọzi ahụ.'
    reason: alternative_reading
  revision_rationale: The revision retains the source phrase’s abstract form, “n’ịdị adịghị emebi emebi,” rather than supplying “ịhụnanya” in the main text. Thus it avoids deciding a genuinely disputed syntactic relationship, while the footnote gives natural Igbo interpretations, including the draft’s preferred “imperishable love” reading.
