  yaml_path: translation/nt/ephesians/006/002.yaml
  text: Honor your father and mother—which is the first commandment with a promise—[a]
translation:
  language: ig
  text: “Sọpụrụ nna gị na nne gị”—nke bụ iwu mbụ nwere nkwa e jikọtara na ya—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ dabara nnọọ n'okwu Grik, “iwu mbụ n'ime nkwa.” Ihe ọ pụtara bụ na nke a bụ iwu mbụ e jikọtara na nkwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμα
  choice: Sọpụrụ
  rationale: Ọ bụ iwu nke na-akpọ mmadụ ka o jiri omume gosi nne na nna ya nsọpụrụ, ọ bụghị naanị ka o nwee ezi echiche banyere ha.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: nna gị na nne gị
  rationale: Nke a bụ ụzọ Igbo nkịtị, doro anya si akọwa aha ezinụlọ ndị a.
- source_word: ἥτις ἐστὶν ἐντολὴ πρώτη
  choice: nke a bụ iwu mbụ
  rationale: “Nke a” na-ezo aka n'iwu e hotara; “mbụ” na-edobe usoro ordinal nke πρώτη n'enweghị ime ya ka ọ pụta “kachasị mkpa.”
- source_word: ἐν ἐπαγγελίᾳ
  choice: nke nkwa so ya
  rationale: Nke a na-egosi n'Igbo dị mfe na iwu ahụ nwere nkwa e jikọrọ ya, ma ihe odide nkịtị bụ “n'ime nkwa,” nke e debere na nkọwa ala peeji.
theological_decisions:
- issue: Ihe “iwu mbụ” pụtara n'ihe gbasara usoro Iwu Iri
  choice: iwu mbụ nke nkwa so ya
  alternative: iwu mbụ n'ime nkwa; iwu mbụ n'akụkụ nke abụọ nke Iwu Iri
  rationale: Nsụgharị a na-egosi na Pọl na-akọwa iwu a dị ka nke mbụ nke nkwa so ya, n'etinyeghị usoro otu ụka si agụ Iwu Iri ma ọ bụ ịgbanwe “mbụ” ka ọ bụrụ “kachasị mkpa.”
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Sọpụrụ” na-enye iwu ahụ ịdị arọ kwesịrị ya; akara ogologo na-egosi na nkebi na-esote bụ nkọwa Pọl banyere iwu ahụ.
