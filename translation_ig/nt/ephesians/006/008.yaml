id: EPH.6.8
reference: Ephesians 6:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ⸂ἕκαστος, ὃ ἂν⸃ ποιήσῃ ἀγαθόν, τοῦτο ⸀κομίσεται ⸀παρὰ κυρίου, εἴτε δοῦλος εἴτε ἐλεύθερος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/008.yaml
  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether servant or free.
translation:
  language: ig
  text: ebe unu maara na onye ọ bụla, ezi ihe ọ bụla o mere, ọ bụ ya ka ọ ga-anata[a] n’aka Onyenwe anyị, ma ọ̀ bụ ohu[b] ma ọ bụ onye nweere onwe ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onyenwe anyị ga-akwụghachi ya ụgwọ maka ya.” Ngwaa Grik ahụ nwekwara ike ịpụta ịnataghachi ihe kwekọrọ n’omume mmadụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ma ọ̀ bụ onye nọ n’ohu ma ọ bụ onye nweere onwe ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: ebe unu maara na
  rationale: Ọ na-ejigide njikọ participle ahụ na ndụmọdụ dị n’amaokwu bu ụzọ, ma na-egosikwa ntakịrị echiche nke ihe kpatara ya n’ụzọ Igbo si ada nke ọma.
- source_word: ἕκαστος
  choice: onye ọ bụla
  rationale: 'Nke a na-echekwa ike nkesa nke okwu ahụ: onye nke ọ bụla n’otu n’otu.'
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: ezi ihe ọ bụla o mere
  rationale: ‘Ọ bụla’ na-egosipụta indefiniteness nke ἄν, ebe ‘ezi ihe’ na-echekwa ịdị mma nke omume ahụ.
- source_word: τοῦτο
  choice: ọ bụ ya
  rationale: Ọ na-atụ aka kpọmkwem n’ezi ihe onye ahụ mere, dị ka demonstrative Grik ahụ si eme.
- source_word: κομίσεται
  choice: ọ ga-anata
  rationale: N’ebe a ngwaa ahụ pụtara ịnata ihe kwekọrọ n’omume mmadụ. Igbo ‘nata’ na-ada nke ọma; nkọwa ala peeji na-egosi echiche ọzọ nke ịkwụghachi ụgwọ.
- source_word: παρὰ κυρίου
  choice: n’aka Onyenwe anyị
  rationale: ‘N’aka’ na-egosi isi ebe ihe ahụ si abịa, ebe ‘Onyenwe anyị’ na-echekwa ịdị arọ nke κύριος dị ka aha nsọpụrụ nke Kraịst.
- source_word: δοῦλος
  choice: ohu
  rationale: N’ọnọdụ a, e ji ya tụnyere onye nweere onwe ya, ya mere ‘ohu’ na-egosipụta ọnọdụ ịbụ onye e ji n’agbụ kama ime ka ọ dị nro dịka naanị onye na-eje ozi.
- source_word: ἐλεύθερος
  choice: onye nweere onwe ya
  rationale: Nke a na-egosipụta onye na-abụghị ohu ma na-ada nke ọma n’Igbo ugbu a.
theological_decisions:
- issue: Nsụgharị δοῦλος n’ọnọdụ iwu ezinụlọ
  choice: ohu
  alternative: onye na-eje ozi
  rationale: Ntụnyere ya na ἐλεύθερος na-eme ka ọnọdụ ohu na nnwere onwe bụrụ isi okwu; ‘ohu’ anaghị ezobe ezi ọnọdụ mmekọrịta mmadụ nke amaokwu ahụ na-ekwu maka ya.
- issue: Onye κύριος na-ezo aka na ya na otu e si asụgharị ya
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: Ọ bụ ezie na gburugburu okwu ahụ na-ekwu banyere ndị nna ukwu mmadụ, ụgwọ ọrụ a si n’aka Onyenwe anyị dị nsọ abịa. Nhọrọ a na-echekwa ntụaka ahụ nwere ike ịbụ nke Kraịst n’emebighị mgbagwoju anya ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A hapụrụ nhazi ‘onye ọ bụla, ezi ihe ọ bụla o mere’ ka ọ chekwaa nkwusi ike Grik ahụ n’ebe onye nke ọ bụla nọ; e jikwa ‘ohu’ mee ka ọdịiche mmekọrịta mmadụ dị n’etiti δοῦλος na ἐλεύθερος doo anya.
