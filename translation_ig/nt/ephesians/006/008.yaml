  naturalness: The wording is clear, idiomatic Standard Igbo, and suitably formal. “Onye ọ bụla, ezi ihe ọ bụla o mere” preserves the Greek’s individualizing emphasis without sounding unnatural.
  terminology: “Ohu” correctly retains the bonded-status contrast with “onye nweere onwe ya,” rather than weakening it to a service role. “Onyenwe anyị” is an appropriate established rendering of κύριος in this context.
