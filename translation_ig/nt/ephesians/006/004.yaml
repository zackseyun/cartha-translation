  verdict: revise
  source_fidelity: Isi nsụgharị ahụ ziri ezi n’ịkpọ ndị nna kpọmkwem, n’ịmachibido ịkpalite iwe n’ime ụmụ, na n’iji “nke Onyenwe anyị” chekwaa obosara genitiv κυρίου. Otú ọ dị, “ọzụzụ” naanị ya anaghị egosipụta nke ọma akụkụ mgbazi/dọ aka ná ntị dị na παιδεία, ebe “ndụmọdụ” nwere ike ịdị ntakịrị obosara ma e jiri ya tụnyere νουθεσία.
  naturalness: “Ndị bụ nna, unu akpasula ụmụ unu iwe” bụ Standard Igbo dị mfe ma dị mma. “Ịdọ aka ná ntị na ndụmọdụ” bụkwa njikọta a na-ahụkarị ma na-ekewapụ mgbazi na nduzi okwu karịa “ọzụzụ na ndụmọdụ.”
  terminology: A gbanwere παιδεία ka ọ bụrụ “ịdọ aka ná ntị” iji debe echiche ọzụzụ na mgbazi; a debere νουθεσία dịka “ndụmọdụ,” nke n’ebe a pụtara ndụmọdụ nduzi na mgbazi. “Onyenwe anyị” kwesịrị ekwesị maka κυρίου, ma “nke” na-ahapụ njikọ ahụ n’enweghị ịmanye otu nkọwa.
