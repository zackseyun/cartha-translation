  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: ig
  text: Ndị bụ nna, unu akpasula ụmụ unu iwe,[a] kama zụlite ha n’ịdọ aka ná ntị na ndụmọdụ nke Onyenwe anyị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Unu emela ka ụmụ unu were iwe.” Ngwaa Grik ahụ pụtara ịkpalite iwe ma ọ bụ ime ka mmadụ nwee iwe n’obi.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “n’ọzụzụ na ịdụ ha ọdụ nke Onyenwe anyị.” Okwu “nke Onyenwe anyị” nwere ike ịpụta ihe sitere n’aka ya, ihe bụ nke ya, ma ọ bụ ihe ọ na-eduzi.
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: ndị bụ nna
  rationale: Okwu Grik a bụ kpọmkwem ọtụtụ nke nwoke, ya bụ ‘ndị nna’; ọ naghị ekwu ‘ndị nne na nna’ n'ozuzu. Nke a na-edobe onye Pọl kpọrọ okwu kpọmkwem.
- source_word: παροργίζετε
  choice: akpasula ... iwe
  rationale: Ngwaa a pụtara ime ka mmadụ wee iwe ma ọ bụ kpalie ya ka iwe were ya. Akpaalaokwu Igbo a na-egosipụta ike ime ka iwe bilie n'ime mmadụ.
- source_word: τέκνα
  choice: ụmụ unu
  rationale: N'ọnọdụ ezinụlọ a, okwu ahụ pụtara ụmụ mmadụ mụrụ, ma nwoke ma nwaanyị; ‘ụmụ unu’ bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: ἐκτρέφετε
  choice: zụlite ha
  rationale: Ọ bụ ezie na ngwaa a nwere ike ịpụta inye nri ma ọ bụ ịzụ, n'okwu banyere ụmụaka ọ pụtara ilekọta ha ka ha too na ịzụlite ha.
- source_word: παιδείᾳ
  choice: ọzụzụ
  rationale: Okwu ahụ gụnyere ịkpụzi omume, ịkụziri ihe, na ịdọ aka ná ntị ma ọ bụ ịgbazi mgbe ọ dị mkpa. ‘Ọzụzụ’ na-egosipụta ọrụ ịkpụzi mmadụ n'ozuzu ya.
- source_word: νουθεσίᾳ
  choice: ndụmọdụ
  rationale: Okwu a na-ezo aka n'okwu nduzi, ịdọ aka ná ntị, na mgbazi e ji eme ka mmadụ nwee ezi uche. ‘Ndụmọdụ’ bụ okwu dị mfe ma dị ugwu, ebe nkọwa ala peeji na-egosi akụkụ ịdọ aka ná ntị.
- source_word: κυρίου
  choice: nke Onyenwe anyị
  rationale: 'Ụdị njikọ a na-edobe mbara nghọta nke genitiv Grik: ọzụzụ na ndụmọdụ ahụ nwere ike ịbụ nke sitere n''aka Onyenwe anyị, nke bụ nke ya, ma ọ bụ nke ọ na-eduzi.'
theological_decisions:
- issue: Ndị okwu πατέρες na-agwa
  choice: A sụgharịrị ya kpọmkwem dịka ‘ndị bụ nna.’
  alternative: ndị nne na nna
  rationale: Grik kpọrọ ndị nna aha kpọmkwem. Ọ bụ ezie na ụkpụrụ ahụ nwere ike ịbara ndị nne na nna niile uru, nsụgharị ekwesịghị ịgbasa okwu ahụ karịa ihe e dere.
- issue: Ike genitiv κυρίου n'ahịrịokwu ahụ
  choice: E debere ya dịka ‘nke Onyenwe anyị.’
  alternative: sitere n'aka Onyenwe anyị; banyere Onyenwe anyị; dịka Onyenwe anyị si chọọ
  rationale: Genitiv ahụ nwere ike igosi ebe o si bịa, onye nwe ya, ụdị ya, ma ọ bụ onye ọ na-elekwasị anya. ‘Nke Onyenwe anyị’ anaghị amanye naanị otu nghọta.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma dị ugwu. ‘Unu ndị bụ nna’ na-eme ka ọkpụkpọ okwu ahụ doo anya; ‘zụlite ha’ bụ akpaalaokwu nkịtị maka ilekọta ụmụaka ka ha too. E debere ‘nke Onyenwe anyị’ iji chekwaa mgbagwoju anya dị na genitiv Grik.
