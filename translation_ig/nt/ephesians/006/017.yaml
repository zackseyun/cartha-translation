id: EPH.6.17
reference: Ephesians 6:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τὴν περικεφαλαίαν τοῦ σωτηρίου ⸀δέξασθε, καὶ τὴν μάχαιραν τοῦ πνεύματος, ὅ ἐστιν ῥῆμα θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/017.yaml
  text: And receive the helmet of salvation[a], and the sword of the Spirit, which is the word of God[b],
translation:
  language: ig
  text: Naranụ okpu agha nke nzọpụta[a], na mma agha nke Mmụọ Nsọ, nke bụ okwu Chineke[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “werenụ” okpu agha nke nzọpụta.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “okwu Chineke kwuru” ma ọ bụ “ozi Chineke”; okwu Greek rhēma nwere ike imesi okwu e kwuru ma ọ bụ ozi ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξασθε
  choice: Narakwanụ
  rationale: Ngwaa a bụ iwu e nyere ọtụtụ mmadụ, ọ pụkwara ịpụta ịnata ma ọ bụ iwere ihe e nyere. “Narakwanụ” na-egosipụta nke ọma na a na-anata ihe agha Chineke na-enye, ma na-adabara Igbo nke oge a.
- source_word: περικεφαλαίαν
  choice: okpu agha
  rationale: Nke a bụ aha ihe agha a na-eyi n’isi iji chebe ya; “okpu agha” bụ okwu Igbo doro anya ma bụrụkwa nke e ji eme ihe n’ihe atụ a.
- source_word: τοῦ σωτηρίου
  choice: nke nzọpụta
  rationale: Nhazi a na-edobe njikọ genitiv ahụ n’enweghị ịkọwa ya karịa ka Greek si kwuo; “nzọpụta” dabara n’ojiji Pọl ma ka nwere ike ịgụnye echiche nke nnapụta.
- source_word: μάχαιραν
  choice: mma agha
  rationale: Okwu Greek a na-ezo aka n’ngwa agha nwere agụba, mgbe ụfọdụ nke dị mkpụmkpụ. “Mma agha” bụ ụzọ Igbo kacha doo anya ma ghara ime ka ụdị ma ọ bụ ogologo ya bụrụ ihe ederede ekwughị.
- source_word: τοῦ πνεύματος
  choice: nke Mmụọ Nsọ
  rationale: N’ọnọdụ a, ọ kacha yie ka ọ na-ezo aka na Mmụọ Nsọ, onye mma agha ahụ sitere n’aka ya ma ọ bụ bụrụ nke ya. Ịsị “Mmụọ Nsọ” na-eme ka onye a na-ezo aka na ya doo onye Igbo anya.
- source_word: ὅ ἐστιν
  choice: nke bụ
  rationale: 'Nke a na-edobe ọrụ nkọwa nke ahịrịokwu Greek: ọ na-akọwa ihe mma agha ahụ bụ.'
- source_word: ῥῆμα θεοῦ
  choice: okwu Chineke
  rationale: “Okwu Chineke” bụ ntụgharị eke na nke a maara nke ọma. Ebe ῥῆμα nwekwara ike imesi okwu e kwuru ma ọ bụ ozi ike, a debere ihe ọzọ ahụ n’okpuru peeji.
theological_decisions:
- issue: Onye “Mmụọ” na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ ma ọ bụ ihe ime mmụọ n’ozuzu
  rationale: N’ihe atụ Pọl banyere ihe agha Chineke, genitiv a kacha dabara na Mmụọ Nsọ, karịsịa n’ihi na e mesịrị kọwaa mma agha ahụ dị ka okwu Chineke. Nke a na-egosipụta enyemaka sitere n’aka Chineke n’etinyeghị nkọwa nke ederede ekwughị.
- issue: Mmekọrịta dị n’etiti mma agha na okwu Chineke
  choice: “nke bụ” na-akọwa mma agha ahụ dịka okwu Chineke
  alternative: ịghọta pronoun ahụ dịka ọ na-ezo kpọmkwem naanị na Mmụọ
  rationale: Ọ bụ ezie na ὅ bụ neuter ma okwu “mma agha” na “Mmụọ” bụ masculine na Greek, neuter relative ahụ nwere ike na-ezo aka n’echiche ma ọ bụ ihe atụ dum. Ya mere, ntụgharị ahụ na-edobe nkọwa ahụ n’ụzọ eke n’Igbo n’enweghị ime ka syntax Greek sie ike karịa mkpa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Narakwanụ” na-aga n’ihu ndepụta iwu dị n’ihe atụ ihe agha, ebe “okpu agha” na “mma agha” na-edobe ihe atụ agha ahụ n’ụzọ doro anya. Akara nkọwa [a] na [b] dị n’ederede bụ isi dịka achọrọ.
