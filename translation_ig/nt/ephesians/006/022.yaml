  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: ig
  text: 'Ezigara m ya n’ebe unu nọ n’ihi nke a kpọmkwem: ka unu mara otú anyị dị[a], nakwa ka o gbaa obi unu ume.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka unu mara ọnọdụ anyị,” ma ọ bụ, “ka unu mara ihe ndị metụtara anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν ἔπεμψα πρὸς ὑμᾶς
  choice: Ezitere m ya ka ọ bịakwute unu
  rationale: Nnọchiaha a na-ezo aka na Taịkọs n’amaokwu bu ụzọ. N’Igbo, ‘ka ọ bịakwute unu’ na-egosipụta nke ọma mmegharị πρός n’usoro okwu iziga mmadụ.
- source_word: εἰς αὐτὸ τοῦτο
  choice: n’ihi kpọmkwem nke a
  rationale: ‘Kpọmkwem’ na-echekwa nkwusi ike dị na αὐτὸ τοῦτο ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἵνα γνῶτε τὰ περὶ ἡμῶν
  choice: ka unu mara otú anyị dị
  rationale: Nke a na-enye nghọta sara mbara banyere ọnọdụ na ihe metụtara Pọl na ndị ya, n’enweghị ime ka ọ bụrụ naanị ọnọdụ mpụga.
- source_word: καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν
  choice: ka o meekwa ka obi sie unu ike
  rationale: N’ọnọdụ a παρακαλέω na-ezo aka n’ịgba ume na iwusi ndị mmadụ ike; akpaalaokwu Igbo ‘ime ka obi sie mmadụ ike’ na-ebute echiche ahụ n'ụzọ eke, ma na-echekwa okwu banyere obi.
theological_decisions:
- issue: Ihe τὰ περὶ ἡμῶν pụtara
  choice: “otú anyị dị”
  alternative: “ọnọdụ anyị” ma ọ bụ “ihe ndị metụtara anyị”
  rationale: Asụsụ Grik nwere ike ịgụnye ma ọnọdụ onwe onye ma ọnọdụ ndị gbara ha gburugburu. ‘Otú anyị dị’ anaghị eme ka ihe ọ pụtara dị warara karịa isi mmalite.
- issue: Uche dị na παρακαλέσῃ τὰς καρδίας ὑμῶν
  choice: “ka obi sie unu ike”
  alternative: “ka ọ gbaa unu ume” ma ọ bụ “ka ọ kasie obi unu”
  rationale: Okwu Grik nwere ike ịpụta ịgba ume, ịkasi obi, ma ọ bụ ịdụ ọdụ. N’ebe a, iwusi obi ike dabara n’ọnọdụ ahụ ma ọ naghị ewebata nkọwa ụka pụrụ iche.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘unu’ mee ka ọnụọgụ ọtụtụ mmadụ nke ὑμᾶς doo anya.
