source:
  edition: SBLGNT
  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: ig
  text: Yirinụ ngwa agha niile nke Chineke[a], ka unu wee nwee ike iguzo megide atụmatụ aghụghọ[b] Ekwensu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ngwa agha Chineke zuru ezu.” Okwu Grik ahụ pụtara ihe niile onye agha ji akwadebe onwe ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ụzọ aghụghọ” ma ọ bụ “aghụghọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: Yirinụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha yi ihe n’ahụ. “Yirinụ” bụ okwu Igbo doro anya ma dabara n’oyiyi nke onye agha na-eyi ngwa agha ya.
- source_word: πανοπλίαν
  choice: ngwa agha niile
  rationale: Okwu Grik a na-ezo aka n’ihe niile onye agha ji akwadebe onwe ya, ọ bụghị naanị uwe nchebe. “Ngwa agha niile” na-egosi izu ezu ahụ n’Igbo dị mfe nghọta.
- source_word: τοῦ θεοῦ
  choice: nke Chineke
  rationale: '“Nke Chineke” na-ahapụ njikọ genitiv ahụ ka ọ saa mbara: ngwa agha ahụ bụ nke Chineke ma ọ bụ ihe o nyere, n’ebughị ụzọ kpebie otu nkọwa naanị.'
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: ka unu wee nwee ike iguzogide
  rationale: Nkebi a na-egosi ebumnuche. “Ka unu wee nwee ike” na-ekwupụta ebumnuche ahụ n’Igbo nkịtị, ebe “iguzogide” na-egosi iguzo n’ọnọdụ mmadụ megide onye iro.
- source_word: μεθοδείας
  choice: atụmatụ aghụghọ
  rationale: Okwu ahụ na-ezo aka n’ụzọ ma ọ bụ atụmatụ e ji aghụghọ eme ihe. “Atụmatụ aghụghọ” bụ okwu Igbo nke oge a, doo anya, ma chekwaa echiche nke aghụghọ na ebumnuche ọjọọ.
- source_word: τοῦ διαβόλου
  choice: Ekwensu
  rationale: N’ebe a, διάβολος bụ aha a maara nke onye iro ọjọọ ahụ, ọ bụghị naanị aha nkịtị maka onye nkwutọ. “Ekwensu” bụ nsụgharị Igbo a na-aghọta nke ọma.
theological_decisions:
- issue: Onye διάβολος na-ezo aka na ya na otú e si sụgharịa ya
  choice: Ekwensu, onye iro ọjọọ ahụ n’onwe ya
  alternative: onye nkwutọ
  rationale: Ọnọdụ okwu banyere ọgụ ime mmụọ n’Efesọs 6 na-akwado na ọ na-ezo aka n’onye iro ime mmụọ n’onwe ya, ọ bụghị naanị mmadụ na-ekwutọ ibe ya. Nsụgharị ahụ etinyeghị nkọwa ozizi ọzọ nke amaokwu ahụ na-ekwughị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ụdị iwu a gwara ọtụtụ mmadụ (“Yirinụ,” “unu”), ma chekwaa oyiyi agha na njikọ sara mbara dị na “nke Chineke.”
