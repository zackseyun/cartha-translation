language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ ἐμοῦ, ἵνα μοι δοθῇ λόγος ἐν ἀνοίξει τοῦ στόματός μου, ἐν παρρησίᾳ γνωρίσαι τὸ μυστήριον τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/019.yaml
  text: and for me[a], that words may be given to me in opening my mouth, to make known with boldness the mystery of the gospel[e][d][c][b],
translation:
  language: ig
  text: Kpeekwaranụ ekpere maka m kwa, ka e nye m okwu[a] mgbe m meghere ọnụ m[b], ka m jiri nkwuwa okwu[c] mee ka a mara ihe omimi nke ozi ọma[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ozi,” ma ọ bụ “okwu ndị m ga-ekwu.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “n'imeghe ọnụ m”; ya bụ, “ka m na-amalite ikwu okwu.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “jiri obi ike,” ma ọ bụ “n'atụghị egwu.”
    reason: lexical_alternative
  - marker: d
    text: “Ihe omimi nke ozi ọma” bụ nzube Chineke nke zoro ezo na mbụ ma ugbu a e mere ka a mara site n'ozi ọma ahụ.
    reason: meaning_clarification
lexical_decisions:
- source_word: καὶ ὑπὲρ ἐμοῦ
  choice: Kpeekwaranụ ekpere maka m kwa
  rationale: N'ọnọdụ amaokwu bu ụzọ, a na-ekwu banyere ikpe ekpere; ya mere, e mere ngwaa ahụ e zoro ezo ka ọ pụta ìhè n'Igbo, ebe “maka m kwa” na-edobe echiche nke ὑπὲρ ἐμοῦ.
- source_word: δοθῇ λόγος
  choice: ka e nye m okwu
  rationale: “Okwu” nwere ike ịpụta okwu e nyere Pọl ka o kwuo ma ọ bụ ozi ya; ọ na-edobekwa otu aha λόγος n'ụzọ dị mkpirikpi ma dị mma n'Igbo.
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: mgbe m meghere ọnụ m
  rationale: Nke a na-edobe ihe atụ nke imeghe ọnụ ma na-egosipụta ya n'Igbo nkịtị dịka oge ọ malitere ikwu okwu.
- source_word: ἐν παρρησίᾳ
  choice: jiri nkwuwa okwu
  rationale: “Nkwuwa okwu” na-egosipụta obi ike, nnwere onwe, na ikwu ihe n'ezoghị ọnụ, kama ịbụ naanị mmetụta nke ntụkwasị obi n'ime mmadụ.
- source_word: γνωρίσαι
  choice: mee ka a mara
  rationale: Nke a bụ ntụgharị kpọmkwem nke ime ka ihe bụrụ ihe a maara, n'ebughị ụzọ kpebie na ọ bụ naanị nkwusa n'ihu ọha ka e bu n'uche.
- source_word: τὸ μυστήριον τοῦ εὐαγγελίου
  choice: ihe omimi nke ozi ọma
  rationale: “Ihe omimi” na-ezo aka n'ebumnobi Chineke nke zoro ezo ma e mesịa mee ka a mara; “ozi ọma” bụ ntụgharị Igbo doro anya nke εὐαγγέλιον.
theological_decisions:
- issue: Ihe λόγος pụtara n'arịrịọ Pọl
  choice: okwu
  alternative: ozi; okwu ndị ọ ga-ekwu
  rationale: “Okwu” na-ahapụ ohere na ihe a na-enye bụ ma ọdịnaya nke ozi ahụ ma okwu kwesịrị ekwesị e ji kwuo ya, n'etinyeghị ozizi ọzọ n'ime ederede.
- issue: Ike nke παρρησία
  choice: jiri nkwuwa okwu
  alternative: jiri obi ike; n'atụghị egwu
  rationale: Nhọrọ a na-ejikọta obi ike na ikwu okwu n'ezoghị ọnụ, ma ọ naghị eme ka okwu ahụ bụrụ naanị obi ike dị n'ime mmadụ.
- issue: Ihe μυστήριον pụtara
  choice: ihe omimi
  alternative: ihe nzuzo
  rationale: “Ihe omimi” na-edobe okwu Pọl maka nzube Chineke nke a na-eme ka a mara, n'emeghị ya ka ọ bụrụ nanị ihe nzuzo mmadụ na-ezo.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, mee ihe. “Kpeekwaranụ” na-egosi na a na-agwa ọtụtụ ndị okwu ma na-eme ka arịrịọ ikpe ekpere e zoro n'amaokwu a pụta ìhè site n'ọnọdụ amaokwu bu ya ụzọ. E debere ihe atụ nke imeghe ọnụ na esemokwu dị n'etiti “okwu” na “ozi” site na ndetu ala peeji.
