  to: n'ihi nke a ka m ji bụrụ onye nnọchite anya n'agbụ,[a] ka m wee jiri nkwuwa okwu kwuo okwu banyere ya,[b] dị ka m kwesịrị ikwu.
  rationale: The revision makes the opening prepositional relationship explicit, uses the standard term for an ambassador, and otherwise preserves the draft's natural rendering. “Banyere ya” is retained as an idiomatic contextual expression for ἐν αὐτῷ, while the footnote records the more literal “n’ime ya” and the likely neuter antecedent.
