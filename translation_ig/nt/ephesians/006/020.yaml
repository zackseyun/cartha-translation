base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/020.yaml
  text: for which I am an ambassador in chains[a], so that in it I may speak boldly[c][b], as I ought to speak.
translation:
  language: ig
  text: n'ihi nke a ka m ji bụrụ onye nnọchite anya n'agbụ,[a] ka m wee jiri nkwuwa okwu kwuo okwu banyere ya,[b] dị ka m kwesịrị ikwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ọ bụ “n’otu agbụ.” Nke a na-egosi ọnọdụ Pọl dịka onye a tụrụ mkpọrọ.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ka m wee nwee nkwuwa okwu n’ime ya.” “Ya” yikarịrị ka ọ na-ezo aka n’oziọma ma ọ bụ ihe omimi ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ οὗ
  choice: nke m ji bụrụ onye nnọchi anya ya
  rationale: Οὗ bụ nnọchiaha neuter nke na-ezo aka n’“ihe omimi nke oziọma” n’amaokwu gara aga; nhazi a na-egosi na Pọl na-anọchi anya ihe ahụ n’ozi ya.
- source_word: πρεσβεύω
  choice: m bụ onye nnọchi anya
  rationale: Nke a na-echekwa echiche nke onye e zigara ka ọ nọchite anya onye ọzọ n’ọkwa ọchịchị, kama iji naanị okwu sara mbara dịka “onye nnọchite anya.”
- source_word: ἐν ἁλύσει
  choice: mgbe m nọ n’agbụ
  rationale: N’agbanyeghị na Grik ji otu “agbụ,” okwu Igbo a na-ada nke ọma ma na-echekwa onyinyo nke ịbụ onye mkpọrọ.
- source_word: ἵνα
  choice: ka m wee
  rationale: Ọ na-egosi nzube nke arịrịọ Pọl n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ἐν αὐτῷ
  choice: banyere ya
  rationale: Αὐτῷ bụ neuter ma yikarịrị ka ọ na-ezo aka n’oziọma ma ọ bụ ihe omimi ya; “banyere ya” na-egosipụta njikọ ahụ n’Igbo na-enweghị ime ka ọ bụrụ onye nwoke.
- source_word: παρρησιάσωμαι
  choice: kwuo ... n’atụghị egwu
  rationale: Ọ na-egosipụta ikwu okwu n’obi ike, n’ihu ọha, na-enweghị izochi eziokwu.
- source_word: ὡς δεῖ με λαλῆσαι
  choice: dị ka m kwesịrị ikwu
  rationale: Nke a na-echekwa echiche nke ibu ọrụ ma ọ bụ ihe dị mkpa ka Pọl mee, n’asụsụ Igbo dị mfe.
theological_decisions:
- issue: Ihe nnọchiaha οὗ na αὐτῷ na-ezo aka na ya
  choice: A ghọtara ha abụọ dịka ndị na-ezo aka n’oziọma ma ọ bụ “ihe omimi nke oziọma” dị n’amaokwu 19.
  alternative: Ụfọdụ nwere ike ịghọta nke mbụ dịka “onye m na-anọchi anya ya,” ma ọ bụ αὐτῷ dịka “n’ime ya” nke na-ezo aka n’ebe Kraịst nọ.
  rationale: Ụdị ụtọasụsụ Grik nke nnọchiaha abụọ ahụ bụ neuter, ya mere ihe ha kacha yie ka ha na-ezo aka na ya bụ “ihe omimi nke oziọma,” ọ bụghị onye.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “onye nnọchi anya” chekwaa onyinyo onye nnọchi anya gọọmenti, ebe “n’agbụ” na-egosipụta ọnọdụ onye mkpọrọ n'ụzọ e ji ekwu okwu n’Igbo.
