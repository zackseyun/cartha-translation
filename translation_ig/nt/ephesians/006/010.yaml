  yaml_path: translation/nt/ephesians/006/010.yaml
  text: Finally[a], be strengthened in the Lord and in the strength of his might.
translation:
  language: ig
  text: N’ikpeazụ[a], na-enwetakwanụ ike n’ime Onyenwe anyị, nakwa n’ike nke ike dị ukwuu ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ikpeazụ, dịnụ ike n’ime Onyenwe anyị.” Enwere ike iji ụzọ a dị mfe karị sụgharịa ngwaa Grik ahụ, ma “na-enwetakwanụ ike” na-egosi nke ọma na ike ahụ bụ ihe ha na-anata.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: N’ikpeazụ
  rationale: Ọ bụ okwu ntụgharị na-ewebata akụkụ mmechi nke akwụkwọ ozi ahụ; nke a bụ ụzọ doro anya ma bụrụkwa nke ndị Igbo na-asụ taa na-aghọta ngwa ngwa.
- source_word: ἐνδυναμοῦσθε
  choice: na-enwetanụ ike
  rationale: Ụdị iwu a nwere nghọta passive/middle. ‘Na-enwetanụ ike’ na-egosi na ike ahụ abụghị naanị ihe ndị na-agụ akwụkwọ ga-akpọpụta n’onwe ha, ma ọ ka bụ okwu Igbo dị mfe ma dị ndụ.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: E debere echiche nke ἐν dị ka ‘n’ime’ ka asụsụ Pọl banyere ọnọdụ na mmekọrịta mmadụ na Onyenwe anyị ghara ịghọ naanị ‘site n’aka Onyenwe anyị,’ nke ga-akọwa ụzọ e si enye ike karịa ka Grik kwuru.
- source_word: κράτει
  choice: n’ike
  rationale: κράτος na-egosi ike na-arụ ọrụ ma ọ bụ ike pụtara ìhè. ‘Ike’ bụ okwu Igbo nkịtị, dị ùgwù, ma dabara n’ahịrịokwu a.
- source_word: ἰσχύος
  choice: ịdị ike
  rationale: 'A họọrọ ‘ịdị ike’ iji mee ka okwu a dị iche ntakịrị na κράτος, ma chekwaa nchịkọta okwu abụọ gbasara ike dị na Grik: ‘ike nke ịdị ike ya.’'
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnọchiaha a na-alaghachi n’ebe Onyenwe anyị nọ. ‘Ya’ bụ ntụgharị kpọmkwem ma ọ dịghị mkpa ikwughachi ‘Onyenwe anyị.’
theological_decisions:
- issue: Voice na isi iyi nke ike dị na ἐνδυναμοῦσθε
  choice: 'A sụgharịrị ya dị ka ndụmọdụ ịnata ike: ‘na-enwetanụ ike.’'
  alternative: ‘Dịnụ ike.’
  rationale: Nhọrọ a na-echekwa nghọta passive/middle nke ngwaa ahụ ma na-egosi na ndị kwere ekwe anaghị adabere naanị n’obi ike nke onwe ha. N’agbanyeghị nke ahụ, ọ naghị akọwapụta usoro nkà mmụta okpukpe pụrụ iche nke amaokwu ahụ ekwughị.
- issue: Ntụgharị κύριος
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: N’ọnọdụ akwụkwọ ozi Pọl a, κύριος na-ezo aka n’Onyenwe anyị Jizọs. ‘Onyenwe anyị’ bụ okwu Igbo e ji nkwanye ùgwù na nghọta zuru ezu akọwa aha a, na-enweghị mgbakwunye nkọwa n’ime amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ahịrịokwu ‘n’ike nke ịdị ike ya’ ka ọ dị ntakịrị arọ n’ụzọ ziri ezi, n’ihi na Grik n’onwe ya chịkọtara okwu abụọ metụtara ike. Akara ndetu [a] pụtara n’isi ederede dịka achọrọ.
