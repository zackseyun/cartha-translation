- from: ka ihe wee gaara gị nke ọma, ka ị dịkwa ogologo ndụ n’elu ụwa.[a]
  to: ka ihe wee gaa gị nke ọma, ka ị wee bie ogologo ndụ n’elu ụwa.[a]
  rationale: The revision replaces the counterfactual-sounding “gaara” with the prospective idiomatic form “gaa,” and renders the promise of being long-lived as “bie ogologo ndụ.” It preserves the source’s single purpose/result framework in natural Igbo through parallel “ka … wee …” clauses and retains “n’elu ụwa,” with the Decalogue-related alternative maintained in the footnote.
  reviewer_model: gpt-5.6-terra
