  text: ἵνα εὖ σοι γένηται καὶ ἔσῃ μακροχρόνιος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/003.yaml
  text: so that it may go well with you and you may live long on the earth[a].
translation:
  language: ig
  text: ka ihe wee gaa gị nke ọma, ka ị wee bie ogologo ndụ n’elu ụwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ala ahụ,” dịka nkwughachi okwu iwu nke ise dị na Ọpụpụ 20:12 na Diuterọnọmi 5:16.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ka
  rationale: Ọ na-egosi nzube ma ọ bụ ihe ga-esi na ya pụta; “ka” bụ ụzọ Igbo ebumpụta ụwa si jikọta nkwa a na iwu dị n’amaokwu bu ụzọ.
- source_word: εὖ σοι γένηται
  choice: ihe wee gaara gị nke ọma
  rationale: Nkebiokwu a pụtara ka ọnọdụ ma ọ bụ ihe dịrị mmadụ mma; nsụgharị a na-edobe okwu onye nke abụọ ma na-ada nke ọma n’Igbo.
- source_word: καὶ
  choice: dịkwa
  rationale: “-kwa” na-ejikọta nkwa nke abụọ na nke mbụ n'ụzọ doro anya ma dị ire n’Igbo.
- source_word: ἔσῃ μακροχρόνιος
  choice: ị dịkwa ogologo ndụ
  rationale: Ọ bụ ezie na ἔσῃ bụ “ị ga-adị,” mgbe e jikọtara ya na μακροχρόνιος, ihe ọ pụtara bụ ịbụ onye nwere ogologo ndụ; “dị ogologo ndụ” na-echekwa usoro na echiche ahụ.
- source_word: ἐπὶ τῆς γῆς
  choice: n’elu ụwa
  rationale: Nke a na-agbaso okwu Grik e dere n’ebe a n’enweghị itinye okwu banyere ala ọgbụgba ndụ nke na-adịghị na nkebiokwu ahụ; “n’ala ahụ” ka bụ ihe ọzọ a pụrụ ịghọta n’ihi nkuzi nke iwu nke ise.
theological_decisions:
- issue: Ókè ihe ἐπὶ τῆς γῆς pụtara n’ihe metụtara nkwa dị n’iwu nke ise
  choice: n’elu ụwa
  alternative: n’ala ahụ
  rationale: Ebe okwu Grik nke Ndị Efesọs kwuru γῆ n’enweghị nkọwa nke na-eme ka ọ bụrụ kpọmkwem ala ọgbụgba ndụ, isi nsụgharị na-edobe nghọta sara mbara bụ “ụwa,” ma ihe odide ala peeji na-egosi nkwughachi okwu iwu nke ise.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ihe wee gaara gị nke ọma” mee ka akpaalaokwu Grik doo anya n’Igbo, ebe “n’elu ụwa” na-edobe obosara okwu isi mmalite.
