id: EPH.6.6
reference: Ephesians 6:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ κατ’ ὀφθαλμοδουλίαν ὡς ἀνθρωπάρεσκοι ἀλλ’ ὡς ⸀δοῦλοι Χριστοῦ ποιοῦντες τὸ θέλημα τοῦ θεοῦ, ἐκ ψυχῆς
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/006.yaml
  text: not by eye-service[a], as people-pleasers, but as servants of Messiah[c][b], doing the will of God from the soul.
translation:
  language: ig
  text: Ọ bụghị n’ụzọ nke ịrụ ọrụ naanị mgbe mmadụ na-ele ha anya[a], dị ka ndị na-achọ ime ndị mmadụ obi ụtọ, kama dị ka ndị ohu nke Mesaịa[b], na-eme uche Chineke site n’obi ha dum[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ọrụ anya”; ya bụ, ọrụ a na-arụ naanị mgbe onye ọzọ na-ele mmadụ anya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “Kraịst.” Okwu Grik bụ Christos, nke pụtara “Onye e tere mmanụ,” ya bụ, Mesaịa.
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsị, “site ná mkpụrụ obi.” Nke a pụtara iji ezi obi ma ọ bụ obi dum mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: ọrụ a na-arụ naanị mgbe a na-ele mmadụ anya
  rationale: Ngwakọta okwu Grik a na-ezo aka n’ọrụ mmadụ na-arụ nanị ka onye na-elekọta ya hụ ya. Nkọwa a bụ Igbo dị mfe ma na-edobe echiche nke ọrụ a na-eme naanị n’ihu anya mmadụ.
- source_word: ἀνθρωπάρεσκοι
  choice: ndị na-achọ ime ndị mmadụ obi ụtọ
  rationale: Nke a na-egosi ndị na-achọ nnwapụta mmadụ site n’ime ihe ga-atọ ndị mmadụ ụtọ; ntụgharị a bụ nke e ji eme ihe n’Igbo ugbu a ma na-edobe nkọcha dị n’okwu ahụ.
- source_word: δοῦλοι
  choice: ndị ohu
  rationale: N’akụkụ a, a na-agwa ndị bụ ohu n’eziokwu okwu, e mesịakwa kọwaa na ha bụ ndị nwe Mesaịa. ‘Ndị ohu’ na-edobe echiche nke ịbụ onye nọ n’okpuru ikike onye ọzọ.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: Χριστός bụ aha ọkwá nke pụtara Onye E Tere Mmanụ. ‘Mesaịa’ na-edobe ihe aha ọkwá ahụ pụtara kama ime ya naanị aha mmadụ.
- source_word: ποιοῦντες
  choice: eme
  rationale: Ọ na-egosi omume na-aga n’ihu n’otu oge ahụ; ‘eme’ bụ ntụgharị Igbo dị mfe ma kwụ ọtọ.
- source_word: θέλημα
  choice: uche
  rationale: N’ebe a ọ bụ ihe Chineke chọrọ ka e mee. ‘Uche Chineke’ bụ ụzọ Igbo a na-anabata nke ọma isi kwuo nke a.
- source_word: ἐκ ψυχῆς
  choice: na-eji obi ha dum
  rationale: Ọ bụ ezie na okwu ahụ bụ n’ụzọ nkịtị ‘site ná mkpụrụ obi,’ nkebiokwu Igbo ‘iji obi dum’ na-egosi ime ihe n’ezi obi na site n’ime mmadụ dum, n’enweghị ịgbanwe isi echiche ya.
theological_decisions:
- issue: Otú e si atụgharị δοῦλοι n’akụkụ iwu e nyere ndị nọ n’ezinụlọ
  choice: ndị ohu Mesaịa
  alternative: ndị na-ejere Kraịst ozi
  rationale: Ebe a na-ekwu kpọmkwem banyere ndị bụ ohu, ma jiri ọnọdụ ha tụnyere ịdị n’okpuru Mesaịa. ‘Ndị ohu’ na-edobe ike nke ihe odide Grik na echiche nke ịbụ nke Mesaịa.
- issue: Ma a ga-ewere Χριστοῦ dị ka aha ọkwá ka ọ bụ aha a na-akpọ mmadụ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a, okwu ahụ na-akọwa onye ndị ohu ahụ nwe ma na-erubere isi, ya mere echiche nke Onye E Tere Mmanụ dị ndụ. Ihe odide ahụ na-etinye ‘Kraịst’ dịka ụzọ ọzọ a pụrụ isi kwuo ya, n’ihi na ha abụọ sitere n’otu aha ọkwá ahụ.
- issue: Otú e si ghọta ἐκ ψυχῆς
  choice: na-eji obi ha dum
  alternative: site ná mkpụrụ obi
  rationale: A họọrọ ụzọ Igbo a na-anụkarị iji gosi ezi obi na itinye mmadụ dum n’ihe a na-eme, ebe nkọwa ala peeji na-edobe ọdịdị nkịtị na okwu gbasara ‘mkpụrụ obi.’
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A kọwara ‘ọrụ anya’ n’ahịrị isi ka okwu ahụ ghara ịbụ ihe mgbagwoju anya, ma debe ihe atụ nkịtị ya na nkọwa ala peeji. ‘Ndị ohu’ na-edobe ike nke δοῦλοι; ‘Mesaịa’ na-edobe Χριστός dịka aha ọkwá.
