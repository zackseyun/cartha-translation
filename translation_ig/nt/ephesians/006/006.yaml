review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast between service performed merely under observation, human-pleasing, belonging as slaves to the Messiah, and doing God's will wholeheartedly. ‘Ndị ohu’ appropriately preserves the force of δοῦλοι, and ‘Mesaịa’ validly renders Χριστοῦ as a title. The rendering of ἐκ ψυχῆς is a natural idiomatic equivalent, with the more literal wording retained in the note.
  naturalness: 'Two small syntactic revisions improve Standard Igbo: ‘n’ụzọ nke ịrụ ọrụ…’ more clearly expresses the Greek κατὰ construction than ‘site n’ọrụ…,’ and ‘ndị ohu nke Mesaịa’ supplies the natural Igbo possessive linkage. ‘Site n’obi ha dum’ is natural and appropriately modifies ‘na-eme.’'
  terminology: ‘Ndị ohu,’ ‘Mesaịa,’ ‘uche Chineke,’ and the explanatory treatment of ‘ọrụ anya’ are suitable. The Messiah footnote has been lightly normalized in capitalization and wording without adding theological interpretation.
  issues:
  - severity: medium
    issue: The opening phrase ‘ọ bụghị site n’ọrụ a na-arụ…’ is not the clearest Igbo equivalent of μὴ κατ’ ὀφθαλμοδουλίαν.
    rationale: ‘Site n’ọrụ’ can suggest source or means (‘from work’) rather than manner. ‘N’ụzọ nke ịrụ ọrụ…’ naturally expresses ‘not by way of/service characterized by.’
  - severity: low
    issue: ‘ndị ohu Mesaịa’ lacks the usual possessive connector.
    rationale: ‘Ndị ohu nke Mesaịa’ is more idiomatic Standard Igbo and clearly marks that they are the Messiah’s slaves.
