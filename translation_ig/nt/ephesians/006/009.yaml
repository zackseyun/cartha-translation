  to: Unu ndị nwe ha, mesokwanụ ha otu aka ahụ[a]. Kwụsịkwanụ iyi ha egwu[b], ebe unu maara na Onyenwe unu na nke ha nọ n’eluigwe[c], nakwa na ọ dịghị ele mmadụ anya n’ihu.
  rationale: The revision standardizes the divine title as “Onyenwe” and uses the natural possessive sequence “Onyenwe unu na nke ha,” which still states that the same heavenly Lord is Lord of both parties. Footnote c is adjusted to explain the Greek plural grammatically without suggesting separate heavens. No change is made to the verse’s meaning or historical social setting.
