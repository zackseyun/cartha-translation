    issue: The divine title is spelled “Onye-nwe.”
    rationale: “Onyenwe” is the more natural, conventional Standard Igbo form in this context.
  - severity: low
    issue: Footnote c glosses the Greek plural as “n’eluigwe dị iche iche.”
    rationale: This can suggest distinct heavens rather than simply explaining the Greek plural form. A grammatical explanation is clearer and preserves the idiomatic rendering without importing an unnecessary interpretation.
