id: EPH.6.9
reference: Ephesians 6:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: ig
  text: Unu ndị nwe ha, mesokwanụ ha otu aka ahụ[a]. Kwụsịkwanụ iyi ha egwu[b], ebe unu maara na Onyenwe unu na nke ha nọ n’eluigwe[c], nakwa na ọ dịghị ele mmadụ anya n’ihu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “meere ha otu ihe ndị ahụ.” Okwu Grik na-echetara iwu e nyere ha n’amaokwu bu ụzọ ma na-emesi mmekọrịta kwekọrọ ekwekọ ike.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “hapụ iyi ha egwu.” Okwu Grik nwere ike ịpụta ịkwụsị ma ọ bụ ịhapụ omume nke iyi mmadụ egwu.
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, okwu ahụ dị n’ọnụọgụ ọtụtụ, “n’eluigwe”; n’Igbo, “n’eluigwe” bụ ụzọ e si ekwu ya nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριοι
  choice: ndị nwe ha
  rationale: N’ebe a okwu ahụ na-ezo aka ná ndị nwe ndị ohu a kpọtụrụ aha n’amaokwu ndị bu ụzọ. “Ndị nwe ha” na-egosi mmekọrịta ahụ n’Igbo doro anya, n’etinyeghị echiche nke onye were mmadụ n’ọrụ nke oge a.
- source_word: τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς
  choice: mesokwanụ ha otu aka ahụ
  rationale: Nke a bụ ụzọ Igbo dị mma isi gosipụta ime ha otu ihe ahụ ma ọ bụ imeso ha n’ụzọ kwekọrọ n’iwu e nyere ha, ma na-echekwa isi okwu nke imeghachi omume ọma n’akụkụ abụọ.
- source_word: ἀνιέντες τὴν ἀπειλήν
  choice: Kwụsịkwanụ iyi ha egwu
  rationale: ἀνίημι pụtara ịhapụ ma ọ bụ ịkwụsị omume; ἀπειλή bụ iyi egwu. Nsụgharị a na-ekwu hoo haa ka ha kwụsị omume ahụ.
- source_word: εἰδότες
  choice: ebe unu maara
  rationale: Nkebi a na-egosi ihe mere e ji nye iwu ahụ. “Ebe unu maara” na-eweta njikọ ahụ n’Igbo eke ma na-echekwa echiche nke participle ahụ.
- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: Onye-nwe nke ha na nke unu
  rationale: A na-eji “Onye-nwe” maka κύριος nke eluigwe, ebe usoro “nke ha na nke unu” na-egosi na otu Onye-nwe ahụ bụ nke otu abụọ ahụ.
- source_word: ἐν οὐρανοῖς
  choice: n’eluigwe
  rationale: Ọ bụ ezie na okwu Grik dị n’ọnụọgụ ọtụtụ, “n’eluigwe” bụ ụzọ Igbo a na-asụkarị isi kwuo ọnọdụ Chineke n’eluigwe.
- source_word: προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ
  choice: ọ dịghị ele mmadụ anya n’ihu
  rationale: Akpaalaokwu Igbo a na-egosi nke ọma na Chineke adịghị akpa ókè ma ọ bụ họrọ mmadụ n’ihi ọkwa ya.
theological_decisions:
- issue: Otu lemma κύριος ji ezo aka ná ndị nwe mmadụ na Onye-nwe nke eluigwe n’otu amaokwu
  choice: Jiri “ndị nwe ha” maka ụmụ mmadụ, ma jiri “Onye-nwe” maka onye nọ n’eluigwe
  alternative: Jiri “ndị nwe” na “Nna Ukwu,” ma ọ bụ jiri otu ụdị “onye nwe” n’ebe abụọ ahụ
  rationale: Nhọrọ ahụ na-eme ka ndị na-agụ ya ghọta ndị a na-ekwu maka ha n’ebe ọ bụla, ma na-echekwa ọdịiche dị n’etiti ndị nwe ha n’ụwa na Onye-nwe nke ha abụọ n’eluigwe.
- issue: Mmekọrịta dị n’etiti iwu e nyere ndị ohu na nke e nyere ndị nwe ha
  choice: “mesokwanụ ha otu aka ahụ”
  alternative: “meere ha otu ihe ndị ahụ”
  rationale: Okwu Grik nwere ike ịpụta ime otu ihe ahụ ma ọ bụ imeso ha n’otu ụzọ ahụ. Nsụgharị bụ isi na-echekwa echiche nke mmekọrịta kwekọrọ ekwekọ n’enweghị ịkọwa kpọmkwem ihe niile “otu aka ahụ” gụnyere.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Mesokwanụ,” “Kwụsịkwanụ,” na “ebe unu maara” na-eme ka usoro iwu na ihe kpatara ya na-aga nke ọma. E zere “ndị were ha n’ọrụ” n’ihi na nke ahụ ga-eme ka usoro ndị ohu na ndị nwe ha n’oge ochie yie mmekọrịta ọrụ nke oge a.
