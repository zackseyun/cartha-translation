review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the principal clauses: an address to human masters, reciprocal conduct toward those under them, abandonment of threatening, the shared heavenly Lord, and divine impartiality. “Kwụsịkwanụ iyi ha egwu” appropriately conveys the present participial instruction to cease threatening.'
  naturalness: The verse is generally clear and suitably formal in Standard Igbo. However, “Onye-nwe” is less natural than the established modern form “Onyenwe,” and “Onyenwe unu na nke ha” is a more idiomatic possessive construction for the one Lord shared by both groups. The explanatory wording of footnote c should not imply multiple distinct heavens.
  terminology: “Ndị nwe ha” retains the ancient master–slave social relation without anachronistically recasting it as employment. “Onyenwe” appropriately distinguishes the heavenly κύριος from the human masters. “Ọ dịghị ele mmadụ anya n’ihu” is a natural Igbo idiom for the absence of partiality.
