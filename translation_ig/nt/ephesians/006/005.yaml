revisions:
- from: Ndị ohu, ruberenụ ndị bụ nna unu ukwu n'ụzọ anụ ahụ isi[a], n'egwu na ịma jijiji, jiri obi unu niile na-enweghị aghụghọ, dị ka unu si erubere Mesaya isi[b].
  to: Ndị ohu, ruberenụ ndị nna ukwu unu n'anụ ahụ[a] isi n'egwu na ịma jijiji, n'ezi obi unu, dị ka unu na-erubere Mesaya isi[b].
  rationale: The revision improves Standard Igbo word order, keeps the historically specific term for slaves, preserves the source’s “according to the flesh” language with an explanatory note, and renders sincerity of heart without interpretive expansion. Footnote markers remain attached to the corresponding source expressions.
