source:
  edition: SBLGNT
  text: Οἱ δοῦλοι, ὑπακούετε τοῖς ⸂κατὰ σάρκα κυρίοις⸃ μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/005.yaml
  text: Servants[a], obey your masters according to the flesh with fear and trembling, in sincerity of your heart, as to Messiah[b],
translation:
  language: ig
  text: Ndị ohu, ruberenụ ndị nna ukwu unu n'anụ ahụ[a] isi n'egwu na ịma jijiji, n'ezi obi unu, dị ka unu na-erubere Mesaya isi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“N''anụ ahụ”: ya bụ, ndị nna ukwu n''ihe gbasara ndụ mmadụ n''ụwa a naanị.'
    reason: lexical_alternative
  - marker: b
    text: Grik bụ “Kraịst”; a sụgharịrị ya “Mesaya” ebe a n'ihi na ọ bụ aha ọkwá.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλοι
  choice: Ndị ohu
  rationale: Okwu a na-ezo aka n’ebe a n’ebe ndị nọ n’okpuru ikike ndị nwe ha nọ; “ndị ohu” na-egosipụta ọnọdụ ahụ nke ọma karịa okwu dị nro dịka ndị na-eje ozi.
- source_word: ὑπακούετε
  choice: ruberenụ ... isi
  rationale: Nke a bụ ụzọ Igbo nkịtị ma doo anya isi kwuo nrubeisi e nyere iwu.
- source_word: κατὰ σάρκα κυρίοις
  choice: ndị bụ nna unu ukwu n'ụzọ anụ ahụ
  rationale: “Nna ukwu” dabara na mmekọrịta onye nwe ohu na ohu; “n'ụzọ anụ ahụ” na-echekwa okwu Grik nke na-akpa ókè n’etiti ikike mmadụ n’ụwa a na nke Mesaya.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: n'egwu na ịma jijiji
  rationale: Nsụgharị a na-echekwa ahịrịokwu siri ike na ụda okwu Grik n’enweghị ime ka ọ bụrụ naanị nkwanye ùgwù.
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: jiri obi unu niile na-enweghị aghụghọ
  rationale: Ọ na-egosipụta ma obi na-ekewaghị ekewa ma ezi obi nke ἁπλότης, n’asụsụ Igbo dị mfe nghọta.
- source_word: ὡς τῷ Χριστῷ
  choice: dị ka unu si erubere Mesaya isi
  rationale: Ọ na-eme ka ntụnyere ὡς doo anya n’Igbo, ma na-asụgharị Χριστός dịka aha ọkwá “Mesaya” kama ime ya aha mmadụ nkịtị.
theological_decisions:
- issue: Nsụgharị Χριστῷ
  choice: Mesaya
  alternative: Kraịst
  rationale: Χριστός na-arụ ọrụ dịka aha ọkwá ebe a; “Mesaya” na-enye ihe aha ọkwá ahụ pụtara, ebe “Kraịst” bụ mkpụrụokwu e si na Grik webata.
- issue: Nsụgharị δοῦλοι n'ọnọdụ ịgba ohu
  choice: Ndị ohu
  alternative: Ndị na-eje ozi
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ usoro ụlọ nke ndị mmadụ nọ n’okpuru ndị nwe ha; ya mere e kwesịghị iji okwu dị nro zoo ezi ọnọdụ mmekọrịta ahụ.
- issue: Ókè ikike ndị nna ukwu
  choice: n'ụzọ anụ ahụ
  alternative: nke ụwa a
  rationale: A hapụrụ ihe atụ “anụ ahụ” ka o chekwaa ọdịiche Pọl kwuru n’etiti mmekọrịta mmadụ nke ugbu a na nrubeisi nye Mesaya, n’agbanyeghị na akpaokwu ahụ nwere ike ịpụta “n’ụzọ mmadụ” ma ọ bụ “n’ụwa a.”
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere “egwu na ịma jijiji” n’ụdị ya siri ike, ma jiri “obi unu niile na-enweghị aghụghọ” mee ka ezi obi na obi na-ekewaghị ekewa pụta ìhè.
