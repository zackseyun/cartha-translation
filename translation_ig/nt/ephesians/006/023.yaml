  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰρήνη τοῖς ἀδελφοῖς καὶ ἀγάπη μετὰ πίστεως ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/023.yaml
  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: ig
  text: Udo dịrị ụmụnna[a], na ịhụnanya ya na okwukwe[b], sitere n’aka Chineke Nna na Onyenwe Jizọs, bụ́ Mezaya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na nwanyị.” Grik kwuru “ụmụnna” n’ụdị nwoke nke ọtụtụ, ma okwu ahụ nwere ike ịkpọ ndị niile kwere ekwe n’ọgbakọ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ịhụnanya na ikwesị ntụkwasị obi,” ma ọ bụ “ịhụnanya na ntụkwasị obi.” Okwu Grik ahụ nwere ike inwe nghọta ndị a, ọ bụ ezie na “okwukwe” bụ ntụgharị a họọrọ ebe a.
    reason: lexical_alternative
  - marker: c
    text: 'Grik: “Jizọs Kraịst.” N’ebe a, “Mezaya” na-asụgharị aha ọkwá Χριστός iji chekwaa ihe ọ pụtara.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰρήνη
  choice: Udo dịrị
  rationale: Aha ahụ guzoro dị ka ngọzi ma ọ bụ ọchịchọ; Igbo nkịtị chọrọ “dịrị” iji mee ka usoro ngọzi ahụ doo anya n’etinyeghị nkọwa ọzọ.
- source_word: τοῖς ἀδελφοῖς
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo dị ebube ma bụrụkwa nke a na-ejikarị akpọ ndị otu okwukwe; o nwere ike ịgụnye ọgbakọ niile n’agbanyeghị na Grik ji ụdị oke.
- source_word: ἀγάπη
  choice: ịhụnanya
  rationale: Nke a bụ ntụgharị Igbo a na-ahụkarị maka ἀγάπη, ma na-echekwa njikọ okwu ahụ n’akwụkwọ Pọl.
- source_word: μετὰ πίστεως
  choice: nke okwukwe so
  rationale: Ọ na-egosi na ịhụnanya na okwukwe na-esochi ibe ha. “Okwukwe” bụ isi nghọta πίστις ebe a, ma ihe ndị ọzọ okwu ahụ pụrụ ịpụta dị n’ala peeji.
- source_word: ἀπὸ
  choice: site n’aka
  rationale: 'Ọ na-egosi ebe ngọzi ndị a si bịa: n’aka Chineke Nna na Onyenwe anyị Jizọs Mezaya.'
- source_word: θεοῦ πατρὸς
  choice: Chineke Nna
  rationale: Grik ekwughị “anyị”; ya mere a naghị atụkwasị “anyị” n’ebe a.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo a na-ahụkarị ma dị ebube e si akọwa κύριος dị ka aha nsọpụrụ.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ́ Mezaya
  rationale: A sụgharịrị Χριστός dị ka aha ọkwá “Mezaya,” kama ide ya naanị dị ka “Kraịst”; “bụ́” na-eme ka aha ọkwá ahụ bụrụ Igbo ebumpụta ụwa.
theological_decisions:
- issue: Ntụgharị Χριστοῦ n’ime ngọzi mmechi
  choice: Mezaya
  alternative: Kraịst
  rationale: Χριστός ka nwere ihe ọ pụtara dị ka aha ọkwá nke Onye E Tere Mmanụ; “Mezaya” na-echekwa nghọta ahụ n’Igbo.
- issue: Ndị τοῖς ἀδελφοῖς na-ekwu maka ha
  choice: ụmụnna
  alternative: ụmụnna ndị nwoke na ndị nwanyị
  rationale: Ụdị Grik bụ oke n’ụtọasụsụ, ma n’akwụkwọ Pọl ọ na-akpọkarị ọgbakọ ndị kwere ekwe niile. Okwu Igbo “ụmụnna” na-arụ ọrụ nke ọma n’ụzọ abụọ ahụ; ala peeji na-eme ka nke a doo anya.
- issue: Ihe πίστις pụtara
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi ma ọ bụ ntụkwasị obi
  rationale: “Okwukwe” bụ nghọta ndabere ebe a, ma πίστις nwekwara ike ịpụta ikwesị ntụkwasị obi ma ọ bụ ntụkwasị obi; a hapụrụ ohere ndị ahụ n’ala peeji.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ebube ma doo ndị nkịtị anya. E debere usoro ngọzi dị mkpirikpi, ma jiri okwu Igbo ebumpụta ụwa mee ka njikọ ahịrịokwu ahụ doo anya.
