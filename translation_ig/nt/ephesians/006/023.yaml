revisions:
- from: Udo dịrị ụmụnna[a], ya na ịhụnanya nke okwukwe[b] so, site n’aka Chineke Nna na Onyenwe anyị Jizọs, bụ́ Mezaya[c].
  to: Udo dịrị ụmụnna[a], na ịhụnanya ya na okwukwe[b], sitere n’aka Chineke Nna na Onyenwe Jizọs, bụ́ Mezaya[c].
  rationale: The revision clarifies the accompaniment expressed by μετὰ πίστεως, removes the unrepresented possessive “anyị” from the title for Jesus, and improves the grammatical precision and idiomatic quality of the supporting notes. It retains the source’s concise blessing register, its ambiguity regarding the scope of “brothers,” and the title-sensitive rendering of Χριστός as “Mezaya.”
