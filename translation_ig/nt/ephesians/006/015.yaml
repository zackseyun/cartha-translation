revisions:
- from: unu eyikwala njikere nke ozi ọma nke udo ka akpụkpọ ụkwụ n’ụkwụ unu,[a]
  to: ma unu ejirila njikere nke ozi ọma nke udo yiwe ụkwụ unu akpụkpọ ụkwụ,[a]
  rationale: The revision replaces the potentially negative-sounding “eyikwala” with the positive perfective “ejirila,” which suitably reflects the participial “having [done so]” sense in the Greek. “Jiri … yiwe ụkwụ unu akpụkpọ ụkwụ” naturally conveys fitting the feet with footwear, while “njikere nke ozi ọma nke udo” leaves the Greek genitival relationship and the meaning of ἑτοιμασία open, as does the source.
  reviewer_model: gpt-5.6-terra
