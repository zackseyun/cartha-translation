  text: ma unu ejirila njikere nke ozi ọma nke udo yiwe ụkwụ unu akpụkpọ ụkwụ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịdị njikere”; ọ pụkwara ịpụta “njikere ikwusa ozi ọma nke udo,” ma ọ bụ “ntọala siri ike nke ozi ọma nke udo na-enye.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: eyikwala … ka akpụkpọ ụkwụ
  rationale: Ngwaa a pụtara iyikwasị ihe n’ụkwụ ma ọ bụ iyiri akpụkpọ ụkwụ. Nsụgharị a na-edobe ihe atụ nke ihe agha a na-eyi n’ụkwụ, ma na-eme ka okwu ahụ bụrụ Igbo eke.
- source_word: τοὺς πόδας
  choice: n’ụkwụ unu
  rationale: Okwu Grik ahụ pụtara ‘ụkwụ’ kpọmkwem; a hapụrụ akụkụ ahụ mmadụ ka ihe atụ ahụ doo anya.
- source_word: ἐν
  choice: ka
  rationale: N’ebe a, ἐν na-egosi ihe e ji kwadebe ụkwụ. ‘Ka akpụkpọ ụkwụ’ na-egosipụta ọrụ ya n’ihe atụ ahụ n’ụzọ Igbo na-aghọta nke ọma.
- source_word: ἑτοιμασίᾳ
  choice: njikere
  rationale: ‘Njikere’ na-enye isi echiche nke ịdị njikere ma ghara ikpebi ma ọ bụ njikere ikwusa ozi ọma ma ọ bụ ntọala siri ike.
- source_word: εὐαγγελίου
  choice: ozi ọma
  rationale: Nke a bụ nsụgharị Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe maka ozi ọma nke Kraịst.
- source_word: τῆς εἰρήνης
  choice: nke udo
  rationale: A debere usoro njikọ ahụ ka ‘udo’ kọwaa ozi ọma ahụ, n’enweghị ịkọwa karịa ihe Grik kwuru.
theological_decisions:
- issue: Ihe ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης pụtara
  choice: ụkwụ ndị kwere ekwe yi njikere nke metụtara ma ọ bụ sitere n’ozi ọma nke udo dịka akpụkpọ ụkwụ
  alternative: njikere ịkwusa ozi ọma nke udo; ma ọ bụ ntọala siri ike nke ozi ọma nke udo na-enye
  rationale: Nkebiokwu Grik ahụ dị mkpirikpi ma nwee ike ịpụta ihe karịrị otu. Isi ederede ji naanị ‘njikere’ mee ka mgbagwoju anya ahụ dịrị, kama ikpebi na ọ bụ ikwusa ozi ọma ma ọ bụ iguzosi ike.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ‘ka akpụkpọ ụkwụ n’ụkwụ unu’ iji mee ka ihe atụ agha/akpụkpọ ụkwụ doo anya n’enweghị asụsụ ochie ma ọ bụ nkọwa nke otu ụka.
