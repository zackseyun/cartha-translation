    text: Ma ọ bụ, “ịdị njikere”; ọ pụkwara ịpụta “njikere ikwusa ozi ọma nke udo,” ma ọ bụ “ntọala siri ike nke ozi ọma nke udo na-enye.”
    reason: alternative_reading
  revision_rationale: The revision replaces the potentially negative-sounding “eyikwala” with the positive perfective “ejirila,” which suitably reflects the participial “having [done so]” sense in the Greek. “Jiri … yiwe ụkwụ unu akpụkpọ ụkwụ” naturally conveys fitting the feet with footwear, while “njikere nke ozi ọma nke udo” leaves the Greek genitival relationship and the meaning of ἑτοιμασία open, as does the source.
