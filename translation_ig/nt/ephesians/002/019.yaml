review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the inferential conclusion, the twofold contrast (ξένοι / πάροικοι), shared citizenship with the saints, and belonging to God's household. However, “n’ala ahụ” introduces a specific ‘land’ not expressed by πάροικοι; the Greek social/civic setting is better represented by ‘obodo.’
  naturalness: The wording is generally clear Standard Igbo. “Ndị ọbịa bi n’obodo” is more idiomatic and less geographically specific than “ndị ọbịa bi n’ala ahụ.” The coordinated expression “unu na ndị nsọ bụkọ ụmụ amaala” is retained because it clearly conveys shared citizenship.
  terminology: “Ndị mba ọzọ,” “ndị nsọ,” “ụmụ amaala,” and “ezinụlọ Chineke” are appropriate modern biblical terms. The note’s proposed alternative “ụmụ amaala nke ndị nsọ” is potentially misleading in Igbo, since it can suggest citizenship belonging to the saints rather than citizenship shared with them; it should not be offered as an alternative translation.
  issues:
  - severity: medium
    issue: “n’ala ahụ” specifies a land not present in the Greek.
    rationale: πάροικοι denotes resident foreigners/aliens in a community or civic setting, without identifying a particular land. “N’obodo” retains the relevant social-civic nuance without adding that specificity.
  - severity: medium
    issue: Footnote b presents a potentially misleading alternative.
    rationale: “Unu bụ ụmụ amaala nke ndị nsọ” can be read as ‘you are citizens belonging to the saints.’ συμπολῖται τῶν ἁγίων conveys shared citizenship with the saints, not possession by them.
  revised_text: Ya mere, unu abụkwaghị ndị mba ọzọ na ndị ọbịa bi n’obodo[a]; kama, unu na ndị nsọ[b] bụkọ ụmụ amaala, bụrụkwa ndị so n’ezinụlọ Chineke[c].
