revisions:
- from: Ya mere, unu abụkwaghị ndị mba ọzọ na ndị ọbịa bi n’ala ahụ[a]; kama, unu na ndị nsọ[b] bụkọ ụmụ amaala, bụrụkwa ndị so n’ezinụlọ Chineke[c].
  to: Ya mere, unu abụkwaghị ndị mba ọzọ na ndị ọbịa bi n’obodo[a]; kama, unu na ndị nsọ[b] bụkọ ụmụ amaala, bụrụkwa ndị so n’ezinụlọ Chineke[c].
  rationale: The revision removes an unwarranted reference to a particular land, clarifies the resident-foreigner note, and removes an alternative that could distort the relationship expressed by συμπολῖται τῶν ἁγίων. It otherwise preserves the draft’s faithful, natural rendering and its deliberate non-narrowing of “the saints.”
