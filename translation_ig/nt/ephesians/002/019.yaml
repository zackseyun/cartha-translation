id: EPH.2.19
reference: Ephesians 2:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐκέτι ἐστὲ ξένοι καὶ πάροικοι, ἀλλὰ ⸀ἐστὲ συμπολῖται τῶν ἁγίων καὶ οἰκεῖοι τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/019.yaml
  text: So then[a], you are no longer strangers and resident foreigners, but you are fellow citizens with the saints and members of God's household[c][b],
translation:
  language: ig
  text: Ya mere, unu abụkwaghị ndị mba ọzọ na ndị ọbịa bi n’obodo[a]; kama, unu na ndị nsọ[b] bụkọ ụmụ amaala, bụrụkwa ndị so n’ezinụlọ Chineke[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndị ọbịa bi n’obodo” na-ekwu maka ndị bi n’otu ebe ma ha enweghị ọnọdụ ma ọ bụ ikike zuru ezu nke ụmụ amaala.
    reason: lexical_alternative
  - marker: b
    text: “Ndị nsọ” n’ebe a pụtara ndị Chineke doro nsọ; ọ pụtaghị naanị otu òtù pụrụ iche e mesịrị kpọọ ndị nsọ.
    reason: cultural_note
  - marker: c
    text: N’ụzọ nkịtị, “ndị ụlọ Chineke,” ya bụ, ndị bụ nke ezinụlọ ya.
    reason: metaphor_clarification
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Ya mere
  rationale: Ngwakọta okwu abụọ a na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya; “Ya mere” na-enye echiche ahụ n’Igbo dị ugbu a n’enweghị ikwubiga okwu ókè.
- source_word: οὐκέτι
  choice: abụkwaghị
  rationale: 'Ọ na-egosi na ọnọdụ ha agbanweela: ihe ha bụbu abụghịzi ihe ha bụ ugbu a.'
- source_word: ξένοι
  choice: ndị mba ọzọ
  rationale: Okwu a na-ezo aka n’ebe ndị na-abụghị ndị obodo ahụ nọ, ma na-egosikwa na ha esoghị n’otu ahụ.
- source_word: πάροικοι
  choice: ndị ọbịa bi n’ala ahụ
  rationale: Nke a na-egosi ndị bi n’ebe ahụ ma ha enweghị ọnọdụ na oke ruuru ụmụ amaala zuru ezu; ọ dị iche ntakịrị na ξένοι.
- source_word: συμπολῖται
  choice: unu na ndị nsọ bụkọ ụmụ amaala
  rationale: Nsụgharị a na-eme ka echiche nke ịbụ ụmụ amaala ọnụ, ndị nwere otu ọnọdụ obodo, doo anya n’Igbo.
- source_word: τῶν ἁγίων
  choice: ndị nsọ
  rationale: E debere okwu Akwụkwọ Nsọ a n’ụzọ sara mbara ka ọ ghara ikpebi n’amaokwu ahụ kpọmkwem òtù ndị e bu n’obi.
- source_word: οἰκεῖοι τοῦ θεοῦ
  choice: ndị so n’ezinụlọ Chineke
  rationale: Okwu ahụ na-akọwa ndị nke otu ụlọ; “ndị so n’ezinụlọ Chineke” na-eme ka ihe atụ banyere ụlọ na mmekọrịta chiri anya pụta n’Igbo nkịtị.
theological_decisions:
- issue: Ndị ἅγιοι (“ndị nsọ”) bụ ndị ole?
  choice: E debere ya dịka “ndị nsọ,” ya bụ aha sara mbara maka ndị Chineke doro nsọ.
  alternative: Ịkọwa ha kpọmkwem dịka ndị mmụọ ozi, ndị Juu kwere ekwe, ma ọ bụ ndị niile kwere ekwe.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ekwu maka itinye ndị mba ọzọ n’etiti ndị Chineke, ma okwu ahụ n’onwe ya anaghị ekpebi otu nkọwa ahụ kpamkpam. Ya mere, nsụgharị ahụ echekwala ohere nkọwa ahụ.
- issue: Mmekọrịta nke συμπολῖται na τῶν ἁγίων
  choice: “unu na ndị nsọ bụkọ ụmụ amaala”
  alternative: “unu bụ ụmụ amaala nke ndị nsọ”
  rationale: Genitive Grik nwere ike ịdị ka “nke ndị nsọ,” ma echiche bụ isi bụ isoro ndị nsọ kerịta ọnọdụ ụmụ amaala. E tinyere ụzọ ọzọ ahụ na nkọwa ala peeji iji chekwaa ọdịdị Grik.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe ma dị ùgwù. E chekwara ihe atụ abụọ Pọl ji—ịbụ ụmụ amaala na ịbụ ndị ezinụlọ—ma zere okwu ochie ma ọ bụ okwu iwu siri ike nke ọtụtụ ndị na-agụ akwụkwọ taa agaghị aghọta ngwa ngwa.
