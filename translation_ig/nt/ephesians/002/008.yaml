  text: τῇ γὰρ χάριτί ἐστε σεσῳσμένοι ⸀διὰ πίστεως· καὶ τοῦτο οὐκ ἐξ ὑμῶν, θεοῦ τὸ δῶρον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/008.yaml
  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: ig
  text: N’ihi na ọ bụ n’amara ka e zọpụtaworo unu site n’okwukwe[a]. Nke a[b] esighị n’aka unu; ọ bụ onyinye Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta “okwukwe” dịka “ntụkwasị obi”; n’ọnọdụ ụfọdụ, okwu Grik a nwekwara ike ịpụta “ikwesị ntụkwasị obi.”
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ sara mbara karị: “Eziokwu dum a banyere nzọpụta n’amara site n’okwukwe esighị n’aka unu.” O yikarịrị ka okwu Grik a sụgharịrị “Nke a” na-arụtụ aka n’ahịrịokwu gara aga dum, ọ bụghị n’“okwukwe” naanị ya.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάριτί
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa ihu ọma na obiọma Chineke nke mmadụ na-erughị eru inweta; ọ na-echekwa nghọta Pọl banyere χάρις n’enweghị ịgbasa ya karịa ihe odide ahụ kwuru.
- source_word: ἐστε σεσῳσμένοι
  choice: e ji zọpụta unu
  rationale: N’usoro “ọ bụ ... ka e ji,” okwu a na-egosi na nzọpụta ahụ emezuworị ma ọnọdụ ya ka dị ugbu a, dịka periphrastic perfect Grik si egosi.
- source_word: διὰ πίστεως
  choice: site n’okwukwe
  rationale: “Site na” na-egosi ụzọ ma ọ bụ ihe e ji mee ihe, dịka διά na genitive si arụ ọrụ; “okwukwe” bụ okwu ọkọlọtọ maka πίστις n’ebe a, ebe nkọwa ala peeji na-edebe ohere nghọta nke ntụkwasị obi.
- source_word: τοῦτο
  choice: Nke a
  rationale: Okwu ngosipụta a na-edebe nkenke na enweghị nkọwa zuru ezu nke Grik, ma kwe ka ọ na-arụtụ aka n’eziokwu dum a kpọrọ aha tupu ya.
- source_word: οὐκ ἐξ ὑμῶν
  choice: esiteghị n’aka unu
  rationale: 'Nkebi a na-egosi isi mmalite: eziokwu nzọpụta ahụ abụghị ihe sitere n’aka ndị a na-agwa okwu.'
- source_word: θεοῦ τὸ δῶρον
  choice: ọ bụ onyinye Chineke
  rationale: Nke a na-akọwa eziokwu e kwuru tupu ya dịka onyinye nke sitere n’aka Chineke, ma na-ada nke ọma n’Igbo ugbu a.
theological_decisions:
- issue: Ihe τοῦτο (“nke a”) na-arụtụ aka na ya
  choice: A hapụrụ “nke a” ka ọ na-arụtụkarị aka n’eziokwu dum banyere nzọpụta site n’amara, site n’okwukwe.
  alternative: Ọ pụrụ ịbụ na ọ na-arụtụ aka n’okwukwe naanị ya, ma ọ bụ n’amara naanị ya.
  rationale: τοῦτο bụ neuter, ebe χάρις na πίστις bụ feminine; ya mere, o yikarịrị ka ọ na-achịkọta nkebiokwu gara aga dum. A naghị emechi ohere nghọta ọzọ n’ụzọ otu ozizi ụka pụrụ isi mee.
translation_notes:
  register: Asụsụ ahụ bụ Igbo ọkọlọtọ, dị ugwu ma doo ndị na-agụ akwụkwọ taa anya. E ji usoro “ọ bụ ... ka e ji” mee ka amara Chineke pụta ìhè dịka ụzọ e si zọpụta, ma zere ịgbakwunye nkọwa otu ụka pụrụ iche. Akara ala peeji niile dị n’ahịrịokwu bụ isi.
