id: EPH.2.3
reference: Ephesians 2:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: ig
  text: N’etiti ha[a] ka anyị niile biri ndụ na mbụ n’agụụ dị iche iche nke anụ ahụ anyị[b], na-emezu ihe anụ ahụ anyị na echiche anyị chọrọ[d]. Anyị bụbu, site n’okike, ụmụ nke ọnụma[c], dịka ndị ọzọ[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ime ihe ndị ahụ.” Okwu Grik ahụ nwere ike izo aka n’ọnọdụ nnupụisi ahụ ma ọ bụ n’ebe ndị e ji nnupụisi mara nọ.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị “anụ ahụ” ebe a dịka “ọdịdị mmehie”; isi amaokwu ahụ na-edobe okwu Pọl ka ọ dị, ka a ghara ịkọwa nghọta nkà mmụta okpukpe ya karịa ihe odide ahụ kwuru.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ndị ọnụma ga-adakwasị.” “Ụmụ nke ọnụma” na-echekwa akpaalaokwu Grik ahụ.
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “na-eme ihe anụ ahụ na echiche chọrọ.”
    reason: previous_rendering
  - marker: e
    text: Ma ọ bụ, “dịka ndị ọzọ kwa.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν οἷς
  choice: N’etiti ha
  rationale: Ọ na-ezo aka n’ụzọ kachasị kwekọọ n’ọnọdụ okwu ahụ n’ebe ndị a kpọrọ ‘ụmụ nnupụisi’ nọ, ma ihe odide Grik nwekwara ike ịpụta ‘n’ime ihe ndị ahụ.’
- source_word: ἀνεστράφημέν ποτε
  choice: anyị niile bikwa ndụ n’oge gara aga
  rationale: ἀναστρέφω ebe a na-ekwu maka ụzọ mmadụ si ebi ndụ; ‘bikwa ndụ’ bụ Igbo dị mfe ma na-egosi ọnọdụ gara aga nke ποτε.
- source_word: ἐπιθυμίαις
  choice: ọchịchọ
  rationale: ‘Ọchịchọ’ sara mbara karịa agụụ mmekọahụ, ya mere ọ na-eburu echiche nke agụụ na ọchịchọ na-adịghị mma n’enweghị ime ka ya dị warara.
- source_word: σάρξ
  choice: anụ ahụ
  rationale: A hapụrụ okwu Pọl n’ụdị ya kama ịkọwa ya ozugbo dịka ‘ọdịdị mmehie,’ ka nghọta sara mbara na esemokwu nkà mmụta okpukpe dị na ya ghara ifu.
- source_word: ποιοῦντες τὰ θελήματα
  choice: na-emezu ihe ... chọrọ
  rationale: Nke a na-egosi ime ihe ọchịchọ ma ọ bụ ebumnuche ahụ chọrọ n’omume, ma ọ naghị agwakọta θελήματα na ἐπιθυμίαις nke e ji ‘ọchịchọ’ sụgharịa.
- source_word: διανοιῶν
  choice: echiche anyị
  rationale: Ọ na-ezo aka n’echiche na ụzọ iche echiche; ‘echiche anyị’ bụ okwu Igbo doro anya ma dị mfe.
- source_word: τέκνα ὀργῆς
  choice: ụmụ ọnụma
  rationale: A na-echekwa akpaalaokwu Grik/Semitik ahụ kama ịgbanwe ya ka ọ bụrụ naanị ‘ndị ọnụma ga-adakwasị.’
- source_word: φύσει
  choice: site n’ọdịdị ebumpụta ụwa
  rationale: Nke a na-echekwa echiche ‘site n’okike/ọdịdị’ n’enweghị ịmachi ya naanị n’ihe gbasara ọmụmụ.
- source_word: οἱ λοιποί
  choice: ndị ọzọ
  rationale: Ọ bụ Igbo ebumpụta ụwa nke na-egosi mmadụ ndị ọzọ niile a na-atụnyere ha.
theological_decisions:
- issue: Ihe σάρξ pụtara n’ebe Pọl ji ya kwuo maka omume mmehie
  choice: anụ ahụ
  alternative: ọdịdị mmehie
  rationale: ‘Anụ ahụ’ na-echekwa okwu Pọl na ọtụtụ nghọta ọ pụrụ inwe; ‘ọdịdị mmehie’ ga-akọwa nkà mmụta mmadụ nke amaokwu ahụ karịa ihe Grik kwuru kpọmkwem.
- issue: Ike okwu τέκνα φύσει ὀργῆς
  choice: anyị bụbu ụmụ ọnụma site n’ọdịdị ebumpụta ụwa
  alternative: anyị bụbu ndị ọnụma ga-adakwasị site n’ọmụmụ
  rationale: Nsụgharị a na-echekwa ma akpaalaokwu ‘ụmụ ọnụma’ ma nghọtahie nwere ike ịdị na φύσει, n’enweghị idozi okwu ahụ dịka usoro ozizi a kapịrị ọnụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ ‘ọnụma’ maka ὀργή n’ihi na ọ dabara n’ụda ikpe Chineke karịa iwe nkịtị, ma a hapụrụ ‘ụmụ ọnụma’ ka ọ chekwaa akpaalaokwu nke isi mmalite. Akara nkọwa ala peeji [a] ruo [e] niile dị n’isi amaokwu ahụ.
