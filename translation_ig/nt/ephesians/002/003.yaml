revisions:
- from: N’etiti ha[a], anyị niile bikwa ndụ n’oge gara aga n’ọchịchọ nke anụ ahụ anyị[b], na-emezu ihe anụ ahụ na echiche anyị chọrọ[d]. Anyị bụbu ụmụ ọnụma site n’ọdịdị ebumpụta ụwa[c], dịka ndị ọzọ[e].
  to: N’etiti ha[a] ka anyị niile biri ndụ na mbụ n’agụụ dị iche iche nke anụ ahụ anyị[b], na-emezu ihe anụ ahụ anyị na echiche anyị chọrọ[d]. Anyị bụbu, site n’okike, ụmụ nke ọnụma[c], dịka ndị ọzọ[e].
  rationale: 'The revision improves idiomatic Standard Igbo, restores the plural sense of the first occurrence of ἐπιθυμίαις, and uses concise natural wording for φύσει. It retains the source ambiguity and theological restraint: σάρξ remains “anụ ahụ,” and τέκνα ὀργῆς remains an idiomatic ‘children of wrath’ expression rather than an interpretive paraphrase. All five in-text footnote anchors are retained and their corresponding notes are supplied.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:30:41Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the personal reference of ἐν οἷς, the past communal conduct, the distinction between desires (ἐπιθυμίαις) and volitional aims (θελήματα), and the deliberately non-systematized force of τέκνα φύσει ὀργῆς. However, the plural force of ἐπιθυμίαις is not represented, and “site n’ọdịdị ebumpụta ụwa” is redundantly phrased and less natural than “site n’okike.”
  naturalness: “anyị niile bikwa ndụ n’oge gara aga” is awkward Standard Igbo; “N’etiti ha ka anyị niile biri ndụ na mbụ” is natural and maintains the emphasis. “Ụmụ nke ọnụma” is clearer and more idiomatic than the compressed “ụmụ ọnụma,” while retaining the source idiom.
  terminology: “Anụ ahụ” appropriately preserves σάρξ without imposing “sinful nature.” “Ọnụma” can convey the judicial/divine sense of ὀργή. “Site n’okike” accurately and naturally renders φύσει without narrowing it to biological birth.
  issues:
  - severity: medium
    issue: Awkward past-conduct expression
    rationale: “anyị niile bikwa ndụ n’oge gara aga” is not idiomatic in this context. The particle -kwa also has an unclear function. “N’etiti ha ka anyị niile biri ndụ na mbụ” naturally expresses ἀνεστράφημέν ποτε.
  - severity: medium
    issue: Plural desires omitted
    rationale: The Greek ἐπιθυμίαις is plural. “Agụụ dị iche iche” retains the breadth and plural sense without reducing the term to sexual desire.
  - severity: low
    issue: Redundant rendering of φύσει
    rationale: “ọdịdị ebumpụta ụwa” duplicates the notion of natural origin. “Site n’okike” is standard, concise, and preserves the disputed breadth of φύσει.
  - severity: low
    issue: Genitive idiom needs clearer Igbo form
    rationale: “Ụmụ nke ọnụma” is more readily understood in Standard Igbo than “ụmụ ọnụma,” yet still mirrors the source’s ‘children of wrath’ idiom rather than resolving it as a doctrinal paraphrase.
  revised_text: N’etiti ha[a] ka anyị niile biri ndụ na mbụ n’agụụ dị iche iche nke anụ ahụ anyị[b], na-emezu ihe anụ ahụ anyị na echiche anyị chọrọ[d]. Anyị bụbu, site n’okike, ụmụ nke ọnụma[c], dịka ndị ọzọ[e].
  revised_footnotes:
