source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εὐηγγελίσατο εἰρήνην ὑμῖν τοῖς μακρὰν καὶ ⸀εἰρήνην τοῖς ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/017.yaml
  text: And he came and proclaimed peace to you who were far away[b][a], and peace to those who were near.
translation:
  language: ig
  text: Ọ bịara kwusaa[b] udo nye unu ndị nọ n'ebe dị anya[a], kwusaakwa udo nye ndị nọ nso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, a kwusara udo nye ndị nọbu n'ebe dị anya nakwa ndị nọ nso—n’ihe amaokwu ndị gbara ya gburugburu na-ekwu, ndị a bụ ndị mba ọzọ na ndị Juu n’otu n’otu (lee Ndị Efesọs 2:11–13).
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “ikwusa ozi ọma nke udo.” Ngwaa Grik a na-apụtakarị “ịzisa ozi ọma,” ma n’ebe a, ihe a kpọsara bụ “udo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Ọ bịara
  rationale: Aorist participle a na-egosi omume bịara tupu ma ọ bụ soro nkwusa ahụ; ‘Ọ bịara’ bụ Igbo dị mfe ma na-echekwa echiche nke ọbịbịa.
- source_word: εὐηγγελίσατο
  choice: kwusaa
  rationale: Ngwaa Grik a pụtara izisa ma ọ bụ ikwusa ozi ọma. Ebe ihe a na-ekwusa kpọmkwem bụ ‘udo,’ ‘kwusaa’ na-ada nke ọma n’Igbo ma ghara ịtinye okwu na-adịghị na Grik.
- source_word: εἰρήνην
  choice: udo
  rationale: ‘Udo’ bụ nsụgharị kwụ ọtọ nke εἰρήνη, ma nwee ike ibu echiche sara mbara nke ịdị n’otu na mmezi mmekọrịta dị n’amaokwu ndị gbara ya gburugburu.
- source_word: ὑμῖν
  choice: nye unu
  rationale: Dative ahụ na-egosi ndị a gwara ozi ahụ; ‘nye unu’ bụ ụzọ Igbo nkịtị si egosipụta ya.
- source_word: τοῖς μακρὰν
  choice: ndị nọ n'ebe dị anya
  rationale: Nke a na-echekwa ihe atụ nke ịdị anya n’etinyeghị ozugbo nkọwa na ndị a bụ ndị mba ọzọ.
- source_word: τοῖς ἐγγύς
  choice: ndị nọ nso
  rationale: Nke a na-echekwa ntụnyere dị n’etiti ndị dị anya na ndị nọ nso, n’etinyeghị nkọwa ndị Juu n’ime amaokwu ahụ.
- source_word: καὶ ... καὶ
  choice: '..., kwusaakwa ...'
  rationale: Igbo chọrọ nkwughachi ngwaa ka ahịrịokwu ahụ daa nke ọma; ‘-kwa’ na-egosi njikọ nke ìgwè abụọ ahụ, ebe nkwughachi ‘udo’ na-echekwa nhazi na nkwusi ike nke Grik.
theological_decisions:
- issue: Ndị bụ ‘ndị nọ n'ebe dị anya’ na ‘ndị nọ nso’
  choice: E debere okwu ihe atụ ndị ahụ n’amaokwu ahụ dịka ha dị.
  alternative: ‘unu ndị mba ọzọ’ na ‘ndị Juu’
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na Pọl na-ekwu maka ndị mba ọzọ na ndị Juu (Ndị Efesọs 2:11–13), ma amaokwu a n’onwe ya ji ‘dị anya’ na ‘nọ nso.’ Idebe okwu ndị ahụ na-echekwa ụzọ Pọl si kwuo ya ma ghara itinye nkọwa n’ime ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dịkwa mfe nghọta. E debere ihe atụ ‘n'ebe dị anya’ na ‘nọ nso,’ ma tinyekwa nkọwa njirimara ha n’ala peeji kama itinye ya n’amaokwu.
