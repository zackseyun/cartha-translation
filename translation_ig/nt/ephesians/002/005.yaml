revisions:
- from: ọbụna mgbe anyị bụ ndị nwụrụ anwụ n’ime njehie anyị, o mere ka anyị na Mezaya[a] dịrị ndụ—ọ bụ site n’amara ka e jirila zọpụta unu—
  to: ọbụna mgbe anyị nwụrụ anwụ n’ime mmehie anyị, o mere ka anyị soro Mezaya[a] dị ndụ—site n’amara ka e jirila zọpụta unu—
  rationale: E dochiela «njehie» anya na «mmehie» maka ntụkwasị obi n’ihe παραπτώμασιν pụtara n’ọdịdị Pọl. E mezikwara okwu Igbo ka ọ bụrụ nke eke ma gosi n’enweghị mgbagwoju anya na a kpọlitere anyị n’ime njikọ na Mezaya. A chebere akara ogologo abụọ, olu nnara, ihe arụchaala nke «-la», na mgbanwe Grik si n’onye mbụ ọtụtụ gaa n’onye nke abụọ ọtụtụ.
