    issue: «njehie anyị»
    rationale: «Njehie» na-ezo n’ụzọ dị mfe n’ihie ụzọ ma ọ bụ mmejọ; παραπτώματα n’amaokwu a na-ekwu maka mmehie/ntụpọ. «Mmehie anyị» na-enye nkọwa ziri ezi n’enweghị ịgbakwunye echiche ọhụrụ.
  - severity: low
    issue: «anyị na Mezaya dịrị ndụ»
    rationale: Ọ nwere ike ịda ka Mezaya so n’otu «anyị» ahụ. «o mere ka anyị soro Mezaya dị ndụ» na-egosi nke ọma njikọta συν- na dative τῷ Χριστῷ.
  - severity: low
    issue: Nkebi okwu na nkọwa ala peeji
    rationale: Iwepu «ọ bụ» n’ime okwu etinyere na-eme ka ọ ghara ịdị ka nkwupụta mgbakwunye, ma «Ma ọ bụ:» na «aha pụtara» na-eme nkọwa ala peeji ka ọ bụrụ Igbo dị mfe ma dị eke.
