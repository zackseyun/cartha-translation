  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: ig
  text: ọbụna mgbe anyị nwụrụ anwụ n’ime mmehie anyị, o mere ka anyị soro Mezaya[a] dị ndụ—site n’amara ka e jirila zọpụta unu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Kraịst.” Okwu Grik Χριστός bụ aha pụtara “Onye e Tere Mmanụ”; a sụgharịrị ya ebe a dị ka “Mezaya” iji chekwaa ihe ọ pụtara.'
    reason: alternative_rendering
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκρούς
  choice: mgbe anyị bụ ndị nwụrụ anwụ
  rationale: Nke a na-egosipụta ọnọdụ ndị ahụ nọ na ya, ma na-ahapụ njikọ participle ahụ ka ọ bụrụ nke oge nwere ntakịrị mmetụta nke nkwenye megidere atụmanya, dịka ihe gbara ya gburugburu si dị.
- source_word: τοῖς παραπτώμασιν
  choice: n’ime njehie anyị
  rationale: “N’ime” na-echekwa echiche nke ịnọ n’ọnọdụ ma ọ bụ n’ógbè njehie, kama ikpebi dative ahụ naanị dị ka ihe kpatara ọnwụ. E tinyere “anyị” n’ihi ἡμᾶς na ihe gbara amaokwu ahụ gburugburu.
- source_word: συνεζωοποίησεν
  choice: o mere ka anyị ... dịrị ndụ
  rationale: Nkebiokwu a na-egosipụta ime ka ndị nwụrụ anwụ dị ndụ; “anyị na Mezaya” na-eburu echiche nke njikọta dị na πρόθεσις συν-.
- source_word: τῷ Χριστῷ
  choice: na Mezaya
  rationale: Dative a na-egosi onye ha na ya jikọrọ mgbe e mere ka ha dị ndụ. “Mezaya” na-echekwa Χριστός dị ka utu aha nke Onye E Tere Mmanụ.
- source_word: χάριτί
  choice: site n’amara
  rationale: Nke a na-egosi amara dị ka ụzọ ma ọ bụ ntọala e si zọpụta ha, ma na-eji okwu Igbo a maara nke ọma n’okwu okwukwe.
- source_word: ἐστε σεσῳσμένοι
  choice: e jirila zọpụta unu
  rationale: “E jirila ... zọpụta” na-echekwa olu nnara, ebe “-la” na-egosipụta ihe emeworo nke nsonaazụ ya ka dị ugbu a.
theological_decisions:
- issue: Nsụgharị Χριστῷ
  choice: Mezaya
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dị ka utu aha. “Mezaya” na-eme ka ihe utu aha ahụ pụtara pụta ìhè, ebe “Kraịst” bụ ụdị ọdịnala e tinyere na nkọwa ala peeji.
- issue: Ụdị nkebiokwu χάριτί ἐστε σεσῳσμένοι
  choice: idobe ya n’etiti akara ogologo abụọ dị ka nkwụsị okwu siri ike
  alternative: ijikọta ya n’ahịrịokwu ahụ n’enweghị akara ogologo
  rationale: Arịrịọ a batara na mberede n’okwu Pọl ma na-emesi amara ike; akara ogologo abụọ na-echekwa mmetụta ahụ n’enweghị ịgbakwunye nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta, mee ihe. A hapụrụ usoro okwu Pọl na nkwụsị okwu ya pụtara ìhè, ma zere ime ka dative τοῖς παραπτώμασιν bụrụ naanị ihe kpatara ọnwụ.
