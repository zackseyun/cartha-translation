revisions:
- from: N’ime ha ka unu biri ndụ n’oge gara aga, na-agbaso usoro oge nke ụwa a[a], na-agbasokwa onye ọchịchị nke ikike dị n’ikuku[b]—mmụọ ahụ na-arụ ọrụ ugbu a n’ime ụmụ nnupụisi[c].
  to: N’ime ha ka unu biri ndụ n’oge gara aga, na-agbaso usoro nke ụwa a ugbu a[a], na-agbasokwa onye ọchịchị nke ikike dị n’ikuku[b]—mmụọ ahụ na-arụ ọrụ ugbu a n’ime ụmụ nke enweghị nrubeisi[c].
  rationale: The revision makes two limited semantic and idiomatic corrections. It replaces the awkward “usoro oge nke ụwa a” with a natural expression for the present world-order and replaces “nnupụisi” with wording that more precisely represents disobedience. The ruler/spirit relation remains deliberately noncommittal, and all three footnote anchors remain present and correctly matched to their notes.
