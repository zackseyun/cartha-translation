id: EPH.2.2
reference: Ephesians 2:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: ig
  text: N’ime ha ka unu biri ndụ n’oge gara aga, na-agbaso usoro nke ụwa a ugbu a[a], na-agbasokwa onye ọchịchị nke ikike dị n’ikuku[b]—mmụọ ahụ na-arụ ọrụ ugbu a n’ime ụmụ nke enweghị nrubeisi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-agbaso ụzọ ụwa a.” Okwu Grik αἰών na-ezo ebe a n’oge ma ọ bụ n’ụkpụrụ nke ụwa ugbu a.
    reason: lexical_alternative
  - marker: b
    text: “Ikuku” na-egosipụta ụzọ ndị oge ochie si ekwu maka mpaghara e jikọtara ya na ike mmụọ ndị iro.
    reason: cultural_note
  - marker: c
    text: N’ụzọ nkịtị, “ụmụ nke enweghị nrubeisi”; ya bụ, ndị e ji enweghị nrubeisi mara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  choice: N’ime ha
  rationale: Ọ na-ezo aka ná mmejọ na mmehie ndị e kwuru n’amaokwu bu ụzọ, ma na-edobe echiche nke ịnọ ‘n’ime’ ha.
- source_word: ποτε περιεπατήσατε
  choice: ka unu biri ndụ n’oge gara aga
  rationale: περιπατέω bụ ihe atụ maka ụzọ mmadụ si ebi ndụ. Nsụgharị a na-eme ka ihe ọ pụtara doo onye Igbo nke oge a anya, ebe ‘n’oge gara aga’ na-egosipụta ποτε.
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: na-agbaso usoro oge nke ụwa a
  rationale: ‘Usoro oge’ na-edobe echiche αἰών dịka oge ma ọ bụ ụkpụrụ nke oge ugbu a, ma na-ekewapụ ya na κόσμος, ‘ụwa.’
- source_word: ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος
  choice: onye ọchịchị nke ikike dị n’ikuku
  rationale: ‘Onye ọchịchị’ na-egosipụta ἄρχων, ‘ikike’ na-egosipụta ἐξουσία, ebe ‘ikuku’ na-edobe okwu ihe oyiyi ụwa oge ochie kama ịkọwa ya n’ime amaokwu.
- source_word: τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος
  choice: mmụọ ahụ na-arụ ọrụ ugbu a
  rationale: A na-eji ‘mmụọ’ na mkpụrụedemede nta n’ihi na ebe a anaghị ekwu maka Mmụọ Nsọ; ‘na-arụ ọrụ ugbu a’ na-egosipụta ọrụ na-aga n’ihu.
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: n’ime ụmụ nnupụisi
  rationale: ‘Ụmụ nnupụisi’ na-edobe akpaalaokwu Semitik ‘ụmụ nke nnupụisi’ n’ụzọ Igbo dị nkenke ma doo anya, na-akọwa ndị ndụ ha ji nnupụisi mara.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ‘mmụọ ahụ na-arụ ọrụ ugbu a’ na ‘onye ọchịchị nke ikike dị n’ikuku’
  choice: E ji akara ogologo njikọ mee ka ‘mmụọ ahụ’ bụrụ nkọwa na-esochi aha onye ọchịchị ma ọ bụ ike ahụ, n’etinyeghị nkọwa ọzọ banyere ụdị ịdị adị ya.
  alternative: Ịsị hoo haa na mmụọ ahụ bụ Setan n’onwe ya, ma ọ bụ na ọ bụ ike na-enweghị onwe ya nke nọ n’okpuru onye ọchịchị ahụ.
  rationale: Usoro genitiv na apposition nke Grik na-enye ohere maka njikọ a, ma ederede ahụ anaghị ekpebi kpọmkwem ma okwu abụọ ahụ hà bụ otu onye n’ụzọ zuru ezu ma ọ bụ otu ike nọ n’okpuru onye ahụ.
- issue: Nsụgharị υἱοῖς τῆς ἀπειθείας
  choice: ụmụ nnupụisi
  alternative: ndị na-enupụ isi
  rationale: Nke a na-edobe ihe oyiyi ezinụlọ dị n’akpaalaokwu mbụ, ma ihe odide ala peeji na-eme ka o doo anya na ọ na-ekwu maka ndị e ji nnupụisi mara, ọ bụghị naanị ụmụ nwoke.
translation_notes:
  register: E ji asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Biri ndụ’ na-enye ihe atụ περιπατέω n’ụzọ nkịtị nye onye na-agụ Igbo; ‘usoro oge nke ụwa a’ na-edobe ọdịiche dị n’etiti αἰών na κόσμος. Akara [a], [b], na [c] niile dị n’ederede isi n’ebe ha na-akọwa.
