  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: ig
  text: N’ihi na anyị bụ ọrụ aka ya, anyị ndị e kere n’ime Mesaịa[a] Jizọs maka ezi ọrụ ndị Chineke kwadebere tupu oge eruo, ka anyị wee na-ejegharị n’ime ha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” Okwu Grik bụ Χριστός, aha-ọrụ pụtara Onye E Tere Mmanụ; “Mesaịa” na-egosipụta ihe aha-ọrụ ahụ pụtara.
    reason: alternative_reading
  - marker: b
    text: “Ijegharị” n’ebe a bụ ihe atụ nke na-ekwu maka ụzọ mmadụ si ebi ndụ na omume ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοῦ γάρ ἐσμεν ποίημα
  choice: N’ihi na anyị bụ ọrụ aka ya
  rationale: “N’ihi na” na-egosi njikọ nkọwa nke γάρ na okwu ndị bu ya ụzọ. “Ọrụ aka ya” na-enye echiche ποίημα dị ka ihe Chineke kere ma rụọ, n’asụsụ Igbo dị mfe ma dị ùgwù.
- source_word: κτισθέντες
  choice: ndị e kere
  rationale: Na-edobe participle passive ahụ ma jikọta ya n'ụzọ kwekọrọ n’okwu “anyị,” na-egosi na Chineke bụ onye kere ha.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaịa Jizọs
  rationale: “N’ime” na-edobe echiche mmekọrịta ma ọ bụ ịdị n’otu nke ἐν. A sụgharịrị Χριστός dị ka aha-ọrụ “Mesaịa,” kama ime ya naanị aha mmadụ.
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: maka ezi ọrụ
  rationale: “Maka” na-egosi nzube ma ọ bụ ihe e kere ha ka ọ rụpụta; “ezi ọrụ” na-edobe okwu omume ọma nke ἔργα ἀγαθά.
- source_word: οἷς προητοίμασεν ὁ θεός
  choice: ndị Chineke kwadebere tupu oge eruo
  rationale: “Ndị” na-alaghachi n’ezi ọrụ, ebe “tupu oge eruo” na-egosipụta prefix προ- nke ngwaa ahụ n’enweghị ịgbakwunye usoro ozizi ọzọ.
- source_word: ἵνα ἐν αὐτοῖς περιπατήσωμεν
  choice: ka anyị wee na-ejegharị n’ime ha
  rationale: “Ka anyị wee” na-egosi nzube nke ἵνα. E debere ihe atụ nke “ijegharị” n’ihi na ọ bụ ụzọ Pọl si ekwu maka omume na ụzọ ndụ mmadụ.
theological_decisions:
- issue: Ịsụgharị Χριστός dị ka aha-ọrụ ma ọ bụ dị ka aha a na-edegharị edegharị
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: N’ebe a Χριστός ka nwere ike aha-ọrụ ya pụtara, ya bụ Onye E Tere Mmanụ. “Mesaịa” na-eme ka ihe aha-ọrụ ahụ pụtara pụta ìhè n’enweghị itinye nkọwa otu ụka.
- issue: Mmekọrịta dị n’etiti nkwadebe Chineke na omume ndị kwere ekwe
  choice: ezi ọrụ ndị Chineke kwadebere tupu oge eruo, ka anyị wee na-ejegharị n’ime ha
  alternative: ezi ọrụ Chineke kwadebere ka anyị rụọ
  rationale: Nhọrọ a na-edobe ma mbido nke Chineke ma nzube ka ndị kwere ekwe bie ndụ n’ezi ọrụ ahụ, n’ebughị ụzọ kpebie arụmụka sara mbara banyere akara aka ma ọ bụ òkè mmadụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ihe. A hapụrụ ihe atụ Pọl nke “ijegharị” n’ime isiokwu ahụ, ma kọwaa ya na nkọwa ala peeji. E tinyere akara nkọwa [a] na [b] kpọmkwem n’ebe okwu ndị ha na-akọwa dị.
