  text: ὅτι δι’ αὐτοῦ ἔχομεν τὴν προσαγωγὴν οἱ ἀμφότεροι ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/018.yaml
  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: ig
  text: N’ihi na site na ya ka anyị abụọ nwere ohere ịbịakwute Nna ahụ n’ime otu Mmụọ[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ebe ọ bụ na site na ya ka anyị abụọ nwere ohere ịbịakwute Nna ahụ n’ime otu Mmụọ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “ohere ịbịakwute” dịka “ịkpọbata mmadụ n’ihu” ma ọ bụ “ịgakwuru.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “site n’aka otu Mmụọ.” “N’ime otu Mmụọ” na-echekwa otú e si kwuo ya na Greek, nke pụrụ igosi ma ụzọ e si nweta ohere ahụ ma ọnọdụ ha nọ n’ime ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Ihe kpatara ya bụ na
  rationale: N’ọnọdụ okwu a, njikọ a na-akọwa ihe mere okwu bu ya ụzọ banyere udo na ime ka ha dịrị n’otu ji bụrụ eziokwu. Nsụgharị a na-eme ka ọrụ nkọwa ya doo anya n’Igbo; a pụkwara iji ‘N’ihi na.’
- source_word: δι’ αὐτοῦ
  choice: site n’aka ya
  rationale: διά ya na genitive na-egosi ụzọ ma ọ bụ onye e si n’aka ya mee ihe. ‘Site n’aka ya’ na-echekwa echiche na ọ bụ site na Kraịst ka ohere ahụ si abịa.
- source_word: ἔχομεν
  choice: anyị ... ji nwee
  rationale: Nke a na-egosi ọnọdụ ha nwere ugbu a. ‘Nwee’ bụ okwu Igbo dị mfe ma bụrụkwa nke kwesịrị ekwesị maka ἔχομεν.
- source_word: τὴν προσαγωγὴν
  choice: ohere ịbịakwute
  rationale: προσαγωγή nwere ike ịpụta ohere mmadụ nwere ịbịaru onye nọ n’ọkwá elu nso, ma ọ bụ ịkpọbata mmadụ n’ihu ya. ‘Ohere ịbịakwute’ doro ndị na-agụ Igbo anya ma ọ naghị ekpebi ma ihe atụ ahụ bụ nke ụlọ eze ka ọ bụ nke ofufe.
- source_word: οἱ ἀμφότεροι
  choice: anyị abụọ
  rationale: Okwu a na-arụtụ aka n’ìgwè abụọ ahụ a kpọtụrụla aha—ndị Juu na ndị mba ọzọ—ma na-echekwa ụzọ onye dere ji tinye onwe ya n’etiti ha.
- source_word: ἐν ἑνὶ πνεύματι
  choice: n’ime otu Mmụọ
  rationale: ‘N’ime’ na-echekwa preposition Greek ἐν na ihe ọ pụrụ ịpụta dịka ụzọ e si eme ihe ma ọ bụ ọnọdụ mmadụ nọ n’ime ya. ‘Mmụọ’ e ji mkpụrụedemede ukwu dee na-egosi na o yikarịrị ka ọ bụ Mmụọ Nsọ ka a na-ekwu maka ya.
- source_word: πρὸς τὸν πατέρα
  choice: ịbịakwute Nna ahụ
  rationale: πρός na-egosi ịgakwuru onye ma ọ bụ ịbịaru n’ihu ya. ‘Ịbịakwute Nna ahụ’ na-enye nghọta a n’Igbo n’etinyeghị okwu ‘Chineke,’ nke na-adịghị na Greek.
theological_decisions:
- issue: Onye ‘otu Mmụọ’ na-arụtụ aka na ya
  choice: Mmụọ Nsọ
  alternative: otu mmụọ ma ọ bụ otu obi nke mmadụ na ibe ya nwere
  rationale: 'Ọnọdụ okwu ahụ nwere usoro doro anya: site n’aka Ọkpara ahụ, n’ime otu Mmụọ, ịbịakwute Nna ahụ. Ya mere, o yikarịrị ka πνεῦμα bụ Mmụọ Nsọ; iji mkpụrụedemede ukwu dee ya na-egosi nghọta a n’agbakwụnyeghị nkọwa n’ahịrịokwu ahụ.'
- issue: Ihe προσαγωγή pụtara
  choice: ohere ha abụọ nwere ịbịakwute Nna ahụ
  alternative: ịkpọbata ha n’ihu Nna ahụ n’usoro emume
  rationale: Okwu Greek ahụ pụrụ inwe echiche nke ịkpọbata mmadụ n’ihu eze ma ọ bụ n’ebe ofufe, ma ‘ohere ịbịakwute’ na-echekwa isi echiche banyere ohere a na-enye ha abụọ n’akọwaghị ihe atụ ahụ karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Usoro ‘ọ bụ ... ka’ na-eme ka ‘site n’aka ya’ pụta ìhè n’ụzọ dị ndụ n’Igbo, ebe a hapụrụ ‘anyị abụọ’ ka ọ chekwaa njikọ nke onye dere na ìgwè abụọ ahụ.
