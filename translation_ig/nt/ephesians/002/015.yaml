id: EPH.2.15
reference: Ephesians 2:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας, ἵνα τοὺς δύο κτίσῃ ἐν ⸀αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/015.yaml
  text: having abolished the law of commandments expressed in decrees, so that he might create the two into one new man in himself, making peace,
translation:
  language: ig
  text: ọ kagburu Iwu nke iwu ndị e nyere n’ụkpụrụ dị iche iche[a], ka o wee kee ndị abụọ ahụ ka ha bụrụ otu mmadụ ọhụrụ[b] n’ime onwe ya,[c] si otú ahụ mee udo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ụkpụrụ dị iche iche,” “nke ihe mejupụtara ya bụ ụkpụrụ dị iche iche,” ma ọ bụ, dịka nsụgharị ọdịnala ụfọdụ si kwuo, “n’iwu e dere ede dị iche iche.”
    reason: lexical_alternative
  - marker: b
    text: “Otu mmadụ ọhụrụ” bụ onyinyo nke otu onye, ma ọ na-ekwu maka ndị mmadụ dịka otu ìgwè; a pụkwara ikwu, “otu ọhaneze mmadụ ọhụrụ.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịhazi ya, “ka o wee kee ndị abụọ ahụ n’ime onwe ya ka ha bụrụ otu mmadụ ọhụrụ.”
    reason: previous_rendering
lexical_decisions:
- source_word: τὸν νόμον τῶν ἐντολῶν
  choice: Iwu ahụ nke ihe ndị e nyere n’iwu ya
  rationale: “Iwu” na “ihe ndị e nyere n’iwu” na-echekwa njikọ dị n’etiti νόμος na ἐντολαί. E ji mkpụrụedemede ukwu dee “Iwu” ebe ọ bụ na okwu a na-ezo aka n’Iwu Mozis, ọ bụ ezie na Grik n’onwe ya anaghị ekpebi mkpụrụedemede ukwu ma ọ bụ nta.
- source_word: ἐν δόγμασιν
  choice: gosipụtara n’ụkpụrụ dị iche iche
  rationale: Nke a na-egosi na iwu ndị ahụ bịara n’ụdị ụkpụrụ e nyere, ma na-ezere okwu ochie ma ọ bụ nkọwa nke ga-eme ka ọ bụrụ naanị emume okpukpe. Ihe odide ala na-edebe ụzọ ndị ọzọ e nwere isi ghọta njikọ nkebiokwu a.
- source_word: καταργήσας
  choice: ọ kagburu
  rationale: '“Kagbuo” na-egosipụta ike nke καταργέω n’ebe a: ime ka ihe ghara ịdị ire ma ọ bụ kwụsị ọrụ ya. Ọ naghị agbakwunye nkwupụta gbasara akụkụ Iwu ndị amaokwu a na-akọwaghị.'
- source_word: τοὺς δύο
  choice: ndị abụọ ahụ
  rationale: Nke a na-echekwa ọnụọgụ abụọ doro anya nke Grik ma na-atụ aka n’òtù abụọ e kwuru banyere ha n’amaokwu ndị gbara ya gburugburu, n’enweghị ịgbakwunye “ìgwè” n’ime ederede.
- source_word: κτίσῃ
  choice: kee
  rationale: “Kee” na-echekwa echiche okike ọhụrụ dị na κτίζω, karịa nanị “hazie” ma ọ bụ “jikọta.”
- source_word: ἐν αὑτῷ
  choice: n’ime onwe ya
  rationale: Nke a na-echekwa ọdịdị nnọchiaha na-alaghachikwuru onye mere ihe, ma na-egosi na ịdị n’otu ọhụrụ a dị n’ime Kraịst n’onwe ya.
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: ka ha bụrụ otu mmadụ ọhụrụ
  rationale: Nke a bụ ụzọ Igbo si ekwu n’ụzọ doro anya echiche nke ịkee mmadụ abụọ ahụ ka ha ghọọ otu mmadụ ọhụrụ. Ọ na-echekwa onyinyo otu mmadụ nke Grik, ebe ihe odide ala na-akọwa na ọ bụ onyinyo mkpokọta.
- source_word: ποιῶν εἰρήνην
  choice: si otú ahụ mee udo
  rationale: Nke a jikọtara ime udo na omume okike ahụ n’ụzọ Igbo na-ada nke ọma, ma na-echekwa participle ποιῶν dị ka ihe na-eso omume ahụ.
theological_decisions:
- issue: Otu e si sụgharịa ἄνθρωπον mgbe ọ na-anọchi anya ndị Juu na ndị mba ọzọ ọnụ
  choice: otu mmadụ ọhụrụ
  alternative: otu ụmụ mmadụ ọhụrụ
  rationale: “Otu mmadụ ọhụrụ” na-echekwa otu onye dị n’onyinyo Grik na echiche nnọchianya ya. “Otu ụmụ mmadụ ọhụrụ” ga-eme ka ihe mkpokọta pụta ìhè, ma ọ ga-ebelata esemokwu dị n’etiti otu onye na ìgwè mmadụ nke okwu mbụ ji aka ya hapụ.
- issue: Ike nke καταργήσας n’ihe gbasara Iwu
  choice: ọ kagburu
  alternative: o mere ka ọ ghara ịdị ire
  rationale: Okwu a na-echekwa ike nke ngwaa Grik, ma ihe a kagburu ka akọwapụtara kpọmkwem dị ka Iwu nke ihe ndị e nyere n’iwu ya gosipụtara n’ụkpụrụ. E tinyeghị nkọwa sara mbara banyere uche Chineke ma ọ bụ iwu omume.
- issue: Ebe a ga-etinye ἐν αὑτῷ
  choice: otu mmadụ ọhụrụ n’ime onwe ya
  alternative: n’ime onwe ya kee ndị abụọ ahụ ka ha bụrụ otu mmadụ ọhụrụ
  rationale: Nhọrọ isi na-ada nke ọma n’Igbo ma na-ejikọta “n’ime onwe ya” na ọnọdụ nke mmadụ ọhụrụ ahụ. Nhọrọ nke ọzọ nwere ike ijikọ ya na omume ikekọta n’onwe ya; ebe Grik na-enye ohere maka ntakịrị nghọtahie a, e debere ya n’ihe odide ala.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ọdịdị nkebiokwu amaokwu ahụ n’ihi na ọ na-aga n’ihu site n’amaokwu bu ya ụzọ. “Ndị abụọ ahụ” na-ezere ime ka a ghọta ha dị ka mmadụ abụọ n’otu n’otu, ma ọ naghị etinye “ìgwè” nke na-adịghị n’ederede Grik. Akara ihe odide ala [a], [b], na [c] niile pụtara n’ederede isi.
