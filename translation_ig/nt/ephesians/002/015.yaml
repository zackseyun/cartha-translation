revisions:
- from: ọ kagburu Iwu ahụ nke ihe ndị e nyere n’iwu ya gosipụtara n’ụkpụrụ dị iche iche[a], ka o wee kee ndị abụọ ahụ ka ha bụrụ otu mmadụ ọhụrụ[b] n’ime onwe ya,[c] si otú ahụ mee udo,
  to: ọ kagburu Iwu nke iwu ndị e nyere n’ụkpụrụ dị iche iche[a], ka o wee kee ndị abụọ ahụ ka ha bụrụ otu mmadụ ọhụrụ[b] n’ime onwe ya,[c] si otú ahụ mee udo,
  rationale: The revision makes the genitival phrase “law of commandments” explicit and keeps δόγμασιν connected to those commandments without adding the notion that they merely reveal the law. It corrects the lexical scope of the ordinance alternative and clarifies the singular-yet-corporate image of “one new man.”
