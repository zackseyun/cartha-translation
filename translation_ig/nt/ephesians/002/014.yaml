id: EPH.2.14
reference: Ephesians 2:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/014.yaml
  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: ig
  text: N’ihi na ya onwe ya bụ udo anyị, onye mere ha abụọ[a] ka ha bụrụ otu, ma kwatuo mgbidi nkewa ahụ bụ́ ihe mgbochi[b]—ya bụ, iro ahụ[c]—n’anụ ahụ ya[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ha abụọ” na-ezo aka n’ebe ndị Juu na ndị mba ọzọ nọ n’okwu gbara amaokwu a gburugburu.
    reason: contextual_referent
  - marker: b
    text: N’ụzọ nkịtị, “mgbidi etiti nke nkewa.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịghọta usoro okwu Greek ahụ dị ka “iro ahụ n’anụ ahụ ya,” ebe echiche ahụ gara n’ihu n’amaokwu na-esote.
    reason: syntactic_ambiguity
  - marker: d
    text: 'Greek: “n’anụ ahụ ya”; ya bụ, site n’ọnwụ ya mgbe ọ nọ n’anụ ahụ, ọ bụghị na o wepụụrụ onwe ya ịbụ mmadụ.'
    reason: lexical_and_theological_clarification
lexical_decisions:
- source_word: αὐτὸς
  choice: ọ bụ ya onwe ya
  rationale: 'Nke a na-edobe nkwusi ike dị n’aha nnọchi Greek ahụ: Kraịst n’onwe ya, ọ bụghị naanị onye ozi ọzọ, bụ udo anyị.'
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a na-enye ihe kpatara okwu bu ya ụzọ.
- source_word: ἡ εἰρήνη ἡμῶν
  choice: udo anyị
  rationale: “Udo” bụ okwu Igbo doro anya nke na-ekwupụta ime ka ndị kewara ekewa dịrị ná mma.
- source_word: τὰ ἀμφότερα ἓν
  choice: mere ha abụọ ka ha bụrụ otu
  rationale: A hapụrụ “ha abụọ” ka ọ dabere n’okwu gbara ya gburugburu, ma e tinyere nkọwa ala peeji na ọ na-ezo aka n’ebe ndị Juu na ndị mba ọzọ nọ.
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: mgbidi nkewa ahụ bụ́ ihe mgbochi
  rationale: Nke a na-edobe onyinyo mgbidi na ọrụ ya dị ka ihe na-ekewa ma na-egbochi.
- source_word: λύσας
  choice: kwatuokwa
  rationale: “Kwatuo” bụ ụzọ Igbo e si ekwu ịkwatu mgbidi ma wepụ ihe mgbochi.
- source_word: τὴν ἔχθραν
  choice: iro ahụ
  rationale: “Iro” bụ okwu nkịtị, doro anya maka ọnọdụ nke ndị na-emegide ibe ha.
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: n’anụ ahụ ya
  rationale: Nke a na-edobe “n’ime/n’anụ ahụ ya” nke Greek, kama ịgbanwe ya ka ọ bụrụ nkọwa ozizi sara mbara.
theological_decisions:
- issue: Ihe “ha abụọ” na-ezo aka na ya
  choice: A hapụrụ ya n’ahịrị isi dị ka “ha abụọ,” ma kọwaa ya n’ala peeji dị ka ndị Juu na ndị mba ọzọ.
  alternative: Ikwu kpọmkwem n’ahịrị isi, “òtù abụọ ahụ—ndị Juu na ndị mba ọzọ.”
  rationale: Ihe gbara amaokwu ahụ gburugburu na-eme ka ndị a doo anya; ịhapụ “ha abụọ” na-edobe nkenke na usoro Greek, ebe nkọwa ala peeji na-enyere onye na-agụ aka.
- issue: Mmekọrịta “iro ahụ” na mgbidi ahụ
  choice: E ji akara ogologo kewapụ “ya bụ, iro ahụ” dị ka nkọwa nke ihe mgbochi ahụ.
  alternative: Ijikọ “iro ahụ” na “n’anụ ahụ ya,” ma ọ bụ were ya dị ka mmalite nke ahịrịokwu na-esote.
  rationale: Nke a na-egosi na iro ahụ bụ ihe mgbidi ahụ na-anọchi anya, ma ọ naghị ekwu na iro dị n’anụ ahụ Kraịst. Nkọwa ala peeji na-echekwa nghọta usorookwu ọzọ nwere ike ịdị.
- issue: Ntụgharị σάρξ
  choice: anụ ahụ
  alternative: ahụ; site n’ọnwụ anụ ahụ ya
  rationale: N’ebe a okwu ahụ na-ezo aka n’ịdị adị Kraịst n’anụ ahụ na ọnwụ ya, ọ bụghị “agwa mmehie.” Ntụgharị nkịtị na-echekwa ihe okwu Greek kwuru n’enweghị ịtinye nkọwa n’ahịrị isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ọ bụ ya onwe ya” na-edobe nkwusi ike; “kwatuo mgbidi” bụ akpaalaokwu nkịtị. E debere kọma ikpeazụ n’ihi na ahịrịokwu Greek na echiche ya na-aga n’ihu n’amaokwu 15.
