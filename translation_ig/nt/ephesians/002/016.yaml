source:
  edition: SBLGNT
  text: καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: ig
  text: ka o wee mee ka ha abụọ na Chineke dịghachi ná mma n’otu ahụ site n’obe, mgbe o ji ya gbuo iro ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: mee ka ... na Chineke dịghachi ná mma
  rationale: Na-egosipụta ime ka mmekọrịta nke mebiri emebi laghachi n’udo, ma na-edobe Chineke dịka onye a na-eme ka ha na ya dịghachi ná mma.
- source_word: τοὺς ἀμφοτέρους
  choice: ha abụọ
  rationale: Na-ezo aka n’ìgwè abụọ ahụ e kwuru banyere ha n’okirikiri amaokwu ahụ, ndị Juu na ndị mba ọzọ.
- source_word: ἐν ἑνὶ σώματι
  choice: n’otu ahụ
  rationale: Na-edobe ihe oyiyi Pọl nke otu ahụ n’enweghị ịkọwa ya karịa ka Grik siri kwuo.
- source_word: διὰ τοῦ σταυροῦ
  choice: site n’obe
  rationale: Na-egosipụta obe dịka ụzọ e si mee ka ha na Chineke dịghachi ná mma.
- source_word: ἀποκτείνας τὴν ἔχθραν
  choice: gbuო iro ahụ
  rationale: Na-edobe ike nke okwu Grik ahụ, nke pụtara igbu ma ọ bụ iwepụ iro kpamkpam.
- source_word: ἐν αὐτῷ
  choice: ji obe ahụ
  rationale: A sụgharịrị nnọchiaha ahụ dịka ihe na-ezo aka n’obe, kwekọrọ na ntụgharị ‘by it’ nke oyi akwa nyocha Bekee; e mere ihe ọ na-ezo aka na ya ka o doo anya n’Igbo.
theological_decisions:
- issue: Ihe ‘otu ahụ’ pụtara
  choice: Edobere ‘n’otu ahụ’ n’enweghị ịkọwa ya dịka ụka ma ọ bụ ahụ Kraịst kpọmkwem.
  alternative: n’otu ahụ, ya bụ ụka / n’ahụ Kraịst
  rationale: Grik na-ekwu naanị ‘n’otu ahụ’; ịgbakwunye nkọwa ahụ ga-emechi nghọta okwu ahụ karịa ihe isi mmalite kwuru.
- issue: Ihe ἐν αὐτῷ na-ezo aka na ya
  choice: A họọrọ ‘ji obe ahụ,’ ya bụ, site n’obe ka e ji gbuo iro ahụ.
  alternative: n’ime onwe ya / n’ahụ ya
  rationale: Nnọchiaha Grik ahụ nwere ike ịkpalite ajụjụ, ma ihe kacha nso na usoro okwu bụ ‘obe,’ nke kwekọkwara na mkpebi ntụgharị e nyere. Ịkpọ ‘obe ahụ’ aha ọzọ na-eme ka Igbo bụrụ nke doro anya.
translation_notes:
  register: Igbo ọkọlọtọ, asụsụ dị ugbu a ma dị ùgwù. A họọrọ usoro okwu sitere n’okike Igbo kama ịgbaso nhazi Grik n’ụzọ ga-ada arọ; e chekwara ihe oyiyi ‘otu ahụ,’ ‘obe,’ na ‘igbu iro.’
