- from: ka o wee mee ka ha abụọ na Chineke dịghachi ná mma n’otu ahụ site n’obe, ebe o ji obe ahụ gbuo iro ahụ.
  to: ka o wee mee ka ha abụọ na Chineke dịghachi ná mma n’otu ahụ site n’obe, mgbe o ji ya gbuo iro ahụ.
  rationale: The revision retains every major element of the draft and the audit-trail understanding of ἐν αὐτῷ as referring to the cross (“ya” = obe), but replaces the inaccurate locative connector ebe with mgbe, which better expresses the Greek participial action. No footnote is needed because the antecedent of ya is explicitly supplied immediately before it.
