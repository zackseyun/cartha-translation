  yaml_path: translation/nt/ephesians/002/009.yaml
  text: not from works[a], so that no one may boast.
translation:
  language: ig
  text: ọ bụghị site n'ọrụ[a], ka onye ọ bụla ghara ịnya isi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụghị nke sitere n'ọrụ.” Nkebiokwu a na-egosi isi mmalite; ụfọdụ ndị na-akọwa ya na-ahụkwa echiche nke ụzọ e si enweta ihe, ya bụ, “site n'ọrụ.” Ma n'ụzọ nkịtị, okwu Grik ahụ pụtara “site n'ọrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: ọ bụghị site n'ọrụ
  rationale: “Site na” na-egosipụta isi mmalite dịka ἐξ si eme, ebe “ọrụ” na-edobe okwu Grik ahụ n'obosara ya n'etinyeghị “ọrụ iwu” ma ọ bụ “ezi ọrụ” n'ime ya.
- source_word: ἵνα μή τις
  choice: ka onye ọ bụla ghara
  rationale: Nke a bụ ụzọ Igbo dị ndụ isi gosipụta nzube ma ọ bụ ihe a chọrọ izere, ya bụ, “ka ... ghara.” “Onye ọ bụla” na-anọchi onye ọbụla n'enweghị ịkpa ókè nwoke na nwanyị.
- source_word: καυχήσηται
  choice: ịnya isi
  rationale: “Ịnya isi” bụ okwu Igbo doro anya maka ịsị ma ọ bụ iche onwe mmadụ elu, ma na-edobe ike okwu Pọl banyere ịnya isi.
theological_decisions:
- issue: Ihe “ọrụ” pụtara n'okwu Pọl
  choice: E debere naanị “ọrụ” n'obosara ya.
  alternative: ọrụ iwu; mbọ mmadụ; ezi ọrụ
  rationale: ἔργων pụtara naanị “ọrụ” n'ebe a. Ịgbakwunye “iwu,” “mmadụ,” ma ọ bụ “ezi” ga-akọwapụta ihe ederede n'onwe ya na-akọwaghị, ma si otú ahụ dozie esemokwu nkọwa ahụ n'ụzọ ntụgharị asụsụ.
- issue: Mmekọrịta ἐξ na “ọrụ”
  choice: site n'ọrụ
  alternative: n'ihi ọrụ; site n'ime ọrụ
  rationale: “Site n'ọrụ” na-edobe echiche isi mmalite nke ἐξ. Nhọrọ ndị ọzọ nwere ike ime ka ọ bụrụ naanị ụzọ e si enweta ihe ma ọ bụ kpọọ ime ọrụ aha karịa ka Grik si kwuo.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu a na-aga n'ihu n'echiche amaokwu ndị bu ya ụzọ; ya mere e ji obere mkpụrụedemede malite ya. E debere akara nkọwa [a] ozugbo “ọrụ” gachara.
