id: EPH.2.13
reference: Ephesians 2:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν ⸂ἐγενήθητε ἐγγὺς⸃ ἐν τῷ αἵματι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/013.yaml
  text: But now in Messiah Jesus[d][c][b][a], you who once were far away have become near by the blood of the Messiah.
translation:
  language: ig
  text: Ma ugbu a, n'ime Mesaịa Jizọs[d], unu ndị nọbu n'ebe dị anya[a] abịaruola nso[b] site n'ọbara Mesaịa ahụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nọbu n'ebe tere aka.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “e meela ka unu bịaruo nso.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n'ọbara Mesaịa ahụ.”
    reason: lexical_alternative
  - marker: d
    text: N'asụsụ Grik, “Kraịst”; a sụgharịrị ya ebe a “Mesaịa” n'ihi na Χριστός bụ utu aha.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ma ugbu a
  rationale: “Ma” na-egosi mgbanwe megide ọnọdụ e kwuru na mbụ, ebe “ugbu a” na-echekwa ike oge dị na νυνί.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n'ime Mesaịa Jizọs
  rationale: “N'ime” na-echekwa okwu Pọl banyere ịdị n'otu na Mesaịa, kama ịkọwa ya n'ụzọ ga-eme ka ihe ọ pụtara dị warara; “Mesaịa” na-asụgharị Χριστός dị ka utu aha.
- source_word: ὑμεῖς οἵ ποτε ὄντες
  choice: unu ndị nọbu
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa nkenke isi gosi ndị a na-agwa okwu na ọnọdụ ha nọ na mbụ.
- source_word: μακρὰν
  choice: n'ebe dị anya
  rationale: Ọ na-egosi ịdị anya n'ụzọ nkịtị ma na-ahapụkwa echiche mmekọrịta na ọnọdụ ọgbụgba ndụ dị n'okwu gbara ya gburugburu.
- source_word: ἐγενήθητε ἐγγὺς
  choice: abịaruola nso
  rationale: Nke a bụ okwu Igbo e ji ekwu mgbanwe site n'ịdị anya ruo n'ịdị nso, ma ọ naghị akpọpụta onye mere ka mgbanwe ahụ mee karịa ka Grik si kwuo ya.
- source_word: ἐν τῷ αἵματι
  choice: site n'ọbara
  rationale: “Site na” na-egosi ụzọ ma ọ bụ ihe e ji mee ka ịbịaru nso ahụ pụta, ma ọ naghị ewebata nkọwa mgbaghara mmehie karịrị ihe amaokwu ahụ kwuru.
- source_word: τοῦ Χριστοῦ
  choice: Mesaịa ahụ
  rationale: A sụgharịrị Χριστός dị ka utu aha “Mesaịa”; “ahụ” na-eme ka ntụaka ahụ bụrụ ihe e kwuru banyere ya mbụ ma bụrụkwa Igbo ebumpụta ụwa.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: Χριστός na-arụ ọrụ dị ka utu aha n'ebe a; “Mesaịa” na-ebupụta ihe utu aha ahụ pụtara kama iji naanị mkpụrụokwu e si n'asụsụ ọzọ webata.
- issue: Ike ἐν τῷ αἵματι τοῦ Χριστοῦ
  choice: site n'ọbara Mesaịa ahụ
  alternative: n'ọbara Mesaịa ahụ; sitekwa n'ọnwụ Mesaịa ahụ
  rationale: “Site n'ọbara” na-echekwa ihe atụ ọbara nke ederede ahụ ma na-egosi ụzọ e si bịaruo nso, n'enweghị itinye ozizi mgbaghara mmehie zuru ezu nke amaokwu ahụ n'onwe ya na-akọwaghị.
- issue: Ike olu ἐγενήθητε
  choice: abịaruola nso
  alternative: e meela ka unu bịaruo nso
  rationale: Ụdị a na-egosipụta mgbanwe ahụ n'Igbo ebumpụta ụwa ma na-ahapụ ajụjụ banyere onye mere ya n'ụzọ kwekọrọ na γίνομαι, kama ime ka ihe e zoro ezo bụrụ olu mmebere doro anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro ọdịiche dị n'etiti “nọbu n'ebe dị anya” na “abịaruola nso,” nakwa okwu Pọl bụ “n'ime Mesaịa,” n'enweghị nkọwa mgbakwunye ga-eme ka echiche ya dị warara.
