id: EPH.2.12
reference: Ephesians 2:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: ig
  text: na n’oge ahụ unu nọ na-enweghị Mezaya[a], bụrụ ndị e kewapụrụ n’obodo Izrel, bụrụkwa ndị mba ọzọ n’ọgbụgba ndụ dị iche iche nke nkwa ahụ[b], na-enweghị olileanya, na-enweghịkwa Chineke[c] n’ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” Utu aha Grik Χριστός nwere ike ịsụgharị n’ụzọ abụọ a; “Mezaya” na-eme ka ihe utu aha ahụ pụtara n’ọnọdụ metụtara ndị Juu na ọgbụgba ndụ pụta ìhè.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ọgbụgba ndụ dị iche iche nke nkwa.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ndị na-adịghị asọpụrụ Chineke.” Okwu ahụ nwere ike ịpụta ịnọ n’enweghị ezi Chineke, ọ bụghị naanị ịgọnahụ n’echiche nkà ihe ọmụma na Chineke dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: n’enweghị Mezaya
  rationale: “Mezaya” na-egosipụta na Χριστός bụ utu aha Onye E Tere Mmanụ n’ọnọdụ a metụtara Izrel na ọgbụgba ndụ ya; “n’enweghị” na-echekwa echiche nke ịnọpụ n’ebe ọ nọ.
- source_word: ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραήλ
  choice: e kewapụ unu n’ọha obodo Izrel
  rationale: Perfect passive participle ahụ na-akọ ọnọdụ a nọ na ya n’ihi nkewapụ. “Ọha obodo Izrel” na-egosipụta obodo/usoro ndụ ndị Izrel dịka otu, ọ bụghị naanị ikike iwu nke otu onye.
- source_word: ξένοι
  choice: ndị ọbịa
  rationale: Nke a na-echekwa ihe oyiyi nke ndị nọ n’èzí mmekọrịta ọgbụgba ndụ na nke ọha mmadụ, ma bụrụkwa okwu Igbo doro anya.
- source_word: διαθηκῶν τῆς ἐπαγγελίας
  choice: ọgbụgba ndụ dị iche iche nke nkwa ahụ
  rationale: “Dị iche iche” na-eme ka plural διαθηκῶν pụta ìhè; “nke nkwa ahụ” na-echekwa singular ἐπαγγελίας na njikọ genitive ya na-enweghị ime ka ọ bụrụ ọtụtụ nkwa.
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: unu enweghị olileanya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma dị ndụ isi kọwaa ọnọdụ nke enweghị olileanya.
- source_word: ἄθεοι
  choice: ndị na-enweghị Chineke
  rationale: Nhọrọ a na-echekwa echiche nke ịnọ n’enweghị Chineke, kama ibubata echiche ọgbara ọhụrụ banyere ndị na-agọnahụ na Chineke dị.
- source_word: ἐν τῷ κόσμῳ
  choice: n’ụwa
  rationale: Ọ bụ nsụgharị dị mkpirikpi, nke sitere n’okwu ahụ kpọmkwem ma bụrụkwa Igbo nkịtị.
theological_decisions:
- issue: Otú e si sụgharịa Χριστός n’ọnọdụ a
  choice: Mezaya
  alternative: Kraịst
  rationale: Ọnọdụ ahụ bụ nke ndị mba ọzọ, Izrel, na ọgbụgba ndụ; ya mere utu aha “Mezaya” na-eme ka ihe okwu Grik ahụ pụtara n’ọnọdụ ndị Juu pụta ìhè. E nyere “Kraịst” n’ala ala peeji dịka ụzọ ọzọ ziri ezi.
- issue: Ihe ἄθεοι pụtara
  choice: ndị na-enweghị Chineke
  alternative: ndị na-adịghị asọpụrụ Chineke
  rationale: Okwu ahụ nwere ike igosi ndị na-enweghị ezi Chineke ma ọ bụ ndị na-adịghị asọpụrụ Chineke. Isi ederede anaghị akpọ ha ndị ekweghị na Chineke dị n’echiche nkà ihe ọmụma ọgbara ọhụrụ, ma ihe ọzọ ga-ekwe omume dị n’ala ala peeji.
- issue: Njikọ genitive na διαθηκῶν τῆς ἐπαγγελίας
  choice: ọgbụgba ndụ dị iche iche nke nkwa ahụ
  alternative: ọgbụgba ndụ dị iche iche nke nkwa
  rationale: E debere ọtụtụ ọgbụgba ndụ na otu nkwa dịka Grik si kwuo, na-enweghị ịkọwa kpọmkwem ụdị njikọ ha karịa ka ederede si mee.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-aga n’usoro nkebi Grik, ma e mere ya ka ọ na-ada nke ọma n’Igbo. E debere ọdịiche dị n’etiti ọtụtụ ọgbụgba ndụ na otu nkwa, tinyekwa akara ala ala peeji [a], [b], na [c] n’ebe okwu ha metụtara dị.
