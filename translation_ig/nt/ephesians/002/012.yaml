revisions:
- from: na n’oge ahụ unu nọ n’enweghị Mezaya[a], e kewapụ unu n’ọha obodo Izrel, unu bụrụkwa ndị ọbịa n’ọgbụgba ndụ dị iche iche nke nkwa ahụ[b], unu enweghị olileanya, bụrụkwa ndị na-enweghị Chineke n’ụwa[c].
  to: na n’oge ahụ unu nọ na-enweghị Mezaya[a], bụrụ ndị e kewapụrụ n’obodo Izrel, bụrụkwa ndị mba ọzọ n’ọgbụgba ndụ dị iche iche nke nkwa ahụ[b], na-enweghị olileanya, na-enweghịkwa Chineke[c] n’ụwa.
  rationale: The revision retains the source’s syntax and ambiguity while using more idiomatic Standard Igbo. It represents the perfect passive force of ἀπηλλοτριωμένοι as a state of being excluded, renders ξένοι as covenantal/social outsiders rather than guests, and moves footnote c to the term ἄθεοι that it explains. No theological interpretation beyond the source wording is added.
