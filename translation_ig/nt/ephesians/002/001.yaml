source:
  edition: SBLGNT
  text: Καὶ ὑμᾶς ὄντας νεκροὺς τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/001.yaml
  text: And you were dead in your trespasses and sins,
translation:
  language: ig
  text: Unu kwa, ndị nwụrụ anwụ n’ihi njehie na mmehie unu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεκρούς
  choice: ndị nwụrụ anwụ
  rationale: Na-edobe ihe atụ siri ike nke Grik banyere ọnọdụ ime mmụọ ha dị ka ọnwụ, kama ime ka ọ bụrụ naanị adịghị ike.
- source_word: παραπτώμασιν
  choice: mmebi iwu
  rationale: Na-egosi omume ịda n'akụkụ ụzọ ziri ezi ma ọ bụ ịgabiga ókè; ọ na-adị iche ntakịrị na okwu sara mbara bụ ‘mmehie’.
- source_word: ἁμαρτίαις
  choice: mmehie
  rationale: Nke a bụ okwu Igbo a na-ahụkarị ma ghọta nke ọma maka ἁμαρτία.
- source_word: ὑμῶν
  choice: unu
  rationale: E tinyere ya n'okwu abụọ ahụ dịka usoro Grik si egosi na mmebi iwu na mmehie ndị ahụ bụ nke ndị a na-agwa okwu.
- source_word: ὄντας
  choice: bụ ndị
  rationale: Nke a na-edobe participle nke Grik; amaokwu ahụ bụ mmalite ahịrịokwu na-aga n'ihu ruo n'amaokwu ndị so ya, ya mere a naghị etinye ngwaa zuru oke ‘unu nọ’ ma ọ bụ ‘unu bụbu’ n'ụzọ ga-eme ka ọ dị ka ahịrịokwu kwụụrụ onwe ya.
theological_decisions:
- issue: Ma a ga-atụgharị νεκρούς n'ụzọ nkịtị ma ọ bụ kọwaa ya dị ka nkewa n'ebe Chineke nọ
  choice: ndị nwụrụ anwụ
  alternative: ndị e kewapụrụ n'ebe Chineke nọ
  rationale: Ihe odide ahụ n'onwe ya jiri ihe atụ ‘ndị nwụrụ anwụ’; ịkọwa ya ozugbo dịka nkewa n'ebe Chineke nọ ga-emechi obosara na esemokwu nkà mmụta okpukpe nke ihe atụ ahụ.
- issue: Oge ngwaa nke ọnọdụ ọnwụ ahụ
  choice: bụ ndị nwụrụ anwụ
  alternative: unu bụbu ndị nwụrụ anwụ
  rationale: ὄντας bụ participle dị ugbu a n'usoro ahịrịokwu Grik, ọ bụghị ngwaa oge gara aga. Ihe gbara ya gburugburu nwere ike iduga ntụgharị oge gara aga n'asụsụ ụfọdụ, ma amaokwu a naanị ya ka mma ka ọ ghara ịgbakwunye oge ngwaa nke adịghị n'okwu ahụ.
translation_notes:
  register: Standard Igbo dị ugwu ma dị mfe nghọta. A hapụrụ rikoma n'ikpeazụ iji gosipụta na Ephesians 2:1 abụghị ahịrịokwu zuru oke n'asụsụ Grik, kama ọ na-aga n'ihu n'amaokwu ndị so ya.
