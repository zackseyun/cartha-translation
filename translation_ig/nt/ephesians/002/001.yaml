revisions:
- from: Unu onwe unu bụ ndị nwụrụ anwụ n'ihi mmebi iwu unu na mmehie unu,
  to: Unu kwa, ndị nwụrụ anwụ n’ihi njehie na mmehie unu,
  rationale: Removed unsupported reflexive emphasis, represented the connective καί with “kwa,” and replaced the overly legal “mmebi iwu” with “njehie” for the broader sense of παραπτώματα. The death metaphor, the distinction of the paired terms, plural address, and the open syntactic continuation are retained.
  reviewer_model: gpt-5.6-terra
