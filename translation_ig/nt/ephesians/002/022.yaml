  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: ig
  text: N’ime ya ka a na-ewukọtakwa unu ọnụ ka unu bụrụ ebe obibi Chineke n’ime Mmụọ Nsọ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ime ya” (ya bụ, n’ụlọ ahụ), ma ọ bụrụ na ewere nnọchiaha a ka ọ na-ezo aka n’ụlọ ahụ dum kama izo aka kpọmkwem na Kraịst.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “n’ime mmụọ” ma ọ bụ “site n’aka Mmụọ Nsọ.” Nkebiokwu a pụrụ igosi ọnọdụ Chineke bi ma ọ bụ ọrụ Mmụọ Nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: N’ime onye ahụ
  rationale: Ọ na-ezo aka n’ebe Kraịst nọ dịka onye a kpọtụrụ aha n’usoro okwu dị nso; Igbo jiri “onye” mee ka ntụaka ahụ bụrụ nke onye, ma debe “n’ime” maka ἐν.
- source_word: καὶ ὑμεῖς
  choice: unu ... kwa
  rationale: “Unu” na-egosi onye nke abụọ ọtụtụ ma na-edebe nkwusi ike nke nnọchiaha ahụ; “kwa” na-egosi ike mgbakwunye nke καί.
- source_word: συνοικοδομεῖσθε
  choice: a na-ewukọ ... unu ọnụ
  rationale: Ụdị a na-egosi omume na-aga n’ihu na onye a na-eme ya, ebe “ọnụ” na-echekwa σύν, ya bụ, iwukọ ha dịka otu ihe.
- source_word: εἰς κατοικητήριον
  choice: ka unu bụrụ ebe obibi
  rationale: “Ka unu bụrụ” na-egosi ebumnuche ma ọ bụ nsonaazụ nke εἰς n’Igbo eke; “ebe obibi” na-echekwa ihe atụ ụlọ nsọ nke κατοικητήριον.
- source_word: τοῦ θεοῦ
  choice: nke Chineke
  rationale: N’usoro “ebe obibi nke Chineke,” genitive a na-egosi na Chineke bụ onye nwe ma bụrụkwa onye bi n’ebe ahụ, n’enweghị ịgbakwunye nkọwa karịrị isi mmalite.
- source_word: ἐν πνεύματι
  choice: n’ime Mmụọ Nsọ
  rationale: Ọnọdụ ụlọ nsọ na ibi n’ime ya na-akwado ntụaka nye Mmụọ Nsọ. “N’ime” na-edebe ἐν ma ghara imechi kpamkpam ma ọ bụ ọnọdụ ma ọ bụ ọrụ onye na-eme ihe.
theological_decisions:
- issue: Ihe ἐν ᾧ na-ezo aka na ya
  choice: 'A sụgharịrị ya dịka ntụaka nye Kraịst: “N’ime onye ahụ.”'
  alternative: 'Ọ pụrụ izo aka n’ụlọ ahụ dum: “N’ime ya.”'
  rationale: Usoro okwu dị n’amaokwu ndị bu ụzọ na-etinye njikọ na uto nke ụlọ ahụ n’ime Kraịst. Ma n’ihi na ụdị Greek ahụ pụrụ ịnabata ntụaka nye ụlọ ahụ, e debere nhọrọ ọzọ na nkọwa ala peeji.
- issue: Ihe ἐν πνεύματι pụtara
  choice: A họọrọ “n’ime Mmụọ Nsọ.”
  alternative: “n’ime mmụọ” ma ọ bụ “site n’aka Mmụọ Nsọ.”
  rationale: N’ọnọdụ ụlọ nsọ na ebe Chineke bi, o yikarịrị ka ọ bụ Mmụọ Nsọ ka e kwuru. A hapụrụ preposition ahụ dịka “n’ime” iji ghara ime ka ọ bụrụ naanị ụzọ ọrụ, ebe nkọwa ala peeji na-echekwa nghọta ndị ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị nsọ n’ụda. E ji “a na-ewukọ” gosipụta passive na omume na-aga n’ihu; “unu” na-eme ka ọtụtụ mmadụ a na-agwa doo anya. Akara nkọwa ala peeji [a] na [b] dị n’isi ederede dịka achọrọ.
