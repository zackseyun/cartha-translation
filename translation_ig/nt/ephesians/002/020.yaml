id: EPH.2.20
reference: Ephesians 2:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐποικοδομηθέντες ἐπὶ τῷ θεμελίῳ τῶν ἀποστόλων καὶ προφητῶν, ὄντος ἀκρογωνιαίου αὐτοῦ ⸂Χριστοῦ Ἰησοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/020.yaml
  text: having been built on the foundation of the apostles and prophets[a], Messiah Jesus himself being the cornerstone[b],
translation:
  language: ig
  text: ebe e wukwasịrị unu n’elu ntọala nke ndị ozi na ndị amụma[a], Mesaya Jizọs[b] n’onwe ya bụ nkume isi nkuku,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu ahụ, “nke ndị ozi na ndị amụma,” nwere ike ịpụta ntọala metụtara ihe akaebe ha, ntọala ha tọrọ, ma ọ bụ ntọala nke ha onwe ha mejupụtara; genitive Grik akọwaghị ya nke ọma karịa nke a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “Mesaya Jizọs” dị ka “Kraịst Jizọs.” E ji “Mesaya” sụgharịa aha ọkwa Grik bụ Χριστός n’ebe a iji chekwaa ihe ọ pụtara.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποικοδομηθέντες
  choice: ebe e wukwasịrị unu
  rationale: Nke a na-edobe participle a n’ụdị passive ma gosi na ọ bụ Chineke wuru ndị a na-agwa okwu ka ha bụrụ akụkụ ụlọ ahụ. “Ebe” na-ejikọ nkebi ahịrịokwu a na ahịrịokwu gbara ya gburugburu.
- source_word: ἐπὶ τῷ θεμελίῳ
  choice: n’elu ntọala
  rationale: Ọ na-egosipụta ihe ụlọ ahụ dabere na ya, dịka ihe atụ ihe owuwu dị n’asụsụ Grik.
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: nke ndị ozi na ndị amụma
  rationale: “Nke” na-edobe genitive Grik n’enweghị ịkọwa kpọmkwem ma ha bụ ntọala ahụ, ma ha tọrọ ya, ma ọ bụ na ntọala ahụ metụtara ozi ha.
- source_word: ὄντος
  choice: bụ
  rationale: N’Igbo, copula “bụ” na-enye ụzọ dị mfe ma dị ndụ isi gosipụta ọnọdụ Kraịst n’ihe atụ ụlọ a, n’agbanyeghị na Grik jiri participle.
- source_word: ἀκρογωνιαίου
  choice: nkume isi nkuku
  rationale: Nke a bụ okwu Igbo doro anya maka cornerstone, nkume dị mkpa nke na-achịkọta ma na-edozi akụkụ ụlọ.
- source_word: αὐτοῦ
  choice: n’onwe ya
  rationale: Ọ na-edobe nkwusi ike nke pronoun ahụ ma mee ka o doo anya na ọ na-ezo aka na Mesaya Jizọs.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesaya Jizọs
  rationale: Χριστός bụ aha ọkwa pụtara Onye E Tere Mmanụ; “Mesaya” na-echekwa ihe aha ọkwa ahụ pụtara n’ebe a.
theological_decisions:
- issue: Ihe “ntọala nke ndị ozi na ndị amụma” pụtara
  choice: 'E debere njikọ ahụ n’ụdị sara mbara: “ntọala nke ndị ozi na ndị amụma.”'
  alternative: “ntọala ndị ozi na ndị amụma tọrọ” ma ọ bụ “ntọala nke bụ ndị ozi na ndị amụma.”
  rationale: Genitive Grik akọwaghị ma ntọala ahụ bụ ndị ahụ n’onwe ha, ihe akaebe/ozi ha, ma ọ bụ ihe ha tọrọ. Nsụgharị ahụ anaghị ekpebi ihe ederede ahụ na-ekpebighị.
- issue: Nsụgharị Χριστός
  choice: Mesaya Jizọs
  alternative: Kraịst Jizọs
  rationale: N’ebe a, Χριστός ka na-arụ ọrụ dịka aha ọkwa. “Mesaya” na-eme ka echiche nke Onye E Tere Mmanụ pụta ìhè, ebe e nyere ụdị ọdịnala “Kraịst” na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E chekwara ihe atụ ihe owuwu ahụ (“ntọala,” “nkume isi nkuku”) na mgbagwoju anya dị na genitive Grik, n’etinyeghị nkọwa ụka ọ bụla n’ime ederede.
