  text: ἐν ᾧ ⸀πᾶσα οἰκοδομὴ συναρμολογουμένη αὔξει εἰς ναὸν ἅγιον ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/021.yaml
  text: in whom the whole building[a], being fitted together, grows into a holy temple in the Lord,
translation:
  language: ig
  text: N’ime ya ka ụlọ ahụ dum[a], nke a na-ejikọta ọnụ, na-eto ghọọ ụlọ nsọ dị nsọ n’ime Onyenweanyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụlọ nke ọ bụla.” Enwere ike ịghọta ahịrịokwu Grik ahụ dịka ụlọ dị iche iche n’otu n’otu, ma ọ bụ dịka otu ụlọ dum. Ihe odide bụ isi gbasoro ihe atụ nke otu ụlọ nsọ jikọrọ ọnụ n’amaokwu ndị gbara ya gburugburu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: N’ime onye ahụ
  rationale: Nnọchiaha ahụ na-arụtụ aka n’ebe Kraịst nọ n’amaokwu bu ụzọ; nsụgharị a na-egosi onye a na-ekwu maka ya ma na-edobe echiche Pọl nke ịdị n’ime Kraịst.
- source_word: πᾶσα οἰκοδομὴ
  choice: ụlọ ahụ dum
  rationale: Ọ bụ ezie na okwu Grik ahụ nwekwara ike ịpụta ‘ụlọ nke ọ bụla,’ ihe ndị gbara ya gburugburu na-akọwa otu ụlọ nsọ jikọrọ ndị Chineke ọnụ.
- source_word: συναρμολογουμένη
  choice: nke a na-ejikọta akụkụ ya niile ọnụ nke ọma
  rationale: Nke a na-egosi omume na-aga n’ihu nke ijikọta akụkụ dị iche iche ka ha bụrụ otu ụlọ zuru oke, ma na-edobe ihe atụ gbasara iwu ụlọ.
- source_word: αὔξει
  choice: na-eto
  rationale: Ọ na-egosi uto na-aga n’ihu, ma na-edobe njikọ ihe atụ nke ụlọ na uto nke ihe dị ndụ.
- source_word: εἰς
  choice: ghọọ
  rationale: 'N’ebe a εἰς na-egosi ihe uto ahụ na-eduga na ya: ụlọ ahụ na-eto ka ọ bụrụ ụlọ nsọ.'
- source_word: ναὸν ἅγιον
  choice: ụlọ nsọ dị nsọ
  rationale: ναός na-ezo aka n’ebe nsọ nke ụlọ ukwu ahụ; ‘ụlọ nsọ’ bụ okwu Igbo doro anya, ebe ‘dị nsọ’ na-ebufe ἅγιον ozugbo.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Nke a na-edobe okwu Pọl na obosara ihe ọ pụrụ ịpụta banyere ọnọdụ ma ọ bụ ịdị n’otu na Onyenwe anyị, n’etinyeghị nkọwa karịrị ihe odide ahụ.
theological_decisions:
- issue: Ma ᾧ ọ na-arụtụ aka n’ebe Kraịst nọ n’onwe ya, ka ọ bụ n’ebe ihe atụ nke nkume isi nkuku ma ọ bụ ụlọ ahụ nọ
  choice: 'Ọ na-arụtụ aka n’ebe Kraịst nọ: ‘N’ime onye ahụ’'
  alternative: 'Ọ na-arụtụ aka n’ebe ụlọ ahụ nọ: ‘N’ime ya’'
  rationale: Onye kacha nso a kpọrọ aha n’amaokwu 20 bụ Mesaya Jizọs n’onwe ya dịka nkume isi nkuku, okwu Pọl ugboro ugboro banyere ịdị ‘n’ime ya’ n’akụkụ a kwadokwara ntụaka nke onwe onye.
- issue: Ma πᾶσα οἰκοδομὴ ọ pụtara ụlọ niile dịka otu, ka ọ bụ ụlọ nke ọ bụla
  choice: 'Echiche nke otu ụlọ jikọtara ọnụ: ‘ụlọ ahụ dum’'
  alternative: 'Echiche nkesa: ‘ụlọ nke ọ bụla’'
  rationale: Ihe ndị gbara amaokwu ahụ gburugburu na-emesi ịdị n’otu nke ndị Juu na ndị mba ọzọ ike dịka otu ndị na otu ụlọ nsọ; ma e debere nhọrọ ọzọ na nkọwa ala peeji n’ihi na usoro okwu Grik ahụ na-enye ohere maka ya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma doo ndị nkịtị anya. E debere ihe atụ nke iwu ụlọ na uto, tinyere ahịrịokwu Pọl ‘n’ime Onyenwe anyị,’ n’enweghị itinye nkọwa ụka pụrụ iche.
