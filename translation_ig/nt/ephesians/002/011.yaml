id: EPH.2.11
reference: Ephesians 2:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὸ μνημονεύετε ὅτι ⸂ποτὲ ὑμεῖς⸃ τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: ig
  text: Ya mere, chetanụ na n’oge gara aga, unu[a], ndị mba ọzọ n’anụ ahụ, bụ ndị a na-akpọ “ndị a na-ebighị úgwù”[b] site n’aka ndị a na-akpọ “ndị e biri úgwù,” ndị e biri úgwù n’anụ ahụ site n’aka mmadụ[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “na unu n’oge gara aga bụ ndị mba dị iche iche n’anụ ahụ.” N’asụsụ Grik, e mesiri “unu” ike; ebe a, “ndị mba dị iche iche” pụtara ndị na-abụghị ndị Juu.
    reason: lexical_alternative
  - marker: b
    text: “Ndị e biri úgwù” na “ndị a na-ebighị úgwù” bụ aha e ji amata òtù agbụrụ na ọgbụgba ndụ n’ebe a; ọ bụghị naanị nkọwa banyere ahụ mmadụ.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụ ya, “site n’aka ihe a na-akpọ ‘ibi úgwù,’ nke e ji aka mee n’anụ ahụ.” Nkwughachi okwu “a na-akpọ” nwere ike igosi na Pọl na-akọwa ibi úgwù nke dị naanị n’ahụ n’ụzọ nkatọ.
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya, ma bụrụkwa okwu Igbo doro anya ma dị ebube.
- source_word: μνημονεύετε
  choice: chetanụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ; “chetanụ” bụ ụzọ Igbo nkịtị si kwuo ya n’enweghị ịgbakwụnye ihe na-adịghị n’isiokwu.
- source_word: ποτὲ ὑμεῖς
  choice: na n’oge gara aga, unu
  rationale: Na-echekwa ọdịiche oge ahụ ma na-enye “unu” ọnọdụ pụtara ìhè dịka Grik siri mesie ya ike.
- source_word: τὰ ἔθνη
  choice: ndị mba ọzọ
  rationale: N’ọnọdụ esemokwu ndị Juu na ndị na-abụghị ndị Juu, okwu a na-ezo aka n’ebe ndị na-abụghị ndị Juu nọ, ọ bụghị naanị mba ndọrọ ndọrọ ọchịchị.
- source_word: ἐν σαρκί
  choice: n’anụ ahụ
  rationale: N’ebe a, σάρξ na-ekwu maka ọnọdụ a na-ahụ n’ahụ na njirimara agbụrụ, ọ bụghị ọdịdị mmehie.
- source_word: οἱ λεγόμενοι ἀκροβυστία
  choice: na-akpọ “ndị a na-ebighị úgwù”
  rationale: Na-echekwa ya dịka aha òtù mmadụ na-akpọ ha, kama ime ya naanị nkọwa akụkụ ahụ.
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: ndị òtù a na-akpọ “ndị e biri úgwù” ... na-akpọ
  rationale: Igbo chọrọ ka ndị na-akpọ aha ahụ pụta ìhè; “a na-akpọ” na-echekwa nkwughachi λεγόμενοι/λεγομένης na ntakịrị ịdị anya Pọl tinyere n’aha ahụ.
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: ibi úgwù nke e ji aka mee n’anụ ahụ
  rationale: Na-ejikọta χειροποίητος nke ọma na ibi úgwù, ma na-echekwa echiche nke omume mmadụ ji aka mee n’ahụ.
theological_decisions:
- issue: Ihe σάρξ pụtara n’ebe a
  choice: anụ ahụ
  alternative: ahụ mmadụ / n’ụzọ anụ ahụ
  rationale: Ihe a na-ekwu bụ akara agbụrụ na ọgbụgba ndụ dị n’ahụ, ọ bụghị mmebi omume ma ọ bụ ‘ọdịdị mmehie.’
- issue: Ike okwu λεγομένης n’aha περιτομή
  choice: òtù a na-akpọ “ndị e biri úgwù”
  alternative: ndị a sị na e biri úgwù
  rationale: Nhọrọ a na-echekwa na aha ahụ bụ ihe mmadụ na-akpọ òtù ahụ, ma ọ naghị eme ka ụda Pọl bụrụ ịkwa emo ma ọ bụ mgbochi ndị Juu karịa ihe Grik kwuru.
- issue: Ọnọdụ χειροποιήτου
  choice: jikọta ya na ibi úgwù nke e mere n’anụ ahụ
  alternative: were ya dịka nkọwa gbakwunyere n’ahịrịokwu
  rationale: N’asụsụ Grik, okwu ahụ na-akọwa περιτομῆς kpọmkwem ma na-egosi ibi úgwù a na-eme n’ahụ site n’aka mmadụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị mba ọzọ” kama mbinye okwu “ndị Jentaịl.” A haziri passive Grik ka ọ bụrụ usoro Igbo eke, ma e chekwara nkwughachi nke “a na-akpọ,” ọdịiche dị n’etiti ibi úgwù na ebighị úgwù, na akara nkwụsị n’ọgwụgwụ nke na-egosi na ahịrịokwu ahụ gara n’ihu na amaokwu 12.
