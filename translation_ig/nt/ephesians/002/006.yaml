id: EPH.2.6
reference: Ephesians 2:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ συνήγειρεν καὶ συνεκάθισεν ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/006.yaml
  text: and raised us up with him and seated us with him in the heavenly places in Messiah Jesus[b][a],
translation:
  language: ig
  text: O mekwara ka anyị soro ya bilie, meekwa ka anyị soro ya nọdụ n'ebe ndị dị n'eluigwe[a], n'ime Mesaịa Jizọs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n'ógbè eluigwe.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n'ime Kraịst Jizọs.”
    reason: alternative_reading
lexical_decisions:
- source_word: συνήγειρεν
  choice: mere ka anyị soro ya bilie
  rationale: Nganiihu συν- na-egosi na ndị kwere ekwe sonyere ya n'ibilite; ‘soro ya bilie’ na-ekwupụta nke a n'Igbo dị mfe ma doo anya. ‘Anyị’ sitere n'okwu gbara amaokwu a gburugburu.
- source_word: συνεκάθισεν
  choice: mere ka anyị soro ya nọdụ
  rationale: Okwu a pụtara ime ka mmadụ na onye ọzọ nọdụkọ. Nhọrọ a chekwara echiche nke isoro ya nọdụ, ma ọ kọwaghị ya karịa ihe Grik kwuru dị ka ịbụ e chiri ha eze.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: n'ebe ndị dị n'eluigwe
  rationale: Akpaokwu a na-ezo aka n'ebe ma ọ bụ ógbè nke eluigwe. Nsụgharị a bụ nke nkịtị, doro anya, ma na-echekwa nghọta nke ọnọdụ.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n'ime Mesaịa Jizọs
  rationale: Χριστός ka nwere ike nke utu aha ebe a; ‘Mesaịa’ na-eme ka ihe utu aha ahụ pụtara pụta ìhè, ebe ‘n'ime’ na-echekwa asụsụ Pọl banyere ịdị n'otu na ya.
- source_word: καὶ
  choice: O... mekwara ... meekwa
  rationale: Njikọ ndị a na-aga n'ihu n'usoro ihe Chineke mere n'ahịrịokwu buru ibu; ‘mekwara ... meekwa’ bụ ụzọ Igbo si jikọta omume ndị ahụ n'ụzọ ebumpụta ụwa.
theological_decisions:
- issue: Asụsụ nke iso Mesaịa dịrị n'otu n'ime ngwaa ndị nwere συν-
  choice: E kwuru ‘soro ya’ n'ime ngwaa abụọ ahụ.
  alternative: Ịsị naanị ‘mere ka anyị bilie, mee ka anyị nọdụ.’
  rationale: Nganiihu συν- n'ime ngwaa abụọ ahụ na-egosi isoro ya kerịta omume ndị a. Ikwupụta ‘soro ya’ na-echekwa ike okwu Grik n'etinyeghị ozizi ọzọ.
- issue: Ịsụgharị Χριστῷ dị ka utu aha ma ọ bụ ọdịdị yiri aha mmadụ
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: ‘Mesaịa’ na-egosipụta kpọmkwem na Χριστός bụ utu aha pụtara Onye E Tere Mmanụ; e nyere ụdị a na-ahụkarị ‘Kraịst Jizọs’ na nkọwa ala peeji n'ihi na okwu ahụ nwekwara ike ịrụ ọrụ dị ka aha a maara nke ọma.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Soro ya bilie’ na ‘soro ya nọdụ’ na-ada n'ụzọ ebumpụta ụwa karịa ịmepụta ngwaa ọhụrụ, ma ha ka na-echekwa njikọ συν- nke Grik. Akara nkọwa ala peeji [a] na [b] dị n'ederede isi.
