revisions:
- from: ka o wee gosi n’ọgbọ ndị na-abịa abịa[a] akụ̀ na ụba amara ya nke karịrị akarị[b], site n’obiọma ya n’ebe anyị nọ n’ime Mesaịa Jizọs.[c]
  to: ka o wee gosi n’oge ndị na-abịa[a] akụ̀ na ụba amara ya nke karịrị akarị[b], n’obiọma ya n’ebe anyị nọ n’ime Mesaịa Jizọs.[c]
  rationale: The revision corrects the construal of ἐν χρηστότητι by replacing the instrumental-sounding “site n’obiọma ya” with “n’obiọma ya.” It also replaces the awkward expression for the plural coming ages with a natural Standard Igbo equivalent. The remaining wording, including the title “Mesaịa,” faithfully represents the Greek and the stated translation policy.
