  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα ἐνδείξηται ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις ⸂τὸ ὑπερβάλλον πλοῦτος⸃ τῆς χάριτος αὐτοῦ ἐν χρηστότητι ἐφ’ ἡμᾶς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: ig
  text: ka o wee gosi n’oge ndị na-abịa[a] akụ̀ na ụba amara ya nke karịrị akarị[b], n’obiọma ya n’ebe anyị nọ n’ime Mesaịa Jizọs.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ọgbọ niile ga-abịa” ma ọ bụ “n’oge ndị ga-abịa.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “akụ̀ na ụba amara ya a na-apụghị ịtụ ókè.”
    reason: lexical_alternative
  - marker: c
    text: 'N’asụsụ Grik: “n’ime Kraịst Jizọs.” A sụgharịrị Χριστός dịka “Mesaịa” n’ebe a n’ihi na ọ na-arụ ọrụ dịka aha ọkwá.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ka o wee
  rationale: Na-egosi nzube ma ọ bụ ihe si n’ihe e kwuru tupu ya pụta; ọ bụkwa ụzọ Igbo dị ndụ si webata nkebiokwu nzube.
- source_word: ἐνδείξηται
  choice: gosi
  rationale: Na-eburu echiche nke ime ka ihe pụta ìhè ka a hụ ya, n’enweghị itinye nkọwa na-adịghị na Grik.
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: n’ọgbọ ndị na-abịa abịa
  rationale: Na-edobe ọtụtụ nke αἰῶσιν ma na-ekwu maka usoro oge ndị ga-abịa; ntụgharị ọzọ dị na ndetu ala.
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: akụ̀ na ụba ... nke karịrị akarị
  rationale: Na-egosipụta akụ̀ na ụba dị ukwuu nke gafere ihe nkịtị, ma na-anọgide n’asụsụ Igbo a na-aghọta ngwa ngwa.
- source_word: τῆς χάριτος αὐτοῦ
  choice: amara ya
  rationale: “Amara” bụ okwu Igbo a nabatara nke ọma maka χάρις n’ọnọdụ a ma na-edobe ike echiche Pọl banyere amara Chineke.
- source_word: ἐν χρηστότητι
  choice: site n’obiọma ya
  rationale: “Obiọma” na-egosi ịdị mma na mmesapụ aka; “site na” na-eme ka o doo anya na ọ bụ ụzọ e si egosipụta amara ahụ, n’agbanyeghị na ἐν nwekwara ike ịpụta ọnọdụ e ji mee ya.
- source_word: ἐφ’ ἡμᾶς
  choice: n’ebe anyị nọ
  rationale: Na-egosi na obiọma Chineke chere ihu n’ebe anyị nọ ma baara anyị uru.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaịa Jizọs
  rationale: Na-edobe okwu Pọl banyere ịdị “n’ime” Mesaịa ahụ, ma sụgharịa Χριστός dị ka aha ọkwá, ọ bụghị dị ka aha ezinụlọ.
theological_decisions:
- issue: Ma a ga-ewere Χριστός dị ka aha ọkwá ka ọ bụ dịka akụkụ aha mmadụ
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: N’ebe a Χριστός ka nwere ihe ọ pụtara dịka aha ọkwá nke Onye E Tere Mmanụ; ya mere a sụgharịrị ya “Mesaịa,” ebe “Kraịst” bụ ntụgharị mkpụrụokwu nke nwere ike ịdị ka aha nkịtị.
- issue: Njikọ nke ἐν χρηστότητι na amara Chineke
  choice: site n’obiọma ya n’ebe anyị nọ
  alternative: n’obiọma ya n’ebe anyị nọ
  rationale: A họọrọ “site na” dịka ụzọ e si egosipụta akụ̀ na ụba amara ahụ, ma ekweghị ka ntụgharị ahụ gbanwee obiọma ahụ ka ọ bụrụ ihe dị iche na amara Chineke.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “N’ọgbọ ndị na-abịa abịa” na-edobe ọtụtụ dị na Grik; “akụ̀ na ụba ... nke karịrị akarị” na-enye ịdị ukwuu nke ὑπερβάλλον n’enweghị ime ka okwu ahụ bụrụ nkọwa otu ụka; “n’ime Mesaịa Jizọs” na-edobe okwu njikọta Pọl nke ἐν Χριστῷ.
