id: EPH.2.4
reference: Ephesians 2:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πλούσιος ὢν ἐν ἐλέει, διὰ τὴν πολλὴν ἀγάπην αὐτοῦ ἣν ἠγάπησεν ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/004.yaml
  text: But God[a], being rich in mercy, because of his great love with which he loved us,
translation:
  language: ig
  text: Ma Chineke, ebe ọ bụ na ọ bara ọgaranya n’ebere, n’ihi nnukwu ịhụnanya ya nke o ji hụ anyị n’anya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi nnukwu ọdịiche dị n'etiti ọnọdụ ụmụ mmadụ a kọwara n'amaokwu ndị bu ụzọ na ihe Chineke mere.
- source_word: πλούσιος ὢν
  choice: ebe ọ bụ ọgaranya
  rationale: Nke a na-edobe echiche participle ahụ nke na-akọwa Chineke ma na-egosikwa ihe kpatara omume na-esochi.
- source_word: ἐν ἐλέει
  choice: n'ebere
  rationale: Ọ na-edobe okwu Grik ahụ nke pụtara n'ụzọ nkịtị ‘ọgaranya n'ebere,’ ma ‘ebere’ bụ okwu Igbo doro anya maka ἔλεος.
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: n'ihi nnukwu ịhụnanya ya
  rationale: διά na accusative na-egosi ihe kpatara ya; ‘nnukwu ịhụnanya’ na-enye πολλὴν ἀγάπην n'Igbo dị mma ma doo anya.
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: nke o ji hụ anyị n'anya
  rationale: Nke a na-edobe relative clause ahụ na nkwughachi sitere n'otu mgbọrọgwụ dị na ‘ịhụnanya ... hụ ... n'anya.’
theological_decisions:
- issue: Idobe nkwughachi ‘ịhụnanya ... hụ anyị n'anya’
  choice: nnukwu ịhụnanya ya nke o ji hụ anyị n'anya
  alternative: nnukwu ịhụnanya ya n'ebe anyị nọ
  rationale: Grik jiri noun na verb sitere n'otu mgbọrọgwụ mee nkwughachi maka imesi okwu ike; idobe ya na-eguzosi ike n'ihe nye ederede n'ebughị nkọwa ozizi ọzọ bata.
- issue: Mmekọrịta dị n'etiti ebere na ịhụnanya
  choice: Hapụ ‘ebere’ na ‘ịhụnanya’ dịka echiche abụọ dị iche ma nwee njikọ
  alternative: Jikọta ha dịka ‘ịhụnanya ya jupụtara n'ebere’
  rationale: Ederede Grik na-eweta ebere na ịhụnanya dịka ihe abụọ nwere njikọ, ọ bụghị otu echiche e jikọtara ọnụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro nke Grik ma bụrụkwa akụkụ ahịrịokwu na-aga n'ihu ruo amaokwu na-esote. Enweghị akara nkọwa ala peeji n'ihi na nsụgharị ‘n'ebere’ na-edobe okwu nkịtị nke Grik; nkọwa ala peeji Bekee e nyere anaghị kwekọọ nke ọma na marker ya.
