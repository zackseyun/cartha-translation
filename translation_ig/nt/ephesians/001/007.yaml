- from: N’ime ya ka anyị nwere mgbapụta site n’ọbara ya, ya bụ, mgbaghara mmehie anyị, dịka ụba amara ya si dị.
  to: N’ime ya ka anyị nwere mgbapụta site n’ọbara ya, ya bụ, mgbaghara mmehie, dịka ụba amara ya si dị.
  rationale: The sole revision removes the possessive 'anyị' from the rendering of παραπτωμάτων, since it is not present in the Greek text. The appositional wording 'ya bụ' is retained as a natural Igbo way to signal the relation between redemption and forgiveness, and all key lexical and theological imagery remains intact.
