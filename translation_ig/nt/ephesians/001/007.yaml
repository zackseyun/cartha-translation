  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν διὰ τοῦ αἵματος αὐτοῦ, τὴν ἄφεσιν τῶν παραπτωμάτων, κατὰ ⸂τὸ πλοῦτος⸃ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/007.yaml
  text: In him we have redemption through his blood[a], the forgiveness of trespasses[b], according to the riches of his grace
translation:
  language: ig
  text: N’ime ya ka anyị nwere mgbapụta site n’ọbara ya, ya bụ, mgbaghara mmehie, dịka ụba amara ya si dị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: N’ime ya
  rationale: Nnọchiaha a na-ezo aka n’Onye ahụ a hụrụ n’anya n’amaokwu bu ụzọ. “N’ime ya” bụ Igbo dị ire ma na-echekwa echiche nke ịdị n’ime Kraịst.
- source_word: ἔχομεν
  choice: ka anyị nwere
  rationale: Oge ugbu a nke ngwaa Grik na-egosi ihe ndị kwere ekwe nwere ugbu a; ntụgharị a bụ nke kwụ ọtọ ma bụrụ Igbo nkịtị.
- source_word: ἀπολύτρωσιν
  choice: mgbapụta
  rationale: “Mgbapụta” na-egosi nnwere onwe e wetara site n’ọnụ ahịa dị oke ọnụ, ma na-echekwa ịdị arọ nke okwu ahụ n’akwụkwọ Pọl.
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: site n’ọbara ya
  rationale: διά ya na genitive na-egosi ụzọ ma ọ bụ ihe e ji mee ya. A hapụrụ “ọbara” dịka ihe odide ahụ si kwuo iji chekwaa onyinyo àjà na ọnwụ.
- source_word: ἄφεσιν
  choice: mgbaghara
  rationale: N’ebe a, okwu ahụ na-egosi ịgbaghara mmehie ma kọwaa ihe mgbapụta ahụ pụtara ma ọ bụ na-eweta.
- source_word: παραπτωμάτων
  choice: mmehie anyị
  rationale: παράπτωμα na-ezo aka n’omume ọjọọ ma ọ bụ mmebi iwu. “Mmehie” bụ okwu ndị Igbo taa na-aghọta nke ọma; agbakwunyere “anyị” dịka ihe genitive ahụ pụtara n’ọnọdụ a, ọ bụghị iji webata echiche ọhụrụ.
- source_word: κατὰ τὸ πλοῦτος
  choice: dịka ụba ... si dị
  rationale: κατά ya na accusative na-egosi ụkpụrụ ma ọ bụ oke. Akpaokwu Igbo a na-egosi na mgbaghara ahụ kwekọrọ n’ụba amara Chineke, ọ bụghị naanị na o si na ya pụta.
- source_word: χάριτος
  choice: amara
  rationale: “Amara” bụ okwu Igbo siri ike ma bụrụ nke a na-ejikarị akọwa χάρις dịka ihu ọma na onyinye ọma Chineke na-enye n’efu.
theological_decisions:
- issue: Mmekọrịta dị n’etiti “mgbapụta” na “mgbaghara mmehie”
  choice: E gosipụtara ha dịka apposition site n’itinye “ya bụ”
  alternative: 'Ịhapụ ha n’akụkụ ibe ha n’enweghị okwu njikọ: “mgbapụta ..., mgbaghara mmehie anyị”'
  rationale: Accusative nke abụọ na-akọwa nke mbụ. N’Igbo, “ya bụ” na-eme ka njikọ ahụ doo anya ma ghara ịgbakwunye ozizi karịrị ihe usoro Grik na-egosi.
- issue: Asụsụ mkpuchi mmehie dị na “site n’ọbara ya”
  choice: E debere okwu doro anya “site n’ọbara ya”
  alternative: “site n’ọnwụ ya” ma ọ bụ “site n’ọnwụ àjà ya”
  rationale: Ihe odide ahụ kpọrọ “ọbara” kpọmkwem. Dochie ya na “ọnwụ” ga-abụ nkọwa karịa ntụgharị, meekwa ka onyinyo àjà na ọgbụgba ndụ dị n’okwu ahụ daa mba.
translation_notes:
  register: Asụsụ Standard Igbo, dị ugwu ma bụrụ nke ndị nkịtị taa ga-aghọta. E ji “mgbapụta,” “ọbara,” na “amara” chekwaa okwu nkà mmụta okpukpe ndị dị mkpa, ebe usoro ahịrịokwu ahụ bụ nke Igbo dị ire.
