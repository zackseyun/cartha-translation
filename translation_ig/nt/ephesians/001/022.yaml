- from: O doro ihe niile n’okpuru ụkwụ ya[a], nyekwa ya dị ka isi na-achị ihe niile nye ọgbakọ ahụ[b].
  to: O mere ka ihe niile nọrọ n’okpuru ụkwụ ya[a], nyekwa ya ka ọ bụrụ isi n’elu ihe niile nye ọgbakọ ahụ[b].
  rationale: The revision retains the full scope of πάντα (“ihe niile”), the feet imagery, and the dative’s recipient/beneficiary ambiguity. It replaces an interpretive verbal expansion with “isi n’elu ihe niile,” a direct and natural rendering of κεφαλὴν ὑπὲρ πάντα.
