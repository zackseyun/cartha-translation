  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/022.yaml
  text: And he subjected all things under his feet[a], and gave him as head over all things to the church[b],
translation:
  language: ig
  text: O mere ka ihe niile nọrọ n’okpuru ụkwụ ya[a], nyekwa ya ka ọ bụrụ isi n’elu ihe niile nye ọgbakọ ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu a na-akpọghachi Abụ Ọma 8:6, bụ́ oyiyi Akwụkwọ Nsọ nke idebe ihe niile n’okpuru ụkwụ onye na-achị.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsị, “maka ọgbakọ ahụ”; ụdị okwu Greek τῇ ἐκκλησίᾳ nwere ike igosi onye natara ihe ma ọ bụ onye ga-erite uru na ya.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: ihe niile
  rationale: Ọ bụ ọtụtụ nke na-anọpụtaghị nwoke ma ọ bụ nwaanyị, ma na-egosi ngụkọta ihe niile; nhọrọ a na-edobe obosara ọchịchị Kraịst.
- source_word: ὑπέταξεν
  choice: doro ... n’okpuru
  rationale: Nkebiokwu a na-egosi na Chineke mere ka ihe niile nọrọ n’ọnọdụ dị n’okpuru ọchịchị onye ọzọ, ma ọ na-ada nke ọma n’Igbo.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: n’okpuru ụkwụ ya
  rationale: A hapụrụ oyiyi ahụ n’ụdị doro anya n’ihi na ọ na-egosi mmeri na ọchịchị, ma na-akpọghachi okwu Abụ Ọma 8:6.
- source_word: αὐτὸν ἔδωκεν
  choice: nyekwa ya
  rationale: Nke a na-edobe ihe δίδωμι pụtara n’ụzọ kpọmkwem—‘inye’—kama ịtụgharị ya naanị ka ‘ịhọpụta.’
- source_word: κεφαλὴν
  choice: dị ka isi
  rationale: ‘Isi’ na-edobe ihe atụ Greek ahụ, nke na-egosi ọnọdụ kacha elu na ikike, kama iji naanị ‘onyeisi’ dochie ihe atụ ahụ.
- source_word: ὑπὲρ πάντα
  choice: na-achị ihe niile
  rationale: N’ebe a ὑπέρ na-egosi ịdị n’elu ma ọ bụ inwe ikike n’ebe ihe niile nọ; ntụgharị a bụ Igbo eke ma na-eme ka mmekọrịta ahụ doo anya.
- source_word: τῇ ἐκκλησίᾳ
  choice: nye ọgbakọ ahụ
  rationale: ‘Ọgbakọ’ na-egosi ndị mmadụ kpọkọtara ọnụ, ọ bụghị ụlọ; ‘nye’ na-ewere dative ahụ dịka onye natara, ebe nkọwa ala peeji na-echekwa ohere na ọ pụtara uru ọgbakọ ahụ ga-erite.
theological_decisions:
- issue: Mmekọrịta ịdị Kraịst isi na ihe niile, na mmekọrịta ya na ọgbakọ
  choice: E nyere Kraịst nye ọgbakọ ahụ dị ka onye bụ isi na-achị ihe niile.
  alternative: E mere Kraịst isi na-achị ihe niile maka uru ọgbakọ ahụ.
  rationale: Usoro okwu Greek na-ejikọta κεφαλή na ὑπὲρ πάντα, ma dative τῇ ἐκκλησίᾳ nwere ike ịbụ onye natara ma ọ bụ onye e mere ihe ahụ maka uru ya. Isi ederede họọrọ onye natara, ebe nkọwa ala peeji na-echekwa nkọwa nke uru.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Ọgbakọ’ na-ezere nghọtahie nke ụlọ ofufe, ebe ‘isi’ na-echekwa ihe atụ dị na Greek. A haziri akara nkọwa ala peeji ka nke dị n’akụkụ ‘ụkwụ ya’ bụrụ ntụaka Abụ Ọma, nke dị n’akụkụ ‘ọgbakọ ahụ’ bụrụ nkọwa dative.
