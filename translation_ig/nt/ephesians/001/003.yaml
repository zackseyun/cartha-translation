id: EPH.1.3
reference: Ephesians 1:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: ig
  text: Ka a gọzie Chineke na Nna nke Onyenwe anyị Jizọs Mezaịa[c], onye ji ngọzi ime mmụọ[a] ọ bụla n’ógbè eluigwe[b] gọzie anyị n’ime Mezaịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ngọzi ọ bụla nke Mmụọ Nsọ.” Adjective Grik ahụ nwere ike ịpụta “nke ime mmụọ” n’ozuzu ya ma ọ bụ “nke metụtara Mmụọ Nsọ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “n’ebe dị n’eluigwe.”
    reason: lexical_alternative
  - marker: c
    text: Nsụgharị ọdịnala bụ “Jizọs Kraịst” na “n’ime Kraịst.” N’ebe a, a sụgharịrị aha ọkwá Grik Χριστός dịka “Mezaịa” iji mee ka ihe ọ pụtara pụta ìhè.
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Ka a gọzie
  rationale: Ọ bụ okwu e ji enye Chineke otuto na ngọzi. Usoro a bụ Igbo dị ndụ ma na-ejikọkwa ya nke ọma na ngwaa εὐλογήσας nke e sụgharịrị ‘gọzie’ n’azụ amaokwu ahụ.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Chineke na Nna
  rationale: Ọ na-edebe aha abụọ ahụ ndị na-ekwu maka otu onye, dịka njikọ okwu Grik si dị, n’emebighị nke ọ bụla.
- source_word: κυρίου ἡμῶν
  choice: nke Onyenwe anyị
  rationale: ‘Onyenwe’ bụ aha nsọpụrụ dabara adaba maka κύριος n’ebe a, ‘anyị’ na-edebekwa nnọchiaha Grik.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bú Mezaịa
  rationale: ‘Jizọs’ na-asụgharị aha ahụ n’ụzọ Igbo a maara, ebe ‘Mezaịa’ na-edebe Χριστός dịka aha ọkwá nke pụtara onye e tere mmanụ. ‘bú’ na-eme ka aha ọkwá ahụ daa nke ọma n’Igbo.
- source_word: ὁ εὐλογήσας ἡμᾶς
  choice: onye ... gọzie anyị
  rationale: Ọ na-edebe participle ahụ dịka nkebiokwu na-akọwa Chineke. Oge gara aga ‘gọzie’ na-egosi ihe Chineke mere, nke uru ya ka dị ugbu a.
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: ji ngọzi ime mmụọ niile
  rationale: ‘Ji’ na-enye ἐν usoro Igbo kwesịrị ekwesị n’ebe a; ‘niile’ na-egosi πάσῃ, ebe ‘ime mmụọ’ na-ahapụ obosara πνευματικῇ n’enweghị ịkpa ya naanị n’otu nkọwa.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: dị n’ebe ndị dị n’eluigwe
  rationale: Nke a na-egosi mpaghara ma ọ bụ ebe eluigwe nke nkebiokwu Grik ahụ na-ekwu maka ya, ma na-edebekwa ụdị ọtụtụ nke okwu ahụ n’ụzọ Igbo ga-aghọta.
- source_word: ἐν Χριστῷ
  choice: n’ime Mezaịa
  rationale: Ọ na-edebe okwu Pọl dị mkpirikpi banyere ịdị ‘n’ime’ Mezaịa ma ghara ịkọwa njikọ ahụ karịa ihe ederede kwuru.
theological_decisions:
- issue: Otu e si asụgharị Χριστός
  choice: Mezaịa na ‘Jizọs bú Mezaịa’ nakwa ‘n’ime Mezaịa’
  alternative: Kraịst; Jizọs Kraịst; n’ime Kraịst
  rationale: Χριστός ka nwere ike aha ọkwá ya n’amaokwu a. ‘Mezaịa’ na-eme ka ihe aha ọkwá ahụ pụtara pụta ìhè, ebe ihe a na-asụkarị gosiri na nkọwa ọdịnala bụ ‘Kraịst.’
- issue: Ihe πνευματικῇ pụtara
  choice: ime mmụọ
  alternative: nke Mmụọ Nsọ
  rationale: Adjective Grik ahụ nwere ike ịkọwa ngọzi dịka nke ime mmụọ n’ozuzu ya ma ọ bụ dịka ngọzi sitere n’aka Mmụọ Nsọ. Isi ederede na-edebe obosara ahụ, ebe ihe a na-asụkarị na-egosi nkọwa nke ọzọ.
- issue: Njikọ ἐν Χριστῷ
  choice: n’ime Mezaịa
  alternative: site n’aka Mezaịa
  rationale: ‘N’ime’ na-edebe ọdịdị na ihe omimi nke njikọ Pọl kwuru n’enweghị ịgbanwe ya ka ọ bụrụ naanị ụzọ e si nweta ngọzi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta, dee ya. A họọrọ ‘Ka a gọzie’ maka ụda ekpere otuto, ‘Onyenwe anyị’ maka κύριος, na ‘Mezaịa’ iji mee ka aha ọkwá Χριστός pụta ìhè. Akara ihe ndị a na-asụkarị [a], [b], na [c] nọ kpọmkwem n’ebe okwu ha na-akọwa dị.
