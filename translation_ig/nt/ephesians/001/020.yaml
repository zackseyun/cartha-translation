  to: 'nke o rụrụ n’ime Mesaịa[a] mgbe o kpọlitere ya site n’etiti ndị nwụrụ anwụ, mee ka ọ nọdụ n’aka nri ya n’ebe ndị dị n’eluigwe[b],


    [a] Ma ọ bụ, “n’ime Kraịst.”


    [b] Ma ọ bụ, “n’ógbè eluigwe.”'
  rationale: The revision removes the semantic overstatement introduced by the causative expression for ἐνήργηκεν, uses a natural direct expression for resurrection, and adopts a more source-transparent plural locative rendering for ἐν τοῖς ἐπουρανίοις. It preserves the verse as a dependent relative clause, as required by the Greek and its antecedent in the preceding verse, and retains both justified alternatives in correctly anchored footnotes.
  reviewer_model: gpt-5.6-terra
