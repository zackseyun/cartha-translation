  text: ἣν ⸀ἐνήργηκεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ⸀ἐκ νεκρῶν, καὶ ⸀καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/020.yaml
  text: which he worked in the Messiah when he raised him from the dead and seated him at his right hand in the heavenly places[b][a],
translation:
  language: ig
  text: 'nke o rụrụ n’ime Mesaịa[a] mgbe o kpọlitere ya site n’etiti ndị nwụrụ anwụ, mee ka ọ nọdụ n’aka nri ya n’ebe ndị dị n’eluigwe[b],


    [a] Ma ọ bụ, “n’ime Kraịst.”


    [b] Ma ọ bụ, “n’ógbè eluigwe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime Kraịst.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “n’ógbè eluigwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: nke
  rationale: Ọ na-ejikọ ahịrịokwu a na ike ahụ a kpọtụrụ aha n’amaokwu bu ya ụzọ, n’enweghị itinye aha ahụ ọzọ n’ime amaokwu a.
- source_word: ἐνήργηκεν
  choice: o mere ka ọ rụọ ọrụ
  rationale: Nke a na-egosi na ike Chineke rụrụ ọrụ n’ezie ma nwee mmetụta; ọ bụkwa ụzọ Igbo doro anya isi kwuo ọrụ dị irè nke ngwaa ahụ na-egosi.
- source_word: ἐν τῷ Χριστῷ
  choice: n’ime Mesaịa
  rationale: Χριστός na-arụ ọrụ dị ka utu aha ebe a. “Mesaịa” na-echekwa echiche nke Onye E Tere Mmanụ, ebe “n’ime” na-echekwa njikọ nke ἐν.
- source_word: ἐγείρας αὐτὸν ἐκ νεκρῶν
  choice: mgbe o mere ka o si n’etiti ndị nwụrụ anwụ bilie
  rationale: “Mgbe” na-enye njikọ oge doro anya n’Igbo, “mere ka ... bilie” na-egosi na Chineke bụ onye mere ya, “n’etiti ndị nwụrụ anwụ” na-echekwakwa ụdị ọtụtụ nke νεκρῶν.
- source_word: καθίσας
  choice: meekwa ka ọ nọdụ
  rationale: Ọ na-ejikọta ihe nke abụọ Chineke mere na nke mbụ, ma na-egosi na Chineke mere ka Mesaịa nọdụ.
- source_word: ἐν δεξιᾷ αὐτοῦ
  choice: n’aka nri ya
  rationale: Nke a bụ okwu Igbo e ji egosi ịnọ n’akụkụ aka nri, ọnọdụ nke nsọpụrụ na ikike, ọ bụghị ịnọ n’ime ọbụ aka.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: n’ógbè eluigwe
  rationale: Ọ na-egosi mpaghara ma ọ bụ ọnọdụ eluigwe n’ụzọ dị mfe ma dị ndụ n’Igbo, ebe ndetu na-echekwa ntụgharị nke na-elekwasị anya n’ebe dị iche iche.
theological_decisions:
- issue: Otú e si asụgharị Χριστῷ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a okwu ahụ nwere ike ịbụ utu aha. “Mesaịa” na-eme ka echiche ahụ pụta ìhè, ma ndetu na-echekwa ụdị ọdịnala “Kraịst” n’ihi na a pụkwara ịghọta ya dị ka aha a na-akpọ Jizọs.
- issue: Ihe ἐν τοῖς ἐπουρανίοις na-ezo aka na ya
  choice: n’ógbè eluigwe
  alternative: n’ebe ndị dị n’eluigwe
  rationale: Ụdị Grik ahụ bụ adjective e ji mee noun na plural, ya mere ọ nwere ike igosi mpaghara eluigwe n’ozuzu ma ọ bụ ebe ndị dị n’eluigwe. E debere nhọrọ abụọ ahụ n’enweghị imechi ihe okwu ahụ pụrụ ịpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ amaokwu ahụ dịka nkebi na-amalite na “nke,” n’ihi na ἣν na-ezo azụ n’ike e kwuru n’amaokwu bu ya ụzọ. E ji “meekwa” jikọta omume abụọ ahụ nke ọma n’Igbo.
