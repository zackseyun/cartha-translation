revisions:
- from: nakwa otú ịdị ukwuu nke ike ya nke karịrị akarị si dị n'ebe anyị ndị kweere ekwe nọ[a], dị ka ịrụ ọrụ nke ịdị ike nke ume ya si dị.
  to: nakwa oke ịdị ukwuu nke ike ya n'ebe anyị ndị kwere ekwe nọ, dị ka ọrụ nke ike na ume ya si dị.[a]
  rationale: The revision corrects the non-idiomatic expression for believers and smooths the final cluster of near-synonyms. It keeps the power directed toward believers ('n'ebe anyị ... nọ') rather than deciding for the reader that it is exclusively within them. The footnote continues to identify 'n'ime anyị' as an alternative interpretive rendering, without presenting it as the direct wording of the Greek.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:31:16Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the continuation ('and what'), the directional nuance of εἰς ἡμᾶς, and the sequence of power terms. However, 'kweere ekwe' is not the normal Standard Igbo designation for believers, and 'ịdị ike nke ume ya' is overly stiff and obscures the final genitive chain.
  naturalness: Several phrases are intelligible but not idiomatic modern Standard Igbo. 'ndị kweere ekwe' is awkward/reduplicated; 'ndị kwere ekwe' is the established natural expression. 'nke karịrị akarị' is needlessly repetitive in this context. The revised wording remains formal enough for Scripture while reading more naturally.
  terminology: Retain 'ike' for δύναμις and 'ọrụ' for ἐνέργεια. Render the final κράτος/ἰσχύς cluster with related but distinguishable wording, 'ike na ume,' rather than the unnatural abstract construction 'ịdị ike nke ume.' This preserves the rhetorical accumulation without claiming a technical distinction not demanded by the Greek.
  issues:
  - severity: medium
    issue: '''anyị ndị kweere ekwe'''
    rationale: This is not idiomatic Standard Igbo. 'anyị ndị kwere ekwe' naturally renders 'us who believe' / 'us believers' and avoids an unnatural reduplication.
  - severity: medium
    issue: '''ịrụ ọrụ nke ịdị ike nke ume ya'''
    rationale: Although attempting to represent all three final power-related terms, this nominal stack is awkward and difficult to parse in Igbo. 'ọrụ nke ike na ume ya' is clearer while retaining the accumulated emphasis.
  - severity: low
    issue: '''nke karịrị akarị'''
    rationale: The phrase is understandable but sounds tautological. 'oke ịdị ukwuu' is a natural idiom for the surpassing greatness intended by ὑπερβάλλον μέγεθος; it does not require the stronger claim of immeasurability.
  revised_text: nakwa oke ịdị ukwuu nke ike ya n'ebe anyị ndị kwere ekwe nọ, dị ka ọrụ nke ike na ume ya si dị.[a]
  revised_footnotes:
