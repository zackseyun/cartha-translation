language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τί τὸ ὑπερβάλλον μέγεθος τῆς δυνάμεως αὐτοῦ εἰς ἡμᾶς τοὺς πιστεύοντας κατὰ τὴν ἐνέργειαν τοῦ κράτους τῆς ἰσχύος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/019.yaml
  text: and what is the surpassing greatness of his power toward us who believe[a], according to the working of the might of his strength
translation:
  language: ig
  text: nakwa oke ịdị ukwuu nke ike ya n'ebe anyị ndị kwere ekwe nọ, dị ka ọrụ nke ike na ume ya si dị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ime anyị ndị kwere ekwe.” Grik nwere “n'ebe anyị nọ”; ụfọdụ nsụgharị na-akọwa akpaokwu a karịa ka ike Chineke na-arụ ọrụ n'ime ndị kwere ekwe.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερβάλλον
  choice: nke karịrị akarị
  rationale: Nke a na-egosi ihe na-agabiga oke ma ọ bụ na-akarị ihe ndị ọzọ, n’etinyeghị echiche siri ike karịa nke Grik dịka ‘enweghị atụ.’
- source_word: μέγεθος
  choice: ịdị ukwuu
  rationale: Ọ bụ okwu Igbo doro anya ma bụrụkwa nke mmadụ na-eji ekwu ogo ma ọ bụ ịdị ukwuu nke ihe.
- source_word: δύναμις
  choice: ike
  rationale: ‘Ike’ bụ okwu Igbo kacha kwekọọ na δύναμις, ma na-enyekwa ohere idowe okwu ndị ọzọ Pọl chịkọtara iche.
- source_word: εἰς ἡμᾶς
  choice: n'ebe anyị ... nọ
  rationale: Nke a na-echekwa ntụziaka nke εἰς n’ebughị ụzọ kpebie na ihe a na-ekwu bụ naanị ihe na-arụ ọrụ n’ime ndị kwere ekwe.
- source_word: τοὺς πιστεύοντας
  choice: anyị ndị kweere ekwe
  rationale: Nke a bụ ụzọ Igbo dị mfe ma dị ndụ isi kọwaa ndị na-ekwere, kama ime ya naanị aha otu ndị mmadụ.
- source_word: κατά
  choice: dị ka ... si dị
  rationale: Akpaokwu a na-egosi nkwekọrịta ma ọ bụ ụkpụrụ ihe ji dị, dịka κατά si arụ ọrụ n’ebe a.
- source_word: ἐνέργεια
  choice: ịrụ ọrụ
  rationale: Ọ na-egosi ọrụ na-arụpụta ihe n’ezie, ma zere nghọta ọgbara ọhụrụ nke okwu dịka ‘energy.’
- source_word: κράτος
  choice: ịdị ike
  rationale: A họọrọ ya iji gosipụta ike pụtara ìhè ma debe ya iche ntakịrị na δύναμις na ἰσχύς.
- source_word: ἰσχύς
  choice: ume
  rationale: ‘Ume’ na-egosi ike dị n’ime mmadụ ma ọ bụ ihe, wee nyere aka ichekwa nchịkọta okwu ike dị iche iche Pọl ji mee nkwusi ike.
- source_word: καὶ τί
  choice: nakwa otú ... si dị
  rationale: Nke a na-ejikọta amaokwu ahụ na ekpere gara n’ihu ma na-eme ka ahịrịokwu ahụ bụrụ Igbo a na-agụ nke ọma.
theological_decisions:
- issue: Nchịkọta okwu δύναμις / ἐνέργεια / κράτος / ἰσχύς
  choice: E debere ha dị ka ‘ike ... ịrụ ọrụ ... ịdị ike ... ume.’
  alternative: Ịchịkọta ha niile n’otu okwu dịka ‘oke ike ya.’
  rationale: Pọl kpachapụrụ anya chịkọta okwu ndị yiri ibe ha iji mesie ịdị ukwuu na ọrụ ike Chineke ike; idowe ha iche na-echekwa nkwusi ike ahụ n’emeghị ka nke ọ bụla bụrụ okwu nkà mmụta okpukpe pụrụ iche.
- issue: Ebe ike Chineke na-eche ihu na εἰς ἡμᾶς
  choice: ‘n'ebe anyị ndị kweere ekwe nọ’
  alternative: ‘n'ime anyị ndị kweere ekwe’ ma ọ bụ ‘maka anyị ndị kweere ekwe’
  rationale: εἰς na-egosi ntụziaka ma ọ bụ ebe ike ahụ na-eche ihu. Nsụgharị a na-echekwa nghọtahie nwere ike ịdị na ya, kama ikpebi na ọ bụ naanị ọrụ dị n’ime mmadụ ma ọ bụ naanị uru e meere ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ usoro okwu ike Pọl chịkọtara ka ọ pụta ìhè, n’agbanyeghị na nkebi ikpeazụ nwere ụda siri ike ntakịrị, iji ghara ihichapụ ọdịiche dị n’okwu Grik.
