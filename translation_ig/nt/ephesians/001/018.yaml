    text: Ma ọ bụ, “akụ nke ebube.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ihe nketa ya n’ime ndị nsọ,” ma ọ bụ “ihe nketa ya n’etiti ndị ya dị nsọ.”
    reason: alternative_reading
  revision_rationale: The revision removes an unwarranted explicit object from “his calling,” better represents the perfect passive participle, and restores footnotes whose anchors correspond to the relevant expressions. It retains the source’s metaphors and leaves the relationship of “his inheritance” to the saints open, as does the Greek.
