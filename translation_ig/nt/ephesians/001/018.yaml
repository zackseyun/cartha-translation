id: EPH.1.18
reference: Ephesians 1:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν εἰς τὸ εἰδέναι ὑμᾶς τίς ἐστιν ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ, ⸀τίς ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/018.yaml
  text: having the eyes of your heart enlightened[a], so that you may know what is the hope of his calling, what is the wealth of the glory of his inheritance among the saints[b],
translation:
  language: ig
  text: ebe e meworo ka anya nke obi unu nwee ìhè, ka unu wee mara ihe bụ olileanya nke ọkpụkpọ ya, na ihe bụ ụba[a] nke ebube nke ihe nketa ya n’etiti ndị nsọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “akụ nke ebube.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ihe nketa ya n’ime ndị nsọ,” ma ọ bụ “ihe nketa ya n’etiti ndị ya dị nsọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: πεφωτισμένους
  choice: ebe e mere ka ... nwee ìhè
  rationale: 'Na-egosipụta perfect passive participle: e nyeworị anya obi ha ìhè, ọnọdụ ahụ ka na-adịkwa; ahịrịokwu Igbo a na-edobe olu nnara ahụ n''ụzọ na-ada nke ọma.'
- source_word: τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν
  choice: anya nke obi unu
  rationale: Na-edobe ihe atụ Pọl ji mee okwu kama ịgbanwe ya ka ọ bụrụ naanị ‘uche’ ma ọ bụ ‘nghọta.’
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: ka unu wee mara
  rationale: Na-egosipụta nzube nke infinitive ahụ n’Igbo doro anya ma bụrụ nke e ji eme ihe ugbu a.
- source_word: ἐλπὶς
  choice: olileanya
  rationale: Okwu Igbo a na-adịkarị maka atụmanya nwere ntụkwasị obi, ma na-edobe okwu nkà mmụta okpukpe Pọl.
- source_word: κλήσεως αὐτοῦ
  choice: ọkpụkpọ ọ kpọrọ unu
  rationale: ‘Ọkpụkpọ’ na-edobe echiche κλῆσις; mgbakwunye ‘ọ kpọrọ unu’ na-eme ka genitive nke onye na-akpọ pụta ìhè n’Igbo n’emeghị ka ihe ọ pụtara bụrụ ozizi pụrụ iche.
- source_word: πλοῦτος
  choice: ụba
  rationale: Na-egosipụta ịba ụba ma ọ bụ akụ bara ụba n’ụzọ Igbo dị ndụ ma kwekọọ na genitive ‘nke ebube.’
- source_word: δόξης
  choice: ebube
  rationale: Ọ bụ okwu Igbo Akwụkwọ Nsọ a na-amakarị nke na-edobe ịdị arọ nke δόξα.
- source_word: κληρονομίας αὐτοῦ
  choice: ihe nketa ya
  rationale: 'Na-edobe genitive ahụ ka ọ ghere oghe: ọ pụrụ ịbụ ihe nketa nke ya ma ọ bụ nke o nyere, n’enweghị ịmanye otu nkọwa.'
- source_word: ἐν τοῖς ἁγίοις
  choice: n’etiti ndị nsọ
  rationale: Na-enye ἐν n’ụzọ Igbo eke dịka ‘n’etiti,’ ma na-edobe ‘ndị nsọ’ kama ịkọwa ya n’ụzọ ga-emechi nghọta ndị ọzọ.
theological_decisions:
- issue: Ma ‘ihe nketa ya n’ime/n’etiti ndị nsọ’ ọ bụ ndị ya bụ ihe nketa Chineke, ka ọ bụ ihe nketa Chineke na-enye ndị kwere ekwe
  choice: ihe nketa ya n’etiti ndị nsọ
  alternative: ihe nketa ya n’ime ndị nsọ; ma ọ bụ ihe nketa o nyere n’etiti ndị nsọ
  rationale: Genitive αὐτοῦ na prepositional phrase ἐν τοῖς ἁγίοις nwere ike ibu nghọta karịrị otu. Nsụgharị bụ isi na-edobe mgbagwoju a n’emechighị ya n’ụzọ otu ụka ma ọ bụ otu ozizi.
translation_notes:
  register: Standard Igbo dị ùgwù ma dị mfe nghọta. E debere ihe atụ ‘anya nke obi’ na okwu ndị bụ isi dịka ‘olileanya,’ ‘ebube,’ ‘ihe nketa,’ na ‘ndị nsọ.’ A gbanwere participial construction ka ọ bụrụ nkebiokwu Igbo na-aga n’ihu n’usoro ekpere nke amaokwu ndị gbara ya gburugburu.
