id: EPH.1.13
reference: Ephesians 1:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/013.yaml
  text: In him[a], you also, after hearing the word of truth, the good news of your salvation, in him, and after believing, were sealed with the Holy Spirit of promise[d][c][b],
translation:
  language: ig
  text: N’ime ya[a], unu kwa, mgbe unu nụrụ okwu nke eziokwu, ya bụ ozi ọma banyere nzọpụta unu[b], n’ime ya, mgbe unu kwerekwa, e jiri Mmụọ Nsọ ahụ e kwere ná nkwa[c] kaa unu akara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime onye ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ozi ọma nke nzọpụta unu.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “Mmụọ Nsọ nke nkwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: N’ime ya
  rationale: Nnọchiaha ahụ na-ezo aka na Kraịst n’amaokwu ndị bu ụzọ; okwu a bụ nke Igbo na-ada nke ọma ma na-echekwa echiche Pọl banyere ịdị n’ime Kraịst.
- source_word: καὶ ὑμεῖς
  choice: unu kwa
  rationale: Ọ na-echekwa nkwusi ike nke καί, nke na-egosi na ndị a na-agwa okwu sokwa ná ngọzi ndị a kpọrọ aha.
- source_word: ἀκούσαντες
  choice: mgbe unu nụrụ
  rationale: Ụdị a na-egosi na ịnụ ozi ahụ metụtara ihe mere tupu ma ọ bụ n’oge a kaa ha akara, n’enweghị ịmanye usoro nkà mmụta okpukpe karịrị ihe Grik kwuru.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: okwu nke eziokwu
  rationale: Ọ na-edobe okwu Pọl n’ụzọ dị nso n’isi mmalite ma bụrụkwa Igbo a na-aghọta nke ọma.
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: ozi ọma banyere nzọpụta unu
  rationale: ‘Ozi ọma’ na-enye εὐαγγέλιον n’Igbo doro anya; ‘banyere’ na-eme ka o doo anya na nzọpụta ha bụ ọdịnaya ozi ahụ, ebe nkọwa ọzọ dị n’okpuru na-echekwa nghọta nke nsonaazụ.
- source_word: πιστεύσαντες
  choice: mgbe unu kwere
  rationale: Ọ na-enye participle ahụ n’Igbo nkịtị ma na-ahapụ ἐν ᾧ dị ka ahịrịokwu nke ya, kama ijikọ ya n’amaghị ama na ngwaa ‘kwere.’
- source_word: ἐσφραγίσθητε
  choice: e ... kaa unu akara
  rationale: Ọ na-echekwa olu nnara na ihe atụ nke ịka akara, nke nwere ike igosi nwe, nkwado, ma ọ bụ nchekwa, n’akọwaghị otu n’ime ha naanị.
- source_word: τῷ πνεύματι
  choice: e jiri Mmụọ Nsọ ... kaa unu akara
  rationale: ‘E jiri’ na-egosipụta dative ahụ dị ka ihe e ji kaa akara, ma ọ naghị ewepụ kpamkpam echiche na Mmụọ ahụ bụ akara e nyere ha.
- source_word: τῆς ἐπαγγελίας τῷ ἁγίῳ
  choice: Mmụọ Nsọ nke nkwa
  rationale: Ọ na-echekwa genitive Grik ahụ n’ụdị dị mkpirikpi, na-ahapụ ma echiche nke Mmụọ ahụ e kwere ná nkwa ma njikọ ya na nkwa Chineke.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ịnụ, ikwere, na ịka akara
  choice: A sụgharịrị participle abụọ ahụ dị ka ‘mgbe unu nụrụ’ na ‘mgbe unu kwere,’ na-etinye ha tupu ngwaa bụ isi ma ghara ịkọwa kpọmkwem ogologo oge dị n’etiti ihe ndị ahụ.
  alternative: ‘Mgbe unu nụsịrị ... mgbe unu kwesịrị’ ma ọ bụ ‘mgbe unu nụrụ ... mgbe unu kwere’ dị ka ihe mere n’otu oge.
  rationale: Aorist participles nọ tupu ngwaa bụ isi na-egosikarị ihe bu ya ụzọ ma ọ bụ so ya mee; nsụgharị a na-echekwa njikọ ahụ n’enweghị ịkwado usoro okpukpe pụrụ iche banyere oge nnata Mmụọ Nsọ.
- issue: Ihe ‘Mmụọ nke nkwa’ pụtara
  choice: Mmụọ Nsọ nke nkwa
  alternative: Mmụọ Nsọ ahụ e kwere ná nkwa
  rationale: Genitive Grik ahụ dị nkenke ma nwee ike ịkọwa Mmụọ ahụ dị ka onye e kwere ná nkwa ma ọ bụ onye jikọrọ ya na nkwa Chineke; isiokwu bụ isi na-edobe mkpụrụokwu ahụ, ebe nkọwa ala peeji na-enye ụdị doro anya karị.
- issue: Njikọ nke ἐν ᾧ nke ugboro abụọ
  choice: E debere ya dị ka ‘n’ime ya kwa, mgbe unu kwere.’
  alternative: Enwere ike ịghọta ya dị ka ‘mgbe unu kwere na ya.’
  rationale: Idowe ahịrịokwu locative ahụ iche na-echekwa okwu Grik na echiche ịdị n’ime Kraịst, ma nkọwa ala peeji na-egosi njikọ ọzọ nwere ike ịdị.
translation_notes:
  register: E ji Standard Igbo nke ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ ikwughachi ‘n’ime ya’ dịka ọ dị na Grik n’ihi mkpa echiche ya, ọbụna ma ahịrịokwu ahụ dị ntakịrị ogologo. E ji ‘kaa unu akara’ chekwaa ihe atụ nke σφραγίζω; e zere ịkọwa ya naanị dịka baptizim, nchekwa, ma ọ bụ nkwado.
