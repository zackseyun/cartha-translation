revisions:
- from: N’ime ya[a], unu kwa, mgbe unu nụrụ okwu nke eziokwu, ya bụ ozi ọma banyere nzọpụta unu[b], n’ime ya kwa, mgbe unu kwere[d], e jiri Mmụọ Nsọ nke nkwa[c] kaa unu akara.
  to: N’ime ya[a], unu kwa, mgbe unu nụrụ okwu nke eziokwu, ya bụ ozi ọma banyere nzọpụta unu[b], n’ime ya, mgbe unu kwerekwa, e jiri Mmụọ Nsọ ahụ e kwere ná nkwa[c] kaa unu akara.
  rationale: The repeated “n’ime ya” is retained because both occurrences are present in the Greek and carry the surrounding union-with-Christ frame. Moving kwa to “mgbe unu kwerekwa” reflects its association with πιστεύσαντες and improves Igbo flow. The main rendering of the Spirit title is made idiomatic while its more compressed, formally literal alternative is preserved in the footnote. Footnote d remains a valid alternative construal of the second ἐν ᾧ, though it has no anchor in the revised main text because the main rendering retains the locative phrase separately.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:30:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the two occurrences of ἐν ᾧ, the additive force of both instances of καί, the hearing/believing participial clauses, and the passive sealing imagery. However, the second clause, “n’ime ya kwa, mgbe unu kwere,” places kwa less naturally and does not clearly attach it to πιστεύσαντες. The genitival title “Mmụọ Nsọ nke nkwa” is very close formally but is not idiomatic contemporary Standard Igbo as the main rendering.
  naturalness: The revised wording preserves the deliberate repetition of “n’ime ya” while making the second participial clause read naturally. “Mmụọ Nsọ ahụ e kwere ná nkwa” is the normal clear Standard Igbo expression; the compact literal genitival expression is retained in a footnote.
  terminology: “Okwu nke eziokwu,” “ozi ọma,” “nzọpụta,” “Mmụọ Nsọ,” and “kaa ... akara” are appropriate, dignified, and comprehensible theological terminology. The revision avoids assigning the sealing to a particular denominational framework.
  issues:
  - severity: medium
    issue: Placement of kwa in the second πιστεύσαντες clause
    rationale: In ἐν ᾧ καὶ πιστεύσαντες, καί is most naturally carried with the believing participle. “N’ime ya kwa, mgbe unu kwere” can make kwa appear to modify only the preceding locative phrase and is somewhat awkward in Igbo.
  - severity: medium
    issue: “Mmụọ Nsọ nke nkwa” is overly calqued as the main text
    rationale: Although formally close to τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ, this is less natural Standard Igbo. “Mmụọ Nsọ ahụ e kwere ná nkwa” communicates the likely attributive force clearly, while the literal genitival wording can remain footnoted.
  revised_text: N’ime ya[a], unu kwa, mgbe unu nụrụ okwu nke eziokwu, ya bụ ozi ọma banyere nzọpụta unu[b], n’ime ya, mgbe unu kwerekwa, e jiri Mmụọ Nsọ ahụ e kwere ná nkwa[c] kaa unu akara.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime onye ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ozi ọma nke nzọpụta unu.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “Mmụọ Nsọ nke nkwa.”
    reason: alternative_reading
  - marker: d
    text: Ma ọ bụ, “mgbe unu kwere na ya.”
    reason: syntactic_ambiguity
  revision_rationale: The repeated “n’ime ya” is retained because both occurrences are present in the Greek and carry the surrounding union-with-Christ frame. Moving kwa to “mgbe unu kwerekwa” reflects its association with πιστεύσαντες and improves Igbo flow. The main rendering of the Spirit title is made idiomatic while its more compressed, formally literal alternative is preserved in the footnote. Footnote d remains a valid alternative construal of the second ἐν ᾧ, though it has no anchor in the revised main text because the main rendering retains the locative phrase separately.
