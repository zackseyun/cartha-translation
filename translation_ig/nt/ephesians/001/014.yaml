id: EPH.1.14
reference: Ephesians 1:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ὅ ἐστιν ἀρραβὼν τῆς κληρονομίας ἡμῶν, εἰς ἀπολύτρωσιν τῆς περιποιήσεως, εἰς ἔπαινον τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/014.yaml
  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: ig
  text: onye bụ ego nkwụnye mbụ nke ihe nketa anyị, maka mgbapụta nke ihe onwunwe ahụ, ka e too ebube ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅ
  choice: onye
  rationale: Nnọchiaha a na-ezo aka na Mmụọ Nsọ n'amaokwu bu ụzọ; 'onye' na-egosi na ọ bụ onye, ma kwekọọ na njikọ ahịrịokwu ahụ.
- source_word: ἀρραβών
  choice: ihe nkwụnye ego mbụ
  rationale: Okwu a bụ ego e nyere dịka nkwa na a ga-emecha kwụọ ihe fọdụrụ; nsụgharị a na-edobe echiche nke nkwa mbụ na mmesi obi ike.
- source_word: κληρονομία
  choice: ihe nketa
  rationale: Nke a bụ okwu Igbo doro anya maka ihe onye ga-enweta dịka nketa.
- source_word: ἀπολύτρωσις
  choice: ịgbapụta
  rationale: Ọ na-egosi ịtọhapụ ma ọ bụ inweta site n'ịkwụ ụgwọ mgbapụta; 'ịgbapụta' na-edobe ihe oyiyi ahụ.
- source_word: περιποίησις
  choice: ihe ahụ Chineke nwetara
  rationale: Genitive construction ahụ nwere ike izo aka n'ihe e nwetara ma ọ bụ ihe onwunwe pụrụ iche. Ịkpọ Chineke aha n'ụzọ nkọwa na-eme ka okwu Igbo doo anya n'enweghị ịkọwapụta kpọmkwem ma ọ bụ ndị mmadụ ma ọ bụ ihe nketa ahụ.
- source_word: εἰς ἔπαινον τῆς δόξης αὐτοῦ
  choice: ka e wee too ebube ya
  rationale: Na-egosi ebumnuche ma na-ada nke ọma n'Igbo ugbu a.
theological_decisions:
- issue: Ihe εἰς ἀπολύτρωσιν na-egosi
  choice: ruo mgbe a ga-agbapụta
  alternative: maka ịgbapụta
  rationale: εἰς nwere ike igosi ebumnuche ma ọ bụ njedebe a na-ele anya ya. N'ọnọdụ a, 'ruo mgbe' na-egosi na Mmụọ bụ nkwụnye ego mbụ na-ele anya mmezu nke mgbapụta, ma ọ naghị akọwapụta usoro nkà mmụta okpukpe karịa ihe ederede kwuru.
- issue: Onye ma ọ bụ ihe τῆς περιποιήσεως na-ezo aka na ya
  choice: ihe ahụ Chineke nwetara
  alternative: ihe onwunwe Chineke
  rationale: Ederede nwere mkpirikpi okwu nwere nghọta sara mbara. Nhọrọ a na-edobe echiche nke ihe e nwetara, ma ghara ikpebi n'ụzọ siri ike ma ọ bụ ndị kwere ekwe, ihe nketa, ma ọ bụ ihe niile Chineke nwere.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. Ahịrịokwu a na-aga n'ihu n'amaokwu 13, ya mere e ji obere mkpụrụedemede malite ya. E tinyaghị ihe odide ala peeji n'ihi na a họọrọ nsụgharị isi nke na-edobe isi mgbagwoju anya n'ụzọ zuru oke.
