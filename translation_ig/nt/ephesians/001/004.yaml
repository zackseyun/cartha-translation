id: EPH.1.4
reference: Ephesians 1:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καθὼς ἐξελέξατο ἡμᾶς ἐν αὐτῷ πρὸ καταβολῆς κόσμου, εἶναι ἡμᾶς ἁγίους καὶ ἀμώμους κατενώπιον αὐτοῦ ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/004.yaml
  text: just as he chose us in him before the foundation of the world[a], to be holy and blameless before him in love[c][b],
translation:
  language: ig
  text: dị ka ọ họọrọ anyị n’ime ya tupu a tọọ ntọala ụwa, ka anyị bụrụ[c] ndị dị nsọ na ndị na-enweghị ntụpọ[b] n’ihu ya n’ịhụnanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, e nwere ike ijikọ okwu ahụ bụ “n’ịhụnanya” na amaokwu na-esote: “N’ịhụnanya, o buru ụzọ kpebie ka anyị bụrụ…”'
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ndị a na-apụghị ịta ụta.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ka anyị wee bụrụ.”
    reason: previous_rendering
lexical_decisions:
- source_word: καθὼς
  choice: dị ka
  rationale: Na-ejikọta okwu a na ngọzi a kpọtụrụ aha n’amaokwu bu ya ụzọ, ma na-edobe ike ntụnyere nke okwu Grik ahụ.
- source_word: ἐξελέξατο
  choice: ọ họọrọ
  rationale: Ọ bụ okwu Igbo doro anya maka omume ịhọrọ; ọ naghị ebubata nkọwa pụrụ iche nke otu ozizi banyere nhọpụta.
- source_word: ἡμᾶς
  choice: anyị
  rationale: Na-anọchi anya onye a họọrọ ma bụrụkwa onye isiokwu nke nkebi infinitive na-esonụ.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Na-edobe okwu Pọl dị mkpirikpi banyere ịdị n’ime ya, n’ebughị ụzọ gbasaa ya dịka ‘n’ịdị n’otu na ya.’
- source_word: πρὸ καταβολῆς κόσμου
  choice: tupu a tọọ ntọala ụwa
  rationale: Na-egosipụta oge ahụ nke ọma ma na-edobe ihe oyiyi nke ịtọ ntọala ụwa dị na Grik.
- source_word: εἶναι ἡμᾶς
  choice: ka anyị bụrụ
  rationale: Ụdị a bụ Igbo nkịtị nke na-egosipụta ebumnuche ma ọ bụ nsonaazụ nke nhọpụta ahụ.
- source_word: ἁγίους
  choice: ndị dị nsọ
  rationale: ‘Dị nsọ’ na-edobe ma echiche ịdị iche nye Chineke ma akụkụ omume ọma nke okwu ahụ.
- source_word: ἀμώμους
  choice: ndị na-enweghị ntụpọ
  rationale: Na-edobe ihe oyiyi nke enweghị mmerụ ma ọ bụ ntụpọ, tinyere echiche nke ịbụ onye a na-apụghị ịta ụta.
- source_word: κατενώπιον αὐτοῦ
  choice: n’ihu ya
  rationale: Ọ bụ ntụgharị Igbo dị mkpirikpi ma kwekọọ n’okwu Grik nke na-egosi ịnọ n’ihu Chineke.
- source_word: ἐν ἀγάπῃ
  choice: n’ịhụnanya
  rationale: Na-edobe okwu ahụ n’ọnọdụ ya na njedebe amaokwu, ebe njikọ ụtọasụsụ ya ka nwere ike ịbụ na okwu bu ya ụzọ ma ọ bụ nke na-esote.
theological_decisions:
- issue: Ịgụpụta echiche ozizi pụrụ iche n’okwu ἐξελέξατο
  choice: ọ họọrọ anyị
  alternative: ọ họpụtara anyị
  rationale: ‘Họọrọ’ na-ekwupụta ihe Grik kwuru n’enweghị ibubata usoro ozizi otu ụka ma ọ bụ otu ndị nkọwa.
- issue: Ebe ἐν ἀγάπῃ (‘n’ịhụnanya’) jikọtara n’usoro ahịrịokwu
  choice: E debere ya na njedebe amaokwu nke anọ
  alternative: 'Ijikọ ya na amaokwu nke ise: ‘N’ịhụnanya, o buru ụzọ kpebie…’'
  rationale: 'Grik nwere ezigbo nghọta abụọ: okwu ahụ nwere ike ịkọwa ịdị nsọ na enweghị ntụpọ, ma ọ bụ malite echiche amaokwu na-esote. Isiokwu na nkọwa ala peeji na-echekwa mgbagwoju anya ahụ.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere nhazi okwu Pọl n’ụzọ kwekọrọ na Igbo nkịtị, ma e chekwara mgbagwoju anya nke ‘n’ịhụnanya’ site n’ọnọdụ ya na nkọwa ala peeji.
