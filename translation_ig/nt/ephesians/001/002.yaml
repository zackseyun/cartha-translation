    issue: The comma in “Jizọs, bú Mesaya” unnecessarily separates the name from its title.
    rationale: The Greek has the compact sequence Ἰησοῦ Χριστοῦ. In Standard Igbo, “Jizọs bụ Mesaya” directly and naturally expresses the title without making it an overly parenthetical aside.
  - severity: medium
