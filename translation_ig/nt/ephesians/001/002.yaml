  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: ig
  text: Ka amara na udo sitere n’aka Chineke, Nna anyị, na Onyenwe anyị Jizọs bụ Mesaya[a][b], dịrị unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Jizọs Kraịst.” Okwu Grik bụ Χριστός nwere ike ịbụ utu aha (“Mesaya”) ma ọ bụ, n’ọnọdụ ụfọdụ, bụrụ aha a na-akpọ mmadụ (“Kraịst”).'
    reason: alternative_reading
  - marker: b
    text: 'Ma ọ bụ: “Onyenwe anyị Jizọs Kraịst.”'
    reason: previous_rendering
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa χάρις n’Oziọma; ọ na-echekwa ma ọdịdị ekele nke akwụkwọ ozi ahụ ma onyinye ọma Chineke na-enye n’efu.
- source_word: ὑμῖν
  choice: dịrị unu
  rationale: N’Igbo, usoro ngọzi “dịrị unu” na-ebupụta dative ὑμῖν n’ụzọ ebumpụta ụwa karịa nsụgharị mkpụrụokwu n’otu n’otu.
- source_word: εἰρήνη
  choice: udo
  rationale: “Udo” na-echekwa isi echiche εἰρήνη ma kwekwa ka ụda echiche shalom dị n’azụ ekele Pọl nọgide.
- source_word: ἀπὸ
  choice: sitere n’aka
  rationale: Nkebiokwu a na-egosi isi iyi ma ọ bụ onye ngọzi ahụ si n’aka ya bịa, dịka ἀπὸ si arụ ọrụ ebe a.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Chineke, Nna anyị
  rationale: A kọwara “Nna anyị” dịka aha nkọwa na-esochi “Chineke,” n’enweghị itinye njikọ ‘na’ nke na-adịghị na Grik.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: “Onyenwe anyị” bụ ụzọ Igbo kwesịrị ekwesị isi chekwaa κύριος dịka utu aha Kraịst, ọ bụghị naanị ‘onye nwe’ n’echiche nkịtị.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bú Mesaya
  rationale: “Jizọs” bụ aha; “bú Mesaya” na-eme ka Χριστός pụta ìhè dịka utu aha nke Onye E Tere Mmanụ, ebe akara rikọm na-enyere Igbo aka ịgụ usoro ahụ nke ọma.
theological_decisions:
- issue: Otu e si asụgharị Χριστοῦ n’usoro Ἰησοῦ Χριστοῦ
  choice: Jizọs, bú Mesaya
  alternative: Jizọs Kraịst
  rationale: Χριστός nwere ike ịbụ utu aha pụtara Mesaya ma ọ bụ ghọọ ụdị aha a na-akpọkarị ‘Kraịst.’ Isi ederede na-eme ka ihe utu aha ahụ pụtara doo anya, ma ihe odide ala peeji na-edebe ụzọ ọzọ a na-anabata.
- issue: Mmekọrịta dị n’etiti θεοῦ na πατρὸς ἡμῶν
  choice: Chineke, Nna anyị
  alternative: Chineke anyị na Nna anyị
  rationale: Usoro genitive Grik a kacha dabara ka “Nna anyị” bụrụ nkọwa nke “Chineke”; ịgbakwunye ‘na’ nwere ike ime ka ọ dị ka aha abụọ e jikọtara ọnụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta. Usoro “Ka ... dịrị unu” bụ ekele-ngọzi ebumpụta ụwa n’Igbo. E debere “amara” na “udo” dịka okwu Akwụkwọ Nsọ a maara nke ọma, ma “Mesaya” na-akọwa utu aha Χριστός n’isi ederede.
