revisions:
- from: maka nhazi nke oge ndị ahụ mgbe ha zuru oke, ka e chịkọta ihe niile n'ime Mesaịa ahụ[a]—ihe ndị dị n'eluigwe na ihe ndị dị n'ụwa—n'ime ya,
  to: maka nhazi mgbe oge ndị a ruru n’uju, ka a chịkọta ihe niile n'ime Mesaịa ahụ[a]—ihe ndị dị n'eluigwe na ihe ndị dị n'ụwa—n'ime ya,
  rationale: The revision improves the idiomatic rendering of ‘the fullness of the times’ while retaining its temporal and fullness-related sense. It also preserves the Greek verb’s head-related nuance in the footnote without converting it into a more specific claim about a ‘leader.’ The repeated locative phrase remains in the main text, as in the Greek.
