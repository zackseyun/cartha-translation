id: EPH.1.10
reference: Ephesians 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: ig
  text: maka nhazi mgbe oge ndị a ruru n’uju, ka a chịkọta ihe niile n'ime Mesaịa ahụ[a]—ihe ndị dị n'eluigwe na ihe ndị dị n'ụwa—n'ime ya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ka e mee ka ihe niile dịrị n'okpuru otu isi n'ime Mesaịa ahụ”; ngwaa Grik ahụ nwere ike ịpụta ịchịkọta ihe niile ọnụ ma ọ bụ ime ka ha dịrị n'okpuru otu isi.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκονομίαν
  choice: nhazi
  rationale: “Nhazi” na-egosipụta usoro e ji achịkwa ma mezuo nzube ahụ, na-enweghị ime ka okwu ahụ bụrụ naanị “atụmatụ.”
- source_word: πληρώματος τῶν καιρῶν
  choice: oge ndị ahụ mgbe ha zuru oke
  rationale: Nke a na-echekwa echiche nke oge a kara aka iru n'uju ya, ma na-ada nke ọma n'Igbo ugbu a.
- source_word: ἀνακεφαλαιώσασθαι
  choice: ka e chịkọta
  rationale: “Ịchịkọta” na-eburu isi echiche nke iweta ihe niile ọnụ ma ọ bụ ịchịkọta ha n'otu nchịkọta; nkọwa ala peeji na-echekwa echiche ọzọ nke itinye ha n'okpuru otu onyeisi.
- source_word: τὰ πάντα
  choice: ihe niile
  rationale: Ọ bụ nsụgharị zuru ezu ma dị mfe nghọta nke neuter plural a, nke nwere oke gbasara eluigwe na ụwa.
- source_word: ἐν τῷ Χριστῷ
  choice: n'ime Mesaịa ahụ
  rationale: Χριστός na-arụ ọrụ dị ka utu aha ebe a; “Mesaịa” na-egosipụta nke ahụ, “n'ime” na-echekwakwa njikọ ἐν.
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς
  choice: ihe ndị dị n'eluigwe
  rationale: Nke a bụ okwu Igbo nkịtị maka ihe ndị nọ n'ógbè eluigwe ma na-echekwa oke echiche ahụ.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: ihe ndị dị n'ụwa
  rationale: Nke a na-egosipụta ọnọdụ ha n'ụwa ma na-emegide ya nke ọma na ihe ndị dị n'eluigwe.
- source_word: ἐν αὐτῷ
  choice: n'ime ya
  rationale: Ọ na-ezo aka na Mesaịa ahụ ma na-echekwa nkwughachi na mmesi ike nke Grik, n'etinyeghị okwu ọzọ.
theological_decisions:
- issue: Nsụgharị Χριστῷ
  choice: Mesaịa ahụ
  alternative: Kraịst
  rationale: N'ebe a okwu ahụ bụ utu aha nke Onye E Tere Mmanụ, ya mere “Mesaịa” na-eme ka ọrụ ya dị ka utu aha pụta ìhè.
- issue: Uche dị na ἀνακεφαλαιώσασθαι
  choice: ka e chịkọta ihe niile
  alternative: ka e mee ka ihe niile dịrị n'okpuru otu onyeisi
  rationale: Ngwaa Grik ahụ nwere ike ịpụta ịchịkọta ihe n'otu nchịkọta ma ọ bụ iweta ha n'okpuru otu isi. Isi ederede na-eji nsụgharị sara mbara; nkọwa ala peeji na-echekwa echiche nke onyeisi.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ahịrịokwu ahụ ka ọ bụrụ akụkụ na-aga n'ihu dịka Grik, ebe ọ bụ na amaokwu a jikọtara na ahịrịokwu gbara ya gburugburu. E ji “n'ime Mesaịa ahụ” chekwaa nkwughachi na echiche nke ἐν, n'agbanyeghị na “site na Mesaịa ahụ” nwere ike ịdị mfe karịa ma bụrụ nkọwa karịa.
