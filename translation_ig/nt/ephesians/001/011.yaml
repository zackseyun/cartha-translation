id: EPH.1.11
reference: Ephesians 1:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: ig
  text: N’ime ya ka e mekwara anyị bụrụ ihe nketa Chineke[a], ebe e burula ụzọ kpebie anyị dịka nzube nke onye na-arụ ihe niile dịka mkpebi nke ọchịchọ ya si dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị nwetakwara ihe nketa.” Ngwaa Grik ahụ nwere ike ịpụta ma na anyị natara ihe nketa, ma na e mere anyị ihe nketa, ya bụ, òkè nke Chineke.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: N’ime ya
  rationale: Nnọchiaha a na-arụtụ aka n’ebe Kraịst nọ n’okwu ndị bu ụzọ; ‘n’ime ya’ bụ Igbo dị mfe ma na-edobe echiche nke ịdị n’otu na Kraịst.
- source_word: ἐκληρώθημεν
  choice: e mekwara anyị ihe nketa Chineke
  rationale: Ụdị ngwaa passive a nwere ike ịpụta na e mere ndị kwere ekwe ihe nketa ma ọ bụ òkè Chineke. A kpọpụtara ‘Chineke’ n’ụzọ doro anya iji mee ka nkebiokwu ahụ bụrụ Igbo a na-aghọta, ma e debeghị ya dịka okwu dị n’ahịrị Grik; ọgụgụ ọzọ dị n’ihe odide ala peeji.
- source_word: προορισθέντες
  choice: ebe o kpebiela ọnọdụ anyị tupu oge eruo
  rationale: Nke a na-egosipụta mkpebi e mere tupu oge eruo n’Igbo nkịtị, n’ebughị usoro ozizi sara mbara bata n’amaokwu ahụ.
- source_word: κατὰ πρόθεσιν
  choice: dịka nzube ... si dị
  rationale: ‘Nzube’ na-egosipụta ebumnobi ma ọ bụ atụmatụ e zubere, ma bụrụkwa okwu Igbo dị ugbu a ma doo anya.
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: nke onye ahụ ... bú onye na-arụ ihe niile
  rationale: Ọ na-edobe Chineke dịka onye na-eme ihe ma na-echekwa obosara nke ‘ihe niile,’ n’akọwaghị ụzọ o si arụ ha karịa ihe Grik kwuru.
- source_word: κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ
  choice: dịka ndụmọdụ nke uche ya si dị
  rationale: ‘Ndụmọdụ’ na-echekwa echiche nke mkpebi e chepụtara nke ọma, ebe ‘uche ya’ na-egosipụta ihe ọ chọrọ ma ọ bụ ọchịchọ ya n’asụsụ Igbo kwụ ọtọ.
theological_decisions:
- issue: Ihe ἐκληρώθημεν pụtara
  choice: A kọwara ndị kwere ekwe dịka ndị e mere ihe nketa ma ọ bụ òkè Chineke.
  alternative: Ndị kwere ekwe nwetara ihe nketa.
  rationale: Ụdị passive nke κληρόω nwere ike ịkwado nghọta abụọ ahụ. Ọnọdụ okwu a na ndabere Agba Ochie banyere ndị Chineke dịka ihe nketa ya na-akwado ọgụgụ a họọrọ, ma ọgụgụ ọzọ bụkwa nke nwere ezigbo ihe ndabere, ya mere e debere ya n’ihe odide ala peeji.
translation_notes:
  register: Standard Igbo; asụsụ dị ùgwù ma dị mfe nghọta. E ji ‘ebe’ jikọta participle ahụ n’ụzọ na-aga nke ọma n’Igbo, ma e zere okwu teknụzụ nke nwere ike ibubata nkọwa otu ụka kpọmkwem.
