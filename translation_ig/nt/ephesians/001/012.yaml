    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ka anyị, bụ ndị nwereworo olileanya n’ime Mesaịa, wee bụrụ maka otuto nke ebube ya.”
    reason: previous_rendering
  revision_rationale: The revision restores ‘olileanya’ for the Greek hope verb, retains the deliberately cautious temporal force without identifying a particular ethnic or salvation-historical group, and renders the Ephesian ‘for the praise of his glory’ formula more directly. Both footnotes are updated so their alternatives correspond to the corrected vocabulary and preserve the disputed nuance.
