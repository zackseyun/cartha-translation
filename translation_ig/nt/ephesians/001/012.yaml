  text: εἰς τὸ εἶναι ἡμᾶς εἰς ἔπαινον δόξης αὐτοῦ τοὺς προηλπικότας ἐν τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/012.yaml
  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: ig
  text: ka anyị bụ ndị nwereworo olileanya n’ime Mesaịa wee bụrụ maka otuto nke ebube ya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị bu ụzọ nwee olileanya n’ime Mesaịa.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ka anyị, bụ ndị nwereworo olileanya n’ime Mesaịa, wee bụrụ maka otuto nke ebube ya.”
    reason: previous_rendering
lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: ka ... wee bụrụ
  rationale: Nke a na-egosi nzube ma ọ bụ ihe ga-esi na ya pụta n’Igbo dị mfe ma bụrụkwa nke sitere n’okwu Grik ahụ.
- source_word: ἡμᾶς
  choice: anyị
  rationale: Ọ bụ ‘anyị’ bụ isiokwu nke omume ahụ mgbe e mere ahịrịokwu ahụ ka ọ daa nke ọma n’Igbo.
- source_word: εἰς ἔπαινον
  choice: ihe ga-ewetara ... otuto
  rationale: Nke a na-egosipụta nzube ma ọ bụ nsonaazụ nke ịbụ ha n’ụzọ Igbo nkịtị, na-enweghị ime ka okwu ahụ sie ike nghọta.
- source_word: δόξης αὐτοῦ
  choice: ebube ya
  rationale: A hapụrụ njikọ genitiv ahụ n’ụzọ doro anya, ma debe ịdị arọ nke echiche ‘ebube.’
- source_word: τοὺς προηλπικότας
  choice: ndị tụkwasịrịla ... obi na mbụ
  rationale: Ụdị perfect participle na πρό- na-egosi olileanya malitere tupu oge a ma ka dị mkpa; nsụgharị a anaghị ekpebi na ha bụ ndị mbụ n’usoro mmadụ niile.
- source_word: ἐν τῷ Χριστῷ
  choice: tụkwasịrịla Mesaịa obi
  rationale: N’ebe a ἐν na-ejikọta olileanya na Mesaịa; Igbo a na-egosi onye olileanya ahụ dị n’ime ya n’ụzọ eke, ma debe Χριστός dịka utu aha ‘Mesaịa.’
theological_decisions:
- issue: Ma προηλπικότας ọ̀ na-akọwa otu ndị bụ ndị mbụ nwere olileanya, ka ọ̀ na-ekwu naanị na ha nwere olileanya tupu oge ahụ
  choice: ndị tụkwasịrịla Mesaịa obi na mbụ
  alternative: ndị bụ ndị mbụ tụkwasịrị Mesaịa obi
  rationale: Nganiihu προ- na-egosi ịdị tupu oge, ma ọ naghị edo anya n’onwe ya ma Pọl ọ̀ na-akọwa ndị Juu kwere ekwe dịka otu mbụ. Isi ederede na-ahapụ esemokwu ahụ ghe oghe; ndetu ala na-enye nhọrọ siri ike karị.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘Mesaịa’ debe Χριστός dịka utu aha. E tinyere akara ndetu [a] na [b] n’isi ederede dịka achọrọ.
