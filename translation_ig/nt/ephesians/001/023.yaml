revisions:
- from: nke bụ ahụ ya, izu oke nke onye ahụ na-eme ka ihe niile zuo oke n'ime ihe niile.[a][b]
  to: nke bụ ahụ ya, njupụta nke onye ahụ na-emeju ihe niile n'ihe niile.[a][b]
  rationale: The revision restores the filling/fullness word-family that links πλήρωμα and πληρουμένου, while retaining the Greek syntax and ambiguity of ἐν πᾶσιν as ‘n'ihe niile.’ It does not resolve the debated relationship of the church to Christ or impose a theological interpretation. Both audit-trail footnotes are retained, with the passive alternative corrected from completion to filling.
