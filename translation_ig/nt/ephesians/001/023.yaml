  text: which is his body[b][a], the fullness of the one who fills all things in all.
translation:
  language: ig
  text: nke bụ ahụ ya, njupụta nke onye ahụ na-emeju ihe niile n'ihe niile.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n''ụzọ nkịtị karịa: “njupụta nke onye ahụ na-emeju ihe niile n''ihe niile.”'
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta participle Grik ahụ dịka “onye a na-emeju,” ọ bụ ezie na ọtụtụ ndị na-aghọta ya ebe a dịka “onye ahụ na-emeju.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἥτις
  choice: nke bụ
  rationale: Ọ na-ezo aka n'ọgbakọ e kwuru okwu ya n'amaokwu nke 22; ntụgharị a dị mfe ma bụrụkwa Igbo nkịtị.
- source_word: τὸ σῶμα αὐτοῦ
  choice: ahụ ya
  rationale: Nke a na-echekwa ihe atụ Pọl ji kọwaa njikọ dị n'etiti ọgbakọ na Kraịst.
- source_word: τὸ πλήρωμα
  choice: izu oke
  rationale: Ọ na-echekwa echiche nke njupụta ma ọ bụ ihe mezuru ezu, na-enweghị ikpebi kpọmkwem otu a ga-esi ghọta mmekọrịta ahụ.
- source_word: τοῦ ... πληρουμένου
  choice: nke onye ahụ na-eme ka ... zuo oke
  rationale: Ọ na-egosipụta nghọta na-arụ ọrụ nke participle ahụ—onye na-ejupụta ma ọ bụ na-eme ka ihe zuo oke—ma hapụkwa nghọta passive n'ihe odide ala peeji.
- source_word: τὰ πάντα
  choice: ihe niile
  rationale: Ọ na-egosipụta obosara nke okwu Grik ahụ nke na-emetụta ihe niile.
- source_word: ἐν πᾶσιν
  choice: n'ime ihe niile
  rationale: Ntughari a na-anọ nso n'ụdị okwu Grik ma na-echekwa mgbagwoju anya ya kama ime ka ọ bụrụ naanị 'n'ụzọ niile' ma ọ bụ 'n'ime mmadụ niile.'
theological_decisions:
- issue: Ihe πλήρωμα pụtara n'ihe gbasara ọgbakọ na Kraịst
  choice: A kpọrọ ọgbakọ 'izu oke' ya, na-akọwaghị kpọmkwem ma ọ bụ ihe Kraịst na-eme ka o zuo oke ma ọ bụ ihe na-emeju ihe atụ nke ahụ ya.
  alternative: ọgbakọ dịka ihe Kraịst na-ejupụta; ma ọ bụ dịka ihe na-emeju Kraịst
  rationale: Okwu Grik ahụ nwere ọtụtụ nghọta nwere njikọ; 'izu oke' na-echekwa esemokwu ahụ n'emeghị ka otu nkọwa bụrụ naanị ya.
- issue: Olu na nghọta nke πληρουμένου
  choice: onye ahụ na-eme ka ihe niile zuo oke
  alternative: onye ahụ a na-eme ka o zuo oke
  rationale: Ọ bụ ezie na ọdịdị participle ahụ bụ middle/passive, ọnọdụ okwu a na-akwado nghọta na-arụ ọrụ; e debere nghọta passive n'ihe odide ala peeji.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. E ji 'izu oke' chekwaa ịdị omimi na mgbagwoju anya nke πλήρωμα; e jikwa 'n'ime ihe niile' chekwaa nghọta sara mbara nke ἐν πᾶσιν.
