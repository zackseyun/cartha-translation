lexical_decisions:
- source_word: ἧς
  choice: nke
  rationale: Nnọchiaha njikọ a na-atụ aka azụ n’amara a kpọrọ aha n’amaokwu nke 7. “Nke” na-ejikọta okwu ahụ n’ụzọ dị mfe ma na-edebe njikọ ahụ n’enweghị ịgbakwụnye nkọwa.
- source_word: ἐπερίσσευσεν
  choice: wụsara … n’ụba
  rationale: Okwu a nwere echiche nke ime ka ihe baa ụba nke ukwuu. “Wụsara anyị n’ụba” bụ Igbo dị ndụ nke na-egosi onyinye bara nnọọ ụba, ma ọ naghị atụfu ihe atụ nke ụba gabigara ókè.
- source_word: εἰς ἡμᾶς
  choice: anyị
  rationale: N’usoro okwu “wụsara anyị,” “anyị” na-egosi ndị ihe ahụ rutere; nke a na-enye echiche nke ihe e duziri n’ebe ndị kwere ekwe nọ n’Igbo nkịtị.
- source_word: ἐν
  choice: n’
  rationale: “N’” nwere ike igosi ụzọ e si mee ihe ma ọ bụ ọnọdụ ihe ahụ nọ na ya. Ya mere, ọ naghị ekpebi nke ọma njikọ nke nkebiokwu sochirinụ.
- source_word: πάσῃ
  choice: niile
  rationale: Mgbe ọ na-eso aha echiche ndị a, ọ na-egosi izu oke ma ọ bụ ịdị ukwuu nke amamihe na nghọta ahụ. “Niile” bụ okwu doro anya ma bụrụ nke a na-eji n’Igbo ugbu a.
- source_word: σοφίᾳ
  choice: amamihe
  rationale: “Amamihe” bụ nsụgharị Igbo doro anya na nke a na-ejikarị eme ihe maka σοφία.
- source_word: φρονήσει
  choice: nghọta
  rationale: “Nghọta” na-egosi ịmata ihe nke ọma na ikike ịghọta otu e si etinye ya n’ọrụ. Ọ na-ekewapụkwa echiche a ntakịrị n’ebe “amamihe” dị n’asụsụ Igbo dị mfe.
theological_decisions:
- issue: Ihe nkebiokwu “n’amamihe na nghọta niile” na-akọwa
  choice: 'E debere njikọ okwu ahụ oghe: ọ pụrụ ịkọwa ụzọ Chineke si wụsa amara ya n’ụba, ma ọ bụ amamihe na nghọta so n’ihe ndị kwere ekwe natara.'
  alternative: Ịkọwa ya kpọmkwem dịka amamihe Chineke ji mee ihe ahụ, ma ọ bụ dịka amamihe e nyere ndị kwere ekwe.
  rationale: Usoro Grik ahụ na-enye ohere maka nghọta abụọ ahụ. Nsụgharị a anaghị ekpebi ihe ederede ahụ n’onwe ya na-ahapụghị anya, ya mere ọ na-echekwa esemokwu nkọwa ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Wụsara anyị n’ụba” na-enye ụda eke karịa usoro okwu nkịtị “mere ka ọ baa ụba,” ebe ihe odide ala ala peeji na-echekwa nhọrọ ahụ. E debere akara ala ala peeji dịka [b][a] n’isi ederede.
