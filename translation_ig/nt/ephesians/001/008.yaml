- from: nke o wụsara anyị n’ụba, n’amamihe na nghọta niile[b][a].
  to: nke o mere ka ọ baara anyị ụba n’amamihe na nghọta niile[b][a].
  rationale: The revision makes explicit in Igbo the causative/transitive force of ἐπερίσσευσεν while retaining the relative reference to grace and the Greek clause’s deliberate syntactic openness concerning “in all wisdom and insight.” Footnote a now offers the more idiomatic “lavished/poured out abundantly” alternative; footnote b is adjusted only to match the corrected main wording.
