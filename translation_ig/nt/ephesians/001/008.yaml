translation:
  language: ig
  text: nke o mere ka ọ baara anyị ụba n’amamihe na nghọta niile[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke o wụsara anyị n’ụba.”
    reason: lexical_alternative
  - marker: b
    text: Nkebiokwu “n’amamihe na nghọta niile” nwere ike ịkọwa ụzọ Chineke si mee ka amara ya baara anyị ụba, ma ọ bụ amamihe na nghọta so n’ihe o nyere ndị kwere ekwe.
