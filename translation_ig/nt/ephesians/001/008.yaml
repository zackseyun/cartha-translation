    text: Nkebiokwu “n’amamihe na nghọta niile” nwere ike ịkọwa ụzọ Chineke si mee ka amara ya baara anyị ụba, ma ọ bụ amamihe na nghọta so n’ihe o nyere ndị kwere ekwe.
    reason: alternative_reading
  revision_rationale: The revision makes explicit in Igbo the causative/transitive force of ἐπερίσσευσεν while retaining the relative reference to grace and the Greek clause’s deliberate syntactic openness concerning “in all wisdom and insight.” Footnote a now offers the more idiomatic “lavished/poured out abundantly” alternative; footnote b is adjusted only to match the corrected main wording.
