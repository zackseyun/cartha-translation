  text: γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/009.yaml
  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: ig
  text: mgbe o mere ka anyị mata ihe omimi nke uche ya, dị ka ezi ọchịchọ ya si dị, nke o zubere n'ime ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ime Kraịst”; ụfọdụ na-aghọta “n'ime ya” dị ka “n'ime onwe ya,” ya bụ, n'ime Chineke onwe ya.
    reason: alternative_reading
lexical_decisions:
- source_word: γνωρίσας
  choice: O mere ka anyị mata
  rationale: A sụgharịrị participle a n’ụdị ngwaa zuru ezu ka okwu ahụ daa nke ọma n’Igbo, ma nọgide na-egosi na Chineke mere ka anyị mara ihe ahụ.
- source_word: ἡμῖν
  choice: anyị
  rationale: Ọ bụ onye a na-eme ka ọ mata ihe; ya mere, “mere ka anyị mata” na-egosipụta dative indirect object ahụ n’ụzọ Igbo si ekwu ya.
- source_word: μυστήριον
  choice: ihe omimi
  rationale: “Ihe omimi” na-egosi atụmatụ Chineke nke zoro ezo na mbụ ma e meela ka a mata ya; ọ bụghị nanị ihe a na-agaghị enwe ike ịghọta.
- source_word: θέλημα
  choice: uche
  rationale: “Uche ya” bụ ụzọ dị ugbu a, dịkwa mfe nghọta, isi kwuo ọchịchọ ma ọ bụ uche Chineke, n’enweghị ịgwakọta ya na ngwaa προέθετο nke pụtara izube.
- source_word: κατὰ
  choice: dị ka … si dị
  rationale: Nkebiokwu Igbo a na-egosipụta ụkpụrụ ma ọ bụ nkwekọrịta nke κατά na accusative pụtara ebe a.
- source_word: εὐδοκίαν
  choice: ezi ọchịchọ
  rationale: “Ezi ọchịchọ” na-ejigide echiche nke ihe dị Chineke mma na nzube ọma ya, n’etinyeghị nkọwa sara mbara karịa ihe Grik kwuru.
- source_word: προέθετο
  choice: o zubere
  rationale: “Zubere” na-egosi ime atụmatụ ma ọ bụ ikpebi ihe a ga-eme, nke dabara na middle voice na gburugburu okwu a.
- source_word: ἐν αὐτῷ
  choice: n'ime ya
  rationale: A hapụrụ nnọchiaha Grik ahụ dị ka nnọchiaha n’Igbo ka e ghara ikpebi n’ahịrịokwu bụ́ onye ọ na-ezo aka na ya; ihe odide ala peeji depụtara nghọta abụọ bụ isi.
theological_decisions:
- issue: Onye ἐν αὐτῷ na-ezo aka na ya
  choice: Isi okwu ahụ na-asị “n'ime ya,” na-ahapụghị nnọchiaha ahụ ka ọ bụrụ “Kraịst” ma ọ bụ “onwe ya.”
  alternative: A pụrụ ịghọta ya dị ka “n'ime Kraịst”; ụfọdụ na-aghọta ya dị ka “n'ime onwe ya,” ya bụ, n'ime Chineke onwe ya.
  rationale: Okwu Grik ahụ bụ nnọchiaha nke nwere ike izo aka n’ebe dị iche iche. Ịhapụ ya ka ọ bụrụ “n'ime ya” na-echekwa mgbagwoju anya ahụ kama idozi okwu nkà mmụta okpukpe n’ime isi ederede.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu na-adị ire n’Igbo, ma e chekwara okwu nkà mmụta okpukpe bụ “ihe omimi” na mgbagwoju anya dị na “n'ime ya.”
