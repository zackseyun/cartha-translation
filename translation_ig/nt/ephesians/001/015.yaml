id: EPH.1.15
reference: Ephesians 1:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὰ τοῦτο κἀγώ, ἀκούσας τὴν καθ’ ὑμᾶς πίστιν ἐν τῷ κυρίῳ Ἰησοῦ καὶ τὴν ⸂ἀγάπην τὴν⸃ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/015.yaml
  text: For this reason[a], I also, having heard of your faith in the Lord Jesus and your love for all the saints[b],
translation:
  language: ig
  text: N’ihi nke a, mụ kwa, mgbe m nụrụ banyere okwukwe unu n’ime Onyenwe anyị Jizọs[a] na ịhụnanya unu maka ndị nsọ niile[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ntụkwasị obi unu n’Onyenwe anyị Jizọs.” Okwu Grik ahụ nwekwara ike ịpụta “ikwesi ntụkwasị obi” n’ebe ụfọdụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịhụnanya unu n’ebe ndị nsọ niile nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-ezo aka n’ihe e kwuru tupu amaokwu a ma na-egosi ihe mere Pọl ji zaghachi otú a; okwu Igbo a na-edobe njikọ ahụ n'ụzọ doro anya.
- source_word: κἀγώ
  choice: mụ onwe m kwa
  rationale: Ọ na-edobe ike mgbakwunye dị na καί + ἐγώ, ya bụ na Pọl n’onwe ya sokwa ná nzaghachi ahụ.
- source_word: ἀκούσας
  choice: ebe m nụrụ banyere
  rationale: Nke a na-egosi na ịnụ akụkọ ahụ bụ ọnọdụ ma ọ bụ ihe butere ihe Pọl na-aga ikwu, ma na-ada ka Igbo nkịtị.
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: okwukwe unu
  rationale: Akpaalaokwu Greek ahụ na-ezo aka n’okwukwe nke ndị a na-agwa okwu; ‘okwukwe unu’ bụ ntụgharị Igbo doro anya ma dị nkenke.
- source_word: πίστιν
  choice: okwukwe
  rationale: N’ebe a, okwu ahụ bụ πίστις na-egosi ntụkwasị obi ndị na-agụ akwụkwọ nwere n’ime Onyenwe anyị Jizọs; ‘okwukwe’ na-edobe okwu okpukpe a maara nke ọma n’Igbo.
- source_word: ἐν τῷ κυρίῳ Ἰησοῦ
  choice: n’ime Onyenwe anyị Jizọs
  rationale: ‘N’ime’ na-edobe preposition ἐν na akpaalaokwu Pọl, kama ịgbanwe ya ka ọ bụrụ naanị ‘n’ebe ... nọ.’
- source_word: κυρίῳ
  choice: Onyenwe anyị
  rationale: Nke a bụ ntụgharị Igbo a na-ejikarị akọwa κύριος dịka aha nsọpụrụ nke Jizọs, na-enweghị ime ka ọ ghọọ naanị ‘nna ukwu.’
- source_word: ἀγάπην
  choice: ịhụnanya
  rationale: Ọ bụ okwu Igbo nkịtị, dị ùgwù, nke kwekọrọ kpọmkwem na ἀγάπη n’ebe a.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: n’ebe ndị nsọ niile nọ
  rationale: 'Ọ na-edobe ntụziaka nke εἰς: ịhụnanya ahụ na-aga n’ebe ndị ahụ niile nọ.'
- source_word: ἁγίους
  choice: ndị nsọ
  rationale: Ọ na-edobe aha Pọl ji akpọ ndị kwere ekwe, ma ọ pụtaghị nanị ndị e mechara nye ọkwa nsọ pụrụ iche.
theological_decisions:
- issue: Ihe πίστις pụtara n’akụkụ okwu a
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: Njikọ ya na ‘n’ime Onyenwe anyị Jizọs’ na-akwado echiche nke ikwere ma ọ bụ ịtụkwasị Jizọs obi. ‘Ikwesị ntụkwasị obi’ ka nwere ike ịdị n’ụdị nghọta okwu ahụ n’ebe ụfọdụ, ma ọ bụghị nghọta kacha pụta ìhè ebe a.
- issue: Ịtụgharị κύριος dịka aha Jizọs
  choice: Onyenwe anyị
  alternative: Nna Ukwu
  rationale: ‘Onyenwe anyị’ na-edobe ịdị arọ nke aha nsọpụrụ Kraịst a ma bụrụkwa okwu Igbo a na-aghọta nke ọma; ‘Nna Ukwu’ nwere ike ime ka ọ bụrụ naanị mmekọrịta onye nwe mmadụ na ohu.
- issue: Ihe ἅγιοι na-ezo aka na ya
  choice: ndị nsọ
  alternative: ndị dị nsọ; ndị Chineke doro nsọ
  rationale: ‘Ndị nsọ’ na-edobe aha mkpokọta Pọl ji akpọ ndị kwere ekwe. A ghaghị ịghọta ya n’ebe a dịka ndị Chineke kewapụrụ nye onwe ya, ọ bụghị naanị mmadụ ole na ole e nyere ọkwa nsọ mgbe ha nwụsịrị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ ka bụ akụkụ nke ahịrịokwu na-aga n’ihu, dịka ọ dị na Greek, ya mere e ji rikoma mechie ya. E debere ‘n’ime Onyenwe anyị Jizọs’ iji chekwaa akpaalaokwu Pọl, ebe ‘ndị nsọ’ na-ezo aka n’ebe a nye ndị kwere ekwe niile Chineke doro nsọ.
