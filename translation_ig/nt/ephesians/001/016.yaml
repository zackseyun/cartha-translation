  text: I do not cease giving thanks for you[a], making mention of you in my prayers,
translation:
  language: ig
  text: Anaghị m akwụsị inye ekele n’ihi unu, na-akpọtụ unu aha n’ekpere m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-echeta unu n’ekpere m.” Akpaalaokwu Grik ahụ bụ n’ụzọ nkịtị, “na-eme ncheta [banyere unu] n’ekpere m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ παύομαι
  choice: Anaghị m akwụsị
  rationale: Na-egosi omume na-aga n’ihu nke Pọl na-adịghị akwụsị, ma na-anọgidekwa nso n’usoro okwu Grik.
- source_word: εὐχαριστῶν
  choice: ikele Chineke
  rationale: εὐχαριστέω pụtara inye ekele; itinye ‘Chineke’ na-eme ka okwu ahụ doo anya n’Igbo dịka onye a na-ekele, bụ́ ihe gbara ama n’ọnọdụ ekpere, n’agbanyeghị na Grik ahaghị ya kpọmkwem n’amaokwu a.
- source_word: ὑπὲρ ὑμῶν
  choice: n’ihi unu
  rationale: N’ọnọdụ inye ekele, ọ na-egosi na ndị a bụ ihe kpatara ekele ahụ; ‘n’ihi unu’ bụ Igbo eke ma doo anya.
- source_word: μνείαν ποιούμενος
  choice: na-echeta unu
  rationale: Akpaalaokwu Grik ahụ bụ n’ụzọ nkịtị ‘na-eme ka a kpọtụ unu aha’; ‘na-echeta unu’ na-enye echiche ya n’Igbo dị ugbu a n’enweghị ịgbanwe ihe ọ pụtara.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: n’ekpere m niile
  rationale: Na-egosi oge ma ọ bụ ọnọdụ a na-echeta ha. Ọtụtụ ‘ekpere’ dị na Grik kwadoro ‘ekpere m niile,’ nke dịkwa eke n’Igbo.
