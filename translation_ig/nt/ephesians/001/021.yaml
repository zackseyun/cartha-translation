id: EPH.1.21
reference: Ephesians 1:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/021.yaml
  text: far above every rule and authority and power and dominion[a], and every name that is named[c][b], not only in this age but also in the one to come.
translation:
  language: ig
  text: dị nnọọ elu karịa ọchịchị ọ bụla, ikike ọ bụla, ike ọ bụla, na ọnọdụ ịbụ onyenwe ọ bụla,[a] nakwa aha ọ bụla a na-akpọ,[b] ọ bụghị naanị n’oge a, kama n’oge nke na-abịanụ kwa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọkwa ọchịchị ọ bụla, ikike ọ bụla, ike ọ bụla, na ọnọdụ ịbụ onyenwe ọ bụla.” Okwu Grik ndị a pụrụ izo aka n’ọkwa ma ọ bụ ngalaba ọchịchị dị iche iche, gụnyere ike nke eluigwe ma ọ bụ nke mmụọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “utu aha ọ bụla e nyere.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “ọ bụghị naanị n’oge a, kama n’oge na-abịanụ kwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεράνω
  choice: dị nnọọ elu karịa
  rationale: Na-egosi na Kraịst dị elu nke ukwuu ma karịchaa ihe niile e depụtara; okwu a na-ejikọkwa nke ọma na ahịrịokwu bu ya ụzọ.
- source_word: πάσης ἀρχῆς
  choice: ọchịchị niile
  rationale: Ọ na-echekwa echiche nke ụdị ma ọ bụ ngalaba ọchịchị, kama ịkọwapụta ya dị ka ndị ọchịchị mmadụ ma ọ bụ ndị mmụọ ozi.
- source_word: ἐξουσίας
  choice: ikike niile
  rationale: “Ikike” na-egosi ikike e nwere ma ọ bụ a na-eji achị, ma na-anọgide dị iche na δύναμις.
- source_word: δυνάμεως
  choice: ike niile
  rationale: “Ike” bụ nsụgharị Igbo doro anya ma kwekọọ n’echiche nke power/might, na-enweghị ime ka ọ bụrụ otu ihe na ikike.
- source_word: κυριότητος
  choice: ịbụ onyenwe niile
  rationale: Na-egosipụta ọnọdụ ma ọ bụ ọchịchị nke onye nwe, ma na-ezere ịkpọ ndị e depụtara “Onyenwe,” aha a na-ejikarị akpọ Chineke ma ọ bụ Kraịst.
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: aha ọ bụla a na-akpọ
  rationale: Na-echekwa nkwughachi okwu dị na Grik ma hapụ obosara ya—ọ pụrụ ịgụnye aha, ọkwa, ma ọ bụ utu aha—n’enweghị imechi nghọta ahụ.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: ọ bụghị naanị ... kama ... kwa
  rationale: Nke a bụ ụzọ Igbo si ekwu njikọ a n'ụzọ eke ma doo anya.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: n’oge a
  rationale: “Oge” na-echekwa ọdịdị nke αἰών dị ka oge ma ọ bụ age, kama ịtụgharị ya ka ọ bụrụ ụwa.
- source_word: ἐν τῷ μέλλοντι
  choice: n’oge nke na-abịanụ
  rationale: Na-eme ka aha αἰών a ghọtara na nkebi nke abụọ pụta ìhè n’Igbo, ebe ọ ka na-egosi oge na-abịa.
theological_decisions:
- issue: Ụdị ọchịchị na ikike ndị e depụtara (ἀρχή, ἐξουσία, δύναμις, κυριότης)
  choice: A sụgharịrị ha dị ka ụdị ọchịchị na ikike n’ozuzu, n’akọwaghị ma ha bụ mmadụ, ndị mmụọ, ma ọ bụ ndị mmụọ ozi.
  alternative: Ịkpọ ha kpọmkwem ike ndị dị n’eluigwe ma ọ bụ ọkwa dị iche iche nke ndị mmụọ ozi.
  rationale: Ọ bụ ezie na ihe gbara amaokwu a gburugburu pụrụ ịgụnye ike ndị mmụọ ma ọ bụ nke eluigwe, okwu Grik n’onwe ha anaghị akọwa ọdịdị ndị ahụ kpọmkwem. Nsụgharị ahụ na-echekwa obosara na esemokwu nkọwa ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu na-aga n’ihu site n’amaokwu bu ụzọ, ebe ὑπεράνω na-akọwa ebe e debere Kraịst. E chekwara ụdị anọ nke okwu ọchịchị n’usoro ha, ma zere ịkọwa ha n’ụzọ otu ụka ma ọ bụ otu nkụzi pụrụ iche.
