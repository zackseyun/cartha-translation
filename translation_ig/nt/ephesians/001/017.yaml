id: EPH.1.17
reference: Ephesians 1:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῆς δόξης, δώῃ ὑμῖν πνεῦμα σοφίας καὶ ἀποκαλύψεως ἐν ἐπιγνώσει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/017.yaml
  text: that the God of our Lord Jesus the Messiah[a], the Father of glory, may give you a spirit of wisdom and revelation in the knowledge of him[c][b],
translation:
  language: ig
  text: ka Chineke nke Onyenwe anyị Jizọs Mesaya[b], Nna nke ebube[c], nye unu mmụọ nke amamihe na mkpughe n’ịmata ya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ntụgharị a na-ahụkarị bụ “Jizọs Kraịst.” Aha-ọkwa Grik Χριστός pụtara “Mesaya.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụ ya, “Nna dị ebube.” N’ụzọ nkịtị, okwu ahụ bụ “Nna nke ebube.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-ewebata ihe Pọl na-arịọ n’ekpere ya, ma na-ejigide njikọ amaokwu a na nke bu ya ụzọ.
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν
  choice: Chineke nke Onyenwe anyị
  rationale: Nke a na-esochi usoro genitive Grik ma na-anọgide bụrụ okwu Igbo doro anya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bú Mesaya
  rationale: Χριστός bụ aha-ọkwa pụtara Mesaya; “bú” na-eme ka aha-ọkwa ahụ daa nke ọma n’Igbo.
- source_word: ὁ πατὴρ τῆς δόξης
  choice: Nna nke ebube
  rationale: Ntụgharị a na-edobe genitive ahụ n’ụzọ dị nso, kama ikpebi na ọ pụtara naanị “Nna dị ebube.”
- source_word: δώῃ
  choice: nye
  rationale: Mgbe “ka” gachara, “nye” na-egosi arịrịọ ma ọ bụ nzube nke subjunctive Grik n’ụzọ Igbo kwesịrị ekwesị.
- source_word: πνεῦμα
  choice: mmụọ
  rationale: “Mmụọ” enweghị mkpụrụedemede ukwu ma ọ bụ ihe ọzọ na-amanye otu nkọwa, ya mere ọ nwere ike ịbụ mmụọ/ọnọdụ ime mmụọ Chineke nyere ma ọ bụ Mmụọ Nsọ.
- source_word: σοφίας καὶ ἀποκαλύψεως
  choice: amamihe na mkpughe
  rationale: 'Okwu ndị a na-egosi àgwà ma ọ bụ ihe dị n’ime mmụọ ahụ: amamihe na ime ka ihe zoro ezo pụta ìhè.'
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: n’ịmata ya
  rationale: Nke a bụ Igbo dị ugbu a ma dị mfe nghọta; ọ na-egosi ịmata onye ahụ n’ezie n’enweghị ịgbakwụnye nkọwa na-adịghị n’ederede.
theological_decisions:
- issue: Ma πνεῦμα ọ bụ Mmụọ Nsọ kpọmkwem, ka ọ bụ mmụọ ma ọ bụ ọnọdụ ime mmụọ Chineke na-enye
  choice: mmụọ amamihe na mkpughe
  alternative: Mmụọ nke amamihe na mkpughe
  rationale: πνεῦμα enweghị article n’ebe a, ntụaka ya nwekwara ezigbo mgbagwoju anya. Isi ederede anaghị eji mkpụrụedemede ukwu kpebie okwu ahụ; ihe odide ala peeji na-edobe nkọwa nke Mmụọ Nsọ.
- issue: Otu e si atụgharị Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dị ka aha-ọkwa; “Mesaya” na-eme ka ihe aha-ọkwa Grik ahụ pụtara doo anya.
- issue: Ihe genitive dị na ὁ πατὴρ τῆς δόξης pụtara
  choice: Nna nke ebube
  alternative: Nna dị ebube
  rationale: A hapụrụ usoro ahụ ka o buru ibu n’ihe ọ pụrụ ịpụta, kama ịkọwa ya naanị dị ka adjective.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ malitere na “ka” ma kwụsị na rikoma n’ihi na n’asụsụ mmalite ọ bụ akụkụ nke ekpere malitere n’amaokwu bu ụzọ. E debere ezigbo mgbagwoju anya dị na “mmụọ” na “Nna nke ebube,” ebe ihe odide ala peeji na-enye ụzọ ndị ọzọ.
