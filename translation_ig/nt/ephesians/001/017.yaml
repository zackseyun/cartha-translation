revisions:
- from: ka Chineke nke Onyenwe anyị Jizọs, bú Mesaya[b], Nna nke ebube[c], nye unu mmụọ[a] amamihe na mkpughe n’ịmata ya,
  to: ka Chineke nke Onyenwe anyị Jizọs Mesaya[b], Nna nke ebube[c], nye unu mmụọ nke amamihe na mkpughe n’ịmata ya,
  rationale: 'The revision makes two limited grammatical and stylistic corrections: it supplies “nke” to represent the genitive relation in “spirit of wisdom and revelation,” and it replaces the strained appositional “bú Mesaya” with the directly titulary “Mesaya.” It preserves the verse’s subordinate form and terminal comma, the unresolved sense of πνεῦμα, the literal genitive “Nna nke ebube,” all existing footnote anchors, and each footnote’s intended alternative.'
