  text: εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ ⸀ἧς ἐχαρίτωσεν ἡμᾶς ἐν τῷ ἠγαπημένῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/006.yaml
  text: to the praise of the glory of his grace[a], with which he has favored us in the Beloved[b],
translation:
  language: ig
  text: ka e wee too ebube nke amara ya, bụ́ amara o ji meere anyị amara n’ime Onye ahụ A Hụrụ n’Anya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Onye ahụ A Hụrụ n’Anya” na-ezo aka n’Ọkpara ahụ, ya bụ, Kraịst.
    reason: cross_reference
lexical_decisions:
- source_word: εἰς ἔπαινον
  choice: ka e wee too
  rationale: Nkebiokwu a na-egosi nzube ma ọ bụ ihe si na ya pụta; ntụgharị a bụ Igbo nkịtị ma na-edobe echiche otuto.
- source_word: δόξης
  choice: ebube
  rationale: “Ebube” bụ okwu Igbo kwesịrị ekwesị maka δόξα n’ọnọdụ otuto nye Chineke.
- source_word: χάριτος
  choice: amara
  rationale: “Amara” na-egosi ihu ọma Chineke nke a na-enye n’efu ma bụrụkwa okwu a maara nke ọma n’Igbo Ndị Kraịst.
- source_word: ἧς ἐχαρίτωσεν ἡμᾶς
  choice: bụ́ amara o ji meere anyị ihe ọma
  rationale: Nke a na-edobe njikọ dị n’etiti χάρις na χαριτόω site n’ikwughachi “amara,” ma na-asụkwa Igbo nghọta karịa iji ngwaa e kere eke dịka “o marara anyị.”
- source_word: ἐν
  choice: n’ime
  rationale: “N’ime” na-edobe isi echiche nke ἐν ma ghara ikpebi ma ọ pụtara njikọ, ọnọdụ, ma ọ bụ ụzọ e si mee ihe.
- source_word: τῷ ἠγαπημένῳ
  choice: Onye ahụ Ọ Hụrụ n’Anya
  rationale: A sụgharịrị participle ahụ dị ka aha nsọpụrụ, n’agbakwụnyeghị “Ọkpara,” nke adịghị kpọmkwem n’amaokwu ahụ.
theological_decisions:
- issue: Njikọ dị n’etiti χάρις na χαριτόω
  choice: amara ... bụ́ amara o ji meere anyị ihe ọma
  alternative: amara ... nke o ji gọzie anyị / nke o nyere anyị n’efu
  rationale: Ikwughachi “amara” na-echekwa egwuregwu okwu Grik na omume amara Chineke, ebe “meere anyị ihe ọma” na-eme ka okwu ahụ bụrụ Igbo dị ndụ ma ghara ịkọwa ya karịa ihe odide ahụ.
- issue: Ihe τῷ ἠγαπημένῳ na-ezo aka na ya
  choice: Onye ahụ Ọ Hụrụ n’Anya
  alternative: Ọkpara ya Ọ Hụrụ n’Anya
  rationale: Ọ bụ Kraịst ka aha a na-ezo aka na ya, ma amaokwu ahụ ekwughị “Ọkpara” kpọmkwem; ya mere, a hapụrụ ya dịka aha nsọpụrụ nwere ike iburu ịdị arọ nke okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro amaokwu ahụ dịka akụkụ nke otu ahịrịokwu ogologo malitere n’amaokwu ndị bu ya ụzọ; ya mere, e ji obere mkpụrụedemede malite ma tinye rikoma n’ọgwụgwụ.
