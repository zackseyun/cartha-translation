id: EPH.1.1
reference: Ephesians 1:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ τοῖς ἁγίοις τοῖς οὖσιν ⸂[ἐν Ἐφέσῳ]⸃ καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: ig
  text: 'Pọl, onyeozi nke Mesaịa Jizọs site n’uche Chineke, na-edegara ndị nsọ nọ [n’Efesọ][a], na ndị kwesịrị ntụkwasị obi n’ime Mesaịa Jizọs:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ odide oge ochie enweghị okwu ndị a bụ “n’Efesọ.” Nke a emeela ka ụfọdụ ghọta na e bu n’obi ka akwụkwọ ozi a ruo ọtụtụ ọgbakọ, ọ bụghị naanị ọgbakọ dị n’Efesọ.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπόστολος
  choice: onyeozi
  rationale: “Onyeozi” bụ okwu Igbo a na-ejikarị akọwa onye e zipụrụ nke nwere ọrụ na ikike pụrụ iche; ọ dabara n'ọkwa Pọl ebe a karịa naanị “onye ozi.”
- source_word: Χριστοῦ Ἰησοῦ
  choice: nke Mesaịa Jizọs
  rationale: Χριστός ka na-arụ ọrụ dị ka utu aha ebe a; “Mesaịa” na-echekwa echiche nke Onye E Tere Mmanụ, ebe usoro Igbo “Mesaịa Jizọs” na-agbaso usoro okwu Grik.
- source_word: διὰ θελήματος θεοῦ
  choice: site n'uche Chineke
  rationale: Nkebi a na-egosi na ịbụ Pọl onyeozi sitere n'uche na nhọpụta Chineke; “site n'uche Chineke” bụ Igbo doro anya ma dịkwa n'okike.
- source_word: ἁγίοις
  choice: ndị nsọ
  rationale: “Ndị nsọ” bụ aha mkpokọta a maara nke ọma maka ndị Chineke kewapụrụ nye onwe ya, ọ bụghị naanị ndị mmadụ ole na ole e nyere ọkwa pụrụ iche.
- source_word: τοῖς οὖσιν
  choice: ndị nọ
  rationale: Nke a na-asụgharị participle nke εἰμί n'ụzọ dị mkpirikpi ma kwekọọ n'usoro Igbo.
- source_word: '[ἐν Ἐφέσῳ]'
  choice: '[n''Efesọ]'
  rationale: E debere okwu ndị a n'ime braket iji gosi na ihe akaebe odide oge ochie banyere ha adịghị otu.
- source_word: πιστοῖς
  choice: ndị kwesịkwara ntụkwasị obi
  rationale: πιστός nwere ike ịpụta ndị kwesịrị ntụkwasị obi ma ọ bụ ndị kwere ekwe. Nhọrọ a na-echekwa nghọta adjectival nke ikwesị ntụkwasị obi, ebe e debere nhọrọ ọzọ n'ala peeji.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n'ime Mesaịa Jizọs
  rationale: “N'ime” na-echekwa njikọ ἐν nke na-egosi ịdị n'otu na mmekọrịta ya na Mesaịa Jizọs, kama ime ka ọ bụrụ naanị nkwenye banyere ya.
theological_decisions:
- issue: Otu e si asụgharị Χριστός n'ekele mmalite Pọl
  choice: Mesaịa
  alternative: Kraịst
  rationale: N'ebe a Χριστός ka pụtara utu aha nke Jizọs dị ka Onye E Tere Mmanụ; “Mesaịa” na-eme ka utu aha ahụ pụta ìhè.
- issue: Ọnọdụ okwu ἐν Ἐφέσῳ
  choice: E debere “n'Efesọ” n'ime braket ma tinye akara ala peeji [a]
  alternative: Ịhapụ “n'Efesọ” kpamkpam
  rationale: Ụfọdụ odide oge ochie dị mkpa enweghị okwu ndị a. Braket na ala peeji na-egosi ejighị n'aka ahụ n'emeghị mkpebi zoro ezo.
- issue: Ihe πιστοῖς pụtara
  choice: ndị kwesịkwara ntụkwasị obi
  alternative: ndị kwere ekwe
  rationale: Okwu Grik ahụ nwere nghọta abụọ. Isi ederede na-echekwa echiche nke ikwesị ntụkwasị obi, ebe ala peeji na-egosi na ọ pụkwara ịkpọ ndị kwere ekwe.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugwu ma dị mfe nghọta. E ji “Pọl,” “Jizọs,” “Mesaịa,” na “Efesọ” mee ntụgharị mkpụrụokwu dabara n'usoro Igbo. A gbanwere usoro adreesị Grik ka ọ bụrụ “na-edegara” iji mee ka ahịrịokwu ahụ bụrụ Igbo eke, n'enweghị ịgbakwunye onye nnata ọhụrụ. Akara ala peeji niile dị n'isi ederede.
