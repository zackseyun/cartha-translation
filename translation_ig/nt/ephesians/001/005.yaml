id: EPH.1.5
reference: Ephesians 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: προορίσας ἡμᾶς εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ εἰς αὐτόν, κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/005.yaml
  text: having predestined us for adoption through Jesus the Messiah to himself[a], according to the good pleasure of his will[c][b],
translation:
  language: ig
  text: ebe o burula ụzọ kpebie na ọ ga-anabata anyị ka anyị bụrụ ụmụ ya[a] site n'aka Jizọs bụ́ Mesaịa[b], maka onwe ya[c], dị ka ezi ọchịchọ nke uche ya si dị,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka anyị bụrụ ụmụ nwoke ya.” Okwu Grik a na-ekwu kpọmkwem banyere ịnabata mmadụ n'ọnọdụ nwa nwoke, karịsịa ọnọdụ iwu na ikike onye nketa.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “site n'aka Jizọs Kraịst.” “Mesaịa” bụ nsụgharị utu aha Grik bụ́ Christos.
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsị, “n'ebe ọ nọ.” Nkebiokwu Grik ahụ nwere ike igosi ma ntụziaka n'ebe ọ nọ ma nzube maka onwe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: προορίσας
  choice: ebe o burula ụzọ kpebie
  rationale: Nke a na-edobe ụdị participle ahụ na echiche nke ikpebi ihe tupu oge eruo, n'etinyeghị nkọwa otu òtù okpukpe n'okwu ahụ.
- source_word: εἰς υἱοθεσίαν
  choice: na ọ ga-anabata anyị dị ka ụmụ ya
  rationale: N'Igbo nke oge a, nke a na-ekwupụta nnabata mmadụ n'ọnọdụ nwa n'ụzọ doro anya. Ihe odide ala peeji na-edobe echiche Grik banyere ọnọdụ nwa nwoke na onye nketa.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: site n'aka Jizọs bụ́ Mesaịa
  rationale: “Site n'aka” na-egosi ụzọ ma ọ bụ onye e ji mee ya; “Mesaịa” na-asụgharị Χριστός dị ka utu aha.
- source_word: εἰς αὐτόν
  choice: maka onwe ya
  rationale: Nke a na-egosi nzube ahụ n'Igbo dị mfe, ma ihe odide ala peeji na-edobe nghọta ọzọ nke ntụziaka, “nye onwe ya.”
- source_word: κατὰ τὴν εὐδοκίαν
  choice: dị ka ezi mmasị ... si dị
  rationale: Nke a na-egosi na ihe ahụ kwekọrọ n'ihe dị Chineke mma na nzube ọma ya.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: nke uche ya
  rationale: “Uche ya” bụ ụzọ ebumpụta ụwa e si ekwu ihe mmadụ kpebiri ma ọ bụ chọrọ n'Igbo, n'emeghị ka okwu ahụ bụrụ nkọwa sara mbara banyere nzube.
theological_decisions:
- issue: Ihe προορίσας pụtara n'okwu a na-arụrịta ụka n'ihe ọmụmụ okwukwe
  choice: o burula ụzọ kpebie
  alternative: o kara aka họpụta
  rationale: Nhọrọ a na-edobe echiche nke mkpebi e mere tupu oge eruo, ma ọ naghị ebubata usoro nkọwa okpukpe zuru ezu nke amaokwu ahụ n'onwe ya na-ekwughị.
- issue: Echiche metụtara nwoke na ọnọdụ onye nketa dị na υἱοθεσία
  choice: anabata anyị dị ka ụmụ ya, tinyere nkọwa ala peeji
  alternative: mee ka anyị bụrụ ụmụ nwoke ya
  rationale: Isi okwu ahụ na-ada nke ọma n'Igbo ma na-emetụta ndị kwere ekwe niile; nkọwa ala peeji na-echekwa ihe dị n'okwu Grik banyere ọnọdụ nwa nwoke na ikike nketa.
- issue: Utu aha Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: Χριστός bụ utu aha n'ebe a; “Mesaịa” na-eme ka ihe utu aha ahụ pụtara pụta ìhè.
- issue: Mgbagwoju anya dị na εἰς αὐτόν
  choice: maka onwe ya
  alternative: nye onwe ya
  rationale: Grik ahụ nwere ike igosi nzube ma ọ bụ ntụziaka. A họọrọ okwu Igbo nke na-ada nke ọma, ebe nkọwa ala peeji na-echekwa nhọrọ nke ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke kwụ ọtọ ma dị nsọ, dee ya. E debere amaokwu ahụ dị ka nkebiokwu participle na-aga n'ihu n'ahịrịokwu ogologo nke Efesọs 1:3–14. “Jizọs bụ́ Mesaịa” na-eme ka utu aha ahụ doo anya; e jiri nkọwa ala peeji chekwaa nghọta ndị ọzọ na ihe gbasara ọnọdụ nwa nwoke na onye nketa.
