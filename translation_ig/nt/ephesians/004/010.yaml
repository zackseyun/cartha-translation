base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/010.yaml
  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: ig
  text: Onye ahụ rịdatara bụkwa otu onye ahụ rịgoro n'elu eluigwe niile[a], ka o wee mejupụta ihe niile.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n'ebe dị elu karịa eluigwe niile.” Nkebi okwu a nwere ike imesi ịdị elu ya karịa mpaghara eluigwe niile ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ka o wee mezuo ihe niile.” N'ọnọdụ ụfọdụ, ngwaa Grik a nwere ike ịpụta “mezuo,” ma “mejupụta” dabara nke ọma n'ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: Onye ahụ rịdatara
  rationale: Nkebi a bụ participle nwere article nke na-arụ ọrụ dịka aha; ntụgharị a na-egosi ya n'Igbo dị mfe dịka ‘onye ahụ rịdatara.’
- source_word: αὐτός ἐστιν καὶ
  choice: bụkwa ya onwe ya bụ
  rationale: ‘Ya onwe ya’ na-echekwa nkwusi ike nke αὐτός, ebe ‘kwa’ na-egosi na otu onye ahụ bụkwa onye rịgoro.
- source_word: ὁ ἀναβὰς
  choice: onye ahụ rịgoro
  rationale: A tụgharịrị ya n'otu usoro ahụ e ji tụgharịa ὁ καταβὰς, iji chekwaa myirịta dị n'ahịrịokwu Grik.
- source_word: ὑπεράνω πάντων τῶν οὐρανῶν
  choice: n'ebe dị elu karịa eluigwe niile
  rationale: Nke a na-egosi ma ịdị n'elu ma ịdị elu karịrị mpaghara eluigwe niile, ma na-echekwa ọtụtụ nke οὐρανῶν dịka ‘eluigwe niile.’
- source_word: ἵνα
  choice: ka o wee
  rationale: Nkebi a na-egosi ebumnuche n'Igbo nkịtị ma dị ugwu.
- source_word: πληρώσῃ
  choice: jupụta
  rationale: ‘Jupụta’ kacha kwekọọ na echiche nke ime ka ihe niile juputa ma ọ bụ ịbanye n'ime ha n'ọnọdụ a; e debere ‘mezuo’ dịka nhọrọ ọzọ na nkọwa ala peeji.
- source_word: τὰ πάντα
  choice: ihe niile
  rationale: Nke a na-echekwa obosara na enweghị mmachi nke okwu Grik, n'emeghị ka ọ bụrụ naanị mmadụ ma ọ bụ kọwaa ya kpọmkwem dịka eluigwe na ụwa.
theological_decisions:
- issue: Onye okwu ‘onye rịdatara’ na ‘onye rịgoro’ na-ezo aka na ya
  choice: E gosiri nke ọma na ha abụọ bụ otu onye ahụ site n'okwu ‘bụkwa ya onwe ya.’
  alternative: Ịsị naanị ‘bụkwa onye rịgoro,’ nke ga-eme ka nkwusi ike ahụ daa mbà.
  rationale: αὐτός na nkebi participle abụọ nwere article na-emesi njirimara otu onye ahụ ike; ntụgharị ahụ na-echekwa nkwusi ike a n'etinyeghị nkọwa ozizi ọzọ.
- issue: Oke ihe τὰ πάντα gụnyere
  choice: ihe niile
  alternative: mmadụ niile; eluigwe na ụwa dum
  rationale: Okwu Grik ahụ sara mbara. ‘Ihe niile’ na-echekwa obosara na esemokwu nkọwa ya kama igbochi ya n'otu ụdị ihe.
- issue: Ihe πληρώσῃ pụtara
  choice: jupụta
  alternative: mezuo
  rationale: N'ọnọdụ ozugbo a, ‘jupụta’ dabara nke ọma, ma e kwetara na ngwaa Grik ahụ nwekwara ike ịpụta ‘mezuo’ n'ọnọdụ ụfọdụ; ya mere e debere nke ahụ n'ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. E chekwara usoro myirịta nke ‘onye ahụ rịdatara/onye ahụ rịgoro,’ nkwusi ike nke αὐτός, ọtụtụ nke ‘eluigwe,’ na obosara nke ‘ihe niile.’ Akara ala peeji [a] na [b] pụtara n'isiokwu ahụ, n'usoro kwekọrọ na nkọwa ha.
