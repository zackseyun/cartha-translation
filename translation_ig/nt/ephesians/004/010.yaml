    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ka o wee mezuo ihe niile.” N'ọnọdụ ụfọdụ, ngwaa Grik a nwere ike ịpụta “mezuo,” ma “mejupụta” dabara nke ọma n'ọnọdụ a.
    reason: lexical_alternative
