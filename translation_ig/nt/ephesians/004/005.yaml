translation:
  language: ig
  text: otu Onyenweanyị, otu okwukwe[a], otu baptizim;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị πίστiς dịka “ntụkwasị obi” ma ọ bụ “ikwesị ntụkwasị obi”; ma “okwukwe” kacha daba n’ịdị n’otu nke a na-emesi ike n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: otu
  rationale: Ụdị atọ a kwekọrọ n’ụdị okike aha ndị ha na-akọwa n’asụsụ Grik. Otu okwu Igbo bụ “otu” ka e ji sụgharịa ha niile iji chekwaa nkwughachi na nkwado e mesiri ike n’amaokwu ahụ.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: “Onyenwe anyị” bụ aha nsọpụrụ a na-ejikarị akọwa κύριος n’Igbo. N’usoro Efesọs 4:4–6, ọ kacha yie ka ọ na-ezo aka n’ebe Kraịst nọ, ọ bụghị naanị “nna ukwu.”
- source_word: πίστις
  choice: okwukwe
  rationale: “Okwukwe” dabara nke ọma n’echiche nke okwukwe ma ọ bụ nkwenye nke ndị kwere ekwe nwekọrọ ọnụ, nke na-akwado isiokwu ịdị n’otu n’ebe a.
- source_word: βάπτισμα
  choice: baptizim
  rationale: “Baptizim” bụ okwu a maara nke ọma maka emume βάπτισμα; ọ na-echekwa nkọwa okwu ahụ n’etinyeghị ụzọ e si eme ya ma ọ bụ ozizi otu ụka banyere ihe ọ na-arụ.
theological_decisions:
- issue: Onye “Onyenwe anyị” na-ezo aka na ya
  choice: E debere “Onyenwe anyị” dịka aha nsọpụrụ, nke kacha yie ka ọ na-ezo aka na Jizọs Kraịst n’usoro Efesọs 4:4–6.
  alternative: Ọ pụrụ ịbụ aha na-ezo aka n’ebe Chineke nọ n’ozuzu ya.
  rationale: Usoro ahụ kwuru banyere otu Mmụọ n’amaokwu 4, otu Onyenwe anyị n’amaokwu 5, na otu Chineke na Nna n’amaokwu 6. Nke a na-akwado ntụaka n’ebe Ọkpara nọ, ma nsụgharị ahụ etinyeghị aha “Jizọs” nke na-adịghị kpọmkwem n’ederede.
- issue: Ihe “otu baptizim” pụtara
  choice: A sụgharịrị ya n’enweghị ịkọwa ụzọ e si eme baptizim, ike ma ọ bụ mmetụta ya, ma ọ bụ ma ihe e mesiri ike ọ̀ bụ emume ahụ n’onwe ya.
  alternative: Ọ pụrụ ịbụ baptizim dịka sakrament, ma ọ bụ baptizim ime mmụọ/metafọ.
  rationale: Amaokwu ahụ na-ekwusi ike na e nwere ịdị n’otu, ma ọ naghị edozi esemokwu ụka dị iche iche gbasara ozizi baptizim.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mkpirikpi ma dị ùgwù. E chekwara usoro ahịrịokwu Grik na nkwughachi “otu” ugboro atọ. E tinyere akara ntụaka [a] ozugbo n’akụkụ “okwukwe.”
