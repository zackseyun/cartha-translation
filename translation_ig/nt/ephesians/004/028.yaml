  to: Ka onye na-ezu ohi gharazie izu ohi; kama, ka ọ rụsie ọrụ ike, na-eji aka ya arụ ezi ọrụ[a], ka o wee nwee ihe ọ ga-eji soro onye nọ ná mkpa kerịta[b].
