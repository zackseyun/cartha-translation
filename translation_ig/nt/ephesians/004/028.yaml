id: EPH.4.28
reference: Ephesians 4:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ⸂ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν⸃, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/028.yaml
  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: ig
  text: Ka onye na-ezu ohi gharazie izu ohi; kama, ka ọ rụsie ọrụ ike, na-eji aka ya arụ ezi ọrụ[a], ka o wee nwee ihe ọ ga-eji soro onye nọ ná mkpa kerịta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-arụ ihe dị mma.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye nwere mkpa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κλέπτων
  choice: onye na-ezu ohi
  rationale: Nkebi a na-arụ ọrụ dị ka aha ma na-egosi onye omume izu ohi ji mara; nsụgharị a na-echekwa ọdịdị omume na-aga n’ihu n’etinyeghị onye ahụ n’aha na-adịgide adịgide dịka “onye ohi.”
- source_word: μηκέτι κλεπτέτω
  choice: ka ... gharazie izu ohi
  rationale: “Gharazie” na-egosi ịkwụsị omume e mere na mbụ, ebe usoro “ka ...” na-ebute iwu onye nke atọ n’ụzọ Igbo dị ndụ ma doo anya.
- source_word: μᾶλλον δὲ
  choice: kama
  rationale: Ọ na-egosipụta mgbanwe siri ike site n’izu ohi gaa n’omume kwesịrị ekwesị nke e nyere n’iwu.
- source_word: κοπιάτω
  choice: ka ọ rụsịsie ọrụ ike
  rationale: Nke a na-egosipụta ma ike iwu ahụ ma echiche nke ịrụ ọrụ na mgbalị siri ike, nke κοπιάω nwere.
- source_word: ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν
  choice: na-eji aka ya arụ ezi ọrụ
  rationale: 'Nkebi a kọwara otú ọ ga-esi rụsie ọrụ ike: ọrụ aka nke ya, nke dị mma ma baa uru. “Ezi ọrụ” dabara n’Igbo ma na-echekwa njikọ dị n’etiti ọrụ na τὸ ἀγαθόν; ọdịdị sara mbara “ihe dị mma” dị n’ala peeji.'
- source_word: ἵνα ἔχῃ
  choice: ka o wee nwee ihe
  rationale: “Ka o wee” na-egosipụta ebumnuche; “ihe” bụ mmeju dị mkpa n’Igbo nke ihe omume ịkerịta na-esote na-eme ka o doo anya.
- source_word: μεταδιδόναι
  choice: ọ ga-eji ... kerịta
  rationale: “Kerịta” na-egosi inye onye ọzọ òkè n’ihe mmadụ nwere, ọ bụghị nanị inyefe ihe.
- source_word: τῷ χρείαν ἔχοντι
  choice: onye nọ ná mkpa
  rationale: Nke a bụ okwu Igbo dị mfe ma bụrụ nke a na-ejikarị akọwa onye nwere mkpa; nsụgharị nke na-arapara nso n’usoro Grik dị n’ala peeji.
theological_decisions:
- issue: Ebumnuche omume ọma nke ịrụ ọrụ
  choice: A kọwara ọrụ ezi omume dị ka ihe ga-anọchi izu ohi, ebumnuche ya gụnyere inwe ihe a ga-ekerịta onye nọ ná mkpa.
  alternative: Ilekwasị anya naanị n’ịkwado onwe onye ma ọ bụ n’ịkwụghachi ihe e zuru.
  rationale: Nkebi ebumnuche ἵνα na-ekwu kpọmkwem na ihe a ga-enweta site n’ọrụ bụ maka ịkerịta onye nwere mkpa. Nsụgharị ahụ anaghị etinye echiche nkwenkwe ọzọ na-adịghị n’amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro “ka ... gharazie” na “ka ọ ...” na-ebute iwu onye nke atọ n’ụzọ ebumpụta ụwa; “soro ... kerịta” na-eme ka echiche inye onye ọzọ òkè pụta ìhè.
