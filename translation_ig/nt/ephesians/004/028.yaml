    issue: 'Nonstandard verbal form: ''rụsịsie ọrụ ike.'''
    rationale: The idiomatic Standard Igbo expression is 'rụsie ọrụ ike' ('work/labor hard'). The draft's form has an unnecessary extra 'sị' and should be corrected for natural, grammatical usage.
