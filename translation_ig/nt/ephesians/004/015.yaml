revisions:
- from: Kama, n'ikwu eziokwu n'ịhụnanya[a], ka anyị too n'ụzọ niile[b] banye n'ime ya, onye bụ isi, ya bụ Mesaịa[c].
  to: Kama, n'ikwu eziokwu n'ịhụnanya[a], ka anyị too n'akụkụ niile[b] ruo n'ime ya, onye bụ isi, bụ Mesaịa[c].
  rationale: The revision keeps all source elements and the audit trail’s lexical alternatives, while correcting the Igbo attachment of the directional phrase to “grow.” It also improves the naturalness of the conduct-related alternative in footnote a. No doctrinal interpretation has been added.
