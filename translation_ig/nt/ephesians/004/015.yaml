  text: ἀληθεύοντες δὲ ἐν ἀγάπῃ αὐξήσωμεν εἰς αὐτὸν τὰ πάντα, ὅς ἐστιν ἡ κεφαλή, ⸀Χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/015.yaml
  text: but speaking truth in love[a], let us grow in every way into him who is the head, Messiah[c][b],
translation:
  language: ig
  text: Kama, n'ikwu eziokwu n'ịhụnanya[a], ka anyị too n'akụkụ niile[b] ruo n'ime ya, onye bụ isi, bụ Mesaịa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ịdị ndụ n'eziokwu” ma ọ bụ “ime eziokwu.” Ngwaa Grik ahụ nwere ike ịgụnye ma ikwu eziokwu ma ibi ndụ n'eziokwu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “n'ihe niile”; ma ọ bụrụ na a sụgharịa ya nnọọ dịka okwu Grik si dị, ọ bụ “ihe niile.”
    reason: lexical_alternative
  - marker: c
    text: 'Grik: “Kraịst.” N''ebe a, a sụgharịrị ya “Mesaịa” n''ihi na okwu ahụ na-arụ ọrụ dị ka aha-ọkwa.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀληθεύοντες
  choice: n'ikwu eziokwu
  rationale: Nkebi a na-enye Igbo dị mfe ma kwekọọ n'ọnọdụ gbara amaokwu ahụ gburugburu, ebe a na-ekwu maka ozizi ụgha na aghụghọ. Nkọwa ala peeji na-echekwa nghọta sara mbara nke ibi ndụ n'eziokwu.
- source_word: δὲ
  choice: Kama
  rationale: Ọ na-egosi ọdịiche dị nwayọọ n'etiti aghụghọ na enweghị nkwụsi ike e kwuru n'amaokwu gara aga na ụzọ kwesịrị ekwesị e kwuru ebe a.
- source_word: ἐν ἀγάπῃ
  choice: n'ịhụnanya
  rationale: Ọ na-echekwa ma echiche nke ụzọ e si eme ihe ma nke ọnọdụ ịhụnanya, n'Igbo dị mkpirikpi ma bụrụkwa nke nkịtị.
- source_word: αὐξήσωμεν
  choice: ka anyị too
  rationale: Ụdị subjunctive onye mbụ n'ọnụọgụ ọtụtụ bụ agbamume; ‘ka anyị too’ na-egosipụta nke ahụ nke ọma n'Igbo.
- source_word: εἰς αὐτὸν
  choice: banye n'ime ya
  rationale: Ọ na-echekwa ntụziaka dị na εἰς na ihe atụ nke uto na-eduga n'ime Mesaịa, kama ime ka ọ bụrụ naanị ‘ruo ya.’
- source_word: τὰ πάντα
  choice: n'ụzọ niile
  rationale: N'okwu gbasara uto, nke a na-egosi uto zuru oke n'akụkụ niile. Nkọwa ala peeji na-echekwa ntụgharị nke dị nso n'usoro okwu Grik.
- source_word: κεφαλή
  choice: isi
  rationale: Nke a bụ ntụgharị kpọmkwem nke na-echekwa ihe atụ nke ahụ, na-enweghị ikpebi ma okwu ahụ pụtara isi mmalite, onye ọchịchị, ma ọ bụ nghọta ọzọ.
- source_word: Χριστός
  choice: Mesaịa
  rationale: N'ebe a, okwu ahụ sochiri ‘isi’ dị ka aha-ọkwa; ‘Mesaịa’ na-egosipụta ọrụ ya dị ka aha-ọkwa karịa ime ya naanị aha mmadụ.
theological_decisions:
- issue: Oke nghọta nke ἀληθεύοντες
  choice: E tinyere ‘n'ikwu eziokwu’ n'ahịrị bụ isi.
  alternative: ‘ịbụ onye eziokwu’ ma ọ bụ ‘ime eziokwu’
  rationale: Ọnọdụ gbara ya gburugburu na-elekwasị anya n'ozizi ụgha na aghụghọ, ya mere okwu ọnụ bụ nghọta doro anya; ma nkọwa ala peeji na-echekwa na ngwaa Grik nwekwara ike ịgụnye omume na ndụ eziokwu.
- issue: Ike nkọwa nke κεφαλή
  choice: A sụgharịrị ya naanị ‘isi.’
  alternative: ‘isi mmalite’ ma ọ bụ ‘onye nwere ikike n'elu’
  rationale: Nke a na-echekwa ihe atụ Pọl ji mee ihe, na-enweghị itinye nkọwa ụka ma ọ bụ ozizi pụrụ iche nke okwu Grik n'onwe ya ekpebighị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ihe atụ nke ito banye n'ime Mesaịa na nke Mesaịa ịbụ isi, ma zere ịkọwa ihe atụ ahụ n'ụzọ otu ụka ma ọ bụ otu ozizi pụrụ iche.
