  text: and do not give place to the devil[a].
translation:
  language: ig
  text: Enyekwala ekwensu ohere[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe”; n’ụzọ nkịtị, Grik sịrị, “enyekwala ekwensu ebe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: Unyekwala
  rationale: N'okwu ndị gbara ya gburugburu, μηδὲ na-aga n'ihu n'usoro ndụmọdụ ahụ. Mgbakwunye -kwa na nkwusioru ‘enyela’ na-egosipụta ma njikọ ahụ ma iwu ahụ n'Igbo nkịtị.
- source_word: δίδοτε
  choice: nye
  rationale: δίδωμι pụtara ‘inye.’ E debere ngwaa a kama iji okwu ga-akọwa ihe karịrị ihe Grik kwuru.
- source_word: τόπον
  choice: ohere
  rationale: Ọ bụ ezie na τόπος pụtara ‘ebe’ n'ụzọ nkịtị, n'usoro okwu a ọ na-egosi ohere ma ọ bụ ọnọdụ e nyere onye ka o mee ihe. ‘Ohere’ na-eme ka echiche ahụ doo anya n'Igbo nke oge a, ebe nkọwa ala peeji na-echekwa ihe okwu Grik ahụ pụtara n'ụzọ nkịtị.
- source_word: τῷ διαβόλῳ
  choice: ekwensu
  rationale: N'ebe a, διάβολος nwere edemede ma na-arụ ọrụ dị ka aha onye iro ahụ. ‘Ekwensu’ bụ okwu Igbo a na-aghọta nke ọma maka onye ahụ, ọ bụghị naanị onye na-ekwutọ mmadụ.
theological_decisions:
- issue: Ma διάβολος ọ̀ bụ aha nkịtị maka ‘onye nkwutọ’ ka ọ̀ na-ezo aka n'onye ọjọọ ahụ kpọmkwem
  choice: ekwensu
  alternative: onye nkwutọ
  rationale: N'ọdụmọdụ Pọl n'ebe a, okwu ahụ yikarịrị ka ọ na-ezo aka n'onye iro ahụ kpọmkwem. Nsụgharị ‘ekwensu’ na-egosipụta onye okwu ahụ na-ezo aka n'etinyeghị nkọwa ọzọ n'ime amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. ‘Unyekwala’ na-ejikọta amaokwu a na ndụmọdụ bu ya ụzọ ma na-egosipụta iwu mgbochi n'ụzọ nkịtị.
