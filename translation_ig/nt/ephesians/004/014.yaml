  verdict: revise
  source_fidelity: Ihe odide ahụ na-echekwa nzube nke ἵνα, ọnọdụ ‘ọ bụghịzi’ nke μηκέτι, na ihe oyiyi ebili mmiri na ifufe nke ọma. Otú ọ dị, ‘iduhie mmadụ’ na-atụgharị πλάνη n’ụzọ dị warara karịa okwu Grik ahụ, ma tinye ‘mmadụ’ nke na-adịghị kpọmkwem n’akụkụ ikpeazụ. Ekwesịrị ikwe ka ‘njehie/nduhie’ nọgide bụrụ okwu nwere mgbagwoju anya.
  naturalness: ‘Ka anyị ghara ịbụzi’ na ‘ifufe ọ bụla nke ozizi’ dịkwuo eke ma doo anya n’Igbo ọkọlọtọ karịa usoro okwu dị na draft. ‘Akọ ọjọọ’ na-enye olu ọjọọ nke πανουργία n’enweghị ịkpọ ya naanị ‘amamihe.’
  terminology: ‘Ozizi’ dabara διδασκαλία. ‘Aghụghọ mmadụ’ dabara κυβεία τῶν ἀνθρώπων, na ndetu ala ya na-echekwa oyiyi ịgba daịs. A gbanwere ‘iduhie mmadụ’ ka ọ bụrụ ‘njehie’ n’ederede isi, ebe ndetu ala na-edobe ‘nduhie’ dịka ụzọ ọzọ a pụrụ isi ghọta πλάνη.
