id: EPH.4.14
reference: Ephesians 4:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/014.yaml
  text: so that we may no longer be children[a], tossed by waves and carried about by every wind of teaching, by human trickery, by craftiness in the scheming of error[c][b],
translation:
  language: ig
  text: ka anyị ghara ịbụzi ụmụntakịrị, ndị ebili mmiri na-ebugharị, ndị ifufe ọ bụla nke ozizi na-ebugharị ebe niile, site n’aghụghọ mmadụ[a], sitekwa n’akọ ọjọọ e ji eme atụmatụ nke njehie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, ‘n’ịgba daịs nke mmadụ’; ọ bụ ihe oyiyi nke aghụghọ ma ọ bụ ịghọgbu mmadụ.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụ ya, “maka atụmatụ nke njehie,” ma ọ bụ “maka atụmatụ nduhie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν
  choice: ka anyị gharakwa ịbụ
  rationale: “Ka” na-egosi nzube ma ọ bụ ihe a na-atụ anya ya n’okwu gara aga; “gharaghịkwa” na-echekwa echiche nke μηκέτι, ‘ọ bụghịzi ọzọ.’
- source_word: νήπιοι
  choice: ụmụntakịrị
  rationale: Ọ bụ ihe atụ nke enweghị ntozu; “ụmụntakịrị” bụ okwu Igbo doro anya ma dịkwa nkịtị.
- source_word: κλυδωνιζόμενοι
  choice: ndị ebili mmiri na-ebugharị
  rationale: Nke a na-echekwa ihe oyiyi nke mmadụ ebili mmiri na-amagharị, kama iwepụ ihe oyiyi mmiri dị n’asụsụ Grik.
- source_word: περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: ndị ifufe ozizi ọ bụla na-ebugharịkwa ebe niile
  rationale: Ọ na-echekwa ọnọdụ nnabata nke ngwaa ahụ na ihe oyiyi nke ifufe; “ozizi” bụ okwu dị ugbu a ma ghara ime διδασκαλία ka ọ bụrụ naanị usoro nkwenkwe e guzobere.
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: site n’aghụghọ mmadụ
  rationale: κυβεία sitere n’oyiyi ịgba daịs n’ụzọ aghụghọ, ma n’ebe a ọ pụtara aghụghọ mmadụ na-eji duhie ndị ọzọ.
- source_word: ἐν πανουργίᾳ
  choice: sitekwa n’amamihe ọjọọ
  rationale: πανουργία bụ akọ ma ọ bụ amamihe a na-eji eme ihe ọjọọ; nkọwa a na-eme ka ụda omume ọjọọ nke okwu ahụ doo anya.
- source_word: πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: e ji akpa nkata nke iduhie mmadụ
  rationale: “Akpa nkata” na-egosi usoro a kpachara anya hazie; “iduhie mmadụ” na-ahapụ πλάνη ka ọ metụta ma njehie ma omume aghụghọ, n’enweghị ịkọwa ya oke.
theological_decisions:
- issue: Ntụgharị διδασκαλία
  choice: ozizi
  alternative: nkuzi; usoro nkwenkwe
  rationale: “Ozizi” na-ekpuchi nkuzi ma ọ bụ ihe a na-akụzi n’ozuzu ya, n’enweghị ime ka okwu ahụ bụrụ naanị nkà mmụta okpukpe e guzobere.
- issue: Ntụgharị πλάνη
  choice: iduhie mmadụ
  alternative: njehie; aghụghọ
  rationale: πλάνη nwere ike ịpụta ịkpafu, njehie, ma ọ bụ nduhie. N’ọnọdụ a, κυβεία na πανουργία na-egosi aghụghọ mmadụ kpachara anya, ma e kwesịghị ikwu na okwu ahụ pụtara naanị njehie na-amaghị ama.
- issue: Njikọ πρὸς na μεθοδεία
  choice: e ji akpa nkata nke iduhie mmadụ
  alternative: na nkata nke njehie; iji duba n’atụmatụ aghụghọ
  rationale: Akụkụ Grik ahụ siri ike ma gbakọọ ọnụ. Nhọrọ a na-egosi nzube/usoro aghụghọ ahụ n’Igbo nkịtị, ma ndetu ala na-echekwa ụzọ ọzọ e nwere ike isi ghọta ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E debere ihe oyiyi ebili mmiri na ifufe, ma a kọwara oyiyi ịgba daịs n’ala peeji ka amaokwu ahụ ghara ịdị arọ ma ọ bụ bụrụ ihe na-edoghị onye na-agụ anya.
