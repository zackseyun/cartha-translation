source:
  edition: SBLGNT
  text: ⸀ἐσκοτωμένοι τῇ διανοίᾳ ὄντες, ἀπηλλοτριωμένοι τῆς ζωῆς τοῦ θεοῦ, διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς, διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/018.yaml
  text: being darkened in their understanding[a], alienated from the life of God because of the ignorance that is in them, because of the hardness of their hearts[e][d][c][b],
translation:
  language: ig
  text: e meela ka nghọta ha[a] gbaa ọchịchịrị; e kewapụkwala ha na ndụ Chineke[b][c] n’ihi amaghị ihe dị n’ime ha, n’ihi isi ike nke obi ha[e][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “uche ha” kama “nghọta ha” (διανοίᾳ).
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “e meela ka ha ghara iso ná ndụ Chineke.”
    reason: lexical_alternative
  - marker: c
    text: “Ndụ Chineke” nwere ike ịpụta ndụ nke Chineke nwe, ma ọ bụ ndụ nke si n’aka Chineke.
    reason: alternative_reading
  - marker: d
    text: Okwu Grik πώρωσις nwere ike ịpụta isi ike ma ọ bụ enweghịzi mmetụta.
    reason: lexical_alternative
  - marker: e
    text: Na Grik, “obi” dị n’otu, ọ bụ ezie na “ha” na-ezo aka n’ọtụtụ mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκοτωμένοι
  choice: e meela ka … gbaa ọchịchịrị
  rationale: Okwu a bụ participle zuru oke nke dị n’olu nnata, na-egosi ọnọdụ sitere n’ihe e mere ha. Nsụgharị a na-echekwa ma echiche nke ime ka ihe gbaa ọchịchịrị ma ọnọdụ na-adịgide ugbu a.
- source_word: τῇ διανοίᾳ
  choice: nghọta ha
  rationale: “Nghọta” na-egosi ikike mmadụ nwere ịghọta ihe nke ọma, ma ọ dabara n’ebe a karịa okwu sara mbara dịka “uche.”
- source_word: ἀπηλλοτριωμένοι
  choice: e kewapụkwala ha
  rationale: Nke a na-egosi na ha nọ n’ọnọdụ nkewapụ ma ọ bụ ịbụ ndị e mere ndị ọbịa; ọ naghị akpọchi ihe okwu ahụ pụtara naanị n’ụzọ iwu.
- source_word: τῆς ζωῆς τοῦ θεοῦ
  choice: na ndụ Chineke
  rationale: “Ndụ Chineke” na-echekwa genitive Grik ahụ n’enweghị ikpebi ma ọ bụ ndụ nke Chineke nwe ma ọ bụ ndụ nke si n’aka Chineke.
- source_word: διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς
  choice: n’ihi amaghị ihe dị n’ime ha
  rationale: Nke a na-egosi ihe kpatara ọnọdụ ahụ ma na-echekwa na amaghị ihe ahụ dị n’ime ha.
- source_word: διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν
  choice: n’ihi na obi ha akpọọla nkụ
  rationale: Akpaalaokwu Igbo a na-egosi obi nke na-adịghịzi anabata mmetụta ma ọ bụ eziokwu. Ọ na-ezere “obi siri ike,” nke nwekwara ike ịpụta obi ike ma ọ bụ mkpebi siri ike.
theological_decisions:
- issue: Ihe “ndụ Chineke” pụtara
  choice: E debere ya dịka “ndụ Chineke.”
  alternative: “ndụ nke si n’aka Chineke” ma ọ bụ “ndụ Chineke n’onwe ya”
  rationale: Genitive Grik ahụ nwere ike ịpụta ndụ nke Chineke nwe ma ọ bụ ndụ nke na-abịa site n’aka Chineke; nsụgharị ahụ ekwesịghị ịhọrọ otu n’ime ha n’enweghị mkpa.
- issue: “Obi” dị n’otu n’agbanyeghị na ọ na-ekwu maka ọtụtụ mmadụ
  choice: “obi ha”
  alternative: Ịkọwa ya kpọmkwem dịka obi onye ọ bụla n’ime ha
  rationale: καρδίας dị n’otu na Grik. “Obi ha” bụkwa ụzọ Igbo si ekwu ya nke ọma, ma ọ pụrụ ịrụ ọrụ dịka mkpokọta n’enweghị ime ka okwu ahụ sie ike.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta. E ji semicolon kewaa nkọwa ọnọdụ abụọ ahụ n’ihi na amaokwu a bụ akụkụ nke ahịrịokwu buru ibu. “Obi ha akpọọla nkụ” bụ akpaalaokwu doro anya maka enweghị mmetụta nke ime mmụọ, ma “obi ha” na-echekwa ụdị mkpokọta nke Grik.
