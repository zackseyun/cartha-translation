  text: καὶ μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ, ἐν ᾧ ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/030.yaml
  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: ig
  text: Unu emela ka Mmụọ Nsọ nke Chineke nwee mwute, onye e kaa unu akara n’ime ya maka ụbọchị mgbapụta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ruo ụbọchị mgbapụta.” N’asụsụ Grik, ọ bụ “maka ụbọchị mgbapụta” (εἰς ἡμέραν ἀπολυτρώσεως), nke a pụkwara ịghọta dịka nke na-atụ aka n’ihe ga-eme n’ọdịnihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπεῖτε
  choice: emekwala ... ka o nwee mwute
  rationale: Nkebi a na-egosipụta iwu mgbochi dị na μή na present imperative, ma na-edobekwa echiche nke ime onye ọzọ ka o nwee mwute. Ọ bụ okwu Igbo doro anya nke na-echekwa mmekọrịta onwe-onwe dị n’amaokwu ahụ.
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: Mmụọ Nsọ nke Chineke
  rationale: A hapụrụ aha zuru ezu ahụ dịka o si dị n’asụsụ Grik, gụnyere ‘nke Chineke,’ n’ụdị a na-eji eme ihe n’Igbo.
- source_word: ἐν ᾧ
  choice: n’ime ya
  rationale: Nke a na-echekwa preposition ἐν na ntụaka onye gbasara Mmụọ Nsọ, kama ime ka Mmụọ ahụ bụrụ ihe na-enweghị njirimara onwe onye. Ọ naghị amanye nghọta ‘site n’aka ya,’ nke ga-akọwa agency karịa ka Grik kwuru kpọmkwem.
- source_word: ἐσφραγίσθητε
  choice: e ji kaa unu akara
  rationale: Nke a na-echekwa passive na ihe atụ nke akara e ji egosi njirimara, nwe, ma ọ bụ nchekwa, n’Igbo na-ada nke ọma karịa nsụgharị okwu n’ọkụkọ.
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: maka ụbọchị mgbapụta
  rationale: ‘Maka’ na-echekwa echiche ebumnuche ma ọ bụ ntụgharị uche gaa n’ihu dị na εἰς, n’etinyeghị ya n’ụzọ siri ike dịka naanị oge ga-eru. ‘Ụbọchị mgbapụta’ na-egosi ụbọchị ahụ a maara site n’ọnọdụ okwu.
theological_decisions:
- issue: Ịtụ aka n’ụzọ onwe onye nye Mmụọ Nsọ
  choice: Jiri ‘n’ime ya’
  alternative: n’ime nke ahụ; site n’aka ya
  rationale: Ọ bụ ezie na ụdị nnọchiaha Grik kwekọrọ n’ụdị neuter nke πνεῦμα, Mmụọ Nsọ bụ onye a pụrụ ime ka o nwee mwute. ‘N’ime ya’ na-echekwa ma preposition ahụ ma ntụaka onwe onye ahụ.
- issue: Mmekọrịta akara ahụ na ụbọchị mgbapụta
  choice: ‘maka ụbọchị mgbapụta’
  alternative: ‘ruo ụbọchị mgbapụta’
  rationale: Nke a na-echekwa ike εἰς nke na-atụ aka n’ebumnuche ma ọ bụ n’ọdịnihu, na-enweghị ịmanye nkwubi okwu pụrụ iche gbasara otú akara ahụ si arụ ọrụ ma ọ bụ ogologo oge ọ na-adị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dịkwa mfe nghọta. E ji ‘unu’ chekwaa plural nke ngwaa Grik. A họọrọ ‘emekwala ... ka o nwee mwute’ maka ịdị n’ụzọ mmadụ nkịtị ga-aghọta ya, ebe ‘e ji kaa unu akara’ na-echekwa ihe atụ nke akara n’enweghị nkọwa ozizi agbakwunyere.
