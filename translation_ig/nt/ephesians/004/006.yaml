translation:
  language: ig
  text: otu Chineke, onye bụ Nna nke ha niile[a], onye nọ n'elu ha niile, site na ha niile, nakwa n'ime ha niile.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Nna nke mmadụ niile” ma ọ bụ “Nna nke ihe niile.” N'asụsụ Grik, a kpọghị aha kpọmkwem mgbe e ji “niile” mee ihe ugboro ugboro n'amaokwu a; ya mere, ókè ọ gbasara ka sara mbara.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie na-agụ, “n'ime unu niile.”
    reason: textual_variant
lexical_decisions:
- source_word: εἷς
  choice: otu
  rationale: Na-edobe ọnụ ọgụgụ ahụ e mesiri ike, nke jikọtara amaokwu a na usoro ‘otu’ dị n'amaokwu ndị gbara ya gburugburu.
- source_word: θεὸς
  choice: Chineke
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa θεός n'ọnọdụ a.
- source_word: πατὴρ
  choice: Nna
  rationale: Na-edobe aha mmekọrịta nke Chineke dị ka Nna, kama ime ya echiche nkịtị.
- source_word: πάντων
  choice: mmadụ niile
  rationale: N'okwu Igbo, ‘nke mmadụ niile’ na ‘n'elu mmadụ niile’ dị mfe nghọta ma kwekọọ n'isiokwu banyere ịdị n'otu nke ndị kwere ekwe; ihe odide ala ala na-egosi na Grik ekwughị aha kpọmkwem ma okwu ahụ nwekwara ike ịdị obosara karịa mmadụ.
- source_word: ὁ
  choice: onye
  rationale: ‘Onye’ na-ewebata nkọwa na-esochi banyere otu Chineke ahụ n'ụzọ Igbo sitere n'okike.
- source_word: ἐπὶ πάντων
  choice: nọ n'elu mmadụ niile
  rationale: Na-egosi ịdị elu na ọchịchị Chineke; ‘n'elu’ bụ ntụgharị doro anya nke ἐπί na genitive.
- source_word: διὰ πάντων
  choice: na-arụkwa ọrụ site na mmadụ niile
  rationale: ‘Site na’ na-egosi ụzọ ma ọ bụ onye e ji eme ihe; itinye ‘na-arụ ọrụ’ na-eme ka nkebi ahịrịokwu ahụ bụrụ Igbo doro anya, n'agbanyeghị na ngwaa ahụ dị n'ime echiche Grik kama ide ya kpọmkwem.
- source_word: ἐν πᾶσιν
  choice: nọkwa n'ime mmadụ niile
  rationale: Na-edobe ọdịiche dị n'etiti ‘site na’ na ‘n'ime’ ma na-eme ka usoro nkebi atọ ahụ doo anya n'Igbo.
theological_decisions:
- issue: Ókè πάντων / πᾶσιν ndị e kwughachiri
  choice: E ji ‘mmadụ niile’ mee isi ederede, ma e tinyere nkọwa na Grik ekwughị kpọmkwem mmadụ ma ọ bụ ihe niile.
  alternative: ihe niile; mmadụ niile; ndị kwere ekwe niile
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-ekwu banyere ịdị n'otu nke ndị mmadụ n'ọgbakọ, ya mere ‘mmadụ niile’ bụ Igbo dị mfe ma nwee ike ịbụ ihe a na-ekwu. Ma ihe odide Grik hapụrụ aha ahụ n'ekwughị ya; ya mere ihe odide ala ala na-echekwa ohere na obosara okwu ahụ.
- issue: Ụdị ọgụgụ nke ἐν πᾶσιν
  choice: n'ime mmadụ niile
  alternative: n'ime unu niile
  rationale: SBLGNT na-agụ πᾶσιν, ya mere isi ederede anaghị etinye ‘unu’; a na-edebe ‘n'ime unu niile’ n'ihe odide ala ala dị ka ụdị ọgụgụ ụfọdụ akwụkwọ aka ochie nwere.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro ‘otu Chineke na Nna’ chekwaa nkwupụta ịdị n'otu; e mekwara ka nkebi atọ—n'elu, site na, na n'ime—pụta ìhè. A tinyere akara ihe odide ala ala [a] na [b] n'isi ederede.
