revisions:
- from: E nwere otu ahụ na otu Mmụọ[a], dị nnọọ ka e sikwa kpọọ unu n'otu olileanya nke ọkpụkpọ unu.
  to: E nwere otu ahụ na otu Mmụọ[a], dịka a kpọrọkwa unu n'otu olileanya nke ọkpụkpọ unu.
  rationale: The revision replaces an unnatural impersonal expression with idiomatic Standard Igbo and positions ‘-kwa’ with the calling verb to express Greek καί naturally. It retains the source’s ambiguity regarding πνεῦμα in the footnote and does not add an explicit divine agent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:16:32Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the repeated ‘one,’ ‘body,’ ‘Spirit,’ ‘hope,’ and the calling/hope relationship. However, ‘e sikwa kpọọ unu’ is not the most natural or clear Standard Igbo way to express the Greek passive ‘you also were called.’ ‘a kpọrọ unu’ idiomatically leaves the caller unexpressed, as does the Greek, while ‘dịkwa ka’ directly carries the comparative/additive force of καθὼς καὶ.
  naturalness: The revised wording is smoother in contemporary Standard Igbo. ‘Dịkwa ka a kpọrọ unu’ avoids the awkward impersonal construction ‘e sikwa kpọọ unu’ and preserves the intended connection.
  terminology: ‘ahụ,’ ‘Mmụọ,’ ‘olileanya,’ and ‘ọkpụkpọ’ are suitable. Capitalized ‘Mmụọ’ is a reasonable contextual interpretation, and the footnote properly records the lowercase lexical alternative without treating it as certain.
  issues:
  - severity: medium
    issue: The clause ‘dị nnọọ ka e sikwa kpọọ unu’ is awkward and can obscure the passive/agent-unspecified sense.
    rationale: Greek ἐκλήθητε is a passive, ‘you were called,’ and καθὼς καὶ links this with the preceding unity statements. Standard Igbo ‘dịkwa ka a kpọrọ unu’ is more idiomatic, leaves the agent unnamed, and conveys ‘just as/also.’
  revised_text: E nwere otu ahụ na otu Mmụọ[a], dịka a kpọrọkwa unu n'otu olileanya nke ọkpụkpọ unu.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “otu mmụọ.” Okwu Grik a nwere ike ịpụta “mmụọ” ma ọ bụ “Mmụọ.” N’usoro a nke na-ekwu maka ịdị n’otu, o yikarịrị ka ọ na-ezo aka na Mmụọ Nsọ.
    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural impersonal expression with idiomatic Standard Igbo and positions ‘-kwa’ with the calling verb to express Greek καί naturally. It retains the source’s ambiguity regarding πνεῦμα in the footnote and does not add an explicit divine agent.
