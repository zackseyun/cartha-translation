source:
  edition: SBLGNT
  text: ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: ig
  text: E nwere otu ahụ na otu Mmụọ[a], dịka a kpọrọkwa unu n'otu olileanya nke ọkpụkpọ unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu mmụọ.” Okwu Grik a nwere ike ịpụta “mmụọ” ma ọ bụ “Mmụọ.” N’usoro a nke na-ekwu maka ịdị n’otu, o yikarịrị ka ọ na-ezo aka na Mmụọ Nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν
  choice: otu
  rationale: E ji “otu” meegharị okwu Grik ahụ n’ebe abụọ a iji mesie ịdị n’otu ike.
- source_word: σῶμα
  choice: ahụ
  rationale: Nke a bụ ntụgharị nkịtị nke okwu ahụ ma na-edobe ihe atụ nke ahụ n’enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: πνεῦμα
  choice: Mmụọ
  rationale: N’usoro okwu gbasara ịdị n’otu dị na Efe. 4:4–6, o yikarịrị ka ọ na-ezo aka na Mmụọ Nsọ; mkpụrụedemede ukwu na-egosi nghọta a, ebe nkọwa ala na-edobe ụzọ ọzọ e nwere ike isi ghọta ya.
- source_word: καθὼς καὶ
  choice: dị nnọọ ka ... sikwa
  rationale: Nke a na-egosipụta ntụnyere nke καθώς ma na-edobekwa καί nke jikọtara ọkpụkpọ ndị a na-agwa okwu na nkwupụta ndị bu ya ụzọ.
- source_word: ἐκλήθητε
  choice: e ... kpọọ unu
  rationale: Ụdị a na-edobe ngwaa n’olu nnara, ghara ịkpọ onye kpọrọ ha aha ebe ederede Grik na-akpọghị ya aha.
- source_word: ἐν μιᾷ ἐλπίδι
  choice: n'otu olileanya
  rationale: “N’” na-anọchi ἐν, “otu” na-aga n’ihu n’isiokwu ịdị n’otu, “olileanya” bụkwa okwu Igbo doro anya maka ἐλπίς.
- source_word: τῆς κλήσεως ὑμῶν
  choice: nke ọkpụkpọ unu
  rationale: A na-edobe njikọ genitiv ahụ n’ụzọ pụtara ìhè, ma na-echekwa njikọ okwu dị n’etiti “kpọọ” na “ọkpụkpọ.”
theological_decisions:
- issue: Ihe πνεῦμα na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: otu mmụọ, ya bụ mmụọ ma ọ bụ echiche ime mmụọ ndị kwere ekwe nwere n’otu
  rationale: N’usoro “otu ahụ ... otu Mmụọ ... otu Onyenwe anyị ... otu Chineke na Nna” dị n’Efe. 4:4–6, o yikarịrị ka πνεῦμα na-ezo aka na Mmụọ Nsọ. Ma ebe ihe odide Grik oge ahụ na-ejighị mkpụrụedemede ukwu na nke nta kewaa ihe ndị a, e tinyere nghọta ọzọ na nkọwa ala kama ihichapụ mgbagwoju anya ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ ihe atụ “ahụ” na njikọ “kpọọ/ọkpụkpọ” ka ha kwekọọ n’ihe odide Grik, ebe e ji “e ... kpọọ unu” zere ịgbakwụnye onye mere omume ahụ nke a na-akpọghị aha n’amaokwu ahụ.
