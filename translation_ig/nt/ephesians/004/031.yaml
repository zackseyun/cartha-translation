revisions:
- from: Ka e wepụ obi ilu niile, ọnụma, iwe, iti mkpu, na nkwutọ[a] n’ebe unu nọ, tinyere obi ọjọọ niile.
  to: Ka e wepụ obi ilu niile, ọnụma, iwe, iti mkpu, na nkwutọ[a] n’ime unu, tinyere obi ọjọọ niile.
  rationale: The revision corrects the rendering of ἀφ’ ὑμῶν from a merely locative phrase to “n’ime unu,” expressing that these dispositions and forms of speech must be removed from among the readers. The wording otherwise preserves the source list, passive imperative, contextual sense of βλασφημία, and the lexical ambiguity noted in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:16:45Z'
review_pass:
  verdict: revise
  source_fidelity: The vice list and the passive imperative are substantially represented well. However, “n’ebe unu nọ” means “where you are” and does not adequately convey ἀφ’ ὑμῶν (“from you/away from among you”). “N’ime unu” naturally conveys the intended removal from the community and conduct of the addressees without specifying an agent.
  naturalness: The verse is clear, modern Standard Igbo. The revised prepositional phrase is more idiomatic for this context. The footnote is also lightly regularized for smoother syntax.
  terminology: “Obi ilu,” “ọnụma,” and “iwe” maintain the list’s distinction between settled bitterness, heated anger, and anger. “Iti mkpu” suits κραυγή in this hostile-speech context. “Nkwutọ” is a sound contextual rendering of βλασφημία; the footnote appropriately retains broader alternatives. “Obi ọjọọ” adequately expresses κακία as malice or ill will.
  issues:
  - severity: medium
    issue: ἀφ’ ὑμῶν is rendered “n’ebe unu nọ.”
    rationale: This expression is locative (“where you are”), whereas the Greek calls for removal “from you” or “from among you.” “N’ime unu” better reflects the source in natural Igbo.
  - severity: low
    issue: Minor grammatical awkwardness in the footnote.
    rationale: Removing the superfluous “ọ” after “okwu Grik ahụ” yields a smoother and grammatically direct Standard Igbo sentence.
  revised_text: Ka e wepụ obi ilu niile, ọnụma, iwe, iti mkpu, na nkwutọ[a] n’ime unu, tinyere obi ọjọọ niile.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “okwu mkparị”; n’ụzọ ọdịnala, “nkwulu.” N’ebe a, o yiri ka okwu Grik ahụ na-ezo aka n’okwu na-emerụ ndị ọzọ.
    reason: lexical_alternative
  revision_rationale: The revision corrects the rendering of ἀφ’ ὑμῶν from a merely locative phrase to “n’ime unu,” expressing that these dispositions and forms of speech must be removed from among the readers. The wording otherwise preserves the source list, passive imperative, contextual sense of βλασφημία, and the lexical ambiguity noted in the footnote.
