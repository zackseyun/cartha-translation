id: EPH.4.31
reference: Ephesians 4:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφ’ ὑμῶν σὺν πάσῃ κακίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: ig
  text: Ka e wepụ obi ilu niile, ọnụma, iwe, iti mkpu, na nkwutọ[a] n’ime unu, tinyere obi ọjọọ niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwu mkparị”; n’ụzọ ọdịnala, “nkwulu.” N’ebe a, o yiri ka okwu Grik ahụ na-ezo aka n’okwu na-emerụ ndị ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα πικρία
  choice: obi ilu niile
  rationale: “Obi ilu” na-egosi iwe ma ọ bụ ajọ mmetụta gbanyere mkpọrọgwụ n’obi; “niile” na-enye πᾶσα ike ya zuru ezu.
- source_word: θυμός
  choice: ọnụma
  rationale: “Ọnụma” na-egosi iwe dị ọkụ ma na-apụta n’ike, ma na-enyekwa ohere ịmata ọdịiche ya na ὀργή.
- source_word: ὀργή
  choice: iwe
  rationale: “Iwe” bụ okwu Igbo a na-aghọta nke ọma maka ọnọdụ iwe, ma ọ dị iche n’ọnụma nke θυμός na-egosi.
- source_word: κραυγή
  choice: iti mkpu
  rationale: N’usoro ajọ omume a, okwu ahụ na-ezo aka n’ịkpọtụ ụzụ ma ọ bụ iti mkpu n’ụzọ iwe na esemokwu, ọ bụghị naanị mkpu nkịtị.
- source_word: βλασφημία
  choice: nkwutọ
  rationale: N’ebe a, ihe ndị gbara okwu ahụ gburugburu metụtara mmekọrịta mmadụ na ibe ya; “nkwutọ” na-egosi okwu na-emebi aha ma ọ bụ na-emerụ onye ọzọ. E debere ụzọ ndị ọzọ na nkọwa ala peeji.
- source_word: ἀρθήτω
  choice: ka e wepụ
  rationale: 'Nke a na-echekwa ụdị iwu dị na passive: a ga-ewepụ ihe ndị a kpamkpam.'
- source_word: ἀφ’ ὑμῶν
  choice: n’ebe unu nọ
  rationale: Nkebi a na-egosi na a ga-ewepụ omume ndị a n’ime ndụ na mmekọrịta ndị kwere ekwe, ma ọ naghị eme ka onye na-eme mwepụ ahụ doo anya karịa isi mmalite ahụ.
- source_word: σὺν πάσῃ κακίᾳ
  choice: tinyere obi ọjọọ niile
  rationale: “Tinyere” na-egosipụta σὺν, ebe “obi ọjọọ” na-egosi ebumnobi ọjọọ ma ọ bụ ọchịchọ imerụ mmadụ nke κακία pụtara n’ebe a.
theological_decisions:
- issue: Ihe βλασφημία pụtara n’usoro ajọ omume a
  choice: nkwutọ mmadụ
  alternative: okwu mkparị; nkwulu megide Chineke
  rationale: Ọnọdụ okwu a lekwasịrị anya n’àgwà na okwu ndị na-emebi mmekọrịta mmadụ na ibe ya. Ya mere, “nkwutọ” dabara nke ọma, ma nkọwa ala peeji na-echekwa obosara okwu Grik ahụ na nsụgharị ọdịnala.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E chekwara usoro ndepụta nke Grik na ọdịiche dị n’etiti θυμός (“ọnụma”) na ὀργή (“iwe”), n’enweghị itinye nkọwa ụka pụrụ iche.
