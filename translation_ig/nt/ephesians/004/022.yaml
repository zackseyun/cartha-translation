  text: ka unu yipụ[a], n’ihe gbasara ụzọ ndụ unu na mbụ, mmadụ ochie ahụ, nke na-ala n’iyi dịka agụụ nke aghụghọ si dị[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a pụtara iwepụ ihe dịka mmadụ si eyipụ uwe; ihe atụ a gara n’ihu n’amaokwu 24, ebe a sịrị ka ha ‘yikwasị’ mmadụ ọhụrụ.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ nkịtị: “agụụ nke aghụghọ”; ya bụ, agụụ aghụghọ na-akpụzi ma ọ bụ nke aghụghọ ji mara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθέσθαι
  choice: ka unu yipụ
  rationale: Ọ na-egosi iwepụ ihe dị ka uwe; ‘yipụ’ na-edobe ihe atụ nke iyi uwe, nke na-aga n’ihu na amaokwu 24, ma na-ahapụkwa njikọ infinitive ahụ na ihe e kwuru tupu ya.
- source_word: κατὰ τὴν προτέραν ἀναστροφὴν
  choice: n’ihe gbasara ụzọ ndụ unu na mbụ
  rationale: Κατά ebe a na-egosi ihe a na-ekwu maka ya, ebe ἀναστροφή bụ omume ma ọ bụ ụzọ mmadụ si ebi ndụ.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: mmadụ ochie ahụ
  rationale: Nke a na-edobe mmadụ/ἄνθρωπος kama ime ya naanị ‘onwe ochie’; okwu ahụ na-anọchi anya ụdị mmadụ na ụzọ ndụ ochie, ọ bụghị naanị ụmụ nwoke.
- source_word: φθειρόμενον
  choice: onye na-emebi emebi
  rationale: Ụdị participle dị ugbu a na passive na-egosi usoro mbibi na-aga n’ihu; Igbo a na-egosipụta mbibi ahụ n’enweghị ịkọwapụta onye na-akpata ya.
- source_word: κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης
  choice: dịka agụụ nke aghụghọ si dị
  rationale: ‘Agụụ’ na-eburu ọchịchọ siri ike nke nwere echiche ọjọọ n’ebe a, ebe ‘nke aghụghọ’ na-edobe genitive Greek na ezigbo mgbagwoju anya ya.
theological_decisions:
- issue: Ntụgharị τὸν παλαιὸν ἄνθρωπον
  choice: mmadụ ochie ahụ
  alternative: onwe ochie ahụ
  rationale: ‘Mmadụ ochie’ na-edobe okwu mmadụ na ohere nke echiche nnọchiteanya ma ọ bụ nke jikọrọ mmadụ ọnụ n’akwụkwọ Pọl; ihe odide ahụ anaghị ekwu naanị banyere nwoke.
- issue: Ike na ọrụ ἀποθέσθαι n’ime ahịrịokwu ahụ
  choice: ka unu yipụ
  alternative: unu yipụla
  rationale: Nke a na-edobe ya dịka ọdịnaya nke ihe a kụziiri ha, n’enweghị ikpebi na ọ bụ naanị iwu ugbu a ma ọ bụ naanị ihe mezuru n’oge nchegharị.
- issue: Njikọ τῆς ἀπάτης na ἐπιθυμίας
  choice: agụụ nke aghụghọ
  alternative: agụụ aghụghọ
  rationale: Ntụgharị nkịtị a na-ahapụ mmekọrịta genitive ahụ ka o nwee ike ịpụta agụụ nke aghụghọ na-akpụzi ma ọ bụ nke aghụghọ ji mara, kama idozi ya n’otu ụzọ naanị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma doo ndị nkịtị anya. E debere ihe atụ uwe site na ‘yipụ,’ jiri ‘ụzọ ndụ’ mee ka ἀναστροφή doo anya, ma zere ịkọwa ‘mmadụ ochie’ dịka nwoke naanị. Akara ụkwụ [a] na [b] pụtara n’ederede isi.
