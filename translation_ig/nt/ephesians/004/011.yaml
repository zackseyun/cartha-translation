  naturalness: 'The main text is clear, idiomatic Standard Igbo with a suitably elevated biblical register. The only needed improvement is in footnote b: the English grammatical label ''article'' is unnecessary code-switching and can be expressed naturally in Igbo.'
  terminology: '''Ndịozi,'' ''ndị amụma,'' ''ndị na-ekwusa ozi ọma,'' ''ndị ọzụzụ atụrụ,'' and ''ndị ozizi'' are accurate and natural. The alternative ''ndị pastọ'' is appropriately restricted to the lexical-alternative footnote. The revised grammatical note avoids introducing an English technical term.'
