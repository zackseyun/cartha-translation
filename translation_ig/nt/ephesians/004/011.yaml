source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: ig
  text: Ọ bụkwa ya onwe ya nyere ụfọdụ ka ha bụrụ ndịozi, ụfọdụ ka ha bụrụ ndị amụma, ụfọdụ ka ha bụrụ ndị na-ekwusa ozi ọma, ụfọdụkwa ka ha bụrụ ndị ọzụzụ atụrụ[a] na ndị ozizi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị pastọ.” Okwu Grik ahụ pụtara kpọmkwem “ndị ọzụzụ atụrụ.”
    reason: lexical_alternative
  - marker: b
    text: N'asụsụ Grik, e nwere naanị otu mkpụrụokwu nkọwa n'ihu “ndị ọzụzụ atụrụ na ndị ozizi.” Nke a nwere ike igosi na ọrụ abụọ a nwere njikọ chiri anya, ma ọ dịghị mkpa ka e were ha dị ka otu ọkwa naanị.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: Ọ bụkwa ya onwe ya
  rationale: 'Nke a na-edobe njikọ καὶ na amaokwu ndị bu ụzọ ma na-egosikwa nkwusi ike dị na αὐτός: ọ bụ ya onwe ya mere ihe ahụ.'
- source_word: ἔδωκεν
  choice: nyere
  rationale: Nke a bụ ihe δίδωμι pụtara n'ụzọ kacha kwụ ọtọ; ọ naghị akpakọba nkọwa dịka ‘họpụtara’ ga-eme.
- source_word: τοὺς μὲν ἀποστόλους
  choice: ụfọdụ ka ha bụrụ ndịozi
  rationale: Usoro μέν/δέ na-ekesa ndị ahụ n'òtù dị iche iche, ya mere ‘ụfọdụ ... ụfọdụ ...’ bụ Igbo doro anya; ‘ka ha bụrụ’ na-egosi ọrụ e nyere ha n'ime ndepụta a.
- source_word: προφήτας
  choice: ndị amụma
  rationale: Ọ bụ okwu Igbo a na-ejikarị eme ihe maka ndị na-ekwu ozi sitere n'aka Chineke, ma ọ dabara n'ọnọdụ a.
- source_word: εὐαγγελιστάς
  choice: ndị na-ekwusa ozi ọma
  rationale: Nkebiokwu a na-akọwa ọrụ ndị a n'Igbo nkịtị ma doo anya karịa iji okwu ụka e si n'asụsụ ọzọ nweta.
- source_word: ποιμένας
  choice: ndị ọzụzụ atụrụ
  rationale: Nke a na-edobe ihe atụ onye na-azụ atụrụ dị n'okwu Grik ποιμήν kama ịgbanwe ya ozugbo ka ọ bụrụ aha ọkwa ụka.
- source_word: καὶ διδασκάλους
  choice: na ndị ozizi
  rationale: Nke a na-asụgharị njikọ na aha ọrụ ahụ n'ụzọ kwụ ọtọ, na-ahapụghị mkpebi siri ike banyere ma ọ bụ otu ọrụ jikọrọ ọnụ ka ọ bụ ọrụ abụọ.
theological_decisions:
- issue: Ma a ga-asụgharị ποιμένας dịka ihe atụ ‘ndị ọzụzụ atụrụ’ ma ọ bụ aha ọkwa ụka ‘ndị pastọ’
  choice: ndị ọzụzụ atụrụ
  alternative: ndị pastọ
  rationale: Isi ederede na-edobe ihe atụ Grik ahụ; a na-etinye aha a na-ejikarị n'ụka, ‘ndị pastọ,’ n'ala ala peeji ka e wee ghara itinye usoro ọchịchị ụka e mesịrị n'ime okwu ahụ n'onwe ya.
- issue: Ma ‘ndị ọzụzụ atụrụ na ndị ozizi’ bụ otu ìgwè jikọrọ ọnụ ma ọ bụ ọrụ abụọ dị iche
  choice: E depụtara aha abụọ ahụ n'otu nkebiokwu n'enweghị ikpebi esemokwu ahụ
  alternative: ndị ọzụzụ atụrụ bụ́kwa ndị ozizi; ma ọ bụ ìgwè abụọ kewapụrụ kpamkpam
  rationale: Otu article dị n'ihu aha abụọ ahụ na-egosi njikọ chiri anya, ma usoro okwu Grik ahụ anaghị amanye ka e were ha dị ka otu ọkwa naanị. Nsụgharị ahụ na-echekwa nghọtahie a.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke kwanyeere ederede ùgwù ma dịkwa mfe nghọta. ‘Ndị na-ekwusa ozi ọma’ na-ezere okwu mbite na-adịghị mkpa; ‘ndị ọzụzụ atụrụ’ na-echekwa ihe atụ mbụ. Akara ala ala peeji [a] na [b] dị n'isi ederede ma kwekọọ na nkọwa ha.
