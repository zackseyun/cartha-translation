  text: οἵτινες ἀπηλγηκότες ἑαυτοὺς παρέδωκαν τῇ ἀσελγείᾳ εἰς ἐργασίαν ἀκαθαρσίας πάσης ἐν πλεονεξίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/019.yaml
  text: who[a], having become callous[c][b], gave themselves over to sensuality for the practice of every kind of impurity with greediness.
translation:
  language: ig
  text: Ha bụ ndị, ebe ha enweghịzi mmetụta[a], nyefere onwe ha n’omume enweghị ihere[b], ka ha na-eme ụdị adịghị ọcha niile n’anyaukwu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe ha enweghịzi mmetụta” ma ọ bụ “ebe ha agwụla mmetụta.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ibi ndụ oke ihe ụtọ” ma ọ bụ “omume ọjọọ na-enweghị njide.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “site n’ọchịchọ inweta ihe ndị ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Ndị ahụ
  rationale: Ọ na-ezo aka ná ndị mba ọzọ a kpọtụrụ aha n’amaokwu ndị bu ụzọ. “Ndị ahụ” na-eme ka njikọ ahụ doo anya n’Igbo n’etinyeghị nkwusi ike ọzọ.
- source_word: ἀπηλγηκότες
  choice: ebe obi ha kpọrọ nkụ
  rationale: Nkebi a na-egosi na ha abatala n’ọnọdụ nke enweghị mmetụta n’ihe gbasara omume ọma na ihe ọjọọ. Akpaalaokwu Igbo a na-egosipụta isi ike na enweghị mmetụta nke omume, ọ bụghị nanị mwute ma ọ bụ mmetụta uche nkịtị.
- source_word: ἑαυτοὺς παρέδωκαν
  choice: nyefere onwe ha
  rationale: Ọ na-echekwa echiche nke mmadụ iji aka ya rara ma ọ bụ nyefee onwe ya n’aka omume ọjọọ.
- source_word: τῇ ἀσελγείᾳ
  choice: n’omume rụrụ arụ nke na-enweghị ihere
  rationale: ἀσέλγεια na-egosi omume ọjọọ a na-eme n’enweghị njide onwe onye ma ọ bụ ihere; ntụgharị a anaghị amachibido ya nanị n’ihe gbasara mmekọahụ.
- source_word: εἰς ἐργασίαν
  choice: ka ha … na-eme
  rationale: N’ebe a, ἐργασία pụtara itinye onwe n’omume ma ọ bụ ịna-eme ihe mgbe niile; usoro a bụ Igbo dị mfe ma na-egosi ebumnuche ma ọ bụ ihe si na nnyefe onwe ha pụta.
- source_word: ἀκαθαρσίας πάσης
  choice: ụdị adịghị ọcha niile
  rationale: Ọ na-egosipụta obosara nkebi Grik ahụ—adịghị ọcha n’ụdị ya niile—n’Igbo doro anya.
- source_word: ἐν πλεονεξίᾳ
  choice: jiri ọchịchọ na-adịghị eju afọ
  rationale: πλεονεξία bụ ọchịchọ anyaukwu nke na-achọwanye ihe mgbe niile. Nkebi a na-egosi ụzọ ma ọ bụ mmụọ ha ji eme adịghị ọcha ahụ ma na-echekwa echiche nke enweghị afọ ojuju.
theological_decisions:
- issue: Ike omume na nke uche dị na ἀπηλγηκότες
  choice: A sụgharịrị ya dị ka obi kpọrọ nkụ n’ihe gbasara omume.
  alternative: enweghịzi mmetụta; mmetụta niile agwụọla ha
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ekwu banyere ikewapụ onwe ha n’ebe Chineke nọ na ịrara onwe ha nye adịghị ọcha. Ya mere, okwu ahụ na-egosi enweghị mmetụta banyere omume ọma na ihe ọjọọ, ọ bụghị ọrịa uche ma ọ bụ enweghị mmetụta uche nkịtị.
- issue: Obosara ihe ἀσέλγεια pụtara
  choice: omume rụrụ arụ nke na-enweghị ihere
  alternative: ibi ndụ oke ihe ụtọ; omume ịkwa iko n’enweghị njide
  rationale: Okwu Grik ahụ na-agụnyekarị mmehie mmekọahụ, ma ọ pụkwara ịpụta ụdị omume ọjọọ ọ bụla a na-eme n’enweghị njide ma ọ bụ ihere. A hapụrụ obosara ahụ ka ọ dị.
- issue: Njikọ ἐν πλεονεξίᾳ na nkebi okwu ahụ
  choice: A ghọtara ya dị ka ụzọ ma ọ bụ mmụọ ha ji eme ụdị adịghị ọcha niile.
  alternative: A pụrụ ịghọta ya dị ka “n’anyaukwu” ma ọ bụ dị ka omume anyaukwu ọzọ dị iche.
  rationale: Ụtọasụsụ Grik na-enye ohere maka njikọ sara mbara, ma ọnọdụ okwu ya na-akwado na ọchịchọ na-adịghị eju afọ na-akọwa otú ha si etinye onwe ha n’adịghị ọcha. Ndetu ala na-echekwa ụzọ okwu ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. “Obi ha kpọrọ nkụ” bụ akpaalaokwu a na-aghọta nke ọma, ebe nkọwa ndị gbara ya gburugburu na-egbochi ka a ghọta ya nanị dị ka enweghị mmetụta uche. E zere okwu ụka pụrụ iche na ịmachi ἀσέλγεια nanị n’ime mmehie mmekọahụ.
