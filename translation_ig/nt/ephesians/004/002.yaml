  text: μετὰ πάσης ταπεινοφροσύνης καὶ πραΰτητος, μετὰ μακροθυμίας, ἀνεχόμενοι ἀλλήλων ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/002.yaml
  text: with all humility and gentleness, with patience, bearing with one another in love,
translation:
  language: ig
  text: jiri umeala n’obi niile na ịdị nwayọọ, jiri ogologo ndidi, na-edi ibe unu n’ịhụnanya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης
  choice: jiri ... niile
  rationale: μετά ya na genitive na-egosi ihe na-eso omume ma ọ bụ ụzọ e si eme ya; “jiri ... niile” bụ Igbo ebumpụta ụwa nke na-echekwa ike πάσης.
- source_word: ταπεινοφροσύνης
  choice: ịdị umeala n’obi
  rationale: Nke a na-egosi ịdị ala n’obi ma ghara ibuli onwe elu; okwu a doro ndị na-agụ Igbo nke oge a anya.
- source_word: πραΰτητος
  choice: ịdị nwayọọ
  rationale: Ọ na-egosi obi dị nro na ike a na-achịkwa, ọ bụghị adịghị ike; “ịdị nwayọọ” na-ekwupụta àgwà ahụ n'ụzọ dị mma n’Igbo.
- source_word: μακροθυμίας
  choice: ogologo ntachi obi
  rationale: Okwu Grik a bụ inwe ndidi n’ebe ndị ọzọ nọ, karịchaa ịdị ngwa ngwa iwe; “ogologo ntachi obi” na-echekwa echiche nke ndidi na-adịte aka.
- source_word: ἀνεχόμενοι
  choice: na-anagiderịta
  rationale: Participial present a na-egosi omume na-aga n’ihu nke mmadụ ibe ha na-edi ma na-anabata ibe ha; ụdị “-rịta” na-echekwa mmekọrịta ahụ.
- source_word: ἀλλήλων
  choice: ibe unu
  rationale: Reciprocal pronoun a na-ezo aka n’ime otu ndị a na-agwa okwu; “ibe unu” bụ ụzọ Igbo nkịtị si egosi ‘one another.’
- source_word: ἐν ἀγάπῃ
  choice: n’ịhụnanya
  rationale: ἐν + dative nwere ike igosi ọnọdụ ma ọ bụ ụzọ e si eme ihe; “n’ịhụnanya” na-echekwa ma njikọ ụtọasụsụ ma echiche ahụ.
theological_decisions:
- issue: Nsụgharị ἀγάπη
  choice: ịhụnanya
  alternative: ebere / ịhụ ibe unu n’anya
  rationale: “Ịhụnanya” bụ aha nkịtị na nke sara mbara maka ἀγάπη; ọ naghị etinye nkọwa ụka pụrụ iche ma na-echekwa echiche nke ịhụnanya dịka ọnọdụ ma ọ bụ ụzọ e si anagide ibe ha.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere amaokwu ahụ dịka nkebiokwu na-aga n’ihu site n’amaokwu 1, ya mere e mechiri ya na rikoma kama ime ya ahịrịokwu kwụụrụ onwe ya.
