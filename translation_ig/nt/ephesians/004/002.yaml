  rationale: The revision retains the source’s dependent-clause form, repeated μετά (“jiri …, jiri …”), and final participial construction. It replaces an awkward doubled reciprocal expression with a direct, idiomatic Igbo equivalent and uses “ogologo ndidi” for interpersonal longsuffering/patience.
