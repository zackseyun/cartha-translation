revisions:
- from: Gịnị ka okwu ahụ, “Ọ rịgoro,” pụtara ma ọ bụrụ na ọ bụghị na ọ gbadakwara n’akụkụ ndị dị ala nke ụwa?[a]
  to: Gịnị ka “Ọ rịgoro” pụtara, ma e wezụga na ọ gbadakwara n’ebe ndị dị ala nke ụwa?[a]
  rationale: The revision replaces a conditional expression with the standard inferential-exceptive construction and uses a more natural Igbo expression for “lower parts/regions.” It preserves the source’s ambiguity and the existing footnote anchor and alternatives.
  reviewer_model: gpt-5.6-terra
