  text: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ ⸀κατέβη εἰς τὰ κατώτερα μέρη τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: ig
  text: Gịnị ka “Ọ rịgoro” pụtara, ma e wezụga na ọ gbadakwara n’ebe ndị dị ala nke ụwa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ebe ndị dị ala, ya bụ, ụwa.” Okwu a nwere ike izo aka nanị n’ịgbadata n’ụwa, ma ọ bụ kpọmkwem karị n’ebe ndị nwụrụ anwụ nọ.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀνέβη
  choice: Ọ rịgoro
  rationale: “Ịrịgo” na-echekwa ihe oyiyi nke ịga n’elu ma kwekọọ n’ụzọ doro anya na “ọ gbadakwara.”
- source_word: τί ἐστιν εἰ μὴ ὅτι
  choice: Gịnị ka okwu ahụ ... pụtara ma ọ bụrụ na ọ bụghị na
  rationale: Nke a bụ Igbo dị ugbu a ma dị mfe nghọta nke na-echekwa ajụjụ arụmụka ahụ na nkwubi okwu ọ na-eweta.
- source_word: καὶ κατέβη
  choice: ọ gbadakwara
  rationale: Mgbakwunye “-kwara” na-eburu καί, ma “gbadata” na-echekwa ọdịiche ya na “rịgoro.”
- source_word: εἰς
  choice: n’
  rationale: N’ime okwu a, njikọ “n’” na ngwaa “gbadata” na-egosi mmegharị banye ma ọ bụ ruo ebe ahụ n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: τὰ κατώτερα μέρη
  choice: akụkụ ndị dị ala
  rationale: Nke a na-echekwa echiche ntụnyere nke κατώτερα na ọtụtụ μέρη, n’enweghị ịkọwa ya ozugbo dị ka ala ndị nwụrụ anwụ.
- source_word: τῆς γῆς
  choice: nke ụwa
  rationale: “Ụwa” dabara n’ọdịiche dị n’etiti ịrịgo na ịgbadata, ma njikọ “nke” na-ahapụ nghọta abụọ nke genitive ahụ ka ha guzo.
theological_decisions:
- issue: Nkọwa nke εἰς τὰ κατώτερα μέρη τῆς γῆς
  choice: n’akụkụ ndị dị ala nke ụwa
  alternative: n’ebe ndị dị ala, ya bụ, ụwa; ma ọ bụ n’ala ndị nwụrụ anwụ
  rationale: Grik ahụ nwere ike ịpụta ụwa dị ka ebe dị ala ma e jiri ya tụnyere eluigwe, ma ọ bụ akụkụ ndị dị n’okpuru ụwa/ebe ndị nwụrụ anwụ. Isi ederede anaghị ekpebi nke ọ bụ; nkọwa ala peeji na-egosi ụzọ ndị bụ isi e si aghọta ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E ji “okwu ahụ” mee ka o doo anya na ajụjụ ahụ na-atụgharị uche n’okwu e hotara, ma e zere itinye okwu oge dịka “ugbu a” nke na-adịghị na isi mmalite Grik.
