source:
  edition: SBLGNT
  text: καὶ ἐνδύσασθαι τὸν καινὸν ἄνθρωπον τὸν κατὰ θεὸν κτισθέντα ἐν δικαιοσύνῃ καὶ ὁσιότητι τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/024.yaml
  text: and to put on the new man[d][c][b][a], created according to God in righteousness and holiness of the truth.
translation:
  language: ig
  text: ka unu yikwasịkwa mmadụ ọhụrụ ahụ[a], nke e kere n’ụdị kwekọrọ na Chineke[b], n’ezi omume[c] na ịdị nsọ nke eziokwu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya “onwe ọhụrụ” ma ọ bụ “onye ọhụrụ.” N’asụsụ Grik, ọ bụ “mmadụ ọhụrụ,” nke kwekọrọ na “mmadụ ochie” n’okwu ndị gbara ya gburugburu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya “n’oyiyi Chineke” ma ọ bụ “dịka ụkpụrụ Chineke si dị.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ “ikpe ziri ezi.”
    reason: alternative_reading
  - marker: d
    text: A pụkwara ịghọta ya dịka “ezi omume na ịdị nsọ nke bụ eziokwu” ma ọ bụ “ezi omume na ịdị nsọ nke si n’eziokwu pụta.”
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐνδύσασθαι
  choice: yikwasịkwa
  rationale: Nke a na-edobe ihe atụ nke iyi uwe dị n’okwu ndị gbara amaokwu a gburugburu, ma na-egosikwa na okwu ahụ na-aga n’ihu site n’ụzọ e si jiri καί.
- source_word: καινὸν ἄνθρωπον
  choice: mmadụ ọhụrụ ahụ
  rationale: “Mmadụ ọhụrụ” na-edobe njikọ okwu a na “mmadụ ochie” nke dị n’amaokwu ndị gbara ya gburugburu; ọ naghị akọwa ya naanị dị ka “onwe ọhụrụ.”
- source_word: κατὰ θεὸν
  choice: dị ka Chineke si dị
  rationale: Nke a na-edobe obosara ihe κατά θεόν nwere ike ịpụta—ịdị n’ụdị kwekọrọ na Chineke ma ọ bụ dịka ụkpụrụ Chineke si dị—n’agbanyeghị na ọ bụghị nkọwa Igbo kacha mfe.
- source_word: κτισθέντα
  choice: onye e kere
  rationale: Ọ na-edobe olu nnara na asụsụ okike nke participle ahụ, ma na-ejikọta ya n'ụzọ doro anya na “mmadụ ọhụrụ ahụ.”
- source_word: δικαιοσύνῃ
  choice: ezi omume
  rationale: “Ezi omume” bụ ụzọ Igbo dị ugbu a na nke a na-aghọta nke ọma isi kwuo δικαιοσύνη n’ebe a; “ikpe ziri ezi” ka e debere dịka ihe ọzọ ọ pụrụ ịpụta.
- source_word: ὁσιότητι
  choice: ịdị nsọ
  rationale: Nke a na-egosi àgwà nke ịdị nsọ ma ọ bụ ịdị uchu n’ihe gbasara Chineke, n’enweghị itinye echiche otu ụka pụrụ iche.
- source_word: τῆς ἀληθείας
  choice: nke eziokwu
  rationale: A hapụrụ genitive ahụ n’ụdị chiri anya ka ọ ghara ikpebi ma “eziokwu” na-akọwa àgwà ha, isi ha si pụta, ma ọ bụ njikọ ọzọ.
theological_decisions:
- issue: Ihe ἄνθρωπον pụtara n’okwu “mmadụ ọhụrụ”
  choice: mmadụ ọhụrụ
  alternative: onwe ọhụrụ; onye ọhụrụ
  rationale: Nhọrọ a na-edobe okwu mmadụ Pọl ji na njikọ ya na “mmadụ ochie,” ebe nhọrọ ndị ọzọ na-akọwawanye ihe okwu ahụ pụtara.
- issue: Mmekọrịta κατὰ θεὸν na okike nke mmadụ ọhụrụ ahụ
  choice: dị ka Chineke si dị
  alternative: n’oyiyi Chineke; dịka ụkpụrụ Chineke si dị
  rationale: E deghị “oyiyi” n’onwe ya n’asụsụ Grik, ọ bụ ezie na echiche ahụ nwere ike ịdị na ya; nsụgharị bụ isi na-ahapụ ntakịrị mgbagwoju anya ahụ.
- issue: Ọrụ genitive τῆς ἀληθείας
  choice: nke eziokwu
  alternative: ezi omume na ịdị nsọ n’ezie; ezi omume na ịdị nsọ nke si n’eziokwu pụta
  rationale: Ụdị Grik nwere ike ịbụ genitive na-egosi àgwà ma ọ bụ isi ihe si pụta. Nsụgharị bụ isi anaghị ahọrọ otu n’ime ha n’enweghị ihe àmà zuru ezu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ ihe atụ iyi uwe, okwu “mmadụ ọhụrụ,” na mgbagwoju anya dị na κατὰ θεόν na τῆς ἀληθείας; e tinyere nkọwa ndị ọzọ n’ala peeji kama imechi ihe Grik nwere ike ịpụta.
