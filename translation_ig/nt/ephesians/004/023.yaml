translation:
  language: ig
  text: ka a na-eme ka unu dị ọhụrụ n'ime mmụọ nke uche unu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta “n'ime mmụọ” dịka “site na Mmụọ Nsọ”; ma o yikarịrị ka okwu a na-ekwu maka ọnọdụ ime mmadụ, ya bụ, ụzọ uche unu si eche echiche, karịa ka ọ na-ekwu kpọmkwem maka Mmụọ Nsọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνανεοῦσθαι
  choice: ka a na-eme ka unu dị ọhụrụ
  rationale: 'Ụdị a na-echekwa olu nnata nke okwu Grik: ọ bụghị unu ji aka unu eme onwe unu ọhụrụ, kama a na-eme ka unu dị ọhụrụ. “Na-eme” na-enyekwa ohere ka a ghọta ya dị ka ihe na-aga n’ihu.'
- source_word: δὲ
  choice: na … kwa
  rationale: N’ebe a, δέ bụ njikọ dị nro n’usoro okwu ndị gbara ya gburugburu, ọ bụghị mmegide siri ike. “Na … kwa” na-eme ka usoro ahụ gaa were were n’Igbo.
- source_word: τῷ πνεύματι
  choice: na mmụọ
  rationale: “Na” na-egosi ebe ma ọ bụ akụkụ mgbanwe ahụ na-eme. E dere “mmụọ” n’obere mkpụrụedemede n’ihi na njikọ ya na “uche unu” na-atụkarị aka n’ọnọdụ ime mmadụ, ma e debere ohere maka nghọta ọzọ n’akụkụ nkọwa.
- source_word: νοὸς
  choice: uche
  rationale: “Uche” bụ okwu Igbo doro anya ma kwekọọ na νοῦς dịka ikike mmadụ ji eche echiche ma ghọta ihe.
- source_word: ὑμῶν
  choice: unu
  rationale: “Unu” na-egosipụta nke ọma na okwu Grik ahụ bụ onye nke abụọ ọtụtụ mmadụ.
theological_decisions:
- issue: Ma πνεύματι ọ̀ na-ekwu maka Mmụọ Nsọ ka ọ bụ mmụọ/ọnọdụ ime nke uche mmadụ
  choice: mmụọ nke uche unu
  alternative: Mmụọ na-eme ka uche unu dị ọhụrụ
  rationale: τοῦ νοὸς ὑμῶν na-akọwakarị πνεύματι, ya mere isi ederede na-echekwa okwu ahụ dịka “mmụọ nke uche unu” kama ime ka ọ bụrụ okwu doro anya banyere Mmụọ Nsọ. Nkọwa ala peeji na-echekwa nghọta ọzọ ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị nsọ. E ji usoro “a na-eme ka” chekwaa olu nnata, ebe “mmụọ nke uche unu” na-edebe ntakịrị mgbagwoju anya dị n’okwu Grik kama ịkọwa ya gabiga ihe ederede kwuru.
