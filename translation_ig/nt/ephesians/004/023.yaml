revisions:
- from: ka a na-emekwa ka unu dị ọhụrụ na mmụọ nke uche unu,[a]
  to: ka a na-eme ka unu dị ọhụrụ n'ime mmụọ nke uche unu,[a]
  rationale: The revision removes the added nuance in “na-emekwa,” uses “n'ime” to represent the likely dative sphere, and retains the passive, ongoing renewal expression. The main text continues to leave πνεύματι uncapitalized and therefore does not settle the disputed referent. The footnote presents the Holy-Spirit reading as an alternative without making the misleading construction “Mmụọ nke uche unu.”
