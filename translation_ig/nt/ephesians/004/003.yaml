  text: na-agbasi mbọ ike idebe ịdị n’otu nke Mmụọ Nsọ n’ njikọ nke udo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-adị uchu idebe,” ma ọ bụ “na-agba mbọ ichekwa.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, okwu a bụ “nke Mmụọ.” Ọtụtụ ndị na-aghọta ya dịka Mmụọ Nsọ; ụfọdụ na-aghọta ya n’ozuzu dịka otu mmụọ ndị kwere ekwe na-ekerịta.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδάζοντες
  choice: na-agbalịsikwa ike n’ụzọ niile
  rationale: Okwu a bụ participle nke na-egosi ịnụ ọkụ n’obi na itinye mgbalị siri ike n’ọrụ; nsụgharị a na-egosipụta mgbalị zuru ezu, ọ bụghị naanị ọchịchọ dị n’obi.
- source_word: τηρεῖν
  choice: idebe
  rationale: “Idebe” na-egosi ichekwa ma ọ bụ ịnọgide na-enwe ihe dịlarị, kama ịmepụta ịdị n’otu ọhụrụ.
- source_word: τὴν ἑνότητα
  choice: ịdị n’otu
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-eji eme ihe maka ịdịkọ n’otu.
- source_word: τοῦ πνεύματος
  choice: nke Mmụọ Nsọ
  rationale: N’ọnọdụ akwụkwọ Ndị Efesọs, πνεῦμα nwere article na-ezo aka nke ukwuu n’ebe Mmụọ Nsọ nọ; agbanyeghị, e debere ohere ọgụgụ ọzọ n’ala ala peeji.
- source_word: ἐν
  choice: n’
  rationale: A hapụrụ mmekọrịta preposition ahụ n’ụdị “n’agbụ,” nke nwere ike igosi ọnọdụ ma ọ bụ ụzọ e si edebe ịdị n’otu.
- source_word: τῷ συνδέσμῳ
  choice: agbụ
  rationale: “Agbụ” na-echekwa ihe atụ nke ihe na-ejikọta ma na-ekekọta ndị mmadụ ọnụ.
- source_word: τῆς εἰρήνης
  choice: nke udo
  rationale: 'Nsụgharị genitive a dị mfe ma na-ahapụ mmekọrịta ahụ ka ọ bụrụ nke sara mbara: udo bụ ihe na-ekekọta ha ọnụ ma ọ bụ ihe e ji jikọta ha.'
theological_decisions:
- issue: Ihe πνεύματος na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ ma ọ bụ otu mmụọ ndị kwere ekwe na-ekerịta
  rationale: Ọnọdụ dị nso n’akwụkwọ Ndị Efesọs, karịchaa 4:4 na 4:30, na-akwado na ọ bụ Mmụọ Nsọ; ma e gosipụtara nghọta ọzọ n’ala ala peeji iji chekwaa mgbagwoju anya dị n’okwu Grik.
- issue: Ụdị ịdị n’otu a
  choice: ịdị n’otu dịlarị nke a ga-edebe
  alternative: ịdị n’otu ndị kwere ekwe ga-emepụta
  rationale: τηρεῖν pụtara idebe ma ọ bụ ichekwa ihe dịlarị; ya mere, amaokwu ahụ anaghị ekwu na ha ga-emepụta ịdị n’otu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta mee ihe. “Agbụ nke udo” na-echekwa ihe atụ dị n’asụsụ Grik, ebe “idebe” na-egosi na ịdị n’otu ahụ dịlarị. Akara ala ala peeji [a] na [b] pụtara n’ederede isi.
