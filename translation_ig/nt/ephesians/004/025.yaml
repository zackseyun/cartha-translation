    text: Ma ọ bụ, “ụgha ahụ.”
    reason: lexical_alternative
  revision_rationale: Only the final metaphor has been adjusted. The revision preserves Paul’s image that believers are mutually connected members/parts, while using natural Standard Igbo. The main wording and the footnote’s lexical ambiguity are otherwise retained.
