- from: Ya mere, ebe unu wepụsịrị okwu ụgha[a], ka onye ọ bụla gwa onye agbata obi ya eziokwu, n’ihi na anyị bụ akụkụ ahụ nke ibe anyị.
  to: Ya mere, ebe unu wepụsịrị okwu ụgha[a], ka onye ọ bụla gwa onye agbata obi ya eziokwu, n’ihi na anyị bụ akụkụ nke ibe anyị.
  rationale: Only the final metaphor has been adjusted. The revision preserves Paul’s image that believers are mutually connected members/parts, while using natural Standard Igbo. The main wording and the footnote’s lexical ambiguity are otherwise retained.
