id: EPH.4.25
reference: Ephesians 4:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: ig
  text: Ya mere, ebe unu wepụsịrị okwu ụgha[a], ka onye ọ bụla gwa onye agbata obi ya eziokwu, n’ihi na anyị bụ akụkụ nke ibe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụgha ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n’ọdụmọdụ ndị bu ụzọ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἀποθέμενοι
  choice: ebe unu wepụsịrị
  rationale: 'Na-echekwa echiche nke aorist participle: ịhapụ ihe ahụ bụ ihe e mere dịka ntọala maka iwu na-esote.'
- source_word: τὸ ψεῦδος
  choice: okwu ụgha
  rationale: Na-egosi ụgha ma ọ bụ omume ikwu ụgha n’ozuzu ya; akara ụkwụ na-echekwa ntụgharị nkịtị ọzọ, ‘ụgha ahụ.’
- source_word: λαλεῖτε ἀλήθειαν ἕκαστος
  choice: ka onye ọ bụla ... gwa ... eziokwu
  rationale: Na-eweta iwu ahụ n’Igbo doro anya, ma na-echekwa ike nkesa nke ἕκαστος nye onye ọ bụla n’ime ndị a na-agwa okwu.
- source_word: μετὰ τοῦ πλησίον αὐτοῦ
  choice: onye agbata obi ya
  rationale: ‘Onye agbata obi’ na-egosi onye ibe mmadụ n’echiche omume na mmekọrịta; ‘ya’ na-anọchi anya onye ọ bụla.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Na-echekwa njikọ na-enye ihe kpatara iwu ahụ.
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: anyị bụ akụkụ ahụ nke ibe anyị
  rationale: ‘Akụkụ ahụ’ na-echekwa ihe atụ nke akụkụ dị iche iche nke otu ahụ na ndabere ha nwere n’ebe ibe ha nọ.
theological_decisions:
- issue: Asụsụ nkesa gbasara nwoke na nwanyị n’ọdụmọdụ omume
  choice: onye ọ bụla ... onye agbata obi ya
  alternative: onye ọbụla ... onye agbata obi ha
  rationale: ἕκαστος na αὐτοῦ bụ otu onye n’ụdị ụtọasụsụ, ma ihe ha pụtara gụnyere onye ọ bụla nọ n’ọgbakọ. Igbo ‘ya’ na-arụ ọrụ nke ọma dịka nnọchiaha otu onye n’enweghị itinye ozizi gbasara nwoke na nwanyị.
- issue: Ókè ihe τὸ ψεῦδος pụtara
  choice: okwu ụgha
  alternative: ụgha ahụ
  rationale: N’ọnọdụ a, okwu ahụ yikarịrị ka ọ na-ekwu maka ụgha na omume aghụghọ n’ozuzu ha. Ma n’ihi article τὸ, ‘ụgha ahụ’ ka bụ ntụgharị kwe omume, ya mere e debere ya n’akara ụkwụ.
- issue: Ihe atụ nke μέλη
  choice: akụkụ ahụ nke ibe anyị
  alternative: ndị otu nke ibe anyị
  rationale: ‘Akụkụ ahụ’ na-echekwa ihe atụ nke ahụ mmadụ na mmekọrịta chiri anya dị n’etiti ndị kwere ekwe, na-enweghị ime ka ọ bụrụ naanị aha ndị so n’otu nzukọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E jiri ‘unu’ mee ka ndị a na-agwa okwu n’ebe participle ahụ nọ pụta ìhè, ebe ‘onye ọ bụla ... ya’ na-echekwa nkesa nye otu onye n’otu onye. Akara ụkwụ [a] dị n’ederede isi.
