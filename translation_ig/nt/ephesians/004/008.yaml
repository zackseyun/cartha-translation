id: EPH.4.8
reference: Ephesians 4:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὸ λέγει· Ἀναβὰς εἰς ὕψος ᾐχμαλώτευσεν αἰχμαλωσίαν, ⸀ἔδωκεν δόματα τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/008.yaml
  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: ig
  text: Ya mere, ọ na-ekwu[a], “Mgbe ọ rịgoro n’elu, ọ kpọọrọ ndị e jidere n’agha[b], nyekwa ụmụ mmadụ onyinye[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Akwụkwọ Nsọ na-ekwu” ma ọ bụ “ọ na-ekwu.” Grik akpọghị onye na-ekwu okwu aha.
    reason: source_ambiguity
  - marker: b
    text: N’ụzọ dị nso n’okwu Grik, ọ bụ “ọ dọọrọ ndọta n’agha,” ya bụ, okwu siri ike e ji ngwaa na aha nwere otu mgbọrọgwụ mee. Ọ na-ekwughachi Abụ Ọma 68:18. A pụkwara ịsụgharị ya, “ọ kpọọrọ ọtụtụ ndị e jidere n’agha.”
    reason: lexical_alternative
  - marker: c
    text: “Ụmụ mmadụ” n’ebe a pụtara mmadụ n’izugbe, ọ bụghị naanị ndị nwoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Ya mere
  rationale: Na-egosipụta nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a, ma bụrụkwa okwu Igbo dị mfe ma doo anya.
- source_word: λέγει
  choice: ọ na-ekwu
  rationale: E debere ngwaa ahụ n’oge ugbu a ma ghara ịkpọ onye na-ekwu okwu aha. Nkọwa nta na-echekwa ohere na ọ pụrụ ịpụta ‘Akwụkwọ Nsọ na-ekwu’ ma ọ bụ ‘ọ na-ekwu.’
- source_word: Ἀναβὰς
  choice: Mgbe ọ rịgoro
  rationale: Nke a na-egosi na nrịgo ahụ bu ụzọ tupu omume ndị bụ isi, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: εἰς ὕψος
  choice: n’ebe dị elu
  rationale: Na-echekwa echiche nke ịrịgo n’elu ma na-anọgide nso n’ụdị okwu nke Abụ Ọma 68:18.
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: ọ kpọọrọ ìgwè ndị a dọtara n’agha
  rationale: Okwu Grik ahụ ji ngwaa na aha sitere n’otu mgbọrọgwụ mee okwu siri ike. Nsụgharị a na-enye ihe oyiyi nke onye mmeri na-akpọrọ ndị e jidere, ma nkọwa nta na-echekwa ụdị okwu Grik na ụzọ ndị ọzọ e nwere isi ghọta ya.
- source_word: ἔδωκεν δόματα
  choice: nyekwa … onyinye
  rationale: Na-asụgharị omume inye na ihe e nyere n’ụzọ kpọmkwem, dị mfe, ma kwekọọ n’isiokwu onyinye dị n’akụkụ amaokwu a.
- source_word: τοῖς ἀνθρώποις
  choice: ụmụ mmadụ
  rationale: N’Igbo, ‘ụmụ mmadụ’ na-egosi mmadụ niile n’enweghị ịkọwa na ọ bụ naanị ndị nwoke; nke a kwekọrọ n’ojiji izugbe nke ἄνθρωποι n’ebe a.
theological_decisions:
- issue: Onye bụ isiokwu nke λέγει
  choice: ọ na-ekwu, tinyere nkọwa nta
  alternative: Akwụkwọ Nsọ na-ekwu; Chineke na-ekwu; e kwuru
  rationale: Grik akpọghị isiokwu ahụ aha. Ide ‘Akwụkwọ Nsọ’ ma ọ bụ ‘Chineke’ n’ahịrị bụ isi ga-akọwapụta ihe isi mmalite ahụ hapụrụ ghe oghe; nkọwa nta na-eme ka onye na-agụ ya mara nke a.
- issue: Ihe ᾐχμαλώτευσεν αἰχμαλωσίαν pụtara
  choice: ọ kpọọrọ ìgwè ndị a dọtara n’agha
  alternative: ọ dọrọ ndọrọ n’agha n’agha; ọ kpọọrọ ndị e jidere dịka ndị a dọtara n’agha
  rationale: Nke a na-eme ka ihe oyiyi onye mmeri doro onye Igbo nke oge a anya n’ebughị ụzọ kpebie kpọmkwem ndị ndị ahụ bụ. Nkọwa nta na-egosi na Grik ji okwu abụọ nwere otu mgbọrọgwụ ma na-enye ụzọ ọzọ e nwere isi sụgharịa ya.
- issue: Ma τοῖς ἀνθρώποις ọ̀ bụ naanị ndị nwoke
  choice: ụmụ mmadụ
  alternative: ndị nwoke; mmadụ
  rationale: N’ebe a, ἄνθρωποι nwere ike ịgụnye mmadụ niile. ‘Ụmụ mmadụ’ bụ okwu Igbo ebumpụta ụwa nke na-echekwa echiche izugbe ahụ n’etinyeghị mmachi nwoke naanị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta. E zere ụdị okwu ochie na nkọwa ga-ekpebi onye ndị a dọtara n’agha bụ. Ahịrị bụ isi na-agụ were were, ebe nkọwa nta na-echekwa mgbagwoju anya na ike okwu Grik.
