revisions:
- from: Ya mere, ọ na-ekwu[a], “Mgbe ọ rịgoro n’ebe dị elu, ọ kpọọrọ ìgwè ndị a dọtara n’agha[b], nyekwa ụmụ mmadụ onyinye[c].”
  to: Ya mere, ọ na-ekwu[a], “Mgbe ọ rịgoro n’elu, ọ kpọọrọ ndị e jidere n’agha[b], nyekwa ụmụ mmadụ onyinye[c].”
  rationale: Removed the unsupported quantitative noun “ìgwè” while retaining an idiomatic rendering of the captive-taking image. Revised footnote b to state more clearly that the Greek uses a cognate verbal expression, preserves the Psalm 68:18 allusion, and supplies an idiomatic alternative without deciding who the captives are. The quotation formula and the generic sense of “ụmụ mmadụ” are retained.
