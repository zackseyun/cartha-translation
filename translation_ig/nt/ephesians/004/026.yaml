  text: Be angry[a], and do not sin. Do not let the sun go down on your anger[c][b],
translation:
  language: ig
  text: Nweenụ iwe[a], ma unu emehiela. Ka anyanwụ ghara ịda mgbe unu ka nọgidere n’iwe[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ bụrụ na iwe ewe unu, unu emehiela.” N’asụsụ Grik, okwu a bụ iwu n’ụdị ya (“Nweenụ iwe”), ma ụfọdụ na-aghọta ya n’ebe a dịka iwu e kwuru n’ụzọ nkwenye ọnọdụ.
    reason: alternative_reading
  - marker: b
    text: O yiri ka Pọl na-ekwughachi Abụ Ọma 4:4 (LXX 4:5), bụ́ ebe e jikọtara iwe na iwu ka mmadụ ghara ime mmehie.
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, “n’elu mkpasu iwe unu,” ma ọ bụ, “mgbe obi ka na-ewe unu ilu.” Okwu Grik ahụ nwere ike ịpụta mkpasu iwe ma ọ bụ ọnọdụ iwe/obi ilu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργίζεσθε
  choice: Wenụ iwe
  rationale: Nke a na-edobe ụdị iwu dị na Grik ma na-eme ka njikọ ya na Abụ Ọma 4:4 (LXX 4:5) pụta ìhè. Ọ naghị agbanwe ya ozugbo ka ọ bụrụ ọnọdụ, ‘Ọ bụrụ na iwe ewe unu.’
- source_word: μὴ ἁμαρτάνετε
  choice: ma unu emehiela
  rationale: Nke a bụ mmachibido iwu doro anya. ‘Ma’ na-egosi esemokwu dị n’etiti iwe na ime mmehie n’enweghị ịgbakwụnye nkọwa ozizi.
- source_word: ὁ ἥλιος
  choice: anyanwụ
  rationale: Ntụgharị kpọmkwem na nke sitere n’okwu a na-ejikarị eme ihe n’Igbo.
- source_word: μὴ ἐπιδυέτω
  choice: Ka ... ghara ịda
  rationale: Ụdị a na-ebute iwu onye nke atọ n’Igbo n’ụzọ eke ma na-edobe ike mmachibido iwu ahụ.
- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: mgbe unu ka nọ n’iwe
  rationale: παροργισμός nwere ike ịpụta iwe, mkpasu iwe, ma ọ bụ ọnọdụ obi ilu. N’ebe a, ntụgharị a na-agụ nke ọma n’Igbo ma na-egosi na iwe ahụ ekwesịghị ịdịgide ruo mgbe anyanwụ dara.
theological_decisions:
- issue: Ma a ga-atụgharị ahịrịokwu mbụ dịka iwu nke na-anabata iwe, ka ọ bụ dịka ọnọdụ na-ekwe ka iwe nwee ike ime
  choice: 'E debere ya dịka iwu: ‘Wenụ iwe, ma unu emehiela.’'
  alternative: ‘Ọ bụrụ na iwe ewe unu, unu emehiela.’
  rationale: 'Ụdị ngwaa Grik bụ iwu. Idebe ya otu a na-echekwa esemokwu dị n’amaokwu ahụ: e nyere iwu banyere iwe, ma a machibidoro mmehie iwu ozugbo, tinyekwa oke oge n’iwe ahụ.'
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Wenụ ... unu’ na-agwa ọtụtụ mmadụ okwu, dịka ụdị Grik si dị. E debere akara nkọwa ala ala [a], [b], na [c] niile n’ahịrịokwu isi.
