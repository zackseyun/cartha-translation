id: EPH.4.17
reference: Ephesians 4:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ ⸀τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/017.yaml
  text: 'Therefore I say this and testify in the Lord: you must no longer walk as the Gentiles walk[a], in the futility of their minds,'
translation:
  language: ig
  text: 'Ya mere, ana m ekwu nke a, na-agbakwa akaebe n’Onyenwe anyị: unu ekwesịghịzi ibi ndụ dị ka ndị mba ọzọ si ebi ndụ[a], n’ihe efu nke uche ha,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mba dị iche iche”; ụfọdụ nsụgharị na-asụgharị ἔθνη n’ebe a dị ka “ndị na-ekpere arụsị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο οὖν
  choice: Ya mere, ana m ekwu nke a
  rationale: “Ya mere” na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya, ebe “nke a” na-eburu ihe Τοῦτο na-arụtụ aka na ya.
- source_word: μαρτύρομαι
  choice: na-agbakwa akaebe
  rationale: Nke a na-echekwa echiche nke nkwupụta siri ike onye ahụ ji onwe ya gbaa akaebe, n’etinyeghị nkọwa karịrị okwu Grik.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: A hapụrụ ọdịdị nkebiokwu ahụ ka ọ gosipụta ọnọdụ ma ọ bụ ikike dị n’ime Onyenwe anyị nke Pọl ji ekwu okwu.
- source_word: μηκέτι ὑμᾶς περιπατεῖν
  choice: unu ekwesịghịzi ibi ndụ
  rationale: “Ekwesịghịzi” na-eme ka ike ndụmọdụ ahụ doo anya n’Igbo, ebe “ibi ndụ” na-enye echiche omume nke περιπατέω n’asụsụ Igbo dị ugbu a n’ụzọ ebumpụta ụwa.
- source_word: καθὼς καὶ τὰ ἔθνη περιπατεῖ
  choice: dị ka ndị mba ọzọ si ebi ndụ
  rationale: “Ndị mba ọzọ” bụ okwu Ndị Kraịst na-asụ Igbo maara maka ἔθνη, ma ihe odide ala peeji na-echekwa ụzọ ndị ọzọ e nwere isi ghọta ya. Ikwughachi “ibi ndụ” na-echekwa nkwughachi nke περιπατεῖν/περιπατεῖ.
- source_word: ἐν ματαιότητι
  choice: n’ihe efu
  rationale: “Ihe efu” na-egosi enweghị isi, enweghị uru, ma ọ bụ enweghị ihe ga-esi na ya pụta nke ματαιότης pụtara.
- source_word: τοῦ νοὸς αὐτῶν
  choice: nke uche ha
  rationale: “Uche” bụ okwu Igbo kwụ ọtọ maka νοῦς n’ebe a, ma ọ naghị agwakọta ya na okwu διάνοια nke amaokwu na-esote.
theological_decisions:
- issue: Ihe ἔθνη pụtara n’ọdịiche omume a na-agwa ọgbakọ nke ọtụtụ n’ime ha bụ ndị Jentaịl
  choice: ndị mba ọzọ
  alternative: mba dị iche iche; ndị na-ekpere arụsị
  rationale: Nhọrọ a na-echekwa ụdị aha Pọl ji akọwa ndị na-abụghị ndị Juu, n’ebughị ụzọ tinye ikpe okpukpe siri ike nke “ndị na-ekpere arụsị” nwere ike ịpụta. Ihe odide ala peeji na-egosi na a pụkwara ịsụgharị ya “mba dị iche iche.”
- issue: Ike nke infinitive περιπατεῖν mgbe λέγω καὶ μαρτύρομαι gasịrị
  choice: unu ekwesịghịzi ibi ndụ
  alternative: ka unu ghara ịdịkwa na-ebi ndụ
  rationale: “Ekwesịghịzi” na-egosi iwu ndụmọdụ Pọl n’ụzọ doro anya ma dị ebumpụta ụwa n’Igbo, n’etinyeghị echiche nkà mmụta okpukpe ọzọ na-abụghị ike agbamume dị na ahịrịokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ibi ndụ” kama ntụgharị okwu n’otu n’otu “ije ije,” n’ihi na ọ na-ebuga ihe atụ omume ahụ n’Igbo n’ụzọ doro anya. Akara [a] dị n’ahịrịokwu ahụ ma kwekọọ n’ihe odide ala peeji.
