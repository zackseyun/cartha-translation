    issue: Both footnote anchors are misplaced.
    rationale: Footnote a concerns the possible initial addition “Ma” and must be attached to the opening exhortation, rather than specifically to “obiọma.” Footnote b concerns the variant pronoun “anyị” for “unu” and must be attached to “unu,” not to “Mesaịa.”
