  text: ⸀γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, χαριζόμενοι ἑαυτοῖς καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: ig
  text: Na-emerenụ ibe unu obiọma[a], na-enwekwa ọmịiko sitere n’obi, na-agbagharakwa ibe unu, dị ka Chineke si gbaghara unu[b] n’ime Mesaịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ, “Ma na-emerenụ ibe unu obiọma.”
    reason: alternative_reading
  - marker: b
    text: Ụfọdụ ihe odide nwere “anyị” kama “unu.”
    reason: alternative_reading
lexical_decisions:
- source_word: γίνεσθε
  choice: Na-emere
  rationale: Ụdị iwu dị ugbu a na-akpọ ndị niile a na-agwa ka ha nọgide na-egosipụta àgwà a; “na-emere” bụ ụzọ Igbo dị ndụ si kwuo ya n’ọnọdụ a.
- source_word: εἰς ἀλλήλους
  choice: ibe unu
  rationale: Nke a na-egosi omume ndị kwere ekwe na-emere onwe ha n’otu n’otu, n’ụzọ Igbo na-ada nke ọma.
- source_word: χρηστοί
  choice: obiọma
  rationale: “Obiọma” na-egosi ịdị mma na ịdị nwayọọ n’otú mmadụ si emeso ibe ya.
- source_word: εὔσπλαγχνοι
  choice: na-enwekwa ọmịiko sitere n’obi
  rationale: Nke a na-echekwa echiche nke ebere miri emi nke si n’obi pụta, ma na-ekewapụ ya na “obiọma.”
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: na-agbaghara ibe unu
  rationale: N’ebe a χαρίζομαι pụtara ịgbaghara mmejọ, dịka ntụnyere ya na mgbaghara Chineke gosiri; ἑαυτοῖς nwere nghọta nke ime nke a n’etiti ibe ha.
- source_word: καθὼς καὶ
  choice: dị ka
  rationale: “Dị ka” na-enye ntụnyere ahụ n’Igbo dị mfe ma doo anya; ike nke καί dị n’ime ntụnyere siri ike ahụ n’enweghị itinye okwu na-adịghị ada nke ọma.
- source_word: ἐν Χριστῷ
  choice: n’ime Mesaịa
  rationale: A tụgharịrị Χριστός dịka aha-ọkwa “Mesaịa,” ebe “n’ime” na-echekwa okwu njikọ ἐν n’enweghị ịkọwa ya dịka “site n’aka.”
- source_word: ἐχαρίσατο ὑμῖν
  choice: gbaghara unu
  rationale: N’ọnọdụ a ngwaa ahụ na-ekwu maka mgbaghara Chineke nyere ndị a na-agwa; Igbo anaghị achọ okwu njikọ ọzọ tupu “unu.”
theological_decisions:
- issue: Nkọwa Χριστῷ dịka aha-ọkwa
  choice: Mesaịa
  alternative: Kraịst
  rationale: Χριστός na-arụ ọrụ dịka aha-ọkwa ebe a. “Mesaịa” na-eme ka ihe aha-ọkwa ahụ pụtara pụta ìhè, n’enweghị itinye nkọwa otu ụka pụrụ iche.
- issue: Uzo e si ghọta ἐν Χριστῷ
  choice: n’ime Mesaịa
  alternative: site n’aka Mesaịa
  rationale: “N’ime Mesaịa” na-echekwa obosara na ntakịrị mgbagwoju anya nke ἐν; “site n’aka” ga-akọwapụta ya naanị dịka onye e ji mee ihe.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro “na-” na-egosi ndụ na omume a ga-anọgide na-eme; “ọmịiko sitere n’obi” na-echekwa ọdịiche dị n’etiti χρηστοί na εὔσπλαγχνοι.
