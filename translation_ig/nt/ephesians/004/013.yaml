id: EPH.4.13
reference: Ephesians 4:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: ig
  text: ruo mgbe anyị niile ga-erute n’ịdị n’otu nke okwukwe[a] na n’ịmata[b] Ọkpara Chineke, ruo ịbụ otu nwoke tozuru oke[c], ruo n’ókè nke ogo[d] nke izu ezu nke Mezaya[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu a nwere ike ịrụtụ aka n’ozizi okwukwe Ndị Kraịst niile na-ekekọrịta, ma ọ bụ n’okwukwe na ntụkwasị obi nke ndị kwere ekwe.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ “ịmata nke ọma” ma ọ bụ “ịmata n’ụzọ miri emi.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ “ruo ntozu oke zuru ezu.” Grik kwuru kpọmkwem “otu nwoke tozuru oke,” jiri nwoke otu onye mee onyinyo ntozu oke nke nzukọ dum.
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ “ntozu oke” n’ọnọdụ “ogo.”
    reason: lexical_alternative
  - marker: e
    text: Grik bụ “Kraịst,” nke pụtara Onye E Tere Mmanụ. N’ebe a, a sụgharịrị ya “Mezaya” n’ihi na ọ pụtara ìhè dị ka utu aha.
    reason: alternative_reading
lexical_decisions:
- source_word: μέχρι
  choice: ruo mgbe
  rationale: Ọ na-egosi ebe ebumnuche ọrụ ịkwadebe ndị kwere ekwe nke amaokwu bu ụzọ ga-eru; ọ bụkwa okwu Igbo doro anya ma dị n’usoro.
- source_word: καταντήσωμεν οἱ πάντες
  choice: anyị niile ga-erute
  rationale: “Ga-erute” na-egosi ebumnuche a na-atụ anya iru, ebe “anyị niile” na-edobe nkwusi ike nke οἱ πάντες n’ahụ obodo ndị kwere ekwe dum.
- source_word: εἰς τὴν ἑνότητα τῆς πίστεως
  choice: n’ịdị n’otu nke okwukwe
  rationale: Nhọrọ a na-edobe echiche nke iru otu ịdị n’otu a kapịrị ọnụ, ma “okwukwe” anaghị ekpebi n’ike ma ọ bụ nkwenkwe ndị Kraịst na-ekekọrịta ka ọ bụ ntụkwasị obi ha nwere.
- source_word: ἐπιγνώσεως
  choice: ịmata
  rationale: “Ịmata” bụ okwu Igbo dị ndụ ma doo anya maka knowledge; e tinyere nkọwa ala peeji iji chekwaa echiche nwere ike ịdị na ya nke ịmata nke ọma ma ọ bụ n’ụzọ miri emi.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: Nke a na-asụgharị aha nsọ Kraịst ahụ ozugbo ma na-egosi na ọ bụ ya ka a na-amata.
- source_word: εἰς ἄνδρα τέλειον
  choice: ruo ịbụ otu nwoke tozuru oke
  rationale: “Otu nwoke” na-edobe onyinyo nwoke otu onye dị na Grik, ebe “tozuru oke” dabara n’ọnọdụ uto karịa “zuru oke” nke nwere ike ịpụta enweghị ntụpọ.
- source_word: μέτρον ἡλικίας
  choice: ókè nke ogo
  rationale: “Ókè” na-edobe echiche ihe a tụrụ atụ nke μέτρον, “ogo” na-echekwa onyinyo uto ma ghara ịmanye naanị echiche afọ ndụ.
- source_word: τοῦ πληρώματος
  choice: nke izu ezu
  rationale: “Izu ezu” na-echekwa ibu echiche nke πλήρωμα n’akwụkwọ Pọl n’ebughị ụzọ kọwaa ya n’ụzọ ga-emechi ọtụtụ nghọta o nwere ike inwe.
- source_word: τοῦ Χριστοῦ
  choice: nke Mezaya
  rationale: Χριστός na-arụ ọrụ dị ka utu aha n’ebe a; “Mezaya” na-eme ka echiche Onye E Tere Mmanụ pụta ìhè karịa iji ya nanị dị ka aha mmadụ.
theological_decisions:
- issue: Ihe τῆς πίστεως pụtara
  choice: okwukwe, nke nwere ike izo aka n’okwukwe Ndị Kraịst na-ekekọrịta
  alternative: okwukwe ma ọ bụ ntụkwasị obi nke ndị kwere ekwe na-egosipụta
  rationale: Ọnọdụ banyere ịdị n’otu nke obodo na-akwado nkwenkwe ha na-ekekọrịta, ma okwu Grik ahụ ka nwere ike ibu echiche okwukwe onwe onye; ya mere isi ederede anaghị akọwa ya gabiga ókè.
- issue: Onyinyo dị na εἰς ἄνδρα τέλειον
  choice: otu nwoke tozuru oke
  alternative: ntozu oke zuru ezu
  rationale: Grik ji nwoke otu onye mee onyinyo ntozu oke nke nzukọ dum. Idebe onyinyo ahụ na-echekwa ma ụdị okwu ahụ ma esemokwu dị n’etiti otu ahụ na otu onye.
- issue: Nsụgharị Χριστοῦ
  choice: Mezaya
  alternative: Kraịst
  rationale: N’ebe a, okwu ahụ bụ utu aha gbasara Onye Chineke Tere Mmanụ; “Mezaya” na-eme ka uru utu aha ahụ doo anya, ebe nkọwa ala peeji na-enye ụdị a na-ahụkarị “Kraịst.”
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A nọgidere na-emegharị “ruo” iji chekwaa usoro ebumnuche atọ nke εἰς, ma e zere okwu ụka pụrụ iche nke otu denominashọn. Akara ụda dị naanị n’ebe ọ na-enyere aka igbochi mgbagwoju anya (“ókè”).
