  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶς λόγος σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: ig
  text: Ka okwu rere ure ọ bụla ghara isi n’ọnụ unu pụta,[a] kama naanị okwu dị mma maka iwuli elu dịka mkpa dị,[b] ka o wee nye ndị na-anụ ya amara.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ka okwu rụrụ arụ ọ bụla ghara isi n’ọnụ unu pụta,” ma ọ bụ, “Ka okwu na-adịghị mma ọ bụla ghara isi n’ọnụ unu pụta.” N’asụsụ Grik, ihe e kwuru n’ụzọ nkịtị bụ “okwu rere ure.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “maka iwuli elu dịka mkpa si chọọ,” ma ọ bụ, “maka iwuli elu dịka o kwesịrị n’oge ahụ.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “ka o wee baara ndị na-anụ ya uru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: okwu rere ure ọ bụla ... ghara
  rationale: N’okpuru nkwusio a, πᾶς na-egosi na a gaghị ekwe ka ụdị okwu dị otú ahụ ọ bụla pụta. “Okwu rere ure” na-echekwa ihe atụ doro anya nke σαπρός, nke pụtara ihe rere ure ma ọ bụ mebiri emebi, kama ịtụgharị ya naanị dịka okwu ọjọọ.
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: ghara isi n’ọnụ unu pụta
  rationale: Nke a bụ mmachibido iwu banyere okwu na-esi n’ọnụ apụta. “Isi n’ọnụ unu pụta” bụ Igbo nkịtị ma na-echekwa ihe atụ anụ ahụ dị na Grik.
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: kama naanị okwu dị mma
  rationale: Ahịrịokwu Grik a hapụrụ λόγος ka a ghọta ya site n’ihe e kwuru tupu ya. Ikwughachi “okwu” na Igbo na-eme ka ahịrịokwu doo anya, ebe “naanị” na-egosipụta ọdịiche siri ike nke ἀλλά.
- source_word: πρὸς οἰκοδομὴν
  choice: maka iwulite mmadụ
  rationale: οἰκοδομή sitere n’ihe atụ nke iwu ụlọ, ma n’ebe a ọ pụtara ime ka mmadụ sie ike ma too. “Iwulite mmadụ” na-echekwa ihe atụ ahụ n’Igbo a na-aghọta nke ọma.
- source_word: τῆς χρείας
  choice: dịka mkpa dị
  rationale: χρεία pụtara mkpa ma ọ bụ ihe ọnọdụ chọrọ. Njikọ genitive ahụ dị mkpirikpi ma nwee ntakịrị mgbagwoju anya; “dịka mkpa dị” na-echekwa echiche nke okwu dabara mkpa dị ugbu a n’ebughị nkọwa karịrị ihe odide.
- source_word: ἵνα δῷ χάριν
  choice: ka o wee nye ... amara
  rationale: χάρις nwere ike ịpụta amara, ihu ọma, ma ọ bụ uru e nyere mmadụ. “Amara” na-echekwa mkpụrụokwu Pọl ji na ịdị omimi ya, ma nkọwa ala peeji na-egosi echiche ọzọ kwe omume nke uru.
- source_word: τοῖς ἀκούουσιν
  choice: ndị na-anụ ya
  rationale: Present participle ahụ na-ezo aka n’ebe ndị na-anụ okwu ahụ nọ. “Ndị na-anụ ya” bụ Igbo eke ma na-eme ka ihe nnọchiaha “o” n’ahịrịokwu ahụ doo anya.
theological_decisions:
- issue: Otu a ga-esi tụgharị χάριν n’ọdụmọdụ banyere okwu mmadụ
  choice: amara
  alternative: uru ma ọ bụ ihe ọma
  rationale: N’ebe a χάρις nwere ike ịbụ uru okwu ọma na-ewetara ndị na-anụ ya, ma “amara” na-echekwa njikọ ya na okwu Pọl na-ejikarị eme ihe, n’emeghị ka amaokwu ahụ kwuo ozizi karịrị ihe dị na ya. E tinyere ihe ọzọ kwe omume n’ala peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta. E chekwara ihe atụ “okwu rere ure” na “iwulite mmadụ,” ebe e zere okwu ụka siri ike ma ọ bụ nkọwa nke otu ụka pụrụ iche.
