source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/001.yaml
  text: Therefore I[a], the prisoner in the Lord, urge you to walk worthily of the calling with which you were called[b],
translation:
  language: ig
  text: Ya mere, mụ onwe m, onye mkpọrọ n’Onyenwe anyị[a], na-arịọsi unu ike ka unu na-eje ije n’ụzọ kwesịrị ọkpụkpọ ahụ e ji kpọọ unu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye mkpọrọ nke Onyenwe anyị” ma ọ bụ “onye mkpọrọ n’ihi Onyenwe anyị.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ka unu bie ndụ n’ụzọ dabara n’ọkpụkpọ e ji kpọọ unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: na-arịọsi unu ike
  rationale: Nke a na-egosipụta arịrịọ siri ike nke onye na-adụ ndị ọzọ ọdụ, ọ bụghị naanị arịrịọ nkịtị.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ndụmọdụ a na ihe Pọl kọwara tupu ya, ma na-egosipụta nkwubi okwu sitere na ya.
- source_word: δέσμιος
  choice: onye mkpọrọ
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa ihe δέσμιος pụtara kpọmkwem.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Nsụgharị a na-edowe akpaalaokwu Pọl n’ụdị sara mbara, n’akọwaghị ya naanị dị ka ‘n’ihi Onyenwe anyị’ ma ọ bụ ‘onye mkpọrọ nke Onyenwe anyị.’
- source_word: ἀξίως
  choice: n’ụzọ kwesiri
  rationale: Ọ na-egosi ibi ndụ n’ụzọ dabara n’ọkwa ma ọ bụ ọkpụkpọ e nyere mmadụ.
- source_word: περιπατῆσαι
  choice: ka unu na-eje ije
  rationale: Nke a na-echekwa ihe atụ Pọl ji ije kọwaa omume na ụzọ ndụ mmadụ, ma ọ ka bụkwa okwu ndị na-agụ Baịbụl n’Igbo ga-aghọta.
- source_word: κλήσεως
  choice: ọkpụkpọ
  rationale: ‘Ọkpụkpọ’ na-egosipụta ịkpọ mmadụ nke ọma ma na-echekwa njikọ okwu dị n’etiti κλῆσις na ἐκλήθητε.
- source_word: ἧς ἐκλήθητε
  choice: ahụ e ji kpọọ unu
  rationale: Nke a na-echekwa njikọ dị n’etiti ọkpụkpọ ahụ na ịkpọ ha, na-agbakwụnyeghị onye kpọrọ ha n’agbanyeghị na ihe gbara amaokwu ahụ gburugburu na-egosi ya.
theological_decisions:
- issue: Ihe ὁ δέσμιος ἐν κυρίῳ pụtara n’ụzọ zuru ezu
  choice: onye mkpọrọ n’ime Onyenwe anyị
  alternative: onye mkpọrọ nke Onyenwe anyị; onye mkpọrọ n’ihi Onyenwe anyị
  rationale: A hapụrụ ‘n’ime Onyenwe anyị’ ka ọ ghara ikwubi ma okwu ahụ na-egosi nnweta, ihe kpatara mkpọrọ ahụ, ma ọ bụ njikọ Pọl na Onyenwe anyị.
- issue: Onye mere ịkpọ ahụ
  choice: e ji kpọọ unu
  alternative: Chineke kpọrọ unu
  rationale: Grik ji olu nnara eme ihe, ọ kpọghịkwa onye kpọrọ ha aha n’amaokwu a. Nsụgharị ahụ anaghị etinye ‘Chineke’ n’ahịrị isi, ọ bụ ezie na ihe gbara ya gburugburu na-egosi na ọ bụ Chineke kpọrọ ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Na-eje ije’ na-echekwa ihe atụ Grik gbasara ụzọ ndụ; ihe odide ala peeji nyere ụdị okwu Igbo kwụ ọtọ karịa, bụ ‘bie ndụ.’
