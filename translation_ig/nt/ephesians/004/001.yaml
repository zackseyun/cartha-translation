revisions:
- from: Ya mere, mụ onwe m, onye mkpọrọ n’ime Onyenwe anyị[a], na-arịọsi unu ike ka unu na-eje ije n’ụzọ kwesiri ọkpụkpọ ahụ e ji kpọọ unu[b].
  to: Ya mere, mụ onwe m, onye mkpọrọ n’Onyenwe anyị[a], na-arịọsi unu ike ka unu na-eje ije n’ụzọ kwesịrị ọkpụkpọ ahụ e ji kpọọ unu[b].
  rationale: 'Only a safe idiomatic correction is required: n’ime is replaced by n’ to avoid imposing a spatial meaning on ἐν κυρίῳ. The revised text keeps the Greek metaphor of walking, the force of the appeal, the calling/called wordplay as far as Igbo permits, and the passive ambiguity concerning the caller. Footnote anchors and markers remain correctly placed.'
  reviewer_model: gpt-5.6-terra
