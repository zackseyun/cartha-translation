revisions:
- from: Ma e nyere onye ọ bụla n’ime anyị amara dịka otu onyinye Mesaịa ahụ hà.[a]
  to: Ma e nyere onye ọ bụla n’ime anyị amara dịka oke onyinye Mesaịa si dị.[a]
  rationale: Revised only the measure clause to a clear, idiomatic Standard Igbo expression of proportion and removed the unneeded demonstrative after 'Mesaịa.' The translation continues to preserve the Greek wording’s theological vocabulary and the open possessive/genitive relation of 'the Messiah’s gift.'
  reviewer_model: gpt-5.6-terra
