source:
  edition: SBLGNT
  text: Ἑνὶ δὲ ἑκάστῳ ἡμῶν ἐδόθη ⸀ἡ χάρις κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/007.yaml
  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: ig
  text: Ma e nyere onye ọ bụla n’ime anyị amara dịka oke onyinye Mesaịa si dị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onyinye Kraịst.” Okwu Grik bụ Χριστοῦ; a pụrụ ịsụgharị ya “Kraịst” mgbe ọ na-arụ ọrụ dịka aha, ma “Mesaịa” na-echekwa ihe aha-ọkwa ahụ pụtara n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑνὶ δὲ ἑκάστῳ ἡμῶν
  choice: Ma ... onye ọ bụla n’ime anyị
  rationale: Nkebi a na-ekesa ihe n’otu n’otu ma na-emesi onye nke ọ bụla ike n’etiti ọgbakọ dum; “onye ọ bụla n’ime anyị” na-egosipụta nke a n’Igbo ebumpụta ụwa.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị ntụgharị site n’ịdị n’otu e kwuru n’amaokwu ndị bu ụzọ gaa n’ụdị onyinye dị iche iche e nyere ndị mmadụ n’otu n’otu.
- source_word: ἐδόθη
  choice: e nyere
  rationale: Nke a na-edobe aorist passive dị ka omume gara aga n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: ἡ χάρις
  choice: amara
  rationale: “Amara” na-edobe okwu Pọl ji maka ihe ọma Chineke na-enye, ebe ihe gbara amaokwu ahụ gburugburu na-egosi na ọ gụnyere inye ike ma ọ bụ onyinye maka ije ozi.
- source_word: κατὰ τὸ μέτρον
  choice: dịka otu ... hà
  rationale: Nke a na-egosi ụkpụrụ ma ọ bụ oke e ji kesaa amara ahụ, ma na-ada ka Igbo a na-asụ ugbu a.
- source_word: τῆς δωρεᾶς
  choice: onyinye
  rationale: “Onyinye” na-egosi ihe e nyere n’efu n’enweghị ikwughachi echiche ahụ n’ụzọ na-adịghị mkpa.
- source_word: τοῦ Χριστοῦ
  choice: Mesaịa ahụ
  rationale: Χριστός ka na-arụ ọrụ dịka aha-ọkwa n’ebe a; “Mesaịa” na-echekwa ihe aha-ọkwa ahụ pụtara, ebe “ahụ” na-eme ka ntụaka ahụ doo anya n’Igbo.
theological_decisions:
- issue: Ihe “amara” pụtara n’ebe a
  choice: E debere “amara” n’ederede, ebe ọnọdụ amaokwu ahụ na-egosi amara e kenyere onye ọ bụla maka onyinye na ije ozi n’ọgbakọ.
  alternative: Ịsụgharị ya ozugbo dịka “onyinye amara” ma ọ bụ ime ka ọ bụrụ naanị amara nzọpụta.
  rationale: Nke a na-echekwa okwu nkà mmụta okpukpe Pọl na esemokwu ya, n’emeghị ka ihe ọ pụtara bụrụ naanị otu nkọwa.
- issue: Mmekọrịta genitive dị na “τῆς δωρεᾶς τοῦ Χριστοῦ”
  choice: “onyinye Mesaịa ahụ”
  alternative: Onyinye e nyere Mesaịa ahụ, ma ọ bụ onyinye nke bụ Mesaịa ahụ n’onwe ya.
  rationale: Ọnọdụ ahụ na-akwado nke ọma na Mesaịa bụ onye na-enye ma ọ bụ onye nwe onyinye ahụ, ma ọdịdị genitive n’onwe ya anaghị akọwa mmekọrịta ahụ n’ụzọ zuru ezu; nsụgharị ahụ na-edobe ohere ahụ.
- issue: Nsụgharị Χριστοῦ
  choice: Mesaịa ahụ
  alternative: Kraịst
  rationale: N’ebe a, aha-ọkwa ahụ ka nwere ihe ọ pụtara doro anya; “Mesaịa” na-ebufe ihe Χριστός pụtara kama iji naanị ntụgharị mkpụrụokwu.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “dịka otu ... hà” kama okwu teknụzụ siri ike iji gosipụta echiche nke μέτρον n’ụzọ nkịtị; e debere “amara” iji chekwaa ịdị arọ nke okwu Pọl.
