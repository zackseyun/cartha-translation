  text: εἴ γε αὐτὸν ἠκούσατε καὶ ἐν αὐτῷ ἐδιδάχθητε, καθώς ἐστιν ἀλήθεια ἐν τῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/021.yaml
  text: if indeed you heard him and were taught in him[a], just as truth is in Jesus[b],
translation:
  language: ig
  text: ọ bụrụ n’ezie na unu nụrụ ya[a], na a kụziirikwa unu ihe n’ime ya[b], dị ka eziokwu dị n’ime Jizọs[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu nụrụ banyere ya.” N’ụzọ nkịtị, Grik sịrị, “unu nụrụ ya”; o yikarịrị ka ọ na-egosi na, n’ozi ndịozi, ha nụrụ Kraịst n’onwe ya n’ezie.
    reason: alternative_reading
  - marker: b
    text: Nkebiokwu ndị a, “n’ime ya” na “n’ime Jizọs,” nwere ike igosi ọnọdụ, ịdị n’otu, ma ọ bụ mmekọrịta chiri anya; okwu Grik ahụ na-ahapụ nghọta sara mbara karịa naanị “site n’aka ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: ọ bụrụ n’ezie
  rationale: Nke a na-edobe ọdịdị okwu ọnọdụ dị na Grik, tinyere ntakịrị nkwusi ike nke γε, n’ebughị ụzọ gbanwee ya ka ọ bụrụ ‘ebe ọ bụ na.’
- source_word: αὐτὸν ἠκούσατε
  choice: unu nụrụ ya
  rationale: αὐτόν bụ kpọmkwem ihe nnara nke ngwaa ahụ; ya mere, ‘unu nụrụ ya’ na-edobe usoro Grik ahụ na nkwupụta ya pụrụ iche.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Nhọrọ a na-edobe ἐν ma na-ahapụ ka ọ nwee echiche nke ọnọdụ, ịdị n’otu, ma ọ bụ mmekọrịta chiri anya, kama ịkọwa ya nanị dịka onye mere ihe ahụ.
- source_word: ἐδιδάχθητε
  choice: bụrụkwa ndị a kụziiri ihe
  rationale: 'Nke a na-egosi nke ọma na ngwaa ahụ nọ n’ụdị nnara: ọ bụ ha ka a kụziiri ihe.'
- source_word: καθώς
  choice: dị nnọọ ka
  rationale: Ọ na-edobe ike ntụnyere nke καθώς n’etiti ihe a kụziiri ha na eziokwu dị n’ime Jizọs.
- source_word: ἀλήθεια
  choice: eziokwu
  rationale: Aha ahụ enweghị artikụl na Grik; ‘eziokwu’ na-edobe ịdị mfe na obosara okwu ahụ n’etinyeghị ‘eziokwu ahụ.’
- source_word: ἐν τῷ Ἰησοῦ
  choice: n’ime Jizọs
  rationale: Nke a na-edobe aha onwe onye ‘Jizọs’ na preposishọn ἐν, na-ahapụ obosara echiche nke ọnọdụ, ịdị n’otu, ma ọ bụ mmekọrịta chiri anya.
theological_decisions:
- issue: Ma αὐτὸν ἠκούσατε ọ pụtara ‘unu nụrụ ya’ ka ọ bụ ‘unu nụrụ banyere ya.’
  choice: unu nụrụ ya
  alternative: unu nụrụ banyere ya
  rationale: Usoro Grik nwere ‘ya’ dịka kpọmkwem ihe nnara, ọ nweghịkwa preposishọn pụtara ‘banyere.’ Nhọrọ a na-edobe ike nke okwu ahụ, ma ihe e dere n’ala peeji na-echekwa nghọta ọzọ enwere ike.
- issue: Otu e si akọwa ἐν αὐτῷ na ἐν τῷ Ἰησοῦ.
  choice: n’ime ya / n’ime Jizọs
  alternative: site n’aka ya / n’ịdị n’otu na Jizọs
  rationale: ‘N’ime’ na-edobe ihe okwu Grik nwere ike ịpụta banyere ọnọdụ, ịdị n’otu, ma ọ bụ mmekọrịta chiri anya, na-akọwaghị ya naanị dịka onye na-akụzi ihe.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ugwu ma dị mfe nghọta. E debere ‘n’ime’ ugboro abụọ iji chekwaa njikọ okwu na mgbagwoju echiche dị na Grik. Akara [b] pụtara n’ebe abụọ n’ahịrị ahụ n’ihi na otu nkọwa ala peeji ahụ metụtara ahịrịokwu abụọ ahụ.
