  yaml_path: translation/nt/ephesians/004/012.yaml
  text: for the equipping of the saints for the work of ministry[a], for the building up of the body of Messiah[c][b],
translation:
  language: ig
  text: iji kwadebe ndị nsọ maka ọrụ ije ozi[a], maka iwulite ahụ Mesaịa[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “maka ọrụ ozi.” Okwu Grik διακονία nwere ike ịpụta “ije ozi” ma ọ bụ “ozi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ahụ Kraịst.” N’ebe a, a sụgharịrị aha ọkwa Grik Χριστός dịka “Mesaịa.”
    reason: alternative_reading
  - marker: c
    text: 'A pụkwara ịghọta okwu Grik ahụ dịka usoro na-aga n’ihu: “iji kwadebe ndị nsọ maka ọrụ ije ozi, iji wulite ahụ Mesaịa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: iji kwadebe
  rationale: Nkebi a na-egosi nzube, ebe καταρτισμός pụtara ime ka mmadụ dị njikere ma ruo eru maka ọrụ; “iji kwadebe” bụ Igbo doro anya ma dị ugbu a.
- source_word: τῶν ἁγίων
  choice: ndị nsọ
  rationale: Nke a bụ okwu Pọl ji akpọ ndị e kewapụrụ nye Chineke; “ndị nsọ” na-edebe okwu ahụ n’enweghị echiche na ọ bụ naanị ndị e mesịrị kwupụtara dị ka ndị nsọ.
- source_word: εἰς ἔργον διακονίας
  choice: maka ọrụ ije ozi
  rationale: διακονία nwere ike ịpụta ije ozi ma ọ bụ ozi; “ọrụ ije ozi” na-egosi ọrụ a na-arụ maka ndị ọzọ, ọ naghịkwa ekewa ya nye naanị ndị ụkọchukwu ma ọ bụ ndị ndu.
- source_word: εἰς οἰκοδομὴν
  choice: maka iwulite
  rationale: οἰκοδομή na-eji ihe atụ nke iwu ụlọ akọwa ime ka ọgbakọ sie ike ma too; “iwulite” na-edebe ihe atụ ahụ n’Igbo nkịtị.
- source_word: τοῦ σώματος
  choice: ahụ
  rationale: σῶμα pụtara “ahụ,” ma n’ebe a ọ bụ ihe atụ maka ndị kwere ekwe dịka otu nzukọ.
- source_word: τοῦ Χριστοῦ
  choice: Mezaya
  rationale: Χριστός bụ aha ọkwa pụtara Onye E Tere Mmanụ; “Mezaya” na-echekwa ọrụ ya dịka aha ọkwa, ebe “Kraịst” ka bụ ntụgharị ọzọ a na-ahụkarị.
theological_decisions:
- issue: 'Mmekọrịta nkebi nzube atọ: πρὸς ... εἰς ... εἰς'
  choice: 'E debere nkebi abụọ dị na amaokwu a dịka nzube ndị yiri ibe ha: “iji kwadebe ... maka ọrụ ... maka iwulite ...”'
  alternative: 'A pụkwara ịghọta ya dịka usoro na-aga n’ihu: a kwadebere ndị nsọ ka ha jee ozi, ije ozi ahụ wee wulite ahụ Mezaya.'
  rationale: Usoro Grik ahụ nwere ike ịkwado nghọta abụọ ahụ. Nsụgharị bụ isi na-agbasochi nhazi ya anya, ebe nkọwa ala peeji na-echekwa nghọta usoro ahụ n’enweghị ikpebi esemokwu banyere onye na-arụ ọrụ ije ozi.
- issue: Ntughari Χριστός dịka aha ọkwa
  choice: Mezaya
  alternative: Kraịst
  rationale: N’ebe a, Χριστός na-egosi onye ahụ nke ahụ ahụ bụ nke ya, ma ọ ka na-arụ ọrụ dịka aha ọkwa. “Mezaya” na-eme ka echiche nke Onye E Tere Mmanụ pụta ìhè; “Kraịst” ka e nyere dịka nhọrọ ọdịnala.
translation_notes:
  register: Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. “Ije ozi” bụ okwu sara mbara nke na-adịghị egbochi ọrụ ahụ nye ndị ndu ụka naanị. E debere ihe atụ nke iwulite ahụ, ọ bụ ezie na ọ bụ ihe atụ agwakọtara dịka ọ dị n’isi mmalite.
