lexical_decisions:
- source_word: ὑμεῖς
  choice: unu
  rationale: Nnọchiaha onye nke abụọ n’ọnụọgụ ọtụtụ; ọ na-egosi ndị a na-agwa okwu ma na-akwado ọdịiche dị n’ahịrịokwu ahụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche n’etiti ndụ ndị mba ọzọ a kọwara tupu nke a na ihe ndị na-agụ akwụkwọ mụtara.
- source_word: οὐχ οὕτως
  choice: n'ụzọ dị otú a ...ghị
  rationale: Usoro a na-egosi na ihe a na-ajụ bụ ụzọ ma ọ bụ otu e si mee ya; Igbo na-etinye akara njụ n’ime ngwaa.
- source_word: ἐμάθετε
  choice: amụtaghị
  rationale: A họọrọ ngwaa pụtara ‘mụ’ kpọmkwem, kama ịsụgharị ya dịka ‘a kuziri unu’ ma ọ bụ ‘unu bịara mara,’ bụ́ ndị ga-agbakwụnye echiche na-adịghị n’okwu a.
- source_word: τὸν Χριστόν
  choice: Mesaịa
  rationale: A na-edobe Χριστός dịka utu aha nke onye ahụ e tere mmanụ. A hapụrụkwa okwu Pọl pụrụ iche banyere ‘ịmụ Mesaịa’ n’enweghị ịkọwa ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Ịsụgharị Χριστόν dịka utu aha ma ọ bụ dịka aha a na-akpọkarị ya
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a, ‘Mesaịa’ na-echekwa echiche nke onye ahụ e tere mmanụ, ma ọ naghị agbakwunye ‘Jizọs,’ nke na-adịghị n’ahịrịokwu Grik. E tinyere ‘Kraịst’ n’ala peeji dịka ntụgharị ọzọ a na-anabata.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọpụrụ ma doo ndị nkịtị anya. E chekwara usoro okwu Pọl pụrụ iche, ‘ịmụ Mesaịa,’ kama ịgbanwe ya ka ọ bụrụ nkọwa sara mbara.
