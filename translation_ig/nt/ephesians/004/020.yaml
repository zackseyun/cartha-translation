  text: But you did not learn Messiah in this way,[a]
translation:
  language: ig
  text: Ma unu amụtaghị Mesaịa n'ụzọ dị otú a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ma unu amụtaghị Kraịst n'ụzọ dị otú a.”
