  to: Ọ bụkwa site na ya ka ahụ dum, nke a na-ejikọta ma na-ejidesi ọnụ site ná nkwonkwo ọ bụla na-enye nkwado[a], na-eme ka ahụ too, dị ka akụkụ ya nke ọ bụla si arụ ọrụ n’ókè nke ya[b], ka ahụ wee na-ewuli onwe ya elu n’ịhụnanya.
  rationale: 'E megharịrị naanị okwu abụọ na-enweghị nkwado kpọmkwem n’isi mmalite: “site n’aka ya” ghọrọ “site na ya,” ma wepụ “nke ọma.” E dekwara nkọwa ala peeji b n’usoro Igbo doro anya karị, ka o wee gosipụta na “n’ókè” metụtara akụkụ nke ọ bụla. Ihe ndị ọzọ, gụnyere isi mmalite uto sitere na Kraịst, ịrụkọ ọrụ nke akụkụ ọ bụla, na ihe atụ nke iwuli ahụ elu n’ịhụnanya, ka edobere.'
