  verdict: revise
  source_fidelity: 'A chọrọ mmezi abụọ iji kwekọọ kpọmkwem na Grik: “site n’aka ya” na-eme ka ἐξ οὗ bụrụ ihe dị ka ụzọ sitere n’aka mmadụ, ebe “site na ya” na-ekwu “site n’ebe ọ nọ / from whom” n’enweghị mgbakwunye. Ọzọkwa, “nke ọma” na-agbakwunye echiche na-adịghị na συναρμολογούμενον. Usoro nke isiokwu—ahụ dum na-eme uto ya—ka edobere.'
