source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: ig
  text: Ọ bụkwa site na ya ka ahụ dum, nke a na-ejikọta ma na-ejidesi ọnụ site ná nkwonkwo ọ bụla na-enye nkwado[a], na-eme ka ahụ too, dị ka akụkụ ya nke ọ bụla si arụ ọrụ n’ókè nke ya[b], ka ahụ wee na-ewuli onwe ya elu n’ịhụnanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site ná njikọ ọ bụla na-enye ihe dị mkpa,” ma ọ bụ “site n’akwara njikọ ọ bụla na-enye nkwado.”
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ dị nso n’okwu Grik: “dị ka ọrụ akụkụ nke ọ bụla si dị n’ókè ya.”'
    reason: source_form
lexical_decisions:
- source_word: ἐξ οὗ
  choice: site n’aka ya
  rationale: Onye okwu a na-arụtụ aka na ya bụ Kraịst n’amaokwu bu ụzọ. Nsụgharị a na-egosi na ahụ na-enweta isi mmalite uto ya n’aka ya, ma na-edebekwa ya dị ka onye, ọ bụghị ihe.
- source_word: πᾶν τὸ σῶμα
  choice: ahụ dum
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa ihe e ji ekwu ahụ niile dịka otu ihe jikọrọ ọnụ.
- source_word: συναρμολογούμενον καὶ συμβιβαζόμενον
  choice: nke a na-ejikọta nke ọma ma na-ejidesikwa ọnụ
  rationale: 'Ọ na-echekwa echiche abụọ ahụ: ido akụkụ dị iche iche n’usoro ka ha jikọọ, na ime ka ha nọgide bụrụ otu.'
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: site ná nkwonkwo ọ bụla na-enye nkwado
  rationale: “Nkwonkwo” na-edobe ihe atụ nke ahụ, ebe “na-enye nkwado” na-egosi echiche nke ihe a na-eweta ma ọ bụ nke a na-enye. Ihe ndị ọzọ okwu Grik a pụrụ ịpụta dị na nkọwa ala peeji.
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: dị ka akụkụ ya nke ọ bụla si arụ ọrụ n’ókè nke ya
  rationale: Nke a na-egosi na akụkụ nke ọ bụla na-arụ ọrụ nke ya n’ókè kwesịrị ya, n’agbanyeghị na okwu “kwesịrị” adịghị n’ahịrị Grik. Ya mere, a hapụrụ ya pụọ ma tinye nsụgharị dị nso n’okwu Grik na nkọwa ala peeji.
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: na-eme ka ahụ too
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi kwuo na ahụ na-eweta uto nke ya, ma ọ bụ na-akpata uto ahụ.
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ
  choice: ka ahụ wee na-ewuli onwe ya elu
  rationale: Ọ na-edobe ma ihe atụ nke iwuli elu ma ike nnọchi onwe nke ἑαυτοῦ.
- source_word: ἐν ἀγάπῃ
  choice: n’ịhụnanya
  rationale: Ọ bụ nsụgharị Igbo kwụ ọtọ ma doo anya nke ἀγάπη n’ebe a.
theological_decisions:
- issue: Isi mmalite na onye na-arụ ọrụ n’uto ahụ
  choice: “Site n’aka ya” na-egosi Kraịst dịka isi mmalite, ebe “ahụ dum ... na-eme ka ahụ too” na-edobe ahụ dịka onye na-arụkọ ọrụ n’uto ahụ site n’ọrụ akụkụ ya niile.
  alternative: Ịsụgharị ἐξ οὗ dị ka ihe na-abụghị onye, ma ọ bụ ime ka ọ dị ka nanị Kraịst ma ọ bụ nanị akụkụ ahụ bụ onye na-arụ ọrụ ahụ.
  rationale: Ọdịdị okwu Grik na ihe e kwuru n’amaokwu 15 na-akwado Kraịst dịka onye okwu ahụ na-arụtụ aka na ya. N’otu oge ahụ, isiokwu nke ποιεῖται bụ “ahụ dum”; ya mere, e debere ma isi mmalite sitere na Kraịst ma ọrụ akụkụ ahụ nke ọ bụla.
- issue: Ihe atụ nke ahụ n’okwu ἁφῆς τῆς ἐπιχορηγίας
  choice: E ji “nkwonkwo ọ bụla na-enye nkwado” debe ihe atụ ahụ n’ederede.
  alternative: “Njikọ ọ bụla na-enye ihe dị mkpa” ma ọ bụ “akwara njikọ ọ bụla na-enye nkwado.”
  rationale: Okwu Grik ahụ nwere ike ịrụtụ aka na nkwonkwo, njikọ, ma ọ bụ ihe na-ejikọta ma na-eweta ihe dị mkpa. E kwesịghị ime ka otu nkọwa ahụ sie ike karịa ka isi mmalite si mee; ya mere, e depụtara ụzọ ndị ọzọ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “ahụ dum,” “nkwonkwo,” na “na-ewuli onwe ya elu” iji debe ihe atụ Pọl ji mee ihe, ma a zere okwu ụka pụrụ iche ma ọ bụ nkọwa nke otu òtù okwukwe.
