  text: from whom every family in heaven and on earth is named,[a]
translation:
  language: ig
  text: Ezinụlọ ọ bụla n’eluigwe na n’ụwa na-enweta aha ya site n’aka ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ezinụlọ dum n’eluigwe na n’ụwa na-enweta aha ya site n’aka ya”; ma ọ bụ, n’ụzọ na-akọwa ihe ọ pụtara karịa, “ịbụ nna niile n’eluigwe na n’ụwa na-enweta aha ya site n’aka ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξ οὗ
  choice: si n’aka ya
  rationale: Nke a na-egosipụta isi mmalite n’ụzọ Igbo dị ndụ, ma na-ejikọta ya nke ọma na okwu gbasara inweta aha.
- source_word: πᾶσα
  choice: ọ bụla
  rationale: Ya na aha otu ihe nọ, ọ na-enye nghọta nkesa, ya bụ ‘ezinụlọ ọ bụla,’ kama ime ka a ghọta ya dị ka naanị otu nnukwu ezinụlọ.
- source_word: πατριὰ
  choice: ezinụlọ
  rationale: Okwu Grik a na-ezo aka n’òtù ezinụlọ, agbụrụ, ma ọ bụ usoro ụmụ nna ochie. ‘Ezinụlọ’ bụ okwu kacha doo ndị Igbo anya, ma ihe ndị ọzọ nwere ike ịpụta ka edobere n’okpuru peeji.
- source_word: ἐν οὐρανοῖς
  choice: dị n’eluigwe
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu ebe dị n’ógbè eluigwe, n’agbanyeghị na okwu Grik ahụ dị n’ụdị ọtụtụ.
- source_word: ἐπὶ γῆς
  choice: dị n’ụwa
  rationale: Ọ bụ nsụgharị doro anya ma bụrụkwa nke a na-asụkarị maka ebe dị n’ụwa.
- source_word: ὀνομάζεται
  choice: nwetara aha ya
  rationale: Okwu ahụ bụ ngwaa ugbu a n’ụdị nnabata, nke pụtara ‘a na-akpọ aha.’ N’Igbo, ‘si n’aka ya nweta aha ya’ na-egosipụta ma ịkpọ aha ma mmekọrịta nke isi mmalite, n’enweghị ịkọwapụta ihe karịrị akarị.
theological_decisions:
- issue: Ihe πᾶσα πατριὰ pụtara n’ihe gbasara Nna ahụ e kwuru okwu ya n’amaokwu bu ụzọ
  choice: ezinụlọ ọ bụla
  alternative: ezinụlọ ahụ dum; ịbụ nna niile
  rationale: A hapụrụ ‘ezinụlọ’ ka ọ bụrụ ihe okwu ahụ na-apụtakarị, ma chekwaa ike nkesa nke πᾶσα. Nke a anaghị ekpebi n’amaghị ama na Pọl na-ekwu maka naanị otu ezinụlọ jikọrọ ọnụ, ma ọ bụ na ọ na-ekwu naanị maka echiche nkịtị nke ‘ịbụ nna.’ Ihe jikọrọ πατήρ na πατριά ka a na-ahụ n’echiche nke aha si n’aka Nna ahụ abịa.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu na-asụ nke ọma n’Igbo, ma e debere nghọtahie ziri ezi nke πᾶσα πατριὰ n’okpuru peeji.
