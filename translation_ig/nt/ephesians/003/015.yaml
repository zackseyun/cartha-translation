review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies πατριά as ‘ezinụlọ’ and retains the source/derivation relationship in ἐξ οὗ ... ὀνομάζεται. However, the opening word ‘onye’ makes the main clause mean ‘every family person,’ rather than ‘every family,’ and must be removed. The revised wording retains the distributive ambiguity of πᾶσα and does not overstate the naming nuance.
  naturalness: ‘Ezinụlọ ọ bụla n’eluigwe na n’ụwa na-enweta aha ya site n’aka ya’ is clear, idiomatic Standard Igbo. It avoids the unnatural and semantically erroneous ‘onye ezinụlọ ọ bụla.’
  terminology: ‘ezinụlọ’ is an appropriate primary equivalent for πατριά. ‘site n’aka ya’ naturally expresses origin from the Father without forcing an abstract reading of ‘fatherhood.’ The footnote preserves the alternatives without placing them in the main text.
  issues:
  - severity: high
    issue: The main text begins ‘onye ezinụlọ ọ bụla.’
    rationale: Onye means ‘person’ and changes the grammatical subject and meaning from ‘every family’ (πᾶσα πατριά) to something like ‘every family member/person.’ The same error occurs in both alternatives in the footnote.
  - severity: medium
    issue: The locative coordination ‘dị n’eluigwe na nke dị n’ụwa’ is unnecessarily heavy.
    rationale: The Greek construction modifies ‘every family’ with the coordinated locations. ‘n’eluigwe na n’ụwa’ expresses this directly and naturally in Igbo.
  revised_text: Ezinụlọ ọ bụla n’eluigwe na n’ụwa na-enweta aha ya site n’aka ya.[a]
