- from: onye ezinụlọ ọ bụla dị n’eluigwe na nke dị n’ụwa si n’aka ya nweta aha ya.[a]
  to: Ezinụlọ ọ bụla n’eluigwe na n’ụwa na-enweta aha ya site n’aka ya.[a]
  rationale: Removed the meaning-changing ‘onye’ from the main text and footnote, simplified the coordinated locatives, and retained ‘enweta aha ya site n’aka ya’ as an idiomatic rendering of the source’s naming-and-origin relationship. The footnote continues to mark ‘the whole family’ and the more interpretive ‘all fatherhood’ as alternatives rather than resolving the ambiguity in the text.
