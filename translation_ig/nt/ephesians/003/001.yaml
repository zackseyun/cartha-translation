id: EPH.3.1
reference: Ephesians 3:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τούτου χάριν ἐγὼ Παῦλος ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ ὑπὲρ ὑμῶν τῶν ἐθνῶν—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/001.yaml
  text: For this reason I[a], Paul[c][b], the prisoner of Messiah Jesus on behalf of you Gentiles—
translation:
  language: ig
  text: N’ihi nke a, mụ onwe m, Pọl, onye mkpọrọ nke Mesaịa Jizọs[a] n’ihi unu bú ndị mba ọzọ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Kraịst Jizọs.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τούτου χάριν
  choice: N’ihi nke a
  rationale: Nke a bụ ụzọ e si ekwu okwu n’Igbo nke na-ezo aka n’ihe e kwuru tupu ya ma na-egosi ihe kpatara okwu na-esonụ.
- source_word: ἐγὼ Παῦλος
  choice: mụ onwe m, Pọl
  rationale: “Mụ onwe m” na-egosipụta nkwusi ike dị na nnọchiaha Grik ahụ; itinye “Pọl” n’akụkụ ya na-edobe nkọwa onye na-ekwu okwu.
- source_word: ὁ δέσμιος
  choice: onye mkpọrọ
  rationale: Nke a na-akọwa onye e jidere ma debe n’ụlọ mkpọrọ n’ụzọ doro anya ma dị mfe nghọta.
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: nke Mesaịa Jizọs
  rationale: “Mesaịa” na-asụgharị Χριστός dị ka utu aha, ebe “Jizọs” bụ aha. “Nke” na-ahapụ ohere nghọta dị na genitive ahụ—ịbụ onye mkpọrọ nke ya ma ọ bụ onye nọ n’ụlọ mkpọrọ n’ihi ijere ya ozi—n’enweghị ịkọwa ya karịa ihe odide Grik kwuru.
- source_word: ὑπὲρ ὑμῶν
  choice: n’ihi unu
  rationale: N’ebe a, ὑπέρ na-egosi na mkpọrọ Pọl metụtara uru ma ọ bụ ọdịmma ndị ọ na-agwa okwu; “n’ihi unu” bụ okwu Igbo dị nkenke ma dị eke nke na-eburu echiche ahụ.
- source_word: τῶν ἐθνῶν
  choice: ndị mba ọzọ
  rationale: N’okwu Pọl ebe a, okwu ahụ na-ezo aka ná ndị na-abụghị ndị Juu, ọ bụghị nanị mba dị iche iche dị ka mpaghara ọchịchị.
theological_decisions:
- issue: Ịsụgharị Χριστοῦ dị ka utu aha ma ọ bụ hapụ ya n’ụdị aha a na-ejikarị eme ihe
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: Χριστός bụ utu aha nke pụtara onye e tere mmanụ; ya mere isi ederede ji “Mesaịa,” ebe e debere “Kraịst Jizọs” n’ala peeji dị ka ụdị okwu ọdịnala a maara nke ọma.
- issue: Mmekọrịta Pọl na Mesaịa n’okwu τοῦ Χριστοῦ Ἰησοῦ
  choice: onye mkpọrọ nke Mesaịa Jizọs
  alternative: onye nọ n’ụlọ mkpọrọ n’ihi Mesaịa Jizọs
  rationale: Ụdị “nke” na-edobe mkpụrụokwu genitive nke Grik ma ghara ikpebi kpamkpam ma ihe e mesiri ike bụ na Pọl bụ nke Mesaịa, na ọ na-ejere ya ozi, ma ọ bụ na a tụrụ ya mkpọrọ n’ihi ya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke nwere ugwu ma dị mfe nghọta. “Bú” na-eme ka “ndị mba ọzọ” doo anya dị ka nkọwa nke “unu.” Akara ogologo dị n’ọgwụgwụ na-egosi na ahịrịokwu ahụ akwụsịghị ebe a kama ọ gara n’ihu n’amaokwu ndị na-esote.
