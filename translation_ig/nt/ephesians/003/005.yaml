id: EPH.3.5
reference: Ephesians 3:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/005.yaml
  text: which was not made known to the sons of men in other generations as it has now been revealed to his holy apostles and prophets in the Spirit[b][a],
translation:
  language: ig
  text: nke e meghị ka ụmụ mmadụ mara n'ọgbọ ndị ọzọ, dị ka e kpughere ya ugbu a nye ndị ozi ya na ndị amụma ya, ndị dị nsọ, n'ime Mmụọ Nsọ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụ ndị mmadụ”; okwu Grik ahụ pụtara otu a n'ụzọ nkịtị, ma ihe ọ na-ekwu bụ mmadụ niile.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site na Mmụọ Nsọ”; okwu Grik ahụ nwere ike igosi ọnọdụ ma ọ bụ usoro mkpughe, ma ọ bụ ụzọ e si mee ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: nke a
  rationale: Ọ bụ nnọchiaha njikọ na-ezo aka n'ihe omimi a kpọtụrụ aha n'amaokwu bu ụzọ; “nke a” na-eme ka njikọ ahụ doo anya n'Igbo n'etinyeghị aha ahụ ọzọ.
- source_word: ἑτέραις γενεαῖς
  choice: n'ọgbọ ndị ọzọ
  rationale: A ghọtara dative a dị ka nke oge; “ndị ọzọ” na-egosipụta ἑτέραις kpọmkwem karịa “ndị gara aga.”
- source_word: οὐκ ἐγνωρίσθη
  choice: na-emeghị ka ụmụ mmadụ mara
  rationale: Nke a na-echekwa olu nnara na echiche causative nke γνωρίζω, ya bụ ime ka ihe mara mmadụ, ọ bụghị naanị na ndị mmadụ amaghị ya.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: ụmụ mmadụ
  rationale: N'Igbo nke oge a, “ụmụ mmadụ” bụ okwu ebumpụta ụwa na nke gụnyere mmadụ niile, ma ọ ka na-edebe oyiyi nke okwu Grik karịa naanị “mmadụ niile.”
- source_word: ὡς νῦν
  choice: dị ka ... ugbu a
  rationale: Ọ na-echekwa ntụnyere nke ụzọ ma ọ bụ ogo e si kpughee ihe ahụ ugbu a, kama ikwu na ọ dịghị ihe ọ bụla banyere ya mara n'oge gara aga.
- source_word: ἀπεκαλύφθη
  choice: e kpughere ya
  rationale: “Kpughee” bụ okwu doro anya maka ime ka ihe zoro ezo pụta ìhè, ma na-echekwa olu nnara nke Grik.
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: nye ndị ozi ya na ndị amụma ya, ndị dị nsọ
  rationale: Nhazi a na-eme ka “ndị dị nsọ” metụta ma ndị ozi ma ndị amụma, dị ka njikọ okwu Grik si kwado; ikwughachi “ya” na-eme ka Igbo doo anya n'agbanyeghị na Grik kwuru ya otu ugboro.
- source_word: ἐν πνεύματι
  choice: n'ime Mmụọ Nsọ
  rationale: “N'ime” na-echekwa ἐν ma hapụ ka okwu ahụ nwee ike igosi ọnọdụ ma ọ bụ ụzọ e si kpughee ya; “Mmụọ Nsọ” na-egosi onye okwu a yikarịrị ka ọ na-ezo aka na ya n'ọnọdụ a.
theological_decisions:
- issue: Onye πνεύματι na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ ma ọ bụ ọnọdụ ime mmụọ
  rationale: N'ọnọdụ nke mkpughe sitere na Chineke nye ndị ozi na ndị amụma, ojiji Pọl na-akwado na ọ bụ Mmụọ Nsọ. Ma “n'ime” na-edebe ohere nghọta nke ọnọdụ ma ọ bụ ụzọ.
- issue: Ogo ihe ndị ọgbọ gara aga maara
  choice: Ntụnyere “dị ka ... ugbu a” ka edobere
  alternative: Ịsụgharị ya dị ka a ga-asị na ọ dịghị onye ọ bụla maara ihe omimi ahụ ma ọlị n'oge gara aga
  rationale: ὡς na-eweta ntụnyere; ya mere amaokwu ahụ nwere ike ikwu banyere ụzọ ma ọ bụ ogo mkpughe nke ugbu a, ọ bụghị ịgọnahụ ụdị ọmụma niile n'oge gara aga.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ụmụ mmadụ” n'ahịrị isi ka okwu ahụ bụrụ nke ebumpụta ụwa, ebe nkọwa ala peeji na-edebe ọdịdị okwu Grik. E debere ntụnyere na mgbagwoju anya nke ἐν πνεύματι kama idozi ha n'ụzọ siri ike.
