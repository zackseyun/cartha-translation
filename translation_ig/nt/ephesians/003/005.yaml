revisions:
- from: nke a na-emeghị ka ụmụ mmadụ mara n'ọgbọ ndị ọzọ dị ka e kpughere ya ugbu a nye ndị ozi ya na ndị amụma ya, ndị dị nsọ, n'ime Mmụọ Nsọ.[a][b]
  to: nke e meghị ka ụmụ mmadụ mara n'ọgbọ ndị ọzọ, dị ka e kpughere ya ugbu a nye ndị ozi ya na ndị amụma ya, ndị dị nsọ, n'ime Mmụọ Nsọ.[a][b]
  rationale: The revision removes an unnecessary demonstrative, uses a more idiomatic completed-event construction, and retains the Greek comparison (“dị ka ... ugbu a”), the passive sense, and the ambiguity between sphere and means in ἐν πνεύματι. The appositional phrase “ndị dị nsọ” remains positioned to modify both coordinated groups.
