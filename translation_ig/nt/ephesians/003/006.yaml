id: EPH.3.6
reference: Ephesians 3:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶναι τὰ ἔθνη συγκληρονόμα καὶ σύσσωμα καὶ συμμέτοχα τῆς ἐπαγγελίας ⸂ἐν Χριστῷ Ἰησοῦ⸃ διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/006.yaml
  text: that the Gentiles are fellow heirs[a], fellow members of the body, and fellow partakers of the promise in Messiah Jesus through the gospel[c][b],
translation:
  language: ig
  text: na ndị mba ọzọ bụrụ ndị nketa ọnụ, ndị so n’otu ahụ, na ndị na-eketa òkè n’nkwa ahụ n’ime Mesaịa Jizọs site n’ozi ọma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ndị mba ọzọ dịka “mba dị iche iche”; ma n’ebe a ọ na-ezo aka n’ụmụ mmadụ na-abụghị ndị Juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: ndị mba ọzọ
  rationale: N’ebe a okwu ahụ na-ezo aka kpọmkwem n’ụmụ mmadụ na-abụghị ndị Juu, ọ bụghị naanị mba dị iche iche n’echiche ndọrọ ndọrọ ọchịchị.
- source_word: συγκληρονόμα
  choice: ndị ha na ndị Juu ga-ekekọ ihe nketa ahụ
  rationale: Ngwakọta σύν na-egosi na ha na ndị ọzọ nwekọrọ otu ihe nketa. A kpọpụtara ‘ndị Juu’ site n’ọnọdụ okwu gbara amaokwu ahụ gburugburu iji mee ka ndị nkịtị ghọta ndị a na-esonyere, na-enweghị ikwu na ndị mba ọzọ nọ n’ọkwa dị ala.
- source_word: σύσσωμα
  choice: ndị ha na ha so n’otu ahụ
  rationale: Okwu Grik a na-adịghị ahụkarị na-egosi na a gbakọtara ha n’otu ahụ. Nsụgharị a na-echekwa ihe atụ banyere ahụ ma na-adaba n’Igbo nke oge a.
- source_word: συμμέτοχα
  choice: ndị ha na ha ga-ekekọ
  rationale: Ọ na-egosi isoro ndị ọzọ nwee òkè n’otu ihe ahụ; nkwughachi ‘ndị ha na ha’ na-echekwa usoro okwu atọ nwere σύν.
- source_word: τῆς ἐπαγγελίας
  choice: nkwa ahụ
  rationale: E debere ya n’otu mkpụrụ dịka Grik, ọ bụkwa ihe ndị mba ọzọ na ndị Juu nwekọrọ.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaịa Jizọs
  rationale: ‘Mesaịa’ na-echekwa ike Χριστός dị ka aha ọkwa Onye E Tere Mmanụ n’arụmụka banyere mmezu nkwa Chineke.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: site n’ozi ọma
  rationale: διά tinyere genitive na-egosi ụzọ ma ọ bụ ihe e ji mee ka ndị mba ọzọ nweta òkè a.
- source_word: εἶναι
  choice: bụ ... bụrụkwa ... bụrụkwa
  rationale: Ọ bụ infinitive na-akọwa ihe ‘ihe omimi’ ahụ bụ site n’amaokwu bu ụzọ; usoro Igbo a na-ejikọta ya n’ụzọ ebumpụta ụwa.
theological_decisions:
- issue: Ma a ga-asụgharị Χριστῷ dị ka aha ọkwa ma ọ bụ dị ka aha e ji ama mmadụ
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: N’ebe a ihe gbasara akụkọ nzọpụta na mmezu nkwa Chineke na-eme ka aha ọkwa ahụ ka na-arụ ọrụ; ‘Mesaịa’ na-eme ka nke a pụta ìhè.
- issue: Onye τὰ ἔθνη na-ezo aka na ya
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: Ọnọdụ okwu a na-ekwu maka itinye ndị na-abụghị ndị Juu n’ime nkwa Chineke, ya mere ‘ndị mba ọzọ’ doro anya karịa ‘mba dị iche iche’.
- issue: Ndị a na ha na-ekekọ ihe nketa, ahụ, na nkwa
  choice: ndị Juu ka akpọpụtara na nke mbụ
  alternative: ịhapụ ndị ọzọ ahụ n’amaghị aha dịka Grik siri mee
  rationale: Amaokwu gbara ya gburugburu na esemokwu ndị Juu na ndị mba ọzọ na-eme ka onye a na-ekwu maka ya doo anya. Ịkpọpụta ya otu ugboro na-eme ka Igbo doo anya, ma ọ naghị agbanwe nha anya nke σύν atọ ahụ.
translation_notes:
  register: Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E ji usoro ‘ndị ha na ha’ chekwaa nkwughachi na nha anya nke okwu Grik atọ malitere na σύν. Akara ndetu ala peeji [a] dị n’isiokwu ahụ.
