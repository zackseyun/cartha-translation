  verdict: revise
  source_fidelity: The draft conveys the purpose clause, the present-time element, the church as the means, the two paired classes of rulers/authorities, their heavenly setting, and God's richly multifaceted wisdom. The passive sense of γνωρισθῇ is naturally expressed in Igbo through “e wee mee ka ... mata.”
  naturalness: The original word order is somewhat heavy, especially where “ugbu a” and the heavenly qualifier occur. Moving “ugbu a” forward and using “nọ n’ógbè eluigwe” makes the recipients and their location clearer in natural Standard Igbo.
  terminology: “Ọgbakọ ndị kwere ekwe” appropriately represents ἐκκλησία as a gathered believing community. “Ndị ọchịchị na ndị nwere ikike” preserves the two Greek terms without prematurely identifying them as angels or demons. “N’ógbè eluigwe” idiomatically represents the heavenly sphere.
