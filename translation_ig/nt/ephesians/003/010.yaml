    rationale: In “mee ka ndị ọchịchị na ndị nwere ikike n’ebe ndị dị n’eluigwe mata ugbu a,” both “ugbu a” and the heavenly locative are delayed, making their scope less immediately clear. The source places νῦν prominently and identifies the rulers and authorities as being in the heavenly sphere.
  - severity: low
    issue: Footnote anchors are all placed at the end rather than beside the terms they explain.
    rationale: 'Placing each marker immediately after its relevant expression improves auditability: the wisdom expression, the rulers/authorities, and the heavenly-sphere expression.'
