id: EPH.3.10
reference: Ephesians 3:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα γνωρισθῇ νῦν ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις ἐν τοῖς ἐπουρανίοις διὰ τῆς ἐκκλησίας ἡ πολυποίκιλος σοφία τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/010.yaml
  text: so that now[a], through the church, the manifold wisdom of God might be made known to the rulers and the authorities in the heavenly realms[c][b],
translation:
  language: ig
  text: ka ugbu a, site n’ọgbakọ ndị kwere ekwe, e wee mee ka ndị ọchịchị na ndị nwere ikike[b] nọ n’ógbè eluigwe[c] mata amamihe Chineke nke nwere ọtụtụ akụkụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “amamihe Chineke bara ụba ma nwee ụdị dị iche iche.” Okwu Grik ahụ na-egosi amamihe nwere ọtụtụ akụkụ ma ọ bụ ụdị.
    reason: lexical_alternative
  - marker: b
    text: “Ndị ọchịchị na ndị nwere ikike” n’ebe a yikarịrị ka ọ na-ezo aka n’ike ndị mmụọ ma ọ bụ ndị dị n’ụwa elu, ọ bụghị naanị ndị ọchịchị mmadụ.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, “n’ebe ndị dị n’eluigwe” ma ọ bụ “n’ógbè eluigwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka e wee
  rationale: Na-egosi nzube, ma bụrụkwa ụzọ Igbo dị ụtọ isi gosipụta telic force nke njikọokwu Grik a.
- source_word: γνωρισθῇ
  choice: mee ka ... mata
  rationale: Na-echekwa echiche passive—ime ka ihe mara ndị a kpọrọ aha—n’ụdị Igbo nkịtị na nke doro anya.
- source_word: νῦν
  choice: ugbu a
  rationale: Ntụgharị oge kpọmkwem ma dị mfe nghọta.
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: ndị ọchịchị na ndị nwere ikike
  rationale: Na-edebe okwu abụọ ahụ iche, na-akọwaghị ha n’isiokwu ahụ dị ka ndị mmụọ ozi kpọmkwem; ọnọdụ eluigwe na-eme ka nghọta banyere ike ime mmụọ pụta ìhè.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: n’ebe ndị dị n’eluigwe
  rationale: Na-egosi mpaghara eluigwe n’ụzọ Igbo nkịtị, na-ahapụghị ya naanị ka ọ bụrụ ‘eluigwe’ n’ụzọ nwere ike iyi ka ọ na-ezo aka n’otu ebe kpọmkwem.
- source_word: διὰ τῆς ἐκκλησίας
  choice: site n’ọgbakọ ndị kwere ekwe
  rationale: ‘Site na’ na-egosi ụzọ ma ọ bụ ngwa; nkọwa nke ἐκκλησία dị mfe nghọta nye ndị Igbo nke oge a ma zere ime ka okwu ahụ bụrụ naanị ụlọ nzukọ.
- source_word: ἡ πολυποίκιλος σοφία
  choice: amamihe ... nke nwere ọtụtụ akụkụ
  rationale: Na-ebute echiche nke amamihe bara ụba, nwere ọtụtụ ụdị ma ọ bụ akụkụ, karịa iji okwu ochie na-adịghị doo onye nkịtị anya.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: 'Ụdị Igbo nkịtị nke genitive: ‘amamihe Chineke.’'
theological_decisions:
- issue: Ndị bụ ‘ndị ọchịchị na ndị nwere ikike’
  choice: E debere okwu ahụ n’ozuzu ya, ebe ‘n’ebe ndị dị n’eluigwe’ na-egosi na ọ kachasị bụrụ ike ndị mmụọ ma ọ bụ ndị kosmik.
  alternative: Ndị ọchịchị mmadụ; ma ọ bụ ma ndị ụwa ma ndị mmụọ ọnụ.
  rationale: Njikọ okwu Pọl na qualifier ἐν τοῖς ἐπουρανίοις na-akwado nghọta nke ike karịrị mmadụ, ma isiokwu ahụ ekwesịghị ịkpọ ha ‘ndị mmụọ ozi’ n’ihi na Grik ekwughị ya kpọmkwem.
- issue: Ọrụ ọgbakọ ndị kwere ekwe
  choice: Ọgbakọ ahụ bụ ụzọ Chineke si eme ka a mata amamihe ya.
  alternative: Ọgbakọ ahụ n’onwe ya bụ onye na-akụzi ndị ọchịchị ahụ kpọmkwem.
  rationale: διά ya na genitive na-egosi means/instrumentality, ma ahịrịokwu passive anaghị akọwa onye na-eme ka a mata ya; ya mere e zere ịgbakwunye onye ọrụ a na-akpọghị aha.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ọgbakọ ndị kwere ekwe’ iji mee ka ἐκκλησία doo anya dị ka ndị mmadụ gbakọrọ n’okwukwe, ọ bụghị ụlọ; usoro okwu ka e mere ka ọ bụrụ nke Igbo na-asụ nke ọma ma debe ‘ugbu a’ na isi nzube nke ahịrịokwu ahụ.
