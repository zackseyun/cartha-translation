  text: οὗ ⸀ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ ⸂τῆς δοθείσης⸃ μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: ig
  text: nke m ghọrọ onye na-ejere ozi, dịka onyinye amara Chineke e nyere m siri dị, dịka ọrụ nke ike ya siri dị—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke e mere m onye na-ejere ozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: nke ... ya
  rationale: Nnọchiaha njikọ a na-ezo aka n’‘oziọma’ dị n’amaokwu bu ụzọ; usoro a na-egosi na Pọl ghọrọ onye na-ejere oziọma ahụ ozi.
- source_word: ἐγενήθην
  choice: m ghọrọ
  rationale: Nke a bụ okwu Igbo dị mfe ma kwekọọ n’echiche nke ịbanye n’ọrụ ọhụrụ, ebe ihe ndị sochirinụ ka na-egosi na Chineke bụ isi iyi nke ọrụ ahụ.
- source_word: διάκονος
  choice: onye na-ejere ya ozi
  rationale: Nhọrọ a na-egosipụta ọrụ ije ozi n’etinyeghị echiche nke ọkwa ụka e mesịrị jikọta na ‘dikin’ ma ọ bụ echiche ndị ụkọchukwu.
- source_word: κατὰ τὴν δωρεὰν
  choice: dịka onyinye ... si dị
  rationale: Usoro a na-echekwa echiche nke ụkpụrụ ma ọ bụ ndabere nke κατά, ma bụrụkwa Igbo a na-aghọta nke ọma.
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: amara Chineke
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma doo anya isi kwuo genitive ahụ, na-egosi na onyinye ahụ sitere n’amara Chineke ma ọ bụ bụrụ onyinye amara ya.
- source_word: τῆς δοθείσης μοι
  choice: e nyere m
  rationale: E ji olu nnara mee ya ka a ghara ịkpọ onye nyere ya aha n’ebe a, dịka Grik si mee, ebe amaokwu ahụ na-eme ka isi iyi Chineke pụta ìhè.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: dịka ọrụ ... si dị
  rationale: ‘Ọrụ’ na-egosipụta ike nke na-arụpụta ihe, ma ikwughachi ‘dịka ... si dị’ na-echekwa nhazi κατά nke ugboro abụọ.
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: nke ike ya
  rationale: ‘Ike’ bụ okwu Igbo nkịtị na nke ziri ezi maka δύναμις n’ebe a.
theological_decisions:
- issue: Ụdị ọrụ Pọl dịka διάκονος
  choice: onye na-ejere ya ozi
  alternative: onye ozi ya; dikin
  rationale: Ihe a na-ekwu bụ ije ozi Pọl nye oziọma ahụ, ọ bụghị ikwupụta kpọmkwem na o nwere ọkwa ụka a kpọrọ dikin.
- issue: Onye mere ka Pọl banye n’ọrụ n’okwu ἐγενήθην
  choice: m ghọrọ
  alternative: e mere m
  rationale: ‘M ghọrọ’ na-ahapụ ohere nghọta nke ngwaa Grik, ebe okwu banyere onyinye amara Chineke na ọrụ ike ya na-eme ka o doo anya na ọrụ Pọl sitere n’aka Chineke.
- issue: Mmekọrịta dị n’etiti onyinye na amara Chineke
  choice: onyinye amara Chineke
  alternative: onyinye nke sitere n’amara Chineke
  rationale: Nkebi Grik nwere ike igosi onyinye nke bụ amara Chineke ma ọ bụ nke sitere na ya; okwu a họọrọ na-echekwa mkpirikpi na njikọ ahụ n’enweghị ịkọwa ya karịa ihe odide ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ ‘onye na-ejere ya ozi’ iji zere ịtụnye ọkwa ụka n’ime διάκονος. A hapụrụ akara ogologo ahịrị dị na ngwụcha dịka isi mmalite si gosi na ahịrịokwu ahụ na-aga n’ihu.
