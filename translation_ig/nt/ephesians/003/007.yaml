revisions:
- from: nke m ghọrọ onye na-ejere ya ozi dịka onyinye amara Chineke e nyere m si dị, dịka ọrụ nke ike ya si dị—[a]
  to: nke m ghọrọ onye na-ejere ozi, dịka onyinye amara Chineke e nyere m siri dị, dịka ọrụ nke ike ya siri dị—[a]
  rationale: The revision preserves the Greek’s reference to the gospel, Paul’s entry into service, the gift of grace given to him, and God’s effective power. It improves Standard Igbo idiom and corrects the footnote so that its alternative reflects διάκονος as service rather than messengerhood.
