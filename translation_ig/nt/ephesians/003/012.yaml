base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/012.yaml
  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: ig
  text: N’ime ya ka anyị nwere obi ike na ohere iji ntụkwasị obi bịaruo Chineke nso, site n’okwukwe anyị nwere na ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ikwesị ntụkwasị obi ya.” Nkebiokwu Grik ahụ nwere ike ịpụta ma okwukwe anyị nwere na ya ma ikwesị ntụkwasị obi nke ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: N’ime ya
  rationale: Nnọchiaha a bụ nke nwoke n’otu, ọ na-ezo aka n’ebe Kraịst nọ n’okwu ndị bu ụzọ; nsụgharị a na-echekwa echiche nke ịdị n’ime Kraịst.
- source_word: παρρησίαν
  choice: nkwuwa okwu
  rationale: Ọ na-egosi ikwu okwu n’ihu ọha n’atụghị egwu, ma ghara ịgwakọta ya na πεποίθησις, nke na-egosi obi ike.
- source_word: προσαγωγὴν
  choice: ohere ... bịakwute Chineke
  rationale: N’ebe a okwu ahụ pụtara inwe ụzọ ma ọ bụ ikike ịbịaru Chineke nso; itinye Chineke n’ahịrịokwu na-eme ka ihe e bu n’uche doo anya n’Igbo.
- source_word: ἐν πεποιθήσει
  choice: iji obi siri ike
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwanyere ugwu isi gosi omume e ji ntụkwasị obi na enweghị ụjọ eme.
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: site n’okwukwe anyị nwere na ya
  rationale: Isi ederede na-ewere αὐτοῦ dị ka onye okwukwe ahụ chere ihu, ma na-agbakwụnye ‘anyị nwere’ ka njikọ ahụ bụrụ nke okike n’Igbo. A na-echekwa nghọta nke ‘ikwesị ntụkwasị obi ya’ n’okpuru peeji.
theological_decisions:
- issue: Nkọwa nke διὰ τῆς πίστεως αὐτοῦ
  choice: site n’okwukwe anyị nwere na ya
  alternative: site ná nkwụsi ike ya n’ikwesị ntụkwasị obi
  rationale: Njikọ mkpụrụokwu Grik ahụ nwere ike ịpụta okwukwe e nwere na Kraịst ma ọ bụ ikwesị ntụkwasị obi nke Kraịst n’onwe ya. Isi ederede họọrọ nghọta nke mbụ n’ihi na amaokwu ahụ na-ekwu banyere ohere ndị kwere ekwe nwere ugbu a, ma ihe odide ala peeji na-echekwa nghọta nke ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘nkwuwa okwu’ na ‘obi siri ike’ kewaa echiche παρρησία na πεποίθησις; a kọwara προσαγωγή n’ụzọ omume dịka ohere ịbịakwute Chineke.
