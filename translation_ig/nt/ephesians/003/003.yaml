  text: ⸀κατὰ ἀποκάλυψιν ⸀ἐγνωρίσθη μοι τὸ μυστήριον, καθὼς προέγραψα ἐν ὀλίγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/003.yaml
  text: that the mystery was made known to me by revelation[a], as I wrote before briefly[c][b],
translation:
  language: ig
  text: na e mere ka m mata ihe omimi ahụ site ná mkpughe[a], dịka m dere na mbụ ná nkenke[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “dị ka mkpughe si dị” ma ọ bụ “site n’ụzọ mkpughe.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “n’okwu ole na ole.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: site ná mkpughe
  rationale: Nke a na-egosi ụzọ e si mee ka Pọl mata ihe ahụ. Ọ bụ okwu Igbo dị mfe ma kwe ka κατά pụta dị ka ụzọ ma ọ bụ usoro e si mee ya.
- source_word: ἐγνωρίσθη μοι
  choice: e mere ka m mata
  rationale: Nke a na-echekwa ọdịdị passive nke okwu Grik, n'ekwughị kpọmkwem onye mere ka ọ mata, ma na-ada nke ọma n'Igbo.
- source_word: τὸ μυστήριον
  choice: ihe omimi ahụ
  rationale: “Ihe omimi” bụ okwu Igbo kwesịrị ekwesị maka nzube Chineke nke zoro ezo na mbụ ma e mesịa kpughee; “ahụ” na-egosipụta article ahụ n'ụzọ sitere n'okwu ndị gbara ya gburugburu.
- source_word: καθὼς
  choice: dịka
  rationale: Ọ na-ejikọta okwu a na ihe Pọl dere tupu ya n'ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: προέγραψα
  choice: m dere na mbụ
  rationale: N'ebe a, ọ na-ezo aka n'ihe Pọl dere tupu ebe a n'akwụkwọ ozi ahụ, ọ bụghị n'ịkpọsa ihe n'ihu ọha.
- source_word: ἐν ὀλίγῳ
  choice: ná nkenke
  rationale: Nkebiokwu a na-egosi na ihe o dere dị mkpirikpi; “ná nkenke” bụ ntụgharị Igbo dị nkenke ma kwekọọ na ya.
theological_decisions:
- issue: Ihe μυστήριον pụtara n'akwụkwọ Pọl
  choice: ihe omimi ahụ
  alternative: ihe nzuzo ahụ; atụmatụ Chineke zoro ezo
  rationale: Amaokwu a kpọrọ ya aha ma ọ kọwaghị ọdịnaya ya n'ụzọ zuru ezu. “Ihe omimi ahụ” na-echekwa echiche nke nzube Chineke e kpughere, n'etinyeghị nkọwa sitere n'amaokwu ndị ọzọ.
- issue: Onye mere ka Pọl mata ihe omimi ahụ
  choice: A hapụrụ onye mere ya n'ekwughị aha, dịka passive Grik si dị.
  alternative: Chineke mere ka m mata
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi mkpughe sitere n'aka Chineke, ma ahịrịokwu Grik n'onwe ya ekwughị onye ahụ kpọmkwem. Ya mere, ntụgharị ahụ echekwala oghere ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “e mere ka m mata” iji chekwaa passive nke Grik, ebe “ihe omimi” na-edobe okwu nkà mmụta okpukpe ahụ n'enweghị ịkọwa ya karịa ihe amaokwu ahụ kwuru.
