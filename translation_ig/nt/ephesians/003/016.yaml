id: EPH.3.16
reference: Ephesians 3:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα ⸀δῷ ὑμῖν κατὰ ⸂τὸ πλοῦτος⸃ τῆς δόξης αὐτοῦ δυνάμει κραταιωθῆναι διὰ τοῦ πνεύματος αὐτοῦ εἰς τὸν ἔσω ἄνθρωπον,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/016.yaml
  text: that he may grant you[a], according to the riches of his glory, to be strengthened with power through his Spirit in the inner man,
translation:
  language: ig
  text: ka o nye unu, dịka ụba ebube ya si dị, ka e mee ka unu sie ike n’ike, site na Mmụọ ya, n’ime mmadụ nke ime[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime onwe unu.” N’asụsụ Grik, “n’ime mmadụ nke ime”; “mmadụ” ebe a bụ otu okwu na-anọchi anya mmadụ niile, ọ bụghị naanị nwoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-ewebata ihe Pọl na-arịọ n’ekpere, ma na-edobe echiche nzube ma ọ bụ ọdịnaya nke arịrịọ ahụ.
- source_word: δῷ
  choice: o nye unu
  rationale: Nke a na-egosipụta δίδωμι n’ụzọ doro anya ma kwekọọ n’arịrịọ ekpere; onye na-enye bụ Chineke e kwuru okwu ya n’ahịrịokwu ndị gbara ya gburugburu.
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: dịka ụba ebube ya si dị
  rationale: “Dịka … si dị” na-egosi na ụba ebube ya bụ ihe a na-atụ onyinye ahụ n’usoro ya, ọ bụghị nanị ebe e si wepụta obere akụkụ ya.
- source_word: δυνάμει
  choice: site n’ike
  rationale: Nke a na-egosi ike dịka ụzọ e si eme ka ndị a na-agwa okwu sie ike.
- source_word: κραταιωθῆναι
  choice: ka e … mee ka unu sie ike
  rationale: Usoro a na-edobe olu nnara nke okwu Grik ma na-ada nke ọma n’Igbo ugbu a.
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: site na Mmụọ ya
  rationale: “Site na” na-egosi ụzọ ma ọ bụ onye ọrụ e ji eme ihe ahụ; “Mmụọ” na-ezo aka na Mmụọ Chineke n’okwu Pọl ebe a.
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: n’ime onwe unu
  rationale: Nke a bụ ụzọ Igbo dị ndụ si ekwu maka akụkụ mmadụ nke dị n’ime. Ọ na-ezere ime ka okwu ἄνθρωπος, nke na-anọchi anya onye ọ bụla n’agbanyeghị nwoke ma ọ bụ nwaanyị, yie ka ọ bụ naanị nwoke.
theological_decisions:
- issue: Ihe πνεῦμα na-ezo aka na ya
  choice: Mmụọ Chineke (“Mmụọ ya”)
  alternative: mmụọ ma ọ bụ ike Chineke a na-ewereghị dị ka onye
  rationale: N’ebe a Pọl na-ekwu maka ọrụ Chineke na-arụ n’ime ndị kwere ekwe, ma “Mmụọ ya” kwekọrọ nke ọma n’otú Pọl si eji okwu a. Nsụpe “Mmụọ” na-egosi onye okwu ahụ na-ezo aka n’etinyeghị nkọwa ọzọ na-adịghị n’ederede.
- issue: Nsụgharị ἔσω ἄνθρωπον
  choice: n’ime onwe unu
  alternative: n’ime mmadụ nke ime
  rationale: Okwu Grik n’onwe ya bụ otu onye e ji anọchi anya mmadụ niile, ọ bụghị naanị nwoke. “N’ime onwe unu” na-ebunye echiche banyere ụdị mmadụ dị n’ime n’Igbo nghọta, ebe nkọwa ala peeji na-echekwa ọdịdị okwu Grik.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-anọgide dịka nkebi nke ekpere malitere n’amaokwu ndị bu ya ụzọ; rikoma ikpeazụ na-egosi njikọ ahụ. Ejighị okwu okpukpe nke otu ụka pụrụ iche.
