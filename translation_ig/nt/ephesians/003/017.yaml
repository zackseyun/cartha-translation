source:
  edition: SBLGNT
  text: κατοικῆσαι τὸν Χριστὸν διὰ τῆς πίστεως ἐν ταῖς καρδίαις ὑμῶν ἐν ἀγάπῃ· ἐρριζωμένοι καὶ τεθεμελιωμένοι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/017.yaml
  text: so that Messiah may dwell in your hearts through faith[a], being rooted and grounded in love[c][b],
translation:
  language: ig
  text: ka Mesaya biri n’obi unu site n’okwukwe,[a] ebe unu gbanyesiri mgbọrọgwụ ma tọọ ntọala n’ịhụnanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site na ntụkwasị obi.” Okwu Grik ahụ nwekwara ike ịpụta ntụkwasị obi, ma “okwukwe” kacha dabara n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “n’ịhụnanya” ọ na-akọwa “gbanyesiri mgbọrọgwụ ma tọọ ntọala”; ụfọdụ na-ejikọ ya na “biri n’obi unu.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατοικῆσαι
  choice: biri
  rationale: Ọ na-egosi ibi nke ọma na nke na-adịgide adịgide, ọ bụghị nanị ịnọ nwa oge; n’usoro ekpere a, “wee ... biri” na-egosi nzube ma ọ bụ ihe a na-arịọ ka o mee.
- source_word: τὸν Χριστόν
  choice: Mesaya
  rationale: Χριστός bụ aha ọkwá pụtara Onye E Tere Mmanụ; “Mesaya” na-echekwa ya dịka aha ọkwá, ọ bụghị naanị dịka aha mmadụ.
- source_word: διὰ τῆς πίστεως
  choice: site n’okwukwe
  rationale: N’ebe a πίστις kacha dabara n’okwukwe dịka ụzọ Mesaya si biri n’ime obi ndị kwere ekwe.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: n’ime obi unu
  rationale: “Obi” n’Igbo, dịka n’asụsụ Grik a, nwere ike ịpụta ime mmadụ dum—echiche, ọchịchọ, na mmetụta—ọ bụghị mmetụta uche naanị.
- source_word: ἐν ἀγάπῃ
  choice: n’ịhụnanya
  rationale: Ọ na-akọwa ịhụnanya dịka ọnọdụ ma ọ bụ ala e mere ka ndị a gbanye mgbọrọgwụ ma nwee ntọala n’ime ya.
- source_word: ἐρριζωμένοι
  choice: ebe e mere ka unu gbanye mgbọrọgwụ
  rationale: 'Nke a na-echekwa perfect passive: e meela ihe ahụ, ọnọdụ ya ka na-adịkwa; ọ na-ejigidekwa ihe atụ sitere n’osisi.'
- source_word: τεθεμελιωμένοι
  choice: ma nwee ntọala
  rationale: Ọ na-echekwa ihe atụ ụlọ na ntọala, tinyere ọnọdụ na-adịgide n’ihi ihe e mewororị.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: “Mesaya” na-eme ka ihe aha ọkwá ahụ pụtara pụta ìhè n’enweghị itinye nkọwa otu ụka pụrụ iche.
- issue: Ihe πίστις pụtara na διὰ τῆς πίστεως
  choice: site n’okwukwe
  alternative: site na ntụkwasị obi
  rationale: “Okwukwe” bụ nghọta kacha kwesị ekwesị n’ebe a, ebe “ntụkwasị obi” ka bụ ụzọ ọzọ okwu Grik ahụ nwere ike isi pụta.
- issue: Ebe ἐν ἀγάπῃ jikọrọ
  choice: jikọrọ ya na “gbanye mgbọrọgwụ ma nwee ntọala”
  alternative: jikọọ ya na “biri n’ime obi unu”
  rationale: Usoro okwu ahụ na ihe atụ abụọ na-esochi ya na-akwado nke mbụ, ma ihe ọzọ ka ga-ekwe omume n’ụzọ nhazi okwu.
translation_notes:
  register: Ejiri Igbo Izugbe dị ugbu a, nke dị ugwu ma dị mfe nghọta. “Mesaya” na-echekwa Χριστός dịka aha ọkwá. E kewapụrụ “n’ịhụnanya” n’ahịrịokwu nke abụọ ka njikọ ya na participle abụọ pụta ìhè, n’enweghị ikpochapụ mgbagwoju anya ahụ; e debere ụzọ ọzọ n’okpuru peeji.
