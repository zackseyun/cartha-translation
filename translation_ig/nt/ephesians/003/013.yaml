  text: διὸ αἰτοῦμαι μὴ ⸀ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: ig
  text: Ya mere, ana m arịọ unu ka unu ghara ịda mba n’ihi mkpagbu ndị m na-ata maka unu.[a] Mkpagbu ndị a bụ ebube unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka unu ghara ịda mba n’ihi mkpagbu m na-ata maka unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a; ọ bụkwa okwu Igbo doro anya ma dị nkenke.
- source_word: αἰτοῦμαι
  choice: ana m arịọ unu
  rationale: E tinyere “unu,” bụ́ ndị a na-agwa okwu, ka ahịrịokwu ahụ bụrụ Igbo zuru oke ma doo anya.
- source_word: μὴ ἐγκακεῖν
  choice: ka unu ghara ịda mba
  rationale: “Ịda mba” na-egosipụta ịkwụsị inwe obi ike ma ọ bụ ịda mbà n’obi, nke dabara n’ọrụ ἐγκακέω ebe a.
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: n’ihi mkpagbu ndị m na-ata
  rationale: N’ebe a, ἐν na-egosi ihe nwere ike ịkpata nkụda mmụọ. “Mkpagbu” na-echekwa ịdị arọ nke θλῖψις, ebe “ndị m na-ata” na-eme ka okwu ahụ bụrụ Igbo ebumpụta ụwa.
- source_word: ὑπὲρ ὑμῶν
  choice: n’ihi unu
  rationale: Ọ na-egosi na Pọl na-ata ahụhụ ahụ maka ọdịmma ndị ọ na-agwa okwu; okwu a dị mfe ma bụrụ nke ndị Igbo na-eji kwa ụbọchị.
- source_word: ἥτις
  choice: Nke a
  rationale: Ọ na-atụ aka n’echiche niile banyere mkpagbu Pọl na-ata n’ihi ha, n’enweghị ịmanye onye na-agụ ya ka ọ họrọ naanị otu mkpụrụokwu dịka ihe ọ na-ezo aka na ya.
- source_word: δόξα ὑμῶν
  choice: ebube unu
  rationale: “Ebube” na-echekwa ịdị arọ nke δόξα, nke nwere ike ịgụnye nsọpụrụ na ihe e ji anya isi n’ọrụ nzọpụta Chineke.
theological_decisions:
- issue: Ihe ἥτις ἐστὶν δόξα ὑμῶν na-atụ aka na ya
  choice: “Nke a” na-atụ aka na mkpagbu Pọl na-ata n’ihi ha dịka otu echiche zuru ezu.
  alternative: Ọ pụrụ ịtụ aka n’ozuzu ya n’ozi Pọl na ahụhụ ya maka ha.
  rationale: Mkpagbu Pọl bụ ihe kacha nso okwu njikọ ahụ, ma ụdị okwu Igbo “Nke a” na-ahapụ ohere maka echiche sara mbara banyere ozi na ahụhụ ya, kama idozi esemokwu ahụ n’ụzọ siri oke ike.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ịda mba,” “mkpagbu,” na “ebube” bụ okwu nkịtị ma na-echekwa ike na ịdị arọ nke ihe odide Grik. E zere okwu ụka pụrụ iche nke otu òtù.
