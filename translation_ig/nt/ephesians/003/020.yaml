  text: Τῷ δὲ δυναμένῳ ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ ὧν αἰτούμεθα ἢ νοοῦμεν κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/020.yaml
  text: To the one who is able to do far beyond all that we ask or think[a], according to the power at work in us[b],
translation:
  language: ig
  text: Nye Onye pụrụ ime karịa nnọọ ihe niile anyị na-arịọ ma ọ bụ na-eche n’uche[a], n’ụzọ kwekọrọ n’ike ahụ na-arụ ọrụ n’ime anyị[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, ‘ma ọ bụ ihe anyị pụrụ ichepụta n’uche.’ Okwu Grik a na-ekwu maka ihe uche pụrụ iche n’echiche.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, ‘n’etiti anyị.’ ‘N’ime anyị’ na-egosi ike ahụ na-arụ ọrụ n’ime ndị kwere ekwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: nye Onye ahụ pụrụ
  rationale: Nke a na-edobe ụdị dative nke participle ahụ dịka onye a na-enye otuto n’amaokwu na-esote, n’etinyeghị okwu ‘Chineke’ nke na-adịghị n’amaokwu a n’onwe ya.
- source_word: δὲ
  choice: Ma
  rationale: N’ebe a, δέ na-egosi ntụgharị gaa n’okwu otuto, ọ bụghị mmegide siri ike. ‘Ma’ bụ njikọ dị mkpirikpi nke na-edobe njikọ ahụ.
- source_word: ὑπὲρ πάντα ... ὑπερεκπερισσοῦ
  choice: ihe karịrị nnọọ ihe niile
  rationale: Nkebi a na-egosi ịgafe ókè n’ụzọ siri ike. ‘Karịrị nnọọ’ na-enye ike nkwusi okwu ahụ n’Igbo nkịtị ma ghara iji okwu na-adịghị eke.
- source_word: ποιῆσαι
  choice: ime ihe
  rationale: Nke a na-edobe ịdị obosara na ịdị mfe nke ποιέω; ‘ịrụzu’ ga-eme ka ihe ọ pụtara pụta kpọmkwem karịa isi mmalite.
- source_word: ὧν αἰτούμεθα ἢ νοοῦμεν
  choice: ihe niile anyị na-arịọ ma ọ bụ na-eche n’obi
  rationale: ‘Na-arịọ’ kwekọrọ na αἰτούμεθα, ebe ‘na-eche n’obi’ na-ekpuchi echiche ma ọ bụ ihe uche pụrụ ịghọta nke νοοῦμεν na-egosi.
- source_word: κατὰ τὴν δύναμιν
  choice: n’ụzọ kwekọrọ n’ike ahụ
  rationale: κατά na-egosi ụkpụrụ ma ọ bụ ókè e ji atụ ihe, ọ bụghị naanị ngwa e ji mee ya. ‘N’ụzọ kwekọrọ’ na-edobe nghọta ahụ.
- source_word: τὴν ἐνεργουμένην
  choice: na-arụ ọrụ
  rationale: Nke a na-egosi ike nke na-arụ ọrụ ugbu a ma na-arụpụta ihe, n’asụsụ Igbo doro anya.
- source_word: ἐν ἡμῖν
  choice: n’ime anyị
  rationale: Nke a bụ ntụgharị kacha nso nke na-egosi ike na-arụ ọrụ n’ime ndị kwere ekwe; ‘n’etiti anyị’ ka bụ ohere dabere n’otú e si ghọta mkpokọta ahụ.
theological_decisions:
- issue: Onye a na-enye otuto ahụ
  choice: ‘Onye ahụ pụrụ,’ n’etinyeghị ‘Chineke’ n’amaokwu a
  alternative: ‘Chineke, onye pụrụ’
  rationale: Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-egosi Chineke, Grik ekwughachighị aha ‘Chineke’ ebe a. Nsụgharị ahụ na-ahapụ njikọ a ka amaokwu gbara ya gburugburu kọwaa ya.
- issue: Otú ike ahụ si arụ ọrụ n’ebe ndị kwere ekwe nọ
  choice: ‘ike ahụ na-arụ ọrụ n’ime anyị’
  alternative: ‘ike ahụ na-arụ ọrụ n’etiti anyị’
  rationale: Nhọrọ a na-edobe nkwupụta banyere ike dị irè n’ime ndị kwere ekwe n’akọwaghị ya dịka ozizi pụrụ iche nke otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ya. Ahịrịokwu ahụ na-anọgide dị ka mmalite okwu otuto nke ga-aga n’ihu n’amaokwu 21; ya mere e tinyeghị nkwubi okwu na-adịghị na amaokwu a.
