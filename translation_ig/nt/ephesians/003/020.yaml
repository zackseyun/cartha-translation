    text: A pụkwara ịsụ ya, ‘ma ọ bụ ihe anyị pụrụ ichepụta n’uche.’ Okwu Grik a na-ekwu maka ihe uche pụrụ iche n’echiche.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, ‘n’etiti anyị.’ ‘N’ime anyị’ na-egosi ike ahụ na-arụ ọrụ n’ime ndị kwere ekwe.
    reason: lexical_alternative
  revision_rationale: The revision removes an unnatural literal handling of the discourse particle while preserving the Greek dative doxological continuation. It improves placement of the intensive expression, keeps the deliberately non-explicit referent, and narrows footnote a to the contextual sense of mental conception. The comma is retained because the sentence continues in Ephesians 3:21.
