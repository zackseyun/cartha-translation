id: EPH.3.19
reference: Ephesians 3:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: ig
  text: na ịmata ịhụnanya nke Mesaịa[a], nke karịrị ihe ọmụma, ka unu wee jupụta ruo n'uju niile nke Chineke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka a na-asụkarị, “ịhụnanya nke Kraịst.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ka unu wee jupụta n'uju niile nke Chineke.” N'ụzọ nkịtị, Grik nwere, “jupụta ruo n'uju niile nke Chineke”; nkebiokwu a dị nkenke pụrụ imesi iru n'ókè zuru ezu nke uju Chineke ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί τε
  choice: matakwa
  rationale: “Matakwa” naturally coordinates this infinitive with the preceding prayer requests and retains the direct sense “and to know.”
- source_word: τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην
  choice: ịhụnanya ... nke karịrị ihe ọmụma
  rationale: This preserves the deliberate paradox of knowing a love that surpasses knowledge, without replacing “knowledge” with a narrower explanatory term.
- source_word: τοῦ Χριστοῦ
  choice: nke Mesaịa
  rationale: “Mesaịa” translates the title Χριστός rather than merely transliterating it. The “nke” construction remains close to the Greek genitive and does not explicitly decide between the Messiah’s love and love directed toward the Messiah.
- source_word: ἵνα πληρωθῆτε
  choice: ka unu wee jupụta
  rationale: This is natural Standard Igbo for the purpose/result clause and communicates the passive sense of being brought to fullness without a cumbersome construction.
- source_word: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: ruo n'uju niile nke Chineke
  rationale: “Ruo” retains the goal-oriented force of εἰς, while “uju niile nke Chineke” preserves the compressed and theologically weighty Greek expression.
theological_decisions:
- issue: Sense of τοῦ Χριστοῦ
  choice: ịhụnanya nke Mesaịa
  alternative: ịhụnanya Mesaịa nwere n'ebe anyị nọ; ịhụnanya anyị nwere n'ebe Mesaịa nọ
  rationale: The formal genitive is retained because the immediate phrase does not grammatically specify the direction of the love, even though the wider context favors the Messiah’s love.
- issue: Force of εἰς before πλήρωμα
  choice: ruo n'uju niile nke Chineke
  alternative: jupụta n'uju niile nke Chineke
  rationale: The chosen wording preserves movement toward a goal or measure and avoids silently flattening εἰς into a simple content marker.
- issue: Rendering Χριστός as a title
  choice: Mesaịa
  alternative: Kraịst
  rationale: Χριστός functions as a title, so “Mesaịa” communicates its meaning; the traditional transliteration is supplied in a footnote.
translation_notes:
  register: Standard Igbo; current, dignified, and suitable for public Scripture reading. The wording remains connected to the preceding verse, as the Greek begins with a coordinated infinitive. Tone is elevated but avoids archaic vocabulary.
