  text: καὶ φωτίσαι ⸀πάντας τίς ἡ οἰκονομία τοῦ μυστηρίου τοῦ ἀποκεκρυμμένου ἀπὸ τῶν αἰώνων ἐν τῷ θεῷ τῷ τὰ πάντα ⸀κτίσαντι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/009.yaml
  text: and to bring to light for everyone what is the administration of the mystery hidden from the ages in God[a], who created all things[b],
translation:
  language: ig
  text: nakwa ime ka mmadụ niile hụ nke ọma ihe bụ usoro nlekọta nke ihe omimi ahụ[a], nke e zoro n’ime Chineke kemgbe ọtụtụ ọgbọ[b], bụ onye kere ihe niile,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọrụ nlekọta nke ihe omimi ahụ,” ma ọ bụ, “atụmatụ nke ihe omimi ahụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “nke e zoro kemgbe ọtụtụ ọgbọ,” ma ọ bụ, n’ụzọ nkọwa karịa, “nke e zoro site na mgbe ebighị ebi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωτίσαι
  choice: ime ka … hụ nke ọma
  rationale: Nke a na-edobe ihe atụ nke ìhè dị n’okwu Grik ma na-ada ka Igbo a na-asụ taa; ọ pụtara ime ka ihe doo mmadụ anya.
- source_word: πάντας
  choice: mmadụ niile
  rationale: Ọ na-egosi na ebumnuche ahụ gbasara mmadụ niile, ọ bụghị ihe ndị ọzọ n’ozuzu ha.
- source_word: τίς ἡ οἰκονομία
  choice: ihe bụ usoro nlekọta
  rationale: οἰκονομία nwere ike ịpụta nlekọta, ọrụ ilekọta ihe e nyere mmadụ, ma ọ bụ atụmatụ/usoro. ‘Usoro nlekọta’ na-edobe echiche nke ịhazi na ilekọta ihe n’enweghị itinye ozizi pụrụ iche e mesịrị.
- source_word: μυστήριον
  choice: ihe omimi
  rationale: N’okwu Pọl, nke a bụ nzube Chineke nke e zoburu ma kpughee ugbu a; ‘ihe omimi’ na-edobe nghọta ahụ karịa nanị ‘ihe nzuzo.’
- source_word: ἀποκεκρυμμένου
  choice: nke e zoro
  rationale: Ọ na-egosi ihe e zoro n’oge gara aga ma nọgide n’ọnọdụ nzuzo ahụ.
- source_word: ἀπὸ τῶν αἰώνων
  choice: kemgbe oge niile gara aga
  rationale: Nke a na-egosi ogologo oge nke izobe ahụ ma na-ezere ịsụgharị okwu ahụ ozugbo dị ka ‘site na mgbe ebighị ebi,’ nke karịrị ihe Grik kwuru hoo haa.
- source_word: ἐν τῷ θεῷ
  choice: n’ime Chineke
  rationale: Ọ na-edobe preposition ἐν na echiche na ihe omimi ahụ zoro n’ime Chineke, ọ bụghị naanị na ọ nọnyere ya.
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: bụ onye kere ihe niile
  rationale: Nkebiokwu a na-akọwa Chineke n’ụzọ doro anya ma dịkwa mma n’Igbo.
theological_decisions:
- issue: Ihe οἰκονομία pụtara n’ihe gbasara ihe omimi ahụ
  choice: usoro nlekọta
  alternative: ọrụ nlekọta; atụmatụ; usoro e si ahazi ya
  rationale: Nhọrọ a na-edobe echiche nke ịhazi na ime ka nzube ahụ rụọ ọrụ, ma ọ naghị ebubata usoro ozizi nke otu ụka ma ọ bụ nke onye nkọwa ọ bụla.
- issue: Ike okwu oge dị na ἀπὸ τῶν αἰώνων
  choice: kemgbe oge niile gara aga
  alternative: kemgbe ọtụtụ ọgbọ; site na mgbe ebighị ebi
  rationale: Grik kwuru banyere ‘oge dị iche iche/ụbọchị ụwa’ ma ọ kpọghị ‘mgbe ebighị ebi’ aha kpọmkwem. Ya mere, a hapụrụ ntakịrị mgbagwoju anya dị n’isiokwu oge ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ime ka … hụ nke ọma’ na-echekwa ihe atụ nke ìhè n’enweghị ime ka ahịrịokwu ahụ sie ike; ‘usoro nlekọta’ na-echekwa obosara ihe οἰκονομία nwere ike ịpụta. Akara nkọwa ala ala [a] na [b] dị n’ebe okwu ha na-akọwa pụtara n’ahịrịokwu.
