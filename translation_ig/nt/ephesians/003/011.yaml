  text: κατὰ πρόθεσιν τῶν αἰώνων ἣν ἐποίησεν ἐν ⸀τῷ Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/011.yaml
  text: according to the eternal purpose that he accomplished in Messiah Jesus our Lord[c][b][a],
translation:
  language: ig
  text: dị ka nzube ebighị ebi[a] ahụ nke o mezuru n’ime[b] Mesaịa[c] Jizọs, bụ Onyenwe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nzube nke oge niile.” N’ụzọ nkịtị, okwu Grik bụ “nzube nke oge niile.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’aka Mesaịa Jizọs.” Okwu Grik bụ “n’ime,” ma n’ọnọdụ a, a pụkwara ịghọta ya dị ka ụzọ e si mee ihe.
    reason: alternative_reading
  - marker: c
    text: N’asụsụ Grik, “Kraịst”; a sụgharịrị ya “Mesaịa” ebe a n’ihi na ọ na-arụ ọrụ dị ka utu aha.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: dị ka
  rationale: N’ebe a, κατά na-egosi na ihe ahụ kwekọrọ na nzube Chineke; “dị ka” bụ okwu Igbo doro anya ma dịkwa nso n’usoro Grik.
- source_word: πρόθεσιν
  choice: nzube
  rationale: “Nzube” na-egosi ihe e bu n’obi ma kpebie ime, nke dabara n’echiche πρόθεσις n’ebe a.
- source_word: τῶν αἰώνων
  choice: ebighị ebi
  rationale: Ọ bụ ezie na okwu Grik pụtara n’ụzọ nkịtị “nke oge dị iche iche,” “ebighị ebi” na-enye echiche oge ya n’Igbo dị mfe ma kwekọọ n’ọnọdụ amaokwu ahụ; e debere ọdịdị okwu Grik na nkọwa ala peeji.
- source_word: ἣν
  choice: ahụ nke
  rationale: Ọ na-ezo aka azụ na “nzube”; usoro “ahụ nke” na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: ἐποίησεν
  choice: o mezuru
  rationale: N’ebe a ποιέω abụghị nanị “ime” ihe, kama ọ na-ekwu maka ime ka nzube ahụ ruo n’isi.
- source_word: ἐν
  choice: n’ime
  rationale: “N’ime” na-edobe ihe preposition Grik ἐν kwuru, na-ekpebighị kpamkpam ma ọ̀ pụtara ọnọdụ/njikọ ka ọ̀ bụ ụzọ e si mee ihe.
- source_word: Χριστῷ
  choice: Mesaịa
  rationale: Χριστός na-arụ ọrụ dị ka utu aha n’ebe a; “Mesaịa” na-echekwa ihe utu aha ahụ pụtara na mgbọrọgwụ ndị Juu ya.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: Nke a bụ nsụgharị aha ahụ n’ọdịdị a na-ejikarị ede ya n’Igbo.
- source_word: κυρίῳ
  choice: Onyenwe
  rationale: “Onyenwe” bụ ụzọ Igbo kwesịrị ekwesị isi sụgharị κύριος dị ka utu aha.
- source_word: ἡμῶν
  choice: anyị
  rationale: Ọ na-egosi na ọ bụ Onyenwe nke anyị.
theological_decisions:
- issue: Ihe τῶν αἰώνων pụtara n’okwu πρόθεσιν τῶν αἰώνων
  choice: nzube ebighị ebi
  alternative: nzube nke oge dị iche iche
  rationale: “Ebighị ebi” bụ ụzọ Igbo dị mfe isi kwuo echiche oge dị ogologo na-enweghị njedebe a na-aghọta n’ọnọdụ a, ma nkọwa ala peeji na-echekwa ọdịdị okwu Grik n’ụzọ nkịtị.
- issue: Ike ἐν dị n’okwu ἐν τῷ Χριστῷ Ἰησοῦ
  choice: n’ime Mesaịa Jizọs
  alternative: site n’aka Mesaịa Jizọs
  rationale: A họọrọ “n’ime” iji debe okwu Grik ἐν na nghọtahie ya nwere ike ibu, kama ikpebi na ọ bụ naanị ụzọ Chineke si mezue nzube ahụ.
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a okwu ahụ bụ utu aha; “Mesaịa” na-eme ka ihe utu aha ahụ pụtara pụta ìhè.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-edobe ịdị arọ nke okwu Pọl, ebe nkọwa ala peeji na-echekwa ọdịdị okwu Grik na nkọwa ndị ọzọ o nwere ike ibu.
