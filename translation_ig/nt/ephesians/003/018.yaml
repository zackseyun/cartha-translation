  terminology: “Ndị nsọ,” “obosara,” “ogologo,” “ịdị elu,” and “ịdị omimi” are appropriate, intelligible Standard Igbo renderings. “Nwee ike zuru ezu” adequately conveys sufficient/full ability without importing an interpretation of the dimensions.
