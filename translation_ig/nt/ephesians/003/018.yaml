id: EPH.3.18
reference: Ephesians 3:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα ἐξισχύσητε καταλαβέσθαι σὺν πᾶσιν τοῖς ἁγίοις τί τὸ πλάτος καὶ μῆκος καὶ ⸂ὕψος καὶ βάθος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/018.yaml
  text: so that you may be strong enough to comprehend[a], together with all the saints, what is the width and length and height and depth[b],
translation:
  language: ig
  text: ka unu na ndị nsọ niile wee nwee ike zuru ezu ịghọta ihe obosara[a] na ogologo na ịdị elu na ịdị omimi bụ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịdị mbara.”
    reason: lexical_alternative
  - marker: b
    text: Grik ekwughị ihe obosara, ogologo, ịdị elu na ịdị omimi ndị a na-akọwa. Ọtụtụ ndị na-aghọta na amaokwu na-esochi na-emezu echiche a site n’“ịhụnanya Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a na-egosi nzube ma ọ bụ ihe a na-atụ anya ya site n'ekpere e kwuru n'ihu, ma bụrụkwa okwu Igbo dị mfe ma kwekọọ n'echiche Grik.
- source_word: ἐξισχύσητε
  choice: unu nwee ike zuru ezu
  rationale: Ngwaa ahụ na-egosi inwe ume ma ọ bụ ikike ga-ezu ime ihe na-esochi; ntụgharị a na-edebe echiche nke ikike zuru oke.
- source_word: καταλαβέσθαι
  choice: ịghọta
  rationale: N'ebe a, okwu ahụ pụtara iji uche ghọta ihe nke ọma; “ịghọta” bụ okwu Igbo doro anya, dị ugbu a, ma dịkwa nsọpụrụ.
- source_word: σὺν πᾶσιν τοῖς ἁγίοις
  choice: unu na ndị nsọ niile
  rationale: Nke a na-edebe echiche nke imekọ ihe ọnụ, ma “ndị nsọ” bụ aha Pọl na-ejikarị akpọ ndị kwere ekwe.
- source_word: τί
  choice: ihe ... bụ
  rationale: Usoro a na-eme ka ajụjụ ọdịnaya ahụ zuo oke n'Igbo n'enweghị ịgbakwụnye nkọwa onye ma ọ bụ ihe akụkụ ndị ahụ bụ nke ya.
- source_word: τὸ πλάτος
  choice: obosara
  rationale: “Obosara” bụ okwu Igbo nkịtị na kpọmkwem maka akụkụ nke na-egosi mbara; a debere “ịdị mbara” dị ka nhọrọ ọzọ n'okpuru peeji.
- source_word: μῆκος
  choice: ogologo
  rationale: Nke a bụ okwu Igbo kpọmkwem na nke a na-ejikarị eme ihe maka length.
- source_word: ὕψος
  choice: ịdị elu
  rationale: Nke a na-egosipụta height n'ụzọ doro anya ma kwekọọ n'usoro aha akụkụ ndị ọzọ.
- source_word: βάθος
  choice: ịdị omimi
  rationale: Nke a bụ okwu Igbo doro anya maka depth ma na-edebe ihe atụ nke akụkụ e ji atụ ihe.
theological_decisions:
- issue: Ihe akụkụ anọ ahụ na-akọwa
  choice: E kwughị kpọmkwem n'ahịrị bụ ihe obosara, ogologo, ịdị elu na ịdị omimi ahụ bụ nke ya.
  alternative: Ịgbakwụnye “nke ịhụnanya Kraịst” ma ọ bụ “nke atụmatụ nzọpụta Chineke.”
  rationale: Grik nke amaokwu a ekwughị ihe akụkụ anọ ahụ bụ nke ya. Ịgbakwụnye ịhụnanya Kraịst ebe a ga-ebubata okwu sitere n'amaokwu na-esochi ma mechie ajụjụ ntụgharị uche nke ederede hapụrụ ghe oghe.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. A hapụrụ usoro akụkụ anọ ahụ n'enweghị ihe nnọchiaha “ya,” ka a ghara ịkọwa ihe Grik hapụrụ n'ekwughị; akara ụkwụ [a] dị n'akụkụ okwu ọ na-akọwa, [b] nọkwa n'ọgwụgwụ usoro akụkụ anọ ahụ.
