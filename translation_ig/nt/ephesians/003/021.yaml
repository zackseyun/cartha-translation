revisions:
- from: Ka otuto dịrị ya n’ime nzukọ ahụ nakwa n’ime Mesaya Jizọs, n’ọgbọ niile, ruo mgbe niile ebighị ebi[a]. Amen.
  to: Ka otuto dịrị ya n’ime ọgbakọ ahụ nakwa n’ime Mesaya Jizọs, n’ọgbọ niile ruo mgbe ebighị ebi. Amen.
  rationale: The revision replaces “nzukọ” with “ọgbakọ” to represent ἐκκλησία as the community/assembly, while retaining the source’s parallel “n’ime … nakwa n’ime …” construction. It also unites the temporal expression and uses the natural doxological idiom “ruo mgbe ebighị ebi.” The alternative-title footnote is retained unchanged in meaning.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:16:30Z'
review_pass:
  verdict: revise
  source_fidelity: The doxological ascription, the parallel ἐν phrases, the title sense of Χριστός, and the concluding ἀμήν are substantially retained. However, “nzukọ ahụ” most commonly denotes a meeting or gathering event, whereas ἐκκλησία here denotes the believing assembly/community. The temporal wording is also more idiomatic and faithful without separating “all generations” from the eternal-duration expression by a comma.
  naturalness: “Ka otuto dịrị ya” is a natural, dignified Igbo doxological form. “N’ime ọgbakọ” is more natural and appropriately communal in this context than “n’ime nzukọ ahụ.” “N’ọgbọ niile ruo mgbe ebighị ebi” reads smoothly and avoids the somewhat redundant “ruo mgbe niile ebighị ebi.”
  terminology: “Otuto,” “Mesaya Jizọs,” and “Amen” are suitable. “Ọgbakọ” is preferred here for ἐκκλησία because it conveys an assembly/congregation rather than merely an occasion of meeting. The footnote correctly preserves “Kraịst Jizọs” as the alternative conventional rendering.
  issues:
  - severity: medium
    issue: “nzukọ ahụ” for ἐκκλησίᾳ
    rationale: Although “nzukọ” can refer to an assembly, in contemporary Standard Igbo it readily means a meeting. “Ọgbakọ” more clearly identifies the corporate assembly/community intended by Paul, without reducing it to a building or event.
  - severity: low
    issue: Temporal phrase is punctuated and worded awkwardly
    rationale: The comma in “n’ọgbọ niile, ruo mgbe niile ebighị ebi” unnecessarily breaks the single Greek temporal expansion. “Ruo mgbe niile ebighị ebi” is also less idiomatic than the established concise expression “ruo mgbe ebighị ebi.”
  revised_text: Ka otuto dịrị ya n’ime ọgbakọ ahụ nakwa n’ime Mesaya Jizọs, n’ọgbọ niile ruo mgbe ebighị ebi. Amen.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst Jizọs.” E ji “Mesaya” sụgharịa utu aha Grik bụ Χριστός n’ebe a iji chekwaa ihe ọ pụtara.
    reason: alternative_reading
  revision_rationale: The revision replaces “nzukọ” with “ọgbakọ” to represent ἐκκλησία as the community/assembly, while retaining the source’s parallel “n’ime … nakwa n’ime …” construction. It also unites the temporal expression and uses the natural doxological idiom “ruo mgbe ebighị ebi.” The alternative-title footnote is retained unchanged in meaning.
