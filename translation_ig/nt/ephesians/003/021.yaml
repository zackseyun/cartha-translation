  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: ig
  text: Ka otuto dịrị ya n’ime ọgbakọ ahụ nakwa n’ime Mesaya Jizọs, n’ọgbọ niile ruo mgbe ebighị ebi. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: Ka otuto dịrị ya
  rationale: Nkebi Grik a enweghị ngwaa e dere ede, ma ọ bụ usoro inye Chineke otuto. Igbo a na-eji “Ka ... dịrị ya” kwupụta nke ahụ n'ụzọ eke, ma ghara ịkọwapụta ihe karịrị isi mmalite ahụ.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: n’ime nzukọ ahụ
  rationale: “Nzukọ” na-egosi ndị Chineke zukọrọ dịka obodo, ọ bụghị naanị ụlọ; “n’ime” na-edobe ἐν ma kwekọọ na nkebi na-esote.
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: nakwa n’ime Mesaya Jizọs
  rationale: “Mesaya” na-asụgharị Χριστός dịka utu aha nwere ihe ọ pụtara, ebe “Jizọs” bụ aha a translitere; a debekwara nhazi yiri ibe ya nke ἐν ... καὶ ἐν.
- source_word: εἰς πάσας τὰς γενεὰς
  choice: n’ọgbọ niile
  rationale: N’okwu oge a, εἰς na-egosi mgbatị gafee ọgbọ nile; okwu Igbo a dị mfe ma na-eburu echiche ahụ.
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: ruo mgbe niile ebighị ebi
  rationale: Nke a bụ akpaalaokwu siri ike banyere oge na-enweghị njedebe. Nsụgharị Igbo a na-egosipụta ịdịgide ebighị ebi n’asụsụ doxology dị nghọta.
- source_word: ἀμήν
  choice: Amen
  rationale: Nke a bụ ụdị a na-ejikarị n’Igbo maka nkwenye litọji ahụ.
theological_decisions:
- issue: Ịsụgharị Χριστός dịka utu aha ma ọ bụ dịka akụkụ aha
  choice: Mesaya Jizọs
  alternative: Kraịst Jizọs
  rationale: Χριστός bụ utu aha nwere ihe ọ pụtara n’ebe a. “Mesaya” na-echekwa echiche nke Onye E Tere Mmanụ, ma “Kraịst” bụ ụdị ọzọ ndị na-agụ Igbo maara.
- issue: Mmekọrịta “n’ime nzukọ” na “n’ime Mesaya Jizọs”
  choice: 'E debere ha dịka nkebi abụọ jikọrọ ọnụ: “n’ime ... nakwa n’ime ...”'
  alternative: Ịsụgharị nke mbụ dịka “n’etiti nzukọ”
  rationale: Isi mmalite ahụ ji ἐν mee ihe ugboro abụọ n’usoro yiri ibe ya. Idebe myiri ahụ na-ezere ịkọwa kpọmkwem otú otuto si dị n’ime nzukọ na n’ime Mesaya.
translation_notes:
  register: Igbo Standard dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro “Ka otuto dịrị ya” chekwaa ụda ekpere otuto; “nzukọ” na-elekwasị anya n’ọgbakọ ndị kwere ekwe karịa ụlọ nzukọ.
