  yaml_path: translation/nt/ephesians/003/002.yaml
  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: ig
  text: Ọ bụrụ n’ezie na unu anụla[a] banyere ọrụ nlekọta[b] nke amara Chineke ahụ e nyere m n’ebe unu nọ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ma ọ bụrụ n’ezie na unu anụla.” Asụsụ Grik ji usoro nwere ọnọdụ kwuo ya, ọ bụ ezie na n’ebe a o yiri ka Pọl na-ewere ya na ọ bụ eziokwu.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị “ọrụ nchịkwa” ma ọ bụ “ozi e nyere.” Okwu Grik ahụ nwere ike ịpụta ilekọta ma ọ bụ ịhazi ihe e nyefere mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: Ọ bụrụkwa n’ezie na
  rationale: Nke a na-edobe usoro nkwupụta nwere ọnọdụ dị n’asụsụ Grik, ma ‘n’ezie’ na-egosi na Pọl na-atụ anya na ihe a bụ eziokwu, ọ bụghị na ọ na-enwe obi abụọ siri ike.
- source_word: ἠκούσατε
  choice: unu anụla
  rationale: Ụdị a bụ Igbo dị mma nke na-egosi ihe ha nụrụ n’oge gara aga nke ka dị mkpa ugbu a.
- source_word: οἰκονομίαν
  choice: ọrụ nlekọta
  rationale: Ọ na-egosi ibu ọrụ e nyere mmadụ ka ọ lekọta ma hazie ihe e nyefere ya; ọ dịghị emechi ụzọ nye echiche nke ọchịchị ma ọ bụ ozi e nyere ya.
- source_word: χάριτος τοῦ θεοῦ
  choice: amara Chineke
  rationale: ‘Amara’ bụ okwu Igbo a na-ejikarị eme ihe maka χάρις, ma na-edobe echiche nke onyinye na ihu ọma sitere n’aka Chineke.
- source_word: τῆς δοθείσης μοι
  choice: ahụ e nyere m
  rationale: N’asụsụ Grik, participle a kwekọrọ na ‘amara’ n’ụdị mkpụrụokwu, ya mere nsụgharị ahụ na-eme ka ihe e nyere Pọl bụrụ amara Chineke, n’agbanyeghị njikọ chiri anya ya na ọrụ nlekọta ahụ.
- source_word: εἰς ὑμᾶς
  choice: maka unu
  rationale: Ọ na-egosi na ihe e nyere Pọl bụ maka ọdịmma ndị a na-agwa okwu ma lekwasị ha anya.
theological_decisions:
- issue: Ihe ‘ọrụ nlekọta nke amara Chineke’ na-ezo aka na ya
  choice: Ọ bụ ibu ọrụ metụtara amara Chineke nke e nyere Pọl maka ndị na-agụ akwụkwọ ozi ahụ.
  alternative: Atụmatụ nzọpụta Chineke n’onwe ya ma ọ bụ usoro ọchịchị ya n’ozuzu ya.
  rationale: Ihe gbara amaokwu a gburugburu na-elekwasị anya n’ozi e nyere Pọl maka ndị mba ọzọ. ‘Ọrụ nlekọta’ na-edobe echiche nke ibu ọrụ e nyefere ya n’enweghị ịgọnahụ atụmatụ Chineke sara mbara.
- issue: Ike okwu εἴ γε
  choice: Ọ bụ ọnọdụ e kwuru n’ụzọ na-egosi na Pọl na-atụ anya na ọ bụ eziokwu.
  alternative: Ọnọdụ nkịtị nke nwere ike igosi obi abụọ n’ezie.
  rationale: A hapụrụ usoro ‘ọ bụrụ’ ka e wee ghara iwepụ mgbagwoju anya dị n’asụsụ mbụ, ebe ‘n’ezie’ na-egosi ike nkwupụta ahụ n’ọnọdụ a.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma doo ndị nkịtị anya. A hapụrụ amaokwu ahụ ka ọ bụrụ nkebiokwu na-aga n’ihu dịka ọ dị na gburugburu ya, ma e debere ma ọnọdụ dị na εἴ γε ma njikọ ụtọasụsụ nke ‘e nyere m’ na ‘amara.’
