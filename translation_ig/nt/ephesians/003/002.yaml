revisions:
- from: Ọ bụrụkwa n’ezie na unu anụla[a] banyere ọrụ nlekọta[b] nke amara Chineke ahụ e nyere m maka unu,
  to: Ọ bụrụ n’ezie na unu anụla[a] banyere ọrụ nlekọta[b] nke amara Chineke ahụ e nyere m n’ebe unu nọ,
  rationale: The revision removes an unsupported additive nuance from the opening and renders εἰς ὑμᾶς as ‘n’ebe unu nọ,’ preserving its directional orientation toward the readers. The conditional construction, the attribution of the given grace to God, and the sentence’s dependent-clause form are retained. Footnote a is adjusted so its quoted alternative precisely retains the conditional particle.
