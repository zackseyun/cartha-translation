  text: Τούτου χάριν κάμπτω τὰ γόνατά μου πρὸς τὸν ⸀πατέρα,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/014.yaml
  text: For this reason I bend my knees to the Father,
translation:
  language: ig
  text: N’ihi nke a, ana m ehulata ikpere m n’ihu Nna ahụ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: N’ihi nke a
  rationale: Nkebiokwu a na-egosi ihe kpatara ihe na-esochi ya ma jikọta ahịrịokwu a na okwu ndị bu ya ụzọ. “N’ihi nke a” bụ Igbo nkịtị ma doo anya.
- source_word: κάμπτω τὰ γόνατά μου
  choice: ana m ehulata ikpere m
  rationale: Nke a na-edobe ihe oyiyi Grik nke ihulata ikpere n’ekpere, kama iji naanị “ana m egbu ikpere n’ala,” nke ga-akọwa omume ahụ n’ụzọ sara mbara karịa okwu ahụ n’onwe ya.
- source_word: πρὸς
  choice: n’ebe … nọ
  rationale: N’ebe a πρός na-egosi onye a na-eche ihu ma ọ bụ onye a na-ekpegara ekpere. Usoro “n’ebe Nna ahụ nọ” na-ada ka Igbo ebumpụta ụwa ma na-edobe ntụziaka ahụ.
- source_word: τὸν πατέρα
  choice: Nna ahụ
  rationale: Artịkụl ahụ na ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Chineke, bụ́ Nna, ka Pọl na-ekwu maka ya, ọ bụghị naanị nna ọ bụla.
theological_decisions:
- issue: Ma a ga-asụgharị πατέρα dị ka utu aha Chineke
  choice: Nna ahụ
  alternative: nna ahụ
  rationale: N’ọnọdụ a, Pọl na-ekwu banyere ekpere ọ na-ekpegara Chineke; amaokwu na-esote na-agbasawanye okwu banyere ịbụ nna. Mkpụrụedemede ukwu na-egosi onye okwu ahụ na-ezo aka n’enweghị itinye nkọwa ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe oyiyi nke ihulata ikpere na njikọ okwu ahụ na ihe bu ya ụzọ.
