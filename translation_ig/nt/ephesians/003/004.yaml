  text: πρὸς ὃ δύνασθε ἀναγινώσκοντες νοῆσαι τὴν σύνεσίν μου ἐν τῷ μυστηρίῳ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/004.yaml
  text: By reading this[a], you are able to understand my insight into the mystery of Messiah,
translation:
  language: ig
  text: Site n'ịgụ ihe a, unu nwere ike ịghọta nghọta m banyere ihe omimi nke Mesaịa[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “Kraịst.” A pụrụ ịsụgharị aha ọkwa Grik Χριστός dị ka “Mesaịa” ma ọ bụ, dịka ọdịnala si dị, “Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὃ … ἀναγινώσκοντες
  choice: Site n’ịgụ ihe a
  rationale: Nkebiokwu a na-ezo aka n’ihe Pọl dere tupu amaokwu a ma na-egosi na ịgụ ya bụ ụzọ ndị na-agụ akwụkwọ ga-esi ghọta ya. Nsụgharị a bụ Igbo doro anya ma na-edobe njikọ ahụ.
- source_word: δύνασθε
  choice: unu nwere ike
  rationale: Nke a na-egosi ikike ma bụrụkwa okwu Igbo a na-eji kwa ụbọchị nke dabara n’ụdị okwu dị ùgwù.
- source_word: νοῆσαι
  choice: ịghọta
  rationale: Ngwaa a pụtara iji uche mata ma ghọta ihe; “ịghọta” na-enye echiche ahụ kpọmkwem.
- source_word: τὴν σύνεσίν μου
  choice: otú m si ghọta
  rationale: N’ebe a σύνεσις bụ nghọta ma ọ bụ nghọta miri emi Pọl nwere. Ịsụgharị ya dị ka nkebiokwu a na-ezere okwu Igbo na-adịghị atọ ụtọ, “ịghọta nghọta m,” ma na-edobe ihe okwu Grik ahụ pụtara.
- source_word: ἐν τῷ μυστηρίῳ
  choice: ihe omimi
  rationale: N’ebe a ἐν na-akọ ebe ma ọ bụ ihe nghọta Pọl metụtara; “ihe omimi” na-arụ ọrụ dị ka ihe a na-aghọta n’usoro okwu Igbo a.
- source_word: τοῦ Χριστοῦ
  choice: nke Mesaịa
  rationale: Χριστός na-arụ ọrụ dịka aha ọkwa n’ebe a. “Mesaịa” na-egosipụta ihe aha ọkwa ahụ pụtara, ebe e debere “Kraịst” dịka ụzọ ọdịnala si asụgharị ya n’okpuru peeji.
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: Okwu ahụ bụ aha ọkwa nke Onye E Tere Mmanụ, ọ bụghị naanị aha mmadụ. “Mesaịa” na-edobe ọrụ ya dịka aha ọkwa; ihe e dere n’okpuru peeji na-echekwa nsụgharị ọdịnala “Kraịst” n’ebughị otu nghọta n’ike.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, doro anya ma dị ùgwù mee ihe. E mere τὴν σύνεσίν μου ka ọ bụrụ “otú m si ghọta” iji zere nkwughachi na-adịghị ekwe ntị nke “ịghọta nghọta m,” ma e wepụghị echiche nke nghọta Pọl nwere. Akara rikoma n’ikpeazụ na-egosi na ahịrịokwu ahụ gara n’ihu n’amaokwu na-esote.
