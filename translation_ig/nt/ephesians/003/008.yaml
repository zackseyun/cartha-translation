id: EPH.3.8
reference: Ephesians 3:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐμοὶ τῷ ἐλαχιστοτέρῳ πάντων ἁγίων ἐδόθη ἡ χάρις αὕτη— ⸀τοῖς ἔθνεσιν εὐαγγελίσασθαι ⸂τὸ ἀνεξιχνίαστον πλοῦτος⸃ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: ig
  text: Mụ onwe m, onye kasị nta[c] n’etiti ndị nsọ niile, ka e nyere amara a—ikwusara ndị mba ọzọ[b] akụnụba Mesaịa[a] nke a na-apụghị ịchọpụta omimi ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” A pụrụ ịsụgharị utu aha Grik Χριστός dịka “Mesaịa” ma ọ bụ “Kraịst”; n’ebe a, a sụgharịrị ihe utu aha ahụ pụtara.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “mba dị iche iche.” N’ọnọdụ a, o yikarịrị ka Pọl na-ekwu maka ndị mba ọzọ, ya bụ, ndị na-abụghị ndị Juu.
    reason: lexical_alternative
  - marker: c
    text: 'Nsụgharị ọdịnala: “onye dị nta karịa onye kasị nta n’etiti ndị nsọ niile.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: onye dịkarịrị nta
  rationale: Ụdị okwu Grik a na-eme ka ịdị nta pụta ìhè nke ukwuu. “Onye dịkarịrị nta” bụ Igbo dị ndụ nke na-egosipụta ịdị umeala n’obi Pọl n’enweghị ahịrịokwu na-adịghị eke ọnụ.
- source_word: ἁγίων
  choice: ndị nsọ
  rationale: N’akwụkwọ Pọl, okwu a na-ezo aka n’ebe ndị kwere ekwe, bụ́ ndị e doro Chineke nsọ, nọ. “Ndị nsọ” dị mkpirikpi ma kwekọọ n’usoro okwu Grik.
- source_word: χάρις
  choice: amara
  rationale: “Amara” na-eburu echiche nke ihu ọma Chineke nyere n’efu, ma n’ebe a ọ gụnyekwara ọrụ ozi Chineke nyere Pọl.
- source_word: ἔθνεσιν
  choice: ndị mba ọzọ
  rationale: N’ọnọdụ a, ọ na-ezo aka n’ebe ndị na-abụghị ndị Juu nọ, ọ bụghị naanị mba dị iche iche dịka mpaghara ndọrọ ndọrọ ọchịchị.
- source_word: εὐαγγελίσασθαι
  choice: ikwusara
  rationale: Infinitive a na-egosi ọrụ e nyere Pọl ikwusa ozi ọma. Ihe na-esote ya na-eme ka ihe ọ na-ekwusa doo anya, ya mere “ikwusara” bụ okwu Igbo dị mfe ma kwekọọ.
- source_word: ἀνεξιχνίαστον
  choice: nke a na-apụghị ịchọpụta omimi ya
  rationale: Okwu ahụ pụtara ihe a na-apụghị ịgbaso ụzọ ya ruo n’isi ma ọ bụ ghọta ya n’uju. Nsụgharị a na-echekwa ihe atụ nke nyocha ma na-ada nke ọma n’Igbo.
- source_word: πλοῦτος
  choice: akụnụba
  rationale: Pọl ji okwu a mee ihe atụ maka ụba ihe ọma dị n’ọrụ nzọpụta Chineke. “Akụnụba” na-egosipụta ụba ahụ nke ọma.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: N’ebe a Χριστός na-arụ ọrụ dịka utu aha nke Onye E Tere Mmanụ. “Mesaịa” na-asụgharị ihe utu aha ahụ pụtara kama ime ya ka ọ bụrụ naanị aha mmadụ.
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: Χριστός bụ utu aha n’ebe a. “Mesaịa” na-echekwa echiche nke Onye Chineke Tere Mmanụ, n’enweghị itinye nkọwa nke otu ụka.
- issue: Onye nyere amara ahụ
  choice: ka e nyere amara a
  alternative: Chineke nyere m amara a
  rationale: Grik ji passive ma hapụ onye nyere ya n’aghọtaghị aha. Nsụgharị ahụ na-echekwa nhapụ a kama ịgbakwunye “Chineke” n’ime isiokwu, ọ bụ ezie na ihe gbara ya gburugburu na-egosi ya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro “Mụ onwe m … ka e nyere” na-egosipụta nkwusi ike dị na ἐμοὶ ma na-echekwa passive nke Grik. E debere akara nkọwa ụkwụ n’ebe okwu nke ọ bụla metụtara nọ.
