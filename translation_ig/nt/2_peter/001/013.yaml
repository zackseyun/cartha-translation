id: 2PE.1.13
reference: 2 Peter 1:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/013.yaml
  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: ig
  text: Ma echere m na ọ kwesịrị ekwesị, mgbe m ka nọ n’ụlọikwuu a[a], ịkpalite unu site n’ịchetara unu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ebe obibi” ma ọ bụ “ahụ”; okwu Grik bụ “ụlọikwuu,” bụ ihe atụ banyere ahụ mmadụ na ndụ ya ugbu a nke na-adịghị adịgide adịgide.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: ihe ziri ezi
  rationale: N’usoro okwu ya na ἡγοῦμαι, okwu a na-egosi ihe kwesịrị ekwesị ma bụrụkwa ihe ziri ezi; ntụgharị a bụ Igbo doro anya nke na-edobe echiche omume na ịdị mma dị na okwu Grik.
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche n’ihe e kwuru tupu ya; “Ma” na-arụ ọrụ ahụ nke ọma n’Igbo.
- source_word: ἡγοῦμαι
  choice: ana m ewere ya
  rationale: Ọ na-egosi mkpebi mmadụ tụlere, ọ bụghị naanị echiche gafere agafe; “ana m ewere ya” bụ okwu Igbo dị ugbu a nke na-eburu echiche ahụ.
- source_word: ἐφ’ ὅσον
  choice: ogologo oge
  rationale: N’ebe a, ọ bụ nkebiokwu oge nke pụtara ‘ruo ogologo oge m ka nọ’; ntụgharị a na-agụ were were n’Igbo.
- source_word: σκηνώματι
  choice: ụlọikwuu
  rationale: σκηνώμα bụ ebe obibi yiri ụlọikwuu, ma n’ebe a ọ bụ ihe atụ banyere ndụ Pita dị ugbu a n’anụ ahụ. “Ụlọikwuu” na-edobe ihe atụ ahụ ma jikọta ya na echiche iwepụ ya n’amaokwu na-esote.
- source_word: διεγείρειν
  choice: ịkpali unu
  rationale: Ngwaa ahụ pụtara ịkpọte ma ọ bụ ime ka mmadụ bilie ime ihe; “ịkpali unu” na-egosi ịkwalite uche na omume ha n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: ἐν ὑπομνήσει
  choice: site n’ichetara unu
  rationale: Nkebiokwu a na-egosi ụzọ e si akpali ha—ya bụ, site n’ime ka ha cheta. Nke a bụ Igbo nkịtị ma doo anya.
theological_decisions:
- issue: Ihe atụ dị na “ụlọikwuu a”
  choice: E debere ihe atụ ahụ kpọmkwem dịka “ụlọikwuu a.”
  alternative: “ahụ a” ma ọ bụ “ebe obibi a”
  rationale: Grik kpọrọ ndụ Pita n’anụ ahụ “ụlọikwuu,” nke na-egosi na ọ bụ ebe obibi nwa oge ma kwadebe okwu amaokwu na-esote banyere iwepụ ya. Ịsụgharị ya dịka “ahụ” ga-akọwa ihe atụ ahụ kama idebe ya, ebe “ebe obibi” ga-eme ka onyonyo ụlọikwuu ghara ịpụta nke ọma.
translation_notes:
  register: Ejiri Igbo Izugbe dị ugbu a, kwụ ọtọ ma nwee ugwu. E debere usoro ahịrịokwu ahụ ka ọ gaa n’ihu ruo n’amaokwu na-esote, dịka isi mmalite Grik si eme, ma e zere okwu ochie ma ọ bụ nkọwa ụka pụrụ iche.
