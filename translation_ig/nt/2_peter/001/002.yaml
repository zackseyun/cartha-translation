  rationale: The revision makes only safe idiomatic and punctuation corrections. It maintains the optative blessing (“Ka ... baara unu ụba”), the potentially locative force of ἐν in the main text, and the lexical nuance of ἐπίγνωσις in the footnote. It does not resolve the Greek coordination into a doctrinally loaded interpretation.
