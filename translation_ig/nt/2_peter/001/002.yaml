  text: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: ig
  text: Ka amara na udo baara unu ụba n’ịmara Chineke na Jizọs, Onyenwe anyị[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “site n’ịmara Chineke na Jizọs, Onyenwe anyị.” Okwu mbu ụzọ Grik ahụ nwere ike igosi ọnọdụ (“n’”) ma ọ bụ ụzọ e si enweta ihe (“site na”).
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsị, “ịmara nke ọma” ma ọ bụ “ịmara n’ụzọ zuru ezu.” Okwu Grik ἐπίγνωσις nwere ike ịpụta ịmara nke miri emi ma ọ bụ nke zuru ezu karị.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa ihu ọma Chineke, ma dabara n’usoro ekele na ngọzi nke akwụkwọ ozi Ndị Kraịst.
- source_word: εἰρήνη
  choice: udo
  rationale: “Udo” na-echekwa ma echiche nke enweghị esemokwu ma echiche sara mbara nke ịdị mma na ọdịmma dị n’okwu a.
- source_word: πληθυνθείη
  choice: baara unu ụba
  rationale: Nkebi a na-egosipụta ọchịchọ ma ọ bụ ngọzi ka amara na udo bawanye nke ukwuu; ọ bụkwa ụzọ Igbo dị ndụ e si chekwaa echiche nke ‘ịba ụba.’
- source_word: ἐν
  choice: n’ime
  rationale: “N’ime” na-ebute echiche nke ọnọdụ ma ọ bụ mpaghara mmadụ nọ na ya, ma hapụkwa oghere maka njikọ nke nwere ike ịpụta ụzọ e si enweta ngọzi ahụ.
- source_word: ἐπιγνώσει
  choice: ịmata
  rationale: “Ịmata” dị eke n’Igbo ma nwee ike ịgụnye ọmụma nke mmekọrịta, ọ bụghị nanị ịma ihe n’uche; a hapụrụ echiche nke ‘ịmata nke ọma karị’ n’ala peeji.
- source_word: θεοῦ
  choice: Chineke
  rationale: Nke a bụ nsụgharị Igbo kwụ ọtọ maka aha Chineke n’ahịrịokwu a.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: E dere aha ahụ n’ụdị a maara nke ọma n’Igbo.
- source_word: κυρίου
  choice: Onyenwe
  rationale: “Onyenwe” na-echekwa ịdị arọ nke utu aha κύριος ma bụrụkwa okwu a na-aghọta nke ọma n’Igbo Ndị Kraịst.
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν
  choice: Chineke na Jizọs Onyenwe anyị
  rationale: Nhazi a na-eme ka o doo anya na ‘ịmata’ metụtara ma Chineke ma Jizọs, n’enweghị itinye nkọwa na-adịghị na Grik.
theological_decisions:
- issue: Ike pụrụ iche nke ἐπίγνωσις n’ebe a
  choice: ịmata
  alternative: ịmata nke ọma ma ọ bụ ịmata n’ụzọ zuru ezu
  rationale: Isi ederede jiri okwu Igbo dị mfe nke na-anaghị eme ka okwu ahụ bụrụ aha nkà mmụta okpukpe pụrụ iche; ala peeji na-echekwa ike ọzọ okwu Grik nwere ike ibu.
- issue: Ọrụ ἐν n’ihu ἐπιγνώσει
  choice: n’ime ịmata Chineke na Jizọs Onyenwe anyị
  alternative: site n’ịmata Chineke na Jizọs Onyenwe anyị
  rationale: Okwu Grik ahụ nwere ike igosi ọnọdụ (‘n’ime’) ma ọ bụ ụzọ e si enweta ihe (‘site na’). Isi ederede na-echekwa ọdịdị nke mbụ, ebe ala peeji na-egosi nke ọzọ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ka … baara unu ụba” na-arụ ọrụ dị ka ngọzi ma ọ bụ ọchịchọ, ebe “n’ime ịmata” na-echekwa ntakịrị mgbagwoju anya dị n’usoro Grik.
