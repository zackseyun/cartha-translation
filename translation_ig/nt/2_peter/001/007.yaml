  yaml_path: translation/nt/2_peter/001/007.yaml
  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: ig
  text: n’ịsọpụrụ Chineke, tinyekwanụ ịhụ ụmụnna n’anya[a]; n’ịhụ ụmụnna n’anya, tinyekwanụ ịhụnanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịhụnanya ụmụnna.” Okwu Grik a na-ezo aka n’ịhụ ụmụnna n’anya, karịchaa n’etiti ndị kwere ekwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: ịsọpụrụ Chineke
  rationale: Okwu a na-egosi nrube isi na nsọpụrụ a na-enye Chineke, nke a na-egosipụtakwa n’ụzọ mmadụ si ebi ndụ. Nhọrọ a bụ okwu Igbo doro anya nke na-ejigide ma akụkụ chere ihu n’ebe Chineke nọ ma akụkụ omume.
- source_word: φιλαδελφίαν
  choice: ịhụnanya e ji hụ ụmụnna
  rationale: φιλαδελφία bụ ịhụnanya na mmetụta ịhụnanya e nwere n’ebe ụmụnna nọ, karịchaa ndị ha na mmadụ bụ ndị kwere ekwe. Nkebiokwu a na-egosi kpọmkwem ndị ịhụnanya ahụ chere ihu, ma na-ahapụ ọdịiche dị n’etiti ya na ἀγάπη na-esote.
- source_word: ἀγάπην
  choice: ịhụnanya
  rationale: Nhọrọ a na-enye okwu ahụ n’ụzọ sara mbara ma dị mfe, ma na-edobe ya dịka njedebe kachasị elu nke usoro àgwà ọma a n’amaokwu ahụ.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: tinyekwa n’... ...
  rationale: Ọ bụ ezie na Grik na-ekwu n’ụzọ nkịtị ‘n’ime ...’, amaokwu a na-aga n’ihu n’iwu ‘tinyekwanụ’ nke dị n’amaokwu 5. Iweghachi ‘tinyekwa’ na Igbo na-eme ka njikọ ahụ doo anya ma na-edobe usoro a na-etinye otu àgwà ọma n’ọzọ.
- source_word: δέ
  choice: tinyekwa
  rationale: δέ bụ njikọ dị nro n’usoro nchịkọta a, ọ bụghị okwu na-egosi mmegide. ‘Tinyekwa’ na-egosipụta njikọ ya na ihe ndị bu ụzọ.
theological_decisions:
- issue: Ịmata ọdịiche dị n’etiti φιλαδελφία na ἀγάπη n’usoro àgwà ọma
  choice: Ịsụgharị φιλαδελφία dịka ‘ịhụnanya e ji hụ ụmụnna’ ma ἀγάπη dịka ‘ịhụnanya’
  alternative: Ịsụgharị ha abụọ dịka ‘ịhụnanya,’ ma kọwaa nke mbụ dịka ‘ịhụnanya ụmụnna’
  rationale: Grik ji okwu abụọ nwere njikọ ma dị iche mee usoro a. Nhọrọ a na-egosi na nke mbụ bụ ịhụnanya chere ihu n’ebe ụmụnna nọ, ebe nke ikpeazụ ka sara mbara, n’enweghị ịmanye nkọwa ozizi pụrụ iche.
translation_notes:
  register: Ejiri Igbo Izugbe nke dị ugbu a, dị ugwu ma dị mfe nghọta. ‘Ụmụnna’ nwere ike ịgụnye ụmụ nwoke na ụmụ nwanyị nọ n’otu ezinụlọ okwukwe. E debere mmegharị nke usoro okwu ahụ site n’ikwughachi ‘tinyekwa,’ nke na-ejikọ amaokwu a na iwu malitere n’amaokwu 5.
