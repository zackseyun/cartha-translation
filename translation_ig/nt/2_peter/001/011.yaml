id: 2PE.1.11
reference: 2 Peter 1:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: ig
  text: N’ihi na ọ bụ otu a ka a ga-enye unu, n’ụba, ohere ịbanye n’alaeze ebighị ebi nke Onyenwe anyị na Onye Nzọpụta anyị, Jizọs bụ Mezaya.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọnụ ụzọ mbata.” Okwu Grik εἴσοδος nwere ike ịpụta ịbanye ma ọ bụ ọnụ ụzọ mbata.
    reason: lexical_alternative
  - marker: b
    text: Nsụgharị ọdịnala bụ “Jizọs Kraịst.” N’ebe a, a sụgharịrị utu aha Grik Χριστός dịka “Mezaya” iji chekwaa ihe ọ pụtara.
    reason: alternative_reading
  - marker: c
    text: 'A pụkwara ịhazi okwu ahụ otu a: “N’ihi na ọ bụ otu a ka a ga-enye unu n’ụba ohere ịbanye n’alaeze ebighị ebi nke Onyenwe anyị na Onye Nzọpụta anyị, Jizọs bụ Mezaya.”'
    reason: previous_rendering
lexical_decisions:
- source_word: οὕτως γὰρ
  choice: N’ihi na ọ bụ n’ụzọ dị otu a
  rationale: Na-ejigide njikọ nkọwa γάρ na ihe bu ụzọ, ma na-egosikwa ike ntụaka nke οὕτως n’Igbo nkịtị.
- source_word: πλουσίως
  choice: n’ụba
  rationale: Na-egosi ihe e nyere nke ukwuu ma ọ bụ n’ụzọ bara ụba, n’enweghị ịgbatị ihe odide ahụ.
- source_word: ἐπιχορηγηθήσεται ὑμῖν
  choice: a ga-esi nye unu
  rationale: Na-echekwa ọdịdị mmebere e mere n’ahụ ihe nke ngwaa ọdịnihu ahụ; a kpọghị onye na-enye ya aha ebe Grik na-akpọghị ya.
- source_word: ἡ εἴσοδος
  choice: ịbanye
  rationale: Ụdị ngwaa-aha a bụ ụzọ Igbo dị ndụ si kwuo omume nke ịbanye, ma ọ ka na-ahapụ echiche nke ohere mbata.
- source_word: εἰς τὴν αἰώνιον βασιλείαν
  choice: n’alaeze ebighị ebi
  rationale: Na-enye kpọmkwem echiche nke ịbanye n’ime alaeze nke na-adịru mgbe ebighị ebi.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: nke Onyenwe anyị na Onye Nzọpụta anyị
  rationale: Na-edobe utu aha abụọ ahụ ma mee ka o doo anya n’Igbo na ha abụọ gbasara otu onye ahụ.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mezaya
  rationale: A sụgharịrị Χριστός dị ka utu aha “Mezaya,” kama idegharị ya naanị dị ka “Kraịst”; “bụ” na-eme ka utu aha ahụ daa nke ọma n’Igbo.
theological_decisions:
- issue: Onye utu aha “Onyenwe anyị na Onye Nzọpụta anyị” na-ezo aka na ya
  choice: Utu aha abụọ ahụ na-ezo aka n’otu onye, Jizọs bụ Mezaya.
  alternative: A pụrụ ịgụ ha dịka utu aha ndị na-ezo aka n’ụzọ sara mbara n’ebe ndị dị iche nọ.
  rationale: Otu mkpụrụokwu njirimara Grik na-achị aha mmadụ abụọ dị n’otu ọnụọgụ nke καί jikọtara; nhazi ahụ na-akwadosi ike na ha abụọ bụ otu onye.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi “ọ bụ n’ụzọ dị otu a ka…” na-ejikọta amaokwu a na ndụ a kọwara n’amaokwu ndị bu ya ụzọ. E debere ihe a na-emeghị ka o doo anya n’ọrụ passive n’enweghị ịkpọ onye na-enye ohere mbata aha.
