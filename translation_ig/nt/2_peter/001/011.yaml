revisions:
- from: N’ihi na ọ bụ n’ụzọ dị otu a ka a ga-esi nye unu n’ụba ịbanye n’alaeze ebighị ebi nke Onyenwe anyị na Onye Nzọpụta anyị, Jizọs bụ Mezaya.[a][b][c]
  to: N’ihi na ọ bụ otu a ka a ga-enye unu, n’ụba, ohere ịbanye n’alaeze ebighị ebi nke Onyenwe anyị na Onye Nzọpụta anyị, Jizọs bụ Mezaya.[a][b][c]
  rationale: The revision makes the supplied object—access/entry—explicit in natural Standard Igbo, while retaining the Greek future passive, the abundant sense of πλουσίως, and the contextual force of οὕτως γάρ. Footnotes have been tightened for idiomatic Igbo and aligned with the revised wording without adding interpretive claims.
