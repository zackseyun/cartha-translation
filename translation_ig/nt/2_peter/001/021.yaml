id: 2PE.1.21
reference: 2 Peter 1:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη ⸂προφητεία ποτέ⸃, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ⸀ἀπὸ θεοῦ ἄνθρωποι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: ig
  text: N’ihi na ọ dịghị mgbe e ji ọchịchọ mmadụ bute amụma[a][c]; kama, ndị mmadụ kwuru okwu sitere n’aka Chineke, ka Mmụọ Nsọ na-eburu ha aga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “amụma esiteghị n’ọchịchọ mmadụ pụta.” Ngwaa Grik dị n’ụdị ndidi, ọ bụkwa otu mgbọrọgwụ ya na okwu a sụgharịrị “na-eburu ha aga” n’ikpeazụ amaokwu a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka Mmụọ Nsọ na-akpali ha.” N’ụzọ ka nso n’asụsụ Grik, ọ bụ “ka Mmụọ Nsọ na-eburu ha aga,” nke na-emesi nduzi siri ike nke Mmụọ Nsọ ike.
    reason: lexical_alternative
  - marker: c
    text: “Mmadụ” na “ndị mmadụ” sụgharịrị ἄνθρωπος/ἄνθρωποι. N’ebe a, ha na-anọchi anya ụmụ mmadụ n’ozuzu, ha abụghị okwu e ji ewepụ ụmụ nwanyị.
    reason: cultural_note
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: e ji ọchịchọ mmadụ
  rationale: Usoro a na-egosi na ọchịchọ mmadụ abụghị ihe e ji malite ma ọ bụ mee ka amụma pụta; “mmadụ” nọ n’otu ọnụ ọgụgụ dịka n’asụsụ Grik, ma ọ na-anọchi anya ụmụ mmadụ n’ozuzu.
- source_word: ἠνέχθη
  choice: wepụta
  rationale: “Wepụta” na-egosi mmalite ma ọ bụ mpụta nke amụma, ebe “e ji” na-edobe echiche nke ngwa ọrụ n’ahịrịokwu ahụ. Ihe odide ala na-enye nsụgharị ọzọ nke na-egosipụta ngwaa ndidi na njikọ ya na φερόμενοι.
- source_word: προφητεία
  choice: amụma
  rationale: “Amụma” bụ okwu Igbo a na-ejikarị akọwa ozi ma ọ bụ okwu sitere n’aka Chineke nke onye amụma kwuru.
- source_word: ποτέ
  choice: ọ dịghị mgbe
  rationale: Mgbe οὐ na ποτέ jikọrọ, ha na-ekwusi ike na nke a emeghị n’oge ọ bụla.
- source_word: ὑπὸ πνεύματος ἁγίου
  choice: Mmụọ Nsọ
  rationale: N’usoro “Mmụọ Nsọ na-eburu ha aga,” Mmụọ Nsọ bụ onye na-eme ihe ahụ, dịka ὑπό tinyere genitive si egosi.
- source_word: φερόμενοι
  choice: na-eburu ha aga
  rationale: 'Nke a na-edobe ihe atụ doro anya nke φέρω: Mmụọ Nsọ na-enye ndị na-ekwu okwu nduzi na mkpali siri ike, ọ bụghị nanị mmetụta na-edoghị anya.'
- source_word: ἐλάλησαν
  choice: kwuru okwu
  rationale: Nke a bụ nsụgharị kwụ ọtọ na nke nkịtị nke λαλέω.
- source_word: ἀπὸ θεοῦ
  choice: sitere n’ebe Chineke nọ
  rationale: “Sitere n’ebe” na-edobe echiche isi mmalite nke ἀπό, ma ọ naghị agwakọta ya na ọrụ onye na-eme ihe nke Mmụọ Nsọ.
- source_word: ἄνθρωποι
  choice: ndị mmadụ
  rationale: “Ndị mmadụ” bụ Igbo ebumpụta ụwa maka ọtụtụ ἄνθρωποι ma na-egosi ndị na-ekwu okwu dịka ụmụ mmadụ, n’emeghị ka okwu ahụ bụrụ naanị maka ndị nwoke.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ọrụ Chineke na ọrụ mmadụ n’amụma
  choice: Amụma esighị n’ọchịchọ mmadụ pụta; ma ndị mmadụ kwuru okwu nke sitere na Chineke mgbe Mmụọ Nsọ na-eburu ha aga.
  alternative: Ịsị na Mmụọ Nsọ na-agwa ha mkpụrụokwu niile n’ụzọ ha na-enweghị òkè ọ bụla, ma ọ bụ na amụma sitere n’echiche mmadụ nke Chineke mechara metụta.
  rationale: 'Asụsụ Grik na-ejigide eziokwu abụọ ọnụ: ndị mmadụ kwuru okwu n’ezie, ma isi mmalite na nduzi siri ike sitere na Chineke site na Mmụọ Nsọ. Nsụgharị ahụ anaghị ekpebi na nke a bụ naanị ide ihe a gwara ha mkpụrụokwu n’ụzọ igwe, ọ naghịkwa enye ọchịchọ mmadụ òkè n’ịmalite amụma.'
translation_notes:
  register: E ji Standard Igbo nke oge a, nke nwere ugwu ma dị mfe nghọta. “Amụma,” “Mmụọ Nsọ,” na “Chineke” bụ okwu Baịbụl ndị mmadụ maara; ahịrịokwu ahụ na-edobe ọdịiche dị n’etiti isi mmalite (“sitere n’ebe Chineke nọ”) na onye na-eduzi (“Mmụọ Nsọ na-eburu ha aga”).
