review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the denial of human volition as prophecy’s origin, the divine source of the speakers’ message, and the Holy Spirit’s active agency. A small revision better represents the Greek passive ἠνέχθη and makes the Spirit’s agency syntactically clearer.
  naturalness: The revised wording is idiomatic Standard Igbo. “E ji ọchịchọ mmadụ bute amụma” preserves the instrumental construction without suggesting that a human merely extracted or formulated prophecy. “Ka Mmụọ Nsọ na-eburu ha aga” naturally links the Spirit’s ongoing carrying with the speakers’ act.
  terminology: “Amụma,” “Mmụọ Nsọ,” and “Chineke” are appropriate established biblical terms. “Sitere n’aka Chineke” clearly expresses ἀπὸ θεοῦ as source, while retaining a distinction from the Spirit as agent.
  issues:
  - severity: medium
    issue: “e ji ọchịchọ mmadụ wepụta amụma” is less precise for ἠνέχθη.
    rationale: “Wepụta” can suggest producing or bringing out an object. “E ji ... bute amụma” more closely retains the passive ‘was brought’ imagery and its lexical echo with φερόμενοι.
  - severity: low
    issue: The conjunction “mgbe” can make the participial clause primarily temporal.
    rationale: The Greek participle also identifies the condition and divine agency under which the human speakers spoke. “Ka Mmụọ Nsọ na-eburu ha aga” more directly conveys that relationship.
  - severity: low
    issue: “sitere n’ebe Chineke nọ” is understandable but less direct in this context.
    rationale: “Sitere n’aka Chineke” is a natural Standard Igbo expression for a message or speech whose source is God.
  revised_text: N’ihi na ọ dịghị mgbe e ji ọchịchọ mmadụ bute amụma[a][c]; kama, ndị mmadụ kwuru okwu sitere n’aka Chineke, ka Mmụọ Nsọ na-eburu ha aga[b].
