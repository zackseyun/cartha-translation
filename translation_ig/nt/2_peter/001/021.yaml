revisions:
- from: N’ihi na ọ dịghị mgbe e ji ọchịchọ mmadụ wepụta amụma[a][c]; kama, ndị mmadụ kwuru okwu sitere n’ebe Chineke nọ, mgbe Mmụọ Nsọ na-eburu ha aga[b].
  to: N’ihi na ọ dịghị mgbe e ji ọchịchọ mmadụ bute amụma[a][c]; kama, ndị mmadụ kwuru okwu sitere n’aka Chineke, ka Mmụọ Nsọ na-eburu ha aga[b].
  rationale: The revision maintains the draft’s meaning and register while improving correspondence to the paired Greek forms ἠνέχθη and φερόμενοι. It does not resolve the verse into either mechanical dictation or merely human religious reflection.
