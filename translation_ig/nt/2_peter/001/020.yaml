review_pass:
  verdict: revise
  source_fidelity: The draft correctly treats the verse as concerning the origin/coming of prophecy rather than imposing a rule about contemporary interpreters. However, it adds “onye amụma” (“the prophet”), which is not stated in the Greek and settles an ambiguity in ἰδίας ἐπιλύσεως that should remain open.
  naturalness: The sentence is clear and suitably formal in Standard Igbo. “Buru ụzọ mara nke a” is a more natural and direct equivalent for the opening emphasis than “Nke mbụ, maranụ nke a.”
  terminology: “Amụma,” “Akwụkwọ Nsọ,” and “nkọwa” are appropriate. “Amụma ọ bụla nke Akwụkwọ Nsọ” more directly represents προφητεία γραφῆς than “amụma ọ bụla dị n’Akwụkwọ Nsọ.” “Nkọwa nke onye ọ bụla n’onwe ya” preserves the non-specific possessive force without supplying “the prophet.”
  issues:
  - severity: medium
    issue: The text specifies “onye amụma” in “nkọwa nke onye amụma n’onwe ya.”
    rationale: The Greek has no noun meaning “prophet” here. Although the following verse concerns prophets, supplying this referent resolves a debated syntactic/semantic question and narrows the wording beyond the source.
  - severity: low
    issue: “dị n’Akwụkwọ Nsọ” is less direct than the genitive construction.
    rationale: The draft is intelligible, but “nke Akwụkwọ Nsọ” better retains “prophecy of Scripture” without materially changing the sense.
  revised_text: 'Buru ụzọ mara nke a: amụma ọ bụla nke Akwụkwọ Nsọ adịghị esite ná nkọwa nke onye ọ bụla n’onwe ya.'
