base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/020.yaml
  text: 'knowing this first: that every prophecy of Scripture does not come about from one''s own interpretation.'
translation:
  language: ig
  text: 'Buru ụzọ mara nke a: amụma ọ bụla nke Akwụkwọ Nsọ adịghị esite ná nkọwa nke onye ọ bụla n’onwe ya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: Nke mbụ, maranụ nke a
  rationale: Na-edobe mkpa e nyere okwu a dị ka ihe a ga-ebu ụzọ mara, n’Igbo kwụ ọtọ ma dị mma.
- source_word: πᾶσα προφητεία γραφῆς
  choice: amụma ọ bụla dị n’Akwụkwọ Nsọ
  rationale: “Amụma ọ bụla” na-edobe πᾶσα, ebe “dị n’Akwụkwọ Nsọ” na-egosi njikọ genitive nke γραφῆς n'ụzọ ndị na-agụ Igbo ga-aghọta ngwa ngwa.
- source_word: ἰδίας ἐπιλύσεως
  choice: nkọwa nke onye amụma n’onwe ya
  rationale: ἐπίλυσις pụtara ịkọwa ma ọ bụ ịkọwapụta ihe. “N’onwe ya” na-egosipụta ἰδίας; ịkpọ “onye amụma” aha na-eme ka onye e zoro aka na ya doo anya n’usoro okwu Igbo, n’ìhè nke amaokwu na-esote, ma ọ bụghị iji kpebie usoro nkà mmụta okpukpe.
- source_word: οὐ γίνεται
  choice: adịghị esite ná
  rationale: γίνεται nwere ike ịpụta “na-abịa/na-apụta/na-eme.” N’ebe a, “adịghị esite ná” na-egosipụta mmalite ma ọ bụ isi iyi, ma kwekọọ na nkọwa banyere otú amụma si bịa n’amaokwu 21.
theological_decisions:
- issue: Ma amaokwu a na-ekwu banyere onye na-akọwa Akwụkwọ Nsọ ugbu a, ka ọ bụ banyere isi mmalite amụma ahụ
  choice: E ji “adịghị esite ná nkọwa nke onye amụma n’onwe ya” gosipụta isi mmalite nke amụma ahụ.
  alternative: “Ọ dịghị onye nwere ike ịkọwa amụma Akwụkwọ Nsọ n’onwe ya.”
  rationale: Ụdị ọzọ nwere ike ịghọ iwu banyere onye nwere ikike ịkọwa Akwụkwọ Nsọ, nke Greek anaghị ekwu kpọmkwem. οὐ γίνεται na amaokwu 21 na-akwado echiche banyere otú amụma si pụta.
translation_notes:
  register: Asụsụ Igbo Izugbe, dị ùgwù ma doo anya nye ndị na-agụ akwụkwọ taa. A họọrọ usoro okwu dị mfe, na-ezere okwu ụka pụrụ iche ma ọ bụ nkọwa nke otu òtù.
