id: 2PE.1.1
reference: 2 Peter 1:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a servant and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: ig
  text: 'Simiọn Pita, ohu na onyeozi nke Jizọs, bụ Mesaya, na-edegara ndị natara okwukwe ha na nke anyị hà n’uru[a], n’ezi omume[b] nke Chineke anyị na Onye Nzọpụta anyị, bụ Jizọs, onye Mesaya[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “okwukwe nke ọnọdụ ma ọ bụ nsọpụrụ ya na nke anyị hà.” Okwu Grik ahụ nwere ike imesi nhatanha nke uru, nsọpụrụ, ma ọ bụ ihe ùgwù ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “site n’ezi omume” ma ọ bụ “n’ime ezi omume.” Okwu njikọ Grik ahụ nwere ike igosi ọnọdụ ma ọ bụ ụzọ e si mee ihe.
    reason: lexical_alternative
  - marker: c
    text: N’usoro Grik, otu mkpụrụokwu nkọwa na-achị “Chineke anyị” na “Onye Nzọpụta,” ya mere ọ na-akachasị egosi otu onye, ya bụ Jizọs, onye Mesaya. Ụzọ ọzọ, nke na-adịchaghị ike n’usoro asụsụ Grik, bụ ịghọta ya dịka “Chineke anyị” na “Onye Nzọpụta Jizọs, onye Mesaya,” nke ga-ezo aka na mmadụ abụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: Simiọn Pita
  rationale: “Simiọn” na-egosipụta ụdị aha Συμεών dị n’ebe a, ọ bụghị ụdị Σίμων; “Pita” bụ ụdị aha Πέτρος a maara nke ọma n’Igbo.
- source_word: δοῦλος
  choice: ohu
  rationale: “Ohu” na-egosipụta onye nọ n’okpuru onye nwe ya kpamkpam, nke bụ isi echiche δοῦλος; n’ebe a, ọ na-egosi na Pita bụ nke Jizọs kpamkpam, ọ bụghị naanị onye na-arụ ọrụ enyemaka.
- source_word: ἀπόστολος
  choice: onyeozi
  rationale: “Onyeozi” bụ okwu Igbo a nabatara maka onye e zigara nwere ikike na ọrụ pụrụ iche.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mesaya
  rationale: Χριστός bụ utu aha pụtara Mesaya. Itinye “bụ” na-eme ka utu aha ahụ doo anya ma bụrụkwa Igbo dị mfe nghọta.
- source_word: τοῖς ... λαχοῦσιν
  choice: ndị natara
  rationale: “Natara” na-egosi na okwukwe ahụ bịara dịka ihe e nyere ha, ọ bụghị ihe ha ji ike nke onwe ha nweta; ọ naghịkwa amanye ihe oyiyi nke ịtụ nza.
- source_word: ἰσότιμον ... πίστιν
  choice: okwukwe nke ọnụ ahịa ya na nke anyị hà
  rationale: Nke a na-ekwupụta nhatanha nke uru ma ọ bụ nsọpụrụ okwukwe ha na nke ndịozi, n’enweghị ime ka ọ bụrụ naanị mmetụta nke ịbụ ihe dị oke ọnụ.
- source_word: πίστιν
  choice: okwukwe
  rationale: N’ebe a πίστις bụ okwukwe ndị kwere ekwe na ndịozi nwere ọnụ; “okwukwe” bụ okwu Igbo doro anya na nke a na-ejikarị eme ihe.
- source_word: ἐν δικαιοσύνῃ
  choice: n’ezi omume
  rationale: Nsụgharị a na-edebe ohere nke ἐν igosi ọnọdụ ma ọ bụ ụzọ e si nata okwukwe ahụ; nkọwa ala peeji na-egosi ụzọ ọzọ.
- source_word: δικαιοσύνῃ
  choice: ezi omume
  rationale: “Ezi omume” na-enye echiche nke ịdị ezi n’anya Chineke n’Igbo nkịtị ma na-adabara ọnọdụ a karịa “ikpe ziri ezi” naanị.
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: nke Chineke anyị na Onye Nzọpụta anyị, bụ Jizọs Mesaya
  rationale: Nhazi Grik ahụ nwere otu isiokwu na-achị aha abụọ ahụ, ya mere ọ na-egosi nke ọma na otu onye ahụ—Jizọs Mesaya—bụ Chineke anyị na Onye Nzọpụta anyị.
theological_decisions:
- issue: Ma “Chineke anyị na Onye Nzọpụta anyị, Jizọs Mesaya” ọ na-ekwu maka otu onye ka ọ bụ mmadụ abụọ
  choice: 'Otu onye: a kpọrọ Jizọs Mesaya ma “Chineke anyị” ma “Onye Nzọpụta anyị.”'
  alternative: 'Mmadụ abụọ: “Chineke anyị” na “Onye Nzọpụta Jizọs Mesaya.”'
  rationale: N’asụsụ Grik, otu isiokwu ahụ jikọtara aha mmadụ abụọ dị otu ọnụ ọgụgụ site na καί, nke na-akwado nke ukwuu na ha abụọ na-ezo aka n’otu onye. E debeghịkwa ụzọ ọzọ ahụ n’efu; e tinyere ya n’ala peeji n’ihi mkpa okwu a gbasara onye Jizọs bụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. A họọrọ “ohu” iji chekwaa ike nke δοῦλος, “onyeozi” maka ọrụ apostol, na “Mesaya” iji mee ka Χριστός nọgide bụrụ utu aha. Akara ala peeji [a]–[c] niile dị n’ahịrị isi n’ebe okwu ha na-akọwa dị.
