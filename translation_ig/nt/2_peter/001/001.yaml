revisions:
- from: 'Simiọn Pita, ohu na onyeozi Jizọs bụ Mesaya, na-edegara ndị natara okwukwe nke ọnụ ahịa ya na nke anyị hà[a], n’ezi omume[b] nke Chineke anyị na Onye Nzọpụta anyị, bụ Jizọs Mesaya[c]:'
  to: 'Simiọn Pita, ohu na onyeozi nke Jizọs, bụ Mesaya, na-edegara ndị natara okwukwe ha na nke anyị hà n’uru[a], n’ezi omume[b] nke Chineke anyị na Onye Nzọpụta anyị, bụ Jizọs, onye Mesaya[c]:'
  rationale: The changes repair the Igbo syntax of the genitive relationship to Jesus, make the equal-status expression natural and accurate, and correct the alternatives and wording of the notes. The verse continues to preserve the source’s ambiguity where a less likely two-person construal has been proposed, while presenting the Greek’s most natural reading in the text.
