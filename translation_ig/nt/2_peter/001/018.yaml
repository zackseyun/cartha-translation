source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: ig
  text: anyị onwe anyị nụrụ olu a nke e sitere n’eluigwe weta, mgbe anyị na ya nọ n’elu ugwu nsọ ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “olu a nke e sitere n’eluigwe buru bịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: olu a
  rationale: Okwu φωνή ebe a na-ezo aka n'okwu Chineke e kwuru n'amaokwu bu ụzọ, ya mere “olu” dabara karịa okwu sara mbara dị ka “ụda.”
- source_word: ἡμεῖς
  choice: anyị onwe anyị
  rationale: Nnọchiaha Grik ahụ pụtara ìhè n'agbanyeghị na ngwaa ahụ egosilarị onye na ọnụ ọgụgụ; “anyị onwe anyị” na-echekwa nkwusi ike e nyere akaebe ndị ji anya ha hụ ihe ahụ.
- source_word: ἠκούσαμεν
  choice: nụrụ
  rationale: Aorist active indicative nke ἀκούω na-egosi otu ihe mere—ịnụ olu ahụ—ọ bụghị omume ige ntị na-aga n'ihu.
- source_word: ἐξ οὐρανοῦ
  choice: si n’eluigwe
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo na olu ahụ sitere n'eluigwe.
- source_word: ἐνεχθεῖσαν
  choice: ka e ... bute ya
  rationale: Aorist passive participle nke φέρω na-akọwa “olu”; nhazi a na-echekwa echiche na e si n'eluigwe wetara ma ọ bụ bufee olu ahụ, n'agbanyeghị na Igbo nwere ike ikwu ya n'ụzọ dịtụ iche.
- source_word: σὺν αὐτῷ ὄντες
  choice: mgbe anyị na ya nọ
  rationale: A sụgharịrị participial construction ahụ dị ka nke oge, nke bụ ụzọ Igbo eke si kwuo ya; “ya” na-ezo aka na Jizọs dịka gburugburu okwu ahụ si dị.
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: n’elu ugwu ahụ dị nsọ
  rationale: “N'elu ugwu” bụ okwu Igbo dabara adaba maka ọnọdụ ahụ; “dị nsọ” na-echekwa ἁγίῳ n'ebughị ụzọ kpọọ ugwu ahụ aha.
theological_decisions:
- issue: Ihe “ugwu ahụ dị nsọ” na-ezo aka na ya
  choice: Nkọwa maka ugwu ebe mgbanwe ọdịdị Jizọs mere, n'ebughị ụzọ kpọọ kpọmkwem ugwu ọ bụ.
  alternative: Ịkpọ ya Ugwu Tabor ma ọ bụ Ugwu Hemon.
  rationale: Ihe odide Grik kpọrọ ya naanị “ugwu ahụ dị nsọ”; ịkpọ otu ugwu aha ga-etinye omenala nkọwa nke ihe odide ahụ ekwughị.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji “anyị onwe anyị” chekwaa nkwusi ike nke ἡμεῖς, ma e jighị aha ugwu ọ bụla edozi ihe ederede ahụ hapụrụ n'amaghị ama.
