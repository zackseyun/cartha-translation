id: 2PE.1.3
reference: 2 Peter 1:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: ig
  text: Dị ka ike ya nke bụ ike Chineke nyerela anyị ihe niile metụtara ndụ na ibi ndụ n’ịsọpụrụ Chineke, site n’ịmara Onye kpọrọ anyị site n’ebube na ịdị mma nke ya[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “maka ebube na ịdị mma nke ya.” A pụrụ ịghọta nkebi okwu Grik dị na dative n’ụzọ dị iche.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: Dị ka
  rationale: Na-edobe njikọ okwu Grik nke na-ejikọta amaokwu a na agbamume na-esote, n’agbanyeghị na a pụkwara ịghọta ya n’ụzọ na-egosi ihe kpatara ya.
- source_word: θείας δυνάμεως αὐτοῦ
  choice: ike ya nke bụ nke Chineke
  rationale: Na-egosipụta ma nnọchiaha αὐτοῦ ma ọdịdị θεῖος, n’enweghị ịtụgharị ya ka ọ bụrụ nanị ‘ike dị nsọ.’
- source_word: δεδωρημένης
  choice: nyerela anyị
  rationale: Ụdị ngwaa zuru ezu na-egosi onyinye e nyere nke uru ya ka dị ugbu a; ‘nyerela’ na-egosipụta nke a n’Igbo nkịtị.
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: ihe niile metụtara ndụ na ibi ndụ n’ịsọpụrụ Chineke
  rationale: ‘Metụtara’ na-edobe obosara τὰ πρὸς, ebe nkọwa εὐσέβεια dị ka ibi ndụ n’ịsọpụrụ Chineke doro ndị na-agụ Igbo anya.
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: site n’ịmata
  rationale: Na-egosipụta ụzọ e si enweta onyinye ndị ahụ, ma ghara ime ἐπίγνωσις ka ọ bụrụ okwu nkà mmụta nwere nkọwa karịrị nke ọnọdụ a chọrọ.
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: Onye ahụ kpọrọ anyị
  rationale: Na-edobe participle ahụ dị ka onye ma na-eme ka okwu ahụ bụrụ Igbo kwụ ọtọ ma dị ebube.
- source_word: ἰδίᾳ δόξῃ καὶ ἀρετῇ
  choice: site n’ebube na ịdị-mma kachasị elu nke ya onwe ya
  rationale: ‘Site na’ na-egosipụta dative dị ka ụzọ ma ọ bụ ihe e ji kpọọ; ‘nke ya onwe ya’ na-edobe nkwusi ike nke ἰδίᾳ, ebe ‘ịdị-mma kachasị elu’ na-ebuga echiche sara mbara nke ἀρετή.
- source_word: ζωὴν
  choice: ndụ
  rationale: Na-edobe okwu ahụ sara mbara, ka ọ nwee ike ịgụnye ndụ ugbu a na ndụ ga-abịa.
- source_word: εὐσέβειαν
  choice: ibi ndụ n’ịsọpụrụ Chineke
  rationale: Nke a bụ Igbo dị ugbu a ma doo anya, na-egosipụta omume ndụ chere ihu n’ebe Chineke nọ karịa okwu ochie ma ọ bụ nke ụka pụrụ iche.
theological_decisions:
- issue: Ọ̀ bụ ụzọ e si kpọọ ka ọ bụ nzube ọkpụkpọ ahụ n’okwu ἰδίᾳ δόξῃ καὶ ἀρετῇ?
  choice: site n’ebube na ịdị-mma kachasị elu nke ya onwe ya
  alternative: ka anyị ruo n’ebube na ịdị-mma kachasị elu nke ya onwe ya
  rationale: N’usoro okwu SBLGNT e nyere, dative ahụ nwere ike ịbụ ihe e ji mee ihe, ya mere isi ederede jiri ‘site na.’ Ma ebe a pụkwara ịghọta ya dị ka ebe ma ọ bụ nzube a kpọrọ mmadụ ka ọ ruo, e debere nke ahụ n’ala peeji kama idozi mgbagwoju anya ahụ kpamkpam.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A gbasapụrụ εὐσέβεια ntakịrị ka ọ bụrụ ‘ibi ndụ n’ịsọpụrụ Chineke’ iji zere okwu ụka nke nwere ike ghara ido ọtụtụ ndị anya. Akara ala peeji [a] dị ozugbo n’azụ nkebi okwu ọ na-akọwa, ọ bụghị n’azụ ‘ịsọpụrụ Chineke.’ E debere rikọm ngwụcha n’ihi na amaokwu Grik a na-aga n’ihu n’usoro ahịrịokwu buru ibu.
