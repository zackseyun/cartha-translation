revisions:
- from: Dị ka ike ya nke bụ nke Chineke nyerela anyị ihe niile metụtara ndụ na ibi ndụ n’ịsọpụrụ Chineke, site n’ịmata Onye ahụ kpọrọ anyị site n’ebube na ịdị-mma kachasị elu nke ya onwe ya[a],
