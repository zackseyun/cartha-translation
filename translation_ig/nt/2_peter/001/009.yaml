id: 2PE.1.9
reference: 2 Peter 1:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ⸀ἁμαρτημάτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/009.yaml
  text: For whoever lacks these things is blind[a], being shortsighted[b], having forgotten the cleansing of his former sins.
translation:
  language: ig
  text: N’ihi na onye na-enweghị ihe ndị a bụ onye ìsì, onye na-ahụ naanị ihe dị ya nso[a], ebe o chefuola na e mere ka ọ dị ọcha site ná mmehie ochie ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-adịghị ahụ ebe dị anya.” Okwu Grik ahụ nwekwara ike ịpụta onye na-ahụ naanị ihe dị nso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ γὰρ μὴ πάρεστιν ταῦτα
  choice: N’ihi na onye ihe ndị a na-adịghị n’ime ya
  rationale: Nkebi a na-egosi onye àgwà ndị e depụtara n’amaokwu bu ụzọ na-adịghị n’ime ya. Nsụgharị a na-edobe ntụaka sara mbara nke ταῦτα ma na-asụ ya n’Igbo eke.
- source_word: τυφλός ἐστιν
  choice: bụ onye ìsì
  rationale: Nke a na-edobe ihe atụ doro anya nke onye na-enweghị ike ịhụ ụzọ ime mmụọ.
- source_word: μυωπάζων
  choice: onye na-ahụ naanị ihe dị ya nso
  rationale: Okwu Grik a nwere ike ịpụta ịhụ naanị ihe dị nso ma ọ bụ ịbụ onye anya-adịghị-ahụ-ebe-dị-anya; nkebi a bụ nke doro ndị na-agụ Igbo anya ma na-edobe ihe oyiyi ahụ.
- source_word: λήθην λαβὼν
  choice: ebe o chefuola
  rationale: Nke a bụ ụzọ Igbo e si kwuo akpaalaokwu Grik ahụ n'ụzọ eke, ma na-edobe ọrụ nkebi participle ahụ.
- source_word: τοῦ καθαρισμοῦ
  choice: na e mere ka ọ dị ọcha
  rationale: 'Ụdị ngwaa a na-eme ka echiche nke καθαρισμός doo anya n’Igbo nkịtị: iwepụ adịghị ọcha nke mmehie.'
- source_word: τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: site ná mmehie ochie ya
  rationale: πάλαι na-arụtụ aka ná mmehie ndị dịbu na mbụ; ‘mmehie ochie ya’ na-edobe otu onye nke αὐτοῦ ma bụrụ okwu Igbo a na-aghọta ngwa ngwa.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ‘onye ìsì’ na μυωπάζων
  choice: 'E debere ha abụọ: ‘onye ìsì, onye na-ahụ naanị ihe dị ya nso.’'
  alternative: Ịsụgharị ya naanị dịka ‘onye anya-adịghị-ahụ-ebe-dị-anya.’
  rationale: Asụsụ Grik jikọtara ihe oyiyi siri ike nke ìsì na nke ịhụ naanị ihe dị nso. Kama idozi esemokwu ihe oyiyi ahụ n’otu ụzọ, nsụgharị ahụ na-edobe ha abụọ.
- issue: Ihe ịdị ọcha ahụ pụtara n’ụzọ nkà mmụta okpukpe
  choice: ‘e mere ka ọ dị ọcha site ná mmehie ochie ya’
  alternative: ‘a gbaghaara ya mmehie ochie ya’
  rationale: καθαρισμός pụtara ime ka ọ dị ọcha, ọ bụghị kpọmkwem okwu nkịtị maka mgbaghara. Ya mere, e zere ịgbanwe ihe oyiyi ahụ ka ọ bụrụ nkọwa otu ozizi.
- issue: Nnọchiaha otu onye αὐτοῦ
  choice: ‘ya’
  alternative: Ịgbanwe ahịrịokwu ahụ ka ọ bụrụ ọtụtụ mmadụ
  rationale: ‘Ya’ n’Igbo adịghị akọwapụta nwoke ma ọ bụ nwaanyị, ma ọ na-edobe otu onye nke asụsụ Grik n’enweghị itinye okike mmadụ na-adịghị mkpa.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke nwere ugwu ma dị mfe nghọta. ‘Ihe ndị a’ na-ezo aka n’àgwà ọma ndị e depụtara n’amaokwu bu ụzọ. E tinyere akara ntụaka [a] ozugbo n’ebe okwu nwere ntụgharị ọzọ dị.
