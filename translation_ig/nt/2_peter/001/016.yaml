id: 2PE.1.16
reference: 2 Peter 1:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: ig
  text: N’ihi na ọ bụghị site n’ịgbaso akụkọ ifo e ji nkà chepụta ka anyị mere ka unu mata ike na ọbịbịa[a] nke Onyenwe anyị Jizọs Mezaya,[b] kama, site n’ịghọ ndị ji anya ha hụ ebube ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ọnụnọ ya” ma ọ bụ “mbata ya.” Okwu Grik παρουσία pụrụ ịpụta ọnụnọ mmadụ, mbata ya, ma ọ bụ—n’ọtụtụ ebe n’Agba Ọhụrụ—ọbịbịa nke Mezaya.
    reason: alternative_reading
  - marker: b
    text: 'Grik: “Kraịst.” A sụgharịrị ya “Mezaya” n’ebe a n’ihi na Χριστός bụ aha ọkwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: akụkọ ifo ndị e ji aghụghọ chepụta
  rationale: Nke a na-egosi ma na akụkọ ndị ahụ bụ akụkọ ifo ma na e ji nkà aghụghọ kee ha, n’asụsụ Igbo dị mfe ma doo anya.
- source_word: ἐξακολουθήσαντες
  choice: ka anyị gbasoro
  rationale: “Ịgbaso” na-echekwa echiche nke iso akụkọ ndị ahụ, ebe nhazi “ọ bụghị ... ka” na-eme ka ọdịiche dị n’etiti akụkọ ifo na ihe ndị ha ji anya ha hụ pụta ìhè.
- source_word: ἐγνωρίσαμεν
  choice: anyị mere ka unu mata
  rationale: Nke a bụ ntụgharị nkịtị na nke ziri ezi nke γνωρίζω, ma na-echekwa onye a gwara okwu, ὑμῖν.
- source_word: δύναμιν
  choice: ike
  rationale: “Ike” bụ okwu Igbo kpọmkwem na nke a na-ejikarị akọwa δύναμις.
- source_word: παρουσίαν
  choice: ọbịbịa
  rationale: N’ebe a ọ pụrụ izo aka n’ọbịbịa Mesaịa, ebe okwu Grik ahụ nwekwara ike ịpụta ịnọ ya ma ọ bụ mbata ya; e debere ohere ndị ahụ n’ala peeji.
- source_word: κυρίου
  choice: Onyenwe
  rationale: “Onyenwe” bụ aha nsọpụrụ Igbo dabara adaba maka κύριος mgbe ọ na-ezo aka na Jizọs.
- source_word: Χριστοῦ
  choice: Mezaya
  rationale: Χριστός na-arụ ọrụ dị ka aha ọkwa n’ebe a; “Mezaya” na-eme ka ihe aha ọkwa ahụ pụtara doo anya.
- source_word: ἐπόπται
  choice: anyị onwe anyị ji anya anyị hụ
  rationale: Nkebiokwu a na-egosi ahụmahụ ndị ji anya ha hụ ihe ahụ n’onwe ha, bú isi ihe ἐπόπται pụtara.
- source_word: γενηθέντες
  choice: anyị onwe anyị ji anya anyị hụ
  rationale: E jikọtara participle ahụ n’ụzọ Igbo sitere n’okike, na-egosi na ihe akaebe ha dabeere n’ịbụ ndị ji anya ha hụ, ọ bụghị n’akụkọ ifo.
- source_word: μεγαλειότητος
  choice: ịdị ebube
  rationale: “Ịdị ebube” na-ebupụta echiche nke ịdị ukwuu, ịma mma dị elu, na ebube dị na μεγαλειότης.
- source_word: ἐκείνου
  choice: ya
  rationale: Nnọchiaha a na-ezo azụ n’ebe Onyenwe anyị Jizọs Mezaya nọ n’ụzọ Igbo dị mma.
theological_decisions:
- issue: Ihe παρουσία pụtara n’okwu metụtara Jizọs
  choice: ọbịbịa
  alternative: ịnọ ya; mbata ya
  rationale: N’Agba Ọhụrụ, παρουσία na-ejikarị ezo aka n’ọbịbịa Jizọs n’ọdịnihu, karịsịa mgbe e jikọtara ya na “ike.” Ma ebe ọ pụkwara ịpụta ịnọ mmadụ ma ọ bụ mbata ya, e chekwara nghọta ndị ahụ n’ala peeji.
- issue: Ma a ga-asụgharị Χριστοῦ dị ka aha ọkwa ka ọ bụ dị ka aha onwe
  choice: Mezaya
  alternative: Kraịst
  rationale: N’ahịrịokwu a, Χριστός ka na-arụ ọrụ dị ka aha ọkwa nke Jizọs; ya mere “Mezaya” na-ekwupụta ihe ọ pụtara n’emeghị ka ọ bụrụ naanị aha onwe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Nhazi “ọ bụghị ... ka ...; kama ...” na-eme ka nnukwu ọdịiche dị n’amaokwu ahụ doo anya, ebe “anyị onwe anyị ji anya anyị hụ” na-emesi ike na ha bụ ndị hụrụ ihe ahụ n’onwe ha.
