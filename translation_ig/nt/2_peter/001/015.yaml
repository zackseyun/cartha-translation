source:
  edition: SBLGNT
  text: σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/015.yaml
  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: ig
  text: M ga-agbakwara mbọ ike ka, mgbe m gachara[a], unu nwee ike icheta ihe ndị a n’oge ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ doro anya karị, “mgbe m nwụsịrị.” Okwu Grik ahụ sịrị, “mgbe m gachara,” ya bụ, “mgbe m pụchara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσω
  choice: M ga-emekwa mgbalị niile
  rationale: Nke a na-egosi ịdị uchu na itinye ike niile n'ihe ahụ, ma na-ejikọkwa amaokwu a na nke bu ya ụzọ.
- source_word: δὲ καὶ
  choice: ga-emekwa
  rationale: N'ebe a, δέ na-aga n'ihu n'echiche ahụ kama igosi nnukwu mmegide, καί na-agbakwụnye ihe Pita ga-eme ọzọ.
- source_word: ἑκάστοτε
  choice: mgbe ọ bụla
  rationale: Ọ na-egosi oge ọ bụla ma ọ bụ ọnọdụ ọ bụla mkpa icheta ihe ndị a bilitere.
- source_word: ἔχειν ὑμᾶς
  choice: unu nwee ike
  rationale: N'usoro okwu a, ἔχειν na-enye echiche nke inwe ikike ma ọ bụ ohere ime ihe.
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: mgbe m lachara
  rationale: ‘Laa’ bụ ụzọ Igbo dị mma ma dị nsọ isi kwuo ọpụpụ, ma ọ na-echekwa ihe atụ nke ἔξοδος n'emeghị ka isiokwu ahụ bụrụ naanị okwu nkịtị maka ọnwụ.
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: icheta ihe ndị a
  rationale: Nkebi okwu Grik a bụ akpaala okwu pụtara ime ka ihe bata ọzọ n'uche; ‘icheta’ bụ Igbo nkịtị ma doo anya.
theological_decisions:
- issue: Ihe ἔξοδος pụtara banyere njedebe ndụ Pita na-abịa
  choice: mgbe m lachara
  alternative: mgbe m nwụsịrị
  rationale: Isi ederede na-echekwa ihe atụ nke ‘ọpụpụ’ dị na Grik, ebe nkọwa ala peeji na-eme ka o doo anya na ọ na-ekwu maka ọnwụ Pita. Nke a anaghị etinye nkọwa okpukpe ọzọ n'okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu, mee ntụgharị a. ‘Mgbe m lachara’ na-ada nke ọma n'Igbo ma na-echekwa ụzọ ihe atụ e si kwuo ọnwụ n'isi mmalite.
