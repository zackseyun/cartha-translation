id: 2PE.1.10
reference: 2 Peter 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: ig
  text: Ya mere, ụmụnna[a], gbasịanụ mbọ ike karị ime ka ọkpụkpọ na nhọpụta unu guzosie ike; n’ihi na ọ bụrụ na unu eme ihe ndị a, unu agaghị asụ ngọngọ ma ọlị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ bụ “ụmụnna,” okwu dị n’ụdị nwoke; n’ụdị e ji agwa ọgbakọ a, ọ pụrụ ịgụnye ndị nwoke na ndị nwanyị niile nọ n’ọgbakọ ndị kwere ekwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n’ihe e kwuru tupu amaokwu a, ma na-ejikọta ndụmọdụ a na ya n’ụzọ doro anya.
- source_word: μᾶλλον
  choice: karị
  rationale: Na-eme ka iwu gbasịanụ mbọ ike sie ike, dịka ntụnyere ya na ihe ndị e kwuru na mbụ si dị.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: Okwu Igbo a dabara adaba n’okwu e ji akpọ ndị otu okwukwe; ọ pụrụ ịgụnye nwoke na nwanyị, ebe ndetu ala na-akọwa ụdị okwu Grik ahụ kpọmkwem.
- source_word: σπουδάσατε
  choice: gbasịanụ mbọ ike
  rationale: Na-egosipụta iwu ka ha tinye uchu na mgbalị siri ike, n’asụsụ Igbo dị ndụ ma kwanyere ugwu.
- source_word: βεβαίαν
  choice: guzosie ike
  rationale: Na-enye echiche nke ime ka ihe bụrụ nke e mere ka o sie ike ma ọ bụ nke e gosipụtara na ọ bụ eziokwu, n’enweghị idozi esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ.
- source_word: κλῆσιν
  choice: ọkpụkpọ
  rationale: Na-echekwa aha ihe na echiche nke ọkpụkpọ Chineke, ma na-aga n’ihu n’usoro okwu amaokwu ahụ.
- source_word: ἐκλογὴν
  choice: nhọpụta
  rationale: Na-egosipụta omume ịhọrọ n’enweghị itinye usoro ozizi otu ụka pụrụ iche n’ime okwu ahụ.
- source_word: ποιεῖσθαι
  choice: ime ka
  rationale: Na-egosipụta ime ka ọkpụkpọ na nhọpụta ahụ bụrụ ihe guzosiri ike, ọ bụghị ikwu hoo haa na mmadụ bụ onye na-ebute ha n’isi.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Na-ezo aka n’àgwà ọma na omume ndị e depụtara n’amaokwu ndị bu ụzọ.
- source_word: ποιοῦντες
  choice: ọ bụrụ na unu eme
  rationale: Na-akọwa ike ọnọdụ nke participle ahụ n’Igbo doro anya ma dị mfe nghọta.
- source_word: οὐ μὴ
  choice: agaghị ... ma ọlị
  rationale: Na-echekwa nkwusioru siri ike nke okwu Grik ahụ.
- source_word: πταίσητέ
  choice: asụ ngọngọ
  rationale: Na-echekwa ihe atụ nke ịsụ ngọngọ, kama ịkọwa ya kpọmkwem dịka ime mmehie ọ bụla ma ọ bụ ịdapụ kpamkpam.
theological_decisions:
- issue: Ihe ‘ime ka ọkpụkpọ na nhọpụta unu guzosie ike’ pụtara
  choice: Ndụmọdụ ka ndị kwere ekwe jiri ndụ ha na omume ọma na-adịgide adịgide mee ka ọkpụkpọ na nhọpụta ahụ sie ike ma pụta ìhè.
  alternative: Ikwu na mgbalị mmadụ bụ ihe na-eme ka ọkpụkpọ ma ọ bụ nhọpụta Chineke malite ịdị adị.
  rationale: Njikọ ποιεῖσθαι na βεβαίαν na-elekwasị anya n’ime ka ihe guzosie ike ma ọ bụ n’ịkwado ya. Nsụgharị ahụ na-echekwa esemokwu dị n’ihe odide ahụ n’enweghị ịkwado usoro ozizi otu ụka.
- issue: Ike nke ‘unu agaghị asụ ngọngọ ma ọlị’
  choice: Nkwa na ndị na-eme ihe ndị a agaghị asụ ngọngọ, ebe a hapụrụ ihe atụ ahụ dịka Pita si kwuo ya.
  alternative: Nkwupụta na ha agaghị eme mmehie ọ bụla ọzọ, ma ọ bụ nkwa a kọwara naanị dịka enweghị ike ịdapụ n’okwukwe n’ikpeazụ.
  rationale: πταίω pụtara ịsụ ngọngọ ma ọ bụ ịda n’ụzọ ihe atụ. Ide ya otu a anaghị eme ka amaokwu ahụ kwuo karịa ihe Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Gbasịanụ mbọ ike’ na-enye iwu ahụ ume kwesịrị ya; ‘asụ ngọngọ’ na-echekwa ihe atụ nke asụsụ isi mmalite. E debere akara ndetu [a] ozugbo n’akụkụ ‘ụmụnna,’ okwu ndetu ahụ na-akọwa.
