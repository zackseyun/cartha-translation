id: 2PE.1.8
reference: 2 Peter 1:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na ihe ndị a dị n’ime unu ma na-abawanye[a], ha na-eme ka unu ghara ịbụ ndị na-adịghị arụpụta ihe ma ọ bụ ndị na-adịghị amị mkpụrụ n’ihe ọmụma[b] banyere Onyenwe anyị Jizọs, bụ́ Mesaịa ahụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-eju eju” ma ọ bụ “dị n’ụba.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ihe ọmụma zuru ezu” banyere Onyenwe anyị Jizọs bụ́ Mesaịa ahụ.
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, “Jizọs Kraịst”; n’ebe a, a sụgharịrị Χριστός dị ka “Mesaịa” iji chekwaa ihe aha ọrụ ahụ pụtara.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Ọ na-ezo aka n’ihe ndị e depụtara n’amaokwu 5–7 ma na-edobe njikọ ahụ n’enweghị ịkọwa ha karịa ihe Grik kwuru.
- source_word: ὑμῖν ὑπάρχοντα
  choice: dị n’ime unu
  rationale: N’ebe a, njikọ dative na ὑπάρχω na-egosi na ihe ndị ahụ dị n’aka ndị na-agụ akwụkwọ ma ọ bụ dị n’ime ha. Nsụgharị a bụ Igbo doro anya, ọ bụ ezie na ‘unu nwere’ nwekwara ike ịkọwa ya.
- source_word: πλεονάζοντα
  choice: na-abawanye
  rationale: Ọ na-egosi uto ma ọ bụ ịba ụba; ‘na-abawanye’ na-eme ka echiche uto na-aga n’ihu pụta ìhè.
- source_word: ἀργούς
  choice: ndị na-adịghị arụpụta ihe
  rationale: N’okwu a, ọ bụghị naanị ịdị umengwụ ka a na-ekwu, kama enweghị ọrụ bara uru ma ọ bụ nsonaazụ; okwu a dabara na ntụnyere ya na enweghị mkpụrụ.
- source_word: ἀκάρπους
  choice: ndị na-adịghị amị mkpụrụ
  rationale: Ọ na-edobe ihe atụ nke mkpụrụ dị n’okwu Grik ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: καθίστησιν
  choice: ha na-eme ka unu ghara ịbụ
  rationale: Nke a na-egosipụta n’ụzọ Igbo sitere n’okike nsonaazụ nke οὐκ … οὐδὲ, ya bụ na ihe ndị ahụ na-egbochi mmadụ ịbụ onye na-adịghị arụpụta ihe ma ọ bụ na-adịghị amị mkpụrụ.
- source_word: ἐπίγνωσιν
  choice: ihe ọmụma
  rationale: ‘Ihe ọmụma’ bụ nsụgharị sara mbara ma dị mfe; echiche nke ọmụma zuru ezu ka e debere n’ihe odide ala peeji.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Ọ bụ aha nsọpụrụ Kraịst n’ebe a, ‘Onyenwe anyị’ bụkwa ụzọ Igbo kwụ ọtọ e si asụ ya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ́ Mesaịa ahụ
  rationale: Χριστός ka a sụgharịrị dị ka aha ọrụ ‘Mesaịa’ kama idegharị ya dị ka aha nkịtị; ‘ahụ’ na-eme ka aha ọrụ a daa nke ọma n’Igbo.
theological_decisions:
- issue: Otu e si sụgharịa Χριστοῦ n’aha Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ́ Mesaịa ahụ
  alternative: Jizọs Kraịst
  rationale: Χριστός pụtara ‘Onye E Tere Mmanụ,’ ya bụ Mesaịa. Nsụgharị a na-echekwa ihe aha ọrụ ahụ pụtara n’enweghị ịgbakwunye nkọwa nke otu ụka.
- issue: Ike okwu ἐπίγνωσις
  choice: ihe ọmụma
  alternative: ihe ọmụma zuru ezu
  rationale: Okwu ahụ nwere ike igosi ọmụma miri emi ma ọ bụ zuru ezu, ma ịmanye ‘zuru ezu’ n’ahịrị bụ isi nwere ike ịkọwa ya gabiga ókè; ya mere e debere nke ahụ dịka nhọrọ n’ihe odide ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ihe atụ ‘ịmị mkpụrụ,’ ma jiri ‘na-adịghị arụpụta ihe’ mee ka ἀργός pụta ìhè n’ọnọdụ a. E debere nhọrọ okwu ndị nwere ezigbo nghọtahie n’ihe odide ala peeji kama idozi ha n’ụzọ otu nkọwa naanị.
