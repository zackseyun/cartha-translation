id: 2PE.1.6
reference: 2 Peter 1:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/006.yaml
  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: ig
  text: n'ime ihe ọmụma, njide onwe onye; n'ime njide onwe onye, ntachi obi[a]; n'ime ntachi obi, nsọpụrụ Chineke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ịnọgide na-eguzosi ike,” “ịnọgidesi ike,” ma ọ bụ “ntachi obi nke na-adịgide.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik dị mkpirikpi ebe a; ọ na-aga n'ihu n'usoro omume ọma malitere n'amaokwu gara aga, bụ́ itinyere otu àgwà nke ọzọ.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσει
  choice: ihe ọmụma
  rationale: Nke a bụ okwu Igbo doro anya maka γνώσις, ya bụ ịmata ihe ma ọ bụ ihe mmadụ maara; ọ dabara n'usoro omume ọma a.
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: njide onwe onye
  rationale: Ọ na-egosi ịchị ọchịchọ na mkpali mmadụ, n'okwu Igbo dị ugbu a ma dị mfe nghọta.
- source_word: ὑπομονήν / ὑπομονῇ
  choice: ntachi obi
  rationale: Ọ na-ekwupụta ịnọgide na-eguzosi ike n'okpuru ihe isi ike; 'ntachi obi' bụ okwu Igbo a na-aghọta nke ọma, ọ bụghị naanị ichere nwayọọ.
- source_word: εὐσέβειαν
  choice: nsọpụrụ Chineke
  rationale: N'ebe a εὐσέβεια bụ ndụ nke nsọpụrụ na nrube isi nye Chineke; okwu a na-ezere nghọta na mmadụ na-aghọ Chineke.
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: tinyere ... ...
  rationale: Ihe e dere n'asụsụ Grik dị mkpirikpi ma na-aga n'ihu n'iwu dị n'amaokwu gara aga nke na-ekwu ka e tinyere otu omume ọma nke ọzọ. Nhọrọ a bụ Igbo ebumpụta ụwa ma chekwaa njikọ ahụ.
- source_word: δέ
  choice: -kwa
  rationale: N'ebe a δέ na-ejikọta ihe ndị nọ n'usoro, ọ naghị egosi mmegide siri ike; mgbakwụnye '-kwa' na-enye usoro ahụ njikọ n'Igbo.
theological_decisions:
- issue: Usoro okwu dị mkpirikpi nke ndepụta omume ọma
  choice: E tinyere ngwaa 'tinyere' nke amaokwu gara aga chọrọ, ma e debe usoro otu omume ọma na-esote nke ọzọ.
  alternative: 'Ide ya n''ụzọ dị nso n''ụdị Grik: ''n''ime ihe ọmụma, njide onwe onye...'''
  rationale: Grik hapụrụ ngwaa ahụ n'ihi na a ghọtara ya site n'amaokwu gara aga. Igbo chọrọ ka e kwupụta ya ka okwu doo anya, ma nke a anaghị etinye nkọwa ozizi ọzọ.
- issue: Ihe εὐσέβεια pụtara
  choice: nsọpụrụ Chineke
  alternative: ịdị nsọ; ndụ ịsọpụrụ Chineke
  rationale: '''Nsọpụrụ Chineke'' na-echekwa echiche nke ofufe na omume kwesịrị ekwesị n''ihu Chineke, n''enweghị ikwu na mmadụ nwere ọdịdị Chineke.'
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri 'tinyere' mee ka njikọ ya na amaokwu 5 doo anya n'Igbo, ebe a ka debere usoro ndepụta ahụ na-enweghị nkọwa sara mbara.
