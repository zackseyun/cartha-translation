  text: καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/005.yaml
  text: And for this very reason[a], making every effort, supply in your faith virtue, and in virtue knowledge[d][c][b],
translation:
  language: ig
  text: N’ihi nke a kpọmkwem kwa, werenụ uchu niile tinyekwuonụ n’okwukwe unu omume ọma, tinyekwuonụkwa n’omume ọma ihe ọmụma.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: d
    text: 'A pụkwara ịsụgharị akụkụ a: “gbakwunye omume ọma n’okwukwe unu, gbakwunye ihe ọmụma n’omume ọma.”'
    reason: structural_alternative
lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: Ọ bụkwa n’ihi nke a kpọmkwem
  rationale: Nke a na-egosi njikọ siri ike ya na ihe e kwuru n’amaokwu bu ya ụzọ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: ka unu ga-eji gbasie mbọ ike
  rationale: A jikọtara participle ahụ na iwu na-esochi ya n’ụzọ Igbo si ekwu okwu, ma chekwaa echiche nke itinye mbọ niile na ịdị uchu.
- source_word: ἐπιχορηγήσατε
  choice: tinyekwuo
  rationale: Okwu a na-egosi inye, iweta, ma ọ bụ ịgbakwunye ihe dị mkpa. “Tinyekwuo” na-eme ka usoro àgwà ndị a doo onye Igbo anya; nkọwa ala peeji na-echekwa echiche sara mbara nke inyezuo ihe.
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: n’okwukwe unu
  rationale: Nke a na-echekwa usoro ἐν + dative dị na Grik, na-ahapụghị ma ọ pụtara n’ime okwukwe, n’ihe metụtara okwukwe, ma ọ bụ ịgbakwunye ihe n’okwukwe.
- source_word: πίστει
  choice: okwukwe
  rationale: “Okwukwe” bụ okwu Igbo kwụ ọtọ maka πίστις n’ebe a; a debere “ịtụkwasị obi” na “ikwesị ntụkwasị obi” dịka ụzọ ndị ọzọ n’ala peeji.
- source_word: ἀρετήν
  choice: omume ọma
  rationale: N’usoro àgwà a, “omume ọma” na-enye echiche nke ịdị mma n’àgwà na n’omume n’asụsụ ndị mmadụ na-aghọta ngwa ngwa.
- source_word: γνῶσιν
  choice: ihe ọmụma
  rationale: Nke a na-anọgide nso n’isi ihe γνῶσις pụtara, n’etinyeghị nkọwa sara mbara dịka nghọta miri emi ma ọ bụ ikike ịmata ihe dị iche iche.
theological_decisions:
- issue: Ihe πίστις pụtara n’usoro àgwà ndị a
  choice: okwukwe
  alternative: ịtụkwasị obi; ikwesị ntụkwasị obi
  rationale: Ihe gbara ya gburugburu anaghị amanye otu n’ime nghọta ndị ọzọ. Ya mere, e ji “okwukwe” mee isi okwu, ma chekwaa nghọta ndị ọzọ n’ala peeji.
- issue: Mmekọrịta ἐν dị n’etiti àgwà ndị ahụ
  choice: n’okwukwe unu ... n’omume ọma ahụ
  alternative: gbakwunye omume ọma n’okwukwe unu; were okwukwe unu nyezuo omume ọma
  rationale: E chekwara nhazi Grik na isi ederede ka a ghara ikpebi n’enweghị isi ma ἐν na-egosi ọnọdụ, njikọ, ntọala, ma ọ bụ mgbakwunye. Nkọwa ala peeji na-egosi ụzọ ọzọ e nwere ike isi ghọta ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Gbasie mbọ ike” na “tinyekwuo” na-eme ka iwu ahụ doo anya n’enweghị asụsụ ochie; a hapụrụ nghọta dị iche iche nke ἐν na πίστις n’ala peeji kama idozi ha n’isi ederede.
