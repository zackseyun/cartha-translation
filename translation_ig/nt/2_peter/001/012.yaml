  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὸ ⸀μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: ig
  text: N’ihi ya, m ga-adị njikere mgbe niile ichetara unu ihe ndị a, ọ bụ ezie na unu maara ha ma e mewokwa ka unu guzosie ike n’eziokwu dị ugbu a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “n’eziokwu unu nwere ugbu a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya, ma bụrụkwa ụzọ Igbo doro anya si jikọta echiche ndị ahụ.
- source_word: μελλήσω
  choice: m ga-adị njikere
  rationale: N’ebe a, μέλλω na-egosi mkpebi ma ọ bụ ịdị njikere ime ihe, ọ bụghị naanị ihe ga-eme n’ọdịnihu ma ọ bụ ihe na-achọ ime ozugbo.
- source_word: ἀεὶ
  choice: mgbe niile
  rationale: Ọ na-egosi na omume ichetara ha ga na-aga n’ihu ma ọ bụ na-eme ugboro ugboro.
- source_word: ὑπομιμνῄσκειν
  choice: ichetara
  rationale: Nke a bụ ụzọ Igbo nkịtị ma doo anya isi kwuo ime ka mmadụ cheta ihe ọ maralarị.
- source_word: περὶ τούτων
  choice: ihe ndị a
  rationale: N’usoro okwu Igbo, “ichetara unu ihe ndị a” na-ebute ihe περί τούτων pụtara n’ụzọ eke ma doo anya.
- source_word: καίπερ
  choice: ọ bụ ezie na
  rationale: Ọ na-echekwa ike nkwenye megidere ihe a na-atụ anya ya dị na njikọ Grik ahụ.
- source_word: εἰδότας
  choice: unu maara ha
  rationale: “Ha” na-ezo aka n’“ihe ndị a,” nke na-eme ka ihe participle ahụ pụtara doo anya n’Igbo.
- source_word: ἐστηριγμένους
  choice: e mewokwa ka unu guzosie ike
  rationale: Nke a na-echekwa ọdịdị passive na ọnọdụ siri ike nke sitere n’ihe e merela, dịka perfect passive participle si egosi.
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: n’eziokwu dị ugbu a
  rationale: Ọ na-anọ nso n’okwu Grik ma na-ahapụ nghọta nke “dị ugbu a” ghe oghe, n’enweghị ime ya okwu teknụzụ nke otu ozizi.
theological_decisions:
- issue: Ihe “eziokwu dị ugbu a” pụtara
  choice: n’eziokwu dị ugbu a
  alternative: n’eziokwu unu nwere ugbu a
  rationale: παρούσῃ nwere ike ịpụta ihe dị ugbu a ma ọ bụ ihe nọ ha nso/ha nwere. Isi ederede na-echekwa okwu ahụ n’ụzọ sara mbara; ihe odide ala peeji na-egosi nghọta ọzọ n’etinyeghị ozizi pụrụ iche n’ime ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa njikọ nkwubi okwu, nkwenye megidere ihe a na-atụ anya ya, passive nke ἐστηριγμένους, na nghọta abụọ enwere ike ịdị na παρούσῃ ἀληθείᾳ.
