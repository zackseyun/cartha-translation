id: 2PE.1.19
reference: 2 Peter 1:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: ig
  text: Anyị nwekwara okwu amụma ahụ nke ka kwụsie ike[a]; nke unu na-eme nke ọma ịṅa ntị na ya, dị ka a ga-asị na ọ bụ oriọna na-enwu n'ebe ọchịchịrị gbara, ruo mgbe chi abọọ, kpakpando ụtụtụ[b] apụtakwa n'ime obi unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Anyị nwekwara okwu amụma ahụ nke siri ike karị ịtụkwasị obi.” Okwu Grik ahụ nwere ike ịpụta na akaebe ndịozi kwadoro okwu amụma ahụ, ma ọ bụ na ọ na-emesi ike na okwu amụma ahụ siri ike ịtụkwasị obi.
    reason: alternative_reading
  - marker: b
    text: “Kpakpando ụtụtụ” nwere ike ịbụ ihe oyiyi na-ezo aka na Mesaya; tulee Mkpughe 22:16.
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: nke e mere ka o siekwuo ike ịtụkwasị obi
  rationale: Na-egosipụta ntụnyere dị n’okwu Grik ma na-ejikọta ya n’ọnọdụ nke akaebe ndịozi kwuru tupu amaokwu a; ihe odide ala peeji na-echekwa nkọwa ọzọ nke na-ele ya anya dị ka okwu amụma nke siri ike karị n’onwe ya.
- source_word: προφητικὸν λόγον
  choice: okwu amụma ahụ
  rationale: Nke a bụ Igbo doro anya ma kwụsie ike nke na-echekwa ma ‘okwu’ ma ọdịdị amụma ya.
- source_word: ᾧ ... προσέχοντες
  choice: Ọ dị mma ka unu ṅaa ya ntị
  rationale: ‘Ịṅa ntị’ bụ okwu Igbo nke oge a na-eji ekwu ilebara ihe anya nke ọma; ọ na-echekwa echiche nke προσέχω.
- source_word: λύχνῳ φαίνοντι
  choice: oriọna na-enwu
  rationale: Na-echekwa ihe atụ nke oriọna na omume na-aga n’ihu nke participle φαίνοντι.
- source_word: αὐχμηρῷ τόπῳ
  choice: ebe gbara ọchịchịrị
  rationale: Ọ dabara n’ihe atụ nke oriọna ma bụrụ ụzọ Igbo doro anya isi kwuo ebe gbara ọchịchịrị ma ọ bụ nke juru n’ìyi.
- source_word: ἡμέρα διαυγάσῃ
  choice: chi ga-abọ
  rationale: ‘Chi ịbọ’ bụ ụzọ Igbo sitere n’okike ma dị ndụ isi kwuo mbido ìhè ụbọchị.
- source_word: φωσφόρος
  choice: kpakpando ụtụtụ
  rationale: Na-echekwa ihe oyiyi nke kpakpando a na-ahụ n’ụtụtụ, n’etinyeghị onye ọ na-anọchi anya n’ime isi ederede.
- source_word: ἀνατείλῃ
  choice: ebilie
  rationale: Ọ dabara n’onyonyo nke kpakpando na-apụta ma na-arịgo.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: n’ime obi unu
  rationale: Nsụgharị kpọmkwem, dịkwa mma n’Igbo; ‘obi’ na-ezo aka n’ime mmadụ, ọ bụghị naanị mmetụta uche.
theological_decisions:
- issue: Ihe βεβαιότερον pụtara n’ihe metụtara akaebe ndịozi na okwu amụma
  choice: nke e mere ka o siekwuo ike ịtụkwasị obi
  alternative: okwu amụma ahụ nke siri ike karị ịtụkwasị obi
  rationale: Nke mbụ na-enye ohere ịghọta na akaebe ndịozi kwadoro okwu amụma ahụ; ihe odide ala peeji na-echekwa nkọwa ọzọ nke ụtọasụsụ Grik na-ekwe omume, n’emeghị ka otu nkọwa bụrụ naanị nke ziri ezi.
- issue: Onye ma ọ bụ ihe ‘kpakpando ụtụtụ’ na-ezo aka na ya
  choice: E debere ihe atụ ahụ n’isi ederede n’enweghị nkọwa kpọmkwem banyere onye ọ bụ.
  alternative: Ịkọwa ya kpọmkwem dị ka Kraịst ma ọ bụ dị ka ìhè nke oge ikpeazụ
  rationale: Amaokwu ahụ n’onwe ya akọwaghị onye ihe atụ ahụ bụ. Ntụaka ala peeji na-egosi ụda Mesaya nwere ike ịdị na ya ma na-echekwa mgbagwoju anya nke ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ nke oriọna, chi ịbọ, na kpakpando ụtụtụ. Akara ntụaka [a] na [b] pụtara n’isi ederede, a zerekwa itinye nkọwa ụka pụrụ iche n’ime amaokwu ahụ.
