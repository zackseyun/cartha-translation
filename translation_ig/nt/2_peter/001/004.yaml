id: 2PE.1.4
reference: 2 Peter 1:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: ig
  text: Site n’ihe ndị a ka o nyeworo anyị nkwa ndị dị oké ọnụ ahịa ma dịkwa ukwuu nke ukwuu, ka site na nkwa ndị a unu wee ghọọ ndị na-ekere òkè n’ọdịdị Chineke[a], mgbe unu gbanahụrụ ire ure dị n’ụwa n’ihi ọchịchọ ọjọọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị na-enwe òkè n’ọdịdị Chineke.” Okwu a na-ekwu maka ikere òkè n’ihe Chineke nwere ma ọ bụ na-enye; ọ pụtaghị na mmadụ na-aghọ Chineke n’onwe ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “n’ihi ọchịchọ” ma ọ bụ “site n’agụụ.” Okwu Grik ahụ pụrụ ịpụta ọchịchọ n’ozuzu, ma n’ebe a ihe gbara ya gburugburu na-egosi na ọ bụ ọchịchọ ọjọọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: site n’ihe ndị a
  rationale: Nke a na-egosi ụzọ ma ọ bụ ihe e ji mee ihe, ma na-ahapụ ihe nnọchiaha ahụ na-ezo aka na ya ka ọ ghara ịbụ nke a kọwara karịa ka Grik siri kọwaa ya.
- source_word: τίμια καὶ μέγιστα
  choice: dị oké ọnụ ahịa ma dịkwa ukwuu nke ukwuu
  rationale: “Dị oké ọnụ ahịa” na-egosi uru pụrụ iche; “dịkwa ukwuu nke ukwuu” na-ebupụta ike nke ụdị kachasị elu μέγιστα n’Igbo na-aga were were.
- source_word: ἐπαγγέλματα
  choice: nkwa
  rationale: “Nkwa” bụ okwu Igbo doro anya ma kwesị ekwesị maka ihe Chineke kwere inye ma ọ bụ ime.
- source_word: δεδώρηται
  choice: o ji nye anyị
  rationale: Nke a na-egosi onyinye e nyere anyị; “o” na-anọchi Chineke nke amaokwu bu ụzọ kwuru maka ya. Nhazi “ọ bụ ... ka o ji” na-egosikwa ụzọ e si nye onyinye ahụ.
- source_word: διὰ τούτων
  choice: site na nkwa ndị a
  rationale: Ihe ngosi “ndị a” na-ezo aka n'ụzọ kacha nso na nkwa ndị a kpọrọ aha, ma “site na” na-echekwa echiche nke ụzọ e si eme ihe.
- source_word: γένησθε
  choice: unu ... bụrụ
  rationale: “Bụrụ” na-echekwa echiche nke ịghọ ihe, ọ bụghị nanị ịnọ n’ọnọdụ ahụ.
- source_word: θείας κοινωνοὶ φύσεως
  choice: ndị na-ekere òkè n’ọdịdị Chineke
  rationale: “Na-ekere òkè” na-egosi ezi isonye ma ọ bụ iketa uru n’enweghị ikwu na mmadụ na-aghọ Chineke n’ụdị ịdị adị ya; “ọdịdị Chineke” na-echekwa ịdị arọ nke okwu Grik.
- source_word: ἀποφυγόντες
  choice: ebe unu gbanahụrụ
  rationale: Nke a na-ejikọta ịgbanahụ ahụ na isi ahịrịokwu dịka omume mere ma ọ bụ sonyere n’ihe a na-ekwu, n’enweghị ịmanye naanị otu nghọta gbasara usoro oge.
- source_word: φθορᾶς
  choice: ire ure
  rationale: N’ebe a, “ire ure” na-egosi mmebi omume na nke ime mmụọ, ọ bụghị nanị ire ere nke anụ ahụ.
- source_word: ἐν ἐπιθυμίᾳ
  choice: n’ihi ọchịchọ ọjọọ
  rationale: Ọ bụ ezie na ἐπιθυμία pụrụ ịpụta ọchịchọ n’ozuzu, njikọ ya na ire ure nke ụwa na-enye ya echiche omume ọjọọ n’ebe a.
theological_decisions:
- issue: θείας κοινωνοὶ φύσεως na isonye n’ọdịdị Chineke
  choice: ndị na-ekere òkè n’ọdịdị Chineke
  alternative: ndị na-eso eketa ọdịdị Chineke
  rationale: Nsụgharị a na-echekwa okwu siri ike nke ederede banyere ezi isonye n’ihe sitere n’aka Chineke, ma ọ naghị etinye ozizi e mesịrị ma ọ bụ kwuo na mmadụ na-aghọ Chineke n’ụdị ịdị adị ya.
- issue: Ike omume ọjọọ nke ἐπιθυμία
  choice: ọchịchọ ọjọọ
  alternative: ọchịchọ; agụụ ihe ọjọọ
  rationale: Ihe gbara okwu ahụ gburugburu jikọtara ọchịchọ a na ire ure dị n’ụwa. “Ọjọọ” na-eme ka echiche dị n’ebe a doo anya n’enweghị ime ka okwu ahụ bụrụ naanị agụụ mmekọahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ “na-ekere òkè” iji mee ka echiche isonye doo anya nye ndị nkịtị, ebe “ọdịdị Chineke” na-echekwa ịdị arọ na esemokwu nkà mmụta okpukpe dị n’okwu mbụ.
