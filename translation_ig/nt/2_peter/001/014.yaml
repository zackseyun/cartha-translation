  text: εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/014.yaml
  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: ig
  text: n’ịmara na ịkwatu ụlọikwuu m[a] adịghị anya[b], dị nnọọ ka Onyenwe anyị Jizọs, bụ́ Mesaya, mere ka m mara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “iwepụ ụlọikwuu m.” Pita ji ịkwatu ma ọ bụ iwepụ ụlọikwuu nwa oge mee ihe atụ maka ọnwụ ya na-abịanụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ga-eme n’oge na-adịghị anya.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: ebe m maara
  rationale: Ọ na-edobe ụdị participle ahụ na njikọ ya na amaokwu bu ya ụzọ, n’etinyeghị okwu na-egosi kpọmkwem na ọ bụ ihe kpatara ya.
- source_word: ταχινή
  choice: dị nso
  rationale: Nke a na-egosi na ihe ahụ na-abịaru nso, ma ọ naghị eme ka okwu Grik ahụ sie ike karịa ka ọ dị.
- source_word: ἀπόθεσις τοῦ σκηνώματός μου
  choice: ịkwatu ụlọikwuu m
  rationale: “Ịkwatu” dabara n’ihe a na-eme ụlọikwuu ma chekwaa ihe atụ nke ahụ mmadụ dịka ebe obibi nwa oge; a sụgharịghị ya ozugbo ka “ọnwụ m.”
- source_word: καθὼς καὶ
  choice: dị nnọọ ka
  rationale: Ọ bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji atụnyere ihe abụọ.
- source_word: ὁ κύριος ἡμῶν
  choice: Onyenwe anyị
  rationale: Ọ bụ aha nsọpụrụ a na-ejikarị eme κύριος n’ebe a, ma ọ dabara n’okwu e kwuru banyere Jizọs.
- source_word: Ἰησοῦς Χριστός
  choice: Jizọs, bụ́ Mesaya
  rationale: E mere Χριστός ka ọ bụrụ aha ọkwá “Mesaya,” ọ bụghị aha ezinụlọ; usoro a na-ada nke ọma n’Igbo ma na-egosi ọrụ aha ahụ.
- source_word: ἐδήλωσέν μοι
  choice: mere ka m mara
  rationale: Ọ na-egosi ime ka ihe doo onye ahụ anya ma ọ bụ ime ka ọ mata ya, na-enweghị ịgbakwunye echiche nke mkpughe pụrụ iche nke okwu ahụ n’onwe ya na-ekwughị.
theological_decisions:
- issue: Ihe atụ e ji kwuo banyere ọnwụ Pita na-abịaru nso
  choice: ịkwatu ụlọikwuu m
  alternative: ọnwụ m dị nso
  rationale: Okwu Grik ji ụlọikwuu kọwaa ndụ n’ahụ dịka ebe obibi nwa oge. Idebe ihe atụ ahụ na-echekwa oyiyi na mgbagwoju okwu dị n’isi mmalite.
- issue: Nsụgharị Χριστός dịka aha ọkwá
  choice: Jizọs, bụ́ Mesaya
  alternative: Jizọs Kraịst
  rationale: N’ebe a Χριστός ka nwere nghọta nke aha ọkwá ahụ, ya bụ Mesaya; nsụgharị a na-eme ka nghọta ahụ pụta ìhè n’Igbo.
- issue: Ma ταχινή ọ̀ na-egosi ịdị nso ka ọ bụ ime ngwa ngwa
  choice: dị nso
  alternative: ga-eme n’oge na-adịghị anya
  rationale: “Dị nso” kwekọrọ n’echiche na ọnwụ ahụ na-abịaru nso, ebe ihe ọzọ nwere ike imesi oge ọ ga-eme ike. E tinyere ụzọ nke ọzọ n’ala ala peeji iji chekwaa obosara nghọta okwu Grik ahụ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke nwere ugwu ma dị mfe nghọta. “Ịkwatu ụlọikwuu m” bụ okwu nkịtị ma na-echekwa ihe atụ nke ederede Grik; “Jizọs, bụ́ Mesaya” na-eme ka Χριστός pụta dịka aha ọkwá.
