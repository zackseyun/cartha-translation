  rationale: The revision corrects the principal source-fidelity issue by rendering εἰδώς with an Igbo participial construction rather than a causal connector. It also improves the idiomatic expression of the imminent event while preserving the source’s tent metaphor, the ambiguity of ταχινή, the honorific “Onyenwe anyị,” and Mesaya as the translation of Χριστός. Footnote anchors remain attached to the terms they explain.
