revisions:
- from: Ndị a bụ isi iyi mmiri na-adịghị na alụlụ[a] nke oké ifufe na-ebugharị; e debeere ha ajọ ọchịchịrị[b].
  to: Ndị a bụ isi iyi na-enweghị mmiri na alụlụ nke oké ifufe na-ebugharị; e debeere ha ọchịchịrị gbara ọchịchịrị.
  rationale: The revision uses idiomatic Standard Igbo for waterless springs and restores the source text’s intensified two-term darkness expression. It preserves the storm-driven mist image and the agentless perfect passive. Footnote markers are retained as supplied, though neither is placed in the revised verse because the notes are alternatives rather than required explanatory notes.
