  text: Οὗτοί εἰσιν πηγαὶ ἄνυδροι ⸂καὶ ὁμίχλαι⸃ ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς ὁ ζόφος τοῦ ⸀σκότους τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/017.yaml
  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: ig
  text: Ndị a bụ isi iyi na-enweghị mmiri na alụlụ nke oké ifufe na-ebugharị; e debeere ha ọchịchịrị gbara ọchịchịrị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: isi iyi mmiri na-adịghị
  rationale: “Isi iyi” na-egosi ebe mmiri si apụta, ọ bụghị olulu mmiri e gwuru; nkebi a na-echekwa ihe atụ nke isi iyi a tụrụ anya na ọ ga-enye mmiri ma ọ naghị enye ya.
- source_word: ὁμίχλαι
  choice: alụlụ
  rationale: “Alụlụ” bụ okwu Igbo kwesịrị ekwesị maka mist ma ọ bụ fog, ma na-egosi ihe na-adịghị arọ nke ifufe pụrụ iburu ngwa ngwa.
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: nke oké ifufe na-ebugharị
  rationale: “Oké ifufe” na-egosi ifufe siri ike ma ọ bụ ajọ ifufe, ebe “na-ebugharị” na-echekwa echiche nke ihe a na-akwagharị site n’ike ọzọ.
- source_word: οἷς
  choice: ha
  rationale: Nnọchiaha a na-alaghachi n’ebe ndị ozizi ụgha ahụ nọ, ọ bụghị nanị n’ihe atụ ndị bụ isi iyi na alụlụ.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: ajọ ọchịchịrị
  rationale: Nkebi Grik ahụ na-eme ka echiche ọchịchịrị sie ike. “Ajọ ọchịchịrị” na-enye echiche nke ọchịchịrị jọgburu onwe ya n’Igbo dị mfe ma kwekọọ n’asụsụ a na-asụ ugbu a.
- source_word: τετήρηται
  choice: e debeere
  rationale: Okwu a na-echekwa olu nnara na echiche na a debela ihe ahụ, ọ ka dịkwa njikere maka ha, n’akpọghị onye mere ya aha.
theological_decisions:
- issue: Nkebi ikpeazụ dị ka okwu ikpe
  choice: E debeere ha ajọ ọchịchịrị
  alternative: Chineke edebeere ha ajọ ọchịchịrị
  rationale: Grik na-eji olu nnara ma ọ kpọghị Chineke aha dị ka onye mere ihe ahụ. Nsụgharị ahụ na-echekwa nke a ma ghara ịgbakwunye onye a na-akpọghị aha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ abụọ ahụ ka ha dị ndụ, a kpọghịkwa onye mere ikpe ahụ aha ebe Grik na-akpọghị ya aha.
