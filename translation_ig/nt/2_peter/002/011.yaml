id: 2PE.2.11
reference: 2 Peter 2:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ ⸀αὐτῶν βλάσφημον κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: ig
  text: Ma ndị mmụọ ozi, ọ bụ ezie na ha ka ukwuu n’ịdị ike na n’ike, anaghị ebute ikpe nkwutọ[a] megide ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ikpe nkwulu” ma ọ bụ “ikpe mkparị.” Okwu Grik ahụ nwere ike ịpụta okwu nkwutọ, okwu mkparị, ma ọ bụ okwu na-eweda mmadụ ala.
    reason: lexical_alternative
  - marker: b
    text: “Ha” nwere ike na-ezo aka na “ndị dị ebube” e kwuru okwu ha n’amaokwu gara aga, ma Pita akọwaghị ha kpọmkwem n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: Ma
  rationale: N’ebe a, ὅπου na-egosi ọdịiche dị n’etiti omume ndị a kpọrọ aha n’amaokwu gara aga na omume ndị mmụọ ozi; “Ma” na-egosipụta ọdịiche ahụ n’Igbo nkịtị.
- source_word: ἄγγελοι
  choice: ndị mmụọ ozi
  rationale: Ihe a na-ekwu banyere ya bụ ndị dị n’eluigwe, ọ bụghị ndị ozi mmadụ.
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: n’ume na n’ike
  rationale: Okwu abụọ a na-egosi ụdị ike abụọ yiri ibe ha ma na-emesi ịdị ike ha ike; “ume na ike” na-echekwa njikọ ahụ n’Igbo dị mfe.
- source_word: μείζονες ὄντες
  choice: ọ bụ ezie na ha ka ukwuu
  rationale: 'Nkebi a nwere echiche nke nkwenye na-emegide ihe na-esochi ya: n’agbanyeghị ịdị ukwuu ha, ha anaghị eme ihe ahụ.'
- source_word: οὐ φέρουσιν
  choice: anaghị ebute
  rationale: φέρω na κρίσιν pụtara iweta ma ọ bụ ibute ikpe megide onye; “anaghị ebute” na-echekwa ihe oyiyi nke ngwaa ahụ.
- source_word: κατ’ αὐτῶν
  choice: megide ha
  rationale: Nnọchiaha ahụ na-alaghachi n’ihe a kpọrọ aha tupu ya, ma amaokwu a akọwaghị ha kpọmkwem; ya mere e debere “ha.”
- source_word: βλάσφημον
  choice: mkparị
  rationale: N’ebe a, okwu ahụ na-akọwa okwu ikpe nke na-ekwutọ ma ọ bụ na-akparị; “mkparị” adịghị egbochi ihe ọ pụtara ka ọ bụrụ naanị nkwulu megide Chineke.
- source_word: κρίσιν
  choice: ikpe
  rationale: κρίσις bụ mkpebi ma ọ bụ ikpe e kwuru megide onye; “ikpe” bụ okwu Igbo sara mbara ma doo anya.
theological_decisions:
- issue: Onye nnọchiaha αὐτῶν (“ha”) na-ezo aka na ya
  choice: E debere ya dịka “ha” n’ahịrị isi, n’enweghị ịkọwapụta ndị ọ bụ.
  alternative: Ndị mmụọ ọjọọ dara ada; ndị ọchịchị mmadụ; ma ọ bụ ndị dị ebube nke eluigwe n’ozuzu ha.
  rationale: Amaokwu a anaghị akọwa onye nnọchiaha ahụ n’ụzọ doro anya karịa ihe gbara ya gburugburu. Ịhapụ ya dịka “ha” na-echekwa mgbagwoju anya dị n’asụsụ Grik ma ghara itinye nkọwa ozizi n’ime ederede.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta, dee ya. E debere ọdịiche nke amaokwu ahụ na mgbagwoju anya nke nnọchiaha “ha,” ma zere ịkọwapụta ozizi nke ederede n’onwe ya na-akọwaghị.
