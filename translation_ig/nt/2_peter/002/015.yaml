id: 2PE.2.15
reference: 2 Peter 2:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καταλιπόντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ ⸀Βοσὸρ ὃς μισθὸν ἀδικίας ἠγάπησεν
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/015.yaml
  text: Having abandoned the straight way[a], they went astray, having followed the way of Balaam son of Bosor[b], who loved the wages of unrighteousness.
translation:
  language: ig
  text: Ha hapụrụ ụzọ kwụ ọtọ wee kpafuo, mgbe ha gbasoro ụzọ Belam nwa Bosọ[a], onye hụrụ ụgwọ nke ajọ omume n’anya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bosọ bụ ụdị aha dị n’ihe odide Grik; n’Agba Ochie, a na-akpọkarị Belam nwa Beọ.
    reason: alternative_reading
  - marker: b
    text: 'A pụkwara ịsụgharị ya: “ha kpafuru site n’ịgbaso ụzọ Belam.”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: καταλιπόντες
  choice: Ha hapụrụ
  rationale: “Hapụ” na-egosi na ha si n’ụzọ ahụ pụọ ma gbakụta ya azụ; ọ bụ okwu Igbo dị mfe ma sie ike karịa nanị ikwu na ha si ebe ahụ pụọ.
- source_word: εὐθεῖαν ὁδὸν
  choice: ụzọ kwụ ọtọ
  rationale: Nke a na-edobe ihe atụ doro anya nke ụzọ kwụ ọtọ dị na Grik, kama ịkọwa ya ozugbo dị ka “ụzọ ziri ezi.”
- source_word: ἐπλανήθησαν
  choice: wee kpafuo
  rationale: “Kpafuo” na-egosi isi n’ụzọ ezi uche ma ọ bụ omume pụọ, n’etinyeghị onye ọzọ dị ka onye mere ka ha kpafuo.
- source_word: ἐξακολουθήσαντες
  choice: ebe ha gbasoro
  rationale: Nke a na-edobe njikọ nke participle ahụ na ngwaa bụ isi n’enweghị ịmanye ya ka ọ bụrụ naanị ihe kpatara ịkpafu ahụ.
- source_word: τῇ ὁδῷ
  choice: ụzọ
  rationale: A na-edobe otu ihe atụ nke ụzọ ahụ e ji mee ihe na mbụ n’amaokwu ahụ.
- source_word: τοῦ Βαλαὰμ
  choice: Belam
  rationale: Nke a bụ ụdị aha ahụ na-adaba n’usoro mkpọpụta na ide aha n’Igbo.
- source_word: τοῦ Βοσὸρ
  choice: nwa Bosọ
  rationale: Genitive nke abụọ na-akọwa onye Belam bụ nwa ya; “Bosọ” na-agbaso kpọmkwem ụdị aha dị n’ihe odide Grik.
- source_word: μισθὸν ἀδικίας
  choice: ụgwọ ajọ omume
  rationale: Nkebiokwu a na-edobe echiche nke ụgwọ ma ọ bụ uru e nwetara n’ajọ omume, ma ghara ime ka ọ daa ka ụgwọ ọma.
- source_word: ἠγάπησεν
  choice: hụrụ … n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke kpọmkwem isi kwuo ἀγαπάω n’ebe a.
theological_decisions:
- issue: Ihe atụ nke ụzọ n’okwu εὐθεῖαν ὁδὸν na τῇ ὁδῷ
  choice: E debere “ụzọ kwụ ọtọ” na “ụzọ.”
  alternative: ụzọ ziri ezi; ụzọ eziokwu
  rationale: Nke a na-echekwa ihe atụ Akwụkwọ Nsọ banyere njem na ịkpafu, ma ghara itinye nkọwa karịrị ihe Grik kwuru.
- issue: Ụdị aha Βοσόρ
  choice: Bosọ dị n’ahịrị amaokwu; Beọ dị n’ala peeji.
  alternative: Beọ n’ahịrị amaokwu
  rationale: Ihe odide Grik kwuru Βοσόρ, ya mere a na-enye ya ụzọ mbụ; ala peeji na-egosi ụdị aha a maara nke ọma n’Agba Ochie.
- issue: Njikọ ἐξακολουθήσαντες na ἐπλανήθησαν
  choice: “ebe ha gbasoro,” nke na-ahapụ njikọ ahụ ntakịrị oghe
  alternative: “site n’ịgbaso,” nke na-egosi kpọmkwem na ịgbaso ahụ bụ ụzọ ha si kpafuo
  rationale: Participle Grik nwere ike igosi omume so ya ma ọ bụ ụzọ e si mee ya; nsụgharị bụ isi anaghị ekpebi ya kpamkpam, ebe ala peeji na-echekwa nhọrọ nke ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ihe atụ “ụzọ” ugboro abụọ dịka ọ dị na Grik. Akara ala peeji [a] na [b] dị n’ahịrị amaokwu n’ebe ha metụtara.
