- from: Onyenwe anyị maara otú ọ ga-esi napụta ndị na-asọpụrụ Chineke n'ọnwụnwa[a], ma debe ndị ajọ omume ka ha na-ata ahụhụ ruo ụbọchị ikpe[b].
  to: Onyenweanyị maara otú ọ ga-esi napụta ndị na-atụ egwu Chineke n'ọnwụnwa[a], na otú ọ ga-esi debe ndị na-adịghị ezi omume ka ha na-ata ahụhụ ruo ụbọchị ikpe[b].
  rationale: A gbanwere “Onyenwe anyị” ka ọ bụrụ “Onyenweanyị” iji zere ịgbakwunye “anyị” na-enweghị isi na Grik. A hazigharịrị usoro ahịrịokwu maka Igbo dị mfe ma debe echiche “knows how” na ngwaa abụọ ahụ. A dochiri “ndị ajọ omume” anya “ndị na-adịghị ezi omume” maka nhata dị nso na ἀδίκους. E wepụrụ “ahụhụ” n'ihe odide ala a banyere πειρασμός, ma chekwaa nhọrọ abụọ lexical ziri ezi. Ihe odide ala b ka na-echekwa enweghị mkpebi gbasara mmekọrịta κολαζομένους na ụbọchị ikpe.
