source:
  edition: SBLGNT
  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: ig
  text: Onyenweanyị maara otú ọ ga-esi napụta ndị na-atụ egwu Chineke n'ọnwụnwa[a], na otú ọ ga-esi debe ndị na-adịghị ezi omume ka ha na-ata ahụhụ ruo ụbọchị ikpe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na nnwale.” Okwu Grik ahụ nwere ike ịpụta ọnwụnwa ma ọ bụ nnwale; n'ebe a, ihe ndị e kwuru n'ihu na-akwado echiche nke ịnapụta mmadụ n'ọnọdụ nnwale.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “debe ndị na-adịghị ezi omume maka ụbọchị ikpe ka a taa ha ahụhụ.” Enwere ike ịghọta participle Grik ahụ dịka nke na-akọwa ntaramahụhụ na-aga n'ihu, ma ọ bụ dịka ntaramahụhụ metụtara ụbọchị ikpe nke na-abịa.
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: maara otú ọ ga-esi
  rationale: N'ịjikọta ya na ngwaa ndị na-esochi, okwu a na-egosi ịma ụzọ e si eme ihe; nsụgharị a bụ Igbo dị mfe ma doo anya.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ a na-ejikarị asụ κύριος n'Igbo Akwụkwọ Nsọ, ọ na-echekwakwa aha nsọpụrụ ahụ.
- source_word: εὐσεβεῖς
  choice: ndị na-asọpụrụ Chineke
  rationale: Adjective a na-arụ ọrụ dị ka aha mmadụ ma na-ezo aka n ndị ji nsọpụrụ Chineke na ndụ ofufe mara.
- source_word: ἐκ πειρασμοῦ
  choice: n'ọnwụnwa
  rationale: πειρασμός nwere ike ịbụ ọnwụnwa ma ọ bụ nnwale/ahụhụ. Okwu Igbo a nwere ike ibu echiche abụọ ahụ, ebe ọnọdụ gbara amaokwu ahụ gburugburu na-elekwasị anya n'ịnapụta mmadụ n'ọnọdụ ule.
- source_word: ῥύεσθαι
  choice: napụta
  rationale: Ọ na-egosi ịzọpụta ma ọ bụ ịdọpụta mmadụ n'ihe egwu; “napụta” bụ okwu Igbo kwesịrị ekwesị ma dị ndụ.
- source_word: ἀδίκους
  choice: ndị ajọ omume
  rationale: Ọ na-ezo aka n ndị na-adịghị ezi omume n'echiche omume na ikpe; okwu a bụ nke ndị Igbo na-aghọta ngwa ngwa.
- source_word: εἰς ἡμέραν κρίσεως
  choice: ruo ụbọchị ikpe
  rationale: N'okwu a, εἰς na τηρεῖν na-ele anya n'ihu ruo ụbọchị ikpe; “ruo” na-egosipụta njedebe oge ahụ n'ụzọ nkịtị n'Igbo.
- source_word: κολαζομένους
  choice: ka ha na-ata ahụhụ
  rationale: Present participle ahụ nwere ike igosi ntaramahụhụ na-aga n'ihu. Nsụgharị a na-echekwa ọdịdị omume na-aga n'ihu kama iwepụ ya.
- source_word: τηρεῖν
  choice: debe
  rationale: τηρέω pụtara idebe, ichekwa, ma ọ bụ ijide; “debe” na-anọgide sara mbara ma kwe ka participle ahụ gosipụta ntaramahụhụ.
theological_decisions:
- issue: Ihe πειρασμός pụtara n'ọnọdụ a
  choice: Okwu sara mbara nke nwere ike ịpụta ọnwụnwa ma ọ bụ nnwale/ahụhụ, ebe ọnọdụ a na-akwado nnwale
  alternative: Ọnwụnwa nke bụ mkpali ime mmehie kpọmkwem
  rationale: Akụkọ Noa na Lọt dị n'ihu na-ekwu maka nzọpụta n'etiti ikpe na ahụhụ. Ya mere, e kwesịghị ime ka okwu ahụ bụrụ naanị mkpali ime mmehie; ihe e dere n'ala ala na-echekwa ụzọ ọzọ.
- issue: Ike nke κολαζομένους
  choice: Ndị ajọ omume ka a na-edebe ka ha na-ata ahụhụ ruo ụbọchị ikpe
  alternative: A na-edebe ha maka ụbọchị ikpe ka a taa ha ahụhụ mgbe ahụ
  rationale: Present participle ahụ na-akwado echiche ntaramahụhụ na-aga n'ihu, ma usoro okwu Grik nwekwara ike ịkwado ntaramahụhụ metụtara ụbọchị ikpe n'ọdịnihu. Ihe e dere n'ala ala na-echekwa mgbagwoju anya a n'emeghị ka otu usoro nkwenkwe merie nke ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị na-asọpụrụ Chineke” kama okwu chọọchị siri ike, ma debe ihe abụọ nwere ike ịpụta na πειρασμός na κολαζομένους site n'ihe e dere n'ala ala.
