  to: N’ihi na ọ bụrụ na ha sitere n’ịmata Onyenwe anyị na Onye Nzọpụta, Jizọs bụ Mesaya, gbanahụ ihe rụrụ arụ nke ụwa, ma ha rapaara ọzọ n’ihe ndị ahụ, ihe ndị ahụ na-emeri ha, ọnọdụ ikpeazụ ha adịla njọ karịa nke mbụ.
  rationale: E meziri ntụgharị ἡττῶνται ka o doo anya na ihe ndị ha gbanahụrụ bụ ndị na-emeri ha. E jikwa ‘rapaara ọzọ n’ihe ndị ahụ’ sụgharịa πάλιν ἐμπλακέντες n’ụzọ Igbo eke, ma dochie okwu maka μιάσματα ka o gosi mmetọ omume. A hapụrụ ‘ịmata’ n’enweghị nkọwa na-ekpebi okwu nkà mmụta okpukpe.
