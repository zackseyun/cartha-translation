  verdict: revise
  source_fidelity: 'A na-echekwa usoro isiokwu ahụ nke ọma n’ozuzu ya: mgbapụ sitere n’ịmata Onyenweanyị na Onye Nzọpụta Jizọs Mesaya, ịdaba ọzọ n’ihe ndị ahụ, na ọnọdụ ikpeazụ ka njọ. Ma ‘ha emerie ha’ na-atụgharị ọrụ Grik passive ἡττῶνται n’ụzọ na-adịghị ekwu nke ọma na ihe ndị ahụ meriri ha; ọ pụrụ ịdị ka ha bụ ndị meriri ihe ndị ahụ.'
  naturalness: ‘Ha abanyekwa ọzọ n’ọnyà ihe ndị ahụ’ bụ okwu a ghọtara, ma ‘ha rapaara ọzọ n’ihe ndị ahụ’ na-egosi ἐμπλακέντες n’Igbo eke karị. ‘Ihe rụrụ arụ nke ụwa’ na-arụ ọrụ nke ọma karịa ‘ihe ndị na-emerụ emerụ nke ụwa,’ nke nwere ike ịpụta nanị ihe ndị na-emerụ ahụ.
  terminology: ‘Mesaya’ na-echekwa utu aha Χριστός. A naghị etinye ‘anyị/our,’ n’ihi na ọ nọghị na ederede Grik. ‘Onyenwe anyị’ bụ aha nsọpụrụ a na-ahụkarị n’Igbo; ebe ‘anyị’ dị na ya bụ akụkụ nke aha ahụ, ọ bụghị ntinye pronoun possessive nke sitere n’ederede ahụ.
  issues:
  - severity: high
    issue: ‘ha emerie ha’ anaghị egosi na ndị a bụ ndị a meriri.
    rationale: 'ἡττῶνται bụ ugbu a passive: ‘a na-emeri ha’ ma ọ bụ ‘ihe ndị ahụ na-emeri ha.’ Nsụgharị dị ugbu a nwere ike ịpụta ‘ha meriri ha.’'
  - severity: medium
    issue: ‘ihe ndị na-emerụ emerụ’ adịghị akọwa mmetọ omume nke ọma.
    rationale: μιάσματα na-ekwu maka ihe na-emerụ ma ọ bụ na-emetọ; ‘ihe rụrụ arụ’ na-eweta uche omume na mmetọ ahụ nke ọma n’ebe a.
  revised_text: N’ihi na ọ bụrụ na ha sitere n’ịmata Onyenwe anyị na Onye Nzọpụta, Jizọs bụ Mesaya, gbanahụ ihe rụrụ arụ nke ụwa, ma ha rapaara ọzọ n’ihe ndị ahụ, ihe ndị ahụ na-emeri ha, ọnọdụ ikpeazụ ha adịla njọ karịa nke mbụ.
