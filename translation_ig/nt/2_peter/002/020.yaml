id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na ha sitere n’ịmata Onyenwe anyị na Onye Nzọpụta, Jizọs bụ Mesaya, gbanahụ ihe rụrụ arụ nke ụwa, ma ha rapaara ọzọ n’ihe ndị ahụ, ihe ndị ahụ na-emeri ha, ọnọdụ ikpeazụ ha adịla njọ karịa nke mbụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: gbanahụ
  rationale: Ngwaa a na-egosi na ha buru ụzọ gbanahụ tupu ha alaghachi banye n’ọnyà; nhazi ahịrịokwu Igbo na-eme ka usoro oge ahụ doo anya.
- source_word: μιάσματα
  choice: ihe ndị na-emerụ emerụ
  rationale: Nke a na-ebute echiche nke ihe na-emerụ ma na-emetọ mmadụ n’omume, n’enweghị ime ka ọ bụrụ naanị unyi anụ ahụ.
- source_word: ἐν ἐπιγνώσει
  choice: site n’ịmata
  rationale: ἐν nwere ike igosi ụzọ e si mee ihe n’ebe a; ‘site n’ịmata’ bụ Igbo dị mfe ma ọ naghị ekpebi ma ihe ọmụma a ọ bụ nzọpụta zuru ezu ma ọ bụ na ọ bụghị.
- source_word: κυρίου καὶ σωτῆρος
  choice: Onyenwe anyị na Onye Nzọpụta
  rationale: E debere utu aha abụọ ahụ dị ka aha nsọpụrụ e nyere Jizọs.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mesaya
  rationale: ‘Mesaya’ na-eme ka Χριστός bụrụ utu aha, ebe ‘bụ’ na-eme ka okwu ahụ bụrụ Igbo eke ma doo anya.
- source_word: πάλιν ἐμπλακέντες
  choice: banyeekwa ọzọ n’ọnyà
  rationale: Nke a na-echekwa oyiyi nke ịdaba ma ọ bụ ịrapara ọzọ n’ihe mmadụ gbanahụrụ.
- source_word: ἡττῶνται
  choice: ha emerie ha
  rationale: Ngwaa ahụ pụtara na ihe ndị ahụ meriri ma chịkwaa ha; passive a bụ Igbo eke.
- source_word: τὰ ἔσχατα χείρονα τῶν πρώτων
  choice: ọnọdụ ikpeazụ ha adịla njọ karịa nke mbụ
  rationale: Nke a na-enye okwu ntụnyere ahụ n’Igbo doro anya, na-enweghị ịkọwa ya kpọmkwem dị ka ikpeazụ nke oge ụwa.
theological_decisions:
- issue: Ụdị ‘ịmata’ ahụ na mmekọrịta ya na ịdapụ n’okwukwe
  choice: A sụgharịrị ya naanị dịka ‘ịmata,’ n’agbanyeghị na a kọwara ụzọ ya site na ‘site n’ịmata.’
  alternative: ihe ọmụma na-azọpụta; ma ọ bụ ịmata naanị n’elu ọnụ
  rationale: ἐπίγνωσις n’onwe ya anaghị edozi esemokwu banyere ma ndị a amụgharịrị ọhụrụ n’ezie. Nsụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe ahụ ka ọ dị.
- issue: Otu e si sụgharịa Χριστοῦ
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a, okwu ahụ ka na-arụ ọrụ dị ka utu aha; ‘Jizọs bụ Mesaya’ na-egosipụta nke ahụ n’Igbo nkịtị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. E ji ‘ọnọdụ ikpeazụ’ mee ka okwu Grik ahụ doo anya, ma e tinyeghị nkọwa ụka ọ bụla gbasara ma ndị ahụ bụ ndị a zọpụtara n’ezie.
