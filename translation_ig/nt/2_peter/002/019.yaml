review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the promise of freedom, the emphatic contrast that the promisers themselves are slaves, and corruption as the enslaving power. The final clause, however, uses an awkward construction ('e mere onye ahụ ohu ya') that can be read less clearly than the Greek's resultant state of being enslaved by what has overcome someone.
  naturalness: The first clause and 'ebe ha onwe ha bụ ndị ohu nke ire ure' are natural Standard Igbo. Revising the final clause to 'ọ bụkwa ihe ahụ ka onye ahụ ghọworo ohu' makes the generic maxim idiomatic and clearly expresses the enduring state indicated by the Greek perfect passive.
  terminology: '''nnwere onwe,'' ''ndị ohu,'' and ''ire ure'' suitably preserve the freedom/slavery contrast and the broad sense of φθορά. No doctrinally loaded expansion is introduced.'
  issues:
  - severity: medium
    issue: The final expression 'ọ bụkwa ya ka e mere onye ahụ ohu ya' is syntactically and semantically awkward.
    rationale: Its repeated 'ya' and impersonal passive may obscure that the person is enslaved to the very thing that overcame him or her. A clearer focus construction retains the Greek relationship and perfect-result sense.
  revised_text: na-ekwe ha nkwa nnwere onwe, ebe ha onwe ha bụ ndị ohu nke ire ure; n’ihi na ihe ọ bụla meriri mmadụ, ọ bụkwa ihe ahụ ka onye ahụ ghọworo ohu.
