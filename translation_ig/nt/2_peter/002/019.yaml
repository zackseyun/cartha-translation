- from: na-ekwe ha nkwa nnwere onwe, ebe ha onwe ha bụ ndị ohu nke ire ure; n’ihi na ihe ọ bụla meriri mmadụ, ọ bụkwa ya ka e mere onye ahụ ohu ya.
  to: na-ekwe ha nkwa nnwere onwe, ebe ha onwe ha bụ ndị ohu nke ire ure; n’ihi na ihe ọ bụla meriri mmadụ, ọ bụkwa ihe ahụ ka onye ahụ ghọworo ohu.
  rationale: Only the final clause is revised. 'Ọ bụkwa ihe ahụ ka onye ahụ ghọworo ohu' is natural Standard Igbo and conveys that the thing which overcame a person is also that to which the person now stands enslaved. The wording avoids over-specifying the nature of 'corruption' and retains the emphatic freedom-versus-slavery contrast.
