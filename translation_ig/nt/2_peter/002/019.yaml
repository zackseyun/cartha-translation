id: 2PE.2.19
reference: 2 Peter 2:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι, αὐτοὶ δοῦλοι ὑπάρχοντες τῆς φθορᾶς· ᾧ γάρ τις ἥττηται, τούτῳ ⸀καὶ δεδούλωται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/019.yaml
  text: promising them freedom while they themselves are servants of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: ig
  text: na-ekwe ha nkwa nnwere onwe, ebe ha onwe ha bụ ndị ohu nke ire ure; n’ihi na ihe ọ bụla meriri mmadụ, ọ bụkwa ihe ahụ ka onye ahụ ghọworo ohu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: nnwere onwe
  rationale: Ọ bụ okwu Igbo a na-ejikarị egosi freedom/liberty, ma na-emekwa ka ọdịiche dị n’etiti nkwa nnwere onwe na ịbụ ohu pụta ìhè.
- source_word: ἐπαγγελλόμενοι
  choice: na-ekwe ha nkwa
  rationale: Nke a na-echekwa echiche nke ime nkwa, ọ bụghị naanị ikwuputa ma ọ bụ inye ihe.
- source_word: δοῦλοι
  choice: ndị ohu
  rationale: Ọnọdụ ịbụ onye e ji n’agbụ bụ isi n’ọdịiche amaokwu a na-eme n’etiti nnwere onwe na ịchị mmadụ; ya mere, okwu dị nro dịka ‘ndị na-eje ozi’ agaghị ezuru.
- source_word: ὑπάρχοντες
  choice: ebe ha onwe ha bụ
  rationale: Ọ na-egosi ọnọdụ ha n’ezie n’otu oge ahụ ha na-ekwe ndị ọzọ nkwa, ma na-eme ka esemokwu ahụ doo anya n’Igbo.
- source_word: φθορᾶς
  choice: ire ure
  rationale: Okwu a nwere ike ịgụnye mmebi omume na mbibi na-esi na ya apụta; ‘ire ure’ na-echekwa obosara echiche abụọ ahụ n’ụzọ ebumpụta ụwa.
- source_word: ᾧ γάρ τις ἥττηται
  choice: n’ihi na ihe ọ bụla meriri mmadụ
  rationale: Nke a na-enye ụkpụrụ izugbe ahụ n’Igbo doro anya ma na-echekwa echiche nke ịbụ onye ihe meriri ma ọ bụ chịkwasịrị.
- source_word: τούτῳ καὶ δεδούλωται
  choice: ọ bụkwa ya ka e mere onye ahụ ohu ya
  rationale: Nke a na-echekwa passive na ọnọdụ na-adịgide adịgide sitere n’perfect, ma jikọta ya nke ọma na ‘ndị ohu’ dị na nkebi mbụ.
- source_word: τις
  choice: mmadụ ... onye ahụ
  rationale: τις bụ onye ọ bụla n’ụzọ izugbe; Igbo anaghị achọ iji nnọchiaha nwoke mee ka nke a pụta, ya mere ‘mmadụ ... onye ahụ’ bụ ihe ziri ezi ma doo anya.
theological_decisions:
- issue: Ịsụgharị δοῦλοι/δεδούλωται n’ebe a na-atụnyere nnwere onwe ụgha na ịbụ ohu n’ezie
  choice: Jiri ‘ndị ohu’ na ‘e mere ... ohu’
  alternative: ndị na-eje ozi; ndị nọ n’agbụ
  rationale: Isi arụmụka nke amaokwu ahụ dabere n’ọdịiche siri ike n’etiti nkwa nnwere onwe na ịbụ ihe na-achị mmadụ ohu. Nsụgharị dị nro ga-ebelata ike okwu Grik.
- issue: Ihe φθορά pụtara
  choice: ire ure
  alternative: mbibi; mmebi omume
  rationale: ‘Ire ure’ na-ahapụ ma akụkụ mmebi omume ma akụkụ mbibi ka ha nọkọọ, kama ikpebi naanị otu n’ime ha.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ha onwe ha’ mesie αὐτοὶ ike, jiri ‘ndị ohu/e mere ... ohu’ chekwaa njikọ okwu na ihe ọchị dị ilu n’etiti nnwere onwe e kwere na ọnọdụ ịgba ohu n’ezie.
