revisions:
- from: ọ napụtakwara Lọt onye ezi omume, bụ́ onye ibi ndụ[a] rụrụ arụ na nke ihere na-adịghị[b] nke ndị na-emebi iwu nọ na-emekpa ahụ́[c]—
  to: ọ napụtakwara Lọt, onye ezi omume, bụ́ onye omume rụrụ arụ na nke enweghị ihere nke ndị na-emebi iwu nọ na-emekpa ahụ—
  rationale: 'The revision resolves the attachment ambiguity by making “Lọt ... bụ́ onye ... nọ na-emekpa ahụ” the governing relative clause. It maintains the Greek sequence and meanings: rescue, righteous Lot, his continuing affliction, and the lawless people’s shameless conduct as its cause. Footnotes are retained with wording adjusted to match the revised lexical choices.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:21:55Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the principal meanings: God rescued Lot, whom the Greek explicitly calls righteous; Lot was undergoing continuing distress; and the cause was the shamelessly immoral conduct of lawless people. However, its word order makes “ibi ndụ ... nke ndị na-emebi iwu” appear to be the object being tormented, rather than the conduct that was tormenting Lot. The revision makes Lot unambiguously the one being afflicted while retaining the ongoing passive sense.'
  naturalness: '“Ibi ndụ ... nọ na-emekpa ahụ” is structurally strained in Standard Igbo. A relative construction headed by “bụ́ onye” is clearer and natural: it identifies Lot as the person whom the conduct was continually tormenting. “Omume rụrụ arụ na nke enweghị ihere” is clear, dignified, and suitable for the register.'
  terminology: “Onye ezi omume” faithfully renders δίκαιον, “Lọt” is appropriate, and “ndị na-emebi iwu” adequately conveys ἀθέσμων. “Omume rụrụ arụ na nke enweghị ihere” renders ἀσέλγεια without restricting it solely to sexual sin, while “omume” appropriately renders ἀναστροφή in this context.
  issues:
  - severity: medium
    issue: Ambiguous and strained clause attachment
    rationale: In “Lọt onye ezi omume, bụ́ onye ibi ndụ ... nke ndị na-emebi iwu nọ na-emekpa ahụ,” the construction can suggest that the lawless people’s way of life is what is being tormented. The Greek participle καταπονούμενον modifies Lot, and the Igbo should state this clearly.
  - severity: low
    issue: Rendering of ἀσέλγεια
    rationale: “Nke ihere na-adịghị” is understandable but less idiomatic than “nke enweghị ihere.” The latter more naturally conveys shameless excess while retaining the broad moral sense of the Greek.
  revised_text: ọ napụtakwara Lọt, onye ezi omume, bụ́ onye omume rụrụ arụ na nke enweghị ihere nke ndị na-emebi iwu nọ na-emekpa ahụ—
  revised_footnotes:
