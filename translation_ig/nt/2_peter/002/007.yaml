  text: καὶ δίκαιον Λὼτ καταπονούμενον ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς ἐρρύσατο—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/007.yaml
  text: and he rescued righteous Lot[c][b][a], who was being tormented by the sensual conduct of the lawless—
translation:
  language: ig
  text: ọ napụtakwara Lọt, onye ezi omume, bụ́ onye omume rụrụ arụ na nke enweghị ihere nke ndị na-emebi iwu nọ na-emekpa ahụ—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιον
  choice: onye ezi omume
  rationale: Nke a na-edowe n'ụzọ doro anya otú ederede Grik si kọwaa ọnọdụ omume Lọt, n’agbanyeghị ihe isi ike ndị na-agụ akụkọ Jenesis nwere ike ịhụ.
- source_word: Λὼτ
  choice: Lọt
  rationale: A sụgharịrị aha ahụ dịka ntụgharị mkpụrụokwu aha a na-ejikarị eme n’Igbo.
- source_word: καταπονούμενον
  choice: nọ na-emekpa ahụ́
  rationale: Ụdị okwu a na-egosi mmekpa ahụ́ siri ike nke na-aga n’ihu, ebe Lọt bụ onye ihe ahụ na-adakwasị.
- source_word: ὑπὸ τῆς ... ἀναστροφῆς
  choice: ibi ndụ ... nke
  rationale: Nke a na-egosi na ụzọ ndị ahụ si ebi ndụ bụ ihe kpatara ahụhụ Lọt, ma na-ejigide echiche nke omume a na-eme mgbe niile.
- source_word: τῶν ἀθέσμων
  choice: ndị na-emebi iwu
  rationale: Nke a na-egosipụta ndị na-eleghara iwu na ihe ziri ezi anya n’asụsụ Igbo dị mfe nghọta.
- source_word: ἐν ἀσελγείᾳ
  choice: rụrụ arụ na nke ihere na-adịghị
  rationale: Nkebiokwu a na-egosipụta omume ọjọọ gabigara ókè nke ndị na-eme ya na-enweghị ihere, na-enweghị ime ka ihe ọ pụtara bụrụ naanị mmehie mmekọahụ.
- source_word: ἐρρύσατο
  choice: ọ napụtakwara
  rationale: Okwu a na-egosi ịzọpụta mmadụ n’ihe ize ndụ, ebe “-kwara” na-edowe njikọ ya na ihe amaokwu bu ya ụzọ kwuru.
- source_word: καὶ
  choice: -kwara
  rationale: Nsonaazụ ngwaa Igbo a na-arụ ọrụ njikọ nke καὶ n'ụzọ sitere n’okike n’ahịrịokwu a.
theological_decisions:
- issue: Nkọwa Lọt dịka onye ezi omume n’agbanyeghị akụkọ ya na Jenesis
  choice: Lọt onye ezi omume
  alternative: Lọt, nwoke na-eme ihe ziri ezi
  rationale: Ederede Grik kpọrọ Lọt δίκαιος n’enweghị mbelata ma ọ bụ nkọwa mgbakwunye; ya mere, nsụgharị ahụ na-edowe nyocha nke ederede n’onwe ya kama idozi esemokwu ahụ n’ụzọ ozizi.
translation_notes:
  register: E ji Igbo ọkọlọtọ dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. A hapụrụ akara ogologo ahịrị n’ọgwụgwụ iji gosi na echiche ahụ na-aga n’ihu n’amaokwu na-esonụ. Usoro ahịrịokwu ahụ na-edowe Lọt dịka onye mmekpa ahụ́ na-adakwasị na ụzọ ndụ ndị na-emebi iwu dịka ihe kpatara ya.
