    text: A pụkwara ịsụgharị ya “ụzọ ndụ” ma ọ bụ “ibi ndụ.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a na-egosi omume rụrụ arụ gabigara ókè nke a na-eme n’enweghị ihere; a pụkwara ịsụgharị ya “omume na-adịghị ọcha” ma ọ bụ “omume ọjọọ a na-achịkwaghị achịkwa.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya “na-akpagbu” ma ọ bụ “na-enye nnukwu mwute.”
    reason: lexical_alternative
  revision_rationale: 'The revision resolves the attachment ambiguity by making “Lọt ... bụ́ onye ... nọ na-emekpa ahụ” the governing relative clause. It maintains the Greek sequence and meanings: rescue, righteous Lot, his continuing affliction, and the lawless people’s shameless conduct as its cause. Footnotes are retained with wording adjusted to match the revised lexical choices.'
