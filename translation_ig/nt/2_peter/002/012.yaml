id: 2PE.2.12
reference: 2 Peter 2:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτοι δέ, ὡς ἄλογα ζῷα ⸂γεγεννημένα φυσικὰ⸃ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν ⸂καὶ φθαρήσονται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
translation:
  language: ig
  text: Ma ndị a, dị ka anụmanụ na-enweghị uche[a]—ndị ebumpụta ụwa na-achị, ndị a mụrụ ka e jide ma bibie ha[b]—na-ekwulu ihe ndị ha na-amaghị[c]; n’ime mbibi ha, a ga-ebibikwa ha[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anụmanụ ndị na-adịghị eche echiche.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, okwu Grik ahụ na-ekwu maka anụmanụ “ndị a mụrụ dịka ebumpụta ụwa ha si dị” ka e jide ma bibie ha; ọ na-egosi ihe e kere eke nke ọchịchọ okike na-edu karịa uche.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “na-ekwujọ ihe ndị ha na-aghọtaghị.”
    reason: lexical_alternative
  - marker: d
    text: N'ebe a, Grik ji okwu abụọ sitere n'otu mgbọrọgwụ meegharị echiche nke “mbibi” na “a ga-ebibi,” si otú a chekwaa egwuregwu okwu dị n'ederede ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: anụmanụ na-enweghị uche
  rationale: Nkebi a na-egosi anụmanụ ndị na-enweghị ikike iche echiche nke mmadụ. Nsụgharị a doro onye Igbo nke oge a anya ma debe ntụnyere gbasara enweghị uche.
- source_word: γεγεννημένα φυσικὰ
  choice: ihe e kere eke nke ọchịchọ ebumpụta ụwa na-achị
  rationale: Okwu Grik a jikọtara echiche nke ịbụ ihe e kere eke dịka okike si dị na ibi site n'ọchịchọ ebumpụta ụwa. Nsụgharị a na-ezere okwu Igbo na-adịghị aga were were dịka ‘ndị a mụrụ ebumpụta ụwa,’ ma na-echekwa echiche nke omume sitere n'okike karịa n'uche.
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: ndị a mụrụ ka e jide ma bibie ha
  rationale: εἰς na-egosi nzube ma ọ bụ ihe ga-esi na ya pụta; ἅλωσις bụ ijide, ebe φθορά n'ọnọdụ a bụ mbibi ma ọ bụ ịla n'iyi. Usoro okwu a bụ Igbo dị ire ma debe onyinyo anụmanụ a na-ejide ma na-ebibi.
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: ihe ndị ha na-amaghị
  rationale: Aha nnọchi neuter plural na-arụtụ aka n'ihe ma ọ bụ okwu ndị a na-ekwu banyere ha, ọ bụghị kpọmkwem n'ahụ mmadụ. ‘Ihe ndị ha na-amaghị’ na-echekwa nghọta ahụ n'ụzọ dị mfe.
- source_word: βλασφημοῦντες
  choice: na-ekwulu
  rationale: ‘Ikwulu’ nwere ike igosi okwu mkparị siri ike megide ihe dị nsọ ma ọ bụ ikwujọ ihe. Ọ na-echekwa ịdị arọ nke βλασφημέω n'ebughị ụzọ kọwaa kpọmkwem ihe a na-ekwulu, ebe Grik ekwughị ya n'amaokwu a.
- source_word: ἐν τῇ φθορᾷ αὐτῶν
  choice: n’ịla n’iyi ha
  rationale: φθορά nwere ike ịbụ mmebi omume ma ọ bụ mbibi. N'ọnọdụ nke ijide na ibibi anụmanụ, ‘ịla n'iyi’ na-egosi mbibi nke ọma ma na-enye ohere idebe nkwughachi okwu dị n'ahịrị ikpeazụ.
- source_word: καὶ φθαρήσονται
  choice: ha onwe ha ga-alakwa n’iyi
  rationale: Future passive φθαρήσονται pụtara na a ga-ebibi ha ma ọ bụ na ha ga-ala n'iyi. ‘Ga-alakwa n'iyi’ na-egosipụta καί ma na-emeghachi ‘ịla n'iyi’ iji chekwaa egwuregwu okwu Grik.
theological_decisions:
- issue: Ihe βλασφημοῦντες pụtara n’ọnọdụ a
  choice: E jiri ‘na-ekwulu’ debe okwu siri ike nke nwere ike ịpụta nkwulu ma ọ bụ nkwujọ.
  alternative: na-ekwujọ; na-ekwu okwu mkparị banyere
  rationale: Grik na-ama ikpe okwu ọjọọ siri ike, ma ọ kpọghị kpọmkwem ndị ma ọ bụ ihe okwu ahụ metụtara n'amaokwu a. ‘Na-ekwulu’ anaghị eme ka ikpe ahụ dị nro, ma ọ naghị ebubata nkọwa okpukpe nke ederede ekwughị.
- issue: Ihe φθορά / φθαρήσονται pụtara
  choice: E ji ‘ịla n’iyi’ meegharị okwu ahụ ugboro abụọ dịka Grik si mee.
  alternative: mmebi; mbibi; ire ure
  rationale: Onyinyo nke anụmanụ a na-ejide ma na-ebibi na-akwado echiche nke mbibi ma ọ bụ ịla n'iyi karịa naanị ire ure nke omume. Imegharị otu okwu na-echekwa njikọ na esemokwu okwu nke ederede mbụ n'ebughị nkọwa ikpe ikpeazụ ọzọ n'ime ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Akara ogologo ahụ na-ekewa nkọwa gbasara anụmanụ nke ọma, ebe nkwughachi ‘ịla n’iyi’ na-echekwa ike na egwuregwu okwu nke Grik.
