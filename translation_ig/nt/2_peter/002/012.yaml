revisions:
- from: Ma ndị a, dị ka anụmanụ na-enweghị uche[a]—ihe e kere eke nke ọchịchọ ebumpụta ụwa na-achị, ndị a mụrụ ka e jide ma bibie ha[b]—na-ekwulu ihe ndị ha na-amaghị[c]; n’ịla n’iyi ha, ha onwe ha ga-alakwa n’iyi[d].
  to: Ma ndị a, dị ka anụmanụ na-enweghị uche[a]—ndị ebumpụta ụwa na-achị, ndị a mụrụ ka e jide ma bibie ha[b]—na-ekwulu ihe ndị ha na-amaghị[c]; n’ime mbibi ha, a ga-ebibikwa ha[d].
  rationale: The revision restores the birth-language of γεγεννημένα, retains the idiomatic explanation of φυσικά without making it the primary noun phrase, and renders the final prepositional phrase and future passive as “n’ime mbibi ha, a ga-ebibikwa ha.” This preserves the deliberate destruction-word repetition without adding the unsupported idea of complete destruction.
