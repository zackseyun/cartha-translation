id: 2PE.2.1
reference: 2 Peter 2:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: ig
  text: Ma ndị amụma ụgha pụtakwara n’etiti ndị ahụ, dị nnọọ ka ndị nkuzi ụgha ga-adịkwa n’etiti unu. Ndị a ga-ezoro ezo webata ozizi na-eduga ná mbibi[a], na-agọnahụ Nna Ukwu ahụ zụtara ha[b], ma si otú a wetara onwe ha mbibi ngwa ngwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “òtù ndị na-eweta mbibi” ma ọ bụ “nkewa ndị na-eweta mbibi.” Okwu Grik ahụ nwere ike ịpụta òtù ma ọ bụ nkewa, ma n’ebe a o yikarịrị ka ọ na-ekwu banyere ozizi ma ọ bụ mmegharị na-eduga ná mbibi.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Onyenwe ahụ gbapụtara ha.” Ma okwu Grik ahụ kwuru kpọmkwem, “Nna Ukwu ahụ zụtara ha,” nke na-echekwa ihe atụ nzụta ahụ n’ekpebighị esemokwu nkà mmụta okpukpe gbasara ihe nzụta ahụ ruru.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένοντο
  choice: bilikwara
  rationale: N’ebe a, okwu ahụ na-egosi na ndị amụma ụgha pụtara n’etiti ndị ahụ. “Bilikwara” bụ ụzọ Igbo doro anya si ekwu na ha malitere ịpụta ma rụọ ọrụ.
- source_word: ψευδοπροφῆται
  choice: ndị amụma ụgha
  rationale: Nke a bụ ntụgharị kpọmkwem, nke ndị na-agụ Igbo ga-aghọta nke ọma.
- source_word: ἐν τῷ λαῷ
  choice: n’etiti ndị ahụ
  rationale: Ọ na-echekwa okwu Grik bụ “ndị ahụ” n’ebughị ụzọ kọwaa ha dị ka Izrel n’ahịrịokwu bụ isi, ọ bụ ezie na gburugburu okwu ahụ na-atụ aka n’ebe ndị Chineke nọ n’oge ochie.
- source_word: ψευδοδιδάσκαλοι
  choice: ndị nkuzi ụgha
  rationale: Ọ na-echekwa njikọ doro anya dị n’etiti ndị amụma ụgha nke oge gara aga na ndị nkuzi ụgha ga-abịa.
- source_word: παρεισάξουσιν
  choice: ga-eji ụzọ nzuzo webata
  rationale: Ngwaa Grik ahụ na-egosi iwebata ihe n’ụzọ zoro ezo; ntụgharị a na-echekwa echiche ahụ n’asụsụ Igbo dị mfe.
- source_word: αἱρέσεις ἀπωλείας
  choice: ozizi ụgha ndị na-eweta mbibi
  rationale: N’ebe a, αἱρέσεις metụtara ihe ndị a na-ewebata na nzuzo na ịjụ Nna Ukwu ahụ. “Ozizi ụgha” na-eme ka ihe a na-ekwu doo onye Igbo anya, ebe “ndị na-eweta mbibi” na-egosi ihe ἀπωλείας pụtara.
- source_word: τὸν ... δεσπότην
  choice: Nna Ukwu ahụ
  rationale: “Nna Ukwu” na-egosi onye nwere ikike zuru oke ma na-enyekwa ohere idowe δεσπότης iche n’aha κύριος a na-asụgharịkarị “Onyenwe anyị.”
- source_word: ἀγοράσαντα αὐτούς
  choice: zụtara ha
  rationale: “Zụtara” na-echekwa ihe atụ azụmahịa dị na ἀγοράζω, n’akọwaghị ya ozugbo dị ka mgbapụta ma ọ bụ kpebie esemokwu nkà mmụta okpukpe gbasara oke nzụta ahụ.
- source_word: ἀρνούμενοι
  choice: Ha ga-ajụdị
  rationale: “Ajụ” na-egosi ịgọnahụ ma ọ bụ ịjụ ịnabata onye ahụ; mgbakwunye “-dị” na-echekwa ike nke καί, ya bụ, na ha ruru ọbụna n’ịjụ Nna Ukwu ahụ.
- source_word: ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν
  choice: si otú a wetara onwe ha mbibi ngwa ngwa
  rationale: Nke a na-echekwa nsonaazụ omume ha, ike nke nnọchiaha onwe “onwe ha,” na ọsọ mbibi ahụ.
theological_decisions:
- issue: Ihe αἱρέσεις pụtara n’ebe a
  choice: ozizi ụgha
  alternative: òtù ndị na-eweta mbibi; nkewa ndị na-eweta mbibi
  rationale: Okwu Grik ahụ nwere ike ịpụta òtù, nkewa, ma ọ bụ ozizi pụrụ iche. N’ebe a, iwebata ya na nzuzo na ịjụ Nna Ukwu ahụ na-eme ka echiche banyere ozizi nduhie pụta ìhè, ma e debere ụzọ ọzọ na nkọwa ala peeji.
- issue: Ike na ihe τὸν ἀγοράσαντα αὐτοὺς δεσπότην na-ekwu
  choice: Nna Ukwu ahụ zụtara ha
  alternative: Onyenwe ahụ gbapụtara ha
  rationale: E chekwara okwu nzụta nke Grik na esemokwu nkà mmụta okpukpe dị na ya. A naghị eji “gbapụtara” dochie “zụtara,” n’ihi na nke ahụ nwere ike ịkọwa ihe okwu ahụ pụtara karịa ka isi mmalite kwuru.
- issue: Idowe δεσπότης iche na κύριος
  choice: Nna Ukwu
  alternative: Onyenwe; Ọkaakaa
  rationale: “Nna Ukwu” na-egosi ikike onye nwe ma ghara ime ka δεσπότης na κύριος bụrụ otu aha n’enweghị ọdịiche.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu Grik ogologo ahụ ụzọ atọ iji mee ka ịgụ ya doo anya, ma e chekwara njikọ echiche ya. E tinyere akara nkọwa [a] n’akụkụ αἱρέσεις, ebe ọ bụ okwu nkọwa ahụ na-akọwa; nke a na-ezere itinye akara ahụ n’akụkụ “ndị ahụ,” nke na-agaghị adaba na ọdịnaya nkọwa ahụ.
