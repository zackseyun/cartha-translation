  source_fidelity: A na-echekwa usoro na isi echiche nke Grik n’ozuzu ya, ma “ozizi ụgha” na-agbakwunye echiche “ụgha” n’ụzọ doro anya karịa αἱρέσεις n’onwe ya, ebe okwu ahụ nwere ike ịpụta ozizi, òtù, ma ọ bụ nkewa. “Ha ga-ajụdị” na-eme ka njikọ participle ἀρνούμενοι ghọọ ahịrịokwu kwụụrụ onwe ya ma na-enye “-dị” ike pụrụ iche nke na-adịghị mkpa. Ntụgharị a gbanwere ya ka ọ bụrụ “na-agọnahụ,” nke na-ejikọ ya n’ọrụ ndị nkuzi ụgha ahụ dịka Grik si eme.
  naturalness: “Ga-eji ụzọ nzuzo webata” ghọtara nke ọma, ma “ga-ezoro ezo webata” dị mkpụmkpụ ma bụrụ Igbo eke karịa. “Ndị a” na-eweghachi ndị nkuzi ụgha ahụ n’ụzọ doro anya n’ahịrịokwu nke abụọ, ebe usoro participle ndị na-esonụ na-agụ n’ụzọ dị nro.
  terminology: “Nna Ukwu” ka edobere maka δεσπότης iji ghara ime ka ọ bụrụ otu aha na κύριος/“Onyenwe.” “Zụtara” na-edobe ihe atụ azụmahịa nke ἀγοράζω. “Ozizi na-eduga ná mbibi” na-egosi genitive ἀπωλείας na-agbakwunyeghị “ụgha” dịka akụkụ pụtara ìhè nke αἵρεσις.
