revisions:
- from: na-ata ahụhụ nke bụ ụgwọ ajọ omume ha[a]. Ha na-ewere imeju agụụ ihe ụtọ n’ehihie dị ka ihe na-atọ ụtọ. Ha bụ ntụpọ na nkwarụ, na-ekpori ndụ n’aghụghọ ha[b] mgbe ha na unu na-eri oriri,
  to: na-anata ụgwọ ọrụ nke ajọ omume[a]. Ha na-ewere ibi ndụ okomoko n’ehihie dị ka ihe ụtọ. Ha bụ ntụpọ na mmerụ, na-ekpori ndụ n’aghụghọ ha[b] ka ha na unu na-eri oriri,
  rationale: The revision corrects the sense of τρυφή, replaces a potentially misleading and stigmatizing term for μῶμοι, and smooths the recompense clause. It retains the SBLGNT reading ἀπάταις in the text, records the meaningful ἀγάπαις variant in the correctly anchored footnote, preserves the unfinished syntax and final comma of the Greek passage, and does not add doctrinal interpretation.
