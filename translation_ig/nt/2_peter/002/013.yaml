id: 2PE.2.13
reference: 2 Peter 2:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἀδικούμενοι μισθὸν ἀδικίας· ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν, σπίλοι καὶ μῶμοι ἐντρυφῶντες ἐν ταῖς ⸀ἀπάταις αὐτῶν συνευωχούμενοι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/013.yaml
  text: suffering the wages of unrighteousness[a], considering daytime indulgence a pleasure. They are stains and blemishes, reveling in their deceptions while feasting with you[b],
translation:
  language: ig
  text: na-anata ụgwọ ọrụ nke ajọ omume[a]. Ha na-ewere ibi ndụ okomoko n’ehihie dị ka ihe ụtọ. Ha bụ ntụpọ na mmerụ, na-ekpori ndụ n’aghụghọ ha[b] ka ha na unu na-eri oriri,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ata ahụhụ ụgwọ ọrụ nke ajọ omume.”
    reason: lexical_alternative
  - marker: b
    text: 'Ụfọdụ akwụkwọ aka ochie dere “oriri ịhụnanya ha” n’ọnọdụ “aghụghọ ha”: “na-ekpori ndụ n’oriri ịhụnanya ha ka ha na unu na-eri oriri.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἀδικούμενοι μισθὸν ἀδικίας
  choice: na-ata ahụhụ nke bụ ụgwọ ajọ omume ha
  rationale: Nkebi a na-egosi na ha na-ata ahụhụ dịka nkwụghachi maka ajọ omume ha. Nsụgharị a na-edobe echiche nke ntaramahụhụ dị na ἀδικούμενοι na nke ‘ụgwọ’ dị na μισθός, ma na-asụ ya n’Igbo doro anya.
- source_word: ἡδονὴν ἡγούμενοι
  choice: Ha na-ewere ... dị ka ihe na-atọ ụtọ
  rationale: ἡγέομαι ebe a pụtara ile ihe anya ma ọ bụ were ya dịka ihe ọzọ, ebe ἡδονή pụtara ụtọ ma ọ bụ ihe ụtọ. Usoro a bụ Igbo nkịtị ma na-edobe nkwupụta onye dere ya.
- source_word: τὴν ἐν ἡμέρᾳ τρυφήν
  choice: imeju agụụ ihe ụtọ n’ehihie
  rationale: τρυφή na-egosi ibi ndụ n’oke ihe ụtọ na ime ihe na-agụ anụ ahụ agụụ; ἐν ἡμέρᾳ na-akọwa na a na-eme ya n’ehihie, nke na-egosi enweghị ihere.
- source_word: σπίλοι καὶ μῶμοι
  choice: ntụpọ na nkwarụ
  rationale: Okwu abụọ a na-eji ihe na-emebi ịdị ọcha ma ọ bụ mma atụnyere mmebi omume. ‘Ntụpọ na nkwarụ’ na-edobe ihe atụ abụọ ahụ n’Igbo a na-aghọta ngwa ngwa.
- source_word: ἐντρυφῶντες
  choice: na-ekpori ndụ
  rationale: Okwu a na-aga n’ihu n’echiche nke itinye onwe n’oke ihe ụtọ. ‘Na-ekpori ndụ’ dabara n’ọnọdụ oriri a kpọrọ aha n’ahịrịokwu ahụ.
- source_word: ἀπάταις αὐτῶν
  choice: n’aghụghọ ha
  rationale: SBLGNT họọrọ ἀπάταις, nke pụtara aghụghọ ma ọ bụ nduhie. ‘N’aghụghọ ha’ na-edobe ọgụgụ a na njikọ ya na ndị ozizi ụgha.
- source_word: συνευωχούμενοι ὑμῖν
  choice: mgbe ha na unu na-eri oriri
  rationale: Ngwaa ahụ pụtara isoro ndị ọzọ rie oriri. Nsụgharị a na-egosi na omume ahụ na-aga n’ihu n’otu oge ahụ, ma ọ naghị ekpebi ụdị oriri ahụ karịa ihe Grik kwuru.
theological_decisions:
- issue: Ọgụgụ dị iche n’etiti ἀπάταις na ἀγάπαις
  choice: A họọrọ ἀπάταις, ‘aghụghọ ha,’ n’ahịrịokwu bụ isi.
  alternative: Ụfọdụ akwụkwọ aka ochie nwere ἀγάπαις, ‘oriri ịhụnanya ha.’
  rationale: SBLGNT nyere ἀπάταις, nke kwekọrọ n’okwu gbasara nduhie nke ndị ozizi ụgha. E debere ọgụgụ ọzọ n’ala peeji n’ihi na ọ nwere ihe ọ pụtara n’ịghọta ụdị oriri ahụ.
- issue: Mmekọrịta dị n’etiti ἀδικούμενοι na μισθὸν ἀδικίας
  choice: A sụgharịrị ya dịka ịta ahụhụ nke bụ ụgwọ ajọ omume ha.
  alternative: Enwere ike ịsụgharị ya dịka ‘ịnata ụgwọ ọrụ maka ajọ omume ha.’
  rationale: Nhọrọ bụ isi na-egosi nkwụghachi ma ọ bụ ntaramahụhụ n’ọnọdụ a, ma nkọwa ala peeji na-echekwa ụzọ ọzọ e si akọwa μισθός dịka ụgwọ ọrụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ahịrịokwu ahụ ka ọ bụrụ akụkụ na-aga n’ihu dịka o si dị na Grik, tinyere rikoma n’ikpeazụ n’ihi njikọ ya na amaokwu na-esote. E deziri akara ala peeji ka [a] kọwaa ‘ụgwọ ajọ omume,’ ebe [b] kọwaa ọgụgụ dị iche n’ebe ‘aghụghọ ha’ dị.
