  text: ⸀συμβέβηκεν αὐτοῖς τὸ τῆς ἀληθοῦς παροιμίας· Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα, καί· Ὗς λουσαμένη εἰς ⸀κυλισμὸν βορβόρου.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: ig
  text: Ihe e kwuru n’ezi ilu ahụ emeela ha:[a] “Nkịta na-alaghachi n’agbọ nke ya,” na, “Ezi nne e sachara na-alaghachi ịtụgharịgharị n’apịtị.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-agbasochi usoro okwu mbụ anya, “Okwu nke ezi ilu ahụ emewo ha.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “Nkịta, ebe ọ laghachiri n’agbọ nke ya … na ezi nne e sachara, ịtụgharịgharị n’apịtị.” Ahịrị nke mbụ na-echetara Ilu 26:11.
    reason: cross_reference
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: emezuola n’ahụ ha
  rationale: Oge perfect na-egosi ihe merela nke nsonaazụ ya ka dị ugbu a. Akpaalaokwu Igbo a na-egosi na ihe ilu ahụ kwuru aghọwo eziokwu banyere ha, n’enweghị itinye nkọwa ozizi ọzọ.
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: Ihe ezi ilu ahụ kwuru
  rationale: Nkebi Grik a hapụrụ ihe ụfọdụ ka a ghọta ha n’onwe ha. Nsụgharị a na-eme ka ihe ọ pụtara doo anya n’Igbo ma na-edebe ‘ezi’ na ‘ilu.’
- source_word: Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: Nkịta na-alaghachi n’ihe ọ gbọrọ n’ọnụ
  rationale: ‘Ihe ọ gbọrọ n’ọnụ’ bụ ụzọ doro anya ma dị ùgwù isi kwuo ‘agbọ nke ya’; ‘na-alaghachi’ na-enye ilu ahụ ọdịdị okwu a na-ekwu banyere omume a na-ahụkarị.
- source_word: Ὗς λουσαμένη
  choice: Ezi nne a sachara ahụ
  rationale: ‘Ezi nne’ na-echekwa ụdị nwanyị nke Ὗς, ebe ‘a sachara ahụ’ na-egosi ọnọdụ ezi ahụ mgbe a sachachara ya, na-agbanyeghị ma ọ sachara onwe ya ma onye ọzọ sachara ya.
- source_word: εἰς κυλισμὸν βορβόρου
  choice: na-alaghachi ịtụgharịgharị n’apịtị
  rationale: ‘Ịtụgharịgharị n’apịtị’ na-enye onyinyo doro anya nke κυλισμός na βόρβορος n’Igbo nke oge a; e tinyere ‘na-alaghachi’ nke ahịrịokwu nke abụọ hapụrụ ka a ghọta ya.
theological_decisions:
- issue: Ilu ahụ e kwuru n’ụzọ e mere mkpirikpi na ihe ọ na-ekwu banyere ha
  choice: E gosiri na ihe ilu ahụ kwuru emezuola n’ahụ ndị ahụ, na-enweghị ịkọwapụta ozizi karịrị onyinyo nke ịlaghachi n’ihe ọjọọ.
  alternative: A pụrụ ịsụ ya n’ụzọ nkịtị karịa, sị, ‘Okwu nke ezi ilu ahụ emeworo ha.’
  rationale: Asụsụ Grik ahụ dị mkpirikpi ma nwee ike ịpụta na okwu ilu ahụ dabara n’ọnọdụ ha. Nsụgharị a na-edebe ịdọ aka ná ntị ahụ ma ọ naghị ekpebi ajụjụ ozizi ndị amaokwu ahụ ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E zere okwu ochie na nkọwa ụka pụrụ iche. A kọwara ‘vomit’ dị ka ‘ihe ọ gbọrọ n’ọnụ’ ka onyinyo ahụ doo onye nkịtị anya, ma jiri ‘ezi nne’ chekwaa ọdịdị nwanyị nke okwu Grik.
