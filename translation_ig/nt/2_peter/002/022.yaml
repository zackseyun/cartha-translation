revisions:
- from: Ihe ezi ilu ahụ kwuru emezuola n’ahụ ha:[a] “Nkịta na-alaghachi n’ihe ọ gbọrọ n’ọnụ,” na, “Ezi nne a sachara ahụ na-alaghachi ịtụgharịgharị n’apịtị.”[b]
  to: Ihe e kwuru n’ezi ilu ahụ emeela ha:[a] “Nkịta na-alaghachi n’agbọ nke ya,” na, “Ezi nne e sachara na-alaghachi ịtụgharịgharị n’apịtị.”[b]
  rationale: The revision renders the explicit image of vomit directly, improves the opening idiom to express that the proverb has happened to them, and smooths the sow clause while retaining both its feminine reference and the middle/passive ambiguity of the Greek participle. The footnotes are revised to match the corrected wording and retain their anchors.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:22:43Z'
review_pass:
  verdict: revise
  source_fidelity: The main sense is retained, including the proverbial application and the feminine sow. However, “ihe ọ gbọrọ n’ọnụ” softens and paraphrases the explicit Greek ἐξέραμα (“vomit”), while “emezuola n’ahụ ha” is less idiomatic and can suggest bodily fulfillment rather than that the proverb has happened to them.
  naturalness: The draft is generally understandable Standard Igbo, but “ezi nne a sachara ahụ” and “na-alaghachi ịtụgharịgharị” are awkward. “Ezi nne e sachara” and an explicit, natural predicate improve the sentence.
  terminology: Use “agbọ” for “vomit,” preserving the source image without unnecessary euphemism. “Ezi nne” appropriately retains the female-specific sense of ὗς. The wording for the washed sow remains noncommittal as to whether she washed herself or was washed.
  issues:
  - severity: medium
    issue: The dog’s “vomit” is paraphrased as “ihe ọ gbọrọ n’ọnụ.”
    rationale: ἐξέραμα specifically denotes vomit. The paraphrase is less direct and may be read merely as something expelled from the mouth; “agbọ nke ya” is both concise and source-faithful.
  - severity: low
    issue: “Emezuola n’ahụ ha” is not the clearest idiomatic expression of συμβέβηκεν αὐτοῖς.
    rationale: The Greek says that the proverb’s content has happened to them. “Emeela ha” communicates this more directly without introducing a bodily connotation.
  - severity: low
    issue: The sow clause is stylistically awkward.
    rationale: “Ezi nne a sachara ahụ” adds “ahụ” and has a less smooth passive construction. “Ezi nne e sachara” is natural and preserves the Greek participle’s ambiguity. Adding “na-alaghachi” supplies the implied verbal sense clearly in Igbo.
  revised_text: Ihe e kwuru n’ezi ilu ahụ emeela ha:[a] “Nkịta na-alaghachi n’agbọ nke ya,” na, “Ezi nne e sachara na-alaghachi ịtụgharịgharị n’apịtị.”[b]
