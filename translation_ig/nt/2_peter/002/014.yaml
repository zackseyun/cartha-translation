id: 2PE.2.14
reference: 2 Peter 2:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ⸀ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/014.yaml
  text: having eyes full of an adulteress and insatiable for sin, enticing unstable souls, having a heart trained in greed, children of a curse,
translation:
  language: ig
  text: Anya ha jupụtara na nwanyị na-akwa iko[a], ha adịghịkwa akwụsị ime mmehie[b]. Ha na-arata mkpụrụ obi ndị na-adịghị eguzosi ike. Ha nwere obi a zụrụ azụ n'anyaukwu. Ha bụ ụmụ ọbụbụ ọnụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ nkọwa dị ka, “Anya ha jupụtara n’ịkwa iko,” ma ọ bụ, “Anya ha jupụtara n’agụụ ịkwa iko.” N’asụsụ Grik, ọ pụtara n’ụzọ nkịtị, “jupụtara na nwanyị na-akwa iko.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mmehie anaghị eju ha afọ.” Okwu Grik nwekwara ike igosi na ha enweghị ike ịkwụsị ime mmehie.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεστοὺς μοιχαλίδος
  choice: jupụtara n’anyịọanyị na-akwa iko
  rationale: Nke a na-edobe ihe oyiyi doro anya nke Grik, nke pụtara n’ụzọ nkịtị ‘jupụtara n’anyịọanyị na-akwa iko,’ kama ime ka ọ bụrụ naanị echiche sara mbara banyere ịkwa iko.
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: ha adịghịkwa akwụsị ime mmehie
  rationale: Nke a na-egosipụta echiche bụ́ na ha anaghị akwụsị ime mmehie, ma bụrụkwa Igbo doro anya ma dị ndụ.
- source_word: δελεάζοντες
  choice: na-arata
  rationale: ‘Na-arata’ na-egosipụta ịdọta mmadụ n’ụzọ aghụghọ, dịka iji ọnyà ma ọ bụ ihe e ji adọta anụ.
- source_word: ψυχὰς ἀστηρίκτους
  choice: mkpụrụ obi ndị na-adịghị eguzosi ike
  rationale: ‘Mkpụrụ obi’ na-edobe okwu ψυχή, ebe ‘ndị na-adịghị eguzosi ike’ na-akọwa ndị a na-emebeghị ka ha guzosie ike.
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: obi a zụrụ azụ n’Anyaukwu
  rationale: ‘A zụrụ azụ’ na-edobe ihe oyiyi nke ọzụzụ ma ọ bụ mmega ahụ dị na γεγυμνασμένην; ‘anyaukwu’ bụ okwu Igbo a na-aghọta nke ọma maka πλεονεξία.
- source_word: κατάρας τέκνα
  choice: ụmụ ọbụbụ ọnụ
  rationale: Nke a na-edobe usoro okwu Grik ‘ụmụ nke ọbụbụ ọnụ’ n’ụdị Igbo dị mkpirikpi ma sie ike.
- source_word: ἔχοντες ... ἔχοντες
  choice: Anya ha ... Ha nwere obi
  rationale: E jiri usoro Igbo eke kewaa nkwupụta ndị ahụ, ma chekwaa nkwughachi nke inwe anya dị otu a na inwe obi a zụrụ azụ.
theological_decisions:
- issue: Ma a ga-eme ka ihe oyiyi gbasara mmekọahụ dị na μοιχαλίδος dị nro
  choice: E debere ihe oyiyi kpọmkwem nke ‘anyịọanyị na-akwa iko’ n’ederede bụ isi.
  alternative: ‘Ịkwa iko’ ma ọ bụ ‘agụụ ịkwa iko.’
  rationale: Grik ji aha otu nwanyị mee ihe n’ụzọ siri ike. Idebe ya anaghị ewebata nkọwa ụka ọ bụla, kama ọ na-echekwa ịdị nkọ nke ịdọ aka ná ntị ahụ.
- issue: Ma πλεονεξία ga-abụ ‘anyaukwu’ ma ọ bụ okwu na-elekwasị anya n’ịchọ ihe onye ọzọ nwere
  choice: anyaukwu
  alternative: ọchịchọ inweta ihe karịa ókè
  rationale: ‘Anyaukwu’ bụ okwu Igbo zuru oke ma dị mfe nghọta, nke na-ekpuchi agụụ irite ma ọ bụ nweta ihe gabiga ókè.
- issue: Otu a ga-esi ghọta ἀκαταπαύστους ἁμαρτίας
  choice: ha adịghịkwa akwụsị ime mmehie
  alternative: mmehie anaghị eju ha afọ
  rationale: Nhọrọ a na-anọ nso n’echiche bụ́ ‘ndị na-adịghị akwụsị mmehie,’ ma hapụkwa ike okwu ahụ n’enweghị ịkọwa ya naanị dịka agụụ na-adịghị eju afọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara ụda nkatọ siri ike nke amaokwu ahụ na ihe oyiyi ndị dị na Grik, ma kewaa ahịrịokwu ogologo ahụ obere ka ọ na-agụ nke ọma n’Igbo.
