  to: Anya ha jupụtara na nwanyị na-akwa iko[a], ha adịghịkwa akwụsị ime mmehie[b]. Ha na-arata mkpụrụ obi ndị na-adịghị eguzosi ike. Ha nwere obi a zụrụ azụ n'anyaukwu. Ha bụ ụmụ ọbụbụ ọnụ.
