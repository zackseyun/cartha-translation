  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/005.yaml
  text: and if he did not spare the ancient world[a], but preserved Noah, an eighth person, a herald of righteousness, when he brought a flood upon a world of the ungodly[c][b],
translation:
  language: ig
  text: ọ bụrụkwa na o meghị ebere n’ebe ụwa oge ochie[a] dị, kama o chebere Noa[b], onye nke asatọ, onye na-ekwusa ezi omume[c], mgbe o mere ka iju mmiri bịakwasị ụwa nke ndị na-adịghị asọpụrụ Chineke,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụwa mbụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Noa, otu n’ime mmadụ asatọ.” Okwu Grik ahụ mkpụmkpụ nwere ike igosi na e chebere Noa na mmadụ asaa ọzọ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “onye nkwusa nke ezi omume.” “Ikpe ziri ezi” bụkwa ihe okwu a sụgharịrị “ezi omume” nwere ike ịpụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχαίου κόσμου
  choice: ụwa oge ochie
  rationale: Nke a na-ezo aka n'ụwa nke oge mbụ, karịchaa ụwa tupu iju mmiri ahụ; okwu a bụ nke nkịtị ma doo anya n'Igbo ugbu a.
- source_word: οὐκ ἐφείσατο
  choice: ọ hapụghị
  rationale: N'ọnọdụ ikpe a, okwu ahụ pụtara na Chineke emeghị ebere site n'ịghara inye ntaramahụhụ; ‘hapụghị’ na-edobe mkpụmkpụ na ike nke okwu Grik.
- source_word: ὄγδοον Νῶε
  choice: Noa, onye nke asatọ
  rationale: Nke a na-edobe usoro ordinal nke okwu Grik na mkpakọ ya, n'agbanyeghị na ọ nwere ike ịpụta na Noa bụ otu n'ime mmadụ asatọ a zọpụtara.
- source_word: δικαιοσύνης κήρυκα
  choice: onye na-ekwusa ezi omume
  rationale: ‘Onye na-ekwusa’ na-egosi onye na-akpọsa ozi n'ihu ọha; ‘ezi omume’ bụ ntụgharị Igbo doro anya nke δικαιοσύνη n'ebe a.
- source_word: ἐφύλαξεν
  choice: o chebere
  rationale: N'okwu gbasara nzọpụta n'etiti ikpe, ‘chebere’ na-egosi idebe mmadụ ka ọ ghara ịla n'iyi.
- source_word: κατακλυσμὸν
  choice: iju mmiri
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa nnukwu mmiri nke bibiri ụwa n'oge Noa.
- source_word: κόσμῳ ἀσεβῶν
  choice: ụwa nke ndị na-adịghị asọpụrụ Chineke
  rationale: Nke a na-edobe njikọ genitive ahụ ma kọwaa ἀσεβῶν dịka ndị na-enweghị nsọpụrụ nye Chineke, na-enweghị itinye nkọwa ụka pụrụ iche.
- source_word: ἐπάξας
  choice: mgbe o mere ka ... bịakwasị
  rationale: Usoro a na-egosi njikọ oge na ihe Chineke mere, ma na-anọgide bụrụ Igbo dị mfe ma dị ebube.
theological_decisions:
- issue: Ntughari δικαιοσύνη
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N'ebe a, ‘ezi omume’ dabara n'ọrụ Noa dị ka onye na-ekwusa ụzọ ndụ ziri ezi; ‘ikpe ziri ezi’ ka bụ ihe okwu ahụ nwekwara ike ịpụta n'ọnọdụ ụfọdụ.
- issue: Mkpakọ okwu ὄγδοον Νῶε
  choice: Noa, onye nke asatọ
  alternative: Noa, otu n'ime mmadụ asatọ
  rationale: Nhọrọ bụ isi na-edobe ọdịdị ordinal nke Grik na ambiguiti ya; ntụgharị ọzọ na-akọwapụta na e chebere mmadụ asatọ n'ozuzu.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere usoro ahịrịokwu ahụ ka ọ bụrụ akụkụ na-aga n'ihu nke ahịrịokwu malitere n'amaokwu ndị bu ya ụzọ. E debere ‘onye nke asatọ’ iji ghara ikpochapụ mkpakọ na ambiguiti dị n'okwu Grik.
