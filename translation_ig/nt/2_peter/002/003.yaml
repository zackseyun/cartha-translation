id: 2PE.2.3
reference: 2 Peter 2:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ ⸀νυστάζει.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: ig
  text: N’ihi anyaukwu, ha ga-eji okwu ndị ha chepụtara erigbu unu.[a] Ikpe ha kemgbe ochie anaghị egbu oge, mbibi ha anaghịkwa arahụ ụra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha ga-eji unu mee azụmahịa”—okwu Grik ahụ ji ihe atụ azụmahịa kọwaa irite uru site n’iji ndị mmadụ eme ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: N’ihi anyaukwu ha
  rationale: Nke a na-egosi anyaukwu dị ka ihe na-akpali ndị ozizi ụgha ime ihe ha na-eme, ma na-edobe ike omume ọjọọ dị n’okwu Grik ahụ.
- source_word: πλαστοῖς λόγοις
  choice: jiri okwu ndị ha chepụtara
  rationale: Nke a na-egosi na okwu ahụ abụghị naanị okwu ụgha, kama na ọ bụ okwu a kpachapụrụ anya chepụta ma hazie iji duhie mmadụ.
- source_word: ἐμπορεύσονται
  choice: ha ga-erigbu unu
  rationale: ‘Erigbu’ na-akọwa n’Igbo nke oge a otu ha si eji ndị mmadụ achọ uru nke onwe ha. Ihe atụ azụmahịa dị n’okwu Grik ahụ ka akọwara n’ala ala peeji.
- source_word: κρίμα
  choice: Ikpe dịịrị ha
  rationale: ‘Ikpe’ na-edobe echiche nke mkpebi ikpe megide ha n’ebughị ụzọ kọwaa kpọmkwem ụdị ntaramahụhụ ahụ.
- source_word: ἔκπαλαι
  choice: kemgbe ogologo oge gara aga
  rationale: Nke a na-egosipụta na ikpe ahụ adịlarị kemgbe oge dị anya, dịka okwu Grik si kwusi ike.
- source_word: οὐκ ἀργεῖ
  choice: adịghị anọ nkịtị
  rationale: Nsụgharị a na-edobe ihe atụ nke ikpe na-adịghị arụghị ọrụ ma ọ bụ ghara imezu ihe ọ ga-eme, kama ịgbanwe ya naanị ka ọ bụrụ ‘anaghị egbu oge.’
- source_word: ἀπώλεια
  choice: mbibi
  rationale: ‘Mbibi’ bụ okwu doro anya nke na-egosi ịla n’iyi ma ọ bụ mmebi zuru oke, ma ọ naghị atụkwasị nkọwa ozizi nke amaokwu ahụ ekwughị.
- source_word: οὐ νυστάζει
  choice: adịghịkwa arahụ ụra
  rationale: 'Nke a na-edobe mmemmadụ doro anya dị n’okwu Grik ahụ: e sere mbibi ha dịka ihe na-adịghị arahụ ụra ma ọ bụ na-adịghị abịa.'
theological_decisions:
- issue: Ụdị ntaramahụhụ a mara ọkwa ya
  choice: E gosipụtara ya dịka ikpe na mbibi na-abịanụ nke doro anya, n’enweghị ịkọwapụta usoro ozizi pụrụ iche.
  alternative: Ịkọwa ‘mbibi’ kpọmkwem dịka ikpochapụ ịdị adị kpamkpam, ma ọ bụ naanị dịka mmebi na-abụghị ikpe ikpeazụ.
  rationale: Amaokwu ahụ na-ekwusi ike na ikpe na mbibi nke ndị ozizi ụgha ga-emezu, ma ọ naghị akọwa otú ntaramahụhụ ahụ ga-adị ma ọ bụ ogologo oge ọ ga-adị. Ya mere, nsụgharị ahụ na-edobe ịdọ aka ná ntị na esemokwu nkà mmụta okpukpe dị n’ederede ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta. A hapụrụ mmemmadụ ndị dị na ‘ikpe adịghị anọ nkịtị’ na ‘mbibi adịghị arahụ ụra’ ka ike na ọdịdị okwu Grik ahụ ghara ịla n’iyi.
