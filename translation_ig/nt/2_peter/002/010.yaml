id: 2PE.2.10
reference: 2 Peter 2:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταί, αὐθάδεις, δόξας οὐ τρέμουσιν, βλασφημοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/010.yaml
  text: especially those who go after the flesh in the desire for defilement and despise authority[a]. Bold, self-willed, they do not tremble as they blaspheme glorious ones[d][c][b],
translation:
  language: ig
  text: karịsịa ndị na-eso anụ ahụ n'agụụ nke mmetọ ma na-eleda ọchịchị[a] anya. Ha bụ ndị anya siri ike, ndị isi ike; ha anaghị ama jijiji mgbe ha na-ekwujọ ndị dị ebube.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-eleda ịbụ onyenwe anya,” ma ọ bụ, “na-eleda ọchịchị anya.”
    reason: lexical_alternative
  - marker: b
    text: “Ndị dị ebube” nwere ike ịbụ ndị dị ebube nke eluigwe, ikekwe ndị mmụọ ozi.
    reason: alternative_reading
lexical_decisions:
- source_word: μάλιστα
  choice: karịsịa
  rationale: Na-egosi nkwusie ike pụrụ iche n'etiti ndị a ga-ekpe ikpe.
- source_word: ὀπίσω σαρκὸς
  choice: na-eso anụahụ
  rationale: Na-echekwa ihe atụ Grik nke iso anụahụ, kama ịkọwa ya ozugbo dị ka ‘ọdịdị mmehie.’
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: n'ọchịchọ nke adịghị ọcha
  rationale: Na-egosi ọchịchọ rụrụ arụ ma na-echekwa echiche nke mmetọ omume dị na μιασμός.
- source_word: κυριότητος
  choice: ịchịisi
  rationale: Na-ahapụ onye ma ọ bụ ihe okwu ahụ na-ezo aka na ya ghe oghe; ọ pụrụ ịpụta ikike, ịbụ onyenwe, ma ọ bụ ọchịchị.
- source_word: καταφρονοῦντας
  choice: na-eleda ... anya
  rationale: Ọ bụ ụzọ Igbo kwụ ọtọ ma sie ike isi kwuo nlelị.
- source_word: Τολμηταί
  choice: ndị anya siri ike
  rationale: N'ọnọdụ a ọ na-egosi nkwuwa okwu na-enweghị egwu nke jọgburu onwe ya, ọ bụghị obi ike kwesịrị otuto.
- source_word: αὐθάδεις
  choice: ndị isiike
  rationale: Na-egosi ndị na-eme naanị uche nke onwe ha ma na-ajụ ịchịkwa onwe ha.
- source_word: δόξας
  choice: ndị dị ebube
  rationale: Na-echekwa ọtụtụ mmadụ/ndị nwere ebube n'okwu Grik, na-akọwaghị ha kpọmkwem dị ka ndị mmụọ ozi.
- source_word: οὐ τρέμουσιν, βλασφημοῦντες
  choice: ha adịghị ama jijiji mgbe ha na-ekwujọ
  rationale: Na-echekwa ihe oyiyi nke ịma jijiji n'ihi egwu na njikọ nke participle ahụ na omume ikwujọ.
theological_decisions:
- issue: Ihe κυριότητος na-ezo aka na ya
  choice: ịchịisi, na-akọwaghị onye nwe ya
  alternative: ịbụ onyenwe; ọchịchị; ịbụ Onyenwe Kraịst
  rationale: Okwu Grik ahụ anaghị ekpebi n'ụzọ doro anya ma ọ bụ ikike n'ozuzu ya, ịbụ onyenwe, ma ọ bụ otu ọchịchị eluigwe; ya mere, e kwesịghị ịmanye nkọwa otu ozizi n'ime isiokwu ahụ.
- issue: Ndị δόξας na-ezo aka na ha
  choice: ndị dị ebube
  alternative: ndị mmụọ ozi; ndị dị ebube nke eluigwe; ebube dị iche iche
  rationale: Amaokwu na-esote na-akwado na ọ pụrụ ịbụ ndị nke eluigwe, ma δόξας n'onwe ya anaghị akpọ ha ndị mmụọ ozi; nsụgharị bụ isi na-echekwa nghọtahie a.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma nwee ugwu. E ji ahịrịokwu dị mkpirikpi ‘Ha bụ ndị anya siri ike, ndị isiike’ chekwaa ụda ebubo mberede nke Grik. E tinyere akara ntụaka ukwu abụọ niile n'isiokwu.
