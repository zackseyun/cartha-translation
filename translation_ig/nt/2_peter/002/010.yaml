- from: karịsịa ndị na-eso anụahụ n'ọchịchọ nke adịghị ọcha ma na-eleda ịchịisi anya.[a] Ha bụ ndị anya siri ike, ndị isiike; ha adịghị ama jijiji mgbe ha na-ekwujọ ndị dị ebube.[b]
  to: karịsịa ndị na-eso anụ ahụ n'agụụ nke mmetọ ma na-eleda ọchịchị[a] anya. Ha bụ ndị anya siri ike, ndị isi ike; ha anaghị ama jijiji mgbe ha na-ekwujọ ndị dị ebube.[b]
