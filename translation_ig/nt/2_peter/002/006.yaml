review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the conditional continuation, the implicit subject, the reduction of Sodom and Gomorrah to ashes, judicial condemnation to destruction, and their being set as an example. The plural πόλεις is clearer when Sodom and Gomorrah are explicitly identified as two cities. The future-oriented dative phrase is better rendered as people who will live without reverence for God, rather than the awkward literal construction ‘those who will be people who do not revere God.’
  naturalness: ‘Obodo abụọ ahụ, bụ Sọdọm na Gọmọra’ is clear, idiomatic Standard Igbo and unambiguously preserves the two cities. ‘Ndị ga-adị ndụ n’enweghị nsọpụrụ Chineke’ is natural modern Igbo and expresses the religious-ethical force of ἀσεβέσιν without importing a doctrinal interpretation.
  terminology: ‘Ntú,’ ‘maa ha ikpe mbibi,’ and ‘ihe atụ’ suitably render τεφρώσας, καταστροφῇ κατέκρινεν, and ὑπόδειγμα. ‘Enweghị nsọpụrụ Chineke’ preserves the impiety/reverence dimension of ἀσεβέσιν better than a merely general term for wrongdoing.
  issues:
  - severity: low
    issue: The phrase ‘obodo Sọdọm na Gọmọra’ does not explicitly signal the Greek plural ‘cities.’
    rationale: Although understandable, explicitly calling them ‘the two cities’ prevents a possible singular or appositional reading and reflects πόλεις.
  - severity: medium
    issue: ‘Ndị ga-abụ ndị na-adịghị asọpụrụ Chineke’ is syntactically heavy and may suggest becoming such people rather than future people characterized by impiety.
    rationale: The Greek denotes those who are/will be ungodly in the future, not necessarily a transition into that status. A natural Igbo verbal expression retains the future reference and religious sense.
  revised_text: ọ bụrụkwa na o mere obodo abụọ ahụ, bụ Sọdọm na Gọmọra, ka ha ghọọ ntụ[a], si otú ahụ maa ha ikpe mbibi, ma mee ha ihe atụ nye ndị ga-adị ndụ n’enweghị nsọpụrụ Chineke[b],
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “o mere ha ka ha ghọọ ntụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nye ndị na-adịghị asọpụrụ Chineke n’ọdịnihu.”
    reason: lexical_alternative
  revision_rationale: The revision clarifies the plural reference to the two named cities and replaces an awkward, potentially overly dynamic future expression with idiomatic Standard Igbo that retains the source’s future orientation and the religious force of ‘ungodly.’ The conditional structure, implicit subject, judicial register, and footnote anchors are retained.
