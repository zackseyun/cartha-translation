  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: ig
  text: ọ bụrụkwa na o mere obodo abụọ ahụ, bụ Sọdọm na Gọmọra, ka ha ghọọ ntụ[a], si otú ahụ maa ha ikpe mbibi, ma mee ha ihe atụ nye ndị ga-adị ndụ n’enweghị nsọpụrụ Chineke[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “o mere ha ka ha ghọọ ntụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nye ndị na-adịghị asọpụrụ Chineke n’ọdịnihu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεφρώσας
  choice: mere ... ka ha ghọọ ntụ
  rationale: Nke a na-egosi nsonaazụ kpọmkwem nke τεφρόω—ime ka ihe ghọọ ntụ—ọ bụghị naanị ịkpọ ya ọkụ.
- source_word: καταστροφῇ κατέκρινεν
  choice: maa ha ikpe mbibi
  rationale: Nkebi a na-ejigide ma echiche ikpe dị na κατέκρινεν ma nsonaazụ mbibi dị na καταστροφῇ, n’Igbo doro anya ma dịkwa mfe.
- source_word: ὑπόδειγμα
  choice: ihe atụ
  rationale: “Ihe atụ” na-anọ nso n’ụzọ sara mbara ὑπόδειγμα si pụta; ọnọdụ ikpe a na-eme ka ọrụ ịdọ aka ná ntị ya doo anya n’enweghị ịgbakwụnye nkọwa n’ahịrịokwu ahụ.
- source_word: μελλόντων ἀσεβέσιν
  choice: nye ndị ga-abụ ndị na-adịghị asọpụrụ Chineke
  rationale: “Ga-abụ” na-egosi ọdịnihu dị na μελλόντων, ebe “ndị na-adịghị asọpụrụ Chineke” na-ezipụta echiche omume na okpukpe dị na ἀσεβέσιν n’asụsụ Igbo a na-aghọta ngwa ngwa.
- source_word: τεθεικώς
  choice: mee ha ka ha bụrụ
  rationale: Nhọrọ a na-egosi na e debere obodo ndị ahụ n’ọnọdụ ga-adịgide dị ka ihe atụ, nke kwekọrọ n’ụdị perfect participle.
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: obodo Sọdọm na Gọmọra
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si akpọ obodo abụọ ahụ ma na-edebe aha ha site na ntụgharị mkpụrụokwu.
theological_decisions:
- issue: Onye a na-ekwughị aha ya nke na-eme ihe ahụ
  choice: o
  alternative: Chineke; Onyenwe anyị
  rationale: Isiokwu ahụ na-aga n’ihu n’usoro ikpe Chineke ndị e kwuru n’amaokwu ndị bu ụzọ. Ịsụgharị ya “o” na-edebe usoro Grik ma ghara itinye aha ma ọ bụ utu aha na-adịghị na nkebi a.
- issue: Ihe ἀσεβέσιν pụtara
  choice: ndị na-adịghị asọpụrụ Chineke
  alternative: ndị ajọ omume; ndị na-adịghị atụ egwu Chineke
  rationale: Nhọrọ a na-edebe akụkụ okpukpe nke okwu ahụ ma ghara ime ka ọ bụrụ naanị ajọ omume n’ozuzu ma ọ bụ tinye echiche “egwu” nke okwu Grik ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere “ọ bụrụkwa na” n’isi iji gosi na amaokwu a bụ akụkụ nke usoro ọnọdụ malitere n’amaokwu ndị bu ya ụzọ; e jighị aha Chineke dochie nnọchiaha nke isi mmalite hapụrụ ka a ghọta ya site n’ọnọdụ okwu.
