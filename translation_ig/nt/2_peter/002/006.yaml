revisions:
- from: ọ bụrụkwa na o mere obodo Sọdọm na Gọmọra ka ha ghọọ ntụ[a], si otú ahụ maa ha ikpe mbibi, ma mee ha ka ha bụrụ ihe atụ nye ndị ga-abụ ndị na-adịghị asọpụrụ Chineke[b],
  to: ọ bụrụkwa na o mere obodo abụọ ahụ, bụ Sọdọm na Gọmọra, ka ha ghọọ ntụ[a], si otú ahụ maa ha ikpe mbibi, ma mee ha ihe atụ nye ndị ga-adị ndụ n’enweghị nsọpụrụ Chineke[b],
  rationale: The revision clarifies the plural reference to the two named cities and replaces an awkward, potentially overly dynamic future expression with idiomatic Standard Igbo that retains the source’s future orientation and the religious force of ‘ungodly.’ The conditional structure, implicit subject, judicial register, and footnote anchors are retained.
