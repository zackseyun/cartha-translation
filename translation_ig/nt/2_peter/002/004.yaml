id: 2PE.2.4
reference: 2 Peter 2:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
translation:
  language: ig
  text: N’ihi na ọ bụrụ na Chineke emerụghị ndị mmụọ ozi ebere mgbe ha mere mmehie, kama ọ tụbara ha na Tatarọs[a] ma nyefee ha n’agbụ nke ọchịchịrị, ka e debe ha maka ikpe[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ọ tụbara ha n’ọkụ mmụọ.” Ngwaa Grik a pụtara kpọmkwem itinye mmadụ na Tatarọs; ya mere, ahịrịokwu bụ isi na-edobe aha ahụ.'
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie nwere “olulu nke ọchịchịrị” kama “agbụ nke ọchịchịrị.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐφείσατο
  choice: emereghị ... ebere
  rationale: N’ọnọdụ ikpe na ntaramahụhụ, nke a na-egosi na Chineke ahapụghị ha n’enweghị ntaramahụhụ; okwu Igbo a dị mfe ma na-edobe echiche nke ịghara imere ha ebere.
- source_word: ἀγγέλων ἁμαρτησάντων
  choice: ndị mmụọ ozi ... mgbe ha mere mmehie
  rationale: Nkebiokwu oge a na-egosipụta omume nke participle aorist ahụ n’Igbo nkịtị ma doo anya.
- source_word: σειραῖς ζόφου
  choice: n’agbụ nke ọchịchịrị gbara ọchịchịrị
  rationale: “Agbụ” na-edobe σειραῖς, ebe nkọwa nke ọchịchịrị na-anwa igosipụta ọchịchịrị dị arọ na nke na-atụ ụjọ nke ζόφος.
- source_word: ταρταρώσας
  choice: ọ tụbara ha na Tatọrọs
  rationale: A hapụrụ aha pụrụ iche nke sitere na ngwaa Greek ahụ kama iji okwu sara mbara dịka ala mmụọ, ka nkọwa pụrụ iche nke isi mmalite ghara ịla n’iyi.
- source_word: παρέδωκεν
  choice: nyefee ha
  rationale: Nke a na-egosi inyefe ha n’aka njide ma dabara na ọnọdụ ikpe nke ahịrịokwu ahụ.
- source_word: εἰς κρίσιν
  choice: ruo mgbe ikpe ga-abịa
  rationale: Nke a na-egosi na a na-edebe ha maka ikpe dị n’ihu, n’emeghị κρίσις ka ọ bụrụ naanị ikpe ọmụma.
- source_word: τηρουμένους
  choice: ka e debe ha
  rationale: Nke a na-edobe ọnọdụ passive na echiche nke njide na-aga n’ihu ruo n’ikpe.
theological_decisions:
- issue: Otu e si sụgharịta ταρταρώσας n’etinyeghị nkọwa ozizi e mesịrị karịa okwu Greek ahụ
  choice: ọ tụbara ha na Tatọrọs
  alternative: ọ tụbara ha n’ala mmụọ
  rationale: Ngwaa ταρταρόω na-ezo kpọmkwem na Tatọrọs. Idebe aha ahụ na-echekwa ihe oyiyi pụrụ iche nke ederede ma zere ime ka ọ bụrụ okwu ozizi sara mbara.
- issue: Mmekọrịta dị n’etiti Tatọrọs, agbụ nke ọchịchịrị, na τηρουμένους
  choice: ọ tụbara ha na Tatọrọs, nyefee ha n’agbụ nke ọchịchịrị gbara ọchịchịrị, ka e debe ha ruo mgbe ikpe ga-abịa
  alternative: ọ tụbara ha na Tatọrọs n’agbụ nke ọchịchịrị, ebe a na-edebe ha maka ikpe
  rationale: Nhọrọ a na-edobe ihe niile dị na Greek n’enweghị ikpebi ma agbụ ahụ bụ ngwá njide, ọnọdụ, ma ọ bụ ihe atụ.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugwu ma dị mfe nghọta mee ihe. “Tatọrọs” bụ ntụgharị mkpụrụokwu nke aha pụrụ iche ahụ; nkọwa ya dị n’okpuru peeji. Ahịrịokwu ahụ na-edobe nhazi ọnọdụ nke malitere na “ọ bụrụ na,” n’ihi na amaokwu a bụ akụkụ nke ahịrịokwu buru ibu.
