review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the conditional syntax, God’s refusal to spare sinful angels, Tartarus imagery, confinement, and future judgment. However, “ruo mgbe ikpe ga-abịa” adds the event of judgment’s arrival and shifts εἰς κρίσιν from ‘for judgment’ to a temporal endpoint. The revised wording renders this simply as “maka ikpe.”
  naturalness: 'Several expressions need smoothing for Standard Igbo: “emereghị ... ebere” is less idiomatic than “emerụghị ... ebere”; the coordinated past verb requires “nyefere”; and “ọchịchịrị gbara ọchịchịrị” is an unnatural tautology. “agbụ nke ọchịchịrị” is clear, weighty, and natural.'
  terminology: “Tatarọs” preserves the specific force of ταρταρώσας better than a generalized term for hell. “ndị mmụọ ozi,” “agbụ,” “ọchịchịrị,” and “ikpe” are appropriate standard theological and judicial terms. The lexical footnote’s alternative is adjusted to “ọkụ mmụọ,” which corresponds to the English audit trail’s ‘hell’ alternative while the main text retains Tatarọs.
  issues:
  - severity: medium
    issue: The phrase “ruo mgbe ikpe ga-abịa” over-specifies εἰς κρίσιν.
    rationale: The Greek says that they are being kept ‘for judgment’; it does not explicitly say ‘until judgment comes.’ “maka ikpe” preserves the intended purpose/goal without adding temporal wording.
  - severity: medium
    issue: “n’agbụ nke ọchịchịrị gbara ọchịchịrị” is tautological and stylistically unnatural.
    rationale: The repetition does not naturally convey ζόφος in Standard Igbo. “n’agbụ nke ọchịchịrị” faithfully retains the dark-confinement imagery without redundancy.
  - severity: low
    issue: The past-tense coordination in “ọ tụbara ... nyefee” is irregular.
    rationale: “nyefere” supplies the required completed-action form and makes the coordination fluent.
  - severity: low
    issue: The transliteration “Tatọrọs” is less close to the Greek/established international form than “Tatarọs.”
    rationale: “Tatarọs” more transparently represents Τάρταρος while remaining pronounceable in Standard Igbo.
  revised_text: N’ihi na ọ bụrụ na Chineke emerụghị ndị mmụọ ozi ebere mgbe ha mere mmehie, kama ọ tụbara ha na Tatarọs[a] ma nyefee ha n’agbụ nke ọchịchịrị, ka e debe ha maka ikpe[b],
