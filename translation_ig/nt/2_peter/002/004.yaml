revisions:
- from: N’ihi na ọ bụrụ na Chineke emereghị ndị mmụọ ozi ebere mgbe ha mere mmehie, kama ọ tụbara ha na Tatọrọs[a], nyefee ha n’agbụ nke ọchịchịrị gbara ọchịchịrị, ka e debe ha ruo mgbe ikpe ga-abịa[b],
  to: N’ihi na ọ bụrụ na Chineke emerụghị ndị mmụọ ozi ebere mgbe ha mere mmehie, kama ọ tụbara ha na Tatarọs[a] ma nyefee ha n’agbụ nke ọchịchịrị, ka e debe ha maka ikpe[b],
  rationale: The revision corrects idiom and verbal morphology, removes the redundant intensifier for darkness, and renders εἰς κρίσιν without added temporal content. It retains the Greek text’s compressed imagery and does not settle whether the chains are literal, metaphorical, instrumental, or locative. Both footnote anchors remain attached to their proper terms.
