language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: ig
  text: N’ihi na ọ gaara akara ha mma ka ha ghara ịma ụzọ ezi omume[a], karịa ka, mgbe ha matasịrị ya, ha tụgharịa azụ[b] pụọ n’iwu dị nsọ ahụ e nyefere ha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “okporo ụzọ ezi omume.” Okwu Grik δικαιοσύνη nwekwara ike ịpụta “ikpe ziri ezi,” ma “ezi omume” kacha daba n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ịlaghachi” ma ọ bụ “ịtụgharị pụọ.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “e bufere ha” ma ọ bụ “e nyefere ha n’aka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον γὰρ ἦν αὐτοῖς
  choice: N’ihi na ọ gaara akara ha mma
  rationale: Nke a na-egosipụta ma njikọ nkọwa nke γὰρ ma echiche ntụnyere nke ihe gaara adịrị ha mma karịa, n’Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa.
- source_word: ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: ha amataghị / ha matara ya
  rationale: E ji otu mgbọrọgwụ okwu Igbo mee ugboro abụọ iji chekwaa nkwughachi dị na Grik. ‘Ịmata’ anaghị ebuli echiche ahụ ruo n’ịmata nke zuru oke karịa ihe amaokwu ahụ kwuru.
- source_word: ὁδὸν τῆς δικαιοσύνης
  choice: ụzọ ezi omume
  rationale: ‘Ụzọ’ na-egosipụta ụzọ ndụ ma ọ bụ usoro mmadụ na-eso; ‘ezi omume’ dabara n’echiche omume ziri ezi n’ebe Chineke nọ n’ebe a.
- source_word: ὑποστρέψαι ἐκ
  choice: tụgharịa azụ pụọ n’
  rationale: ‘Tụgharịa azụ’ na-echekwa echiche nke ịlaghachi n’azụ, ebe ‘pụọ n’…’ na-egosipụta nkewa nke ἐκ.
- source_word: παραδοθείσης αὐτοῖς
  choice: e nyefere ha
  rationale: ‘E nyefere ha’ na-egosipụta na e nyere ma ọ bụ bufere iwu ahụ ruo ha, n’etinyeghị echiche ọzọ nke ilekọta ihe e nyere n’aka.
- source_word: ἁγίας ἐντολῆς
  choice: iwu dị nsọ
  rationale: A hapụrụ ‘iwu’ n’otu mkpụrụ dịka Grik si dị, ‘dị nsọ’ na-echekwakwa ịdị nsọ na ibu okpukpe nke okwu ahụ.
theological_decisions:
- issue: Ma ntụgharị ahụ ò kwesịrị ikpebi esemokwu banyere ịdapụ n’okwukwe ma ọ bụ nanị nkwupụta okwukwe na-abụghị eziokwu
  choice: Kwuo na ha matara ụzọ ezi omume ma mesịa tụgharịa azụ pụọ n’iwu ahụ, n’enweghị ịkọwa ọnọdụ nzọpụta ha karịa ihe ederede kwuru.
  alternative: Iji okwu ndị ga-egosi kpọmkwem na ha tufuru nzọpụta, ma ọ bụ okwu ndị ga-eme ka ịmata ha bụrụ nanị ịnụ ihe n’elu elu.
  rationale: Grik na-ekwu maka ezigbo ịmata na ntụgharị azụ, ma ọ naghị edozi n’onwe ya esemokwu ụka niile gbasara ntachi obi ma ọ bụ ịdapụ n’okwukwe. Ya mere, a chekwara mgbagwoju anya na nrụgide nkà mmụta okpukpe dị n’ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-echekwa ntụnyere siri ike nke amaokwu ahụ, nkwughachi nke ‘ịmata,’ na mmegharị nke ‘ịtụgharị azụ,’ n’enweghị itinye ozizi otu ụka.
