review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse's future force, plural subject, causal clause, and passive verb. However, “ga-esokwa ha n'omume ihere ha” introduces an explicit personal object (“them”) where the Greek directly says that many will follow the false teachers' shameless practices. Rendering the practices as the direct object more closely reflects αὐτῶν ταῖς ἀσελγείαις.
  naturalness: “Ọtụtụ ga-agbaso omume rụrụ arụ ha” is a more natural Standard Igbo expression than “ga-esokwa ha n'omume ihere ha.” The impersonal passive construction “a ga-ekwulu” is natural here.
  terminology: “Omume rụrụ arụ” suitably conveys ἀσέλγειαι as shameless, morally unrestrained conduct, without limiting it solely to sexual conduct. “Ụzọ nke eziokwu” and “a ga-ekwulu” retain the metaphor and the serious abusive-speech sense of the Greek.
  issues:
  - severity: medium
    issue: The first clause adds “ha” as the direct object of following.
    rationale: ἐξακολουθήσουσιν governs “their shameless practices” (αὐτῶν ταῖς ἀσελγείαις), not explicitly the persons themselves. Recasting the practices as the direct object is both closer to the source and clearer in Igbo.
  - severity: low
    issue: “Omume ihere” is weaker and less idiomatic for ἀσέλγεια in this context.
    rationale: It can mean simply shameful behavior, whereas the Greek emphasizes shameless, unrestrained conduct. “Omume rụrụ arụ” better communicates the vice term while retaining breadth.
  - severity: low
    issue: Footnote c is anchored after the sentence rather than at the translated verb.
    rationale: Its alternatives explain βλασφημηθήσεται / “a ga-ekwulu”; placing the marker immediately after that verb makes the anchor unambiguous.
