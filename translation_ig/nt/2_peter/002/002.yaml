base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
translation:
  language: ig
  text: Ọtụtụ ga-agbaso omume rụrụ arụ ha[a], n'ihi ha kwa, a ga-ekwulu ụzọ nke eziokwu[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “omume enweghị njide,” “omume ihere,” ma ọ bụ “omume agụụ mmekọahụ na-enweghị ihere.” Okwu Grik ahụ na-egosi omume enweghị ihere na-enweghị njide, nke na-enwekarị akụkụ mmekọahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ụzọ eziokwu.” O yikarịrị ka okwu a na-ezo aka n'okwukwe Ndị Kraịst na ụzọ ndụ kwekọrọ n'eziokwu.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “a ga-ekwujọ” ma ọ bụ “a ga-ekwu okwu megide.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Ọtụtụ mmadụ
  rationale: Nke a bụ okwu Igbo doro anya nke na-egosi ọnụ ọgụgụ buru ibu ma na-edobe ike nke πολλοί.
- source_word: ἐξακολουθήσουσιν
  choice: ga-esokwa
  rationale: Ọ na-egosi iso ndị ahụ n'ụzọ ha ma na-edobe ọdịnihu nke ngwaa Grik.
- source_word: αὐτῶν ταῖς ἀσελγείαις
  choice: ha n'omume ihere ha
  rationale: ἀσέλγεια na-ezo aka n'omume ihere na-enweghị njide, nke na-enwekarị akụkụ mmekọahụ; 'omume ihere' bụ okwu dị mfe ma ghara ime ka ihe ọ pụtara bụrụ naanị mmehie mmekọahụ.
- source_word: δι’ οὓς
  choice: n'ihi ha
  rationale: διά na accusative ebe a na-egosi ihe kpatara ya; okwu a na-ezo aka n'ìgwè mmadụ ndị a kpọtụrụ aha.
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: ụzọ nke eziokwu
  rationale: Nsụgharị a na-edobe ihe atụ nke 'ụzọ' na njikọ genitive dị na Grik, ma kwe ka ọ na-ezo aka n'okwukwe na ndụ Ndị Kraịst.
- source_word: βλασφημηθήσεται
  choice: a ga-ekwulu
  rationale: Okwu a na-egosi ikwu okwu mkparị megide ihe a na-ewere dị nsọ ma ọ bụ ezi; ọ dị ike karịa nanị ịkatọ.
theological_decisions:
- issue: Ihe 'ụzọ nke eziokwu' na-ezo aka na ya
  choice: Edobere ya dịka 'ụzọ nke eziokwu,' nke nwere ike ịpụta okwukwe eziokwu na ụzọ ndụ kwekọrọ na ya.
  alternative: “ụzọ eziokwu” ma ọ bụ “ezi ụzọ”
  rationale: Nsụgharị a na-edobe ihe atụ na ibu okwu ahụ n'usoro Grik, n'emeghị ka ọ bụrụ naanị ozizi ma ọ bụ naanị omume.
- issue: Oke ihe ἀσέλγεια pụtara
  choice: “omume ihere”
  alternative: “omume rụrụ arụ,” “ndụ ịkwa iko,” ma ọ bụ “omume enweghị njide”
  rationale: Okwu Grik ahụ gụnyere omume enweghị ihere na enweghị njide, mgbe mgbe n'ihe metụtara mmekọahụ, ma ọ bụghị mgbe niile naanị nke ahụ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. 'Omume ihere' na-edobe obosara nke okwu mmehie Grik; 'ụzọ nke eziokwu' na-edobe ihe atụ na mgbagwoju anya nke nkebiokwu ahụ. E debere akara nkọwa ụkwụ niile n'ahịrị isi.
