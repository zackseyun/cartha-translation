revisions:
- from: Ọtụtụ mmadụ ga-esokwa ha n'omume ihere ha[a], n'ihi ha kwa, a ga-ekwulu ụzọ nke eziokwu[b].[c]
  to: Ọtụtụ ga-agbaso omume rụrụ arụ ha[a], n'ihi ha kwa, a ga-ekwulu ụzọ nke eziokwu[b][c].
  rationale: The revision makes “omume rụrụ arụ ha” the object of “ga-agbaso,” aligning the Igbo syntax with the Greek construction and avoiding the added sense that the people themselves are directly followed. It strengthens the rendering of ἀσέλγεια without imposing a narrow interpretation and relocates footnote c to its proper lexical anchor. The sequence of the b and c markers reflects their respective preceding expressions.
