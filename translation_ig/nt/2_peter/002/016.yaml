id: 2PE.2.16
reference: 2 Peter 2:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: ig
  text: 'Ma a baara ya mba n’ihi mmebi iwu nke aka ya: anụ na-ebu ibu nke na-adịghị ekwu okwu[a], nke ji olu mmadụ[b] kwuo okwu, gbochiri ara onye amụma ahụ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “anụ ibu”; nke a na-ezo aka n’ịnyịnya ibu Belam (Ọnụ Ọgụgụ 22:28–30).
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “n’olu nwoke.” O yikarịrị ka okwu Grik ahụ pụtara “n’olu mmadụ,” na-egosi ọdịiche dị n’etiti anụmanụ ahụ na mmadụ na-ekwu okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν
  choice: a baara ya mba
  rationale: Nkebi okwu a na-egosi ịdọ aka ná ntị ma ọ bụ ịkatọ mmadụ n’ihi ihe ọjọọ o mere; ọ bụkwa okwu Igbo doro anya ma kwekọọ n’akụkọ a.
- source_word: ἰδίας παρανομίας
  choice: n’ihi mmebi iwu nke aka ya
  rationale: “Mmebi iwu” na-echekwa echiche nke ime ihe megidere iwu, ebe “nke aka ya” na-emesi ibu ọrụ nke onye ahụ n’onwe ya ike.
- source_word: ὑποζύγιον
  choice: anụ ibu
  rationale: Okwu Grik ahụ pụtara anụmanụ a na-ebu ibu ma ọ bụ nke dị n’okpuru yoke; nsụgharị a echekwaghị ịkpọ ya ịnyịnya ibu kpọmkwem n’ahịrị bụ isi.
- source_word: ἄφωνον
  choice: nke na-adịghị ekwu okwu
  rationale: Nke a na-egosi na anụmanụ ahụ enweghị ike ikwu okwu, ma na-eme ka ihe ịtụnanya nke okwu ya pụta ìhè n’Igbo nkịtị.
- source_word: ἐν ἀνθρώπου φωνῇ
  choice: n’olu mmadụ
  rationale: Nkebi a na-egosi olu mmadụ n’ozuzu ya, ọ bụghị olu nwoke kpọmkwem, ma na-emegide anụmanụ na mmadụ.
- source_word: φθεγξάμενον
  choice: kwuru okwu
  rationale: Ọ na-ezo aka n’okwu a pụrụ ịghọta, ọ bụghị naanị ụda anụmanụ.
- source_word: ἐκώλυσεν
  choice: wee kwụsị
  rationale: N’ebe a, ngwaa ahụ na-egosi igbochi ma ọ bụ ịkwụsị ụzọ nzuzu onye amụma ahụ.
- source_word: παραφρονίαν
  choice: ara
  rationale: “Ara” na-echekwa ike okwu Grik nke na-egosi omume na-enweghị ezi uche karịa naanị nzuzu dị mfe.
- source_word: τοῦ προφήτου
  choice: onye amụma ahụ
  rationale: Ọ na-echekwa aha ọrụ e nyere Belam n’ahịrị Grik, n’agbanyeghị na amaokwu ahụ na-akatọ omume ya.
theological_decisions:
- issue: Ma a ga-akpọ ὑποζύγιον “ịnyịnya ibu” kpọmkwem site n’akụkọ Belam
  choice: anụ ibu
  alternative: ịnyịnya ibu
  rationale: Ọnụ Ọgụgụ 22 na-eme ka o doo anya na ọ bụ ịnyịnya ibu Belam, ma okwu Grik n’amaokwu a bụ okwu sara mbara maka anụ ibu. Ya mere, isi ederede na-echekwa ịdị sara mbara ahụ, ebe nkọwa ala peeji na-akọwa anụmanụ a kpọmkwem.
- issue: Otú e si sụgharịa ἀνθρώπου n’ime ἐν ἀνθρώπου φωνῇ
  choice: mmadụ
  alternative: nwoke
  rationale: Esemokwu dị ebe a bụ n’etiti olu anụmanụ na olu mmadụ, ọ bụghị n’etiti nwoke na nwanyị; “mmadụ” na-egosipụta ebumnuche isi iyi nke ọma.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ ahịrịokwu “anụ ibu nke na-adịghị ekwu okwu” kama okwu teknụzụ siri ike, ma debe akara nkọwa [a] na [b] kpọmkwem n’isi ederede.
