revisions:
- from: 'Ma a baara ya mba n’ihi mmebi iwu nke aka ya: anụ ibu nke na-adịghị ekwu okwu[a], kwuru okwu n’olu mmadụ[b], wee kwụsị ara onye amụma ahụ.'
  to: 'Ma a baara ya mba n’ihi mmebi iwu nke aka ya: anụ na-ebu ibu nke na-adịghị ekwu okwu[a], nke ji olu mmadụ[b] kwuo okwu, gbochiri ara onye amụma ahụ.'
  rationale: The revision retains the draft’s faithful choices for rebuke, personal lawlessness, human voice, and the prophet’s madness. It improves the generic animal expression, renders κωλύω more accurately as “gbochiri,” and corrects the lexical alternative and wording of footnote b.
