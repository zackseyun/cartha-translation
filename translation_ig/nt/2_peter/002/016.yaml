    text: Ma ọ bụ, “n’olu nwoke.” O yikarịrị ka okwu Grik ahụ pụtara “n’olu mmadụ,” na-egosi ọdịiche dị n’etiti anụmanụ ahụ na mmadụ na-ekwu okwu.
    reason: lexical_alternative
