id: 2PE.2.8
reference: 2 Peter 2:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: βλέμματι γὰρ καὶ ἀκοῇ ⸀ὁ δίκαιος ἐγκατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/008.yaml
  text: for by what he saw and heard[a], that righteous man, living among them[c][b], was tormenting his righteous soul day after day with their lawless deeds—
translation:
  language: ig
  text: N’ihi na, site n’ihe ọ hụrụ ma nụ[a], onye ezi omume ahụ, ebe ọ bi n’etiti ha[c], nọ na-ata mkpụrụ obi ya nke ezi omume ahụhụ kwa ụbọchị site n’ọrụ ha ndị megidere iwu[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ile anya na ịnụ ihe.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye ezi omume ahụ nọ na-ata onwe ya ahụhụ n’ime mkpụrụ obi ya nke ezi omume n’ọrụ ndị megidere iwu ndị ọ hụrụ ma nụ.” Nhazi okwu Grik na-etinye “site n’ile anya na ịnụ ihe” n’ihu, ma tinye “ọrụ ndị megidere iwu” n’azụ; n’ihi ya, ụzọ e si ejikọta okwu ndị a kpọmkwem nwere ike ịdị iche.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “N’ihi na, ebe onye ezi omume ahụ bi n’etiti ha, ọ nọ na-ata mkpụrụ obi ya ahụhụ kwa ụbọchị.”
    reason: previous_rendering
lexical_decisions:
- source_word: βλέμματι καὶ ἀκοῇ
  choice: ihe ... hụrụ ma nụ
  rationale: Ọnọdụ dative abụọ a na-egosi ihe o ji ahụ ma nụ, ma nsụgharị a bụ Igbo dị mfe ma doo anya.
- source_word: ὁ δίκαιος
  choice: onye ezi omume ahụ
  rationale: Adjective ahụ e ji dịka aha na-ezo aka na Lọt nke amaokwu bu ụzọ kpọrọ; “ahụ” na-eme ka ntụaka ahụ doo anya.
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: mgbe ọ bi n’etiti ha
  rationale: Nke a na-egosi ibi nọgide n’etiti ndị ahụ; usoro a bụ Igbo eke ma na-edobe ọrụ participle ahụ dịka ọnọdụ gbara omume ahụ gburugburu.
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: kwa ụbọchị
  rationale: Akpaalaokwu a na-egosi ihe na-eme ugboro ugboro, site n’otu ụbọchị ruo n’ọzọ.
- source_word: ψυχὴν δικαίαν
  choice: mkpụrụ obi ya ezi omume
  rationale: A na-edobe “mkpụrụ obi” dịka okwu kwekọrọ kpọmkwem, ma a naghị eji ya kpebie ozizi pụrụ iche banyere ọdịdị mmadụ.
- source_word: ἀνόμοις ἔργοις
  choice: ọrụ ha ndị megidere iwu
  rationale: Nke a na-edobe ike omume na iwu dị na ἄνομος; “ha” sitere n’ọnọdụ okwu ahụ.
- source_word: ἐβασάνιζεν
  choice: na-ata ... ahụhụ
  rationale: Usoro a na-egosi omume siri ike nke na-aga n’ihu n’oge gara aga, ọ bụghị naanị mwute dị mfe.
theological_decisions:
- issue: Ihe ψυχή pụtara n’ihe gbasara ọdịdị mmadụ
  choice: mkpụrụ obi, nke na-ezo aka n’ime mmadụ/onwe ya n’enweghị nkọwa ozizi ọzọ
  alternative: onwe ya; ihe dị n’ime ya
  rationale: Amaokwu a na-ekwu banyere ahụhụ ime mmụọ na omume ọma Lọt, ọ bụghị ikwupụta usoro ozizi banyere njikọ ahụ na mkpụrụ obi.
- issue: Onye na-eme omume dị na ἐβασάνιζεν
  choice: 'E debere olu active: onye ezi omume ahụ na-ata mkpụrụ obi ya ahụhụ site n’ihe ọ na-ahụ na anụ na ọrụ megidere iwu'
  alternative: mkpụrụ obi ya nọ na-ata ahụhụ; ọrụ ha na-ata ya ahụhụ
  rationale: Asụsụ Grik jiri active mee ka Lọt bụrụ isiokwu, ọ bụ ezie na nhazi dative ndị ahụ na-eme ka njikọ kpọmkwem nke ihe ọ hụrụ/nụrụ na ọrụ ndị ahụ nwee ntakịrị mgbagwoju anya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi nke “ezi omume” dị n’asụsụ Grik, yana ike nke okwu “ịta ahụhụ.” Akara ndetu [a], [b], na [c] niile pụtara n’ederede.
