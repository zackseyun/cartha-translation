  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ ⸀αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρὶ τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/007.yaml
  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: ig
  text: Ma otu okwu ahụ ka e ji dobewo eluigwe na ụwa ndị dị ugbu a, na-echekwa ha maka ọkụ ruo ụbọchị ikpe na mbibi nke ndị mmadụ na-adịghị asọpụrụ Chineke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: Ma eluigwe ndị dị ugbu a na ụwa
  rationale: “Ma” na-egosi ọdịiche dị n’etiti ụwa mbụ a kpọtụrụ aha na ọnọdụ ihe e kere eke ugbu a. “Eluigwe ndị dị ugbu a na ụwa” na-edobe ọtụtụ nke οὐρανοί ma na-egosi ike νῦν.
- source_word: τῷ αὐτῷ λόγῳ
  choice: e ji otu okwu ahụ
  rationale: Ụdị a na-egosi na okwu ahụ bụ ngwá ọrụ e ji mee ihe, ma “otu ... ahụ” na-atụghachi aka n’okwu Chineke e kwuru banyere ya n’amaokwu ndị bu ụzọ.
- source_word: τεθησαυρισμένοι εἰσὶν
  choice: debeere
  rationale: “Debeere” na-egosi ihe e dobeworo nke ka nọ n’ọnọdụ ahụ ugbu a, dịka periphrastic perfect Grik si dị.
- source_word: πυρὶ τηρούμενοι
  choice: ọkụ, na-echekwa ha
  rationale: A na-edobe ihe e kere eke maka ọkụ; “na-echekwa ha” na-egosi omume na-aga n’ihu nke τηρούμενοι ma zere iji otu ngwaa ahụ mee ma τεθησαυρισμένοι ma τηρούμενοι.
- source_word: εἰς ἡμέραν κρίσεως
  choice: ruo ụbọchị ikpe
  rationale: “Ruo” na-egosi njedebe oge nke εἰς nwere n’ebe a, ya bụ ụbọchị ikpe.
- source_word: καὶ ἀπωλείας
  choice: na mbibi
  rationale: “Mbibi” bụ okwu Igbo doro anya maka ἀπώλεια n’ọnọdụ ikpe a, na-enweghị ịgbakwụnye nkọwa ozizi ọzọ.
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: nke ndị mmadụ na-adịghị asọpụrụ Chineke
  rationale: “Ndị mmadụ” na-enye echiche izugbe nke ἀνθρώπων n’Igbo n’enweghị ịkpa oke nwoke na nwanyị; nkebi “na-adịghị asọpụrụ Chineke” na-akọwa ἀσεβῶν n’asụsụ a na-aghọta ngwa ngwa.
theological_decisions:
- issue: Ụdị njedebe nke ọkụ ahụ ga-eweta
  choice: Amaokwu ahụ kwuru na a na-edebe eluigwe na ụwa dị ugbu a maka ikpe metụtara ọkụ, ma kpọọ mbibi ahụ kpọmkwem mbibi nke ndị na-adịghị asọpụrụ Chineke.
  alternative: Ịkọwa ya hoo haa dị ka ikpochapụ eluigwe na ụwa kpamkpam, ma ọ bụ dị ka iji ọkụ sachapụ ma mee ka ihe e kere eke dị ọhụrụ.
  rationale: Okwu Grik ahụ ekpebighị n’amaokwu a naanị ma ọkụ ahụ ọ ga-ekpochapụ ihe e kere eke kpamkpam ma ọ bụ gbanwee ya. Nsụgharị ahụ na-ahapụ esemokwu nkọwa a ka ọ dị.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere “ha” iji mee ka onye a na-echekwa doo anya n’Igbo, ya bụ eluigwe na ụwa. Akara ukwu [a] dị n’isiokwu ma kwekọọ na nkọwa ala peeji.
