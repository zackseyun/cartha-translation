revisions:
- from: Ma eluigwe ndị dị ugbu a na ụwa ka e ji otu okwu ahụ debeere ọkụ, na-echekwa ha ruo ụbọchị ikpe na mbibi nke ndị mmadụ na-adịghị asọpụrụ Chineke.[a]
  to: Ma otu okwu ahụ ka e ji dobewo eluigwe na ụwa ndị dị ugbu a, na-echekwa ha maka ọkụ ruo ụbọchị ikpe na mbibi nke ndị mmadụ na-adịghị asọpụrụ Chineke.
  rationale: The revision preserves the source’s ambiguity regarding the precise effect of the fire while clarifying that the present heavens and earth have been stored up by the same word and are being kept for fire until the stated day. It also removes an English-oriented footnote that is not needed with the inclusive Igbo expression “ndị mmadụ.”
  reviewer_model: gpt-5.6-terra
