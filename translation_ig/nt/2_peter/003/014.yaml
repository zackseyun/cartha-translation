revisions:
- from: Ya mere, ndị m hụrụ n’anya, ebe unu na-atụ anya ihe ndị a, gbasienụ mbọ ike ka ọ hụ unu[a] ka unu na-enweghị ntụpọ, bụrụkwa ndị a na-apụghị ịta ụta, nọkwa n’udo.
  to: Ya mere, ndị m hụrụ n’anya, ebe unu na-atụ anya ihe ndị a, gbasienụ mbọ ike ka o wee hụ unu n’udo, na-enweghị ntụpọ na ndị a na-apụghị ịta ụta.[a]
  rationale: The revision clarifies that the imperative seeks their being found in a specified condition, while leaving the pronoun’s referent unnamed. The alternative ‘n’ihu ya’ is retained in the footnote because αὐτῷ may be understood in a presence/reference sense rather than as the agent. ‘N’udo’ remains broad and is not expanded into an interpretive theological relationship.
  reviewer_model: gpt-5.6-terra
