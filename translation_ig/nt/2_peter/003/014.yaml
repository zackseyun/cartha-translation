id: 2PE.3.14
reference: 2 Peter 3:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: ig
  text: Ya mere, ndị m hụrụ n’anya, ebe unu na-atụ anya ihe ndị a, gbasienụ mbọ ike ka o wee hụ unu n’udo, na-enweghị ntụpọ na ndị a na-apụghị ịta ụta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka a hụ unu n’ihu ya n’udo, na-enweghị ntụpọ na ndị a na-apụghị ịta ụta.” Dative Grik a nwere ike ịpụta na ọ bụ ya ga-ahụ unu, ma ọ bụ na a ga-ahụ unu n’ihu ya.
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: Ya mere
  rationale: Ọ bụ njikọ nkwubi okwu nke na-ejikọta ndụmọdụ a na ihe e kwuru tupu ya banyere ụbọchị Onyenwe anyị na eluigwe ọhụrụ na ụwa ọhụrụ.
- source_word: ἀγαπητοί
  choice: ndị m hụrụ n’anya
  rationale: Nke a bụ okwu ịhụnanya e ji akpọ ọtụtụ ndị; ọ na-ada nke ọma n’Igbo ugbu a ma na-edobe mmetụta ịhụnanya dị n’akwụkwọ ozi ahụ.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Ọ na-ezo aka n’ihe ndị metụtara oge ikpeazụ a kọwara n’amaokwu ndị bu ụzọ, n’ebughị ụzọ kọwaa kpọmkwem karịa ihe Grik kwuru.
- source_word: προσδοκῶντες
  choice: ebe unu na-atụ anya
  rationale: Ọ na-egosi atụmanya na-aga n’ihu, ma jikọta atụmanya ahụ na iwu nke na-esochi ya n’ụzọ pụrụ igosi oge na ihe kpatara ya.
- source_word: σπουδάσατε
  choice: gbasienụ mbọ ike
  rationale: Ọ na-egosipụta iwu ka ha were ịdị uchu na mbọ siri ike mee ihe, n’asụsụ Igbo doro anya ma dị ndụ.
- source_word: ἄσπιλοι
  choice: na-enweghị ntụpọ
  rationale: Ọ na-edobe ihe atụ nke ịdị ọcha n’omume nke okwu Grik ahụ nwere.
- source_word: ἀμώμητοι
  choice: ndị a na-apụghị ịta ụta
  rationale: Ọ na-egosi na e nweghị ihe kwesịrị ekwesị a ga-eji bo ha ebubo, ma mee ka ọ dị iche ntakịrị n’okwu ‘na-enweghị ntụpọ’ nke bu ya ụzọ.
- source_word: αὐτῷ
  choice: ọ hụ unu
  rationale: E ji onye nke atọ otu mee onye na-enyocha ha n’oge ahụ ka ọ nọgide bụrụ onye a na-akpọghị aha kpọmkwem, dịka Grik si mee. Ihe ọzọ nwere ike ịbụ ‘n’ihu ya,’ ya mere e debere ya n’okpuru amaokwu.
- source_word: εὑρεθῆναι
  choice: ka ọ hụ unu
  rationale: N’Igbo, nke a na-egosipụta n’ụzọ eke echiche nke ịbụ ndị a ga-achọpụta na ha nọ n’ọnọdụ a chọrọ mgbe oge nyocha ahụ bịara.
- source_word: ἐν εἰρήνῃ
  choice: nọkwa n’udo
  rationale: Ọ na-egosi ọnọdụ udo a ga-ahụ ha n’ime ya, ma hapụ okwu ahụ ka ọ ghara ikpebi ma ọ bụ udo nke obi, udo n’etiti mmadụ na Chineke, ma ọ bụ udo n’etiti ndị mmadụ.
theological_decisions:
- issue: Ihe αὐτῷ na-ezo aka na ya na otú dative ahụ si arụ ọrụ
  choice: A sụgharịrị ya ‘ka ọ hụ unu,’ nke na-ewere αὐτῷ dị ka onye na-eme nchọpụta ahụ ma ghara ịkpọ ya ‘Onyenwe anyị’ ma ọ bụ ‘Chineke’ kpọmkwem.
  alternative: ‘ka a hụ unu n’ihu ya’ ma ọ bụ ‘n’anya ya’
  rationale: Ọnọdụ amaokwu gbara ya gburugburu na-egosi onye dị nsọ metụtara ụbọchị ahụ, ma amaokwu a akpọghị ya aha ọzọ. Ọzọkwa, dative Grik ahụ nwere ike igosi onye na-eme ihe ma ọ bụ onye a nọ n’ihu ya; ya mere, a họọrọ otu n’ahịrị isi ma debe nke ọzọ n’okpuru amaokwu iji chekwaa nghọta abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E ji ‘unu’ mee ka o doo anya na a na-agwa ọtụtụ ndị okwu. A hapụrụ ‘n’udo’ ka ọ nwee obosara echiche okwu Grik ahụ nwere, n’etinyeghị nkọwa okpukpe na-adịghị n’amaokwu ahụ.
