id: 2PE.3.8
reference: 2 Peter 3:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: ig
  text: 'Ma, ndị m hụrụ n’anya, unu elegharala otu ihe a anya[a]: n’ebe Onyenwe anyị nọ, otu ụbọchị dị ka otu puku afọ[b][c], otu puku afọ dịkwa ka otu ụbọchị.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu ekwela ka otu ihe a gbanahụ unu.”
    reason: lexical_alternative
  - marker: b
    text: Okwu “dị ka” na-egosi ntụnyere; ọ naghị ekwu na otu ụbọchị na otu puku afọ hà nhata n’ụzọ nkịtị.
    reason: cultural_note
  - marker: c
    text: Lee Abụ Ọma 90:4.
    reason: cross_reference
lexical_decisions:
- source_word: Ἓν ... τοῦτο
  choice: otu ihe a
  rationale: Nke a na-echekwa ma nkwusiri ike dị na Ἓν (‘otu’) ma ihe ngosi dị na τοῦτο (‘a’), n’ụzọ Igbo na-ada nke ọma.
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: unu elegharala ... anya
  rationale: N’okwu a, λανθάνω pụtara ka ihe ghara ịpụ n’uche mmadụ ma ọ bụ ka a ghara ileghara ya anya. Nhọrọ a na-enye iwu ahụ n’Igbo doro anya ma dịkwa ugbu a.
- source_word: ἀγαπητοί
  choice: ndị m hụrụ n’anya
  rationale: Ọ bụ okwu ịhụnanya e ji akpọ ndị kwere ekwe; nsụgharị a na-echekwa ịdị nro na nsọpụrụ nke okwu ahụ n’Igbo nkịtị.
- source_word: παρὰ κυρίῳ
  choice: n’ebe Onyenwe anyị nọ
  rationale: παρά tinyere dative nwere ike igosi ịnọ n’ebe onye nọ ma ọ bụ otú ihe dị n’anya ya. Okwu Igbo a na-echekwa echiche ahụ n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: μία ἡμέρα ... ὡς χίλια ἔτη
  choice: otu ụbọchị dị ka otu puku afọ
  rationale: ‘Dị ka’ na-egosi ntụnyere nke ὡς, ọ bụghị na otu ụbọchị na otu puku afọ hà nhata n’ụzọ nkịtị.
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: otu puku afọ dịkwa ka otu ụbọchị
  rationale: Ikwughachi ‘dịkwa ka’ na-eme ka akụkụ abụọ ahụ guzozie nke ọma ma doo anya n’Igbo.
- source_word: χίλια ἔτη
  choice: otu puku afọ
  rationale: Nke a bụ ụzọ Igbo nkịtị si kwuo ọnụọgụ ahụ; ọ dịghị ihe dị n’okwu gbara ya gburugburu chọrọ ka e mee ya ihe atụ ọzọ n’ime nsụgharị.
theological_decisions:
- issue: Ụdị ntụnyere gbasara oge
  choice: E depụtara ya dịka ntụnyere banyere otú oge dị n’ebe Onyenwe anyị nọ, ọ bụghị dịka nha nkịtị ma ọ bụ usoro e ji gbakọọ amụma.
  alternative: Ịsị na otu ụbọchị hà kpọmkwem otu puku afọ, ma ọ bụ iji amaokwu a mee usoro ịgbakọ oge ihe ndị ga-eme n’ọdịnihu.
  rationale: ὡς pụtara ‘dị ka’ ugboro abụọ, ya mere ọ na-egosi ntụnyere. Nsụgharị ahụ na-ahapụ ihe odide ahụ n’ụdị ntụnyere ya n’etinyeghị usoro ozizi ọzọ n’ime ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. Ahịrịokwu ahụ na-echekwa nkwusiri ike nke ‘otu ihe a,’ okwu ịhụnanya e ji kpọọ ndị na-agụ ya, na nguzozi dị n’etiti akụkụ abụọ nke ntụnyere ahụ.
