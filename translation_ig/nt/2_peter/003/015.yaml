revisions:
- from: Ka unu werekwa ogologo ntachi obi nke Onyenwe anyị dị ka nzọpụta,[a] dị nnọọ ka Pọl, nwanne anyị anyị hụrụ n’anya, dekwara unu akwụkwọ dịka amamihe e nyere ya si dị.[b]
  to: Ka unu werekwa ndidi nke Onyenwe anyị dịka nzọpụta,[a] dị nnọọ ka Pọl, nwanne anyị nwoke anyị hụrụ n’anya, degaara unu akwụkwọ dịka amamihe e nyere ya si dị.[b]
  rationale: The revision improves Standard Igbo idiom while retaining the Greek syntax and its theological restraint. It keeps salvation as the direct predicate, retains the unstated agent of the passive participle, and preserves both the comparison and additive force of καθὼς καὶ.
  reviewer_model: gpt-5.6-terra
