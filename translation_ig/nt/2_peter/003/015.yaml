    reason: alternative_reading
  revision_rationale: The revision improves Standard Igbo idiom while retaining the Greek syntax and its theological restraint. It keeps salvation as the direct predicate, retains the unstated agent of the passive participle, and preserves both the comparison and additive force of καθὼς καὶ.
