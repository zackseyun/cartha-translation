id: 2PE.3.15
reference: 2 Peter 3:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν ⸂δοθεῖσαν αὐτῷ⸃ σοφίαν ἔγραψεν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/015.yaml
  text: And regard the patience of our Lord as salvation[a], just as our beloved brother Paul also wrote to you according to the wisdom given to him[b],
translation:
  language: ig
  text: Ka unu werekwa ndidi nke Onyenwe anyị dịka nzọpụta,[a] dị nnọọ ka Pọl, nwanne anyị nwoke anyị hụrụ n’anya, degaara unu akwụkwọ dịka amamihe e nyere ya si dị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ogologo ntachi obi”; ihe ọ pụtara bụ na igbu oge nke Onyenwe anyị bụ maka nzọpụta, ọ bụghị n’ihi enweghị mmasị.
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “amamihe e nyere ya” na-egosi amamihe Chineke nyere ya, ma Grik ahụ ekwughị kpọmkwem onye nyere ya.
    reason: alternative_reading
lexical_decisions:
- source_word: μακροθυμίαν
  choice: ogologo ntachi obi
  rationale: Okwu a na-egosi ndidi na njide onwe onye ruo ogologo oge, karịchaa n’ịla azụ ikpe; ntụgharị a bụ nke mmadụ nkịtị ga-aghọta ma dabara n’ihe gbara amaokwu ahụ gburugburu.
- source_word: σωτηρίαν
  choice: nzọpụta
  rationale: N’ọnọdụ a gbasara ọgwụgwụ oge, okwu ahụ na-ezo aka n’ebumnobi nzọpụta nke Onyenwe anyị n’ime ndidi ya, ọ bụghị naanị nnapụta n’ozuzu.
- source_word: ἡγεῖσθε
  choice: were ... dị ka
  rationale: Nke a na-egosi iwu ka ndị na-agụ ya tụlee ma were otu ihe dị ka ihe ọzọ, ma na-echekwa njikọ kpọmkwem dị n’etiti ndidi na nzọpụta.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a na-echekwa utu aha ahụ na ike okpukpe ya; n’ọnọdụ a ọ na-ezo aka n’Onyenwe anyị Jizọs.
- source_word: ἀγαπητὸς ... ἀδελφὸς
  choice: nwanne anyị anyị hụrụ n’anya
  rationale: Ọ na-egosipụta ma mmekọrịta nke ịbụ nwanne ma ịhụnanya e ji kpọọ Pọl.
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: dịka amamihe e nyere ya si dị
  rationale: Ọ na-echekwa echiche nke ime ihe n’ụzọ kwekọrọ n’amamihe ahụ, nakwa ụdị okwu nnara nke na-ekwughị kpọmkwem onye nyere ya.
- source_word: ἔγραψεν ὑμῖν
  choice: dekwara unu akwụkwọ
  rationale: Ọ na-enye aorist ahụ dịka ihe mere eme ma na-eme ka ihe ‘unu’ bụ ndị e degaara doo anya.
- source_word: καθὼς καὶ
  choice: dị nnọọ ka ... kwa
  rationale: Usoro a na-echekwa ma ntụnyere ahụ ma echiche agbakwunyere nke καί.
theological_decisions:
- issue: Onye nyere Pọl amamihe
  choice: 'E debere ụdị nnara ahụ: “amamihe e nyere ya.”'
  alternative: “amamihe Chineke nyere ya”
  rationale: Ọ bụ ezie na o yikarịrị ka Chineke bụ onye nyere amamihe ahụ, Grik ahụ ekwughị onye nyere ya; ya mere isiokwu ahụ anaghị agbakwụnye onye a na-akpọghị aha.
- issue: Ihe ndidi Onyenwe anyị pụtara n’oge ọ na-egbu oge
  choice: E jikọtara “ogologo ntachi obi” na “nzọpụta” ozugbo.
  alternative: “ogologo ntachi obi ... bụ ohere maka nzọpụta”
  rationale: Grik ahụ na-ekwu kpọmkwem ka a were ndidi ahụ dị ka nzọpụta; ịgbakwunye “ohere maka” ga-akọwa karịa ihe ederede kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke nwere ugwu ma dị mfe nghọta, mee ntụgharị ahụ. A họọrọ “ogologo ntachi obi” iji mee ka echiche nke μακροθυμία pụta nke ọma, ma e chekwara ihe a na-ekwughị kpọmkwem banyere onye nyere Pọl amamihe.
