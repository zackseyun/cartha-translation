- from: na-asịkwa, “Olee ebe nkwa banyere ọbịbịa ya[a] dị? N’ihi na kemgbe ndị nna nna dara n’ụra[b], ihe niile ka na-adị otu ha dị site ná mmalite okike.”
  to: na-asịkwa, “Olee ebe nkwa banyere ọbịbịa ya[a] dị? N’ihi na kemgbe ndị nna ochie dara n’ụra[b], ihe niile na-adịgide otu ahụ site ná mmalite okike.”
  rationale: The revision clarifies the broad ancestral sense of οἱ πατέρες, makes the statement of continuing uniformity more idiomatic in Standard Igbo, and corrects the phrasing of the explanatory footnote. It retains the source’s ambiguity regarding which forebears are meant and preserves the death euphemism without importing doctrinal interpretation.
