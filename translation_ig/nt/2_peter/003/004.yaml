language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: ig
  text: na-asịkwa, “Olee ebe nkwa banyere ọbịbịa ya[a] dị? N’ihi na kemgbe ndị nna ochie dara n’ụra[b], ihe niile na-adịgide otu ahụ site ná mmalite okike.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ọnụnọ ya” ma ọ bụ “mbịarute ya.” N’ebe a, παρουσία na-ezo aka n’ọbịbịa Kraịst a na-atụ anya ya n’ọdịnihu.
    reason: lexical_alternative
  - marker: b
    text: “Dara n’ụra” bụ ụzọ e ji okwu Grik kwuo ọnwụ n’ụzọ dị nro.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: na-asịkwa
  rationale: Ọ bụ participle nke jikọtara omume a na nkọwa dị n’amaokwu bu ya ụzọ; “-kwa” na-egosipụta καί n’ụzọ Igbo si ada nke ọma.
- source_word: ἐπαγγελία
  choice: nkwa
  rationale: “Nkwa” bụ okwu Igbo doro anya ma kwekọọ na nkwa a na-akwa emo na a gaghị emezu.
- source_word: παρουσίας
  choice: ọbịbịa
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ọbịbịa a na-atụ anya ya; “ọbịbịa” na-egosipụta echiche nke ịbịarute karịa naanị ịnọ ebe.
- source_word: ἀφ’ ἧς
  choice: kemgbe
  rationale: “Kemgbe” na-egosipụta oge malitere n’oge gara aga ma na-aga n’ihu ruo ugbu a.
- source_word: οἱ πατέρες
  choice: ndị nna nna
  rationale: Nke a na-egosipụta ọgbọ ndị gara aga n’enweghị ịgbakwunye nnọchiaha nke na-adịghị na Grik.
- source_word: ἐκοιμήθησαν
  choice: dara n’ụra
  rationale: A hapụrụ ihe atụ Grik nke ụra dị ka okwu e ji nwayọọ kwuo ọnwụ.
- source_word: πάντα
  choice: ihe niile
  rationale: Ọ na-edobe oke zuru ụwa ọnụ nke ihe ndị na-akwa emo na-ekwu.
- source_word: οὕτως διαμένει
  choice: ka na-adị otu ha dị
  rationale: Nke a na-egosipụta ịnọgide n’otu ọnọdụ ahụ ma na-ada nke ọma n’Igbo.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: site ná mmalite okike
  rationale: Nsụgharị a dị nso na usoro Grik ma doo onye na-agụ Igbo anya.
theological_decisions:
- issue: Ihe παρουσία pụtara n’ọnọdụ okwu banyere ihe ga-eme n’ọdịnihu
  choice: ọbịbịa ya
  alternative: ịnọ ya ma ọ bụ mbịarute ya
  rationale: N’ọnọdụ a, ndị na-akwa emo na-ajụ maka mmezu nke nlọghachi a tụrụ anya ya. “Ọbịbịa” na-ekwupụta nke a nke ọma, ebe ndetu na-echekwa ụzọ ndị ọzọ e nwere ike isi ghọta okwu ahụ.
- issue: Otu e si sụgharịa okwu ἐκοιμήθησαν nke ji ụra dochie ọnwụ
  choice: dara n’ụra
  alternative: nwụrụ
  rationale: Idebe ihe atụ nke ụra na-echekwa ọdịdị okwu mbụ n’etinyeghị nkọwa ozizi ọzọ; ndetu na-akọwa na ọ pụtara ọnwụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ usoro ajụjụ na ihe atụ nke “ịda n’ụra,” ma zere ịgbakwunye “anyị” n’ebe Grik na-enweghị nnọchiaha ahụ.
