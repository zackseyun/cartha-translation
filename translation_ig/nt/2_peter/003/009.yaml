id: 2PE.3.9
reference: 2 Peter 3:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: ig
  text: Onyenwe anyị adịghị egbu oge n’ihe banyere nkwa ahụ, dị ka ụfọdụ si were ya na ọ bụ igbu oge[a]. Kama, ọ na-enwe ogologo ntachi obi n’ebe unu nọ[b][c], n’achọghị ka onye ọ bụla laa n’iyi, kama ka mmadụ niile chegharịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka ụfọdụ na-ewere ya dị ka igbu oge.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ na-enwere unu ndidi.”
    reason: lexical_alternative
  - marker: c
    text: A hapụrụ ókè ndị “onye ọ bụla” na “mmadụ niile” na-ezo aka na ha dịka e si kwuo ya na Grik. Ndị nkọwa Akwụkwọ Nsọ ekwekọghị ma Pita ọ na-ekwu kpọmkwem banyere ndị ọ na-edegara akwụkwọ ozi, ka ọ̀ na-ekwu n’ụzọ sara mbara banyere mmadụ niile.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Ọ bụ aha nsọ a na-ejikarị asụ κύριος n’Igbo mgbe ọ bụ utu aha Chineke ma ọ bụ Kraịst.
- source_word: οὐ βραδύνει ... τῆς ἐπαγγελίας
  choice: adịghị egbu oge n’ihe banyere nkwa ahụ
  rationale: Nke a na-egosipụta echiche nke ịdị nwayọọ ma ọ bụ igbu oge, na-agbakwụnyeghị n’ahịrị isi okwu ‘imezu’ nke adịghị kpọmkwem na Grik.
- source_word: ὥς τινες βραδύτητα ἡγοῦνται
  choice: dị ka ụfọdụ si were ya na ọ bụ igbu oge
  rationale: Ọ na-edobe nkwughachi echiche βραδύνει/βραδύτητα ma na-asụ ya n’Igbo doro anya.
- source_word: μακροθυμεῖ εἰς ὑμᾶς
  choice: ọ na-enwe ogologo ntachi obi n’ebe unu nọ
  rationale: ‘Ogologo ntachi obi’ na-egosipụta ndidi na njide onwe onye ruo ogologo oge; ‘n’ebe unu nọ’ na-edobe ntụziaka nke εἰς ὑμᾶς.
- source_word: μὴ βουλόμενός
  choice: ebe ọ na-achọghị
  rationale: ‘Na-achọghị’ na-edobe echiche ọchịchọ ma ọ bụ uche n’enweghị itinye nkọwa ozizi banyere ụdị uche Chineke.
- source_word: τινας ἀπολέσθαι
  choice: ka onye ọ bụla laa n’iyi
  rationale: N’okpuru nkwusioru ‘ọ na-achọghị,’ ‘onye ọ bụla’ na-enye echiche ‘onye ọbụla adịghị’ nke τινας, ebe ‘laa n’iyi’ bụ asụsụ Igbo kwesịrị ekwesị maka ἀπολέσθαι.
- source_word: πάντας εἰς μετάνοιαν χωρῆσαι
  choice: kama ka mmadụ niile chegharịa
  rationale: Nke a bụ ụzọ Igbo sitere n’okike si kwuo na mmadụ niile bịaruru ná nchegharị; ọ na-edobe ‘mmadụ niile’ n’enweghị ịgbasa ma ọ bụ imechi ndị okwu ahụ metụtara.
theological_decisions:
- issue: Ókè ndị ‘unu,’ ‘onye ọ bụla,’ na ‘mmadụ niile’ na-ezo aka na ha
  choice: 'E debere ha dịka okwu Grik siri dị: ‘n’ebe unu nọ ... onye ọ bụla ... mmadụ niile.’'
  alternative: Ịkọwa ha kpọmkwem dịka naanị ndị kwere ekwe/a họpụtara, ma ọ bụ dịka mmadụ niile n’ụwa.
  rationale: Grik akọwaghị ókè ahụ n’ụzọ ga-akwụsị esemokwu; nsụgharị ahụ ekwesịghị ibubata mkpebi otu ụka ma ọ bụ usoro ozizi.
- issue: Ike okwu βουλόμενός banyere uche Chineke
  choice: ọ na-achọghị
  alternative: ọ naghị ekpebi; ọ naghị ezube; ọ dịghị njikere
  rationale: Nhọrọ a na-egosipụta ọchịchọ ma ọ bụ uche dị n’okwu ahụ, ma ọ naghị eme ya ka ọ bụrụ okwu teknịkal banyere iwu nzuzo ma ọ bụ ụdị uche Chineke.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ogologo ntachi obi’ na-edobe ịdị arọ nke μακροθυμεῖ, ebe ahịrị ikpeazụ jiri ngwaa ‘chegharịa’ mee ka okwu ahụ bụrụ Igbo sitere n’okike.
