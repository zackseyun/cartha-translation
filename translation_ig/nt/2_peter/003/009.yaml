- from: Onyenwe anyị adịghị egbu oge n’ihe banyere nkwa ahụ, dị ka ụfọdụ si were ya na ọ bụ igbu oge[a]. Kama, ọ na-enwe ogologo ntachi obi n’ebe unu nọ[b][c], ebe ọ na-achọghị ka onye ọ bụla laa n’iyi, kama ka mmadụ niile chegharịa.
  to: Onyenwe anyị adịghị egbu oge n’ihe banyere nkwa ahụ, dị ka ụfọdụ si were ya na ọ bụ igbu oge[a]. Kama, ọ na-enwe ogologo ntachi obi n’ebe unu nọ[b][c], n’achọghị ka onye ọ bụla laa n’iyi, kama ka mmadụ niile chegharịa.
