- from: ka unu wee cheta okwu ndị amụma dị nsọ kwuru na mbụ[b], na iwu ndị ozi unu nyere, nke sitere n’aka Onyenwe na Onye Nzọpụta[a],
  to: ka unu wee cheta okwu ndị amụma dị nsọ kwuru na mbụ[b], na iwu nke Onyenwe na Onye Nzọpụta nyere site n’aka ndị ozi unu[a],
  rationale: The revision represents the command as belonging to and originating with the Lord and Savior, with the readers’ apostles as the means through whom it was conveyed. This is the clearest Igbo expression of the most coherent Greek syntactic relation. Footnote a preserves the alternative ordering reflected in the previous main text, without forcing a disputed nuance. Footnote markers remain anchored to the relevant expressions.
