id: 2PE.3.2
reference: 2 Peter 3:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/002.yaml
  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: ig
  text: ka unu wee cheta okwu ndị amụma dị nsọ kwuru na mbụ[b], na iwu nke Onyenwe na Onye Nzọpụta nyere site n’aka ndị ozi unu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “iwu ndị ozi unu nyere, nke sitere n’aka Onyenwe na Onye Nzọpụta.” Usoro genitive ndị dị na Grik nwere ike ịsụgharị n’ụzọ karịrị otu n’Igbo.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “okwu ndị e kwuru tupu oge ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  choice: ka unu wee cheta
  rationale: Ụdị a na-egosi ebumnuche nke ahịrịokwu malitere n’amaokwu bu ya ụzọ, ma na-asụkwa Igbo n’ụzọ nkịtị.
- source_word: προειρημένων ῥημάτων
  choice: okwu ... kwuru na mbụ
  rationale: Nke a na-echekwa echiche nke okwu e kwuru tupu oge ahụ, n’emeghị ka ọ bụrụ naanị amụma banyere ihe ga-eme n’ọdịnihu.
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: ndị amụma dị nsọ kwuru
  rationale: Ọ na-egosi ndị amụma dị ka ndị kwuru okwu ahụ ma na-echekwa nkọwa ha dịka ndị dị nsọ.
- source_word: ἐντολῆς
  choice: iwu
  rationale: “Iwu” bụ okwu Igbo doro anya maka ntụziaka nwere ikike, ma ọ na-echekwa otu ọnụọgụ dị na Grik.
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: ndị ozi unu
  rationale: A jikọtara “unu” na “ndị ozi” dịka usoro okwu Grik si kwado, n’ebughị echiche nke inwe ha dịka ihe onwunwe.
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: nke sitere n’aka Onyenwe na Onye Nzọpụta
  rationale: “Sitere n’aka” na-eme ka isi iyi nke iwu ahụ doo anya; e tinyeghị “anyị,” ebe ọ na-adịghị na Grik.
theological_decisions:
- issue: Ihe ὑμῶν (“unu”) na-akọwa
  choice: 'Ọ na-akọwa “ndị ozi”: “ndị ozi unu.”'
  alternative: “Iwu ndị ozi nyere unu.”
  rationale: Ọnọdụ okwu ahụ na Grik na-ejikọta ὑμῶν na ἀποστόλων karịa, ma nsụgharị a anaghị eme ka ọ pụta na ndị na-agụ akwụkwọ nwe ndị ozi ahụ dịka ihe onwunwe.
- issue: Njikọ τοῦ κυρίου καὶ σωτῆρος na akụkụ ndị ọzọ
  choice: Iwu ahụ sitere n’aka Onyenwe na Onye Nzọpụta, ndị ozi wee zie ya.
  alternative: “Iwu Onyenwe na Onye Nzọpụta nyere site n’aka ndị ozi unu.”
  rationale: Genitive ndị dị na Grik nwere ike ịpụta n’ụzọ karịrị otu mgbe a na-asụ Igbo. Isi nsụgharị na-edebe usoro ndị ozi tupu Onyenwe na Onye Nzọpụta, ebe nkọwa ala peeji na-enye usoro nke na-eme ka onye nyere iwu ahụ pụta ìhè ozugbo.
- issue: Ma “Onyenwe” na “Onye Nzọpụta” hà na-ezo aka n’otu onye
  choice: E debere utu aha abụọ ahụ ọnụ n’enweghị itinye okwu ọzọ.
  alternative: Ịkọwa ha dịka ndị dị iche iche.
  rationale: Otu article dị na Grik na-akwado ịghọta utu aha abụọ ahụ dịka nke otu onye, ma nsụgharị ahụ anaghị agbakwunye nkọwa ozizi na-adịghị n’ederede.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Onyenwe” na “Onye Nzọpụta” na-echekwa utu aha Agba Ọhụrụ n’etinyeghị “anyị,” nke na-adịghị na isi Grik. Akara nkọwa [b] na [a] dị n’ahịrị isi n’ebe ha metụtara.
