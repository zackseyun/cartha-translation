review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the prior prophetic words and preserves the singular authoritative command. However, “iwu ndị ozi unu nyere, nke sitere n’aka Onyenwe na Onye Nzọpụta” makes the apostles appear to be the direct givers of the command and only secondarily associates it with the Lord and Savior. The Greek construction is best represented in Igbo by identifying the command as the Lord and Savior’s and the apostles as its mediators, while retaining the syntactic ambiguity in a footnote.
  naturalness: The Igbo is generally clear, modern, and appropriately formal. “Ndị amụma dị nsọ,” “Onyenwe,” and “Onye Nzọpụta” are natural in this register. Recasting the final noun phrase improves both clarity and natural Igbo syntax.
  terminology: “Okwu,” “ndị amụma dị nsọ,” “iwu,” “ndị ozi,” “Onyenwe,” and “Onye Nzọpụta” are suitable Standard Igbo equivalents. “Iwu” properly remains singular. The revised wording avoids assigning the command primarily to the apostles while preserving their role.
  issues:
  - severity: medium
    issue: The attachment of the commandment’s genitives is misleadingly expressed in the main text.
    rationale: The wording “iwu ndị ozi unu nyere” explicitly says that the apostles gave the command, whereas the final genitive “of the Lord and Savior” is most coherently connected with “commandment.” A clearer main rendering should state that it is the Lord and Savior’s command, conveyed through the apostles; the alternate syntactic representation can remain in a footnote.
