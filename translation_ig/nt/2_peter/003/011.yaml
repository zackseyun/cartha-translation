id: 2PE.3.11
reference: 2 Peter 3:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τούτων ⸀οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/011.yaml
  text: Since all these things are being dissolved in this way[a], what sort of people ought you to be in holy conduct and godliness[b],
translation:
  language: ig
  text: Ebe ọ bụ na a na-etisasị[a] ihe ndị a niile n'ụzọ dị otu a, kedu ụdị mmadụ unu kwesịrị ịbụ n'omume dị nsọ na n'ịsọpụrụ Chineke?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a na-atọpụ” ma ọ bụ “a na-ebibi.” N'okwu nkịtị, Grik na-ekwu maka ịtọpụ ma ọ bụ ịtọsasị ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: ihe ndị a niile
  rationale: Nkebi okwu a na-ezo aka n'ihe niile e kwuru banyere ha n'amaokwu ndị bu ụzọ; “ihe ndị a niile” doro anya ma bụrụkwa Igbo nkịtị.
- source_word: οὕτως
  choice: n'ụzọ dị otu a
  rationale: Nke a na-egosi otú ntisasị ahụ ga-esi mee, ma na-ejigide ọrụ adverb ahụ n'Igbo dị mfe nghọta.
- source_word: λυομένων
  choice: a na-etisasị
  rationale: Ngwaa λύω n'ebe a na-egosi ịtọsasị ma ọ bụ ịtọpụ usoro ihe dị ugbu a. “A na-etisasị” na-ejigide echiche ahụ n'ebughị ụzọ mee ka ọ bụrụ naanị “ibibi.”
- source_word: ποταποὺς
  choice: kedụ ụdị mmadụ
  rationale: Ajụjụ a gbasara ụdị ndụ na àgwà ndị a na-agwa okwu kwesịrị inwe; okwu a bụ Igbo ebumpụta ụwa nke na-ejigide ike ajụjụ ahụ.
- source_word: δεῖ
  choice: kwesịrị
  rationale: “Kwesịrị” na-egosi mkpa nke omume na ọrụ dị n'okwu δεῖ n'ụzọ dabara n'ọdụmọdụ a.
- source_word: ὑπάρχειν
  choice: ịbụ
  rationale: N'ime njikọ a, ὑπάρχειν pụtara ihe ndị ahụ kwesịrị ịbụ; “ịbụ” bụ nsụgharị Igbo kachasị mma ma dị mfe.
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: n'omume dị nsọ
  rationale: ἀναστροφή na-ekwu maka ụzọ ndụ ma ọ bụ omume mmadụ. Ọ bụ ezie na Grik jiri ọtụtụ, otu aha mkpokọta “omume” na-ada nke ọma n'Igbo ma na-echekwa ihe ọ pụtara.
- source_word: εὐσεβείαις
  choice: n'ịsọpụrụ Chineke
  rationale: εὐσέβεια bụ nsọpụrụ na nrubeisi nye Chineke nke a na-egosipụta ná ndụ. “Ịsọpụrụ Chineke” doro ndị na-agụ Igbo nke oge a anya karịa okwu teknụzụ ma ọ bụ nke ochie.
theological_decisions:
- issue: Nkọwa banyere ihe ga-eme ihe ndị e kere eke n'ọgwụgwụ
  choice: a na-etisasị
  alternative: a na-ebibi
  rationale: Participle Grik ahụ na-ekwu kpọmkwem banyere ịtọpụ ma ọ bụ ịtọsasị ihe. Ọ bụ ezie na gburugburu okwu ahụ bụ banyere mbibi nke usoro ụwa dị ugbu a, nsụgharị ahụ ekwesịghị ime ka okwu ahụ sie ike karịa ihe okwu Grik n'onwe ya kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. Ajụjụ nkwuwa okwu nke Grik ka e chekwara. E wepụtara echiche εὐσέβεια dị ka “ịsọpụrụ Chineke” iji zere okwu ụka pụrụ iche ma mee ka ihe ọ pụtara doo ndị nkịtị anya.
