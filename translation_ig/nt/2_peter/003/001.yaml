revisions:
- from: Ndị m hụrụ n’anya, nke a bụzi akwụkwọ ozi nke abụọ m na-edetara unu. N’ime ha abụọ[a], ana m eji ihe ncheta akpalite uche unu nke ezi obi[b],
  to: Ndị m hụrụ n’anya, nke a bụzi akwụkwọ ozi nke abụọ m na-edegara unu. N’ime ha abụọ[a], ana m eji ncheta akpalite uche unu dị ọcha[b],
  rationale: The revision corrects the main rendering of εἰλικρινῆ διάνοιαν to “uche unu dị ọcha,” preserving the source’s sense of a pure/sincere mind. The wording for the means of stirring is lightly streamlined while retaining the present-tense action and the function of reminder. Footnote b is adjusted so that it presents the former, less precise wording as an alternative rather than the source-faithful main rendering.
