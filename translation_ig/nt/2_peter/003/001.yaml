id: 2PE.3.1
reference: 2 Peter 3:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: ig
  text: Ndị m hụrụ n’anya, nke a bụzi akwụkwọ ozi nke abụọ m na-edegara unu. N’ime ha abụọ[a], ana m eji ncheta akpalite uche unu dị ọcha[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime ha”; okwu Grik ahụ dị n’ụdị ọtụtụ, o yikwara ka ọ na-ezo aka n’akwụkwọ ozi abụọ ahụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “uche unu nke ezi obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Ndị m hụrụ n’anya
  rationale: Ọ bụ okwu a na-akpọ ọtụtụ ndị nke na-egosi ịhụnanya miri emi; ntụgharị a bụ asụsụ Igbo dị ugbu a, kwanyere ugwu, ma dịkwa mfe nghọta.
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: nke a bụzi akwụkwọ ozi nke abụọ
  rationale: “Bụzi” na-egosipụta ἤδη n’ụzọ Igbo sitere n’okike, ebe usoro okwu ahụ na-eme ka o doo anya na akwụkwọ ozi dị ugbu a bụ nke abụọ.
- source_word: γράφω
  choice: m na-edetara unu
  rationale: Ụdị ngwaa na-aga n’ihu dabara n’ọnọdụ onye ode akwụkwọ nọ n’ide akwụkwọ ozi nye ndị nnata ya.
- source_word: ἐν αἷς
  choice: N’ime ha abụọ
  rationale: Nnọchiaha Grik ahụ bụ ọtụtụ ma na-ezo aka n’akwụkwọ ozi abụọ ahụ; “ha abụọ” na-eme ka njikọ a doo anya n’Igbo.
- source_word: διεγείρω
  choice: ana m ... akpalite
  rationale: “Akpalite” na-eburu echiche nke ịkpọte ma ọ bụ ime ka uche malitekwa ịrụsi ọrụ ike n’enweghị ịgbasa ihe odide ahụ karịa mkpa.
- source_word: ἐν ὑπομνήσει
  choice: jiri ihe ncheta
  rationale: 'Nke a na-egosipụta ụzọ e si akpalite uche ha: site n’ichetara ha ihe.'
- source_word: εἰλικρινῆ διάνοιαν
  choice: uche unu nke ezi obi
  rationale: “Uche” na-anọchi διάνοια, ebe “nke ezi obi” na-egosipụta ịdị ọcha ma ọ bụ enweghị aghụghọ nke εἰλικρινής n’Igbo sitere n’okike.
- source_word: ὑμῶν
  choice: unu
  rationale: N’usoro Igbo, “uche unu” na-egosipụta genitive ahụ nke ọma dị ka ihe ha nwere.
theological_decisions:
- issue: Ihe ἐν αἷς, nke bụ nnọchiaha ọtụtụ, na-ezo aka na ya
  choice: Ọ na-ezo aka n’akwụkwọ ozi abụọ ahụ onye ode akwụkwọ degaara ndị nnata ya.
  alternative: Ịghọta ya dị ka ihe na-ezo naanị n’akwụkwọ ozi dị ugbu a site n’iji ọtụtụ mee ihe n’ụzọ sara mbara.
  rationale: Ụdị nwanyị ọtụtụ nke nnọchiaha Grik ahụ kwekọrọ n’ụzọ kacha nso na akwụkwọ ozi abụọ a kpọtụrụ aha; ntụgharị ahụ anaghị etinye nkwubi okwu ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “Ndị m hụrụ n’anya” maka ụda ịhụnanya nke okwu ahụ, ma jiri “akpalite uche” chekwaa ihe atụ nke ịkpọte uche. Akara nkọwa ala peeji [a] na [b] abụọ pụtara n’ahịrị isi.
