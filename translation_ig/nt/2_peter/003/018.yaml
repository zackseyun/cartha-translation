id: 2PE.3.18
reference: 2 Peter 3:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: ig
  text: Kama, toonụ n’amara na n’ịma Onyenwe anyị na Onye Nzọpụta anyị, Jizọs, onye bụ Mezaya.[a] Ka otuto dịrị ya ugbu a nakwa ruo n’ụbọchị nke ebighị ebi.[b] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya dịka “Jizọs Kraịst,” dịka ojiji ọdịnala siri dị.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya “ugbu a ruo mgbe ebighị ebi.” N’asụsụ Grik, n’ụzọ nkịtị, ọ pụtara “ugbu a nakwa ruo n’ụbọchị nke ebighị ebi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐξάνετε
  choice: na-eto eto
  rationale: Ngwaa iwu nke oge ugbu a, onye nke abụọ n’ọtụtụ, na-egosi uto kwesịrị ịga n’ihu; “na-eto eto” bụ okwu Igbo doro anya nke na-egosipụta nke a.
- source_word: δὲ
  choice: Kama
  rationale: Ọ na-egosi obere ngbanwe nwere ọdịiche site n’ịdọ aka ná ntị ndị bu ya ụzọ gaa n’iwu a.
- source_word: ἐν χάριτι καὶ γνώσει
  choice: n’amara na n’ịmata
  rationale: ἐν na-achị aha abụọ ahụ; ikwughachi “n’” n’Igbo na-eme ka njikọ ha doo anya ma bụrụkwa asụsụ e ji eme ihe.
- source_word: χάριτι
  choice: amara
  rationale: “Amara” bụ okwu Igbo a nabatara nke ọma maka χάρις n’echiche nke onyinye ọma Chineke na-enye n’efu.
- source_word: γνώσει
  choice: ịmata
  rationale: N’ebe a ọ bụghị naanị ozi ọgụgụ isi kama ọ bụ ịmata Onyenwe anyị; “ịmata” na-egosipụta njikọ ahụ nke ọma.
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: Onyenwe anyị na Onye Nzọpụta anyị, Jizọs bụ Mezaya
  rationale: Otu artikul Grik ahụ jikọtara κύριος na σωτήρ n’otu onye, ya bụ Jizọs. “Mezaya” na-atụgharị Χριστός dị ka utu aha kama idegharị ya naanị dịka aha.
- source_word: αὐτῷ ἡ δόξα
  choice: Ka otuto dịrị ya
  rationale: Nke a bụ ụzọ Igbo dị ugwu ma bụrụkwa eke isi kwupụta otuto doxology ahụ nke ngwaa ya zoro ezo na Grik.
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: ugbu a nakwa ruo n’ụbọchị ebighị ebi
  rationale: “ugbu a nakwa” na-egosipụta καὶ ... καὶ; “ụbọchị ebighị ebi” na-edobe okwu ἡμέραν kama ime ka ya bụrụ naanị “ruo mgbe ebighị ebi.”
- source_word: ἀμήν
  choice: Amen
  rationale: E debere ụdị okwu a a na-eji n’Igbo n’okwu nkwenye na otuto.
theological_decisions:
- issue: Ntughari Χριστοῦ n’aha-utu aha Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mezaya
  alternative: Jizọs Kraịst
  rationale: Χριστός bụ utu aha nke pụtara onye e tere mmanụ, ya bụ Mezaya. “bụ” na-eme ka utu aha a daa nke ọma n’Igbo n’enweghị ịgbanwe ihe Grik pụtara.
- issue: Onye “Onyenwe anyị na Onye Nzọpụta anyị” na-ezo aka na ya
  choice: Utu aha abụọ ahụ na-ezo aka n’otu onye, Jizọs bụ Mezaya
  alternative: Ịhapụ njikọ ahụ ka ọ ghara ịpụta ìhè n’asụsụ a sụgharịrị
  rationale: Otu artikul na usoro Grik na-egosi n’ụzọ siri ike na κύριος na σωτήρ na-ezo aka n’otu onye; nkebiokwu Igbo ahụ na-echekwa nke a.
- issue: Ụdị okwu “ụbọchị ebighị ebi”
  choice: E debere ihe atụ oge ahụ n’isi ederede
  alternative: ugbu a ruo mgbe ebighị ebi
  rationale: Nkebiokwu Grik ahụ pụrụ iche ma kwuo “ụbọchị”; idobe ya na-echekwa esemokwu na ọdịdị nke okwu mbụ kama ime ka ọ bụrụ okwu a na-ahụkarị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “Onyenwe anyị” na “Onye Nzọpụta anyị” mee ka otu onye utu aha abụọ ahụ na-ezo aka na ya doo anya. Akara nkọwa [a] na [b] dị n’isi ederede ma kwekọọ na nkọwa ala peeji.
