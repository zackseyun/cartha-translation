revisions:
- from: Ya mere, unu ndị m hụrụ n’anya, ebe unu maara ihe a tupu oge eruo, na-eche onwe unu nche, ka nduhie nke ndị na-eleghara iwu anya ghara ịdọkpụrụ unu, unu wee si n’ịguzosi ike nke unu[a] daa[b].
  to: Ya mere, unu ndị m hụrụ n’anya, ebe unu maara nke a tupu oge eruo, cheenụ onwe unu nche, ka a ghara iji nduhie nke ndị na-emebi iwu dọkpụrụ unu, mee ka unu si n’ịguzosi ike nke unu[a] daa[b].
  rationale: The revision restores the imperative force of φυλάσσεσθε, directly renders ἀθέσμων as “ndị na-emebi iwu,” and makes clear that deception/error can carry the readers away and thereby lead to falling from their firm position. It retains the Greek metaphor and does not decide whether the warning entails a particular doctrine of apostasy. The footnote set is preserved in meaning, with footnote a relocated to its proper lexical anchor and footnote b made more idiomatic.
