    text: Ma ọ bụ, “ọnọdụ unu guzosiri ike.” Okwu Grik στηριγμός nwere ike ịpụta nkwụsi ike, iguzosi ike, ma ọ bụ ọnọdụ siri ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “daa” dị ka “dapụ.” Isi amaokwu ahụ ezere ikwu n'ụzọ kpọmkwem ihe karịrị ihe okwu Grik chọrọ.
    reason: alternative_reading
  revision_rationale: The revision restores the imperative force of φυλάσσεσθε, directly renders ἀθέσμων as “ndị na-emebi iwu,” and makes clear that deception/error can carry the readers away and thereby lead to falling from their firm position. It retains the Greek metaphor and does not decide whether the warning entails a particular doctrine of apostasy. The footnote set is preserved in meaning, with footnote a relocated to its proper lexical anchor and footnote b made more idiomatic.
