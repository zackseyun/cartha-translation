review_pass:
  verdict: revise
  source_fidelity: A safe revision is needed. The Greek present middle imperative φυλάσσεσθε calls for a direct continuing command; the draft's “na-eche onwe unu nche” reads more naturally as a descriptive/progressive statement than as an imperative. The relation between being carried away and falling should also be expressed without making the lawless people themselves the grammatical agents of the final falling.
  naturalness: “Cheenụ onwe unu nche” is idiomatic Standard Igbo for the exhortation. “Nduhie nke ndị na-emebi iwu” is a more direct and natural rendering of τῶν ἀθέσμων while retaining the source’s moral sense. The revised clause gives a coherent warning sequence in modern Igbo.
  terminology: “Ndị na-emebi iwu” renders ἀθέσμων (“lawless persons”) directly without narrowing the reference to a particular legal code. “Nduhie” appropriately retains the semantic range of πλάνη (error/deception). “Ịguzosi ike” is suitable for στηριγμός. Footnote a is moved to that term, which it actually explains.
  issues:
  - severity: medium
    issue: The imperative φυλάσσεσθε is rendered as “na-eche onwe unu nche.”
    rationale: This form is ordinarily read as progressive/descriptive (“are guarding yourselves”), rather than the exhortative present imperative required by the Greek. “Cheenụ onwe unu nche” supplies the direct plural command.
  - severity: medium
    issue: The main clause weakly and awkwardly represents the participial warning sequence.
    rationale: “Ka nduhie ... ghara ịdọkpụrụ unu, unu wee ... daa” can be read as two loosely coordinated outcomes. The revision explicitly presents being dragged away by the lawless persons’ error as the circumstance that can lead to falling.
  - severity: low
    issue: Footnote a is anchored after “unu,” although it discusses στηριγμός.
    rationale: The anchor must follow “ịguzosi ike,” the translation of στηριγμός, so readers can identify the referenced expression.
  revised_text: Ya mere, unu ndị m hụrụ n’anya, ebe unu maara nke a tupu oge eruo, cheenụ onwe unu nche, ka a ghara iji nduhie nke ndị na-emebi iwu dọkpụrụ unu, mee ka unu si n’ịguzosi ike nke unu[a] daa[b].
  revised_footnotes:
