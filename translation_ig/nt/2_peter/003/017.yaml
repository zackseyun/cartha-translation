id: 2PE.3.17
reference: 2 Peter 3:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: ig
  text: Ya mere, unu ndị m hụrụ n’anya, ebe unu maara nke a tupu oge eruo, cheenụ onwe unu nche, ka a ghara iji nduhie nke ndị na-emebi iwu dọkpụrụ unu, mee ka unu si n’ịguzosi ike nke unu[a] daa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọnọdụ unu guzosiri ike.” Okwu Grik στηριγμός nwere ike ịpụta nkwụsi ike, iguzosi ike, ma ọ bụ ọnọdụ siri ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “daa” dị ka “dapụ.” Isi amaokwu ahụ ezere ikwu n'ụzọ kpọmkwem ihe karịrị ihe okwu Grik chọrọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς οὖν
  choice: Ya mere, unu
  rationale: “Ya mere” na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya, ebe “unu” na-edobe nnọchiaha a kwusiri ike n’asụsụ Grik.
- source_word: ἀγαπητοί
  choice: ndị m hụrụ n’anya
  rationale: Nke a bụ okwu ịhụnanya e ji akpọ ndị a na-edegara akwụkwọ ozi; ọ na-ada nke ọma ma dịkwa ugwu n’Igbo nke oge a.
- source_word: προγινώσκοντες
  choice: ebe unu maara ihe a tupu oge eruo
  rationale: Ọ na-edobe echiche nke ịma ihe tupu ya emee ma ọ bụ nke ịbụ ndị a dọrọ aka ná ntị tupu oge eruo. “Ihe a” sitere n’ihe gbara amaokwu ahụ gburugburu.
- source_word: φυλάσσεσθε
  choice: na-eche onwe unu nche
  rationale: Ọ na-egosipụta iwu ka ha nọgide na-amụ anya, ma na-edobekwa nghọta reflexive nke middle imperative ahụ.
- source_word: ἵνα μὴ
  choice: ka ... ghara
  rationale: Usoro a bụ ụzọ Igbo doro anya na nke ebumpụta ụwa si egosi ebumnuche ma ọ bụ ịdọ aka ná ntị megide ihe nwere ike ime.
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: nduhie nke ndị na-eleghara iwu anya
  rationale: “Nduhie” na-ejikọta echiche nke njehie na nke iduhie mmadụ; “ndị na-eleghara iwu anya” na-egosi ndị na-adịghị asọpụrụ ụkpụrụ iwu, n’enweghị echiche na ha enweghị iwu ọ bụla.
- source_word: συναπαχθέντες
  choice: ghara ịdọkpụrụ unu
  rationale: “Ịdọkpụrụ” na-edobe onyonyo nke ịbụ ndị a dọọrọ ma ọ bụ buru pụọ tinyere njehie ahụ, ma mee ka passive participle ahụ bụrụ Igbo dị mfe nghọta.
- source_word: ἐκπέσητε
  choice: unu wee ... daa
  rationale: “Daa” na-edobe ihe atụ nkịtị nke ἐκπίπτω ma ghara ime ka ịdọ aka ná ntị ahụ bụrụ nkwupụta ozizi kpọmkwem banyere ịhapụ okwukwe ma ọ bụ nzọpụta.
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: n’ịguzosi ike nke unu
  rationale: “Ịguzosi ike” na-egosi nkwụsi ike ma ọ bụ ịdịgide n’ọnọdụ siri ike; “nke unu” na-edobe nkwusi okwu dị na ἰδίου.
theological_decisions:
- issue: Ma ἐκπέσητε ọ̀ na-ekwu kpọmkwem banyere ịhapụ okwukwe ma ọ bụ ịla n’iyi n’ihe gbasara nzọpụta
  choice: si n’ịguzosi ike nke unu daa
  alternative: si n’ịguzosi ike nke unu dapụ; tufuo ọnọdụ unu siri ike n’okwukwe
  rationale: Asụsụ Grik na-adọ aka ná ntị banyere isi n’ọnọdụ siri ike daa, ma ọ naghị ekpebi n’onwe ya arụmụka ozizi banyere ntachi obi n’okwukwe ma ọ bụ ịhapụ okwukwe. Nsụgharị a na-edobe ike na mgbagwoju anya nke ịdọ aka ná ntị ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. Ahịrịokwu ahụ na-edobe ụda ịhụnanya na ịdọ aka ná ntị nke akwụkwọ ozi ahụ. “Ndị na-eleghara iwu anya” ka a họọrọ kama okwu nwere ike ime ka ndị na-agụ ya chee na a na-ekwu naanị banyere Iwu Mozis; “ịguzosi ike” na-edobekwa nghọta sara mbara nke στηριγμός.
