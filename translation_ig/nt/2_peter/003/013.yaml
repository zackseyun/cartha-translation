id: 2PE.3.13
reference: 2 Peter 3:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: ig
  text: Ma dị ka nkwa ya si dị, anyị na-echere eluigwe ọhụrụ na ụwa ọhụrụ, ebe ezi omume[a] bi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: eluigwe ọhụrụ na ụwa ọhụrụ
  rationale: “Ọhụrụ” na-egosipụta ihe ọhụrụ n’ụdị ma ọ bụ n’ịdị mma, n’akọwaghị ya hoo haa dị ka ihe e mere ka ọ dị ọhụrụ. “Eluigwe na ụwa” na-edobe asụsụ Baịbụl gbasara ihe niile Chineke kere, tinyere nkwughachi Aịzaya 65:17; 66:22.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche dị n’etiti mbibi e kwuru banyere ya n’amaokwu bu ụzọ na olileanya nke ihe ọhụrụ a na-echere.
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: dị ka nkwa ya si dị
  rationale: Nkebiokwu a na-egosi na ihe a na-echere kwekọrọ n’ihe Chineke kwere ná nkwa.
- source_word: προσδοκῶμεν
  choice: anyị na-echere
  rationale: Ọ na-egosi nchere na atụmanya na-aga n’ihu, n’asụsụ Igbo dị mfe ma bụrụkwa eke.
- source_word: ἐν οἷς
  choice: ebe
  rationale: “Ebe” na-ezo aka n’eluigwe ọhụrụ na ụwa ọhụrụ ọnụ dịka otu ọnọdụ ọhụrụ, ma zere nsogbu nke ime ka nnọchiaha Igbo dabara naanị n’otu n’ime ha.
- source_word: δικαιοσύνη
  choice: ezi omume
  rationale: “Ezi omume” na-edobe echiche sara mbara nke ihe ziri ezi n’ihu Chineke. A na-echekwa “ikpe ziri ezi” n’ala ala peeji dịka akụkụ ọzọ okwu Grik ahụ pụrụ ịpụta.
- source_word: κατοικεῖ
  choice: bi
  rationale: “Bi” na-egosi ibi n’ebe ahụ n’ụzọ kwụsiri ike, ma bụrụ okwu nkịtị na nke doro anya nye ndị na-agụ Igbo taa.
theological_decisions:
- issue: Ntụgharị δικαιοσύνη n’ọnọdụ gbasara ụwa ọhụrụ
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: Okwu Grik ahụ nwere ike ịgụnye ịdị ezi n’ihu Chineke nakwa ikpe ziri ezi. “Ezi omume” ka na-eburu echiche ahụ sara mbara n’ahịrịokwu bụ isi, ebe ala ala peeji na-echekwa echiche nke “ikpe ziri ezi” n’enweghị imechi mgbagwoju ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọdịiche nke δέ, asụsụ okike zuru ụwa ọnụ nke “eluigwe na ụwa,” na ihe oyiyi nke ezi omume nke bi n’ebe ahụ.
