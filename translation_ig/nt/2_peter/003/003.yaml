review_pass:
  verdict: revise
  source_fidelity: The draft faithfully conveys the future arrival, the eschatological temporal phrase, the cognate emphasis of ἐμπαιγμονῇ/ἐμπαῖκται, and the lifestyle sense of πορευόμενοι. However, “dịka ọchịchọ nke onwe ha si dị” weakens the direct ‘following/according to’ relationship and does not clearly represent the plural ἐπιθυμίαι.
  naturalness: “Na-ebu ụzọ mara nke a” is not a natural way to introduce this exhortatory statement in Standard Igbo. “Nke mbụ, maranụ nke a” is idiomatic, dignified, and retains the source’s address to the readers. “Na-agbaso ọchịchọ nke ha” naturally expresses conduct governed by their desires.
  terminology: “Ndị na-akwa emo” and “ịkwa emo” appropriately preserve the Greek cognate wordplay. “Ọchịchọ” remains appropriately broad for ἐπιθυμίαι and the footnote correctly notes that it is not confined to sexual desire. “Ụbọchị ndị ikpeazụ” preserves the established eschatological expression without imposing a particular interpretation.
  issues:
  - severity: medium
    issue: The opening phrase “Na-ebu ụzọ mara nke a” is grammatically and stylistically awkward in this context.
    rationale: The Greek participle has an exhortatory, reader-addressing function here. Standard Igbo more naturally renders this as “Nke mbụ, maranụ nke a,” without materially altering the force.
  - severity: medium
    issue: “dịka ọchịchọ nke onwe ha si dị” is less direct than the source and obscures the plural desires.
    rationale: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν describes the scoffers as conducting themselves in accordance with/following their own desires. “Na-agbaso ọchịchọ nke ha” states that relation clearly and idiomatically.
