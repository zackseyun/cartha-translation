source:
  edition: SBLGNT
  text: τοῦτο πρῶτον γινώσκοντες ὅτι ἐλεύσονται ἐπ’ ⸀ἐσχάτων τῶν ἡμερῶν ⸂ἐν ἐμπαιγμονῇ⸃ ἐμπαῖκται κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν πορευόμενοι
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/003.yaml
  text: 'knowing this first: that in the last days scoffers will come with scoffing[a], walking according to their own desires[b],'
translation:
  language: ig
  text: 'Nke mbụ, maranụ nke a: na n’ụbọchị ndị ikpeazụ, ndị na-akwa emo ga-abịa na ịkwa emo[a], na-agbaso ọchịchọ nke ha[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị na-eme mkparị ga-abịa n’ime mkparị.” N’asụsụ Grik, e ji okwu abụọ sitere n’otu mgbọrọgwụ—“ndị na-akwa emo” na “ịkwa emo”—mesie okwu ahụ ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “ọchịchọ” dị ka “agụụ.” Okwu Grik ahụ nwere ike ịpụta ọchịchọ siri ike n’ozuzu ya; ọ bụghị naanị agụụ mmekọahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: Na-ebu ụzọ mara nke a
  rationale: E debere ya dị ka nkebi ahịrịokwu nke participle, kama ịgbanwe ya ka ọ bụrụ iwu doro anya. “Buru ụzọ” na-egosipụta πρῶτον n’Igbo dị mfe nghọta.
- source_word: ἐλεύσονται
  choice: ga-abịa
  rationale: Nke a bụ ntụgharị nkịtị na nke ziri ezi nke future ἔρχομαι.
- source_word: ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: n’ụbọchị ndị ikpeazụ
  rationale: Ọ na-echekwa plural “ụbọchị” na echiche oge ikpeazụ, n’etinyeghị usoro nkọwa pụrụ iche banyere ọgwụgwụ ụwa.
- source_word: ἐν ἐμπαιγμονῇ ... ἐμπαῖκται
  choice: ndị na-akwa emo ga-eji ịkwa emo bịa
  rationale: A nọgidere na-ekwughachi okwu sitere n’otu mgbọrọgwụ dịka Grik si mee ya, iji chekwaa nkwusi ike nke “ndị na-akwa emo ... ịkwa emo.”
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: dịka ọchịchọ nke onwe ha si dị
  rationale: “Ọchịchọ” sara mbara ma ghara ime ka okwu ahụ bụrụ naanị agụụ mmekọahụ; “nke onwe ha” na-echekwa nkwusi ike nke ἰδίας αὐτῶν.
- source_word: πορευόμενοι
  choice: na-ebi ndụ
  rationale: N’ebe a, πορεύομαι na-ekwu maka omume na ụzọ ndụ. “Na-ebi ndụ” na-enye nghọta ahụ n’Igbo eke karịa ntụgharị nkịtị nke ‘ije ije.’
theological_decisions:
- issue: Ihe ἐπ’ ἐσχάτων τῶν ἡμερῶν pụtara n’ihe gbasara oge ikpeazụ
  choice: n’ụbọchị ndị ikpeazụ
  alternative: na njedebe nke ụbọchị ndị ahụ
  rationale: Nhọrọ a na-echekwa okwu Akwụkwọ Nsọ banyere oge ikpeazụ ma ghara ikpebi kpọmkwem usoro ma ọ bụ ogologo oge ihe ndị ga-eme na ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro participle nke mmalite amaokwu ahụ na nkwughachi okwu “ịkwa emo” dịka ihe dị na Grik, ma a tụgharịrị πορευόμενοι n’ụzọ na-egosi omume ndụ.
