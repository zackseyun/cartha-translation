  rationale: The revision makes the opening idiomatic Standard Igbo and makes the final participial clause explicitly describe the scoffers’ conduct as following their own desires. It retains the Greek future sense, plural ‘last days,’ cognate scoffing emphasis, broad moral sense of desires, and the existing footnote anchors and content.
