revisions:
- from: Dịkwa ka ọ na-eme n’akwụkwọ ozi ya niile, mgbe ọ na-ekwu n’ime ha banyere ihe ndị a. N’ime ha, e nwere ihe ụfọdụ siri ike nghọta, nke ndị na-amaghị ihe[a] na ndị na-adịghị eguzosi ike na-agbagọ[b], dịkwa ka ha na-agbagọ ihe odide nsọ ndị ọzọ[c], si otú a na-ewetara onwe ha mbibi.
  to: Dị ka o sikwa na-ekwu n’akwụkwọ ozi ya niile banyere ihe ndị a. N’ime ha, e nwere ihe ụfọdụ siri ike ịghọta, nke ndị na-amaghị ihe[a] na ndị na-adịghị eguzosi ike na-agbagọ[b], dị ka ha na-agbagọ ihe odide nsọ ndị ọzọ[c], na-eduga n’ime mbibi nke onwe ha.
  rationale: The revision removes the temporal implication in the opening, supplies the natural infinitive required by 'siri ike,' and makes the final consequence more direct. It retains the draft's appropriate terminology, source-level ambiguity concerning λοιπάς, and all footnote anchors and alternatives.
