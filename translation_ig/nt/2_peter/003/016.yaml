id: 2PE.3.16
reference: 2 Peter 3:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν πάσαις ⸀ταῖς ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν ⸀αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/016.yaml
  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: ig
  text: Dị ka o sikwa na-ekwu n’akwụkwọ ozi ya niile banyere ihe ndị a. N’ime ha, e nwere ihe ụfọdụ siri ike ịghọta, nke ndị na-amaghị ihe[a] na ndị na-adịghị eguzosi ike na-agbagọ[b], dị ka ha na-agbagọ ihe odide nsọ ndị ọzọ[c], na-eduga n’ime mbibi nke onwe ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị a na-akụzibeghị.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “na-emebi ihe ha pụtara.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ihe odide nsọ ndị fọdụrụ.” Okwu Grik ahụ nwere ike ịpụta “ndị ọzọ” ma ọ bụ “ndị fọdụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: akwụkwọ ozi
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka akwụkwọ ozi e dere ezigara mmadụ ma ọ bụ ọgbakọ; ọ na-ezere okwu ụka ochie nke ndị nkịtị nwere ike ghara ịghọta.
- source_word: λαλῶν
  choice: mgbe ọ na-ekwu
  rationale: Ọ na-edobe isi nghọta nke ‘ikwu okwu,’ ebe ọnọdụ gbara ya gburugburu na-eme ka o doo anya na okwu ahụ dị n’akwụkwọ ozi ya.
- source_word: περὶ τούτων
  choice: banyere ihe ndị a
  rationale: Ọ na-edobe ntụaka ngosipụta ahụ n’enweghị ịkọwa ihe ndị ahụ karịa ka Grik si mee.
- source_word: δυσνόητά τινα
  choice: ihe ụfọdụ siri ike nghọta
  rationale: Nke a na-egosipụta ma τινα, ‘ihe ụfọdụ,’ ma δυσνόητα, ‘siri ike nghọta,’ n’Igbo doro anya.
- source_word: ἀμαθεῖς
  choice: ndị na-amaghị ihe
  rationale: Ọ na-egosi ndị ihe ọmụma ma ọ bụ nkuzi na-adịghị, ma ọ naghị egosi nanị ndị na-agụghị akwụkwọ.
- source_word: ἀστήρικτοι
  choice: ndị na-adịghị eguzosi ike
  rationale: Ọ na-egosipụta enweghị nkwụsi ike ma ọ bụ ntọala siri ike, n’enweghị ịmachi ya naanị n’ozizi ma ọ bụ n’omume.
- source_word: στρεβλοῦσιν
  choice: na-agbagọ
  rationale: Okwu a na-edobe ihe atụ nke ịtụgharị ma ọ bụ ime ka ihe ghara ịdị n’ụdị ziri ezi, ma bụrụkwa okwu Igbo nkịtị.
- source_word: τὰς λοιπὰς γραφὰς
  choice: ihe odide nsọ ndị ọzọ
  rationale: ‘Ihe odide nsọ’ na-egosipụta γραφαί dị ka Akwụkwọ Nsọ, ebe ‘ndị ọzọ’ na-edobe ohere λοιπάς nwere ịpụta ‘ndị ọzọ’ ma ọ bụ ‘ndị fọdụrụ.’
- source_word: ἀπώλειαν
  choice: mbibi
  rationale: Ọ bụ okwu doro anya ma dị arọ nke na-egosipụta nsonaazụ ἀπώλεια n’enweghị ịtinye nkọwa ozizi pụrụ iche.
theological_decisions:
- issue: Ma τὰς λοιπὰς γραφὰς na-etinye akwụkwọ ozi Pọl n’otu ìgwè na ihe odide nsọ ndị ọzọ
  choice: ihe odide nsọ ndị ọzọ
  alternative: ihe odide ndị ọzọ
  rationale: N’Agba Ọhụrụ, γραφαί na-ezokarị aka n’ihe odide nsọ, λοιπάς na-egosikwa ntụnyere ya na ihe ndị ọzọ nọ n’otu ìgwè ahụ. Nsụgharị ahụ na-echekwa nghọta a ma ọ naghị agbakwụnye nkwupụta ozizi karịrị okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, mee ihe. Ahịrịokwu nke mbụ na-ejikọta omume Pọl n’akwụkwọ ozi ya niile na okwu gbara amaokwu a gburugburu; e debeghị aha Pọl n’amaokwu a n’onwe ya n’ihi na isi iyi Grik jiri naanị nnọchiaha sitere n’ọnọdụ gara aga. E tinyere akara nkọwa ụkwụ [a], [b], na [c] kpọmkwem n’ebe okwu ha na-akọwa pụtara.
