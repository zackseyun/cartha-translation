id: 2PE.3.12
reference: 2 Peter 3:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: ig
  text: ka unu na-atụ anya ma na-eme ka ọbịbịa nke ụbọchị Chineke mee ngwa ngwa[a], n’ihi ụbọchị ahụ ka a ga-akụsasị eluigwe, ebe ọkụ na-ere ha, ihe ndị bụ isi ga-agbaze, ebe ha na-ere ọkụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka unu na-atụ anya ọbịbịa nke ụbọchị Chineke n’ịnụ ọkụ n’obi.” Ngwaa Grik ahụ pụrụ ịpụta “ime ka ihe mee ngwa ngwa” ma ọ bụ “ịtụ anya ihe n’ịnụ ọkụ n’obi.”
    reason: alternative_reading
  - marker: b
    text: “Ihe ndị bụ isi” pụrụ ịpụta ihe ndị mejupụtara ụwa, ma ọ bụ ikekwe ihe ndị dị na mbara igwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: na-atụ anya
  rationale: Na-egosi ichere ihe a na-atụ anya ya n’ọdịnihu, ma bụrụkwa okwu Igbo dị mfe ma kwekọọ n’ọnọdụ a.
- source_word: σπεύδοντας
  choice: na-eme ka ... mee ngwa ngwa
  rationale: Na-edobe nghọta bụ́ ime ka ọbịbịa ahụ bịaruo ngwa ngwa, ebe a na-etinye nghọta ọzọ nke ịbụ onye ji ịnụ ọkụ n’obi na-atụ anya ya n’ala ala peeji.
- source_word: παρουσίαν
  choice: ọbịbịa
  rationale: N’ọnọdụ okwu banyere ọgwụgwụ oge, ‘ọbịbịa’ na-egosi mbata nke ọma n’Igbo.
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: ụbọchị Chineke
  rationale: Na-edobe okwu Grik ahụ pụrụ iche ma ghara ịgbanwe ya ka ọ bụrụ ‘ụbọchị Onyenweanyị.’
- source_word: δι’ ἣν
  choice: N’ihi ụbọchị ahụ
  rationale: διά tinyere accusative na-egosi ihe kpatara ihe ebe a; ikwughachi ‘ụbọchị ahụ’ na-eme ka Igbo doo anya.
- source_word: οὐρανοὶ
  choice: eluigwe
  rationale: ‘Eluigwe’ bụ okwu Igbo ebumpụta ụwa nke pụrụ ịgụnye mbara igwe n’ụzọ sara mbara, ọ bụ ezie na Igbo anaghị egosi plural n’ụdị okwu ahụ.
- source_word: πυρούμενοι
  choice: mgbe ọkụ gbara ha
  rationale: Na-egosi na eluigwe nọ n’okpuru omume ọkụ, ma na-ada n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: λυθήσονται
  choice: a ga-agbaze
  rationale: N’ebe a ọ pụtara na a ga-etisa ma ọ bụ tọpụ usoro ha; ‘agbaze’ jikọtara nke ọma na onyinyo ọkụ ma ghara ikwu mkpochapụ kpamkpam.
- source_word: στοιχεῖα
  choice: ihe ndị mejupụtara ụwa
  rationale: Na-enye nghọta sara mbara banyere akụkụ ndị bụ isi nke ụwa, ma ala ala peeji na-echekwa ohere na ọ pụrụ izo aka n’ihe ndị dị na mbara igwe.
- source_word: καυσούμενα
  choice: mgbe ha na-ere ọkụ
  rationale: Na-egosi ọkụ na-ekpo ma na-ere ihe ndị ahụ n’asụsụ Igbo dị mfe.
- source_word: τήκεται
  choice: ga-agbazekwa
  rationale: Na-egosi ịgbaze n’ihi okpomọkụ; ọdịnihu na-eme ka usoro ahịrịokwu Igbo kwekọọ na ngwaa ọdịnihu gbara ya gburugburu.
theological_decisions:
- issue: Ihe σπεύδοντας τὴν παρουσίαν pụtara
  choice: na-eme ka ọbịbịa ... mee ngwa ngwa
  alternative: jiri ịnụ ọkụ n’obi na-atụ anya ọbịbịa
  rationale: Usoro Grik ahụ pụrụ ịpụta ime ka mbata ahụ bịaruo ngwa ngwa ma ọ bụ iji ịnụ ọkụ n’obi na-atụ anya ya. Isi ederede na-edobe nghọta nke ngwaa na-emetụta ‘ọbịbịa’ ozugbo, ebe ala ala peeji na-echekwa nghọta nke ọzọ.
- issue: Ihe στοιχεῖα na-ezo aka na ya
  choice: ihe ndị mejupụtara ụwa
  alternative: ihe ndị dị na mbara igwe
  rationale: Okwu ahụ nwere ike izo aka n’akụkụ ndị bụ isi nke ụwa ma ọ bụ n’ihe ndị dị na mbara igwe. A họọrọ okwu sara mbara, tinyekwa nhọrọ nke ọzọ n’ala ala peeji ka a ghara ịmanye otu nkọwa banyere usoro eluigwe na ụwa.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma doo onye nkịtị anya. E jidere okwu banyere ọgwụgwụ oge n’enweghị itinye nkọwa ụka pụrụ iche; e tinyere akara ala ala peeji [a] na [b] n’isi ederede.
