  text: through which the world of that time[a], having been flooded with water[b], perished.
translation:
  language: ig
  text: Ọ bụ site n’ihe ndị ahụ[a] ka ụwa nke oge ahụ, mgbe mmiri rikpuru ya, lara n’iyi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site na nke ndị ahụ.” Nnọchiaha a sụgharịrị “ihe ndị ahụ” dị n’ụbara; ọ na-ezo aka n’ihe ndị e kwuru banyere ha n’amaokwu bu ya ụzọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “e bibiri ụwa ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
  choice: site n’ihe ndị ahụ
  rationale: Nkebi okwu a na-egosi ụzọ ma ọ bụ ihe e ji mee ihe, ebe nnọchiaha ya dị n’ụbara. Nsụgharị a na-edobe ụbara ahụ na ntụaka ya nke a na-akọwaghị kpọmkwem, kama ịkpọpụta otu ihe dị ka naanị ihe ọ na-ezo aka na ya.
- source_word: ὁ τότε κόσμος
  choice: ụwa nke oge ahụ
  rationale: N’ebe a, κόσμος bụ ụwa dị ka ọ dị n’oge ahụ, tinyere usoro ndụ na ndị bi na ya; τότε na-egosi ọdịiche dị n’etiti ụwa ahụ na ụwa dị ugbu a n’okwu gbara amaokwu a gburugburu.
- source_word: ὕδατι
  choice: e ji mmiri
  rationale: Ụdị dative a na-egosi ihe e ji mee ka iju mmiri ahụ mee. ‘E ji mmiri’ bụ okwu Igbo doro anya nke na-egosi na mmiri bụ ihe e ji rikpuo ụwa ahụ.
- source_word: κατακλυσθεὶς
  choice: rikpuo
  rationale: Okwu a bụ participle aorist passive nke pụtara na iju mmiri kpuchiri ihe ma ọ bụ rikpuo ya. Nhazi ‘e ji mmiri rikpuo’ na-edobe ihe ụwa natara n’ụdị passive ma na-ada nke ọma n’Igbo.
- source_word: ἀπώλετο
  choice: laa n’iyi
  rationale: Okwu Grik a nwere ike ịpụta ịla n’iyi ma ọ bụ ịbụ ihe e bibiri. ‘Laa n’iyi’ na-edobe ike nke ikpe ahụ n’ekwughị na ihe niile kwụsịrị ịdị adị kpamkpam.
theological_decisions:
- issue: Ụdị mbibi nke ikpe iju mmiri ahụ
  choice: ụwa ahụ wee laa n’iyi
  alternative: e bibiri ụwa ahụ
  rationale: ἀπώλετο na-akọ mbibi siri ike dakwasịrị ụwa nke oge Noa, ma ọ dịghị amanye echiche na ụwa ahụ kwụsịrị ịdị adị kpamkpam. ‘Laa n’iyi’ na-edobe esemokwu na obosara ihe okwu Grik ahụ nwere ike ịpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Nhazi ahịrịokwu ahụ na-eme ka njikọ dị n’etiti ‘ihe ndị ahụ,’ mmiri, na mbibi doo anya, ma ọ naghị akọwa kpọmkwem ihe nnọchiaha ụbara ahụ na-ezo aka na ya.
