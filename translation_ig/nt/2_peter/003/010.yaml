    text: Ụfọdụ na-aghọta “a ga-ahụ” dị ka “a ga-ekpughe” ma ọ bụ “a ga-eme ka ọ pụta ìhè.”
    reason: alternative_reading
  - marker: c
    text: Ọtụtụ ihe odide oge ochie nwere “a ga-akpọ ụwa na ọrụ ndị dị na ya ọkụ” n’ọnọdụ “a ga-ahụ ụwa na ọrụ ndị dị na ya.”
    reason: textual_variant
  revision_rationale: The revision avoids identifying στοιχεῖα with a particular cosmological scheme, moves its lexical footnote to the word it explains, improves the expression of the heavens' passing away, and clarifies the textual-variant note. It preserves the source text's difficult final verb and the English POB audit trail's restraint.
