id: 2PE.3.10
reference: 2 Peter 3:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: ig
  text: Ma ụbọchị Onyenwe anyị ga-abịa dịka onye ohi. N’ụbọchị ahụ, eluigwe ga-agafe n’oké mkpọtụ, ihe ndị bụ isi[a] ga-etisasị mgbe ọkụ na-ere ha, a ga-ahụkwa ụwa na ọrụ ndị dị na ya.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị στοιχεῖα n’ebe a dị ka “ihe ndị dị na mbara igwe.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ na-aghọta “a ga-ahụ” dị ka “a ga-ekpughe” ma ọ bụ “a ga-eme ka ọ pụta ìhè.”
    reason: alternative_reading
  - marker: c
    text: Ọtụtụ ihe odide oge ochie nwere “a ga-akpọ ụwa na ọrụ ndị dị na ya ọkụ” n’ọnọdụ “a ga-ahụ ụwa na ọrụ ndị dị na ya.”
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: ga-abịa
  rationale: Oge ọdịnihu nke ἥκω pụtara ‘ga-abịa’ ma ọ bụ ‘ga-erute’; ‘ga-abịa’ bụ okwu Igbo doro anya nke dabara n’ọbịbịa ụbọchị Onyenwe anyị.
- source_word: ἡμέρα κυρίου
  choice: ụbọchị Onyenwe anyị
  rationale: Nke a na-echekwa aha amụma banyere ụbọchị ikpe Chineke, ọ bụghị ụbọchị ofufe a na-eme kwa izu.
- source_word: κλέπτης
  choice: onye ohi
  rationale: Ntụnyere a na-egosi ọbịbịa a na-atụghị anya ya; ‘onye ohi’ bụ okwu Igbo nkịtị ma doo anya.
- source_word: ἐν ᾗ
  choice: N’ụbọchị ahụ
  rationale: Nke a na-ejikọta ihe ndị na-esote na ụbọchị ahụ e kwuru okwu ya, ma na-ada nke ọma n’Igbo.
- source_word: οἱ οὐρανοὶ
  choice: eluigwe
  rationale: ‘Eluigwe’ na-eburu echiche mbara eluigwe n’ọnọdụ a nke na-ekwu banyere ụwa niile, n’agbanyeghị na Grik ji ụdị ọtụtụ.
- source_word: ῥοιζηδόν
  choice: jiri oke ụzụ
  rationale: Okwu a na-egosi ụda siri ike nke ihe na-agba ọsọ ma ọ bụ na-ebigbọ; ‘oke ụzụ’ na-enye ihe oyiyi ahụ n’Igbo doro anya.
- source_word: παρελεύσονται
  choice: ga-agafee
  rationale: N’ọnọdụ ikpeazụ nke ụwa, okwu a pụtara ịgafe ma ọ bụ ịpụ n’ụzọ na-agaghị adịkwa; ‘ga-agafee’ na-echekwa ihe oyiyi Grik.
- source_word: στοιχεῖα
  choice: ihe ndị bụ isi mejupụtara eluigwe na ụwa
  rationale: Nke a na-ahapụ okwu ahụ ka ọ na-ezo aka n’ihe ndị bụ isi mejupụtara usoro ụwa niile, na-enweghị ịmachi ya naanị na ihe ndị dị na mbara igwe.
- source_word: καυσούμενα
  choice: ka ọkụ na-ere ha
  rationale: Nke a na-egosipụta usoro ọkụ na-ere ha n’enweghị ịkpọ onye mere ka ọkụ ahụ malite.
- source_word: λυθήσεται
  choice: ga-etisasị
  rationale: λύω ebe a na-enye echiche nke ihe a tọpụrịrị ma ọ bụ kewaa n’iberibe; ‘ga-etisasị’ bụ Igbo eke nke na-ezere ịsụgharị ya naanị dị ka ‘ga-ala n’iyi.’
- source_word: γῆ
  choice: ụwa
  rationale: N’ihi na amaokwu ahụ na-ekwu banyere eluigwe na ihe ndị mejupụtara ụwa niile, ‘ụwa’ ka ‘ala’ dabara.
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: ọrụ ndị dị n’ime ya
  rationale: Nke a na-echekwa obosara ἔργα, nke nwere ike ịgụnye ọrụ, omume, ma ọ bụ ihe e mere n’ụwa.
- source_word: εὑρεθήσεται
  choice: a ga-ahụkwa
  rationale: Nke a bụ ntụgharị kacha nso nke ihe SBLGNT bipụtara, ọbụna ma ahịrịokwu ahụ siri ike ma nwee nghọta ndị ọzọ.
theological_decisions:
- issue: Ihe nkebi ikpeazụ καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται pụtara
  choice: a ga-ahụkwa ụwa na ọrụ ndị dị n’ime ya
  alternative: a ga-ekpughe ụwa na ọrụ ndị dị n’ime ya; ma ọ bụ, a ga-akpọ ụwa na ọrụ ndị dị n’ime ya ọkụ
  rationale: Ihe odide e nyere nwere εὑρεθήσεται, nke pụtara kpọmkwem ‘a ga-ahụ.’ E debeghị otu nkọwa pụrụ iche n’ime isiokwu ahụ; e tinyere nghọta ọzọ na ọdịiche ihe odide n’ala peeji.
- issue: Ihe στοιχεῖα na-ezo aka na ya
  choice: ihe ndị bụ isi mejupụtara eluigwe na ụwa
  alternative: ihe ndị dị na mbara igwe
  rationale: Okwu Grik ahụ nwere ike ịpụta ihe ndị bụ isi mejupụtara usoro ụwa ma ọ bụ ihe ndị dị na mbara igwe. Isiokwu ahụ na-edebe echiche sara mbara, ebe nkọwa ala peeji na-egosi nke ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu ndị na-ada nke ọma n’Igbo, ma e chekwara ihe isi ike na mgbagwoju anya dị n’ihe odide Grik. Ihe ịrịba ama ala peeji [a], [b], na [c] niile dị n’isiokwu.
