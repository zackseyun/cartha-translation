reference: 2 Peter 3:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/005.yaml
  text: 'For they deliberately overlook this: that the heavens existed long ago[a], and the earth was formed out of water and through water by the word of God[c][b],'
translation:
  language: ig
  text: 'N’ihi na ha na-achọghị ịma nke a[a]: eluigwe dị kemgbe oge ochie, ụwa[b] sikwa na mmiri pụta, bụrụkwa nke e guzobere site na mmiri, site n’okwu Chineke[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Nke a na-ezo ha n’ihi na ha chọrọ ka ọ dị otú ahụ,” ma ọ bụ, “Ha ji aka ha na-eleghara nke a anya.” Okwu Grik a jikọtara ihe mmadụ na-adịghị ama na ọchịchọ ya ime otú ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “ala.” Okwu Grik γῆ nwere ike ịpụta ụwa ma ọ bụ ala; n’ebe a, ihe gbasara okike na-akwado “ụwa.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “site n’iwu Chineke.” N’ụzọ ka dabara n’okwu Grik kpọmkwem, ọ bụ “site n’okwu Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας
  choice: N’ihi na ha kpachaara anya na-eleghara nke a anya
  rationale: Nkebiokwu a jikọtara echiche nke amaghị ma ọ bụ ịhụtaghị ihe na ọchịchọ ime otú ahụ. Nsụgharị a na-egosi na ileghara ya anya abụghị ihe mere na mberede, kama ọ bụ ihe ha họọrọ ime.
- source_word: οὐρανοὶ
  choice: eluigwe
  rationale: “Eluigwe” bụ okwu Igbo a na-ejikarị ekwupụta mbara igwe ma ọ bụ heavens n’echiche Akwụkwọ Nsọ; ọ naghị amanye nkọwa karịrị nke Grik.
- source_word: ἔκπαλαι
  choice: kemgbe oge ochie
  rationale: Nke a na-ebute echiche nke ịdị adị site n’oge dị anya gara aga n’asụsụ Igbo doro anya ma dị ugwu.
- source_word: γῆ
  choice: ụwa
  rationale: N’ọnọdụ akụkọ okike a, “ụwa” na-egosi ihe e kere eke a na-atụnyere eluigwe. N’agbanyeghị na okwu Grik enweghị article, Igbo enweghị usoro article kwekọrọ na nke Grik.
- source_word: ἐξ ὕδατος καὶ δι’ ὕδατος
  choice: sikwa na mmiri pụta, e sitekwara na mmiri
  rationale: A na-echekwa ọdịiche dị n’etiti ἐξ, nke na-egosi isi na mmiri pụta, na διά, nke na-egosi site na mmiri ma ọ bụ site n’ọrụ mmiri.
- source_word: συνεστῶσα
  choice: mee ka o guzosie ike
  rationale: Perfect participle a na-egosi na e guzobere ụwa ka ọ dịgide. “Mee ka o guzosie ike” na-egosipụta ma nguzobe ya ma ọnọdụ ya nke kwụsiri ike.
- source_word: τῷ τοῦ θεοῦ λόγῳ
  choice: site n’okwu Chineke
  rationale: Nke a na-egosipụta instrumental dative ma na-echekwa λόγος dịka “okwu,” n’etinyeghị echiche na ọ bụ naanị iwu ma ọ bụ aha pụrụ iche nke Ọkpara.
theological_decisions:
- issue: Ma λόγῳ ọ̀ na-ezo aka kpọmkwem n’Onye ahụ a na-akpọ Okwu ahụ
  choice: site n’okwu Chineke
  alternative: site n’iwu Chineke
  rationale: N’ebe a, λόγος na-egosi okwu Chineke dị irè n’okike, ma amaokwu ahụ ekwughị kpọmkwem na ọ bụ aha e nyere Ọkpara. Nsụgharị a na-echekwa ohere okwu ahụ nwere n’enweghị ịmanye nkọwa Kraịstoloji.
- issue: Otú e si ghọta ọrụ mmiri abụọ ahụ n’usoro okike
  choice: ụwa sikwa na mmiri pụta, e sitekwara na mmiri mee ka o guzosie ike
  alternative: e ji mmiri, sitekwa na mmiri, guzobe ụwa
  rationale: Nsụgharị a na-echekwa ọdịiche dị n’etiti ἐξ na διά ma ghara ikpebi kpọmkwem ụdị usoro kosmoloji Pita bu n’uche.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. “Kpachaara anya na-eleghara” na-ebute ike nke akụkụ uche na nke ọchịchọ dị n’okwu Grik. A haziri ahịrịokwu ahụ ka ọdịiche dị n’etiti “na mmiri pụta” na “site na mmiri” pụta ìhè n’enweghị ịmanye nkọwa kosmoloji pụrụ iche.
