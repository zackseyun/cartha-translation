revisions:
- from: 'N’ihi na ha kpachaara anya na-eleghara nke a anya[a]: eluigwe dị kemgbe oge ochie, ụwa[b] sikwa na mmiri pụta, e sitekwara na mmiri mee ka o guzosie ike site n’okwu Chineke[c].'
  to: 'N’ihi na ha na-achọghị ịma nke a[a]: eluigwe dị kemgbe oge ochie, ụwa[b] sikwa na mmiri pụta, bụrụkwa nke e guzobere site na mmiri, site n’okwu Chineke[c].'
  rationale: The revision preserves the source’s willful-unawareness idiom, the plural/collective biblical sense of “heavens” in Igbo, and the contrast between “out of water” (ἐξ ὕδατος) and “through water” (δι’ ὕδατος). It replaces the stability-focused rendering of συνεστῶσα with “e guzobere,” which better fits the earth’s constitution in the verse, without deciding a detailed cosmological mechanism.
