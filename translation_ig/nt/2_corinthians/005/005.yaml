- from: Onye ahụ kwadebere anyị maka ihe a kpọmkwem bụ Chineke, onye nyere anyị Mmụọ Nsọ ka ọ bụrụ ego mbụ e ji ekwe nkwa na a ga-akwụcha ihe fọdụrụ.[a][b]
  to: Onye kwadebere anyị maka nke a kpọmkwem bụ Chineke, onye nyere anyị ego nkwụnye nke Mmụọ Nsọ.[a][b]
  rationale: A gbanwere nkọwa azụmahịa toro ogologo ka ọ bụrụ “ego nkwụnye,” nke na-ekwupụta ἀρραβών n'ụzọ dị mkpirikpi ma dị n'ụdị Igbo. A gbanwere “Mmụọ Nsọ ka ọ bụrụ” ka ọ bụrụ “nke Mmụọ Nsọ” iji debe enweghị mkpebi zuru ezu dị na genitive Grik ahụ; footnote b na-akọwa ohere ọgụgụ abụọ ahụ. E wepụrụ ‘a ga-akwụcha ihe fọdụrụ’ n'ihi na ọ bụ nkọwa agbakwunyere karịa okwu sitere na Grik.
