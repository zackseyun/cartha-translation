  text: ὁ δὲ κατεργασάμενος ἡμᾶς εἰς αὐτὸ τοῦτο θεός, ⸀ὁ δοὺς ἡμῖν τὸν ἀρραβῶνα τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: ig
  text: Onye kwadebere anyị maka nke a kpọmkwem bụ Chineke, onye nyere anyị ego nkwụnye nke Mmụọ Nsọ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya “ihe e ji ekwe nkwa,” “ego nkwụnye,” ma ọ bụ “akụkụ mbụ a kwụrụ.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a pụrụ ịghọta na Mmụọ Nsọ n'onwe ya bụ ego nkwụnye ahụ, ma ọ bụ na Chineke nyere ego nkwụnye nke metụtara ma ọ bụ na-ekwe nkwa ihe Mmụọ Nsọ ga-eweta n'izu oke.
    reason: alternative_reading
lexical_decisions:
- source_word: κατεργασάμενος
  choice: kwadebere
  rationale: N'ọnọdụ a, okwu ahụ na-egosi na Chineke ji nzube dozie ma mee ka ndị kwere ekwe ruo eru maka ọnọdụ ahụ a na-atụ anya ya; “kwadebere” na-ekwupụta nke a n'Igbo doro anya.
- source_word: εἰς αὐτὸ τοῦτο
  choice: maka ihe a kpọmkwem
  rationale: Nke a na-echekwa nkwusiri ike nke αὐτὸ τοῦτο ma na-ezo aka n'ihe Pọl kwuru n'amaokwu ndị bu ụzọ.
- source_word: θεός
  choice: Chineke
  rationale: Nke a bụ isiokwu e ji amata onye kwadebere anyị.
- source_word: δοὺς
  choice: onye nyere
  rationale: Nkebiokwu nkọwa a bụ ụzọ Igbo dị larịị isi gosipụta participle ahụ, ma na-ejikọta onyinye ahụ na ọrụ nkwadebe Chineke.
- source_word: ἀρραβῶνα
  choice: ego mbụ e ji ekwe nkwa na a ga-akwụcha ihe fọdụrụ
  rationale: 'Nkọwa a na-echekwa ihe atụ azụmahịa ahụ: akụkụ mbụ a kwụrụ nke na-ekwe nkwa na ihe fọdụrụ ga-abịa. Nanị “nkwa” agaghị egosipụta echiche nke ihe e nyelarị ugbu a.'
- source_word: τοῦ πνεύματος
  choice: Mmụọ Nsọ ka ọ bụrụ ego mbụ
  rationale: Igbo a na-agụ nke ọma ma na-egosi nghọta kacha yie ihe Pọl bu n'uche, ya bụ na Mmụọ Nsọ n'onwe ya bụ onyinye mbụ ahụ; e tinyere nkọwa ala peeji iji chekwaa ohere ụtọasụsụ nke genitive ahụ.
- source_word: δὲ
  choice: ahapụrụ ya n'ekwughị ya iche
  rationale: δὲ bụ njikọ dị nro ebe a. Ịgbakwunye “ma” ma ọ bụ “ugbu a” nwere ike ime ka e nwee ọdịiche ma ọ bụ oge nke Grik ahụ na-adịghị ekwusi ike; usoro okwu Igbo na-aga nke ọma n'enweghị ya.
theological_decisions:
- issue: Ihe “ἀρραβὼν τοῦ πνεύματος” pụtara
  choice: Mmụọ Nsọ n'onwe ya bụ onyinye mbụ nke na-ekwe nkwa mmezu zuru ezu n'ọdịnihu.
  alternative: Ọ pụrụ ịpụta ego mbụ ma ọ bụ nkwa nke Mmụọ Nsọ nyere banyere ihe ọ ga-emezu.
  rationale: Ojiji Pọl n'ebe ndị ọzọ na-akwado nghọta na Mmụọ Nsọ bụ onyinye mbụ ahụ, ma ọdịdị genitive nke Grik anaghị eme ka ụzọ nke ọzọ ghara ịdị. Isiokwu ahụ na footnote na-echekwa esemokwu a.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ùgwù. E jiri nkọwa okwu azụmahịa zuru ezu mee ka ihe atụ ἀρραβών doo onye nkịtị anya; “Mmụọ Nsọ” na-egosi na πνεῦμα ebe a bụ Mmụọ Chineke, ọ bụghị mmụọ mmadụ. Akara footnote [a] na [b] dị n'isiokwu.
