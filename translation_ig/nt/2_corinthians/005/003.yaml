  text: if indeed[a], when we have been clothed, we will not be found naked.
translation:
  language: ig
  text: ọ bụrụ n’ezie na[a], mgbe anyị yichara uwe, a gaghị ahụ anyị ka ndị gba ọtọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “ọ bụrụ n’ezie na, mgbe anyị yichara uwe, a gaghị ahụ anyị ka ndị na-enweghị uwe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: ọ bụrụ n’ezie na
  rationale: Nke a na-edobe ma ọnọdụ dị na εἰ ma nkwusi ike dị na γε, n’etinyeghị nkọwa karịrị ihe Grik kwuru.
- source_word: καὶ
  choice: mgbe
  rationale: N’usoro ahịrịokwu a, ọ na-ejikọta echiche dị na participle ahụ n’ụzọ a ga-eji kwuo ya nke ọma n’Igbo; “mgbe” na-egosi njikọ oge/echiche ahụ n’enweghị ntụgharị osisi-osisi.
- source_word: ἐνδυσάμενοι
  choice: anyị yikwasịrị ya
  rationale: Aorist middle participle nke ἐνδύω pụtara ‘anyị yikwasịrị/anyị yiri.’ E tinyere ‘ya’ dịka nnọchiaha ihe a na-eyikwasị nke a ghọtara site n’oyiyi ụlọ na uwe dị n’okwu gbara ya gburugburu.
- source_word: οὐ
  choice: a gaghị
  rationale: Ọ na-enye ngọnarị doro anya nye ngwaa nke ga-eme n’ọdịnihu.
- source_word: γυμνοὶ
  choice: anyị gba ọtọ
  rationale: Nke a bụ ntụgharị kpọmkwem nke γυμνοί ma na-edobe oyiyi uwe Pọl ji mee ihe.
- source_word: εὑρεθησόμεθα
  choice: a gaghị ahụ anyị ka
  rationale: Future passive nke εὑρίσκω ebe a pụtara na a ga-ahụ ma ọ bụ chọpụta ọnọdụ anyị; usoro a bụ Igbo dị ndụ ma na-edobe olu nnara ahụ.
theological_decisions:
- issue: Ihe oyiyi iyi uwe na ịgba ọtọ pụtara
  choice: E debere oyiyi ahụ n’akwụkwọ nsọ n’enweghị ịkọwa kpọmkwem ihe ‘ịgba ọtọ’ na-anọchi anya.
  alternative: Ịkọwa ya dịka ịdị adị n’enweghị ahụ́ n’etiti ọnwụ na mbilite n’ọnwụ, enweghị ahụ́ eluigwe, ma ọ bụ ihere na mkpughe n’ihu Chineke.
  rationale: Amaokwu Grik a akọwaghị kpọmkwem ihe oyiyi ahụ niile pụtara. Ịhapụ ya dịka oyiyi na-echekwa mgbagwoju na esemokwu nkà mmụta okpukpe dị n’ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara oyiyi iyi uwe/ịgba ọtọ na ọnọdụ nwere nkwusi ike nke εἴ γε; e zere itinye nkọwa otu ụka ma ọ bụ ozizi pụrụ iche.
