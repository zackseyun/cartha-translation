  to: ọ bụrụ n’ezie na[a], mgbe anyị yichara uwe, a gaghị ahụ anyị ka ndị gba ọtọ.
  rationale: The revision removes the unexpressed object ‘ya,’ while retaining the clothing image through the natural Igbo expression “yichara uwe.” It also renders the predicate ‘naked’ as a state in which people are found, and keeps the footnote’s ‘unclothed’ alternative without resolving the metaphor theologically.
