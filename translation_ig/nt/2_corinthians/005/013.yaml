review_pass:
  verdict: revise
  source_fidelity: The draft preserves the explanatory γάρ, the paired conditional contrast, and the elliptical datives (‘maka Chineke’ / ‘maka unu’). However, ‘anyị enweghịzi uche anyị’ states that the speakers no longer possess their minds and is stronger and less faithful to ἐξέστημεν, which denotes being beside oneself / appearing out of one’s mind. ‘uche anyị zuru oke’ is not a natural equivalent of σωφρονοῦμεν, which refers to sound, sober, sensible thinking.
  naturalness: ‘anyị apụọla n’uche anyị’ is a more idiomatic and suitably rhetorical Igbo rendering for the first contrast. ‘anyị na-eche echiche nke ọma’ is natural modern Standard Igbo and communicates the sober, sound-minded sense of σωφρονοῦμεν without implying merely mental completeness.
  terminology: ‘maka Chineke’ and ‘maka unu’ appropriately retain the concise beneficiary/reference force of the two Greek datives. The revision maintains the deliberate rhetorical tension and does not diagnose literal insanity or impose a particular account of ecstatic experience.
  issues:
  - severity: medium
    issue: ‘anyị enweghịzi uche anyị’ overstates ἐξέστημεν.
    rationale: It can mean ‘we no longer have our minds,’ suggesting loss of mental capacity, whereas the Greek idiom means being beside oneself / out of one’s mind in a rhetorical sense.
  - severity: medium
    issue: ‘uche anyị zuru oke’ is an unnatural and imprecise rendering of σωφρονοῦμεν.
    rationale: The Greek means being sound-minded, sober, or sensible in judgment. The draft phrase more literally suggests that one’s mind is complete or whole.
  revised_text: N’ihi na ọ bụrụ na anyị apụọla n’uche anyị[a], ọ bụ maka Chineke; ọ bụrụ na anyị na-eche echiche nke ọma[b], ọ bụ maka unu.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị anọghị onwe anyị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anyị nwere ezi uche” / “anyị nọ n’uche anyị ziri ezi.”
    reason: lexical_alternative
  revision_rationale: 'The revised wording better represents the rhetorical contrast between ἐξέστημεν and σωφρονοῦμεν: being beside oneself, on the one hand, and thinking soundly or sensibly, on the other. It retains the source’s compact structure, its ‘for God / for you’ parallelism, and its ambiguity about whether the first description reflects ecstatic conduct, public perception, or rhetorical hyperbole.'
