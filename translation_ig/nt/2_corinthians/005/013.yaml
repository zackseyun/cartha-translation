  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἴτε γὰρ ἐξέστημεν, θεῷ· εἴτε σωφρονοῦμεν, ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/013.yaml
  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na anyị apụọla n’uche anyị[a], ọ bụ maka Chineke; ọ bụrụ na anyị na-eche echiche nke ọma[b], ọ bụ maka unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị anọghị onwe anyị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anyị nwere ezi uche” / “anyị nọ n’uche anyị ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: ọ bụrụ na ... ọ bụrụkwa na
  rationale: Nkebiokwu a na-egosipụta ụzọ abụọ a na-atụnyere. Ikwughachi “ọ bụrụ na” na Igbo na-eme ka arụmụka Pọl dị mfe nghọta ma na-echekwa ike nke ‘ma ọ bụ nke a, ma ọ bụ nke ọzọ.’
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe bu ya ụzọ dịka nkọwa ma ọ bụ ihe kpatara ya.
- source_word: ἐξέστημεν
  choice: anyị enweghịzi uche anyị
  rationale: Nke a na-enye echiche nke ịbụ onye uche ya adịghịzi n’ọnọdụ kwesịrị ekwesị, ma ọ naghị ekpebi na Pọl na-ekwu na ha bụ ndị ara n’ezie. Ọ na-echekwa ọdịiche ya na σωφρονοῦμεν.
- source_word: θεῷ
  choice: maka Chineke
  rationale: Dative a dị nkenke ma na-egosi onye ihe ahụ metụtara ma ọ bụ onye a na-emere ya; “maka Chineke” bụ Igbo doro anya ma kwekọọ na nhazi ahịrịokwu ahụ.
- source_word: σωφρονοῦμεν
  choice: uche anyị zuru oke
  rationale: Nhọrọ a na-egosi ịdị mma n’uche na ezi nghọta, ma na-emegide “anyị enweghịzi uche anyị” n’ụzọ doro anya.
- source_word: ὑμῖν
  choice: maka unu
  rationale: Dative a na-egosi ndị omume Pọl na ndị ọrụ ibe ya baara uru; “maka unu” na-egosipụta nke ahụ nkenke.
theological_decisions:
- issue: Ihe ọdịiche dị n’okwu Pọl banyere ọnọdụ uche ya pụtara
  choice: E chekwara ọdịiche dị n’etiti omume ndị mmadụ pụrụ ile anya dịka nke onye uche ya adịghịzi mma na omume nke onye uche ya zuru oke, n’ekwughị na Pọl kwadoro na ọ bụ ara n’ezie.
  alternative: Ịkọwa ya kpọmkwem dịka ahụmahụ mmụọ nke oke mkpali, ma ọ bụ dịka naanị okwu nlelị ndị iro ya kwuru.
  rationale: Asụsụ Grik dị nkenke ma nwee ike ịpụta ihe karịrị otu. Nsụgharị ahụ anaghị etinye ozizi pụrụ iche banyere ahụmahụ mmụọ, ọ naghịkwa ewepụ esemokwu dị n’okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara mkpụmkpụ na ọdịiche siri ike nke ahịrịokwu Grik, tinyere ‘maka Chineke’ na ‘maka unu.’
