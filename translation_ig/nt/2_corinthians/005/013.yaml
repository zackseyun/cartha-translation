revisions:
- from: N’ihi na ọ bụrụ na anyị enweghịzi uche anyị[a], ọ bụ maka Chineke; ọ bụrụkwa na uche anyị zuru oke[b], ọ bụ maka unu.
  to: N’ihi na ọ bụrụ na anyị apụọla n’uche anyị[a], ọ bụ maka Chineke; ọ bụrụ na anyị na-eche echiche nke ọma[b], ọ bụ maka unu.
  rationale: 'The revised wording better represents the rhetorical contrast between ἐξέστημεν and σωφρονοῦμεν: being beside oneself, on the one hand, and thinking soundly or sensibly, on the other. It retains the source’s compact structure, its ‘for God / for you’ parallelism, and its ambiguity about whether the first description reflects ecstatic conduct, public perception, or rhetorical hyperbole.'
  reviewer_model: gpt-5.6-terra
