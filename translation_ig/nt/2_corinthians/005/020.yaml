id: 2CO.5.20
reference: 2 Corinthians 5:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: ig
  text: 'Ya mere, anyị na-arụ ọrụ dị ka ndị nnọchi anya n’aha Onye e Tere Mmanụ[a], dị ka a ga-asị na Chineke na-arịọ arịrịọ site n’aka anyị. Anyị na-arịọsi unu ike n’aha Onye e Tere Mmanụ: ka e mee ka unu na Chineke dịghachi ná mma[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” Okwu Grik bụ Χριστός, aha-ọrụ nke pụtara “Onye e Tere Mmanụ.”
    reason: alternative_reading
  - marker: b
    text: Okwu Grik ahụ nwere ike igosi “na Chineke” ma ọ bụ “n’ebe Chineke nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: dị ka ndị nnọchi anya Onye E Tere Mmanụ / n’aha Onye E Tere Mmanụ
  rationale: ὑπέρ ya na genitive pụtara ‘maka’ ma ọ bụ ‘n’aha.’ N’ebe a, okwu gbasara ọrụ onye nnọchi anya mere ka ‘dị ka ndị nnọchi anya’ na ‘n’aha’ bụrụ Igbo doro anya. A sụgharịrị Χριστός dị ka aha-ọrụ ‘Onye E Tere Mmanụ’ iji chekwaa ihe aha ahụ pụtara.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a banyere ime ka mmadụ na Chineke dịghachi ná mma.
- source_word: πρεσβεύομεν
  choice: anyị na-eje ozi dị ka ndị nnọchi anya
  rationale: πρεσβεύω pụtara ịrụ ọrụ dị ka onye nnọchi anya. Usoro a bụ Igbo nkịtị ma na-egosikwa ọrụ ahụ na-aga n’ihu.
- source_word: ὡς
  choice: dị ka a ga-asị na
  rationale: 'Ọ na-echekwa ntụnyere dị n’ahịrịokwu Grik: a ga-aghọta ozi ndịozi ahụ dị ka Chineke n’onwe ya na-arịọ site n’aka ha.'
- source_word: παρακαλοῦντος
  choice: na-arịọ arịrịọ
  rationale: N’ọnọdụ a παρακαλέω na-egosi arịrịọ siri ike, ọ bụghị iwu ike ma ọ bụ nkasi obi.
- source_word: δι’ ἡμῶν
  choice: ji anyị
  rationale: διά ya na genitive na-egosi onye ma ọ bụ ụzọ e si eme ihe. ‘Ji anyị’ bụ ụzọ Igbo si ekwu na Chineke na-eme arịrịọ ahụ site n’aka ndịozi.
- source_word: δεόμεθα
  choice: Anyị na-arịọ unu arịrịọ nke ukwuu
  rationale: δέομαι bụ ịrịọsi mmadụ ike. ‘Nke ukwuu’ na-ebute ịdị ngwa na ịdị omimi nke arịrịọ ahụ n’Igbo dị mfe nghọta.
- source_word: καταλλάγητε
  choice: ka e mee ka unu ... dịghachi ná mma
  rationale: Usoro a na-echekwa olu nnabata nke aorist passive imperative, ma ghara ịgbanwe ya ka ọ bụrụ naanị ihe ndị na-anụ okwu ga-eji ike ha mee.
- source_word: τῷ θεῷ
  choice: na Chineke
  rationale: Dative a nwere echiche mmekọrịta nke ime ka mmadụ na Chineke dịghachi ná mma. ‘Na Chineke’ bụ Igbo kachasị eke, ebe nkọwa ala peeji na-echekwa ohere nke ntụgharị nwere ntụziaka ‘nye Chineke.’
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Onye E Tere Mmanụ
  alternative: Kraịst
  rationale: Χριστός bụ aha-ọrụ nke pụtara onye e tere mmanụ. Isi ederede na-egosipụta ihe aha-ọrụ ahụ pụtara; a debere ‘Kraịst,’ ụdị omenala Ndị Kraịst maara nke ọma, n’ala peeji.
- issue: Olu na onye na-eme ihe n’ime ka e nwee mmekọrịta ọzọ
  choice: ka e mee ka unu na Chineke dịghachi ná mma
  alternative: meenụ ka unu na Chineke dịghachi ná mma
  rationale: 'Nhọrọ a na-echekwa esemokwu dị n’amaokwu ahụ: Chineke na-arịọ site n’aka ndịozi, ma a ka na-akpọ ndị na-anụ okwu ka ha nabata ime ka ha na Chineke dịghachi ná mma. Ọ naghị akọwa karịa ihe ederede kwuru banyere otú ọrụ Chineke na nzaghachi mmadụ si arụkọ ọrụ.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Onye E Tere Mmanụ’ bụ aha-ọrụ, ya mere e ji mkpụrụedemede ukwu dee ya. E tinyere akara ala peeji [a] na [b] n’ebe okwu ndị ha na-akọwa dị n’isi ederede.
