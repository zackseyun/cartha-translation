revisions:
- from: 'Ya mere, anyị na-eje ozi dị ka ndị nnọchi anya Onye E Tere Mmanụ[a], dị ka a ga-asị na Chineke ji anyị na-arịọ arịrịọ. Anyị na-arịọ unu arịrịọ nke ukwuu n’aha Onye E Tere Mmanụ: ka e mee ka unu na Chineke dịghachi ná mma[b].'
  to: 'Ya mere, anyị na-arụ ọrụ dị ka ndị nnọchi anya n’aha Onye e Tere Mmanụ[a], dị ka a ga-asị na Chineke na-arịọ arịrịọ site n’aka anyị. Anyị na-arịọsi unu ike n’aha Onye e Tere Mmanụ: ka e mee ka unu na Chineke dịghachi ná mma[b].'
  rationale: The revision explicitly renders both occurrences of ὑπὲρ Χριστοῦ with “n’aha Onye e Tere Mmanụ,” improves the expression of divine agency through the apostles, and retains the passive imperative without specifying mechanisms of reconciliation beyond the Greek text.
