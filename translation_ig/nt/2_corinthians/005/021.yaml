id: 2CO.5.21
reference: 2 Corinthians 5:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: ig
  text: Onye na-amaghị mmehie, Chineke mere ya ka ọ bụrụ mmehie[a] maka anyị, ka anyị wee ghọọ ezi omume nke Chineke[b] n’ime ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “àjà mmehie.” Grik kwuru “mmehie” n’ebe abụọ ahụ; ụfọdụ na-aghọta nke ugboro abụọ dịka àjà mmehie.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ikpe ziri ezi nke Chineke,” ma ọ bụ “ezi omume sitere n’aka Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντα
  choice: na-amaghị
  rationale: Nke a na-edobe okwu Grik nke pụtara ‘ịma’ ma na-egosi na Kraịst enweghị òkè onwe ya na mmehie, n’etinyeghị nkọwa sara mbara dịka ‘emeghị mmehie.’
- source_word: ἁμαρτίαν (first occurrence)
  choice: mmehie
  rationale: Aha nkịtị a bụ ihe γνόντα na-achị kpọmkwem; ‘mmehie’ na-edobe usoro okwu Pọl dị mkpụmkpụ.
- source_word: ὑπὲρ ἡμῶν
  choice: n’ihi anyị
  rationale: Ọ na-egosi ime ihe maka ọdịmma anyị ma ọ bụ n’ọnọdụ anyị, na-amanyeghị otu nkọwa pụrụ iche banyere mgbapụta.
- source_word: ἁμαρτίαν (second occurrence)
  choice: mmehie
  rationale: E ji otu okwu ahụ bụ ‘mmehie’ mee ihe ugboro abụọ na Grik. Idebe ya otú ahụ na-echekwa okwu Pọl siri ike; a kọwara ‘àjà mmehie’ dịka ihe ọzọ a pụrụ ịghọta na nkọwa ala peeji.
- source_word: ἐποίησεν
  choice: mere ya ka ọ bụrụ
  rationale: Nke a na-egosi omume Chineke nke ime ka ọnọdụ ahụ dịrị, n’enweghị ịgbakwunye nkọwa metafiziks nke isi mmalite ahụ na-ekwughị.
- source_word: γενώμεθα
  choice: ka anyị wee ghọọ
  rationale: ‘Ghọọ’ na-anọchi γίνομαι nke ọma, ebe ‘ka ... wee’ na-egosipụta ebumnuche nke ἵνα na subjunctive.
- source_word: δικαιοσύνη
  choice: ezi omume
  rationale: ‘Ezi omume’ bụ okwu Igbo a na-aghọta nke ọma maka δικαιοσύνη n’ọnọdụ a, ma ọ ka na-ahapụ obosara echiche Pọl karịa ịkọwa ya dịka naanị ikpe ziri ezi.
- source_word: θεοῦ
  choice: nke Chineke
  rationale: Ụdị genitive a na-edobe njikọ okwu ahụ n’emegheghị ma ọ bụ nke sitere n’aka Chineke, nke Chineke nwere, ma ọ bụ nke metụtara Chineke.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Nke a na-edobe akpaala okwu Pọl n’ụzọ dị mkpụmkpụ ma dị mkpa, kama ịgbasa ya ka ọ bụrụ ‘n’ịdị n’otu na ya.’
theological_decisions:
- issue: Ihe ‘mere ya ka ọ bụrụ mmehie’ pụtara
  choice: E debere okwu Pọl kpọmkwem, ebe ahịrịokwu mbụ na-egosi na onye ahụ enweghị mmehie; ya mere, ọ pụtaghị na Kraịst ghọrọ onye ajọ omume.
  alternative: A pụrụ ịghọta ‘mmehie’ nke ugboro abụọ dịka ‘àjà mmehie.’
  rationale: Nke a na-echekwa ma ịdị ọcha Kraịst ma esemokwu nkà mmụta okpukpe dị n’okwu Pọl, n’edoziwaghị ya n’ime isi ederede.
- issue: Ike okwu δικαιοσύνη θεοῦ
  choice: ezi omume nke Chineke
  alternative: ikpe ziri ezi nke Chineke; ezi omume sitere n’aka Chineke
  rationale: Njikọ okwu Grik ahụ nwere ọtụtụ nghọta kwe omume. Isi ederede na-ahapụ njikọ ‘nke Chineke’ ka ọ dị, ebe nkọwa ala peeji na-egosi ụzọ ndị ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. A haziri ahịrịokwu ahụ ka onye nkịtị nwee ike ịgụ ya nke ọma, ma e debere mkpụmkpụ na mgbagwoju anya nke okwu Pọl. A tinyere akara nkọwa [a] ozugbo e kwuchara ‘mmehie n’ihi anyị,’ ebe ọ metụtara ‘mmehie’ nke ugboro abụọ; [b] dị n’azụ okwu ‘n’ime ya’ ma na-akọwa njikọ ‘ezi omume nke Chineke.’
