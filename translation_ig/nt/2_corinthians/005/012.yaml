    reason: lexical_alternative
  revision_rationale: The revision strengthens lexical precision for self-commendation, makes the grounds for boasting explicit in idiomatic Igbo, and replaces an unnatural expression for outward appearance. It preserves the Greek contrast between what is external and the heart, as well as the ambiguity of ὑπὲρ ἡμῶν by using “banyere anyị,” without importing a doctrinal interpretation.
