id: 2CO.5.12
reference: 2 Corinthians 5:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: ig
  text: Anyị anaghị akwadokwa onwe anyị n’ihu unu ọzọ,[a] kama anyị na-enye unu ihe mere unu ga-eji na-anya isi banyere anyị, ka unu wee nwee ihe unu ga-eji zaa ndị na-anya isi n’ihe a na-ahụ n’èzí, ọ bụghị n’obi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Anyị anaghị eto onwe anyị n’ihu unu ọzọ.”
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ nkịtị: “ndị na-anya isi n’ihu, ọ bụghị n’obi”; ya bụ, ndị na-anya isi n’ọdịdị elu kama n’ezi ọnọdụ dị n’ime mmadụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνομεν
  choice: anyị anaghị etoghachi onwe anyị n’ihu unu
  rationale: N’ọnọdụ a, okwu ahụ pụtara ịkwado ma ọ bụ ito onwe onye n’ihu ndị ọzọ. Nsụgharị a bụ Igbo dị mfe ma na-edobe nkwupụta Pọl na ọ naghị ebuli onwe ya elu ọzọ.
- source_word: ἀφορμὴν
  choice: ohere
  rationale: “Ohere” na-enye echiche nke ihe e nyere mmadụ ka o jiri mee ihe, ma dabara nke ọma n’Igbo nke oge a.
- source_word: καυχήματος / καυχωμένους
  choice: iji anyị nya isi / ndị na-anya isi
  rationale: Iji otu akpaokwu ahụ n’ebe abụọ ahụ na-edobe njikọ okwu na nrụrịta ụka dị n’amaokwu Grik.
- source_word: ὑπὲρ ἡμῶν
  choice: iji anyị nya isi
  rationale: N’ebe a, ọ pụrụ ịpụta ịnya isi banyere Pọl na ndị ọrụ ibe ya ma ọ bụ ikwu okwu n’aha ha. Ahịrị isi na-ahapụ okwu ahụ n’ụdị dị mkpirikpi, ebe nkọwa ala peeji na-egosi ọdịiche ahụ.
- source_word: ἵνα ἔχητε πρὸς
  choice: ka unu wee nwee ihe unu ga-eji zaa
  rationale: Nke a na-eme ka echiche e zoro n’akpaokwu Grik—ịnwe ihe a ga-ekwu iji zaghachi ndị ọzọ—pụta ìhè n’Igbo nkịtị.
- source_word: ἐν προσώπῳ
  choice: n’ihe dị n’elu anya
  rationale: Ọ na-egosipụta ihe mmadụ na-ahụ n’èzí, ma na-edobe ọdịiche ya na ihe dị n’obi.
- source_word: καρδίᾳ
  choice: n’ihe dị n’obi
  rationale: “Obi” bụ okwu Igbo kwesịrị ekwesị maka καρδία ma na-edobe ihe atụ nke ihe dị n’ime mmadụ.
theological_decisions:
- issue: Ọdịiche dị n’etiti ἐν προσώπῳ na μὴ ἐν καρδίᾳ
  choice: ihe dị n’elu anya megide ihe dị n’obi
  alternative: aha mmadụ nwere n’ihu ọha megide ezi obi ya; ma ọ bụ ọdịdị ihu megide ọnọdụ ime mmụọ
  rationale: Nhọrọ a na-edobe nrụrịta dị n’etiti ihe a na-ahụ n’èzí na ezi ọnọdụ dị n’ime mmadụ, n’emeghị ka ọ bụrụ ozizi pụrụ iche karịa ihe ederede kwuru.
- issue: Ihe ὑπὲρ ἡμῶν pụtara
  choice: ịnya isi banyere anyị
  alternative: ịnya isi ma ọ bụ ikwu okwu n’aha anyị
  rationale: Preposition ahụ nwere ike igosi isiokwu nke ịnya isi ma ọ bụ ịnọchite anya ndịozi. Ahịrị isi bụ nke dị mfe; nkọwa [a] na-echekwa ụzọ ọzọ ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Ịnya isi” na-edobe otu okwu n’akụkụ abụọ nke amaokwu ahụ; “ihe dị n’elu anya” na “ihe dị n’obi” na-eme ka nrụrịta ahụ doo anya n’enweghị itinye nkọwa otu ụka.
