id: 2CO.5.17
reference: 2 Corinthians 5:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε εἴ τις ἐν Χριστῷ, καινὴ κτίσις· τὰ ἀρχαῖα παρῆλθεν, ἰδοὺ γέγονεν ⸀καινά·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: ig
  text: Ya mere, ọ bụrụ na onye ọ bụla nọ n’ime Mesaịa, e nwere okike ọhụrụ[a]; ihe ochie agabigala; lee[b], ihe ọhụrụ abịala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “onye ahụ bụ ihe e kere ọhụrụ.” Okwu Grik ahụ enweghị ngwaa; n’ụzọ nkịtị ọ bụ, “ọ bụrụ na onye ọ bụla nọ n’ime Mesaịa—okike ọhụrụ.”
    reason: alternative_reading
  - marker: b
    text: Ọtụtụ nsụgharị na-asị, “ihe niile aghọọla ihe ọhụrụ.” Ma ederede SBLGNT n’ebe a na-asị naanị, “ihe ọhụrụ abịala”; o nweghị okwu pụtara “ihe niile” kpọmkwem.
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a; ‘Ya mere’ bụ ụzọ doro anya ma bụrụkwa nke e ji asụ Igbo ugbu a.
- source_word: εἴ τις
  choice: ọ bụrụ na onye ọ bụla
  rationale: Ọ na-egosi ọnọdụ metụtara onye ọ bụla, n’etinyeghị echiche na ọ bụ naanị nwoke.
- source_word: ἐν Χριστῷ
  choice: n’ime Mesaịa
  rationale: Ọ na-echekwa Χριστός dị ka aha ọkwá nke Onye Chineke tere mmanụ, ma na-egosikwa okwu Pọl banyere ịdị n’otu na Mesaịa.
- source_word: καινὴ κτίσις
  choice: e nwere okike ọhụrụ
  rationale: Grik enweghị ngwaa n’ebe a. Ntinye ‘e nwere’ na-echekwa nkenke okwu ahụ ma ghara imechi ya n’echiche na ọ bụ naanị onye ahụ ka a na-akpọ ihe e kere ọhụrụ.
- source_word: τὰ ἀρχαῖα
  choice: ihe ochie
  rationale: Ọ na-echekwa ụdị ọtụtụ nke nkọwa Grik e ji dị ka aha, ma hapụ oke ihe ọ na-ezo aka na ya ka ọ saa mbara.
- source_word: παρῆλθεν
  choice: agabigala
  rationale: Oge ngwaa Igbo a na-egosi ihe mere nke nsonaazụ ya ka dị ugbu a, ma kwekọọ na ọdịiche dị n’etiti ihe ochie na ihe ọhụrụ.
- source_word: ἰδοὺ
  choice: lee
  rationale: ‘Lee’ na-adọta uche onye na-agụ ya n’ihe na-esote ma na-echekwa ike nkwupụta ahụ n’Igbo dị ugwu ma dị mfe.
- source_word: γέγονεν καινά
  choice: ihe ọhụrụ abịala
  rationale: Ọ na-egosipụta ọtụtụ nke καινά na ọnọdụ ọhụrụ nke malitere ma ka dị. E tinyeghị ‘ihe niile,’ n’ihi na okwu kwekọrọ na ya adịghị na ederede SBLGNT.
theological_decisions:
- issue: Ịsụgharị Χριστῷ dị ka aha ọkwá ma ọ bụ dị ka aha mmadụ nkịtị
  choice: n’ime Mesaịa
  alternative: n’ime Kraịst
  rationale: ‘Mesaịa’ na-eme ka ọrụ Χριστός dị ka aha ọkwá pụta ìhè, ma ghara iwepụ mkpa echiche Pọl banyere ịdị n’ime Onye Chineke tere mmanụ.
- issue: Otu e si eme ka ahịrịokwu na-enweghị ngwaa, καινὴ κτίσις, zuo oke
  choice: e nwere okike ọhụrụ
  alternative: onye ahụ bụ ihe e kere ọhụrụ
  rationale: Ederede Grik nwere ike igosi ma okike ọhụrụ n’ụzọ sara mbara ma onye ahụ dị ka ihe e kere ọhụrụ. Isi ederede ahọrọghị naanị otu n’ime ha; ihe odide ala peeji na-echekwa nghọta nke na-elekwasị anya n’onye ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘okike ọhụrụ’ iji hapụ obosara na mgbagwoju anya dị n’okwu Grik, ebe ‘lee’ na-echekwa ụda ịdọta uche nke ἰδοὺ. Akara odide ala peeji abụọ dị n’isi ederede n’ebe ha metụtara.
