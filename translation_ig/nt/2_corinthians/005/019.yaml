id: 2CO.5.19
reference: 2 Corinthians 5:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς ὅτι θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/019.yaml
  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: ig
  text: Ya bụ[a], na Chineke nọ n’ime Mesaịa na-eme ka ụwa na ya dịghachi ná mma, na-adịghị agụ mmehie ha megide ha, ma tinye n’aka anyị ozi nke ime ka e dịghachi ná mma.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “N’ime Mesaịa, Chineke nọ na-eme ka ụwa na ya dịghachi ná mma.”
    reason: alternative_reading
  - marker: b
    text: 'N’ụzọ dị nso n’okwu Grik: “tinye n’ime anyị”; ọ pụkwara ịpụta “tinye n’etiti anyị.”'
    reason: lexical_alternative
  - marker: c
    text: 'N’ụzọ nkịtị: “okwu nke ime ka e dịghachi ná mma.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ὅτι
  choice: Ya bụ
  rationale: Ọ na-egosi na ihe na-esote bụ nkọwa nke okwu e kwuru tupu ya; nke a bụ Igbo dị mfe ma dịkwa ebube.
- source_word: θεὸς ἦν ἐν Χριστῷ
  choice: Chineke nọ n’ime Mesaịa
  rationale: E debere ἐν dịka ‘n’ime’ iji ghara ịkọwa ya naanị dịka ụzọ Chineke si rụọ ọrụ; okwu ahụ ka na-edobe omimi na esemokwu dị na Grik.
- source_word: Χριστῷ
  choice: Mesaịa
  rationale: Χριστός bụ aha ọkwá pụtara Onye E Tere Mmanụ; ‘Mesaịa’ na-eme ka ọrụ ya dịka aha ọkwá pụta ìhè.
- source_word: κόσμον
  choice: ụwa
  rationale: ‘Ụwa’ bụ okwu sara mbara ma kwekọọ n’ebe a, karịchaa mmadụ niile nọ n’ọnọdụ nkewa n’ebe Chineke nọ.
- source_word: καταλλάσσων ἑαυτῷ
  choice: na-eme ka ụwa na ya dịghachi ná mma
  rationale: Nke a na-egosi omume Chineke na-aga n’ihu na ntụziaka nke mmezi ahụ bụ n’ebe Chineke nọ.
- source_word: μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν
  choice: na-adịghị agụ mmehie ha megide ha
  rationale: ‘Agụ ... megide ha’ na-edobe ihe atụ nke ịgụkọ ụgwọ, ebe ‘mmehie’ bụ okwu ndị Igbo taa na-aghọta nke ọma maka παραπτώματα.
- source_word: καὶ θέμενος ἐν ἡμῖν
  choice: ma tinye n’aka anyị
  rationale: Nke a na-ekwupụta echiche nke itinye ozi ahụ n’aka ndị ozi ka ha buru ya, n’Igbo eke; nkọwa ọzọ dị nso n’usoro Grik ka edebere n’ala peeji.
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: ozi nke ime ka e dịghachi ná mma
  rationale: λόγος n’ebe a bụ ozi a na-ekwusa, ọ bụghị naanị otu mkpụrụokwu; e jikwa otu okwu mgbọrọgwụ ahụ jikọta ya na καταλλάσσων.
theological_decisions:
- issue: Ihe ἐν Χριστῷ pụtara n’okwu θεὸς ἦν ἐν Χριστῷ
  choice: Chineke nọ n’ime Mesaịa
  alternative: N’ime Mesaịa, Chineke nọ na-eme ka ụwa na ya dịghachi ná mma; ma ọ bụ Chineke sitere n’aka Mesaịa na-eme ya
  rationale: Nhọrọ bụ isi na-anọ nso n’usoro Grik ma ghara ime ἐν ka ọ bụrụ naanị ‘site n’aka’; ya mere ọ na-edobe omimi nke mmekọrịta Chineke na Mesaịa.
- issue: Ịsụgharị Χριστός dịka aha ọkwá
  choice: Mesaịa
  alternative: Kraịst
  rationale: ‘Mesaịa’ na-egosi ihe aha ọkwá ahụ pụtara, ya bụ Onye E Tere Mmanụ, n’enweghị itinye nkọwa otu ụka pụrụ iche.
- issue: Nghọta ἐν ἡμῖν
  choice: tinye n’aka anyị
  alternative: tinye n’ime anyị; tinye n’etiti anyị
  rationale: Isi ederede jiri Igbo eke gosi ibu ọrụ e nyere ndị ozi, ma ihe odide ala peeji na-echekwa ohere okwu ἐν nwere.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ime ka ... dịghachi ná mma’ maka okwu ezinụlọ καταλλάσσω/καταλλαγή ka njikọ okwu abụọ ahụ pụta ìhè. E zere okwu ụka siri ike ebe okwu Igbo nkịtị nwere ike izipụta isi Grik.
