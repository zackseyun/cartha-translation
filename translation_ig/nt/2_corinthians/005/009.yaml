    text: 'Ma ọ bụ, dịka ihe gbara amaokwu a gburugburu si gosi: “ma anyị nọ n’ụlọ n’ahụ ma ọ bụ na anyị anọghị n’ahụ.”'
    reason: alternative_reading
  revision_rationale: The revision preserves Paul’s concise, unexpressed complements in the main text while providing the bodily sense supplied by the immediate context in a corrected footnote. It replaces an unnatural ambition idiom with an idiomatic Standard Igbo expression and corrects the footnote’s inaccurate ‘behind the body’ wording.
