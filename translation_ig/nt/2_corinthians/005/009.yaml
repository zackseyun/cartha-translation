source:
  edition: SBLGNT
  text: διὸ καὶ φιλοτιμούμεθα, εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες, εὐάρεστοι αὐτῷ εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/009.yaml
  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: ig
  text: N’ihi ya, anyị na-emekwa ka ịbụ ndị na-atọ ya ụtọ bụrụ ebumnobi anyị, ma anyị nọ n’ụlọ ma ọ bụ na anyị anọghị n’ụlọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, dịka ihe gbara amaokwu a gburugburu si gosi: “ma anyị nọ n’ụlọ n’ahụ ma ọ bụ na anyị anọghị n’ahụ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu a banyere ibi n’ahụ na ịnọnyere Onyenwe anyị.
- source_word: καὶ
  choice: na-emekwa
  rationale: E tinyere echiche ‘kwa’ n’ime ngwaa a iji gosi njikọ na ihe e kwuru tupu a n’ụzọ Igbo na-aga were were.
- source_word: φιλοτιμούμεθα
  choice: anyị na-emekwa ya ọchịchọ siri ike anyị
  rationale: Na-egosi ebumnobi mmadụ ji ịnụ ọkụ n’obi na-agbalị iru, ọ bụghị naanị atụmatụ dị mfe.
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: ma ànyị nọ n’ụlọ ma ànyị nọ n’ebe ọzọ
  rationale: Na-echekwa okwu atụnyere ibe ha nke Grik—ịnọ n’ụlọ na ịnọ n’ebe ọzọ—n’agbakwụnyeghị ‘ahụ’ n’amaokwu ahụ n’onwe ya.
- source_word: εὐάρεστοι
  choice: ndị na-atọ ya ụtọ
  rationale: Okwu Igbo doro anya nke na-egosi ịbụ onye ihe ọ na-eme na-amasị Chineke, ma zere asụsụ ochie ma ọ bụ siri ike.
- source_word: αὐτῷ
  choice: ya
  rationale: Na-echekwa nnọchiaha Grik; onye a na-ekwu maka ya bụ Onyenwe anyị dịka ihe gbara amaokwu ahụ gburugburu si gosi.
- source_word: εἶναι
  choice: ịbụ
  rationale: 'Na-emezu ebumnobi ahụ: ịbụ ndị na-atọ ya ụtọ.'
theological_decisions:
- issue: Ma a ga-akọwapụta ihe a hapụrụ n’okwu ‘ịnọ n’ụlọ’ na ‘ịnọ n’ebe ọzọ’
  choice: Idowe okwu dị mkpirikpi ‘ma ànyị nọ n’ụlọ ma ànyị nọ n’ebe ọzọ’ n’amaokwu bụ isi
  alternative: ‘ma ànyị nọ n’ụlọ n’ime ahụ ma ànyị nọ n’ebe ọzọ, n’azụ ahụ’
  rationale: Amaokwu 6–8 na-eme ka o doo anya na okwu a metụtara ịnọ n’ahụ ma ọ bụ ịnọpụ n’ahụ, ma amaokwu 9 n’asụsụ Grik ekwughị ‘ahụ’ kpọmkwem. Ya mere, isi amaokwu na-echekwa nkenke na ntakịrị oghere nke Grik, ebe nkọwa ala peeji na-akọwa ihe gbara ya gburugburu.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ịnọ n’ụlọ / ịnọ n’ebe ọzọ’ chekwaa ihe oyiyi na nkenke nke Grik; e tinyere nkọwa gbasara ahụ n’ala peeji. Akara ala peeji [a] pụtara n’isi amaokwu.
