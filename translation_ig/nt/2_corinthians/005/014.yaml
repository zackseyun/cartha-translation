id: 2CO.5.14
reference: 2 Corinthians 5:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀγάπη τοῦ Χριστοῦ συνέχει ἡμᾶς, κρίναντας τοῦτο ⸀ὅτι εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: ig
  text: 'N’ihi na ịhụnanya nke Mezaịa na-akwagide anyị, n’ihi na anyị ekpebiela nke a: otu onye nwụrụ maka mmadụ niile; ya mere, mmadụ niile nwụrụ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη
  choice: ịhụnanya
  rationale: Ọ bụ okwu Igbo a na-ejikarị ekwu ịhụnanya, ọ dịkwa mfe nghọta n’asụsụ Igbo nke oge a.
- source_word: τοῦ Χριστοῦ
  choice: nke Mezaịa
  rationale: Χριστός bụ aha ọkwa pụtara Onye E Tere Mmanụ, ya mere a sụgharịrị ya dị ka “Mezaịa.” Usoro “nke Mezaịa” na-ahapụkwa ụdị njikọ genitive Grik ahụ ka ọ ghara ikpebi onye hụrụ onye n’anya.
- source_word: συνέχει
  choice: na-akwagide
  rationale: N’ebe a, okwu ahụ na-egosi ike dị ukwuu nke na-akpali ma na-achịkwa omume mmadụ; “na-akwagide” na-egosipụta nrụgide ahụ n’Igbo dị mfe ma ghara ime ka ọ bụrụ naanị mmanye sitere n’èzí.
- source_word: κρίναντας
  choice: ebe anyị kwubiri
  rationale: Okwu a na-egosi na ihe Pọl kwuru sitere ná nkwubi okwu ha ruru. “Kwubiri” na-egosipụta ikpe e ji echiche mee, ebe “ebe” na-egosi njikọ ya na ihe kpatara okwu bu ya ụzọ.
- source_word: εἷς
  choice: otu onye
  rationale: Grik kwuru naanị “otu,” ma n’Igbo, itinye “onye” na-eme ka okwu ahụ zuo oke ma doo anya n’enweghị ịkpọ onye ahụ aha ọzọ.
- source_word: ὑπὲρ πάντων
  choice: maka mmadụ niile
  rationale: “Maka” na-egosipụta na ọnwụ ahụ bụ maka ọdịmma na n’aha mmadụ niile, ma ọ naghị amanye nkọwa pụrụ iche dị ka “n’ọnọdụ” ga-eme.
- source_word: ἄρα
  choice: ya mere
  rationale: Ọ na-egosi nkwubi okwu Pọl wepụtara site n’ihe o kwuru tupu ya.
- source_word: οἱ πάντες ἀπέθανον
  choice: mmadụ niile nwụrụ
  rationale: A hapụrụ okwu a n’ụdị ya dị mkpirikpi ma sie ike, n’etinyeghị nkọwa gbasara ụzọ mmadụ niile si nwụọ.
theological_decisions:
- issue: Ihe genitive pụtara na ἡ ἀγάπη τοῦ Χριστοῦ
  choice: A sụgharịrị ya “ịhụnanya nke Mezaịa,” nke na-ahapụ njikọ ahụ ghe oghe.
  alternative: “ịhụnanya Mezaịa nwere n’ebe anyị nọ” ma ọ bụ “ịhụnanya anyị nwere n’ebe Mezaịa nọ”
  rationale: Genitive Grik nwere ike ịpụta na Mezaịa bụ onye na-ahụ n’anya ma ọ bụ na ọ bụ ya ka a hụrụ n’anya. Amaokwu a n’onwe ya adịghị amanye ka a họrọ naanị otu.
- issue: Ihe “mmadụ niile nwụrụ” pụtara
  choice: E debere okwu ahụ kpọmkwem dị ka “mmadụ niile nwụrụ.”
  alternative: “mmadụ niile nwụrụ n’ime Mezaịa dịka onye nnọchiteanya ha” ma ọ bụ “ndị niile kwere ekwe so ya nwụọ”
  rationale: Okwu Pọl dị mkpirikpi ma nwee ibu nkà mmụta okpukpe. Ịgbakwunye otu n’ime nkọwa ndị a ga-ekpebi ihe ederede Grik na-akọwaghị kpọmkwem n’amaokwu a.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “Mezaịa” iji sụgharịa aha ọkwa Χριστός. Ahịrịokwu ahụ debere usoro arụmụka Pọl na ịdị mkpirikpi nke nkwubi okwu ikpeazụ.
