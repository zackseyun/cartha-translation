id: 2CO.5.16
reference: 2 Corinthians 5:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὥστε ἡμεῖς ἀπὸ τοῦ νῦν οὐδένα οἴδαμεν κατὰ σάρκα· ⸀εἰ καὶ ἐγνώκαμεν κατὰ σάρκα Χριστόν, ἀλλὰ νῦν οὐκέτι γινώσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: ig
  text: Ya mere, site ugbu a gaa n’ihu, anyị anaghị ele onye ọ bụla anya n’ụzọ anụ ahụ[a]. Ọ bụrụgodị na anyị amatala Mesaịa n’ụzọ anụ ahụ[b], ma ugbu a anyị anaghịzi ama ya n’ụzọ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site n’echiche mmadụ” ma ọ bụ “dịka ụkpụrụ ụwa si dị.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “Khriston”; a na-asụgharịkarị ya “Kraịst.” N’ebe a, a sụgharịrị ya “Mesaịa” iji chekwaa ihe aha ọkwa ahụ pụtara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a, ma bụrụkwa okwu Igbo doro anya ma dị mma.
- source_word: ἀπὸ τοῦ νῦν
  choice: site ugbu a gaa n’ihu
  rationale: Na-egosi mgbanwe malitere ugbu a nke ga-aga n’ihu.
- source_word: οὐδένα
  choice: onye ọ bụla ... adịghị
  rationale: Usoro a bụ ụzọ Igbo nkịtị si ekwu echiche nke ‘ọ dịghị onye’ n’ahịrịokwu a.
- source_word: οἴδαμεν
  choice: anyị adịghị ele ... anya
  rationale: N’ọnọdụ a, ngwaa ahụ metụtara otú e si amata ma ọ bụ atụle mmadụ; ‘ile ... anya’ na-egosipụta nke a n’Igbo nke ọma.
- source_word: κατὰ σάρκα
  choice: dị ka anụ ahụ si dị
  rationale: Na-edobe okwu Pọl bụ ‘anụ ahụ’ na esemokwu nkà mmụta okpukpe ya, kama ịkọwa ya nanị dị ka echiche mmadụ ma ọ bụ ụkpụrụ ụwa.
- source_word: εἰ καὶ
  choice: Ọ bụrụgodị na
  rationale: Na-echekwa ọdịdị nkwenye nwere mgbagha nke okwu Grik ahụ, n’agbanyeghị na a pụkwara ịghọta ya dị ka ‘ọ bụ ezie na.’
- source_word: ἐγνώκαμεν
  choice: anyị amatala
  rationale: Na-egosipụta ihe mere n’oge gara aga nke ka nwere njikọ n’ihe a na-ekwu ugbu a.
- source_word: Χριστόν
  choice: Mesaịa ahụ
  rationale: Na-asụgharị aha ọkwa Grik Χριστός dịka ‘Mesaịa,’ ma na-eme ka onye a na-ekwu banyere ya doo anya n’Igbo.
- source_word: ἀλλὰ νῦν οὐκέτι
  choice: ma ugbu a anyị anaghịzi
  rationale: Na-egosipụta ọdịiche siri ike n’etiti ụzọ mbụ e si ama ya na nke ugbu a.
- source_word: γινώσκομεν
  choice: ama ya n’ụzọ ahụ
  rationale: ‘Ya’ sitere na Mesaịa ahụ e kwuru n’ahịrịokwu gara aga; ‘n’ụzọ ahụ’ na-egosi na ihe gbanwere bụ ụzọ e si ama ya.
theological_decisions:
- issue: Ihe κατὰ σάρκα pụtara banyere mmadụ na Mesaịa
  choice: dị ka anụ ahụ si dị
  alternative: site n’echiche mmadụ; dịka ụkpụrụ ụwa si dị
  rationale: Nsụgharị a na-edobe okwu Pọl na mgbagwoju anya ya. Ọ na-ekwu banyere ụzọ mmadụ ma ọ bụ nke ụwa si atụle mmadụ; ọ naghị agọnahụ na Mesaịa ghọrọ mmadụ n’ezie.
- issue: Nsụgharị Χριστός
  choice: Mesaịa ahụ
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dịka aha ọkwa; ‘Mesaịa’ na-echekwa ihe aha ahụ pụtara n’enweghị itinye nkọwa otu ụka pụrụ iche.
- issue: Ike nkwenye nke εἰ καὶ
  choice: Ọ bụrụgodị na
  alternative: Ọ bụ ezie na
  rationale: ‘Ọ bụrụgodị na’ na-echekwa ụdị okwu Grik na ezigbo mgbagwoju anya ya, kama ime ka ihe ahụ bụrụ nkwenye doro anya karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ‘anụ ahụ’ n’ahịrịokwu abụọ ahụ iji chekwaa nkwughachi na esemokwu dị na Grik; nkọwa ndị ọzọ dị n’okpuru peeji.
