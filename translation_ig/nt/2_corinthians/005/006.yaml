  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Θαρροῦντες οὖν πάντοτε καὶ εἰδότες ὅτι ἐνδημοῦντες ἐν τῷ σώματι ἐκδημοῦμεν ἀπὸ τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/006.yaml
  text: Therefore[a], we are always confident and know that while we are at home in the body, we are away from the Lord,
translation:
  language: ig
  text: Ya mere, obi siri anyị ike mgbe niile, anyị makwa na mgbe anyị nọ n'ụlọ n'ime ahụ, anyị nọ n'ebe dị anya n'ebe Onyenwe anyị nọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anyị anọghị n'ebe Onyenwe anyị nọ.” Ngwaa Grik ἐκδημοῦμεν kwekọrọ n'ịdị iche na “ịnọ n'ụlọ”; a pụkwara ịsụgharị ya “ịnọ n'ebe dị anya” ma ọ bụ “ịnọghị n'ebe Onyenwe anyị nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρροῦντες
  choice: obi siri anyị ike
  rationale: Na-egosi ọnọdụ obi ike na-aga n'ihu; nke a bụ okwu Igbo dị ugbu a ma kwekọọ n'echiche nke inwe obi ike.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n'okwu ndị bu ụzọ.
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Na-echekwa echiche nke ịdị otú ahụ oge niile.
- source_word: εἰδότες
  choice: anyị makwa
  rationale: Na-egosi ihe ha maara nke ọma; njikọ “-kwa” na-ejikọta ya na obi ike ha.
- source_word: ἐνδημοῦντες
  choice: mgbe anyị nọ n'ụlọ
  rationale: Na-echekwa ihe atụ nke ịnọ n'ụlọ, nke e ji tụnyere ἐκδημοῦμεν.
- source_word: ἐν τῷ σώματι
  choice: n'ime ahụ
  rationale: Nsụgharị locative kwụ ọtọ nke na-ezo aka ná ndụ mmadụ n'anụ ahụ n'enweghị ịgbakwụnye “nke a.”
- source_word: ἐκδημοῦμεν
  choice: anyị nọ n'ebe dị anya
  rationale: Na-egosipụta ịbụ onye na-anọghị n'ụlọ ma na-echekwa ọdịiche ya na “ịnọ n'ụlọ,” n'asụsụ Igbo doro anya.
- source_word: ἀπὸ τοῦ κυρίου
  choice: n'ebe Onyenwe anyị nọ
  rationale: Tinyere “n'ebe dị anya,” ọ na-egosi nkewa nke ebe; κύριος bụ “Onyenwe anyị.”
theological_decisions:
- issue: Ọdịiche ihe atụ dị n'etiti ibi n'anụ ahụ na ịnọnyere Onyenwe anyị
  choice: E chekwara okwu Pọl banyere ịnọ n'ụlọ n'ime ahụ na ịnọ n'ebe dị anya n'ebe Onyenwe anyị nọ.
  alternative: Ịsị na onye kwere ekwe kewapụrụ kpamkpam n'ebe Kraịst nọ, ma ọ bụ ibubata okwu amaokwu nke asatọ banyere ịhapụ ahụ na ịnọnyere Onyenwe anyị.
  rationale: Amaokwu a na-ekwu banyere ndụ dị ugbu a n'anụ ahụ ma jiri ya tụnyere ịnọnyere Onyenwe anyị n'ụzọ a na-atụ anya ya; nsụgharị ahụ anaghị akọwa nkewa ahụ karịa ihe Grik kwuru.
translation_notes:
  register: Standard Igbo dị ugwu ma dị mfe nghọta. E chekwara ihe atụ abụọ kwekọrọ ibe ha—“ịnọ n'ụlọ” na “ịnọ n'ebe dị anya”—n'agbanyeghị na e mere nhazi ahịrịokwu ka ọ daa nke ọma n'Igbo.
