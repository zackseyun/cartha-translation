reference: 2 Corinthians 5:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ, οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: ig
  text: N’ihi na anyị maara na ọ bụrụ na a kwatuo ụlọ anyị nke ụwa a, bụ ụlọikwuu[a], anyị nwere ụlọ e wuru sitere na Chineke, ụlọ nke ejighị aka mmadụ wuo, nke dị ebighị ebi n’eluigwe.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, ‘ụlọ anyị nke ụwa a nke ụlọikwuu.’ Grik jikọtara echiche ‘ụlọ’ na ‘ụlọikwuu’ maka ebe obibi anyị nke na-anwụ anwụ. A pụkwara ịsụgharị ‘a kwatuo’ dịka ‘a bibie’ ma ọ bụ ‘a tọsa.’
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ ọzọ, ‘ụlọ a na-ejighị aka mmadụ arụ.’ Okwu a na-egosi na mmalite ya sitere na Chineke, ọ bụghị n’ọrụ aka mmadụ.
    reason: lexical_alternative
  - marker: c
    text: Grik kwuru ‘anyị nwere,’ ọ bụghị ‘anyị ga-enwe.’ Nke a na-echekwa esemokwu dị n’etiti inwe ya ugbu a na mmezu ya n’ọdịnihu. Grik ji ‘eluigwe’ n’ụdị ọtụtụ, ma ‘n’eluigwe’ bụ ụzọ Igbo si ekwu ya nke ọma.
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδαμεν
  choice: anyị maara
  rationale: Nke a na-egosi ihe a maara nke ọma, ọ bụghị naanị ihe a chọpụtara n’oge ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru tupu ya dịka nkọwa ma ọ bụ ihe ndabere ya.
- source_word: ἐὰν ... καταλυθῇ
  choice: ọ bụrụ na a kwatuo
  rationale: ‘Kwatuo’ nwere ike ịkọwa ịkwatu ụlọ ma ọ bụ ịtọsa ụlọikwuu, ya mere ọ na-echekwa onyonyo ebe obibi ahụ.
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: ụlọikwuu nke ụwa a bụ ebe obibi anyị
  rationale: Nhọrọ a na-echekwa ma echiche ‘ụlọ/ebe obibi’ ma echiche ‘ụlọikwuu,’ n’enweghị iji okwu ‘ahụ’ dochie ihe atụ ahụ.
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: ụlọ e wuru nke si n’aka Chineke
  rationale: A ghọtara οἰκοδομή dịka ihe owuwu n’ezie; ‘si n’aka Chineke’ na-egosi isi mmalite ya n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: ἔχομεν
  choice: anyị nwere
  rationale: A hapụrụ ngwaa ahụ n’oge dị ugbu a dịka Grik si dị, kama ịgbanwe ya ka ọ bụrụ ‘anyị ga-enwe.’
- source_word: οἰκίαν ἀχειροποίητον
  choice: ụlọ ... nke aka mmadụ na-ewughị
  rationale: Nke a na-egosi nke ọma na ụlọ ahụ esighị n’ọrụ mmadụ, ma na-echekwa ụda Akwụkwọ Nsọ nke okwu ahụ.
- source_word: αἰώνιον
  choice: ebighị ebi
  rationale: Ọ na-egosi ịdịgide mgbe niile, n’ụzọ dị iche n’ebe obibi ụwa nke a pụrụ ịkwatu.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: n’eluigwe
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke dị ùgwù si ekwu ebe dị n’eluigwe; Igbo anaghị achọ ka e gosipụta ọtụtụ eluigwe n’ụdị mkpụrụokwu dịka Grik.
theological_decisions:
- issue: Ihe ụlọ na ụlọikwuu na-anọchi anya ya
  choice: E chekwara ihe atụ ụlọ na ụlọikwuu n’ederede bụ isi.
  alternative: ‘Ọ bụrụ na e bibie ahụ anyị nke ụwa a.’
  rationale: Ịkpọ ya ‘ahụ’ ozugbo ga-akọwapụta ihe Pọl hapụrụ n’ụdị ihe atụ ma mee ka njikọ ụlọikwuu, ụlọ e wuru, na ụlọ na-abụghị ọrụ aka mmadụ ghara ịpụta nke ọma.
- issue: Oge ἔχομεν na-egosi
  choice: ‘anyị nwere’
  alternative: ‘anyị ga-enwe’
  rationale: Grik ji oge dị ugbu a. Nsụgharị ahụ echekwara esemokwu dị n’etiti inwe ya ugbu a na mmezu ya n’ọdịnihu, kama idozi esemokwu nkà mmụta okpukpe ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara onyonyo ụlọ na ụlọikwuu, ma zere ịkpọ ebe obibi ahụ ‘ahụ’ ozugbo. E tinyere akara nkọwa ụkwụ [a], [b], na [c] niile n’ederede bụ isi.
