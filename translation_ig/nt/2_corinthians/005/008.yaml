  text: θαρροῦμεν δὲ καὶ εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: ig
  text: Ma obi siri anyị ike, ọ ga-akakwa anyị mma ịpụ n’ahụ́ na ịnọ n’ụlọ n’ebe Onyenwe anyị nọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị anọghị n’ahụ́, anyị nọkwa n’ụlọ n’ebe Onyenwe anyị nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θαρροῦμεν
  choice: obi siri anyị ike
  rationale: Nke a na-egosi obi ike na ntụkwasị obi na-adịgide adịgide; ọ bụkwa okwu Igbo dị mfe ma bụrụ nke sitere n’okwu a kpọrọ aha.
- source_word: δὲ
  choice: Ya mere
  rationale: N’ebe a, δέ na-aga n’ihu n’echiche e kwuru n’amaokwu ndị bu ụzọ ma na-egosi ihe sitere na ya, ọ bụghị nnukwu mmegide.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye -kwa jikọtara obi ike ha na ihe ha na-ahọrọ n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: εὐδοκοῦμεν μᾶλλον
  choice: anyị na-ahọrọkwa
  rationale: Ngwakọta a na-egosi ihe mmadụ họọrọ karịa ihe ọzọ; ‘na-ahọrọ’ na-enye echiche ahụ n’Igbo nke oge a n’enweghị ịgbakwunye nkọwa.
- source_word: ἐκδημῆσαι ἐκ τοῦ σώματος
  choice: ka anyị pụọ n’ahụ́
  rationale: ‘Pụọ’ na-echekwa echiche nke ịnọghị n’ebe mmadụ bi, ebe ‘n’ahụ́’ na-edobe ahụ́ dịka ihe e kwuru kpọmkwem, n’enweghị ịsụgharị ya ozugbo dịka ọnwụ.
- source_word: ἐνδημῆσαι πρὸς τὸν κύριον
  choice: gaa biri n’ebe Onyenwe anyị nọ
  rationale: ‘Biri n’ebe ... nọ’ na-egosipụta ihe megidere ‘pụọ’ ma na-echekwa ihe atụ nke ebe obibi; ọ na-egosikwa ịnọnyere Onyenwe anyị n’ụzọ Igbo doro anya.
theological_decisions:
- issue: Ma a ga-akọwa okwu Pọl kpọmkwem dịka ozizi banyere ọnọdụ mmadụ mgbe ọ nwụsịrị
  choice: E debere ihe atụ ya banyere ịpụ n’ahụ́ na ibi n’ebe Onyenwe anyị nọ, n’etinyeghị ‘mgbe anyị nwụsịrị’ ma ọ bụ ‘n’eluigwe.’
  alternative: Ịsụgharị ya dịka ‘ịnwụ ma gaa ịnọnyere Onyenwe anyị n’eluigwe.’
  rationale: Amaokwu ahụ na-egosi echiche nke ịnọnyere Onyenwe anyị mgbe mmadụ hapụrụ ahụ́, ma okwu Grik ekwughị ‘ọnwụ’ ma ọ bụ ‘eluigwe’ kpọmkwem. Ya mere, nsụgharị ahụ na-echekwa ihe atụ na nrụgide nkà mmụta okpukpe dị n’amaokwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘obi siri anyị ike’ maka ntụkwasị obi/obi ike, ma jiri ‘pụọ’ na ‘biri n’ebe ... nọ’ chekwaa ihe atụ Grik nke ịnọ n’èzí obodo na ịnọ n’ụlọ. Akara ụda dị na ‘ahụ́’ na-enyere aka igbochi mgbagwoju anya.
