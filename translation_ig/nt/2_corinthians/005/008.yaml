revisions:
- from: Ya mere, obi siri anyị ike, anyị na-ahọrọkwa ka anyị pụọ n’ahụ́, gaa biri n’ebe Onyenwe anyị nọ.[a]
  to: Ma obi siri anyị ike, ọ ga-akakwa anyị mma ịpụ n’ahụ́ na ịnọ n’ụlọ n’ebe Onyenwe anyị nọ.[a]
  rationale: The revision makes the comparative preference in εὐδοκοῦμεν μᾶλλον explicit and keeps the Greek contrast of being away from the body and at home with the Lord. It removes added implications of travelling and permanently dwelling, while retaining the source’s metaphor and theological restraint.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys confidence and the contrast between being away from the body and being at home with the Lord. However, “anyị na-ahọrọkwa” does not clearly carry μᾶλλον (“rather/more”), and “gaa biri” adds a motion-and-settled-residence sense that is stronger than the paired Greek home/away metaphor.
  naturalness: The proposed revision uses idiomatic Standard Igbo. “Ọ ga-akakwa anyị mma” naturally expresses the comparative preference, while “ịnọ n’ụlọ” retains the home metaphor without implying permanent residence.
  terminology: “Onyenwe anyị” is an appropriate established rendering of κύριος here. “Ahụ́” correctly renders σῶμα. The revision avoids adding “death” or “heaven.”
  issues:
  - severity: medium
    issue: The comparative force of μᾶλλον is not explicit.
    rationale: “anyị na-ahọrọkwa” means “we also choose/prefer,” but it does not clearly say that this is preferred more/rather. “Ọ ga-akakwa anyị mma” supplies the required comparative preference.
  - severity: medium
    issue: “gaa biri n’ebe Onyenwe anyị nọ” over-specifies the second infinitive.
    rationale: “Gaa” introduces travel, and “biri” can suggest ongoing or permanent residence. ἐνδημῆσαι is paired with ἐκδημῆσαι in a home/away metaphor; “ịnọ n’ụlọ” preserves that metaphor more closely.
  revised_text: Ma obi siri anyị ike, ọ ga-akakwa anyị mma ịpụ n’ahụ́ na ịnọ n’ụlọ n’ebe Onyenwe anyị nọ.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị anọghị n’ahụ́, anyị nọkwa n’ụlọ n’ebe Onyenwe anyị nọ.”
    reason: lexical_alternative
  revision_rationale: The revision makes the comparative preference in εὐδοκοῦμεν μᾶλλον explicit and keeps the Greek contrast of being away from the body and at home with the Lord. It removes added implications of travelling and permanently dwelling, while retaining the source’s metaphor and theological restraint.
