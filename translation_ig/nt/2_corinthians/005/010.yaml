review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the necessity of universal disclosure before the Messiah’s judicial seat, individual recompense, and the good/bad contrast. However, “ime ka anyị niile pụta ìhè” is a less direct causative construction for the Greek passive, and “ihe ruuru ya dịka” is somewhat redundant and less closely aligned with the relation of recompense to what each person did.
  naturalness: The revised wording uses the natural Standard Igbo construction “anyị niile aghaghị ịpụta ìhè” and makes the final good/bad contrast explicitly refer to the deed or matter under evaluation.
  terminology: “Oche ikpe Mesaịa” appropriately preserves the judicial force of βῆμα and renders Χριστός as the title “Mesaịa.” No doctrinal narrowing is introduced. “Site n’ahụ” retains the instrumental sense of διά while the note preserves the viable embodied-life alternative.
  issues:
  - severity: low
    issue: The main clause uses an impersonal causative expression, “a ghaghị ime ka anyị niile pụta ìhè.”
    rationale: Although intelligible, it is less direct and less idiomatic than “anyị niile aghaghị ịpụta ìhè,” which better renders δεῖ + passive infinitive without implying an unspecified human agent.
  - severity: low
    issue: “Nata ihe ruuru ya dịka ihe o mere” is slightly repetitive and the closing adjectives lack an explicit referent in Igbo.
    rationale: “Nata ihe kwekọrọ n’ihe o mere” more directly expresses recompense corresponding to conduct; “ma ihe ahụ ọ dị mma ma ọ dị njọ” naturally identifies what the good/bad contrast modifies.
  revised_text: N’ihi na anyị niile aghaghị ịpụta ìhè[a] n’ihu oche ikpe Mesaịa[b], ka onye ọ bụla nata ihe kwekọrọ n’ihe o mere site n’ahụ ya[c], ma ihe ahụ ọ dị mma ma ọ dị njọ.
