revisions:
- from: N’ihi na a ghaghị ime ka anyị niile pụta ìhè[a] n’ihu oche ikpe Mesaịa[b], ka onye ọ bụla wee nata ihe ruuru ya dịka ihe o mere site n’ahụ ya[c], ma ọ̀ dị mma ma ọ̀ dị njọ.
  to: N’ihi na anyị niile aghaghị ịpụta ìhè[a] n’ihu oche ikpe Mesaịa[b], ka onye ọ bụla nata ihe kwekọrọ n’ihe o mere site n’ahụ ya[c], ma ihe ahụ ọ dị mma ma ọ dị njọ.
  rationale: The revision makes only safe grammatical and idiomatic adjustments. It retains the Greek passive sense of open manifestation, the judicial setting, the titular rendering Mesaịa, the distributive accountability of each person, and the broad moral contrast without deciding the theological scope or outcome of the judgment.
