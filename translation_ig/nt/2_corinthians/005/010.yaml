id: 2CO.5.10
reference: 2 Corinthians 5:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: ig
  text: N’ihi na anyị niile aghaghị ịpụta ìhè[a] n’ihu oche ikpe Mesaịa[b], ka onye ọ bụla nata ihe kwekọrọ n’ihe o mere site n’ahụ ya[c], ma ihe ahụ ọ dị mma ma ọ dị njọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anyị niile apụta n’ihu oche ikpe Mesaịa.” Okwu Grik ahụ nwere ike ịpụta naanị ịpụta, ma ọ nwekwara ike ịpụta ime ka ihe mmadụ bụ pụta ìhè ma ọ bụ kpughee ya.
    reason: lexical_alternative
  - marker: b
    text: Grik bụ “Kraịst”; ebe a, okwu ahụ bụ utu aha nke pụtara “Mesaịa,” ya bụ, Onye E Tere Mmanụ.
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsụgharị ya, “n’ahụ ya,” ma ọ bụ, “maka ihe ndị o mere site n’ahụ.” Nkebi okwu Grik ahụ dị mkpirikpi ma nwee ike igosi ahụ dịka ụzọ e si mee omume ma ọ bụ dịka ọnọdụ ndụ mmadụ na omume ya nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθῆναι
  choice: ime ka anyị niile pụta ìhè
  rationale: Okwu a dị n’ụdị nnara ma na-egosi na a ga-eme ka mmadụ hụ anyị nke ọma ma kpughee ihe anyị bụ; ọ karịrị naanị ịbịa n’ihu ebe ikpe.
- source_word: βήματος
  choice: oche ikpe
  rationale: N’ebe a, βῆμα bụ oche ma ọ bụ ebe onyeikpe na-anọ ekpe ikpe. “Oche ikpe” bụ okwu Igbo doro anya nke na-echekwa ọnọdụ ikpe dị n’amaokwu ahụ.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: Χριστός na-arụ ọrụ dị ka utu aha n’ebe a; “Mesaịa” na-echekwa echiche nke Onye E Tere Mmanụ.
- source_word: κομίσηται
  choice: nata ihe ruuru ya
  rationale: Okwu ahụ na-egosi ịnata ihe kwekọrọ n’omume mmadụ, ma nke ọma ma nke njọ.
- source_word: τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν
  choice: dịka ihe o mere site n’ahụ ya
  rationale: Nsụgharị a na-echekwa ma echiche nke ihe omume kwekọrọ na ụgwọ a natara ma διά nke na-egosi na e mere ya site n’ahụ, n’agbanyeghị na Igbo nwekwara ike ikwu “n’ahụ.”
- source_word: ἕκαστος
  choice: onye ọ bụla
  rationale: 'Ọ na-echekwa nkwusara nkesa nke okwu Grik ahụ: onye nke ọ bụla ga-aza maka omume nke ya.'
- source_word: ἀγαθὸν ... φαῦλον
  choice: ọ̀ dị mma ... ọ̀ dị njọ
  rationale: Nke a na-echekwa ntụnyere omume sara mbara dị n’etiti ihe ọma na ihe ọjọọ ma ghara ime ka φαῦλον sie ike karịa ka ọnọdụ ahụ chọrọ.
theological_decisions:
- issue: Ụdị na oke ikpe a na-ekpe n’ihu Mesaịa
  choice: E debere okwu ikpe na ịza ajụjụ nke mmadụ niile n’ụzọ sara mbara dịka amaokwu ahụ si kwuo.
  alternative: Ịkọwa ya kpọmkwem dịka ikpe ụgwọ ọrụ nke naanị ndị kwere ekwe, ma ọ bụ dịka ikpe ikpeazụ nke mmadụ niile.
  rationale: Amaokwu ahụ kwuru na a ghaghị ime ka “anyị niile” pụta ìhè nakwa na onye ọ bụla ga-anata ihe kwekọrọ n’omume ya, ma o kọwaghị n’onwe ya nkewa usoro nkà mmụta okpukpe banyere ndị ikpe ahụ metụtara ma ọ bụ nsonaazụ ikpe ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Pụta ìhè” na-echekwa ike nke mkpughe dị na φανερωθῆναι; “oche ikpe” na-eme ka ọnọdụ iwu doo anya; “Mesaịa” na-edebe Χριστός dịka utu aha. E zere ịkọwa n’ime amaokwu ahụ ma ikpe a ọ bụ naanị maka ndị kwere ekwe, maka ụgwọ ọrụ, ma ọ bụ ikpe ikpeazụ nke mmadụ niile.
