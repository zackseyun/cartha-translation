    text: A pụkwara ịsụgharị ya, “n’ihi ọdịmma mmadụ niile” ma ọ bụ “n’ọnọdụ mmadụ niile.” Okwu Grik ὑπέρ, nke dị ugboro abụọ n’amaokwu a, nwere ike igosi uru mmadụ na-enweta ma ọ bụ nnọchite anya.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “e mere ka o bilie” dị n’olu passive; a pụkwara ịsụgharị ya, “biliri.”
    reason: lexical_alternative
  revision_rationale: The revision uses ‘maka’ for both instances of ὑπέρ to avoid a causal reading and to preserve the source’s repeated beneficiary/representative relation. It makes the ellipted ‘live’ explicit in the second half of the contrast, using natural Standard Igbo. It also preserves the passive voice of ἐγερθέντι without adding ‘from the dead’ to the main text. The footnotes retain lexical alternatives and grammatical information without resolving theological debates.
