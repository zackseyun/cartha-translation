id: 2CO.5.15
reference: 2 Corinthians 5:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: ig
  text: Ọ nwụrụ maka mmadụ niile,[a] ka ndị dị ndụ gharazie ịdị ndụ maka onwe ha, kama ka ha dị ndụ maka onye ahụ nwụrụ ma bụrụ onye e mere ka o bilie maka ha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ihi ọdịmma mmadụ niile” ma ọ bụ “n’ọnọdụ mmadụ niile.” Okwu Grik ὑπέρ, nke dị ugboro abụọ n’amaokwu a, nwere ike igosi uru mmadụ na-enweta ma ọ bụ nnọchite anya.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “e mere ka o bilie” dị n’olu passive; a pụkwara ịsụgharị ya, “biliri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ πάντων
  choice: n’ihi mmadụ niile
  rationale: ὑπέρ na genitive na-egosi uru ma ọ bụ ịnọchite anya ndị ọzọ. ‘N’ihi mmadụ niile’ bụ Igbo doro anya ma na-edebe obosara nke πάντων n’enweghị imechi ya n’otu nkọwa ozizi.
- source_word: ἀπέθανεν
  choice: Ọ nwụrụ
  rationale: Aorist indicative na-akọ ihe mere n’oge gara aga; isiokwu ‘Ọ’ sitere n’okwu gbara amaokwu ahụ gburugburu.
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ na-egosi ebumnuche ma ọ bụ ihe a tụrụ anya na ọ ga-esi na ọnwụ ahụ pụta.
- source_word: οἱ ζῶντες
  choice: ndị dị ndụ
  rationale: Nke a na-anọchi ndị mmadụ ndị na-adị ndụ; nsụgharị ahụ na-edebe okwu ahụ n’ụzọ sara mbara dịka Grik si mee.
- source_word: μηκέτι
  choice: gharazie
  rationale: ‘Gharazie’ na-egosi nkwụsị nke ụzọ ndụ gara aga ma kwekọọ na μηκέτι.
- source_word: ἑαυτοῖς ζῶσιν
  choice: ịdị ndụ maka onwe ha
  rationale: Dative reflexive na ζάω na-egosi onye ndụ mmadụ lekwasịrị anya n’ebe ọ nọ ma ọ bụ onye ọ na-abara uru; ‘maka onwe ha’ bụ Igbo eke.
- source_word: ἀλλὰ τῷ ... ἀποθανόντι καὶ ἐγερθέντι
  choice: kama ka ha dịrị onye ahụ nwụrụ ma bụrụ onye e mere ka o si n’ọnwụ bilie
  rationale: ‘Dịrị onye ahụ’ na-eburu echiche nke ibi ndụ maka ya, ebe okwu a na-edebe participles abụọ ahụ na passive nke ἐγερθέντι.
- source_word: ἐγερθέντι
  choice: onye e mere ka o si n’ọnwụ bilie
  rationale: 'Nkebiokwu a na-edebe passive Grik: onye ọzọ, nke a na-akpọghị aha n’amaokwu a, mere ka o bilie.'
- source_word: ὑπὲρ αὐτῶν
  choice: n’ihi ha
  rationale: E ji otu ntụgharị ahụ mee ὑπέρ ugboro abụọ iji debe nkwughachi na njikọ dị n’amaokwu ahụ.
theological_decisions:
- issue: Oke πάντων / αὐτῶν
  choice: ‘mmadụ niile’ na ‘ha,’ n’enweghị ibelata ndị okwu ndị a na-ezo aka na ha
  alternative: Ịkọwa ya kpọmkwem dịka mmadụ niile n’enweghị oke, ma ọ bụ naanị ndị kwere ekwe / ndị Kraịst nọchitere anya ha
  rationale: Amaokwu ahụ ji okwu sara mbara mee ihe ma ọ naghị edozi n’onwe ya arụmụka ozizi banyere oke ọnwụ Kraịst.
- issue: Passive nke ἐγερθέντι
  choice: ‘onye e mere ka o si n’ọnwụ bilie’
  alternative: ‘onye biliri n’ọnwụ’
  rationale: Nhọrọ a na-edebe olu passive nke Grik ma ghara ịkọwa onye mere ihe ahụ n’ebe amaokwu ahụ ekwughị ya kpọmkwem.
- issue: Ike nkọwa nke ὑπέρ
  choice: ‘n’ihi,’ tinyere nkọwa ala peeji banyere ‘n’ọnọdụ / maka ọdịmma’
  alternative: Ịsụgharị ya ozugbo dịka ‘n’ọnọdụ’ ma mee ka echiche nnọchite anya bụrụ naanị nkọwa a ga-anabata
  rationale: ὑπέρ nwere ike igosi uru na nnọchite anya. Isiokwu ahụ kwesịrị ịdị eke n’Igbo ma debe oghere nkọwa nke Grik.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E ji ‘onye ahụ’ zere ịtinye okike karịa ka usoro participle Grik chọrọ, ma n’ọnọdụ akwụkwọ ozi a onye a bụ Kraịst. E debere ahịrịokwu ahụ dịka otu njikọ echiche, ya na ọdịiche dị n’etiti ibi ndụ maka onwe na ịdịrị onye nwụrụ ma bụrụ onye e mere ka o bilie.
