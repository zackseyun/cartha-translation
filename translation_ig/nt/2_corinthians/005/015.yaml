revisions:
- from: Ọ nwụrụ n’ihi mmadụ niile[a], ka ndị dị ndụ gharazie ịdị ndụ maka onwe ha, kama ka ha dịrị onye ahụ nwụrụ ma bụrụ onye e mere ka o si n’ọnwụ bilie n’ihi ha.[b]
  to: Ọ nwụrụ maka mmadụ niile,[a] ka ndị dị ndụ gharazie ịdị ndụ maka onwe ha, kama ka ha dị ndụ maka onye ahụ nwụrụ ma bụrụ onye e mere ka o bilie maka ha.[b]
  rationale: The revision uses ‘maka’ for both instances of ὑπέρ to avoid a causal reading and to preserve the source’s repeated beneficiary/representative relation. It makes the ellipted ‘live’ explicit in the second half of the contrast, using natural Standard Igbo. It also preserves the passive voice of ἐγερθέντι without adding ‘from the dead’ to the main text. The footnotes retain lexical alternatives and grammatical information without resolving theological debates.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:38Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Christ's death, the purpose clause, the contrast with self-directed living, and the passive sense of ἐγερθέντι. However, the first and second renderings of ὑπέρ should more directly convey benefit/on-behalf-of rather than the potentially causal ‘n’ihi’ (‘because of’). The purposive contrast is also clearer when the dative relation is rendered consistently as living ‘maka’ the risen one.
  naturalness: ‘Ndị dị ndụ’ and ‘gharazie ịdị ndụ maka onwe ha’ are understandable, but ‘ka ha dịrị onye ahụ’ is less idiomatic and can mean merely ‘be with/belong to’ rather than ‘live for.’ Repeating ‘dị ndụ’ with ‘maka onye ahụ’ gives clear, natural Standard Igbo.
  terminology: ‘E mere ka o si n’ọnwụ bilie’ adequately preserves the Greek passive, though ‘e mere ka o bilie’ is more direct and avoids adding ‘si n’ọnwụ,’ which is not explicit in the Greek. ‘N’ihi mmadụ niile’ is best revised to ‘maka mmadụ niile’ in this context; the footnote can retain representative alternatives without asserting a particular atonement theory.
  issues:
  - severity: medium
    issue: The main-text rendering ‘n’ihi’ for both occurrences of ὑπέρ is potentially causal in Igbo.
    rationale: In this context ὑπέρ with the genitive means ‘for/on behalf of,’ not ‘because of.’ ‘Maka’ more reliably expresses the intended beneficiary/representative relation while retaining theological breadth.
  - severity: medium
    issue: ‘Kama ka ha dịrị onye ahụ’ does not explicitly express the continued verb ‘live’ in the contrast.
    rationale: The Greek contrasts living for oneself with living for the one who died and was raised. ‘Kama ka ha dị ndụ maka onye ahụ’ is clearer and more idiomatic.
  - severity: low
    issue: The resurrection phrase adds ‘si n’ọnwụ’ to the main text.
    rationale: The addition is contextually true but not stated in ἐγερθέντι. ‘E mere ka o bilie’ keeps the passive without adding wording.
  revised_text: Ọ nwụrụ maka mmadụ niile,[a] ka ndị dị ndụ gharazie ịdị ndụ maka onwe ha, kama ka ha dị ndụ maka onye ahụ nwụrụ ma bụrụ onye e mere ka o bilie maka ha.[b]
  revised_footnotes:
