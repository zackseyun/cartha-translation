  text: καὶ γὰρ ἐν τούτῳ στενάζομεν, τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ ἐπενδύσασθαι ἐπιποθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/002.yaml
  text: For indeed in this we groan[a], longing to put on our dwelling from heaven[b],
translation:
  language: ig
  text: N’ihi na, n’ezie, n’ime nke a, anyị na-asụ ude, na-achọsi ike iyi n’elu anyị ebe obibi anyị nke si n’eluigwe[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ebe obibi anyị nke dị n’eluigwe.” Ma okwu Grik n’ụzọ nkịtị bụ “ebe obibi anyị nke si n’eluigwe,” nke na-emesi ebe o si bịa ike.
    reason: lexical_alternative
  - marker: b
    text: Ngwaa Grik a pụrụ inwe echiche nke “iyi n’elu,” dịka mmadụ si eyi otu uwe n’elu uwe ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: N’ihi na, n’ezie
  rationale: Nkebiokwu a na-ejikọta amaokwu a na nke bu ya ụzọ, na-akọwakwa ya ma na-emesi ya ike nwayọọ.
- source_word: ἐν τούτῳ
  choice: n’ime nke a
  rationale: Nke a na-edobe mgbagwoju anya dị n’okwu Grik; o nwere ike izo aka n’ọnọdụ ahụ mmadụ nọ na ya ugbu a, ma amaokwu ahụ akpọghị ‘ụlọikwuu’ aha ọzọ.
- source_word: στενάζομεν
  choice: anyị na-asụ ude
  rationale: ‘Ịsụ ude’ na-egosi ibu dị n’ime mmadụ na agụụ siri ike, n’etinyeghị nkọwa karịrị ihe okwu Grik kwuru.
- source_word: τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ
  choice: ebe obibi anyị nke si n’eluigwe
  rationale: ‘Ebe obibi’ na-edobe ihe atụ nke οἰκητήριον, ebe ‘nke si n’eluigwe’ na-egosi isi mmalite dịka ἐξ οὐρανοῦ si kwuo, kama ịgbanwe ya ka ọ bụrụ naanị àgwà nke ebe obibi ahụ.
- source_word: ἐπενδύσασθαι
  choice: iyi ... n’elu anyị
  rationale: Nke a na-edobe ihe atụ nke iyi uwe na echiche nke iyi ihe n’elu ihe ọzọ, bụ́ nghọta pụrụ ịdị na ngwaa Grik a.
- source_word: ἐπιποθοῦντες
  choice: na-achọsi ike
  rationale: Nkebiokwu a na-egosi agụụ siri ike nke na-eso ịsụ ude ahụ, ma ọ bụ okwu Igbo doro anya ma dịkwa ugbu a.
theological_decisions:
- issue: Ihe ihe atụ nke ebe obibi si n’eluigwe na iyi ya pụtara
  choice: E debere ma ihe atụ nke ebe obibi ma nke iyi uwe, n’agwaghị kpọmkwem ụdị ọnọdụ ahụ ọ bụ.
  alternative: Ịkọwa ya kpọmkwem dịka ‘ahụ mbilite n’ọnwụ’ ma ọ bụ ‘ụlọ anyị n’eluigwe.’
  rationale: Amaokwu ahụ n’onwe ya jikọtara ihe atụ abụọ ma ọ kọwaghị ma ọ na-ekwu kpọmkwem banyere ahụ mbilite n’ọnwụ, ọnọdụ etiti, ma ọ bụ ebe obibi nke oge ikpeazụ. Nsụgharị ahụ na-edobe esemokwu nkà mmụta okpukpe a kama idozi ya n’otu ụzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ ‘n’ime nke a’ ka ọ ghara ịkọwa ihe okwu Grik na-akọwaghị, ma e chekwara ngwakọta ihe atụ nke ebe obibi na iyi uwe.
