revisions:
- from: N’ihi na, n’ezie, n’ime nke a, anyị na-asụ ude, na-achọsi ike iyi ebe obibi anyị nke si n’eluigwe[a] n’elu anyị[b].
  to: N’ihi na, n’ezie, n’ime nke a, anyị na-asụ ude, na-achọsi ike iyi n’elu anyị ebe obibi anyị nke si n’eluigwe[a].[b]
  rationale: The revision preserves the source’s ambiguity concerning “in this,” its overlapping dwelling and clothing imagery, and the origin phrase “from heaven.” It makes only a small Igbo word-order improvement and clarifies the alternative wording in footnote a. Footnote b is anchored to the complete clothing expression so that it unambiguously supports the verbal nuance.
