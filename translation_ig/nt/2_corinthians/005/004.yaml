reference: 2 Corinthians 5:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι ἐφ’ ᾧ οὐ θέλομεν ἐκδύσασθαι ἀλλ’ ἐπενδύσασθαι, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/004.yaml
  text: For indeed[a], while we are in this tent, we groan, being burdened, because we do not want to be unclothed but to be further clothed[b], so that what is mortal may be swallowed up by life.
translation:
  language: ig
  text: N’ihi na n’ezie, mgbe anyị nọ n’ụlọikwuu a, anyị na-asụ ude, ebe ibu arọ na-anyịgbu anyị, n’ihi na anyị achọghị iyipụ uwe anyị yi, kama anyị chọrọ iyikwasị uwe ọzọ n’elu uwe anyị yi[a], ka ndụ wee lorie ihe na-anwụ anwụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “iyikwasị uwe n’elu uwe e yirila.” Ngwaa Grik ahụ na-enye echiche nke iyikwasị uwe ọzọ n’elu uwe mmadụ yirila.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe ahụ na-anwụ anwụ” ma ọ bụ “ọnọdụ nke ịbụ onye na-anwụ anwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σκήνει
  choice: ụlọikwuu
  rationale: Ọ na-edobe ihe atụ Pọl ji ụlọikwuu kọwaa ndụ mmadụ nọ n’ahụ ugbu a, ma jikọọ amaokwu a na akụkụ ndị gbara ya gburugburu.
- source_word: στενάζομεν
  choice: anyị na-asụ ude
  rationale: Nke a na-egosi mwute na agụụ miri emi nke okwu Grik ahụ nwere karịa okwu ga-apụta naanị iku ume n’ihi ike ọgwụgwụ.
- source_word: βαρούμενοι
  choice: n’okpuru ibu arọ
  rationale: Ọ na-egosi ọnọdụ nke ibu na-anyịgbu ha, nke na-akọwa ihe mere ha ji asụ ude, ma na-edobe echiche passive nke participle ahụ.
- source_word: ἐφ’ ᾧ
  choice: n’ihi na
  rationale: N’ebe a, nkebiokwu ahụ na-enye ihe kpatara ịsụ ude; ntụgharị a doro anya ma bụrụ Igbo nkịtị.
- source_word: ἐκδύσασθαι
  choice: iyipụ uwe anyị yi
  rationale: Ọ na-edobe ihe atụ gbasara uwe ma ghara ịkọwa ya dịka ozizi kpọmkwem banyere ọnọdụ mmadụ mgbe ọ nwụsịrị.
- source_word: ἐπενδύσασθαι
  choice: iyikwasị uwe ọzọ n’elu ya
  rationale: Ngwaa ngwakọta ahụ na-egosi iyi uwe ọzọ n’elu nke e yirila; ntụgharị a na-eme ka ike okwu ahụ pụta ìhè n’Igbo.
- source_word: καταποθῇ
  choice: wee lorie
  rationale: ‘Lorie’ na-edobe ihe oyiyi siri ike nke ihe ọzọ imeri ma kpochapụ ihe ahụ kpamkpam.
- source_word: τὸ θνητόν
  choice: ihe na-anwụ anwụ
  rationale: Adjective neuter a na-arụ ọrụ dịka aha; ntụgharị a na-ahapụ ntụaka ya ka ọ saa mbara karịa naanị echiche nkịtị nke ọnwụ.
- source_word: ζωῆς
  choice: ndụ
  rationale: Ọ bụ okwu Igbo kachasị mfe ma kwekọọ na ọdịiche dị n’etiti ndụ na ihe na-anwụ anwụ.
- source_word: καὶ γὰρ
  choice: N’ihi na n’ezie
  rationale: Ọ na-edobe ma njikọ nkọwa ‘n’ihi na’ ma nkwusi ike ‘n’ezie’ dị n’okwu Grik ahụ.
theological_decisions:
- issue: Ihe atụ Pọl ji uwe mee na ọnọdụ dị n’etiti ọnwụ na mbilite n’ọnwụ
  choice: E debere okwu banyere iyipụ uwe na iyikwasị uwe ọzọ n’elu ya n’enweghị ịkọwa kpọmkwem ụdị ọnọdụ ime mmụọ ọ na-anọchi anya ya.
  alternative: A pụrụ ịkọwa ‘iyipụ uwe’ kpọmkwem dịka ịdị ndụ na-enweghị ahụ, ma ọ bụ ‘iyikwasị uwe ọzọ’ naanị dịka inweta ahụ mbilite n’ọnwụ.
  rationale: Okwu Grik ji ihe atụ kwuo maka ịdị ndụ n’ahụ na mgbanwe a na-atụ anya ya. Idebe ihe atụ ahụ na-echekwa nghọta dị iche iche na esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ kama idozi ha n’ime ntụgharị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ ụlọikwuu, uwe, ibu arọ, na ilo ihe, ebe a zere okwu pụrụ iche nke otu ụka ma ọ bụ nkọwa ozizi karịrị ihe ederede Grik kwuru.
