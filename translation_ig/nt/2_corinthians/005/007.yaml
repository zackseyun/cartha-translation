- from: N’ihi na anyị ji okwukwe na-eje ije, ọ bụghị site n’ihe a na-ahụ anya[a]—
  to: N’ihi na anyị na-eje ije site n’okwukwe, ọ bụghị site n’ịhụ anya—
  rationale: The revision preserves the explanatory force of γάρ, the walking metaphor, and the Greek parallelism of διὰ πίστεως / οὐ διὰ εἴδους. It uses the concise Igbo idiom “site n’ịhụ anya” for the established faith/sight contrast, while the footnote records appearance and visible reality as lexical alternatives for εἶδος.
  reviewer_model: gpt-5.6-terra
