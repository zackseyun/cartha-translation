  text: διὰ πίστεως γὰρ περιπατοῦμεν, οὐ διὰ εἴδους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/007.yaml
  text: For we walk by faith[a], not by sight—
translation:
  language: ig
  text: N’ihi na anyị na-eje ije site n’okwukwe, ọ bụghị site n’ịhụ anya—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ πίστεως
  choice: ji okwukwe
  rationale: διά ya na genitive na-egosi ụzọ ma ọ bụ ihe e ji eme ihe; “ji okwukwe” bụ okwu Igbo sitere n’usoro nkịtị ma na-echekwa echiche nke okwukwe dịka ụzọ anyị si eje ije.
- source_word: γὰρ
  choice: N’ihi na
  rationale: γάρ na-enye nkọwa ma ọ bụ ihe ndabere maka okwu gbara amaokwu a gburugburu; “N’ihi na” na-egosipụta njikọ nkọwa ahụ n’Igbo doro anya.
- source_word: περιπατοῦμεν
  choice: anyị ... na-eje ije
  rationale: A na-eji περιπατέω eme ihe n’ụzọ ihe atụ maka ibi ndụ. Ịchekwa “na-eje ije” na-edobe ihe atụ Grik ahụ, nke a ka na-aghọta nke ọma n’Igbo.
- source_word: οὐ διὰ εἴδους
  choice: ọ bụghị site n’ihe a na-ahụ anya
  rationale: εἶδος nwere ike ịpụta ọdịdị, ihe pụtara n’anya, ma ọ bụ ihe a na-ahụ. Nkebi a na-egosipụta nke ọma ụwa nke ihe anya na-ahụ, ma na-ezere ịkọwa okwu ahụ naanị dịka ile ihe anya nkịtị.
theological_decisions:
- issue: Nsụgharị πίστις n’ọnọdụ Pọl nke nwere ike ibu nghọta nkà mmụta okpukpe
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N’ebe a, πίστις na-emegide εἶδος, ya bụ ihe a na-ahụ anya. “Okwukwe” na-echekwa okwu Pọl na-eji ma ghara ịmanye nghọta nke “ikwesị ntụkwasị obi,” ebe “ntụkwasị obi” bụkwa akụkụ nke ihe okwu ahụ nwere ike ịpụta.
- issue: Ókè nghọta εἶδος
  choice: ihe a na-ahụ anya
  alternative: ọdịdị; ihe pụtara n’anya
  rationale: Okwu Grik ahụ nwere obosara nghọta. Isi nsụgharị ahụ na-echekwa ọdịiche dị n’etiti okwukwe na ihe anya na-ahụ, ebe nkọwa ala peeji na-edobe ụzọ ndị ọzọ e nwere ike isi ghọta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ ihe atụ nke “ije ije” iji gosipụta ụzọ mmadụ si ebi ndụ. Akara ogologo ahịrị dị n’ọgwụgwụ na-egosi na echiche ahụ na-aga n’ihu n’amaokwu na-esote.
