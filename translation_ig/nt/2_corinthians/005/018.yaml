id: 2CO.5.18
reference: 2 Corinthians 5:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: ig
  text: Ihe ndị a niile[a] sitere na Chineke, onye mere ka anyị[c] na ya dịghachi ná mma site n’aka Mesaịa[b], ma nyekwara anyị ọrụ ozi nke ịdịghachi ná mma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ihe niile.” Nkebiokwu ahụ nwere ike ịgụnye ihe niile dị n’ọnọdụ ọhụrụ a, ma ọ bụ ihe ndị a kpọtụrụ aha n’amaokwu ndị bu ụzọ.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “site n’aka Kraịst.” E ji “Mesaịa” sụgharịa ya ebe a n’ihi na Χριστός na-arụ ọrụ dịka utu aha.
    reason: alternative_reading
  - marker: c
    text: “Anyị” nwere ike izo aka n’ebe ndị kwere ekwe niile nọ; ma n’okwu ndị gbara amaokwu a gburugburu, Pọl na-elekwasịkwa anya n’ọrụ ozi e nyere ya na ndị ya na ha na-arụkọ ọrụ.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: Ihe ndị a niile
  rationale: Nkebiokwu a na-ezo aka n’ihe ndị Pọl ka kwupụtara, ma ọ ka nwere ike ịgụnye ihe niile metụtara ọnọdụ ọhụrụ ahụ. A naghị atụgharị δέ iche ebe a, n’ihi na n’Igbo njikọ dị nro ya apụtalarị nke ọma n’usoro okwu ahụ.
- source_word: ἐκ τοῦ θεοῦ
  choice: sitere na Chineke
  rationale: Nke a na-egosi na Chineke bụ isi mmalite ihe ndị ahụ; ọ bụkwa okwu Igbo doro anya ma dị mfe.
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: onye mere ka anyị na ya dịghachi ná mma
  rationale: Nke a na-egosipụta imezi mmekọrịta mebiri emebi, ma na-edebe Chineke dịka onye mere ihe ahụ.
- source_word: διὰ Χριστοῦ
  choice: site n’aka Mesaịa
  rationale: διά ya na genitive na-egosi onye Chineke ji rụọ ọrụ ahụ. A sụgharịrị Χριστός dịka utu aha, ‘Mesaịa,’ kama ile ya anya naanị dịka aha mmadụ.
- source_word: δόντος ἡμῖν
  choice: nyekwa anyị
  rationale: E jikọtara participle nke abụọ na nke mbụ n’ụzọ Igbo na-aga were were, Chineke ka bụ onye na-eme ihe ahụ.
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: ọrụ nke ime ka e nwee ịdịghachi ná mma
  rationale: ‘Ọrụ’ na-egosipụta ọrụ e nyere mmadụ ka ọ rụọ, ebe nkebiokwu na-esote ya na-akọwa ọdịnaya ya n’asụsụ ndị mmadụ na-aghọta.
theological_decisions:
- issue: Utu aha Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a Χριστός na-arụ ọrụ dịka utu aha nke onye Chineke si n’aka ya mee ka e nwee ịdịghachi ná mma.
- issue: Ndị ‘anyị’ na-ezo aka na ha
  choice: anyị
  alternative: anyị ndị kwere ekwe n’ozuzu; ma ọ bụ Pọl na ndị ya na ha na-eje ozi karịsịa
  rationale: Ihe odide Grik ekpebighị ókè okwu a n’ụzọ zuru ezu. Ya mere, e debere ‘anyị’ ka nkọwa abụọ ahụ nwee ohere.
- issue: Ụdị genitive na τῆς καταλλαγῆς
  choice: ọrụ nke ime ka e nwee ịdịghachi ná mma
  alternative: ọrụ ịdịghachi ná mma
  rationale: Nsụgharị a na-ewere genitive ahụ dịka ihe na-akọwa ụdị ma ọ bụ ọdịnaya nke ọrụ ahụ, n’enweghị itinye ozizi otu ụka pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ịdịghachi ná mma’ na-egosipụta mweghachi mmekọrịta nke καταλλαγή, ebe ‘ọrụ’ na-egosipụta ọrụ e nyere mmadụ nke διακονία.
