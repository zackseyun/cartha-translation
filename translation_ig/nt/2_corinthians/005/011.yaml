revisions:
- from: N’ihi ya, ebe anyị maara egwu Onyenwe anyị[a], anyị na-eme ka ndị mmadụ kwenye. Ma ihe anyị bụ doro Chineke anya[b]; ana m atụkwa anya na ọ dokwara akọ na uche unu anya.
  to: N’ihi ya, ebe anyị maara egwu Onyenwe anyị[a], anyị na-eme ka ndị mmadụ kwenye; ma anyị apụtala ìhè nye Chineke[b], ana m atụkwa anya na anyị apụtawokwa ìhè n’akọ na uche unu.
  rationale: The revision retains the source’s personal plural subject, passive/resultative force, and verbal parallelism in both occurrences of φανερόω while using idiomatic Standard Igbo. It also keeps the fear terminology in the main text and narrows the alternative footnote to an appropriately noninterpretive lexical clarification.
