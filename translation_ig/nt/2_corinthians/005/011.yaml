id: 2CO.5.11
reference: 2 Corinthians 5:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰδότες οὖν τὸν φόβον τοῦ κυρίου ἀνθρώπους πείθομεν, θεῷ δὲ πεφανερώμεθα· ἐλπίζω δὲ καὶ ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: ig
  text: N’ihi ya, ebe anyị maara egwu Onyenwe anyị[a], anyị na-eme ka ndị mmadụ kwenye; ma anyị apụtala ìhè nye Chineke[b], ana m atụkwa anya na anyị apụtawokwa ìhè n’akọ na uche unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta “egwu Onyenwe anyị” dị ka nsọpụrụ miri emi n’ihu Onyenwe anyị, karịchaa n’ihi okwu banyere oche ikpe dị n’amaokwu bu ụzọ.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ dị nso n’okwu Grik: “ma e meela ka anyị pụta ìhè nye Chineke ... ana m atụ anya na e meela ka anyị pụtawokwa ìhè n’akọ na uche unu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰδότες οὖν
  choice: N’ihi ya, ebe anyị maara
  rationale: “N’ihi ya” na-egosi nkwubi okwu sitere n’ihe e kwuru na amaokwu bu ụzọ, ebe “ebe anyị maara” na-edobe njikọ participle ahụ n’enweghị ime ka ọ bụrụ naanị ihe kpatara omume ahụ.
- source_word: φόβον τοῦ κυρίου
  choice: egwu Onyenwe anyị
  rationale: Nke a na-edobe okwu Akwụkwọ Nsọ siri ike banyere egwu Onyenwe anyị; ọ pụrụ ịgụnye ma egwu n’ihi ikpe ya ma nsọpụrụ miri emi n’ihu ya.
- source_word: ἀνθρώπους πείθομεν
  choice: anyị na-eme ka ndị mmadụ kwenye
  rationale: Ọ na-egosi omume na-aga n’ihu nke ime ka mmadụ kweta, ma “ndị mmadụ” na-ezo aka n’ụmụ mmadụ niile, ọ bụghị naanị ndị nwoke.
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: Ma ihe anyị bụ doro Chineke anya
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi kwuo na ndụ na ezi agwa Pọl na ndị ya apụtawo ìhè n’ihu Chineke, ma na-edobe ọnọdụ zuru ezu nke perfect passive ahụ.
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν
  choice: akọ na uche unu
  rationale: “Unu” na-edobe ọtụtụ mmadụ ndị Pọl na-agwa; “akọ na uche” bụ okwu Igbo doro anya maka nghọta ime mmụọ na omume nke onye ọ bụla.
- source_word: πεφανερῶσθαι
  choice: ọ dokwara ... anya
  rationale: 'Nkebi a na-emeghachi echiche φανερόω: Pọl na-atụ anya na ihe ha bụ apụtawokwa ìhè n’ime nghọta omume nke ndị Kọrịnt.'
theological_decisions:
- issue: Ihe “egwu Onyenwe anyị” pụtara n’ọnọdụ a
  choice: E debere “egwu” n’ahịrị bụ isi.
  alternative: nsọpụrụ miri emi nye Onyenwe anyị
  rationale: Amaokwu gara aga kwuru banyere oche ikpe Kraịst. Ya mere, ime ka okwu ahụ bụrụ naanị “nsọpụrụ” pụrụ ibelata echiche nke ịma jijiji na ịza ajụjụ n’ihu Onyenwe anyị; ihe odide na nkọwa ala peeji na-ahapụ akụkụ abụọ ahụ ka ha dị.
- issue: Otú φανερόω si metụta Chineke na akọ na uche ndị Kọrịnt
  choice: ihe anyị bụ doro ... anya
  alternative: e meela ka a mara anyị; anyị apụtala ìhè
  rationale: Nhọrọ a na-asụ Igbo nke ọma ma na-egosi na ezi ọnọdụ na agwa ndị ozi ahụ ghe oghe n’ihu Chineke na n’akọ na uche ndị na-agụ akwụkwọ, n’enweghị echiche na Chineke amaghị ha na mbụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe mgbanwe sitere na “anyị” gaa na “ana m atụ anya,” yana ọtụtụ “akọ na uche” nke Grik site n’iji “unu” gosi ndị nwe ya n’otu n’otu.
