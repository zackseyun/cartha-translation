id: 2CO.10.14
reference: 2 Corinthians 10:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: ig
  text: N’ihi na anyị anaghị agbatị onwe anyị gabiga ókè[a], dị ka a ga-asị na anyị anaghị eru unu; n’ihi na anyị ji ozi ọma nke Mesaịa[b] rute ruo ọbụna unu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị: “ịgbatị onwe anyị gabiga ókè.” Nke a na-eji ihe atụ nke ịgbatị ihe gafee oke ya.'
    reason: lexical_clarification
  - marker: b
    text: Ma ọ bụ, “Kraịst.” “Mesaịa” na “Kraịst” pụtara Onye E Tere Mmanụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: anyị adịghị agbatị onwe anyị gabiga ókè
  rationale: Nke a na-edobe ihe atụ Grik nke mmadụ ịgbatị onwe ya gafee oke e nyere ya, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: dị ka a ga-asị na anyị eruteghị unu
  rationale: 'Ọ na-egosi ọnọdụ a na-eche n’echiche: ebubo ahụ ga-adị ka a ga-asị na ozi Pọl na ndị ya eruteghị ndị Kọrịnt.'
- source_word: ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν
  choice: n’ihi na ... rute ọbụna unu
  rationale: '“Rute” na-egosi omume mezuru, ebe “ọbụna” na-edobe nkwusiri ike nke καί: ọrụ ha ruru ndị Kọrịnt n’ezie.'
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: anyị ji ozi ọma ... rute
  rationale: “Ji” na-egosi na ọ bụ site n’iweta ozi ọma ka ha si rute ndị Kọrịnt, ma ọ na-ekwe ka echiche nke iso ozi ọma jee ruo ha pụta ìhè.
- source_word: εὐαγγελίῳ
  choice: ozi ọma
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa εὐαγγέλιον.
- source_word: τοῦ Χριστοῦ
  choice: nke Mesaịa
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dị ka utu aha nke Onye ahụ e tere mmanụ; “Mesaịa” na-eme ka echiche ahụ doo anya.
theological_decisions:
- issue: Ntụgharị Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: Genitive a nwere ike ịpụta ozi ọma nke sitere n’aka Mesaịa, nke bụ nke ya, ma ọ bụ nke gbasara ya. “Nke Mesaịa” na-edobe njikọ ahụ n’enweghị ikpebi kpọmkwem ụdị genitive ọ bụ, ma na-egosikwa utu aha ahụ.
- issue: Mmekọrịta ἐν na ozi ọma
  choice: ji ozi ọma ... rute
  alternative: rute n’ozi ọma
  rationale: “Ji” bụ Igbo ebumpụta ụwa maka ụzọ ozi ha si ruo ndị Kọrịnt, ma okwu Grik nwekwara ike ịgụnye ọnọdụ ọrụ ha n’ime ozi ọma; e zere nkọwa ga-emechi echiche ahụ kpamkpam.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ihe atụ nke ịgbatị onwe onye gabiga ókè, nkwusiri ike dị na “ọbụna unu,” na akara ogologo n’ikpeazụ iji gosi na echiche ahụ na-aga n’ihu n’amaokwu na-esote.
