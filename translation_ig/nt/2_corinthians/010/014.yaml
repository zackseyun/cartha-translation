- from: N’ihi na anyị adịghị agbatị onwe anyị gabiga ókè[a], dị ka a ga-asị na anyị eruteghị unu; n’ihi na anyị ji ozi ọma nke Mesaịa[b] rute ọbụna unu—
  to: N’ihi na anyị anaghị agbatị onwe anyị gabiga ókè[a], dị ka a ga-asị na anyị anaghị eru unu; n’ihi na anyị ji ozi ọma nke Mesaịa[b] rute ruo ọbụna unu—
  rationale: The revision is limited to a more direct rendering of the present participle, a more idiomatic Igbo directional expression that retains the emphatic “ọbụna,” and a footnote clarification that does not add an unstated notion of assigned authority or work. The em dash is retained because the Greek sentence continues into the following verse.
