reference: 2 Corinthians 10:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: ig
  text: Mụ onwe m, Pọl, ji ịdị nwayọọ na ịdị nro nke Mesaịa na-arịọ unu—m, onye dị umeala mgbe mụ na unu nọ ihu na ihu[a], ma onye nwere obi ike n'ebe unu nọ mgbe m na-anọghị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “dị ka ihu”; ya bụ, mgbe ọ nọ n'etiti ha n'onwe ya.
    reason: lexical_alternative
  - marker: b
    text: “Dị umeala” nwere ike ịbụ ụzọ Pọl si kwughachi, n'ụzọ nwere njakịrị, ihe ụfọdụ kwuru banyere ya mgbe ọ nọ n'ihu ha; a pụkwara ịsụgharị ya “dị ala,” ma ọ bụ, n'ụzọ na-akọwa karịa, “dị ụjọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: Mụ onwe m, bụ Pọl
  rationale: “Mụ onwe m” na-edobe nkwusiri ike dị n’Αὐτὸς ... ἐγώ; “bụ Pọl” na-eme ka ahịrịokwu ahụ daa nke ọma n’Igbo. A hapụrụ δέ ka ntụgharị na ọnọdụ gbara ya gburugburu gosi ya, kama itinye okwu na-egosi oge.
- source_word: παρακαλῶ ὑμᾶς
  choice: na-arịọ unu
  rationale: N’ebe a, παρακαλῶ bụ arịrịọ siri ike nke onwe, ọ bụghị iwu; “na-arịọ unu” bụ okwu Igbo doro anya ma dị mma.
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: ji ịdị nwayọọ na obi ebere
  rationale: “Ji” na-egosi ụzọ ma ọ bụ ntọala arịrịọ ahụ. “Ịdị nwayọọ” na-egosi πραΰτης, ebe “obi ebere” na-eburu echiche nke ἐπιείκεια dịka ịdị nro, inwe nchebara echiche, na ịghara isi ọnwụ.
- source_word: τοῦ Χριστοῦ
  choice: nke Mesaịa
  rationale: Χριστός na-arụ ọrụ dịka aha ọkwa ebe a; “Mesaịa” na-egosi ihe aha ahụ pụtara kama iji naanị ntụgharị-ụda ọdịnala.
- source_word: κατὰ πρόσωπον
  choice: ihu na ihu
  rationale: N'ụzọ nkịtị ọ bụ “dị ka ihu”; n’ọnọdụ a ọ pụtara ịnọ n’ihu mmadụ n’onwe ya, nke “ihu na ihu” na-edobe nke ọma.
- source_word: ταπεινὸς ἐν ὑμῖν
  choice: dị umeala n'obi mgbe mụ na unu nọ
  rationale: “Dị umeala n’obi” na-edobe isi echiche ταπεινός ma hapụ ohere ma ọ̀ bụ nkọwa Pọl banyere onwe ya ka ọ̀ bụ okwu ndị ọzọ ji akọwa ya.
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: ma nwee nkwuwa okwu n'ebe unu nọ mgbe m na-anọghị
  rationale: “Nkwuwa okwu” na-egosi obi ike ma ọ bụ nkwuwa siri ike nke θαρρῶ, ebe “n’ebe unu nọ” na-edobe ntụziaka sara mbara nke εἰς ὑμᾶς n’etinyeghị echiche iro na-adịghị kpọmkwem.
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: Okwu Grik ahụ bụ aha ọkwa nke pụtara Onye E Tere Mmanụ; “Mesaịa” na-edobe ọrụ aha ọkwa ahụ na ndabere ndị Juu.
- issue: Ụda okwu ταπεινὸς
  choice: dị umeala n'obi
  alternative: dị ụjọ ma ọ bụ dị ala
  rationale: Ihe odide ahụ nwere ike ịbụ okwu mkparị ndị ọzọ kwuru banyere Pọl, ma ọ naghị egosi n'ụzọ doro anya na ọ bụ nhota. Nsụgharị a na-edobe nghọta bụ isi na esemokwu ahụ n’emeghị mkpebi maka onye na-agụ ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu na-ada ka arịrịọ nke onwe, ma debe ihe nwere ike ịbụ njakịrị ma ọ bụ ebubo ndị mmegide n’enweghị ịkọwa ya gabiga ihe odide Grik.
