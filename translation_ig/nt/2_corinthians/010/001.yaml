revisions:
- from: Mụ onwe m, bụ Pọl, ji ịdị nwayọọ na obi ebere nke Mesaịa na-arịọ unu—mụ onye dị umeala n'obi mgbe mụ na unu nọ ihu na ihu[a], ma nwee nkwuwa okwu n'ebe unu nọ mgbe m na-anọghị.[b]
  to: Mụ onwe m, Pọl, ji ịdị nwayọọ na ịdị nro nke Mesaịa na-arịọ unu—m, onye dị umeala mgbe mụ na unu nọ ihu na ihu[a], ma onye nwere obi ike n'ebe unu nọ mgbe m na-anọghị.[b]
  rationale: The revision corrects the rendering of ἐπιείκεια, avoids narrowing ταπεινός to an inward quality, and renders θαρρῶ as bold confidence rather than merely frank speech. It retains the source's rhetorical ambiguity and the project-approved title «Mesaịa».
