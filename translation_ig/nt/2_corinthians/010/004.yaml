  text: τὰ γὰρ ὅπλα τῆς στρατείας ἡμῶν οὐ σαρκικὰ ἀλλὰ δυνατὰ τῷ θεῷ πρὸς καθαίρεσιν ὀχυρωμάτων— λογισμοὺς καθαιροῦντες
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: ig
  text: N’ihi na ngwa agha anyị ji alụ agha abụghị nke anụ ahụ[a], kama ha dị ike n’ihu Chineke[b] ịkwatu ebe ndị e wusiri ike—anyị na-akwatu arụmụka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụghị nke anụ arụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dị ike site n’aka Chineke” ma ọ bụ “juputara n’ike Chineke.”
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “echiche e chepụtara echepụta” ma ọ bụ “ntụmatụ echiche.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: ngwa agha
  rationale: Ọ na-edobe ihe atụ agha ahụ n’ụzọ doro anya ma bụrụkwa okwu Igbo a na-asụkarị maka ngwá e ji alụ ọgụ.
- source_word: στρατείας
  choice: anyị ji alụ agha
  rationale: Nke a na-egosi ọgụ agha na-aga n’ihu, ma na-ada nke ọma n’Igbo karịa ịsụgharị ya dịka ọrụ agha.
- source_word: σαρκικὰ
  choice: nke anụ ahụ
  rationale: Ọ na-edobe njikọ okwu Grik ahụ na ‘anụ ahụ’ n’ebughị ụzọ kọwaa ya naanị dịka ihe mmehie ma ọ bụ ihe ụwa.
- source_word: δυνατὰ τῷ θεῷ
  choice: dị ike n’ihu Chineke
  rationale: Ọ na-edobe dative τῷ θεῷ n’ụzọ na-adịghị amanye nghọta na Chineke bụ naanị ụzọ e si nweta ike ahụ; ihe ọzọ nwere ike ịbụ ‘dị ike site n’aka Chineke.’
- source_word: καθαίρεσιν
  choice: ịkwatu
  rationale: Ọ na-egosipụta imebi ma ọ bụ iwetu ihe e wusiri ike, ma na-edobekwa ihe atụ nke nnọchibido agha.
- source_word: ὀχυρωμάτων
  choice: ebe ndị e wusiri ike
  rationale: Ọ bụ okwu Igbo doro anya maka ebe e mere ka o sie ike ịwakpo, ma na-arụkwa ọrụ n’ihe atụ Pọl ji ya mee.
- source_word: λογισμοὺς
  choice: arụmụka
  rationale: N’ọnọdụ a, ọ na-egosi echiche ndị a haziri iji guzogide eziokwu, ọ bụghị nanị echiche nkịtị.
- source_word: καθαιροῦντες
  choice: anyị na-akwatu
  rationale: Ọ na-emegharị mgbọrọgwụ echiche nke καθαίρεσιν ma na-egosi ihe ndị na-eje ozi Chineke na-eme.
theological_decisions:
- issue: Ihe σαρκικὰ pụtara n’ọdịiche dị n’etiti ụzọ mmadụ na ike Chineke
  choice: nke anụ ahụ
  alternative: nke ụwa; nke mmadụ nkịtị
  rationale: ‘Nke anụ ahụ’ na-edobe obosara na esemokwu dị n’okwu Pọl, n’emeghị ka ọ pụta ozugbo naanị ‘nke mmehie.’
- issue: Ike dative τῷ θεῷ nwere na δυνατὰ τῷ θεῷ
  choice: dị ike n’ihu Chineke
  alternative: dị ike site n’aka Chineke; juputara n’ike Chineke
  rationale: Nhọrọ bụ isi na-anọ nso n’usoro Grik ma na-ahapụ nghọta ya dị ntakịrị oghe; nkọwa ọzọ nwere ike igosi Chineke dịka isi iyi ma ọ bụ ụzọ ike ahụ si abịa.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere ihe atụ agha ahụ na nkwughachi nke ‘ịkwatu/anyị na-akwatu,’ ma e zere okwu ụka pụrụ iche nke otu nkwenkwe.
