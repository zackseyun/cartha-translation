language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: ig
  text: N’ihi na ha na-ekwu[a], “Akwụkwọ ozi ya dị arọ, dịkwa ike; ma ọnụnọ ya n’anụ ahụ adịghị ike, okwu ya bụkwa ihe a na-eleda anya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi na ọ na-ekwu, ‘Akwụkwọ ozi ndị ahụ dị arọ, dịkwa ike…’” Okwu Grik ahụ dị n’otu onye, “ọ na-ekwu,” ma ọ pụrụ ịrụ ọrụ dịka usoro e ji kpọpụta echiche ndị na-emegide Pọl.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “okwu ya bụ ihe nlelị,” ma ọ bụ, “a na-ewere okwu ya ka ihe na-abaghị uru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: N'ebe a, okwu a na-ewebata ihe kpatara okwu bu ya ụzọ ma na-akọkwa ihe ndị na-emegide Pọl kwuru.
- source_word: ἐπιστολαὶ
  choice: akwụkwọ ozi
  rationale: Nke a bụ okwu Igbo nkịtị maka akwụkwọ ozi e dere, na-enweghị itinye ụda okwu pụrụ iche nke ụka.
- source_word: μέν ... δὲ
  choice: dị ... ma
  rationale: Usoro a na-egosi ọdịiche dị n’etiti akwụkwọ ozi Pọl na otú ndị ahụ si ele ọnụnọ ya anya.
- source_word: φησίν
  choice: ha na-ekwu
  rationale: Ọ bụ ezie na okwu Grik ahụ dị n’otu onye, ọ pụrụ ịbụ usoro e ji kpọpụta okwu onye nnọchianya ma ọ bụ echiche ndị nkatọ Pọl n’ozuzu ha; ọnọdụ okwu gbara ya gburugburu kwadoro ọtụtụ mmadụ.
- source_word: βαρεῖαι
  choice: dị arọ
  rationale: Nke a na-edobe ihe atụ nke ibu ma na-egosi ịdị mkpa na ịdị ukwuu nke akwụkwọ ozi ndị ahụ.
- source_word: ἰσχυραί
  choice: dịkwa ike
  rationale: Nke a bụ nkọwa kwụ ọtọ nke ike na mmetụta akwụkwọ ozi ndị ahụ.
- source_word: παρουσία τοῦ σώματος
  choice: mgbe ọ nọ n’etiti anyị, ahụ ya
  rationale: Ntụgharị a na-egosi ọnụnọ Pọl n’anụ ahụ n’ihu ha, ọ bụghị nanị ọbịbịa ya, ma na-ada ka Igbo eke.
- source_word: ἀσθενὴς
  choice: adịghị ike
  rationale: Nke a na-edobe okwu nkatọ ahụ n’enweghị ịkọwapụta ma ọ bụ kpebie ụdị adịghị ike a na-ekwu maka ya.
- source_word: λόγος
  choice: okwu
  rationale: N’ọdịiche ya na akwụkwọ ozi, okwu a na-ezo aka n’ikwu okwu Pọl n’ọnụ; “okwu ya” bụ ụzọ Igbo dị nkenke ma bụrụ ihe a na-aghọta.
- source_word: ἐξουθενημένος
  choice: ihe a na-eleda anya
  rationale: Nke a na-egosi na ndị ọzọ na-ewere okwu ya dị ka ihe na-abaghị uru, kama ikwu na okwu ahụ n’onwe ya bụ ihe rụrụ arụ.
theological_decisions:
- issue: E kwesịghị ime ka nkatọ a kọrọ bụrụ nkwenye onye na-ede akwụkwọ nyere
  choice: 'E tinyere ya dịka okwu ndị na-emegide Pọl: “ha na-ekwu.”'
  alternative: “ọ na-ekwu” ma ọ bụ “a na-ekwu”
  rationale: Ọnọdụ okwu a na-egosi na Pọl na-akọ echiche ndị nkatọ ya, ọ bụghị na ọ na-ekwupụta na nkatọ ahụ bụ eziokwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Dị arọ” na-edobe ihe atụ dị na Grik; “ihe a na-eleda anya” na-egosi nkatọ ndị mmadụ mere kama ịkọwa okwu Pọl dị ka ihe na-abaghị uru n’ezie.
