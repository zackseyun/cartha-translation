  text: so that I may not seem as though I were trying to frighten you by my letters[a].
translation:
  language: ig
  text: ka m ghara ịdị ka onye ji akwụkwọ ozi m[a] na-emenye unu ụjọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka m ghara iyi ka m ji akwụkwọ ozi ndị ahụ na-emenye unu ụjọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: ka ọ ghara
  rationale: Na-egosi nzube ma ọ bụ ihe ga-esi n'okwu bu ya ụzọ pụta, ya na nkwụghachi okwu μὴ; nke a bụ ụzọ Igbo doro anya isi debe njikọ ahụ.
- source_word: δόξω
  choice: ọ ghara ịdị ka
  rationale: δοκέω pụtara 'iyi ka' ma ọ bụ 'ịdị ka' n'ebe a, ọ bụghị 'iche echiche'; ahịrịokwu a na-edebe echiche banyere otú Pọl pụrụ isi pụta n'anya ha.
- source_word: ὡς ἂν
  choice: à ga-asị na
  rationale: Na-egosi ntụnyere ma na-eme ka nkwupụta na-esochi ya ghara ịbụ nkwupụta kpọmkwem; 'à ga-asị na' bụ Igbo nkịtị nke na-edebe nro ahụ.
- source_word: ἐκφοβεῖν
  choice: na-agbalị ... menye ... ụjọ
  rationale: Ngwaa a pụtara ime ka mmadụ tụọ egwu ma ọ bụ ịmaja ya. 'Na-agbalị ... menye ... ụjọ' dabara n'echiche nke ihe ọ dị ka Pọl na-eme, ma ọ naghị eme ka okwu ahụ sie ike ruo n'ókè nke 'ịtụ ha egwu nke ukwuu.'
- source_word: ὑμᾶς
  choice: unu
  rationale: Ọ bụ nnọchiaha onye nke abụọ n'ọtụtụ, ya mere 'unu' na-edebe ọnụọgụ ahụ nke ọma.
- source_word: διὰ τῶν ἐπιστολῶν
  choice: iji akwụkwọ ozi m
  rationale: διά na genitive na-egosi ụzọ e si eme ihe. Ọ bụ ezie na Grik kwuru 'akwụkwọ ozi ndị ahụ,' ihe gbara ya gburugburu gosiri na ọ bụ akwụkwọ ozi Pọl, ya mere 'akwụkwọ ozi m' bụ nke doro anya ma kwekọọ n'okwu ahụ.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ahịrịokwu ahụ dịka nkebiokwu na-adabere n'okwu bu ya ụzọ, dị ka ọ dị n'asụsụ Grik; 'à ga-asị na' na-echekwa nro na enweghị nkwubi okwu siri ike dị na ὡς ἂν.
