id: 2CO.10.18
reference: 2 Corinthians 10:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἑαυτὸν ⸀συνιστάνων, ἐκεῖνός ἐστιν δόκιμος, ἀλλὰ ὃν ὁ κύριος συνίστησιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: ig
  text: N’ihi na ọ bụghị onye na-akwado onwe ya ka a nabatara[a], kama ọ bụ onye Onyenwe anyị na-akwado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye e nwalere hụ na o ruru eru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: na-aja onwe ya mma / na-aja mma
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara ikwupụta ihe ọma banyere mmadụ iji gosi na o kwesịrị nnabata. E ji otu okwu Igbo mee ya n’ebe abụọ ahụ iji chekwaa nkwughachi dị na Grik.
- source_word: δόκιμος
  choice: onye a nabatara
  rationale: Ọ na-ezo aka n’onye e lere anya ma kweta na o ruru eru. ‘Onye a nabatara’ na-egosipụta nsonaazụ nyocha ahụ n’Igbo doro anya.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ Igbo a na-ejikarị sụgharịa κύριος. A kọwaghị n’ahịrịokwu ahụ ma ọ bụ Jizọs ka ọ bụ Chineke, ya mere nsụgharị ahụ ahapụghị nghọta ahụ.
- source_word: ἑαυτὸν
  choice: onwe ya
  rationale: Nke a na-echekwa ntụaka onye otu dị n’usoro Grik ma na-ada nke ọma n’Igbo.
- source_word: ὃν
  choice: onye
  rationale: '‘Onye’ na-eme ka ntụnyere ahụ doo anya: ọ bụghị onye na-aja onwe ya mma, kama onye Onyenwe anyị na-aja mma.'
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe kpatara ma ọ bụ nkọwa maka okwu bu ya ụzọ.
theological_decisions:
- issue: Onye κύριος na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Onyenwe anyị Jizọs; Chineke
  rationale: N’akwụkwọ Pọl, aha a na-ezokarị aka na Jizọs, ma amaokwu a ekwughị aha ahụ kpọmkwem. Ya mere, a hapụrụ aha nsọpụrụ ahụ n’enweghị ịkọwapụta ya karịa ihe Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ‘ọ bụghị … kama’ na-echekwa ntụnyere siri ike nke Grik, ebe nkwughachi ‘na-aja … mma’ na-egosi na otu ngwaa Grik ka e ji mee ihe n’ebe abụọ ahụ.
