id: 2CO.10.7
reference: 2 Corinthians 10:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: ig
  text: 'Unu na-ele ihe ndị dị n’èzí anya[a]. Ọ bụrụ na onye ọ bụla ji n’aka n’ime onwe ya na ọ bụ nke Mesaịa, ya tụleghachi ihe a n’ime onwe ya: na dịka ya onwe ya bụ nke Mesaịa[b], otu ahụkwa ka anyị bụ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara nnọọ n’okwu Grik, “Unu na-ele ihe anya dịka ọdịdị ya si dị”; o nwekwara ike ịbụ, “Leenụ ihe dị n’ihu unu.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “ọ bụ nke Kraịst”; a sụgharịrị ya “ọ bụ nke Mesaịa” iji gosi ịbụ nke ya, tinyekwa Χριστός dị ka utu aha.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: ihe anya dị n’elu
  rationale: Nkebiokwu a na-ezo aka n’ihe a na-ahụ anya n’èzí ma ọ bụ n’elu, ọ bụghị n’ezi ọdịdị dị n’ime; nsụgharị a bụ Igbo doro anya ma na-edobe echiche ahụ.
- source_word: βλέπετε
  choice: Unu na-ele
  rationale: A ghọtara ụdị ngwaa a dị ka okwu nkwupụta na-ata ndị na-ege ntị ụta, kama iwu ka ha lee anya.
- source_word: πέποιθεν ἑαυτῷ
  choice: nwere obi ike n’ime onwe ya
  rationale: Oge perfect na-egosi obi ike siri ike nke nọgidere; okwu Igbo a na-egosikwa na onye ahụ ji onwe ya n’aka.
- source_word: Χριστοῦ εἶναι
  choice: ọ bụ nke Mesaịa
  rationale: Genitive a na-egosi ịbụ nke mmadụ ma ọ bụ ịdabere n’okpuru ya; 'Mesaịa' na-edobe Χριστός dị ka utu aha.
- source_word: λογιζέσθω πάλιν ἐφ’ ἑαυτοῦ
  choice: ya tụgharịa uche n’ihe a ọzọ n’ime onwe ya
  rationale: Nke a na-egosipụta iwu ka onye ahụ nyochaa okwu ahụ ọzọ n’uche nke aka ya.
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: dịka ya onwe ya bụ nke Mesaịa, otu ahụkwa ka anyị bụ
  rationale: 'A na-edobe ntụnyere Pọl: otu ụdị ịbụ nke Mesaịa ahụ onye ahụ na-azọrọ bụkwa nke ndịozi ahụ.'
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: Χριστός na-arụ ọrụ dị ka utu aha nke Onye E Tere Mmanụ; 'Mesaịa' na-eme ka ụdị utu aha ahụ pụta ìhè ma ghara ime ya naanị aha mmadụ.
- issue: Ihe ịbụ 'nke Mesaịa' pụtara
  choice: ọ bụ nke Mesaịa
  alternative: ọ bụ onye Mesaịa
  rationale: Ụdị a na-edobe echiche sara mbara nke ịbụ nke ya, njikọ na nrubeisi, n’etinyeghị nkọwa ozizi pụrụ iche n’ime amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta. E debere nnọchiaha ọtụtụ 'unu' na 'anyị', ma chekwaa mgbagwoju anya nke βλέπετε site n’ịtụgharị ya dịka nkwupụta n’ahịrị isi ma tinye nhọrọ iwu na nkọwa ala peeji.
