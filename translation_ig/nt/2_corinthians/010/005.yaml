base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/005.yaml
  text: and every lofty thing raised up against the knowledge of God[a], and taking every thought captive into obedience to Messiah[b],
translation:
  language: ig
  text: na ihe ọ bụla e weliri elu imegide ihe ọmụma banyere Chineke[a], na-emekwa ka echiche ọ bụla bụrụ onye mkpọrọ n’agha ka o wee rubere Mesaya isi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị πᾶν ὕψωμα dịka “ihe ọ bụla dị elu” ma ọ bụ “nganga ọ bụla.”
    reason: lexical_alternative
  - marker: b
    text: 'Grik: “Mesaya ahụ”; n’ọdịnala, “Kraịst.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν ὕψωμα
  choice: ihe ọ bụla dị elu
  rationale: Nke a na-echekwa ihe atụ nke ihe e buliri elu, ma ọ naghị akọwa ya nanị dị ka mpako ma ọ bụ nkwupụta efu. “Ọ bụla” na-egosipụta πᾶν n’ụzọ nkesa.
- source_word: ἐπαιρόμενον
  choice: nke e weliri
  rationale: Nke a na-egosipụta ọnọdụ ihe e buliri ma ọ bụ e weliri elu, na-etinyeghị echiche na ọ bụ ihe ahụ weliri onwe ya.
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: imegide ihe ọmụma banyere Chineke
  rationale: “Ihe ọmụma” na-anọchi γνῶσις, ebe “banyere Chineke” na-eme ka njikọ genitive doo anya n’Igbo n’ebughị ụzọ kpebie ma ọ pụtara naanị ịmata Chineke n’onwe ya ma ọ bụ ezi ihe ọmụma banyere ya.
- source_word: αἰχμαλωτίζοντες
  choice: na-akpọrọkwa … n’agha
  rationale: Nke a na-echekwa ihe atụ agha nke ijide ma kpọrọ mmadụ dịka onye mkpọrọ.
- source_word: πᾶν νόημα
  choice: echiche ọ bụla
  rationale: “Echiche” bụ okwu Igbo doro anya maka echiche ma ọ bụ ihe dị n’uche, ebe “ọ bụla” na-echekwa ike nkesa nke πᾶν.
- source_word: εἰς τὴν ὑπακοὴν
  choice: na-eduba ya n’irubere … isi
  rationale: “Na-eduba ya n’…” na-egosipụta mmegharị gaa n’ọnọdụ nrubeisi nke εἰς na-egosi, n’Igbo na-asụkwa nke ọma.
- source_word: τοῦ Χριστοῦ
  choice: Mesaya
  rationale: N’ebe a Χριστός na-arụ ọrụ dịka utu aha. “Mesaya” na-echekwa ọrụ ya dịka utu aha kama ime ya naanị aha mmadụ.
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Mesaya
  alternative: Kraịst
  rationale: A họọrọ “Mesaya” iji gosipụta na Χριστός bụ utu aha n’ebe a; ihe odide ala peeji na-edekọ nsụgharị ọdịnala “Kraịst.”
- issue: Ụdị ihe mgbochi dị na πᾶν ὕψωμα ἐπαιρόμενον
  choice: ihe ọ bụla dị elu nke e weliri
  alternative: nganga ọ bụla nke na-ebuli onwe ya elu
  rationale: Nsụgharị a na-ahapụ ihe atụ Grik ka ọ saa mbara, kama imechi ya naanị n’ihe banyere nganga, nkwupụta mpako, ma ọ bụ arụmụka.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ nọgidere bụrụ akụkụ ahịrịokwu jikọrọ ihe bu ya ụzọ, dịka καί na participle Grik si egosi; e chekwara ihe atụ nke ihe e weliri elu na nke ịkpọrọ onye n’agha.
