  text: Ὁ δὲ καυχώμενος ἐν κυρίῳ καυχάσθω·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/017.yaml
  text: But the one who boasts must boast in the Lord[a].
translation:
  language: ig
  text: Ma onye na-anya isi, ka ọ nyaa isi n’Onyenwe anyị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O yikarịrị ka Pọl na-ekwugharị Jeremaịa 9:24 (LXX 9:23).
    reason: cross_reference
lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: onye na-anya isi
  rationale: Nkebiokwu a na-arụ ọrụ dị ka aha ma na-ezo aka n’ozuzu nye onye na-anya isi; nsụgharị a bụ Igbo doro anya ma na-edobe otu onye ahụ e ji anọchi anya mmadụ niile.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche na ihe e kwuru tupu ya, ya mere “Ma” dabara n’ọnọdụ a.
- source_word: καυχώμενος / καυχάσθω
  choice: na-anya isi / ya nyaa isi
  rationale: “Ịnya isi” na-edobe ike okwu καυχάομαι, ebe usoro “ya nyaa isi” na-egosipụta iwu ma ọ bụ agbamume nke καυχάσθω n’enweghị ịgbanwe ya ka ọ bụrụ nkwupụta nkịtị.
- source_word: ἐν
  choice: n’ime
  rationale: “N’ime Onyenwe anyị” na-egosipụta ebe ma ọ bụ ihe ndabere nke ịnya isi, ma na-edobekwa usoro okwu nke njikọ ahụ na Jeremaịa.
- source_word: κυρίῳ
  choice: Onyenwe anyị
  rationale: Nke a bụ aha Igbo a na-ejikarị sụgharị κύριος n’ụzọ dị ùgwù; a kọwaghị ya karịa ka Grik si kwuo.
theological_decisions:
- issue: Onye okwu “Onyenwe anyị” na-ezo aka na ya n’ọnọdụ nke nkwughachi Akwụkwọ Nsọ
  choice: Onyenwe anyị
  alternative: Chineke; Onyenwe anyị Jizọs
  rationale: Ebe Grik kwuru naanị κυρίῳ, nsụgharị ahụ anaghị ekpebi ma ọ bụ Chineke dị na Jeremaịa ka a na-elekwasị anya kpọmkwem, ma ọ bụ Onyenwe anyị Jizọs n’ojiji Pọl; ọ na-edobe nghọta abụọ ahụ n’enweghị mgbakwunye nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, doro anya ma dị ùgwù mee ihe. E debere nkwughachi “na-anya isi ... nyaa isi” iji chekwaa usoro na ike okwu Grik, tinyere ụdị iwu ya.
