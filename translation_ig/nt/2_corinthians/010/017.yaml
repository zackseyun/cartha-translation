revisions:
- from: Ma onye na-anya isi, ya nyaa isi n’ime Onyenwe anyị.[a]
  to: Ma onye na-anya isi, ka ọ nyaa isi n’Onyenwe anyị.[a]
  rationale: The revision supplies the natural Standard Igbo third-person exhortative “ka ọ nyaa isi” for καυχάσθω and uses the idiomatic “n’Onyenwe anyị” for boasting in the Lord. The cross-reference note is retained, while its redundant alternative wording is removed. No theological referent is specified beyond the Greek.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:27:49Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the mild contrast (δέ), the generic substantival participle, the repeated boast-language, and the non-specified referent of κυρίῳ. However, the imperative καυχάσθω is not naturally or clearly expressed by “ya nyaa isi”; Standard Igbo normally marks this third-person exhortation with “ka ọ ...”. The idiomatic complement of “ịnya isi” here is also better rendered with “n’Onyenwe anyị” than the overly spatial “n’ime Onyenwe anyị.”
  naturalness: “Ma onye na-anya isi, ka ọ nyaa isi n’Onyenwe anyị” is clear, modern Standard Igbo with an appropriately dignified biblical register. It retains the Greek repetition and imperative force without sounding like a literal calque.
  terminology: “Onyenwe anyị” is an appropriate established rendering for κύριος and, without adding “Jizọs” or “Chineke,” preserves the source text’s referential openness. “Ịnya isi” appropriately renders καυχάομαι in this context.
  issues:
  - severity: medium
    issue: The main clause uses “ya nyaa isi.”
    rationale: This does not clearly or naturally convey the Greek third-person imperative in contemporary Standard Igbo. “Ka ọ nyaa isi” is the normal exhortative form.
  - severity: medium
    issue: The phrase “n’ime Onyenwe anyị” is too spatial/literal.
    rationale: With “ịnya isi,” “n’Onyenwe anyị” is the natural idiom for boasting in the Lord and better conveys the source construction without suggesting physical location.
  - severity: low
    issue: The footnote’s proposed more-formal wording repeats the needed correction but is framed as an alternative to an unclear main text.
    rationale: Once the main text properly uses the third-person exhortative, the note should retain the useful Jeremiah allusion rather than present a redundant formal alternative.
  revised_text: Ma onye na-anya isi, ka ọ nyaa isi n’Onyenwe anyị.[a]
  revised_footnotes:
  - marker: a
    text: O yikarịrị ka Pọl na-ekwugharị Jeremaịa 9:24 (LXX 9:23).
    reason: cross_reference
  revision_rationale: The revision supplies the natural Standard Igbo third-person exhortative “ka ọ nyaa isi” for καυχάσθω and uses the idiomatic “n’Onyenwe anyị” for boasting in the Lord. The cross-reference note is retained, while its redundant alternative wording is removed. No theological referent is specified beyond the Greek.
