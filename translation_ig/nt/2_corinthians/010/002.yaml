reference: 2 Corinthians 10:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δέομαι δὲ τὸ μὴ παρὼν θαρρῆσαι τῇ πεποιθήσει ᾗ λογίζομαι τολμῆσαι ἐπί τινας τοὺς λογιζομένους ἡμᾶς ὡς κατὰ σάρκα περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: ig
  text: Ma ana m arịọsi ike ka, mgbe m nọ n’ihu unu, ọ ghara ịdị m mkpa igosi nkwuwa okwu site n’obi ike ahụ nke m bu n’obi iji were mee ihe megide ụfọdụ ndị na-ewere anyị na anyị na-ebi ndụ dịka anụ ahụ si dị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dịka ụkpụrụ mmadụ si dị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δέομαι
  choice: ana m arịọsi ike
  rationale: Nke a na-egosi arịrịọ siri ike karịa nanị ‘ana m arịọ,’ ma na-echekwa ụda arịrịọ Pọl.
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: ka, mgbe m nọ n’ebe unu, ọ ghara ịdị m mkpa iji obi ike
  rationale: Nsụgharị a na-enye ọdịnaya arịrịọ ahụ n’Igbo dị ugbu a ma na-egosi na Pọl achọghị ka ọnọdụ mee ka o gosipụta nkwuwa okwu ahụ mgbe ọ bịara.
- source_word: τῇ πεποιθήσει
  choice: iji obi ike ahụ
  rationale: ‘Obi ike’ na-egosi ntụkwasị obi na nkwenye siri ike e ji eme ihe n’ebe a.
- source_word: ᾗ λογίζομαι
  choice: m chere na m ga-eji
  rationale: Nke a na-egosi echiche ma ọ bụ mkpebi Pọl tụlere, n’enweghị ime ka ọ bụrụ nkwubi okwu doro anya karịa ihe Grik kwuru.
- source_word: τολμῆσαι ἐπί τινας
  choice: iji nkwuwa okwu mee ihe megide ụfọdụ ndị
  rationale: Nke a na-echekwa echiche nke ime ihe n’atụghị egwu na ntụzịaka mmegide nke ἐπί n’ebe ụfọdụ mmadụ nọ, n’etinyeghị nkọwa karịrị isi mmalite.
- source_word: τοὺς λογιζομένους
  choice: ndị na-ewere anyị dị ka
  rationale: Okwu a na-egosi otú ndị ahụ si atụle ma na-ekpe Pọl na ndị ọrụ ibe ya ikpe.
- source_word: κατὰ σάρκα
  choice: dịka anụ ahụ si dị
  rationale: A hapụrụ okwu Pọl banyere ‘anụ ahụ’ ka ọ dị, iji chekwaa obosara ihe ọ pụrụ ịpụta na njikọ nkà mmụta okpukpe ya.
- source_word: περιπατοῦντας
  choice: ndị na-eje ije
  rationale: A nọgidere n’ihe atụ Pọl nke ‘ije ije’ nke pụtara ụzọ mmadụ si ebi ma na-akpa àgwà.
theological_decisions:
- issue: Nsụgharị σάρξ n’okwu κατὰ σάρκα
  choice: dịka anụ ahụ si dị
  alternative: dịka ụkpụrụ mmadụ si dị
  rationale: Isiokwu a pụrụ izo aka n’ibi ndụ nke ihe anụ ahụ ma ọ bụ n’ịtụ ihe n’ụkpụrụ mmadụ. Ịsụgharị ya ‘anụ ahụ’ na-echekwa mgbagwoju anya na ụda pụrụ iche nke okwu Pọl; ihe ọzọ e nwere ike ịghọta ya dị na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke dị ùgwù ma dị mfe nghọta mee ihe. A nọgidere n’ihe atụ ‘ije ije’ na okwu ‘anụ ahụ,’ ebe e mere nhazi ahịrịokwu ahụ ka ọ bụrụ nke mmadụ Igbo nke oge a ga-aghọta nke ọma.
