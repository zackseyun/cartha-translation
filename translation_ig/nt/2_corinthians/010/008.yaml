reference: 2 Corinthians 10:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐάν ⸀τε ⸀γὰρ περισσότερόν τι καυχήσωμαι περὶ τῆς ἐξουσίας ἡμῶν, ἧς ἔδωκεν ὁ ⸀κύριος εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν, οὐκ αἰσχυνθήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: ig
  text: N’ihi na, ọ bụrụgodị na m etu ọnụ ntakịrị karịa banyere ikike anyị, nke Onyenwe anyị nyere anyị iji wulie unu elu, ọ bụghị iji kwatuo unu,[a] ihere agaghị eme m.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụghị iji bibie unu.” Okwu Grik ahụ nwere ike ịpụta mbibi; “kwatuo” na-echekwa ihe atụ ụlọ nke dị n’etiti iwuli elu na ịkwatu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “agaghị m enwe ihere.” Ụdị okwu Grik ahụ nwere ike ịpụta ịbụ onye e tinyere n’ihere ma ọ bụ ịbụ onye ihere jidere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: N’ihi na, ọ bụrụgodị na
  rationale: “N’ihi na” na-egosipụta ọrụ nkọwa nke γάρ, ebe “ọ bụrụgodị na” na-enye ọnọdụ nke ἐάν ma na-ewebata echiche mgbakwunye nke τε n’Igbo eke.
- source_word: περισσότερόν τι
  choice: ntakịrị karịa
  rationale: Nke a na-echekwa echiche ntụnyere nke περισσότερον na nkwụsịtụ ma ọ bụ ime ka okwu dị nro nke τι.
- source_word: καυχήσωμαι
  choice: m etu ọnụ
  rationale: “Ịtu ọnụ” bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji eme ihe maka ikwu okwu ji ihe ma ọ bụ ọnọdụ mmadụ anya isi; ọnọdụ “ọ bụrụgodị na” na-eburu ụdị subjunctive ahụ.
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: banyere ikike anyị
  rationale: “Ikike” na-egosi ikike e nyere mmadụ ime ihe, ọ bụghị naanị ume ma ọ bụ ike nkịtị.
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: nke Onyenwe anyị nyere anyị
  rationale: “Nke” na-alaghachi n’“ikike”; a tinyere “anyị” dị ka nnara nke onyinye ahụ n’ihi na ọ pụtara ìhè n’okwu gbara ya gburugburu. “Onyenwe anyị” na-echekwa aha nsọpụrụ κύριος.
- source_word: εἰς οἰκοδομὴν
  choice: iji wulie unu elu
  rationale: Nke a na-echekwa ihe atụ ụlọ nke οἰκοδομή ma na-eme ka ndị a na-ewuli elu, ndị Kọrịnt, pụta ìhè.
- source_word: καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: ọ bụghị iji kwatuo unu
  rationale: “Kwatuo” na-echekwa ihe atụ nke ịkwatu ụlọ ma na-emegide “wulie unu elu” n’ụzọ doro anya.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: ihere agaghị eme m
  rationale: Akpaalaokwu Igbo a bụ ụzọ eke isi kwuo na a gaghị etinye mmadụ n’ihere; ọ na-anabata ma echiche passive nke ịbụ onye e mere ihere ma nghọta nke ịbụ onye ihere jidere.
theological_decisions:
- issue: Ụdị na nzube nke ikike ndịozi
  choice: E gosiri ikike Pọl dị ka nke Onyenwe anyị nyere iji mee ka ndị Kọrịnt sie ike, ọ bụghị iji bibie ha.
  alternative: Ịghọta ikike ahụ karịsịa dị ka ikike ịdọ aka ná ntị nke nzube ya bụ ịla ndị mmadụ n’iyi.
  rationale: Mmegide dị n’etiti οἰκοδομή na καθαίρεσις na-egosi nzube iwulite, ma ọ naghị ewepụ na a pụrụ iji ikike ahụ kwuo okwu siri ike. Nsụgharị ahụ na-echekwa esemokwu a.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Wulie unu elu/kwatuo unu” na-echekwa otu ihe atụ ụlọ dị n’asụsụ Grik. E debere akara nkọwa ala ala peeji [a] na [b] n’ebe okwu ha na-akọwa dị.
