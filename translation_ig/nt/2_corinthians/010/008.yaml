- from: N’ihi na, ọ bụrụgodị na m etu ọnụ ntakịrị karịa banyere ikike anyị, nke Onyenwe anyị nyere anyị iji wulie unu elu, ọ bụghị iji kwatuo unu,[a] ihere agaghị eme m.[b]
