id: 2CO.10.15
reference: 2 Corinthians 10:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ εἰς τὰ ἄμετρα καυχώμενοι ἐν ἀλλοτρίοις κόποις, ἐλπίδα δὲ ἔχοντες αὐξανομένης τῆς πίστεως ὑμῶν ἐν ὑμῖν μεγαλυνθῆναι κατὰ τὸν κανόνα ἡμῶν εἰς περισσείαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/015.yaml
  text: not boasting beyond measure in the labors of others, but having hope that, as your faith is growing among you, we will be enlarged according to our sphere of ministry, unto abundance,
translation:
  language: ig
  text: anyị adịghị etu ọnụ gabiga ókè n’ọrụ ndị ọzọ rụrụ. Kama, anyị nwere olileanya na ka okwukwe unu na-eto, a ga-eme ka ọrụ anyị gbasaa nke ukwuu n’etiti unu, n’ime oke ọrụ e kenyere anyị,[a][b] ruo n’ụba.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka oke e kenyere anyị si dị,” ma ọ bụ “dị ka ụkpụrụ anyị si dị.” Okwu Grik κανών n’ebe a na-ezo aka n’oke ma ọ bụ mpaghara ọrụ e tụrụ nye mmadụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a ga-ebuli anyị elu,” ma ọ bụ “a ga-eme ka anyị dị ukwuu.” N’ọnọdụ okwu a, ọ pụrụ izo aka na mgbasawanye ọrụ ndịozi Pọl, ọ bụghị nanị otuto onwe onye.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “ruo n’ókè ka ukwuu,” ma ọ bụ “ka ọ gbasaa n’ihu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: Anyị adịghị etu ọnụ gabiga ókè
  rationale: Nke a na-edobe ihe atụ nke oke ma na-egosi na Pọl adịghị etu ọnụ gafee ókè kwesịrị ekwesị.
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: site n’ọrụ ndị ọzọ rụrụ
  rationale: Ọ na-egosi ọrụ siri ike nke ndị ọzọ rụrụ, nke Pọl na-agaghị ekwu na ọ bụ ya rụrụ ya.
- source_word: ἐλπίδα δὲ ἔχοντες
  choice: Kama, anyị nwere olileanya
  rationale: Ọ na-edobe aha ἐλπίς dị ka ‘olileanya’ ma na-asụ ya n’ụzọ Igbo dị mma.
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν
  choice: ka okwukwe unu na-eto
  rationale: ‘Okwukwe’ bụ ntụgharị kwesịrị ekwesị nke πίστις ebe a; ahịrịokwu ahụ na-egosi uto na-aga n’ihu.
- source_word: ἐν ὑμῖν μεγαλυνθῆναι
  choice: a ga-eme ka ọrụ anyị gbasaa nke ukwuu n’etiti unu
  rationale: Ọ na-ejikọta ἐν ὑμῖν na mgbasawanye ahụ ma na-eme ka o doo anya na ihe a na-ekwu bụ ọrụ Pọl, ọ bụghị ibuli onwe ya elu; akara ụkwụ na-echekwa ntụgharị ndị ọzọ.
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: n’ime oke ọrụ e kenyere anyị
  rationale: κανών n’ọnọdụ a bụ oke ma ọ bụ mpaghara ọrụ a tụrụ ma kenye, ọ bụghị ‘kanọn’ n’echiche e ji okwu ahụ eme mgbe e mesịrị.
- source_word: εἰς περισσείαν
  choice: ruo n’ụba
  rationale: Ọ na-echekwa echiche ngagharị nke εἰς na echiche ụba ma ọ bụ mgbasawanye ka ukwuu dị na περισσεία.
theological_decisions:
- issue: Ihe μεγαλυνθῆναι na-ekwu banyere ya
  choice: Mgbasawanye ọrụ ndịozi Pọl n’etiti ndị Kọrịnt na n’ihu
  alternative: Ka ndị Kọrịnt bulie Pọl elu ma ọ bụ kwanyere ya ùgwù karịa
  rationale: Amaokwu ndị gbara ya gburugburu na-ekwu banyere mpaghara ọrụ e kenyere Pọl na ịghara ịnya isi n’ọrụ onye ọzọ; ya mere, mgbasawanye ọrụ bụ isi nghọta, ebe akara ụkwụ na-echekwa nkọwa ọzọ.
- issue: Ihe κανών pụtara
  choice: oke ọrụ e kenyere anyị
  alternative: usoro; ụkpụrụ; oke anyị
  rationale: N’ebe a okwu ahụ na-egosi mpaghara ma ọ bụ oke ọrụ Chineke nyere, ọ bụghị akwụkwọ nsọ ndị a kpọrọ ‘kanọn’ ma ọ bụ naanị ụkpụrụ omume.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Itu ọnụ,’ ‘okwukwe,’ na ‘oke ọrụ e kenyere anyị’ na-echekwa njikọ okwu na isi arụmụka nke amaokwu ndị gbara ya gburugburu; e tinyere nkọwa ndị dị mkpa n’akara ụkwụ kama idozi nghọta niile n’ahịrị isi.
