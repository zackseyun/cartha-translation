revisions:
- from: Anyị adịghị etu ọnụ gabiga ókè site n’ọrụ ndị ọzọ rụrụ. Kama, anyị nwere olileanya na ka okwukwe unu na-eto, a ga-eme ka ọrụ anyị gbasaa nke ukwuu n’etiti unu, n’ime oke ọrụ e kenyere anyị,[a][b] ruo n’ụba.[c]
  to: anyị adịghị etu ọnụ gabiga ókè n’ọrụ ndị ọzọ rụrụ. Kama, anyị nwere olileanya na ka okwukwe unu na-eto, a ga-eme ka ọrụ anyị gbasaa nke ukwuu n’etiti unu, n’ime oke ọrụ e kenyere anyị,[a][b] ruo n’ụba.[c]
  rationale: A single safe correction replaces “site n’ọrụ” with “n’ọrụ” so that the Igbo reflects Paul’s refusal to boast in others’ labors rather than implying that such labor is the means or source of his boasting. No other changes are needed.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:27:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft faithfully conveys the main contrast: Paul does not boast beyond proper limits in work belonging to others, but hopes for enlargement in relation to the Corinthians as their faith grows. However, “site n’ọrụ ndị ọzọ rụrụ” can mean “by means of/from the work others did,” whereas ἐν ἀλλοτρίοις κόποις is best represented here as boasting “in/regarding” others’ labors. Removing site n’ gives the needed locative/associative sense. The contextual rendering of μεγαλυνθῆναι as the expansion of Paul’s work is defensible, while footnote b retains the more literal alternatives.'
  naturalness: The Igbo is clear, modern Standard Igbo, and appropriately formal. “Etu ọnụ gabiga ókè,” “okwukwe unu na-eto,” and “oke ọrụ e kenyere anyị” communicate naturally. The small prepositional correction improves both naturalness and accuracy.
  terminology: 'Key terms are handled well: okwukwe for πίστις, olileanya for ἐλπίς, and oke ọrụ e kenyere anyị for κανών in its contextual sense of an assigned sphere. The footnotes appropriately prevent anachronistic interpretation of κανών and preserve alternatives for μεγαλυνθῆναι and εἰς περισσείαν.'
  issues:
  - severity: medium
    issue: “site n’ọrụ ndị ọzọ rụrụ” is not the best rendering of ἐν ἀλλοτρίοις κόποις.
    rationale: The Greek expresses boasting in connection with, or concerning, the labors that belong to others—not boasting by means of those labors. “n’ọrụ ndị ọzọ rụrụ” conveys this more directly without altering the meaning.
  revised_text: anyị adịghị etu ọnụ gabiga ókè n’ọrụ ndị ọzọ rụrụ. Kama, anyị nwere olileanya na ka okwukwe unu na-eto, a ga-eme ka ọrụ anyị gbasaa nke ukwuu n’etiti unu, n’ime oke ọrụ e kenyere anyị,[a][b] ruo n’ụba.[c]
