review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the missionary purpose (εὐαγγελίσασθαι), the geographic sense of τὰ ὑπερέκεινα ὑμῶν, and Paul's refusal to boast regarding τὰ ἕτοιμα within another person's κανών. However, the word order in the negative clause makes “iji ihe ndị a kwadeberela” sound like the means by which boasting occurs, rather than the matter concerning which one boasts.
  naturalness: “Ala ndị dị gabiga unu” is understandable but somewhat stiff. “Ógbè ndị dị n’ofe unu” is more idiomatic Standard Igbo for regions beyond the Corinthians. Recasting the final clause with “ghara ịnya isi n’ihe … n’ókè ọrụ onye ọzọ” gives a clear, natural scope for the two prepositional phrases.
  terminology: “Kwusaa ozi ọma,” “ịnya isi,” and “ókè ọrụ” are suitable and preserve the relevant meaning. “Ókè ọrụ” appropriately represents κανών as an assigned sphere of ministry rather than a moral rule or later biblical canon.
  issues:
  - severity: medium
    issue: Ambiguous and unnatural arrangement of the negative clause
    rationale: In “ọ bụghị iji ihe ndị a kwadeberela n’ókè ọrụ onye ọzọ na-anya isi,” the infinitival/continuative construction and placement of “iji” can suggest boasting by means of prepared things. Greek εἰς τὰ ἕτοιμα marks the object or respect of boasting, while ἐν ἀλλοτρίῳ κανόνι locates it within another's sphere.
  - severity: low
    issue: Geographic expression is slightly stiff
    rationale: “N’ala ndị dị gabiga unu” is comprehensible, but “n’ógbè ndị dị n’ofe unu” more naturally expresses the plural geographic regions denoted by τὰ ὑπερέκεινα without making “lands” part of the main rendering.
  revised_text: ka anyị wee kwusaa ozi ọma n’ógbè ndị dị n’ofe unu,[a] ghara ịnya isi n’ihe ndị a kwadeberela n’ókè ọrụ onye ọzọ.[b][c]
