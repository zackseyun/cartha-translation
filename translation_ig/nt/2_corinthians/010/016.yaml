id: 2CO.10.16
reference: 2 Corinthians 10:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς τὰ ὑπερέκεινα ὑμῶν εὐαγγελίσασθαι, οὐκ ἐν ἀλλοτρίῳ κανόνι εἰς τὰ ἕτοιμα καυχήσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/016.yaml
  text: to proclaim the good news in the regions beyond you[c][b][a], not to boast in another's sphere about things already prepared.
translation:
  language: ig
  text: ka anyị wee kwusaa ozi ọma n’ógbè ndị dị n’ofe unu,[a] ghara ịnya isi n’ihe ndị a kwadeberela n’ókè ọrụ onye ọzọ.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka anyị wee kwusaa ozi ọma n’ala ndị dị n’ofe unu.”
    reason: lexical_alternative
  - marker: b
    text: “Ókè ọrụ” sụgharịrị okwu Grik κανών n’ebe a dịka mpaghara ma ọ bụ ọrụ e kenyere mmadụ; ọ pụtaghị iwu omume ma ọ bụ “kanọn” n’echiche e mechara jiri ya.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “ghara ịnya isi n’ókè ọrụ onye ọzọ banyere ihe ndị dịlarị njikere.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερέκεινα ὑμῶν
  choice: n’ala ndị dị gabiga unu
  rationale: Nkebiokwu a na-egosi ebe ndị dị n’ofe ebe ndị Kọrịnt nọ. “Ala ndị dị gabiga unu” bụ Igbo doro anya nke na-echekwa ntụaka ahụ n’ebe unu nọ.
- source_word: εὐαγγελίσασθαι
  choice: ka anyị wee kwusaa ozi ọma
  rationale: Nke a na-echekwa ike ngwaa nke ikwusa ozi ọma ma bụrụ okwu Igbo nkịtị, doro anya.
- source_word: ἀλλοτρίῳ κανόνι
  choice: n’ókè ọrụ onye ọzọ
  rationale: κανών n’ebe a bụ ókè ma ọ bụ mpaghara ọrụ e kenyere mmadụ, ọ bụghị iwu omume ma ọ bụ 'kanọn' Akwụkwọ Nsọ. “Ókè ọrụ” na-eme ka ihe atụ ahụ doo anya n’Igbo.
- source_word: τὰ ἕτοιμα
  choice: ihe ndị a kwadeberela
  rationale: Adjective ahụ ji ọnọdụ aha na-ezo aka n’ihe dịlarị njikere. Nsụgharị a na-echekwa ịdị n’obosara nke okwu Grik, n’agbanyeghị na gburugburu amaokwu ahụ nwere ike izo aka n’ọrụ ndị ọzọ rụcharala.
- source_word: καυχήσασθαι
  choice: iji ... na-anya isi
  rationale: “Ịnya isi” na-echekwa okwu Pọl ji ugboro ugboro maka καυχάομαι ma na-adaba n’ụda okwu a.
theological_decisions:
- issue: Ihe κανών pụtara n’ihe gbasara ozi Pọl
  choice: ókè ọrụ e kenyere mmadụ
  alternative: iwu, ụkpụrụ, ma ọ bụ kanọn
  rationale: Amaokwu 13–15 na-ekwu banyere ókè e tụrụ na mpaghara ọrụ. Ya mere, okwu a na-ezo aka n’ókè ọrụ ozi, ọ bụghị n’iwu omume ma ọ bụ n’usoro akwụkwọ Akwụkwọ Nsọ.
- issue: Ihe τὰ ἕτοιμα na-ezo aka na ya
  choice: ihe ndị a kwadeberela
  alternative: ọrụ ndị ọzọ rụcharala ma ọ bụ kwadebere
  rationale: E debere okwu bụ isi n’obosara ya dịka Grik si dị, ebe nkọwa ala peeji na-egosi nghọta dabere n’okirikiri amaokwu ahụ na ọ pụrụ ịbụ ọrụ ndị ọzọ rụcharala.
- issue: Njikọ εἰς τὰ ἕτοιμα na καυχήσασθαι
  choice: ịnya isi n’ihe ndị a kwadeberela n’ókè ọrụ onye ọzọ
  alternative: ịnya isi n’ókè ọrụ onye ọzọ banyere ihe dị njikere
  rationale: Grik ahụ dị mkpirikpi ma nwekwaa ntakịrị mgbagwoju anya. Usoro Igbo a na-eme ka echiche bụ isi doo anya n’ebughị nkọwa karịa ihe gburugburu amaokwu ahụ kwadoro.
translation_notes:
  register: Standard Igbo dị ugbu a, kwụ ọtọ ma nwee ugwu. E ji “ala ndị dị gabiga unu” mee ka ntụaka ala nke ὑπερέκεινα ὑμῶν doo anya; e jikwa “ókè ọrụ” zere okwu ụka pụrụ iche ma chekwaa ihe atụ Pọl banyere mpaghara ozi.
