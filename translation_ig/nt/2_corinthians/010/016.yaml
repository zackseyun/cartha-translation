- from: ka anyị wee kwusaa ozi ọma n’ala ndị dị gabiga unu,[a] ọ bụghị iji ihe ndị a kwadeberela n’ókè ọrụ onye ọzọ na-anya isi.[b][c]
  to: ka anyị wee kwusaa ozi ọma n’ógbè ndị dị n’ofe unu,[a] ghara ịnya isi n’ihe ndị a kwadeberela n’ókè ọrụ onye ọzọ.[b][c]
  rationale: 'The revision retains the draft’s sound lexical choices while making the syntax faithfully reflect the Greek relationship: Paul does not boast concerning things already prepared within another person''s assigned sphere. It also uses a more natural Igbo expression for geographic regions beyond the addressees. The alternative footnote is revised so that it remains an alternative rendering rather than asserting that the items are necessarily completed work.'
