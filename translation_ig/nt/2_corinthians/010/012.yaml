id: 2CO.10.12
reference: 2 Corinthians 10:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐ γὰρ τολμῶμεν ἐγκρῖναι ἢ συγκρῖναι ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων· ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς οὐ συνιᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: ig
  text: N’ihi na anyị adịghị anwa anwa ịgụ onwe anyị n’etiti ụfọdụ n’ime ndị na-eto onwe ha, ma ọ bụ iji onwe anyị tụnyere ha[a]. Ma ha onwe ha, mgbe ha ji onwe ha atụ onwe ha, jirikwa onwe ha tụnyere onwe ha[b], ha enweghị nghọta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “itinye onwe anyị n’etiti ụfọdụ n’ime ha” ma ọ bụ “itinye onwe anyị n’otu ọkwa ha.” Ngwaa Grik ahụ na-enye echiche nke itinye onwe mmadụ n’otu ìgwè ma ọ bụ ọkwa na ndị ọzọ.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ nkịtị: “na-atụ onwe ha n’ime onwe ha, na-atụnyekwa onwe ha na onwe ha.” Echiche ya bụ na ha na-eji onwe ha bụrụ ụkpụrụ ha ji atụ onwe ha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: anyị adịghị anwa anwa
  rationale: Nke a na-egosi na Pọl ajụghị nanị ime ihe ahụ, kama na o kwughị na ya ga-eji mpako mee ya; ọ na-echekwakwa ụda okwu njakịrị dị n’ahịrịokwu ahụ.
- source_word: ἐγκρῖναι
  choice: itinye onwe anyị n’otu ọkwa
  rationale: N’ebe a, ngwaa ahụ pụtara itinye mmadụ n’otu ìgwè ma ọ bụ n’otu ọkwa na ndị ọzọ, ọ bụghị ikpe omume mmadụ ikpe.
- source_word: συγκρῖναι / συγκρίνοντες
  choice: iji onwe anyị tụnyere / jirikwa onwe ha tụnyere
  rationale: ‘Ịtụnyere’ bụ okwu Igbo doro anya maka iji otu ihe lelee ibe ya; imegharị ya na-echekwa nkwughachi okwu Grik.
- source_word: ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων
  choice: onwe anyị ... ụfọdụ n’ime ndị na-eto onwe ha
  rationale: ‘Na-eto onwe ha’ na-egosipụta nkwado ma ọ bụ otuto ha na-enye onwe ha, bụ́ isi okwu dị n’akụkụ akwụkwọ ozi a.
- source_word: ἀλλὰ αὐτοὶ
  choice: Ma ha onwe ha
  rationale: ‘Ha onwe ha’ na-echekwa nkwusi ike nke αὐτοὶ ma mee ka ọdịiche dị n’etiti Pọl na ndị ahụ pụta ìhè.
- source_word: ἐν ἑαυτοῖς
  choice: ji onwe ha
  rationale: Nkebiokwu a nwere ike ịbụ ‘n’etiti onwe ha’ ma ọ bụ ‘site n’onwe ha’; n’ọnọdụ a ọ na-egosi na ha na-eji onwe ha dịka ihe atụ ha ji atụ ihe.
- source_word: μετροῦντες
  choice: atụ
  rationale: ‘Ịtụ’ na-echekwa ihe atụ nke ịtụ ihe, ma n’ebe a ọ pụtara inyocha ma ọ bụ ịtụle mmadụ dịka ụkpụrụ si dị.
- source_word: ἑαυτοὺς ἑαυτοῖς
  choice: onwe ha ... onwe ha
  rationale: Nkwughachi ‘onwe ha’ dị mkpa n’ịkatọ ha maka iji naanị onwe ha bụrụ ụkpụrụ.
- source_word: οὐ συνιᾶσιν
  choice: ha adịghị aghọta ihe
  rationale: Nke a bụ ntụgharị Igbo dị mfe ma kwekọọ na ihe ngwaa συνίημι pụtara; ihe ha na-adịghị aghọta ka ahịrịokwu ahụ hapụrụ ya n’ụzọ sara mbara.
theological_decisions:
- issue: Ihe ndị ahụ na-eji atụ onwe ha
  choice: E debere nkwughachi na-egosi na ha na-eji onwe ha dịka ụkpụrụ
  alternative: Ịkọwa ya ozugbo dịka ‘ha na-eji onwe ha bụrụ ụkpụrụ nke onwe ha’
  rationale: Nke a na-echekwa ihe atụ na nkwughachi nke Grik, ebe nkọwa ala peeji na-eme ka echiche ya doo anya n’enweghị ịgbakwunye nkọwa n’ahịrịokwu ahụ.
- issue: Ihe e zoro ezo n’okwu οὐ συνιᾶσιν
  choice: ha adịghị aghọta ihe
  alternative: ha adịghị aghọta nzuzu ha
  rationale: Ihe Grik ekwughị kpọmkwem ihe ha na-adịghị aghọta; ya mere, a zere idozi ihe a kpachaara anya hapụ ka ọ ghara ịgbakwunye nkọwa nkà mmụta okpukpe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi ‘onwe ha’ iji gosipụta ike okwu Pọl, ma jiri nkọwa ala peeji kọwaa akpaalaokwu Grik n’enweghị ime ka isiokwu ahụ bụrụ nke otu ụka ma ọ bụ otu nkọwa pụrụ iche.
