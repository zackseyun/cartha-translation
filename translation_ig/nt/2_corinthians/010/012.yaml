revisions:
- from: N’ihi na anyị adịghị anwa anwa itinye onwe anyị n’otu ọkwa ma ọ bụ iji onwe anyị tụnyere ụfọdụ n’ime ndị na-eto onwe ha[a]. Ma ha onwe ha, mgbe ha ji onwe ha atụ onwe ha, jirikwa onwe ha tụnyere onwe ha[b], ha adịghị aghọta ihe.
  to: N’ihi na anyị adịghị anwa anwa ịgụ onwe anyị n’etiti ụfọdụ n’ime ndị na-eto onwe ha, ma ọ bụ iji onwe anyị tụnyere ha[a]. Ma ha onwe ha, mgbe ha ji onwe ha atụ onwe ha, jirikwa onwe ha tụnyere onwe ha[b], ha enweghị nghọta.
