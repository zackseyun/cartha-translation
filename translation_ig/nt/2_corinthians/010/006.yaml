  text: καὶ ἐν ἑτοίμῳ ἔχοντες ἐκδικῆσαι πᾶσαν παρακοήν, ὅταν πληρωθῇ ὑμῶν ἡ ὑπακοή.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/006.yaml
  text: and being ready to punish every act of disobedience[b][a], when your obedience is complete.
translation:
  language: ig
  text: anyị dịkwa njikere ịta nnupụisi niile ahụhụ[a], mgbe nrubeisi unu zuru oke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “imegwara nnupụisi niile.” Okwu Grik ahụ nwere ike ịpụta ịbọ ọbọ ma ọ bụ ime ka ikpe ziri ezi nweta; ma n''ebe a, o yikarịrị ka ọ na-ekwu banyere ntaramahụhụ e ji adọ ndị nọ n''ọgbakọ aka ná ntị.'
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụ ya: “mgbe e mezuru nrubeisi unu” ma ọ bụ “mgbe nrubeisi unu ruru n''uju.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑτοίμῳ ἔχοντες
  choice: anyị dịkwa njikere
  rationale: Akpaalaokwu Grik a pụtara ịnọ na njikere; nsụgharị a bụ nke dị mfe ma bụrụkwa Igbo nkịtị, ma na-ejikọ ahịrịokwu ahụ na ihe bu ya ụzọ site na “dịkwa.”
- source_word: ἐκδικῆσαι
  choice: ịta ... ahụhụ
  rationale: N'ọnọdụ a, okwu ahụ na-ezo aka n'ime ihe megide nnupụisi dịka iji ikike nye ntaramahụhụ, ọ bụghị imegwara onwe onye; ihe ọzọ ọ pụrụ ịpụta ka edebere n'ala peeji.
- source_word: πᾶσαν παρακοήν
  choice: nnupụisi niile
  rationale: “Nnupụisi” na-egosi ịjụ irube isi, ebe “niile” na-echekwa ike nkesa nke πᾶσαν n'okwu ahụ.
- source_word: ὅταν
  choice: mgbe
  rationale: ὅταν na subjunctive na-egosi ọnọdụ ga-eme n'ọdịnihu; “mgbe” bụ ụzọ Igbo e ji ekwu ya n'ụzọ ebumpụta ụwa n'ebe a.
- source_word: πληρωθῇ
  choice: zuru oke
  rationale: Passive subjunctive a na-egosi nrubeisi iru n'uju ma ọ bụ imezu; “zuru oke” na-enye echiche ahụ n'Igbo doro anya.
- source_word: ὑμῶν ἡ ὑπακοή
  choice: nrubeisi unu
  rationale: Nke a na-echekwa njikọ nke okwu ahụ na ndị Kọrịnt ma na-ada nke ọma n'Igbo.
theological_decisions:
- issue: Ụdị ihe Pọl dị njikere ime megide nnupụisi
  choice: inye nnupụisi ntaramahụhụ dịka iji ikike apostọlik dozie ọgbakọ
  alternative: imegwara ndị mmegide, ma ọ bụ ikpe Chineke n'oge ikpeazụ
  rationale: Ihe ndị gbara amaokwu ahụ gburugburu metụtara ikike apostọlik na idozi ndị na-emegide ya. “Ịta ... ahụhụ” anaghị eme ka ọ bụrụ ịbọ ọbọ onwe onye, ebe ala peeji na-echekwa ohere mkpụrụokwu Grik ahụ nwere.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dịkwa mfe nghọta. A họọrọ “nnupụisi” iji gosipụta ịjụ irube isi n'ụzọ siri ike; e debere nghọtahie mkpụrụokwu ndị bụ isi n'ala peeji.
