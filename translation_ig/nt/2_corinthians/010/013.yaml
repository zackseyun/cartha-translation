id: 2CO.10.13
reference: 2 Corinthians 10:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ⸀οὐκ εἰς τὰ ἄμετρα καυχησόμεθα, ἀλλὰ κατὰ τὸ μέτρον τοῦ κανόνος οὗ ἐμέρισεν ἡμῖν ὁ θεὸς μέτρου, ἐφικέσθαι ἄχρι καὶ ὑμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/013.yaml
  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: ig
  text: Ma anyị agaghị etu ọnụ n'ụzọ gafere ókè, kama anyị ga-etu ọnụ n'ime ókè nke mpaghara[a] Chineke kenyere anyị—ókè nke ruru ọbụna ruo unu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “osisi e ji atụ ihe” ma ọ bụ “ụkpụrụ”; okwu Grik a nwere ike izo aka n'osisi e ji atụ ihe, ụkpụrụ, ma ọ bụ mpaghara e kenyere mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμετρα
  choice: gafee ókè
  rationale: Nke a na-egosi ịgafe oke kwesịrị ekwesị, ma na-edobekwa ihe atụ nke ịtụ ihe na oke.
- source_word: καυχησόμεθα
  choice: anyị ga-etu ọnụ
  rationale: “Itu ọnụ” bụ ụzọ Igbo nkịtị na nke doro anya si kwuo ịnya isi ma ọ bụ ikwu ihe mmadụ ji anya isi n'ọnọdụ esemokwu a.
- source_word: κατὰ τὸ μέτρον
  choice: dịka ókè ... si dị
  rationale: Ọ na-egosi na itu ọnụ ahụ ga-adị n'ime oke e nyere, ma na-echekwa nkwughachi nke echiche μέτρον.
- source_word: κανόνος
  choice: mpaghara
  rationale: N'ọnọdụ a, okwu ahụ na-ezo aka n'ubi ma ọ bụ mpaghara ọrụ Chineke kenyere Pọl, ọ bụghị naanị iwu omume ma ọ bụ akara e ji atụ ihe.
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς
  choice: nke Chineke kenyere anyị
  rationale: “Kenyere” na-egosipụta ikere ma ọ bụ inye mmadụ akụkụ ọrụ ya n'ụzọ Igbo dị mfe ma bụrụkwa nke ziri ezi.
- source_word: μέτρου
  choice: ókè
  rationale: Nkwughachi “ókè” na-echekwa nkwughachi μέτρον ma kọwaa na mpaghara ahụ nwere oke Chineke tụrụ.
- source_word: ἐφικέσθαι
  choice: nke ruru
  rationale: Ọ na-egosi ebe oke ma ọ bụ mpaghara ahụ gbatịrị ruo n'ụzọ dị nkenke ma bụrụ nke e ji eme ihe n'Igbo.
- source_word: ἄχρι καὶ ὑμῶν
  choice: ruo unu onwe unu
  rationale: '“Onwe unu” na-ebupụta nkwusi ike nke καί: ndị Kọrịnt sokwa n''ime mpaghara ọrụ ahụ.'
theological_decisions:
- issue: Ihe κανών pụtara n'okwu Pọl banyere ozi ya
  choice: Mpaghara ozi Chineke kenyere Pọl, nke gụnyere ndị Kọrịnt ma nwee oke a tụrụ
  alternative: Iwu ma ọ bụ ụkpụrụ e ji atụ itu ọnụ
  rationale: Ihe ndị gbara okwu ahụ gburugburu na-ekwughachi oke, ihe e kenyere, na iru ndị Kọrịnt; ya mere echiche gbasara mpaghara ozi e kenyere bụ nke kachasị pụta ìhè, n'agbanyeghị na okwu Grik ahụ nwekwara ike ịpụta osisi e ji atụ ihe, ụkpụrụ, ma ọ bụ iwu.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E ji “mpaghara” mee ka echiche ubi ozi e kenyere doo anya, ebe “ókè” na-edobe ihe atụ nke ịtụ ihe na nkwughachi μέτρον. Akara ogologo n'ikpeazụ na-egosi na ahịrịokwu ahụ gara n'ihu n'amaokwu na-esote.
