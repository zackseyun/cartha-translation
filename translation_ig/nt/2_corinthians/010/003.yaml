    text: Ma ọ bụ, “N’ihi na, ọ bụ ezie na anyị bi n’ahụ́, anyị anaghị alụ agha site n’ụkpụrụ mmadụ nanị.”
    reason: lexical_alternative
  revision_rationale: The revision replaces an unidiomatic rendering of κατὰ σάρκα with a natural Igbo expression denoting a fleshly or merely human mode, while retaining “anụ ahụ” in both clauses to preserve Paul’s rhetorical repetition. It also renders the first phrase as embodied human life rather than physical walking, consistent with the contextual force of περιπατέω.
