  yaml_path: translation/nt/2_corinthians/010/003.yaml
  text: For though we walk in the flesh[a], we do not wage war according to the flesh—
translation:
  language: ig
  text: N’ihi na, ọ bụ ezie na anyị na-adị ndụ n’anụ ahụ[a], anyị anaghị alụ agha n’ụzọ anụ ahụ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi na, ọ bụ ezie na anyị bi n’ahụ́, anyị anaghị alụ agha site n’ụkpụrụ mmadụ nanị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: n’anụ ahụ
  rationale: Nke a na-edobe okwu ahụ nso n’ụdị Grik ma na-egosi ndụ mmadụ n’ahụ, n’etinyeghị ya ozugbo n’echiche nke ọdịdị mmehie.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-akọwa ma ọ bụ na-akwado ihe e kwuru tupu ya.
- source_word: περιπατοῦντες
  choice: ọ bụ ezie na anyị na-eje ije
  rationale: “Na-eje ije” na-echekwa ihe atụ Pọl ji mee ihe; “ọ bụ ezie na” na-egosipụta ọdịiche dị n’etiti ọnọdụ ndụ ha na ụzọ ha si alụ agha.
- source_word: οὐ κατὰ σάρκα
  choice: anyị adịghị ... dị ka anụ ahụ si dị
  rationale: Nke a na-echekwa nkwughachi nke σάρξ ma hapụ nghọta ya ka ọ gụnye ụkpụrụ mmadụ nkịtị, ụzọ ụwa, ma ọ bụ ụzọ anụ ahụ na-achị, n’emeghị ka otu nkọwa bụrụ naanị ya.
- source_word: στρατευόμεθα
  choice: anyị adịghị alụ agha
  rationale: Ọ na-ebupụta ihe atụ agha nke Pọl ji kọwaa ọgụ dị n’ozi ya n’asụsụ Igbo doro anya.
theological_decisions:
- issue: Nsụgharị σάρξ n’ebe abụọ ọ pụtara
  choice: Jiri “anụ ahụ” n’ebe abụọ ahụ n’ahịrị bụ isi.
  alternative: “anyị bi n’ahụ́ ... anyị adịghị alụ agha site n’ụkpụrụ mmadụ nkịtị”
  rationale: Nke mbụ na-ezo aka ná ndụ mmadụ n’ahụ́, ebe nke abụọ na-ezo aka n’ụzọ ma ọ bụ ụkpụrụ anụ ahụ. Idebe otu okwu ahụ na-echekwa nkwughachi na esemokwu echiche Pọl, kama ịtụgharị ya ka ọ bụrụ “ọdịdị mmehie” ma ọ bụ mechie nghọta ya n’otu ụzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E debere ihe atụ nke “ije ije” na nkwughachi “anụ ahụ,” ebe nkọwa ala peeji na-enye nsụgharị Igbo nke na-akọwa echiche ahụ nke ọma karị.
