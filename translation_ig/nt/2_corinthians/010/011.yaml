id: 2CO.10.11
reference: 2 Corinthians 10:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο λογιζέσθω ὁ τοιοῦτος, ὅτι οἷοί ἐσμεν τῷ λόγῳ δι’ ἐπιστολῶν ἀπόντες, τοιοῦτοι καὶ παρόντες τῷ ἔργῳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/011.yaml
  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: ig
  text: 'Ka onye dị otú ahụ[a] tụlee nke a: otú anyị dị n''okwu site n''akwụkwọ ozi mgbe anyị na-anọghị, otu ahụkwa ka anyị dị n''omume mgbe anyị nọ.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye dị otu ahụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “otú anyị dị n'ihe anyị na-ekwu site n'akwụkwọ ozi mgbe anyị na-anọghị, otu ahụkwa ka anyị dị n'ihe anyị na-eme mgbe anyị nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζέσθω
  choice: ka ... tụlee
  rationale: Ụdị iwu nke onye nke atọ na-akpọ onye ahụ ka o chebara eziokwu a echiche; “tụlee” bụ okwu Igbo doro anya ma dịkwa ugbu a.
- source_word: ὁ τοιοῦτος
  choice: onye dị otú ahụ
  rationale: Nke a na-ezo aka n'otu onye nwere ụdị omume ahụ Pọl ka kwuru banyere ya, na-enweghị ịkọwa onye ahụ karịa ka Grik mere.
- source_word: οἷοί ἐσμεν
  choice: otú anyị dị
  rationale: Nke a na-egosi ụdị ma ọ bụ àgwà ndị na-ekwu okwu, ma na-edobe njikọ ya na τοιοῦτοι nke na-esote.
- source_word: τῷ λόγῳ
  choice: n'okwu
  rationale: Dative a na-egosi akụkụ e ji atụle ha; “n'okwu” na-edobe ntụnyere dị mkpirikpi ya na “n'omume.”
- source_word: δι’ ἐπιστολῶν
  choice: site n'akwụkwọ ozi
  rationale: διά na genitive na-egosi ụzọ ma ọ bụ ihe e ji eme ihe; akwụkwọ ozi bụ ụzọ okwu ha si ruo ndị na-agụ ya.
- source_word: ἀπόντες
  choice: mgbe anyị na-anọghị
  rationale: A sụgharịrị participle ahụ dị ka ọnọdụ oge, ma debe ya megide “mgbe anyị nọ” nke na-esote.
- source_word: τοιοῦτοι καὶ
  choice: otu ahụkwa ka anyị dị
  rationale: Nke a na-emeghachi ntụnyere banyere ụdị ha bụ, ma mee ka njikọ ahịrịokwu ahụ bụrụ Igbo ebumpụta ụwa.
- source_word: παρόντες
  choice: mgbe anyị nọ n'etiti unu
  rationale: Nke a na-egosi ịnọ ha na ndị a na-edegara akwụkwọ ozi ahụ; “n'etiti unu” na-eme ka echiche ọnụnọ pụta ìhè n'Igbo.
- source_word: τῷ ἔργῳ
  choice: n'omume
  rationale: “Omume” na-egosi ihe a na-eme n'ezie ma na-edobe ọdịiche okwu na omume nke Grik.
theological_decisions:
- issue: Okwu Pọl na-atụnyere ike okwu dị n'akwụkwọ ozi ya na omume ya mgbe ọ nọ n'etiti ha.
  choice: E debere ya dị ka nkwupụta na otú ha dị n'okwu mgbe ha na-anọghị bụ otu otú ahụ ha dị n'omume mgbe ha nọ ya.
  alternative: Ịsụgharị ya naanị dị ka iyi egwu banyere ihe Pọl ga-eme n'ọdịnihu.
  rationale: Grik na-eme ntụnyere kpọmkwem n'etiti λόγος na ἔργον, nakwa n'etiti ịnọghị na ịnọ; nsụgharị ahụ ekwesịghị ime ka ọ bụrụ ozizi ọzọ ma ọ bụ dozie ike ịdọ aka ná ntị dị na ya n'ụzọ gabigara ihe ederede kwuru.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ntụnyere nke Grik—okwu/omume na ịnọghị/ịnọ—ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa otu okpukpe.
