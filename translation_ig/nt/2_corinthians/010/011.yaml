review_pass:
  verdict: revise
  source_fidelity: The translation accurately preserves the imperative, the singular reference to the critic, and the paired contrasts of word/deed and absence/presence. However, “n’etiti unu” (“among you”) adds a recipient-oriented location that is not stated in the Greek. The participle παρόντες means “being present,” without an explicit “among you.”
  naturalness: The wording is clear, idiomatic Standard Igbo, and maintains the concise rhetorical parallelism. “Mgbe anyị nọ” is a natural contextual expression of being present and avoids adding a location to the source.
  terminology: “n’okwu” and “n’omume” appropriately retain λόγῳ / ἔργῳ and their deliberate contrast. “site n’akwụkwọ ozi” is an acceptable natural rendering of δι’ ἐπιστολῶν.
  issues:
  - severity: medium
    issue: The phrase “n’etiti unu” has been added to the rendering of παρόντες.
    rationale: The Greek says only “when present” and does not explicitly say “among you.” Although the setting makes the inference understandable, the added phrase narrows and expands the source wording unnecessarily.
  - severity: low
    issue: Footnote b reproduces the same added phrase, “mgbe anyị nọ n’etiti unu.”
    rationale: Its alternative wording should likewise preserve the source’s unqualified contrast of absence and presence.
  revised_text: 'Ka onye dị otú ahụ[a] tụlee nke a: otú anyị dị n''okwu site n''akwụkwọ ozi mgbe anyị na-anọghị, otu ahụkwa ka anyị dị n''omume mgbe anyị nọ.[b]'
