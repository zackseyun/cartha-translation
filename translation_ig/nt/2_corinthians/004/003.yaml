  text: εἰ δὲ καὶ ἔστιν κεκαλυμμένον τὸ εὐαγγέλιον ἡμῶν, ἐν τοῖς ἀπολλυμένοις ἐστὶν κεκαλυμμένον,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/003.yaml
  text: And even if our gospel is veiled[a], it is veiled among those who are perishing,
translation:
  language: ig
  text: Ma ọ bụrụgodị na e ji ákwà mkpuchi kpuchie oziọma anyị, ọ bụ n’etiti ndị na-ala n’iyi ka e kpuchiri ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọ bụ nye ndị na-ala n’iyi ka e kpuchiri ya,” ma ọ bụ, “ọ bụ n’etiti ndị furu efu ka e kpuchiri ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: Ma ọ bụrụgodị na
  rationale: Nke a na-egosipụta ọnọdụ nwere nkwenye ma na-edobekwa ntakịrị ntụgharị ma ọ bụ ọdịiche nke δέ na ike nkwusi nke καί.
- source_word: κεκαλυμμένον
  choice: e ji ihe mkpuchi kpuchie
  rationale: Nkebiokwu a na-echekwa ihe atụ nke mkpuchi ihu dị n'akụkụ amaokwu a (3:14–16; 4:4), karịa ịsị naanị na e zoro ya.
- source_word: τὸ εὐαγγέλιον ἡμῶν
  choice: oziọma anyị
  rationale: Ọ na-edobe nnọchiaha nwe ἡμῶν ma jiri okwu Igbo a maara nke ọma maka εὐαγγέλιον.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: n’etiti ndị na-ala n’iyi
  rationale: “N’etiti” na-egosipụta mpaghara ma ọ bụ ndị ihe ahụ metụtara; “ndị na-ala n’iyi” na-echekwa ọdịdị participle nke na-egosi ọnọdụ ma ọ bụ usoro na-aga n’ihu.
- source_word: ἐστὶν κεκαλυμμένον
  choice: ka e kpuchiri ya
  rationale: A na-ekwughachi echiche nke mkpuchi dịka Grik si mee ya maka nkwusi, ebe “ya” na-ezo aka n’oziọma ahụ.
theological_decisions:
- issue: Ọdịdị ἀπολλυμένοις n’echiche nzọpụta Pọl
  choice: ndị na-ala n’iyi
  alternative: ndị furu efu
  rationale: Nhọrọ a na-egosi ọnọdụ ma ọ bụ usoro na-aga n’ihu, na-enweghị ime ka okwu ahụ bụrụ naanị aha ọnọdụ kwụsiri ike; ya mere ọ na-echekwa esemokwu echiche dị n’okwu Pọl.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. E ji “ihe mkpuchi” chekwaa ihe atụ nke veil, ma zere nkọwa okpukpe nke gafere ihe ederede kwuru.
