id: 2CO.4.4
reference: 2 Corinthians 4:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ ⸀αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, ὅς ἐστιν εἰκὼν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: ig
  text: N’ihe banyere ha, chi nke oge a[b] emeela ka uche ndị na-ekweghị ekwe kpuo ìsì, ka ìhè nke oziọma nke ebube Mesaya[c], onye bụ onyinyo Chineke, ghara ịmụkwasị ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ha ghara ịhụ ìhè nke oziọma nke ebube Mesaya.” Ngwaa Grik a na-adịghị ahụkarị nwere ike imesi ike ma n’ìhè ahụ ịmụ, ma n’ịhụ ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “chi nke ụwa a.” Okwu Grik aiōn na-apụtakarị “oge,” na-elekwasị anya n’oge ọjọọ dị ugbu a.
    reason: lexical_alternative
  - marker: c
    text: Grik bụ Christos; a sụgharịrị ya “Mesaya” ebe a n’ihi na ọ na-arụ ọrụ dịka aha ọkwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: N’ebe ha nọ
  rationale: Ọ na-ezo aka n’ọnọdụ ndị na-ala n’iyi na ndị na-ekweghị ekwe a kpọrọ aha n’okwu bu ụzọ; nkebi a na-egosi ‘n’ihe banyere ha’ n’ụzọ Igbo dị mfe, n’etinyeghị echiche nke ibi n’ime ha.
- source_word: ὁ θεὸς τοῦ αἰῶνος τούτου
  choice: chi nke oge a
  rationale: ‘Oge a’ na-egosi oge ọjọọ dị ugbu a, ọ bụghị ụwa e kere eke. E ji ‘chi’ mee ka ọ pụta ìhè na okwu ahụ anaghị ekwu banyere ezi Chineke.
- source_word: ἐτύφλωσεν τὰ νοήματα
  choice: emeela ka uche ... kpuo ìsì
  rationale: Nke a na-edobe ihe atụ nke ikpu ìsì ma na-egosi na ihe e mere gara aga ka nwere nsonaazụ ugbu a; ‘uche’ bụ ikike nghọta, ọ bụghị naanị echiche dị iche iche.
- source_word: τῶν ἀπίστων
  choice: ndị na-ekweghị ekwe
  rationale: Ọ na-akọwa ndị na-adịghị ekwere, n’etinyeghị nkọwa omume siri ike karịa ihe Grik kwuru.
- source_word: εἰς τὸ μὴ αὐγάσαι
  choice: ka ... ghara ịmụkwasị ha
  rationale: Ọ na-egosi nzube ma ọ bụ nsonaazụ, ma na-ewere ìhè dị ka ihe na-amụkwasị ha. N’ihi na ngwaa Grik a adịghị ahụkarị ma nwee ike ịpụta ịhụ ìhè, e debere ụzọ ọzọ na ndetu ala peeji.
- source_word: τὸν φωτισμὸν τοῦ εὐαγγελίου
  choice: ìhè nke oziọma
  rationale: ‘Ìhè’ bụ okwu doro anya ma dị ndụ n’Igbo maka ihe atụ nke φωτισμός; ‘oziọma’ na-edobe echiche nke ozi ọma ahụ n’ụzọ a maara nke ọma.
- source_word: τῆς δόξης τοῦ Χριστοῦ
  choice: nke ebube Mesaya
  rationale: A hapụrụ usoro njikọ aha ahụ ka ọ bụrụ ‘oziọma nke ebube Mesaya,’ kama ịgbanwe ya naanị ka ọ bụrụ ‘oziọma dị ebube.’ A sụgharịrị Χριστός dị ka aha ọkwa, ‘Mesaya.’
- source_word: ὅς ἐστιν εἰκὼν τοῦ θεοῦ
  choice: onye bụ onyinyo Chineke
  rationale: Nke a na-edobe nkwupụta Kraịst gbasara mmekọrịta pụrụ iche Mesaya na Chineke n’enweghị mgbakwunye nkọwa ozizi.
theological_decisions:
- issue: Onye ‘chi nke oge a’ na-ezo aka na ya
  choice: E debere okwu ahụ dịka ‘chi nke oge a,’ nke na-egosi ike ọjọọ nke na-achị oge a, a na-aghọtakarị ya dịka Setan.
  alternative: Ịsụgharị ya ozugbo dịka ‘Setan,’ ma ọ bụ were ya dịka usoro ụwa na-enweghị onye bụ isi.
  rationale: Aha ‘Setan’ adịghị n’amaokwu Grik, ya mere e tinyeghị ya; mana ‘chi’ na-edobe ọdịdị nke onye ma ọ bụ ike na-achị, kama ime ya naanị usoro na-enweghị onye.
- issue: Ọrụ αὐγάσαι na φωτισμός
  choice: Ìhè oziọma bụ ihe na-agaghị amụkwasị ndị na-ekweghị ekwe.
  alternative: Ndị na-ekweghị ekwe agaghị ahụ ìhè oziọma.
  rationale: Ngwaa ahụ dị ụkọ, usoro okwu ya nwekwara ike ịkwado echiche abụọ ahụ. Isiokwu họọrọ echiche nke ìhè na-amụkwasị ha, ebe ndetu [a] na-echekwa nke ọzọ.
- issue: Ike okwu ‘onyinyo Chineke’ gbasara Mesaya
  choice: E debere nkwupụta ahụ kpọmkwem dịka ‘onye bụ onyinyo Chineke.’
  alternative: Ịgbakwunye okwu nkọwa gbasara ọdịdị ma ọ bụ ịbụ otu ihe na Chineke.
  rationale: Amaokwu ahụ nwere nnukwu mkpa n’okwu banyere Mesaya, ma nsụgharị ekwesịghị itinye okwu ozizi ndị na-adịghị na isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Chi’ dị obere na-ekewapụ onye a na Chineke, ebe ‘oge a’ na-ezere ime ka αἰών bụrụ ụwa e kere eke. A hapụrụ usoro njikọ ‘oziọma nke ebube Mesaya’ ka ọ chekwaa njupụta na obere mgbagwoju anya dị n’asụsụ Grik.
