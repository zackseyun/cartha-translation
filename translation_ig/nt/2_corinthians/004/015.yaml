    text: A pụkwara ịsụgharị ya, “site n’aka ọtụtụ ndị mmadụ” ma ọ bụ “site n’aka ọnụ ọgụgụ ka ukwuu.” Okwu Grik ahụ nwere ike izo aka n’ọtụtụ mmadụ n’ozuzu, ma ọ bụ n’ọnụ ọgụgụ mmadụ na-arịwanye elu.
    reason: lexical_alternative
  revision_rationale: The revision restores the source’s expression that grace has increased ‘through the many,’ without deciding whether ‘the many’ means many people generally or a growing number. It also renders the abundance expressed by περισσεύσῃ more fully, while preserving the purpose/result movement toward God’s glory.
