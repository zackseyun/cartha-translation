id: 2CO.4.15
reference: 2 Corinthians 4:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὰ γὰρ πάντα δι’ ὑμᾶς, ἵνα ἡ χάρις πλεονάσασα διὰ τῶν πλειόνων τὴν εὐχαριστίαν περισσεύσῃ εἰς τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: ig
  text: N’ihi na ihe niile bụ maka unu, ka amara ahụ, ebe ọ bawanyere site n’aka ọtụtụ mmadụ[a], mee ka ekele baa ụba ruo n’otuto Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site n’aka ọtụtụ ndị mmadụ” ma ọ bụ “site n’aka ọnụ ọgụgụ ka ukwuu.” Okwu Grik ahụ nwere ike izo aka n’ọtụtụ mmadụ n’ozuzu, ma ọ bụ n’ọnụ ọgụgụ mmadụ na-arịwanye elu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πάντα
  choice: ihe niile
  rationale: Ọ bụ okwu sara mbara nke na-echekwa echiche nke ‘ihe niile’ n’enweghị ime ka ihe Pọl kwuru dị warara.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na ahịrịokwu a na-enye ihe ndabere ma ọ bụ nkọwa maka okwu bu ya ụzọ.
- source_word: δι’ ὑμᾶς
  choice: maka ọdịmma unu
  rationale: διά ya na accusative ebe a na-egosi uru a na-emere ndị a na-agwa okwu; ‘maka ọdịmma unu’ doro anya karịa naanị ‘maka unu.’
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ bụ ụzọ Igbo dị mfe ma bụrụ nke okike isi gosipụta ebumnuche ma ọ bụ ihe si na ya pụta.
- source_word: ἡ χάρις
  choice: amara ahụ
  rationale: ‘Amara’ na-echekwa echiche nke χάρις dị ka ihu ọma na ọrụ ọma Chineke; ‘ahụ’ na-egosipụta article ahụ n’ụzọ dabara n’okwu a.
- source_word: πλεονάσασα
  choice: ka ọ na-erute ọtụtụ ndị ọzọ
  rationale: Participle ahụ na-egosi mmụba nke amara; n’Igbo, ikwu na amara ‘na-erute’ ọtụtụ ndị na-eme ka njikọ ya na ndị na-amụba doo anya n’enweghị ịkọwa usoro nkà mmụta okpukpe kpọmkwem.
- source_word: διὰ τῶν πλειόνων
  choice: ọtụtụ ndị ọzọ
  rationale: Okwu Grik a nwere ike ịpụta ọtụtụ ndị n’ozuzu ma ọ bụ ọnụ ọgụgụ na-arịwanye elu; isi ederede na-egosi echiche nke mmụba, ebe ndetu ala na-echekwa ụzọ ndị ọzọ.
- source_word: τὴν εὐχαριστίαν
  choice: ekele
  rationale: ‘Ekele’ bụ okwu Igbo nkịtị na nke kwesịrị nsọpụrụ maka inye Chineke ekele.
- source_word: περισσεύσῃ
  choice: mee ka ekele na-abawanye
  rationale: ‘Na-abawanye’ na-egosipụta ụbara nke ngwaa ahụ n’Igbo dị nfe, ma kwe ka amara na-ebute ụbara ekele.
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: ruo n’otuto Chineke
  rationale: ‘Ruo’ na-echekwa ntụziaka nke εἰς dị ka ebumnuche ma ọ bụ ihe ikpeazụ, ya bụ otuto Chineke.
theological_decisions:
- issue: Ihe ‘amara’ na-ezo aka na ya na otú o si arụ ọrụ
  choice: E debere ‘amara’ dị ka ihu ọma Chineke nke na-arụ ọrụ ma na-erute ọtụtụ ndị, n’enweghị ịkọwa usoro ya karịa ihe amaokwu ahụ kwuru.
  alternative: Ịkọwa ya kpọmkwem dị ka amara nzọpụta a na-ekesa nye ndị ọhụrụ, ma ọ bụ naanị dị ka ihu ọma nke na-amụba ekele.
  rationale: χάρις nwere obosara nke nwere ike ịgụnye onyinye nzọpụta na ọrụ amara Chineke n’ozi Pọl; amaokwu a anaghị amanye ka a họrọ naanị otu n’ime ha.
- issue: Mmekọrịta dị n’etiti mmụba amara, ọtụtụ ndị, na ụbara ekele
  choice: A sụgharịrị ya ka amara na-erute ọtụtụ ndị ọzọ ma si otú ahụ mee ka ekele bawanye.
  alternative: ‘Ka amara, ebe ọ bawanyere site n’aka ọtụtụ ndị, mee ka ekele jubiga ókè.’
  rationale: Usoro Grik nwere ike ịdị mgbagwoju anya banyere kpọmkwem otú διὰ τῶν πλειόνων si metụta participle na isi ngwaa. Nhọrọ ahụ na-enye Igbo doro anya ma na-echekwa isi echiche nke mgbasa amara na ụbara ekele.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. ‘Maka ọdịmma unu’ na-eme ka echiche nke uru pụta ìhè; ‘ruo n’otuto Chineke’ na-echekwa ntụziaka na ebumnuche nke nkebi ikpeazụ. E tinyere akara ndetu [a] ozugbo n’ebe okwu nwere nghọta ọzọ dị.
