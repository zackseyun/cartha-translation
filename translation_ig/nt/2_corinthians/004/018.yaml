id: 2CO.4.18
reference: 2 Corinthians 4:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ τὰ μὴ βλεπόμενα, τὰ γὰρ βλεπόμενα πρόσκαιρα, τὰ δὲ μὴ βλεπόμενα αἰώνια.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/018.yaml
  text: as we look not to the things that are seen but to the things that are not seen. For the things that are seen are temporary[a], but the things that are not seen are eternal.
translation:
  language: ig
  text: mgbe anyị na-adịghị elekwasị anya n’ihe ndị a na-ahụ anya, kama n’ihe ndị a na-adịghị ahụ anya. N’ihi na ihe ndị a na-ahụ anya na-adịru nwa oge,[a] ma ihe ndị a na-adịghị ahụ anya na-adịru mgbe ebighị ebi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “ihe a na-ahụ anya ... ihe a na-adịghị ahụ anya”; ma ọ bụ: “ihe ndị a pụrụ ịhụ ... ihe ndị a na-apụghị ịhụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοπούντων
  choice: na-elekwasị anya
  rationale: Okwu a pụtara iduzi anya ma ọ bụ uche n’ebe ihe dị. “Na-elekwasị anya” na-edobe echiche nke ile ihe anya, ma na-egosikwa itinye uche n’ihe ahụ.
- source_word: μὴ
  choice: na-adịghị
  rationale: Ọ bụ ngọnarị dị mfe; nsụgharị a anaghị etinye echiche oge dịka “anyị anaghịzi” nke na-adịghị na Grik.
- source_word: τὰ βλεπόμενα
  choice: ihe ndị a na-ahụ anya
  rationale: Ọ na-edobe ọdịdị okwu a dịka ihe ndị mmadụ pụrụ ịhụ ma na-eme ka ntụnyere ya na ihe ndị a na-adịghị ahụ anya doo anya.
- source_word: ἀλλὰ
  choice: kama
  rationale: “Kama” na-egosi ntụgharị siri ike site n’otu ihe a na-elekwasị anya gaa n’ihe ọzọ.
- source_word: τὰ μὴ βλεπόμενα
  choice: ihe ndị a na-adịghị ahụ anya
  rationale: Nsụgharị a na-edobe usoro ya na τὰ βλεπόμενα ma ghara ịkọwa ihe ndị ahụ dịka “nke mmụọ,” nke Grik ekwughị kpọmkwem.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe kpatara okwu bu ya ụzọ ma na-eme ka njikọ arụmụka Pọl pụta ìhè.
- source_word: πρόσκαιρα
  choice: na-adịru nwa oge
  rationale: Ọ na-egosi na ihe ahụ nwere naanị oge dị mkpirikpi ma ọ bụ a kpaara ókè, n’enweghị ime ka ọ bụrụ naanị otu ntabi anya.
- source_word: δέ
  choice: ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ihe na-adịru nwa oge na ihe na-adịru mgbe ebighị ebi.
- source_word: αἰώνια
  choice: na-adịru mgbe ebighị ebi
  rationale: N’ọdịiche ya na πρόσκαιρα, ọ na-egosi ihe na-adịghị agwụ agwụ, bụkwa okwu Igbo doro anya ma kwụsie ike.
- source_word: ἡμῶν
  choice: anyị
  rationale: Ọ bụ ezie na ọdịdị ya na Grik bụ genitive, ọ bụ onye na-eme omume participle ahụ; “anyị” na-eme ka ahịrịokwu Igbo bụrụ nke e kere eke.
theological_decisions:
- issue: Otu e si asụgharị ọdịiche dị n’etiti ihe a na-ahụ anya na ihe a na-adịghị ahụ anya
  choice: E debere okwu ndị doro anya, “ihe ndị a na-ahụ anya” na “ihe ndị a na-adịghị ahụ anya.”
  alternative: “Ihe anụ ahụ” na “ihe ime mmụọ,” ma ọ bụ naanị “ihe a na-ahụ” na “ihe a na-adịghị ahụ.”
  rationale: Pọl na-atụnyere ihe a na-ahụ anya na ihe a na-adịghị ahụ anya, ma ọ kọwaghị ha kpọmkwem dịka ihe anụ ahụ na ihe ime mmụọ. Nsụgharị a anaghị ebubata nkọwa nkà ihe ọmụma ma ọ bụ ozizi na-adịghị n’ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ebe anyị na-” na-egosi na participle ahụ dabere n’okwu bu amaokwu a ụzọ; e deberekwa nhazi na ntụnyere okwu Grik n’enweghị ime ka Igbo sie ike.
