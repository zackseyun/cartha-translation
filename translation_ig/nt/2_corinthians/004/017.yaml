revisions:
- from: N’ihi na nhụjuanya anyị nke na-adị naanị nwa oge, nke dị fechaa, na-arụpụtara anyị ibu ebube ebighị ebi nke karịrị ihe niile a pụrụ iji tụnyere ya.[a]
  to: N’ihi na nhụjuanya anyị nke na-adị naanị nwa oge, nke dị fechaa, na-arụpụtara anyị ibu ebube ebighị ebi nke karịrị akarị.[a]
  rationale: The revision retains every major lexical and rhetorical element in the draft but renders the Greek intensifier more faithfully and naturally. It also revises the note so that it explains the difficult idiom rather than giving an obscure pseudo-literal expression. No doctrinal conclusion beyond the verse’s stated contrast and result relation is added.
