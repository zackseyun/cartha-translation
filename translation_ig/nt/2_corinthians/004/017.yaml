language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ γὰρ παραυτίκα ἐλαφρὸν τῆς θλίψεως ⸀ἡμῶν καθ’ ὑπερβολὴν εἰς ὑπερβολὴν αἰώνιον βάρος δόξης κατεργάζεται ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/017.yaml
  text: For our momentary light affliction is producing for us an eternal weight of glory beyond all comparison,[a]
translation:
  language: ig
  text: N’ihi na nhụjuanya anyị nke na-adị naanị nwa oge, nke dị fechaa, na-arụpụtara anyị ibu ebube ebighị ebi nke karịrị akarị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’oke karịrị akarị.” N’asụsụ Grik, okwu ahụ kpọmkwem bụ, “dị ka oke ruo n’oke,” bụ akpaalaokwu na-egosi oke pụrụ iche.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραυτίκα
  choice: nke na-adị naanị nwa oge
  rationale: Nke a na-egosi ihe na-adịru nanị oge dị mkpirikpi ma na-eme ka ọdịiche ya na αἰώνιον, ‘ebighị ebi,’ pụta ìhè n’Igbo nkịtị.
- source_word: ἐλαφρὸν
  choice: nke dị fechaa
  rationale: ‘Dị fechaa’ na-echekwa ihe atụ nke ịdị mfe n’ibu ma na-emegide ‘ibu’ (βάρος) dị n’otu ahịrịokwu ahụ.
- source_word: θλίψεως
  choice: nhụjuanya
  rationale: ‘Nhụjuanya’ gụnyere nrụgide, nsogbu, na ahụhụ n’enweghị ime ka okwu ahụ bụrụ naanị mkpagbu n’ihi okwukwe ma ọ bụ ahụhụ nke oge ikpeazụ.
- source_word: ἡμῶν
  choice: anyị
  rationale: Ọ na-egosi na nhụjuanya ahụ bụ nke Pọl na ndị ya na ha na-eje ozi; ntụgharị ahụ anaghị agbasa onye okwu ahụ na-ezo aka na ya karịa ihe ederede kwuru.
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολὴν
  choice: nke karịrị ihe niile a pụrụ iji tụnyere ya
  rationale: Nke a na-ebufe ike nke nkwughachi okwu Grik ahụ n’Igbo doro anya ma dị ebube. Ihe a sụgharịrị kpọmkwem karị dị n’ala peeji.
- source_word: αἰώνιον
  choice: ebighị ebi
  rationale: Ọ bụ okwu Igbo kwesịrị ekwesị maka ihe na-adịgide adịgide, ma na-echekwa ọdịiche dị n’etiti nhụjuanya nwa oge na ebube ebighị ebi.
- source_word: βάρος
  choice: ibu
  rationale: ‘Ibu’ na-echekwa ihe atụ Pọl ji mee ka ‘nke dị fechaa’ na ihe dị arọ megide onwe ha; ọ naghị eme ka ebube ahụ yie ibu na-emegbu mmadụ.
- source_word: δόξης
  choice: ebube
  rationale: ‘Ibu ebube’ na-edobe njikọ aha okwu Grik βάρος δόξης ma na-echekwa ụda na omimi nke akpaokwu ahụ.
- source_word: κατεργάζεται
  choice: na-arụpụtara
  rationale: Ọ na-egosi ọrụ na-aga n’ihu nke na-eweta nsonaazụ n’ezie, n’enweghị ịkọwa na nhụjuanya ji uru mmadụ nweta nzọpụta.
- source_word: ἡμῖν
  choice: anyị
  rationale: N’ime ‘na-arụpụtara anyị,’ nnọchiaha ahụ na-egosi na nsonaazụ ahụ bụ maka uru anyị, kama ịsị na ihe ahụ na-eme naanị n’ime anyị.
- source_word: τὸ ... ἐλαφρὸν τῆς θλίψεως ἡμῶν
  choice: nhụjuanya anyị nke na-adị naanị nwa oge, nke dị fechaa
  rationale: 'Nhazi a bụ Igbo e ji eme ihe nke ọma ma na-edobe echiche atọ ahụ: na nhụjuanya ahụ bụ nke anyị, na ọ bụ nwa oge, nakwa na ọ dị fechaa ma e jiri ya tụnyere ibu ebube.'
theological_decisions:
- issue: Ụdị ebube nhụjuanya ahụ na-arụpụta
  choice: Ahịrịokwu ahụ na-egosi na nhụjuanya nke ugbu a na-ewetara ndị kwere ekwe ebube ebighị ebi, ma ọ naghị ekwu na mmadụ ji ahụhụ ya nweta nzọpụta dịka ụgwọ ọrụ.
  alternative: A pụrụ ịghọta ya dị ka nhụjuanya na-eme ka mmadụ rite ebube site n’uru aka ya, ma ọ bụ dị ka naanị ntozu ime mmụọ nke ugbu a.
  rationale: Ọdịiche dị n’etiti ‘nwa oge’ na ‘ebighị ebi’ na-atụ aka na nsonaazụ ga-adịgide. ‘Na-arụpụtara anyị’ na-edobe ike nke ngwaa Grik ahụ ma ghara idozi esemokwu nkà mmụta okpukpe ahụ site n’itinye echiche nke uru mmadụ ma ọ bụ ime ka ihe ahụ bụrụ naanị mgbanwe nke ime mmụọ ugbu a.
translation_notes:
  register: E ji Standard Igbo nke oge a, doro anya ma dị ebube mee ihe. A họọrọ ‘nhụjuanya’ ka okwu ahụ ghara ịpụta naanị mkpagbu okpukpe. E debere ihe atụ ‘dị fechaa/ibu’ iji chekwaa ntụnyere Pọl. Akara ala peeji [a] dị n’ederede isi.
