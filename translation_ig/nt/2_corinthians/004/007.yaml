    text: Ma ọ bụ, “n’ime arịa e ji ụrọ kpụọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ike karịrị nke nkịtị” ma ọ bụ “ike pụrụ iche.”
    reason: lexical_alternative
  revision_rationale: The revision replaces an ambiguous expression for the surpassing quality of the power with “karịrị nke nkịtị,” which clearly conveys the exceptional degree denoted by ὑπερβολή. It also replaces the interpretive second note with genuine lexical alternatives and places its anchor directly after the relevant phrase. The metaphor and the source-text ambiguity concerning “of God” versus “not from us” remain intact.
