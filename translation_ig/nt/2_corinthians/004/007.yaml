id: 2CO.4.7
reference: 2 Corinthians 4:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔχομεν δὲ τὸν θησαυρὸν τοῦτον ἐν ὀστρακίνοις σκεύεσιν, ἵνα ἡ ὑπερβολὴ τῆς δυνάμεως ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: ig
  text: Ma anyị nwere akụ a n’ime ite ụrọ[a], ka ịdị ukwuu nke ike ahụ karịrị nke nkịtị[b] wee bụrụ nke Chineke, ọ bụghịkwa nke sitere n’aka anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime arịa e ji ụrọ kpụọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ike karịrị nke nkịtị” ma ọ bụ “ike pụrụ iche.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχομεν δὲ
  choice: Ma anyị nwere
  rationale: “Ma” na-egosipụta ntụgharị nwere ọdịiche n’ihe bu ụzọ, ebe “anyị nwere” na-enye okwu ugbu a nke inwe ihe n’ụzọ doro anya.
- source_word: τὸν θησαυρὸν τοῦτον
  choice: akụ a
  rationale: “Akụ” bụ okwu Igbo dị mfe ma dị ùgwù maka ihe bara ezigbo uru; “a” na-atụ aka n’ihe Pọl kwuru banyere ya n’okwu ndị bu ụzọ.
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: n’ime ite ụrọ
  rationale: Nkebi a na-egosi arịa e ji ụrọ kpụọ. “Ite ụrọ” bụ ihe oyiyi doro onye Igbo nke oge a anya ma na-echekwa echiche nke arịa dị umeala na nke na-emebi ngwa ngwa.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro “ka ... wee” na Igbo na-egosipụta ebumnuche ma nwee ike iburu ndò nke ihe si na ya pụta, dịka ἵνα si arụ ọrụ ebe a.
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: ịdị ukwuu pụrụ iche nke ike ahụ
  rationale: Nhọrọ a na-echekwa nhazi aha nke Grik ma na-egosi na ịdị ukwuu nke ike ahụ karịrị nke nkịtị, n’enweghị ime ka okwu ahụ bụrụ naanị “ike dị ukwuu.”
- source_word: ᾖ τοῦ θεοῦ
  choice: bụrụ nke Chineke
  rationale: Nke a na-echekwa okwu genitive dị n’akwụkwọ Grik, n’agbanyeghị na ọ nwekwara ike ịpụta isi mmalite; a kọwara ụzọ ọzọ na ndetu.
- source_word: καὶ μὴ ἐξ ἡμῶν
  choice: ọ bụghịkwa nke si n’aka anyị
  rationale: “Si n’aka anyị” na-egosipụta isi mmalite ma na-echekwa ọdịiche dị n’etiti Chineke na anyị.
theological_decisions:
- issue: Ihe “akụ” na “ite ụrọ” nọchiri anya ya
  choice: A hapụrụ ihe oyiyi ahụ dịka ọ dị, n’akọwaghị “akụ” dịka ozi ọma ma ọ bụ “ite” dịka ahụ mmadụ n’ahịrịokwu bụ isi.
  alternative: Ịsụgharị ya dịka “akụ nke ozi ọma a” ma ọ bụ “n’ime ahụ anyị na-adịghị ike.”
  rationale: Ọnọdụ okwu gbara amaokwu ahụ gburugburu na-enyere aka ịghọta ihe oyiyi ahụ, ma amaokwu Grik n’onwe ya akọwaghị ya kpọmkwem. Ịgbasa ya ga-eme ka nkọwa onye ntụgharị banye n’ihe odide ahụ.
- issue: Ike nke nkebi ἵνα
  choice: “ka ... wee” na-echekwa echiche ebumnuche ma ghara iwepụ ohere nke ihe si na ya pụta.
  alternative: 'Ịsụgharị naanị dịka nsonaazụ: “nke mere na ...”'
  rationale: ἵνα nwere ike ịgụnye ndò nke nsonaazụ n’okwu Pọl, ma ebe a ọ ka dị mma idobe echiche ebumnuche/nsonaazụ n’enweghị ikpebi otu naanị.
- issue: Mmekọrịta dị n’etiti τοῦ θεοῦ na ἐξ ἡμῶν
  choice: “nke Chineke” na “nke si n’aka anyị” na-echekwa ntakịrị ọdịiche dị n’usoro Grik.
  alternative: “si n’aka Chineke, ọ bụghịkwa n’aka anyị.”
  rationale: τοῦ θεοῦ bụ genitive, ebe ἐξ ἡμῶν na-egosi isi mmalite kpọmkwem. Isi ederede na-echekwa esemokwu ahụ; ndetu na-egosi ntụgharị sitere-n’aka.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe ma dị ùgwù. E ji “ite ụrọ” mee ka ihe oyiyi ahụ bụrụ nke a na-aghọta ngwa ngwa; e zere ịkọwa ihe oyiyi ahụ n’ụzọ ụka ma ọ bụ ozizi pụrụ iche. Akara ndetu [a] na [b] pụtara n’ederede bụ isi.
