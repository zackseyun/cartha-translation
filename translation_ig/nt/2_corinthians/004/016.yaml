revisions:
- from: N’ihi ya, anyị anaghị ada mbà. Ma ọ bụrụgodị na mmadụ elu anyị na-emebi emebi[a], mmadụ ime anyị na-adị ọhụrụ kwa ụbọchị.
  to: N’ihi ya, anyị anaghị ada mbà. Ma ọ bụrụgodị na mmadụ anyị nke dị n’èzí na-emebi emebi[a], ma a na-eme ka mmadụ anyị nke dị n’ime dị ọhụrụ kwa ụbọchị.
  rationale: The revision replaces nonidiomatic spatial compounds with natural, parallel Standard Igbo expressions, while retaining “mmadụ” to reflect the Greek wording. It also makes the ongoing passive sense of ‘is being renewed’ explicit, without naming an agent. The concessive and adversative structure, ongoing deterioration, and distributive ‘day by day’ are retained.
