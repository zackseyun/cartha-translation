source:
  edition: SBLGNT
  text: Διὸ οὐκ ⸀ἐγκακοῦμεν, ἀλλ’ εἰ καὶ ὁ ἔξω ἡμῶν ἄνθρωπος διαφθείρεται, ἀλλ’ ὁ ⸂ἔσω ἡμῶν⸃ ἀνακαινοῦται ἡμέρᾳ καὶ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: ig
  text: N’ihi ya, anyị anaghị ada mbà. Ma ọ bụrụgodị na mmadụ anyị nke dị n’èzí na-emebi emebi[a], ma a na-eme ka mmadụ anyị nke dị n’ime dị ọhụrụ kwa ụbọchị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “akụkụ anyị nke dị n’èzí” na “akụkụ anyị nke dị n’ime.” Okwu Grik ji “mmadụ” n’echiche na-anọchi anya mmadụ dum, ma na-eme ọdịiche kpachapụrụ anya n’etiti ndụ mmadụ nke dị n’èzí na nke dị n’ime.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya, ma bụrụkwa okwu Igbo doro anya ma dị nkwanye ùgwù.
- source_word: οὐκ ἐγκακοῦμεν
  choice: anyị anaghị ada mbà
  rationale: Na-enye echiche nke ịghara ịda mba ma ọ bụ ịkwụsị inwe obi ike; ọ bụ ụzọ e si ekwu ya n’Igbo nkịtị.
- source_word: ἀλλ’ εἰ καὶ
  choice: Ma ọ bụrụgodị na
  rationale: 'Na-echekwa ọdịdị nkwenye-na-emegide nke okwu Grik: a nabatara ọnọdụ ahụ, ma a na-etinye ya n’ọdịiche na ihe na-esochi.'
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: mmadụ elu anyị
  rationale: Na-echekwa otu okwu mmadụ na ọdịiche e kpachapụrụ anya mee n’etiti mmadụ elu na mmadụ ime, n’enweghị ịkọwa ya karịa ihe amaokwu ahụ kwuru.
- source_word: διαφθείρεται
  choice: na-emebi emebi
  rationale: Na-egosi usoro mmebi na-aga n’ihu, ọ bụghị mkpochapụ ozugbo.
- source_word: ἀλλ’
  choice: ma
  rationale: Na-egosi ọdịiche siri ike n’etiti mmebi nke mmadụ elu na ime ka mmadụ ime dị ọhụrụ.
- source_word: ὁ ἔσω ἡμῶν
  choice: mmadụ ime anyị
  rationale: Na-echekwa njikọ okwu ya na mmadụ elu ma na-eme ka okwu Pọl pụta ìhè n’Igbo.
- source_word: ἀνακαινοῦται
  choice: na-adị ọhụrụ
  rationale: Na-egosi mmegharị ọhụrụ na-aga n’ihu nke a na-eme n’ahụ onye ahụ; usoro ahịrịokwu Igbo na-ahapụ onye na-eme ya dịka ihe a na-ekwughị kpọmkwem, dịka Grik si mee.
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: kwa ụbọchị
  rationale: Ọ bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche nkesa na ịga n’ihu kwa ụbọchị.
theological_decisions:
- issue: Ọdịiche dị n’etiti ὁ ἔξω ἄνθρωπος na ὁ ἔσω
  choice: “mmadụ elu anyị” na “mmadụ ime anyị”
  alternative: “akụkụ anyị nke dị n’èzí” na “akụkụ anyị nke dị n’ime”
  rationale: Nhọrọ a na-echekwa okwu mmadụ na ọdịiche Pọl mere, ma ọ naghị etinye ozizi zuru ezu banyere nkewa ahụ na mkpụrụ obi nke amaokwu ahụ n’onwe ya na-akọwaghị.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị nkwanye ùgwù. E debere ọdịiche okwu Grik dị n’etiti “mmadụ elu” na “mmadụ ime,” ebe nkọwa ala peeji na-enye ụzọ ọzọ dịkwuo nkịtị.
