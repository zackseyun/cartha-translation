id: 2CO.4.1
reference: 2 Corinthians 4:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὰ τοῦτο, ἔχοντες τὴν διακονίαν ταύτην καθὼς ἠλεήθημεν, οὐκ ⸀ἐγκακοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/001.yaml
  text: Therefore, since we have this ministry, just as we have received mercy, we do not lose heart.
translation:
  language: ig
  text: N’ihi nke a, ebe anyị nwere ọrụ ozi a, dịka e mere anyị ebere, anyị adịghị ada mbà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Na-ejigide njikọ nkwubi okwu ahụ na ihe Pọl kwuru tupu amaokwu a.
- source_word: τὴν διακονίαν ταύτην
  choice: ozi a
  rationale: N’ebe a, διακονία na-ezo aka n’ọrụ ozi Chineke nyere Pọl; “ozi” bụ okwu Igbo doro anya ma dịkwa n’usoro asụsụ ụka na nke ọha.
- source_word: καθὼς ἠλεήθημεν
  choice: dịka e mere anyị ebere
  rationale: Na-egosipụta passive aorist ahụ n’enweghị ịkpọ onye mere ebere aha, dịka Grik si mee, ma na-ejigide njikọ καθὼς.
- source_word: οὐκ ἐγκακοῦμεν
  choice: anyị adịghị ada mbà
  rationale: Na-enye echiche nke ịghara ịda ike ma ọ bụ ịkwụsị n’ọrụ n’Igbo eke.
theological_decisions:
- issue: Onye nyere ozi na onye mere ebere
  choice: 'Ahapụrụ onye mere ihe ahụ n’ezoghị ọnụ: “anyị nwere ozi a” na “e mere anyị ebere.”'
  alternative: Ịgbakwunye “Chineke nyere anyị ozi a” na “Chineke meere anyị ebere.”
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi Chineke, ma amaokwu Grik n’onwe ya anaghị akpọ ya aha; nsụgharị ahụ anaghị etinye okwu na-anọghị na isi mmalite.
- issue: Mmekọrịta καθὼς n’etiti ozi na ebere
  choice: dịka
  alternative: n’ihi na / site n’ebere e mere anyị
  rationale: “Dịka” na-echekwa ọdịdị ntụnyere ma ọ bụ njikọ ahụ nke Grik, kama ikpebi ya naanị dị ka ihe kpatara ya.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. E jiri “anyị adịghị ada mbà” mee ka nkwupụta ahụ bụrụ nke eke ma sie ike, na-enweghị nkọwa ụka pụrụ iche.
