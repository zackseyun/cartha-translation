  verdict: revise
  source_fidelity: The main sense and all explicit participants are retained, including the passive, unnamed bestowal of mercy. However, “ozi a” ordinarily denotes a message/news in Igbo and is too narrow for διακονία here, which denotes the entrusted ministry/service.
  naturalness: The sentence is clear and natural in Standard Igbo. “anyị adịghị ada mbà” is an idiomatic rendering of οὐκ ἐγκακοῦμεν.
  terminology: Replace “ozi a” with “ọrụ ozi a” to distinguish the ministry/service from the content of a message, while retaining familiar church-register wording. “Dịka e mere anyị ebere” appropriately preserves καθὼς and the Greek passive without supplying God as agent.
  issues:
