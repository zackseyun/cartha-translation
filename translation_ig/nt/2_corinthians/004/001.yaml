    issue: “ozi a” is semantically underspecified for τὴν διακονίαν ταύτην.
    rationale: In ordinary Igbo, “ozi” commonly means a message or news. Paul refers here to the ministry/commissioned service discussed in the context, not chiefly to a message.
  revised_text: N’ihi nke a, ebe anyị nwere ọrụ ozi a, dịka e mere anyị ebere, anyị adịghị ada mbà.
