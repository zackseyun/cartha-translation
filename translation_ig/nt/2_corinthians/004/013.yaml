id: 2CO.4.13
reference: 2 Corinthians 4:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: ig
  text: Ma ebe anyị nwere otu mmụọ ahụ nke okwukwe[a], dị ka e dere, “Ekwere m, ya mere m ji kwuo okwu,” anyị kwa na-ekwere; ya mere anyị kwa na-ekwu okwu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “otu Mmụọ ahụ nke okwukwe,” ma ọ bụrụ na a ghọta πνεῦμα dị ka ihe na-ezo aka na Mmụọ Nsọ karịa mmụọ ma ọ bụ ọnọdụ ime obi nke okwukwe.
    reason: alternative_reading
  - marker: b
    text: Pọl hotara Abụ Ọma 116:10 (na Septuagint, Abụ Ọma 115:1), wee jikọta okwukwe na ikwu okwu nke ya na akaebe onye dere abụ ọma ahụ.
    reason: cross_reference
lexical_decisions:
- source_word: Ἔχοντες δὲ
  choice: Ma ebe anyị nwere
  rationale: Nke a na-edobe njikọ participle ahụ na ahịrịokwu bụ isi, ma na-egosikwa obere mgbanwe ma ọ bụ ọdịiche δέ na-eweta n’ihe Pọl na-ekwu.
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: otu mmụọ nke okwukwe ahụ
  rationale: Nsụgharị a na-edobe ụdị okwu Grik ahụ ma ghara ikpebi n’ahịrịokwu bụ isi ma πνεῦμα ọ̀ bụ mmụọ/omume jupụtara n’okwukwe ka ọ̀ bụ Mmụọ Nsọ.
- source_word: κατὰ τὸ γεγραμμένον
  choice: dị ka e dere
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụ nke a na-ejikarị ewebata ihe e hotara n’Akwụkwọ Nsọ.
- source_word: Ἐπίστευσα, διὸ ἐλάλησα
  choice: Ekwere m, n’ihi ya ka m kwuru
  rationale: “Ekwere m” na “kwuru” na-ebute ngwaa abụọ ahụ kpọmkwem; “n’ihi ya ka” na-egosipụta njikọ nsonaazụ nke διό.
- source_word: καὶ ἡμεῖς πιστεύομεν
  choice: anyị onwe anyị kwere kwa
  rationale: '“Anyị onwe anyị” na-egosipụta ike dị na nnọchiaha ἡμεῖς, ebe “kwa” na-edobe echiche nke καί: anyị dịkwa ka onye dere abụ ahụ.'
- source_word: διὸ καὶ λαλοῦμεν
  choice: n’ihi ya, anyị na-ekwukwa okwu
  rationale: Nke a na-edobe njikọ ezi uche nke διό na kwa nke καί, ma jiri ngwaa oge dị ugbu a gosipụta λαλοῦμεν.
theological_decisions:
- issue: Ma πνεῦμα ebe a ọ̀ na-ezo aka na Mmụọ Nsọ ka ọ̀ bụ mmụọ ma ọ bụ ọnọdụ ime obi nke okwukwe
  choice: mmụọ nke okwukwe, na-enweghị mkpụrụedemede ukwu
  alternative: Mmụọ nke okwukwe, ya bụ Mmụọ Nsọ dị ka onye na-enye ma ọ bụ na-akpali okwukwe
  rationale: Ihe a hotara—“Ekwere m, n’ihi ya ka m kwuru”—na-akwado echiche nke otu mmụọ ma ọ bụ ọnọdụ ime obi jupụtara n’okwukwe. Ma Grik anaghị ewepụ ohere na ọ bụ Mmụọ Nsọ; ya mere e debere nhọrọ ahụ na nkọwa ala peeji.
- issue: Nsụgharị nke πιστεύω
  choice: ikwere
  alternative: ịtụkwasị obi; inwe okwukwe
  rationale: “Ikwere” bụ okwu Igbo nkịtị ma kwekọọ n’otu ezinụlọ echiche nke πίστις/πιστεύω, na-enweghị itinye nkọwa ọzọ na-adịghị n’ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ntụnyere dị n’etiti “kwere” na “kwuru/na-ekwu okwu,” tinyere mgbagwoju anya nke πνεῦμα, n’enweghị itinye nkọwa otu ụka pụrụ iche.
