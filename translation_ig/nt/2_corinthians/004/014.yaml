id: 2CO.4.14
reference: 2 Corinthians 4:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: ig
  text: n’ihi na anyị maara na Onye ahụ kpọlitere Jizọs n’ọnwụ ga-akpọlitekwa anyị na Jizọs, ga-ewetakwa anyị na unu n’ihu ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka na-agụ, “Onyenwe anyị Jizọs,” kama “Jizọs.”
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: n’ihi na anyị maara
  rationale: Okwu a bụ participle n’asụsụ Grik, ma n’ebe a ọ na-enye ihe kpatara Pọl na ndị ọrụ ibe ya ji nọgide na-atachi obi. Nsụgharị a na-egosipụta causal force ya n’Igbo dị mfe.
- source_word: ὁ ἐγείρας
  choice: Onye ahụ kpọlitere ... n’ọnwụ
  rationale: Articular aorist participle a na-ezo aka na Chineke. ‘Onye ahụ kpọlitere’ na-edobe ọdịdị okwu ahụ, ebe ‘n’ọnwụ’ na-eme ka echiche mbilite n’ọnwụ doo anya n’Igbo.
- source_word: τὸν Ἰησοῦν
  choice: Jizọs
  rationale: A gbasoro kpọmkwem ọgụgụ SBLGNT, nke nwere ‘Jizọs’ na-enweghị ‘Onyenwe anyị.’ A debere ọgụgụ ọzọ n’okpuru peeji.
- source_word: καὶ ἡμᾶς ... ἐγερεῖ
  choice: ga-akpọlitekwa anyị
  rationale: '‘-kwa’ na-egosipụta additive force nke καί: Onye kpọlitere Jizọs ga-akpọlitekwa ndị kwere ekwe.'
- source_word: σὺν Ἰησοῦ
  choice: na Jizọs
  rationale: σύν na dative na-egosi ịdịkọ ọnụ ma ọ bụ mmekọrịta. ‘Na Jizọs’ bụ ụzọ Igbo si ekwu ‘with Jesus’ n’enweghị itinye echiche instrumental nke ‘site na Jizọs.’
- source_word: παραστήσει
  choice: kpọtakwa ... n’ihu ya
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara iweta ma ọ bụ ime ka mmadụ guzo n’ihu onye ọzọ. Nsụgharị a na-eme ka echiche presentation doo anya ma ghara ịkọwapụta karịa ihe Grik kwuru.
- source_word: σὺν ὑμῖν
  choice: na unu
  rationale: Nke a na-egosipụta na Pọl, ndị ọrụ ibe ya, na ndị Kọrịnt ga-anọkọ ọnụ n’oge Chineke ga-eweta ha n’ihu ya.
theological_decisions:
- issue: Ọgụgụ dị iche mgbe ἐγείρας gasịrị
  choice: E ji ‘Jizọs’ mee isi okwu, dịka SBLGNT si agụ ya.
  alternative: ‘Onyenwe anyị Jizọs’
  rationale: Nke a bụ okwu gbasara ọdịiche akwụkwọ aka, ọ bụghị ọdịiche ozizi. E debere ọgụgụ ogologo ahụ n’okpuru peeji ka ndị na-agụ ya mara ya.
- issue: Ihe ọdịnihu παραστήσει na-egosi
  choice: A sụgharịrị ya dịka Chineke ga-eweta Pọl na ndị Kọrịnt ọnụ n’ihu ya mgbe mbilite n’ọnwụ gasịrị.
  alternative: Mmeri ma ọ bụ nkwado n’ozuzu; iguzo kpọmkwem n’ihu oche ikpe Kraịst
  rationale: Ọnọdụ okwu ahụ na-ekwu maka olileanya mbilite n’ọnwụ na presentation n’ọdịnihu. ‘N’ihu ya’ na-echekwa echiche ahụ n’ebughị ụzọ kpebie kpọmkwem ụdị ọnọdụ ikpe ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke a na-aghọta ngwa ngwa ma ka nwee ugwu kwesịrị Akwụkwọ Nsọ. E jiri ‘kpọlite ... n’ọnwụ’ gosipụta resurrection n'ụzọ doro anya; e zere okwu ụka pụrụ iche na nkọwa karịrị ihe ederede Grik kwuru.
