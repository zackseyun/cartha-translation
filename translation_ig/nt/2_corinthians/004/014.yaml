review_pass:
  verdict: revise
  source_fidelity: The draft correctly follows the SBLGNT reading “Jesus,” retains the causal force of εἰδότες, and renders the two σύν phrases as shared association. However, “kpọtakwa” (“call/bring along”) is less precise for παραστήσει, whose sense here is to present or bring before; “ga-eweta ... n’ihu ya” is clearer and more faithful in Standard Igbo.
  naturalness: The revision is fluent, contemporary Standard Igbo. “N’ihu ya” supplies the implicit divine presence naturally required by the Igbo expression without specifying a tribunal or other setting.
  terminology: “kpọlitere ... n’ọnwụ” appropriately conveys resurrection, and “Jizọs” correctly represents the critical-text reading. The manuscript-variant footnote is accurate and properly anchored.
  issues:
  - severity: medium
    issue: The rendering “kpọtakwa anyị na unu n’ihu ya” is imprecise for παραστήσει.
    rationale: kpọta can suggest calling or fetching, whereas παραστήσει denotes presenting or bringing persons before someone. “Ga-eweta anyị na unu n’ihu ya” better conveys the source sense while maintaining the text’s eschatological breadth.
  revised_text: n’ihi na anyị maara na Onye ahụ kpọlitere Jizọs n’ọnwụ ga-akpọlitekwa anyị na Jizọs, ga-ewetakwa anyị na unu n’ihu ya.[a]
