revisions:
- from: A na-akpagbu anyị n’ụzọ niile[a], ma a naghị egwepịa anyị[b]; anyị na-enwe mgbagwoju anya, ma anyị anaghị efunahụ ụzọ kpamkpam[c].
  to: A na-akpagbu anyị n’ụzọ niile[a], ma a naghị egwepịa anyị[b]; anyị na-enwe mgbagwoju anya, ma anyị anaghị ada mbà[c].
  rationale: The revision preserves Paul’s paired participial contrasts and the escalation from perplexity to an intensified, but denied, state of despair or complete helplessness. “anyị anaghị ada mbà” is idiomatic Standard Igbo and does not impose a doctrinal interpretation; footnote c supplies a closer explanation of the intensified Greek term.
  reviewer_model: gpt-5.6-terra
