  yaml_path: translation/nt/2_corinthians/004/008.yaml
  text: We are afflicted in every way[a], but not crushed; perplexed[c][b], but not driven to despair.
translation:
  language: ig
  text: A na-akpagbu anyị n’ụzọ niile[a], ma a naghị egwepịa anyị[b]; anyị na-enwe mgbagwoju anya, ma anyị anaghị ada mbà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ihe niile.” Nkebiokwu a na-egosi na mkpagbu ahụ ruru n’ụzọ dị iche iche, ọ bụghị na ọ bụ naanị nsogbu gbara ha gburugburu n’ebe niile.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “a naghị akpọchi anyị n’ebe warara.” “A naghị egwepịa anyị” na-egosi ihe okwu ahụ pụtara n’Igbo nkịtị.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “anyị anaghị enwe mgbagwoju anya ruo n’ókè na anyị amaghị ihe anyị ga-eme.” Okwu Grik a na-eme ka okwu bu ya ụzọ, “inwe mgbagwoju anya,” sie ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντί
  choice: n’ụzọ niile
  rationale: Nkebiokwu a na-egosi na mkpagbu ahụ sara mbara n’ụdị ya; ọ pụtaghị nanị na nsogbu gbara ha gburugburu n’ebe niile.
- source_word: θλιβόμενοι
  choice: a na-akpagbu anyị
  rationale: θλίβω na-egosi ịbụ onye a na-etinye ná nrụgide ma ọ bụ n’ahụhụ. “A na-akpagbu anyị” bụ Igbo doro anya nke dabara n’ọnọdụ ahụhụ Pọl na-akọ.
- source_word: στενοχωρούμενοι
  choice: a naghị egwepịa anyị
  rationale: Okwu Grik ahụ na-ese onyinyo ịbụ onye a kpọchiri n’ebe dị warara ma ọ bụ onye nrụgide meriri. “A naghị egwepịa anyị” na-egosi na mkpagbu ahụ emeghị ka ha daa kpamkpam.
- source_word: ἀπορούμενοι
  choice: anyị na-enwe mgbagwoju anya
  rationale: Okwu ahụ pụtara ịbụ onye na-amaghị ihe ọ ga-eme ma ọ bụ ụzọ ọ ga-esi gaa. Nhọrọ a bụ Igbo nkịtị ma doo anya.
- source_word: ἐξαπορούμενοι
  choice: anyị anaghị efunahụ ụzọ kpamkpam
  rationale: 'Nganiihu ἐξ- na-eme ka ἀπορέω sie ike: ọ bụ ịbụ onye na-enweghị ụzọ mgbapụ ma ọ bụ ihe ọ ga-eme kpamkpam. Nsụgharị a na-echekwa njikọ okwu ya na “mgbagwoju anya” n’enweghị itinye nkọwa ozizi banyere okwukwe ma ọ bụ olileanya.'
- source_word: ἀλλ’ οὐ ... ἀλλ’ οὐκ
  choice: ma ... ma ... anaghị
  rationale: Mmegharị “ma ọ bụghị” dị mkpa n’usoro ahịrịokwu Pọl. Ụdị Igbo a na-eme ka ọdịiche abụọ ahụ pụta ìhè n’ụzọ eke.
theological_decisions:
- issue: Ogo mmụba dị n’etiti ἀπορούμενοι na ἐξαπορούμενοι
  choice: “anyị na-enwe mgbagwoju anya, ma anyị anaghị efunahụ ụzọ kpamkpam”
  alternative: “anyị na-enwe mgbagwoju anya, ma anyị adịghị ada n’obi nkoropụ”
  rationale: Nhọrọ e ji mee ihe na-edobe egwuregwu okwu Grik banyere amaghị ụzọ na enweghị ụzọ kpamkpam, ma zere ime ka amaokwu ahụ bụrụ nkwupụta ozizi pụrụ iche banyere enweghị olileanya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro ahịrịokwu abụọ na-emegide ibe ha na ụda mmegharị Pọl; akara nkọwa ụkwụ niile dị n’ederede isi.
