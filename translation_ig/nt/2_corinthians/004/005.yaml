  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your servants for Jesus' sake.
translation:
  language: ig
  text: N’ihi na anyị anaghị ekwusa onwe anyị, kama Mesaya Jizọs dịka Onyenwe; anyị onwe anyị kwa bụ ndị ohu unu[b] n’ihi Jizọs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ma ọ bụ “ndị na-ejere unu ozi.” Okwu Grik δοῦλοι nwere ike ịpụta ndị ohu ma ọ bụ ndị na-eje ozi; “ndị ohu” na-echekwa nrubeisi siri ike nke okwu ahụ n’ọdịiche ya na Jizọs dịka Onyenwe.
    reason: lexical_alternative
  - marker: c
    text: 'Nkebiokwu Grik a na-egosi ihe kpatara ya ma ọ bụ ihe na-akpali ha: ha bụ ndị ohu unu n’ihi Jizọs.'
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσομεν
  choice: anyị na-ekwusa
  rationale: “Ikwusa” na-egosi ime ka ozi pụta ìhè n’ihu ọha, ma ọ naghị egbochi ihe okwu ahụ pụtara nanị n’ime nkwusa ụka.
- source_word: ἑαυτοὺς
  choice: onwe anyị
  rationale: E debere nnọchiaha nlaghachi a ugboro abụọ iji chekwaa ọdịiche dị n’etiti ndị na-ekwusa ozi na onye ha na-ekwusa.
- source_word: Χριστὸν Ἰησοῦν
  choice: Mesaya Jizọs
  rationale: “Mesaya” na-egosipụta Χριστός dịka utu aha, ebe “Jizọs” bụ aha onye ahụ; usoro a na-esokwa usoro okwu Grik.
- source_word: κύριον
  choice: Onyenwe
  rationale: “Onyenwe” bụ okwu Igbo kwesịrị ekwesị maka κύριος ma na-echekwa nkwupụta na Jizọs bụ onye nwere ọchịchị.
- source_word: δούλους
  choice: ndị ohu
  rationale: “Ndị ohu” na-echekwa ike nke δοῦλοι na nrubeisi miri emi ọ na-egosi, karịsịa n’ọdịiche ya na Jizọs dịka Onyenwe.
- source_word: ὑμῶν
  choice: unu
  rationale: E jikọtara ya na “ndị ohu unu” iji gosipụta mmekọrịta nrubeisi na ije ozi Pọl na ndị ọrụ ibe ya nwere n’ebe ndị Kọrịnt nọ.
- source_word: διὰ Ἰησοῦν
  choice: n’ihi Jizọs
  rationale: 'διά ya na nrụaka na-egosi ihe kpatara ya ma ọ bụ ihe na-akpali ha: ha bụ ndị ohu ndị Kọrịnt n’ihi Jizọs.'
theological_decisions:
- issue: Ma a ga-asụgharị Χριστός dịka utu aha ka ọ bụ dịka akụkụ aha
  choice: Mesaya, dịka utu aha
  alternative: Kraịst, dịka aha a na-ejikarị akpọ ya
  rationale: N’ebe a, ihe a na-ekwusa banyere Jizọs ka a na-akọwa, ya mere ike Χριστός dịka utu aha ka dị ndụ.
- issue: Ike okwu Χριστὸν Ἰησοῦν κύριον
  choice: Mesaya Jizọs … dị ka Onyenwe
  alternative: Mesaya Jizọs bụ Onyenwe
  rationale: “Dị ka Onyenwe” na-echekwa ọdịdị prediketi nke κύριον n’enweghị itinye ngwaa doro anya nke na-adịghị n’ihe odide Grik.
- issue: Ike okwu δοῦλοι
  choice: ndị ohu
  alternative: ndị na-ejere unu ozi
  rationale: Nhọrọ a na-echekwa nrubeisi siri ike nke okwu Grik ma na-eme ka ọdịiche dị n’etiti Jizọs bụ Onyenwe na ndị ozi bụ ndị ohu pụta ìhè.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ikwusa” maka nkwupụta ihu ọha, “Mesaya” iji mee ka utu aha ahụ doo anya, na “ndị ohu” iji ghara ime ka ike δοῦλοι dị nro. E ji “Onyenwe” kama “Onyenwe anyị” zere ịgbakwunye nnọchiaha “anyị” nke na-adịghị n’ihe odide Grik.
