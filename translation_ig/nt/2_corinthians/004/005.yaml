  to: N’ihi na anyị anaghị ekwusa onwe anyị, kama Mesaya Jizọs dịka Onyenwe; anyị onwe anyị kwa bụ ndị ohu unu[b] n’ihi Jizọs[c].
  rationale: The revision removes the unnecessary repeated proclamation phrase, while preserving the Greek word order’s title-first expression “Mesaya Jizọs,” the predicative force of “dịka Onyenwe,” the repeated self-reference, and the strong sense of δοῦλοι. The unsupported footnote anchor a is removed because the revised verse contains no marker a; its lexical alternative is not required for comprehension. Footnote c is revised as a concise semantic explanation rather than an inaccurate alternative rendering.
