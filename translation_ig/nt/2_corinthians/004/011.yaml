    text: A pụkwara ịsụgharị ya, “maka Jizọs” ma ọ bụ “n’ihi Jizọs.”
    reason: lexical_alternative
  - marker: b
    text: “Anụ ahụ” n’ebe a pụtara ndụ mmadụ n’ahụ nke pụrụ ịnwụ, ọ bụghị “ọdịdị mmehie.”
    reason: lexical_alternative
  revision_rationale: The revision replaces the locative expression n’ọnwụ with nye ọnwụ to represent the Greek directional phrase εἰς θάνατον. It also places kwa directly with the clause about Jesus’ life, reflecting καί without adding interpretation. All other wording and both correctly anchored footnotes are retained.
