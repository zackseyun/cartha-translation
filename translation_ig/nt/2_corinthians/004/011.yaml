reference: 2 Corinthians 4:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: ig
  text: N’ihi na a na-enyefe anyị ndị dị ndụ nye ọnwụ mgbe niile n’ihi Jizọs[a], ka e wee kpughee kwa ndụ Jizọs n’anụ ahụ anyị na-anwụ anwụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “maka Jizọs” ma ọ bụ “n’ihi Jizọs.”
    reason: lexical_alternative
  - marker: b
    text: “Anụ ahụ” n’ebe a pụtara ndụ mmadụ n’ahụ nke pụrụ ịnwụ, ọ bụghị “ọdịdị mmehie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεί
  choice: mgbe niile
  rationale: Nke a na-egosi ọnọdụ ma ọ bụ omume na-aga n’ihu ugboro ugboro; ọ bụ okwu Igbo doro anya ma kwekọọ na ‘mgbe nile.’
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na nke bu ya ụzọ dị ka nkọwa, n’enweghị itinye nkọwa ọzọ na-adịghị n’isi mmalite.
- source_word: οἱ ζῶντες
  choice: anyị ndị dị ndụ
  rationale: Ọ na-echekwa ọdịdị participle ahụ dị ka aha ma mee ka ọdịiche dị n’etiti ịdị ndụ na ọnwụ pụta ìhè.
- source_word: εἰς θάνατον
  choice: n’ọnwụ
  rationale: Ya na παραδιδόμεθα, ọ na-egosi ebe ma ọ bụ ihe a na-enyefe ha ihu—ọnwụ.
- source_word: παραδιδόμεθα
  choice: a na-enyefe anyị
  rationale: Ọ na-echekwa olu nnara na omume na-aga n’ihu nke present passive, n’akpọghị onye na-eme ya aha.
- source_word: διὰ Ἰησοῦν
  choice: n’ihi Jizọs
  rationale: διά tinyere accusative na-egosikarị ihe kpatara ya. Nhọrọ a dị nkenke ma na-echekwa ohere ịghọta ya dị ka ‘n’ihi Jizọs’ ma ọ bụ ‘maka Jizọs.’
- source_word: ἵνα
  choice: ka e wee
  rationale: Ọ na-egosi ebumnuche ma ọ bụ nsonaazụ, dị ka Greek si hapụ njikọ abụọ ahụ ka ha dị nso.
- source_word: καί
  choice: kwa
  rationale: E tinyere ya n’okwu ‘kpugheekwa’ iji gosi njikọ na ihe e kwuru banyere Jizọs na ọnwụ.
- source_word: ἡ ζωὴ τοῦ Ἰησοῦ
  choice: ndụ Jizọs
  rationale: Ọ na-echekwa genitive ahụ na ọdịiche dị n’etiti ndụ Jizọs na ọnwụ.
- source_word: φανερωθῇ
  choice: e wee kpughee
  rationale: Ọ na-echekwa passive subjunctive n’enweghị ịkpọ onye na-ekpughe ya aha.
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: n’anụ ahụ anyị nke na-anwụ anwụ
  rationale: ‘Anụ ahụ’ na-egosi ndụ mmadụ n’ahụ nke ọnwụ pụrụ iru, ọ bụghị agwa mmehie; okwu mgbakwunye ahụ na-eme ka ọnwụnwụ ya doo anya.
theological_decisions:
- issue: Ihe σάρξ pụtara n’ebe a n’akwụkwọ Pọl
  choice: anụ ahụ
  alternative: ahụ; ọdịdị mmehie
  rationale: Nkọwa ‘nke na-anwụ anwụ’ na-egosi na ihe a na-ekwu bụ ndụ ndịozi n’ahụ nke na-adịghị adịgide adịgide, ọ bụghị ike ma ọ bụ ọdịdị mmehie. ‘Anụ ahụ’ na-echekwa ihe okwu Greek ahụ pụtara ebe a.
- issue: Ihe διὰ Ἰησοῦν pụtara
  choice: n’ihi Jizọs
  alternative: maka Jizọs; n’ihi okwukwe ha na Jizọs
  rationale: διά na accusative na-egosi ihe kpatara ahụhụ ahụ. A hapụrụ okwu ahụ n’ụdị sara mbara ka a ghara ịgbakwunye ‘okwukwe ha’ nke na-adịghị n’ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ntụgharị a. A nọgidere na passive n’ahịrị abụọ ahụ, a hapụkwara njikọ ebumnuche/nsonaazụ nke ἵνα ka ọ ghara ịbụ nke a kọwara gabiga ihe isi mmalite kwuru. Akara nkọwa ala peeji [a] na [b] dị n’isi ederede.
