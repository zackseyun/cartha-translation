review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the ongoing passive handing-over, the causal sense of διὰ Ἰησοῦν, and the purpose/result clause. However, n’ọnwụ normally means ‘in death’ and does not adequately represent εἰς θάνατον as the destination to which the living are handed over. ‘Nye ọnwụ’ preserves that directional/resultative force.
  naturalness: The wording is clear Standard Igbo. Moving kwa to modify ‘ndụ Jizọs’ more directly and using ‘nye ọnwụ’ improves idiomatic clarity without losing the Greek structure.
  terminology: ‘Anụ ahụ’ appropriately retains the literal somatic sense of σάρξ in this context, while ‘na-anwụ anwụ’ expresses θνητῇ. The footnote properly guards against reading the expression as an ethical reference to sinful nature. ‘Jizọs’ and the theological terms are suitable.
  issues:
  - severity: medium
    issue: εἰς θάνατον is rendered n’ọnwụ.
    rationale: The preposition εἰς with παραδιδόμεθα indicates being handed over ‘to/unto death,’ not location ‘in death.’ ‘Nye ọnwụ’ supplies the required destination while retaining the passive ambiguity about the agent.
  revised_text: N’ihi na a na-enyefe anyị ndị dị ndụ nye ọnwụ mgbe niile n’ihi Jizọs[a], ka e wee kpughee kwa ndụ Jizọs n’anụ ahụ anyị na-anwụ anwụ[b].
  revised_footnotes:
