revisions:
- from: N’ihi na a na-enyefe anyị ndị dị ndụ n’ọnwụ mgbe niile n’ihi Jizọs[a], ka e wee kpugheekwa ndụ Jizọs n’anụ ahụ anyị nke na-anwụ anwụ[b].
  to: N’ihi na a na-enyefe anyị ndị dị ndụ nye ọnwụ mgbe niile n’ihi Jizọs[a], ka e wee kpughee kwa ndụ Jizọs n’anụ ahụ anyị na-anwụ anwụ[b].
  rationale: The revision replaces the locative expression n’ọnwụ with nye ọnwụ to represent the Greek directional phrase εἰς θάνατον. It also places kwa directly with the clause about Jesus’ life, reflecting καί without adding interpretation. All other wording and both correctly anchored footnotes are retained.
