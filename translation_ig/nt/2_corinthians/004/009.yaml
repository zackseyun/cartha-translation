  verdict: approve
  source_fidelity: 'The translation accurately preserves the two paired passive participial contrasts: hostile persecution without abandonment, and being knocked/thrown to the ground without ultimate destruction. The progressive passive construction “a na-… anyị” appropriately conveys the Greek participial aspect in natural Igbo.'
  naturalness: The wording is clear, idiomatic Standard Igbo, and the balanced repetition of “ma a naghị … anyị” reflects the concise rhetorical parallelism of the source. “A na-akụtu anyị n’ala” naturally conveys being struck or knocked down in this context.
  terminology: “A na-akpagbu anyị” suitably renders διωκόμενοι as persecution rather than neutral pursuit. “A naghị agbahapụ anyị” faithfully expresses ἐγκαταλειπόμενοι without adding an explicit agent. “A naghị ebibi anyị” correctly communicates the contrast with final destruction. No theological over-interpretation is introduced.
