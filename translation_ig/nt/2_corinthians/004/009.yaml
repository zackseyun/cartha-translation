id: 2CO.4.9
reference: 2 Corinthians 4:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διωκόμενοι ἀλλ’ οὐκ ἐγκαταλειπόμενοι, καταβαλλόμενοι ἀλλ’ οὐκ ἀπολλύμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/009.yaml
  text: persecuted[a], but not abandoned; struck down, but not destroyed[b],
translation:
  language: ig
  text: a na-akpagbu anyị, ma a naghị agbahapụ anyị; a na-akụtu anyị n’ala, ma a naghị ebibi anyị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διωκόμενοι
  choice: a na-akpagbu anyị
  rationale: N’ebe a, okwu Grik a na-egosi mkpagbu sitere n’aka ndị iro, ọ bụghị naanị ịchụ mmadụ ọsọ. ‘A na-akpagbu anyị’ bụ okwu Igbo doro anya ma kwekọọ n’ụdị participle passive ahụ.
- source_word: ἐγκαταλειπόμενοι
  choice: a naghị agbahapụ anyị
  rationale: ‘Ịgbahapụ’ na-egosi ịhapụ mmadụ naanị ya ma ọ bụ hapụ inyere ya aka. Ọ bụ okwu Igbo dị ugbu a ma dị mfe nghọta.
- source_word: καταβαλλόμενοι
  choice: a na-akụtu anyị n’ala
  rationale: Okwu a pụtara iweda ma ọ bụ ịtụ mmadụ n’ala. ‘Ịkụtu n’ala’ na-echekwa oyiyi nke onye e meriri ka ọ daa, ma ọ bụghị na e bibiela ya.
- source_word: ἀπολλύμενοι
  choice: a naghị ebibi anyị
  rationale: N’ọdịiche ya na ‘ịkụtu n’ala,’ ‘ibibi’ na-egosi mbibi zuru oke, nke na-eme ka ntụnyere okwu abụọ ahụ sie ike.
- source_word: ἀλλ’ οὐκ
  choice: ma a naghị
  rationale: Usoro a na-enye Igbo eke nke na-echekwa ọdịiche siri ike na nkwughachi nke ahịrịokwu Grik ahụ.
theological_decisions:
- issue: Ma a ga-asụgharị ἐγκαταλειπόμενοι n’ụzọ nwere ụda okpukpe pụrụ iche ma ọ bụ n’ụzọ Igbo nkịtị
  choice: a naghị agbahapụ anyị
  alternative: a naghị ahapụ anyị naanị anyị
  rationale: ‘A naghị agbahapụ anyị’ na-echekwa echiche na a hapụghị Pọl na ndị ibe ya n’enweghị enyemaka, ma ọ naghị agbakwunye nkọwa banyere onye na-agbahapụ ha nke ederede a ekwughị kpọmkwem.
translation_notes:
  register: Asụsụ Igbo Izugbe, dị ugbu a ma nwee ugwu. E chekwara usoro ahịrịokwu abụọ na ọdịiche ‘ma ...ghị’ nke ederede Grik. Agbakwụnyeghị akara ntụaka ala peeji n’ihi na nhọrọ Igbo ndị e jiri mee ihe na-eburu ọdịiche okwu ndị ahụ nke ọma n’enweghị mkpa nkọwa ọzọ.
