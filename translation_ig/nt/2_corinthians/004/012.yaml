id: 2CO.4.12
reference: 2 Corinthians 4:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε ⸀ὁ θάνατος ἐν ἡμῖν ἐνεργεῖται, ἡ δὲ ζωὴ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/012.yaml
  text: So then[a], death is at work in us, but life in you.
translation:
  language: ig
  text: Ya mere[a], ọnwụ na-arụ ọrụ n'ime anyị, ma ndụ na-arụ ọrụ n'ime unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “N''ihi nke a, ọnwụ na-arụ ọrụ n''ime anyị, ma ndụ na-arụ ọrụ n''ime unu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ya mere
  rationale: N'ebe a, okwu a na-egosi ihe si n'okwu ndị bu ụzọ pụta. “Ya mere” na-egosipụta nkwubi okwu ahụ n'Igbo nkịtị ma dị ugwu.
- source_word: ὁ θάνατος
  choice: ọnwụ
  rationale: “Ọnwụ” na-edobe okwu ahụ dịka eziokwu na-arụ ọrụ, n'emeghị ka ọ bụrụ naanị otu ọnwụ kpọmkwem ma ọ bụ naanị ihe atụ.
- source_word: ἐν ἡμῖν
  choice: n'ime anyị
  rationale: Nke a na-edobe njikọ doro anya ya na “n'ime unu,” ma kwe ka okwu ahụ metụta ahụmahụ ndị ozi n'onwe ha nakwa ha dịka otu.
- source_word: ἐνεργεῖται
  choice: na-arụ ọrụ
  rationale: Okwu a na-egosi ihe na-arụsi ọrụ ike ma na-eweta ihe ọ na-eme. Nsụgharị a bụ Igbo e ji eme ihe ugbu a, ọ bụghịkwa okwu nka siri ike.
- source_word: ἡ δὲ ζωὴ
  choice: ma ndụ
  rationale: “Ma” na-egosi ọdịiche dị n'etiti ọnwụ na ndụ. “Ndụ” na-edobe okwu ahụ n'obosara ya n'akọwaghị ya karịa ihe Grik kwuru.
- source_word: ἐν ὑμῖν
  choice: n'ime unu
  rationale: Nke a kwekọrọ n'ụzọ ziri ezi na “n'ime anyị,” ma na-ahapụ ma echiche nke ndị Kọrịnt dịka otu ma nke onye ọ bụla n'ime ha ghe oghe.
theological_decisions:
- issue: Ihe ọdịiche dị n'etiti ọnwụ na ndụ pụtara
  choice: E debere okwu abụọ ahụ dịka “ọnwụ” na “ndụ,” nke mere na ha gụnyere ahụhụ yiri ọnwụ ndị ozi na-ata na ndụ ndị Kọrịnt na-enweta site n'ozi ahụ, n'emeghị ka ihe ahụ bụrụ naanị nke anụ ahụ ma ọ bụ naanị ihe ime mmụọ.
  alternative: Ịkọwa ya naanị dịka ọnwụ anụ ahụ megide nchekwa anụ ahụ, ma ọ bụ naanị dịka ịnwụ nye onwe megide ndụ ebighị ebi.
  rationale: Amaokwu ndị bu nke a ụzọ na-ekwu maka ọnwụ Jizọs na ndụ ya nke a na-eme ka ha pụta ìhè n'ahụ ndị ozi; arụmụka sara mbara na-ekwu kwa maka ozi na-ewetara ndị ọzọ ndụ. Ya mere, nsụgharị ahụ anaghị eme ka ihe okwu ndị a pụtara dị warara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. E kwughachiri “na-arụ ọrụ” n'akụkụ nke abụọ ka ahịrịokwu ahụ bụrụ nke e ji Igbo ekwu nke ọma, ebe Grik hapụrụ ngwaa nke abụọ ka onye na-agụ ya ghọta ya site na nke mbụ.
