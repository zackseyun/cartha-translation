id: 2CO.4.6
reference: 2 Corinthians 4:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: ig
  text: N’ihi na Chineke, onye kwuru sị, “Ìhè ga-enwu site n’ọchịchịrị,”[c] bụ onye enwuworo n’ime obi anyị ka ìhè nke ihe ọmụma banyere ebube Chineke n’ihu Mesaịa wee mụnye.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ime Mesaịa n’onwe ya.” Okwu Grik ahụ pụkwara ịpụta kpọmkwem “n’ihu Mesaịa,” nke na-edobe onyonyo ebube Chineke a na-ahụ anya.
    reason: alternative_reading
  - marker: b
    text: Grik bụ Χριστοῦ, nke a na-asụkarị “Kraịst”; ebe a, a sụgharịrị ya “Mesaịa” n’ihi na ọ na-arụ ọrụ dịka aha ọkwá.
    reason: lexical_alternative
  - marker: c
    text: Okwu a na-eme ka e cheta Jenesis 1:3, na-ejikwa onyonyo ìhè e kere eke kọwaa ọrụ Chineke nke ime ka ndị kwere ekwe mata ya.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: N’ebe a, okwu a na-enye ihe kpatara okwu bu ya ụzọ; “N’ihi na” na-egosi njikọ ahụ nke ọma n’Igbo.
- source_word: ὁ θεὸς ὁ εἰπών
  choice: Chineke, onye kwuru sị
  rationale: A tụgharịrị participle nwere article ka ọ bụrụ nkebiokwu njikọ, nke bụ ụzọ doro anya ma bụrụkwa nke e ji ekwu Igbo nke ọma.
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: Ìhè ga-esi n’ọchịchịrị nwupụta
  rationale: Nke a na-edobe ọdịnihu dị na λάμψει, na-egosikwa n'ụzọ doro anya na ìhè ahụ si n’ọchịchịrị pụta.
- source_word: ὃς ἔλαμψεν
  choice: bụ ya enwuworo
  rationale: A hapụrụ ngwaa ahụ ka ọ bụrụ nke na-anaghị achọ ihe e mere ya, dịka Grik si dị; ụdị perfect Igbo na-egosikwa ihe Chineke mere nke mmetụta ya ka dị ugbu a.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: n’ime obi anyị
  rationale: “Obi” na-edobe ihe atụ Akwụkwọ Nsọ banyere ime mmadụ, ma ọ bụkwa okwu ndị Igbo na-aghọta nke ọma.
- source_word: πρὸς φωτισμὸν
  choice: iji nye ìhè
  rationale: Ụdị ngwaa a na-eme ka okwu ahụ bụrụ Igbo dị mfe ma na-egosi ebumnobi nke πρὸς φωτισμόν n’ebughị nkọwa ọzọ bata.
- source_word: τῆς γνώσεως τῆς δόξης τοῦ θεοῦ
  choice: nke ihe ọmụma banyere ebube Chineke
  rationale: “Ihe ọmụma” na-edobe aha okwu γνώσεως, ebe “banyere” na-eme ka usoro genitive ahụ doo anya n’Igbo na-enweghị ịgbanwe isi ya.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: n’ihu Mesaịa
  rationale: “Ihu” na-edobe onyonyo pụtara ìhè nke πρόσωπον n’ọnọdụ a gbasara ìhè na ebube; “Mesaịa” na-egosi Χριστός dịka aha ọkwá.
theological_decisions:
- issue: Ntughari Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a Χριστός na-arụ ọrụ dịka aha ọkwá; “Mesaịa” na-eme ka nke ahụ pụta ìhè, ebe “Kraịst” ka e debere dịka ụzọ ọdịnala ọzọ.
- issue: Ihe ἐν προσώπῳ Χριστοῦ pụtara
  choice: n’ihu Mesaịa
  alternative: n’ime onye Mesaịa bụ
  rationale: Ntughari a na-edobe onyonyo ihu, ìhè, na ebube dị n’ederede, ma ihe odide ala peeji na-echekwa nghọta sara mbara nke nwere ike ịpụta “n’ime onye ọ bụ.”
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A hapụrụ usoro ìhè—ọchịchịrị—obi—ebube—ihu ka ọ dị n’ederede Grik, ma zere okwu ụka nke otu denominashọn kpọmkwem.
