review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the ongoing bearing of Jesus’ death, the unexpressed possessive in the first ‘body,’ and the explicit ‘our’ in the second. However, ‘ka e wee meekwa ka ndụ Jizọs pụta ìhè’ introduces an unspecified agent who causes the life to appear. The Greek has a passive subjunctive: ‘so that the life of Jesus may also be revealed.’'
  naturalness: ‘Mgbe niile na-eburu ...’ is a natural Standard Igbo ordering and retains the participial connection to the wider sentence. ‘Ka ndụ Jizọs kwekwa pụta ìhè’ is idiomatic and avoids the added causative construction.
  terminology: ‘Ọnwụ Jizọs,’ ‘ndụ Jizọs,’ and ‘ahụ’ are appropriate. The footnote preserves the viable lexical alternative ‘ịnwụ anwụ Jizọs’ without deciding the genitive relation beyond the Greek wording.
  issues:
  - severity: medium
    issue: The purpose clause adds a causative agent.
    rationale: ‘Ka e wee meekwa ka ... pụta ìhè’ means roughly ‘so that someone may also make ... appear,’ whereas φανερωθῇ is passive and states that Jesus’ life may be revealed. Removing ‘e wee mee ka’ preserves the source’s passive formulation.
  revised_text: mgbe niile na-eburu ọnwụ Jizọs n’ahụ[a], ka ndụ Jizọs kwekwa pụta ìhè n’ahụ anyị.
