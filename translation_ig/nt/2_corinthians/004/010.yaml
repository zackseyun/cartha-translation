reference: 2 Corinthians 4:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντοτε τὴν νέκρωσιν ⸀τοῦ Ἰησοῦ ἐν τῷ σώματι περιφέροντες, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ ἐν τῷ σώματι ἡμῶν φανερωθῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/010.yaml
  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: ig
  text: mgbe niile na-eburu ọnwụ Jizọs n’ahụ[a], ka ndụ Jizọs kwekwa pụta ìhè n’ahụ anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịnwụ anwụ Jizọs.” Aha a n’asụsụ Grik nwere ike imesi ọnọdụ ọnwụ ike ma ọ bụ ahụmahụ nke ọnwụ a na-ebu n’ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Nkebiokwu a na-egosi na ihe ahụ na-aga n’ihu mgbe nile, ma bụrụkwa okwu Igbo dị mfe ma kwekọọ n’ọnọdụ a.
- source_word: νέκρωσιν
  choice: ọnwụ
  rationale: Ọ na-egosi ọnọdụ ma ọ bụ ahụmahụ nke ọnwụ. “Ọnwụ” na-eme ka myirịta ya na “ndụ” doo anya; a debere “ịnwụ anwụ” n’okpuru peeji dịka ụzọ ọzọ.
- source_word: τοῦ Ἰησοῦ
  choice: Jizọs
  rationale: “Ọnwụ Jizọs” na-edebe njikọ genitive nke Grik n’enweghị ịkọwa ya karịa ka ederede si kwuo.
- source_word: ἐν τῷ σώματι
  choice: n’ahụ
  rationale: Ebe mbụ a enweghị nnọchiaha nwe mmadụ kpọmkwem; “n’ahụ” na-ezere itinye “anyị” nke na-adịghị n’ebe ahụ na Grik.
- source_word: περιφέροντες
  choice: na-eburu
  rationale: Ụdị participle nke ugbu a na-egosi ibu ihe ahụ na-aga n’ihu; “na-eburu” bụ Igbo nkịtị nke na-edebe ihe atụ nke ibu ahụhụ n’ahụ.
- source_word: ἵνα
  choice: ka e wee
  rationale: Ọ na-egosi nzube ma ọ bụ ihe si na ya pụta, n’ụzọ dabara adaba n’Igbo.
- source_word: καὶ
  choice: meekwa
  rationale: “-kwa” na-egosi njikọ kwekọrọ n’etiti ọnwụ Jizọs na ndụ Jizọs.
- source_word: ζωὴ
  choice: ndụ
  rationale: Nke a bụ ntụgharị kwụ ọtọ ma doo anya; n’ebe a ọ na-arụtụ aka ná ndụ Jizọs ahụ e mere ka o si n’ọnwụ bilie.
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: n’ahụ anyị
  rationale: Ọ na-edebe aha ahụ n’otu dịka Grik si dị, tinyere nnọchiaha ọtụtụ “anyị,” ma na-echekwa echiche nke ahụ ọnụ nke ndị ozi.
- source_word: φανερωθῇ
  choice: ka ... pụta ìhè
  rationale: Nke a bụ ụzọ Igbo dị ndụ isi kwuo na e mere ka ihe a na-adịghị ahụ anya pụta ìhè; nhazi “ka e wee mee ka” na-echekwakwa olu nnara nke Grik.
theological_decisions:
- issue: Ihe νέκρωσις pụtara n’ihe metụtara Jizọs
  choice: ọnwụ Jizọs
  alternative: ịnwụ anwụ Jizọs
  rationale: Ha abụọ kwe omume, ma “ọnwụ” na-egosi isi okwu aha ahụ nke ọma ma na-eme ka myirịta ya na “ndụ Jizọs” guzosie ike, n’enweghị itinye nkọwa okpukpe dị warara.
- issue: Ọnụọgụ σώμα
  choice: Idobe “ahụ” n’otu n’ebe abụọ ahụ
  alternative: ahụ anyị dị iche iche
  rationale: Grik ji σώμα n’otu n’ebe abụọ ahụ. “Ahụ anyị” bụkwa Igbo e ji ekwu ihe gbasara onye ọ bụla n’ime otu ìgwè, ma na-edebe ụda okwu ahụ na echiche nke ọrụ ndị ozi dịka otu.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ malitere na participle dịka akụkụ nke ahịrịokwu gbara ya gburugburu, ya mere e debere mmalite “na-eburu.” E chekwara ọdịiche dị n’etiti “n’ahụ” nke mbụ na “n’ahụ anyị” nke abụọ.
