  to: mgbe niile na-eburu ọnwụ Jizọs n’ahụ[a], ka ndụ Jizọs kwekwa pụta ìhè n’ahụ anyị.
  rationale: The revision corrects the Greek passive φανερωθῇ by rendering it directly as ‘ka ... pụta ìhè,’ rather than adding an agent who makes it appear. It retains the draft’s sound lexical choices, the first phrase’s unspecified possessive, the second phrase’s explicit ‘anyị,’ and the ongoing sense of πάντοτε and περιφέροντες.
