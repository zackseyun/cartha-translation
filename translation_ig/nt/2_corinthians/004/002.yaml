    text: Ma ọ bụ, “site n’igosipụta eziokwu.” Okwu Grik ahụ na-emesi ime ka eziokwu pụta ìhè ike, ọ bụghị naanị ikwusa ya ọnụ.
    reason: lexical_alternative
  revision_rationale: Removed the added “all,” rendered the shame phrase as a characterization of the hidden practices, and replaced the expanded final assertion with a concise rendering that preserves Paul’s act of presenting or commending himself and his coworkers to each person’s conscience before God. The footnote anchors remain attached to the same lexical items.
