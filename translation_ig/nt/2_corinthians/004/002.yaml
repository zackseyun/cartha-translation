id: 2CO.4.2
reference: 2 Corinthians 4:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: ig
  text: Kama nke ahụ, anyị ajụla ihe nzuzo ndị na-eme mmadụ ihere. Anyị anaghị ebi ndụ n’aghụghọ, anyị anaghịkwa eji aghụghọ agbagọ okwu Chineke[a]. Kama, site n’ime ka eziokwu pụta ìhè[b], anyị na-egosi onwe anyị n’ihu akọ na uche mmadụ ọ bụla n’ihu Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị anaghịkwa emetọ okwu Chineke.” Ngwaa Grik ahụ nwere ike ịpụta iji aghụghọ tinye ihe ọzọ n’ihe ka ọ ghara ịdị ọcha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’igosipụta eziokwu.” Okwu Grik ahụ na-emesi ime ka eziokwu pụta ìhè ike, ọ bụghị naanị ikwusa ya ọnụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: anyị ajụla
  rationale: Na-egosipụta ịjụ ihe kpamkpam na mkpebi siri ike; ọ bụkwa okwu Igbo dị mfe ma doo anya.
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: ihe nzuzo niile na-eweta ihere
  rationale: Na-edobe echiche banyere omume zoro ezo nke ihere ji mara, ma na-asụ ya n’Igbo nkịtị.
- source_word: περιπατοῦντες ἐν πανουργίᾳ
  choice: anyị adịghị ebi ndụ n’aghụghọ
  rationale: Ịsụgharị περιπατεῖν dị ka ‘ibi ndụ’ na-eme ka ihe atụ ahụ doo ndị na-agụ Igbo anya; ‘aghụghọ’ na-egosi amamihe ọjọọ na-enweghị ezi obi.
- source_word: δολοῦντες
  choice: jiri aghụghọ agbanwe
  rationale: Na-ejide echiche nke iji aghụghọ metọọ ma ọ bụ gbanwee ihe, ọ bụghị nanị ịkọwa ya n’ụzọ na-ezighị ezi.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Ọ bụ nsụgharị Igbo a na-aghọta nke ọma, ma ọ naghị emechi λόγος n’otu nghọta dị warara.
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: site n’ime ka eziokwu pụta ìhè
  rationale: Na-egosipụta ime ka eziokwu bụrụ ihe a na-ahụ ma doo anya, na-enweghị ime ka ọ bụrụ naanị ikwusa okwu ọnụ.
- source_word: συνιστάνοντες ἑαυτούς
  choice: anyị na-eme ka ... kweta na anyị bụ ndị kwesịrị ntụkwasị obi
  rationale: Na-enye echiche nke igosi onwe onye dị ka onye a pụrụ ịnabata ma ọ bụ ịtụkwasị obi, n’ụzọ Igbo dị ndụ.
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: akọ na uche mmadụ niile
  rationale: Na-echekwa echiche nkesa nke πᾶσαν na ikike mmadụ ọ bụla ịmata ihe ọma na ihe ọjọọ.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: n’ihu Chineke
  rationale: Na-echekwa echiche na Chineke bụ onye akaebe na onye na-ekpebi ezi omume nke ije ozi ahụ.
theological_decisions:
- issue: Ụdị ọdịiche dị n’etiti ozi aghụghọ na ozi eziokwu
  choice: Amaokwu ahụ na-ekwu banyere ịdị ọcha na ime ihe n’ihu ọha n’ije ozi ndịozi.
  alternative: Ịghọta ya naanị dị ka ikpe megide aghụghọ n’ikwu okwu, ma ọ bụ dị ka nkwupụta ozizi zuru ezu banyere ụzọ niile e si eji Akwụkwọ Nsọ eme ihe.
  rationale: Ọnọdụ okwu ahụ lekwasịrị anya n’omume Pọl na ndị ọrụ ibe ya na ụzọ ha si eme ka eziokwu mara; nsụgharị ahụ anaghị etinye ozizi pụrụ iche nke ederede ahụ ekwughị kpọmkwem.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ugwu, ma dị mfe nghọta. E ji ‘ibi ndụ’ dochie ihe atụ nkịtị nke ‘ije ije’ ka echiche omume ndụ doo anya, ebe e chekwara ịdị arọ nke ọdịiche Pọl na-egosi.
