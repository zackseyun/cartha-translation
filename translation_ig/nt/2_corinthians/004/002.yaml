revisions:
- from: Kama nke ahụ, anyị ajụla ihe nzuzo niile na-eweta ihere. Anyị adịghị ebi ndụ n’aghụghọ, anyị adịghịkwa eji aghụghọ agbanwe okwu Chineke[a]. Kama, site n’ime ka eziokwu pụta ìhè[b], anyị na-eme ka akọ na uche mmadụ niile kweta na anyị bụ ndị kwesịrị ntụkwasị obi n’ihu Chineke.
  to: Kama nke ahụ, anyị ajụla ihe nzuzo ndị na-eme mmadụ ihere. Anyị anaghị ebi ndụ n’aghụghọ, anyị anaghịkwa eji aghụghọ agbagọ okwu Chineke[a]. Kama, site n’ime ka eziokwu pụta ìhè[b], anyị na-egosi onwe anyị n’ihu akọ na uche mmadụ ọ bụla n’ihu Chineke.
  rationale: Removed the added “all,” rendered the shame phrase as a characterization of the hidden practices, and replaced the expanded final assertion with a concise rendering that preserves Paul’s act of presenting or commending himself and his coworkers to each person’s conscience before God. The footnote anchors remain attached to the same lexical items.
