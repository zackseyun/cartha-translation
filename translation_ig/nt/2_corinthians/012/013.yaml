id: 2CO.12.13
reference: 2 Corinthians 12:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: ig
  text: N’ihi na, n’ihe gịnị ka e mere ka unu nọrọ n’ọnọdụ dị ala karịa ọgbakọ ndị ọzọ[a], ma e wezụga na mụ onwe m adịghịrị unu ibu arọ[b]? Gbagharanụ m mmejọ a[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “e mere ka unu nọrọ n’ọnọdụ dị ala karịa ọgbakọ ndị ọzọ.” Okwu Grik ahụ nwere ike ịpụta ime ka mmadụ nọrọ n’ọnọdụ na-adịghị mma ma ọ bụ ile ya anya dị ka onye dị ala.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, Pọl anabataghị nkwado ego ma ọ bụ ihe ndị ọzọ dị mkpa n’aka ha, nke gaara abụrịrị ha ibu.
    reason: cultural_note
  - marker: c
    text: 'Pọl ji okwu a na-akwa emo: “mmejọ” a sị na o mere bụ na ọ dịghịrị ha ibu arọ.'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡσσώθητε
  choice: e si mee ka unu bụrụ ndị dị ala
  rationale: Okwu a dị n’ụdị passive ma na-egosi na e mere ka ha nọrọ n’ọnọdụ dị ala ma ọ bụ nke na-adịghị mma; nsụgharị a anaghị ekwu na ha dị ala n’onwe ha.
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: karịa nzukọ Kraịst ndị ọzọ
  rationale: N’ebe a ὑπέρ na-egosi ntụnyere, ebe λοιπάς na-ezo aka na nzukọ ndị ọzọ a na-atụnyere ha na ha.
- source_word: αὐτὸς ἐγὼ
  choice: mụ onwe m
  rationale: Nke a na-edobe nkwusikwu okwu dị n’aha nnọchiaha Grik abụọ ahụ.
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: m abụrụghị unu ibu arọ
  rationale: Akpaokwu a na-egosi na Pọl etinyeghị ha n’ibu nke ilekọta mkpa ya, karịchaa n’ihe gbasara nkwado ego na ihe onwunwe.
- source_word: χαρίσασθέ μοι
  choice: Gbagharanụ m
  rationale: N’iwu a nke jupụtara n’ịkwa emo, χαρίζομαι pụtara ịgbaghara; ọ na-edobe ike nke arịrịọ Pọl nke na-abụghị nkwupụta mmehie nkịtị.
- source_word: τὴν ἀδικίαν ταύτην
  choice: ihe ọjọọ a
  rationale: Akpaokwu ahụ na-ezo aka n’ihe a sị na ọ bụ mmejọ Pọl ka o mere mgbe ọ jụrụ ịbụ ha ibu arọ; ‘ihe ọjọọ a’ bụ okwu Igbo doro anya nke na-ahapụ ịkwa emo ahụ n’ọnọdụ ya.
- source_word: τί γάρ ἐστιν ὃ
  choice: N’ihi na, olee ụzọ
  rationale: Nke a na-eweta ajụjụ ntụgharị uche banyere akụkụ ma ọ bụ ụzọ e si mee ka ha dị ala, ma na-edobekwa njikọ γάρ na okwu bu ya ụzọ.
theological_decisions:
- issue: Nkwupụta Pọl nke ịkwa emo banyere nkwado ego
  choice: E debere okwu ahụ n’ụzọ kwụ ọtọ, ebe ‘Gbagharanụ m ihe ọjọọ a’ na-eme ka ịkwa emo ahụ pụta site n’ọnọdụ okwu ahụ.
  alternative: Ịgbakwunye okwu dị ka ‘ihe ọjọọ dị egwu’ ma ọ bụ ikwu n’ahịrịokwu ahụ kpọmkwem na Pọl na-akwa emo.
  rationale: Ihe odide Grik anaghị etinye nkọwa ahụ n’ụzọ doro anya; ọnọdụ na nhazi okwu ya na-egosi ịkwa emo. Ya mere, nsụgharị agaghị etinye nkọwa karịrị ihe isi mmalite kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Nzukọ Kraịst’ na-egosi ọgbakọ ndị kwere ekwe n’enweghị itinye nkọwa otu ụka pụrụ iche. E debere nkwusikwu ‘mụ onwe m’ na ịkwa emo nke ahịrịokwu ikpeazụ.
