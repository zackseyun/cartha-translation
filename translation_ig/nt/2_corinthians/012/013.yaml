revisions:
- from: N’ihi na, olee ụzọ e si mee ka unu bụrụ ndị dị ala karịa nzukọ Kraịst ndị ọzọ[a], ma ọ bụghị naanị na mụ onwe m abụrụghị unu ibu arọ[b]? Gbagharanụ m ihe ọjọọ a[c].
  to: N’ihi na, n’ihe gịnị ka e mere ka unu nọrọ n’ọnọdụ dị ala karịa ọgbakọ ndị ọzọ[a], ma e wezụga na mụ onwe m adịghịrị unu ibu arọ[b]? Gbagharanụ m mmejọ a[c].
  rationale: The revision removes the unsupported “Kraịst,” renders the opening question as a question of respect rather than method, and smooths the explanation of financial support. It retains the source’s emphasis, comparison, and irony without making Paul’s sarcasm explicit in the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:22Z'
review_pass:
  verdict: revise
  source_fidelity: The draft captures the rhetorical question, the comparative disadvantage expressed by ἡσσώθητε ... ὑπὲρ τὰς λοιπὰς ἐκκλησίας, Paul's emphatic αὐτὸς ἐγώ, his not being a financial burden, and the ironic imperative. However, “nzukọ Kraịst” adds “Christ,” which is absent from ἐκκλησίας, and “olee ụzọ” is less precise for the Greek question asking in what respect.
  naturalness: 'The proposed revision uses idiomatic Standard Igbo: “n’ihe gịnị” naturally asks “in what respect,” “ọgbakọ” is a natural rendering of congregations/churches, and “adịghịrị unu ibu arọ” clearly conveys not burdening them.'
  terminology: “Ọgbakọ ndị ọzọ” renders ἐκκλησίαι without adding a christological modifier or imposing a denominational sense. “Mmejọ a” is a natural contextual rendering of the supposed ἀδικία while retaining the irony.
  issues:
  - severity: medium
    issue: “nzukọ Kraịst” adds a modifier not present in the source.
    rationale: ἐκκλησίας means assemblies/congregations/churches; the Greek text does not specify “of Christ.” “Ọgbakọ ndị ọzọ” preserves the referent without addition.
  - severity: low
    issue: “olee ụzọ” is not the most exact expression for τί γάρ ἐστιν ὃ.
    rationale: The rhetorical question concerns the respect or point in which they were disadvantaged, not the method by which it happened. “N’ihe gịnị” is more precise and natural.
  - severity: low
    issue: The cultural footnote is awkwardly phrased.
    rationale: “Ha buru ibu nke ilekọta ya” is not natural Standard Igbo. A direct explanation of financial or material support is clearer.
