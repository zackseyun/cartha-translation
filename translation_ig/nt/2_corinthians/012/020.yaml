id: 2CO.12.20
reference: 2 Corinthians 12:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: ig
  text: N’ihi na ana m atụ egwu na, mgbe m bịara, m nwere ike ghara ịhụ unu otú m chọrọ ka unu dị, unu nwekwara ike ịhụ m otú unu na-achọghị ka m dị—na ikekwe esemokwu, ekworo, iwe ọkụ, ọchịchọ ibuli onwe onye elu, nkwutọ, ịgba asịrị[a], mpako, na ọgba aghara ga-adị n’etiti unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwu a na-ekwu na nzuzo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβοῦμαι
  choice: ana m atụ egwu
  rationale: Na-egosipụta nchegbu Pọl na-aga n’ihu, n’asụsụ Igbo doro anya ma dịkwa ike.
- source_word: μή πως
  choice: na ... enwere m ike / na ikekwe
  rationale: E ji ụzọ abụọ kwekọrọ n’Igbo gosipụta ihe nwere ike ime nke Pọl na-atụ ụjọ ya, ugboro abụọ okwu a pụtara.
- source_word: ἐλθὼν
  choice: mgbe m bịara
  rationale: A ghọtara participle a dị ka nke na-egosi oge n’ọnọdụ a.
- source_word: οὐχ οἵους θέλω
  choice: ka unu na-abụghị ụdị m chọrọ
  rationale: Na-ezo aka n’ọnọdụ ma ọ bụ omume ndị Kọrịnt, ma na-edebe ntụnyere nke okwu Grik.
- source_word: εὕρω ὑμᾶς
  choice: enwere m ike ịhụ unu
  rationale: Na-egosipụta ohere ihe ahụ nwere ime n’okpuru μή πως.
- source_word: κἀγὼ εὑρεθῶ ὑμῖν
  choice: unu onwe unu ahụkwa m
  rationale: 'Ụdị Igbo a bụ eke karịa passive kpọmkwem, ma ọ ka na-edebe ntụgharị ibe ya: Pọl ịhụ ha, ha ahụkwa Pọl.'
- source_word: οἷον οὐ θέλετε
  choice: ka m bụrụ ụdị unu na-achọghị
  rationale: Na-edebe nhazi yiri nke ahịrịokwu mbụ na enweghị mmasị nke nwere ike ịdị n’akụkụ abụọ.
- source_word: ἔρις
  choice: esemokwu
  rationale: Na-ekpuchi ọgụ okwu, nkewa, na esemokwu dị n’etiti obodo.
- source_word: ζῆλος
  choice: ekworo
  rationale: N’usoro omume ọjọọ a, okwu ahụ nwere nghọta na-adịghị mma, ọ bụghị ịnụ ọkụ n’obi ọma.
- source_word: θυμοί
  choice: iwe ọkụ
  rationale: Na-egosipụta iwe na-apụta n’ike ma ọ bụ ugboro ugboro, dịka plural Grik si kwado.
- source_word: ἐριθεῖαι
  choice: ọchịchọ ibuli onwe onye elu
  rationale: Na-egosipụta ọchịchọ nke ọdịmma na ọkwa onwe onye nke na-akpata ịsọ mpi na nkewa.
- source_word: καταλαλιαί
  choice: nkwutọ
  rationale: Na-ezo aka n’okwu e ji emebi aha onye ọzọ.
- source_word: ψιθυρισμοί
  choice: ịgba asịrị
  rationale: Na-egosipụta okwu nzuzo ma ọ bụ asịrị a na-ekwu nwayọọ iji mebie onye ọzọ; a kọwara ọdịiche ahụ n’ala peeji.
- source_word: φυσιώσεις
  choice: mpako
  rationale: Na-egosipụta ịfụli onwe elu ma ọ bụ echiche onwe onye karịrị akarị.
- source_word: ἀκαταστασίαι
  choice: ọgba aghara
  rationale: Na-egosipụta enweghị usoro na ọgba aghara n’obodo.
theological_decisions:
- issue: Ụda nke nzute Pọl na-atụ egwu ya
  choice: E debere egwu nke enweghị afọ ojuju n’akụkụ abụọ na ndepụta omume ọjọọ dị n’obodo.
  alternative: Ịkọwa ya hoo haa dị ka egwu Pọl na-atụ maka iji ike onyeozi taa ha ahụhụ, ma ọ bụ dị ka mmetụta ndị ozizi ụgha kpọmkwem.
  rationale: Amaokwu ahụ n’onwe ya na-ekwu maka Pọl na ha enweghị mmasị n’ihe ha ga-ahụ n’ebe ibe ha nọ, wee depụta mmehie mmekọrịta; ọ naghị ekpebi kpọmkwem ihe kpatara ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E zere okwu ụka pụrụ iche na nkọwa na-etinye ihe amaokwu ahụ ekwughị. Akara ala peeji [a] dị n’isi ederede.
