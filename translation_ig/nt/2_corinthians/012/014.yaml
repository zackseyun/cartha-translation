  to: Lee, nke a bụ ugboro nke atọ m dị njikere ịbịakwute unu,[a] agaghịkwa m abụrụ unu ibu arọ.[b] N’ihi na ọ bụghị ihe unu nwere ka m na-achọ, kama ọ bụ unu onwe unu. N’ihi na ụmụ ekwesịghị ịkpakọba akụ maka nne na nna ha, kama nne na nna kwesịrị ịkpakọba akụ maka ụmụ ha.
