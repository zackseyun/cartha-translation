review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly preserves the main contrasts: Paul''s third present readiness to come, his refusal to burden the Corinthians, his seeking them rather than their possessions, and the parent–child analogy. However, the construction “ọ bụghị ụmụ ka ọ dịịrị ... kama ọ bụ ndị mụrụ ụmụ ka ọ dịịrị” is unnatural and weakens the explicit sense of obligation in ὀφείλει. A direct ‘should/are obligated to’ construction is needed.'
  naturalness: Most of the wording is clear Standard Igbo, but the final sentence is not idiomatic in its use of “ọ dịịrị” with the paired subjects. “Nke a bụ nke ugboro atọ m dị njikere” is understandable but is smoother as “nke a bụ ugboro nke atọ m dị njikere.”
  terminology: “Lee,” “ibu arọ,” and “ihe unu nwere” are suitable. “Nne na nna” is clearer and fully inclusive for γονεῖς than the potentially elliptical “ndị mụrụ ha / ndị mụrụ ụmụ.” “Ịkpakọba akụ” more naturally conveys θησαυρίζειν in this material-support analogy than the broad “ịkpakọba ihe.”
  issues:
  - severity: medium
    issue: The final parent–child sentence uses an unnatural obligation construction.
    rationale: Greek ὀφείλει states that children are not obligated to store up, whereas parents are. “Ụmụ ekwesịghị ... kama nne na nna kwesịrị ...” expresses this contrast plainly and naturally in Standard Igbo.
  - severity: low
    issue: The terms for parents and for storing up can be made more precise and idiomatic.
    rationale: “Nne na nna” clearly represents the inclusive Greek γονεῖς, and “ịkpakọba akụ” appropriately conveys storing up resources in the proverb-like financial context.
  revised_text: Lee, nke a bụ ugboro nke atọ m dị njikere ịbịakwute unu,[a] agaghịkwa m abụrụ unu ibu arọ.[b] N’ihi na ọ bụghị ihe unu nwere ka m na-achọ, kama ọ bụ unu onwe unu. N’ihi na ụmụ ekwesịghị ịkpakọba akụ maka nne na nna ha, kama nne na nna kwesịrị ịkpakọba akụ maka ụmụ ha.
