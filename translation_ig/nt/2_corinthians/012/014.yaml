id: 2CO.12.14
reference: 2 Corinthians 12:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: ig
  text: Lee, nke a bụ ugboro nke atọ m dị njikere ịbịakwute unu,[a] agaghịkwa m abụrụ unu ibu arọ.[b] N’ihi na ọ bụghị ihe unu nwere ka m na-achọ, kama ọ bụ unu onwe unu. N’ihi na ụmụ ekwesịghị ịkpakọba akụ maka nne na nna ha, kama nne na nna kwesịrị ịkpakọba akụ maka ụmụ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Enwere ike ịsụgharị ya n’ụzọ na-esochi usoro okwu Grik karịa: “nke ugboro atọ a ka m dị njikere ịbịakwute unu.”'
    reason: lexical_alternative
  - marker: b
    text: Ngwaa a sụgharịrị “ịbụ unu ibu arọ” nwere ike ịpụta itinye mmadụ n’ọnọdụ ịkwado onye ọzọ n’ego.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu Igbo dị nfe ma dịkwa nsọpụrụ e ji adọta uche onye na-ege ntị.
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν
  choice: nke a bụ nke ugboro atọ m dị njikere ịbịakwute unu
  rationale: Ọ na-egosipụta ugboro atọ nke ịdị njikere Pọl ịbịa, n’enweghị ikwubi hoo haa na ọ bịalarị ugboro abụọ.
- source_word: καταναρκήσω
  choice: agaghịkwa m abụrụ unu ibu arọ
  rationale: Akpaalaokwu a na-egosi na Pọl agaghị ebokwasị ha ibu, karịchaa n’ihe gbasara ego na nkwado.
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: ọ bụghị ihe unu nwere ka m na-achọ, kama ọ bụ unu onwe unu
  rationale: Ọ na-echekwa ọdịiche dị n’etiti ihe ha nwere na ha onwe ha, ma mee ka nkwusi ike dị na ὑμᾶς pụta ìhè.
- source_word: ὀφείλει
  choice: ọ dịịrị
  rationale: N’Igbo nkịtị, ‘ọ dịịrị’ na-egosi ọrụ ma ọ bụ ibu ọrụ mmadụ kwesịrị ịrụ.
- source_word: θησαυρίζειν
  choice: ịkpakọba ihe
  rationale: Ọ na-echekwa echiche nke ịchịkọta ma chekwaa ihe maka onye ọzọ, na-amanyeghị na ọ bụ naanị akụ ma ọ bụ ego.
- source_word: γονεῦσιν / γονεῖς
  choice: ndị mụrụ ha / ndị mụrụ ụmụ
  rationale: Okwu ndị a gụnyere nne na nna ma zere ime ka ọ bụrụ naanị otu okike.
- source_word: τέκνα / τέκνοις
  choice: ụmụ / ụmụ ha
  rationale: Ọ dabara na okwu Grik nke na-ekwu maka ụmụ n’ozuzu ha.
theological_decisions:
- issue: Ihe okwu ‘nke ugboro atọ’ pụtara banyere njem Pọl
  choice: E jikọtara ‘nke ugboro atọ’ na ịdị njikere ya ịbịa.
  alternative: Ịsị na nke a bụ nleta ya nke atọ, dị ka ihe doro anya na ọ bịalarị ugboro abụọ.
  rationale: Usoro okwu Grik nwere ike imetụta akụkọ njem a n’ụzọ dị iche iche; nsụgharị a na-ejide ihe amaokwu ahụ kwuru kpọmkwem ma ghara idozi ihe na-edoghị anya.
- issue: Ụdị ibu arọ Pọl kwuru maka ya
  choice: E debere ya n’ahụ amaokwu dịka ‘ibu arọ,’ ma kọwaa akụkụ ego na ndetu ala peeji.
  alternative: Ịsụgharị ya ozugbo dịka ‘agaghị m eri unu ego.’
  rationale: Okwu Grik nwere echiche nke ibokwasị mmadụ ibu, nke nwere ike ịbụ nke ego n’ọnọdụ a; isi amaokwu ahụ na-echekwa obosara okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. E ji ‘unu’ mee ka ọnụọgụ nke ndị a na-agwa doo anya; a zere okwu ụka pụrụ iche na nkọwa karịrị ihe isi mmalite kwuru.
