id: 2CO.12.2
reference: 2 Corinthians 12:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: ig
  text: Amaara m otu nwoke nọ n’ime Mesaịa[a], onye, afọ iri na anọ gara aga—ma ọ̀ bụ n’ahụ ka ọ nọ, amaghị m; ma ọ̀ bụ n’èzí ahụ ka ọ nọ, amaghị m; Chineke maara[b]—e buliri ruo n’eluigwe nke atọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ ọdịnala, “n’ime Kraịst.” Okwu Grik bụ ἐν Χριστῷ; “Mesaịa” na-egosipụta na ọ bụ utu aha.
    reason: alternative_reading
  - marker: b
    text: Pọl ekwughị ma ihe a mere n’ahụ ka ọ bụ n’èzí ahụ. Ederede ahụ hapụrụ ụzọ ahụmahụ ahụ si mee n’enweghị mkpebi.
    reason: lexical_alternative
  - marker: c
    text: “Eluigwe nke atọ” bụ okwu e ji ekwu banyere eluigwe n’echiche ndị Juu oge ochie. A hapụrụ okwu ahụ otú ahụ kama ịkọwa ya ozugbo dị ka eluigwe kachasị elu ma ọ bụ paradaịs.
    reason: cultural_note
lexical_decisions:
- source_word: οἶδα
  choice: Amaara m
  rationale: Ọdịdị perfect nke οἶδα nwere nghọta nke oge ugbu a n’asụsụ Grik Koine; “Amaara m” bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: ἄνθρωπον
  choice: otu nwoke
  rationale: Okwu ahụ bụ masculine singular ma na-ekwu maka otu nwoke a kapịrị ọnụ; “otu nwoke” na-egosipụta nke a n’ụzọ doro anya.
- source_word: ἐν Χριστῷ
  choice: n’ime Mesaịa
  rationale: Χριστός bụ utu aha ebe a. “Mesaịa” na-edebe ihe utu aha ahụ pụtara, ebe “n’ime” na-echekwa ụdị okwu Pọl ji akọ njikọ onye kwere ekwe na Mesaịa.
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: afọ iri na anọ gara aga
  rationale: Nke a bụ okwu oge dị ire ma bụrụkwa Igbo nkịtị maka πρό na genitive nke oge.
- source_word: εἴτε ἐν σώματι
  choice: ma ọ̀ bụ n’ahụ ka ọ nọ
  rationale: Nke a na-edebe ajụjụ Pọl hapụrụ n’enweghị mkpebi, ma mee ka okwu ahụ daba n’usoro Igbo.
- source_word: ἐκτὸς τοῦ σώματος
  choice: ma ọ̀ bụ n’èzí ahụ
  rationale: “N’èzí ahụ” na-egosipụta kpọmkwem ọdịiche ya na “n’ahụ,” n’ebughị ụzọ kọwaa ụdị ahụmahụ ahụ.
- source_word: ὁ θεὸς οἶδεν
  choice: Chineke maara
  rationale: Nke a na-asụgharị ahịrịokwu Grik ahụ ozugbo; etinyeghị “naanị” n’ihi na okwu ahụ adịghị na isi mmalite.
- source_word: ἁρπαγέντα
  choice: e buliri
  rationale: Passive “e buliri” na-agụ nke ọma n’Igbo ma na-egosipụta na ihe ahụ mere nwoke ahụ, n’agbanyeghị na onye mere ya ekwughị kpọmkwem n’ahịrịokwu a.
- source_word: τὸν τοιοῦτον
  choice: onye
  rationale: Relative “onye” na-ejikọta nwoke ahụ e kwuru na mbụ na ihe mere ya n’ụzọ Igbo dị mfe; onye a ka bụ otu onye ahụ, ọ bụghị onye ọzọ.
- source_word: ἕως τρίτου οὐρανοῦ
  choice: ruo n’eluigwe nke atọ
  rationale: “Ruo” na-echekwa nghọta nke ἕως, ebe “eluigwe nke atọ” na-edebe okwu ọnụ ọgụgụ ahụ n’enweghị ịkọwa ya ọzọ n’ime amaokwu.
theological_decisions:
- issue: Otú e si asụgharị Χριστῷ n’okwu ἐν Χριστῷ
  choice: n’ime Mesaịa
  alternative: n’ime Kraịst
  rationale: A sụgharịrị Χριστός dị ka utu aha “Mesaịa” ka ihe ọ pụtara ghara ifu; e debere “n’ime” iji ghara ịgbanwe okwu njikọ Pọl ji mee ihe ka ọ bụrụ nkọwa.
- issue: Ma ahụmahụ ahụ mere n’ahụ ka ọ bụ n’èzí ahụ
  choice: E debere amaghị ama Pọl kwuru ugboro abụọ
  alternative: Ịkọwa ya dị ka nrịgo n’ahụ ma ọ bụ ọhụụ n’enweghị ahụ
  rationale: 'Isi mmalite ekpebighị okwu ahụ: Pọl kwuru ugboro abụọ na ya amaghị, wee sị na Chineke maara. Ya mere, nsụgharị ahụ ekwesịghị ikpebi ihe ederede ahụ hapụrụ ghe oghe.'
- issue: Ihe “eluigwe nke atọ” pụtara
  choice: E debere okwu ahụ dịka “eluigwe nke atọ”
  alternative: eluigwe kachasị elu ma ọ bụ paradaịs
  rationale: Amaokwu ahụ ji okwu omenala oge ahụ mee ihe. Ịgbanwe ya ozugbo ka ọ bụrụ otu nkọwa pụrụ iche ga-ewepụ nghọta ndị ọzọ okwu ahụ nwere ike ibu.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A haziri nkebi etiti ahụ na akara ogologo iji chekwaa nkwụsị na amaghị ama dị n’usoro Grik, ma zere okwu ụka nke otu òtù pụrụ iche.
