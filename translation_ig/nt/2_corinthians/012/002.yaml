    rationale: “ma ọ̀ bụ n’èzí ahụ, amaghị m” is understandable, but “ma ọ̀ bụ n’èzí ahụ ka ọ nọ, amaghị m” is more parallel with “ma ọ̀ bụ n’ahụ ka ọ nọ” and more clearly retains Paul's precise unresolved contrast.
