  text: καὶ οἶδα τὸν τοιοῦτον ἄνθρωπον— εἴτε ἐν σώματι εἴτε ⸀χωρὶς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/003.yaml
  text: And I know such a man—whether in the body or apart from the body I do not know[a]; God knows—
translation:
  language: ig
  text: Ama m nwoke dị otu a—ma ọ̀ bụ n’ime ahụ́ ma ọ̀ bụ n’enweghị ahụ́, amaghị m; Chineke maara—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶδα
  choice: ama m / maara
  rationale: 'A sụgharịrị ya dịka okwu ọmụma nkịtị n’Igbo, ma chekwaa nkwughachi ya: Pọl maara, amaghịkwa ya, Chineke amarakwa.'
- source_word: τὸν τοιοῦτον ἄνθρωπον
  choice: nwoke dị otu a
  rationale: Nke a na-echekwa ụdị nwoke otu onye dị na Grik na ụzọ Pọl si zoo aka n’onwe ya n’enweghị ịkpọ ya aha kpọmkwem.
- source_word: εἴτε ... εἴτε
  choice: ma ọ̀ bụ ... ka ọ̀ bụ
  rationale: Nke a bụ ụzọ Igbo si egosi nhọrọ abụọ a na-amaghị nke bụ eziokwu.
- source_word: ἐν σώματι
  choice: n’ime ahụ́
  rationale: Ọ na-echekwa echiche nke ịnọ n’ahụ́ ma na-adịkwa mfe nghọta n’Igbo.
- source_word: χωρὶς τοῦ σώματος
  choice: n’azụghị ahụ́
  rationale: Ọ na-egosi ịdị iche ma ọ bụ ịnọ n’enweghị ahụ́, ma ọ naghị akọwapụta ụdị ọnọdụ ime mmụọ ahụ karịa ihe Grik kwuru.
- source_word: οὐκ οἶδα, ὁ θεὸς οἶδεν
  choice: amaghị m; Chineke maara
  rationale: Nke a na-echekwa ọdịiche siri ike dị n’etiti amaghị Pọl na ịma Chineke.
- source_word: θεὸς
  choice: Chineke
  rationale: Nke a bụ okwu Igbo ọkọlọtọ maka Chineke.
theological_decisions:
- issue: Ụzọ Pọl si zoo aka n’onwe ya na ụdị ahụmahụ ahụ
  choice: E debere okwu onye nke atọ, “nwoke dị otu a,” ma hapụkwa ya n’amaghị ama ma ahụmahụ ahụ mere n’ime ahụ́ ka ọ bụ n’azụghị ahụ́.
  alternative: Ịsị kpọmkwem na nwoke ahụ bụ Pọl, ma ọ bụ ịkọwa ya dịka ahụmahụ nke mkpụrụ obi pụrụ n’ahụ́.
  rationale: Grik ahụ na-edobe anya dị n’etiti onye na-ekwu okwu na nwoke ahụ, ma ọ naghị ekpebi ma ahụmahụ ahụ ọ bụ nke anụ ahụ ma ọ bụ nke na-enweghị ahụ́. Nsụgharị ahụ ekwesịghị idozi ihe ederede hapụrụ n’amaghị ama.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke ugwu ma dị mfe nghọta. Akara nkwụsị na-echekwa ahịrịokwu a dịka nke gara n’ihu site n’amaokwu gbara ya gburugburu, ebe akara ogologo na-egosi nkwụsị echiche Pọl.
