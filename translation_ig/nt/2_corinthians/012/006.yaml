revisions:
- from: N’ihi na ọ bụrụ na m achọọ ịnya isi, agaghị m abụ onye nzuzu, n’ihi na m ga-ekwu eziokwu. Ma ana m ejide onwe m, ka onye ọ bụla ghara iche banyere m karịa ihe ọ na-ahụ n’ime m ma ọ bụ ihe ọ na-anụ n’ọnụ m.[a]
  to: N’ihi na ọ bụrụ na m achọọ ịnya isi, agaghị m abụ onye nzuzu, n’ihi na m ga-ekwu eziokwu. Ma ana m ejide onwe m, ka onye ọ bụla ghara ịtụle m karịa ihe ọ na-ahụ n’ime m ma ọ bụ ihe ọ bụla ọ na-anụ site n’aka m.
  rationale: The revision strengthens the evaluative sense of λογίσηται, removes the unwarranted narrowing of ἐξ ἐμοῦ to speech from Paul’s mouth, and expresses the explicit indefinite τι directly. Since the text now includes the indefinite element, the former alternative-rendering footnote is unnecessary.
