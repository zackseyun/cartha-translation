id: 2CO.12.6
reference: 2 Corinthians 12:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na m achọọ ịnya isi, agaghị m abụ onye nzuzu, n’ihi na m ga-ekwu eziokwu. Ma ana m ejide onwe m, ka onye ọ bụla ghara ịtụle m karịa ihe ọ na-ahụ n’ime m ma ọ bụ ihe ọ bụla ọ na-anụ site n’aka m.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θελήσω
  choice: ọ bụrụ na m achọọ
  rationale: Njikọ ἐὰν na aorist subjunctive na-egosi ọnọdụ nwere ike ime; ‘ọ bụrụ na m achọọ’ na-egosipụta nke a nke ọma n’Igbo.
- source_word: καυχήσασθαι
  choice: ịnya isi
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ịnya isi ma ọ bụ ikwu ihe e ji onwe mmadụ eme ọnụ; ọ dabara n’ọnọdụ Pọl ji okwu ahụ n’ụzọ nwere ntakịrị ịkwa emo.
- source_word: ἄφρων
  choice: onye nzuzu
  rationale: Ọ na-edobe echiche nke enweghị uche ma na-agụkwa nke ọma dịka aha na-esochi ‘ịbụ’ n’Igbo.
- source_word: ἀλήθειαν ... ἐρῶ
  choice: m ga-ekwu eziokwu
  rationale: Ọ na-edobe ọdịnihu nke ἐρῶ ma na-egosi na ihe Pọl ga-ekwu n’ọnọdụ ahụ ga-abụ eziokwu.
- source_word: φείδομαι
  choice: ana m ejide onwe m
  rationale: N’ebe a, ngwaa ahụ pụtara na Pọl na-akwụsị onwe ya, ya bụ, na ọ naghị aga n’ihu n’ịnya isi.
- source_word: λογίσηται
  choice: iche banyere m
  rationale: N’ọnọdụ a, λογίζομαι bụ ịtụle ma ọ bụ ikpebi echiche mmadụ nwere banyere Pọl; okwu a bụ nke doro ndị na-agụ Igbo anya.
- source_word: ὑπὲρ ὃ
  choice: karịa ihe
  rationale: Ọ na-egosipụta ịgafe oke nke ihe mmadụ hụrụ ma ọ bụ nụrụ, dịka ὑπέρ si arụ ọrụ ebe a.
- source_word: βλέπει με
  choice: ihe ọ na-ahụ n’ime m
  rationale: Ọ na-egosi na a ga-atụle Pọl site n’ihe a na-ahụ n’omume na ndụ ya, na-agbakwụnyeghị nkọwa ozizi.
- source_word: ἀκούει τι ἐξ ἐμοῦ
  choice: ihe ọ na-anụ n’ọnụ m
  rationale: Nke a bụ ụzọ Igbo dị ndụ si egosi ihe mmadụ nụrụ Pọl n’onwe ya kwuru, ma na-edobekwa ihe na-akọwaghị kpọmkwem nke τι.
theological_decisions:
- issue: Okwu Pọl banyere ịnya isi na ijide onwe ya
  choice: E gosiri na ọ bụrụ na Pọl ahọrọ ịnya isi, ihe ọ ga-ekwu ga-abụ eziokwu; ma ọ ka jidere onwe ya ka ndị ọzọ ghara ibuli ya elu karịa ihe ha hụrụ ma nụ.
  alternative: Ịsụgharị ya ka ọ na-ekwu na ịnya isi ziri ezi mgbe niile, ma ọ bụ na ịnya isi ọ bụla ebe a bụ ụgha ma bụrụ mmehie.
  rationale: 'Grik ahụ na-edobe esemokwu ahụ: Pọl kwuru na ọ gaghị abụ onye nzuzu n’ihi na ọ ga-ekwu eziokwu, ma ọ jụkwara ịga n’ihu ka e wee ghara ịtụle ya gabiga ihe a pụrụ ịhụ ma nụ. Nsụgharị ahụ anaghị edozi esemokwu a n’ụzọ otu ozizi pụrụ iche.'
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. ‘Ịnya isi’ na ‘ijide onwe m’ bụ okwu nkịtị ma dabara na ụda Pọl nke ikwu ihe banyere onwe ya n’achọghị ime otú ahụ. E debere akara nkọwa ụkwụ [a] kpọmkwem n’ebe okwu ọ na-akọwa dị.
