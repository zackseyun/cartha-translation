  to: N’ihi ya, ana m enwe obi ụtọ n’adịghị ike, na mkparị, na ihe isi ike, na mkpagbu na nrụgide, n’ihi Mesaịa[a]; n’ihi na mgbe m na-adịghị ike, ọ bụ mgbe ahụ ka m dị ike.
