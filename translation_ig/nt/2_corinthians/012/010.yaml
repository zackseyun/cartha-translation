id: 2CO.12.10
reference: 2 Corinthians 12:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: ig
  text: N’ihi ya, ana m enwe obi ụtọ n’adịghị ike, na mkparị, na ihe isi ike, na mkpagbu na nrụgide, n’ihi Mesaịa[a]; n’ihi na mgbe m na-adịghị ike, ọ bụ mgbe ahụ ka m dị ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dị ka a na-asụkarị, “n’ihi Kraịst.”
    reason: Nsụgharị ọdịnala ọzọ nke Χριστοῦ.
lexical_decisions:
- source_word: διὸ
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu Pọl si n’ihe o kwuru tupu nke a nweta.
- source_word: εὐδοκῶ
  choice: ana m enwe obi ụtọ
  rationale: Na-egosi na Pọl ji obi ọma nabata ọnọdụ ndị a, ọ bụghị naanị na ọ na-edi ha; nke a na-edobekwa ihe mgbagwoju anya dị n’okwu ya.
- source_word: ἐν ἀσθενείαις
  choice: n’adịghị ike
  rationale: Na-edobe echiche sara mbara banyere enweghị ume ma ọ bụ ike, n’emeghị ka ọ bụrụ naanị ọrịa anụ ahụ.
- source_word: ἐν ὕβρεσιν
  choice: na mkparị
  rationale: Na-egosi okwu ma ọ bụ omume ihere na mmegbu e mere mmadụ.
- source_word: ἐν ἀνάγκαις
  choice: na ihe isi ike
  rationale: Na-enye echiche nke ọnọdụ ndị na-amanye ma na-esiri mmadụ ike n’ụzọ Igbo nke oge a na-aghọta nke ọma.
- source_word: ἐν διωγμοῖς
  choice: na mkpagbu
  rationale: Na-akọwa mmegide na ahụhụ a na-eme mmadụ n’ihi okwukwe ya.
- source_word: καὶ στενοχωρίαις
  choice: na ọnọdụ mkpagide
  rationale: Na-echekwa ihe oyiyi nke ịbụ onye nrụgide na mkpagide gbara gburugburu, ma dị iche ntakịrị na ‘ihe isi ike.’
- source_word: ὑπὲρ Χριστοῦ
  choice: n’ihi Mesaịa
  rationale: ὑπέρ ebe a na-egosi ihe kpatara ahụhụ ndị ahụ na onye a na-ata ha n’ihi ya; ‘Mesaịa’ na-edobe Χριστός dị ka utu aha.
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: n’ihi na mgbe m na-adịghị ike
  rationale: Na-egosipụta ọnọdụ oge nke na-eme ugboro ugboro n’asụsụ Igbo dị mfe.
- source_word: τότε δυνατός εἰμι
  choice: ọ bụ mgbe ahụ ka m dị ike
  rationale: Usoro ‘ọ bụ…ka’ na-emesi τότε ike ma na-edobe mmegide doro anya n’etiti adịghị ike na ịdị ike.
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka nwere ike ịrụ ọrụ dị ka utu aha; ‘Mesaịa’ na-eme ka ọrụ ahụ pụta ìhè, ebe e debere okwu ọdịnala ‘Kraịst’ n’okpuru peeji.
- issue: Ihe Pọl bu n’obi mgbe ọ sịrị na ọ dị ike
  choice: E debere okwu ahụ n’enweghị ịkọwa onye ma ọ bụ ihe na-enye ike ahụ n’amaokwu a.
  alternative: Ịgbakwunye ‘site n’ike Kraịst’ ma ọ bụ nkọwa yiri ya.
  rationale: N’agbanyeghị na amaokwu ndị gbara ya gburugburu na-enye ihe ndabere, okwu Grik a n’onwe ya na-ekwu naanị ‘mgbe ahụ ka m dị ike’; ịgbakwunye nkọwa ga-ewepụ mkpakọrịta echiche Pọl hapụrụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E jigidere usoro ndepụta na mmegide dị n’etiti ‘adịghị ike’ na ‘dị ike,’ ma zere okwu ụka pụrụ iche na nkọwa agbakwunyere.
