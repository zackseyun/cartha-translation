source:
  edition: SBLGNT
  text: ἔστω δέ, ἐγὼ οὐ κατεβάρησα ὑμᾶς· ἀλλὰ ὑπάρχων πανοῦργος δόλῳ ὑμᾶς ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: ig
  text: 'Ma ka e were ya na ọ dị otú ahụ: enyeghị m unu ibu arọ[a]. Ma, n’ịbụ onye aghụghọ[b], ejiri m aghụghọ ghọgbuo unu[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘Ka o sina dị’ ma ọ bụ ‘Ma ka e were ya na ọ dị otú ahụ’; o yiri ka Pọl na-anabata echiche ahụ naanị maka arụmụka.
    reason: lexical_alternative
  - marker: b
    text: Okwu ndị a nwere ike ịbụ ebubo Pọl na-ekwughachi n’ụzọ ịkwa emo, ọ bụghị nkwupụta na o mere aghụghọ n’ezie.
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsụgharị ya, ‘ejidere m unu n’aghụghọ’ ma ọ bụ ‘ejiri m aghụghọ dọta unu n’ọnyà.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω δέ
  choice: Ma ka ọ dị otú ahụ
  rationale: 'Nke a na-egosipụta nkwenye e nyere naanị maka arụmụka: ‘ka e were ya na ọ dị otú ahụ,’ n’enweghị ịkọwa okwu ahụ gabiga ókè.'
- source_word: κατεβάρησα
  choice: enyeghị m unu ibu arọ
  rationale: Ọ na-echekwa ihe atụ nke ibu arọ, ma n’ọnọdụ a ọ na-ezo aka karịsịa n’ịghara ịdakwasị ndị Kọrịnt mkpa ihe onwunwe ma ọ bụ ego.
- source_word: ὑπάρχων
  choice: ebe m bụ
  rationale: Ọ na-edobe participle ahụ dịka ọnọdụ gbara okwu isi gburugburu, n’enweghị ikpebi ma ọ pụtara ‘n’ihi na’ ka ọ bụ ‘ọ bụ ezie na.’
- source_word: πανοῦργος
  choice: onye aghụghọ
  rationale: Okwu a nwere echiche ọjọọ nke onye ji amamihe aghụghọ eme atụmatụ; nsụgharị a bụ nke ndị Igbo taa na-aghọta ngwa ngwa.
- source_word: δόλῳ
  choice: ejiri m aghụghọ
  rationale: Ọ na-egosi aghụghọ dịka ụzọ e si mee ihe ahụ, dịka instrumental dative dị n’asụsụ Grik.
- source_word: ἔλαβον
  choice: nweta unu
  rationale: ‘Nweta’ na-anọ nso n’echiche sara mbara nke λαμβάνω, ebe ‘ejiri m aghụghọ’ na-eme ka ebubo nke ijide ma ọ bụ irigbu mmadụ pụta ìhè n’enweghị itinye nkọwa ahụ niile n’ime ngwaa.
theological_decisions:
- issue: Ma okwu Pọl mgbe ἀλλὰ gasịrị bụ nkwupụta mmehie ya n’ezie, ka ọ bụ ikwughachi ebubo ndị ọzọ boro ya n’ụzọ ịkwa emo
  choice: E depụtara okwu ahụ kpọmkwem—‘ebe m bụ onye aghụghọ, ejiri m aghụghọ nweta unu’—ma kọwaa ọnọdụ ikwu okwu ya n’ala ala peeji.
  alternative: ‘Ma, dịka onye aghụghọ, ejidere m unu n’aghụghọ,’ ma ọ bụ ‘ejiri m aghụghọ rigbuo unu.’
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi na Pọl na-agọnahụ na ọ rigburu ha; ya mere okwu a yiri ka ọ bụ ebubo ọ na-ekwughachi n’ụzọ ịkwa emo. Isi ederede na-echekwa esemokwu okwu ahụ, kama idozi ya n’ime nsụgharị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ibu arọ’ na-echekwa ihe atụ Grik, ebe nkọwa ala ala peeji na-eme ka nkwenye maka arụmụka na ụda ịkwa emo pụta ìhè. E tinyere akara ala ala peeji niile [a], [b], na [c] n’isi ederede.
