revisions:
- from: 'Ma ka ọ dị otú ahụ: enyeghị m unu ibu arọ[a]. Ma ebe m bụ onye aghụghọ[b], ejiri m aghụghọ nweta unu[c].'
  to: 'Ma ka e were ya na ọ dị otú ahụ: enyeghị m unu ibu arọ[a]. Ma, n’ịbụ onye aghụghọ[b], ejiri m aghụghọ ghọgbuo unu[c].'
  rationale: 'The revision keeps the Greek syntax and ambiguity as far as natural Igbo permits: Paul concedes the preceding point rhetorically, denies burdening them, and then voices the charge of craftiness and deceit. Replacing “nweta unu” avoids an unintended sense of possessing or acquiring people. The note continues to identify the likely irony without making it part of the main text.'
