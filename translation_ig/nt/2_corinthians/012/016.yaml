review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Paul’s concessive denial that he did not burden the Corinthians and preserves the accusatory wording of the second clause without turning it into a direct confession. However, “nata unu”/“nweta unu” (“obtain you”) does not naturally convey λαμβάνω here in reference to persons and can suggest acquiring people rather than catching or deceiving them by a stratagem.
  naturalness: “Ma ka ọ dị otú ahụ” is understandable but is less idiomatic than a concessive formulation such as “Ma ka e were ya na ọ dị otú ahụ.” The revised second clause uses ordinary, clear Igbo for the rhetorical accusation.
  terminology: “Ibu arọ” appropriately preserves the burden metaphor. “Onye aghụghọ” and “aghụghọ” accurately retain the negative force of πανοῦργος and δόλῳ. The irony remains explained in a footnote rather than imposed on the text.
  issues:
  - severity: medium
    issue: “ejiri m aghụghọ nweta unu” is semantically and idiomatically unsuitable.
    rationale: In Standard Igbo, nweta mmadụ normally means obtaining/acquiring a person and does not adequately express the hostile, stratagem-based sense of ἔλαβον in this context. “ghọgbuo unu” naturally expresses the asserted deception while retaining the rhetorical force.
  - severity: low
    issue: The main rendering of ἔστω δέ is somewhat stiff.
    rationale: “Ma ka e were ya na ọ dị otú ahụ” more clearly and idiomatically expresses Paul’s concessive, for-the-sake-of-argument transition.
