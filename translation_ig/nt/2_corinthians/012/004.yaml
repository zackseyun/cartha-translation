id: 2CO.12.4
reference: 2 Corinthians 12:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: ig
  text: na e buliri ya gaa na paradaịs, ebe ọ nụrụ okwu ndị a na-apụghị ikwupụta, ndị a na-adịghị ekwe ka mmadụ kwuo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: a dọọrọ ya rigoro
  rationale: Na-egosi omume e mere ya n’ike, ọ bụghị na ọ rịgoro n’onwe ya; “rigoro” na-echekwa echiche nke ibuli ya elu.
- source_word: παράδεισον
  choice: paradaịs
  rationale: Ntụgharị a maara nke ọma na Standard Igbo, ma ọ naghị akọwa kpọmkwem ihe paradaịs ahụ bụ karịa ka Grik si mee.
- source_word: ἄρρητα ῥήματα
  choice: okwu ndị a na-apụghị ikwupụta
  rationale: Na-echekwa echiche nke okwu ndị mmadụ na-enweghị ike ịkọpụta, ma ahịrịokwu na-esote na-agbakwụnye echiche nke enweghị ikike ikwu ha.
- source_word: οὐκ ἐξὸν
  choice: na-ekwesịghị
  rationale: Na-egosi na ekweghị mmadụ ka o kwuo ha, ọ bụghị naanị na ọ gaghị enwe ike ime ya.
- source_word: ἀνθρώπῳ
  choice: ndị mmadụ
  rationale: N'ebe a okwu ahụ na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị nwoke kpọmkwem; ọtụtụ ọnụ na-eme ka nke a doo anya n’Igbo.
theological_decisions:
- issue: Ma ἄρρητα ọ pụtara ihe a na-apụghị ikwu n’ihi enweghị ike ma ọ bụ n’ihi na a machibidoro ya
  choice: okwu ndị a na-apụghị ikwupụta, bụ́ ndị mmadụ na-ekwesịghị ikwu
  alternative: okwu a na-apụghị ịkọwa, nke e kweghị ka mmadụ kwuo
  rationale: 'E debere nkewa dị n’etiti ἄρρητα na οὐκ ἐξὸν: nke mbụ na-akọwa okwu ndị ahụ dị ka ndị a na-apụghị ikwupụta, nke abụọ na-ekwu na mmadụ ekwesịghị ikwu ha. A naghị eme ka ha bụrụ naanị otu echiche.'
- issue: Ihe paradaịs pụtara n’ebe a
  choice: paradaịs
  alternative: ogige paradaịs / eluigwe
  rationale: A hapụrụ okwu ahụ n’ụdị sara mbara nke Grik; ịsụgharị ya kpọmkwem dịka “eluigwe” ga-emechi nghọta nke ederede ahụ n’enweghị mkpa.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “a dọọrọ ya rigoro” gosipụta passive aorist na omume ibuli n’ike; e jiri “ndị mmadụ” zere ime ἀνθρώπῳ ka ọ bụrụ naanị nwoke.
