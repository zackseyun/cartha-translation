id: 2CO.12.12
reference: 2 Corinthians 12:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὰ μὲν σημεῖα τοῦ ἀποστόλου κατειργάσθη ἐν ὑμῖν ἐν πάσῃ ⸀ὑπομονῇ, σημείοις ⸀τε καὶ τέρασιν καὶ δυνάμεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: ig
  text: N’ezie, e mere ihe ịrịba ama ndị e ji amata onyeozi[a] n’etiti unu na ntachi obi niile, nakwa site n’ihe ịrịba ama, ihe ebube, na ọrụ ndị dị ike[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ihe ịrịba ama nke onyeozi ahụ,” ma ọ bụrụ na okwu a na-ezo aka kpọmkwem na Pọl kama n’ihe e ji amata onyeozi n’ozuzu ya.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịtụgharị “ọrụ ndị dị ike” dịka “ọrụ ebube” ma ọ bụ “ọrụ ike.” Okwu Grik ahụ na-ekwu maka omume na-egosipụta ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: N’ezie, ... ihe ịrịba ama
  rationale: μέν na-enye nkwenye ma ọ bụ nkwusi ike n’ebe a, ọ bụ ezie na δέ esoghị ya n’amaokwu a. “N’ezie” na-egosipụta nkwusi ike ahụ n’Igbo dị mfe, ebe “ihe ịrịba ama” na-edobe echiche σημεῖα.
- source_word: τοῦ ἀποστόλου
  choice: ndị e ji amata onyeozi
  rationale: Genitive a nwere ike igosi ihe ndị e ji mara onyeozi n’ozuzu ya. Nhọrọ a na-egosi ọrụ qualitative/generic nke okwu ahụ ma ghara imechi ohere na ọ pụrụ izo aka n’ebe Pọl nọ kpọmkwem.
- source_word: κατειργάσθη
  choice: e mere
  rationale: Aorist passive ahụ na-egosi na e mezuru ma ọ bụ rụọ ihe ịrịba ama ndị a. “E mere” bụ Igbo ebumpụta ụwa nke na-edobe passive ahụ n’ebughị ụzọ kọwaa onye mere ha.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ihe mere n’ime ọgbakọ ndị Kọrịnt na n’ihu ha, ọ bụghị n’ime obi ha.
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: site na ntachi obi zuru ezu
  rationale: ὑπομονή bụ ịnọgidesi ike n’okpuru ihe isi ike. “Ntachi obi zuru ezu” na-egosipụta πάσῃ ma na-eme ka àgwà ozi Pọl pụta ìhè.
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: nakwa site n’ihe ịrịba ama na ihe ebube na ọrụ ndị dị ike
  rationale: 'A hapụrụ akụkụ atọ nke usoro Grik ahụ iche: σημεῖα bụ “ihe ịrịba ama,” τέρατα bụ “ihe ebube,” δυνάμεις bụ “ọrụ ndị dị ike.” “Site na” na-egosi ụzọ ma ọ bụ ihe ndị e ji mee ka ozi ahụ doo anya.'
theological_decisions:
- issue: Ihe “ihe ịrịba ama ndị e ji amata onyeozi” pụtara
  choice: Okwu ahụ na-ezo aka n’ihe akaebe ma ọ bụ akara ndị na-egosi ezi ozi onyeozi, gụnyere ntachi obi na ọrụ ebube ndị a kpọrọ aha.
  alternative: Ọ pụrụ izo aka kpọmkwem n’ihe ịrịba ama nke Pọl dị ka “onyeozi ahụ,” ma ọ bụ a pụrụ ịghọta na naanị ọrụ ebube bụ ihe ịrịba ama nke ịbụ onyeozi.
  rationale: Usoro ahịrịokwu ahụ buru ụzọ kwuo ihe ịrịba ama onyeozi, mesịa kpọọ ntachi obi na ihe ịrịba ama, ihe ebube, na ọrụ dị ike. Nsụgharị ahụ anaghị ekpebi n’ụzọ ozizi na ọrụ ebube naanị ha bụ akara niile nke onyeozi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ihe ịrịba ama,” “ihe ebube,” na “ọrụ ndị dị ike” na-edobe ọdịiche dị n’okwu Grik atọ ahụ; e zere okwu okpukpe pụrụ iche nke otu ụka.
