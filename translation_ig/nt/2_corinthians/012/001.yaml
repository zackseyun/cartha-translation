id: 2CO.12.1
reference: 2 Corinthians 12:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: ig
  text: Ịnya isi dị mkpa, ọ bụ ezie na ọ baghị uru;[b] ma aga m n’ihu ikwu banyere ọhụụ na mkpughe nke Onyenwe anyị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọhụụ na mkpughe sitere n’aka Onyenwe anyị.” Okwu Grik e ji gosipụta njikọ nwere ike ịpụta isi mmalite, ma “nke Onyenwe anyị” na-edobe usoro okwu Grik na ihe ọ hapụrụ n’ụzọ na-apụtachaghị ìhè.
    reason: alternative_reading
  - marker: b
    text: 'A pụkwara ịhazi nkebiokwu a otu a: “—ọ bụ ezie na ọ baghị uru—ma aga m n’ihu ikwu banyere.”'
    reason: previous_rendering
lexical_decisions:
- source_word: Καυχᾶσθαι
  choice: Ịnya isi
  rationale: Aha-ngwaa a na-egosipụta omume ịnya isi ma kwekọọ na infinitive Grik e ji mee ihe dị ka aha; ọ naghị agbakwụnye onye na-eme ya ebe Grik hapụrụ nke ahụ n’ụzọ na-apụtachaghị ìhè.
- source_word: δεῖ
  choice: dị mkpa
  rationale: Nke a na-egosipụta mkpa ma ọ bụ ihe a na-apụghị izere ezere, na-enweghị ime ka okwu ahụ sie ike karịa Grik.
- source_word: οὐ συμφέρον μέν
  choice: ọ bụ ezie na ọ baghị uru
  rationale: ‘Ọ baghị uru’ na-egosipụta ihe na-adịghị enye aka ma ọ bụ abaghị uru; ‘ọ bụ ezie na’ na-ebute ọdịiche μέν…δέ n’Igbo a na-asụ ugbu a.
- source_word: ἐλεύσομαι δὲ
  choice: ma aga m agazi n’ihe banyere
  rationale: N’ebe a, ngwaa ahụ na-egosi ịgafe n’isiokwu ọzọ, ọ bụghị nanị ịbịa n’otu ebe. ‘Agazi n’ihe banyere’ na-eme ka mmegharị nke okwu ahụ doo anya, ebe ‘ma’ na-egosipụta δέ.
- source_word: ὀπτασίας
  choice: ọhụụ
  rationale: ‘Ọhụụ’ bụ okwu Igbo doro anya maka ihe mmadụ hụrụ n’ụzọ karịrị ịhụ nkịtị, ma na-edobe ụdị ọtụtụ site n’ọnọdụ okwu ahụ.
- source_word: ἀποκαλύψεις
  choice: mkpughe
  rationale: ‘Mkpughe’ na-egosi ime ka ihe zoro ezo pụta ìhè, ma dabara n’echiche nke okwu Grik a n’ebe a.
- source_word: κυρίου
  choice: nke Onyenwe anyị
  rationale: ‘Nke’ na-edobe njikọ genitive dị na Grik n’enweghị ikpebi ma ọ pụtara ihe Onyenwe anyị nwe, ihe gbasara ya, ma ọ bụ ihe sitere n’aka ya.
theological_decisions:
- issue: Njikọ κυρίου na ‘ọhụụ na mkpughe’
  choice: nke Onyenwe anyị
  alternative: sitere n’aka Onyenwe anyị
  rationale: Genitive Grik nwere ike igosi isi mmalite, mana ọ naghị amanye nkọwa ahụ. ‘Nke Onyenwe anyị’ na-edobe ohere nkọwa na oke okwu ahụ.
- issue: Onye mkpa ịnya isi metụtara
  choice: Ịnya isi dị mkpa
  alternative: Aghaghị m ịnya isi
  rationale: Grik jiri infinitive na δεῖ n’usoro na-akpọghị onye ahụ aha kpọmkwem. Ọ bụ ezie na ihe gbara ya gburugburu na-ezo aka na Pọl, nsụgharị ahọpụtara adịghị eme ka ihe Grik hapụrụ n’ụzọ na-apụtachaghị ìhè bụrụ ihe doro anya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. ‘Ịnya isi’ bụ okwu nkịtị a na-aghọta nke ọma; ‘agazi n’ihe banyere’ na-egosipụta mgbanwe isiokwu n’enweghị ntụgharị mkpụrụokwu siri ike. E debere esemokwu dị n’etiti mkpa ịnya isi na abaghị uru ya, nakwa nghọta abụọ genitive κυρίου nwere ike inwe.
