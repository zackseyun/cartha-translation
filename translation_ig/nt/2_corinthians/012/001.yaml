- from: Ịnya isi dị mkpa, ọ bụ ezie na ọ baghị uru;[a] ma aga m agazi n’ihe banyere ọhụụ na mkpughe nke Onyenwe anyị.[b]
  to: Ịnya isi dị mkpa, ọ bụ ezie na ọ baghị uru;[b] ma aga m n’ihu ikwu banyere ọhụụ na mkpughe nke Onyenwe anyị.[a]
