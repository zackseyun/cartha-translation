  yaml_path: translation/nt/2_corinthians/012/008.yaml
  text: Concerning this[d][c][b][a], three times I pleaded with the Lord that it might depart from me.
translation:
  language: ig
  text: Banyere nke a[a], arịọsiri m Onyenwe anyị ike[b] ugboro atọ ka o si n’ebe m nọ pụọ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Maka nke a” ma ọ bụ “N’ihe banyere nke a.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “akpọkuru m” ma ọ bụ “rịọrọ m arịrịọ.”
    reason: lexical_alternative
  - marker: d
    text: A pụkwara ịsụ ya, “ka o hapụ m” ma ọ bụ “ka o si n’ebe m nọ wezuga onwe ya.” Grik ekwughị isiokwu ngwaa ahụ kpọmkwem; ọ na-ezo azụ n’ahụhụ e kwuru okwu ya n’amaokwu bu ya ụzọ, ma hapụ ya ka a ghọta ya dịka “ogwu” ahụ ma ọ bụ “onyeozi” ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: Banyere nke a
  rationale: ὑπέρ ya na genitive na-egosi okwu Pọl na-ekwu banyere ya, ọ bụghị ime ihe n’aha onye ọzọ. Nkebi a na-ejikọ amaokwu ahụ na ahụhụ a kpọtụrụ aha n’amaokwu bu ya ụzọ.
- source_word: τρὶς
  choice: ugboro atọ
  rationale: Nke a na-egosi na Pọl rịọrọ n’oge atọ; okwu Igbo a doro anya ma bụrụkwa nke a na-asụ ugbu a.
- source_word: τὸν κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo a na-ahụkarị ma dị ùgwù isi kpọọ κύριος n’okwu gbasara Chineke, n’agbanyeghị na ihe odide Grik ahụ akpọghị Jizọs aha kpọmkwem.
- source_word: παρεκάλεσα
  choice: arịọrọ m
  rationale: N’ọnọdụ ekpere a, παρακαλέω pụtara ịrịọsi ike ma ọ bụ ịkpọku onye ka o nyere aka. ‘Arịọrọ m’ bụ okwu Igbo dị mfe, eke, nke na-egosi arịrịọ ahụ n’emebigaghị ihe Grik kwuru ókè.
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ na-ewebata ihe Pọl rịọrọ ka o mee, ma kwekọọ nke ọma na ọrụ ἵνα n’ahịrịokwu a.
- source_word: ἀποστῇ ἀπ’ ἐμοῦ
  choice: ka o si n’ebe m nọ pụọ
  rationale: Nkebi a na-egosi isi n’ebe Pọl nọ wezuga onwe ya. Nnọchiaha Igbo ‘o’ anaghị ekpebi ma ihe a na-ekwu maka ya ọ̀ bụ ‘ogwu’ ahụ ka ọ bụ ‘onyeozi Setan,’ ya mere ọ na-echekwa ihe Grik hapụrụ edoghị anya.
theological_decisions:
- issue: Onye ‘Onyenwe anyị’ na-ezo aka na ya
  choice: E deghị ‘Jizọs’ n’amaokwu ahụ.
  alternative: Onyenwe anyị Jizọs
  rationale: O yikarịrị ka Pọl na-ekwu banyere Jizọs, ma Grik kwuru naanị κύριον. Ịghara ịgbakwunye aha Jizọs na-echekwa oke ihe ederede kwuru.
- issue: Onye ma ọ bụ ihe bụ isiokwu nke ἀποστῇ
  choice: E ji ‘o’ hapụ ya ka ọ nwee ike izo aka n’ihe ahụ ma ọ bụ n’onye ahụ a kpọtụrụ aha.
  alternative: ka ogwu ahụ pụọ; ka onyeozi ahụ pụọ
  rationale: Ngwaa Grik ahụ ekwughị isiokwu ya kpọmkwem; amaokwu bu ụzọ kpọrọ ma ‘ogwu n’anụ ahụ’ ma ‘onyeozi Setan’ aha. Nnọchiaha ‘o’ na-echekwa nghọta abụọ ahụ kama ikpebi otu n’ime ha.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E ji ‘Banyere nke a’ mee ka njikọ ya na amaokwu bu ụzọ doo anya; e jikwa ‘o’ chekwaa mgbagwoju anya dị n’isiokwu ngwaa Grik ahụ.
