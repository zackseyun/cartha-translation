- from: Banyere nke a[a], arịọrọ m[b] Onyenwe anyị[c] ugboro atọ ka o si n’ebe m nọ pụọ[d].
  to: Banyere nke a[a], arịọsiri m Onyenwe anyị ike[b] ugboro atọ ka o si n’ebe m nọ pụọ[d].
  rationale: The revision strengthens the petition verb to reflect παρεκάλεσα in context, while retaining the source text's ambiguity about what or who should depart. It retains the conventional reverential Igbo title Onyenwe anyị without adding the name Jizọs. All footnote markers remain anchored to the corresponding translated elements.
