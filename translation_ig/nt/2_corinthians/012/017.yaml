  yaml_path: translation/nt/2_corinthians/012/017.yaml
  text: Did I exploit you through any of those whom I sent to you?[a]
translation:
  language: ig
  text: Ọ̀ bụ na m ji onye ọ bụla n’ime ndị m zigara unu rigbuo unu[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “were unu nweta uru” ma ọ bụ “ghọgbuo unu.” Okwu Grik ahụ pụtara inweta uru n’ụzọ na-ezighị ezi site n’aka onye ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
  choice: Ọ̀ bụ na ... ?
  rationale: Ajụjụ a na-atụ anya azịza na-adịghị mma. Usoro a bụ ajụjụ nkwughachi dị n’Igbo nke na-egosi na Pọl na-atụ anya ka ha kwuo na o meghị ya.
- source_word: τινα ὧν
  choice: onye ọ bụla n’ime ndị
  rationale: Nke a na-echekwa echiche nke ịhọrọ onye ọ bụla n’ime ìgwè ndị Pọl zitere.
- source_word: ἀπέσταλκα πρὸς ὑμᾶς
  choice: m zitere unu
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’ebe a maka iziga ndị ozi ka ha bịakwute ndị Kọrịnt.
- source_word: δι’ αὐτοῦ
  choice: ji onye ọ bụla n’ime ndị ...
  rationale: Ọ bụ ezie na okwu Grik ahụ bụ otu onye, ọ na-arụ ọrụ n’ụzọ nkesa n’azụ ‘onye ọ bụla n’ime ndị’; ‘ji’ na-egosi onye ahụ dịka ụzọ e si mee ihe ahụ.
- source_word: ἐπλεονέκτησα
  choice: rigbuo
  rationale: ‘Rigbuo’ na-egosi iji mmadụ nweta uru n’ụzọ na-ezighị ezi, nke dabara n’echiche okwu Grik ahụ ma bụrụ okwu ndị mmadụ na-aghọta.
- source_word: ὑμᾶς
  choice: unu
  rationale: Ọ na-ezo aka n’otu ndị kwere ekwe nọ na Kọrịnt, ya mere ọtụtụ ‘unu’ kwesịrị ekwesị.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma doo anya. E ji ajụjụ nkwughachi chekwaa atụmanya azịza na-adịghị mma dị na μή, ma e tinyere nkọwa ala peeji iji gosi obosara ihe πλεονεκτέω nwere ike ịpụta.
