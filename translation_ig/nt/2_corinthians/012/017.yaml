review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the rhetorical question, the partitive reference to any one of Paul's delegates, the instrumental sense of δι’ αὐτοῦ, and the sense of πλεονεκτέω as unfairly gaining at the Corinthians' expense. However, “m zitere unu” can be read as “I sent you,” rather than unambiguously “those whom I sent to you.” “m zigara unu” resolves this without altering the meaning.
  naturalness: The proposed revision preserves the draft's natural rhetorical Igbo question. “Ji ... rigbuo” is an intelligible, suitably direct way to express exploiting or defrauding people through an agent.
  terminology: “Rigbuo” appropriately conveys unjust exploitation/defrauding here. The footnote gives usable alternatives while avoiding an overly narrow claim that the loss must be material.
  issues:
  - severity: medium
    issue: Ambiguity in “ndị m zitere unu”
    rationale: Without the directional applicative in “zigara,” this can be understood as “the people I sent you” or even, in isolation, “I sent you,” rather than clearly identifying people Paul sent to the Corinthians. The Greek πρὸς ὑμᾶς requires the latter sense.
  revised_text: Ọ̀ bụ na m ji onye ọ bụla n’ime ndị m zigara unu rigbuo unu[a]?
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “were unu nweta uru” ma ọ bụ “ghọgbuo unu.” Okwu Grik ahụ pụtara inweta uru n’ụzọ na-ezighị ezi site n’aka onye ọzọ.
    reason: lexical_alternative
  revision_rationale: Changed “zitere unu” to “zigara unu” to state clearly that Paul sent the delegates to the Corinthians. The footnote has been tightened so that its explanation reflects unfair gain without limiting the loss to possessions.
