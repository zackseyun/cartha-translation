revisions:
- from: Ọ̀ bụ na m ji onye ọ bụla n’ime ndị m zitere unu rigbuo unu[a]?
  to: Ọ̀ bụ na m ji onye ọ bụla n’ime ndị m zigara unu rigbuo unu[a]?
  rationale: Changed “zitere unu” to “zigara unu” to state clearly that Paul sent the delegates to the Corinthians. The footnote has been tightened so that its explanation reflects unfair gain without limiting the loss to possessions.
  reviewer_model: gpt-5.6-terra
