id: 2CO.12.5
reference: 2 Corinthians 12:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑπὲρ τοῦ τοιούτου καυχήσομαι, ὑπὲρ δὲ ἐμαυτοῦ οὐ καυχήσομαι εἰ μὴ ἐν ταῖς ⸀ἀσθενείαις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/005.yaml
  text: On behalf of such a one I will boast[a], but on behalf of myself I will not boast[b], except in my weaknesses.
translation:
  language: ig
  text: Banyere onye dị otu ahụ ka m ga-anya isi[a]; ma banyere onwe m, agaghị m anya isi, ma e wezụga n’adịghị ike m dị iche iche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “N’ihi onye dị otu ahụ.” Okwu mbu ụzọ Grik ahụ nwere ike igosi onye a na-ekwu maka ya n’ụzọ sara mbara. “Banyere” na-egosipụta nke ọma na ịnya isi ahụ metụtara onye dị otu ahụ, ma na-echekwa ụzọ Pọl si kwuo okwu n’ụzọ na-eme ka onye ahụ dị anya n’ebe onwe ya nọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “n’adịghị ike m,” ma ọ bụ “n’esighị ike m.” Pọl na-ejikarị “adịghị ike” akọwa esighị ike mmadụ, ahụhụ, ma ọ bụ ọnọdụ ndị ike Chineke na-apụta ìhè n’ime ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: n’ihi
  rationale: N’ebe a, ὑπέρ ya na genitive na-egosi onye a na-ekwu maka ya ma ọ bụ onye e ji mee ihe a. “N’ihi” na-echekwa echiche nke ịnya isi n’ihi onye ahụ, tinyere ụzọ Pọl si mee ka ọ dị ka onye ahụ dị iche n’ebe ya onwe ya nọ.
- source_word: τοῦ τοιούτου
  choice: onye dị otu ahụ
  rationale: Okwu Grik a kpachaara anya kwuo onye ahụ n’ụzọ na-apụtachaghị aha ya. “Onye dị otu ahụ” na-echekwa ụdị nkwupụta ahụ, n’etinyeghị nwoke n’ebe Grik na-ekwughị ya kpọmkwem.
- source_word: καυχήσομαι
  choice: m ga-anya isi
  rationale: “Ịnya isi” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa καυχάομαι n’ọnọdụ a.
- source_word: ἐμαυτοῦ
  choice: onwe m
  rationale: Nnọchiaha ntụgharị a na-emesi Pọl n’onwe ya ike dịka onye e ji tụnyere “onye dị otu ahụ.”
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: N’usoro ahịrịokwu a, εἰ μὴ na-egosi ihe e wepụrụ n’iwu ahụ, ọ bụghị ọnọdụ nwere ike ime; “ma e wezụga” na-enye nghọta ahụ nke ọma.
- source_word: ἐν ταῖς ἀσθενείαις
  choice: n’adịghị ike m
  rationale: ἀσθένεια nwere ike ịgụnye adịghị ike mmadụ, ahụhụ, ma ọ bụ ọnọdụ ndị na-egosi ike Chineke. E tinyere “m” n’ihi na ntụnyere dị n’ahịrịokwu ahụ na-egosi na Pọl na-ekwu maka adịghị ike nke ya.
theological_decisions:
- issue: Ụdị ịnya isi Pọl kwere ka o mee
  choice: E chekwara ọdịiche dị n’etiti ịnya isi n’ihi “onye dị otu ahụ” na ịnya isi n’ihi onwe Pọl; naanị n’adịghị ike ya ka ọ ga-anya isi banyere onwe ya.
  alternative: A pụrụ ịghọta “onye dị otu ahụ” dịka onye ọzọ dị iche n’ezie, ma ọ bụ were ahịrịokwu ahụ naanị dịka ụkpụrụ sara mbara banyere ịnya isi n’adịghị ike.
  rationale: Okwu Pọl kpachaara anya kewapụ ya n’ahụmahụ mkpughe ahụ, ma o meghị ka o doo anya n’amaokwu a naanị ma onye ahụ ọ̀ bụ ya onwe ya. Nsụgharị ahụ echekwala mgbagwoju anya na esemokwu echiche a.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E chekwara nhazi ntụnyere nke Grik, tinyere ụzọ Pọl si kwuo okwu banyere “onye dị otu ahụ” n’ụzọ na-eme ka ọ dị anya n’ebe onwe ya nọ.
