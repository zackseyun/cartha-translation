revisions:
- from: N’ihi onye dị otu ahụ ka m ga-anya isi[a]; ma n’ihi onwe m, agaghị m anya isi, ma e wezụga n’adịghị ike m[b].
  to: Banyere onye dị otu ahụ ka m ga-anya isi[a]; ma banyere onwe m, agaghị m anya isi, ma e wezụga n’adịghị ike m dị iche iche[b].
  rationale: The revision replaces potentially causative “n’ihi” with referential “banyere” in both parallel clauses, preserving the Greek contrast and Paul’s rhetorical indirection. It also represents the plural “weaknesses” naturally and revises the corresponding footnote to avoid an unnatural, illness-limited gloss. No interpretive claim is added concerning the identity of “onye dị otu ahụ.”
