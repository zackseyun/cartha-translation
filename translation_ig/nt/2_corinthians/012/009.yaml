id: 2CO.12.9
reference: 2 Corinthians 12:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: ig
  text: Ọ sịla m, “Amara m ezuru gị; n’ihi na ike[a] na-eru n’uju[b] n’adịghị ike.” Ya mere, aga m eji ọṅụ karịa etu ọnụ n’adịghị ike m dị iche iche, ka ike Mesaya[c] wee dọba ụlọikwuu n’elu m.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ihi na ike m na-eru n’uju n’adịghị ike.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a na-eme ka ike zuo oke.”
    reason: lexical_alternative
  - marker: c
    text: A na-ejikarị “Kraịst” eme ihe n’ebe a kama “Mesaya.” Ha abụọ na-ezo aka n’Onye E Tere Mmanụ.
    reason: alternative_reading
  - marker: d
    text: Ma ọ bụ, “ka ike Mesaya wee bịakwasị m”; n’ụzọ nkịtị karị, okwu Grik ahụ na-enye echiche nke ịdọba ụlọikwuu n’elu mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκέν
  choice: Ọ sịwokwa m
  rationale: Ụdị perfect a na-egosi okwu e kwuru n’oge gara aga nke ka nwere uru ugbu a; “sịwokwa” na-egosikwa njikọ ya na ihe ndị bu ya ụzọ.
- source_word: Ἀρκεῖ σοι ἡ χάρις μου
  choice: Amara m ezuoro gị
  rationale: Nke a bụ Igbo dị mfe ma kwụ ọtọ nke na-egosi na amara Chineke zuru oke maka mkpa Pọl.
- source_word: δύναμις
  choice: ike
  rationale: “Ike” bụ okwu Igbo a na-aghọta nke ọma, ọ na-echekwakwa njikọ dị n’etiti ugboro abụọ e ji δύναμις mee ihe n’amaokwu ahụ.
- source_word: ἀσθενείᾳ / ἀσθενείαις
  choice: adịghị ike / adịghị ike m dị iche iche
  rationale: E debere otu-ọnụọgụ nke mbụ dịka ụkpụrụ n’ozuzu, ebe okwu nke abụọ na-egosi ọtụtụ ọnọdụ Pọl ji ahụ adịghị ike.
- source_word: τελεῖται
  choice: na-eru n’uju
  rationale: Nke a na-egosi iruzu nzube ma ọ bụ igosipụta ike n’uju, n’ebughị ụzọ kwuo na ike Chineke nwere ntụpọ.
- source_word: ἥδιστα … μᾶλλον
  choice: jiri ọṅụ ka ukwuu
  rationale: Nkebiokwu a na-ejikọta echiche nke iji obi ụtọ dị ukwuu na nke ime ya karịa ka ọ dị na mbụ, n’Igbo na-ada nke ọma.
- source_word: καυχήσομαι
  choice: aga m … etu ọnụ
  rationale: “Itu ọnụ” na-echekwa ihe mgbagwoju anya Pọl kpachapụrụ anya kwuo—ịnya isi n’ihe ndị mmadụ na-ewere dịka adịghị ike.
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: wee bịakwasị m biri
  rationale: Nke a na-egosi ma ịbịakwasị mmadụ ma ịnọgide n’ebe ahụ; ihe oyiyi ụlọikwuu dị n’okwu Grik ka akọwara n’ala peeji.
- source_word: Χριστοῦ
  choice: Mesaya
  rationale: N’ebe a Χριστός na-arụ ọrụ dịka aha ọkwa; “Mesaya” na-eme ka echiche nke Onye E Tere Mmanụ pụta ìhè.
theological_decisions:
- issue: Ma a ga-etinye ‘m’ n’akụkụ ‘ike’
  choice: ike
  alternative: ike m
  rationale: Ihe odide SBLGNT e nyere enweghị nnọchiaha μου n’ebe a. Ya mere, ederede bụ isi anaghị agbakwunye “m,” ma a na-edebe nsụgharị ahụ dịka nhọrọ n’ala peeji.
- issue: Otú e si sụgharịa τελεῖται banyere ike Chineke
  choice: na-eru n’uju
  alternative: na-aghọ nke zuru oke
  rationale: “Na-eru n’uju” na-echekwa echiche nke iruzu nzube, ma ọ naghị ekpebi esemokwu okpukpe site n’ikwu na ike Chineke ezughị oke na mbụ.
- issue: Otú e si sụgharịa Χριστοῦ
  choice: Mesaya
  alternative: Kraịst
  rationale: “Mesaya” na-egosi aha ọkwa ahụ nke ọma; “Kraịst” bụkwa nsụgharị ọdịnala a na-ahụkarị, ya mere e tinyere ya n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. A zere okwu ụka nke otu ngalaba pụrụ iche. E chekwara ntụnyere dị n’etiti ike na adịghị ike, tinyekwa ihe oyiyi nke δύναμις na ἐπισκηνόω n’enweghị ịkọwa esemokwu ahụ gabiga ihe isi mmalite kwuru.
