revisions:
- from: Ọ̀ bụ kemgbe ahụ niile ka unu na-eche na anyị na-agbachitere onwe anyị n’ihu unu? Ọ bụ n’ihu Chineke, n’ime Mesaịa[a], ka anyị na-ekwu okwu. Ndị m hụrụ n’anya, ihe niile anyị na-eme bụ maka iwulite unu elu.
  to: Ọ̀ dịla anya unu na-eche na anyị na-agbachitere onwe anyị n’ihu unu? N’ihu Chineke, n’ime Mesaịa[a], ka anyị na-ekwu okwu. Ma ihe niile, ndị m hụrụ n’anya, bụ maka iwulite unu elu.
  rationale: The revision removes the unsupported ‘since then’ implication, preserves the source’s broad τὰ πάντα without adding ‘we do,’ and places the vocative in the final clause in line with the Greek. It retains the formal but natural Igbo phrasing, the title “Mesaịa,” and the metaphor of building up.
