source:
  edition: SBLGNT
  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: ig
  text: Ọ̀ dịla anya unu na-eche na anyị na-agbachitere onwe anyị n’ihu unu? N’ihu Chineke, n’ime Mesaịa[a], ka anyị na-ekwu okwu. Ma ihe niile, ndị m hụrụ n’anya, bụ maka iwulite unu elu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime Kraịst.”
    reason: alternative_rendering
lexical_decisions:
- source_word: Πάλαι
  choice: kemgbe ahụ niile
  rationale: N’ebe a, okwu a na-egosi echiche ndị na-agụ akwụkwọ nwere ruo oge ahụ dum, ọ bụghị naanị ihe mere n’oge ochie.
- source_word: δοκεῖτε
  choice: unu na-eche
  rationale: Ọ na-egosi echiche ha ka nwere ugbu a; ajụjụ ahụ na-akatọ echiche ahụ n’ụzọ dị nro.
- source_word: ἀπολογούμεθα
  choice: anyị na-agbachitere onwe anyị
  rationale: Nke a na-echekwa echiche nke mmadụ ịza ebubo ma ọ bụ ịkọwa onwe ya, n’asụsụ Igbo doro anya.
- source_word: ὑμῖν
  choice: n’ihu unu
  rationale: N’ọnọdụ okwu ịgbachitere onwe onye, nke a na-egosi na a na-eme ya n’ebe ndị Kọrịnt nọ dị ka ndị na-ekpe okwu ahụ ikpe.
- source_word: κατέναντι θεοῦ
  choice: n’ihu Chineke
  rationale: Ọ na-egosi na Pọl na-ekwu okwu n’ọnụnọ Chineke ma na-aza ajụjụ n’ihu ya.
- source_word: ἐν Χριστῷ
  choice: n’ime Mesaịa
  rationale: Nke a na-echekwa echiche nke njikọ na Mesaịa ma na-ewere Χριστός dị ka utu aha n’ebe a.
- source_word: λαλοῦμεν
  choice: anyị na-ekwu okwu
  rationale: Nsụgharị a bụ nke dị mfe ma na-echekwa omume na-aga n’ihu nke ngwaa ahụ.
- source_word: τὰ δὲ πάντα
  choice: ihe niile anyị na-eme
  rationale: N’ọnọdụ a, ọ na-ezo aka n’ihe niile Pọl na ndị ọrụ ibe ya na-ekwu ma na-eme; itinye ‘anyị na-eme’ na-eme ka ihe ọ na-ezo aka na ya doo anya n’Igbo.
- source_word: ἀγαπητοί
  choice: ndị m hụrụ n’anya
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma dị ùgwù isi kpọọ ha ndị a hụrụ n’anya.
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: maka iwulite unu elu
  rationale: Nke a na-echekwa ihe atụ nke iwu ụlọ, nke pụtara ime ka okwukwe na ndụ ọgbakọ ha sie ike.
theological_decisions:
- issue: Nsụgharị Χριστῷ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a, okwu ahụ ka na-arụ ọrụ dị ka utu aha nke Onye E Tere Mmanụ; e debere ‘Kraịst’ na nkọwa ala peeji dịka nsụgharị ọdịnala a na-ahụkarị.
- issue: Ihe ‘iwulite unu elu’ pụtara
  choice: E debere ihe atụ nke iwu ụlọ
  alternative: ime ka unu sie ike
  rationale: Okwu Grik οἰκοδομή nwere ike ịpụta iwusi okwukwe ma ọ bụ ọgbakọ ike, ma idebe ihe atụ ahụ na-echekwa obosara na ike nke okwu mbụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E debere usoro ajụjụ nkwugharị nke Pọl, ịdị nsọ nke ‘n’ihu Chineke,’ na ihe atụ nke iwulite ndị kwere ekwe elu.
