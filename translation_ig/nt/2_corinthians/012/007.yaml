id: 2CO.12.7
reference: 2 Corinthians 12:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: ig
  text: N’ihi ịdị ukwuu pụrụ iche nke mkpughe ndị ahụ[e]—ka m ghara ibuli onwe m elu—e nyere m ogwu n’anụ ahụ[a], bụ onyeozi Setan[b], ka ọ na-akụ m ọkpọ[c], ka m ghara ibuli onwe m elu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “osisi a pịrị ọnụ n’anụ ahụ.” Okwu Grik bụ σκόλοψ nwere ike ịpụta osisi a pịrị ọnụ, iberibe osisi dị nkọ, ma ọ bụ ogwu; a maghị kpọmkwem ihe oyiyi e bu n’uche.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mmụọ ozi Setan.” Okwu Grik bụ ἄγγελος nwere ike ịpụta “onyeozi” ma ọ bụ “mmụọ ozi.”
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “ka ọ na-emekpa m ahụ” ma ọ bụ “ka ọ na-akụ m ihe.” Ngwaa Grik bụ κολαφίζῃ na-egosi n’ụzọ nkịtị ịkụ mmadụ ọkpọ ma ọ bụ iti ya ihe ugboro ugboro.
    reason: lexical_alternative
  - marker: d
    text: Ahịrịokwu bụ “ka m ghara ibuli onwe m elu” pụtara ugboro abụọ n’ihe odide Grik; e debere ha abụọ ebe a.
    reason: textual_transparency
  - marker: e
    text: 'A pụkwara ịhazi mmalite amaokwu a otú a: “N’ihi ịdị ukwuu pụrụ iche nke mkpughe ndị ahụ, ka m ghara ibuli onwe m elu, e nyere m ogwu n’anụ ahụ.”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὑπερβολῇ τῶν ἀποκαλύψεων
  choice: ịdị ukwuu pụrụ iche nke mkpughe ndị ahụ
  rationale: Nke a na-egosipụta ịdị ukwuu karịrị nkịtị nke mkpughe ndị ahụ n’Igbo dị mfe ma dị ugwu.
- source_word: ὑπεραίρωμαι
  choice: m ghara ibuli onwe m elu
  rationale: Ọ na-echekwa echiche nke mmadụ ibuli onwe ya elu ma ọ bụ ịnya isi, nakwa nkwughachi okwu ahụ ugboro abụọ.
- source_word: ἐδόθη μοι
  choice: e nyere m
  rationale: E debere ya n’ụdị enweghị onye e kpọrọ aha dị ka onye nyere ya, ka a ghara ịkọwa onye ahụ karịa ihe Grik kwuru.
- source_word: σκόλοψ τῇ σαρκί
  choice: ogwu n’anụ ahụ
  rationale: ‘Ogwu’ bụ ihe oyiyi doro anya ma bụrụkwa nke a na-aghọta n’Igbo; ‘n’anụ ahụ’ na-echekwa ihe Grik kwuru n’enweghị ime ya ka ọ bụrụ ‘agwa mmehie.’
- source_word: ἄγγελος Σατανᾶ
  choice: onyeozi Setan
  rationale: ‘Onyeozi’ nwere ike ịbụ onye e zigara ozi ma ọ bụ mmụọ ozi, ya mere ọ na-echekwa obosara ihe ἄγγελος pụrụ ịpụta.
- source_word: κολαφίζῃ
  choice: ka ọ na-akụ m ihe
  rationale: Okwu Grik ahụ na-egosi ịkụ mmadụ ihe ma ọ bụ iti ya ihe ugboro ugboro; nsụgharị a na-echekwa ike ihe oyiyi ahụ.
theological_decisions:
- issue: Ụdị nsogbu Pọl kpọrọ ‘ogwu n’anụ ahụ’
  choice: E debere ihe atụ ahụ n’enweghị ịkọwa kpọmkwem ihe ọ bụ.
  alternative: Ọrịa anụ ahụ, mkpagbu, ndị iro, ma ọ bụ mmegide mmụọ ọjọọ.
  rationale: Amaokwu Grik ahụ ekwughị kpọmkwem ihe ogwu ahụ bụ.
- issue: Onye nyere Pọl ogwu ahụ
  choice: ‘E nyere m’ n’enweghị ịkpọ onye nyere ya aha.
  alternative: ‘Chineke nyere m’ ma ọ bụ ‘e kwere ka e nye m.’
  rationale: Grik ji ụdị ngwaa na-ekwughị onye mere ihe ahụ; nke a na-echekwa mgbagwoju anya dị n’etiti ikike Chineke na ọrụ Setan.
- issue: Ihe ἄγγελος Σατανᾶ pụtara
  choice: onyeozi Setan
  alternative: mmụọ ozi Setan
  rationale: ἄγγελος nwere ike ịpụta onyeozi ma ọ bụ mmụọ ozi; isi amaokwu ahụ ekpebighị ụdị onye ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji ‘ogwu n’anụ ahụ’ na ‘onyeozi Setan’ chekwaa ihe oyiyi na mgbagwoju anya nke Grik; e jighị okwu ụka pụrụ iche ma ọ bụ nkọwa otu ozizi.
