- from: Ma aga m eji ọṅụ dị ukwuu mefuo ihe m nwere, a ga-emefukwa mụ onwe m, n’ihi mkpụrụ obi unu[a]. Ọ bụrụ na m na-ahụ unu n’anya karịa, à na-ahụ m n’anya pekarị?
  to: Ma aga m eji ọṅụ dị ukwuu mefuo ihe m nwere, a ga-emefukwa mụ onwe m, n’ihi mkpụrụ obi unu[a]. Ọ bụrụ na m na-ahụ unu n’anya karịa, à na-ahụ m n’anya ntakịrị?
  rationale: 'The sole textual revision replaces “pekarị” with “ntakịrị” so that the final rhetorical question expresses the Greek contrast: Paul loves them more, yet is loved less. The expenditure metaphor, passive form, pastoral register, and lexical-alternative footnote are retained.'
  reviewer_model: gpt-5.6-terra
