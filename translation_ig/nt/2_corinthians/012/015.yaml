review_pass:
  verdict: revise
  source_fidelity: 'The paired expenditure image is substantially retained: Paul will expend his resources and will himself be expended for the Corinthians. “Mkpụrụ obi unu” is a defensible formally close rendering of τῶν ψυχῶν ὑμῶν, with the supplied alternative footnote appropriately recognizing the wider sense of ψυχή. The conditional rhetorical question and its unresolved force are also retained.'
  naturalness: The wording is generally clear Standard Igbo. However, “pekarị” normally means “especially/particularly,” not “less,” and therefore reverses or obscures the intended comparative contrast. “Ntakịrị” naturally conveys the diminished measure intended in this rhetorical question.
  terminology: “Jiri ọṅụ dị ukwuu,” “mefuo ihe m nwere,” “a ga-emefukwa mụ onwe m,” and “na-ahụ mmadụ n’anya” are suitable modern Igbo renderings. No doctrinally loaded interpretation is imposed by “mkpụrụ obi”; the footnote properly supplies viable lexical alternatives.
  issues:
  - severity: high
    issue: “pekarị” is used for Greek ἧσσον.
    rationale: In Standard Igbo, “pekarị” means “especially” or “particularly,” whereas ἧσσον means “less” or “to a lesser extent.” The phrase must instead indicate that Paul is loved less.
  revised_text: Ma aga m eji ọṅụ dị ukwuu mefuo ihe m nwere, a ga-emefukwa mụ onwe m, n’ihi mkpụrụ obi unu[a]. Ọ bụrụ na m na-ahụ unu n’anya karịa, à na-ahụ m n’anya ntakịrị?
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndụ unu” ma ọ bụ “unu onwe unu.”
    reason: lexical_alternative
  revision_rationale: 'The sole textual revision replaces “pekarị” with “ntakịrị” so that the final rhetorical question expresses the Greek contrast: Paul loves them more, yet is loved less. The expenditure metaphor, passive form, pastoral register, and lexical-alternative footnote are retained.'
