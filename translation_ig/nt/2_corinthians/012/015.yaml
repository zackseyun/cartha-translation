id: 2CO.12.15
reference: 2 Corinthians 12:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: ig
  text: Ma aga m eji ọṅụ dị ukwuu mefuo ihe m nwere, a ga-emefukwa mụ onwe m, n’ihi mkpụrụ obi unu[a]. Ọ bụrụ na m na-ahụ unu n’anya karịa, à na-ahụ m n’anya ntakịrị?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndụ unu” ma ọ bụ “unu onwe unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιστα
  choice: eji ọṅụ dị ukwuu
  rationale: Na-egosipụta oke ọṅụ na ịdị njikere Pọl nwere, ọ bụghị naanị na o kwetara ime ya.
- source_word: δαπανήσω
  choice: mefuo ihe m nwere
  rationale: Na-echekwa ihe atụ nke imefu ihe mmadụ nwere; mgbakwunye “ihe m nwere” na-eme ka okwu ahụ doo anya n’Igbo.
- source_word: ἐκδαπανηθήσομαι
  choice: a ga-emefukwa mụ onwe m
  rationale: 'Na-echekwa olu nnabata na ike okwu ahụ: ọ bụghị naanị ihe Pọl nwere ka ọ ga-emefu, kama ya onwe ya ga-abụkwa ihe e mefuru.'
- source_word: ὑπὲρ
  choice: n’ihi
  rationale: N’ebe a ọ na-egosi na ihe Pọl na-eme bụ maka ọdịmma ha.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: mkpụrụ obi unu
  rationale: Na-echekwa okwu ψυχή na ịdị omimi nke nlekọta Pọl, ma e kwesịghị ịghọta ya dị ka nkwupụta nkà mmụta okpukpe banyere akụkụ mmadụ naanị.
- source_word: εἰ
  choice: Ọ bụrụ na
  rationale: Na-echekwa ụdị ọnọdụ dị n’asụsụ Grik na ike ajụjụ nkwuwa okwu ahụ n’ebughị ụzọ kpebie ya dị ka “ebe ọ bụ na.”
- source_word: περισσοτέρως
  choice: karịa
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa iji gosipụta ogo ịhụnanya ka ukwuu.
- source_word: ἀγαπῶν
  choice: m na-ahụ unu n’anya
  rationale: Ọ bụ ezie na ọ bụ participle n’asụsụ Grik, ụdị ngwaa a na-eme ka ajụjụ ahụ bụrụ Igbo ebumpụta ụwa ma chekwaa echiche nke ịhụnanya na-aga n’ihu.
- source_word: ἧσσον
  choice: pekarị
  rationale: Na-egosipụta ọdịiche kpọmkwem megide “karịa” n’ụzọ Igbo dị nkenke.
- source_word: ἀγαπῶμαι
  choice: à na-ahụ m n’anya
  rationale: Na-echekwa olu nnabata na ọnọdụ na-aga n’ihu nke ngwaa Grik.
theological_decisions:
- issue: Ntụgharị ψυχαί n’okwu nlekọta Pọl
  choice: mkpụrụ obi unu
  alternative: ndụ unu; unu onwe unu
  rationale: “Mkpụrụ obi unu” na-echekwa ụdị okwu Grik na ịdị omimi ime mmụọ dị n’okwu Pọl, ebe nkọwa ala peeji na-egosi na ψυχή nwekwara ike izo aka ná ndụ mmadụ ma ọ bụ mmadụ ahụ dum.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ abụọ jikọrọ ọnụ nke “imefu” na “ịbụ onye e mefuru,” tinyere ajụjụ nkwuwa okwu nke na-egosipụta mwute Pọl n’emeghị ka ọnọdụ ahụ ghọọ nkwupụta doro anya.
