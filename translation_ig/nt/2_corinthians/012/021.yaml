id: 2CO.12.21
reference: 2 Corinthians 12:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: ig
  text: Ana m atụ egwu na mgbe m bịara ọzọ[a], Chineke m nwere ike iweda m ala n’ihu unu[b], m ga-akwa ákwá n’ihi ọtụtụ n’ime ndị meburula mmehie[c] ma echegharịbeghị n’ihi adịghị ọcha, omume mmekọahụ rụrụ arụ, na omume enweghị ihere na njide onwe onye[d] nke ha mere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nkebi Grik a na-adabere n’okwu Pọl banyere egwu ya n’amaokwu bu ya ụzọ; a pụkwara ịsụ ya, ‘Ka ọ ghara ịbụ na mgbe m bịara ọzọ...’
    reason: syntactic_clarity
  - marker: b
    text: Ma ọ bụ, ‘n’etiti unu.’ ‘Iweda m ala’ nwekwara ike ịpụta ‘ime m ihere’ n’ọnọdụ a.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, ‘ọtụtụ n’ime ndị meburu mmehie.’
    reason: lexical_alternative
  - marker: d
    text: ‘Omume enweghị ihere na njide onwe onye’ na-ezo aka n’omume rụrụ arụ nke a na-eme n’enweghị ihere ma ọ bụ njide onwe onye.
    reason: lexical_clarity
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: Ana m atụ egwu na mgbe m bịara ọzọ
  rationale: Μή na-aga n’ihu n’echiche egwu e kwuru n’amaokwu bu ụzọ. Ịkpọpụta ‘Ana m atụ egwu’ na-eme ka njikọ ahụ doo anya n’Igbo, ebe ‘mgbe m bịara ọzọ’ na-egosi nleta Pọl na-atụ anya ya.
- source_word: ταπεινώσῃ με
  choice: nwere ike iweda m ala
  rationale: ‘Iweda ... ala’ na-eburu echiche nke ime ka mmadụ dị umeala ma ọ bụ iwetara ya mmechuihu, n’ebughị ụzọ kpebie kpọmkwem ụdị mweda n’ala e bu n’uche.
- source_word: ὁ θεός μου
  choice: Chineke m
  rationale: Nke a na-edobe okwu nnwe ahụ kpọmkwem ma na-egosi mmekọrịta Pọl na Chineke.
- source_word: πρὸς ὑμᾶς
  choice: n’ihu unu
  rationale: N’ọnọdụ a, πρός na-egosi na mweda ahụ ga-eme mgbe Pọl nọ n’etiti ndị Kọrịnt ma ọ bụ n’ihu ha. ‘N’ihu unu’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
- source_word: πενθήσω
  choice: m ga-akwakwa ákwá n’ihi
  rationale: Nkebi a na-egosi iru uju miri emi, ọ bụghị naanị inwe mwute. ‘Ịkwa ákwá n’ihi’ na-ekwupụta ịdị arọ nke mwute ahụ n’Igbo nkịtị.
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: ọtụtụ ndị mere mmehie na mbụ
  rationale: Nke a na-edobe ma ọnụọgụ a na-akọwaghị kpọmkwem ma echiche na mmehie ahụ mere tupu oge a, ma ka dị mkpa n’ihi na ha echegharịghị.
- source_word: μὴ μετανοησάντων
  choice: ma ha echegharịghị
  rationale: Okwu a na-egosi na ndị ahụ agbanwebeghị obi ma hapụ mmehie ha ruo oge Pọl na-ekwu okwu.
- source_word: ἀκαθαρσίᾳ
  choice: adịghị ọcha
  rationale: ‘Adịghị ọcha’ na-edobe obosara nke okwu Grik ahụ n’ihe gbasara omume na-emebi mmadụ, n’emeghị ka ọ bụrụ naanị otu ụdị mmehie mmekọahụ.
- source_word: πορνείᾳ
  choice: omume mmekọahụ rụrụ arụ
  rationale: Nke a bụ okwu Igbo nke oge a, doro anya, ma saa mbara nke ọma iji zipụta πορνεία n’etinyeghị ya naanị n’ịkwa iko n’alụmdi na nwunye.
- source_word: ἀσελγείᾳ
  choice: omume ihere na-enweghị njide
  rationale: Okwu Grik ahụ na-egosi omume rụrụ arụ, nke enweghị ihere na njide onwe onye; ntụgharị a na-edobe akụkụ abụọ ahụ.
- source_word: ᾗ ἔπραξαν
  choice: ha mere
  rationale: Nkebi a na-ezo aka n’omume ọjọọ atọ e depụtara. Igbo a dị mfe ma ghara ịmanye echiche na ọ bụ naanị otu ihe mere otu ugboro.
theological_decisions:
- issue: Ike nke μή nke dabere n’okwu egwu dị n’amaokwu bu ụzọ
  choice: E tinyere ‘Ana m atụ egwu na’ n’ihu ahịrịokwu ahụ.
  alternative: ‘Ka ọ ghara ịbụ na mgbe m bịara ọzọ...’
  rationale: Grik ahụ na-aga n’ihu n’egwu Pọl kwupụtara na 12:20. Ịkpọpụta egwu ahụ n’Igbo na-eme ka ahịrịokwu guzoro nke ọma n’onwe ya, n’agbanweghị ya ka ọ bụrụ nkwupụta doro anya na ihe ahụ aghaghị ime.
- issue: Ma ταπεινόω pụtara ime ka Pọl dị umeala ma ọ bụ iweta ya mmechuihu
  choice: iweda m ala
  alternative: ime m ihere
  rationale: ‘Iweda m ala’ na-ahapụ obosara okwu Grik ahụ, nke pụrụ ịpụta ime ka mmadụ dị umeala, iwetulata ya, ma ọ bụ iweta ya mmechuihu n’ọnọdụ ahụ.
- issue: Idobe ọdịiche dị n’etiti mmehie atọ e depụtara
  choice: adịghị ọcha, omume mmekọahụ rụrụ arụ, na omume ihere na-enweghị njide
  alternative: ijikọta ha niile dịka ‘omume mmekọahụ rụrụ arụ’
  rationale: Okwu Grik atọ ahụ nwere njikọ ma ha abụghị otu ihe kpọmkwem. Idepụta ha iche na-edobe nkwusi ike nke Pọl n’etinyeghị nkọwa okpukpe dị warara karịa ihe odide ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E zere okwu ochie ma ọ bụ okwu ụka nke nwere ike ime ka πορνεία na ἀσέλγεια dị warara karịa Grik. A hapụrụ esemokwu dị na ‘iweda m ala’ ka ọ bụrụ ihe nwere ike ịgụnye ịdị umeala ma ọ bụ mmechuihu.
