source:
  edition: SBLGNT
  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: ig
  text: Aghọọla m onye nzuzu; ọ bụ unu manyere m ime ya. N’ihi na o kwesịịrị ka unu jaa m mma, n’ihi na ọ dịghị ihe ọ bụla m ji dị ala karịa ndị ahụ bụ ndịozi karịrị akarị[a], ọ bụrụgodị na abụghị m ihe ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị okwu a sị: “ndịozi ndị kacha ama ama.” Okwu Grik ahụ nwere nkwusi ike dị ukwuu, ọ pụkwara ịbụ okwu ịkwa emo n’ebe a.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γέγονα
  choice: Aghọọla m
  rationale: Oge perfect na-egosi ọnọdụ dị ugbu a sitere n’ihe merela; ‘Aghọọla m’ na-eburu ike ahụ nke ọma.
- source_word: ἄφρων
  choice: onye nzuzu
  rationale: Aha a ji kọwaa onye n’ụzọ kpọmkwem dabara n’okwu Pọl ji ịkwa onwe ya emo n’ọnọdụ a.
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: ọ bụ unu manyere m ime ya
  rationale: ‘Ọ bụ unu’ na-echekwa nkwusi ike dị n’ὑμεῖς; ‘ime ya’ na-ezo aka n’okwu nzuzu banyere onwe ya n’amaokwu ndị gbara ya gburugburu.
- source_word: ὤφειλον
  choice: kwesịrị
  rationale: Na-egosi ihe ziri ezi ma ọ bụ ihe a tụrụ anya ka e mee, n’Igbo dị mfe ma dị ebube.
- source_word: ὑφ’ ὑμῶν συνίστασθαι
  choice: ọ bụ unu kwesịrị ịja m mma
  rationale: Passive na onye mere ihe gosiri na ndị Kọrịnt kwesịrị ikwu okwu ọma iji kwado Pọl; ntụgharị a bụ Igbo nkịtị ma na-echekwa echiche nke commendation.
- source_word: οὐδὲν ... ὑστέρησα
  choice: ọ dịghị ihe ọ bụla m ji dị ala karịa
  rationale: Na-echekwa ntụnyere nke ịbụ onye na-erughị ma ọ bụ dị ala karịa ndị ọzọ.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: ndị ahụ bụ́ “ndịozi karịrị akarị”
  rationale: ‘Karịrị akarị’ na-eburu nkwusi ike dị ukwuu nke ὑπερλίαν, ebe akara okwu na-enyere aka igosi na okwu ahụ nwere ike ịbụ nke ịkwa emo n’agbanyeghị na ederede ekpebighị ya kpamkpam.
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: ọ bụrụgodị na abụghị m ihe ọ bụla
  rationale: Na-echekwa ụdị concessive nke okwu Grik na nkwupụta Pọl ji wedata onwe ya.
theological_decisions:
- issue: Ike na ebumnuche nke τῶν ὑπερλίαν ἀποστόλων
  choice: ndị ahụ bụ́ “ndịozi karịrị akarị”
  alternative: ndịozi ndị a kacha ama ama
  rationale: Ihe gbara amaokwu a gburugburu na-egosi na o nwere ike ịbụ okwu ịkwa emo, ma Grik ekwughị kpọmkwem ‘ndị a na-akpọ.’ Ya mere, isi ederede na-echekwa okwu nkwusi ike ahụ, ebe nkọwa ala peeji na-edobe ụzọ ọzọ a pụrụ isi ghọta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu, mee ntụgharị ahụ. E chekwara nkwusi ike nke ‘unu,’ njikọ abụọ nke γάρ, na mgbagwoju anya dị n’okwu banyere ‘ndịozi karịrị akarị.’
