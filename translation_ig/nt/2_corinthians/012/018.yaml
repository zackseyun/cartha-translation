id: 2CO.12.18
reference: 2 Corinthians 12:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: ig
  text: Arịọrọ m Taịtọs ka ọ gaa, ezipụkwara m nwanne ahụ ka o soro ya. Taịtọs ọ̀ rigburu unu uru? Ọ̀ bụghị n'otu mmụọ ka anyị jere ije[a]? Ọ̀ bụghịkwa otu nzọụkwụ ndị ahụ ka anyị gbasoro?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n'otu Mmụọ ahụ,” nke nwere ike izo aka na Mmụọ Nsọ kama ịbụ naanị otu echiche ma ọ bụ ụdị obi.
    reason: alternative_reading
lexical_decisions:
- source_word: παρεκάλεσα
  choice: Arịọrọ m Taịtọs ka ọ gaa
  rationale: N'ebe a, παρακαλέω na-egosi arịrịọ siri ike e nyere Taịtọs maka ozi ahụ. A gbakwụnyere ‘ka ọ gaa’ site n'ọnọdụ okwu ahụ iji mee ka Igbo bụrụ nke doro anya ma dị ire.
- source_word: συναπέστειλα
  choice: mụ na ya ezipụkwa
  rationale: Ngwaa a pụtara izipụ onye ọzọ ka o soro Taịtọs; usoro a na-egosipụta njikọ ahụ n'Igbo nkịtị.
- source_word: τὸν ἀδελφόν
  choice: nwanne ahụ
  rationale: A na-echekwa aha a kapịrị ọnụ nke Grik na-enweghị ịgbakwunye ‘anyị’; o yiri ka ọ na-ezo aka n'otu onye kwere ekwe ndị na-agụ akwụkwọ ahụ maara.
- source_word: μήτι
  choice: ò mere otú ahụ?
  rationale: Ajụjụ a na-atụ anya azịza na-adịghị mma. Usoro ajụjụ Igbo a na-eme ka atụmanya ahụ pụta ìhè n'ụzọ ebumpụta ụwa.
- source_word: ἐπλεονέκτησεν ὑμᾶς
  choice: erigbughị unu uru
  rationale: Akpaalaokwu a na-egosi mmadụ irite uru n'ụzọ na-ezighị ezi n'aka ndị ọzọ. Ọ sara mbara karịa ‘ịghọgbu unu ego’ ma kwekọọ n'ọnọdụ gbasara ezi omume na ihe onwunwe.
- source_word: τῷ αὐτῷ πνεύματι
  choice: n'otu mmụọ
  rationale: Nke a na-echekwa ohere ịghọta πνεῦμα dịka otu mmụọ ma ọ bụ otu ụdị obi na omume, ma ọ bụ dịka Mmụọ Nsọ, n'ebughị ụzọ kpebie otu n'ime ha n'ahịrị isi.
- source_word: περιεπατήσαμεν
  choice: anyị jere ije
  rationale: A na-echekwa ihe atụ nke ‘ije’ e ji akọwa ụzọ ndụ na omume, nke a na-aghọta nke ọma n'Igbo.
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: otu nzọụkwụ ka anyị gbasoro
  rationale: Nke a na-echekwa ihe atụ nke nzọ ụkwụ ma na-egosi ịgbaso otu ụzọ omume; ọ bụ usoro okwu dị ire n'Igbo.
theological_decisions:
- issue: Ihe ‘n'otu mmụọ’ pụtara
  choice: E dere ‘mmụọ’ n'ụzọ nwere ike igosi otu echiche, mmụọ obi, ma ọ bụ ụdị omume ha nwere.
  alternative: A pụrụ ịghọta ya dịka ‘site n'otu Mmụọ ahụ,’ ya bụ Mmụọ Nsọ.
  rationale: Ọnọdụ okwu ahụ na-ekwu maka ịdị n'otu n'ezi omume Pọl na Taịtọs, ma usoro dative nke Grik anaghị egbochi nghọta banyere Mmụọ Nsọ. Ya mere, ederede na ndetu ala peeji na-echekwa nghọta abụọ ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A chekwara ihe atụ nke ije na nzọụkwụ, yana mgbagwoju anya dị na πνεῦμα; akara ndetu [a] dị n'ahịrị isi.
