reference: 2 Corinthians 6:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: ig
  text: Ebe anyị na ya na-arụkọ ọrụ[a], anyị na-arịọkwa unu ike ka unu ghara ịnata amara Chineke n’efu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Dị ka ndị na-arụkọ ọrụ, anyị na-arịọkwa unu ike.” Participle Grik ahụ anaghị akọwapụta kpọmkwem onye Pọl na ndị ibe ya na-arụkọ ọrụ, ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-egosi nnọọ na ọ bụ Chineke.
    reason: alternative_reading
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: Ebe anyị na ya na-arụkọ ọrụ
  rationale: Nke a na-echekwa omume dị na participle Grik ahụ ma na-egosi onye ha na ya na-arụkọ ọrụ site n’okwu gbara amaokwu ahụ gburugburu. Okwu bụ́ “ya” na-atụ aka na Chineke, ma ihe odide Grik akpọghị onye ahụ aha kpọmkwem.
- source_word: δὲ
  choice: —
  rationale: N’ebe a δέ bụ naanị njikọ dị nro. Usoro ahịrịokwu Igbo ahụ na-egosi njikọ a nke ọma n’enweghị itinye “ma” ma ọ bụ “ugbu a.”
- source_word: καὶ
  choice: -sikwa
  rationale: Mgbakwụnye “-sịkwa” na ngwaa ahụ na-egosipụta echiche nke “ọzọkwa/also” n’ụzọ Igbo na-ada nke ọma.
- source_word: παρακαλοῦμεν
  choice: anyị na-arịọsikwa unu ike
  rationale: Nke a na-egosi arịrịọ siri ike na nke sitere n’obi, ọ bụghị naanị inye nkasi obi.
- source_word: μὴ
  choice: ka unu ghara
  rationale: Nke a bụ ụzọ Igbo doro anya si ekwupụta iwu ma ọ bụ arịrịọ n’ụdị njụ.
- source_word: εἰς κενὸν
  choice: n’ụzọ na-agaghị amị mkpụrụ
  rationale: Akpaalaokwu Grik a pụtara ihe na-enweghị mmetụta ma ọ bụ nke na-emezughị nzube ya. Nhọrọ a na-ezere mgbagwoju anya nke “n’efu,” nke nwekwara ike ịpụta ‘n’enweghị ụgwọ’ n’Igbo.
- source_word: χάριν
  choice: amara
  rationale: “Amara” bụ okwu Igbo a maara nke ọma maka χάρις, ma na-echekwa ịdị arọ nke okwu ahụ n’okwu Pọl banyere omume ọma na onyinye Chineke.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: “Amara Chineke” na-egosipụta genitive ahụ n’ụzọ Igbo dị nkenke ma kwụ ọtọ.
- source_word: δέξασθαι
  choice: ịnata
  rationale: “Ịnata” na-enye echiche bụ́ ịnabata ihe e nyere, ma dabara n’usoro ahịrịokwu a.
- source_word: ὑμᾶς
  choice: unu
  rationale: Ụdị ọtụtụ mmadụ “unu” kwekọrọ na nnọchiaha Grik ahụ ma na-agwa ndị Kọrịnt okwu ozugbo.
theological_decisions:
- issue: Onye e bu n’obi n’okwu bụ́ ‘na-arụkọ ọrụ’
  choice: A sụgharịrị ya “anyị na ya na-arụkọ ọrụ,” ebe “ya” na-atụ aka na Chineke site n’ihe ndị gbara amaokwu ahụ gburugburu.
  alternative: “Dị ka ndị na-arụkọ ọrụ” n’akpọghị onye ha na ya na-arụkọ ọrụ aha.
  rationale: Ihe gbara amaokwu a gburugburu na-elekwasị anya n’ọrụ Chineke nke ime ka ndị mmadụ na ya dịghachi ná mma na n’ọrụ Pọl dị ka onye nnọchiteanya ya (2 Kọrịnt 5:18–20). Ma n’ihi na Grik ekwughị onye ahụ kpọmkwem, e debere nhọrọ ọzọ na nkọwa ala peeji.
- issue: Ihe ‘εἰς κενὸν’ pụtara gbasara amara
  choice: “n’ụzọ na-agaghị amị mkpụrụ”
  alternative: “n’efu” ma ọ bụ “na-enweghị isi”
  rationale: Nsụgharị a na-egosi na amara Chineke agaghị erute mmetụta ma ọ bụ nzube e kwesịrị ịtụ anya ya, n’enweghị ikwu kpọmkwem ụdị mkpụrụ ahụ bụ ma ọ bụ dozie esemokwu nkà mmụta okpukpe dị n’okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Na-arịọsikwa unu ike” na-enye ume arịrịọ ahụ n’enweghị iji okwu ụka siri ike nghọta. A họọrọ “n’ụzọ na-agaghị amị mkpụrụ” kama “n’efu” iji zere nghọtahie na amara bụ ihe a na-anata n’enweghị ụgwọ.
