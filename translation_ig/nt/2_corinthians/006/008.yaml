revisions:
- from: site n’ịnata nsọpụrụ na enweghị nsọpụrụ[a], site n’okwu ọjọọ na okwu ọma[b]; a na-ewere anyị dị ka ndị nduhie, ma anyị bụ ndị na-ekwu eziokwu[c],
  to: site n’nsọpụrụ na enweghị nsọpụrụ[a], site n’akụkọ ọjọọ na akụkọ ọma[b]; a na-ewere anyị dị ka ndị nduhie, ma anyị bụ ndị eziokwu[c],
