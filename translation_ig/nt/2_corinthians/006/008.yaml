translation:
  language: ig
  text: site n’nsọpụrụ na enweghị nsọpụrụ[a], site n’akụkọ ọjọọ na akụkọ ọma[b]; a na-ewere anyị dị ka ndị nduhie, ma anyị bụ ndị eziokwu[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ebube na enweghị nsọpụrụ.” Okwu Grik ahụ nwekwara ike ịpụta “ebube,” ma n’ebe a o yikarịrị ka ọ na-ekwu maka nsọpụrụ mmadụ na-enweta n’ihu ọha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’okwu ọjọọ na okwu ọma.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “dị ka ndị nduhie ma bụrụ ndị eziokwu.” Okwu a na-egosi ọdịiche dị n’etiti otú ndị mmadụ si ele Pọl na ndị ọrụ ibe ya anya na ihe ha bụ n’eziokwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: site n’ịnata
  rationale: N’usoro ahịrịokwu a, διά na genitive na-egosi ọnọdụ dị iche iche ndị ozi ahụ na-agabiga. ‘Site n’ịnata’ na-eme ka Igbo bụrụ nke eke ma na-edobe nkwughachi ahụ.
- source_word: δόξης
  choice: nsọpụrụ
  rationale: N’ebe a, δόξα nwere nghọta mmekọrịta ọha nke ịkwanyere mmadụ ùgwù, ọ bụghị isi nghọta nkà mmụta okpukpe nke ‘ebube.’
- source_word: ἀτιμίας
  choice: enweghị nsọpụrụ
  rationale: Nke a na-eme ka ọdịiche ya na ‘nsọpụrụ’ doo anya, ma na-ezere ịgbakwunye echiche siri ike karịa okwu Grik ahụ.
- source_word: δυσφημίας
  choice: okwu ọjọọ
  rationale: Okwu ahụ nwere ike ịpụta nkwutọ ma ọ bụ akụkọ ọjọọ banyere mmadụ. ‘Okwu ọjọọ’ na-edobe ohere nghọta abụọ ahụ.
- source_word: εὐφημίας
  choice: okwu ọma
  rationale: Nke a bụ onye ogbo dị mma nye ‘okwu ọjọọ,’ ma na-echekwa ọdịdị antithetical nke δυσφημία/εὐφημία.
- source_word: ὡς
  choice: a na-ewere anyị dị ka
  rationale: Nke a na-eme ka echiche zoro ezo nke otú ndị ọzọ si ele Pọl na ndị ọrụ ibe ya anya pụta ìhè n’Igbo.
- source_word: πλάνοι
  choice: ndị nduhie
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ebubo na ha na-eduhie ndị ọzọ, ọ bụghị nanị ndị na-awagharị awagharị.
- source_word: ἀληθεῖς
  choice: ndị na-ekwu eziokwu
  rationale: N’Igbo nkịtị, nke a na-enye nghọta nke ịbụ ndị eziokwu n’ụzọ doro anya, n’agbanyeghị na ‘ndị bụ eziokwu’ ga-abụ nke nso n’usoro Grik.
theological_decisions:
- issue: Ma a ga-eme ka o doo anya na ‘ndị nduhie’ bụ otú ndị ọzọ si ele ha anya, ebe akụkụ nke abụọ na-ekwu ihe ha bụ n’eziokwu
  choice: ‘a na-ewere anyị dị ka ndị nduhie, ma anyị bụ ndị na-ekwu eziokwu’
  alternative: ‘dị ka ndị nduhie na ndị bụ eziokwu’
  rationale: Nhọrọ a na-echekwa esemokwu dị n’etiti ebubo ndị mmadụ na ezi ọnọdụ ndị ozi ahụ, na-enweghị ikweta na ebubo ahụ bụ eziokwu.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ụzọ atọ nke ahịrịokwu Grik na ọdịiche abụọ abụọ ya; e ji ‘anyị’ mee ihe n’akụkụ ikpeazụ n’ihi na ngwaa Igbo chọrọ ka onye a na-ekwu maka ya pụta ìhè site n’ọnọdụ gbara amaokwu a gburugburu.
