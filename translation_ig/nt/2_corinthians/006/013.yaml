revisions:
- from: Dị ka nzaghachi kwekọrọ na nke a[a]—ana m agwa unu okwu dị ka a na-agwa ụmụ—unu onwe unu megheekwa obi unu nke ọma[b].
  to: N’ịzaghachi n’otu aka ahụ[a]—ana m agwa unu okwu dị ka ụmụ—unu kwa, meenụ ka obi unu saa mbara[b].
  rationale: The revision makes the reciprocal “same return” explicit in natural Igbo, retains Paul’s unqualified address “as to children,” and uses an idiomatic heart-metaphor supported by the immediate context. It preserves the literal breadth metaphor in the footnote and keeps the footnote anchors with their respective source expressions.
