  yaml_path: translation/nt/2_corinthians/006/013.yaml
  text: In the same return—I speak as to children—be open wide[b][a], you also.
translation:
  language: ig
  text: N’ịzaghachi n’otu aka ahụ[a]—ana m agwa unu okwu dị ka ụmụ—unu kwa, meenụ ka obi unu saa mbara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “dị ka nkwụghachi,” “dị ka ụgwọ ọrụ kwekọrọ,” ma ọ bụ “dị ka mgbanwe hà nhata.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “ka unu saa mbara”; n’ebe a, n’ihi ihe dị n’amaokwu 11–12, ọ na-ekwu maka imeghe obi n’ịhụnanya na n’ịnabatakwa ndị ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιμισθίαν
  choice: nzaghachi kwekọrọ na nke a
  rationale: Okwu a na-egosi ihe a na-enye dịka nzaghachi kwekọrọ n'ihe e mere, ọ bụghị ụgwọ ego n'ọnọdụ a. Nke a na-egosipụta ọchịchọ Pọl ka ha zaghachi ịhụnanya na nnabata ya n'otu ụzọ ahụ.
- source_word: ὡς τέκνοις
  choice: dị ka a na-agwa ụmụ
  rationale: τέκνοις pụtara “ụmụ.” E tinyeghị “ụmụ m,” n'ihi na okwu Grik ahụ enweghị nnọchiaha nke na-egosi nwe, ọ bụ ezie na olu nne na nna pụtara ìhè n'ọnọdụ a.
- source_word: πλατύνθητε
  choice: megheekwa obi unu nke ọma
  rationale: N'ụzọ nkịtị, ọ pụtara “ka e mee unu sara mbara.” N'ọnọdụ amaokwu 11–12, ihe atụ ahụ gbasara obi na ịhụnanya sara mbara; Igbo a na-akọwa ihe atụ ahụ n'ụzọ doro anya ma dị ndụ.
- source_word: καὶ ὑμεῖς
  choice: unu onwe unu ... kwa
  rationale: '“Unu onwe unu” na “kwa” na-edobe nkwusi okwu na nzaghachi ibe ya: dịka Pọl na ndị ya meghere obi ha, ndị Kọrịnt kwesịkwara ime otu ahụ.'
- source_word: δὲ
  choice: —
  rationale: δὲ bụ njikọ dị nro ebe a. Kama itinye okwu oge dịka “ugbu a,” akara nkwụsị na usoro ahịrịokwu Igbo na-eburu mgbanwe dị nro ahụ n'enweghị mgbakwunye echiche oge.
theological_decisions:
- issue: Ma a ga-akpọ ha kpọmkwem “ụmụ m”
  choice: “dị ka a na-agwa ụmụ,” n'etinyeghị “m”
  alternative: “dị ka a na-agwa ụmụ m”
  rationale: Mmekọrịta Pọl na ha nwere ụda nna na ụmụ, ma “m” adịghị n'ihe odide Grik. Nhọrọ a na-echekwa ịhụnanya nke okwu ahụ n'etinyeghị ihe na-adịghị n'isi mmalite.
- issue: Ma a ga-eme ka “obi” pụta ìhè n'iwu πλατύνθητε
  choice: “megheekwa obi unu nke ọma”
  alternative: “unu onwe unu gbasapụkwanụ” ma ọ bụ “megheekwa onwe unu nke ọma”
  rationale: “Obi” bụ ihe a ghọtara site na amaokwu ndị gbara ya gburugburu, karịchaa 6:11–12. Ime ka ọ pụta ìhè na Igbo na-enye echiche nke ịhụnanya na nnabata, ọ bụghị mgbasawanye anụ ahụ, ma ndetu ala na-echekwa ọdịdị nkịtị nke okwu Grik.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. E ji “nzaghachi kwekọrọ” zere echiche nke ụgwọ ego, e jikwa “meghee obi” mee ka ihe atụ ahụ bụrụ nke ndị na-agụ Igbo ga-aghọta ozugbo. Akara ndetu [a] na [b] dị n'ahịrị isi.
