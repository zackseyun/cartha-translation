source:
  edition: SBLGNT
  text: ἐν ἁγνότητι, ἐν γνώσει, ἐν μακροθυμίᾳ, ἐν χρηστότητι, ἐν πνεύματι ἁγίῳ, ἐν ἀγάπῃ ἀνυποκρίτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/006.yaml
  text: in purity[a], in knowledge, in patience, in kindness, in the Holy Spirit, in sincere love,
translation:
  language: ig
  text: n’ịdị ọcha, n’ihe ọmụma, n’ogologo ntachi obi, n’obiọma, n’Mmụọ Nsọ,[a] n’ịhụnanya na-enweghị ihu abụọ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’mmụọ dị nsọ,” ma ọ bụrụ na a ghọta ya dịka àgwà dị nsọ nke mmadụ, ọ bụghị Mmụọ Nsọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγνότητι
  choice: ịdị ọcha
  rationale: Na-egosi ịdị ọcha n’omume na n’uche n’ozuzu ya, n’emeghị ka ihe ọ pụtara bụrụ naanị izere mmehie mmekọahụ.
- source_word: γνώσει
  choice: ihe ọmụma
  rationale: Na-echekwa echiche sara mbara nke ịma ihe, gụnyere nghọta bara uru n’ozi.
- source_word: μακροθυμίᾳ
  choice: inwe ogologo ntachi obi
  rationale: Na-egosi ndidi na-adịte aka n’ebe nsogbu ma ọ bụ ndị mmadụ nọ.
- source_word: χρηστότητι
  choice: obiọma
  rationale: Okwu Igbo a na-egosi omume ọma na mmesapụ obi n’ebe ndị ọzọ nọ.
- source_word: πνεύματι ἁγίῳ
  choice: Mmụọ Nsọ
  rationale: N’ojiji Pọl na n’ọnọdụ okwu a, o yikarịrị ka ọ na-ezo aka n’Mmụọ Nsọ nke Chineke.
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: ịhụnanya na-enweghị ihu abụọ
  rationale: Nsụgharị a na-ekwupụta ịhụnanya na-enweghị aghụghọ ma ọ bụ ime ka à ga-asị.
- source_word: ἐν
  choice: n’
  rationale: Ikwughachi n’ na-echekwa usoro na ụda ndepụta Grik, ma na-ahapụ echiche nke ọnọdụ, ụzọ, ma ọ bụ ihe e ji eme ihe ka ọ ghara ịdị warara.
theological_decisions:
- issue: Ihe πνεύματι ἁγίῳ na-ezo aka na ya
  choice: Mmụọ Nsọ nke Chineke
  alternative: mmụọ dị nsọ, ya bụ, àgwà ma ọ bụ ọnọdụ ime mmụọ dị nsọ nke mmadụ
  rationale: Ojiji Pọl na gburugburu okwu ahụ na-akwado Mmụọ Nsọ dịka ihe o yikarịrị ka e bu n’obi; ihe odide ala peeji na-echekwa nkọwa ọzọ nke ụtọasụsụ nwere ike ikwe.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara usoro ndepụta ahụ na nkwughachi n’; e ji ‘na-enweghị ihu abụọ’ mee ka echiche ἀνυπόκριτος doo anya n’asụsụ nkịtị.
