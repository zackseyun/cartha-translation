base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/005.yaml
  text: in beatings, in imprisonments, in riots, in labors, in sleepless nights, in fastings,
translation:
  language: ig
  text: n’otiti, n’ụlọ mkpọrọ, n’ọgba aghara, n’ịrụsi ọrụ ike, n’ịmụrụ anya n’abalị, n’ibu ọnụ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: ịnọ n’enweghị nri.'
    reason: Okwu Grik ahụ nwere ike izo aka n’ibu ọnụ e bu n’obi ma ọ bụ, n’ebe a, n’oge mmadụ na-enweghị nri.
lexical_decisions:
- source_word: πληγαῖς
  choice: otiti ihe
  rationale: Na-egosi iti mmadụ ihe ma ọ bụ ihe otiti ọ natara, dịka ọtụtụ aha ihe isi ike ndị ọzọ dị n’ahịrịokwu a.
- source_word: φυλακαῖς
  choice: ụlọ mkpọrọ
  rationale: Ọ bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị eme ihe maka mkpọrọ ma ọ bụ ịnọ na mkpọrọ.
- source_word: ἀκαταστασίαις
  choice: ọgba aghara
  rationale: Na-echekwa echiche nke ọgba aghara, mkpọtụ, ma ọ bụ nnupụisi ọha na eze n’enweghị ime ka ọ bụrụ naanị otu ụdị ihe merenụ.
- source_word: κόποις
  choice: ịrụsi ọrụ ike
  rationale: Na-egosi ọrụ siri ike nke na-eweta ike ọgwụgwụ, nke bụ isi echiche κόπος.
- source_word: ἀγρυπνίαις
  choice: ịmụ anya abalị
  rationale: Ọ bụ ụzọ Igbo dị ndụ e si ekwu ịnọ n’amụghị ụra n’abalị, ma ọ bụ n’ihi ọrụ ma ọ bụ ihe isi ike.
- source_word: νηστείαις
  choice: ibu ọnụ
  rationale: Ọ bụ nkọwa Igbo a na-ahụkarị maka ịghara iri nri; e debere ohere nghọta nke ma ọ bụ ibu ọnụ e bu n’uche ma ọ bụ ịnọ n’enweghị nri na nkọwa ala peeji.
theological_decisions:
- issue: Ma νηστείαις ọ pụtara ibu ọnụ nke mmadụ họọrọ ma ọ bụ agụụ n’ihi enweghị nri
  choice: ibu ọnụ[a]
  alternative: ịnọ n’agụụ / enweghị nri
  rationale: Isi okwu ahụ na-akọwakarị ibu ọnụ, ma n’usoro ihe isi ike Pọl depụtara, ụfọdụ na-aghọta ya dịka ịnọ n’enweghị nri. E debeghị otu nghọta ahụ naanị ya; a kọwara ọdịiche ahụ n’ala peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara usoro ndepụta na nkwughachi ‘n’…’ nke ederede Grik, ebe a họọrọ okwu ndị mmadụ na-eji kwa ụbọchị kama okwu ụka pụrụ iche.
