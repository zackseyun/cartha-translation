  text: διὸ ἐξέλθατε ἐκ μέσου αὐτῶν, καὶ ἀφορίσθητε, λέγει κύριος, καὶ ἀκαθάρτου μὴ ἅπτεσθε· κἀγὼ εἰσδέξομαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: ig
  text: Ya mere, sinụ n’etiti ha pụta, dịnụ iche[a], ka Onyenwe anyị na-ekwu; emetụkwala ihe na-adịghị ọcha[b][c] aka; mụ onwe m ga-anabatakwa unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka e doo unu iche” ma ọ bụ “kewapụnụ onwe unu.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “emetụkwala ihe ọ bụla na-adịghị ọcha aka.”
    reason: lexical_alternative
  - marker: c
    text: N’ebe a, Pọl na-ekwughachi okwu amụma Agba Ochie, karịsịa Aịzaya 52:11.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: Ya mere
  rationale: Na-egosi na ihe a bụ nkwubi okwu sitere n’arụmụka bu ya ụzọ; ọ bụkwa okwu Igbo doro anya ma dị n’usoro.
- source_word: ἐξέλθατε ἐκ μέσου αὐτῶν
  choice: sinụ n’etiti ha pụta
  rationale: Na-echekwa iwu e nyere ọtụtụ mmadụ ka ha pụọ n’etiti ndị ahụ, ma na-ada ka Igbo ebumpụta ụwa.
- source_word: ἀφορίσθητε
  choice: dịnụ iche
  rationale: Na-egosipụta iwu passive ka ha nọgide bụrụ ndị e kewapụrụ iche, n’ebughị ụzọ tinye echiche ịkpa ókè nke na-adịghị n’amaokwu ahụ.
- source_word: λέγει κύριος
  choice: ka Onyenwe anyị kwuru
  rationale: Ọ bụ usoro okwu amụma a na-aghọta nke ọma n’Igbo; ‘Onyenwe anyị’ na-anọchi κύριος n’Agba Ọhụrụ n’enweghị ibubata aha Chineke Hibru n’ime ederede Grik.
- source_word: ἀκαθάρτου μὴ ἅπτεσθε
  choice: emetụkwala ihe na-adịghị ọcha aka
  rationale: Na-echekwa ihe atụ nke imetụ ihe aka na echiche nke adịghị ọcha, n’akọwaghị kpọmkwem ụdị ihe ahụ.
- source_word: κἀγὼ εἰσδέξομαι ὑμᾶς
  choice: mụ onwe m ga-anabatakwa unu
  rationale: ‘Mụ onwe m’ na-egosipụta ntakịrị nkwusi ike dị na κἀγώ, ebe ‘ga-anabata unu’ na-egosipụta nnabata ọma nke εἰσδέχομαι.
theological_decisions:
- issue: Nsụgharị κύριος n’okwu amụma nwere ndabere n’Agba Ochie
  choice: Onyenwe anyị
  alternative: Yahweh; Nna Ukwu
  rationale: Ederede Grik kwuru κύριος. ‘Onyenwe anyị’ na-echekwa okwu Agba Ọhụrụ ahụ, kama ịgbanwe ya ozugbo ka ọ bụrụ aha Chineke Hibru.
- issue: Ihe iwu nkewapụ pụtara
  choice: dịnụ iche
  alternative: kewapụnụ onwe unu; ka e doo unu iche
  rationale: Nke a na-echekwa iwu ka ndị kwere ekwe dị iche n’ihe na-emerụ ha, ma ọ naghị etinye ozizi na ha aghaghị izere mmekọrịta niile ha na ndị na-abụghị ndị kwere ekwe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E tinyere akara ntụaka ụkwụ ozugbo n’akụkụ okwu ha na-akọwa, ma debe ụdị okwu amụma nke amaokwu ahụ.
