    issue: «na-ejekwa ije n’etiti ha» anaghị egosipụta ọdịnihu nke ἐμπεριπατήσω n’ụzọ kpọmkwem.
    rationale: Na Greek, Ἐνοικήσω na ἐμπεριπατήσω bụ ngwaa ọdịnihu abụọ e jikọrọ ọnụ. «Jeekwa ije» n’azụ «M ga-ebi» na-edobe ọdịnihu ahụ n’Igbo.
  - severity: low
    issue: Ihe odide ala peeji b kpọrọ ἐν «okwu njikọ».
    rationale: ἐν bụ mbuụzọokwu (preposition), ọ bụghị okwu njikọ; mmezi a na-eme ka nkọwa asụsụ ahụ zie ezi.
