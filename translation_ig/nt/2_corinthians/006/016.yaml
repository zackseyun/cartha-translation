id: 2CO.6.16
reference: 2 Corinthians 6:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: ig
  text: 'Olee nkwekọrịta[a] dị n’etiti ụlọ nsọ Chineke na arụsị? N’ihi na anyị bụ ụlọ nsọ nke Chineke dị ndụ, dị nnọọ ka Chineke kwuru, sị: “M ga-ebi n’etiti ha[b], jeekwa ije n’etiti ha; m ga-abụ Chineke ha, ha ga-abụkwa ndị m.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ịdị n’otu” ma ọ bụ “inwe otu ebumnobi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “M ga-ebi n’ime ha.” Mbuụzọokwu Grik a nwere ike ịpụta “n’ime” ma ọ bụ “n’etiti”; ebe a, okwu banyere obodo ọgbụgba ndụ na-akwado “n’etiti ha.”
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: nkwekọrịta
  rationale: Okwu a na-egosi nkwekọrịta, nkwenye, ma ọ bụ ịdị n’otu. “Nkwekọrịta” bụ okwu Igbo doro anya nke na-egosipụta ajụjụ Pọl banyere ihe abụọ na-ekwesịghị ijikọ.
- source_word: ναῷ / ναὸς
  choice: ụlọ nsọ
  rationale: ναός na-ezo aka n’ebe nsọ nke Chineke, ọ bụghị nanị ogige niile gbara ụlọ ahụ gburugburu. “Ụlọ nsọ” bụ okwu Igbo a na-aghọta nke ọma ma na-edobe ihe atụ okpukpe dị n’amaokwu ahụ.
- source_word: εἰδώλων
  choice: arụsị
  rationale: N’ebe a, okwu ahụ pụtara arụsị ndị a na-efe ofufe, ọ bụghị naanị ihe oyiyi nkịtị.
- source_word: ζῶντος
  choice: dị ndụ
  rationale: Ọ na-akọwa Chineke dị ka “Chineke dị ndụ,” na-eme ka ọdịiche dị n’etiti ya na arụsị ndị na-enweghị ndụ pụta ìhè.
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: dị nnọọ ka Chineke kwuru
  rationale: “Dị nnọọ ka” na-edobe ike ntụnyere nke καθώς, ebe “kwuru” na-asụgharị εἶπεν n’ụzọ nkịtị ma dị mfe.
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: M ga-ebi n’etiti ha
  rationale: ἐν nwere ike ịpụta “n’ime” ma ọ bụ “n’etiti.” N’ọnọdụ ọgbụgba ndụ a nke na-ekwu banyere ndị Chineke dịka otu obodo, “n’etiti ha” dabara nke ọma ma kwekọọ na okwu na-esote banyere ije n’etiti ha.
- source_word: ἐμπεριπατήσω
  choice: na-ejekwa ije n’etiti ha
  rationale: Nke a na-edobe ihe oyiyi doro anya nke Chineke na-eje ije n’etiti ndị ya dịka ihe ịrịba ama nke ọnụnọ ya.
- source_word: ἔσομαι αὐτῶν θεός
  choice: m ga-abụ Chineke ha
  rationale: Nke a bụ usoro okwu ọgbụgba ndụ a maara nke ọma, na-egosipụta mmekọrịta dị n’etiti Chineke na ndị ya.
- source_word: λαός
  choice: ndị
  rationale: N’usoro okwu “ndị m,” ọ na-egosi ndị Chineke dịka otu obodo, nke kwekọrọ na λαός n’ọnọdụ ọgbụgba ndụ.
theological_decisions:
- issue: Ihe atụ nke ọgbakọ dịka ụlọ nsọ
  choice: anyị bụ ụlọ nsọ nke Chineke dị ndụ
  alternative: anyị bụ otu ụlọ nsọ nke Chineke dị ndụ
  rationale: Ọ bụ ezie na ναὸς enweghị akara aha n’asụsụ Grik, n’ọnọdụ predicate a ọ na-akọwa njirimara ndị kwere ekwe dịka ụlọ nsọ Chineke. Nsụgharị a na-edobe echiche ahụ dịka nke metụtara ha niile ọnụ, ọ bụghị onye ọ bụla iche.
- issue: Okwu banyere ebe Chineke ga-ebi
  choice: M ga-ebi n’etiti ha
  alternative: M ga-ebi n’ime ha
  rationale: ἐν αὐτοῖς nwere ike ịkwado nsụgharị abụọ ahụ. N’ihi na okwu ahụ na-ekwu banyere obodo ọgbụgba ndụ ma jikọta ya na “ije n’etiti ha,” a họọrọ “n’etiti ha,” ebe e debere “n’ime ha” n’okpuru amaokwu iji ghara iwepụ nghọta ọzọ Grik ahụ nwere ike inwe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Ụlọ nsọ,” “arụsị,” na usoro “Chineke ha… ndị m” na-edobe ụda Akwụkwọ Nsọ na nke ọgbụgba ndụ n’enweghị ịgbakwunye nkọwa otu ụka. E tinyere akara nkọwa [a] na [b] kpọmkwem n’ebe okwu ndị ha na-akọwa dị.
