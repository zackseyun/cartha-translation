source:
  edition: SBLGNT
  text: ὡς ἀγνοούμενοι καὶ ἐπιγινωσκόμενοι, ὡς ἀποθνῄσκοντες καὶ ἰδοὺ ζῶμεν, ὡς παιδευόμενοι καὶ μὴ θανατούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/009.yaml
  text: as unknown and yet well known[a], as dying and behold, we live, as disciplined and not put to death[b],
translation:
  language: ig
  text: dị ka ndị a na-amaghị anyị, ma a na-amata anyị nke ọma[a]; dị ka ndị na-anwụ anwụ, ma lee, anyị dị ndụ; dị ka ndị a na-adọ aka ná ntị[b], ma a naghị egbu anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ma a na-amata anyị.” Okwu Grik ahụ nwere ike imesi ike na a matara ma ọ bụ kweta na anyị nke ọma, ọ bụghị naanị na anyị bụ ndị a ma ama.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “dị ka ndị a na-azụ” ma ọ bụ “dị ka ndị a na-ata ahụhụ iji gbazie ha.” Okwu Grik ahụ nwere ike ịpụta ọzụzụ na-akpụ mmadụ ma ọ bụ mgbazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: dị ka
  rationale: Ọ na-edobe usoro okwu atọ Pọl ji akọwa ọnọdụ ndị yiri ka ha na-emegiderịta onwe ha.
- source_word: ἀγνοούμενοι
  choice: ndị a na-amaghị
  rationale: Ọ na-egosi na ndị ọzọ amaghị ma ọ bụ amataghị ha, ma na-emegide ἐπιγινωσκόμενοι n'ụzọ doro anya.
- source_word: ἐπιγινωσκόμενοι
  choice: a maara anyị nke ọma
  rationale: Ọ na-enye echiche nke ịbụ ndị a matara nke ọma ma ọ bụ ndị a nabatara na amata, ọ bụghị naanị ịbụ ndị ama ama.
- source_word: ἀποθνῄσκοντες
  choice: ndị na-anwụ anwụ
  rationale: Ọ na-egosi ọnọdụ ọnwụ na-aga n'ihu ma na-edobe ọdịiche ya na okwu e mesịrị bụ́ θανατούμενοι.
- source_word: ἰδοὺ
  choice: lee
  rationale: Ọ bụ okwu nkịtị ma dị ùgwù n'Igbo nke na-akpọ onye na-agụ ya ka o lebara ihe na-atụ n'anya anya.
- source_word: ζῶμεν
  choice: anyị dị ndụ
  rationale: Nke a bụ ụzọ okike Igbo si kwuo na mmadụ ka na-adị ndụ, ma ọ na-eme ka esemokwu ahụ sie ike.
- source_word: παιδευόμενοι
  choice: ndị a na-enye ọzụzụ ịdọ aka ná ntị
  rationale: Okwu a na-edobe ma echiche nke ọzụzụ na nke mgbazi, n'etinyeghị echiche doro anya nke ntaramahụhụ.
- source_word: μὴ θανατούμενοι
  choice: a dịghị egbu anyị
  rationale: Ọ na-edobe olu nnara nke Grik ma na-ekwu n'ụzọ Igbo doro anya na ahụhụ ahụ erughị n'ọnwụ.
theological_decisions:
- issue: Ihe παιδευόμενοι pụtara n'ihe gbasara ahụhụ
  choice: ndị a na-enye ọzụzụ ịdọ aka ná ntị
  alternative: ndị a na-ata ahụhụ iji gbazie ha; ndị a na-azụ
  rationale: Nhọrọ a na-ahapụ ohere na ahụhụ ahụ nwere ike ịbụ ọzụzụ ma ọ bụ mgbazi, n'ekwughị kpọmkwem na ọ bụ ntaramahụhụ Chineke.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ usoro nkwughachi “dị ka ... ma ...” iji chekwaa ike na esemokwu dị n'usoro okwu Grik. Akara nkọwa [a] na [b] pụtara n'ahịrịokwu ahụ.
