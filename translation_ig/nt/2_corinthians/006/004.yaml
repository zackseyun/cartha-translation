  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ⸀συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι· ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/004.yaml
  text: 'but in everything commending ourselves as God''s servants: in great endurance[a], in afflictions, in hardships, in distresses[c][b],'
translation:
  language: ig
  text: 'Ma n’ihe niile[a], anyị na-egosi na anyị bụ ndị na-ejere Chineke ozi[b]: n’oké ntachi obi[c], n’ahụhụ, n’ihe isi ike, n’ime mkpagide.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ụzọ niile.” Okwu Grik ahụ sara mbara; ọ pụrụ izo aka n’ọnọdụ niile ma ọ bụ n’ụzọ niile ha si egosi ihe ha bụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “dị ka ndị ozi Chineke.” Okwu Grik bụ διάκονοι na-emesi ije ozi ike; ọ pụtaghị n’onwe ya na a na-ekwu maka ọkwa ọchịchị pụrụ iche.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “site n’oké ntachi obi.” “N’” e ji mee ihe n’ebe a na-egosipụta usoro okwu Grik, nke na-ekwughachi ἐν n’usoro ahụhụ ndị a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti okwu a na nkwupụta na-adịghị mma nke bu ya ụzọ; “Ma” bụ ụzọ Igbo dị mfe ma kwekọọ n’ebe a.
- source_word: ἐν παντί
  choice: n’ihe niile
  rationale: Ọ na-echekwa obosara nke okwu Grik ahụ, nke nwere ike ịpụta n’ọnọdụ niile ma ọ bụ n’ụzọ niile, n’ebughị ụzọ kpebie naanị otu n’ime ha.
- source_word: συνιστάνοντες ἑαυτούς
  choice: anyị na-egosi onwe anyị
  rationale: N’ebe a, συνίστημι pụtara igosi ma ọ bụ mee ka o doo anya ihe mmadụ bụ. Okwu a dị n’Igbo nkịtị karịa ntụgharị nke nwere ike iyi ka ha na-eto onwe ha.
- source_word: ὡς θεοῦ διάκονοι
  choice: dị ka ndị na-ejere Chineke ozi
  rationale: διάκονοι na-emesi ije ozi ike. Nsụgharị a doro ndị na-agụ akwụkwọ anya ma zere ime ka okwu ahụ bụrụ aha ọkwa ọchịchị n’ọgbakọ.
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: n’oké ntachi obi
  rationale: ὑπομονή bụ ịnọgide na-eguzosi ike mgbe a na-ata ahụhụ, ọ bụghị naanị ichere nwayọọ. “Oké” na-egosipụta πολλῇ n’ụzọ Igbo dị ndụ.
- source_word: θλίψεσιν
  choice: n’ahụhụ
  rationale: θλῖψις na-egosi ahụhụ ma ọ bụ mkpagbu siri ike; “ahụhụ” bụ okwu sara mbara, doro anya ma nwee ibu kwesịrị ekwesị.
- source_word: ἀνάγκαις
  choice: n’ọnọdụ ndị siri ike
  rationale: N’usoro a, ἀνάγκαι na-ekwu banyere ọnọdụ ndị na-amanye ma na-esiri mmadụ ike, ọ bụghị naanị mkpa ihe onwunwe.
- source_word: στενοχωρίαις
  choice: n’ọnọdụ ndị na-akpagide mmadụ
  rationale: στενοχωρία nwere echiche nke ịnọ n’ọnọdụ a kpagidere mmadụ ma ọ bụ ebe nsogbu mechiri ya ụzọ. Nsụgharị nkọwa a na-echekwa ike okwu ahụ ma kewapụ ya na okwu abụọ bu ya ụzọ.
theological_decisions:
- issue: Otú e si tụgharịa διάκονοι n’okwu gbasara ije ozi
  choice: ndị na-ejere Chineke ozi
  alternative: ndị ozi Chineke
  rationale: Okwu Grik ahụ na-akọwa Pọl na ndị ya na ha na-arụkọ ọrụ dị ka ndị na-ejere Chineke ozi; ọ naghị achọ ka e were ya dị ka aha ọkwa pụrụ iche n’ọgbakọ. Nhọrọ a na-echekwa echiche ije ozi ahụ n’enweghị itinye nkọwa ụka e mesịrị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ndepụta ahụ na nkwughachi “n’” dịka o kwere mee, ma jiri nkọwa dị ndụ maka στενοχωρίαις ka echiche nke nrụgide na mkpagide ghara ịla n’iyi.
