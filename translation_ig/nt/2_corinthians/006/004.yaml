  verdict: revise
  source_fidelity: 'Nsụgharị ahụ na-esokarị SBLGNT nke ọma: “Ma,” “n’ihe niile,” na ndepụta nke ἐν na-egosi usoro na ọdịiche dị n’amaokwu ahụ. Otú ọ dị, “anyị na-egosi onwe anyị” adịghị ekwupụta nke ọma echiche συνιστάνοντες ἑαυτούς, ya bụ igosi/prove onwe ha dị ka ndị na-ejere Chineke ozi. “anyị na-egosi na anyị bụ” na-eme ka njikọ ahụ doo anya n’enweghị echiche nke ito onwe ha n’ụzọ na-ekwesịghị ekwesị. E kwesịkwara idobe otu preposition ἐν n’ihu ihe ọ bụla dị na ndepụta ahụ; “na n’ọnọdụ...” ugbu a na-agbaji nkwughachi a.'
  naturalness: Igbo ahụ bụ Standard Igbo, dị mfe nghọta, ma nwee ụda kwesịrị ekwesị. “ọnọdụ ndị na-akpagide mmadụ” bụ nkọwa ziri ezi mana ọ dị ogologo; “n’ime mkpagide” dị mkpirikpi, bụrụkwa okwu Igbo nkịtị nke na-ejide στενοχωρίαις dịka ọnọdụ nrụgide/imechi ụzọ. “n’ọnọdụ ndị siri ike” dị mma maka ἀνάγκαις, mana “n’ihe isi ike” na-arụ ọrụ nke ọma karịa dịka akụkụ nke ndepụta ahụ.
  terminology: '“ndị na-ejere Chineke ozi” na-anọchi ὡς θεοῦ διάκονοι nke ọma, na-enweghị ibubata echiche ọkwa ụka. “oké ntachi obi” dabara nke ọma maka ὑπομονῇ πολλῇ; “ahụhụ” dabara maka θλίψεσιν. A gbanwere ihe abụọ ikpeazụ ka ha bụrụ ndepụta dị mkpirikpi ma dị iche: “n’ihe isi ike” maka ἀνάγκαις na “n’ime mkpagide” maka στενοχωρίαις.'
