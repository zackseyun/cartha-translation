id: 2CO.6.15
reference: 2 Corinthians 6:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίς δὲ συμφώνησις ⸀Χριστοῦ πρὸς Βελιάρ, ἢ τίς μερὶς πιστῷ μετὰ ἀπίστου;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: ig
  text: Gịnịkwa bụ ndakọrịta dị n’etiti Mesaịa na Belịa? Ma ọ bụ, olee òkè onye kwere ekwe na onye na-ekweghị ekwe nwere ọnụ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Belịa: N’asụsụ Grik, aha a bụ Βελιάρ; a na-ejikwa ụdị aha ọzọ bụ́ “Belial.”'
    reason: alternative_reading
lexical_decisions:
- source_word: συμφώνησις
  choice: nkwekọrịta
  rationale: Okwu a na-egosi ịdị n’otu ma ọ bụ ịdị na-adaba n’etiti ndị abụọ; “nkwekọrịta” na-enye echiche ahụ n’Igbo doro anya ma dabara n’ajụjụ ntụnyere a.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: N’ebe a, Χριστός na-arụ ọrụ dị ka aha-ọrụ e ji akọwa Onye ahụ, ọ bụghị naanị dị ka aha mmadụ; “Mesaịa” na-echekwa nghọta ahụ.
- source_word: Βελιάρ
  choice: Belịa
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị dabara n’usoro mkpọpụta na odide Igbo, nke na-anọgide nso n’ụdị Grik Βελιάρ.
- source_word: μερίς
  choice: òkè ... nwekọrọ
  rationale: μερίς pụtara òkè ma ọ bụ ihe mmadụ nwere na ya. Nkebi okwu “òkè ... nwekọrọ” na-egosi òkè ha nwere ọnụ n’Igbo dị ndụ.
- source_word: πιστῷ
  choice: onye kwere ekwe
  rationale: Adjective a na-anọchi aha mmadụ n’ebe a, ya bụ, onye e ji okwukwe mara.
- source_word: ἀπίστου
  choice: onye na-ekweghị ekwe
  rationale: N’ọdịiche ya na πιστῷ, okwu a na-ezo aka n’onye na-ekweghị ekwe, ọ bụghị nanị onye na-adịghị akwụwa aka ọtọ.
- source_word: πρὸς
  choice: dị n’etiti ... na ...
  rationale: Mgbe ọ so συμφώνησις, ọ na-egosi mmekọrịta dị n’etiti akụkụ abụọ; usoro a bụ Igbo eke.
- source_word: μετὰ
  choice: nwekọrọ
  rationale: Preposition a na-egosi isoro onye ọzọ nwee ihe; “nwekọrọ” na-egosipụta mkpakọrịta ahụ n’ụzọ dị mkpirikpi.
- source_word: δὲ
  choice: -kwa
  rationale: δὲ na-aga n’ihu n’usoro ajụjụ ndị bu ya ụzọ. Mgbakwunye “-kwa” na-egosi njikọ ahụ n’Igbo n’etinyeghị esemokwu siri ike.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ọdịiche e mere n’etiti Χριστός na Belịa, okwu ahụ pụtara aha-ọrụ “Mesaịa.” Nhọrọ a na-echekwa ọrụ ya dị ka aha-ọrụ n’agbanyeghị na “Kraịst” bụkwa ụdị a maara nke ọma.
- issue: Njirimara Βελιάρ
  choice: Belịa dị ka aha nke onye ọjọọ e tinyere n’ọdịiche megide Mesaịa
  alternative: Belial
  rationale: E debere ya dị ka aha nkịtị e dere site n’ụdị Grik, n’etinyeghị nkọwa ọzọ n’ahịrịokwu ahụ. Ihe odide ala peeji na-edebe ụdị ọzọ ndị na-agụ akwụkwọ nwere ike ịma.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ajụjụ abụọ na-aga n’usoro chekwaa ike nke ajụjụ nkwupụta Pọl, ma e zere ịgbakwunye nkọwa okpukpe na-adịghị na isi mmalite.
