revisions:
- from: Gịnịkwa bụ nkwekọrịta dị n’etiti Mesaịa na Belịa? Ma ọ bụ, olee òkè onye kwere ekwe na onye na-ekweghị ekwe nwekọrọ?[a]
  to: Gịnịkwa bụ ndakọrịta dị n’etiti Mesaịa na Belịa? Ma ọ bụ, olee òkè onye kwere ekwe na onye na-ekweghị ekwe nwere ọnụ?[a]
  rationale: The revision replaces a potentially contractual term with ndakọrịta, preserving the concord/harmony sense of συμφώνησις, and recasts the second question with nwere ọnụ for natural Standard Igbo while retaining the Greek sense of a believer’s share with an unbeliever. No theological interpretation or additional historical detail has been introduced.
  reviewer_model: gpt-5.6-terra
