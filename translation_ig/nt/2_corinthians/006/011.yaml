id: 2CO.6.11
reference: 2 Corinthians 6:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τὸ στόμα ἡμῶν ἀνέῳγεν πρὸς ὑμᾶς, Κορίνθιοι, ἡ καρδία ἡμῶν πεπλάτυνται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/011.yaml
  text: Our mouth has been opened to you[a], Corinthians[b]; our heart has been widened.
translation:
  language: ig
  text: Ọnụ anyị ghe oghe nye unu[a], unu ndị Kọrịnt; obi anyị sara mbara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ e si ekwu ya nke ọma karịa, “Anyị agwala unu okwu n’ezoghị ọnụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “e meela ka obi anyị gbasaa,” ma ọ bụ, “obi anyị ghe oghe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στόμα
  choice: ọnụ
  rationale: “Ọnụ” na-edobe ihe atụ Pọl ji akụkụ ahụ mee, ma na-eme ka njikọ dị n’etiti “ọnụ” na “obi” nọgide doo anya.
- source_word: ἀνέῳγεν
  choice: ghe oghe
  rationale: Nke a bụ okwu Igbo dị ebumpụta ụwa nke na-egosi ọnọdụ dị ugbu a nke sitere n’ihe emere tupu ya, kwekọọkwa n’ụdị perfect nke Grik, ma debe ihe atụ nke ọnụ e meghere.
- source_word: πρὸς ὑμᾶς
  choice: nye unu
  rationale: N’ebe a, ọ na-egosi na okwu ahụ chere ihu kpọmkwem n’ebe ndị a na-agwa okwu nọ; “nye unu” bụ ụzọ Igbo doro anya si kwuo ya.
- source_word: Κορίνθιοι
  choice: unu ndị Kọrịnt
  rationale: Ọ bụ ịkpọ ndị a na-agwa okwu aha ozugbo. “Unu ndị Kọrịnt” bụ okwu Igbo dị mfe ma na-edobe arịrịọ Pọl chere ha ihu.
- source_word: καρδία
  choice: obi
  rationale: “Obi” bụ okwu Igbo a na-ejikarị akọwa ebe mmetụta na ọchịchọ mmadụ si apụta, ma na-edobekwa ihe atụ mbụ ahụ.
- source_word: πεπλάτυνται
  choice: sara mbara
  rationale: “Sara mbara” na-edobe echiche nke ịgbasa ma ọ bụ ime ka ihe buru ibu, ma gosikwa ọnọdụ obi Pọl dị ugbu a n’ebe ha nọ.
theological_decisions:
- issue: Ihe atụ nke ọnụ meghere na obi sara mbara
  choice: 'E debere ihe atụ abụọ ahụ n’ahịrịokwu bụ isi: “Ọnụ anyị ghe oghe” na “obi anyị sara mbara.”'
  alternative: “Anyị agwala unu okwu n’ezoghị ọnụ, unu ndị Kọrịnt; anyị gheere unu obi anyị oghe.”
  rationale: Ihe odide Grik ji ihe atụ abụọ metụtara akụkụ ahụ kwuo okwu. Idebe ha na-echekwa usoro okwu na ike okwu Pọl, ebe nkọwa dị mfe karị dị n’okpuru ala na-enyere onye na-agụ aka n’enweghị ịkọwa ihe karịrị ihe odide ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ghe oghe” na “sara mbara” bụ okwu ndị nkịtị ga-aghọta, ma ha ka na-edobe ihe atụ na ọnọdụ perfect dị n’asụsụ Grik. E tinyere akara [b] n’akụkụ “obi anyị sara mbara,” ebe nkọwa ala ya metụtara, kama idowe ya n’akụkụ aha ndị Kọrịnt.
