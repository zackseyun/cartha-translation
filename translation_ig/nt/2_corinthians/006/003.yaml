revisions:
- from: Anyị adịghị enye ihe ọ bụla ga-eme ka onye ọ bụla sụọ ngọngọ[a], ka a ghara ịta ozi anyị ụta[b].
  to: Anyị anaghị eme ka onye ọ bụla sụọ ngọngọ n’ụzọ ọ bụla[a], ka a ghara ịta ozi ahụ ụta[b].
  rationale: The revision renders the comprehensive force of ἐν μηδενί with ‘n’ụzọ ọ bụla,’ while retaining the metaphor of stumbling. It uses the definite contextual expression ‘ozi ahụ’ for ἡ διακονία and replaces the expanded second footnote with a direct lexical alternative for μωμηθῇ. The causal wording ‘eme ka ... sụọ ngọngọ’ is idiomatic Igbo and faithfully expresses the practical force of ‘giving no cause for stumbling.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:54Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the comprehensive avoidance of conduct that could cause stumbling and the purpose that the ministry not receive blame. However, it obscures ἐν μηδενί ('in anything/in any respect') by making 'ihe ọ bụla' the object, and 'ozi anyị' adds a possessive absent from the Greek, whose definite article refers to the ministry under discussion.
  naturalness: The wording is broadly understandable Standard Igbo. Recasting the first clause with ‘n’ụzọ ọ bụla’ expresses the Greek comprehensive sphere more naturally. ‘ịta ... ụta’ is an idiomatic and suitable passive-equivalent expression.
  terminology: ‘sụọ ngọngọ’ appropriately retains the stumbling image of προσκοπή. ‘Ozi ahụ’ is a natural rendering of ἡ διακονία here and preserves its definite, contextual reference without adding possessive emphasis or later church-office connotations.
  issues:
  - severity: medium
    issue: The phrase ‘ihe ọ bụla’ is used as the direct object of ‘enye’.
    rationale: In the Greek, μηδεμίαν ... προσκοπήν is ‘no stumbling/offense,’ while ἐν μηδενί means ‘in nothing/in any respect.’ The draft's syntax instead says that no thing is given which makes someone stumble, and does not directly represent the latter phrase.
  - severity: low
    issue: ‘ozi anyị’ supplies ‘our’ for ἡ διακονία.
    rationale: The immediate context makes Paul and his coworkers the ministers, but the Greek says ‘the ministry,’ not explicitly ‘our ministry.’ ‘Ozi ahụ’ preserves the definite reference without adding a possessive.
  - severity: medium
    issue: Footnote b is too interpretive and does not function as a close lexical alternative.
    rationale: ‘ime ka ozi anyị ghara ịbụ nke a na-akwanyere ùgwù’ changes passive blame/discredit into an expanded statement about respectability and also repeats the added possessive. A direct alternative should retain the sense of criticism or discredit.
  revised_text: Anyị anaghị eme ka onye ọ bụla sụọ ngọngọ n’ụzọ ọ bụla[a], ka a ghara ịta ozi ahụ ụta[b].
  revised_footnotes:
