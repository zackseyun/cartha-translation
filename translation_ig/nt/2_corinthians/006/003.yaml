  text: giving no cause for stumbling in anything[a], so that the ministry may not be blamed[b],
translation:
  language: ig
  text: Anyị anaghị eme ka onye ọ bụla sụọ ngọngọ n’ụzọ ọ bụla[a], ka a ghara ịta ozi ahụ ụta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Anyị anaghị akpasu onye ọ bụla iwe n’ụzọ ọ bụla.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka a ghara ịkatọ ozi ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν ... προσκοπήν
  choice: ihe ọ bụla ga-eme ka onye ọ bụla sụọ ngọngọ
  rationale: Nke a na-echekwa ihe atụ nke ịsụ ngọngọ dị na προσκοπή, ma kwuo ya n'Igbo dị mfe ma doo anya.
- source_word: ἐν μηδενί
  choice: ihe ọ bụla
  rationale: Ọ na-egosi na nke a metụtara ọnọdụ na akụkụ niile; n'Igbo, njikọ ya na ahịrịokwu dum na-enye echiche zuru ezu ahụ.
- source_word: διδόντες
  choice: anyị adịghị enye
  rationale: A sụgharịrị participle ahụ dịka omume Pọl na ndị ya na ha na-eje ozi na-eme, n'ụzọ kwekọrọ n'isiokwu nke gbara amaokwu a gburugburu.
- source_word: ἵνα μὴ
  choice: ka a ghara
  rationale: Nke a na-egosi ebumnuche ma ọ bụ ihe ha chọrọ izere, ma bụrụkwa okwu Igbo a na-aghọta ngwa ngwa.
- source_word: μωμηθῇ
  choice: ịta ... ụta
  rationale: Okwu a na-eburu echiche nke ịkatọ ma ọ bụ ịchọta mmejọ; 'ịta ụta' bụ okwu Igbo e ji ya eme ihe n'ụzọ ebumpụta ụwa.
- source_word: ἡ διακονία
  choice: ozi anyị
  rationale: N'ebe a διακονία na-ezo aka n'ozi Pọl na ndị ọrụ ibe ya na-arụ. 'Ozi anyị' na-eme ka onye nwe ozi ahụ doo anya site n'ọnọdụ okwu, na-enweghị itinye echiche banyere ọkwa ụka.
theological_decisions:
- issue: Ihe διακονία pụtara n'okwu Pọl banyere onwe ya na ndị ọrụ ibe ya
  choice: ozi anyị
  alternative: ije ozi ahụ
  rationale: Ọnọdụ okwu ahụ na-ekwu maka ọrụ ozi Pọl na ndị ọrụ ibe ya. 'Ozi anyị' na-egosi ọrụ e nyere ha, ma ọ naghị eme ka ọ bụrụ ọkwa nchịkwa ụka e guzobere mgbe e mesịrị.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A na-eji ‘sụọ ngọngọ’ echekwa ihe atụ Grik ahụ; ihe odide ala ala peeji na-enye echiche ọzọ nke ịkpasu iwe. A kọwara διακονία dịka ozi Pọl na ndị ọrụ ibe ya na-arụ, ọ bụghị dịka ọkwa ụka pụrụ iche.
