    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka a ghara ịkatọ ozi ahụ.”
    reason: lexical_alternative
  revision_rationale: The revision renders the comprehensive force of ἐν μηδενί with ‘n’ụzọ ọ bụla,’ while retaining the metaphor of stumbling. It uses the definite contextual expression ‘ozi ahụ’ for ἡ διακονία and replaces the expanded second footnote with a direct lexical alternative for μωμηθῇ. The causal wording ‘eme ka ... sụọ ngọngọ’ is idiomatic Igbo and faithfully expresses the practical force of ‘giving no cause for stumbling.’
