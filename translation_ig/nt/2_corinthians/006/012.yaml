  text: οὐ στενοχωρεῖσθε ἐν ἡμῖν, στενοχωρεῖσθε δὲ ἐν τοῖς σπλάγχνοις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/012.yaml
  text: You are not restricted by us[a], but you are restricted in your own affections.
translation:
  language: ig
  text: Ọ bụghị n’ime anyị ka unu nwere mmachi[a]; kama, ọ bụ n’ime mmetụta obi unu ka unu nwere mmachi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu enweghị mmachi n’ime anyị; kama, unu nwere mmachi n’ime obi unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στενοχωρεῖσθε
  choice: na-egbochi / na-egbochi onwe unu
  rationale: Okwu a na-egosi ịnọ n’ebe dị warara n’ụzọ nkịtị, ma ebe a ọ pụtara inwe mmachi. E ji otu mgbọrọgwụ okwu n’ahịrịokwu abụọ ahụ chekwaa ntụnyere Pọl.
- source_word: ἐν ἡμῖν
  choice: anyị na-egbochi unu
  rationale: Ọ bụ ezie na ἐν pụtarakarị ‘n’ime,’ ebe a ọ na-egosi na mmachi ahụ esiteghị n’aka Pọl na ndị ọrụ ibe ya. Usoro a bụ Igbo doro anya ma dị ndụ.
- source_word: δὲ
  choice: kama
  rationale: ‘Kama’ na-egosipụta nnukwu ọdịiche dị n’etiti akụkụ abụọ ahụ.
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: n’ime mmetụta obi unu
  rationale: σπλάγχνα bụ akụkụ ime ahụ n’ụzọ nkịtị, ma n’ebe a ọ na-ezo aka n’ebe mmetụta miri emi na ịhụnanya si apụta. ‘Mmetụta obi’ na-enye echiche ahụ n’Igbo nkịtị ma ka na-echekwa ihe atụ gbasara ime mmadụ.
- source_word: οὐ
  choice: ọ bụghị
  rationale: Nke a na-enye ngọnarị doro anya n’akụkụ mbụ.
theological_decisions:
- issue: Ihe atụ dị na σπλάγχνα
  choice: A kọwara ya dị ka mmetụta miri emi nke obi ndị Kọrịnt, ọ bụghị akụkụ ahụ nkịtị.
  alternative: ‘n’ime akụkụ ime ahụ unu’ ma ọ bụ naanị ‘n’obi unu’
  rationale: Ọnọdụ okwu a bụ mmekọrịta Pọl na ndị Kọrịnt. Nsụgharị ahụ na-egosi na enweghị ohere n’ịhụnanya ha na nzaghachi ha, ma na-echekwakwa ihe atụ nke ime mmadụ.
- issue: Onye na-akpata mmachi n’akụkụ nke abụọ
  choice: ‘unu na-egbochi onwe unu’ na-eme ka o doo anya na mmachi ahụ dị n’ime ha onwe ha.
  alternative: ‘a na-egbochi unu n’ime mmetụta obi unu’
  rationale: Ụdị Grik bụ passive ma nwee ike ịhapụ onye na-eme ya n’amaghị ama. N’Igbo, ụdị reflexive a na-ekwupụta isi ihe dị na ntụnyere ahụ, ma ihe odide ala peeji na-echekwa nsụgharị nke na-anọkwu nso n’usoro passive.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘mmetụta obi’ iji gosi mmetụta miri emi nke σπλάγχνα, ebe ihe odide ala peeji chekwara usoro okwu nke dị nso karị na Grik.
