revisions:
- from: Ọ bụghị anyị na-egbochi unu[a]; kama, ọ bụ n’ime mmetụta obi unu ka unu na-egbochi onwe unu.
  to: Ọ bụghị n’ime anyị ka unu nwere mmachi[a]; kama, ọ bụ n’ime mmetụta obi unu ka unu nwere mmachi.
  rationale: 'The revision avoids supplying an explicit reflexive agent not stated in the Greek and uses a parallel Igbo construction for both occurrences of στενοχωρεῖσθε. It retains the contrast: the Corinthians’ limitation is not in Paul and his companions, but in their own inward affections.'
  reviewer_model: gpt-5.6-terra
