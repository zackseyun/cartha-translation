revisions:
- from: Unu ekwela ka e kekọta unu na ndị na-ekweghị ekwe n’otu yok na-ekwesịghị ekwesị.[b] N’ihi na, olee ihe ezi omume na mmebi iwu nwekọrọ?[a] Ma ọ bụ, olee mmekọ ìhè na ọchịchịrị nwere?
  to: Unu esokwala ndị na-ekweghị ekwe kee onwe unu n’otu yok na-adịghị adaba.[b] N’ihi na, gịnị ka ezi omume[a] na mmebi iwu nwekọrọ? Ma ọ bụ, olee mmekọrịta ìhè na ọchịchịrị nwere?
  rationale: The revision preserves the Greek metaphor and rhetorical structure while making the prohibition active and idiomatic in Standard Igbo. It also corrects the lexical-footnote anchor and clarifies that the mismatch is between those joined under the yoke.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:06Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the prohibition, the yoke metaphor, the contrast between righteousness and lawlessness, and the light/darkness parallel. However, “Unu ekwela ka e kekọta unu” makes the action primarily something done to the readers, whereas the Greek imperative calls them not to enter into this mismatched yoking. The revision expresses their participation in that association more directly.
  naturalness: Several expressions are understandable, but “otu yok na-ekwesịghị ekwesị” is awkward because the mismatch concerns those joined under the yoke, not the yoke itself. “Mmekọrịta” is also more natural than the truncated “mmekọ” in the final rhetorical question.
  terminology: “Ezi omume” and “mmebi iwu” appropriately convey δικαιοσύνη and ἀνομία in this ethical contrast. The alternative “ikpe ziri ezi” suitably preserves the possible justice sense. The loanword “yok” is retained as a recognizable concrete metaphor and clarified by the footnote.
  issues:
  - severity: medium
    issue: The opening passive construction weakens the force of the middle imperative.
    rationale: “Unu ekwela ka e kekọta unu” means “do not allow yourselves to be tied,” while μὴ γίνεσθε ἑτεροζυγοῦντες prohibits becoming/entering into a mismatched yoking. “Unu esokwala ... kee onwe unu” better represents this without adding interpretation.
  - severity: medium
    issue: The modifier is attached unnaturally to “yok.”
    rationale: “otu yok na-ekwesịghị ekwesị” can imply that the yoke itself is unsuitable. The Greek image is of differently matched beings under one yoke; “n’otu yok na-adịghị adaba” more naturally describes the resulting mismatched pairing.
  - severity: low
    issue: Footnote a is anchored after “mmebi iwu,” rather than its referent “ezi omume.”
    rationale: The footnote addresses δικαιοσύνῃ / “ezi omume” and should immediately follow that expression.
  revised_text: Unu esokwala ndị na-ekweghị ekwe kee onwe unu n’otu yok na-adịghị adaba.[b] N’ihi na, gịnị ka ezi omume[a] na mmebi iwu nwekọrọ? Ma ọ bụ, olee mmekọrịta ìhè na ọchịchịrị nwere?
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ezi omume” (δικαιοσύνῃ) dịka “ikpe ziri ezi.”
    reason: lexical_alternative
  - marker: b
    text: Okwu a na-eweta onyinyo anụmanụ abụọ na-adịghị otu ụdị e kekọtara ọnụ n’okpuru otu yok; tulee Diuterọnọmi 22:10.
    reason: cross_reference
  revision_rationale: The revision preserves the Greek metaphor and rhetorical structure while making the prohibition active and idiomatic in Standard Igbo. It also corrects the lexical-footnote anchor and clarifies that the mismatch is between those joined under the yoke.
