source:
  edition: SBLGNT
  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: ig
  text: Unu esokwala ndị na-ekweghị ekwe kee onwe unu n’otu yok na-adịghị adaba.[b] N’ihi na, gịnị ka ezi omume[a] na mmebi iwu nwekọrọ? Ma ọ bụ, olee mmekọrịta ìhè na ọchịchịrị nwere?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ezi omume” (δικαιοσύνῃ) dịka “ikpe ziri ezi.”
    reason: lexical_alternative
  - marker: b
    text: Okwu a na-eweta onyinyo anụmanụ abụọ na-adịghị otu ụdị e kekọtara ọnụ n’okpuru otu yok; tulee Diuterọnọmi 22:10.
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: Unu ekwela ka e kekọta unu
  rationale: Nke a na-egosipụta iwu mgbochi ahụ ma na-edobe echiche γίνομαι banyere ịbanye n’ọnọdụ ahụ, kama ịsị naanị ka ha ghara ịdị otu ahụ.
- source_word: ἑτεροζυγοῦντες
  choice: n’otu yok na-ekwesịghị ekwesị
  rationale: A hapụrụ ihe atụ yok ahụ n’ụzọ Igbo ga-aghọta, ya bụ ijikọ ndị na-adabaghị n’okpuru otu yok.
- source_word: ἀπίστοις
  choice: na ndị na-ekweghị ekwe
  rationale: Ọ na-akọwa ndị na-enweghị okwukwe ma kwekọọ na njikọ nke ihe atụ yok ahụ.
- source_word: μετοχὴ
  choice: ihe ... nwekọrọ
  rationale: Ụdị ajụjụ a bụ Igbo dị ndụ nke na-egosipụta òkè ma ọ bụ mmekọrịta a na-enwekọ ọnụ.
- source_word: δικαιοσύνῃ
  choice: ezi omume
  rationale: N’ebe a ọ na-egosi ọnọdụ na omume ziri ezi n’ihu Chineke, n’adịghị ka mmebi iwu; ‘ikpe ziri ezi’ ka edobere dịka ụzọ ọzọ na nkọwa ala peeji.
- source_word: ἀνομίᾳ
  choice: mmebi iwu
  rationale: Nke a na-egosipụta kpọmkwem echiche nke ileghara iwu anya ma na-echekwa ọdịiche ya na δικαιοσύνη.
- source_word: κοινωνία
  choice: mmekọ
  rationale: Ọ na-egosipụta inwekọ ihe na njikọ chiri anya, ma na-ada ka Igbo nkịtị n’ajụjụ a.
- source_word: φωτὶ
  choice: ìhè
  rationale: Nsụgharị nkịtị na-echekwa ihe atụ Pọl ji mee ọdịiche.
- source_word: πρὸς σκότος
  choice: na ọchịchịrị
  rationale: N’usoro ajụjụ Igbo, ‘mmekọ ... na’ na-egosipụta njikọ ma ọ bụ mkpakọrịta nke πρός pụtara n’ebe a.
theological_decisions:
- issue: Nsụgharị δικαιοσύνη n’ọdịiche Pọl gosipụtara
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: Ọdịiche ya na ἀνομία n’ebe a na-akwado echiche omume ziri ezi, ma obosara okwu Grik ahụ nke nwere ike ịgụnye ikpe ziri ezi ka e chekwara na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A chekwara ihe atụ yok ahụ na ajụjụ abụọ Pọl ji gosi ọdịiche; a zere itinye nkọwa ụka pụrụ iche n’ihe amaokwu ahụ na-ekwu.
