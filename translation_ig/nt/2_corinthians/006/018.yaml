revisions:
- from: '“M ga-abụrụ unu Nna[a], unu ga-abụrụkwa m ụmụ nwoke na ụmụ nwanyị,” ka Onyenwe anyị, Onye Pụrụ Ime Ihe Niile, na-ekwu.


    [a] Ma ọ bụ, n’ụzọ na-agbasochi usoro okwu Grik anya: “M ga-abụrụ unu n’ọnọdụ nna, unu ga-abụrụkwa m n’ọnọdụ ụmụ nwoke na ụmụ nwanyị.” Okwu Grik ji usoro okwu na-egosi mmekọrịta ọgbụgba ndụ, nke a na-asụkarị n’Igbo dị ka “ịbụ unu Nna” na “ịbụ m ụmụ nwoke na ụmụ nwanyị.”'
  to: “M ga-abụrụ unu Nna[a], unu ga-abụkwara m ụmụ nwoke na ụmụ nwanyị,” ka Onyenwe anyị, Onye Pụrụ Ime Ihe Niile, na-ekwu.
  rationale: 'The revision preserves every element of the Greek: future tense, the reciprocal covenant relationship, the explicit inclusion of sons and daughters, the present-tense citation formula, and the divine title. It improves the second clause’s idiomatic Igbo and replaces the misleading footnote alternative with a clear explanation that does not add doctrinal interpretation.'
