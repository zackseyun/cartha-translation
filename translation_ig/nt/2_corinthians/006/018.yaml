source:
  edition: SBLGNT
  text: καὶ ἔσομαι ὑμῖν εἰς πατέρα, καὶ ὑμεῖς ἔσεσθέ μοι εἰς υἱοὺς καὶ θυγατέρας, λέγει κύριος παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/018.yaml
  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: ig
  text: “M ga-abụrụ unu Nna[a], unu ga-abụkwara m ụmụ nwoke na ụmụ nwanyị,” ka Onyenwe anyị, Onye Pụrụ Ime Ihe Niile, na-ekwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ nkịtị karịa: “M ga-adịnyere unu dịka nna, unu ga-adịkwa m dịka ụmụ nwoke na ụmụ nwanyị.” N’usoro okwu Grik, a na-eji “ịbụ ... nye” egosi mmekọrịta ọgbụgba ndụ; n’Igbo, a na-ekwu ya nke ọma dịka “M ga-abụrụ unu Nna” na “unu ga-abụkwara m ụmụ nwoke na ụmụ nwanyị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσομαι
  choice: M ga-abụrụ
  rationale: Ọ bụ ngwaa ọdịnihu nke εἰμί. “Ga-abụrụ” na-egosi ọdịnihu nke ịbụ ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ὑμῖν εἰς πατέρα
  choice: unu Nna
  rationale: Usoro Grik a na-egosi mmekọrịta a na-abanye n’ime ya. “M ga-abụrụ unu Nna” na-ebute echiche ahụ n’Igbo n’enweghị ịgbatị nkọwa; e ji mkpụrụedemede ukwu dee “Nna” n’ihi na ọ bụ aha mmekọrịta Chineke n’ebe a.
- source_word: ὑμεῖς ἔσεσθέ μοι
  choice: unu ga-abụrụkwa m
  rationale: E debere nnọchiaha ahụ pụtara ìhè na Grik nakwa nhazi nke na-eme ka akụkụ abụọ ahụ zaa ibe ha, nke na-egosi mmekọrịta dị n’etiti ha.
- source_word: υἱοὺς καὶ θυγατέρας
  choice: ụmụ nwoke na ụmụ nwanyị
  rationale: Grik kpọrọ ma ụmụ ndị nwoke ma ụmụ ndị nwanyị aha kpọmkwem. Nsụgharị a na-edebe ha abụọ kama ijikọ ha naanị n’okwu “ụmụ.”
- source_word: λέγει
  choice: na-ekwu
  rationale: Ụdị ngwaa dị ugbu a n’usoro okwu e ji ekwupụta ihe Akwụkwọ Nsọ kwuru ka e debere site n’iji “na-ekwu.”
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọ a na-ejikarị asụgharị κύριος n’Igbo mgbe ọ bụ aha Chineke.
- source_word: παντοκράτωρ
  choice: Onye Pụrụ Ime Ihe Niile
  rationale: Aha a na-egosi na Chineke nwere ike na ọchịchị zuru oke; nsụgharị a doro anya, dị nsọpụrụ, ma bụrụkwa nke ndị na-agụ Igbo maara.
theological_decisions:
- issue: Igosipụta mmekọrịta ụmụ Chineke n’ụzọ gụnyere nwoke na nwanyị kpọmkwem
  choice: “ụmụ nwoke na ụmụ nwanyị”
  alternative: “ụmụ”
  rationale: υἱοὺς καὶ θυγατέρας kpọrọ akụkụ abụọ ahụ aha. Iji naanị “ụmụ” ga-ezochi nkwusiri ike nke okwu ahụ nyere n’ịgụnye ụmụ nwanyị.
- issue: Nsụgharị κύριος παντοκράτωρ dị ka aha Chineke
  choice: “Onyenwe anyị, Onye Pụrụ Ime Ihe Niile”
  alternative: “Onyenwe anyị nke ụsụụ ndị agha”
  rationale: παντοκράτωρ pụtara Onye nwere ike na ọchịchị niile; ọ bụghị okwu Grik nke pụtara “nke ụsụụ ndị agha.” Nhọrọ a anaghị ebubata aha ọzọ na-adịghị n’ederede Grik a.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa nsọpụrụ. A hapụrụ nhazi mmekọrịta dị n’ahịrị abụọ ahụ ka ọ pụta ìhè, ma e zere okwu ochie ma ọ bụ nkọwa pụrụ iche nke otu ụka.
