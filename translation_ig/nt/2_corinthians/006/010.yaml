  rationale: The revision retains Paul’s compact threefold “dị ka … ma …” paradoxical structure, uses natural Standard Igbo, and maintains participial parallelism. Footnotes have been omitted because neither the lexical sense nor the text’s wording requires a note, and the proposed explanatory notes go beyond the unqualified Greek wording.
