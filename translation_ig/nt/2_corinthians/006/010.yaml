  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς λυπούμενοι ἀεὶ δὲ χαίροντες, ὡς πτωχοὶ πολλοὺς δὲ πλουτίζοντες, ὡς μηδὲν ἔχοντες καὶ πάντα κατέχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/010.yaml
  text: as sorrowful[a], yet always rejoicing; as poor, yet making many rich; as having nothing[b], and yet possessing everything.
translation:
  language: ig
  text: dị ka ndị na-enwe mwute, ma na-aṅụrị ọṅụ mgbe niile; dị ka ndị ogbenye, ma na-eme ka ọtụtụ ndị baa ọgaranya; dị ka ndị na-enweghị ihe ọ bụla, ma na-enwe ihe niile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς
  choice: dị ka
  rationale: Ọ na-edobe usoro ntụnyere Pọl kwughachiri ugboro atọ, nke na-egosi ọdịdị ihe n’anya mmadụ tupu e kwuo eziokwu na-emegide ya.
- source_word: λυπούμενοι
  choice: ndị na-eru uju
  rationale: Nke a na-egosi ọnọdụ iru uju n’enweghị ịkọwapụta onye ma ọ bụ ihe kpatara ya.
- source_word: ἀεὶ δὲ χαίροντες
  choice: ma na-aṅụrị ọṅụ mgbe niile
  rationale: “Ma” na-egosi mmegide dị n’etiti iru uju na ọṅụ, ebe “mgbe niile” na-ebute echiche nke ἀεί n’ụzọ doro anya.
- source_word: πτωχοὶ
  choice: ndị ogbenye
  rationale: Ọ bụ okwu Igbo kwụ ọtọ nke na-adịghị ekwubiga oke banyere ogo ụkọ ha.
- source_word: πολλοὺς δὲ πλουτίζοντες
  choice: ma na-eme ka ọtụtụ mmadụ baa ọgaranya
  rationale: Ọ na-egosipụta kpọmkwem omume ime ka ndị ọzọ baa ọgaranya, ma ọ naghị ekpebi n’ahịrị bụ isi ma ọgaranya ahụ ọ̀ bụ nke ihe onwunwe ka ọ̀ bụ nke ime mmụọ.
- source_word: μηδὲν ἔχοντες
  choice: ndị na-enweghị ihe ọ bụla
  rationale: Ọ na-edobe nkwupụta siri ike nke enweghị ihe ọbụla na akụkụ mbụ nke okwu mmegide ahụ.
- source_word: πάντα κατέχοντες
  choice: ndị nwere ihe niile
  rationale: Nke a bụ ụzọ Igbo dị ndụ si egosi inwe ihe n’ezie, ma na-edobe obosara nke πάντα, “ihe niile.”
theological_decisions:
- issue: Ụdị akụ na ihe onwunwe Pọl na-ekwu banyere ha
  choice: E kwughị n’ahịrị bụ isi na ha bụ akụ ime mmụọ; e debere okwu ahụ n’ụzọ sara mbara.
  alternative: Ịsụgharị ya kpọmkwem dị ka ime ka ọtụtụ baa ọgaranya n’ime Kraịst na inwe ihe niile n’ime Kraịst.
  rationale: Ọnọdụ akwụkwọ ozi a nwere ike igosi akụ ime mmụọ, ma Grik etinyeghị nkọwa ahụ n’ahịrị a. Nsụgharị ahụ na-ahapụ okwu mmegide Pọl ka ọ dị n’enweghị idozi mgbagwoju ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. E debere usoro atọ nke “dị ka … ma …” iji chekwaa ụda na okwu mmegide dị n’ahịrị Grik.
