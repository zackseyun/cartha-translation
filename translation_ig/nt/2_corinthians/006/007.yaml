source:
  edition: SBLGNT
  text: ἐν λόγῳ ἀληθείας, ἐν δυνάμει θεοῦ· διὰ τῶν ὅπλων τῆς δικαιοσύνης τῶν δεξιῶν καὶ ἀριστερῶν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/007.yaml
  text: in the word of truth[a], in the power of God; through the weapons of righteousness in the right hand and in the left[c][b],
translation:
  language: ig
  text: n’okwu nke eziokwu[a], n’ike nke Chineke; site ná ngwá agha nke ezi omume[b] dị n’aka nri na n’aka ekpe[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Okwu nke eziokwu” nwekwara ike ịpụta “okwu e kwuru n’eziokwu” ma ọ bụ “ozi nke eziokwu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ngwá agha nke ikpe ziri ezi.”
    reason: lexical_alternative
  - marker: c
    text: 'N’ụzọ dị nso n’usoro Grik: “nke aka nri na nke aka ekpe.” O yikarịrị ka okwu a na-atụ aka n’oyiyi agha metụtara aka nri na aka ekpe, ma okwu Grik ekwughị kpọmkwem ụdị ngwá agha ma ọ bụ ọrụ nke aka ọ bụla.'
    reason: cultural_note
lexical_decisions:
- source_word: λόγῳ ἀληθείας
  choice: okwu nke eziokwu
  rationale: Nke a na-edobe usoro okwu Grik, ma na-ahapụ λόγος ka ọ nwee ike ịpụta okwu e kwuru n’eziokwu ma ọ bụ ozi nke eziokwu.
- source_word: δυνάμει θεοῦ
  choice: ike nke Chineke
  rationale: Nke a bụ ntụgharị doro anya nke njikọ aha abụọ ahụ, ma kwekọọkwa n’usoro ahịrịokwu ndị malitere na ἐν.
- source_word: διὰ
  choice: site ná
  rationale: Ebe διά sochiri genitive, ọ na-egosi ụzọ ma ọ bụ ihe e ji eme ihe; “site ná” na-egosipụta nke a n’Igbo dị ugbu a.
- source_word: ὅπλων
  choice: ngwá agha
  rationale: ὅπλον nwere ike ịgụnye ihe agha e ji ebuso agha ma ọ bụ chebe onwe; “ngwá agha” sara mbara karịa uwe agha.
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: N’ebe a, “ezi omume” na-egosipụta ịdị n’ụzọ ziri ezi na omume ziri ezi n’enweghị itinye nkọwa ụka pụrụ iche; “ikpe ziri ezi” ka edobere dị ka ụzọ ọzọ.
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: anyị ji n’aka nri na n’aka ekpe
  rationale: Adjective abụọ ahụ na-arụ ọrụ dị ka aha ma yikarịrị ka ha na-ezo aka n’aka abụọ. Itinye “anyị ji” na-eme ka oyiyi ngwá agha ahụ doo anya n’Igbo, ebe ndetu na-edobe ntụgharị dị nso n’usoro Grik.
theological_decisions:
- issue: Otu e si tụgharịa δικαιοσύνη n’okwu Pọl
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: “Ezi omume” na-adaba n’echiche sara mbara nke δικαιοσύνη ebe a, ma ọ naghị ekpebi ma ọ bụ naanị ọnọdụ n’ihu Chineke, omume mmadụ, ma ọ bụ onyinye Chineke. “Ikpe ziri ezi” ka e debere n’ala peeji iji gosipụta akụkụ ọzọ nke okwu ahụ.
- issue: Ihe ngwá agha aka nri na aka ekpe pụtara
  choice: ngwá agha anyị ji n’aka nri na n’aka ekpe
  alternative: ngwá agha maka aka nri na aka ekpe
  rationale: Okwu Grik anaghị akọwa ụdị ngwá agha ma ọ bụ kwuo hoo haa na otu bụ nke mbuso agha, nke ọzọ abụrụ nke nchebe. Ya mere, ederede ahụ na-edobe naanị oyiyi njikere zuru ezu, ebe ndetu na-akọwa na nkọwa mbuso agha na nchebe bụ ihe nwere ike ịdị na ya, ọ bụghị ihe e kwuru kpọmkwem.
translation_notes:
  register: Ejiri Standard Igbo dị ùgwù ma dị mfe nghọta. E chekwara usoro ugboro ugboro nke “n’…” na “site ná…” nke dị na Grik. Akara mmechi bụ rikoma n’ihi na amaokwu a bụ akụkụ nke ndepụta na-aga n’ihu n’okwu gbara ya gburugburu.
