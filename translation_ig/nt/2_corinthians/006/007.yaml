  verdict: revise
  source_fidelity: The three instrumental phrases are represented faithfully. However, “anyị ji” (“which we use”) introduces an explicit first-person action not stated in the Greek. The final Greek phrase is elliptic and adjectival (“of [the] right and left”); a rendering that locates the weapons at the right and left hands conveys the likely idiom without adding the verb of use.
  naturalness: “N’okwu nke eziokwu, n’ike nke Chineke” is natural, dignified Standard Igbo and retains Paul’s repeated structure. “Ngwá agha nke ezi omume dị n’aka nri na n’aka ekpe” is smoother and less interpretively expanded than the draft’s relative clause with “anyị ji.”
  terminology: “Okwu nke eziokwu,” “ike nke Chineke,” “ngwá agha,” and “ezi omume” are suitable. The alternative “ikpe ziri ezi” appropriately preserves the justice sense of δικαιοσύνη. The explanatory note should not present offense/defense as a stated meaning of the Greek.
  issues:
  - severity: medium
    issue: The main text adds “anyị ji.”
    rationale: The Greek does not explicitly say “we use/wield.” Although the surrounding context has a first-person plural speaker, this addition unnecessarily resolves the elliptical image and is best omitted.
  - severity: low
    issue: Footnote c over-specifies the imagery as weapons used “aka abụọ” and speaks of full readiness for offense and defense.
    rationale: The right/left expression likely evokes a military image, but the Greek does not explicitly identify hands, weapon types, or offensive and defensive roles. The note should mark these as likely implications rather than define the phrase that narrowly.
