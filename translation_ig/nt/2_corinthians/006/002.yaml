id: 2CO.6.2
reference: 2 Corinthians 6:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: ig
  text: N’ihi na ọ na-ekwu sị, “N’oge a na-anabata nke ọma, egeere m gị ntị[a], n’ụbọchị nzọpụta kwa, enyere m gị aka.” Lee, ugbu a bụ oge a na-anabata nke ukwuu; lee[b], ugbu a bụ ụbọchị nzọpụta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “anụrụ m gị n’ihu ọma,” ma ọ bụ, “azara m gị.” Ngwaa Grik ahụ nwere ike ịpụta ịnụ mmadụ n’ụzọ ịnabata okwu ya ma ọ bụ imeghachi omume.
    reason: lexical_alternative
  - marker: b
    text: Grik enweghị article n’ihu “oge” na “ụbọchị” n’ebe a. Igbo enweghịkwa article kwekọrọ kpọmkwem na “a” ma ọ bụ “the,” ya mere nsụgharị a na-ahapụ ma okwu ndị a bụ “otu oge/ụbọchị” ka ha bụ “oge/ụbọchị ahụ” ka ọnọdụ okwu kpebie.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει γάρ
  choice: N’ihi na ọ na-ekwu
  rationale: “N’ihi na” na-egosi nkọwa γάρ ji jikọta amaokwu a na arịrịọ Pọl, ebe “ọ na-ekwu” na-edobe Chineke dịka onye na-ekwu okwu ahụ n’Akwụkwọ Nsọ.
- source_word: Καιρῷ δεκτῷ
  choice: N’oge a na-anabata nke ọma
  rationale: καιρός bụ oge dabara adaba ma ọ bụ oge a kara aka, ọ bụghị naanị oge na-aga; δεκτός na-egosi oge a nabatara ma ọ bụ oge ihuọma. Nsụgharị a na-edobe isi abụọ ahụ n’Igbo dị mfe nghọta.
- source_word: ἐπήκουσά σου
  choice: e gere m gị ntị
  rationale: ἐπακούω pụtara ịnụ ma ọ bụ ige ntị, ọtụtụ mgbe tinyere echiche nke ịnabata arịrịọ ma ọ bụ imeghachi omume. “E gere m gị ntị” na-edobe echiche ahụ n’enweghị ịkọwa ya kpọmkwem dịka “azara m gị.”
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: n’ụbọchị nzọpụta
  rationale: Nkebiokwu Igbo a bụ nke e ji ekwu okwu n’ụzọ ebumpụta ụwa. Ebe Igbo na-enweghị akara okwu kwekọrọ kpọmkwem na ‘a’ na ‘the,’ ọ naghị amanye nkebiokwu Grik na-enweghị article ka ọ bụrụ nke doro anya ma ọ bụ nke na-abụghị otu a kapịrị ọnụ.
- source_word: ἐβοήθησά σοι
  choice: enyere m gị aka
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa βοηθέω, ya bụ inyere mmadụ aka ma ọ bụ ịbịara ya enyemaka.
- source_word: ἰδοὺ
  choice: Lee
  rationale: “Lee” bụ okwu Igbo dị nkenke nke na-adọrọ uche ma na-edobe ike na ịdị nsọ nke ἰδού.
- source_word: νῦν
  choice: ugbu a
  rationale: “Ugbu a” na-edobe nkwusi ike nke νῦν na ịdị ngwa nke ihe Pọl na-akpọ ndị na-agụ ya ime.
- source_word: καιρὸς εὐπρόσδεκτος
  choice: oge a na-anabata nke ọma
  rationale: εὐπρόσδεκτος na-egosi ihe a nabatara nke ọma ma ọ bụ ihe dị nnọọ mma ịnabata. Nsụgharị a bụ Igbo nkịtị ma na-ejikọta ya na δεκτός dị na nkwupụta ahụ, n’agbanyeghị na ọdịiche nta dị n’ike okwu Grik abụọ ahụ anaghị apụta n’uju.
- source_word: ἡμέρα σωτηρίας
  choice: ụbọchị nzọpụta
  rationale: Nsụgharị a na-edobe okwu Grik n’ụzọ dị nkenke ma dị ike. Usoro Igbo ahụ anaghị ekpebi n’onwe ya ma ọ bụ ‘otu ụbọchị nzọpụta’ ka ọ bụ ‘ụbọchị nzọpụta ahụ.’
theological_decisions:
- issue: Ma nkebiokwu oge na ụbọchị ga-abụ nke a kapịrị ọnụ ma ọ bụ nke na-abụghị otu a kapịrị ọnụ
  choice: Jiri “oge a na-anabata nke ọma” na “ụbọchị nzọpụta,” bụ́ ndị usoro Igbo anaghị amanye ka ha bụrụ definite ma ọ bụ indefinite.
  alternative: Ịgbakwụnye “otu” maka echiche indefinite, ma ọ bụ “ahụ” maka definite.
  rationale: Nkebiokwu Grik enweghị article. Ebe Igbo anaghị eji article dịka Bekee, ịghara ịgbakwunye “otu” ma ọ bụ “ahụ” na-echekwa enweghị mkpebi dị na isi mmalite ma ghara ịmanye usoro nkà mmụta banyere ọgwụgwụ oge n’amaokwu ahụ.
- issue: Ma λέγει ọ na-ezo aka n’Akwụkwọ Nsọ dịka ihe na-ekwu okwu, ka ọ na-ezo aka na Chineke dịka onye na-ekwu ya
  choice: “ọ na-ekwu,” nke na-edobe onye na-ekwu okwu dịka onye dị ndụ, ya bụ Chineke n’ime okwu a hotara.
  alternative: “Akwụkwọ Nsọ na-ekwu.”
  rationale: Usoro okwu Pọl na-ewere okwu Akwụkwọ Nsọ dịka okwu Chineke. Pronoun ahụ na-edobe udidi a n’etinyeghị nkọwa ọhụrụ n’amaokwu ahụ.
- issue: Ma ἐπήκουσά σου kwesịrị ịpụta nanị ịnụ, ka ọ pụta ịza arịrịọ
  choice: “e gere m gị ntị,” nke na-enye ohere maka ịnụ nke ọma na imeghachi omume.
  alternative: “azara m gị.”
  rationale: “Azara m gị” nwere ike bụrụ nkọwa ziri ezi n’ọnọdụ a, ma ọ na-eme ka ihe ngwaa Grik na-ahapụ ntakịrị ghe oghe bụrụ nke doro anya karịa ka isi mmalite si kwuo.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Lee” na-edobe olu ịdọrọ uche nke amaokwu ahụ, ebe usoro ahịrị abụọ na-ekwughachi ibe ha na-echekwa ike okwu Pọl. E zere okwu ụka pụrụ iche na nkọwa ga-emechi ambiguity nke Grik.
