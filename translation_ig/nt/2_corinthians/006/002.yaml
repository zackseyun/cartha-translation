- from: N’ihi na ọ na-ekwu, “N’oge a na-anabata nke ọma, e gere m gị ntị[a], n’ụbọchị nzọpụta kwa, enyere m gị aka.” Lee, ugbu a bụ oge a na-anabata nke ọma; lee[b], ugbu a bụ ụbọchị nzọpụta.
  to: N’ihi na ọ na-ekwu sị, “N’oge a na-anabata nke ọma, egeere m gị ntị[a], n’ụbọchị nzọpụta kwa, enyere m gị aka.” Lee, ugbu a bụ oge a na-anabata nke ukwuu; lee[b], ugbu a bụ ụbọchị nzọpụta.
  rationale: The revision corrects the completed form of “ige ntị,” repairs the footnote’s lexical error, and gives modest expression to the εὖ- intensification in εὐπρόσδεκτος. It otherwise preserves the draft’s sound handling of the Greek’s article ambiguity, urgency, and citation register.
