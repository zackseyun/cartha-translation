reference: 2 Corinthians 9:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: ig
  text: Ma Chineke nwere ike ime ka amara niile baara unu ụba, ka unu, n'ihe niile na mgbe niile, nwee ihe zuru unu ezu,[a] wee baa ụba n'ọrụ ọma ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwee afọ ojuju zuru ezu.” Okwu Grik ahụ nwere ike ịpụta inwe ihe zuru ezu, ihe kwesịrị ekwesị, ma ọ bụ afọ ojuju; n'ebe a, ọ na-ekwu banyere ihe Chineke na-enye nke zuru mkpa, ọ bụghị mmadụ ịdabere naanị n'onwe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατεῖ
  choice: nwere ike
  rationale: Na-egosi ikike Chineke nwere ime ihe a, n'asụsụ Igbo doro anya ma bụrụkwa nke nkịtị.
- source_word: δὲ
  choice: Ma
  rationale: Ọ bụ njikọ dị nro na-aga n'ihu n'echiche amaokwu bu ụzọ; ‘Ma’ na-egosipụta njikọ ahụ n'enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: πᾶσαν χάριν
  choice: amara niile
  rationale: ‘Amara’ na-edobe obosara χάρις dị ka onyinye ọma na nkwado sitere n'aka Chineke, tinyere ihe ọ na-enye iji mee ka mmesapụ aka kwe omume.
- source_word: περισσεῦσαι εἰς ὑμᾶς
  choice: ime ka ... baara unu ụba
  rationale: Na-edobe echiche causative nke Chineke ime ka amara baa ụba ruo ndị a na-agwa okwu.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Na-egosipụta ebumnuche ma ọ bụ nsonaazụ nke omume Chineke n'ụzọ Igbo na-aga were were.
- source_word: ἐν παντὶ πάντοτε
  choice: mgbe niile n'ọnọdụ niile
  rationale: Na-edobe nkwughachi na ike nke okwu παν- abụọ ahụ, ma na-eme ya ka ọ doo ndị na-agụ Igbo anya.
- source_word: πᾶσαν αὐτάρκειαν ἔχοντες
  choice: na-enwe ihe niile dị unu mkpa
  rationale: Na-akọwa αὐτάρκεια dị ka inwe ihe zuru ezu maka mkpa ha, ọ bụghị nnwere onwe nke na-enweghị ịdabere na Chineke.
- source_word: περισσεύητε
  choice: baakwa ụba
  rationale: Na-edobe nkwughachi nke mgbọrọgwụ περισσεύω na ihe oyiyi nke ụba dị n'amaokwu ahụ.
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: n'ọrụ ọma niile
  rationale: Na-egosi na ụba ahụ na-apụta n'ime ụdị ọrụ ọma ọ bụla, n'ụzọ dabara adaba n'Igbo.
theological_decisions:
- issue: Ihe χάρις pụtara n'ọnọdụ nkuzi banyere inye ihe
  choice: Amara Chineke n'obosara ya, nke gụnyere nkwado ọ na-enye ka mmadụ nwee ike imesapụ aka
  alternative: Nanị ihu ọma, ma ọ bụ onyinye ego kpọmkwem
  rationale: Ọnọdụ ahụ metụtara inye ihe, ma χάρις sara mbara karịa ego; ‘amara’ na-edobe obosara nkà mmụta okpukpe ahụ.
- issue: Ihe αὐτάρκεια pụtara
  choice: Inwe ihe niile dị mkpa ma ọ bụ ihe zuru ezu sitere n'aka Chineke
  alternative: Afọ ojuju, ma ọ bụ mmadụ ịdabere naanị n'onwe ya
  rationale: Amaokwu ahụ na-ekwu na Chineke na-enye ndị kwere ekwe ihe ka ha nwee ike ime ọrụ ọma; ya mere, ọ bụghị echiche nke mmadụ ịbụ onye zuru onwe ya n'enweghị Chineke.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ nkwughachi echiche ‘ụba’ iji gosipụta usoro okwu Pọl, ebe e mere αὐτάρκεια ka ọ pụta ìhè n'ụzọ nkịtị karịa iji okwu nwere ike ịpụta nnwere onwe mmadụ.
