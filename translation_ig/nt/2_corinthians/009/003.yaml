id: 2CO.9.3
reference: 2 Corinthians 9:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔπεμψα δὲ τοὺς ἀδελφούς, ἵνα μὴ τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν κενωθῇ ἐν τῷ μέρει τούτῳ, ἵνα καθὼς ἔλεγον παρεσκευασμένοι ἦτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/003.yaml
  text: But I sent the brothers[a], so that our boasting about you might not be emptied in this matter, so that, just as I was saying, you may be prepared[b],
translation:
  language: ig
  text: Ma m zipụrụ ụmụnna ahụ, ka ihe anyị ji anya isi banyere unu ghara ịghọ ihe efu[a] n’okwu a[b], ka, dịka m nọ na-ekwu, unu wee dị njikere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ghara ịpụta na ọ bụ ihe efu” ma ọ bụ “ghara ịbụ ihe na-abaghị uru.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “n’ihe gbasara nke a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψα
  choice: m zipụrụ
  rationale: Aorist indicative a bụ omume gara aga; “m zipụrụ” na-egosipụta ya n’ụzọ doro anya ma dị mfe n’Igbo.
- source_word: τοὺς ἀδελφούς
  choice: ụmụnna ahụ
  rationale: N’ebe a okwu Grik ahụ na-ezo aka n’ụmụ nwoke ndị Pọl họpụtara ka ha gaa dịka ndị nnọchi anya; “ụmụnna ahụ” na-edobe ntụaka ahụ n’enweghị ịgbasa ya ka ọ bụrụ ìgwè agwakọtara.
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: ihe anyị ji anya isi banyere unu
  rationale: Nkebi a na-egosi okwu nganga ma ọ bụ ihe e ji anya isi banyere ndị Kọrịnt; ntụgharị a bụ nke okike n’Igbo ma ọ naghị agbanwe ya naanị ka ọ bụrụ “ntụkwasị obi.”
- source_word: κενωθῇ
  choice: ghara ịghọ ihe efu
  rationale: Nke a na-edobe onyinyo okwu Grik nke ime ka ihe bụrụ ihe efu ma na-ada nke ọma n’Igbo. ἵνα μή na-egosi ebumnuche igbochi ihe ahụ ime.
- source_word: ἐν τῷ μέρει τούτῳ
  choice: n’okwu a
  rationale: μέρος bụ okwu atụ ebe a, na-ezo aka n’ihe ma ọ bụ akụkụ a na-ekwu maka ya, ọ bụghị akụkụ anụ ahụ.
- source_word: καθὼς ἔλεγον
  choice: dịka m nọ na-ekwu
  rationale: Ụdị imperfect ἔλεγον na-egosi okwu a na-ekwu na-aga n’ihu ma ọ bụ ugboro ugboro; “m nọ na-ekwu” na-edobe nghọta ahụ karịa “m kwuru.”
- source_word: παρεσκευασμένοι ἦτε
  choice: unu wee dị njikere
  rationale: Periphrastic perfect a na-elekwasị anya n’ọnọdụ ịdị njikere nke a chọrọ ka ha nọrọ na ya; “dị njikere” bụ okwu Igbo doro anya ma dịkwa n’okike.
theological_decisions:
- issue: Ihe Pọl ji anya isi banyere ndị Kọrịnt
  choice: E debere ya dịka “ihe anyị ji anya isi banyere unu.”
  alternative: “ntụkwasị obi anyị nwere n’ebe unu nọ”
  rationale: καύχημα nwere ike ịgụnye ihe e ji akpa nganga ma ọ bụ ihe kpatara ịnya isi. Ịsụgharị ya naanị dịka “ntụkwasị obi” ga-eme ka esemokwu dị n’okwu Pọl belata ma tinye nkọwa karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “ụmụnna ahụ” maka ndị nnọchi anya nwoke ndị a kpọtụrụ aha n’ọnọdụ gbara amaokwu ahụ gburugburu. E debere usoro ebumnuche abụọ nke ἵνα site n’iji “ka ... ka ...,” ma e jiri akara edemede mee ka ahịrịokwu ahụ doo anya.
