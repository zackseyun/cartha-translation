review_pass:
  verdict: revise
  source_fidelity: 'A na-echekwa usoro na isi echiche nke Grik n’ozuzu ya: Pọl kpebiri na ọ dị mkpa iziga ụmụnna ka ha buru ya ụzọ gaa Kọrịnt ma kwadebe onyinye ahụ e kwere na nkwa. Otú ọ dị, “ahụrụ m” pụtara karịa ‘I saw’ karịa ἡγησάμην (‘I considered’), na “N’ụzọ dị otu a” anaghị arụ ọrụ nke ọma n’ọnọdụ οὕτως ὡς. A gbanwere ha iji gosipụta mkpebi Pọl na ọdịiche dị n’etiti onyinye mmesapụ aka na ihe a napụtara n’ike.'
  naturalness: Nsụgharị a chọrọ obere ndozi maka Igbo ọkọlọtọ nke oge a. “Echere m na ọ dị mkpa” dabara adaba karịa “ahụrụ m na ọ dị mkpa”; “ka ọ dịrị njikere” na “ihe a napụtara unu n’ike” na-agụkwa nke ọma ma doo anya karịa nhazi mbụ.
  terminology: “Ụmụnna” kwesịrị ekwesị maka ἀδελφοὺς, ebe nkọwa ala peeji na-edobe ohere na òtù ahụ nwere ike ịgụnye ụmụnna nwanyị. “Onyinye mmesapụ aka” na-edobe εὐλογία n’ọnọdụ onyinye a na-achịkọta, ma nkọwa ala peeji na-edobe ihe ọ pụtara n’ụzọ nkịtị, ‘ngọzi.’ “Ihe a napụtara unu n’ike” na-egosipụta πλεονεξία n’ọdịiche a dịka nchịkọta a na-achọ n’ụzọ anyaukwu, na-enweghị ikwu na Grik pụtara naanị ‘mmanye.’
