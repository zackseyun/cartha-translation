    rationale: 'Nke a na-atụgharị ἡγησάμην n’ụzọ na-adị ka ‘I saw/found,’ ebe ngwaa Grik ahụ na-ekwu maka mkpebi ma ọ bụ echiche Pọl: ‘I considered.’'
