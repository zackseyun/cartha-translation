reference: 2 Corinthians 9:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers[a] to go to you ahead of us and arrange in advance the generous gift[b] you had promised, so that it would be ready as a generous gift and not as something extorted[c].
translation:
  language: ig
  text: Ya mere, echere m na ọ dị mkpa ịrịọ ụmụnna[a] ka ha buru anyị ụzọ gakwuru unu ka ha kwadebe onyinye mmesapụ aka[b] unu kwere ná nkwa na mbụ, ka ọ dịrị njikere dị ka onyinye mmesapụ aka, ọ bụghị dị ka ihe a napụtara unu n’ike[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ụmụnna nwoke.” O nwere ike ịgụnye ụmụnna nwanyị ma ọ bụrụ na òtù e zoro aka na ya gụnyere ha.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ngọzi.” N’ebe a, ọ na-ezo aka n’onyinye ndị Kọrịnt kwere ná nkwa inye n’ụba.
    reason: lexical_alternative
  - marker: c
    text: Okwu Grik *pleonexia* na-apụtakarị “anyaukwu” ma ọ bụ “ọchịchọ inweta ihe gabiga ókè.” N’ebe a, ọ na-egosi nchịkọta a na-achọ ka a napụta n’aka ndị na-enye ya, kama ịbụ onyinye e ji mmesapụ aka nye.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον οὖν ἡγησάμην
  choice: Ya mere, ahụrụ m na ọ dị mkpa
  rationale: Na-egosipụta mkpebi Pọl banyere ihe ọ hụrụ na ọnọdụ ahụ chọrọ, n’Igbo dị mfe ma dị ùgwù.
- source_word: παρακαλέσαι
  choice: ịrịọ
  rationale: N’ebe a, ngwaa ahụ bụ ịrịọsi ụmụnna ike ka ha mee ihe tupu oge eruo; “ịrịọ” na-egosipụta nke a n’enweghị ụda iwu siri ike.
- source_word: τοὺς ἀδελφοὺς
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo kwesịrị ekwesị maka ndị otu okwukwe ma na-ahapụ ohere nke okwu Grik ahụ; nkọwa ala peeji na-egosi na ọdịdị okwu Grik bụ nke nwoke ọtụtụ.
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: ka ha buru anyị ụzọ gakwuru unu
  rationale: Na-eme ka o doo anya na ndị ahụ ga-erute tupu Pọl na ndị ya, dịka ọnọdụ njem ahụ si dị.
- source_word: προκαταρτίσωσι
  choice: kwadebekwa ... na mbụ
  rationale: Na-egosi ịhazi ma ime ka onyinye ahụ dị njikere tupu Pọl erute.
- source_word: προεπηγγελμένην
  choice: ahụ unu kwere ná nkwa na mbụ
  rationale: Na-echekwa echiche nke nkwa e kwere tupu oge ahụ.
- source_word: εὐλογίαν
  choice: onyinye mmesapụ aka / onyinye e ji mmesapụ aka nye
  rationale: N’ọnọdụ nchịkọta ego a, okwu ahụ na-ezo aka n’onyinye e nyere n’ụba. E debere ihe ọ pụtara n’ụzọ nkịtị, “ngọzi,” na nkọwa ala peeji, ma e chekwara nkwughachi ya n’ahịrịokwu.
- source_word: οὕτως ὡς εὐλογίαν
  choice: N’ụzọ dị otu a ... dị ka onyinye e ji mmesapụ aka nye
  rationale: Na-egosipụta οὕτως ma na-eme ka ọdịiche dị n’etiti onyinye afọ ofufo na nke a manyere mmadụ inye doo anya.
- source_word: πλεονεξίαν
  choice: ihe a manyere unu inye
  rationale: Ọ bụ ezie na okwu ahụ na-apụtakarị anyaukwu, n’ebe a ọ na-akọwa nchịkọta ahụ dịka ihe a napụtara ndị na-enye ya n’ụzọ nrụgide; nkọwa ala peeji na-edebe nghọta okwu ya sara mbara.
theological_decisions:
- issue: Ndị ἀδελφοὺς na-ezo aka na ha
  choice: ụmụnna
  alternative: ụmụnna nwoke
  rationale: Okwu Igbo a na-arụ ọrụ nke ọma maka ndị otu okwukwe ma ghara ikpebi n’ahịrịokwu isi ma òtù ahụ bụ naanị ụmụ nwoke; nkọwa ala peeji na-edebe ọdịdị nwoke nke okwu Grik.
- issue: Ihe εὐλογία pụtara n’ebe a
  choice: onyinye mmesapụ aka
  alternative: ngọzi
  rationale: N’ọnọdụ a ọ bụ onyinye ego ndị Kọrịnt kwere ná nkwa. Nsụgharị isi na-eme ka ihe a na-ekwu doo onye na-agụ anya, ebe nkọwa ala peeji na-echekwa ihe okwu ahụ pụtara n’ụzọ nkịtị na ụda mmụọ nke “ngọzi.”
- issue: Ihe πλεονεξία pụtara n’ọdịiche a
  choice: ihe a manyere unu inye
  alternative: anyaukwu
  rationale: Ịsị naanị “dị ka anyaukwu” agaghị edo anya n’Igbo. Nhọrọ a na-egosipụta onyinye a napụtara mmadụ site ná nrụgide, ma nkọwa ala peeji na-echekwa isi nghọta “anyaukwu/ọchịchọ inweta gabiga ókè.”
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. A họọrọ ahịrịokwu abụọ iji mee ka ogologo usoro Grik ahụ doo anya, ebe a ka chekwara njikọ echiche ya na nkwughachi εὐλογία.
