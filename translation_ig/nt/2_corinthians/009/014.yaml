id: 2CO.9.14
reference: 2 Corinthians 9:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ’ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/014.yaml
  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: ig
  text: Ha na-ekpekwa ekpere maka unu[a], na-agụsi unu agụụ ike n’ihi amara Chineke karịrị akarị nke dịkwasịrị unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ekpere arịrịọ ha maka unu, ebe ha na-agụsi unu agụụ ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δέησις
  choice: ekpere
  rationale: N'ebe a, okwu a na-ezo aka n'arịrịọ siri ike a na-arịọ Chineke. “Ekpere” bụ okwu Igbo doro anya ma dịkwa mfe nghọta, ebe nkọwa ala peeji na-egosi echiche nke ịrịọsi arịrịọ ike.
- source_word: αὐτῶν
  choice: ha
  rationale: Ọ bụ nnọchiaha nke na-alaghachi n’ebe ndị natara onyinye ahụ nọ; e tinyere ya n’usoro okwu “mgbe ha na-ekpe...” nke bụ Igbo nkịtị.
- source_word: ὑπὲρ ὑμῶν
  choice: maka unu
  rationale: Ὑπέρ na genitive n’ọnọdụ ekpere pụtara ikpe ekpere n’ihi mmadụ ma ọ bụ n’aha ya; “maka unu” na-enye nke a n’Igbo eke.
- source_word: ἐπιποθούντων
  choice: ha na-agụsi ha agụụ ike ịhụ unu
  rationale: Okwu a na-egosi ọchịchọ miri emi na-aga n’ihu. Ịtinye “ịhụ” na-eme ka akpaalaokwu Igbo ahụ zuo oke n’enweghị ịgbanwe ihe bụ isi, ya bụ na ha na-achọsi ndị ahụ ike.
- source_word: διὰ
  choice: n’ihi
  rationale: Διά na accusative ebe a na-egosi ihe kpatara ha ji na-achọsi ndị ahụ ike.
- source_word: ὑπερβάλλουσαν
  choice: karịrị akarị
  rationale: Nkebiokwu a na-echekwa echiche nke ihe pụrụ iche nke gafere oke nkịtị, ma bụrụkwa okwu ndị Igbo nke oge a ga-aghọta ngwa ngwa.
- source_word: χάριν
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị sụgharịa χάρις mgbe ọ na-ekwu maka ihu ọma na ọrụ ọma Chineke.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: Genitive a na-egosi na amara ahụ sitere n’aka Chineke ma bụrụ nke ya; usoro “amara Chineke” na-egosi nke a nke ọma n’Igbo.
- source_word: ἐφ’ ὑμῖν
  choice: dịkwasịrị unu
  rationale: Nke a na-echekwa ihe atụ nke amara Chineke nke dị n’elu ma ọ bụ dakwasịrị ha, kama idozi ya ka ọ bụrụ naanị “n’etiti unu” ma ọ bụ “n’ime unu.”
- source_word: καὶ
  choice: mgbe ... -kwa
  rationale: N’ihi na amaokwu a na-aga n’ihu n’otu ahịrịokwu sitere n’amaokwu gara aga, “-kwa” na-ejigide njikọ “and/also,” ebe “mgbe” na-eme ka njikọ ekpere na agụụ ịhụ ha doo anya n’Igbo.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ekpere na agụụ ịhụ ha
  choice: A kọwara ndị natara onyinye ahụ dị ka ndị na-ekpe ekpere maka ndị Kọrịnt ma na-agụsi ha agụụ ike ịhụ ha.
  alternative: A pụrụ ịsụgharị ya n’usoro siri ike karị dịka, “site n’arịrịọ ha maka unu, ebe ha na-agụsi ha agụụ ike ịhụ unu.”
  rationale: Asụsụ Grik ahụ kpọkọtara okwu ọnụ n’ụzọ dị mkpirikpi, ọ pụkwara igosi ọnọdụ ha nọ na ya mgbe ha na-ekpe ekpere ma ọ bụ ụzọ ha si egosipụta agụụ ha. Nsụgharị a na-echekwa omume abụọ ahụ n’enweghị ikwu kpọmkwem karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Agụsi ha agụụ ike ịhụ unu” na-enye ἐπιποθέω n’ụzọ Igbo eke; “amara Chineke karịrị akarị” na-echekwa ike okwu ὑπερβάλλουσαν χάριν. Akara ala peeji [a] dị n’ahịrị isi dịka achọrọ.
