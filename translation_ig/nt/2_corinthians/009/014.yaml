revisions:
- from: mgbe ha na-ekpekwa ekpere maka unu[a], ha na-agụsi ha agụụ ike ịhụ unu n’ihi amara Chineke karịrị akarị nke dịkwasịrị unu.
  to: Ha na-ekpekwa ekpere maka unu[a], na-agụsi unu agụụ ike n’ihi amara Chineke karịrị akarị nke dịkwasịrị unu.
  rationale: The revision preserves the two linked actions in the Greek—praying for and longing for—without adding a wish to see the recipients or resolving their relationship as explicitly temporal. It also corrects the object of “agụsi ... agụụ ike” and updates the footnote to match the source faithfully.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:27:31Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys prayer for the Corinthians, their longing, the causal force of διά, and God's surpassing grace upon them. However, it adds “ịhụ” (“to see”), which is not present in ἐπιποθούντων, and the repeated pronoun in “ha na-agụsi ha agụụ ike” is not a faithful or clear object for “long for.” “Mgbe” also unnecessarily specifies a temporal relation that the compressed Greek does not require.
  naturalness: “Ha na-ekpekwa ekpere maka unu, na-agụsi unu agụụ ike” is natural Standard Igbo and retains the close connection between praying and longing without making the relationship explicitly temporal. “Dịkwasịrị unu” remains an appropriate rendering of ἐφ’ ὑμῖν.
  terminology: “Ekpere,” “amara Chineke,” “karịrị akarị,” and “maka unu” are suitable and appropriately dignified. The revision removes the unsupported “ịhụ” while keeping the idiomatic Igbo expression “ịgụ mmadụ agụụ ike.”
  issues:
  - severity: medium
    issue: The main text adds “ịhụ” (“to see”) to the longing.
    rationale: ἐπιποθούντων means “longing for/yearning for” and does not specify a desire to see the Corinthians. Adding this narrows the source meaning.
  - severity: medium
    issue: “Ha na-agụsi ha agụụ ike ịhụ unu” has an unclear and redundant pronominal construction.
    rationale: The object of the longing should be “unu.” The intervening “ha” is not needed and obscures the sense.
  - severity: low
    issue: “Mgbe” imposes a temporal relationship between prayer and longing.
    rationale: The Greek associates the participle with the praying persons but does not require “while/when.” A participial continuation in Igbo better preserves the syntactic openness.
  - severity: medium
    issue: The footnote repeats the unsupported “ịhụ.”
    rationale: The lexical-alternative note must not retain material absent from the Greek source.
  revised_text: Ha na-ekpekwa ekpere maka unu[a], na-agụsi unu agụụ ike n’ihi amara Chineke karịrị akarị nke dịkwasịrị unu.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ekpere arịrịọ ha maka unu, ebe ha na-agụsi unu agụụ ike.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the two linked actions in the Greek—praying for and longing for—without adding a wish to see the recipients or resolving their relationship as explicitly temporal. It also corrects the object of “agụsi ... agụụ ike” and updates the footnote to match the source faithfully.
