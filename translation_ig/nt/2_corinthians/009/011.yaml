source:
  edition: SBLGNT
  text: ἐν παντὶ πλουτιζόμενοι εἰς πᾶσαν ἁπλότητα, ἥτις κατεργάζεται δι’ ἡμῶν εὐχαριστίαν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/011.yaml
  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: ig
  text: a na-eme ka unu baa ọgaranya n’ụzọ niile, ka unu nwee ike na-emesapụ aka n’ụzọ niile[a], nke site n’aka anyị na-ebute ekele nye Chineke—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka unu nwee ike inye ihe n’obi sara mbara.” N’ebe ndị ọzọ, okwu Grik ἁπλότης nwekwara ike ịpụta “ezi obi” ma ọ bụ “ịdị mfe,” ma n’ebe a, ihe a na-ekwu banyere inye onyinye na-akwado “mmesapụ aka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντὶ
  choice: n’ụzọ niile
  rationale: Nke a na-egosi obosara nke onyinye na nkwado Chineke, ọ bụghị naanị ọnọdụ ma ọ bụ ihe otu kpọmkwem.
- source_word: πλουτιζόμενοι
  choice: a na-eme ka unu baa ọgaranya
  rationale: 'Ụdị okwu a na-edobe echiche nke passive participle: Chineke bụ onye a na-aghọta na ọ na-eme ka ha nwee ihe n’ụba. Ọ naghị ekwu na ha na-eme onwe ha ọgaranya.'
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: ka unu nwee ike na-emesapụ aka n’ụzọ niile
  rationale: N’ọnọdụ a gbasara inye onyinye, ἁπλότης pụtara mmesapụ aka. Ntughari a na-egosikwa nzube ma ọ bụ ihe si n’ime ka e mee ha ọgaranya pụta.
- source_word: ἥτις
  choice: mmesapụ aka a
  rationale: Ịkpọghachi aha ahụ n’Igbo na-eme ka ihe nnọchiaha ahụ na-ezo aka na ya doo anya, ya bụ mmesapụ aka e kwuru okwu ya.
- source_word: κατεργάζεται
  choice: mee ka
  rationale: N’okwu a, ngwaa ahụ pụtara imepụta ma ọ bụ iweta otu nsonaazụ.
- source_word: δι’ ἡμῶν
  choice: na-esitekwa n’aka anyị
  rationale: Nke a na-edobe διά na genitive dị ka ụzọ ma ọ bụ ndị e ji zipụ onyinye ahụ, n’agbanyeghị na ọrụ ha anaghị akọwa n’ụzọ sara mbara.
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: ka e kelee Chineke
  rationale: Nke a bụ ụzọ Igbo dị ndụ na nke doro anya isi kwuo na mmesapụ aka ahụ na-eweta ekele a na-enye Chineke.
theological_decisions:
- issue: Ihe ἁπλότης pụtara n’ọnọdụ nchịkọta onyinye a
  choice: mmesapụ aka n’inye ihe
  alternative: ịdị mfe, ezi obi, ma ọ bụ inwe otu uche
  rationale: Ọ bụ ezie na okwu ahụ nwere ike ịpụta ịdị mfe ma ọ bụ ezi obi n’ebe ndị ọzọ, okwu gbara ya gburugburu ebe a bụ maka inye ihe, ihe ndị e nyere n’ụba, na ekele nke na-esochi ya. N’ihi ya, mmesapụ aka bụ nghọta dabara adaba, na-enweghị ịgbanwe ya ka ọ bụrụ naanị àgwà dị n’ime obi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, mee ihe. A họọrọ usoro ahịrịokwu na-aga n’ihu n’ihi na amaokwu Grik a bụ akụkụ nke ahịrịokwu buru ibu. E debere akara ogologo n’ọgwụgwụ iji gosipụta njikọ ahụ.
