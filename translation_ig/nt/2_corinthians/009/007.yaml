  text: ἕκαστος καθὼς ⸀προῄρηται τῇ καρδίᾳ, μὴ ἐκ λύπης ἢ ἐξ ἀνάγκης· ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: ig
  text: Onye ọ bụla nye dịka o kpebirila n’obi ya, ọ bụghị n’ihi mwute[a] ma ọ bụ n’ihi mmanye; n’ihi na Chineke hụrụ onye ji obi ụtọ enye n’anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ bụghị n’achọghị inye.” Okwu Grik ahụ pụtara kpọmkwem “ọ bụghị n’ihi mwute” ma ọ bụ “ọ bụghị n’ihi iru újú.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: Onye ọ bụla
  rationale: Nke a na-edobe echiche nke onye n’otu n’otu, ma ọ naghị eme ka okwu ahụ bụrụ naanị maka nwoke.
- source_word: καθὼς προῄρηται τῇ καρδίᾳ
  choice: dịka o kpebiri n’obi ya
  rationale: “O kpebiri” na-egosi mkpebi e ji nlezianya mee tupu e nye ihe; “n’obi ya” na-edobe okwu Baịbụl banyere ime mmadụ.
- source_word: μὴ ἐκ λύπης
  choice: ọ bụghị n’ihi mwute[a]
  rationale: Nke a na-edobe isi ihe λύπη pụtara, ya bụ mwute ma ọ bụ iru újú, kama ịkọwa ya naanị dị ka enweghị mmasị.
- source_word: ἢ ἐξ ἀνάγκης
  choice: ma ọ bụ n’ihi mmanye
  rationale: “Mmanye” na-egosi nrụgide ma ọ bụ ọnọdụ nke na-amanye mmadụ ime ihe, nke dabara n’ihe gbasara inye onyinye.
- source_word: ἱλαρὸν δότην
  choice: onye ji obi ụtọ enye ihe
  rationale: Nkebiokwu a na-egosi onye na-enye ihe n’ọṅụ na site n’obi dị njikere; ọ bụkwa Igbo nkịtị ma doo anya.
- source_word: ἀγαπᾷ ὁ θεός
  choice: Chineke hụrụ ... n’anya
  rationale: Nke a bụ nsụgharị kpọmkwem na nke a na-ejikarị asụ ἀγαπάω, na-ahapụghị echiche ịhụnanya Chineke.
theological_decisions:
- issue: Ụdị onye n’otu n’otu na okwu na-adịghị akọwa nwoke ma ọ bụ nwaanyị
  choice: Onye ọ bụla ... o ... ya
  alternative: Nwoke ọ bụla ... o ... ya
  rationale: ἕκαστος bụ otu onye n’ụdị nnọchianya, ọ bụghị okwu e bu n’obi kpọchie naanị n’ebe ụmụ nwoke nọ. Nnọchiaha Igbo “o/ya” na-edobe otu onye ahụ ma ọ naghị akọwa nwoke ma ọ bụ nwaanyị.
- issue: Ihe λύπη pụtara n’ihe gbasara inye ihe
  choice: ọ bụghị n’ihi mwute
  alternative: ọ bụghị n’achọghị inye
  rationale: Isi okwu Grik pụtara mwute ma ọ bụ iru újú. E debere ihe ahụ pụtara n’ahịrịokwu, ebe nkọwa ala peeji na-egosi echiche nke ime ihe n’achọghị ya nke ọnọdụ a nwekwara ike ịpụta.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. “Onye ọ bụla” na “o/ya” na-edobe onye n’otu n’otu n’enweghị ịtụkwasị nwoke ma ọ bụ nwaanyị n’elu ihe odide ahụ. A gbakwụnyere “ihe” mgbe e kwuru inye ka ahịrịokwu ahụ bụrụ Igbo eke, n’agbanyeghị na ihe a na-enye anaghị akọwapụta kpọmkwem n’asụsụ Grik.
