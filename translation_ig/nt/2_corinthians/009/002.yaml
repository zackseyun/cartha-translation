id: 2CO.9.2
reference: 2 Corinthians 9:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: ig
  text: N’ihi na ama m ịdị njikere unu[a], nke m na-etu ọnụ banyere unu n’ihu ndị Masedonia, na-ekwu na, “Akaịa adịla njikere kemgbe afọ gara aga[b].” Ọzọkwa, ịnụ ọkụ n’obi unu akpalitewokwa ọtụtụ n’ime ha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọchịchọ unu ime ihe.”
    reason: lexical_alternative
  - marker: b
    text: Akaịa bụ ógbè gụnyere Kọrịnt; n’ebe a, Pọl ji aha ógbè ahụ na-ekwu maka ndị kwere ekwe nọ na ya.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “ọnụ ọgụgụ ka ukwuu n’ime ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμίαν
  choice: otú obi siri dị unu njikere
  rationale: Nkebi okwu a na-egosi ọchịchọ sitere n’obi na ịdị njikere ime ihe; ọ bụ Igbo dị mfe ma doo anya, ma ọ naghị eme ka okwu ahụ bụrụ naanị nkwadebe ihe.
- source_word: καυχῶμαι
  choice: Ana m etu ọnụ banyere unu
  rationale: “Ịtu ọnụ” na-echekwa ike okwu Pọl ji kwuo na ọ na-anya isi banyere ha, kama ime ka okwu ahụ dị nro karịa nke Grik.
- source_word: ὑπὲρ ὑμῶν
  choice: banyere unu
  rationale: N’ọnọdụ a, ọ na-egosi na Pọl na-ekwu ihe ọma banyere ha n’ihu ndị Masedonia.
- source_word: Μακεδόσιν
  choice: ndị Masedonia
  rationale: Nke a na-ezo aka n’ebe ndị Masedonia nọ, n’agbakwụnyeghị nkọwa ndị na-adịghị n’ahịrịokwu Grik.
- source_word: Ἀχαΐα
  choice: Akaịa
  rationale: E debere aha ógbè ahụ dịka Grik si kwuo ya, ọ bụ ezie na n’ebe a aha ógbè ahụ na-anọchi anya ndị kwere ekwe bi na ya.
- source_word: παρεσκεύασται
  choice: adịla njikere
  rationale: Nke a na-egosi ọnọdụ ịdị njikere nke sitere na nkwadebe e mere tupu mgbe ahụ.
- source_word: ἀπὸ πέρυσι
  choice: kemgbe afọ gara aga
  rationale: Ọ na-egosi na ọnọdụ ahụ malitere n’afọ gara aga ma ruo ugbu a.
- source_word: τὸ ὑμῶν ζῆλος
  choice: ịnụ ọkụ n’obi unu
  rationale: Akpaala okwu Igbo a na-egosi ịnụ ọkụ n’obi siri ike na ezi ọchịchọ ime ihe.
- source_word: ἠρέθισε
  choice: akpalitewokwa
  rationale: N’ebe a, okwu ahụ pụtara ịkwalite ma ọ bụ ime ka ndị ọzọ nwekwuo mkpali; “akpalitewo” na-ezere echiche ọjọọ nke ịkpasu iwe.
- source_word: τοὺς πλείονας
  choice: ihe ka ọtụtụ n’ime ha
  rationale: Nke a na-egosi ọtụtụ karịa ọkara, ya bụ ihe ka n’ọnụ ọgụgụ n’etiti ndị Masedonia a kpọtụrụ aha.
theological_decisions:
- issue: Ihe “Akaịa” na-anọchi anya ya
  choice: E debere “Akaịa” dịka aha ógbè nke na-anọchi anya ndị kwere ekwe nọ n’ebe ahụ.
  alternative: “unu” ma ọ bụ “ndị kwere ekwe nọ n’Akaịa adịla njikere”
  rationale: Grik kpọrọ ógbè Akaịa aha kpọmkwem. Idebe ya na-echekwa ụzọ Pọl si kwuo okwu na obosara mpaghara ọ na-ekwu maka ya, ebe nkọwa ala peeji na-eme ka ihe ọ na-anọchi anya ya doo anya.
- issue: Ike okwu Pọl banyere ịnya isi
  choice: “Ana m etu ọnụ banyere unu”
  alternative: “Ana m ekwu okwu ọma banyere unu” ma ọ bụ “Ana m eji unu anya isi”
  rationale: καυχῶμαι bụ okwu siri ike nke pụtara ịtu ọnụ ma ọ bụ ịnya isi. Nsụgharị a anaghị eme ka ike okwu Pọl dị nro ma ọ bụ tinye nkọwa ozizi n’ime ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. “Otú obi siri dị unu njikere” na “ịnụ ọkụ n’obi unu” kewapụtara echiche προθυμία na ζῆλος n’ụzọ eke. E debere aha ógbè Akaịa na ike okwu “ịtu ọnụ,” ebe nkọwa ala peeji na-akọwa naanị ihe dị mkpa n’enweghị itinye echiche otu ụka.
