revisions:
- from: N’ihi na ama m otú obi siri dị unu njikere[a]. Ana m etu ọnụ banyere unu n’ihu ndị Masedonia, na-asị, “Akaịa adịla njikere kemgbe afọ gara aga[b],” ịnụ ọkụ n’obi unu akpalitewokwa ihe ka ọtụtụ n’ime ha[c].
  to: N’ihi na ama m ịdị njikere unu[a], nke m na-etu ọnụ banyere unu n’ihu ndị Masedonia, na-ekwu na, “Akaịa adịla njikere kemgbe afọ gara aga[b].” Ọzọkwa, ịnụ ọkụ n’obi unu akpalitewokwa ọtụtụ n’ime ha[c].
  rationale: The revision replaces the strained opening with idiomatic “ịdị njikere unu,” retains Paul’s direct boast and the explicit name Akaịa, and uses a separate sentence with “Ọzọkwa” to express the Greek καί clearly. “Ọtụtụ n’ime ha” gives a natural rendering of τοὺς πλείονας without overstating or altering its implied Macedonian referent. Footnote markers and notes remain aligned with their respective terms.
