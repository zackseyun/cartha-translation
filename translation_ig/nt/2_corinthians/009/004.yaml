revisions:
- from: Ka ọ ghara ịbụ na, ọ bụrụ na ụfọdụ ndị Masedonia eso m bịa, ha achọpụta na unu akwadobeghị, a ga-eme anyị ihere—ka m ghara ikwu maka unu[b]—n'okwu ntụkwasị obi a[a].
  to: Ka ọ ghara ịbụ na ụfọdụ ndị Masedonia eso m bịa chọpụta na unu akwadobeghị, a ga-eme anyị ihere—ka anyị ghara ikwu maka unu[b]—n'ihe a anyị nwere ntụkwasị obi banyere unu[a].
  rationale: The revision corrects the singular/plural mismatch, smooths the feared conditional into idiomatic Standard Igbo, and clarifies the contextual sense of ὑπόστασις. Footnote anchors remain attached to the expressions they explain, and the alternatives preserve lexical ambiguity without doctrinal expansion.
