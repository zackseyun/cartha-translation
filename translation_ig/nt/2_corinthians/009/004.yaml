language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: ig
  text: Ka ọ ghara ịbụ na ụfọdụ ndị Masedonia eso m bịa chọpụta na unu akwadobeghị, a ga-eme anyị ihere—ka anyị ghara ikwu maka unu[b]—n'ihe a anyị nwere ntụkwasị obi banyere unu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “na ntụkwasị obi a.” N'ọnọdụ a, okwu Grik ahụ nwekwara ike ịpụta “ọrụ a e kpebiri ime” ma ọ bụ “ọnọdụ a,” ma o yikarịrị ka ọ na-ezo aka na ntụkwasị obi Pọl nwere banyere unu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “ka anyị ghara ikwukwa maka unu.” Site n'okwu a o tinyere n'etiti, Pọl na-egosi na ihere ahụ ga-erukwa ndị Kọrịnt ma a chọpụta na ha akwadobeghị.
    reason: alternative_reading
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: Ka ọ ghara ịbụ na, ọ bụrụ na
  rationale: Nke a na-egosi nchegbu Pọl banyere ihe nwere ike ime n'ọdịnihu ma debe ma echiche mgbochi nke μή πως ma ọnọdụ nke ἐὰν.
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: ụfọdụ ndị Masedonia eso m bịa
  rationale: Aha ahụ enweghị article ma na-ezo aka n'ìgwè a na-akọwaghị kpọmkwem; “ụfọdụ” na-egosi na ọ bụghị ndị Masedonia niile.
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: ha achọpụta na unu akwadobeghị
  rationale: Nke a bụ Igbo doro anya nke na-egosi na ndị Kọrịnt adịghị njikere, karịsịa banyere onyinye a na-achịkọta.
- source_word: καταισχυνθῶμεν
  choice: a ga-eme anyị ihere
  rationale: Ụdị a na-echekwa echiche passive nke ịbụ ndị e mere ihere n'ihu ndị ọzọ, ọ bụghị naanị inwe mmetụta ihere n'ime obi.
- source_word: ἡμεῖς
  choice: anyị
  rationale: Nnọchiaha Grik ahụ siri ike; ntụpọ ogologo na okwu etiti na-eme ka “anyị” pụta ìhè n'Igbo.
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: ka m ghara ikwu maka unu
  rationale: Ọ na-eme ka okwu Pọl dị nro, ma ka na-egosi na ihere ahụ ga-erukwa ndị Kọrịnt.
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: n'okwu ntụkwasị obi a
  rationale: N'ọnọdụ a ὑπόστασις yikarịrị ka ọ na-ezo aka na ntụkwasị obi Pọl nwere banyere ịdị njikere ha; “n'okwu” na-eme ka nkebi ahụ bụrụ Igbo dị ndụ n'enweghị itinye echiche nkà ihe ọmụma nke “substance.”
theological_decisions:
- issue: Ihe ὑπόστασις pụtara n'okwu Pọl a na-abụghị okwu nka banyere nkà ihe ọmụma ma ọ bụ nkà mmụta okpukpe
  choice: ntụkwasị obi, ya bụ ihe ndabere nke obi ike Pọl banyere ha
  alternative: ọrụ a e kpebiri ime, ma ọ bụ ọnọdụ a
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ ntụkwasị obi Pọl na ndị Kọrịnt ga-adị njikere tupu ndị Masedonia abịa. Nhọrọ a dabara n'ọnọdụ ahụ ma ghara ibubata nkọwa “substance” nke e mechara jiri okwu a kọwaa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Ka ọ ghara ịbụ na, ọ bụrụ na” na-edebe usoro nchegbu na ọnọdụ dị na Grik n'agbanyeghị na ọ dị ntakịrị arọ; nke a na-echekwa esemokwu nke ahịrịokwu mbụ. E tinyere akara nkọwa [a] n'akụkụ “ntụkwasị obi,” ebe [b] nọ n'akụkụ okwu etiti ọ na-akọwa.
