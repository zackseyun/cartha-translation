    text: A pụkwara ịtụgharị ya, “ka anyị ghara ikwukwa maka unu.” Site n'okwu a o tinyere n'etiti, Pọl na-egosi na ihere ahụ ga-erukwa ndị Kọrịnt ma a chọpụta na ha akwadobeghị.
    reason: alternative_reading
  revision_rationale: The revision corrects the singular/plural mismatch, smooths the feared conditional into idiomatic Standard Igbo, and clarifies the contextual sense of ὑπόστασις. Footnote anchors remain attached to the expressions they explain, and the alternatives preserve lexical ambiguity without doctrinal expansion.
