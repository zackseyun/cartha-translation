  text: Περὶ μὲν γὰρ τῆς διακονίας τῆς εἰς τοὺς ἁγίους περισσόν μοί ἐστιν τὸ γράφειν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/001.yaml
  text: For concerning the ministry to the saints[a], it is superfluous for me to write to you,
translation:
  language: ig
  text: Ma banyere ozi a na-ejere ndị nsọ[a], ọ dịghị mkpa ka m degara unu akwụkwọ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ozi maka ndị nsọ.” N’asụsụ Grik, mkpụrụokwu ahụ pụrụ igosi ma ebe ozi ahụ na-aga ma ọ bụ ndị ọ ga-abara uru.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ μὲν γὰρ
  choice: Ma banyere
  rationale: “Banyere” na-ewebata isiokwu ahụ, ebe “ma” na-ejikọta ya na okwu ndị bu ya ụzọ ma na-egosi ntughari gaa n’isiokwu a n’ụzọ Igbo dị mfe.
- source_word: διακονίας
  choice: ozi a na-ejere
  rationale: N’ebe a, διακονία bụ ọrụ enyemaka a na-arụ maka ndị kwere ekwe nọ ná mkpa. “Ozi a na-ejere” na-edobe nsọpụrụ Pọl nyere ọrụ ahụ, ma dokwaa echiche nke ije ozi.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: ndị nsọ[a]
  rationale: Akara okwu a nwere ike igosi ebe ọrụ ahụ na-aga ma ọ bụ ndị ọ ga-abara uru. Isi ederede jiri usoro Igbo nkịtị, ebe ihe odide ala peeji na-edobe ụzọ nghọta abụọ ahụ.
- source_word: ἁγίους
  choice: ndị nsọ
  rationale: Nke a bụ aha Pọl na-akpọkarị ndị kwere ekwe dịka ndị e doro iche nye Chineke; “ndị nsọ” bụ okwu Igbo dị mkpụmkpụ, a maara nke ọma, nke kwekọrọ na ya.
- source_word: περισσόν
  choice: ọ dịghị mkpa
  rationale: N’ebe a okwu ahụ pụtara na idegara ha akwụkwọ karịrị ihe dị mkpa ma ọ bụ na ọ dịghị mkpa. “Ọ dịghị mkpa” bụ Igbo doro anya ma na-ebute ike okwu ahụ n’enweghị asụsụ siri ike na-enweghị isi.
- source_word: μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: ka m degara unu akwụkwọ
  rationale: Usoro a na-asụ Igbo n’ụzọ ebumpụta ụwa ma na-edobe onye na-ede ihe na ndị a na-edegara ya.
theological_decisions:
- issue: Ndị διακονία ahụ na-aga ma ọ bụ na-abara uru
  choice: ozi a na-ejere ndị nsọ[a]
  alternative: ozi maka ndị nsọ
  rationale: εἰς nwere ike igosi ntụziaka ma ọ bụ ndị ga-erite uru. Isi ederede na ihe odide ala peeji na-edobe mgbagwoju anya ahụ kama ikpebi naanị otu.
translation_notes:
  register: Asụsụ Igbo izugbe, nke ugbu a ma dị ùgwù. E ji “ozi a na-ejere” mee ka echiche nke ọrụ enyemaka na nsọpụrụ nke διακονία pụta ìhè; e zere okwu ụka pụrụ iche nke otu denominashọn.
