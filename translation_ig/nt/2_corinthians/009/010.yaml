revisions:
- from: Onye na-enye onye na-agha mkpụrụ mkpụrụ ọ ga-agha, na-enyekwa achịcha ka e rie, ga-enye unu mkpụrụ ma mee ka ọ baa ụba, meekwa ka ihe ubi nke ezi omume unu baa ụba[a][b].
  to: Onye na-enye mkpụrụ nye onye na-agha mkpụrụ, na-enyekwa achịcha ka e rie, ga-enye unu mkpụrụ ma mee ka mkpụrụ unu baa ụba, meekwa ka ihe ubi nke ezi omume unu baa ụba[a][b].
