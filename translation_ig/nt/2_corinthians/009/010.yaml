review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the source’s agricultural sequence: seed for the sower, bread for consumption, provision and multiplication of the recipients’ seed, and increase of the produce of their righteousness. However, “onye na-agha mkpụrụ mkpụrụ ọ ga-agha” is repetitious and less direct than the Greek construction, which simply says “seed to the one who sows.” The revision states this naturally and preserves the distinction between seed and bread.'
  naturalness: The main sentence is clear Standard Igbo, but the opening wording is awkward because of the doubled “mkpụrụ.” The revised wording, “mkpụrụ nye onye na-agha mkpụrụ,” is idiomatic and unambiguous. Footnote a is also smoothed so that its alternative clearly corresponds to Greek γενήματα (“produce/fruits”).
  terminology: “Ezi omume” is an appropriate primary rendering for δικαιοσύνη here. “Ihe ubi” appropriately conveys γενήματα in the agricultural metaphor. The alternative “ikpe ziri ezi” is retained in the second footnote without forcing a narrower interpretation.
  issues:
  - severity: medium
    issue: Awkward and repetitive rendering of σπόρον τῷ σπείροντι
    rationale: “Onye na-enye onye na-agha mkpụrụ mkpụrụ ọ ga-agha” repeats “mkpụrụ” in a way that interrupts natural Igbo and adds the relative idea “that he will sow,” which is not explicit in the Greek. “Onye na-enye mkpụrụ nye onye na-agha mkpụrụ” is direct, natural, and source-faithful.
  - severity: low
    issue: Footnote a is imprecisely phrased
    rationale: “mkpụrụ/ihe ezi omume unu na-amị” is syntactically awkward and can sound as though righteousness itself is the thing producing. The footnote should plainly offer “produce/fruits of your righteousness” as the lexical alternative for γενήματα.
  revised_text: Onye na-enye mkpụrụ nye onye na-agha mkpụrụ, na-enyekwa achịcha ka e rie, ga-enye unu mkpụrụ ma mee ka mkpụrụ unu baa ụba, meekwa ka ihe ubi nke ezi omume unu baa ụba[a][b].
  revised_footnotes:
