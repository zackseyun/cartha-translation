    text: Ma ọ bụ, “mee ka mkpụrụ, ma ọ bụ ihe ubi, nke ezi omume unu baa ụba.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe ubi nke ikpe ziri ezi unu.” Okwu Grik δικαιοσύνη pụrụ ịpụta “ezi omume” ma ọ bụ, n'ọnọdụ ụfọdụ, “ikpe ziri ezi.”
    reason: alternative_reading
  revision_rationale: The revision removes an unnatural repetition in the opening agricultural phrase, preserves every element of the Greek sentence and its future promises, and clarifies the lexical-alternative footnote. It does not narrow the metaphor or impose a theological interpretation.
