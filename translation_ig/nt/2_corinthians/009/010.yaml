reference: 2 Corinthians 9:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιχορηγῶν ⸀σπόρον τῷ σπείροντι καὶ ἄρτον εἰς βρῶσιν ⸀χορηγήσει καὶ ⸀πληθυνεῖ τὸν σπόρον ὑμῶν καὶ ⸀αὐξήσει τὰ γενήματα τῆς δικαιοσύνης ὑμῶν·)
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/010.yaml
  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: ig
  text: Onye na-enye mkpụrụ nye onye na-agha mkpụrụ, na-enyekwa achịcha ka e rie, ga-enye unu mkpụrụ ma mee ka mkpụrụ unu baa ụba, meekwa ka ihe ubi nke ezi omume unu baa ụba[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mee ka mkpụrụ, ma ọ bụ ihe ubi, nke ezi omume unu baa ụba.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe ubi nke ikpe ziri ezi unu.” Okwu Grik δικαιοσύνη pụrụ ịpụta “ezi omume” ma ọ bụ, n'ọnọdụ ụfọdụ, “ikpe ziri ezi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: onye na-enye
  rationale: A sụgharịrị participle ahụ e ji article mee aha onye dị ka “onye na-enye.” Nke a na-egosi onye na-eweta ihe dị mkpa n'ụzọ doro anya ma dịkwa mfe n'Igbo.
- source_word: σπόρον τῷ σπείροντι
  choice: onye na-agha mkpụrụ mkpụrụ ọ ga-agha
  rationale: Nke a debere ihe atụ ọrụ ugbo nke mkpụrụ na ịgha mkpụrụ, ma mee ka mmekọrịta dị n'etiti onye na-enye na onye na-agha doo anya n'Igbo.
- source_word: ἄρτον εἰς βρῶσιν
  choice: achịcha ka e rie
  rationale: Nke a bụ nsụgharị ebumnuche dị mfe ma bụrụ okwu Igbo nkịtị; ọ na-edobekwa ọdịiche dị n'etiti mkpụrụ a ga-agha na achịcha a ga-eri.
- source_word: χορηγήσει καὶ πληθυνεῖ τὸν σπόρον ὑμῶν
  choice: ga-enye unu mkpụrụ ma mee ka ọ baa ụba
  rationale: 'Okwu ọdịnihu abụọ ahụ ka e debere: Chineke ga-enye ma meekwa ka mkpụrụ ahụ mụbaa. Nhazi a na-ada nke ọma n''Igbo ma ghara ịtụgharị ihe atụ ahụ ka ọ bụrụ naanị akụnụba.'
- source_word: αὐξήσει τὰ γενήματα
  choice: meekwa ka ihe ubi ... baa ụba
  rationale: “Ihe ubi” na-anọchi mkpụrụ ma ọ bụ ihe a rụpụtara n'ọrụ ugbo, ma na-aga n'ihu n'ihe atụ nke ịgha mkpụrụ na owuwe ihe ubi.
- source_word: δικαιοσύνης ὑμῶν
  choice: ezi omume unu
  rationale: “Ezi omume” bụ okwu Igbo a na-aghọta nke ọma maka δικαιοσύνη n'ọnọdụ a, na-enweghị imechi ihe ọ pụtara ka ọ bụrụ naanị ikpe ziri ezi ma ọ bụ naanị ọnọdụ a gụrụ mmadụ dịka onye ezi omume.
theological_decisions:
- issue: Ihe “ihe ubi nke ezi omume unu” pụtara
  choice: E debere ya dịka ihe atụ nke mkpụrụ ma ọ bụ nsonaazụ ezi omume ha, karịsịa mmesapụ aka ha, na-amị.
  alternative: Ọ pụrụ izo aka n'ịba ụba nke ngọzi ihe onwunwe, na mkpụrụ nke ikpe ziri ezi, ma ọ bụ n'ihe akaebe nke ndụ ezi omume.
  rationale: Ọnọdụ amaokwu a bụ maka inye ihe n'ụba, ma ihe atụ ọrụ ugbo ahụ sara mbara. Ya mere, nsụgharị ahụ anaghị eme ka nkwa ahụ bụrụ ozizi banyere akụnụba naanị, ma ọ bụ mee ka δικαιοσύνη bụrụ naanị otu echiche nkà mmụta okpukpe.
- issue: δικαιοσύνη dịka ezi omume ma ọ bụ ikpe ziri ezi
  choice: E tinyere “ezi omume” n'ahịrị amaokwu.
  alternative: “Ikpe ziri ezi” bụkwa ihe okwu Grik ahụ pụrụ ịpụta n'ọnọdụ ụfọdụ.
  rationale: “Ezi omume” dabara nke ọma n'okwu Pọl ebe a ma na-edobe obosara omume na mmụọ nke okwu ahụ; e chekwara nhọrọ “ikpe ziri ezi” n'okpuru peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. E debere usoro ihe atụ ọrụ ugbo—mkpụrụ, ịgha mkpụrụ, na ihe ubi—ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa nke otu denominashọn.
