  rationale: The verse text is retained because it faithfully and naturally conveys the Greek’s thanksgiving and its sense of a gift beyond adequate description. The footnote is revised to replace an unclear expression with a natural Standard Igbo alternative and to state the adjective’s descriptive/narrative range more idiomatically.
