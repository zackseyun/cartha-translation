  text: ⸀χάρις τῷ θεῷ ἐπὶ τῇ ἀνεκδιηγήτῳ αὐτοῦ δωρεᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/015.yaml
  text: Thanks be to God for his indescribable gift[a].
translation:
  language: ig
  text: Ekele dịrị Chineke n’ihi onyinye ya nke a na-apụghị ịkọwa n’ụzọ zuru ezu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onyinye ya nke a na-apụghị ikwu akọwa.” Okwu Grik ahụ nwere ike ịpụta ihe a na-apụghị ịkọwa ma ọ bụ kọọ n’ụzọ zuru ezu.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: Ekele dịrị
  rationale: N’usoro okwu a, χάρις bụ mkpu e ji ekele ma na-eto Chineke, ọ bụghị ‘amara.’ ‘Ekele dịrị’ bụ okwu Igbo doro anya ma na-echekwa ike otuto dị n’ahịrịokwu ahụ.
- source_word: τῷ θεῷ
  choice: Chineke
  rationale: Ọ bụ onye a na-enye ekele; ya na ‘Ekele dịrị’ jikọtara ọnụ n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: ἐπὶ
  choice: n’ihi
  rationale: N’ebe a, ἐπί ya na dative na-egosi ihe kpatara ekele ahụ. ‘N’ihi’ na-egosipụta ihe a nke ọma n’Igbo.
- source_word: ἀνεκδιηγήτῳ
  choice: nke a na-apụghị ịkọwa n’ụzọ zuru ezu
  rationale: Adjective a na-ekwu banyere ihe okwu ma ọ bụ akụkọ na-apụghị ịkọcha. Nkebiokwu a na-echekwa echiche ahụ ma ghara ime ka ọ bụrụ na enweghị ike ikwu ihe ọ bụla banyere onyinye ahụ.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’ebe Chineke nọ, ma ‘ya’ na-echekwa ụdị nnọchiaha nke Grik n’enweghị ịgbakwụnye nkọwa ọzọ.
- source_word: δωρεᾷ
  choice: onyinye
  rationale: δωρεά bụ ihe e nyere n’efu. ‘Onyinye’ zuru oke n’Igbo; ịgbakwụnye ‘n’efu’ abụghị ihe dị mkpa n’ahịrịokwu a.
theological_decisions:
- issue: Ihe ‘onyinye ya nke a na-apụghị ịkọwa n’ụzọ zuru ezu’ na-ezo aka na ya
  choice: A hapụrụ ya ka ọ bụrụ onyinye Chineke n’enweghị ịkọwapụta kpọmkwem ihe ọ bụ.
  alternative: Ịkọwa ya kpọmkwem dị ka Kraịst, nzọpụta ma ọ bụ amara dị na Kraịst, ma ọ bụ onyinye Chineke nke gụnyere mmesapụ aka ndị Kọrịnt.
  rationale: Amaokwu ahụ n’onwe ya kwuru naanị ‘onyinye ya.’ Ọnọdụ gbara ya gburugburu metụtara amara Chineke na-arụpụta mmesapụ aka, ebe ọtụtụ ndị Kraịst na-ahụkwa Kraịst dị ka isi onyinye ahụ. Ịhapụ okwu ahụ ka ọ dị obosara na-echekwa mgbagwoju anya na nrụgide nkà mmụta okpukpe dị n’isi mmalite ahụ.
translation_notes:
  register: Standard Igbo; okwu dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Ekele dịrị Chineke’ dịka mkpu otuto nkịtị, ebe ‘n’ụzọ zuru ezu’ na-egbochi nghọtahie na onyinye ahụ enweghị ike ịkọwa ya ma ọlị.
