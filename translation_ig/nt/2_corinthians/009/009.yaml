  text: (καθὼς γέγραπται· Ἐσκόρπισεν, ἔδωκεν τοῖς πένησιν, ἡ δικαιοσύνη αὐτοῦ μένει εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/009.yaml
  text: 'as it is written: “He scattered abroad[a], he gave to the poor; his righteousness remains forever.”'
translation:
  language: ig
  text: 'Dị ka e dere:


    “Ọ gbasasịrị ihe n’ebe niile; o nyere ndị ogbenye;

    ezi omume ya[a] na-adịgide ruo mgbe ebighị ebi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi ya na-adịgide ruo mgbe ebighị ebi.” Okwu Grik a nwere ike ịpụta ma ezi omume ma ikpe ziri ezi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: dị ka e dere, sị
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa ugwu e si webata ihe e hotara n’Akwụkwọ Nsọ.
- source_word: Ἐσκόρπισεν
  choice: Ọ gbasasịrị ihe n’ebe niile
  rationale: Nke a na-edobe onyinyo nke ịgbasa ihe ebe niile kama iji naanị okwu pụtara ikesa; “ihe” anaghị akọwapụta kpọmkwem ihe e nyere, dịka Grik ahụ na-emeghị.
- source_word: ἔδωκεν
  choice: o nyere
  rationale: Oge gara aga dị mfe kwekọrọ n’aorist Grik ma na-ada nke ọma n’Igbo.
- source_word: τοῖς πένησιν
  choice: ndị ogbenye
  rationale: Nke a bụ okwu Igbo a na-aghọta ngwa ngwa maka ndị na-enweghị ezigbo ihe ha ji ebi ndụ.
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: ezi omume ya
  rationale: “Ezi omume” na-enye isi echiche nke δικαιοσύνη n’ebe a—àgwà ma ọ bụ omume ziri ezi nke onye na-emesapụ aka—ma nhọrọ nke ikpe ziri ezi ka edobere n’ala peeji.
- source_word: μένει
  choice: na-adịgide
  rationale: Nke a na-egosi ihe na-anọgide, na-akwụsịghị ịdị.
- source_word: εἰς τὸν αἰῶνα
  choice: ruo mgbe ebighị ebi
  rationale: Ọ bụ ụzọ Igbo a na-ejikarị ekwu ihe na-adịgide ruo mgbe niile.
theological_decisions:
- issue: Otú e si sụgharịa δικαιοσύνη n’okwu Pọl hotara
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N’ebe a okwu ahụ nwere ike ịpụta ezi omume ma ọ bụ omume ikpe ziri ezi. “Ezi omume” kacha dabara n’omume onye na-enye ndị ogbenye, ebe ala peeji na-echekwa echiche ọzọ ahụ n’ebughị ụzọ kpebie esemokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, doro anya ma dị ugwu mee ya. E debere usoro abụ nke ahịrịokwu ahụ na onyinyo ịgbasa ihe ebe niile, ma zere ịkọwapụta ihe onye ahụ gbasasịrị ebe Grik na-akọwaghị ya.
