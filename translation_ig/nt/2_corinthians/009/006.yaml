  text: Τοῦτο δέ, ὁ σπείρων φειδομένως φειδομένως καὶ θερίσει, καὶ ὁ σπείρων ἐπ’ εὐλογίαις ἐπ’ εὐλογίαις καὶ θερίσει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: ig
  text: 'Ma nke a: onye na-agha mkpụrụ n’ntakịrị ga-ewekwa ihe ubi n’ntakịrị; onye na-agha mkpụrụ n’ụba[a] ga-ewekwa ihe ubi n’ụba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, okwu Grik ahụ pụtara “na ngọzi.” Ma n’amaokwu a, ọ bụ akpaalaokwu pụtara “n’ụba” ma ọ bụ “n’aka mmesapụ aka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: 'Ma nke a ka m na-ekwu:'
  rationale: Ọ na-ewebata ụkpụrụ Pọl chọrọ imesi ike. ‘Ma’ na-egosi ọrụ δέ dị ka njikọ okwu, ebe nkebi ahịrịokwu a dum na-ada nke ọma n’Igbo ugbu a n’enweghị itinye echiche oge dịka ‘ugbu a.’
- source_word: ὁ σπείρων
  choice: onye na-agha mkpụrụ
  rationale: Nke a na-edobe participle ahụ dịka okwu gbasara onye ọ bụla nọ n’ọnọdụ a, ma na-emekwa ka ihe atụ ịgha mkpụrụ doo anya.
- source_word: φειδομένως
  choice: n’ụzọ dị nta
  rationale: Ọ na-egosi na a na-agha mkpụrụ n’ókè pere mpe, n’etinyeghị ikpe siri ike nke okwu dịka ‘n’aka ntagide’ ga-eweta.
- source_word: καὶ θερίσει
  choice: ga-ewekwa ihe ubi
  rationale: ‘Ga-ewe ihe ubi’ bụ ụzọ Igbo doro anya si kwuo ịghọ ihe a kụrụ, ebe ‘-kwa’ na-edobe καί na njikọ kwekọrọ n’etiti ịgha mkpụrụ na iwe ihe ubi.
- source_word: ἐπ’ εὐλογίαις
  choice: na ngọzi
  rationale: Nhọrọ a na-edobe aha εὐλογία, ‘ngọzi,’ na ugboro abụọ ya, kama ịgbanwe ya ozugbo ka ọ bụrụ naanị ‘n’ụba’ ma ọ bụ ‘n’afọ ofufo.’ Ihe odide ala na-akọwa nghọta akpaalaokwu ya n’ebe a.
theological_decisions:
- issue: Ihe ἐπ’ εὐλογίαις pụtara n’ilu banyere ịgha mkpụrụ na iwe ihe ubi
  choice: na ngọzi
  alternative: n’ụba / n’afọ ofufo
  rationale: N’ọnọdụ a, okwu ahụ metụtara inye ihe n’ụba na n’afọ ofufo; ma aha Grik ahụ ka bụ ‘ngọzi.’ Idebe ‘ngọzi’ na-echekwa njikọ okwu na esemokwu echiche dị n’amaokwu ahụ, n’emeghị ya nkwa na onye nyere ihe ga-enwerịrị akụnụba anụ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị nsọpụrụ. E debere nhazi ilu ahụ na mmegharị okwu ‘ịgha mkpụrụ / iwe ihe ubi,’ tinyere ugboro abụọ nke ‘n’ụzọ dị nta’ na ‘na ngọzi.’
