review_pass:
  verdict: revise
  source_fidelity: The sowing/reaping parallel and future correspondence are conveyed accurately. However, ἐπ’ εὐλογίαις is idiomatic in this context for abundant or generous measure. Rendering it simply as “na ngọzi” is formally possible but is not natural Igbo in this proverb and may suggest merely sowing while blessed rather than sowing generously. The draft footnote also incorrectly offers “n’afọ ofufo” (“voluntarily”) as a lexical alternative; that meaning belongs to the following verse’s cheerful/free choice language, not directly to this expression.
  naturalness: “N’ụzọ dị nta” is understandable, but “n’ntakịrị” is more concise and proverbial for sparing measure. “N’ụba” is the natural Standard Igbo idiomatic equivalent in the corresponding positive line. “Ma nke a:” suitably introduces the stated principle without adding a temporal sense or an explicit verb absent from the Greek.
  terminology: Use “n’ụba” for the contextual meaning of ἐπ’ εὐλογίαις, with a footnote noting that the Greek noun literally means “blessings.” This preserves the lexical resonance without making the main Igbo text opaque. The agricultural terms “ịgha mkpụrụ” and “iwe ihe ubi” are appropriate.
  issues:
  - severity: medium
    issue: The main rendering “na ngọzi” for ἐπ’ εὐλογίαις is unnatural and semantically underdetermined in this proverbial context.
    rationale: The idiom denotes abundant/generous sowing and reaping. In Igbo, “na ngọzi” does not naturally carry that measure sense without explanation.
  - severity: medium
    issue: The footnote gives “n’afọ ofufo” as an alternative.
    rationale: “N’afọ ofufo” means willingly/voluntarily and is not a sound lexical equivalent for εὐλογίαις here. It risks importing the distinct idea expressed in the next verse.
  - severity: low
    issue: The footnote anchor follows “n’ụzọ dị nta” rather than the expression it explains.
    rationale: The note addresses ἐπ’ εὐλογίαις, so its marker should be attached to “n’ụba.”
