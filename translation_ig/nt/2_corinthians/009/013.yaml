    reason: lexical_alternative
  revision_rationale: The revision clarifies the opening genitive expression, retains the source term “nkwupụta” rather than adding “faith,” and corrects the directional sense of εἰς in the final phrase. It keeps the Greek construction’s compactness and avoids deciding more precisely than the text does how submission and confession are related.
