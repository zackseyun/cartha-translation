review_pass:
  verdict: revise
  source_fidelity: The draft broadly conveys the verse, including glorifying God, submission/profession in relation to the gospel, and generous material sharing. However, “n’etiti ha” means ‘among them’ and does not represent the repeated directional εἰς (‘toward/to them ... to all’). The main wording also expands ὁμολογία (‘confession/profession’) to ‘confession of your faith’; this is plausible in context but should not replace the source term where a direct, natural rendering is available.
  naturalness: “Ihe akaebe ọrụ enyemaka a na-enye” is syntactically compressed and awkward in Standard Igbo. “Ihe akaebe sitere n’ọrụ enyemaka a” is clearer. The revision also uses “nye ha na mmadụ niile” for the intended recipients of the generous sharing.
  terminology: “Mesaya” appropriately renders Χριστός as a title, and “ọrụ enyemaka,” “nrubeisi,” and “mmesapụ aka” fit the charitable-collection context. “Nkwupụta” retains the sense of ὁμολογία without unnecessarily specifying ‘faith.’
  issues:
  - severity: medium
    issue: The rendering “n’etiti ha na mmadụ niile” for εἰς αὐτοὺς καὶ εἰς πάντας is inaccurate.
    rationale: “N’etiti” means ‘among,’ whereas the Greek repeated εἰς identifies those toward whom the generosity/sharing is directed. “Nye ha na mmadụ niile” preserves this direction naturally.
  - severity: low
    issue: “Ihe akaebe ọrụ enyemaka a na-enye” is awkward and unclear as a genitive construction.
    rationale: The Greek means the proof/evidence associated with or arising through this service. “Ihe akaebe sitere n’ọrụ enyemaka a” is idiomatic and preserves that relationship.
  - severity: low
    issue: “Okwukwe unu” adds a concept not explicitly present in ὁμολογία.
    rationale: The confession is certainly gospel-related, but “nkwupụta unu” directly represents the Greek and leaves the precise force of the compact construction open.
  revised_text: N’ihi ihe akaebe sitere n’ọrụ enyemaka a, ha na-enye Chineke otuto maka nrubeisi unu n’ihe gbasara nkwupụta unu n’ozi ọma nke Mesaya ahụ,[a] nakwa maka mmesapụ aka unu n’ịkekọrịta ihe unu nwere nye ha na mmadụ niile.[b]
  revised_footnotes:
