revisions:
- from: N’ihi ihe akaebe ọrụ enyemaka a na-enye, ha na-enye Chineke otuto maka nrubeisi unu na-egosi mgbe unu na-ekwupụta okwukwe unu n’ozi ọma nke Mesaya ahụ,[a] nakwa maka mmesapụ aka unu n’ịkekọrịta ihe unu nwere n’etiti ha na mmadụ niile.[b]
  to: N’ihi ihe akaebe sitere n’ọrụ enyemaka a, ha na-enye Chineke otuto maka nrubeisi unu n’ihe gbasara nkwupụta unu n’ozi ọma nke Mesaya ahụ,[a] nakwa maka mmesapụ aka unu n’ịkekọrịta ihe unu nwere nye ha na mmadụ niile.[b]
  rationale: The revision clarifies the opening genitive expression, retains the source term “nkwupụta” rather than adding “faith,” and corrects the directional sense of εἰς in the final phrase. It keeps the Greek construction’s compactness and avoids deciding more precisely than the text does how submission and confession are related.
  reviewer_model: gpt-5.6-terra
