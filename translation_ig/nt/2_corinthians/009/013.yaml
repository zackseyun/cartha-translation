id: 2CO.9.13
reference: 2 Corinthians 9:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: ig
  text: N’ihi ihe akaebe sitere n’ọrụ enyemaka a, ha na-enye Chineke otuto maka nrubeisi unu n’ihe gbasara nkwupụta unu n’ozi ọma nke Mesaya ahụ,[a] nakwa maka mmesapụ aka unu n’ịkekọrịta ihe unu nwere nye ha na mmadụ niile.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ozi ọma nke Kraịst.” Okwu Grik bụ Χριστός bụ aha ọkwá nke pụtara “Onye e tere mmanụ,” ya bụ, Mesaya.
    reason: alternative_reading
  - marker: b
    text: “Ịkekọrịta ihe” n’ebe a yikarịrị ka ọ na-ekwu kpọmkwem banyere isonye n’onyinye enyemaka site n’imesapụ aka, ọ bụghị naanị mkpakọrịta n’ozuzu ya. A pụkwara ịsụgharị akụkụ bu ya ụzọ n’ụzọ kpọmkwem karị, “nrubeisi nke nkwupụta unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμῆς τῆς διακονίας ταύτης
  choice: ihe akaebe ọrụ enyemaka a na-enye
  rationale: “Ihe akaebe” na-egosipụta ihe pụtara ìhè mgbe a nwalere ihe, ebe “ọrụ enyemaka” na-eme ka o doo anya na okwu a bụ maka ọrụ ebere a haziri maka ndị nsọ.
- source_word: δοξάζοντες τὸν θεὸν
  choice: ha na-enye Chineke otuto
  rationale: E tinyere onye na-eme ihe ahụ n’ụzọ doro anya n’Igbo, ma “inye Chineke otuto” na-eburu ịdị arọ nke δοξάζω.
- source_word: ὑποταγῇ τῆς ὁμολογίας ὑμῶν
  choice: nrubeisi unu na-egosi mgbe unu na-ekwupụta okwukwe unu
  rationale: Nke a bụ Igbo e ji ekwu okwu nke ọma ma na-ejikọta nrubeisi ahụ na nkwupụta okwukwe ha, n’emeghị ka “nkwupụta” n’onwe ya bụrụ onye na-erube isi.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: n’ozi ọma nke Mesaya ahụ
  rationale: “N’ozi ọma” na-egosi ebe nrubeisi na nkwupụta ha na-elekwasị anya. A sụgharịrị Χριστός dị ka aha ọkwá “Mesaya,” ọ bụghị dị ka aha mmadụ nkịtị.
- source_word: ἁπλότητι τῆς κοινωνίας
  choice: mmesapụ aka unu n’ịkekọrịta ihe unu nwere
  rationale: N’ọnọdụ onyinye a, ἁπλότης pụtara mmesapụ aka, κοινωνία pedigakwa ikere òkè n’ụzọ a na-ahụ anya site n’inye ihe.
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: n’etiti ha na mmadụ niile
  rationale: Nke a na-egosi ndị onyinye na mmesapụ aka ahụ ruru, n’Igbo dị mfe nghọta.
theological_decisions:
- issue: Otu e si sụgharịa Χριστοῦ
  choice: nke Mesaya ahụ
  alternative: nke Kraịst
  rationale: Χριστός bụ aha ọkwá pụtara onye e tere mmanụ; “Mesaya” na-echekwa ike aha ọkwá ahụ n’enweghị itinye nkọwa ụka pụrụ iche.
- issue: Mmekọrịta dị n’etiti ὑποταγή na ὁμολογία
  choice: nrubeisi unu na-egosi mgbe unu na-ekwupụta okwukwe unu
  alternative: nrubeisi nke nkwupụta unu
  rationale: Usoro okwu Grik nwere ike ịdị nkenke ma nwee mgbagwoju anya. Nsụgharị bụ isi na-enye nghọta na nrubeisi ha pụtara ìhè na nkwupụta ha, ebe ndetu na-echekwa usoro okwu ahụ ka ukwuu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ọrụ enyemaka” na “ịkekọrịta ihe unu nwere” na-eme ka ọnọdụ onyinye ebere pụta ìhè, ebe ndetu na-echekwa ụzọ nsụgharị ndị ka nso n’usoro Grik.
