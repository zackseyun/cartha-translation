reference: 2 Corinthians 9:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: ig
  text: N’ihi na ọrụ ije ozi nke ọrụ a abụghị naanị na-egbo ụkọ ndị nsọ[a], kama ọ na-aba ụbakwa site n’ọtụtụ ekele a na-enye Chineke[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-emeju ihe ndị nsọ na-enweghị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ na-ebutekwa ọtụtụ ekele a na-enye Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-ebute nkọwa nke okwu bu ụzọ; “N’ihi na” na-egosipụta njikọ nkọwa ahụ n’Igbo nkịtị.
- source_word: ἡ διακονία τῆς λειτουργίας ταύτης
  choice: ozi nke ọrụ a
  rationale: “Ozi” na “ọrụ” na-edobe ọdịiche dị n’etiti διακονία na λειτουργία, ma na-ada nke ọma n’Igbo.
- source_word: προσαναπληροῦσα τὰ ὑστερήματα
  choice: imeju ihe ... na-enweghị
  rationale: Nke a na-egosipụta echiche nke imeju ụkọ, kama ime ka okwu ahụ bụrụ naanị mkpa n’ụzọ sara mbara.
- source_word: τῶν ἁγίων
  choice: ndị nsọ
  rationale: Nke a na-edobe okwu Pọl ji akpọ ndị kwere ekwe, n’enweghị itinye echiche nke ndị e mechara kpọọ ndị nsọ pụrụ iche.
- source_word: περισσεύουσα
  choice: ọ na-ejukwa eju
  rationale: Nkebiokwu a na-egosipụta ụba karịrị oke ma na-echekwa onyonyo nke ihe na-ejupụta.
- source_word: διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ
  choice: site n’ọtụtụ ekele a na-enye Chineke
  rationale: “Site na” na-echekwa ike nke διά, ebe mgbakwunye “a na-enye” na-eme ka Chineke bụrụ onye ekele ahụ na-erute n’ụzọ doro anya.
theological_decisions:
- issue: Okwu Pọl bụ ἅγιοι
  choice: ndị nsọ
  alternative: ndị Chineke; ndị e doro nsọ
  rationale: “Ndị nsọ” bụ okwu dị mkpirikpi, a maara nke ọma, ma na-edobe aha Pọl nyere ndị kwere ekwe n’ozuzu ha n’enweghị ịkọwa ya gabiga ihe odide ahụ.
- issue: Mmekọrịta διὰ πολλῶν εὐχαριστιῶν na περισσεύουσα
  choice: ọ na-ejukwa eju site n’ọtụtụ ekele a na-enye Chineke
  alternative: ọ na-ebutekwa ọtụtụ ekele a na-enye Chineke
  rationale: Nhọrọ bụ isi na-echekwa okwu “ịba ụba/ijupụta” na διά nke Greek; nhọrọ ọzọ na-eme ka echiche nke nsonaazụ pụta ìhè karịa, ma ọ bụ nkọwa karịa.
translation_notes:
  register: Asụsụ Igbo zuru oke, nke ugwu ma dị mfe nghọta. E debere ahịrịokwu ahụ ka ọ gaa n’ihu n’amaokwu na-esote site n’akara ogologo dị n’isi njedebe. Akara ntụaka [a] na [b] pụtara n’ederede isi.
