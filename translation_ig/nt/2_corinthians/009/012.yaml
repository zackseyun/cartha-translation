    text: Ma ọ bụ, “na-emeju ihe ndị nsọ na-enweghị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ na-ebutekwa ọtụtụ ekele a na-enye Chineke.”
    reason: lexical_alternative
