source:
  edition: SBLGNT
  text: Καὶ ταύτῃ τῇ πεποιθήσει ἐβουλόμην ⸂πρότερον πρὸς ὑμᾶς ἐλθεῖν⸃, ἵνα δευτέραν ⸀χάριν ⸀σχῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/015.yaml
  text: And with this confidence I intended to come to you first[a], so that you might have a second benefit[b],
translation:
  language: ig
  text: Site n’ntụkwasị obi a, eburu m n’obi ibu ụzọ[a] bịakwute unu, ka unu wee nweta uru nke abụọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “bịakwute unu tupu mgbe ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “amara nke abụọ” ma ọ bụ “ihu ọma nke abụọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθήσει
  choice: ntụkwasị obi
  rationale: Okwu a na-egosi obi siri ike ma ọ bụ nkwenye mmadụ nwere; “ntụkwasị obi” bụ okwu Igbo doro anya nke dabara n’ihe Pọl kwuru mere o ji nwee atụmatụ ahụ.
- source_word: ἐβουλόμην
  choice: e bu m n’obi
  rationale: Nkebiokwu a na-egosi ọchịchọ ma ọ bụ ebumnuche, n’emeghị ka ọ dị ka atụmatụ e kpebisiri ike nke a na-apụghị ịgbanwe.
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: ibu ụzọ bịakwute unu
  rationale: “Ibu ụzọ” na-egosi na ọbịbịa a ga-abụ nke mbụ n’usoro njem Pọl; ọ dabara n’ihe amaokwu na-esonụ kọwara.
- source_word: δευτέραν χάριν
  choice: uru nke abụọ
  rationale: N’ọnọdụ a, χάρις na-ezo aka n’ihe ọma ma ọ bụ uru ndị Kọrịnt ga-enweta site na nleta Pọl. “Uru” na-eme ka echiche ahụ doo onye Igbo nke oge a anya, ebe ndetu ala na-echekwa nhọrọ “amara” na “ihu ọma.”
- source_word: σχῆτε
  choice: unu wee nweta
  rationale: Ọ bụ ezie na ἔχω pụtara “inwe,” n’ebe a “inweta” na-egosipụta nke ọma na ha ga-anata uru ahụ site na nleta ahụ.
theological_decisions:
- issue: Ihe χάρις pụtara n’ebe a
  choice: uru
  alternative: amara; ihu ọma
  rationale: Ọnọdụ njem a na-akwado echiche nke ihe ọma ndị ga-erite site na nleta Pọl, kama ime ka okwu ahụ bụrụ naanị “amara” n’echiche nzọpụta. Ma ndetu ala na-echekwa obosara okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “E bu m n’obi” bụ ụzọ e si ekwu ebumnuche n’ụzọ ebumpụta ụwa; “uru nke abụọ” na-edebe aha nọ na Grik kama ịgbanwe ya ka ọ bụrụ naanị omume.
