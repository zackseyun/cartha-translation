id: 2CO.1.4
reference: 2 Corinthians 1:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ παρακαλῶν ἡμᾶς ἐπὶ πάσῃ τῇ θλίψει ἡμῶν, εἰς τὸ δύνασθαι ἡμᾶς παρακαλεῖν τοὺς ἐν πάσῃ θλίψει διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: ig
  text: onye na-akasi anyị obi n’ime mkpagbu anyị niile, ka anyị nwee ike ịkasi ndị nọ ná mkpagbu ọ bụla obi site ná nkasi obi ahụ Chineke ji akasi anyị onwe anyị obi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “onye na-agba anyị ume ... agbamume”; n’amaokwu a niile, Grik ji okwu ndị sitere n’otu ezinụlọ okwu mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶν / παρακαλεῖν / παρακλήσεως / παρακαλούμεθα
  choice: na-akasi ... obi / ịkasi ... obi / nkasi obi / ji akasi ... obi
  rationale: E ji otu ezinụlọ okwu Igbo mee ka nkwughachi nke otu ezinụlọ okwu Grik pụta ìhè. N’ọnọdụ mkpagbu a, “ịkasi obi” na-egosi nkasi na ume a na-enye onye na-ata ahụhụ, ọ bụghị naanị ime ka mmetụta ya dị jụụ.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: n’ime mkpagbu anyị niile
  rationale: “Mkpagbu” na-eburu echiche θλῖψις nke nhụjuanya, nrụgide, na ahụhụ dị arọ; “n’ime” bụ ụzọ Igbo si ekwu ọnọdụ a n'ụzọ ebumpụta ụwa.
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: ka anyị nwee ike
  rationale: Nke a na-edobe echiche ebumnuche ma ọ bụ ihe si na ya pụta, ma na-asụkwa Igbo nke ọma.
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: ndị nọ ná mkpagbu ọ bụla
  rationale: '“Ọ bụla” na-egosi obosara nkebiokwu ahụ: ndị nọ n’ụdị mkpagbu ọ bụla.'
- source_word: αὐτοὶ
  choice: anyị onwe anyị
  rationale: Nke a na-echekwa nkwusi ike nke nnọchiaha Grik.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: Chineke ji ...
  rationale: Nrụgharị a na-egosi Chineke dị ka onye na-eme ihe ahụ n'ụzọ doro anya ma bụrụkwa Igbo ebumpụta ụwa.
theological_decisions:
- issue: Mpaghara nghọta παρακαλέω / παράκλησις
  choice: ịkasi obi / nkasi obi
  alternative: ịgba ume / agbamume
  rationale: Ebe amaokwu ahụ na-ekwu banyere θλῖψις, echiche nke nkasi na ume n’etiti ahụhụ bụ nke kacha pụta ìhè. Agbanyeghị, okwu Grik ahụ nwekwara ike ịpụta ịgba ume; a na-edebe nke a na nkọwa ala peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe, nke ugwu na nke dị mfe nghọta. E debere nkwughachi okwu nke Grik, tinyere nkwusi ike dị na “anyị onwe anyị,” n’enweghị itinye nkọwa ụka pụrụ iche.
