  source_fidelity: 'Ntụgharị ahụ na-esochi Grik nke ọma: ọ na-edobe onye na-arụ ọrụ ahụ, mkpagbu niile, ebumnuche dị na «ka anyị nwee ike», obosara «ndị nọ ná mkpagbu ọ bụla», na ụzọ nkasi obi Chineke ji akasi ndị na-ekwu okwu obi. «anyị onwe anyị» na-edobe nkwusi ike αὐτοὶ, ebe «Chineke ji akasi ... obi» na-egosi onye na-eme ihe dị na ὑπὸ τοῦ θεοῦ n’Igbo ebumpụta ụwa.'
