id: 2CO.1.10
reference: 2 Corinthians 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: ig
  text: Onye napụtara anyị n’ọnwụ dị ukwuu otu a ga-anapụtakwa anyị. Anyị atụkwasịla ya olileanya na ọ ka ga-anapụtakwa anyị,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηλικούτου
  choice: dị egwu nke ukwuu otú a
  rationale: Nkebiokwu a na-egosi otú ọnwụ ahụ ma ọ bụ ihe ize ndụ ahụ siri dị ukwuu. Nsụgharị a na-edobe ike e ji mesie ya ike ma na-ada nke ọma n’Igbo.
- source_word: θανάτου
  choice: ọnwụ
  rationale: Okwu Grik pụtara ‘ọnwụ’ kpọmkwem. E debere ihe oyiyi ahụ n’ahịrị bụ isi, ebe nkọwa ala peeji na-egosi na ọ pụkwara ịpụta ihe ize ndụ nke ga-eweta ọnwụ.
- source_word: ἐρρύσατο
  choice: napụtara
  rationale: Ngwaa a pụtara ịnapụta mmadụ n’ihe ize ndụ. ‘Napụtara’ bụ okwu Igbo doro anya ma kwesịkwa ọnọdụ a.
- source_word: ῥύσεται
  choice: ga-anapụtakwa
  rationale: A na-eji otu mgbọrọgwụ okwu ahụ dị ka n’ἐρρύσατο, ma ọdịdị ọdịnihu ya na-egosi ihe Chineke ka ga-eme. ‘-kwa’ na-egosikwa njikọ ya na nnapụta gara aga.
- source_word: εἰς ὃν
  choice: n’ime ya
  rationale: N’usoro okwu a, preposition ahụ na-egosi onye olileanya ahụ dabeere na ya. ‘N’ime ya’ na-edobe ntụaka nke onye ahụ n’enweghị ịkọwa ya karịa ihe odide Grik.
- source_word: ἠλπίκαμεν
  choice: anyị tinyere olileanya anyị
  rationale: Oge perfect na-egosi mkpebi e mere nke ka na-adịgide. Nkebiokwu Igbo a na-ekwupụta olileanya siri ike nke na-aga n’ihu.
- source_word: καὶ ἔτι
  choice: ọzọ n’ezie
  rationale: Ngwakọta okwu a nwere echiche nke ịga n’ihu nakwa nke imesi obi ike. ‘Ọzọ n’ezie’ na-ebute akụkụ abụọ ahụ n’Igbo.
theological_decisions:
- issue: Ma a ga-asụgharị θανάτου dịka ‘ọnwụ’ kpọmkwem, ka a kọwaa ya dịka ihe ize ndụ nke ọnwụ
  choice: E debere ‘ọnwụ’ n’ahịrị bụ isi.
  alternative: ‘ihe ize ndụ dị otu a nke ga-eweta ọnwụ’
  rationale: Ihe odide Grik kwuru ‘ọnwụ’ kpọmkwem, ya mere idebe ya na-echekwa okwu siri ike Pọl ji mee ihe. Nkọwa ala peeji na-enye echiche okwu ahụ nwere ike ịpụta n’ọnọdụ a n’enweghị iwepụ ihe oyiyi dị n’asụsụ mbụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E jikwa ‘napụtara/ga-anapụtakwa’ mee ka otu mgbọrọgwụ ngwaa Grik pụta ìhè, ma debekwa ntụgharị sitere n’ihe gara aga gaa n’olileanya banyere ọdịnihu.
