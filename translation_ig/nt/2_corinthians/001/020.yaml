reference: 2 Corinthians 1:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅσαι γὰρ ἐπαγγελίαι θεοῦ, ἐν αὐτῷ τὸ Ναί· ⸀διὸ καὶ ⸂δι’ αὐτοῦ⸃ τὸ Ἀμὴν τῷ θεῷ πρὸς δόξαν δι’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: ig
  text: N’ihi na nkwa Chineke niile, n’agbanyeghị ole ha dị, n’ime ya ka “Ee” ahụ dị.[a] Ya mere kwa, ọ bụ site na ya ka anyị ji na-ekwu “Amen” ahụ nye Chineke, ka e wee nye Chineke otuto.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ikwu ya n’ụzọ doro anya karịa dịka, “n’ime ya ka ha nwere ‘Ee’ ha.”
    reason: alternative_reading
  - marker: c
    text: N’ụzọ ọzọ, a pụrụ ịghọta akụkụ ikpeazụ ahụ dịka, “nye Chineke, maka otuto, site n’aka anyị,” nke na-edobe usoro okwu Grik ahụ nso karịa.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσαι
  choice: n’agbanyeghị ole ... dị
  rationale: Na-egosi ọnụ ọgụgụ a na-akọwaghị nke gụnyere nkwa Chineke niile, ma na-ada ka Igbo nkịtị.
- source_word: ἐπαγγελίαι θεοῦ
  choice: nkwa Chineke
  rationale: “Nkwa” bụ okwu Igbo doro anya maka nkwa sitere n’aka Chineke ma ọ bụ nke Chineke kwere.
- source_word: ἐν αὐτῷ τὸ Ναί
  choice: n’ime ya ka “Ee” ahụ dị
  rationale: Na-edobe okwu Pọl n’ụdị ya dị mkpụmkpụ ma sie ike, n’etinyeghị ngwaa dịka “mezuru” nke na-akọwa ihe ederede ahụ karịa otú Grik si kwuo ya.
- source_word: δι’ αὐτοῦ
  choice: site n’aka ya
  rationale: Na-egosi na Kraịst bụ onye e si n’aka ya mee ihe ahụ, dịka διά na genitive si dị.
- source_word: τὸ Ἀμὴν
  choice: “Amen” ahụ
  rationale: A hapụrụ “Amen” dịka okwu ofufe ndị Igbo maara, tinyekwa “ahụ” iji gosipụta article Grik na myirịta ya na “Ee” ahụ.
- source_word: τῷ θεῷ
  choice: ruo Chineke
  rationale: Na-egosi na ọ bụ Chineke ka “Amen” ahụ na-aga ma ọ bụ na-adịrị, n’Igbo na-ada nke ọma.
- source_word: πρὸς δόξαν
  choice: iji nye ya otuto
  rationale: Na-egosi nzube nke otuto n’ụzọ Igbo doro anya; “ya” na-ezo aka na Chineke dịka nghọta kacha kwekọọ n’ahịrịokwu ahụ.
- source_word: δι’ ἡμῶν
  choice: si n’aka anyị
  rationale: Na-edobe echiche na “Amen” ahụ na-esite n’aka ndị ozi ma ọ bụ ndị kwere ekwe, n’etinyeghị okwu nkọwa dịka “ozi anyị.”
theological_decisions:
- issue: Ma a ga-akọwa okwu Pọl dị mkpụmkpụ dịka mmezu nke nkwa niile n’ime Kraịst
  choice: E debere “n’ime ya ka ‘Ee’ ahụ dị.”
  alternative: “N’ime ya ka nkwa ndị ahụ niile mezuru” ma ọ bụ “n’ime ya ka ha nwere ‘Ee’ ha.”
  rationale: Ihe a Pọl kwuru na-egosi mmezu n’ime Kraịst, ma okwu Grik ahụ dị mkpụmkpụ ma nwee ike nkwupụta pụrụ iche. Ịghara itinye “mezuru” na-edobe mgbagwoju na ibu nkà mmụta okpukpe dị n’ederede ahụ.
- issue: Njikọ πρὸς δόξαν na τῷ θεῷ
  choice: A sụgharịrị ya “iji nye ya otuto,” ebe “ya” na-ezo aka na Chineke.
  alternative: “maka otuto, site n’aka anyị,” nke na-ahapụ njikọ okwu ahụ ghe oghe karịa.
  rationale: Nke a bụ Igbo kachasị eke ma na-egosi Chineke dịka onye a na-enye otuto, ma e nyere ụzọ ọzọ na nkọwa ala peeji n’ihi mkpụmkpụ na nhazi okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere “Ee” na “Amen” dịka okwu nkwupụta Pọl mere ka ha bụrụ aha n’ahịrịokwu ahụ. A zere okwu ụka pụrụ iche na nkọwa agbakwunyere dịka “ozi anyị.”
