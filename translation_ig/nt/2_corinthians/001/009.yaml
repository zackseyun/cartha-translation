reference: 2 Corinthians 1:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: ig
  text: N’ezie, anyị onwe anyị enweela ikpe ọnwụ[a] n’ime anyị, ka anyị ghara ịtụkwasị onwe anyị obi, kama ka anyị tụkwasị Chineke obi, onye na-akpọlite ndị nwụrụ anwụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpebi ọnwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: N’ezie
  rationale: N’ebe a, okwu ahụ na-emesi ihe Pọl na-ekwu ike ma na-egosi mgbanwe siri ike site n’ihe bu ụzọ; “N’ezie” na-eme nke a n’Igbo n’enweghị ahịrịokwu siri ike ma ọ bụ nke na-adịghị eke.
- source_word: αὐτοὶ
  choice: anyị onwe anyị
  rationale: Aha nnọchi a nwere nkwusi ike; “anyị onwe anyị” na-echekwa nkwusi ike ahụ nke ọma.
- source_word: ἐν ἑαυτοῖς
  choice: n’ime obi anyị
  rationale: Nke a na-egosi ahụmahụ na nkwenye dị n’ime mmadụ. “N’ime obi anyị” bụ ụzọ Igbo si ekwu ya n’ụzọ doro anya ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: ikpe ọnwụ
  rationale: N’ọnọdụ a, ἀπόκριμα na-ezo aka n’ikpe ma ọ bụ mkpebi siri ike nke ọnwụ. “Ikpe ọnwụ” dị nkenke, doo anya, ma nwee ụda okwu ikpe nke okwu Grik ahụ nwere.
- source_word: ἐσχήκαμεν
  choice: eburuola
  rationale: Ụdị perfect ahụ na-egosi ọnọdụ siri ike sitere n’ihe mere na mbụ. “Eburuola” na-enye echiche nke ịnọ n’okpuru ikpe ahụ ma na-echekwa ịdịgide nke ọnọdụ ahụ.
- source_word: ἵνα μὴ πεποιθότες ὦμεν
  choice: ka anyị ghara ịtụkwasị … obi
  rationale: Nkebi a na-egosi ebumnuche, ebe πεποιθότες na-egosi ntụkwasị obi siri ike. Okwu Igbo a bụ nke eke ma na-echekwa echiche nke ịdabere n’ihe.
- source_word: ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ
  choice: onwe anyị … kama … Chineke
  rationale: Nhazi a na-echekwa ntụnyere siri ike dị n’etiti ịdabere n’onwe anyị na ịdabere na Chineke.
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: onye na-eme ka ndị nwụrụ anwụ si n’ọnwụ bilie
  rationale: Nke a na-akọwa Chineke site n’ike ya ịkpọlite ndị nwụrụ anwụ. Ọ bụ okwu Igbo doro anya nke na-echekwa echiche mbilite n’ọnwụ.
theological_decisions:
- issue: Ma a ga-asụgharị τοὺς νεκρούς dị ka aha ìgwè ma ọ bụ kọwaa ya dị ka ndị mmadụ nwụrụ anwụ
  choice: ndị nwụrụ anwụ
  alternative: ndị mmadụ nwụrụ anwụ
  rationale: “Ndị nwụrụ anwụ” bụ okwu Igbo zuru oke ma bụrụ nke eke; ọ na-echekwa obosara okwu Grik ahụ n’etinyeghị nkọwa ọzọ.
- issue: Ma ἵνα ọ na-egosi ebumnuche ka ọ bụ nanị ihe si na ahụmahụ ahụ pụta
  choice: ka anyị ghara …
  alternative: nke mere na anyị adịghị …
  rationale: A họọrọ nkebi ebumnuche iji chekwaa ἵνα n’enweghị ikpebi karịa ihe ederede kwuru banyere ụzọ ebumnuche ahụ si arụ ọrụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwusi ike dị na “anyị onwe anyị” na ntụnyere dị n’etiti ịtụkwasị onwe mmadụ obi na ịtụkwasị Chineke obi.
