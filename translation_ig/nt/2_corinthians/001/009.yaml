revisions:
- from: N’ezie, anyị onwe anyị eburuola ikpe ọnwụ[a] n’ime obi anyị, ka anyị ghara ịtụkwasị onwe anyị obi, kama ka anyị tụkwasị Chineke obi, onye na-eme ka ndị nwụrụ anwụ si n’ọnwụ bilie.
  to: N’ezie, anyị onwe anyị enweela ikpe ọnwụ[a] n’ime anyị, ka anyị ghara ịtụkwasị onwe anyị obi, kama ka anyị tụkwasị Chineke obi, onye na-akpọlite ndị nwụrụ anwụ.
  rationale: The revision removes the unsupported addition ‘obi,’ replaces ‘eburuola’ with ‘enweela’ to render the Greek perfect of ‘have,’ and uses the direct Igbo expression ‘na-akpọlite ndị nwụrụ anwụ’ for ‘who raises the dead.’ It retains the draft’s emphasis, purpose relation, judicial wording, and lexical-alternative footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:24:41Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the emphatic 'we ourselves,' the purpose clause, and the contrast between reliance on self and God. However, 'n’ime obi anyị' adds 'heart,' which is not present in ἐν ἑαυτοῖς ('in/within ourselves'), and 'eburuola' means 'have carried/borne' rather than 'have had' (ἐσχήκαμεν). The expanded rendering of God's raising the dead is understandable but less direct than the Greek.
  naturalness: The revised wording is natural, contemporary Standard Igbo and maintains a dignified biblical register. 'Enweela ... n’ime anyị' accurately and idiomatically conveys the settled possession/state expressed by the Greek perfect.
  terminology: '''Ikpe ọnwụ'' suitably renders the judicial/decretive sense of τὸ ἀπόκριμα τοῦ θανάτου; the alternative ''mkpebi ọnwụ'' remains appropriate. ''Ịtụkwasị ... obi'' naturally conveys reliance/trust. ''Na-akpọlite ndị nwụrụ anwụ'' is the direct established wording for God''s raising the dead.'
  issues:
  - severity: medium
    issue: ‘n’ime obi anyị’ adds ‘heart.’
    rationale: ἐν ἑαυτοῖς refers to the persons themselves (‘within/in ourselves’), not specifically to their hearts. The added body-part/metaphorical term narrows and interprets the source unnecessarily.
  - severity: medium
    issue: ‘eburuola’ does not render ἐσχήκαμεν accurately.
    rationale: ‘Eburuola’ denotes having borne or carried something. The Greek perfect of ἔχω means ‘we have had’/‘we came to have,’ describing a settled state rather than bearing a burden.
  - severity: low
    issue: ‘na-eme ka ... si n’ọnwụ bilie’ is more expansive than the source.
    rationale: The Greek simply identifies God as ‘the one raising the dead.’ ‘Na-akpọlite ndị nwụrụ anwụ’ is more direct and does not add the explicit phrase ‘from death.’
  revised_text: N’ezie, anyị onwe anyị enweela ikpe ọnwụ[a] n’ime anyị, ka anyị ghara ịtụkwasị onwe anyị obi, kama ka anyị tụkwasị Chineke obi, onye na-akpọlite ndị nwụrụ anwụ.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpebi ọnwụ.”
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported addition ‘obi,’ replaces ‘eburuola’ with ‘enweela’ to render the Greek perfect of ‘have,’ and uses the direct Igbo expression ‘na-akpọlite ndị nwụrụ anwụ’ for ‘who raises the dead.’ It retains the draft’s emphasis, purpose relation, judicial wording, and lexical-alternative footnote.
