id: 2CO.1.1
reference: 2 Corinthians 1:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: ig
  text: 'Pọl, onyeozi nke Mesaịa Jizọs[a] site n’uche Chineke, na Timoti nwanne anyị[b], na-edegara ụka Chineke dị na Kọrịnt, tinyere ndị nsọ niile nọ n’Akaya dum:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst Jizọs.”
    reason: alternative_reading
  - marker: b
    text: N’okwu Grik kpọmkwem, “Timoti, nwanne ahụ.”
    reason: source_form
lexical_decisions:
- source_word: ἀπόστολος
  choice: onyeozi
  rationale: “Onyeozi” bụ okwu Igbo a nabatara nke ọma maka onye e zigara ma nye ikike pụrụ iche; ọ dabara n’ọrụ Pọl na-akọwa n’ebe a.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: N’usoro Χριστοῦ Ἰησοῦ, okwu ahụ ka nwere ike aha-ọkwa ya, ya bụ Onye E Tere Mmanụ; “Mesaịa” na-eme ka nke ahụ pụta ìhè. E debere “Kraịst” dị ka ụzọ ọzọ na nkọwa ala peeji.
- source_word: διὰ θελήματος θεοῦ
  choice: site n’uche Chineke
  rationale: Nke a na-egosipụta na ọ bụ uche Chineke mere Pọl ji bụrụ onyeozi, ma na-ada ka Igbo nkịtị ma dị ùgwù.
- source_word: ὁ ἀδελφὸς
  choice: nwanne anyị
  rationale: Grik kwuru n’ụzọ nkịtị “nwanne ahụ,” ma n’okwu ekele a, “nwanne anyị” na-egosipụta mmekọrịta ọgbakọ ahụ nke ọma ma na-ada ka Igbo ekeghị eke. A kọwara ụdị okwu Grik kpọmkwem na nkọwa ala peeji.
- source_word: ἐκκλησίᾳ
  choice: ụka
  rationale: “Ụka” bụ okwu Igbo nke ndị mmadụ na-aghọta ngwa ngwa maka ọgbakọ ndị kwere ekwe n’usoro adreesị akwụkwọ ozi a.
- source_word: ἁγίοις
  choice: ndị nsọ
  rationale: “Ndị nsọ” bụ nsụgharị dị nkenke ma guzosie ike maka ndị Chineke doro nsọ; ọ naghị egosi naanị mmadụ ole na ole e nyere aha nsọ.
- source_word: σὺν
  choice: ya na
  rationale: “Ya na” na-egosipụta nke ọma na ndị nsọ niile nọ n’Akaya sokwa ná ndị a na-edegara akwụkwọ ozi ahụ.
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: nọ n’Akaya dum
  rationale: Nke a na-echekwa oke mpaghara ahụ nke Grik kwuru, ma na-ada n’ụzọ ebumpụta ụwa n’Igbo.
theological_decisions:
- issue: Nsụgharị Χριστός n’aha-ọkwa mmeghe Pọl
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: “Mesaịa” na-eme ka echiche aha-ọkwa nke Onye E Tere Mmanụ pụta ìhè n’ebe a, ebe “Kraịst” bụkwa nsụgharị ọdịnala ziri ezi; ya mere e debere ya na nkọwa ala peeji kama ikpochapụ nhọrọ ahụ.
- issue: Ndị a kpọrọ ἅγιοι
  choice: ndị nsọ
  alternative: ndị e doro nsọ
  rationale: “Ndị nsọ” na-echekwa aha Pọl ji akpọ ndị Chineke niile, na-enweghị ime ka ọ bụrụ naanị ndị a ma ama n’ihi ịdị nsọ pụrụ iche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E tinyere “na-edegara” iji mee ka onye a na-ezigara akwụkwọ ozi doo anya n’Igbo, ebe Grik ji naanị ọnọdụ dative. E debere usoro ogologo nke ekele akwụkwọ ozi ahụ na akara kọlụm n’ikpeazụ n’ihi na amaokwu na-esote ka ga-emecha ekele ahụ.
