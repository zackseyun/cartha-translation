revisions:
- from: 'Pọl, onyeozi nke Mesaịa Jizọs[a] site n’uche Chineke, na Timoti nwanne anyị[b], na-edegara ụka Chineke dị na Kọrịnt, ya na ndị nsọ niile nọ n’Akaya dum:'
  to: 'Pọl, onyeozi nke Mesaịa Jizọs[a] site n’uche Chineke, na Timoti nwanne anyị[b], na-edegara ụka Chineke dị na Kọrịnt, tinyere ndị nsọ niile nọ n’Akaya dum:'
  rationale: Only the connective introducing the saints is revised, from “ya na” to “tinyere,” to make the shared addressee relationship explicit in natural Standard Igbo. The wording otherwise accurately reflects the Greek and retains the supplied contextual possessive for Timothy with a source-form footnote. Footnote markers are attached to the relevant expressions and the English audit trail's misplaced b-marker does not govern the Igbo anchor.
