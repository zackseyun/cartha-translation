id: 2CO.1.17
reference: 2 Corinthians 1:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο οὖν ⸀βουλόμενος μήτι ἄρα τῇ ἐλαφρίᾳ ἐχρησάμην; ἢ ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι, ἵνα ᾖ παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: ig
  text: Ya mere, mgbe m bu n’obi ime nke a, ọ̀ bụ n’obi na-adịghị eguzosi ike ka m mere atụmatụ ahụ[a]? Ka ọ bụ na, mgbe m na-eme atụmatụ, ọ̀ bụ dịka anụ ahụ si dị ka m na-eme ya[b], ka ma “Ee, ee” ma “Mba, mba” dị n’ebe m nọ[c][d]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ̀ bụ n’enweghị nkwụsi ike ka m mere atụmatụ ahụ?”
    reason: lexical_alternative
  - marker: b
    text: “Dị ka anụ ahụ si dị” pụrụ ịpụta ime ihe naanị dịka echiche mmadụ nkịtị ma ọ bụ ụkpụrụ ụwa si dị.
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, a na-ebo Pọl ebubo na okwu ya anaghị eguzosi ike, dịka onye pụrụ ikwu ma “Ee” ma “Mba.”
    reason: cultural_note
  - marker: d
    text: Ma ọ bụ, “ka m bụrụ onye na-ekwu ‘Ee, ee’ na ‘Mba, mba’?”
    reason: previous_rendering
lexical_decisions:
- source_word: βουλόμενος
  choice: mgbe m bu n’obi
  rationale: Nke a na-egosi ebumnobi Pọl gara aga banyere njem ya, n’asụsụ Igbo dị mfe ma doo anya.
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: è mere m ya n’obi na-adịghị eguzosi ike
  rationale: Akpaokwu a na-egosi omume onye na-agbanwe obi ngwa ngwa ma ọ bụ onye na-ejighị mkpebi ya kpọrọ ihe; ntụgharị a na-edebe ajụjụ nkwugharị ahụ.
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: m̀ na-eme atụmatụ m
  rationale: Ọ na-egosi ihe Pọl na-atụpụta ime. Igbo eke anaghị achọ ka e megharịa ngwaa ahụ kpọmkwem dịka Grik, ma okwu “atụmatụ m” ka na-eburu echiche ya.
- source_word: κατὰ σάρκα
  choice: dị ka anụ ahụ si dị
  rationale: A hapụrụ okwu Pọl banyere “anụ ahụ” n’ederede isi ka a ghara imechi ihe ọ pụrụ ịpụta n’otu nkọwa naanị.
- source_word: παρ’ ἐμοὶ
  choice: n’ebe m nọ
  rationale: Nke a na-egosi ihe a pụrụ ịhụ n’omume ma ọ bụ okwu Pọl.
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: “Ee, ee” na “Mba, mba”
  rationale: E debere nkwughachi ndị dị na Grik, nke na-eme ka ebubo banyere enweghị mkpebi kwụsie ike pụta ìhè.
theological_decisions:
- issue: Ihe κατὰ σάρκα pụtara n’akpaokwu Pọl
  choice: dị ka anụ ahụ si dị
  alternative: dị ka echiche mmadụ nkịtị ma ọ bụ usoro ụwa si dị
  rationale: Ichekwa “anụ ahụ” na-edebe ụtọ okwu nkà mmụta okpukpe Pọl ma na-ahapụ ohere maka ihe okwu ahụ pụtara n’ọnọdụ a, ebe nkọwa ala peeji na-enyere onye na-agụ aka.
- issue: Mmekọrịta “Ee” na “Mba”
  choice: “Ee, ee” na “Mba, mba” wee dịrị n’otu oge
  alternative: “Ee, ee” na “Mba, mba” wee dịrị n’ebe m nọ
  rationale: “N’otu oge” na-eme ka ebubo banyere ikwu okwu abụọ na-emegiderịta onwe ha doo anya, ma a kọwara na nke a bụ nkọwa nke ihe e kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. E jiri akara ụda naanị n’ebe ha na-enyere aka ịmata ajụjụ; e zere okwu ụka pụrụ iche na nkọwa na-akwado otu òtù okpukpe.
