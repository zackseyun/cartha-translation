revisions:
- from: N’ihi na anyị adịghị edetara unu ihe ọ bụla ọzọ ma e wezụga ihe unu na-agụ, nke unu na-aghọtakwa n’ezie; ana m atụkwa anya na unu ga-aghọta ya ruo ọgwụgwụ[a],
