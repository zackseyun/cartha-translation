id: 2CO.1.13
reference: 2 Corinthians 1:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ ἃ ἀναγινώσκετε ἢ καὶ ἐπιγινώσκετε, ἐλπίζω δὲ ⸀ὅτι ἕως τέλους ἐπιγνώσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/013.yaml
  text: For we are not writing anything else to you except what you read and indeed understand[a], and I hope that you will understand fully to the end,
translation:
  language: ig
  text: N’ihi na anyị anaghị edetara unu ihe ọ bụla ọzọ ma e wezụga ihe unu na-agụ, nke unu na-aghọtakwa; ana m atụkwa anya na unu ga-aghọta ya ruo ọgwụgwụ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu ga-aghọta ya n’ụzọ zuru ezu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: ihe ọ bụla ọzọ
  rationale: N’okwu a e jụrụ ajụ, ‘ihe ọ bụla ọzọ’ na-egosipụta nke ọma na Pọl anaghị edere ha ozi ọzọ zoro ezo ma ọ bụ nke dị iche.
- source_word: ἀναγινώσκετε
  choice: unu na-agụ
  rationale: Nke a na-enye ihe okwu Grik pụtara ozugbo ma na-adabara akwụkwọ ozi a na-agụrụ ndị natara ya.
- source_word: ἐπιγινώσκετε
  choice: unu na-aghọtakwa n’ezie
  rationale: N’ebe a, okwu ahụ karịrị nanị ịmata ihe; ọ na-ekwu banyere ịghọta ihe ha na-agụ. ‘N’ezie’ na-egosipụta ike καί n’enweghị ime ka ọ pụta na ha ghọtara ya n’ụzọ zuru oke.
- source_word: ἐπιγνώσεσθε
  choice: unu ga-aghọta ya
  rationale: Oge ọdịnihu a na-egosi olileanya Pọl na nghọta ha ga-aga n’ihu; ‘ya’ na-ezo aka n’ihe ha na-agụ n’akwụkwọ ozi ahụ.
- source_word: ἕως τέλους
  choice: ruo ọgwụgwụ
  rationale: Nke a na-edobe n'ụzọ doro anya ihe okwu Grik kwuru, bụ́ nke nwere ike ịpụta ịnọgide ruo ọgwụgwụ ma ọ bụ ịghọta n’ụzọ zuru ezu. A hapụrụ nkọwa nke izu oke n’akwụkwọ nkọwa ala peeji.
- source_word: οὐ γὰρ ... ἀλλ’ ἢ
  choice: N’ihi na ... adịghị ... ihe ọ bụla ọzọ ma e wezụga
  rationale: Nhazi a na-edobe ma ihe kpatara okwu ahụ (‘N’ihi na’) ma nkwupụta na ọ dịghị ozi ọzọ dị iche n’ihe ha na-agụ.
theological_decisions:
- issue: Ma ἕως τέλους na-ekwu banyere oge (‘ruo ọgwụgwụ’) ka ọ̀ na-ekwu banyere izu oke nke nghọta (‘n’ụzọ zuru ezu’).
  choice: E tinyere ‘ruo ọgwụgwụ’ n’ahụ amaokwu.
  alternative: ‘n’ụzọ zuru ezu’
  rationale: ‘Ruo ọgwụgwụ’ bụ nsụgharị kpọmkwem ma na-edobe ike okwu gbasara oge; akwụkwọ nkọwa ahụ na-echekwa nkọwa ọzọ nke izu oke n’ebughị ụzọ kpebie esemokwu ahụ n’ahụ amaokwu.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke nwere nkwanye ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ na-egosi ọdịiche dị n’etiti ịgụ ihe na ịghọta ya, ma na-ejigide kọma ikpeazụ n’ihi na echiche ahụ na-aga n’ihu n’amaokwu na-esote.
