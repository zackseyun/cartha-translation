  text: καὶ δι’ ὑμῶν διελθεῖν εἰς Μακεδονίαν, καὶ πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι εἰς τὴν Ἰουδαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: ig
  text: ka m site n’ebe unu nọ gafee gaa Masedonia, sitekwa na Masedonia bịakwute unu ọzọ, ka unu wee ziga m n’ụzọ m gaa Judia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka unu wee nyere m aka n’ụzọ m gaa Judia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: n’ebe unu nọ gafee
  rationale: Nke a na-egosi na Pọl zubere isi n’ebe ndị Kọrịnt nọ gafee n’ụzọ njem ya, kama ịpụta nanị na ọ bụ site n’enyemaka ha.
- source_word: διελθεῖν εἰς Μακεδονίαν
  choice: gafee banye na Masedonia
  rationale: “Gafee” na-edobe echiche nke ịgafe n’ụzọ, ebe “banye na” na-egosipụta mmegharị εἰς n’ebe Masedonia dị.
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: sikwa na Masedonia bịakwute unu ọzọ
  rationale: Nke a na-edobe mmalite njem ahụ, ntụgharị ọ na-alọghachi n’ebe ha nọ, na πάλιν dị ka “ọzọ,” n’etinyeghị okwu “lọta” nke Grik ekwughị kpọmkwem.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι
  choice: ka unu wee nyere m aka ịga n’ihu
  rationale: N’ọnọdụ njem, προπέμπω na-egosikarị inyere onye njem aka ka ọ gaa n’ihu, nke pụrụ ịgụnye iziga ya, iso ya ntakịrị ụzọ, ma ọ bụ inye ya ihe ọ ga-eji mee njem. Nsụgharị a bụ asụsụ Igbo dị eke ma na-edobe ndị Kọrịnt dị ka ndị na-eme ihe ahụ.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: ruo Judia
  rationale: “Ruo Judia” na-egosipụta ebe njem ahụ na-aga n’ụzọ Igbo dị eke.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji “nyere m aka ịga n’ihu” mee ka ọrụ προπέμπω n’ihe gbasara njem doo anya, ebe a debere ntụgharị nke dị nso n’usoro okwu Grik n’ala peeji.
