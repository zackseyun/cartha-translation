source:
  edition: SBLGNT
  text: Ἐγὼ δὲ μάρτυρα τὸν θεὸν ἐπικαλοῦμαι ἐπὶ τὴν ἐμὴν ψυχήν, ὅτι φειδόμενος ὑμῶν οὐκέτι ἦλθον εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: ig
  text: 'Ma mụ onwe m na-akpọ Chineke ka ọ gbaa akaebe megide m: ọ bụ iji ghara imesi unu ike ka abịaghị m ọzọ na Kọrịnt.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’elu mkpụrụ obi m”; ọ pụkwara ịpụta, “megide onwe m” ma ọ bụ “megide ndụ m.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “abịaghịkwa m ọzọ na Kọrịnt.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: Ma mụ onwe m
  rationale: “Ma” na-egosi obere ntụgharị δέ na-eweta, ebe “mụ onwe m” na-echekwa nkwusiri ike dị n’ἐγώ.
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: na-akpọ Chineke ka ọ bụrụ onye akaebe
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị nsọ e si kwuo ịkpọku Chineke ka ọ gbaa akaebe na ihe mmadụ kwuru bụ eziokwu.
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: megide ndụ m
  rationale: Ọ na-egosi na Pọl tinyere onwe ya, ọbụna ndụ ya, n’okpuru ikpe Chineke ma ọ bụrụ na ihe ọ na-ekwu abụghị eziokwu; ndetu ala na-echekwa nsụgharị nkịtị na nghọta ọzọ.
- source_word: ὅτι
  choice: ':'
  rationale: Akara ntụpọ abụọ na-ewebata ihe Chineke ga-agba akaebe banyere ya n’ụzọ Igbo na-aga were were, n’enweghị ịtụgharị ya ka ọ bụrụ ahịrịokwu na-enye ihe kpatara ya.
- source_word: φειδόμενος ὑμῶν
  choice: ọ bụ iji chebe unu
  rationale: 'Nke a na-egosi ebumnuche Pọl: ọ kwụsịrị ịbịa ka ọ ghara imesi ha ike ma ọ bụ mee ha ihe mgbu.'
- source_word: οὐκέτι ἦλθον
  choice: ka m na-abịaghị ọzọ
  rationale: “Ọzọ” na-enye nghọta nke nleta ọzọ a tụrụ anya ya, ma ndetu ala na-echekwa nghọta nwere ike ịbụ “abịaghịkwa m ọzọ.”
- source_word: εἰς Κόρινθον
  choice: na Kọrịnt
  rationale: N’Igbo, “ịbịa na” bụ ụzọ nkịtị e si ekwu ịbata n’obodo a na-aga.
theological_decisions:
- issue: Ụdị iyi na ihe ἐπὶ τὴν ἐμὴν ψυχήν pụtara
  choice: “megide ndụ m”
  alternative: “n’elu mkpụrụ obi m” ma ọ bụ “megide onwe m”
  rationale: Nhọrọ a na-echekwa ịdị arọ nke ịkpọ Chineke ka ọ gbaa akaebe na ibu ikpe ga-adakwasị Pọl ma ọ bụrụ na ọ ghaara ụgha, n’ebughị echiche okpukpe pụrụ iche banyere “mkpụrụ obi” bata n’amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E chekwara ụda iyi siri ike nke okwu Grik ahụ, ma e tinyeghị nkọwa ụka ọ bụla n’ime ya.
