    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “abịaghịkwa m ọzọ na Kọrịnt.”
    reason: alternative_reading
  revision_rationale: The revision corrects the verbal aspect in the final clause and recasts the oath formula in idiomatic Standard Igbo. It preserves the Greek’s emphatic “But I,” its solemn invocation of God, Paul’s personal liability in the oath, his motive of sparing the Corinthians, and the sense that he did not return to Corinth. Footnote anchors are retained and ordered to match their occurrence in the revised text.
