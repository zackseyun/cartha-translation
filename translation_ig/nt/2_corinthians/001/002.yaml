id: 2CO.1.2
reference: 2 Corinthians 1:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: ig
  text: Ka amara na udo si n’aka Chineke, Nna anyị, na Onyenwe anyị[b] Jizọs, bụ Mesaịa[a], dịrị unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka ntụgharị ọdịnala si dị, “Jizọs Kraịst.”
    reason: lexical_alternative
  - marker: b
    text: N’ọnọdụ ụfọdụ, a pụkwara ịsụgharị “Onyenwe anyị” dịka “Nna ukwu anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa χάρις; ọ na-echekwa ma ọdịdị ekele Pọl ma ịdị arọ nke echiche ahụ.
- source_word: ὑμῖν
  choice: dịrị unu
  rationale: E tinyere “dịrị unu” n’usoro ọchịchọ ngọzi nke na-ada nke ọma n’Igbo, ebe dativ ὑμῖν na-egosi ndị a na-achọ ka amara na udo ruo.
- source_word: εἰρήνη
  choice: udo
  rationale: “Udo” bụ ntụgharị doro anya nke εἰρήνη ma na-echekwa ụda Akwụkwọ Nsọ na ọdịmma sara mbara okwu ahụ nwere ike ịpụta.
- source_word: ἀπὸ
  choice: si n’aka
  rationale: “Si n’aka” na-egosi isi mmalite n’Igbo n’ụzọ eke, kwekọrọ na ọrụ ἀπό n’ebe a.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Chineke, Nna anyị
  rationale: Nkebi a na-egosi na Chineke bụ Nna anyị; ntụpọ rikoma na-eme ka apposition ahụ doo anya n’Igbo n’etinyeghị echiche ọzọ.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: “Onyenwe anyị” bụ aha nsọpụrụ e ji κύριος mee n’ọtụtụ ọnọdụ Akwụkwọ Nsọ, ma dabara n’ebe a dịka aha e nyere Jizọs.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ Mesaịa
  rationale: “Jizọs” na-asụgharị aha ahụ n’ụdị Igbo a maara nke ọma, ebe “Mesaịa” na-eme ka Χριστός dị ka aha ọrụ nke Onye E Tere Mmanụ pụta ìhè kama ime ka ọ bụrụ naanị aha ọzọ.
theological_decisions:
- issue: Otu e si asụgharị Χριστοῦ n’ekele Pọl
  choice: Mesaịa
  alternative: Kraịst
  rationale: A họọrọ “Mesaịa” iji mee ka ihe aha ọrụ Χριστός pụtara nọgide pụta ìhè, n’agbanyeghị na “Kraịst” bụ ụdị ọdịnala ndị Igbo maara nke ọma.
- issue: Otu e si asụgharị κυρίου mgbe ọ na-ezo aka na Jizọs
  choice: Onyenwe anyị
  alternative: Nna ukwu anyị
  rationale: “Onyenwe anyị” na-echekwa ịdị elu na ụda okpukpe nke κύριος n’ebe a; “Nna ukwu” ga-ekwe omume n’ọnọdụ ụfọdụ ma nwee ike ịdị ka naanị mmekọrịta onye nwe na ohu.
- issue: Isi mmalite nke amara na udo
  choice: si n’aka Chineke, Nna anyị, na Onyenwe anyị Jizọs
  alternative: site n’aka Chineke bụ Nna anyị, sitekwa n’aka Onyenwe anyị Jizọs
  rationale: A hapụrụ otu preposition ahụ ka ọ na-achị isi abụọ ahụ dịka ọ dị n’asụsụ Grik, na-enweghị ikewapụ ma ọ bụ kọwaa mmekọrịta ha karịa ihe ederede kwuru.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E jiri usoro ọchịchọ ngọzi “Ka … dịrị unu” mee ka ekele ahụ daa nke ọma n’Igbo, ebe “si n’aka” ka na-echekwa echiche isi mmalite dị na ἀπό. Akara nkọwa ala ala [a] na [b] niile pụtara n’amaokwu ahụ.
