id: 2CO.1.6
reference: 2 Corinthians 1:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: ig
  text: Ma ọ bụrụ na a na-akpagbu anyị, ọ bụ maka nkasi obi unu[b] na nzọpụta; ma ọ bụrụkwa na a na-akasi anyị obi, ọ bụ maka nkasi obi unu[a], nke na-arụ ọrụ ka unu na-eji ntachi obi na-ata otu ahụhụ ahụ anyị onwe anyị na-atakwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ ihe odide aka ochie hapụrụ okwu ndị a: “ma ọ bụrụkwa na a na-akasi anyị obi, ọ bụ maka nkasi obi unu.”'
    reason: textual_variant
  - marker: b
    text: A pụkwara ịsụgharị “nkasi obi” n’amaokwu a niile dịka “agbamume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  choice: a na-akpagbu anyị
  rationale: Ọ na-egosi na nsogbu na nrụgide na-adakwasị ndị na-ekwu okwu mgbe niile; ‘a na-akpagbu anyị’ bụ okwu Igbo doro anya ma kwekọọ n'ọnọdụ ahụ.
- source_word: παρακλήσεως / παρακαλούμεθα
  choice: nkasi obi / a na-akasi anyị obi
  rationale: N'okwu gbara amaokwu a gburugburu, mkpụrụokwu ndị a gụnyere ma ịkasi onye nwere ahụhụ obi ma inye ya ume; idegharị ha n'otu ụzọ na-echekwa njikọ mkpụrụokwu ahụ.
- source_word: σωτηρίας
  choice: nzọpụta
  rationale: ‘Nzọpụta’ na-echekwa ohere sara mbara nke σωτηρία n'akwụkwọ Pọl, kama ime ka ọ bụrụ naanị ịpụ ná nsogbu dị ugbu a.
- source_word: τῆς ἐνεργουμένης
  choice: nke na-arụ ọrụ
  rationale: Nke a na-egosi nkasi obi ahụ dị irè ma na-arụpụta ihe, ọ bụghị naanị na ọ dị.
- source_word: ἐν ὑπομονῇ
  choice: mgbe unu ji ntachi obi
  rationale: Usoro a bụ Igbo dị mfe ma na-egosi na ịdị irè nke nkasi obi ahụ pụtara ìhè n'ịnọgidesi ike n'okpuru ahụhụ.
- source_word: τῶν αὐτῶν παθημάτων
  choice: ahụhụ ndị ahụ anyị onwe anyị na-atakwa
  rationale: Nke a na-echekwa echiche nke otu ụdị ahụhụ ahụ ndị Kọrịnt na Pọl na-ekekọrịta.
- source_word: ὑπὲρ
  choice: maka
  rationale: ‘Maka’ na-egosi uru ahụ na-erute ndị Kọrịnt n'ụzọ dị nkenke ma bụrụkwa Igbo nkịtị.
theological_decisions:
- issue: Ma σωτηρία ọ pụtara nzọpụta n'ụzọ sara mbara ka ọ bụ naanị ịnapụta n'ahụhụ
  choice: nzọpụta
  alternative: nnapụta
  rationale: Ihe odide ahụ anaghị amachi okwu ahụ naanị n'ịpụ ná nsogbu ozugbo; ‘nzọpụta’ na-ahapụ obosara ahụ n'enweghị ịkọwa ya gabiga ihe e dere.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere nkwughachi nke okwu nkasi obi iji gosipụta njikọ mkpụrụokwu dị na Grik; ‘ji ntachi obi na-ata ahụhụ’ na-eme ka ahịrịokwu ahụ bụrụ nke e ji ọnụ ekwu nke ọma n'Igbo.
