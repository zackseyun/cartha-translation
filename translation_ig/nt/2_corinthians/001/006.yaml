- from: Ma ọ bụrụ na a na-akpagbu anyị[a], ọ bụ maka nkasi obi na nzọpụta unu; ma ọ bụ ọ bụrụ na a na-akasi anyị obi, ọ bụ maka nkasi obi unu[b], nke na-arụ ọrụ mgbe unu ji ntachi obi na-ata ahụhụ ndị ahụ anyị onwe anyị na-atakwa.
  to: Ma ọ bụrụ na a na-akpagbu anyị, ọ bụ maka nkasi obi unu[b] na nzọpụta; ma ọ bụrụkwa na a na-akasi anyị obi, ọ bụ maka nkasi obi unu[a], nke na-arụ ọrụ ka unu na-eji ntachi obi na-ata otu ahụhụ ahụ anyị onwe anyị na-atakwa.
